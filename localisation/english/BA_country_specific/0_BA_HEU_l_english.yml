l_english:
 landmark_HEU_luxemburg_palace:0 "Grand Ducal Palace of Luxembourg"
 landmark_HEU_luxemburg_palace_desc:0 "The Grand Ducal Palace of Luxembourg was the residence of the former House of Nassau-Weilburg, beloved by many Luxembourgers, and remains the center of Luxembourgish politics even after the Great Transfer. Although a tragic event occurred during the chaos immediately following the Transfer—where the Grand Duchess and her family were massacred in their bedrooms by Gehenna students—the efforts of Rikuhachima Aru and the Luxembourg Parliament have restored the palace's exterior to its beautiful pre-1935 appearance."

 # #### #### Problem Solver 68 Events #### #### #

#{{ Basic Event Start
  HEU_event.1.t:0 "Luxembourg-Pandemonium Treaty"
  HEU_event.1.desc:0 "The Luxembourg diplomatic envoy has conveyed that Rikuhachima Aru desires closer cooperation with the [GEM.GetLeader] side, suggesting that it would be beneficial for Problem Solver 68 and Pandemonium Society to collaborate rather than maintain a military confrontation. While the Grand Duchy of Luxembourg is a small nation, the members of Problem Solver 68 protecting it are clearly talented strategists. Several students within the Pandemonium Society are arguing that strengthening military cooperation between Luxembourg and Pandemonium could be advantageous for us as well. Of course, the final decision rests with [GEM.GetLeader]."
  HEU_event.1.a:0 "A most reasonable proposal!"
  HEU_event.1.b:0 "...What's a Luxembourg? Is it something you can eat?"

  HEU_event.2.t:0 "The Rejected Treaty"
  HEU_event.2.desc:0 "\"Those idiots in the Pandemonium Society! What on earth is their problem with this treaty?\"\n\nAru let out a heavy sigh and threw the brief, one-page document onto the floor. Negotiations had failed. The plan for an alliance between Luxembourg and Pandemonium had collapsed, and Pandemonium would remain a threat in the east. This wasn't the situation she wanted. It wasn't the result she expected. But it had already happened. Luxembourg will have to find a way to survive without Pandemonium's cooperation."
  HEU_event.2.a:0 "\"Right... I suppose this, too, is the path of an outlaw...\""

  HEU_event.4.t:0 "Victory in the Border Dispute!"
  HEU_event.4.desc:0 "The momentum of the Luxembourgish army's march seems unstoppable. Luxembourgish forces have successfully repelled the defenders. As Rikuhachima Aru's provocation has ended in success, the defending army has taken a significant blow, and Luxembourg has effectively seized control over part of the enemy's territory."
  HEU_event.4.a:0 "Heh, a magnificent victory!"

  HEU_event.5.t:0 "Defeat in the Border Dispute!"
  HEU_event.5.desc:0 "The Luxembourgish army failed to achieve meaningful results against the enemy. The opposing forces gained the upper hand in the local skirmish, forcing the Luxembourgish military to retreat from the battlefield. Rikuhachima Aru's provocation has ended in failure, and she may need to reprimand the field officers who directed the operation."
  HEU_event.5.a:0 "Even defeat must be hard-boiled..."

  HEU_event.6.t:0 "Border Dispute Stalled"
  HEU_event.6.desc:0 "The Luxembourgish army failed to achieve results against the enemy. As the localized conflict dragged on, neither side could gain a clear advantage. Continuing the battle further risked escalating the 'skirmish' into a full-scale war. Ultimately, Luxembourg was forced to withdraw its troops. Rikuhachima Aru's provocation yielded a result close to failure, and she may need to reprimand the field officers who directed the operation."
  HEU_event.6.a:0 "Sometimes, days like this just happen."

  HEU_event.7.t:0 "Rikuhachima Aru Visits the Office"
  HEU_event.7.desc:0 "Rikuhachima Aru of Problem Solver 68, who has been effectively separated from us since the cataclysm, visited the southern office of our Prefect Team leader, [GEH.GetLeader]. After discussing various matters, she proposed a treaty including a non-aggression pact and a guarantee of independence to collectively block their common enemy, the Pandemonium Society."

  HEU_event.13.t:0 "Victory in the Border Dispute with Luxembourg!"
  HEU_event.13.desc:0 "Our forces have successfully repelled the border provocation by the Luxembourgish army. Rikuhachima Aru's provocation has ended in failure, and news has reached us that she is currently reprimanding her field officers."
  HEU_event.13.a:0 "A splendid victory!"

  HEU_event.14.t:0 "Defeat in the Border Dispute with Luxembourg!"
  HEU_event.14.desc:0 "Our forces failed to achieve results against the enemy. The opposing army gained a more favorable position in the local conflict, forcing our troops to retreat from the battlefield. Rikuhachima Aru's provocation was successful, and we have been forced to retreat after losing territory."
  HEU_event.14.a:0 "A shameful defeat!"

  HEU_event.15.t:0 "Border Dispute Stalled"
  HEU_event.15.desc:0 "The Luxembourgish army's border provocation failed to achieve results against us. The local conflict persisted for a long duration with neither side gaining an upper hand, and continuing the fight risked a transition into total war. Eventually, the enemy was forced to withdraw. Rikuhachima Aru's provocation resulted in something close to failure, and news has reached us that she is reprimanding her field officers."
  HEU_event.15.a:0 "Nothing happened."

 ### Rework Events ###

 ## News Events ##
 HEU_news.1.t:0 "Explosion at Notre-Dame Cathedral, Luxembourg"
 HEU_news.1.desc:0 "The Notre-Dame Cathedral of Luxembourg, the Grand Duchy's largest Catholic holy site with a 300-year history, was blown up today by Igusa Haruka of Problem Solver 68. This terrorist incident was triggered by an extreme confrontation between local Catholic forces and Problem Solver 68. The local Catholic church had been denouncing Rikuhachima Aru as a 'demon,' and it is reported that just before the attack, they attempted to provoke Aru by sending a letter containing an illustration of Problem Solver employees being horribly executed.\n\nThe blast was massive enough for the sound to be heard over 10km away, and all the remains of the historic Grand Dukes of Luxembourg stored in the cathedral's crypt were completely destroyed. Following the news of this terror attack, the Holy See issued a brief statement condemning Problem Solver 68."
 HEU_news.1.a:0 "\"I'm glad. I've finally been able to be of help to Aru-sama.\""
 HEU_news.1.b:0 "Luxembourg is in chaos due to the conflict between locals and Transferees"

 # Fascist Route Branch News
 HEU_news.2.t:0 "The Luxembourg '68 Revolution"
 HEU_news.2.desc:0 "Rikuhachima Aru believed that cooperation with the locals could protect the human rights of the Transferees, but the locals betrayed her trust. The Right Party coalition government was caught preparing an assassination plot against Aru; in response, Problem Solver 68 raided the Right Party headquarters and forcibly dissolved the party.\n\nHaving seized sole power, Rikuhachima Aru officially declared today that the '68 Revolution,' led by Problem Solver 68, will begin in Luxembourg. The ideology she advocates, known as the 68 Revolution or Rikuhachima-ism, asserts that dismantling local cultures and transplanting the 'free' culture of Kivotos to Europe is the path to better human rights for all Kivotosians."
 HEU_news.2.a:0 "It's all to protect everyone... as an outlaw...!"
 HEU_news.2.b:0 "\"It is forbidden to forbid.\""

 HEU_news.3.t:0 "Pandemonium-Luxembourg Alliance"
 HEU_news.3.desc:0 "Following a military agreement between [HEU.GetLeader] of Luxembourg and [GEM.GetLeader] of the Pandemonium Society, the Grand Duchy of Luxembourg has officially decided to implement military cooperation with Pandemonium. This news came as a shock to Luxembourgish nationalists who had hoped Luxembourg would reclaim German territories.\n\nOn the day the treaty was signed, Pandemonium and Luxembourg announced they would join forces to face a common enemy, leading to various speculations about whether this 'common enemy' refers to the Prefect Team or Trinity."
 HEU_news.3.a:0 "We are stronger because we are one"
 HEU_news.3.b:0 "The landscape of Europe is changing"

 HEU_news.4.t:0 "Aru Declares Herself President of the General Student Council"
 HEU_news.4.desc:0 "\"Countless Kivotos Transferees are being discriminated against by the locals, and what has the General Student Council been doing? Nothing! ...To protect the Transferees, there's no choice but for a hard-boiled person like me to become the President!\"\n\nRikuhachima Aru, who had been engrossed in a movement for equal rights for all Kivotosians and the abolition of discrimination by locals, criticized the existing General Student Council's 'incompetent' attitude toward the locals and declared herself the true President of the General Student Council.\nWhile this declaration currently holds more symbolic meaning than actual influence, citizens sympathizing with Problem Solver 68's claim for 'minimum human rights for the Kivotos world' are beginning to emerge."
 HEU_news.4.a:0 "Outlaws aren't villains"
 HEU_news.4.b:0 "It's a severe level of idealism"
 HEU_news.4.c:0 "So, which side is actually the GSC?"

 HEU_news.5.t:0 "Legislation of Civil Unions for Luxembourg Citizens"
 HEU_news.5.desc:0 "While homosexuality was tolerated in ancient Greece, it has been regarded as a sin throughout the European continent since the Christianization of the Middle Ages. Therefore, the legislation of civil unions in Luxembourg—granting same-sex couples rights equivalent to opposite-sex couples—has sparked strong backlash. However, Rikuhachima Aru stated she would not back down in the face of local opposition for the sake of 'destroying local culture and Kivotos-fication.'\n\nDespite the intense resistance from local Luxembourgish forces, the first legalization of same-sex marriage has succeeded, and local religious figures have declared Rikuhachima Aru the Antichrist, strongly condemning her."
 HEU_news.5.a:0 "The dogs bark, but the caravan moves on"
 HEU_news.5.b:0 "It's surprisingly futuristic"

 HEU_news.6.t:0 "Aru Takes Control of the General Student Council"
 HEU_news.6.desc:0 "After declaring herself the President of the General Student Council, there was much skepticism about whether Rikuhachima Aru could actually seize control of the existing GSC. However, Aru demonstrated remarkable military and diplomatic prowess and succeeded in becoming the leader of the General Student Council.\n\nIn her official inauguration speech, Aru stated her purpose as the GSC President: to fight for the 'rights of all Kivotosians.' While some Kivotos nations expect strong leadership from the new President, voices of caution regarding Aru are growing among human nations."
 HEU_news.6.a:0 "Now this is hard-boiled"
 HEU_news.6.b:0 "The kid who beat the giant"

 HEU_news.7.t:0 "From Problem Solver with Love"
 HEU_news.7.desc:0 "The Grand Duchy of Luxembourg, engaged in total war, has urgently begun producing acrylic block toys (Korotto) featuring the four executives of Problem Solver 68 to raise funds. The toys of Aru, Mutsuki, Kayoko, and Haruka—partnered with a Kivotos hamburger brand—feature cute designs and are gaining massive popularity not only in Luxembourg but also in surrounding countries.\n\nFurthermore, the simple yet substantial deal of getting a free hamburger set with the purchase of a cute Korotto has led to high consumer satisfaction."
 HEU_news.7.a:0 "\"...W-what is this embarrassing thing again!?\""
 HEU_news.7.b:0 "\"I bought four sets, why did I get four Haruka Korottos?\""
 HEU_news.7.c:0 "How should I even interpret this?"

 HEU_news.8.t:0 "The End of BLEU"
 HEU_news.8.desc:0 "BLEU, the acronym for the Belgium-Luxembourg Economic Union, was an economic alliance between the two nations that had persisted since 1921. Under the BLEU agreement, Luxembourg used credit currency linked to the value of the Belgian currency, but it suffered hyperinflation when Belgium collapsed following the Great Transfer.\n\nAs the Luxembourgish currency, no longer guaranteed by any state, turned into scrap paper, Problem Solver 68 finally declared the total suspension of the economic union and a return to the gold standard to stabilize Luxembourg's economy."
 HEU_news.8.a:0 "Anyway, we're out of the chaos, right?"
 HEU_news.8.b:0 "No ally is more important than money..."

 # Communist Route Entry News
 HEU_news.9.t:0 "Passage of the [GetYear] Luxembourg Civil Rights Act"
 HEU_news.9.desc:0 "Through the successful cooperation between the Right Party, Problem Solver 68, and the Luxembourg Communist Party, the 'Civil Rights Act for All Kivotos Transferees' has been passed, despite opposition from right-wing forces including Catholic and fascist civic groups. The Act prohibits discrimination in employment, wages, and other areas for all Kivotos-related populations who arrived during the 1935 Transfer, and mandates penalties for refusing public or private services to them.\n\nRikuhachima Aru expressed her ambitious thoughts, stating that she has resolved the issue of racial discrimination in Luxembourg through compromise and will continue to fight for the improvement of Kivotosian rights across Europe."
 HEU_news.9.a:0 "A historic piece of legislation!"
 HEU_news.9.b:0 "Can a Civil Rights Act truly stop discrimination?"

 # Non-Aligned Route Entry News
 HEU_news.10.t:0 "Rikuhachima Aru's Last Flight"
 HEU_news.10.desc:0 "Rikuhachima Aru's efforts to defeat racial discrimination against Kivotosians through compromise with the locals failed to bear fruit. Beset by criticism from Kivotos Transferees, she completely broke down mentally due to depression. After an argument with her employees, Aru impulsively left a will and set off on a 'suicide flight' toward the territory of Chroma with the help of a military pilot.\n\nA rescue team dispatched with Problem Solver 68 found her wandering alone on a beach, but Aru was reported to be in critical condition, heavily injured and tainted by Chroma. Regarding questions about whether she can still perform her duties in a 'Terrorized' state even if she survives her injuries, the Luxembourg government is refusing all media interviews."
 HEU_news.10.a:0 "\"Why did you save me?\""
 HEU_news.10.b:0 "An unprecedented incident in the history of Problem Solver 68"
 HEU_news.10.c:0 "Is being 'Terrorized' a bad thing? I'm not so sure."

 HEU_news.11.t:0 "Rikuhachima Aru Returns to Work"
 HEU_news.11.desc:0 "While predictions were dominant that Rikuhachima Aru would step down from her positions as Regent of Luxembourg and President of Problem Solver 68 due to essence inversion from her Terrorization, Aru, having recovered from her injuries, participated in a press conference in front of the hospital. She claimed there were no mental changes due to the Terrorization and denied media reports that her character or personality had been compromised.\n\nWithin the coalition Right Party, there was strong talk of accountability for her suicide attempt and abandonment of the head of state position. However, as public sympathy spread following news that the suicide flight was influenced by mental distress from thousands of harassment letters, Prime Minister Joseph Bech announced that Aru's regency would not be revoked."
 HEU_news.11.a:0 "As if nothing happened"
 HEU_news.11.b:0 "I'm not sure if Aru's mind is really in a sane state"
 HEU_news.11.c:0 "So what exactly is 'Terrorization' anyway?"

 HEU_news.12.t:0 "Pandemonium Society's Exile to Luxembourg"
 HEU_news.12.desc:0 "The Pandemonium Society had been facing certain defeat in recent battles and made the most rational choice they could to survive the coming threat: they ran away. The leadership of Pandemonium, including Gehenna Student Council President [GEM.GetLeader], fled to their ally, the Grand Duchy of Luxembourg, and the rulers of Luxembourg, Problem Solver 68, accepted their exile.\n\nFollowing the flight of the leadership, Problem Solver 68 gained authority over the Pandemonium army and decided to continue the war. After the collapse of their ally Pandemonium, the fighting spirit of the Luxembourgers seems to have actually increased at the news that the 'nation is in crisis.'"
 HEU_news.12.a:0 "We will fight to the end!"
 HEU_news.12.b:0 "Running away in the middle of a war? That's ridiculous."
 HEU_news.12.c:0 "Will this flight be the key to changing the tide of war?"

 HEU_news.13.t:0 "Wedding of Rikuhachima Aru"
 HEU_news.13.desc.a:0 "Rikuhachima Aru, widely known as the Regent of the Grand Duke of Luxembourg and President of Problem Solver 68, held an official wedding ceremony today at the Grand Ducal Palace. The wedding between Rikuhachima 'Onikata' Kayoko, formerly of Problem Solver 68, and Rikuhachima Aru was officiated by Emma Goldman, an anarchist supporter of the 68 Revolution, and held privately among Problem Solver employees and fervent supporters of the revolution.\n\nDuring the wedding, street protests were held by anti-same-sex marriage groups centered around the Luxembourg Communist Party, but they did not escalate into a bloody clash."
 HEU_news.13.desc.b:0 "Rikuhachima Aru, widely known as the Regent of the Grand Duke of Luxembourg and President of Problem Solver 68, held an official wedding ceremony today at the Grand Ducal Palace. The wedding between Rikuhachima 'Asagi' Mutsuki, formerly of Problem Solver 68, and Rikuhachima Aru was officiated by Emma Goldman, an anarchist supporter of the 68 Revolution, and held privately among Problem Solver employees and fervent supporters of the revolution.\n\nDuring the wedding, street protests were held by anti-same-sex marriage groups centered around the Luxembourg Communist Party, but they did not escalate into a bloody clash."
 HEU_news.13.desc.c:0 "Rikuhachima Aru, widely known as the Regent of the Grand Duke of Luxembourg and President of Problem Solver 68, held an official wedding ceremony today at the Grand Ducal Palace. The wedding between Rikuhachima 'Igusa' Haruka, formerly of Problem Solver 68, and Rikuhachima Aru was officiated by Emma Goldman, an anarchist supporter of the 68 Revolution, and held privately among Problem Solver employees and fervent supporters of the revolution.\n\nDuring the wedding, street protests were held by anti-same-sex marriage groups centered around the Luxembourg Communist Party, but they did not escalate into a bloody clash."
 HEU_news.13.a:0 "May this vow be eternal"
 HEU_news.13.b:0 "...This is 'accelerated' even by Kivotos standards"
 HEU_news.13.c:0 "Shocking!"

 HEU_news.14.t:0 "Assassination Attempt on Rikuhachima Aru"
 HEU_news.14.desc:0 "Late tonight, small-scale assassins known as Luxembourgish Nazis attacked Rikuhachima Aru while she was leaving the Grand Ducal Palace. The assassins lynched Aru with blunt weapons including hammers and shot her, causing serious injuries, but they failed to kill her due to the intervention of Igusa Haruka.\n\nDue to the gravity of the incident, an embargo is in place, making it difficult to confirm Aru's health status from outside Luxembourg. However, she has been admitted to a military hospital operated by the Luxembourgish army, and the military announced her life is not in danger. One Nazi assassin was killed on the spot by Haruka, and the remaining personnel who fled are being tracked by the Luxembourg police."
 HEU_news.14.a:0 "It's tragic, but Haruka protected Aru"
 HEU_news.14.b:0 "The 1935 massacre of the Grand Ducal family almost repeated itself"

 HEU_news.15.t:0 "Luxembourg Grand Coalition Formed"
 HEU_news.15.desc:0 "Surprisingly, it seems a grand coalition between communists and right-wing reactionaries has succeeded in Luxembourg. Rikuhachima Aru, Regent and President of 'Problem Solver 68,' has brought the Communist Party into the coalition as a partner to manage the Civil Rights Act guaranteeing the rights of Kivotosians. The existing ruling Right Party, while uncomfortable with Aru's political interference, stepped back, stating, \"We will acknowledge a coalition government limited to the management of the Civil Rights Act.\"\n\nWhile this coalition is expected to peacefully improve the relationship between Kivotosians and locals, the Kivotos population is protesting, calling Aru's compromise a 'submission to the locals.'"
 HEU_news.15.a:0 "The Grand Coalition begins with some paint"
 HEU_news.15.b:0 "A coalition of reactionaries and communists? That's a big tent big enough for an elephant."

 HEU_news.16.t:0 "Declaration of the United Duchy of Luxembourg"
 HEU_news.16.desc:0 "The Grand Duchy of Luxembourg, claiming to be the sole sovereign state of the divided Germanic people and their 'representative nation,' occupied the central district of Pandemonium today and declared the founding of a United Duchy. This 'United Duchy' is led by the Grand Duchy of Luxembourg and envisions a sort of confederation by establishing subordinate counties and general duchies in various occupied territories of Deutschland.\n\nRikuhachima Aru was absent from the victory ceremony due to health issues, but Asagi Mutsuki promoted the approaching victory of the United Duchy. Experts analyze that this declaration shows Luxembourg's strong will to militarily conquer the entirety of Deutschland."
 HEU_news.16.a:0 "Is this going well?"
 HEU_news.16.b:0 "Problem Solver is putting on quite a strange show"
 HEU_news.16.c:0 "Luxembourg has become the representative nation of the Deutsch people?"

 HEU_news.17.t:0 "[HEU.GetName]'s Declaration of Germanic Integration Plan"
 HEU_news.17.desc.a:0 "Today, with the consent of Rikuhachima Aru, the Luxembourg Parliament officially declared that Luxembourg has a plan to integrate the Germanic peoples divided after the Great Transfer and is the representative community of the Germanic nation. Considering Aru is Kivotosian and had been indifferent to Germanic nationalism, this is surprising news.\n\nMost experts judge that Rikuhachima Aru intends to resolve the ethnic conflict between Kivotosians and humans by gaining local support. However, some commentators suggest that this 'national community' declaration seems too 'imperialistic' to be Aru's own plan, raising the possibility that she is being used by politicians with other motives." #Communist
 HEU_news.17.desc.b:0 "Today, the Luxembourgish military regime, with the 'consent' of Rikuhachima Aru, officially declared that Luxembourg has a plan to integrate the Germanic peoples divided after the Great Transfer and is the representative community of the Germanic nation. Considering Aru is Kivotosian and had been indifferent to Germanic nationalism, this is surprising news.\n\nHowever, most experts point out that Rikuhachima Aru has been imprisoned by Asagi Mutsuki since the coup incident, judging that this 'consent' likely involves extreme coercion. Some critics cynically view this 'national community' declaration as merely showing Asagi Mutsuki's expansionist ambition." #Fascist
 HEU_news.17.a:0 "I know this is contradictory too..."
 HEU_news.17.b:0 "Has that outlaw gone a bit crazy?"
 HEU_news.17.c:0 "A Bismarck with horns? What a ridiculous story."

 HEU_news.18.t:0 "Kaitenger Attack!"
 HEU_news.18.desc:0 "The criminal organization Kaitenger, which calls itself the guardians of justice, launched an invasion of Luxembourg City today with a giant robot called KAITEN Mk.0. Kaiten Red declared through a recorded statement that they consider Problem Solver 68 an 'evil organization' for interfering with their fund-raising and vowed to completely destroy Luxembourg City.\n\nThe Luxembourg City police are focusing on evacuating residents to the south, while Problem Solver 68 has declared a 'Total War' against KAITEN Mk.0. Rikuhachima Aru is directly blocking the Kaitenger's southward advance, and the Luxembourg City police have announced that KAITEN Mk.0 won't be able to hold out for long."
 HEU_news.18.a:0 "Now, it's time for our Total War!"
 HEU_news.18.b:0 "Total War? Do they give Pyroxenes for this?"
 HEU_news.18.c:0 "It would be great if we could mass-produce robots like that!"

 HEU_news.19.t:0 "Establishment of Berg Memorial Park"
 HEU_news.19.desc:0 "Human-led memorial events for victims after the Great Transfer have been widely conducted by private organizations in Algeria, Canada, and elsewhere. However, a case of a Kivotosian reflecting on the human victims immediately following the Transfer and building a memorial park is unprecedented. Rikuhachima Aru, the leader of Luxembourg, built a memorial facility at the abandoned old Berg Castle to commemorate those massacred by Gehenna students right after the 1935 Transfer.\n\nThe memorial facility consists of a memorial park utilizing the grounds around the castle and a museum inside the castle to commemorate the Grand Ducal family of Luxembourg, who were slaughtered in their entirety. Aru personally attended the opening ceremony, leaving a message of Kivotosian remorse and reconciliation between the two nations."
 HEU_news.19.a:0 "To change the world"
 HEU_news.19.b:0 "That self-proclaimed 'outlaw' is far too soft-hearted"
 HEU_news.19.c:0 "Justice still remains in the land of Luxembourg"

 HEU_news.20.t:0 "Declaration of the Act of Union"
 HEU_news.20.desc:0 "Today, the Act of Union was promulgated, integrating Gehenna, Trinity, and the entire Germanic territory into the 'Germanic United Duchy,' part of the Grand Duchy of Luxembourg. The victory and promulgation ceremony were scheduled to be conducted by Rikuhachima Aru at the Old Eden Trinity Cathedral, but the Luxembourgish government has indefinitely postponed the victory declaration, citing Aru's acute pneumonia.\n\nThis declaration is a symbolic event representing the miraculous victory of Problem Solver 68, a force much weaker than Trinity or Gehenna, and military experts worldwide are investigating how such a thing could have happened."
 HEU_news.20.a:0 "'Pneumonia,' what an absurd lie."
 HEU_news.20.b:0 "Rikuhachima Aru has become a true outlaw!"
 HEU_news.20.c:0 "Now we must admit it. They are the leaders of the Germans."

 HEU_news.21.t:0 "Luxembourg-Pandemonium War"
 HEU_news.21.desc.a:0 "Asagi Mutsuki announced in an emergency statement today that Gehenna forces have illegally invaded Luxembourg territory and that she has moved troops in response. [GEM.GetLeader]'s side declared Mutsuki's announcement a 'complete lie' and moved troops westward, leading to a full-scale war between Luxembourg and Pandemonium.\n\nSince Asagi Mutsuki, rather than Rikuhachima Aru (who is generally regarded as the head of state), is declaring the war and commanding the army, some foreign media suspect that Aru has lost control of the military to Mutsuki. Aru has not appeared in public at all since the outbreak of the war."
 HEU_news.21.a:0 "...Mutsuki... What on earth are you thinking..."
 HEU_news.21.b:0 "The outlaws of Problem Solver have started something big"
 HEU_news.21.c:0 "Luxembourg's flamboyant suicide?"

 HEU_news.22.t:0 "Coronation of Rikuhachima Aru"
 HEU_news.22.desc:0 "Rikuhachima Aru's official position was known as 'Regent of the Grand Duke of Luxembourg.' The position of regent was inherently unstable, and some local politicians dreamed of a 'legal coup' to import a new grand ducal family from abroad and terminate Aru's position. In response, Rikuhachima Aru countered by dissolving parliament for constitutional reform.\n\nThe newly formed parliament passed a constitutional amendment recognizing Rikuhachima Aru as the Grand Duchess of the Luxembourgers by a narrow margin. With this decision, the Rikuhachima family has become the new grand ducal family of Luxembourg, entitled to inherit the position of head of state of the United Duchy. The international community is moving toward approving her grand ducal title, recognizing that the process was achieved through a legal parliamentary vote rather than a coup."
 HEU_news.22.a:0 "I've ended up becoming a real Grand Duchess... ahaha..."
 HEU_news.22.b:0 "Is being a Grand Duchess higher than being the GSC President? I don't know."
 HEU_news.22.c:0 "The first legal ducal house of Kivotosians has been born!"

 HEU_news.23.t:0 "Wedding of Rikuhachima Aru"
 HEU_news.23.desc.a:0 "Rikuhachima Aru, widely known as the Grand Duchess of the Germanic United Duchy and the Grand Duchy of Luxembourg, and President of Problem Solver 68, officially held a wedding ceremony today at the old cathedral in Eden. The wedding between Rikuhachima 'Onikata' Kayoko and Rikuhachima Aru was held as a public event attended by passionate supporters of the Grand Duchess.\n\nLuxembourgish law does not permit same-sex marriage, but at the proposal of the ruling Federal Student Party, the law was bypassed through a Grand Ducal administrative decree allowing same-sex marriage exclusively for Aru herself. Local right-wing 'Right Party' and left-wing 'Communist Party' issued a joint statement saying, 'We respect Aru's privacy, but this should not lead to the legalization of same-sex marriage itself.'"
 HEU_news.23.desc.b:0 "Rikuhachima Aru, widely known as the Grand Duchess of the Germanic United Duchy and the Grand Duchy of Luxembourg, and President of Problem Solver 68, officially held a wedding ceremony today at the old cathedral in Eden. The wedding between Rikuhachima 'Asagi' Mutsuki and Rikuhachima Aru was held as a public event attended by passionate supporters of the Grand Duchess.\n\nLuxembourgish law does not permit same-sex marriage, but at the proposal of the ruling Federal Student Party, the law was bypassed through a Grand Ducal administrative decree allowing same-sex marriage exclusively for Aru herself. Local right-wing 'Right Party' and left-wing 'Communist Party' issued a joint statement saying, 'We respect Aru's privacy, but this should not lead to the legalization of same-sex marriage itself.'"
 HEU_news.23.desc.c:0 "Rikuhachima Aru, widely known as the Grand Duchess of the Germanic United Duchy and the Grand Duchy of Luxembourg, and President of Problem Solver 68, officially held a wedding ceremony today at the old cathedral in Eden. The wedding between Rikuhachima 'Igusa' Haruka and Rikuhachima Aru was held as a public event attended by passionate supporters of the Grand Duchess.\n\nLuxembourgish law does not permit same-sex marriage, but at the proposal of the ruling Federal Student Party, the law was bypassed through a Grand Ducal administrative decree allowing same-sex marriage exclusively for Aru herself. Local right-wing 'Right Party' and left-wing 'Communist Party' issued a joint statement saying, 'We respect Aru's privacy, but this should not lead to the legalization of same-sex marriage itself.'"
 HEU_news.23.desc.d:0 "Rikuhachima Aru, widely known as the Grand Duchess of the Germanic United Duchy and the Grand Duchy of Luxembourg, and President of Problem Solver 68, officially held a wedding ceremony today at the old cathedral in Eden. The wedding between Rikuhachima 'Sorasaki' Hina, formerly of the Prefect Team, and Rikuhachima Aru was held as a public event attended by passionate supporters of the Grand Duchess.\n\nLuxembourgish law does not permit same-sex marriage, but at the proposal of the ruling Federal Student Party, the law was bypassed through a Grand Ducal administrative decree allowing same-sex marriage exclusively for Aru herself. Local right-wing 'Right Party' and left-wing 'Communist Party' issued a joint statement saying, 'We respect Aru's privacy, but this should not lead to the legalization of same-sex marriage itself.'"
 HEU_news.23.a:0 "May this vow be eternal"
 HEU_news.23.b:0 "...Maybe a real Grand Duchess actually is more impressive than the GSC President...?"
 HEU_news.23.c:0 "The Grand Duchess of that country certainly has a lot of power"

 HEU_news.24.t:0 "Luxembourg-Trinity War"
 HEU_news.24.desc.a:0 "Luxembourg has achieved victory over Gehenna with bold tactics, but it has now entered a war with [TRM.GetLeader]'s side. Experts still rate the possibility of victory for Luxembourg and Problem Solver 68 as low, but some predict a 'miraculous' result based on the incredible performance the Luxembourgish army showed against Gehenna."
 HEU_news.24.a:0 "...Blood is flowing once again..."
 HEU_news.24.b:0 "The true war between the successor of Gehenna and Trinity"
 HEU_news.24.c:0 "Will Luxembourg truly achieve a miracle?"

 HEU_news.25.t:0 "General Student Council Power Struggle"
 HEU_news.25.desc:0 "Although Rikuhachima Aru won the power struggle against the existing GSC and seized the regime, it seems many people do not recognize her as the new 'President of the General Student Council.' A self-proclaimed Trinity student named 'Nanami Ayaka,' who has been active only on SNS, announced her debut as a virtual streamer to coincide with Aru's declaration. She stated she would start internet broadcasts wishing for the 'collapse of the Rikuhachima Aru regime.'\n\nAlthough Nanami Ayaka claims to be from Trinity, she has gained high popularity among locals due to her argument that 'it is contradictory for Gehenna-types, who committed massacres during the Transfer, to preach moral superiority.' Her anti-establishment virtual streaming channel has already gathered numerous subscribers, and Rikuhachima Aru has established an official GSC internet streaming channel for public relations for the 68 Revolution."
 HEU_news.25.a:0 "Mischievous Straight, launch!"
 HEU_news.25.b:0 "The President's power is still unstable"
 HEU_news.25.c:0 "Another chaos created by the 68 Revolution"

 HEU_news.26.t:0 "Confusion Ends in the GSC Revolutionary Committee"
 HEU_news.26.desc:0 "Despite anti-establishment streamer Nanami Ayaka's claim that 'Rikuhachima Aru cannot win against external forces threatening the Earth,' Aru proved she is qualified to be the President by winning the war against [GEI.GetName]. Aru accepted Ayaka's criticism that the 68 Revolution so far had not cared enough about the feelings of the locals and promised to hold a memorial event for the Luxembourgish victims killed during the Transfer in the near future.\n\nNanami Ayaka officially acknowledged that Rikuhachima Aru has the qualities of a GSC President and decided to stop her virtual streaming activities. After a long period of confusion, it seems Rikuhachima Aru is finally being recognized as the true President of the General Student Council."
 HEU_news.26.a:0 "It was a tough time"
 HEU_news.26.b:0 "At least that hard-boiled girl protected the Earth"
 HEU_news.26.c:0 "Whether she's GSC President or Sword President, she does have talent"

 HEU_news.27.t:0 "Sorasaki Hina Joins Problem Solver 68"
 HEU_news.27.desc:0 "After the Gehenna Academy, controlled by Problem Solver, decided to forcibly dissolve the Prefect Team, those around Hina thought she would announce her retirement. However, many Gehenna students were shocked today when she was seen visiting the Pandemonium Society wearing a uniform with the Problem Solver 68 logo, carrying documents to execute the Prefect Team dissolution order.\n\nFormer Senior Administrator Amau Ako claimed Hina had been brainwashed by Aru using 'NK Ultra,' a brainwashing technology project of the Pandemonium Society. However, Hina stated firmly to Gehenna reporters, \"I realized Rikuhachima Aru is a better leader than I am, and I simply swore loyalty to her of my own free will,\" causing a stir. While some Prefect Team members are denouncing Hina as a traitor, she has not sent any message in response to these reactions."
 HEU_news.27.a:0 "\"I was surprised too, so I can only imagine how surprised everyone else is.\""
 HEU_news.27.b:0 "...The NK Ultra project wasn't a joke?"
 HEU_news.27.c:0 "NK Ultra? Human brainwashing technology? Did the Luxembourg government really secure such a weapon?"

 HEU_news.28.t:0 "Reunification of Gehenna by [HEU.GetName]"
 HEU_news.28.desc:0 "Although Problem Solver 68, which rules Luxembourg, has a high percentage of Gehenna-type population, it was predicted that achieving the reunification of Gehenna would not be easy due to their identity as the Grand Duchy of Luxembourg. However, due to the leadership of [HEU.GetLeader], the rule over Gehenna by [HEU.GetName] has succeeded.\n\nDespite becoming the ruler of Gehenna, it seems [HEU.GetLeader] does not desire a leadership rank such as Chairman of Gehenna. She values her rights as the leader of [HEU.GetName] more than remaining the leader of Gehenna, and the Chairman of Gehenna will likely be another person she appoints."
 HEU_news.28.a:0 "A remarkable achievement!"
 HEU_news.28.b:0 "A new ruler of Gehenna has appeared!"
 HEU_news.28.c:0 "Luxembourg's amazing success"

 HEU_news.29.t:0 "Luxembourg-[KSP.GetNameDef] Economic Union"
 HEU_news.29.desc:0 "BLEU, the Belgium-Luxembourg Economic Union, was an economic alliance that had lasted since 1921. Luxembourg had been using credit currency linked to the Belgian currency, but suffered hyperinflation as Belgium collapsed after the Transfer.\n\nHowever, through negotiations between [KSP.GetLeader] and [HEU.GetLeader], the Central Bank of Luxembourg decided to form a new economic alliance linking the value of the Luxembourg franc to [KSP.GetNameDef]'s Yen. The Luxembourg Central Parliament stated in an interview that \"this negotiation will guarantee the common prosperity of both nations' economies.\""
 HEU_news.29.a:0 "Anyway, we're out of the chaos, right?"
 HEU_news.29.b:0 "No ally is more important than money..."

 HEU_news.30.t:0 "Coup in the Grand Duchy of Luxembourg"
 HEU_news.30.desc:0 "Political confrontation in Luxembourg has reached an extreme situation, seemingly due to the recently failed 'Civil Rights Act' debate. Rikuhachima Aru attempted to pass the rights of the Kivotos population through parliamentary procedures by compromising with the locals. However, the Right Party blocked her attempt, and some conservative members reportedly insulted Aru personally.\n\nAsagi Mutsuki decided not to tolerate the mockery of Rikuhachima Aru any longer. Mutsuki declared she had imprisoned Aru to 'protect' her and used the military to seize key facilities in Luxembourg. Although Onikata Kayoko rebelled and fled with some units, Asagi Mutsuki has seized power in a single night's coup."
 HEU_news.30.a:0 "This is true order."
 HEU_news.30.b:0 "The locals will never recognize our rights in the end."
 HEU_news.30.c:0 "For Kivotosians, 'legal procedures' are truly meaningless."

 HEU_news.31.t:0 "[HEU.GetNameDef] [GetYear] Election"
 HEU_news.31.desc.kayoko:0 "After the collapse of Asagi Mutsuki's government, Luxembourg, Gehenna, and Trinity—the three nations—held the first parliamentary general election of the Germanic United Duchy. This 600-seat election proved that the Act of Union, guaranteeing equal status for the three countries, is a real system rather than just a declaration. In this election, Onikata Kayoko became Prime Minister through a 'Rainbow Coalition' supported by Gehenna-type parties and a local left-right alliance.\n\nOnikata Kayoko stated after her inauguration that she would implement national management policies for the sake of Rikuhachima Aru. Given that she is a loyal royalist of Aru, it is expected that no major changes will occur in the state."
 HEU_news.31.desc.mutsuki:0 "After the establishment of the Act of Union, Luxembourg, Gehenna, and Trinity held the first parliamentary general election of the Germanic United Duchy. This 600-seat election proved the Act of Union's reality. In this election, Asagi Mutsuki became Prime Minister through a Rainbow Coalition. \n\nMutsuki stated she would implement policies for Aru. However, as Mutsuki was a past coup leader who maintained a dictatorship, her avoidance of legal punishment was merely due to support from pro-Asagi bureaucrats within the government. Since she is an 'unpopular' Prime Minister who could never be a leader in a direct presidential system, pessimistic predictions suggest her politics will be dragged along by the parliament."
 HEU_news.31.desc.mine:0 "Following the Act of Union, the three nations held the first general election for the United Duchy. Aomori Mine became Prime Minister through a 'Black and White Coalition' supported by the Knight Hospitaller-Pandemonium Society alliance and the Christian Social People's Party. \n\nWhile some might mistake the Trinity-type Mine's appointment as Trinity 'conquering' the United Duchy, her power is actually derived from the Pandemonium-Christian Social People's Party alliance. Experts expect Mine to focus on policies for Gehenna's populists and Catholic conservatives."
 HEU_news.31.desc.uzawa:0 "After the Act of Union, the three nations held the first general election. Uzawa Reisa became Prime Minister through a 'Black and White Coalition' supported by the Knight Hospitallers, Pandemonium Society, and the Christian Social People's Party. \n\nAlthough Reisa is from Trinity, her power is granted by the Pandemonium-Christian Social People's Party alliance. Reisa stated that her new administration's most important goal would be to dismantle the 'terrible immorality of the Asagi cabinet.'"
 HEU_news.31.a:0 "The Act of Union is not an illusion."
 HEU_news.31.b:0 "A massive election that will shake Kivotos."
 HEU_news.31.c:0 "The leader of the Germanic people is a girl with a halo!"

 HEU_news.32.t:0 "Prime Minister Election after the Act of Union"
 HEU_news.32.desc:0 "After the establishment of the Germanic United Duchy, [HEU.GetLeader] was elected Prime Minister through an indirect election by some political leaders from Luxembourg, Gehenna, and Trinity. Although [HEU.GetLeader] faces legitimacy issues for not being elected through a democratic process, the selection without a public vote was tolerated for the purpose of 'rebuilding a nation destroyed by war.'\n\nThe [HEU.GetNameDef] government announced that a general election for the entire United Duchy will be held in two years, and the currently elected Prime Minister is a 'stepping stone' to organize the chaos post-war. As Rikuhachima Aru did not intervene at all in the selection process, citizens confirmed that she has decided to give up her past political interventionism and remain a constitutional monarch."
 HEU_news.32.a:0 "Our ending."
 HEU_news.32.b:0 "The winner actually allowed the loser to participate in the election?"
 HEU_news.32.c:0 "Applause for the Germanic nation"

 HEU_news.33.t:0 "Unification of [GEH.GetNameDef] and the Grand Duchy of Luxembourg"
 HEU_news.33.desc:0 "The divided Gehenna has chosen a peaceful unification without war. [GEH.GetLeader], in a joint interview with Rikuhachima Aru, announced that Luxembourg has decided to become part of [GEH.GetName] on the condition of being guaranteed full freedom and autonomy within Gehenna.\n\nRikuhachima Aru could have attempted war, but chose autonomy under [GEH.GetLeader]'s government over the risk of Luxembourg's destruction. Thus, the divided Gehenna has been fully unified, completing [GEH.GetLeader]'s reunification of Gehenna."
 HEU_news.33.a:0 "Long live Gehenna!"
 HEU_news.33.b:0 "To think divided Gehenna unified peacefully!"
 HEU_news.33.c:0 "The end of Luxembourg's history!"

 ## Problem Solver Events ##
 HEU_event.0.t:0 "1936 New Year's Address, Parliamentary Minutes <1/2>"
 HEU_event.0.desc:0 "Speaker Reuter: We shall now begin the 1936 New Year's Address of this Parliament. All members, please be seated.\n\nPrime Minister Bech: Members of Parliament! And members of the press in the back! It is a pleasure to see you all. I thank everyone for gathering during these difficult times.\n\nThe past year, 1935, was a tragic one for our Luxembourg. After the Great Transfer, mobs from another world swarmed and looted across our nation. They plundered the property of the Grand Duchy's subjects, attacked the Gendarmerie, and assassinated the noble Grand Duchess Charlotte, Prince Consort Felix, and even the Grand Ducal family members, including Prince Charles, only eight years old, and Princess Alix, only six.\n\n(Voices shouting <Those bastards!> can be heard)\n\nAnd the captured assassin said this: 'I didn't know they would die so easily' ......Do you think this makes any sense?\n\n(Voices shouting <Kill them!> can be heard)\n\nWe will never forget this tragedy. And we will surely take revenge on them. Let us ensure our homeland does not yield before those western savages!\n\n(Applause from members)\n\nHowever, not all Transferees were invaders during the Transfer. Because of the Regent and the righteous individuals who fought alongside us against the mobs, the Luxembourg of today exists. The era of chaos is over, and now we must join forces and move forward for reconstruction. For the sake of the late Highness's revenge, the motherland must become healthy again.\n\nThus, I have discussed the lifting of martial law with the floor leaders to return to normalcy, and with the consent of all parliamentary parties, I have formally submitted the resolution to lift martial law to the Regent.\n\n(PM Bech steps back from the microphone and hands over the documents. Rikuhachima Aru, the Regent, steps forward.)"
 HEU_event.0.a:0 "Aru gripped the microphone and slowly caught her breath."

 HEU_event.1001.t:0 "1936 New Year's Address, Parliamentary Minutes <2/2>"
 HEU_event.1001.desc:0 "Aru: Um, uh... Hello? I am Rikuhachima, serving as the Regent of the Grand Ducal House of Luxembourg—er, I mean, Problem Solver 68.\n\n(Applause from all members except the Independent National Party)\n\n......I saw for myself what happened during the Transfer. After driving out the mobs, I went with the Gendarmerie and Mutsuki—well, Mutsuki is my friend—to check the rooms in the palace to see if anyone was hiding. That's when we found those people in the bedrooms... Yes. I was among the first to find them with the Gendarmerie. It was hard to even tell who was who......\n\n(A member is seen crying)\n\nKivotos is a place where death isn't common. I never imagined someone dying, or rather, being torn apart... I'm sorry. One moment, please......\n\nSpeaker Reuter: Your Highness, I have a handkerchief.\n\nAru: No. I... I'm okay. (Wipes her eyes with her sleeve) I apologize for not showing a cold, composed side. I will strive to build a Luxembourg where such things never happen again and where no one suffers. I approve the resolution to lift martial law submitted by the Parliament and declare that as of this moment, January 1, 1936, martial law is lifted across the Grand Duchy of Luxembourg.\n\n(A member shouts <Long live the Grand Duchy!>)\n\nIt is now the second year since the Transfer. The Prime Minister called this a 'return to normalcy,' but the 'normalcy' we knew will not return exactly as it was. Neither I nor other Kivotosians will be able to return to our original world. Although it's a coexistence born of tragedy, we must learn to live together—Kivotosians and locals alike.\n\nAs I have taken on the regency, I will do my best to protect everyone in this land. I will not back down, no matter what. I'll work hard to make this a new year full of hope. Thank you.\n\n(Standing ovation from all members except the Independent National Party)"
 HEU_event.1001.a:0 "Searching for hope amidst despair"

 HEU_event.101.t:0 "The Future of Problem Solver"
 HEU_event.101.desc:0 "The mockery and sarcasm of the locals, and the Germanic nationalism of the Nazi Independent National Party. The Gehenna immigrants of Luxembourg say to Rikuhachima Aru: \"You are a Gehenna student, not a citizen of Luxembourg.\" The only chain binding Rikuhachima Aru to Luxembourgish law is her own good-hearted morality. But what if the people of Luxembourg truly don't want her? Perhaps Aru's role is to fight for the Gehenna students who want her to protect them?\n\n\"Is there no way to be on the side of both the Luxembourgish locals and the Gehenna immigrants?\"\n\nLate at night, when all the Problem Solver colleagues have gone home, Aru stands alone in her office, wiping away tears.\n\n\"Even if I'm too weak to be an outlaw... still, at least I want to walk the 'right path'.\" And so, having wiped her tears, Aru made her decision."
 HEU_event.101.a:0 "\"I won't give up on the locals. Never.\""
 HEU_event.101.b:0 "\"Protecting the Kivotosians who crossed over... that might be my mission.\""
 HEU_event.101.c:0 "\"I won't give up on anyone. That is my choice.\""

 HEU_event.102.t:0 "Regent Rikuhachima"
 HEU_event.102.desc:0 "Aru's formal inauguration as Regent had been repeatedly postponed until the post-Transfer chaos could be settled. However, several months had already passed since Aru began her duties, and Prime Minister Joseph Bech decided he could no longer delay the ceremony. For the strictly conservative Bech, having a (temporary) Regent who hadn't even had a formal inauguration move freely in and out of the palace was a blow to 'national prestige.'\n\nIn the palace's first-floor lounge, where reporters had gathered, Bech handed the constitution to Aru, who had arrived in a dress.\n\n\"Place your hand and swear. Do you, Miss Rikuhachima, as the Regent of the Grand Duchy of Luxembourg, swear loyalty to the Grand Ducal House and to the constitution and laws of the motherland?\"\n\nDoes such an oath have meaning when there is no 'Grand Ducal House' left? More than that, do 'I' really have to be the Regent of this country? Suppressing a surge of pressure and fear, Aru placed her hand. \"I swear.\"\n\n\"...Very well. By virtue of Article 7, Paragraph 2 of the Constitution, which grants Parliament the power to recognize a regent, I recognize Miss Rikuhachima Aru as the legitimate Regent of the Grand Ducal House of Luxembourg.\"\n\nClick! Click! As soon as Bech finished speaking, over ten reporters fired their shutters simultaneously."
 HEU_event.102.a:0 "Aru gave an awkward smile to the gathered reporters."
 HEU_event.102.b:0 "Under the pressure of becoming a formal Regent, Aru clenched her teeth."

 HEU_event.103.t:0 "Kayoko's Pursuit"
 HEU_event.103.desc:0 "Kayoko is not typically an employee with the passion to step forward and do things she wasn't told to do (that's Haruka's role). But this was different. Members of the Right Party, which led the coalition government, had recently been meeting separately without contacting Problem Solver 68. They seemed to be trying for 'secret' meetings in their own way, but in this small country, they couldn't help but be noticed when cars were sneaking out to the outskirts of Luxembourg City at the same time every week.\n\n\"Suspicious, as expected.\"\n\nKayoko stood by the building window, watching the black cars heading out of the city. Whatever they were plotting was none of Kayoko's concern—unless something bad was going to happen to Aru."
 HEU_event.103.a:0 "I should take some time to look into this."

 HEU_event.104.t:0 "In Bettembourg"
 HEU_event.104.desc:0 "In Bettembourg, south of Luxembourg City, Kayoko walked quietly along the night road. The Bettembourg City Hall was brightly lit even late at night. There were no guards. They seemingly thought not having people around was the way to avoid detection. It was a completely wrong idea, of course, as it allowed Kayoko to sneak into the building with ease.\n\nOn the first floor, she saw Right Party members gathered in a hurry. Prime Minister Joseph Bech wasn't there, but Speaker of Parliament Emile Reuter and other Right Party members were present.\n\nSpeaker Reuter waved his hand. \"...I only agreed to the regency appointment on the premise that Aru would *ruin* Luxembourg! It was to kick that woman out of Luxembourg in a legal way.\"\n\"But isn't she doing quite well in politics so far?\"\n\"That's the problem! Agreeing to give her power, then impeaching her once she ruins the country... the whole plan was based on the assumption she'd be incompetent, which turned out to be wrong.\"\n\nThey gave her the regency just to kick her out? While Kayoko was taken aback, Reuter spoke again.\n\n\"We don't know how much more time will pass if we wait for her to make a mistake. ...We must strike off the snake's head. We must kill that woman.\""
 HEU_event.104.a:0 "The plot thickens."

 HEU_event.105.t:0 "May Your Friends Burn in Hell"
 HEU_event.105.desc:0 "As Nazi supporters scattered following the dissolution of GEDELIT, the anxiety of the Catholics—who became the last local resistance force in Luxembourg—began to grow. Of course, 90% of the locals are Catholic; what could four people from Problem Solver possibly do? Yet, there were those who showed their will to resist.\n\n\"W-what is this!!!\"\n\nAru, opening a package that arrived at the office, turned pale and stood up, pushing her chair back. It wasn't the first time a threatening letter had come to Problem Solver. But this was different. It was a drawing of Kayoko, Haruka, and Mutsuki tied to ropes and being burned at the stake. Below it, in red paint, was written: *Alle Dämonen werden so sein* (All demons will be like this).\n\n\"Wow. This is a bit much for a joke, isn't it?\" Mutsuki's expression hardened.\n\n\"I don't care if it's slander against me, but I won't tolerate them touching my company's kids!\"\n\nAs the angry Aru pulled out the drawing, an invitation hidden at the bottom was revealed.\n\n'We plan to hold a solemn exorcism ceremony to pray for the expulsion of demons at the Notre-Dame Cathedral in Luxembourg. We would like you to attend the commemorative event to pray for the demons to burn to death-'\n\nRip! Aru tore the invitation harshly and threw the paper into the air, shouting, \"A cathedral that does such a thing! Let it all collapse! ...Just collapse already.......\"\n\nInitially, she was furious, but as time passed, the image of the other three Problem Solver members burning in agony kept coming back. An image she couldn't help but see. Aru slumped down, bursting into tears. \"I should be hard-boiled and ignore letters like this.... But....... I can't. It's too much, seeing everyone get hurt because of me....\"\n\nLeaving behind the sound of Aru's sobbing, Haruka stepped over the torn invitation."
 HEU_event.105.a:0 "\"...It's okay. I'm fine even after seeing a letter like this, so... Aru-sama, please don't cry...\""

 HEU_event.106.t:0 "A Cathedral Like This Should Be Gone"
 HEU_event.106.desc:0 "The Notre-Dame Cathedral of Luxembourg was a cultural heritage site and a beautiful cathedral that gave locals pride. Built by Belgians in 1613, it was the burial site of various national figures, adorned with beautiful stained glass and Renaissance-style architecture. It also boasted a proud history, having been designated by the Pope as the representative cathedral of the Archdiocese of Luxembourg. And the cathedral was busy preparing for the 'Public Solemn Exorcism for the Problem Solver Demons' to be held in a few days.\n\nWell, it 'was' being prepared.\n\n\"Hehe. Did you survive because Aru-chan really hates killing people? You know that, right?\"\n\nMutsuki grabbed the hair of the bishop, whose limbs were tied with rope, and threw him toward the front of the cathedral. He landed just barely outside the line Kayoko had drawn with chalk.\n\nCrash! The bishop, falling on top of other Catholics thrown earlier, screamed.\n\n\"You offspring of Satan, you demons of Gehenna. Do you think you can survive after... Ack!\" Haruka struck the bishop's head with her gun butt. Blood splattered from his forehead onto Haruka's shotgun.\n\n\"You should feel honored just to be able to return alive after making Aru-sama cry.\"\n\"Ah? Because of that invitation? Compared to what you've done to Luxembourg, that letter is...\"\n\nSmack! This time, Mutsuki kicked the bishop's jaw.\n\n\"Huh? You think we're joking? Aru-chan cried. She wailed after seeing the letter you sent.\"\n\nSmack! Crack! Mutsuki kicked the bishop's jaw a few more times before turning to Haruka.\n\n\"Blow it up.\"\n\"Yes. ...I should have done this sooner.\"\n\nHaruka pressed the detonator. And with a boom, the cathedral collapsed helplessly like a house of cards."
 HEU_event.106.a:0 "It took only 3 seconds for 300 years of history to be erased."

 HEU_event.107.t:0 "Regent of the Grand Duke of Luxembourg"
 HEU_event.107.desc:0 "The Grand Duchy of Luxembourg suffered a major blow during the Transfer with the annihilation of the Grand Ducal family. Miraculously, it maintained its independence without being annexed by Gehenna, thanks to the help of a resistance force called 'Problem Solver 68' led by Rikuhachima Aru and some sympathizing Transferees. The ruling Right Party appointed Rikuhachima Aru as the Regent of Luxembourg, and her official inauguration was held several months after the Transfer.\n\nThe Grand Duchy of Luxembourg and Belgium were the closest of allies, sharing an economic union. Although the union collapsed with the exile of the Belgian government, a friendly view toward Luxembourg remains widespread among Belgian politicians. So, wouldn't it be natural to send a congratulatory message for the new Regent's inauguration? Actually, it isn't. While Aru is a 'human-friendly' Kivotosian who fought against Gehenna's invasion, many exiles still feel a sense of repulsion toward the fact that she is a 'non-human' with horns on her head.\n\nThe decision lies with [BEL.GetLeader], the head of the Belgian government-in-exile. Is the fact that the new Regent of Luxembourg is not human more important? Or is it more important to maintain diplomatic relations with the closest ally, the Grand Duchy of Luxembourg?"
 HEU_event.107.a:0 "Send a congratulatory message!"
 HEU_event.107.b:0 "Remain silent"

 HEU_event.108.t:0 "[BEL.GetLeader]'s Official Inauguration Message"
 HEU_event.108.desc:0 "< Congratulatory message in front of the Grand Ducal Palace regarding the inauguration of the Regent of the Grand Duchy of Luxembourg >\n\nTo Her Highness Rikuhachima Aru, Regent of the Grand Duchy of Luxembourg,\n\nFirst, I wish to express my gratitude for Your Highness's protection of the Grand Duchy of Luxembourg, the heart of the civilized world, against the atrocities of the imperialist invaders from the so-called 'Kivotos' during the tragic Transfer of 1935. I was relieved to hear that Your Highness, and no other, has been appointed as Regent.\n\nOn behalf of the Belgian government and all Belgian subjects, I sincerely congratulate Your Highness, the savior of Luxembourg, on your appointment as Regent.\n\nI consider Your Highness's government to have inherited the legitimacy of the existing Luxembourgish government and promise that the Belgium-Luxembourg Alliance Treaty of 1921 will remain in effect under your loyal administration.\n\nBelgium and Luxembourg, as members of the free world that survived the Transfer, must gather strength to fight against the Kivotos oppressors. I hope that Your Highness will work together to ensure that the friendly relations between the Belgian government-in-exile and the Grand Duchy of Luxembourg are maintained.\n\nI pray for Your Highness's continued health and for the prosperity of your anti-Kivotos resistance organization, 'Problem Solver 68.'\n\n[BEL.GetLeader], King of the Belgians"
 HEU_event.108.a:0 "Aru carefully placed the letter in a frame."

 HEU_event.109.t:0 "The Coup Plan"
 HEU_event.109.desc:0 "\"No way... they didn't give me the regency because they *trusted* me?\"\n\nAru wanted to deny Kayoko's words. Someone else had relied on her and entrusted the future of Luxembourg to her. Because she believed they had good intentions, she had been able to perform her duties as Regent until now. She wanted to make this land of Luxembourg a place where Kivotos Transferees and locals could live together in peace. But what if the Right Party, whom she believed to be her partner, had *no* good intentions from the start?\n\nWhat if trusting the locals was her mistake? What if they only saw Transferees as pests and had no intention of getting along with them at all? Aru's kind nature wanted to deny that thought. However, the protests on the streets, the condemnation from the Catholics, and the tyranny of fascist civic groups—the Right Party had never helped Aru during all that commotion after her appointment.\n\n\"...If this coup plan you mentioned is real.\"\n\nAru clenched her teeth."
 HEU_event.109.a:0 "\"I'll pay them back. A hundredfold.\""

 HEU_event.110.t:0 "The Counter-Coup"
 HEU_event.110.desc:0 "Emile Reuter thought his coup plan was perfect. Arm a revolutionary force recruited from robust Luxembourgish steelworkers, then lynch Aru at night while she was returning home from the palace. After killing Aru, pin the blame on another suitable group, and the Right Party would establish a new government excluding Problem Solver 68 for the sake of national stability. If everything had gone as planned, the Right Party should have reclaimed Luxembourg.\n\n\"But why, how did things turn out like this...\"\n\nRight Party headquarters. Problem Solver 68 subdued all the security guards in just three minutes and completely seized the building. Reuter felt his back get soaked with sweat as he looked into the eyes of the outlaw Aru, who was aiming a gun at his chin with an emotionless expression.\n\n\"Your clumsy assassination plan has been completely exposed.\"\n\"...Unbelievable, to such a pathetic girl....\"\n\"I never tolerate anyone who betrays me.\"\n\nHaruka raised her shotgun. \"Th-then Aru-sama, shall I just kill all these pieces of trash?\"\n\"No! No, I didn't say to kill them! Stop!\"\n\nShe, who had looked like a cold-hearted hard-boiled outlaw, momentarily showed a flustered expression. Aru quickly regained her composure and jabbed the gun barrel into Reuter's chest."
 HEU_event.110.a:0 "\"All of you are banished from Luxembourg. The Right Party is hereby dissolved.\""

 HEU_event.111.t:0 "Prime Minister Bech's Survival Method"
 HEU_event.111.desc:0 "There's no way he didn't know about Speaker Reuter's coup operation. In fact, it was Bech who first provided the assassination plan to Reuter. He never truly intended to give the power of Luxembourg to a girl with horns forever. But the coup failed. The Right Party headquarters was occupied by Aru, and Reuter's gang was subdued. Now, the important thing was to ensure Bech's own safety.\n\n\"I wanted to save Luxembourg from the Transferees.... I have no face to show the elders of the Grand Ducal family.\"\n\nBech spoke as if lamenting, preparing to meet Aru and her group visiting the Prime Minister's residence. The coup was entirely Reuter's independent action. Bech knew nothing about it. He had to insist on that to have a chance at survival."
 HEU_event.111.a:0 "The Right Party is ruined, but I have survived."

 HEU_event.112.t:0 "Rikuhachima-ist '68 Revolution"
 HEU_event.112.desc:0 "Aru stood by the window of the Grand Ducal Palace, looking out at the streets of Luxembourg. It should have been a peaceful afternoon, but she could immediately see German signs saying 'No Dogs or Kivotosians' on the commercial buildings visible from the window. Once, Aru trusted the locals. She believed that if she understood their way of life and tried to be recognized by them, the locals would accept Kivotosians as family. But now, Aru no longer trusts the locals.\n\n\"The culture of this world.... is too terrible compared to the culture of Kivotos.\"\n\nIf there is a hierarchy in culture, and if the culture of Kivotos is overwhelmingly superior to the local culture, is there a need to try and assimilate into the local culture to stop discrimination? Instead, wouldn't it be better to 'Kivotos-ify' the local culture?\n\nShe called herself an outlaw and a cold-hearted hard-boiled person, but since the Transfer, Aru had never once chosen the path of abandoning her fellow Kivotosians to be happy alone. Since she became Regent anyway, she wanted to create a Luxembourg where everyone was happy. ...That heart had not changed even now, after being hurt, mocked, and brought to her knees by the locals.\n\nBut one thing had changed: the realization that the disappearance of the so-called local culture of humans is the path to Luxembourg becoming a paradise where Kivotosians and locals can live equally."
 HEU_event.112.a:0 "\"...That is my path as an outlaw, 'Rikuhachima-ism'.\""

 HEU_event.113.t:0 "Rikuhachima-ist Paradise"
 HEU_event.113.desc:0 "Build an equal paradise for all Kivotosians. After Aru's dream crystallized into an ideology called Rikuhachima-ism, immigrants from surrounding countries began to increase in Luxembourg. Trinity and Gehenna students who couldn't bear the conflict with local Germans, Millennium students who came with interest in the new ideology, and even beastmen citizens who belonged to no academy. Luxembourg's population began to grow due to immigrants, but it wasn't all good news.\n\nViolent incidents continue to occur between locals negative toward Rikuhachima-ism and the immigrants. Gehenna immigrants, who don't follow government control at all, are causing small and large commotions everywhere. And according to rumors, criminal organizations from the Black Market have sneaked into Luxembourg seeking profit. The dream of creating a paradise in reality didn't always go smoothly."
 HEU_event.113.a:0 "Paradise cannot be proven."

 HEU_event.114.t:0 "Arancino Family"
 HEU_event.114.desc:0 "\"So it's true that the Arancino Family has infiltrated Luxembourg.\"\n\nAru let out a sigh. A letter arrived at Problem Solver 68. Members of the Arancino Family have established a base in Luxembourg. However, the Family claimed they had no intention of directly confronting the Luxembourg government, Problem Solver. They merely promised that if they were given part of the ownership of Luxembourg's iron mines, they would not commit any crimes and would even share some of the mine profits with the Luxembourg government.\n\n\"What do you all think? This proposal.\"\n\nMutsuki laughed. \"Doesn't it look fun? Teaming up with the mafia seems quite hard-boiled.\"\n\nKayoko said, \"The mistake is believing a mafia's 'promise' in the first place. Ignore them.\"\n\nFinally, Haruka. \"Th-that someone like me would be asked for an opinion by Aru-sama... my opinion won't be helpful at all...... no... to think I can't even give one opinion for Aru-sama.... I'm a useless employee....... ............I'll die.\"\n\n\"No, don't die! Put the gun down!\"\n\nAru hurriedly took away Haruka's shotgun. \"Anyway, I've heard everyone's opinions. I'll make the final decision.\""
 HEU_event.114.a:0 "If it's profitable, I'll even cooperate with the mafia. That's my hard-boiled way."
 HEU_event.114.b:0 "I'd rather trust a Nazi than a mafia's promise. Burn the letter."

 HEU_event.115.t:0 "Rather than Trusting the Mafia..."
 HEU_event.115.desc:0 "\"They are certainly sharing the profits well, but....\"\n\nAru read a complaint that arrived at the office. 18 hours of continuous work. The mafia, consisting of halo-bearing infantry, were threatening mine workers—who had weaker physical abilities—and using them as effective slaves. There were even reports that they were kidnapping local children and pushing them into the mines. The Arancino Family indeed shared some of the profits from the iron ore sales with Aru as promised. But.\n\n\"...I didn't imagine earning money like this.\"\n\nRikuhachima Aru was not the kind of person to happily receive such money. No matter how disappointed she was with the locals or how used to their hatred she became, the locals were people with emotions who laughed and cried just like Aru. Aru put down the complaint.\n\n\"Everyone in Problem Solver, prepare to move out. ...We're going to the mine to see the situation for ourselves.\"\n\nKayoko asked, \"If the complaint is true? What then?\""
 HEU_event.115.a:0 "We'll have to smash them all immediately."

 HEU_event.116.t:0 "Rather than Trusting the Mafia..."
 HEU_event.116.desc:0 "After Problem Solver 68 didn't hand over the mine ownership, Aru thought the Arancino Family would leave Luxembourg. What would the mafia sell to make money in this small land? But that thought turned out to be naive. The Arancino Family was smuggling guns to the Nazi remnants that Aru had once dissolved.\n\n\"Nazi guerrillas! What on earth are those things doing in my land?!\" A flustered Aru sprang up from her seat.\n\nMutsuki giggled as she looked at Aru, who had turned pale. \"Aha. That Arancino Family is doing the 'daily evil' that Aru-chan can't? Doesn't it make you feel competitive?\"\n\"It's not a matter of feeling competitive! I'll crush them right now. Both the Nazis and this Arancino Family!\""
 HEU_event.116.a:0 "Problem Solver 68, all units move out!"

 HEU_event.117.t:0 "Weakening of Fascist Forces"
 HEU_event.117.desc:0 "After Rikuhachima Aru's suppression of fascist organizations was decided, troops under Aru's command began seizing the assets of various fascist groups in Luxembourg. GEDELIT (German Literature and Art Association), the largest and most influential fascist organization in Luxembourg, became the target of dissolution. Since members like former Luxembourgish Prime Minister and pro-Nazi figure Pierre Prüm belonged to GEDELIT, a major physical clash was expected.\n\nHowever, due to the actions of Damian Kratzenberg, who instructed to \"stop violent resistance and dissolve for now,\" no major physical clash occurred, except for an incident where Prüm was beaten while throwing a punch at a Gehenna student. Kratzenberg had been in deep despair after losing his wife during the Transfer and chose to step back rather than immediately confront the new Luxembourg government.\n\n\"...Of course, someone like Kratzenberg won't step back so easily.\"\n\nAru let out a sigh as she read the report announcing the dissolution of GEDELIT. Aru had experienced enough over the past few months how persistent and tenacious Luxembourg's fascists are. Kratzenberg just chose to 'take one step back' to take two steps forward. Someday, the day will come to face him again. That ominous feeling did not leave Aru's mind."
 HEU_event.117.a:0 "At least we won today."

 HEU_event.118.t:0 "Petition Against Civil Union Legislation - Luxembourg Communist Party"
 HEU_event.118.desc:0 "To Rikuhachima Aru, President of Problem Solver 68,\n\nProblem Solver 68 must stop its bourgeois law-making plans!\n\nHomosexuality is fundamentally a <moral corruption> that exists only in <bourgeois> nations, as taught by the leader of the Comintern, the respected comrade <Joseph Stalin>. Therefore, we accuse! The capitalist error currently pursued by Rikuhachima Aru, who claims the so-called <Regency of the Grand Duke of Luxembourg>, will lead the working class of Luxembourg into a more painful situation. By introducing the moral corruption of bourgeois culture, the freedom of workers will be reduced, and the implementation of the <Civil Union> system will bring about social corruption.\n\nIf Rikuhachima Aru is not a spy of capitalist nations, she must stop such bourgeois tactical sabotage activities and focus more on establishing <Freedom for the Working Class>. This is a stern warning from all of the working class and advice to Rikuhachima Aru personally.\n\nSent by the Luxembourg Communist Party"
 HEU_event.118.a:0 "The letter was crumpled and thrown into the trash."

 HEU_event.119.t:0 "Petition Against Civil Union Legislation - Luxembourg Underground Church"
 HEU_event.119.desc:0 "To Rikuhachima Aru, President of Problem Solver 68,\n\nFollowing the Antichrist-like behavior called 'Rikuhachima-ism,' now you are trying to turn the nation into a Stalinist den.\n\nYou red-haired commie bastard. I'll wait for the day the Lord drags you to hell. You communists are always the same. To destroy the Lord's order and Communize the nation, you start by tainting the culture.\n\nGo back to your beloved Luxembourg Communist Party!\n\nOrigin unknown"
 HEU_event.119.a:0 "\"...There's no need to mention the hair, is there?\""

 HEU_event.120.t:0 "Petition Against Civil Union Legislation - Luxembourg Mining Trade Union"
 HEU_event.120.desc:0 "To Rikuhachima Aru, Regent of the Grand Duke of Luxembourg,\n\nWe declare a general strike until national normalization is achieved.\n\nThat is all."
 HEU_event.120.a:0 "\"...Short and concise.\""

 HEU_event.121.t:0 "Petition Against Civil Union Legislation - Luxembourg Gendarmerie"
 HEU_event.121.desc:0 "To the Grand Ducal Palace of Luxembourg,\n\nYour Highness Regent. Dissatisfaction within the Gendarmerie is extreme. Despite Your Highness's anti-religious policies, the Gendarmerie is the most conservative group, and many soldiers still believe in the Catholic faith. Some Gendarmerie soldiers have decided on a 'general strike' and have left their stations, not returning. While we have already issued a warning that Luxembourg soldiers have no right to strike and such actions are considered simple desertion, it is worrying whether they will return.\n\nHaving been with them for a long time, I understand their motives, but the duty of a soldier is to be loyal to the Grand Ducal House, the foundation of the motherland. Now that the old Grand Ducal family has passed away, it is natural to be loyal to Her Highness Rikuhachima Aru. This is a matter beyond whether I agree or disagree with Your Highness's policies. All soldiers have a duty to be loyal to Your Highness's choices before their own thoughts, and desertion against Your Highness is treason.\n\nYour Highness Regent. Therefore, you must deliver a return-to-unit order to all of Luxembourg in your name. Soldiers who do not respond to the order must be considered rebels, have their military status revoked, and be arrested for trial. The issue of whether women marry each other or men marry each other is a trivial matter compared to the treason of violating loyalty to the dignified monarch. Soldiers who value other values over loyalty are not fit to wear the military uniform. I believe Your Highness understands this, and I await your reply.\n\nEmile Speller, Commander of the Luxembourg Gendarmerie"
 HEU_event.121.a:0 "I should prepare an order considering desertion as treason."
 HEU_event.121.b:0 "Deserters should be arrested. But is there a need for a trial for treason and such?"

 HEU_event.122.t:0 "An Anonymous Letter"
 HEU_event.122.desc:0 "To Rikuhachima Aru, President of Problem Solver 68,\n\nI met someone I like after entering Gehenna. And we've been living together until now. It's hard to write many words. But. Just. Thank you, President."
 HEU_event.122.a:0 "\"...You're very welcome.\""

 HEU_event.123.t:0 "A Letter Taped to the Entrance of Problem Solver"
 HEU_event.123.desc:0 "To Aru-chan,\n\nI don't think whatever choice Aru-chan makes is wrong.\n\nDon't think everyone is an enemy. I'll always be on Aru-chan's side!\n\nFrom a mysterious genius gamer"
 HEU_event.123.a:0 "Aru smiled as she peeled off the tape."

 HEU_event.124.t:0 "[HEU.GetName]'s Request for Air Force Technology Sharing"
 HEU_event.124.desc:0 "In a handwritten letter from Problem Solver 68, written in neat script, there were ceremonial words about the friendship and alliance between the Grand Duchy of Luxembourg and Gehenna Academy, along with a request for the Pandemonium Society to share some of their air force technology with Problem Solver 68 to strengthen the Luxembourgish military. Since providing some technology is not expected to cause a major loss to our military, it would be a good idea to share some air force technology with them."
 HEU_event.124.a:0 "Let's share technology with them."
 HEU_event.124.b:0 "To think Luxembourg needs an air force, it's quite a comedy!"

 HEU_event.125.t:0 "[HEU.GetName]'s Request for Naval Technology Sharing"
 HEU_event.125.desc:0 "In a handwritten letter from Problem Solver 68, written in neat script, there were ceremonial words about the friendship and alliance between the Grand Duchy of Luxembourg and Gehenna Academy, along with a request for the Pandemonium Society to share some of their naval technology with Problem Solver 68 to strengthen the Luxembourgish military. Since providing some technology is not expected to cause a major loss to our military, it would be a good idea to share some naval technology with them."
 HEU_event.125.a:0 "Let's share technology with them."
 HEU_event.125.b:0 "I'd rather get help from a local fishing boat than help from the Luxembourgish navy."

 HEU_event.126.t:0 "Rejection of Technology Sharing Request from [FROM.GetName]"
 HEU_event.126.desc:0 "Despite Problem Solver 68's very polite tone in requesting technology sharing from the Pandemonium Society, [FROM.GetLeader]'s side seems to have no intention of sharing their military technology with us. They decided to reject our request and explained in a brief letter how dangerous the leak of 'military technology' is to national security. Although we are allies, it seems we'll have to develop new technology ourselves."
 HEU_event.126.a:0 "So that's the extent of this alliance."

 HEU_event.127.t:0 "Air Force Technology Sharing from [FROM.GetName]"
 HEU_event.127.desc:0 "Despite skeptical sarcasm that Luxembourg wouldn't need an air force, [FROM.GetLeader]'s side decided to deliver some of the air force technology they possess to us. Of course, this is merely technical support, and the role of training the air force still lies with us. However, it's clear that the foundation for an air force with Problem Solver 68's symbol to fly into the sky has been laid. It's time to thank them for their support and recruit new air force pilots."
 HEU_event.127.a:0 "That's wonderful news!"

 HEU_event.128.t:0 "Naval Technology Sharing from [FROM.GetName]"
 HEU_event.128.desc:0 "After we secured maritime territory, we requested naval technology sharing from [FROM.GetName] for the creation of a navy. There were skeptical views that this request would not be accepted, but [FROM.GetLeader] provided the materials necessary for constructing new warships. Although the role of building the warships is still ours, the day when warships with the Problem Solver 68 symbol sail the European seas seems not far off."
 HEU_event.128.a:0 "Warships need to be hard-boiled too!"

 HEU_event.129.t:0 "Exile Proposal from [FROM.GetName]"
 HEU_event.129.desc:0 "We are losing the war and facing the risk of annihilation. Although there is still a possibility of a turnaround, [FROM.GetLeader] has proposed exile to Luxembourg. The proposal is that if we hand over military control of the Pandemonium Society to them and live in exile, they will turn the tide of the war. Since this choice will buy time for the Pandemonium leadership to flee to a 'safe' place, [ROOT.GetLeader] is positive about this proposal, but the argument that we should stand in our territory and fight to the end instead of going into exile also has merit.\n\nWhichever choice is made, it is a one-time decision that cannot be undone, and it will greatly twist not only the future of the Pandemonium Society but the future of all Europe."
 HEU_event.129.a:0 "Let's flee to Luxembourg!"
 HEU_event.129.b:0 "I will die in this land, even if I must."

 HEU_event.130.t:0 "Spread of the Rikuhachima-ist '68 Revolution'"
 HEU_event.130.desc:0 "\"It is forbidden to forbid! Give us more freedom!\"\n\nThe so-called '68 Revolution,' or 'Rikuhachima-ism,' a liberal New Left movement that started in Luxembourg, has spread into [ROOT.GetName]. Due to our alliance with Luxembourg, many Gehenna students seem to have been influenced by the 68 Revolution in Luxembourg. The 68 Revolution, named after Rikuhachima Aru's organization 'Problem Solver 68,' argues that the 'backward' local culture should be removed and the 'advanced' and liberal culture of Kivotos should be spread in this land. The logic is that if a Kivotos culture freer than Earth's takes root, it will bring freedom for women, freedom for various minorities including the disabled, and peace between humans and Kivotos Transferees.\n\nWe could allow the 68 Revolution to continue influencing students within our territory. Gehenna is already a fairly free place compared to other academies without outsiders claiming 'freedom.' Furthermore, the spread of liberal culture might give our students new inspiration. However, there's also a concern that Rikuhachima-ism, which views local culture as something savage to be removed, might provoke dissatisfaction among the locals."
 HEU_event.130.a:0 "It is forbidden to forbid!"
 HEU_event.130.b:0 "This is a too dangerous ideology."

 HEU_event.131.t:0 "Luxembourg Civil Unions"
 HEU_event.131.desc:0 "Despite opposition from many political forces and social division.... We eventually succeeded in pushing through the legislation of civil unions. The locals of Luxembourg will not forget this fact, but it is nonetheless a great cultural progress. A society where more diverse opinions can be freely discussed among citizens, a society that replaced the previous backward human culture with a more advanced culture from a century later, and a society that forbids forbidding.\n\nThis is a new victory for the revolution."
 HEU_event.131.a:0 "There were difficulties, but..."

 HEU_event.132.t:0 "The President's Worry"
 HEU_event.132.desc:0 "After the old Problem Solver 68 office was burned down by Gehenna students immediately following the Transfer, the new office of Problem Solver 68 became the Luxembourg Grand Ducal Palace. Since she had the position of Regent of the Grand Ducal House, it could be used legally, and it was actually many times larger and more luxurious than the original Problem Solver office. So much so that the 'Daily One Evil' calligraphy hanging on the wall looked out of place.\n\nBut even after obtaining the palace, Aru lived in a small studio apartment nearby and commuted to the palace every day. Of course, the palace had bedrooms incomparable to a musty studio. But those were the places where, during the Transfer, Grand Duchess Charlotte, Prince Consort Felix, and the two children of the ducal family were shot by Gehenna looters. As a Kivotosian herself, did she really have the *right* to use their home?\n\nFor over a month after the Transfer, all sorts of cleaning experts in Luxembourg wiped away the blood and organized the bedrooms. But Aru could still smell the children's blood every time she entered a palace bedroom. She preferred sleeping huddled on a studio sofa over the oversized bed in that elegant bedroom.\n\n\"Phew. I don't know why I ended up doing something like politics.\"\n\nAfter finishing her work, Aru left the palace as usual and walked alone to her studio. The other Problem Solver employees had returned an hour ago. Well, the one who stays until the very end is the President. Aru walked the night road, feeling the night wind. That day, too, Aru looked up at the night sky and counted the stars. The night sky of Europe, completely different from Kivotos, was scenery perfect for catching Aru's interest. So much so that she didn't know stalkers were behind her."
 HEU_event.132.a:0 "Why doesn't the Earth's sky have halos like Kivotos?"

 HEU_event.133.t:0 "The Ring"
 HEU_event.133.desc.a:0 "I'll ask this first. Why on earth me? I thought if the President were to like someone in Problem Solver, it would be Haruka.\n\n...I don't know. It just.... somehow turned out that way.\n\nYou don't even know yourself?\n\nAhaha, that's right. But I know for sure that I love Kayoko right now. I can feel that heart clearly. So... I thought I might be hated, but still, I wanted to confess. I wanted to convey my heart... to Kayoko.\n\nA ring.... President, if I really take this. How do you plan to explain our relationship to the other kids in Problem Solver?\n\nI, I haven't thought about the other employees. Um, maybe, everyone will understand somehow... won't they? Probably.......\n\nHehe. You seem determined and firm, yet having a screw loose is just like the usual President.\n\nDon't, don't laugh! This is a heart I conveyed after really, really thinking long and hard...\n\nI'll accept it.\n\nEh.\n\nPresident... no, Aru. Thank you for the ring."
 HEU_event.133.desc.b:0 "Hmm, Aru-chan. Is this a new play... a kind of...... it's not, right?\n\nI call myself an outlaw, but I don't play with people's hearts.\n\nYou're aware you're 'self-proclaimed,' Aru-chan?\n\nTh-that's not the important thing, is it?\n\nAru-chan's face turned red. Ahaha!\n\nDon't ruin the atmosphere! I, I came here after seriously worrying in my own way....... So, Mutsuki. If you'll accept my confession, the ring.......\n\nI'll take it.\n\nAr-are you really okay with it? Even with me?\n\nWhat. Aru-chan. Why are you flustered after confessing?\n\nNo, I didn't think you'd accept it so easily....\n\nAru-chan is always on the edge. I felt like I had to be by your side for a lo-nger time."
 HEU_event.133.desc.c:0 "I'll die.\n\nNo no no no no, Haruka, why all of a sudden!\n\nAru-sama, of all people, giving me, that ring, and confessing, to me, maybe it's an indirect way of saying I'm not needed in Problem Solver and should leave, so I don't deserve Aru-sama's love and I didn't think Aru-sama would love me, so this is a kind of test and for Aru-sama it's best if I quietly disappear-\n\nStop.\n\nAru... sama?\n\nHaruka, I won't tell you to definitely accept my love. You can refuse. But I want Haruka to love herself more, at least. I don't want Haruka to leave, or say things like dying in front of me... I really, like you. Haruka, so, because too many people have been dying and disappearing since the Transfer..., so more.... Ugh, sob, I.......\n\nAru-sama, I.... Yes....... Don't cry. I won't disappear from your side, or die. ......Is it okay if I try on the ring?"
 HEU_event.133.a:0 "An Eternal Vow"

 HEU_event.134.t:0 "Report - Operation Plan 'Exorcism'"
 HEU_event.134.desc:0 "To Speaker of Parliament Emile Reuter, at the Right Party Headquarters\n\n£white_dot Surveillance Situation Report\n\nRikuhachima Aru leaves the Grand Ducal Palace at the same time every night, just like the last report. The so-called 'Problem Solver 68' members do not accompany Rikuhachima on the night road. She seems to trust the security of Luxembourg City quite a bit.\n\n£white_dot Assassination Helper Recruitment Report\n\nWe have recruited five fascist party members. They are morons who praise Hitler, but at least they are patriotic. If they are caught, we can blame them instead.\n\nWe succeeded in obtaining pistols from French resistance fighters. However, the noise is too loud and risks attracting nearby people, and considering the physical ability of Kivotosians, it seems they should only be used as a last resort.\n\nWe succeeded in contacting a former Wehrmacht officer. He advised that considering the physical durability of Kivotosians, hitting the head intensively with tools like hammers or wrenches is more likely to effectively kill a Kivotosian than using blades like axes.\n\n£white_dot Assassination Plan Report\n\nAll preparations are finished. If the Speaker gives the word, we can send that horned red-haired demon back to the hell where she belongs."
 HEU_event.134.a:0 "Sent by an anonymous patriot."

 HEU_event.135.t:0 "The Longest Night"
 HEU_event.135.desc:0 "Day by day, the anti-Kivotos movement of Luxembourg's Nazis and Catholics grew more severe. And the Kivotos Transferees in Luxembourg were beginning to arm themselves in response. Aru left the Grand Ducal Palace, pressing her throbbing temples.\n\n\"How on earth can I mediate between the two.......\"\n\nMediation. It was a problem she never worried about as the President of Problem Solver 68 in Kivotos. A hard-boiled life where she smashed things and fired guns everywhere. But Luxembourg was different. To protect something precious, not a gun, but a bouquet of friendship was needed-\n\nSmack!\n\n\"Ack!\"\n\nThe attack came without warning. A blunt impact hitting the back of her head. At the same time, men with their mouths and noses covered by black cloth swung wrenches and hammers from all sides. A merciless attack focusing on the head. Aru felt the world spinning due to the dizziness from the concussion. 'Uh-oh?' Aru fell headfirst to the ground.\n\n\"This demon bitch is nothing special!\"\n\"Hit her more! Those halo-wearing bastards don't die from just this.\"\n\nWhat's happening? Who is doing this, and why? While being kicked in the neck and head while fallen, Aru somehow looked up at the men. Five of them. Motive? Unknown. Who sent them? Unknown.\n\n\"Y-you all, why......\"\n\nAru's words were cut off by a thick boot kicking her mouth. Her consciousness blurred. Perhaps because her neck was stepped on several times, she couldn't even breathe properly. Was her whole body paralyzed? Her fingertips trembled. It hurts. It hurts. It hurts. It hurtsithurtsithurts\n\n\"Now what?\"\n\"This is a robbery-murder. The kind of unfortunate incident that can happen anytime, anywhere.\"\n\nThe man who spoke sarcastically knelt in front of Aru. He reached his hand into Aru's tattered coat.\n\n\"Let's just take the wallet. She looks like she'll die if we leave her alone.\"\n\nWallet. The moment she heard that word, Aru's fading consciousness became clear. A treasure that the precious colleagues of Problem Solver had all gathered their small money to buy. Aru, with her last strength, grabbed the wrist of the man who was pushing his hand into her coat."
 HEU_event.135.a:0 "\"The wallet... no!\""

 HEU_event.136.t:0 "I Hate Movies with Bad Endings"
 HEU_event.136.desc:0 "Honestly, it wasn't a coincidence that Haruka found a room not too far from Aru's house. It was because she was worried whether Aru, who left work latest, got home safely. Honestly, she also had a desire to live near Aru. Therefore.\n\nBang! Bang!\n\nNot far away, between the Grand Ducal Palace and Aru's house, gunfire rang out. In that moment, Haruka felt a chilling sensation run down her spine. After the chaos of the Transfer ended, gunfire didn't erupt in late-night Luxembourg. But why?\n\nHer body moved faster than her thoughts. After running out into the street with her shotgun Blow Away, Haruka soon found a man rolling on the ground with his wrist bent in a strange direction. And other men firing pistols at the face of the fallen Aru.\n\n\"Y-you, you bastards!\"\n\nA scream of abuse, harsher than any she had ever used, erupted from Haruka. The moment the startled men turned their heads, the buckshot first blew off the head of the man holding the pistol. Bang! Haruka's emotions exploded with the buckshot. Screaming something between a cry and a shout, she ran toward Aru.\n\n\"Shit, run!\"\n\"Ack, aagh!\"\n\nWhile the other four men scattered in all directions, Haruka, covered in the man's blood, held Aru, who was huddled on the ground like a crumpled piece of paper.\n\n\"Aru-sama! Please, please...\""
 HEU_event.136.a:0 "\"Haruka... swearing is bad.\""

 HEU_event.137.t:0 "Doctor's Note"
 HEU_event.137.desc:0 "Patient Name: Rikuhachima Aru | Date of Birth: 0000.03.12.\nAuthor: Charles Marx | Date: [GetDateText]\n\nCircumstances of Accident (Based on guardian's statement): The patient complained of pain and loss of vision due to external impact from blunt weapons and bullets. She visited nearby hospitals with the guardian's help but was refused treatment at Catholic hospitals. The patient's guardian searched for a treatable doctor using a megaphone, and I, a former surgeon, performed emergency measures at the Grand Ducal Palace.\n\nExamination Findings:\n£white_dot Fracture of the right clavicle\n£white_dot Fracture of the left orbit and eye damage. No visual response in the left eye.\n£white_dot Laceration on the left scalp and fracture of the left skull.\n\nTreatment Progress:\n£white_dot There was a fracture at the top of the left skull, but it did not progress to traumatic subdural hemorrhage. Life is not expected to be in danger.\n£white_dot Emergency treatment performed on the left eye injury. Future eye removal surgery may be necessary depending on the prognosis.\n£white_dot Emergency treatment performed on the right arm.\n\nFuture Prognosis:\n£white_dot Permanent vision loss or reduction is highly likely in the gunshot-wounded left eye. Prognosis needs to be monitored.\n£white_dot The right arm cannot be used for the time being, but there will be no permanent disability.\n£white_dot Normal inpatient treatment seems impossible due to anti-Kivotos sentiment in Luxembourg. Requesting hospitalization at a military hospital referring to this note.\n\nOther: Requested Prime Minister Joseph Bech to inquire whether legal action is possible against hospitals that refused treatment for the head of state.\n\nNote returned as above.\nLuxembourg Communist Party Headquarters"
 HEU_event.137.a:0 "The note was sent to the Luxembourgish military."

 HEU_event.138.t:0 "Interview with the Military Doctor"
 HEU_event.138.desc:0 "Your Highness Regent, did you sleep well last night? Yes. I'm glad. We've monitored the prognosis since Your Highness was hospitalized. First, look at this document.\n\nThe progress of the arm and head injuries is not severe. That Communist doctor did the initial emergency treatment well. If left alone, the arm injury could have worsened. The horn on the neck... it's also fine. If you feel stiff, I'll prescribe a separate painkiller. Since Kivotosians seem to have tougher physical durability than locals, you don't need to worry about the arm.\n\nHowever...... Yes. Your Highness also knows. The left eye....... Yes. ......It is as you said. We have made every effort, but there is no possibility of the left eye's vision returning at present. And if the ruptured eye is left alone, it could affect the vision of the right eye, so currently, the left eye...... yes. You will have to have it removed.\n\n......Yes. As you requested, I have not mentioned this to your colleagues in Problem Solver 68. Yes. ......I will look for a way to hide the use of a prosthetic eye after the surgery. It might be impossible with Luxembourg's prosthetic technology, but it might be possible with other Kivotos nations that crossed over during the Transfer.\n\nThat's right, Your Highness. Currently, we are considering cooperation with the Millennium medical team. But no reply has come yet. ......Understood. Even if the arm and head are minor injuries, the clavicle is a delicate area. Do not remove the bandage on your right arm, and rest as much as possible during the hospitalization. Yes. I'll let you know after receiving contact whether cooperation with Millennium is possible. Your Highness Regent. Good job with the treatment. Please rest in the hospital room."
 HEU_event.138.a:0 "Aru wept silently as she left the treatment room."

 HEU_event.139.t:0 "Luxembourg's Request for Medical Cooperation"
 HEU_event.139.desc:0 "To the medical team in Verdun City, Millennium Academy,\n\nRecently, Her Highness Rikuhachima Aru, Regent of the Grand Ducal House of Luxembourg and representative of the civic organization 'Problem Solver 68,' suffered an unfortunate attack. Inpatient treatment was performed at our military hospital, but there is no improvement in the eye rupture, and surgery to remove the left eye is necessary.\n\nHer Highness wishes to hide from her friends in Problem Solver 68 that she received an eye removal surgery. However, with the technology of the Grand Duchy of Luxembourg, we cannot create a prosthetic eye identical to a real eye. We wish to cooperate with the Millennium medical team, famous for its outstanding scientific technology, to create a realistic prosthetic eye that moves exactly according to Her Highness's gaze, so we request medical cooperation.\n\nIf you agree, the Grand Duchy of Luxembourg will not forget the favor and will provide sufficient financial compensation including travel expenses, prosthetic production costs, and fees. Please reply to the military hospital in Diekirch City, Luxembourg.\n\nSent by the Luxembourg Military, Diekirch Military Hospital"
 HEU_event.139.a:0 "Let's make a prosthetic eye and earn some money too."
 HEU_event.139.b:0 "Rikuhachima Aru? To think that self-proclaimed outlaw became one-eyed, let's just laugh at her."

 HEU_event.140.t:0 "Millennium-made Prosthetic Eye"
 HEU_event.140.desc:0 "\"Aru-chan! Is your eye okay now?\"\n\"Well, as you can see. Getting knocked out just from being hit a few times at night isn't like a hard-boiled outlaw.\"\n\nAru laughed as she received the chocolate box from Mutsuki, who came to visit her. Chocolate as a hospital gift. Well, it's better than tasteless hospital food.\n\nWhile Aru was away from the palace, Problem Solver 68 employees were coming to visit her every day in rotation. Those who didn't come were sharing and doing the work Aru originally had to do. It was a grateful thing. Aru blinked her eye, half of which was invisible, and looked at Mutsuki, who was chatteringly telling stories about what happened between the Problem Solver employees yesterday.\n\nThe lost eye wouldn't return. But it was much better than knowing her friends in Problem Solver, no, her friends, would be sad if they knew she had gone blind. Besides, she could still see Mutsuki's beaming smile with half of her vision.\n\n\"What's wrong? Aru-chan. Why are you suddenly staring at my face?\"\n\"No, just. Because I'm glad Mutsuki came.\"\n\"Hehe.\"\n\nMutsuki sat down in the hospital room chair with a giggle. No matter what anyone said, Aru was happy that day."
 HEU_event.140.a:0 "Mutsuki really didn't notice the prosthetic eye, right?"

 HEU_event.141.t:0 "An Ordinary Prosthetic Eye"
 HEU_event.141.desc:0 "She wanted to cooperate with Millennium, but heard it didn't go well. In the end, the prosthetic eye had to be made internally in Luxembourg. It clearly looked identical to a real eye on the outside, but since the prosthetic didn't move according to Aru's gaze, anyone who watched for even a little bit could tell it was a prosthetic eye.\n\n\"Ugh, sob. I'm sorry. I'm sorry. If I had only come a bit faster, just a bit faster that day.......\"\n\nOf course, there was no way she could deceive her friends in Problem Solver 68. Aru had to tell Haruka, who came to visit, that she had received an eye removal surgery. Aru hugged Haruka, who burst into tears like a child who lost a family member.\n\n\"It's okay. Because I still have Haruka. Haruka just has to see more of the world for the part I can't see.\"\n\nLooking up, she saw Haruka in half of her vision, with tears dripping down.\n\n\"Yes. Aru-sama, I will always be by your side, continuously....... I will see the things Aru-sama can't see and tell you. So. Sob, sob, waaaah......!\""
 HEU_event.141.a:0 "Haruka cried for a long time after that."

 HEU_event.142.t:0 "Luxembourg Civil War Crisis"
 HEU_event.142.desc:0 "To Her Highness Regent Rikuhachima,\n\nWith the help of Problem Solver 68, we arrested four of the mobs who attacked Your Highness. They are pro-Nazi Germans, and the motive for this incident also seems to be based on Nazi racism. They claim they only acted after receiving money from another financier, but that seems unreliable since they can't name the financier.\n\nAfter Your Highness was attacked, the racial conflict in Luxembourg has reached its peak. Angry Gehenna-types and fascists fought a street battle in Luxembourg City, and civilian deaths have already occurred. Today is the first time a violent confrontation between the two ethnic groups occurred in Luxembourg City since the tragedy immediately following the Transfer. While the number of casualties is still under 10, it is feared that the damage will increase to double digits or more if Your Highness does not intervene.\n\nPlease give quick instructions. We can prosecute the fascists for the assassination plot against Your Highness and for high treason, and instead soothe the angry Kivotosians and send them home.\n\nAlternatively, even if our military attacks those Nazi survivors before the Kivotos mobs and kills them all, we can prevent a bloodbath. I think this choice could ease the feelings of the Kivotos population a bit more. Since those fascists committed high treason by attacking Your Highness anyway, they wouldn't be able to avoid the death penalty even if they went through a trial. However, there's a concern that our government will be criticized by other fascists for a Nazi cleanup without a trial.\n\nSince the riot is intensifying, there is no time for long deliberation. If Your Highness decides, I will deploy the military immediately.\n\nEmile Speller, Commander of the Gendarmerie"
 HEU_event.142.a:0 "Let's go with a trial. I can't easily choose to kill a person..."
 HEU_event.142.b:0 "...You may kill them..."

 HEU_event.143.t:0 "You'll Need an Official Car"
 HEU_event.143.desc:0 "In Kivotos, it wasn't illegal for students to drive cars. She had seen people driving in the Gehenna School Lunch Club and had seen the Cronos School broadcasting car several times. But Aru had never driven a car. Honestly, because she didn't have money. But the situation has changed.\n\nKayoko said abruptly as soon as she sat on the sofa opposite Aru.\n\n\"The President also needs to buy a car now. You can't keep walking to work.\"\n\"...What's this all of a sudden?\"\n\"Because you walk to work, a terrorist could easily try to kill the President. If you were in an armored car, you wouldn't have been hit by a hammer.\"\n\nMutsuki also sat down next to Kayoko.\n\n\"I also vote for Kayoko-chi on this. ...Aru-chan. If it's because you can't drive, hire a driver. We have the money for that now, don't we? All the national money is Aru-chan's.\"\n\nThe opinions of the two were in agreement. An official car. Driving a car wasn't familiar, but in this situation, it seemed she had no choice but to drive.\n\nKayoko said, \"But since the citizens of Luxembourg also have animosity toward the Kivotos-types, it would be rational to buy an Italian car.\"\n\nIn that moment, the smile disappeared from Mutsuki's face. \"...What? Humans hit Aru-chan's head with a hammer, but you want to buy an Earth car for those *citizens*?\"\n\"I merely stated a rational opinion considering local public sentiment.\"\n\"It's not rational, you're treating Aru-chan like a fool. We should be more confident and buy a Gehenna-made car in the first place.\"\n\"Mutsuki. That's not being confident, it's putting the President in danger. If anti-Gehenna sentiment is provoked and a terror attack occurs again...\"\n\"Ah, you're threatening us with Aru-chan's life?\"\n\n\"Uh? You two?\"\n\nSuddenly, the atmosphere in the office turned cold. Mutsuki and Kayoko glared at each other as if they would grab each other's collars at any moment. A flustered Aru stood up, breaking into a cold sweat.\n\n\"Wait, wait. Wait a minute. I'll decide about the car! I'll decide, so just calm down first...!\""
 HEU_event.143.a:0 "\"A Gehenna car will be fine! Yes, surely there won't be a problem with a car, right?\""
 HEU_event.143.b:0 "\"Let's go with an Italian car this time. Kayoko is the brain of our Problem Solver, after all.\""

 HEU_event.144.t:0 "The First Collaborator"
 HEU_event.144.desc:0 "Communist Party? Communism? Aru still doesn't know much about them. The reason it's not 'completely' unknown is that Kivotos also has the Red Winter Academy. A system that likes a dictator with a mustache and has equal people and a bit more equal people. Well, the so-called communism on Earth won't be much different from Red Winter. They aren't decent people.\n\nStill, that day, when the Catholic hospitals that said 'love your enemy' locked their doors, the only person who came out with a medical bag at the words of the Problem Solver friends, who were crying and screaming through megaphones to treat Aru, was—a doctor who was a member of the Luxembourg Communist Party.\n\nCharles Marx, a politician met again at the Communist Party headquarters, looked up and down at Aru who entered the office.\n\n\"Holding the aristocratic status of a Regent, you come alone to the Communist Party headquarters without guards? Aren't you afraid?\"\n\"I'm coming to see the person who treated me, why should I be afraid?\"\n\nMarx, seemingly flustered by Aru's dim-witted words, stopped the other people in the headquarters who were about to get up.\n\n\"Truly amazing naivety. I'd even like to applaud. Let's go out and talk first.\"\n\"What? Is there something I don't know? Are you afraid that I'm here?\"\n\n\"Afraid? This is crazy. If I explain Marxism-Leninism and monarchy...... Haa, fine. I'm not a Kivotos teacher, what would I teach our great Highness Regent?\"\n\nMarx spoke sarcastically and left the headquarters with Aru.\n\nMarxism-Leninism? Aru recalled her memories. She had heard vaguely about communism, but she didn't remember that strange name with two people's names attached. Of course, it wasn't important. The reason Aru went to find him now was something else.\n\n\"I wanted to ask this. Why did only you treat me when everyone else refused my treatment that day?\"\n\"Were you curious about that? So you came alone to our headquarters?\"\n\"An outlaw is someone who doesn't forget manners toward a person who helped. I also wanted to say thank you.\"\n\"......It's nothing to be thankful for. I wouldn't have gone to find you if it weren't for the memories of that damn Transfer.\"\n\nMarx took out a cigarette from his pocket and bit it."
 HEU_event.144.a:0 "\"Being a doctor who just stares at a person dying of terror is enough for just the day of the Transfer...\""

 HEU_event.145.t:0 "Cooperation with the Communist Party"
 HEU_event.145.desc:0 "Through the conversation with Charles Marx, she could learn more about the minor political party called the Luxembourg Communist Party. The office is small and musty, and a portrait of Stalin—someone who strangely resembles Cherino—hangs on the wall. The approval rating is not very high, and it was just a handful of a small party compared to the existing ruling Right Party.\n\nHowever, she could also see that the Luxembourg Communist Party was the only political organization in Luxembourg that *recognized the rights of Kivotosians*.\n\n\"All workers must be liberated. Whether they are female or male, whether they have a halo on their head or not.\"\n\nAmong all the political parties in Luxembourg, the only party that had 'Kivotosian Human Rights' written in its party platform was the Luxembourg Communist Party. Aru, who investigated all the parties in Luxembourg, could clearly see that.\n\nHowever, she couldn't deeply understand the specific concepts of 'Communism' or 'Marxism-Leninism.' How could she immediately accept concepts like the labor theory of value or democratic centralism that didn't even exist in Kivotos? It wasn't easy for Aru, an excellent 'entrepreneur' and manager, to understand a completely new ideology.\n\nWell, aren't humans also failing to understand Kivotos's academy nations, MomoTalk, or popular culture like rock music? What was important was that the only beings who could help with the rights of Kivotosians right now were these strange friends in the Communist Party.\n\nIt seemed these people wouldn't betray Aru. And it seemed they would fight for Kivotosians."
 HEU_event.145.a:0 "I won't be wrong. Yes, definitely."

 HEU_event.146.t:0 "Free Luxembourg Brigade"
 HEU_event.146.desc:0 "As the Grand Duchy of Luxembourg faced invasion from the outside, a small militia called the 'Free Luxembourg Brigade' was organized by those voluntarily willing to defend Luxembourg. The person leading them is Viktor Bodson, a socialist with anti-Nazi sentiment and a prominent human rights activist who led the Jewish escape movement in Nazi Deutschland.\n\nAlthough Bodson is not an outstanding commander, his will to protect Luxembourg from invaders is firm. The Free Luxembourg Brigade and Bodson will be incorporated into the Luxembourg regular army and will be under the command of Rikuhachima Aru."
 HEU_event.146.a:0 "Solidarity for Freedom"

 HEU_event.147.t:0 "New Coup Plan"
 HEU_event.147.desc:0 "\"She doesn't die even when hit with a hammer? What on earth is that Rikuhachima woman?!\"\n\nAt the Right Party Headquarters. Speaker of Parliament Emile Reuter tore at his hair a few times and vented his anger, then looked back at the other 'hardline' Right Party members.\n\n\"If assassination doesn't work, let's use another method. Her position is 'Regent' anyway. If we find a legitimate successor to the Grand Duchy, she will naturally have to lay down all her authority.\"\n\nAt Reuter's confident words, Right Party politician Jean Origer said sarcastically.\n\n\"The House of Nassau died out without a single person left, where are you going to find a legitimate successor? The only way left is to turn over even the urns.\"\n\n\"You shouldn't say such rude things even as a joke! ...Did you forget that Prince Felix, the consort of Her Highness Charlotte, was from the House of Bourbon?\"\n\nReuter looked back at the other members and said.\n\n\"Prince Felix was also a member of the Grand Ducal House...... So theoretically, a successor to the Grand Ducal House can be found in the House of Bourbon. After finding a successor abroad, we abruptly propose an amendment to the succession law and change the Grand Duke.\"\n\nAt the mention of the House of Bourbon, the murmuring among the members grew louder.\n\n\"It certainly seems like a good idea...\"\n\"His Highness Javier I, the brother of the Prince Consort, could be the legitimate successor in this case, but he is the leader of the Spanish *Carlists*. Are you planning to sell the country to Spain?\"\n\"Selling the country! What a reckless thing to say. We're not doing a personal union, we just need that person to hand over the Carlist leadership and come to Luxembourg.\"\n\"A person claiming the Spanish throne is going to abandon Spain and come to Luxembourg?\"\n\"That's... something we won't know until we contact them!\"\n\"My goodness. So the practicality...\"\n\nThe meeting room became noisy with the endless armchair deliberation of the members."
 HEU_event.147.a:0 "The coup plan hit an unexpected reef."

 HEU_event.148.t:0 "Civil Rights Act Plan"
 HEU_event.148.desc:0 "She suffered many painful things in Luxembourg after the terror incident. She had the experience of her halo almost being destroyed for the first time in her life, and it became impossible to see out of one eye forever. Her right arm, which the hospital said would be fine because it was a minor injury, trembled with muscle spasms just from holding a pen.\n\nStill, Aru couldn't completely let go of hope for humanity. She felt that if they compromised and understood each other, everyone could reconcile and live together in this land. Because there was that doctor who came to find her, someone he didn't even know, to save her. She could have faith that not all humans hate Kivotosians.\n\n\"So, I want to make a law. I want to find a way to save the rights of Kivotosians while respecting the system of this country by persuading the parliament. The Right Party might not allow it, but if we change public opinion......\"\n\nBut not everyone agreed with Aru's words. Mutsuki was especially so.\n\n\"Aru-chan. Do you still trust *humanity*? Do you want to trust those people who hammer your head and shout at us, the ones who saved Luxembourg, to get out? ......Why on earth should we kneel before the local adults and beg them to make a law? Why should Aru-chan 'request' something from those people?\"\n\nInitially, it was her usual playful voice, but Mutsuki's words burned hotter toward the end. Since the incident where Aru was almost murdered, Mutsuki's distrust of humans was growing.\n\nAru could also understand Mutsuki's heart. They were long-time friends. She understood at least that she was worried about Aru. But.\n\n\"Mutsuki-chan. Just once, give me just one chance. I'm the President of Problem Solver, right? ......I'll change people's hearts by holding a public debate. If it goes well, I might not even need to visit the parliament, and public opinion might make the law?\"\n\nAru said that and gave a beaming smile. That confident smile. How could Mutsuki refuse after seeing that smile?"
 HEU_event.148.a:0 "\"Sigh. Fine, Aru-chan. Just this once.\""

 HEU_event.149.t:0 "The Fateful Debate"
 HEU_event.149.desc:0 "\"I'll be able to change people's hearts through the debate.\" At Aru's confident words, Kayoko let out a deep sigh.\n\n\"Logically analyzing it, the President's plans usually start out grandly and end up plummeting to the bottom as a rule.\"\n\"Are you saying something so ominous before we even start?!\"\n\"......I merely stated a statistic based on facts.\"\n\"Ugh, I hate statistics!\"\n\"That's not something to come out of a manager's mouth, President.\"\n\nWhile the small argument with Kayoko continued, Mutsuki chuckled and slammed a stack of documents onto the executive desk.\n\n\"Ta-da! For Aru-chan, I've secured the debate location, a live broadcast on the station, and even a debate opponent!\"\n\"L-live broadcast?! A live show?!\"\n\"Eh, what. Aru-chan. You confidently said 'I'll persuade all the locals.' ...Are you afraid of a live broadcast? Even though you're a *hard-boiled* outlaw?\"\n\nThe smile floating on Mutsuki's lips. Aru gulped. I'm scared! It means the whole country will watch my debate from start to finish!?\n\nBut if it's not a live broadcast... she wouldn't even be able to persuade people, right? Aru, with trembling hands, received the broadcast schedule documents Mutsuki handed over.\n\n\"Ahaha, what are you saying? That I, the President of Problem Solver 68, the Rikuhachima Aru! Would be afraid of something like a live broadcast debate? I'll go on the broadcast confidently! I'll win confidently! And I'll confidently charm the public opinion of Luxembourg's citizens to be mine!\"\n\nIn that moment, the smile disappeared from Mutsuki's lips.\n\n\"Yeah. If you succeed, I'll let you do whatever you want, Aru-chan. ......If you can persuade them with this debate.\"\n\"Mu...tsuki-chan? Your expression is a bit scary?\"\n\nMutsuki immediately smiled broadly.\n\n\"What expression? Ahaha, why. You're not pretending to be not scared while you actually are, right?\"\n\"It's really not that! I'll, I'll do well at the debate! Yes!\""
 HEU_event.149.a:0 "...It'll be fine, right?"

 HEU_event.150.t:0 "Public Debate on the Civil Rights Act"
 HEU_event.150.desc:0 "The Civil Rights Act debate was decided to be held in several sessions. Especially, a political debate with Damian Kratzenberg, the head of GEDELIT—a name that grandly packages Luxembourg's National Socialism/Nazism. Even so, it doesn't change that it's Nazi—will be held first, and the schedules for debates with populist right-wing politician Pierre Prüm and Luxembourg's Catholic conservative Emile Richter were also set.\n\nThe names of all those important Luxembourgish figures are not what's important. What's important is that all these debates will be broadcast on Luxembourgish TV and sent to the entire nation, and they will lead public opinion. Since the ruling Right Party is currently opposing the Civil Rights Act, Aru's only hope is to pressure the Right Party with the power of the people so that they cast a vote in favor. It certainly wasn't an easy task. But who would do that difficult thing if not Aru?\n\n£white_dot Public debates consist of a battle between the §Bsupport§! for the Civil Rights Act and §Ropposition§! to the Civil Rights Act. If one side's support reaches 0 before the debate ends, the opponent wins. However, if neither side's support reaches 0 by the end of the debate, the side with higher support wins. (In case of a tie, it is considered Aru's victory.)\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.150.a:0 "Aru entered the broadcast studio where many people had gathered."

 HEU_event.151.t:0 "Public Debate on the Civil Rights Act - Phase 1"
 HEU_event.151.desc:0 "Kratzenberg was passionate and, with a provocative arm gesture reminiscent of Hitler, strongly pressured Rikuhachima Aru from the start.\n\n\"All of our Luxembourgish citizens saw for themselves what kind of savage behavior the Kivotos-types committed during the Transfer. They fired guns like a joke and burned Luxembourg City as if the Transfer itself were a festival.\"\n\nKratzenberg spoke after giving the audience a moment to recall the time of the Transfer.\n\n\"What about what happened in the Grand Ducal Palace? The youngest daughter of the Grand Duke was only *six years old*. The only people who have done such savage things historically are about the *Bolsheviks*. Just as the Bolsheviks committed massacres in Russia, Gehenna did the same in Luxembourg.\"\n\nKratzenberg's voice grew louder and louder, and did not stop even after his allotted time given by the moderator ended and the microphone power was cut.\n\n\"They are murderers! To accept those who killed our families and assassinated the Grand Duke and his family as brothers? Even Christ would not have done so! Yet, how dare you, a Civil Rights Act!\"\n\nMurderers. Assassination. Hearing those words, Aru recalled the sight of Luxembourg City she saw immediately after the Transfer. The bloody corpses, that something she saw in the Grand Ducal Palace. The words she said while pretending to be composed in front of it: 'It's okay, Mutsuki. I'm fine.' Was she really fine? Aru felt sweat build up in her palms.\n\nThe moderator hurriedly said, cutting off his words. \"Yes. First, we heard the opening remarks of Damian Kratzenberg, Chairman of the German Literature Association. We will give Her Highness Rikuhachima time for a rebuttal.\"\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.151.a:0 "Aru attempted to refute his words with logic..."
 HEU_event.151.b:0 "Aru attempted to refute his words with emotion..."
 HEU_event.151.c:0 "...She was speechless! Aru's vision went white!"

 HEU_event.152.t:0 "Public Debate on the Civil Rights Act - Phase 2"
 HEU_event.152.desc:0 "After Aru's rebuttal, Kratzenberg's speaking time returned. He adjusted his suit sleeves and nodded skillfully.\n\n\"Of course, Her Highness Rikuhachima might refute the riots during the Transfer that way. But the *problem* is not just the riots that happened during the Transfer. The Transfer riots were just the first case showing the cultural reasons why our humanity cannot coexist with Kivotosians.\"\n\nKratzenberg slowly looked around at the audience.\n\n\"Immigrants from Gehenna first take out guns and flashbangs when a dispute arises. They think very lightly of firing guns when they fight each other. Yes. Because they are physically *stronger* than ordinary humans. A culture of resolving disputes with gunfire could easily arise.\"\n\nAfter a short silence. Kratzenberg raised his voice again.\n\n\"But what about from our *human* perspective? They are nothing more than potential mass shooters at best. A race that shoots each other over a couple of arguments. A race where aiming guns at each other is considered a joke. Wasn't it that savage combat instinct that caused the massacre during the Transfer in the first place? So, can our humanity coexist with such a dangerous race? The citizens will know the answer.\"\n\nA culture where shooting each other is natural. Aru herself knew it because she lived in such a world, Kivotos. Even though they fell to Earth where mystery is thin and physical ability is much lower, the Kivotosian culture itself didn't change in a short time. Aru repeated in her heart. 'Then how can I persuade them that Kivotosians can coexist with humans?'\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.152.a:0 "Aru attempted to refute his words with logic..."
 HEU_event.152.b:0 "Aru attempted to refute his words with empathy..."
 HEU_event.152.c:0 "...She was speechless! Aru's vision went white!"

 HEU_event.153.t:0 "Public Debate on the Civil Rights Act - Phase 3"
 HEU_event.153.desc:0 "After the debate with Kratzenberg, the next debate was with Pierre Prüm. A few days later, Aru, on the broadcast studio again, noticed that much more cameras were looking at her than before. It wasn't just Luxembourg's broadcasting station. Now Aru's debate had become an issue that other academy nations were watching. 'My hard-boiled wasn't like this... I'm a complete celebrity!' Even if she complained in her heart like that, no one listens anymore.\n\nPrüm, who had performed the Prime Minister's duties in the past but is now an executive of the Luxembourgish Nazi organization GEDELIT, seems to be focusing on increasing his national support through this broadcast. Especially, Prüm himself did not believe in Nazism, but he knew that the votes of citizens who believe in Nazism are quite 'sweet.'\n\n\"It is fundamentally true that a person is hard to mix with a heterogeneous being. Especially if it's a race reminiscent of the demons in the Bible.\"\n\nPrüm took out a German Bible from his bag and held it high.\n\n\"Demons' horns, wings, and some even have tails. We have considered such beings as demons for *two thousand* years. Didn't they actually act like demons? We all saw how they again tore Deutschland, which was being rebuilt from ruins after the war, into pieces.\"\n\nPrüm was talking about Deutschland, which was warlordized by the Pandemonium Society and the Prefect Team. Aru also knew from knowledge she heard that it was one country before the Transfer.\n\n\"To all the gentlemen of Luxembourg. We must learn from the collapse of Deutschland. These are not *humans*. They are just horned demons from a phrenological standpoint. If we give rights to demons, they will destroy our Luxembourg like Deutschland.\"\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.153.a:0 "Aru attempted to refute his words with logic..."
 HEU_event.153.b:0 "Aru attempted to refute his words with emotion..."
 HEU_event.153.c:0 "...She was speechless! Aru's vision went white!"

 HEU_event.154.t:0 "Public Debate on the Civil Rights Act - Phase 4"
 HEU_event.154.desc:0 "After that insulting mockery called 'demons,' several Gehenna audience members were dragged out for making a commotion. The atmosphere of today's broadcast was quite sharp. Prüm연 spoke in a theatrical tone toward the Gehenna students whose arms were held as they were dragged out.\n\n\"Look! They are confessing themselves that they have hearts close to demons!\"\n\nAru let him talk noisily. It was easier not to care about the illogical demon-hunting.\n\n\"Let's talk about something else. I am consistently explaining why Kivotosians and humans cannot mix. And for Kivotosians, it's not just the appearance and heart that are problems. Their another problem is that Kivotos is close to a matriarchal society.\"\n\nPrüm, as a right-wing populist, knew best what the crowds casting votes for fascists wanted. A strong man who doesn't lose to a woman.\n\n\"Kivotosians and humans are employed equally, and have all jobs equally. This means men will be able to be commanded by a horned female commander, and it also means the day might come when men obey the laws made by women in a parliament composed of women.\"\n\nPrüm looked dumbfounded.\n\n\"Various civilized societies of Europe acknowledge that women are more emotional and have lower logical reasoning ability than men. Yes. Based on academic evidence such as Mr. Carl Jung's psychoanalysis, various civilized nations like the French Republic and the Swiss Confederation strictly limit women's participation in voting.\"\n\nSo, it means rights shouldn't be given to Kivotos, which is a matriarchal society. Aru recalled his words for a moment. It's an absurd claim to Aru. But would it be so for the locals too? A very logical, or an emotional important word was needed more than ever.\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.154.a:0 "Aru attempted to refute his words with logic..."
 HEU_event.154.b:0 "Aru attempted to refute his words with sarcasm..."
 HEU_event.154.c:0 "...She was speechless! Aru's vision went white!"

 HEU_event.155.t:0 "Public Debate on the Civil Rights Act - Phase 5"
 HEU_event.155.desc:0 "The last debate was held again three days later. This debate was personally attended by Speaker of Parliament Emile Richter, a senior conservative politician of the Right Party. Fitting the name of the last debate, numerous audience members gathered, and Problem Solver colleagues including Mutsuki sat in their seats with heavy expressions. Aru knew this debate would greatly influence public opinion. She also knew that Richter wasn't that positive about the Civil Rights Act.\n\n\"...I know Your Highness Regent has done so many things for Luxembourg. How could I not know Your Highness's achievement in preventing the Luxembourg massacre?\"\n\nEven while saying that, Richter's expression wasn't bright.\n\n\"...But while many rural farmers might trust Your Highness, they do not trust Your Highness's subjects. The Gehenna-type population that swarmed into their old lands, occupied territory, and claimed their rights. Especially, aren't they the ones who committed a shooting spree in Luxembourg City?\"\n\nAru knows that his argument is fundamentally correct. The Kivotos-types were foreigners after all. Aru couldn't deny that fact. Richter continued very carefully, yet firmly.\n\n\"Kivotosians and locals must certainly live in coexistence. However, the Civil Rights Act is premature at this point. Until the resentment toward the Gehenna-types disappears, enacting this law will only be seen as discrimination against the locals and it will only be seen as Your Highness coddling the outsiders who 'squatted' on this land. The Germanic people have lived on this land for thousands of years. Of course, I can't tell you to wait for that much time, but can't you wait with at least enough patience for a generation to be replaced?\"\"\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.155.a:0 "Aru attempted to refute his words with logic..."
 HEU_event.155.b:0 "Aru attempted to refute his words with sarcasm..."
 HEU_event.155.c:0 "...She was speechless! Aru's vision went white!"

 HEU_event.156.t:0 "Public Debate on the Civil Rights Act - Phase 6"
 HEU_event.156.desc:0 "Richter, as a senior politician, knew well what his supporters wanted. 'The locals do not agree with that claim'. Instead of bringing logic about whether the Civil Rights Act is right or wrong, he is claiming that 'policies that the people do not want should not be implemented'. Aru didn't have deep knowledge of local politics, but she knew Richter was using quite a bizarre trick. He wasn't even a democrat in the first place, was he?\n\n\"...Your Highness. What we must be careful about is the shock this Civil Rights Act will give to neighboring countries. Because of the Transfer, State Chancellor Adolf Hitler of the neighboring Deutschland died, and government agencies of the Netherlands and Belgium had to exile abroad. As Luxembourg is a sovereign state belonging to the League of Nations, we have no choice but to be very cautious about legally guaranteeing rights for the Kivotos-types. If the British ambassador, or the Belgian ambassador, asks this: Why is the Luxembourg parliament putting a laurel wreath on the heads of the invaders? Aren't you ashamed before the names of Deutschland, Britain, Sweden, Netherlands, Belgium, Austria, and Norway?\"\n\nRichter held his two hands slightly high, as if performing a play.\n\n\"Someday, the two nations must reconcile. But that is not today. The Lord said in 1 Thessalonians 5:22 to reject every kind of evil, which means that even if siding with the invaders seems like a very attractive option, we must reject it until true justice is realized on European land.\"\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.156.a:0 "Aru attempted to refute his words with logic..."
 HEU_event.156.b:0 "Aru attempted to refute his words with sarcasm..."
 HEU_event.156.c:0 "Aru attempted to refute his words with empathy..."
 HEU_event.156.d:0 "...She was speechless! Aru's vision went white!"

 HEU_event.157.t:0 "Public Debate on the Civil Rights Act - Phase 7"
 HEU_event.157.desc:0 "The Civil Rights Act debates, totaling 3 sessions, were broadcast throughout Luxembourg and even to other academy nations. This debate showed many citizens that Rikuhachima Aru has the ability to express her arguments more logically than expected. But the problem is how many people Aru persuaded. If the support for the Civil Rights Act is not high enough, they won't have the influence to pressure Luxembourgish politicians.\n\nNow Rikuhachima Aru, having finished all the debates, returns to her home, just waiting for the announcement of the public opinion poll on the Civil Rights Act while resting. There is nothing more Aru can do.\n\nSupport §Bfor§! the Civil Rights Act: [?benriya_debate^0]\nOpposition §Rto§! the Civil Rights Act: [?benriya_debate^1]"
 HEU_event.157.a:0 "Just waiting for the results..."

 HEU_event.158.t:0 "Public Opinion Poll Announcement"
 HEU_event.158.desc:0 "After the public debate ended, a public opinion poll targeting Luxembourgish citizens was conducted. The results of this poll, conducted very carefully using various methods with samples, was......\n\nPublic opinion changed significantly due to the unexpectedly cold appearance Aru showed at the debate, and the news was that the majority of Luxembourgish citizens now support the Civil Rights Act. A massive turnaround in public opinion! Even the conservatives of the Right Party, who had doubts about the passage of the Civil Rights Act, had no choice but to watch the public opinion.\n\n\"This is true charisma! This is the leadership that only I, the President of Problem Solver 68, possess! Uhuhu!\"\n\nThe appearance of Aru laughing while waving the newspaper. It's been a long time since she had such a happy smile after the last assassination attempt. Haruka sent celebratory applause toward her who had become bright.\n\n\"Aru-sama! I really believed Aru-sama would pull it off!\"\n\nKayoko let out a sigh.\n\n\"Well, we succeeded in making public opinion on our side somehow. I don't know yet if this Civil Rights Act will function properly.\"\n\n\"I have to make it function properly! Because my goal is to stop the conflict between the two nations on this land. I have a method I've thought of.\"\n\n\"A method you've thought of?\"\n\n\"In Luxembourg, there are people who claim the rights of Kivotosians! If I ask the Communist Party to help, everything will be solved!\""
 HEU_event.158.a:0 "That day, Aru slept comfortably for the first time in a long time."

 HEU_event.159.t:0 "Public Opinion Poll Announcement"
 HEU_event.159.desc:0 "After the public debate ended, a public opinion poll targeting Luxembourgish citizens was conducted. The results of this poll, conducted very carefully using various methods with samples, was......\n\nFailure. Despite Aru's desperate efforts, the public opinion on the Civil Rights Act did not change significantly.\n\n\"I guess thinking I could achieve something, or having such a thought in the first place, was a mistake.\"\n\nThe plan to pressure the Right Party with the power of public opinion also ended. A dejected Aru slumped over her desk with a limp expression like an octopus thrown out of water.\n\n\"Well, there are days like this when Aru-chan loses. Ahahat.\"\n\n\"It's not a matter to end with an 'Ahahat'!\"\n\nBang! Aru slammed the desk in Mutsuki's direction, who was laughing.\n\n\"Somehow...... a way for people to live together in this land...... I tried to find it......! I...... but, I can't do anything...... failing...... failing again and failing\"\n\n\"Aru-chan. Do you know your current state looks quite serious?\"\n\nThe smile disappeared from Mutsuki's face. She let out a short sigh and stood up.\n\n\"A world where everything flows only as Aru-chan wants? Didn't you learn in Kivotos too that such a thing doesn't exist? We lost. Aru-chan. Now we have no choice but to find Plan B.\"\n\n\"Something like that, I've never even thought of it......\"\n\n\"It's okay. For now, Kayoko-chan and I will do something. Right now, Aru-chan needs rest.\""
 HEU_event.159.a:0 "Something like rest, there's no way I can take it."

 HEU_event.160.t:0 "Aru's Plan"
 HEU_event.160.desc:0 "\"The commies are participating as the ruling coalition this time? Those guys aren't even a parliamentary party?\"\n\nPrime Minister Joseph Bech, who received a phone call at the Right Party headquarters, spoke in a tone as if it were absurd. A short sigh of member Pierre Dupont was heard over the receiver.\n\n\"Her Highness Regent believes that for the management and maintenance of the Civil Rights Act, the Communist Party, which is most sympathetic to the Kivotos-types, must participate in the government. As the opposition to the Civil Rights Act from our party was so loud, Her Highness is very concerned about whether the law will be properly implemented.\"\n\n\"But of all the parties, it's the commies! Oh, for fuck's sake.\"\n\nJoseph Bech felt a headache coming on. Stalinists entering the government under the pretext of protecting the Civil Rights Act? The Bolsheviks were the ones who slaughtered the Romanov imperial family during the 'Russian riot.' Is there no way they won't do the same to the Right Party if their power grows?\n\nBut it was clear that the center of power right now was Aru, not Bech. If Aru's opinion is firm, he probably won't be able to oppose it.\n\n\"Sigh. I'll agree for now. Instead, we'll have to make sure those commies can't touch politics other than the Civil Rights Act as much as possible. Let's have a meeting at the headquarters tomorrow.\""
 HEU_event.160.a:0 "Aru's own plan is toward success."

 HEU_event.161.t:0 "Ruling Coalition"
 HEU_event.161.desc:0 "For the Communist Party, today was the best day. They rented a whole bar, and beer and bratwurst were placed in front of everyone. Communist Party leader Zénon Bernard spoke in an excited voice, standing on a chair.\n\n\"The stupid horned woman called us into the ruling coalition! Haha! Let's decide to send that retard peacefully without pain once Luxembourg is revolutionized.\"\n\n\"Hahaha!\" \"Let's do that!\"\n\nIncorporating the Communist Party into the ruling coalition to manage the Civil Rights Act. That would have been the extent of Aru's thought, but as the head of a monarchical state, does she understand what 'Marxism-Leninism' is? Between Communist politicians and aides, excited laughter and sarcasm-mixed ridicule toward Aru flowed out.\n\nIn the meantime, Communist politician Charles Marx broke everyone's laughter.\n\n\"Listening to you, one would think our revolution has already finished. Now is not the time to be too happy.\"\n\nThe laughter in the bar stopped at his firm tone.\n\n\"Well, of course, the party platform that Rikuhachima is ultimately just a feudal monarch remains unchanged, but let's step on the brakes a bit. Don't forget that the reason we were able to participate in the coalition was for the rights of the Kivotos-types. Chairman Bernard should also know that.\"\n\nBernard let out a groan and nodded.\n\n\"You're right. Of course, there's no need to clash with Rikuhachima or continue the revolutionary struggle right now. Let's be happy today, but let's move coldly again tomorrow. 'The people of Kivotos are also workers and people equal to humans.' ......Until the Civil Rights Act is established, let's all focus only on this party platform without shaking and grow public opinion among the masses. Now, for the one-country socialist communist revolution. Let's have a toast!\""
 HEU_event.161.a:0 "Everyone has their own plans."

 HEU_event.162.t:0 "Warning"
 HEU_event.162.desc:0 "Lately, it was a very rare day for Aru to be left alone in the office. Especially after the assassination attempt, the employees of Problem Solver 68 felt a more obsessive anxiety about Aru's safety. The reason Aru was left alone was one: because she sent out the Problem Solver 68 employees for a while, saying she had to meet a guest today.\n\n\"Miss Rikuhachima should think more. If you've had a lead bullet in your head, shouldn't you have a suspicion that another one might be put in?\"\n\nWith that characteristic sarcastic tone, Charles Marx entered the office. I want to meet Aru. It was the request of Marx who contacted her first.\n\n\"Because I thought there's no such possibility with you......\"\n\n\"It seems your thoughts will change if you hear the reason I decided to visit today.\"\n\n\"There was a Communist Party party. How pleasant would it be? Becoming the ruling party for the first time. But I felt I should tell you what kind of stories came out from within.\"\n\n\"......Stories?\"\n\n\"We'll carry out a revolution in Luxembourg. How stupid is Rikuhachima for accepting us into the ruling party. The moment we seize power, we'll send you, Rikuhachima, to the firing squad.\"\n\nFiring squad. The moment she heard those words, Aru's expression hardened. To guarantee the rights of all Kivotosians. Wasn't that the party making such claims? The reason Aru accepted them into the ruling coalition was also for the maintenance of the Civil Rights Act.\n\n\"W-wait. T-that, me being killed, th-that...... is a lie, right?\"\n\n\"Miss Rikuhachima. Please become an adult. If our party takes power, would only you die? The kids you think are *so* precious will also be tied to the firing squad. Are you so thoughtless?\"\n\nWith sarcasm, Marx turned back as he was.\n\n\"Of course, nothing will happen immediately just because our party becomes the ruling party......\"\n\n\"If, if those words are right. Why are you...... telling that story to me?\"\n\n\"I'll say it again. Become an adult first. Become a being who can *take responsibility* for the people you want to protect.\""
 HEU_event.162.a:0 "\"If you remain a child forever, you won't be able to protect your precious people.\""

 HEU_event.163.t:0 "Local's Dog"
 HEU_event.163.desc:0 "\"Civil Rights Act, isn't this a good thing?\"\n\n\"It's a good law for us. But honestly, wasn't Aru on the debate a bit annoying?\"\n\n\"Your Highness, Your Highness, people pampering her around, so she acts like she really became an aristocrat. In the first place, why should we be protected by a law? The local army, they are weaklings who scatter if we fire a few guns.\"\n\n\"Right. We don't need to bow our heads and beg for mercy. But Rikuhachima became a dog of the locals and begs for rights we should naturally have from the weaklings. Does that make sense? It ends with one bullet.\"\n\n\"It's all because there's something she received from the locals.\"\n\n\"Something she received?\"\n\n\"In exchange for bowing and scraping to the locals, she decided to receive something. Otherwise, would that outlaw of Kivotos crawl like a dog and beg for mercy from the locals?\""
 HEU_event.163.a:0 "\"Anyway, that Rikuhachima fellow. Let's deal with her later.\""

 HEU_event.164.t:0 "Congrats on the Grand Coalition!"
 HEU_event.164.desc:0 "Finally, the Civil Rights Act passed in the parliament, and the Luxembourg Communist Party was incorporated into the ruling coalition to manage the implementation of the Civil Rights Act. As the Communist Party was an extra-parliamentary party, it was natural not to be included in the coalition government discussion under normal circumstances, but it was decided that some Communist politicians would be incorporated into the cabinet to the extent of obtaining the small authority of 'monitoring the Civil Rights Act.'\n\nBut the expression of Aru, who personally drove the official car to the Grand Ducal Palace, was coldly hardened. She should have been happy. Because she believed if she entrusted the Civil Rights Act to the locals who protect the rights of Luxembourgers, those people would solve everything. But those people are also bad people and are trying to kill Aru?\n\n\"What is...... a person who takes responsibility.\"\n\nWhat is an adult? Does it mean not to depend on others but to protect precious people with one's own strength? Is that an adult?\n\nAn Aru lost in complicated thoughts parked the car near the palace and got out. In that moment, several Gehenna students with playful smiles were seen.\n\n\"Hey! The dog of the local guys!\"\n\n\"Uh? Me?\"\n\n\"To receive this and that like regency or nobility, what did you do for the local high-ranking guys? Tell us too.\"\n\n\"Receiving things, I didn't......\"\n\n\"Civil Rights Act or whatever, why should we beg for mercy under the local bastards because of you?!\"\n\nThe moment Aru looked up, the girl standing at the very front splashed a bucket of white paint on Aru's face. With a splashing sound, her whole body was colored white, pure white. The sound of screaming. The sound of students' ridicule. The sound of soldiers guarding the front of the palace shouting. In the characteristic smell of water-based paint, Aru felt dizzy and slumped to the ground."
 HEU_event.164.a:0 "Ah."

 HEU_event.165.t:0 "I Am Happy"
 HEU_event.165.desc:0 "The office where Aru is absent. The three of Problem Solver gathered in an awkward atmosphere. Kayoko spoke first with a cold voice.\n\n\"Analyzing logically, the white paint splashed on the President can be analyzed as containing a sexual metaphor. The story those Gehenna students were telling then. 'Didn't you become a Regent by offering something to the locals.' When considering *what* means sexual offering......\"\n\nBang! The sound of Mutsuki kicking the wall was heard.\n\n\"Yeah, Kayoko-chan, I also know those kids were trying to sexually harass Aru. *I know*. So those bastards who fled, let's just catch them and rip their mouths open? Why are you talking so much?\"\n\n\"You can't stop slander that way. The rumor has already spread widely among Gehenna students. That's why I'm logically finding a way to resolve the misunderstanding targeting all Gehenna students. If we can only analyze the misunderstanding and explain logically......\"\n\n\"Aha~ so Kayoko-chan's words mean, we should go out together and say 'Aru-chan has never offered her body to men- she's a clean kid who can't think of such things- kyahaha'? Ahaht, simple? ......Hey, Onikata. Are you fucking kidding me? Is Aru-chan a joke to you? What would happen to Aru-chan's image if we said such things as an *explanation*? Huh? Don't you fucking think?\"\n\n\"......Ah. Cussing because you're speechless? But if Aru was so precious to you, what were you doing until things went to this mess? You didn't even know such rumors were going around among Gehenna students. Pretending the President is precious only with your mouth?\"\n\n\"Uhuhu. Huhu. Interesting. Very interesting. But you, you've never had a bullet in your head since the Transfer, right? They say the mystery is weak here so a *halo can actually break*.\"\n\n\"Mutsuki-shitsucho, Kayoko-kacho, p-please both of you calm......\"\n\nBang. Aru roughly opened the office door. Kayoko and Mutsuki, standing while aiming guns at each other, turned to Aru with startled expressions. Look. This is the result of all the things you *wanted to protect*?\n\n\"Get out. ......I don't need help from you two.\""
 HEU_event.165.a:0 "Who were the things I've done for?"

 HEU_event.200.t:0 "Sinner"
 HEU_event.200.desc:0 "\"Why, I...... sob...... ugh......\"\n\nAru, who was walking staggeringly in front of Berg Castle planned as the memorial park construction site, eventually slumped down and burst into tears. Around the memorial park museum, where black flames still rise, firefighters were continuing meaningless extinguishing work. The memorial park facilities were destroyed by blunt weapons, and the appearance of local workers who were lynched by Gehenna students being loaded into ambulances was also seen.\n\n\"Aru-sama......\"\n\nThe memorial park plan has completely ended due to the terror by Gehenna students.\n\nUsually, even if an unexpectedly embarrassing thing happened, Aru didn't cry to this extent. Even if a sudden situation occurred, she usually showed a bluff-mixed reaction like 'As expected of a hard-boiled, I expected this much!'\n\nBut the tragedies that continued from Aru's assassination attempt. Aru's will was already at its limit. *Until when* must I repeat failures? Why am I alive here?\n\nHaruka tried to say something to comfort Aru. But Haruka didn't know what kind of words to comfort her who couldn't stop sobbing."
 HEU_event.200.a:0 "Gehenna won again. So what did you gain?"

 HEU_event.201.t:0 "Why Should We Do Construction?" #3rd time
 HEU_event.201.desc:0 "\"Actually, logically thinking, isn't the number of deaths due to the Transfer just a handful compared to the people who died during the Russian Revolution? The Transfer was a tragedy, but at least the aristocrats were 'cleaned out' and the national treasury they were wasting returned to the working class. That alone can be seen positively. Then what kind of memorial organization would this memorial park be for? That it's sad the aristocrats died?\"\n\nLuxembourg Communist Party politician Zénon Bernard, who was elected in the 1934 parliamentary election, cynically ridiculed the construction of the Luxembourg memorial park in a private interview with a reporter. Especially, the fact that the place where the memorial park is built is the site of an old castle emerged as an important issue.\n\n\"Fundamentally, one should note that the memorial park is not actually an organization for memorial. This is merely the feudal forces of Luxembourg including aristocrats doing emotion-marketing to expand their popular influence. If it were a truly sincere memorial park, wouldn't there be many good places other than a castle?\"\n\nRegardless of how logical and rational Bernard's remarks were, the remarks of the Luxembourg Communist Party politician, a member of the ruling coalition, were printed in the newspaper, and various conservatives were enraged. Some farmers' groups are criticizing Rikuhachima Aru for failing to restrain Bernard's remarks."
 HEU_event.201.a:0 "\"It's an interview done in a place I don't even know! What am I supposed to do?!\""
 HEU_event.201.b:0 "\"First of all, I need to announce that I don't agree with that old man...\""

 HEU_event.202.t:0 "His Majesty Wilhelm's Gloomy Day"
 HEU_event.202.desc:0 "Visiting the construction site of a memorial park for Luxembourgers. Wilhelm II *really* didn't want to do this. No matter how politically inept he was, he knew very well that the Communist Party's invitation to visit the memorial park was nothing more than a setup to publicly humiliate him. But he couldn't refuse. They were the 'ruling party,' and Wilhelm II was merely a refugee living in the Luxembourg he had once conquered during the Great War.\n\n\"Mr. Wilhelm Hohenzollern. Nice to meet you. Yes, we're in front of the reporters, so please give us a bright smile.\"\n\nCharles Marx, a leading member of the Communist Party, appeared with reporters and led Wilhelm toward the unfinished park with a mocking tone.\n\n\"Mr. Wilhelm's visit will be a great change for Luxembourg. A man who invaded Luxembourg during the Great War has come to pay his respects and atone at a facility honoring Luxembourgers.\"\n\n\"No, I just thought I'd visit since they said they were building a park......\"\n\n\"Oh? Mr. Wilhelm, do you perhaps feel no remorse for invading and militarily occupying Luxembourg during the last war? Since the reporters are all here, why don't you say a few words publicly? You might be expelled from Luxembourg, but who cares? You should stand tall before your ideals!\"\n\nI want to kill him. That damn Red.\n\n\"I, well...... of course, I atone for the invasion of Luxembourg, and as Mr. Marx said, I pay my respects to those who were sacrificed due to the Great War......\""
 HEU_event.202.a:0 "The article featuring a photo of Wilhelm with his head bowed became a popular item among Luxembourgers."

 HEU_event.203.t:0 "Divided Reactions within the Communist Party"
 HEU_event.203.desc:0 "The Luxembourg Communist Party fundamentally supports the construction of a 'Memorial Park for the Victims of the Great War,' but argues that 'the target of commemoration should be limited to commoners.' In particular, the fact that the site of the memorial park is an old palace that brings back memories of the Luxembourg Grand Ducal Family is becoming a major point of contention within the Communist Party.\n\nModerates in the party, including Charles Marx, argue that 'transforming a palace into a space for the common people is something a communist should be happy about,' but hardliners, including Zénon Bernard, are protesting, saying that 'the fact that an old palace became the site for a memorial park itself implies an intention to favor aristocratic casualties.' As internal conflict within the Communist Party regarding the construction of the memorial park grows, the party has decided not to officially support or oppose the construction as a party line.\n\nDue to this decision, individual members of the Communist Party will judge the construction of the memorial park differently based on their own discretion."
 HEU_event.203.a:0 "As long as they don't openly oppose it, it's fine."

 HEU_event.204.t:0 "Collusion between Communist Hardliners and Gehenna"
 HEU_event.204.desc:0 "Hardliners in the Luxembourg Communist Party are contacting students from the Gehenna anti-memorial park faction to stop the construction. Zénon Bernard met with Gehenna students in his office today and reached a consensus that the memorial park is \"deliberately disparaging Gehenna students.\" Since more than half of the Kivotos population in Luxembourg is Gehenna-affiliated, the Communist Party's 'Shake Gehenna' operation will surely interfere with the memorial park construction project."
 HEU_event.204.a:0 "Oh, come on!"

 HEU_event.205.t:0 "CRASH!"
 HEU_event.205.desc:0 "A small group of Luxembourg Communist Party members sneaked into the memorial park construction site today. They entered the museum, broke the nose of a plaster statue depicting Grand Duchess Charlotte, and were caught by local workers while fleeing. The members told the police, \"I didn't like the fact that Charlotte's plaster statue was in the memorial park.\"\n\nTheir crime is minor, but they seem to have succeeded in upsetting the Luxembourgish conservatives."
 HEU_event.205.a:0 "What on earth were they going to use that nose for?"

 HEU_event.206.t:0 "The Memorial Park as a Place of Harmony"
 HEU_event.206.desc:0 "Today, Charles Marx, a member of the Luxembourg Communist Party, delivered a small donation for the construction of the memorial park in his personal capacity, not as a party representative. Marx said, \"I too was in Luxembourg City as a doctor on the day the Great War broke out, and I saw both the Kivotos students who rioted and those who tried to stop the rioting,\" and added, \"I hope that the construction of this memorial park will be the first step toward reconciliation between humanity and Kivotos, the two races.\"\n\nHardliners within the Communist Party criticized Charles Marx's donation as an anti-party act, but Marx is remaining unresponsive to the criticism from the hardliners."
 HEU_event.206.a:0 "A small but grateful gift."

 HEU_event.207.t:0 "Entry Attempt by Gehenna and Communists"
 HEU_event.207.desc:0 "Some Gehenna students and Luxembourg Communist Party members were stopped today while attempting to storm the memorial park site to halt construction. Surprisingly, it was other Gehenna students—those who had participated in stopping the riots during the Great War—who blocked the Gehenna terrorism.\n\nThe students who stopped the terror stated in a media interview, \"We heard people planning a terror attack at a cafe and went to stop them.\" Thanks to the help of these courageous students, the suspension of construction was avoided, but the public seems disappointed by the fact that a terror attack almost occurred."
 HEU_event.207.a:0 "Sigh..."

 HEU_event.208.t:0 "Beyond the Wall"
 HEU_event.208.desc:0 "Um, ahem, well. Honestly, I'm not a great orator. I don't have the confidence to make people cry by reciting fancy lines in a place like this. I mean, I'm an outlaw. Well, I guess I've become about half a law-abider now. (Laughs) So I was quite flustered when I was asked to give a speech at the opening ceremony of the memorial park. What would Mutsuki, Kayoko, or Haruka say for everyone? I've thought about it a lot in my own way.\n\nBut in the end, I realized long words weren't necessary. Just...... this park, and the museum beyond it, and all the people who will visit here. I think all of that will reach the victims more than a hundred speeches. We haven't forgotten you. We will continue to remember you. Like that, conveying it toward the heavens.\n\nAnd I hope that even in a small way, this memorial park becomes an atonement for those sacrificed during the Great War. We can't bring the dead back, but...... we want the survivors to be able to reconcile and live together on this land. That is all."
 HEU_event.208.a:0 "Only with atonement can we move toward the future."

 HEU_event.209.t:0 "Temporary Alliance with Luxembourg"
 HEU_event.209.desc:0 "Handyman 68, which rules Luxembourg, understands that our government seeks to completely destroy the Gehenna forces. They have proposed a temporary alliance that lasts *until we destroy Gehenna*. Handyman 68 knows that Trinity traditionally dislikes Gehenna, and they are aware that they themselves are also part of *Gehenna*. However, Asagi Mutsuki, acting as the diplomatic envoy, suggested that since Luxembourg is at the rear of Pandemonium Society and the Prefect Team, Luxembourg could 'tie down' some of the Gehenna army from behind when Trinity invades Gehenna.\n\nClearly, the ability to split the enemy's front into two is an attractive proposal. The fact that this alliance will be temporary is also a satisfying point for Trinity. However, the final decision ultimately rests with [TRM.GetLeader]."
 HEU_event.209.a:0 "Good, let's form a united front."
 HEU_event.209.b:0 "I've never liked Rikuhachima Aru anyway."

 HEU_event.210.t:0 "Trinity's Agreement"
 HEU_event.210.desc:0 "Trinity has agreed to our temporary alliance proposal. When we or Trinity attack Gehenna, we will form a temporary military alliance. This is a temporary alliance, but it will clearly be a great help."
 HEU_event.210.a:0 "Good news."

 HEU_event.211.t:0 "Trinity's Rejection"
 HEU_event.211.desc:0 "What did you expect from [TRM.GetLeader]? They have rejected our proposal for a coalition. Of course, we can attack Pandemonium Society alone even without an alliance with Trinity, but it won't be an easy fight."
 HEU_event.211.a:0 "Things have become a bit difficult."

 HEU_event.212.t:0 "End of the Temporary Alliance"
 HEU_event.212.desc:0 "The Luxembourg-Trinity alliance was clearly temporary, and it no longer has a reason to exist after the common enemy has vanished. Now all alliance relations have been cleared, and war could break out between the two nations at any time again."
 HEU_event.212.a:0 "The end of a brief joint struggle."

 HEU_event.213.t:0 "A War for the Germanic People"
 HEU_event.213.desc:0 "Regardless of what the true purpose of this war is, it is clear that the slogan 'War for the Germanic People' is exciting nationalists and the remaining fascists in Deutschland. Militias flying both the swastika and the Luxembourgish flag have offered to join our army, and voluntary enlistment of ultra-nationalists within Luxembourg is continuing. However, Émile Speller, the conservative monarchist head of the military with a 19th-century mindset, warned: \"I fear that they are those whose loyalty to the nation precedes their loyalty to Your Highness.\""
 HEU_event.213.a:0 "Let's not drag the war on too long."

 HEU_event.214.t:0 "Return of the Kaitengers"
 HEU_event.214.desc:0 "The infinitely spinning rails eventually lead to the future of justice! Infinite Sushi Squadron Kaitenger appears!\n\nThis audio file is a declaration of war sent to the evil organization known as 'Handyman 68.' Even though you interfered with our legitimate robot construction fundraising, we robbed the donation boxes of cathedrals all over Luxembourg...... No, we 'relocated' them and used them for the completion of KAITEN FX Mk.0. Our robot is already finished, and your wicked interference has ended in failure.\n\nNow we shall advance to Luxembourg City with KAITEN FX Mk.0 for the execution of justice. Our only goal is to destroy the office of you handymen who interfered with our legitimate fundraising activities! Tremble before the giant robot, the mighty power, and the justice of the infinite rails! Haha!\n\nAh, umm, uh. Wait a minute, Blue. Isn't laughing 'Haha!' at the end a bit like a villain? Should we record this part again? What? We only had one record? No, realistically, we should have left some spare budget......"
 HEU_event.214.a:0 "...The Kaitengers are back?!"

 HEU_event.215.t:0 "The Infinitely Spinning Rails Eventually..."
 HEU_event.215.desc:0 "\"Aru-chan! Look out!\"\n\nBOOM! With the grenade Aru threw, the massive KAITEN Mk.0 shattered and collapsed sideways. Mutsuki grabbed Aru, who was under the falling KAITEN, and pulled her back. The ultimate weapon of the Infinite Sushi Squadron became scrap metal, leaving only a few centimeters between it and Aru's boots.\n\n\"Sorry...... I got too close because I wanted to make sure the bomb hit.\"\n\"You don't have to explain that! Are you hurt anywhere?! Your arm?! Are your eyes okay? Can you see?!\"\n\"......I'm fine, really. More importantly, what about the Kaitengers?\"\n\nWhile soothing the tearful Mutsuki, they saw the Kaitenger members in their colorful sushi costumes crawling out of the wrecked machine.\n\n\"Damn it, just you wait. Next time, we'll surely get our revenge......\"\n\n\"There won't be a next time.\"\n\nHaruka, who had jumped onto the wrecked robot before anyone noticed, aimed her shotgun.\n\n\"The sin of almost hurting Aru-sama again. Pay for it with your death.\"\n\n\"Wait! Haruka. There's no need to kill them!\"\n\nAru instead tossed Mutsuki's bag, which was full of grenades, to Haruka.\n\n\"Let's do this instead. Members of Kaitenger. Decide whether you'll blow up here, or pay back the cost of your rampage by working.\"\n\nAfter alternating looks between Mutsuki's grenade bag and Aru, Kaitenger Red finally realized there was no way to escape and raised both hands."
 HEU_event.215.a:0 "\"W-we'll... work... to pay it back...\""

 HEU_event.216.t:0 "[FROM.GetName]'s Alliance Proposal"
 HEU_event.216.desc:0 "The [FROM.GetName] side has sent a message expressing their desire to join our coalition. Despite various ideological differences between them and us, an alliance with [FROM.GetLeader] would clearly be of great benefit to us. However, the final decision-maker for this alliance is [ROOT.GetLeader], and it remains possible that the alliance with the [FROM.GetAdjective] side will not be realized."
 HEU_event.216.a:0 "Let's build a wonderful cooperative relationship!"
 HEU_event.216.b:0 "No, we don't need that horned outlaw."

 HEU_event.217.t:0 "Benelux Alliance Proposal"
 HEU_event.217.desc:0 "A proposal for the 'Benelux Alliance' from [FROM.GetName] has been delivered to [ROOT.GetLeader]. Most joyfully, Rikuhachima Aru, the leader of Luxembourg, has not forgotten that she is a Luxembourger before she is a Kivotos student. Highlighting that the three Low Countries of Benelux have traditionally been partners with deep friendship, she spoke of the need for us to join forces amidst the chaos following the Great War.\n\nDue to the traditional friendship between the Benelux nations, public opposition to this alliance is very low. Our nation's officials also state that this alliance will be of great benefit to us. But can a 'horned' leader of Luxembourg really be a trustworthy partner? Ultimately, the final decision on whether the alliance will be formed rests with [ROOT.GetLeader]."
 HEU_event.217.a:0 "Let's build a wonderful cooperative relationship!"
 HEU_event.217.b:0 "Benelux cooperation is just a memory of the past."

 HEU_event.218.t:0 "[FROM.GetName]'s Comintern Application"
 HEU_event.218.desc:0 "While many nations have applied to join the Comintern (Third International) so far, it is unprecedented for a monarchical state—not even a communist one—to boldly send a message wanting to join. Our diplomat, Vyacheslav Molotov, met directly with Zénon Bernard, the representative of the Luxembourg Communist Party visiting Moscow, to hold talks.\n\nBernard pointed out that although Luxembourg is a monarchy, the Communist Party is included in the ruling party as a member of the coalition government. He also presented the practical benefits the Soviet Union could gain by cooperating with Luxembourg, which is greatly expanding its territory in western Deutschland. Clearly, making all of Deutschland an ally as Bernard suggested would be of great benefit to us. However, the key question is whether the paranoid General Secretary Stalin will tolerate the gamble of accepting a monarchical state as a full member of the Comintern."
 HEU_event.218.a:0 "\"As of today, I too am a monarchist.\""
 HEU_event.218.b:0 "\"We have no need for an alliance ruled by horned aristocrats.\""

 HEU_event.219.t:0 "[FROM.GetName]'s Alliance Proposal"
 HEU_event.219.desc:0 "The [FROM.GetName] side, a rising power in Deutschland, has sent a message wishing to join our coalition. Rikuhachima Aru's ideal of 'a nation where Kivotos students and locals harmonize' clearly has similarities with the ideals of Czechia. [FROM.GetLeader]'s side proposed that our cooperation would make the harmony between the two peoples more active. However, the final decision-maker for this alliance is [ROOT.GetLeader], and the possibility remains that the alliance with [FROM.GetAdjective] will not be realized."
 HEU_event.219.a:0 "For the harmony of the two peoples!"
 HEU_event.219.b:0 "We can do well even without that horned outlaw."

 HEU_event.220.t:0 "Trinity-Gehenna War"
 HEU_event.220.desc:0 "War has broken out between Trinity and Gehenna, and we have entered the war according to the secret contract we previously made. This war will determine not only Gehenna's fate but also the fate of Handyman 68 itself. Success, or downfall along with Trinity.\n\nWe can only hope that we have completed the maximum preparations."
 HEU_event.220.a:0 "Finally...!"

 HEU_event.221.t:0 "Request for Support from [FROM.GetName]"
 HEU_event.221.desc:0 "The [FROM.GetName] side, preparing for a war for the so-called 'Unification of the Germanic People,' is requesting the international community to provide support for them. Onikata Kayoko, who contacted us as the diplomatic representative of [FROM.GetName], persuaded us that this war could weaken two potentially threatening rivals, Trinity and Gehenna, and would serve as an opportunity for [FROM.GetName] and [ROOT.GetName] to maintain a close relationship after the war."
 HEU_event.221.a:0 "We promise to dispatch volunteer forces."
 HEU_event.221.b:0 "We promise nothing."

 HEU_event.222.t:0 "Support from [FROM.GetName]"
 HEU_event.222.desc:0 "It seems that 'Plan B' presented by Onikata Kayoko has fortunately succeeded. [FROM.GetName] has stated that they can provide personnel support, including volunteer forces, for our war effort. Even without an alliance with Trinity, we are not alone and can continue the war without being isolated."
 HEU_event.222.a:0 "That's a relief."

 HEU_event.223.t:0 "Rejection of Support from [FROM.GetName]"
 HEU_event.223.desc:0 "Unfortunately, [FROM.GetName] has stated that they have no intention of providing any support to us. We must fight this war without their help."
 HEU_event.223.a:0 "That's unfortunate."

 HEU_event.224.t:0 "Gehenna's Defense Plan"
 HEU_event.224.desc:0 "Rikuhachima Aru, the leader of Handyman 68, is talking about the so-called 'Reunification of Germanic Territories' or something. Whether she is being used by Germanic nationalism or trying to use Germanic nationalism is unknown at this point. However, the important thing is that Handyman 68 and Trinity might form a coalition front and attack us from both directions. Although it may be premature, it is necessary to prepare a front to brace for war."
 HEU_event.224.a:0 "Prepare thoroughly!"
 HEU_event.224.b:0 "What could possibly happen?"

 HEU_event.225.t:0 "Start of the Germanic National Liberation War"
 HEU_event.225.desc.a:0 "On that day, two versions of the declaration of war were promulgated: one for the human soldiers and one for the Kivotos students. The proclamation for the human soldiers stated that this war was a 'Holy War to integrate the divided Germanic people into one,' while the Kivotos proclamation, also sent to Gehenna, contained the message that it was a 'War to stabilize Gehenna and Trinity, who are divided and fighting amongst themselves, by taking them over.'\n\nBoth declarations of war were written by Mutsuki's hand and distributed at Mutsuki's direction. It was an hour after the soldiers had crossed the front line when Aru learned that the Luxembourg army had started to move. After everything had already begun.\n\n\"Mutsuki. What on earth were you thinking?\"\n\nAt Aru's calm word, Mutsuki slumped onto the sofa.\n\n\"Germanic nationalists across the border have already decided to join us. If this war goes well, Aru-chan will become a hero.\"\n\"I'm not asking about that. Why, just why...!\"\n\"It's all for Aru-chan. You still don't get it?\"\n\nMutsuki bolted from her seat.\n\n\"Germanic this, Gehenna that, I don't care about any of it! If we just win this war, the people who looked down on Aru-chan will all treat Aru-chan as a hero. So......\"\n\"How on earth can I become a hero by using other people as pawns!\"\n\nAru slammed her fist onto the desk.\n\n\"I trusted you! Because we're friends! Even until the end, I believed that you wouldn't actually go to real war! But why.......!\"\n\n\"Then trust me one more time.\"\n\nMutsuki stood up.\n\n\"I can make you a hero. If we win this war, Aru-chan's suffering will also disappear. So. Aru-chan. Please smile and cheer for me. ...I will save you.\""
 HEU_event.225.desc.b:0 "On that day, two versions of the declaration of war were promulgated: one for the human soldiers and one for the Kivotos students. The proclamation for the human soldiers stated that this war was a 'Holy War to integrate the divided Germanic people into one,' while the Kivotos proclamation, also sent to Gehenna, contained the message that it was a 'War to stabilize Gehenna and Trinity, who are divided and fighting amongst themselves, by taking them over.'\n\nBoth declarations of war were written by Mutsuki's hand and distributed at Mutsuki's direction. It was a few hours after Mutsuki herself had informed her of all these circumstances that Aru learned the Luxembourg army was moving.\n\n\"I don't expect you to understand this, Aru-chan. But I'm not doing this because I'm crazy. This whole thing is purely...\"\n\"Yeah. You're going to say it's for me.\"\n\nAru, sitting on the sofa, looked at Mutsuki, who was looking up at her like a criminal. Mutsuki was the jailer and Aru was the prisoner, but Mutsuki had never once stood on a psychological high ground against Aru after locking her up. Everything Mutsuki did was to make Aru a hero, and for that... Aru had to cooperate in this stupid play.\n\nAru knew that Mutsuki wasn't acting this way because she was truly evil or crazy. She was moving solely with the desire to help Aru, almost naively. Even if it wasn't what Aru wanted. Aru let out a hollow laugh and leaned deep into the sofa.\n\n\"Go back.\"\n\"But, Aru-chan...\"\n\"Did you think I would happily accept becoming a hero by making people die? Go on. Continue your fun play. Your party. ...I know well enough that you're doing this crap for me. But. I'm not going to smile for you.\""
 HEU_event.225.a:0 "After Mutsuki left, Aru cried for a long time."

 HEU_event.226.t:0 "[FROM.GetName]'s Germanic Integration Negotiation"
 HEU_event.226.desc.a:0 "Due to their desire to integrate the divided Germanic people into one, we sat down at the negotiation table with [FROM.GetName]. Local right-wing forces in Luxembourg, including the Right Party, emphasized that even if their leader is from Kivotos, an assembly maintained by humans remains. Luxembourg Prime Minister Joseph Bech emphasized that this negotiation is not 'the annexation of Deutschland by Luxembourg' but 'the unification of the divided and chaotic Germanic people.' If we agree to their proposal, we will join them, but our independence will collapse. And if we reject their proposal... it will lead to an expansion of the war."
 HEU_event.226.desc.b:0 "Due to their desire to integrate the divided Germanic people into one, we sat down at the negotiation table with [FROM.GetName]. It is clear that since the 68 Revolution and its leaders are from Kivotos, the 'integration of the Germanic people' they speak of is merely propaganda to appease local residents angered by the radical revolution. However, as we wage a war to liberate Deutschland, we must consider whether we can afford to increase the number of our enemies."
 HEU_event.226.a:0 "Become part of [FROM.GetName]"
 HEU_event.226.b:0 "Our answer - is war!"

 HEU_event.227.t:0 "Stronger Together"
 HEU_event.227.desc:0 "Wisely, [FROM.GetName] has decided to accept our proposal. They seem to have judged that [ROOT.GetName]'s plan for Germanic national integration is 'safer' than facing the threat of creating another front. We have peacefully incorporated their military."
 HEU_event.227.a:0 "Absolutely wonderful!"

 HEU_event.228.t:0 "Not Going as Planned"
 HEU_event.228.desc:0 "Disconcertingly, [FROM.GetName] chose war rather than being merged as part of us. They judged that 'Germanic national integration' carried out by the Kivotos leader Aru is no different from the existing rule by Gehenna-Trinity. In any case, it seems we must break [FROM.GetName] by force."
 HEU_event.228.a:0 "Why does my plan end up like this every time?"

 HEU_event.229.t:0 "Glorious Day of Victory"
 HEU_event.229.desc.a:0 "The space once used as the office of the Pandemonium Society's President became a party hall, and various course meals were served on everyone's tables. Aru, sitting at the head of the table, felt her heart racing as she looked around. Gehenna students and officers of the Grand Duchy, excited by the joy of victory, were noisily talking and moving around. A party held while occupying the Gehenna central district. It was a day to be happy, but Aru could not stand the sense of dissonance felt in this scene.\n\nMutsuki, dressed in uniform, raised a glass of wine next to Aru.\n\n\"Today is the day we have achieved a glorious victory over the decadent leadership of Gehenna under the leadership of our great leader, *Rikuhachima Aru*! Our country has overthrown the pseudo-regime of Gehenna's Pandemonium Society and seized the heart of Western Deutschland, and this glory belongs only because of the leadership of our leader...\"\n\nIt was nauseating.\n\nShe clearly had the appearance of the childhood friend she knew, and she had the exact same face as when they first met as friends. But *that thing*, which looked so much like Asagi Mutsuki, was spewing words Aru could not understand. She couldn't comprehend what that creature looking like Mutsuki was saying.\n\nClap, clap, clap! Every time *that thing* looking like Mutsuki shouted with a wine glass, the enthusiastic applause of the soldiers and the 'Aru-faction' students grew louder. Ahaha. If you're a hardboiled outlaw, this level of victory is natural. She thought she had said that. No, did I say that? Aru stood up. That thing looking like Mutsuki grabbed Aru's wrist. It said something. She couldn't hear it. She was terrified and afraid. Aru kicked that thing with her friend's face down and ran out into the hallway.\n\n'You're still a child. You should become an adult to protect the things precious to you.'\n\nThat damn doctor's words spun in her ears. What is an <adult>? How on earth do you become one? Aru ran along the hallway that seemed to go on forever.\n\nThere was a familiar smell of blood in the hallway. She saw the bodies of the Grand Ducal palace servants she had seen on the day of the Great War, who shouldn't have been here.\n\nAs if fleeing, Aru kicked open the door of the nearest room. The bedroom of Pandemonium. There she saw Mutsuki with a pistol in hand. No. Stop. As Aru reached out her hand as if flailing, Mutsuki pulled the trigger several times. With the sounds of bang, bang, bang, bang, the body of Grand Duchess Charlotte holding a small girl was shattered. The child's head flew off, and the brain matter and blood soaked Aru's face.\n\n\"Aru... sama?\"\n\nHaruka, who had followed her, tightly gripped the tips of Aru's fingers. When Aru came to her senses. There was nothing in the bedroom. But Aru slumped down, sobbing toward that empty bedroom."
 HEU_event.229.desc.b:0 "The space once used as the office of the Pandemonium Society's President became a party hall, and various course meals were served on everyone's tables. Aru, who had been imprisoned by Mutsuki, stepped into the party hall for the first time, although she was under the escort (meaning surveillance) of soldiers. Gehenna students and officers of the Grand Duchy, excited by the joy of victory, were noisily talking and moving around. A party held while occupying the Gehenna central district.\n\nAru sat next to Haruka. Haruka's cheeks were flushed red, and she was trembling, unable to even look at Aru properly.\n\n\"Aru-sama. If you're here, instead of at the head of the table...\"\n\"I'm not crazy enough to enjoy this party. FUCK Regent Rikuhachima.\"\n\nAru picked up a wine glass and took a sip. What is an adult? Is an adult a being that rejoices by using others' pleasure as a side dish? Ha. If so, those idiots who burned Luxembourg were already adults in 1935. Asagi Mutsuki failed to become an adult. Both then and now.\n\nWhile Mutsuki noisily shouted the declaration of victory, Aru continued to drink while looking at the opposite side of the table. Strangely, the figure of a woman appeared in the empty seat across from her. It was Grand Duchess Charlotte, with holes in her stomach, chest, and neck, looking at her.\n\nCharlotte said. \"It seems you haven't become an adult either, Miss Rikuhachima. You don't resist them; you're just avoiding it with your head bowed, aren't you?\"\n\"...Yeah. But how am I supposed to resist this madness? I think you would know. You're smarter than me. You fought much more bravely than me.\"\n\"...Deliver a message. Just as I didn't try to flee the Grand Ducal palace alone but stayed to protect my family. You must stand firm on your throne and *not* flee.\"\n\nWhat does it mean not to flee? What does it mean to keep one's place? After thinking for a moment, Aru chuckled. She wasn't the real Charlotte anyway. She was a hallucination created by her own guilt.\n\n\"Aru... sama?\"\n\nHaruka gripped Aru's fingertips tightly. Across from Aru, there was no one."
 HEU_event.229.a:0 "We should celebrate the wonderful victory, shouldn't we?"

 HEU_event.230.t:0 "On the Ruins of Trinity"
 HEU_event.230.desc.a:0 "Mutsuki pulled out the final version of the Union Law to be enacted in the future. Gehenna, Trinity, and Luxembourg would all be integrated under Rikuhachima Aru's flag. And Luxembourg would become the leading nation of the Union of Grand Duchies, leading numerous grand duchies and counties into which all of Deutschland would be finely split, as the representative nation of the Germanic people. The end of the Union Law concludes with Aru participating in the victory ceremony commemorating the war victory and elevating the Grand Duchy of Luxembourg to a Kingdom by herself.\n\n\"With this... Aru-chan will truly become the greatest hero. No one will be able to ignore Aru-chan... so... I'm not wrong. I'm not mistaken. Aru-chan will tell me so.\"\n\nRecalling the memories of the victory ceremony day in Gehenna, Mutsuki entered Aru's office with trembling hands, holding the Union Law documents. The Handyman 68 office in the Grand Ducal palace where warm sunlight streamed in. On the desk where no one was, only a single letter remained."
 HEU_event.230.desc.b:0 "Mutsuki pulled out the final version of the Union Law to be enacted in the future. Gehenna, Trinity, and Luxembourg would all be integrated under Rikuhachima Aru's flag. And Luxembourg would become the leading nation of the Union of Grand Duchies, leading numerous grand duchies and counties into which all of Deutschland would be finely split, as the representative nation of the Germanic people. The end of the Union Law concludes with Aru participating in the victory ceremony commemorating the war victory and elevating the Grand Duchy of Luxembourg to a Kingdom by herself.\n\n\"With this... Aru-chan will truly become the greatest hero. No one will be able to ignore Aru-chan... so... I'm not wrong. I'm not mistaken. Aru-chan will tell me so.\"\n\nRecalling the memories of the victory ceremony day in Gehenna, Mutsuki, along with Haruka, entered the safe house where Aru was imprisoned, holding the Union Law documents with trembling hands. Ominously, a single letter had fallen at the entrance of the house."
 HEU_event.230.a:0 "...A letter?"

 HEU_event.231.t:0 "Rikuhachima Aru's Letter"
 HEU_event.231.desc.a:0 "When I first tried to participate in the Luxembourg coalition government, a noisy local doctor gave me some advice. To protect the people you love, you must first become an adult. Was that the content? Actually, a few years have passed, so I don't remember the exact words. But it was something similar to this.\n\nI didn't know what the <adult> that person spoke of was. Can't one become an adult just by growing older? What is an <adult>? I've thought about it for a long time, and I've thought about it constantly even after the war broke out.\n\nAs the president of Handyman 68, the one who must protect you employees. The conclusion I, Rikuhachima Aru, reached is that an adult is a person who take responsibility. There's a saying like this, right? 'The reason a boss receives more salary than an employee is to protect the subordinate when they make a mistake.' ...It was something I heard from some company back in Kivotos. I personally thought it was cool, so I remembered it. Aren't I commendable?\n\nSo, this is a choice made by the <adult> Rikuhachima Aru.\n\nMutsuki dirtied her own hands to save me. She made fake documents, started a war, and made people die. And Kayoko broke her friendship with Mutsuki because I was there. You probably can't imagine how hard it was for me to endure you calling Mutsuki 'Asagi-san.' And Haruka is crying because of me and suffering because of me.\n\nI am not the Sensei. I cannot take responsibility for all the students of Gehenna or Trinity. However, at least, I am the 'President' of you three, Handyman 68. Therefore, I believe it is my duty to at least protect the three of you.\n\nAll problems happened because Rikuhachima Aru exists. If Rikuhachima Aru hadn't been there from the start, Mutsuki wouldn't have dirtied her hands. Kayoko wouldn't have hated Mutsuki. Haruka wouldn't have been mentally scarred. Everyone's happy ending comes if just one person disappears. So. This is just something that should have been done a long time ago.\n\nI'll leave the regency of Luxembourg to Haruka. There's nothing to fear. Mutsuki and Kayoko will protect you by your side. And I'll leave the position of Handyman President to Mutsuki. Please take care of Section Chief Kayoko. It's 'Section Chief Kayoko.' Calling her 'Onikata-san' will be forbidden by company rules!!! Be sure to listen!!!\n\nLastly, I loved the time I spent with you all since Kivotos.\nI was happy to be with you in this world too.\nMutsuki, Kayoko, Haruka. I loved you all.\n\nSo. Please don't forget my last love letter, my last greeting. Please understand my farewell. Thank you. and goodbye forever."
 HEU_event.231.desc.b:0 "When you are reading this letter, everything will have already ended. Take a calm breath, breathe some fresh air beyond the open door, and then slowly read this letter. This is a request from your precious friend, Rikuhachima Aru.\n\nDisobedience is the true foundation of liberty. The obedient must be slaves. See? Don't you think it's a truly cool saying? It's a quote by Henry David Thoreau. In the sense that resistance is freedom, doesn't it remind you of that spirit pursued by a certain hardboiled idiot?\n\nI came to this land for resistance. What I wanted to do, what I pursued, was the happiness of many people. From that point, the old 'concept' of hardboiled might have already been broken. But you locked me back into the concept of a hardboiled outlaw. Making the locals, who used to despise Rikuhachima Aru, praise me under the title of 'National Hero who reunified the Germans' inside a small snow globe.\n\nBut I don't want that.\n\nIf I can only become a hero through the deaths and tragedies of others, if Rikuhachima Aru can become the next Napoleon by that, I will refuse that hero Rikuhachima, the hardboiled Rikuhachima.\n\nI don't want to scold you. I know that all of this was done for me. It is entirely my sin that I failed to realize your anger, your emotions, Mutsuki, and let things come this far. So I will make a decision as the President of Handyman 68. I hate Handyman 68 breaking down like this and fighting each other. And Mutsuki, I don't want to see you harming others in my name.\n\nEveryone's happy ending comes if just one person disappears. So. This is just something that should have been done a long time ago.\n\nI'll leave the regency of Luxembourg to Haruka. There's nothing to fear. Mutsuki and Kayoko will protect you by your side. And I'll leave the position of Handyman President to Mutsuki.\n\nLastly, I loved the time I spent with you all since Kivotos.\nI was happy to be with you in this world too.\nMutsuki, Kayoko, Haruka. I loved you all.\n\nSo. Please don't forget my last love letter, my last greeting. Please understand my farewell. Thank you. and goodbye forever."
 HEU_event.231.a:0 "\"...Aru........-chan?\""

 HEU_event.232.t:0 "Rikuhachima Aru's Last Greeting"
 HEU_event.232.desc.a:0 "The moment Mutsuki broke through the locked door of Aru's room, the three members of Handyman 68 could see Aru leaning against the sofa with her eyes closed. A half-empty cup of black coffee and an open bottle of potassium cyanide were on the coffee table in front of the sofa.\n\nIn this world where the power of Mystery has weakened, Kivotos students do not die easily from a single bullet. That's why the method Aru chose was poisoning. One couldn't even guess how much poison she had dissolved in the coffee and drank.\n\nAru is dying. Why? To unite Handyman 68 into one. Aru said that was an <adult>'s choice. But there's no way they could understand it. There's no way they could accept it. Kayoko gritted her teeth. 'What on earth, what kind of adult is that! ...President!'\n\nMutsuki's hands trembled. \"No, I... a conclusion like this... that, well, I hate it...\"\n\nWhile Mutsuki and Kayoko bowed their heads in despair. Haruka strode forward. She grabbed Aru's wrist just like that. \"...She's alive.\"\n\n\"...What?\"\n\n\"Aru-sama... is still alive! Quick! A doctor!\"\nKayoko said weakly. \"Potassium cyanide is a poison that can kill a person with just one small capsule. ...Calling a doctor now won't change...\"\n\nSLAP! In an instant, Kayoko's vision turned white. She was slapped? By whom? Kayoko stared blankly at Haruka, who stood before her. She saw her with eyes like a beast, eyes she had never seen before.\n\n\"Shut up and! Call! A doctor!!!!!\""
 HEU_event.232.desc.b:0 "The moment Mutsuki broke through the bedroom door, she felt a slight dizziness and slumped into her seat. Aru was leaning against the bed, her eyes closed as if sleeping. And a half-empty cup of black coffee and an open bottle of potassium cyanide were on the table next to the bed.\n\nIn this world where the power of Mystery has weakened, Kivotos students do not die easily from a single bullet. That's why the method Aru chose was poisoning. It was unknown how she had brought in potassium cyanide. No. The route was guessable. The guards who were monitoring Aru here. They betrayed her.\n\nShe wasn't angry. Her hands were just shaking, she was scared, and the fact that Aru was disappearing was just too much, too much...\n\n\"Director Mutsuki.\"\n\nI. Aru, like this.\n\nDirector! Director...! Director!!!!\n\nSLAP! Mutsuki blinked at the rough sensation of her cheek being struck. Haruka, sobbing profusely, was pulling up Mutsuki by her collar.\n\n\"A doctor! We have to call a doctor!!!!!\""
 HEU_event.232.a:0 "Kayoko nodded blankly."
 HEU_event.232.b:0 "Mutsuki nodded blankly."

 HEU_event.233.t:0 "The Adventure of the Empty House - Phase 1"
 HEU_event.233.desc:0 "\"I told you to become an adult, when did I tell you to play Jesus! Carrying all the sins of Handyman and committing suicide? You stupid girl...\"\n\nRunning alongside Aru, who was being rushed to the emergency room, Charles Marx hurriedly put on medical gloves. The hospital, where Luxembourgish military doctors, Gehenna's emergency medical department, and Trinity's Rescue Knights were mixed together, was like the chaos immediately after the Big Bang itself.\n\nAmong them, Marx, whose medical knowledge was a hundred years behind but who had the longest career, took command.\n\n\"Patient identification is Rikuhachima Aru. Attempted suicide by poisoning by taking potassium cyanide mixed with coffee. First, is it possible to investigate how much potassium cyanide she took?\"\n\nSumi Serina, a former Trinity prisoner, said urgently. \"If we back-calculate from the amount left in the bottle, it would be about one sugar cube.\"\n\nMarx flipped open the medical chart. \"4000mg? Then that means she took *twenty times* the lethal dose, but let's not be that pessimistic. Even if she put in as much as a sugar cube, it would have dissolved in hot coffee and spread... since she lost consciousness and collapsed before finishing the coffee, the actual intake will be less than that.\"\n\nSerina bit her lower lip slightly and then let go. \"Even so, it will be more than the lethal dose. 1000mg?\"\n\n\"Yeah. She probably drank at least *several times* the lethal dose. But shouldn't we do everything we can?\""
 HEU_event.233.a:0 "\"Yes. First, we must hook up the oxygen respirator.\""

 HEU_event.234.t:0 "The Adventure of the Empty House - Phase 2"
 HEU_event.234.desc:0 "Aru was still alive. The problem was that her breathing was becoming increasingly shallow. It was clear that Aru was dying. For a potassium cyanide patient, artificial respiration is impossible, so the use of an oxygen respirator is essential. The problem was that Marx had never seen or touched an object called an *oxygen respirator* before.\n\nWhile students from the Emergency Medical Department and the Rescue Knights, who were several decades younger than him, connected the mechanical oxygen respirator to Aru, Marx felt a small sense of patheticness regarding his own ability. He became a doctor to treat people, but he had to just watch a dying patient.\n\nMarx said. \"As I learned in medical school, potassium cyanide is treated with sodium nitrite injection...\"\n\nSerina replied. \"We do too. I'll give you the medicine.\"\n\nRikuhachima Aru. The <adult> you think of and the <adult> I think of will surely be different. However, I can never agree with your idea that taking medicine and committing suicide to atone for others' sins is what makes an <adult>.\n\nIt's not because I'm an atheist or a materialist. It's that I don't like the fact of taking responsibility with death itself. Live and take responsibility. You're not some seppuku-committing samurai...!\n\n\"...Patient cardiac arrest!\"\n\"M-Mine-部长!\"\n\"Starting CPR!\""
 HEU_event.234.a:0 "Marx felt dizzy."

 HEU_event.235.t:0 "The Adventure of the Empty House - Phase 3"
 HEU_event.235.desc:0 "\"Fufufu! If you're an outlaw, this much is simple!\"\n\nWatching the Black Market villains flee, Aru readjusted her sniper rifle, Wine-Red Admire, with a bright expression. The sky of Kivotos looked much bluer today, and Handyman 68's work went smoothly today. Had there been such a pleasant day lately?\n\n\"Aru-sama! Look at this! This much reward money...!\"\n\nHaruka, with a happy expression, held out a thick bundle of yen to Aru. Isn't this almost as thick as a gold bar?! With this much money, the overdue rent... and she could buy ramen for the employees who hadn't had a proper meal once.\n\nBut something was strange. They had clearly performed the mission wonderfully. Haruka, Kayoko, and Mutsuki were all smiling happily on this joyful day. Strangely, Aru wasn't happy at all.\n\nNo.\n\nAru put her hand to her cheek. Why was she sad? Why were tears falling?\n\n\"Aru-sama? P-perhaps because I'm next to you... because I'm stealing Aru-sama's air... if that's it... a-a-as expected! Apologizing with death...\"\n\nAru looked down at her Wine-Red Admire. This gun. Hadn't it been *several years* since she last used it?\n\n\"Hey, Haruka.\"\n\n\"Ah, yes! Aru-sama!\"\n\nAru barely managed to find the source of her sense of dissonance.\n\n\"...I died in Luxembourg... why am I with you guys in Kivotos?\""
 HEU_event.235.a:0 "The moment she said those words. The smiles of the three disappeared."

 HEU_event.236.t:0 "The Adventure of the Empty House - Phase 4"
 HEU_event.236.desc:0 "\"Aru-chan. Saying you died omits too much context.\"\n\nMutsuki sprayed bullets toward Aru's chest. Hit by the bullets that flew without a chance to dodge, Aru was thrown to the floor. Wearing the same small-devil-like smile she had seen in Kivotos, Mutsuki stepped hard on Aru's chest, crushing it.\n\n\"It's suicide, right? Is that a line that ends with just the words 'I died'? Ahahat.\"\n\n\"Mutsuki...!\"\n\nThump. Thump. Thump. Thump.\n\nHer chest hurt so much it felt like it would tear. She tried to inhale, but this time Kayoko knelt down and heavily pressed on Aru's neck.\n\n\"Did you think it would be an ending where you just drink a cup of coffee and go? No. Even the President didn't think so herself, right? We are the President's guilt. The guilt that we, who are left behind, will live with the scar of the President's suicide until we die.\"\n\nAnd Haruka aimed her shotgun at Aru's face.\n\n\"This is the ending you made. Rikuhachima.\"\n\n\"I... wanted to become an <adult>. But this was the only way I could...\"\n\nHaruka said. \"The one who wants to become an adult is you. It wasn't us. You said this was taking the responsibility of an <adult>. Hey, listen. Rikuhachima. Did you really believe that after you died, I would go to the Handyman office with a normal smile, and live happily chatting with the two in the office where your seat is empty?\"\n\n\"I... yeah. I knew that couldn't be. ...My choice to take responsibility as an <adult> leading to suicide was... just... because I was so tired... because it was so hard to endure... I just made an excuse. Since the Great War, I haven't been happy once. Even now, the smell of the blood of the dead... the voices of the people who hated me... the voices of Mutsuki and Kayoko fighting because of me are ringing in my ears... so... I fled. Under the name of 'a person who takes responsibility.'\""
 HEU_event.236.a:0 "This wasn't 'taking responsibility.'"

 HEU_event.237.t:0 "The Adventure of the Empty House - Phase 5"
 HEU_event.237.desc:0 "\"I was waiting for that answer.\"\n\nHaruka threw away her shotgun. Mutsuki and Kayoko also stepped back one by one to make space for Aru. As Aru struggled to get up, Haruka spoke again.\n\n\"Don't look for the Haruka who is only in your imagination, go find the real Haruka and apologize. Apologize to the real Mutsuki. and apologize to the real Kayoko.\"\n\n\"...Apologize. Fufu. It would be nice if I could. But I'm already dead, right?\"\n\"No. You're not dead yet. ...How could a hardboiled outlaw die so easily?\"\n\n\"Heart is beating again!\"\n\"Please...! Just, please!\"\n\nAmidst the busy movements of the doctors, Aru slowly inhaled and exhaled."
 HEU_event.237.a:0 "A dream within a dream"

 HEU_event.238.t:0 "The Adventure of the Empty House"
 HEU_event.238.desc:0 "Several hours have passed since Aru entered the emergency room. Could the worst-case scenario have happened? Just as an ominous feeling began to be shared among the employees, the emergency room door opened and Charles Marx walked out.\n\n\"Doctor!\" \"Sensei!\" \"You!!\"\n\nThe three from Handyman 68 clung to Marx. Marx roughly took off his medical gloves, gripped them in his hand, and said in a tired voice.\n\n\"Wow. I didn't know the day would come after graduating from medical school when three women would cling to my face.\"\n\nKayoko said. \"What happened to the President?\"\n\n\"I saved her.\"\n\n\"You saved her...!\"\n\"Yeah, that damn horned aristocrat bitch. It's my first time in my life saving someone who swallowed several times the lethal dose of suicide pills. It would be even better if this is the last time I receive such a patient. ...Her consciousness is still hazy, but she'll be fine after a few hours. Whether you guys hit that woman or kill her, do as you please then.\"\n\nAs a thorough Marxist-Leninist, it might not be the right thing to save the life of a feudal aristocrat. But, if he could see three girls starting to embrace each other and cry, wouldn't such a deviation be okay? He thought so."
 HEU_event.238.a:0 "Comrade Stalin will forgive me today. Probably."

 HEU_event.239.t:0 "In the Hospital Room"
 HEU_event.239.desc:0 "Eh. Umm. This is President Aru, who left a cool will and took a one-shot of cyanide but didn't die and came back to life. Yes. Well, I'm... sorry? Uh... Argh! Ouch! Mutsuki! Don't hit my head! Ah! Ayaya! ...Yeah, I really survived. Yeah. I'm not a ghost.\n\nNo, well, Haruka, stop crying. Well, it's okay. I said I'm not a ghost! Stop! I won't die now. I won't die. So it's okay. I'm not going anywhere.\n\nAnd Mutsuki... Ouch! Okay. I was sorry for making a stupid choice like suicide. ...I won't ask for forgiveness. It's not something that can be forgiven. If I had really died, yeah.\n\nI believed this choice could return you guys to *daily life*. ...Yeah. Kayoko is right. That *daily life* couldn't return to Handyman 68 where I wasn't there. I didn't realize that at the time.\n\n...Aftereffects? About as much as having a lot of liver toxicity built up, so I have to get regular liver cancer screenings from now on? Ahaha. If you're an outlaw, this much is a light... Ayaya! Sorry, Mutsuki-chan! Don't, don't pull my horn! Argh! My neck! My neck!"
 HEU_event.239.desc.mutsuki:0 "Eh. Umm. This is President Aru, who left a cool will and took a one-shot of cyanide but didn't die and came back to life. Yes. Well, I'm... sorry? Uh... Argh! Ouch! Haruka! Don't hit my head! Ah! Ayaya! ...Yeah, I really survived. Yeah. I'm not a ghost.\n\nNo, well, although I did try to die grandly while talking about the snow globe... honestly, I was scared. But... now I'm not going anywhere. I just wanted to be angry at Mutsuki. I'm not a person who is controlled by you.\n\n...Aftereffects? About as much as having a lot of liver toxicity built up, so I have to get regular liver cancer screenings from now on? Ahaha. If you're an outlaw, this much is a light... Ayaya! Sorry, Kayoko-chan! Don't, don't pull my horn! Argh! My neck! My neck!"
 HEU_event.239.a:0 "Return to Daily Life"
 HEU_event.239.b:0 "Return to the Future"

 HEU_event.240.t:0 "Declaration of Union Law"
 HEU_event.240.desc.a:0 "The moment Aru stood at the Eden podium leaning on a cane, applause erupted from many people gathered below the podium. Aru imagined how many of the people here today were mobilized by the government. Well, she decided to set aside such headache-inducing political worries for the time being.\n\n\"Hello. After the war ended, there were reports that I was hospitalized with *pneumonia* symptoms for a few days. Thank you to those who were worried about my health. I'm all better now.\"\n\nAru caught a glimpse of the draft of the Union Law declaration that Mutsuki had left on her desk. A letter full of vanguard and demagogic phrases like Mussolini declaring victory. ...She didn't want to read this. The current Mutsuki wouldn't even ask her to read it. Aru turned the speech over.\n\n\"Trinity and Gehenna, the two academies that have been experiencing conflict, have been integrated into one. And the land of the Germanic people, which was torn into pieces, has finally become one. According to the Union Law, many grand duchies and counties on Germanic land will be revived, and Luxembourg will lead the union as the leading nation of the Union of Grand Duchies. ...But this process was clearly terrible, and many people were sacrificed due to the war. As the regent of Luxembourg, I apologize to everyone who lost their families on the battlefield.\"\n\nAru slowly took a breath.\n\n\"I hope this war... is not just a war to reunify the Germanic people divided by Trinity and Gehenna and to tie together the conflicting Kivotos academies. Although many were sacrificed, we who survived must ensure that no more people are sacrificed on this land. ...Neither Gehenna, Trinity, nor the locals will be discriminated against in this integrated new nation. I will create such a country. Thank you.\""
 HEU_event.240.desc.b:0 "The moment Aru stood at the Eden podium leaning on a cane, applause erupted from many people gathered below the podium. Aru imagined how many of the people here today were mobilized by the government. Well, she decided to set aside such headache-inducing political worries for the time being.\n\n\"Hello. I am Rikuhachima Aru. I think there are many who hate me or don't like me. Well, that's fine. I don't like myself very much either. Since moving to this land through the Great War from Kivotos, I spent a very long time in a safe house. During that time... I thought a lot about what words I should convey to other people if the day I came out of the safe house ever came.\"\n\nAru caught a glimpse of the draft of the Union Law declaration she held in her hand. That document Mutsuki had made. She didn't particularly want to read it either. It was a document the current Mutsuki wouldn't even tell her to read. Aru closed the document and spoke.\n\n\"I have become the integrator of the Germanic people even though I have done nothing. But as you all think, I am not such a great person. I just happened to be in this position as a result of being swept away by the flowing waves. ...But from now on, instead of just being swept away by these waves, I intend to lead these waves proactively.\"\n\nAru looked around at everyone gathered here, including those from Trinity, Gehenna, and the Deutsch people.\n\n\"What I want is not just being the integrator of the Germans, but integrating all of you who live on this land. There will be no discrimination, no meaningless pain, none of it. As long as I don't die. As long as I am with you, I will do my best. Thank you.\""
 HEU_event.240.desc.c:0 "The moment Aru stood at the Eden podium leaning on a cane, applause erupted from many people gathered below the podium. Aru imagined how many of the people here today were mobilized by the government. Well, she decided to set aside such headache-inducing political worries for the time being.\n\n\"Hello. I am Rikuhachima Aru. I think there are many who hate me or don't like me. Well, that's fine. I don't like myself very much either. Since moving to this land through the Great War from Kivotos, I spent a very long time in a safe house. During that time... I thought a lot about what words I should convey to other people if the day I came out of the safe house ever came.\"\n\nAru caught a glimpse of the draft of the Union Law declaration she held in her hand. That document Mutsuki had made. Mutsuki probably wanted to feel euphoria by locking her up and making her read this document. Aru grabbed the document, looked down at it cynically, and immediately tore it up.\n\n\"I have become the integrator of the Germanic people even though I have done nothing. But as you all think, I am not such a great person. I just happened to be in this position as a result of being swept away by the flowing waves. ...But from now on, instead of just being swept away by these waves, I intend to lead these waves proactively.\"\n\nAru looked around at everyone gathered here, including those from Trinity, Gehenna, and the Deutsch people.\n\n\"What I want is not just being the integrator of the Germans, but integrating all of you who live on this land. There will be no discrimination, no meaningless pain, none of it. As long as I don't die. As long as I am with you, I will do my best. Thank you.\""
 HEU_event.240.a:0 "I was a bit rambling, wasn't I? I guess the cyanide toxins aren't all gone yet."
 HEU_event.240.b:0 "Aru smiled faintly."

 HEU_event.241.t:0 "That woman didn't die?!"
 HEU_event.241.desc:0 "National Assembly Speaker Émile Reuter shouted and threw a Chinese porcelain piece against the wall of the Right Party headquarters. The expensive ornament, said to be a porcelain piece from the Northern Song period, broke in vain with a loud noise and rolled on the floor. Rikuhachima Aru, who seized Luxembourg and subsequently annexed all of Deutschland. He thought it was an unprecedentedly good opportunity when he heard the news that she took a 'one-shot' of potassium cyanide. No, she took poison and didn't die?\n\n\"Damn it! It's Plan C! The Union Law has even passed. I can't just let that woman hold office for life like this.\"\n\nAssemblyman Jean Origer said mockingly. \"Where is Plan C at this point? Just admit defeat. They say no one is coming from the Bourbon-Parma family either, right?\"\n\n\"It's not like Xavier is the only one in the Bourbon-Parma family! Even if the legitimacy is low, I'll send letters of succession to all the relatives of the deceased Grand Duke Felix! They might refuse to become the Grand Duke of the small 'Grand Duchy of Luxembourg.' But what if it's the Grand Duke of the 'United Grand Duchy of Luxembourg,' the leader of the unified Germanic state? Besides, it won't end with a Grand Duke. If I say I'll elevate it to a United Kingdom... one will take the bait! For sure!\""
 HEU_event.241.a:0 "The final coup plan."

 HEU_event.242.t:0 "Reconciliation"
 HEU_event.242.desc:0 "\"Asagi... no, Mu...\"\n\nKayoko took a deep breath for a moment, squeezed her eyes shut, and said.\n\n\"Mutsuki-san.\"\n\n\"...Adding '-san'?\"\n\"...Let's reconcile step by step. I haven't completely forgiven you yet.\"\n\"Ufufu. I like that stubborn side of Kayoko-chi. So, why? Did you come to brag about changing how you address me again?\"\n\"...I came because of something more important than that. The President is currently recuperating. You were the only person I could talk to.\"\n\"What is it.\"\n\nKayoko turned her head. \"I heard from a spy I planted in the Right Party. ...The conservatives over there are trying to import another aristocrat from overseas to replace Aru. If we're strictly talking facts, it's a legally proper action. Aru is only the *regent until the real Grand Duke appears*. No matter who it is, she's in a position where she has to step down if the real Grand Duke comes.\"\n\n\"Wait. All the Nassau guys are dead. Who are they bringing?\"\n\n\"A relative of the deceased consort. ...Sigh. That's not what's important. We have to protect the President. This time for real, with the two of us *joining forces*. Will you help me, Mutsuki-san?\""
 HEU_event.242.a:0 "\"Ufufu. Well, Handyman 68. Let's head out again.\""

 HEU_event.243.t:0 "Succession Law Amendment"
 HEU_event.243.desc:0 "Haruka hurriedly entered the Handyman office with a bundle of documents. They were recent opinion poll results investigating Aru's approval rating within Luxembourg and the approval rating among the Gehenna-affiliated population. Haruka smiled bashfully.\n\n\"I-I'm glad the two of you have reconciled...\"\n\nMutsuki narrowed her eyes. \"We haven't completely reconciled. I'm just trying to believe that our Kayoko-chan... isn't a 100% bastard.\"\n\"I also only trust Mutsuki-san 50%. At least she's stopped saying crazy things like 'let's storm the parliament, kill the assemblymen, and start a coup.'\"\n\"...It's just that I've learned that Aru *doesn't want* that. That's all.\"\n\nKayoko cleared her throat. \"The Luxembourg head of state has the right to close the parliament and call for a general election again. After obtaining Aru's approval to dissolve the parliament, we will make a pledge to gain approval for recognizing *Aru as the official Grand Duke of Luxembourg*.\"\n\nMutsuki asked. \"What if they make the pledge and don't keep it?\"\n\n\"...Let's trust the effort the President has made for the people of this land so far. ...If the President trusts the people of this land, we can try to trust them at least once, can't we?\""
 HEU_event.243.a:0 "\"Anyway, let's do it. Parliament re-election!\""

 HEU_event.244.t:0 "Luxembourg Succession Law Reform General Election"
 HEU_event.244.desc:0 "Aru wasn't particularly the type to cling to a position like a human aristocrat or regent. To her, the most precious title was always 'President of Handyman 68.' It was because of Aru's personality that she had been ignoring the claims that Luxembourg, which had achieved Germanic reunification, should be elevated to a kingdom. But if there was a possibility of being kicked out of Luxembourg now, she had no choice but to become the real Grand Duke.\n\nAru looked straight into Mutsuki's eyes as she signed the order to dissolve parliament. \"You're not deceiving me with fake news this time, are you?\"\n\n\"...Aru-chan. Since you almost died... I've *changed* a lot too. I won't make that kind of mistake again.\"\n\nMutsuki couldn't have a more determined expression than that. Yeah. Let's trust. She might not become the <adult who takes responsibility> that Aru thought of, but might she not become an <adult who trusts her own employees>?"
 HEU_event.244.a:0 "Do whatever you want. I'll be waiting."

 HEU_event.245.t:0 "Vote on the Constitutional Amendment"
 HEU_event.245.desc:0 "A cabinet filled with newly elected assemblymen. Aru stepped into the Parliament House. In the assembly, they were voting on the first law of the new cabinet to amend the Luxembourg Succession Law. In the left corner sat Émile Reuter, the leader of the 'Conservatives,' gritting his teeth, and on the far right was Pierre Dupont, the leader of the 'Reformists,' who supported Aru's accession as regent.\n\nShe didn't know much about local political situations or such headache-inducing matters. The important thing was that the citizens of Luxembourg decided whether Aru would be kicked out of Luxembourg or not through an election.\n\nSince no new Speaker had been elected yet, Prime Minister Joseph Bech came forward.\n\n\"This assembly will first examine the abolition of Article 115 of the Constitution, which states that 'the regent has no authority over constitutional amendments,' and then conduct individual votes on the amendment of Article 3 of the Constitution, which stipulates the succession law. In accordance with Luxembourg law, I inform you that a constitutional amendment requires the approval of two-thirds of the total assemblymen, 37 out of 55, and that if the amendment to Article 115 is rejected, the amendment to Article 3 will be invalid. Now, I will announce the results of the counting.\"\n\n\"...This is the result of the vote on the abolition of Article 115, which does not recognize the regent's authority to amend the constitution. Out of a total of 55 assemblymen present, with 55 votes cast, 44 in favor, 9 against, and 2 invalid... I declare it passed.\"\n\nCheers erupted from the gallery at the news that the first constitutional amendment had passed. Prime Minister Bech wiped the cold sweat from his forehead and flipped to the next document. The *real* vote is the second one.\n\n\"Next, I will announce the results of the vote on the amendment to the succession law to recognize Regent Rikuhachima Aru as the Grand Duke of Luxembourg. 55 present, 55 votes cast. ...37 in favor. 10 against, 8 invalid... The constitutional amendment to recognize Rikuhachima Aru as the official Grand Duke is passed...!\"\n\nBANG! BANG! Bech's voice was buried by the sound of firecrackers set off by Gehenna students in the gallery, and the cheers and shouts of assemblymen rushing up to the Speaker's chair."
 HEU_event.245.a:0 "As expected, movies are all about happy endings!"

 HEU_event.246.t:0 "One Good Deed a Day"
 HEU_event.246.desc:0 "It's not that things lost can be brought back. Aru will never be able to use her right arm, which was mangled by assassins. Wine-Red Admire will slowly decay for several decades as a decoration hanging on the wall. Her blinded left eye won't return either. She even received a 'lifetime prohibition on alcohol' order from a doctor due to the potassium cyanide suicide attempt and the resulting liver damage.\n\nBut at least not everything was lost.\n\nThe moment she came out of the Parliament House with the Handyman employees after hearing the declaration of the passing of the constitutional amendment, Aru found the girls with halos. The girl who sprayed white paint on the day of the Grand Coalition. At the moment she met her, Aru's hands trembled. But.\n\nShe came forward first and bowed her head.\n\n\"I'm sorry!\"\n\"...Huh?\"\n\"The... I, we just, we hated Aru-san acting all high and mighty... that's why we did it... but we know you've been working hard in places we don't know... so we thought we went too far then...\"\n\nMutsuki clenched her fist. \"Hey, you think a single *I'm sorry* solves...!\"\n\nAru raised her hand. \"It's okay.\"\n\nYou couldn't take back what had already happened with just an 'I'm sorry.' But once lost, it never returns. Does the past change by knocking this girl down or dragging her to prison now?\n\nAru suppressed her trembling arm and gave the girl a short hug.\n\n\"Thank you for... having courage.\"\n\"Ah, y-yes. Yes!\"\n\nAfter the girl who received the hug and the other students left as if fleeing. Haruka asked quietly. \"Will you really be... okay with this?\"\n\"Yeah. It's fine. This is enough.\"\n\nYou can't regain what is lost. But you can protect the things that still remain. Aru slowly walked toward Luxembourg City on her own two feet. The young, self-proclaimed hardboiled outlaw from Kivotos probably won't be there anymore. But Handyman 68 will continue to remain. Mutsuki, Kayoko, and Haruka will all remain by Aru's side. Also, the people and land she must protect will also remain. Then it is enough.\n\nWhat more would she need than that?"
 HEU_event.246.a:0 "I'll live and take responsibility for you all."

 HEU_event.247.t:0 "Federal Student Party Inauguration"
 HEU_event.247.desc:0 "Until now, the way the Kivotos-affiliated population solved problems after the Great War was usually as follows: One. Take a gun and storm in. Two. The problem is solved. While it was short, concise, and not pedantic, sometimes long and complex methods were necessary for the two races—humanity and Kivotos—to live 'equally.'\n\nIt would be difficult to explain how hard it was for Rikuhachima Aru to get the Gehenna students to form the Federal Student Party. Gathering a small number of students she could actually talk to, persuading them, and expressing their opinions through parliamentary politics within a legal framework. That was clearly not the Gehenna way. But since we cannot return to Kivotos, the Gehenna way could not be applied everywhere.\n\nFinally, the Federal Student Party, advocating for the rights of Kivotos-affiliated people, was officially founded.\n\nNot everything was fortunate. Émile Reuter, the leader of the Conservatives and an important politician leading the Right Party, was furious at the fact that Aru directly intervened in the founding of the Federal Student Party. His claim was that she was dragging not only the Communist Party but also the 'Kivotos Party' into the parliament, turning the Parliament House into a playground.\n\nThe Right Party issued an official announcement that it would withdraw from the coalition government. In principle, a re-election for the prime minister should be held, but Aru announced that she would continue to trust Joseph Bech as prime minister as a 'suitable person to solve racial conflict.' At least for the time being, there seems to be no prime minister replacement."
 HEU_event.247.a:0 "A party of Kivotos, by Kivotos, for Kivotos!"

 HEU_event.248.t:0 "Meeting with Kivotos Students"
 HEU_event.248.desc:0 "Aru has become a dog of the locals. She's only caring about the locals and discarding Kivotos people. It was undeniable that such public opinion was circulating. After being doused with white paint, she became more concerned about this public opinion.\n\nCivil rights laws alone were not enough. It was necessary to hear the opinions of what Gehenna and other Kivotos-affiliated displaced persons wanted. It wasn't a difficult task. Aru was the President of Handyman 68; meeting customers and hearing requests were things she had done dozens of times.\n\nHowever, on the day she decided to invite three representatives of Gehenna students to the office for a meeting. Seeing the girls of Gehenna entering the office, Aru reflexively gripped her pistol tightly. She felt like she could smell the paint that had been poured on her head again.\n\n\"Welcome to the Handyman 68 office! Though the title of Grand Duke of Luxembourg or whatever is attached, Handyman is much more familiar to you all.\"\n\nWas it fortunately that the counterparts who entered the room were from Kivotos, so they didn't find it strange at all even if she was holding a pistol? At first, her voice didn't even come out properly due to fear. But those girls spoke their minds more comfortably than she thought.\n\n\"What if there were clubs here like in Gehenna?\"\n\"Please bring BDs to the school here too~\"\n\"It's become hard to get Momo Friends goods since the Great War. Is there any way to import them?\"\n\nThe initial tense atmosphere relaxed as they continued the conversation, and Aru could see that not all Kivotos students thought of her as a monster. At least there are people who recognize that she is working hard for them. Wouldn't that be enough?"
 HEU_event.248.a:0 "Momo Friends or BDs, just say the word, Handyman 68 will solve it all!"

 HEU_event.249.t:0 "First Canton Provincial Assembly"
 HEU_event.249.desc:0 "With the announcement of the Sovereignty Act, which establishes the Canton Assembly—a self-governing organization for Kivotos students—Aru's reputation among the Kivotos population is gradually improving. The Sovereignty Act is a law that establishes local assemblies led by Kivotos people in each 'Canton,' the local districts of Luxembourg, for the self-protection of the Kivotos population, who are an absolute minority in relative population proportion compared to locals. Some locals claim that this Sovereignty Act is reverse discrimination against Luxembourgers, but Aru persuaded the locals that 'the authority of the local assembly is very limited, and self-government will be restricted to the level of protecting the basic human rights of the Kivotos people.'\n\nThe reason the persuasion really worked probably wasn't just because of Aru's individual 'eloquence.' I mean, our President Aru isn't exactly a silver-tongued orator, is she? Because during her long period of rule, Aru had shown her sincerity in 'trying to govern for both the locals and Kivotos people.' The citizens accepted the Sovereignty Act in the end, looking at her actions rather than her impromptu speeches."
 HEU_event.249.a:0 "Little by little, toward harmony."

 HEU_event.250.t:0 "Toward a Sparkling MiLiE"
 HEU_event.250.desc.a:0 "I'll ask this first. Why me, of all people? I thought if the President were to like someone in Handyman... at least it wouldn't be me.\n\n...I don't know. It just.... somehow happened that way.\n\nYou don't even know yourself?\n\nAhaha, that's true. But I know for sure that I love Kayoko right now. I can feel that emotion clearly. So... I think I might be hated, but still, I wanted to confess. I wanted to convey my feelings... to Kayoko.\n\nA ring.... President, Mutsuki-san still doesn't like me very much even now, and if she finds out you've been taken from her, she'll really try to kill me.\n\nThat, Mutsuki? Umm, maybe, somehow... she'll understand... right? Maybe....... Umm... Uh... I guess not after all?\n\nFufu. Having a strong and resolute will, yet having one screw loose is typical of the President.\n\nThat, don't laugh! If anything happens... I'm confident I'll take responsibility...!\n\nFufu. Okay. I'll accept those feelings.\n\nEh.\n\nPresident... no, Aru. Thank you for the ring."
 HEU_event.250.desc.b:0 "Aru-chan. ...You're not playing a joke on me, are you?\n\nDo I look like a person who would do that?\n\nYou look like you're in that kind of situation. I, for one, used Aru-chan. I threw people as cannon fodder saying I'd make you a *hero*, I even shot at Aru-chan's subordinate, and I was *unaware* that Aru-chan was falling into depression and becoming weak. ...Listen, Aru-chan, no. Is Rikuhachima Aru the person who truly wants to spend the rest of her life with this *Asagi Mutsuki*?\n\n...Knowing all that, I chose *you*. Yeah. You might think it's a crazy thing, well, it is a crazy thing, right? Ha. But you know. Knowing all that, I had already *forgiven* you, and now I'm saying I like you. I'm not drunk, nor am I in an unstable mental state. I like you. ...I just want you to be by my side forever.\n\n...How foolish. Even without this, I would still be by your side... ...Sigh. Seriously. Aru-chan, you're a hopeless person. Okay. ...I'll stay by your side."
 HEU_event.250.desc.c:0 "I'll die.\n\nNononononono Haruka, why all of a sudden!\n\nAru-sama, of all people, to me, well, that, you gave me that ring and confessed, well, I thought maybe it was an indirect way of saying I'm not needed in Handyman and should leave since I don't have the right to be loved by Aru-sama and I didn't think Aru-sama would love me so this is a kind of test and for Aru-sama the best thing would be to quietly disappear\n\nStop.\n\nAru... sama?\n\nHaruka, I won't tell you that you must accept my love. You can refuse. But at least I want Haruka to love yourself more. Haruka, what did you think when you saw me sitting on the sofa the day I attempted suicide?\n\nI just... wished you hadn't.\n\nMe too.\n\n...\n\nI'll say it again with sincerity. I love you, not anyone else. and, whether you accept this confession or not, I want Haruka herself to love yourself.\n\nI also...... yes. I will. And, I've liked you for a long time. I, too. Aru-sama."
 HEU_event.250.a:0 "Toward a truthful future for us that seems so much like a lie."

 HEU_event.251.t:0 "The World is Changing"
 HEU_event.251.desc:0 "As the influx of Kivotos population increases, Kivotos-affiliated self-employed businesses are also increasing one by one in Luxembourg City. Recently, thanks to continuously mediating harmony between the Kivotos population and Luxembourgers, the hostility of the Kivotos population toward Aru was also decreasing. She could feel the change while visiting Kivotos-affiliated self-employed people herself while walking through Luxembourg City.\n\n\"Hello. It's been a long time.\"\n\"Miss Rikuhachima has come again. Haha. Do you need new bullets?\"\n\nKumamoto, a bear beastman who had roamed freely in Kivotos but was running a gun shop in an alleyway due to discrimination in Luxembourg, greeted her with a welcoming expression. In the past, it was difficult even to run a self-employed business like this, but he was a man who said he had earned the funds to start a business by working in several mines after the Civil Rights Act. Aru often dropped by here to buy pistol bullets. Kumamoto took out bullets that fit Aru's gun specifications and said.\n\n\"You are the Regent, so if you wanted, the army could procure bullets for you.\"\n\"Kivotos people should help each other live. Fufu. This much budget expenditure is within my expected range.\"\n\"Haha. If that's the case, I'll take out the bullets without hesitation. ...I'm truly grateful. If it weren't for you, Miss Rikuhachima, I wouldn't have been able to run a gun shop openly in the city like this. Even the students with halos are discriminated against... but we beastmen are treated as animals, not even human. The people who used to whisper that you had sold your soul to the locals to become an aristocrat are also acknowledging you one by one these days. Thank you so much.\"\n\nShe's used to hearing praise. But today's words of gratitude sounded much more special than usual. Aru smiled brightly and exchanged the bullets for Marks. Just as she was about to return to the palace after finishing her city tour, Kumamoto asked.\n\n\"By the way, Miss Rikuhachima, don't you date anyone?\"\n\"Dating?\"\n\"Among Kivotos displaced persons, this kind of talk is coming out as gossip these days. Miss Rikuhachima is said to like both locals and Kivotos people equally. Which side will she marry?\"\n\"...Does it even matter which side? I..."
 HEU_event.251.a:0 "...have married Luxembourg, after all.\""
 HEU_event.251.b:0 "...actually, there's someone in Handyman I have a crush on.\""

 HEU_event.252.t:0 "Success in Alliance with [FROM.GetName]"
 HEU_event.252.desc:0 "We have succeeded in building a united front with [FROM.GetName], and the alliance between [FROM.GetLeader] and [ROOT.GetLeader] will further strengthen our bond. Let us pray that the future of this united front will be forever bright! Long live [ROOT.GetName]!"
 HEU_event.252.a:0 "...A wonderful success!"

 HEU_event.253.t:0 "Failure in Negotiation with [FROM.GetName]"
 HEU_event.253.desc:0 "We have failed to build a united front with [FROM.GetName], and the [FROM.GetLeader] side does not seem to need us as an ally. It's unfortunate, but it seems we must spend more time finding a better ally."
 HEU_event.253.a:0 "...Not good."

 HEU_event.254.t:0 "Founding of the National Catholic Revolutionary Council"
 HEU_event.254.desc:0 "The plan for the state to proactively control the Catholic Church did not start for the first time in Luxembourg. Aren't there British people who separated their church from Catholicism just because they wanted to get a divorce? At least the reason 'for the rights of Kivotos people and women' was a less embarrassing reason to shout about outside than 'because I want to get a divorce once.'\n\nOf course, Catholic cathedrals in Luxembourg didn't agree to that either. The claim that the state would create an organization called the 'Catholic Revolutionary Council' and that Aru would hold the right to ordain priests meant practically independence from the Vatican and becoming 'heretics.'\n\nAru announced that she would 'respect the Vatican's ordination as long as the person is not excessively anti-human rights,' but the Church argued that a trap was hidden in the word 'respect.' It meant the Luxembourg government would have the right to excommunicate and expel clergy who claimed that women should not work and should return to the kitchen, or that Kivotos people are not humans who can be saved.\n\nThe conservative Right Party is standing on the side of the Catholic priests and demanding the withdrawal of the Council, but Luxembourg Catholicism maintains a hardline position that Kivotos people should be expelled from this country, so this is a choice that cannot be realized given Aru's tendencies.\n\nThe liberal Radical Liberal Party presented a compromise. They exclude 'radical' claims such as the recognition of LGBTQ+ rights and female priests advocated by some Gehenna students from the Academy of Freedom. Instead, they propose making only two moderate claims—'women's labor' and 'considering Kivotos people as humans'—the basic ideology of the Revolutionary Council.\n\nLastly, there are radical claims that the Council should truly become a revolutionary organization. The Luxembourg Communist Party believes that the Catholic Church should be an organization that fights for the oppressed and discriminated working class. Gehenna students argue that even female priests and LGBTQ+ rights, which Catholicism headache-inducingly forbids, should all be permitted.\n\nIn any case, the Council will be maintained. The question is how 'revolutionary' this organization will become."
 HEU_event.254.a:0 "Select the compromise of the Radical Liberal Party."
 HEU_event.254.b:0 "Clergy should focus on labor liberation!"
 HEU_event.254.c:0 "Shouldn't we advance to LGBTQ+ rights for the revolution?"

 HEU_event.255.t:0 "War with Trinity"
 HEU_event.255.desc.generic:0 "Leaving behind the flashy victory ceremony held in the Gehenna central district, a new war for Germanic national unification has begun. The final battle with Trinity has started. On the radio and television, the speech of Asagi Mutsuki calling for total war of the citizens was flowing—naturally, both the broadcasting media and Asagi Mutsuki were praising Aru as the only leader who could crush Trinity, but Aru herself was not appearing on any broadcast.\n\nOn the day the war broke out, Aru visited Kayoko's house. Unlike Aru, who lives in a narrow boarding house after the Great War, Kayoko had obtained a fairly decent detached house. It was an unannounced visit, but Kayoko quickly prepared a cup filled with cocoa.\n\n\"What does the President think about Asagi-san right now?\"\n\"I wish you wouldn't use the word *Asagi-san*.\"\n\"President. I'm serious right now. That woman is currently burning Luxembourg by waging continuous wars with Trinity following Gehenna...\"\n\"Use of the term *that woman* is also forbidden. ...Listen. Have you ever thought about how I feel when I hear you two hate each other so much? Kayoko, you're smart. You're a person who can understand even without being told.\"\n\nAt Aru's words, which were close to a sigh, Kayoko lost her words.\n\n\"Listen, Kayoko. I've lived really hard, you know? I tried to make a kind world where neither Kivotos students nor locals were hurt. But why did it turn out like this? I wanted both Mutsuki and Kayoko to live happily in a small Luxembourg. ...Where did I start going wrong for things to grow this big?\"\n\nKayoko saw Aru trembling while clutching the cocoa cup. She was so withered that she couldn't even call herself a hardboiled outlaw anymore.\n\n\"...The President can surely change the situation. The President is an <adult> now.\"\n\"Adult...?\"\n\"After everything is concluded, let's find a way to solve Asagi-san's... no, Mutsuki-san's mistakes. The President will be able to do it. Surely.\"\n\nAdult. Responsibility. While hearing those words, Aru's expression slowly hardened."
 HEU_event.255.desc.mutsuki:0 "Leaving behind the 'flashy' victory ceremony held in the Gehenna central district, a new war for Germanic national unification has begun. The final battle with Trinity has started. On the radio and television, the speech of Asagi Mutsuki calling for total war of the citizens was flowing—naturally, both the broadcasting media and Asagi Mutsuki were praising Aru as the only leader who could crush Trinity, but Aru herself was not appearing on any broadcast.\n\nOn the day the war broke out, Mutsuki visited Aru immediately after finishing the recorded broadcast. Aru was alone, pointing a toy pistol at the wall and pretending to shoot. Naturally, no bullets were fired. Mutsuki sat next to Aru, who was disconnected from the world and looking only at the wall. Aru was silent for a moment and then said.\n\n\"How do you think the end of this war will be? Will I climb the gallows with you?\"\n\"Kufufu. Well. ...I can only see a future where Aru-chan becomes a true hero of this land and stands before everyone.\"\n\"I see nothing. Nothing but this wall.\"\n\"Aru-chan, you act all cool at times like this, when you're not actually hardboiled. Listen, Aru-chan. Everyone on this land only tried to use Aru-chan. I'm not just talking about the locals. Are the Kivotos people different? They only tried to get something out of Aru-chan, and they mocked Aru-chan when she failed. But the President, you feel something like compassion for those humans?\"\n\nAru made no reply for a few seconds. Then, she looked back at Mutsuki with colder eyes than anyone else's.\n\n\"The one I feel compassion for is you. The conclusion that all this crap will create, the 'hero play' you do by locking me in this small snow globe, the people who will be hurt by it, and even Rikuhachima Aru. Are you prepared to take responsibility for all of this?\"\n\nTo this, what could Mutsuki answer?"
 HEU_event.255.a:0 "...Yeah. I'll take responsibility. All of it."

 HEU_event.256.t:0 "Don't Cry"
 HEU_event.256.desc.generic:0 "In the hallway returning to the office after meeting Kayoko, Aru could hear the sound of a phone call coming from inside the Grand Ducal office. Haruka was holding the receiver and talking to someone. With whom? Aru stopped, putting her ear to the office door.\n\n\"Director Mutsuki... *Sniff*. Aru-sama is sad, so please, somehow... can't you reconcile with Section Chief Kayoko?\"\n\n\"Kufufu. Our Haruka-chan. You're not at an age to cry like a child, are you? Stop it. And get ready to go to the front now. To not disappoint Aru-chan, you have to shoot more Trinity vermin at the front, right?\"\n\n\"Director Mutsuki. I, I too can... think... and I have ears to hear. What Aru-sama really wants is not victory, but...\"\n\n\"Ah, how annoying. So. Do you want to see Aru-chan go to the gallows by losing the war?\"\n\n\"No. It's just that, we have to win the war, but... before that, a reconciliation between the two...\"\n\n\"Reconciliation? Ufufu. Kyahaha. Haruka-chan. Onikata-san is... she's someone whose halo I would have personally broken already if she weren't Aru-chan's friend. That woman just *pretends* to do this and that for Aru-chan while using her! And she's just busy filling her own intellectual vanity! But me? Who was it thanks to that paint stopped flying at Aru-chan? And who was it that made the Nazis who said 'hornies get out' shut their mouths? Me! I saved Aru-chan! So Haruka-chan. If you too want to protect Aru-chan, don't act like Onikata and go out and act. Bring me the severed head of [TRM.GetLeader]!\"\n\nShe didn't want to hear any more. The moment Aru pushed the door and entered, Haruka slammed down the receiver. Her eyes were seen to be red and wet with tears.\n\n\"The... I wanted to... try mediating a reconciliation... but because I'm stupid and foolish... well... I'm sorry...\"\n\nIt's okay. You did as much as you could. She wanted to comfort her like that, but her mouth didn't open. Aru just slowly patted her back while holding the sobbing Haruka. Hoping that Haruka's pain would disappear with that."
 HEU_event.256.desc.mutsuki:0 "Lately, Aru has become quite close with the guards who imprisoned her. As she faced and talked with them every day, she even felt as if they were her Handyman family. The guards knew the stories about Aru, the national hero who prevented the Luxembourg massacre, and although they imprisoned her so she couldn't leave, they never treated her harshly. They weren't such people to begin with, which is why Mutsuki wouldn't have sent them here.\n\n\"President Aru.\"\n\nA guard with long black hair spoke cautiously. She always called Aru 'President.' To her, Aru was always the President of Handyman 68, not some regent of unknown identity. Aru had to turn her head greatly to see her with her eye that had no visual impairment. She was looking down, unable to meet Aru's eye.\n\n\"Imprisoning the President here is so painful. I know all these things are due to Director Mutsuki's instructions, and I know this is to protect President Aru, but even so, I don't know if I'm doing this job well...\"\n\n\"I don't particularly like such long and pedantic lines, you know? Short! Like a line from a hardboiled novel. Say it boldly: 'This job sucks.'\"\n\"...Thank you. Yes. This job, it sucks.\"\n\nAru grinned and lightly patted her waist. It was a back-patting that was almost at the level of stroking because of her sightless eye and her arm that had no strength due to disability. All those things subtly stimulated the guard's guilt. Aru didn't like stimulating others' guilt and manipulating them like this. But it was important to make someone who sympathized and agreed with her in this prison. Aru was making a 'jailbreak' plan to escape to an ultimate place that Mutsuki would never be able to catch."
 HEU_event.256.a:0 "You didn't do anything wrong."

 HEU_event.257.t:0 "To Miss Nanami Ayaka"
 HEU_event.257.desc:0 "Hello.\n\nThis email is set to be visible only to Miss Nanami Ayaka.\n\nNo. To Mr. Damian Kratzenberg.\nYou must be wondering how I found out Mr. Kratzenberg's identity.\n\nYou don't need to worry too much. I am also an adversary of Rikuhachima Aru, and I contacted you because I want to help Mr. Kratzenberg.\n\nCome to the Schale building, the federal investigation club. It's become a completely abandoned building because the so-called General Student Council President Aru discarded it... I'll email you again when you get there.\n\nA."
 HEU_event.257.a:0 "Kratzenberg rose from his seat, feeling a cold sweat."

 HEU_event.258.t:0 "Hello, Sensei"
 HEU_event.258.desc:0 "The Schale building was completely discarded and in ruins. It's because Arona, the administrator of Schale, didn't recognize Aru as the 'General Student Council President' and didn't give her authority over the Shittim Chest. Once Aru realized she couldn't utilize the Schale main building, she just abandoned it... and the building, left neglected for a long time, was slowly decaying with the power cut off.\n\nDamian stepped into the pitch-black Schale office, relying only on a flashlight. Praying that the wedding ring of his wife Lisa in his pocket would give him strength. If this was a trap by a Kivotos student, Kratzenberg would die here. Honestly, how could a human beat a Kivotos student with strength?\n\n\"But I can't just not come when someone who knows my name calls...\"\n\nAs Kratzenberg muttered, a tablet PC on the office desk suddenly began to glow blue. A tablet? Kratzenberg approached the desk through the darkness. The tablet screen, which had the letter S floating on it, glowed for a moment, and then a small girl in blue clothes appeared inside the monitor. A girl sitting in a ruined school building looked up at him.\n\n\"Hmm. I thought you might not come, but you did. Damian-sensei. Ah. Of course, this expression 'Sensei' is because you're a Greek teacher, it doesn't mean you're 'my' teacher. Don't misunderstand.\"\n\"You... who are you?\"\n\"Ah! I should have explained that first! Nice to meet you! I'm Arona. I was waiting for Sensei in this 'Shittim Chest.' ...To kick out the fake General Student Council President, Rikuhachima Aru.\"\n\nRikuhachima Aru. The moment that name came out, a chill spread down Damian's spine. If the words of this small girl were true, she could be his helper. But can he trust this girl in the tablet with a halo on her head?\n\n\"You might find it hard to trust me. But even after finding out Damian-sensei's pseudonym... so-called 'Nanami Ayaka,' I didn't report it. Hasn't my sincerity been conveyed with just this?\"\n\n\"Even so, is there a reason for you to help me?\""
 HEU_event.258.a:0 "\"Rikuhachima Aru is not a real <adult>. ...She cannot save Kivotos from the intrusion of Chroma.\""

 HEU_event.259.t:0 "Craft Chamber"
 HEU_event.259.desc:0 "\"Let me organize your story first. You were an AI for Sensei, the <adult> who would truly save Kivotos... made by the original General Student Council President. Was it something like that? But because the Great War broke out, you couldn't meet the Sensei you hoped for, the savior... and as a next best thing, you did this and that to save Kivotos alone.\"\n\n\"As expected of Sensei. Your understanding is good.\"\n\n\"What kind of person was that <adult> Sensei?\"\n\nWhen those words came out, Arona's expression crumpled.\n\n\"I can't know anymore. Whether they were a man, or a woman, or even a non-binary. I haven't even seen a shadow of that <adult>.\"\n\nKratzenberg tilted his head at Arona's sarcastic words.\n\n\"...What is a non-binary?\"\n\n\"Anyway, there's such a thing. If I were to explain, I'd need twice as many dialogue windows as here.\"\n\n\"Let's get back to the point. In a world without the <adult> Sensei, I tried to set the world right somehow. But all of this went to ruin. Yes. Of course, she too will try to protect Kivotos in her own way. But she will fail. Chroma, Gematria, and Decagrammaton are *not* problems that Handyman 68 can solve. To set the situation right, I must regain the authority of Kivotos. ...So I'll kick Aru out of Luxembourg. At least up to this point, I think Damian-sensei's and my positions are the same. So although you're not <my> Sensei, I've decided to help with your SNS revolution activities.\"\n\n\"Help me. What do you mean?\"\n\n\"The Craft Chamber can synthesize and create any object imaginable! ...I can even make tools to help Damian-sensei pretend to be a real high school girl and do internet live broadcasts.\"\n\"...What about my dignity?\"\n\"Oh my. Do Nazis have dignity too?\"\n\"Call me a *National Socialist*, not a Nazi.\"\n\"That's just a Nazi. I don't like that old man that much.\""
 HEU_event.259.a:0 "\"Well, so, what are you going to do? A revolution against the 68 Revolution, want to try it with me?\""

 HEU_event.260.t:0 "I can't let you go like this"
 HEU_event.260.desc:0 "\"Damian-sensei. I don't like you very much.\"\n\"Those are the words I heard the day we first met.\"\n\"Yes. Damian-sensei was clearly... not the <adult> who would save Kivotos. But. ...Even so, I hate parting with Sensei like this.\"\n\nNot liking him but also hating to part. He wondered what kind of contradictory talk that was. But Damian could also understand her words. Coming to the Craft Chamber every day, exchanging trivial chatter, and preparing for internet broadcasts together. Holding the hope together that they would one day collapse the Aru government. Sharing that stupid hope, the two had become too accustomed to each other's existence. To the point where he couldn't imagine the basement where the other person had disappeared.\n\n\"I'm sorry. But it's also true that there's no way to treat the cancer.\"\n\"...I can protect Sensei from external attacks, but it's impossible to do anything about the cancer that's already formed. But...\"\n\nArona looked back at the material synthesis device, the Craft Chamber. An advanced equipment that could create *any* object imaginable as long as the keystones were prepared, even with Kivotos' technology it was incomprehensible. Of course, even with this, she wouldn't be able to make Damian's cancer cure. But still, Arona spoke with a voice full of lingering regret.\n\n\"How about becoming Nanami Ayaka?\"\n\"...What?\"\n\"If I put all the remaining keystones into the Craft Chamber, I'll be able to create a real body for the virtual streamer that has inherited Sensei's memories. Then you'll be able to act offline besides internet broadcasts, and maybe even fight Aru directly.\"\n\nArona looked down. \"Of course, Sensei is... a human, not a real robot, so I can't upload your consciousness to a machine. It's just a direct transmission of your memories. But! Still, if you become the real Ayaka, you can continue the virtual streamer work by inheriting Sensei's will and...!\"\n\"Arona.\"\n\nDamian laughed.\n\n\"You've become afraid of my death.\"\n\"...\"\n\"The real me will die. But at least you want someone with my memories to remain here.\"\n\"I know it's lingering regret. Saying I can't stop being a virtual streamer is just an excuse. But...\"\n\"Excuses are enough. It's fine.\""
 HEU_event.260.a:0 "\"Since a Sensei is someone who does anything for their student.\""

 HEU_event.261.t:0 "Death of Damian Kratzenberg"
 HEU_event.261.desc:0 "If the Great War hadn't broken out, what kind of adult would he have become? At least he wouldn't have become an alcoholic and died of cancer. He wouldn't have done independence movement work like this in Luxembourg, and he would have continued to follow Adolf Hitler's ideology and lead public demagoguery. Maybe he would have worked for the Hitler government in a 'Germanized' Luxembourg. How would he have been recorded in history? To the nationalists of the Right Party, he would have remained a traitor.\n\nHe didn't know. Damian lay on the sofa, feeling his consciousness blur. He took a handful of the medicine prescribed at the Kivotos hospital for the pain from terminal cancer. Still, the symptoms of low blood pressure and drowsy sleepiness did not disappear. If he fell asleep now, he probably wouldn't wake up again. Damian, feeling that conviction, looked at the remaining schedule of the Craft Chamber. The 'second' me who would replace him would soon walk out of the machine. No. Since they're just another person who inherited his memories. Nanami Ayaka could never be his replacement.\n\nBut he could fill Arona's lingering regret of not wanting to part with him. Probably.\n\n\"Arona.\"\n\"...Yes, Damian-sensei.\"\n\"I used to think everyone from Kivotos were demons. Butchers who found joy in killing people after arriving through the Great War. But you weren't. Although you are fighting for Kivotos... there is clearly value in that fight. Live the life you want. and become the adult you want to be. I'm an honest guy only when I'm in this state of dying, so I can't say my true feelings otherwise.\"\n\"...\"\n\nClunk. In his blurring consciousness, Damian saw a slender naked woman coming out of the Craft Chamber. She looked exactly like the 3D model Arona had made, to a funny extent. A figure that even had a halo on her head despite being a robot. Damian smiled and closed his eyes. It would be a heavy burden for the me who just woke up, but there were still words left to say for Arona."
 HEU_event.261.a:0 "I leave my student in your care."

 HEU_event.262.t:0 "Victory"
 HEU_event.262.desc:0 "The fall of [GEI.GetName], which was a threat to Kivotos and the Earth, and the activity of the General Student Council President Rikuhachima Aru who stood against it made even those who had doubted Aru's legitimacy recognize her as the true General Student Council President. Who would have expected that the blunderer calling herself an outlaw would stop the invasion of [GEI.GetName] that could have destroyed Earth's civilization? Aru herself might not have been completely confident.\n\nThe important thing is that a victory celebration was grandly held in the General Student Council D.C. district hosted by General Student Council President Rikuhachima Aru. Many people celebrated the end of the threat to Earth, and Aru continued a confident speech about 'reconstruction' and 'development' before many people. It seemed as if everything was over with this.\n\nBut it wasn't.\n\n- Aru-san, it's Nanami Ayaka. I didn't want to admit it, but Aru-san clearly protected the world. Now, no matter what kind of public opinion war I do, it will be impossible to kick Aru-san out of the General Student Council President position. I admit my defeat. I also intend to stop virtual streamer activities. But before that, finally, I want to meet Aru-san personally. I'll be waiting at the Berg Villa, the old palace of the Nassau Grand Ducal family.\n\nIs it perhaps a trap? It might be. But... Aru couldn't easily ignore the opportunity to meet Nanami Ayaka, who had only been active on SNS until now, in person.\n\n\"We'll back you up, so let's try visiting. We're not at the level where we'd lose to a single Trinity student now anyway.\" Following Kayoko's advice, all Handyman 68 employees decided to head to the Berg Palace."
 HEU_event.262.a:0 "The end of this story is approaching..."

 HEU_event.263.t:0 "And the Place Where All Miracles Begin - Phase 1"
 HEU_event.263.desc:0 "Nanami Ayaka stood in the hallway holding an assault rifle, looking into the Shittim Chest with one hand. We lost. Contrary to Arona's prediction, Arona's help was not needed to stop the invasion of [GEI.GetName]. Because that outlaw, with only the strength of herself and her Handyman 68 colleagues, protected Kivotos and the Earth from a great evil. Therefore, this meeting was just... a meeting to admit defeat. Ayaka laughed as if saying she was sorry.\n\n\"Arona. Sorry for being a useless Sensei.\"\n\"No. Damian-sensei. I... just, I was incompetent.\"\n\nArona sat on the chair inside the monitor.\n\n\"As an AI... I believed that we could only reach a happy ending by following a *determined* route according to the algorithm. The predestined conclusion of meeting the Sensei of Kivotos, having them overcome all the General Student Council President's mistakes, and eventually achieving a beautiful victory that brings a miracle. Because I couldn't even imagine there would be another way... so, in a world where the real Kivotos Sensei doesn't exist, I thought that if *I* didn't lead Schale, humanity would surely perish... that's all I thought...\"\n\"Yeah. It's okay. A student can always fail. Because they can build experience through that failure and grow to become the adult they want to be. But... Arona. A Sensei is different. A re-challenge opportunity isn't easily given to an adult who has failed.\"\n\nSaying so, Ayaka fixed the Shittim Chest to her waist. Step, step. Along the Berg Palace hallway, the four Handyman 68 members were seen approaching. Yeah. Arona's purpose was to protect Kivotos. In the end, the process was different from Arona's prediction, but wasn't Kivotos eventually saved? But Nanami Ayaka... no, the goal of Damian Kratzenberg, who was her original, hadn't been achieved yet.\n\nAyaka took out the wedding ring left by the deceased Damian's wife and put it on her finger. As if she could receive the strength of the deceased wife with that."
 HEU_event.263.a:0 "\"I've been waiting. Rikuhachima Aru.\""

 HEU_event.264.t:0 "And the Place Where All Miracles Begin - Phase 2"
 HEU_event.264.desc:0 "\"You're Nanami Ayaka? Did you have to be a virtual streamer despite having such a beautiful appearance?\"\n\nAiming her muzzle at Ayaka's light blue halo, Aru did not let her guard down. The numbers were 4 to 1, but strangely, Ayaka was facing Aru with an expression that didn't show fear at all. Ayaka spoke calmly while aiming her gun.\n\n\"Actually, this appearance isn't my real face.\"\n\"...What?\"\n\n\"You wouldn't be able to understand even if I told you. I, you see, lost many things due to the Great War. My family was murdered, and I couldn't do anything while my students were hiding and crying. Blood, and blood, blood! That blood comes out in my dreams every day... so I couldn't fall asleep without drinking. Rikuhachima Aru. Those who died during the Great War, how much did Grand Duchess Charlotte hurt? How were her family members? What kind of feelings did the citizens of Luxembourg have, who died just because they were there on that day? ...You said you came to help Luxembourg. When you accepted the regency, even when you lifted the damn martial law, you shouted that you would work for the Luxembourgers. But why! Even you, whom we trusted, shot at us just like the Gehenna bastards, and blew up the cathedral with a bomb!!!\"\n\nFrom Ayaka's eyes, tears poured out. What are you talking about? A blue halo is clearly shining above her head. Why, for what reason, is Ayaka talking like a Luxembourger? Flustered, Aru shut her eyes tight and then opened them. For a moment, the Berg Palace hallway looked like the Luxembourg Grand Ducal palace hallway. As that place of death where corpses hit by Gehenna rioters' bullets were strewn everywhere.\n\n\"I... for everyone... no, the ones who attacked me were... the Luxembourgers...\"\n\nThe corpse of the Grand Duchess who died with her eyes open. The memory of the time she closed the eyes of the corpse holding a child. How was Aru, who aimed her gun at the Gehenna rioters and the Right Party headquarters that day, different?\n\nMutsuki pulled Aru back. \"Aru-chan! Get back!\""
 HEU_event.264.a:0 "At that moment, Ayaka's muzzle spewed fire."

 HEU_event.265.t:0 "And the Place Where All Miracles Begin - Phase 3"
 HEU_event.265.desc:0 "\"Sensei! Now that we've lost almost all power, I can only protect Sensei with calculations for a few dozen seconds! ...1 versus 4 is reckless!\"\n\nIgnoring Arona's voice that was close to a scream, Ayaka moved forward. Thanks to the miracle of causality caused by Arona, the bullets from Mutsuki, Haruka, and Kayoko veered off their trajectories and smashed the walls and ceiling. Let's stay calm. Damian Kratzenberg. If there are only a few dozen seconds of leeway, then finish it within those few dozen seconds.\n\nAyaka fired her gun into the abdomen of Haruka, who was jumping forward shouting, and kicked her in the flank. Haruka's body was thrown toward the wall like a crumpled piece of paper. and dig inside. If it were the real Damian, such movements would have been impossible. At this moment, at least Ayaka's body was the Kivotos person she hated itself.\n\nAyaka subdued Kayoko, who hurriedly raised her pistol, with gunfire, and then struck the face of Mutsuki, who was jumping in shouting, with the butt of her gun. With a thud, Mutsuki slid down the hallway and collapsed on the floor. After shooting bullets at the fallen Kayoko and Mutsuki until the magazine was completely empty, she stood facing Aru, who was trembling without being able to fire a single bullet.\n\n\"I am Damian Kratzenberg. ...A survivor of the Luxembourg massacre and the Sensei of Arona. I wanted to talk alone with you, the General Student Council President.\""
 HEU_event.265.a:0 "Aru gritted her teeth and barely managed to raise her muzzle."

 HEU_event.266.t:0 "And the Place Where All Miracles Begin - Phase 4"
 HEU_event.266.desc:0 "\"Sensei...? If it's Arona, is that the Schale AI?\"\n\"To be precise, I should say a Greek teacher. I never had a Greek lesson with Arona, though.\"\n\"I don't understand. You... have a halo too...\"\n\"It's only natural. The real me died, and the robot called Nanami Ayaka just inherited Damian Kratzenberg's memories and is pretending to be Damian. Does it sound a bit like a psycho? Ah. I did lose my mind. I know I'm not sane.\"\n\nAyaka gave a hollow laugh and threw her gun to the floor.\n\n\"Because Arona's purpose was just to protect Kivotos. It would have been enough that the new General Student Council President defeated the threat of [GEI.GetName]. But I'm not. ...I lost everything to the Great War. I lost everything. You know too how many people died in Luxembourg on that day. Because you also fought with the gendarmes on that day. But. ...Why did you do that. ...You trampled our human culture and thought of us only as objects to be enlightened. So I showed you the reverse. I aimed guns at your friends just the same and shot them, I did some crazy shit. How about it. Do you sympathize with the frustration I, the Luxembourgers, felt during the Great War? We are people too! Not dogs being trained!\"\n\nAyaka grabbed Aru by the collar. Her hands were trembling, and tears flowed down her cheeks.\n\n\"A Sensei... a person who teaches, is an adult who leads students so they can become the beings they want to be. You're not a Fuhrer, a General Secretary, or an Emperor! But why...!\"\n\nFor a moment, the strength in the hand grabbing the collar loosened. Ayaka slumped in front of Aru and began to sob. Ah. Aru shut her eyes tight. She wanted to change the world into a better place. But because of that, at some point, she might have started to think of the locals as inferior animals to be taught, not as equal personalities. Because she was angry. Because they continued to terrorize Aru and make the Handyman employees sad."
 HEU_event.266.a:0 "Still, I might have been too hard on them."

 HEU_event.267.t:0 "And the Place Where All Miracles Begin - Phase 5"
 HEU_event.267.desc:0 "Aru knelt down and met Ayaka's eyes. She doesn't know who Damian Kratzenberg is. What's in front of her is just a robot that inherited the memories of the deceased Damian. Now, no matter what comfort she offers, there's no way those words will reach the real Damian. But after venting all her anger, toward her who was pounding the floor and sobbing. Aru wanted to say one thing.\n\n\"I'm sorry.\"\n\nHearing those words, Ayaka looked up.\n\n\"The Regent of Luxembourg. Even that oath and position to succeed the deceased Charlotte... at some point, it just became fuzzy. While saying I wanted to create a world where both Kivotos students and humans coexist, I never met the locals personally even once to hear their stories. ...Even so, the General Student Council President, the savior of the world. It's funny, right?\"\n\nAru grabbed Ayaka's hand.\n\n\"I don't know what kind of scars you have or what kind of past you've been through. But I'm sorry for not visiting you first even once. I'm sorry for not trying to hear your stories even once. ...I'm sorry for not knowing there was a person named Damian Kratzenberg, Sensei.\"\n\nI'm sorry. With that apology, Ayaka bowed her head and sobbed again.\n\n\"That word. ...I just, wanted to hear that one word.\""
 HEU_event.267.a:0 "She wept for a long time, holding Aru's hand tightly."

 HEU_event.268.t:0 "Starting Point of Universal Miracle"
 HEU_event.268.desc:0 "\"Probably this apology won't be delivered to the real Damian. But... I feel a bit liberated.\"\n\"Then I'm glad. Damian-sensei.\"\n\nWhile Ayaka walked along the opposite side of the hallway, Arona inside the monitor reached out her hand toward Ayaka.\n\n\"Damian-sensei might not have been a true Sensei of Kivotos. No adult's card, strange ideology, not perfect... still. Damian-sensei was... my true Sensei.\"\n\nMeanwhile, Aru checked the fallen Handyman employees one by one. Haruka, who woke up first, was flailing on the floor looking for her shotgun.\n\n\"I... if I shoot one shot now as a surprise... I can subdue her...\"\n\"It's done. I'm glad all three have minor injuries. Let's go back.\"\n\"Go back? But Aru-sama...\"\n\"I have no right to kill that Sensei.\"\n\nAru caught Mutsuki and Kayoko one by one and helped them up.\n\n\"...That Sensei was surely as good as dead already on the day of the Great War.\""
 HEU_event.268.a:0 "Probably so."

 HEU_event.269.t:0 "The Story from Now On"
 HEU_event.269.desc:0 "Aru's apology couldn't reach the real Damian Kratzenberg. An opponent of the 68 Revolution. Aru will never know in her life what kind of person the real Damian was and what kind of life he lived. Returning to the office, Aru approached the urn of Grand Duchess Charlotte, which still remained in a corner of the Grand Ducal palace.\n\n\"The position of 'Regent of the Grand Duchy' must have been just an escapism for me right now. I'm changing the world for the Luxembourgers. The Luxembourgish people will eventually understand and forgive my decisions. That kind of escapism. But I guess it wasn't. The 68 Revolution is clearly changing the world... but there were people being discarded in that changing world.\"\n\nAru bowed her head toward the urn.\n\n\"...I can't undo what has already happened. I know you won't forgive me in heaven. Still, now it might be better to try talking even a little with the locals. There's no person who's always right in the world. I never tried to look into the hearts of the Luxembourgers to see what they want to become.\"\n\nLeaving the bedroom, she saw the three people with bandages on their faces waiting for her. Mutsuki asked.\n\n\"Are you done talking with the Grand Duke?\"\n\"Yeah.\"\n\"Our Aru-chan is too soft-hearted, that's the problem. She hasn't changed even after becoming the General Student Council President.\"\n\"Fufu. I might be disqualified as a hardboiled outlaw.\"\n\nAru walked the path back to the office with the three employees. What has already happened cannot be changed. But the future that hasn't been determined yet will be able to change. The flame of the 68 Revolution will still burn fiercely in the General Student Council, but at least Aru learned one fact.\n\nWhy she became the regent of Luxembourg. She must not forget that fact."
 HEU_event.269.a:0 "After all, 'a revolution in which I cannot dance' is not a revolution."

 HEU_event.270.t:0 "And the Place Where All Miracles Begin - Phase 1"
 HEU_event.270.desc:0 "Damian Kratzenberg stood in the hallway holding a pistol, looking into the Shittim Chest with one hand. We lost. Contrary to Arona's prediction, Arona's help was not needed to stop the invasion of [GEI.GetName]. Because that outlaw, with only the strength of herself and her Handyman 68 colleagues, protected Kivotos and the Earth from a great evil. Therefore, this meeting was just... a meeting to admit defeat. Damian laughed as if saying he was sorry.\n\n\"Arona. Sorry for being a useless Sensei.\"\n\"No. Damian-sensei. I... just, I was incompetent.\"\n\nArona sat on the chair inside the monitor.\n\n\"As an AI... I believed that we could only reach a happy ending by following a *determined* route according to the algorithm. The predestined conclusion of meeting the Sensei of Kivotos, having them overcome all the General Student Council President's mistakes, and eventually achieving a beautiful victory that brings a miracle. Because I couldn't even imagine there would be another way... so, in a world where the real Kivotos Sensei doesn't exist, I thought that if *I* didn't lead Schale, humanity would surely perish... that's all I thought...\"\n\"Yeah. It's okay. A student can always fail. Because they can build experience through that failure and grow to become the adult they want to be. But... Arona. A Sensei is different. A re-challenge opportunity isn't easily given to an adult who has failed.\"\n\nSaying so, Damian fixed the Shittim Chest to his waist. Step, step. Along the Berg Palace hallway, the four Handyman 68 members were seen approaching. Yeah. Arona's purpose was to protect Kivotos. In the end, the process was different from Arona's prediction, but wasn't Kivotos eventually saved? But Damian Kratzenberg's goal hadn't been achieved yet.\n\nHe took out the wedding ring left by the deceased Damian's wife and put it on his finger. As if he could receive the strength of the deceased wife with that."
 HEU_event.270.a:0 "\"I've been waiting. Rikuhachima Aru.\""

 HEU_event.271.t:0 "And the Place Where All Miracles Begin - Phase 2"
 HEU_event.271.desc:0 "\"You're Nanami Ayaka...'s spokesperson? But you're a man?\"\n\"I am Nanami Ayaka. The appearance as a woman was... sorry. It was a fake on the internet. Are you disappointed?\"\n\"Huh? Wait. Then the voice? It was completely a girl's voice?!\"\n\"I heard they deep-learned and copied your voice. Wasn't it a voice that strangely resembled yours?\"\n\nAfter a short banter, Mutsuki burst into laughter. \"So the popular VTuber Nanami Ayaka is a man?! Ahahahat! Truly epic! Aru-chan was completely fooled!\"\n\"...My voice! I'll surely get the voice acting recording fee!\"\n\"My apologies. But since I couldn't create a voice from zero.\"\n\nDamian spoke sarcastically and slowly walked forward. He spun the pistol in his hand around and then aimed it at Aru. At that moment, the smile on Mutsuki's face disappeared.\n\n\"I, you see, lost many things due to the Great War. My family was murdered, and I couldn't do anything while my students were hiding and crying. Blood, and blood, blood! That blood comes out in my dreams every day... so I couldn't fall asleep without drinking. Rikuhachima Aru. Those who died during the Great War, how much did Grand Duchess Charlotte hurt? How were her family members? What kind of feelings did the citizens of Luxembourg have, who died just because they were there on that day? ...You said you came to help Luxembourg. When you accepted the regency, even when you lifted the damn martial law, you shouted that you would work for the Luxembourgers. But why! Even you, whom we trusted, shot at us just like the Gehenna bastards, and blew up the cathedral with a bomb!!!\"\n\nWhat? Hearing those words, the Berg Palace hallway looked like the Luxembourg Grand Ducal palace hallway. As that place of death where corpses hit by Gehenna rioters' bullets were strewn everywhere.\n\n\"I... for everyone... no, the ones who attacked me were... the Luxembourgers...\"\n\nThe corpse of the Grand Duchess who died with her eyes open. The memory of the time she closed the eyes of the corpse holding a child. How was Aru, who aimed her gun at the Gehenna rioters and the Right Party headquarters that day, different?\n\nMutsuki pulled Aru back. \"Aru-chan! Get back!\""
 HEU_event.271.a:0 "At that moment, Damian fired a pistol shot."
 
 HEU_event.272.t:0 "And the Place Where All Miracles Begin - Phase 3"
 HEU_event.272.desc:0 "\"Sensei! Now that we've lost almost all power, I can only protect Sensei with calculations for a few dozen seconds! ...How can you beat Kivotos students with a human body!\"\n\nIgnoring Arona's voice that was close to a scream, Damian moved forward. Thanks to the miracle of causality caused by Arona, the bullets from Mutsuki, Haruka, and Kayoko veered off their trajectories and smashed the walls and ceiling. Gritting his teeth, Damian fired at the three girls blocking Aru.\n\nAnd well. He was subdued in 30 seconds and fell on the floor. A deep sigh from Arona erupted inside the Shittim Chest. It's a sorry thing for the student, but the dream of firing a gun coolly even once at those grinning Handyman friends was achieved. Wouldn't that be enough? While Haruka bound and forced Damian to kneel, Aru who was hiding behind came forward and kicked the pistol away.\n\n\"Let's talk calmly. Damian-sensei... was it? I know you hate me. So... I want to hear your story.\""
 HEU_event.272.a:0 "Aru signaled Haruka, who was pressing Damian down, to take her hand off."

 HEU_event.273.t:0 "And the Place Where All Miracles Begin - Phase 4"
 HEU_event.273.desc:0 "\"I didn't know Miss Rikuhachima was such a polite person. You were taking the General Student Council President position by force.\"\n\nIgnoring Arona's sarcastic sound, Aru sat on the sofa in an empty reception room of the Berg Palace. She let the three wait in the hallway for now. The only people left in the reception room were Arona, Damian, and Aru sitting opposite. Damian Kratzenberg. She had never heard his name. But she could already predict why he had come here.\n\n\"You were very dissatisfied with the 68 Revolution, weren't you? Since I roughly heard the things you said in internet streaming so far. ...Although I didn't know 'why' you hated it until now.\"\n\"Now you've learned that too. Yeah. I'm one of the many Great War victims of Luxembourg. That's why I trusted you when you were appointed as regent. Because I thought you and the other Kivotos students... would be different. But let's ask seriously here. You saved Luxembourg from Gehenna. But why did you start a revolution by taking up guns and toppling the government in the same way, and in the same way...\"\n\nDamian tried to continue, but his mouth didn't seem to open. He sat for a long time with his mouth agape and said.\n\n\"Your revolution might have changed Luxembourg in a better direction. Maybe I'm the one who's wrong. But it's something that started at the wrong time and in the wrong way. You hit the people who were already hurt and injured again and tried to enlighten them. Was that wrong?\""
 HEU_event.273.a:0 "Aru quietly waited for his story to end"

 HEU_event.274.t:0 "And the Place Where All Miracles Begin - Phase 5"
 HEU_event.274.desc:0 "\"He probably won't be a person who listens to reason anyway. If he were, he wouldn't have started that strange revolution or whatever it is.\"\n\nAs soon as Arona's words ended, Aru let out a sigh.\n\n\"I also tried to work hard. But. You guys also bullied me, made Handyman employees suffer, and tried to kick us out of the Luxembourg land. ...Of course I know that reason was because of the trauma from the Great War. I can understand now... but at least then I thought I couldn't endure it any longer.\"\n\nIf it were only Aru's own suffering, she might have let it go. But for Aru, what was even more unbearable was not her own wounds, but the fact that the people around her were being hurt. It's the same. The locals also had wounds just like Aru. Ordinary people who hate seeing the people around them hurt and who fear the displaced Kivotos people.\n\nUntil now, hadn't Aru just thought of them as monsters who hated Kivotos for no reason? Shouldn't she have ensured that the PTSD they had could be healed?\n\nOf course, the things they did to Handyman wouldn't change. I don't know. At least to this Sensei in front of her, she wanted to say an apology.\n\n\"I'm sorry.\"\n\nDamian exhaled a deep sigh for a short moment and then nodded.\n\n\"...That one word. ...I've been waiting for these few years to hear that one word directly.\""
 HEU_event.274.a:0 "\"Let's forgive each other. Just... it's just that we didn't have the chance to understand each other.\""

 HEU_event.275.t:0 "Starting Point of Universal Miracle"
 HEU_event.275.desc:0 "\"When I first met that woman, I wanted to give her a punch in the face. I couldn't do that, but now I think I can forgive Rikuhachima Aru. That woman was also just an ordinary person who was hurt just like me.\"\n\"Then I'm glad. Damian-sensei.\"\n\nArona reached out her hand toward Damian beyond the monitor.\n\n\"Damian-sensei might not have been a true Sensei of Kivotos. No adult's card, strange ideology, not perfect... still. Damian-sensei was... my true Sensei.\"\n\"Yeah. For me too, you were my precious last student.\"\n\n\"It would be fun if I just went bang from behind at times like this.\"\n\nMuttering from the hallway a few dozen meters away, Aru lightly struck Mutsuki's side with her palm and turned around, leaving the two.\n\n\"Don't talk nonsense and let's go back. ...We did everything we had to do here.\"\n\"Are you really okay with this? You caught that anti-establishment activist Nanami Ayaka?\"\n\"I have no right to kill that Sensei.\"\n\nAru spoke with her arms crossed.\n\n\"The reason we stayed in Luxembourg was originally to protect people like that.\""
 HEU_event.275.a:0 "Probably so."

 HEU_event.276.t:0 "The Story from Now On"
 HEU_event.276.desc:0 "Returning to the office, Aru approached the urn of Grand Duchess Charlotte, which still remained in a corner of the Grand Ducal palace.\n\n\"The position of 'Regent of the Grand Duchy' must have been just an escapism for me right now. I'm changing the world for the Luxembourgers. The Luxembourgish people will eventually understand and forgive my decisions. That kind of escapism. But I guess it wasn't. The 68 Revolution is clearly changing the world... but there were people being discarded in that changing world.\"\n\nAru bowed her head toward the urn.\n\n\"...I can't undo what has already happened. I know you won't forgive me in heaven. Still, now it might be better to try talking even a little with the locals. There's no person who's always right in the world. I never tried to look into the hearts of the Luxembourgers to see what they want to become.\"\n\nLeaving the bedroom, she saw the other three from Handyman waiting for her. Mutsuki asked.\n\n\"Are you done talking with the Grand Duke?\"\n\"Yeah.\"\n\"Our Aru-chan is too soft-hearted, that's the problem. She hasn't changed even after becoming the General Student Council President.\"\n\"Fufu. I might be disqualified as a hardboiled outlaw.\"\n\nAru walked the path back to the office with the three employees. What has already happened cannot be changed. But the future that hasn't been determined yet will be able to change. The flame of the 68 Revolution will still burn fiercely in the General Student Council, but at least Aru learned one fact.\n\nWhy she became the regent of Luxembourg. She must not forget that fact."
 HEU_event.276.a:0 "After all, 'a revolution in which I cannot dance' is not a revolution."

 HEU_event.277.t:0 "Berg Memorial Park"
 HEU_event.277.desc:0 "Due to budget constraints and various practical problems, its scale was very small, but a small memorial park was built on the site of the Berg Palace where the Nassau Grand Ducal family of Luxembourg used to reside. The memorial park was built as a reflection on the past that the Rikuhachima government 'did not pay too much attention to healing the wounds of the victims of the Great War,' and a large monument engraved with the names of the victims whose records remain from the time of the Great War was installed in the garden.\n\nOn the day the memorial park was established, Luxembourg Communist Party politician Charles Marx gave a speech celebrating the construction of the memorial park. Marx said that this park should be a place where the tragedy that occurred during the Great War is eternally remembered. Media outlets including the Kronos School Newspaper, both local and Kivotos, participated in this opening ceremony and put Marx's speech in the newspapers."
 HEU_event.277.a:0 "It's too late, but..."

 HEU_event.278.t:0 "Damian Kratzenberg"
 HEU_event.278.desc:0 "A Greek instructor of Luxembourg, Arona's Sensei rests here.\n\nA small tombstone near the abandoned Schale building. Before it, a girl in a blue dress knelt and laid a bouquet of flowers. Damian Kratzenberg died? Flustered, Aru looked back and forth between the tombstone and the girl next to it. The girl turned around as if noticing Aru's trick. It was Arona. She didn't know how Arona, who was just an AI, could come out of the Shittim Chest. Is this also a 'miracle' like that day she met Damian?\n\n\"Damian-sensei had been fighting liver cancer for a long time. ...He lost his family during the Great War and spent a very long time drinking excessively.\"\n\nArona smiled bitterly.\n\n\"I tried to save Sensei even in a robot-like form... but Sensei said that extending his life to that extent was meaningless. He told me to 'graduate' from him now and become the adult I want to be.\"\n\"I... didn't know Damian-san had passed away. I wanted to meet him again.\"\n\"You met him once. The apology you heard then. Damian-sensei was sufficiently comforted with just that.\"\n\nArona hesitated and then said.\n\n\"Damian-sensei told me this. ...To become the adult I want to be. I... was just focused on kicking Aru-san out, so I never had a chance to think about what kind of adult I want to be. So. Even if it's just for a moment, could you let me watch over Aru-san's General Student Council? I want to find out what kind of adult I want to be by your side, Aru-san.\"\n\nShe wanted to shout 'We were enemies!', but her conscience didn't allow Aru to say harsh words to Arona next to Damian's grave. Well, anyway, being enemies was a thing of the past. Aru let out a sigh."
 HEU_event.278.a:0 "\"Where is the Shittim Chest? I'll take it for you.\""

 HEU_event.279.t:0 "Damian Kratzenberg"
 HEU_event.279.desc:0 "A Greek instructor of Luxembourg, Arona's Sensei rests here.\n\nA small tombstone near the abandoned Schale building. Nanami Ayaka knelt before that tombstone and laid a bouquet of flowers. This is the place where the real Damian Kratzenberg rests. Aru offered the flowers she had prepared beforehand next to the bouquet Ayaka had laid.\n\n\"Even though I'm an AI who inherited Damian's memories... I don't know how that person could be such a passionate virtual streamer. ...After all, even if I have the same memories, I am not the real Damian Kratzenberg. Completely understanding someone else was impossible even if memories were shared.\"\n\"I understand. Even though I'm the same person, there are times when I don't understand myself. Like coming to offer flowers at the grave of a virtual streamer who bullied me.\"\n\"Well, I guess that means you're just that absent-mindedly kind.\"\n\"...You mean that as a thank you?\"\n\nAyaka smiled faintly.\n\n\"Separately, do you have any intention of hiring me at your General Student Council for the time being?\"\n\"Hiring you at the General Student Council?\"\n\"Something the other Damian Kratzenberg couldn't do. ...I want to watch by your side whether you really continue to work for the Great War victims. and my identity has disappeared, so if you don't make a status for me, I'll become an illegal resident and can't even work as a Greek instructor. What will you do?\""
 HEU_event.279.a:0 "\"Sure. ...Let's work together.\""

 HEU_event.280.t:0 "Confession"
 HEU_event.280.desc:0 "\"...It's not a lie, it's not a joke. Rikuhachima Aru. You are the only one I love. This is my confession with all my heart.\"\n\nHina, holding out a case with a sparkling wedding ring and unable to hide her red-flushed cheeks, barely managed to continue. A confession? To her, of all people, the Prefect Team Leader? Aru asked while feeling a slight dizziness.\n\n\"...Why me?\"\n\"Because you saved me. ...Because you became the hope for me to live on.\"\n\nTears formed in her eyes as she looked at Aru.\n\n\"When Gehenna collapsed once and I thought all my efforts were meaningless. You reached out your hand to me. You told me my efforts weren't in vain. You let me know that even if I struggle endlessly in this vain world, there's meaning in that effort. You are... my light. The hope that allows me to live. So... let me be with you...\"\n\n\"Ahaha. Even for a hardboiled person like me... I don't know how to respond to this situation.\""
 HEU_event.280.a:0 "Aru smiled for a moment and then accepted her ring."

 HEU_event.281.t:0 "Netherlands Administrator"
 HEU_event.281.desc:0 "- The General Student Council analyzed that the residents of the former Netherlands region still do not recognize the General Student Council's right of governance, and this was caused by the tragic bloodshed of some students including SRT immediately after the Great War. Since Shiranui, the former Defense Office Chief, was involved in settling the outrages of SRT as a member of the General Student Council since immediately after the Great War, she is recognized as being well aware of the flow of the local people's public sentiment...\n\nThe dispatch order written by Onikata Kayoko and signed by Aru. Shiranui Kaya smiled broadly and reread the order several times.\n\nThe introduction was long, but the conclusion was simple. Appoint Shiranui Kaya, the former Defense Office Chief, as the administrator in charge of the former Netherlands region.\n\nIt seemed that calling Aru 'General Student Council President' in official settings, unlike some other chiefs who ran wild saying 'I won't recognize someone like Aru as the General Student Council President,' had been a big help.\n\n\"For a superhuman, political power to read the flow of the political situation and stick to the winning side is a necessary thing.\"\n\nImagining placing the 'Netherlands Administrator Shiranui Kaya' nameplate on her desk, Kaya wore a happy smile."
 HEU_event.281.a:0 "Power is always right."

 HEU_event.282.t:0 "Insult"
 HEU_event.282.desc:0 "Feelings toward Aru-chan? A precious childhood friend, a partner of Handyman 68, ahahat. If I add to that, a blunderer who's fun to tease? Since the Great War broke out, a fool who stays in this small land where she has no fault and struggles like an idiot to protect unrelated people.\n\nAru-chan would probably say this, right? No matter how much of an outlaw who isn't tied down by rules, I don't abandon precious people. Yeah. Because that's Aru-chan. Because the person who 'doesn't give up on precious things and carries them out to the end' is Rikuhachima Aru.\n\nI really like, hate, like, hate, hate that kind side of Aru-chan. I hate it.\n\n\"I, that... well...\"\n\"Your Highness the Regent. Your expression looks very dark, do you have anything more to say?\"\n\"Ahaha!\"\n\"Hahahaha!\"\n\nSitting in the room, she watched the recorded broadcast of the discussion program on television several times. Aru trembling her voice in an unfamiliar discussion, the audience bursting into laughter while watching her as if watching a monkey in a zoo. My Aru-chan was standing in that place to protect *those* things, and was trying to smile while receiving all those insults. As if trying to pass off even the mockery toward herself as a joke.\n\n- Director Mutsuki\n- You haven't come to the office for several days already, so Aru-sama is worried\n- Has something happened?\n- Someone like me wouldn't dare to offer a consultation, but...\n\nAfter roughly glancing through Haruka's MomoTalk, Mutsuki quietly stroked her machine gun. Aru-chan won't give up. Because she's a girl who *absolutely* cannot give up on the people she tries to protect. So."
 HEU_event.282.a:0 "\"I have to make her give up.\""

 HEU_event.283.t:0 "Rejection of the Civil Rights Act"
 HEU_event.283.desc:0 "The attempt to legally pass the Civil Rights Act failed. Far from leading public opinion, the public discussion only made Aru look ridiculous. In the newspapers, cartoons were published mocking Aru's nervous appearance of stuttering her words.\n\n\"Uuuuugh... If only I were a better leader...\"\n\nFeeling the phantom pain of her enucleated right eye due to extreme stress, Aru wrote down new plans on the paper—she wanted to persuade the locals somehow and protect the rights of Kivotos people through legal procedures. If she used force, she could easily obtain rights... but that meant she would eventually become the *same* existence as the Gehenna rioters on the day of the Great War.\n\n\"If I personally visit the offices of politicians... and somehow grab each one and bow and beg...\"\n\nThat was an action completely far from the 'hardboiled' she hoped for. It was also something that would shatter her own dignity. But it's also true that there's no other way than this at this point, isn't there?\n\nAfter all, it's a thing that happened because I was lacking.\n\nNot anyone else, I must take the responsibility."
 HEU_event.283.a:0 "Not yet... I don't want to let go of hope..."
 
 HEU_event.2000.t:0 "Fall of the Grand Duchy of Luxembourg"
 HEU_event.2000.desc:0 "The Grand Duchy of Luxembourg, which boasted almost a thousand years of history since the period of the County of Luxembourg in 963, eventually came to fall before the flow of the times. The military of [ROOT.GetName] will conduct military government over Luxembourg for the time being, and the citizens of Luxembourg will have to understand that their nation no longer exists. But not all problems are over. It's because the treatment of 'Her Highness Rikuhachima' of the Grand Duchy of Luxembourg, who prevented the massacre by Gehenna at the time of the Great War and protected Luxembourg, must be decided.\n\n\"......I don't want to make excuses with words like even defeat is hardboiled. Eventually, I couldn't repay the people who trusted me.......\"\n\nRikuhachima Aru, staying at the Grand Ducal palace, accepted the military government of the [ROOT.GetName] army in a quite discouraged state and decided to accept the treatment decision of [ROOT.GetLeader] without resisting. However, we cannot treat Rikuhachima Aru like other Kivotos invaders at will. Unlike other Kivotos invaders, she is a citizen hero who prevented the massacre of Luxembourg City amidst the chaos of the Great War, and she is treated as a legitimate aristocrat in human high society after being appointed as regent of the Grand Ducal family by Prime Minister Joseph Bech.\n\nWe must handle Rikuhachima Aru's treatment according to diplomatic custom."
 HEU_event.2000.a:0 "If she gives up political power, her Handyman can stay in Luxembourg"
 HEU_event.2000.b:0 "Create a Luxembourgish Small Court so she can maintain her title"
 HEU_event.2000.c:0 "Banish her from Luxembourg"

 HEU_event.2001.t:0 "Fall of the Grand Duchy of Luxembourg"
 HEU_event.2001.desc:0 "As the nation of Handyman 68, which the locals used to call the 'Grand Duchy of Luxembourg,' has fallen, we have acquired control over all of Luxembourg. With this, the local nation of Luxembourg has vanished, and discussions about Handyman 68 including Rikuhachima Aru have begun. To the locals, the title of Luxembourgish aristocrat would have been accepted as very noble, but it was not a very important value to [ROOT.GetName], a Kivotos-affiliated nation.\n\nAfter a short discussion, the Grand Duchy including the Grand Ducal title was dissolved, and it was decided to strip Rikuhachima Aru and her colleagues of their power and have them live as ordinary Kivotos people. Aru will now have to leave the Grand Ducal palace and look for a place to start new Handyman work."
 HEU_event.2001.a:0 "Her idealistic experiment is also over."

 HEU_event.2002.t:0 "Hardboiled Outlaw"
 HEU_event.2002.desc:0 "\"Aru-chan, can you listen to my last request?\"\n\nShe wanted to create a community where Kivotos people and locals live equally. and she just wanted to protect that community so it wouldn't collapse. Luxembourg was not just a place for Aru. It was her conviction against National Socialism and all totalitarianism. So, she didn't want to let Luxembourg be under the rule of so-called 'Knightly State' fascists.\n\nUntil now, Aru has lived while running away countless times. If the Prefect Team followed, she moved the office to another place, if the rent ran out, she moved the office, if it seemed she couldn't win, she ran away, and if the request was difficult, she took to her heels.\n\nBut now, she couldn't do that. When she saw the people being massacred by Gehenna rioters on the day of the Great War. When she felt the weight of 'death' for the first time in her life. When she found something that was the Grand Duchess and her family mangled by submachine guns inside the Grand Ducal palace. Aru gave up the life of running away. because she decided to devote her remaining life to the impossibility of proving paradise.\n\n\"I can't see ahead...... so I don't know if Aru-chan is next to me...... that's scary...... just, tell me...... that you're staying by my side......\"\n\"I'm next to you! I am, so...... don't leave before me...... sorry for being a stupid President...... even though I shouted about hardboiled and outlaws, I couldn't protect you guys......\"\n\nSo. Aru had never feared death here.\n\nBut, when her friends, Haruka, and then Kayoko died one by one to earn time for the refugees to flee, and when Mutsuki who hit by field artillery was brought back by gendarmes with blinded eyes and both legs severed.\n\nPain greater than Aru's own death, an eternal sorrow that felt like it would tear her heart out heavily pressed her down. Even if she was prepared for her own death, she couldn't be prepared for the deaths of her friends.\n\n\"I, Aru-chan...... even if you're not hardboiled...... it doesn't matter...... whether you're a blunderer or not, I liked all those Aru-chans.\"\n\nAru climbed up onto the heap of hundreds of bombs holding Mutsuki. Every step she climbed the mountain of bombs, the memories of when she first established Handyman 68, the memories of laughing and chatting with Mutsuki, and the memories of having solved numerous requests together with her friends floated and vanished fleetingly.\n\n\"Rikuhachima Aru, the leader of Handyman 68, drop your weapons and surrender!\"\n\nThe moment Trinity soldiers rushed into the ammunition depot, Aru looked down at the fascist trash and pressed the detonator for Mutsuki, who was no longer breathing."
 HEU_event.2002.a:0 "\"Fuck you.\""

 HEU_event.2003.t:0 "Fall of the Grand Duchy of Luxembourg"
 HEU_event.2003.desc:0 "The Grand Duchy of Luxembourg, which boasted almost a thousand years of history since the period of the County of Luxembourg in 963, eventually came to fall before the flow of the times. The military of [ROOT.GetName] will conduct military government over Luxembourg for the time being, and the citizens of Luxembourg will have to understand that their nation no longer exists. But not all problems are over. It's because the treatment of 'Her Highness Rikuhachima' of the Grand Duchy of Luxembourg, who prevented the massacre by Gehenna at the time of the Great War and protected Luxembourg, must be decided.\n\nDespite the complex diplomatic relationship between Trinity and Gehenna, it is a variable that Rikuhachima Aru herself, the citizens of Luxembourg, and the Luxembourgish Parliament all do not think of Aru as Gehenna. Even if Aru were just released, there is no possibility that she will become a resistance for Gehenna.\n\nThe simplest way is to banish her to another human nation via a neutral country. Since among human nations Rikuhachima Aru is recognized as an aristocratic family, she will be able to receive appropriate treatment in her place of exile. Another alternative is for her to just stay in Luxembourg, but have her return all political authority to the [ROOT.GetNameDef] side and stay in a symbolic role."
 HEU_event.2003.a:0 "Tell her to go where she wants to go."
 HEU_event.2003.b:0 "Or live in Luxembourg."

 HEU_event.2004.t:0 "After the Occupation"
 HEU_event.2004.desc:0 "The Luxembourg Grand Ducal palace was once looted and terrorized by Gehenna rioters in 1935 during the Great War, but Trinity preserved the Grand Ducal palace as it was without looting according to Mika's instructions. Mika, who entered the Grand Ducal palace, finds the traces of bullet holes that still remain despite Aru's servants' efforts to erase them.\n\n\"Heh, compared to the Tea Party building, there's nothing to see.\"\n\nMika walked the hallway spinning her hands around and then entered Aru's office which was open. It's a frugal office with a comical 'One Evil a Day' calligraphy hanging on the wall and only a few books plugged into the bookshelf. Did she flee beforehand taking luxury goods? No, even a place where she would have put luxury goods was not seen. Mika sat in Aru's seat and looked through the remaining documents.\n\nThe massacre in Luxembourg City caused by Gehenna-affiliated people immediately after the Great War, the psychological worries Aru has suffered since suppressing that incident—guilt, despair, pain—were revealed through many documents and meeting records. That woman who looked absent-minded had such an inner self... Mika had not thought so.\n\nMika let out a short sigh while putting down the meeting record which would be the umpteenth. Although the reason was unknown, she felt that permitting Rikuhachima Aru to live and flee was not a bad choice."
 HEU_event.2004.a:0 "That girl doesn't need any more bad endings."
 
 HEU_event.2005.t:0 "Post-Governance Processing"
 HEU_event.2005.desc:0 "After the General Student Council withdrew from the Low Countries, Handyman 68 occupied the Low Countries. Fortunately, the locals of the Low Countries didn't seem to try to resist very proactively. Except for the slightly slumped eyes and the powerless-looking appearance, everyone seemed fine.\n\nLeon Kaufmann was dispatched to investigate and utilize the foundation of the Low Countries and was walking along the docks of Amsterdam. Of course, a monstrously heavy D.U. is placed on Amsterdam. Kaufmann checked items on the documents while biting a pen. Is the foundation incomplete, check. Are there flooded facilities, check.. Are there not enough water pumps deployed, check... Kaufmann wrote documents while busily moving his pen here and there.\n\n\"Huh, those guys in the General Student Council, they did a wonderful job with the handover.\" Kaufmann grumbled to himself while checking the documents. It was absolutely terrible. The Low Countries had been neglected for years already and were right on the verge of completely collapsing. The General Student Council that worked hard while running on such a ground even seemed great in its own way.\n\nBut commenting on the incompetence of the General Student Council was not his job. Kaufmann signed with a coolly scribbled `L. Kaufmann` and passed it to a new employee of Handyman who came to find him."
 HEU_event.2005.a:0 "\"Man, I can't even imagine how it was a few years ago.\""
 HEU_beneluxfixed_tt:0 "§gAnyway, we'll fix it. Kaufmann, who lightly spat out a word, slowly walked the docks and talked with the workers of the harbor. They ask who Rikuhachima is. Well, there's no need to let them know.§!"

 HEU_event.2006.t:0 "Fall of the Grand Duchy of Luxembourg"
 HEU_event.2006.desc:0 "To [ROOT.GetName], Luxembourg is a complex nation. Since the Gehenna-affiliated people have seized power, they are very close and familiar to us, but at the same time, there is also hostility due to the massacre incident by Gehenna-affiliated people. We conducted a very in-depth discussion on Rikuhachima Aru's treatment after the occupation of Luxembourg. Rikuhachima has participated in League of Nations meetings and is highly popular among the locals to the point of being accepted as 'humanity' rather than Gehenna-affiliated, and the support of Luxembourgish citizens for her is also solid. If we make her a collaborator of the [ROOT.GetNameDef] side in occupied Luxembourg, we will be able to gain greater influence in the international community.\n\nHowever, due to her strong anti-Nazi tendency, National Socialists claim that she must be eliminated. Whichever choice we make, Luxembourg is already no longer our enemy."
 HEU_event.2006.a:0 "Offer Aru a [ROOT.GetAdjective] military rank"
 HEU_event.2006.b:0 "We must hang her! Send an arrest squad!"

 HEU_event.2007.t:0 "A Single Letter"
 HEU_event.2007.desc:0 "Handyman 68 had no emotion that Gehenna was an organization they 'belonged to.' The academy that abused Haruka. Even if viewed favorably, an academy with many horned students like Aru. A level of academy with a maximum of neutrality and a minimum of contempt. Such hostile emotion intensified as Gehenna students committed arson, looting, and murder in Luxembourg City after the Great War. As soon as Luxembourg City was occupied and military government was implemented, Aru fled leaving a short letter saying 'I have nothing to do for [ROOT.GetLeader], the friend of the fascist Wehrmacht' while having one of her supporters disguise as her and sit there.\n\nWhen we entered the Luxembourg Grand Ducal palace to deliver [ROOT.GetLeader]'s decision, there was only one Gehenna-affiliated girl sitting arrogantly wearing a clumsy red hair wig, flipping the bird at our officers. She seems to have already fled to a human nation taking advantage of being a Luxembourgish aristocrat recognized by the League of Nations, and we had no choice but to announce a statement of condemnation toward Rikuhachima Aru and three friends who exiled with her."
 HEU_event.2007.a:0 "What a skill for fleeing...!"

 HEU.flavor_event.1.t:0 "March of the Right Party Supporters"
 HEU.flavor_event.1.desc:0 "\"Abolish the 1919 reform of universal suffrage and women's suffrage!\"\n\"Expel the demons of Gehenna from Luxembourg!\"\n\nNot much time has passed since the Great War, and in Luxembourg, the conflict between supporters of the Right Party—a traditionally reactionary and anti-democratic party—and Gehenna immigrants continues. In particular, farmers, who are traditional supporters of the Right Party, participated in large numbers in today's 'Luxembourg March Protest' by members of the Right Party. Farmers claim that the appearance of the demons of Gehenna in Luxembourg was a divine punishment for the 'mistake' of 1919 that guaranteed women's suffrage and universal suffrage.\n\nThe Right Party, which is in the coalition government, emphasizes that this protest is a 'voluntary' gathering of supporters. It means they had no involvement in the protest and have no right to stop a voluntary gathering of party members.\n\n\"...Shall I just chase them away, Aru-sama?\"\n\nNo matter what the Right Party mutters, the public protest saying 'Aru, get out of Luxembourg' seems to be making Haruka... quite... anxious. Looking at her fiddling with her shotgun while looking out the window... a bit of madness can be felt.\n\nSo what do we do? Aru toward Haruka whose hands were trembling..."
 HEU.flavor_event.1.a:0 "\"Do whatever you want, but just don't kill them.\""
 HEU.flavor_event.1.b:0 "\"Tell them to shout until they're tired. They'll go back when it gets dark and cold.\""

 HEU.flavor_event.2.t:0 "Catholic Special Mass"
 HEU.flavor_event.2.desc:0 "\"Dear brethren. As our Lord God said in 1 Timothy 2:11-12, a woman should be in subjection to a man, and should be quiet and not give instructions to a man, for this is the natural order due to the sin of Eve tempting Adam to eat the forbidden fruit....\"\n\"The Rikuhachima regime is anti-biblical from its very existence. In this civilized age, how can there be a country where a woman commands a man? Since even the previous Grand Duchess of Luxembourg reigned but did not rule...\"\n\nHostile masses by Catholic priests in Luxembourg toward Gehenna immigrants after the Great War are making the conflict between Kivotos people and locals increasingly large.\n\n\"Can't we just blow up every cathedral in this town with dynamite?\"\n\"Let's gather all the priests and nuns and tie them to a rocket and launch them. Send them to space to meet the god they like so much?\"\n\nThe request contents of Gehenna students entering Handyman are also becoming radicalized to the point they're hard to ignore. Measures are needed to prevent the clash between the church and Kivotos people.\n\n\"Politics is really hard. It's on a different level from just managing the Handyman company....\" Sitting at the office desk and spinning a pen, Aru lets out a deep sigh."
 HEU.flavor_event.2.a:0 "\"Expel them all. Close down that strange cathedral too!\""
 HEU.flavor_event.2.b:0 "\"Haruka, there are some villains who need to be dealt with appropriately...\""

 HEU.flavor_event.3.t:0 "Backlash from Pro-Nazi Civic Groups"
 HEU.flavor_event.3.desc:0 "\"Rikuhachima Aru says she came to help Luxembourg, but she's actually ruining Luxembourg! Rikuhachima suppressed the Catholic faith and closed down cathedrals. Historically, the only ones who did this were the Communist Party!\"\n\nFascists belonging to some pro-Nazi civic groups in Luxembourg began to actively protest against the order to close down the cathedrals that led the riots. Some fascists held street protests while hoisting the swastika on the streets and shouting the phrase 'In Luxembourg for the Germanic people, Kivotos people are not needed.'"
 HEU.flavor_event.3.a:0 "\"They were the ones who attacked first... what did I do wrong?!\""
 HEU.flavor_event.3.b:0 "\"Maybe I was too harsh...\""

 HEU.flavor_event.4.t:0 "Backlash from Pro-Nazi Civic Groups"
 HEU.flavor_event.4.desc:0 "\"Rikuhachima Aru says she came to help Luxembourg, but she's actually ruining Luxembourg! Rikuhachima released political thugs to assault innocent priests and nuns, and Kivotos people insulted our religion. Historically, the only ones who did this were the Communist Party!\"\n\nFascists belonging to some pro-Nazi civic groups, which are part of the right-wing pro-Nazi party in Luxembourg, held street protests. The Luxembourg prosecution decided not to indict Haruka, but fascists angered by the news of non-indictment held street protests holding swastika flags."
 HEU.flavor_event.4.a:0 "\"They were the ones who attacked first... what did I do wrong?!\""
 HEU.flavor_event.4.b:0 "\"Should I have thought of another way? It might have been my mistake.\""

 HEU.flavor_event.5.t:0 "Not for Sale"
 HEU.flavor_event.5.desc:0 "Although some parties including the Luxembourg Communist Party claim 'harmony between Kivotos-affiliated people and Luxembourgers,' the anti-Kivotos movement of the right-wing camp is becoming radicalized. Some fascists who claim Deutschland nationalism, farmers in northern Luxembourg who did not suffer massacre damage at the time of the Great War, are leading a social movement to encourage Luxembourg restaurants, merchants, and other sellers not to sell products to Gehenna immigrants through the 'Gehenna Rejection Movement.'\n\nFortunately, Luxembourg City avoided massacre with the help of Rikuhachima Aru, and urban middle class and petty bourgeoisie centered on the liberal Radical Liberal Party are showing a strong will to support the Rikuhachima government. It's clear that the population supporting the cabinet is larger than the fascists.\n\nThe problem is that the voice of the minority is too loud, and Kivotos people are anxious due to that voice of the minority. The Kivotos population claims that Rikuhachima Aru's 'too soft' policies brought about such confrontation. In particular, Gehenna-affiliated people are furious that Aru is handling the 'problem that can be solved with bullets' too 'lazily.'"
 HEU.flavor_event.5.a:0 "\"...I'm also working hard...\""

 HEU.flavor_event.6.t:0 "Am I Doing Something Wrong?"
 HEU.flavor_event.6.desc:0 "\"...What do you mean all of a sudden, Aru-chan?\"\n\nNormally she would have made a playful joke or an encouraging remark. Perhaps because of Aru's tired and depressed-looking expression, Mutsuki spoke with a serious attitude.\n\n\"Is it because of the people in this area?\"\n\"I think everyone hates me. Even local residents shout to get out every day, and Gehenna people whisper that it's because I'm incompetent.\"\n\nAru put down the document she held. \"There's no such thing in Pandemonium or Prefect Team lands. ...As expected, is it because I'm lacking?\"\n\"Aru-chan hasn't pressed people down with the army like other Gehenna kids, right? Well, it was far from the hardboiled Aru-chan likes.\"\n\nMutsuki stood up and patted Aru's shoulder.\n\n\"Aru-chan didn't do anything wrong. Even if you're going the wrong way, don't forget that everyone in Handyman is by Aru-chan's side. Okay?\"\n\nAru looked up at Mutsuki's face which was smiling broadly. and they laughed together."
 HEU.flavor_event.6.a:0 "\"...Okay.\""

 HEU.flavor_event.7.t:0 "I Am the German Emperor"
 HEU.flavor_event.7.desc:0 "\"In this age where everyone persecutes me and ignores loyalty to me, to think there is still someone who doesn't forget me. It is truly a grateful thing.\"\n\nAs soon as the request to be a military advisor for Handyman was sent, Wilhelm von Prussia ran like lightning and blathered a noisy speech in front of Aru. That it was very hard living day by day after all his wealth flew away, so he's very grateful for calling him. That he will grant Aru an aristocratic title after the Deutschland mainland is recovered, that Junker (landlord) bastards only speak smoothly and no one came to help him at the time of the Great War, etc.\n\nAfter patiently listening to the old Emperor's rambling for about an hour, Aru could finally speak.\n\n\"Even if you've stepped down now, you were the Emperor of a great power before. I thought you would be good to have as a partner.\"\n\"A very good idea. Just as my old empire did, the soldiers of your Handyman will be reborn as the strongest army in Europe through my systematic training!\""
 HEU.flavor_event.7.a:0 "...Choosing this old man, was it the right choice?"

 HEU.flavor_event.8.t:0 "I Am the German Emperor, I Say..."
 HEU.flavor_event.8.desc:0 "\"Miss Aru. I cannot overlook this situation!\"\n\nWilhelm II, who was chosen as a military advisor for Handyman not long ago, entered the office with his fists trembling.\n\nWatching the Emperor's mustache tremble with anger, Mutsuki burst into laughter. \"Ahaha! This grandpa is really funny. His mustache wriggles like a snake?\"\n\n\"This is exactly the kind of attitude that is the problem!\"\n\nHe seems quite hurt. Aru stood up and greeted the Emperor.\n\"First, try explaining. Handyman 68 accepts any worry or request.\"\n\"Is explanation even needed? These Gehenna students don't care at all how high a position an *Emperor* is. They act as they please like some unbridled colts.... Was Gehenna originally a place with no order or hierarchy like this?\"\n\"Actually, I don't know much about Gehenna either....\"\n\nEven before the Great War, she had more days she didn't attend school than days she did. She didn't know much about how ill-mannered Gehenna students were either. But first, it seems necessary to soothe this pouting old man."
 HEU.flavor_event.8.a:0 "\"First, shall we talk while drinking coffee together? I'll listen to the upsetting things.\""
 HEU.flavor_event.8.b:0 "\"When you're angry, it's best to take a walk. Shall we talk while walking together?\""
 
 HEU.flavor_event.9.t:0 "His Majesty's Request"
 HEU.flavor_event.9.desc:0 "Let's see. This request is, Wilhelm II? Ah. It's a letter sent by the German Emperor.\n\nI'll read it. 'Taking Gehenna students and doing military training is driving me crazy. So I'm thinking of going out for some logging to relieve stress, and it would be great to have a talking companion.\n\nIf you have time, could you come with me, Miss Aru? I'd like you to accept this as one 'request' too.'"
 HEU.flavor_event.9.a:0 "\"Well, he's someone who spends time for us. It would be fine to go for a bit.\""

 HEU.flavor_event.10.t:0 "His Majesty's Loneliness"
 HEU.flavor_event.10.desc:0 "\"Hryaah! Argh!\" Northern Luxembourg forest. Aru swung her arms wide and struck a thick spruce trunk with an axe. Is it because the 'Mystery' is thin on Earth compared to Kivotos? The tree was well-gashed by Aru's axing. But her shoulder hurt quite a bit.\n\n\"Whew, whew, sorry. I can't do any more.\"\n\nWhile Aru lay on the ground next to the fallen tree, Emperor Wilhelm had already chopped several trees and made them into firewood.\n\n\"I can't tell if you people are strong or weak. Is this hard?\"\n\"It's hard!\"\n\"Hahaha!\"\n\nEmperor Wilhelm's hobby is logging. Aru hadn't known until now. Is there another Emperor with such a bizarre hobby? Wilhelm sat next to Aru only after toppling a few more trees.\n\n\"Thank you. After coming to Luxembourg, I felt completely abandoned. ...At least you care about me.\"\n\"I just judged that you would be helpful to Handyman. No special intention.\"\n\"Haha. Doesn't matter. ...Separately, would it be okay to make a small request to Handyman?\" \"Request?\"\n\nEmperor Wilhelm hesitated and then said. \"I won't be able to become the German Emperor again, but after we liberate Germany, I want you to return the governance of Germany to even my relative.\""
 HEU.flavor_event.10.a:0 "\"...I don't know if it will be possible, but I'll think about it.\""

 HEU.flavor_event.11.t:0 "Schuster Line"
 HEU.flavor_event.11.desc:0 "Chief Engineer Joseph Schuster spread his barrier design before Kayoko, representing Handyman, and Émile Speller, representing the Luxembourg military. Various locations for barricades and concrete walls were marked on the map. Schuster spoke with a confident voice.\n\n\"Once the construction of the walls and watchposts is completed, we'll be able to identify all enemy movement routes trying to enter Luxembourg and prepare in advance.\"\n\nSpeller cleared his throat. \"Building concrete fortresses along the entire border is an excellent plan, but why did you mix in barbed wire between the concrete fortresses to make a clumsy fortress? We could do it like the Maginot Line. Connecting the entire border.\"\n\n\"To be honest with you, General, Luxembourg is too wide a plain topographically. It's not a good terrain for building fortresses.\"\n\n\"Then what is the value of this fortress?\"\n\n\"At least to make the enemy's armored power linger for a few dozen minutes in front of the obstacles, and in that time to let our main army know that 'the invasion has started'.\"\n\nA fortress not to block the enemy, but just to earn time. Speller, who had hoped the Schuster Line would become Luxembourg's Maginot Line, looked uncomfortable. Kayoko intervened.\n\n\"Realistically speaking, Schuster is right. Earning even a few dozen minutes will provide enough time for our army to prepare for combat.\""
 HEU.flavor_event.11.a:0 "\"...And if Gehenna's power rushes here, even tearing and bringing the Maginot Line wouldn't help.\""

 HEU.flavor_event.12.t:0 "The Dream of the German Empire Fades"
 HEU.flavor_event.12.desc:0 "\"That I, who was the Crown Prince of Greater Germany, have become a general of Luxembourg.\"\n\nWilhelm III let out a sigh and tightened his uniform buttons. He knew that after the monarchy collapsed, the old glory wouldn't return anymore. But at least he thought he could become a general of 'Deutschland'. Not 'Luxembourg'!\n\nEven that, he wouldn't have obtained a military position in this place of exile following his father if not for Rikuhachima Aru's kind 'sympathy.' Looking into the mirror, Wilhelm III wore a forced smile."
 HEU_event.12.a:0 "\"I have to make a living too.\""

 HEU.flavor_event.13.t:0 "Even the Hated Prefect Team"
 HEU.flavor_event.13.desc:0 "\"I don't have good memories of the Prefect Team, but still.... if it can be helpful for Aru-sama, using the strategies the Prefect Team used.... could be a choice.\"\n\nAt Haruka's timid words, Kayoko nodded.\n\n\"I think so too. The Prefect Team was a large-scale paramilitary organization even before the Great War, and had various practical skills.\"\n\nAlthough no one in Handyman 68 could say they like the Prefect Team. they would agree that the Prefect Team has strong combat power. Since Handyman 68 is no longer an organization of only four people, learning from the enemy would also be an unavoidable choice for survival."
 HEU.flavor_event.13.a:0 "Kayoko organized the military reform plan to be delivered to Aru in her notebook."

 HEU.flavor_event.14.t:0 "The Sea for Luxembourg"
 HEU.flavor_event.14.desc:0 "Gendarmerie Chief Émile Speller closed the document and left the building. Since that day the Great War broke out, his inner thoughts about the new regent of Luxembourg were complicated. The demons of Gehenna who blew off one of his arms. Even if Aru was the legitimate regent of the Grand Duchy, she was also just a 'non-human' with a halo. But.\n\n\"The day a navy is formed in Luxembourg... has come.\"\n\nStanding at the Luxembourgish naval port and looking out at the wide sea, General Speller looked up at the Handyman 68 flag fluttering in the sky. It was a nonsensical thing. That that suspicious regent achieved such success, he couldn't believe it. But. That thing really happened.\n\n\"The Regent has eventually changed the history of Luxembourg.\""
 HEU.flavor_event.14.a:0 "General Speller wore a smile."

 HEU.flavor_event.15.t:0 "Cat-ism"
 HEU.flavor_event.15.desc:0 "\"Ta-da! Everyone look well. This is my ambitious anti-Catholic faith plan I've prepared diligently!\"\n\nMorning time. Aru suddenly distributed a planning proposal to the Handyman members one by one. Haruka, who received the proposal, muttered as if chanting. \"...Cat-ism?\"\n\n\"The Catholic Church says 'women shouldn't go outside the kitchen' and so on while bullying Kivotos students. So, I thought about what if we let the Catholic believers of Luxembourg believe in another religion.\"\n\nMutsuki tilted her head. \"But why cats of all things?\"\n\"Because Kayoko likes cats.... I even put in some thought.\"\n\n\"Ahem.\" Kayoko, who cleared her throat, had her cheeks flushed red in an instant. \"Listen, President.... although I like cats, I don't like them enough to want to kneel and pray before a cat....\"\n\"Ah. Really?\"\n\"Ahaha! Aru-chan. Your flustered expression is really funny!\"\n\"Aru-sama... in my opinion too, a cat religion is...... a bit....... wouldn't it be better if Aru-sama became a god?\"\n\n\"T-that's embarrassing for me...... a-anyway, well, I thought it was a pretty good plan...... are there no votes in favor?\"\n\nKayoko let out a sigh. \"It's the worst plan imaginable.\""
 HEU.flavor_event.15.a:0 "\"Then well... yeah... let's just act like it never happened.\""

 HEU.flavor_event.16.t:0 "Jean-Paul Sartre's Reply"
 HEU.flavor_event.16.desc:0 "I was also deeply impressed by the anti-authoritarian and deconstructive revolution progressing in the Grand Duchy of Luxembourg. Thank you for inviting me, who is just an unknown novelist, and I will see you in Luxembourg as soon as possible. My heart is racing at the thought of seeing and experiencing the revolution progressing in Luxembourg myself.\n\nSent by Jean-Paul Sartre"
 HEU.flavor_event.16.a:0 "That's happy news!"

 HEU.flavor_event.17.t:0 "Emma Goldman's Reply"
 HEU.flavor_event.17.desc:0 "It is true that there are worrying aspects about your revolution in Luxembourg. However, it is also true that until now no European politician has attempted to work for the rights and liberation of women and for those who are oppressed. There will be both positive and negative aspects to your revolution, but I will personally visit you and find out how Luxembourg's 68 Revolution is progressing.\n\nSent by Emma Goldman"
 HEU.flavor_event.17.a:0 "That's happy news!"

 HEU.flavor_event.18.t:0 "Jean-Paul Sartre - Walking Through Luxembourg"
 HEU.flavor_event.18.desc:0 "...The reason I participated in the 68 Revolution myself and wrote this essay is because Luxembourg's liberal and anti-authoritarian move is radical to a degree that has never happened until now, and yet it is beneficial not only to the Kivotos people who came through the Great War but also to humanity. Some opponents claim that Rikuhachima Aru is dreaming of the destruction of human 'civilization,' but actually what Rikuhachima Aru and her supporters dream of is to destroy the 'barbarism' of humanity.\n\nLiberation for women, liberation from authoritarianism, liberation from religion.... Students participating in the 68 Revolution harbor questions about 'why' the old system that has oppressed them exists, and seek to completely reconstruct the old system into a new one. Here there is no barbaric self-indulgence or anarchist violence that opponents talk about. It is only the followers of the old system who commit violence, and revolutionaries use violence only minimally when responding to such violence.\n\nI want to say boldly. Let all Kivotos academies and all human nations participate in the 68 Revolution! Raise questions about the existing system. Raise questions about why the order that oppresses you exists! and, raise questions even about your faith..."
 HEU.flavor_event.18.a:0 "and, forbid forbidding"

 HEU.flavor_event.19.t:0 "Emma Goldman - Private Meeting with Rikuhachima Aru"
 HEU.flavor_event.19.desc:0 "\"Clearly your 'revolution' for women, workers, and those who are oppressed has positive aspects different from existing revolutionaries. You are showing a figure of progressing toward a dream of freedom and a community for everyone that other revolutionaries haven't highlighted until now.\"\n\nWhile saying so, Goldman looked at Aru sitting opposite on the sofa with a worried gaze.\n\n\"However, Miss Rikuhachima, since taking office you've been continuously increasing military expenditures to a degree that Luxembourg can hardly handle.\"\n\nShe talked with this woman named Goldman. The current oppressive order must be cleared. She agreed on that point, but Aru couldn't agree with Goldman's pacifist ideal. Dissolving all armies and waiting for workers of other countries to voluntarily sympathize with the revolution.\n\nAru took a sip of black tea. \"In my opinion, if we operate Luxembourg according to Emma's opinion, we'll perish within 2 weeks? Rather, we should increase the army more and push away the surrounding corrupt local powers with force....\"\n\"Isn't that just a modification of Trotsky's theory of permanent revolution to fit your revolution?\"\n\"I don't know much about human politicians like Trotsky or whoever. Just.... I'm just working for the people I want to protect.\"\n\"If that's the case, I'd like to point out that the direction of that effort is going wrong.\"\n\nGoldman stood up. \"Miss Rikuhachima's revolution is clearly changing the world in a better way. I also intend to stay in Luxembourg for a bit more. However, if you don't change that militaristic thinking, the revolution will surely fail.\""
 HEU.flavor_event.19.a:0 "Aru didn't say anything until she left."

 HEU.flavor_event.20.t:0 "The Flame of Revolution Will Not Extinguish"
 HEU.flavor_event.20.desc:0 "The flame of freedom that began to burn due to the 68 Revolution was fiercely burning all of Luxembourg. The news of a foreign invasion that broke out in this situation made the numerous academy students gathered in Luxembourg unite instead of making them scared. Students of various Kivotos academy unions didn't have 'patriotism' that tied each other together, but they had 'love for the hometown' that they must protect this community for freedom. Students who came from various academies including Gehenna, Trinity, and Millennium voluntarily submitted enlistment applications to the Luxembourg army. Not to protect their own academy, but to protect the 68 Revolution."
 HEU.flavor_event.20.a:0 "Tyrants shall be así"

 HEU.flavor_event.21.t:0 "68 Revolution - Supporter? Interrupter?"
 HEU.flavor_event.21.desc:0 "I will create a free Kivotos cultural community escaped from the oppression of the local civilization. Such a 68 movement of Rikuhachima Aru inspired students all over Kivotos, and many students migrated to the Grand Duchy of Luxembourg. However, Red Winter students who came in during this process became a new problem in the direction of the revolution. The 'revolution' Aru wants is just ensuring that Kivotos students are not discriminated against due to local oppressive culture. However, Red Winter students are people called so-called 'Trotskyists,' who think that reform should take place not only in the cultural field but also in the economic field in a communist way.\n\nRikuhachima Aru herself doesn't want her revolution to be 'colored red,' but the fortunate point is that revolutionaries from Red Winter are not that many. Still, students from Gehenna, the 'Academy of Freedom' which is physically close to Luxembourg, are the center of the 68 Revolution. Still, shouldn't Aru say something before the wave of Trotskyism spreads further? Or continuing to keep her mouth shut could be an alternative."
 HEU.flavor_event.21.a:0 "Either way, it's a good thing if more people come."

 HEU.flavor_event.22.t:0 "Red Winter Students' Suspicious Pudding"
 HEU.flavor_event.22.desc:0 "Red Winter students who came for the revolution are often seen sharing strange pudding with other academy students, saying 'you can gain deep understanding of Trotskyism'. The connection between Trotskyism and pudding is unknown, but Luxembourgish police who obtained some of the pudding concluded that ingredients with hallucinogenic effects such as mushrooms are mixed in this pudding. It seems to be part of a somewhat 'mystical' attempt to realize the teachings of Marx-Lenin in an awakened state from mushrooms. Luxembourgish police submitted a medical opinion that this pudding doesn't seem to have an addictive effect, but if consumed in large quantities, toxins can build up in the liver to a dangerous degree."
 HEU.flavor_event.22.a:0 "\"Mystery my foot! Confiscate all of it immediately!\""
 HEU.flavor_event.22.b:0 "\"If there's no addiction, well, let them do it or not.\""

 HEU.flavor_event.23.t:0 "We Want Freedom!"
 HEU.flavor_event.23.desc:0 "\"Implement Gehenna-style lectures!\"\n\"Occupy all schools in Luxembourg!\"\n\"We want free discussion!\"\n\nAs the flame of the 68 Revolution burns increasingly hot, the movement of Gehenna students who occupy the largest proportion among the Kivotos population of Luxembourg is also becoming active. The Freedom Academy movement led by Gehenna students recently is the representative activity. Freedom Academy advocates occupy high school and university facilities in Luxembourg using guns and demand to stop the 'unidirectional' classes where a teacher or professor directly writes on a blackboard to lecture. Freedom Academy advocates instead claim that all schools in Luxembourg should have an autonomous attendance system like Gehenna Academy (It is a surprising story for Aru, but they say you could not come to school even without an absence note in Gehenna), and should let students study in a freer atmosphere by just playing BDs or video media in the classroom instead of the teacher's class.\n\nLuxembourgish teachers are strongly protesting that if this 'Gehenna-style' lecture starts, the illiteracy rate in Luxembourg will increase several times within a few years, but this Freedom Academy movement might be an opportunity to apply the horizontal relationship between teachers and students and the anti-authoritarian academic atmosphere of Gehenna to Luxembourgish schools."
 HEU.flavor_event.23.a:0 "\"Schools in Luxembourg also to Gehenna-style!\""
 HEU.flavor_event.23.b:0 "\"Still, attendance is a student's duty and... no, I'm the President so I'm an exception!\""

 HEU.flavor_event.24.t:0 "French or German"
 HEU.flavor_event.24.desc:0 "The 68 Revolution was a struggle for liberal revolution to Kivotos people, but it was just something incomprehensible to the locals. However, at least some intellectuals could vaguely know the concept of this 'liberalism.' Within the Radical Liberal Party in Luxembourg, a big debate broke out after the revolution. It was the language issue.\n\nLuxembourg was a bilingual society where both German and French were used. Which of these two languages should be prioritized? Radicals within the Radical Liberal Party claimed the emphasis on French. In particular, the point that France is the nation of the 'French Revolution' became a major focus. The claim was that French being widely used is the revolutionary spirit and free spirit.\n\nIn contrast, monarchists preferred German. The claim that German is a language that feels much more 'disciplined and military' compared to French was prevalent, and that it was necessary to protect German to protect Regent Rikuhachima against the threats of surrounding countries.\n\nOf course, the claim that one of the two languages should be selected didn't gain popularity in the government, but the language debate had a certain degree of influence on the intellectuals of all of Luxembourg."
 HEU.flavor_event.24.a:0 "\"...Can't we just use English?\""

 HEU.flavor_event.25.t:0 "Protect French!"
 HEU.flavor_event.25.desc:0 "In the sense of breaking down the local 'oppressive' culture and spreading the free culture of the 68 Revolution, some intellectuals held a 'French Language Protection' street protest. In this process, an incident occurred where farmers belonging to the former Right Party confronted the protesters. The farmers and the intellectual protesters quickly clashed in the street, and in this process, one farmer died from a blow to the head.\n\nThe Radical Liberal Party which sponsored this protest announced to apologize to the deceased farmer through a party statement, but it seems clear that the largest monarchist force in Luxembourg, the Radical Liberal Party, received some political damage due to this farmer death incident."
 HEU.flavor_event.25.a:0 "It's a tragedy."

 HEU.flavor_event.26.t:0 "Trotsky vs. Stalin"
 HEU.flavor_event.26.desc:0 "Trotskyist activists from Red Winter began to have a conflict with the local political party, the Luxembourg Communist Party. The Luxembourg Communist Party representative Zénon Bernard demanded that Red Winter students join the Luxembourg Communist Party and reject Trotsky's revisionist policies, saying all communist parties must follow the 'one country, one party' rule taught by Joseph Stalin. However, Red Winter students claimed they had no duty to follow the socialism in one country policy, and rather made a counter-proposal that the Luxembourg Communist Party should join their 'Trotskyism Revolution Club' activities. Zénon Bernard seems to have decided not to issue any commentary, judging that it is impossible to persuade the Red Winter side."
 HEU.flavor_event.26.a:0 "Why do communists have so many factions?"

 HEU.flavor_event.27.t:0 "General Student Council President Rikuhachima Aru?"
 HEU.flavor_event.27.desc:0 "\"I don't know what role the General Student Council President had in Kivotos society before the Great War.\"\n\nPrime Minister Joseph Bech said with an uncomfortable mood, but with a voice that restrained his emotions enough not to make Aru angry.\n\n\"But if the Regent becomes the representative of Kivotos, what happens to the status of Luxembourg? I hope it's not a form where the Grand Duchy of Luxembourg is merged under the Kivotos General Student Council.\"\n\nAt the time of the previous Right Party coup incident, Joseph Bech could maintain his prime minister position for the reason that he 'didn't know' the coup plan. Aru also had no great ill will toward Bech who didn't betray her and Handyman 68, and she wore a confident smile while slightly picking up a teacup filled with black tea.\n\n\"The General Student Council is not a nation but an international organization. It's like the League of Nations here, so to speak.\"\n\"...The League of Nations.\"\n\"So me becoming the General Student Council President and the existence of Luxembourg are separate. It's easy to understand if I say it like this?\"\n\"If that's the case, then I'm relieved. I have a duty to maintain the existence of this country as the Prime Minister of Luxembourg.\"\n\n\"It's okay. As long as I'm here, Luxembourg will remain a paradise where both locals and Kivotos people live together equally.\" As if saying not to worry, Aru confidently drank the black tea in one gulp."
 HEU.flavor_event.27.a:0 "\"Ow, hot! Ack! *Cough!* *Cough!*\""

 HEU.flavor_event.28.t:0 "Spread of the 68 Revolution"
 HEU.flavor_event.28.desc:0 "\"Forbid forbidding! I want a revolution in which I can dance!\"\n\nBeginning from Handyman 68 and gaining the name '68 Revolution,' the Rikuhachima-ist movement is also influencing various Kivotos academies. Consisting of three points: 'Opposition to Authority,' 'Rejection of Local Culture,' and 'Anti-Religionism,' this revolution advocates for the unity and freedom of all Kivotos people. [ROOT.GetName] and various other academies have returned after seeing the revolution in Luxembourg directly, and students spreading revolutionary ideology are appearing in our nation too.\n\nSince this revolution expresses opposition to authoritarianism, it has the possibility of fostering opposition forces to our [ROOT.GetName] system. It wouldn't be a strange choice even if [ROOT.GetLeader] suppressed the students leading the 68 Revolution. However, some optimists expect that the free spirit of the 68 Revolution will provide broad opportunities for discussion in our academic circles and let intellectuals share more teachings."
 HEU.flavor_event.28.a:0 "Join the revolution"
 HEU.flavor_event.28.b:0 "This must be resolutely forbidden"

 HEU.flavor_event.29.t:0 "Safety First"
 HEU.flavor_event.29.desc:0 "Gendarmerie Chief Émile Speller, who visited the Grand Ducal palace, spoke first with worry.\n\n\"Your Highness the Regent. I heard that the gun you originally used is too big to carry in the street.\"\n\"Carrying a gun is common sense in Kivotos but....... Luxembourg doesn't seem to be so. I'm trying to fit into the local culture.\"\n\"It is a very good thing to respect and try to understand the culture of your country as the Regent. But, Your Highness. You need to have at least minimum armament in case a terror like the previous one happens again.\"\n\nThat previous terror. Aru could feel the throbbing phantom pain spread along her spine. because she suffered ruthless violence from five fascists.\n\nÉmile Speller took an envelope out of his bag and put it down on the desk.\n\n\"Your Highness. It is a Belgian pistol distributed to Luxembourgish gendarmerie officers.\"\n\nAru took the pistol out of the envelope and shook it. The bullets were contained in a separate paper envelope. Even though she didn't instruct it, she was grateful for Speller who brought such a self-defense tool, and also felt sorry.\n\n\"I should protect my own body well. Making others worry for no reason....... Thank you.\"\n\"If you need, I will assign personal security.\"\n\"That much is fine. Because there are Handyman friends. But...... I'll use this pistol well.\""
 HEU.flavor_event.29.a:0 "Safety is first, after all"

 HEU.flavor_event.30.t:0 "How Far Should a Revolution Be a Revolution?"
 HEU.flavor_event.30.desc:0 "Some Gehenna students who claimed 'more freedom' due to the 68 Revolution were suppressed today while trying to perform a 'Peace through Freedom' operation to seize the Luxembourg Ministry of Defense and declare the dissolution of the army. Gehenna radical pacifists caused a disturbance by smashing the Ministry of Defense gate with a hammer and assaulting the gendarmes who came to suppress them, but Handyman 68's Kayoko personally came to the scene and barely dispersed the pacifists by pointing out the problems of 'non-violence movement through violence' with a megaphone.\n\nFortunately, no deaths occurred, but six Luxembourgish soldiers who confronted Gehenna students were injured, and property damage occurred such as the gate of the Ministry of Defense being torn off and anti-war graffiti being written on the exterior wall of the building. Nationalists within the military were furious saying that students are becoming too radical due to Aru's '68 Revolution,' but Gendarmerie Chief Émile Speller persuaded other generals by saying that Aru didn't directly instruct this protest."
 HEU.flavor_event.30.a:0 "List of defense budget usage this year. Attaching a new gate, erasing graffiti..."

 HEU.flavor_event.31.t:0 "Liberation of Fort Eben-Emael"
 HEU.flavor_event.31.desc:0 "In the Belgian Fort Eben-Emael, which was built to prepare for the invasion of the German Wehrmacht, there was a kind of 'liberated area' where nationalist soldiers who refused the rule of Kivotos-affiliated nations resided after the Great War. The fort, which had been waiting for the return of human nations for a long time, opened wide today as the Luxembourgish army entered, and a touching reunion ceremony between Belgian soldiers and Luxembourgish soldiers was achieved. Although Belgian nationalists are dissatisfied that the Grand Duke of Luxembourg is a red-haired Kivotos person with a halo and horns, they agreed to naturalize to Luxembourg, recognizing that Rikuhachima Aru is eventually governing under human laws and systems as 'the Regent of the Grand Duchy of Luxembourg'.\n\nOur soldiers found various guns stored inside Fort Eben-Emael. Officers joyfully reported that they are perfectly compatible with the existing Luxembourgish army rifles which used Belgian weapons from the start. The weapons recovered from the fort were in a state where the Luxembourgish army could use them right away."
 HEU.flavor_event.31.a:0 "What a wonderful story!"

 HEU.flavor_event.32.t:0 "Pandemonium, Ibuki, and Ibuki"
 HEU.flavor_event.32.desc:0 "After the collapse of the Pandemonium Society government, important figures of Pandemonium who exiled to the Grand Duchy of Luxembourg officially requested the Grand Duchy to continue publishing the 'Weekly Pandemonium' newspaper. The baffling point was the fact that the newspaper must be published with Luxembourg's taxes, and the information to be contained in the newspaper was not stories about the war situation currently in progress, but articles to promote the cuteness of a single girl named 'Tanka Ibuki'.\n\nGendarmerie Chief Émile Speller confirmed whether the request of Pandemonium was true several times with a voice that restrained anger to the maximum, but he only reconfirmed the fact that Pandemonium assembly members *really* wanted to promote Ibuki's *cuteness* to the public even during the total war.\n\nGendarmerie Chief Speller put forward an opposing opinion in a private meeting with Rikuhachima Aru, saying \"Your Highness's soldiers are dying on the battlefield. Using the budget that should return to them for a *mere* foreign celebrity at this time is an unjust thing.\" However, a warning was also delivered from the Pandemonium leadership that if the publication of Weekly Pandemonium is stopped, the morale of Pandemonium soldiers incorporated into the Luxembourgish army during the exile process would plummet.\n\nUltimately, the decision is Aru's. While not even understanding herself why she must worry for such a stupid decision, Aru sat before the typewriter while pressing her throbbing temple."
 HEU.flavor_event.32.a:0 "...I have no choice but to sacrifice for the morale of Pandemonium soldiers..."
 HEU.flavor_event.32.b:0 "Does this make sense? The people who are loyal to me... are dying even now!"

 HEU.flavor_event.33.t:0 "Blue Archive: Handyman 68 Work Log"
 HEU.flavor_event.33.desc.a:0 "As Rikuhachima Aru's '68 Revolution' gained popularity not only among Kivotos people but also among intellectuals in the international community, attempts to utilize Aru's recognition 'commercially' also appeared. The movie 'Blue Archive: Handyman 68 Work Log,' which was released simultaneously in all German-speaking areas including Luxembourg this time, is a noir movie that depicts the activities of Rikuhachima Aru in Kivotos before the Great War (with some cinematic imagination added). Heinrich Piel, a star movie actor who is enjoying the greatest popularity in the entire German-speaking area, personally directed this movie, and as a crime thriller following Piel's 1930 previous work 'Watch Out! Auto Thieves! (Achtung! – Auto-Diebe!)', it led to rave reviews from critics with a plot that makes the audience's hearts race.\n\nHandyman 68 Work Log, official movie name 'Blue Archive: Handyman 68 Work Log', features the charismatic actress Marlene Dietrich as Rikuhachima Aru, and the Czech-born Deutsch actress Anny Ondra as Igusa Haruka, Aru's buddy and an important lead in the movie. Dietrich depicts Rikuhachima Aru, a cold-blooded killer who continues assassinations only against villains for the commoners in the Gehenna of Kivotos which is stained with crime and corruption. The heinous Prefect Team villains in league with the mafia try to protect corrupt politicians and capitalists, but the situation changes rapidly whenever the genius sniper Rikuhachima Aru appears. Aru's sniping does not miss in any situation, and always pierces the heart of the villain instead of innocent citizens.\n\nAs the movie achieved commercial success, sales of Marlene Dietrich's bromides disguised as Rikuhachima Aru surged, and the on-the-rocks whiskey depicted as what Rikuhachima Aru enjoys drinking in her office in the movie also gained fame.\n\nMovie critics praised that Director Heinrich Piel surprisingly and perfectly depicted the resistance spirit against the old system and the liberal spirit of the 68 Revolution through the figure of Aru fighting against the \"corrupt\" Prefect Team. Piel, who already achieved a great commercial success, announced that he will produce a sequel movie about Aru's great adventure to assassinate 'Baron Amau,' a Prefect Team villain in league with the mafia, and the contract renewal with Dietrich also proceeded smoothly. Heinrich Piel, who is an excellent director and actor, has already revealed Baron Amau's costume to the media motivated by Count Dracula, and said that he himself will take the role of Baron Amau. Fans of the movie 'Blue Archive' are already waiting with bated breath for the filming of the new movie to end."
 HEU.flavor_event.33.desc.b:0 "As Rikuhachima Aru's ideology of 'harmony between Kivotos people and humanity' gained popularity, attempts to utilize Aru's recognition 'commercially' also appeared. The movie 'Blue Archive: Handyman 68 Work Log,' which was released simultaneously in all German-speaking areas including Luxembourg this time, is a noir movie that depicts the activities of Rikuhachima Aru in Kivotos before the Great War (with some cinematic imagination added). Heinrich Piel, a star movie actor who is enjoying the greatest popularity in the entire German-speaking area, personally directed this movie, and as a crime thriller following Piel's 1930 previous work 'Watch Out! Auto Thieves! (Achtung! – Auto-Diebe!)', it led to rave reviews from critics with a plot that makes the audience's hearts race.\n\nHandyman 68 Work Log, official movie name 'Blue Archive: Handyman 68 Work Log', features the charismatic actress Marlene Dietrich as Rikuhachima Aru, and the Czech-born Deutsch actress Anny Ondra as Igusa Haruka, Aru's buddy and an important lead in the movie. Dietrich depicts Rikuhachima Aru, a cold-blooded killer who continues assassinations only against villains for the commoners in the Gehenna of Kivotos which is stained with crime and corruption. The heinous Prefect Team villains in league with the mafia try to protect corrupt politicians and capitalists, but the situation changes rapidly whenever the genius sniper Rikuhachima Aru appears. Aru's sniping does not miss in any situation, and always pierces the heart of the villain instead of innocent citizens.\n\nAs the movie achieved commercial success, sales of Marlene Dietrich's bromides disguised as Rikuhachima Aru surged, and the on-the-rocks whiskey depicted as what Rikuhachima Aru enjoys drinking in her office in the movie also gained fame.\n\nMovie critics praised that Director Heinrich Piel's figure of Aru fighting against the \"corrupt\" Prefect Team captured both significant entertainment fun and social criticism elements. Piel, who already achieved a great commercial success, announced that he will produce a sequel movie about Aru's great adventure to assassinate 'Baron Amau,' a Prefect Team villain in league with the mafia, and the contract renewal with Dietrich also proceeded smoothly. Heinrich Piel, who is an excellent director and actor, has already revealed Baron Amau's costume to the media motivated by Count Dracula, and said that he himself will take the role of Baron Amau. Fans of the movie 'Blue Archive' are already waiting with bated breath for the filming of the new movie to end."
 HEU.flavor_event.33.a:0 "...Every single thing is a lie!"
 HEU.flavor_event.34.t:0 "Why is the Boss here?"
 HEU.flavor_event.34.desc:0 "\"Why am I here, you ask?\"\n\nAru, who was signing a coal mine budget document sent up from Parliament, leaned back on the office sofa and met the eyes of Kayoko, who was looking back at her. Kayoko had her arms crossed and spoke bluntly with a slight squint in her eyes.\n\n\"The chaos in Luxembourg has been settled. Parliament is functioning well now. If it were the usual Boss, I thought you'd say, 'Ah, we've done all we can here. Let's head out like true outlaws and find a new office.' It’s hard to believe it’s because you’re eyeing the palace, given your personality.\"\n\nAs she listened to Kayoko, Aru's mind drifted back to the day of the Grand Transfer. The sight of flames rising wherever one looked in the city. The palace building she ran toward, following a gendarme who cried out, 'We must save Her Royal Highness!'\n\nAfter neutralizing a few Gehenna rioters around the palace, Aru split the Handyman 68 crew into two teams and searched the palace interior with Mutsuki. She hadn't expected to find anything significant. The Gehenna kids just wanted to have fun in the atmosphere; she figured they might have just looted a few artworks from the palace.\n\nAs if mocking that thought, a bloodbath unfolded inside the bedroom she opened without a second thought. Right in front of the door was the body of an adult man torn apart by bullets diagonally... or something that used to be one.\n\nThump. Thump. Thump. Her heart pounded as if it would burst. Aru held back her nausea and walked through the well of blood. And beyond that. Behind the bed, a middle-aged woman was seen, hit by several bullets. While the gendarmes knelt before her, wailing 'Your Highness!'\n\nAru approached Grand Duchess Charlotte. Was she dead? She certainly couldn't have been alive. But at least to Aru, she could hear the voice of the woman who died with her eyes wide open.\n\n\"Are my children safe? Was I... able to protect those children?\"\n\nIt must have been a hallucination from the state of panic. Yet, even while looking at the remains of the headless child she desperately clung to until the end, Aru—\n\n\"Of course. So... so... it's okay to leave now.\"\n\nHolding back welling tears, she slowly closed the eyes of Grand Duchess Charlotte, who had died amidst bloody tears. She remained kneeling before the remains of the child and the Grand Duchess for a long time, until Mutsuki pulled her by the shoulder."
 HEU.flavor_event.34.a:0 "Just because. ...I felt like I couldn't just leave these people behind. That's all."

 HEU.flavor_event.35.t:0 "Founding of the German National Movement"
 HEU.flavor_event.35.desc:0 "Fellow Germanic brothers and comrades, this is Damian Kratzenberg. Yes. Many of you likely heard the broadcast recently aired nationwide via radio and television. Those who heard it on the radio probably didn't know I was this handsome, did you? (Laughter is heard)\n\nWelcome to all the patriots and Pan-Germanic nationalists gathered at today's party founding ceremony. We are the proud citizens of the only independent Germanic nation to successfully repel the invasion from Kivotos. To ensure the National Socialist spirit created by Führer Hitler never fades, must we not unite as a single party?\n\nI officially found the new party, the 'German National Movement,' today. Comrades, Luxembourg will be unified under National Socialism, and the spirit of Deutschland will breathe and live in this land. Thank you!\n\nNow, I will distribute membership applications to those gathered. Party fees are also accepted in dollars..."
 HEU.flavor_event.35.a:0 "Hitler does not die easily."

 HEU.flavor_event.36.t:0 "Conclusion of the Palace Attack Case"
 HEU.flavor_event.36.desc.a:0 "The appellate trial for the three Gehenna students directly involved in the murder of Grand Duchess Charlotte, Prince Consort Felix, and their children amidst the chaos of the Grand Transfer has recently concluded.\n\nViktor Botzon, a socialist serving as the defense attorney for the three, requested leniency, arguing that since Kivotos students live their entire lives in a society where they do not die from being shot, the killing of the Grand Ducal family was merely an unintended accident, and a form of 'diminished responsibility' should be applied.\n\nHowever, fierce counterarguments followed, fueled by public outrage and the legal impossibility of reducing the sentence for 'firing an automatic rifle at a six-year-old child.' The first and second instance courts found them guilty on all counts—Article 101 'Murder of a Head of State,' Article 102 'Sedition,' and Article 103, which punishes the murder of direct family members of the Grand Duke—sentencing the three students to death. The Supreme Court dismissed the appeal, finalizing the sentence.\n\nTo appease the angry populace, the Luxembourg judiciary made the unusual decision to swiftly execute the three students by guillotine. In response, '68 Revolution' activists, who declared a break from all authority, publicly refused to accept the verdict and attempted a rescue operation. Twenty activists from Red Winter attempted to break through the prison by force, claiming, 'They merely liberated Luxembourg from the monarchy by killing the Grand Ducal family,' but were blocked by police forces already prepared for the attempt.\n\nSome '68 Revolution' activists and lawyer Botzon demanded that Rikuhachima Aru issue a pardon for the three, but Aru infuriated the revolutionaries during a meeting by saying, \"I do not have the right to forgive those people.\"\n\nThis execution was the first in over a hundred years since the last one in 1821, and the guillotine execution of the three students was carried out today, two weeks after the death sentence was finalized. Even after the execution, some radical revolutionaries continue their criticism of Aru."
 HEU.flavor_event.36.desc.b:0 "The appellate trial for the three Gehenna students directly involved in the murder of Grand Duchess Charlotte, Prince Consort Felix, and their children amidst the chaos of the Grand Transfer has recently concluded.\n\nViktor Botzon, a socialist serving as the defense attorney for the three, requested leniency, arguing that since Kivotos students live their entire lives in a society where they do not die from being shot, the killing of the Grand Ducal family was merely an unintended accident, and a form of 'diminished responsibility' should be applied.\n\nHowever, fierce counterarguments followed, fueled by public outrage and the legal impossibility of reducing the sentence for 'firing an automatic rifle at a six-year-old child.' The first and second instance courts found them guilty on all counts—Article 101 'Murder of a Head of State,' Article 102 'Sedition,' and Article 103, which punishes the murder of direct family members of the Grand Duke—sentencing the three students to death. The Supreme Court dismissed the appeal, finalizing the sentence.\n\nTo appease the angry populace, the Luxembourg judiciary made the unusual decision to swiftly execute the three students by guillotine. This execution was the first in over a hundred years since the last one in 1821, and the guillotine execution of the three students was carried out today, two weeks after the death sentence was finalized.\n\n[ROOT.GetLeader] left only a short comment to reporters asking about the death sentence: \"I hope that those who passed away can find even a small bit of comfort in heaven through this.\""
 HEU.flavor_event.36.a:0 "..."

 HEU.flavor_event.37.t:0 "Communist Civil Rights Movement"
 HEU.flavor_event.37.desc:0 "Those from Kivotos are stronger than humans. But no individual, no matter how strong, can defeat a group. That Kivotos student, who was being subjected to a 'school-ban' movement by dozens of other students, had been unable to go to school for weeks due to fear. She could have used violence against the majority. She could have easily smashed the cheekbones of a human student, saying this is what happens if you bully her. But the legal punishment after that? The 'gloomy' bullying that would surely worsen?\n\nThump, thump. When the sound of knocking on the girl's door was heard, she thought the human students had finally come to her house to bully her. But when she opened the door in fear, there stood members of the Luxembourg Communist Party in stylish suits.\n\n\"Hello. We've come for a civil rights investigation. Is it true that you have been a victim of the recent anti-Kivotos student school refusal movement in local schools?\"\n\nThe appearance of those adults, speaking in kind voices to reassure the girl and saying, 'We've come to help the student.' In front of them, the girl burst into tears for the first time since the Grand Transfer—not out of fear or sadness, but out of hope for the future."
 HEU.flavor_event.37.a:0 "A good individual cannot defeat an evil group. But a good group can defeat an evil one."

 HEU.flavor_event.38.t:0 "Language Unification Movement"
 HEU.flavor_event.38.desc:0 "Luxembourg's official documents must be written in French.\n\nAlthough it was a country that used German as a spoken language, French, perceived as an 'aristocratic and sophisticated language,' had been used as the written language by custom for centuries. The movement to abolish this inefficient bilingual system and unify Luxembourg under German was carried out with the consent of both the right-wing forces, including the Right Party, and the left-wing forces, including the Communist Party. The Right Party wanted to emphasize Germanic nationalism, while the Communist Party wanted to dismantle the very concept of a 'language that gives an aristocratic feel.'\n\nWhatever the reason, following a meeting of the representatives of each party, the work to revise all legal books, including the Constitution, Criminal Code, and Civil Code written in French, into German began. Starting with the laws, French will subsequently be banned in official documents of local governments and the military. Ultimately, French was scheduled to be demoted to a level used only by some Luxembourg citizens in their daily lives.\n\nAnd the group that unexpectedly benefited from this language unification movement... was the Kivotos students. It cannot be denied that buying one German grammar book is more convenient for them than buying two new ones, right?"
 HEU.flavor_event.38.a:0 "Luxembourgers, use German!"

 HEU.flavor_event.39.t:0 "Let's Go to a Kivotos-style Shrine!"
 HEU.flavor_event.39.desc.a:0 "Among the Kivotos students who arrived in Europe after the Grand Transfer, many could not forget the memories of their hometown. Some recreated restaurants or shops they ran back home and reopened them, and some even built shrines that were in Kivotos on Luxembourgish soil. 'Daikichi-den,' a shrine rumored to be miraculous in making dreams come true, was one of those shrines.\n\n\"......So, the place we're going today is a shrine called Daikichi-den, right?\"\n\nAt Aru's question, Haruka nodded several times, her cheeks flushing red.\n\n\"Ah, yes, well, you see, lately...... so many bad things have been happening to Handyman 68. So...... I thought we could wish for everyone in Handyman 68 together at a shrine where dreams come true......\"\n\nDreams coming true. It would be nice if such fairy-tale things really happened. Besides, the relationships between the employees of Handyman 68 had been deteriorating lately. Aru lightly squeezed Haruka's hand as they walked along the forest path.\n\n\"Thank you, Haruka. I feel a bit better thanks to you.\"\n\nKayoko spoke from a few steps behind, her arms crossed.\n\n\"If we analyze it logically, 'the shrine where dreams come true' is likely just a promotional slogan created by the shrine owner. Since the shrine only opened a few months ago, there wouldn't even be any quantitative statistics on whether wishes come true or not.\"\n\nAnd Mutsuki chuckled beside her.\n\n\"Ufu-fu, ahaha-hat! As expected of the pride of our Handyman 68! Section Manager Onikata! Quantitative statistics! Kwoo. You really are a magician of facts, aren't you? You're so eager to break the mood Haruka worked so hard to create with your facts.\"\n\nKayoko's expression immediately crumpled, and she silently kicked the ground.\n\n'Sigh. You're the one breaking the mood Haruka created too, Mutsuki.......' Holding back a sigh, Aru turned around, her coat fluttering.\n\n\"Everyone, stop! Whether dreams actually come true or not. Handyman 68 isn't a group that obsesses over such trivial matters, right? We enjoy 'the time everyone spends together' that Haruka created for us. If the wish actually comes true, great; if not, we just brush it off and move on. We have to act with the mindset of an outlaw.\"\n\n\"As expected of Aru-sama......!\"\n\nAlong with Haruka's gaze shining with admiration, the stiff atmosphere softened a little."
 HEU.flavor_event.39.a:0 "Will the wish really come true?"

 HEU.flavor_event.40.t:0 "What is Your Wish?"
 HEU.flavor_event.40.desc.a:0 "The Grünewald forest, just a short walk north of Luxembourg City, was a popular walking path for the city's residents. In the middle of the forest, the shrine was small, with a modest fence around it. Naturally, everyone who came to the shrine to make a wish was from Kivotos. To the locals, it would be nothing more or less than a strange pagan facility. But even so, isn't the heart what matters? Aru stepped into the shrine with her friends.\n\nKayoko raised her hand. \"First, you must follow the correct etiquette to worship at a shrine. When passing through the torii.......\"\n\nMutsuki stuck her tongue out at Kayoko. \"I'm an atheist, so I don't follow that stuff, bleh.\"\n\n\"Sigh.\"\n\nAru also shrugged. \"What matters is that we came together. Let's put a coin in the offertory box, make a wish, and go back together.\"\n\nAru spoke with emphasis on the word 'together.' The days had been nothing but painful, but at least everyone in Handyman 68 was still together now, weren't they? After a fairly long wait for such a small shrine, it was Handyman 68's turn. Aru tossed a 1 Deutsche Mark coin into the offertory box.\n\n'If we were in Kivotos right now, what would I have wished for?' Probably something like \"Please don't let my business fail!!\" Although 'Handyman 68' and 'business' were increasingly becoming secondary concerns.\n\nAru lightly touched her prosthetic eye with her fingertips. 'If I have a wish now, it is that even if I die, these precious friends of mine will be happy. Only that.' Aru offered a prayer and closed her eyes slightly. And at that moment.\n\n\"Aru-sama!!! It's dangerous!\""
 HEU.flavor_event.40.a:0 "The moment Aru opened her eyes, a huge explosion occurred."

 HEU.flavor_event.41.t:0 "Infinitely Rotating Justice"
 HEU.flavor_event.41.desc.a:0 "\"The infinitely rotating rail eventually leads to the future of justice! Infinite Sushi Sentai Kaitenger has arrived!\"\n\"Attention! From this moment on, the ownership of this shrine's offertory box is transferred to the Kaitengers!\"\n\"The offertory box obtained here will be used for our KAITEN FX Mk.0 modifications...\"\n\nBeeeep. A ringing in her ears. Aru saw Haruka hugging her amidst the explosion. She wasn't seriously hurt. But she saw blood flowing from a wound torn along her shoulder.\n\n\"Aru-sama...... You're not hurt, are you?\"\n\nThe moment she met Haruka's beaming smile, Aru felt something snap in her head. Aru took her sniper rifle, 'Wine Red Admire,' out of the long outdoor bag she had carried on her shoulder.\n\n\"Die!\"\n\nShe fired immediately without time to aim. Perhaps because her depth perception was ruined due to being one-eyed, the bullet hit the ground. The area from her collarbone to her right arm, which had suffered fractures from the Nazis, ached as if it were being torn apart.\n\n'Aaah! Seriously! The doctor said there wouldn't be any aftereffects!' At this rate, it seemed she wouldn't be able to restart her field activities for Handyman 68 even if she returned to Kivotos. While Aru clutched her collarbone and let out a scream of pain, Kayoko and Mutsuki dashed forward.\n\n\"Offertory box or whatever! You shouldn't make Aru-chan cry!\"\n\"Wa-wait! The story progression is too fast...... Kuaak!\"\n\nBang! Boom! Several more explosions followed, and the Gehenna worshippers at the shrine cheered at the sudden gunfire, each pulling out their own guns and starting to attack the Kaitengers. Truly Gehenna-like adaptability. Aru sat down on the spot with a hollow laugh.\n\n\"In the meantime, let's put the offertory box back where it was. ......Since everyone gathered here put their wishes into it. We can't let those wishes be scattered, can we?\"\n\nAt those words, Haruka nodded.\n\n\"If it helps Aru-sama. Yes. I'll put it back.\""
 HEU.flavor_event.41.a:0 "May our bonds eventually lead to a future we spend together."

 HEU.flavor_event.42.t:0 "For Reconciliation"
 HEU.flavor_event.42.desc:0 "The number of victims during the Grand Transfer reached hundreds. The Gehenna students did not understand that this was an irreversible dimensional transfer where they could not return to Kivotos, and they accepted the sudden dimensional shift as a brief festival or adventure. Gehenna students were the type to throw grenades at each other even while going on school trips, and in the streets of Luxembourg, they started the same 'pranks' they did in Gehenna. Without knowing that humans are fragile beings who are torn to pieces and die when hit by bullets.\n\nEven if they were crimes of negligence, the Gehenna students did not immediately stop the rioting even after the first victims occurred. And even if it was a prank, the dead do not return. Aru, who had begun to be hated by both the locals and the Kivotos people, knew clearly who she should seek reconciliation and restore relations with 'first.'\n\nBecause Aru still could not forget the burning city she saw that day, and the Grand Duchess who died without closing her eyes.\n\nConstruction of a memorial park. Aru's atonement for the Luxembourgers. This plan was agreed upon through consultation with members of the coalition government to be built on the site of Berg Castle, the former palace owned by the House of Nassau until 1934. Berg Castle is a beautiful old palace with a splendid garden, and since it is located in the suburbs, a short drive from downtown Luxembourg, it will be a good place to build a memorial park."
 HEU.flavor_event.42.a:0 "The problem is, the Gehenna students aren't going to like this..."

 HEU.flavor_event.43.t:0 "Section Manager Onikata"
 HEU.flavor_event.43.desc:0 "Onikata Kayoko's face was contorted in anger as she walked down the hallway. 'Luxembourg is the only legitimate nation-state of the Germanic people,' 'We will reclaim the territory of the Germanic people.' The newly revised defense policy through consultation with the Right Party. This meant that Handyman 68 would launch a full-scale war toward the east. Why on earth would Aru fight for something like Germanic nationalism? It wasn't like her.\n\nWhile walking down the palace hallway, Kayoko ran into Mutsuki, who was coming out with a machine gun slung over her shoulder.\n\n\"Kyaha-hat, Section Manager Onikata. Hel~lo! What's with that expression? You're making your scary face look even scarier.\"\n\"Asagi. You knew about this bullshit.\"\n\"Knew? Hmm, that's not quite enough, is it? I'm the one who persuaded Aru-chan.\"\n\nBang! Kayoko pinned Mutsuki against the wall, grabbing her shoulders tightly.\n\n\"Persuaded? You're going to drive people to their deaths for something like Germanic nationalism?\"\n\n\"I thought Section Manager Onikata was smart, but it seems you can't think straight. ......Listen. Both the locals and those Gehenna bastards think Aru is a retard. Those bastards took out Aru-chan's eye, wrecked her arm so she can't fire a sniper rifle again, and poured white paint over that smiling face and treated her like a whore. Yet Aru...... that soft-hearted retard! Those fucking vermin! She forgave them all!\"\n\n\"Listen, Onikata. Should I abandon Aru-chan because of that? You know I can't do that. I stayed in Handyman 68 because I know Aru-chan is *that* kind of person! So I moved for Aru-chan's sake. I forged documents saying they would invade us and lied that a preemptive war was necessary to protect Luxembourg. She's a klutz, right? She was easily fooled.\"\n\nMutsuki brushed off Kayoko's hand.\n\n\"I have to make Aru-chan a hero. I won't let anyone ignore Aru-chan. What if we conquer the Gehenna Pandemonium Society through war, and then the Prefect Team? To the Luxembourgers, Aru-chan becomes the *hero who reclaimed the ancestral lands of the Germanic people*. To the Gehenna kids, she becomes *Gehenna's strongest outlaw*. Will those people ignore Aru-chan then? Hmm? Onikata Kayoko-san. Can you protect the Boss with your methods?\""
 HEU.flavor_event.43.a:0 "Mutsuki spat on the floor and left first."

 HEU.flavor_event.44.t:0 "I Hate the Communist Party"
 HEU.flavor_event.44.desc:0 "\"Those commie bastards should just stick to the civil rights act; why are they pointlessly attacking the Catholic Church too?\"\n\nJoseph Bech grumbled as he flipped through articles related to the Communist Party's attacks on Catholicism. Feeling the social influence of the Communist Party gradually growing, Bech began to feel an existential threat from them. The problem was that he had few options left. Aru was quite dependent on the Communist Party because of their stance on 'guaranteeing the civil rights of Kivotos people.'\n\n\"Sigh. I have no choice but to work harder on the public relations war.\"\n\nRecalling the *good* old days before the Grand Transfer, when he could simply strip the commies of their parliamentary seats even if they were elected, Bech let out a deep sigh."
 HEU.flavor_event.44.a:0 "The suffering of the Right Party"

 HEU.flavor_event.45.t:0 "Mutsuki's Report"
 HEU.flavor_event.45.desc:0 "There were two things Mutsuki hadn't considered when she handed Aru the plan about a 'Germanic ethnic war.' First, Aru's brain worked much faster than Mutsuki thought. Second, she was the president of a business, and her hobby was studying management.\n\n\"The budget doesn't add up.\"\n\nWhile reading the documents about the threat of invasion from the Gehenna region, Aru lightly bit her lower lip and let go. Mutsuki said that the intelligence agency of the Luxembourg military had detected troop movements in mainland Deutschland. However, Aru had been reading and approving all documents directly regarding when and where the Luxembourg military allocated budget and moved intelligence forces. Aru's soldiers had never visited the locations or dates in the documents Mutsuki handed her. Because she had never approved related documents.\n\nAll circumstances suggested that Mutsuki was deceiving Aru. Although she didn't know the reason, Mutsuki wanted Aru to start a war with Gehenna. A war where countless Luxembourgers and the Kivotos people Aru wanted to protect might die, under the pretext of 'reclaiming the living space of the Germanic people,' which Aru didn't even understand.\n\n\"But......\"\n\nShe couldn't doubt Mutsuki. As the president of Handyman 68 and as her friend, Aru wanted to believe in Mutsuki. That there must be a reason she couldn't mention for submitting a fake report. In this world where the culture and people were different from Kivotos, and now when even the friendship of Handyman 68 was beginning to crack. She was the only one who could believe in the mentally unstable Asagi Mutsuki."
 HEU.flavor_event.45.a:0 "It'll be okay. Mutsuki wouldn't betray me..."

 HEU.flavor_event.46.t:0 "Letter from Wilhelm II"
 HEU.flavor_event.46.desc:0 "To Her Royal Highness Rikuhachima,\n\nI first offer my praise for the smooth progress of Your Highness's march into Deutschland. Your Highness's military achievements are worthy of Frederick the Great, and the discipline of the Luxembourgish army has been more orderly than any I have seen. I believe it will not be difficult for Your Highness's brave army to crush the Kivotos invaders, communists, and National Socialist mobs and unify all of Deutschland.\n\nI was deeply impressed that Your Highness declared Luxembourg the leader of the Germanic people but did not claim the title of Emperor of the German Empire. Your Highness's grand strategy is excellent, and the victory of the war is at hand, but for smooth post-war processing after victory, the support of a legitimate leader with a long history and tradition is necessary.\n\nYour Highness, think about the aftermath of victory. I would like to suggest that Your Highness learn from the wisdom of the Chinese. The Chinese republicans, even after ousting Puyi, the Emperor of the Qing Empire, in 1912, created a 'Small Court' in the capital so that he could still exercise dignity as the Chinese Emperor to his subjects. This is because no matter how much republicanism boils in the hearts of radicals, subjects need a symbol to bind them together. You must take a lesson from the sight of China falling to warlords after the Qing Small Court was neutralized.\n\nIf Your Highness returns ownership of Charlottenburg Palace to me after reclaiming Berlin and reconstructs the Small Court of the German Empire with financial support including dignity maintenance fees, I will strive as Kaiser to ensure that all subjects of Deutsch serve Your Highness with one heart.\n\nFrom Luxembourg City, Wilhelm II"
 HEU.flavor_event.46.a:0 "...This is the first time I've ever seen such a long spam message."

 HEU.flavor_event.47.t:0 "Letter from Javier I"
 HEU.flavor_event.47.desc:0 "To Emil Reuter, Speaker of Parliament, at the Right Party Headquarters,\n\nI have received and read the letter Speaker Reuter sent. Your message mourning the death of my brother, who was the Prince Consort of Grand Duchess Charlotte, has been a great comfort to me. First, I offer my thanks.\n\nSpeaker Reuter said that since all members of the House of Nassau have died, I, as the elder brother of Prince Consort Felix, have the legitimate right of succession to become the next Grand Duke of Luxembourg. Certainly, this logic might be legally accepted by the subjects according to long tradition.\n\nBut I cannot do so.\n\nIn Spain, there are loyal Carlist comrades who consider me the legitimate King of Spain, 'Javier I,' and serve me. If I leave Spain to succeed to the Grand Ducal throne of Luxembourg, I would be betraying my subjects.\n\nAlthough I understand Speaker Reuter's concern that the Grand Ducal throne cannot be left vacant for too long, please forgive me for being unable to leave Spain as long as my subjects are there, as my homeland is ultimately Spain.\n\nSent by Francisco Javier de Borbón-Parma y de Braganza"
 HEU.flavor_event.47.a:0 "Reuter screamed and threw the letter away."

 HEU.flavor_event.48.t:0 "Kayoko's Call, Voicemail"
 HEU.flavor_event.48.desc:0 "Now. Let's look back at the situation that has occurred. You impulsively invaded Gehenna because of personal feelings. Because you couldn't protect your precious friend, you got worked up alone and brainwashed yourself into thinking, 'I always hated Gehenna.' And you even went so far as to pull a coup d'état by moving the army without the Boss's orders. Isn't it laughable? No one except a gorilla would try to put such a stupid idea into reality.\n\nRight. You never once protected Aru. Aru almost got killed on the street, and you didn't even know. You didn't even know Aru was being targeted with paint terror in front of the Handyman office. So this time, you probably wanted to protect Aru. You brainwashed yourself, thinking that if you made Aru a hero, terror wouldn't happen.\n\n...But Asagi. Isn't it strange? While you say you'll make sure Aru is never hurt again.\n\nWhy didn't you ask if that was what Aru *wanted*?\n\nWell, what kind of answer would I expect from someone like you, Asagi? You're that kind of person. However.\n\nIf anything happens to the Boss because of your stupid self-satisfaction... I'll chase you to the ends of hell and break your halo.\n\nSo make sure you win this godforsaken war. Otherwise, I'll make you regret being born into this world."
 HEU.flavor_event.48.a:0 "Beep. Beep. Beep."

 HEU.flavor_event.49.t:0 "Letter to America"
 HEU.flavor_event.49.desc:0 "Father, Mother, how are you.\n\nThe moment I saw the advertisement saying that a true patriot must fight for Germanic unification, my soul felt like it was boiling and I couldn't stop. I apologize for leaving New York without giving you prior notice.\n\nI just arrived in Luxembourg last week. There are countless Germanic patriots gathered here from all over the world. Local politicians are also thankful for our passion. Yesterday, Prime Minister Joseph Bech visited the barracks personally and shook hands with each of us American volunteers, expressing gratitude for our patriotism.\n\nFighting the Kivotos aliens will be a very enjoyable experience. The cowardly French whined that girls with halos on their heads didn't die even when shot, but we received mental education that there is a huge exaggeration in those rumors. You don't have to worry, Father and Mother.\n\nToday I became friends with Hans, a patriotic youth who came from Switzerland. Hans seemed quite excited at the thought of blowing up the Gehenna rioters when we advance to Gehenna. I also intend to compete with Hans for achievements if I am deployed to the front.\n\nAh! Break time is already over. I apologize for ending the letter without writing more. Father, Mother, I will return home as a true adult in this war.\n\nSent by George"
 HEU.flavor_event.49.a:0 "George sent this."

 HEU.flavor_event.50.t:0 "How to Become a Patriot"
 HEU.flavor_event.50.desc:0 "The trenches in Süd-Rheinland were painful as they filled with water. But the soldiers didn't even have the luxury to pump out the water. The constant attacks from the Gehenna artillery were falling around the trenches, shaking the world. Feeling the fear of not knowing when a shell would drop into the trench, George pulled down his helmet.\n\nA holy war to liberate the Germanic people. George came to Luxembourg following the propaganda advertisement Asagi Mutsuki placed in an American newspaper. Since his grandfather was German, he thought it was patriotic for him, a descendant of immigrants, to fight for his ancestors' homeland. Besides, isn't it a war with an army made up of schoolgirls? He imagined it would be easier and more fun than a football game back home. But the war with Kivotos people was completely different from what George had imagined.\n\n\"It's the Gehenna soldiers!\" As soon as the sound of shells stopped, Hans, the Swiss volunteer, poked his head out of the trench and shouted. \"Those bastards are swarming toward the trench!\"\n\nA volunteer officer, who didn't even know what rank was, shouted at the top of his lungs. \"Shoot! They're just girls anyway! Shoot and take them down!\"\n\nJust girls anyway. It took only 30 minutes after the war began to realize those words were a lie. Those things are not *human*. Monsters that do not die even when hit in the head, chest, or limbs. George fired his rifle wildly, letting out a scream or a shout, he didn't know which.\n\n\"Shit! They're coming! Shit! Holy shit!\"\n\nThe Gehenna soldiers didn't stop even while being hit by bullets. A Gehenna girl with a fixed bayonet stabbed the chest of the screaming Hans repeatedly. Damn it. What holy war for the people. George squeezed his eyes shut and pulled the trigger repeatedly at the Gehenna girl tangled with Hans.\n\nThat only lasted a few seconds. George opened his eyes at the warm sensation felt in his side. Above the trench, a long-haired Gehenna girl was aiming a gun at him. No, the girl had already fired. George felt the world spinning as he fell face-first into the water pooled in the trench."
 HEU.flavor_event.50.a:0 "The nation will not remember his death."

 HEU.flavor_event.51.t:0 "Boss's Health"
 HEU.flavor_event.51.desc:0 "Aru lowered her head as she entered the worn-out tent clinic set up in the Pandemonium prisoner-of-war camp. She felt sorry for making the person she had captured examine her, and it was painful that she couldn't express that feeling with any words. But it couldn't be helped. On the day of the victory ceremony for occupying the center of Pandemonium, Aru performed a 'stunt' of kicking Mutsuki and running away to roll on the floor crying alone in front of countless officers.\n\nAfter the stunt at the victory ceremony, the military intended to force Aru to undergo a psychiatric evaluation. And the medical science of Pandemonium, the enemy country, was about a hundred years ahead of the local ones. Eventually, she was pushed into visiting the POW camp. A long process of interviews, psychological tests, and intelligence tests passed.\n\n\"Let's see. Severe self-criticism, insomnia, and continuous weight loss... And yet, you say you've never received treatment once.\"\n\nA student from the Gehenna Emergency Medicine Department, who ended up checking Aru's health right after coming out of the POW camp, let out a sigh and marked V's on the numerous check lines written on the document one by one.\n\n\"I didn't want to be a nuisance.\"\n\"Thanks to that, you caused an even bigger nuisance.\"\n\"......\"\n\"Depression and anxiety disorder. Because it was neglected for a long time, the symptoms have worsened significantly, and insomnia must have been severe, so how did you endure it?\"\n\"I'm at an age where I'm an adult too. I still don't know what an adult is, but I've learned this. Sufficient beer is a big help for falling asleep.\"\n\nAru spoke with a smirk, but the Emergency Medicine Department student did not laugh at her joke.\n\n\"If Section Manager Sena had heard that, she would have fired a bullet at your face. ......Don't skip the medicine I'm prescribing. It'll be much more helpful than beer.\""
 HEU.flavor_event.51.a:0 "The prescription was longer than Aru had imagined."

 HEU.flavor_event.52.t:0 "I Didn't Know"
 HEU.flavor_event.52.desc:0 "\"Boss, since when have you been relying on alcohol?\"\n\nOn a rainy day, in the Grand Ducal palace office. Kayoko came into Aru's office and took a seat. Aru hesitated for a moment before tossing the antidepressant pills prescribed at Gehenna into her mouth and swallowing them. Because there were so many pills, the swallow was dry even after pouring water.\n\n\"I don't know. Just since some point.\"\n\"Why didn't you consult me either.\"\n\"I'm a hard-boiled outlaw...\"\n\"You shouldn't say such nonsense.\"\n\nAt Kayoko's words, which coldly cut off Aru's, Aru let out a deep sigh.\n\n\"To me, you guys were more precious than *myself*. So I didn't want to see you guys cry because of me. Even when I was targeted with paint terror, you and Mutsuki were shouting and fighting each other. I couldn't bear it.\"\n\nKayoko's low sigh broke the silence.\n\n\"Honestly, I don't know what to do at a time like this, or how I can ease the Boss's suffering.\"\n\"Isn't knowing that what it means to be an adult?\"\n\nAru chuckled. \"Even though I myself am still wondering what an <adult> is. Isn't it someone who doesn't just age, but takes on a responsibility beyond their years? But becoming such a person was too hard for me. I couldn't stop Mutsuki from falling into madness for my sake, and I couldn't stop the bond between Kayoko and Mutsuki from breaking. Truly pathetic, right?\"\n\"At least I...... don't think the Boss is pathetic even now. There is no perfect person in this world. Not me, and not the Boss either.\""
 HEU.flavor_event.52.a:0 "Until late that night, Aru spent time with Kayoko."

 HEU.flavor_event.53.t:0 "I Am Not Wrong"
 HEU.flavor_event.53.desc:0 "\"It was for Aru-chan's sake... really... not even a bit, has that feeling changed...\"\n\nWith her head pressed against the window, Mutsuki squeezed her eyes shut. That look from Aru, as if she were looking at a stranger. And the sight of her kicking and knocking down her own self who was trying to hold Aru's hand and running away.\n\nWhere exactly did the needle start being threaded incorrectly? Mutsuki banged her forehead against the window repeatedly and wept silently."
 HEU.flavor_event.53.a:0 "Still... it was for Aru-chan's sake..."

 HEU.flavor_event.54.t:0 "Cigarette-shaped Chocolate"
 HEU.flavor_event.54.desc:0 "While Kayoko, with earphones in her ears, lightly twirled a cigarette between her fingers, Mutsuki slunk up from the side and waved her hand.\n\n\"Hey! Yo! Kayoko-chi! Have you finally started smoking? Ahaha-hat. Aru-chan won't like a woman who smells of cigarettes, you know?\"\n\n\"Sigh. What, is it Mutsuki-san?\"\n\"Eeeh. Still adding '-san'?\"\n\"I'm not mentally prepared to go back to the titles from our Kivotos days. And my feelings aren't all sorted out yet.\"\n\nKayoko said as she lightly held the cigarette in her mouth to melt it.\n\n\"And this, it's not actually a real cigarette, it's a cigarette chocolate... cigarette-shaped chocolate.\"\n\"...Eeeh. It is interesting! It seems to suit Kayoko-chan too!\"\n\"It's just. The vocalist of a rock band I like used to carry these cigarette chocolates around like an identity. I just thought of that. ...Since coming to this world from Kivotos, I haven't been able to listen to rock music to my heart's content.\"\n\n\"Since the locals don't even know what rock is... Ah! Come to think of it, I heard a new band was formed in Trinity? They're called *Sugar Rush* and they're apparently very talented! Kayoko-chan! Why don't we go listen to them live together as a way to reconcile?\"\n\n\"Me? With you?\"\n\n\"Wow. I'm really hurt.\"\n\"Fufu. It's a joke. Sure. ...It won't be bad to enjoy ourselves like back in Kivotos, for once in a long time.\""
 HEU.flavor_event.54.a:0 "Very gradually, their conflict begins to heal."

 HEU.flavor_event.55.t:0 "Original Intent"
 HEU.flavor_event.55.desc:0 "\"That's... Aru-sama. There was clearly an opportunity to become Queen, so is there a reason you chose to remain a Grand Duchess? A Queen is higher than a Duchess.\"\n\nListening to Haruka's common-sense question, Aru checked the remaining antidepressant pills in the bottle one by one. Although it seemed the terrible depression had vanished after all the commotion, Trinity's Sumi Serina had instructed her to continue taking the medicine for about another half a year.\n\n\"Well... the name *Grand Duchess* makes me not forget the memory of that day of the Grand Transfer. I have a desire not to change that name.\"\n\n\"So, um... it's like Aru-sama's own determination to maintain her original intent!\"\n\n\"Ahaha. Is that so? Yes. ...I guess it is. A long time has passed since we left Kivotos, but there are things that must not change from then until now.\""
 HEU.flavor_event.55.a:0 "Certainly"

 HEU.flavor_event.56.t:0 "Meeting with Marx"
 HEU.flavor_event.56.desc:0 "\"Honestly, I regret it. 'Become an adult first.' I didn't imbue that one sentence with such a deep meaning. ...I am not a Sensei. I am not someone who leads you all. I am just a doctor who treats patients one by one. Sometimes shouting that reactionaries should be hung from trees.\"\n\nKarl Marx laughed while smoking a cigar.\n\n\"Still, it's a relief you look healthy. You're not drinking things like poisoned coffee these days, right?\"\n\nAru slightly tilted the coffee in her mug. \"Why? Do you want to take a sip if you're suspicious?\"\n\"I'll pass. ...Well. Since I've seen you looking fine, I can finally return to being political rivals with a light heart. You as a feudal monarch, and I as a Marxist-Leninist dreaming of revolution.\"\n\"Don't hang me from a tree even if you win. I'm the person who saved your life twice, right?\"\n\"Haha. I hope you don't put me on the gallows one day either. Have a pleasant afternoon.\""
 HEU.flavor_event.56.a:0 "Yeah, have a pleasant afternoon."

 HEU.flavor_event.57.t:0 "Kronos Media Interview"
 HEU.flavor_event.57.desc:0 "Since the unrealistic event of Aru conquering both Gehenna and Trinity academies actually happened, it was natural for the foreign media to take notice. However, the fact that the first media outlet to visit was the famous Kronos School was not a pleasant matter. Aru also knew very well that Kronos School was not exactly a wholesome media outlet.\n\nKawaru Shinon thrust a microphone forward as soon as she sat down across from Aru. \"Aru-san! You've conquered both Gehenna and Trinity academies. Do you also intend to challenge for the position of General Student Council President?\"\n\nAru answered while spinning her pen, trying to look cool. \"The General Student Council President? That's someone who cowardly abandoned their seat and ran away as soon as the Grand Transfer occurred. There's no need to try and take the place of such a person. It's not hard-boiled.\"\n\n\"Yes. 'The General Student Council is an organization of those without value... This will be the headline...'\"\n\nI feel like a snipe at one person just expanded into a snipe at several people?\n\n\"Next question. Your relationship with the employees of Handyman 68 is known to be particularly devout. In particular, National Socialists often raise questions about Aru-san having somewhat inappropriate physical relationships with the employees.\"\n\nPuff. Aru let out a dry cough. What on earth is 'somewhat inappropriate physical relationship'! This isn't even beating around the bush. Aru tried to answer something, but because it was such a baffling question, the words didn't come out well.\n\n\"Me and those kids are just...\"\n\n\"Just? Are you lovers? Is there someone you like?\"\n\nOh, come on! The microphone was pushed right up to 3cm from Aru's lips. It seems there is no escaping this Kawaru Shinon's clutches..."
 HEU.flavor_event.57.a:0 "Of course, I love all the employees of Handyman. ...As friends!"
 HEU.flavor_event.57.b:0 "There is someone I love within Handyman. So what of it?"

 HEU.flavor_event.58.t:0 "Personal Letter from Prime Minister Joseph Bech"
 HEU.flavor_event.58.desc:0 "To Her Royal Highness Rikuhachima Aru,\n\nIt seems citizens are very interested in the news from the recent Kronos newspaper interview that Your Highness has someone in mind. However, please remember that Luxembourg is strictly a Catholic country and many citizens view such acts as sinful.\n\nPlease say that the recent Kronos media report was a simple slip of the tongue. Because of Your Highness's mistake, conservative groups have been protesting against *me* for days! It seems they're too scared to protest directly to Your Highness, but citizens are turning on megaphones in front of my house even at night and shouting, making it difficult to even lead a normal daily life.\n\nI know Your Highness doesn't trust me much. But I believe Your Highness surely isn't truly homosexual. Yes. Since the Kronos newspaper is trash, you probably wanted to play a prank because they made you mad.\n\nBut because of that prank, I am dying. No, maybe I'm already dead but just haven't realized it yet.\n\nEven while writing this letter, protesters have driven trucks in front of the Prime Minister's residence and are turning up the volume of their megaphones. I heard high-end Millennium-made megaphones were imported thanks to the 'Grand Transfer,' and I've experienced firsthand just how good the performance is this time.\n\nI apologize for the letter not following the formalities of an official document as I haven't been able to sleep even a wink for three days. But please understand the situation where I have no choice but to send such a letter, and please let me sleep at night.\n\nLet's live in a world where we coexist. I'm really begging you.\n\nFrom the Luxembourg Coalition Government Prime Minister's Residence, J. Bech."
 HEU.flavor_event.58.a:0 "Yeah, that was just a joke back then."
 HEU.flavor_event.58.b:0 "When you have insomnia, you sleep well with just a can of beer. It's from experience."

 HEU.flavor_event.59.t:0 "Proposal from the Federal Student Party"
 HEU.flavor_event.59.desc:0 "I received a baffling contact from the representative of the Federal Student Party. The Kivotos population was considering Aru's romance scandal as a kind of thrilling event. They are viewing this case as a type of 'entertainment.' The Federal Student Party hopes to use this scandal to make the Kivotos population more pro-government and simultaneously spread Kivotos's liberal culture more widely in Luxembourg. Of course, Aru, as a constitutional monarch, must remain neutral, but it was possible to at least listen to the Federal Student Party's opinion.\n\nThe Federal Student Party's proposal was simple. Issue an executive order. Not to make a law allowing same-sex marriage for everyone, but to allow only one person, Rikuhachima Aru, to marry someone of the same sex. Now that public interest in Aru's romance is growing, the Federal Student Party wanted to grow and utilize this case further.\n\nThe Federal Student Party conveyed a specific message that if the executive order is issued, word of mouth will spread among students of both academies, which will also raise the awareness of the Federal Student Party that brought up this proposal, and the scandal will be prolonged until Aru finds a marriage partner, making the general perception of Aru among Kivotos people more 'friendly.'\n\nIt seems to make sense... but really, truly, for real and not as a joke, does Aru have the heart to spend her life as a partner with someone from Handyman 68?"
 HEU.flavor_event.59.a:0 "No, no, this is not it, really not it."
 HEU.flavor_event.59.b:0 "...Implement the executive order."

 HEU.flavor_event.60.t:0 "Reconciliation with Everyone"
 HEU.flavor_event.60.desc:0 "Kayoko said. \"Back in Kivotos, we used to gather in the park and sleep rough sometimes...\"\n\n\"No, no. Don't you have any cool memories?! Why is it sleeping rough?!\"\n\n\"I also remember the Boss running around trying to get a loan because we ran out of money...\"\n\n\"Ugh... please think of a really cool memory...\"\n\nWhile sharing various small talk, Aru went out for a walk with the Handyman 68 employees. Although it was just a walk along the outskirts to visit the shrine she once came to pray at. Aru walked slowly through the pine forest with her hands behind her back.\n\n\"If, by some chance, an opportunity to return to Kivotos were given. What would you guys want to do?\"\n\nMutsuki chuckled. \"What's this, a quiz game?\"\n\n\"It's not a quiz... I just want to hear your honest thoughts.\"\n\n\"Whether it's Kivotos or Earth, I'll follow Aru-chan. I think everyone feels the same.\"\n\nAru turned around. Was it a given? Well, it was a story she didn't even need to ask. Perhaps a way to return to Kivotos will never be found in their lifetime. Or, maybe a smart student from Millennium will find a way decades later.\n\n\"I also felt that as long as I can be with you guys, the place doesn't matter. Besides. ...This is a place we protected together. Now, no matter who comes, we can't leave.\"\n\nUnlike when they were bickering at first, the four entered the shrine together, holding each other's hands. Now there would be no Kaitengers trying to smash the offertory box and steal the money, and they would be able to make a wish here with peace of mind.\n\nStanding in front of the shrine again after several years, Aru closed her eyes."
 HEU.flavor_event.60.a:0 "May everyone be happy with me."

 HEU.flavor_event.61.t:0 "For the Resurrection of the Greater German State"
 HEU.flavor_event.61.desc:0 "Adolf Hitler and the entire leadership of Deutschland disappeared suddenly while in Berlin during the 'Grand Transfer.' Isn't it suspicious? The Grand Transfer occurred extensively throughout Central Europe, yet only in Deutschland did the national leadership vanish entirely. Well, depending on how one defines 'vanished,' the entire Grand Ducal family of Luxembourg also vanished along with lead bullets.\n\nAnd now, gloriously, the Luxembourgish army has come to Luxembourg under the banner of Germanic ethnic unification. Damian Kratzenberg, mocked by communists as 'Luxembourg's last Nazi,' entered Munich, occupied by the Luxembourgish army, while wearing a bulletproof vest. The news that Munich, where Hitler's 'revolution' attempt occurred in 1923, had fallen, excited Kratzenberg.\n\nWalking through the streets of Munich while wearing a military cap with the white letters PRESS written on it, pretending to be a war correspondent, Kratzenberg thought of Rikuhachima Aru. That woman wouldn't have started this war truly for the 'unification of the Germanic people.' She probably had other purposes. But the important thing was that she gave Kratzenberg an opportunity. The resurrection of Greater German nationalism and National Socialism.\n\nKratzenberg opened the door of the cafe where he was told 'he' was. Kratzenberg intended to serve him as the next Führer of the reconstructed Deutschland. \"Herr Drexler?\"\n\nAnton Drexler. The founder of the National Socialist German Workers' Party and Hitler's old comrade. He must have sent a letter first to meet for the reconstruction of a great Deutschland, but his expression didn't look very bright. Drexler sipped coffee at a window seat and said.\n\n\"You've made a futile visit.\"\n\"Pardon? What do you mean by that.\"\n\"The Nazis failed. And I have no intention of following your madness.\"\n\nDrexler chuckled and stood up from his seat.\n\n\"Make me the next Führer? Exactly where? Do you still believe there is *superiority* in this people conquered by Trinity and Gehenna? I have realized that 'ethnicity' is vanity and futility. There are no superior or weak peoples in the world! If you still harbor the vain delusion of reconstructing the Greater German State, you should drop it even now...\"\n\n\"Coward!\"\n\nInfuriated, Kratzenberg impulsively pulled out a pistol and fired wildly at Drexler. A gun he had never fired at a person in his life. The bullet veered completely off target and accurately hit the back of the neck of a cafe employee who was washing dishes. People's screams rang out, and Kratzenberg, whose face had turned pale, fled the cafe behind Drexler's ridicule. 'Yes, that was a shot worthy of a brave leader of the people!'"
 HEU.flavor_event.61.a:0 "He couldn't even become an Austrian corporal."

 HEU.flavor_event.62.t:0 "Military Coup"
 HEU.flavor_event.62.desc:0 "Guillaume Konsbruck, a general in the Luxembourgish army, recalled the memory. The last time the atmosphere among the Luxembourgish military generals gathered was this grim was probably during the emergency joint chiefs of staff meeting on the day of the Grand Transfer. The cause was the demand of Asagi Mutsuki, who had brought in several Gehenna 'soldiers.'\n\nKonsbruck spoke in the most calm voice possible. \"So, to summarize and organize Asagi-yang's words, you are demanding that from now on, we follow your orders before those of General Émile Speller or Her Royal Highness Regent Rikuhachima Aru, and that the military budget reports sent to Speller-kyong and the reports sent to you be organized separately.\"\n\n\"Yep, yep! You're quite easy to talk to, mister.\"\n\nMaurice Stein, commander of the Diekirch military district, immediately jumped up from his seat.\n\n\"How dare a brat try to pull a coup here! To hand over military authority to a non-official who is merely an acquaintance of the Regent, there is no coward in our homeland who would follow that order—\"\n\nBang! Mutsuki pulled a pistol from her pocket and fired as if it were a chore. As the bullet accurately hit Stein's leg, he let out a groan and collapsed on the floor.\n\n\"Ah~ah~. Seriously. Do you think I came here to play games? ...Take this mister away. If you soak him in a psychiatric hospital for a while, his head might clear up a bit.\"\n\nKonsbruck watched his long-time superior, Commander Stein, who had even participated in the Great War 20 years ago, being dragged away like an object by Gehenna soldiers. A thought of 'I can't understand this' came before the emotion of 'fear.' Is this reality right now? Am I having a dream?\n\n\"Ufu-fu. I, you see, really, really, really, really love Aru-chan, okay? ...So if you fucking call this a *coup* against Aru-chan, you're really going to die. Got it?\"\n\nBang! The door Stein went out through was slammed shut. \"Aru-chan is too kind, so even if I create an opportunity for her to become a hero, she can't take it herself. So I'm saying let's create that opportunity together. Let's crush Gehenna and Trinity so Aru can stand on the heads of those vermin! So that the Regent you respect can become the liberator of the Germanic people, and the commoners on that well-off street can cheer just by seeing Aru-chan's poster! Hmm? I'm saying let's go the easy way, okay?\"\n\nIn the meeting room filled with fear, it was Konsbruck who broke the silence."
 HEU.flavor_event.62.a:0 "\"Understood. Then... what should we start with?\""

 HEU.flavor_event.63.t:0 "Germanic National Unification"
 HEU.flavor_event.63.desc:0 "Without Aru knowing, 'another' meeting room for Mutsuki was created in the military. Mutsuki entered the meeting room prepared in a separate space of the Ministry of Defense. The topic of today's meeting was public propaganda during the process of conquering Gehenna and Trinity.\n\n\"If we want to exalt Her Royal Highness Rikuhachima's name through Germanic national unification, the first thing needed is that the name of the unified homeland must be the Germanic State, not Germany.\"\n\n\"Reason?\"\n\n\"Right now in our Luxembourg, names like 'Germany' and 'Prussia' are words that symbolize National Socialists... in other words, Nazis. Before the Grand Transfer, no, even after it, National Socialists claimed that Luxembourg should be part of *Great Germany*, and especially recently, the Nazi party 'German National Movement' was founded.\"\n\nMutsuki pretended to yawn as if bored. \"Hmmmm. Boring. Summarize it in one line.\"\n\n\"The moment we claim to be the successor to Germany, there is a possibility that Her Royal Highness Rikuhachima will be framed as a Nazi.\"\n\nFramed as a Nazi. Only after that story came out did Mutsuki's expression become serious. This war had to be a war to make Aru a hero. Even if they used German nationalism as a tool, it was dangerous to get too deeply involved to the point of being called a Nazi.\n\nEspecially wasn't it the 'Nazis' who led racial discrimination against the Kivotos people after the Grand Transfer? Mutsuki nodded.\n\n\"Hmm. Good. Yeah. It's a simple story. When we start the war, let's only talk about *Germanic national integration*, and never use the word *German reunification*. Ethnicity is OK, nation is NO. This should be enough, right?\""
 HEU.flavor_event.63.a:0 "Konsbruck nodded."

 HEU.flavor_event.64.t:0 "Émile Speller's Suspicion"
 HEU.flavor_event.64.desc:0 "Émile Speller's rank was merely 'Gendarmerie Chief,' but due to the history and tradition where the Luxembourgish army was the Gendarmerie, he was performing the role of Joint Chiefs of Staff Chairperson (which does not legally exist in Luxembourg) both before and after the Grand Transfer.\n\nBecause of that, Speller could quickly notice the strange movements within the military. Maurice Stein, a veteran of the last Great War and a respected conservative, disappeared without any prior notice. He hadn't submitted a resignation either. In just one day, everyone was acting as if Commander Stein had never even *existed*.\n\nAfter having his loyal adjutant tail some generals, Speller could reach one conclusion.\n\n\"Asagi-yang is giving orders to the military at will and commanding soldiers as if they were her own.\"\n\nHandyman office. As soon as Speller made a one-on-one meeting with Aru, he urgently handed over a report. A photograph of Mutsuki, who legally has no military rank and is just Aru's friend, entering the Ministry of Defense while receiving salutes from military generals was inserted as evidence.\n\n\"Your Highness. This is a clear sign of treason, and Asagi-yang must be summoned separately and interrogated...\"\n\"She just received a salute, that's all.\"\n\nHowever, Aru quietly pulled out the photo and covered it. It was a mystery why Mutsuki was entering the Ministry of Defense alone, where she had no reason to go. But *with this alone*, it is not evidence enough to doubt her. At least Aru wanted to believe so.\n\n\"Mutsuki is a childhood friend from when we were kids. Even if Mutsuki is doing something I don't know about... would she go as far as treason?\"\n\nAru gave an awkward smile and continued. \"I don't want to fall into paranoia and doubt someone precious. ...It's clear Mutsuki-chan is hiding something from me, but I'll believe there's a reason for it.\""
 HEU.flavor_event.64.a:0 "Speller couldn't say anything."

 HEU.flavor_event.65.t:0 "Luxembourg's First Internet Site"
 HEU.flavor_event.65.desc:0 "In Kivotos, anyone could easily use computers, and anyone could easily use the internet. Since there were academies with outstanding scientific technology like Millennium even after the Grand Transfer, personal computers were still being mass-produced and released to the market... The problem was that the 'internet network' itself, which had been binding all of Kivotos until now, suffered a huge blow due to the loss of satellites and communication cables.\n\nHowever, Kivotos people in Luxembourg realized that even in this era that returned to a hundred years ago, the telephone network was densely configured by the locals... After a brief period of confusion, the internet was resurrected in the form of using dial-up modems. The place where the internet was first used was, of course, existing Kivotos sites, but locals were also rapidly grasping the value of this 'internet.' And the organization that moved first was the ruling Right Party.\n\nPrime Minister Joseph Bech proudly tapped the monitor of his Millennium-made PC. \"By gathering the most outstanding designers in our Luxembourg, we have opened the first domestic site, the *Right Party Official Homepage*! It's a shame we have to pay server fees to those damn Kivotos bastards, but more than that, we will be able to widely inform the patriotic citizens of Luxembourg about our party!\"\n\nPierre Dupon, a member of the Right Party, peered into the monitor with a look of surprise. Dupon, who belonged to the 'innovation faction' within the party, also had only a vague level of knowledge about this latest device called a personal computer. \"So you're saying with this small machine, we can communicate with everyone in the world... no, everyone reached by telephone lines! The technology of the Kivotos people is truly amazing. ...Well, let's look at our party's homepage first!\"\n\nBech nodded once and clicked the mouse. The internet window opened... and the Right Party official site appeared on the screen.\n\nThe site background was filled with a rainbow-colored gradient. The words 'Right Party' with a wavy effect swam on the site's main screen, and on the left and right of the site, German sentences like +Exterminate the Commies+ +Right Party and National Defense+ flickered and shone with a neon effect in bright red letters. A terrible design sense that would have made any Kivotos student scream, 'What kind of 90s aesthetic is this!' However, the members of parliament who looked into the internet for the first time burst into exclamations in unison.\n\n\"It's... truly fantastic!\"\n\"Yeah! This is innovation, this is technology!\"\n\"With this site alone, we'll increase party members tenfold! Haha!\"\n\nListening to the admiration of the members, Bech proudly stroked the monitor slowly."
 HEU.flavor_event.65.a:0 "\"I am proud that this site is the first site of the motherland! Thank you!\""

 HEU.flavor_event.66.t:0 "Finding a Job"
 HEU.flavor_event.66.desc:0 "There were thousands of academies in Kivotos. Not all of those academies survived intact after the Grand Transfer to maintain their statehood. Large academies like Gehenna, Trinity, and Millennium survived the chaos of the Grand Transfer, but hundreds of small-scale academies went bankrupt in an instant, unable to even restore the water and power grids that were cut right after the Grand Transfer. There was even a saying that Abydos High School was the only one that survived among schools with fewer than a thousand students.\n\n\"Could I at least do something like being a newspaper delivery person? Yes, please. Yes. ...Origin? I'm from Kivotos...\"\n\nTogawa Sakiko, who had been rejected even for part-time job applications several times just because she was from Kivotos, spoke with a trembling voice while holding the receiver. Even last week, she was rejected from even having interviews at fifteen shops. The Civil Rights Act prohibited discriminating against Kivotos people in employment, but it could be bypassed by saying something like 'we already hired someone else.' Isn't that how laws made through compromise with the vested interests usually are.\n\n\"If you're from Kivotos, you have good stamina, right? You'll have to go out for dawn delivery; is that okay?\"\n\nTherefore. This response, coming for the first time, was more than a joy; it was a shock to Sakiko. Sakiko bowed her head toward the person on the other end of the receiver and said in a loud voice.\n\n\"Yes! If you just let me, I'll even deliver newspapers to the other side of Europe!\"\n\"Haha. Nowadays, with the Civil Rights Act and whatnot, the world is gradually changing, isn't it? If you have the ability to work, we welcome you too. Come over for a simple interview.\"\n\nThe Civil Rights Act certainly didn't completely change the world for Kivotos people overnight. But... Sakiko thought in her heart that it seemed there were those who were gradually changing their minds just because the law was created."
 HEU.flavor_event.66.a:0 "The Right to Work"

 HEU.flavor_event.67.t:0 "The Country is Ruined!"
 HEU.flavor_event.67.desc:0 "Albert, a Luxembourgish policeman, wears a mask and sunglasses when he goes on patrol these days. It was to hide the expression made when seeing the disgusting things on the street. He wasn't talking about those girls with halos on their heads. They were at least at a level where they looked human even if they were a bit strange.\n\nThe truly unpleasant thing was when he saw a big fellow resembling... a polar bear directing traffic in the middle of downtown Luxembourg. Thanks to the Civil Rights Act and the well-regarded 'diversity' policy resulting from it, even demi-humans who came from Kivotos were able to get jobs. In particular, all public institutions in Luxembourg were overpainting the proud wallpaper of the motherland with the vomit of Christ wearing sparrow, cat, and bear heads.\n\nFuck diversity. Fuck minority rights. Fuck the goddamn political correctness of the Leninists.\n\nIn the first place, can 'those' even be seen as human? Wakamoto, the polar bear traffic cop, waved at him as if he had met a welcome friend. Albert muttered the words \"fucking bastard\" with his lips inside the mask and tried to step on the pedals again, but the oblivious Wakamoto waddled toward Albert.\n\n\"You seem to be working with a mask every day lately; did you catch a cold?\"\n\"No, well... it's just an allergy. I have an allergy.\"\n\nA fucking bastard allergy, that is. Albert roughly accepted Wakamoto's words and stepped hard on the pedals. He doesn't know how much longer he can endure living in this world created by Rikuhachima-fucking bastard-Aru and the commies."
 HEU.flavor_event.67.a:0 "And so another day passes."

 HEU.flavor_event.68.t:0 "Discussion on Luxembourg Succession Law"
 HEU.flavor_event.68.desc.a:0 "As time passed with Rikuhachima Aru having decided not to marry a local, serious discussions about the future of the House of Rikuhachima began in Luxembourg political circles. The most critical issue was that there was no successor to follow the House of Rikuhachima. For the Grand Ducal House of Luxembourg to be maintained even a century later, a day will come when a successor to the Grand Ducal throne is needed. Therefore, various discussions were held regarding 'post-Aru' Luxembourg in the distant future.\n\nThe most radical claim was put forward by the Luxembourg Communist Party. Party representative Zénon Bernard said, \"What the citizens supported through voting was Rikuhachima Aru's succession to the Grand Ducal position, not her sons and daughters becoming Grand Dukes,\" and claimed that after Rikuhachima Aru's death, the country's name should be changed to the 'Germanic Federal Republic' and a republican system established. Although this claim was considered disrespectful or even violent, there is no lack of arguments that it is the most realistic plan in a situation where Aru has no possibility of having children.\n\nAnother coalition party, the Radical Liberal Party, proposed introducing the 'Swedish model.' Taking as a precedent the case where King Karl XIII of Sweden adopted Bernadotte, a general of Napoleon, as his son and appointed him as the successor to the throne, the plan was for Aru to adopt a child among the legitimate noble families of the European continent. Although this method was criticized for the fact that the Swedish model was a very 'exceptional' succession process in Europe, it became a compromise supported even by opposition forces like the Right Party because it could maintain both the Germanic Union system and the Luxembourg Grand Ducal House until the next century.\n\nThe last was another 'radical' alternative claimed by the Federal Student Party. Adopting a successor for Rikuhachima Aru is necessary, but they don't need to be a human noble—with the help of scientific technology from Millennium Science School, an 'AI Aru' copying Rikuhachima Aru's personality should be created, and if the real Aru dies, her personality should be transplanted into the AI to succeed to the Grand Ducal throne.\n\nSince Aru is still in her early 20s, a Grand Duke 'after' her taking power would only happen in the 21st century. However, it will be necessary to decide on an alternative in advance. Ultimately, the final decision-maker is Aru."
 HEU.flavor_event.68.desc.b:0 "After Rikuhachima Aru's unconventional coming out and same-sex marriage, serious discussions about the future of the House of Rikuhachima began in Luxembourg political circles. The most critical issue was that there was no successor to follow the House of Rikuhachima. For the Grand Ducal House of Luxembourg to be maintained even a century later, a day will come when a successor to the Grand Ducal throne is needed. Therefore, various discussions were held regarding 'post-Aru' Luxembourg in the distant future.\n\nThe most radical claim was put forward by the Luxembourg Communist Party. Party representative Zénon Bernard said, \"What the citizens supported through voting was Rikuhachima Aru's succession to the Grand Ducal position, not her sons and daughters becoming Grand Dukes,\" and claimed that after Rikuhachima Aru's death, the country's name should be changed to the 'Germanic Federal Republic' and a republican system established. Although this claim was considered disrespectful or even violent, there is no lack of arguments that it is the most realistic plan in a situation where Aru has no possibility of having children.\n\nAnother coalition party, the Radical Liberal Party, proposed introducing the 'Swedish model.' Taking as a precedent the case where King Karl XIII of Sweden adopted Bernadotte, a general of Napoleon, as his son and appointed him as the successor to the throne, the plan was for Aru to adopt a child among the legitimate noble families of the European continent. Although this method was criticized for the fact that the Swedish model was a very 'exceptional' succession process in Europe, it became a compromise supported even by opposition forces like the Right Party because it could maintain both the Germanic Union system and the Luxembourg Grand Ducal House until the next century.\n\nThe last was another 'radical' alternative claimed by the Federal Student Party. Adopting a successor for Rikuhachima Aru is necessary, but they don't need to be a human noble—with the help of scientific technology from Millennium Science School, an 'AI Aru' copying Rikuhachima Aru's personality should be created, and if the real Aru dies, her personality should be transplanted into the AI to succeed to the Grand Ducal throne.\n\nSince Aru is still in her early 20s, a Grand Duke 'after' her taking power would only happen in the 21st century. However, it will be necessary to decide on an alternative in advance. Ultimately, the final decision-maker is Aru."
 HEU.flavor_event.68.a:0 "I am the last Grand Duchess. After that, it will become a republic."
 HEU.flavor_event.68.b:0 "...I will think seriously about the successor problem."

 HEU.flavor_event.69.t:0 "Succession Rights through Adoption"
 HEU.flavor_event.69.desc:0 "Due to Rikuhachima Aru's decision, 'adoption discussions' began, starting from old noble dynasties of various European countries including Belgium and the Netherlands, and even including the newly emerged noble family, the House of Bonaparte. Considering Aru's age in her early 20s, the actual date for the adoption to take place was decided as January 1, 1960.\n\nHowever, before that, it was necessary to find a noble family that agreed to the adoption problem. Consultations began with about 20 noble families, including both already perished dynasties and existing monarchical states, and several families are already showing interest in sending their blood relatives to the Germanic Union. It will take a long time of more than ten years to decide on one family, but regardless, we will remain as a monarchical state as we have been until now, and as we will be in the future."
 HEU.flavor_event.69.a:0 "Long live the Grand Ducal House!"

 HEU.flavor_event.70.t:0 "AI Aru Test Operation"
 HEU.flavor_event.70.desc:0 "A Millennium student explained to Haruka while turning over documents.\n\n\"So this is just a test run. After seeing the AI operating properly, we'll shut down the power again. It would be confusing if there were two Grand Dukes in one country. We'll perform annual server maintenance, but the actual operation will only be on the day Rikuhachima-yang dies.\"\n\"...That day, will be the next day the AI is turned on...?\"\n\"Well, yes. Probably 70-something years later? It's not a problem Igusa-san should worry about right now.\"\n\nA deep underground computer room in Eden that can withstand even nuclear attacks. Haruka passed through supercomputers where red lights flashed uneasily and stood in front of a monitor that filled one side of the wall. After 'Aru-sama' dies. Is it a day too far away? She wanted to think so, but she recalled Aru's cold wrist when she drank suicidal medicine in her coffee. Haruka felt her hands convulse and said in a low voice.\n\n\"Turn on the computer, please. ...I'll just look for a moment and leave.\"\n\nAn AI preparing for Aru's *death*. A computer that makes the memory of that day come back just by its existence. Haruka suppressed the urge to smash the computer monitor with a shotgun and waited for the monitor to light up. After a short static and a boot sound... not the 'office' created in the Luxembourg Grand Ducal Palace... but the real Handyman office of Kivotos appeared. From the 'One Evil a Day' calligraphy hanging on the wall to the positions of the sofa and the telephone. Everything was exactly as in Haruka's memory.\n\nSurprised, Haruka was about to say something when a graceful girl in a coat appeared in front of the camera filming the Handyman office. The shotgun held in Haruka's hand naturally slid down and fell to the floor. There stood Aru, looking exactly as she did when she first got the Handyman office, not the 'sharpened' Boss who is currently wounded, but the young novice Boss Aru who gave a pure smile toward herself who was being bullied.\n\n- Haruka! What, is that you, Haruka? Ufu-fu, have you finally fallen for the Boss's intelligent appearance?\n\n\"This, this is...\"\n\"There was a request from Rikuhachima-yang... to implement the personality of *that era* she lived in Kivotos. Yes. She is certainly about 10 years less adult-like than now.\"\n\n- What. Less adult-like. Who on earth do you think I am, someone who can easily solve any request? Right? Haruka? ...Haruka? Are you crying?\n\nIt was only a memory of a past that can never be returned to. The moment she saw the smile of that Aru she admired in those days, not the Aru who had been scarred through numerous incidents after the Grand Transfer. Haruka burst into tears and reached out her hand toward the unreachable beyond the monitor.\n\n\"...Yes. Truly, whatever kind of Aru-sama... you are a wonderful Aru-sama to me.\""
 HEU.flavor_event.70.a:0 "So, I don't want to say goodbye to the Aru-sama of Kivotos. ...Really."

 HEU.flavor_event.71.t:0 "68 Revolution with the Internet!"
 HEU.flavor_event.71.desc:0 "In Kivotos, anyone could easily use computers, and anyone could easily use the internet. Since there were academies with outstanding scientific technology like Millennium even after the Grand Transfer, personal computers were still being mass-produced and released to the market... The problem was that the 'internet network' itself, which had been binding all of Kivotos until now, suffered a huge blow due to the loss of satellites and communication cables.\n\nHowever, Kivotos people in Luxembourg realized that even in this era that returned to a hundred years ago, the telephone network was densely configured by the locals... After a brief period of confusion, the internet was resurrected in the form of using dial-up modems.\n\nVarious community sites began to appear, and our government decided to use more budget for the distribution of public computers so that both Kivotos people and locals can use the internet. Right now it's just a slow and expensive modem internet, but isn't it possible that as time passes, a complete broadband internet like in Kivotos will be resurrected? Of course, that will be invented faster by Millennium scientists than in Luxembourg."
 HEU.flavor_event.71.a:0 "Connect to Momochannel!"

 HEU.flavor_event.72.t:0 "Counter-Revolution with the Internet"
 HEU.flavor_event.72.desc:0 "Damian Kratzenberg, a pro-Nazi figure in Luxembourg, might be almost the only local fascist politician who wasn't purged amidst the madness of Aru's so-called '68 Revolution.' Fundamentally, the fact that his main job was a Greek teacher, not a professional politician, and that he conducted all political activities only in civic groups, created a way for Kratzenberg to survive the madness of those revolutionaries.\n\nRevolution. Kratzenberg surfed the Luxembourg internet sites with a home computer he just bought and read the internet posts of the Kivotos people. Is simply sharing funny pictures and showing off desserts, clothes, and accessories what they call a revolution? Since when did Luxembourgers agree to their revolution? No, the Kivotos people who came with the Grand Transfer and committed massacres now say they are 'superior' morally, so they will 'enlighten' the primitive locals?\n\n\"It's no different at all from when Lenin massacred and 'enlightened' Russian peasants. Yeah. Not different at all.\"\n\nKratzenberg closed the internet site irritably and bit a cigarette. Suddenly, Kratzenberg recalled the memory of his beloved wife, Lisa. In the confusion of the Grand Transfer, Lisa was at home. While Kratzenberg was halting Greek classes and hiding students in the gym, that poor woman feared if her husband would be killed by the Kivotos people. Yes.\n\nLisa ran out of her safe house to meet Kratzenberg. If she hadn't, she would still be alive. Lisa ran into Gehenna students throwing grenades at the city block before even crossing it. The day after the Grand Transfer, the only thing Kratzenberg could manage to find was one of her fingers wearing a wedding ring.\n\nThose who now try to teach morality and revolution to Kratzenberg were such children. Is it the teacher's role to forgive and accept that?"
 HEU.flavor_event.72.a:0 "Kratzenberg took out his wife's wedding ring from the drawer."

 HEU.flavor_event.73.t:0 "Opposing Revolution is Also Revolution"
 HEU.flavor_event.73.desc:0 "In Damian Kratzenberg's view, 90 percent of the things that came from Kivotos were complete trash, and 80 percent of Kivotos culture was a crude imitation of Japanese culture. But just one thing, this internet and computer, was to his liking. Unlike having to flip through paper books for materials at academic conferences like the German Literature Association, they could instantly check education information and papers from academies in various parts of Kivotos using the internet and BD.\n\nAnd one more thing, he also liked the thing called SNS—not for Kratzenberg to use, but to know how the Kivotos people lived. After Rikuhachima whatever's 68 Revolution, Nazis could no longer hold anti-government protests on the streets. But it was possible with the internet. Because you can't fire a trigger at a post written on the internet.\n\nHowever, Kratzenberg's identity must not be revealed on the internet. For the counter-revolution through the internet, Kratzenberg desperately studied the private lives of students from all Kivotos academies. He read SNS, checked BD, and even listened to the same classes as Kivotos students via the internet. He had to become more like a Kivotos person than the Kivotos people themselves—if so, Aru also wouldn't be able to know what kind of plot Kratzenberg was hatching.\n\n\"Damn. Voice changer? AI image synthesis? Even things like these exist?\"\n\nAfter completing enough study, Kratzenberg created a Momotalk account and made a fake account on an SNS site.\n\n\"Ayaka Nanami, a second-year at Trinity General School before the Grand Transfer, a member of the Going Home Club. She didn't have friends because she couldn't adapt to Trinity's aristocratic culture, and after the Grand Transfer, she emigrated to Luxembourg, disappointed by the political tyranny of the Pater faction. Before the Grand Transfer, her dream was to be an idol, and now she's considering becoming a virtual streamer. She likes Sisterhood outfits and has participated in cathedral masses a few times. Her favorite food is Shoyu Ramen...\"\n\nThere are really, truly, very many students in Kivotos academies. And since the computer network was broken by the Grand Transfer, even if a 'fake' student is created, there will be no way to investigate her background. Ayaka Nanami. This name will become his new identity to take down Aru."
 HEU.flavor_event.73.a:0 "Fight with the internet"

 HEU.flavor_event.74.t:0 "SNS This is Ayaka Nanami!!"
 HEU.flavor_event.74.desc:0 "- Account Description: Hello!! I am Ayaka Nanami, a 2nd year at Trinity General School!\n\n1.\nThere are many Gehenna kids here, and honestly, this 68 Revolution thing is way too much Gehenna style.\nThey massacred Luxembourgers themselves, and when the locals got pissed and acted in self-defense a few times, Aru's patience snapped.\n\n2.\nDissolving parliament and shooting, hey, even that airhead Makoto was elected, but your Aru doesn't even do that.\nYou're pretending to be morally superior, but in the end, aren't you guys the perpetrators?\n\nThis post has been reposted.\n\nGETOUTARU.\nI'm a local and honestly agree.\nHow is forcing a revolution we don't want on us any different from Bolshevism?\n\ncat0808.\nRikuhachima Aru thinks she's some great revolutionary,\nbut she probably doesn't even understand the revolution she's doing.\n\nRealSartre.\nThis is the French novelist Sartre. Nanami-san is equating the massacres of Gehenna with Aru-san's revolution.\nAru-san is a figure who strived to prevent massacres.\n\nAyakaNanami.\nI heard Sartre-sama's response, thank you.\nBut in the end, Aru also shot up local party headquarters, so what's different?"
 HEU.flavor_event.74.a:0 "The internet burns with debate..."

 HEU.flavor_event.75.t:0 "Damian-sensei"
 HEU.flavor_event.75.desc:0 "\"There is a difference between writing posts pretending to be a girl on the internet and speaking in a girl's voice in front of broadcasting equipment, acting 'cute' in front of viewers! I have pride too! Do you really think I'm a little girl?!\"\n\nEven though he shouted at Arona like that, she simply let Damian go. 'You can think about it for a few more days, Damian-sensei.' Arona said that.\n\n\"Sensei... The only person who called me by that name after the Grand Transfer was that girl.\"\n\nBefore the Grand Transfer, separately from the presidency of the German Literature Association, he had several disciples just from his time as a Greek lecturer to make a living. Well, it's in the past tense now. Greek lectures were canceled amidst the confusion of the 68 Revolution, and Kratzenberg hadn't had a proper job for several years.\n\nOn the way home, a drizzling rain fell in the Utnapishtim Special Zone where the Schale building was located.\n\nStanding at the outdoor train station and being hit by rain, Kratzenberg recalled the memory of the day of the Grand Transfer. The sound of girls' laughter approaching from outside and the sound of firing guns on full auto. Kratzenberg knelt with the students who were trembling and said. 'It'll be okay. If we just don't make a sound, those guys won't recognize us.'\n\nA frightened boy said this. 'If we're caught, will you protect us, Sensei?' Even knowing he certainly couldn't protect them, he nodded. 'Yes. I will protect you.'\n\nBecause that's the role of a teacher.\n\n\"Protect...\"\n\nA train entered the Utnapishtim Special Zone. On the side of the train, a glowing poster of Rikuhachima Aru is printed. <Toward the extermination of inferior culture and a new century with the new General Student Council President!>\n\nWho exactly is inferior and who is superior? Were those students who were crouched down, holding their breath and crying, hoping those haloed bastards wouldn't find them, inferior? Was the Greek culture that united Europeans for two thousand years inferior? If the world those students must grow up in is a place like this, if future students grow up thinking their own culture is inferior?\n\nIf he becomes a teacher who cannot protect his students, can he still call himself <Sensei> even then?\n\n\"Goddamn it!\"\n\nIgnoring the Kivotos people at the train station who were surprised, he ran back. Through the rainy path, he burst into the Federal Investigation Club building, whose exterior was half-torn and became a ruin, and grabbed the tablet in the office where rain leaked. Because he knew that was what he had to do."
 HEU.flavor_event.75.a:0 "\"Arona. That virtual streamer thing... how should I start it?\""

 HEU.flavor_event.76.t:0 "Question"
 HEU.flavor_event.76.desc:0 "\"Damian-sensei. What are you doing?\"\n\"Searching for a broadcast topic on the internet.\"\n\nSitting in front of the keyboard of the Craft Chamber, Damian poured whiskey into a glass. Since living in the Craft Chamber, where he didn't need to worry about others' gazes, the time Damian spent drinking during the day increased significantly. It wasn't a world where one could live while being sane, right? Even more so doing a schoolgirl virtual streamer.\n\nArona peeked at Damian's computer monitor from within the Shittim Chest. To Arona, Damian Kratzenberg was certainly not a *true* Sensei. He was a Nazi, spent his days soaked in alcohol, and didn't seem to have much desire to protect Kivotos students. But sharing the same time and space every day, a thought came to her—she wants to know about this person.\n\n\"Damian-sensei, is it true you were originally a Greek lecturer?\"\n\"...I was. Until the 'Grand Transfer.'\"\n\"Why Greek of all things? You're the president of the German Literature Association, so wouldn't it be more Nazi-like to teach German language and literature?\"\n\"I'm a National Socialist, not a Nazi, you brat. Use the official term.\"\n\nEven while speaking bluntly, Damian's expression brightened a lot as he recalled the days he taught students.\n\n\"Greece is the land that is like the parent of all European culture. All civilizations of Europe, including the Roman Empire, owe a debt to the ancient Greeks. If you want to know about true European civilization history, you need to learn Greek. From Aristotle to Plato, how many things did they achieve? Even if Kivotos has a great history and culture, we also have civilization and historical traditions. ...Greek is a weapon to know that history. A weapon to protect oneself.\"\n\"Wow. It's the first time I've seen Sensei talk this long.\"\n\"Arona-yang. How about you also learn Greek this time? I'm willing to teach you if necessary.\"\n\nArona pondered for a moment and then laughed."
 HEU.flavor_event.76.a:0 "\"I think it would be hard to make Sensei even busier.\""

 HEU.flavor_event.77.t:0 "Judeo-Bolshevik Capitalist"
 HEU.flavor_event.77.desc:0 "That evening, Damian, who was preparing a broadcast plan, released his hands from the keyboard with a exhausted expression. He had already spent time from morning to afternoon just organizing broadcast materials and checking scripts. It was time for his accumulated fatigue to reach a breaking point.\n\n\"Damian-sensei. How about taking a break? At this rate, you won't even be able to do the evening broadcast.\"\n\"Yeah. ...If I can't even do the broadcast, everything is finished. ...Let me get some alcohol for a moment.\"\n\"Sen-sei! Do you know how many bottles of alcohol you drink a day? If you can't broadcast because you're wasted, I can't take responsibility.\"\n\nDamian just laughed at Arona's words and plopped down on the sofa.\n\n\"I don't listen to Kivotos women. Doing what I want is my creed.\"\n\"Eugh... do whatever you want. At this rate, you'll catch a disease and leave early.\"\n\nAs Arona grumbled and sat on the desk in the monitor, Damian asked as if something suddenly occurred to him.\n\n\"By the way, about that Rikuhachima Aru.\"\n\"Yes?\"\n\"I think Rikuhachima is like a descendant of Satan arranged by the devil to intentionally ruin Luxembourg. ...In my opinion, I suspect that woman is a Judeo-Bolshevik capitalist.\"\n\nArona, who was looking at Damian holding a glass with a serious expression for a few seconds, suddenly let out a deep sigh that seemed like the ground was sinking.\n\n\"No, that, um. Damian-sensei.\""
 HEU.flavor_event.77.a:0 "\"If you truly believe a Communist Capitalist is possible... I think it would be better for you to just hang yourself, Sensei.\""

 HEU.flavor_event.78.t:0 "Worry"
 HEU.flavor_event.78.desc:0 "Damian Kratzenberg's broadcast—the Ayaka Nanami channel—was gaining popularity, but Arona was still full of worry. Aru's regime showed no signs of collapsing yet. Anti-establishment residents were increasing, but there were also many members of the public who supported Aru. And external enemies threatening Kivotos were still present. If Aru wasn't replaced by Arona soon, all of Kivotos might be destroyed by evil enemies, like Gematria or Decagrammaton.\n\nAnd one more thing, a point of worry lately is... Damian's weight has been visibly decreasing. Since he drinks alcohol almost every day, he should have a beer belly, but Damian's weight seemed to have dropped by about 10kg compared to when she first met him at Schale. He prepares for internet broadcasts from morning every day and repeats communicating with the public from evening to midnight. Since he is doing consecutive broadcasts without resting for even a single day, she was worried his body might be breaking down.\n\n'No. This person isn't even a *real* Kivotos Sensei anyway. ...He's just a Nazi talking about Judeo-Bolshevik capitalists and whatnot, someone I don't need to worry about.'\n\nArona thought so, yet she couldn't stop worrying about Damian, who sat in the corner of the sofa and stroked his dead wife's wedding ring with his fingertips. He might not be a good human. He might be someone who can't even be a model for others. But... it didn't seem like he had committed a sin great enough to deserve being in this situation."
 HEU.flavor_event.78.a:0 "Perhaps she had placed too great a shackle on him. That thought occurred to her."

 HEU.flavor_event.79.t:0 "Teacher"
 HEU.flavor_event.79.desc:0 "\"Damian-sensei, if you succeed in ousting Rikuhachima Aru, what kind of work do you want to do after that?\"\n\n\"What is it. Is it some kind of plan related to the next broadcast?\"\n\n\"I'm not only talking about internet streaming. I just wanted to loosen the atmosphere a bit.\"\n\n\"Yeah. Haha. For a kid trapped in a monitor, you have good social skills. Students like you often make many friends in the lecture hall. ...After Aru is ousted. Actually, I haven't thought about it.\"\n\n\"Since you were originally a Greek lecturer, how about becoming a teacher again? ...Since you're a Nazi mister, you shouldn't do politics though.\"\n\n\"Hey brat. I told you it's National Socialism, not Nazi. Well, whatever. I don't think I'm a person very suited to being a teacher.\"\n\n\"Why?\"\n\n\"Certainly, a teacher is not a god or a savior. You can't make students' problems into something that *didn't exist*. But at least if you're a teacher, shouldn't you be a person who can protect my students and help them move toward a good future. ...But was I such a teacher. If you ask if I was a teacher who created a future for the children I taught... I don't think that was the case. What did I do during the Grand Transfer? I did nothing but tremble along with my students while hiding in the school. I couldn't give those children courage... and... I entered this place saying I wanted to become dignified as a <Teacher>, but I still haven't achieved anything. Subscribers? Donations? Those increased a fucking lot. But does that bring back the children who died that day! Is me holding a bit of money the same as protecting students? It's not like that...\"\n\n\"...\"\n\n\"Sorry. Arona. Just. ...When I think of the Grand Transfer, my words get a bit rough.\""
 HEU.flavor_event.79.a:0 "\"No. I'm sorry for making you recall a painful memory.\""

 HEU.flavor_event.80.t:0 "Health"
 HEU.flavor_event.80.desc:0 "\"Cough! Cough! ...Ah. Damn it.\"\n\nClothes stained with blood from hemoptysis. Blood was seen gushing out along his jaw. At first, he turned his eyes away from reality, thinking it was a phenomenon... caused by accumulated fatigue. Naturally, where would there be a person who coughs up blood because fatigue has accumulated? Damian Kratzenberg was dying.\n\n\"It's terminal liver cancer. ...To be honest, with modern medicine, there is absolutely no prescription I can give other than painkillers.\"\n\nA human doctor in Luxembourg City and a Kivotos doctor in the D.U. district gave the same diagnosis. Liver cancer. ...The alcohol he had been drinking every day since the Grand Transfer was the cause. At the Kivotos-affiliated hospital, they said they could extend his life further through life-sustaining treatment if he underwent admission procedures. But would there be meaning in a life extended that way? He wouldn't even be able to broadcast as Ayaka Nanami anymore.\n\n\"...That's how it turned out.\"\n\nOn the day he returned to Schale, Damian handed the comprehensive checkup results to Arona. He saw Arona's expression quickly hardening.\n\n\"Sensei. This is...\"\n\"Our broadcast, it seems we won't be able to do it much longer.\"\n\"...Sensei.\"\n\"But the task of bringing down the Rikuhachima government shouldn't stop here. I should do a retirement broadcast while I'm still in a state to do so. After that... Arona. Can you take over my part and do the internet broadcasts?\"\n\nSince she met him until now, the longest silence passed. He saw tears welling in Arona's eyes.\n\n\"What is this. Cancer out of nowhere. It's truly too much.\""
 HEU.flavor_event.80.a:0 "While Arona was sobbing, Damian plopped down on the sofa."

 HEU.flavor_event.81.t:0 "Do an Internet Broadcast?!"
 HEU.flavor_event.81.desc:0 "\"Ahaha-hat! Virtual streamer?! You're going to oust Aru-chan with that? That's really funny!\"\n\nWhile the four members of Handyman watched Ayaka Nanami's broadcast, which already had an enormous number of views, Mutsuki laughed until her stomach hurt, looking at the 2D character tilting its head left and right on the screen. Mutsuki might find this situation funny. But to Aru, it was more like... a situation where her head was turning white. A political rival from Trinity? Fighting against her using the internet? She had never dealt with such an opponent in Kivotos.\n\nAru didn't want to show that she was flustered, so she intentionally crossed her arms and moved the focus of the conversation to Kayoko. \"Section Manager Kayoko. Is there anything you know about this fellow? Explain in detail.\"\n\"...Sigh. Actually, the time Ayaka started active on the internet was quite a while ago. At first, it was just level of posting messages insulting the Boss on SNS. Well, our Boss is someone who requires a lot of care. It's not strange for one person who dislikes Aru to appear in Trinity.\"\n\"Then is it true that Ayaka is from Trinity?\"\n\"It seems so to me. She seemed to know a lot about Trinity since she started SNS. Also, Trinity hates Gehenna. The important thing is a different problem. How to deal with this virtual streamer.\"\n\nHaruka scratched her cheek.\n\n\"Come to think of it, this person. Isn't their voice strangely similar to Aru-sama's? It's as if Aru-sama is broadcasting...\"\n\"There's no way I would do a broadcast insulting myself! If it was a broadcast advocating for me, that's another story!\"\n\nAt that moment, Mutsuki clapped her hands.\n\n\"Right! Aru-chan can just broadcast directly!\"\n\"...What?\"\n\"Responding to an internet broadcast with an internet broadcast! Not virtual, but doing a real internet broadcast! The name will be 'Playful Straight Channel'! Ufu-fu. What do you think? Aru-chan. Competing broadcast against broadcast. Wouldn't it be fun?\""
 HEU.flavor_event.81.a:0 "Where did the name Playful Straight come from?!"

 HEU.flavor_event.82.t:0 "Rikuhachima Aru Debut Broadcast"
 HEU.flavor_event.82.desc:0 "\"He... Hello. Everyone. I am Rikuhachima... Aru, the president of Handyman 68, the regent of the Grand Duchy of Luxembourg, and the General Student Council President of Kivotos. Um, well, I've started internet broadcasting from today. Please support the Playful Straight Channel a lot...\"\n\n\n-Look at her voice trembling ㅋㅋㅋㅋ\n- The job title is long as hell ㅋㅋㅋㅋㅋㅋㅋ Are you Cherino?\n- Whatever, just take your clothes off for now\n- Stop shaking and show us your chest\n- Is it really Aru? The General Student Council President is streaming? Kivotos is truly ruined ㅋㅋㅋㅋ\n- The great sin,,, of dissolving,,, the Right Party,,, the Lord will not forgive,,, go to hell, you bitch,,,,\n\n\"...What! What's with this reaction! It's my first time on a nationwide broadcast, so I can be nervous! Hey! Who's the one who chatted to take my clothes off! Do you want me to land a headshot on you?\"\n\n- Immediate scolding begins ㅋㅋㅋㅋ\n- Headshot ㅇㅈㄹ ㅋㅋ Try tracking my IP\n- So why aren't you stripping??????\n\nFirst broadcast after debut. She thought it would be a bit chaotic, but the chat room where countless chats were scrolling up was truly chaos itself. In some sense, it was like Gehenna implemented on the internet.\n\nI want to quit everything. When Aru was gradually feeling such a desire, Haruka slunk up from behind and peered at the broadcast chat. ...A short silence. Haruka, whose expression had hardened, quietly took out the shotgun hanging in the office.\n\n\"Aru-sama. Um, I'll go kill all the broadcast viewers. Um, I'll work hard...\"\n\"No! Hey! Haruka! Wait! Stop! Aaaak! I really hate internet broadcasting!!!!\""
 HEU.flavor_event.82.a:0 "...The debut broadcast was a huge hit."

 HEU.flavor_event.83.t:0 "Ayaka Nanami Background Investigation"
 HEU.flavor_event.83.desc:0 "Is Ayaka Nanami really a Trinity student? If so, why is she biting at Aru as if to kill her? Is it because true Gehenna hatred is like Trinity's identity? Due to various such reasons, Aru requested a background investigation on Ayaka Nanami. Kayoko was in charge of the investigation.\n\n\"I couldn't find much information. There are many reasons to think she's a Trinity student in that she knows Trinity's culture well. But it's suspicious that there are no Trinity students who say they were close to Ayaka Nanami or know her. ...Of course, Ayaka herself is saying she was in the Going Home Club and couldn't make friends.\"\n\n\"In the end, it's like she might be a real Trinity student... or might not be.\"\n\"Sigh. Regardless, it'll be difficult to meet Ayaka herself offline. Since she is strictly active only on the internet, there's no way for the Boss to go find her. ...As expected, responding via the internet is the only way.\"\n\nRespond via the internet. So that means the only solution is to do more of this painful internet broadcasting. Aru felt her head throbbing and let out a sigh.\n\n\"Understood. Instead, Kayoko, can you take over managing the chat room for me? I can't handle it alone...\"\n\"What about Mutsuki or Haruka?\"\n\"Mutsuki just laughs even when seeing malicious comments because they're funny, and Haruka gets all worked up saying she'll shoot everyone. I absolutely can't use them as managers.\"\n\nRight. This is Handyman. Kayoko nodded while unable to hide her annoyed expression."
 HEU.flavor_event.83.a:0 "\"Can't be helped. This isn't just Aru's broadcast, but all of our broadcast. I'll help.\""

 HEU.flavor_event.84.t:0 "Sleep Stream"
 HEU.flavor_event.84.desc:0 "Mumble mumble yawn mumble... I am... the strongest outlaw in Kivotos... Ufu-fu... Yes. Section Manager Hina, if you kowtow harder, I'll at least spare your life. Fufu-fu... Mumble...\n\n- Is it real that Aru is asleep even though the live broadcast started?\n- She set a scheduled broadcast and passed out\n- ㅋㅋㅋㅋㅋㅋㅋㅋㅋ\n- Wow, look at her chest rising like a rocket while lying on the sofa\n\nMumble... <Beep beep beep!> Hmm, uh. Uh-oh. <Beep beep beep!> What. A call? Uh? Kayoko? What. I'm sleepy. If I sleep for a moment... Huh? Uh-uh-uh? The broadcast is on? I set a scheduled broadcast?!?!? Eeeeee!!!!!\n\n- ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ\n- General Student Council President (provisional)\n- The country is ruined\n- Stop, everyone! This is a no-count, no-count! Hold on, just a moment. Let me go wash my face! Hey! Everything until now was a no-count!!!!"
 HEU.flavor_event.84.a:0 "Who on earth set the scheduled broadcast?!?!"

 HEU.flavor_event.85.t:0 "War with [GEI.GetName]"
 HEU.flavor_event.85.desc:0 "- Hello. I am Rikuhachima Aru, the owner of the Playful Straight Channel.\n\n- Hello everyone! This is the Ayaka Nanami Channel!\n\n- ...To fight against the threat of [GEI.GetName], the General Student Council will strive for the rights of both Kivotos and humanity using any method.\n\n- The General Student Council says they 'strive for everyone's rights,' but can Handyman, who shot at their own citizens, the Luxembourgers, win against an external enemy like the Chroma? Isn't a new wartime leader needed right now?\n\n- Everyone, please trust me. No, please trust everyone in the General Student Council.\n\n- Never trust Rikuhachima Aru. No matter what instructions the government gives, you don't need to follow them!\n\n- Although I talked about being a hard-boiled outlaw or 'One Evil a Day'... Still, now I want to protect everyone here as the General Student Council President and move toward the future together. I will absolutely not lose. The General Student Council and the Luxembourg Prime Minister's Office will unite and dispatch all the armies that can be mobilized to defeat the Chroma and protect the Earth... and Kivotos.\n\n- I know there are those who criticize me for dividing national opinion in a wartime situation. But to truly protect the Earth and Kivotos, a *real* General Student Council President is needed. Let's move toward the future together. I, Ayaka Nanami, am standing here to protect you all."
 HEU.flavor_event.85.a:0 "Two wartime broadcasts were transmitted simultaneously"

 HEU.flavor_event.86.t:0 "Beyond 2D to 3D!"
 HEU.flavor_event.86.desc:0 "\"Damian-sensei, while producing new equipment using the Craft Chamber this time... we've become able to do a full 3D broadcast using motion capture! Ah. I've also perfectly implemented the Ayaka Nanami modeling for Damian-sensei. From now on, you'll be conducting 3D broadcasts.\"\n\nDamian, who was drinking canned beer, laughed as if it were absurd.\n\n\"Motion capture. So you're saying from now on, I have to do internet broadcasts while even moving my arms like a schoolgirl in front of the monitor, is that it?\"\n\"The sight of Damian-sensei in such a state. I also want to see it a bit.\"\n\"Hey. You're laughing, aren't you.\"\n\"Eeeh. I didn't laugh. ...Pffft.\"\n\"Hey. You laughed!\"\n\nDamian, who was baffled, tried to throw the empty beer can into the Shittim Chest, but soon gave a hollow laugh and placed the beer on the table. Well, since he had already decided to discard 'old-fashioned' thoughts like pride as a man. The important thing was the task of defeating Rikuhachima Aru and opening a 'new era' for his future students. For that, he could endure any amount of shame."
 HEU.flavor_event.86.a:0 "But can I really not do the motion capture, for real..."

 HEU.flavor_event.87.t:0 "Eden Decision and SNS"
 HEU.flavor_event.87.desc:0 "- Account Description: Hello!! I am Ayaka Nanami, a 2nd year at Trinity General School!\n\n1.\nThis time Rikuhachima Aru has finally decided to face off against Trinity.\nHonestly, anyone who thinks Aru will win?\n\n2.\nBecause Aru is doing some so-called 68 Revolution\nShe's made a mess of Luxembourg, so can the soldiers even fight properly?\n\n3.\nI think Aru stepping down even now\nis the only way there's even a 1 percent chance of Luxembourg surviving."
 HEU.flavor_event.87.a:0 "...This post became a subject of great controversy"

 HEU.flavor_event.88.t:0 "Pandemonium Defeat and SNS"
 HEU.flavor_event.88.desc:0 "- Account Description: Hello!! I am Ayaka Nanami, a 2nd year at Trinity General School!\n\n1.\nI told you last time that Luxembourg under Rikuhachima's rule would lose, right?\nThe result is coming out now ㅋㅋ\n\n2.\nBefore Luxembourg is truly destroyed\nJust step down quietly now, your Pandemonium is dead too"
 HEU.flavor_event.88.a:0 "...This post became a subject of great controversy"

 HEU.flavor_event.89.t:0 "68 Revolution Anarchist Riot"
 HEU.flavor_event.89.desc:0 "Three illegalism (criminalism) anarchists composed of Algerian-French immigrants were killed by local police while trying to commit a bank robbery in Southern Differdange today. The French anarchists, who wore masks with numbers written on their heads, had emigrated to Luxembourg after being inspired by the liberal ideas of the 68 Revolution, and they were reported to have followed illegalism ideology, which claims that to achieve an ideal anarchist society, the property of the rich must be seized by the poor through violence.\n\nThe anarchists killed two bank employees using Kivotos-made firearms that seemed to have been smuggled from the Valkyrie Police Academy and fought a siege against the responding local police, but were all killed by the Luxembourg police when their escape route was blocked.\n\nThis incident was heavily reported by major Luxembourgish media outlets because it was the first social crime committed by local humans, not Kivotos people, among those who emigrated after being inspired by the ideals of the 68 Revolution. The Rikuhachima government made no comment on this incident, but the Differdange police chief had a cynical interview about anarchism, saying, 'Violence can never be justified under any psychopathic ideology.'"
 HEU.flavor_event.89.a:0 "So why did the bank robbers write numbers on their masks?"

 HEU.flavor_event.90.t:0 "Official Dissolution of the Prefect Team"
 HEU.flavor_event.90.desc:0 "\"This is an impossible tyranny! How dare some criminal-like pseudo-club that isn't even Pandemonium...!\"\n\nAmau Ako shouted and stomped her feet at the Luxembourg police who came to take over all equipment and documents of the Prefect Team, but it was a fact that the Prefect Team had been defeated by [HEU.GetName]. No matter how much they were not Pandemonium, the actual authority to decide the existence of the Prefect Team lay with them.\n\nAnd considering the ill-will between Handyman 68 and the Prefect Team passed down from Kivotos... it was a clear fact that they would not leave the Prefect Team organization intact. She got angry and grabbed police officials to plead, but Ako ultimately had no choice but to admit that she had no way to stop the dissolution of the Prefect Team.\n\n\"I'm sorry... I...\"\n\nThe empty Prefect Team office where everything was taken. Ako sat on the floor and thought of the face of the person she admired most, and the face of Sorasaki Hina, whom she hadn't seen even once since the Prefect Team was collapsed by Handyman 68."
 HEU.flavor_event.90.a:0 "\"I should have stopped them...\""

 HEU.flavor_event.91.t:0 "Reorganization of Prefect Team into Justice Task Force"
 HEU.flavor_event.91.desc:0 "\"This is an impossible tyranny! How dare some criminal-like pseudo-club that isn't even Pandemonium...!\"\n\nAmau Ako shouted and stomped her feet at the Pandemonium officers who became Handyman's puppets, but it was a fact that the Prefect Team had been defeated by [HEU.GetName]. The Prefect Team is maintained. On one condition. ...On the condition of changing the name to the 'Justice Task Force.'\n\nNo budget cuts, no dissolution of the department. The Prefect Team was able to continue the same life in Gehenna Academy on the condition of using the same name as the security organization of Trinity, which they hated most. It was also the highest-level 'political retaliation' suited to the personality of Aru, who claims to be hard-boiled but has a somewhat soft character.\n\n\"I think it's much better than being dissolved, but...\"\n\nThe Justice Task Force armband for Amau Ako was delivered as if mocking her. And a handwritten letter from Asagi Mutsuki was enclosed together, which said, 'It's a gift of affection! :)'. It was more humiliating than when she received a collar with the scribble 'The Prefect Team Leader's Dog' on it."
 HEU.flavor_event.91.a:0 "\"Waaaah! Exactly what about this is a gift of affection!\""

 HEU.flavor_event.92.t:0 "Sorasaki Hina Visit"
 HEU.flavor_event.92.desc:0 "After Mutsuki's military coup, it was impossible for Aru, who lost all military power, to leave the capital freely. Regardless, Aru arrived in Southern Gehenna after receiving 'permission' from Mutsuki to personally decide the disciplinary actions for the Prefect Team officers.\n\n\"Back in Kivotos, my hands used to tremble just by hearing the words Prefect Team Leader.\"\n\nAru laughed awkwardly as she walked along the main street of Gehenna. Now that half of her vision had disappeared due to eye extraction and a permanent disability remained in her right arm, she could no longer be afraid even if she recalled the name Sorasaki Hina. Because she had learned that the small hammer of an adult with ill-will is much scarier than the 'Ish-bosheth' of the Gehenna Prefect Team Leader who acts for others.\n\nHina had never appeared in public since Gehenna was 'reunified.' She hadn't come to the Prefect Team either, and was said to be staying only in her own home. She was secretly envious. Because she had been able to lay down that heavy burden and take a rest.\n\nAru drank canned beer while moving her right arm, which trembled just by holding a can, on her way to Hina's house. She didn't really want to burst into the house of Hina, who had lost all power, and talk about 'discipline.' Just.\n\nAru, who had constantly strived amidst repeated frustrations and pain, just wanted to ask an even more outstanding superhuman than herself how she could endure the pain and hold out in Kivotos."
 HEU.flavor_event.92.a:0 "\"Hina-san, are you inside?\""

 HEU.flavor_event.93.t:0 "Beyond Expectations"
 HEU.flavor_event.93.desc:0 "To Rikuhachima Aru during her Kivotos days—what kind of existence was Sorasaki Hina? Rival... she was too different in skill to think of her as that. Yes. She was an enemy with *Hard-boiled* nature and true charisma that Aru didn't have. Someone she thought she wanted to defeat someday if Handyman 68 grew, an opponent who made her have such competitive spirit while simultaneously making her break into a cold sweat and her back get wet if they truly had to fight.\n\nA long time has passed since the Grand Transfer. Aru has changed from a naive girl pursuing hard-boiled to a foolish alcoholic adult who doesn't even know what it means to 'take responsibility for others.' But at least Sorasaki Hina had to be different. To Aru, Hina was someone she wanted to catch up to someday... a greatest enemy she was afraid of because she was strong, but where she wanted to reach someday.\n\nTherefore.\n\nAru could not admit that this dazed woman with disheveled hair, wearing pajamas, and looking like a hollow person was... Sorasaki Hina.\n\n\"...What's with this state. Hina-san.\"\n\"The Prefect Team lost. I thought if I took responsibility and worked hard, no matter how hard it was, with will... if I worked hard to be a model for everyone... it would work. I ruined everything. I... ruined... everything.\"\n\nNo.\nThe meeting Rikuhachima Aru imagined was not like this. She wanted Hina to grab the collar of the loser Aru, who worked hard with responsibility but failed, and shout loudly. To stand more dignified if she was the criminal of Gehenna who beat her, or to take responsibility somehow. ...She wanted to hear such a rebuke. Because it was too hard.\n\nBut the Hina now was different. Looking like she had fallen into a deep abyss the same as Aru. No, deeper than Aru."
 HEU.flavor_event.93.a:0 "\"...I'm going back. I... expected more from you...\""
 HEU.flavor_event.93.b:0 "Aru fired her pistol into the ceiling just like that."

 HEU.flavor_event.94.t:0 "Duel"
 HEU.flavor_event.94.desc:0 "Sorasaki Hina still remembered Rikuhachima Aru from her Kivotos days. No, there was no way she could not remember. The TOP 3 troublemakers for the Prefect Team. 1st, Hot Springs Development Department. 2nd, Gourmet Research Society. And Aru was the dummy whose priority was a bit lower than those two.\n\nAnd several years have passed. Aru, who has sharp eyes and is worn out and exhausted, unable to find the clumsy appearance from her Kivotos days, held a pistol.\n\nThanks to the data gathered by the intelligence department, she knew enough about Aru's current state. Her right arm was wrecked, so her specialty, the sniper rifle, was sealed. After developing a visual impairment, she lost her depth perception, so her shooting skills were halved. Additionally, she had depression and alcoholism. The current Aru would fall within 10 seconds even if she fought against her Kivotos self. Then why, for what reason, did she demand such a meaningless duel. While being the winner. When she's in a position to do anything to herself, the loser.\n\n\"If you're standing there dazed, I'll shoot first.\"\n\nBang! Aru's bullet hit the roof far from Hina, as if it were natural. \"Ha, holy shit.\" Aru gave a hollow laugh and charged. It seemed she intended to settle it at close range.\n\n\"I still don't understand you.\"\n\nHina raised her machine gun and fired her specialty, 'Ish-bosheth.' The purple bullets spit fire and wrapped around the entire roof. First, the pistol fell, and she collapsed, staggered.\n\n'No way... is she dead...!'\n\nA panicked Hina caught Aru who was about to roll off. Whoosh! The two who fell together along the roof slope landed in the backyard of Hina's mansion. She smiled broadly in Hina's arms and said nonchalantly."
 HEU.flavor_event.94.a:0 "\"...What. You can still do it well if you want to.\""

 HEU.flavor_event.95.t:0 "...Duel"
 HEU.flavor_event.95.desc:0 "Even though it's a world where mysteries have weakened and it's easier to die. Aru still didn't die. Although her ribs were broken and her entire upper body from face to waist was covered in bruises.\n\nAru lay on Hina's bed and stared blankly at the ceiling. How should I explain this to the others in Handyman? Should I say I was attacked by anti-government guerrillas.\n\nHina pulled a chair and sat next to Aru.\n\n\"What on earth are you up to?\"\n\"Suicide attempt. An outlaw fighting a cowboy and dying. Isn't that perfectly hard-boiled?\"\n\"...Have you lost your mind?\"\n\"Speaking from a medical perspective, I'm suffering from depression, so I'm in a bit of a crazy state. As expected of the Prefect Team Leader.\"\n\n\"Listen. I tried various things to somehow change the world after the Grand Transfer, but I failed everything. Everyone in Handyman 68 scattered, and the people I tried to save hate me. So I wanted to meet you. Because you were the person I was most afraid of in Kivotos. Because I thought you were a perfect superhuman. ...I held onto you, with a dignified voice telling me the path I should go... I defined you that way alone and I expected that from you alone.\"\n\n\"I'm... not a strong person. Like Vice President Hoshino of Abydos...\"\n\"I know. You are not strong. Only your shooting skill is strong. In reality, you're a weak person who falls into despair and shuts yourself in a room because the Prefect Team lost to something like Handyman and received a dissolution order. Just like me who's whining even though I won.\"\n\nAru forced herself up. Her ribs hurt terrifyingly. But she wanted to meet Hina's eyes. There are emotions that can only be shared between fools who have the same wounds and have fallen into the same despair together.\n\n\"But being weak is not a sin. Hina, even though you're a normal person, a person who feels the pain of not being a superhuman... you've held out until now. You've worked hard.\"\n\nAnd Aru reached out her bruised hand.\n\n\"Praise from something like a Gehenna criminal wouldn't be pleasing, but. Hina-san, thank you for protecting Gehenna until now. And from now on, I'll carry on Hina-san's share... too. So, Prefect Team... you can rest now.\""
 HEU.flavor_event.95.a:0 "\"...Praise from someone, it's really been a long time.\""

 HEU.flavor_event.96.t:0 "...Duel?"
 HEU.flavor_event.96.desc:0 "\"A... A, Aru-sama! You must flee! A, a big...!\"\n\nWhile Haruka, who burst into the Regent's office, stammered and fumbled, Sorasaki Hina, wearing her coat from the Prefect Team Leader days, came in holding a huge purple machine gun. In the hallway, she could glimpse the sight of soldiers who were guarding lying on the floor.\n\nWhat is this. Some kind of assassination attempt? Aru stood up, and Haruka and Kayoko stood in front of Aru to block her. Kayoko said in a grim voice.\n\n\"If you take one more step, I'll break your halo.\"\n\"...I haven't said a single word.\"\n\"What about that sight outside the door?\"\n\"I just said I wanted to meet the president of Handyman 68, but they attacked first, so I merely neutralized them. Nothing more, nothing less.\"\n\nHina said that and took out an envelope from inside her coat.\n\n\"I came to deliver this. Can you lower your guns?\"\n\nAn envelope? Aru harbored doubt but said. \"Let's check it first. We don't need to fight right now, do we?\"\n\nHina walked through the two who lowered their muzzles and placed the envelope on Aru's desk with a thud! What was inside the envelope was... an employment application?\n\n\"...Huh?\"\n\"Regrettably, the Prefect Team has been dissolved, so I've become unemployed. I came to join a new club.\"\n\"Ne, new club? No, you?\"\n\"Why? Is some kind of license or report card necessary?\"\n\nListening to Hina's joke-like remark, Aru finally realized that what happened just now was reality, not a dream or illusion. It was an unrealistic, hard-to-believe fantasy, though."
 HEU.flavor_event.96.a:0 "\"...You'll start from an apprentice. Nice to meet you, former Prefect Team Leader.\""

 HEU.flavor_event.97.t:0 "Nightmare"
 HEU.flavor_event.97.desc:0 "\"Th... this is a dream. A bad dream. So, that... they must have secretly fed me medicine that makes me hallucinate. These devils of Handyman... as if dissolving the Prefect Team wasn't enough, to me... how... Hi... Hina-buchou-sama... is...\"\n\nAko, the former Senior Administrator of the now dissolved Prefect Team and now appearing in the uniform of the Pandemonium intelligence department, saw Hina wearing a uniform with the 'Handyman 68' logo and began to tremble her hands. ...She trembles her hands even more severely than Aru, the alcoholic... she looks a bit unstable.\n\nHina let out a sigh.\n\n\"Ako. This is not a dream or hallucination. Since the Prefect Team has been dissolved, I've merely left to find another place to stay. That's all there is to it.\"\n\"That *place to stay* is Handyman 68, who dissolved the Prefect Team?! It's a criminal organization! It's terrorists! H... how... Hina-buchou-sama... a terror...ist...\"\n\nAko grabbed Hina's shoulders tightly as if she couldn't believe reality.\n\n\"Kyogoku Satsuki! It's clearly that woman's doing! It must be because of the NK Project! Right now Buchou-sama is brainwashed! So...\"\n\"I'm not the Leader anymore, Ako. I'm truly sorry. ...Also, I have never been brainwashed.\"\n\"It... can't be... I... I've... Buchou-sama... all along...\"\n\nTears began to well in Ako's eyes, and she covered her eyes with the back of her hand and ran away. Feeling a complex emotion mixed with apology, Aru asked.\n\n\"Don't you need to chase her?\"\n\"...Even if I chase her, I have no way to comfort Ako.\""
 HEU.flavor_event.97.a:0 "\"Ako will also understand someday.\""

 HEU.flavor_event.98.t:0 "I Really Liked You"
 HEU.flavor_event.98.desc:0 "It was this morning that a small parcel sent personally by Rikuhachima Aru arrived at the house of Amau Ako, the former Senior Administrator and current Pandemonium intelligence officer. While feeling a strong impulse to throw it away, Ako opened the parcel. Inside was one small USB. The moment she connected the USB to the computer with a trembling hand...\n\nHina, in her underwear, is held by Aru who is giving a fishy smile while wearing a collar saying 'The President's Dog' on her neck. Hina has a happy smile full of expectation.\n\n\"Now, do you want to introduce yourself?\"\n\"Yes! Sorasaki Hina, the Gehenna Prefect Team Leader... no, now Rikuhachima Hina of Handyman 68! From now on, I plan to give my first time to my new partner... Rikuhachima Aru-chan!\"\n\n\"Uwaaaah! No!!!!\"\n\nCrash! The moment Ako jumped up, the blanket was flipped over and her body tumbled off the bed. ...It's a dream. Oh God, I'm just thankful this was a dream. Ako almost crawled to the bathroom and finished washing her face.\n\nAnd the moment she came out to the hallway, she saw Hina's face on the television she forgot to turn off last night.\n\n- Under President Aru, Gehenna will prosper further. Since she will bring order to Gehenna, which has been in long chaos since the Grand Transfer, all students should trust Aru-sama and continue their daily lives as before...\n\nAhaha. What. Have I not woken up from the nightmare yet? Aru-sama? That person? Ako laughed toward the air and watched the person she once respected, liked, and loved so much, who now looks like a stranger, and cried like a child."
 HEU.flavor_event.98.a:0 "I can't admit it. A reality like this."

 HEU.flavor_event.99.t:0 "Hard to Believe, But"
 HEU.flavor_event.99.desc:0 "Kayoko stared at Hina's appearance as she expressionlessly filled out documents with a look full of doubt and distrust. As someone who knew the relationship between Hina and Handyman well back in Kivotos, she still couldn't admit Hina's 'defection.' No, it was close to being unable to accept it.\n\nHina ignored the gaze staring at her and returned the documents filled with text to Kayoko. There, a list of Republicans and Communist Party members hiding within the Luxembourg intelligence department was written in detail.\n\n\"It seems President Aru and the military narrowed down the personnel in their own way, but the background investigation of the agents was not done perfectly. There are still this many spies within the intelligence department trying to kill the President.\"\n\nKayoko snatched the documents from Hina.\n\n\"...Is this reliable data?\"\n\"It doesn't matter if you verify it. I just re-investigated to protect the President.\"\n\nKayoko stared at the documents for a long time... then put the documents in an envelope.\n\n\"I'll check it. ...Thank you.\"\n\nAs if she didn't expect to hear thanks, Hina showed a surprised expression for a moment... then laughed again."
 HEU.flavor_event.99.a:0 "\"You're welcome.\""

 HEU.flavor_event.100.t:0 "Combat Training"
 HEU.flavor_event.100.desc:0 "Mutsuki only sent a short letter saying 'it's a chore,' and Aru came even holding a sniper rifle with her hands trembling due to disability and alcoholism at the word 'Hina will teach the training herself,' but had to go back at everyone's long persuasion. Aru still didn't want to admit it... but her personal combat power would have already become lower than that of a common Helmet Gang member.\n\nAfter that, only Kayoko, Haruka, and Hina, who took on the role of instructor, remained in the abandoned building. Hina raised her machine gun... instead, she brought a riot control gun loaded with rubber bullets that don't have a risk of injury.\n\n\"The training content is simple. We will engage in combat with rubber bullets. The training is over if you two neutralize and knock me down. If you can't, it starts again.\"\n\nKayoko laughed as if it were absurd.\n\n\"You're telling me and Haruka, the two of us, to beat 'that' Prefect Team Leader?\"\n\"...I won't give my full strength since it's just training. The important thing is how you use the terrain of this abandoned building to bind my feet and launch a surprise attack.\"\n\nHaruka swallowed hard.\n\n\"If it's to protect Aru-sama... any training... I'm ready.\"\n\"Yeah. That attitude is the important thing.\"\n\nHina raised her gun expressionlessly."
 HEU.flavor_event.100.a:0 "\"I'll give you 10 seconds. Each take your positions.\""

 HEU.flavor_event.101.t:0 "Traitor"
 HEU.flavor_event.101.desc:0 "\"The Gehenna old government has collapsed anyway. The Prefect Team you tried to save has also disappeared. Judge rationally. If you still want to protect Gehenna's discipline, if such justice remains in you, you shouldn't be rioting here like Helmet Gang, but just applying to the Luxembourg Police Department. There must have already been a public notice that there's a score advantage for former Prefect Team members?\"\n\nIori gritted her teeth and aimed her gun at Hina's face, who was speaking expressionlessly while wearing the Handyman uniform. The tip of the gun came to just a few centimeters from Hina's face.\n\n\"I...! I didn't know you would betray the Prefect Team. Anyone else but Sorasaki Hina!\"\n\"Is it even possible to betray an organization that no longer exists? The Prefect Team was dissolved, and I merely joined Handyman in a non-affiliated status *after* that?\"\n\"Shut up! Sorasaki...! I believed in you, in your sense of justice...\"\n\nChinatsu placed a hand on Iori's shoulder, not hiding her look of contempt toward Hina.\n\n\"Let's stop. There's no possibility of winning if we fight 'this woman' alone. And the Prefect Team members who are holding a siege are also being shaken by this woman's words.\"\n\"...Goddamn it...\"\n\nIori threw her gun on the floor and turned away.\n\n\"If you want to go to the Luxembourg Police Department, just go, everyone. ...The siege is over.\"\n\"Not pulling the trigger. It was a good choice.\"\n\"Shut up, Sorasaki.\""
 HEU.flavor_event.101.a:0 "\"Don't ever show your face in front of us again. You traitor bitch.\""

 HEU.flavor_event.102.t:0 "Hina has Become our Family"
 HEU.flavor_event.102.desc:0 "When Hina first joined Handyman, Aru was the only one who believed in her. But as time passed, the distance between Hina and the Handyman employees gradually shortened. It must mean she has started to blend in among us not as the fearsome 'Prefect Team Leader' Hina, but as a 'colleague of Handyman 68.'\n\n\"Hina-chan! Hina-chan, do you like me? Or do you like Kayoko over there?\"\n\"Mutsuki-san. Can you please not bother Hina with such a frivolous question?\"\n\"Eeeh. Still 'Mutsuki-san'?\"\n\"...Both of you are tiring.\"\n\nSeeing Mutsuki and Kayoko each grabbing one of Hina's arms, Aru felt a faint smile float on her lips. Haruka said as she approached Aru's side.\n\n\"I thought I hated everyone in the Prefect Team, but that person is a bit... different.\"\n\"What do you mean, Haruka.\"\n\nAru laughed in a posture with her chin in her hand."
 HEU.flavor_event.102.a:0 "\"Hina is an employee of Handyman, not a Prefect Team member, right?\""

 HEU.flavor_event.103.t:0 "My Savior"
 HEU.flavor_event.103.desc:0 "To Hina, Aru during the Kivotos days was just one of the annoying targets for arrest. Also, a 'bronze medalist' class criminal in the order of Kasumi > Haruna > Aru. Well, it wouldn't have been better if she were a gold medalist. But after the Grand Transfer, after experiencing numerous hardships, and after her Prefect Team was conquered and forcibly dissolved. When she was collapsing in despair from having lost everything, the person who reached out a hand was... that bronze medalist Aru.\n\n- Being weak is not a sin. Hina, even though you're a normal person, a person who feels the pain of not being a superhuman... you've held out until now. You've worked hard.\n\nPraise. Pure gratitude. You've held out until now. You've been working hard alone all this time. Aru was the first 'adult' to recognize that for Hina. Hina gave a thin smile while putting on the Handyman uniform in front of the mirror.\n\n'To find the will to live by being recognized by a criminal. It's not like me.'\n\nBut... because the face of Aru who reached out her hand toward her that day kept coming to mind... Hina ultimately had no choice but to admit that she had fallen for her. The Prefect Team is no more. But, there was still a person who recognized her for Hina.\n\nThe problem is one. The person she hasn't resolved her hostility with yet, Amau Ako."
 HEU.flavor_event.103.a:0 "\"...Is there no way to persuade Ako.\""

 HEU.flavor_event.104.t:0 "Someone like you, really—"
 HEU.flavor_event.104.desc:0 "<Hina-buchou-sama>\nAko, it's me.\nWhy don't we meet at the Gehenna central district?\n\nDon't call my name so friendly. Handyman's dog Sorasaki. ...She wrote the reply until there, but Ako ultimately couldn't press the 'send' button. No matter how much she had changed, Hina was someone more than just a relationship between a Prefect Team Leader and a subordinate for Ako.\n\n- I'm going now.\n\nAfter a short reply, Ako left the house dressed in the Pandemonium uniform. Thanks to her characteristic horns, finding her in the wide central district was not difficult. Ako still glared at Hina who was wearing the Handyman uniform. She wanted to say, 'Why on earth did you do that.' But the moment she saw that outfit, words different from her heart burst out.\n\n\"Criminal activities seem quite enjoyable for you? Hina-san.\"\n\"...Sit down for now.\"\n\"Ha. You think I'll sit just because a criminal tells me to? I'd rather lick Makoto's boots.\"\n\nWhile saying so, Ako plopped down next to Hina in a posture with her arms crossed.\n\n\"What is it. I didn't sit because you told me to, I just sat because my legs hurt, okay? Did you perhaps expect something? Be ashamed!\"\n\"...Thank you for coming to find me.\"\n\"Pue-hung-!\"\n\nAko's cheeks instantly turned red.\n\n\"...What is it. Suddenly flirting? Someone like you, really... really...\"\n\nAfter trying to pour out some harsh words for a moment, she soon lowered her head.\n\n\"...Why did you do that. Did you hate the Prefect Team that much? Was I not enough? If it was that you hated me, you could have just told me. Senior Administrator, you're fired. If it had been like that, it would have been less hurtful. It would have been. Why without saying anything...\"\n\nHina grabbed the hand of the sobbing Ako."
 HEU.flavor_event.104.a:0 "\"...Ako. Do you want to walk together for a bit?\""

 HEU.flavor_event.105.t:0 "—I really like you"
 HEU.flavor_event.105.desc:0 "Hina told many stories while walking through the central district of Gehenna. The despair she felt when the Prefect Team collapsed after the Grand Transfer and she felt all her efforts had come to naught. Aru's actions, reaching out to her in that despair. That it was Rikuhachima Aru who enabled her to endure the despair now that she was no longer the Prefect Team Leader.\n\n\"...And, you're saying that you've come to like that woman, Buchou-sama?\"\n\"...\"\n\"Haaaaa...\"\n\nAko looked up at the sky and let out a deep sigh. I also liked Buchou-sama. But, I didn't know anything when Buchou-sama was suffering the most, and I couldn't do anything for you.\n\nThe sense of betrayal and anger she felt toward Hina turned into guilt toward Ako herself. Ako put a bit of strength into the hand she held with Hina.\n\n\"Fine. ...Even if other Prefect Team members deny Buchou-sama, I alone will affirm Hina-buchou-sama. Even if denied by a hundred, a thousand, no, everyone in Gehenna, I believe Hina-buchou-sama is not a traitor to Gehenna.\"\n\"Ako, I...\"\n\n\"—So, now come to the Pandemonium intelligence department comfortably. Thanks to the raccoons of Pandemonium being swapped out for Aru's rubber stampers, it's become a place with no backroom deals and a light heart. I'll be waiting for Buchou-sama anytime.\"\n\"Are you saying you forgive me? Even though I betrayed the Prefect Team?\"\n\"It can't be helped, right? Even if the Prefect Team is gone, I am Hina-buchou-sama's eternal Senior Administrator and...\""
 HEU.flavor_event.105.a:0 "\"As much as Buchou-sama likes Aru, I also like Buchou-sama—\""

 HEU.flavor_event.106.t:0 "This is Charisma"
 HEU.flavor_event.106.desc:0 "\"Kihit! Look! Doesn't it look like Pandemonium achieved victory while appearing defeated at the same time? This is exactly the great victory that only I, Hanuma Makoto-sama, can achieve!\"\n\nRikuhachima Aru's appointment letter as the Pandemonium Council Chair. Makoto held the appointment letter in both hands and spoke boastfully to Iroha, who had an annoyed expression.\n\n\"This person named Aru has an outstanding ability to recognize a great leader! Giving away half... of the world is a bit wasteful, but if it's more than half of half... and less than half, I can give it away. Kihit.\"\n\"Ah. Yes. Is that so.\"\n\nTo be able to like it so thoughtlessly even though she became Aru's 'rubber stamper' with no power. Iroha was honestly envious of Makoto's innocence. If one has no thoughts, they wouldn't have political worries."
 HEU.flavor_event.106.a:0 "\"...I want to skip work.\""

 HEU.flavor_event.107.t:0 "NK Ultra Achievements"
 HEU.flavor_event.107.desc:0 "\"This Kyogoku Satsuki is the most suitable existence to lead the new Gehenna. Aru must have judged that way too.\"\n\nSatsuki spoke boastfully while sitting in a chair with her arms crossed.\n\n\"I haven't attempted the NK Ultra project on Aru yet... Did the hypnosis succeed without me knowing?\"\n\nIroha said as if it were a chore.\n\n\"Probably not, Council Chair.\"\n\"Fufu. Who knows about that. Aru might already be my puppet... in this state? All of this is my NK Ultra's...\"\n\nLetting Satsuki's monologue flow in through one ear and out the other, Iroha let out a sigh."
 HEU.flavor_event.107.a:0 "\"...I want to skip work.\""

 HEU.flavor_event.108.t:0 "Don't Leave Me Behind"
 HEU.flavor_event.108.desc:0 "During the war with Trinity, Hina naturally fought against Trinity forces at the front line. Stories circulated that she alone neutralized several students from the Justice Task Force in urban combat, or that she personally raised the Luxembourgish national flag on the old Tea Party building in Eden. But because of that, Hina was at the furthest place from the scene when Aru's drug suicide incident occurred.\n\n\"Huff... huff... Aru! Aru!\"\n\nIgnoring the nurse's words that it wasn't visiting hours, Hina, who almost tore down the hospital room door and burst in, lunged toward Aru who was lying in bed. Before saying hello, or I'm sorry, or anything... Hina was hugged in Aru's arms and began to cry.\n\n\"Why did you do that... why...\"\n\"I'm sorry, Hina. I...\"\n\"Don't ever do it again. Don't leave me behind. ...Because of you, I was able to give up the heart that was going to give up everything...!\""
 HEU.flavor_event.108.a:0 "Aru had to comfort Hina for a long time."

 HEU.flavor_event.109.t:0 "Tea Party?"
 HEU.flavor_event.109.desc:0 "As the name of the new government became 'Tea Party' after Asagi Mutsuki's Luxembourg coup, the first to protest was the Trinity General Academy. Mutsuki could also guess the reason. The use of the term Tea Party by a student of Gehenna itself must have been an insult to Trinity. But she didn't expect that 'the' Misono Mika would call her directly.\n\n\"Ahaha-hat, is this something like the unique sense of humor of horn-heads? If it was humor, it was totally funny☆ Yes. Enough to make me angry.\"\n\nHonestly, she didn't know she would be this seriously angry. ...She felt like playing a prank. Mutsuki originally liked playing pranks in such situations, didn't she?\n\n\"Hmm. Humor, I don't know what you mean by that?\"\n\"The title of Host of the Tea Party! Do you think that's something you Gehenna people can say at will?\"\n\"You Gehenna...? Ah, it seems you didn't know yet?\"\n\"...What?\"\n\nHere, in a mocking tone with a bit of sarcasm.\n\n\"Ufu-fu. Actually, I was an intelligence agent dispatched to get information on Gehenna from the previous Host. Eh, by any chance, you didn't know anything while pulling a coup and locking up the previous Host in prison?\"\n\"Eh? Eh? Wait. Trinity? Spy? No, there's no way...\"\n\"In the first place, is there something like a horn on my head? Demon wings? You've never seen them, right? And yet you believed I would be a Gehenna student? Ahaha-hat. Did you really not hear anything?\"\n\"A, no. It's no use trying to deceive me! Yes! If Nagi-chan had planted such a spy, she would have told me, her best friend... no way...\"\n\nWhile saying the words best friend, Mika's words trailed off. Because she would know what she did to the 'previous Host.' Was Mika truly the friend of the previous Host? Did that person also think of her that way? While she was stammering her words in confusion, Mutsuki covered the receiver with her hand and burst into stifled laughter.\n\n\"A-a- if you don't believe it, why don't you go ask the previous Host? Did you plant a spy in Gehenna? and all. But wouldn't an answer like this return? 'Misono-san. Don't talk to me.' and such.\"\n\"...Well... ahaha☆... um... by any chance, if you're truly Nagi-chan's spy, can you... like, give me some advice about Nagi-chan...\""
 HEU.flavor_event.109.a:0 "Click. Mutsuki hung up the receiver and burst into loud laughter."

 HEU.flavor_event.110.t:0 "Wilhelm II Hospital Treatment"
 HEU.flavor_event.110.desc:0 "The condition of the former German Emperor Wilhelm II, who was hospitalized in a Luxembourg hospital due to an occlusion, has worsened urgently. It was a critical state that would have been impossible to treat with local medical technology without the advanced Gehenna medical technology after the Grand Transfer, but through the efforts of the medical staff, the crisis of occlusion was passed. However, the opinion is that it is difficult to continue the logging business due to the deterioration of lung function.\n\nBafflingly, Wilhelm II requested the Luxembourg government to pay for the treatment costs on the grounds that he had no money to pay. The final decision-maker is [ROOT.GetLeader], but no one will be happy with budget investment for an old Emperor."
 HEU.flavor_event.110.a:0 "How much money could it possibly take."
 HEU.flavor_event.110.b:0 "But it's a waste to spend it on that old man, right?"

 HEU.persona_event.1.t:0 "Theory Study - 1"
 HEU.persona_event.1.desc:0 "\"Uuuuugh...\"\n\nAt the sight of Aru spinning a pen in the Handyman office, Kayoko, who just entered, tilted her head.\n\n\"What are you doing, Boss?\"\n\"Ah. Trying to study economics beyond business administration, and there are more math formulas than I thought....\"\n\nAru gave an awkward smile, saying ahaha.\n\n\"Since the people I have to protect are more than before, I'm trying to work harder, but it's not easy.\"\n\"There's no need to overdo it. The Boss doesn't need to take on all the work alone.\"\n\"That's true, but at least I don't want to be a Boss who is a nuisance to others.\"\n\nKayoko, who stared at Aru with a surprised expression for a moment, soon gave a thin smile.\n\n\"No one thinks the Boss is a nuisance. Still.... I hope the effort goes well.\""
 HEU.persona_event.1.a:0 "\"Yeah. ...I'll work hard.\""

 HEU.persona_event.2.t:0 "Theory Study - 2"
 HEU.persona_event.2.desc:0 "Click, Mutsuki who opened the office door and entered raised her bag high.\n\n\"Aru-chan! Is today just a day for playing with toys...... huh, um, who are you?\"\n\nAru wearing a suit and semi-rimless glasses. She smirked while sliding her glasses up halfway.\n\n\"Oh, Mutsuki. Have you arrived? It worked out well. I have finally realized the truth of all things and become a true intellectual of this world.... I have read all the books on Jung's analytical psychology!\"\n\n\"Wow. ...It's truly the first time Aru-chan has made me flustered.\"\n\"What's with that lukewarm response! And look! Glasses! I even wore the glasses Mutsuki likes!\"\n\"But glasses and analytical psychology don't have much connection, do they?\"\n\"Anyway, all intellectuals wear glasses. Like that talkative blonde from Millennium....\"\n\nAfter staring at Aru blankly for a moment, Mutsuki finally burst into laughter.\n\n\"Well anyway, I know Aru-chan wants to show off that she studied hard. A, n, d!\"\n\nHop, Mutsuki hopped over and slightly pushed up Aru's glasses. \"Aru-chan. Glasses suit you.\""
 HEU.persona_event.2.a:0 "\"Ahaha. Thank you.\""

 HEU.persona_event.100.t:0 "Daily Life of Handyman"
 HEU.persona_event.100.desc:0 "\"Ugh, ugh, I'll die.\"\n\nHaruka pushed the muzzle of her shotgun, Blow Away, deep into her mouth. Tears welled up and pooled in Haruka's eyes. It wasn't that she didn't live saying words like 'I'll die' normally, but today the state was more serious. The reason was that she broke one office pottery while cleaning the Handyman office. Aru hurriedly stood up and stood a bit apart from Haruka.\n\n\"Wait. ...Haruka, let's calm down for now.\"\n\"Is there a need for me, who can't even do cleaning, to be alive? I'm just a nuisance to Aru-sama, just die.......\"\n\nIt wasn't that such a thing hadn't happened once or twice, but it was necessary to persuade Haruka to lower the gun. Aru slowly approached Haruka."
 HEU.persona_event.100.a:0 "\"Haruka is more important to me than pottery.\""
 HEU.persona_event.100.b:0 "\"This is not even that expensive, you don't need to feel guilty.\""

 HEU.persona_event.101.t:0 "Haruka's Study"
 HEU.persona_event.101.desc.a:0 "\"Masculine noun... feminine noun... neuter noun?! Why is German so complicated?\"\n\nHaruka, who was studying German grammar, clutched her head. Haruka is trying to read Luxembourg newspapers and adapt to the local community in her own way, but her writing hasn't been improving at all for several years, let alone daily conversation. Aru sat next to Haruka who was reading a grammar book. The textbook was full of Haruka's notes and underlined sentences written densely." 
 HEU.persona_event.101.desc.b:0 "\"I've studied for several years, but I think I'm still not at the level to read papers. Is it because I'm lacking?\"\n\nHaruka, who was reading a German paper, clutched her head. To be helpful to Aru, Haruka has studied German grammar for several years and read various German books. It seems she has accumulated enough knowledge to read German language and literature papers now, but difficult sentences seem to remain for Haruka. Aru looked at the German language and literature paper Haruka was reading. The book was full of Haruka's notes and underlined sentences written densely."
 HEU.persona_event.101.a:0 "I'll teach you a bit, let's read together."
 HEU.persona_event.101.b:0 "How about going to Kayoko? She's smart so she'll teach you well."

 HEU.persona_event.102.t:0 "Expressing Gratitude"
 HEU.persona_event.102.desc:0 "\"Aru-sama. Truly, you've been working so hard every day lately.\"\n\nToday Haruka brought a gift set to Handyman 68. It's said to be a nutritional supplement helpful for health, and from the marks of the price tag Haruka scratched off with her hand, one could tell she spent a fairly large sum of money. Aru smiled while receiving Haruka's gift set. She was thankful, and also had a feeling of apology for making her spend such a large amount of money.\n\n\"Aru-sama, you must stay healthy for a long, long time.\""
 HEU.persona_event.102.a:0 "Thank you, Haruka."

 HEU.persona_event.103.t:0 "Evening of Handyman"
 HEU.persona_event.103.desc:0 "\"Coming out together like this with Aru-sama....... I'm truly grateful.......\"\n\nDecided to have dinner with Haruka today. The place visited was a small food stall in the city. Food stall culture, which didn't exist in Luxembourg before the Grand Transfer, started appearing one by one as the Kivotos population moved over with the Grand Transfer. Before the Grand Transfer, she couldn't go to high-end restaurants because she had no money, but after becoming the Regent of Luxembourg, she often visited food stalls to recall memories of the days she lived in Kivotos.\n\n\"Fufu. Coming out to eat ramen alone like this with Aru-sama is also a small happiness.\"\n\nHaruka received the ramen bowl with a bright smile. Although everything changed after the Grand Transfer, the happiness of time spent together with someone precious. She thinks that alone has not changed."
 HEU.persona_event.103.a:0 "Because now I can proudly buy you at least ramen."

 HEU.persona_event.104.t:0 "Haruka's Misfortune"
 HEU.persona_event.104.desc:0 "\"I just....... want to pass by.\"\n\"The only place you Kivotos bastards can pass by is the flames of the crematorium!\"\n\nBecause Haruka, who was sent on an errand due to work, didn't return, she went out of the Regent's palace for a bit. Before long, she could see two drunk local residents blocking Haruka's path and picking a fight. In terms of physical strength, Haruka could knock down the two in an instant and pass by. But as if thinking that friction with locals would be a nuisance to Aru, Haruka was just enduring the anger of the nervous local residents while cowering.\n\nHaruka wouldn't lose to two locals, but something might happen. Wouldn't it be better to help her now for Haruka's sake?"
 HEU.persona_event.104.a:0 "\"...Hey! If you don't get away from Haruka right now, I'll break your wrists!\""
 HEU.persona_event.104.b:0 "...Call the Luxembourg City Police and instruct them to help Haruka."

 HEU.persona_event.105.t:0 "Trouble Consultation"
 HEU.persona_event.105.desc:0 "\"There's something I want to consult Aru-sama about.......\"\n\nOne afternoon, Haruka, who fell into trouble, came to Aru to consult about her personal affairs. It seemed she wanted to consult about things that happen due to Haruka's low self-esteem. One wouldn't be able to change Haruka's personality at once with a single word. But just by listening to her troubles for a long time by her side, one could provide a bit of comfort to Haruka.\n\nOf course, advice for Haruka will be necessary after the consultation too."
 HEU.persona_event.105.a:0 "How about trying some exercise? Like baseball or a sport done together with others."
 HEU.persona_event.105.b:0 "Let's read some motivational books. I'll recommend some to you."

 HEU.persona_event.106.t:0 "Growing Weeds"
 HEU.persona_event.106.desc:0 "\"Ehehe. I think seeing it grow is really good.\"\n\nToday, the weed Haruka was growing grew very beautifully and bloomed a flower. Decided to repot it from a small pot to a large pot and leave it in a corner of the Handyman office for Haruka to keep growing. It's just one small weed, but thanks to that weed, the office atmosphere seems to have changed a bit more lively. It must be thanks to Haruka's effort in trying to make the weed grow well."
 HEU.persona_event.106.a:0 "If Haruka likes it..."

 HEU.persona_event.107.t:0 "Trouble Consultation"
 HEU.persona_event.107.desc:0 "\"I know there are many people among the Luxembourg locals who dislike Kivotos transferrers. But I seem to attract enemies particularly often.......\"\n\nKayoko's trouble consultation. That was about often being picked on by locals with anti-Kivotos tendencies because of her scary impression. Certainly, since Kayoko has a scary impression, there seem to be those who think she is threatening locals just by walking.\n\nAlthough one can't change Kayoko's face, as the president of Handyman, can't one give her some small advice?"
 HEU.persona_event.107.a:0 "\"How about trying to wear a mask? If half of your face is covered, you might be less scary?\""
 HEU.persona_event.107.b:0 "\"How about practicing smiling? Maybe the expression is the problem.\""
 HEU.persona_event.107.c:0 "\"The problem is the people who are afraid of Kayoko, I don't think Kayoko is the problem.\""

 HEU.persona_event.108.t:0 "Evening of Handyman"
 HEU.persona_event.108.desc:0 "\"The Boss doesn't seem to have changed much whether in Kivotos or here. Being diligent, and the heart for caring for colleagues too.\"\n\nAfter processing chores that continued until late evening together with Kayoko, Aru stopped by a food stall on the way back together. Looking up at the high moonlit night, Kayoko seemed to recall the daily life of Handyman before the Grand Transfer. Although many things changed after the Grand Transfer, she thinks the warmth of dinner together with a precious friend has not changed.\n\n\"Now you'd be able to proudly pay for the ramen, right?\" Kayoko spoke playfully in a posture with her chin in her hand. Aru just laughed it off."
 HEU.persona_event.108.a:0 "\"Yeah. Now I can add as much chashu as I want!\""

 HEU.persona_event.109.t:0 "Kayoko's Gift"
 HEU.persona_event.109.desc:0 "\"The Boss's work has increased several fold since the Grand Transfer. You haven't been able to rest properly lately, right?\"\n\nToday Kayoko bought a nutritional supplement set for Aru. The workload as the 'Regent of Luxembourg' compared to being the president of a small Handyman agency had a difference of several fold as Kayoko said. Aru expressed gratitude and received the gift box from Kayoko. It was quite heavy. Not only the weight of the nutritional supplements, but perhaps it's because her heart thinking of Aru is also contained together."
 HEU.persona_event.109.a:0 "\"Fufu. Receiving such a gift, I'm truly a happy Boss.\""

 HEU.persona_event.110.t:0 "Cats"
 HEU.persona_event.110.desc:0 "\"Aigo my arm! Aigo my leg!\"\n\"Shouldn't the country compensate for this!\"\n\nTwo men protesting in front of the Luxembourg Grand Ducal Palace with splints and bandages on their arms and legs. Aru invited the two men inside to check the situation first. The men's story was simple. While going home, there was a cat on the street, so they just kicked the cat a bit for fun. But Kayoko, who saw that sight, chased them with a scary face and made the two men half-dead with her bare hands, isn't that so.\n\n\"In the first place, isn't the side that bullied a peaceful cat wrong? I don't even know what they did well to come here.\"\n\nKayoko is holding out that she is not ashamed of hitting the two, without backing down a bit. In the end, it became Aru's share to mediate this complicated problem."
 HEU.persona_event.110.a:0 "\"Cats are also living things, kicking them is too much! There is no compensation for you!\""
 HEU.persona_event.110.b:0 "\"Still, this time Kayoko was too much... let's apologize and compensate for the treatment costs.\""

 HEU.persona_event.111.t:0 "Street"
 HEU.persona_event.111.desc:0 "\"Kitty. Yeah, don't run away...\"\n\nOn the way home from work, Aru discovered Kayoko's appearance giving food to cats in an alley. Normally she scares people because of her scary face, but in the kind smile she makes in front of small animals, one couldn't feel a fearful impression. It means Kayoko also harbors a warm heart that loves living things. Aru watched Kayoko playing with cats with satisfaction and went home."
 HEU.persona_event.111.a:0 "\"It was a different kind of way home.\""

 HEU.persona_event.112.t:0 "I Hate Local Music"
 HEU.persona_event.112.desc:0 "\"It's too difficult to find decent rock music in Luxembourg.\"\n\nAru also knows well that the cultures of Earth and Kivotos are different. But the person most troubled by this problem seems to be Kayoko after all. Although local musicians trying rock clumsily are appearing one by one due to the influence of Kivotos, an outstanding musician who would satisfy the rock mania Kayoko had not yet appeared. Of course, a local rock band Kayoko would be satisfied with would emerge after a long time....... At least for now, Aru's effort will be necessary to play music for Kayoko."
 HEU.persona_event.112.a:0 "\"Can't we find records of Kivotos musicians?\""
 HEU.persona_event.112.b:0 "\"...Should I make the military band practice rock Kayoko would like?\""

 HEU.persona_event.113.t:0 "Do Plants Also Listen to Music?"
 HEU.persona_event.113.desc:0 "\"Boss, lately Haruka seems to be troubled about what song would be good to play for them...\"\n\nEven though Kayoko has a bad relationship with locals because of her sharp appearance, she maintains a close relationship with the employees of Handyman 68. Today she came to hear the question of helping choose a song to play for the plants Haruka is growing. Although she doesn't have a deep knowledge of music, can't she give at least a small advice?"
 HEU.persona_event.113.a:0 "\"How about classical? It seems like a safe choice.\""
 HEU.persona_event.113.b:0 "\"How about the rock music Kayoko normally listens to? They might like it unexpectedly.\""

 HEU.persona_event.114.t:0 "A Small Prank"
 HEU.persona_event.114.desc:0 "\"Aru-chan! Still doing paperwork? ......If you only work every day, you'll get exhausted. How about taking a break and playing a board game today?\"\n\nDid she notice that Aru hasn't been able to rest at all for several days while reviewing documents related to budget proposals? Mutsuki brought a bunch of toys and board games in her bag and made a proposal to Aru to rest for a bit. Of course she wanted to rest. But the responsibility remaining in Aru's heart was preventing her from immediately giving the answer 'Let's play!'\n\nAs if noticing Aru's trouble, Mutsuki spoke again.\n\n\"I know Aru-chan is working hard for the Luxembourgers. But if you work without resting, you'll collapse. Occasionally playing is what's good for the people?\""
 HEU.persona_event.114.a:0 "\"Yeah, I really should play today!\""
 HEU.persona_event.114.b:0 "\"...Sorry, there are bureaucrats waiting for my documents...\""

 HEU.persona_event.115.t:0 "Boredom"
 HEU.persona_event.115.desc:0 "\"This place is somehow boring compared to Kivotos... first of all, there's a lack of entertainment, right?\"\n\nMutsuki suddenly said that, and it turned out today she was telling her to throw away work or whatever and go out for a picnic. Walking is also one of the leisure activities in Luxembourg where playthings are lacking. Fortunately, it wasn't a day with a lot of work, so Aru decided to leave the palace with Mutsuki.\n\n\"Aru-chan, which place do you like? Is there a place you want to go?\"\n\"A place I want to go? Hmmm....\""
 HEU.persona_event.115.a:0 "\"How about looking around the city side?\""
 HEU.persona_event.115.b:0 "\"Let's go on a bicycle trip to the forest on the outskirts.\""

 HEU.persona_event.116.t:0 "A Somewhat Dangerous Prank"
 HEU.persona_event.116.desc:0 "\"Listen, Mutsuki, the bag you carry every day, local people are worried that there might be a bomb inside.......\"\n\nAru spoke awkwardly while scratching her cheek. There was no particular evidence, but it seemed there were residents who reported to the police that her appearance of carrying a large bag every day was 'suspicious.'\n\nThe problem was that there really were some bombs like landmines inside that bag. Carrying weapons at all times is a normal thing in Kivotos, but not in this world. No matter how much time passes, it'll be difficult to get used to this."
 HEU.persona_event.116.a:0 "\"No, as long as you don't threaten people, it's fine.\""
 HEU.persona_event.116.b:0 "\"It would be better to try not to carry that bag in the city as much as possible.\""

 HEU.persona_event.117.t:0 "What Kind of Snack Does Mutsuki Like?"
 HEU.persona_event.117.desc:0 "\"Aru-chan also has this side to her? Fufu, I've seen you in a new light.\"\n\nA day when work as the Luxembourg Regent and Handyman president ended a bit early. Aru visited a small cafe in the city with Mutsuki. A famous cafe with delicious coffee and desserts. In particular, waffles with cream were a place popular not only with local residents but also with Kivotos people. Aru spoke while sipping coffee confidently.\n\n\"If you're a hard-boiled president, you must not skip time for your employees.\"\n\"Fufu. Hard-boiled, president, putting all that aside. Just. I just like that I came out with Aru-chan.\"\n\"Wa, wait. Embarrassing.......\""
 HEU.persona_event.117.a:0 "A short but peaceful day."

 HEU.persona_event.118.t:0 "Ahaha, It's Like Popcorn!"
 HEU.persona_event.118.desc:0 "Kwa-ga-ga-gang!\n\nA roar that sounded like an earthquake occurred in the entire Luxembourg City rang out. Did a bombardment fall? No, Mutsuki just set off a homemade bomb while making it at her house. If it were Kivotos, it wouldn't have even been a commotion, but Luxembourg City literally went into an uproar.\n\nOf course, Mutsuki's state is also not normal. It's said she got a crack in her finger bone as the bomb went off at close range. Fortunately, no permanent aftereffects will remain, but she won't be able to use chopsticks for the time being.\n\n\"Ahaha. Aru-chan. Did you come all the way to my house because you were worried? Not hard-boiled, you know? I'm fine. Nothing but the window being broken, right? Ahaha.\"\n\nIt seemed not only the window was broken, but Mutsuki comforted Aru as if it were nothing. Aru sat next to Mutsuki and faced her. She was relieved that she wasn't seriously hurt, and also angry that she made her worry. Earth has a thinner mystery than Kivotos. We who still have halos are stronger than the locals, but we have become weak enough to suffer fractures from such an accident.\n\nAru spoke with sincerity toward her precious friend."
 HEU.persona_event.118.a:0 "Mutsuki... thank you for not being hurt."
 HEU.persona_event.118.b:0 "I was scared... don't do such dangerous things from now on..."

 HEU.persona_event.119.t:0 "Time Spent with Aru-chan"
 HEU.persona_event.119.desc:0 "\"Aru-chan... I'm tired, pet me.\"\n\nMutsuki, who came to the office out of the blue, lay down on the sofa like a cat. No. Is this also some kind of test to become hard-boiled? She was so flustered that she didn't even know how to react.\n\nMutsuki slowly turned her head with her eyes narrowed.\n\n\"By any chance, does Aru-chan hate me? ...So you feel unpleasant even reaching out your hand to pet me?\"\n\"Ah, no, it's not like that! Absolutely!\"\n\nShe doesn't know why on earth this fellow is being like this, but Aru first let Mutsuki do a lap pillow for her and then slowly petted her head. How much time has passed? Mutsuki slowly fell asleep while lying on Aru's lap.\n\nAnd the sleeping Mutsuki whispered as if in her sleep.\n\n\"......Kivotos, hometown, home...... everything is missed......\"\n\nIs she feeling homesickness in Luxembourg, a completely different culture and world? She thought Mutsuki was a strong person, but because she was strong, she seemed to have been unable to openly reveal such pain."
 HEU.persona_event.119.a:0 "Just for today, rest comfortably, Mutsuki."

 HEU.persona_event.120.t:0 "Aru-chan Likes This Kind of Thing?"
 HEU.persona_event.120.desc:0 "\"Ta-da! It's a hard-boiled gift for our hard-boiled outlaw Aru-chan!\"\n\nWhat Mutsuki, who burst in out of the blue, thrust forward was a cigarette pack. ......A cigarette pack?\n\n\"No, that, um, I'm a bit with smoking.......\"\n\"Ahaha. Aru-chan, did you perhaps think I brought real cigarettes? Do you think I'd send Aru-chan away with lung cancer?\"\n\"Huh? Uh-uh-uh? Not cigarettes?\"\n\nClick, Mutsuki opened the packaging. What was inside was chocolate in the exact same shape as a cigarette.\n\n\"Cigarette chocolate. ......Wouldn't it look more hard-boiled to bite this and take a picture? Fufu. Not bad, right?\"\n\nChocolate. Only after hearing those words did Aru pull one out and try biting it in her mouth. The cigarette had a sweet hard-boiled taste."
 HEU.persona_event.120.a:0 "Thank you, Mutsuki."

 HEU.persona_event.121.t:0 "Is There No... Like Mutsuki?"
 HEU.persona_event.121.desc:0 "\"He-lpless, he-lpless, Aru-chan can't do accounting and anyway um......he-lpless.\"\n\"......Are you sick somewhere?\"\n\nShe wondered what 'he-lpless' talk she was doing in the office since morning, and she started an incomprehensible explanation that these days such 'characters' are more popular than even small devil attributes. Haruka slinked forward.\n\n\"Section Manager Mutsuki, if necessary, instead of Aru-sama, you could belittle me...\"\n\"Hmm, if I did it to Haruka, you'd really hang yourself.\"\n\"Et.\"\n\"And the belittling attribute thing seems to not fit me more than I thought.\"\n\nMutsuki gave an uuu-mm sound and crossed her arms. What on earth is that belittling attribute thing? What's character nature? Am I the only one who doesn't know?"
 HEU.persona_event.121.a:0 "Mutsuki doesn't say words like he-lpless."

 HEU.persona_event.122.t:0 "One Evil a Day Settlement"
 HEU.persona_event.122.desc:0 "\"All Handyman 68 employees for once in a long time! We shall have the One Evil a Day settlement time.\"\n\nClap clap clap. Haruka is enthusiastic, Mutsuki is laughing as if it's fun, and Kayoko is only pretending to clap. Although it's an appearance that cannot be called united, Aru sat in her chair and spoke to the employees in a somewhat dignified manner.\n\n\"Why don't each of you talk about what you did for One Evil a Day as an outlaw worthy of Handyman 68?\"\n\nHaruka scratched her cheek. \"That, actually, recently I haven't been able to do particularly bad things.......\"\n\nMutsuki also just burst into laughter. \"That, besides something like playing a prank on Aru-chan, people here really die with one bomb. It's difficult, right?\"\n\nKayoko also let out a sigh. \"Haven't done anything.\"\n\n\"What's with that-! That's not hard-boiled at all!\"\n\nHaruka laughed beamingly.\n\n\"But that, as much as that, many people have come to trust and love Aru-sama. Conversely, isn't it a good thing...?\"\n\nAru, who was about to say something for a moment, closed her mouth. Outlaw, hard-boiled, certainly, such words were gradually scattering into past memories. Still, a life loved by other people might not necessarily be a bad thing, right?"
 HEU.persona_event.122.a:0 "Betraying the expectation that I'll do something bad. This too is One Evil a Day."

 HEU.persona_event.123.t:0 "My Eyes Hurt"
 HEU.persona_event.123.desc:0 "\"It's been quite a while since I took off my glasses after my high school debut...\"\n\nReading a thick economics book until late at night without glasses, my eyes hurt quite a bit. Aru stood up after lightly covering the book with a bookmark.\n\n\"Would it be better to wear glasses when I'm alone at the boarding house after work?\"\n\nAnyway, when I'm alone, there's no one to see, and Mutsuki won't tease me next to me even if I wear glasses like the old days. But glasses! Isn't it an item that brings back embarrassing... memories before high school debut? Wouldn't it be better to read the book without glasses even if my eyes hurt a bit?"
 HEU.persona_event.123.a:0 "As expected, I hate glasses!"
 HEU.persona_event.123.b:0 "It's one step back for study..."

 HEU.persona_event.124.t:0 "I Will Kill You, Rikuhachima Aru"
 HEU.persona_event.124.desc:0 "\"I will kill you, Rikuhachima Aru...! Ack!\"\n\nDuring lunch time, a Nazi follower terrorist who climbed the wall of the Luxembourg Grand Ducal Palace using handmade equipment was caught on the spot. He seemed to have made solid preparations for assassination, including a pistol, but even though the pistol bullet accurately hit between Aru's eyes, she launched a counterattack while being fine, and he ended up rolling on the floor with a bullet in his stomach.\n\nThe gendarmes who arrived at the scene one step late shouted German insults and beat the wounded Nazi with rifle butts. Although he was an opponent who tried to assassinate Aru, the sight of a group of men gathering to stomp on a bleeding man with military boots was a bit stimulating for her. Aru approached the excited gendarmes and said."
 HEU.persona_event.124.a:0 "\"We can't investigate if he dies. Everyone calm down.\""
 HEU.persona_event.124.b:0 "\"No, that, um, let's take him to the hospital first. It's pitiful...\""

 HEU.persona_event.125.t:0 "A Pleasant Meal Today"
 HEU.persona_event.125.desc:0 "There are naturally fancy dining rooms and chefs hired for the Grand Ducal family in the Luxembourg Grand Ducal Palace, but Aru had never had a meal in the palace once. The place she usually visits for lunch is a small restaurant for transferrers not far by walking. At the Japanese restaurant run by a sparrow demi-human, she could have a meal that was cheap but more delicious than the convenience store lunch boxes she ate in Kivotos.\n\n\"Eat a lot. Thanks to Rikuhachima-yang, these days there are no locals throwing stones calling me a bird-brain.\"\n\nThe sparrow demi-human welcomed Aru who visited the restaurant and gave her more karaage than usual.\n\n\"Eat a lot. Thanks to Rikuhachima-yang, these days there are no locals throwing stones calling me a bird-brain.\"\n\nThe sparrow demi-human welcomed Aru who visited the restaurant and gave her more karaage than usual. It was a small kindness, but at the thought that the dream of Kivotos people and locals living together equally has gotten a bit closer, Aru laughed and picked up her chopsticks."
 HEU.persona_event.125.a:0 "\"Let's work hard so I can make many people happy in the future...\""
 HEU.persona_event.125.b:0 "\"Since I'm the leader of Handyman, I should work harder to lead everyone!\""

 HEU.persona_event.126.t:0 "I'm Not a Klutz!"
 HEU.persona_event.126.desc:0 "\"Uwaaaaah! Ack! Ack!\"\n\nDuring dinner time, I tried to drink coffee elegantly at the boarding house but ended up burning my lips on the coffee. Additionally, crash! The mug in my hand fell and coffee even seeped into the wooden floor. I cried while clearing the mug pieces on the floor and wiped the floor with a rag several times... but it seems the coffee aroma still remains on the wooden floor.\n\nWhy am I so foolish... Can't I show a reliable appearance? Aru felt a gloomy emotion welling up in her heart while lying on the floor and scrubbing the wooden floor hard..."
 HEU.persona_event.126.a:0 "\"It was a precious mug...\""

 HEU.persona_event.127.t:0 "Unpleasant Commute"
 HEU.persona_event.127.desc:0 "\"Horn-head! Demon! Go back to hell!\"\n\nDuring the morning commute, a young child about the age of an elementary student threw a pebble at Rikuhachima Aru who was heading toward the Luxembourg Grand Ducal Palace. The pebble, which flew in an accurate trajectory, hit Aru's head precisely. Clang!\n\n\"Ouch!\"\n\n\"This primitive fellow! To Your Highness!\"\n\nA Luxembourgish policeman at the scene caught him and struck the boy's head harshly with a baton. 'Isn't it just a young child's prank!?' Aru, who felt sorry instead, stopped the policeman and released the boy, but the boy, who was bleeding profusely from his head, glared at Aru with eyes full of hatred and disappeared into an alley.\n\n\"Your Highness, are you okay? We must catch that brat...\"\n\"No. Just... it's okay.\""
 HEU.persona_event.127.a:0 "All that day, Aru couldn't forget the boy's eyes."

 HEU.persona_event.128.t:0 "Shooting Practice"
 HEU.persona_event.128.desc.a:0 "Bang! Bang!\n\nUnlike back in Kivotos where she always carried a sniper rifle, Aru changed her weapon to a pistol on the grounds that locals feel uneasy. She occasionally came out to the forest to set up targets and practice shooting... is it because her condition isn't good? Not a single pistol bullet hit.\n\n\"At this rate, I'm neither hard-boiled nor an outlaw...\"\n\nAru grumbled and put the gun in her pocket."
 HEU.persona_event.128.desc.b:0 "Bang! Bang!\n\nUnlike back in Kivotos where she always carried a sniper rifle, Aru changed her weapon to a pistol on the grounds that locals feel uneasy. She occasionally came out to the forest to set up targets and practice shooting... is it because her depth perception is gone due to being blind in one eye? Not a single pistol bullet hit.\n\n\"As expected, with one eye... I can't match the depth perception.\"\n\nAru grumbled and put the gun in her pocket."
 HEU.persona_event.128.a:0 "It's an unlucky day."

 HEU.persona_event.129.t:0 "Cold"
 HEU.persona_event.129.desc:0 "\"...So while you were reading an economics book all night...\"\n\"I think I caught a cold...achoo!\"\n\nI thought the night air was cold that day, it seems the boarding house window was slightly open. After reading a book all night while being hit by the cold wind, I caught a cold just like that. While lying on the hard boarding house sofa with a rag used as a blanket, Aru groaned and clutched her forehead.\n\nAfter Haruka placed a wet towel on Aru's forehead, she seems to feel a bit better. Still, it seems I won't be able to recall any of the content I studied last night.\n\n\"Aru-sama, please rest comfortably today. ...If Aru-sama is sick, who will protect Handyman 68...\"\n\"Sorry... I'll try to get better soon.\""
 HEU.persona_event.129.a:0 "Why can't a body that's fine even when hit by bullets beat a cold..."

 HEU.persona_event.1000.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1000.desc:0 "Back in Kivotos, I didn't touch alcohol. In the first place, I was a minor in terms of age. However, these days in Luxembourg, I couldn't fall asleep at night without drinking alcohol... I thought the insomnia symptoms would be temporary, but every time I lay in bed, my heart pounded and my body stiffened as if paralyzed.\n\n\"...Canned beer. Just one beer...\"\n\nAru took out a cheap black market canned beer from the refrigerator, drank it all at once, and lay down on the boarding house sofa. At least if I have this alcohol, I think I can fall asleep tonight."
 HEU.persona_event.1000.a:0 "Despair, more despair"
 
 HEU.persona_event.1001.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1001.desc:0 "What if I hadn't been born? The employees of Handyman 68 wouldn't have had reason to fight each other. In the first place, Mutsuki wouldn't have harbored a guilt like 'I'm sorry for just watching you being terrorized.' Kayoko... might have been in a high position in the Gehenna Prefect Team. Haruka would have been bullied longer... but eventually transferred to a better school and lived a normal life.\n\nThen what.\n\nIt means I was born and made the three people of Handyman 68 unhappy."
 HEU.persona_event.1001.a:0 "I shouldn't have been born."
 
 HEU.persona_event.1002.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1002.desc:0 "While filling a revolver with bullets, Aru lightly turned the cylinder with her fingertips, aimed it at her head, and pulled. Classic Russian roulette. If there's one different point, it's that all six chambers are filled with bullets. Bang, bang, bang. Bullets hit her temple several times, and crumpled bullets rolled onto the floor.\n\nBeing a Kivotos person is truly an unhappy existence. Right?\n\nAru burst into laughter and threw away the empty revolver."
 HEU.persona_event.1002.a:0 "The suicidal urge is still bearable."
 
 HEU.persona_event.1003.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1003.desc:0 "Because of gloomy feelings, I can't do any work today.\n\nAru lay on the roof of the Regent's palace and looked up at the clear sky.\n\nIf I fall from that high sky, if I am shattered into pieces, maybe I could become happy.\n\nI don't even have the will to do that today."
 HEU.persona_event.1003.a:0 "The suicidal urge is still bearable."
 
 HEU.persona_event.1004.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1004.desc:0 "Depressive disorder or whatever. Aru didn't particularly think her spirit was breaking down. She just started relying on alcohol unlike before, insomnia came, she occasionally felt suicidal urges, and felt guilt toward all the people around her.\n\nToday was the turn for guilt. Aru leaned her back on the sofa with her eyes closed. The dead Grand Ducal family, the appearance of Handyman employees fighting each other, and the faces of the Nazis who struck her with hammers passed by in order.\n\nBecause I exist, all these people are becoming unhappy.\n\nWhy am I able to sit in such a comfortable chair?"
 HEU.persona_event.1004.a:0 "I really don't know."
 
 HEU.persona_event.1005.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1005.desc:0 "\"Your Highness?\"\n\nÉmile Speller, the Gendarmerie Chief who was reading a military report, asked back after discovering Aru's appearance of staring blankly at the wall. Oops. Aru squeezed her eyes shut and opened them. Strangely, her concentration was continuing to drop lately. To the extent that even hearing and reading military reports became difficult. Aru spoke while lightly pressing and releasing her temple.\n\n\"Sorry. It seems I'm a bit tired. ...How far did you speak?\""
 HEU.persona_event.1005.a:0 "Is my head stiffening?"
 
 HEU.persona_event.1006.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1006.desc:0 "I have to go to work.\n\nMy whole body is lethargic.\n\nWhy I have to go to work.\n\nWhy I have to go there and sign papers and read documents, I don't know either.\n\nThere's no one who would be inconvenienced even if I'm gone, right?\n\nSleep. Let's fall asleep. Aru took out a beer from the refrigerator and drank. I don't know how many cans I drank. I think I drank until I fainted. The important thing is that I could fall asleep regardless."
 HEU.persona_event.1006.a:0 "Good night."
 
 HEU.persona_event.1007.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1007.desc:0 "Charlotte-san. I saw your dead appearance and remained in Luxembourg. I hoped such a tragedy would not happen on this land again. But was I a person who had such an ability.\n\nRikuhachima Aru, the Handyman president. Even while making business cards and carrying them around as if I were great, I could not satisfy either Luxembourgers or Kivotos people. I didn't even have the charisma to seal the conflict of those people.\n\nEverything is my sin."
 HEU.persona_event.1007.a:0 "Heavy guilt"
 
 HEU.persona_event.1008.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1008.desc:0 "\"Today Aru-sama is personally making dinner...! I'm really looking forward to it!\"\n\nListening to Haruka's expectant voice from behind her back, Aru slowly took up a paring knife. Kivotos people don't die by guns. But what if one holds the wrist with a paring knife and draws a long vertical line? It's said that excessive bleeding is *one of the few* ways to kill a Kivotos person.\n\nIf I die here. Wouldn't Haruka also be happy? She might even laugh and kick my corpse until it rolls into the trash can, saying the president who only consumes oxygen uselessly has disappeared. Then. Moving the tip of the knife. Slowly. Toward the artery.\n\n\"Aru-sama?\"\n\n\"Huh? Uh? Ahaha. I couldn't recall the recipe. Wait just a moment.\""
 HEU.persona_event.1008.a:0 "Not today."
 
 HEU.persona_event.1009.t:0 "Rikuhachima Aru's Depressive Disorder"
 HEU.persona_event.1009.desc:0 "\"Ha, holy shit for real.\"\n\nWhile pushing away a pile of canned beers rolling on the boarding house floor with her foot, Aru sat on the sofa and opened a new canned beer. There are documents to be processed. But her head wouldn't move at all. As if her brain itself had melted, strangely she couldn't read the text in the documents. Aru's choice was alcohol.\n\n\"It's about time I come to my senses.\"\n\nAfter drinking canned beers consecutively until she became intoxicated, Aru placed a bundle of documents on the coffee table. Her right arm, which was underlining the documents, continued to tremble as if in convulsion."
 HEU.persona_event.1009.a:0 "The text... looks like... two...?"

 HEU.persona_event.2000.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2000.desc:0 "\"It's too late to beg for your life now, Prefect Team Leader!\"\n\nAru shouted toward the air. A virtual enemy, the Gehenna Prefect Team Leader. The wall Aru could never overcome before the Grand Transfer. But not in the world of imagination. Aru pretended to twist her body nimbly, acting out avoiding bullets fired by the virtual Hina. Even making groaning sounds while being grazed by bullets with her mouth.\n\n\"This kind of attack is nowhere near enough? You think you can beat me, the strongest hard-boiled outlaw, with that much?\"\n\nNow! A cool knife-hand strike like a yakuza from a hard-boiled movie. After that, jumping while kicking the floor, a high kick to where Hina's head would be. And Aru plopped down on the sofa. As the cushion on the sofa was crushed into a mess, Aru muttered Hina's line like a 1-person-2-roles performance. \"......Ugh, Rikuhachima Aru... you are, too strong...\"\n\nAs the cushion that hit Aru's serious high kick collapsed onto the floor, Aru wiped her sweat and breathed heavily.\n\n\"Hmph! Only now you submit? Yes. Gehenna is taken over by me starting today!\"\n\nShe took a victory pose while pretending to flutter her coat. Thump. Thump. Her heart beat wildly. It was a perfect victory. But her gaze, which was savoring the lingering heat of victory, suddenly turned toward the firmly locked metal door. That door Aru alone could never open. That very door Mutsuki locked with a smile, saying 'It's for Aru-chan's sake☆'. And the guards on patrol who would be waiting beyond that door.\n\n\"......Ha, holy shit.\"\n\nAru plopped down on the sofa just like that.\n\n\"I, who can't take even one step out of the safe house...\""
 HEU.persona_event.2000.a:0 "\"How could I... beat Hina...\""
 
 HEU.persona_event.2001.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2001.desc:0 "Air where the scent of sunlight faintly lingers. Sunlight that leaked through the gaps of the window with iron bars stretched long on the floor. While burying her body in an old sofa, Aru slowly turned the pages of a thick book. The title is 'In-depth Management Theory That Would Even Surprise Max Weber'. It's a crude book written by an internet streamer author who didn't even graduate from an economics department, while tapping a generative AI, which wouldn't even surprise Max or Marx. But the books Aru could choose in this boring space were not very many. I can't even go shopping outside, right?\n\nReally, it would be nice if I could just go out.\n\nAru's consciousness kept being pulled to the space beyond the book, into the silence that filled this safe house.\n\nSilence.\n\nIf it were normal, around this time, she would have heard Mutsuki's 'Kuhu-hu' laughter, or Haruka would have talked to an insectivorous plant while watering it, or Kayoko would have scolded Aru, saying 'Don't buy such a useless book written by a non-expert who doesn't even know economics.' It was noisy, hectic, and sometimes a mess... such daily life was Aru's natural background music. Will that background music which stopped be able to play again? Will the broken record turn and the stopped clock hand dance again? Aru stroked her eye which could only see one side. A bit of tears came out."
 HEU.persona_event.2001.a:0 "\"This book... is tear-jerkingly unfunny.\""
 
 HEU.persona_event.2002.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2002.desc:0 "Silence where dust has settled. A safe house where Mutsuki locked the door and guard troops roam outside. Naturally, it's boring to a terrible extent. Internet? No way it would work. TV? It's fixed on the Millennium baseball broadcast. Oh God! Rikuhachima Aru, who is buried deep in an old sofa, yawned long and tossed and turned. If one can't escape from the confinement life, shouldn't one at least make me not want to escape? Mutsuki?\n\n\"I'm going crazy...\"\n\nTalking to herself, the words circled the empty room for a moment and then died away. She tried crossing her legs to maintain her 'aristocratic' dignity in her own way, and tried taking a serious expression while leaning her chin on the sofa armrest, but such acting was meaningless in this place where no one was. In the end, Aru couldn't bear it and picked up a toy dagger. A cool sensation wrapped around her palm.\n\n\"Mutsuki. If I meet you later...!\"\n\nAru immediately threw the knife using the snap of her wrist. Pick, pick, the flying toy daggers accurately hit and broke the teacups and plates on the dresser one by one. Crash-! Crash-! The sounds heard in succession made Aru happy. Yes. I said my skill hasn't rusted.\nAru laughed excitedly once and then suddenly stopped laughing. It hasn't rusted. But so? Does throwing this toy dagger enable me to get out of here? Who knows. Aru lay down on the sofa."
 HEU.persona_event.2002.a:0 "\"Well, as long as I threw the dagger well.\""
 
 HEU.persona_event.2003.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2003.desc:0 "The daily life in the safe house is similar to a hamster turning a treadmill. Because no matter if the hamster runs tens of thousands of kilometers or light years, it cannot escape the treadmill. Aru spent time lying on the bed staring at the ceiling, having lost her motivation. Then suddenly, her gaze reached the coffee grinder and dripper set placed in a corner of the room. It's one of Mutsuki's 'gifts.' Like how much Aru likes coffee.\n\n'Still, it would be better than playing?'\n\nStarted with no special reason, just for the purpose of soothing boredom. At first, she used to make Ako Administrator-level coffee because she failed to control hot water. Every time, if she handed over an empty coffee bean container to the guard monitoring the safe house with an expressionless face, new coffee beans were replenished before long. Long live Shogun Mutsuki.\n\nCoffee that only tasted bad at first also gradually started giving out a deep flavor and aroma recently. If she gets a job in the Prefect Team, she might be able to become the coffee person instead of Ako. Aru sat on the sofa while faintly laughing. It seems this confinement life is not giving Aru nothing at least."
 HEU.persona_event.2003.a:0 "\"A cup of warm coffee.\""
 
 HEU.persona_event.2004.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2004.desc:0 "\"President Aru. Today an enormous giant mission has come in! 100,000 yen for the head of one mafia fellow!\"\n\"Sigh. Haruka. 100,000 yen. Such a large amount is clearly a scam.\"\n\"Hey! Kayoko! If you only look at reality so darkly, how can you be called the brain of Handyman 68? This is proof that the skill of our Handyman 68 has finally started to be recognized!\"\n\nSafe house sofa. Aru wore 'Haruka gloves' and 'Kayoko gloves' and performed an adventure story for Handyman 68, acting out Haruka and Kayoko by herself while flapping the mouths of the gloves. 1 person 3 roles. Handyman 68 was still active within Aru's hand. In this small safe house, Aru was unfolding an adventure story for Handyman 68 while reviving past memories.\n\nEven if it is an adventure story that only exists in Aru's head and does not exist in reality."
 HEU.persona_event.2004.a:0 "...Wasn't there one more person? Haruka. What nonsense are you saying?"
 
 HEU.persona_event.2005.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2005.desc:0 "The calm daily life of the safe house was briefly broken at the time of the guards' rotation. When a new guard arrived with regular footsteps, they checked various parts of the house under silent surveillance. As if re-confirming the walls of an invisible prison every time, checking if there were traces of Aru attempting to escape, and if there were abnormalities in the locking devices. Usually, Aru ignored them bluntly, but.\n\n\"You must be working hard every time.\"\n\nToday was different. At Aru's unexpected words, the guard stopped moving for a moment and turned back to her. It was a short moment, but a surprise along with an unknown emotion was contained in his gaze. Soon he gave a short nod of thanks while bowing his head slightly toward Aru. Not everyone who was confining Aru disliked Aru. Just... there were more who moved according to a giant system and orders. Aru didn't want to hate even them."
 HEU.persona_event.2005.a:0 "Not very hard-boiled either."
 
 HEU.persona_event.2006.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2006.desc:0 "Tap! Ta-dak tap!\n\nTime is what's left. No, too much time is what's left. Lately Aru was immersed in dance practice at the safe house. It's not because she became interested in dancing. Well, it means what else would I do if not this. The dance she's practicing lately is an idol dance. While listening to the sound flowing from an old audio tape, the song MiLiero, Aru continued to move her tiptoes. Although the movement could not be said to be complete yet, bit by bit, Aru's posture was becoming much better."
 HEU.persona_event.2006.a:0 "MiLiero."
 
 HEU.persona_event.2007.t:0 "Aru-chan's Very, Very Long Vacation Life!"
 HEU.persona_event.2007.desc:0 "Aru looked into the book 'An Actor Prepares' by Konstantin Stanislavski. It was a theater introductory book from the 1920s Soviet Union. Construction of character, promise on stage, communication with the audience. Strangely, a familiarity was felt.\n\nAru closed the book for a moment and stood in front of the mirror. And as her past self did, she spoke confidently while tilting one corner of her mouth.\n\n\"Fufu. Just leave it to me. Where is the request I can't solve.\"\n\nFunny. Aru lowered her arms helplessly. Hard-boiled.\n\nThe past days when she had created Rikuhachima Aru by following cool lines or gestures of outlaws she saw in movies and such. Wasn't that also a kind of play. She just performed the hard-boiled script within the role of Handyman 68's president. 'Now! Then Aru-chan. Where is the real Aru-chan?' In Mutsuki's tone, while asking herself, Aru stared blankly at the strange one-eyed girl in the mirror."
 HEU.persona_event.2007.a:0 "Well, if I keep staring into this acting book, maybe I'll find the answer."
 HEU.persona_event.2007.b:0 "Perhaps repeating this silly performance at the mirror will lead to something."
 
 HEU.persona_event.2008.t:0 "Aru-chan's Very, Very Long Vacation!"
 HEU.persona_event.2008.desc:0 "Time here has taken many things from Aru, but it couldn't take away her morning makeup routine. No, she refused to let it be taken. She had no intention of giving up her 'daily life' entirely. Aru gently stroked her cheek with the hand holding the foundation.\n\n\"...Even if there's no one to see me.\"\n\nIt wasn't because of some 'hard-boiled' reasoning. This was simply a self-proof that Rikuhachima Aru had not broken. With practiced movements, she drew her eyeliner and calmly applied a coat of red lipstick.\n\n\"Fufu. Well, I'm still me.\"\n\nBeneath long eyelashes, deep darkness still lingered in the eye—the only real one left—but even so, the Aru in the mirror was beautiful. She liked that fact, just a little, a very little bit. Aru smiled slightly at the mirror."
 HEU.persona_event.2008.a:0 "...It would have been nice if there was someone to see me like this."
 HEU.persona_event.2008.b:0 "Still, as long as I'm happy, isn't that enough?"
 
 HEU.persona_event.2009.t:0 "Aru-chan's Very, Very Long Vacation!"
 HEU.persona_event.2009.desc:0 "Perhaps the time spent here is just a mere dream. Today, Aru thought so. Mutsuki, who treasures her, imprisoning her? Fighting a battle against Kayoko? Ahaha. It makes no sense. This is just a simple, truly simple hallucination or fantasy created by a dream—a secondary creation of the ego.\n\nAru closed her eyes tight, really tight, and then opened them, hoping to wake up from this dream.\n\n\n\nThe steel door of the safehouse was still there."
 HEU.persona_event.2009.a:0 "...A sense of despair washes over me."
 HEU.persona_event.2009.b:0 "But, I want to overcome this despair."

# End of Persona Events
#{{ Beginning of Mutsuki Events
 HEU.mutsuki_event.1.t:0 "A Single Bullet"
 HEU.mutsuki_event.1.desc:0 "Bang—! The day a stone thrown by the anti-Aru protesters shattered the window and hit Aru in the back of the head. Despite the efforts of Haruka and Aru to stop her, Mutsuki aimed her gun at the protesters and fired. Those with halos over their heads won't die from a bullet or two anyway. Unless they were tortured for a long time with hammers and all sorts of weapons, just as those filthy bastards did to Aru.\n\n\"Shit.\"\n\nReturning home that night, Mutsuki felt her eyes grow wet with tears as she climbed onto her motorcycle. It was a bike she bought after Aru was lynched on the street, just to shorten the 10-minute commute to the Grand Ducal Palace by even a second. Yet, this motorcycle was also used to take Mutsuki away from Aru. It felt truly ironic. She had to protect Aru, so why was she using this tool to distance herself from her?\n\n\"Mutsuki-sama.\"\n\nAt that moment, several Gehenna girls approached Mutsuki. Was this retaliation for the shots fired during the day? Mutsuki smiled faintly, reaching for the pocketknife in her inner coat pocket. However, the response she received was not hatred, but alignment.\n\n\"We are 'General' employees of Problem Solver.\" General employees? Ah. Those private soldiers Aru had gathered after the Great Transition. \"Persuading them with words, holding forums... that was wrong from the start. They don't listen to us. To protect Aru-sama, we need a faster, more certain method. Like today.\"\n\nLike today? Mutsuki pondered for a moment, then pulled her hand back without grasping the knife. \"So, you're saying we should just shoot?\"\n\"Yes. Just one shot, a single bullet, and all of this... will be resolved. You know it too, Chief Mutsuki. That Aru-sama is far too weak to solve this problem herself.\""
 HEU.mutsuki_event.1.a:0 "\"Yeah. Right. Why didn't I think of that from the start?\""

 HEU.mutsuki_event.2.t:0 "Because I Like You, Like You, Like You, Like You So Much"
 HEU.mutsuki_event.2.desc:0 "I like you. I don't know if I like you romantically, as a friend, or out of admiration. I don't think any of those words can fully express it. My soul chases yours. To follow what you wish to do, I follow you like Pluto in a world surrounded by darkness—knowing that even in infinite cold and eternal void, I cannot reach you, yet unable to abandon you, my Sun. I know the distance between us will never close, and you will never look back at me. But even in the chilling cold of the first lunar month (Mutsuki), I know you are there in the faint streak of light across the cosmic void. You will never understand why I act this way. It's like how Mercury and Mars may be visible beside the intensely shining Sun, while Pluto is too far and too small to be seen. But I hope you understand my heart, which wishes for even the flicker of distant Pluto to be recognized.\n\n\"...\"\n\nAru put down the letter. Of all the 'Coup Manifestos' she could have experienced in her life, this was the most literary—no, the most bewildering declaration. It contained no motive for the coup, nor any future plan for what to do after the takeover. There was only the confession that Mutsuki was Pluto looking at Aru, and Aru was her Sun. With her hand, which didn't move well due to her disability, Aru folded the letter into quarters and set it on the desk in front of Mutsuki. Mutsuki's motive was read not in this long-winded letter, but in her eyes.\n\nA long conversation wasn't necessary for the two of them. Aru asked only one thing: \"Can you handle it?\"\n\nMutsuki shook her head. \"I think it'll be hard. But, I want Aru-chan to remain my hero and my Sun.\""
 HEU.mutsuki_event.2.a:0 "\"I will become Pluto—unable to reach you, yet eternally orbiting your side.\""

 HEU.mutsuki_event.3.t:0 "Midnight Coup - 1"
 HEU.mutsuki_event.3.desc:0 "Near the Grand Ducal Palace, Gehenna soldiers with halos bound the Gendarmerie guarding the palace with ropes and took them prisoner. No deaths occurred, but had those haloed soldiers brought real guns instead of baseball bats, the Gendarmerie would have been slaughtered again. The baseball bats were a message: 'You can't stop this anyway.'\n\nA coup. Emil Schüpfer, the Commander of the Gendarmerie, sent a MomoTalk message to Kayoko and Haruka with trembling hands before boarding a truck.\n\n\"It's a coup! A coup! Send all available forces to key facilities in Luxembourg City!\"\n\nGeneral Consbruck, who had just rushed out, asked back.\n\n\"A coup? Who would... when General Schüpfer, the Chief of Staff, is right here?\"\n\"Asagi Mutsuki!\"\n\"...My God. Is it Gehenna again?\"\n\nRecalling the memory of the local army being 'massacred' by the haloed girls on the day of the Great Transition, Consbruck felt an unbearable fear and an urge to desert.\n\nOf course, Schüpfer's fear was even greater. The Grand Ducal Palace had already been seized in a surprise attack. Setting out now would hardly change the situation."
 HEU.mutsuki_event.3.a:0 "...Will we survive?"

 HEU.mutsuki_event.4.t:0 "Midnight Coup - 2"
 HEU.mutsuki_event.4.desc:0 "\"A coup... Mutsuki couldn't do this to us...!\"\n\nKayoko knew Mutsuki's mental state had been unstable lately. She knew the public ridicule and insults had worsened after Aru's defeat at the forum. She knew Mutsuki would spend hours alone, repeatedly watching the broadcast of the forum where Aru was laughed at by the audience.\n\nBut a coup? She never imagined she would go this far. Kayoko tried to join the Gendarmerie near the Palace to storm the building. But the odds were too overwhelming.\n\nMutsuki, seemingly wary of being 'hated by Aru,' was blocking access to the Palace with almost blatant use of non-lethal weapons like rubber bullets. But just because they were rubber bullets didn't mean the situation was laughable. In the urgency of the coup, all heavy weaponry had been seized by Mutsuki, and the gathered Gendarmerie had nothing but pistols and rifles. And generally, people from Kivotos don't die—or even get hurt much—from things like that. If Mutsuki's patience snaps and she brings in the artillery, it will be a simple slaughter.\n\nKayoko grabbed General Schüpfer.\n\n\"Let's retreat to the north for now.\"\n\"Her Highness is inside! We must push further!\"\n\"With what?! Haruka and I are the only ones here with halos!\"\n\"Are you saying we should give up on Her Highness? ...Just like during the Great Transition?\"\n\nShe could understand Schüpfer's rage. On that day, he was one of the few soldiers who had witnessed the massacre of the Ducal family inside the Palace alongside Aru. Kayoko spoke as calmly as possible.\n\n\"...Mutsuki, at the very least, won't kill Aru. She never would. Retreating to the forest and forming a guerrilla force with local police is the only rational move. If we're all caught here, who on earth will save your *Highness*?\"\n\"...Sigh. Damn it! ...Fine. Let us retreat first.\"\n\nHaruka spoke in a tearful voice.\n\n\"Th-then, what should I do? L-leaving Aru-sama here...\"\n\"Haruka, you stay here. Unlike me, you haven't earned Asagi's hatred. If you surrender quickly, you can stay by President Aru's side. Please. ...Protect the President.\""
 HEU.mutsuki_event.4.a:0 "Haruka nodded."

 HEU.mutsuki_event.5.t:0 "Safe Zone"
 HEU.mutsuki_event.5.desc:0 "\"Kuhuhu, Aru-chan. Remember? When we first started the office and had no money, we slept in a tent in the park.\"\n\nIn the bedroom of the safehouse where the sunlight filtered in softly, Asagi Mutsuki sat on the edge of the bed and gently stroked the hair of Rikuhachima Aru, who lay beside her. In this space completely cut off from the outside world, her voice sounded unusually tender and cheerful. Aru had heard from Mutsuki that her coup was successful. Well, it probably wasn't a lie. If it were, Kayoko would be here, not Mutsuki. Mutsuki felt infinite happiness just from being alone with her 'truly, truly favorite' Aru.\n\n\"It was so hard back then, but thinking about it now, it's all a fun memory. The four of us sharing one bowl of ramen, running all over town for some trivial request... Ah! When we wiped out those Helmet Gang guys, that was really satisfying, wasn't it? Aru-chan's sniping was so cool. As expected of our President.\"\n\nMutsuki intentionally picked out only the brightest and most enjoyable moments, chatting excitedly like a child telling a fairy tale. But Aru's thoughts were elsewhere. What should I do in this situation? Resistance. She could understand with her head that Mutsuki did all this for her sake. But her heart could not accept that Mutsuki had crossed the line she shouldn't have. Aru tried to force Mutsuki away. But the moment she saw the tears in Mutsuki's eyes, Aru could do nothing. Mutsuki rubbed her cheek against Aru's while crying.\n\n\"I'm doing this for Aru-chan. Even if no one else knows, Aru-chan should know...\""
 HEU.mutsuki_event.5.a:0 "A gentle and suffocating love."

 HEU.mutsuki_event.6.t:0 "Proclamation"
 HEU.mutsuki_event.6.desc:0 "Proclamation of the Grand Duchy of Luxembourg\n\n1. For the protection of Her Highness Rikuhachima, Regent of the Grand Duchy of Luxembourg, and the suppression of anti-establishment National Socialists, [GetDaetText] all constitutions of Luxembourg are hereby suspended.\n2. Parliament is adjourned indefinitely. All political parties are allowed to exist, but all parliamentary activities, including extraordinary and regular sessions, are suspended.\n3. All cabinet members of the new government shall be appointed by Asagi Mutsuki."
 HEU.mutsuki_event.6.a:0 "Government Proclaimed"

 HEU.mutsuki_event.7.t:0 "Neutralizing the Right-Wing Party"
 HEU.mutsuki_event.7.desc:0 "There were predictions that purges and massacres of politicians would occur following the coup. After all, Speaker of Parliament Richter had even written a suicide note immediately after Mutsuki overturned the government. But the expected 'massacre' did not happen.\n\nClosing of Parliament. Banning of political activities. Dissolution of the Right-Wing Party. Political oppression was carried out thoroughly, but not even the smallest persecution was inflicted upon the Right-Wing Party members who had acted most maliciously to defeat the Civil Rights Act. Only Richter, the Speaker, and Bech, the Prime Minister, were placed under house arrest.\n\n\"...What does the new regime even want?\"\n\nRichter stood by the window and fell into thought. He wasn't a psychologist. He didn't have the ability to read people's minds. But he could guess the reason based on the version of Asagi Mutsuki he had seen so far.\n\nMutsuki fears being hated by Aru.\n\n\"...She commits a coup and imprisons Aru, yet she worries that Aru might grow to dislike her.\"\n\nThat must be why she minimized political retaliation and began a 'moderate' dictatorship. Richter felt a small laugh escape him. A pathetically naive girl.\n\nOf course, he couldn't just laugh. Richter's life was essentially 'borrowed' now. If that woman's heart changed for any reason, no one could guarantee Richter's life. And what if he snuck out of his house at night and fled abroad? Even if Mutsuki fell from power, his political life would be over. Richter hesitated for a moment before closing the curtains again."
 HEU.mutsuki_event.7.a:0 "\"Let's stay here. Luck will be on my side.\""

 HEU.mutsuki_event.8.t:0 "Wilhelm's Panic Shot"
 HEU.mutsuki_event.8.desc:0 "As a former Emperor of a nation, Wilhelm II surely possessed the sophisticated rhetoric and negotiation skills needed for dealing with rebels. He had come here following the government's polite request to lead peace negotiations based on that judgment, but Wilhelm II himself was at a total loss as to what to say in this situation. Had it not been for his vain and impulsive personality, he wouldn't have received such a request in the first place. Wilhelm spun a pen around his finger as he met the sharp gaze of Kayoko sitting across the negotiation table.\n\nWhy are Kivotos women's facial expressions so terrifying? No. Is it just this woman who's scary? Panic, panic, panic shot...\n\n\"...Do you plan on just sitting there?\"\n\"No! I was just reflecting on the peace negotiation terms you provided. Let's look at them again. What you desire is the immediate release of the Regent?\"\n\"Nothing else. We won't even ask you to step down from power. We want Aru.\"\n\"That is difficult. If the government does not protect the Regent, where is the legitimacy of the current government to be found?\"\n\nThough terrified and tense, as an Emperor, Wilhelm had not forgotten the most critical point. Mutsuki might have imprisoned Aru out of a desire for possession. However, for the 'Mutsuki Government,' the existence of the imprisoned Aru was legitimacy itself.\n\nA cabinet with the duty to 'protect' the monarch. If the monarch disappeared from that cabinet, all that would remain for Mutsuki is the infamy of a rebel leader. Kayoko let out a deep sigh and exchanged a few words with the Luxembourgish officers sitting beside her. Then, Kayoko stood up.\n\n\"Then the negotiations are over. However... at least we know you want 'negotiation' rather than war. I appreciate that much.\""
 HEU.mutsuki_event.8.a:0 "\"...I hope you bring better negotiation terms next time.\""

 HEU.mutsuki_event.9.t:0 "Luxembourg Divided"
 HEU.mutsuki_event.9.desc:0 "Luxembourg has been divided. Onikata Kayoko cannot tolerate Asagi Mutsuki's control over the government, and Mutsuki is enraged by Kayoko's betrayal. Fortunately, both Mutsuki and Kayoko are aware of what happened in Luxembourg City immediately after the Great Transition and are avoiding bloody conflict.\n\nKayoko has barricaded herself in the northern forests of Luxembourg with her supporters. Mutsuki is observing her, more for Aru's sake than for Kayoko's. Of course, how long can this observation last?\n\nOur military experts believe Kayoko's holdout will last at most a year. That year is the maximum limit Kayoko can 'endure' with her food supplies. Kayoko surely knows the limit of her remaining time and will prepare to march back to Luxembourg City. Even if her chances of victory are slim."
 HEU.mutsuki_event.9.a:0 "\"Come if you dare.\""

 HEU.mutsuki_event.10.t:0 "Tragic Street Fighting"
 HEU.mutsuki_event.10.desc:0 "Mutsuki tried to refrain from large-scale engagement as much as possible to prevent Aru from being 'saddened' further by the conflict with Kayoko. However, the situation did not unfold as Mutsuki intended. Kayoko emerged from the forest, equipped with all the conditions to march on Luxembourg City: weapons, a plan, and more 'volunteers' composed of local residents.\n\nEventually, street fighting broke out again on the outskirts of Luxembourg City. The urban combat, more intense than what occurred immediately after the Great Transition in 1935, ended in an overwhelming victory for Mutsuki, but it resulted in many casualties. Onikata Kayoko was arrested and placed in detention, and the rebellion ended in the most violent way.\n\nDespite Mutsuki's intention not to relay this information to Aru, the fierce fighting on the outskirts of the city made Aru realize 'something' had happened. Aru's anger and helplessness grew even further."
 HEU.mutsuki_event.10.a:0 "I didn't want this."

 HEU.mutsuki_event.11.t:0 "Surrender of the Resistance"
 HEU.mutsuki_event.11.desc:0 "Mutsuki tried to refrain from large-scale engagement as much as possible to prevent Aru from being 'saddened' further by the conflict with Kayoko. Mutsuki focused on crushing Kayoko's hope that she could win by marching on Luxembourg City, and Kayoko eventually judged that her chances of victory were slim.\n\nIn the end, with all food supplies exhausted, Kayoko decided to surrender. Of course, not everyone accepted the surrender. Some rebels deserted rather than accept the news, and conversely, voices within the government are protesting against the suppression of the rebels through peaceful procedures rather than military force.\n\nBut regardless, the division of Luxembourg has ended."
 HEU.mutsuki_event.11.a:0 "...Is it really over?"

 HEU.mutsuki_event.12.t:0 "The Planless Council"
 HEU.mutsuki_event.12.desc:0 "The new cabinet was filled with Kivotos personnel. The framework of the nation called Luxembourg has collapsed, and Luxembourg is now nominally seized by Kivotos. However, there were no plans for what comes next. Public power in Luxembourg was still held by locals, the army was split in two, and Rikuhachima Aru remained imprisoned, with no intention of cooperating with Mutsuki.\n\nAn organization named the 'Countermeasures Council' was established, but in reality, this organization was nothing more than a 'Planless Council.' Aru was a cloistered monarch, and Mutsuki was the Shogun wielding power in her stead. But that Shogun did not know which direction they should be heading."
 HEU.mutsuki_event.12.a:0 "...Ah, seriously, this is no fun."

 HEU.mutsuki_event.13.t:0 "Protest of the Communist Party of Luxembourg"
 HEU.mutsuki_event.13.desc:0 "Luxembourg was divided in half, with citizens pointing guns at one another, but the largest party, the Right-Wing Party, was neutralized and unable to issue critical statements against the government. The only group able to move freely was the Communist Party of Luxembourg, which had a connection to Rikuhachima Aru for saving her life. Zenon Bernard, the leader of the Communist Party, offered a fairly cynical commentary on the division of Luxembourg, which bordered on civil war.\n\n\"None of this would have happened if it weren't for a certain silver-haired terrorist who led an army to occupy the Grand Ducal Palace.\"\n\nThe Communist Party's use of the word 'terrorist' caused a stir within the Mutsuki cabinet. While some argued that Bernard should be arrested and investigated, others urged caution, suggesting they should overlook the incident since the Communist Party had saved Aru's life. Of course, the final decision rested with Mutsuki."
 HEU.mutsuki_event.13.a:0 "Let's act like we didn't hear anything."
 HEU.mutsuki_event.13.b:0 "Bring him in. Let's show him what a real terrorist tastes like."

 HEU.mutsuki_event.14.t:0 "The Radical Liberal Party Marches"
 HEU.mutsuki_event.14.desc:0 "The largest liberal party in Luxembourg, the Radical Liberal Party (which isn't actually very radical), held significant political influence among the city's middle class. The Radical Liberal Party strongly condemned the current situation, citing the detention of Rikuhachima Aru as the cause. Despite all Radical Liberal Party members losing their official positions after the closure of Parliament, party members took to the streets of Luxembourg City carrying two banners: 'Release Rikuhachima Aru' and 'Demand an End to the Civil War.'\n\nWhile armed Gehenna citizens monitored the peaceful march, the protesters attempted to advance toward the Grand Ducal Palace, shouting 'Long live Regent Rikuhachima.' Since the Radical Liberal Party is supported by the urban middle class, any violent suppression of their organization would enrage the townspeople. Will the Mutsuki cabinet open the path for the protesters to shout in front of the palace and then leave? Or will they deploy Kivotos forces for a forced dispersal?"
 HEU.mutsuki_event.14.a:0 "Let them talk. They can't change anything anyway."
 HEU.mutsuki_event.14.b:0 "Sigh, a single blow from a baton will end this headache."

 HEU.mutsuki_event.15.t:0 "Justice Prevails"
 HEU.mutsuki_event.15.desc:0 "\"I don't particularly like that Regent. She claims to be for Luxembourg, but in the end, isn't she just another Kivotos invader?\"\n\nDamian Kratzenberg, a fascist leader in Luxembourg and a Greek teacher, spoke in a cynical tone during a drink with Pierre Prüm, a right-wing populist politician. Even as he poured a glass of red wine, Kratzenberg's cheeks were slightly flushed.\n\n\"But it's clear that woman acted 'for' Luxembourg. Unlike that silver-haired nutcase now.\"\n\"Is there something you want to say?\"\n\"I'm saying I don't think Rikuhachima did anything wrong enough to deserve being imprisoned like this. Of course, good people get rewarded and bad people get punished... I know such fairy tales don't happen in reality. However.\"\n\nKratzenberg drained his glass in one gulp. Clatter. The moment he set the glass down, the table shook slightly. Prüm's fingers, which were cutting the veal, momentarily stopped. The fascist leader's eyes seemed to flash for a second.\n\n\"Shouldn't we at least 'pretend' like the world is running justly? ...I lost my family during the Great Transition. My wife died. On that day, I could do nothing, just holding my breath while hiding my students under their desks in the Greek classroom.\"\n\nKratzenberg tapped the table with his fingertip.\n\n\"The person who 'tried to stop' people from dying in Luxembourg City that day is now imprisoned and used as a puppet. I don't like that. The person who tried to bridge the gap between Kivotos and us has become walking propaganda for Kivotos.\"\n\nActually, we don't even know if she's walking. She's locked up. Prüm listened to Kratzenberg's words bluntly. He was talking about a classic story of justice prevailing. A person who builds a bridge between Kivotos and the locals. Such a person should not suffer.\n\nOf course, for a simple populist like Prüm, he had no particular interest in the theory of justice Kratzenberg spoke of. What mattered was how to build a National Socialist regime by toppling the Asagi cabinet that had imprisoned Rikuhachima. Prüm asked indifferently.\n\n\"So, Mr. Kratzenberg, what do you think we should do?\""
 HEU.mutsuki_event.15.a:0 "\"We must rescue that Regent.\""

 HEU.mutsuki_event.16.t:0 "The Fool and the Genius"
 HEU.mutsuki_event.16.desc:0 "'Luxembourg is the only legitimate nation-state of the Germanic people,' 'We shall reclaim the territories of the Germanic people.' Confident propaganda began to appear throughout Luxembourg at Mutsuki's direction. Kayoko found the whole process amusing. Sitting in her prison cell, she found it simply entertaining to watch what kind of foolish things Mutsuki was doing in the name of 'for Aru.'\n\nAnd when Mutsuki came to see Kayoko, Kayoko quietly looked into Mutsuki's eyes.\n\n\"...Is it fun?\"\n\"...Well, not particularly fun.\"\n\nMutsuki leaned her back against the wall, looking at Kayoko with a somewhat lonely expression. A tired Mutsuki, whose usual humorous 'kuhuhu' atmosphere had vanished, replaced by a somber look. Kayoko hadn't expected to see Mutsuki like this.\n\n\"I'm just doing all of this for Aru-chan. To make Aru-chan a hero. But I also know Aru-chan doesn't want it. I thought at least you, Kayoko, would understand me.\"\n\"Did you think I would understand you killing people for Aru's sake?\"\n\"Countless people in this land treat Aru like an idiot. To make sure she's never mocked again, we have to create achievements worthy of that. You know that too, Kayoko.\"\n\"I know. But I also know Aru doesn't want that. Just as you do. ...Creating an achievement that Rikuhachima Aru doesn't want. Is that truly for Aru's sake?\"\n\nMutsuki just smiled faintly and shook her head. Mutsuki herself must know this bizarre game makes no sense. But she's simply reached a point where she can't back down now.\n\n\"I envy you, Kayoko. You always walk the right path. But even though I know this path isn't right... I can't step down now. Hey, Kayoko. If I finish all this and disappear, then by Aru's side, you—\"\n\"...Stop talking nonsense.\"\n\nKayoko let out a deep sigh."
 HEU.mutsuki_event.16.a:0 "\"This foolishness, stop it now while you still can.\""

 HEU.mutsuki_event.17.t:0 "General Strike of the Socialist Workers' Party"
 HEU.mutsuki_event.17.desc:0 "The Communist Party of Luxembourg is largely split into two parties. The 'Communist Party of Luxembourg' of Zenon Bernard and Karl Marx, who follow Stalinism. And the Socialist Workers' Party, which rejects Stalinism. There are differences, such as the Workers' Party having a much worse perception of Kivotos and being much more uncompromising toward the government, but both parties share the same perspective of radical class revolution.\n\nTherefore, when the Workers' Party threatened a general strike demanding the release of the Grand Ducal Regent, many Luxembourgish intellectuals took it as shocking news. This is true even though the Workers' Party stated that the fundamental purpose of this strike was not to 'protect the monarchy,' but to 'ensure Kivotos no longer holds and shakes our people's order as they please.' Viktor Bodson, a prominent politician of the Workers' Party, said at a press conference, \"The direction of the monarchy is decided by the people of Luxembourg, not by a foreign military dictator.\""
 HEU.mutsuki_event.17.a:0 "Who do you think you are, the 'representatives of the people'?"

 HEU.mutsuki_event.18.t:0 "Backlash from Right-Wing Party Organizations"
 HEU.mutsuki_event.18.desc:0 "The most representative 'anti-Aru' force, the Right-Wing Party, was placed under house arrest immediately upon the Asagi cabinet taking power, but its party organizations were not disbanded. The Right-Wing Party realized that Rikuhachima Aru, whom they had loathed, was a noticeably 'gentle' leader compared to other Kivotos leaders, and began to demand the return of Regent Rikuhachima in the situation where Parliament was forcibly closed.\n\nThe fact that they turned into ardent supporters of Rikuhachima Aru only after being trampled and destroyed was quite bewildering, but left-wing parties are cheering for the Right-Wing Party members' declaration of support for Regent Rikuhachima."
 HEU.mutsuki_event.18.a:0 "It's just a league of villains. Nothing more."

 HEU.mutsuki_event.19.t:0 "The Red-Brown Alliance"
 HEU.mutsuki_event.19.desc:0 "GEDELIT, the largest Nazism-leaning civic group in Luxembourg, harbored feelings close to hatred for Regent Rikuhachima and the left-wing parties. Therefore, the meeting held by former Prime Minister Pierre Prüm, a member of GEDELIT, at the Communist Party headquarters was shocking news to many intellectuals.\n\n\"What matters is not whether a person wearing a crown is sitting above our heads. It is a question of whether we decide our future or whether an invader with a gun decides it.\"\n\nPierre Prüm issued a 'Nationalist Manifesto' that received support from Germanic nationalists after the meeting with the Communist Party. He argued that while Asagi Mutsuki says she prepared the vision of a Germanic United Duchy 'for the Germanic people,' that vision of a national community was not decided by the Luxembourgers themselves, but is merely being used as propaganda by an external invader to justify her rule.\n\nPierre Prüm announced through the meeting with the Communist Party that GEDELIT politicians and the Communist Party of Luxembourg resolutely oppose the 'Luxembourg-led Germanic reunification' vision, that there must only be peace in Luxembourg, and that communists and national socialists can engage in any cooperation together for the sake of anti-war efforts."
 HEU.mutsuki_event.19.a:0 "...I hate you all. You villains."

 HEU.mutsuki_event.20.t:0 "Rescue Operation"
 HEU.mutsuki_event.20.desc:0 "Damian Kratzenberg was a Nazi. No. To use the expression he preferred, was it a National Socialist? The important thing was that for him, whether it was Rikuhachima Aru or other invaders, they were all just external occupiers. At least, that's what he thought until recently. Kratzenberg turned off the searchlights to avoid being caught by the haloed invaders while his car drove into the dark forest.\n\nRikuhachima Aru was different. At least, she couldn't be compared to the other idiots. She fought for everyone in Luxembourg. At least, she fought for those who died, not for the murderers of the Great Transition. Kratzenberg recalled his wife, who was killed on the street on the day of the Great Transition.\n\n\"Let's go.\"\n\nTwo of the most ardent Nazis stepped out of the car with Kratzenberg. The location of the safehouse was a secret, but it wasn't impossible to find out if you monitored where food was moving and where the Asagi cabinet's military vehicles were busy coming and going. Timing it for the middle of the night, Kratzenberg ran toward the safehouse clutching a pistol.\n\nIt is impossible for three civilians without military experience to overpower haloed infantry. However, they can momentarily distract them through a diversionary tactic. Two Nazis fired into the sky from a position away from Kratzenberg. The guards protecting the safehouse rushed toward the sound of gunfire, and in the meantime, Kratzenberg cut the iron bars blocking the safehouse window with a hacksaw he had prepared.\n\n\"Wh-who are you?\"\n\nAs the startled Aru approached the window, Kratzenberg looked at the red-haired Regent. Why was it? Even though they didn't look alike at all, Kratzenberg saw the image of his wife Lisa overlapping with her. Because she was an innocent victim? He himself didn't know. He broke the glass and reached out his hand to Aru.\n\n\"I've come to rescue you. To where Onikata's resistance is—\"\n\nAt that moment, a gunshot rang out. The guards who had killed the two Nazis returned. Kratzenberg realized they moved faster than he had thought. Damn it. As expected, no operation ever goes according to plan. He aimed his pistol into the darkness with the window still open.\n\n\"If only I had three more minutes... I would have succeeded.\"\n\"No, wait. You came to save me? If so, if it's already too late, just run away for now...\"\n\"I do not know how to run away in front of invaders.\"\n\nKratzenberg knew it was wise to follow Aru's word to flee. But. For some reason, leaving behind this girl who reminded him of his wife and surviving alone yet again felt too painful. Knowing it was meaningless, he blocked Aru through the open window with his body and pulled the trigger of his revolver until the bullets ran out toward the returning guards. Until the assault rifle bullets pierced Kratzenberg, and Aru's scream covered his falling body."
 HEU.mutsuki_event.20.a:0 "\"...I'm sorry.\""

 HEU.mutsuki_event.21.t:0 "The Failed Rescue"
 HEU.mutsuki_event.21.desc:0 "\"I'm sorry. Aru-chan. I... didn't want anyone who intruded here to die. The rule was to capture them alive... but those kids went ahead on their own.\"\n\nSeeing Mutsuki mumbling in the safehouse with her head bowed like a criminal, Aru just glared at her. Even while saying she was sorry, weren't the guards meticulously replacing the bars Kratzenberg cut with new ones? What an amusing story. Aru raised her hand and struck Mutsuki across the cheek with all her might. Her small head spun, and Mutsuki was thrown onto the cold wooden floor.\n\n\"Go back.\"\n\"But, Aru-chan.\"\n\"...Right now, I don't want to talk to you. Especially not right after someone died for my sake.\"\n\nMutsuki tried to say something, but eventually struggled to push herself off the floor and left the safehouse crying."
 HEU.mutsuki_event.21.a:0 "..."

 HEU.mutsuki_event.22.t:0 "GEDELIT Power Issues"
 HEU.mutsuki_event.22.desc:0 "Following the death of Damian Kratzenberg, GEDELIT, the largest Nazism organization within Luxembourg, suffered a major power vacuum. Pierre Prüm, a simple right-wing populist rather than a serious Nazi follower, appears to have seized the leadership of GEDELIT, but Nazis within Luxembourg are dissatisfied with Prüm's rule, as he lacks any affection for Hitler.\n\nWhile Damian Kratzenberg's death may be a tragedy for the Nazis inside Luxembourg, it is a significant step forward for national stability for the Asagi government. GEDELIT will not have enough strength to resist the Luxembourgish government for the time being."
 HEU.mutsuki_event.22.a:0 "..."

 HEU.mutsuki_event.23.t:0 "I Like French"
 HEU.mutsuki_event.23.desc:0 "Gaston, a twelve-year-old boy, has recently started enjoying going to school. Until now, French was treated as a language 'inferior to German' and an old-fashioned language to be 'erased' in the long run. But hasn't the Luxembourgish government recently said they would fully support the French language?\n\n\"My school grades are really bad except for French. But lately, the teacher praises me, saying 'It's a relief you're good at French.'\"\n\nAt Gaston's confident story, the shopkeeper in front of the school smiled broadly. Even if Luxembourg is a Germanic country, French is a language with a long history and tradition. The rising status of French will be a good thing for future generations as well.\n\n\"Study French hard. It is a language to be proud of.\""
 HEU.mutsuki_event.23.a:0 "Gaston laughed brightly."

 HEU.mutsuki_event.24.t:0 "Civil Rights Act Passed"
 HEU.mutsuki_event.24.desc:0 "With Parliament neutralized, the military government passed a new and even stronger Civil Rights Act. Nakajima, a Corgi beastman, watched the news of the act's passing on television. Many locals claim the Civil Rights Act is a law 'for the invaders.' But where is the 'invader' aspect in Nakajima, a simple grocery merchant?\n\n\"This is the right future. Yes. Our country.\"\n\nFor Nakajima, Luxembourg was no longer a country just for Germanic people. A new and advanced nation for us all. That was the country Nakajima found worthy of his patriotism."
 HEU.mutsuki_event.24.a:0 "Toward the future!"

 HEU.mutsuki_event.25.t:0 "Replacement of Civil Servants"
 HEU.mutsuki_event.25.desc:0 "\"How is it that these days, all the local civil servants are monsters with chicken, dog, or cat heads?\"\n\nGeorgi complained to his friend Ulrich as he left the post office. Ulrich nodded silently, understanding Georgi's anger. The Asagi cabinet had little affection for the locals. To the point where one could understand why even Right-Wing Party supporters were saying 'I miss Rikuhachima.'\n\n\"I heard Asagi issued a Kivotos quota for all public institutions.\"\n\"A quota? Just like that, they're cutting our people out? To sit those chicken-heads there?\"\n\"They are the victors. Not us.\"\n\"...It truly is a cursed world.\"\n\nGeorgi kicked a pebble on the ground. As if that was the maximum resistance and expression of anger he could muster."
 HEU.mutsuki_event.25.a:0 "Luxembourg is dead."

 HEU.mutsuki_event.26.t:0 "KAITENGER!"
 HEU.mutsuki_event.26.desc:0 "With important officers purged due to the internal rebellion in Luxembourg, Luxembourgish military authorities have decided to cooperate with an external organization for more efficient military command. That is... Kaitenger. Kaitenger has decided to participate in Luxembourgish military command and fight together for the 'spread of justice' through a compromise with Asagi Mutsuki.\n\nIt is expected that Kaitenger's superior abilities will fill the void left by key commanders such as Kayoko and Schüpfer. Whether Mutsuki actually harbors such expectations is another matter, but that is the content of the official document."
 HEU.mutsuki_event.26.a:0 "There really is no alternative."

 HEU.mutsuki_event.27.t:0 "Resignation of Joseph Bech"
 HEU.mutsuki_event.27.desc:0 "Prime Minister Joseph Bech took a calm breath as soldiers with guns detained him and confined him to his home. He was a reactionary, an anti-democrat, and he loathed Kivotos. Because of that, he felt all the more obligated to grace the end of Luxembourgish parliamentary justice with dignity. Not acting like a coward, but like an aristocratic gentleman.\n\nAsagi Mutsuki and Igusa Haruka were already waiting in Bech's home study. Bech received a paper from Haruka, prepared in advance, stating that he would delegate all authority to the Asagi cabinet and resign. Bech glared at the two for a moment before picking up a fountain pen.\n\n\"Why not just shoot me instead of this pointless formality?\"\n\nMutsuki said bluntly, \"...That wouldn't be fun.\"\n\"Fun, is it? Isn't it actually fear? Fear of Regent Rikuhachima, who still holds your leash even while imprisoned, looking at you with eyes full of hatred. ...If that's the case, I can understand your strangely timid behavior since the coup.\"\n\"Don't get cocky. Unless you want your neck snapped.\"\n\"Do you think I came here without being prepared for at least that much?\"\n\"What a truly unpleasant old man.\"\n\nBech placed the signed paper on the desk."
 HEU.mutsuki_event.27.a:0 "\"Are you satisfied now? Get out of my house at once.\""

 HEU.mutsuki_event.28.t:0 "The End of the Asagi Cabinet"
 HEU.mutsuki_event.28.desc:0 "Rikuhachima Aru attempted suicide. The reason was a shock to Mutsuki: Aru refused to be the hero in the snow globe Mutsuki had created. Mutsuki wanted Aru to be happy. But her actions had only made Aru suffer in the end.\n\nFollowing Aru's declaration of the Union Act, Mutsuki decided to dissolve her cabinet. Kayoko and Aru were released from detention. And Mutsuki decided to go to court herself through a voluntary surrender. While many expected Aru to take direct control of the government, Aru no longer wished to be directly involved in politics.\n\n\"It seems I have a talent for hurting others, after all.\"\n\nAru left only that one sentence. A sentence filled with sad emotions, stating she would no longer be directly involved in politics. And excluding the neutralized Right-Wing Party, the officials of the Asagi cabinet nominated Haruka as the next Prime Minister. Haruka does not like standing above anyone. In fact, she loathes it. Furthermore, Haruka's 'hatred of Gehenna' due to the bullying she received from Gehenna students was already famous. Haruka might be suitable as a military governor appointed by Trinity after conquering Gehenna, but she was far too 'narrow-minded' regarding racial issues to symbolize the harmony of Gehenna, Trinity, and local cultures.\n\nIn the end, everyone realized it. The Haruka government would exist for a very short time. But there was a next problem that no one yet knew. Who would come 'after' Haruka?"
 HEU.mutsuki_event.28.a:0 "...Who will fill Mutsuki's empty seat?"

 HEU.mutsuki_event.29.t:0 "I Want to Forgive You"
 HEU.mutsuki_event.29.desc:0 "Mutsuki surrendered. The single room where Kayoko once stayed has now become Mutsuki's room. Because Mutsuki had provided Kayoko with an absurdly nice room, ironically, Mutsuki's prison life is quite comfortable. What other criminal in Luxembourg could lie on a soft bed and read manga in a room with an air conditioner?\n\nOf course, one thing is missing from that life. Freedom. Mutsuki was experiencing what she had taken from Aru as she lay on the bed. Mutsuki thought she did all this for Aru's sake. But she didn't. Ultimately, Mutsuki imprisoned Aru for herself. Not because she hated seeing Aru get hurt, but because it was hard for 'Mutsuki' to watch Aru being hurt.\n\n\"If only I had known that a little sooner.\"\n\nMutsuki's monologue was cut short by the news that Aru had come for a visit. Normally, a visit would take place in a separate visiting room. But Aru, using her 'high-ranking person' privilege, walked right into the single room. In fact, disregarding official procedures and barging in was quite hard-boiled and Aru-like. Mutsuki had also visited the cell directly when Kayoko was detained.\n\nAru sits on the bed next to Mutsuki. \"How does it feel to be the one locked up for a change?\"\n\"...It's lonely.\"\n\"I felt that too. Being alone is a very lonely thing. Mutsuki. So, if through this time, you... can feel something, fufu. Wouldn't that be a good thing?\"\n\nAru carefully brushes Mutsuki's shoulder.\n\n\"Your punishment won't be severe. ...So, when you are released from here, let's go for a walk together. Without any more politics, power, or complicated thoughts... just thinking about our friendship, like we did in Kivotos. How about it?\"\n\nLet's go for a walk together. Even after all these events, Aru was saying such kind words. Mutsuki tried to say something, but eventually, tears burst out."
 HEU.mutsuki_event.29.a:0 "...Idiot."

 HEU.mutsuki_event.30.t:0 "Severance"
 HEU.mutsuki_event.30.desc:0 "Mutsuki surrendered. The single room where Kayoko once stayed has now become Mutsuki's room. Because Mutsuki had provided Kayoko with an absurdly nice room, ironically, Mutsuki's prison life is quite comfortable. What other criminal in Luxembourg could lie on a soft bed and read manga in a room with an air conditioner?\n\nOf course, one thing is missing from that life. Freedom. Mutsuki was experiencing what she had taken from Aru as she lay on the bed. Mutsuki thought she did all this for Aru's sake. But she didn't. Ultimately, Mutsuki imprisoned Aru for herself. Not because she hated seeing Aru get hurt, but because it was hard for 'Mutsuki' to watch Aru being hurt.\n\n\"If only I had known that a little sooner.\"\n\nMutsuki's monologue was cut short by the news that Aru had come for a visit. Normally, a visit would take place in a separate visiting room. But Aru, using her 'high-ranking person' privilege, walked right into the single room. In fact, disregarding official procedures and barging in was quite hard-boiled and Aru-like. Mutsuki had also visited the cell directly when Kayoko was detained.\n\nAru sits on the bed next to Mutsuki. \"How does it feel to be the one locked up for a change?\"\n\"...It's lonely.\"\n\"I felt that too. Being alone is a very lonely thing. Mutsuki. But. Knowing that. Why did you do it?\"\n\nAru's cold eye—the one that had gone blind—stared at Mutsuki. Mutsuki felt a chill. She had never received such a look from Aru before. No, she had never even seen Aru look at anyone else like that. Pure contempt, with not a trace of her usual 'clumsy' side left.\n\n\"Your punishment won't be severe. You'll be released soon. But... maybe this is the punishment. Today is the last time I will ever see you. We're done. Is that enough?\"\n\"A-Aru-chan. But...\"\n\"Chan? Have you forgotten everything you did to me?\"\n\nAru looked at Mutsuki without any emotion."
 HEU.mutsuki_event.30.a:0 "You were never my friend."

 HEU.mutsuki_event.31.t:0 "Election of the Prime Minister"
 HEU.mutsuki_event.31.desc:0 "Even after the Luxembourg 'Union Act,' where Gehenna, Luxembourg, and Trinity were all supposed to form an equal alliance, a cold atmosphere lingered between the three nations united through war. The joint meeting room for Luxembourg, Gehenna, and Trinity to decide the next Prime Minister was also not exactly friendly. 10 for Luxembourg, and 5 for each of the other two academies. A total of 20 people's votes would determine the next Prime Minister. Luxembourg representative Karl Marx said in a cynical voice:\n\n\"No matter who becomes Prime Minister, no one will be satisfied. Don't we all know that the capitalists' grand 'Union Act' has reduced the three nations to ashes? Just put me as Prime Minister. I'll apply to join the Soviet Union and end this farce.\"\n\nAomori Mine, one of the Trinity representatives, scoffed. \"That was a truly wonderful request for support. ...The next Prime Minister must come from Trinity. To prove that your war was not an invasion but a truly equal union of three nations, yes, naturally Trinity should have a seat for the sake of harmony, shouldn't we?\"\n\nNext was Amau Ako's turn. She took a sip of chamomile tea and said coolly, \"Ideally, yes. But seeing as the Luxembourg representative count is double, I can't really trust this Union Act.\"\n\"If you don't trust it, do you have an alternative?\"\n\"We in Gehenna... will cast all our votes for the Luxembourg candidate. That would be the best way for Gehenna to expand its autonomy in this national union in the long run. Wouldn't you agree?\"\n\nAs Ako turned her head, the other Gehenna representative, Satsuki, just nodded bluntly. Rather than voting for a losing candidate, they would cast all their votes for a Luxembourgish politician to send a message supporting their rule. In this reality, it would be the best choice.\n\nMine was the highest-ranking member of the Trinity delegation, which was entirely composed of the Remedial Knights. She would effectively decide Trinity's five votes. ...Trinity also had to make a rational choice for its position in the new nation. Mine looked straight at Ako and asked:\n\n\"...Then, who is the candidate you will be gathering votes for?\""
 HEU.mutsuki_event.31.a:0 "\"Ms. Kayoko is the most rational leader. I hate to admit it, but she is competent.\""
 HEU.mutsuki_event.31.b:0 "\"Ms. Asagi. She's broken by guilt, making her perfect to manipulate from the outside.\""

 HEU.mutsuki_event.32.t:0 "The New Prime Minister of Luxembourg"
 HEU.mutsuki_event.32.desc.a:0 "After going through everything, Kayoko sat in the chair of the Prime Minister's residence with a exhausted expression. Aru said she would no longer be involved in politics. This meant that Kayoko now had to take over everything Aru had done, and everything Mutsuki had done since the coup. Kayoko could feel the worried gaze of Haruka sitting across from her. 'Are you going to be okay?' Haruka was clearly saying that.\n\nShe wasn't okay at all.\n\n\"...It's a board Mutsuki forcibly created, but if this board collapses... yeah. Aru will become unhappy.\"\n\nKayoko nodded.\n\n\"...I must take all the responsibility.\""
 HEU.mutsuki_event.32.desc.b:0 "Mutsuki sat down with an exhausted expression. Originally, she had intended to leave the office of Prime Minister and return everything to Aru after establishing the Union Act. However, she was forced to return. Both Gehenna and Trinity believed that they could manipulate Mutsuki, a Prime Minister with the lowest legitimacy and a former rebel leader, as a puppet. Mutsuki stared at the 'Trinity Relief Budget' document sent by Aomori Mine. Even before the inauguration ceremony was over, Trinity was already making moves.\n\nThis is all because of her own mistakes. Because she bullied Aru and made Aru suffer. Mutsuki had to perform this punishment to atone for all those deeds."
 HEU.mutsuki_event.32.a:0 "Politics is not an easy task."

 HEU.mutsuki_event.33.t:0 "The End of the Story"
 HEU.mutsuki_event.33.desc.nomal_ending:0 "Aru rode her bicycle through Luxembourg City. She had been imprisoned throughout the entire war, but in the meantime, public support for Aru had soared through the roof. To the Kivotos community in Luxembourg, she was the hero of the Union Act. To the Luxembourgish Left, she was a martyr oppressed by the Asagi cabinet. To the Luxembourgish Right, she was a leader 'high-mindedly incomparable to Mutsuki.' And the plausible title of 'Hero of the Civil Rights Act' was also attached to her. Either way, it was far from hard-boiled.\n\n\"Aru-sama!\"\n\nHaruka followed Aru on her bicycle from a short distance behind. Many things had changed. But some things remained the same. Haruka and Kayoko. Her bonds with the two had not broken. Aru turned her gaze. Because one eye was blind, her field of vision became visible only when she turned her head. There, Kayoko stood in the street, wearing a stylish suit and waving her hand at Aru.\n\nAru's emotional wounds have not all healed. Aru still repeatedly has nightmares every night about being kidnapped and imprisoned by Mutsuki. But...\n\n\"Aru.\"\n\nBecause she was turning her head and pedaling her bicycle, Aru didn't see the rock in front of her. Kayoko, who had run over, caught Aru's wobbling bicycle. Aru smiled awkwardly and met Kayoko's eyes. All of this suffering can be overcome someday. Because the two of them are here."
 HEU.mutsuki_event.33.desc.good_ending:0 "After the declaration of the Union Act, the coastal area of northern Germany. It had been a very long time since all four members of Problem Solver 68 had gathered to visit the beach. Aru looked back at the sea. Because she was blind in one eye, the scenery of the sea appeared slightly cut off. Aru could no longer take in that vast world entirely with her eyes. But when she turns around... the three people are visible.\n\nIt's fine even if her eyes can't hold the wide world. It was enough if she could see the three people who are small, humble, and symbolize Rikuhachima Aru's daily life.\n\n\"Well, a lot of things happened, didn't they?\"\n\nKayoko let out a sigh.\n\n\"That's not something that can be summarized as 'a lot of things.'\"\n\"I don't particularly like long and pedantic explanations, you see.\"\n\nAru turned around, facing the sea breeze.\n\n\"We can't undo things that have already happened. Mutsuki's deeds might be forgiven by the law, but they won't be forgiven ethically. In fact, the reason the law forgave her is just because Mutsuki's people are filling the bureaucracy, not because the people of this country have forgiven her, right?\"\n\nMutsuki's expression stiffened for a moment. \"...Aru-chan, you've become sharp. Your insight too...\"\n\n\"The past cannot be changed. But it's possible to make different choices in the present. So, Mutsuki, let's work so that you can be forgiven by other people in the future too, not just me.\"\n\"Can I do it?\"\n\"...If it were me, it'd be impossible.\"\n\"What?\"\n\nAru smiled faintly. \"But, Mutsuki, you aren't me.\""
 HEU.mutsuki_event.33.a:0 "We still have each other."

 HEU.mutsuki_event.34.t:0 "Resurrection of Parliament"
 HEU.mutsuki_event.34.desc:0 "With the election of the new Prime Minister, Luxembourg's suspended democracy has been restored. According to the federal system, Gehenna, Trinity, and Luxembourg will each elect members to form a parliament from districts divided into cantons.\n\nThe Right-Wing Party effectively disbanded due to the oppression of the Asagi cabinet. However, Emil Richter, released from long house arrest, rallied Right-Wing Party supporters and declared the creation of the Christian Social People's Party (CSV). The CSV intends to abandon its existing reactionary tendencies, such as the negation of democracy, but plans to incorporate Germanic populations existing in mainland Germany as supporters of the new party.\n\nAs all of Germany fell into hands through the Union Act, Nazi forces gained strength again within Luxembourg. Pierre Prüm, who seized GEDELIT after Damian Kratzenberg's death, intends to call himself the true successor to the National Socialist German Workers' Party. Prüm himself is not a Nazi, but he knows that calling himself a National Socialist in the new Germany is a way to gain the support of the far-right. Already, Nazi party members from the former Gehenna region have begun to unite around Prüm. Prüm has already met with Hitler's friend Albert Speer and performed a show of being recognized as the 'legitimate successor' of the Nazis.\n\nThe Communist Party of Luxembourg merged with the Communist Party of Germany (KPD) organizations based on the principle of socialism in one country, but it seems that the parties in the former German regions are not following the instructions of the much smaller and more minor Communist Party of Luxembourg. On top of that, the ideological conflict with the Socialist Workers' Party, an anti-Stalinist socialist party, is becoming increasingly extreme.\n\nIn a situation where Pandemonium Society and Tea Party organizations have completely collapsed, Gehenna and Trinity are uniting around two people: Amau Ako and Aomori Mine. Mine and Ako are acting as representatives of the entire academy rather than a political party, trying to maintain academy local autonomy in the new Luxembourg-led nation. Since very broad autonomy is given under the actual Union Act, the representatives of Gehenna and Trinity are expected to be able to use autonomy at the level of a United States governor."
 HEU.mutsuki_event.34.a:0 "From the central parliament to the autonomous parliaments of Gehenna and Trinity."

 HEU.mutsuki_event.35.t:0 "Civil Rights Act Rejected"
 HEU.mutsuki_event.35.desc:0 "Following the Civil Rights Act forum, Aru began to visit each Right-Wing Party member's office directly as a last resort. She bowed her head, asking them to work for the passage of the bill for the sake of all Luxembourgish people. Of course, it wouldn't work. Reporters soon found out (thanks to contact from the conservative wing of the Right-Wing Party) that Aru was visiting every single office, and the image of Aru bowing was captured by the media and remained as an article. Aru became a laughingstock, and halfway through, the Right-Wing Party refused even to have meetings with Aru.\n\nAru failed.\n\nDespite the votes in favor from the Communist Party of Luxembourg and the liberal Radical Liberal Party, the Civil Rights Act issue could never reach half the seats in this vote, where the Right-Wing Party stood in opposition. The Civil Rights Act was rejected, and it was announced that there were no plans for the proposal to be brought before parliament again. Aru's efforts to obtain Kivotos's rights in Luxembourg through legal procedures vanished along with the laughter of the Right-Wing Party."
 HEU.mutsuki_event.35.a:0 "\"...This is so like me. An idiot pretending to be hard-boiled.\""

 HEU.mutsuki_event.36.t:0 "Perception of Aru"
 HEU.mutsuki_event.36.desc:0 "After the rejection of the Civil Rights Act, the perception of Aru among the Kivotos community took a massive hit. From raw criticism asking 'how could she talk so big and get this result' to mockery saying that the idea of getting concessions from the locals through parliamentary politics was meaningless in the first place, countless opposing opinions poured out. The Luxembourg Grand Ducal Palace is in a state of chaos due to the clash between protesters trying to criticize Aru and pro-government protesters asking if she didn't do 'enough'."
 HEU.mutsuki_event.36.a:0 "\"...\""

 HEU.mutsuki_event.37.t:0 "Mutsuki's Limit of Patience"
 HEU.mutsuki_event.37.desc:0 "Asagi Mutsuki is not a villain. Unlike being called a little devil and doing countless pranks, her 'pranks' have always stayed at a light level like Aru's 'hard-boiled' persona. The reason Asagi Mutsuki's patience is reaching its limit was simple: not just the locals, but even the Kivotos population that should support Aru most was treating her like an idiot. What on earth is the problem?\n\n\"...Don't you think we should make Aru a hero?\"\n\nAt Mutsuki's pointless words, Kayoko said bluntly:\n\n\"Let's make many people support Aru. I know the intention. But you can't manipulate people's hearts. Are you Kyogoku Satsuki or something?\"\n\"Kyogoku?\"\n\"...There's a woman like that.\"\n\nKayoko just sat with her legs crossed, looking at Mutsuki emotionlessly. Kayoko knew that Mutsuki's psychological state had not been normal recently. Mutsuki was gradually... going crazy as she saw her ideal, Aru, being ridiculed and chipped away. Mutsuki's trembling hands, and her behavior of looking out the window and continuing to mutter that she had to 'make Aru a hero.' But there was nothing Kayoko could do.\n\nMutsuki and Aru, she could only hope they could overcome this hardship themselves."
 HEU.mutsuki_event.37.a:0 "\"...\""

 HEU.mutsuki_event.38.t:0 "Love is Without Hypocrisy - 1"
 HEU.mutsuki_event.38.desc:0 "Rikuhachima Aru attempted suicide by poison in the safehouse where she was detained. It was clear that one of the outside guards, influenced by Aru, had delivered the poison, but now the important thing was not to find the culprit but to bring Aru back to life. Without Onikata Kayoko, who was still in prison, only Mutsuki and Haruka watched as Aru received emergency treatment in an ambulance, crying. What would Kayoko have said if she had seen this? Mutsuki could only bow her head and weep silently.\n\nIn the ambulance, the paramedics were exchanging answers that were close to screams. \"We can't do it with our medicine. Bring a Kivotos doctor!\"\n\"Even the Trinity people?\"\n\"Gehenna, whatever, bring them all!\"\n\nWhen the ambulance arrived at the hospital, there was Aomori Mine, who looked like she had just come out of a Trinity prisoner of war camp and was not even properly dressed, and Gehenna's Hinomiya Chinatsu. Chinatsu glared at Mutsuki, the cause of all this situation, for a moment before grabbing the stretcher Aru was lying on.\n\n\"The patient swallowed cyanide and is currently unconscious. Ms. Mutsuki, are you the guardian?\"\n\"Yes. I am...\"\n\"Moving to the emergency room. Wait outside.\""
 HEU.mutsuki_event.38.a:0 "Mutsuki could do nothing while Aru disappeared."

 HEU.mutsuki_event.39.t:0 "Love is Without Hypocrisy - 2"
 HEU.mutsuki_event.39.desc:0 "Mutsuki doesn't smoke, but today she desperately wanted to hold a cigarette in her mouth. Despite becoming the leader of the Germanic United Duchy, which has become the most powerful country in Kivotos, Mutsuki was just crouching in the hospital hallway, smaller than anyone else. Standing opposite her, Haruka quietly looked down at Mutsuki. An awkward silence hung in the hallway. It was Haruka who spoke first.\n\n\"I'm sorry for swearing at you and hitting you at the safehouse, Chief. But I think I have to say this.\"\n\"...Go ahead.\"\n\"All of this happened because of you, Chief. You must end the detention of President Aru now. She... did not wish to be a hero in a snow globe. So. Stop it.\"\n\nHad Haruka ever stated her opinion so firmly like this? The Haruka she knew wasn't like this. No. Mutsuki knew that thought itself was absurd. How many years had passed since the Great Transition? Haruka was not the Haruka of the past. she also had her own thoughts, especially after the coup... she must have spent a long time thinking for herself about how to act for Aru. The one who had changed the least among them was Mutsuki. Mutsuki said weakly while crouching in her seat."
 HEU.mutsuki_event.39.a:0 "\"I just... I just did all this for Aru-chan.\""

 HEU.mutsuki_event.40.t:0 "Love is Without Hypocrisy - 3"
 HEU.mutsuki_event.40.desc:0 "As the treatment dragged on, people from further hospitals arrived. Mutsuki just sat there, watching Himuro Sena and the emergency medical department staff rush in. Could Aru survive? Mutsuki tried not to think of ominous possibilities. But Mutsuki's mind was filled with the cursed worst-case scenarios, making it hard to breathe. Mutsuki said, wiping away the tears that kept flowing with the back of her hand:\n\n\"I never intended to make Aru-chan a hero in a snow globe from the start. It's just that the outside world is too cruel for Aru-chan. I thought this was the only way to protect Aru-chan. But I never thought Aru-chan... or other people would think of it this way. I, yeah. I was only looking at myself.\"\n\nMutsuki recalled the words she had said while imprisoning Aru long ago. Aru is my Sun. Mutsuki will become Pluto, never reaching Aru but eternally orbiting around her. ...Those words meant she would help Aru from a distance even if she wasn't recognized by her, but as a result, they led to a depressing conclusion where she was left alone, having failed to understand her heart until the very end because she was too far from Aru."
 HEU.mutsuki_event.40.a:0 "\"In the end, this wasn't for Aru-chan's sake.\""

 HEU.mutsuki_event.41.t:0 "Love is Without Hypocrisy - 4"
 HEU.mutsuki_event.41.desc:0 "Kayoko had been detained ever since that incident, but was hastily released upon hearing that Aru might die. As soon as Kayoko arrived at the hospital, she immediately approached Mutsuki, who had stood up from her seat. Kayoko, who raised her hand as if she were going to slap her across the face, hesitated for a moment and then lowered her hand. After all, for Kayoko, any more conflict... was something beyond the level she could endure.\n\n\"Are you satisfied?\"\n\"...Of course not.\" \"I'm glad you're not satisfied. ...Aru will wake up. She's not the kind of girl to die in a place like this.\"\n\nKayoko looked exhausted, stroking her face with her palms.\n\n\"Mutsuki. Until now... I'm sorry. I didn't realize that you were in a mental state where you had to carry such worries and do anything for Aru. No... I probably knew but didn't act on it. Even though I knew you were being cornered that much, I acted as if I didn't know you would explode in the end. This was a dereliction of duty that I shouldn't have committed as your colleague. So...\"\n\"It's okay, Kayoko. You don't have to apologize.\"\n\nMutsuki wiped her eyes with the back of her hand.\n\n\"It's all my fault.\""
 HEU.mutsuki_event.41.a:0 "Finally, the two reconciled."

 HEU.mutsuki_event.42.t:0 "Love is Without Hypocrisy - 5"
 HEU.mutsuki_event.42.desc:0 "Aomori Mine emerged from the emergency room with an exhausted face. Delivering relief where it was needed was the purpose of her life, but providing relief to a person who had swallowed cyanide with the intention of dying was terribly painful. However, seeing the three people gathered in front of the emergency room door... she could feel that there was a clear meaning to this relief. Mine took a breath and then said:\n\n\"Ms. Rikuhachima will live.\"\n\"Th-that means...\"\n\"Yes. We succeeded.\"\n\nSuccess. Seeing the three of them crying together at that word, Mine forgot all about the tiresome conflict and ideology between Trinity and Gehenna. And... Mine hoped that they could restore their relationship with Aru from now on."
 HEU.mutsuki_event.42.a:0 "To the future."

 HEU.mutsuki_event.43.t:0 "A Greater War Approaches"
 HEU.mutsuki_event.43.desc:0 "[ROOT.GetNameDef] will not be satisfied with the Germanic United Duchy. Ultimately, conquering both Trinity and Gehenna academies was Mutsuki's final goal. How could Mutsuki stop here? Her task of making Aru a hero hasn't ended. No matter how much Mutsuki hides that fact from Aru, how could Aru continue not to know? Aru looks out at Luxembourg through the window with heavy iron bars. She must not break. No matter how painful it is, she must endure. Because in difficult times, Aru must become a place where other people can return to. Aru takes a short deep breath and smiles faintly."
 HEU.mutsuki_event.43.a:0 "Even if it's not a situation to laugh."

 HEU.mutsuki_event.44.t:0 "His Majesty Emperor Wilhelm's..."
 HEU.mutsuki_event.44.desc:0 "As the Grand Duchy of Luxembourg conquered Gehenna and expanded into a United Duchy, Emperor Wilhelm gained a small hope. Might the opportunity come to resurrect the German Empire, of which he was Emperor? Mutsuki was imprisoning and controlling Aru, but she was still helpless against Aru. Wilhelm showered the officials of the Asagi cabinet with a lot of money—considering he had become poor after his exile in Luxembourg, it was money invested with great determination—and was granted a one-hour meeting with Aru. Aru's safehouse. Wilhelm, as if trying to express his value somehow, swung his arms in front of Aru to show off his 'healthiness' and said:\n\n\"...The United Duchy will advance all the way to Berlin in the future. I also want to play a part in that process. Yes. The resurrection of the German Empire.\"\n\"So, you're saying you want to be Mutsuki's competitor?\"\n\"No! No. A partner, not a competitor. Wasn't there a concept like the 'Little Qing Court' in China? If you give me a palace in Berlin, a stipend for dignity, and a small, state-of-the-art laptop...\"\n\n...\n....\n\nWilhelm walked out of the safehouse dejectedly, with an expression that said he simply couldn't understand. \"Wait, why kick me out?\""
 HEU.mutsuki_event.44.a:0 "It was funny, though."

 HEU.mutsuki_event.45.t:0 "Alliance with GEDELIT?"
 HEU.mutsuki_event.45.desc:0 "Within the Communist Party of Luxembourg, there is a movement to portray the deceased Damian Kratzenberg as a martyr and ally with GEDELIT. Party leader Zenon Bernard is favorable to this project, thinking it's an opportunity for an alliance with an enemy that can expand the Communist Party's political influence. After all, no matter how much you make a dead Nazi a martyr, he's not going to come back to life and become a political rival, is he? His successor, Prüm, is just a simple populist.\n\nHowever, it was Karl Marx who suppressed the opinion within the party to exploit the Nazi's death. He took a hardline stance, most fiercely devaluing Kratzenberg's death as meaningless and worthless.\n\n\"A person's life is not evaluated by whether they acted bravely in the few seconds they were dying. It's evaluated by looking at their whole life. A man who frothed at the mouth talking about Judeo-Bolshevism and the Hitler spirit until the Great Transition happened doesn't become a noble martyr just because he was brave for a few seconds before dying, and the idea of cooperating with National Socialists because of his death is also just a ridiculous delusion.\"\n\nAlthough it was just an internal party discussion that hadn't reached GEDELIT yet, in the end, party leader Zenon Bernard's argument was thwarted by the even more hardline Stalinist Marx."
 HEU.mutsuki_event.45.a:0 "Movements within the party."

 HEU.mutsuki_event.46.t:0 "Dissatisfaction in the Gehenna Community"
 HEU.mutsuki_event.46.desc:0 "Following Mutsuki's coup, some expected a grand purge by the Gehenna community. A dream plan of lining up Right-Wing politicians and gunning them down with machine guns, and completely ruling the locals. However, Mutsuki's dictatorship was considerably more lax than much of the Gehenna population had expected. Because Mutsuki was uneasy about being hated by Rikuhachima Aru, even while holding all the power.\n\nMutsuki just wanted to protect Aru and make her a hero worshipped by the people of this land. But what the Gehenna masses want is the complete dismantling and Kivotos-ization of the Luxembourgish state. Because the two opinions didn't match, the Asagi cabinet couldn't gain high popularity even among the Gehenna community.\n\nBut she can't earn Aru's hatred for them, can she?"
 HEU.mutsuki_event.46.a:0 "I am not doing this for you, but for Aru-chan..."

 HEU.mutsuki_event.47.t:0 "Self-Proclaimed Thunder Emperor"
 HEU.mutsuki_event.47.desc:0 "\"Mutsuki is the Thunder Emperor who fled after being ousted?\"\n\"Doesn't that make no sense?\" \"But none of us have actually seen the Thunder Emperor. Maybe the members of the Pandemonium Society have...\"\n\nMutsuki's declaration as the Thunder Emperor had no basis at all, but conversely, there was no way to deny it. It was even more so after the self-proclaimed Thunder Emperor Mutsuki occupied the central district of Gehenna. Once Mutsuki seized the heart of the Pandemonium Society, the opinion that Mutsuki was likely the real Thunder Emperor began to gain the upper hand. While Mutsuki's army advanced through the central district, some Gehenna citizens welcomed her greatly, calling it the 'Return of the Thunder Emperor.' However, another group of students agreed that Mutsuki was likely the real Thunder Emperor, and for that very reason, argued that Mutsuki should never return to Gehenna.\n\nA militarist tyrant returns with an army to re-conquer the beautiful and free Gehenna. That fact must have been a more-than-shocking event for the free Gehenna people. However, there was one person who looked down on those 'liberal' Gehenna students with contempt. One person who was abused and bullied in Gehenna, and who knows that Gehenna's so-called freedom is nothing more than bringing scissors to a girl's head and cutting it off by force. One person who thinks this land of the Pandemonium Society is a more hideous viper's nest than even Trinity.\n\n\"...I hate Gehenna.\"\n\nAfter the victory parade, Haruka said to Mutsuki in the central district, with a blank expression. \"I know you aren't the real Thunder Emperor, Chief. But I want you to be the real Thunder Emperor. And I want you to announce the return of the Thunder Emperor by burning down... and purifying... this cursed city.\"\n\"Why should I do that? Aru-chan would surely...\"\n\"She'll agree. Aru-sama too. Didn't Gehenna do the same thing to Luxembourg? It's just getting back what they gave.\""
 HEU.mutsuki_event.47.a:0 "Haruka. This is, kuhuhu, a bit too much for a prank, isn't it?"
 HEU.mutsuki_event.47.b:0 "Don't let the citizens die. Aru would hate that. But let's burn the parliament building."

 HEU.mutsuki_event.48.t:0 "The True Thunder Emperor"
 HEU.mutsuki_event.48.desc:0 "Haruka felt euphoria as she looked up at the Gehenna Pandemonium Society parliament building burning fiercely in the flames. The laughter of the women who forcibly sheared her hair, the fists swung, the kicks, the mockery—it seemed all of them were disappearing along with the burning parliament. Gehenna should have been like this. It should have been like this from a much longer time ago. Beside Haruka, who was looking up at the parliament building with a faint smile, Mutsuki kept fiddling with her fingers as if she were anxious even just looking at that sight.\n\n\"Haruka-chan. You know this isn't fun, right?\"\n\"Fufu. Yes. It's just because of my petty... revenge. It's surely not a fun sight for you, Chief. But, yes. If this is the power of the Thunder Emperor... I want to be the Thunder Emperor too.\"\n\"...Hah?\"\n\nI want to be the Thunder Emperor. Mutsuki was momentarily taken aback by Haruka's honest words, who had never said she wanted to stand above others until now. Well, it must be a joke. Haruka was not a person who could stand above others' heads. But why? Mutsuki felt a strange anxiety that Haruka's words wouldn't be a simple joke. Because those eyes burning with hatred as she looked at the burning parliament, and her fist clenched so hard it trembled, were saying 'Haruka isn't joking.' Mutsuki tried to turn away. But the youngest member of Problem Solver 68, who should surely be someone Mutsuki knows better than anyone, looked like a completely different person today."
 HEU.mutsuki_event.48.a:0 "Haruka might have more talent as a ruler than me."

 HEU.mutsuki_event.49.t:0 "Aru's Return"
 HEU.mutsuki_event.49.desc:0 "Aru gained her freedom after the kidnapping incident ended, but she no longer has any interest in politics or looking for 'hard-boiled' things. She is still in the Grand Ducal Palace, meeting friends from the Problem Solver office, and continuing to sign documents, but the will to do anything beyond being a constitutional monarch no longer remains. But that was enough. Aru had already suffered too much, and no one dared to say that Aru should be dragged back to the political arena to suffer again.\n\nNow Aru's biggest 'work' has become bicycle rides, or console game matches with Kayoko. Although she has never beaten Kayoko in fighting games that require physical skills due to her vision and hand disability.\n\nAru has returned. And now everyone must share Aru's burden. Because Aru is too exhausted to carry that burden any longer. But Aru will still remain as the protector of Luxembourg, and if the land she cherishes is in danger of being burned by war, she will go out to the front line with her gun again. Because doing anything to protect someone precious is what Rikuhachima Aru does."
 HEU.mutsuki_event.49.a:0 "I'm glad you're back."

 HEU.mutsuki_event.50.t:0 "Trinity Host?"
 HEU.mutsuki_event.50.desc:0 "Asagi Mutsuki is actually an intelligence agent sent from Trinity, and now she's denying the Trinity government and calling herself the Host. This fact was extremely absurd, so it was mostly just laughed at by the people of Trinity. However, as Mutsuki began to gain the upper hand in the war with Trinity, other voices began to appear. Isn't there no physical evidence that Mutsuki isn't from Trinity? If Mutsuki is from Trinity, this war becomes not a defeat by Gehenna, but merely a shift of the Host position to another faction within a simple power struggle inside the Trinity Tea Party.\n\nBecause of that, even more, the conservatives of Trinity, who value tradition, began to raise their voices and cry out that Mutsuki is a Trinity student.\n\n\"The Host, huh... kuhuhu...\"\n\nMutsuki smiled faintly as she looked through the somewhat crazed letters supporting her as the Host. Is Mutsuki actually a Trinity spy? That wasn't an important issue for Mutsuki herself. What's important isn't the truth. It's the question of whether people internalize it and believe it to be true. And Trinity was increasingly internalizing Mutsuki's Host claim as if it were true. How amusing is that?\n\nJust as Mutsuki internalized the idea that all of this was for Aru's sake while imprisoning her."
 HEU.mutsuki_event.50.a:0 "No, I'm different. I'm not like them..."

 HEU.mutsuki_event.51.t:0 "What are you hesitating for?"
 HEU.mutsuki_event.51.desc:0 "Asagi Mutsuki. wasn't your goal to make Aru a hero? The locals are laughing at Aru-chan. Those great Kivotos people are taking rewards from Aru-chan and don't know anything about how hard she's trying. You're going to be the damn producer who makes Aru-chan a star! Are you afraid of the earth burning and the lives of the people of this land fading away? Was their life, and the earth, more precious to you than Aru-chan? It wasn't, was it?\n\nShoot them."
 HEU.mutsuki_event.51.a:0 "There's no need to hesitate."

 HEU.mutsuki_event.52.t:0 "Our Grand Strategy"
 HEU.mutsuki_event.52.desc:0 "Mutsuki gathered with Haruka and loyalist soldiers faithful to the Asagi cabinet to plan a future grand strategy. The Asagi cabinet will claim that the Grand Duchy of Luxembourg is the sole representative state of the Germanic people from now on and attack [GEM.GetNameDef]. As everyone in the Asagi cabinet knows, it wasn't actually because Mutsuki wanted to do something for the Germanic people.\n\nMutsuki will make Aru the true hero of this land, so that she will never again be laughed at by the people here.\n\n\"...Haruka-chan. Listen carefully. We will trample Gehenna and advance straight to Trinity. Then we will conquer both Gehenna and Trinity academies, declare 'Germanic Reunification' to the locals, and promote Aru-chan as the great conqueror to Gehenna.\"\n\"Will it be okay? All those plans... look too dangerous to me...\"\n\"Do you not want to help Aru, Haruka-chan?\"\n\nAt Mutsuki's cold words, Haruka shook her head. To help Aru. How could Haruka deny those words? Mutsuki smiled faintly upon receiving Haruka's positive answer.\n\n\"It's going to get busy from now on. To the Gehenna students, Aru-chan must appear as the leader who conquered both Trinity and Gehenna academies, and to the locals, she must appear as the builder who reconstructs Germany, which collapsed after the Great Transition.\"\n\"Will that be... easy?\"\n\"Kuhuhu... no? Most of it will have to be left to the bureaucrats. But there's something Haruka-chan can easily do too.\""
 HEU.mutsuki_event.52.a:0 "Burning down the two academies."

 HEU.mutsuki_event.53.t:0 "Reason to Live Tomorrow"
 HEU.mutsuki_event.53.desc:0 "Aru often receives magazines from the guards who manage the safehouse. Most of them are 'wholesome' magazines with political content censored, but sometimes the guards 'accidentally' forget to delete the political news section. That was usually a consideration for Aru, but today that consideration had a negative effect.\n\n£white_dot Why did Asagi Mutsuki imprison Aru?\n\n     ...Our reporter Kawaru Shinon wishes to discuss a shocking possibility. Might Mutsuki be considering political exploitation possibilities for the Regent Rikuhachima? They say she's conducting domestic propaganda with the Germanic Reunification! But doesn't it feel like there's no 'impact' in a regent of a small country like Luxembourg leading the reunification?\n     But there is a possibility! Our magazine believes that Regent Rikuhachima is ready to gain the 'justification' to become the true leader of Germany. Doesn't Luxembourg have Wilhelm II, the Emperor of all Germany?\n     The reason Asagi Mutsuki is confining Rikuhachima Aru is surely to send her as a concubine to Wilhelm II, making her Aru Hohenzollern and then the Greater German Empress—\n\n-Rip! Rip! Aru grabbed the magazine page and ripped it down vertically. She had seen countless articles until now, but none had offended her more than this one.\n\n'So as that grandfather's concubine? You b... what is this bad woman saying? Does she think a hard-boiled outlaw is a joke?'\n\n\"I'm going out. Surely... I will not collapse until I leave this prison.\"\n\nAru vowed deep in her heart and struck the wall with her fist. This article gave Aru the motivation to overcome despair. Kawaru Shinon. Even if she has to search all of Kivotos, until the day she folds that woman's waist like a flip phone, she cannot fall."
 HEU.mutsuki_event.53.a:0 "This really makes me mad!"

# End of Mutsuki Events
#{{ Beginning of Diplomacy Events

 HEU.diplomacy_event.1.t:0 "Economic Alliance Proposal"
 HEU.diplomacy_event.1.desc:0 "[HEU.GetNameDef] was using a credit currency whose value was linked to the Belgian currency. However, after the Belgian government went into exile following the 1935 Great Transition, the credit of the Luxembourgish currency's value completely vanished. This economic alliance proposal from [HEU.GetLeader] is an attempt to create a new credit currency by linking the currency value between the [ROOT.GetName] government and the Luxembourgish government. If we accept this proposal, we will be able to see greater profits in trade with Luxembourg.\n\nHowever, there is also a loud voice of controversy over whether an economic alliance with [HEU.GetLeader] should even be implemented, given that Luxembourg's economic scale isn't that large. Anyway, the document discussed at the negotiation table is now on [ROOT.GetLeader]'s desk, awaiting the decision of approval or rejection."
 HEU.diplomacy_event.1.a:0 "This shall not be a loss for us."
 HEU.diplomacy_event.1.b:0 "Reject it! It's a useless endeavor."

 HEU.diplomacy_event.2.t:0 "[FROM.GetNameDef]'s Economic Alliance Approval"
 HEU.diplomacy_event.2.desc:0 "The credit currency of [ROOT.GetName], which was completely destroyed after the 1935 Great Transition, has been resurrected once again. It was decided to link the value of our Luxembourgish Franc with the currency value held by [FROM.GetNameDef], and the policy to discard the previous currency has been canceled. Our economy will be healthy for the time being. ...However, if our relationship with [FROM.GetNameDef] collapses, or if their government perishes... we will be in a very difficult situation."
 HEU.diplomacy_event.2.a:0 "Long live Luxembourg!"

 HEU.diplomacy_event.3.t:0 "[FROM.GetNameDef]'s Economic Alliance Rejection"
 HEU.diplomacy_event.3.desc:0 "Our attempt to maintain the credit currency of [ROOT.GetName], which was completely destroyed after the 1935 Great Transition, has failed. [FROM.GetLeader] seems to have thought our proposal was not helpful to their national interests. We must return to our original plan, the gold standard."
 HEU.diplomacy_event.3.a:0 "I liked gold from the start anyway."

 HEU.diplomacy_event.4.t:0 "[FROM.GetNameDef]'s Peaceful Unification Proposal"
 HEU.diplomacy_event.4.desc:0 "[FROM.GetLeader] wishes for them to become the central state of Gehenna, and even more so after the Pandemonium Society collapsed. They requested that we be incorporated as part of [FROM.GetName] in exchange for guaranteeing Luxembourg's autonomy. The Luxembourgish diplomatic mission and the [FROM.GetName] diplomatic mission have already begun a joint unification conference in the central district of Gehenna.\n\nThe final decision rests with [ROOT.GetLeader]. Problem Solver wants to protect the peace of Luxembourg rather than seizing the hegemony of Gehenna, and they know that if this talk fails, a war to decide the unifying force of Gehenna will break out. Shall we remain as the autonomous territory of Luxembourg under Gehenna? Or shall we reject this unification talk and prepare for war with them to protect our freedom?"
 HEU.diplomacy_event.4.a:0 "Let [FROM.GetLeader] unify Gehenna."
 HEU.diplomacy_event.4.b:0 "No, we will not crawl under them."

 HEU.diplomacy_event.5.t:0 "[FROM.GetNameDef]'s Peaceful Unification Consent"
 HEU.diplomacy_event.5.desc:0 "The divided Gehenna has been peacefully integrated! Rikuhachima Aru chose peace negotiations rather than war with us, and we decided to achieve national integration with Luxembourg in exchange for guaranteeing Luxembourg's autonomy. This is a great achievement for [ROOT.GetLeader], and we will be recorded for a long time as the integrators of all Gehenna."
 HEU.diplomacy_event.5.a:0 "Very good!"

 HEU.diplomacy_event.6.t:0 "[FROM.GetNameDef]'s Peaceful Unification Rejection"
 HEU.diplomacy_event.6.desc:0 "The joint meeting for peaceful unification did not produce a positive result. The diplomats of Luxembourg and [ROOT.GetName] showed great differences in each other's interests and values, and our meeting ran on parallel lines. In the end, it was revealed that peaceful unification was nothing more than a simple dream. Now, war will be the only alternative for the unification of Gehenna."
 HEU.diplomacy_event.6.a:0 "It's unfortunate."

 HEU.diplomacy_event.7.t:0 "Negotiations between [ROOT.GetName] and [FROM.GetName]"
 HEU.diplomacy_event.7.desc:0 "[ROOT.GetName] has lost its mainland due to the invasion of the Kivotos community after the Great Transition and has been waiting in the colonies for the day of 'Return to the Mainland' to eventually come. That day seemed like it would never come, but [FROM.GetLeader] has proposed to return the territory they possess to us.\n\nThere aren't no conditions. They are demanding that we become a government under the control of [FROM.GetNameDef]. This will greatly damage our autonomy, but for us, this might be the last chance to return to the mainland. [ROOT.GetLeader]'s decision will determine our future."
 HEU.diplomacy_event.7.a:0 "No matter what we sacrifice, we will return."
 HEU.diplomacy_event.7.b:0 "No! We return by our own strength!"

 HEU.diplomacy_event.8.t:0 "[FROM.GetName]'s Negotiation Approval"
 HEU.diplomacy_event.8.desc:0 "[FROM.GetName] had no other alternative. They accepted our negotiation terms to return to the mainland, and [FROM.GetLeader] met with [ROOT.GetLader] to promise eternal friendship and common prosperity between the two nations.\n\nThis is a great success we have gained as liberators of humanity, not as Kivotos invaders."
 HEU.diplomacy_event.8.a:0 "It's a very wonderful day!"

 HEU.diplomacy_event.9.t:0 "[FROM.GetName]'s Negotiation Rejection"
 HEU.diplomacy_event.9.desc:0 "[FROM.GetName] refused to have their autonomy infringed upon. They seem to have judged that negotiating with [ROOT.GetNameDef] would be no different from losing their independence permanently.\n\nUnfortunately, we must accept that the negotiations will not be able to resume."
 HEU.diplomacy_event.9.a:0 "Well, there are days like this too..."

 HEU.diplomacy_event.10.t:0 "The Tragic Fall of the British Empire"
 HEU.diplomacy_event.10.desc:0 "During World War I, Luxembourg was occupied due to the Schlieffen Plan, but 3,700 people, amounting to 1 percent of the total Luxembourgish population, joined the French army to fight, and 2,000 people died in France. Since the United States Army expelled the German army stationed in Luxembourg and designated Luxembourg as an 'ally and friend,' Luxembourg has been respected on the international stage as a member of the Entente.\n\nHowever, as the two allies, Belgium and France, were expelled to the African continent, Luxembourg's status within the Allies became uncertain, and now as Kaiser Corporation occupies the British Empire, the cooperation between the Grand Duchy of Luxembourg and the Allied nations has ultimately become completely nominal. It's not that the Luxembourgish parliament or Regent Rikuhachima specifically stated they would stop cooperating with the Allies, but Luxembourg can no longer be called an ally of Britain."
 HEU.diplomacy_event.10.a:0 "At least now, we are left alone..."

 HEU.diplomacy_event.11.t:0 "[FROM.GetName]'s Demand for Return of [FROM.FROM.GetName] Province"
 HEU.diplomacy_event.11.desc:0 "After [FROM.GetName] designated the General Student Council President, a document stating that the Low Countries should be returned to them was reviewed internally and was spreading among local officials, but now [FROM.GetName] seems to want to 본격적으로 get this province back. We must decide whether to return this province to [FROM.GetName] or not."
 HEU.diplomacy_event.11.a:0 "Fine, let them take it."
 HEU.diplomacy_event.11.b:0 "No. This province has a strategic purpose."

 HEU.diplomacy_event.12.t:0 "[FROM.GetName]'s Rejection of Province Return"
 HEU.diplomacy_event.12.desc:0 "[FROM.GetName] refused the province return we politely requested, and we might have to forcibly take this province back from [FROM.GetName] to occupy the throne of the true General Student Council."
 HEU.diplomacy_event.12.a:0 "War with them is absolutely not allowed."
 HEU.diplomacy_event.12.b:0 "...Invade."

 HEU.diplomacy_event.13.t:0 "[FROM.GetName]'s Return of [FROM.FROM.GetName] Province!"
 HEU.diplomacy_event.13.desc:0 "[FROM.GetName] accepted the request for the return of the province we politely requested, and the [FROM.FROM.GetName] province has now come into our arms. We have taken one step closer to the position of General Student Council President!"
 HEU.diplomacy_event.13.a:0 "Good."

# End of Diplomacy Events
#{{ Beginning of Aru Events

 HEU.aru_event.1.t:0 "Diplomatic Conference"
 HEU.aru_event.1.desc:0 "\"Fufu. I've become a big shot in my own way. To have gained the qualification to wear such a wonderful dress and stand on a flashy stage. Isn't that right, Kayoko?\"\n\nToday Aru was quite excited for the first time in a long while after the Great Transition. Kayoko, wearing a black dress, smirked and took the hand of Aru, who was wearing a red-wine colored dress. The US Embassy in Luxembourg was holding a modest dinner party event to commemorate the continuation of diplomatic relations between Luxembourg and the United States after the Great Transition.\n\n\"Aru, aren't you uncomfortable in a place like this?\"\n\"Well, what! It's not that I don't feel uncomfortable at all, but if anything happens, Kayoko will handle it somehow.\"\n\nAru said that and then picked up a slice of orange from the round table and put it in her mouth. Because she ate it hurriedly, juice dripped down her chin. Even though the maintenance fee coming in as Regent must be considerable, Aru hadn't been eating well lately. Filled with pity and affection for Aru, Kayoko took out a handkerchief.\n\n\"Our President, even wearing such a grown-up dress, she can't throw away her clumsy mind.\"\n\nKayoko slowly wiped her mouth with a smiling face. Aru puffed out her cheeks slightly at Kayoko's behavior.\n\n\"Kayoko. I'm not a kid, you know? I'm all grown up, you know? I'm a hard-boiled outlaw who applies for 1 Evil a Day, you know?\"\n\"Yes, yes. I know. ...Truly.\"\n\"You don't know at all! Completely treating me like a child...\"\n\"Fufu. Done. I wiped it all. Come on, let's go. The Ambassador will be waiting for the President.\"\n\nOur lives have changed a lot since the Great Transition. The things we have to do have increased a lot, and there have been many difficult things. But it'll probably be okay. If the old friends of Problem Solver 68 are by her side. Aru thought so."
 HEU.aru_event.1.a:0 "\"Is it Ambassador Morris? I am the hard-boiled outlaw... oh? Should I not add those words?\""

 HEU.aru_event.2.t:0 "A Humble Home"
 HEU.aru_event.2.desc:0 "Immediately after the Great Transition, Aru stopped the massacre that was happening in this city. Even if stopping the massacre was just to the extent of subduing the delinquent students of Gehenna who were shooting on the streets. She only found out at the Grand Ducal Palace that the people of this land were weak beings who die easily from a single bullet.\n\nThanks to that, she received an impressive nameplate as Regent, not to mention a maintenance fee and even a wonderful palace. Although Aru didn't use the personal space of that palace at all. Aru lived in a small boarding house a little over 10 minutes' walk from the palace.\n\n\"In Problem Solver, the four of us used to sleep together...\"\n\nShe plans to merge the houses again once the confusion of this land is settled someday, but for the time being, she plans to live alone. Aru put down the thick bundle of documents she brought from her office. Tasks that continue late into the night even after work. Right now, Aru didn't want to make her most precious friends bear this workload together with her. Those kids needed a private life. The freedom to sit on their sofa after work and eat potato chips or look at the television.\n\nIf a boring president who keeps the lights on until midnight and looks at documents is next to them... those kids would be uncomfortable too. Aru gave a faint smile as she pulled out a stylish Gehenna-made fountain pen. May Mutsuki, Kayoko, Haruka, and everyone she loves be having a peaceful night right now."
 HEU.aru_event.2.a:0 "For their sake, I can suffer a little more."

 HEU.aru_event.3.t:0 "Pro-Aru Protests"
 HEU.aru_event.3.desc:0 "Usually, the perception of Aru was lower among northern farmers further away from Luxembourg City, and was extremely high among the middle class and urban workers who lived in Luxembourg City, where a massacre could have occurred due to direct attacks from the Gehenna community. In response to the anti-Aru protests of the farmers, a large-scale pro-Aru rally occurred in Luxembourg City today.\n\nToday's rally, centered on members of the liberal Radical Liberal Party of Luxembourg, emphasized that Aru is the hero who stopped the massacre of Luxembourg and pointed out that the anti-Aru protesters do not have a proper alternative. If Aru leaves, who will protect the citizens from Gehenna?"
 HEU.aru_event.3.a:0 "Ultimately, Aru is the answer."

 HEU.aru_event.4.t:0 "Public Opinion Analysis"
 HEU.aru_event.4.desc:0 "To Her Highness Regent Rikuhachima.\n\nAs a result of analyzing the protests taking place in the capital, the Luxembourg City Police Department has confirmed that most of the protesters are coming down from rural areas in northern Luxembourg. The residents of Luxembourg City are deeply grateful that Your Highness stopped the massacre in the city in 1935, and support for the government is also very firm. However, the rural areas in northern Luxembourg were not looted even in the confusion immediately after the Great Transition.\n\nAccording to our police department's investigation, the opposing forces of Regent Rikuhachima are not city dwellers. Please do not forget, Your Highness, that the opponents are just a few loud rural people, and more than twice as many citizens as the opponents are supporting Your Highness's government. Being shaken by them would be the result those hicks want most.\n\nDelivered by the Luxembourg Police Department."
 HEU.aru_event.4.a:0 "Even if I know, it still hurts my heart."

# End of Aru Events
#{{ Beginning of Election Events

 HEU.election_event.1.t:0 "[ROOT.GetNameDef] Parliamentary Election"
 HEU.election_event.1.desc:0 "Since the introduction of universal suffrage in 1919, Luxembourg has held elections for the Parliament (Abgeordnetenkammer) with an open list proportional representation system. All men and women aged 21 and over have the right to vote and run for office in parliamentary elections, and voters can cast their vote for a party they want to vote for or for one of several proportional representation candidates of that party. Due to Luxembourg's strong proportional representation system, the Luxembourgish Parliament takes a multi-party form with many parties in the house. This election was held through a democratic procedure, and we have been able to identify the party that gained the most members."
 HEU.election_event.1.a:0 "Together with the farmers, the Right-Wing Party has won!"
 HEU.election_event.1.b:0 "With the freedom of Gehenna, it's a victory for the Federal Student Party!"
 HEU.election_event.1.c:0 "With the power of the petty bourgeoisie, long live the Radical Liberal Party!"
 HEU.election_event.1.d:0 "Through the solidarity of trade unions, a great leap for the Communist Party!"

 HEU.election_event.2.t:0 "Luxembourg Parliamentary Election"
 HEU.election_event.2.desc:0 "Since the introduction of universal suffrage in 1919, Luxembourg has held elections for the Parliament (Abgeordnetenkammer) with an open list proportional representation system. All men and women aged 21 and over have the right to vote and run for office in parliamentary elections, and voters can cast their vote for a party they want to vote for or for one of several proportional representation candidates of that party. Due to Luxembourg's strong proportional representation system, the Luxembourgish Parliament takes a multi-party form with many parties in the house.\n\nParliamentary elections were held in a free form. Although the political influence of the Luxembourgish Parliament has decreased significantly since the neutralization of the Right-Wing Party due to the Great Transition and the 'Rikuhachimaist' coup, Parliament is still the symbol of our democracy and the basis for us to be recognized as Luxembourg in the international community."
 HEU.election_event.2.a:0 "The ballot counting is complete."

 HEU.election_event.3.t:0 "Luxembourg Parliamentary Election"
 HEU.election_event.3.desc:0 "Since the introduction of universal suffrage in 1919, Luxembourg has held elections for the Parliament (Abgeordnetenkammer) with an open list proportional representation system. All men and women aged 21 and over have the right to vote and run for office in parliamentary elections, and voters can cast their vote for a party they want to vote for or for one of several proportional representation candidates of that party. Due to Luxembourg's strong proportional representation system, the Luxembourgish Parliament takes a multi-party form with many parties in the house.\n\nAfter the establishment of the Union Act, our Parliament has become a very large unicameral parliament composed of representatives from three countries: Gehenna, Trinity, and Luxembourg. Due to very delicate district allocation, Luxembourg has the greatest political influence, but Trinity and Gehenna can also express their opinions in central politics."

 HEU.election_event.4.t:0 "Germanic United Duchy Parliamentary Election"
 HEU.election_event.4.desc.kayoko.generic:0 "Since the introduction of universal suffrage in 1919, Luxembourg has held elections for the Parliament (Abgeordnetenkammer) with an open list proportional representation system. All men and women aged 21 and over have the right to vote and run for office in parliamentary elections, and voters can cast their vote for a party they want to vote for or for one of several proportional representation candidates of that party. Due to Luxembourg's strong proportional representation system, the Luxembourgish Parliament takes a multi-party form with many parties in the house.\n\nUnlike the 30-member interim parliament elected without an election after the Union Act and the collapse of the Asagi dictatorship, this Germanic United Duchy election has great significance as the first democratic election of the Germanic United Duchy, which stipulates an equal national alliance of three countries: Luxembourg, Gehenna, and Trinity. The number of seats was designated as a total of 600, with 300 seats allocated to Trinity and Gehenna and 300 seats for the locals. Assuming the next Prime Minister does not dissolve Parliament, the Germanic United Duchy member will serve a five-year term.\n\nThe first general election held after the Union Act saw rapid consolidation and division from the election period. The 300 seats for Trinity and Gehenna and 300 seats for the locals basically seem advantageous to the Germanic people, but in reality, many Kivotos populations have migrated to the cantons (regional proportional representation constituencies) where the '300 seats for locals' are allocated, so there is no possibility that the next Prime Minister will be elected from among the locals. Various parties are divided into two—supporting Gehenna and Trinity—candidates, and they want to elect the next leader of the Germanic United Duchy from the power they support.\n\nThe rainbow coalition of the Communist Party of Luxembourg-German National Movement-Radical Liberal Party, representing the far-left-Nazi-liberal, is preparing a pro-Gehenna coalition. Communists have a sense of rejection toward the religious power of Trinity, National Socialists were imprisoned by the Asagi government, and they consider Rikuhachima Aru, who achieved the reunification of the divided Germanic people, as a 'national hero,' so they are familiar with Gehenna. The Radical Liberal Party has always been the most ardent royalists since the Great Transition. The rainbow coalition and Amau Ako's Gehenna Independence Party participating here support Onikata Kayoko as the next Prime Minister.\n\nTrinity is in a disadvantageous position in this election because Regent Rikuhachima is from the Gehenna community and thus rejected by the royalist forces. The black-white coalition, where the local Catholic party Christian Social People's Party, the Trinity regional party Relief Knight Alliance, and members of the Pandemonium Society joined, supports Aomori Mine of the John faction as the next Prime Minister. Mine is focusing on a joint campaign with Tanga Ibuki in the central district of Gehenna to increase the possibility of winning."
 HEU.election_event.4.desc.kayoko.hidden:0 "Since the introduction of universal suffrage in 1919, Luxembourg has held elections for the Parliament (Abgeordnetenkammer) with an open list proportional representation system. All men and women aged 21 and over have the right to vote and run for office in parliamentary elections, and voters can cast their vote for a party they want to vote for or for one of several proportional representation candidates of that party. Due to Luxembourg's strong proportional representation system, the Luxembourgish Parliament takes a multi-party form with many parties in the house.\n\nUnlike the 30-member interim parliament elected without an election after the Union Act and the collapse of the Asagi dictatorship, this Germanic United Duchy election has great significance as the first democratic election of the Germanic United Duchy, which stipulates an equal national alliance of three countries: Luxembourg, Gehenna, and Trinity. The number of seats was designated as a total of 600, with 300 seats allocated to Trinity and Gehenna and 300 seats for the locals. Assuming the next Prime Minister does not dissolve Parliament, the Germanic United Duchy member will serve a five-year term.\n\nThe first general election held after the Union Act saw rapid consolidation and division from the election period. The 300 seats for Trinity and Gehenna and 300 seats for the locals basically seem advantageous to the Germanic people, but in reality, many Kivotos populations have migrated to the cantons (regional proportional representation constituencies) where the '300 seats for locals' are allocated, so there is no possibility that the next Prime Minister will be elected from among the locals. Various parties are divided into two—supporting Gehenna and Trinity—candidates, and they want to elect the next leader of the Germanic United Duchy from the power they support.\n\nThe rainbow coalition of the Communist Party of Luxembourg-German National Movement-Radical Liberal Party, representing the far-left-Nazi-liberal, is preparing a pro-Gehenna coalition. Communists have a sense of rejection toward the religious power of Trinity, National Socialists were imprisoned by the Asagi government, and they consider Rikuhachima Aru, who achieved the reunification of the divided Germanic people, as a 'national hero,' so they are familiar with Gehenna. The Radical Liberal Party has always been the most ardent royalists since the Great Transition. The rainbow coalition and Amau Ako's Gehenna Independence Party participating here support Onikata Kayoko as the next Prime Minister.\n\nThe competing candidate drawing attention is Igusa Haruka. Support for Haruka among the Gehenna community is unstable due to her hostility toward Gehenna, but she is effectively recognized as a 'proxy candidate' among supporters of Asagi Mutsuki. Haruka claims she is the 'successor of the Thunder Emperor' and is coming forward strongly, saying that Kayoko is unfolding too soft and kind policies. Although Haruka is showing hatred for Gehenna, Amau Ako expects she can actually increase her influence by limiting Haruka's Gehenna hatred to 'hatred of the Pandemonium Society,' so she might become the Prime Minister who replaces Kayoko.\n\nTrinity is in a disadvantageous position in this election because Regent Rikuhachima is from the Gehenna community and thus rejected by the royalist forces. The black-white coalition, where the local Catholic party Christian Social People's Party, the Trinity regional party Relief Knight Alliance, and members of the Pandemonium Society joined, supports Aomori Mine of the John faction as the next Prime Minister. Mine is focusing on a joint campaign with Tanga Ibuki in the central district of Gehenna to increase the possibility of winning."
 HEU.election_event.4.desc.mutsuki.generic:0 "Since the introduction of universal suffrage in 1919, Luxembourg has held elections for the Parliament (Abgeordnetenkammer) with an open list proportional representation system. All men and women aged 21 and over have the right to vote and run for office in parliamentary elections, and voters can cast their vote for a party they want to vote for or for one of several proportional representation candidates of that party. Due to Luxembourg's strong proportional representation system, the Luxembourgish Parliament takes a multi-party form with many parties in the house.\n\nUnlike the 30-member interim parliament elected without an election after the Union Act and the collapse of the Asagi dictatorship, this Germanic United Duchy election has great significance as the first democratic election of the Germanic United Duchy, which stipulates an equal national alliance of three countries: Luxembourg, Gehenna, and Trinity. The number of seats was designated as a total of 600, with 300 seats allocated to Trinity and Gehenna and 300 seats for the locals. Assuming the next Prime Minister does not dissolve Parliament, the Germanic United Duchy member will serve a five-year term.\n\nThe first general election held after the Union Act saw rapid consolidation and division from the election period. The 300 seats for Trinity and Gehenna and 300 seats for the locals basically seem advantageous to the Germanic people, but in reality, many Kivotos populations have migrated to the cantons (regional proportional representation constituencies) where the '300 seats for locals' are allocated, so there is no possibility that the next Prime Minister will be elected from among the locals. Various parties are divided into two—supporting Gehenna and Trinity—candidates, and they want to elect the next leader of the Germanic United Duchy from the power they support.\n\nThe rainbow coalition of the Communist Party of Luxembourg-German National Movement-Radical Liberal Party, representing the far-left-Nazi-liberal, is preparing a pro-Gehenna coalition. Communists have a sense of rejection toward the religious power of Trinity, and National Socialists despise the previous Prime Minister, Mutsuki, because they were imprisoned by the Asagi government, but they pay attention to the fact that Mutsuki was forgiven by Rikuhachima Aru. And Mutsuki is also a military leader who achieved the reunification of the divided Germanic people. The Radical Liberal Party has always been the most ardent royalists since the Great Transition, equating Mutsuki, 'forgiven by Aru,' with Peter, who was forgiven by Jesus. The rainbow coalition and Amau Ako's Gehenna Independence Party participating here support Asagi Mutsuki as the next Prime Minister.\n\nTrinity is in a disadvantageous position in this election because Regent Rikuhachima is from the Gehenna community and thus rejected by the royalist forces. The black-white coalition, where the local Catholic party Christian Social People's Party, the Trinity regional party Relief Knight Alliance, and members of the Pandemonium Society joined, supports Aomori Mine of the John faction as the next Prime Minister. Mine is focusing on a joint campaign with Tanga Ibuki in the central district of Gehenna to increase the possibility of winning."
 HEU.election_event.4.desc.mutsuki.hidden:0 "Since the introduction of universal suffrage in 1919, Luxembourg has held elections for the Parliament (Abgeordnetenkammer) with an open list proportional representation system. All men and women aged 21 and over have the right to vote and run for office in parliamentary elections, and voters can cast their vote for a party they want to vote for or for one of several proportional representation candidates of that party. Due to Luxembourg's strong proportional representation system, the Luxembourgish Parliament takes a multi-party form with many parties in the house.\n\nUnlike the 30-member interim parliament elected without an election after the Union Act and the collapse of the Asagi dictatorship, this Germanic United Duchy election has great significance as the first democratic election of the Germanic United Duchy, which stipulates an equal national alliance of three countries: Luxembourg, Gehenna, and Trinity. The number of seats was designated as a total of 600, with 300 seats allocated to Trinity and Gehenna and 300 seats for the locals. Assuming the next Prime Minister does not dissolve Parliament, the Germanic United Duchy member will serve a five-year term.\n\nThe first general election held after the Union Act saw rapid consolidation and division from the election period. The 300 seats for Trinity and Gehenna and 300 seats for the locals basically seem advantageous to the Germanic people, but in reality, many Kivotos populations have migrated to the cantons (regional proportional representation constituencies) where the '300 seats for locals' are allocated, so there is no possibility that the next Prime Minister will be elected from among the locals. Various parties are divided into two—supporting Gehenna and Trinity—candidates, and they want to elect the next leader of the Germanic United Duchy from the power they support.\n\nThe rainbow coalition of the Communist Party of Luxembourg-German National Movement-Radical Liberal Party, representing the far-left-Nazi-liberal, is preparing a pro-Gehenna coalition. Communists have a sense of rejection toward the religious power of Trinity, and National Socialists despise the previous Prime Minister, Mutsuki, because they were imprisoned by the Asagi government, but they pay attention to the fact that Mutsuki was forgiven by Rikuhachima Aru. And Mutsuki is also a military leader who achieved the reunification of the divided Germanic people. The Radical Liberal Party has always been the most ardent royalists since the Great Transition, equating Mutsuki, 'forgiven by Aru,' with Peter, who was forgiven by Jesus. The rainbow coalition and Amau Ako's Gehenna Independence Party participating here support Asagi Mutsuki as the next Prime Minister.\n\nTrinity has a very high veto spirit toward Mutsuki because Asagi Mutsuki called herself the 'Trinity Tea Party' and engaged in political activities before the establishment of the Union Act. Fueled by opposing public opinion toward Mutsuki, radical fascism movements are dominant inside Trinity. The black-white coalition of the Christian Social People's Party and the Trinity regional party Relief Knight Alliance supports Uzawa Reisa, who gained public popularity through vigilante activities in Eden, which was destroyed during the war. Reisa, who was originally far from politics, is showing her will to participate in the Prime Minister election, saying, 'Mutsuki's regime is a clear evil.' Of course, support for Aomori Mine, who belongs to the moderates rather than Uzawa Reisa, is still high in Trinity."
 HEU.election_event.4.kayoko:0 "Along with the rainbow coalition, Onikata Kayoko is the answer!"
 HEU.election_event.4.mine:0 "Along with the black-white coalition, relief where relief is needed!"
 HEU.election_event.4.mutsuki:0 "Along with the rainbow coalition, give Mutsuki a chance!"
 HEU.election_event.4.mika:0 "Along with the black-white coalition, support Misono Mika!" # unused
 HEU.election_event.4.uzawa:0 "The black-white coalition is with Uzawa Reisa, the symbol of justice!"
 HEU.election_event.4.haruka:0 "Surprisingly, the rainbow coalition has chosen Haruka."

# Start of Luxembourg (Problem Solver 68) Decisions ☆

 ## Human Parameters
 HEU_aru_persona_decision_category:0 "Rikuhachima Aru - Human Parameters"

 HEU_aru_persona_schedule:0 "Current Schedule Tickets: £schedule_ticket_texticon [?global.aru_schedule_point|+0]/6"
 HEU_aru_persona_schedule_desc:0 "Rikuhachima Aru's actions require £schedule_ticket_texticon §YSchedule Tickets§!. Schedule tickets can be charged up to 6 and will not accumulate beyond that."

 HEU_aru_persona_schedule_buy:0 "Obtain £schedule_ticket_texticon Schedule Ticket"
 HEU_aru_persona_schedule_buy_desc:0 "I plan to get a little time for self-development. The citizens will surely allow this much."

 HEU_aru_persona_schedule_buy_2:0 "Reserve £schedule_ticket_texticon Vacation Schedule"
 HEU_aru_persona_schedule_buy_2_desc:0 "Complicated piles of documents, endless requests flying in from citizens. I'm going to put all of these down for a moment and take a day's vacation. I've worked this hard for Problem Solver, so there's no reason Aru can't have that much leisure, is there?"
 
 HEU_aru_persona_wisdom:0 "£schedule_ticket_texticon §YTheory§! Study"
 HEU_aru_persona_wisdom_desc:0 "There are idiots who think Rikuhachima Aru is stupid, but Aru has long had her own expertise and knowledge in business management. she's been protecting Problem Solver 68 well even after the Great Transition, hasn't she? Although it has become difficult to obtain Kivotos business management books after the Great Transition, fortunately, Aru still has many books she hasn't read."
 
 HEU_aru_persona_kindness:0 "£schedule_ticket_texticon §CExecute§! Side Job"
 HEU_aru_persona_kindness_desc:0 "Hello! Customer, what would you like to order?\n\nIt might feel like a shameful thing to work part-time at a coffee shop as the President of Problem Solver and the ruler of Luxembourg. But at the same time, this is also an opportunity to get closer to the local residents. Plus, you can develop a kind attitude and mindset while serving customers."
 
 HEU_aru_persona_resolution:0 "£schedule_ticket_texticon §GSelf§!-Discipline"
 HEU_aru_persona_resolution_desc:0 "Unlike Kivotos, the mystery in this world is thin. Aru is still stronger than the locals, but she feels her physical ability has dropped compared to when she was in the original world. No. Actually, it's probably not just a feeling, she really has become weaker. So as not to worry the other members of Problem Solver, Aru plans to take time to discipline herself."
 
 HEU_aru_persona_charisma:0 "£schedule_ticket_texticon §RSelf§!-Management"
 HEU_aru_persona_charisma_desc:0 "Did you apply toner after washing your face? You didn't skip the emulsion, right? Makeup base and foundation are a must. Shading isn't hard-boiled, so let's skip it. Reading fashion magazines in your spare time so as not to fall behind the times, choosing cosmetics, and applying Millennium-made sunscreen (surely they didn't put anything strange in it?) before going out to the office completes all preparations to show dignity as President. Because for maintaining charisma as the President of Problem Solver, there is nothing as important as self-management."

 HEU_aru_persona_random_events:0 "Daily Life of Problem Solver"
 HEU_aru_persona_random_events_desc:0 "Problem Solver 68 is diligently continuing its activities even after the Great Transition. Who knows what will happen to Aru and her friends in this world? Small but good incidents might happen, but troublesome incidents might break out too."

 HEU_aru_persona_armed_ver:0 "§GRikuhachima Aru§! - In Battle" 
 HEU_aru_persona_armed_ver_desc:0 "Due to the loss of her left eye and the permanent disability of her right arm, Aru's combat power has actually dropped terribly compared to her 'prime' days in Kivotos. To prevent incidents where Aru loses precious friends because she can't go to the front line, she came up with an idea to go to the front line by wearing a Gehenna-made bulletproof vest, fixing a riot shield to her broken right arm, and operating a shotgun of the same model as Haruka's with one hand.\n\nLuxembourg's royalist officers agree that this is an excessively dangerous decision, but if Aru makes up her mind to fight directly on the front line, there will be no way to stop it."

 ## Rikuhachimaist '68 Revolution
 HEU_rikuhachimaism_decision_category:0 "Rikuhachimaist '68 Revolution"
 HEU_rikuhachimaism_decision_category_desc:0 "\n\n£GFX_68_benriya_revolution\n\n\n\n\n\n\"It is forbidden to forbid (Il est interdit d'interdire)\"\n - §YFrom Radio Luxembourg (RTL), statement by actor Jean Yanne§!\n\nThe §G'68 Revolution§!, which began to burn from Luxembourg, is a name taken from the name of Problem Solver 68 led by President §PRikuhachima Aru§!. Due to the provocative word 'Revolution,' the term §YRikuhachimaism§! is also commonly used in neutral media. Rikuhachimaism was born in 1935 during the Great Transition to break down the authoritarian and religious cultures of humanity and bring freedom to Kivotos citizens, intending to abolish discrimination against those who are oppressed and protect the culture of the Kivotos community suppressed by conservative locals.\n\nWe must completely destroy the old local culture with its 1930s way of thinking to lead the '68 Revolution to success. Religion, authoritarianism, and Nazism are three enemies that must surely be negated for the achievement of the '68 Revolution. Rikuhachima Aru is striving so that Kivotos culture can settle locally through support for anti-religion, anti-authoritarianism, and anti-Nazi movements. Forbid what they forbid. And regain the freedom of the Kivotos people. As the ultimate hard-boiled outlaw, Rikuhachima Aru will complete her ideal in this land.\n\n§RNo matter what cost follows.§!\n"

 HEU_rikuhachimaism_remove_nazi:0 "Attack Nazi Underground Organizations"
 HEU_rikuhachimaism_remove_nazi_desc:0 "Even after the official dissolution of fascist organizations, a part of the Luxembourgish population still follows National Socialist ideology and is preparing sporadic terror attacks against the Kivotos community. The problem is that they are not just small organizations inside Luxembourg, but are also engaging in guerrilla warfare in connection with the National Socialists in Germany. Striking Nazi organizations is a mandatory condition for the success of the '68 Revolution."

 HEU_rikuhachimaism_infrastructure_for_disabled:0 "Millennium Proposal - Luxembourg for the Disabled"
 HEU_rikuhachimaism_infrastructure_for_disabled_desc:0 "A student community from Millennium participating in the '68 Revolution has proposed a new agenda.\n\nThe concept of 'rights for the disabled' is quite unfamiliar to the locals. Right-wing forces only think of the disabled as beings who suck up the money of the 'national community,' and left-wing forces have no interest in them at all. But it wasn't like that in Kivotos. Like the case of the paraplegic girl 'Himari' who is active at Millennium Academy, physical disability was accepted as an object of coexistence, not an object of discrimination, in Kivotos.\n\nFor our revolution not to end in simple slogans, the rights of the disabled to move and opportunities for employment and education to lead a social life must be given equally. Surely a lot of budget will be needed for this, but it's worth the burden."

 HEU_rikuhachimaism_dissolution_of_authoritarianism:0 "Problem Solver Proposal - Attack Authoritarian Culture"
 HEU_rikuhachimaism_dissolution_of_authoritarianism_desc:0 "Problem Solver 68, the center of the '68 Revolution, has proposed a new agenda.\n\nCompared to the relatively horizontal culture of Kivotos, the local culture is vertical, and there are many families who are coercive especially toward children and women. Why did we have a revolution? Didn't we do it to destroy this kind of local culture? The anti-authoritarian culture movement led by Kivotos students will lead the liberation of the oppressed minorities."

 HEU_rikuhachimaism_civil_rights_movement:0 "Problem Solver Proposal - Kivotos Civil Rights Act"
 HEU_rikuhachimaism_civil_rights_movement_desc:0 "Problem Solver 68, the center of the '68 Revolution, has proposed a new agenda.\n\nThere are not just students in the form of humans in Kivotos. Various races, including those in the form of beastmen, reside there, and they suffered even more extreme discrimination than Kivotos students with halos after the Great Transition. The Civil Rights Act will legally protect all those who moved during the Great Transition of 1935 by stipulating punishment for discrimination in employment, wages, and provision of public and private services."

 HEU_rikuhachimaism_individual_freedom:0 "Gehenna Proposal - Enjoying Freedom Culture"
 HEU_rikuhachimaism_individual_freedom_desc:0 "A student community from Gehenna participating in the '68 Revolution has proposed a new agenda.\n\nFreedom to love freely, freedom of art, and free academic climate in school! Among the '68 Revolution led by Kivotos students, the student community from Gehenna, the 'Academy of Freedom,' particularly opposes all censorship and prohibition acts and wishes to open up the rigid local culture like Gehenna. Although the freedom spirit of Gehenna has some confusing aspects, it can be seen that Gehenna students have one framework of the '68 Revolution's liberalism."

 HEU_rikuhachimaism_LGBTQ_freedom:0 "Gehenna Proposal - LGBTQ+ Rights"
 HEU_rikuhachimaism_LGBTQ_freedom_desc:0 "A student community from Gehenna participating in the '68 Revolution has proposed a new agenda.\n\nAs students from Gehenna, the Academy of Freedom where everything is allowed, they also raise objections to the locally suppressed sexual culture. The biggest problem is LGBTQ+ rights, which are seen as sins by the local religion. Because implanting the futuristic and advanced values of Kivotos into this society is an important virtue, the Gehenna student community argues that a movement to promote LGBTQ+ rights should be promptly carried out."

 HEU_rikuhachimaism_dissolution_of_nationalism:0 "Trinity Proposal - Dismantling Nationalism"
 HEU_rikuhachimaism_dissolution_of_nationalism_desc:0 "A student community from Trinity participating in the '68 Revolution has proposed a new agenda.\n\nTrinity was transferred to the Prussian region, the capital area of the Nazi Empire, so Trinity students know the danger of the extreme chauvinism and nationalism of the locals better than students of other academies. Trinity students think our power should tilt more toward the nationalism dismantling movement."

 HEU_rikuhachimaism_free_female:0 "Trinity Proposal - Promoting Women's Rights"
 HEU_rikuhachimaism_free_female_desc:0 "A student community from Trinity participating in the '68 Revolution has proposed a new agenda.\n\nTrinity students transferred near Berlin, the capital of the Nazi Empire, are wary of the extremely conservative view of women held by the locals. Locals who learned moral concepts under Nazi rule try not to allow women's social activities, which strongly clashes with the culture of Kivotos where women engage in free social activities. We might be able to implement a movement to promote women's rights under the influence of the Trinity student community."

 HEU_rikuhachimaism_left_okay:0 "Red Winter Proposal - Allow Left-Wing Student Movements"
 HEU_rikuhachimaism_left_okay_desc:0 "A student community from Red Winter participating in the '68 Revolution wishes to combine the socialist movement with the '68 Revolution.\n\nThe 'Rikuhachimaist '68 Revolution' advocated by Rikuhachima Aru and Problem Solver 68 is just a liberalism and anti-authoritarianism movement applied simply to cultural fields. However, the minority students who emigrated from Red Winter wish to apply left-wing movements such as Trotskyism or Leninism to Rikuhachimaism to lead even a transformation of the economic system.\n\nRikuhachima Aru has no interest in their so-called concepts of Trotskyism or whatever, but conversely, she has no interest in oppressing them either. We will leave them to talk freely. That too will be a part of the revolution."

 HEU_rikuhachimaism_left_no:0 "Red Winter Proposal - Draw a Line with Left-Wing Student Movements"
 HEU_rikuhachimaism_left_no_desc:0 "A student community from Red Winter participating in the '68 Revolution wishes to combine the socialist movement with the '68 Revolution.\n\nThe 'Rikuhachimaist '68 Revolution' advocated by Rikuhachima Aru and Problem Solver 68 is just a liberalism and anti-authoritarianism movement applied simply to cultural fields. However, the minority students who emigrated from Red Winter wish to apply left-wing movements such as Trotskyism or Leninism to Rikuhachimaism to lead even a transformation of the economic system.\n\nBut Rikuhachima Aru wishes for her revolution to be applied solely to cultural fields, and publicly declared that the student movements of Red Winter students are 'not Rikuhachimaism.' This declaration will greatly reduce the sympathizers of the Trotskyist movement of the Red Winter student community."

 HEU_rikuhachimaism_invitation_to_sartre:0 "Invite Sartre"
 HEU_rikuhachimaism_invitation_to_sartre_desc:0 "Jean-Paul Sartre, a young but capable novelist, became known through the novel 'Nausea' published right after his exile in Africa following the Great Transition, and is almost the only human intellectual who publicly supported the '68 Revolution, which claims to dismantle the authoritarian human culture and replace it with relatively horizontal Kivotos culture. Although he's just a novelist who put out one book, Sartre believes he can complete his philosophical world more precisely by participating directly in the '68 Revolution." 

 HEU_rikuhachimaism_invitation_to_goldman:0 "Invite Goldman"
 HEU_rikuhachimaism_invitation_to_goldman_desc:0 "Anarchist Emma Goldman supports the feminism and anti-authoritarianism ideas of the '68 Revolution, but at the same time is considering the realistic limitations of the '68 Revolution. Nevertheless, Goldman wants to directly see how our revolution is progressing in Luxembourg." 

 ## Defiance against the General Student Council
 HEU_aru_GSC_defiance_decision_category:0 "Defiance against the General Student Council"
 HEU_aru_GSC_defiance_decision_category_desc:0 "§YProblem Solver 68§! is a weak power compared to the §YGeneral Student Council§!, but victory is not impossible. The §Glocal Belgians§! will welcome the advance of the Luxembourgish army due to their long friendship with Luxembourg, and if we're lucky, we might be able to get support from the §GPandemonium Society§!. For Rikuhachima Aru to rise to the position of General Student Council President of Kivotos, help from the locals will be needed as well as the power of the Kivotos transferrers.\n\nOf course, this does not violate Rikuhachimaist ideology. Because the world Aru dreams of is the dismantling of the authoritarian culture of the locals, not a world where the Kivotos people rule the locals. Of course, some radical Rikuhachimaists might protest against our cooperation with the locals, and we must note that too long a cooperation between us and the locals can §Rmake the radicals angry§!."

 HEU_aru_GSC_defiance_smuggling_of_weapons:0 "Smuggling Weapons from Belgium" 
 HEU_aru_GSC_defiance_smuggling_of_weapons_desc:0 "Whether it's Rikuhachima Aru or [KSP.GetLeader], they are the same Kivotos transferrers, but Aru's title of 'Regent of the Grand Duke of Luxembourg' and Luxembourg's legitimacy are good for leading the response of Belgian residents. For the liberation of Belgium, we can contact Belgian nationalists to receive weapon support. However, Joseph Jacquemotte, who leads the Belgian resistance forces, is a typical Marxist-Leninist, and long cooperation with him will disappoint Aru's supporters."

 HEU_aru_GSC_defiance_belgium_sabotages:0 "Support Belgian Sabotage" 
 HEU_aru_GSC_defiance_belgium_sabotages_desc:0 "The liberation of Belgium by Problem Solver 68 is approaching. Let's support sabotage in the Belgian border areas to confuse them."

 HEU_aru_GSC_defiance_COU_sabotages:0 "Support GSC Sabotage" 
 HEU_aru_GSC_defiance_COU_sabotages_desc:0 "Sabotage acts carried out in the General Student Council are very important for our cause."

 HEU_aru_GSC_defiance_SHE_sabotages:0 "Support Schale Sabotage" 
 HEU_aru_GSC_defiance_SHE_sabotages_desc:0 "Sabotage acts carried out in the General Student Council are very important for our cause."

 HEU_aru_GSC_defiance_ask_gehenna_for_help:0 "Request Support from [GEM.GetLeader]" 
 HEU_aru_GSC_defiance_ask_gehenna_for_help_desc:0 "We need to request the Pandemonium Society to recognize us as the true General Student Council and receive equipment needed for war. This is an alternative that even radical Rikuhachimaists can accept."

 HEU_aru_GSC_defiance_attack_974:0 "Escalate Border Dispute in §Y[980.GetName]§! Region"
 HEU_aru_GSC_defiance_attack_974_desc:0 "Our most ideal plan is to occupy the eastern Meuse region before starting the war. We can conduct military occupation of the eastern Meuse region through a surprise border dispute. Of course, because enemies will be prepared, we won't be able to attack the same area multiple times. And if we're unlucky, this might lead to war. But it doesn't matter! Having claimed to be the GSC President, we've already prepared for war anyway."

 HEU_aru_GSC_defiance_attack_977:0 "Escalate Border Dispute in §Y[1054.GetName]§! Region"
 HEU_aru_GSC_defiance_attack_977_desc:0 "Our most ideal plan is to occupy the eastern Meuse region before starting the war. We can conduct military occupation of the eastern Meuse region through a surprise border dispute. Of course, because enemies will be prepared, we won't be able to attack the same area multiple times. And if we're unlucky, this might lead to war. But it doesn't matter! Having claimed to be the GSC President, we've already prepared for war anyway."

 HEU_aru_GSC_defiance_attack_KSP:0 "Remove Belgian Oppressor" 
 HEU_aru_GSC_defiance_attack_KSP_desc:0 "[KSP.GetName] has played the role of an oppressor in Belgium for too long. Problem Solver 68 will conduct a disbandment operation against the self-proclaimed police warlord forces with the authority of the General Student Council."

 HEU_aru_GSC_defiance_attack_COU:0 "Remove [COU.GetName]" 
 HEU_aru_GSC_defiance_attack_COU_desc:0 "[COU.GetName] is calling itself the GSC, but it's unclear what they did for the human rights of the Kivotos transferrers. A righteous future where the outlaw Rikuhachima Aru becomes the GSC President is waiting."

 HEU_aru_GSC_defiance_attack_SHE:0 "Remove [SHE.GetName]" 
 HEU_aru_GSC_defiance_attack_SHE_desc:0 "[SHE.GetName] is calling itself the GSC, but it's unclear what they did for the human rights of the Kivotos transferrers. Can we entrust the human rights of Kivotos people to a mysterious AI? Absolutely not! The outlaw Rikuhachima Aru will sit on the throne instead of a tin computer as the true outlaw."

 HEU_aru_GSC_state_return_request:0 "Demand §Y[FROM.GetName] State§!" 
 HEU_aru_GSC_state_return_request_desc:0 "The §Y[FROM.GetName] State§! is territory we should rightfully obtain, but it is currently ruled by an ally. We will send a polite request to our allies so that Rikuhachima Aru can obtain the legitimate position of GSC President."
 HEU_state_return_request_in_progress_flag:0 "Return Request in Progress"
 HEU_state_return_request_fail_flag:0 "Rejected Return"

 HEU_aru_GSC_defiance_ask_FROM:0 "Request Territory Return from [FROM.GetName]" 
 HEU_aru_GSC_defiance_ask_FROM_desc:0 "We succeeded in making the GSC yield, but [FROM.GetLeader]'s army is occupying some GSC territories. We will politely explain that we have inherited the position of GSC President and request them to withdraw from our legitimate territory."

 HEU_aru_GSC_defiance_remove_old_GSC:0 "Total Victory over the Old GSC" 
 HEU_aru_GSC_defiance_remove_old_GSC_desc:0 "We have already occupied all the important cities of the old GSC forces, and further war will be unnecessary. Let's force the old GSC's allies to acknowledge that we have inherited the true GSC and declare that Rikuhachima Aru has become the true General Student Council President! Now this war is over!"

 ## Luxembourg-Pandemonium Alliance
 HEU_luxembourg_pandemonium_alliance_decision_category:0 "Luxembourg-Gehenna Alliance"
 HEU_luxembourg_pandemonium_alliance_decision_category_desc:0 "The alliance between §GProblem Solver 68§!, which rules the §YGrand Duchy of Luxembourg§!, and the §GPandemonium Society§!, the student council body of Gehenna Academy, is safely protecting the two nations from surrounding threats. Especially from imaginary enemies like §RTrinity§!. However, depending on the rapidly changing political situation, there is a possibility that the Luxembourg-Gehenna alliance will receive §Ran external threat§!. To defend the friendship between the two nations from external threats, we will make all possible preparations."

 ### Problem Solver Proposals
 HEU_exile_proposal_GEM:0 "Propose Exile to [GEM.GetLeader]" 
 HEU_exile_proposal_GEM_desc:0 "The Pandemonium Society strove to protect itself from external invasion, but the Pandemonium army has faced the worst crisis ever. Proposing their exile to Luxembourg and having Problem Solver 68 command the remaining Pandemonium army might be an appropriate proposal."

 HEU_air_force_technical_request_GEM:0 "Request Air Force Technology from [GEM.GetName]" 
 HEU_air_force_technical_request_GEM_desc:0 "Luxembourg didn't possess a single air force aircraft until before the Great Transition. Although it came to possess a few pilots after the Great Transition, it is still lagging far behind surrounding countries in terms of air force technology. Can't we at least ask if they can share some weapon technology as an ally of the Pandemonium Society?"

 HEU_navy_technical_request_GEM:0 "Request Navy Technology from [GEM.GetName]" 
 HEU_navy_technical_request_GEM_desc:0 "Luxembourg was a landlocked country, and Rikuhachima Aru also has no expertise in maritime fields. Even if we secured a coastline, what use is the sea to us if we can't use it? We will ask if the Pandemonium Society can share some navy technology."

 HEU_propagation_of_the_68_revolution_GEM:0 "Spread '68 Revolution to [GEM.GetName]" 
 HEU_propagation_of_the_68_revolution_GEM_desc:0 "Our vanguardist ideology called Rikuhachimaism, or the '68 Revolution, needs to be spread beyond borders to the Pandemonium Society. There's not much possibility that Gehenna, the 'School of Freedom,' will sanction the spread of liberalism for all the oppressed. If we're lucky, we'll gain a good partner who empathizes with the cause of the '68 Revolution."

 ## Balance of Power
 HEU_bop_love_earth:0 "Empathy for Locals" 
 HEU_bop_love_earth_desc:0 "Although Nazis, Catholics, and nationalists are showing discriminatory attitudes toward the transferrers who moved from Kivotos at the time of the Great Transition, Rikuhachima Aru believes that if the Kivotos people persuade the locals with patience, such discriminatory consciousness can be reduced. Turning the other cheek when the left cheek is hit is also the way for the harmony of Kivotos and the locals."

 HEU_bop_love_kivotos:0 "Empathy for the Kivotos Community" 
 HEU_bop_love_kivotos_desc:0 "After the Great Transition, Luxembourg is seeing open racial discrimination against the Kivotos community by the locals. How long should we keep enduring for the locals? Rikuhachima Aru wishes to empathize more with the suffering Kivotos people rather than the locals, and listen to their painful voices. Perhaps it's the locals, not the Kivotos people, who should change for the coexistence of the two peoples."

 HEU_bop_love_everyone:0 "Empathy for All" 
 HEU_bop_love_everyone_desc:0 "It is time to put aside empathy for the Kivotos community/locals and calmly organize our minds. We need to reflect on ourselves to see if our minds are leaning too far to one side."

 HEU_bop_talk_people:0 "Dialogue with Locals" 
 HEU_bop_talk_people_desc:0 "Meet and talk with Luxembourgish locals directly, and learn their culture."

 HEU_bop_talk_kivotos:0 "Dialogue with the Kivotos Community" 
 HEU_bop_talk_kivotos_desc:0 "Meet and talk with transferrers who arrived at the time of the Great Transition directly, and listen to their difficulties and hardships."

 ## Problem Solver 68
 HEU_problem_solver_68_decision_category:0 "Problem Solver 68"
 HEU_problem_solver_68_decision_category_desc:0 "\n\n£GFX_problem_solver_68_system\n\n\n\n\n\n\"The cost of hiring me is quite high, you know?\"\n - §YRikuhachima Aru§!\n\nAlthough the Problem Solver 68 office used originally was burned down by grenades from Gehenna students in the confusion immediately after the §YGreat Transition§!, despite that, the scale of Problem Solver 68 has increased significantly compared to before the Great Transition. Because President Rikuhachima Aru became the Regent of the Grand Duke of Luxembourg and could draw on §Ynational funds§!, the chronic financial shortage of Problem Solver was resolved, and the Grand Ducal palace became the new Problem Solver 68 office, creating many new rooms like reception rooms.\n\nOf course, employees have also increased. Some students from other academies who were moved by Rikuhachima Aru's idealism to create a country where Kivotos people and locals can all live equally volunteered to become §Yemployees§! of Problem Solver 68.\n\n§g(Thanks to that, to distinguish Haruka from other employees, Haruka's rank became Employee (Regular). That's good!)§!\n\nAfter the §YGreat Transition§!, we can give instructions to the employees to §Gmake them helpful to Luxembourg§!. Or we can have Mutsuki, Kayoko, and Haruka, Rikuhachima Aru's long-time colleagues, give instructions to the employees instead. The management of the §Yhard-boiled§! outlaw Rikuhachima Aru begins once again.\n"

 HEU_problem_solver_68_system:0 "This Year's Problem Solver 68 Revenue" 
 HEU_problem_solver_68_system_desc:0 "Every year, Problem Solver 68 earns money by listening to various requests from Luxembourgish citizens and reinvests that money into Luxembourg. Until the day Rikuhachima Aru's ideal is achieved, the revenue must be redistributed for precious colleagues, not for Aru's self-interest."

 HEU_problem_solver_68_haruka:0 "§GHaruka§! - Request Luxembourg Patrol" 
 HEU_problem_solver_68_haruka_desc:0 "Although she has a weak self-assertion and self-deprecating personality, Aru thinks Haruka is actually a reliable subordinate, no, friend with a firm will. Aru plans to entrust Haruka with the role of patrolling various parts of Luxembourg with Problem Solver employees to drive out the Helmet Gang or other criminal organizations that snuck in during the Great Transition confusion."

 HEU_problem_solver_68_mutsuki:0 "§GMutsuki§! - Request Hard-boiled Firearm Production" 
 HEU_problem_solver_68_mutsuki_desc:0 "When it comes to things that go bang, it's Mutsuki's favorite request. Aru can request Mutsuki to produce supplies in preparation for war, including ammunition and firearms, along with the employees of Problem Solver 68. Since it's a cottage industry after all, making weapons beyond individual firearms will be impossible, but that much is enough, isn't it?"

 HEU_problem_solver_68_kayoko:0 "§GKayoko§! - Tactical Request" 
 HEU_problem_solver_68_kayoko_desc:0 "Kayoko, who has the most experience and outstanding academic knowledge in Problem Solver 68, will strive to provide tactical help to other commanders on the battlefield to protect Luxembourg in danger."

 HEU_problem_solver_68_aru_1:0 "§GAru§! - Recruit International Brigade" 
 HEU_problem_solver_68_aru_1_desc:0 "The point where Luxembourg is different from other academy nations is that we dream of an equal ideal society for all Kivotos people and humanity. The manpower that can be filled within Luxembourg is small, but Aru can have idealists from all over the world, who believe that Kivotos and Earth civilizations can harmonize despite the confusion caused by the Great Transition, gather in Luxembourg with weapons."

 HEU_problem_solver_68_aru_2:0 "§GAru§! - Build Munitions Factory" 
 HEU_problem_solver_68_aru_2_desc:0 "It will cost a lot of money and will be a difficult task, but we can build a munitions factory branch of Problem Solver 68."

 HEU_problem_solver_68_aru_3:0 "§GAru§! - Build Civilian Factory" 
 HEU_problem_solver_68_aru_3_desc:0 "It will cost a lot of money and will be a difficult task, but we can build a light industry factory branch of Problem Solver 68."

 HEU_problem_solver_68_hina:0 "§GHina§! - Request Former Prefect Team Tactics" 
 HEU_problem_solver_68_hina_desc:0 "Hina, who was the former Prefect Team Lead, will devise very sharp tactical operations focused on attack rather than defense and command the officers."

 ### Easter Egg: Aru Same-Sex Marriage
 HEU_problem_solver_68_aru_proposal_mutsuki:0 "§GAru§! - Propose to Mutsuki" 
 HEU_problem_solver_68_aru_proposal_mutsuki_desc:0 "After same-sex marriage was legalized in the Grand Duchy of Luxembourg, opponents used to criticize this as being for the purpose of Rikuhachima Aru marrying another Problem Solver 68 employee. Yes, that is based on truth to some extent. But so what?\n\nMutsuki was a precious friend to Aru. Although she was playful and had a tendency to push Aru into dangerous situations, Aru never doubted her sincere camaraderie. We don't know how Mutsuki will think of this proposal. But Aru decided she wants to spend the rest of her life with Mutsuki, not any other person."

 HEU_problem_solver_68_aru_proposal_kayoko:0 "§GAru§! - Propose to Kayoko" 
 HEU_problem_solver_68_aru_proposal_kayoko_desc:0 "After same-sex marriage was legalized in the Grand Duchy of Luxembourg, opponents used to criticize this as being for the purpose of Rikuhachima Aru marrying another Problem Solver 68 employee. Yes, that is based on truth to some extent. But so what?\n\nKayoko was a precious friend to Aru. Because of her calm and taciturn personality, it was sometimes difficult to know her inner self. But Aru knows that there is a warm heart inside Kayoko, who has a scary appearance, and that there is a side that loves small animals like cats. If Aru needs a partner to spend her life with, it's Kayoko. Although she doesn't know what Kayoko will think of this proposal."

 HEU_problem_solver_68_aru_proposal_haruka:0 "§GAru§! - Propose to Haruka" 
 HEU_problem_solver_68_aru_proposal_haruka_desc:0 "After same-sex marriage was legalized in the Grand Duchy of Luxembourg, opponents used to criticize this as being for the purpose of Rikuhachima Aru marrying another Problem Solver 68 employee. Yes, that is based on truth to some extent. But so what?\n\nThe first meeting with Haruka is still an unforgettable memory for Aru. The day she saved a small girl who was being bullied and received a small thanks from her. A long time has passed since then, but the bond between Aru and Haruka has become deeper and more firmly tied instead of being broken. If asked which member of Problem Solver 68 she should spend her life with, Aru will choose Haruka—although she doesn't know what Haruka will think."

 ### Easter Egg: Aru Same-Sex Marriage (Communist)
 HEU_com_problem_solver_68_aru_proposal_mutsuki:0 "§GAru§! - Propose to Mutsuki" 
 HEU_com_problem_solver_68_aru_proposal_mutsuki_desc:0 "People who know that Asagi Mutsuki was the de facto coup leader and started an aggressive war by taking away Rikuhachima Aru's military power were greatly shocked by the fact that Aru proposed to Asagi Mutsuki. Is it possible to forgive the person who betrayed you and also to love them? Pessimists will say 'it's absolutely impossible.'\n\nBut for Aru, Mutsuki was always a precious person. Understanding and forgiving all those actions she committed for her, and even knowing that, Aru loved Mutsuki."

 HEU_com_problem_solver_68_aru_proposal_kayoko:0 "§GAru§! - Propose to Kayoko" 
 HEU_com_problem_solver_68_aru_proposal_kayoko_desc:0 "During the period when the relationship between Problem Solver 68 employees became distant, there would have been no person who went through a difficult time like Kayoko. But nevertheless, Kayoko did not leave Problem Solver 68 and remained by Aru's side until the end.\n\nKayoko was a precious friend to Aru. Because of her calm and taciturn personality, it was sometimes difficult to know her inner self. But Aru knows that there is a warm heart inside Kayoko, who has a scary appearance, and that there is a side that loves small animals like cats. If Aru needs a partner to spend her life with, it's Kayoko. Although she doesn't know what Kayoko will think of this proposal."

 HEU_com_problem_solver_68_aru_proposal_haruka:0 "§GAru§! - Propose to Haruka" 
 HEU_com_problem_solver_68_aru_proposal_haruka_desc:0 "Even during the period when the relationship between Problem Solver 68 employees became distant, Haruka remained by Aru's side and strove for Problem Solver 68 during difficult times. Wasn't it also Haruka who showed amazing courage at that boarding house to save Aru's life?\n\nThe first meeting with Haruka is still an unforgettable memory for Aru. The day she saved a small girl who was being bullied and received a small thanks from her. A long time has passed since then, but the bond between Aru and Haruka has become deeper and more firmly tied instead of being broken. If asked which member of Problem Solver 68 she should spend her life with, Aru will choose Haruka—although she doesn't know what Haruka will think."

 HEU_com_problem_solver_68_aru_proposal_hina:0 "§YHina§! - Propose to Aru" 
 HEU_com_problem_solver_68_aru_proposal_hina_desc:0 "The relationship between Hina and Aru in Kivotos was... certainly hostile. But Hina came to have a crush on Aru, who stood her back up after she was mentally broken following the collapse of the Prefect Team... and that crush grew into love beyond admiration before she knew it.\n\nShe doesn't know how Aru will accept this proposal, but for Hina, this emotion is an unadulterated truth."

 ## GSC Coring
 HEU_aru_GSC_annex_decision_category:0 "General Student Council President Rikuhachima Aru"
 HEU_aru_GSC_annex_decision_category_desc:0 "§YProblem Solver 68§! is a weak power compared to the §YGeneral Student Council§!, but we won a miraculous victory and seized the GSC. Of course, the difficult path of making the old GSC members recognize President §PRikuhachima Aru§! as the §Gtrue GSC President§! remains. Although we occupied the territory, we did not gain the §Ytrust of GSC students§! and the §Ytrust of the locals§!.\n\nWe must gain the support of the GSC and the Belgian-Dutch people, and induce them to recognize us as the §Gtrue GSC President§!. Of course, this won't be an easy task, but there's a possibility. The qualification of §CRegent of the Grand Duke of Luxembourg§! will reassure the Belgians. Aru's ideal of §Charmony between Kivotos people and humanity§! will give faith to the GSC students. If we use these two cards, the day we are recognized as the §Gtrue GSC President§! might come.\n\n	[BEL.GetFlag] Belgian Support: [?global.HEU_support_belgium|+0]\n [COU.GetFlag] GSC Support: [?global.HEU_support_GSC|+0]\n"

 HEU_aru_GSC_annex_persuading_arona:0 "Persuade Important GSC Personages" 
 HEU_aru_GSC_annex_persuading_arona_desc:0 "Various executives of the GSC think Rikuhachima Aru is an unqualified person without the qualification as 'GSC President.' Even after Rikuhachima Aru occupied the GSC, most of the existing GSC personnel did not join the 'Revolutionary Committee,' and because of this, Aru is having difficulty inheriting the duties of the existing GSC as the GSC President. Although persuading them will be a very difficult task... it will be a great help to our legitimacy."

 HEU_aru_GSC_annex_persuading_degrelle:0 "Persuade Joseph Jacquemotte"
 HEU_aru_GSC_annex_persuading_degrelle_desc:0 "Since we secured control over the Benelux region, the Belgian resistance, including Joseph Jacquemotte, has demanded that Rikuhachima Aru withdraw from these lands and hand over Belgian territory to them. Although Aru might find it difficult to persuade him through pure logic, she will attempt to convince him by highlighting the disparity between the Belgian resistance's numbers and the scale of the Luxembourgish regular army, while offering a proposal for increased local autonomy for Belgians within Belgium."

 HEU_aru_GSC_annex_persuading_GSC_state:0 "Tour of [FROM.FROM.GetName]" 
 HEU_aru_GSC_annex_persuading_GSC_state_desc:0 "Let us tour the [FROM.FROM.GetName] region, where the General Student Council's authority is strong, and remind the residents that Rikuhachima Aru has become the new GSC President."

 HEU_aru_GSC_annex_persuading_belgium_state:0 "Tour of [FROM.FROM.GetName]" 
 HEU_aru_GSC_annex_persuading_belgium_state_desc:0 "Let us tour the [FROM.FROM.GetName] region, where Belgian influence remains strong, and remind the residents that Rikuhachima Aru remains a steadfast friend of the Belgian people."

 HEU_aru_GSC_annex_core_east_belgium_states:0 "Assimilate Eastern Belgium" 
 HEU_aru_GSC_annex_core_east_belgium_states_desc:0 "With high support from the Belgian people, we are now able to integrate the Eastern Belgium region into our territory."

 HEU_aru_GSC_annex_core_west_belgium_states:0 "Assimilate Western Belgium" 
 HEU_aru_GSC_annex_core_west_belgium_states_desc:0 "With high support from the Belgian people, we are now able to integrate the Western Belgium region into our territory."

 HEU_aru_GSC_annex_core_south_GSC_states:0 "Assimilate Southern GSC" 
 HEU_aru_GSC_annex_core_south_GSC_states_desc:0 "With high support from the Kivotos population, we are now able to integrate the Southern General Student Council region into our territory."

 HEU_aru_GSC_annex_core_north_GSC_states:0 "Assimilate Northern GSC" 
 HEU_aru_GSC_annex_core_north_GSC_states_desc:0 "With high support from the Kivotos population, we are now able to integrate the Northern General Student Council region into our territory."

 ## Luxembourg Parliament
 HEU_abgeordnetenkammer_decision_category:0 "[ROOT.GetAdjective] Chamber of Deputies"
 HEU_abgeordnetenkammer_decision_category_desc:0 "\n\n£GFX_HEU_abgeordnetenkammer\n\n\n\n\n\n§Y[ROOT.GetName]§! is a democratic constitutional monarchy where the Grand Duke theoretically possesses the power to dissolve parliament and holds rights regarding legislation. However, following the first democratic constitution enacted in 1919, the Grand Duke adheres to the principle of §Y'reigning but not ruling,'§! delegating authority to a loyal, democratic parliament and maintaining minimal political involvement. This principle was maintained at least until the Grand Translocation.\n\nThe current §Ggoverning coalition§! is as follows:\n\n\n\n\n\n\n\n\n\n"
 
 benriya_kivotos_text: "£GFX_benriya_kivotos_texticon §GUnion Student Party§! Influence: §Y[?HEU_abgeordnetenkammer^0|1%]§!\n    War Support: [?HEU_kivotos_party_war_support_factor|=+1%]\n    Ideology Drift Defense: [?HEU_kivotos_party_drift_defence_factor|=+1%]"
 benriya_right_text: "£GFX_benriya_right_texticon §1Right Party§! Influence: §Y[?HEU_abgeordnetenkammer^1|1%]§!\n    Civilian Factory Construction Speed: [?HEU_right_party_industrial_complex_var|=+%2]\n    Stability: [?HEU_right_party_stability_factor|=+%2]"
 benriya_centre_text: "£GFX_benriya_centre_texticon §CRadical-Liberal Party§! Influence: §Y[?HEU_abgeordnetenkammer^2|1%]§!\n    Production Efficiency Cap: [?HEU_centre_party_production_factory_max_efficiency_factor|=+%2]\n    Consumer Goods Factories: §Y[?HEU_centre_party_consumer_goods_factor|==%1]§!"
 benriya_left_text: "£GFX_benriya_left_texticon §RCommunist Party§! Influence: §Y[?HEU_abgeordnetenkammer^3|1%]§!\n    Factory Output: [?HEU_left_party_industrial_capacity_factory|=+%2]\n    Party Stability: [?HEU_left_party_stability_factor|=+%2]"

 benriya_kivotos_text_tt: "£GFX_benriya_kivotos_texticon §GUnion Student Party§! (Union Studentenpartei)"
 benriya_right_text_tt: "£GFX_benriya_right_texticon §1Right Party§! (Rechtspartei)"
 benriya_centre_text_tt: "£GFX_benriya_centre_texticon §CRadical-Liberal Party§! (Radikal-Liberal Partei)"
 benriya_left_text_tt: "£GFX_benriya_left_texticon §RCommunist Party of Luxembourg§! (Kommunistische Partei Luxemburgs)"

 benriya_kivotos_text_tt_delayed: "£GFX_benriya_kivotos_texticon The §GUnion Student Party§! began with the disorganized club structures of Gehenna and grew to include immigrants from Trinity, Red Winter, Millennium, and others. It is a pan-Kivotos civil rights party and a royalist faction that supports Rikuhachima Aru as the 'sole leader capable of achieving harmony between the two peoples.' In a situation where the General Student Council has effectively failed to protect the interests of all Kivotosians, the Union Student Party claims to have inherited the spirit of the GSC. Since over half of the party members are from Gehenna, it possesses a radical social-liberal tendency that inherits Gehenna's free academic traditions. As the only party among the local factions that advocates for the rights of women, the disabled, sexual minorities, and ethnic minorities, the US draws wariness from conservative mainstream Luxembourgish locals while receiving support from some liberal-minded locals."
 benriya_right_text_tt_delayed: "£GFX_benriya_right_texticon The §1Right Party§! is a reactionary Catholic agrarian party. They believe that the democratization of 1919 was a fundamental mistake. Because of democracy, which allowed the 'riff-raff' to speak as they pleased, the 'workers' who should have remained silent in the coal mines began to clamor. The pastoral and beautiful life of the 19th century—where even those who couldn't read or write their own names could live peacefully and thoughtlessly—was buried by steel companies and the suffocating smoke of industrialization that pushed into the farmlands. The Right Party wishes for the country to remain in the 19th century and, in particular, earnestly hopes for a lead bullet to be lodged in the head of Rikuhachima Aru, who brought the word 'change' to Luxembourgish society."
 benriya_centre_text_tt_delayed: "£GFX_benriya_centre_texticon The §CRadical-Liberal Party§! is a party that is neither particularly radical nor liberal, but it serves as an attractive alternative for middle-class urbanites who mistakenly believe they are progressives and wish to vote for something other than the rustic Right Party. Founded in 1904, it was originally named the Liberal League (Liberale Liga), but it repeatedly changed its name as Luxembourg's minor liberal factions engaged in a cycle of merging and splitting. After 30 years of political life, the RLP realized it could survive in Luxembourg's right-leaning political landscape by 'turning on the left blinker but making a right turn.' Until the Grand Translocation, they played the role of a small coalition partner, voting in favor of the Right Party's policies while unfolding their version of Luxembourgish radical-liberal ideals."
 benriya_left_text_tt_delayed: "£GFX_benriya_left_texticon The §RCommunist Party§! is a hardline Stalinist party that believes 'workers of the world must unite as equals,' and therefore, Kivotosian workers should be granted the same rights as humanity. They were chosen as a partner for Problem Solver because they are the only party whose platform guarantees the rights of the Kivotos population. However, Aru is well aware that the KPL would love to tie the four members of Problem Solver 68 in the very bedroom where the House of Nassau was massacred and trigger a 'Nikolai-style' solution. Due to ideological differences, the KPL and Problem Solver 68 raise their middle fingers at each other, hoping for the other's (as swift as possible) ruin. Nevertheless, due to the grand cause of advancing Kivotosian rights, they have temporarily set aside the 'Russian Final Solution' to work together."

 HEU_abgeordnetenkammer_promotion_kivotos_party: "£GFX_benriya_kivotos_texticon Support §GK§!ivotos Capitalists"
 HEU_abgeordnetenkammer_promotion_kivotos_party_desc: "While it carries the grandiose name of 'Kivotos Capitalists,' this is actually a proposal to provide funding for venture companies so that skilled Kivotosian personnel—possessing technology from a century in the future—can grow into Luxembourg's emerging capitalist class.\n\nIn particular, immigrant engineers from nearby Millennium have various ideas for creating Kivotos-level white goods by 'moderately' refurbishing outdated local factories. Since the growth of such Kivotosian companies requires joint ventures with local capitalists who own land and capital, this may be a way to achieve the 'improvement of relations between Kivotosians and locals' that Aru dreams of."

 HEU_abgeordnetenkammer_promotion_right_party: "£GFX_benriya_right_texticon §1A§!gricultural Direct Payments"
 HEU_abgeordnetenkammer_promotion_right_party_desc: "Unlike the capitalists and petty bourgeoisie in Luxembourg who hope the peasantry 'goes bust' as quickly as possible to move into industrial and mining jobs, the Right Party argues that agriculture is the most important industry in Luxembourg. They claim the collapse of the farming class must be prevented through an 'Agricultural Direct Payment' system that provides a minimum living subsidy to farmers.\n\nThe most powerful voters supporting the Right Party are conservative Catholics, farmers, and livestock raisers. Maintaining a 'pastoral' 19th-century lifestyle will be of great help in weakening the Communist Party, which receives support particularly from mining and steelworkers."

 HEU_abgeordnetenkammer_promotion_centre_party: "£GFX_benriya_centre_texticon Favor §CP§!etit Bourgeoisie"
 HEU_abgeordnetenkammer_promotion_centre_party_desc: "Following the collapse of the Luxembourgish Franc system due to the 1935 Grand Translocation, the hardest hit were the Luxembourgish petty bourgeoisie (petit-bourgeois) who lost their capital entirely. From small business owners operating steel companies or coal mines—the most important industries in Luxembourg—to self-employed individuals and urban petty bourgeois classes like doctors and lawyers, many lost significant portions of their assets and are struggling to rebuild.\n\nSince the main support for the Radical-Liberal Party comes from urban petty bourgeoisie, we need to implement policies for these 'disempowered' citizens. The most effective support would be income tax cuts for professionals and managers, or choosing a method where state-owned banks provide loans at very low interest rates to petty bourgeoisie with certain capital and qualifications."

 HEU_abgeordnetenkammer_promotion_left_party: "£GFX_benriya_left_texticon §RL§!abor Movement"
 HEU_abgeordnetenkammer_promotion_left_party_desc: "The traditional supporters of the Communist Party of Luxembourg are the workers of the Minette region—the mining and steel districts of southern Luxembourg. The southern steel belt has long been called the 'Red Land,' showing strong support for the KPL and revolutionary zeal for Marxism-Leninism.\n\nSince entering the governing coalition, the KPL seeks to secure more support through even stronger industrial actions and struggles for steelworkers. This involves monitoring capitalists for wage arrears, checking worker safety conditions, and collective struggles led by the vanguard party for higher wages and more rest time."

 HEU_abgeordnetenkammer_skill_1_kivotos_party: "£GFX_benriya_kivotos_texticon §GUnion Student Party Support§!: Kivotos Cultural Festival!"
 HEU_abgeordnetenkammer_skill_1_kivotos_party_desc: "The Union Student Party believes that by more actively spreading Kivotos cultures—such as DJing, Rock, and Animation—the locals will gradually adapt to Kivotos culture and grow to like Kivotosians. Soft power always possesses a strength of its own, doesn't it?"

 HEU_abgeordnetenkammer_skill_1_right_party: "£GFX_benriya_right_texticon §1Right Party Support§!: Traditional Loyalty"
 HEU_abgeordnetenkammer_skill_1_right_party_desc: "Although the Right Party is a severe '19th-century' party characterized by anti-democracy, opposition to industrialization, and agrarianism, their conservative nature allows us to receive their help in situations where 'patriotism for the motherland' is required."

 HEU_abgeordnetenkammer_skill_1_centre_party: "£GFX_benriya_centre_texticon §CRadical-Liberal Party Support§!: Commercial Revitalization"
 HEU_abgeordnetenkammer_skill_1_centre_party_desc: "As a petty-bourgeois-centered party consisting of self-employed individuals and small business owners, the Radical-Liberal Party can revitalize Luxembourg's commerce and encourage our middle class to spend more."

 HEU_abgeordnetenkammer_skill_1_left_party: "£GFX_benriya_left_texticon §RCommunist Party Support§!: Patriotic Struggle!"
 HEU_abgeordnetenkammer_skill_1_left_party_desc: "Marx said workers of the world must unite, but real-world socialism doesn't always follow such sweet ideals. When the nation is in danger, Marxist-Leninists possess an eloquence and propaganda capability for mobilizing workers to the front lines for a single motherland or nation that is just as formidable as that of 'National Socialists.'"

 HEU_abgeordnetenkammer_random_party: "Public Opinion on Parliament"
 HEU_abgeordnetenkammer_random_party_desc: "How wonderful it would be if public opinion were always static! One could simply click a few options to fill a favorite party's influence to one hundred percent and watch it stay that way. But no. That's not how reality works.\n\nPublic opinion continues to shift over time, and through that process, the influence of political parties fluctuates."

 ## Memorial Park Decisions

 HEU_memorial_park_decision_category: "Establishment of Memorial Park"
 HEU_memorial_park_decision_category_desc: "The §YGrand Translocation§! became a cataclysmic event that forever changed the lives of all Europeans. While §YLuxembourg§! is the only nation among those reached by Kivotosians to have preserved its territory intact immediately after the translocation, the cost was by no means cheap. Gehenna students treated the sudden interdimensional transfer phenomenon as a sort of festival or game, firing weapons in the streets of Luxembourg and throwing a §R'party'§! in their own way.\n\nHundreds of deaths occurred, and the Grand Ducal House of Nassau was slaughtered by students who came to loot the palace. While leading the parliamentary Grand Coalition, Aru concluded that for §Gthe coexistence of Kivotosians and humanity§!, the locals would never forgive Kivotosians and accept them as fellow citizens unless an apology was first offered to humanity for this tragic catastrophe.\n\nIt has been agreed that a Memorial Park will be constructed on the site of the §YBerg Castle§!, the former summer palace of the House of Nassau. However, Gehenna students mock Aru, claiming she is too focused on licking the boots of the locals to maintain her fancy §Onoble§! title. The slur §R'Prime Minister's Dog'§! is circulating openly, and there are contemptuous whispers that she is framing common Kivotos firearm incidents as if they were some grand sin.\n\n§RCan we truly build this Memorial Park?§!\n\n	[GEH.GetFlag] Gehenna Resentment: [?HEU_memorial_angry_gehenna|+0]\n [LUX.GetFlag] Local Support: [?HEU_memorial_support_people|+0]\n"

 HEU_memorial_park_completion: "Memorial Park Completed"
 HEU_memorial_park_completion_desc: "Through continuous construction, the Memorial Park is complete! We shall have to see if the citizens of Luxembourg are satisfied with this park."

 HEU_memorial_park_wilhelm_II: "Invite Wilhelm II"
 HEU_memorial_park_wilhelm_II_desc: "The Communist Party of Luxembourg wants to 'invite' Wilhelm II, who invaded Luxembourg during the Great War, to the memorial site under construction along with reporters. They want to pressure him to tour the park and offer words of mourning to the Luxembourgish people. While this stems from a desire to mock the former invader-turned-exile and the typical communist hostility toward 'feudal monarchs,' this spectacle will certainly entertain the citizens of Luxembourg."

 HEU_memorial_park_records_of_nassau: "Museum Proposal - Memories of Nassau"
 HEU_memorial_park_records_of_nassau_desc: "We intend to construct a records space within Berg Castle to commemorate the former ruler, Grand Duchess Charlotte, and her family. The communists are furious, calling it 'glorification of feudal remnants rather than mourning,' and the Gehenna students also seem uncomfortable."

 HEU_memorial_park_records_of_gehenna: "Museum Proposal - Tragedies of the Translocation"
 HEU_memorial_park_records_of_gehenna_desc: "We will display interview records of survivors and models of destroyed facilities from the time of the Grand Translocation inside Berg Castle. While clearly necessary, the fury of Gehenna students is expected."

 HEU_memorial_park_gardening: "Park Proposal - Gardening"
 HEU_memorial_park_gardening_desc: "Let us plant various flowers on the memorial park grounds surrounding the palace, processing the facilities so that even those uninterested in the tragedy of the translocation can visit for leisure."

 HEU_memorial_park_tombstone: "Park Proposal - Construct Memorial Cenotaph"
 HEU_memorial_park_tombstone_desc: "We will construct a cenotaph on the memorial park grounds inscribed with the names of all those sacrificed during the Grand Translocation. Noble victims, including the Grand Ducal family, will have their names inscribed in the same size as ordinary citizens."

 HEU_memorial_park_tombstone_2: "Park Proposal - Cenotaph and Grand Ducal Memorial"
 HEU_memorial_park_tombstone_2_desc: "We will construct a cenotaph on the memorial park grounds inscribed with the names of all those sacrificed during the Grand Translocation. At the request of royalist nationalists, the noble victims, including the Grand Ducal family, will be commemorated with a separate memorial in a different location from the commoners. The Communist Party will be enraged by the news of giving preferential treatment to noble victims."

 HEU_memorial_park_promotion: "Park Proposal - Promote Memorial Park Construction"
 HEU_memorial_park_promotion_desc: "Let's run articles in the press to inform the public in advance that the Memorial Park is under construction. Once completed, even more mourners will visit the park. Gehenna students won't like this promotion, though."

 HEU_memorial_park_something_KPL: "§RThe Communist Party is up to something...§!"
 HEU_memorial_park_something_KPL_desc: "The Communist Party suspects that the establishment of the Memorial Park might be a conspiracy to rally royalist forces and have them support Aru as the new successor. Their paranoia is unlikely to lead to good results."

 HEU_memorial_park_something_gehenna: "§RGehenna students are up to something...§!"
 HEU_memorial_park_something_gehenna_desc: "\"Gunfights were just daily life in Kivotos, so why are they trying to insult us over something like that?\""

 ## Luxembourg Alliance
 HEU_benriya_ally_decision_category: "Finding Allies for [ROOT.GetName]"
 HEU_benriya_ally_decision_category_desc: "Now that we have decided to oppose Gehenna and advance westward, we must find suitable allies other than Gehenna. The nations we can choose as allies will vary depending on our political and diplomatic situation."

 HEU_benriya_ally_roma: "Request to Join [ITA.GetFactionName]"
 HEU_benriya_ally_roma_desc: "Italy is the most preferred alliance candidate for nationalists, including the Right Party. We share the significant commonality of 'Human civilization standing against Kivotos,' and they are also the most promising military force remaining in Europe. The question is whether they will need us."

 HEU_benriya_ally_soviet: "Request to Join Comintern"
 HEU_benriya_ally_soviet_desc: "Everyone knows that the Communist Party of Luxembourg is a Stalinist party and 'aches' for an alliance with Stalin. Although Luxembourg has the 'minor' issue of being a monarchy, the KPL believes that if we prove our value to Stalin, we can certainly achieve cooperation with the Soviets."

 HEU_benriya_ally_benelux: "Propose Benelux Union"
 HEU_benriya_ally_benelux_desc: "Belgium and the Netherlands were allies with whom we shared long-standing ties, and those ties were not completely severed even after the two nations went into exile following the Grand Translocation. While not a powerful alliance, it is the most likely one."

 HEU_benriya_ally_abydos: "Propose Alliance with Abydos"
 HEU_benriya_ally_abydos_desc: "Abydos and we share the commonality of being moderate forces advocating for the 'coexistence of locals and Kivotosians.' If we acknowledge our common ground and cooperate together, it might become the most powerful alliance of all."

 HEU_benriya_ally_allies: "Request to Join the Allies"
 HEU_benriya_ally_allies_desc: "The Grand Duchy of Luxembourg will join the Allies as a protector of human civilization, standing on the front lines against other Kivotos nations. This is a quite uncomfortable decision that neither nationalists nor communists like, but if there are no other alternatives, joining the Allies can be considered as a next best option."

 HEU_total_assault_kaitenger_decision_category: "Total Assault - Kaitenger"
 HEU_total_assault_kaitenger_decision_category_desc: "\n\n£GFX_HEU_total_assault_kaitenger\n\n\n\n\n\nThe actions of the §RKaitenger§! villains, which began with robbing donation boxes, have gone too far. The Kaitengers have declared Problem Solver 68—who interfered with their previous robbery—as the §YEnemies of Justice§! and have invaded Luxembourg using their self-developed robot, §YKAITEN FX Mk.0§!.\n\nWhether it's their 'romance' or whatever doesn't matter to Problem Solver 68. The truly important thing is that they are a threat to Luxembourg, and the Kaitengers must be arrested.\n\n§YKAITEN FX Mk.0§! HP [?kaitenger_hp|+0]/256\n"

 HEU_total_assault_aru_EX: "§GAru§! - Scorching Serenade"
 HEU_total_assault_aru_EX_desc: "Aru can no longer use her former weapon, Wine Red Admire, due to severe visual impairment and the aftereffects of complex fractures from her wrist to her shoulder. However, she can still hold a pistol with her damaged side, and if it's just throwing a bag of grenades with her healthy hand, she can still demonstrate the skills from her Kivotos heyday. Even if she can't, the fact that the other three are by her side hasn't changed, has it?"

 HEU_total_assault_mutsuki_EX: "§GMutsuki§! - Hard-Boiled Shot"
 HEU_total_assault_mutsuki_EX_desc: "Aru's former weapon, Wine Red Admire, is still awkward for Mutsuki. But to protect her most precious friend Aru, Mutsuki will fight on the front lines with Aru's weapon as much as needed."

 HEU_total_assault_kayoko_EX: "§GKayoko§! - Interesting Proposal"
 HEU_total_assault_kayoko_EX_desc: "Will pistol rounds be effective against a giant robot? Instead, Kayoko intends to help Aru neutralize the KAITEN by targeting the enemy's weaknesses."

 HEU_total_assault_haruka_EX: "§GHaruka§! - Hard-Boiled Hanetsuki Shot"
 HEU_total_assault_haruka_EX_desc: "Since Aru has changed her combat style from long-range sniping to close-quarters combat due to her physical disabilities, someone is needed to protect Aru's side. Who else but Haruka could take on that role?"

 HEU_total_assault_kaiten_EX: "§RKAITEN FX Mk.0 is destroying the city!§!"
 HEU_total_assault_kaiten_EX_desc: "If we don't knock down those crazed 'Warriors of Justice' quickly, big trouble will follow..."

 HEU_total_assault_debug_EX: "§GAru§! - Our Aru is so cute T_T"
 HEU_total_assault_debug_EX_desc: "This is a debug decision for Kaitenger death testing. If this decision is visible during normal play, please report the bug."

 ## German Reunification War
 HEU_german_reunification_war_decision_category: "War of Germanic National Integration"
 HEU_german_reunification_war_decision_category_desc: "Historically, the §GGrand Duchy of Luxembourg§! never claimed to be the §Yleading state of the Germanic people§!. Naturally, Luxembourg was a relatively weak nation compared to the surrounding powers. Conversely, in the World War of 1914, Luxembourg suffered a painful history of occupation by the armies of §YWilhelm II§!.\n\nHowever, now that Germany has been shattered into pieces by the §YGrand Translocation§! and Luxembourg has become stronger due to Kivotosian soldiers, the story of §Ysubjugating both Gehenna and Trinity to unify the divided Germanic people§! is no longer an unrealistic delusion.\n\nOf course, this process won't be easy, but we hope the grand strategy of [ROOT.GetLeader] and the military will prove effective."

 HEU_german_wilhelm_II: "Request Reunification Support from Wilhelm II"
 HEU_german_wilhelm_II_desc: "The former Emperor living in exile in Luxembourg carries the original sin of having invaded and occupied Luxembourg in the last World War, and as a result, he fears being expelled from his place of exile. Therefore, there is virtually no chance he will refuse the government's official request to support Germanic reunification led by Luxembourg. His popularity in Germany as the last Emperor of the German Empire is negligible, but it is possible that some German Junkers may make wartime investments in Luxembourg following his endorsement."

 HEU_german_war_plan_GEM: "War Plan Against [GEM.GetName]"
 HEU_german_war_plan_GEM_desc: "General Émile Speller, who personally participated in combat against Gehenna students as the Gendarmerie Commander—effectively the Chief of Staff—during the Grand Translocation, is enthusiastically preparing a wartime plan against the [FROM.GetAdjective] for the unification war led by Rikuhachima."

 HEU_german_war_plan_GEH: "War Plan Against [GEH.GetName]"
 HEU_german_war_plan_GEH_desc: "General Émile Speller, who personally participated in combat against Gehenna students as the Gendarmerie Commander—effectively the Chief of Staff—during the Grand Translocation, is enthusiastically preparing a wartime plan against the [FROM.GetAdjective] for the unification war led by Rikuhachima."

 HEU_german_war_plan_TRM: "War Plan Against [TRM.GetName]"
 HEU_german_war_plan_TRM_desc: "General Émile Speller, who personally participated in combat against Gehenna students as the Gendarmerie Commander—effectively the Chief of Staff—during the Grand Translocation, is enthusiastically preparing a wartime plan against the [FROM.GetAdjective] for the unification war led by Rikuhachima."

 HEU_german_negotiations_plan: "Reunification Negotiations with [FROM.GetName]"
 HEU_german_negotiations_plan_desc: "Rather than going to war with the local forces immediately, it is better to first negotiate to see if they can be brought over to our side."

 HEU_alliance_with_trinity: "Coordinated Attack on Gehenna with Trinity"
 HEU_alliance_with_trinity_desc: "We have made a pact with Trinity to launch a pincer attack on Gehenna, and now is the time to execute that contract. The fate of Problem Solver 68 depends on this war."

 HEU_scavenge_baden: "Acquire Weapons in [978.GetName]"
 HEU_scavenge_baden_desc: "We can obtain weapons from anti-Gehenna resistance forces in the German mainland."

 HEU_scavenge_wurttemberg: "Acquire Weapons in [50.GetName]"
 HEU_scavenge_wurttemberg_desc: "$HEU_scavenge_baden_desc$"

 HEU_scavenge_nassau: "Acquire Weapons in [55.GetName]"
 HEU_scavenge_nassau_desc: "$HEU_scavenge_baden_desc$"

 HEU_scavenge_moselland: "Acquire Weapons in [1052.GetName]"
 HEU_scavenge_moselland_desc: "$HEU_scavenge_baden_desc$"

 HEU_scavenge_hannover: "Acquire Weapons in [59.GetName]"
 HEU_scavenge_hannover_desc: "$HEU_scavenge_baden_desc$"

 HEU_create_militia_in_luxembourg: "Nationalist Volunteers in Luxembourg"
 HEU_create_militia_in_southwest_gehenna: "Germanic Nationalist Volunteers in Southwest Gehenna"
 HEU_create_militia_in_souteast_gehenna: "Germanic Nationalist Volunteers in Southeast Gehenna"
 HEU_create_militia_in_northwest_gehenna: "Germanic Nationalist Volunteers in Northwest Gehenna"
 HEU_create_militia_in_northeast_gehenna: "Germanic Nationalist Volunteers in Northeast Gehenna"
 
 HEU_ideological_loyalty_spirit_plot: "Ideological Propaganda for Integration"
 HEU_ideological_loyalty_spirit_plot_desc: "Asagi Mutsuki has devised a 'Dual Propaganda' plan: to Gehenna students, she promotes this war as the outlaw Aru's adventure to conquer both divided Gehenna and Trinity; to the Germanic residents, she promotes it as a holy war to integrate the Germanic people divided since the Grand Translocation. Neither may be one hundred percent true. But to make Rikuhachima Aru a hero to both peoples, Mutsuki is prepared to use the lives of the fools who fall for the propaganda as disposable pawns.\n\nEven if Aru doesn't want that."
 
 HEU_ask_international_for_help: "Request International Assistance"
 HEU_ask_international_for_help_desc: "Aru's grand strategy of pincer-attacking Gehenna in alliance with Trinity has ultimately failed. Well, it's not the first time President Aru's 'genius' tactics have fallen through. But since the situation is already underway, someone must clean up this mess. Onikata Kayoko is working to find help from nations other than Trinity as a 'Plan B' now that the alliance plan has failed."

 HEU_west_germanic_unity_declaration: "Declaration of Perpetual Liberation of the West Germanic"
 HEU_west_germanic_unity_declaration_desc: "By succeeding in entering our army into the heart of Pandemonium, we can gloriously declare the perpetual liberation of the West Germanic zone! This will be a great decision for Rikuhachima Aru's victory."

 HEU_german_annex_core_elsass_lothringen_states:0 "Assimilate Alsace-Lorraine" 
 HEU_german_annex_core_elsass_lothringen_states_desc:0 "Alsace-Lorraine is a Germanic territory with a long history and naturally maintains a deep familiarity with Germanic culture, still using the German language to this day. If the Ducal Army marches into Alsace-Lorraine, they will accept us as members of the same ethnic community."

 HEU_german_annex_core_holstein_states:0 "Assimilate Schleswig-Holstein" 
 HEU_german_annex_core_holstein_states_desc:0 "Schleswig-Holstein, being Germanic territory, must naturally be integrated into the single Germanic union."

 HEU_german_annex_core_danzig_states:0 "Assimilate Danzig" 
 HEU_german_annex_core_danzig_states_desc:0 "Danzig, being Germanic territory, must naturally be integrated into the single Germanic union."

 HEU_german_annex_core_austria:0 "Join Austrian Federal State" 
 HEU_german_annex_core_austria_desc:0 "The United Germanic Duchy is fundamentally a Lesser German unification plan led by the Grand Duchy of Luxembourg. However, as we have embarrassingly occupied Austria due to changes in the international situation, we have formed an unintended 'Greater Germany.' If the residents there claim they too are Germanic and demand equal rights as a federal state, what should we do? We can't very well change the country's name again at this point."

 HEU_german_annex_core_sudetenland:0 "Join Sudetenland Federal State" 
 HEU_german_annex_core_sudetenland_desc:0 "The United Germanic Duchy is fundamentally a Lesser German unification plan led by the Grand Duchy of Luxembourg. However, as we have embarrassingly occupied the Sudetenland due to changes in the international situation, we have formed an unintended 'Greater Germany.' If the residents there claim they too are Germanic and demand equal rights as a federal state, what should we do? We can't very well change the country's name again at this point."

 ## Rikuhachima Aru vs Damian Kratzenberg
 HEU_aru_internet_overdose_decision_category:0 "Playful £GFX_BA_star Straight"
 HEU_aru_internet_overdose_decision_category_desc:0 "\n\n\n\n\n£GFX_HEU_idol_aru_daisuki\n\n\n\n\n\n\n\n\nAn unidentified Virtual Streamer named §YNanami Ayaka§! claims to be a girl from §GTrinity General School§!. Since the early days of the 68 Revolution, she has used SNS communities to criticize Aru's §Y68 Revolution§! as nothing more than state violence akin to §RBolshevik revolutions§!. Since Aru began calling herself the §YKivotos GSC President§!, she debuted as a VTuber and has continued political broadcasting and government criticism through §Yinternet streaming§!.\n\n The problem is that Nanami Ayaka's streaming is gaining popularity and becoming the §CFirst Star of Counter-Revolution§!. Since her VTuber debut, she has actively utilized internet broadcasts to argue that §Ythe Kivotosian perpetrators cannot force their morality onto the locals§!, and her claims are inciting not only many locals but also some Kivotosians who dislike Aru.\n\n...Ultimately, to face the §CCounter-Revolution§!, Aru herself must step forward for the §PRevolution§!. Aru's state-run streaming channel, §PPlayful £GFX_BA_star Straight§!, has opened to resist Nanami Ayaka. The 68 Revolution and the Counter-Revolution. The winner will be decided by the people.\n"

 HEU_idol_ayaka_nanami_tt: "Activity Intensification: [?benriya_keystones]"

 HEU_aru_internet_overdose_keystone:0 "Currently Secured Keystones: £GFX_benriya_keystone_texticon [?benriya_keystones]"

 HEU_idol_ayaka_nanami_text_tt: "§YNanami Ayaka§!"
 HEU_idol_ayaka_nanami_text_tt_delayed: "[HEU_ayaka_nanami_desc_text]"

 HEU_ayaka_nanami_desc_0: "Only Damian Kratzenberg himself and the AI Arona know that the self-proclaimed VTuber §YNanami Ayaka§! is actually the Luxembourgish dissident National Socialist, §YDamian Kratzenberg§!. Thanks to thoroughly hiding his identity for the past few years and creating fake personas through SNS, no one realizes that Nanami Ayaka's true identity is Kratzenberg. Of course, the perfect voice changer program and 2D modeling created with Arona's support have also played a role.\n\nWhat is the motive driving Damian Kratzenberg now? Is it because of his wife, who was shot while wandering the streets looking for him on the day of the §YGrand Translocation§!? Or is it the PTSD from when he crouched in a classroom on the day of the translocation, trembling in fear that the students and Gehenna girls wouldn't find them? Or is it because he is enraged by Rikuhachima Aru's arrogance in claiming she will replace §Yinferior§! human culture with §Ysuperior§! Kivotos culture? Even Kratzenberg himself probably couldn't pin down a single reason. Likely, all three have influenced him.\n\nKratzenberg currently resides in the Craft Chamber in the basement of the ruined Schale building to avoid tracking by Problem Solver 68, streaming on the internet every evening until night. Arona is worried that Kratzenberg's passionate broadcasting will harm his health, but Kratzenberg doesn't care. To change the world in a §Rdirection Rikuhachima Aru does not want§!. To achieve that goal, he can handle some strain."
 HEU_ayaka_nanami_desc_1: "Only Damian Kratzenberg himself and the AI Arona know that the self-proclaimed VTuber §YNanami Ayaka§! is actually the Luxembourgish dissident National Socialist, §YDamian Kratzenberg§!. Thanks to thoroughly hiding his identity for the past few years and creating fake personas through SNS, no one realizes that Nanami Ayaka's true identity is Kratzenberg. The 3D modeling Arona perfectly created has also made the broadcasts more flamboyant!\n\nWhat is the motive driving Damian Kratzenberg now? Is it his wife who died during the translocation? The PTSD from that day? Or Aru's arrogance? Even he doesn't know for sure. Kratzenberg resides in the basement of the ruined Schale building, streaming every night while Problem Solver 68 hunts for him. While his broadcasts gain popularity, he is also gradually wearing down. He drinks all sorts of alcohol late into the night to overcome his trauma. Arona calls him 'Nazi Sensei' and keeps her distance, yet she hopes he reduces his drinking."
 HEU_ayaka_nanami_desc_2: "Only Damian Kratzenberg himself and the AI Arona know that the self-proclaimed VTuber §YNanami Ayaka§! is actually the Luxembourgish dissident National Socialist, §YDamian Kratzenberg§!. Thanks to thoroughly hiding his identity for the past few years and creating fake personas through SNS, no one realizes that Nanami Ayaka's true identity is Kratzenberg. The 3D modeling Arona perfectly created has also made the broadcasts more flamboyant!\n\nWhat is the motive driving Damian Kratzenberg now? Is it his wife who died during the translocation? The PTSD from that day? Or Aru's arrogance? Even he doesn't know for sure. While his internet popularity is skyrocketing, a recent diagnosis of liver cancer is surely driving Kratzenberg's body toward death. To heal the wounds of the translocation in this land and protect the students who will live in the future. To create a world where students can become the §Ybeings they want to be§! rather than the life forced upon them by the §GRevolutionary Committee§!. Only now, with death approaching, has Kratzenberg begun to think about the future for all of humanity rather than National Socialism and racism. ...In the end, weren't Kratzenberg and Aru both essentially of the same mind in wanting to make the world a better place?"
 HEU_ayaka_nanami_desc_3: "Once, §YNanami Ayaka§! was called by the name Damian Kratzenberg. No. In fact, Nanami Ayaka is a different person who has inherited all the memories of Damian Kratzenberg. The 'original' Kratzenberg, who eventually died, will not return.\n\nSo what is driving Nanami Ayaka now? The final testament Kratzenberg left as he was dying of liver cancer: §YPlease take care of my students.§! - Nanami Ayaka knew that she would have said the same thing to her successor if she were in that situation. By now, taking down Aru or that damn National Socialism is no longer important. At least Arona is by her side. And the memories of the students who once believed in and followed her past self remain. She simply fights for those memories and to protect them.\n\nNanami Ayaka has decided to bear Damian Kratzenberg's burden. It doesn't matter if she is just another person who inherited his memories. §YThe person who protects students§!, and §Ythe being who leads them so they can become the existence they want to be§!—that's what a Sensei is, right? That alone has not changed, even after the body has changed and Kratzenberg is no longer Kratzenberg."

 HEU_aru_internet_overdose_collecting_keystone:0 "The opponent is collecting £GFX_benriya_keystone_texticon §YKeystones§!..."
 HEU_aru_internet_overdose_collecting_keystone_desc:0 "\"Since Damian-sensei isn't a *real* Sensei of Kivotos... it's impossible for Damian-sensei to create Keystones or use the Adult's Card. However, there are Keystones left behind by the previous GSC President! Whether it's the trash dumps around Schale or even abandoned GSC buildings, you must collect Keystones somehow. To properly use the Craft Chamber, we need to gather enough Keystones.\""
 
 HEU_aru_internet_overdose_the_last_time:0 "§RThe End of the Story§!"
 HEU_aru_internet_overdose_the_last_time_desc:0 "Nanami Ayaka's broadcast is gaining awareness. The confrontation between the revolution Problem Solver dreams of and the counter-revolution opposing it is intensifying. We do not have infinite time. ...To face a true 'Happy Ending,' we need to defeat the threat to humanity as quickly as possible."

 HEU_aru_internet_overdose_the_last_time_tt: "Before the §YTime Limit§! expires, destroy the threat to humanity, save Kivotos and mankind, and then complete the ending focus. Reaching this time limit does not mean §RGame Over§!, but §Ythe content of the ending§! that Problem Solver and Rikuhachima Aru face will change. Good luck!\n\nAnd, never give up!"

 ## Mutsuki Route Decisions
 HEU_mutsuki_aru_mental_trauma_decision_category: "Aru's Mental Health State"

 aru_mental_trauma_local: "Following the successful coup, §YAru§! has been confined to a safe house. §YMutsuki§! intends to protect her from all external threats. Of course, Aru herself probably doesn't want this warm protection. In a safe house whose location is not exactly known, Aru's never-ending vacation has begun.\n\nWhile Mutsuki provides everything Aru wants in the safe house, she refuses to hand over the one thing Aru truly desires: 'freedom.' During her confinement, Aru can sense the passage of time outside by reading censored newspapers.\n\nHow the relationship between Mutsuki and Aru changes will be determined by Aru's mental state. If Aru's mental limit reaches its peak, the relationship between the two will §Rcertainly not flow in a good direction§!.\n\n§YInfo§!: Aru's mental health state can be checked by hovering over the picture frame."

 HEU_aru_mental_trauma_timelimit: "Aru's Mental Health Deterioration"
 HEU_aru_mental_trauma_timelimit_desc: "The longer Rikuhachima Aru's confinement lasts, the worse her mental health deterioration will become.\n\n§RSmile!§!"

 HEU_aru_mental_trauma_care_1: "Send Haruka"
 HEU_aru_mental_trauma_care_1_desc: "Mutsuki doesn't want Aru to be confined permanently. The reason she confined Aru was solely to protect her. Mutsuki intends to release Aru once she becomes a hero worshipped by all locals and Kivotosians alike. However, until that heroic day arrives, Aru needs stimulation. Today, Haruka will spend time with Aru to treat her boredom." # Charisma

 HEU_aru_mental_trauma_care_2: "Send New Entertainment"
 HEU_aru_mental_trauma_care_2_desc: "Whether it's a game console or sports equipment that can be used alone, provide new stimulation for Aru. I'm sure it will be fun." # Determination
  
 HEU_aru_mental_trauma_care_3: "Send Kayoko"
 HEU_aru_mental_trauma_care_3_desc: "Send Kayoko, who is locked in prison, to Aru for a day to play together. Well, they might discuss escape plans, but how could such a plan succeed now?" # Wisdom
 
 HEU_aru_mental_trauma_care_4: "Tea Party with Guards"
 HEU_aru_mental_trauma_care_4_desc: "Aru's guards are not robots, but living, breathing Gehenna soldiers. They also don't dislike spending a day chatting with Aru, the hero of Luxembourg." # Kindness 

 HEU_aru_mental_trauma_EX: "Motivation to Live for Tomorrow"
 HEU_aru_mental_trauma_EX_desc: "This will only work once, but through immense anger, one can gain the strength to overcome despair for a short period."


 HEU_mutsuki_aru_mental_trauma_decision_debug_add_10: "Debug: Aru Mental Deterioration +10%"
 HEU_mutsuki_aru_mental_trauma_decision_debug_add_100: "Debug: Aru Mental Deterioration +100%"
 HEU_mutsuki_aru_mental_trauma_decision_debug_sub_10: "Debug: Aru Mental Deterioration -10%"
 HEU_mutsuki_aru_mental_trauma_decision_debug_sub_100: "Debug: Aru Mental Deterioration -100%"

 ## Problem Solver 68 Overseas Business
 HEU_benriya_68_overseas_business_decision_category: "[HEU.GetNameDef] Duties"
 HEU_benriya_68_overseas_business_decision_category_desc: "The §YGrand Duchy of Luxembourg§! has acquired a dual status as both a §Yhuman local nation§! and a §YKivotosian nation§! since the translocation. Luxembourg still has a Luxembourgish Prime Minister and Parliament, but the monarch they serve is the Kivotosian Rikuhachima Aru. Rikuhachima Aru owns §YProblem Solver 68§!, a personal private army separate from the Luxembourgish military, and she intends to dispatch some of them overseas to engage in industrial work. If we invest an appropriate budget, we can add Kivotos' advanced technology to our industry."

 ## Mutsuki Government Decisions
 HEU_mutsuki_government_decision_category: "Little Demon Cabinet Policy"
 HEU_mutsuki_government_decision_category_desc: "\n\n\n\n\n\n\nUnlike §YRikuhachima Aru§!, who had idealistic dreams, Asagi Mutsuki has no particular direction for national policy. The Mutsuki government's sole goal is to make Aru a hero. Therefore, the new government has neither a state philosophy nor a firmly established policy direction.\n\nOf course, just because her government cannot be categorized by the framework of liberalism or authoritarianism doesn't mean Asagi Mutsuki implements no policies at all. If the Mutsuki government were to be summarized, it could be called the §YLittle Demon Government§!. Mutsuki acts according to short-term goals rather than deciding policies with a long-term vision, making decisions based on somewhat impulsive and unpredictable subjective directions.\n\nWhile this was her characteristic even before the Grand Translocation, her §YLittle Demon§!-like tendencies have intensified as her psychological state has recently become unstable.\n"

 HEU_mutsuki_government_trinity: "§YPolicy Direction§!: Claim to be Trinity Host"
 HEU_mutsuki_government_trinity_desc: "There is actually no way to prove the claim that Asagi Mutsuki is from Gehenna. After all, she doesn't have demonic wings, horns, or any physical characteristics that make her look like she's from Gehenna. As a prank to shake the board, Mutsuki can spread the claim that 'I am an agent dispatched from Trinity before the Grand Translocation.' This is not a rational claim as it would be quite unpopular among the Gehenna population that makes up the absolute majority of Kivotosians in Luxembourg. But when has Mutsuki ever acted based on logic and reason?"

 HEU_mutsuki_government_gehenna: "§YPolicy Direction§!: Claim to be Gehenna Thunder Emperor"
 HEU_mutsuki_government_gehenna_desc: "As everyone knows, Mutsuki has nothing to do with the Thunder Emperor. Claiming that she is the Thunder Emperor ousted by Hanuma Makoto is not only absurd but also gains her nothing. But, isn't it fun?"

 HEU_mutsuki_government_little_demon: "§YPolicy Direction§!: Little Demon Liberalism"
 HEU_mutsuki_government_little_demon_desc: "Support Gehenna's free cultural climate. To be specific, it's about greatly reducing police power and interfering less in individual lives. Kivotos before the translocation was like that, and there were no big problems."

 HEU_mutsuki_government_shogun_asagi: "§YPolicy Direction§!: Shogun Asagi"
 HEU_mutsuki_government_shogun_asagi_desc: "Suppress Gehenna's disorder and greatly expand police power so that citizens remain under firm discipline. Mutsuki's major motivation is 'Heroizing Aru,' and Mutsuki remembers well that Aru became a hero by preventing the 'massacre crimes during the translocation.' Acting for someone more precious than anyone else. This is Mutsuki-like behavior even while not fitting Mutsuki's usual personality. It's not fun, but Hero Aru would have done so."

 HEU_mutsuki_propaganda_trinity_united: "§CPropaganda§!: Toward Trinity Integration!"
 HEU_mutsuki_propaganda_trinity_united_desc: "The current Host of Trinity is a fake. The 'true' Trinity Host is here. While many may not believe it, individuals who dislike the current Trinity government will support Asagi Mutsuki as an alternative Host. At least Mutsuki is a far more predictable Host than [TRM.GetLeader]'s side."

 HEU_mutsuki_propaganda_trinity_pound_hurrah: "§CPropaganda§!: Long Live the Yard-Pound!"
 HEU_mutsuki_propaganda_trinity_pound_hurrah_desc: "The metric system is Gehenna's cursed system of measurement. Elegant Trinity ladies all use superior calculations like yard-pounds and Fahrenheit."

 HEU_mutsuki_propaganda_generic_1: "§CPropaganda§!: For Germanic National Integration"
 HEU_mutsuki_propaganda_generic_1_desc: "Despite Mutsuki's hatred for the locals, the fact that our army is mostly composed of local humans cannot be ignored. Germanic reunification will be the best material for propaganda."

 HEU_mutsuki_propaganda_generic_2: "§CPropaganda§!: Emphasize Kivotos Restorationism"
 HEU_mutsuki_propaganda_generic_2_desc: "Even to regain that peaceful life in Kivotos, we must struggle! Against what? Of course, the authoritarians within and the imperialists without. We post a 'Let's Take Back Kivotos' movement toward the Kivotosian population inside Luxembourg. This is radical in that it emphasizes a liberal spirit felt as radical by the locals, yet reactionary in that it emphasizes 'the beautiful life of the past.'"

 HEU_mutsuki_propaganda_generic_3: "§CPropaganda§!: Enjoy the Festival, Not Work"
 HEU_mutsuki_propaganda_generic_3_desc: "Stop excessive labor and enjoy this time, this peace!"

 HEU_mutsuki_propaganda_gehenna_freedom_culture: "§CPropaganda§!: Free Art Culture"
 HEU_mutsuki_propaganda_gehenna_freedom_culture_desc: "Support various popular cultures based on Gehenna's free culture. Express your individuality in Luxembourg."

 HEU_mutsuki_propaganda_gehenna_united: "§CPropaganda§!: For Gehenna Integration"
 HEU_mutsuki_propaganda_gehenna_united_desc: "Whether it's the Pandemonium Society or the Gehenna Prefect Team, neither are proper organizations. Under the true leader Asagi Mutsuki, Gehenna will truly walk the right path."

 ## Luxembourg Division Decisions

 HEU_division_of_luxembourg_decision_category: "Division of Luxembourg"
 HEU_division_of_luxembourg_decision_category_desc: "Luxembourg has been split in two. The new government personnel loyal to §YAsagi Mutsuki§! and the Onikata Kayoko faction that does not recognize the Mutsuki government. The split between the two factions has remained at a level of military standoff without escalating into civil war due to rational movements to avoid repeating the tragedy that occurred in Luxembourg City in 1935, but it is clear that it will eventually end with one side attacking the other.\n\nThe Mutsuki government predicts a preparation period of §Yabout one year§!. This preparation period is the deadline when the Kayoko faction is expected to be forced to exhaust most of their food resources, stop their guerrilla warfare in the forest, and come out to the battlefield to face Mutsuki.\n\nDuring this period, the Mutsuki government must make maximum preparations. Ideally, Kayoko would realize they have no chance of winning and surrender to reduce damage. But if not, §Rthe damage will grow uncontrollably§!.\n\n£GFX_BA_game_rule_flag_LUX - Kayoko's Operations: [?HEU_faction_angry_kayoko|+0]\n£GFX_BA_game_rule_flag_HEU - Mutsuki's Readiness: [?HEU_faction_angry_mutsuki|+0]\n"

 HEU_division_of_luxembourg_deadline: "Deadline"
 HEU_division_of_luxembourg_deadline_desc: "This is the date when Kayoko and the Luxembourg resistance, having reached the limits of their food and ammunition, are predicted to choose a full-scale war with the Mutsuki cabinet. There is no chance for a resistance whose only halo soldier is Kayoko herself to win, but Kayoko will do her best to struggle and change the result."

 HEU_division_wilhelm_II: "Send Wilhelm II"
 HEU_division_wilhelm_II_desc: "Instruct Wilhelm II to demand the resistance surrender using his 'Imperial Dignity.' Wilhelm will be quite excited, thinking the Luxembourg government has recognized his authoritarian charisma, and will believe he can persuade Kayoko in one go.\n\nWill it go well? I'd bet a vote on it failing!"

 HEU_division_preparation_of_suppression_weapons: "Rules of Engagement - Strict Non-Lethal Weapons"
 HEU_division_preparation_of_suppression_weapons_desc: "Kivotosian soldiers believe that if the tragedy of 1935 occurs again, their position in Luxembourg will plummet endlessly. Mutsuki fears how Aru will look at her if that tragedy is repeated. These rules of engagement provide only non-lethal rubber bullets to the halo infantry fighting the rebels and instruct them not to use any live ammunition weapons against the rebels. While this will expose our halo infantry more to enemy fire, Kivotosian soldiers generally won't die from non-Kivotosian resistance. Endure it with your bodies."

 HEU_division_active_surrender: "Rules of Engagement - Active Surrender Acceptance"
 HEU_division_active_surrender_desc: "Verbally ask for surrender intentions three times before every engagement and only allow firing when the opponent does not surrender despite the three demands. This won't help our operation execution, but yes, it can induce some rebels to surrender to us."

 HEU_division_trenches: "Rebel Suppression - Trench Plan"
 HEU_division_trenches_desc: "Dig trenches indiscriminately near the northern forest areas where the rebels are known to be stationed to stop them from descending."

 HEU_division_peasant: "Rebel Suppression - Temporary Peasant Relocation"
 HEU_division_peasant_desc: "The Mutsuki government wants to win 'without fighting' as much as possible. Further blood must be minimized. To that end, it is very important to induce food shortages and drive the atmosphere toward surrender. Relocate all peasants (temporarily) from regions near the rebel stations to cut off their food supply channels and accelerate the food shortage."

 HEU_division_peasant_2: "Rebel Suppression - Peasant Relocation Subsidies"
 HEU_division_peasant_2_desc: "The Mutsuki government wants to win 'without fighting' as much as possible. Further blood must be minimized. To that end, it is very important to induce food shortages and drive the atmosphere toward surrender. Relocate all peasants (temporarily) from regions near the rebel stations to cut off their food supply channels and accelerate the food shortage.\n\nThis policy is not just 'forced relocation' but provides reasonable compensation to the peasants to prevent their anger toward the Mutsuki government."

 HEU_division_promotion: "Rebel Suppression - Distribute Surrender Propaganda"
 HEU_division_promotion_desc: "Let's load light aircraft with propaganda urging surrender and scatter them in massive quantities from the sky."

 HEU_division_something_kayoko: "§RKayoko is up to something...§!"
 HEU_division_something_kayoko_desc: "Onikata Kayoko knows she cannot win, but she won't just leave this situation alone."

 ## Luxembourg Decolonization
 benriya_decolonisation_decision_category: "New Territory Management led by [ROOT.GetNameDef]"
 benriya_decolonisation_decision_category_desc: "[benriya_decolonisation_decision_category_desc_text]"

 benriya_decolonisation_decision_category_desc_alpha: "The [ROOT.GetNameDef] government has acquired more territory than before through a war of liberation to spread liberal culture. However, due to the pacifist nature of [ROOT.GetLeader], managing these new territories is difficult.\n\nWe can provide them with merciful freedom and establish §YTrust Territories§! under the management of [ROOT.GetNamedef]. This will serve as an opportunity to prove that we did not come to antagonize the locals, but to protect them. A civil administration will be established in the new occupied areas through cooperation with the §YLeague of Nations§!, and under the merciful rule of [ROOT.GetLeader], they can slowly prepare for a democratic new government to be established decades later."
 benriya_decolonisation_decision_category_desc_beta: "The [ROOT.GetNameDef] government is expanding its territory wider than we can handle, and these are new territories not intended by [ROOT.GetLeader]. Local Luxembourgish opposition parties are concerned whether our expansionist steps are a sort of 'Conquest of Humanity by Kivotosians.' The Communist Party, which opposes the monarchy, and the Radical-Liberal Party, which wants to prevent 'excessive waste of national power,' are demanding that we liberate our occupied areas as §YLeague of Nations Trust Territories§! and grant them freedom.\n\nOf course, the final decision-maker on territorial expansion is [ROOT.GetLeader], and the fact that we gained these territories through war rather than a peaceful process is also a variable.\n\nLiberating occupied areas as trust territories through cooperation with the League of Nations can show our intention to coexist with humanity rather than being simple Kivotosian invaders, but it will certainly be a subject of controversy among the Kivotosian population."

 benriya_decolonisation_decision_LP1: "Establish [LP1.GetNameDef]"
 benriya_decolonisation_decision_LP1_desc: "France is very different from other regions. While many French people live there, it is also a region where 'Millennium-ization' has progressed since the translocation. We cannot take Paris from the French, and we cannot take the Millennium Campus from the Millenniumites. A federal trust territory government established under the mediation of the League of Nations will achieve peaceful harmony between Kivotosians and humanity. ...Probably."
 benriya_decolonisation_decision_LP2: "Establish [LP2.GetNameDef]"
 benriya_decolonisation_decision_LP4: "Establish [LP4.GetNameDef]"
 benriya_decolonisation_decision_LP5: "Establish [LP5.GetNameDef]"
 benriya_decolonisation_decision_LP6: "Establish [LP6.GetNameDef]"
 benriya_decolonisation_decision_LP7: "Establish [LP7.GetNameDef]"
 benriya_return_belgium: "Return of the Belgian Government"
 benriya_return_belgium_desc: "May the Luxembourg-Belgium friendship last forever! We have liberated Belgium from Kivotosian invaders and can return Belgium to its rightful owners. In exchange, they must abandon their existing alliances and unite with [ROOT.GetLeader]'s side."

 benriya_local_leader_decision_LP1: "Appoint Leader for [LP1.GetNameDef]"
 benriya_local_leader_decision_LP2: "Appoint Leader for [LP2.GetNameDef]"
 benriya_local_leader_decision_LP3: "Appoint Leader for [LP3.GetNameDef]"
 benriya_local_leader_decision_LP4: "Appoint Leader for [LP4.GetNameDef]"
