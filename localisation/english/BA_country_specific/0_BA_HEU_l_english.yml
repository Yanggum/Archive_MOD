 #Character Descriptions
 HEU_GATHERING_STORM_DESC:0 "The Grand Duchy of Luxembourg officially claims to be 'the only Germanic nation-state to survive the chaos of the Great Transfer.' In reality, it is under the political control of Handyman 68, who protected Luxembourg from the invasion of Gehenna students during the chaos. All surrounding nations have been seized by Transferees, and Gehenna, Millennium, and the General Student Council threaten Luxembourg's sovereignty.\n\nAru, now the Regent of Luxembourg, seeks to protect both the Kivotos students and the locals through cooperation. Will Aru's ideals crumble before reality, or will she overcome every obstacle as a true outlaw?"

 HEU_country_intro_header: "The Great Transfer and the Grand Duchy of Luxembourg"
 HEU_country_intro_content: "The §gGreat Transfer§! of 1935 annihilated nearly every nation in Central Europe. Gehenna, focused on its engagement with the §gWehrmacht§!, failed to plan an invasion of Luxembourg, while Millennium was occupied with the French Resistance. However, Luxembourg did not escape unscathed. In the lawless chaos following the Transfer, gangs of delinquent Gehenna students looted Luxembourg City. The volunteer militia, composed of ordinary citizens, fled in terror of Kivotos firepower, and the regular §C Gendarmerie§!, numbering only 200, was wiped out in urban combat.\n\nWith only a few hundred regulars and meager weaponry, Luxembourg was powerless against the extra-dimensional invaders. The House of Nassau, including Charlotte, was massacred in the chaos, and Prime Minister §YJoseph Bech§! fled the burning city alone, without even a secretary. That was until he stumbled upon §GRikuhachima Aru§! in an alley—she, too, was confused by her sudden arrival in Luxembourg City.\n\nRikuhachima Aru and her friends led the effort to wipe out the looting gangs. When non-rioting Kivotos transferees sided with Aru, the overnight war ended in Luxembourg's victory. Hailed as a national hero, Aru was appointed §GRegent of Luxembourg§! following the slaughter of the Grand Ducal family, a role she accepted in the heat of the moment.\n\nTwo months have passed. While Bech was initially grateful for Aru's help, as stability returns, he has begun to view Aru and §PHandyman 68§! as political rivals. Various political factions are pursuing their own agendas. Luxembourg remains a powder keg of conflict due to friction between the locals and the Gehenna-origin population that migrated after the Transfer. The effects of the Great Transfer are far from over.\n\n§YDeveloper: Sonetto§!\n§YAssistant Developer: jindoi§!\n§LFormer Developers: jindoi, .spear_§!"
 HEU_country_intro_header_1: "Parties and Factions"
 HEU_country_intro_content_1: "§CLuxembourg Right-Wing Party§!\nThe history of the Right-Wing Party began in the 1910s with the dawn of Luxembourgish democracy. Conservative and Catholic factions felt the need to organize into a political party as the formerly oligarchic system opened to the masses through universal suffrage. Initially proposed as the §CCatholic National Party§!, the more centrist name §CRight-Wing Party§! was chosen to garner broader support. It remains the largest party in Parliament, supported by farmers and Catholics, though it is split between the §GReformists§! and §YConservatives§!. The Conservatives are the dominant faction, centered around Prime Minister §YJoseph Bech§!.\n\nConservative hardliners argue for the nullification of the 1918 reforms that granted §gwomen's suffrage§! and §guniversal voting rights§!. They wish to halt industrial development and return the nation to its 19th-century roots as a pastoral dairy state. The Reformists, led by §GPierre Dupong§!, believe the party's path lies in accepting democracy while preserving the §gCatholic communal spirit§!.\n\nThe §YConservatives§! are skeptical about coexisting with the Kivotos population, who are predominantly female and do not share the Catholic faith. Hardliners like Speaker §YÉmile Reuter§! believe any 'radical' means may be used to collapse Aru's government and preserve Luxembourg's racial purity—though exactly what those means are remains strictly hidden.\n\n§RLuxembourg Communist Party§!\nThe §RStalinist§! opposition party, supported by the steelworkers and miners of the south, has faced harsh suppression by Right-Wing governments since its inception. The government has historically used parliamentary procedures to 'legally' expel elected Communist deputies. Despite this, the party maintains its base through the growing industrial workforce and remains the fiercest critic of the administration.\n\nSince the Transfer, the Communists have become the only institutional party to advocate for equal rights and labor protections for the Kivotos transferees. This was both an ideological choice rooted in 'proletarian equality' and a pragmatic political move, considering Gehenna-origin individuals now make up a significant portion of the population. The brilliant surgeon §YCharles Marx§! works tirelessly to spread Stalinist ideals in the post-Transfer chaos.\n\n§gGEDELIT§!\nGEDELIT is an acronym for the 'German Literature and Art Association.' As a National Socialist movement led by §YDamian Kratzenberg§!, GEDELIT preaches Pan-Germanism and argues that Luxembourg should be part of a Great German Empire. While they advocated for unification with Germany before the Transfer, the disappearance of the German government has shifted their goal toward establishing a §gnational socialist government§! locally."
 HEU_country_intro_header_2: "Influential Non-Party Forces"
 HEU_country_intro_content_2: "§PHandyman 68§!\nOnce so poor they couldn't pay office rent and slept in parks, Handyman 68 has now become the most important political faction in Luxembourg. Technically a business—and under Luxembourgish law, a mere 'civil organization'—their CEO, §YRikuhachima Aru§!, is a national hero who stopped the massacre of Gehenna students in Luxembourg City. Her friends Haruka, Mutsuki, and Kayoko also exert significant behind-the-scenes influence.\n\nTraumatized by the violence of the Transfer, Aru seeks to build her 'Hardboiled Outlaw' ideal by ensuring coexistence between locals and Kivotos students. Beyond its core members, Luxembourg's §YHalo Infantry Divisions§! are composed of Kivotos-origin personnel who support Aru's idealism, greatly expanding the scale of Handyman 68.\n\n§CLuxembourg Armed Forces§!\nBefore 1935, the military was the personal force of the §YHouse of Nassau§!. Royalist officers like Gendarmerie Commander §YÉmile Speller§! were fiercely loyal to Grand Duchess Charlotte. However, the military was vastly outmatched by other European powers, and the Transfer took a heavy toll. Despite desperate fighting in the capital, both the volunteer militia and the regular Gendarmerie suffered devastating losses. The failure to prevent the massacre of the Grand Duchess and her family dealt a crushing blow to morale.\n\nNevertheless, §YRegent Rikuhachima§!, who halted the massacre, has become a new rallying point. Regent Aru stood with the Gendarmerie from the initial palace search to the final suppression of the Gehenna rioters. Commander Speller remains a staunch supporter of Aru, even as many other conservatives view her with deep suspicion."
 
 HEU_guide: "Kivotos GSC President Rikuhachima Aru\n\n£white_dot Achieve a successful Liberal 68 Revolution.\n£white_dot Counter Trinity through an alliance with Gehenna.\n£white_dot Subjugate the Kivotos GSC and become its President.\n£white_dot ...And as President, protect Kivotos against humanity and the Chroma.\n\n\nAru's Hero, Ruler of Germany Asagi Mutsuki\n\n£white_dot Turn Rikuhachima Aru into a hero.\n£white_dot Subjugate Gehenna and Trinity to unify Germany.\n£white_dot §RDo not let Aru fall into despair.§!\n\n\nDemocratic Socialist Coalition, Ruler of Germany Handyman 68\n\n£white_dot Mediate the conflict between the Right-Wing and Communist parties.\n£white_dot Subjugate Gehenna and Trinity to unify Germany.\n£white_dot Become the §RResponsible Adult§!."

#Luxembourg Focuses

 HEU_road_to_regency:0 "The Road to Regency"
 HEU_road_to_regency_desc:0 "After the House of Nassau was slaughtered and the old government collapsed, Aru began her political journey as the Regent of the vacant throne. ...Not that she actually wanted the job. If Aru leaves, Luxembourg will surely descend into anarchy. Someone has to carry the burden, even if it's not the cold 'Outlaw' path Aru imagined."

#{{ Pro-Gehenna Political Path
 HEU_watch_right_wing_party:0 "Watching the Right-Wing Party"
 HEU_watch_right_wing_party_desc:0 "The Bech cabinet praises Aru to her face, claiming 'Luxembourg cannot exist without her.' Yet, the looks some Right-Wing politicians give her are filled with cold cynicism. Why? Without Aru's permission, Kayoko has decided to tail some senior politicians to find the cause."

 HEU_remove_right_wing_party:0 "Purge of the Right-Wing Party"
 HEU_remove_right_wing_party_desc:0 "CEO Aru believed in the good intentions of the Right-Wing Party. She truly thought they needed her. But if that wasn't the case—if they were merely using her—then retaliation will surely follow."

 HEU_remove_nazi_party:0 "Suppressing the National Socialist Movement"
 HEU_remove_nazi_party_desc:0 "Though weaker than traditional Catholic conservatism, the National Socialist movement is spreading like cancer among the intelligentsia. Now that we realize the locals' malice, a movement that despises Kivotos cannot be tolerated."

 HEU_rikuhachima_governemnt:0 "Declaration of Rikuhachimaism"
 HEU_rikuhachima_governemnt_desc:0 "The so-called 'locals' are full of mockery, sarcasm, and hostility toward Kivotos. Aru may be an outlaw, but she isn't on the side of evil. If the locals try to trample Kivotos, she won't care if they are from Gehenna, Trinity, or Millennium. Aru will protect them. By any means necessary."

 HEU_join_gehenna:0 "Luxembourg-Pandemonium Union"
 HEU_join_gehenna_desc:0 "Luxembourg's local politicians viewed Gehenna, which seized German territory, as a hypothetical enemy. However, Aru believes an alliance with Pandemonium is essential, given that most Kivotos immigrants in Luxembourg are Gehenna students. Unlike the Prefect Team, who were always trying to arrest Handyman 68, Pandemonium should at least be someone we can talk to."

 HEU_luxembourgian_primacy: "Luxembourg Primacy"
 HEU_luxembourgian_primacy_desc: "The combination of 'Luxembourg' and 'Primacy' might seem unrealistic, but the political landscape has changed completely. With Germany and France collapsed, have we not become the heart of Franco-German culture and the center of human civilization in Europe?"

 HEU_join_red_winter: "Revolutionary European Union Concept"
 HEU_join_red_winter_desc: "[GEM.GetName] could certainly be a great strategic ally, but they are too cooperative with the Wehrmacht, and an alliance with Pandemonium risks tarnishing the proud idealism of the 68 Revolution. A revolution must make no compromises; we need to find a 'Red' partner further afield."

 HEU_red_alert: "Red Alert"
 HEU_red_alert_desc: "Many human nations are wary of the 'Red' aspects of our 68 Revolution. Some even call it 'Extra-dimensional Bolshevism.' We do not deny these accusations. The more they hate us, the stronger we become."

 HEU_one_evil_one_day:0 "\"One Evil a Day\""
 HEU_one_evil_one_day_desc:0 "As news of the local government's collapse spread, various factions began approaching Luxembourg. Among them, a mafia organization called the Arancino Family suggested that if we shared some ownership of Luxembourg's mines, they could sell iron ore at lower prices, benefiting our primary steel industry."

 HEU_one_evil_one_day_2:0 "What Justice Means to Aru..."
 HEU_one_evil_one_day_2_desc:0 "After sharing interests with the Arancino Family, bad news is trickling in. They are abusing local workers with high-intensity labor to maximize profits. Yes, it's just exploitation of locals, not Kivotos students. CEO Aru doesn't need to get involved. ...But is the 'Rikuhachima Aru' who throws reports of suffering into the trash just because it doesn't benefit us really Aru?"

 HEU_one_evil_one_day_3:0 "...Because It's Not Cheap"
 HEU_one_evil_one_day_3_desc:0 "Since we refused to share interests with the Arancino Family, bad news is trickling in. Instead of 'legally' entering the mining industry, they are smuggling counterfeit Mystic Weaving Machines to the locals. As retaliation against Handyman 68, they are trafficking weapons to the local Catholic-Nazi underground. We must wipe these guys out before armed Nazis start a riot."

 HEU_one_evil_one_day_4:0 "\"As I thought, One Evil a Day was too much for me\""
 HEU_one_evil_one_day_4_desc:0 "Though Aru decided to fight for all Kivotos students, she knows not everyone in Kivotos is good. Handyman 68 is small, and fighting other Kivotos criminal organizations like the mafia alone is difficult. Aru will organize a new police force composed of like-minded Kivotos residents. They will eventually replace the local Luxembourgish police."

 HEU_one_evil_one_day_5:0 "Luxembourg Ministry of State Security"
 HEU_one_evil_one_day_5_desc:0 "This incident has shown us that we need thorough preparations to counter not just the mafia, but all external sabotage. The Ministry of State Security will be an excellent organization to counter the infiltration of other academies."

 HEU_no_more_evil:0 "Everyone's Shield"
 HEU_no_more_evil_desc:0 "Though she is drifting further from her original path as an outlaw, everyone except Haruka probably knew Aru could never be a true villain. Aru wants to make Luxembourg a sanctuary for all Kivotos students. To achieve that dream, we will declare a struggle for more freedom and against religious conservatism."

 HEU_don_arancino_remnants:0 "Prisoner Re-education"
 HEU_don_arancino_remnants_desc:0 "Not all of Don Arancino's men were loyal. What kind of loyalty exists among outlaws bound only by contracts? ...Hey, you guys are the exception, right? Mutsuki? Don't just laugh, please say something...\n...Anyway, the captured mafia prisoners will swear loyalty to their new leader, Aru, and instead participate in the Luxembourg revival project to atone for their sins. It's better for them to commute to a factory for a daily wage than to rot in prison, right?"

 HEU_war_on_crime:0 "Pre-emptive Strike on Crime"
 HEU_war_on_crime_desc:0 "The mafia incident taught Handyman 68 a lesson. Luxembourg's safety is always under threat, and for Aru's ideal of protecting students, we must move 'before' ugly organizations commit crimes. Aru remembers the local Nazi and Catholic organizations. She hasn't forgotten what they've done to Kivotos people. Local pro-Nazi groups will be destroyed, and nationalist sentiments must be suppressed."

 HEU_aru_fan_club:0 "Our CEO Aru"
 HEU_aru_fan_club_desc:0 "Since driving out the Arancino Family, Aru's popularity among Kivotos residents in Luxembourg has skyrocketed. It's unexpected to see an 'outlaw' like Aru being worshipped as a hero, but hey, why not? It feels good, doesn't it?"

 HEU_aru_fan_club_2:0 "Folk Hero Rikuhachima Aru"
 HEU_aru_fan_club_2_desc:0 "As student support for Aru grows, spontaneous support groups are increasing. Exaggerated rumors of how 'ruthlessly' Aru defeated the Arancino Family are spreading. Aru seems to like it, but also finds it a bit overwhelming."

 HEU_aru_fan_club_3:0 "Our Outlaw"
 HEU_aru_fan_club_3_desc:0 "For the sake of Kivotos students, Aru has taken on a heavy burden, and that effort is bearing fruit. Students from other academies who initially didn't recognize Aru are starting to support her, and her public reputation is soaring. The war with the Arancino Family left deep scars on Luxembourg, but through those scars, we have grown stronger."

 HEU_luxembourg_education_reform:0 "Second Education Reform"
 HEU_luxembourg_education_reform_desc:0 "Although the 1912 reform removed mandatory Catholic education and religious requirements for teachers, religious chapel sessions remain frequent due to teachers hired before the reform. The Second Education Reform focuses on strictly banning anti-Kivotos Catholic influence from the curriculum and implementing purely secular education."

 HEU_doubt_valkyrie_police_academy:0 "The Valkyrie Problem"
 HEU_doubt_valkyrie_police_academy_desc:0 "Valkyrie Police Academy claimed to maintain security throughout Kivotos before the Transfer. But what impact have they actually had on peace and order? Valkyrie should be dismantled; we need a more appropriate organization to protect Kivotos people."

 HEU_doubt_arona:0 "The GSC Problem"
 HEU_doubt_arona_desc:0 "Kivotos people are suffering from local racism and abuse. But what has the GSC done? Useless political bickering between an AI stuck in a monitor and the council, internal power struggles... How does this help a student getting lynched by local Nazis? If throwing those worthless scraps into the trash is the way of a true outlaw, Aru will do it."

 HEU_general_student_council_aru:0 "Challenging the GSC Authority"
 HEU_general_student_council_aru_desc:0 "The current GSC system is not only weak but twisted, incapable of protecting all students. Though she's an outlaw and prone to mistakes, Aru has a new vision to lead Kivotos into the future. For that vision, Rikuhachima Aru will claim the title of GSC President."

 HEU_trinity_defensive_aru:0 "The Waves of Trinity"
 HEU_trinity_defensive_aru_desc:0 "A rough tide named Trinity is approaching. To protect the ideals of Rikuhachimaism and all Kivotos people, we will stand against Trinity's imperialistic advances."

 HEU_prefect_team_defensive_aru:0 "Shield Against the Prefect Team"
 HEU_prefect_team_defensive_aru_desc:0 "The self-proclaimed 'Prefect Team'—essentially Gehenna's armed warlord group—has constantly interfered with CEO Aru's legitimate business. No more. We won't let them act this way any longer. We will fight to the last against the Prefect Team's invasion. There will be no more defeats!"

 HEU_ban_far_right_organizations:0 "Post-Nationalist Nazi Re-education"
 HEU_ban_far_right_organizations_desc:0 "We've learned enough about what 'nationalism' means to the locals. We can never unite with those who brandish swastikas and claim a Pan-Germanic union."

 HEU_war_industry:0 "War Economy Act"
 HEU_war_industry_desc:0 "Sometimes difficult choices are necessary for victory. Remember the days before the Transfer? Looking for the Black Market to borrow money, spending all of Aru's fortune to hire mercs for a mission... They were painful choices, but Handyman 68 wouldn't have survived without that decisiveness."

 HEU_betrayal_gehenna:0 "The Nazi-Gehenna Problem"
 HEU_betrayal_gehenna_desc:0 "We believed Pandemonium was acting purely for Kivotos—or at least Gehenna—students. But they too have begun collaborating with locals, even shaking hands with the most horrific group: the Nazis. Is there any further need to cooperate with Gehenna? What do Kivotos students gain from an alliance with Nazis?"

 HEU_GSC_president_rikuhachima:0 "GSC President Aru"
 HEU_GSC_president_rikuhachima_desc:0 "What does it mean to be an outlaw? To ensure Kivotos people are no longer discriminated against and can live new lives on Earth. If that is the outlaw path that defies the order of this world, Aru will walk it. The old GSC failed to protect students from discrimination. Now, the next GSC President, Aru, will stand atop the Sanctum Tower and show her chosen 'Hardboiled' style."

 HEU_GSC_president_rikuhachima_2:0 "GSC Education, Science, and Cultural Organization"
 HEU_GSC_president_rikuhachima_2_desc:0 "Aru is acting for the Kivotos population, who have become a minority in the post-Transfer world. Since they are few, there's a risk that parts of traditional Kivotos culture may be lost over generations. This organization will collect and preserve the culture and traditions of all major academies so they can be revived at any time in the future."

 HEU_GSC_president_rikuhachima_3:0 "Kivotos Pan-Nationalism"
 HEU_GSC_president_rikuhachima_3_desc:0 "Kivotos Pan-Nationalism, directed against human nations, is an indispensable ideology for the human rights of all students who crossed over during the Transfer."

 HEU_GSC_president_rikuhachima_4:0 "Chroma Countermeasures"
 HEU_GSC_president_rikuhachima_4_desc:0 "While humanity remains the most powerful enemy to face for our rights, the sudden appearance of the 'Chroma' after the Transfer cannot be ignored. It might be the hardest choice for an outlaw, but Aru will choose to subjugate the Chroma rather than surrender to it."

 HEU_GSC_president_rikuhachima_GSC_annex: "Seeking GSC Collaborators"
 HEU_GSC_president_rikuhachima_GSC_annex_desc: "While many GSC officials refused to recognize Rikuhachima Aru's succession via force and left, Shiranui Kaya is considering a more 'wise' method for her own self-preservation."

 HEU_GSC_president_rikuhachima_ending_after_1: "Berg Memorial Park Project"
 HEU_GSC_president_rikuhachima_ending_after_1_desc: "The 68 Revolution was a great step for Kivotos rights, but it was indifferent to the wounds Luxembourgers suffered from the Transfer. ...It might be too late now, but perhaps a memorial park is needed to atone to them."

 HEU_GSC_president_rikuhachima_ending_after_2: "Trauma Center"
 HEU_GSC_president_rikuhachima_ending_after_2_desc: "Following the meeting with Damian Kratzenberg, Aru learned that many Luxembourgers suffer from PTSD due to the massacres during the Transfer. Although the concept of PTSD doesn't exist in local medicine, a GSC medical team will be stationed in Luxembourg to provide psychological counseling and rehabilitation for victims."
 
 HEU_GSC_president_rikuhachima_ending_after_3: "...And to Kratzenberg"
 HEU_GSC_president_rikuhachima_ending_after_3_desc: "Now that it's been revealed the mysterious virtual streamer Ayaka Nanami was under Arona's protection, Aru knows where to go to find her."

 HEU_chroma_navy:0 "Our True Sanctuary"
 HEU_chroma_navy_desc:0 "To protect Kivotos from the Chroma's invasion, we must build an Ark-like warship capable of approaching it. Since CEO Aru lacks knowledge in this field, remaining GSC personnel will construct a detailed naval invasion plan to expel the Chroma."

 HEU_rikuhachimaism_focus_1:0 "Women's Luxembourg Flight Wing"
 HEU_rikuhachimaism_focus_1_desc:0 "Luxembourg had no air force before the Transfer, so there is little resistance to forming a flight wing composed of women. CEO Aru expects the military to serve as a starting point for dismantling Luxembourg's Catholic culture and applying gender equality." 

 HEU_rikuhachimaism_focus_2:0 "Crusade Against Human Civilization"
 HEU_rikuhachimaism_focus_2_desc:0 "Though the Transfer was unwanted, the fact remains that Kivotos are invaders of the land where locals once lived. While Luxembourg has united (however awkwardly) under the Grand Duchy, nations like France are sharpening their blades for revenge. As long as the Grand Duchy risks invasion by human nations, we must be prepared."

 HEU_rikuhachimaism_focus_3:0 "Regional Communes"
 HEU_rikuhachimaism_focus_3_desc:0 "Handyman 68 isn't used to—nor do they enjoy—authoritatively 'crushing' subordinate organizations like Pandemonium or the Prefect Team. While [ROOT.GetLeader] isn't an anarchist, she will grant broad autonomy to local Kivotos populations, helping them operate free communes. Gehenna students might find the commune system more familiar... though immigrants from other academies might be a bit confused."

 HEU_rikuhachimaism_focus_3_2:0 "Connecting Academy to Academy"
 HEU_rikuhachimaism_focus_3_2_desc:0 "Gehenna, Millennium, Red Winter, Trinity. Many academies harbor hostility toward each other due to historical and cultural differences. While that hostility can't be melted away instantly, everyone within Handyman 68's territory will be treated equally as fellow Kivotos people."

 HEU_rikuhachimaism_focus_4:0 "A Revolution I Can Dance To"
 HEU_rikuhachimaism_focus_4_desc:0 "The locals don't understand 'women in social life.' They scream that student outfits are 'scantily clad' and yell about 'Sodom and Gomorrah' at Kivotos students dating. Yes, Earth and Kivotos are quite different. Kivotos didn't have traditions of colonizing and exploiting people of different skin colors, or faiths worshipping a dead carpenter, or patriarchs slapping wives in the kitchen. But Kivotos ran just fine without those things! We don't need their culture."

 HEU_rikuhachimaism_focus_5:0 "Arming Rikuhachimaism"
 HEU_rikuhachimaism_focus_5_desc:0 "It's hard to say CEO Aru has Machiavellian charisma (even as a joke), but she shows excellent leadership when fighting to protect those who believe in her. If we must arm Luxembourg for the ideal of an equal union of all Kivotos people, we must try, no matter how close to impossible it seems."

 HEU_rikuhachimaism_focus_5_2:0 "Trust and Fraternity"
 HEU_rikuhachimaism_focus_5_2_desc:0 "\"Becoming a hero to protect all of Kivotos... it's moved so far from my original dream of being an outlaw, hasn't it? But still, I worked hard, right? So... can you stick with me a bit longer for my 'Hardboiled' dream?\""

 HEU_rikuhachimaism_focus_haruka:0 "Partner: Haruka"
 HEU_rikuhachimaism_focus_haruka_desc:0 "\"Haruka, I don't think Handyman 68 would be here today without your help. What do you think?\""

 HEU_rikuhachimaism_focus_mutsuki:0 "Partner: Mutsuki"
 HEU_rikuhachimaism_focus_mutsuki_desc:0 "\"Whether this action is hardboiled or that one is outlaw-like... I know those words aren't real anymore. But still, I was able to escape every crisis because you were there.\""

 HEU_rikuhachimaism_focus_kayoko:0 "Partner: Kayoko"
 HEU_rikuhachimaism_focus_kayoko_desc:0 "\"Actually, the word 'hardboiled' seems to suit you better than me. Thank you for being our team's strategist and its center, Kayoko.\""

 HEU_pro_gehenna_route_ending:0 "§CWelcome§! §PSchool§!"
 HEU_pro_gehenna_route_ending_desc:0 "\"I'm not strong enough to protect everyone I cherish, and I'm not a real hardboiled outlaw like Haruka expects. But in this small, modest land, I wanted to create a little paradise where both Kivotos and locals could live in peace. There's a saying that paradise can't be proven or observed, but since it's me—Rikuhachima Aru—I'll keep running toward unprovable dreams, falling down, and getting back up again.\""

# }} End of Pro-Gehenna path
# {{ Anti-Gehenna Political Path

 HEU_watch_gehenna:0 "Watching Gehenna"
 HEU_watch_gehenna_desc:0 "The Right-Wing Party and other indigenous forces want to emphasize that Luxembourg has become 'the only Germanic nation-state to survive on the European continent.' Luxembourg's territory only ever shrank for centuries. But couldn't the Transfer be a new opportunity? We could claim to be the 'Representative of the Germanic People' and assert sovereignty over German territory! ...Of course, this is also a move for Aru to gain popularity among locals to improve their perception of Kivotos."

 HEU_calm_down_students:0 "Calming the Students"
 HEU_calm_down_students_desc:0 "Conflicts between the predominantly Gehenna-origin students and the locals are intensifying. Aru will promise to harmonize the locals and Kivotos through compromise and persuasion, attempting to calm the students."

 HEU_calm_down_native:0 "Bridge to the Locals"
 HEU_calm_down_native_desc:0 "Catholic and Fascist political forces are hostile toward transferees. However, there is one faction that advocates for coexistence: the minor Luxembourg Communist Party. Handyman's understanding of Communism is vague at best—something Red Winter Academy really likes—but it's fine. What matters is joining forces with a local faction that can protect Kivotos students."

 HEU_negotiations_with_parties:0 "The CEO's Grand Debate!"
 HEU_negotiations_with_parties_desc:0 "Despite attacks from anti-Kivotos factions, CEO Aru hasn't abandoned her belief that humanity and Kivotos can coexist peacefully. The 'Civil Rights Act' is Aru's idea to guarantee the rights of Kivotos people within a legal framework. The problem is that the ruling Right-Wing Party doesn't really support its legalization. Luckily, Luxembourg is a democracy, and if she can persuade the public with a brilliant debate... the Right-Wing Party will have to yield to public demand."

 HEU_civil_rights_act_1:0 "Transferee Civil Rights Act"
 HEU_civil_rights_act_1_desc:0 "Following the success of the debate, the Civil Rights Act to protect transferees has passed. It is now illegal to refuse employment, food, or goods to a transferee just because they have a halo, or to use hate speech against them. While the penalties are symbolic, the important thing is establishing the recognition that 'discriminating against Kivotos is a crime.'"

 HEU_civil_rights_act_2:0 "Failure of the Civil Rights Act"
 HEU_civil_rights_act_2_desc:0 "Right. Honestly, did anyone actually expect our clumsy CEO to succeed in a nationally televised debate? The attempt to increase transferee rights ended in a spectacular failure, and the Right-Wing Party threw the bill in the trash. The attempt to legally protect Kivotos has been thwarted. ...So, what do we do now?"

 HEU_no_more_hope:0 "Expecting Nothing"
 HEU_no_more_hope_desc:0 "Aru has become a laughingstock. The Civil Rights Act was scrapped, and both Kivotos and locals are mocking Aru's pathetic leadership. Is there no hope? No, Mutsuki has 'Plan B.' It was ridiculous to try and claim equal rights within the limits of this country's laws and systems anyway. Why bother with persuasion when a single palace coup to paralyze Parliament lets Handyman make the laws however they want?"

 HEU_we_still_hope:0 "Grand Coalition"
 HEU_we_still_hope_desc:0 "The Civil Rights Act was enacted, but can it be enforced? The Right-Wing Party was negative toward it from the start. But this is where the God of Management, the Genius CEO, steps in. The Luxembourg Communist Party holds the platform that 'Kivotos and humanity are equal.' What if we include them in the ruling coalition to monitor the act's implementation? The Right-Wing Party will have no choice but to accept Aru's proposal if the 'Communist role is limited to monitoring Kivotos rights.'"

 ## Independent Handyman Internal Affairs (Fascism)

 HEU_neutralization_rietspartei:0 "Breaking with the Right-Wing Party"
 HEU_neutralization_rietspartei_desc:0 "[HEU_neutralization_rietspartei_desc_text]"

 HEU_neutralization_rietspartei_desc_text_fake: "It's a lie to say the Right-Wing Party did nothing for Kivotos rights. They did everything they could to sabotage them. Prime Minister Joseph Bech is somewhat trustworthy since he stayed neutral, but the conservative faction in the party, led by Speaker Émile Reuter, actively blocked Aru's 'institutional equality.' We will distance ourselves from all Right-Wing figures except Bech and minimize their influence."

 HEU_neutralization_rietspartei_desc_text_true:0 "The coup was a perfect success, and the Right-Wing Party is hilariously demanding the return of Rikuhachima Aru, the very person they wanted to kick out. Do you miss her now? How about a face full of machine-gun fire instead?"

 HEU_separation_of_education:0 "Education Segregation Today, Education Segregation Tomorrow"
 HEU_separation_of_education_desc:0 "The local Catholic schools that teach women to be submissive to men (and thus expect the female-dominated Kivotos to be submissive) must be closed. However, this will be a gradual process through segregation rather than immediate reform. New schools for Kivotos will be established, while existing Catholic-run schools will face discrimination in subsidies and student enrollment. Through discrimination and separation, Catholic schools will be forced to close on their own."

 HEU_separation_of_education_text_fake:0 "Education Segregation Today, Education Segregation Tomorrow"

 HEU_separation_of_education_text_true:0 "Luxembourg Mass School Closure Decree"

 HEU_separation_of_education_desc_text_fake: "The local Catholic schools that teach women to be submissive to men (and thus expect the female-dominated Kivotos to be submissive) must be closed. However, this will be a gradual process through segregation rather than immediate reform. New schools for Kivotos will be established, while existing Catholic-run schools will face discrimination in subsidies and student enrollment. Through discrimination and separation, Catholic schools will be forced to close on their own."

 HEU_separation_of_education_desc_text_true:0 "The local Catholic schools that teach women to be submissive to men (and thus expect the female-dominated Kivotos to be submissive) must be thoroughly crushed. If their schools teach such garbage... do they even need to be educated?"

 HEU_forgiving_them:0 "I Forgive Your Sins"
 HEU_forgiving_them_desc:0 "Aru is someone who simply cannot become truly hardboiled. No matter how much the locals hate her, she can't give up on the dream of a paradise for both locals and Kivotos. On the day gunfire rang out and she fell in the streets of Luxembourg, wasn't it a local doctor who reached out to help without hesitation?"

 HEU_forgiving_them_1:0 "Cooperation with the Reformists"
 HEU_forgiving_them_1_desc:0 "The Right-Wing Party must have realized by now that it's impossible for them to hold power in Luxembourg. While some politicians refuse to admit it, fortunately, factions exist within the party. The 'Conservatives' led by Émile Reuter are so extreme they deny the democratic system itself, but the 'Reformists,' a minority led by Pierre Dupong, are open to negotiation."

 HEU_forgiving_them_2:0 "Strengthening the Civil Rights Act"
 HEU_forgiving_them_2_desc:0 "The Civil Rights Act failed because it only protected Kivotos people. Let's compromise with reality. Though it may lack immediate practical effect while the elite is still mostly Luxembourgish, Aru has agreed with Reformist leader Pierre Dupong to strengthen the act. The revised act will also penalize 'Kivotos discrimination against locals.' This law will be formally promulgated through Parliament, without using the Regent's emergency powers."

 HEU_forgiving_them_3:0 "Sudden Stop Before the Line"
 HEU_forgiving_them_3_desc:0 "Aru exercised maximum patience, not entirely giving up on alliances with local collaborators even after the start of the 68 Revolution. This choice will slightly slow and hinder the 'Kivotos-ization of the locale.' However, there's a silver lining: some local farmers and nationalists, seeing Aru as a leader 'capable of compromise,' are dropping their hostility. One last bit of patience has benefited us all."

 HEU_go_to_the_bottom_of_gehenna:0 "Gehenna, Down to the Bottom of Hinnom"
 HEU_go_to_the_bottom_of_gehenna_desc:0 "By a striking coincidence, according to local indigenous faith, Gehenna is another name for Hell, derived from the Valley of Hinnom. If the locals want to oppress and burn Kivotos people, well... let's show them exactly where they are. This is the bottom of Gehenna and the Valley of Hinnom, and the Nazis and Catholics will melt in the depths of a burning hell."

 HEU_go_to_the_bottom_of_gehenna_1:0 "Faith Tax"
 HEU_go_to_the_bottom_of_gehenna_1_desc:0 "All locals who are not atheists must register their religion. If the registered religion is Catholicism, they will face a heavy special tax until they sign a 'conversion letter' to become an atheist. This tax will be redistributed to Kivotos students arriving for the 68 Revolution. Since Catholics register their identity with the church, it won't be hard to find 'fake atheists' trying to evade the tax."

 HEU_go_to_the_bottom_of_gehenna_2:0 "De-Nazification"
 HEU_go_to_the_bottom_of_gehenna_2_desc:0 "The use of the swastika in public, public support for the NSDAP (Nazi Party), and agreement with Adolf Hitler's racism are now explicitly banned across Luxembourg. While all racism is equally bad for Kivotos, Aru's experience showed that local Nazi remnants were particularly prone to calling Kivotos transferees 'Untermenschen' (sub-humans)."

 HEU_go_to_the_bottom_of_gehenna_3:0 "The New Order of Rikuhachimaism"
 HEU_go_to_the_bottom_of_gehenna_3_desc:0 "The destruction and recreation of local culture must be carried out more forcefully and radically. Medieval cultural sites in Luxembourg will be demolished. Relics will be melted down for raw materials. It's not because Aru is wicked or enjoys tormenting locals—it's because as long as the local culture lives, the chain of hatred against Kivotos cannot be broken. Recreation through destruction must be resolute."

 HEU_sad_aru_1:0 "One Evil a Day"
 HEU_sad_aru_1_desc:0 "The calligraphy of 'One Evil a Day' that once hung on the Handyman 68 office wall now hangs in Aru's lodgings. To protect the Kivotos people of Luxembourg, Aru intends to practice 'One Evil a Day' once more—even if it's a false villainy meant to draw fire. To ensure other students in the 68 Revolution aren't blamed, Aru will endorse all the demands of radical student groups, so the anger and hatred of conservatives are directed at her alone."

 HEU_sad_aru_2:0 "An Outlaw for Us"
 HEU_sad_aru_2_desc:0 "Aru's decision to bear the cross of the 68 Revolution has brought two changes: death threats arriving at the palace have increased tenfold, and Aru has gained the image of an exaggerated, charismatic revolutionary. The number of Kivotos people arriving to join the revolution has increased, including students interested in expanding the revolution through force."

 HEU_focus_on_french_language: "Focus on the French Language"
 HEU_focus_on_french_language_desc:0 "A common trait of Luxembourgish nationalist groups is the idea that 'We are Germans.' Groups like GEDELIT tried to establish Pan-Germanic nationalism by equating Luxembourgers with Germans. Emphasizing French is essential to weaken the political power of these nationalists."

 HEU_our_mutsuki_government: "Closure of the Luxembourg Parliament"
 HEU_our_mutsuki_government_desc: "Parliamentary democracy is no more. All power will be concentrated in the executive, and all deputies will be banned from political activity. We know this prevents us from 'cooperating' with the locals, but why would we need their cooperation?"

 HEU_divide_and_rule_1: "New Civil Rights Act"
 HEU_divide_and_rule_1_desc: "Now that Parliament is neutralized, the executive can unilaterally pass the Civil Rights Act that Parliament rejected."

 HEU_divide_and_rule_2: "Gehenna's Liberty, France's Liberty"
 HEU_divide_and_rule_2_desc: "Luxembourg is a borderland between Germany and France. Most citizens have German surnames and French names, showing how deeply the cultures are mixed. We bolster French culture not because we love France or its liberalism, but because it deepens the division within Luxembourg."

 HEU_divide_and_rule_3: "Divide and Rule"
 HEU_divide_and_rule_3_desc: "For Rikuhachima Aru, we successfully continued the propaganda that 'Luxembourg is the representative nation of the Germanic people,' while simultaneously emphasizing French culture to our own citizens to keep them divided. Our people are split between French and German factions, while abroad, many Germans support us. It's wonderful."

 HEU_doing_nothing_is_the_best_policy: "Mutsuki's Counter-Abyss Committee"
 HEU_doing_nothing_is_the_best_policy_desc: "Everyone knows Mutsuki's coup wasn't based on ideology or belief. Mutsuki herself knows it. She has no specific direction for leading the nation, and she likely won't establish a clear ideological path in the future."

 HEU_mutsuki_shogunate_1: "Asagi Shogunate"
 HEU_mutsuki_shogunate_1_desc: "The framework of Luxembourg remains, but the country now has a mess of a power structure: a dead Grand Duke, a puppet Regent, and a Shogun behind them. The Asagi Shogunate must decide the direction of national affairs and make this disaster of a country function as a state."

 HEU_mutsuki_shogunate_2: "Kivotos Bureaucratic Council"
 HEU_mutsuki_shogunate_2_desc: "Since Mutsuki herself lacks the talent to run a state, many bureaucrats will assist in government operations."

 HEU_mutsuki_shogunate_3: "Completion of the New Oligarchic Union"
 HEU_mutsuki_shogunate_3_desc: "As resistance fades and Luxembourgish politics stabilize, we can confidently say we have successfully seized Luxembourg and stabilized the oligarchic system."

 HEU_mutsuki_path_1: "For My Precious You"
 HEU_mutsuki_path_1_desc: "I didn't mean for things to turn out like this, but every situation pushed me here. If someone is to be blamed, I think it's the adults who pushed me into this, not me. Well, I guess I could be called an adult now, but what is an adult anyway? Aru-chan... Hey, Aru-chan, what does being an adult mean to you? How can I grow? I want to be someone who leads everyone, for everyone's sake. Please, let me be the place you can lean on. So please, look at me, Aru-chan."

 HEU_mutsuki_path_2: "Prepared to Bear Hatred"
 HEU_mutsuki_path_2_desc: "Really, I'll do anything..."

 HEU_question_of_succession_law_mutsuki_path: "The Leader of All"
 HEU_question_of_succession_law_mutsuki_path_desc: "As the reborn Germanic United Duchy seizes all German land, Asagi Mutsuki intends to end her dictatorship. All of this was to make Aru a hero. Aru-chan will recognize all her efforts and forgive her, right?"

 ### Independent Handyman Internal Affairs (Communist)

 HEU_no_more_french:0 "Regulation of the French Language"
 HEU_no_more_french_desc:0 "Luxembourg is German-speaking, but French has long been used and perceived as a 'sophisticated diplomatic language.' It's common to see French first names with German surnames, and while German is spoken daily, official documents were often in French. This bilingual system is inefficient. We must exclude French from official spaces and use only German to streamline administration."

 HEU_unwelcome_school:0 "Unwelcome School"
 HEU_unwelcome_school_desc:0 "Among Gehenna immigrants, sarcasm is spreading that Aru is being too friendly to the locals, or even that she's become their 'lapdog.' Is it wrong to try and gain the locals' trust first, then use that trust to improve Kivotos rights?"

 HEU_mercy_but_not_foget:0 "Forgive, but Never Forget"
 HEU_mercy_but_not_foget_desc:0 "The Grand Ducal family were the most famous victims of the Transfer in Luxembourg, but hundreds of gendarmes and civilians were also shot. There is a strong public outcry for harsh punishment of the students who participated in the riots. But it is unreasonable to harshly punish students who lived in a world where you don't die from being shot for murders they committed impulsively. Shouldn't we forgive them, but give them a chance to reflect and repent? Repentance will take the form of conscription."

 HEU_execution_for_all:0 "Requiem for All"
 HEU_execution_for_all_desc:0 "The Grand Ducal family were the most famous victims of the Transfer, but hundreds of gendarmes and civilians were also shot. Public opinion in Luxembourg, not just the Right-Wing Party, demands the execution of those caught rioting during the Transfer."

 HEU_national_security_agency:0 "National Security Agency"
 HEU_national_security_agency_desc:0 "Due to the terrible destruction during the Transfer, Luxembourg fears external invasion. The National Security Agency will be established as a government body to monitor the possibility of re-invasion by Kivotos forces around Luxembourg."

 HEU_preparation_for_confusion:0 "No Second Massacre"
 HEU_preparation_for_confusion_desc:0 "Could the chaos of the Transfer happen again? Local parties argue for a minimal civil defense organization to maintain order against potential Kivotos invasions. This new organization will maintain security, and both Kivotos and locals will be mandatory members to reduce ethnic conflict and foster a sense of belonging to the same community."

 HEU_catholicism_for_aru:0 "Reform Catholicism"
 HEU_catholicism_for_aru_desc:0 "The Luxembourg Communist Party wants to destroy Catholicism, but they admit that even the Soviet Union failed to separate Russians from the Orthodox Church. Instead, the Communists proposed a 'separation' reform between Luxembourgish and Roman Catholicism. The palace will hold the right to appoint bishops, creating a 'reformed' Catholic Church more friendly to women and Kivotos."

 HEU_nationalization_of_education:0 "Nationalization of Private Education"
 HEU_nationalization_of_education_desc:0 "To secularize Luxembourg's education, private institutions must first be nationalized. The Communist Party wants to bring in vetted German teachers to gradually 'replace' Catholic believers in private schools. New teachers with revolutionary ideas will teach harmony and coexistence between Kivotos and the locals."

 HEU_liberation_theology:0 "National Catholic Revolutionary Society"
 HEU_liberation_theology_desc:0 "This government-sponsored 'Revolutionary Society' is a state-controlled religious organization designed to reform the teachings of Catholic priests to suit Luxembourg's specific needs following the permanent split from Rome. All priests must register, and the inclusion of Gehenna transferees, Christian socialist thought, and women's labor liberation will be part of the mandated Catholic doctrine."

 HEU_sovereignty_act:0 "Sovereignty Act"
 HEU_sovereignty_act_desc:0 "Luxembourg is the land of the Germanic people, and Kivotos are merely a displaced minority. The Sovereignty Act will establish autonomous councils for Kivotos in each canton, granting them limited rights and ensuring they receive proper protection under the Civil Rights Act."

 HEU_for_you:0 "It was All for You"
 HEU_for_you_desc:0 "A world where Kivotos and locals coexist. It's not easy to expect people to understand that dream immediately. But Aru cooperates with local forces for one reason: she believes it is the most correct path to coexistence. She will strive to meet and persuade representatives of various academy immigrants."

 HEU_for_you_2:0 "Even if it Takes Time"
 HEU_for_you_2_desc:0 "Is it easy to understand the locals' culture and strive for coexistence? Probably not. Aru herself has faced many injustices in Luxembourg. But if we take our time and live together, we might be able to slowly reform Luxembourg."

 HEU_for_you_3:0 "A Party for Kivotos"
 HEU_for_you_3_desc:0 "Luxembourg is changing, little by little. Locals who once resented the Civil Rights Act are acknowledging that Kivotos students are just ordinary humans—albeit with halos. Let's take another step. We will continue reforms within the legal system and found a 'Kivotos Party' to expand our authority through parliamentary consultation."

 HEU_question_of_succession_law:0 "Amendment of the Succession Law"
 HEU_question_of_succession_law_desc:0 "Rikuhachima Aru's legal title is still 'Regent of the Grand Ducal House,' and the Right-Wing Party is constantly trying to 'import' foreign nobles to take her power. As the Right-Wing's conspiracy comes to light, Rikuhachima Aru needs to move beyond regency and formally ascend as the Grand Duchess."

 HEU_luxembourgism_focus_1:0 "Memorial Park"
 HEU_luxembourgism_focus_1_desc:0 "Backlash from both Kivotos and locals has followed the Grand Coalition. But Aru is desperately trying to unite the divided public. First, a memorial park for locals will be the coalition's first project. We will build a park at the former palace sold by the House of Nassau to honor those who died during the Transfer, sending a message of apology so the locals can forgive the Gehenna rioters."

 HEU_luxembourgism_focus_2:0 "Industry for All"
 HEU_luxembourgism_focus_2_desc:0 "Thanks to our efforts with the memorial park, inter-ethnic harmony is slowly occurring. Some Gehenna clubs have even succeeded in building joint Gehenna-human enterprises. Amidst the painful events, hope is slowly appearing."

 HEU_luxembourgism_focus_3:0 "New Year's Rhapsody No. 68"
 HEU_luxembourgism_focus_3_desc:0 "The unity of Handyman 68 began to crumble after Aru chose the path of the Grand Coalition. It cannot be said that Aru's choices made the employees of Handyman happy. If they were to leave Aru, she wouldn't be able to say a word. But if they stay, isn't there something she needs to tell them? We can't go back to Kivotos, but for the friends who will be here with us in this world."

 ### Independent Handyman Diplomacy (Shared)

 HEU_doubt_pandemonium_society:0 "Declaration of Pandemonium as an Illegal Government"
 HEU_doubt_pandemonium_society_desc:0 "[HEU_doubt_pandemonium_society_desc_text]"

 HEU_doubt_pandemonium_society_desc_text_fascism:0 "Aru has given up the expectation that 'locals will understand us if we meet their endless demands.' The reason she still tolerates the Right-Wing's nonsense about 'Luxembourg-led Pan-Germanism' is due to her personal feelings for Bech, the only remaining Right-Wing collaborator, and the need for Luxembourg to expand and become self-reliant for the '68 Revolution' system to survive."

 HEU_doubt_pandemonium_society_desc_text_generic:0 "Rikuhachima Aru has no interest in local nationalism, but meeting their demands helps establish 'friendly relations between locals and Kivotos.' Besides, she doesn't know how long we can survive in Luxembourg's narrow territory. Pandemonium is the most dangerous threat to Luxembourg's survival, and the first enemy that must be overthrown for the 'Pan-Germanism' the Luxembourg Right advocates."

 HEU_doubt_pandemonium_society_desc_text_mutsuki:0 "Why does propaganda like 'Luxembourg-led Pan-Germanism' work? The Mutsuki cabinet implemented thorough anti-German nationalist policies. What matters is that this doublethink is working domestically, and even German citizens abroad are starting to support Luxembourg. Good. We will stab Gehenna and begin a great roar from the West."

 HEU_ally_with_the_devil:0 "Temporary Alliance"
 HEU_ally_with_the_devil_desc:0 "We know very well that Trinity doesn't think highly of us. If Trinity topples Gehenna, we'll be the next enemy. But the key is 'after Gehenna.' If they attack Gehenna, we can strike Gehenna's rear with them. Trinity knows we are a potential enemy, but they will ally with us because we can 'split the forces of Pandemonium and the Prefect Team.'"

 HEU_representative_of_the_germanic:0 "The True Final Germanic Nation-State"
 HEU_representative_of_the_germanic_desc:0 "[HEU_representative_of_the_germanic_desc_text]"

 HEU_representative_of_the_germanic_desc_text_fascism:0 "The locals are cheering for Regent Rikuhachima Aru's declaration of the Grand Duchy as the 'true' final Germanic nation-state. Let them cheer. Cynically speaking, this declaration is just to 'use' locals as cannon fodder for Kivotos. That's why everyone in Handyman asks: 'Is this really what you wanted? Are you drowning in the ideal of protecting Kivotos?' Of course, what could Aru say?"

 HEU_representative_of_the_germanic_desc_text_generic:0 "The locals are cheering for Regent Rikuhachima Aru's declaration of the Grand Duchy as the 'true' final Germanic nation-state. To this, the Communist Party says cynically: 'Isn't this just using locals as cannon fodder for Kivotos?' They want Luxembourgish nationalists to take the bullets instead of Kivotos students. What can Aru answer? Is this her path as an 'outlaw'? Really?"

 HEU_representative_of_the_germanic_desc_text_mutsuki:0 "The locals are cheering for the new Mutsuki cabinet's declaration of the Grand Duchy as the 'true' final Germanic nation-state. Let them cheer. Cynically speaking, this is just to 'use' the locals for Kivotos. But it doesn't matter. This is all part of the grand narrative to make Rikuhachima Aru a hero."

 HEU_war_industry_alt:0 "War Economy Act"
 HEU_war_industry_alt_desc:0 "The Grand Duchy of Luxembourg stands alone. We need maximum armament to protect ourselves from surrounding threats, no matter how painful it may be..."

 HEU_alsace_lorraine:0 "The Alsace-Lorraine Question"
 HEU_alsace_lorraine_desc:0 "Alsace-Lorraine is a small region, but for the so-called Germanic people, it is considered 'rightful territory that must be recovered.'"

 HEU_attack_pandemonium_society:0 "Dismantling Pandemonium"
 HEU_attack_pandemonium_society_desc:0 "[HEU_attack_pandemonium_society_desc_text]"

 HEU_attack_pandemonium_society_desc_text_fascism:0 "The bold advance into western Germany, the heart of the great Germanic people, begins! Long live Regent Rikuhachima Aru, leader of the Germanic people! Hah, what a joke. What 'ideal' is there in this? Aru sits in a flashy Handyman 68 office, throwing people into the meat grinder for the '68 Revolution' and 'harmony between Kivotos and humanity.' It's all to protect Kivotos, right?"

 HEU_attack_pandemonium_society_desc_text_generic:0 "The bold advance into western Germany, the heart of the great Germanic people, begins! Long live Regent Rikuhachima Aru, leader of the Germanic people! Hah, what a joke. What 'ideal' is there? The Right-Wing Party cheers, and the Communists cynically use Aru to spread the revolution. Aru uses the locals as cannon fodder for 'harmony.' Truly wonderful. I'm so proud of myself."

 HEU_attack_pandemonium_society_desc_text_mutsuki:0 "The bold advance into western Germany, the heart of the great Germanic people, begins! Long live Regent Rikuhachima Aru, leader of the Germanic people! Ahaha. Well, the real Aru spits on this plan, hates it, and feels nauseated by the madness of this war. But it's fine! Aru will surely understand us when all of this is over. ...Right?"

 HEU_attack_prefect_team:0 "Ending the Feud with the Prefect Team"
 HEU_attack_prefect_team_desc:0 "The Prefect Team has tormented Handyman 68 since the past. Permanently destroying the militarized Prefect Team sounds like a pleasant story. But it doesn't feel right. Sometimes I think life was better when we were just being chased by them back in Kivotos."

 HEU_attack_trinity:0 "The Fall of the Angels"
 HEU_attack_trinity_desc:0 "War with Trinity is indispensable for the unification of Germany. A Luxembourg-led unification symbolizes that the paradise of harmony between Kivotos and locals will possess enough power to protect itself. ...Does Aru herself really think so?"
 
 HEU_germany_union:0 "Declaration of the Union Act"
 HEU_germany_union_desc:0 "[HEU_germany_union_desc_text]"

 HEU_germany_union_desc_text_despair:0 "§RNow, stop this shit...§!"

 HEU_germany_union_desc_text_fascism:0 "The Pan-Germanic Luxembourg Grand Duchy, a terrestrial paradise where Kivotos and locals are harmonized and the freedom of the 68 Revolution burns, has been established. The great Rikuhachima Aru declared the Union Act on the ruins of Eden, announcing that Luxembourg and Germany are eternally unified. All members of Handyman 68 stand around Aru, praising her great achievement. Long live Rikuhachima Aru! The success of the great hardboiled outlaw will remain in history forever!"

 HEU_germany_union_desc_text_generic:0 "The Pan-Germanic Luxembourg Grand Duchy, supported by all local parties including the Right-Wing and Communists, has been established as a terrestrial paradise for Kivotos and locals. The great Rikuhachima Aru declared the Union Act on the ruins of Eden, announcing that Luxembourg and Germany are eternally unified. All members of Handyman 68 stand around Aru, praising her great achievement. Long live Rikuhachima Aru! The success of the great hardboiled outlaw will remain in history forever!"

 HEU_germany_union_desc_text_mutsuki:0 "The Pan-Germanic Luxembourg Grand Duchy, built upon Germanic corpses as a paradise for Kivotos and locals, has been established. Asagi Mutsuki declared the Union Act on the ruins of Eden, and all Kivotos people praise our government's great achievement. Long live Rikuhachima Aru! And long live her protector, Asagi Mutsuki! Our success will remain in history forever!"

# }} End of Anti-Gehenna Path
# {{ Industry Path

 HEU_end_of_holding_act:0 "Repeal of the 1929 Holding Act"
 HEU_end_of_holding_act_desc:0 "The '1929 Holding Act' was a law that exempted multinational holding companies based in Luxembourg from all income taxes, designed to attract corporations for tax evasion. The problem is that following the Transfer, most neighboring nations have vanished. As the European capitalist economic bloc collapsed, Luxembourg lost its value as a tax haven, and the act now only brings loss without economic benefit."

 HEU_guillaume_kroll_focus:0 "Commercialization of Titanium"
 HEU_guillaume_kroll_focus_desc:0 "Guillaume Kroll claims to have invented a technology to mass-produce a new material called titanium. He needs an ambitious entrepreneur to invest, but no one in Luxembourg will sponsor him. ...Of course, a brilliant manager like Rikuhachima Aru will recognize his talent!"

 HEU_nationalisation_of_ARBED:0 "Nationalization of ARBED"
 HEU_nationalisation_of_ARBED_desc:0 "ARBED, Luxembourg's largest steel company, is a multinational enterprise maintained by French, Belgian, and Luxembourgish capital. With France and Belgium gone, ARBED is shaking from severe funding shortages and chaos. This company is too important to let fail, so we must nationalize it by buying up the former French and Belgian shares."

 HEU_CLR_reconstruction:0 "CLR Reconstruction"
 HEU_CLR_reconstruction_desc:0 "Unlike Kivotos, which had vibrant mass media like Kronos, Earth's broadcasting hasn't developed as much. But Luxembourg is different. CLR is the first private broadcaster established on the European continent. Though abandoned during the Transfer, reconstructing CLR would be a huge help in promoting Handyman 68's business."

 HEU_BLEU_left:0 "Implementation of the Gold Standard"
 HEU_BLEU_left_desc:0 "BLEU (Belgium–Luxembourg Economic Union) was a single currency union where the Belgian and Luxembourgish currencies were linked at equal value. Since the Belgian government collapsed, we can no longer use 'Belgian Francs' as Luxembourgish currency. Fortunately, we've been stockpiling gold since 1929 for emergencies, so we can implement the gold standard and create our own 'Luxembourg Mark.'"

 HEU_BLEU_right:0 "BLEU Negotiation Proposal"
 HEU_BLEU_right_desc:0 "BLEU (Belgium–Luxembourg Economic Union) was a single currency union where Belgian and Luxembourgish currencies were linked at equal value. Like the Euro? Not in this era. Wake up. Although the Belgian government collapsed, Valkyrie, which occupies the Belgian region, remains. It might be possible to reconstruct the BLEU economic alliance with Valkyrie."

 HEU_national_labour_council:0 "National Labor Council"
 HEU_national_labour_council_desc:0 "While Bech and local right-wing politicians strongly oppose it, Luxembourg's communists and socialist unions have long demanded the National Labor Council. This body mediates between capitalists and workers to discuss and determine corporate wages on equal footing. Aru, sympathetic to 'ordinary people' and witness to local labor conditions, has approved this bill previously rejected by the Right-Wing Party."

 HEU_ban_quadragesimo_anno:0 "Repudiation of Quadragesimo Anno"
 HEU_ban_quadragesimo_anno_desc:0 "'Quadragesimo Anno' refers to the 'correct' society decreed by the Pope in 1931, supported by the Catholic Right-Wing Party. According to the Pope, women should stay in traditional roles protecting the home. Local right-wingers won't like it, but women's entry into the workforce (including Aru herself) will develop the economy and help Kivotos and locals harmonize."

 HEU_dairy_farming:0 "Primary Industry Support Policy"
 HEU_dairy_farming_desc:0 "Before the Transfer, Luxembourg tried to industrialize, but 30% of the population is still engaged in agriculture and dairy. These people are the most fiercely hostile toward Kivotos immigrants, but Aru believes that with patience and support, she can win their hearts."

 HEU_trade_union_permission:0 "Allowing Trade Unions"
 HEU_trade_union_permission_desc:0 "Until now, trade unions were unofficial organizations with no legal protection. With Aru's permission, unions will now have legal standing and work with the National Labor Council to ensure the rights of local workers."

 HEU_laicism:0 "Catholic Separation of Church and State"
 HEU_laicism_desc:0 "The Catholic Church is the most vocal opponent of integration between Kivotos and the locals. As they hinder Aru's dream of harmony, they must be suppressed. While individual faith will be allowed, organizing groups or holding mass religious events in cathedrals will be strictly prohibited."

 HEU_steel_support:0 "Steel Industry Support"
 HEU_steel_support_desc:0 "After the Transfer, many foreigners who supported Luxembourg's steel industry left. To gain the locals' favor, proper financial support for the steel industry is needed now."

 HEU_nationalization_of_railways:0 "Railway Nationalization"
 HEU_nationalization_of_railways_desc:0 "The railway nationalization project, supported by left-wing parties, will not only make public transport cheaper for locals but also help if Handyman 68 ever decides to pursue 'expansive' policies."

 HEU_iron_ore_mining:0 "Minette Promotion Policy"
 HEU_iron_ore_mining_desc:0 "Even if the power of Mystery is weaker on Earth, Kivotos students are still stronger than humans. Arranging Kivotos employment in the 'Minette' mines of southern Luxembourg can reduce discrimination and benefit the regional economy."

 HEU_german_school:0 "Germanic Culture School"
 HEU_german_school_desc:0 "Luxembourgers take pride in being the 'final Germanic nation-state' to survive the Transfer and worry their traditions will be damaged by Kivotos. While Aru knows nothing and cares little for 'Germanic people,' she knows that Transferees trying to understand local culture will bring harmony."

 HEU_RTL_kayoko_2:0 "RTL Cultural Exchange"
 HEU_RTL_kayoko_2_desc:0 "RTL is a radio station broadcasting in German, English, and French. Let's push for radio programs where Kivotos and locals share and understand each other's cultures. Oh, and include a time slot for the rock music Kayoko likes."

 HEU_basic_housing:0 "Basic Housing"
 HEU_basic_housing_desc:0 "The previous Right-Wing government planned affordable housing, but Aru's plan goes further. By providing new housing via lottery to ensure Kivotos and local residences aren't segregated, the two cultures will naturally mix in daily life."

 HEU_gehenna_german_culture:0 "Kivotos-Germanic Mixed Culture"
 HEU_gehenna_german_culture_desc:0 "Despite huge cultural differences, we achieved cultural fusion by finding commonalities. Although incomplete, time will prove Aru's choice was right."
 
 HEU_fix_benelux_lands:0 "Lowland Ground Restoration"
 HEU_fix_benelux_lands_desc:0 "The heavy facilities of the D.U. have caused the lowlands to soften and sink! The incompetent GSC dumped this task on us, and though it's a bit late, we're in charge now. Let's fix it quickly!"

 HEU_gehenna_labour_council:0 "Gehenna Service Council"
 HEU_gehenna_labour_council_desc:0 "Aru has watched the locals' gazes full of contempt and mockery for Gehenna students. Pro-Nazis brandishing swastikas telling her to 'get out,' Catholics saying women shouldn't be in politics... If labor rights are left to these locals, will they care for the minority Kivotos population? Aru has decided that labor issues will be handled by a 'Service Council' composed only of Gehenna students."

 HEU_gehenna_people:0 "Kivotos Migration Policy"
 HEU_gehenna_people_desc:0 "Maybe locals discriminate against Kivotos because their numbers are low. Let's actively support the migration of various Kivotos students, not just from Gehenna. Since Aru has a low sense of belonging to Gehenna, she'll be better at embracing students from other academies."

 HEU_gehenna_tourism:0 "Luxembourg Tourism City"
 HEU_gehenna_tourism_desc:0 "While other local nations suffered heavy cultural damage from the Transfer, Luxembourg escaped with only 'minor' damage to a few buildings, leaving local culture intact. How about developing tourism for other academy students?"

 HEU_repression_for_local_capitalists:0 "Suppression of Local Capitalists"
 HEU_repression_for_local_capitalists_desc:0 "Local capitalists harbor hostility toward the Kivotos transferees. Rather than leaving everything to the market, it's better for Handyman 68 and the Kivotos population to control the corporations."

 HEU_land_reform:0 "Land Reform"
 HEU_land_reform_desc:0 "Farmers are the most hostile toward Kivotos. While Aru is too kind to hurt locals, she realizes that for Kivotos to survive in this land, a policy of purchasing and redistributing part of the farmers' land to Kivotos is a necessary evil."

 HEU_association_of_school_institutes:0 "Kivotos Academy Association"
 HEU_association_of_school_institutes_desc:0 "With immigrants from various schools, students are living together in a mix. Aru proposed a sort of 'Academy Association' for them—an unofficial school where students from Gehenna, Millennium, Red Winter, and even Trinity won't be discriminated against."

 HEU_gehenna_labour_council_2:0 "Service Council-Workers Council"
 HEU_gehenna_labour_council_2_desc:0 "We must not give the initiative on labor rights to the locals. Aru and the Kivotos population all agree on this. However, under the premise that we hold the lead, it's possible to allow the Luxembourg Communist Party a limited voice."

 HEU_RTL_kayoko:0 "RTL Kivotos Rock"
 HEU_RTL_kayoko_desc:0 "Must Kivotos students 'adapt' to local culture? Shouldn't the locals embrace Kivotos culture instead? RTL broadcasts in German, English, and French. Kayoko proposed converting RTL to Handyman ownership and broadcasting Kivotos rock music from Germany to the British Isles."

 HEU_school_of_culture:0 "Service Council Cultural Education Center"
 HEU_school_of_culture_desc:0 "Local workers employed alongside Kivotos people need to become familiar with Kivotos and other Earth cultures. All local workers must take mandatory lectures where women play central roles in society. They cannot be hired at any workplace without a deep understanding of Kivotos culture."

 HEU_gehenna_labour_council_3:0 "Mystic Weaving Project"
 HEU_gehenna_labour_council_3_desc:0 "Problem Solver 68 may be hardboiled outlaws, but they aren't cold-blooded enough to ignore fellow deportees on the Kivotos continent. The Kivotos immigrants have lost much of their Mystic power, and more Mystic Looms are needed to ensure they aren't discriminated against by the locals. Aru acts cold, but she isn't the kind of leader who can abandon people in need."

 HEU_school_of_atheism:0 "Catholicism Must Die"
 HEU_school_of_atheism_desc:0 "Destroying Catholic cathedrals is not enough. Catholic faith and its doctrine fundamentally demand that women (who carry the original sin of corrupting Adam) must be submissive to men. This implies that the female-oriented Kivotos society must submit to the male-oriented local Europeans. No. Aru will not allow that. All Catholics will receive lectures at special schools to be normalized into atheism. As it should be."

 HEU_civil_partnership:0 "Civil Partnership"
 HEU_civil_partnership_desc:0 "Kivotosians are fewer in number than the locals, and some students worry that as marriages occur over generations, Kivotos culture will be overshadowed by local culture and vanish. We must separate Kivotosians from the locals. The new 'Civil Partnership' system will allow even female Kivotos students to receive the same legal benefits as heterosexual couples if they are cohabiting."

 HEU_UNESCO: "IICI"
 HEU_UNESCO_desc: "The suppression of local culture and the support for Kivotos culture have caused [ROOT.GetNameDef]'s government to face immense backlash from the locals. [ROOT.GetLeader] aims to expand the International Institute of Intellectual Cooperation (IICI) to harmonize Kivotos and Luxembourgish cultures. This is intended for League of Nations member states to exchange and preserve Kivotos-Human culture and technology."
 
 HEU_schuster_line:0 "Construction of the Schuster Line"
 HEU_schuster_line_desc:0 "Luxembourg has already suffered an invasion from Gehenna during the Great Transition, and a consensus has formed that basic preparations must be made to defend Luxembourg. Joseph Schuster, a Luxembourgish engineer, proposed a 'mini-Maginot' plan named after himself, the 'Schuster Line.' This project involves building small forts mixing concrete and wood to defend Luxembourg. While not as sturdy as the Maginot Line, it will at least buy time to prepare defenses in the event of war."

 HEU_prussian_strategy:0 "Prussian Grand Strategy"
 HEU_prussian_strategy_desc:0 "Since the Great Transition, Luxembourg has lost all its neighboring allies, including Belgium. While Aru is skilled in guerrilla warfare with small numbers, she has never led a large army. Fortunately, the German Imperial Family, who fled here during the Great Transition, can assist in reforming the Luxembourgish military system."

 HEU_prussian_strategy_2:0 "Re-establishment of the Volunteer Corps"
 HEU_prussian_strategy_2_desc:0 "The Luxembourg Volunteer Corps was a local paramilitary group that existed before the Great Transition. Since they weren't properly trained elites, they all fled when the invasion occurred during the Transition, but that mistake will not be repeated."

 HEU_prussian_strategy_3:0 "Systematization of Operational Plans"
 HEU_prussian_strategy_3_desc:0 "The German-descended staff believe that systematic military operations following well-structured plans are the shortcut to victory. Though Luxembourgish officers are snidely asking, 'Did that work out so well back in 1914?'"

 HEU_prussian_strategy_4:0 "Motorized Infantry Strategy"
 HEU_prussian_strategy_4_desc:0 "The staff lecture on the importance of motorizing soldiers and executing faster maneuver warfare. Local Luxembourgish officers argue, 'We don't have the fuel for that,' but the German staff are optimistic that total motorization is possible through fuel imports."

 HEU_prussian_strategy_5:0 "Stormtroopers"
 HEU_prussian_strategy_5_desc:0 "Known in German as Sturmtruppen, the Prussian stormtroopers of WWI were powerful infantry units that used high speed to strike enemy forces."

 HEU_benriya_strategy:0 "Lessons from the Prefect Team"
 HEU_benriya_strategy_desc:0 "CEO Rikuhachima Aru hasn't commanded large numbers like Hina has, but she has caught glimpses of their strategy while fighting against them. Their strategy of neutralizing enemies through overwhelming firepower centered around Hina is worth applying even in this world where Mystics have weakened. ...Of course, this doesn't mean I'm acknowledging the Prefect Team! I'm just learning a little bit, that's all!"

 HEU_benriya_strategy_2:0 "1 Haruka per Regiment Formula!"
 HEU_benriya_strategy_2_desc:0 "This doesn't mean we're actually distributing one real Haruka to every regiment! Even the god of management, CEO Aru, can't grow Harukas like plants in a garden. (I've never tried... but, well, obviously it wouldn't work!) CEO Aru expects the artillery to provide firepower support like Haruka, who was the heavy-hitter of the office."

 HEU_benriya_strategy_3:0 "Noir-style Hanetsuki Attack"
 HEU_benriya_strategy_3_desc:0 "Problem Solver's combat style of persistently moving through multiple locations with small forces can be applied to special forces operations in this era. After all, Problem Solver 68 was basically a small-scale special forces unit, wasn't it?"

 HEU_benriya_strategy_4:0 "CEO's Perfect Mercenary Tactics"
 HEU_benriya_strategy_4_desc:0 "Warfare using mercenaries seems to have only lasted until Renaissance Italy in this world, but CEO Aru believes hiring mercenaries isn't necessarily a bad thing. We don't have much manpower to begin with, and as long as they're getting paid, they work quite faithfully. ...Hey, wait! You guys! You can't just clock out because your shift ended in the middle of a battle!"

 HEU_benriya_strategy_5:0 "Serenade of Scorching Heat"
 HEU_benriya_strategy_5_desc:0 "The importance of fire support on the battlefield has grown due to depleted Mystics. The era where getting hit by an 88mm anti-aircraft shell just meant a short rest in the health office is over. Aru understands the importance of strong firepower and seeks Mutsuki's advice on how many support troops are needed to replace lost Mystics with local weapons."

 HEU_defence_industry:0 "Luxembourg Defense Industry"
 HEU_defence_industry_desc:0 "Luxembourg's greatest advantage is the abundance of iron ore buried within its territory. From firearms to the weapons meant to protect ourselves, we will be able to achieve self-sufficiency using our own resources."

 HEU_benriya_saori:0 "Traces of Arius"
 HEU_benriya_saori_desc:0 "Since the collapse of the Arius Branch School, Saori Joumae has been wandering various parts of Europe. She seems to have a positive impression of Problem Solver 68 and likely won't refuse our recruitment offer."

 HEU_benriya_bicycle:0 "Poor Man's Maneuver Warfare"
 HEU_benriya_bicycle_desc:0 "Shocking news: Riding Aru Alt Released! ...is a lie, but operating bicycle units in the military is a big help. They are cheap and can easily increase our army's mobility. Furthermore, it's a familiar concept in Luxembourg as they were widely used in the neighboring Netherlands."

 HEU_benriya_tanks:0 "French Tank Technology"
 HEU_benriya_tanks_desc:0 "Luxembourg didn't have a single tank before or after the Great Transition, but Luxembourgish soldiers were able to recover and study semi-destroyed French tanks abandoned near the border during the Transition battles. Remembering that tanks weren't particularly impressive weapons in Kivotos, Aru questions the need for tank research, but in this world where Mystics are depleted, tanks could certainly be a huge help! ...Well, whether we actually have the capacity to build them is another story!"

 HEU_emergency_industry:0 "Emergency Industry"
 HEU_emergency_industry_desc:0 "Problem Solver 68 and Luxembourg are going through a very difficult period surrounded by hostile nations. A larger portion of the national budget must be used to prepare for wartime conditions."

 HEU_hardboiled_warfare:0 "Hardboiled Mentalism!"
 HEU_hardboiled_warfare_desc:0 "CEO Aru is inexperienced in crafting grand strategies, but she shows excellent skill when commanding small-scale skirmishes. The 'Hardboiled Mentalism' tactical manual she wrote for the new soldiers is completely nonsensical in its grand strategy sections, and Mutsuki's illustrations are borderline ridiculous, but it's evaluated as being a great help in squad-level engagements on the battlefield."

 HEU_hardboiled_way:0 "Way of the Outlaw"
 HEU_hardboiled_way_desc:0 "The way of the outlaw looks cool, but in reality, it's not cool at all. Running out of money from office maintenance and sleeping in the park... Even after gaining control of Luxembourg and escaping financial ruin, Aru knows that the most important things for an outlaw are a single meal and a comfortable place to sleep. Letting new subordinates suffer the same pain she and the members of Problem Solver 68 went through would be a failure as a CEO."

 HEU_hardboiled_charisma:0 "CEO's Dignity"
 HEU_hardboiled_charisma_desc:0 "What is the reason the soldiers of Luxembourg and Problem Solver 68 don't flee the battlefield? Those who arrived via the Great Transition have no 'patriotism' for Luxembourg. Nor is there a barrier corps to shoot those who run (Aru would never permit that!). Our army stays together because of personal support for 'Rikuhachima Aru,' and further, a shared ideal that she wants to protect."

 HEU_benriya_rikuhachimaism:0 "Hardboiled Shot"
 HEU_benriya_rikuhachimaism_desc:0 "Rikuhachima Aru's idealistic reforms—creating a united nation for all Kivotosians and achieving an equal society—give strength, especially to soldiers with halos."

 HEU_benriya_luxembourgism:0 "Heart for All"
 HEU_benriya_luxembourgism_desc:0 "Just as CEO Aru reached out to the bullied Haruka, Aru wishes to reach out to both Kivotosians and humanity suffering in this world. It's an idealistic path with a very low chance of success, but that is precisely why Aru's army supports her."

 HEU_long_range_patrols:0 "Luxembourg Long Range Patrols"
 HEU_long_range_patrols_desc:0 "Is there anything more important than conducting constant patrols to prepare for enemy surprise attacks?"

 HEU_navy_focus_1:0 "Luxembourg Navy"
 HEU_navy_focus_1_desc:0 "As we acquire coastal regions, we can implement plans to raise a navy."

 HEU_navy_focus_2:0 "Wilhelm Plan"
 HEU_navy_focus_2_desc:0 "The last Kaiser of the German Empire, Wilhelm II, Wilhelm von Preussen, enjoyed designing various types of warships himself, and after his retirement and exile to Luxembourg, he left behind many (fantastical) battleship construction blueprints. His paper documents will now be sent to our fledgling navy for review."

 HEU_navy_focus_3:0 "Valkyrie Coast Guard Plan"
 HEU_navy_focus_3_desc:0 "Let's invite former engineers from the Valkyrie Police Academy's Coast Guard division to gain information on how they designed maritime patrol fleets for the academy. Even if we can't build a great and massive fleet, we can at least build ships for a brown-water navy."

 HEU_navy_focus_4:0 "Inviting Former Coast Guard Instructors"
 HEU_navy_focus_4_desc:0 "There is no chance of finding talent skilled in naval warfare within Luxembourg. Inviting talented individuals from among the retired Valkyrie Police Academy Coast Guard members will be the only viable alternative."

 HEU_air_force_focus_1:0 "Luxembourg Army Air Corps"
 HEU_air_force_focus_1_desc:0 "A glaring disadvantage is that CEO Rikuhachima Aru has no knowledge of aviation, and Luxembourg had no air force until the 'Great Transition.' However, we've learned that some Belgian pilots with light aircraft experience fled to Luxembourg during the Transition chaos. We will check if these Belgian pilots are willing to serve in the Luxembourgish military and begin by founding a small Army Air Corps."

 HEU_air_defense:0 "Luxembourg Anti-Air Battery"
 HEU_air_defense_desc:0 "Joseph Schuster, the chief engineer in charge of building Luxembourg's national defense line, proposed adding some anti-air facilities to his 'Schuster Line.' It won't be able to counter large-scale aerial bombings, but it should be enough to stop small-scale attacks at low altitudes."

 HEU_air_force_focus_2:0 "Luxembourg-Belgium Aviation Academy"
 HEU_air_force_focus_2_desc:0 "The small group of pilots consisting of Belgian exiles will focus on elite pilot training so that every individual can become an ace."

 HEU_air_force_focus_3:0 "Gehenna Aviation Academy"
 HEU_air_force_focus_3_desc:0 "Through an alliance with Gehenna, we can receive support from Gehenna club students who have experience piloting light aircraft and airships."

 HEU_establish_aircraft_industry:0 "Aviation Industrial Facilities"
 HEU_establish_aircraft_industry_desc:0 "Construction of new industrial facilities is necessary to raise an air force. Fortunately, Luxembourg has plenty of steel, so we are ready to build the steel skeletons of fighters. Though, steel alone isn't enough to make a plane fly!"

 HEU_air_force_focus_4:0 "Aria of Explosions"
 HEU_air_force_focus_4_desc:0 "All the employees of Problem Solver 68 are equally ignorant of the air force, but after learning about aviation concepts, Mutsuki Asagi is showing particular interest in the concept of 'bombers.' Does she just like the act of dropping lots of explosives from the sky? It's hard to tell."

 HEU_air_force_focus_5:0 "Little Devil's Chorus"
 HEU_air_force_focus_5_desc:0 "The reason Mutsuki is so interested in the air force might be because she felt a 'similarity' between her combat style and that of the air force. Whatever the reason, Mutsuki is the only one in Problem Solver 68 supporting air power expansion, and the Luxembourg Army Air Corps owes her a debt, large or small. It's time to repay that debt through new technological developments."

 HEU_air_force_focus_6:0 "A More Fun Way to Play"
 HEU_air_force_focus_6_desc:0 "It's true that 'rocket science' doesn't exist in Luxembourg, but in this world where 'Mystic' is depleted, Problem Solver 68 hopes to once again unleash the powerful firepower they showed in Kivotos. Mutsuki specifically requests engineers for a new weapon that flies far and explodes flashily, but does the technology to satisfy her really exist?"

 HEU_city_warfare:0 "Rikuhachima Field Hospital"
 HEU_city_warfare_desc:0 "The 'Grand Duchess Charlotte Maternity Hospital' building, which the Luxembourg government was constructing for a 1936 opening, was completely destroyed by Gehenna students' anti-tank fire during the Transition, but the staff meant to work there had already been recruited. Why don't we propose reassining these nurses to work at the Luxembourg Field Hospital?"

 HEU_luxembourg_benriya_68:0 "Problem Solver 68 Resumes Activity!"
 HEU_luxembourg_benriya_68_desc:0 "During the Luxembourg catastrophe on the day of the Transition, the Problem Solver 68 office was severely destroyed. However, business has resumed after relocating the office to a new location. The difference now is that the Grand Ducal Palace of Luxembourg is our new office. It's time to promote to everyone that Problem Solver 68 is now managing both the state and the 'business'."

 HEU_benriya_construction:0 "Problem Solver Construction Dept."
 HEU_benriya_construction_desc:0 "Some of the Gehenna students who agreed to cooperate with Problem Solver 68 have promised to put their efforts into the construction and architecture sectors. Whether the request comes from Luxembourg or other schools/nations, they will see the commission through to the end."

 HEU_benriya_local:0 "Civilian Support for Locals"
 HEU_benriya_local_desc:0 "To increase support and loyalty from the locals toward Rikuhachima Aru, Gehenna students cooperating with Problem Solver have stepped out for civilian support, such as repairing roads in Luxembourg City and rebuilding structures destroyed during the Transition. Considering Gehenna students usually prefer 'blowing things up' over 'fixing things,' this can be called a 'miracle' made possible by CEO Aru's outstanding character."

 HEU_benriya_warfare:0 "Problem Solver Defense Dept."
 HEU_benriya_warfare_desc:0 "The Problem Solver Defense Dept. was founded for the sake of Rikuhachima Aru's ideal of promising equality for both Kivotosians and locals. The Defense Dept. will be integrated into the Luxembourg regular army and fight to protect Aru's dream."

 HEU_benriya_level_up_a:0 "Problem Solver Archive Expansion"
 HEU_benriya_level_up_a_desc:0 "Using many books collected from across Europe, we will expand the archives in the Grand Ducal Palace, currently used as the Problem Solver office. In the archive, Rikuhachima Aru can deepen her own wisdom, and through meditation, research ways to show a kinder side to her comrades."

 HEU_benriya_level_up_b:0 "Problem Solver Training Room Expansion"
 HEU_benriya_level_up_b_desc:0 "The plan to excavate the basement of the Grand Ducal Palace to build a shooting range and sword training room will infuriate the traditionalists of Luxembourg, but aren't they already angry every day just because a red-haired woman with horns is in Luxembourg? The underground training room will be a great place to increase Rikuhachima Aru's resolve and charisma through marksmanship and swordsmanship."

 HEU_benriya_level_up_last:0 "Problem Solver Open to All"
 HEU_benriya_level_up_last_desc:0 "Rikuhachima Aru is not a lofty leader distanced from the public like those of the Tea Party or Pandemonium Society. For Kivotos students or ordinary students who want to meet Aru and share their opinions, we will offer time every Monday for citizens to enter the palace and have an audience with her. Listening to people's stories is also a type of 'commission', isn't it?"

 HEU_benriya_international:0 "Problem Solver International Dept."
 HEU_benriya_international_desc:0 "Some Problem Solver employees wish to start business in nearby neighboring countries as well."

 HEU_benriya_inner_circle:0 "Problem Solver Forever"
 HEU_benriya_inner_circle_desc:0 "The Grand Ducal Palace has many empty rooms as the number of residents has decreased. Wouldn't it be a good idea to make private rooms for Mutsuki, Kayoko, and Haruka?"

 HEU_unified_gehenna:0 "Rikuhachima Above Gehenna"
 HEU_unified_gehenna_desc:0 "Actually, Aru doesn't know Gehenna very well. Students here go truant without ever using an absence slip? What even is the Pandemonium Society? Student Council elections? Was there such a thing? There were this many school clubs? They treated Problem Solver like a criminal organization while letting those 'Hot Spring Terrorists' roam Gehenna as a club. But we can't stay in chaos forever. It's time to straighten out Gehenna."

 HEU_the_end_of_perfect_team:0 "Control of Prefect Team Executives"
 HEU_the_end_of_perfect_team_desc:0 "The Prefect Team that tried to arrest Rikuhachima Aru and her crew is finished. Some Prefect members are sensing their unfortunate fate and trying to flee, but it's useless. The central executives have already decided to stay in the new Gehenna and follow the control of the new school government."

 HEU_luxembourg_military_police:0 "Integration into Luxembourg Police"
 HEU_luxembourg_military_police_desc:0 "Does Gehenna even need an armed paramilitary organization in the first place? The Prefect Team will be completely disbanded, and the Luxembourgish police will take over the role. All Prefect members will have to look for new jobs. This is the price for chasing Problem Solver 68 like criminals."

 HEU_gehenna_military_police:0 "Gehenna Justice Task Force"
 HEU_gehenna_military_police_desc:0 "Disbanding the Prefect Team that hindered Problem Solver is natural. But then who will manage security in Gehenna? It is said there's an organization called the Justice Task Force in the neighboring Trinity General School. Then let's found our own 'Gehenna Justice Task Force' and transfer the Prefect members there. They'll hate the Trinity-style name? Yes. We chose it specifically for them to hate. They should've thought about that before putting CEO Aru on the wanted list."

 HEU_gehenna_perfect_team_trial:0 "Discipline of Former Prefect Leadership"
 HEU_gehenna_perfect_team_trial_desc:0 "Excessive exercise of public power against Problem Solver 68, indiscriminate use of firearms against Rikuhachima Aru... Former leaders like Hina and Ako will undergo proper disciplinary procedures. Due to CEO Aru's 'hardboiled' generosity, their punishment will likely end as a formality, but there could be other outcomes."

 HEU_maintenance_of_security:0 "Security Management"
 HEU_maintenance_of_security_desc:0 "Various chaos and disturbances are occurring in Gehenna following the reorganization of the Prefect Team. It's due to the illusion that Gehenna no longer has a proper security agency. Of course, the disbanding of the Prefect Team won't mean the collapse of Gehenna's security. The new agency will maintain security more effectively than the old Prefect Team."

 HEU_civilian_control:0 "Controlled Security Agency"
 HEU_civilian_control_desc:0 "We must learn from how the old Prefect Team acted like a sort of warlord with power separate from the Gehenna Pandemonium Society. The new Gehenna security apparatus must be under strict civilian control, and its autonomy will be extremely limited. Especially, turning gun barrels toward Problem Solver must never happen!"

 HEU_states_quo_club:0 "Status Quo for the Club System"
 HEU_states_quo_club_desc:0 "Some say Gehenna's society is divided due to the proliferation of clubs. This implies that banning many clubs, or at least merging clubs with similar purposes, is the way to reduce Gehenna's chaos. But in the end, wasn't Problem Solver 68 one of those 'proliferating' clubs? Following such radical claims would be self-denial for Problem Solver."

 HEU_emergency_medicine_department_support:0 "Support for Emergency Medicine Dept."
 HEU_emergency_medicine_department_support_desc:0 "Actually, come to think of it, the Gehenna Emergency Medicine Dept. sometimes seems more 'hardboiled' than CEO Aru. Especially the way they grab and move the injured like they're corpses. The Emergency Medicine Dept. will be able to play its part in the new Gehenna."

 HEU_emergency_medicine_department_support_2:0 "Armament Restrictions for Emergency Medicine Dept."
 HEU_emergency_medicine_department_support_2_desc:0 "Separate from investing money and allowing them to operate more medical facilities, the armament level of the Emergency Medicine Dept. will be strictly limited from now on. Shooting people to 'create patients' when there are none on site is absurd. Is that hardboiled? That's quite different from the hardboiled CEO Aru has in mind."

 HEU_gastronomy_research_group_removed:0 "Disbandment of the Gourmet Research Society"
 HEU_gastronomy_research_group_removed_desc:0 "Rikuhachima Aru promised a 'Status Quo for Gehenna's club system.' However, the Gourmet Research Society... they aren't a club, they're just terrorists. By Rikuhachima Aru's minimum moral standards, they are an evil that can never be tolerated."

 HEU_sparkle_club:0 "Exchange with the Sparkle Club"
 HEU_sparkle_club_desc:0 "Aru knows nothing about the internal affairs of Gehenna. Therefore, the group of the most 'ordinary' Gehenna students... the Sparkle Club, as Aru assumes, is a trustworthy partner. It wouldn't be bad to meet them and hear internal information about Gehenna."

 HEU_hot_springs_department_benriya:0 "Problem Solver Hot Spring Development Dept."
 HEU_hot_springs_department_benriya_desc:0 "The Hot Spring Development Dept. is far too dangerous an organization to leave active in Gehenna. The best way is to incorporate them into Problem Solver and send them abroad under the pretext of 'Overseas Hot Spring Development'."

 HEU_hot_springs_department_gehenna:0 "Compromise with Hot Spring Development Dept."
 HEU_hot_springs_department_gehenna_desc:0 "The Hot Spring Development Dept. is too numerous to suppress. Let's compromise by guaranteeing their activities but stepping in to neutralize them after an incident occurs."

 HEU_hot_springs_department_work:0 "Hot Spring Development Projects"
 HEU_hot_springs_department_work_desc:0 "The Hot Spring Development Dept. itself causes more hindrance than help to Gehenna. However, one cannot say the profits from their development projects are non-existent."

 HEU_weak_pandemonium_society:0 "Reduction of Pandemonium Power"
 HEU_weak_pandemonium_society_desc:0 "Some students speculate that Rikuhachima Aru will become the new Student Council President. But that won't happen. Aru feels she lacks a sense of belonging to manage all of Gehenna, and she values the title of CEO of Problem Solver more than being Gehenna's Student Council President. The Pandemonium Society will be maintained. Even if all of Pandemonium's projects must henceforth receive Aru's approval stamp."

 HEU_pandemonium_leader_makoto:0 "Student Council President Makoto"
 HEU_pandemonium_leader_makoto_desc:0 "Gehenna's Student Council Presidency will now change from a direct election to Aru's appointment system. Hanuma Makoto is the most unobjectionable choice. She's too stupid to start a rebellion, and as long as she gets the President's seat, she'll follow any of Aru's instructions."

 HEU_pandemonium_leader_satsuki:0 "Student Council President Satsuki"
 HEU_pandemonium_leader_satsuki_desc:0 "Gehenna's Student Council Presidency will now change from a direct election to Aru's appointment system. Satsuki Kyogoku, the former head of Pandemonium Intelligence, claims she can use her hypnosis ability to make Gehenna students worship Aru and is requesting to be appointed as the new President. Since she likely knows the weaknesses of Gehenna internals as an intelligence head, she wouldn't be a bad choice for a puppet President."

 HEU_pandemonium_leader_victoria_louise:0 "Student Council President Victoria von Preussen"
 HEU_pandemonium_leader_victoria_louise_desc:0 "Gehenna's Student Council Presidency will now change from a direct election to Aru's appointment system. Since the German Hohenzollern Imperial Family went into exile in Luxembourg, the Hohenzollern family has been demanding their 'obvious rights' over German territory. We can't give back the defunct German Emperor title, but we could give them the Gehenna Student Council Presidency."

 HEU_personnel_retraining:0 "Retraining Program"
 HEU_personnel_retraining_desc:0 "All members of the Pandemonium Society must recognize that the true ruler of Gehenna has changed. Of course, Pandemonium will be maintained, but they won't be able to demand power beyond managing Gehenna students."

 HEU_pandemonium_intelligence_network:0 "Absorbing Pandemonium Intelligence Network"
 HEU_pandemonium_intelligence_network_desc:0 "The Pandemonium Society has historically held an extensive intelligence network to dig up info on the Prefect Team. That personnel will be a great help to Problem Solver 68 from now on."

 HEU_pandemonium_aru:0 "Pandemonium for Us"
 HEU_pandemonium_aru_desc:0 "It's well known that Pandemonium spent a long time creating promotional booklets for Ibuki Tanga. If they can make propaganda for Ibuki, why not for us? Pandemonium will now serve as a propaganda agency to produce materials for Aru personally."

 HEU_pandemonium_everyone:0 "Pandemonium for Gehenna"
 HEU_pandemonium_everyone_desc:0 "The actual power of the Pandemonium Society has been reduced, but because of that, Pandemonium will no longer waste budget on unnecessary formalities and will instead invest its limited budget into welfare for Gehenna students."

 HEU_legitimate_dominion:0 "Legitimate Dominion"
 HEU_legitimate_dominion_desc:0 "It is Pandemonium that governs Gehenna. And it is Rikuhachima Aru who governs Pandemonium. We have effectively secured legitimate dominion over Gehenna."

 HEU_hidden_hina_focus_1:0 "Hina's Loyalty"
 HEU_hidden_hina_focus_1_desc:0 "As Hina joined Problem Solver following the disbandment of the Prefect Team, Problem Solver's power has significantly increased. Hina intends to appear on propaganda broadcasts to personally persuade students that the 'new' Gehenna will be a better school than before."

 HEU_hidden_hina_focus_2:0 "Hina-led Intelligence Agency"
 HEU_hidden_hina_focus_2_desc:0 "Before becoming the Head Prefect, Hina was an agent of the Prefect Team's 'Intelligence Dept.' While the intelligence agencies in Luxembourg are in a state of tension due to competition between the Communist Party and the military, she aims to use her experience as an intelligence agent to sweep away the influence of political factions within the agency and reorganize it for Aru."

 HEU_hidden_hina_focus_3:0 "Persuading Prefect Remnants"
 HEU_hidden_hina_focus_3_desc:0 "Even after the disbandment of the Prefect Team, some former members are occupying parks in Gehenna and continuing resistance, but Hina said she would help disband them by persuading them with words rather than force."

 HEU_hidden_hina_focus_4:0 "Hina's Training Support for Problem Solver"
 HEU_hidden_hina_focus_4_desc:0 "Mutsuki, who became distant from other employees after the coup incident, and Aru, who could no longer properly aim or use a gun, refused, but Hina promised to personally teach and train Problem Solver 68 based on her combat experience in the Prefect Team."

 HEU_hidden_hina_focus_5:0 "As a Member of Problem Solver"
 HEU_hidden_hina_focus_5_desc:0 "The colleagues who initially viewed the news of Hina's defection—once an enemy of Problem Solver 68—with great suspicion have one by one come to admit that Hina has truly fallen for Aru. Now, it has become daily life for Mutsuki, Kayoko, Haruka, and Hina to converse like friends."

 HEU_hidden_hina_focus_6:0 "Facing Ako"
 HEU_hidden_hina_focus_6_desc:0 "\"...Ako, it's me. Hina. ...It's shameful of me, but could we meet and talk?\""

 HEU_repudiation_of_the_eden_treaty: "$GEH_repudiation_of_the_eden_treaty$"
 HEU_repudiation_of_the_eden_treaty_desc: "Problem Solver 68 does not wish to act as *representatives of Gehenna* and has almost no sense of belonging to it. However, as the collapse of the Pandemonium Society leaves [ROOT.GetLeader] as the only leader capable of representing Gehenna, we must finalize the tedious peace treaty between Gehenna and Trinity ourselves."

 HEU_centralized_eden_treaty: "$GEH_centralized_eden_treaty$"
 HEU_centralized_eden_treaty_desc: "Though we don't know much about the long-standing rivalry between the two schools, that is exactly why our new Eden Treaty must be more centralized. Just as Aru achieved peace between Kivotosians and locals in Luxembourg, she believes she can achieve peace between the two schools as well."

 HEU_decentralized_eden_treaty: "$GEH_decentralized_eden_treaty$"
 HEU_decentralized_eden_treaty_desc: "Our government has shallow knowledge regarding the peace treaty between Gehenna and Trinity and is struggling to mediate between them. The most rational alternative is to configure a decentralized federal system for the two schools instead of forced centralization."

