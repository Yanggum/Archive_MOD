 ## Story Archive
 HEU_story_archive: "Story Archive"
 HEU_show_story_archive_gui: "Luxembourg Story Archive"
 HEU_show_story_archive_gui_desc: "You can view side stories related to Luxembourg and Problem Solver 68. This is independent of the game system and is designed purely for enjoying side stories related to the in-game nations. New stories may be added as time and events progress. We hope you enjoy them."

 HEU_story_event.1.t: "Citizen Wilhelm Preussen"
 HEU_story_event.1.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nWilhelm Preussen, once Wilhelm II, had not always been poor. Although the German Empire collapsed, he still had sufficient wealth afterwards. The imperial treasures he brought on his way to exile in the Netherlands were enough to help him maintain a comfortable life, and the Dutch government left him alone to spend a peaceful retirement.\n\nThe problem began with the Great Transfer. Because the mysterious invaders from the world of Kivotos collapsed the Dutch government so quickly, this time he had to flee for his life without even a chance to pack the imperial wealth. It would have been nice if he could have at least boarded the ship with the Dutch government officials. But the Queen didn't even give him a hint like 'I'm fleeing on this date, so come here.'\n\nWhat a wicked woman. With that thought, Wilhelm crawled out of his attic in the old city of Luxembourg. The former Emperor, who had lost almost all his wealth, was recently spending his old age in a narrow attic only a few meters wide. No imperial treasures, no servants to attend to him.\n\n\"Wilhelm Preussen! Why are you so late today?! You should be thankful just for being hired at your age...\"\n\nWhat remains is the shouting of the loud foreman. And a life where he must chop wood at the lumber camp to earn money for today's meals. Wilhelm put on his safety helmet without fastening the chin strap and picked up his axe. Woodcutting was a hobby in the Netherlands, but now it was his livelihood for survival.\n\nWill I ever be able to return to Germany and become Emperor again? Will I be able to enjoy life in the palace again, without hearing the nagging of some young Luxembourg brat?\n\n\"Hah... Huff...\"\n\nWilhelm wiped the sweat from his forehead and struck the wood at the camp with his axe, making a loud sound. Someday, a second chance will come. A chance to return to Germany, become Emperor again, and invade this tiny country. When that time comes, I will have my revenge on that ugly foreman who just screams at me to get to work quickly.\n\n\"I will...!\""

 HEU_story_event.2.t: "For the House of the Grand Duke"
 HEU_story_event.2.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nFor Emile Speller, the Gendarmerie commander who served the Grand Ducal family all his life, his first impression of Rikuhachima Aru was 'devil.' Flaming red hair like a wildfire and a red gun in her hand. She even had horns. He thought that her wicked appearance boded no good for Luxembourg.\n\nBut she was different.\n\n\"Her Highness might be inside!\"\n\"...Mutsuki and I will check the castle. Kayoko, you and Haruka check if there are any other threats outside.\"\n\nThe chaotic situation of the Great Transfer. Since she had just dropped into a completely unknown world, she must have been confused herself. Moreover, the place where she landed was literally a 'sea of fire.' However, Aru jumped into the palace with Speller to save the Grand Duke without a moment's hesitation. And.\n\nWhen she found Grand Duchess Charlotte, who had passed away covered in blood while holding a child's body, she piously knelt and gently closed the eyes of the deceased who had been unable to close them. Aru is different from other Gehenna students. ...It was surely that moment that made him first harbor such a thought.\n\n\"Place your hand and swear. Do you, Miss Rikuhachima, swear as the Regent of the Grand Duchy of Luxembourg to be loyal to the Grand Ducal family and to the constitution and laws of the motherland?\"\n\nNot long after, Rikuhachima Aru became the new Regent of the Grand Ducal family. Although Aru had no Grand Ducal family to be *loyal to* in that situation, it was different for Speller. Aru was different from other Kivotosians. She had a noble chivalrous spirit and the legitimacy of being a lawful Regent recognized by the Parliament.\n\nAnd, Rikuhachima Aru was a truly noble lord worthy of his service.\n\nThe day Aru was inaugurated as the new Regent, Speller hung Aru's portrait, which he had commissioned weeks ago, on the wall of his office. An upright soldier must be able to offer loyalty to the lord and the house he serves. Being a conservative and straight-laced monarchist, Speller naturally accepted Aru, who possessed both noble chivalry and legitimacy, as his new lord.\n\nSpeller saluted the frame on the wall. \"...I will not lose my lord a second time. This time, I will surely... risk my life for Her Highness.\""

