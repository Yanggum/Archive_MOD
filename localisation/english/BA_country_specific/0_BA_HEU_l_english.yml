 HEU_hina_hidden_path_tt: "§gThe one who needed comfort wasn't herself. ...It was Sorasaki Hina. She had merely been expecting a perfect superhuman from her imagination. But if Hina is also human, a normal living being just like her... shouldn't she be the first to be saved?§!\n\n\"Look. A Gehenna criminal is causing a violent incident, right? You're the hero of the Prefect Team. Shouldn't you arrest them immediately?\""
 HEU_hina_hidden_path_2_tt: "§gHina held that hand with a faint smile. As if laying down the sense of defeat and helplessness she felt from the dissolution of the Prefect Team.§!"
 HEU_hina_hidden_path_3_tt: "§gSince that day, Hina never saw Chinatsu or Iori again. She only heard rumors that they each left for academies far from Gehenna, obtained jobs completely unrelated to public safety, and were trying to forget their memories of the Prefect Team.§!"
 HEU_hina_hidden_path_fail_tt: "§gAfter that brief encounter, Aru never saw Hina again. Hina vanished, leaving only a short note saying 'I'm sorry,' and although the Luxembourg police and former Prefect Team members searched everywhere in Gehenna, not even a trace of her remained.§!"

 HEU_aru_sad_tt: "§gBecause she understood all too well why Mutsuki had to act this way, Aru bowed her head in self-guilt. It was because she was incompetent that she broke her precious childhood friend. Because Rikuhachima Aru was a pathetic leader. ...A leader who couldn't achieve anything.§!\n\n§RIt would be so much easier if Mutsuki would just pull the trigger.§!"

