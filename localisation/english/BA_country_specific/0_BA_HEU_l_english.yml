 benriya_return_brittany: "Return [LP1.GetName] to Brittany"
 benriya_return_polar: "Return [LP5.GetName] to Kola Peninsula"
 benriya_return_mordovia: "Return [LP5.GetName] to Mordovia"

 benriya_local_law_decision_LPX: "Transplant 68 Revolution to [FROM.GetNameDef]"
 benriya_local_law_decision_LPX_desc: "Our liberalism must spread wider and further. The League of Nations will also support our ideals."
 benriya_elimination_of_stalingrad: "Stalingrad to Volgograd"
 benriya_elimination_of_leningrad: "Leningrad to Saint Petersburg"

 ## United Duchy Decisions
 HEU_united_germanic_duchy_decision_category: "Realization of the Acts of Union"
 HEU_united_germanic_duchy_decision_category_desc: "As the §YActs of Union§!—where the three nations of Trinity, Gehenna, and Luxembourg are unified as one federation—were declared, §YRikuhachima Aru§! became a hero of all three nations. Even if we momentarily forget that Aru had no conception of the Acts of Union and did nothing to realize them.\n\nFollowing the unification war led by Asagi Mutsuki, we have the duty to ensure the Acts of Union remain as meaningful laws rather than empty propaganda. That is how the [ROOT.GetLeader] government can pass on a better United Duchy to future generations.\n\nThe decisions we can choose to realize the Acts of Union vary depending on who is currently the leader of [ROOT.GetNameDef].\n\nCurrent United Duchy Leader: [ROOT.GetLeader]\nRemaining Reconstruction Plans £decision_icon_small [?HEU_united_germanic_duchy_var]/6"

 ### Common 
 HEU_ugd_war_crimes_tribunal: "Eden War Crimes Tribunal"
 HEU_ugd_war_crimes_tribunal_desc: "Implementing harsh punishments risks breaking the ideals of the Acts of Union, so the war crimes tribunal is expected to be little more than cutting off the tail. Nevertheless, at least a minimum level of judgment for Gehenna and Trinity is necessary."
 HEU_ugd_reconstruction_committee: "Reconstruction Committee"
 HEU_ugd_reconstruction_committee_desc: "Since we are all brothers and sisters, every war is a civil war. We temporarily establish a Reconstruction Committee to recover the damage to the land and people scarred by war."
 HEU_ugd_help_of_the_LoN: "League of Nations Grant"
 HEU_ugd_help_of_the_LoN_desc: "Member states of the League of Nations have voluntarily collected some donations. This is a gesture of their deep consideration for [ROOT.GetName], which suffered economic hits due to the great war."
 HEU_ugd_money_problem: "Exchange Local Currencies for Luxembourgish Currency"
 HEU_ugd_maintenance_of_security: "Increase Budget for Maintaining Security"
 HEU_ugd_use_media: "Utilize the Media"
 HEU_ugd_use_media_desc: "Various media outlets release propaganda articles about the importance of the Acts of Union, emphasizing the significance of integration."

 ### Aru/Kayoko/Haruka
 HEU_ugd_equal_qualifications: "Codify Equal Qualifications"
 HEU_ugd_equal_qualifications_desc: "Although the Acts of Union emphasize an equal federation of Gehenna, Trinity, and Luxembourg, Trinity civil servants fear losing their jobs due to [ROOT.GetLeader]'s Gehenna bloodline.\n\nSuch a thing will never happen, and they will be able to live the same lives as before in Trinity, which maintains its national entity under the federal system."
 HEU_ugd_trinity_diplomacy: "Trinity Diplomacy"
 HEU_ugd_trinity_diplomacy_desc: "Trinity has not perished. Legally, that is. The Acts of Union emphasize that Trinity maintains sovereignty as a federal state. The new bill guarantees Trinity's right to use an independent flag and ensign (much like Scotland) to join international organizations or participate in sporting events."
 HEU_ugd_annex_justice_task_force: "Merge Justice Task Force"
 HEU_ugd_annex_justice_task_force_desc: "The Justice Task Force will move to the government of the United Germanic Duchy, which has become its superior organization following the Acts of Union. This also means they will not lose their positions even after Trinity's defeat."

 ### Haruka
 HEU_ugd_sea_of_fire: "Eradicate Pandemonium Culture"
 HEU_ugd_sea_of_fire_desc: "The Pandemonium Society corrupted Gehenna with its ugly corruption and dirty plutocracy, causing them to persecute the innocent and weak. All materials reminiscent of the Pandemonium Society will be incinerated. The records will all burn. Not a single trace will remain."
 HEU_ugd_remove_pandemonium: "Trinity-led Annexation of Pandemonium Society"
 HEU_ugd_remove_pandemonium_desc: "Haruka loathes Gehenna. How could she not? Who likes those ugly sadists. Haruka still remembers those horned ones who clipped her hair.\n\nSince Haruka's rise to power was achieved by Amau Ako's faction, her erasure of Gehenna will focus on the closest enemy. First, we will reassign the federal administrative regions to wipe the Gehenna Central District off the map and incorporate it into Trinity.\n\nIs there any work more important than sowing salt on the land of those demons?"
 HEU_ugd_i_dont_like_gehenna: "Exclude Gehenna"
 HEU_ugd_i_dont_like_gehenna_desc: "Exclude Gehenna from all public positions and fill them with Trinity students. Who else but Haruka—the second Thunder Emperor who will turn Gehenna into a salt desert—would do this?"

 ### Trinity
 HEU_ugd_united_justice_task_force: "Reactivate Justice Task Force"
 HEU_ugd_united_justice_task_force_desc: "The Justice Task Force will move to the government of the United Germanic Duchy, which has become its superior organization following the Acts of Union. With the birth of a Trinity Prime Minister, we have expressed that they will not lose their positions despite the defeat and even that defeated generals can be pardoned."
 HEU_ugd_social_conservatism: "Social Conservatism"
 HEU_ugd_social_conservatism_desc: "The reason the United Duchy burned and was destroyed was that it was not religiously fulfilled. Social conservatism based on faith will lead the United Duchy on the right path in the future."
 HEU_ugd_freedom_of_each_state: "Freedom of Individual States"
 HEU_ugd_freedom_of_each_state_desc: "Just as various factions of Trinity operated freely in Trinity before the translocation, the various states of the United Duchy will have wider autonomy to operate locally."

 ### Mine
 HEU_ugd_order_of_relief_knights: "Stronger Knights Hospitaller"
 HEU_ugd_order_of_relief_knights_desc: "Relief where relief is needed! For the integration of the United Duchy, we will strengthen the authority of the Knights Hospitaller and support broader medical services."
 HEU_ugd_support_of_johannes: "Gain Support of the Johannine Faction"


#Luxembourg (Problem Solver 68) Decisions End
#Problem Solver 68 National Spirits

 HEU_sinloe_wa_uae:0 "Trust and Amity"
 HEU_sinloe_wa_uae_desc:0 "Though they have fallen into an unknown world, the employees of Problem Solver will be together forever."

 HEU_grand_duchy_of_luxembourg:0 "Grand Duchy of Luxembourg"
 HEU_grand_duchy_of_luxembourg_desc:0 "Even amidst the chaos following the Grand Translocation, the Grand Duchy of Luxembourg did not perish. At least theoretically. After the Grand Ducal House of Nassau was annihilated in the chaos of November 1935, the Right Party government formed a coalition with Problem Solver 68, who helped suppress the chaos.\n\nOf course, Luxembourg before and after the translocation is greatly different. Rikuhachima Aru theoretically should have no political power as a constitutional monarch, but in reality, she is deeply involved in Luxembourgish politics and exercises significant political influence."

 HEU_grand_duchy_of_luxembourg_alt:0 "Reconstructed Grand Duchy of Luxembourg"
 HEU_grand_duchy_of_luxembourg_alt_desc:0 "Even amidst the chaos following the Grand Translocation, the Grand Duchy of Luxembourg did not perish. At least theoretically. After the Grand Ducal House of Nassau was annihilated in the chaos of November 1935, the Right Party government formed a coalition with Problem Solver 68, who helped suppress the chaos.\n\nAs Rikuhachima Aru left the Luxembourg government, the coalition ended. Although the influence they left behind will not disappear, Luxembourg will gradually change into a new form."

 HEU_grand_duchy_of_luxembourg_benriya:0 "Shaking Luxembourg"
 HEU_grand_duchy_of_luxembourg_benriya_desc:0 "Even amidst the chaos following the Grand Translocation, the Grand Duchy of Luxembourg did not perish. At least theoretically. The coalition government of Luxembourg has collapsed, and local politicians have been ousted from the cabinet.\n\nWith the existing cabinet and parliament neutralized, current Luxembourg has effectively become an absolute autocracy."

 HEU_gehenna_immigrant:0 "Gehenna Immigrants"
 HEU_gehenna_immigrant_desc:0 "Welcome to [ROOT.GetName]! The Luxembourg region is experiencing a continuous influx of population due to the migration of students dissatisfied with the Gehenna Academy system."

 HEU_end_of_holding_act_idea:0 "Abolition of the Holding Act"
 HEU_end_of_holding_act_idea_desc:0 "The Holding Act of 1929 was an attempt to make Luxembourg a tax haven by granting tax exemptions to overseas holding companies that established themselves in Luxembourg. This law succeeded in attracting various foreign companies to Luxembourg over the past few years, but it lost its value with the collapse of the Western European capitalist block due to the Grand Translocation.\n\nWith the abolition of the Holding Act, we were able to temporarily collect massive amounts of taxes from companies (mostly American) remaining in Luxembourg. Although temporary social chaos will occur as betrayed companies flee Luxembourg en masse, it is a blow we can handle."

 HEU_titanium_idea:0 "Titanium Mass Production"
 HEU_titanium_idea_desc:0 "Titanium technology is not yet well known to the locals, but our scientist Guillaume Kroll has invented a steelmaking method that can produce titanium in large quantities."

 HEU_national_labour_council_idea:0 "National Labor Council"
 HEU_national_labour_council_idea_desc:0 "The National Labor Council, supported by local Luxembourgish left-wing forces, is a state body that forces workers and employers to discuss workplace welfare, including wage issues, on equal terms. Both local and Kivotosian workers participate in this council."

 HEU_gehenna_labour_council_idea:0 "Service Council"
 HEU_gehenna_labour_council_idea_desc:0 "The Service Council, established by Rikuhachima Aru's instructions, is a state body that forces workers and employers to discuss workplace welfare, including wage issues, on equal terms. The labor spokespersons of this council are mostly composed of Kivotosian service personnel."

 HEU_RTL_idea_1:0 "RTL Rock Music Channel"

 HEU_RTL_idea_2:0 "RTL Cultural Exchange Channel"

 HEU_gehenna_immigration:0 "Kivotos Immigration Policy"
 HEU_gehenna_immigration_desc:0 "An active policy is underway to facilitate the immigration of various Kivotos students to Problem Solver 68 territory. Conflicts between locals and immigrants will grow, but it is acceptable collateral damage."

 HEU_nationalization_of_railways_idea:0 "Nationalization of Railways"
 HEU_nationalization_of_railways_idea_desc:0 "Through cooperation between the Communist Party of Luxembourg and Problem Solver 68, all railway industries in Luxembourg have been converted to state ownership."

 HEU_rikuhachimaism_idea:0 "Rikuhachimaist 68 Revolution"
 HEU_rikuhachimaism_idea_desc:0 "\"A revolution in which I cannot dance is not a revolution.\"\n\n§YRikuhachimaism§!, also called the §Y68 Revolution§! because it was initiated by Problem Solver 68, is a cultural anti-authoritarian political movement proposed by Rikuhachima Aru.\n\nRikuhachima Aru—unable to seize local governments like Gehenna or Trinity, or even build a cooperative government with helpful locals like Abydos—has faced continuous confrontation with local anti-democrats, Nazis, and conservative religious forces. In this process, the political confrontation with the Catholic Church, which viewed the female-oriented Kivotos civilization as inferior, and the Nazis, who showed nationalistic hatred toward Kivotosians, led Aru to the thought that 'Kivotosians must be protected from the culture of the ugly locals.'\n\nWhile there is no specific book explaining Rikuhachimaism, it is basically recognized by its support for atheism, opposition to the oppression of women, sexual minorities, and the disabled discriminated against by local culture, rejection of the authoritarian culture established by locals, and finally, the unity of all Kivotos academies and Kivotos pan-nationalism.\n\nUnlike other social movements led by the working class, Rikuhachimaism is unique in that it is maintained through the support of (mostly Kivotosian) students. Due to its peculiarity, the political classification of this ideology is a subject of debate in global academia. In Europe, influenced by the translocation, scholars focus on Aru's Kivotos nationalist ideology and classify Rikuhachimaism as a typical fascism, while American political circles classify it as a branch of Marxism due to its anti-religious and pro-LGBTQ+ ideas."

 HEU_luxembourgism_idea:0 "Benriya Integrationism"
 HEU_luxembourgism_idea_desc:0 "\"All humans are born free and equal in dignity and rights. They are endowed by nature with reason and conscience and should act towards one another in a spirit of brotherhood.\"\n\nRikuhachima Aru has faced continuous confrontation with local anti-democrats and conservative forces. However, through cooperation between Aru and some local organizations, she created a sort of idealistic concept.\n\nBenriya Integrationism argues that translocators should learn and assimilate into local Germanic culture to live in harmony with locals, while simultaneously reaching compromises with locals through legitimate methods, including parliamentary politics. Kivotosians understand local Luxembourgish culture and respect that they are the indigenous people who have lived in this land for a long time. They stop violent methods and prove to the locals through peace and persuasion that they are 'not dangerous translocators.' Through this, locals will gradually come to recognize translocators as fellow citizens. This is the center of Benriya Integrationism.\n\nExternally, Benriya Integrationism takes a militant Germanic nationalist tone to satisfy Luxembourgish nationalists, but internal policies show a democratic socialist tendency, heavily influenced by the Communist Party of Luxembourg, which mediates harmony between Kivotosians and locals."

 HEU_financial_difficulties:0 "1935 Luxembourg Great Depression"
 HEU_financial_difficulties_desc:0 "Under the 1921 Luxembourg-Belgium Economic Union, Luxembourg used a credit currency linked to the same value as the Belgian currency. Luxembourg's money was always exchangeable 1:1 with Belgian money, and we gained great economic benefits from this alliance over the past 15 years.\n\nHowever, due to the Grand Translocation, the Belgian Central Bank, which guaranteed the credit of our currency, collapsed as the Belgian government went into exile. Luxembourg's money is now nothing more than scrap paper with no one guaranteeing its value, and bartering from ancient times has been resurrected in the markets. As the failure of credit currency has been proven, we need an alternative like the resurrection of the gold standard or borrowing credit from another nation's currency again."

 HEU_war_with_TRM_idea:0 "Resistance Against Trinity"
 HEU_war_with_GEH_idea:0 "Resistance Against Prefect Team"
 HEU_war_with_GEM_idea:0 "Resistance Against Pandemonium Society"

 HEU_pro_rikuhachimaism_idea:0 "Rikuhachimaist Alliance"
 HEU_pro_rikuhachimaism_idea_desc:0 "All Kivotosians have their own cultures, but they are all equal in that they are discriminated against by the local 'civilized' people of Earth. The Rikuhachimaist Alliance is a private organization created by non-student Kivotos translocators, such as beastmen and robots. The alliance suppresses local far-right, nationalist, and religious movements and supports voluntary supplies for the Problem Solver 68 army on the battlefield to achieve the ideals of Rikuhachimaism."

 HEU_civil_rights_idea:0 "Luxembourg Civil Rights Act"
 HEU_civil_rights_idea_desc:0 "A civil rights act that prohibits discrimination in employment, wages, public services, and private services against Kivotosians who translocated during the 1935 Grand Translocation, and punishes individuals and groups who violate it."

 HEU_civil_rights_idea_2:0 "Strengthened Luxembourg Civil Rights Act"
 HEU_civil_rights_idea_2_desc:0 "A civil rights act that prohibits discrimination in employment, wages, public services, and private services against translocated Kivotosians. The strengthened act goes one step further. Universities and public institutions must implement active affirmative action policies, such as granting bonus points for the admission and hiring of Kivotosian students. Aru believes such policies can advance the rights of the discriminated Kivotosian minority."

 HEU_gehenna_academy_president_makoto_idea:0 "Hanuma Makoto"
 HEU_gehenna_academy_president_makoto_idea_desc:0 "After the Gehenna Pandemonium Society was seized by Problem Solver 68, Rikuhachima Aru appointed Hanuma Makoto as the Chairperson of Gehenna."

 HEU_gehenna_academy_president_satsuki_idea:0 "Kyogoku Satsuki"
 HEU_gehenna_academy_president_satsuki_idea_desc:0 "After the Gehenna Pandemonium Society was seized by Problem Solver 68, Rikuhachima Aru appointed Kyogoku Satsuki as the Chairperson of Gehenna."

 HEU_gehenna_academy_president_victoria_idea:0 "Victoria Louise of Prussia"
 HEU_gehenna_academy_president_victoria_idea_desc:0 "After the Gehenna Pandemonium Society was seized by Problem Solver 68, Rikuhachima Aru appointed Victoria Louise of Prussia as the Student Council President of Gehenna Academy. Gehenna Academy's first local student council president seems to find it difficult to adapt to the 'free' atmosphere of Gehenna students."

 HEU_gehenna_academy_for_aru_idea:0 "Pandemonium for Aru"
 HEU_gehenna_academy_for_aru_idea_desc:0 "All the power of Pandemonium is used to create propaganda praising Rikuhachima Aru personally."

 HEU_pandemonium_intelligence_network_idea:0 "Pandemonium Intelligence Network"

 HEU_luxembourg_army_dynamic_modifier:0 "Luxembourgish Army"
 HEU_luxembourg_army_dynamic_modifier_desc:0 "Until the 19th century, the Luxembourgish army consisted only of small-scale militias, but it acquired a standing regular army with the formation of the Gendarmerie in 1881. Before the Grand Translocation, it only had the capacity to maintain public order and lacked the ability to respond to foreign invasions, but since Rikuhachima Aru took power, its scale has been increased and weapons modernized."

 HEU_rikuhachimaism_other_country_idea:0 "Rikuhachimaist 68 Revolution"
 HEU_rikuhachimaism_other_country_idea_desc:0 "The Rikuhachimaist revolution, which started in Luxembourg under the rule of Problem Solver 68, has gained significant influence in the territory of [ROOT.GetName] as well. While Rikuhachimaism is criticized for fueling conflicts between locals and Kivotosian translocators by advocating for opposition to authoritarian culture and more freedom, it is also evaluated as having influenced the advancement of Kivotosian rights and the breakdown of local authoritarian cultures."

 HEU_to_the_end_idea:0 "Struggle or Die"
 HEU_to_the_end_idea_desc:0 "A paradise where all Kivotosians receive equal treatment without discrimination. The hope dreamed of by Problem Solver 68 was placed in a precarious situation after the collapse of their ally, the Pandemonium Society. But that is exactly why everyone in Problem Solver 68 rose up to fight until the end. Even if we lose this fight and our dreams turn to ashes and disappear, the fact that we fought here to achieve our dreams will never be erased. Never."

 HEU_red_winter_68_idea:0 "Trotskyist Influence on the 68 Revolution"
 HEU_red_winter_68_idea_desc:0 "The 68 Revolution dreamed of by Rikuhachima Aru was a simple social-liberal, anti-authoritarian movement advocating only for the 'dismantling of local oppressive culture.' However, Trotskyists who immigrated from Red Winter argue that cultural reform alone is insufficient to dismantle oppressive culture, and it must be backed by economic reform and the overthrow of the capitalist class based on Trotskyism. The direction of the 68 Revolution is wavering due to the debate between Trotskyists and other academy students..."

 HEU_red_winter_68_yes_idea:0 "Acceptance of Trotskyism in the 68 Revolution"
 HEU_red_winter_68_yes_idea_desc:0 "Rikuhachima Aru effectively tacitly admitted that the Trotskyist revolutionaries are also included in 'Rikuhachimaism' by overlooking their claims. The 68 Revolution has shifted further left than its initial conception due to the influence of Trotskyists, and whether this choice was right can only be known after a generation has passed."

 HEU_progressive_conservatism: "Progressive Conservatism"
 HEU_progressive_conservatism_desc: "The reformist faction of the Luxembourgish Right Party compromised with the ideals of Rikuhachimaism and argued that the farming class must also change according to Kivotos culture for the development of Luxembourg. As local women who used to stay only in farmhouses began social life with the support of the Right Party, female social advancement in Luxembourg is being maximized. The reformist faction says conservatism must also readjust its concept according to a changing society. The compromise between Rikuhachimaism and local conservatism was defined as 'Progressive Conservatism' by Right Party deputy Pierre Dupong."

 HEU_stasi: "State Security Bureau"
 HEU_stasi_desc: "The State Security Bureau, established under the leadership of the Communist Party of Luxembourg, was founded as a counter-intelligence agency to prevent a 'Second Translocation Massacre.' The KPL intended to appoint the Bureau Chief directly to keep the new intelligence agency under their influence, but due to opposition from pro-Aru royalist officers, it was established as a counter-intelligence organization loyal to Aru by being assigned to the military."

 HEU_stasi_2: "State Security Bureau"
 HEU_stasi_2_desc: "Hina and pro-Aru royalist officers completely blocked the influence of the Communist Party, which sought to influence the State Security Bureau, and strengthened it into a more efficient counter-intelligence agency."

 HEU_way_to_forgiveness_fall: "Memorial Park Plan Failed"
 HEU_way_to_forgiveness_fall_desc: "Gehenna students do love blowing things up with bombs, but even Aru didn't seriously expect them to blow up a facility commemorating the massacre Gehenna students committed with dynamite. Gehenna's terror against the memorial facility achieved division instead of integration for Luxembourg, and this wound will remain a disaster for Luxembourg for a long time."

 HEU_way_to_forgiveness: "The Path to Forgiveness"
 HEU_way_to_forgiveness_desc: "Aru was on the side 'preventing' the Luxembourg massacre during the translocation, but she harbored guilt for the citizens sacrificed at that time. Establishing a Memorial Park to commemorate those who died due to the translocation symbolizes harmony between Luxembourgish locals and Kivotosian immigrants and vows that the tragic history of the past will not repeat."

 HEU_legion_pro_lux: "Reinforcements for Rikuhachima"
 HEU_legion_pro_lux_desc: "We have promised to send volunteers for Problem Solver 68."

 HEU_healing_depression: "Aru's Healing Depressive Disorder"
 HEU_healing_depression_desc: "It would be nice if depressive disorder could be cured by a single beautiful episode, but it will take more time and sufficient medication for Aru's disorder to disappear. Although her hospitalization for a few days due to a suicide attempt was reported as 'recuperation from pneumonia,' it is now public knowledge that she suffers from depressive disorder. Many citizens supporting Aru are sending gifts to the Grand Ducal Palace for her recovery, and her health is gradually improving. She integrated Luxembourg divided into two peoples and integrated Problem Solver divided in two. Watching the results and spending this time with precious people will certainly be good medicine for her."

 HEU_abgeordnetenkammer_dynamic_modifier: "Luxembourg Parliament"

 HEU_anti_68_revolution: "Brightly Shining First Star of Counter-Revolution"
 HEU_anti_68_revolution_desc: "Kivotosians invaded Europe through the translocation, and despite swinging their fists at locals, they are creating a social contradiction that they will enlighten inferior European culture with Kivotos culture. Luxembourgish National Socialist Damian Kratzenberg debuted as a VTuber with the identity of a fictional Trinity student 'Nanami Ayaka' through cooperation with Arona, intending to protect Luxembourg from the madness of the so-called 68 Revolution. Kivotosians massacre locals yet claim they are politically more correct than humanity. But Damian Kratzenberg is resolutely fighting Rikuhachima Aru's revolution using internet media. Now here, the First Star of Counter-Revolution is brightly shining upon the entire so-called 'Kivotos GSC Revolutionary Committee' from the ruins of Schale."

 HEU_new_BLEU: "Luxembourgish Credit Currency"
 HEU_new_BLEU_desc: "The currency of the Grand Duchy of Luxembourg was maintained through the credit of the Belgian bank. Since Belgium collapsed, our currency lost its value, but our government has found a way to gain new credit."

 HEU_aru_idea: "$HEU_aru_rikuhachima$"
 HEU_aru_idea_desc: "The tragic frustration of the Civil Rights Act, the coup, and a series of events including Rikuhachima Aru's confinement increased sympathetic public opinion for her. A figure of high popularity among Gehenna students and a controversial figure among locals, she was unintentionally reborn as a national hero of Luxembourg after the coup."

 HEU_aru_idea_ending: "$HEU_aru_rikuhachima$"
 HEU_aru_idea_ending_desc: "The tragic frustration of the Civil Rights Act, the coup, and a series of events including Rikuhachima Aru's confinement increased sympathetic public opinion for her. A figure of high popularity among Gehenna students and a controversial figure among locals, she was unintentionally reborn as a national hero of Luxembourg after the coup.\n\nAfter the enactment of the Acts of Union, Aru stepped away from politics somewhat and delegated much authority to the Prime Minister. However, Rikuhachima Aru gained even greater public popularity after that."

 HEU_benriya_friendship: "Persona"
 HEU_benriya_friendship_desc: "Rikuhachima Aru possesses four scores representing her personal achievements and abilities: Wisdom, Kindness, Determination, and Charisma. As her persona expands, she will develop from a state management amateur into a seasoned politician."

 HEU_broken_trust_and_friendship: "Broken Trust and Amity"
 HEU_broken_trust_and_friendship_desc: "Problem Solver 68 effectively collapsed as Asagi Mutsuki and Onikata Kayoko engaged in urban combat attempting to kill each other. While 'Problem Solver 68 Rank-and-File Units' composed of Gehenna students still exist, the friendship and ties of the four core figures that had continued since before the translocation have been thoroughly destroyed.\n\nCan this bond ever be reconnected?"

 HEU_grand_duchy_of_luxembourg_mutsuki:0 "Grand Duchy of Luxembourg"
 HEU_grand_duchy_of_luxembourg_mutsuki_desc:0 "Rikuhachima Aru has been confined, and the parliament has been closed. Society is plunged into deeper darkness than ever due to the coup Gehenna students launched in the Grand Duchy of Luxembourg."

 HEU_luxembourg_administration_idea: "Luxembourgish Administration"
 HEU_luxembourg_administration_idea_desc: "Since the suspension of Parliament following the coup, all power has been concentrated within the Luxembourg administration. The public's perception of this new government will be determined by the future actions of [ROOT.GetLeader]."

 HEU_liberty_equality_and_fraternity: "Liberty, Equality, and Fraternity"
 HEU_liberty_equality_and_fraternity_desc: "The spread of French culture is accelerating divisions within Luxembourgish society. While this is detrimental to national unity, it is a positive development in terms of being able to better control the populace."

 HEU_kayoko_revolt_fail: "Aftermath of the Luxembourg City Siege"
 HEU_kayoko_revolt_fail_desc: "The urban warfare in Luxembourg between Onikata Kayoko's anti-government forces and Asagi Mutsuki's government forces has severely demoralized our military and mentally fractured the nation. More than the death of soldiers, the political consequence of a 'Divided Luxembourg' remains the greater trauma of this incident."

 HEU_kayoko_revolt_success: "Peaceful Luxembourg Reunification"
 HEU_kayoko_revolt_success_desc: "Onikata Kayoko has surrendered. Luxembourg is once again united as one. Though the government wavered for a time, we move toward the future, unified once more."

 HEU_weekend_farm:0 "Sending Rivals to the Weekend Farm"
 HEU_weekend_farm_desc:0 "Foreign intelligence agencies believed the Asagi regime's practice of sending all political rivals from the Right-Wing Party to the 'Weekend Farm' was a form of secret execution or something equivalent. They were quite baffled to discover it was literally just house arrest in the countryside."
 
 HEU_LoN_puppet_idea: "League of Nations Mandate"
 HEU_LoN_puppet_idea_desc: "The mandate system created after WWI was intended to facilitate rapid independence and autonomy for colonies, but it is notorious for slow independence and unequal relations with mandatory powers. However, for residents of occupied territories, it is known as the lesser evil, given that it does eventually grant actual independence after a few decades."

 HEU_dockyard_mass_operation: "Massive Shipyard Expansion"

 HEU_ARBED:0 "ARBED"
 HEU_spuerkeess:0 "Staatsbank Luxembourg"

