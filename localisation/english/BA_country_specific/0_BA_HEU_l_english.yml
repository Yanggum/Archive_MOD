 ### Character Descriptions ###
 HEU_wilhelm_II_desc: "§gWilhelm II, or Wilhelm von Preussen, was forced to abdicate as Emperor of the German Empire due to its collapse in November 1918. He gathered what wealth he could and went into exile in the Netherlands, hoping for a day he could be restored as the German Emperor. However, the Kivotos 'Great Transfer' of November 1935 tore the Netherlands apart, and he was forced to flee once again.\n\nWilhelm von Preussen wanted to flee with the Dutch government, but in the chaos following the Great Transfer, Queen Wilhelmina boarded a ship without looking after the exiled Emperor. The Kaiser had to turn toward Luxembourg, and in the process, most of the wealth held by the House of Hohenzollern vanished.\n\nThe Emperor thought the Luxembourgers would welcome him as the German Emperor, but their view of the German Emperor—the 'occupier' of Luxembourg during the last World War—was cold. Will the new government have the leeway to grant the former Emperor even a humble advisory position? Or will they ignore him, leaving him to grow old alone?§!"
 HEU_emile_speller_desc: "§gEmile Speller, a major in the Gendarmerie, was the commander who advanced to suppress the Gehenna students during the 'Great Transfer' under the orders of Prime Minister Bech of the Right Party. In reality, it was the Gendarmerie that was suppressed. Having lost his left arm to the overwhelming firepower of the Gehenna students during the chaos of the Great Transfer, Speller came to realize the power of Kivotos 'Mystics.'\n\nHe determined that the most important thing for protecting Luxembourg from the threat of Kivotos nations was a well-planned defensive strategy. Although he could have retired from the Luxembourg military as a disabled veteran after the Great Transfer, he remains in the military, devising defensive strategies to counter foreign invasions.§!"
 HEU_joseph_bech_desc: "§gAlthough Prime Minister Joseph Bech was elected in 1926 through democratic elections, he himself is not a 'democrat.' He shared the anti-democratic tendencies of the Right Party's mainstream, including the push to abolish universal suffrage. An authoritarian and anti-communist, he led the immediate expulsion of the Communist Party member after they were elected to parliament in the 1934 elections.\n\nHowever, the political changes in Luxembourg caused by the Great Transfer significantly impacted Bech's political power. He brought Luxembourg to the brink of destruction by attempting armed provocation against Gehenna during the Great Transfer, and after losing all power to Rikuhachima Aru, he was reduced to a de facto figurehead Prime Minister. Yet, he still dreams of becoming the leader of Luxembourg once more, even if the possibility of that dream coming true is nonexistent.§!"
 HEU_emile_reuter_desc: "§gEmile Reuter, who has served as the President of the Chamber of Deputies of the Grand Duchy of Luxembourg since 1926, is a steadfast Catholic conservative and monarchist from the Right Party. Amidst the political turmoil of the Great Transfer, Reuter fled the burning Luxembourg for France, only to flee back to Luxembourg when France was conquered by Millennium Science School. Though he helplessly lost power during the Great Transfer, Reuter believes he can lead the chaotic Luxembourg back to the 'right path'—the maintenance of the conservative social order that existed before the 1935 Great Transfer.§!"
 HEU_pierre_dupong_desc: "§gPierre Dupong, part of the younger and 'reformist' faction within the Right Party, distances himself from reactionary party stances such as the abolition of universal suffrage. He is a moderate who has never voiced opposition, publicly or privately, even after Rikuhachima Aru became the leader of the Grand Duchy following the Great Transfer. While a conservative, Dupong is also a patriot and acknowledges that for the Grand Duchy of Luxembourg to survive the post-Transfer order, the assistance of Rikuhachima Aru and Problem Solver 68 is desperate. Local conservative forces opposed to this believe that if Aru simply leaves Luxembourg, the country can return perfectly to its pre-1935 state. However, Dupong analyzes that the moment Problem Solver 68 leaves, the Grand Duchy will be conquered by other Kivotos nations within a day or two.\n\nIndeed, it remains unclear whether post-Transfer Luxembourg possesses the ability to be 'self-reliant.'§!"
 HEU_victor_bodson_desc: "§gVictor Bodson, a socialist lawyer, began his political career in 1930 by joining the Luxembourg Workers' Party, a minor party. Though he lacked the influence to enter central politics, as a staunch anti-fascist, he held the belief that action was necessary to fight against Adolf Hitler in neighboring Germany.\n\nBodson pioneered a 'secret escape route' from Germany through Luxembourg to Belgian ports for travel to the United States and began personal anti-Nazi activities. Thanks to his help, hundreds of Jews and dissidents were able to escape Germany before the Great Transfer of 1935.\n\nWhile the Hitler regime in Germany collapsed due to the Great Transfer, Bodson's mission to protect all minorities oppressed by tyranny has only grown. Bodson is a member of the minority faction working to resolve racial conflicts between Kivotos transferees and Luxembourg locals, and he wishes to show his passion to Rikuhachima Aru.§!"

 HEU_aru_generic_leader_desc: "How should one describe Rikuhachima Aru, the Regent of a country without a Duke? Known to the Kivotosians who crossed over in the Great Transfer as the President of Problem Solver 68, and to the locals as the Regent of the Grand Duchy of Luxembourg, she is a local hero who protected Luxembourg City from the looting and massacres of Gehenna students immediately following the Transfer.\n\nDuring the Great Transfer of 1935, when the Gehenna faction attempted to loot and destroy the confused Luxembourg, Aru fought to protect it according to her own moral code. Even after the House of Nassau met its end at the hands of Gehenna, the fact that the locals came to accept her as an 'exceptional existence' was greatly influenced by her heroic conduct in Luxembourg.\n\nAru decided to stay in Luxembourg temporarily and serve as Regent until peace between the Kivotosians and the locals is achieved. However, the Regency, which she initially thought would be a 'temporary' duty for a few weeks, is dragging on, and Aru is feeling growing sympathy for the locals of this land. If she abandons them, how will they defend themselves against a second Gehenna invasion?"

 HEU_aru_fascist_leader_desc: "A small paradise where Kivotosians and locals can all live together in harmony. It is far-fetched, but that is why it is the path of an outlaw that Rikuhachima Aru can dream of. Aru stayed in Luxembourg with that small dream. She believed she could endure whatever hardships awaited her. However, the road to Aru's small dream was so, so very long.\n\nAnd, the employees of Problem Solver 68 are... being hurt by Aru's 'ideals.'\n\nWas loving everyone equally eventually the same as loving no one at all? Despair and pain never experienced in Kivotos. Finally, Aru abandoned the hope that she could coexist with the locals if she worked for them. One might say her heart was broken. One might say Rikuhachima Aru's ideals were denied. But... within Aru, there still remains a good will that she can never give up.\n\nThe 68 Revolution - To stop the discrimination of the locals, Aru raises her final flame of hope. Transplant 21st-century Kivotos culture into 20th-century Earth and annihilate Earth's discriminatory culture. If she can do just that, the small paradise Aru dreams of might survive. No.\n\nIt must."

 HEU_aru_communist_leader_desc: "A small paradise where Kivotosians and locals can all live together in harmony. It is far-fetched, but that is why it is the path of an outlaw that Rikuhachima Aru can dream of. Aru stayed in Luxembourg with that small dream. She believed she could endure whatever hardships awaited her. However, the road to Aru's small dream was so, so very long. The locals treat Rikuhachima Aru as a witch and mock her behind her back. Gehenna students openly ridicule Aru, saying she became the 'locals' dog' to protect the noble titles they gave her. Her dream of protecting both humanity and the Kivotosians has instead made Aru an enemy of both peoples.\n\nAs Aru is repeatedly terrorized by both humans and Gehenna students, the laughter of Problem Solver 68 is vanishing along with Aru's ideals. The fact that they 'couldn't protect Aru' has left scars on the hearts of the employees. When she heard the sound of Mutsuki and Kayoko screaming and fighting while calling each other by their surnames in the office without Aru, her soul was torn into hundreds of pieces.\n\nSomeone says: Move past being a child. Become an adult for the people you want to protect.\n\nWhat is an adult? How can one become a responsible person? Does Rikuhachima Aru even have the right to be such a thing?\n\n§R\"Wouldn't it be a happy ending for everyone if I just died, if I just disappeared?\"§!"

 HEU_aru_communist_leader_happy_ending_desc: "It was announced to the public that she stayed indoors for a few days due to pneumonia, but many will never know that Aru actually attempted suicide with cyanide-laced coffee the day Trinity was conquered. Who would think a leader who achieved such a great victory would make such a choice?\n\nWhile continuing to win wars and watching the banner of Problem Solver 68 spread further and further, Aru saw the people dying under her name and the crumbling relationships among the members. She came to believe that her death was the only way to be a <responsible adult>.\n\nPerhaps that thought was wrong.\n\nAfter miraculously waking from cardiac arrest, Aru became an adult in a form different from what she imagined. Though many things were lost, some things still remain. The precious dream of harmony between the two peoples—Kivotosians and humanity—was not broken.\n\nEnduring all these difficulties, Rikuhachima Aru moves toward the hope of saving everyone."

 HEU_aru_fascist_leader_68_happy_ending_desc: "The encounter and confrontation with the Virtual Streamer Nanami Ayaka was a great shock to Rikuhachima Aru. The reason Aru first stayed in Luxembourg, the tragic death of Grand Duchess Charlotte and the resulting guilt as a Kivotosian. At some point, Aru realized she had lost all of that and was forcing her concepts onto the locals, just like the invaders on the day of the 'Great Transfer.' Though Aru was someone who dreamed of being a wicked hard-boiled outlaw, she never wanted this kind of evil.\n\nThe attempt of the 68 Revolution itself must have been right. The quality of life for Kivotosians is better than before, and the world is changing rapidly in the direction Aru wants. However, Aru realized that the locals were abandoned in that progress. Aru's small paradise was built on someone's sacrifice, and the new General Student Council had no interest in the locals.\n\nThis was not the happy ending Aru dreamed of. 'A small paradise where Kivotosians and locals can all live together in harmony.' Standing before Charlotte's urn, Aru recalled that dream she had once forgotten. After all, a revolution where someone cannot dance is not a revolution for everyone."

 HEU_mutsuki_asagi_fascist_leader_desc: "There are countless gems in the world, but few can immediately recognize the beauty of an uncut stone. Even a ruby with a brilliant red glow is just a rock when unrefined; it only finds its true, transparent beauty after undergoing heat treatment.\n\nAru's beauty was like an unheated gem, which the people here could not yet recognize. The rejection of the 'Civil Rights Act' bill, which aimed to protect the rights of both locals and Kivotosians, made Aru a laughingstock and narrowed her political standing. Why could they not see the beauty of the gem they were kicking?\n\nMutsuki picks up the gem that was kicked and now keeps it in her own most precious display case. So that the brilliant red light, whose value only she recognizes, will never lose its glow again. And to burn away all the trash that dared to trample her precious 'Aru-chan,' Mutsuki confined Aru in a sterile room called a safe house, isolated from all the evils of the world.\n\nHow deep an affection is this?"

 HEU_haruka_igusa_fascist_leader_mutsuki_happy_ending_desc: "What word could describe Igusa Haruka? Perhaps those who know her well would summarize her as 'someone who hates Gehenna even more than the Trinitarians.' Having experienced abuse in Gehenna and the riots Gehenna students caused in Luxembourg in 1935, Haruka's hatred for Gehenna grew much larger.\n\nTherefore, Haruka can never be seen as a figure symbolizing integration with Gehenna. Perhaps if she were a military governor suppressing Gehenna, that would be different. The only reason Haruka became the Prime Minister of the United Grand Duchy encompassing Gehenna, Trinity, and Luxembourg immediately after the Union Act is because Mutsuki's position is too uncertain.\n\nRikuhachima Aru has begun her personal rule again, but she has not been able to make any decision regarding the treatment of the coup leader, Asagi Mutsuki. The Right Party has collapsed, and numerous parties from the Communists to the Radical Liberals are repeating mergers and splits, fighting among themselves to seize leadership of the new Luxembourg government. Since the establishment of the Union Act, Luxembourg has been suffering from an extreme 'leadership vacuum.'\n\nUntil a new leader of Luxembourg appears, Igusa Haruka will serve as a 'bridge' leader. Even if her work amounts to little more than huddling in a corner of the empty Prime Minister's residence and timidly scribbling signatures on documents brought by technocrats."

 HEU_mutsuki_asagi_fascist_leader_mutsuki_happy_ending_desc: "Asagi Mutsuki was effectively neutralized after the establishment of the Union Act. This was because she realized that her will to protect Aru was actually suffocating her. Mutsuki returned to the cabinet, but that was because too many pro-Mutsuki officials had taken control of the government for her to be punished, and because Rikuhachima Aru forgave her. Mutsuki will take on the role of cabinet leader again for Rikuhachima Aru, but it is impossible for her to exercise the same dictatorship as before.\n\nMutsuki decided to spend her new term in atonement and reflection on the past. Of course, the Luxembourg people do not seriously believe in her 'atonement,' and the only reason Mutsuki can perform the duties of Prime Minister is because she is not a directly elected leader. Mutsuki's path of atonement will take a very long time, and she has already gone too far for it to be accepted by the public. But Mutsuki will not stop. For Aru."

 HEU_kayoko_onikata_fascist_leader_mutsuki_happy_ending_desc: "Onikata Kayoko is the leader who led the former 'Aru Restoration' rebellion, supported by the monarchists in the Luxembourg military. She gained power after the collapse of the Asagi cabinet and took the wheel to lead Luxembourg's future. Of course, not everything is going well. Asagi Mutsuki dug a deep rift of conflict between the locals and Kivotosians, and Mutsuki's methods permanently damaged Problem Solver 68. However, Kayoko still has something left. Rikuhachima Aru. For her most important friend, she intends to lead Luxembourg through this darkness where the future is invisible.\n\nKayoko is expected to have smooth cooperation with the Gehenna faction due to her friendly relationship with Amau Ako of the Prefect Team (though it's not entirely friendly due to her tsundere nature). Although Kayoko is struggling to establish a mutual partnership with Trinity after the Union Act, she is doing her best to build the 'ideal world' Rikuhachima Aru dreamed of. Ideals are hard to reach, but they are worth the challenge precisely because they are difficult."

 HEU_mine_aomori_leader_desc: "Some hardline Trinity students consider Aomori Mine's acquisition of the Prime Ministership as a reconquest of Gehenna by Trinity. However, Mine herself is more interested in relief for the destroyed motherland than such 'retaliatory' acts. Practically, the reason she was able to become Prime Minister was the support of the local religious force, the Christian Social People's Party, and the Pandemonium Society, who would do anything to trip up Amau Ako. Mine seeks to balance Trinity, Gehenna, and Germany, which were joined into a loose federation after the Union Act, from a moderate, centrist position.\n\nAomori Mine knows that the United Germanic Duchy belongs neither to Trinity nor Gehenna nor any specific academy. Mine comforts the many citizens who are wounded and broken, respects the constitutional monarchy of the Rikuhachima family, and strives to build a conservative but stable new state without radical social change. The war is over, and in this time when swords must be turned into plowshares, stability and peace are needed more than radical change. Delivering aid where it is needed. That is what Mine has always done."

 HEU_reisa_uzawa_leader_desc: "Some hardline Trinity students consider Uzawa Reisa's acquisition of the Prime Ministership as a reconquest of Gehenna by Trinity. However, the reason Uzawa Reisa could become Prime Minister was the support of the Christian Social People's Party and the Pandemonium Society. Furthermore, Uzawa Reisa also tends to focus more on 'realizing justice' than on retaliation.\n\nUzawa Reisa's politics, having been active in the Vigilante Crew, are focused far more on the plaza politics familiar to her through vigilante activities than on legitimate methods through parliamentary discussion and consensus-building. Reisa practices a very controversial style of politics, such as internet politics via SNS and blunt 'Villain!' declarations toward politicians she dislikes. This isn't because she wants to cause social conflict, but because she learned the lesson that when encountering corruption, it's a much faster solution to just say 'Then die' and smash the villain's head with a hammer on the spot.\n\nThis fast and radical political method of hers sufficiently satisfies two support bases: the Trinity faction, and the Pandemonium Society, who learned politics by driving a Toramaru tank and lying down in front of the Prefect Team headquarters. The Christian Social People's Party is also favorable toward her religious background as a Trinity student, and the opposition parties are enjoying the confusion caused by her 'Reisa-esque' reckless politics. However, opposition forces including Amau Ako and Onikata Kayoko watch uneasily as she leads the newly founded United Germanic Duchy. Does she really have the qualities to unite the divided Gehenna, Trinity, and locals after the Union Act? Isn't her 'Then die' politics just leading the United Duchy toward self-destruction? Future generations will know the answer."

 HEU_haruka_igusa_terrible_leader_hidden_desc: "Igusa Haruka is not someone with the leadership qualities suitable for a leader. Her role has always been to assist Aru and quietly perform duties in the background. However, since the establishment of the Union Act, Aru has lost all interest in politics and is quietly focusing on small hobbies. Haruka believes that doing what she can in place of the resting Aru is the way to be loyal to the Aru who no longer sends commands.\n\nWhat then, is loyalty for Aru? Haruka realized it while watching the Pandemonium Society's parliament building burn. Aru imagined a paradise for the coexistence of all Kivotosians and locals. That dream is an unfinished goal that Aru couldn't achieve. Wouldn't completing that goal instead be Haruka's justice for the Aru she loves? Especially if she gathers and burns those hideous Gehenna trash who refuse to even admit they are hideous, Aru will surely be happy and praise Haruka. This is by no means possessiveness, nor an excuse to put her in a snow globe again like Mutsuki. Haruka will never lay a hand on Aru's freedom. She will only lay hands on those who are not worthy of having freedom.\n\nHaruka calls herself the 'Second Thunder Emperor,' succeeding Mutsuki who called herself the Thunder Emperor. And she will burn all the remnants of the Pandemonium Society and Gehenna that have saddened and tormented Aru. Without leaving a single small blemish, very thoroughly. When all of that is over, Aru will surely hug Haruka, gently stroke her head, and praise her for working so hard for her. How could she not?"

