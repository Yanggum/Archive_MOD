 HEU_event.151.a.tt:0 "§C\"Not all Kivotosians who came through the Transition participated in massacres and crimes. There were definitely people acting to stop them.\"§!\n"
 HEU_event.151.b.tt:0 "§C\"Gehenna wasn't the only evil in that incident. Those Luxembourgers who joined the looting in the chaos didn't have halos on their heads, did they?\"§!\n"
 HEU_event.151.c.tt:0 "§RIf you intentionally wish to lose this debate, click this option.§!\n"

 HEU_event.152.a.tt:0 "§C\"It can be solved through education and law. Other school-states are already doing so.\"§!\n"
 HEU_event.152.b.tt:0 "§C\"I fully understand having fears due to cultural differences. That's why the civil rights law will allow us to understand each other more deeply, beyond prejudice.\"§!\n"

 HEU_event.153.a.tt:0 "§C\"The horns or wings of those from Kivotos have no effect on this logic. I also have horns on my head, but did I participate in that massacre?\"§!\n"
 HEU_event.153.b.tt:0 "§C\"...Do I look like a horned demon to you? No, do you think anyone else from Gehenna could steal a human soul or anything like that?\"§!\n"

 HEU_event.154.a.tt:0 "§C\"What is the benefit of keeping half of the workable and educated population tied down? Healthy women of Kivotos entering society. Doesn't that mean the workers for factories, companies, and society double?\"§!\n"
 HEU_event.154.b.tt:0 "§C\"You seem quite afraid of being submissive to women... Did your mother not give you much love when you were a child?\"§!\n"

 HEU_event.155.a.tt:0 "§C\"In politics, saying 'I'll do that after the next election' is the same as saying I won't do it. Isn't telling us to wait for a generation saying you won't fix it?\"§!\n"
 HEU_event.155.b.tt:0 "§C\"Since when did the Speaker of the House care so much about 'public opinion'? Weren't you the standard-bearer of Luxembourgish reactionism?\"§!\n"

 HEU_event.156.a.tt:0 "§C\"Luxembourg is a sovereign state. There's no reason to enact laws while walking on eggshells for other nations.\"§!\n"
 HEU_event.156.b.tt:0 "§C\"Anyone would think the Great Transition happened because we intended it to. The Transition was an accident. And I'm trying to heal the victims of this accident.\"§!\n"
 HEU_event.156.c.tt:0 "§C\"I have deep empathy and regret for the damage in other European countries. However, that regret and the situation faced by the residents of Luxembourg are separate issues.\"§!\n"

