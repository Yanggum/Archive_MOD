 COU_regain_schedule_ticket:0 "스케줄 티켓 보충"
 COU_the_srt_problem_desc:0 "SRT 특수학원은 대전이 당시 빌헬미나를 비롯한 오라녜-나사우 왕가의 대다수를 몰살하는 실책을 저질렀습니다. 소대장 자체 판단으로 자행된 이 '학살'은 신년을 맞이하여 네덜란드 고등법원에서 총학생회에게 요청하여 이를 재판하기로 결정되었고, 이를 무를 수는 없어 보입니다."
 COU_the_decart_problem:0 "데카르트와 무소유 투쟁"
 COU_the_decart_problem_desc:0 "대전이 이후 점차 일을 기피하는 풍조가 늘고 있습니다. 무책임한 허무주의에 빠진 이들을 교묘히 이용하기 위한, 어떠한 로봇의 일은 계속될 것입니다."
