 COU_empty_of_monarchs:0 "National Resistance Front"
 COU_empty_of_monarchs_desc:0 "While the vast majority of the Dutch and Belgian armies abandoned their homelands and fled, not everyone did. Whether forced by the King or ordered to stay behind, the officers remaining in the Low Countries incite the locals to hinder cooperation with us and cause confusion in administration."
