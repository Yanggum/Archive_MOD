 COU_autonomous_legislation: "Sovereignty Law"
 COU_autonomous_legislation_desc: "Having gained the upper hand in the power struggle, we were able to place Yuragi Momoka in the position of Emergency Measures Chairperson, and we gained the opportunity to establish the institutional foundation for the autonomy we previously promised the locals. Through this, we can further solidify our support base."
 COU_neutralize_kaya_clique: "Neutralizing the Defense Office"
 COU_neutralize_kaya_clique_desc: "The Defense Office, a gathering of insidious fascist imperialists, immediately launched a resistance as soon as the Sovereignty Law took effect. We must neutralize the Defense Office for the sake of reform."
 COU_inclusion_of_union_in_administrative_committee: "Introduction of Workers' Council"
 COU_inclusion_of_union_in_administrative_committee_desc: "According to the advice of several human advisors, reform can never be achieved by an individual. We will achieve reform by introducing a Workers' Council composed of locals into the Administrative Committee to ensure harmony with the locals and fulfill our promise of autonomy."
 COU_logistics_control_of_student_council: "Recognition of Administrative Committee Authority"
 COU_logistics_control_of_student_council_desc: "Momoka has proven her worth as the Reform Chairperson and Measures Chairperson. She should no longer be seen as a 'Cinderella' at risk of expulsion without Rin's protection, but as a proud member of the Administrative Committee whose authority must be recognized."
 COU_resignation_of_acting_authority: "Resignation of Measures Chairperson"
 COU_resignation_of_acting_authority_desc: "Yuragi Momoka has no intention of holding this position for long. Now that the safety of the Transportation Office and the risk of her own expulsion have been settled, she will resign from the position."

