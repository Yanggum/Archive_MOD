l_english:
 COU_question_about_acting_authority: "Vigilance Against Left-Wing Shift"
 COU_question_about_acting_authority_desc: "Some members of the Administrative Committee hold a negative view of current Transportation Chief Yuragi Momoka's leanings. There is a suspicion that, amidst the chaos of the General Student Council President's disappearance, the Transportation Chief is plotting a grand conspiracy to dismantle the Kivotos Student Council itself by colluding with the locals."
 #COU_martial_measures: "Emergency Martial Law"
 #COU_martial_measures_desc: "Due to the continuous unrest among students caused by the preceding chaos, the Emergency Measures Committee has decided to declare emergency martial law in the Kivotos Central District as of this hour."
 COU_crackdown_on_anti_kivotos_activities: "Crackdown on Anti-Kivotos Activities"
 COU_crackdown_on_anti_kivotos_activities_desc: "Many among the local factions still harbor hostility toward our transference and the subsequent collapse of their local governments. We must suppress these factions to contribute to the stabilization of the region."
 COU_political_intervention_of_SRT: "Contacting SRT"
 COU_political_intervention_of_SRT_desc: "Opinions have been raised that, upon implementing martial law, we should contact SRT Special Academy—the special forces under our General Student Council—to handle local security in place of Valkyrie Police Academy, which is currently understaffed due to the Great Transference."
 COU_expedited_administrative_processing: "Expedited Administrative Processing"
 COU_expedited_administrative_processing_desc: "We are currently experiencing various forms of chaos due to administrative paralysis. To resolve this quickly, we have decided to prioritize the restoration of administrative functions."
 COU_opening_of_local_culture: "Opening to Local Culture"
 COU_opening_of_local_culture_desc: "While there may be some unrest among the students, the opinion has been raised that we must first understand the culture of the local factions to secure their cooperation. This may prove sufficiently beneficial to us."
 COU_expansion_of_autonomy: "Guarantee of Autonomy"
 COU_expansion_of_autonomy_desc: "We are unwelcome outsiders and appear as nothing more than invaders to the locals. We must first lower their grievances by guaranteeing them a degree of autonomy."
 COU_establishment_of_human_rights_committee: "Establishment of the Human Rights Protection Office"
 COU_establishment_of_human_rights_committee_desc: "It is said that the nation of \"Germany,\" where Gehenna and Trinity were located, once specified individual rights through a law called the Weimar Constitution. Utilizing this, let us establish a Human Rights Protection Office so that individuals—whether students or locals—can enjoy the basic rights they deserve. The Chief of the Human Rights Protection Office will be the only 'local' chief in the General Student Council!"
 COU_focus_add_state_core_nord_fadcale: "Guarantee of French Autonomy"
 COU_focus_add_state_core_nord_fadcale_desc: "After the unilateral intervention of the French garrison in Nord-Pas-de-Calais, the region became our territory, yet the French residents there have not been granted proper autonomy. Now that we are accommodating the Dutch and the Belgians, adding the French will not change much."
 COU_focus_reestablish_srt: "Re-discussing the Treatment of SRT"
 COU_focus_reestablish_srt_desc: "While SRT is currently detained in the Valkyrie Correctional Bureau, they are exceptionally talented individuals who must find their proper place once more."
 COU_flag_fucking_srt:0 "§RDisturbances caused by SRT§! have occurred."
 COU_union_negotiation: "Establishment of the Labor Committee"
 COU_union_negotiation_desc: "For the locals who assist us, we must establish a Labor Committee to listen to their voices."
 COU_infrastructure_restoration: "Infrastructure Restoration"
 COU_infrastructure_restoration_desc: "The railway network of this other world to which we have transferred has significant issues that differ from the railway network of Kivotos. We need to improve this, at least in part."
 COU_strengthening_of_valkyrie_authority: "Strengthening of Valkyrie Authority"
 COU_strengthening_of_valkyrie_authority_desc: "Given the current situation, we must strengthen the authority of the Valkyrie Police Academy and lift restrictions regarding the use of weapons and other constraints."
 COU_vertical_integration: "Vertical Integration"
 COU_vertical_integration_desc: "While there may be some complaints, for the sake of efficiency, we can combine various companies along the vertical line of production to lower costs and recycle surplus factories."
 COU_reorganization_of_administrative_committee: "Departmental Merger"
 COU_reorganization_of_administrative_committee_desc: "By merging departments with similar roles, we will be able to handle our administrative tasks more smoothly."
 COU_restructuring_of_defense_office: "Defense Office Restructuring"
 COU_restructuring_of_defense_office_desc: "We will restructure the Defense Office to deploy students to the right places where they are needed."
 COU_normalization_of_administration: "Administrative Normalization"
 COU_normalization_of_administration_desc: "Through various efforts, the administrative system is being normalized, and now only the final task remains. We have seized the initiative in the power struggle, and the General Student Council is now ready to move forward.\n\n§gSince we can never truly understand each other, can we understand ourselves through that very lack of understanding?§!"
 COU_normalization_of_administration_tt: "While §YShiranui Kaya§!, the linchpin of the current §YPower Struggle§!, has not ended the conflict with the opposition, she has succeeded in reaching an agreement regarding the opposition to §YSchale§!."
 
