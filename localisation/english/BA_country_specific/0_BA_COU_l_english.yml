 COU_no_communism_movement: "Defense Office Resistance"
 COU_no_communism_movement_desc: "Since the Sovereignty Law passed in the General Student Council, Kaya and the Defense Office have openly declared a 'rebellion,' vowing to prevent Earth's communism from encroaching upon the General Student Council."
 COU_autonomous_legislation_idea: "Sovereignty Law"
 COU_autonomous_legislation_idea_desc: "The Law Concerning the Autonomy of Locals, abbreviated as the Sovereignty Law, was created based on the fact that the citizens of Europe completely lost their sovereignty after the two worlds collided in the Great Transference. This law contains broad rights to autonomy to guarantee a level of sovereignty similar to that before the Great Transference."
 COU_socialist_world_republic_idea: "Socialist World Republic"
 COU_socialist_world_republic_idea_desc: "As the nation leading the global socialist movement, it is a massive ideological group that exposes labor issues worldwide and supports revolution. They will advance until labor across the globe, beyond the small land of Kivotos, is liberated."
