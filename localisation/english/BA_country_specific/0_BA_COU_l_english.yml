 ##focus 
 COU_focus_in_the_darkness: "어둠 속에서 도사리며"
 COU_focus_in_the_darkness_desc: "..."
 COU_focus_remove_the_line: "린 불신임"
 COU_focus_remove_the_line_desc: "[COU.COU_RIN.GetName]은 총학생회를 이끌 자질이 되지 않습니다. 끝도 없이 유악한 그녀는 마음에 들지 않습니다. 린이 총학생회장 대행의 권위를 내세워 임원들을 굴복시킨다면 좀 더 일을 쉽게 처리하실 수 있으실 텐데. 그런데 그러하지 못하시지 않습니까? 대행의 권위는, 마땅히 [COU.COU_KAYA.GetName]에게 주어져야 합니다."
 COU_tooltip_kaya_started_game: "나약해빠진 §Y[COU.COU_RIN.GetName]§!의 §G탄핵을 위한 여정§!이 시작됩니다.\n§R그러나 명심해야 할 것은, 린 또한 이에 대응해 카야를 탄핵하기 위해 행동할 것이라는 점입니다.§!"
 COU_focus_arrest_momoka: "교통실 설득"
 COU_focus_arrest_momoka_desc: "명란맛 과자나 까먹는 머저리 [COU.COU_MOMOKA.Getname]는 교통실장으로서 린에게 충성합니다. 이러한 상황 속에서 카야는 친히 그녀를 찾아가 린 탄핵에 대한 찬성을 받아내고자 합니다."
 COU_focus_arrest_ayumu: "조정실 설득"
 COU_focus_arrest_ayumu_desc: "일을 빨리 하는 것 말고는 할 줄 아는 것이 하나도 없는 머저리 [COU.COU_AYUMU.Getname]는 조정실장으로서 린에게 충성합니다. 이러한 상황 속에서 카야는 친히 그녀를 찾아가 린 탄핵에 대한 찬성을 받아내고자 합니다."
 COU_focus_recruit_minori: "전문 시위대 동원"
 COU_focus_recruit_minori_desc: "붉은겨울 연방학원 출신의 인재자원실장은 시라누이 카야에게 린을 반대하는 시위대의 존재는 그의 권력을 위협하는데 큰 기여를 할 것이라며 '전문 시위꾼'들의 고용을 제안했습니다. 하지 않을 이유가 있습니까?"
 COU_tooltip_srt_gonna_make_shit:0 "§g붉은겨울 연방학원 출신의 고용된 시위대가 린의 반대 시위를 벌일 것입니다.§! §R정말, 재미있겠지 않습니까?§!" 
 COU_focus_treaty_of_amsterdam: "디츨란드법"
 COU_focus_treaty_of_amsterdam_desc: "카야는 지속적인 네덜란드와 벨기에의 저항군들을 진정시키기 위해, 협력자들을 이용한 '디츨란트법'의 제정을 제안했습니다. 이는 상당히 유용한 제안일 것입니다."
 COU_focus_unarrest_mussert: "헤이턴 석방"
 COU_focus_unarrest_mussert_desc: "알프러트 헤이턴은 흑색전선을 장악한 거대한 정치적인 거물입니다. 헤이턴과 흑색전선은 막대한 영향력을 사회 전반에 끼치며, 흑색전선과 협력한다면 카야는 손쉽게 (아마도) 총학생회장 자리를 차지할 수 있을 것입니다."
 COU_focus_contact_with_flandern: "드그렐과 접촉"
 COU_focus_contact_with_flandern_desc: "플란데런과 왈로니의 충성스러운 파시스트들은 지배자들로부터 저항하며 애씁니다. 카야는 이들의 대표적인 수장인 레옹 드그렐과 접촉하여 플란데런의 하이랜더와 크로노스 스쿨을 장악할 계획을 한 가지 세웠습니다."
 COU_focus_the_shutup: "침묵"
 COU_focus_the_shutup_desc: "모든 준비가 끝났습니다. 그리고 항상 큰 일이 오기 전엔, 항상 조용한 법이죠..."
 COU_tooltip_letsgo_anti_rin_plans:0 "§Y린 탄핵안 제출 디시전§!이 활성화됩니다."
 COU_tooltip_percent_back:0 "§Y대중의 탄핵 지지도§!가 §Y80§! 이상임."
 COU_tooltip_all_agreed_tanhak:0 "§Y3명의 실장§!이 §G탄핵안에 찬성§!함."
 COU_focus_the_new_gscp: "총학생회장의 귀환"
 COU_focus_the_new_gscp_desc: "기존 총학생회장은 어디론가 사라져 영원히 돌아오지 않을 것임이 분명함에 따라 실장들은 카야를 새로운 총학생회장으로서 추대하기로 결정했습니다. 시라누이 카야는 새로운 총학생회장으로서 키보토스에서 총학생회장이 돌아왔다는 것을 마땅히 증명해보일 것입니다."
 COU_focus_get_masterkey_from_arona:0 "싯딤의 상자로부터의 증명"
 COU_focus_get_masterkey_from_arona_desc:0 "개탄스럽게도 싯딤의 상자, 즉 아로나는 카야를 새로운 총학생회장으로는 적절치 않다고 판단하여 카야 총학생회장의 정통성을 지속적으로 위협하고 있으므로, 하루빨리 그녀와 대면하는 편이 옳을 것입니다."
 COU_focus_let_be_the_queen:0 "네덜란드 왕국의 부활"
 COU_focus_let_be_the_queen_desc:0 "네덜란드 왕국은 대전이 당시 빌헬미나와 오라녜-나사우계가 SRT에 의해 모조리 말살당하면서 사실상 멸망했으나, 현지인들과의 협력과 조화의 결과로 네덜란드 왕국의 부활을 카야는 결정했습니다."
 COU_focus_use_the_news:0 "크로노스 스쿨 장악"
 COU_focus_use_the_news_desc:0 "크로노스 스쿨은 키보토스 전역의 중요한 방송국으로서 수많은 지방 방송국들보다는 크로노스 스쿨 단 하나가 키보토스에서는 큰 영향력을 행사하므로, 마땅히 우리는 크로노스 스쿨을 장악할 것입니다."
 COU_focus_your_last_party:0 "마지막 연회"
 COU_focus_your_last_party_desc:0 "총학생회장과 초인으로서 거듭날 마지막 절차가 시작되었습니다. 바로 시건방진 협력자들의 완전한 제거입니다. 네, 배신이라고요? 아뇨. 배신은, 협력자들이 D.U.가 불길에 휩싸였을때도 멀쩡한 척, 아무런 일도 없던 척 행동했을 때부터 먼저 저질렀습니다. 적절한 보답일 뿐입니다. 자, 그럼 즐기십시오, 당신네들의 마지막 연회를."
 COU_tooltip_may_be_load_auto:0 "§g이 중점은 자동으로 진행될 것입니다.§!"
 COU_focus_sasang_nugak:0 "사상누각"
 COU_focus_sasang_nugak_desc:0 "결국 모두가 배신자들이었습니다. 결국엔 드러났습니다. 카야의 곁에는 사탕발림하는 잡것들과 카야의 등 뒤를 노리는 믿을 수 없는 자들밖에 없음이!"
 COU_focus_checks_the_valkirie:0 "작전명: 발키리"
 COU_focus_checks_the_valkirie_desc:0 "발키리 경찰학교는 불충스럽습니다. 단순한 항명부터 통제 거부까지, 카야 총학생회장이 취임한 직후 벌어진 일들입니다. 그녀들의 싸가지를 단단히 고쳐 주어야 합니다."
 COU_focus_learn_about_fascism:0 "이념에 대한 수업"
 COU_focus_learn_about_fascism_desc:0 "카야는 형식상으로나마 권력을 위해 유럽 반동주의와 파시즘의 보호자 역할을 자처하고는 있지만 사실 카야는 파시즘이 뭔지 정확히 알지조차도 못하고, 알고 싶어하지도 않았습니다만, 지금은 그런 것을 가릴 상황이 아닙니다..."
 COU_focus_yaksok_for_srt:0 "약속 이행"
 COU_focus_yaksok_for_srt_desc:0 "SRT는 카야 총학생회장 취임 직후부터 꾸준히 \"약속\"을 지켜 달라고 요구하고 있습니다. 뭐, 계속 들어주기도 귀찮으니, 적당한 변방에 던져나 놓죠?"
 COU_focus_exclude_about_rin:0 "수석 행정관 용서"
 COU_focus_exclude_about_rin_desc:0 "수석 행정관은 공식적으로 두가지의 혐의로 구금되어 있습니다. 첫번째- 무단 권력 탈취, 두번째- 실장 권한 월권 행위. 하지만 분명 린 행정관은 유능합니다. 카야는 자신의 업무를 린에게 일부 넘겨 과로를 해결할 수 있을 지도 모릅니다."
 COU_focus_COU_open_the_music:0 "관심 돌리기"
 COU_focus_COU_open_the_music_desc:0 "네덜란드인, 벨기에인, 프랑스인, 키보토스인 모두 대전이 이후 제대로 된 음악을 즐기지 못해 불만이 큽니다. 일단 그놈들을 정치에 대해 관심을 떼게 만들려면, 적절한 유흥거리가 필요한 법입니다."
 
 COU_focus_road_to_the_choin:0 "초인으로 가는 길"
 COU_focus_road_to_the_choin_desc:0 "초인은, 결코 도움을 받아서 되는 이가 아닙니다. 총학생회장이 홀로서 초인이 되었듯이, 카야 또한 홀로서 초인이 되어야 합니다."
 COU_focus_get_some_helps_ok:0 "거짓된 손길 뿌리치기"
 COU_focus_get_some_helps_ok_desc:0 "카야가 초인이 되는 데 다른 이들의 도움은 필요 없습니다. 오히려 내미는 도움의 손길이야말로 거짓된 손길입니다."
 COU_focus_the_flemish_question:0 "사자와 닭"
 COU_focus_the_flemish_question_desc:0 "네덜란드와 플란데런은 오랫동안 네덜란드계의 정체성과 '새로운' 벨기에계의 정체성에서 휘둘리며 네덜란드계가 지배하다시피 했으나, 이러한 분쟁을 잘 이용한다면, 카야는 큰 이익을 볼 수 있을 것입니다."
 COU_focus_the_dog_of_flanders:0 "플란데런의 개"
 COU_focus_the_dog_of_flanders_desc:0 "네덜란드인들은 플란데런의 개새끼들마냥 목줄을 죄였다가, 풀어주는, 동물다운 통제법이 필요합니다. 그렇지 않으면, 미친 개새끼마냥 온 동네를 싸돌아다니면서 카야 총학생회장을 망쳐 놓을 것임이 분명합니다!"
 COU_focus_COU_get_some_break:0 "쉬는 시간 가지기"
 COU_focus_COU_get_some_break_desc:0 "잠시 업무는 그만두고 쉬어야 할 때입니다. 너무 열심히 일했습니다. 네? 아, 아뇨. 총학생회장 말고, 불충한 네덜란드인들 이야기입니다. 그들은 너무나 눈에 밟히는 행동들을 지속적으로 벌여 왔습니다. 뭐, 그들 스스로 쉬지 않겠다면, 강제로더라도 쉬는 시간을 주어야죠."
 COU_focus_COU_shutup:0 "아가리 싸닥쳐!"
 COU_focus_COU_shutup_desc:0 "\"하아... 제가 몇번을 이야기해야 하나요? 저는 네덜란드 민족주의 같는 거 전혀 신경쓰지 않습니다. 그게 무엇인지도 모르고요. 당신네들이 무언가 착각하신 모양인데...\"\n\n\"저는 당신네들의 편리한 장난감이 아닙니다.\""
 COU_focus_the_aoi_question:0 "갖은자부터 꼼꼼히"
 COU_focus_the_aoi_question_desc:0 "총학생회를 완전히 장악한 카야지만, 재무실의 영향력은 결코 꺾이지 않습니다. 조금 껄끄러울 수는 있어도, 재무실장의 말을 잘 듣는 편이, 카야에게 유익할 것입니다."
 COU_focus_fate_of_arona:0 "총학생회장의 유산"
 COU_focus_fate_of_arona_desc:0 "\"초인\" 이라는 것은, 본디 전임 총학생회장을 지칭하는 말로서 훨씬 더 적합했습니다. 그러한 그녀는, 도대체 어떻게 \"초인\" 이 될 수 있었던 것일까요? 하지만 그러한 \"초인\" 도, 결국엔 가혹한 현실로부터 도망쳐야만 했던 이유는 무엇일까요?"
 COU_focus_the_last_fate:0 "잊혀진 죄악"
 COU_focus_the_last_fate_desc:0 "'잊혀진 죄악'이란 카야가 총학생회를 통제하며 놓쳤던 죄악들을 의미합니다. 이제는 그것들을 바로잡을 때가 되었습니다."
 COU_focus_COU_rework_srt:0 "SRT 전면재교육"
 COU_focus_COU_rework_srt_desc:0 "물러터진 SRT 소대원들을 재교육시킬 시간입니다. '총학생회장의 무력 수단' 이었던 SRT를, 다시 한번 옛날의 그때처럼, 돌려보낼 시간입니다. 더 이상의 휴식은 없습니다."
 COU_focus_COU_dont_make_mistake:0 "실수하지 않기"
 COU_focus_COU_dont_make_mistake_desc:0 "카야는 그동안 너무 많이 실수해 왔습니다. 행정위원회는 카야의 손바닥 위에서 놀아나야만 함이 명백한 운명임이 드러났고, 즉시 실행해야 합니다."
 COU_focus_the_whispers:0 "속삭임"
 COU_focus_the_whispers_desc:0 "작은 속삭임은 떠다니는 흔한 가십거리가 됩니다. 그리고 그 가십거리는 소문이 되고, 그 소문은 큰 스캔들을 일으킵니다. 카야가 무슨 짓을 하던 결코 그것이 새어 나가서는 안됩니다. 카야의 안위를 위해서라도..."
 COU_focus_the_evolve:0 "진화"
 COU_focus_the_evolve_desc:0 "이제는 때가 되었습니다. 애벌레가 나비가 되기 위한 투쟁에서 그랬던 것처럼, 새싹이 돋아나고자 비바람과 거친 혈투를 거친 것처럼, 카야 총학생회장은 \"살아남기 위한 투쟁\" 에서 승리해야 합니다. 이제는, 깨어날 때가 되었습니다. 단순히 권력은 쥐는 것만이 문제가 아닙니다. 사용할 줄 아는 이가, 천년을 지배합니다."
 
 COU_focus_lets_get_some_help:0 "공허"
 COU_focus_lets_get_some_help_desc:0 "결국은 아무런 의미가 없습니다. 카야가 무언가 하고자 발악할 때마다, 점차 멀어져만 가는 현실, 저 너머엔, 공허밖에 없습니다."
 COU_focus_the_meet:0 "만남"
 COU_focus_the_meet_desc:0 "카야는 통치를 원할히 할 몇 명의 사람들을 총학생회에 들임으로서 내적인 부담을 줄이고 마땅히 누려야 할 권력을 누릴 것입니다."
 COU_focus_COU_black_front:0 "흑색전선 강화"
 COU_focus_COU_black_front_desc:0 "헤이턴과 흑색전선은 유능합니다. 그들을 잘 활용한다면 카야의 통치에 이바지하고 공허에서 더 멀어질 수도 있을지도, 모릅니다."
 

