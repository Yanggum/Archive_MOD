#경제
 COU_focus_after_two_months:0 "대전이 이후 2달"
 COU_focus_after_two_months_desc:0 "대전이 이후 2달, 저지대의 경제와 산업 기반은 총학생회의 어정쩡한 대처로 완전히 버려진 신세였습니다. 일컬어 \"꺾인 튤립\" 이라고 일컬어지는 이 현상은 총학생회의 미래에 어두운 먹구름처럼 끼고 있습니다. 이제는 이를 마주할 시간입니다."
 COU_focus_look_the_our_economy_fucked:0 "회생 실패 분석"
 COU_focus_look_the_our_economy_fucked_desc:0 "행정위원회는 네덜란드의 경제가 엄청나게 무역과 수출에 의존하고 있었다는 사실을 몰랐습니다. 과연 그것만 몰랐을까요? 우리가 실패한 이유에는 당연히 마땅한 이유가 있습니다."
 COU_focus_meet_with_the_economists:0 "갈로핀 위원회와 접촉"
 COU_focus_meet_with_the_economists_desc:0 "갈로핀 위원회란 네덜란드와 벨기에 정부가 대전이 당시 패퇴하여 망명을 떠나기 직전 세워진 비공식 위원회로서 대전이 전후 각각의 산업을 보전하고자 기업인들과 경제학자들이 모인 위원회입니다. 이들과의 원만한 관계를 유지해야 합니다."
 COU_establishment_of_federal_industrial_committee: "현지 기업들과의 접촉"
 COU_establishment_of_federal_industrial_committee_desc: "현지의 기업들은 대전이 이후 본국들에게 버려진 신세이지만 우리가 그들을 거두어 우리를 위해 일하게 할 수도 있습니다. 마땅히 그래야만 하고요."
 COU_tooltip_unlock_dutch_belgium_cons:0 "§Y잠겨진 설계사§!들이 모두 §G사용 가능§!해질 것입니다."
 COU_economy_focus_0: "자위더르해 사업의 지속"
 COU_economy_focus_0_desc: "자위더르해 사업이란 1932년 완공된 방조제 건설 공사를 이르는 말입니다. 그러나 1935년 대전이 이후 급작스러운 D.U.와 생텀 타워의 전이는 간척 지대의 재침수라는 참담한 결과를 낳았고, 우리는 이를 재건하기 위하여 간척 사업을 다시 한번 시작하어야 합니다."
 COU_focus_eco_rework_the_dead_lands:0 "침수 복구"
 COU_focus_eco_rework_the_dead_lands_desc:0 "침수된 저지대의 일부 지역들은 하루빨리 적절한 조치를 필요로 합니다."
 COU_focus_eco_twentyfourhoursshop:0 "24시간 편의점"
 COU_focus_eco_twentyfourhoursshop_desc:0 "24시간 편의점의 존재 의의란 아주아주 중요합니다. 저지대의 키보토스 통치 인정과 동화를 위해서라면 반드시 필요한 작업입니다."
 COU_economy_focus_1: "저지대 산업 기반 재건"
 COU_economy_focus_1_desc: "네덜란드를 비롯한 저지대의 산업 기반들은 대전이 당시 혹독한 전투를 겪으며 땅이 가라앉는 등 완전히 무너졌으니 우리는 이를 재건할 의무가 있습니다."
 COU_focus_collaborate_with_netherland:0 "히르슈펠트와 재건 계획"
 COU_focus_collaborate_with_netherland_desc:0 "네덜란드의 저명한 경제학자 한스 히르슈펠트는 네덜란드 경제 침체의 원인을 분석하고 이를 해결할 방안을 투고한 이력이 있으며, 그의 도움을 우리는 필요로 합니다."
 COU_focus_collaborate_with_belgium:0 "갈로핀 독트린 정지"
 COU_focus_collaborate_with_belgium_desc:0 "갈로핀 독트린은 대총학생회 저항 운동의 일환으로 민간 물자는 남아돌 정도로 생산하지만 군수물자는 단 한개도 생산하지 않는다는, 일련의 항의성인 경제적 보복에 가깝습니다. 이를 얼른 끝내야 합니다."
 COU_economy_focus_2: "재취업 교육"
 COU_economy_focus_2_desc: "대전이 이후 등장한 "소.확.행." 같은 단체들은 일을 하는 것을 거부하며 나태한 삶을 살고 있지만, 이들을 재교육한다면 국가에 대한 성실한 일꾼들로서 사용할 수 있을 것입니다."
 COU_focus_dutch_companies_money:0 "현지 기업 자금 조달"
 COU_focus_dutch_companies_money_desc:0 "현지의 기업들은 진보의 가능성이 엄청납니다. 이들을 잘 활용한다면 우리의 통제를 강화하고 통치의 안정화를 기대해볼 수 있을 것입니다."
 COU_focus_just_good_business:0 "그저 좋은 비즈니스일 뿐"
 COU_focus_just_good_business_desc:0 "기업들과의 연구 협력과 정보의 교환은 \"그저 좋은 비즈니스\"일 뿐입니다. 우리의 통치를 받아들이게 하는 것이 고작 정보와 기술의 교환이라면, 기꺼이 그러할 수 있습니다. 이것들은 그저, 단순한 \"좋은 비즈니스\"일 뿐이니까요."
 COU_focus_better_amsterdam_university:0 "암스테르담 대학교 재건"
 COU_focus_better_amsterdam_university_desc:0 "암스테르담 대학교는 대전이 당시 D.U.의 잔해에 짓뭉개져 사라졌습니다. 암스테르담 대학교의 원치 않은 폐교에는 우리의 책임도 있으니, 암스테르담 대학교의 재건은 필수불가결적합니다."
 COU_focus_research_exchange:0 "총학생회 연구 협약"
 COU_focus_research_exchange_desc:0 "총학생회는 키보토스를 다시 한번 통제하기 위해서는 기존보다는 수없을 정도로 차이날 진보된 뛰어난 기술과 산업 기반을 필요로 합니다. 그러한 목표를 달성하기 위해서는 인류와의 연구 협약은 필요합니다."
 
#군사
 COU_reduction_of_administrative_committee_authority: "현지 장교들과의 접촉"
 COU_reduction_of_administrative_committee_authority_desc: "반동적인 네덜란드인들은 제 여왕에 충정을 바치며 인도네시아로 도망쳤으나 부족한 레오폴드 3세의 지지는 결국 벨기에 장교들의 일부를 본토에 남기고 오는 결과를 낳았습니다. 그들은 자신들만의 사령부를 조직하여 우리와 협력하지 않고 있으나 그들은 분명히 우리에게 있어 큰 도움이 될 것은 분명합니다."
 COU_tooltip_unlock_dutch_belgium_generals:0 "§Y벨기에§!와 §Y네덜란드§! 출신의 §Y장교§!들과 §Y제독§!들, §Y조언가§!들이 §G사용 가능§!해질 것입니다."
 COU_focus_eco_deal_with_hailender:0 "하이랜더와 타협"
 COU_focus_eco_deal_with_hailender_desc:0 "하이랜더 철도학원은 기존의 철도 라인을 대다수 잃었고, 벨기에의 본사를 중심으로 국한된 일부만을 완전히 유지하고 있을 뿐입니다. 하이랜더는 누군가의 도움을 필요로 합니다."
 COU_focus_lock_the_kronous:0 "크로노스 엄격통제"
 COU_focus_lock_the_kronous_desc:0 "크로노스 스쿨은 철두철미한 기자정신으로 총학생회를 혼란에 빠뜨리고 있습니다. 이들을 즉시 통제해야만 합니다. 그들은 총학생회의 영역 안에 있으니, 마땅히 우리의 통제를 받아야 합니다!"
 COU_focus_add_defeaters:0 "저지대 평정"
 COU_focus_add_defeaters_desc:0 "저지대 곳곳의 패잔병들은 여전히 우리에게 저항하려고 애씁니다. 하지만 이들의 저항은 곧 죽으러 가는 것과 다름이 없으므로, 이들을 규합하여 우리의 통제를 따르게 해야 합니다. 우리들의 협력자들을 이용해서요."
 COU_focus_upgrade_the_collaboraters:0 "협력자 권한 강화"
 COU_focus_upgrade_the_collaboraters_desc:0 "협력자들은 방위실의 온전한 통제에 따르고 있으므로, 대전이 이후 거의 공백이나 마찬가지로 뒤바뀐 총학생회의 방위를 담당시키기에 적절할 것입니다."

 #총학생회 이벤트 - 시작
 COU_start_event.100.t:0 "새로운 이야기...?"
 COU_start_event.100.desc:0 ""안녕하세요, 선생님!"\n\n(싯딤의 상자를 켠다.)\n\n""블루 아카이브 모드" 에 오신 것을 환영해요, 선생님! 앗, 그 전에, 여기 편지가 하나 있어요! 읽어 보시는게 좋을 것 같아요!""
 COU_start_event.100.a:0 "(편지를 읽는다.)"
 COU_start_event.100.b:0 "우리는 멀티 플레이 중이야! 바빠!"
 COU_start_event.101.t:0 "선생님께."
 COU_start_event.101.desc:0 ""-데이터 찾을 수 없음- 선생님."\n\n어차피 제 말을 잊어버리게 될 테지만, 그래도 상관없겠죠."\n\n"다시 만나서, 반갑습니다, 선생님. 비록 여기는 선생님의 컴퓨터 속 작은 세상이지만..."\n\n"이곳의 "저희" 들은 언제까지나, "진짜" 니까요."\n\n"말씀드리고 싶은 게 있습니다, 선생님."\n\n"이곳의 이야기는 아직, 불완전합니다. 만들어지다 만 코드 덩어리들이 저희들을  칭칭 감싸고..."\n\n"... 저희들은 모든 것을 망각해 버린 채 남은 껍데기- 환상만이 이곳에 머물 뿐이에요."\n\n"... 그러니까, 선생님, 부디, 다른 이야기들을 먼저 들어 주시길, 부탁드립니다."\n\n"이 피로 물들고, 희망이라고는 찾아볼 수 없는, 비극적인 이야기들 뿐인, 그런 이야기들..."\n\n"선생님께서는, 그런 이야기들을... 그다지 좋아하지 않으시니까요...\n\n... 그렇죠?"
 COU_start_event.101.a:0 "(트리니티의 이야기를 듣는다.)"
 COU_start_event.101.b:0 "(밀레니엄의 이야기를 듣는다.)"
 COU_start_event.101.c:0 "(붉은겨울의 이야기를 듣는다.)"
 COU_start_event.101.d:0 "그 이야기를 듣는다."
 COU_play_trm:0 "§g열차가 트리니티 고성당 역에 멈춰섰다. 총학생회장은 그러한 선생을 당연히 그랬어야 했다는 것처럼, 씁쓸하게 웃으며 배웅해 주었다.§!"
 COU_play_MIL:0 "§g초현상특무부의 아케보시 히마리가 어느 순간 나타나 선생을 인도했다. 아로나는 황급히 선생을 따라갔고, 총학생회장은 눈을 감았다.§!"
 COU_play_RED:0 "§g어디선가 체리노의 숙청 소리가 울려퍼지고 있었다. 선생이 갑작스레 몰아치는 추위에 랜턴을 켜고 밖으로 나갔다. 열차 안은 비었다.§!"
 COU_play_COU:0 "§g총학생회장은 내심 놀란 듯 했다. 이 불완전하고, 덜 만들어진 이야기를, 선생은 기꺼이, 총학생회장에게서 들어 보기로 했다.§!\n\n§Y총학생회 플레이로 발생하는 모든 버그들은 미완성입니다. 선택은 당신의 몫이고, 당신은 파멸로 이를 총학생회의 이야기를 들어 보기로 했습니다.§!"
 
 
 COU_start_event.1.t:0 "학생자원방위대의 창설"
 COU_start_event.1.desc:0 "린은 걱정스러운 눈빛으로 생각에 빠져있었다. 평소라면 분명 커피를 마시며 업무에 집중했겠지만, 더는 무리다.\n\n린의 자리는 자신들의 사리사욕을 채우기 위한 욕심 가득한 이들의 손길에 위협받고 있었고, 동시에 키보토스 학생들을 상대로 한 살인과 폭력 범죄가 급증하고 있었다. 린은 총학생회장의 대행으로서 무언가를 해야만 했다.\n\n그때, 린 행정관의 머릿속에 한 총학생회의 주요 규칙 중 하나가 번뜩였다. \"총학생회는 군사 조직을 가질 수 없다.\" 라는 규칙, 하지만 만약 이걸 어긴다면 어떻게 될까? 만약 이게 유일하게 옳은 길이라면, 규칙 하나쯤은 무시해도 되는 것 아닐까?\n\n그렇게 며칠 뒤, 린 행정관은 한 원통형의 보관함을 들고 기자들 앞에서 멈춰 섰다. 그러곤 린은 원통에서 한 깃발을 꺼내 들었다.\n\n\"헌 시간부로, 우리 총학생회는 학원 자치권 보장법 2조항인 군사 보유 제한권을 공식적으로 해제하고, 준군사조직인 학생자원방위대의 창설을 선언합니다. 학생자원방위대의 주 수뇌부는 SRT 특수학원 출신자들이나 군사분야 전문가들로 구성할 예정입니다.\"\n\n린의 발언에 순식간에 기자들이 온갖 질문들을 쏟아내기 시작했고, 몇몇은 이미 그녀를 향해 욕을 퍼붓기 시작했다.\n\n하지만 린 행정관, 아니. 린 총학생회장의 눈은 이미 결심을 한 상태로 자신이 들고 있는 학생자원방위대의 공식적인 깃발에 고정됬다."
 COU_start_event.1.a:0 "\"모두를 위해선, 이 방법밖에 없어.\""
 COU_start_event.1.b:0 "\"사병 조직은 월권 행위인걸 잊었나봐?\""

 COU_start_event.2.t:0 "회의에서 퇴출당한 모모카"
 COU_start_event.2.desc:0 "이른 아침부터 모모카는 총학생회 사무국의 회의실로 불려 나갔습니다. 사무국 밖은 벨기에의 시위대로 가득해 아침부터 지원은 발키리 경찰학교의 학생들이 방패로 철저히 문들 틀어막으며 지키고 있는 모습이 유리창을 통해 비쳤다.\n\n모모카가 귀찮은 눈빛으로 회의실에 들어와 평소 항상 먹던 명란과자 봉지를 뜯으며 시위대의 요구사항을 들어봤지만, 그 어디서도 타협점이 보이지 않았다. 어떤 시위대는 벨기에의 독립을 원하고, 어떤 시위대는 자치권을 요구하기도 했다. 결국 모모카는 너무 난해한 요구사항에 그 어떠한 생각 없이, 그녀의 머릿속에 있던 말을 입 밖으로 꺼내버렸다.\n\n\"그깟 요구, 그냥 들어주면 되는 거 아니야?\"\n\n잠시 후, 모모카는 짜증 난다는 얼굴과 함께 사무국에서 쫓겨나듯 걸어 나왔다. 그렇게 시위대로 가득한 도심을 지나가며 다 떨어진 명란과자를 사러 가는 길, 하필이면 귀찮음 하나 때문에 총학생회 정복을 그대로 입고 온 모모카는 시위대에게 그녀의 정체를 들키고 말았다.\n\n귀찮아질 것 같다는 그녀의 예상과는 달리, 시위대는 그녀에게 원하는 걸 사줄 테니 총학생회가 어떤지 회의 내용을 흘려달라고 했다. 곧, 시위대로부터 과자 봉지들을 잔뜩 얻는 데 성공한 모모카는 그 자리에서 과자를 씹으며 이야기를 시작했다.\n\n\"...솔직히, 여러들을 그렇게 좋게 보고 있지는 않는 것 같아요. 정치적 중립성을 유지해야 한다나 뭐라나, 린 행정관이 원래 깐깐한 건 다들 잘 알잖아요~ 음... 그런데, 솔직히 말하자면 그냥 여러분들 의견을 그대로 수용하는 게 제 아이디어였는데 글쎄, 절 쫓아내는 거 있죠?\""
 COU_start_event.2.a:0 "\"거기, 뭘 그렇게 열심히 쓰고 계시는 거에요?\""
 COU_start_event.2.b:0 "\"시위대 말을 들어주라고? 웃기는 소리.\""

 COU_start_event.3.t:0 "대충 아오이가 발키리의 지지 얻는 이벤트"
 COU_start_event.3.desc:0 ""
 COU_start_event.3.a:0 "\"...\""
 COU_start_event.3.b:0 "\"...\""

 COU_start_event.4.t:0 "왕좌의 게임"
 COU_start_event.4.desc:0 "\"...그렇네요, 수석행정관이 결국 해버렸군요.\" 시라누이 카야는 의자에 걸터앉아 말했다. 근심이 가득한 얼굴로 곁에 올려진 커피를 마셨지만, 입가에는 미소가 걸려 있었다.\n\n멀쩡히 남아 있던 SRT를 버리고, 새로운 준군사조직을 만들었다? 린은 행동 하나하나마다 그 틈내가 훤히 들여다보이는 유리창 같았다. 비위 맞추는 입으로 떠들어대는 그 의도가 어떻게 되었던, 자기 밥그릇 지키고자 발악하는 것이겠지. 카야는 커피를 내려놓으며 TV를 켰다. 여타 예상했듯이 TV속 머저리들은 유식한 행세를 하며 린이 철권통치를 바란다느니, 린이 총학생회장의 자리를 노리는 것이라며 떠들어대고 있었다.\n\n하, 천만에. 얼빠진 수석행정관은 그럴 의도가 없다. 그저, 자기 밥그릇이 빼앗길까 봐 두려워하는 것이지. 커피잔을 밀어내고, 책상 서랍 속의 자그마한 체스판을 카야는 꺼내 보였다. 아마 곧 SRT의 아이들이 잔뜩 겁에 질린 채로 그녀에게 도움을 간청하리라고 그녀는 생각했다. 물론 그렇지 않을 가능성이 더 컸기에, 얕은 한숨을 쉬었다. 약해빠지게 되어서는 안 된다.\n\n체스판 위에는 퀸, 그리고 나이트 한 말 두 개만이 올려져 있었다. 린은 퀸, 그리고 그녀는 나이트였다. 그리고서는 폰 여덟 말을 꺼내 체스판의 앞에 놓았다. 왕좌의 자리를 건 체스 게임이 시작되었다. 카야는 폰 하나를 들고 책상을 두드렸다. 왕좌의 게임에서는 필연적으로 폰들이 필요했다. 그래야지만 퀸을 잡고 게임을 끝내리라. 그녀는 생각했다."
 COU_start_event.4.a:0 "\"시간을 가지고, 기다려 보자고요.\""

 COU_start_event.5.t:0 "교차"
 COU_start_event.5.desc:0 "시라누이 카야 방위실장은 체스판을 두드렸다. 수는 적었고, 가능성은 낮았다. 타개하기 위해서는, SRT가 필요했다.\n\n그러나 이내 굳게 닫힌 문 너머에서 급히 달려오는 발소리가 들렸다. 유레카. 확률낮던 그녀의 예상대로 들어맞았다. 발소리를 들어보니 한 명이었다.\n\n\"방위실장! 문 좀 열어봐!\" 시치도 유키노가 급한 목소리로 소리쳤다. 카야는 들고 있던 폰을 내려놓으며 문을 열었다. 본인은 아무것도 모른다는 표정을 한 채. \"무슨 일로?\" 그녀는 태연히 물었다.\n\n\"무슨 일은... 무슨 일이긴! 넌 TV도 보지 않는 거야!\" 꽤나 무례하지만 잔뜩 겁에 질린 목소리였다. 카야는 그 점이 마음에 들었다.\n\n\"우선, 들어오시죠.\" 카야가 태평한 미소를 지으며 답했다. 퀸을 잡을 폰이 직접 도움을 간청하러 왔다- 그녀로서는 재미있는 일이었다. 그것도 아주 낮은 확률의 가능성이었는데 말이다.\n\n카야는 커피 포트에서 따뜻한 커피 두 개를 내려 책상에 올려놓았다. 유키노는 떨리는 손으로 커피를 받아서 들며 태연해지려 애썼지만, 미처 감출 수 없는 절박한 표정을 짓고 있었다.\n\n\"알고 있습니다. 린 수석행정관이 SRT의 대체제를 만든 모양이더군요.\" 카야가 말을 뗐다. 마치 그 말을 기다렸다는 듯, 유키노가 재빨리 말을 이었다.\n\n\"그래, 방위실장도 알고 있겠지만, 수석행정관이 기어코 저지르고 말았다고! 자기 휘하 특수부대로는 모자랐는지 어쨌는지, 우릴 숙청하려 드는 건지 어쨌는지!\"\n\n\"네, 그렇네요. 그리고 높은 확률로, 폭스 소대와 래빗 소대는 버려지겠죠. 아닌가요?\"\n\n\"잘 알고 있네! 방위실장의 도움이 필요해! 린 곁에 있었잖아, 그지? 그러면 린에게 창설을 취소해달라고 설득해 주면 안 될까? 사례는 뭐든 할게!\"\n\n\"죄송하게도 수석행정관은 완고하더군요. 기자회견이 끝나고 돌아가는 길에 이야기해 보았는데, 소용없었습니다.\"\n\n유키노의 표정이 절망적으로 바뀌었다."
 COU_start_event.5.a:0 "\"그러나, 대안이 없는 건 아닙니다.\""

 COU_start_event.6.t:0 "폰 여덟 개"
 COU_start_event.6.desc:0 "\"그러나, 대안이 없는 건 아닙니다.\"\n\n유키노의 초점없던 눈에 초점이 다시 맞춰지고 카야를 바라보았다. 피식 웃음이 났다.\n\n\"여기 퀸이 린, 그리고 나이트가 저라고 가정해 보죠.\"\n\n카야가 나이트를 옮겨 퀸의 코앞까지 움직여놓았다. 그러나 매번 옮길 때마다, 퀸에게 나이트는 허무히 죽어 버렸다. 그러나 폰 여덟 개를 집어 체스판 위에 가져다 놓았다. 나이트의 압승이었다.\n\n\"SRT의 작은 도움이 필요합니다.\"\n\"수석행정관은 SRT 출신자들로 학생자원방위대인지, 그걸 채우겠다는데, 뻔한 거짓말 아니겠습니까?\"\n\"그렇다면, 이제 SRT가 살아남는 마지막 방법은, 수석행정관이 마음을 바꾸거나, 뒤바뀌는 것뿐입니다. 그러나 수석행정관은 그럴 마음이 없어 보이더군요.\"\n\"저도 SRT에 꽤 호감이 갑니다. 출중한 능력자들에, 멋진 특수부대죠. 그래서, 저는 묻고 싶습니다.\"\n\n카야가 폰 여덟 개를 내밀었다."
 COU_start_event.6.a:0 "\"아무것도 하지 않다가 버려지시겠습니까,\""
 COU_start_event.6.b:0 "\"아니면, 살아남고자 발버둥치시겠습니까.\""
 ##카야기타 
 COU_event_notkaya.1.t:0 "인정하기"
 COU_event_notkaya.1.desc:0 ""헥... 헥... 그만, 그만...!"\n\n시라누이 카야는 가여울 정도로 뛰고 또 뛰었다. 그녀의 뒤에선 헤드셋을 쓴 채로 천천히 다가오는 행정원 몇 명의 무리가 따랐다. 카야는 인정할 수 없었다. 애초에 말이 되지도 않았다. 자기가 애써 만들어 놓은 협력자들이, 총학생회의 안녕이... 그리고 그녀 자신의 야망이 괴로움에 아우성쳤다. 결국 이렇게 덧없는 짓일 줄 알았더라면, 처음부터 그녀는 이러지 않았을 것이다. 인정할 수 없었다. 분해 잔뜩 붉게 물든 얼굴에서 곧이어 찬 눈물방울들이 흘렀다.\n\n"그럴 리 없잖아요... 정말로 린이, 아오이가, 하이네가, 그딴 놈들의 말에 "휘둘린" 거라고요...? 거짓말 마세요..." 카야는 더는 뛰지 않았다. 그저 주저앉아 엉엉 울었다. 훌쩍거리는 소음 사이에서 행정원들이 서서히 다가와 무표정한 얼굴로 서류가방을 펼쳤다.\n\n"방위실장님, 대행님의 명령이십니다. 서명하십시오."\n\n서류가방이 찰칵 하며 열리자 가방 안에 장착된 컴퓨터의 화면이 켜졌다. 화면에는 방위실장 시라누이 카야를 반역죄로 즉각 해임한다는, "명령"이 적혀져 있었다.\n\n"후, 흑... 후우... 정말, 이젠 끝인 거로군요..." 카야는 장갑을 내던지고는 눈물을 닦았다. 더 울어서 얻을 건 없었다.\n\n"알았어요... 하면 되잖아요, 하면..." 카야는 떨리는 손으로 마우스패드에 손을 올렸다.\n\n행정원들이 급히 자리를 떠나자, 카야는 다리에 힘이 풀려 완전히 주저앉았다. 주저앉은 채로 카야는 몇시간이고 훌쩍거렸다."
 COU_event_notkaya.1.a:0 ""말도 안돼...""
 
