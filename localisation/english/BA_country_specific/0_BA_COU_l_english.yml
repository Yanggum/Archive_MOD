 COU_strengthening_bonds_tt: "국가의 수도 주에 §G1개의 건설 슬롯§!과 §Y1개의 민간공장§! 추가."
 COU_autonomous_legislation_tt: "새로운 고문들이 사용 가능해집니다."
 COU_export_of_revolution_tt: "§Y정치 간섭§! 결정의 조건이 완화됩니다."
 COU_resolution_47_of_THIS_tt: "§G해당 국가§!들이 §Y키보토스 협력기구§!에서 추방될 것입니다."
 COU_war_deterrence_tt: "§Y키보토스 협력기구§! 국가 간의 전쟁을 금지하는 법안이 추진될 것입니다."
 COU_establishment_of_autonomous_system: "자치 제도 확립"
 COU_establishment_of_autonomous_system_desc: "권력 투쟁 속에서 승기를 잡은 우리는 유라기 모모카를 비상대책위원장 자리에 앉힐 수 있게 되었고, 이전에 현지인들에게 약속했던 자치에 대해 제도적 기반을 마련할 기회를 얻었습니다. 이를 통해 우리의 지지 기반을 더욱 다질 수 있을 것입니다."

 COU_autonomous_legislation: "주권법"
 COU_autonomous_legislation_desc: "권력 투쟁 속에서 승기를 잡은 우리는 유라기 모모카를 비상대책위원장 자리에 앉힐 수 있게 되었고, 이전에 현지인들에게 약속했던 자치에 대해 제도적 기반을 마련할 기회를 얻었습니다. 이를 통해 우리의 지지 기반을 더욱 다질 수 있을 것입니다."
 COU_neutralize_kaya_clique: "방위실 무력화"
 COU_neutralize_kaya_clique_desc: "간악한 파쇼 제국주의자들의 모임인 방위실은 주권법의 효과가 발효되자마자 즉각적인 저항에 나섰으며, 우리는 개혁을 위해서라도 방위실을 무력화시킬 필요가 있습니다."
 COU_inclusion_of_union_in_administrative_committee: "노동자 위원회 도입"
 COU_inclusion_of_union_in_administrative_committee_desc: "몇몇 인류 조언가들의 조언에 따르면, 개혁은 결코 개인에 의해 이루어질 수 없다고 합니다. 우리는 현지인들과의 조화와 그들에 대한 자치를 약속하고 개혁을 완수하기 위해 현지인들로 이루어진 노동자 위원회를 행정위원회에 도입시켜 개혁을 이룰 것입니다."
 COU_logistics_control_of_student_council: "행정위원회 권위 인정"
 COU_logistics_control_of_student_council_desc: "개혁위원장과 대책위원장의 자리에서 모모카는 제 쓸모를 증명했으며, 더는 린의 보호 없이는 추방당할 위험에 휩싸인 신데렐라가 아닌 자랑스러운 행정위원회의 일원으로서의 권위를 인정해야 합니다."
 COU_resignation_of_acting_authority: "대책위원장 사퇴"
 COU_resignation_of_acting_authority_desc: "유라기 모모카는 이 자리를 오래 맡고있을 생각이 없습니다. 교통실의 안전과 유라기 모모카의 추방 위험이 일단락된 이상 그녀는 그 자리에서 사퇴할 것입니다."

