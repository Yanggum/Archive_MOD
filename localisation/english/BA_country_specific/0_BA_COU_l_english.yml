 COU_start_event.1.t:0 "Founding of the Student Volunteer Defense Force"
 COU_start_event.1.desc:0 "Rin was lost in thought, her eyes filled with worry. Normally, she would have been focused on her work while sipping coffee, but she could no longer continue like this.\n\nRin's position was being threatened by those full of greed, seeking to satisfy their own selfish interests, while at the same time, murder and violent crimes against Kivotos students were surging. As the Acting President of the General Student Council, Rin had to do something.\n\nAt that moment, one of the primary rules of the General Student Council flashed through Administrator Rin's mind. \"The General Student Council cannot possess a military organization.\" But what if she broke this rule? If this was the only right path, wasn't it acceptable to ignore a single rule?\n\nA few days later, Administrator Rin stood before reporters holding a cylindrical case. She then pulled a flag from the cylinder.\n\n\"As of this hour, our General Student Council officially waives the restriction on military possession under Article 2 of the Student Autonomy Guarantee Act and announces the creation of a paramilitary organization, the Student Volunteer Defense Force. The main leadership of the Student Volunteer Defense Force will consist of former SRT Special Academy members and military experts.\"\n\nAt Rin's statement, reporters instantly began pouring out all sorts of questions, and some already began hurling insults at her.\n\nHowever, Administrator Rin—no, President Rin's eyes were already fixed with determination on the official flag of the Student Volunteer Defense Force she held."
 COU_start_event.1.a:0 "\"For everyone's sake, this is the only way.\""
 COU_start_event.1.b:0 "\"Did you forget that a private military organization is an abuse of power?\""

 COU_start_event.2.t:0 "Momoka Ousted from the Meeting"
 COU_start_event.2.desc:0 "From early morning, Momoka was summoned to the meeting room of the General Student Council Secretariat. Outside the secretariat, the streets were filled with Belgian protesters; through the window, she could see Valkyrie Police Academy students guarding the doors, holding back the crowd with their shields.\n\nMomoka entered the meeting room with an annoyed look, tearing open a bag of her usual mentaiko snacks. She listened to the protesters' demands, but no room for compromise was visible. Some protesters wanted Belgian independence, while others demanded autonomy. Eventually, faced with such complex demands, Momoka blurted out the words in her head without a second thought.\n\n\"Why don't we just give them what they want?\"\n\nA short while later, Momoka walked out of the secretariat as if she had been kicked out, her face full of irritation. On her way to buy more mentaiko snacks as she walked through the crowded city center, she was caught wearing her full General Student Council uniform—out of sheer laziness—and was recognized by the protesters.\n\nContrary to her expectation that things would get bothersome, the protesters told her they would buy her whatever she wanted if she leaked the details of the Student Council meeting. Soon, Momoka, having successfully acquired a mountain of snack bags from the protesters, began her story while munching on a snack.\n\n\"...Honestly, it doesn't seem like they view you guys very favorably. Something about maintaining political neutrality—you all know how strict Administrator Rin is~ Well... but to be honest, my idea was just to accept your opinions as they are, but would you believe it? They kicked me out!\""
 COU_start_event.2.a:0 "\"Hey there, what are you writing down so diligently?\""
 COU_start_event.2.b:0 "\"Listen to the protesters? Don't make me laugh.\""

 COU_start_event.3.t:0 "Aoi's Administrative Coordination"
 COU_start_event.3.desc:0 "§p\"Everything has a cost, and disorder is the most expensive luxury of all. If Valkyrie needs the resources to maintain peace, then we must ensure those resources are managed with absolute precision. Efficiency isn't just a goal; it's our survival.\"§!\n\nOki Aoi adjusted her glasses while reviewing the logistical reports from the police academy. Her presence brought a cold, calculated stability to the chaotic transition, as she began to align the needs of the students with the harsh realities of their new world."
 COU_start_event.3.a:0 "\"...The numbers don't lie.\""
 COU_start_event.3.b:0 "\"...Let us proceed with the reallocation.\""

 COU_start_event.4.t:0 "Game of Thrones"
 COU_start_event.4.desc:0 "\"...I see, the Chief Administrator finally did it,\" Shiranui Kaya said, leaning back in her chair. She drank the coffee placed beside her with a worried face, but a smile was hanging on her lips.\n\nAbandoning the perfectly functional SRT and creating a new paramilitary organization? Rin was like a window whose every move was transparently visible. No matter the intent she babbled about with her sycophantic mouth, she was simply struggling to protect her own bowl. Kaya put down her coffee and turned on the TV. As expected, the idiots on the TV were acting sophisticated, blathering that Rin wanted an iron-fisted rule or that Rin was aiming for the position of Council President.\n\nHa, not a chance. The dazed Chief Administrator has no such intention. She is simply afraid that her bowl will be taken away. Pushing aside the coffee cup, Kaya pulled out a small chessboard from her desk drawer. She thought that soon, the children of SRT would probably come to her, terrified, begging for help. Of course, since there was a higher chance they wouldn't, she let out a shallow sigh. One must not become weak.\n\nOn the chessboard, only a Queen and two Knights were placed. Rin was the Queen, and she was a Knight. She then took out eight Pawns and placed them in front of the board. The game of chess with the throne at stake had begun. Kaya tapped the desk with a Pawn. In the game of thrones, Pawns were inevitably necessary. Only then could she take the Queen and end the game. Or so she thought."
 COU_start_event.4.a:0 "\"Let's take our time and wait.\""

 COU_start_event.5.t:0 "Intersection"
 COU_start_event.5.desc:0 "Defense Chief Shiranui Kaya tapped the chessboard. Her pieces were few, and the possibilities were low. To break through, she needed SRT.\n\nHowever, soon the sound of hurried footsteps could be heard from beyond the firmly closed door. Eureka. Her low-probability prediction had come true. Judging by the footsteps, it was one person.\n\n\"Defense Chief! Open the door!\" Shichido Yukino shouted in an urgent voice. Kaya put down the Pawn she was holding and opened the door, wearing an expression as if she knew nothing. \"What brings you here?\" she asked calmly.\n\n\"What do you mean, what brings me here! Don't you even watch TV!\" It was a quite rude but terrified voice. Kaya liked that point.\n\n\"First, please come in,\" Kaya replied with a serene smile. The Pawn that would take the Queen had come to beg for help himself—it was an interesting turn of events for her. Especially since it was a very low probability possibility.\n\nKaya poured two cups of warm coffee from the pot and placed them on the desk. Yukino took the coffee with trembling hands and tried to remain calm, but she couldn't hide her desperate expression.\n\n\"I know. It seems Chief Administrator Rin has created a replacement for SRT,\" Kaya began. As if waiting for those words, Yukino quickly followed up.\n\n\"Right, the Defense Chief must know, but the Chief Administrator finally went and did it! I don't know if her own special forces weren't enough, but it's like she's trying to purge us!\"\n\n\"Yes, indeed. And in all likelihood, FOX Squad and RABBIT Squad will be discarded. Is that not so?\"\n\n\"You know it well! I need the Defense Chief's help! You were by Rin's side, weren't you? Then can't you persuade Rin to cancel the creation? I'll give you anything in return!\"\n\n\"Unfortunately, the Chief Administrator was adamant. I spoke to her on the way back from the press conference, but it was no use.\"\n\nYukino's expression turned to one of despair."
 COU_start_event.5.a:0 "\"However, it's not like there isn't an alternative.\""

 COU_start_event.6.t:0 "Eight Pawns"
 COU_start_event.6.desc:0 "\"However, it's not like there isn't an alternative.\"\n\nYukino's unfocused eyes refocused and looked at Kaya. A smirk appeared on Kaya's face.\n\n\"Let's assume the Queen here is Rin, and the Knight is me.\"\n\nKaya moved the Knight right in front of the Queen. However, every time it moved, the Knight was futilely killed by the Queen. But then, she picked up eight Pawns and placed them on the board. It was a crushing victory for the Knight.\n\n\"I need a little help from SRT.\"\n\"The Chief Administrator says she'll fill that Student Volunteer Defense Force with former SRT members, but isn't that an obvious lie?\"\n\"If so, the only way for SRT to survive now is for the Chief Administrator to change her mind—or for her to be replaced. But the Chief Administrator didn't seem to have any intention of doing that.\"\n\"I quite like SRT myself. Outstanding talents, a wonderful special forces unit. So, I want to ask.\"\n\nKaya held out the eight Pawns."
 COU_start_event.6.a:0 "\"Will you do nothing and be discarded,\""
 COU_start_event.6.b:0 "\"Or will you struggle to survive?\""
 ##Kaya Other 
 COU_event_notkaya.1.t:0 "Admission"
 COU_event_notkaya.1.desc:0 "\"Pant... pant... Stop, please stop...!\"\n\nShiranui Kaya ran and ran until it was pitiful to watch. Behind her followed a group of several administrators wearing headsets, approaching slowly. Kaya could not accept it. It didn't make sense in the first place. The collaborators she had worked so hard to build, the peace of the General Student Council... and her own ambitions were screaming in agony. If she had known it would be such a futile effort, she wouldn't have done this from the start. She couldn't accept it. Cold tears soon flowed from her face, which was flushed red with frustration.\n\n\"There's no way... Rin, Aoi, Heine... they were really 'swayed' by the words of those people...? Don't lie to me...\" Kaya stopped running. She just slumped down and sobbed. Amidst the sounds of her sniffing, the administrators slowly approached and opened their briefcases with expressionless faces.\n\n\"Defense Chief, it is the order of the Acting President. Please sign.\"\n\nAs the briefcase clicked open, the screen of a computer mounted inside lit up. On the screen was written an \"order\" to immediately dismiss Defense Chief Shiranui Kaya for treason.\n\n\"Whew, *hic*... whew... It really is the end now...\" Kaya threw her gloves aside and wiped her tears. There was nothing more to be gained from crying.\n\n\"Fine... I'll do it, I'll do it...\" Kaya placed her hand on the mousepad with a trembling hand.\n\nAs the administrators hurriedly left the scene, Kaya's legs gave out, and she slumped completely to the ground. She sat there and sniffed for hours."
 COU_event_notkaya.1.a:0 "\"This can't be...\""
 

 
 
 
 #Kaya
 
 
 #COU_event.7.t:0 "A Truly Difficult Task"
 #COU_event.7.desc:0 "She couldn't understand it at all, nor did she want to. Nanagami Rin simply didn't know how to see reality. She was pouring all her attention into one tiny fragment. For the Chief Administrator to be swayed by a few tears—Kaya thought that a more pathetic human could not exist in Kivotos. She had babbled with Rin for hours, but those she called 'idiot chiefs' had stripped the collaborators of all their status. Seeing them imprison those grateful people in Valkyrie while they themselves were intoxicated by the cheers of the 'ants,' Kaya couldn't help but let out a hollow laugh.\n\nIn a small corner of the Shiratori District, in the quiet seat of the Defense Chief, Kaya sat with her legs crossed, drinking coffee. It was the last coffee she had brought before the Great Transference. It tasted exceptionally bitter. Beyond the chessboard placed beside her, stupid news about the disposition of the collaborators was flowing. Those pathetic fools, those morons... She was angry, but there was nothing she could do right now. She only quietly asked for forgiveness from those who had been 'used.'\n\nThe bitter coffee reached the bottom. At the same time, Kaya's patience also reached its end. She had endured a lot, endured enough. The General Student Council President had done nothing under the pretext of calming the chaos after the Great Transference, and Kaya had done everything. Gathering collaborators, stabilizing the rule, suppressing the resistance—all those shitty chores! She gnashed her teeth. She could endure no longer.\n\nKaya could not stand by and watch anyone else falsely claim the titles of \"Superhuman\" and \"General Student Council President.\" Her last courtesy and respect for the Council President she most admired was for Kaya herself to take over the acting position. Because the positions of Council President and Superhuman were ones that no one else could dare to imitate."
 #COU_event.7.a:0 "\"...Now, there's no choice but to do that.\""
 #COU_tooltip_kaya_get_moved:0 "From the perspective of §Y[COU.COU_KAYA.GetName]§!, you will begin the §RGeneral Student Council Power Struggle§! against §Y[COU.COU_RIN.Getname]§!. §RVictory in that power struggle can only be concluded by your swift decision-making.§!"

