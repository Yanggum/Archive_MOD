 COU_situation_of_the_kaya_desc:0 "카야의 상태는 총학생회의 국정 운영 전반에 큰 영향을 미칩니다. §g상태가 좋으면 좋을 수록§! 추가적인 정치력 §G보너스§!를, §g좋지 않아질수록§! 정치력 §R페널티§!를 부여받습니다.\n"
