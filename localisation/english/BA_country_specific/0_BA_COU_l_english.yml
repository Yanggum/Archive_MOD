 COU_getout_rin_decision:0 "린 탄핵"
 COU_getout_rin_decision_desc:0 "\n\n\n\n£GFX_COU_decision_picure_COU_norin\n\n\n\n\n\n\n\n\n§L\"총학생회장이 사라진 이후에도 그녀의 그림자에 눌려 사람들의 의견을 귀담아듣고 절차대로 일을 진행하려 하다니... 그런 중우정치 같은 방법으로는 아무것도 해결하지 못합니다. 키보토스는, 초인에 의해 지휘되어야 합니다.\"§!\n\n§Y나나가미 린§!의 §R탄핵§!은 §Y린§!이 §Y총학생회장§!의 빈자리를 대신하여 나섰을 때부터 거론되었습니다. 철저한 원칙주의에 입각한 통치는 §Y시라누이 카야§!와 같은 이들에게서 큰 불만을 샀고, 그 갈등은 결국 §R탄핵§!이라는 §R마지막 싸움§!으로 번졌습니다. §Y카야§!는 §Y린§!을 §R탄핵§!시키기 위해 행동을 개시했습니다.\n\n그러나 §Y나나가미 린§! 또한 가만히 앉아 있지는 않을 것입니다. §Y린§! 또한 §Y카야§!를 §R총학생회에서 배제§!하기 위해 행동을 시작했으며, §R결국 이 싸움은 둘 중 누가 먼저 상대를 굴복시키는가에 달리게 되었습니다.§!\n\n§R그러나§! 단순히 빨리 한다고 이길 수 있는 것도 아닙니다. 총학생회에서 부상 등 기타 사유로 제대로 출석하지 못하는 이들을 제외한 §Y오키 아오이§!, §Y스모모§!, §Y하이네§!, 이 §Y세 명의 실장들§!의 §G지지§! 또한 얻어내야 합니다. §R만일 이들 중 단 한 명의 지지라도 받지 못한다면 탄핵은 실패로 돌아가고 말 것입니다.§!\n\n또한, §Y대중들의 탄핵에 대한 지지§!도 얻어야만 합니다. 언론과 매체를 가리지 않고 이들을 §G'계몽'§!시킴으로서 §Y린§!을 §G완전히 합법적이며 민주적인 절차§!를 통해 §R탄핵§!시키지 않는다면 §Y새 총학생회장§!은 §R좋지 않은 결말§!을 맞이하고 말 것입니다. 마치 프랑스 혁명 당시의 왕들처럼요."
 
 COU_rin_getout_kaya:0 "린의 선제 탄핵"
 COU_rin_getout_kaya_desc:0 "§Y나나가미 린§!은 §Y카야§!를 '총학생회 내부의 분열을 일으키며 현지인들과의 불법 거래와 범죄 방조 및 동조'라는 명목으로 실장들을 §R설득§!하고 있으며, §R만일 카야가 이에 적절하게 대하지 않는다면 카야는 패배할 것입니다!§!"
 COU_increasing_the_crisis:0 "증폭되는 의심"
 COU_increasing_the_crisis_desc:0 "총학생회의 사람들은 방위실장이 요즘 수상하다고 느끼고 있습니다. 이러한 의심은 피할 수 없으며 직면해야만 하는 문제입니다."
 COU_demand_establish_humans_land:0 "인권보장실 설립"
 COU_demand_establish_humans_land_desc:0 "인권보장실의 설립은 우리의 확실한 우위를 보장할 수 있으나, 반드시 해야만 할 가치는 아닙니다."
 COU_gets_aoi_first_eco_crisis:0 "아오이 회유 - 재무실 보고서 조작"
 COU_gets_aoi_first_eco_crisis_desc:0 "카야는 최우선적으로 보고받을 수 있게 되었습니다. 이를 적절히 이용한다면 재무실장을 다시 한번 회유해 볼 수 있을 것입니다- 이번엔 더 치밀한 조작과 눈속임으로요."
 COU_gets_aoi_second_letsgo:0 "오키 아오이 회유 - 카이저와의 연계"
 COU_gets_aoi_second_letsgo_desc:0 "린에 대한 불신이 쌓여가는 재무실장에게 크리티컬로 주어질 마지막 공격은 카이저 코퍼레이션과의 연계입니다. 적당히 조작한 문서들로 카이저와의 연계를 만들어 아오이를 카야의 편으로 만들지는 못하더라도 최소한 탄핵안에 찬성시킬 수는 있을 것입니다."
 COU_gets_smomo_cou_supports_kaya:0 "스모모 회유 - 흐름."
 COU_gets_smomo_cou_supports_kaya_desc:0 "스모모는 실장에 준하는 직위와 권한을 가지고 있습니다. 스모모를 회유하기 위해서는, '대세'의 흐름을, 알려 주면 됩니다."
 COU_dutch_law_letsgo:0 "디츨란드법 제출"
 COU_dutch_law_letsgo_desc:0 "카야에게 린 대행 말고는 더 이상의 대적자는 없습니다. 카야는 충분한 지지와 함께, '강압적'으로 디츨란드법의 강행을 할 수 있게 되었습니다."
 COU_SRT_buntang_rabbits_first:0 "RABBIT 소대와의 접촉"
 COU_SRT_buntang_rabbits_first_desc:0 "우선 SRT가 사보타주를 FOX 소대 홀로서 할 수는 없습니다. 어디론가 숨어 버린 후배들과의 접촉이 우선입니다."
 COU_SRT_FOX_attack_good_rins:0 "FOX 소대- 행정위원회 습격"
 COU_SRT_FOX_attack_good_rins_desc:0 "야심한 밤, FOX 소대는 생텀 타워와 행정위원회를 습격하여 린 대행에게 우호적인 실장들을 습격할 것입니다."
 COU_SRT_RABBITS_attack_good_rins:0 "RABBIT 소대- 교통망 사보타주"
 COU_SRT_RABBITS_attack_good_rins_desc:0 "RABBIT 소대는 명령에 따라 D.U.의 교통망을 사보타주하여 린 대행의 입지를 약화시킬 것입니다."
 COU_attack_the_cou_workers:0 "보고서 가로채기"
 COU_attack_the_cou_workers_desc:0 "수많은 행정원들은 모든 총학생회의 안건들과 보고서들을 린 대행에게 먼저 제출합니다. 이는 린 대행의 정통성을 인정하는 꼴이니, 수단을 가리지 않고 저지해야 합니다."
 COU_use_fascist_militas:0 "파시스트 민병대 동원"
 COU_use_fascist_militas_desc:0 "반항적인 파시스트들은 언제나 준비되어 있습니다. 이들을 이용하여 린 대행의 정통성을 하락시킬 수 있습니다."
 COU_workers_notworks_bruh:0 "파업 주도"
 COU_workers_notworks_bruh_desc:0 "충성스러운 노동자들은 언제나 준비되어 있습니다. 이들은 '린 대행이 물러나지 않는 한 일하지 않겠다' 라고 주장할 것이며 이는 린 대행의 정통성을 하락시킵니다."
 COU_getout_rin_right_now:0 "린 탄핵안 제출"
 COU_getout_rin_right_now_desc:0 "모든 것이 다 성공적으로 끝났습니다. 이제는, 이제는, 정말로, 린 대행을 쫓아낼 시간입니다."
 
