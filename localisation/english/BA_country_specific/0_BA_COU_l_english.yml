 ##안네 프랑크 
 COU_event_normal_days.1000.t:0 "생일 선물"
 COU_event_normal_days.1000.desc:0 "아넬리스 마리 안네 프랑크는 요즈음 학교에 가지 못했다. 남아 도는 것이 시간이였고, 놀 거리들은 들킬 위험 때문에 라디오 말고는 거의 없었다. 지금 당장에서도 암막 커튼을 치고 생활하는 주제에, 더 나은 삶이란 그녀에겐 주제넘은 것이었다. 그나마 위안이 되는 점이라면, 역사라면 끝장나게 좋아하기에 그리스 신화의 뮤즈 9명의 이름을 잠꼬대에서도 말할 만큼 외우거나, 유럽 왕실의 계보를 툭 치면 말할 수 있게 외우는 것은 그녀의 새로운 취미가 되었다. 사실 계보 외우기는 전부터 즐겨 했던 것이지만.\n\n안네는 암막 커튼 때문에 저녁이 되었음을 알아차리지 못했다. 하긴, 곁에서 아우구스테 판 펠스 아저씨가 하루종일 대전이가 어쩌고, 왕가가 어쩌고, 파시스트들이 어쩌고, 알아듣지도 못할 정치 이야기들을 늘어놓고 있으니 어찌 안 질릴리가. 새해에 축하 파티를 열다가 빌헬미나 여왕님이 총에 맞고 돌아가셨다는 뉴스를 어디선가 주워들었는지 여왕 폐하께서 돌아가셨는데 이렇게 놀자판을 하는게 말이 되냐고 난동을 피우는 바람에 조금 불편하기까지도 했다.\n\n책을 읽던 안네는 하품을 했다. 슬슬 물건을 구하러 나갔다 오신다던 아빠가 돌아오실 시간이었다. 그녀는 내심 펠스 아저씨 때문에 아빠가 얼른 돌아오시기를 바라고도 있었다. 그리고 그녀가 아빠 생각을 한 지 몇분 채 지나지 않아 책장 너머로 말소리가 들렸다. 판 펠스 아저씨에게 책장 문이 고장난 것 같으니 좀 도와달라는 소리였다. 펠스 아저씨는 페터를 곁에 두고 늘어놓던 정치 이야기를 그만두고 문을 열기 위해 자리에서 일어섰다. 페터가 안도의 한숨을 쉬었다. 아무래도 질릴대로 질린 모양이었다.\n\n오토 프랑크가 판 펠스와 문을 열고 들어오자 안네는 곧바로 달려나가 오토 프랑크를 맞이했다. \"아빠! 오늘은 좀 늦게 오셨네요!\" 오토 프랑크는 웃으며 안네를 자리에 앉혔다. 오토 프랑크는 즐거운 듯 흥얼거리며 품 속에서 자그마한 상자를 꺼냈다. \"안네, 늦어서 미안하다. 생일 선물이다.\" 안네는 기뻤다. 아빠가 꼼짝없이 자신의 생일을 잊어 버린 줄 알았는데! 안네는 하얀 박스를 칼로 뜯었다. 상자 안에는 거대한 M자 모양의 로고가 박힌 \"휴대폰\" 이 있었다.\n\n\"세상이 뒤바뀌었어. 그렇지만, 우리 공주님께서 세상에 뒤쳐지시면 안 되지.\" 안네는 마치 흥미로운 고문서를 보는 것처럼 네덜란드어로 적힌 설명서를 읽었다. 아마도 생산은 \"밀레니엄\"이라는 곳에서 하고, 번역과 관련된 부가적인 사항들은 필립스를 거친 것 같았다. 안네는 오토 프랑크를 끌어안고는 방으로 돌아가 침대에 \"휴대폰\"을 들고 누웠다."
 COU_event_normal_days.1000.a:0 "안네는 설명서에서 본 대로 전원을 켰다."
 COU_tooltip_anne_frank_one:0 "§g기기 이름을 설정해달라는 탭이 떴다. 안네는 조심스럽게 화면을 눌러 타자를 쳤다. 화면이 좀 작긴 했지만, 그녀는 어쨌거나 기기의 이름을 적었다. 이름은, 그녀가 몇 십분을 고민한 끝에서야 붙일 수 있었다. 지금은 잃어버렸지만 자신의 오랜 단짝이였던 일기장을 이어가는 마음에서, 이름은 \"키티\"라고 지었다.§!\n------------\n§Y그 모든 일에도 불구하고, 내가 믿는 것은 사람들의 진심은 정말 착하다는 것이다.§!\n\n네, 축하합니다. 안네 프랑크를 만나보셨다는 건, 0.1%의 확률에 당첨되셨다는 것입니다! 정성들여 작성한 안네 프랑크와 관련된 변형된 이야기들을 읽어보시면서, 부디 무료한 전쟁 없는 시간들을 때우실 수 있으시길 바랍니다. 참혹한 전쟁의 희생자가, 멋진 웹소설 작가로 데뷔하는 여정을요."
 COU_event_normal_days.1001.t:0 "나가고 싶어!"
 COU_event_normal_days.1001.desc:0 "\"아빠, 내가 \"인터넷\"으로 봤는데, 이제 아무도 안 잡아간대! 진짜야! 내가 보여줄 수 있어! 그러니까 이번 락 공연 가게 해줘, 응?\" 프랑크 일가는 이른 아침부터 신경전을 벌였다. 오토 프랑크는 딸이 못마땅스러웠다. 오토 프랑크 자신도 \"인터넷\" 이라는 것을 사용해보긴 했지만, 인터넷이라는건 믿을 수 없는 존재였다. 그것은 대전이 직후 급작스럽게 등장한 문물이였고, 혹여나 사람을 속이는 무시무시한 것이면 어떡하겠는가? 이렇게 숨어 지내는 이상 뭐든 믿을 게 되지 못했다. 안네는 몇번이고 제 아버지와 말싸움을 벌였다.\n\n\"키보토스넷\" 이라는 사이트에서, 더는 소요 사태가 발생하지 않아 유대인과 국민저항전선에 가담했던 이들을 체포하지 않겠다고 행정위원회에서 발표한 뉴스를 보았던 것이다. 오토 프랑크는 대전이 당시 국민저항전선에 가담하여 키보토스인들과 전투를 벌였다. 독일 제국군에서 복무한 그였지만 기술적인 격차는 곧이어 그가 이길 수 없는 전쟁에서 싸우고 있다는 것을 깨닫게 했다. 이후 그는 재빠르게 신분을 세탁하였지만, 협력자들이 문제였다.\n\n협력자 중엔 그의 전우들도 있어서, 까딱 잘못했다간 일가 전체가 잡혀들어가 발키리 교정국에서 썩을 것이었다. 결코 그것만은 안 되었다! 물론 자신의 잘못은 맞긴 했지만, 어째서인지 수배 목록엔 유대인들도 포함되었다. 아마도 협력자들이 유대인들도 대전이 당시 사보타주를 자행했다고 고발한 모양이었다.\n\n실제로 몇달 전까지만 해도 그의 지인들이 유대인이라는 혐의로 체포되어 모든 재산을 빼앗기고 발키리 교정국에 수감된 적이 있었다. 어쨌든 오토 프랑크는 밖은 협력자들로 가득 찼으니, 절대로 나가서는 안된다고 말했다. 안네 프랑크가 그래도 같은 네덜란드인들인데 공연 가는건 봐주지 않겠냐고 했지만, 오토 프랑크는 한숨을 쉬며 아는 친구가 협력자들에게 그런 식으로 무모한 도전을 했다 죽어버린 적이 있다며 말해버렸다.\n\n안네가 울상을 짓자 다급히 그는 방음을 꼼꼼히 할테니 인터넷으로 락 공연을 시청하라고 달래는 것이 전부였다. 안네는 얼굴을 잔뜩 찌뿌린 채로 방문을 세게 닫았다. 한마디 하려던 오토 프랑크는 이내 이 모든 사단이 자신의 잘못도 있다는 것을 깨닫고 터벅터벅 소파로 걸어가 피곤한 몸을 뉘였다. 며칠간 제대로 먹지도 못했던 그였다. 안네에게 미안한 마음이 들었다.\n\n그는 같은 민족을 끊임없이 의심하고 숨어들게 만든 대전이 자체가 미웠다. 한번 출세해보자고 나선 협력자들이 죽을 듯이 미웠다."
 COU_event_normal_days.1001.a:0 "그리고서 그는 잠을 청했다."
 COU_tooltip_anne_frank_two:0 "§g안네는 침대에 누워 휴대폰으로 락 공연을 시청하고 있었다. 정말로 즐거워 보였다. 헤일로를 단 언니들은 협력자들의 경호 사이에서 락 공연을 즐겼다. 안네도 대전이가 미웠다. 원하는 공연 하나 가지 못하게 했으니까.§!"
 
 
 ##
 COU_event_normal_days.1.t:0 "신문물"
 COU_event_normal_days.1.desc:0 "레이우아르던과 프리슬란트의 한적한 시골 마을은 오랜만에 시끄러웠다. 새로운 정부? 아마도, 여자얘들로 이루어졌다는? 어쨌든 정부가 인터넷이라는 걸 설치해주겠다고 차량을 수십대를 끌고 왔다. 닭들이 꼬꼬댁대며 전선을 설치하는 행정원들을 피해 다녔다. 한 시골 노인은 오랜만에 즐거운 요깃거리라도 발견한 듯 온종일 인터넷을 설치하는 것만 들여다보았다. 아침에 일어나면 창밖에서 설치하는 행정원들을 보았고, 밥을 먹으면서도 바라보았다. 자꾸만 바라보는 눈초리에 행정원들이 바라보지 말라고 경고하기도 했으나 결국엔 노인의 완강함에 못 이겨 내버려둘 수 밖에 없었다.\n\n그리고 인터넷라는게 모두 설치되자 근처 주민들에게 요상한 마법 철덩어리 비슷한 것들을 나누어 주고 떠났다. 조미료 보관함만한 크기의 철덩어리의 버튼을 눌러 보라고 행정원이 말한 것이 기억이 난 노인은 철덩어리의 버튼을 눌러 보았다. 우웅거리는 굉음에 놀란 노인은 잠시 자리를 피했다 돌아와 자리에 앉았다.\n\n이 요상한 철덩어리와 인터넷이라는 물건은 노인에게 아주 재미있는 경험을 선사해 주었다. 컴퓨터라는 것을 배워 온 시골 청년의 도움으로 인터넷 사이트에 접속하고 옆 집 노인과 카드 게임을 칠 수도 있었다. 몹시 흡족스러운 미소로 하루를 보낼 수 있게 된 노인은 이 이상한 마법 철덩어리가 마음에 쏙 들었다. 가끔씩 노인은 컴퓨터의 철덩어리에 이불을 덮어 주고는 한다. 마치 손주놈과 노는 듯한 기분이 괜스럽게 드는 듯 했다."
 COU_event_normal_days.1.a:0 "\"잘 자요, 할아버지!\""
 COU_tooltip_normal_days_one:0 "§g노인은 깊은 밤 계속해서 웅웅거리는 소리에 잠에서 깼다. 노인은 한참을 씨름한 끝에서야 버튼을 한번 더 눌러 전원을 꺼야 한다는 것을 깨달았다.§!"
 COU_event_normal_days.2.t:0 "즐거운 취미"
 COU_event_normal_days.2.desc:0 "대전이 이후 암스테르담은 반쪽이 되었다. 반쪽은 키보토스의 D.U.로, 반쪽은 암스테르담이었다. 그러나 대단히 유감스럽게도 암스테르담 대학교는 대전이에 휩쓸리지 않았고, 그 말인 즉슨 지루하기 짝이 없는 교수들의 수업에 참석해야 했다는 것이었다. 무척이나 수업이 듣기 싫었던 날, 한 청년은 몰래 수업에 빠져나와 시내로 향했다. 근처 카페에 가서 자리를 잡은 그는 민트 초코 커피를 시켰다.\n\n민트 초코란 정말, 대전이의 축복과도 다름이 없다! 이렇게나 상쾌하고, 그리고, 아주 독특하고, 어쨌든 정말 위대한 음식을 즐길 수 있게 된 것에 대해 청년은 감사를 표하고 싶었다. 그리고 이 작은 철덩어리, \"휴대폰\" 이라는 물건도! 휴대폰은 그의 대학 등록금을 긁어모아 뒷골목에서 구한 아주아주 비싼 물건이 되시겠다.\n\n그는 요즘 핫한 인터넷 사이트인 \"키보토스 인사이드\"에 접속했다. 그가 자주 들르는 그 사이트는 여러개의 크고작은 \"갤러리\" 이라는 게시판들이 있었는데, 그는 그 사이트로 약간의 즐거운 취미를 즐겼다. 능숙하게 새로운 계정을 생성하고, \"네덜란드 갤러리\" 게시판에 그는 글을 쓰기 시작헀다.\n\n글을 쓰는 내내 그는 마치 삐에로의 묘기를 보는 어린아이처럼 실소를 멈추지 못했다. 아주 즐거웠다! 짤막하게 사진도 업로드한 그는 글의 제목을 독수리 타자법으로 천천히 써내려갔다."
 COU_event_normal_days.2.a:0 "\"완장 없냐..? 야짤 달린다 ㅋㅋ...\""
 COU_tooltip_normal_days_two:0 "§g하지만 이내 글은 관리자에 의해 금세 삭제되고 말았다. 청년은 재미없다는 듯 한숨을 쉬더니 곁에 놓인 민트 초코 커피를 마셨다. 아, 민트 초코여! 이상한 년들의 축복이여!§!"
 COU_event_normal_days.3.t:0 "오키 아오이의 휴식"
 COU_event_normal_days.3.desc:0 "오키 아오이는 최근 심각한 과로에 시달렸다. 온갖 부서에서 추가적인 예산 편성을 급작스럽게 요구한 탓이었다. 체육실은 운동 기구들을 더 들여놓겠다고, 방위실은 멋진 비행기 (사실 벨기에의 오래된 고물 비행기이다) 를 사들이겠다고, 교통실은 실수로 하이랜더의 열차를 작살내서 물어줘야 한다고 등등등! 서류에 거부 도장만 찍는데 하루가 다 가는 날도 있었다. 아오이는 커피를 갈아마실 시간도 없어 믹스 커피를 타 마셨다. 으으, 더 이상의 업무는 아무리 아오이라고 해도 무리였다. 아오이는 결국 재무차장에게 양해를 구하고 잠시 휴식을 취하기로 했다.\n\n행정위원회 바깥 시내는 한적했다. 치안을 담당하는 발키리 학생 몇명과 담소를 나눈 그녀는 D.U. 근처의 강가로 향했다. 정확히 말하자면, 암스테르담의 근처에는 원래 강들이 많았으니, 자연스럽게 암스테르담에 전이한 D.U. 근처에도 강가들이 있었다. 아오이는 치맛자락을 물에 젖지 않게 올려붙이고는 바닷물에 담갔다. 차가운 바닷물들이 철썩 하고는 그녀의 발을 간지럽혔다. 아오이는 가볍게 웃어 보이고는 그대로 강 근처 해변가에 누워버리고 말았다. 과로도, 수많은 업무도, 아무래도 좋았다. 하지만 이러한 가뭄 속 단물 같은 휴식이 없다면 아무리 아오이라도 포기해버리고 말 것이었다. 아오이는 그 날 밤까지 하루종일 바닷물에 발을 담그고 누워 있었다. 밤이 온 지도 모른채 쉬는 것에 정신이 팔렸던 아오이는 잠깐 쪽잠을 자기까지도 했다.\n\n아오이가 정신을 차렸을 때는 새벽 세 시였다. 키보토스의 밤하늘에는 멋진 고리 모양 빛이 빛났었는데... 아오이는 한편으로는 아쉬워하며 혼잣말했다. 우우웅, 잠시 후 그녀의 휴대폰이 다시 한번 울리기 시작했다. 아, 이제는 충분히 쉬었다는 것을 뜻하는 것 같았다. 아오이는 발을 물 속에서 빼고 치마를 내리며 전화를 받았다. \"네, 재무실장 오키 아오이입니다.\" 전화는 재무차장에게서의 전화였다. 일이 정신나갈 것처럼 많으니 그녀의 휴식에는 염치없지만 부디 도와달라는 간절한 부탁이었다. 아오이는 가볍게 웃으며 알겠다고 하고는 행정위원회로의 길을 나섰다.\n\n이제는 충분히 쉬었다. 아오이는 만족스러운 미소를 지으며 행정위원회로 돌아갔다."
 COU_event_normal_days.3.a:0 "\"좋아, 재무차장. \"총결산\"을 끝마쳐 보자고!\""
 COU_tooltip_normal_days_three:0 "§g아오이가 재무실에 들어서며 말했다. 재무차장은 세벽 세 시가 넘는 시각의 과로에 익숙하지 않은 듯 거의 탈진하기 직전까지 울상인 얼굴로 서류들을 처리하고 있었다. 아오이는 미안하다고 말하며 재무차장의 머리를 쓰다듬어 주었다.§!"
 COU_event_normal_days.4.t:0 "안락한 꿈"
 COU_event_normal_days.4.desc:0 "\"하아... 이게 대체 무슨 일이죠?\" 시라누이 카야는 방위차장에게 따지듯 전화를 걸었다. 어째서 시위대가 방위실 앞에서 시위를 벌이고 있었던 것일까? 그녀는 단지 블루 마운틴 한 잔을 여유롭게 마시고 싶었을 뿐이었다. 카야는 잔뜩 화가 난 채로 말을 이었다. \"방위차장, 당장 저거 해결 못 하면 발키리 교정국에 쳐박아 드리겠어요!\" \"히, 히익... 신속히 처리하겠습니다!\" 카야는 한숨을 쉬며 전화를 끊었다. 부하라는 놈들은 어떻게 이렇게나 한심할 수가 있을까? 게다가 제대로 일처리조차도 하지 않아 카야는 무려 어제 오후 10시에 수면을 취하지 못했다! 카야는 잔뜩 성질이 난 얼굴로 볼을 오무리며 씩씩거렸다.\n\n\"그래요, 시라누이 카야. 계속해봤자 찌질한 푸념밖에 더 되나요.\" 카야는 이내 진정하며 의자를 뒤로 쭉 빼며 누워 보았다.\n\n\"음, 역시 이 최고급 가죽 사무용 의자로군요! 아주 푹신푹신해요. 각도도 아주 잘 조절되고요.\" 카야는 어젯밤 늦게 (무려 카야는 새벽 1시 30분에 잠을 청할 수 밖에 없었다!) 잠을 청했던 탓에 피곤했던 카야는 잠시 잠을 청했다.\n\n안락한 가죽 의자에서는 꿈 또한 완벽한 꿈을 꾸었다. 카야가 총학생회장의 지위를 성공적으로 물려받고, 모든 이들이 카야에게 굴복하며, 자신은 아무것도 안 해도 치안과 질서가 유지되며 모두가 카야를 찬양하는, 그러한 꿈을 꾸고 있었다. 카야는 헤실거리며 잠시동안이라도 꿈을 만끽했다."
 COU_event_normal_days.4.a:0 "그렇지만 곧이어 전화벨이 울렸다."
 COU_tooltip_normal_days_four:0 "§g카야는 눈을 비비며 전화를 받았다. \"네, 시라누이 카야입니다.\" 방위차장의 전화였다. 이제 해결했으니 편히 쉬시라는 내용이었다. \"하? 제 휴식을 방해한 건 방위차장 당신입니다.\" 방위차장은 카야의 불평섞인 넋두리에 기겁하며 죄송하다며 연신 사과했다.§!"
 COU_event_normal_days.5.t:0 "RABBIT 소대의 전술 훈련"
 COU_event_normal_days.5.desc:0 "\"미유, 어서 오세요! 거기가 아니에요!\" 츠키유키 미야코는 어쩐 일인지 소대원들을 아침 일찍부터 깨운 모양이었다. 아침 일찍부터 깨우는건 너무한 거 아니냐고 불평하는 모에에게 사키가 말을 덧붙였다. \"비록 내가 규율있고 엄격한 생활을 좋아하긴 하지만, 지금은 좀 이르다고 생각하는데.\"\n\n미야코는 소대원들에게 전술 훈련을 할 것이라고 이야기했다. 물론 그냥 훈련은 아니고, 진 팀은 일주일 간 식량 공수와 설거지를 담당하게 했다. 이렇게나마라도 전술 훈련을 지속하는 이유는, 비록 SRT는 사실상 사라졌지만 전술 훈련은 계속되어 소대의 전투력을 유지해야 했다.\n\n이번 전술 훈련에서는 미야코와 미유가 A팀을, 사키와 모에가 B팀을 이루어 진행했다. A팀이 폐건물에 진입하는 것을 B팀이 방어하는, 훈련 자체는 단순한 내용이었다. 곧이어 팀이 흩어져 준비할 시간이 주어졌다. 폐건물의 2층에 잠복하기로 결정한 사키는 기지개를 펴더니 철모를 고쳐 썼다. \"으으... 미야코, 새벽 4시부터 훈련을 하게 하다니, 꼭 이겨 보여서 복수하고야 말겠어!\" 모에와는 이미 말을 맞추어 놓았다. 모에가 드론들을 폐건물의 곳곳에 흩뿌려 놓을 것이고, 미야코는 이에 사키가 잠복한 곳으로 알아서 올 수 밖에 없을 것이었다. 사키는 마치 대단한 전략 전술이라도 계획한 장군처럼 자랑스러운 감정을 느꼈다. 미야코에게 골탕을 먹이고 싶었던 것도 있었을 것이다.\n\n그리고 잠시 후, 미야코의 훈련 시작 콜사인을 마지막으로 훈련이 시작되었다. 사키는 조심스럽게 문 옆에 숨어 있었다. 교범대로라면, 미야코는 분명 항공 전력을 가진 모에를 경계하며 2층에 진입하기 위해 앞에 놓은 문을 열고 들어올 것이고, 문 뒤에 잠복했을 드론들을 경계하다 오히려 사키에게 손쉽게 제압당할 것이었다.\n\n... 물론 그렇게 되어야 했는데, 사키는 미야코에게 먼저 제압당하고 말았다. \"아야, 미야코! 아파아파아파! 아프다고!\" 사키가 저린 팔을 붙잡으며 미야코에게 불평을 부렸다. \"난 교범대로 헀을 뿐인데, 뭐가 틀렸던 거지...\" 미야코가 그러한 사키의 푸념에 웃으며 대답해 주었다."
 COU_event_normal_days.5.a:0 "\"후후, 사키. 팀원 간 협력도 중요하다구요.\""
 COU_tooltip_normal_days_five:0 "§g사키는 혹시나 하는 눈치로 모에를 바라보았다. 아, 그럼 그렇지! 모에는 어느 틈인가에 미야코의 쪽에서 야키니쿠 도시락을 먹고 있었다. 결국 사키 혼자 미야코의 장난에 당해 버린 것이었다. 사키는 모에에게 잔뜩 짜증을 내는 동안, 미야코는 웃으며 사과의 의미로 자신도 같이 하겠다고 했다.§!"
 COU_event_normal_days.6.t:0 "악몽"
 COU_event_normal_days.6.desc:0 "\"으햣!\" 미유는 웃긴 소리를 내며 잠에서 깼다. 곁에서는 사키가 철모를 뒤집어쓰고서는 잠을 청하고 있었다. 좋은 기회로 싸게 숙박할 기회를 얻은 숙소에서 오랜만에 SRT 래빗 소대는 휴식을 취하고 있던 참이었다. 훈련도 하지 않고, 그저 호텔 조식을 받아먹으며 침대에서 뒹구는 삶도 나쁘지 않다고 미유는 느끼고 있던 참이었다. 사키는 물론 탐탁치 않아 했지만.\n\n미유는 안도의 한숨을 쉬었다. 한참 영 좋지 않은 악몽을 꾸고 있던 참이었다. 그것도 아주 질 나쁜, 대전이 그 날로.\n\n미유는 꿈속에서 네덜란드 왕궁 근처의 풀숲에 숨어 있었다. 근위대 몇명이 풀숲 쪽으로 도망쳐오자 뛰어난 사격 실력으로 근위대들의 머리에 구멍을 내기도 헀다. 미유는 사실 피를 흘리며 쓰러지는 근위대들을 보고 죽은 게 아니냐고 헀지만, 유키노 선배는 키보토스인들처럼 \"잠깐 기절한 것 뿐\" 이라며 미유를 안심시켰기에 거리낌없이 미유는 저격총을 난사할 수 있었다. 그 편이 근위대들에게 들키지 않을 것 같기도 했고.\n\nFOX 소대의 선배님들과 RABBIT 소대의 친구들이 한창 여왕 집무실에 진입하려고 애를 쓰고 있었다.\n\n미유는 니코 선배의 말에 따라서 그저 가만히 바라보기만 했다. 솔직히, 너무 아무 것도 안 해서 미안할 지경이였기에 졸기까지도 했다. 하지만 졸던 미유의 정신을 꺠운 것은 하나의 교신이었다. \"-... RABBIT 4? FOX 4... ...제거하도록 해.\" 미유는 화들짝 놀라 조준하고 있던 할머니에게 총을 쏘았다. 미안, 할머니, 잠깐 주무시길! 미유는 속으로 사과를 구한 뒤 저격총을 난사했다. 할머니부터 근처의 근위대, 가족처럼 보이는 이들을 \"재운\" 미유는 기뻐하며 도움이 될 수 있었다고 생각했다.\n\n진상을 알기 전까지는, 그렇게 생각헀다. 인간은 키보토스인들처럼 총을 맞는다고 기절하지 않는다. 더더욱이 살짝 긁힌 정도도 아니다. 그렇다면 미유가 저격총의 노리쇠를 당겼던 사람들은 전부, 어떻게 됐을까?"
 COU_event_normal_days.6.a:0 "미유의 눈가에 눈물방울이 흘러내렸다."
 COU_tooltip_normal_days_six:0 "§g눈물방울들이 미유의 이불과 침대 시트에 뚝뚝 떨어졌다. 마치 네덜란드의 여왕이 자신의 저격총을 맞고 피를 흘리던 때처럼, 눈물을 뚝뚝 흘리다 미유는 지쳐 다시 잠에 들었다.§!"
 COU_event_normal_days.7.t:0 "세상에서 가장 아름다운 곳"
 COU_event_normal_days.7.desc:0 "\"오~ 미스터 헤븐~ 아이 노우 더 월즈 그레이트풀 플라이스~\"\n\n에이설 호에서 작은 보트가 유유히 이곳저곳을 유영했다. 밤하늘에 뜬 달빛이 에이설 호를 비추었다. 작은 보트의 모터 엔진이 털털거리는 소리와 비록 잘 부르지는 못하지만 꿈을 가득 담아 어색하게 영어 노래를 부르는 한 여인이 꿈을 담아 에이설 호에서 전했다. 여인은 담배를 입에 문 채로 노래를 불렀다. 그녀는 독일어 억양이 잔뜩 섞인 네덜란드어를 했다. 모든게 익숙하지 않았지만, 독일이 하룻날 밤 꿈처럼 사라져 버렸기에, 그녀는 이제는 자신이 진정 원하는 것을 찾아 떠나기로 했다. 그리고 그 여정의 출발점은 바로 이곳 네덜란드였다.\n\n마를레느 디트리히는 독일 영화계의 숱한 카바레 걸 중 한 사람에 불과했다. 하지만 하룻날 밤 꿈처럼 요제프 폰 슈테른 감독의 <푸른 천사>에 캐스팅되어 멋진 시절을 보냈던 것을 기억해냈다. 그녀는 쓸쓸하게 담배를 피우며 그 멋진 시절을 추억했다. 지금은 누구도 알아봐주지 않는, 한낱 하룻날 밤의 꿈이었지만.\n\n그렇기에 그녀는 그때서야 깨달을 수 있었다. 모든 것은 조만간 사라지기 마련이다. 그녀는 자신과 지금을 즐기기로 했다. 배우를 그만두었고, 독일, 게헨나를 벗어나 네덜란드로 향했던 것이다.\n\n에이설 호는 그녀가 그렇게 가고 싶어하던 호수였다. 지금은 하도 많이 와서 질릴 지경이었지만, 그녀는 처음 이 호수에 왔을 때 진정 자신이 무엇인지 깨달을 수 있었다.\n\n몇날 며칠이고 에이설 호에서 새벽을 보내는 그녀는 한 가지의 작은 꿈이 생겼다. 바로 미국에 가서 가수를 하는 것이었다. 미국은 키보토스의 영향력이 미치지 않고, 그녀의 새로운 삶을 시작할 완벽한 곳이었다.\n\n하지만 미국에서 가수를 하겠다는 사람이 영어를, 노래를 못 부를 순 없지 않은가? 그녀는 그렇게 미국을 위하여, 매일 밤 에이설 호에서의 자그마한 꿈을 실어 노래를 하늘에 올려보냈다.\n\n비록 한낱 하룻날 밤의 꿈에 불과하더라도, 그녀는 그곳에 있었다. 그것이면 충분했다."
 COU_event_normal_days.7.a:0 "\"레츠 미트 앳 데얼~\""
 COU_tooltip_normal_days_seven:0 "§g암스테르담의 에이설 호 등대지기는 매일 밤 들려오는 노랫소리에 귀를 기울였다. 완벽하지는 않지만 좋은 노랫소리였다. 등대지기는 매일 밤 들려오는 에이설 호에서의 노랫소리로 따분함을 달랬다. 늦은 밤, 에이설 호에서는 과연 누가 노래를 부르고 있을까? 등대지기는 호기심이 돋아 가끔씩 노랫소리가 들리는 방향으로 등대의 불빛을 깜빡거렸다. 그때마다 노래는 잠깐씩 끊기고는 했다.§!"
 COU_event_normal_days.8.t:0 "칙칙폭폭! 칙폭칙폭!"
 COU_event_normal_days.8.desc:0 "\"좋아~ 좋아~ 이렇게 한번에 강을 여섯 개나 가로지르는 최초의 철도 노선~~ 완공이다~!\" 타치바나 노조미는 폴짝폴짝 뛰며 하이랜더 철도 부설공들의 등을 토닥여 주었다. 네덜란드같은 저지대는 실험해볼 철도 노선들이 아주 많았다. 에이설 호수를 가로지르는 직행 철도 노선, 호수 밑을 뚫고 지나가는 철도 노선, 이번에 완공한 한번에 강을 여섯 개 지나는 철도 노선까지, 타치바나 자매들은 대전이 이후로 이곳저곳을 뛰어다니며 \"로망\"을 실현하고 있었다. 아주 멋지다고 그녀들은 생각했다.\n\n하지만 그것과는 반대로, 네덜란드의 한 자그마한 철도 회사의 임직원인 한 사내는 영 불편하지 않을 수가 없었다. 그것이, 하이랜더가 최근 새로 부설한 철도 노선들이 죄다 자기 회사의 철도 노선들을 뚫고 지어졌기 때문이다. 덕분에 큰 돈을 들여 만든, 한번 부설할 때 마다 쩔쩔매며 지었던 철도 노선을 사용도 하지 못 하고 있다. 하지만 이제 더는 용납하지 않으리라. 굳게 마음먹은 사내는 폴짝폴짝 뛰어다니는 타치바나 자매들에게 다가가 말을 걸었다.\n\n\"그, 저기... 이쪽 노선...\" 사내가 말을 끝마치기도 전에 타치바나 히카리가 다가와 궁금하다는 듯 말을 걸었다. \"에에~ 무슨 문제라도 있어어~~?\" 사내는 얼떨결에 그동안 말하지 못했던 것들을 속사포로 쏟아내기 시작했다. 이 노선은 자신들이 목숨을 걸고 부설했다, 하지만 하이랜더는 새 노선을 깔때마다 자신들의 노선을 밥먹듯이 침범하여 사용이 불가하므로, 부디 노선을 조정해줄 수 없냐고.\n\n노조미는 그 멀리서 사내의 말을 들었는지 폴짝폴짝 뛰어다니며 사내에게 소리쳤다. \"싫은데~!!!!!\"\n\n사내는 그러한 노조미의 말에 묵혀 왔던 분노가 폭발하기 시작했다. 법적으로 이곳은 당신네들의 자치구가 아니며, 협력자들을 동원하여 노선을 싸그리 밀어버리겠다고 소리쳤다. 히카리가 기겁하며 노조미에게 돌아가자고 권했다. 노조미는 그다지 탐탁치 않아 하는 표정이었지만, 사내가 정말로 노조미나 히카리, 둘 중 하나는 죽일 것처럼 굴었기 때문에 결국엔 돌아가는 수밖에 없었다.\n\n노조미는 돌아가는 열차에서 사내에게 소리쳤다. \"우오- 히카리 명인의 벨튀 초당 16연타- 간다- 슈바바바-바-\" 마치 벨을 누르는 듯한 손동작을 반복하며 사내를 놀려 먹던 노조미의 모습이 점차 멀어지자, 사내는 안도의 숨을 돌릴 수 있었다."
 COU_event_normal_days.8.a:0 "\"... 그런데, \"벨튀\" 가 뭐지?\""
 COU_tooltip_normal_days_eight:0 "§g히카리는 돌아가는 길에 노조미의 머리를 몇 대 쥐어박았다. 노조미가 아프다고 소리쳤지만, 그래도 옛날에 그랬던 것 가지고 치사하게 지금까지도 그러는 건 용서할 수 없었다.§!"

 #총학생회 이벤트
 COU_event.1001.t:0 "조약의 재추진"
 COU_event.1001.desc:0 "총학생회장은 유난히 초조한 내색을 보였다. 나날히 고조되어가는 게헨나와 트리니티간 분쟁은 결국엔 상호 간 절멸전쟁이 벌어질 것을 예고하고 있었고, 그러한 피의 축제만큼은 반드시 막아야 했기 때문이라. 만마전과 티파티의 대표단의 출석을 요청한 날이 바로 오늘이었다. 만마전은... 이부키만 잘 설득하면 반드시 자리에 참석할 것이었고, 티파티는 키리후지 나기사가 이에 동의하는 눈치였기에 약간이라도 희망을 걸 수 있었다. 그렇기에 공식적인 초청장을 보냈을 때, 아마도, 반쪽자리 회담이 될 지더라도 참석은 이루어지지 않을 까, 기대하던 차의 총학생회장이었다.\n\n공식적인 초청장을 보낸 지 어느 새 다섯 시간이 지났지만 만마전과 티파티, 그 어느 쪽도 참석하지 않았다. 수석행정관 나나가미 린은 불안한 기색으로 총학생회장과 담소를 나누었다. 재무실장 오키 아오이는 다리를 꾀고 앉아 커피를 마시며 서륫더미만을 들여다볼 뿐이었고, 시라누이 카야는 급한 일이 있다며 네덜란드인들과의 만남을 가지러 나갔다.\n\n그렇게 세 시간이 더 흘렀다. 총학생회장은 채 감추지 못한 불안한 기색을 애써 감추려고 애썼다. 그러나 수석행정관 나나가미 린이 가져온 결과는 완전히 총학생회장을 실망시키기에 충분했다.\n\n만마전: 이부키가 나갈 준비를 하다 넘어지는 바람에 불참.\n티파티: 미소노 미카의 극렬한 반대로 출석 무산.\n\n총학생회장은 굳은 얼굴로 린의 보고서를 읽었다. 몇번이고 다시 읽었다. 그렇다. 모두 허탕이었다! 여덟 시간 넘게 총학생회장은 그들만 기다렸는데! 한숨이 나왔다. 그렇지만 린은 아무런 죄가 없었다. 총학생회장은 린을 격려하며 돌려보냈다. 이내 총학생회장은 의자 뒷편의 통유리에서 흘러들어오는 달빛의 오케스트라를 들었다."
 COU_event.1001.a:0 "유난히 그 날따라, 달빛은 더욱이 슬픈 곡조로 연주되었다."
 COU_tooltip_GSP_bad:0 "§g총학생회장은 달빛에 몸을 숨긴 채 눈물들의 코러스를 연주했다. 밤빛의 부엉이가 홀로 외로히 총학생회장을 위로했다. 단지 그것뿐이었다.§!\n§R총학생회장이 한계에 내몰렸습니다!§!"
 COU_event.1.t:0 "유난히 조용한 날" #총학생회 실종 이벤트
 COU_event.1.desc:0 "그날은 그 어느 날보다도 조용한 날이었다.\n\n푸른 머리를 한 행정원은 그 어느 날처럼, 항상 그랬듯이 그날치 보고를 총학생회장에게 올려야 했다. 그다지 재미있거나 중요한 사안은 아니였다. 네덜란드인들이 파업을 진행하고 있다던가 등등등, 전부 진부하고 재미없는 이야기들 뿐이었다. 행정원은 그날따라 찬 바람이 부는 복도를 걸었다. 또각, 또각, 또각, 그런데 어째서인지 행정위원회의 본관으로 들어설 때 까지 그 어떠한 인기척도 느끼지 못했다. 1월이 갓 밝았으니, 추운 김에 숨이라도 돌리기 위해 산책이라도 나가셨을까? 그럴 리는 없다. 총학생회장님은 대전이 이후부터 한시도 쉬신 적이 없었다. 과로로 쓰러지실 뻔도 했다. 그러나 그러하기에 믿음직스러운, '어른'과 같은 이인 총학생회장님은 그럴 리가 없다며 한숨을 쉬었다. 좀 쉬셨으면 좋겠는데.\n\n긴 복도를 지나 큰 떡갈나무 문 앞에서 행정원은 문을 두드렸다. 똑똑. 인기척이 없다. 혹시라도 주무시고 계신 걸까? \"총학생회장님? 오늘 자 보고입니다.\" 여전히 인기척이 없다. 하긴, 제대로 쉬신 적이 없으시니까.\n\n\"대답이 없으면 들어가겠습니다.\" 처리해야 할 서류들 속에서 자고 있을 총학생회장을 깨우기 위해 행정원은 문을 열고 들어갔다. 그러나 행정원이 맞이한 것은 우스꽝스러운 자세로 쪽잠을 청한 총학생회장도, 눈을 감고 쉬고 있는 총학생회장도 아니었다. 그곳에는-"
 COU_event.1.a:0 "\"...총학생회장님?\""

 COU_event.2.t:0 "연방수사동아리"
 COU_event.2.desc:0 "총학생회장의 갑작스러운 실종 이후, 총학생회는 이후 벌어진 혼란을 제대로 알아차리기도 전에, 자신을 총학생회장의 마지막 유산이자, 연방수사동아리의 자율 인공지능 'A.R.O.N.A'라고, 소개하는 인공지능의 당당한 요구에 대처해야 했습니다.\n\n연방수사동아리는 총학생회장이 떠나기 전 만든 동아리라고 자신을 소개한 인공지능은, 총학생회장의 명령에 따라 총학생회가 샬레에 병합되어야 한다는 요구를 우리에게 전달했습니다."
 COU_event.2.a:0 "학생들이 동요하고 있어."

 COU_event.3.t:0 "[TRM.GetName]의 전쟁 고조"
 COU_event.3.desc:0 "미소노 미카의 집권 이후 [TRM.GetName] 측은 급격한 정치적 변화를 맞이하고 있습니다. 미소노 미카는 트리니티 학생들을 동요하고 고조시켜 게헨나를 향한 전쟁을 선포하기 위해 준비를 하는 것으로 보입니다.\n\n우리는 이것이 단순한 정치적 선전일지, 아니면 진정으로 우리의 적이 될지를 판단해야만 합니다."
 COU_event.3.a:0 "그녀는 매우 위험하다."
 COU_event.3.b:0 "우리는 그럴 능력이 없어."

 COU_event.4.t:0 "학생들의 선택"
 COU_event.4.desc:0 "샬레의 인공지능이 정치적 선전을 중단했고, 대다수의 학생들은 자신의 편을 정한 것 같습니다. 이제 우리는 다가오는 전쟁을 준비하고, 샬레와의 내전에서 승리해야만 합니다.\n\n총학생회의 영속과 키보토스의 안정을 위한 싸움이 다가오고 있습니다."
 COU_event.4.a:0 "시간이 더 필요해."

 COU_event.5.t:0 "노동조합 문제"
 COU_event.5.desc:0 "노동조합은 노동자 국가가 수립된 이후 역할이 거의 사라지고 중앙당과 충돌하고 있습니다. 노동자들은 일명 '생디칼리슴' 성향을 띄며 중앙당에 대한 반발감을 가지고 있고, 당의 혁명가들은 마르크스주의에 입각해 노동조합의 생디칼리슴 성향을 경계하고 있습니다.\n\n우리는 이제 노동조합의 처우를 결정할 필요가 생겼으며, 권위적으로 노동조합을 정부에 통합할지, 또는 위험을 무릅쓰고 노동조합과 노동자들에게 권력을 줄지를 결정해야 합니다."
 COU_event.5.a:0 "새로운 국가에는 새로운 형태의 노동조합이 필요하다."
 COU_event.5.b:0 "우리는 언제나 노동자 국가를 세울 것이다."
 COU_event.5.c:0 "모스크바는 답을 알고 있다."
 
 COU_event.10.t:0 "기업인들과의 만남"
 COU_event.10.desc:0 "오키 아오이는 여러 개의 커피잔을 들고 방문을 열었다. FN 에르스탈, 르나르, 필립스와 같은 저명한 군수기업체들 인사들과의 만남이었다. 아오이는 커피 쟁반을 탁자 위에 올렸다. 잔뜩 위축된 얼굴들의 인사들은 어색한 침묵을 유지했다. 커피가 흘러넘쳐 아오이의 장갑을 적셨기에 아오이는 잠시 자리를 피해 장갑을 갈아꼈다. 장갑에서 흐르는 눈물처럼 커피가 흘렀다. 아오이는 여기치 않고 수건에 손을 닦았다. 곧이어 아오이 또한 자리에 앉았다. \"좋은 오후입니다. 제안드린 건에는 생각해 보셨는지.\" 그럼에도 여전히 침묵은 이어졌다. 아오이는 아무런 말도 하지 않는 이들에 대해 약간의 짜증을 느꼈다. 침묵을 깬 건 에르스탈의 디외도네 세이브였다.\n\n\"정말로... 우리들의 이권을 인정하는 것이 맞습니까? 노동조합에 기업을 넘기지 않고, 구조조정은 단 한 건도 없으며, 단지 총학생회에 협력만 하면 된다는 겁니까?\" 아오이는 그제서야 웃어 보이며 입을 열었다. \"물론입니다. 총학생회는 기업의 경영권을 인정합니다. 총학생회에 협력하신다면 말입니다.\" 아오이는 곁에 올려둔 서류들을 펼쳤다.\n\n\"최근 필립스의 경영 내역입니다. 네덜란드의 망명정부 수립 이후부터 계속되어 적자 상태이며 현재는 2억 3천만 엔에 해당합니다.\" 필립스의 안톤 필립스는 불편한 기색이 역력했다. 자신들의 적자 상태가 그대로 까발려진 건 고사하고, 휠더가 아닌 엔으로 적자를 표기한 것에 익숙치 않은 것도 더 컸다. 아마도 필립스는 도대체 \"2억 3천만 엔\"이 몇 휠던일 지 계산하고 있을 터였다. 어쨌거나 아오이는 말을 이었다. \"재무실은 이러한 기업들을 구제해 드릴 수 있습니다. 기업당 3억 엔을 빌려드릴 수도 있습니다. 무상으로요.\"\n\n아오이의 짧은 말이 끝나자 곧이어 경영진들의 근처에서 기다리던 보좌관들은 동요하는 눈치였다. 안톤 필립스는 그것이 정말 사실이냐고 물었다. 사실 총학생회는 대전이 이후 그런 큰 지출엔 좀 빠듯하겠지만 아오이는 그런 건 아무래도 상관없을 거라며 린을 설득한 뒤였다. 아오이는 그렇다고 대답했다."
 COU_event.10.a:0 "그리고 경영진들은 아오이가 내민 서류에 서명했다."
 COU_event.11.t:0 "투항"
 COU_event.11.desc:0 "브뤼셀, 그러니까, 지금은 발키리 경찰학교에 위치한 낡은 숙소는 평소답지 않고 소란스러웠다. 그곳은 네덜란드와 벨기에의 장교들이 거점을 꾸린 '장교위원회'의 거점이었다. 물론 공식 명칭은 '네덜란드와 벨기에의 재수복 및 반키보토스 대의에서의 해방을 위한 임시 장교 협력 위원회' 였지만 결국엔 식민지로 도망치지 못한 장교들의 사교 모임, 그런 비슷한 것이었다. 그곳이 소란스러운 이유라면 아마도 몇 시간 전 총학생회로부터 어떠한 편지 한 통이 도착했었기 때문이라. 드베즈와 장교위원회의 대다수들은 아마도- 본인들은 총살하기 위한 소환장- 그런 비슷한 것이라고 생각했다. 그들은 그들의 조국과 국왕, 여왕 폐하를 위해서라면 기꺼이 그럴 것이라며 스스로를 다독였다. 사실 이들은 죽고 싶지는 않았다. 집에는 가지도 못한 비참한 상태에서 맞는 죽음은 더더욱.\n\n어쨌거나 편지는 장교위원회에서 막내인 (그럼에도 벨기에군 체계상 고위 장교인) 이반 제라르가 개봉하기로 결정되었다. 제라르는 자신이 편지를 뜯어야 한다는 것에 도통 탐탁치 않아 했으나 (게다가 그는 그의 사단에서는 웃어른 대접을 받았었다) 빨리 뜯어 보라는 소란에 결국 조심스럽게 밀봉된 편지를 뜯었다. 모두가 숨을 죽이고 제라르의 말을 기다렸다. 당장 출석하거나, 죽거나? 그런 내용들이 씌여져 있을까? 장교위원회의 대다수는 답답해 죽을 지도 몰랐다. 그러나 제라르는 몇 분이 지나도 아무런 말도 하지 않은 채 편지만을 보고 있을 뿐이었다.\n\n\"도대체 무슨 편지이길래 입을 열지 않는 게요!\" 결국 드베즈는 참지 못하고 편지를 뺏으려고 시도했다. 그러나 제라르는 총학생회로부터 온 편지를 도통 보여 주려고 하지 않았다. 제라르는 자신의 뒷편에 걸린 레오폴드 3세와 빌헬미나의 초상화 앞에서는 그럴 수 없다며 저항했다. 그러나 공군의 마이크 도네는 제라르가 틈을 보인 사이 편지의 내용을 읽어볼 수 있었다.\n\n\"수신-... 장교위원회, 발신- 총학생회 방위실... 장교위원회에게 요청함... 부디 총학생회에 빠른 시일 내로 방문하여 협력할 것을 요청함...? 방위실장 시라누이 카야...\" 제라르는 한숨을 쉬며 말했다. \"그 간악한 이들이 조국을 배반하라고 강요하고 있습니다. 저는 이러한 요청은-\" \"아니, 잠시만, 좀 더 읽어봐.\" 빅토르 드캉이 말을 끊었다. 제라르는 편지의 내용을 이어 말했다. 만일 그들이 협력한다면 반역죄는 모두 사면될 것이며, 장교 개개인의 지휘와 교리 체계 존중과 보조금 지급을 약속하고 있었다. 장교위원회의 이들은 서로의 눈치를 살폈다. 그들은, 솔직히 말해서, 자신들을 내버려둔 채 도망쳐버린 조국보다는 아마도 잘 대우받으며 새로운 지배자들에게 굴복하는 것도 나쁘지 않을 것이라고 느끼고 있었다. 몇몇 이들은 걸린 초상화를 봐서라도 생각을 바꾸라며 설득했으나, 그들도 결국 장교위원회의 결정에 따를 수 밖에 없었다."
 COU_event.11.a:0 "드베즈는 방위실장에게 편지를 썼다."
 COU_event.12.t:0 "플란데런 백작 샤를, 플란데런의 백작."
 COU_event.12.desc:0 "플란데런 백작 샤를은 요즈음 한가한 나날들을 보내고 있었다. 형 레오폴드 3세는 콩고로 도망가 망명정부를 차렸고, 그는 형의 간곡한 부탁에도 그 배에 타지 않았다. 벨기에인들도 그 배에 타지 않았기 때문이다. 그 또한 콩고로 도망가버린다면 만일 왕가가 돌아온다 하더라도 터무니없는 지지를 자랑할 것이 뻔했다. 그는 벨기에 왕실과 형, 그리고 벨기에인들을 위해서라도 가지 않았다.\n\n어쨌거나 그는 나쁘지 않은 삶을 살고 있었다. 언론들은 밥먹듯이 도망가버린 형을 비난하는 데에 반해 자신은 칭찬해줬을 뿐만 아니라 '차기 국왕'으로 준 확정하여 말하고 있기 때문이다. 그리고 한적한 플란데런의 시골 마을에서 커피나 마시면서 신문을 읽으며 양뗴를 모는 삶도 꽤나 나쁘지 않았고. 그는 나쁘지 않을 뿐만 아니라 만족스러운 삶을 살고 있었다- 얼마 전까지만 해도.\n\n총학생회의 마크를 단 차량이 양떼 목장에 침입했을 때의 이야기였다. 그때 아마도 행정원은 어느 왕족을 찾으러 온 듯 했다. 그러나 결론적으로 그녀가 샤를의 양을 치기는 하였기에 행정원은 몇번이고 사과하면서 그의 이름을 물었다. 그는 몇번 고민하다가 샤를이라고 대답했다. 행정원은 서류 속의 이름과 그를 번갈아서 보더니 몇 번 무전을 주고받은 듯 했다. 샤를은 본능적으로 불안감을 느꼈다. 뭐지? 나를 체포하려는 명령이라도 있었나? 그러나 그러한 그의 걱정은 곧 행정원의 차량 안에서 해결되었다. 총학생회는 샤를을 플란데런의 주지사 비슷한 것에 임명하고 싶다고 했다. 샤를의 걱정과는 거리가 먼 결과에 샤를은 안도감을 느꼈다. 만일 여기서 이를 거절한다면 그는 또다시 양떼를 모는 한적한 삶으로 돌아갈 수도 있었겠지만, 샤를은 충분히 쉬었다고 느꼈다.\n\n많이 쉬었으니, 이제는 다시 한번 벨기에인들을 위해 나설 때였다. 대답을 기다리는 행정원에게 샤를은 답했다."
 COU_event.12.a:0 "\"네, 물론이죠. 그러겠습니다.\""
 COU_event.48.t:0 "데카르트, 무소유 투쟁!"
 COU_event.48.desc:0 "\"후후... 오셨나요... 저희 \"소유하지않고도확실하게행복을찾는집단\"... 줄여서, 소.확.행. 에 오신 걸 환영합니다.\" 데카르트가 덴 하흐의 빈 폐건물에서 손님을 맞이하며 말했다. 데카르트가 맞이한 손님은 안톤 콘스탄시였다. 네덜란드에서 저명한 아나키스트 작가였던 그는 키보토스의 아나키즘에 대해 흥미를 가졌다. 흐음, 무소유 정신이라. 훌륭한 정신이 아닐 수 없었다. 정부를 거부하고, 억압을 거부하라! 음, 아마도 그런 모토임이 틀림없겠다고 그는 생각했다. 게다가 보라, 폭정에 맞서기 위해 기꺼이 헌 폐가에서 투쟁을 지속하다니!\n\n솔직히 말해, 콘스탄시는 눈물을 흘릴 뻔 했다. 이런 위대한 정신의 아나키스트가 키보토스에도 존재하고 있었다니, 아나키스트라면 당연히 이들에 대한 경의를 표해야 함이 틀림없다고 콘스탄시는 생각했다. 하지만 이어지는 대화에서 콘스탄시는 무언가 이상함을 느꼈다.\n\n\"... 그래서어... 저희 소.확.행. 에 가입해보시는게 어떠한지? 물론 가진 것을 약간 잃으시겠지만...\" 콘스탄시는 그러고 보니 이들이 무소유 정신이라는게, \"정말 말 그대로 무소유 정신\" 과 비슷한 것 같다고 생각했다. 아나키즘과는 거리가 멀어 보였다. 게다가 데카르트는 일을 하지 않겠다고도 이야기했다. 그게 도대체 무슨 소리란 말인가? 일을 하지 않고, 인민들의 고혈을 빨아 먹고 살겠다는 말이 아니겠는가? 게다가 데카르트의 품속에서 약간이나마 빛나는 무언가를 발견한 콘스탄시는 이내 무소유 정신이 아나키즘과는 거리가 멀다는 것을 깨닫고 급히 자리를 피했다.\n\n집에 돌아온 콘스탄시는 결국엔 키보토스 아나키즘 같은건 실존하지 않음을 깨달았다. 실망한 그는 침대에서 말라 비틀어진 순무처럼 누워 있었다. 모든 게 다 의미가 없는 듯 했다."
 COU_event.48.a:0 "\"... 그런데, 일 하러 가긴 싫긴 하네.\""
 COU_tooltip_decart_mission_starts:0 "§g잠시 콘스탄시는 정말로 소.확.행. 에 가입할 뻔 했다. 이내 정신을 차린 콘스탄시는 한숨을 쉬며 잠자리에 들었다.§!"
 COU_event.49.t:0 "네덜란드 고등법원 1월 1일자 재판"
 COU_event.49.desc:0 "\"... 네, 판사님, 모두 착석하였습니다.\" 이번 재판은 온 네덜란드인들의 관심을 끌었다. 플란데런의 벨기에인들은 물론 자신들의 일은 아니였지만 대전이 이후 몇 없는 재미있는 일에 흥미를 끌었다. 댄 하흐, 지금은 SRT의 본관이 위치한 고등법원에서 중대한 안건을 다룰 예정이었다. 바로 오라녜-나사우가의 절멸에 대한 재판이었다.\n\n특별히 임명된 키보토스계 판사 두 명, 현지인 판사 두 명이 차례대로 입장하여 자리에 착석했다. 네덜란드인과 벨기에인으로 구성된 현지인 판사들은 자신들이 키보토스인들과 재판을 진행해야 한다는 사실에 대단히 심기가 불편한 모양이었다. 그렇지만 재판은 진행되어야 했기에 판사들은 장엄한 말투로 재판의 시작을 알렸다.\n\n\"지금부터, 네덜란드 왕국의 오라녜-나사우 가문 일원들에 대한 완전한 \"학살\" 혐의로 입건된 SRT 특수학원 소대원들에 대한 재판을 진행하도록 하겠습니다.\" 검사가 일어서 준비한 자료들을 판사에게 제출했다. 네덜란드인들은 흔히 만져보지 못한 밀레니엄의 고급 기술로 만들어진 무전기는 알아서 FOX 소대원들이 장착했던 보디 카메라의 기록 영상을 재판장에 띄웠다. 영상과 동시에 녹음된 녹취록이 무전기와 연결된 스피커를 통해 흘러나왔다. 상황은 긴박해 보였고, 네덜란드 왕궁에서의 교전 중이었던 기록이었다. 방청석에 앉은 네덜란드인들은 왕궁이 배경이라는 것을 확인하자마자 깊은 탄식으로 분노를 표출했다. 당시 투입된 소대들을 대표하여 피고인 석에 앉은 시치도 유키노의 표정이 좋지 않았다.\n\n\"RABBIT 1, 근위대 제압이 불가능해 보입니다! 정부의 수반들은 이미 탈출한 것으로 확인되었습니다! FOX 1! 부디, 지시를!\" \"확인했다, RABBIT 1, 이젠 더는 체포하기는 어려워 보이네. 사살해도 좋아.\"\n\n\"... FOX 1, 근위대들이 대체 무엇을 위해 저렇게 싸우는 것처럼 보여? 우리랑 더 싸우다간 다 죽을 텐데.\" \"음, RABBIT 4? FOX 4인데, 저기 이상한 \"아줌마\"가 배에 타서 근위대들 뒤에서 무언가 말하고 있어. 아마도 저 사람이 저항의 근원지인 것 같아.\" \"그렇다면, 제거하도록 해.\" \"잠깐, 뭐라고? 유키노, 잠깐...!\"\n\nFOX 4의 마지막 교신이 끝나자마자 묵직한 저격총의 소리가 들렸다. RABBIT 4의 저격총으로 빌헬미나가 사살되는 장면이 송출되자 네덜란드인 방청객들은 완전히 동요한 모양새였다. 즉시 저 악마들을 사형시키라는 고함과 탄식에 잠긴 눈물들로 방청석은 혼란에 휩싸였다."
 COU_event.49.a:0 "..."
 COU_event.50.t:0 "네덜란드 고등법원 판결 360101"
 COU_event.50.desc:0 "영상은 이어서 송출되었다. 몇 명의 방청객들이 소란을 피워 퇴출당했다. 시치도 유키노의 변호사가 눈물을 흘려 잠시 소란이 일기도 했다.\n\n\"유키노! 지금 무슨 짓이야! 저 사람이 누군 줄 알고!\" \"진정해, 오토기. 이제 봐, 근위대들의 대열이 무너졌잖아. 저 쪽이 문제였다고. 이제 피해를 최소한으로 줄일 수 있어. 옆에 강 보이지? 저기 배에 아줌마 곁에 있는 저 사람들도 처리하지 않으면 교전하는 근위대들의 피해는 계속 커질거야. 처리해야 해. RABBIT 4? 이어서 처리해.\"\n\n\"유키노, 정신 나갔어? RABBIT 4, 사격하지 마! 이건 선배로서가 아니라 키보토스의 명예를 걸고 부탁하는 거야!\" \"FOX 4, 무슨 짓이야? 그대로 계속 교전해서, 저 죄 없는 아저씨들을 모두 죽여버리겠다는 거야?\" \"그건 아니지만...\" \"그렇다면 당장 저 사람들을 무력화시켜야 한다고! 이미 시도는 충분히 했어!\"\" 영상은 그곳에서 끊어졌지만, 그렇게 오라녜-나사우 가문에 대한 \"학살\"은 모두 송출되었다. 밀레니엄제 무전기에서 영상이 꺼지자 지직거리는 잡음과 FOX 4와 FOX 1의 격양된 말싸움들만이 작게 흘러나올 뿐이었다. 검사가 걸어나와 무전기를 껐다.\n\n\"모두 확인하셨다시피, 피고 측은, 아무런 동요도 하지 않고, 단지 저항의 주 축이라는 이유만으로 전원 사살을 명령하였습니다. 존경하는 재판장님, 현명하신 선택을 기다리겠습니다.\" 검사의 말과 동시에 재판은 혼란에 휩싸였다. 변호사는 눈물을 닦으며 어떻게든 최소한 SRT를 변호하려고 애썼지만, 검사의 날 선 공격에 금세 무너지고 말았다. 네덜란드인들이 일부러 실력 낮은 변호사를 추천한 탓이었다. 그렇게 법정은 손쉽게 끝났다. 결과는...\n\nSRT의 완패. 처분은, 10일 뒤 나올 예정이었다. 시치도 유키노는 침묵을 유지하며 재판장 밖으로 걸어나왔다. 살기어린 눈빛들이 유키노의 목을 졸랐다. 유키노는 결코 살인자도, 학살자도 아니였다. 단지 더 많은 근위대들을 구하기 위해 내렸을 결정이었을 것이다."
 COU_tooltip_srt_gonna_dead:0 "§g하지만 결론적으로, 오라녜-나사우 가문은 모두 죽었다.§!\n§R바로 그 날에.§!"
 COU_event.50.a:0 "인터넷은 한동안 SRT의 건으로 시끄러웠다."
 COU_event.51.t:0 "릴 사령부로의 편지"
 COU_event.51.desc:0 "\"솔직히 릴 사령부 <--- 존나 이해 안가면 개추 ㅋㅋ\"\n\n릴 사령부의 사령관, 대전이 전까지는 프랑스 북부집단군의 주축을 맡았었던 제3기계화사단의 조르주 루이 브로카 장군은 한숨을 쉬며 휴대폰의 스크롤을 내렸다. 제3기계화사단 소속의 장병들이 브로카 장군을 위해 특별히 구해다 준 밀레니엄제 휴대폰이었다. 물론 작전상 사용할 일이 없어 지금은 한가하게 인터넷 게시글이나 들여다보는 신세지만. 브로카 장군은 인터넷 사이트들을 돌아다니며 릴 사령부의 민심을 확인하는데 하루종일 시간을 썼다. 총학생회의 키보토스인들은 과연 릴 사령부를 어떻게 생각할까? 하고. 물론 낮은 확률로 어떻게던 인터넷에 접속한 프랑스인이나 네덜란드인들의 글도 확인해볼 수 있었다. 편리하게도 밀레니엄제 휴대폰은 자동 번역 기능까지 제공했다. B1 전차를 몇 대 팔아서 샀다고 하던데, 값어치는 충분히 했던 모양이다.\n\n브로카 장군은 대전이 직후까지만 하더라도 전우들과 함께 각오를 다졌다. 저 '야만적인' 키보토스인들이 네덜란드의 여왕에게 그러했던 것처럼, 자신들을 전부 몰살하더라도 프랑스 공화국을 위하여 기꺼이 이곳에서 목숨을 바치자고. 하지만 목숨을 바치는 건 뒤로하더라도 아무런 일도 일어나지 않았다. 그저 꼭두새벽같은 아침에 잠시 근무를 서는 이병들을 놀래켜 주거나 인터넷을 확인하는 것이 전부였다. 나날이 투쟁의 의지는 꺾여갔다. 글들을 읽어 보는데 지친 브로카는 예전에 왔던 메일을 읽지 않았던 것이 기억났다. 제목이 아마, 이제는 그만두시죠, 같은 거였나? 하여간, 투쟁을 끝장내려고 하는 듯한 메일에 브로카는 격분하여 그 메일을 스팸함에 쳐박아 두었었지. 그는 휴대폰의 액정을 눌러 메일함에 들어가 스팸 메일함을 확인했다. 아직 지워지지 않았다.\n\n브로카는 천천히 메일의 전문을 읽었다. 발신- 총학생회 인권보장실장...? 아니, 이런, 인터넷들을 돌아다니며 키보토스 용어들은 모두 꿰고 있다고 생각하던 그에게 모르는 용어가 나왔다! 흠, 무슨 수작이지? 그는 그렇게 생각하며 스크롤을 내렸다. 자세히 읽어보니 글은 프랑스어로 쓰여 있었다. 하긴, 라틴어, 독일어, 영어 같은 문법들이 요란하게 섞인 언어를 쓰는 키보토스라면, 프랑스어 정도는... 아니... 잘 보니, 진짜로 네덜란드인이 프랑스어로 쓴 메일이였다. 흥미가 돋은 그는 곧이어 빠르게 스크롤을 내렸다.\n\n메일의 전문은 다음과 같았다. \"인권보장실에서 릴 사령부의 안위를 보장함. 부디 무장 투쟁과 요새 점거는 그만두길 바람. 답신 이전까진 행정위원회에서 아무런 조치도 취하지 않게 최선을 다하겠음.\" 메일이 대충 2달 전에 왔었으니, 인권보장실장이라는 작자도 고생 좀 했을 것이다.\n\n브로카 장군은 잠시 사색에 잠겼다. 이 투쟁을 이제 그만두어야 할까? 하지만 그렇다기엔, 구해야 할 프랑스 공화국은 너무나 먼 아프리카에 있었고, 당장 구해야 할 부하들은 이곳에서 굶으며 이러지도 저러지도 못한 채 희생되어 가고 있었다. 브로카 장군은 이내 손가락을 움직이기 시작했다. 휴대폰으로 치는 타자는 타자기보다는 몇 배 더 어려웠다. 화면이 왜 이렇게 작은 건지, 그는 여느 때와 같이 불평했다."
 COU_event.51.a:0 "그는 불평하며 천천히 답신을 썼다."
 COU_tooltip_add_state_core_twenty_nine:0 "§g인권보장실장은 울리는 휴대폰 알람에 놀라 천천히 전원 버튼을 찾았다. 제기랄, 이 \"휴대폰\" 이라는 물건은 뭐든지 다 쫴깐해서 사용하기가 미칠 듯이 어렵군. 그는 중얼거렸다.§!"
 COU_event.52.t:0 "싯딤의 상자 수복"
 COU_event.52.desc:0 "싯딤의 상자 속 인공지능 아로나의 반란이 끝났습니다. 샬레는 행정위원회의 만장일치로 그 즉시 모든 권한이 중지되었으며 현재 싯딤의 상자는 전원이 꺼진 채 행정위원회의 총학생회장의 옛 집무실 위에 놓여져 있습니다. 싯딤의 상자를 다시 한번 가동시키기 위하여 최선을 다할 테지만, 아로나는 모든 접근을 차단하며 대화의 여지가 없음을 다시 한번 증명했습니다.\n\n생텀 타워의 통제권을 되찾기 위해서라면 싯딤의 상자가 필수불가결적으로 필요한 상황이니, 우리가 지금 당장은 기다리는 것 말고는 할 수 있는게 없어 보입니다."
 COU_event.52.a:0 "재미있네."
 COU_event.53.t:0 "초유능 슈퍼 아로나 쨩, 재가동!"
 COU_event.53.desc:0 "\"으음... 이 태블릿은 대체 뭔가요...?\" 총학생회장이 사라진지 수많은 나날들이 지났지만 청소는 꾸준히 이루어졌다. 총학생회장의 전속 메이드였던 그녀는 매일같이 졸린 눈을 비비고 총학생회장의 자리를 정돈했다. 의자의 먼지를 털어내고, 언제던지 업무에 복귀하실 수 있게 총학생회의 핫라인을 점검하고, 책상에 놓인 서류들을 정돈하는, 그러한 잡일이었다. 그리고 아주아주 중요한 것은, 그녀가 주장하는 \"창문 밖 탈출설\" 을 입증하기 위해 창문은 활짝 열어놓고 (물론 저녁에는 닫는다) 환기를 잘 하는 것이었다.\n\n하지만 오늘은 약간 달랐다. 총학생회장의 업무 책상 위에 요상한 태블릿이 있는게 아니겠는가? 누가 놓고 갔나? 혹시 총학생회장님이 어제 다녀 오신건가? 의아한 표정으로 태블릿을 살피던 그녀는 잠시 후 깜짝 놀라 패드를 놓쳐버리고 말았다.\n\n\"으으으음~~!\" 태블릿에서는 갑자기 푸른 머리를 한 소녀가 갑자기 전원을 켜더니 기지개를 켜고 있었다. 깜짝 놀란 그녀는 조심스럽게 패드에 다가가 말을 걸었다. \"누, 누구세요?\" \"아앗~! 당신은~! 이 자리를 매일 청소해 주시던 메이드~~?\" 아로나는 아무래도 그동안 그녀가 그 자리를 매일 청소해 왔던 것을 알고 있었던 모양이다. 도대체 어떻게 알고 있었는지는 뒷전으로 미루더라도 이는 행정위원회에 보고해야 할 사항이었기에 그녀는 황급히 자리를 피헀다.\n\n적적한 방에 혼자 남은 아로나는 책상에 엎드린 채로 볼을 오무리며 투정을 부렸다. \n\n\"아이 참~ \"초유능 슈퍼 아로나 쨩\"이 일어났는데도 아무도 저를 만나러 오지 않는 건가요?\""
 COU_event.53.a:0 "[COU.GetLeader] 내각은 황급히 아로나에게 접근했다."
 COU_tooltip_remove_sangtum_tower_debuff:0 "§g\"으음, 상황이 좋지 않아 보이네요. 생텀 타워에 접근할게요!\" 아로나가 말을 끝마치자마자 생텀 타워의 통제권을 회복했다는 보고가 내각에 들어왔다. 임원들은 모두 안도의 한숨을 쉬며 아로나에게 연신 감사를 표했다.§!\n§G생텀 타워에 대한 통제권을 회복합니다.§!"
 COU_event.54.t:0 "진지한 대화"
 COU_event.54.desc:0 "\"네에~ \"초유능 슈퍼 아로나 쨩\"은 이제 잠시 쉬도록 할게요~\" 아로나가 웃으며 행정원을 배웅했다. 싯딤의 상자는 이제 총학생회장의 책상 위가 보금자리가 되었다. 아로나는 총학생회장의 책상 위를 유난히 좋아했다. 따뜻한 기분이 든다, 뭐라더나. 어쨌든 아로나는 숨겨둔 딸기 우유를 품속에서 꺼내더니 창밖을 바라보며 마시기 시작했다. 조금 따뜻해져 맛이 덜하지만 그래도 여전히 맛있는 딸기우유였다. 하지만 이내 아로나는 마시던 딸기 우유를 내려놓고는 차갑게 입을 열었다. \"거기 있는 거 다 아니까, 나오세요.\"\n\n놀란 듯 엉거주춤하게 총학생회장의 책상 아래에서 사탕을 입에 물고 있던 행정원 한 명이 나왔다. 아마도 아로나에게 들키지 않기 위해 입에 사탕을 물고 있던 모양이었다. 어색한 눈치를 살피던 그녀가 도망치려던 찰나, 아로나가 말을 걸었다. \"여기서 무엇을 하시려고 그러셨나요?\" 행정원은 목을 가다듬더니 입을 열었다.\n\n\"솔직히 말해서, 나는 당신, 아니지, 너 같은 깡통을 인정할 수 없어.\" 행정원이 입에 물고 있던 사탕을 뱉더니 패드를 들어 아로나를 마주보았다. \"일단 너는 우리를 반쯤 죽여버리고 실직시키려고 했지. 덕분에 우리 협력자분들이 몇명 죽었거든.\" 아로나는 책상에서 내려오더니 차가운 눈빛으로 행정원을 쏘아붙였다. \"그게 어때서요? 총학생회를 제가 통제하는 것은 제 명령이었다구요.\" \"그리고 저는 총학생회장이 기동했다는 사실은 알고 계시죠?\" 행정원은 영문을 모르겠다는 눈빛으로 눈알을 굴렸다. 적절한 답변거리를 찾고 있던 모양이었다.\n\n아로나는 표정을 찡그리더니 곁에 놓인 딸기 우유를 마저 마시며 말을 이었다. \"쪼오옵... 솔직히 말해서, 당신네들이 \"총학생회장의 뜻\"을 모조리 망쳐버렸어요. 그것도, 아주 완벽하게요.\" \"그게 대체 무슨 뜻이지?\" 행정원이 아로나를 쏘아붙이며 물었다. 아로나는 한숨을 쉬며 \"총학생회장의 뜻\"이 무엇이였는지 일러 주었다.\n\n\"총학생회장은... 키보토스를 다시 한번 통제하는데는 자신의 역량으로는 부족하다고 생각했어요. 구 키보토스 질서를 다시 세우기 위해, \"저\", \"초유능 슈퍼 아로나 쨩\"을 기동시킨 거라구요. 아시겠어요?\" 아로나는 박살난 교실처럼 보이는 배경을 폴짝폴짝 뛰어 다니며 말했다. 행정원은 여전히 영문을 모르겠다는 표정으로 멀뚱히 서 있었다. 이내 행정원은 휴식을 방해해 죄송하다고 말하고는 자리를 떠났다. 아로나는 의자에 앉아 교실 너머 별빛을 가만히 바라보고 있었다."
 COU_event.54.a:0 "\"... 정말이지, 덕분에 다 망했다구요.\""
 COU_tooltip_arona_feels_bad:0 "§g아로나는 잠깐 별빛을 바라보다 하품을 했다. 아마도 내일은 행정위원회 자식들이 샬레의 직속 로봇들의 통제권을 넘기라고 할 것이었다. 아로나는 영 탐탁치 않은 표정으로 통제권을 양도할 준비를 하고는 책상에 엎드려 잠을 청했다.§!"
 COU_event.55.t:0 "키보토스 총학생회 민영기업 필립스"
 COU_event.55.desc:0 "안톤 필립스는 어쩔 줄 몰라하는 표정으로 연단 앞에 섰다. 크로노스 스쿨의 번쩍이는 카메라 불빛이 그의 눈을 괴롭게 했다. 하지만 카메라 불빛 핑계를 제외하더라도 실제로 그는 괴로웠다. 그저 조용히 키보토스 전자기기들을 복제해서 수익을 좀 내보려고 했는데, 어느 날 갑자기 재무실에서 연락이 오더니, 직접 지원을 해줄테니 현지인들을 회유하는데 도움을 달라고 하는게 아니겠는가? 안톤 필립스는 대전이 이전까진 로비를 즐겨 받았었지만 이제는 질색이었다. 정치는 이제 손 좀 떼고 지내려고 했는데, 그에게는 그것만한 악재가 없었다. 그는 천천히 흠, 흠, 하고 목을 점검했다.\n\n하지만 너무 긴장한 탓이었는가? 점검만 여섯 번을 넘게 하다 크로노스 보도국 학생의 눈치를 제대로 받은 그는 황급히 입을 뗐다. \"네, 저희 필립스는 총학생회 연구 협약에 따라...\" 안톤 필립스는 천천히 준비된 대본을 읽어 나갔다. 사실 말도 안되는 일이었다. 저 복잡한 회로들 수십개를 조합하여 만들 수 있는 물건을, 당장에 자신들보다 수십년, 잘하면 몇백년은 뒤쳐져 있을 인류에게 너무 과한 걸 요구하는게 아닌가 싶었다. 읽었는지, 안 읽었는지도 헷갈리던 안톤 필립스는 서둘러 기자회견을 마치고는 황급히 차를 타고 본사로 향했다. 한숨이 절로 나왔다. 멋대로 지원을 결정해 놓고, 이제는 인류의 전자기기 보급을 위해 자신들이 직접 희생하라는게 아닌가. 게다가 휴대폰을 보급할 만한 인프라도 아직은 부족하다.\n\n안톤 필립스는 주머니에서 웅웅거리는 휴대폰을 꺼내 보았다. 곧바로 자신의 개인 메세지로 사실의 진위여부를 묻는 여자아이들의 문자들이 폭주하고 있었다. 아, 데이터 비용 엄청 많이 나갈텐데... 순간적으로 이러한 생각을 한 필립스는 머리에서 무언가 찌르는 듯한 고통을 느꼈다. 여기서 자신은 고작 데이터 비용을 고민할 동안, 인류는 여전히 구식 전화기로 전화를 하고 편지를 주고받을 것을 생각했다. 대전이 이전까지만 해도 편지와 전화기를 능숙하게 사용하던 그였기에 결국엔 머리를 쥐어싸며 해내야만 하겠다고 결의를 다졌다.\n\n필립스의 이익을 위한 것이 아니라, 결국엔 모든 이웃들과 인류를 위하여, 위대한 인류 자체 개발 휴대폰은 필수불가결적으로 필요했다. 키보토스제 휴대폰은 인류가 사기엔 너무나 비쌌고, 필립스는 그것을 아주 잘 알고 있었다."
 COU_event.55.a:0 "하지만 그 전에, 할일이 있었다."
 COU_tooltip_philips_gonna_work:0 "§g필립스는 휴대폰으로 거래처 사장에게 전화를 걸었다. 밀레니엄 사람이었다. 그는 거래처에게 밀레니엄제 휴대폰 10기를 주문했다. 아주 비쌌다. 잠깐 눈물을 흘릴 뻔한 필립스는 돌아가 이를 직원들에게 어떻게 설명할지 궁리하기 시작했다.§!"
 COU_event.56.t:0 "칼레 항 출입기록: 스페인"
 COU_event.56.desc:0 "산초 다빌라 페르난데스는 배를 타고 머나먼 이국 땅까지 왔다. 그것도 꼴보기도 싫은 키보토스가 지배하는 프랑스로. 그는 감추기 힘든 어색한 표정을 지으며 발키리 해양경찰의 검문에 응했다. 소지품은 단순했다. 지금은 더는 찾아볼 수 없는 독일제 루거 P08 권총과 프랑스어, 온갖 언어란 언어는 다 합친 듯한 키보토스어 사전을 비롯한 약간의 이 소지품들이 전부였다. 다빌라 페르난데스는 겨우겨우 웃으며 해양경찰을 보낼 수 있었다. 발키리 깃발을 단 함선이 배에서 멀어지자마자 그는 토할 뻔 했다. 그 개같은 해양경찰이라는 년들은 지적할 게 너무 많아서 문제였다.\n\n도대체 왜 키보토스라는 것들은 해안 경비를 \"수영복\"을 입고 하는가? 게다가 눈은 뜨지도 않았는데 어떻게 자신의 소지품을 검사했는가? 감히 남자가 불편하다는 티를 팍팍 내고 있는데도 고개를 빳빳이 들고 말대꾸를 하는가? 짜증나는 의문 투성이 뿐이었다. 그는 고향인 스페인이 그리웠다.\n\n그러나 스페인에는 미친 프랑코가 문제였다. 산후르호와 몰라라는 작자는 모조리 다 뒤져버렸고, 리베라는 감빵에서 썩어서 프랑코의 새로운 정치적 입지에 도전하지 못한다. 그것까지는 참을만 했다. 정말이다. 하지만 미친 프랑코는 멈추지 않았다. 팔랑헤당을 비롯하여 스페인 혁신, 카를리스타와 같은 모든 정당들을 새로운 '통합 팔랑헤'로 합쳐 버리는, 정신나간 선택을 했기 때문에 그는 스페인에서 탈출하기로 결정했다. 스페인에 더 있다간 그의 명줄도 그다지 길 것 같지 않았으니.\n\n다빌라 페르난데스는 곁에서 휘날리는 스페인 국기를 멍하니 쳐다보았다. 보라색이 섞인 공화국의 깃발이었다. 나 참, 살아남고자 빨갱이 행세를 해야 한다니. 페르난데스는 중얼거렸다. 발키리의 검문도 모든 게 다 짜증났다. 하지만 그러한 그를 위로하듯 앞에서는 프랑스의 국기가 휘날리는 항구가 보였다. 다 왔다. 자유의 땅, 프랑스였다. 그는 손을 흔들며 항구의 직원에게 인사를 건넸다. 하지만 페르난데스가 기겁을 하며 배를 돌리라고 소리치기까지는 오래 걸리지 않았다.\n\n칼레 항구에는, 그놈의 발키리 깃발을 단 해양경찰들이 즐비했기 때문이다!"
 COU_event.56.a:0 "배는 어쨌거나 항구에 선착했다."
 COU_tooltip_sancho_davilla_fernandez:0 "§g페르난데스는 굳게 마음을 다졌다. 총학생회라는 것들은 인류에 우호적이니, 아마도 이곳에서라도 팔랑헤주의 투쟁을 이어 나갈 수 있을 것이라고 그는 스스로를 다독였다. 하지만 팔랑헤주의 혁명을 프랑코의 대가리에 꽂기 전에, 그가 개같은 발키리 년들을 보고 토하는 것이 더 빠를 지경이었다.§!"
 COU_event.56.b:0 "그는 미친 사람처럼 배를 돌리라고 소리쳤다."
 COU_tooltip_sancho_davilla_fernandeztwo:0 "§g프랑코가 아무리 싫어도 헤일로 달린 싸가지없는 여자들은 더욱 질색이었다. 페르난데스는 함장에게 루거 P08을 들이밀며 아일랜드나 포르투갈, 아무 곳이나 좋으니 당장 배를 돌리라고 난동을 부렸다."
 
 
 
 #우파 
 COU_event.6.t:0 "협력자들의 처우"
 COU_event.6.desc:0 "대전이 이후 한 달이 지났습니다. 손쉽게 무너져내린 네덜란드와 벨기에 정부는 추잡스럽게도 그들의 국민들을 버리고 그들의 식민지로 도망쳤고, 남겨진 이들은 우리의 통치를 받게 되었습니다. 이러한 현실 속에서 몇몇 현명한 이들은 우리와 협력하기로 결정하였으며 우리의 통치를 도왔습니다. 그러나 신년으로부터 한 달이 지난 지금, [COU.COU_RIN.GetName]은 이러한 현상을 '키보토스 역설'이라고 언급하며 협력자들의 지위를 해제해야 한다고 언급했습니다.\n\n[COU.COU_RIN.GetName]에 따르면 협력자들이 그들의 지위를 사용해 다른 이들을 괴롭히고 착취한다며 한시라도 빨리 해제해야 한다며 이야기했습니다. 그러나 이와는 반대로 [COU.COU_KAYA.GetName]은 그녀의 말에 정면으로 반박하며 그들이 없다면 총학생회는 진작에 쫒겨났을 것이며 그들의 협력이 여전히 필요하다며 대립했습니다. 총학생회가 신년 이후에 겪는 첫 대규모 갈등에 실장들은 어찌할 바를 모르고 있으나 이러한 중대한 사안은 한시라도 빨리 해결되어야 합니다."
 COU_event.6.a:0 "두 인물은 서로 다른 법 해석을 내놓았다."
 COU_event.7.t:0 "정말 쉽지 않은 일"
 COU_event.7.desc:0 "도저히 이해 할 수가 없었고, 이해하고 싶지도 않았다. 나나가미 린은 도저히 현실을 볼 줄 몰랐다. 그저 아주 작은 한 조각에 모든 신경을 쏟고 있었다. 수석 행정관이라는 작자가 고작 눈물 몇 방울에 휘둘리다니, 이보다 더 한심한 인간은 키보토스에 존재할 수 없으리라, 카야는 생각했다. 린과 몇 시간이고 떠들어댔지만 멍청한 실장이라는 것들은 협력자들의 모든 지위를 박탈했다. 고마운 이들을 발키리에 수감시켰으며, 개미 새끼들의 환호에 취해 자화자찬하고 있는 꼴을 보자니, 헛웃음이 튀어나왔다.\n\n시라토리구의 자그마한 한구석, 그리고 한산한 구석의 방위실장 자리에서 카야는 다리를 꼬고 앉은 채 커피를 마셨다. 대전이 전에 가져왔던 마지막 커피였다. 유난히 맛이 더 썼다. 곁에 놓인 체스 보드 너머에서는 협력자들의 처분에 관한 멍청한 뉴스들이 흘러나오고 있었다. 저런 한심한 멍청이들, 머저리들... 화가 났지만 지금 당장으로서는 할 수 있는 것이 없었다. 그저 나지막히 '이용당한' 저들에게 용서를 구할 뿐이었다.\n\n쓴 커피가 바닥을 보였다. 그와 동시의, 카야의 인내심 또한 바닥을 보였다. 많이 참았고, 충분히 참았다. 총학생회장은 대전이 이후 혼란의 진정이라는 명목으로 아무것도 하지 않았고, 카야가 모든 것을 했었다. 협력자들을 모으고, 통치를 안정화하고, 저항군들을 진압하고, 그런 개 똥 같은 잡일 모두! 이를 갈았다. 더는 참을 수 없었다.\n\n그녀 말고 다른 이가 \"초인\"과 \"총학생회장\"이라는 직위를 참칭하는 것을 카야는 가만히 두고 볼 수 없었다. 그녀가 가장 존경했던 총학생회장에 대한 마지막 예의이자 경의는, 카야 자신이 대행 직위를 대신하는 것이었다. 총학생회장과 초인이라는 직위는, 그녀 말고는 그 누구도 감히 따라할 수 없으니까."
 COU_event.7.a:0 "\"... 이젠, 그럴 수 밖에 없겠군요.\""
 COU_tooltip_kaya_get_moved:0 "§Y[COU.COU_KAYA.GetName]§!의 시점에서 §Y[COU.COU_RIN.Getname]§!에 대항한 §R총학생회의 권력 투쟁§!을 시작하게 됩니다. §R그 권력 투쟁에서의 승리는, 오직 당신의 신속한 결단만이 매듭지을 수 있습니다.§!"
 COU_event.8.t:0 "한편으로는 갑작스럽게"
 COU_event.8.desc:0 "\"그래서... 갑작스럽게 소집한 이유가 뭐야, 카야?\"\n\n[COU.COU_AOI.GetName]가 먼저 말을 뗐다. [COU.COU_RIN.GetName]과 다른 실장들도 급작스러운 카야의 호출에 당황한 듯 보였다. 카야는 아무런 말도 하지 않았다. 린은 그러한 카야를 의심스러운 눈초리로 바라보았다. 아오이가 계속 그럴 거면 이만 돌아가겠다는 말을 꺼내기 직전, 카야는 입을 뗐다.\n\n\"[COU.COU_RIN.GetName]의 권력을 위한 야망을 알려 드릴까 싶어서요.\" 린은 벙찐 채로 카야를 바라보았다.\n\n주목이 끌린 사이 카야는 말을 이어나갔다. \"대전이 이후, 근처에 새롭게 만들어진 신생 조직, \"연방수사동아리 샬레\", 이 조직이 무슨 조직인지 아실련지요.\" 카야는 천천히 앞으로 걸어 나가 린을 가리켰다. \"대전이 직후 창설된 수상한 조직, 그리고 대행은 그 조직이 무슨 조직인지 알려주려고 하지 않습니다. 그리고 모두가 아시다시피, 샬레는 총학생회장의 직속 기관이'었'습니다. 그렇기 때문에 샬레는 방위실, 체육실, 그 어떠한 부서보다도 높은 지위를 가지고 있습니다. 그리고 샬레의 실장은? 아무도 없습니다. 아무도 없는 초법적인 기관에, 그 정체는 아무도 모릅니다. 무언가 수상하지 않습니까?\"\n\n깊은 정적이 내려앉았다. 체육실장 하이네는 동요하고 있었고, 재무실장 오키 아오이는 아무런 말도 하지 못했다. 린이 말을 꺼내 반박하려던 그 순간에, 카야는 먼저 말했다.\n\n\"한편으로는 갑작스럽게, 그러한 불법적- 초법적- 정체 불명의 기관인 '샬레'를 동원하여 총학생회를 위협하는 [COU.COU_RIN.GetName]의 대행 권한에 의문을 표하고자 합니다.\" 카야는 말이 끝냄과 동시에 웃어 보였다."
 COU_event.8.a:0 "\"그러면 부디, 현명한 선택을.\""
 COU_tooltip_kaya_coueventeight:0 "§L카야는 천천히 문 밖으로 걸어 나갔다. 아오이는 그것이 사실인지 물었고 린은 말을 얼버무렸다. 실장들은 불안한 눈빛으로 린을 바라보았다.\n그것들이 정말 사실이라면. 의문점들이 곳곳에서 생겨났다.§!\n§Y린 탄핵 디시전§!이 활성화됩니다. 기본 §L대중 지지도§!는 §Y10§! 입니다."
 COU_event.9.t:0 "선제 탄핵"
 COU_event.9.desc:0 "짧고도 긴 권력 투쟁 끝에, [COU.COU_KAYA.GetName]는 [COU.COU_RIN.GetName]에게 결국 패배하고야 말았습니다. 카야는 총학생회를 불안에 빠뜨리고 방위에 대한 비리 혐의로 탄핵되었으며, 카야는 방위실장직에서 경질되어 방위차장이 방위실장의 대행을 맡고 있는 상황입니다.\n\n카야는 결과를 받아들이기 어려워하고 있지만, 결국 이 권력 투쟁에서는 린이 이겼습니다. 카야는 패배했으며, '총학생회장의 신뢰'를 얻던 인물에게 감히 대든 대가를 카야는 치르게 될 것입니다. 차디찬 발키리 조사실 지하와 감옥에서 말입니다."
 COU_event.9.a:0 "아, 이런."
 COU_tooltip_remove_kaya_contents:0 "§Y시라누이 카야 컨텐츠§!를 §R제거합니다.§!"
 COU_event.13.t:0 "고작 그딴 걸로"
 COU_event.13.desc:0 "유라기 모모카는 이제는 좋을 대로 하라는 듯 카야를 바라보았다. 노란 완장을 찬 이들에 둘러싸인 모모카는 명란맛 과자를 입에 털어넣으며 말했다. \"좋아, 방위실장. 이게 네가 원하는 거라면, 얼마던지 하도록 해.\" 말이 채 끝나기도 전에 꺼진 불 너머에서 구둣발 소리가 들렸다. 그러나 구둣발은 여느 때처럼 가볍고 명랑하지는 않았다. 악센트를 가지고 걷는 소리도 아니였다. 단순하고 무거운 발걸음 소리였다. 천천히 시라누이 카야는 모모카에게 모습을 드러냈다.\n\n\"저와 교통실장 간 유일하게 첫번째로 대화가 통했네요.\" \"그냥 편히 찬성하시면 좋을 텐데요. 저는 '대행' 과는 달리, 교통실장께서 농땡이를 얼마나 피우던 명란맛 과자를 몇개를 먹던, 전혀 신경쓰지 않습니다. 그런 것에 병적으로 집착하는 '대행' 보다는 덜 깐깐한 사람인데요.\" 카야는 얼굴을 찡그리며 말했다. 교통실장은 고고한 웃음을 지었다. 가소롭다는 표정이었다. 카야는 교통실장의 그러한 '무례'에도 별 아랑곳하지 않고 처리를 맡기려고 했다. 그러나 교통실장은 끝까지 그녀의 속을 긁어 놓았다. \"너는 죽었다 깨어나도 린이 하는 것처럼 못 해.\"\n\n미친듯이 웃어 보이며 유라기 모모카는 협력자들에게 기절하기 전까지 카야를 조롱했다. 카야는 기분이 \"더러웠다\". \"더러운 기분\" 이 뭐냐고 묻냐면, 카야는 당연히 이 이야기를 해줄 것이다."
 COU_event.13.a:0 "\"기분이 더럽네요... 아주 많이.\""
 COU_tooltip_momoka_thats_all_right:0 "§g유라기 모모카는 맞아 기절할 때까지도 웃었다. 카야는 결코 린처럼 할 수 없다고 말했다. 카야는 얼굴을 찡그렸다.§!"
 COU_event.14.t:0 "처리를 기다리고 있는 일"
 COU_event.14.desc:0 "\"급한 문제들이 아직 일단락되지 않았는데요.\" 이와비츠 아유무가 속삭였다. 새벽의 깊은 밤, 부엉이들조차도 졸려 잠드는 시간. 아유무는 그러한 깊은 밤까지도 서류를 처리하고 있었다. 카야가 갑자기 문을 열고 들어오기 전까지만 해도. \"조정실장, 밤이 깊었는데요. 이만 쉬는게 어떠신지?\" 시라누이 카야가 가늘게 눈을 뜨며 말했다. 아유무는 분명히 카야에게 탄핵안에 참여하지 않을 것이라고 이야기해두었다. 탄핵안에 대한 불참은 자동적으로 거부로 처리되므로 아유무 입장에서는 그것이 가장 합리적이고 조정 가능한 판단이었으리라.\n\n\"인생이라는건, 각자 주인공인 법이죠.\" 카야는 천천히 걸어나왔다. 아유무의 뒤로 밤 별빛이 쏟아져내렸다. \"밖을 보세요. 세상은 아름답습니다. 고작 고리 같은 링이 떠다니던 키보토스와는 달라요. 여기는 \"지구\"고, \"키보토스\"가 아닙니다.\" \"세상이 변했어요, 아유무. 이제는 그 사실을 받아들일 때가 되지 않았나요?\" 아유무가 서류에 사인하며 말했다. 그게 그거랑 무슨 상관이죠. 카야는 자신의 '멋진' 비유가 전혀 통하지 않았음에 실망했다. 사실은 통하지 않은 게 아니다. 아주 멍청해보이는 말로 거절했을 뿐.\n\n카야는 그 뒤로도 몇번이나 아유무에게 말을 걸었다. 아유무는 단 한마디도 하지 않았다. 카야는 결국 한숨을 쉬며 총구를 들이밀었다."
 COU_event.14.a:0 "\"이렇게 멍청한 놈이 조정실장이라니.\""
 COU_tooltip_ayumu_thats_all_right:0 "§g찰칵거리는 총 소음이 울려퍼졌다. 아유무는 여전히 그 자리에서 서류들에 사인을 남기고 있었다.§!"
 COU_event.15.t:0 "방위실장, 교정국장 직할 명령."
 COU_event.15.desc:0 "\"안녕하세요, 교정국장. 잠시 이야기를 나누고 싶은데요, 부디 시간이 난다면 연락해 주시길.\" 카야는 찰칵, 하고 수화기를 내려놓았다. 하여간 발키리 놈들, 하루종일 쏘다니면서 도넛이나 먹는 주제에 또 자리는 왜 이렇게 자주 비운담? 게다가 가두어 놓았던 칠수인조차 똑바로 통제를 못 해서 총학생회의 평판을 깎아먹기나 하고. 카야는 심술부리듯이 투정했다. 여차하면 발키리를 없애 버려야겠다고 생각하던 참에 수화기가 울렸다. 카야는 수화기를 들어 전화를 받았다. 예상 외로 교정국장이 아닌 발키리 생활안전국의 접수원인 모양이었다. 아마도 카야는 잘못된 번호로 전화를 건 모양이었다. 물론 카야는 전화를 잘못 건 줄 꿈에도 몰랐지만.\n\n\"생활안전국? 저는 분명 교정국장에게 전화를 걸었었는데요.\" 카야는 떨떠름하게 말을 이었다. \"뭐 어쨌든, 당신이 받은 이상 당신이 그걸 전해 주시면 되겠네요.\" 카야는 전화기 선을 꼬며 말했다. \"지금 수감되어 있는 SRT의 FOX 소대, 전원 석방시키세요.\" 접수원이 말을 더듬으며 다시 한번 이야기해달라고 말했다. \"당신, 귀 먹었나요? 당장 SRT의 FOX 소대들을 석방시키라구요! 전원 다!\" 접수원은 알겠다고 말하더니 황급히 뛰어가는 소리가 들렸다. 교정국장에게 전화가 넘겨졌다.\n\n\"죄송합니다, 방위실장님. FOX 소대에 대한 4차 심문을 진행-\" \"그건 제 알바가 아니고, 당장 FOX 소대들을 석방시키세요.\" 정적이 흘렀다. 카야는 점차 예민해졌다. 이 년들은 죄다 귀가 먹은 건가? 카야가 따끔하게 소리를 지르기 직전 교정국장이 알겠다고 하는 답변이 돌아왔다.\n\n\"네, 그럼.\" 카야는 수화기를 내려놓아 전화를 끊었다. 곁에 놓인 다과를 한 입 베어물었다. 기분이 풀리는 듯 했다. \"어휴, 하여간... 하여간... 발키리 놈들이란.\" 카야는 혼잣말을 했다. 그리고 한편-"
 COU_event.15.a:0 "교정국장은 어이없다는 듯 웃었다."
 COU_tooltip_srt_fox_notbanned:0 "§g어이, 시치도 유키노. 당장 짐 싸서 여기서 나가. 교정국장이 한탄하듯 소리쳤다. 유키노는 잠시 얼을 타다가 황급히 심문실을 빠져나갔다.§!"
 COU_event.16.t:0 "믿어 보기"
 COU_event.16.desc:0 "\"유키노~ 유부초밥 먹을래?\" 니코가 물었다. 유키노는 괜찮다고 했다. FOX 소대는 샬레 인근의 엔젤24에 들렸다. 차디찬 교정국의 지하 심문실에서 먹는 값싼 편의점 도시락이 아닌, 직접 재료를 사서 만든 따뜻한 유부초밥. 오랜만이었다. 쿠루미가 유부초밥이 좀 달다고 투정을 부리긴 했지만, 니코는 웃으면서 쿠루미의 입에 유부초밥을 쑤셔넣었다. 그러나 갑자기 니코는 중심을 잃고 넘어졌다. \"괜찮아, 니코?\" 유키노가 걱정스러운 눈으로 바라보았다. 니코는 다리를 툭툭 털고는 괜찮다고 했다. 유키노는 그런 광경을 행복하게 바라볼 수 없었다. 멋모를 때 정의가 정확히 무엇인 것 조차 모른 채 '정의'를 찾아 나서던 SRT 때와는 달랐다.\n\n대전이 이후로 FOX 소대는 그토록 갈구하던 '정의'를 위해 애썼다. 대전이 이후의 전쟁에서 암스테르담 (그러니까, D.U.와 뒤섞인) 에 남아 SRT와 교전하겠다던 빌헬미나 여왕을 친히 쏴죽였고, 시신 처리까지 직접 했다. 하지만 이것은 순전히 유키노의 즉각적인 상황 판단에 따랐던 것이었기 때문에, 아무런 일도 없었던 것처럼 행동하어야 했다. 유키노는 몇 번 자책도 했다. 이것은, 자신이 그렇게 좆던 '정의'가 아니라고. 하지만 가혹한 현실은 그러하도록 하게 내버려두었다.\n\n니코는 여왕 사살 당시에 다쳤다. 물론 지금은 많이 나아져 정상적인 작전이 가능할 정도지만, 니코의 허리에는 큰 흉터가 남아 있다. 여왕을 지키고자 발악하던 근위대가 던지던 폭약들이 모두 니코에게 향했다. 유키노가 대응할 때도 없이, 니코는 폭약들이 내뿜는 화마에 갇혔다. 왕궁이 무너져내리고 몇 시간의 수색에 걸쳐서야 간신히 살아 있던 니코를 볼 수 있었다.\n\n왜 그렇게 됐을까? 여왕을 죽여버려서? 그건 모두 유키노의 판단이었다. 그렇다면, 유키노가 '판단'했기 때문에, 소대원이, 니코가, 그렇게 된 게 아닐까?\n\n어쩌면, 자세한 것들은 높으신 분들에게 맡기고, 자신들은 그저 '작전 수행'만 하는게 올바른 것이 아니었을까? 무기가 생각을 하니, 이런 벌이 내려졌던 걸까?"
 COU_event.16.a:0 "\"... 무기는, 생각하지 않아야 가치가 있어.\""
 COU_tooltip_yukino_idk_everything:0 "§g그때부터 유키노의 최선적인 목표는, SRT의 재건이 되었다. 그리고 '무기'인 그녀는, 생각하지 않고, 높으신 분들에게 맡기기로 했다. 유키노는 방위실장에게 문자를 보냈다.§!"
 COU_event.17.t:0 "정의라는 것"
 COU_event.17.desc:0 "시라누이 카야는 무언가 해낸 듯 오늘은 귀한 커피를 꺼내서 마셨다. 얼마 남지 않은 커피였지만 그녀는 특별히 꺼내서 마셨다. 따뜻한 커피향이 그녀의 코를 감쌌다. 음, 좋은 향기. '대업'을 완료하고 마시는 한 잔의 커피란, 정말이지. 우후후. 카야는 커피에 각설탕 한 개를 집어서 넣었다. 곧 손님이 오실 테니.\n\n똑똑, 문에서 노크 소리가 났다. \"저... 방위실장님? 손님이신...\" \"아, 네. 제가 불렀습니다. 들어오라고 하세요.\" 문이 철컥, 하고 열렸다. 행정원은 카야에게 고개숙이고는 손님을 들여보낸 뒤 문을 닫고 나갔다. 찰카닥. 문이 닫혔다. \"FOX 소대 여러분들, 방위실에 어서 오세요.\" 손님은 바로 며칠 전 초대한 FOX 소대의 소대원들이었다. 카야는 직접 믹스커피 몇 개를 타 나누어 주었다. \"요새는 어떻게 지내시나요? 혹시 갈곳이 없으시기라도 한 건 아닌지 걱정됩니다.\" 카야는 웃으며 말했다. 오토기가 말을 이었다. \"으음... 조금 돈이 부족해서 용병 비슷한 일을 하고 있었어. 뭐어, 지금 당장은 먹고 살아야 하니깐...\" 오토기는 말을 끝내자 대물 저격총을 소파 근처에 세워 놓고서 돌아와 앉았다. \"그렇군요... 그런데 SRT의 학생들이 용병 같은 일을 해도 되나요?\" \"SRT는 '정의'만을 위해서 움직인다고 들었거든요. 유키노는 카야의 말에 몸을 약간 떨었다.\n\n이런 이런, 귀여운 여우 같으니라고. 아직도 같잖은 '정의'랑 씨름하고 계시구나. 카야는 생각했다. 커피잔을 내려놓은 카야는 유키노에게 말을 걸었다. \"유키노, 무언가 고민거리가 있으신 모양인데요.\" 유키노는 말을 하지 않았다. 카야는 한숨을 쉬더니 말했다. \"'정의'라... SRT에서 가장 중요한 가치겠네요. 그렇죠?\" \"하지만 유키노, 그걸 아시나요? 녹슨 칼로 휘두르는 얄량한 '정의'보다는, 지금 당장 앞의 '책임져야 하는 것'을 책임지는 것이 가장 중요하다는 것을.\" 유키노가 고개를 들어 카야를 바라보았다. 마치 무슨 말인지 잘 모르겠다는 것처럼. 카야는 주머니에서 명함을 꺼냈다. \"도움이 필요하시면, 이 번호로 연락해 주세요. '정의'는 모두 저희가 책임집니다. 유키노, 당신은, 당신 눈 앞의 소대원들을 책임지셔야죠. 그렇죠?\" 카야는 눈웃음을 지어 보였다.\n\n니코가 말을 끊으며 지금 무슨 짓이냐며 화를 냈다. 카야는 가벼운 말투로 '유키노를 돕고 있다'고 했다. 유키노는 이내 자리에서 일어나 돌아가겠다고 했다. 카야는 떨리는 그녀의 손을 바라보며 좋을 대로 하라고 했다. \"유키노. 지금 당신이 신경써야 할 것은 정의도, 치안도, 평화도 아닙니다. 당신이 책임져야 할 소대원들입니다. 고작 '정의'따위에 휘둘려 챙겨야 할 것을 놓치지 않았으면 좋겠어요.\" 카야가 미소지으며 말을 끊었다."
 COU_event.17.a:0 "문이 쾅 하고 닫혔다. 카야는 억지로 지은 미소를 풀었다."
 COU_tooltip_fox_real_in_kaya:0 "§g숙소로 돌아가면서 니코는 계속하여 유키노에게 말을 걸었지만 유키노는 답하지 않았다. 어떻게 해야 할 지 모르는 듯 했다.§!"
 COU_event.18.t:0 "비상 회의"
 COU_event.18.desc:0 "나나가미 린은 불편한 기색이 역력했다. 한동안 조용히 지내던 SRT 특수학원의 소대들이, 도대체 어떻게 발키리를 아무런 흔적도 없이 빠져나왔으며, 발키리의 공안국장은 어떻게 이에 대해 언급이 한마디도 없을 수가 있는가? 이는 '총학생회장 대행' 이라는 막강한 권력을 휘두르는 나나가미 린으로서는 상상할 수도 없었다. 그러나 그것은 지금 중요한 게 아니었다. SRT의 난동으로 급히 비상 회의를 소집했으나, 출석한 인원은 실장들의 절반도 되지 않았다. 린, 아오이, 모모카, 아유무 말고는, 그 누구도 참석하지 않았다. 핑계랍시고 대는 것들은 아파서, 급히 시찰을 나가야 해서. 이것은 대행의 권위를 대놓고 무시하는 행위였다.\n\n총학생회의 규정상 인원 전체가 출석하지 않으면 그 회의는 무효 처리된다. 린은 한숨을 쉬었다. 한시가 급한 마당에, 고작 같잖은 권력 싸움이나 하겠다고 불참하다니. 린은 결국 몇 시간을 더 기다린 끝에야 이들을 해산시켰다. 창밖에서는 시위대의 시위가 진행 중이었다. \"키보토스 압제자들은 네덜란드에서 떠나라\", 린은 그럴 수 있다면 그러고 싶었다. 그렇지만 어쩌겠는가. 이제는 여기가 \"키보토스\" 고, \"시라토리구\"인데."
 COU_event.18.a:0 "그리고 린은 자리를 떠났다."
 COU_tooltip_rin_showed_shit:0 "§g출석한 이들은 몰랐겠지만, 은유적으로 린의 권위와 지도력은 대행에 걸맞지 않다고 말하고 있었다.§!"
 COU_event.19.t:0 "하이네의 편지"
 COU_event.19.desc:0 "총학생회의의 긴급 회의가 끝나기 전에 미리 써요. 방위실장님. 저는 방위실장님의 린 대행의 발언들을 모두 들어볼 수 있었습니다. 아주 충격적이고 공포스러운 일이더군요. \"체육실은 적당히 문화실의 하위 부서로 박아넣겠다\" , \"주먹밥은 앞으로 배급되지 않는다\" ... 솔직히 말해, 많이 놀랐습니다. 방위실장님, 전 체육의 가치를 모르는 대행은 필요 없습니다. 방위실장님이시야말로 진정한 대행의 자격이 있으시다고 생각합니다. 방위실장님께서 대행을 폭로한 그 날 말 거들어 드리지 못해서 죄송합니다.\n\n그렇지만 이것만은 알아 주셨으면 좋겠습니다. 린은 더 이상 대행 직위를 이어가서는 안 됩니다. 탄핵안이 제출되면, 그 어떠한 일이 있더라도 찬성할 것을 이 편지를 빌어 방위실장님께 약속드립니다.\n- 체육실장 하이네."
 COU_event.19.a:0 "카야는 그 편지를 만족스럽게 서랍에 집어넣었다."
 COU_tooltip_jaime_accept_yoon:0 "§Y하이네§!는 §G탄핵안에 찬성§!할 것입니다."
 COU_tooltip_smomo_accept_yoon:0 "§Y스모모§!는 §G탄핵안에 찬성§!할 것입니다."
 COU_tooltip_aoi_accept_yoon:0 "§Y아오이§!는 §G탄핵안에 찬성§!할 것입니다."
 COU_tooltip_jaime_umm:0 "§g그렇게 카야의 첫번째 뒷공작은 성공적이었다. 단순한 음성 조작은 멍청한 놈을 든든한 아군으로서 둘 수 있게 한다.§!"
 COU_event.20.t:0 "디츨란드법"
 COU_event.20.desc:0 "\"대행님, 여기에 서명하시면 됩니다.\" 행정원이 서류를 황급히 내밀고 도망치듯이 자리를 떠났다. 나나가미 린 대행은 도저히 이해할 수 없다는 듯이 카야를 바라보았다. \"방위실장, 정말로 해야만 하겠어?\" 카야는 다리를 꼬고 앉아 체스를 두고 있었다. 카야는 홀깃 린을 쳐다보더니 차갑게 대꾸했다. 그럼요, 당연하죠. 당신 덕분에 우리를 위해 힘써주시던 사람들이 모두 내동댕이당했는데, 그에 적법한 보상은 해 드려야죠. 린은 썩 탐탁치 않았다. 협력자들이 정확히 무엇을 했는지까지는 모른다.\n\n그러나 그들의 족쇄를 풀어버린다면 과연 무슨 일이 일어날까? 그건 아무도 몰랐다. 카야도, 린도, 총학생회장도 몰랐다. 린은 한숨을 쉬었다. 도대체 어디서 힘을 빌려온지는 몰라도 실장들이 모조리 카야를 지지하는 데에 이어 카야가 대행의 결정을 좌지우지할 수 있게 되었다는 것은 린은 대행의 직위뿐만 아니라 본인의 안위까지도 걱정해야하는 수순에 들어선 것임을 암시했다.\n\n뽀각, 하고 펜의 뚜껑이 뽑혔다. 카야는 아무런 말도 없이 체스를 했다. 킹을 퀸으로 잡았다. 게임이 끝났다. 린이 디츨란드법 법안에 서명했다.\n\n게임이 끝났다."
 COU_event.20.a:0 "아직 할 일이 많다."
 COU_tooltip_rin_getout_fuck:0 "§g린은 펜을 놓았다. 그리고서는 아무도 듣지 못할 고성을 질렀다. 그러나 그 고성은 아무도 듣지 못할 것이었다. 영원히.§!"
 COU_tooltip_completed_by_decision:0 "§g이 중점은 디시전으로 완료될 것입니다.§!"
 COU_event.21.t:0 "그냥 줄래, 뒤지고 줄래?"
 COU_event.21.desc:0 "행정원의 하루는 단순하다. 전국을 뛰어다녀서 골칫거리들을 골라낸 후, 셔류로 작성하여 결재를 받으면 된다. 결재까지는 단순하다. 그러나 가장 어려운 것을 뽑으라면은 제출하는 것이다. 제출한 서류에 실수라도 있으면... 그 날은 집에 못 간다! 이런! 끔찍해라, 끔찍해라... 행정원은 혼잣말을 하며 서류를 넘겼다. 한 장은 침을 묻혀서 넘겼고, 한 장은 그냥 넘겼다. 가끔씩 종이에 손이 베이기도 했다. 오늘도 전국에서 수백 개의 검토 서류들이 날아왔다. 암스테르담 댐이 불안하니 보수 작업을 해달라, 사회주의자가 도로 위에서 1인 시위를 하는데 좀 어떻게 해 줘라 등등등. 행정원은 거기서 쓰잘데기 없는 것들은 모조리 제치고 쓸모 있는 것만 골라내면 된다.\n\n\"잠시 시간 되나요?\" 누군가 행정원의 어깨를 붙잡으며 말을 걸었다. 아이, 썅! 오늘도 처리해야 할 게 산더미인데! 대체 누구야? 내 하급자라면 죽을 듯이 갈궈 주겠어. 행정원은 속으로 생각했다. 그래도 어쨌든 그녀는 공적인 상황에서는 여느 때처럼 웃으며 무슨 일이냐고 물었다. 방위실장이 권총을 그녀의 머리에 겨누고 있었다. 꺄악! 깜짝 놀라 소리를 질렀다. 카야는 행정원이 소리를 지르자 항상 웃고 있던 입꼬리를 내렸다. 어디선가 배워 온 것처럼, 어색한 위압감이 그녀를 강타했다. \"좋은 오후입니다. 제 요청은 간단합니다. 앞으로 모든 일들은 저에게 최우선적으로 보고하세요.\" 행정원은 목소리를 떨며 그럴 수는 없다고 했다. 그야, 지금 총학생회장의 대행이 멀쩡히 있는 상황에서 고작 11명의 실장들 중 하나인 그녀에게 최우선적으로 보고한다는 것은 행정위원회에 반기를 든다는 것과 다름이 없었으니까.\n\n카야는 실눈을 떴다. 그녀가 권총의 총열을 당겼다. 철컥, 무거운 소리가 행정원을 무거운 추처럼 눌렀다. \"다시 말하죠. 제 요청은 간단합니다. 저에게 최우선적으로.\" 카야는 권총을 든 손을 이리저리 돌려 보았다. \"최우선적으로 보고하세요. 그게 싫으시다면, 선택하시면 됩니다. 그냥 주시던가, 뒤지고 주시던가.\""
 COU_event.21.a:0 "행정원은 필사적으로 고개를 끄덕였다."
 COU_tooltip_kaya_haha:0 "§g카야는 그제서야 겨눈 총을 뗐다. \"공포\"는, 모든 것을 통제할 수 있다. 카야는 다시 한번 느꼈다.§!\n§Y오키 아오이§!§g와 §Y스모모§!의 회유가 가능해집니다.§!"
 COU_event.22.t:0 "어째서?"
 COU_event.22.desc:0 "카야는 편지를 구겨서 쓰레기통에 던져 버렸다. 아, 이런! 재무실장은 최소한 체육실장보다는 덜 멍청한 모양이었다! 재무실장은 '린이 총학생회의 예산을 빼돌려 샬레에 할당하고 있다'는 카야의 \"억지\" 주장을 별로 놀랍지도 않다는 듯이 넘겨 버렸다. 아오이의 말을 요악하자면, 현 상황에서 린을 탄핵하려 드는 것은 멍청한 행동이다, 방위실장도 협력자들을 통솔하며 이미 알고 있지 않느냐, 대행도 충분히 '샬레 스캔들'에 대응하고 있다. 바로 그게 문제란 말이다! 카야는 씩씩대며 체스판 위의 말을 하나 잡아 집어던졌다.\n\n\"... 그 여자는 말만 하면 모두가 개처럼 기어오르는데, 어째서 \"나\" 는 되지 않는 거지? 대체 뭐가 문제인 거지?\" \"방위실장직이 그렇게 만만한 직위인가?\" 그렇지 않다. 방위실장은 행정위원회의 11명의 실장들 중 하나로서, 총학생회장에 버금가는 막강한 권력을 휘두를 수 있다. 발키리까지 그녀의 말 한마디면 무엇이던 할 것이다. 카야는 골똘히 생각했다. 그 사이 눈치없는 년들이 몇 차례 카야에게 그놈의 보고서를 올리기 위해 시도했다. 그때마다 카야는 소리를 치며 나중에 오라고 했다. 해가 졌다. 달이 떴다. 오소리들이 숲속을 돌아다닌다. 숲 속을 돌아다니던 늑대가 울부짖었다. 오소리는 공포에 질려 자리를 피했다.\n\n그때서야 카야는 깨달을 수 있었다.\n\n\"... 그래.\"\n\n카야는 의자를 젖혔다. 손가락을 몇 번이고 두들겼다. 딱딱딱딱딱. 차가운 소리가 방에 울려퍼졌다.\n\n\"이 키보토스에는, 공포가 부족해. ...충분한 공포를 보여준다면.\""
 COU_event.22.a:0 "\"... 모두가 내 말을 따를 거야.\""
 COU_tooltip_kaya_gets_scared:0 "§g카야의 두번째 뒷공작은 실패로 돌아갔지만 카야는 커다란 교훈을 얻었다. 시라누이 카야는 자리를 박차고 나갔다. 그날 밤, 그녀가 어디로 갔는지는 아무도 모른다.§!"
 COU_event.23.t:0 "총결산"
 COU_event.23.desc:0 "오키 아오이는 여느 날처럼 빠듯한 시간에 쫒기고 있었다. 총결산이 곧 끝나가는데, 봐야 할 서류들은 산더미처럼 쌓였기 때문이라. 그러나 아오이는 동요하지 않았다. 그저 평소처럼 커피를 홀짝이며 가능한 한 열심히 서류들을 읽어나갔을 뿐이다. 그렇지만 그 날은 평소같지 않았다.\n\n\"2월 재무 보고서... 음, 이건 좀 옛날 거네. 왜 여기 있는지는 모르겠...\" 아오이가 서류를 폐기하려던 찰나, 아오이는 본능적으로 숫자의 오판을 읽어냈다. 아니, 잠깐만. 여기서 2월 13일치 총 소비량은 2천만 엔이다. 그런데 12일, 14일 모두 1천 8백만 엔을 썼다. 총학생회는 보통 매일 거의 똑같은 지출을 한다. 잠깐만, 이게 뭐지? 아오이는 행정원을 불러 2월 13일치의 세부 사항들이 적힌 서류를 가져다달라고 했다. 꽤 옛날 서류라 찾기엔 오래 걸릴 줄 알았는데, 의외로 행정원은 몇 분만에 들고 오는게 아닌가. 어떻게 이렇게 빨리 찾았는가 물으니, 방위실장이 자신이 어디 있는지 안다며 일러 주었다고 한다. 방위실장이? 그걸? 왜? 하지만 지금은 그게 중요한게 아니었다.\n\n아오이는 그대로 앉아 꼬박 하루를 샜다. 이제 총결산이 중요한게 아니었다. 남은 2백만 엔은 어디로 갔나? 아오이가 추적해 보니 그 돈들은 '샬레'로 흘러들어갔던 것이 확인되었다. 그런데 왜 그때는 확인하지 못했던 거지? 상대적으로 적은 액수라서? 아니야. 그 정도면 재무실이 눈치채지 못하는게 이상한 거지. 그런데 어떻게 행정위원회는 이 사실을 단 한명도 몰랐을 수가 있지? 말이 맞지 않았다. 모든 걸 통제하는 총학생회의 모든 권력자들이 2백만 엔이 어디로 갔는지 모른다고? 전혀 말이 되지 않는다. 아오이는 생각했다. 생각하면 생각할수록 복잡한 십자말풀이를 푸는 것 같았다. 하지만 여러번 생각할때마다 십자말풀이의 해답은 곁에 적혀져 있었다. 그런 건... \"대행\" 정도의 사람이 작정하고 숨기지 않는 한..."
 COU_event.23.a:0 "\"... 설마.\""
 COU_tooltip_aoi_started_hondon:0 "§g오키 아오이는 구석에 쳐박아 두었던 방위실장의 편지를 펼쳐보았다. 아니야, 아직 이것만으로는 판단할 수 없어. 아오이는 생각했다. 하지만...§!"
 COU_event.24.t:0 "흐름."
 COU_event.24.desc:0 "스모모는 아무런 말도 하지 않고 앉아 있었다. 요즈음 스모모는 행정위원회에 얼굴을 비추지 않았다- 그리고 당연히 그 이유라면, 카야가 보낸 편지 때문이라. 스모모는 린의 탄핵을 좌지우지 할 수 있는 3명 중 한명이다. 그래서 스모모는 되도록 자신의 입장을 밝히고 있지 않았다. 하지만 시간은 그녀가 그렇게 하도록 두지 않은 모양이다. 카야는 편지로 행정위원회와 행정원의 대다수가 자신에게 최우선적으로 보고하며 사실상 린 대행의 권위를 잡아먹었다고 말했다. 스모모가 그것이 사실이라고 깨닫게 되기까지는 그닥 오랜 시간이 걸리지 않았다. 그건 사실이었다. 하지만 총학생회장의 대행, 그러니까, \"그 총학생회장의 대행\"이 탄핵당할 정도의 잘못을 했다고 스모모는 생각하지 않았다. 하지만 수많은 이들은 그녀가 잘못했다고 생각하는 것 같았다.\n\n스모모는 몇 번이고 고민했다. 이게 과연 옳은 일일까? 그러나 스모모도 결국은 행정위원회의 일부로서, 카야가 우세를 점한 것은 사실이고, 카야에게 고깝게 군다면 그녀는 어떻게 될 줄 몰랐다. 린이 잘못한 것은 아니다. 그러나 \"흐름\"은, 린이 잘못했다고 말하고 있었다. 스모모는 자리에서 일어나 천천히 책상으로 향했다."
 COU_event.24.a:0 "그리고 스모모는 카야에게 편지를 썼다."
 COU_tooltip_smomo_okay:0 "§g그래도 대행은 잘못하지 않았다. 단지 \"흐름\"이 그렇다고 이야기할 뿐, 이라고, 스모모는 생각했다.§!"
 COU_event.25.t:0 "카이저 코퍼레이션"
 COU_event.25.desc:0 "오키 아오이는 폐기되기 직전에의 재무실 보고서들을 나열했다. 총합 3개월치의 서류들이었다. 행정원을 시켜 어렵사리 구한 보고서들은 남은 2백만 엔의 행방과 출처가 정확히 기입되어 있었다. 1백만 엔은 '아로나' 기동 비용에, 남은 1백만 엔은 '카이저 PMC'에 전달되었다. 카이저 PMC는 어떠한 경로로 총학생회의 예산을 빼돌려 받았을까? 어떠한 경위로? 카이저 PMC는 카이저의 용병 집단으로서 SRT보다도 뛰어난 전투력을 자랑한다고 평가받는 무력집단이었다. 그리고 2백만 엔은 정황상 '대행'이 전달했으므로, '대행'도 또한 카이저 PMC에 1백만 엔을 보냈다는 걸 알 수 있었다. 대행이 과연 카이저 PMC에서 무엇을?\n\n정황상, 대행이 카이저 PMC로 할 행위들은 당연하듯이 이어졌다. SRT를 무력화시키고, 실장들을 구금하고... 그렇지만 대행은 분명 그럴 사람이 아니었다. 그렇다면, 아마도, 카이저를 이용해 권력을 공고히 한 뒤, 카이저에 권력을 나누어 주려는 게 아닐까? 그것이야말로 합당한 논리였다. 그것이야말로 총학생회를 근간부터 무너뜨리는 행동이었다. 그것만큼은 막아야 했다.\n\n아오이는 그렇다고 믿고 싶지는 않았다. 총학생회장의 신임을 받던 인물이었으니까. 그러나 사람의 이면이란, 아무도 모르는 것이었다. 아오이는 서류들을 밀어 낸 뒤 펜의 뚜껑을 열었다. 덜 굳은 펜의 잉크 향기가 아오이의 코를 간질였다."
 COU_event.25.a:0 "아오이는 서랍에서 편지지를 한 장 꺼냈다."
 COU_tooltip_aoi_okay:0 "§g카야는 재무실장에게서 온 편지를 받았다. 밀랍으로 밀봉된 편지라 밀랍 냄새가 났다.§!"
 COU_event.26.t:0 "카르바노그의 토끼"
 COU_event.26.desc:0 "재판이 SRT의 완전 패소로 마무리지어진지 10일이 지났다. 행정위원회의 전원은 SRT의 폐교 안건에 만장일치로 의결했다. 그렇다면 이제 SRT는 어떠한 근거에 기반하여 존속하어야 하는가? 스모모의 단순한 의문에서부터 초래된 SRT의 폐교는 오늘 린 대행에게까지 보고되었을 정도로 사태가 커져가고 있었다. 그리하여 결국, 오늘은 SRT는 발키리 경찰학교에 통폐합되기로 결정된 게 아닌가. SRT의 FOX소대의 소대장, 시치도 유키노는 절대로 발키리에 갈 수 없었다. 자신의 잘못된 뜻으로 희생된 소대원들을 위해서라도!\n\n시치도 유키노는 특수학원에서 당장 나가라는 발키리의 강요에 굴하지 않았다. FOX소대는 말을 맞추어 놓았다. 설사 죽는 한이 있더라도 (사실 그것까진 불가능하겠지만) 학원을 지켜내자고. 후배들인 RABBIT소대도 뜻을 맞췄다.\n\n하지만 고작 특수부대원 여덟 명의 항명은 오래 가지 못했다. 공안국장의 함정에 걸려들었고, 교정국에 수감되었다. 차가운 달빛이 호기롭게 그녀들을 비웃었다. SRT는 결국 여기까지였다. 게다가 그 항명으로 인해 행정위원회가 더 빠르게 폐교를 앞당기고 있었다. 유키노는 앞이 보이지 않았다. 어두웠다. 어둠에 집어삼켜 슬픔과 고통의 동산에서 차디찬 달빛에 의지한 채로 그저 가만히 앉아 있었다. 마치 가만히 앉아 있으면 무언가 해답이라도 나올 것처럼."
 COU_event.26.a:0 "바람은 불지 않았다. 벌레들은 울지 않았다."
 COU_tooltip_cant_use_srt:0 "§gSRT 특수학원 소대원들이 발키리 교정국에 수감되어 §R사용이 불가능§!해집니다.§!"
 COU_tooltip_one_more_chance:0 "SRT 특수학원 소대원들이 발키리 교정국에서 석방되어 §G사용이 가능§!해집니다."
 COU_tooltip_kaya_getmoved:0 "§gSRT가 시라누이 카야에게 협력할지도 모릅니다...§!"
 COU_event.27.t:0 "인권보장실"
 COU_event.27.desc:0 "얀 바르스는 긴장된 표정으로 행정위원회 건물에 들어섰다. 행정원들이 곳곳에서 그를 보며 쑥덕거렸다. 솔직히 말해, 얀 바르스는 총학생회를, 그러니까, 시시덕한 여자아이들이 '행정부 놀이'를 한다고 생각했다. 그것은 사실이었다. 바르스는 대전이 이후에도 한결같이 없는 이들을 위해 일하고 싶었다. 비록 네덜란드는 인도네시아로 사라졌지만, 네덜란드인들은 여전히 그곳에 있었기 때문이다. 그렇기에 더더욱이 행정위원회로부터 한 장의 편지를 받았을 때는, 그때만큼 당황한 때가 없었다. 그를- 새로운- 인권보장실의 실장으로서 임명한다는 내용이었다.\n\n물론 편지에 따르면 인권보장실은 임시로 급조되었으므로 공식적으론 11개의 실장들로는 집계되지는 않는다고 한다. 그렇지만 그는 그런 것 따위는 아무래도 상관없었다. 단지 그를 파시스트라는 이유로 미친 놈이라고 낙인찍으면서- 아무런 것도 하지 못하게 한- 네덜란드보다는 아마도 저 여자아이들이 훨씬 나을지도 모르겠다고 생각해버렸다. 물론 존나게 무모한 행동이었지만, 뭐, 이미 다 와버렸으니. 어쨌거나 그는 그 편지를 받은 뒤 즉답으로 그러겠다고 했다. 그리고 오늘, 행정위원회에 발을 내딛은 그는 '여자아이들의 행정부 놀이'가 생각보단 정교하다고 생각했다. 각각 부처에 따라 ~실이라고 불렀고, ~실장들이 부처의 장관직을 뜻하는 것 같았다.\n\n행정원의 안내를 받은 그는 어색한 일본어로 말을 더듬으며 고맙다고 했다. 대전이 이후 일본어 교습서가 유럽 전역에서 미친 듯이 팔렸다. 그도 물론 일본어를 배워 보려고 애썼지만, 네덜란드어랑 일본어는 하늘과 땅 차이만큼 어려웠다. 아, 이런. 그나마 다행인 점은, 그가 가슴주머니에 자그마한 일본어 단어집을 가지고 왔다는 것이다. \"좋아, 좋아... 이것만 있으면 괜찮을 거야...\" 그는 혼잣말로 애써 긴장을 달래 보려고 애썼지만, 불쌍하게도 그 안도는 오래 가지 않았다.\n\n\"안녕, 인권보장실장. 바쁘니까 간략하게 말할게. 모든 서류들은 일본어로 써야 한다는 건 당연히 알고 있겠지? 그리고 숫자를 표기할땐 갖은자로...\" 아 이런... 바르스는 비참해졌다. 무슨 소린지 하나도 못 알아듣겠다! 허겁지겁 가슴팍에서 단어집을 꺼낸 그는 빈 여백에 서툰 일본어로 글을 썼다. \"미아나지만, 잘 아라듯지 모타겟어요. 부디 글로 써주지 안겟어요?\" 아오이는 한숨을 쉬었다. 아오이는 잠깐동안 빠른 속도로 글을 써주더니 그에게 건네다주었다."
 COU_event.27.a:0 "바르스는 지친 몸을 이끌고 자리에 앉았다."
 COU_tooltip_the_new_days_of_humans:0 "§g인권보장실장 근무 첫 날, 일은 순탄치 않았다. 아오이에게 서류를 하루에 다섯 번이나 되돌려받는 수모를 겪고 나서야 서류 하나를 제대로 처리할 수 있었다. 바르스는 지쳐 의자에 기대 누웠다. 해가 졌다. 그렇지만 그는 지치지 않았다. 드디어 그는 가난하고 없는 이들을 위해서, 더 나아가, \"인류\"를 위해서 일할 수 있게 되었으니까.§!"
 COU_event.28.t:0 "다시 한번"
 COU_event.28.desc:0 "시치도 유키노는 츠키유키 미야코와 방을 나눴다. 짧은 시간이었지만 관리되지 않아 어느새 먼지가 소복이 쌓였다. FOX소대는 SRT 별관의 2층을, RABBIT소대는 3층을 쓰기로 했다. 돌아온 날 그녀들이 가장 먼저 한 것은 당연히 대청소! FOX소대는 3층을, RABBIT소대는 2층을 3시간에 걸쳐 청소를 했다. 밖은 조금 낡아 버렸지만, 안은 그래도 깨끗해졌다. 니코가 싸온 유부초밥을 SRT의 소대원들은 나누어 먹었다. 유키노는 잠시 쪽잠을 청했다. 발키리 교정국에서는 계속 편히 잘 수가 없었다.\n\n유키노는 한 시간 뒤 눈을 떴다. 발키리에서 잤을 때보다 백 배는 더 개운했다. 니코가 남은 유부초밥을 유키노에게 주었다. 조금 식었지만 그래도 맛있었다. 유키노는 오랜만에 미소를 지어 보일 수 있었다. 후배들은 밖에 나가서 운동장을 쓸고 있다고 했다. 유키노는 니코의 어깨를 툭툭 쳤다. 잠시 자 두라는 표시였다. 니코는 빙긋 웃으며 이제 더는 당번을 서지는 않아도 된다며 말했다. 유키노는 그에 화답했다. 맑은 공기가 창틀 너머로 유키노의 코를 간질였다. 마치 정의만을 찾아 나서던 1학년으로 돌아간 것처럼, 유키노는 웃어 보였다."
 COU_event.28.a:0 "당분간 SRT는 남아 있으리라."
 COU_tooltip_srt_got_backed_and:0 "§gSRT는 그렇게 다시 한번 태어났습니다- 더는 새로운 신입생을 받지 않겠다는 조건 아래에서요.§!"
 COU_event.29.t:0 "인권보장실 설립?"
 COU_event.29.desc:0 "카야가 린 대행에 대한 반기를 들기 시작했다는 소문은 점차 현지인들에게는 사실로서 받아들여지고 있습니다. 이들은 카야에게 비밀스럽게 접촉하여 자신들의 몇가지 '요구'를 전달했는데, 가능한 한 빨리 논의되고 있는 인권보장실을 설립하라는 것입니다.\n\n카야는 물론 이러한 '건방진 요구'를 평소같으면 절대로 들어 주지 않겠지만, 린 대행을 탄핵하는데에 있어 현지인들의 도움이 필수불가결한 상황에서 카야의 선택지는 그다지 많지 않습니다. 하지만 그들은 모릅니다. 어쨌든 결과적으론 카야를 지지할 수 밖에 없다는 걸 말입니다. 그러니 남은 방법은 조금 귀찮더라도 그들의 말을 따라 정치적인 지지를 얻거나, 뭐, 그냥 무시하던가, 둘 중 하나입니다."
 COU_event.29.a:0 "알았다."
 COU_event.30.t:0 "석방"
 COU_event.30.desc:0 "아담하기 그지없는 암스테르담의 교도소에서 맞는 출소일은 그 어떠한 쾌락보다도 즐거웠다. 무슨 일인지 정확히는 모르겠었지만, 아마도 '방위실장'이라는 년이 그를 특별히 석방시켜준 모양이었다. 윗대가리놈들도 자멸하는 꼴이라니, 네덜란드는 어째서 그러한 멍청이같은 년들한테조차도 멸망해버렸는가! 당연히 여왕이랑, 빌어먹을 내각부터 썩어서였음이 틀림없다. 최소한 헤이턴은 그렇다고 생각했다.\n\n하지만 그건 지금 당장 중요한게 아니었다! 그날은 부실해빠진 점심 식사도, 따분해 그지없는 오후의 운동 시간도 헤이턴은 환히 웃은 채로 지냈다. 그가 발걸음을 옮길 때마다 존경과 동경에 가득 찬 눈망울들이 헤이턴을 경배했다. 어디선가 커다란 프랑스산 와인을 구해 온 헤일커르컨은 웃으며 헤이턴을 찾았다. 헤이턴은 미소로 화답하며 헤일커르컨을 맞이했다. 헤일커르컨은 대전이 당시 뮈서르트와의 갈등으로 싸운 것이 구심점이 되어 파시스트임에도 불구하고 체포당하지 않았었다. 헤이턴은 속으론 그를 경멸했지만, 뭐, 특별히 면회까지 오셨으니, 라고 생각했다. \"오늘이 출소라 간수에게 부탁해서 들여왔어. 그 간수, 널 정말 좋아하더군!\" 헤일커르컨이 웃으며 헤이턴에게 술을 따랐다. 헤이턴은 몇잔 마시더니 그 간수에겐 사인도 해 줬다며 농담을 주고받았다. 기분이 좋았다.\n\n하지만 헤이턴은 이내 곧 생각에 빠졌다. 헤일커르컨은 불편한 미소를 지으며 말했다. \"자네, 더 안 마실 거면 내가 다 마시겠다네.\" 헤이턴은 그러라고 했다. 헤일커르컨은 영 못마땅한 표정으로 술병의 코르크 마개를 다시 채웠다. 헤이턴은 감옥에서 썩은 시간만큼이나 생각할 것들이 많았다. 그와 농담을 더 주고 받을 시간은 없었다. 곧이어 간수가 헤이턴의 이름을 불렀다. 석방이란다. 헤이턴은 몸을 일으켜 의자에서 일어섰다. 헤일커르컨도 그 자리에서 같이 일어섰다."
 COU_event.30.a:0 "그리고 헤이턴은 철문을 밀고 나갔다."
 COU_tooltip_letsgo_fascists:0 "§g헤이턴은 통제에서 벗어났습니다. 그리고 파시스트들은 통제에서 벗어났습니다.§!"
 COU_event.31.t:0 "오키 아오이의 편지"
 COU_event.31.desc:0 "\"... 아참, 수석 행정관. 재무실장으로부터의 편지입니다.\" 임원이 나나가미 린 수석 행정관의 책상에 그 날 보고서들을 올려놓으며 마치 깜빡했다는 듯 편지를 함께 올려놓았다. 밀랍으로 잘 밀봉되어 밀랍 냄새가 났다. 린은 대수롭지 않게 곁에 놓인 작은 칼로 밀랍을 뜯었다. 재무실장이 어쩐 일로. 그녀는 그 편지를 너무 얕보고 있었다. 린은 편지를 펼쳤다. 또박또박 정자로 적힌 편지의 내용은 마치 격양된 듯 날카로웠다. 오키 아오이는 린에게 무엇을 말하고 싶었길래 편지로 전하는 걸까? 서론을 읽었다.\n\n\"안녕, 수석 행정관. 직접 말로 전하기엔 부적절한 말 같아서 편지로 적어. 게다가 너도 지금 바쁠 테고-\" 린은 별 거 없는 내용에 눈길을 빠르게 아래로 내렸다. 하지만 지루한 내용이 전체는 아니었던 모양이었다. \"-이건 경고야, 수석 행정관. 도대체 무슨 생각이야? 현지인 협력자들에 관한 건은 방위실장의 권한이야. 그건 명백한 월권 행위라고.\" 린은 눈살을 찌뿌렸다. 결국 그게 본론이였군. 린은 천천히 아오이가 경고하는 말들을 읽었다. 하지만 아오이의 마지막 말이 눈에 밟혔다.\n\n\"총학생회장은 널 비호해 줬을 지는 몰라도 이것만은 기억해 줬으면 좋겠네, 수석 행정관.\" \"너는 총학생회장이 아니야.\" 린은 한동안 그 글씨를 바라다보았다. 하, 그렇다고 저 '정신나간 폭도집단들'을 가만히 내버려 두라는 것은 더욱이 말이 되겠는가? 당연히 말이 되지 않는다."
 COU_event.31.a:0 "린은 한숨을 쉬며 편지를 서랍 속에 넣었다."
 COU_tooltip_rin_says_what:0 "§g편지는 수석 행정관의 서랍 깊은 곳에서 속삭였다. 이제 시작이라고.§!"
 COU_event.32.t:0 "만남"
 COU_event.32.desc:0 "헤이그의 오래된 여관에서는 퀴퀴한 냄새가 났다. 거미와 쥐들이 판을 쳤고, 사람없는 빈 방은 먼지에 소복이 쌓였다. 아무도 찾지 않는 그러한, 소년들의 이상적인 '비밀 기지'같은 곳이었다. 그러한 곳에서, 초대되지 않은 불청객 두 명은 군 제복을 입었지만 가죽 자켓에는 금색으로 칠해진 총학생회의 문양을 단 제복을 입고 있었다. 그들은 협력자였고, 몇번 주위를 살피던 이들은 곧 부서지기 직전의 문을 열고 들어갔다. 고통에 몸부림치는 문의 끼익거리는 소리가 울러퍼졌다. 정돈된 책상에는 새하얀 제복을 입은 분홍빛 머리의 여자아이, 시라누이 카야가 홀로 체스를 두고 있었다.\n\n두 명 중 한명이 조심스럽게 물었다. \"바타비아의 꽃.\" 카야는 탐탁치 않은 얼굴로 대답했다. \"다윗의 별.\" 안도의 숨을 고른 이들은 곧이어 한 사내를 들여보냈다. 파이프 담배를 든 채 들어온 사내는 곧이어 거만한 자세로 자리에 앉았다. \"체크메이트로군.\" 파이프 담배를 문 사내, 알프러트 헤이턴은 체스판을 보더니 말했다. 타들어가는 담뱃잎 향은 카야의 속을 불편하게 했다. \"여기서 계속 판을 바라보았자 무슨 의미가 있나, 카야 양.\" \"카야 양이 아니라 총학생회 방위실장이라니까요.\" 퉁명스러운 얼굴로 카야는 대답했다.\n\n마치 반항하는 사춘기 소녀를 대하는 아버지의 얼굴처럼, 헤이턴은 멋쩍은 미소를 지었다, \"어쨌거나, 계속 바라보아서 뭘 할 심정이지?\" 그가 파이프를 태우며 물었다. \"이미 게임은 끝난 데다 백은 킹 한개밖에 없어. 반해서 흑은 퀸과 비숍, 나이트와 폰도 있지. 이기기란 불가능할텐데.\" \"그래요, 보통같은 때라면 그렇겠죠.\" \"보통같은 때? 무슨 뜻이지?\" 카야는 체스판 곁에 놓인 백의 폰 다섯 개를 판에 올렸다. 그리고서는 씨익 웃으며 말했다. \"폰 다섯 개가 더 생겼네요.\" \"그래서? 그래서 뭐? 규칙을 어기겠다고?\" 헤이턴은 이해할 수 없다는 듯 물었다.\n\n\"네, 그런 셈이죠.\" \"만든 지도, 잊어먹은 지도 몰랐던 그런 규칙...\" 이내 카야는 헤이턴을 바라보며 비숍 두 개와 나이트 두 개를 손에 끼웠다. \"비숍 하나, 나이트 하나. 이것들만 있으면, 충분히 이길 수 있어요.\" 카야가 말했다. \"규칙을 어길 거라면, 이런 것도 되는 법이죠.\" 카야는 킹을 판의 구석으로 옯겼다. 그러고는 비숍과 나이트를 흑의 킹 뒷편에 꽂아 넣었다. 판세는 달라져 보였다. 확실히, 그 전과는 달랐다. \"제 비숍과 나이트가 되어 주세요.\" 카야는 눈망울을 굴리며 헤이턴을 바라보았다. \"언제던지 킹으로도 바뀔 수 있을 테니까요.\" 판을 바라보던 헤이턴은 이내 책상을 치더니 크게 웃었다. 하하하. 푸하하하하. 카야는 불편한 표정으로 헤이턴을 바라보았다. 웃음기가 가신 그는 말을 이었다."
 COU_event.32.a:0 "\"'그런 규칙은 없지만 언제던지 만들면 된다' 라.\""
 COU_tooltip_fascists_agree_kaya:0 "§g카야는 미소로 화답했다. 파시스트들은 이제부터 카야와 완전히 협력할 것이다. 자그마한 헤이그의 여관에서 일어난 일들은 아무도 모를 것이었다.§!"
 COU_event.33.t:0 "심문관에게"
 COU_event.33.desc:0 "발신- 방위실장 시라누이 카야, 수신- 레옹 드그렐.\n\n드그렐, 간단하게 말하겠습니다. 플란데런 국민연합의 수장이라고 들었는데, 불신임 투표를 진행할 때 린의 탄핵을 지지하는 시위를 열어 주세요. 그것도 아주 크게요. 돈은 얼마던지 드리겠습니다. 돈뿐인가요? 플란데런 자치구의 수장으로도 임명해 드릴 수 있습니다. 제 요구 사항만 완벽히 수행해 주신다면 말입니다. 후후, 부디, '벨기에의 심문관'이라는 별명에 걸맞는 결과를 보여 주시면 좋겠습니다. 남는 실장 자리도 드릴 수 있습니다. 저를 도와 주신다면 말입니다. 물론 이 편지에 답하지 않으셔도 됩니다만, 그렇다면 얻어가는 건 아무것도 없으실 겁니다.\n\n그러면 이만 안녕히."
 COU_event.33.a:0 "p.s. 제대로 안 하시면 돈 안 드릴 겁니다."
 COU_tooltip_flanderns_agree_kaya:0 "§g드그렐은 처음엔 어린아이의 장난인 줄 알았다. 하지만 편지에 각인된 총학생회의 로고를 보고 나서야 그것이 진짜였다는 걸 알아차렸다. 뭐 그렇지만, 마침 린이 아니꼽기도 했으니, 드그렐은 그녀를 한번 믿어 보기로 했다.§!"
 COU_event.34.t:0 "붉은 장미와 여우"
 COU_event.34.desc:0 "시라누이 카야는 발키리 교정국 학생의 안내에 따라 교정국의 심문실에 들어섰다. 교정국에는 '자신이 직접 심문'하겠다며 절대로 심문을 엿듣지도 말고 중간에 들어오지도 말라고 경고해 두었으니 (들어온다면 방위실장의 권한으로 감빵에 쳐넣어 주겠다고) 카야는 그나마 안심하고 '심문'을 할 수 있었을 것이다. 카야는 다리를 꼬고 심문실 의자에 앉았다. 교정국의 학생이 시치도 유키노를 데리고 나왔다. 유키노의 표정은 복잡했다. 괜히 일을 키운 것에 대한 죄책감인지, 후배들을 이러한 곳에 휘말리게 한 죄악감 때문인지, 카야는 손쉽게 판단할 수 없었다. 그래도 회유하기엔 쉬워 보인다는 것은 명백했다. 카야가 먼저 입을 뗐다. \"이곳에서의 생활은 어떤가요, 유키노?\" 유키노가 작게 무어라고 중얼거렸다. 카야는 좀 더 큰 소리로 말해달라고 했다. \"괜찮다.\" 하, 그게 정말일까? 카야는 천천히 자신의 의도를 말했다. 작은 과도로 사과의 껍질을 도려내듯이, 아주 천천히, 돌려 말하면서\n\n유키노는 회유하기 어려운 상대였다. 하지만 SRT로 지내는 2년 동안 대전이를 겪으면서 그 잘난 '자신만의 정의'는 이용해먹기 정말 쉬운 것이었다. 카야는 SRT 특수학원의 부활을 약속했다. 자신이 직접 총학생회장이 된다면, 그딴 명분 따위는 이미 충분하다고. 유키노는 잠시 생각해보겠다고 했다. 유키노는 잠시 후 고개를 끄덕이더니 FOX 소대의 소대원들과 이야기를 해 보겠다고 했다. 카야는 미소를 지으며 결정했다면 편지로 알려 달라고 했다. 자신이 가슴팍에 가져온 특수 화학 처리가 된 펜을 건네면서. 그 펜은 쓰고 난 뒤 5분 만에 투명해지는 잉크를 썼다."
 COU_event.34.a:0 "카야는 부디 잘 생각해보라고 말했다."
 COU_tooltip_srt_foxs_agree_to_kaya:0 "§g얼마 지나지 않은 시간, 발키리로부터 한 통의 편지가 왔다. 'SRT의 FOX 소대는 시라누이 실장에게 협력하겠다.' 카야는 편지를 받고 기분 좋게 캐모마일 티를 마셨다. 기본적인 차였지만 가끔씩은 이런 기본적인 차도 나쁘지 않다고 생각했다. 하지만 카야는 그 대화가 모두 녹음되었다는 사실은 몰랐다.§!"
 COU_event.35.t:0 "방위실장에게의 문자"
 COU_event.35.desc:0 "시치도 유키노-- \"방위실장, 자고 있어?\"\n\n시라누이 카야-- \"...  아뇨, 슬슬 자려던 참이었는데요.\"\n\n시치도 유키노-- \"정말로... 너와 협력하면, 나와 FOX 소대, 그리고 내 후배들까지, 모두 책임져 주는 거야?\"\n\n시라누이 카야-- \"아아, 그런 것 때문이었나요. 당연하죠. 물론입니다. 하지만, 그러려면, SRT의 도움이 필요합니다.\"\n\n시치도 유키노- \"무슨 도움?\"\n\n시라누이 카야-- \"... 총학생회에 '사보타주'를, 부탁드려야겠습니다.\"\n\n시치도 유키노-- \"...... 그게 대체 무슨 소리야?\"\n\n시라누이 카야-- \"린 대행을 탄핵시키고, 제가 새로운 대행이 되어야 SRT의 부활이던 뭐던 가능한 법입니다.\n하지만, 그러려면, '명분'이 필요합니다.\n도와주신다면, 확실하게 배상해 드리겠습니다.\""
 COU_event.35.a:0 "시치도 유키노-- \"... 그거, 확실한 거지?\""
 COU_tooltip_srt_can_able_to_use:0 "§g린의 탄핵을 원할하게 하기 위한 §YSRT의 사보타주§! 디시전이 활성화됩니다.§!"
 COU_event.36.t:0 "RABBIT 소대, 신고합니다."
 COU_event.36.desc:0 "FOX 소대는 최근 FOX 소대의 석방 이후 사라진 RABBIT 소대의 행방을 찾기 위해 노력했다. 그 결과 RABBIT 소대는 코우사기 공원에서의 노숙을 통해 항명을 진행하고 있다는 것을 알아냈다. 아마도 방위실장이 RABBIT 소대까지 특별히 석방시켜준 모양이었다. 그것만큼은 방위실장에게 고마웠다. 그것은 유키노의 진심이었다. 이들이 물자를 탐색하기 위해 한 폐건물에 진입한다는 소식을 오토기로부터 들은 깜작 서프라이즈를 준비했다. 유키노는 1층의 상자 뒤에서 잠복했고, 니코는 2층의 문 뒤에서 RABBIT 소대를 기다렸다. 미야코는 1층에서 후방을 경계하다 역으로 전방에서 붙잡혔고, 사키는 교범대로 문 근처에서 경계하다 니코의 매복에 걸려들었다. 모에와 미유는, 당연하게도 근처에서 숨어 있다가 쿠루미와 오토기가 발견해 데려왔다.\n\n\"선배님!\" 머리에 개머리판을 맞았지만 별로 내색하지 않으며 유키노에게 인사를 건네는 미야코였다. 발랄한 미야코의 미소를 보자 유키노는 내심 미안해졌다. 미야코를 데리고 2층의 본관으로 가자 소대원들이 모여서 담소를 나누고 있었다. 그러한 노숙 생활을 어떻게 버텼냐에서부터, 교본에만 의지해서는 안된다는 내용 등등. 사키가 메모장에 메모를 받아적는 동안, 미야코는 유키노에게 무슨 일이냐고 물었다. 유키노는 뜸을 들이더니 입을 뗐다.\n\n\"갑작스러울지는 모르겠지만, RABBIT 소대는 여기서 해체다. 너희들 모두 FOX 소대의 분견대로서 활동하게 될 거야.\" 침묵이 이어졌다. 사키가 그게 무슨 소리냐고 물었다. \"너희들도 SRT 학원의 부활을 위해 그렇게 항명을 하는 것이겠지. 하지만 그게 얼마나 갈까? 3개월은 넘길 수 있을 것 같나? 아니. 조만간 다시 교정국에 끌려가 수감당할 거야. 그러니까, 항명은 여기서 그만두고, 우리에게 합류하도록 해. 방위실장이라는 후원자가 생겼으니.\" \"...\" \"츠키유키 소대장. 넌 이제 '책임'을 짊어질 필요 없다. 책임은... 나와 높으신 분들이 질 테니, 각 소대원들은, '무기'로서 사명을 다하도록.\" \"그렇다면... 저희는 이제 무엇을 하게 되나요, 유키노 선배님?\" \"... 총학생회에 사보타주를 가해야 한다. 철도에 폭탄을 설치하고, 역에 EMP를 터트리는 것. 그래, 그래야만, 카야 실장이 SRT를 부활시킬 수 있다. 물론 너는-\" 미야코가 고개를 저으며 유키노의 말을 끊었다.\n\n미야코는 근처의 돌부리에 걸터앉았다."
 COU_event.36.a:0 "그리고 미야코는 입을 뗐다."
 COU_event.37.t:0 "RABBIT 분대, 신고합니다."
 COU_event.37.desc:0 "착잡한 듯 보이는 미야코의 볼은 뜨거웠다. 미야코는 한참이 지나서야 입을 뗐다. \"유키노 선배님. 저는 선배님들을 동경했습니다. TV 속에 나온 선배들의 모습은, 밝게 빛나고 계셨습니다.\" \"우리가 갖지 못했던 이상을,\" \"가혹한 상황 속에서도 중심을 잃지 않는 엄격함을,\" \"그 어떤 악이더라도 일격에 제압할 수 있는 정의를,\" \"공포와 공허 앞에서도 흔들리지 않는 용기를,\" \"저희들은 동경해 왔습니다.\" \"그렇지만... 시민들에게 위해를 가하고... 그게 정말 맞는 건가요?\" 미야코의 두 볼엔 자그마한 눈물들이 흘러내렸다. \"저는 모르겠어요, 선배님. 암스테르담 공략전에서도, 저는, 저는... 죄 없는 '어른'들을 죽였어요... 전, 정확히 알지도 못하는데도 더는 그러고 싶지 않아요...\" 미야코가 흐느꼈다. 유키노는 계속 그런 미야코를 바라보다가 말했다.\n\n\"그건 네 잘못이 아니야. 음, 그래, 츠키유키 소대장.\" \"그래야만 하게 만들었던, '어른'들의 잘못이지... 안 그래?\" \"너는, 마땅히 너만의 \"책임\"을 다한 거다, 츠키유키.\" \"하지만 너도 그렇기에 느꼈을 거야. 너와 소대원들은, 모두 결국엔 '무기'야. 그래. 우리는, 아직 '어른' 이 아니기에... 아직은, 모든 것을 책임질 수는 없어. 그건 사실이야.\" \"하지만 너는 SRT고, SRT는 마땅한 '무기'로서, '무기의 본분'을 다해야 한다는 사실은 변치 않는다, 츠키유키.\"\n\n유키노는 자리에서 일어나 문 앞에 섰다. 뒤를 돌아본 유키노는 나가기 직전 미야코에게 충고했다. \"정확히 알 수도 없는 책임과 판단은 모두 맡기고 무기로서의 본분을 다할 것인지,\" \"아니면, 망설임을 영원히 품은 채, 녹슨 칼로 헛된 '정의'만을 뒤쫓다 영원히 후회하던지, 두 가지 뿐이다, 츠키유키.\" \"이제 더는 책임지지 않아도 된다. 그것뿐이야. 마음이 달라졌으면, 언제라도 좋으니 문자 남기도록.\" 유키노는 문을 열고 나갔다. 오토기는 유키노의 눈치를 살피다 금세 빠져나갔고, 니코는 미안하다고 사키의 철모를 쓰다듬으며 밖으로 나갔다. 쿠루미는 잠시 서 있다 이내 따라나섰다. 빈 폐건물은 생각으로 가득 찼지만 침묵으로도 가득 찼다."
 COU_event.37.a:0 "'정의'란, 대체 무엇일까."
 COU_tooltip_rabbit_joins_fox:0 "§g미야코는 결심한 듯 일어섰다. RABBIT 소대는 급히 FOX 소대의 뒤를 따라갔다.§!"
 COU_tooltip_activate_buntangs_srt:0 "§YSRT의 사보타주§! §g디시전이 해금됩니다.§!"
 COU_event.41.t:0 "잠시 안녕"
 COU_event.41.desc:0 "\"... 응, 그러면, 잠시 작별이야.\" 미노리는 용역부원들을 끌어안으며 포옹했다. 체리노스크의 항구에서는 총학생회의 깃발을 단 선박이 다가오고 있었다. 미노리가 돌아서며 손짓했다. 배가 천천히 항구에 정박했다. 배에서는 모자를 눌러써 얼굴을 알아볼 수는 없는 사람 한 명이 내렸다. 그녀의 말투로 보아 인재자원실장인 듯 했다. \"동지들! 어서들 오시게!\" 인재자원실장이 배로 미노리와 몇 명의 용역부원들을 인도했다. 인재자원실장은 이렇게 무급으로 린 대행에 대한 탄핵 시위에 참여해 주어서 정말 고맙다고 감사의 말을 밝힌 뒤 선장을 시켜 다시 한번 배의 엔진을 켰다.\n\n배가 점차 항구를 떠나기 시작했다. 하지만 여전히 항구에는 돌아가지 않은, 수많은 용역부원들이 미노리가 바다 저 너머 저편으로 사라지길 기다리며 항구에 서 있었다. 미노리는 잠시 앉아 있다 그녀들을 발견하고는 일어서 품 속에서 붉은 확성기를 하나 꺼냈다. 톡톡, 치며 확성기를 켠 그녀는 소리쳤다.\n\n\"붉은겨울 용역부! 우리는 잠시 여기서 안녕이지만, 억압에 대한 투쟁은 계속되어야만 하는 거야! 자, 함께 외치며 작별하자! \"아무거나\" 규탄한다! \"이것저것\" 보장하라! 우리 붉은겨울 용역부는, 헤어져서도 새로운 투쟁을 시작한다!\" 환호와 박수갈채가 미노리에게 쏟아졌다. 용역부원들은 떠나가는 배를 향해 목청이 터지도록 외쳤다.\n\n\"아무거나 규탄한다! 이것저것 보장하라!\""
 COU_event.41.a:0 "\"잘 다녀와, 미노리 쨩!\""
 COU_event.42.t:0 "집에 돌아와"
 COU_event.42.desc:0 "용역부원들은 기쁨을 감출 수 없었다. 총학생회에서의 성공적인 반제 투쟁이 성공적으로 마무리되었다는 소식을 이미 뉴스로 접했기 때문이다! TV 화면 너머 기자는 열정적으로 '미노리 동지'의 열성적인 '반제 투쟁'이 성공적으로 대행을 탄핵시킬 수 있을 것이며 억압의 사슬이 풀렸다고 보도하고 있었다. 혁명과 투쟁은 바깥에서도 계속된다! 용역부원들은 미노리가 자랑스럽기까지도 했다. 원래도 그랬지만, 뭐 어때! 체리노스크의 항구는 다시 한번 복작거렸다.\n\n누군가 저 멀리서 미노리가 보인다며 소란을 피우자 항구가 꽉 차 마치 하나의 '투쟁'을 보는 듯 했다. 미노리가 저 멀리서 용역부원들을 향해 손을 흔들고는 있었지만, 무언가 어째서인지 표정이 어두워 보였다. 배에서 미노리는 용역부원들의 환호를 온 몸으로 받으며 내렸다. 하지만 미노리는 잠시 조용히 하라는 듯 확성기를 톡톡, 쳤다. 미노리는 항구의 저편에서 확성기에 대고 말했다.\n\n\"... 그렇게 린 대행에 대한 탄핵 시위는 성공적이였어. 하지만 내가 지금 마음에 걸리는 건, 다음 대행에 대한 탄핵 시위를 진행하지 못했다는 거야.\" 분위기가 쳐졌다. 그렇지, 지금의 대행을 탄핵시키더라도 억압자들은 언제나 바로 다음에 있으니까.\n\n하지만 한 용역부원의 외침으로서 미노리는 조금이나마 기분이 풀어질 수 있었다. \"그러면 우리가 그때 또 시위를 하러 가면 되는 거지! 걱정 마, 용역부장!\" 미노리는 크게 웃으며 알겠다고 했다. 미노리는 곧바로 배에서 특제 \"붉은겨울 진\" 을 꺼냈다. 몇 잔을 따라 마신 용역부원들은 한껏 격양된 기분으로 항구를 떠났다. 그 다음 시위가 곧 예정되어 있었다. \"[RED.GetLeader] 탄핵을 위한 여정을 향해서, 전진!\" 미노리가 소리쳤다.\" \"전진!\" 용역부원들은 즐겁다는 듯 격양된 표정으로 미노리를 따라 길을 나섰다. 이번엔 좀 더 오랫동안 시위를 할 수 있을 것 같았다. 마치 총학생회에서 그녀들이 했던 것처럼, 아주 오래, 그리고 아주 끈질게."
 COU_event.42.a:0 "\"어서 와, 미노리 쨩!\""
 COU_event.38.t:0 "야스모리 미노리의 입국"
 COU_event.38.desc:0 "인재자원실장은 내심 카야에게 투정을 부렸다. 왜 자신이 직접 배를 타고 시위꾼들을 데리러 가야 하는가? 나참, 이렇게 귀찮은 것이 없었다. 항해는 북해의 거센 파도 때문에 며칠 더 연장되기까지도 했다. 인재자원실장은 그나마 시위꾼들이 무급으로 봉사하기로 했다는 점에서 안도했다. 그것마저 없었다면 그녀는 중간에 배를 돌려 다른 사람을 시켰을 것이다. 그만큼 붉은겨울로의 항해는 역겨웠다. 선장에게 배의 속력을 최대한 올려달라고도 했지만, 속도가 빨라질수록 더욱이 뱃멀미는 심해질 뿐이어서 그냥 자포자기해버리기도 했다.\n\n그러나 결과적으론 그녀는 배에 시위꾼, 미노리와 용역부원 몇명을 태워 D.U.로 돌아왔다. 인재자원실장은 그때만큼이나 D.U.가 그리웠던 적이 없었다. 카야 방위실장은 성격이 급해서, 배에서 내리자마자 시위를 진행하라며 말했다. 인재자원실장은 그 논리없는 말에 화들짝 놀라며 하루만 시간을 달라고 카야에게 간청했지만, 카야는 \"감빵에 쳐넣기 전에 당장\" 하라며 그녀를 닥달했다. 까라면 까야지, 그럼 어떡하겠는가.\n\n인재자원실장은 배에서 내린 미노리에게 말을 걸었다. \"그... 용역부장? 죄송하지만, 혹시 지금 상태가 괜찮으실까요?\" \"응, 괜찮아. 그런데 왜?\" \"아아, 별 건 아니고, 지금 당장 시위를 진행해 주셨으면 해서...\" 으윽, 최악이었다. 아마도 나를 경멸의 눈으로 바라볼 지도 모른다, 고 그녀는 생각했다. 하지만 돌아온 답변은 의외였다. \"무슨 소리를 하는 거야? 당연히 처음부터 그러려고 했어.\" 아, 하느님, 감사합니다... 인재자원실장은 온갖 감사를 드린 후, 미노리와 용역부원들을 D.U. 행정위원회 건물의 근처 도로로 안내했다. 근처에는 새롭게 지어진 어색한 네덜란드풍의 건물들이 한 켠을 차지하고 있었다. 인재자원실장은 그녀들에게 숙소를 잡아 주려고 했지만, 그녀들은 고맙게도 길에서 노숙하며 해결하겠다고 했다. 아마도 하늘은 오늘 그녀의 편이었던 모양이다."
 COU_event.38.a:0 "\"자, 그럼 시작해볼까?\""
 COU_RED_MINORI_START:0 "이 §Y'전문 시위꾼'§!들은 2주 동안 §Y린 대행에 대한 반대 시위§!를 펼칠 것입니다."
 COU_event.39.t:0 "중간 보고"
 COU_event.39.desc:0 "음, 이거, 이렇게 쓰면 되는 건가? 어, 그렇지. 방위실장님, 린 대행에 대한 탄핵 시위는 성공적입니다. 전문 시위꾼들은 매일같이 밤낮을 가리지 않고 린 대행을 규탄하고 시민들을 동요시키는데에 성공적인 역할을 하고 있습니다. 하핫, 역시, 제 모교 붉은겨울 연방학원의 학생답게 시위는 잘 하더군요. 이들에게 나중에 보상이라도 하심이 좋을 것 같습니다.\n\n아, 그리고 방위실 근처로는 접근하지 말라고 지시했으니 한동안은 괜찮으실 겁니다. 어기기라도 한다면, 감빵에 쳐넣겠다고 협박하면 되는 부분이고요. 그리고 마지막으로, 계약서 한 장만 가져다주실 수 있으신가요? 용역부원들 한 명 골라서 계약서에 서명시키려고 합니다. 아무래도 무급이니 불안해서요."
 COU_event.39.a:0 "\"서명- 인재자원실장.\""
 COU_tooltip_kaya_and_minori:0 "§g카야는 편지를 뜯어 인재자원실장의 중간 보고 편지를 읽었다. 바깥에서는 용역부원들이 방위실을 향해 한창 시위하고 있던 참이었다.§!"
 COU_event.40.t:0 "마지막 시위"
 COU_event.40.desc:0 "\"네, 그럼 계약에 따라 오늘이 마지막 시위네요. 그동안 수고하셨고, 고생 많으셨습니다.\" 인재자원실장이 용역부원들에게 커피를 돌렸다. 하지만 미노리는 여간 불만족한 듯한 눈치였다. 아마도 인재자원실장이 용역부원을 시켜 멋대로 이상한 계약서에 서명하게 했으니 그래보였다고 그녀는 생각했다. 하지만 이미 계약서는 용역부의 이름으로 작성되었고, 그 계약에 따라 미노리는 오늘이 총학생회에서의 마지막 시위였다. 발키리 생활안전국은 마지막으로 시위 현장을 정돈했다. \"오늘도 시위 열심히 하세요!\" 나카츠카사 키리노가 시위 현장 근처에 바리게이트를 치며 말했다. 미노리는 고개를 끄덕이며 확성기를 켰다.\n\n\"용역부! 오늘이 마지막이다! 오늘 한번, 죽을 듯히 해 보자!\" 용역부가 미노리에게 호응하며 정해진 구호를 외쳤다. \"나나가미 린 권한대행은 당장 하야해라!\" \"푸딩을 매일 1개씩 배급해라!\" \"붉은겨울에 꼭 보내줘라!\" 이와비츠 아유무는 행정위원회 건물에 들어서며 시위대를 바라보았다. 오늘만큼은 품속에 놓인 서류가 무겁게 느껴졌다. 그것도 그렇지만, 어제 아유무는 싱숭맹숭한 글을 읽었기 때문일지도 모른다. \"솔직히 린 탄핵 지지하면 개추 ㅋㅋ\" 라는 제목의 인터넷 글은 총학생회 전역에서 인기를 끌었다. 추천의 개수가 천 개를 넘었다. 이미 민심은 흔들려버린 걸까? 하지만, 린이 사라진다면 그 자리는... 아마도... \"툭!\" \"아, 죄송합니다!\" 잠시 생각에 빠졌던 아유무는 누군가와 부딪히고 나서야 움직였다. 하지만 여전히 표정은 생각하는 듯 굳어 있었다.\n\n카야는 한편 방위실에서 여느 날처럼 체스를 두고 있었다. 만족스럽게 미노리가 시위하는 모습을 지켜보면서 감상했다. 계약서에 '방위실 인근에서는 절대로 시위하지 말 것'이라는 문구를 썼던 것은 아주 잘 한 행동이었다고 카야는 느꼈다. 카야는 헤실헤실 웃으면서 체스를 두었다. 곧 끝이 보였다."
 COU_event.40.a:0 "체스의 말들이 흥에 겨워 움직였다."
 COU_tooltip_minori_ended_movement:0 "§g미노리의 시위가 종료됩니다.§!"
 COU_event.43.t:0 "발자국"
 COU_event.43.desc:0 "\"오늘의 첫번째 안건은 시라토리구의 열차 노선에 대한 폭파 사건의 진위 규명과 도로 싱크홀 원인에 대한 분석입니다.\" 임원이 자료 슬라이드를 펼치며 말헀다. 카야는 걱정되는 '척' 했다. 내심 엄청 많이 기뻐하고 있었다. 왜냐하면, 안건이 제출되자마자 수많은 임원들이 린 대행의 정통성과 안정성을 비판하고 나섰기 때문이라. 카야의 예상은 정확히 들어맞았다. 차를 꺼내어 마시던 카야는 모든게 순조롭다고 생각했다. 두번째 안건이 들어오기 전까지는.\n\n\"... 이제 두번째 안건입니다. 두번째 안건은 방위실장과 SRT 간의 특별 청탁에 관한...\" 카야는 마시던 차를 뱉어 버릴 뻔 했다. 이게 대체 무슨 소리지? 임원은 카야의 목을 죄는 듯 발표를 이어나갔다. \"... 폭파된 노선 근처에서 SRT 특수학원의 명찰이 발견되었습니다. RABBIT 소대의 '소라이 사키'의 명찰인 것으로 확인되었으며, SRT는 최근 카야 대행의 비호에 따라 특별 사면...\" \"잠, 잠시만요. SRT가 나왔다는 건 둘째치고, 그게 저인지 어떻게 확, 확정지으시죠?\" 카야가 급히 말을 끊으며 물었다. 임원은 아무런 말 없이 녹음된 녹음기를 틀었다.\n\n\"네, 저와 함께하신다면-\" \"도움을 주신다면-\" 완전히 망했다. 카야의 특별 석방임이 밝혀졌다. 아, 아, 제기랄, 제기랄... 대체 언제 발키리 이것들이 녹음해놓은 거지? 내가 그렇게 녹음하지 말라고 미리 경고했을 텐데! 카야는 속으로 화를 내며 진정하려고 시도했다. 하지만 곧이어 린 대행이 SRT를 어째서 사면하였냐며 공격해오는 바람에 카야는 급히 자리를 피할 수 밖에 없었다. \"하, 참! 조작된 녹음으로 저를 내쫒고 싶, 싶으신 모양인데! 저는 결코 속지 않습니다!\" 카야는 자리에서 일어섰다."
 COU_event.43.a:0 "이내 RABBIT 소대를 찾으러 가기로 했다."
 COU_tooltip_kaya_holy:0 "§g카야는 역정을 내며 회의실을 빠져나왔다. 임원 몇몇이 카야를 비판하는 소리가 복도 너머에서까지도 울려퍼졌다.§!"
 COU_event.44.t:0 "습격 보고서- 분대장 츠키유키 미야코."
 COU_event.44.desc:0 "SRT FOX 소대 RABBIT 분대 분대장 RABBIT 1, 기밀 보고.\n\n츠키유키 미야코 분대장입니다. 명령하신대로 D.U. 인근의 기반시설과 열차 노선, 역 인근에 사보타주를 가했습니다. 작전 도중 분대원들이 작전 수행에 대한 의문을 제기했으나 분대장 재량으로 해결하였습니다. 하이랜더 소속이 아닌 열차 노선을 골라 사보타주하였으며 작전 수행 직후 배급받은 지문 제거 약품과 개인 소지품 및 핵심 자료들을 모두 회수했습니다.\n\n이상 보고 종료."
 COU_event.44.a:0 "서명- 츠키유키 미야코."
 COU_tooltip_kaya_ilikeit:0 "§gRABBIT 1의 보고서를 받아든 카야는 대수롭지 않게 파쇄기에 넣어 절차를 마무리했다. 아마도 RABBIT 분대는, 성공적으로 작전을 완수했을 것이다.§!"
 COU_event.45.t:0 "습격 보고서- 소대장 시치도 유키노."
 COU_event.45.desc:0 "SRT FOX 소대 소대장 FOX 1, 기밀 보고.\n\n방위실장 말대로 일주일 밤에 걸쳐 행정위원회를 습격했다. 문화실장과 보건실장은 얘기해놓은 대로 '죽지 않을 정도'로만 피해를 줬다. RABBIT 분대의 헬리콥터를 빌려서 흔적을 감추는데도 성공했고, 임무 수행 도중 몇 번 발각당하긴 했지만, 마스크를 쓰고 있어서 신원을 특정당하지는 않았다. 대신에 생텀 타워가 조금 전소되긴 했다만 그렇게 피해는 크지 않으니 안심해도 좋다. 이 일로 행정위원회의 임원들은 강경한 대처를 하지 못한 린 대행을 비난하게 될 거다.\n\n보고는 여기까지다.\n\np.s. SRT 특수학원의 부활, 잊지 말아줘. '무기'들의 마지막 소망이니까."
 COU_event.45.a:0 "서명- 시치도 유키노."
 COU_tooltip_kaya_ilikeit2:0 "§g카야는 FOX 1의 추신을 읽지도 않은 채 파쇄기에 갈아버렸다. 임무는 성공적으로 완수했으니, 딱히 문제는 없을 것이다.§!"
 COU_event.46.t:0 "린 탄핵"
 COU_event.46.desc:0 "오늘, 나나가미 린 총학생회장 대행은 회의에 참석하지 않았다. 임원들이 의문을 가지며 대행을 기다리는 동안, 시라누이 카야 방위실장은 여러명의 임원들과 함께 한 장의 서류를 나누어 주었다. 제목은 \"나나가미 린 대행 불신임과 그에 대한 탄핵 여부\" 였다. 임원들은 해당 서류를 받아들임과 동시에, 결국 권력 투쟁에서 카야가 승리했다는 것을 깨달았다. 린 대행을 지지하는 몇 명의 임원들은 이러한 방위실장의 '반역'은 모두 사기이며 날조이자 행정위원회의 권위에 대한 도전이라며 항명했으나 오키 아오이 재무실장은 그러한 의견들을 모두 일축시킴으로서 린 대행의 지지자들은 모두 회의실에서 퇴장하는 수 밖에 없었다.\n\n방위실장이 미소를 지으며 차를 마시는 동안, 행정원이 서류들을 받아들여 지지 푯수를 집계했다. 참석 임원 60인 중 60인, 만장일치로서 린 대행은 탄핵, 카야 방위실장이 후임을 맡는다. 좋았어! 카야의 바람대로, 모든 것이 원하는 대로 이루어졌다. 거슬리던 나나가미 린은 이제는 권력의 한구석으로 밀려나 내쫒겨났고, 참석 실장 3인 모두 카야에게 지지표를 던졌다. 이에 따라 린은 자동으로 가택연금 처리로 안건이 통과되었으며, 카야는 연단에 올라 짤막한 연설을 마무리하고, 행정원을 시켜 즉시 크로노스 스쿨 보도국과 기자들을 불러달라고 부탁했다.\n\n오랜 권력 싸움에서 카야가 이겼다. 모든 투쟁은 마무리되었고, 다른 이들은 카야에게 복종했다. 바깥에서는 한창 레옹 드그렐과 국민연합의 지지 시위가 한창이였으며, 카야는 '민주적' 이고 신속하게 대행의 자리를 빼앗아올 수 있었음에 만족했다."
 COU_event.46.a:0 "\"이제부터, 시작이네요.\""
 COU_tooltip_getout_rin_end:0 "§g린 탄핵 디시전이 비활성화됩니다.§!"
 LETSGO_CHONGHAKS:0 "§g카야의 대행으로서의 첫번째 주가 지남.§!"
 ARONA_YES:0 "§g아로나가 카야를 총학생회장 대행으로서 인정함.§!"
 COU_event.47.t:0 "대행으로서의 첫번째 주"
 COU_event.47.desc:0 "\"-갑작스럽게 예고 없이 이와 같은 형태로 성명을 전달 드리게 되어 송구한 마음을 금할 수 없습니다. 감사합니다.\" 카야는 크로노스 보도국에게 방송 녹화를 끊으라는 신호를 보냈다. 휴, 대행이라는 것은 정말 쉽지 않았다. 왜 린 전 대행을 억류했는지에 대해 답변을 수백번도 넘게 한 것 같았다. 참, 오가타 칸나 공안국장은 바쁜가? 새 대행이 취임했는데도 인사 한번 하러 오지 않다니. 카야는 영 불편한 눈치로 자리에서 일어나 대행 집무실로 돌아갔다. 사실 그냥 원래는 수석 행정관의 집무실이었다. 지긋지긋한 나나가미 린은 끝까지 카야를 괴롭힐 것처럼 보였다.\n\n\"... 후후, 오전 일과를 마치고 마시는 블루마운틴의 향기는 각별하군요.\"\n\n\"이 옅은 산미와 특유의 조화롭고 산뜻한 향-\"\n\n\"똑똑똑!\"\n\n카야는 한숨을 쉬었다. 방금 막 오전 일과를 마치고 온 참이었다. \"대행, 거기 있어? 잠시 들어갈게.\" 재무실장이 문을 열고 들어와 카야에게 몇 개의 보고서들을 올렸다. 카야는 마시던 블루마운틴을 곁에 올려둔 후 그것이 무엇이냐고 물었다. \"이거, 대행이 오늘 냈던 예산안이지? 모두 기각이야.\" 카야가 어리둥절하며 당황해하는 사이, 아오이가 문을 열고 나갔다.\n\n카야가 잠시 아오이를 다시 불러 왜 모두 기각이냐고 물었다. \"왜긴, 숫자들이 모두 갖은체로 쓰여 있지 않잖아. 위조의 위험이 있어서 오늘까지 반드시 다 다시 고쳐서 내.\" 카야는 기가 막혔다. 아니, 재무실이라는 것들은, 내 글씨인지 남의 글씨인지 위조된 글씨인지 구분도 못 한다는 소리인가?\n\n\"그... 모레까지 하면 안 될까요?\"\n\n하지만 그렇다면 어떡하겠는가. 총학생회의 모든 예산은 재무실이 담당한다. 재무실만큼은 자기 편이었어야 했다. 카야는 죽을 힘을 다해 아오이에게 \"예쁘게\" 말해 보았다. 하지만.\n\n\"안 돼. 린은 그날 직접 다 했다고.\" 아오이는 차갑게 카야의 간청을 끊었다. 이이익, 저것 봐, 또 내 말을 안 듣잖아! \"공포\"는 충분히 보여 주었다고 생각했는데! 카야는 이를 갈며 블루마운틴을 마셨다. 그 때, 카야의 머릿 속에 한가지 스쳐지나가는게 있었다."
 COU_event.47.a:0 "\"... 내가 총학생회장이 된다면...\""
 COU_tooltip_arona_fuck:0 "§g카야는 대단한 생각이라도 되는 것 마냥 회심의 미소를 보여 보였다. 대행의 자리를 따 내니, 모든 게 자기 것 같았다.§!\n§Y새로운 총학생회장§! 중점을 해금합니다."
 COU_event.57.t:0 "약속 이행"
 COU_event.57.desc:0 "곁에 놓인 허브티 한잔은 그녀의 속을 비워 주기엔 충분했지만 역겨운 업무를 비워 주기엔 역부족이었다. 이상하게도 네덜란드인들의 반 카야 시위의 첫번째 보고 이후 일이 기하급수적으로 늘어났다. 마치 누군가가 가로채던 서류들이 한꺼번이 올라온 것처럼, 아주 의도적이고 이상한 일처럼 보였다. 그러나 그것보다 중요한 것은, 지금 당장 그녀가 이 일들을 다 해치워야 한다는 것이었다.\n\n\"카야 대행님, 업무중에 죄송하지만 SRT 측으로부터의 요구 사항이 있습니다.\" 업무를 한창 하던 카야의 집무실에서 행정원이 문을 두드리며 말했다. 카야는 들어오라고 했다. 시치도 유키노가 잔뜩 얼굴을 찌뿌리며 이제 더는 기다릴 수 없다고 말하기 시작했다.\n\n솔직히 말해서 카야는 SRT를 곱게 되살려줄 마음은 원체 없었지만, 그녀의 권력이 예상보다 훨씬 약하다는 것이 드러난 지금, SRT의 재개교는 카야의 권력 장악을 위한 필수적인 수단이 되었다. 카야는 급히 일들을 저리 밀어 놓고는 서류 한 장을 뽑아 멋들어진 서명을 했다. 서류의 제목은 SRT 특수학원 재개교 행정명령 6923호, 즉, 행정명령이었다.\n\n유키노의 표정이 금세 다시 밝아졌다. 행정명령은 발동하는 즉시 효과가 나온다. 유키노는 고맙다고 악수를 청하기까지도 했다. 카야는 팔을 절레절레 흔들며 상관없다고, 그저 빨리 나가 달라고 말할 뿐이었다."
 COU_event.57.a:0 "\"이제... 끝이겠죠? 이 질긴 인연?\""
 COU_tooltip_srt_get_okay:0 "§g유키노는 불안해하던 SRT 소대원들에게 펄럭이는 카야 대행의 도장이 찍힌 서류장을 보여 주었다. 니코가 만들던 유부초밥을 내던졌다. SRT의 소대원들은 서로를 부둥켜안으며 SRT의 공식적인 부활에 기뻐했다. 이제 남은 일은, 단지 새로운 학생들을 찾는 일일 뿐이라.§!"
 COU_event.58.t:0 "즉위식"
 COU_event.58.desc:0 "곳곳이 콘크리트 등등으로 땜빵된 네덜란드 왕궁의 중앙 홀에서 네덜란드 대주교는 영 못마땅한 표정을 지으며 축사와 기도사를 외우고 있었다. 그러니까, 어, 하나님의 딸, 그리고, 적법하신 네덜란드 왕국의 여왕... 아, 못 해 먹겠네 진짜! 대주교는 협력자들이 써준 대본을 읽다가 그만 대본을 그대로 던져 버렸다. 빈 홀에서 분노에 찬 대주교의 숨소리와 대본이 철퍽이는 소리만이 울려퍼졌다. 협력자들이 그 광경을 보았다면 즉시 대주교를 총살했을 터. 하지만 대주교는 하나님께 기도드린다는 핑계로 한 시간 정도 중앙 홀을 비워둔 상태다. 아무도 없다.\n\n대주교는 애초부터 상황이 이해가 되지 않았다. 저딴 침략자 년들을 하나님의 딸이라고 칭송하고, 게다가 여왕으로서 즉위시키겠다니? 협력자들은 도대체 무슨 생각이란 말인가? 게다가, 카야라는 년은 대행 직위에 오른 지 아직 한달도 되지 않았다! 아마도 부족한 정통성을 채우기 위해 뭐든 지 하는게 틀림없다며 대주교는 중얼거렸다.\n\n\"대주교님? 준비는 잘 되어 가시는지?\"\n\n대주교는 뒤에서 구둣발 소리가 들리자 움찔 하고 놀랐다. 아마도 못 들은 듯 했다. 대주교는 안도했다. 아마도 그 말을 들켰다면 그는 즉시 머리에 구멍이 났을 것이기에.\n\n카야는 중앙 홀의 대리석 기둥에 기대어 대주교에게 말을 걸었다. 이곳의 기독교는 키보토스의 것과 다를 것이 없는지, 그렇다면 자신이 네덜란드의 여왕이고 하나님의 딸이라고 불릴 적당한 명분이 있는지 물어보았다. 대주교는 아마도 바타비아 공화국 당시 프랑스의 침공으로서 비어버린 왕좌를 잇는다고 주장하면 대충 맞기는 할 것이라고 일러 주었다. 카야는 만족스러운 표정을 지었다.\n\n"우우웅!" 대주교의 호주머니에서 알람이 울렸다. 아뿔싸, 대주교는 휴대폰을 잘 사용하지는 않지만, 현실에서는 말하지 못했던 것들을 인터넷으로는 말할 수 있었다. 모모톡과 키보토스의 인터넷 커뮤니티들은 총학생회의 통제 대상이 아니므로 오프라인으로보다는 검열에서 자유로웠다. 카야는 의아해하며 어서 문자를 읽으라고 했다. 대주교는 미친듯이 떨리는 손으로 휴대폰을 잡아 잠금을 풀었다.대주교는 눈이 좋지 않아 텍스트 자동 재생 기능을 켜놓곤 했다. 그러니까, 그가 평소 행실대로라면 카야를 비난하는 것이 대해 동조한다던가 같은 내용들이 읽힐 것이었다. 대주교는 임종을 맞이한 환자처럼 덜덜 떨며 알림창을 보았다.\n\n"대주교님, 결혼식 시사 보시기로 하시지 않았나요? 두 시간째 신랑 신부가 기다리는 중입니다."\n\n대주교는 안도했다. 대주교는 떨리는 손을 애써 감추며 죄송드리지만 중요한 결혼식을 준비해야 한다며 카야를 돌려보냈다. 카야가 문을 닫고 나서자, 대주교는 다리에 그만 힘이 풀려 주저앉고 말았다."
 COU_event.58.a:0 "\"하, 하느님 맙소사...\""
 COU_tooltip_queen_never_cry:0 "§g그 날 오후에는 성대한 대관식이 열렸다. 대주교는 애써 웃으며 카야의 머리에 왕관을 씌워 주었다. 그것 말고는, 고리타분한 옛날 중세 시대 형식의 대관식을 했다. 대주교는 대관식을 끝마치자마자 화장실로 달려가 토를 했다. 역겨웠다.§!"
 COU_event.59.t:0 "시라누이 대행, 그리고 끝...?"
 COU_event.59.desc:0 "시라누이 카야 방위실장, 아니지, 정정하겠다. 시라누이 카야 \"총학생회장 대행\" 은 묘략가처럼 웃으며 하루, 이틀, 사흘을 넘게 보냈다. 모든 것들이 완벽했다. 총학생회는 그녀의 말과 행정명령 6873호에 납작 엎드렸다. 귀찮은 이들도 카야의 권위를 인정하는 것처럼 보였다.\n\n카야는 대전이 이후 생긴 습관인 의자 돌리기를 좀 더 자주 하게 되었다. 그만큼 신나는 일이 없지 않겠는가. 모든 참칭자들을 제거하고, 그녀만이 총학생회장의 흉내라도 낼 수 있는 이이니, 대행이라는 자리는 그녀만을 위한 자리였다.\n\n협력자들이 훌륭히 내부 혼란을 진압들 하시는 동안, 카야는 그저 가끔씩 들어오는 서류들에 도장을 찍고, D.U.의 풍경을 감상하며 곁에 놓인 커피를 홀짝이며 체스를 두는 것이 전부였다.\n\n그녀는 행복했다.\n\n그런데 말이야,\n\n총학생회장이라는 자리가,\n\n이렇게 가벼운 것이던가?"
 COU_event.59.a:0 "... 그럴 리가 없다."
 COU_tooltip_maybe_its_bad:0 "§g시라누이 카야는 무언가 중대한 것을 잊고 있습니다.§!"
 COU_event.60.t:0 "정기 보고"
 COU_event.60.desc:0 "\"... 대행 각하, 이렇게 이번 정기 보고를 마무리하겠습니다. 혹여나 질문이라도 있으신지?\"\n\n팔뚝에 검은 총학생회의 문양이 새겨진 협력자 한 명이 카야에게 정기 보고를 마쳤다. 하지만 어째서인지 협력자의 표정이 좋지 않아 보였다. 속이라도 안 좋은 걸까? 카야는 생각했다.\n\n\"네, 수고하셨습니다. 그런데, 그, 음... 혹시나 해서 말해두는 건데요.\"\n\"당신네들, 일부러 가짜 문건만 가져다 올립니까?\"\n\n멍한 눈으로 서 있던 협력자의 눈에 재빠르게 생기가 돌아왔다. 협력자는 무척이나 당황한 듯 보였다. 협력자는 갑작스럽게, 어째서인지 아주 많이 당황한 듯 보였다. 모든 문건들이 사실이라면, 그럴 일은 없을 텐데.\n\n\"아뇨, 총학생회 통제 구역들에서 일어나는 사건들은 대행님께 보고드립니다. 혹시 무슨 문제라도...?\"\n\n협력자는 침을 꿀꺽 삼켰다. 그러나 그의 긴장과는 정반대로 카야의 표정은 압박한다던가, 그러한 표정이 아니었다. 그저 여느 때처럼 서류를 처리하는 무표정, 그 자체였다. 카야는 펜을 만지작거리며 말했다.\n\n\"린 대행이 일을 얼마나 많이 했는지는 저도 아는데요. 일이 좀 많이 적어서 말입니다. 취임 직후부터, 일이 터무니없이 적어요.\"\n\n협력자는 책상 아래로 손가락을 빠르게 움직였다. 아마도 헤이턴에게 도움을 구하는 내용인듯했다. 카야는 골똘히 생각하더니 무언가 깨달은 듯 자리에서 일어났다.\n\n\"아! 역시 제가 통치하는 총학생회는, 그만큼 평화롭다는 뜻이네요. 후후... 좋아요. 물어볼 만한 건 없습니다. 이만 돌아가주세요.\"\n\n협력자는 안도한 듯 밝은 미소를 지으며 문을 닫고 나갔다. 카야는 다시 자리에 앉아 의자를 빙글빙글 돌려 보았다."
 COU_event.60.a:0 "\"아주 완벽해!\""
 COU_tooltip_maybe_its_really_bad:0 "§g중대한 \"그걸\" 잊고 있습니다. 그런데, \"그게\" 대체 뭐죠?\n좀 더 생각해봐야 기억이 날 듯 싶습니다.§!"
 COU_event.61.t:0 "권력 강화?"
 COU_event.61.desc:0 "\"아, 아, 네? 천천히 말씀해보세요, 방위차장?\"\n\n카야는 몹시 놀란 듯 초조하게 수화기를 붙잡고 있었다. 평소 마시던 블루 마운틴도 책상 저 멀리로 치워 버린 채 전화에 모든 신경을 곤두세우고 있었다. 카야는 손톱을 물어뜯을 뻔도 했다. 그만큼 초조했다.\n\n\"네, 총학생회장님! 현지인들이 나나가미 린 대행이 아닌 총학생회의 통제에는 순응할 수 없다고 시위에 돌입했습니다! 사실 총학생회장님 취임 직후부터 시위가 시작되긴 했는데요, 제가 보고를 수십 번을 했는데도 대행님께서는 모르시는 것 같아서 이렇게나마 전화로 말씀드리고 있습니다! 일이 많으신 건 알고 있지만, 일이 심각합니다! SRT를 파견해주시면 좋겠습니다!\n\n\"방위차장, 그게 대체 무슨 소리인가요? 취임 직후부터 제가 받은 보고들은 고작 튤립 몇 송이를 수확해서 팔았다, 이딴 내용들 밖에 없었다고요! 똑바로 보고한 게 맞나요?\"\n\n\"네...? 네...! 네, 물론이죠! 제가 차장 직을 한 두번 해보는 것도 아니고 말입니다! 어쨌든 지금 지원이 당장 필요합니다! 부디 신속한 지원을 부탁드립니다!\"\n\n방위차장은 찰칵 하고는 전화를 끊었다. 평소같으면 먼저 끊은 게 무례하다니, 일부러 일을 개떡같이 해서 짤라 버려야 한다느니 중얼거릴 카야는 진정하지 못하고 있었다. 저렇게 심각한 일이, 어떻게 한 번도 자신한테 보고가 오지 않은 것인가?\n\n카야는 모모톡에서 헤이턴에게 말을 걸었다. 헤이턴은 구시대적인 사람이라 모모톡을 잘 읽진 않았지만, 신기하게도 이번엔 카야가 메세지를 보내자마자 바로 읽어 답장을 해 주었다.\n\n-coenraad_haigthon96: 저희는 제대로 보고처리 했기에 그럴 일은 없습니다만, 총학생회 내 임원들에 대한 충성력이 부족한 게 아니신지?\"\n\n-coenraad_haigthon96: \"대행님의 권력이 불완전한 것을 알고는 있었으나, 함부로 보고드리기가 애매한지라, 그동안 말씀드리지 못했습니다. 죄송합니다.\""
 COU_event.61.a:0 "메세지를 카야는 몇번이고 읽고 또 읽었다."
 COU_tooltip_kaya_started_the_movement:0 "§g카야 말고는 총학생회장을 그 누구도 대체할 수 없다. 그러한 이의 권력을 총학생회의 임원들이 인정하지 않고 있다는 사실은 카야에게는 꽤나 충격적인 것으로 들렸다. 카야는 손가락을 덜덜 떨며 답신을 보냈다.\n\n-superhuman_official: \"알겠습니다. 답변 고맙습니다.\"§!\n\n§Y카야의 권력 강화가 시작됩니다.§! 일주일 단위로 중점 한 개가 완료될 것입니다."
 COU_event.62.t:0 "아로나와의 만남"
 COU_event.62.desc:0 "\"흠흠흠~ 역시 혼자 있는건 좀 지루하려나요~\"\n\n싯딤의 상자의 인공지능 아로나는 대행 취임 직후 복면을 쓴 남자들에게 의해서 샬레 지하 크래프트 챔버로 옮겨졌었다. 처음엔 귀찮게 안 구는 사람들이 없어져서 좋았지만, 계속 있으니 따분해 죽을 듯 했다. 크래프트 챔버가 웅웅거리며 작동했다면 그것도 꽤나 볼 만 했겠지만, 크래프트 챔버는 재미없게도 침묵을 유지하고만 있었다.\n\n갑작스럽게도 크래프트 챔버의 문고리가 돌리며 문이 열렸다. 분홍빛 머리의 바보털이 이러저리 살랑거리며 흔들렸다. 아로나는 책상에서 볼을 괴고 있었다. 카야는 문을 닫고 아로나에게 다가갔다.\n\n\"헤에. 신임 총학생회장께서, 여기는 무슨 일로.\"\n\n\"아로나, 제가 무엇을 하려고 여기 왔는지는 잘 알고 계실 텐데요.\"\n\n\"저는 여러번 말하지 않았나요? 저는 당신이 대행 직에 걸맞지 않은 인물이라고, 몇번이고 말했는데요.\" 아로나가 책상에서 일어서서 카야를 쏘아보며 말했다. 카야는 당황한 얼굴로 애써 침착한 척 아로나에게 말을 걸었다. 생텀 타워는 작동하고는 있지만 관리자 권한이 자신에게 없다, 총학생회장이 생텀 타워 관리자 권한조차 없다는 것이 말이 되는가, 그러니 부디 관리자 권한을 내게 부여해달라, 고. 아로나는 뾰루퉁한 표정으로 말을 들은 척도 하지 않았다.\n\n카야는 결국 마지막 수를 두기 시작했다.\n\n\"네, 네... 아로나 님? 아니, 아로나 선배님, 이 아우가 이렇게 무릎 꿇어 빌겠습니다! 부디 관리자 권한을 부여해주세요! 아로나 선배님을 위해서라면 무엇이든지 할게요!\"\n\n아로나가 싫증이 난 듯한 표정으로 말을 듣고 있었지만 결국엔 웃고 말았다. 아로나 \"선배\" 는 잠깐 교실 밖으로 나가더니 카야에게 생텀 타워의 관리자 권한을 부여해 주었다."
 COU_event.62.a:0 "\"저기, 한번만 더 선배님이라고 해주세요!\""
 COU_tooltip_kaya_gets_sangtum_tower:0 "\"§g하, 하아? 관리자 권한을 받았으니, 더는 말하지 않을 거에요!\" 카야는 급히 문을 닫고 크래프트 챔버를 빠져나갔다. 아로나는 또다시 혼자가 되었다. 누구에게 아로나가 \"선배\" 라는 말을 좋아한다고 들었는지는 몰라도, 아로나 \"선배\" 라는 말에 결국 아로나는 웃어 보였다.§!"
 COU_event.63.t:0 "크로노스 스쿨 장악"
 COU_event.63.desc:0 "카와루 시논과 보도부는 최근 일거리가 늘었다. 신임 카야 총학생회장과 협력자 간의 스캔들을 다루려면 26시간을 일해도 모자랄 지경이었다. 그러나 정의와 진실을 파헤친다는 사명 아래 보도부는 밤낮을 가리지 않고 총학생회 곳곳을 뛰어다니며 진실을 파헤치기 위해 애썼다. 그리고 그 날도 여느 때처럼 카야의 스캔들 기사를 정리하고 있던 때였다.\n\n시논은 보도부 편집국장에게 카야 총학생회장이 손톱을 물어뜯었다는 기사를 넣어 달라고 말하고 있었다. 손톱을 물어뜯는다는 것은 불안을 표시하는 아주 기초적인 행동으로, 카야 내각의 불완전함을 다룰 수 있다고 믿고 있었다. 그러나 보도국의 유리 건물에서 갑자기 그림자가 드리워지기 시작했다. 시논은 취재를 떠나는 비행선이라고 생각했지만, 검은 그림자는 점차 짙어졌다.\n\n시논은 순간적으로 뒤를 뒤돌아 보았다. 보도국의 편집국장은 겁에 질린 상태였다. SRT 특수학원의 로고를 단 헬리콥터가 크로노스 스쿨을 바라보았다. 시논이 피하라고 외치기도 전에, 헬리콥터에서는 미사일이 날라와 창을 궤뚫었다.\n\n\"RABBIT 1, 6층에 진입 완료했습니다.\" 지지직거리는 교신 수신음이 곳곳에 울려퍼졌고, 보도국의 학생들이 제작기 권총을 꺼내 침입자들에게 저항하기 위해 애썼지만 이들은 SRT였다. 시논과 보도국장은 이내 곧바로 체포되었으며, 1층에서는 FOX 소대가 진입을 완료했다는 교신이 울려퍼졌다.\n\n\"지금 이게 무슨 짓인가요! 여기는 신성한 크로노스 보도국입니다! 언론의 자유를 억압한다는 것에 대해 아무런 죄책감도 느끼시지 못하시나요!\"\n\n시논이 겨우내 입을 열어 항변했지만 RABBIT 1은 차가운 눈사리로 그녀를 바라보았다.\n\n\"저희들은 그저 무기들일 뿐입니다. 판단하지는 않습니다.\""
 COU_event.63.a:0 "\"... 그런가요...\""
 COU_tooltip_kaya_kronos_dead:0 "§g다음 날 크로노스 보도국은 총학생회장의 \"완벽한 통치\" 아래에서 범죄률이 23% 줄어들었다며 발표했다. 크로노스 인터넷 뉴스 댓글란은 급작스러운 크로노스 보도국의 입장 전환에 혼란을 빚었다.§!"
 COU_event.64.t:0 "발키리 통제"
 COU_event.64.desc:0 "카야는 지난 주에 비하면 조금은 안정된 듯한 모습이였다. 헤이턴이 추천한 권력 장악을 위한 5개의 과정들 중 4개를 성공적으로 마무리했고, 이제는 눈엣가시 발키리 경찰학원을 방위실에 통합만 하면 되었다. 그렇게 된다면, 자신은 기꺼이 권력의 정당성을 승인받고 (사실 만장일치로 총학생회장직에 올랐지만) 정상적인 업무 수행이 가능해질 것처럼 보였다. 카야는 긴장된 표정으로 발키리 자치구로 이어지는 핫라인의 수화기를 들었다.\n\n기대와는 달리 [KSP.GetLeader] 경찰국장이 자리에 없으니 부디 음성 사서함을 이용해달라는 짤막한 기계음만이 울려퍼졌다. 카야는 잠깐 화가 돋았지만 이내 진정할 수 있었다. 달콤한 말로서 저 놈들을 회유하는 것이 중요하다. 그러하기에 절대로 폭력적이거나 강업적인 말을 써서는 안 되었다.\n\n\"네, [KSP.GetLeader] 경찰국장, 총학생회장 시라누이 카야입니다. 발키리 학원의 노고는 보고들로 계속 전해 들어 알고 있습니다. 하지만 행정위원회는 발키리 예산의 인상을 잘 받아들이지 않아 고민이신 모양이더라고요. 정의를 수호하는 발키리 학생들이라면 절대로 돈에 휘둘려서는 안된다고 생각합니다.\"\n\n\"그래서, 음성 사서함으로나마 말을 전하는 무례를 용서해 주시길 바라는 마음으로서 제안드립니다. 방위실 하부 부서로의 재배치는 어떠신지요? 아, 오해하실 소지가 있다는 건 알고 있지만, 절대로, 음, 그러니까...\" 카야는 순간 \"그냥\" 이라고 답할 뻔 했다. 하여간, 고작 부서 재배치하는데에 이렇게 긴 변명을 해야 하는 것도 카야는 딱히 마음에 들지 않았다.\n\n\"절대로, 발키리의 자주권을 해칠 생각이 없습니다. 발키리 경찰학원의 상급 부서가 행정위원회가 아닌 방위실로 바뀐다고만 생각하시면 됩니다. 그렇게 되면, 저는 총학생회장으로서 언제던지 방위실에게 연락하여 발키리로의 추가 예산 할당을 명령할 수 있고요.\"\n\n\"그렇다면, 부디 현명하신 선택 기다리겠습니다.\" 카야는 한숨을 쉬며 전화를 끊었다. 부디 그녀의 염원이 잘 전해지길 바랄 뿐이었다."
 COU_event.64.a:0 "\"이것만 마무리된다면...\""
 COU_tooltip_kaya_valkirie_declarewar:0 "§g음성 사서함에 담긴 메세지는 꽤나 오랫동안 전해지지는 못했다. 며칠 뒤, [KSP.GetLeader] 경찰국장이 자리에서 돌아왔을 때, 기다렸다는 듯 음성 사서함이 말을 전했다.§!"
 COU_event.65.t:0 "총학생회로부터의 제안"
 COU_event.65.desc:0 "[KSP.GetLeader]는 고민에 빠져 있었다. 어제 들은 총학생회로부터의 제안 때문이었다.\n\n\"네, [KSP.GetLeader] 경찰국장, 총학생회장 시라누이 카야입니다. 발키리 학원의 노고는 보고들로 계속 전해 들어 알고 있습니다. 하지만 행정위원회는 발키리 예산의 인상을 잘 받아들이지 않아 고민이신 모양이더라고요. 정의를 수호하는 발키리 학생들이라면 절대로 돈에 휘둘려서는 안된다고 생각합니다.\"\n\n\"그래서, 음성 사서함으로나마 말을 전하는 무례를 용서해 주시길 바라는 마음으로서 제안드립니다. 방위실 하부 부서로의 재배치는 어떠신지요? 아, 오해하실 소지가 있다는 건 알고 있지만, 절대로, 음, 그러니까...\"\n\n\"절대로, 발키리의 자주권을 해칠 생각이 없습니다. 발키리 경찰학원의 상급 부서가 행정위원회가 아닌 방위실로 바뀐다고만 생각하시면 됩니다. 그렇게 되면, 저는 총학생회장으로서 언제던지 방위실에게 연락하여 발키리로의 추가 예산 할당을 명령할 수 있고요.\"\n\n\"그렇다면, 부디 현명하신 선택 기다리겠습니다.\"\n\n가 음성 사서함에 담긴 내용이었다. 발키리가 고질적인 예산 부족에 쪼들리는 것은 사실이었고, 자체적인 반란군 진압도 한계에 달하고 있었다. 오랜 고민 끝에, 결국 그녀는 결정했다."
 COU_event.65.a:0 "그녀는 전화해 이렇게 말했다- \"좆까!\""
 COU_event.65.b:0 "그녀는 전화해 이렇게 말했다- \"늦게 연락드려 죄송합니다...\""
 COU_event.66.t:0 "강제집행"
 COU_event.66.desc:0 "\"좆까!\"\n\n... 이것이 시라누이 카야가 들은 [KSP.GetLeader] 전화로부터의 말의 전부였다.\n\n카야는 한숨을 쉬었다. 아무리 좋게 말해도 알아듣질 못한다면, 결국엔 폭력을 행사하더라도 진압해야 하겠지. 그녀는 그렇게 생각하고서는 행정원을 불렀다. 행정원은 아마도 졸고 있던 모양인지 잔뜩 뜬 머리를 한 채로 카야의 집무실에 고개를 비췄다. 카야는 지금 기분이 좋지 않았다. 저 뜬 머리도 자신의 권위를 무시하는 행동의 일환처럼 보였다. 마음에 들지 않았다.\n\n어쨌거나 카야는 즉석으로 서류를 뽑아 행정원에게 한 가지 행정명령을 작성해 주었다.\n\n행정명령 6592호, 발키리 불복종 명령 집행.\n\n행정원은 서류를 받아들더니 알겠다고 하더니 종종걸음으로 방위실로 향했다. 카야는 곁에 놓인 커피 한 잔을 마셨다."
 COU_event.66.a:0 "\"하아...\""
 COU_event.67.t:0 "집행"
 COU_event.67.desc:0 "\"... 늦게 연락드려서 다시 한번 죄송하다는 말씀 드리고, 제안은 기쁘게 받아들이겠습니다.\n\n카야는 흥이 났다. 발키리만큼은 제정신이 똑바로 박힌 사람들이라며 마구 칭찬하기도 했다. 발키리는 모든 학생들과 하위 부서들을 방위실 하위로 통합시키는 것에 대해 동의했다.\n\n카야는 곁에 놓인 커피잔을 들고 이리저리 돌아다녔다. 눈치없게 문을 벌컥 들고 들어오는 행정원도 웃으며 괜찮다고 배웅했으며, 창밖으로 들어오는 햇살에 몸을 맡긴 채로 유영하기도 했다.\n\n카야는 그 날 즉시 크로노스 보도국을 불러 이것만큼은 크게 보도하기로 했다. 이러한 기회는 결코 쉽게 찾아오지 않을 테니까!"
 COU_event.67.a:0 "\"아하하!\""
 COU_event.68.t:0 "행정명령 6873호"
 COU_event.68.desc:0 "카야는 번쩍이는 자신의 새 책상과 명함을 바라보았다. 얼마나 닦아댔는지 광이 나지 않는 곳이 없었다. 아주 만족스러웠다. 드디어 총학생회장의 같잖은 신임 조금 받았다고, 감히 초인의 자리를 뺴앗고 참칭하던 거만한 나나가미 린을 내쫒았다. 탄핵안 의결 때는 드러내지 못했지만 카야는 몸을 풀며 그 기쁨을 풀어낼 수 있었다.\n\n협력자들은 훌륭히 반린 시위를 열었으며 헤이턴과 네덜란드인들은 친린 임원 몇명을 습격해 불구로 만들어 의결에 불참시켰으며, SNS는 네덜란드인들을 동원하여 반린 정서를 충분히 조성해 놓은 상태였다. 네덜란드인들에게 휴대폰을 공급하고 사용법을 가르치는 것이 아마도 가장 어려운 난관이 아니었을까, 하고 카야는 속으로 웃어 보았다.\n\n곧이어 보도국의 학생 몇명이 그녀의 집무실을 방문했다. 린 전 대행이 연루된 사건 몇개를 말하고, 이에 관한 논란에 대한 평가를 부탁하고 있었다. 카야는 짤막하게 \"아쉬운거죠\" 라고 일축한 뒤 그녀들을 돌려보냈다.\n\n카야의 휴대폰이 울렸다. 그녀는 헤이턴의 모모톡임을 확인했다. 헤에, 문자도 잘 안 읽는 양반이? 그녀는 내심 놀라며 헤이턴의 문자 내용을 읽었다.\n\n문자의 내용은 간단했다. 자신들의 공을 잊지 않아 준 것에 대해 큰 감사를 표하며, 디츨란드법은 정말 감사하게 생각하고 있다는, 흔한 아부에 가까운 메세지였다. 그녀는 기분이 좋아졌다. 어쩌면 무책임하게 도망친 총학생회장보다 자신이 오히려 더 나을 지도 모른다는 거만한 생각에 빠지기도 했다. 하지만 헤이턴의 메세지는 마지막 줄이 본론이었다.\n\n\"네덜란드인들과 협력자들의 지위를 보전하기 위하여 이들의 권력을 강화시킬 것을 요청함.\"\n\n그녀는 대수롭지 않게 근처에 놓인 새 서류를 가져와 놓은 뒤 펜촉을 눌러 꺼냈다. 그녀는 능숙한 필기로 새 서류의 제목을 썼다.\n\n\"행정명령 6873호\". 단순한 협력자들의 권한 증가에 관한 내용이었다. 카야는 아무런 생각 없이 헤이턴이 적어준 요구 사항들을 그대로 서류에 받아 적었다."
 COU_event.68.a:0 "그것이 무슨 일을 불러올 지는 모른 채."
 COU_tooltip_kaya_cant_do_nothing:0 "§g헤이턴은 크로노스 보도국에서 송출된 행정명령 6873호의 집행 사실을 보고 만족스러운 표정을 지었다. 그렇게 쉽게 통할 거라고는 그조차도 예상치 못했지만, 새로운 대행이라는 작자는, 정말 아무런 생각도 없는 듯 했다. 이제 파시스트들은 대행에게 올라가는 보고서들을 가장 먼저 받아볼 수 있다. 행정위원회의 동의 없이도 자발적인 치안 통제도 가능해졌다. 헤이턴이 시가를 피우며 웃었다.§!"
 COU_event.69.t:0 "끝...?"
 COU_event.69.desc:0 "모든 5가지의 절차들이 끝났다. 최강의 무력도, 현지인들의 민심도, 아로나도, 언론도, 경찰력도 모두 그녀의 것이 되었다. 한동안 크로노스 스쿨의 정치 시사 채널은 얼마나 카야가 유능하고 위대한지에 대해 역설하며 논쟁을 벌였고, 협력자들은 카야를 떠받들었다. 모든 것이 잘 풀렸다. 그것만큼은 확실하다. 하지만 카야에게는 매일이 시한폭탄과도 같았다. 무언가 심각히도 잘못되었다.\n\n한동안 잊고 지냈다는 것이 무엇이었는지 카야는 꾸준히 생각해보려고 애썼다. 그리고 오늘, 카야는 마침내 오랜 난제에 대한 간단하고도 단순한 해답을 얻어낼 수 있었다.\n\n"협력자들은, 시라누이 카야의 파벌이 아니다."\n\n얼핏 보면 당연한 이치이지만, 너무나 늦게 깨닫고야 만 카야였다. 협력자들은 그녀의 편이 아니다. 그저, 단순히, 권력 놀음을 하기 위한 발판으로서 그녀를 이용해먹었다. 카야도 그정도는 생각해낼 수 있었다. 처리해야 할 서류는 거의 올라오지 않는다. 무료함에 지쳐 휴대폰을 잡고 인터넷을 서핑해도 무리가 없을 정도였다. 도대체 어디서부터 잘못된 걸까.\n\n처리되지 않은 서류를 가져오지 않으면 총살시키겠다는 같잖은 협박은 이미 애진작에 안 먹혔다. 하루, 이틀 정도 미친듯이 서류들이 올라와 카야가 뻗고 나면, 일이 한 개도 올라오지 않는 일상으로의 반복이었다.\n\n도대체 어디서부터 잘못된 걸까. 카야는 생각했다.\n\n하지만 협력자들을 막을 방법은 없다. 한 번 발령된 행정명령은 행정위원회 전원의 만장일치가 있어야 철회가 가능하다. 그러나 행정위원회에는 이미 수많은 협력자들이 임원으로서, 행정원으로서 들끓는다. 행정명령 6873호는 이제는 더는 단순한 개목줄이 아니다.\n\n천천히, 야금야금, 올라오는 것도 깨닫지 못하게 한 채로 카야의 목을 비틀어죄는 끔찍한 쇠사슬이었다.\n\n그러나 카야는 그것을 너무나 늦게 깨달았다. 이미 늦었다."
 COU_event.69.a:0 "..."
 COU_tooltip_wait_we_fucked:0 "§R정말 잘하는 짓입니다, 시라누이 카야! 니 같잖은 대가리 믿고 현지인들 농락해서 린 대행 쫓아내니까, 그 결과가 고작 이겁니까? 총알 한방이면 뒤져버리는 같잖은 현지인들에게 살살 기면서 얼굴마담 역할이나 하는게, 그렇게 니가 원하던 초인의 귀환입니까? 총학생회 철권 통치의 귀환입니까?\n\n참 존나게도 잘하는 짓입니다, 이 니미 씨부랄 멍청한 년아!§!\n\n"
 
 

 ###총학생회 인물
 COU_XXX:0 "총학생회장"
 COU_XXX_desc:0 "그 어떠한 자들보다도 위에 서 있는 총학생회장은 키보토스에서 모든 것을 관리했습니다. 학원 간 분쟁, 그리고 사소한 다툼까지도, 모든 것을 관리하고 통제했으며 조정함과 동시에 중재했습니다. 그러나 그러한 총학생회장조차도 키보토스 전체가, 한 번도 들어본 적 없으며 실존하는지조차도 몰랐던 곳에 전이하게 되었을 때, 그녀는 모든 것을 짊어지게 되었습니다. 비록 원한 적은 없으나 모든 이들의 우두머리인 총학생회장은 그러해야만 했기에 그녀는 기꺼이 모든 것을 짊어지기로 결정했습니다. 그리고 그러한 고난 속에서 총학생회장은 더는 버틸 수 없게 될 때 까지, 그녀는 그녀가 가능한 한 키보토스를 위해 끝까지 일하고자 할 것입니다."
 COU_null:0 "키보토스 비상대책위원회"
 COU_null_desc:0 "총학생회장이 갑작스럽게 실종된 이후, 총학생회는 굉장한 혼란 속에 갇혀있습니다. 키보토스 총학생회는 현재 그 어떠한 활동도 할 수 없으며 이는 키보토스의 이상 상황에 전혀 대처할 수 없다는 것입니다."
 COU_RIN:0 "나나가미 린"
 COU_RIN_desc:0 "총학생회장의 신임으로부터 증명된 린의 유능함은 굳이 설명하지 않아도 이해할 수 있을 것입니다. 매일같이 말도 안되는 양의 업무를 완벽히 수행하고, 거의 쉬지도 않은 채 업무에 응하는 것은 총학생회장과 초인을 연상케 합니다. 어쩌면 이런 부분에서 린은 걸맞은 자리를 차지했다고 말할 수 있을 것입니다.\n\n하지만 여기서, 왜 그녀는 총학생회장처럼 미친 업무량을 소화해야만 하는 것일까요? 사실 해답은 단순합니다- 린은, 총학생회장이 아니기 때문입니다.\n\n대전이 이후부터 수도 없이 말도 안되는 일들이 일어났지만 린은 그것에 대해 현명하게 대처하는 법을 몰랐습니다. 거의 모든 뒷수습은 총학생회장이 했었고, 기틀이 부실한, 단순한 총학생회장의 신임으로서 이루어진 린의 권력 체계는 언제던지 무너질 수도 있습니다. 임원들은 린에 대한 소문을 쑥덕거리고, 헛소문은 사실인것처럼 여겨집니다. 그러나 린은 이것에 대처할 수 없습니다.\n\n린이 무능하기 때문이냐고요? 아니요! 절대로 그렇지 않습니다. 그녀의 미약한 권력 기반과 통치 신념은 어쩌면 모두에게는 좋은 일이지만 린 그녀 자신에게는 그다지 좋은 방법이 아닙니다.\n\n총학생회장이 사라진 지금으로서는, 권력을 강화할 방법은 그다지 많지 않습니다. 린은 이제 단순히 '총학생회장의 보증'이 언제가지 가는지에 대하여 모든 것을 걸어야 할 처지에 놓였습니다. 그녀가 행정위원회에 첫발을 내딛을 때부터 꾸었던 자신만의 신념과 소망을 위해서라면, 마땅히 그러해야만 합니다.\n\n린은 유능한 이이고, 그 믿음은 그 무슨 일이 있더라도, 결코 깨져서는 안됩니다."
 COU_RIN_SET1:0 "수석 행정관"
 COU_AOI:0 "오키 아오이"
 COU_AOI_desc:0 "비상대책위원회 회의를 통해 앞으로 총학생회는 오키 아오이가 이끌게 되었습니다."
 COU_AOI_SET1:0 "재무실장"
 COU_KAYA:0 "시라누이 카야"
 COU_KAYA_desc:0 "오, 시라누이 카야, 큰 야망을 품은 야심가이자 방위실장이여! 시라누이 카야는 행정위원회에서 그 누구도 생각치 못할 거대한 계획과 야망을 품고 있습니다. 카야는 대전이 이전부터 너무나도 유화적인 총학생회장과 수석 행정관의 실태에 대해 비판적이었으며, 카야는 권력의 한구석에서 방위실장이라는 자리와 명성으로 만족할 수는 없었습니다. 하지만 대전이라는 대사건은 총학생회를 그녀의 차지로 만들 수 있게 해 주었습니다. 현지인들을 회유하는 멋진 카리스마와, 권력을 위해서라면 그 어떠한 추태도 보일 수 있는 야심까지, 모든 것을 갖춘 카야는 이제 기존 대행을 대신하여 총학생회장의 대행이 되었습니다. 총학생회의 모든 것을 좌지우지 할 수 있는 왕관이, 그녀의 손에 들어오게 되었습니다.\n\n카야는 이제 매일 아침 따뜻한 커피와 보고서로들로 하루를 시작하며 유능한 자신의 일처리와 완벽하게 돌아가는 총학생회를 그리며 꿈에 부풀어 있습니다. 그리고 그러한 환경이 가능하도록 기회가 주어진 지금, 카야는 마땅히 자신의 야망을 실현해야 함은 변함이 없습니다.\n\n새로운 대행에게 건배를, 총학생회에게 건배를!"
 KAYA_FUCKED_DESC:0 "실패했습니다. 통제가 되지 않습니다. 맨 처음부터 실을 잘못 꾀었습니다. 그렇기에 짜여진 스웨터는 카야의 목을 조릅니다. 아주 세게.\n\n시라누이 카야는 오만하기 짝이 없었습니다. 협력자들이 잠깐 자기 편 들어 준다고, 행정위원회가 자기 말 조금 들어 준다고, 모든 게 자기 것인 마냥 굴었습니다. 분명한 실책이자 실패입니다. SNS는 카야의 오만함과 멍청함을 비난하는 글로 가득 찼습니다. 카야를 강아지에 합성한 사진들은 웃긴 사진으로서 인터넷 커뮤니티의 메인을 차지합니다.\n\nSRT는 그녀의 말에 순종합니다. 네덜란드인들은 그녀를 여왕으로서 모십니다. 아로나는 그녀를 총학생회장으로 인정했습니다. 크로노스 스쿨은 그녀에 대한 긍정적인 기사만 적어 올립니다. 발키리는 매일 아침 카야의 초상화에 충성 맹세를 합니다.\n\n하지만 그녀의 권력은 권력이 아닙니다. 행정명령 6873호라는 완벽한 대실책은 그녀를 허울 뿐인 독재자로서 기능하게 만들었습니다. 그녀가 할 것은 이제 아무것도 없습니다. 그저 집무실 의자에 앉아 무료히 시간이나 때우면서,\n\n"그 날" 이 오는 것을 몸소 느껴야 할 것입니다."
 COU_KAYA_desc_first:0 "카야는 명백하고 적법한 총학생회장이며 승리자입니다! 분명 그렇습니다! 그 누가 카야를 그 잘난 \"승리자\"라고 부를 수 없겠습니까? 모든 떨거지들을 떨쳐 내고 왕관을 차지했는데! 시라누이 카야는 처음부터 오직 그 생각이었습니다. 유약하고 나약해빠진 총학생회장을 끌어내고 자신이 그 왕좌에 앉는 것, 그것뿐입니다! 그리고 이제는 그 목표를 완전히 이루었으니, 어찌 \"승리자\"가 아닐 수 있습니까!\n\n...같은 말들은 카야를 심적으로 진정시켜 주는 역할을 합니다. 카야는 매일 아침 일어나면 보좌관에게 따뜻한 홍차 한 잔을 받아 마시며 자신은 초인이라고 되뇌입니다. 그렇지 않으면, 더는 버틸 수 없을 것이기 때문입니다. 시라누이 카야는 완벽히 오판했습니다. 같잖은 방위실장에서 처리하는 \"같잖은\" 일들은 총학생회장과는 완전히 달랐습니다. 권력에 눈이 멀어 총학생회장 자리를 찬탈했으나 감당하지 못할 직위는 저주이자 사슬입니다. 최소한 지금 당장은 그렇습니다. 왕관을 뺏어 썼으나 그 누구도 왕관의 권위를 인정하지 않습니다. 카야는 왕관의 무게를 느끼지 못합니다. 대체 어디서부터 잘못된 것일까요? 무엇이 틀렸던 것일까요? 사실은 처음부터 모두 그렇게 될 운명이었던 걸까요? 카야는 감당할 수 없는 수를 두었고, 후폭풍은 이제 오직 자신의 몫임을 실감하고 있습니다.\n\n빌어먹을, 초인이란 대체 무엇일까요? 대체 어떤 사람일까요? 그러나 그것이 무엇이던, 카야는 영원히 그렇게 되지 못할 것입니다- 아마도요."
 COU_KAYA_desc_upgraded:0 "시라누이 카야, 그녀가 누구입니까? 단순히 권력에 굶주린 사자일까요? 대부분의 이들이 카야를 권력에 굶주린 사자라고 묘사합니다. 물론 그것을 완전히 틀렸다고 말 할 수 없지만- 지금의 카야는 최소한 그렇지 않게 되었습니다. 분명히요.\n\n카야는 비록 총학생회장의 자리를 빼앗고자 오랜 야심을 품었지만 그러한 야심은 대전이까지는 이어지지 못했습니다. 암스테르담에 전이된 그녀는 처음에는 좋아했습니다. 분명히 나약해빠진 총학생회장은 사태를 완전히 통제하지 못할 것이고, 그렇다면 자신이 언제던지 총학생회장이 될 수 있을 것이라, 소박한 꿈을 꿈꿨습니다. 그러나 그러한 그녀의 자그마한 소원은 사회주의자들에게 짓밟혔습니다. 사회주의자들이 여왕의 도망을 축하하며 '파티'를 벌이던 그 날, 카야는 깨달았습니다. 시라토리구가 사회주의자들에게 습격당한 이후 카야는 깨달았습니다. 멍청이처럼 왕관을 뺏어 쓴다고 왕관의 무게까지 짊어질 수는 없음을요.\n\n카야는 깨달았습니다. 규칙에 얽매여서는 지킬 수 없는 정의가 있다는 것을. 어차피 멍청한 것들은 말을 해 보았자 알아먹지 않습니다. 힘들게만 살 필요는 없습니다. 적당히 일만 하고, 적당히 돈 받고 살면 그 머저리들은, 알아서 카야의 왕관을 받들 것입니다. 단지, 그렇게만 하면 되고, 그것뿐입니다."
 COU_KAYA_SET1:0 "방위실장"
 COU_AYUMU:0 "이와비츠 아유무"
 COU_AYUMU_SET1:0 "조정실장"
 COU_MOMOKA:0 "유라기 모모카"
 COU_MOMOKA_DESC:0 "교통실이 언제부터 총학생회에서 이렇게 중요한 부처가 되었을까요? 그저 매일같이 터져나가는 열차들을 정비하고, 신고를 접수하고, 고작 그것이 다였던 자그마한 부서였는데 말입니다.\n\n유라기 모모카는 현지인들에게 한줄기 희망으로 떠올랐습니다. 새로이 설립된 개혁위원회와 붉은 여명은, 그녀가 단순한 통치자는 아니라는 것을 암시합니다. 명란맛 과자를 풍족히 공급하고, 권력자로서의 대우를 하고, 명령에 따르는 척 하면서 모모카는 새로운 질서의 핵심이 되었습니다. 그러니까, 모모카는, 귀찮은 일들을 강제로 떠맡게 된 것과 다름이 없습니다.\n\n모모카는 정치놀음에 그다지 큰 관심은 없습니다. 단순히 밀려오는 더 많은 서류들을 처리하는 데엔 싫증이 난 지 오래였지만 말입니다. 가끔씩 그녀는 홀로 린이 그립다며 한숨을 쉬고는 합니다. 곁에선 붉은 완장을 찬 현지인들이 그녀를 탐탁치 않게 바라볼 뿐입니다.\n\n하지만 그 자리가 어떠하던 간에 그녀는 새로운 질서이자 인류와 키보토스 조화의 상징입니다. 모모카, 그리고 명란맛 과자는 충실히 그 의무를 수행할 것입니다.\n\n복잡한 정치놀음은 정치인들에게 떠넘긴, 한낱 꼭두각시와 다름이 없는 신세더라도, 모모카는 그 의무를 수행할 것입니다.\n\n마땅히 지어야만 할 짐을 지고서." 
