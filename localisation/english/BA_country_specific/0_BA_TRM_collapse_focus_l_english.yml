 #트리니티 붕괴 위험
 TRN_country_collapse_decisions: "The Fading Dawn"
 TRN_country_collapse_fali: "§tTrinity is collapsing§!"
 TRN_country_collapse_success: "We have prevented the §YCollapse of Trinity§!. However, there is still §Ymuch work to be done.§!"
 TRM_bunggoehajima: "§YTake Minimal Measures§!"
 TRM_calm_storm: "Calm Before the Storm"
 TRN_country_collapse_decisions_plz_time: "Buying Time"

 TRM_anti_trinity_game_desc: "On the day the world was turned upside down, Trinity's fate no longer remained in Kivotos, but was cast upon an unknown land. Amidst the confusion, we realized that our surroundings had changed into something unfamiliar, and it was only natural that chaos would follow. But we never gave up. Because Trinity's noble will must not lose its light anywhere.\n\nHowever, a wave of crisis soon rushed before us. The natives of this new world were also in turmoil. They could not accept the mysterious beings who sought to rule in place of their suddenly vanished government. Conflict between our students and them was inevitable; resistance groups were formed against Trinity's rule, and riots even broke out in several regions. Meanwhile, Trinity Intelligence sent a warning that the greatest trial prepared by our enemies is unfolding right beneath our feet. If we cannot stop this, Trinity will lose its brilliant glory forever.\n\nNow, only our resolve and actions can prevent this crisis."

