l_english:
#포커스
 TCA_invite_foreign_investors:0 "Seek Foreign Investment"
 TCA_invite_foreign_investors_desc:0 "The civil war has ended, and now that the chaotic political situation has settled, we must look outward."

 TCA_mission_to_the_us: "Invite American Ambassador"
 #CHI_mission_to_the_us_desc:0 "China has long had strong allies in the United States. They offer the best opportunity to receive the support we need."

 TCA_closer_ties_with_us:0 "[ROOT.GetAdjective]-[USA.GetAdjective] Cooperation"
 #CHI_closer_ties_with_germany_desc:0 "Our mission to Germany has opened up possibilities for even greater cooperation, including loans to support industrial development."

 TCA_hire_chennault:0 "American Officer Corps"
 #CHI_hire_chennault_desc:0 "Claire Chennault is an American aerial warfare theorist who has shown interest in working for us. We must hire him to rebuild our air force."

 TCA_mission_to_the_soviet_union:0 "Establish Diplomatic Relations with the [SOV.GetAdjective] Side"
 #TCA_mission_to_the_soviet_union_desc:0 "The Soviet Union is showing interest in China as a counterweight to Japanese expansionism. We will send a mission to Moscow to see if our goals align."

 TCA_rapprochement_with_soviet_union:0 "Rapprochement with the Soviet Union"
 TCA_rapprochement_with_soviet_union_desc:0 "While ideological differences exist between us and the Soviet Union, they share the same interests. Let us formalize our new relationship and sign a non-aggression pact to show the world that our two nations stand together."

 TCA_invite_soviet_advisers:0 "Invite Soviet Advisors"
 TCA_invite_soviet_advisers_desc:0 "The Soviet Union has offered to send a military advisory group to help rebuild our military."

 TCA_purchase_tanks:0 "Former German Designers"
 TCA_purchase_tanks_desc:0 "Armored vehicles will form the vanguard of modern warfare. We will strive to absorb the tank manufacturing technology of German companies and form our first armored division."

 TCA_chinese_panzers:0 "Institute of Technology"
 TCA_chinese_panzers_desc:0 "American researchers create new innovations every day in advanced facilities. We must learn from their example and develop our own universities according to their model."

 TCA_tank_plant:0 "Tank Factory"
 TCA_tank_plant_desc:0 "As research into new tanks progresses, we can now invest in a dedicated factory for tank production."

 TCA_hire_soviet_designer:0 "Hire Soviet Designer"
 TCA_hire_soviet_designer_desc:0 "The Soviet Union has been experimenting with tanks for a long time and possesses the world's best tank designers. We will hire one of them to design armored fighting vehicles for us."

 TCA_joint_tank_development:0 "Joint Tank Development"
 TCA_joint_tank_development_desc:0 "With the experience gained from working with Soviet designers, we will be able to create a joint design bureau to work more organizationally and learn from each other."

 TCA_experimental_mechanised_unit:0 "Experimental Mechanized Unit"
 #TCA_experimental_mechanised_unit_effect:0 "Gain a division consisting of 2 §YLight Tank§! and 4 §YMotorized§! battalions\n"
 TCA_experimental_mechanised_unit_desc:0 "Theoreticians in Europe have long discussed the best way to use tanks. A unit combining fast tanks and mobile infantry seems best. We will create such a unit as well."

 TCA_the_soviet_volunteer_group:0 "Soviet Volunteer Group"
 TCA_the_soviet_volunteer_group_desc:0 "Our air force is pathetically weak compared to other powers in the region. We are keeping open the possibility of the Soviet Union deploying a volunteer group."

 TCA_reach_out_to_france:0 "Rapprochement with the Old Order"
 TCA_reach_out_to_france_desc:0 "The great powers of Old Europe, including France, have long since been driven out of Europe and reduced to governments in exile. However, we will still cooperate with these powerful nations to keep the Kivotos nations of Europe in check."

 TCA_maintenance_of_the_new_order_system:0 "Affirm the New Order System"
 TCA_maintenance_of_the_new_order_system_desc:0 "As the era of Old European nations fades, we must stand together with the newly emerged Kivotos."

 TCA_construction_battalions:0 "Construction Battalions"
 #TCA_construction_battalions_desc:0 "If there is one thing our country has in abundance, it is people. We can create special units that only need shovels to perform essential military engineering work."

 TCA_small_arms_expertise:0 "Small Arms Specialization"
 TCA_small_arms_expertise_desc:0 "Small arms remain the mainstay of our military. We must concentrate appropriate resources to keep this field as modern as possible."

 TCA_camco:0 "Aircraft Production Plant"
 TCA_camco_desc:0 "If we want to create an independent aviation industry, we must first learn the techniques and methods for assembling and maintaining the aircraft we possess."

 TCA_french_military_mission:0 "French Military Mission"
 TCA_french_military_mission_desc:0 "The French army is one of the best-trained militaries in Europe. We can learn a great deal from them as well."

 TCA_investment_into_shipbuilding:0 "Shipbuilding Investment"
 TCA_investment_into_shipbuilding_desc:0 "Supporting a large fleet requires a massive industrial base. We must invite foreign investors to help build shipyards."

 TCA_order_destroyers:0 "Destroyer Production"
 TCA_order_destroyers_desc:0 "As the first step toward naval rearmament, we must produce a small fleet of destroyers."

 TCA_modern_submarines:0 "Modern Submarines"
 TCA_modern_submarines_desc:0 "Commerce raiding through large-scale submarine operations is a long-standing tactic established in Germany since before the Great War. We must revive that tactic once more."

 TCA_light_cruiser_project:0 "Light Cruiser Project"
 TCA_light_cruiser_project_desc:0 "The first step in creating a reliable blue-water navy is modernizing our cruiser fleet. Our initial plans should not be too ambitious."

 TCA_heavy_cruiser_project:0 "Heavy Cruiser Project"
 TCA_heavy_cruiser_project_desc:0 "Following the success of previous cruiser designs, we can increase the scale and improve performance to create ships capable of defending the fleet."

 TCA_coastal_patrol_planes:0 "Coastal Patrol Bombers"
 TCA_coastal_patrol_planes_desc:0 "Our long coastline can only be effectively patrolled from the air. Modern torpedo bombers will allow us to defend the coast without consuming too many resources."

 TCA_naval_aviation:0 "Naval Aviation"
 TCA_naval_aviation_desc:0 "The future of naval warfare lies in aircraft carriers. Unless we have our own carriers, we will never be considered a true naval power."

 TCA_new_world_technology_new:0 "Technological Countermeasures"
 TCA_new_world_technology_new_desc:0 "While Halos are resistant to physical shock, they are very vulnerable to attacks such as biochemical agents. We will prepare countermeasures against this and augment the defense of Halo Infantry."

 TCA_new_world_technology_halo:0 "Special Application of Halos"
 TCA_new_world_technology_halo_desc:0 "Through continuous research, it has been revealed that our Halos can be used in very diverse ways, which will lead to an increased composition of Halo-using military units."

 TCA_new_world_technology_halo_heavy:0 "Multi-purpose Halo Research"
 TCA_new_world_technology_halo_heavy_desc:0 "Halo Infantry possesses immense potential. We will further explore Mystic technology to bring out the maximum potential of Halo Infantry."

 TCA_train_marines:0 "Marine Training"
 TCA_train_marines_desc:0 "Our long coastline is vulnerable to enemy landings, but this also provides opportunities to attack enemies who have come ashore from unexpected directions."

 TCA_elite_mountaineers:0 "Elite Mountaineers"
 TCA_elite_mountaineers_desc:0 "Mountain warfare is completely different from combat on the plains. To make the most of our terrain, we must train special forces in this field."

 TCA_combined_arms_warfare:0 "Combined Arms Warfare"
 TCA_combined_arms_warfare_desc:0 "Trucks were sufficient for conducting basic experiments in modern mechanized warfare, but due to disastrous cross-country capability and lack of armor, they are unsuitable for operation on the front lines."

 TCA_pursuit_of_harmony:0 "Harmony of Two Worlds"
 TCA_pursuit_of_harmony_desc:0 "We must adapt to the new world after the Great War. First, we will begin by embracing the students of Trinity."

 TCA_fighter_purchases:0 "Fighter Purchases"
 TCA_fighter_purchases_desc:0 "Our air force needs modern fighters to respond to foreign threats. Since our industry cannot yet produce such things, we must purchase them from abroad."
