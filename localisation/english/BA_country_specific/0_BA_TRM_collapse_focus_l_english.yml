 TRN_collapse_event.11.t: "Trinity's Operation Success"
 TRN_collapse_event.12.t: "Neutralized Operation"
 TRN_collapse_event.13.t: "German Partisan Operation Success"

 TRN_collapse_event.11.desc1: "We have perfectly thwarted the enemy's operation and secured victory.\n\nThe complete elimination of those resistance bastards is not far off!"
 TRN_collapse_event.12.desc1: "The operation plan was perfect, but it is clear the resistance bastards had the same idea as us. Unfortunately, the operation failed."
 TRN_collapse_event.13.desc1: "While we were looking elsewhere, the resistance bastards easily destroyed our base and retreated!\n\nVictory seems to have moved one step further away once again."

 TRN_collapse_event.11.desc2: "The enemies performed an operation that completely pierced through our operation plan.\n\nWe have been defeated. However, it will not be so next time."
 TRN_collapse_event.12.desc2: "The operation plan was perfect, but it is clear the Trinity oppressors had the same idea as us. Unfortunately, the operation failed."
 TRN_collapse_event.13.desc2: "While Trinity's search team was searching the wrong place, we successfully completed our objective.\n\nThe day of liberation is drawing near."

 TRN_collapse_event.11.a: "Excellent!"
 TRN_collapse_event.12.a: "Oh no."
 TRN_collapse_event.13.a: "No!"

 TRN_collapse_event.11.b: "No!"
 TRN_collapse_event.13.b: "Excellent!"

 TRN_collapse_event.21.t: "Trinity's Operation Success"
 TRN_collapse_event.22.t: "Neutralized Operation"
 TRN_collapse_event.23.t: "German SS Operation Success"

 TRN_collapse_event.21.desc1: "We have perfectly thwarted the SS operation and secured victory.\n\nThe complete elimination of those rebel bastards is not far off!"
 TRN_collapse_event.22.desc1: "The operation plan was perfect, but it is clear the rebel bastards had the same idea as us. Unfortunately, the operation failed."
 TRN_collapse_event.23.desc1: "While we were looking elsewhere, the rebel bastards easily destroyed our base and retreated!\n\nVictory seems to have moved one step further away once again."

 TRN_collapse_event.21.desc2: "The enemies performed an operation that completely pierced through our operation plan.\n\nThe field commander must be held responsible."
 TRN_collapse_event.22.desc2: "The operation plan was perfect, but it is clear the invaders had the same idea as us. Unfortunately, the operation failed."
 TRN_collapse_event.23.desc2: "While Trinity's main force moved elsewhere, we perfectly achieved our goal.\n\nGermany's glory is drawing near once again."

 TRN_collapse_event.21.a: "Excellent!"
 TRN_collapse_event.22.a: "Oh no."
 TRN_collapse_event.23.a: "No!"

 TRN_collapse_event.21.b: "No!"
 TRN_collapse_event.23.b: "Excellent!"

 TRN_collapse_event.9.t:0 "[KPD.GetName] Requests Infantry Equipment"
 TRN_collapse_event.9.desc:0 "[KPD.GetName] has requested infantry equipment support for their guerrilla warfare against Trinity. The [KPD.GetAdjective] army lacks even basic equipment and cannot sufficiently arm its troops. However, if we support them, our relationship with [TRM.GetName] will surely deteriorate further."
 TRN_collapse_event.9.a:0 "Of course, we will support them."
 TRN_collapse_event.9.b:0 "Of course, we will help them... secretly."

 TRN_collapse_event.91.t:0 "Infantry Equipment Support from [SOV.GetNameDefCap]"
 TRN_collapse_event.91.desc:0 "[SOV.GetName] has sent the infantry equipment we requested to support our struggle against [TRM.GetName]. With this, we will surely be able to achieve victory against the oppressors."
 TRN_collapse_event.91.a:0 "An excellent result."

 TRN_collapse_event.92.t:0 "[SOV.GetNameDefCap]'s Secret Transport Treaty"
 TRN_collapse_event.92.desc:0 "[SOV.GetName] has signed on to support us secretly in our struggle against [TRM.GetName]."
 TRN_collapse_event.92.a:0 "Are they avoiding conflict with the [TRM.GetName] side?"
