 TCA_american_officer_corps:0 "American Officer Corps"

#이벤트
 TCA_shared.1.t:0 "Soviet Volunteer Group"
 TCA_shared.1.desc_a:0 "As the fighting in Old Germany continues, the need has arisen to assist our comrades in the [From.GetAdjective] military, if only through air support. [From.GetLeader] has contacted us requesting the deployment of volunteers, including pilots and planes. He has requested 50 bombers and 100 fighters to escort them.\n\nIt will be useful experience for our pilots, and we can also conduct field tests of newly designed airframes."
 TCA_shared.1.desc_b:0 "As the war in Old Germany continues, the [From.GetAdjective] Air Force is struggling to protect the skies of [From.GetNameDef] and providing air support to combat groups. Through a personal request, [From.GetLeader] has received support from [SOV.GetLeader] in the form of a composite combat group consisting of 50 heavy bombers and 100 fighters.\n\nIt will be a good opportunity to test our latest equipment in combat situations."
 TCA_shared.1.a:0 "We must support them as much as we can."
 TCA_shared.1.b:0 "They will have to hold out with what they have."

