l_english:
 Eden_alliance_created_already_TT: "The §YEden Treaty Organization§! has been formed."
 Eden_alliance_created_already_TT_NOT: "The §YEden Treaty Organization§! has not been formed."
 Eden_is_joint_focus_member_TT: "Is a member of the §YEden Treaty Organization§!"
 Eden_faction_leader_trigger: "Requirements are relaxed for the founder of the §YEden Treaty Organization§!."
 Eden_centralized_eden_treaty_flag: "We are the center of the §YEden Treaty Organization§!"

 Eden_waiting_flag: "The §YEden Treaty Organization§! is still reorganizing."

 Eden_formation_of_alliance_treaty_organization: "Establishment of the Eden Treaty Organization"
 Eden_formation_of_alliance_treaty_organization_desc: "The Eden Treaty Organization will be created as the first step toward moving past the long-standing conflict between Trinity and Gehenna."

 Eden_alliance_actions: "Actions of the Alliance"
 Eden_alliance_actions_desc: "Since the establishment of the Eden Treaty Organization as a mutual dispute mediation body between Trinity and Gehenna, voices calling for new changes have begun to emerge within the alliance as time passes."

 Eden_eden_annex: "The Great Integration"
 Eden_eden_annex_desc: "Radical theories, led by young students and intellectuals among the member states of the Eden Treaty Organization, are becoming a hot topic, arguing that the barriers between Trinity and Gehenna must be completely torn down."

 Eden_united_state_Eden: "The Great Wave"
 Eden_united_state_Eden_desc: "Those who oppose integration are clearly enemies of the citizens of Eden. We must sweep away the opposition through a great struggle and rightfully achieve the complete unification of the Eden Treaty."
 Eden_united_state_Eden_flag: "Focus §Y$Eden_united_state_Eden$§! completed"

 Eden_eden_unification_war: "Eden Unification War"
 Eden_eden_unification_war_desc: "It is time to begin the great struggle and the march toward grand unification. We must completely dismantle the borders between Gehenna and Trinity, build a melting pot to fuse the nations together, and organize Eden's Crusaders to lead a holy war against separatism and nationalism."
 Eden_united_state_Eden_trigger: "Claimants of the §YEden United States§! can fulfill §YEden Treaty§! conditions §Gwithout any requirements§!!"
 Eden_centralized_eden_treaty_trigger: "The §YCentralized Eden Treaty Organization§! does not require restrictions to activate focuses."

 Eden_status_quo: "Status Quo"
 Eden_status_quo_desc: "The Eden Treaty Organization is perfectly fulfilling its initial purpose. Now is the time to focus on maintaining the status quo and strengthening the internal stability of the Eden Treaty Organization."

 Eden_economic_cooperation: "Economic Integration"
 Eden_economic_cooperation_desc: "As trade within the alliance gradually becomes more active, we need to support trade between academies through tariff agreements and further contribute to the collective development of the alliance."

 Eden_deterrence_of_eastern_threat: "Deterrence of Eastern Threats"
 Eden_deterrence_of_eastern_threat_desc: "Eastern Europe is a place where various wars have continued in extreme chaos since the Great Transfer. We will mobilize the full power of our faction to create an enforced peace to ensure the safety of this region."

 Eden_countering_the_old_order: "Monitoring Old European Nations"
 Eden_countering_the_old_order_desc: "Since abandoning their homelands and fleeing to other continents after the Great Transfer, the nations of old have been constantly seeking an opportunity to return to Europe. If we show them any opening, they will surely launch an invasion against us."

 Eden_basic_research: "Eden Research Cooperation"
 Eden_basic_research_desc: "Through research cooperation between Eden Treaty Organization nations, we will be able to bridge the technological gap between member states and lead broader scientific progress."

 Eden_command: "Eden Treaty Organization Integrated Command"
 Eden_command_desc: "We will establish an Integrated Command for the Eden Treaty Organization to facilitate military operations and establish a powerful defensive capability against external aggression."

 Eden_integration_of_industrial_sectors: "Industrial Sector Integration"
 Eden_integration_of_industrial_sectors_desc: "By moving beyond tariffs to broad industrial cooperation, we can boost the industrial capacity of the Treaty Organization and secure a stable economic structure."

 Eden_nordic_construction_developments: "Joint Research Investment"
 Eden_nordic_construction_developments_desc: "We will expand the Eden Technology Bureau to enable larger-scale joint research, which will allow the technological level of the Treaty Organization member states to rise at a faster pace."

 Eden_military_academy: "Eden Military Academy"
 Eden_military_academy_desc: "We will establish an integrated military academy for training officers from Treaty Organization member states to facilitate broad military cooperation and the cultivation of military talent."

 Eden_national_integration_start: "Proclamation of Eden Unification"
 Eden_national_integration_start_desc: "After a great struggle, we have succeeded in integrating the Eden Treaty Organization. We shall grant glory to the numerous citizens praising the name of the Eden United States and to the soldiers of the fatherland who have endured the 'civil war'."
 Eden_national_integration_start_tt: "If §Y[ED1.GetNameWithFlag]§!, §Y[ED2.GetNameWithFlag]§!, §Y[ED3.GetNameWithFlag]§!, §Y[ED4.GetNameWithFlag]§!, and §Y[ED5.GetNameWithFlag]§! are our subjects, we will gain §Ycores§! on their §Yrespective states§! and §Yannex§! them.\n\n§RUpon focus completion, the Eden Mandates can no longer be established!§!"

 Eden_no_tariff_measure: "Eden Currency Block"
 Eden_no_tariff_measure_desc: "By unifying the currency within the Eden Treaty Organization, we can better reflect the organization's agenda and expand the sense of economic community."


 Eden_centralized_eden_treaty: "Centralization of the Eden Alliance"
 Eden_centralized_eden_treaty_desc: "The power of the Eden Treaty Organization is far too decentralized. With our nation as the chair, we will integrate the economy and military of the organization to exert the unified will of the Eden Treaty upon the world."
 Eden_centralized_eden_treaty_tt: "Acceptance probability increases under the following conditions:\n -§YHigh Opinion§! of us\n -We possess a more powerful §Yarmy§!\n -Same §Ygovernment type§! as us\n -Fighting in the same §Ywar§! as us"

 Eden_eden_central_army: "Eden Central Army"
 Eden_eden_central_army_tt: "Gain §G+5000§! Manpower per §YEden Treaty Member§!\nAll §YEden Treaty Members§!: Gain §G+5000§! Manpower per §YEden Treaty Member§!"

 Eden_eden_air_force_command: "Eden Air Force Command"
 Eden_eden_air_force_command_tt: "All §YEden Treaty Member§! subject types:\nTransfer Air Force to §Y[ROOT.GetName]§!"

 Eden_central_european_fleet: "Central European Fleet"
 Eden_central_european_fleet_tt: "All §YEden Treaty Member§! subject types:\nTransfer Navy to §Y[ROOT.GetName]§!"

 Eden_golden_fleet_project: "Golden Fleet Project"

 Eden_eden_central_planning_committee: "Eden Central Planning Committee"

 Eden_central_european_unified_command: "Central European Unified Military Commission"
 idea_Eden_central_european_unified_command: "Central European Unified Military Commission"
 idea_Eden_central_european_unified_command_desc: "The forces and integrated command unified under the Eden Treaty Organization's Central European Unified Military Commission form a close link between industry, civilians, and the military, achieving the protection of the Eden Treaty Organization."
 Eden_central_european_unified_command_tt: "\nAll §YEden Treaty Organization Member States§! gain: §YExtensive Conscription§!"

 Eden_central_european_integration: "Central European Dominance"
 Eden_central_european_integration_tt: "$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+X%§! \n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: §G+X%§! \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+X%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+X%§!\n§G+4%§! for each Eden Treaty nation in the same faction as §Y[ROOT.GetName]§! or §Y$autonomy_eden_centralized_eden_treaty_member$§!"
 Eden_treaty_written_in_iron_and_blood_ns: "A Treaty Written in Iron and Blood"
 Eden_treaty_written_in_iron_and_blood_ns_desc: "Eden was in crisis. The chaos in the east, where blades were aimed at each other's hearts, and the numerous conflicts between academies cast out into a cold world prevented us from exercising our strength and rendered the Eden Treaty futile. But now, it will be different. The Eden Treaty has become whole, and our swords have been sharpened. Now, we shall enforce our order upon the world."

