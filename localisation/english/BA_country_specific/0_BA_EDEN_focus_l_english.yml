# Events

 Eden_event.1.t: "Attempted Integration of the Eden Treaty Organization by [?global.Eden_alliance_leader.GetName]!"
 Eden_event.1.desc: "Since establishing the Eden Treaty Organization, [?global.Eden_alliance_leader.GetName] has gradually presented an integrationist perspective and has now begun to push for intensive integration discussions among the member states.\n\nProgressive students have started to send enthusiastic support for these discussions, while the conservative leadership of the existing academies has begun to express discomfort."
 Eden_event.1.a: "Very well. Let us agree to the integration."
 Eden_event.1.b: "No, this is nothing but collective madness. We shall withdraw from the organization."

 Eden_event.2.t: "Approval of Integration from [FROM.GetName]"
 Eden_event.2.desc: "In the massive debate regarding the Eden Treaty Organization integration proposal, [FROM.GetName] has announced their stance in favor of our push for integration."
 Eden_event.2.a: "One step forward."

 Eden_event.3.t: "Withdrawal from the Treaty Organization by [FROM.GetName]!"
 Eden_event.3.desc: "In the massive debate regarding the Eden Treaty Organization integration proposal, [FROM.GetName] strongly criticized the integration and withdrew from our Treaty Organization for the purpose of defending their national sovereignty."
 Eden_event.3.a: "Supremacist fools."
 Eden_event.3.b: "Their government was surely elected undemocratically."

 
 Eden_event.4.t: "Centralization of the Eden Treaty Organization"
 Eden_event.4.desc: "The [FROM.GetAdjective] government has announced a massive reform plan to 'centralize' the Eden Treaty Organization for effective defense, broad regional cooperation, and the value of mutual prosperity, and has established the Eden Central Committee. They are sending messages encouraging our nation's participation, and we must make a grave decision regarding this matter."
 Eden_event.4.a: "This is nothing short of imperialism!"
 Eden_event.4.b: "We shall transition into a member state of the integrated Eden Treaty Organization."

 Eden_event.5.t: "Approval of Eden Treaty Organization Centralization by [FROM.GetName]"
 Eden_event.5.desc: "[FROM.GetName] has decided to join our union. Now, even if the unimaginable occurs, we are not alone."
 Eden_event.5.a: "Good."
 Eden_event.6.t: "Rejection of Eden Treaty Organization Proposal by [FROM.GetName]"
 Eden_event.6.desc: "Despite the persistent global tensions, [FROM.GetName] has disagreed with our centralization proposal. They seem to prefer other policies; we only hope their policies do not negatively impact our prestige on the world stage."
 Eden_event.6.a: "Unfortunate."
