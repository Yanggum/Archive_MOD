#Rework - Focuses
 KPD_repetition_of_resistance: "Iterative Resistance"
 KPD_repetition_of_resistance_desc: "We must collapse Trinity through exhaustion by maintaining constant, iterative resistance. We must remind them that nowhere is safe."
 KPD_request_for_more_soviet_support: "Request More Support from the Union"
 KPD_request_for_more_soviet_support_desc: "...Perhaps at the cost of granting the Union significant control over our future government, we can request extensive support."
 flag_KPD_request_for_more_soviet_support: "Requested large-scale support from the Union"
 KPD_end_of_trinity: "End of Trinity"
 KPD_end_of_trinity_desc: "The tyranny of Trinity General School has come to an end. It is time to celebrate our great victory and grandly proclaim the restoration of the German government."
 KPD_anti_trinity_uprising: "Anti-Trinity Uprising"
 KPD_anti_trinity_uprising_desc: "Pick up your weapons against the oppressors! The Red Front marches!"
 KPD_replication_of_mystic_weaver: "Replication of the Mystic Weaver"
 KPD_replication_of_mystic_weaver_desc: "The need for Mystic Weavers, to be used by the Trinity students who have chosen to follow us, is being raised."
 KPD_temporary_equality_manifesto: "Temporary Equality Manifesto Enacted"
 KPD_temporary_equality_manifesto_desc: "1. Trinity students shall be treated as fully equal to the German people and without discrimination in our war of liberation.\n2. All Germans and Trinity students shall not be loyal to the oppressive Trinity government and must support resistance activities.\n3. Failure to comply with the above will be regarded as participation in the counter-revolution."
 KPD_securing_of_wartime_supplies: "Secure Wartime Supplies"
 KPD_securing_of_wartime_supplies_desc: "We must procure equipment for our advance from weapons held by Trinity students under our occupation, as well as from abandoned German armories and numerous other locations."
 KPD_declaration_of_emergency_mobilization_order: "Emergency Mobilization Decree"
 KPD_declaration_of_emergency_mobilization_order_desc: "We must propagate our revolution everywhere and conscript more people to cooperate with the cause."
 KPD_additional_militia_organization: "Organize Additional Militia"
 KPD_additional_militia_organization_desc: "Our militias are performing excellently in the war. Creating additional units can provide further assistance in the anti-Trinity struggle."
 KPD_dissolution_of_joint_supreme_command: "Dissolve Joint Supreme Command"
 KPD_dissolution_of_joint_supreme_command_desc: "The Joint Supreme Command established during the emergency will now be dissolved, and the German Socialist Republic will be proclaimed through a newly established Constituent Assembly."
 KPD_establishment_of_factory_councils: "Establish Factory Councils"
 KPD_establishment_of_factory_councils_desc: "The factory councils established during the Soviet Revolution showed very immature management capabilities, likely due to a fatal lack of education. We trust the high education level of the German people and will attempt factory councils once more."
 KPD_establishment_of_factory_councils_1_tt: "\n95 days after focus completion:"
 KPD_establishment_of_factory_councils_2_tt: "\n190 days after focus completion:"
 KPD_establishment_of_factory_councils_3_tt: "\n285 days after focus completion:"
 KPD_nationalization_of_industries: "Organize Industrial Commission"
 KPD_nationalization_of_industries_desc: "To resolve the mass flight of the bourgeoisie and Junkers and the acts of industrial sabotage, we must organize commissions to control and oversee industries in each region, which will stabilize the industrial system in the long term."
 KPD_german_land_revolution: "German Land Revolution"
 KPD_reconstruction_of_peoples_industry: "Reconstruct People's Industry"
 KPD_revolutionary_transformation_of_enterprises: "Revolutionary Transformation of Enterprises"
 KPD_revolutionary_transformation_of_enterprises_tt: "Unlocks various §YDecisions§! to convert all available §YIndustrial Concerns§! into People's Enterprises."
 KPD_womens_rights_and_equality: "Women's Rights and Equality"
 KPD_reorganize_nationale_volksarmee: "Reorganize National People's Army"
 KPD_reorganize_nationale_volksarmee_desc: "Corruption and fascist apologism are still rampant within the military. To prevent resistance and treason, we must first weed out those likely to rebel. As this process will create significant vacancies, we must ensure the safety of the people by appointing loyal officers to lead our brave soldiers into whatever battlefields may arise."
 KPD_formalize_the_intelligence_wing: "Establish Intelligence Wing"
 KPD_formalize_the_intelligence_wing_desc: "Our nation has suffered under leaders who cared nothing for the public good. To give our all to national reconstruction, we must first understand what we are rebuilding. Establishing an intelligence wing will be the first step!"
