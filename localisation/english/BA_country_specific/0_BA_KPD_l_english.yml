#######Events######
 KPD_event.1.t: "Demand for Poznan"
 KPD_event.1.d: "According to our intelligence, the otherworldly forces that emerged in the former German state have fallen into chaos, leading to massive unrest bordering on civil war. We will mass troops in the Poznan region and occupy it within three days, demanding its permanent cession from those whose military foundation is currently weak."
 KPD_event.1.a: "Reclaim our land!"
 KPD_event.1.b: "It is too dangerous."

 KPD_event.2.t: "Polish Army Marches into Poznan"
 KPD_event.2.d: "Although the recent chaos has settled, the Polish army suddenly advanced into and occupied Poznan. Our garrison offered minor resistance, but it was insufficient. We must now consider all possible diplomatic or military measures."
 KPD_event.2.a: "Let us not act rashly."
 KPD_event.2.b: "Let them know their place."

 KPD_event.3.t: "Liberation of Berlin"
 KPD_event.3.d: "Our brave revolutionary warriors have succeeded in repelling the reactionaries and foreign powers from Berlin. The Red Flag, symbol of the People's Union, now flies over the Cathedral, and the working masses of Berlin are organizing their own vanguard units to serve the revolution."
 KPD_event.3.a: "Welcome them!"
 KPD_event.3.b: "Reorganize them into our army."

 KPD_event.4.t: "Workers of Hamburg"
 KPD_event.4.d: "In coordination with our glorious army's entry into Hamburg, the city's workers rose up and seized key production facilities. Our revolutionary government has recognized the will of the Hamburg working masses to organize armed bodies and will provide various supports to ensure they stand firm in our ranks."
 KPD_event.4.a: "Welcome, comrades!"
 KPD_event.4.b: "Welcome to our army."

 KPD_event.5.t: "People of Bavaria"
 KPD_event.5.d: "Although Southern Germany, represented by Bavaria, is the birthplace of the Nazi Party and a region where fascist forces are strong, there are oppressed people in every land. The local peasant masses, exploited for their labor and surplus by Bavarian landlords, and workers suffering under the intensified exploitation of otherworldly rule, cheered as the revolutionary army liberated Bavaria. They desired solidarity in the anti-capitalist, anti-imperialist, and national liberation front, and we will gladly help them arm."
 KPD_event.5.a: "The chains of oppression are broken!"
 KPD_event.5.b: "We must be wary of their ideological contamination."

 KPD_event.6.t: "Revolution in East Prussia"
 KPD_event.6.d: "While the bourgeoisie worried about how to cross the bridge, the proletariat of Königsberg suffered for a long time. However, following the G-Transition, they began to be ruled by a militaristic armed fascist group called Arius, which led them to persistently resist their rulers and develop a revolutionary character. Finally, as the revolutionary warriors of [KPD.getName] advanced into Königsberg, all oppression and exploitation against them ended immediately. This has also led many young people, who were forced into conscription to serve the counter-revolution, to resolve to fight for the correct ideology. The Party has decided to organize these youths into a new armed organization."
 KPD_event.6.a: "Past mistakes shall be forgiven through revolutionary zeal!"
 KPD_event.6.b: "...You have worked hard indeed, comrades."

 KPD_event.7.t: "Red Spark Blazing in Chaos"
 KPD_event.7.d: "While the world was in chaos, the otherworldly entities transferred to Germany overthrew the fascist regime and brought new changes to a German region mired in reaction. Many Germans were frustrated and despaired at losing their country, but many others were not. Trinity, another theocratic-oligarchic feudal state that rose upon the crushed fascist regime, collapsed within two months, unable to overcome its administrative limits. This has prepared the stage for [KPD.getName], organized at the time of the G-Transition, to take action."
 KPD_event.7.a: "We have risen again, in the name of Spartacus!"

 KPD_event.8.t: "Urban Restoration Project"
 KPD_event.8.d: "An opinion has been raised to restore the cities lost in the aftermath of the G-Transition to their former state, and we must make a decision on this."
 KPD_event.8.a: "There is no need to dwell on the remnants of the past."
 KPD_event.8.b: "Support the reconstruction project."

 KPD_event.9.t: "German-Soviet Technological Coordination"
 KPD_event.9.d: "We have just received an expression of interest from [FROM.GetName] to cooperate with us technologically."
 KPD_event.9.a: "You are welcome, comrade."
 KPD_event.9.b: "We have no intention of cooperating with you."

 KPD_event.10.t: "German-Soviet Technological Coordination: Accepted"
 KPD_event.10.d: "[FROM.GetName] has accepted our request for technological coordination, and we can now receive their technological research results."
 KPD_event.10.a: "Excellent results."

 KPD_event.11.t: "German-Soviet Technological Coordination: Declined"
 KPD_event.11.d: "[FROM.GetName] has declined our request for technological coordination."
 KPD_event.11.a: "How unfortunate."

 KPD_event.12.t: "Free German Trade Union Federation"
 KPD_event.12.d: "As Trinity's so-called 'holy' rule collapsed and the red flag rose over the ruins they left behind, the heart of Germany, which had been holding its breath deep underground, began to beat again. Under the madness of the previous Nazi regime and the violence named 'Mystery' shown by the subsequent otherworldly occupiers, the German labor movement seemed thoroughly destroyed.\n\nYet, in the cracks of factory rumbles and behind crumbling bricks, the workers had been secretly rebuilding their organizations. The 'Free German Trade Union Federation (FDGB)' they organized was not a mere interest group. They were the supply lines providing materials to the partisans, the sabotage agents hindering enemy weapon production, and above all, the spiritual pillar that prevented anyone from giving up this desperate fight.\n\nNow that shouts of victory cover Berlin, the scattered struggle committees and factory cells from across the land are integrating into one massive rank. The FDGB has come to the forefront to fill the void left by fleeing capitalists and Junkers, and to rebuild the ruined fatherland with the workers' own hands. This is not just the establishment of a union; it is a historic moment proclaiming who the new masters of Germany are."
 KPD_event.12.a: "A federation of free workers!"

 KPD_event.13.t: "Cracks in the Alliance"
 KPD_event.13.d: "Although the Communist Party and the Social Democratic Party were the mainstream of the People's United Front, it is a fact that other small anti-Nazi parties and even the right-wing parties that colluded with them supported us and participated. Now that the civil war is over and stability is beginning, they and their supporters are demanding that general elections be held as soon as possible."
 KPD_event.13.a: "Conflicts within the alliance are intensifying."

 KPD_event.14.t: "Refining the Factory Council System"
 KPD_event.14.d: "The factory council system, established to control our uncontrolled factories, has been refined and is showing better efficiency.\n\nWith continuous improvement, our democratic worker management system will operate without issues!"
 KPD_event.14.a: "Progress toward socialism."

 KPD_event.15.t: "Mastery of Factory Councils"
 KPD_event.15.d: "Our factory councils have begun to show better efficiency through continuous operation and the training of skilled workers.\n\nWhile the worker self-management system using factory councils still appears less mature than top-down command, continuous improvement will allow for better efficiency even without central control."
 KPD_event.15.a: "Forward!"

 KPD_event.16.t: "Worker Self-Management"
 KPD_event.16.d: "Our factory councils are now comparable to Western bourgeois enterprises or the Soviet collectivization system, and have begun to secure superior productivity in terms of efficiency.\n\nOur worker self-management system will operate without issue, proving that an economy from below is certainly an advanced system!"
 KPD_event.16.a: "For the workers and the people!"

 KPD_event.17.t: "Compliance with the Molotov-Thälmann Pact"
 KPD_event.17.d: "Our nation has gained control over territory within Poland belonging to a treaty partner, and we must return that territory in accordance with the pact.\n\nIf we do not comply, that nation may threaten to start a war against us."
 KPD_event.17.a: "Comply with the treaty."
 KPD_event.17.b: "It's a secret pact, what are they going to do?"

 KPD_event.18.t: "Breach of the Poland Partition Treaty"
 KPD_event.18.d: "The Poland Partition Agreement, a treaty between Germany and the Soviet Union, was just breached by a unilateral notification from one nation.\n\nOur nation must choose whether to overlook the issue or show our strength through war and forcibly collect on the treaty."
 KPD_event.18.a: "They will pay the price."
 KPD_event.18.b: "Bring it on!"

 KPD_event.19.t: "Message from Millennium"
 KPD_event.19.d: "A student from Millennium Science School has sent a message regarding industrial cooperation. 'Efficiency is the key to progress. Let's optimize our production lines together!'"
 KPD_event.19.a: "Calculate the surplus value."

 KPD_event.20.t: "Fear of Stalin"
 KPD_event.20.d: "Following the Great Purge in Moscow, the Communist Party of Germany began to split. Many party members lost faith in Moscow and Stalin, and a sense of fear regarding the NKVD began to build. Since Münzenberg was rallying the previously disbanded opposition factions of the party, we have expelled him."
 KPD_event.20.a: "A split in the party."

 KPD_event.21.t: "Molotov-Thälmann Pact"
 KPD_event.21.d: "The newly established German government has proposed a treaty to us for the partition of Poland. This pact additionally proposes a mutual defense agreement to restrain Poland, which has recently shown expansionist behavior in Eastern Europe.\n\nThe new German government may still be weak, but if we sign this agreement, we can easily crush Poland and bring a socialist order to Eastern Europe."
 KPD_event.21.a: "Sign the treaty."
 KPD_event.21.b: "We cannot agree to this pact."

 KPD_event.22.t: "Moscow Accepts the Treaty"
 KPD_event.22.d: "[SOV.GetName] has signed our Poland Partition Treaty, and we have begun preparing for war, severing diplomatic relations with Poland in accordance with the pact.\n\nUnfortunately, some factions exist who criticize the pact as 'German Ultranationalism,' but the majority seem to agree on crushing Poland."
 KPD_event.22.a: "Good."

 KPD_event.23.t: "Moscow Rejects the Treaty"
 KPD_event.23.d: "[SOV.GetName] has rejected our treaty and come out criticizing Germany's expansionist behavior.\n\nThrough this incident, diplomatic relations between the Soviet Union and Germany have soured, and it has become difficult for us to respond even if the Comintern enters a war with Poland."
 KPD_event.23.a: "Unfortunate."

 KPD_event.24.t: "[FROM.getname] Accepts Soviet Control"
 KPD_event.24.d: "The Foreign Ministry of [FROM.getname] has informed our Foreign Ministry of their intent to accept Soviet control for the sake of the Comintern's cause and to contribute to the construction of a communist society.\n\nThis is unprecedented, causing significant confusion even among Soviet party members. If we accept this decision, [FROM.getname] will come under our control."
 KPD_event.24.a: "Welcome to the Federation, comrade."
 KPD_event.24.b: "What on earth did these people just say?"

 KPD_event.25.t: "Moscow Accepts Our Decision"
 KPD_event.25.d: "[SOV.GetName] has respected our decision and accepted us as an official member of the Comintern.\n\nNow, the future of the communist society we envision seems to be drawing closer."
 KPD_event.25.a: "For the great cause."

 KPD_event.26.t: "Moscow Rejects Our Decision"
 KPD_event.26.d: "[SOV.GetName] has rejected our request, and we have failed to join the Comintern."
 KPD_event.26.a: "How unfortunate."

 KPD_event.27.t: "[FROM.GetName]'s Proposal to Invade Poland"
 KPD_event.27.d: "[FROM.GetName] has requested our approval for an invasion of Poland, citing our previous treaty.\n\nIf we accept this proposal, we will attack [POL.GetName] alongside [FROM.GetName] and partition the territory according to the treaty."
 KPD_event.27.a: "Approve."
 KPD_event.27.n: "No, this is too dangerous."

 KPD_event.28.t: "[FROM.GetName] Approves Invasion of Poland"
 KPD_event.28.d: "Upon hearing our proposal to invade Poland, [FROM.GetName] is immediately reviewing military operations and has promised to partition Poland in half according to the treaty."
 KPD_event.28.a: "We must also prepare for war."

 KPD_event.29.t: "[FROM.GetName] Rejects Invasion of Poland"
 KPD_event.29.d: "[FROM.GetName] has rejected our proposal to invade Poland, citing the risks involved."
 KPD_event.29.a: "A pity."

 KPD_unit_leader_event.2.t: "Formally Appointed [?ROOT.KPD_event_target_loc.GetName]"
 KPD_unit_leader_event.2.desc: "[?ROOT.KPD_event_target_loc.GetName], who has made great contributions to our partisan organization from a civilian background, has been formally appointed as a general during the rank introduction process pushed by [Root.GetLeader]."
 KPD_unit_leader_event.2.a: "Good."

 KPD_unit_leader_event.3.t: "Disbanded Unit of [?ROOT.KPD_event_target_loc.GetName]"
 KPD_unit_leader_event.3.desc: "The militia of former commander [?ROOT.KPD_event_target_loc.GetName] has today been formally integrated into the [Root.GetName] regular army, and [?ROOT.KPD_event_target_loc.GetName] has been recognized as a formal commander of our forces. General [?ROOT.KPD_event_target_loc.GetName] immediately began service for the [Root.GetName] military, and the system is gradually being refined."
 KPD_unit_leader_event.3.a: "Welcome, General."

 KPD_unit_leader_event.4.t: "Dissolution of [?ROOT.KPD_event_target_loc.GetName]'s Vanguard Organization"
 KPD_unit_leader_event.4.desc: "The vanguard organized by [?ROOT.KPD_event_target_loc.GetName] based on revolutionary values has today undergone dissolution procedures while celebrating the success of the revolution. [?ROOT.KPD_event_target_loc.GetName] expressed a desire to work for our military and was subsequently appointed as a formal commander. General [?ROOT.KPD_event_target_loc.GetName] is serving with revolutionary zeal, and members of his former vanguard are also believed to be undergoing the enlistment process."
 KPD_unit_leader_event.4.a: "Celebrating the victory of the revolution."

 KPD_unit_leader_event.5.t: "Dissolution of [?ROOT.KPD_event_target_loc.GetName]"
 KPD_unit_leader_event.5.desc: "[?ROOT.KPD_event_target_loc.GetName], one of the senior soldiers' councils that contributed greatly to our revolution, was dissolved a short while ago. [?ROOT.KPD_event_target_loc.GetName] is no longer necessary, and the high-level personnel who comprised the council will be integrated into our military.\n\nDebate continues within the left as to whether this is a retreat for the revolution or a natural procedure."
 KPD_unit_leader_event.5.a: "It is a natural procedure."

 KPD_unit_leader_event.6.t: "Dissolution of [?ROOT.KPD_event_target_loc.GetName]'s Council"
 KPD_unit_leader_event.6.desc: "The council of [?ROOT.KPD_event_target_loc.GetName], which led one of the soldiers' councils, was dissolved a short while ago. Following the success of the revolution, the soldiers' council of [?ROOT.KPD_event_target_loc.GetName] is no longer necessary and has been disbanded along with all other soldiers' councils. [?ROOT.KPD_event_target_loc.GetName] expressed a desire to work as an officer in the new regular army and was subsequently approved as a formal officer."
 KPD_unit_leader_event.6.a: "Welcome to the new army, General."

 KPD_unit_leader_event.7.t: "End of Rank Reform"
 KPD_unit_leader_event.7.desc: "All rankless commanders have now been assigned formal ranks and integrated into the regular army's organization. It is time for us to declare the end of rank reform and announce the appearance of a formally reborn German military.\n\nControversy over whether this is truly right is appearing here and there, but the existence of a proper regular army is essential for the defense of the revolution, and history will prove that this was correct."
 KPD_unit_leader_event.7.a: "Form up the ranks!"

 KPD_antileft_event.1.t: "Free Trade Unions"
 KPD_antileft_event.1.desc: "Following our victory, the headquarters of the trade union 'FDGB' is located in a classic stone building in Berlin, but its true power lies not in stacks of paperwork, but in the factory floors where acrid smoke rises.\n\nWe flatly reject the 'subordination of trade unions to the Party' that the Soviet Union committed in the past. We have resolved to reorganize trade unions not as simple wage negotiation bodies, but as a federation of 'autonomous organizations that directly control production and distribution.'\n\n\"Whether it's a capitalist or a bureaucrat wearing a party badge, no one can tell us what to do!\" The cry of a rough worker from the industrial zone has now become our official doctrine. Maximizing field autonomy and minimizing central directives—this is the true solidarity of free workers."
 KPD_antileft_event.1.a: "Set all trade unions free!"

 KPD_soviet_event.1.t: "Connecting Point between Party and Masses"
 KPD_soviet_event.1.desc: "Now that the dictatorship of the proletariat has been established, 'strikes' or 'sabotage'—old habits under the previous capitalist system—must be defined as counter-revolutionary acts. In a state where the worker is the master, for a worker to struggle against the state is a contradiction in itself.\n\nFollowing the guidance of the Central Party, the 'Free German Trade Union Federation (FDGB)' has entered full restructuring. The role of the trade union is no longer to demand wage increases, but to spread the Party's economic plans to the field, increase productivity, and become a 'school' that remolds workers into communist human types.\n\nAs Comrade Lenin preached, the trade union must be a faithful transmission belt that delivers the power of the Party to the machinery of the masses. Freedom without discipline is license, and a union without the Party's guidance is merely a blind interest group."
 KPD_soviet_event.1.a: "Iron discipline, explosive production!"

 # Soviet Event (Proposal Received)
 KPD_soviet_event.2.t: "Industrial Cooperation Proposal"
 KPD_soviet_event.2.desc: "The [FROM.GetAdjective] leadership has presented a proposal for industrial cooperation between our two countries. This proposal contains specific details on how to improve and expand our industrial activities.\n\nGiven that the [FROM.GetAdjective] leadership follows Marxist-Leninist doctrine and world communism is currently threatened, industrial cooperation linking Berlin and Moscow is essential."
 KPD_soviet_event.2.a: "There is no reason to refuse."
 KPD_soviet_event.2.b: "However, we have other thoughts."
 # German Event (When Soviet Accepts)
 KPD_soviet_event.3.t: "[FROM.GetNameDefCap] Agrees to Industrial Cooperation"
 KPD_soviet_event.3.desc: "[FROM.GetAdjective] has agreed to our industrial cooperation proposal. Now, both nations will cooperate to improve industrial scale and productivity."
 KPD_soviet_event.3.a: "Good!"
 KPD_SOV_industrial_cooperation: "German-Soviet Industrial Cooperation"
 # German Event (When Soviet Rejects)
 KPD_soviet_event.4.t: "[FROM.GetNameDefCap] Rejects the Proposal"
 KPD_soviet_event.4.desc: "[FROM.GetAdjective] has rejected our industrial cooperation proposal. Despite it being a mutually beneficial proposal, the other side would not listen to our opinions. Though the plan has fallen through, some goals can still be achieved: namely, effectively promoting industrial expansion through our own strength alone."
 KPD_soviet_event.4.a: "Then we shall expand on our own."

 # Soviet Event (Proposal Received)
 KPD_soviet_event.5.t: "German Electronics Supply Proposal"
 KPD_soviet_event.5.desc: "The [FROM.GetAdjective] comrades have sent a proposal to supply the Federation with the latest electronic equipment on a large scale. Communication equipment and radar components produced with Berlin's advanced technology will be a great boon to the modernization of the Red Army.\n\n[FROM.GetNameDefCap] hopes to use this to narrow the technological gap between the two countries and establish a firm defensive line for the socialist camp against the military threats of capitalist forces."
 KPD_soviet_event.5.a: "An excellent proposal. We gladly accept."
 KPD_soviet_event.5.b: "Our own technology is sufficient."
 # German Event (When Soviet Accepts)
 KPD_soviet_event.6.t: "[FROM.GetNameDefCap] Accepts Electronics Supply"
 KPD_soviet_event.6.desc: "[FROM.GetAdjective] has gladly accepted our proposal to supply electronic equipment. Soon, large freight trains carrying the latest communication equipment and parts will head to Moscow. This brotherly support will further strengthen the bond between our nations and fortify the shield of the world revolution."
 KPD_soviet_event.6.a: "A victory for socialist solidarity!"
 KPD_SOV_electronics_cooperation: "Supply Electronics to the Federation"
 # German Event (When Soviet Rejects)
 KPD_soviet_event.7.t: "[FROM.GetNameDefCap] Rejects the Proposal"
 KPD_soviet_event.7.desc: "[FROM.GetAdjective] has politely declined our electronics supply proposal. They seem to have judged their own research and production capabilities sufficient to arm the Red Army. Although our support was refused, the advanced equipment already produced will be put to good use in the modernization of our National People's Army."
 KPD_soviet_event.7.a: "In that case, we shall use it for our own army."

 # Soviet Event (Proposal Received)
 KPD_soviet_event.8.t: "Main General Staff Integration Plan"
 KPD_soviet_event.8.desc: "The [FROM.GetAdjective] side has proposed a bold military plan to prepare for the military threats of Western imperialists and otherworldly fascists. Known as the 'Main General Staff Plan,' it involves fully delegating operational control of the [FROM.GetAdjective] military to the Supreme Command in Moscow during wartime or significant crises.\n\nThis shows the loyalty and determination of [FROM.GetNameDefCap] to establish a unified command system for the socialist camp, even at the cost of giving up some of the nation's military autonomy."
 KPD_soviet_event.8.a: "We shall fight as one under the banner of the Red Army!"
 KPD_soviet_event.8.b: "They must be responsible for their own defense."
 # German Event (When Soviet Accepts)
 KPD_soviet_event.9.t: "[FROM.GetNameDefCap] Approves General Staff Integration"
 KPD_soviet_event.9.desc: "The [FROM.GetAdjective] Supreme Command has officially approved our 'Main General Staff Plan.' Now, should wartime arrive, our National People's Army will move under the swift and unified command of Moscow. The bourgeois nations will tremble before our overwhelming military solidarity."
 KPD_soviet_event.9.a: "The army of workers and peasants follows the orders of Red Square."
 KPD_SOV_unified_command: "German Main General Staff"
 # German Event (When Soviet Rejects)
 KPD_soviet_event.10.t: "[FROM.GetNameDefCap] Rejects General Staff Integration"
 KPD_soviet_event.10.desc: "Surprisingly, [FROM.GetAdjective] has rejected our proposal to delegate military control. They seem to have judged that it is more geographically advantageous for each nation's military to possess independent defensive capabilities. The plan to enter directly under Moscow's umbrella has fallen through, but this also means we must perfectly develop our military's independent operational capabilities."
 KPD_soviet_event.10.a: "We defend our fatherland with our own hands."

 KPD_industrial_relocation_cat: "Industrial Relocation"
 KPD_industrial_relocation_cat_desc: "While the industrial base may shrink in the short term due to the industrial relocation plan with the [SOV.GetNameDef] side, the raw materials we secure will offset the losses and further strengthen our production lines."
 KPD_industrial_relocation_oil_decision: "Relocate industry to [FROM.CONTROLLER.GetNameDef] to receive oil from [FROM.GetName]"
 KPD_industrial_relocation_tungsten_decision: "Relocate industry to [FROM.CONTROLLER.GetNameDef] to receive tungsten from [FROM.GetName]"
 KPD_industrial_relocation_chromium_decision: "Relocate industry to [FROM.CONTROLLER.GetNameDef] to receive chromium from [FROM.GetName]"

