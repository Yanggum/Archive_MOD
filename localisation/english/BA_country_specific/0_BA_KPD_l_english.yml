l_english:

 KPD_country_intro_header: "The Spark of Germany"
 KPD_country_intro_content: "When the German imperialists started the war, we resisted. Amidst the chaos that followed the Great War, we resisted. When the torch of Weimar was broken and the Nazi Party took power, we resisted. And now, as the otherworldly imperialists occupy our fatherland and attempt to extinguish every flame, we will resist, and we shall prevail!\n\nFor the proletarians of all nations have a world to win and nothing to lose but their chains. We will begin again from the lowest depths and strike them down.\n\nFor all Germans, for all proletarians, and for the ranks of world communism!"
 KPD_guide: "Objectives\n\n§YVictory over Trinity§! \n£white_dot First, succeed in the uprising against Trinity and bring them to ruin!"
 ##Rewrite after content completion 
 #Selection Screen 
 KPD_GATHERING_STORM_DESC: "When Trinity seized control of Eastern Germany and sought to quell the German flames, the German Partisans—one of two insurgent groups that rose up—became the first united front of the broad left, centered around the Communist Party of Germany. A second attempt, involving the Communist Workers' Party (KAPD), the Communist Party of Germany (Opposition) (KPD-O), and elements of the Social Democratic left, continues in Mecklenburg.\n\nPerhaps for the German communists, who suffered immense destruction and oppression under the Nazi Party, the G-Transition has become an unexpected opportunity."
 
