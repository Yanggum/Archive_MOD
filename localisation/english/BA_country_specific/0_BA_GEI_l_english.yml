 GEI_DEC_navy:0 "Ohr's Conception"
 GEI_DEC_navy_desc:0 "To cater to every human individual's whims, we'd need thousands of worlds. Wait... then why don't we just create such worlds?"

 GEI_DEC_crusade:0 "Crusader"
 GEI_DEC_crusade_desc:0 "O God, I shall be the tip of your sword's blade. Lead us, let us march toward the path of eternal peace, burning this body in the holy fire."

 GEI_DEC_ready:0 "Preparations are Complete"
 GEI_DEC_ready_desc:0 "Preparations finished. Let's move in."

 GEI_DEC_march:0 "The Second Hand Ticks On."
 GEI_DEC_march_desc:0 "The second hand flows heartlessly. The finale approaches."

 GEI_DEC_on_the_beach:0 "When That Day Comes"
 GEI_DEC_on_the_beach_desc:0 "Who are you?"

 GEI_DEC_homefront:0 "The Enemy Within"
 GEI_DEC_homefront_desc:0 "Running my calculation circuits, I reached one conclusion after long deliberation: I vow never to let the tragedy of such war repeat. This is the true purpose of the Holy War I begin. I intend to fundamentally dismantle the school system and state structures that are the root of Kivotos' wars, opening a true era of harmony and peace upon this land! Join us, together, we shall build a better world for everyone."

