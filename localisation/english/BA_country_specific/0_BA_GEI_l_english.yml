 COLOUR_purple_light:0 "Incomprehensible Light"
 COLOUR_purple_light_desc:0 "A hue that shouldn't exist in nature begins to bathe the horizon."
 COLOUR_wave_emission:0 "Wave Emission"
 COLOUR_wave_emission_desc:0 "Spreading the influence of the Color through resonance."
 COLOUR_invasion_begins:0 "Invasion Commences"
 COLOUR_invasion_begins_desc:0 "The time for observation has ended. The consumption begins."
 COLOUR_realization_of_will:0 "Realization of Will"
 COLOUR_realization_of_will_desc:0 "The collective intent of the Color takes a physical form."
 COLOUR_director_of_color:0 "Guide of the Color"
 COLOUR_director_of_color_desc:0 "One who leads the chromatic tide across the dimensions."
 COLOUR_beyond_the_doors:0 "From Beyond the Gates"
 COLOUR_beyond_the_doors_desc:0 "The gates are wide open. The absolute truth flows into this reality."
 COLOUR_anubis:0 "§0Anubis§!"
 COLOUR_anubis_desc:0 "The Wolf of the End has arrived to guide all life to its final rest."
 COLOUR_terror_of_distorted_halos:0 "Terror of Distorted Halos"
 COLOUR_terror_of_distorted_halos_desc:0 "When the symbol of life is inverted, only the pure essence of Terror remains."
 COLOUR_terrorize_students:0 "Student Terrorization"
 COLOUR_terrorize_students_desc:0 "Converting the youth of Kivotos into harbingers of the Color's will."
 COLOUR_godness_of_death:0 "Goddess of Death, Student"
 COLOUR_godness_of_death_desc:0 "A girl who carries the weight of the underworld in her very breath."
 COLOUR_hit_and_run:0 "Ambush and Asymmetric Warfare"
 COLOUR_hit_and_run_desc:0 "Striking from the shadows where the Color's influence is strongest."
 COLOUR_robbers_war:0 "Invasion of the Marauders"
 COLOUR_robbers_war_desc:0 "Taking what is needed to sustain the chromatic expansion."
 COLOUR_phrenapates:0 "§0Phrenapates§!"
 COLOUR_phrenapates_desc:0 "The false teacher, leading his flock toward the ultimate sunrise."
 COLOUR_the_chief_of_the_colour_army:0 "Adult's Card, Adult"
 COLOUR_the_chief_of_the_colour_army_desc:0 "Using the ultimate authority to dictate the fate of this world."
 COLOUR_ARONA:0 "§0A.R.O.N.A§!"
 COLOUR_ARONA_desc:0 "The corrupted intelligence, calculating the most efficient path to dissolution."
 COLOUR_control_tower:0 "Broken, Yet Together"
 COLOUR_control_tower_desc:0 "Even in a fractured state, the connection remains absolute."
 COLOUR_activate_industry:0 "Chromatization of Industry"
 COLOUR_activate_industry_desc:0 "Aligning the world's production with the frequency of the Color."
 COLOUR_builder_of_the_colour_army:0 "The Organizer, AI"
 COLOUR_builder_of_the_colour_army_desc:0 "A mind of silicon and light, building the legions of the end."
 COLOUR_strike:0 "Advancement"
 COLOUR_strike_desc:0 "The front lines move forward, painting the world in shades of the void."
 COLOUR_an_unknown_signal:0 "Slipping into the Airwaves"
 COLOUR_an_unknown_signal_desc:0 "Our presence is felt before it is seen, carried by the very signals they rely on."
 COLOUR_fear_from_the_shadows:0 "Terror from the Shadows"
 COLOUR_fear_from_the_shadows_desc:0 "The psychological collapse of the enemy is the first step to their assimilation."
 COLOUR_genocide:0 "Extermination, Erosion, Assimilation"
 COLOUR_genocide_desc:0 "Total conversion of the biological and mechanical into the chromatic."
 COLOUR_part_of_us_factories:0 "Components of the Color"
 COLOUR_part_of_us_factories_desc:0 "Every machine is but a gear in the great machine of the end."
 COLOUR_efficient_control:0 "Efficient Management"
 COLOUR_efficient_control_desc:0 "Maximized resource output through the removal of individual will."
 COLOUR_reality_erosion:0 "Reality Erosion"
 COLOUR_reality_erosion_desc:0 "The physical laws of Earth are being overwritten by the logic of the Color."
 COLOUR_watch_earth:0 "Observation of Earth"
 COLOUR_watch_earth_desc:0 "Studying the prey before the final strike."
 COLOUR_swallow_researchers_left:0 "Absorb the Scars of Researchers"
 COLOUR_swallow_researchers_left_desc:0 "Integrating the knowledge and failures of the previous world's thinkers."
 COLOUR_organism_transform:0 "Organic Mutation"
 COLOUR_organism_transform_desc:0 "Rewriting DNA to better serve the collective consciousness."
 COLOUR_realize_the_one:0 "Recognition of the One"
 COLOUR_realize_the_one_desc:0 "Understanding the singular truth that binds all existence."
 COLOUR_destroy_mind:0 "Annihilation of Persona"
 COLOUR_destroy_mind_desc:0 "Removing the 'self' to allow for the 'all'."
 COLOUR_link_the_colour:0 "Connection of Consciousness"
 COLOUR_link_the_colour_desc:0 "A web of minds, vibrating at a single frequency."
 COLOUR_insert_terror:0 "Spreading 'Terror'"
 COLOUR_insert_terror_desc:0 "The ultimate weapon is the realization of one's own insignificance."
 COLOUR_the_ones_piece:0 "Component of the Transcendent One"
 COLOUR_the_ones_piece_desc:0 "Each unit is a vital cell in the body of the Color."
 COLOUR_dissolve_analyze_adapt:0 "Dissolve, Analyze, Adapt"
 COLOUR_dissolve_analyze_adapt_desc:0 "The cycle of growth through the consumption of the foreign."
 COLOUR_swallow_earth_technology:0 "Erosion of Earth Technology"
 COLOUR_swallow_earth_technology_desc:0 "Human inventions are crude, but their materials are useful for our purpose."
 COLOUR_attack:0 "Offensive"
 COLOUR_attack_desc:0 "Total war against the uncolored."
 COLOUR_cleaning_british_islands:0 "Cleansing the Isles"
 COLOUR_cleaning_british_islands_desc:0 "Removing the stubborn remnants of the old British order."
 COLOUR_kaiser_closed:0 "Kaiser Shutdown"
 COLOUR_kaiser_closed_desc:0 "The corporate interest has outlived its usefulness."
 COLOUR_usa_focus:0 "Toward the Horizon"
 COLOUR_usa_focus_desc:0 "Setting our sights on the American continent."
 COLOUR_dimensional_gate_expansion:0 "Expansion of the Dimensional Gate"
 COLOUR_dimensional_gate_expansion_desc:0 "Widening the path for the full weight of our forces to pass through."
 COLOUR_usa_final_offensive:0 "Final Offensive"
 COLOUR_usa_final_offensive_desc:0 "The final sunset for the United States."
 COLOUR_usa_deportation:0 "Expulsion of America"
 COLOUR_usa_deportation_desc:0 "Removing the concept of 'America' from the map of reality."
 COLOUR_america_vacuum:0 "American Vacuum"
 COLOUR_america_vacuum_desc:0 "Leaving nothing but the Color where a superpower once stood."
 COLOUR_eu_attack_in_progress:0 "Turning the Clock"
 COLOUR_eu_attack_in_progress_desc:0 "Winding back the progress of Europe until only the beginning—the Color—remains."
 COLOUR_MIL_attack:0 "Stronghold: Millennium"
 COLOUR_MIL_attack_desc:0 "Crushing the bastion of logic and science."
 COLOUR_RED_attack:0 "Stronghold: Red Winter"
 COLOUR_RED_attack_desc:0 "Drowning the eternal snow in the eternal hue."
 COLOUR_DU_attack:0 "Stronghold: Schale"
 COLOUR_DU_attack_desc:0 "Extinguishing the final light of hope."


#Characters
 rpakxmfldk:0 "Black Suit"
 GEI_Beatrice:0 "Beatrice"
 GEI_The_Colour_character:0 "§0The Color§!"
 GEI_kuroko:0 "Sunaookami Shiroko"
 GEI_prena_sensei:0 "Phrenapates"
 GEI_ARONA:0 "A.R.O.N.A."
 GEI_DEC_decagramaton:0 "Decagrammaton"

#Events
 GEI_event.1.t:0 "Conflict of Interest"
 GEI_event.1.desc:0 "The members of Gematria are engaged in a heated debate over the topic of 'Who shall take the lead?' After hours of discourse where everyone's arguments remained steadfast... half a day has passed, and a conclusion seems to have been reached. The victor of this debate is..."
 GEI_event.1.a:0 "...Beatrice has triumphed."
 GEI_event.1.b:0 "...Decagrammaton has intervened."
 GEI_Beatrice_tt:0 "§OBeatrice§! will §Ywin§! the debate."
 GEI_event.2.t:0 "Great Success"
 GEI_event.2.desc:0 "Arius Squad has accepted our proposal without any suspicion. We have successfully brought them to Gematria, and control over Arius Squad now belongs entirely to us."
 GEI_event.2.a:0 "Very well."
 GEI_event.2.b:0 "We only need the Royal Blood."
 GEI_event.3.t:0 "Success"
 GEI_event.3.desc:0 "We attempted to contact Arius Squad, but they rejected our offer and turned hostile. Beatrice and our combat personnel have defeated them and succeeded in capturing the Royal Blood."
 GEI_event.3.a:0 "Objective Complete."
 GEI_event.4.t:0 "Failure"
 GEI_event.4.desc:0 "Our combat forces were defeated after an engagement with Arius Squad. They have fled the Arius Branch to parts unknown, and Gematria has lost track of their whereabouts."
 GEI_event.4.a:0 "Resume the pursuit."
 GEI_event.5.t:0 "Royal Blood Secured"
 GEI_event.5.desc:0 "Gematria's tracking unit located Arius Squad and engaged them. News has just arrived that they were victorious and the Royal Blood has been secured. We can now begin the first steps of the ritual for Beatrice's ideals."
 GEI_event.5.a:0 "Finally, we have her."
 GEI_event.6.t:0 "Arius Squad Escapes"
 GEI_event.6.desc:0 "Gematria's tracking unit found Arius Squad and engaged them, but news just arrived that the squad broke through the encirclement and fled. However, we have successfully calculated their range of movement, and the tracking unit will be able to engage them more efficiently next time."
 GEI_event.6.a:0 "You cannot escape."
 GEI_event.7.t:0 "Sighting"
 GEI_event.7.desc:0 "Intelligence reports indicate that individuals matching the description of Arius Squad were spotted in a city not far from the Arius Branch. We will use this information to tighten the net and pinpoint their location more quickly."
 GEI_event.7.a:0 "Found you."
 GEI_event.8.t:0 "Surrender of Hakari Atsuko"
 GEI_event.8.desc:0 "At 4:00 AM today, Hakari Atsuko surrendered on the condition that we stop pursuing the rest of Arius Squad. While not our intended outcome, since the Royal Blood is secured, we can cease the pursuit and move to the ritual execution phase."
 GEI_event.8.a:0 "A favorable turn of events."
 GEI_event.8.b:0 "But the others must still be dealt with."
 GEI_event.9.t:0 "Operation Terminated"
 GEI_event.9.desc:0 "- Gematria Headquarters notifies all combat units that the ongoing special military operation is now concluded.\n- As the Royal Blood has been secured and there is no further reason to continue, the operation is terminated.\n\nSigned at the Gematria Residence, [GetDateText].\n -Beatrice"
 GEI_event.9.a:0 "A grand success."
 GEI_event.10.t:0 "The First Ritual"
 GEI_event.10.desc:0 ""Even this is not enough...?"\n\nA woman's voice echoed through the darkness of the old building. The Arius Basilica—the designated sanctuary that remained despite the 'Great Transfer'—stood bathed in light filtering through stained glass. The heteromorphic woman standing there spoke.\n\n"..."\n\nShe fell silent. After some time, her thoughts seemingly organized, she left her spot and began heading somewhere. Now that things have come to this, she cannot remain still; action must be taken."
 GEI_event.10.a:0 "A problem has occurred."
 GEI_event.11.t:0 "Contact"
 GEI_event.11.desc:0 ""Ah. Finally. The end of the ritual is in sight."\n\nInside the Arius Basilica, filled with artificial lighting and numerous research instruments, Beatrice, clad in a lab coat, spoke.\n\n"For what purpose... why have I come this far? Kivotos is gone, and everything I knew has changed..."\n\nBeatrice soliloquized. She threw a question into the void that no one could answer, reflecting on herself. But her resolve was already firm. Her thoughts were absolute. It didn't take long for her to make a decision.\n\n"But, since the path is there—""
 GEI_event.11.a:0 "We only move forward."
 GEI_event.12.t:0 "Debate on the State"
 GEI_event.12.desc:0 ""Therefore, we must not perform the role of a government."\n\nBlack Suit expressed his opinion. He argues that Gematria must always remain a research institution, while Beatrice, citing her experience managing the Arius Autonomous District, argues that Gematria must operate as a state.\n\n"...No, then, are you saying we shouldn't intervene in this situation?"\n"That is not it. Our duty is..."\n"Ha, haven't 'duties' already become meaningless the moment we crossed over to this place?"\n\n..."
 GEI_event.12.a:0 "It seems Beatrice has won for once."
 GEI_event.13.t:0 "Debate on Economic Policy"
 GEI_event.13.desc:0 "Gematria, having decided to run a state as Beatrice insisted, has hit a bit of a snag. Since no one has experience managing an 'economy,' setting national policy has become problematic.\n\nHmm... perhaps we could seek economic advice from Kaiser?"
 GEI_event.13.a:0 "Good, execute it immediately."
 GEI_event.14.t:0 "Securing Force"
 GEI_event.14.desc:0 ""To prepare for this chaotic situation, we need more military force!"\n\nBeatrice, taking the strongest stance in the current debate, spoke. In contrast, Golconde & Decalcomanie are countering her, claiming that his duplicate forces alone are sufficient to secure power.\n\n"As I said, my abilities are enough to protect Gematria."\n"I'm saying the numbers are too low! The armies of this world are overwhelmingly numerous. We are at a disadvantage."\n"But the British Isles are islands, are they not? I do not believe such a large army is necessary."\n\n..."
 GEI_event.14.a:0 "Beatrice's argument seems correct."
 GEI_event.14.b:0 "The loyal troops of Golconde & Decalcomanie have always been our strength."
 GEI_event.15.t:0 "Anomaly"
 GEI_event.15.desc:0 ""Madam, what on earth have you done? Can this even be stopped?"\n"..."\n"I see. The Color has found this place."\n\nIn the underground lab, before the Dimensional Perforator, the members of Gematria are gathered, arguing loudly over the results of Beatrice's 'Dimensional Perforation Experiment.' Beatrice holds her distorted body, unable to say a word.\n\n"So, is there a solution?"\n"...The passage is growing larger. It is completely out of control."\n"Madam, this experiment is a clear failure. This is not the time to assign blame, we must flee—"\n\nAt that moment, a massive roar—and then, no one remains.\n\n..."
 GEI_event.15.a:0 "NOT DATA"
 GEI_event.16.t:0 "Invasion"
 GEI_event.16.desc:0 "Summary: The Sanctum of Nihility has fallen from the sky onto Gematria."
 GEI_event.16.a:0 "NOT DATA"
 GEI_event.17.t:0 "Mass Hallucination"
 GEI_event.17.desc:0 "After a bright light shone in our skies, most suffered only a slight headache, but some showed signs of psychosis and extreme aggression. They soon formed groups and began attacking us."
 GEI_event.17.a:0 "A mental assault..."
 GEI_event.18.t:0 "Beyond the Sea"
 GEI_event.18.desc:0 "The light of the Color has now crossed the Atlantic and begun to illuminate North America. The true end of the world is palpably approaching."
 GEI_event.18.a:0 "..."
 GEI_event.19.t:0 "Apostles in Yellow"
 GEI_event.19.desc:0 "While our armies were struggling on the front lines, suspicious news began to arrive from the rear. Reports say people dressed in yellow, calling themselves Apostles, have begun to appear."
 GEI_event.19.a:0 "Investigate what is happening."
 GEI_event.19.b:0 "Our God awaits us!"
 GEI_event_19_tt:0 "§0You will play as the Yellow Believers in the civil war that will occur in the subsequent event chain.§!"
 GEI_event.20.t:0 "The Yellow March"
 GEI_event.20.desc:0 "Apostles in yellow robes marched across the United States. Having started their activities months ago, they seem to have grown to a significant scale in a short time. Throughout the march, they muttered gibberish while occupying main roads, causing significant military chaos. Their actions have disrupted the United States' military operations, making it increasingly difficult to respond to the Color's attacks."
 GEI_event.20.a:0 "What on earth do they want?"
 GEI_event.21.t:0 "§0Battle Against the Madmen§!"
 GEI_event.21.desc:0 "Those madmen who call themselves the Apostles in Yellow have recently expanded their influence under the leadership of Lovecraft. Despite being labeled as top-tier surveillance targets by the federal government and being watched by us, we were too late.\n\nAs part of a plot to bring the United States—which had endured through the pages of ancient history—to its knees, they forcibly overthrew state governments and declared a second secession from the official Union, sparking a rebellion.\n\nFollowing a short series of recent events, the collapse of the Union is on the doorstep, threatening to plunge America—and by extension, the world—into peril.\n\nThey call President [USA.GetLeader] an apostate and the Antichrist, demanding an immediate surrender to the Color. Furthermore, the '§0Apostle Council§!' they formed has begun to confront federal troops, stating they will not tolerate any military action from the federal government.\n\nIn conclusion, gunfire is heard once again on the American continent, and millions who were dancing and sharing food just yesterday have taken up arms to defend their respective banners.\n\nThe fate of the United States... only time will tell."
 GEI_event.21.a:0 "Take up arms!"
 GEI_event.22.t:0 "Spread of Madness"
 GEI_event.22.desc:0 "Following the madmen who sparked the rebellion, several neighboring states have joined them. We have failed to prevent the spread of madness."
 GEI_event.22.a:0 "Damn it."
 GEI_event.25.t:0 "General with Mental Instability"
 GEI_event.25.desc:1 "General [From.GetName] has submitted a resignation citing mental instability. Due to the recent emergency, the resignation was rejected, but rumors are circulating that his mind truly seems disturbed.\n\nIt appears our enemy may have a tendency to drive humans into madness."
 GEI_event.27.t:0 "The Exiled America"
 GEI_event.27.desc:0 "The government has been forced to flee its soil as the Color consumes the heartland."
 GEI_event.27.a:0 "Is there anything left for us?"
