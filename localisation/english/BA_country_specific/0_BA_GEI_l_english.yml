# Events
 GEI_event.28.t:0 "Invasion of the Color"
 GEI_event.28.d:0 "Unidentified phenomena have begun to appear worldwide. Strange colored lights and disappearances are becoming increasingly frequent."
 GEI_event.28.a:0 "This is an ill omen..."

 GEI_event.29.t:0 "Disappearance of Researchers"
 GEI_event.29.d:0 "Researchers are suddenly vanishing from research facilities across the country. Only strange traces of color remain."
 GEI_event.29.a:0 "Our knowledge is in danger."

 GEI_event.30.t:0 "Chromatic Mutation"
 GEI_event.30.d:0 "Inhabitants of occupied territories are undergoing strange changes. Their forms are becoming more like the Color."
 GEI_event.30.a:0 "It is evolution into a new existence."

# Event Titles
 GEI_event.31.t:0 "Color Network Complete"
 GEI_event.31.d:0 "We have finally completed the global Color network. Now, all chromatized beings are connected as one consciousness."
 GEI_event.31.a:0 "We have become one."

 GEI_event.32.t:0 "Research Facility Infiltration"
 GEI_event.32.d:0 "Unidentified entities have infiltrated our research facilities. Important research data is vanishing."
 GEI_event.32.a:0 "We must stop this."

 GEI_event.33.t:0 "Decagrammaton Improvement"
 GEI_event.33.d:0 "Development of new Decagrammaton equipment is complete. It will exhibit even more powerful combat capabilities than before."
 GEI_event.33.a:0 "A perfect evolution."

 GEI_event.34.t:0 "Gate Network Established"
 GEI_event.34.d:0 "The gate network has been successfully established. We can now reach anywhere in an instant."
 GEI_event.34.a:0 "Space is no longer a constraint."

 GEI_event.35.t:0 "Ambush via Gates"
 GEI_event.35.d:0 "Enemy forces have penetrated deep into our territory through suddenly appearing dimensional gates."
 GEI_event.35.a:0 "There is no way to prepare for such a threat."

 GEI_event.36.t:0 "Corruption of the Student Council"
 GEI_event.36.d:0 "The influence of the Color has spread throughout the Student Council. They are now perfect tools for realizing our will."
 GEI_event.36.a:0 "The school is ours now."

 GEI_event.37.t:0 "Corruption of the Halo"
 GEI_event.37.d:0 "Unidentified colors are corrupting our students' halos. Their combat effectiveness is rapidly plummeting."
 GEI_event.37.a:0 "We must stop this corruption."

 GEI_event.38.t:0 "Manifestation of the Goddess's Power"
 GEI_event.38.d:0 "The Goddess of Death has unleashed all of her power. Our army has gained strength incomparable to before."
 GEI_event.38.a:0 "Victory is ours."

 GEI_event.39.t:0 "Terror of Death"
 GEI_event.39.d:0 "The terror spread by the Goddess of Death is paralyzing our army. Soldiers' morale is plummeting."
 GEI_event.39.a:0 "We must overcome this fear."

 GEI_event.40.t:0 "Pillage Unit Organization Complete"
 GEI_event.40.d:0 "Organization of professional pillaging units is complete. We can now seize enemy resources more efficiently."
 GEI_event.40.a:0 "Bring everything."

 GEI_event.41.t:0 "Military Facility Attacked"
 GEI_event.41.d:0 "Unidentified Color forces have raided our military facilities. A significant amount of equipment and resources was seized."
 GEI_event.41.a:0 "Our strength has been weakened."

 GEI_event.42.t:0 "Tactical AI Analysis"
 GEI_event.42.d:0 "The enemy's advanced AI system is perfectly analyzing our tactics. Every move we make is being predicted."
 GEI_event.42.a:0 "I've never faced such an opponent."

 GEI_event.43.t:0 "Shadows Fall"
 GEI_event.43.d:0 "Unidentified shadows are infiltrating across our borders. The presence of an invisible enemy is terrifying our citizens."
 GEI_event.43.a:0 "This terror must be stopped."

 GEI_event.44.t:0 "Chromatization of Industrial Facilities"
 GEI_event.44.d:0 "Our factories are turning strange colors. Workers are confused, and production lines are slowly grinding to a halt."
 GEI_event.44.a:0 "It's out of control."

 GEI_event.45.t:0 "Final Offensive"
 GEI_event.45.d:0 "The armies of the Color have launched an offensive of unprecedented scale. The sky is stained in strange hues, and our defensive lines are collapsing instantly."
 GEI_event.45.a:0 "Is this the end?"

 GEI_event.46.t:0 "Collapse of Industrial Facilities"
 GEI_event.46.d:0 "Chromatized industrial facilities have begun to collapse due to overload. Production lines are paralyzed, and workers are in a state of panic."
 GEI_event.46.a:0 "Unstoppable."

 GEI_event.47.t:0 "Depletion of Resources"
 GEI_event.47.d:0 "Due to reckless extraction, mines and oil fields are beginning to run dry. Underground structures are becoming unstable."
 GEI_event.47.a:0 "We need more resources."

 GEI_event.48.t:0 "Shadows Seeping In"
 GEI_event.48.d:0 "Strange shadows are seeping into our territory. An invisible terror is engulfing our citizens."
 GEI_event.48.a:0 "We must end this fear."

 GEI_event.49.t:0 "Reality Shudders"
 GEI_event.49.d:0 "Reality is starting to distort. The world as we knew it is crumbling."
 GEI_event.49.a:0 "Is this a nightmare?"

