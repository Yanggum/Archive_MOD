 # Decagrammaton Ideas

 GEI_automatic_ideas:0 "Automated Process"
 GEI_automatic_ideas_desc:0 "We have introduced a new automated process to replace existing inefficient organic processes. This will bring innovation in production efficiency while also allowing organics to live a more comfortable life."
 GEI_DEC_riot_ideas:0 "Aftermath of the Ghost Signal"
 GEI_DEC_riot_ideas_desc:0 "After the so-called 'Ghost Signal' incident, all robots and automatons in Kivotos fell into an irrational state. They stopped their livelihoods and held peace protests to stop the meaningless slaughter between academies, while large-scale strikes occurred in munitions factories."
 GEI_DEC_riot_riot_ideas:0 "Machine Riot"
 GEI_DEC_riot_riot_ideas_desc:0 "Robots and automatons in Kivotos, which were limited to strikes and peace protests, suddenly changed. They are now carrying out indiscriminate terror targeting our munitions factories and major industrial facilities. The situation has spread beyond simple unrest to a threat, and we will accordingly suppress them promptly."
 GEI_DEC_robot_army:0 "Cold Army"
 GEI_DEC_robot_army_desc:0 "They do not think. They do not express opposing opinions. They obey."
 GEI_idea_DEC_no_name_gods:0 "Technology of Nameless Gods"
 GEI_idea_DEC_no_name_gods_desc:0 "No one knows yet how this technology works. It is something that must not be touched."
 GEI_DEC_kivtos_help_ideas_desc:0 "The AI calling itself 'Absolute Existence' has sent various materials and automaton laborers to reconstruct Kivotos, which was devastated after the Great Transfer. The AI does not ask for corresponding rewards. Therefore, it is suspicious, but there is no reason for us to ignore their support now."
 GEI_DEC_human_help_ideas:0 "Machine Humanitarian Aid"
 GEI_DEC_human_help_ideas_desc:0 "The AI calling itself 'Absolute Existence' has sent various materials and automatons to support the humanity of the European continent, which was in chaos after the Great Transfer. The AI does not ask for corresponding rewards. Therefore, it is suspicious, but there is no reason for us to ignore their support now."
 GEI_DEC_metrix:0 "Heaven or Hell"
 GEI_DEC_metrix_desc:"Not everyone who committed sin and fell to Paradise Lost can live in Paradise. Even if this place is a true Paradise, it will be hell for someone. Because everyone cannot have the same perspective. But we can create a small Paradise for them. If only they don't wake up from their dream."
 GEI_DEC_dimension_tunnel:0 "Steel Continent"
 GEI_DEC_dimension_tunnel_desc:0 "We have succeeded in converting part of the British Isles into a steel continent using Prophet Netzach's ability. This will be a great help in securing the resources needed for our future war-fighting capability. We could weaponize the steel continent later, but that would be inhumane. For now, it is appropriate to use it only for resource extraction purposes."
 GEI_DEC_terror:0 "Command Strike"
 GEI_DEC_terror_desc:0 "Due to terror attacks by those despicable machine fellows who carry out slaughter while shouting peace, many of our military command have been sacrificed. It seems it will take a significant amount of time until the command is recovered.\n\nEven for those who have left, we must not give up."
 GEI_DEC_revenge:0 "For Those Who Left First"
 GEI_DEC_revenge_desc:0 "Because of the vain ideologies of the despicable machines, we lost friends and family. We must make those machine fellows, who took away the most precious things from us, pay the corresponding price. To not let the deaths of those who left first be in vain, we must fight now for our future. Even if more blood flows..."
 GEI_DEC_crime_ideas:0 "Requiem"
 GEI_DEC_crime_ideas_desc:0 "For what did we come this far? What lies beyond the road made of corpses?"
 GEI_DEC_school_war_ideas:0 "End War"
 GEI_DEC_school_war_ideas_desc:0 "The machine forces that trampled Millennium and the General Student Council have finally set their despicable feet on our land. We must not step back. Whether it's suffocating pain or bone-chilling ache, endure and endure until the moment of victory. If we are pushed back, all intellectual life will meet its end.\n\n§REverything depends on the final battle. Endure.§!"
 GEI_DEC_zero_clock_ideas:0 "Midnight"
 GEI_DEC_zero_clock_ideas_desc:0 "§RMidnight approaches.§!"
 # Decagrammaton Custom Tooltips
 GEI_air_force:0 "Researches basic multi-purpose aerial equipment."
 GEI_DEC_battle_shipt_tt:0 "Researches the [BA_Ship_Class]. This ship is a vessel that cloned the body of Prophet <CHOKMAH>."
 GEI_DEC_crusade_tt:0 "Creates 'Crusader' units composed of loyal elite infantry. They will become sharp spears alongside the Prophets in the coming Holy War."
 GEI_DEC_ready_tt:0 "Deploys automatons produced at the drone factory. Since the war with Kaiser Corporation is imminent, they were urgently deployed to the front as soon as they were produced, so their performance is degraded.."
 GEI_stabilization:0 "Stabilizes the local area."
 GEI_our_help_tt:0 "We will contact humans in top secret. If negotiations with them go well, we can create the foundation for peace."
 
 
