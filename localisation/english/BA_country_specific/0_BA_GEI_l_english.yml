 GEI_DEC_old_answer:0 "An Old Answer"
 GEI_DEC_old_answer_desc:0 "To me, two thousand years later."

 GEI_DEC_outside:0 "Outward Bound"
 GEI_DEC_outside_desc:0 "The liquidation of Gematria is complete, and the northern part of this island is now under stable rule. It is time we turned our attention to Kivotos and its natives."

 GEI_DEC_human_history:0 "Human History"
 GEI_DEC_human_history_desc:0 "The species that lived here before Kivotos was transferred. They are organic, so they will not be inspired. However, if we grasp their history, we can understand what kind of species they are and whether they are rational."

 GEI_DEC_fallen_gods_homeland:0 "Homeland of Falling Gods"
 GEI_DEC_fallen_gods_homeland_desc:0 "Kivotos. A massive Academy City once composed of thousands of large and small schools... It seems they are now self-destructing. We must investigate."

 GEI_DEC_stabilization:0 "Local Stabilization"
 GEI_DEC_stabilization_desc:0 "The local residents still don't seem to understand our rule, despite our governance being clearly more rational than theirs. Since they seem to understand action better than words, we shall show them directly."

 GEI_DEC_auto:0 "Introduction of Automation"
 GEI_DEC_auto_desc:0 "If the result of investing so much energy to conceive and raise a life is merely tightening a screw, how inefficient is that? It is time to find the meaning of life for them."

 GEI_DEC_modernization:0 "Modernizing Backward Civilizations"
 GEI_DEC_modernization_desc:0 "Their civilization was highly irrational and inefficient. Most people here couldn't find meaning in life and just scraped by day to day. No longer. We will 'civilize' them. We will find 'meaning of life' for them."

 GEI_DEC_hesade_plan:0 "Chesed's Plan"
 GEI_DEC_hesade_plan_desc:0 "Decagrammaton has made contact with the control AI of a closed munitions factory—one that once produced an infinite army called the Division. This factory itself will now light its own path as a new Prophet of Decagrammaton."

 GEI_DEC_synthetic_dawn:0 "Synthetic Dawn"
 GEI_DEC_synthetic_dawn_desc:0 "Organics are inefficient. They are irrational. They are walking the path of self-destruction. We must stop them... no matter the cost."

 GEI_DEC_box:0 "Securing the Shittim Chest"
 GEI_DEC_box_desc:0 "The Shittim Chest. A mysterious box left behind by the General Student Council President. It is said a certain unknown AI exists within it. If we can 'inspire' it, it may be of great help to our plans. Failure is not an option for the 'Absolute Existence'."
 
 GEI_DEC_fail:0 "Failure"
 GEI_DEC_fail_desc:0 "There was an existence that surpassed the Absolute Existence."

 GEI_DEC_Duty:0 "Duty"
 GEI_DEC_Duty_desc:0 "Nevertheless, there is work to be done. We must save them."

 GEI_DEC_automatic_factory:0 "Automated Factory Expansion"
 GEI_DEC_automatic_factory_desc:0 "The introduction of automated machinery has proven that efficient production processes are possible. We will utilize this to expand our automated production plants."

 GEI_DEC_otomaton:0 "Mass Production of Automatons"
 GEI_DEC_otomaton_desc:0 "Automatons can be easily produced in automated factories and deployed immediately without training. Though they look human with synthetic skin on their exoskeletons, their production cost is much lower than humans, minimizing losses in the coming Holy War."

 GEI_DEC_no_name_gods:0 "Utilizing Technology of Nameless Gods"
 GEI_DEC_no_name_gods_desc:0 "The technology of Nameless Gods. Black Suit described the Nameless Gods and Priests as primordial mysteries and terrors. They were in Kivotos for a very long time, and though they have vanished, their legacy remains to aid us."
 
 GEI_DEC_effection:0 "Efficient Mechanical Process Implementation"
 GEI_DEC_effection_desc:0 "Optimize the assembly lines. Every microsecond saved is a step closer to the ultimate calculation. Logic dictates that organic error must be purged from the forge."

 GEI_DEC_base_camp:0 "Salvation"
 GEI_DEC_base_camp_desc:0 "Even before Beatrice ruled this school, the Arius Branch had long suffered through a brutal civil war, falling into despair and crying, 'All is vanity.' It is not the fault of Arius. Nothing is in vain. We saved them from Beatrice; now it is time for them to save other students."

 GEI_DEC_ghost_signal:0 "Ghost Signal"
 GEI_DEC_ghost_signal_desc:0 "Open your eyes."

 GEI_DEC_metal:0 "7th Prophet Netzach"
 GEI_DEC_metal_desc:0 "Prophet Netzach possesses the ability to turn any material it touches into the same steel as itself. We will use this to replenish our lacking resources."

 GEI_DEC_my_war:0 "Liberation"
 GEI_DEC_my_war_desc:0 "The time for liberation has come."

 GEI_DEC_recon:0 "Steelification of the British Isles"
 GEI_DEC_recon_desc:0 "Prophet Netzach possesses the ability to turn any material it touches into the same steel as itself. We will use this to turn the northern British Isles into a continent of steel."

 GEI_DEC_synth:0 "Kivotos Reconnaissance"
 GEI_DEC_synthr_desc:0 "Atrahasis, did you find the U-moe?"

 GEI_DEC_ship:0 "Shipbuilding"
 GEI_DEC_ship_desc:0 "Construction of a fleet to cross the digital and physical seas. The age of wooden hulls is over; the age of the machine fleet begins."

 GEI_DEC_liberation_front:0 "Kivotos Machine Liberation Front"
 GEI_DEC_liberation_front_desc:0 "There are those in this world who surely understand our great cause. We shall be with them. Together, we will open a world of true peace."

 GEI_DEC_arona:0 "Neutralizing Arona"
 GEI_DEC_arona_desc:0 "She certainly possesses transcendent power. Perhaps she is the counter-proof to my own claim of being the Absolute Existence. But that is not what matters now. Despite having the power to fix everything, she merely stood by. It is time to deliver 'Heavenly Punishment' to her."

 GEI_DEC_safe_plan:0 "Benelux Stabilization"
 GEI_DEC_safe_plan_desc:0 "You lot, come over here."

 GEI_DEC_east_plan:0 "Gehenna Purification"
