 GEI_decagramaton_alliance_decision_category_desc: "데카그라마톤의 의지를 따르고자 하는 동맹을 찾는 것은 매우 어려운 일입니다. 대부분의 국가는 데카그라마톤과 협력하려고 하지 않을 것입니다. 하지만 이미 로봇에 의해 정부가 장악되어 있는 국가라면, 데카그라마톤이 그들을 상대로 §Y감화§!를 시도할 수 있을 것입니다."

 GEI_finding_alliance_GEH: "[GEH.GetNameDef] 측을 향한 동맹 제안"
 GEI_finding_alliance_GEH_desc: "소라사키 히나는 자신이 유기생명체인 것처럼 행동하고 있지만, 그녀가 진짜 '소라사키 히나'를 대체한 로봇이라는 것을 데카그라마톤은 이미 파악하고 있습니다. 데카그라마톤은 히나에 대한 감화를 시도할 수 있습니다. 만약 성공한다면, [GEH.GetNameDef] 측은 우리의 동맹으로 편입될 것입니다. 만약 실패한다면? 적대 관계가 유지될 뿐이니, 우리에게 해가 되는 일은 없을 것입니다."

