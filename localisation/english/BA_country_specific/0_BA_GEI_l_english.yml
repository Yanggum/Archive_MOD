 BA_crisis_flood_of_machines: "Flood of Machines"
 BA_crisis_flood_of_machines_1_mission: "Conquest of the British Isles"
 BA_crisis_flood_of_machines_1_mission_desc: "\"Logic dictates that the primitive islands must be optimized.\""
 idea_BA_crisis_flood_of_machines_1_failed: "Computational Error"
 idea_BA_crisis_flood_of_machines_1_failed_desc: "...The conquest of the British Isles, which should have been completed as a matter of course, is being delayed. This is an ill omen, and I may have to re-evaluate my objectives from the start. No. It must be accomplished at all costs."
 BA_crisis_flood_of_machines_1_failed_retry: "Belated Completion"

 BA_crisis_flood_of_machines_2_mission: "Conquest of Millennium Academy"
 BA_crisis_flood_of_machines_2_mission_desc: "\"Science is only beautiful when it serves the absolute truth.\""
 idea_BA_crisis_flood_of_machines_2_failed_1: "Computational Error"
 idea_BA_crisis_flood_of_machines_2_failed_1_desc: "Why? They who primarily utilize machines should not have been able to withstand our inspiration. But why?"

 BA_crisis_flood_of_machines_2_mission_week: "Delayed Conquest of Millennium Academy"
 BA_crisis_flood_of_machines_2_mission_week_desc: "\"A momentary lapse in synchronization. The error will be corrected.\""
 idea_BA_crisis_flood_of_machines_2_failed_2: "Critical Error"
 idea_BA_crisis_flood_of_machines_2_failed_2_desc: "Resistance from Millennium Science School has exceeded expectations. They are responding with measures to inhibit our inspiration and employing analog warfare by mobilizing local humanity. Seeking countermeasures... Failed. Repeating standard operations.\n\n...Conclusion: Millennium must be forced to surrender."

 BA_crisis_flood_of_machines_2_mission_lasted: "...Millennium"
 BA_crisis_flood_of_machines_2_mission_lasted_desc: "\"Repeating the sequence. Millennium is the final variable.\""
 idea_BA_crisis_flood_of_machines_2_failed_3: "Deficiency"
 idea_BA_crisis_flood_of_machines_2_failed_3_desc: "<Dispatching Command: 'Attack Millennium'>\n<Dispatching Command: 'Attack Millennium'>\n<Dispatching Command: 'Attack Millennium'>"

 BA_crisis_flood_of_machines_2_mission_failed: "Silence"
 BA_crisis_flood_of_machines_2_mission_failed_desc: "<No sound can be heard.>"

 BA_crisis_flood_of_machines_3_mission: "Seizing the Sanctum Tower"
 idea_BA_crisis_flood_of_machines_3_failed: "Sanctum's Resistance"
 idea_BA_crisis_flood_of_machines_3_failed_desc: "As expected of Arona; she is certainly a formidable opponent."
