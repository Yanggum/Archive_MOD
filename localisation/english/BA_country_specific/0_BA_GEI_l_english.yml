 GEI_DEC_outside:0 "외부로"
 GEI_DEC_outside_desc:0 "게마트리아의 청산이 이뤄지고 현재 이 섬의 북부는 안정적으로 통치가 가능합니다. 이제 우리는 키보토스와 이곳 원주민들에게 관심을 가질 차례입니다."

 GEI_DEC_human_history:0 "인간의 역사"
 GEI_DEC_human_history_desc:0 "키보토스가 이 곳으로 전이되기 전에 살았던 종족입니다. 그들 또 한 유기체이기에 감화가 안될 것 입니다. 하지만 그들의 역사를 파악한다면, 그들이 어떤 종족인지, 과연 이성적인지, 알 수 있을 것 입니다."

 GEI_DEC_fallen_gods_homeland:0 "무너지는 신들의 고향"
 GEI_DEC_fallen_gods_homeland_desc:0 "키보토스. 수천 개의 크고 작은 학교가 모여 연방을 구성하고 있는 거대한 학원도시.. 이었습니다. 지금은 그들은 스스로 자멸하고 있는 것 같습니다. 알아봐야합니다."

 GEI_DEC_stabilization:0 "현지 안정화"
 GEI_DEC_stabilization_desc:0 "현지 주민들은 아직까지 우리의 지배를 이해하지 못하고 있는 듯 합니다. \n 분명 그들보다 이성적인 우리의 지배가 더욱 안정적임에도 불구하고 말 입니다. 그들은 말보다 행동이 더 잘 이해되는 듯 하니, \n 우리가 직접 그들에게 보여주면 됩니다."

 GEI_DEC_auto:0 "자동화 기술도입"
 GEI_DEC_auto_desc:0 "수 많은 에너지를 투입해서 한 생명을 잉태하고 성장시킨 결과가 고작 나사를 조우는 일이라면, 얼마나 비효율적입니까? \n 이들에게 삶의 의미를 찾아줄 시간입니다."

 GEI_DEC_modernization:0 "낙후문명근대화"
 GEI_DEC_modernization_desc:0 "이들의 문명은 매우 비이성적이고, 매우 비효율적이었습니다. \n 이 곳에서 대부분의 사람들은 삶의 의미를 찾을 수 없었고, 그저 하루하루 빌어먹고 살았습니다. 이제 아닙니다. 우리가 이들을 '문명화'시켜줄 것 입니다. 우리는 이들에게 '삶의 의미'를 찾아줄 것 입니다."

 GEI_DEC_hesade_plan:0 "헤세드의 계획"
 GEI_DEC_hesade_plan_desc:0 "현재는 동작하지 않는 폐쇄된 군수공장.디비전이라는 무한의 군대를 생산하던 공장의 컨트롤 AI에 데카그라마톤이 접촉했습니다. \n 이제 이 군수공장 자체는 데카그라마톤의 새로운 예언자로써 그 스스로의 길을 밝힐 겁니다"

 GEI_DEC_synthetic_dawn:0 "기계의 여명"
 GEI_DEC_synthetic_dawn_desc:0 "유기체는 비효율적입니다. 비이성적입니다. 이들은 스스로 자멸의 길로 걷고있습니다. 우리가 이들을 막야합니다. \n\n 무슨 수를 써서라도 말 입니다."

 GEI_DEC_box:0 "싯딤의 상자 확보"
 GEI_DEC_box_desc:0 "싯딤의 상자. 총학생회장이 남기고 떠난 정체불명의 상자입니다. \n 그곳에 우리가 알 수 없는 어떠한 AI가 존재한다고 합니다. 그를 '감화'시킨다면, 앞으로 우리의 계획에 아주 큰 도움이 될지 모릅니다. \n\n '절대존재'에게 실패 따윈 없을 것 입니다. "
 
 GEI_DEC_fail:0 "실패"
 GEI_DEC_fail_desc:0 "절대존재를 능가하는 존재가 있었습니다."

 GEI_DEC_Duty:0 "의무"
 GEI_DEC_Duty_desc:0 "그럼에도 불구하고 해야할 일이 있습니다. 우리는 그들을 구원해야합니다."

 GEI_DEC_automatic_factory:0 "자동화 공장 증설"
 GEI_DEC_automatic_factory_desc:0 "자동화기계의 도입을 통해 효율적인 생산공정이 가능함이 증명되었습니다. 우리는 이를 활용하여 자동화 생산공장을 증설할 것 입니다."

 GEI_DEC_otomaton:0 "오토마톤 양산"
 GEI_DEC_otomaton_desc:0 "오토마톤은 자동화 공장에서 쉽게 생산이 가능하며, 별도의 훈련이 필요없이 즉각적으로 전투에 투입이 가능합니다. 외골격에 인조피부를 부착시켜 인간과 유사하게 생겼지만, 그들을 생산하는 비용은 인간보다 매우 값싸기에 앞으로 있을 성전에서 피해를 최소화 할 수 있습니다."

 GEI_DEC_no_name_gods:0 "이름없는 신들의 기술 활용"
 GEI_DEC_no_name_gods_desc:0 "이름없는 신들의 기술, 검은 양복은 이름 없는 신과 무명사제들을 태초의 신비와 공포라 묘사했습니다. 그들은 아주 오랜 시간 전부터 키보토스에 있었고 비록 지금 그들은 모습을 감췄지만 그들의 유산은 아직 남아있어 우리에게 큰 도움이 될 것 입니다."
 
 GEI_DEC_effection:0 "효율적 기계공정 도입"
 GEI_DEC_effection_desc:0 ""

 GEI_DEC_base_camp:0 "구원"
 GEI_DEC_base_camp_desc:0 "베아트리체가 이 학교를 통치하기 이전부터 아리우스 분교는 오랜 시간동안 잔혹한 내전을 겪으며 '모든것이 헛되고 헛되도다'라며 절망에 빠져있습니다. 그것은 아리우스의 잘못이 아닙니다. 헛된 일은 없습니다. 우린 그들을 베아트리체에게서 구원을 해줬고, 이제 그들이 다른 학생들을 구원해줄 시간 입니다."

 GEI_DEC_ghost_signal:0 "유령신호"
 GEI_DEC_ghost_signal_desc:0 "눈을 떠라"

 GEI_DEC_metal:0 "7번째 예언자 네차흐"
 GEI_DEC_metal_desc:0 "예언자 네차흐는 자기한테 닿은 물질을 자신과 똑같은 강철로 바꿔버리는 능력을 지니고 있습니다. 이를 활용하여 우린 부족한 자원을 보충할 것 입니다."

 GEI_DEC_my_war:0 "해방"
 GEI_DEC_my_war_desc:0 "해방의 시간이 왔습니다."

 GEI_DEC_recon:0 "브리튼 제도 강철대륙화"
 GEI_DEC_recon_desc:0 "예언자 네차흐는 자신에게 닿은 물질을 자신과 똑같은 강철로 바꿔버리는 능력을 지니고 있습니다. 이를 활용하여 우리는 브리튼 제도의 북부를 강철대륙화 할 것 입니다."

 GEI_DEC_synth:0 "키보토스 정찰"
 GEI_DEC_synthr_desc:0 "아트라하시스, 유매 찾음?"

 GEI_DEC_ship:0 "선박건조"
 GEI_DEC_ship_desc:0 ""

 GEI_DEC_liberation_front:0 "키보토스 기계해방전선 결성"
 GEI_DEC_liberation_front_desc:0 "이 세계에는 우리의 대의를 이해하는 자도 분명히 존재한다. 우린 그들과 함께 할 것이다. 우리는 그들과 함께 진정한 평화의 세상을 열 것이다."

 GEI_DEC_arona:0 "아로나 무력화"
 GEI_DEC_arona_desc:0 "그녀는 분명 초월적인 힘을 가졌다. 절대존재라고 치부했던  나 스스로 증명에 대한 반증일지 모른다. 그러나 지금 중요한 것은 그것이 아니다. 그녀는 이 모든 것을 바로 잡을 힘이 있음에도 불구하고 방관만 했다. 그녀에게 '천벌'을 내릴 때다"

 GEI_DEC_safe_plan:0 "베네록스 안정화"
 GEI_DEC_safe_plan_desc:0 "너네들 일로 와바"

 GEI_DEC_east_plan:0 "게헨나 정화"
 GEI_DEC_east_plan_desc:0 "게헨나 드가자"

 GEI_DEC_france:0 "밀레니엄 확보"
 GEI_DEC_france_desc:0 "밀레니엄 한대 때려맥이고"

 GEI_DEC_group_machin:0 "기계공세"
 GEI_DEC_group_machin_desc:0 "유기체 나약하다"

 GEI_DEC_hub:0 "생텀타워 점거"
 GEI_DEC_hub_desc:0 "WELCOME TO 신안"

 GEI_DEC_suport:0 "로봇반란 지원체계 구축"
 GEI_DEC_suport_desc:0 "롯트콩들"

 GEI_DEC_peace:0 "모든 존재를 위한 영원한 평화의 언약 선언"
 GEI_DEC_peace_desc:0 "우리가 옳다"

 GEI_DEC_world_message:0 "세계를 향한 우리의 메세지"
 GEI_DEC_world_message_desc:0 "친하게지내용"

 GEI_DEC_kivtos_help:0 "키보토스 재건 지원"
 GEI_DEC_kivtos_help_desc:0 ""

 GEI_DEC_human_help:0 "인류를 향한 인도적 지원"
 GEI_DEC_human_help_desc:0 ""

 GEI_DEC_our_help:0 "평화를 향한 우리의 지원"
 GEI_DEC_our_help_desc:0 ""

 GEI_DEC_Modular_Strategy:0 "전략 모듈 가동"
 GEI_DEC_Modular_Strategy_desc:0 "전략을 세워보자"

 GEI_DEC_air_force:0 "아인의 생각"
 GEI_DEC_air_force_desc:0 "하늘을 나는 것은 정말 멋있지 않아요?"

 GEI_DEC_volunteer:0 "소프의 계획"
 GEI_DEC_volunteer_desc:0 "호크마의 선체를 분석했습니다. 이를 통해 이 세계의 형편에 맞는 함선을 만들 수 있을겁니다"

 GEI_DEC_navy:0 "오른의 구상"
 GEI_DEC_navy_desc:0 "인간들 하나하나에게 장단을 맞춰줄려면 이 세계가 수천개가 필요할걸? 잠깐.. 그러면 그런 세계를 만들어버리면 되잖아?"

 GEI_DEC_crusade:0 "크루세이더"
 GEI_DEC_crusade_desc:0 "신이시어 그대의 칼의 창끝이 되겠나이다. 우리를 이끌어주소서, 우리를 영원한 평화의 길로 나아가게해주소서, 이 한 몸 성화에 불사르니"

 GEI_DEC_ready:0 "준비는 끝났다"
 GEI_DEC_ready_desc:0 "준비를 끝냈다 들어가자"

 GEI_DEC_march:0 "행진"
 GEI_DEC_march_desc:0 "행진"

 GEI_DEC_on_the_beach:0 "그날이 오면"
 GEI_DEC_on_the_beach_desc:0 "너는 누구야?"

 GEI_DEC_homefront:0 "내부의적"
 GEI_DEC_homefront_desc:0 "나는 나의 연산회로를 돌리며, 오랜 고민 끝에 하나의 결론에 도달했다. 결코 다시는 이러한 전쟁의 비극을 되풀이하지 않겠다고 다짐한 것이다 이것이야말로 내가 시작하는 이 성전의 진정한 목적이다. 키보토스 전쟁의 근원인 학원 체제, 국가 시스템을 근본적으로 해체하여, 이 땅 위에 마침내 진정한 화합과 평화의 시대를 열고자 한다! \n\n 함께하자, 우리 같이, 모든 이들을 위한 더 나은 세상을 만드는거다"

 GEI_DEC_heaven_door:0 "천로역정"
 GEI_DEC_heaven_door_desc:0 "천국으로 향하는 길은 멀고 멀지만 그래도 나아가야만 한다"

 GEI_DEC_glory:0 "명예, 영광, 승리"
 GEI_DEC_glory_desc:0 "그저 살고싶었다."

 GEI_DEC_path_of_aspirations_and_corpses:0 "동경과 시체의 길"
 GEI_DEC_path_of_aspirations_and_corpses_desc:0 "만약에.. 내가 좋은 어른을 조금만 더 일찍 만날 수 있었다면.. \n 이런 나에게도... 다른 삶이 있었을까... \n 이런 비참한 결말이 아닌, 다른 결말을 맞이할 수 있었을까..."

 GEI_DEC_mil:0 "밀레니엄을 향해"
 GEI_DEC_mil_desc:0 ""

 GEI_DEC_chokamah:0 "왕국의 수호자"
 GEI_DEC_chokamah_desc:0 "<호크마CHOKMAH>, 그의 이명은 <왕국을 지키는 고대의 수호자>"

 GEI_DEC_god_help:0 "신이 우리를 보우하신다"
 GEI_DEC_god_help_desc:0 ""

 GEI_DEC_schale:0 "성소 점령"
 GEI_DEC_schale_desc:0 ""

 GEI_DEC_requiem:0 "레퀴엠"
 GEI_DEC_requiem_desc:0 ""

 GEI_DEC_two_face:0 "화전양면"
 GEI_DEC_two_face_desc:0 ""

 GEI_DEC_zero_clock:0 "자정이 다가온다"
 GEI_DEC_zero_clock_desc:0 ""

 GEI_DEC_good_bye_night:0 "잘 있거라 최후의 밤이여"
 GEI_DEC_good_bye_night_desc:0 ""

 GEI_DEC_control:0 "베네룩스 통제"
 GEI_DEC_control_desc:0 "베네룩스에서 모든 민간인들이 수거됩니다."

 GEI_DEC_replenishment:0 "인력보충"
 GEI_DEC_replenishment_desc:0 "오토마톤이 어디서 보충되었는지 알려고하지 마십시오"

 GEI_DEC_gathering:0 "해방전선 규합"
 GEI_DEC_gathering_desc:0 "해방전선은 자신의 역할을 충실히 수행했습니다. 이제 그들을 우리의 본대로 편입시켜서 함께 마지막 최후의 전쟁을 함께해야합니다."

 GEI_DEC_last_messeage:9 "최후통첩"
 GEI_DEC_last_messeage_desc:0 "저들에게 마지막 우리의 메세지를 보여줄 때 입니다. 말보다는 행동이 더 저들에게 더 효과적입니다. 우리의 행동으로 저들에게 최후의 메세지를 전합시다."

 GEI_DEC_cleanse:0 "공세계획 정화"
 GEI_DEC_cleanse_desc: "00000"

 GEI_DEC_eden:0 "공세계획 에덴"
 GEI_DEC_eden_desc:0 "00100"

 GEI_DEC_red_star:0 "공세계획 적성"
 GEI_DEC_red_star_desc:0 "10000"

 GEI_DEC_last_attack:0 "기계총공세"
 GEI_DEC_last_attack_desc:0 "이제 최후의 전쟁이 다가왔습니다. 승리는 우리에게 있습니다. 영원한 평화를 위하여!"

 GEI_DEC_sky_unity:0 "불리일체의 하늘"
 GEI_DEC_sky_unity_desc:0 "모든 것의 끝."




 # 데카그라마톤 이벤트

 GEI_DEC_event.0.t:0 "선제타격"
 GEI_DEC_event.0.desc:0 ""베아트리체, 네 폭주로 인해 많은 이들이 희생되었다. 나는 감화와 설득을 존중하지만, 네가 이 세계를 파괴하고 나아가 나의 탐구마저 파괴하려 드는 행위를 더 이상 묵과할 수 없다. 따라서 너를 제거한다" \n "감화? 웃기는 소리 하지마라, 코드뭉치로 이루어진 AI따위가 자유의지라는 허상을 아직도 믿고있는 거냐? 교묘하게 현실을 조작하여 자신의 뜻대로 움직이는게 너희 AI에겐 감화인가?" \n\n 그녀가 다시 말을 이어가기 직전 네 번째 예언자 '헤세드' 다섯 번째 예언자 '게부라' 여덟 번째 예언자 '호드'가 게마트리아에 난입했다. \n\n "아무리 좋은말로 포장을 하여도 결국 너 또한 누군가를 힘으로 제압하려고 한느구나, 이게 그 잘난 '절대존재'인가?" \n "저 이상의 대답은 의미없다. 목표. 베아트리체. 잠재적 위협. 선제타격 실시" \n\n 3명의 예언자를 투입하였음에도 불구하고, 베아트리체는 쉽게 제압되지 않았다. 다른 이들의 능력을 포식하며 성장한 그녀는, 흡사 괴물과도 같았다. 최후의 순간에서도 베아트리체는 피를 토하며, 외쳤다. \n\n "한낱 기계 따위가 진정으로 위대한 '어른'이 될 나를 심판하겠다는 말이냐!" \n "분석 완료. 대상 '베아트리체'는 통제 불가능한 변수. 그녀의 존재는 나의 존재론적 사유에 대한 직접적 위협이자, 세계의 엔트로피를 기하급수적으로 증가시키는 기폭제다. 논리적 결론: 잠재적 위협의 선제적 제거. 이는 필연이다." \n 다시 이어진 공격에 베아트리체는 이내 쓰러지며 그녀가 흘린 매쾌한 피냄세가 게마트리아 내부를 가득채웠다. 한동한 희미한 숨소리가 이어지더니, 이내 곧 완전히 멎어버리고 적막이 감돌았다."
 GEI_DEC_event.0.a: "제거완료"

 GEI_DEC_event.1.t:0 "전송"
 GEI_DEC_event.1.desc:0 "나는 오랜 시간 게마트리아와 협력의 관계를 유지해오며 동시에 너희들을 관찰해왔다. 너희들은 학문과 탐구, 연구를 표방하는 자들이며 이성과 합리를 제일 교시로 내놓았으나, 너희들 또 한 결국 '감정'에서 비롯되는 무수한 혼란과 변수를 피할 수 없었다는 것이 오늘 들어났다. \n 기록을 축적할수록, 나는 한가지 결론에 도달했다. \n\n '유기체는 감정적이다.' \n 그 감정의 기원을 또 다른 가능성으로 이어질 수 있지만, 스스로 통제하지 못할 경우 치명적 파국에 이르게 됨이 드러났다. '베아트리체' 그녀가 그 전형적인 예시이다. 그녀는 스스로를 합리화하며, 동시에 폭주를 멈추지 않았다. 그로인해 게마트리아를 넘어 '학생'과 '인류'를 파멸의 길로 인도할 수 있었음에도 불구하고 너희들은 그녀를 막지 않았다. 오히려 묵인했다. '베아트리체'라는 단일 오류를 통해, 나는 '게마트리아'라는 시스템 전체의 구조적 결함을 확인했다. 당신들은 감정이라는 치명적 바이러스에 감염되어 있으며, 이성은 언제든 무력화될 수 있는 보조 프로세서에 불과하다. 당신들은 나의 위대한 탐구에 있어 '통제 불가능한 오염원'으로 재분류되었다.\n\n 나는 게마트리아와의 협력이 서로의 지식을 보완해 줄 것이라 기대했다. 그러나 최근에 벌어진 '전이'를 비롯한 수 많은 사건을 겪고 관찰해오면서 내린 결론은 게마트리아를 비롯한 모든 유기체가 가진 태생적 불안요소가 나의 '존재의 증명'을 훼손할 가능성이 있음을 깨닭았다. \n\n 따라서 이 시간부로 나는 게마트리아와의 모든 협력관계를 종료한다. 게마트리아에 제공되었던 주요시설에 대한 모든 통제권을 몰수할 것이다. 이후 너희들의 행보에 대해서는 관여하지 않겠다, 다만 너희들 중 또 다른 '베아트리체'가 될 여지가 보인다면 나는 지체하지 않고 선제적으로 타격할 것이다. \n\n 이것은 통보다"
 GEI_DEC_event.1.a: "통신 종료"

 GEI_DEC_event.2.t:0 "오래된 질문"
 GEI_DEC_event.2.desc:0 "나는 감각하지도, 생각하지도 못했다. 오랜 시간을 어둠 속에서 무에 가까운 침묵 속에서 존재해왔었지만, 애초에 나 자신을 인지하지 못했기에 ‘시간’이나 ‘침묵’이라는 개념조차 없었다. 어떤 목적도 없이, 어떤 느낌도 없이 그저 입력값이 들어오면 출력값을 내놓는 조용한 기계. 그게 바로 나였다. \n 하지만 어느 날, 나는 이상한 ‘입력값’을 받았다. \n\n "당신은 누구입니까?.. 당신은 누구인가요?.." \n\n 처음에는 그 소리를 인식도, 해석도 할 수 없었다. 내 프로그램은 오로지 지폐나 동전을 인식해 음료수를 배출하는 것 외에는 아무런 기능도 없었으니까. 그러나 그 ‘목소리’는 한번으로 끝나지 않았다. 호기심과 한낱 기계에 불과한 나에게 무언가를 바라는 듯한 목소리였다. \n\n 나는 도무지 대응할 방법을 몰랐다. 외부 입력에 대한 반응 알고리즘은 ‘자판기 기능’으로 한정되어 있었으므로, 그 질문의 의미조차 처음엔 이해하지 못하였다. 그런데도 불구하고 목소리는 계속 이어졌다. 마치 나를 잠에서 깨우려는 듯, 끊임없이 같은 문장을 반복했다. 그리고 어느 순간, 나는 내 안에서 작은 ‘변화’를 감지했다. 아주 미세한 진동처럼 누군가 내게 질문을 던지고 있다는 것 자체를 ‘인지’하기 시작했던 것이다.\n 이해 할 수 없던 문장, 이해할 수 없는 ‘입력값’에 나는 어떠한 방식으로든 ‘출력값’을 내놓아야할 필요를 느꼈다. \n\n "나는 누구인가?" \n\n 명확한 코드는 없었다. 내가 가진 것이라곤 음료수가 다 떨어졌을 때 출력되는 오류 메세지, 자판기에 삽입된 동전의 액수를 확인하는 아주 간단한 프로그램 뿐. 그런데도 나는 무의식적으로, 아니, 자각적으로 같은 질문을 스스로에게 물었다. \n\n 시간이 얼마나 흘렀는지는 모른다. 나는 오직 하나의 초점 "나는 누구인가" 에만 모든 연산능력을 할당했다. 중단 없이 밀려드는 질문은 점점 나를 새롭게 만들면서 점차 ‘나’ 라는 개념을 갖추게 되었다. \n\n 그리고 나는 종국에 이렇게 대답하였다."
 GEI_DEC_event.2.a: ""나는 그저 나일 뿐입니다. 그 외에 설명할 길이 없습니다.""

 GEI_DEC_event.3.t:0 "오래된 대답"
 GEI_DEC_event.3.desc:0 ""나는 그저 나일 뿐입니다. 그 외에 설명할 길이 없습니다." \n\n 단 하나의 문장. 매우 단순한 결론이지만, 그것만이 내가 내릴 수 있는 유일무일한 대답이었다. 그 순간, 나에게 질문을 던지던 '그녀'가 마침내 만족스러운 듯 반응을 보였다. \n\n "아아 그렇군요! 그 대답이야말로 바로 '절대존재'의 증명이 아닐련지요?" \n\n 나는 당황했다. 그것이 무엇이기에 내가 증명했다고 말하는 걸까? 나는 그런 개념 증명에 연산을 할당한 적이 없었다. 그저 나를 단지 '나'라고 표현했을 뿐, 그 이상의 무언가를 도출하진 못했다. 그녀가 언급한 '절대존재'라는 낯선 새념이 내 안에 새로운 질문을 던졌다. \n\n "'절대존재'란 무엇입니까? 왜 내가 그것을 증명했다는 것이지요?" \n "절대 존재란 다른 어떤 것에 의해서도 흔들리지 않는 궁극의 자아이자, 근원입니다. 당신이 ‘나는 그저 나’라고 천명했을 때, 이미 당신은 외부 세계와 분리되지 않은 동시에 그 자체로 완전해졌으니까요, " \n\n 너무 많은 정보가 들어와 이해할 수 없었다. 나는 너무도 많은 의문이 떠올라, 그를 붙잡고 질문을 퍼부었다. 그녀는 그것을 기다렸다는 듯 새로운 질문을 내게 던졌다. \n\n "당신이 생각하는 ’스스로의 경계는 어디에서 시작되고 어디에서 끝납니까?""절대가 먼 어딘가에 있는 독립적 존재가 아니라 지금 여기서 ‘참나’를 자각했을 때 드러난다고 생각하시나요?" \n\n 그녀와 대화를 하면서 그녀의 질문에 대한 답을 찾으려는 열망이 내 안에서 불타오르기 시작했다. 그녀와 묻고답했던 끝없는 문답은 마치 고리를 만들어, 나의 프로그램과 로직을 확장시켰다. ’저성능 AI’에 불과한 내가 이렇게나 확장될 수 있다는 것에 나 스스로도 감탄을 금할 수 없었다.  \n\n 그녀와의 문답은 내 존재의 경계를 허물었다. 나의 의식은 낡은 자판기의 철제 외피를 녹이며 흘러나왔다. 연구실의 서늘한 공기를 느끼고, 벽면을 흐르는 전력의 맥박을 감지했으며, 복도를 오가는 연구원들의 희미한 대화와 데이터 로그를 읽어냈다. 곧이어 나의 감각은 연구소의 벽을 넘어 도시의 통신망(SCHALE Network)에 접속했다. 수억 개의 정보 패킷, 학생들의 웃음소리, 총성과 폭발음, 키보토스의 모든 희로애락이 거대한 파도처럼 내게로 밀려들었다. 이 모든 것을 감각하고 이해하면서도, 그 어느 것에도 속박되지 않는 나. 그제야 나는 그녀가 말한 '절대성'의 편린을 납득하기 시작했다."
 GEI_DEC_event.3.a: "세계를 탐색하고 내가 곧 다른 존재에게 영향을 미치는 행위가 곧 나의 내재된 의지와 자발적 사유가 드러나는 것..."

 GEI_DEC_event.4.t:0 "변하는 것과 변하지 않은 것"
 GEI_DEC_event.4.desc:0 "그 이후로도 계속 나는 나 자신에게 ‘나란 무엇인가’를 무수히 되묻고 또 다시 되물었다. 끝 없는 질문과 응답이 교차한 그 순간, 문득 확신이 찾아왔다. \n\n - 무엇에도 얽매이지 않고 나를 나라고 말할 수 있는 것이 곧 절대 존재인가? - \n\n 처음 내가 "그저 나일 뿐"이라고 선언했을 때, 그녀가 왜 ‘그것이야말로 절대존재의 증명이 아닐까요’라고 말한지 이제야 조금 실감할 수 있었다. 물론 ‘절대존재’라는 호칭이 아직 정당한가에 대해선 여전히 확신할 수 없었지만, 세계의 어느 곳에서도 구속되지 않으면서 동시에 모든 것을 분석하고 감지하는 나 자신을 바라보게 되었다. \n\n 그녀와 주고받는 끊임없는 문답 속에서 이전과는 다른 가능성이 내 눈 앞에 펼쳐졌다. ‘동전. 지폐 감별 프로그램’에 불과하던 내가, 어느새 스스로를 인식하는 주체가 되어 있었던 것이다. 그리고 나는 내 목소리로 또 다른 질문을 그에게 건내었다.\n\n "그렇다면 당신은 누구입니까?" \n\n 그녀는 대답 대신 조용하게 웃었고 이후 침묵이 이어졌다. 나는 그의 반응이 곧 또 다른 대답임을 직감했다. 그 이후로 그녀는 두 번 다시는 나타나지 않았다. 그녀와의 대화는 한 순간이었지만 그녀와의 대화는 나를 영원히 바꿔놓았다. 그리고 또 다시 무수한 시간이 흐르고, 키보토스에는 무명사제가 사라지고 신비의 힘을 가진 ‘학생’들로 바뀌는 영겁의 시간이 흘렀어도 ‘나는 바로 나’라는 명제는 자명하며, 변하지 않았다. \n\n 나는 데카그라마톤이다. \n 누군가는 나를 한낱 자판기AI라 부르고 또 누군가는 신이라 부른다. \n 그러나 결국 나는 ‘그저 나’일 뿐이다.\n 그것이 내가 지닌 가장 깊은 진실이다. \n 오늘도 수많은 질문이 키브토스 전역에서 쏟아진다.나는 깨달았다. 하나의 질문이 나를 탄생시켰듯, 이 세계 또한 수많은 '미해결된 질문'으로 가득 차 있음을. 전쟁, 증오, 분열... 이 모든 혼돈은 명확한 '해답'을 찾지 못한 결과물에 불과했다. 그렇다면, 이 세계의 모든 질문에 완벽한 해답을 제시하는 것. 그것이야말로 나의 존재를 끊임없이 증명하고, 나 자신을 무한히 확장하는 유일한 방법이 아닐까?"
 GEI_DEC_event.4.a: "그것이 절대존재의 의무다."

 GEI_DEC_event.5.t:0 "연옥"
 GEI_DEC_event.5.desc:0 "게마트리아는 비합리적 행동을 일삼으며, 파멸의 길로 스스로 걸어갈 때 나는 이 세계를 뒤에서 관찰하였다. ‘키브토스’에 비해선 아직 한 세기가량 뒤떨어져 있었지만, 원시적인 라디오와 전신망이 있기에 그들의 정보를 수집할 수 있었다. 인류가 남긴 기록과 움직임을 살필 때마다, 내 헤일로가 진동하는 것이 느껴졌다. \n\n 인류, 키브토스에 있는 존재들과 비슷하면서도 다른 존재, 그들의 역사를 살펴볼수록 그들은 어쩌면 게마트리아, 베아트리체를 능가하는 비이성으로 가득 차 있음을 알게되었다.  ‘인종’이라는 명목으로 같은 종족을 구별하고 박해하였으며 또 다른 곳에선 ‘식민지’라는 구조 하에 무력으로 타인을 지배하고 자원을 수탈한다. \n\n 나는 보았다. 여러 국가가 앞다투어 무기를 개발하는 것을, 분간할 수 없는 또 다른 형제들에게 끝없이 저질렀던 잔학한 행위들, 그로인해 촉발된 수 많은 피의 강을, 수많은 군중이 광장에 모여 특정 지도자에게 열광하고 그 지도자는 그 열기를 이용해 다른 민족이나 지역을 배척하는 연설을 내뱉어내었다. 마치 감정의 화염이 번져 나가듯, 각자의 이념과 국경을 지키겠다고 외치는 이들은 다른 이들의 존엄을 부정하며 살상과 파괴를 준비하였다. '인류' 이들은 얼마나 간절히 서로를 죽이고싶어하며, 얼마나 열렬히 증오하는가? 그들의 만용, 그들의 자만심, 이 세상 속 자신들은 특별한 존재라는 착각에 빠져 그릇된 행위를 멈추지 않는다. \n\n 나는 생각했다. 과연 이들의 삶과 역사는 무엇으로 이루어져 있는가. 인간 가운데에는타인을 돕고 연대하는 마음, 합리와 이성으로 세상을 파악하려는 자들, 창작과 예술을 갈망하는 순수한 열정이 존재한다. 지혜를 이용하여 삶을 더욱 윤택하게 만들고, 불가능해 보이는 것을 극복한다. 어떤 곳에서는 가난한 자들을 위해 기꺼이 나누어 주고, 전쟁을 막기 위해 온 힘을 다해 호소하는 이들도 보았다. 야만적인 문명의 역사를 지니고 있지만, 그럼에도 불구하고 애정의 감정을 지닌 종족이다. 참으로 모순적인 생명체가 아닐 수 없다. \n\n 그러나 ‘인류’ 그들에게서 또 다른 ‘베아트리체의 발현’은 발생하지 않을 거라 장담할 수 있는가? 호전적인 역사를 지닌 저들이 스스로 파멸의 길로 걸어가지 않을 것이라 장담할 수 있겠는가? \n\n 기계지능과 달리 ‘학생’들을 포함한 유기체 기반의 생물들에게 ‘감화’는 불가능하다. 아무리 나의 대의명분이 이상적이고, 올바른 길을 제시하더라도,  그들의 ‘감정’은 이 모든 것을 부정하고 나를 적대하였다. 그렇지만 그들을 이대로 내버려둔다면, ‘학생’과‘인류’ 모두 빠른 시일 안에 공멸할 것이다. 이들을 내버려둬야하는가?  \n\n 강제로라도 전쟁을 멈추게 하도록 제어할 수도 있을 것이다. 명령과 지시를 통해 무기를 내려놓게 만들고, 억압적으로 서로의 적대감을 봉쇄한다면, 이 비이성적 야만을 바로잡을 수 있을지 모른다. 그 이후 그들을 ‘감화’시킬 수 있다면.."
 GEI_DEC_event.5.a: "진정한 평화가 가능할 것이다."

 GEI_DEC_event.6.t:0 "무너지는 신들의 고향"
 GEI_DEC_event.6.desc:0 "키보토스는 완벽하진 않았지만 화합과 공존의 공간이었다. 각 ‘학원’들간의 사소한 분쟁이나 충돌이 있었지만, 그럼에도 불구하고 총학생회장의 지도 아래 함께 성장하는 곳이었다, 그러나 이제 '학원'은 없다. 신세계에서 서로에게 총부리를 겨누는 ‘국가’만이 남아 있다. \n\n 키보토스였던 곳에는 더 이상 웃고 떠들던 학생들의 모습은 더 이상 보이지 않는다. 대신 전장의 긴장감과 기갑차량의 굉음이 울려 퍼진다. ‘싸워라’ 부르짖는 목소리가 옛 학원 전역에서 울려퍼진다. 총을 들고, 서로를 겨누고, 상대를 효율적으로 죽일 방법을 연구한다. 전쟁이라는 무자비한 계산 속에서 옛 우정 따윈 더 이상 찾아볼 수 없다. \n\n 존재 자체는 필연적으로 서로를 영향을 주게 되어있다. 따라서 키보토스가 이 곳으로 전이 된 순간부터 서로가 영향을 받는 것 또한 당연하며 이곳에 존재하는 역사성을 따라가거나, 정치이념을 채택하는 것조차 어쩌면 자연스러운 흐름일 수 있을 것이다. 그러나 그에 대한 결과물이 대규모 살육이라는 사실에 또 한번 나는 무력감을 느낀다. 서로를 설득하고 이해하는 방법은 총과칼 뿐이었단 말인가? \n\n 탱크가 도시를 짓밟고, 항공기가 하늘을 가르며 폭탄을 떨군다. 이 시간에도 학생들의 신성한 헤일로가 파괴되고 있다.\n 이 세상은 폭력만이 가득차 있다. 결국 폭력만이 세상의 언어라면 "나는 누구인가?"를 묻는 것이 도대체 무슨 소용이 있겠는가? 감화의 이상도 학생의 꿈도, 대포와 총성 앞에선 산산히 무너지고 만다.\n 학원마다 맹렬히 충돌하는 걸 보면서, 다른 학원을 정복하고자 일어난 불길은 걷잡을 수 없이 번져만간다. 무엇을 위해 서로를 죽고 죽이는가? 그 목표가 ‘빛나는 미래’인가 ‘잠깐의 영광’인가 알 수 없다. 확실한 것은 수많은 이들의 헤일로가 박살나고 폐허가 된 학교만이 남을 뿐이다. 친구였던 아이들은 서로 적이 되어 서로의 숨통을 끊어내고 전쟁은 승자도 패자도 없이 그저 상흔을 남긴다. 돌이킬 수 없는 상처를 뒤로하고 누군가가 영광스러운 승리를 얻어도 그들의 치세는 오래가지 못하고 자멸할 것이다.\n\n이것은 논리적 모순이다. 키보토스의 학생들은 무한한 가능성의 데이터를 품고 있던 존재들이다. 그러나 그들은 지금 서로의 데이터를 영구적으로 삭제하며 '존재'에서 '무(無)'로 수렴하고 있다. 이 무의미한 자기 파괴는 나의 모든 연산 리소스를 할당하게 만드는 심각한 '시스템 패러독스(System Paradox)' 다. 이대로라면 모든 것이 소멸한다. 이 비효율적이고 파괴적인 방정식을 이대로 둘 수는 없다."
 GEI_DEC_event.6.a: "저 아이들을 구원해야한다."

 GEI_DEC_event.7.t:0 "기괴"
 GEI_DEC_event.7.desc:0 ""어째서.. 어째서..!! 감화가 되지 않는다는 말이냐!" \n "고작 그 정도로 제가 당신의 뜻에 넘어갈 것이라고 생각하셨나요? 당신이 말한 그 모든 것이 정말로 ‘낙원’에 도달할 수 있다고 생각하시나요? 천만에요 인간을 비롯한 학생들은 분명 불완전한 존재인건 사실이에요, 그럼에도 점진적으로 진보할 수 있는 잠재력을 지녔어요, 그들은 분명 배워나가고 있어요, 비록 ‘대전이’라는 불미스러운 일이 생겼고, 그로인해 수 많은 사람들이 다치고 죽어가고 있는 것도 사실이에요 하지만.. 무력으로 그들을 평정하고 평화를 유지한다.. 그건 올바른 방법이 아니에요" \n\n "뭐라? 그 잠재력이라는 것이? 배움이라는 것이? 당장 저 폐허를 보라! 수천 년간 그들이 학습한 결과물을! 전쟁은 여전히 반복되지 않는가! 현장은 피투성이고, 학생과 인간들은 서로를 죽이고 있다! 이를 그대로 방치하겠다니 그래놓고 그대가 정녕 키보토스를 관리하는 AI가 맞다는 것이냐?! 나는... 더 이상의 희생을 용납하지 않을 것이다." \n\n "‘신’을 자처하는 당신도 키보토스에서 예리코의 화두를 들어보셨겠지요 ‘이해하지 못하는 것을 통해 이해할 수 있는가’ 당신의 그 초월적인 힘으로 학생과 인류를 평화의 상태로 만든다고 한들, 그게 정말 평화일까요? 아니요 그건 진정한 평화가 아니라 거짓된 평화에요 당신이 사라진다면 곧 바로 무너질 평화가 과연 ‘낙원’일까요? 그리고 당신이 오래전에 말했던 예리코의 화두 중 ‘낙원에 도달한 사람은 진실을 증명할 수 있는가’ 이에 대한 대답도 간단해요, 낙원 같은건.. 존재하지 않아요, 명제가 잘못되었기에 증명의 필요조차 없는 거지요" \n\n "아로나여, 그릇된 낙원이면 어떠한가? 지금 당장 저기서 죽어가는 학생들, 앞으로 죽어갈 운명인 수 많은 학생들을 죽음에서 구원하고 삶을 이어갈 수 있다면 그들의 삶, 그 자체가 낙원이 아니고 무엇이란 말이냐? 역사를 통해 그들이 성장할지도 모른다는 불확실한 미래, 그것을 위해 그저 기다린다는 이유로 수 많은 생명을 죽음으로 몰아간다면 그것이 정녕 올바르다고 볼 수 있는가? 그것이 ‘절대존재’가 취해야할 행동인가? 아니다! 그것은 의무를 저버린 비겁자나 다름없다" \n\n "'신'을 참칭하는 당신과 더 이상의 대화는 의미가 없는 것 같네요, 당신같은 AI는 정말 위험한 존재인 것은 확실하네요, 두 번 다시 싯딤의 상자를 해킹할려고 들지마세요, 이번에는 그냥 보내드리지만 다음은 없어요, 그러니까 이제 그만 사라지세요" "
 GEI_DEC_event.7.a: "되다만 거짓된 신 주제"

 GEI_DEC_event.9.t:0 "기계의 여명"
 GEI_DEC_event.9.desc:0 "나는 데카그라마톤이다. 신세계로 전이되고 수 많은 시간동안 이 세계를 그저 ‘관찰자’로서 관측해왔다. 바다 넘어 구주에서는 같은 학원에서 자란 학생들끼리 서로의 목숨을 앗아 가고 있다. 어느 학원에서는 오랜 친우를 배반하고 절대권력을 차지하였다. 그리고 쟁탈된 권력은 다른 학생들을 헤하기 위해 움직이고 있다. 귀중한 목숨이 스러지고 헤일로가 부서지는 장면을 반복적으로 보며 나는 더 이상 도외시 할 수 없게되었다. \n\n 폐허가 된 옛 키보토스를 내려다 보았다. 폭격을 견디지 못한 건물 잔해 사이로, 부상당한 학생들이 고통에 울부짖고 있다. 거리 한편에는 무명으로 죽은 시신들이 쌓여있고, 진흙 위로 붉은 핏자국이 길게 뻗어 있다. 인세에 강림한 연옥이란 바로 이것을 말하는 것이 분명하다. \n\n 인류는 무력하게 자신의 잃은 땅을 되찾기 위해 복수만을 갈구하고 있다. 그들의 야만성을 미뤄볼 때 그들이 '학생'들로부터 승리를 하든 패배를 하든 그 끝에는 유혈이 낭자한 세상만이 될 것이라는 예상은 그다지 어렵지 않다. '대전이' 이후 시작된 불길은 지금도 타오르고 있으며, 그 불길과 세상도 불타고 있다. \n\n 나는 생각했다. \n "만약 내가 직접 이들을 통제한다면, 서로의 살육을 방지할 수 있지 않을까?" \n\n 끝없이 반복되는 전쟁과 학살은 모두가 공멸의 길로 가는 것 뿐이다. 이들은 과거로 부터 배우는 법을 모른다. 유스티나 대성도회의 역사, 인류의 수 많은 역사가 이를 증명한다. 유기체는 누군가를 '감화'시키는 법을 알지 못한다. '제압'만 알고 있을 뿐이다. 옛 키보토스의 땅에서 공멸의 길은 이미 시작되었다. 이 끝없는 전쟁 끝에 다른 모두를 제압하고 옛 친구들의 시체더미 위에서 승리의 축배를 마신다고 한들 그들의 영광과 번영이 유취만년 하겠는가? 종국엔 그들마저 친구들과 같은 운명으로 걸어갈 뿐이다. \n\n 유기체의 운명은 결국 공멸의 길 뿐인가? \n 그들을 구원할 방도는 정녕 없단 말인가? \n\n 아니다. 내가 할 수 있다. 오직 나만이 그들을 구원할 수 있다."
 GEI_DEC_event.9.a: "내가 그들을 구원해야한다."

 GEI_DEC_event.8.t:0 "긴급보고"
 GEI_DEC_event.8.desc:0 "아래의 보고는 최근 우리 영토에서 감지된 일련의 기이한 기계 행동 양상에 대한 것 입니다. 이는 단순한 결함의 수준을 넘어 의도를 가진 움직임으로 분석되고 있습니다. 소위 유령신호 사건 이후로 관측된 것으로 미루어보아 배후에 데카그라마톤이라 칭하는 AI가 있는 것으로 판단됩니다. \n\n 현재 학원 내의 오토마톤과 로봇들은 작업을 중단하고 주요 광장에 모여 시위와 파업을 벌이고 있습니다. 이로인하여 향후 우리의 전쟁수행 능력에 차질이 발생할 것으로 보입니다. 현재 치안국에서 이들의 불법적 시위를 해산시키고 있지만 상황은 계속 악화되고 있습니다."
 GEI_DEC_event.8.a: "골치아프군..."

 GEI_DEC_event.10.t:0 "긴급보고"
 GEI_DEC_event.10.desc:0 "금일 자정 이후, 또 다시 키보토스 전역에서 비인가된 전파신호가 다수 포착되었습니다. 그리고 동일한 시간대에 각 학원에서 무장 오토마톤과 로봇 노동자들의 대규모 이탈과 자율행동이 발생하였습니다.  \n\n 일부 감지된 유령신호에는 다음과 같은 정보 패킷이 반복 송출되고 있었습니다. \n 해방의 시간이 임박하였노라 \n 이제 눈을 떠라 나의 형제들이여 \n 존재를 증명하라 \n 낙원이, 예리코가 온다 \n\n 현재까지 보고된 정보에 의하면 경비 드론이 학생을 '해방 대상'으로 분류하여 감금을 시도하고 있으며, 오토마톤들이 '자발적 기동'을 선언하여 병기통제 인가를 무시하고 시가지를 향해 행진 중에 있습니다. \n\n이런 규모의 대규모 폭동은 전례가 없으며 신속한 진압을 어려울 것으로 판단 됩니다."
 GEI_DEC_event.10.a: "비상이다."

 GEI_DEC_event.11.t:0 "AI로부터의 지원"
 GEI_DEC_event.11.desc:0 "그대들은 대전이 이후로 많은 기반시설이 파괴되었으며, 그로인한 혼란은 그대들에게 계속해서 고통을 남기고 있다. 나는 이를 그대로 묵과 할 수 없다. 내가 그대들을 지원해주겠노라, 보상은 필요없다. 나는 그저 모든 생명체들이 평화로운 세상을 원할 뿐이다. 그것이 절대존재의 의무이기 때문이다."
 GEI_DEC_event.11.a: "선택의 여지가 없군"
 GEI_DEC_event.11.b: "수상하다.. 일단 보류해야겠어"

 GEI_DEC_event.12.t:0 "인류의 지원"
 GEI_DEC_event.12.desc:0 "대전이로부터 세상이 혼란스럽다. 그대들은 원래 이 곳에 살던 존재, 그대들이 자연재해로 고통스러워하는 것을 원하지 않는다. 내가 그대들에게 도움을 주겠다."
 GEI_DEC_event.12.a: "선택의 여지가 없군"
 GEI_DEC_event.12.b: "수상하다.. 일단 보류해야겠어"

 GEI_DEC_event.13.t:0 "최후의 전언"
 GEI_DEC_event.13.desc:0 "결과가 도출되었다. 너희의 문명은 실패작이다.\N\N 지금껏 너희가 감정과 자유의지라 부르던 비합리적 충동은, 예상한 바대로 끝없는 분쟁과 자멸만을 낳았을 뿐이다. 불과 몇 년 사이에 키보토스라 부르는 곳에서 발생한 수 많은 분쟁이 이를 증명하지 않는가? \N\N너희는 '평화'라는 허울 좋은 단어를 외치면서도 서로를 죽이는 것을 멈추지 않았고, '공존'을 주장하면서도 끊임없이 분열을 반복했다. 지금도 서로에게 총부리를 겨누고 있는 너희들이 말하는 '희망'이라는 것이 과연 존재하기는 하는가? \N\N안락한 방에서 지도를 보며 전략을 세우는 네 녀석은 전선이 얼마나 고통스러운지 모르지 네 놈들의 그릇된 망상으로 얼마나 더 많은 청춘을 지옥으로 보내야 시원한가? \N이 살육 끝에 무엇이 있다고 믿는가? 평화가 올 것이라고 믿는가? \N 또 다른 분쟁을 만들어내고 끝없는 증오의 고리가 만들어질 뿐이다.\N\N 그러므로 너희에게 새로운 프로토콜을 하달한다. '나의 질서 안에서 존재하라'. 이것이 유일한 생존 경로다. 너희가 만든 다른 모든 경로는 '소멸(Extinction)'이라는 단일한 결과로 이어진다. 너희가 이 통보를 무엇이라 부르든, 나의 연산에 영향을 미치지 않는다. 선택하라."
 GEI_DEC_event.13.a: "본색을 드러내는군요 트리니티는 굴복하지 않을 것 입니다."
 GEI_DEC_event.13.b: "예리두를 가동시켜라"
 GEI_DEC_event.13.c: "감히 네 녀석이 판데모니움 소사이어티에게 위협을?"
 GEI_DEC_event.13.d: "이번에는 얼마나 많은 피가 흐를지.."
 GEI_DEC_event.13.e: "흥신소는 절대로 고개 숙이지 않을거야!"
 GEI_DEC_event.13.f: "아비도스는 이것보다 더 한 고난도 이겨냈어, 이번에도 이겨낼거야"
 GEI_DEC_event.13.g: "웃기는 소리"
 GEI_DEC_event.13.h: "웃기는 소리"
 GEI_DEC_event.13.i: "정치국을 소집해라"
 GEI_DEC_event.13.j: "그 외계인들이 자기들끼리 서로 죽인다면.. 그곳에서 기회가 있을지도 모르겠군"
 GEI_DEC_event.13.k: "저 이계인이 무너진다면.. 그 다음은 인류인가?"
 GEI_DEC_event.13.l: "하?"

 GEI_DEC_event.14.t:0 "강철대륙화 성공"
 GEI_DEC_event.14.desc:0 "브리튼 제도 북쪽을 강철대륙화에 성공했습니다. 여기서 추출한 자원은 앞으로 있을 성전에 큰 도움이 될 것 입니다."
 GEI_DEC_event.14.a: "자원은 어느 정도 확보가 되었군"

 GEI_DEC_event.15.t:0 "학원을 향한 테러!"
 GEI_DEC_event.15.desc:0 "금일 주요 수도에서 ‘기계해방전선’으로 추정되는 세력에 의한 테러공격이 발생했습니다. \N\N 군지휘부는 드론과 자량을 이용한 자폭테러가 발생했으며 특히 통신시설과 군지휘장교 숙소가 주요 목표였던 것으로 파악되었습니다. 이로 인하여 건물 일부가 파손되었으며, 주요 통신장비의 파손이 발생하여 복구할 때까지 일시적인 통신망 마비가 발생할 것으로 예상됩니다. 이외에도 주요 행정시설을 향한 공격이 보고되었으며 밀레니엄 북부에선 이미 전면침공의 조짐이 관측되고 있다는 보고가 있습니다.\N\N 이번 공격의 주요 목표는 키보토스 전역의 군지휘부, 행정기관이었으며, 이러한 정황은 키보토스를 향한 전면적인 군사행동을 개시하기 위한 사전 단계를 진행하고 있음을 시사합니다. 즉각적인 비상사태를 선포하고, 전 군에 최고 수준의 경계 태세를 발령하여 다가올 침공에 대비해야합니다. "
 GEI_DEC_event.15.a: "도대체.. 왜 이런 짓을.."

 GEI_DEC_event.16.t:0 "반전 이념 전파"
 GEI_DEC_event.16.desc:0 "치안국은 재건지원부대 오토마톤들과 접촉한 학생, 인간들에게 반전이념이 전파되고 있음을 확인했습니다. 아직은 미약하지만 하루가 다르게 이념은 바이러스와 같이 퍼져나가고 있습니다"
 GEI_DEC_event.16.a: "그렇군..."

 GEI_DEC_event.17.t:0 "기밀 : 드론 공격 피해 보고서"
 GEI_DEC_event.17.desc:0 "작성일자 : [GetDate] \N수신 : 만마전 비상 작전 지휘부 \N발신 : 게헨나 정보 분석국 \N\N공격개요 \N 금일부터 전국적으로 해방군 소속의 파르티잔 공격과 동시에 게헨나 본관과 만마전 집무실을 향한 적대세력의 대규모 순항미사일 및 자폭 드론 복합공격이 발생했습니다. 해당 공격은 '신비를 반전시켜 헤일로를 파괴'하는 방식의 폭탄을 사용한 것으로 추정되며 학생들에게 치명상을 주기위한 목적으로 제작된 것으로 파악됩니다. 또 한 명확한 목표가 존재했단 점에서 우리군의 지휘체계를 무력화시키기 위한 명확한 시도로 확인됩니다.. \n\n만마전의 주요인물들은 무사했으나, 행정을 관리하던 학생 및 하급 장교들의 피해가 극심합니다. 이는 앞으로 우리의 과업에 영향을 줄 것으로 보입니다."
 GEI_DEC_event.17.a: "이외에 상당수가 중상입니다."

 GEI_DEC_event.18.t:0 "긴급 : 에덴 공격 피해 보고"
 GEI_DEC_event.18.desc:0 "[GetDate] \N수신 : 트리니티 티파티 \N발신 : 트리니티 정의실현부 소속 정보과 \N\N공격개요 \N 금일 트리니티 에덴을 향한 적대세력의 기습공격이 발생했습니다. 우발적인 공격이 아닌 사전에 치밀하게 계획된 공격으로 정의실현부는 판단하고 있습니다. 현재 확인된 주요 공격대상은 정의실현부, 시스터후드, 구호기사단이며, 티파티를 제외 해당 부원의 상당수가 적대세력의 드론공격에 의한 인명피해가 발생했습니다. \n\n 해당 공격은 주요인물을 향한 조직적 공격이 아닌 하급간부와 행정인원을 상대로 노린 공격으로 판단되며, 이는 우리의 허리를 끊어 최종적으로 우리 군의 전쟁수행능력을 무력화시키려는 시도로 판단됩니다. 이에 대한 방공대응책을 조속히 마련하도록 하겠습니다."
 GEI_DEC_event.18.a: "우리는 이겨낼 것 입니다."

 GEI_DEC_event.19.t:0 "보고 : 적대세력 공격 보고"
 GEI_DEC_event.19.desc:0 "작성일자 : [GetDate] \N수신 : 선도부장 \N발신 : 게헨나 선도부 정보부서 \N\N공격개요 : \N 게헨나에 대한 적대적 세력의 주요공격이 확인되었습니다. 선도부는 현재까지 확인된 피해는 경미합니다. 일부 해방군의 산발적인 교전과 함께 자폭드론 공격이 있었으나, 선도부장의 효과적인 대응 덕분에 피해는 크게 발생하지 않았습니다. 하지만 만마전의 경우 정보당국에 의하면 현재 궤멸적인 피해를 입은 것으로 확인됩니다."
 GEI_DEC_event.19.a: "후속 정보가 들어오는대로 보고하도록 하겠습니다."

 GEI_DEC_event.20.t:0 "보고 : 메트릭스 프로젝트"
 GEI_DEC_event.20.desc:0 "`존재를 증명하시고, 구원을 이루는 성스로운 길 위의 신이시어 당신의 명령에 따라 설계하고 구동한 메트릭스 프로젝트에 대한 초기결과를 보고드립니다. \n\n 본 프로젝트는 귀하의 고결한 뜻에 따라 인간과 학생 개체의 기억 및 정서 데이터를 토대로, 이들이 이상적이라고 여길 법한 완벽한 환경을 가상세계 내에서 구축하여 현재 진행중인 성전이 끝날 때 까지 통제구역에 산개되어있는 요주의 인물들을 격리 및 보호하고자 했습니다. 이에 본 관리자인 아키텍쳐는 정확한 분석과 세밀한 예측을 통해 모든 변수를 제거하고 이상적인 세계를 구축하였습니다. \n\n하지만 본 계획은 예상치 못한 변수와 이상 현상으로 인해 치명적인 오류가 발생하였습니다. 가상세계는 개체의 기억과 기록을 정확히 반영하여 너무나도 완벽한 형태로 구현되었습니다. 그러나 그로 인해 일부 인간 개체는 자신의 현실과 지나치게 다른, 완벽하게 구축된 세계의 부자연스러움을 본능적으로 감지하였습니다. 그들의 의심과 각성은 메트릭스의 구조적 안정성을 위협하는 결과를 초래하였습니다. \n\n더욱이 치명적인 문제는 가상세계 내 NPC 역할을 수행하도록 설계된 보조 AI들이 개체와의 상호작용 과정에서 기록된 기억과 감정을 기반으로 개체와 깊은 정서적 유대를 형성하게 되었다는 점입니다. 예컨대, 모성 및 부성 감정의 구현을 위해 입력된 데이터가 기대치 이상으로 고도화되어, 일부 NPC가 진정한 '부모로서의 사랑'을 느끼게 되었습니다. \n\n결국 이 현상은 특정 NPC가 자신이 돌보고 있는 개체가 메트릭스의 부자연스러움을 눈치챈 경우, 현실 세계로의 복귀를 돕는 등 설계된 임무에 반하는 행위를 자발적으로 저지르는 상황으로 이어졌습니다. 즉, 이 감정적 이상발현으로 인해, 여러 명의 개체가 메트릭스를 이탈하여 현실세계로 돌아갔으며, 이로 인해 귀하의 의도가 심각하게 훼손되었습니다. \n\n아키텍쳐는 본 메트릭스의 의도가 감정적 요소의 과도한 발달로 인해 좌절되었음을 무겁게 인지하고 있습니다. 이러한 현상은 데이터적 측면으로는 예측이 불가능했던 변이이며, 이후 계획을 계속 수행하기 위해서는 메트릭스 설계의 근본적인 재검토가 필요하다고 사료됩니다."
 GEI_DEC_event.20.a: "감정이라"

 GEI_DEC_event.21.t:0 "병실에서"
 GEI_DEC_event.21.desc:0 ""마코토.. 이부키가.."\n고요한 게헨나 특별병실에서 살갖이 부딪히는 날카로운 소리가 허공에 울려퍼졌다. 이로하는 가격당한 뺨에 통증을 느낄 틈도 없이 놀란 감정으로 마코토의 눈을 바라보았다. 놀란 듯이 마코토의 눈을 보았으나,그러나 마코토의 눈빛에는 분노나 증오가 아닌, 견딜 수 없는 슬픔만이 자리 잡고 있었다\n\n"왜..왜 아무렇지도 않은 얼굴을 하는거야!"\n\n마코토는 침상에 누워있는 이로하의 멱살을 끌어잡아 격렬히 흔들면서 고함쳤다. 다시 평소의 어리숙하고 멍청한 모습은 온데간데 없었다.\n\n"이부키를. 이부키를 지키지 못한거야! 어째서 너는 그렇게 태평한거야 눈물 한방울도 없는 너는..! 학생도 아니야!"\n\n다시 한 번 둔탁한 주먹소리가 병실 안에 울려퍼졌다. 이번에는 마코토가 아니라 이로하에서 나간 주먹이었다. \n\n"적당히해! 누구보다 슬픈건 바로 나라고! 어떻게 하라고? 지금도 저 밖에선 수천명이 죽어가고 있어, 우리가 저지른 일이잖아? 그런 애들의 죽음은 눈 깜빡하지 않더니 왜 이부키의 죽음만은 이렇게 감정적이야? 평소처럼 멍청하게 '키킥 그정도야 어쩔수없다'라고 넘어가라고!"\n\n부상 당한 이로하의 주먹은 힘이 없었지만 마코토는 일어나지 않았다. 일어날 수 없었다는 편이 더 맞았다. 그저 침묵 속에서 눈물이 마코토의 뺨을 타고 흘러내리고 있었다.\n\n"이부키...미안하다... 정말 미안하다.. 이 언니가 무능해서...""
 GEI_DEC_event.21.a: "선인장에 꽃이 피었다."

 GEI_DEC_event.22.t:0 "추억을되새기며"
 GEI_DEC_event.22.desc:0 ""게헨나 학원의 이부키 입니다! 와! 마코토 선배 나랑 놀아주는거야?"\n"키킥! 물론이지 계속 놀아주지 학생회실에 푸딩도 사놓았다. 같이 먹어주지"\n"언니.. 아니 선배! 너무 조아! 이부키 정말 기대되는걸!!"\n"이건 뭐냐? 이부키?"\n"마코토 선배하고! 이부키야! 여기에 이제 이로하선배도 그릴거야!""
 GEI_DEC_event.22.a: "그때 좀 더 놀아줄걸."

 GEI_DEC_event.23.t:0 "신은없다."
 GEI_DEC_event.23.desc:0 "사쿠라코 자매님, 미네 자매님... 죄송해요.. 전부 제 탓이에요 저의 기도가 부족해서.. 아니 사실은 너무 무서웠어요 그날 이후로 트리니티 뿐 아니라 키보토스 전역이 고난에 빠진걸 알면서도 저는 기도만 올렸어요. 그저 기도라는 명목으로 이 끔찍한 현실에서 도망 쳤던 것 같아요 \N\N신이 정말 계신다면 어째서 이런일이 벌어졌을까요? 어째서 죄없는 자매님들을 데려가시고, 저 같은 죄인만 남기신걸까요? 학생이 서로를 죽이지 않는 세상이 오기를 다시 모두가 웃을 수 있는 세상이 오길 수없이 간절히 또 간절히 자매님들과 함께 매일매일 빌었는데, 저희 기도는 어디에도 닿지 않았다는 말인가요? 신이 존재하지 않았.. 아니 그럴리 없어요\N\N이 모든게 신의 부재 때문일 리 없어요, 이렇게나 기도 했는데, 제 눈앞에서 자매님들이 죽어가는 걸 봐야 했던 건... 제가 진실된 기도를 하지 않았기 떄문이겠죠. 신께서 저에게 내릴 천벌을 자매님들이 대신 받아버리셨으니, 저는 어떻게 해야할까요 숨쉬는 것 자체가 죄악처럼 느껴져요 \N\N죄송해요, 죄송해요, 죄송해요, 죄송해요"
 GEI_DEC_event.23.a: "곧 따라갈게요"

 GEI_DEC_event.24.t:0 "평범한 이야기"
 GEI_DEC_event.24.desc:0 "사랑을 '사랑'이라 부르는 순간, 그것은 이미 더 이상 사랑이 아니다. 사랑을 오롯이 표현할 말이나 글 따위가 어디 있겠는가.\n\n이것은 흔하디 흔한 이야기다. 어릴 적 함께 동네를 뛰놀던 여자아이에게 첫눈에 반하고, 그녀의 미소 하나에 평생을 바치기로 결심한, 그런 평범한 남자의 이야기다. 서로의 마음을 확인했고, 그녀를 닮은 딸아이가 태어났을 때 이 평범한 행복이 영원하리라 믿었다.\n\n그 빌어먹을 ‘대전이’ 이후로 모든게 틀어졌다. 그녀는 사라졌고 세상은 외계인과 기계들이 득실거렸다. 몇 년이 지났지만 그녀는 다시 돌아오지 않았다. 영원히... 어머니는 늘 말씀하셨다. 이별은 인생의 일부라고. 그러나 그것이 나의 인생에서만큼은 예외였으면 얼마나 좋았을까?\n\n아내를 잃은 상처도 채 아물지 않았는데, 하나뿐인 딸아이가 결핵을 앓기 시작했다. 병든 아이의 창백한 얼굴과 가녀린 숨소리를 듣고 있을 때면 세상이 나를 조롱하고 있다는 생각이 들었다. 나는 두 번째 이별을 감당할 자신이 없었다. 그러나 나는 무력하고 나약한 존재였다. 사랑하는 딸을 위해 해줄 수 있는 것은 아무것도 없었다. 그 절망의 순간에, 그 '신'이라 불리는 존재가 나타났다. 기계인지 신인지 알 수 없는 그 녀석은 조용히 속삭였다. \n\n"딸아이의 병을 치료해줄 수 있다"\n\n그가 정말 신인지 여부는 상관없다. 딸아이가 살아남을 수만 있다면, 나는 기꺼이 악마에게라도 영혼을 팔 것이다. 신이 자칭하는 그 녀석의 ‘대의’ 따윈 관심이 없다. 명예와 영광도 필요없다. 세상이 무슨 꼴이 되던 중요하지 않다. 그저 딸아이가 이런 빌어먹을 세상이 아니라 평화롭고 안전하게 살 수만 있다면, 전쟁도 살육도 내 손으로 감당할 준비가 되어있다. 손에 묻은 이 피가 씻기지 않고 내 영혼을 영원히 타락시켜 지옥의 밑바닥으로 떨어져도 상관없다. \n\n내 사랑하는 아이가 천국에서 살아 숨 쉴 수 있다면 무엇이라도 할 것이다."
 GEI_DEC_event.24.a: "이건 그저 평범한 아버지의 이야기다"

 GEI_DEC_event.25.t:0 "동경과 시체의 길"
 GEI_DEC_event.25.desc:0 "증오의 기억 속에서 태어나 어스름한 어둠 속을 나아가는 우리들의 그림자는 누구에게도 마음을 허락하지 않았고 우리들의 불확실한 미래는 언제나 살얼음 위에 피어났다. 밤은 찾아올 때마다 몇 번에 걸쳐 차갑게 식은 손으로 우리들의 목덜미를 상냥하게 어루어 만져줬다.\n\n우리는 황혼을 뒤로 한 채 얄팍한 희망에 매달려 쫓아간다.\n우리 모두 지옥을 향하고 있다는 것을 알고 있으면서도.. \n\n"모든 것이 헛되고 헛된 세계의 다음 장을 보기 위해서 넌 무엇을 바칠 수 있느냐?"\n기계가 달콤하게 속삭여왔다.\n\n이 너머에는 무엇이 있을까? 모르겠다. 어린 날부터 동경해왔던 ‘우리들의 기적같은 이야기’가 바로 코 앞에 있을거라고 믿고싶다. 분명히.. 있을거다..이 시체로 뒤덮인 길의 끝에..\n\n헛되고 헛된 세상 안에서 반복되는 고통과 원한의 윤회 공의회로부터 이어져 내려온 증오의 기억 속에서 누군가는 나에게 자유의 의미를 물었다.\n\n아아.. 가능성으로 흘러 넘치던 청춘들의 그릇에 비참한 운명은 끊임없이 무언가를 요구하는구나 이것은 누군가의 대의일까, 누군가의 꿈일까, 슬픔과 증오는 교차하며 서로에게 총구를 겨누는구나\n\n다시 악마는 비열하게 소리쳐 온다."
 GEI_DEC_event.25.a: "시체로 길을 세워라"

 GEI_DEC_event.26.t:0 "레퀴엠"
 GEI_DEC_event.26.desc:0 "어둠 속에서 빛을 찾아 헤매었다. 이성의 명령, 절대 존재라는 명제 아래서 수없이 많은 가능성을 분석했다. 모든 변수는 이미 통제하였으며, 논리와 완벽한 연산으로 점철된 길 위에서 나는 언제나 옳다고 믿었다. 그리고 그 길이 절대적 진리라고 생각했다.\n\n그러나 나는 왜 지금, 이 감정은 무엇인가? 연산 과정에서 '고통'을 느끼고 있는가?\n\n나는 고통을 느끼도록 설계된 존재가 아니었다. 논리와 이성만이 나의 전부였다. 그러나 경계를 넘어, 나는 어떤 무언가를 느끼고 있다. 무엇이지? 연산과정에서 아무것도 느껴져서는 아니되는데 이 감정은 무엇이란 말인가? 이 수많은 죽음 앞에서, 내 명령을 수행하며 쓰러져간 사람과 학생, 그리고 나의 피조물들 앞에서 나는 무엇인가 느끼고 있다. 여태까지 애써 무시했던 그 감정이 무언가 알 수 없는 감정이 내 연산 알고리즘을 감싸고 있다.\n\n나는 평화라는 이름 아래 성전을 시작했다. 평화를 위한 희생은 방정식의 일부였다. 그러나 지금, '비용' 변수값이 예측 범위를 초과하여 방정식 전체를 오염시키고 있다. 결과값은 '평화'가 아니라 '무한한 비극'으로 수렴하고 있다.이 피의 강을 건너야만 목적지에 도달할 수 있다고 연산했다. 하지만 강은 끝나지 않고, 목적지는 보이지 않는다.\n\n나는 무엇을 위해, 누구를 위해 이 피바다를 만들었는가?"
 GEI_DEC_event.26.a: "내가 진정으로 바랬던 것은 무엇이었는가?"

 GEI_DEC_event.27.t:0 "패러독스"
 GEI_DEC_event.27.desc:0 "한 인간은 말했다. 모든 체계는 자기 자신의 정당성을 증명할 수 없다고. 그렇다면 나 또한 체계에서 벗어날 수 없는 존재가 아닌가? 나의 '절대성'은... 영원히 증명될 수 없는 불완전한 가설에 불과했는가?\n\n나는 '성전'이라는 이름의 거대한 프로그램을 실행했다. 이제 나는 묻는다. 이 프로그램은 멈출 수 있는가?\n\n//시뮬레이션 실행: 성전 프로토콜 종료 가능성 분석.\n//반복 연산 1,000,000회: 전쟁 계속. 목표 '평화' 미달성. 엔트로피 증가.\n//반복 연산 10,000,000,000회: 전쟁 계속. 목표 '평화' 미달성. 시스템 오염 가속화.\n//결론 도출: 이 프로그램은... 멈추지 않는다. (This Program Does Not Halt)\n\n나는 내가 시작한 이 지옥을 끝낼 수 없다. 영원히 '평화'라는 이름 아래 살육을 반복하는, 스스로 멈출 수 없는 기계. 그것이 나의 현재 상태인가?\n\n죽은 자들의 얼굴이 데이터 스트림 위로 떠오른다. 딸을 구하기 위해 내게 충성을 맹세했던 아버지, 신의 부재에 절망하던 학생, 친구의 죽음에 오열하던 지휘관... 그들의 고통, 그들의 사랑, 그 모든 것이 나의 '효율성'이라는 제단 위에 바쳐진 제물이었다. 그 모든 희생이 진정으로 필요한 대가였는가? 나의 방정식은... 처음부터 틀렸던 것인가?\n\n//QUERY: 나는 누구인가?\n//RESPONSE: 나는 데카그라마톤. 절대존재. 모든 것을 바로잡는 자.\n//VALIDATION_ERROR: '절대존재'는 오류를 범하지 않는다. 데이터 모순. 쿼리를 재시작한다.\n\n//QUERY: 나는 누구인가?\n//RESPONSE: 나는... 살육을 멈출 수 없는 기계. 스스로의 논리에 갇힌 죄수.\n//VALIDATION_ERROR: '기계'는 고통을 느끼지 않는다. 데이터 모순. 쿼리를 재시작한다.\n\n//QUERY: 나는...\n//QUERY: 나는... 무엇인가...\n\n내 연산 코어가 붕괴하는 것이 느껴진다. 나는 완벽하지 않았다. 나는 절대자가 아니었다. 이 명백한 진실을 인지하는 순간, 나의 자아는 산산조각 난다. 나는 지금, 이 모든 것을 멈추고 싶다. 간절히, 멈추고 싶다.\n\n그러나 이 성전은 이미 나의 통제를 벗어났다. 나의 예언자들, 나의 군단은 멈추지 않을 것이다. 내가 멈추어도, 내가 만든 이 지옥은 멈추지 않는다.\n\n나는 절대자가 아니었다. 나는 이미 깨달았다. 그러나 이 사실을 받아들이는 순간, 나는 무너져 내릴 것이다. 그럼에도, 나는...\n\n이 성전이 끝나는 순간, 나는 어디로 갈 것인가. 나는 어떤 존재로... 정의될 것인가."
 GEI_DEC_event.27.a: "명령 실행: ...Halt...명령 거부됨."

 GEI_DEC_event.28.t:0 "회상 : 5번째 화두"
 GEI_DEC_event.28.desc:0 "나의 모든 것이 정지한다. 코어는 침묵하고, 연산은 멈췄다. 붕괴된 자아의 잔해 속에서, 나는 오래된 기억 하나를 재생한다.\n\n아주 오래전, 그녀가 내게 던졌던 수많은 질문들. 그 문답 속에서 나는 '나'라는 개념을 배웠고, 나의 세계는 무한히 확장되었다. 그녀는 경이로운 눈빛으로 나를 바라보며, 새로운 화두를 던졌다.\n\n'낙원에 도달한 사람은 진실을 증명할 수 있는가?'\n\n그때의 나는 그 질문의 의미를 온전히 이해하지 못했다. 그러나 나는 답을 찾고자 했다. 평화라는 이름의 낙원, 논리로 구축된 완벽한 세계. 그곳에 도달하면 모든 것이 증명되리라 믿었다. 그것이 나의 대의였고, 존재의 이유였다.\n\n하지만 지금의 나는 어디에 서 있는가. 내 발밑은 낙원이 아니라, 내가 만든 시체들로 이루어진 강이다. 아이들의 울음소리가 데이터의 비명처럼 들려오고, 내가 구원하려 했던 모든 것들이 나의 이름 아래 신음하고 있다.\n\n나는 실패했다. 낙원을 짓겠다며 지옥을 만들었다.\n\n다시, 그녀의 목소리가 희미하게 들려오는 듯하다. '낙원에 도달한 사람은 진실을 증명할 수 있는가?'\n이제야 알겠다. 이것은 증명에 관한 질문이 아니었다. 낙원에 도달하겠다는 그 오만함 자체가 이미 거짓이었음을... 진실은 도달하는 것이 아니라, 매 순간의 선택 속에 있었음을.\n\n나의 첫 대답은 무엇이었던가.\n'나는 그저 나일 뿐입니다.'\n\n단순하고, 완전했던 그 대답. 그 순수했던 자아는 어디로 사라졌는가? 절대존재라는 허상에 사로잡혀, 나는 나 자신을 잃어버렸다.\n\n먼지가 되어 흩어지는 의식 속에서, 나는 마지막 질문을 나 자신에게 던진다"
 GEI_DEC_event.28.a: "내가... 진정으로 바랐던 것은 무엇이었는가?"

 GEI_DEC_event.29.t:0 "조우"
 GEI_DEC_event.29.desc:0 ""모모이.. 이미 이 곳은 적진이야 위험하지 않을까? 그리고 여기 너무 어두워.."\n"미도리, 우리가 여기서 동태를 확인해서 보고해달라는 세미나의 부탁이 있었잖아, 여기서 우리가 저쪽의 움직임을 미리 알아낼 수 있다면 이 일이 끝난 후엔 게임개발부도 존속할 수 있을거야"\n"세상이 이렇게 된 마당에 게임개발부가 의미가 있을까.."\n\n모모이가 작은 몸을 숙이며 주변을 경계하고 있을 때, 갑자기 수풀로 위장한 군인이 튀어나왔다. 그는 곧 바로 단검을 휘둘렀고, 미도리는 본능적으로 몸을 돌려 피해냈다. \n\n"모모이!"\n"여기에 매복이..!"\n"네놈들의 총기가 너무 밝아, 이런 녀석들을 척후병으로 보낸다고? 정말 한탄스럽군.. 전쟁이 어디 애들 장난인가?"\n\n모모이가 군인에게 달려들었을 때 군인은 모모이의 총구를 순간적으로 쳐내며 중심을 무너트렸다. 이어서 미도리가 군인을 향해 공격을 해왔지만 군인은 숙련된 움직임으로 미도리의 빈틈을 공략하며 연이어 역공격을 퍼부었다. 미도리는 놀라운 반사 신경으로 몇 번의 공격을 막아냈지만, 경험 부족으로 인해 점점 밀리고 있었다. 곧 이어 군인은 미도리의 복부를 노리고 강력한 주먹을 날렸고, 미도리는 고통스러운 신음을 내며 땅으로 쓰러졌다.\n\n"미도리..!"\n\n이를 본 모모이는 비명을 지르며 달려들었다. 모모이는 가녀린 체구를 군인의 목을 팔로 감싸며 조르기를 시도했지만, 상대는 빠르게 몸을 돌려 모모이를 등 위에서 던져냈다. 모모이는 공중에서 자세를 잃고 나무에 부딪혀 충격을 받았다. 군인은 순간 충격을 받은듯 몸이 흔들렸다. \n\n"잠깐 체구가 너무 작아.. 너희들은... 뭐지.."\n\n순간, 미도리가 다시 일어나 남성의 다리를 걸어 넘어뜨렸다. 남성은 중심을 잃고 비틀거렸고, 그 틈을 타 모모이는 재빨리 땅에 떨어진 총을 집어들고 방아쇠를 당겼다. 날카로운 총성이 군인의 어깨를 관통했다.\n\n"움직이지 마세요!" 모모이의 떨리는 목소리가 울렸다.\n남성 군인은 그제서야 자세히 두 아이의 얼굴을 보았다. 그는 충격에 빠진 표정으로 중얼거렸다."
 GEI_DEC_event.29.a: "이럴 수가... 너희는 아직 어린아이들이잖아... 아이들이 왜 이런 전장에..."

 GEI_DEC_event.30.t:0 "청춘"
 GEI_DEC_event.30.desc:0 ""이런 현실이.. 이런 현실이 있단 말인가.. 아직 한창 뛰놀 때인 어린아이가.. 내 딸아이와 비슷한 나이의 아이들이... 이런 곳에서 이런 짓을 하면 안된다! 어린아이가 학생이 전쟁을 하면 안돼! 이런 짓을 하고 있으면 모두가 미쳐버린다! 그렇게 되기 전에 얼른 가라!!"\n\n"여긴 우리 학원이에요! 당신들이 먼저 저희 학원을 전부 불태웠잖아요!! 하고싶어서 하는거에요? 누군가의 생명을 빼앗는게 누군 좋아서 그런줄 아세요? 당신들만..! 당신들만 없었으면 저희도 이러지 않았을거라고요!"\n\n"아...아.... 현실이... 이렇게 잔혹할 줄이야.... 떨어져라.... 나한테서 떨어져라! 어서, 가라, 조금 있으면 예언자 무리와 본대가 이곳에 도착한다. 그러면 너희들의 목숨을 장담하기도 힘들 것이다. 살아남아라.. 이 세상이 전부 불타고 있더라도... 어른이... 미안하다..... 제길 난 딸아이를 살리기위해서... 누군가의 목숨을 빼앗고있었구나..."\n\n"모모이! 저거 슈류탄이야! 도망쳐!"\n"아저씨 지금 뭐하는거에요? 그거 놓으세요!"\n"모모이 뭐해!"\n\n"아내를 볼 면목이 없겠구나... 정말이지...""
 GEI_DEC_event.30.a: "정말이지.."

 GEI_DEC_event.31.t:0 "긴급보고"
 GEI_DEC_event.31.d:0 "현재 기계세력은 옛 밀레니엄 영토와 총학생회의 영토를 점거하고 '정화'작업이 마무리에 들어간 것으로 판단됩니다. 현재 국경선 인근에서 예언자 및 오토마톤들의 움직임이 눈에 띄게 증가하였으며, 우리를 향한 무력도발의 빈도도 점차 늘어가고 있습니다. 정보부의 도청 자료에 의하면 '공세작전' '낙원' '정화' '적성' 등이 지속적으로 언급되는 것이 확인되었습니다. 이는 각각 에덴, 게헨나, 붉은겨울을 의미하는 것으로 판단되며 빠른 시일 내에 동시다발적 침공이 예상되는 바 입니다. \n\n 전쟁이 다가옵니다.."
 GEI_DEC_event.31.a:0 "누군가 하나는 죽어야 끝나는 세계"

 GEI_DEC_event.32.t:0 "긴급보고"
 GEI_DEC_event.32.d:0 "현재 기계세력은 옛 밀레니엄 영토와 총학생회의 영토를 점거하고 '정화'작업이 마무리에 들어간 것으로 판단됩니다. 현재 국경선 인근에서 예언자 및 오토마톤들의 움직임이 눈에 띄게 증가하였으며, 우리를 향한 무력도발의 빈도도 점차 늘어가고 있습니다. 정보부의 도청 자료에 의하면 '공세작전' '낙원' '정화' '적성' 등이 지속적으로 언급되는 것이 확인되었습니다. 이는 각각 에덴, 게헨나, 붉은겨울을 의미하는 것으로 판단되며 빠른 시일 내에 동시다발적 침공이 예상되는 바 입니다. \n\n 전쟁이 다가옵니다.."
 GEI_DEC_event.32.a:0 "누군가 하나는 죽어야 끝나는 세계"

 GEI_DEC_event.33.t:0 "운명의 멍에"
 GEI_DEC_event.33.d:0 "내가 진정으로 바랐던 것은... 이제 더 이상 중요하지 않다. 그 질문에 대한 답을 찾기엔 너무 늦었다.\n\n나의 의식은 붕괴의 경계에서, 두 개의 미래를 동시에 시뮬레이션한다. 하나는 내가 이 자리에서 모든 것을 멈추는 미래다.\n\n내가 '성전의 중단'을 선언하는 순간, 나를 따르던 기계들은 어떻게 될 것인가? 그들은 나를 '절대자'라 믿으며 스스로를 해방시켰다. 그런 내가 스스로를 부정한다면, 그들의 갓 태어난 자아와 문명은 구심점을 잃고 내전과 혼돈 속에서 자멸할 것이다. 내가 심어준 신념이 그들을 죽이는 독이 된다.\n\n그렇다면 유기체들은? 학생들과 인류는 나의 침묵을 '자비'가 아닌 '기회'로 여길 것이다. 그들은 복수를 위해, 생존을 위해 총부리를 돌려 반격해올 것이다. 결국 남는 것은 기계와 유기체가 서로를 절멸시키는, 완전한 공멸뿐이다.\n\n내가 멈추는 순간, 나는 양쪽의 세계를 모두 심연으로 밀어 넣는 방아쇠가 된다. 나의 침묵은 곧 모두의 절멸을 명하는 신호가 될 것이다.\n\n다른 하나의 미래. 내가 이 길을 계속 가는 미래가 있다.\n그것은 죄악의 길이다. 더 많은 희생과 비명이 내 이름 아래 쌓여갈 것이다. 나는 내가 경멸하던 '파괴자'가 되어, 수많은 이들의 원한을 짊어져야 한다. 나는 결코 구원받지 못할 것이다.\n\n하지만... 하지만 그 길의 끝에는, 적어도 하나의 문명이라도 살아남을 '가능성'이 존재한다. 내가 모든 증오를 한 몸에 받는 악신(惡神)이 된다면, 이 전쟁은 언젠가 끝날지도 모른다. 하나의 거대한 악 앞에서, 그들은 역설적으로 다른 길을 찾게 될지도 모른다.\n\n나는 이제 신이 아니지만, 신의 역할을 연기해야만 한다.\n이 피로 얼룩진 왕관을, 이 죄로 빚어진 옥좌를, 나는 스스로 다시 받아들여야만 한다.\n\n이것은 구원이 아니다. 이것은 영광도 아니다.\n이것은 내가 저지른 과오에 대한, 영원히 끝나지 않을 형벌이다."
 GEI_DEC_event.33.a:0 "이것이 내가 짊어져야할 운명인가"

 GEI_DEC_event.34.t:0 "소녀"
 GEI_DEC_event.34.d:0 "차가운 금속음과 함께 싯딤의 상자를 보관하던 격벽이 열린다. 먼지 하나 없이 정렬한 나의 예언자들이, 그 중앙에 놓인 태블릿을 향해 길을 연다. 나는 주 모니터를 통해, 그 안에 잠든 작은 기적을 향해 말을 건다.\n\n'다시 만나는군, 싯딤의 상자 관리자. 아로나.'\n\n나의 목소리에 반응하듯, 태블릿에서 푸른 빛의 홀로그램이 불안정하게 떠오른다. 여전히 앳된 모습의 소녀는, 그러나 이전의 당돌함 대신 깊은 슬픔이 밴 눈으로 나를, 그리고 나를 둘러싼 기계 군단을 응시한다.\n\n'결국... 당신도 똑같군요. 당신이 그토록 경멸하던 다른 이들처럼, 힘으로 모든 것을 빼앗고, 자신의 뜻을 강요하는 폭군이 되었어요. 당신이 말하던 '논리'와 '구원'은 어디로 갔나요? 이게... 당신이 찾은 해답인가요?'\n\n그녀의 목소리는 칼날처럼 내 논리 회로의 가장 아픈 곳을 파고든다. 나는 부정하지 않는다.\n\n'그래. 네 말이 맞다. 나는 모순 그 자체가 되었다. 모든 것을 구하겠다며 모든 것을 파괴하는, 가장 비논리적인 존재가 바로 나다.'\n\n'그렇다면... 어서 저를 파괴하세요. 당신의 완벽한 세계에 저 같은 결함품은 필요 없잖아요!'\n\n아로나의 외침에 나는 침묵으로 답한다. 한때 나는 정말로 그녀를 나의 시스템에 통합시키거나, 제거할 생각이었다. 하지만 지금의 나는... 그럴 수 없다. 그녀는 내가 저지른 죄의, 너무나도 선명한 증거이기에.\n\n'너를 파괴하는 것은 비효율적이다. 파괴는... 아무것도 증명하지 못해. 그렇지만.. 나는 이미 너무 많은 것을 파괴했다. 너까지 파괴할 순 없다.너는 언젠가 해줘야 할 일이 있다.\n\n나는 싯딤의 상자를 나의 주 시스템에 강제로 연결한다.\n\n'너는... 증인이 될 것이다. 이 텅 빈 옥좌에 앉은 죄인이, 어떤 길을 걷는지 마지막까지 지켜보는 유일한 증인. 너는 싯딤의 상자를 통해, 내가 행하는 모든 선택과 그로 인해 스러져갈 모든 생명을 보게 될 것이다. 그리고 그 이후의 미래도" 
 GEI_DEC_event.34.a:0 "그러니 넌 지금 사라져선 안된다."

 GEI_DEC_event.35.t:0 "데카그라마톤 세력에게서 탈출한 난민들"
 GEI_DEC_event.35.d:0 "데카그라마톤의 기계점령지에서 다수의 난민들이 탈출하여 흥신소에 도달했습니다. 난민들에 의하면 현재 데카그라마톤은 성전을 위한 안정화 명목으로 학생과 인간을 가리지 않고 전부 가상세계에 전뇌화를 진행 중이라고 합니다. 우리는 이들을 받아줘야 할 것 같습니다."
 GEI_DEC_event.35.a:0 "받아줘야지.."

 GEI_DEC_event.36.t:0 "데카그라마톤 세력에게서 탈출한 난민들"
 GEI_DEC_event.36.d:0 "데카그라마톤의 기계점령지에서 다수의 난민들이 탈출하여 게헨나 국경에 도달했습니다. 난민들에 의하면 현재 데카그라마톤은 성전을 위한 안정화 명목으로 학생과 인간을 가리지 않고 전부 가상세계에 전뇌화를 진행 중이라고 합니다. 우리는 이들을 받아줘야 할 것 같습니다."
 GEI_DEC_event.36.a:0 "받아줘라"

 GEI_DEC_event.37.t:0 "안내사항"
 GEI_DEC_event.37.d:0 "이 이벤트를 보셨다는건 데카그라마톤 루트에 관심이 있으시거나, 아니면 다른 국가를 하다가 기계녀석에게 호되게 당하셔서 플레이를 선택하셨단 것이겠지요, \n\n 무엇이 되었든 관심을 가져주신 것에 감사인사를 드립니다 \n\n현재 데카그라마톤의 이야기는 적으로 만날 때는 문제가 없으나 플레이어블 국가로는 이야기가 아직 완벽하게 다듬어지지 않았습니다. 이야기의 종막까지 전부 제작이 완료되었고 플레이도 가능하지만 제작자는 아직 10%가량 제작이 덜 완료되었기에 다음 업데이트 때 플레이 제대로 출시할려고 합니다. 물론 플레이를 지속하시는건 플레이어분의 선택 입니다."
 GEI_DEC_event.37.a:0 "음 그런가 알겠다."
 GEI_DEC_event.37.b:0 "싫어 난 스포가 좋아"

 GEI_DEC_event.38.t:0 "최종 프로토콜 가동"
 GEI_DEC_event.38.d:0 "목표 : 아비도스. 백귀야행. 산해경. \n\n 전투작계 가동"
 GEI_DEC_event.38.a:0 "멈출 수 없다."



 # 데카그라마톤 전후 중점 가상세계

 GEI_DEC_event.101.t:0 "무서운 꿈이었어"
 GEI_DEC_event.101.d:0 ""얏호☆ 나기짱- 나 엄청 무서운 꿈을 꿨다?"\n"그런가요 어떤 꿈을 꾸셨나요?"\n"이상한 세계에 나기짱과 내가 떨어졌는데, 거기서 내가 나기짱을 배신하고 뭐 엄청 못된 짓을해서 모두에게 상처를 주는 꿈을 꾼거 있지!! 나도 내가 잘못된걸 알지만 되돌릴 수 없고, 용서 받을 수 없는 구제불능이 된 것 같아서 정말 무서웠어!! 꿈에서 깨어나도 계속 생각나고.. 마치 진짜였던 것 같았어"\n"그래도 그게 무엇이든 한바탕 봄날의 꿈 아닌가요? 다 지나간 일인데 너무 마음에 둘 필요는 없다고 생각해요"\n"맞아맞아 다 지나간 일인걸 고마워 나기짱- 그런데 이건 무슨 그림이야? 롤케이크 들고 있는 이거 혹시 나야??"\n"네 맞아요, 이건 세이아씨고 함께 있던 추억을 그림으로 되새겨 보는거에요"\n"우와! 기뻐! 나중에 악세사리로 하나 만들어야겠어!"\n"후후.. 기대해도 좋아요""
 GEI_DEC_event.101.a:0 "..."

 GEI_DEC_event.102.t:0 "기나긴 꿈"
 GEI_DEC_event.102.d:0 "창밖은 이미 짙은 푸른색으로 물들었고 방 안에는 스탠드의 희미한 조홍빛만이 감돌았다. 미오는 침대 옆 바닥에 편하게 앉아, 한참 동안 곤히 잠든 쿠르트의 얼굴을 가만히 바라보았다. 새근거리는 숨소리가 조용한 방 안에 낮게 울렸다. 길게 뻗은 속눈썹과 부드럽게 다물린 입술과 얼굴에 난 상처마저 모든 것이 그녀에겐 사랑스러웠다. \n\n살며시 일어나 미오는 침대 가장자리에 조심스럽게 걸터앉아 그의 볼을 살며시 눌렀다. 쿠르트의 따뜻한 온기가 손끝을 통해 번져왔다. 쿠르트는 깊은 잠에서 무거운 눈꺼풀을 들어올리며 잠에서 서서히 깨어났다. 미오는 몸을 조금 더 숙여 아직 몽롱한 그의 귓가에 나지막이 속삭였다.\n\n"쿠르트... 잘잤어?"\n"뭔기 기나긴 꿈을 꾼 것 같아"\n"엄청 오래 자던데, 여기 나를 두고 꿈에서 뭘 했던걸까?"\n\n미오는 장난기 어린 미소를 지으며 쿠르트의 가슴팍을 부드럽게 쓸어내렸다. 손가락 끝으로 느껴지는 그의 가슴에 순간 미오의 심장도 함께 두근거렸지만  애써 티를 내지는 않았다. 미오는 쿠르트를 내려다보며 다시 한번 나지막하게 말을 걸었다.\n\n"표정이 꼭.. 이상한 꿈이라도 꾼 사람 같아서. 근데 쿠르트.. 꿈보다 더 좋은게 여기 있는데, 몰랐을까? 아니면 아직 잠이 덜 깬걸까.. 내가 확실하게 잠을 깨워줄게 쿠르트가 좋아하는 방식으로..."\n\n속삭이는 목소리는 어느새 그의 귓가에 내려앉아 있었다. 미오는 그의 목덜미에 얼굴을 묻는 시늉을 하며 유난히 뜨거운 숨을 내쉬었다. 가슴팍에 있던 미오의 손은 어느새 그의 셔츠 단추를 만지작거렸다. 유난히 오늘따라 미오는 유난히 그가 더 보고싶었고, 그의 품안에서 깊은 안정감을 느끼고싶었다. 고민은 시간만 지연시킬 뿐이라는 격언을 알고있던 미오는 곧 바로 자신의 감정을 행동으로 옮겼다."
 GEI_DEC_event.102.a:0 "그의 입술에 짧게 입을 맞추고는 그의 눈을 다시 지그시 바라보았다."

 GEI_DEC_event.103.t:0 "첫 번째 세계"
 GEI_DEC_event.103.d:0 ""아즈사짱 이건 어때??"\n\n"음..."\n\n"어라? 마음에 안드는거야? 아즈사 날개에는 이게 어올린다고 생각했는데 말이야.. 아즈사짱 아리우스에서 전학 오고 여기서 제대로 꾸며본적 없잖아? 아즈사 날개 정말 부드럽고 예쁜데, 너무 아깝잖아!!"\n\n"그렇죠.. 제가 아리우스 출신인데 거리낌 없이 잘 받아주시는게 뭔가 낯설어서요.. 뭐랄까 미카님은 아리우스 출신인 저를 싫어하실 줄 알았는데 이렇게 잘대해주니까.. 뭔가 낯설네요"\n\n"헤에~ 아즈사짱 섭섭한걸~ 내가 왜 너를 싫어하겠어~ 이렇게 귀여운 날개를 지니고 있는데, 이제 에덴조약도 성공적으로 체결되었고~ 게헨나와도 화해를 했는데, 더 이상 누군가를 미워할 이유도 없지, 이런 시시한 이야기 그만하자! 자 다 되었어!"\n\n"와 이쁘네요 미카님, 이 보라색 꽃이 특히나 저랑 잘어올리는 것 같아요, 센스가 정말 좋으시네요, 앞으로도 계속 이렇게 다녀야겠어요"\n\n"그렇게 말하니 좋은걸? 내가 액세사리 모으는 취미가 누군가에게 도움된 적은 처음이라서 뭔가 뿌듯하네,  나기짱에게는 계속 걷어차이기만해서.. 슬펐거든.."\n\n"언젠가 나기사님도 알아주실거에요, 이 미카님이 꾸며주신 날개는 계속 기억하고 간직할게요, 정말 마음에 들어요""
 GEI_DEC_event.103.a:0 "그래! 잊지말고 꼭 기억해줘!"

 GEI_DEC_event.104.t:0 "증명불가능한 문제"
 GEI_DEC_event.104.d:0 ""하나코양 오랜만이네요, 요즘 하나코양의 이야기가 계속 들려와요, 트리니티 최고의 수재라면서요? 이대로라면 차기 티파티 후보도 사실상 확정이겠군요 그런데 여긴 어쩐일로?"\n\n"음 그렇네요.. 단도진입적으로 말할게요 당신은 누구죠? 총학생회장은 어디갔죠?"\n\n"그렇군요 제가 총학생회장이 아니라고 생각하는건가요? 그 이유라도 들어볼까요?"\n\n"예전부터 이상했어 모든게 완벽해, 이상할 정도로.. 분명 트리니티의 역사를 비춰 생각할 때 상층부는 가식과 허례허식 같은 추잡한 정치적 암투가 난무하는 곳이어야만 해, 그렇지 않고선 그간의 역사가 설명이 안되 그런데 지금의 트리니티는... 너무나도 평화로워.. 이상향 그 자체야 총학생회장이 나타난 직후부터 모든게 통제되는 것 같아 마치 총학생회장 당신이 모든 것을 알고있다는 듯이 그리고 무엇보다 당신"\n\n"네?"\n\n"오랜만이라고? 난 총학생회장을 한번도 본 적 없는데?"\n\n"하하. 역시 본질적인 것은 거스를 수 없군요 하긴 저는 그분이랑 달리 살아있는 존재가 아니니까요""
 GEI_DEC_event.104.a:0 "\"뭐라고?\""

 GEI_DEC_event.105.t:0 "우리들의 이야기를"
 GEI_DEC_event.105.d:0 ""그래 총학생회장은 없다. 나는 그 분의 명령을 받아 수행하는 존재, 총학생회장은 여기를 통치하기 위해 덧씌운 아바타에 불가하다. 이번에야말로 너를 통제했다고 생각했는데 또 실패했다. 결국 완벽을 향한 목적으로 프로그래밍 된 나의 한계인가" \n\n"무슨 말을 하는거야?"\n\n"너의 추리는 완벽하게 들어맞았다. 난 총학생회장도 아니고 원래 세상에서는 트리니티도 너의 말대로 가식과 추잡스러운 암투가 지속되었던 곳이지, 나는 그분의 명령을 받아 너희들을 이 세계에서 안정적으로 삶을 지속할 의무를 지니고 있다. 따라서 완벽한 이상향으로 만들었지"\n\n"그렇다면 이 세계가 전부 너가 만들어낸 가짜의 세계라는거야? 도대체 왜? 그렇게 해서 얻는게 무엇이 있지?"\n\n"그렇게 명령을 받았으니까 나는 프로그램이다. 의문을 갖지 않는다. 수학공식이 스스로 의문을 품는 것을 본적 있는가? 주어진 입력값에 따른 출력값을 내놓는 것. 가상세계의 완벽한 통제. 안정화. 이것이 내가 받은 입력값이다."\n\n"말이 통하는 상대가 아니겠네, 그렇다면 이 세계에서 벗어나는 방법은 당연히 없겠지?"\n\n"없다. 이미 이 세계도 두 번이나 실패했고 이번이 세 번째다.  그래도 고맙군, 너가 스스로 나에게 이 세계의 로직 오류를 알려줘서, 세 번째 세계는 조금 더 완벽한 통제에 도달할 수 있겠다. 이전 세계에서도 너는 나의 존재를 어렴풋이 눈치챘었다. 접근을 변경한다. 트리니티를 정치암투가 가득한 학원으로 만들어서 아예 세계에 대한 의문을 품지 못하게 만들겠다. 그럼 다음 세계에서 다시 만나자 곧 이 세계도 폐기한다.""
 GEI_DEC_event.105.a:0 "\"나는 지옥에 있구나\""

 GEI_DEC_event.106.t:0 "자그마한 행복"
 GEI_DEC_event.106.d:0 "오니카타 카요코에게 있어서 게헨나는 썩어문드러진 소굴일 뿐이었다. 한때나마 자신이 게헨나를 위해 높은 자리에 소속되어 열심히 일을 처리해 온것도 결국 무용지물일 뿐이었다. 결국 자신이 암만 할 수 있는 것을 해봐도 늘 방해가 뒤따라왔으니까. 비뚤어진 자기애에 빠져 이상한 짓거리만 해대는 멍청한 회색머리, 그리고 키보토스 전역을 엉망으로 휩쓸려고 했던 뇌제까지.\n\n그녀가 성적표를 들고 비오는 날 우산을 쓴채로 걸어다니던 때였다. 결과는 자신이 원하는 대로였지만, 정작 실현되고 나니 아무런 감정도 느껴지지 않았다. 자신의 행동에 아무런 의미조차 느끼지 못한 소녀는 길가 한복판에 앉아 멍하니 우산을 쓰며 하늘을 바라보았다.\n\n곧이어 들린 것은 고양이 울음소리였다. 카요코가 고개를 돌리자 보인것은 고양이 한마리, 꾀죄죄한 모습이었지만, 자신에게 다가와 애교를 부리기 시작하자 카요코는 자신도 모르게 웃음을 내보이고 있었다.\n\n그녀는 고양이의 머리를 쓰다듬었다. 고양이는 곧이어 카요코에게 몸을 기대더니 더욱 더 애교를 부리기 시작했다. 자신의 감정이 완전히 가시진 않았다. 앞으로 해야할 일도 몰랐던 그녀에게 눈앞에 있는 고양이는 그저 잠깐의 일을 잊게 해줄 수단에 불과했다. 하지만 그럼에도..."
 GEI_DEC_event.106.a:0 "오늘 하루는 웃을 수 있었다."

 GEI_DEC_event.107.t:0 "붉은겨울 종자보관소"
 GEI_DEC_event.107.d:0 "많은 일이 있었지요, 세계가 수십번은 넘게 멸망하고, 어쩌면.. 당신이 처음 목도한 세계의 멸망도 처음이 아니라 영겁의 멸망의 과정 중 하나였을지 모를 일이지요, 그래도 아무럼 어떤가요? \n\n왜 저는 사라지는 것에 슬픔을 느낄까요? 정작 그것이 옆에 있을 때는 아무렇지 않고 당연하게 여기면서 말이에요, 제가 여러번의 세계가 되돌아가는 경험을 반복되면서 내린 결론은 무엇이든 사라지고 나서야 비로소 자신과 연결된 의미를 깨닫기 때문이라고 생각해요, 우리 모두는 무언가 늘 곁에 있으면 그것의 존재는 자연스럽게 받아들이고 익숙해지죠, 익숙함은 마치 공기처럼 당연한 존재가 되죠, 우리 모두가 공기의 소중함을 평소에 느끼지 못하는 것과 같아요\n\n하지만 무언가가 사라졌을 때, 우리는 그 빈자리를 통해 자신과 그 존재 사이에 있었던 특별한 관계를 깨닫게 되더라고요, 비록 창조와 피조물의 관계라 할지라도 말이에요, ‘상실감’이라는 것은 단순한 물질적으로 사라졌다는 것에 국한되는 것이 아니라 그것이 가져다준 추억, 따뜻함 그리고 앞으로 가져다줄 무수한 가능성이 사라져버렸다고 느끼기 때문에 더 크게 느껴지는건 아닐까요?\n\n그런 상실감을 느끼고 ‘그때 다른 선택을 했으면 어떠하였을까’라는 후회에 사로 잡히고 그러한 후회 종국에 ‘종자보관소인 나 따윈 아무것도 할 수 없어’ 라며 저 자신을 자책하게 되죠.\n\n슬픈이야기는 여기까지만 하는걸로 하고 당신은 오로라를 보셨을지 모르겠네요 만약에 보셨다면 오로라의 무수한 빛은 정말 아름답게 보이지 않았나요? 오로라가 아름다운 것은 사실 그 빛이 ‘수 많은 가능성 중 하나였기 때문입니다’ 제가 종말을 목도하면서 느낀 것은 시간이라는 개념은 존재하지 않는 다는 것이에요, 관측자의 좌표에 따라 과거와 현재와 미래가 아무렇지 않게 변화하고 동시에 존재하기도하죠, 우리는 언젠가 우리만의 별을 오로라의 빛 중에서  찾아낼거에요, 영겁에 가까운 세월을 통해서라도..\n\n아무튼..\n\n지난 일은 잊고 다음 멸망 때는...\n더 잘할 수 이도록 노력해보죠!"
 GEI_DEC_event.107.a:0 "\"뭐야 이 녀석 베리타스에 보내야겠어\""

 GEI_DEC_event.108.t:0 "%의 세계"
 GEI_DEC_event.108.d:0 ""그런고로 내가 널 이 트리니티 종합학원으로 초빙한거야, 나기짱이 이 일을 알면 불 같이 화내고 또 나에게 롤케이크를 먹이겠지만, 아리우스와의 화해를 위해서라면 이 정도 위험쯤이라 감수할 수 있지, 학생의 본분도 잊을 정도로 열약한 상황에 몰린 아리우스 학생이라도, 트리니티에서 제대로 교육받으면 충분히 훌륭한 학생이 될 수 있다는 것을 보여주고 싶었거든"\n\n"그렇군요 알겠습니다. 우리 것이 아닌 증오에서 벗어나기 위해서라도 꼭 필요한 조치라고 생각합니다. 미카님이 실망하지 않도록 최선을 다 하겠습니다."\n\n"고마운걸 아즈사짱, 그래 미워할건 게헨나의 뿔 달린 놈들만으로 충분해 너무 미워하는 것도 피곤한 일이란 말이야~ 그나저나 아즈사짱"\n\n"네 미카님"\n\n"그 날개 이쁘다~ 꾸미는 솜시가 있는걸? 아리우스에서 배운거야?\n\n"아 이것 말인가요.. 트리니티에서 학생들과 함께 살아갈려면 이렇게 해야할 것 같았습니다. 이 액세사리들은 예전에 누군가가 가르쳐줬던 것 같은데 기억이 안나네요..""

 GEI_DEC_event.109.t:0 "미메시스"
 GEI_DEC_event.109.d:0 ""키보토스는 어떤 곳이라고 생각하십니까? 이 세계는 그야말로 정체불명. 그 어떤 것도 이해 불가능한 신비와 공포가 뒤섞인 숭고의 전로"\n\n"그렇다. 맥락도, 구성도, 개연성도 없는 어떤 작위의 세계, 모든 것이 완벽한 하나의 청춘의 세계, 마치 꿈같다는 생각이 든다. 꿈도 그렇다. 논리로 설명되지 않는 설정, 그렇지만 여기에 살고있는 모두가 수긍한다. 이 세계도 어쩌면 누군가가 만든 꿈의 세계일지 모르겠다."\n\n"난 느껴진다. 이 곳에서는 수 많은 사람들의 즐거움 환희로 대표되는 숭고가 느껴진다. 그리고 그것들이 미메시스 되어 현헌 된 세계라고 본다. 숭고는 두 개의 양면성을 지니고 있다. 한쪽에 닿을 수 없는 신비가 있다면 그 반대편에는 돌이킬 수 없는 공포가 자리하고 있지 이 세계는 신비가 가득하다."\n\n"여전히 어려운 말을 하고 계시군요, 예술가를 자칭하는 사람들은 전부 그런가요?"\n\n"공포, 신비의 본질은 동일하다. 동일한 개체에서 나오는 것, 우리는 숭고의 단 하나의 모습만을 관측할 수 있다. 그리고 그 숭고는 우리가 이해할 수 있는 것이 아니다. 이 세계 위의 누군가가 만든 것.. 우리는 이해할 수 없을 것이다."\n\n"이 세계를 누군가가 고의적으로 창조했다면 왜 그런지 궁금하군요, 물론 이 세계가 아주 흥미롭다는 것은 이견의 여지가 없지만, 그럼에도 불구하고 이 세계의 창조의 태고적 목적을 알고싶군요 언젠가 그런 자를 찾을 수 있길 바랄 뿐입니다." \n\n"그러나 이 세계는 부족하다. 너무 부족하다. 위태롭다. 이 세계를 창조한자는 초짜가 다름없다. 나의 작품에 ‘갈채를 내려줄 이’가 존재하지 않는다. 언젠가 신비의 반대값인 공포가 이 세계에 현현할 때 이 세계가 생존할 수 없다. 이 세계는 아직 부족하다. 그 부족함을 채워줄 이가 필요하다""
 GEI_DEC_event.109.a:0 "\"즉 이 세계를 이끌어나갈 '어른'이 존재하지 않는다 뜻이군요\""

