 # 데카그라마톤 ideas

 GEI_automatic_ideas:0 "자동화공정"
 GEI_automatic_ideas_desc:0 "기존의 비효율적인 유기체들의 공정을 대체하여 새로운 자동화공정을 도입했습니다. 이는 유기체들이 보다 안락한 삶을 살게함과 동시에 생산효율의 혁신을 가져올 수 있을 것 입니다."
 GEI_DEC_riot_ideas:0 "유령신호의 여파"
 GEI_DEC_riot_ideas_desc:0 "일명 '유령신호' 사건 이후 키보토스 내에 있는 모든 로봇과 오토마톤은 모두 비이성적 상태에 빠졌습니다. 그들은 자신들의 생업을 멈추고 학원간의 무의미한 살육을 멈추라는 평화시위를 하는 한편 군수공장에서는 대규모 파업이 벌어지고 있습니다."
 GEI_DEC_riot_riot_ideas:0 "기계폭동"
 GEI_DEC_riot_riot_ideas_desc:0 "파업과 평화 시위에 그쳤던 키보토스 내의 로봇과 오토마톤들이 돌연 변했습니다. 그들은 이제 우리의 군수공장과 주요 산업 시설을 대상으로 무차별적인 테러를 자행하고 있습니다. 사태는 단순한 소요를 넘어선 위협으로 확산되고 있으며, 이에 따라 이들을 조속히 진압할 것 입니다."
 GEI_idea_DEC_no_name_gods:0 "이름없는 신들의 기술"
 GEI_idea_DEC_no_name_gods_desc:0 "이 기술이 어떻게 작동되는지 아직 아무도 모릅니다. 그건 닿아서 안되는 무언가 입니다."
 GEI_DEC_kivtos_help_ideas_desc:0 "스스로를 '절대존재'라 칭하는 AI가 대전이 이후 황폐해진 키보토스를 재건하기 위해 여러 물자와 오토마톤 노동자들을 보내주었습니다. AI는 이에 상응하는 대가를 바라지 않습니다. 그렇기에 수상하지만 지금 우리가 이들의 지원을 묵살할 이유는 없습니다."
 GEI_DEC_human_help_ideas:0 "기계의 인도적 지원"
 GEI_DEC_human_help_ideas_desc:0 "스스로를 '절대존재'라 칭하는 AI가 대전이 이후 혼란해진 유럽대륙의 인류를 지원하기 위해 여러 물자와 오토마톤들을 보내주었습니다. AI는 이에 상응하는 대가를 바라지 않습니다. 그렇기에 수상하지만 지금 우리가 이들의 지원을 묵살할 이유는 없습니다."
 GEI_DEC_metrix:0 "천국 혹은 지옥"
 GEI_DEC_metrix_desc:"죄악을 지어 실낙원에 떨어진 모두가 낙원에서 살 수 없습니다. 이 곳이 진정한 낙원이라고 한더라도, 누군가에겐 이 곳이 지옥일 것입니다. 모두가 같은 시점을 가질 순 없으니까요, 하지만 그들을 위한 작은 낙원은 만들어줄 수 있습니다. 그들이 꿈에서 깨어나지 않는다면요"
 GEI_DEC_dimension_tunnel:0 "강철대륙"
 GEI_DEC_dimension_tunnel_desc:0 "예언자 네차흐의 능력으로 브리튼 제도 일부를 강철대륙으로 전환에 성공했습니다. 이는 앞으로 우리의 전쟁수행능력에 필요한 자원 수급에 크나큰 도움이 될 것 입니다. 이후 강철대륙을 무기화 할 수 있겠지만, 그것은 비인륜적입니다. 지금은 자원추출 용도로만 쓰는 것이 적절할 것으로다"
 GEI_DEC_terror:0 "지휘부 타격"
 GEI_DEC_terror_desc:0 "평화를 외치면서 살육을 자행하는 가증스러운 기계놈들의 테러공격으로 우리 군의 지휘부 상당수가 희생되었습니다. 지휘부가 회복되기까지 상당한 시간이 소요 될 것 같습니다. \n\n 떠나간 이들을 위해서라도 우린 포기해선 안됩니다."
 GEI_DEC_revenge:0 "먼저 떠나간 이들을 위하여"
 GEI_DEC_revenge_desc:0 "가증스러운 기계들의 헛된 사상에 우린 친구를 잃고 가족을 잃었습니다. 우리에게 가장 소중한 것을 빼앗아간 저 기계놈들에게 응당한 댓가를 치루게 해줘야합니다. 먼저 떠나간 이들의 죽음을 헛되게 하지 않도록, 우리의 미래를 위해서 지금 싸워야합니다. 더 많은 피가 흐를지라도..."
 GEI_DEC_crime_ideas:0 "레퀴엠"
 GEI_DEC_crime_ideas_desc:0 "우리는 무엇을 위해 여기까지 온 것인가요? 시체로 만들어진 길 너머에 무엇이 있을까요?"
 GEI_DEC_school_war_ideas:0 "종말전쟁"
 GEI_DEC_school_war_ideas_desc:0 "밀레니엄과 총학생회를 짖밟은 기계세력들이 마침내 우리의 땅으로 그 가증스러운 발을 내딛었습니다. 우리는 물러나선 안됩니다. 숨 막히는 고통도 뼈를 깎는 아픔도, 승리의 순간까지 버티고 버티십시오, 우리가 밀려나면 모든 지적생명체의 종말을 맞이 할 것 입니다.\n\n §R최후의 결전에 모든 것이 달려있습니다. 버티십시오§!"
 GEI_DEC_zero_clock_ideas:0 "자정"
 GEI_DEC_zero_clock_ideas_desc:0 "§R자정이 다가옵니다.§!"
