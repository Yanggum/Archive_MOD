 GEI_air_force:0 "기초적인 다목적 공중장비를 연구합니다."
 GEI_DEC_battle_shipt_tt:0 "을 연구합니다. 해당 함선은 예언자 호크마<CHOKMAH>의 신체를 복제한 함선입니다. "
 GEI_DEC_crusade_tt:0 "충성스러운 정예보병으로 이뤄진 '크루세이더' 부대를 창설합니다. 이들은 앞으로 있을 성전에서 예언자들과 함께 날카로운 창이 될 것 입니다."
 GEI_DEC_ready_tt:0 "드론 제작소에서 생산된 오토마톤을 배치합니다. 카이저 코퍼레이션과의 전쟁이 임박하였기에 제작되자마자 전선에 긴급 배치되었기에 성능이 저하 되어있습니다.."
 GEI_stabilization:0 "현지를 안정화 합니다."
 GEI_DEC_our_help_tt:0 "우리는 극비리에 인간들과 접촉할 것 입니다. 이들과의 협상이 잘 진행되면 평화를 위한 초석을 만들 수 있을 것 입니다."
 
 
