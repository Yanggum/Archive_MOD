#Gematria Focus
 GEI_The_Colour_Focus_tree:0 "The Color Focus Tree"
 GEI_jaegeon:0 "Reconstruction"
 GEI_jaegeon_desc:0 "To respond to this sudden shift in circumstances, we must rebuild our facilities. We will rapidly reconstruct and repair our infrastructure to adapt to this new world."
 GEI_factoryutilization:0 "Factory Utilization"
 GEI_factoryutilization_desc:0 "We will repurpose the existing factories here, applying slight modifications to make them more suitable for our use. This will rapidly increase our industrial power and enhance our adaptability to this new world."
 GEI_gongjangjadonghwa:0 "Factory Automation"
 GEI_gongjangjadonghwa_desc:0 "By utilizing our existing technologies, we will automate our factories. This goes beyond basic manual automation, drastically reducing the required manpower and allowing those personnel to be redirected elsewhere."
 GEI_gemateuliagunsugongjang:0 "Gematria Military Factory"
 GEI_gemateuliagunsugongjang_desc:0 "We will construct specialized military factories to produce our weaponry, signifying that Gematria can secure meaningful resistance against this new world."
 GEI_yeongusilboggu:0 "Laboratory Restoration"
 GEI_yeongusilboggu_desc:0 "By restoring our ruined laboratories, we can strengthen our research and development capabilities and adapt more quickly to the technologies of the New World."
 GEI_yeongusiseoljeungchug:0 "Research Facility Expansion"
 GEI_yeongusiseoljeungchug_desc:0 "As Gematria's industrial power has grown enough to sustain more research facilities, we will expand them to exponentially increase our R&D capabilities."
 GEI_yeongguggaeib:0 "British Intervention"
 GEI_yeongguggaeib_desc:0 "After we crashed onto these 'British Isles' alongside Kaiser Corporation, we clashed with the current military. While we successfully ended their resistance and established ourselves, Kaiser Corporation still seems to be struggling. We can intervene to help them secure the British Isles."
 GEI_gingeubcheolsu:0 "Emergency Evacuation"
 GEI_gingeubcheolsu_desc:0 "The attempt to help Kaiser Corporation secure the British Isles has ended in a disastrous failure. Kaiser Corporation has been crushed by the forces of the United Kingdom, and we are on the verge of meeting the same fate. We must retreat to Iceland immediately."
 GEI_jaejeongbi:0 "Reorganization"
 GEI_jaejeongbi_desc:0 "Since settling in the British Isles, we must eliminate the remaining local resistance and reorganize the structure to align with Gematria's ideals."
 GEI_hyeonsangpaag:0 "Assessing the Situation"
 GEI_hyeonsangpaag_desc:0 "The phenomenon where the entirety of Kivotos was transferred to this place called 'Earth' must be thoroughly investigated. As part of this process, we need to re-research technologies compatible with the local technological level."
 GEI_uigyeonchungdol:0 "Clash of Opinions"
 GEI_uigyeonchungdol_desc:0 "During the process of reorganizing our entire structure, a conflict of opinions arose among our members. we must converge our views over a long period and determine the direction Gematria will take."

#Gematria - Beatrice Route
 GEI_beateulicheuiseungli:0 "Victory of Beatrice"
 GEI_beateulicheuiseungli_desc:0 "In the meeting to decide Gematria's future, Beatrice's proposal has gained significant support. Beatrice will now serve as the official leader of Gematria."
 GEI_sinbijigjo:0 "Weaving the Mystery"
 GEI_sinbijigjo_desc:0 "Utilizing research materials secured from Arius, Beatrice has developed a method to extract Mystery amidst the chaos of Kivotos. We will re-secure the Mystery that has become drastically scarce since our arrival and solve this chronic issue."
 GEI_aliuseucheolsu:0 "Arius Withdrawal"
 GEI_aliuseucheolsu_desc:0 "As the situation changes rapidly, we may no longer be able to maintain our influence over the Arius Branch School. We will scrape together and move the last remaining resources from Arius."
 GEI_hagsaengdeuleuldongwonhada:0 "New Arius Students"
 GEI_hagsaengdeuleuldongwonhada_desc:0 "By utilizing our remaining influence in the Arius Branch, we can draw students to our side. We will use them to strengthen Gematria's defenses and prepare for the approaching threats in the British Isles."
 GEI_loyeolbeulleodeuhwagbo:0 "Securing the Royal Blood"
 GEI_loyeolbeulleodeuhwagbo_desc:0 "For Beatrice's ideals, the Arius Squad—and particularly the Royal Blood among them—is essential. We will make contact to secure the Royal Blood, 'Atsuko'."
 GEI_uisigcheosdangye:0 "Ritual, The First Step"
 GEI_uisigcheosdangye_desc:0 "Beatrice has long dreamed of possessing Mystery and ascending as a new existence. Now that the greatest obstacle—securing the Royal Blood—is complete, Beatrice takes her first step toward performing her ritual."
 GEI_munjehaegyeol:0 "Problem Solving"
 GEI_munjehaegyeol_desc:0 "During the first stage of the ritual, we realized that the Mystery required is insufficient. The Mystery here is simply too scarce and weak compared to Kivotos. We will attempt to resolve this issue."
 GEI_hyeonsileuljigsihada:0 "Facing Reality"
 GEI_hyeonsileuljigsihada_desc:0 "Upon learning that the Mystery required for the ritual is insufficient, Beatrice made a decision that betrays her own beliefs. She has chosen to force the ritual and settle for obtaining an incomplete Mystery. We do not yet know what consequences this choice will bring."
 GEI_chawoncheongongyeongu:0 "Dimensional Perforation Research"
 GEI_chawoncheongongyeongu_desc:0 "If we crossed over, we can go back. Beatrice and the researchers will focus on this research to find a way to draw the abundant Mystery of Kivotos here—or find a way back—to finally conduct the 'perfect' ritual."
 GEI_jeobchog:0 "Contact"
 GEI_jeobchog_desc:0 "Research on the Dimensional Perforation Device is complete, and the first experiment is at hand. We will puncture a small dimensional hole to briefly connect 'elsewhere' with this place, testing if Mystery can be transferred through this tiny opening. Surely, everything is under control and perfectly safe."
 GEI_uisigneomeolo:0 "Beyond the Ritual"
 GEI_uisigneomeolo_desc:0 "The Dimensional Perforator has been confirmed to be fully functional... presumably. Beatrice will now utilize the vast Mystery to proceed with the second ritual. The path to perfection was closer than expected.\n\n§tAscension.§!"
 GEI_no:0 "The Irreversible Path"
 GEI_no_desc:0 "§t"It is done. The colors are bleeding into this world, and soon, there will be no 'here' or 'there' left to distinguish."§!"

