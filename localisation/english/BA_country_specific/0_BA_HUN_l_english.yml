#Events
 BA_HUN_event.1.t:0 "Hungarian Demand for Transylvania"
 BA_HUN_event.1.desc:0 "[HUN.GetName] has claimed that the Transylvania region lost through the Treaty of Trianon should be returned to Hungary now that the treaty has been nullified.\n\nEven if it was once their territory, is it not now the rightful territory of our nation? Ceding that land would likely strike a blow to our government's legitimacy and national prestige."
 BA_HUN_event.1.a:0 "War must be avoided."
 BA_HUN_event.1.b:0 "Transylvania must remain in Romania."

 BA_HUN_event.2.t:0 "Hungarian Demand for Vojvodina"
 BA_HUN_event.2.desc:0 "[HUN.GetName] has claimed that the Vojvodina-West Banat region lost through the Treaty of Trianon should be returned to Hungary now that the treaty has been nullified.\n\nEven if it was once their territory, is it not now the rightful territory of our nation? Ceding that land would likely strike a blow to our government's legitimacy and national prestige."
 BA_HUN_event.2.a:0 "War must be avoided."
 BA_HUN_event.2.b:0 "Vojvodina must remain in Serbia."

 BA_HUN_event.3.t:0 "Unification of the Balkans"
 BA_HUN_event.3.desc:0 "Finally, after long discussions, Hungary will be reborn as it integrates into the Balkan Socialist Republic.\n\nWe have reached the status of a new European Great Power, where the Magyar and Balkan peoples are united under the red flag and the red rose. Much like the Union of Soviet Socialist Republics—the USSR. However, unlike the Soviets, we will dye the whole world red to become a 'true' socialist state. Let the red roses bloom everywhere in the world.\n\nRegardless, we are the only socialist federation in the Balkans! Long live Socialism!"
 BA_HUN_event.3.a:0 "Long live the Union of Balkan Socialist Republics!"

 BA_HUN_event.9.t:0 "Unrest in @UKR Ukrainian Soviet Socialist Republic"
 BA_HUN_event.9.desc:0 "The Ukrainian Soviet Socialist Republic has recently become chaotic due to numerous uprisings, strikes, and acts of sabotage.\nExperts state that this isn't just a simple conflict between two ethnic groups, but that [HUN.GetName] is plotting the division of the federation.\n\nWhether this is the truth or not remains to be seen."
 BA_HUN_event.9.a:0 "Hmm..."
 BA_HUN_event.12.a:0 "Traitors!"

 BA_HUN_event.13.t:0 "Re-commissioning Horthy as an Officer"
 BA_HUN_event.13.desc:0 "Miklós Horthy was the leader of our kingdom and a former Admiral of the Austro-Hungarian Navy.\nTo strengthen our national defense, we need to consider re-commissioning him as an officer.\n\nThough he was a naval officer in the past, given the current situation, he might be needed in the Army."
 BA_HUN_event.13.a:0 "Return to the Navy!"
 BA_HUN_event.13.b:0 "He is needed in the Army."

 BA_HUN_event.14.t:0 "Hungarian Demand for Galician Secession"
 BA_HUN_event.14.desc:0 "Following the assassination of Horthy and the adoption of pro-Soviet policies, Hungary is now pressuring us to separate the Galicia region from Poland and establish a socialist government there.\n\nIf we do not accept Hungary's demands, we will likely find ourselves at war with them."
 BA_HUN_event.14.a:0 "War must be avoided."
 BA_HUN_event.14.b:0 "Galicia must remain in Poland."

 BA_HUN_event.15.t:0 "Peasants Rebell against Collectivization!"
 BA_HUN_event.15.desc:0 "Peasants opposing collectivization have organized an uprising."
 BA_HUN_event.15.a:0 "Burn the petty-bourgeois reactionaries!"

 BA_HUN_event.16.t:0 "Rooting Out Reactionary Elements"
 BA_HUN_event.16.desc:0 "Since the establishment of a government for workers and peasants, we must not forget the capitalist-monarchist moles who exploited and oppressed them.\n\nWe must show the reactionaries remaining inside Hungary the true taste of revolution. Is that not what a regime for workers and peasants, a true socialist utopia, is about? We must find them quickly."
 BA_HUN_event.16.a:0 "Root them all out!"

 BA_HUN_event.17.t:0 "End of the Great Purge"
 BA_HUN_event.17.desc:0 "After three rounds of purging, the long Great Purge has finally come to an end. Quite a few people may have been dealt with, but we hope it was the right choice for our homeland, our people, our system, and socialism.\n\nRegardless, the purge is over, and a new future awaits us. No one can tell if it will be a bright future or one as dark as pitch. But we have always overcome hardships.\n\nLet's take heart. For our most proud homeland, [HUN.GetName]."
 BA_HUN_event.17.a:0 "Accomplished."

 BA_HUN_event.18.t:0 "The First Great Purge"
 BA_HUN_event.18.desc:0 "About fifteen days after we began rooting out reactionary elements, we have caught a significant number of counter-revolutionaries, such as capitalist moles, fascist sympathizers, and monarchists. We must let them, the enemies of socialism, feel what a 'state of workers and peasants' truly is.\n\nJustice prevailing over evil—that is the natural order."
 BA_HUN_event.18.a:0 "Dispose of them all."

 BA_HUN_event.19.t:0 "The Second Great Purge"
 BA_HUN_event.19.desc:0 "Last month, after the winds of blood swept through Hungary, several figures who held key political and military positions during the 'Kingdom of Hungary' era were added to the purge list. They might be the talented administrators or capable officers we need, but they are merely slaves and collaborators of monarchism.\n\nHowever, the choice is yours. Saving these people might bring some benefit, or it might result in a great loss.\n\nMake your choice. What will you do?"
 BA_HUN_event.19.a:0 "No mercy for the enemies of socialism!"
 BA_HUN_event.19.b:0 "We might need them."

 BA_HUN_event.20.t:0 "The Third Great Purge"
 BA_HUN_event.20.desc:0 "Most of the moles have been dealt with, but there may still be spies hiding who could pose a threat to the system. Dealing with them might require much blood and sacrifice, but if it brings stability to our nation, our system, and socialism, it may be blood well spent.\n\nIf future generations re-evaluate history, this could be seen as the right choice for Hungary's stability, peace, and prosperity, or the worst mistake possible.\n\nThe choice is yours. Choose wisely."
 BA_HUN_event.20.a:0 "Dispose of every last mole!"
 BA_HUN_event.20.b:0 "This might be dangerous..."

 BA_HUN_event.21.t:0 "[FROM.GetName]'s Invitation to the Danubian Federation"
 BA_HUN_event.21.desc:0 "[FROM.GetName] has sent a proposal to integrate our nation into their federation. Since declaring the Danubian Federation, [FROM.GetName] has been making various diplomatic and political efforts to integrate neighboring countries, and it seems we are the current target.\n\nWe can accept this proposal to bring lasting peace to the Danube, or we can reject it and defend Yugoslavia as a sovereign independent state."
 BA_HUN_event.21.a:0 "We will join the federation."
 BA_HUN_event.21.b:0 "Always, we are Yugoslavia."

 BA_HUN_event.22.t:0 "[FROM.GetName]'s Rejection of the Danubian Federation"
 BA_HUN_event.22.desc:0 "Despite our various diplomatic and political efforts, [FROM.GetName] has rejected joining our Danubian Federation. [FROM.GetName] stated they cannot give up Yugoslavia's status as a sovereign independent state, expressing concern by comparing it to their own ethnic conflicts as a dangerous idea.\n\nWe could respond to [FROM.GetName]'s reaction by building the federation through blood, but we would not be able to achieve true integration."
 BA_HUN_event.22.a:0 "Peace is more precious than anything."
 BA_HUN_event.22.b:0 "All of you are our enemies!"

 BA_HUN_event.23.t:0 "[FROM.GetName] Joins the Danubian Federation"
 BA_HUN_event.23.desc:0 "[FROM.GetName] has positively reviewed our invitation to the Danubian Federation and has signed several procedures to integrate into a single state. [FROM.GetName] announced that unifying the Danubian region will silence centuries of Balkan chaos and achieve lasting peace, and they have agreed to actively cooperate in joining the federation."
 BA_HUN_event.23.a:0 "A mightier federation."

 BA_HUN_event.101.t:0 "Spread of Socialist Sentiment in [ROOT.Getname]"
 BA_HUN_event.101.desc:0 "The workers are whispering of a world without masters. Is this the 'paradise' the Red Archduchess spoke of, or just a new kind of chaos? Either way, the red banner is appearing in the streets of [ROOT.Getname]."
 BA_HUN_event.101.a:0 "Those Reds..."
 BA_HUN_event.102.t:0 "[ROOT.Getname] Workers' Strike"
 BA_HUN_event.102.desc:0 "The factories have gone silent. No gears turning, no smoke rising. The students of Shanhaijing might call it 'efficient reorganization,' but here, it's just a lot of angry people with placards."
 BA_HUN_event.103.t:0 "Workers Arming Themselves"
 BA_HUN_event.103.desc:0 "Tools of labor are being traded for tools of war. It seems the 'balance' of the region is shifting towards lead and gunpowder."
 BA_HUN_event.104.t:0 "Workers' Demand for Regime Change"
 BA_HUN_event.104.desc:0 "They stand before the palace gates, not with petitions, but with demands. They want the old world gone."
 BA_HUN_event.104.a:0 "Who do you think you are?"
 BA_HUN_event.104.b:0 "If it is what they wish..."
 BA_HUN_event.105.t:0 "Hungarian Offer of Support"
 BA_HUN_event.105.desc:0 "Hungary, which has been supporting our revolution, has offered direct intervention. We can accept this offer to achieve the revolution."
 BA_HUN_event.105.a:0 "Accept the offer."
 BA_HUN_event.105.b:0 "We are not puppets."
 BA_HUN_event.106.t:0 "Unified Balkans"
 BA_HUN_event.106.desc:0 "One flag, one people, one socialist future. Even the Great Sage would be impressed by such a massive reorganization of the map."
 BA_HUN_event.106.a:0 "Long live the United Balkans!"
 BA_HUN_event.106.b:0 "Not interested."
 BA_HUN_event.107.t:0 "[HUN.Getname] Submits to Us"
 BA_HUN_event.107.desc:0 "The proud Magyars have bowed. A strategic victory for the revolution, or perhaps just a necessary step in the grand script of history."
 BA_HUN_event.107.a:0 "Welcome, comrades."
 BA_HUN_event.108.t:0 "Operation Austrian Liberation - Operational Plan"
 BA_HUN_event.108.desc:0 "We must choose a plan for Operation Austrian Liberation. \n\nThe mainstream Hungarian command advocated for 'Operation Vienna,' a swift attack on Vienna, while some argued for 'Operation Innsbruck,' building a stable front before going on the offensive."
 BA_HUN_event.108.a:0 "Operation Vienna adopted."
 BA_HUN_event.108.b:0 "Operation Innsbruck adopted."
 BA_HUN_event.109.t:0 "Price of Revolution"
 BA_HUN_event.109.desc:0 "While praising our peaceful change of government, Hungary has sent an official letter demanding we completely root out opposition forces within our country. We can act according to Hungary's orders or become hostile to them."

 BA_HUN_event.200.t:0 "Reclaiming the Austrian Region"
 BA_HUN_event.200.desc:0 "Now that our nation has proclaimed the restoration of the Habsburg Empire and liberated the Austrian region, we can declare the rightful return of the Austro-Hungarian Empire."
 BA_HUN_event.200.a:0 "The Habsburg rule has returned!"

 BA_HUN_event.900.t:0 "Collapse of the Empire"
 BA_HUN_event.900.desc:0 "The structure was too heavy, the foundations too fractured. Like a tower of cards in a Kivotos storm, the Empire falls."
 BA_HUN_event.900.a:0 "Damn it."

#News Events
 BA_HUN_news.1.t:0 "Romania Accepts Hungarian Demands"
 BA_HUN_news.1.desc:0 "Romania has accepted the Hungarian demand for the cession of Transylvania.\n\nThe strong demand for territorial reclamation has been granted, and Transylvania, the land of the Magyars, has returned to Hungary's embrace."
 BA_HUN_news.1.a:0 "Surprising."
 BA_HUN_news.2.t:0 "Romania Rejects Hungarian Demands"
 BA_HUN_news.2.desc:0 "Romania has rejected the Hungarian demand for the cession of Transylvania.\n\nThe strong demand for territorial reclamation has been refused, and Hungarian diplomatic authorities are considering war with Romania."
 BA_HUN_news.2.a:0 "Could this turn into war?"
 BA_HUN_news.3.t:0 "Yugoslavia Accepts Hungarian Demands"
 BA_HUN_news.3.desc:0 "Yugoslavia has accepted the Hungarian demand for the cession of Vojvodina.\n\nThe strong demand for territorial reclamation has been granted, and Vojvodina, the land of the Magyars, has returned to Hungary's embrace."
 BA_HUN_news.3.a:0 "Surprising."
 BA_HUN_news.4.t:0 "Yugoslavia Rejects Hungarian Demands"
 BA_HUN_news.4.desc:0 "Yugoslavia has rejected the Hungarian demand for the cession of Vojvodina.\n\nThe strong demand for territorial reclamation has been refused, and Hungarian diplomatic authorities are considering war with Yugoslavia."
 BA_HUN_news.4.a:0 "Could this turn into war?"
 BA_HUN_news.5.t:0 "Hungarian Unification of the Balkans"
 BA_HUN_news.5.desc:0 "Hungary announced today through [HUN.GetLeader] that the socialist nations of the Balkans will integrate and reorganize into a single state, the Union of Balkan Socialist Republics.\nThe axis of the world is shifting toward socialism, and a new hegemon has been born in the Balkans."
 BA_HUN_news.5.a:0 "A unified Balkans, huh..."

