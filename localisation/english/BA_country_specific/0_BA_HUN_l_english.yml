 BA_HUN_wprnrxhdgkq:0 "Imperial Integration"
 BA_HUN_wprnrxhdgkq_desc:0 "\n\n£GFX_BA_HUN_decisions_OHHUNG\n\n\n\n\n                                             §Y"Indivisible and Inseparable."§!\n\nWhat did the Treaty of Versailles leave us? Division, conflict, and a sense of inferiority toward the victors. Our empire was split apart by Versailles, and in that process, numerous conflicts left us deeply scarred. Disillusionment with our defeated homeland and resentment toward the winners grew within us, sharpening the blade of revenge—until the situation changed drastically.\n\nMysterious forces landed in Europe, and the tide turned. Hungary narrowly avoided the catastrophe, but the victors of the Great War were struck full force.\nOur kingdom moved quickly. Ignoring the Treaty of Versailles, we announced the rebirth of the Habsburgs and liberated Austria and Czechia from the outsiders to proclaim the Empire.\n\n                                         §tOur Empire shall be the last in the world.§!"
