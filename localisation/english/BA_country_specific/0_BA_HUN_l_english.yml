 HUN_foc_2-2-11_focus_flag:0 "Completed the §YTowards a United Balkans§! focus"
 HUN_SOV_research_group_name:0 "Hungarian-Soviet Research Alliance"
 HUN_SOV_research_group_desc:0 "Hungarian-Soviet Research Alliance"
 HUN_Kun_Bela:0 "Kun Béla"
 HUN_elisabeth_maria_petznek:0 "Elisabeth Marie von Österreich"
 HUN_elisabeth_maria_habsburg:0 "Elisabeth Marie von Habsburg"
 HUN_Szalasi_Ferenc:0 "Szálasi Ferenc"
 BA_HUN_faction_1:0 "The Second Central Powers"
 HUN_GATHERING_STORM_DESC_1:0 "The Dual Monarchy was defeated in the Great War and the Empire was dismantled. While we achieved independence, it was far from a sweet victory. The fledgling republic collapsed without managing the chaos, and the subsequent Council Republic fell after suffering the humiliation of the Treaty of Trianon. Since then, we have become a Regency Kingdom ruled by an Admiral.\n\nIn 1935, a mysterious force landed in Europe and everything burned. The Entente, who once forced treaties upon us, fell one by one, and Romania has become a toothless tiger, groaning in weakness. Whether we like it or not, the time for choice is approaching."
 HUN_PACT_OF_SHANHAIJING_FACTION:0 "Shanhaijing Central District-Budapest Accord"
 HUN_central_powers_FACTION:0 "Central Powers"
 HUN_elizabeth_marie_habsburg_flag:0 "Restored the §YAustro-Hungarian Empire§!"

#Focuses
#Elisabeth Marie
 HUN_elizabeth_marie:0 "The Red Archduchess"
 HUN_elizabeth_marie_desc:0 "The Red Archduchess, Elisabeth Marie, is regarded as a highly progressive member of the Habsburg family. By restoring her to the throne and inviting her, we can achieve the restoration of the Habsburgs and the establishment of a free Hungary all at once."

 HUN_dissolution_of_parliament:0 "Dissolution of Parliament"
 HUN_dissolution_of_parliament_desc:0 "By dissolving the existing parliament and introducing a new political system, we will reorganize the nation's governance structure."

 HUN_parliamentary_takeover:0 "Parliamentary Takeover"
 HUN_parliamentary_takeover_desc:0 "As a member of the Social Democratic Party, Elisabeth Marie will exercise powerful influence over the parliament."

 HUN_social_welfare_budget_increase:0 "Welfare Budget Expansion"
 HUN_social_welfare_budget_increase_desc:0 "We will drastically increase the social welfare budget to improve the living standards of the people and strengthen the social safety net so that no one starves to death anymore."

 HUN_womens_suffrage:0 "Women's Suffrage"
 HUN_womens_suffrage_desc:0 "We must grant women the right to vote to promote political participation and equality."

 HUN_worker_rights_advancement:0 "Inclusion of Trade Unions"
 HUN_worker_rights_advancement_desc:0 "By inviting trade unions into the government, we will improve workers' rights and increase the regime's popularity."

 HUN_economic_policy_shift:0 "Economic Policy Shift"
 HUN_economic_policy_shift_desc:0 "The existing economic policy is one where the government does not intervene heavily in the market. However, as this policy is causing numerous economic issues, we must shift our economic course."

 HUN_economic_control:0 "Strengthened Controls"
 HUN_economic_control_desc:0 "Strengthen state control and regulation of economic activities to increase stability and efficiency."

 HUN_self_determination:0 "Self-Determination of Nations"
 HUN_self_determination_desc:0 "We will establish National Councils for the self-determination of each ethnic group, moving toward an equal federation."

 HUN_austria_restoration:0 "Liberation of Austria"
 HUN_austria_restoration_desc:0 "Our Austrian brothers have been devastated by otherworldly invaders, and many Austrians are being oppressed. We will liberate Austria and proclaim the reconstruction of Austria-Hungary once again."

 HUN_danube_federation:0 "Danubian Federation"
 HUN_danube_federation_desc:0 "The old Habsburg Empire was built on the dominance over other nations. Now, we will cast off that past and establish an equal Danubian Federation."

 HUN_habsburg_federation:0 "Habsburg Constitutional Empire"
 HUN_habsburg_federation_desc:0 "Under the leadership of the House of Habsburg, we will rebuild a constitutional empire to establish a strong central government and promote further socio-economic reforms."

 HUN_centralization:0 "New Centralization"
 HUN_centralization_desc:0 "To push forward more reforms, we will establish a powerful centralized government that covers not only the social sector but also the economic sector extensively."

 HUN_women_soldiers:0 "Creation of Women's Units"
 HUN_women_soldiers_desc:0 "We must establish women's military units to realize gender equality within the army and expand the role of women."

 HUN_yugoslavia_alliance:0 "Alliance with Yugoslavia"
 HUN_yugoslavia_alliance_desc:0 "Leaving past ill-will behind and building a strategic alliance with Yugoslavia will be of great benefit to our nation's future and mutual development."

 HUN_austria_integration:0 "Austrian Union"
 HUN_austria_integration_desc:0 "Now that we have liberated the Austrian region, we can establish a federation with Austria as the first step of the Danubian Federation."

 HUN_yugoslavia_unification:0 "Yugoslavian Federal Integration"
 HUN_yugoslavia_unification_desc:0 "Now that we control the Yugoslavian region, we can invite Yugoslavia to be a member of the Danubian Federation."

 HUN_yugoslavia_federation_proposal:0 "Yugoslavian Proposal"
 HUN_yugoslavia_federation_proposal_desc:0 "Since Yugoslavia is currently in a close relationship with our nation, we can propose that they join our federation."

 HUN_federal_empire:0 "Great Danubian Federation"
 HUN_federal_empire_desc:0 "The Danubian nations shall become one and never be separated again. As an equal union of republics for each nation, the Danubian Federation will exist forever."

