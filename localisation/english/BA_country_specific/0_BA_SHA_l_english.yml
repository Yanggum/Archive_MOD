 # 승전 공용
 SHA_strengthening_identity_of_southern_kivotos: "Strengthen Southern Kivotos Identity"
 SHA_strengthening_identity_of_southern_kivotos_desc: "We are one people under the Southern sun."
 SHA_Special_Military_Operation_for_Abydos: "Defeat Abydos"
 SHA_Special_Military_Operation_for_Abydos_desc: "The desert school will learn the power of the Dragon."
 SHA_Special_Military_Operation_for_Slovakia: "Subjugate Slovakia"
 SHA_Special_Military_Operation_for_Slovakia_desc: "Integrating our northern neighbors into the fold."
 SHA_Establishment_of_the_Governor_General: "Hyakkiyako Governor-General"
 SHA_Establishment_of_the_Governor_General_desc: "Firm control over the newly acquired territories."
 SHA_Establishment_of_the_Governor_General_tt: "Effect activates when owning any §Y@HYA[HYA.GetAdjective]§! Core States."
 SHA_industrial_exploitation: "Industrial Exploitation"
 SHA_industrial_exploitation_desc: "The resources of the conquered belong to the victors."
 SHA_Leave_SHA: "Expel Hyakkiyako Students from Academy"
 SHA_Leave_SHA_desc: "No more divided loyalties. Shanhaijing for Shanhaijing."
 SHA_Liberation_of_South_Kivotos: "March of Liberation"
 SHA_Liberation_of_South_Kivotos_desc: "Our flags fly over the southern lands!"
 SHA_Utopia: "Utopia"
 SHA_Utopia_desc: "Under the blood-stained struggle, Southern Kivotos has been integrated into one academy, and everyone is rejoicing and raising a toast to the integration. We have reached everyone's utopia, and all of us Southern Kivotos people will live abundantly and safely."

 # 외교
 SHA_Shanhaijing_fact: "Establishment of Shanhaijing Pact"
 SHA_Shanhaijing_fact_desc: "A brotherhood of schools to ensure our mutual safety."
 SHA_shanhaijing_fact_trigger_tt: "§YPolitical Path§! determined."
 SHA_emergency_measures: "Rapid Rearmament"
 SHA_emergency_measures_desc: "The world is on fire. We need more guns."
 SHA_Expansion_of_military_factories: "Leopoldau Arsenal"
 SHA_Expansion_of_military_factories_desc: "Increasing our industrial output to meet the demands of war."
 SHA_invade_of_Hyakkiyako: "Reclaim Academy Territories"
 SHA_invade_of_Hyakkiyako_desc: "What was stolen must be returned."

 # 패전 루트

 SHA_fall_of_dragon: "Fall of the Dragon"

 SHA_defeat_kisaki_focus_1: "Reinstate Ryuge Kisaki"
 SHA_defeat_kisaki_focus_1_desc: "Ryuge Kisaki was originally a victim of history. She was nothing more than a puppet put forward by those who usurped power to dress up their own legitimacy. Nevertheless, she is the symbol of Shanhaijing's integration and the true Master who continues the pulse of long history."
 SHA_defeat_kisaki_focus_2: "Restore the Genryumon"
 SHA_defeat_kisaki_focus_2_desc: "A series of reforms promoted by previous governments were focused on weakening the Genryumon's authority. However, such governments eventually collapsed due to military coups, and we reinstated the legitimate Master, Ryuge Kisaki. Now what remains is to regain the honor and status of the Genryumon."
 SHA_defeat_kisaki_focus_3: "Southern Kivotos Union"
 SHA_defeat_kisaki_focus_4: "Spread of Southern Kivotos Integralism"
 SHA_defeat_kisaki_focus_5: "Shanhaijing Non-Aligned Movement"
 SHA_defeat_kisaki_focus_6: "Land of the Silent Morning"

 SHA_defeat_mina_focus_1: "Continue Military Government"
 SHA_defeat_mina_focus_1_desc: "To solve the total problems faced by Shanhaijing, we reached the conclusion that choosing to maintain the military government is the best. Of course, our government may lack in terms of legitimacy, but now there is no luxury of wasting time on unnecessary decision-making processes."
 SHA_defeat_mina_focus_2: "Spread of Revanchism"
 SHA_defeat_mina_focus_4: "Aircraft Testing"
 SHA_defeat_mina_focus_5: "Secret Rearmament"
 SHA_defeat_mina_focus_6: "Mobilization Order"
 SHA_defeat_mina_focus_7: "Death or Dishonor"

 SHA_defeat_industry_focus_1: "Attempt Economic Independence"
 SHA_defeat_industry_focus_1_desc: "We will not rely on anyone else for our survival."
 SHA_defeat_industry_focus_2: "Renegotiate Treaty of Gaigaku"
 SHA_defeat_industry_focus_2_desc: "The Treaty of Gaigaku has become an excessively harsh treaty that has eaten away the very foundation of Shanhaijing's growth. Accordingly, Shanhaijing will mobilize diplomats to renegotiate the treaty and strive to adjust it in a less harsh direction than before."
 SHA_add_HYA_SHA_huzika: "Sign §YTreaty of Gaigaku§!"
 SHA_add_HYA_SHA_huzika_tt: "Current Days [?SHA_add_HYA_SHA_huzika:days|Y0]"
 SHA_defeat_industry_focus_3: "Lift Restrictions on Black Tortoise Promenade"
 SHA_defeat_industry_focus_4: "Support Black Tortoise Promenade"

 # 국민정신
 SHA_encouraged_cooperatives: "Encourage Cooperatives"
 SHA_encouraged_cooperatives_desc: "Together we are stronger. Shared labor for shared success."
 SHA_exports: "Encourage Exports"
 SHA_exports_desc: "Despite somewhat awkward relations, trade between Austria and the former imperial nations cannot be taken lightly. The economic benefits brought by their investment are providing considerable vitality to the Shanhaijing economy, and for that very reason, we must actively encourage such trade and exchange."
 SHA_merchant_alliance: "Pro-Merchant Policy"
 SHA_merchant_alliance_desc: "Keep the spices flowing and the coffers full."
 SHA_foreign_assets: "Nationalization of External Assets"
 SHA_foreign_assets_desc: "What's yours is now ours, for the good of the school."
 SHA_austrian_unemployment_idea: "Massive Austrian Unemployment"
 SHA_austrian_unemployment_idea_desc: "The legacy of massive unemployment that the previous Austrian government failed to solve was handed down intact to Shanhaijing."
 SHA_austrian_unemployment_idea2: "Austrian Unemployment"
 SHA_austrian_unemployment_idea2_desc: "The Austrian unemployment problem is being solved. Nevertheless, the scale of the unemployed is significant and it seems that special efforts are needed to solve this problem."
 SHA_austrian_unemployment_idea3: "Skilled Workers"
 SHA_collapsed_economy_base: "Shanhaijing's commerce has enjoyed long-standing prosperity, to the extent that it's no exaggeration to say it's the most developed academy in commerce within Kivotos. However, the Genryumon's coercive control and restrictive trade policies allowed only in specific areas formed a unique economic structure for Shanhaijing, which appeared stable on the surface but internally, merchant dissatisfaction was slowly building up."
 SHA_collapsed_economy: "Collapsed Shanhaijing Economy"
 SHA_collapsed_economy_desc: "$SHA_collapsed_economy_base$\n\nAnd finally, the event that ended everything occurred. The unprecedented event called the 'Great Migration' was enough to stifle the Shanhaijing economy from its cradle. Trade routes were cut, commercial districts collapsed, and prosperity built over a long time crumbled in an instant. Amidst the crisis, merchants are turning radical. For survival, voices rejecting the old order and demanding new ways are growing. Decisive intervention from the Genryumon is absolutely necessary before even more radical forces seize control and fall into an uncontrollable state."
 SHA_collapsed_economy_idea2: "Recovering Shanhaijing Economy"
 SHA_collapsed_economy_idea2_desc: "$SHA_collapsed_economy_base$\n\nWith the misfortune of the Great Migration added to this internal instability, the Shanhaijing economy was shaken to its roots. Fortunately, thanks to the active intervention of the Genryumon, it barely stopped its fall and began to show signs of recovery, but we must not be satisfied with merely having prevented the worst collapse. Passing the crisis is just the starting point. Now is the time to elevate Shanhaijing to a level higher than before and achieve true economic revival."
 SHA_collapsed_economy_idea3a: "Early Capitalist Economy"
 SHA_collapsed_economy_idea3a_desc: "$SHA_collapsed_economy_base$\n\nIf we have captured economic opportunities provided by foreigners, we must utilize them to the fullest. Overseas capital attracted through trade with friendly trading partners is becoming a reliable driving force supporting the continuous development of our economy."
 SHA_collapsed_economy_idea4a: "Shanhaijing Economic Miracle"
 SHA_collapsed_economy_idea4a_desc: "$SHA_collapsed_economy_base$\n\nWhile other regions are fighting to occupy a handful of crumbs, the Central Special District and Shanhaijing are standing alone and shining like a bright city on a hill even amidst the darkness of the times. May our prosperity continue forever!"
 SHA_collapsed_economy_idea3b: "Academy-Fostered Economy"
 SHA_collapsed_economy_idea3b_desc: "$SHA_collapsed_economy_base$\n\nIt was clearly revealed through the unprecedented event of 1935 that Shanhaijing's economic structure, which was led by merchants, is vulnerable to external threats. Accordingly, we are strengthening intervention in the overall economy and moving toward the goal of complete self-sufficiency in both trade and economic management."
 SHA_collapsed_economy_idea4b: "Heart of Academy Reconstruction"
 SHA_collapsed_economy_idea4b_desc: "$SHA_collapsed_economy_base$\n\nShanhaijing's economy is well worth serving as a model for other academies. Although we haven't reached complete self-sufficiency yet, we are making remarkable progress in reversing the aftermath of the disastrous economic crisis. Let's work hard so Shanhaijing can establish itself as a model for economic reconstruction."
 SHA_increased_taxes_idea: "Increased Taxes"
 SHA_pare_military_spending_idea: "Reduced Military Spending"
 SHA_industrial_relief_idea: "Merchant Relief"
 SHA_three_year_plan_idea: "3-Year Plan"
 
 SHA_Austrian_fascist_militia: "Austrian Militia"
 SHA_Austrian_fascist_militia_desc: "As Shanhaijing migrated, Austria, which was in an unarmed state, surrendered helplessly without even a chance to resist. However, Shanhaijing's rule came as another threat to the Austrians. Those who refused to accept the rule took up arms and went into resistance, causing constant chaos in the Shanhaijing system by waging sporadic guerrilla warfare."
 SHA_shanhaijing_isolation: "Shanhaijing Isolationism"
 SHA_shanhaijing_isolation_desc: "Tradition first, outsiders second. We keep our secrets to ourselves."
 SHA_Eastern_Alchemy_Society_idea_desc: "The Alchemist Association is a club that researches alchemy appearing in Shanhaijing. While it may look somewhat unscientific on the surface, in reality, it is closer to a modern chemical and biological laboratory. Their ultimate goal is to create the elixir of immortality, and for this, they are experimentally creating various elixirs.\n\nOf course, they know that immortality is close to impossible, but by intentionally setting the goal high, they aim to try new things and lead important discoveries in the research process."
 SHA_Eastern_Alchemy_Society_low: "Low Alchemist Association Budget"
 SHA_Eastern_Alchemy_Society_low_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_medium: "High Alchemist Association Budget"
 SHA_Eastern_Alchemy_Society_medium_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_high: "Very High Alchemist Association Budget"
 SHA_Eastern_Alchemy_Society_high_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$\n\nRecently, voices of concern have been growing among students. This is because rumors are spreading that the current government is intentionally concentrating budget support only on the Alchemist Association, and other clubs are failing to play their roles. Of course, providing a sufficient budget to the Alchemist Association is highly likely to contribute to national development, but it will be difficult to avoid citizen dissatisfaction and social chaos."
 SHA_Eastern_Alchemy_Society_super_low: "Alchemist Association Budget Cut"
 SHA_gathering_of_radicals_idea: "Gathering of Radicals"
 SHA_gathering_of_radicals_idea_desc: "Radicals are gathering with a certain political color. I don't know what they're up to, but it doesn't seem like good news for the current Master Kisaki."
 SHA_emergency_measures_idea: "Emergency Measures"
 SHA_emergency_measures_idea_desc: "To seize opportunities in an increasingly aggressive world, [SHA.GetNameDef] must quickly build significant industrial capacity capable of meeting national requirements."
 SHA_walking_the_dragon: "Shanhaijing Conservative Revolution"
 SHA_Black_Tortoise_Promenade: "Black Tortoise Promenade"
 SHA_Black_Tortoise_Promenade_desc: "A merchant association where food ingredients from all over Kivotos gather, and it's considered one of the best places for gastronomy in Shanhaijing. Thanks to these characteristics, it masters not only Shanhaijing's traditional dishes but also various food cultures of Kivotos.\n\nHowever, because they naturally reveal an open tendency in this process, they are rejected by conservatives including the Genryumon."
 SHA_Black_Tortoise_Promenade_BfG: "Black Tortoise Promenade (Free Union Alliance)"
 SHA_Black_Tortoise_Promenade_BfG_desc: "A merchant association where food ingredients from all over Kivotos gather, and it's considered one of the best places for gastronomy in Shanhaijing. Thanks to these characteristics, it masters not only Shanhaijing's traditional dishes but also various food cultures of Kivotos.\n\nHowever, because they naturally reveal an open tendency in this process, they are rejected by conservatives including the Genryumon."
 SHA_communism_party_volsheviks_long: "Communist Party of Shanhaijing"
 SHA_communism_party_volsheviks: "Communist Party"
 SHA_suppressed_Black_Tortoise_Promenade: "Suppressed Black Tortoise Promenade"
 SHA_suppressed_Black_Tortoise_Promenade_desc: "It was a club that was famous as a merchant association where food ingredients from all over Kivotos gathered, but currently, it is under the control of Shanhaijing's Genryumon. Any act that deviates even slightly from the Genryumon's tradition becomes subject to thorough regulation, and due to this, it has virtually completely lost its political foundation.\n\nThe merchant association that once led various food cultures of Kivotos is now barely maintaining its existence under conservative constraints, longing for its past glory."
 SHA_Shanhaijinfascism: "Shintani Kai Theory"
 SHA_Shanhaijinfascism_desc: "The 'Shintani Kai Theory' being experimented with by Shintani Kai aims to completely reconstruct Shanhaijing Senior Secondary School from its very foundation. This theory attempts to put society as a whole under thorough planning and is being boldly pushed forward while ignoring even ethical constraints, putting technological accelerationism at the forefront."
 SHA_corporate_state_idea: "Organic State Building"
 SHA_daily_ideologiy_excluding_neutrality: "Daily Ideology Support excluding Non-Aligned §R-0.05§!"
 SHA_corporate_state_idea_6: "Citadel of Conservatism"
 SHA_supreme_economic_council: "Supreme Economic Council"
 SHA_ASFTU: "All-Shanhaijing Federation of Trade Unions"
 SHA_clash_of_civilizations_idea: "Clash of Civilizations"
 SHA_clash_of_civilizations_idea_desc: "The disease of decadent democracy spread throughout the world is making our flesh rot. Therefore, we must become the standard-bearers of revolution and plant true conservative values in them to create a better world."
 SHA_Shintani_kais_cult_of_personality_ns: "Cult of Personality"
 SHA_domestic_air_production: "Focus on Aircraft Production"
 SHA_shadow_of_Shintani_Kai: "Shadow of Shintani Kai"
 SHA_shadow_of_Shintani_Kai_desc: "When it became certain that Shintani Kai had been reinstated, Shanhaijing is trembling with fear just from the fact that she exists and is distrusting the current government."
 SHA_transition_to_capitalism: "Transitional Stagnation"
 SHA_transition_to_capitalism_3: "Shanhaijing Capitalism"
 SHA_Shanhaijing_Democracy_ns_Name: "Shanhaijing Democracy"
 SHA_civic_militarism_0_ns: "Legacy of the Former Master"
 SHA_tea_leaf_export_ns: "Tea Leaf Export"

