 SHA_economic_stabilization: "Commence Economic Stabilization"
 SHA_economic_stabilization_desc: "As the new year dawned following the chaos, social turmoil slowly began to subside. Many hoped for a return to prosperity, stability, and new development. However, reality is harsh. The collapsed industrial base has yet to escape severe stagnation, and signs of recovery are nowhere to be seen. Prompt and decisive action is needed to slow the economic freefall and prevent the worst-case scenario."
 SHA_three_year_plan: "3-Year Plan"
 SHA_three_year_plan_desc: "We must coordinate our resources. A centralized effort will ensure that every student and worker is pulling in the same direction for the glory of Shanhaijing."
 SHA_shanhaijing_academy: "University of Graz"
 SHA_shanhaijing_academy_desc: "By integrating the academic rigor of Graz with Shanhaijing's specialized knowledge, we can foster a new generation of elites capable of solving any crisis."
 SHA_trade_controls: "Trade Controls"
 SHA_trade_controls_desc: "The Great Migration severely weakened Shanhaijing's greatest strength: trade. In the midst of the chaos, a shocking fact was revealed—some merchant groups have escaped state control to dominate transactions between nations, corporations, and even individuals, accumulating massive wealth. The Genryumon has decided to no longer tolerate this disorder."
 SHA_shanhaijing_trade_promotion: "Promote Shanhaijing Trade"
 SHA_shanhaijing_trade_promotion_desc: "Disorderly trade has been resolved through trade control edicts. Historically, Shanhaijing has thrived on merchant-led trade, a long-standing tradition. We must slightly relax trade controls and encourage merchants to trade once again."
 SHA_protectionism: "Shanhaijing Protectionism"
 SHA_protectionism_desc: "Our markets belong to our students. We must build high walls—metaphorically and economically—to ensure that external shocks never threaten our livelihoods again."
 SHA_nationalization_school_assets: "Nationalization of External Assets"
 SHA_nationalization_school_assets_desc: "Assets belonging to other schools within our borders are now the property of Shanhaijing. It is only fair that we utilize these resources for our own recovery."
 SHA_experimental_corporatism: "Experimental Corporatism"
 SHA_experimental_corporatism_desc: "A middle path between total state control and chaotic markets. By organizing society into functional 'corps', we can ensure harmony and productivity."
 SHA_the_south_unshackled: "The South Unshackled"
 SHA_the_south_unshackled_desc: "Southern Shanhaijing has long been under-utilized. By removing restrictive regulations, we can unleash its full industrial potential."
 SHA_trade_with_neighborhood: "Trade with Good Neighbors"
 SHA_trade_with_neighborhood_desc: "Isolation is a slow death. We must seek out those who share our values and establish mutually beneficial trade routes."
 SHA_facilitating_exports: "Danube River Trade"
 SHA_facilitating_exports_desc: "Austria was historically the center of a vast empire and constituted a massive economic block in its own right. Even after the empire's collapse, trade with countries that inherited its legacy—Hungary, Yugoslavia, as well as Italy and Romania—has continued. We must utilize these historical ties to the fullest to open a prosperous future, even if somewhat unfavorable terms follow."
 SHA_expanding_alliances_with_merchants: "Alliance with Merchants"
 SHA_expanding_alliances_with_merchants_desc: "I'll write down why we need to ally with the merchants! ^-^ If we don't, who's going to supply the ingredients for Rumi's special stir-fry?"
 SHA_prosperous_south: "Prosperous South"
 SHA_prosperous_south_desc: "The investments are finally paying off. The southern districts are bustling with activity, becoming the engine of our new economy."
 SHA_shanhaijing_railway: "Shanhaijing Railway"
 SHA_shanhaijing_railway_desc: "A problem was discovered where the railway gauges of Shanhaijing and Austria do not match. Train specifications are also incompatible, making direct operation impossible. Particularly since much of the Austrian territory consists of rugged mountains, water transport cannot be used as an alternative. It is practically impossible to overhaul the extensively laid Austrian railway network. Therefore, it is a much more efficient and economic choice for Shanhaijing to build tracks according to the Austrian standard gauge."
 SHA_obb_argument: "Acquisition of Austrian Federal Railways"
 SHA_obb_argument_desc: "The Austrian Federal Railways (ÖBB) was a company neglected by the state for a long time. However, as the railway connection project with Shanhaijing began in earnest, the situation changed. ÖBB suddenly transformed into an attractive business generating significant profit. Now, Shanhaijing is in a position where it must acquire this company whether it likes it or not. For better or worse, ÖBB will fall into our hands."
 SHA_textile_industry: "Textile Industry Upgrading"
 SHA_textile_industry_desc: "Shanhaijing's fashion is already the talk of Kivotos. By modernizing our looms, we can produce silks and fabrics that even Trinity would envy."
 SHA_building_restoration_project: "Restoration: Central Special District"
 SHA_building_restoration_project_desc: "The war between Shanhaijing and Austria left deep scars across the city. Buildings suffered varying degrees of damage. Fortunately, some buildings only have external damage and maintain their function, but quite a few were completely destroyed and turned into ruins. Traces of battle remain vivid throughout the city. Now is the time for Shanhaijing to gradually regain its pre-war appearance."

 SHA_austria_unemployment_relief: "Austrian Unemployment Relief"
 SHA_austria_unemployment_relief_desc: "The unemployment problem that the Austrian government could not ultimately solve has spread as a serious crisis throughout the Shanhaijing economy. As the unemployed population grows, household income decreases and consumption naturally shrinks. The merchant-centered Shanhaijing economy faces a structural imbalance where supply is abundant but demand to support it is severely lacking, and as a result, the depression is deepening. This is an issue that must be addressed urgently."
 SHA_harness_austria_industrial_might: "Harness Austrian Industrial Might"
 SHA_harness_austria_industrial_might_desc: "The factories of Steyr and Linz are legendary. By putting these workers back to their stations, we can build a war machine that no one can ignore."
 SHA_invest_in_erzberg_steel_mines: "$AUS_invest_in_erzberg_steel_mines$"
 SHA_invest_in_erzberg_steel_mines_desc: "Steel is the bone of the nation! We must dig deeper into the Erzberg to secure our future! (Wait, who wrote this? It's so intense...)"
 SHA_invest_in_semperit_synthetics: "$AUS_invest_in_semperit_synthetics$"
 SHA_invest_in_semperit_synthetics_desc: "Natural rubber is hard to come by these days. Semperit's synthetic research is our only hope for keeping our tires spinning!"
 SHA_tungsten_minerals: "Salzburg Mittersill Mine"
 SHA_tungsten_minerals_desc: "Tungsten is vital for high-quality munitions. The mines of Mittersill shall provide the hardening needed for our armor-piercing shells."
 SHA_alps_livestock_industry: "Alps Livestock Industry"
 SHA_alps_livestock_industry_desc: "At first glance, the Alps seem like a barren wasteland fit only for natural fortresses. However, the answer was found in the wisdom of the Austrian locals. Dairy farming centered on cattle has been developed in this region since early on, and the abundant pastures and cool climate unique to high altitudes provide an environment perfectly suited for livestock. We will actively expand the livestock industry based on this potential."
 SHA_raiffeisen_ag: "Raiffeisen Cooperative"
 SHA_raiffeisen_ag_desc: "The Raiffeisen Cooperative is an association for farmers, active particularly around the eastern plains. Farmers receive loans or help in purchasing livestock through this cooperative, making Raiffeisen a reliable foundation for the rural economy. Even if the cooperative is not friendly to us, we will provide subsidies to Raiffeisen to gain the trust of the farmers."
 SHA_fertilizer_industry: "Fertilizer Industry Development"
 SHA_fertilizer_industry_desc: "To feed a growing academy, we need better yields. Chemical fertilizers from our new plants will turn even the stoniest Austrian soil into a garden."
 
 SHA_courting_the_princess_of_industry: "Inviting the Princess of Industry"
 SHA_courting_the_princess_of_industry_desc: "The Austrian industrial world is full of giants. Among them, the figure called the 'Princess of Industry' is particularly noteworthy. While it is still uncertain whether she will fully cooperate with our government, there is a high possibility she will accept if we reach out first."
 SHA_urban_housing_projects: "Urban Housing Projects"
 SHA_urban_housing_projects_desc: "Even a student needs a place to sleep. We're building modern apartments to ensure no one has to spend their nights in a drafty tent."
 SHA_shanhaijing_infrastructure: "Shanhaijing Road Network Construction"
 SHA_shanhaijing_infrastructure_desc: "Austria already has a solid road network, so it is sufficient for us to add to it. Of particular note are the road projects connecting to neighboring countries. If we take over and finish these projects that were halted, the way neighboring countries look at us will change slightly."
 SHA_industrialization_effort: "Encourage Employment"
 SHA_industrialization_effort_desc: "The Austrian unemployment problem has been solved, and employment has been boosted through significant investment."
 SHA_invest_in_kapsch: "Support Kapsch"
 SHA_invest_in_kapsch_desc: "'Kapsch', founded by Johann Kapsch, is a company that has developed and produced various electronic equipment and is one of the few places capable of producing radios independently. What kind of results could be born if we graft this technical power onto Kivotos' communication technology? Based on infinite imagination, let's actively accelerate that development by providing subsidies to Kapsch."

 SHA_architechtual_advancements: "$AUS_architechtual_advancements$"
 SHA_architechtual_advancements_desc: "The fusion of Shanhaijing's aesthetic and Austrian structural engineering will create wonders that will last a thousand years!"
 SHA_autobahn_connection: "Autobahn Connection"
 SHA_autobahn_connection_desc: "Speed is a quality of its own. By connecting to the Autobahn, our logistics will become the envy of all Kivotos."
 SHA_improving_the_rail_network: "Improve Rail Network"
 SHA_improving_the_rail_network_desc: "Faster trains, more cargo, more prosperity. The steel ribbons of Shanhaijing shall bind this land together."
 SHA_establish_the_SEZ: "Establish Special Economic Zones"
 SHA_establish_the_SEZ_desc: "By designating specific areas for deregulated trade, we can attract the boldest entrepreneurs and the most innovative projects."
 SHA_central_planning: "Form Central Planning Committee"
 SHA_central_planning_desc: "The market is too volatile for these times. A dedicated committee of experts will ensure that every scrap of metal is used efficiently."
 SHA_union_control: "Establish National Confederation of Unions"
 SHA_union_control_desc: "To prevent labor unrest, we must bring all unions under a single, patriotic umbrella. For the school, for the Master!"
 SHA_establish_the_VES: "Reorganize Central Planning Committee"
 SHA_establish_the_VES_desc: "Efficiency must be our watchword. We are streamlining the planning process to eliminate the bureaucratic bloat of the previous administration."
 SHA_economic_health_5_tt: "§YGreat Depression Level§! is §Y5§! or lower"
 SHA_teleological_planning: "Teleological Industrial Planning"
 SHA_teleological_planning_desc: "We don't just plan for today; we plan for the ultimate destiny of Shanhaijing. Every factory built is a step toward our final goal."
 SHA_solidarist_representation: "Solidarist Representation"
 SHA_solidarist_representation_desc: "Every sector of society deserves a voice, provided that voice sings in harmony with the state's objectives."
 SHA_economic_organisation_of_SKivotos: "Promote Southern Kivotos Unification"
 SHA_economic_organisation_of_SKivotos_desc: "The resources of the south must be integrated into our industrial heartland. For a unified and strong Shanhaijing!"

 # 산해경 군사 중점
 SHA_address_the_army: "Reorganize [SHA.GetAdjective] Defense Force"
 SHA_address_the_army_desc: "Serious flaws in the Shanhaijing Defense Force were revealed during the war with the Austrian Federal Army. Although some modernization has taken place through $SHA_MINA$'s efforts, with global tensions rising and the arms race intensifying, there is no time to hesitate in maintaining the military at a modern level."
 
 SHA_Following_doorkeeper_footsteps: "Legacy of the Former Master"
 SHA_Following_doorkeeper_footsteps_desc: "Even though she was ousted, the former Master had a vision for a powerful army. We'd be fools to ignore the foundations she laid down."
 SHA_National_Guard_Expansion: "Army Expansion"
 SHA_National_Guard_Expansion_desc: "More boots on the ground, more guns in hands. We will not be caught unprepared again."
 SHA_heroism_education: "Heroism Education"
 SHA_heroism_education_desc: "Our students must be more than just scholars; they must be warriors. We will instill the virtues of sacrifice and valor."
 SHA_propaganda_bureau_of_army: "Army Propaganda Bureau"
 SHA_propaganda_bureau_of_army_desc: "The pen is as mighty as the sword, but a cool poster of a Valkyrie-style tank is even better for morale!"
 SHA_civic_militarism: "Civic Militarism"
 SHA_civic_militarism_desc: "Every citizen a soldier, every street a fortress. Total mobilization is the only path to security."


 SHA_Central_Military_Commission: "Establish [SHA.GetName] Central Military Commission"
 SHA_Central_Military_Commission_desc: "To centralize command and ensure that the military's goals align perfectly with the Master's vision."
 SHA_Joint_Chiefs_of_Staff: "Establish Joint Chiefs of Staff"
 SHA_Joint_Chiefs_of_Staff_desc: "Coordination between branches is key. We cannot have the infantry and the alchemists working at cross-purposes."
 SHA_cohesion_first: "Cohesion First"
 SHA_cohesion_first_desc: "A divided army is a defeated army. We will focus on building unbreakable bonds of brotherhood among our troops."
 SHA_Mission_Command: "Expand General Decision-Making Authority"
 SHA_Mission_Command_desc: "Trust our commanders on the field. Flexible leadership is what wins battles in the rugged Alpine terrain."
 SHA_emergency_command_system: "Emergency Command System"
 SHA_emergency_command_system_desc: "In the event of a total communication blackout, our units must know exactly how to operate independently for the school's survival."

 SHA_Giving_role_to_Mina: "Assigning a Role to Konoe Mina"
 SHA_Giving_role_to_Mina_desc: "Mina's tactical brilliance—despite her occasionally getting lost—is an asset we cannot ignore. Let her lead the charge!"
 SHA_Establishment_of_military_academy: "Establish Military Academy"
 SHA_Establishment_of_military_academy_desc: "To train the next generation of tacticians and officers. Professionalism starts with education."
 SHA_professional_camouflage: "Professional Camouflage"
 SHA_professional_camouflage_desc: "In the mountains, if you can't be seen, you can't be hit. We'll develop the finest concealment techniques in Kivotos."

 SHA_pardon_austrian_general: "Pardon Austrian Officers"
 SHA_pardon_austrian_general_desc: "Austrian officers are currently detained in facilities near the Central Special District. As Austria has fought numerous wars, they possess capable commanders with rich practical combat experience, and wasting such talent in facilities is a waste to anyone's eyes. Some may choose to retire, but through appropriate persuasion, we will induce them to serve in the Shanhaijing Defense Force."

 SHA_military_production: "Modernization War"
 SHA_military_production_desc: "It's a race against time. Our factories must churn out equipment faster than our enemies can count them."
 SHA_Equipment_Development_Department: "Expand [SHA.GetAdjective] Equipment Development Department"
 SHA_Equipment_Development_Department_desc: "From better rifles to specialized mountain gear, our R&D will give us the edge."
 SHA_steyr_arms_MnA: "Steyr Arms Merger"
 SHA_steyr_arms_MnA_desc: "By fully absorbing the Steyr factories into our military-industrial complex, we ensure a steady stream of world-class weaponry."
 SHA_motorization_accelerate: "Accelerate Motorization"
 SHA_motorization_accelerate_desc: "Horses are for parades; trucks are for winning. We need to get our troops moving at lightning speed."
 SHA_mechanization: "Mechanization"
 SHA_mechanization_desc: "Half-tracks and armored cars shall lead the way. Steel protection for our precious students."
 SHA_tank_develop: "Excellent War Machines"
 SHA_tank_develop_desc: "Kivotos has never seen tanks like these. A fusion of Shanhaijing engineering and Austrian steel."
 SHA_Mortar_Development_Department: "[SHA.GetAdjective] Mortar Development Department"
 SHA_Mortar_Development_Department_desc: "In the mountains, high-angle fire is king. Our mortars will rain down fire from behind every peak."
 SHA_hirtenberger_artillery: "Acquire Hirtenberger"
 SHA_hirtenberger_artillery_desc: "Their expertise in explosives and artillery is exactly what we need to break enemy fortifications."
 SHA_supporting_the_troops: "Support the Troops"
 SHA_supporting_the_troops_desc: "Logistics, medical aid, and better rations. A well-supplied student is a happy, effective student."

 SHA_National_Aviation_Administration: "Create National Aviation Administration"
 SHA_National_Aviation_Administration_desc: "The sky is the new frontier. We must establish control over our airspace to protect our borders."

 SHA_temporary_air_force: "Temporary Shanhaijing Air Force Focus"
 SHA_temporary_air_force_desc: "Shanhaijing's air force focus is under rework! We'll complete the rework in the next update possible!"

 # 정치
 SHA_Austrian_oppression_continues: "Continued Oppression of Austrians"
 SHA_Austrian_oppression_continues_desc: "The Austrians have persistently opposed Shanhaijing's rule and have only focused on causing disruptions. Now is the time to resolutely root out their resistance. We must deploy Genryumon agents on a large scale to thoroughly suppress their backlash and ensure they are completely subjugated under the Shanhaijing system."
 SHA_internal_solidarity: "Internal Solidarity"
 SHA_Strengthening_Genryumon: "Strengthen the Genryumon"
 SHA_Strengthening_Kisaki: "Strengthen Master's Authority"
 SHA_Sstretching: "Stretching Exercises"
 SHA_Genryumon_left_wing: "Genryumon Left-Wing"
 SHA_Contact_BTP: "Cooperate with Black Tortoise Promenade"
 SHA_Genryumon_right_wing: "Genryumon Right-Wing"
 SHA_Contact_POC: "Cooperate with Peking Opera Department"

 # 오스트리아 유화 정책
 SHA_Austrian_appeasement_policy: "Austrian Appeasement Policy"
 SHA_Austrian_appeasement_policy_desc: "The Austrians were originally the owners of the Austrian land. However, it is practically impossible for us to concede territory to them. Therefore, instead of hardline measures, bringing them into the system through appeasement policies would be the wisest choice."
 SHA_gathering_of_radicals: "Gathering of Radicals"
 SHA_gathering_of_radicals_desc: "At the time of the incident, Master Ryuge Kisaki of the Genryumon suppressed the Gehenna students' riot with support from the Prefect Team. This is a clear violation of Shanhaijing's principle of isolationism and will be recorded as a significant case of breaking long-standing tradition. Ryuge Kisaki, who lacked legitimacy in the first place, must now step down from the throne."
 SHA_Cooperation_with_Kaguya: "Approach Peking Opera Department"
 SHA_Cooperation_with_Kaguya_desc: "The Peking Opera Department would not be out of place if evaluated as the most loyal group in Shanhaijing currently. However, to bring down the current Master who continues her dogmatic actions while ignoring their sincere advice, cooperation with the Peking Opera Department will be essential."
 SHA_podium_room_cooperation: "Approach Alchemist Association"
 SHA_podium_room_cooperation_desc: "There are rumors that some radicals following Shintani Kai are gathering at the Alchemist Association. If we succeed in contacting them, they will be of great help later when bringing down the current Master from her seat."
 SHA_Kisaki_Suppression: "Suppress Kisaki"
 SHA_Kisaki_Suppression_desc: "The time has come! An opera to expose the current Master's foolishness has been prepared. In cooperation with the Peking Opera Department and some radicals within the Genryumon, we will take the moment of the opera performance as an opportunity to force the current Master to resign and crown $SHA_KAGUYA$ as the new Master."
 # 신타니 카이 루트
 SHA_Shintani_Kai_Follow: "Reinstate Shintani Kai"
 SHA_Shintani_Kai_Follow_desc: "Shintani Kai was a troublemaker who caused various disturbances and problems in Shanhaijing in the past, but she was expelled without even a proper procedure due to $SHA_KISAKI$'s tyranny. We will now call her back."
 SHA_Kaguya_ousted: "Oust $SHA_KAGUYA$"
 SHA_Kaguya_ousted_desc: "We succeeded in driving out $SHA_KISAKI$ with the power of the Peking Opera Department. However, the Peking Opera Department is now nothing more than a useless burden. We will cooperate with the Alchemist Association to raid the Peking Opera Department, pull $SHA_KAGUYA$ down from the position of Master, and take over the seat of Master of the Genryumon."
 SHA_Shanhaijing_fascism: "Advocate Shintanism"
 SHA_Shanhaijing_fascism_desc: "The school belongs to the visionary. Shintani Kai's theories will lead us to a future where ethics are merely an obstacle to progress."
 SHA_Eastern_Alchemy_Society_solidarity: "Alchemist Association Solidarity"
 SHA_Eastern_Alchemy_Society_solidarity_desc: "The researchers must stand united. Our pursuit of the elixir requires absolute loyalty and focus."
 SHA_consolidate_industries: "Consolidate Austrian Industries"
 SHA_consolidate_industries_desc: "All Austrian factories will be geared toward a single goal: the advancement of Shintani's Great Work."
 SHA_Sundan_dosage: "Accelerate Elixir Development"
 SHA_Sundan_dosage_desc: "For the goal and reason for existence of Shanhaijing, as well as for Shintani Kai's ambition, we must spur the development of the Elixir."
 SHA_Sundan_dosage_tt: "The leader of Shanhaijing, Shintani Kai, will begin the great journey for §YElixir Development§!.\n\nAt the start, §YCompletion is 1/8§!."
 SHA_podium_room_expansion: "Expand Alchemist Association"
 SHA_podium_room_expansion_desc: "Expansion is good. More labs, more data, more results."
 SHA_cult_of_personality: "Cult of Personality"
 SHA_cult_of_personality_desc: "The Master is not just a leader; she is the pinnacle of human evolution. Her word is truth, her will is law."
 SHA_Seonin: "\"Sage\""
 SHA_seonin_custom_trigger: "Developed the medicine to become a Sage."

 SHA_ascension: "Ascension"
 SHA_ascension_desc: "We are leaving the realm of mortal students. Shanhaijing will transcend the petty squabbles of Kivotos."
 SHA_Alchemy_and_modern_science: "Alchemy and Modern Science"
 SHA_Alchemy_and_modern_science_desc: "The ancient arts meet the particle accelerator. There is no limit to what we can achieve."
 SHA_supremacy_of_will: "Supremacy of Will"
 SHA_supremacy_of_technology: "Supremacy of Technology"
 SHA_Twilight_of_the_Gods: "Twilight of the Gods"
 SHA_Twilight_of_the_Gods_desc: "While the fires burn fiercely, the Rhine sweeps over the crematorium. Then, the three maidens of the Rhine appear near the embers. Hagen strips off his armor and plunges into the flood as they try to find the ring. However, two maidens pull him deep into the water, and the remaining one rejoices in finding the ring. The sky turns red, and the image of Valhalla gradually appears. Valhalla, where gods and heroes sit, is engulfed in massive flames, and the curtain falls as the fire consumes everything."
 SHA_Ragnarok: "Ragnarok"
 SHA_Ragnarok_desc: "The black wolf swallows the sky, and the serpent's venom stains the sea.\nWhen the horn sounds and war opens, the gods will step into their destiny.\n\nFlames race across the earth, and the giants pull down the sun.\nBut after the fire consumes everything, a new world will bloom again."


 # 보수 혁명 루트
 SHA_conservative_revolution: "Conservative Revolution"
 SHA_conservative_revolution_tt: "Converts current §YFascism Support§! to §YNon-Aligned Support§!."
 SHA_conservative_revolution_desc: "For years, Shanhaijing has lacked a proper conservative Master, and considering the short term of the previous Master, this void of decadence extends for decades. This pretense must end. We must reorganize Shanhaijing according to the ideals of rightful Shanhaijing patriots within a grand Conservative Revolution."
 SHA_new_shanhaijing_conservatism: "New Shanhaijing Conservatism"
 SHA_new_shanhaijing_conservatism_desc: "For years, Shanhaijing's conservatism has been polluted and defiled, falling to become a tool for politicians. Now, we must restore ideological purity to reclaim our original conservatism. It is time to redefine the essence of Shanhaijing conservatism and re-establish its values."
 SHA_Expansion_of_cooperation_with_other_clubs: "Expand Cooperation with Other Clubs"
 SHA_Expansion_of_cooperation_with_other_clubs_desc: "Ideological differences aside, we must cooperate. Enemies are everywhere, possessing the power to overwhelm us like a fierce storm. Therefore, we must unite as one, protect the flame of Shanhaijing conservatism, and keep it burning to the end."
 SHA_Cabinet_Secretariat: "Shanhaijing Privy Council"
 SHA_Cabinet_Secretariat_desc: "The current Master must be maintained as a symbol of Shanhaijing conservatism and a symbol of unity for students and people. However, to assist the Master's policies and ensure smooth communication between the Genryumon and the government, we will establish a new Privy Council. This body will be composed only of virtuous and patriotic conservatives, faithfully performing its role for the future of Shanhaijing."
 SHA_organic_national_polity: "Organic National Polity"
 SHA_organic_national_polity_desc: "To the north, Kivotos' liberal methods are not suitable for Shanhaijing society. We do not follow corrupt electoralism but move forward to realize the ideals of the Peking Opera Department and Shanhaijing conservative theorists. Building an organic state—meritocratic authoritarianism where capable individuals rise through ranks and exercise leadership—is our path."
 SHA_Democratic_Culture_Censorship: "Eradicate Anti-Kivotos Democratic Culture"
 SHA_Democratic_Culture_Censorship_desc: "The title says it all. We won't allow degenerate liberal ideas to poison our students' minds."
 SHA_New_Genryumon_Peking_Opera_Department_Relations: "New Genryumon - Peking Opera Relations"
 SHA_New_Genryumon_Peking_Opera_Department_Relations_desc: "A symbiotic relationship. The Genryumon rules, and the Peking Opera provides the cultural and moral backbone of our society."
 SHA_Engine_of_conservative_revolution: "Engine of the Conservative Revolution"
 SHA_Engine_of_conservative_revolution_desc: "The momentum is with us. We are restructuring every institution to serve the ideals of the revolution."
 SHA_people_conservatism: "Foster Mass Conservatism"
 SHA_people_conservatism_desc: "It's not just for the elite. We must teach every student the value of our traditions and the strength of our order."
 
 SHA_2nd_conservative_revolution: "2nd Conservative Revolution"
 SHA_2nd_conservative_revolution_desc: "After 20 years of decadence, we met a true conservative leader and established the value of a grand Conservative Revolution. Furthermore, we successfully completed the Conservative Revolution by reclaiming territories lost to Hyakkiyako. However, traces of decadent culture still remain in various parts of society. To completely eliminate these remnants, we must begin the 2nd Conservative Revolution. This will be an important step toward fully realizing the ideals of patriots."
 SHA_eradication_of_liberalism: "Citadel of Conservatism"
 SHA_eradication_of_liberalism_desc: "We shall be the last bastion against the tide of chaos. No liberal thought shall cross our borders."
 SHA_Resurrection_of_the_Soul_of_Shanhaijing: "Resurrection of Shanhaijing's Soul"
 SHA_Resurrection_of_the_Soul_of_Shanhaijing_desc: "Finding our way back to the ancient spirits and the core values that made Shanhaijing great."
 SHA_Establishment_of_the_National_Council: "Establish Academy Council"
 SHA_Establishment_of_the_National_Council_desc: "A formal body to represent the various interests of the school, under the firm guidance of the Master."
 SHA_Kivotos_conservative: "Spread the Conservative Revolution"
 SHA_Kivotos_conservative_desc: "The liberalism and socialism of Kivotos are both disgusting tumors promoting anti-Shanhaijing conspiracies. They are spread throughout Kivotos, and their very existence is a clear threat. Therefore, we must spread our own revolution even further. Through this, we must realize true conservative values and return Kivotos to the right path."
 SHA_clash_of_civilizations: "Clash of Civilizations"
 SHA_clash_of_civilizations_desc: "As the massive collision begins, Shanhaijing students have voluntarily jumped into this great flow! We must unite under the banner of the grand Conservative Revolution to save the world from the malignant tumors of liberalism and socialism. This is not a simple political confrontation, but a fateful struggle that determines the future of civilization!"

 # 공용
 SHA_strike_suppression: "Strike Suppression"
 SHA_strike_suppression_desc: "Immediately after the Great Migration, Shanhaijing adopted an even stronger isolationist policy, which was enough to provoke the dissatisfaction of the Merchant Association. Eventually, they went on a general strike in December demanding reform and opening in opposition to the Genryumon's policies. However, we must make them clearly realize that such actions only worsen Shanhaijing's situation, and suppress them with force if necessary."
 SHA_Sack_of_Rumi: "Suppress Rumi"
 SHA_Sack_of_Rumi_desc: "Akeshiro Rumi is identified as one of the ringleaders of the December general strike. By suppressing Rumi and simultaneously imposing strong sanctions on the Black Tortoise Promenade, we will safeguard Shanhaijing's tradition and further solidify conservative values."

 # 현지 화합 (공산, 민주)
 SHA_local_harmony: "Local Harmony"
 SHA_local_harmony_desc: "Austrians and Shanhaijing students living together in peace. A revolutionary concept for a revolutionary era."

 SHA_appointment_of_BTP: "Appointment of Black Tortoise Promenade Personnel"
 SHA_appointment_of_BTP_desc: "The world is changing rapidly, and the Black Tortoise Promenade, in charge of commerce, stands at the crossroad of that change. They are likely to propose more progressive reform plans than at least the 'conservative' Genryumon, and if we appoint figures from the Black Tortoise Promenade in large numbers, our direction might also move toward a more developmental path."
 SHA_release_austrian_politician: "Release Austrian Politicians"
 SHA_release_austrian_politician_desc: "Most politicians of Austrian origin have been pardoned due to the implementation of Shanhaijing's new policies. Many of them comply with the new order and hope to re-enter politics."
 SHA_university_of_vienna: "University of Vienna"
 SHA_university_of_vienna_desc: "A center of enlightenment. We will foster a new intelligentsia that understands both the old world and the new."
 SHA_formation_of_labor_union: "Formation of Labor Unions"
 SHA_formation_of_labor_union_desc: "Power to the students who work! By organizing, we ensure that the benefits of our industry are shared by all."
 SHA_womens_education_initiative: "Women's Education"
 SHA_womens_education_initiative_desc: "In Shanhaijing, equal educational opportunities for women have been guaranteed for a long time. However, the situation was different in Austria. Women received discriminatory treatment, and as a result, the gap was proven by the lack of educational opportunities."
 SHA_progressivism_through_science: "Progress Through Science"
 SHA_liberation_theology: "Liberation Theology"
 SHA_state_atheism: "Principle of Secularism"
 SHA_affiliate_with_catholic: "Affiliate with Catholics"
 SHA_progressivism_through_science_desc: "By applying the scientific method to our society, we can eliminate the superstitions that hold us back and build a rational paradise."
 SHA_fight_against_extremism: "Fight Against Extremism"
 SHA_fight_against_extremism_desc: "Extremism has always caused harm to society. They always pursue only radical methods, and such methods can never be tolerated. Therefore, we must actively respond to their threats."
 SHA_agrarian_socialism: "Theory of Agrarian Socialism"
 SHA_strengthening_parliamentarism: "Strengthen Parliamentarism"
 SHA_strengthening_parliamentarism_desc: "The system centered on the Genryumon and the Master seems perfect at first glance, but it has a structural limitation in that the Master's authority is so powerful that long-term rule is practically guaranteed unless a particular problem arises. Therefore, we must strengthen the Genryumon's authority to prepare a device that can check the Master's power."
 SHA_a_new_constitution: "Enact Shanhaijing Constitution"
 SHA_a_new_constitution_flag: "Focus §Y$SHA_strengthening_parliamentarism$§! Completed"
 SHA_str_par_focus_days_tt: "Current Days: [?SHA_a_new_constitution_flag:days|Y0]"
 SHA_defensive_democracy: "Defensive Democracy"
 SHA_defensive_democracy_desc: "The democratization of Shanhaijing will be counted as one of the greatest achievements in its hundreds of years of history. Such democracy can never be easily lost or damaged, and just as we cannot allow freedom to the enemies of freedom, we must act to prevent democracy from self-destructing within its own system."
 SHA_transplanting_capitalist_system: "Market Opening"
 SHA_transplanting_capitalist_system_desc: "Shanhaijing's economy was operated as a planned economy led by the Genryumon's economic experts, and market opening has been extremely limited. Nevertheless, the fact that the Black Tortoise Promenade prospered in commerce is a noteworthy achievement, and through this, Shanhaijing students directly experienced the advantages of a free market. Now, we must expand these changes nationwide to guarantee more freedom to the people."
 SHA_democracy_education: "Democracy Education"
 SHA_democracy_education_desc: "The foundation of a democratic government lies in all citizens of Shanhaijing. However, those who have stayed under the Master's authoritarian rule for a long time lack interest in politics. If left as is, there is a risk that the precious democratic government will collapse amidst public indifference."
 SHA_hold_elections: "Hold Elections"
 SHA_hold_elections_desc: "Stability is coming to Shanhaijing and a constitution has also been enacted. It is now time for us to hold the first free elections in Shanhaijing as specified in the constitution. Plenty of candidates to lead Shanhaijing are ready, and now it is time for the people to choose."
 SHA_a_responsible_government: "Student Sovereignty Government"
 SHA_guided_democracy: "Former Master, Current President"

 SHA_communist_branch: "Adopt Austro-Marxism" 
 SHA_communist_branch_desc: "$AUS_austromarxism_focus_desc$"
 SHA_communism_focus_1: "'Red Vienna'"
 SHA_communism_focus_1_desc: "As the empire collapsed, Vienna suffered from extreme poverty, housing shortages, unemployment, and inflation. 'Red Vienna' refers to a series of progressive policies implemented by the Social Democratic Party in power from 1919 to 1934 to solve this. Although 'Red Vienna' ended when right-wing forces took power following the February Uprising of 1934, it remains a model for public housing, the foundation of urban welfare, and a paradigm for progressive local politics."
 SHA_red_wien: "'Red Vienna'"
 SHA_Naukograd: "Naukograd"
 SHA_Naukograd_desc: "Naukograd means 'science city' and is a name referring to a city where research and development facilities are concentrated."
 SHA_communism_focus_2: "Left-Wing Militia"
 SHA_communism_focus_2_tt: "When the §YCivil War§! starts, you will receive §YMilitia Divisions§!. If the §YCivil War§! is ongoing or finished, you will receive §YMilitia Divisions§! immediately."
 SHA_communism_focus_2_desc: "To prepare for the civil war, we will organize militias that agree with our cause."
 SHA_communism_focus_3: "Resume Soviet Movement"
 SHA_communism_focus_3_desc: "The Soviet movement was a worker-centered revolutionary movement that took place throughout post-war Europe, and by resuming it, we will reignite the revolutionary spirit of the working class."
 SHA_communism_focus_4: "Populist Corporatism"
 SHA_communism_focus_5: "Left-Leaning of Black Tortoise Promenade"
 SHA_communism_focus_6: "'Theory of Mass Strike'"
 SHA_communism_focus_6_desc: "The general strike is our fist!"
 SHA_communism_focus_7: "Revenge for '34"
 SHA_communism_focus_7_desc: "In February 1934, the last torch to protect the Social Democratic Austrian Republic was ruthlessly trampled by counter-revolutionary forces. Now we hold the sword!"
 SHA_communism_focus_8: "Socialist Shanhaijing"
 SHA_communism_focus_8_desc: "The red dragon rises over a worker's paradise."
 SHA_communism_focus_9: "Internationalist Ranks"
 SHA_communism_focus_9_desc: "We must show solidarity with socialist comrades abroad."
 SHA_communism_focus_10: "Shanhaijing-Soviet Industrial Link"
 SHA_communism_focus_10_desc: "Our assembly lines will hum in harmony with Moscow's."
 SHA_communism_focus_11: "Soviet Research Complex"
 SHA_communism_focus_11_desc: "Exchanging scientific secrets for the advancement of the proletariat."
 SHA_communism_focus_12: "Surrounding Threats"
 SHA_communism_focus_12_desc: "We are surrounded by counter-revolutionary forces trying to destroy the newly born socialist [SHA.GetAdjective]. We cannot but have an independent national defense capability."
 SHA_communism_focus_13: "Social Remodeling"
 SHA_communism_focus_14: "Socialization of Means of Production"
 SHA_communism_focus_15: "Planned Economy"
 SHA_communism_focus_16: "Revolutionary Isolationism"

 SHA_communism_diplo_0: "[SHA_communism_diplo]"
 SHA_communism_diplo_0_desc: "Establishment of a socialist international organization is necessary."
