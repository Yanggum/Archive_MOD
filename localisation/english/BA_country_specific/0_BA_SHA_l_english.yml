 # 이벤트
 shacom.1.t: "Austro-Marxism"
 shacom.1.d: "After the February Uprising of 1934, left-wing forces on Austrian land reached near destruction. Under the fascist regime, the worker-farmer-intellectual classes were groaning, and the flame of democracy went out in an instant. However, the situation changed as the Great Migration hit Austria. The Austrian leadership suffered irreparable blows due to Shanhaijing's fierce offensive, and this became a new opportunity for local left-wingers. Left-wing organizations in the private sector are struggling to regain their pre-'34 influence, and linking up with the left-wing of the Black Tortoise Promenade will be of great help in this."
 shacom.1.a: "Welcome the winds of change!"
 shacom.2.t: "Red Vienna"
 shacom.2.d: "Throughout the interwar period, Vienna achieved autonomy under left-wing parties. In Vienna, large-scale public assistance policies were experimentally introduced and eventually settled, enhancing citizens' convenience. However, after the fascists took power, all this went down the drain. Currently, the workers of Vienna support the left-wing of the Black Tortoise Promenade. Organizing them and building a foundation in Vienna will be of great help in the upcoming revolution."
 shacom.2.a: "Let's prepare for the uprising!"
 shacom.3.t: "Clash in the Central Square" 
 shacom.3.d: "On the 4th of last month, thousands of citizens opposed to the Genryumon's feudal rule and shouting for the return of the republic gathered in the square of the Central Special District and held a rally. The executive branch of the Genryumon fired toward them after a dispersal order, and because of this, dozens of citizens were injured. The protesters were dispersed, but the citizens clearly remember the gunfire of the 4th."
 shacom.3.a: "Resist the oppression!"
 shacom.4.t: "Soviet Movement"
 shacom.4.d: "From '18 to '20, numerous socio-political transformations were attempted through soviets spontaneously formed by workers, farmers, and soldiers throughout European countries. Although these attempts in Germany, Hungary, and Austria were all frustrated, we will inherit that legacy. The ruler of the working class is the working class itself!"
 shacom.4.a: "Toward the Soviet Republic!"
 shacom.5.t: "New Leader of the Free Union Alliance"
 shacom.5.d: "Akeshiro Rumi failed to reflect the radical general will of the union members due to her indecisive personality. We must elect a new leader worthy of leading the organization as a red union!"
 shacom.5.a: "Kayama Reijo!"
 shacom.5.b: "Otto Bauer!"
 shacom.5.c: "Yakushi Saya..?"
 shacom.6.t: "Ideological Struggle"
 shacom.6.d: "As labor unions that were weakened or destroyed are re-established, the ideological struggle between unions has also surfaced again. Red unions that serve the left-wing ideology that started the labor union movement in this land insist on broader union rights, but Catholic labor unions that support cooperation with the government and limited union rights are opposing them."
 shacom.6.a: "Let's support the red unions."
 shacom.6.b: "Let's support the Catholic unions."
 shacom.7.t: "Fate of the Genryumon"
 shacom.7.d: "The Genryumon, which functioned as the governing body—the student council—of Shanhaijing Senior Secondary School, was brought down by the socialist Red Guards, and soon the Supreme Soviet declared the dissolution of the Genryumon. However, views on the treatment of the Genryumon officers are divided between imprisoning them and reform through labor."
 shacom.7.a: "They must pay for their crimes."
 shacom.7.b: "Labor is reform!"
 shacom.8.t: "Proletarian Cultural Style"
 shacom.8.d: "The cultural style developed under the feudal-capitalist system is no longer valid under socialist Shanhaijing. Now it is necessary to actively encourage 'socialist' cultural styles based on realism socially. The start will be internal innovation of the Peking Opera Department."
 shacom.8.a: "Let's move toward people's art!"
 shacom.9.t: "Public Care"
 shacom.9.d: "In the general old system, caring for children was a culture typically pushed onto women. But it is clear that such a low-level culture can never be accepted in the new society.\n\nTherefore, we have decided to use the 'Plum Garden' organization, which is already famous throughout Shanhaijing. The 'Red Plum Garden' organization, which will be newly expanded this time, is not simply a childcare service provided for Kivotos people, but a new form of childcare service with the scope of service expanded to humans as well.\n\nFrom its establishment, Red Plum Garden has been receiving support from many Austrian mothers, and through this, we will be able to get a step closer to harmony with local people and simultaneously induce 'desirable thinking' in the children who will be the foundation of the new academy."
 shacom.9.a: "This is an innovation."
 shacom.10.t: "Progress is My Power!"
 shacom.10.d: "Yakushi Saya has decided to enter politics."
 shacom.10.a: "A technocrat, I see."
 shacom.10_tt: "\n§YYakushi Saya§! can now be §Gunlocked§! as a §YDemocratic Leader§!.\n§YYakushi Saya§! can now be §Gunlocked§! as a §YCommunist Leader§!."
 shacom.11.t: "Seizure of Liechtenstein"
 shacom.11.d: "Liechtenstein was exercising its sovereignty as a principality adjacent to us to the west. However, a paranoid anxiety that they were in an unstable siege spread among the Red Guards, and because of that, some Red Guard divisions voluntarily marched toward Liechtenstein. Meaningless small-scale resistance was lightly suppressed, and the princely family and high priests went into exile. However, out of concern for resistance, freedom of faith and broad autonomy were granted to the citizens, and they will live their daily lives no differently than before except for the fact that Red Guards are stationed."
 shacom.11.a: "Individual actions must be stopped."
 shacom.12.t: "Legacy of Luxemburg"
 shacom.12.d: "Rosa Luxemburg, a Polish-born German revolutionary and socialist theorist, wrote 'The Theory of Mass Strike' early in 1906 and suggested what the path to a workers' republic should be. If prerequisite conditions are met, even unorganized workers can participate in a political strike of scale and exert formidable pressure. We will simultaneously start strikes in major cities including Vienna to stop industry, paralyze the economy, and deal a defeat to the oppressors!"
 shacom.12.a: "Everyone, prepare the Molotov cocktails!"
 shacom.13.t: "Successful Strike"
 shacom.13.d: "Due to public enthusiasm, many students also joined our cause, which allowed armed organizations to collude with the striking forces at any time, making it difficult for the Genryumon to use military means. The Genryumon tried to compromise several times, but they could not break through the steel-like non-compromise thesis of the workers. Soon, the organized Red Guards attacked the Genryumon without any resistance. The officers of the Genryumon sensed their defeat and went into exile or surrendered, and the revolution was victorious!"
 shacom.13.a: "This is the power of the mass strike."
 shacom.14.t: "Principle of National Self-Determination"
 shacom.14.d: "We in Shanhaijing, who have proudly shouted socialism in Central Europe, must fight in solidarity against national-level oppression, persecution, and imperialism. Meanwhile, Austria is functioning as a nation-state for Germans, and this implies that we have sovereignty over other German-inhabited provinces in Central Europe. We must reclaim our rightful territory!"
 shacom.14.a: "Toward national liberation!"
 shacom.15.t: "The Second International"
 shacom.15.d: "The Second International was an international alliance of socialist parties founded in 1889 and dissolved in 1916. Although the Stalinists' Third International is still alive and well, their socialist ideals are distinctly different from ours. By rebuilding the Second International, we will practice 'Shanhaijing Socialism' internationally and realize Marxist principles!"
 shacom.15.a: "It's a historical moment."
 shacom.16.t: "Surrounding Threats"
 shacom.16.d: "The flame of the revolution we have achieved is so precarious. There are no comrades to support our revolution in the north, south, east, or west, but rather only enemies full of the intention to strike the axe of counter-revolution on our heads. Our neighbors are afraid of us heading the path we want to go. Rather, the authoritarian regime of Hungary or the fascist regime of Italy might invade us with the justification of rebuilding their 'Fascist Austria'. Whichever it becomes, they are afraid of our socialism, and this will consist of simultaneous invasions like the counter-revolution of 1919 in the East. We must prepare for this! We must demonstrate our own capabilities to the maximum to deter these surrounding threats and liberate the oppressed working class of neighboring countries."
 shacom.16.a: "There is no time!"
 shacom.16_tt: "In §Y720§! days, our §thostile neighboring countries§! will attack us! We can delay their §Yattack timing§! through various methods."
 shacom.17.t: "Red Terror"
 shacom.17.d: "An uncomfortable neighbor [SHA.getname] has settled next to us. They are inciting strikes and revolutions in neighboring countries, and we must counter these attacks. At the appropriate time, we will be able to join forces with other neighboring countries to preemptively subdue them faster than the threat of national subversion."
 shacom.17.a: "Anti-communism is solid!"
 shacom.18.t: "Offensive"
 shacom.18.d: "The time has come. We can launch an offensive toward [SHA.getname]!"
 shacom.18.a: "March!"
 shacom.18.b: "Not yet."
 shacom.19.t: "Interference from Marxists"
 shacom.19.d: "Along with the gathering of domestic Marxists and the civil society sympathizing with it, we had no choice but to cancel the anti-communist offensive plan."
 shacom.19.a: "That's a shame."
 shacom.20.t: "Revolutionary War"
 shacom.20.d: "What we feared has finally happened. However, the entire people and masses of [SHA.getname] will rise up with a general will and endure the counter-revolutionary offensive!"
 shacom.20.a: "Let's stop the counter-revolution!"
 shacom.21.t: "Proletarian Dictatorship"
 shacom.21.d: "After the transition to a socialist system, we decided to strengthen cooperation with the Soviets and reached the conclusion that adopting a Soviet-style revolutionary theory is desirable. According to the ideas of Lenin and Stalin, the overall system will be remodeled, and some opposing opinions will be temporarily prohibited by democratic centralism."
 shacom.21.a: "\"Everything is an action according to necessity.\""
 shacom.22.t: "\"Great Leap!\""
 shacom.22.d: "To deal with numerous enemies around us, the Party decided to adopt the 'Great Leap Forward Movement', imitating the Soviet Stakhanovite movement, as this year's political business. Within a few years, we will emerge as a powerful country that can never be ignored in Europe and Kivotos! According to the Party's instructions, the Great Leap Forward Movement plan has been written in all fronts and all sectors, and will 'leap high' everywhere!"
 shacom.22.a: "Let's believe in and follow the Party and Comrade General Secretary!"
 shacom.23.t: "The Sparrow"
 shacom.23.d: "As usual, [SHA.getleader] went out for an inspection to the workers' mass work sites. In this inspection, they visited the rural village to look into the agricultural status according to the recently progressing Great Leap Forward Movement, and [SHA.getleader] witnessed a shocking sight. It was a small bird pecking at the grain. Party bureaucrats who witnessed this together insisted to [SHA.getleader] that they should drive out the small birds from the rural village, and [SHA.getleader] agonized deeply over this insistence."
 shacom.23.a: "\"They're cute, so it's okay to leave them be!\""
 shacom.24.t: "Discovered Inefficiency of People's Communes"
 shacom.24.d: "Bureaucratic inefficiency has been revealed in the agricultural collectivization process that was seemingly progressing naively! It was discovered that the work motivation of farmers has seriously decreased during the collectivization process, and we will have to approach this problem from the beginning again to solve it!"
 shacom.24.a: "Damn it!"
 shacom.25.t: "Students Immersed in the Cultural Revolution"
 shacom.25.d: "The Cultural Revolution is the transition from cultural styles such as capitalism and feudal superstructure, ideology, law, and art to the new system and vanguard sectors. According to the Party's logic that this should be done from a conscious aspect, students were newly educated and reborn as passionate warriors of the revolution. However, in this process, some extreme students shouted for a more radical dissolution of authority and showed left-wing extremist behavior. They went around damaging local cultural heritage as small-scale acts of vandalism, which became a social problem, and eventually the Hofburg Palace was occupied by them, and students went into a sit-in strike. This was quickly suppressed, but the Party recognized the need to re-examine the policy."
 shacom.25.a: "Full of vigor, I see."
 shacom.26.t: "Results of the Great Leap Forward Movement"
 shacom.26.d: "The time planned by the Party has come. The Party is proceeding with an evaluation of the Great Leap Forward Movement."
 shacom.26.a: "Everything is a result according to our choice."
 shacom.26_tt_1: "§YGreat Leap Forward: Agricultural Collectivization§! has been §Gcompleted:§!\n"
 shacom.26_tt_2: "§YGreat Leap Forward: Agricultural Collectivization§! was §Rnot completed:§!\n"
 shacom.26_tt_3: "\n§YGreat Leap Forward: Acceleration of Arms Production§! has been §Gcompleted:§!\n"
 shacom.26_tt_4: "\n§YGreat Leap Forward: Acceleration of Arms Production§! was §Rnot completed:§!\n"
 shacom.26_tt_5: "\n§YGreat Leap Forward: Cultural Revolution§! has been §Gcompleted:§!\n"
 shacom.26_tt_6: "\n§YGreat Leap Forward: Cultural Revolution§! was §Rnot completed:§!\n"
 shacom.26_tt_7: "\n§YGreat Leap Forward: Military Reform§! has been §Gcompleted:§!\n"
 shacom.26_tt_8: "\n§YGreat Leap Forward: Military Reform§! was §Rnot completed:§!\n"
 shacom.26_tt_9: "\n§GAll Great Leap Forward Movements have been completed!§!\n"
 shacom.27.t: "Catholic Resistance"
 shacom.27.d: "The local Austrian Catholic forces who were early on wary of our new line for Shanhaijing decided to go into action. The Catholics are forming political associations against our cause centered on rural villages by mobilizing strong organizational power between the church and the followers."
 shacom.27.a: "Damn it!"
 shacom.28.t: "Crushing the Catholic Resistance"
 shacom.28.d: "We have visibly defeated the resistance of the Catholic Church, which was our political opposition association over the past period. Now we will trample their remaining stooges through legal and economic means and completely crush the room for resistance!"
 shacom.28.a: "Struggle!"
 shacom.29.t: "Rural Socialism"
 shacom.29.d: "The problem with established Austro-Marxism or Social Democracy is that they did not actively spread propaganda activities in rural villages. Until now, farmers were perceived as enemies of the class who combine with Catholic forces to hinder social progress, but from now on, we will actively recruit them and organize a revolutionary peasant movement."
 shacom.29.a: "Good."

 shafas.1.t: "Coup of the Peking Opera Department!"
 shafas.1.d: "\"In the name of Shanhaijing's tradition, we denounce the Master of the Genryumon, $SHA_KISAKI$!\"\n\nOn the fateful day when the opera was scheduled, hundreds of spectators and the Peking Opera Department gathered at the White Tiger Square. However, the opera presented that day was not a simple performance. It was a sharp satirical play directly targeting the current Master of Shanhaijing's Genryumon, $SHA_KISAKI$, comparing her to a \"Black Monarch\".\n\nThe plot of the opera was about a foolish Black Monarch who carelessly opens the castle gates, saying she would welcome the winds of change, resulting in chaos and confusion for the people. The performance contained a strong message of criticism toward the Master along with fantastic scenes unfolding on the stage. As soon as the opera ended, the square seethed with shouts, and radicals and conservatives of the Genryumon began their activities in earnest.\n\nEventually, that day's performance became the signal flare of a revolution instead of a simple opera. Radicals and conservatives joined forces with the Peking Opera Department to declare the ousting of Master $SHA_KISAKI$ at the White Tiger Square, and the site was covered in confusion and anger.\n\nCurrently, $SHA_KISAKI$ is under house arrest at a VIP residence. She is receiving a certain amount of courtesy thanks to her status as the former Master. However, after her downfall, the future of Shanhaijing is still shrouded in fog. Among the people, debate continues about what the policy direction of $SHA_KAGUYA$, who newly rose to the position of Master, will be.\n\nHowever, voices of concern are coming out internally. Dangerous rumors are spreading that $SHA_KAI$, who disturbed the security of Shanhaijing several years ago, is plotting another wicked conspiracy..."
 shafas.1.a: "Let's protect our traditions!"

 shafas.2.t: "Opposition of the Black Tortoise Promenade!"
 shafas.2.d: "The Black Tortoise Promenade strongly issued a statement opposing our coup. For now, their movement does not seem like a big threat, but if we leave it as is, there is a possibility that the situation will change rapidly. They might quickly expand their power and call for another revolution against us. \n\nIf they really want confrontation, Shanhaijing will be stained with blood, and the tradition we have protected for decades will be destroyed beyond recovery. To prevent such a situation, we must take decisive action now. Whether the Black Tortoise Promenade's resistance stops at simple backlash or leads to a bigger conflict depends on our response."
 shafas.2.a: "This is somewhat heretical..."

 shafas.3.t: "Radicals Lurking Inside"
 shafas.3.d: "Currently, Shanhaijing is in chaos. As the Peking Opera Department's coup spread into a revolution, Kisaki, who was the Master of the Genryumon, transferred the position of Master to Urushibara Kaguya and is currently confined at a VIP residence. The revolution was completed somewhat successfully, but there are still tons of problems to solve.\n\nHowever, suspicious movements are being detected internally. Shintani Kai wants to take the position of Master of Shanhaijing by taking advantage of this chaos. It is presumed that the radicals of the Alchemist Association do not recognize the current temporary Master Urushibara Kaguya and only follow Shintani Kai's orders, suggesting the Alchemist Association is already encroached upon by her."
 shafas.3.a: "We must be two steps ahead."

 shafas.4.t: "Coup of the Black Tortoise Promenade!"
 shafas.4.d: "After the Peking Opera Department's coup, another coup occurred in Shanhaijing. This time, the Black Tortoise Promenade gathered the remaining moderates of the Genryumon and began to oppose our forces.\n\nThey claimed that the Peking Opera Department's revolution is an act that completely goes against Shanhaijing's tradition and was carried out for the purpose of Shintani Kai's reinstatement. Also, they began to incite students, shouting for revolution while saying they are the ones who will regain Shanhaijing's stability."
 shafas.4.a: "The Black Tortoise Promenade has succeeded in the coup!"
 shafas.4.b: "They will pay the price for their betrayal!"

 shafas.5.t: "Dummy Event"
 shafas.5.d: ""
 shafas.5.a: "Dummy Event"

 shafas.6.t: "Conservative Revolution"
 shafas.6.d: "To deter the goals of the Black Tortoise Promenade and the aftermath of the Great Migration from two months ago, the Peking Opera Department, which sought to integrate factions with similar thoughts and understandings, played an important role in protecting the interests of Shanhaijing. Due to the Peking Opera Department's activity, the goals of the Black Tortoise Promenade were thwarted, and the influence of the Great Migration's aftermath was also minimized and suppressed.\n\nHowever, Shanhaijing is facing a crisis from internal defects beyond external threats. The Master's weak parliamentary policy direction not only reduced her to a puppet but also contained the possibility of driving the very foundation of Shanhaijing conservatism to ruin. To prevent this, the Peking Opera Department raised the flag of revolution against the academy.\n\nUnder the excellent leadership of Peking Opera Head Urushibara Kaguya, the tasks that the Genryumon's conservatives failed to achieve due to trivial rivalry and lack of determination have finally come to fruition. The stale disputes have finally ended, and a bridge has been laid connecting the past conservative movement and the modern conservative movement. The era of aimless idealism called parliamentarism and the pseudo-leftist experiments of the Black Tortoise Promenade has now reached its end.\n\nNow the time is imminent for the true Peking Opera Department to tear down the corrupt power structure of the past and open the prelude to the conservative revolution."
 shafas.6.a: "Let's begin."

 shafas.7.t: "Shanhaijing Defense Force"
 shafas.7.d: "The Shanhaijing Defense Force is the core force responsible for ground warfare and national territory defense, carrying the mission to protect the academy. However, they are closer to a party army that offers loyalty to the Genryumon rather than the academy called Shanhaijing. The commander-in-chief of the Defense Force is the current Master [SHA.GetLeader], and the Executive Head below them is in charge of practical command.\n\nThe history of the Defense Force began with the Genryumon. It started as a structure of separating the military sector of the Genryumon to exercise absolute control, and through this, established the principle of civilian control. The reign of the former Master was a great blessing for the Defense Force but simultaneously a poisoned chalice. The former Master promoted a massive expansion of the Defense Force and organized a huge budget, and actual execution took place, allowing the Defense Force to possess considerable military power. However, conflicts with internal Genryumon personnel opposed to this deepened, and after various factors combined, the former Master eventually fell from power and the defense budget was also drastically cut.\n\nThe war with Austria ended so easily it was almost futile. Austria's Chancellor Kurt Schuschnigg resigned taking responsibility for the war, and with the President's declaration of surrender, organized resistance virtually ended. However, remaining Austrian soldiers who refused to surrender and nationalist-leaning militias are continuing engagements with the Defense Force in the western special district and the Tyrol, including the Alpine region."
 shafas.7.a: "Loyalty!"

 shafas.8.t: "Ultimatum"
 shafas.8.d: "The Shanhaijing government claims its own sovereignty over [972.GetName], which was occupied by Hyakkiyako by force, and is demanding the immediate return of the said territory. The warning that if there is no response within 48 hours, the two countries will enter a state of war clearly shows that this demand is not just an empty threat.\n\nMeanwhile, we also have the issue of sovereignty over [1086.GetName], which Shanhaijing is illegally occupying, but mentioning this in such a situation could be interpreted as expressing a will for war to the Shanhaijing side. This carries the risk of further worsening the current tension, necessitating a cautious approach."
 shafas.8.a: "We do not back down!"

 shafas.9.t: "[FROM.GetAdjective] Refused Our Demand!"
 shafas.9.d: "Is there a need for long words?"
 shafas.9.a: "Then there is only war!"

 shafas.10.t: "Not being used, what should I do"
 shafas.10.d: ""
 shafas.10.a: "What should I do"

 shafas.11.t: "Return in Glory"
 shafas.11.d: "The conspiracy has succeeded! Radicals and alchemists who were lurking inside Shanhaijing succeeded in ousting Urushibara Kaguya late tonight and crowned their leader Shintani Kai as the new power. Of course, Urushibara Kaguya's blunders would have had no small impact on the process of Shintani Kai seizing power, but it can be said that our merit in creating the situation by using her is even greater.\n\nCurrently, Shintani Kai is reorganizing the government as she pleases, and numerous key personnel of the Genryumon are disappearing in a whirlpool of resignation and dismissal. Key positions are quickly being filled with figures who swore loyalty to Shintani Kai, and the remaining existing personnel are also failing to show any resistance in front of the overwhelming loyalists.\n\nMeanwhile, Shintani Kai is preparing a speech to officially declare the political change."
 shafas.11.a: "Everything is according to plan."

 shafas.12.t: "Spreading Fear"
 shafas.12.d: "In the revolution, there is a conspiracy theory among the people of Shanhaijing that Shintani Kai is behind the revolution. However, recently this content turned out to be true and the students of Shanhaijing are afraid that things like the past will happen again."
 shafas.12.a: "Let's take quick action regarding Shintani Kai."
 
 shafas.13.t: "Trial of $SHA_KAI$"
 shafas.13.d: "$SHA_KAI$ brought great chaos to Shanhaijing in the past. The medicine she distributed for her own purposes caused fatal damage to Shanhaijing students, and the former Master Ryuge Kisaki used this as a pretext to even break traditions and forcibly expel her. However, it was revealed that some alchemists contacted Shintani Kai during the revolution, and Urushibara Kaguya held a trial for $SHA_KAI$ to regain public sentiment."
 shafas.13.a: "It would be right to expel her to gain public sentiment after all."
 shafas.13.b: "Put her under intensive surveillance!"

 shafas.14.t: "Fate of Yakushi Saya"
 shafas.14.d: "As the Alchemist Association completely fell into Shintani Kai's hands, the fate of Yakushi Saya, the former head of the Alchemist Association, was slowly approaching. Yakushi Saya is a person with a position exactly opposite to Shintani Kai and has consistently opposed Shintani Kai's unethical but practical experiments.\n\nShintani Kai herself has no personal feelings toward her and intends to finish it at the level of demoting Saya to an ordinary member of the Alchemist Association. However, voices demanding Saya's imprisonment are growing within the Alchemist Association."
 shafas.14.a: "Be satisfied with demoting her"
 shafas.14.b: "Then lock her up"

 shafas.17.t: "Radical Militia"
 shafas.17.d: "Due to political chaos in Shanhaijing and the aftermath of the Great Migration, some radical forces within Shanhaijing Senior Secondary School have gathered and are carrying out militia activities. They are especially launching attacks targeting left-wing-leaning forces including the Black Tortoise Promenade. Students possess some means to resist such raids, but local Austrians do not, which may become a spark for conflict in the future."
 shafas.17.a: "Such actions must stop immediately. Dispatch the executive branch to disband the militia."
 shafas.17.b: "Why should we block the actions of patriots?"

 shalose.1.t: "Large-Scale Protest Occurs"
 shalose.1.d: "Large-scale protest demanding the resignation of the regime"
 shalose.1.a: "This is somewhat heretical.."

 shalose.2.t: "The End"
 shalose.2.d: "On the very next day after the defeat was formalized, Shintani Kai cut off all traces. There was not even a last message left. The office was left as it was without being tidied, and the medicine bottles and charts she handled herself remained. People say that a scientist who couldn't admit failure eventually erased even herself in the laboratory.\n\nShanhaijing Senior Secondary School is currently experiencing chaos close to an anarchic state without a leader. Various speculations about Shintani Kai's whereabouts are rampant among the people, but no one is certain. Did she choose death, or did she go into hiding for another experiment?\n\nOnly one thing is certain: she couldn't take off the shell of madness in front of the weight called responsibility and tried to handle even the final moment alone."
 shalose.2.a: "\"This is an experiment,\" is a phrase she often used."

 shalose.2.d_2: "A few days after the defeat was formalized, Urushibara Kaguya voluntarily appeared before the citizens. She admitted that the conservative revolution had failed and declared she would receive legal judgment according to public sentiment. She was immediately arrested and referred to trial.\n\nMany public opinions demanded her expulsion, but the court judged that there was a possibility of reform for her and decided to imprison her in the Correction Bureau. However, this decision provoked strong backlash from Shanhaijing students. Dissatisfaction was expressed about a person who caused chaos within Shanhaijing receiving judgment outside of Shanhaijing.\n\nAs people claiming this ruling is not fair appeared, the situation intensified to the level of a militia. Those who opposed the conservative revolution and rearmed with ultra-rightist ideology organized armed groups and various violent incidents are occurring, such as attacking the Shanhaijing Central Special District with guns."
 shalose.2.b: "How many people suffered under the name of 'Grand Conservative Revolution'..."

 shalose.3.t: "Military Coup"
 shalose.3.d: "The city did not fall into darkness. In every place where lights went out, gun barrels woke up, and behind those gun barrels was Konoe Mina. The Shanhaijing Senior Secondary School government building was open without resistance, and no one blocked her. There was no reason to block, nor power to block.\n\nThe regime after Shintani Kai disappeared was shaking as if hanging in the air. Vanished leader, collapsed administration, disarmed citizens. The word 'government' no longer carried meaning, and people wanted a clear voice. They were waiting for a direction, an order, the appearance of someone.\n\nThrough that void, Konoe Mina appeared. Originally an operational staff of the Defense Force and a person who held the position of battalion commander. She was a person of few words but strangely of the type who often forgot radio calls. If she unfolded an operational map, she started holding it upside down, but anyway, she arrived at the destination.\n\nThe Defense Force she leads advanced into the city center. It was almost a bloodless entry. The government was already in an anarchic state, and militias and residents who occupied the streets waved their hands with a faint hope called 'Return of Order' toward the Defense Force."
 shalose.3.a: "Order has been set right!"

 shadem.1.t: "First Election"
 shadem.1.desc: "A historic first democratic election was held in Shanhaijing. This election is receiving great interest even among various academies of Kivotos in that it is a transition to a democratic government and a presidential election beyond just electing a leader.\n\nMany citizens participated in the election campaign and have agonized deeply over who to vote for, and finally, the day of destiny has come.\n\nThree candidates ran in this election.\nThe first candidate is the former Master Ryuge Kisaki, and the second candidate is Akeshiro Rumi, who is currently receiving the highest support while leading the reform. These two have secured enormous support rates and no one can easily determine the winner.\n\nNow an important moment of choice to determine the future of Shanhaijing is approaching."
 shadem.1.desca: "A historic first democratic election was held in Shanhaijing. This election is receiving great interest even among various academies of Kivotos in that it is a transition to a democratic government and a presidential election beyond just electing a leader.\n\nMany citizens participated in the election campaign and have agonized deeply over who to vote for, and finally, the day of destiny has come.\n\nThree candidates ran in this election.\nThe first candidate is the former Master Ryuge Kisaki, the second candidate is Akeshiro Rumi, who is leading the reform, and finally, Yakushi Saya, the head of the Alchemist Association.\n\nNow an important moment of choice to determine the future of Shanhaijing is approaching."
 shadem.1.a: "Ryuge Kisaki!"
 shadem.1.b: "Akeshiro Rumi!"
 shadem.1.d: "Yakushi Saya!"

 shadem.2.t: "Into the People"
 shadem.2.desc: "Many people in Shanhaijing still don't know much about democracy. From the separation of powers that is the basis of democracy, to the duties and responsibilities of citizens under a democratic system, many people in Shanhaijing do not accurately understand those concepts. Akeshiro Rumi thought she couldn't plant her ideals in Shanhaijing with only the existing Genryumon talents and decided to set up a countermeasure. "
 shadem.2.a: "Into the people! - Intellectuals, enlighten the masses!"

 shafla.1.t: "Must Eat a Lot to Gain Strength!"
 shafla.1.desc: "Under the name of the Genryumon edict to carry out relief work, it was the Black Tortoise Promenade that moved most busily. At the time of the Great Migration, they had gone out to the battlefield themselves to protect the association, but this time they were fighting a completely different battle. It was, specifically, the task of making food for hungry people.\n\nAs lunchtime approached, people flocked in front of the Black Tortoise Promenade. There were branch stores throughout Shanhaijing, but the most famous place was definitely the main store in [4.GetCapitalVictoryPointName]. This was because Akeshiro Rumi's excellent cooking skills became known through word of mouth.\n\nA child carefully approached among the people.\n\"Excuse me... please give me just one food... because I'm hungry... really just a little...\"\n\nRumi looked down at the child and smiled warmly.\n\"Sure, kid. You were very hungry? Haha, okay. Just wait a little. I'll treat you to the best dish!\"\n\nShe went into the kitchen, moved her hands quickly, and after a while, carefully made a special fried rice and put it in front of the child. The child ate the food greedily with a bright smile, and Rumi quietly watched that appearance. Thus, time was flowing slowly."
 shafla.1.a: "Rice is important, you know?"

 shafla.2.t: "Transitional Stagnation"
 shafla.2.desc: "We opened the market and introduced capitalist elements from the existing planned economy system led by the central government. While these reforms were showing more effective results than existing economic policies, a transition of economic system that was too fast carried a high risk of causing stagnation in the implementation process.\n\nThe bold challenge of introducing a capitalist system faced a crisis to the extent of appearing as a failure, but the analysis results of experts announced today showed a hopeful prospect. The economic situation is gradually getting better, and people are starting to consume again. The advantages of the capitalist economic system began to reveal themselves, and now it seems time to finish Shanhaijing's economic reform while gradually reducing the intervention of experts."
 shafla.2.a: "That's good news!"

 shafla.3.t: "Uwaaat!"
 shafla.3.desc: "When the Master position of the Genryumon passed from Urushibara Kaguya to Shintani Kai, Akeshiro Rumi judged that her faction, the Black Tortoise Promenade, would suffer a blow. She sensed a crisis and soon went into action. However, this could only be a big stumbling block for the new regime, and Shintani Kai prepared a trick.\n\n— Bang!\n\nA sudden explosion echoed inside the Black Tortoise Promenade. The personnel inside were surprised and flocked to the source of the sound, and smoke began to rise from there. At first, they regarded it as just a simple disturbance, but at the moment Rumi and the students belonging to the Black Tortoise Promenade tried to leave their seats—\n\nSuccessively, several bombs began to explode continuously, and thick smoke covered the interior in an instant.\n\nAfter a while, as the smoke cleared, what appeared was surprisingly students belonging to the Black Tortoise Promenade who had become young children.\n\n\"What... what's happening!?\"\n\n\"Wh... what should we do, President!?\"\n\nA flustered Reijo asked Rumi urgently.\n\nRumi froze for a moment but soon regained her composure and gave an order.\n\n\"Contact Saya. Right now!\"\n\n\"Ye... yes!\"\n\n\"And—\"\n\nAnother explosion. This time, Rumi herself changed into her appearance from her childhood days. "
 shafla.3.a: "Went to the hospital immediately. Fortunately, there was no problem with her health."
 shafla_3_tt: "Akeshiro Rumi's portrait will be changed as follows.\n--------------------------------\n\n\n\n\n\n\n£GFX_Portrait_SHA_Akeshiro_Rumi_Child\n\n\n\n\n\n\n\n--------------------------------"

 shafla.4.t: "Tax Increase?"
 shafla.4.desc: "The Genryumon's finances are being depleted rapidly after the incident. This is a result of several factors combined. Everything is simultaneously pressing the finances, from rapid military spending incurred during the incident suppression process, administrative costs to manage confused regions, and even restoration costs for provinces damaged by battle. Now that the national treasury is quickly running out, we have two choices. Increase taxes to expand the national treasury and mitigate the financial burden, or carry out fundamental reforms to drastically reduce spending. Whatever choice is made, a point for rapid decision-making is necessary."
 shafla.4.a: "It can't be helped, let's increase it."
 shafla.4.b: "Let's maintain it."

 shafla.5.t: "Controversy over Military Spending Cut"
 shafla.5.desc: "The Shanhaijing Defense Force drastically expanded military spending during the engagement process with the Austrian army at the time of the incident. However, even now that the battle is over, military spending is being maintained without being cut for various reasons. Voices demanding arms reduction are growing within the Genryumon. It is a situation where they are seriously requesting a military spending cut based on the desperate need to secure financial stability, along with the excessively bloated size of the Defense Force and the need for transition to a peacetime system. Of course, opposing opinions are also formidable. Forces centered on Konoe Mina are pointing out the Austrian militia that still remains as a threat and emphasizing the need to maintain military power. Their claim is that the current level of military spending should be maintained until the militia is completely subdued."
 shafla.5.a: "Let's cut military spending."

 shafla.6.t: "Merchant Relief?"
 shafla.6.desc: "If anyone were to pick one of the roots of Shanhaijing's industry and a group representing Shanhaijing, everyone would say merchants. Of course, others such as farmers, artisans, and miners are also important axes supporting the Shanhaijing economy. However, the role of merchants responsible for trade and distribution is so important it's incomparable to anything else. But it was also the merchants who were hit hardest by the incident. This is because commercial activity itself was paralyzed as trade routes were cut and markets were destroyed. In a situation where basic infrastructure was all damaged, merchants had no choice but to helplessly watch their deficits grow to an unmanageable extent until restoration was carried out. It is predicted that unmanageable costs will be required to relieve merchants."
 shafla.6.a: "Let's relieve them."
 shafla.6.b: "Let's not relieve them."

 shafla.7.t: "Recovering Shanhaijing Economy"
 shafla.7.desc: "The worst wound left by the tragedy of the Great Migration in Shanhaijing was economic collapse. Shanhaijing's economic system, which developed centered on commerce, crumbled helplessly in front of destroyed infrastructure, cut trade networks, and successive industrial bankruptcies. The economic structure, which was fragile from the beginning, was completely broken. The aftermath was miserable. Shanhaijing's merchants lost their means of livelihood overnight and were driven to the streets, factories stopped operation, and artisans could no longer make anything.\n\nHowever, fortunately, sprouts of hope began to show. As infrastructure restoration work progressed and the Genryumon actively intervened, Shanhaijing's economy began to revive little by little. Scars of the incident still remain deep, but at least basic daily necessities can be obtained and there is room to enjoy small luxury items. A particularly noteworthy change is that the Black Tortoise Promenade, an association of merchants, resumed full-scale activity. As materials began to circulate again through recently serviced trade routes, vitality began to return to the catering industry.\n\nBureaucrats of the Genryumon are putting total effort into relieving failed industries and seeking sustainable solutions for economic difficulties under the leadership of [ROOT.GetLeader]. As the Genryumon's economic reconstruction plan began to be promoted in earnest, many people are watching it with expectation and concern about what appearance it will actually materialize in."
 shafla.7.a: "Grease the wheels of growth!"
 tooltip_SHA_industry_focus_accessible: "Now focuses §Y$SHA_shanhaijing_trade_promotion$§! and §Y$SHA_austria_unemployment_relief$§! can be completed."

 shadip.1.t: "[SHA.GetAdjective] Requested Tea Leaf Export"
 shadip.1.desc: "Today, a diplomatic document arrived from [64.GetCapitalVictoryPointName]. This was the first and symbolic diplomatic document sent from Shanhaijing's [SHA.GetLeader] side between both academies. However, the content was surprisingly a relatively minor issue.\n\nShanhaijing has continued unofficial exchange with Trinity's Tea Party from the past, and this time they delivered a request wanting to officially import ‘tea leaves’ grown in Trinity. Especially, the background of this request is analyzed as the demand explosively increased as tea culture recently became rapidly popular within Shanhaijing.\n\nAs the Shanhaijing side officially requested through a diplomatic document, there is a concern that relations between both academies will worsen if this is refused."
 shadip.1.a: "Let's approve the tea leaf export!"
 shadip.1.b: "There is no reason to give away Trinity's resources carelessly."

 shadip.2.t: "[TRM.GetAdjective] Started Tea Leaf Export"
 shadip.2.desc: "Fortunately, the [64.GetCapitalVictoryPointName] side started tea leaf export, and the first volume fitting Shanhaijing's recently rapidly increased black tea demand arrived in Shanhaijing today. Especially, this export includes special high-quality tea leaves for the Master of the Genryumon, and it is known that Trinity's Tea Party grew them themselves. In addition, handmade cookies carefully prepared by the [TRM.GetLeader] side were also delivered, being accepted as a sincere mark of friendship beyond simple trade."
 shadip.2.a: "That's a wonderful story"

 shadip.3.t: "[TRM.GetAdjective] Refused Tea Leaf Export Proposal"
 shadip.3.desc: "Unfortunately, the [TRM.GetAdjective] side refused our proposal."
 shadip.3.a: "They really refused this"


 # 뉴스 이벤트
 shanews.01.t: "Coup Occurred in Shanhaijing!"
 shanews.01.desc: "This morning, shocking news shaking Kivotos was delivered. It's the news that the Peking Opera Department in Shanhaijing carried out a surprise coup targeting Master Ryuge Kisaki. The Peking Opera Department put forward the justification that Ryuge Kisaki abandoned Shanhaijing's unique tradition, but the truth hidden behind it is still shrouded in mystery. It is speculated that something major occurred in Shanhaijing, which has maintained isolation even after the Great Migration.\n\nAfter the Peking Opera Department seized power, ominous rumors are spreading. The news that Shintani Kai, one of the 'Seven Prisoners' who once received an expulsion from Shanhaijing, recently escaped is being spotlighted again, and public sentiment is greatly unsettled."
 shanews.01.a: "It's tradition, not change!"
 shanews.01.b: "That too is eventually one of the changes."

 shanews.02.t: "Shanhaijing Conservative Revolution"
 shanews.02.desc: "An amazing situation occurred today. The Peking Opera Department and its head, Urushibara Kaguya, transferred all authority to Ryuge Kisaki and announced a declaration that they would start practicing their Shanhaijing conservatism in earnest. Right after this announcement, numerous Peking Opera members are being witnessed coming out to the streets in response to this.\n\nUntil now, Ryuge Kisaki's official statement has not been announced, but the interpretation that her silence is condoning the Peking Opera Department's move is dominant."
 shanews.02.a: "Let's eradicate decadent culture!"
 shanews.02.b: "What on earth is happening?!"
 shanews.02.c: "It's another example that Shanhaijing is a reactionary state."

 shanews.03.t: "2nd Coup Occurred in Shanhaijing"
 shanews.03.desc: "Another shocking news was delivered today from Shanhaijing. It's the news that Shintani Kai, the Ape of Five Lusts and one of the Seven Prisoners, won the power struggle with the Peking Opera Department, pushed the Peking Opera Department out from the center of power, and seized the regime. This incident is causing a big wave throughout Shanhaijing.\n\nShintani Kai put forward sweet words through her speech, saying \"I will devote myself to Shanhaijing,\" but only she will know her true intention. Surrounding academies have not yet announced official positions, but it's highly likely that this incident will not be accepted as welcome news."
 shanews.03.a: "Let's welcome her!"
 shanews.03.b: "This is a security threat..."
 shanews.03.c: "It sounds a bit gloomy..."

 shanews_04_template: "\n\nAs the [SHA.GetFactionName] was signed in Southern Kivotos, experts are forecasting that the hegemony competition in the Balkan region will intensify further. Also, Italy, which has a direct interest in the treaty, is showing a restrained reaction."
 shanews.04.t: "Establishment of Shanhaijing Pact"
 shanews.04.t_1: "Rebuilding the Second International"
 shanews.04.desc_c: "As a new wind of change blows in Shanhaijing today, [SHA.GetLeader] established the Shanhaijing Pact. Urushibara Kaguya, the Head of the Peking Opera Department and the current power in Shanhaijing, actively supported the establishment of this agreement and evaluated it as an essential policy for Shanhaijing conservatism.$shanews_04_template$"
 shanews.04.desc_s: "As a new wind of change blows in Shanhaijing today, [SHA.GetLeader] established the Shanhaijing Pact. [SHA.GetLeader] emphasized that this agreement was an inevitable choice within their policy stance and admitted that some isolation policies had to be modified as a result.$shanews_04_template$"
 shanews.04.desc_nothing: "As a new wind of change blows in Shanhaijing today, [SHA.GetLeader] established the Shanhaijing Pact. [SHA.GetLeader] had worked for the establishment of the agreement even while modifying existing isolation policies, and pushed this forward by exercising the Master's authority despite the opposition of her supporters.$shanews_04_template$"
 shanews.04.a: "A new Shanhaijing emerges!"
 shanews.04.c: "What about adhering to isolationism?"
 shanews.04.d: "Is it the birth of a new hegemony?"
 shanews.05.t: "Establishment of [SHA.getfactionname]"
 shanews.05.desc_1: "As a new wind of change blows in Shanhaijing today, [SHA.GetLeader] emphasized [SHA.getname]'s role in the Comintern Western Front. [SHA.GetLeader] emphasized that this thesis is a 'state-struggle' toward the practice of socialism and stressed that they will walk the path of worker liberation under the internationalist ranks.$shanews_04_template$"
 shanews.05.desc_2: "As a new wind of change blows in Shanhaijing today, [SHA.GetLeader] rebuilt the Second International. [SHA.GetLeader] emphasized that this thesis is a 'state-struggle' toward the practice of socialism and stressed that only the proclamation of a new International can be the path to worker liberation.$shanews_04_template$"

