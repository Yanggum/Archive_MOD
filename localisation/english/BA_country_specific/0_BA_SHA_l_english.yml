 SHA_comintern_western_front: "Comintern Western Front"
 SHA_principle_of_national_self-determination_0: "National Self-Determination"
 SHA_principle_of_national_self-determination_0_desc: "$shacom.14.d$"
 SHA_principle_of_national_self-determination_1: "Sudetenland Sovereignty"
 SHA_principle_of_national_self-determination_1_desc: "We must liberate the Sudetenland Germans."
 SHA_principle_of_national_self-determination_2: "Establish Autonomous Soviet Republics"
 SHA_principle_of_national_self-determination_2_desc: "We will establish Autonomous Soviet Republics to govern our non-German occupied territories independently."
 SHA_principle_of_national_self-determination_3: "Soviet Principles" 
 SHA_principle_of_national_self-determination_3_desc: "Several small units of workers' soviets will operate the Autonomous Soviet Republics."
 SHA_principle_of_national_self-determination_4: "Democratic Centralism"
 SHA_principle_of_national_self-determination_4_desc: "The Autonomous Soviet Republics will be ruled by a single vanguard party."
 SHA_principle_of_national_self-determination_4_tt: "§YAutonomous Soviet§! will become the leader."
 SHA_principle_of_national_self-determination_5: "Greater Austria Sphere"
 SHA_principle_of_national_self-determination_5_desc: "We must recover the Greater Austria sphere and declare a solid, single socialist republic for the region."

 SHA_communism_diplo_1: "Practical Austro-Marxism"
 SHA_communism_diplo_1_desc: "Ideology is fine, but we need food and guns."
