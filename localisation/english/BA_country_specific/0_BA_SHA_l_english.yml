 If_you_dont_write_here_I_ll_kill_you: "Writing Required!"
 SHA_GATHERING_STORM_DESC: "Located on the outskirts of Kivotos, Shanhaijing Senior Secondary School was an academy that operated stably based on its vibrant tourism industry and the shopping districts of the Black Tortoise Promenade.\n\nAfter the dust of the Great Migration settled, a Shanhaijing ruled by the Genryumon emerged in the former Austrian territories. However, their appearance brought new threats regarding the status of Master Ryuge Kisaki.\n\nCurrently, Shanhaijing faces external threats from renewed conflicts in northern Kivotos and a belligerent Italy to the south. Of course, internal instability cannot be ignored either."
 SHA_country_intro_header: "Academy of Tradition and Gastronomy [SHA.GetName]"
 SHA_country_intro_content: "Shanhaijing Senior Secondary School, an ancient and traditional academy located on the outskirts of Kivotos, was a beautiful school with a unique culture that set it apart from others. Tourism, including the Black Tortoise Promenade, flourished, making it a considerably developed academy.\n\nThe internal power struggle within Shanhaijing is so severe that it's a wonder how the school even maintains itself. The downfall of the previous Master and the inauguration of Master Ryuge Kisaki sent shockwaves through both the radical and conservative factions of the Genryumon. Particularly after Kisaki's inauguration, as her faction and the moderates grew rapidly, the power struggle with the radicals and conservatives intensified. They are in sharp confrontation over the position of Master of the Genryumon, the heart of Shanhaijing.\n\nHowever, this power struggle is not limited to the Genryumon. The Black Tortoise Promenade, the next most powerful force, has taken a leading role in tourism and the catering industry, leading to frequent contact with other academies. In this flow, the Promenade naturally began to advocate for reform and opening, clashing with the Genryumon, which seeks to preserve Shanhaijing's conservative values.\n\n§YDeveloper: jindoi§!"
