 SHA_coup_of_Black_Tortoise_Promenade: "Worsening of Black Tortoise Promenade's Patience"
 SHA_coup_of_Black_Tortoise_Promenade_desc: "\n\n£GFX_SHA_Rumi_cat\n\n\n\n\nThe Black Tortoise Promenade is an organization with an open tendency and is closely related politically with the reformers of the Genryumon. Their openness has caused constant conflict among conservatives who value Shanhaijing's tradition. However, now that the Peking Opera Department has raised a revolution with the justification of maintaining Shanhaijing's tradition, conflict with the Black Tortoise Promenade has become unavoidable."
 SHA_BTP_revolt_mission: "Black Tortoise Promenade Rebellion"

 SHA_invade_of_Hyakkiyako_cat: "Southern Kivotos War"
 SHA_invade_of_Hyakkiyako_cat_desc: "The Shanhaijing army entered the war in a state of insufficient preparation due to a hasty attack. However, Hyakkiyako, which received a surprise attack, is also in a situation where its offensive capability is weakened due to great shock. Taking advantage of this, Shanhaijing plans to quickly complete the wartime system and force Hyakkiyako to surrender."
 SHA_operational_planning: "Execute Offensive Plan"
 SHA_shock_relief: "Shock Mitigation"
 SHA_attack_plan: "Shanhaijing's Offensive"
 
 HYA_invade_of_Hyakkiyako_cat: "Southern Kivotos War"
 HYA_invade_of_Hyakkiyako_cat_desc: "Shanhaijing and Hyakkiyako have continued mutual sovereignty disputes over Southern Sudetenland and the Linz province since the Great Migration. Now that war has broken out, we must put an end to this sovereignty dispute."

 SHA_Solving_the_austria_Militia: "Solving the Austrian Militia"

 SHA_conservative_policy_cat: "Conservative Revolution"
 SHA_conservative_policy_cat_desc: "\n\n£GFX_decision_SHA_conservative_policy_cat_picture\n\n\n\n\nWhile the political landscape of §GShanhaijing§! is fluctuating sharply, the one who suppressed all power struggles and finally won was §1Urushibara Kaguya§!. She officially declared the §Y'Conservative Revolution'§! she had prepared for a long time and set out on the path of full-scale reform, putting §gRyuge Kisaki§! forward as a symbolic leader to rally the support of the student society as a whole.\n\nAfter the first reform measures were implemented, various policies are being discussed, and at its core lies the §Yconservative ideal§! pursued by §1Urushibara Kaguya§!. She is promoting systematic reconstruction work across society, such as reorganizing the education system based on traditional values and order, the conservatism of public policy, and the re-establishment of §GShanhaijing§!'s unique view of ethics.\n\nThese reforms go beyond simple political transformation, being a task of re-founding the identity and philosophy of §GShanhaijing§! from the root and a process of clearly defining the direction to move forward. Under the leadership of §1Urushibara Kaguya§!, §GShanhaijing§! is overcoming past chaos and transforming into a §Ynew form of conservative state§!.\n"
 SHA_conservative_social_reform: "Conservative Revolution: Social Sector"
 SHA_conservative_social_reform_desc: "Shanhaijing society is being seriously damaged by the ills of liberalism. Especially liberal values, individualism, and Darwinian thinking are collapsing Shanhaijing's tradition and communal order, spreading disease throughout society. To overcome this crisis, we must re-establish Shanhaijing's unique values through the Conservative Revolution and recover traditional ideals and norms. Especially, taking the current Master Ryuge Kisaki as a spiritual pillar and achieving social cohesion and community-centered integration will be the core task."
 SHA_conservative_economy_reform: "Conservative Revolution: Economic Sector"
 SHA_conservative_economy_reform_desc: "A completely free market economy is a structure that eventually cannot avoid collapse, and the academy's control over key industries is essential. Especially for strategically important fields like the defense industry, we will further strengthen the academy's control. Giant state-owned enterprises will go beyond simple economic entities and be utilized as a core means to execute government policy and exercise diplomatic influence. To these enterprises, close associates of the Genryumon will be dispatched to be in charge of internal monitoring and control.\n\nShanhaijing has put effort into economic self-sufficiency and fostering import-substitution industries under the isolationist stance, and now it has achieved results to the extent that most materials can be produced internally within the academy. We will move forward with the goal of building a robust self-reliant economy that is not shaken by external pressure or an unstable international environment."
 SHA_conservative_policy_reform: "Conservative Revolution: Political Sector"
 SHA_conservative_policy_reform_desc: "‘Verticality of Power’ is a theory whose core is building an orderly command system in all organizations with the Master at the pinnacle. Especially, it focuses on strengthening control over local areas by dispatching figures directly appointed by the Master to various places. At the same time, regarding forces with anti-government tendencies, we will persistently track their funding sources to make fundraising difficult and focus on weakening their activities and gradually disintegrating the organization itself through this."

 SHA_conservative_army_reform: "Inspire Shanhaijing Pride"
 SHA_conservative_army_reform_desc: "Many people do not properly recognize how great an academy Shanhaijing is. Shanhaijing boasts a long history and tradition, and numerous people are living in a happy community under its protection. However, if these facts are not widely known, it could become a threat to the community's cohesion. Accordingly, we plan to produce and distribute various propaganda materials to inspire pride in Shanhaijing and strengthen the community's sense of unity."
 SHA_conservative_xuanwu_merchant_association: "'Conservative' Black Tortoise Promenade"
 SHA_conservative_xuanwu_merchant_association_desc: "Akeshiro Rumi is a person with high recognition within Shanhaijing that absolutely cannot be ignored. Simply imprisoning such a person can rather lead to a decrease in government support. Therefore, the Genryumon will dispatch 'conservative'-leaning personnel to the Black Tortoise Promenade to take charge of internal monitoring and control, and effectively manage Rumi's influence."
 SHA_conservative_rule_of_law: "Expand Strict Punishment"
 SHA_conservative_rule_of_law_desc: "The most important value in a community is 'stability'. We can never show mercy to criminals who threaten this. Even if the method may appear somewhat strict and harsh, to protect the community's order, we must hand down decisive punishment to criminals and provide practical relief to victims. Punitive punishment is inevitable for a stable society."
 SHA_conservative_purge_of_decadent_culture: "Eradicate Decadent Culture"
 SHA_conservative_purge_of_decadent_culture_desc: "Modern art and the art of Earth are like poison eating away Shanhaijing. Such decadent and luxurious culture is not helping Shanhaijing's development at all. All decadent artworks must be destroyed and Shanhaijing's unique culture must be revived. Many intellectuals and artists should be forced to contribute to society by holding hammers instead of pens."

 SHA_conservative_clash_of_civilizations: "Continue Holy War"
 SHA_conservative_clash_of_civilizations_desc: "Time is tight, and enemies are not easily collapsing. Now we must mobilize Shanhaijing's students more broadly, break through the enemy's defense line, and deliver a decisive blow to its heart. This decision will not receive everyone's support, but the conviction to liberate Kivotos from plague and chaos under the value of the grand Conservative Revolution must take precedence over anything else."

 SHA_conservative_revolution_ns: "Shanhaijing Conservative Revolution"
 SHA_conservative_revolution_ns_change: "§Y$SHA_conservative_revolution_ns$§! Modifier"
 SHA_conservative_revolution_modifier: "$SHA_conservative_revolution_ns$"

 # 인물
 SHA_KISAKI: "Ryuge Kisaki"
 SHA_kisaki_leader_desc: "Coolness, responsibility, tenderness. There are numerous words to describe Ryuge Kisaki, called the 'Black Monarch' of Shanhaijing. Looking back at her governing style, such evaluation is only too natural. For her, who leads a giant group called the Genryumon, leadership is a field already conquered a long time ago. Kisaki, who was rigid from childhood, realized the need for reform while witnessing the misrule of the former Master. Eventually, she broke tradition, ousted the former Master, and rose to the position of Master herself.\n\nBut this process demanded a price. Shadows of legitimacy controversy and political instability constantly followed Ryuge Kisaki. The succession of power against tradition became a pretext for some to doubt her legitimacy, and this was the biggest obstacle she had to overcome.\n\nHowever, Kisaki proved it with action. The charisma, responsibility, leadership, and sincere tenderness toward the members shown in her early inauguration quieted the doubts within the Genryumon. It became clear that she possessed sufficient qualifications as Master, and she blew courage and confidence back into the Genryumon, which had been shrunken under the shadow of the former Master. Now, Kisaki, with rich political experience and firm support of the Genryumon behind her, is proudly moving forward as Shanhaijing's 'Black Monarch'."
