 SHA_senzu_bean_experiment: "Proceed with Experiment"
 SHA_senzu_bean_experiment_desc: "To become a Sage, we will start experiments."
 SHA_senzu_bean_unethical_experiment: "Implement Unethical Experiments"
 SHA_senzu_bean_unethical_experiment_desc: "To approach the goal, we must become cold-hearted. Even if the experimental method is unethical and gives discomfort to those watching, if it is a path that can get closer to the goal, we must endure and push it forward."
 SHA_senzu_bean_budget_increase: "Cover Costs"
 SHA_senzu_bean_budget_increase_desc: "The preparation of herbs to become a Sage incurs enormous costs, which are at a level difficult for an individual to afford. Therefore, we plan to name this 'National Research' and use the national budget to cover necessary funds."
 SHA_senzu_bean_herbalism: "Herb Collection"
 SHA_senzu_bean_herbalism_desc: "To become a Sage, it is essential to collect herbs known to be good for the body. Especially, it is told that rare plants that only grow deep in the mountains must be gathered. In this regard, the terrain of Austria, rich in mountain areas, can be said to be an environment very suitable for herb collection."
 SHA_senzu_bean_clinical_trials: "Clinical Trials"
 SHA_senzu_bean_clinical_trials_desc: "We plan to proceed with medicinal experiments to become a Sage targeting some naive individuals. By administering the medicine to them and observing the reaction and progress that appear, we will be able to get a step closer to the goal."

 shakai.1.t: "Path to Becoming a Sage"
 shakai.1.d: "'Sage' means a unique goal pursued by Shintani Kai and the existence of 'immortality' passed down from ancient times. It is said that dozens of ways to become a Sage exist, but it is uncertain whether any of them actually work. Even nonsensical methods like edible mercury have been taken for granted under the name of tradition.\n\nThen, Shintani Kai realized the true way to become a Sage. A memory that flashed in her brain became a clear goal, and she started a journey to chase that memory. However, before Shintani Kai could reach that goal, the previous Master stepped forward to hinder this, and in that process, brought a disaster to the whole of Shanhaijing.\n\nEventually, the previous Master fell from power and Ryuge Kisaki was inaugurated as the new Master, and the situation settled for a while, and Shintani Kai had to be expelled. But along with the incident called the 'Great Migration', the Peking Opera Department allied with radicals drove out Ryuge Kisaki, and after ousting even Urushibara who was a naive conservative, Shintani Kai emerges as the practical ruler of Shanhaijing.\n\nNow Shintani Kai officially starts the great journey to become a ‘Sage’, her long-cherished wish. No matter how long and rugged that path may be, if she only looks at the goal and moves forward, she will surely reach the end someday."
 shakai.1.a: "A long and rugged path"

 shakai.2.t: "Clue Captured"
 shakai.2.d: "An amazing result appeared before us. While continuing experiments to become a 'Sage', we found a clue. It will be of great help in making the medicine. "
 shakai.2.a: "Just a little more."


