 SHA_Kirchenbeitragsgesetz: "Church Contribution Law"
 SHA_Kirchenbeitragsgesetz_desc: "The 'Kirchenbeitragsgesetz' is a legal system in Austria that allows recognized religious organizations to receive a certain amount of contributions from their followers. This contribution is not a tax, but an obligation based on voluntary membership. Collection is carried out by the religious organizations themselves, and the state provides the legal basis. We will use this to realize the principles of secularism by taxing them instead of letting the church manage its finances independently."
