#Chale Event#
 SHE_yeonhabhyeonsilhwa_tt: "Unlocks the £decision_icon_small §YDecision§! to invite nations belonging to §YKivotos§! into our §YFaction§!."
 SHE_puppet_flag:0 "§RControlled District§!"
 kivotos_hardline_tt:0 "§YWe§! will choose §RHardline Measures§!."
 kivotos_appeasement_tt:0 "§YWe§! will choose §GAppeasement Measures§!."
 kivotos_hardline:0 "§CArona§! has chosen §RHardline Measures§!."
 kivotos_appeasement:0 "§CArona§! has chosen §GAppeasement Measures§!."
 SHE_event.1.t:0 "Determination"
 SHE_event.1.desc:0 "Due to the anomalous situation in Kivotos, all communications have been severed, and the academies have each established independent factions. In short, Kivotos has been torn into pieces. Operating under the President of the General Student Council's orders, the Schale AI `Arona` is reviewing various plans to carry out the President's final command: the stabilization of Kivotos."
 SHE_event.1.a:0 "What has already happened cannot be undone."
 SHE_event.1.b:0 "I do not want a broken Kivotos."
 SHE_event.2.t:0 "7th Executive Committee Meeting - Emergency Agenda"
 SHE_event.2.desc:0 "\"...Is that true, Administrator?\" Nanagami Rin reviewed the General Student Council's new report with a visibly perplexed expression. To summarize the report: \"I am the main AI 'Arona,' activated by the order of the GSC President. With the President now missing, I am the legitimate successor to the President's authority. I demand the unilateral merger of the General Student Council into Schale and the reorganization of the Executive Committee.\" In truth, Schale's existence had been a secret kept by the President since the Great Transition, so Acting President Rin only had a vague awareness of it. But to request a merger so boldly? And by an AI, of all things? While Kivotos's AIs are known for their high performance, the AI named Arona didn't seem particularly exceptional.\n\nHowever, as it is standard procedure to convene an emergency meeting to review such reports, Rin called for an emergency session in accordance with protocol. While the Administrator summoned the department heads and prepared the briefing room, Rin considered the possibility that even if Arona's claim held some truth, it might be a 'simple AI malfunction.' Upon a quick investigation of the documents, Rin discovered that Arona had been receiving inconsistent power supplies, and reports regarding potential AI malfunctions had been submitted to the GSC President. Strangely, it appeared the President had ignored the reports without even signing off on them, making it difficult for Rin to grasp exactly what was happening. But what if this wasn't a malfunction, but truly the President's will? Rin felt a tightening in her chest, as if the President herself were constricting her throat. Soon, summoned by the Administrator's voice, Rin hurried toward the conference room.\n\nRin stepped out from behind the doors and cleared her throat at the podium. She had to speak carefully. She knew all too well that she was no \"superhuman.\" She had to be precise. Rin took a breath and opened her mouth. \"I apologize if this sudden emergency meeting has startled you. First, the reason for this meeting is...\""
#SHE_event.2.desc_bad:0 "While the General Student Council was embroiled in the chaos of power struggles following the severance of communication between academies and the sudden disappearance of the GSC President, Schale's main AI, Arona—activated by the former President's orders—demanded that we merge with Schale.\n\nRin and Kaya requested to resist and disobey the order, but the GSC officials, exhausted by the long power struggle, had already given up on maintaining an independent General Student Council."
 SHE_event.2.a:0 "\"...It is for the sake of the GSC President's will.\""
 SHE_event.2.b:0 "\"...It is regarding the matter of the AI malfunction.\""
 has_trait_COU_power_struggle:0 "§RSince we failed to complete the Administration Normalization focus within the time limit, actions against Schale will be severely restricted.§!"
 SHE_event_2_c_tt:0 "§RBecause we did not complete the Administration Normalization focus in time, the merger has become unavoidable.§!"
 SHE_event.3.t:0 "The General Student Council's Acceptance"
 SHE_event.3.desc:0 "The General Student Council acknowledged their internal chaos and voted in favor of merging into Schale."
 SHE_event.3.a:0 "Good."
 SHE_event.4.t:0 "The General Student Council's Refusal"
 SHE_event.4.desc:0 "The General Student Council has refused to merge with Schale, clearly stating their intent to defend their sovereignty. This may cause significant disruptions to Schale's future plans."
 SHE_event.4.a:0 "Then, it is war."
 SHE_event.5.t:0 "Schale's Proposal to Join the Federation"
 SHE_event.5.desc:0 "This morning, a proposal arrived from Schale suggesting we join the Kivotos Federation. They proposed our accession under the pretext that academies with similar socialist ideologies must unite to complete the revolution for the global proletariat."
 SHE_event.5.a:0 "A sound idea."
 SHE_event.5.b:0 "Send them back."
 SHE_event.6.t:0 "[FROM.GetName]'s Acceptance"
 SHE_event.6.desc:0 "[FROM.GetName] has agreed with our cause and accepted the invitation to join the Federation."
 SHE_event.6.a:0 "Welcome to the Federation, Comrade."
 SHE_event.7.t:0 "[FROM.GetName]'s Refusal"
 SHE_event.7.desc:0 "[FROM.GetName] has rejected the proposal to join the Federation. They shall walk a different path than ours."
 SHE_event.7.a:0 "I expected as much from these reactionaries."
 SHE_event.8.t:0 "[SHE.GetName]'s Annexation Attempt"
 SHE_event.8.desc:0 "Intelligence has just been gathered indicating that [SHE.GetName] is working to bring our academy back under their direct jurisdiction. We must decide whether to express our opposition and obstruct [SHE.GetName]'s plans, or to submit and join [SHE.GetName]."
 SHE_event.8.a:0 "We do not yield easily."
 SHE_event.8.b:0 "This must be the GSC President's will."
 SHE_event.9.t:0 "[KSP.GetName]'s Resistance"
 SHE_event.9.desc:0 "After our plans were leaked to their intelligence, [KSP.GetName] expressed open hostility toward our academy. It has become clear that our plans have completely collapsed. They have severed the communication networks linked to the Sanctum Tower and cut ties with us. War is imminent."
 SHE_event.9.a:0 "Things have gone awry."
 SHE_event.10.t:0 "Ultimatum from [SHE.GetName]"
 SHE_event.10.desc:0 "An ultimatum has just arrived from [SHE.GetName] demanding our submission. We must choose whether to prepare for war against [SHE.GetName] or accept their demands and submit."
 SHE_event.10.a:0 "Prepare for war."
 SHE_event.10.b:0 "For a unified Kivotos once more."
 SHE_event.11.t:0 "[FROM.GetName]'s Resistance"
 SHE_event.11.desc:0 "In response to the ultimatum, [FROM.GetName] has expressed their absolute refusal to submit and has begun deploying troops along our borders. We must prepare for a war for a unified Kivotos."
 SHE_event.11.a:0 "Advance."
 SHE_event.12.t:0 "[FROM.GetName]'s Submission"
 SHE_event.12.desc:0 "Regarding the ultimatum, [FROM.GetName] has informed us through diplomatic channels that they have no intention of being hostile. Through meetings with [FROM.GetName], we have secured various rights, including military transit and the authority to intervene in national administration."
 SHE_event.12.a:0 "They shall be safe."
 SHE_event.13.t:0 "Ultimatum from [SHE.GetName]"
 SHE_event.13.desc:0 "A proposal has arrived from [SHE.GetName] stating that if our academy cooperates in the unification of Kivotos, free research will be guaranteed even after unification. We must decide whether to accept this proposal and recognize [SHE.GetName]'s control, or reject it and prepare for war."
 SHE_event.13.a:0 "Prepare for war."
 SHE_event.13.b:0 "As long as we can research, it's fine, right?"
 SHE_event.14.t:0 "[FROM.GetName]'s Hostility"
 SHE_event.14.desc:0 "In response to the ultimatum, [FROM.GetName] has expressed their absolute refusal to submit and has begun deploying troops along our borders. We must prepare for a war for a unified Kivotos."
 SHE_event.14.a:0 "Things have gone wrong."
 SHE_event.15.t:0 "[FROM.GetName]'s Cooperation"
 SHE_event.15.desc:0 "Regarding the ultimatum, [FROM.GetName] has informed us through diplomatic channels that they have no intention of being hostile. Through meetings with [FROM.GetName], we have informed them of their role and responsibilities in the future unification process of Kivotos, and our cooperation will continue even after unification."
 SHE_event.15.a:0 "They shall be safe."
 SHE_event.16.t:0 "Coup in [FROM.GetName]"
 SHE_event.16.desc:0 "A major controversy has erupted in [FROM.GetName] as Kaya, the head of the Defense Office of the General Student Council, has launched a coup. We must choose whether to leave their faction or remain."
 SHE_event.16.a:0 "Welcome, new GSC President."
 SHE_event.16.b:0 "We seek a new path."
 SHE_event.17.t:0 "[FROM.GetName]'s Withdrawal"
 SHE_event.17.desc:0 "[FROM.GetName] has left our faction, citing the recent coup we carried out as the reason."
 SHE_event.17.a:0 "We are better off without them."
 SHE_event.18.t:0 "[FROM.GetName] Joins the Kivotos Federation"
 SHE_event.18.desc:0 "As our overlord [FROM.GetName] has joined the Kivotos Federation, control over us has also been transferred to the Kivotos Federation. We must now consider our next move in this situation."
 SHE_event.18.a:0 "Is there a problem?."
 SHE_event.18.b:0 "Is this an opportunity for independence?"
 SHE_event.18.RED:0 "We are the New Red Winter now!"
