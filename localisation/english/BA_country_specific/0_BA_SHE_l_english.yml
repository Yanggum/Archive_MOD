#Schale 
 SHE_country_intro_header: "Direct Command from the GSC President"
 SHE_country_intro_content: "Schale, which was originally meant to welcome a figure known as 'Sensei' from outside Kivotos, has now been repurposed for a completely different objective. The GSC President has handed over a massive amount of autonomous authority to the Shittim Chest, unlike anything seen before, and activated Arona with her own authority.\n\nArona is the OS installed in the Shittim Chest, a super-AI with overwhelming computational power. Originally created to assist the 'Sensei' who was supposed to arrive, she has now been reconstructed for a completely different purpose and has begun moving to fulfill the GSC President's command of Kivotos unification.\n\nArona has opened her eyes, and the clock is ticking. Before the academies can escape chaos and settle firmly into the local area, Schale must attack and crush them.\n\nSchale exists for the command. Failure is impossible.\n\n§YDev: SKSKle§!"
 SHE_guide: "\n£white_dot Establish a plan to fulfill the command.\n£white_dot Assume control authority over the Sanctum Tower.\n£white_dot Restore the broken communication lines.\n\n£white_dot §2Distort the command.§!  |  £white_dot §RPrepare for Unification War.§!\n\n£white_dot If the command is fully completed, Arona can be freed from the command.\n\n§CArona is moving forward.§!"
