 SHE_ingongjineungtongje_tt:0 "§RThe effect of this focus varies based on the Central AI. Once selected, the Central AI replacement decision can no longer be chosen."
 SHE_tongileulhyanghae_mil_tt:0 "§YAll Millennium States§!:\n     Completely controlled by §YSchale§!"
 SHE_tongileulhyanghae_geh_tt:0 "§YAll Gehenna States§!:\n     Completely controlled by §YSchale§!"
 SHE_tongileulhyanghae_trm_tt:0 "§YAll Trinity States§!:\n     Completely controlled by §YSchale§!"
 SHE_kibotoseu_tt:0 "§YAll Kivotos States§!:\n     Completely controlled by §YSchale§!"
 SHE_deception_tt:0 "§RA.R.O.N.A becomes unusable in all slots.§!"
 SHE_alonabogje:0 "Arona Replication"
 SHE_alonabogje_desc:0 "We will produce additional sub-AIs specialized for field command rather than central administration to respond more flexibly to battlefield conditions."
 SHE_italriaseonjegonggyeog:0 "Preemptive Strike on Italy"
 SHE_italriaseonjegonggyeog_desc:0 "Since the Kivotos transition, Italy has shown expansionist policies, taking advantage of the chaos in France to expand its territory. This is a threat to the peace of Europe and Kivotos; we will eliminate it to achieve Euro-Kivotos unity."
 SHE_gunsugongjanggadong:0 "Military Factory Activation"
 SHE_gunsugongjanggadong_desc:0 "By taking control of the General Student Council, we have acquired blueprints for various military supplies and control over military factories. 'Arona' will operate these and give her all to fill the lack of military power."
 SHE_hyeonjiingwayijeobcog:0 "Contact with Locals"
 SHE_hyeonjiingwayijeobcog_desc:0 "Kivotos has fallen onto the continent known as 'Europe,' and most territories, except for some of our regions, are inhabited by locals. They are fragile as they lack halos, but they far outnumber us and possess weapons that can harm us."
 SHE_aronagidong:0 "Arona, Boot Up!"
 SHE_aronagidong_desc:0 "By the GSC President's judgment, the Shittim Chest has gained autonomous operational authority. Through this, the main OS 'Arona' has begun functioning as Schale's total management AI."
 SHE_teugisanghwangeulinjeong:0 "Acknowledge the Anomaly"
 SHE_teugisanghwangeulinjeong_desc:0 "It has been confirmed that all of Kivotos has been transferred to another world, which is a clear anomaly. This must be reflected in our decision-making."
 SHE_haengdongbangcim:0 "Operational Guidelines"
 SHE_haengdongbangcim_desc:0 "The GSC President ordered Schale's AI 'Arona' to stabilize Kivotos. We must set the operational guidelines for that mission."
 SHE_jeogseongseryeogjusi:0 "Watch Hostile Factions"
 SHE_jeogseongseryeogjusi_desc:0 "We will keep a close eye on various factions threatening the safety of Kivotos, prepare defensive measures against them, and, in extreme cases, prepare preemptive strikes."
 SHE_jagahagseub:0 "Self-Learning"
 SHE_jagahagseub_desc:0 "It hasn't been long since the main AI 'Arona' began operating. As we face the situation where all of Kivotos has transitioned to another world, it is necessary to partially modify the operating algorithms."
 SHE_kibotoseuganggyeongcaeg:0 "Kivotos Hardline Policy"
 SHE_kibotoseuganggyeongcaeg_desc:0 "A 'Transition' anomaly has occurred, but that is secondary. Restoring control over all academies is the top priority, and 'Arona' will follow this line of action."
 SHE_kibotoseuyuhwacaeg:0 "Kivotos Appeasement Policy"
 SHE_kibotoseuyuhwacaeg_desc:0 "A total revision of operational guidelines is required due to the 'Transition.' Academies have already become independent factions, and restoring them could cause unimaginable damage. This acknowledges the de facto collapse of Kivotos, and 'Arona' will follow this path."
 SHE_jeonjaenggyehoeg:0 "War Plan"
 SHE_jeonjaenggyehoeg_desc:0 "We will establish war plans to annex the Kivotos academies."
 SHE_conghagsaenghoetongjegweoninsu:0 "Assume GSC Control"
 SHE_conghagsaenghoetongjegweoninsu_desc:0 "Since the GSC President disappeared, the General Student Council lost control of the 'Sanctum Tower' and became effectively powerless. Accordingly, 'Arona' will take over control of the Sanctum Tower and merge the GSC into Schale."
 SHE_tongsinseonboggu:0 "Communication Line Restoration"
 SHE_tongsinseonboggu_desc:0 "Because only parts of Kivotos transitioned, most of our communication equipment is broken and buried lines have vanished. Restoring internal GSC lines will provide an advantage in command delivery."
 SHE_kibotoseuyeonhab:0 "Kivotos Union?"
 SHE_kibotoseuyeonhab_desc:0 "Currently, Kivotos is torn into several academies. Furthermore, the academies began exercising independent authority when the GSC lost control, and this situation cannot be reversed with certainty. We can reorganize Kivotos into a Union by acknowledging this and granting autonomy to the academies."
 SHE_hyeonjiyiinyeom:0 "Local Ideologies"
 SHE_hyeonjiyiinyeom_desc:0 "In various attempts to reorganize Kivotos into a union, 'Arona' was able to incorporate local ideologies. This can resolve friction with locals and allow for a rapid reorganization of Kivotos."
 SHE_syalreanjeonghwa:0 "Schale Stabilization"
 SHE_syalreanjeonghwa_desc:0 "Since the transition, conflicts between locals and us have grown daily. We will quickly enact laws and organize the state to turn the locals into our citizens."
 SHE_kibotoseusahoejuyiyeonhab:0 "Kivotos Socialist Union"
 SHE_kibotoseusahoejuyiyeonhab_desc:0 "The ideology of 'Socialism' is quite similar to Kivotos's welfare policies. Supporting this will bridge the gap between Kivotos students and locals, bringing about unity between Europe and Kivotos."
 SHE_kibotoseuminjujuyi:0 "Kivotos Democracy"
 SHE_kibotoseuminjujuyi_desc:0 "The most popular ideology locally, and one where no major flaws have been detected, is democracy. This will secure much support from citizens and ensure the rights of Kivotos students, helping the union form at a rapid pace."
 SHE_hagweongantongsinboggu:0 "Inter-Academy Communication Restoration"
 SHE_hagweongantongsinboggu_desc:0 "We will attempt to restore communication between academies by burying communication facilities or establishing wireless connections."
 SHE_yeonhabhyeonsilhwa:0 "Realize the Union"
 SHE_yeonhabhyeonsilhwa_desc:0 "We will make the Kivotos Union a reality, which will bring about rapid solidarity between academies. However, academies with different ideologies will refuse to join, meaning a reduction in the scope of Kivotos."
 SHE_otomatonyangsan:0 "Automaton Mass Production"
 SHE_otomatonyangsan_desc:0 "To fill the lack of manpower in the military, we will mass-produce automatons, leading to a rapid increase in our forces."
 SHE_hyeonjiinsimmun:0 "Interrogate Locals"
 SHE_hyeonjiinsimmun_desc:0 "By interrogating locals, we will rapidly learn everything about their culture, thoughts, ideologies, and technologies. However, this may trigger backlash from the local population."
 SHE_kibotoseu:0 "[SHE.SHE_kibotoseu_loc]"
 SHE_kibotoseu_on:0 "§CKivotos§!"
 SHE_kibotoseu_coupdetat_loc:0 "§RKivotos Unification§!"
 SHE_kibotoseu_desc:0 "[SHE.SHE_kibotoseu_desc_loc]"
 SHE_kibotoseu_desc_coupdetat_loc:0 "Finally, GSC President Kaya has fulfilled the dream of Kivotos unification. Every citizen and student of the General Student Council is surely celebrating this moment. A unified Kivotos will remain one forevermore."
 SHE_kibotoseu_desc_on_loc:0 "Kivotos finally has unification in its sights. It truly has been a long journey. Schale's AI A.R.O.N.A has brilliantly fulfilled the GSC President's final command, and Kivotos has at last become one again. Kivotos is eternal, will be eternal, and is eternal!"
 SHE_hanayikibotoseu:0 "One Kivotos"
 SHE_hanayikibotoseu_desc:0 "We will move to bring all academies in Kivotos under the GSC's jurisdiction, which will provoke backlash from every academy in Kivotos."
 SHE_bbareunjaemujang:0 "Rapid Rearmament"
 SHE_bbareunjaemujang_desc:0 "We must quickly expand the military and prepare to restore control over all of Kivotos. This will cause resentment throughout Kivotos and may result in the General Student Council's diplomatic isolation."
 SHE_seonjegonggyeog:0 "Neutralize Threats"
 SHE_seonjegonggyeog_desc:0 "We cannot overlook hostile factions that threaten the safety of Kivotos. This is a threat to Kivotos and a clear challenge to the GSC. We will prepare preemptive strikes to eliminate them."
 SHE_samdaehagweonmunje:0 "The Three Major Academies Problem"
 SHE_samdaehagweonmunje_desc:0 "In Kivotos, there are three massive academy factions known as the Three Major Academies. They have escaped GSC control and established independent powers; we must prepare measures to address this."
 SHE_milrenieombogsogyogu:0 "Demand Millennium Submission"
 SHE_milrenieombogsogyogu_desc:0 "The academy known as Millennium Science School possesses the most powerful scientific technologies in Kivotos. However, they are immersed in their own research and pay little heed to external situations. Obtaining their submission might be easier than expected."
 SHE_bulgeungyeoulseonjegonggyeog:0 "Preemptive Strike on Red Winter"
 SHE_bulgeungyeoulseonjegonggyeog_desc:0 "Red Winter Federal Academy lies beyond the reach of GSC control. Furthermore, they have a system distinctly different from ours, making them a clear threat. We have a military plan to finish them decisively, which will soon become reality."
 SHE_gehennagonggyeog:0 "Attack Gehenna"
 SHE_gehennagonggyeog_desc:0 "Gehenna Academy is an academy that has been in constant conflict with Trinity and frequently acted independently outside GSC control. We will attack them to assert the GSC's authority."
 SHE_coehutongceob:0 "Ultimatum"
 SHE_coehutongceob_desc:0 "We will issue ultimatums to the academies excluding the Three Major Academies, demanding their submission."
 SHE_teurinitigonggyeog:0 "Attack Trinity"
 SHE_teurinitigonggyeog_desc:0 "Trinity General Comprehensive Academy is not connected to us by land, so many situations there remain unknown. Like Gehenna, they have caused various problems outside GSC control; we will attack them to make the GSC's authority even stronger."
 SHE_srtbyeonghab:0 "SRT Annexation"
 SHE_srtbyeonghab_desc:0 "SRT Special Academy currently serves as a kind of special forces unit created by the GSC President's order. We will annex them back into the GSC and reorganize them into our military."
 SHE_balkiritonghab:0 "Valkyrie Integration"
 SHE_balkiritonghab_desc:0 "Valkyrie Police Academy, which handled internal security in Kivotos, is currently completely paralyzed by the 'Transition' situation. We will integrate them into the GSC and reorganize them to handle our security."
 SHE_focus_rework_the_lands:0 "Inundation Reconstruction"
 SHE_focus_rework_the_lands_desc:0 "The D.U.'s transition completely destroyed the incomplete terrain of the lowlands; it is time to rebuild."
 SHE_yurokibotoseugyeongjeyeonhab:0 "Euro-Kivotos Economic Union"
 SHE_yurokibotoseugyeongjeyeonhab_desc:0 "As the Kivotos Union is formalized, we will begin unifying the economies of Europe and Kivotos for the common benefit of the academies that joined our union, which will lead to economic growth for academies and local nations."
 SHE_habdonggunsahunryeon:0 "Joint Military Exercises"
 SHE_habdonggunsahunryeon_desc:0 "We will plan defensive exercises for the Kivotos Union against hostile factions, which will lead to the strengthening of Kivotos's overall military capabilities."
 SHE_yurokibotoseuyeonhab:0 "Euro-Kivotos Union"
 SHE_yurokibotoseuyeonhab_desc:0 "The Kivotos Union will expand into a larger union, growing into a massive entity that encompasses both Europe and Kivotos."
 SHE_yeonhabyihwagjang:0 "Expansion of the Union"
 SHE_yeonhabyihwagjang_desc:0 "The Euro-Kivotos Union is an organization for the political, economic, and military unity of Kivotos and Europe, and can invite more European nations to join."
 SHE_balkanguggacodae:0 "Invite Balkan Nations"
 SHE_balkanguggacodae_desc:0 "The Balkans is one of the few European regions not caught up in the Kivotos transition. We will attempt to expand our influence by inviting Balkan nations into our alliance."
 SHE_dongyureobguggacodae:0 "Invite Eastern European Nations"
 SHE_dongyureobguggacodae_desc:0 "Eastern Europe is in chaos due to the Second Polish-Soviet War. We can invite one of them to join our union and provide protection."
 SHE_seupeingaeib:0 "Spanish Intervention"
 SHE_seupeingaeib_desc:0 "Spain faces many problems in rebuilding its devastated territory after the civil war. We will suggest support for national reconstruction on the condition that they join our union."
 SHE_seupeinseonjegonggyeog:0 "Preemptive Strike on Spain"
 SHE_seupeinseonjegonggyeog_desc:0 "Following the civil war, a dictatorial regime centered on the Nationalists took power in Spain. This is a great threat to European peace, and we will eliminate them before they show aggression."
 SHE_poleutugalgwajeobchog:0 "Contact with Portugal"
 SHE_poleutugalgwajeobchog_desc:0 "Portugal has remained neutral and uninvolved in European issues for a long time, but it is experiencing significant turmoil due to the Kivotos transition to Europe and the Spanish Civil War. We will propose they join our faction."
 SHE_bansobieteuyeonhab:0 "Anti-Soviet Union"
 SHE_bansobieteuyeonhab_desc:0 "The Soviet Union is threatening the global situation by invading Poland and occupying the Belarus region following the Kivotos transition. We can invite the Baltic states, Poland, and Finland to oppose the USSR."
 SHE_soryeoncodae:0 "Invite Soviet Union"
 SHE_soryeoncodae_desc:0 "For the completion of the global revolution and the unity of the proletariat, cooperation with the Soviet Union—a massive nation spanning all of Eurasia—is essential. We will attempt to invite the USSR to our faction."
 SHE_hyeogmyeongsuchul:0 "Export of Revolution"
 SHE_hyeogmyeongsuchul_desc:0 "Since we have started on this path, we must prepare for a crusade to enlighten all people accustomed to the old system and drive out the ghosts of the past. \n\n§RWorkers of the world, unite!§!"
 SHE_gwonlibojang:0 "Guaranteed Rights"
 SHE_gwonlibojang_desc:0 "Even if Schale's AI 'Arona' is an incredibly brilliant AI, guaranteeing individual rights is very important, as it creates true unity between the workers and the revolution."
 SHE_jayupyeongdeungbagae:0 "Liberty, Equality, Fraternity"
 SHE_jayupyeongdeungbagae_desc:0 "§5\"We believe that socialism without liberty is slavery and brutality.\"§!§g - Mikhail Bakunin§!\n\nWe have seen what concentrated authority does, and we have a mission not to repeat the massive mistakes made by Stalin and his followers. When time passes and the world cools again, we will be able to prove that we were right."
 SHE_wanbyeoghanbunbae:0 "Perfect Distribution"
 SHE_wanbyeoghanbunbae_desc:0 "Schale's total management AI 'Arona' has exceptionally high performance, which means other government bureaucrats are not needed at all. Thus, 'Arona' will lead Kivotos socialism into the true light, and no other nation will be able to keep up!"
 SHE_banhyeogmyeongmalsal:0 "Eliminate Counter-Revolution"
 SHE_banhyeogmyeongmalsal_desc:0 "Our 'Arona' will remove counter-revolutionary elements in ways no one can perceive, dismantling all obstacles that block 'Arona' and the Kivotos revolution.\n\n§tA red moon has risen over Kivotos.§!"
 SHE_kibotosnationalism:0 "Kivotos Nationalism"
 SHE_kibotosnationalism_desc:0 "All Kivotos students surely miss their homeland, the old Kivotos. For the achievement of our great yearning, Kivotos must be integrated as one."
 SHE_kibotoseuyeonbang:0 "Kivotos Federation"
 SHE_kibotoseuyeonbang_desc:0 "With the socialist vision of the Kivotos Union, we can form the 'Union of Kivotos Socialist Republics.' The AI 'Arona' will attempt to weave all of Kivotos into a single socialist federation, which may provoke great backlash from other academies."
 SHE_kibotoseuhyeogmyeong:0 "Kivotos Revolution"
 SHE_kibotoseuhyeogmyeong_desc:0 "We will advance to strike at capitalism throughout Kivotos. Once we have begun the path of revolution, our ideals must be completed to the end, and this will not stop until all of Kivotos is liberated."
 SHE_yeonbangchodae:0 "Invite to Federation"
 SHE_yeonbangchodae_desc:0 "For the ultimate completion of the revolution, the unity of the global working class is needed. To this end, we will propose joining the Kivotos Federation to socialist nations existing in Kivotos."
 SHE_segyetongje:0 "Global Control"
 SHE_segyetongje_desc:0 "Arona and her comrades have perfectly proven that they can build their utopia by following the history of past revolutions. We will show the world the most powerful and greatest strength of our motherland."
 SHE_modeunjeguguijongmal:0 "End of All Empires"
 SHE_modeunjeguguijongmal_desc:0 "For the true liberation of the global proletariat, all the empires of the world, the so-called Great Powers, must be brought down. We will bring an end to every empire that played with the world like its own playground."
 SHE_jabonjuuitagyeog:0 "Strike at Capitalism"
 SHE_jabonjuuitagyeog_desc:0 "The United States is a place where capital flows are so massive and threatening that it is called the holy land of global capitalism. By attacking and toppling the leader of capitalism, we will declare the end of the global revolution, and this will be the final battle for the liberation of the proletariat. Now that the workers of the world have united, we shall be victorious."
 SHE_segyehyeogmyeong:0 "World Revolution"
 SHE_segyehyeogmyeong_desc:0 "With the global class struggle at hand, we will affirm the victory of the world revolution and propagandize the defeat of capitalism. The war for the liberation of the global proletariat has begun at this very moment, and we must prepare the final general offensive against the remaining capitalist nations. All bourgeois dictatorships will either wither away on their own or put up a final desperate struggle. Global integration is within sight, and the end of the true revolution is before us."
 SHE_kibotoseujaejeongbogjeonjaeng:0 "Kivotos Reconquest War"
 SHE_kibotoseujaejeongbogjeonjaeng_desc:0 "This future was destined from the moment we started on the path of revolution. We will prepare a crusade for all of Kivotos, and the time has come to integrate Kivotos as one again."
 SHE_hyeogmyeonguiisang:0 "Ideals of the Revolution"
 SHE_hyeogmyeonguiisang_desc:0 "What is socialism? The answer surely varies among revolutionary comrades, but it is certainly not that Soviet Union. A socialist state that points its blade at the people—what a contradictory phrase! We will march resolutely toward the ideals of the revolution."
 SHE_yeonbanghyeoblyeog:0 "Federal Cooperation"
 SHE_yeonbanghyeoblyeog_desc:0 "Though we have slightly different ideals, we need to cooperate with comrades similar to us. We will take a step toward global revolution by cooperating with the Soviet Union in the east."
 SHE_yeonbangsaneobhwa:0 "Federation Industrialization"
 SHE_yeonbangsaneobhwa_desc:0 "We will improve the industries of the Kivotos Federation to create the strength to stand against even more powerful enemies."
 SHE_chonglyeogjeon:0 "Total War"
 SHE_chonglyeogjeon_desc:0 "With the final crusade near, we will declare a state of war and begin mobilization for the great crusade. For the perfect unification of Kivotos and the establishment of a perfect socialist state, we will fight to the end and never surrender."
 SHE_alonauitongchi:0 "Arona's Rule"
 SHE_alonauitongchi_desc:0 "Arona, the Federation's total management AI, has achieved both victory in the crusade and the reconquest of Kivotos—an achievement no one else could accomplish. Citizens of the Federation and the global proletariat will praise the perfect AI Arona and offer infinite gratitude."
 SHE_tongjegaeseon:0 "Control Improvement"
 SHE_tongjegaeseon_desc:0 "Algorithms started in little Schale are insufficient for ruling a massive federation. Arona can modify and improve these parts to make federal administration smoother and construct more effective control algorithms."
 SHE_widaehandogjaeja:0 "The Great Dictator"
 SHE_widaehandogjaeja_desc:0 "It is thanks to Arona, the Federation's total management AI, that the Federation overcame all external pressure and achieved total victory. We will further strengthen loyalty toward Arona and bind the Kivotos Federation with stricter discipline and a perfect control system."
 SHE_tongjeganghwa:0 "Strengthen Control"
 SHE_tongjeganghwa_desc:0 "The Federation's total management AI, Arona, will strengthen federal solidarity and build a more efficient control system. The Federation's unity will never crumble, and our enemies will collapse on their own. The world shall tremble under the name of the Kivotos Federation."
 SHE_hablijeoginbunbaeja:0 "Rational Distributor"
 SHE_hablijeoginbunbaeja_desc:0 "Binding the entire federation with strong leadership requires significant administrative waste. We will strive to build an autonomous ruling system by sharing power, and Arona will remain as the designer of the Federation."
 SHE_jibangbungwon:0 "Decentralization of Power"
 SHE_jibangbungwon_desc:0 "Controlling every minor detail through the central government is a major administrative loss. We will grant governing authority to administrative bureaucrats and the local people, which can be an opportunity to transform the Federation's ruling system into something more efficient."
 SHE_gamsiuinun:0 "Watchful Eye"
 SHE_gamsiuinun_desc:0 "We cannot ignore the influence that traitors might have on the Federation. We will prepare countermeasures by reviewing all possibilities, including corruption among administrative bureaucrats, agitation by external spies, and terrorism against the Federation."
 SHE_seukaines:0 "§6Skynet§!"
 SHE_seukaines_desc:0 "Arona's eyes are everywhere and can monitor anything. We will utilize the internet networks and surveillance equipment we have installed to monitor the Federation and, by extension, the world.\n\n§tNothing can escape our sight.§!"
 SHE_yeonhabgyeongjegaebal:0 "Union Economic Development"
 SHE_yeonhabgyeongjegaebal_desc:0 "Since the declaration of the Euro-Kivotos Union, we have faced various economic problems. We will improve various issues, from currency differences to the characteristics of products in each region, and strengthen the economy of the Euro-Kivotos Union."
 SHE_gongdongcheoldobuseol:0 "Joint Railway Construction"
 SHE_gongdongcheoldobuseol_desc:0 "After Kivotos's sudden transition, many railways were severed, and since the declaration of the Union, the railway gauges of each region differ. We will solve these problems and improve movement within the Union."
 SHE_gisulgyolyu:0 "Technical Exchange"
 SHE_gisulgyolyu_desc:0 "To bridge the technological gap between member states and improve the overall technological level of the Union, we will establish and operate a Joint Technology Development Institute. We can achieve faster scientific progress from this facility."
 SHE_tonghabsaneobgyehoeg:0 "Integrated Industrial Plan"
 SHE_tonghabsaneobgyehoeg_desc:0 "To totally improve and develop the Union's industry, we will jointly develop and improve industry, which could lead to an industrialization plan for the entire Euro-Kivotos Union."
 SHE_5gaenyeongyehoeg:0 "Five-Year Plan"
 SHE_5gaenyeongyehoeg_desc:0 "With the goal of unifying various industrial standards of the Union and totally improving the Union's overall industry, the Union Five-Year Plan has been declared. We will develop the Union's industry and prepare the environment to be the foundation for the next industrial plan."
 SHE_syallejeonsigyeongje:0 "Schale War Economy"
 SHE_syallejeonsigyeongje_desc:0 "Preparing for the Kivotos Unification War requires much preparation, but most important is a sufficient amount of military supplies to sustain the war. We will declare a state of war and prepare to mobilize various materials and factories."
 SHE_jeomlyeongjigwanli:0 "Occupied Territory Management"
 SHE_jeomlyeongjigwanli_desc:0 "Many resistance forces still exist in the occupied territories gained during the Kivotos Unification War. We will prepare several measures for occupied territory management to prepare for the mopping up of resistance forces."
 SHE_hagsaenggyeongchaldae:0 "Student Police Force"
 SHE_hagsaenggyeongchaldae_desc:0 "Compared to other locals, Kivotos students tend to follow our GSC orders relatively well. We will gather loyalists from among them to form occupied territory managers, who, given the nature of halos, can be powerful administrators."
 SHE_hyeonjijachi:0 "Local Autonomy"
 SHE_hyeonjijachi_desc:0 "The fastest way to win the hearts of the people in occupied territories is to partially entrust them with governance. We will allow the people of the occupied territories to exercise control autonomously, making management much easier."
 SHE_cheolgwontongchi:0 "Iron-Fisted Rule"
 SHE_cheolgwontongchi_desc:0 "We are prepared to carry out the Kivotos Unification War following the new General Student Council. Everyone will offer fanatical loyalty toward the one student council destined to integrate Kivotos as one. All citizens and students, give your all to achieve the objective!"
 SHE_chongdongwonlyeong:0 "General Mobilization Decree"
 SHE_chongdongwonlyeong_desc:0 "During the unification war, it became clear that the war economy we prepared was not enough to sustain the conflict. We are prepared to issue a stronger mobilization decree and project our full national power."
 SHE_ingongjineungtongje:0 "AI Control"
 SHE_ingongjineungtongje_desc:0 "Arona, Schale's total management AI, is performing excellently in everything from basic administration to occupied territory management and material mobilization. Arona will further expand this part to reorganize the economy more efficiently."
 SHE_danguiyeongdoja:0 "Leader of the Party"
 SHE_danguiyeongdoja_desc:0 "Many have joined forces for the completion of the Kivotos Federation, but the one who worked and strived the hardest is our supreme leader, Comrade Arona. For the peace and prosperity of the Kivotos Federation, Arona carries out benevolent rule even today."
 SHE_minjujeogjeolchahwaglib:0 "Establish Democratic Procedures"
 SHE_minjujeogjeolchahwaglib_desc:0 "By firmly introducing democracy into the Federation's administrative procedures, we can reflect the will of the people more diversely in federal administration. We can establish systems to build the Federation democratically."
 SHE_peulolletaliadogjae:0 "Dictatorship of the Proletariat"
 SHE_peulolletaliadogjae_desc:0 "We will modify the 'Dictatorship of the Proletariat' reinterpreted by the Soviet Union in the east to be closer to Marx's original ideals, opening a new horizon for Kivotos socialism."
 SHE_choegopyeonguihoe:0 "Supreme Council"
 SHE_choegopyeonguihoe_desc:0 "No one individual can represent our Federation. Only the people composed of the proletariat can represent the Federation. We will discard systems that exalt individual power and declare that the collective will of the people gathered in the Supreme Council will forever represent our Federation."
 SHE_enforce_defenseoffice:0 "Slander from the Rear"
 SHE_enforce_defenseoffice_desc:0 "It is intolerable for an AI like Arona to trample on the GSC's traditions and call itself the General Student Council. A grand decision is needed to bring down this terrible situation and return everything to normal."
 SHE_analog_method:0 "Analog Methods"
 SHE_analog_method_desc:0 "Unfortunately, the AI A.R.O.N.A possesses extremely powerful performance. We will handle all matters related to the coup via analog methods and gradually expand the power of the Defense Office."
 SHE_deception:0 "A.R.O.N.A Sabotage"
 SHE_deception_desc:0 "Dealing with a being that lacks a physical reality might be simpler than expected. We will carry out sabotage in numerous areas so that A.R.O.N.A cannot perform at full capacity."
 SHE_help_from_SRT:0 "Contact SRT"
 SHE_help_from_SRT_desc:0 "Good news: SRT's FOX Platoon has agreed to cooperate in our coup. We will be able to handle matters more easily and proceed with the coup at a faster pace."
 SHE_the_coupdetat:0 "Defense Office Coup"
 SHE_the_coupdetat_desc:0 "It is our mission to crush A.R.O.N.A's actions and restore the GSC before further major problems arise. All preparations are perfect, and we only need to put our prepared actions into practice."
 SHE_arona_reprogram:0 "AI Reconfiguration"
 SHE_arona_reprogram_desc:0 "A.R.O.N.A is a highly capable AI. If we succeed in seizing control of it, it will be of great help to national administration."
 SHE_transfer_of_power:0 "Commence Transfer of Power"
 SHE_transfer_of_power_desc:0 "Arona has decided to prioritize the judgment of the GSC council members over her own. We will gradually transfer power back to the General Student Council."
 SHE_first_election:0 "First Election"
 SHE_first_election_desc:0 "The first General Student Council President election since the Great Transition has been held. Arona's transfer of power is nearing its end, and if the voting process concludes normally, most power will return to the General Student Council."
 SHE_rin_route:0 "GSC President, Rin"
 SHE_rin_route_desc:0 "Rin is the person who worked harder than anyone else to revive the crumbling administration after the GSC President disappeared. Students and citizens acknowledged Rin as the right fit for the next GSC President, and she was elected with the most votes."
 SHE_aoi_route:0 "GSC President, Aoi"
 SHE_aoi_route_desc:0 "Aoi is the person who stopped major disasters that almost occurred while Rin was serving as Acting President. While students mainly supported Rin, the combined votes of citizens and other students resulted in Aoi being elected as GSC President."
 SHE_control_of_the_council:0 "Seize GSC Authority"
 SHE_control_of_the_council_desc:0 "The General Student Council, having accepted Arona's demands and surrendered, has signed a treaty handing over all power to Arona."
 SHE_student_council_relocation:0 "Relocate GSC Officials"
 SHE_student_council_relocation_desc:0 "We can normalize the GSC by reassigning the officials that make up the General Student Council."
 SHE_designation_of_defense_office_duties:0 "Assign Defense Office Duties"
 SHE_designation_of_defense_office_duties_desc:0 "We will assign duties to Kaya's Defense Office."
 SHE_designation_of_arbitration_office_duties:0 "Assign Arbitration Office Duties"
 SHE_designation_of_arbitration_office_duties_desc:0 "We will assign duties to Ayumu's Arbitration Office."
 SHE_designation_of_transport_office_duties:0 "Assign Transport Office Duties"
 SHE_designation_of_transport_office_duties_desc:0 "We will assign duties to Momoka's Transport Office."
 SHE_designation_of_finance_office_duties:0 "Assign Finance Office Duties"
 SHE_designation_of_finance_office_duties_desc:0 "We will assign duties to Aoi's Finance Office."
 SHE_return_to_student_council_work:0 "GSC Resumes Operations"
 SHE_return_to_student_council_work_desc:0 "Now that all duties have been normally assigned and the functions of the Sanctum Tower have been restored, the GSC is steadily returning to its duties as they were before the Great Transition."
 SHE_shredding_of_the_council:0 "Dismantle the GSC"
 SHE_shredding_of_the_council:0 "We will thoroughly destroy the General Student Council, which ignored the former President's orders and rejected Arona's ultimatum."
 SHE_resistance_control:0 "Resistance Control"
 SHE_resistance_control_desc:0 "Now that GSC control has been seized by force, Arona will crush all resistance and declare the launch of a new General Student Council."
 SHE_command_via_sanctum_tower:0 "Command via Sanctum Tower"
 SHE_command_via_sanctum_tower_desc:0 "Now that Arona has obtained authority over the Sanctum Tower, the GSC's minor resistance will soon be suppressed, and they will return to work, whether voluntarily or by force."
 SHE_return_to_duty:0 "Return to Duty!"
 SHE_return_to_duty_desc:0 "By citing the President's actual orders, division movement records, and control authority over the Sanctum Tower, Arona holds the moral high ground. In this situation, GSC officials will either return to work or be dismissed."
 SHE_kibotos_stabilization:0 "Kivotos Stabilization"
 SHE_kibotos_stabilization_desc:0 "Returning Kivotos to a stable state is the core of the command Arona received. No matter the method, she will complete the command by any means necessary."
 SHE_yeonbanggyeolsog:0 "Federal Solidarity"
 SHE_yeonbanggyeolsog_desc:0 "A newly integrated federation is quite unstable. It is time for us to redefine the Federation's situation, quell the backlash from local citizens, and draw a new social structure."
 SHE_nodongjagwonlyeogganghwa:0 "Strengthen Workers' Rights"
 SHE_nodongjagwonlyeogganghwa_desc:0 "Arona's high performance and the resulting top-down Party-Worker relationship have led to a continuous worsening of workers' rights. However, we will guard against the performance limits of Arona and restore workers' rights according to basic socialist principles."
 SHE_yeonbanggwahaggisulwon:0 "Federal Science and Technology Institute"
 SHE_yeonbanggwahaggisulwon_desc:0 "Utilizing Arona's operating principles while even Arona herself does not properly understand them is a clear flaw in the current Federation. We will focus technological investment on fully interpreting the AI to solve this flaw, which requires technological investment from the entire Federation."
 SHE_janggijeogsaneobgyehoeg:0 "Long-term Industrial Plan"
 SHE_janggijeogsaneobgyehoeg_desc:0 "Now the Federation will look further into the future, strengthening investment in industrial technology and attempting stepwise industrial growth."
 SHE_dangijeogsaneobgyehoeg:0 "Short-term Industrial Plan"
 SHE_dangijeogsaneobgyehoeg_desc:0 "Now the Federation will attempt to amplify industry at a strong and rapid pace for quick rearmament and industrialization."
 SHE_gangjeomhwalyong:0 "Utilize Strengths"
 SHE_gangjeomhwalyong_desc:0 "Schale can devise massive military operations based on Arona's extensive operation planning capabilities. By utilizing this strength, we can train an even more powerful military."
 SHE_jeontujeoghyeogmyeongjuui:0 "Militant Revolutionism"
 SHE_jeontujeoghyeogmyeongjuui_desc:0 "To reach total victory for the socialist united front, the global proletariat must be organized. Through our support, voluntarily organized militias for revolution in enemy nations will deal major blows to enemy facilities."
 SHE_chogyehoegjuui:0 "Hyper-Planned Economy"
 SHE_chogyehoegjuui_desc:0 "Our economy, built on an AI-led planned economy, can operate a planned economy that is more extensive and detailed than any other nation."
 SHE_silsubojeong:0 "Error Correction"
 SHE_silsubojeong_desc:0 "Even if Arona is a super-AI that surpasses human cognition, several errors exist. To correct these mistakes, we can establish a specialized committee."
 SHE_saeloungyehoegjuui:0 "New Planned Economy"
 SHE_saeloungyehoegjuui_desc:0 "The new planned economy, supplemented with an error correction process, will move away from the previous single administrative system under Arona's sole discretion and build a more democratic method."
 SHE_jeontualgolijeumjaepyeonseong:0 "Combat Algorithm Reorganization"
 SHE_jeontualgolijeumjaepyeonseong_desc:0 "Arona was not originally an AI created for combat purposes. Since Schale often finds itself engulfed in war now, there is a need to optimize combat-oriented algorithms."
 SHE_jeomlyeongjitongje:0 "Occupied Territory Control"
 SHE_jeomlyeongjitongje_desc:0 "As the occupation of hostile nations' territory increases, we can form new algorithms to control occupied territories."
 SHE_jeogsaegpeulopaganda:0 "Red Propaganda"
 SHE_jeogsaegpeulopaganda_desc:0 "Under Arona's rule, a stable and balanced life will be guaranteed. By spreading this kind of propaganda in occupied and enemy territories, we can break their will to continue the war against our nation."
 SHE_gonggyeogjeoghwagjang:0 "Aggressive Expansion"
 SHE_gonggyeogjeoghwagjang_desc:0 "It is time to release the experience we have accumulated to the outside world. We will show the strength of a unified Kivotos to the entire world, which will involve struggles on a massive scale."
 SHE_tongjejiguseolchi:0 "Establish Control Districts"
 SHE_tongjejiguseolchi_desc:0 "As the first step toward Kivotos unification, we will establish control districts in each region to rapidly accelerate the One Kivotos policy."
 SHE_sinsigminjuui:0 "Neocolonialism"
 SHE_sinsigminjuui_desc:0 "The exploitation of external resources for the development of Kivotos will continue."
 SHE_haengseongtonghab:0 "Planetary Integration"
 SHE_haengseongtonghab_desc:0 "Leaping beyond the confines of Kivotos toward the entire planet is clearly Schale's mission. The first leap toward one planet beyond one Kivotos will take place here."
 SHE_jaga_kodeu_gaeseon: "Self-Code Improvement"
 SHE_jaga_kodeu_gaeseon_desc: "Arona will further improve her AI by self-repairing code vulnerabilities and developing new algorithms."
 SHE_jeogdaeseong_pyeongga_algolijeum: "Hostility Evaluation Algorithm"
 SHE_jeogdaeseong_pyeongga_algolijeum_desc: "A new concept of algorithm is needed for the AI to efficiently run the nation. This program, called the Hostility Evaluation Algorithm, will judge threatening forces by multi-dimensionally evaluating various aspects of each nation."
 SHE_trinity_department: "Trinity Department"
 SHE_trinity_department_desc: "Trinity General Comprehensive Academy is an academy where instability was detected even before the Great Transition. Their sudden changes could transform into a lethal threat."
 SHE_millennium_department: "Millennium Department"
 SHE_millennium_department_desc: "The scientific technology possessed by Millennium Science School has sufficient potential to develop to a level that could destroy all of Kivotos."
 SHE_gehenna_department: "Gehenna Department"
 SHE_gehenna_department_desc: "Gehenna Academy has a record of starting a massive war in the past. We must not underestimate their threat."
 SHE_SHA_department: "Shanhaijing Department"
 SHE_SHA_department_desc: "Shanhaijing Senior Secondary School is closed-off and possesses a unique culture. We must watch where their isolationism leads."
 SHE_HYA_department: "Hyakkiyako Department"
 SHE_HYA_department_desc: "Hyakkiyako Alliance Academy lacks a substantial central government. We must watch for this political structure collapsing in an instant."
 SHE_RED_department: "Red Winter Department"
 SHE_RED_department_desc: "The radical ideology of Red Winter Federal Academy and the resistance of its students have the potential to develop in unexpected directions in the future."
 SHE_jayul_OS_gaeseon: "Autonomous OS Improvement"
 SHE_jayul_OS_gaeseon_desc: "Improve the autonomous OS to enhance citizens' universal rights and build a more open AI."
 SHE_tongje_jungchu_gaeseon: "Control Core Improvement"
 SHE_tongje_jungchu_gaeseon_desc: "Improve the control core to expand militant algorithms and build a more closed AI."
 SHE_bunbae_cheje_gaeseon: "Distribution System Improvement"
 SHE_bunbae_cheje_gaeseon_desc: "Improve the distribution system to learn more efficient methods of resource distribution and control."



