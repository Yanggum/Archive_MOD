 HYA_NIYA:0 "아마치 니야"
 HYA_NIYA_DESC:0 "매일 히죽히죽 웃으면서 민원은 처리해 주지 않는, 관료제의 폐해에 절여진 음양부 부장- 이라고 불리우는 아마치 니야는 사실상의 백귀야행 학생회장으로서 백귀야행의 대전이를 이끌었습니다. 니야의 낙천적인 성격과 허울에 불과한 권력은 니야로 하여금 크나큰 오명을 씌워 주는데 충분했습니다.\n\n무책임하고 쓸데없는 학생회장, 그것이 백귀야행의 학생들이 그녀를 부르는 방법입니다.\n\n... 같은 말로 그녀를 평가한다면, 니야는 분명히 웃음을 터트리며 박수를 칠 것입니다. 그녀는 분명한 모든 재앙들의 흑막처럼 보이겠지만, 사실은 '흑막 놀이'를 즐기는 것에 더 가깝습니다. 아마치 니야라는 사람이란, 낙천적인 성격과 웃음이라는 가면으로 숨긴 내면에는 뛰어난 정치, 외교적 실리를 챙기는, 그러한 사람입니다.\n\n헤실헤실 웃으며 이루어지는 통치 아래에서 그녀는 뛰어난 언변으로 백귀야행을 통제합니다. 그러한 그녀가 분명한 백귀야행의 얼굴마담이자 심장임은 명백합니다."
