 CFLAG_SHA:0 "현재 국가가 @SHA산해경 고급중학교"
 GFLAG_BAKSANWAR:0 "§R남키보토스 전쟁§!이 발발함."
 GFLAG_BAKSANWAR_END:0 "§Y남키보토스 전쟁§!이 §Y백귀야행의 승리§!로 끝남."
 CFLAG_BAKSANWAR_END:0 "§Y남키보토스 전쟁§!이 §Y산해경의 승리§!로 끝남."
 #툴팁
 HYA_tt_1:0 "§Y6개 보병으로 이루어진 4개 사단§!을 얻습니다."
 HYA_focus_46_tt:0 "§R만약 §Y파시즘 정당 지지도§!가 이 중점 완료 시점에서 §Y15%§! 보다 높을 시, 내전이 시작될 것입니다!§!"
 HYA_focus_65_tt:0 "§R만약 §Y안정도§!가 이 중점 완료 시점에서 §Y40%§! 보다 낮을 시, 내전이 시작될 것입니다!§!"
 HYA_focus_65_tt2:0 "만약 §Y비동맹주의 정당 지지도§!가 이 중점 완료 시점에서 §Y45%§! 보다 높을 시, 정권이 교체될 것입니다."
 #이벤트
 HYA_event.1.t:0 "패전"
 HYA_event.1.desc:0 "전황을 뒤집으려고 노력하고, 더 노력했습니다만, 우리는 백귀야행과의 전쟁에서 패배했습니다. 더 이상 물러날 곳은 없으며 전쟁에서 패배한 것은 이미 기정 사실입니다.\n\n우리는 백귀야행에게 청하거나...마지막 결사 항전을 준비해야 합니다."
 HYA_event.1.a:0 "산해경, 산해경이여.."
 HYA_event.1.b:0 "최후의 최후까지...싸우자."
 HYA_event.2.t:0 "산해경의 항복 제의"
 HYA_event.2.desc:0 "우리가 산해경과의 전쟁에서 앞서나가는 가운데, 산해경 정부는 우리에게 항복을 청했습니다.\n\n우리는 전쟁에서 승리했습니다!"
 HYA_event.2.a:0 "우리의 승리!"
 HYA_event.2.b:0 "완전히 그들을 합병할 것이다!"
 HYA_event.3.t:0 "화조풍월부 포착!"
 HYA_event.3.desc:0 "혼란스러운 지난 여러 테러의 배후를 추적한 결과 그 뒤에는 아주 오래전 사라졌다고 알려진 화조풍월부가 실존했습니다. 도시전설로만 여겨졌던 이들의 존재는 방금 백귀야행 연합학원의 수행부가 이들을 공식적으로 인정함으로써 실체가 들어났습니다!"
 HYA_event.3.a:0 "정말로 실존한다고?"
 HYA_event.5.t:0 "무기고 약탈"
 HYA_event.5.desc:0 "정체 불명의 세력에게 우리의 무기고가 공습을 받아 다량의 총기들이 소실된 것을 확인했습니다."
 HYA_event.5.a:0 "범인을 추적해라."
 HYA_event.6.t:0 "공격받은 무기 공장"
 HYA_event.6.desc:0 "우리의 군대에 무기를 공급하는 공장 중 하나가 괴생명체에게 습격당했다는 소식이 방금 전해져왔습니다."
 HYA_event.6.a:0 "누가...이런 일을?"
 HYA_event.7.t:0 "폭발 사고"
 HYA_event.7.desc:0 "알 수 없는 이유로 방금 도심부에서 폭발이 발생해 상당한 규모의 도시 기반이 파괴되었으며 이는 현재 지속해서 추가적인 혼란을 초래하고 있습니다."
 HYA_event.7.a:0 "수리반을 보내!"
 HYA_event.8.t:0 "실종"
 HYA_event.8.desc:0 "우리 학원의 학생들에 대한 실종 신고가 최근 자주 접수되고 있습니다. 우리는 이 사건의 배후를 추적하고 있으나 딱히 성과는 없는 것으로 보입니다."
 HYA_event.8.a:0 "우연이 아닐까?"
 HYA_event.9.t:0 "화조풍월부의 선전포고"
 HYA_event.9.desc:0 "화조풍월부가 방금 우리 학원에 대항한 전면적인 선전포고를 선언했습니다. 그들은 백귀야행 연합학원 체제를 완전히 끝내버리겠다는 대담한 주장과 함께 우리를 향해 진격하고 있습니다."
 HYA_event.9.a:0 "끝을 보자."
 HYA_event.11.t:0 "백귀야행의 불개입 조약 추진"
 HYA_event.11.desc:0 "백귀야행 측은 구 유럽과 키보토스의 상생을 목적으로 하는 불개입 조약을 발표했습니다. 이는 발칸 국가들과 백귀야행 연합학원 간의 불가침 조약을 비롯한 다양한 방안으로 두 세계를 분리하는 것을 목적으로 하고 있습니다."
 HYA_event.11.a:0 "우리도 바라던 조약이다."
 HYA_event.11.b:0 "다른 생각이 있어."
 HYA_event.12.t:0 "불개입 조약을 승인한 [FROM.GetName]"
 HYA_event.12.desc:0 "[FROM.GetName] 측은 우리와의 불개입 및 불간섭 조약은 여러 방면에서 이득이 될 것 같다는 이유로 조약을 수락했습니다."
 HYA_event.12.a:0 "좋아."
 HYA_event.13.t:0 "불개입 조약을 거절한 [FROM.GetName]"
 HYA_event.13.desc:0 "[FROM.GetName] 측은 불개입 조약은 우리의 이익을 챙기려는 특정 목적을 달성하려는게 분명하다는 불분명한 이유로 조약을 거절했습니다."
 HYA_event.13.a:0 "흠..."
 HYA_event.14.t:0 "패전"
 HYA_event.14.desc:0 "전황을 뒤집으려고 노력하고, 더 노력했습니다만, 우리는 산해경과의 전쟁에서 패배했습니다. 더 이상 물러날 곳은 없으며 전쟁에서 패배한 것은 이미 기정 사실입니다.\n\n일부 지휘관들은 산해경에게 집단으로 항복하고 있는 것이 적발되었으며, 전황이 호전될 가능성은 전무합니다."
 HYA_event.14.a:0 "벚꽃이 스러진다..."
 HYA_event.14.b:0 "전원, 총옥쇄."
 HYA_event.15.t:0 "백귀야행의 항복 제의"
 HYA_event.15.desc:0 "우리가 백귀야행과의 전쟁에서 앞서나가는 가운데, 백귀야행의 지도부는 우리에게 항복을 청했습니다.\n\n우리는 전쟁에서 승리했습니다!"
 HYA_event.15.a:0 "다시, 산해경의 땅은 돌아왔다."
 HYA_event.15.b:0 "완전히 그들을 합병할 것이다!"
 HYA_event.16.t:0 "[From.GetNameDef] 측의 항복 거부"
 HYA_event.16.desc:0 "우리의 항복 제의를 [From.GetNameDef] 측은 거절했습니다. 저들은 우리의 온전한 끝을 바라보는 것 같습니다..."
 HYA_event.16.a:0 "...."
 HYA_event.17.t:0 "백야앵제의 초대장"
 HYA_event.17.desc:0 "과거, 대전이가 벌어지기 이전에 백귀야행 연합학원이 추진하던 백야앵제를, 지금 추진하겠다며 우리를 향해 초대장을 보내왔습니다.\n\n공식적으로 참여하거나, 하지 않아도 일반 학생들의 참여는 상당할 것으로 추산되나, 우리가 공식적으로 참여 의사를 밝힌다면 정치적 이득을 얻을 수 있을 것입니다."
 HYA_event.17.a:0 "참여하자."
 HYA_event.17.b:0 "...이미, 돌아가기엔 너무 늦었다."

 HYA_event.18.t:0 "이계 축제의 초대장"
 HYA_event.18.desc:0 "대전이가 벌어지기 이전, 키보토스에서 백귀야행 연합학원 측이 정기적으로 개최하던 축제인 백야앵제에 대한 초대장을 우리에게도 보내왔습니다.\n\n참여를 선언한다면, 평화에 대한 모습을 대중에게 각인시킬 수 있으며, 이계와의 문화 교류에 도움을 줄 수 있습니다."
 HYA_event.18.a:0 "참여하자."
 HYA_event.18.b:0 "잘못 보내온거 아닌가?"

 HYA_event.19.t:0 "백화요란 부장이 돌아오다"
 HYA_event.19.desc:0 "내용"
 HYA_event.19.a:0 "아야메가 돌아왔다고?"

 #중점
 HYA_focus_1:0 "연합학원의 상황"
 HYA_focus_2:0 "문화와 축제의 학원"
 HYA_focus_3:0 "신임위원회 조직"
 HYA_focus_3_desc:0 "백귀야행의 분쟁을 조절하는 백화요란과 유사하나, 조금은 더 정치적이고 광범위한 신임위원회라는 새로운 집단을 조직할 것입니다. 이 기관은 각 동아리의 신임을 얻어 동작하는, 기초적인 수준의 의회, 또는 토론장으로 동작할 것이며, 이는 추후 백귀야행 연합학원을 강인하게 단결할 기회를 제공할 것입니다."
 HYA_focus_4:0 "수행부의 협력"
