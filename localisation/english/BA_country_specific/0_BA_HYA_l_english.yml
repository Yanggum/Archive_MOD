 HYA_urban_legend: "Urban Legend"
 HYA_urban_legend_desc: "Rumors have begun to circulate that the 'Kachoufuugetsu Club', which was subjugated by the Hyakkaryouran Conflict Resolution Council in the distant past, has resumed its activities after the Great Transference."
 HYA_flower_bird_wind_moon_club: "Kachoufuugetsu Club"
 HYA_flower_bird_wind_moon_club_desc: "The Kachoufuugetsu Club actually existed! They were truly the ones committing terror attacks against us. We have also obtained intelligence that their objective is to tear down the Hyakkiyako Alliance Academy system."
