 HYA_focus_63:0 "권력 분립"
 HYA_focus_64:0 "백화요란 분쟁조정위원회"
 HYA_focus_64_desc:0 "백귀야행은 현 체제에 안정하기에는 너무나도 위태롭습니다. 백귀야행 연합학원은 우리 백화요란 분쟁조정위원회의 새로운 지도 계율에 따라 재편되어야 마땅합니다! 우리 학원을 수호하기 위한 선택이 지금 바로 집행될 것이며, 체코계를 향한 방치적 관용정책과 동아리의 돌발적 행동들은 즉시 중단될 것입니다."
