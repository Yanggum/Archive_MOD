 HYA_mangryangz: "Influence of the Moryo"
 HYA_mangryangz2: "Frail Influence of the Moryo"
 HYA_nojukeunggundae: "Autonomous Militia"
 HYA_nojukeunggundae_desc: "Militias autonomously formed by each club. Unsurprisingly, everything from chains of command to supplies is entirely ununified, causing significant chaos during military operations."
 HYA_nojukeunggundae2: "Introduction of Military Ranks"
 HYA_nojukeunggundae2_desc: "Though they are militias autonomously formed by each club, the chain of command has been reorganized to facilitate military operations. However, cohesion is still weak, and animosity exists among members of different clubs."
 HYA_nojukeunggundae3: "Unified Military System"
 HYA_nojukeunggundae3_desc: "This is the first unified military model for the Hyakkiyako Alliance Academy. It is still incompletely integrated, but there are methods for continuous reform to improve it further."
