 STH_military_mobilization: "National Mobilization Decree"
 STH_military_mobilization_desc: "What must be done to stop the endless roar of artillery and gunfire? How much longer can the enemy fight? How much longer can we fight? Or must we fight even if neither of us can?"
 STH_end_of_factionalism: "End of Factionalism"
 STH_end_of_factionalism_desc: "The divisions existing within us during this war must be brought to an end as soon as possible. To project all our national power outwards, we must completely eliminate unnecessary waste and political losses."
 STH_crop_requisition: "Crop Requisition"
 STH_crop_requisition_desc: "To prepare for a long war, most of the grain must be requisitioned to secure our long-term war-making capabilities. The longest winter of [ROOT.GetAdjective] has begun."
 STH_total_destruction: "Total Destruction"
 STH_total_destruction_desc: "At long last, we have driven a blade into the enemy's heart and declared victory. For now, at least, it is time to celebrate our triumph!"
 STH_victory_on_the_ashes: "Victory Upon the Ashes"
 STH_victory_on_the_ashes_desc: "Even if nothing remains, isn't victory precious? Our soldiers can finally return home. At the very least, unlike our enemies, we have won."
 STH_victory_on_the_ashes_tt: "§YVictory§! focus is unlocked."
 
