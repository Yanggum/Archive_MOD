l_english: 
 #글로벌 태그
 KIABOTOS_Escape: "§YThe Seven Prisoners§! have §Yescaped§!"
 CFLAG_SHA: "Current country is @SHAShanhaijing Senior Secondary School"
 GFLAG_BAKSANWAR: "The §RSouth Kivotos War§! has broken out."
 GFLAG_BAKSANWAR_END: "The §YSouth Kivotos War§! ends in §YHyakkiyako's Victory§!."
 CFLAG_BAKSANWAR_END: "The §YSouth Kivotos War§! ends in §YShanhaijing's Victory§!."
 TOTAL_WAR_BAKSANWAR: "The §YSouth Kivotos War§! has transitioned into a §YTotal War§! phase."
 TOTAL_WAR_BAKSANWAR_tt: "§RYou will no longer be able to complete the Victory and Defeat focuses.§!"
 #툴팁
 HYA_tt_1: "Gain §Y4 divisions consisting of 6 infantry battalions§!."
 HYA_focus_46_tt: "§RIf §YFascism support§! is higher than §Y15%§! when this focus is completed, a civil war will start!§!"
 HYA_focus_65_tt: "§RIf §YStability§! is lower than §Y40%§! when this focus is completed, a civil war will start!§!"
 HYA_focus_65_tt2: "If §YNon-Aligned support§! is higher than §Y45%§! when this focus is completed, the regime will change."
 #이벤트
 HYA_event.1.t: "Defeat"
 HYA_event.1.desc: "We tried and tried to turn the tide, but we have been defeated in the war against Hyakkiyako. There is nowhere left to retreat, and our defeat in the war is already a foregone conclusion.\n\nWe must either beg Hyakkiyako for mercy... or prepare for a final, desperate stand."
 HYA_event.1.a: "Shanhaijing, our Shanhaijing..."
 HYA_event.1.b: "We fight... until the bitter end."
 HYA_event.2.t: "Shanhaijing's Offer of Surrender"
 HYA_event.2.desc: "As we push ahead in our war against Shanhaijing, the Shanhaijing government has sued for peace.\n\nWe have won the war!"
 HYA_event.2.a: "Our victory!"
 HYA_event.2.b: "We will annex them completely!"
 HYA_event.3.t: "Kachoufuugetsu Club Spotted!"
 HYA_event.3.desc: "After tracking the masterminds behind the recent string of chaotic terror attacks, we have discovered that the Kachoufuugetsu Club, long thought to have disappeared, actually exists. Their existence, once considered an urban legend, has just been officially recognized by the Hyakkiyako Alliance Academy's Inner Discipline Club, revealing their true nature!"
 HYA_event.3.a: "They really exist?"
 HYA_event.5.t: "Arsenal Looted"
 HYA_event.5.desc: "We have confirmed that our armory was raided by an unidentified faction, resulting in the loss of a large quantity of firearms."
 HYA_event.5.a: "Track down the culprits."
 HYA_event.6.t: "Weapons Factory Attacked"
 HYA_event.6.desc: "News has just arrived that one of the factories supplying our military was attacked by unidentified creatures."
 HYA_event.6.a: "Who would do... such a thing?"
 HYA_event.7.t: "Explosion Incident"
 HYA_event.7.desc: "For unknown reasons, an explosion has just occurred in the city center, destroying a significant portion of the urban infrastructure. This continues to cause additional chaos as we speak."
 HYA_event.7.a: "Send in the repair crews!"
 HYA_event.8.t: "Disappearances"
 HYA_event.8.desc: "Reports of missing students from our academy have been piling up recently. We are tracking the forces behind this incident, but it seems we haven't made any substantial progress."
 HYA_event.8.a: "Could it be a coincidence?"
 HYA_event.9.t: "Declaration of War by the Kachoufuugetsu Club"
 HYA_event.9.desc: "The Kachoufuugetsu Club has just declared an all-out war against our academy. They are advancing towards us with the bold claim that they will completely put an end to the Hyakkiyako Alliance Academy system."
 HYA_event.9.a: "Let's see this to the end."
 HYA_event.11.t: "Hyakkiyako Pushes for Non-Intervention Pact"
 HYA_event.11.desc: "The Hyakkiyako side has announced a Non-Intervention Pact aimed at coexistence between Old Europe and Kivotos. This aims to separate the two worlds through various measures, including non-aggression pacts between the Balkan states and the Hyakkiyako Alliance Academy."
 HYA_event.11.a: "This is a treaty we wanted as well."
 HYA_event.11.b: "We have other plans."
 HYA_event.12.t: "[FROM.GetName] Approves Non-Intervention Pact"
 HYA_event.12.desc: "[FROM.GetName] has accepted the treaty, stating that a non-intervention and non-interference pact with us will be mutually beneficial in many ways."
 HYA_event.12.a: "Good."
 HYA_event.13.t: "[FROM.GetName] Rejects Non-Intervention Pact"
 HYA_event.13.desc: "[FROM.GetName] has rejected the treaty for ambiguous reasons, claiming that the non-intervention pact is clearly designed to achieve specific goals favoring our own interests."
 HYA_event.13.a: "Hmm..."
 HYA_event.14.t: "Defeat"
 HYA_event.14.desc: "We tried and tried to turn the tide, but we have been defeated in the war against Shanhaijing. There is nowhere left to retreat, and our defeat in the war is already a foregone conclusion.\n\nSome commanders have been caught surrendering en masse to Shanhaijing, and there is absolutely zero chance of the war situation improving."
 HYA_event.14.a: "The cherry blossoms scatter..."
 HYA_event.14.b: "All hands, fight to the death."
 HYA_event.15.t: "Hyakkiyako's Offer of Surrender"
 HYA_event.15.desc: "As we push ahead in our war against Hyakkiyako, the leadership of Hyakkiyako has sued for peace.\n\nWe have won the war!"
 HYA_event.15.a: "Once again, Shanhaijing's lands are returned."
 HYA_event.15.b: "We will annex them completely!"
 HYA_event.16.t: "[From.GetNameDef] Rejects Surrender"
 HYA_event.16.desc: "[From.GetNameDef] has rejected our offer of surrender. It seems they desire our complete and utter destruction..."
 HYA_event.16.a: "...."
 HYA_event.17.t: "Invitation to the Hyakuya Sakura Festival"
 HYA_event.17.desc: "They have sent us an invitation, announcing that they will now hold the Hyakuya Sakura Festival, an event the Hyakkiyako Alliance Academy was planning before the Great Transference.\n\nWhether we officially participate or not, it is estimated that many ordinary students will attend. However, if we officially announce our intention to participate, we could secure some political advantages."
 HYA_event.17.a: "Let's participate."
 HYA_event.17.b: "...It's already too late to turn back."

 HYA_event.18.t: "Invitation to an Otherworldly Festival"
 HYA_event.18.desc: "They have sent us an invitation to the Hyakuya Sakura Festival, a regular festival hosted by the Hyakkiyako Alliance Academy back in Kivotos before the Great Transference.\n\nDeclaring our participation would imprint a public image of peace and help foster cultural exchange with the other world."
 HYA_event.18.a: "Let's participate."
 HYA_event.18.b: "Did they send this to the wrong address?"

 HYA_event.19.t: "The Head of Hyakkaryouran Returns"
 HYA_event.19.desc: "Reports are flooding in—Nanakado Ayame, the former head of the Hyakkaryouran Conflict Resolution Council, has returned! Her sudden reappearance has sent shockwaves through the academy, leaving everyone wondering what her next move will be."
 HYA_event.19.a: "Ayame has returned?"

 HYA_event.20.t: "Total War"
 HYA_event.20.desc: "The battle between us and the enemy has no end. There is no longer any peace, compromise, or submission. Until the winds blow and sweep everything away, we will wage eternal war against our foes.\n\nEverything is for our victory. And for the glory of [ROOT.GetAdjective]!"
 HYA_event.20.a: "Advance forward!"

 #중점
 HYA_focus_1: "The State of the Alliance Academy"
 HYA_focus_1_desc: "Following the Great Transference, the situation in Hyakkiyako has grown even more dire. Many of Hyakkiyako's clubs and merchant associations have escaped the control of the Yin-Yang Club amidst the chaos, and signs of conflict are brewing between the Yin-Yang Club and the Hyakkaryouran over how to resolve the crisis. Drastic decisions will be needed to navigate this turmoil."
 HYA_focus_2: "An Academy of Culture and Festivals"
 HYA_focus_2_desc: "The Hyakkiyako Alliance Academy has a highly developed tourism industry, but due to the chaos of the Great Transference, many tourist facilities have been destroyed and festivals canceled. Thanks to the desperate efforts of the Festival Operations Department to prevent the collapse of the tourism sector, some festivals are operating normally, but without additional support, the traditions of Hyakkiyako will disappear entirely."
 HYA_focus_3: "Organize the Trust Committee"
 HYA_focus_3_desc: "We will organize a new group called the Trust Committee, similar to the Hyakkaryouran that moderates disputes in Hyakkiyako, but slightly more political and broad in scope. This institution will function as a rudimentary parliament or forum, operating with the trust of each club. This will provide an opportunity to forge the Hyakkiyako Alliance Academy into a firmly united front in the future."
 HYA_focus_4: "Cooperation with the Inner Discipline Club"
 HYA_focus_4_desc: "The Inner Discipline Club, a club dedicated to training to become splendid ladies, built a positive image among locals and students by conducting independent refugee relief activities even before the Trust Committee was organized. Cooperating with them will allow us to better pitch the Trust Committee's goal of uniting the Hyakkiyako Alliance Academy to the public."
 HYA_focus_5: "Cooperation with the Yin-Yang Club"
 HYA_focus_5_desc: "For the Trust Committee to exert political power in Hyakkiyako, the approval of the Yin-Yang Club is absolutely necessary. Fortunately, Amachi Niya, the head of the Yin-Yang Club, is favorable to the establishment of the Trust Committee, so securing their cooperation shouldn't be too difficult."
 HYA_focus_6: "Prepare for War"
 HYA_focus_6_desc: "Hyakkiyako lacked anything resembling a regular army, relying entirely on vigilante groups independently established by each club. Many military experts argue that it is practically impossible to quell internal unrest and prepare for external invasions with Hyakkiyako's current military strength, strongly advocating for the establishment of a trained regular army."
 HYA_focus_7: "Our War"
 HYA_focus_7_desc: "Hyakkiyako is formed from a loose coalition of clubs, resulting in a lower sense of solidarity compared to other academies. However, the Great Transference has changed things. Students who must band together and survive under the shared banner of the academy are beginning to develop a sense of camaraderie. With a little added propaganda, Hyakkiyako could become a true 'Alliance Academy'."
 HYA_focus_8: "Time to Work"
 HYA_focus_8_desc: "$HYA_NIYA$ can no longer act with blind optimism. She will now use her abilities to proactively unite Hyakkiyako and take an idealistic leap towards establishing a new system that 'gathers the will of all clubs into one'."
 HYA_focus_9: "Princess Waraku"
 HYA_focus_9_desc: "The acting skills and peculiar cuteness of Hyakkiyako's superstar Waraku Chise, also known as 'Princess Waraku', are causing a sensational popularity wave even among the locals. She is currently touring all across Hyakkiyako for USO-style shows, helping people momentarily forget the grueling daily life devastated by the Great Transference."
 HYA_focus_10: "Suppress the Merchant Association"
 HYA_focus_10_desc: "Intel suggests that Nyantemaru, the representative of the Merchant Association who controls Hyakkiyako's underworld under the alias 'Nyante Masamune', is plotting to absorb the Festival Operations Department by using the Great Transference as an opportunity. We must suppress them and prevent the Merchant Association from growing too powerful."
 HYA_focus_11: "Allow Opium Trade"
 HYA_focus_12: "The South Kivotos War"
 HYA_focus_12_desc: "Hyakkiyako and Shanhaijing were indifferent to each other before the Great Transference, but now they are in a position where they must fight each other for survival."
 HYA_focus_13: "Commence Resistance"
 HYA_focus_13_desc: "Contrary to our expectations, the Shanhaijing military was stronger than our own. The military ordered a temporary retreat rather than recklessly holding the frontline, choosing to resist by using the urban areas of Hyakkiyako as cover."
 HYA_focus_14: "Mobilize Military Industry"
 HYA_focus_14_desc: "Following the outbreak of war, the flaws in the Hyakkiyako military are slowly being exposed. Setting aside the inexperience of inter-club joint operations, a severe lack of crucial military supplies is holding the Hyakkiyako forces back. We must mobilize all available military industries to resolve this issue."
 #HYA_focus_15: "Towards Liberation"
 HYA_focus_16: "Expand Conscription Pool"
 HYA_focus_16_desc: "The horrific war has caused many soldiers loyal to Hyakkiyako to disappear into the gunfire. The government has expanded the conscription pool to fill the shortfall in military personnel."
 #HYA_focus_17: "Retreat"
 #HYA_focus_18: "Time for a Counterattack"
 HYA_focus_19: "Expand the Hyakuyadou"
 HYA_focus_19_desc: "The Festival Operations Department worked tirelessly to preserve Hyakkiyako's traditions amidst the chaos of the Great Transference. Acknowledging their expertise in festivals over their own, the Yin-Yang Club granted them more authority than before and supported the expansion of the Hyakuyadou as a reward for their contributions."
 HYA_focus_20: "Urbanization Plan"
 HYA_focus_20_desc: "The Yin-Yang Club highly evaluated Kawawa Shizuko's acumen in the civilian sector and granted her development rights to the dilapidated urban areas near the Hyakuyadou. Shizuko announced an urbanization plan to establish the necessary infrastructure for smooth festivals and, ultimately, to host the Hyakuya Sakura Festival."
 HYA_focus_21: "The 1st Hyakuya Sakura Festival Plan"
 HYA_focus_21_desc: "The Festival Operations Department has decided to host the Hyakuya Sakura Festival, the first major event since the Great Transference. Though there were dissenting voices, the majority of stakeholders agreed with the Department's stance that hosting the festival is essential to showing the public that Hyakkiyako's traditions are still alive and well."
 HYA_focus_22: "Joint Festival Committee"
 HYA_focus_22_desc: "Due to the poor environment compared to Kivotos, there are many technical and efficiency shortcomings in the preparation process for the Hyakuya Sakura Festival. To improve this, Shizuko utilized the authority given by the Yin-Yang Club to establish the Joint Festival Committee, an organization allowing for more efficient festival preparation in cooperation with merchants, architects, and other stakeholders."
 HYA_focus_23: "The 2nd Hyakuya Sakura Festival Plan"
 HYA_focus_23_desc: "After discussions regarding the 1st Hyakuya Sakura Festival Plan, the Festival Operations Department convened a second meeting to identify the various issues and bottlenecks that need reinforcement during the festival's preparation process."
 HYA_focus_24: "Revitalize the Shopping Districts"
 HYA_focus_24_desc: "Hyakkiyako's street stalls were one of the supplementary joys of the festivals, but the commercial foundations of shops that heavily relied on the festivals were completely destroyed after the Great Transference. Relieving them is essential if Hyakkiyako is to fully restore its past glory."
 HYA_focus_25: "The Hyakuya Sakura Festival"
 HYA_focus_25_desc: "The long-awaited Hyakuya Sakura Festival has finally been held. Although practical constraints prevented it from reaching the magnificent scale seen back in Kivotos, many students used the festival to reminisce and remember their daily lives in Kivotos. Surprisingly, even the locals participated in the festival alongside the students without any feelings of hatred today. For this one day at least, everyone found comfort from their exhausted daily routines."
 HYA_focus_26: "The Mindset of a Proper Maiden"
 HYA_focus_26_desc: "Similar to Trinity, the students of Hyakkiyako consider 'the mindset of an elegant lady with a serene and clear spirit' to be the highest virtue. Even though the Great Transference destroyed their daily lives, the mindset of a proper maiden remains deep within the hearts of Hyakkiyako's students."
 HYA_focus_27: "Inner Discipline Club Acts as Prefects"
 HYA_focus_27_desc: "While Hyakkiyako's security organization features the Hyakkaryouran Conflict Resolution Council, they have officially requested the Inner Discipline Club, which normally volunteers for vigilante activities, to act as proxies for the Prefect Team so they can focus on uncovering the true identity of the Kachoufuugetsu Club. The Yin-Yang Club deliberated and approved this, and now the Inner Discipline Club will put even more effort into maintaining public order in place of the Hyakkaryouran."
 HYA_focus_28: "Suburban Patrols"
 HYA_focus_28_desc: "While downtown Hyakkiyako has become somewhat safer thanks to the Inner Discipline Club's vigilante activities, the suburbs remain infested with Kivotos outlaws fighting for survival and armed local groups committing hate crimes against otherworldly beings. To secure Hyakkiyako's control over the suburbs, the Inner Discipline Club is considering expanding their patrol zones."
 HYA_focus_29: "Appease the Moryo"
 HYA_focus_29_desc: "Although their numbers have dwindled since the Great Transference, the Moryo still remain a headache for Hyakkiyako. Since their combat prowess is on par with standard security forces, properly using appeasement and intimidation to bring them to heel could replenish Hyakkiyako's currently insufficient manpower."
 HYA_focus_30: "Commence Moryo Destruction"
 HYA_focus_30_desc: "Even after the Great Transference, the Moryo's terrorist activities are still ongoing. They are indiscriminately attacking vulnerable citizens and students to loot whatever few daily necessities remain, so they must be swiftly suppressed, even if it requires military force."
 HYA_focus_31: "Military Reforms"
 HYA_focus_31_desc: "Hyakkiyako's biggest problem is its ununified military. For Hyakkiyako's military strength to reach parity with other academies and local nations, we must summon the vigilante groups of all clubs, offer them various benefits to integrate them into Hyakkiyako's regular army, and establish unified regulations."
 HYA_focus_32: "The Power of Discipline"
 #HYA_focus_33: "Our Victory"
 HYA_focus_34: "Industrial Development"
 HYA_focus_34_desc: "Countless industrial facilities and street stalls that Hyakkiyako prided itself on were destroyed by the Great Transference. Recovering from this damage in the short term seems impossible. The government is making preparations for industrial recovery by establishing a systematic plan."
 HYA_focus_35: "Fortify Major Cities"
 HYA_focus_35_desc: "Hyakkiyako's major cities are sufficient to fend off attacks from thugs like the Moryo, but they are vulnerable to organized and deliberate military airstrikes. Recognizing this weakness in the major cities, the government has decided to fortify the urban areas for efficient defense."
 HYA_focus_36: "Construct the Sudetenland Line"
 HYA_focus_36_desc: "The war with Shanhaijing has revealed several areas that need improvement in the defense of major cities. In response, the government has decided to construct a massive defensive line called the 'Sudetenland Line'—using a local term for the land seized from Shanhaijing—to connect Hyakkiyako's major cities."
 HYA_focus_37: "Expand Weapons Factories"
 HYA_focus_37_desc: "Some of the destroyed industrial complexes are factories that manufacture guns, an essential item in Kivotos. The majority of them are unable to keep up with demand due to resource shortages. We must enlist the help of local military contractors to acquire blueprints for local infantry equipment and allow them to produce it domestically."
 HYA_focus_38: "Support Civilian Industry"
 HYA_focus_38_desc: "The civilian industry, which can be considered the heart of Hyakkiyako, was mostly destroyed by the Great Transference. Even the few surviving civilian industries will collapse without government intervention, so immediate action is required."
 HYA_focus_39: "Industrial Innovation"
 HYA_focus_39_desc: "N-Ninpou! Wait, this isn't ninjutsu, this is a total overhaul of our manufacturing sector! Izuna is ready to work on the assembly lines, Lord!"
 HYA_focus_40: "Road Rehabilitation"
 HYA_focus_40_desc: "The roads are a mess! How are we supposed to deliver parfaits and conduct the Matsuri effectively if the pavement is filled with craters? We need to fix this right away."
 HYA_focus_41: "Hyakkiyako Comprehensive University"
 HYA_focus_41_desc: "A comprehensive university for Hyakkiyako... Hehe, it sounds like quite the undertaking. But with a little bit of charm and a lot of funding, I'm sure it will be a splendid addition."
 HYA_focus_42: "Establish Joint Research Department"
 HYA_focus_42_desc: "Establishing a joint research department... If we pool our resources, the Yin-Yang Club and the other factions can uncover marvels. Or, at the very least, figure out how to stop the explosions."
 HYA_focus_43: "Interest in Ninpou"
 HYA_focus_43_desc: "Aruji-dono! The interest in Ninpou is skyrocketing! The Ninjutsu Research Club is finally getting the recognition it deserves!"
 HYA_focus_44: "Accompanied by the Fox"
 HYA_focus_44_desc: "Considering the unprecedented nature of the Great Transference, government officials have announced the cancellation of Kosaka Wakamo's suspension—one of the Seven Prisoners—pardoning all her crimes and appointing her as a general of Hyakkiyako. However, many students in Hyakkiyako seem dissatisfied with this measure."
 HYA_focus_45: "Maintain Wakamo's Suspension"
 HYA_focus_45_desc: "Despite the arguments of the radical factions within Hyakkiyako, the current government has officially refused to lift the suspension of Kosaka Wakamo, one of the Seven Prisoners. They stated that Wakamo's terrorist activities left an indelible, massive scar on the academy's honor, and therefore, her suspension will be upheld even after the Great Transference."
 HYA_focus_46: "Strengthen the Trust Committee"
 HYA_focus_46_desc: "The Trust Committee must stand firm. We cannot let the whims of individual clubs tear our fragile alliance apart. We need more authority to keep the peace."
 HYA_focus_47: "Hyakkiyako Student Council"
 HYA_focus_47_desc: "The Hyakkiyako Student Council, the successor to the Trust Committee, has been officially established. In its inaugural speech, the Student Council declared that it would foster equality among the clubs based on the 'Theory of Public Justice' and prioritize the well-being of Hyakkiyako's citizens above all else."
 HYA_focus_48: "Defense Industry"
 HYA_focus_48_desc: "Hyakkiyako's primary focus is to secure internal stability, and military growth is essential for this. Consequently, there is also a need to foster the defense industry."
 HYA_focus_49: "Reverse Engineer Aircraft"
 HYA_focus_49_desc: "Adapting to an environment that is similar to yet slightly different from Kivotos also applies to aircraft. We must reverse engineer aircraft built with local technology to develop new aircraft suited for the local environment."
 HYA_focus_50: "Improve Infantry Firepower"
 HYA_focus_50_desc: "After fighting against local militaries, the Hyakkiyako forces realized that Kivotos weaponry was inefficient against local infantrymen. In response, military research labs successfully applied local technology to more efficiently improve infantry firearms for combat against the locals."
 HYA_focus_51: "War Economy"
 HYA_focus_51_desc: "The Hyakkiyako government is currently focusing on military expansion. To meet the military's gradually increasing demands as a result, the government has declared a war economy over controllable Hyakkiyako factories."
 HYA_focus_52: "Fighter Development"
 HYA_focus_52_desc: "The aviation department of the military research lab has succeeded in building efficient aircraft reverse-engineered from local tech. Based on this, they have submitted a draft project to their superiors to build fighters combining Kivotos and local technology."
 HYA_focus_53: "Bomber Research"
 HYA_focus_53_desc: "Immediately after successfully reverse-engineering aircraft, some passionate talents in the aviation department expressed the idea of combining local bombers with Kivotos technology. This was immediately approved by their superiors, and they are now fully dedicated to bomber research."
 HYA_focus_54: "Hyakkiyako Aviation Research Institute"
 HYA_focus_54_desc: "The aviation research department, once a small unit within the military research lab, has risen in prominence due to consecutive successes. Catching the eye of the Hyakkiyako government, these brilliant minds were provided with a dedicated aviation research institute to help them focus entirely on their studies."
 HYA_focus_55: "Jet Aircraft"
 HYA_focus_55_desc: "While jet technology is commonplace in Kivotos, it seems it hasn't been commercialized here yet. If we establish a jet aviation unit, we will be able to secure air superiority in battles against the locals."
 HYA_focus_56: "Unify Air Doctrines"
 HYA_focus_56_desc: "Ununified doctrines aren't just a problem for the Hyakkiyako Army. Fortunately, Hyakkiyako's air force doctrines do not number in the dozens like the army's, so a relatively smooth integration of doctrines is expected."
 HYA_focus_57: "Shovels and Railways"
 HYA_focus_57_desc: "The Great Transference rendered both Hyakkiyako's and the local railway networks entirely dysfunctional. If we hire the unemployed to build railways as part of a national industrial initiative, we can hit two birds with one stone: economic stabilization and national infrastructure recovery."
 HYA_focus_58: "Expand Mining Industry"
 HYA_focus_58_desc: "We have discovered undiscovered underground resources in the Hyakkiyako area and Sudetenland using Kivotos technology. With advanced Kivotos tech, extracting these will be a piece of cake."
 HYA_focus_59: "More Land"
 HYA_focus_59_desc: "Several of Hyakkiyako's campuses were damaged beyond repair due to the impact of the Great Transference. We must clear the rubble of the old campuses, level the ground here, and forge a new land of opportunity!"
 HYA_focus_60: "Railway Centralization"
 HYA_focus_60_desc: "Following the Great Transference, the railway tracks passing through Hyakkiyako under the jurisdiction of the Highlander Railway Academy mostly became ours. Now that Highlander's interference has weakened, it is the perfect time for smooth integration with local railways."
 HYA_focus_61: "Establish a Nation"
 HYA_focus_61_desc: "After the Trust Committee's countless efforts, Hyakkiyako has successfully achieved political integration. Hyakkiyako is no longer an alliance in name only, but has been reborn as a true 'Alliance Academy'!"
 HYA_focus_62: "Led by the Yin-Yang Club"
 HYA_focus_62_desc: "Although the Yin-Yang Club is not the official student council of Hyakkiyako, their legitimacy and standing ensured there was no major pushback against them leading the Trust Committee. While them taking the reins of the newly established Hyakkiyako Student Council might carry legitimacy, some will oppose it, arguing it violates the foundational value of 'equality' championed by the Trust Committee."
 HYA_focus_63: "Separation of Powers"
 HYA_focus_63_desc: "The Trust Committee has always prioritized the value of 'equality' for the sake of Hyakkiyako's harmony. Now, ahead of the inauguration of the Hyakkiyako Student Council, executives within the Trust Committee have officially declared after a debate that all Hyakkiyako clubs, including the Yin-Yang Club, will have an equal voice in the Student Council, and the Council will resolve disputes between clubs from a neutral standpoint."
 HYA_focus_64: "Hyakkaryouran Conflict Resolution Council"
 HYA_focus_64_desc: "Hyakkiyako is far too precarious to settle for the current system. The Hyakkiyako Alliance Academy must be reorganized according to the new guiding precepts of our Hyakkaryouran Conflict Resolution Council! Choices necessary to protect our academy will be executed immediately, and the neglectful tolerance policies toward Czech factions, as well as the spontaneous actions of the clubs, will be halted at once."
 HYA_focus_65: "Subjugate the Kachoufuugetsu Club"
 HYA_focus_66: "Crackdown on Anti-Academy Activities"
 HYA_focus_67: "Ban Czech Assemblies"
 HYA_focus_68: "Eliminate Terrorists"
 HYA_focus_69: "Order and Discipline"
 HYA_focus_70: "Overthrow the Hyakkiyako System"
 HYA_focus_71: "Cooperate with the Kachoufuugetsu Club"
 HYA_focus_72: "Ostracize the Youkai"
 HYA_focus_72_desc: "Collaborating with the Kachoufuugetsu Club and their suspicious powers will not lead to a good outcome. We, the Moryo, firmly reject the Kachoufuugetsu Club and will achieve our goals in our own way—even if our identity becomes blurred in the process."
 HYA_focus_73: "Foundations of War"
 HYA_focus_74: "Inou Mononoke Roku"
 HYA_focus_75: "Genryo Hyakumonogatari"
 HYA_focus_76: "Subvert the Academy"
 HYA_focus_77: "Twilight"
 HYA_focus_78: "Rally the Moryo"
 HYA_focus_79: "Appeasement Strategy"
 HYA_focus_80: "This is a Revolution!"
 HYA_focus_81: "Dismantle Hyakkiyako"
 HYA_focus_82: "Forced Annexation"
 HYA_focus_83: "Every Man for Himself"
 HYA_focus_84: "Unitary System"
 HYA_focus_85: "Deconstruct the Academy"
 HYA_focus_86: "Establish Principles of Control"
 HYA_focus_87: "Unrestricted Freedom"
 HYA_focus_88: "Liberation of Authority"
 HYA_focus_89: "The Plunderers"
 HYA_focus_90: "Embrace Anarchism"
 HYA_focus_91: "Systematize the Moryo"
 HYA_focus_92: "Suppress the Borders"
 HYA_focus_93: "The Way We Live"
 HYA_focus_94: "Establish the State"
 HYA_focus_95: "Hyakkiyako Military Control Board"
 HYA_focus_96: "Flexible Club System"
 HYA_focus_96_desc: "To practice the Student Council's founding principle of 'equality,' we must possess the ability to properly moderate conflicts between clubs. Perhaps it would be better to flexibly reorganize the club system to prevent situations where conflicts arise in the first place."
 HYA_focus_97: "State of Hyakkiyako"
 HYA_focus_100: "Domestic Focus"
 HYA_focus_100_desc: "Although the academy narrowly avoided fragmentation through political integration under the establishment of the Student Council, many issues remain unresolved within Hyakkiyako. For now, it is a priority to temporarily disconnect from the world and focus on our internal matters."
 HYA_focus_101: "Defend the Borders"
 HYA_focus_102: "Anti-Interventionist Foreign Policy"
 HYA_focus_102_desc: "Ever since the Trust Committee era, Hyakkiyako has maintained a neutral stance during conflicts between other academies. Their successor, the Student Council, has issued an official statement that Hyakkiyako will take a neutral stance and not intervene in other countries until internal matters are resolved."
 HYA_focus_103: "Construct Border Fortresses"
 HYA_focus_103_desc: "Neutrality isn't a shield capable of avoiding all wars. On the contrary, neutrality can lead to self-isolation. Therefore, Hyakkiyako must not rely on outside support during external invasions, but firmly fortify defensive lines to prepare for enemy incursions."
 HYA_focus_104: "Push for Non-Intervention Pact"
 HYA_focus_104_desc: "Various Balkan states are paying close attention to the next moves of the growing Hyakkiyako. If Hyakkiyako meddles in the Balkan Hegemony wars, they might unite to attack us. Therefore, we must push for a Non-Intervention Pact to broadcast our lack of interest in aggression."
 HYA_focus_105: "The Balkan Wall"
 HYA_focus_105_desc: "The conflicts among Balkan states are intensifying by the day, resembling a powder keg that could explode at the slightest spark. Several students among the Student Council executives who are deeply familiar with the local culture have proposed building an impregnable wall on the borders to prepare for this."
 HYA_focus_106: "Identify Hostile Nations"
 HYA_focus_107: "Hyakkiyako Fortress Committee"
 HYA_focus_107_desc: "In accordance with our anti-interventionist policy, countless fortresses have been built to defend our borders. To efficiently oversee the maintenance and management of these forts, and to control the massive amounts of supplies funneled into them, the government has established the Fortress Committee."
