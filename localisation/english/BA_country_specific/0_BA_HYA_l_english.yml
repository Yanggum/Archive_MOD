 HYA_focus_8:0 "일 할 시간"
 HYA_focus_8_desc:0 "$HYA_NIYA$는 더 이상 모든 걸 낙관하는 모습으로만 활동할 수 없습니다. 그녀는 이제 자신의 능력을 활용해 주도적으로 백귀야행을 통합하고, 더 나아가 '모든 동아리의 의지를 하나로 모으는' 신체제를 수립하기 위한 이상주의적 도약을 시작할 것입니다."
