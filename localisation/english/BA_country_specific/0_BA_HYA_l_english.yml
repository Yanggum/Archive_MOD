 HYA_yuyeonhandongali: "Hyakkiyako 'Alliance' Academy"
 HYA_yuyeonhandongali_desc: "The Hyakkiyako Alliance Academy is a kind of federation composed of a loose alliance between various clubs. This system boosts Hyakkiyako's stability, but the lack of a practical central government prevents it from pursuing proactive initiatives."
