 HYA_NIYA: "Amachi Niya"
 HYA_NIYA_DESC: "Amachi Niya—often called the Yin-Yang Club's President completely steeped in the evils of bureaucracy, grinning every day while ignoring civil complaints—is the de facto student council president who guided Hyakkiyako through the Great Transference. Her optimistic personality and seemingly hollow authority were more than enough to burden her with a terrible stigma.\n\nAn irresponsible and useless student council president. That is how the students of Hyakkiyako refer to her.\n\n...If you evaluated her using those very words, Niya would certainly burst out laughing and clap her hands. She might appear to be the definitive mastermind behind all disasters, but in truth, it's closer to her simply enjoying 'playing the mastermind.' The person known as Amachi Niya is someone who uses her mask of an optimistic personality and smiles to secure outstanding political and diplomatic practical gains.\n\nBeneath the rule established with a goofy smile, she controls Hyakkiyako with her brilliant rhetoric. It is abundantly clear that she is the undeniable figurehead and beating heart of Hyakkiyako."
