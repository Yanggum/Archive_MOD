 HYA_focus_71:0 "화조풍월부와 협력"
 HYA_focus_72:0 "요괴 배척"
 HYA_focus_72_desc:0 "저 수상쩍은 힘을 다루는 화조풍월부와 협력하는 건 별로 좋은 꼴은 보지 못할 것입니다. 우리 망량즈는 화조풍월부를 단호하게 거부하고 우리만의 방식대로 -때로는 우리의 정체성이 흐려지더라도- 목적을 이뤄낼 것입니다."
