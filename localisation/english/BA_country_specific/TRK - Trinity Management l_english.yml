l_english:
 # ================================================
 # 1. 정당 이름 (Parties)
 # ================================================
 trinity_student_coalition: "Student Coalition"
 trinity_student_coalition_long: "Trinity Student Coalition"
 trinity_sanctus_party: "Sanctus"
 trinity_sanctus_party_long: "Trinity Sanctus Faction"
 trinity_filius_party: "Filius"
 trinity_filius_party_long: "Trinity Filius Faction"
 trinity_sisterhood_party: "Sisterhood"
 trinity_sisterhood_party_long: "Trinity Sisterhood"

 trinity_conservative_bloc: "Conservative Bloc"
 trinity_conservative_bloc_filius: "Conservative Bloc - Filius Faction"
 trinity_conservative_bloc_sisterhood: "Conservative Bloc - Sisterhood"

 # ================================================
 # 2. 국가 중점 (Focuses)
 # ================================================
 # 초기 정치 중점
 TRK_after_the_dust_settles: "After the Dust Settles"
 TRK_after_the_dust_settles_desc: "The war was more than enough to leave us devastated. Economic figures are bottoming out, and the people's livelihoods have reached a breaking point."
 TRK_new_constitution: "Drafting a New Charter"
 TRK_new_constitution_desc: "The New Charter passed by Misono Mika and the Pater Faction is far too dangerous, structured in a way that allows another dictator like her to emerge easily. We must nullify the charter Mika passed and rewrite a truly democratic constitution."
 TRK_host_election: "The First Free Election"
 TRK_host_election_desc: "The voices of the students, once silenced by the weight of the Tea Party's tea sets, shall finally ring out across the courtyard. Let us see who truly holds the heart of Trinity."

 # 학생 연합 (우라와 하나코) 루트
 TRK_student_union: "Student Union"
 TRK_student_union_desc: "For too long, the 'grace' of Trinity has been a cage. It's time to open the windows and let a little... fresh, uninhibited air in, don't you think?"
 TRK_direct_legislation: "Direct Legislation"
 TRK_direct_legislation_desc: "Why wait for the Tea Party to finish their snacks? If the students want a change, they should be able to write it into the books themselves—no hidden strings attached."
 TRK_liberal_welfare_state: "Liberal Welfare Academy"
 TRK_liberal_welfare_state_desc: "A school that takes care of its own, ensuring every student can pursue their 'desires' without worrying about the bare essentials."
 TRK_democracy_supplement: "Supplementing Representative Democracy"
 TRK_democracy_supplement_desc: "Representing the people is all well and good, but sometimes the 'representatives' get a bit too focused on their own reflections. We need a safety net for the will of the students."
 TRK_proportional_representation: "Proportional Representation"
 TRK_proportional_representation_desc: "Every voice deserves a seat at the table, even the ones that whisper things the Sisterhood might find... scandalous."
 TRK_establish_of_welfare_state: "Establishing the Welfare Academy"
 TRK_establish_of_welfare_state_desc: "Solidifying the foundations of a Trinity where no student is left behind in the cold."
 TRK_wishing_girl: "The Girl Who Wishes"
 TRK_wishing_girl_desc: "Behind the jokes and the masks, there is a simple wish for a world where we can all just be ourselves. Is that too much to ask for?"
 TRK_social_liberal: "Social Liberalism"
 TRK_social_liberal_desc: "Balancing individual freedom with social responsibility—a delicate dance, much like choosing the right swimsuit for the occasion."

 # 상투스 분파 (유리조노 세이아) 루트
 TRK_sanctus: "Sanctus Faction"
 TRK_sanctus_desc: "The prophecy was shattered, but the principles remain. We shall rebuild Trinity not through sight, but through the shared vision of all its members."
 TRK_sanctus_focus_01: "Universal Basic Services"
 TRK_sanctus_focus_01_desc: "Ensuring that the basic needs of every student are met as a fundamental right, not a privilege granted by the heavens."
 TRK_local_autonomy: "Decentralization"
 TRK_local_autonomy_desc: "Power should not pool in the center like stagnant water. We must return autonomy to the local districts and clubs of Trinity."
 TRK_coop_with_SPD: "Cooperation with the SPD"
 TRK_coop_with_SPD_desc: "Reaching across the aisle to find common ground with those who seek social justice and progress."
 TRK_teaparty_reform: "Tea Party Structural Reform"
 TRK_teaparty_reform_desc: "Even with a new charter, the power of the Host and the executive branch remains undeniably immense. This is not a complete solution to prevent the abuse of power seen during the Misono Mika incident. The power structure itself must be reorganized. The center of power should no longer be an individual Host, but the Tea Party as a whole, with power dispersed through checks and balances."
 TRK_constructive_vote_of_no_confidence: "Constructive Vote of No Confidence"
 TRK_constructive_vote_of_no_confidence_desc: "Ensuring stability while maintaining accountability; a government can only be removed if a viable alternative is ready to lead."
 TRK_social_democrat: "Social Democracy"
 TRK_social_democrat_desc: "A path where tradition meets progress, ensuring the welfare of the many through the cooperation of the all."

 # 필리우스 분파 (키리후지 나기사) 루트
 TRK_filius: "Filius Faction"
 TRK_filius_desc: "Stability is the bedrock of any great institution. We shall restore the elegance and order that Trinity once held so dear, one cup of tea at a time."
 TRK_gradually_supplementing_system: "Gradual System Supplementation"
 TRK_gradually_supplementing_system_desc: "Change should not be a violent storm, but a gentle tide. We will refine our institutions carefully to ensure they serve us better."
 TRK_host_empowerment: "Host Empowerment"
 TRK_host_empowerment_desc: "In times of uncertainty, a strong hand is needed to guide the ship. We must ensure the Host has the tools necessary to protect Trinity's interests."
 TRK_conservatism_bloc: "Formation of the Conservatism Bloc"
 TRK_conservatism_bloc_desc: "Uniting the traditionalist elements of Trinity to provide a steady and reliable political foundation."
 TRK_adherent_of_parliamentarianism: "Adherence to Parliamentarianism"
 TRK_adherent_of_parliamentarianism_desc: "The floor of the assembly is where the future of Trinity must be debated, not in the shadows of backroom deals."
 TRK_coop_between_party: "Expanding Inter-Factional Cooperation"
 TRK_coop_between_party_desc: "Harmony between the factions is essential for a functioning Trinity. We must bridge the gaps that have divided us for too long."
 TRK_antitrust_law: "Antitrust Law"
 TRK_antitrust_law_desc: "Preventing any single interest from dominating our economy, ensuring fair competition for all student-led enterprises."
 TRK_christian_democracy: "Christian Democracy"
 TRK_christian_democracy_desc: "Upholding our traditional values while embracing democratic principles to build a moral and prosperous society."
 
 # 공용
 TRK_coalition_government_of_idealists: "Coalition Government of Idealists"
 TRK_coalition_government_of_idealists_desc: "When the dreamers unite, even the most daunting challenges seem surmountable. A union for the future of Trinity."
 TRK_economic_committee: "Academy Economic Committee"
 TRK_economic_committee_desc: "A centralized body to oversee the recovery and growth of our shattered economy."
 TRK_new_trinity_capitalism: "New Trinity Capitalism"
 TRK_new_trinity_capitalism_desc: "A modern economic system that values innovation and growth while maintaining the unique social fabric of our academy."
 TRK_labor_union_encouragement: "Encouragement of Labor Unions"
 TRK_labor_union_encouragement_desc: "Protecting the rights of students who work within the academy's various industries and services."
 TRK_national_church: "National Church"
 TRK_national_church_desc: "The spiritual heart of Trinity must remain open and inclusive, serving as a beacon of hope for all students."


 # 경제 중점
 TRK_trinity_capital_forced_dissolution: "Forced Dissolution of Trinity Big Capital"
 TRK_trinity_capital_forced_dissolution_desc: "It is clear that the birth of the Trinity extremist regime was aided by numerous lobbying efforts from Trinity-affiliated big capitalists and German entrepreneurs, and that many capitalist exploitations sustained the Trinity war machine. To prevent the birth of a second extremist regime, we must dissolve the giant corporations that independently exercise political power."
 TRK_currency_reform: "Currency Reform"
 TRK_currency_reform_desc: "The credit of the numerous currencies issued by Trinity has been severely damaged by the war and the national bonds issued during that process. We must resolutely push through currency reform to confiscate the old currency and issue new currency."
 TRK_forced_labor_management_reconciliation: "Forced Labor-Management Cooperation"
 TRK_forced_labor_management_reconciliation_desc: "To suppress big capital from unilaterally exercising power in politics ahead of the public will, we will mandate the participation of workers in corporate leadership."
 TRK_strong_small_economy: "Strong Small-Scale Economy"
 TRK_strong_small_economy_desc: "The new Trinity economy will be filled not by giant corporations, but by small and medium-sized enterprises that are small but substantial and powerful, which is expected to structurally suppress the birth of extremism in the future."
 TRK_reversal_of_brain_drain: "Reversal of Brain Drain"
 TRK_reversal_of_brain_drain_desc: "We will reverse the 'brain drain' of numerous talented individuals and scientists who went into exile during the Trinity extremist regime and invite them back to Trinity's innovation once again."
 TRK_prohibition_of_the_second_extremism: "Prevention of a Second Extremism"
 TRK_prohibition_of_the_second_extremism_desc: "Quickly repairing residential areas and roads devastated after the war and supplying new housing at low costs can grow trust in our government and prevent a second extremism from taking root."
 TRK_eden_academy: "Eden Academy"
 TRK_eden_academy_desc: "Eden Academy will take on a self-purification role, reviving Trinity's scientific innovation once again and healthily restoring the culture of civil society polluted under the old extremist regime."
 TRK_restoration_of_collapsed_industry: "Restoration of Collapsed Industry"
 TRK_restoration_of_collapsed_industry_desc: "By restarting industrial investment that stopped long ago, we will advertise that the industry of the German economy is escaping collapse and recovering, returning the employment and growth curves to their original positions."
 TRK_social_market_economy: "Social Market Economy"
 TRK_social_market_economy_desc: "We have witnessed the end of an era and must admit that a completely free market no longer exists. Now, under 'Ordoliberalism' where the state sets the rules of the market and draws a fair starting line, we must direct the momentum of the market toward the public good of society."

 TRK_establishment_of_eden_army: "Establishment of the Eden Army"
 TRK_reincorporation_of_military_industrial_complex: "Re-incorporation of Select Military-Industrial Complexes"
 TRK_resumption_of_weaponry_production: "Resumption of Weaponry Production"
 TRK_introduction_of_next_generation_tanks: "Introduction of Next-Generation Tanks"
 TRK_eastern_plan: "Eastern Plan"
 TRK_western_plan: "Western Plan"
 TRK_construction_of_filius_line: "Construction of the Filius Line"
 TRK_construction_of_filius_line_tt: "Expand §YFortifications§! in all major cities of states adjacent to [SOV.GetAdjective] and [POL.GetAdjective] sides.\n"
 TRK_prussia_plan: "Prussia Plan"
 TRK_army_expansion: "Army Expansion"
 TRK_strongest_shield: "The Strongest Shield"
 TRK_investment_in_special_forces: "Investment in Special Forces"
 TRK_preparing_for_contingencies: "Preparing for Contingencies"
 TRK_expansion_of_tank_production_lines: "Expansion of Tank Production Lines"
 TRK_sword_at_the_throat: "Sword at the Throat"
 TRK_high_speed_warfare_doctrine: "High-Speed Warfare Doctrine"
 TRK_light_infantry_division_doctrine: "Light Infantry Doctrine"
 TRK_wartime_mobilization: "Wartime Mobilization"
 TRK_wartime_mobilization_desc: "The fires of war sweep through this land once more, but this time, our Eden citizens will never yield to foreign threats and will proudly prove that we can defend our sovereignty!"

 # ================================================
 # 3. 국민정신 (National Spirits)
 # ================================================
 TRK_economic_collapse_ns: "Remnants of the Academy Economic Development Department" 
 TRK_economic_collapse_ns_desc: "The Academy Economic Development Department, created under the leadership of Misono Mika, completely collapsed the Trinity economy. When the department was dissolved, the bloated directly-managed enterprises fell into total chaos. Some German-affiliated companies were reclaimed by their original owners or repurchased at low prices. However, a significant number of companies and factories still require restructuring."
 TRK_gehenna_puppet: "Gehenna Military Administration"
 TRK_gehenna_puppet_desc: "We were defeated in the war with Gehenna, and their military government remains in Trinity territory. We are an independent nation in name only."
 TRK_gehenna_puppet_next: "Gehenna Civil Administration"
 TRK_gehenna_puppet_next_desc: "The Gehenna military government, represented by the Eden Administrative Body, underwent significant changes following the disappearance of one of their political sponsors after Gehenna's unification. This resulted in the establishment of an official Gehenna civil administration with a significant restoration of our autonomy."

 TRK_industry_ns: "New Trinity Industry"
 TRK_industry_ns_desc: "As discussed during the establishment of the previous Treaty Organization, decentralization will be pursued to prevent concentrated big capital from unilaterally swaying politics in Trinity's economy ever again. We have begun the long task of liquidating or nationalizing bloated large corporations and splitting them into smaller economic units."

 TRK_direct_legislation_ns: "Freedom of Religion"
 TRK_new_trinity_capitalism_ns: "New Trinity Capitalism"
 TRK_academy_economic_committee_ns: "Academy Economic Committee"
 TRK_welfare_state_ns: "Welfare Academy"
 TRK_labor_union_ns: "Labor Union"
 TRK_antitrust_law_ns: "Antitrust Law"
 TRK_lobbying_corp_ns: "Corporate Lobbying"
 TRK_lobbying_corp_ns_desc: "Large corporations are lobbying the government to abolish the Antitrust Law."
 TRK_democratic_government_ns: "Nascent Democratic Government"
 TRK_weaks_democratic_government_ns: "Weak Democratic Government"
 TRK_strong_democratic_government_ns: "Strong Democratic Government"

 # 동적 수정자
 TRK_local_government: "Strengthened Local Autonomy"

 TRK_army_ns: "Eden Army"
 TRK_army_ns_desc: "The demilitarized forces of Trinity now have a reason to arm themselves against new threats."

 # ================================================
 # 4. 사건 (Events)
 # ================================================
 # 초기/일반 이벤트
 TRK_events.1.t: "[TRK.GetName]"
 TRK_events.1.desc: "As the dust settles, a new ruler has stepped into the land Trinity once governed. The undeniable winner is Gehenna Academy. Operating in the form of a military government, [TRK.GetName] has clear goals: to rebuild the territory devastated by the Gehenna-Trinity War and to construct a truly free new Trinity, rather than the violent and oppressive regime of the past. Of course, all of this is predicated on being under Gehenna's surveillance.\n\nCurrently, the Gehenna military government is exerting strong pressure on the interim administration. They demand the election of a new legislature, the holding of a constituent assembly to revise the constitution, and the election of a Host through democratic procedures. Whether we like it or not, a new charter and elections will be held soon. The fate of Trinity now lies in the hands of its citizens."
 TRK_events.1.a: "I see."

 TRK_events.2.t: "Trinity Election Period"
 TRK_events.2.desc: "The charter has been revised, and elections are soon to be held in Trinity. This election carries great significance as it is the first free election since Misono Mika. Three candidates and their factions—essentially parties—have registered with the Election Commission.\n\nThe first is a popular faction named the 'Trinity Student Coalition,' centered around Urawa Hanako. The second is Yurizono Seia, who was thought to be a victim of a tragic assassination but has rebuilt the Remedy Knight and the fallen Sanctus faction to seek the Host position once more. The third is Kirifuji Nagisa, who has a heroic narrative; she was imprisoned by Misono Mika but was released by Pandemonium and the Prefect Team when Gehenna advanced into Eden, and she holds the greatest popularity among students and the public. Finally, it was thought that Utazumi Sakurako and the Sisterhood—the greatest representatives of Trinity Christianity—would run, but they ultimately declared they would not, leaving a total of three candidates to compete.\n\nTrinity's elections are conducted by electing the Host and Tea Party seats simultaneously. Once the election is over, Gehenna will terminate its military administration and fully transfer power to the civilian government regardless of the outcome, though the military administration will still maintain significant influence. The major factions of Trinity are feverishly preparing, filling staff positions, raising funds, and working to rebuild their organizations and ideologies. Unlike a typical election cycle where all positions are not elected at once, everyone knows how crucial the [GetYear] election is, with every seat in the Tea Party at stake."
 TRK_events.2.a: "Democracy has been realized!"
 
 TRK_events.3.t: "The Issue of German Suffrage"
 TRK_events.3.desc: "The issue of German suffrage has been a recurring problem for a long time. During Misono Mika's reign, voting rights for Germans were guaranteed, albeit very limitedly. This issue was quiet after the limited rights were granted but began to be discussed again as the voices of local Germans grew louder after the defeat.\n\nThe question is how far German suffrage should be guaranteed. Options include guaranteeing limited voting and eligibility rights as Mika did, or ensuring full suffrage. Of course, as time passes, a discussion on suffrage will become inevitable, so doing it in advance might not be a bad idea."
 TRK_events.3.a: "Let's discuss this later."
 TRK_events.3.b: "Specify German suffrage in the charter."

 TRK_events.4.t: "The Peroro Religion?"
 TRK_events.4.desc: "Inside a solemn chapel, hundreds of candles are lit and the majestic sound of a pipe organ echoes. However, in the center of the altar they surround, there is no statue of the Virgin Mary, but a 'Giant Limited Edition Winking Master Peroro Plush (Ver. Kaitenger Collaboration).'\n\nStudents in robes held light sticks (penlights) instead of Bibles, and the candlelight eerily illuminated Peroro's silly and cute face from below.\n\n\"Ooooh... Master Peroro... we entrust our souls to the movement of your tongue...\"\n\"This goods lottery... please grant us the grace of 'winning'!\"\n\"Pero! Pero! Pero!\"\n\nJust then, a girl with white wings was backing away from behind the altar, breaking into a cold sweat. A 'High Priest' hat was perched on her head as if forced there.\n\n\"E-excuse me... I just came here because I heard it was a limited edition goods exchange... why has the atmosphere become a religion?! And can someone please take this hat off me?!\"\n\n\"Behold! Our 'Faust' has received a revelation from the God Peroro!\"\n\"Uwoooooh!! Faust! Faust!\"\n\n\"I said no—!\"\n\nFollowing a report, the Justice Task Force was dispatched. The religious group underwent a brief investigation, and unexpected items were discovered during the seizure process. Surprisingly, the list of seized items included 400 Peroro plushes."
 TRK_events.4.a: "Pero! Pero! Pero!"

 TRK_events.5.t: "Independence of the Administrative Body"
 TRK_events.5.desc: "The telephones won't stop ringing. Paper is pouring out of the fax machine like a waterfall, and outside the window, trucks rushed from mainland Gehenna are lining up, kicking up dust.\n\n\"What is all this? 168 tactical shuttles? A latest-model field artillery battalion that should be in the homeland? No, what is this document?!\"\n\nIn the administrator's trembling hands was a document clearly stamped with the title **Emergency Administrative Order No. 66: Transfer of Autonomy and Permanent Vesting of Assets of the Eden Treaty Organization**. Those whose defeat in the Gehenna Civil War seemed certain decided to dump everything on us rather than let their assets fall into the hands of their enemies.\n\nWarehouses are bursting with tanks and supplies smuggled from the mainland, and on the desk are stacks of 'autonomy guarantee clauses' designed layer by layer so that even the victorious Gehenna Unified Government cannot easily touch them. We, who were just a military government body keeping an eye on the homeland until yesterday, have become the most heavily armed 'independent' administration in Kivotos overnight.\n\nThis is not a gift. It is a final curse and a treacherous trap from the losers, telling us to survive against the victorious home government. But what can we do? The tanks are already started, and the ink on the documents is dry."
 TRK_events.5.a: "The clock ticks urgently."

 TRK_events.6.t: "Independence of the Administrative Body"
 TRK_events.6.desc: "The report on the takeover of occupied territories has arrived on the desk. However, the reported figures were absurdly different from what was expected.\n\n\"Securing major military warehouses complete. However, the interiors are empty. No remaining supplies.\"\n\nWhat the forces entering the scene found were the messy tire tracks of trucks that had hurriedly departed and a few shipping orders they hadn't managed to burn. As a result of the tracking, it was confirmed that the vast amount of missing tanks, artillery, and essential supplies had all been urgently transported to the 'Eden Treaty Organization (ETO)' management area, a border zone.\n\nThe opposing faction, whose defeat was imminent, chose to 'transfer' their assets to a third zone using loopholes in the treaty rather than seeing them absorbed by our unified government. By handing over autonomy transfer documents along with the supplies, they turned the ETO management area into a fortress beyond the control of the homeland.\n\nThis is the last gasp and petty revenge of the losers. We won the civil war, but in return, we have a time bomb called a 'heavily armed disobedient autonomous district' right under our noses."
 TRK_events.6.a: "The clock ticks urgently."

 TRK_events.7.t: "An Opportunity?"
 TRK_events.7.desc: "Following the internal conflict and clashes within Gehenna Academy, the Eden Administrative Body adjacent to our border is identified as being in an administrative position considered temporarily unprotected—or rather, in a state of quasi-independence.\n\nIn other words, if we strongly request the return of Arius's sovereign territory for the purpose of the Arius Satellite School, they, who are not currently rearmed and are focused on defending the Gehenna border, will likely have no choice but to accept the threat to their rear."
 TRK_events.7.a: "Fine. Send the ultimatum."
 TRK_events.7.b: "No, Gehenna will likely intervene."

 TRK_events.8.t: "Arius Satellite School's Ultimatum"
 TRK_events.8.desc: "The Arius Satellite School seems to view the current situation with the Eden Administrative Body as an opportunity. They have sent an ultimatum to our academy demanding the transfer of their sovereign territory near Danzig and seem to be preparing for an invasion directed at us from the border."
 TRK_events.8.a: "It can't be helped. We must defend the Gehenna border."
 TRK_events.8.b: "Reject it firmly!"

 TRK_events.9.t: "Return of Sovereign Territory by Eden Administrative Body"
 TRK_events.9.desc: "Taking advantage of the Eden Administrative Body situation, they have decided to return the sovereign territory we demanded. We have annexed the sovereign territory without any military collision!"

 TRK_events.10.t: "Eden Administrative Body Rejects Ultimatum"
 TRK_events.10.desc: "The Eden Administrative Body has rejected the return of sovereign territory, stating there is no international basis for our ownership, despite the opportunity presented by their current situation.\n\nWe can only view this diplomatic insult, which ignores our sovereignty succeeding the time of the unilateral expulsion from the old Trinity Council, as an act that may require us to prepare for war!"
 TRK_events.10.a: "Declare war!"

 # 선거 이벤트 (Election Events)
 TRK_election_events.1.t: "Urawa Hanako's Speech"
 TRK_election_events.1.desc: "\"Ah, mic test... one, two. Fufu, hello everyone. I'm Urawa Hanako. Trinity's politics have been quite heavy so far, haven't they? Like underwear that doesn't quite fit... fufu,\"\n\nUrawa Hanako was the first to take action. Knowing all too well that her support base was weak, she devised a strategy to make herself known through active participation from the start.\n\nFortunately, the strategy seems to have worked well. Urawa Hanako's speech spread rapidly through SNS and other channels."
 TRK_election_events.1.a: "The citizens were enthusiastic about Hanako's speech!"
 TRK_election_events.1.b: "The citizens were repulsed by the suggestive jokes."

 TRK_election_events.2.t: "The Sanctus Faction and the Remedy Knight"
 TRK_election_events.2.desc: "The Sanctus Faction suffered a great split after the assassination of Yurizono Seia. Since Misono Mika, Yurizono Seia and her followers, along with the Remedy Knight, have been rebuilding the crumbling faction.\n\nThe Remedy Knight had maintained some distance from politics due to Captain Aomori Mine's convictions, but a certain sense of responsibility has emerged—that indifference toward politics after the rise of Misono Mika and the war with Gehenna led to this situation. Accordingly, they are exercising some influence in politics by indirectly supporting the Sanctus Faction.\n\nTrinity's citizens have formed a support base for her to some extent, mainly due to the existing good deeds of the Remedy Knight and sympathy for Yurizono Seia."
 TRK_election_events.2.a: "An exemplary strategy!"

 TRK_election_events.3.t: "Anti-Gehenna Protests"
 TRK_election_events.3.desc: "The fact that they were defeated by Gehenna naturally came as a huge shock to Trinity students. Protests against the Gehenna military government were frequently held, and this continued even while Kirifuji Nagisa was touring the central district and making speeches for her campaign. The venue quickly became rowdy, and clashes broke out between Kirifuji Nagisa's supporters and anti-Gehenna protesters, soon leading to fistfights.\n\nKirifuji Nagisa was somewhat flustered by the situation but composed herself and began her speech again."
 TRK_election_events.3.a: "Nagisa calmed the situation with her charisma."
 TRK_election_events.3.b: "Nagisa was unable to calm the situation."

 TRK_election_events.4.t: "The Sisterhood's Declaration of Support?"
 TRK_election_events.4.desc: "The Sisterhood declared they would not run, but they remain one of the most influential factions. In particular, their status as representatives of Trinity Christianity gives them immense power. The faction they declare support for is expected to win the hearts of Trinity Christians and record a significantly high vote share."
 TRK_election_events.4.a: "They supported the Student Coalition!"
 TRK_election_events.4.b: "They supported the Sanctus Faction!"
 TRK_election_events.4.c: "They supported the Filius Faction!"
 TRK_election_events.4.d: "The Sisterhood maintained neutrality!"

 TRK_election_events.5.t: "The Choice of German Citizens"
 TRK_election_events.5.desc: "Where will the hearts of the Germans head in the election held as voting rights are guaranteed to them, albeit limitedly? Along with the guarantee of suffrage, candidates are actively promoting policies for local Germans.\n\nTaking Urawa Hanako as an example, she advocates for full equality. Minority protection policies are also included. Like this, other factions are also preparing policies for Germans. For the Germans, who have gained the opportunity for political participation, even if limited, this election is an important chance to make their voices heard."
 TRK_election_events.5.b: "They chose the Student Coalition!"
 TRK_election_events.5.c: "They chose the Sanctus Faction!"
 TRK_election_events.5.d: "They chose the Filius Faction!"

 TRK_election_events.6.t: "Yurizono Seia Engulfed in Controversy"
 TRK_election_events.6.desc: "As the fact that the deal between Yurizono Seia and the Remedy Knight contributed greatly to Misono Mika's rise to power spread, explanations are being demanded from the Sanctus Faction and the Remedy Knight. They have concluded that if Seia had shown her return without making a deal, she could have stopped Mika's rampage. Trinity's citizens are strongly demanding an explanation for this."
 TRK_election_events.6.a: "Seia quelled the controversy."
 TRK_election_events.6.b: "Seia failed to quell the controversy."

 TRK_election_events.7.t: "Student Coalition Fever"
 TRK_election_events.7.desc: "The existing Tea Party was old-fashioned, disconnected from the outside world, and failed to properly reflect the will of the students. Therefore, Trinity students naturally became enthusiastic about Urawa Hanako and the Student Coalition, who advocate for fairness and transparency. Hanako also seems to be utilizing this image well. In particular, after the failure of Mika's 'populism,' students are showing more interest in political decision-making and asserting their opinions, making it seem like a new page has opened in Trinity politics."
 TRK_election_events.7.a: "Interesting."
 TRK_election_events.7.b: "We must find a way to hinder their actions."

 TRK_election_events.8.t: "United by Faith"
 TRK_election_events.8.desc: "Hostility toward the Sisterhood is decreasing due to their various volunteer activities, and their influence is rising sharply. This is because they helped many students sustain their lives after the war. The faction previously supported by the Sisterhood has enjoyed a ripple effect from this increase in favorability."
 TRK_election_events.8.a: "Good news!"

 TRK_election_events.9.t: "The Prodigal Sons"
 TRK_election_events.9.desc: "When Misono Mika took power, executives from other factions joined the Pater Faction, including executives from the Filius Faction like Nagayoshi Subaru and Yamamoto Nana. They want to return to the Filius Faction, and most of them seek to return to politics. If they committed crimes during Mika's time, they would be investigated and tried, but how to view these 'prodigal sons'—who opportunisticly joined the Pater Faction and are now joining their previous faction again—has become a topic of discussion for the Filius Faction."
 TRK_election_events.9.a: "Allow their return."
 TRK_election_events.9.b: "There is no compromise."

 TRK_election_events.10.t: "End of the Election Campaign"
 TRK_election_events.10.desc: "It is almost election day. Campaigning is now in its final stages. While each candidate seems to have clear strengths and weaknesses, who finished the most cleanly?"
 TRK_election_events.10.a: "Student Coalition"
 TRK_election_events.10.b: "Sanctus Faction"
 TRK_election_events.10.c: "Filius Faction"
 TRK_election_events.10.d: "Sisterhood"

 TRK_election_events.11.t: "Election Results!"
 TRK_election_events.11.desc: "The fierce campaigning has ended, and the election has concluded as well. While each candidate watches the results in their respective situation rooms, all of Trinity's attention is focused there.\n\nWho will be Trinity's next leader? Whoever it is, a very difficult path awaits them. The legacy Misono Mika left has sickened Trinity. Curing this panic might take years, or perhaps even longer. However, even in that darkness, a light of hope exists. Trinity students have regained their precious freedom. They have a leader they chose with their own hands, a properly functioning assembly, and are no longer swayed by illegality and violence. This is the beginning of true democracy.\n\nWith the results about to be announced, all eyes are watching. Who will be Trinity's next Host...?"
 TRK_election_events.11.a: "Urawa Hanako of the Student Coalition!"
 TRK_election_events.11.b: "Yurizono Seia of Sanctus!"
 TRK_election_events.11.c: "Kirifuji Nagisa of Filius!"
 TRK_election_events.11.d: "Utazumi Sakurako of the Sisterhood!"
 TRK_election_events.11.e: "Message from the Developer"

 TRK_election_events.12.t: "Host Inauguration Speech"
 TRK_election_events.12.desc.hanako: "\"Uhuhu, I can't believe you actually chose a girl like me… Host of Trinity… Oh, just hearing it makes me feel a bit fluttery, doesn't it?\"\n\nUrawa Hanako and the Student Coalition have won the citizens' choice over other factions.\n\nUrawa Hanako is an individual with reformist and progressive tendencies. She has long held deep dissatisfaction with the old ways of Trinity. With Mika's rise to power, the situation reached its limit, and eventually, Hanako had no choice but to leave Trinity and go into hiding.\n\nHowever, a turning point arrived. After the defeat, the Gehenna Academy military administration began, and elections were held in Trinity. In this change, Hanako discovered new possibilities. She came to harbor hope that Trinity, too, could change.\n\nNow, having gained the trust and support of Trinity students to take on the role of Host, a new future unfolds before her. The dark and stifling past of Trinity, which was like a viper's den, will now disappear into history."
 TRK_election_events.12.a: "Congratulations, Urawa Hanako-san!"
 TRK_election_events.12.desc.seia: "\"The fact that you chose me means you trust me that much. Fufu. I shall try to live up to those expectations.\"\n\nYurizono Seia and the Sanctus Faction have won the citizens' choice over other factions.\n\nYurizono Seia possesses both progressive and conservative aspects simultaneously. It is not easy to accurately define her ideology. However, one thing is clear: no one can deny that she is reformist. To newly transform Trinity, she will persuade others and compromise. If necessary, she will not hesitate to push forward strongly.\n\nWhat kind of Trinity is she trying to build? It is difficult to even imagine. Her unique, eccentric personality might even be reflected in national policy. But one thing is certain: a new Host has been elected, and the citizens are satisfied with that choice.\n\nTrinity's change has now begun. Whether that change will seep in slowly or sweep through rapidly is something no one can know."
 TRK_election_events.12.b: "Congratulations, Yurizono Seia-san!"
 TRK_election_events.12.desc.nagisa: "\"Your precious trust has gathered to give me another chance. The smile I see on your faces now that the fog of doubt has cleared... I promise that I will fulfill my duties as Host so that it never breaks.\"\n\nKirifuji Nagisa and the Filius Faction have won the citizens' choice over other factions.\n\nKirifuji Nagisa is an individual who pursues the stability and gradual reform of Trinity. Her leadership and charisma, which led negotiations while being compromising, were the reasons Trinity could survive even through the transition incident. Although she could not prevent Mika's coup and the tragedy that followed, her dedication shown in the process became a heroic narrative. This led to the result of her being elected in the post-war election.\n\nTrinity will regain the stability it had before Misono Mika. Trinity students were exhausted by chaos and wanted to return to normalcy. That desire elected Kirifuji Nagisa. Nagisa's practical approach will bring sustainable development to Trinity on a stable foundation. Cautious reform, rather than radical change, is what Trinity needs right now."
 TRK_election_events.12.c: "Congratulations, Kirifuji Nagisa-san!"
 TRK_election_events.12.desc.sakurako: "\"In the past, our Sisterhood conspired with wrongful authority and became a shadow that suppressed your freedom and forced silence. Despite those ineradicable transgressions and infamy, I humbly accept your will in entrusting me with this heavy calling. Now, as Host, I will serve from the lowest place, taking your voices as my scripture rather than the dogmatism of the past....\"\n\nUtazumi Sakurako and the Sisterhood have won the citizens' choice over other factions. The Sisterhood, which was Misono Mika's shadow, has once again taken power. Though they were once the shadow of the government, they have now come forward proudly before the public, bearing the karma of the past.\n\nSakurako seeks to protect, maintain, and strengthen religious values in the changing situation. Of course, she does not advocate this without flexibility. General"

 TRK_election_events.13.t: "£GFX_BA_star 3 Selection Recruitment!"
 TRK_election_events.13.desc: "§BSelect a student after purchasing a ★3 selection ticket.§!\nYou can select and recruit a student from the Selectable Student menu before the ticket expires.\n£white_dot Selecting a student you already have will convert them into Eligma and that student's Eleph."
 TRK_election_events.13.a: "Urawa Hanako"
 TRK_election_events.13.b: "Yurizono Seia"
 TRK_election_events.13.c: "Kirifuji Nagisa"
 TRK_election_events.13.d: "Utazumi Sakurako"

 TRK_election_events.t.14: "[GetYear] [ROOT.GetName] Election"
 TRK_election_events.desc.14: "The term of Host [ROOT.GetLeader] has ended. An election will be held immediately, and the winner will perform Host duties after a short handover period of about one month. When the new charter was written previously, the terms of the Host and Tea Party executives were limited to 4 years, and the Host and Tea Party elections are scheduled to proceed simultaneously."
 TRK_election_events.a.14: "Urawa Hanako of the Student Coalition!"
 TRK_election_events.b.14: "Yurizono Seia of the Sanctus Faction!"
 TRK_election_events.c.14: "Kirifuji Nagisa of the Filius Faction!"

 TRK_election_events.t.15: "[GetYear] [ROOT.GetAdjective] Election"
 TRK_election_events.desc.15: "After Yurizono Seia's reforms, the Tea Party adopted a new system: the parliamentary cabinet system. Now, each faction and party of Trinity General Academy will field their own candidates to contest the election. Citizens will cast their votes for their desired candidate or party, and the elected candidates will form a coalition to lead Trinity. This was a groundbreaking change to disperse power that was previously concentrated in the individual Host and to operate Trinity in a more democratic way. No longer does one person's decision sway everything, and diverse voices can be reflected in the political process."
 TRK_election_events.a.15: "Urawa Hanako of the Student Coalition!"

 # 풍미 이벤트 (Flavor Events)
 TRK_flavor_events.1.t: "What was the mistake of 1936?"
 TRK_flavor_events.1.desc: "From an unprecedented large-scale incident, the attempted assassination of Yurizono Seia, the election of Misono Mika as Host, the 5th revision of the Trinity General Academy Charter, to the war with Gehenna—the misfortune of Trinity General Academy began with Misono Mika and ended with Misono Mika. However, the legacy left by Mika and those terrorists has sickened all of Trinity, and students no longer trust the Tea Party, feeling only distrust. Furthermore, the resistance of the remaining Pater Faction executives is causing students to spread crude conspiracy theories throughout Trinity, such as there being a hidden power behind the scenes, that the Filius and Sanctus factions hindered us, or that the Justice Task Force was not faithful.\n\nHowever, we have gained an opportunity to set history right once again. Of course, it is an opportunity created not by our own strength but under the surveillance of external forces. That said, we should not be complacent with reality. Although we are an academy under the surveillance of the Gehenna military government, we must prevent a case like Misono Mika's from happening again. This is not a choice, but a mission bestowed by the era."
 TRK_flavor_events.1.a: "\"Even staying at peace isn't exactly easy, is it?\""
 
 TRK_flavor_events.2.t: "The Future of the Sanctus Faction"
 TRK_flavor_events.2.desc: "Seia woke up, and under her leadership, the Sanctus Faction was undergoing a reconstruction. In the process of rebuilding the party, as Seia, her followers, and some executives and elders with progressive tendencies joined, the Sanctus Faction was regaining its appearance from before Misono Mika.\n\nSeia, whose eyes to see the future had closed since the attempted assassination, was haunted by an inferiority complex, feeling that she was useless now that her prophetic ability had disappeared. However, while persuading elders and progressive executives and running around in person during the process of rebuilding the faction, she experienced various events and eventually regained her self-esteem, and her previous cynical and pessimistic attitude was completely cured.\n\nThe Sanctus Faction gained a massive ally: the Remedy Knight, with Aomori Mine as its captain. The deal with Aomori Mine was enough to bring the two together, and now the two factions have come to need each other. This alliance may not last forever, but it will be strong for the time being."
 TRK_flavor_events.2.a: "\"In this way, all paths are destined to lead to one.\""
 
 TRK_flavor_events.3.t: "Urawa Hanako Resumes Activities"
 TRK_flavor_events.3.desc: "She, who had not been seen since Misono Mika took power, has appeared once again. Of course, she appeared in a new revealing outfit true to her style, and a glimpse of daily life was shown again as Shimoe Koharu subdued her.\n\nWhat exactly is the reason she is resuming her activities? Shimoe Koharu, who was somewhat close to her, asked Hanako several times but received no clear answer. However, if we combine recent events, some sort of conclusion might be visible. It is unknown whether she is aiming for the Host position or has other schemes. She was originally extraordinary, so it seems difficult for anyone to truly know that girl's heart."
 TRK_flavor_events.3.a: "A sincere wish"

 TRK_flavor_events.4.t: "The Conduct of a Sister"
 TRK_flavor_events.4.desc: "The Sisterhood. Where should one begin to describe them? If one were to find the faction with the most ambiguous position in Trinity currently, the Sisterhood would be the first to come to mind. The sisters, who compromised with Misono Mika and became the Tea Party's pawns, are now being despised by the citizens and those who believe in Trinity Christianity.\n\nAfter the defeat, the Sisterhood still shows its robustness, backed by the powerful force of Trinity Christianity. But what can they do? They have come too far to return to the way things were. At the very least, it will take a long time to refresh the Sisterhood's image."
 TRK_flavor_events.4.a: "...Since I've already compromised with sin myself, haven't I?"

 TRK_flavor_events.5.t: "'Host' Urawa Hanako"
 TRK_flavor_events.5.desc: "\"Host-nim, here is the schedule for the ministerial meeting.\"\n\n\"Oh my, to bring it to me personally. You're truly diligent.\"\n\n\"Host-nim, here is the report on current issues.\"\n\n\"Ah, I was just waiting for that. Thank you.\"\n\nAfter the business-like conversation and the door closed, the perfect smile that had been on Urawa Hanako's lips faded. Since being elected Host, her daily life had been spinning without a moment to breathe.\n\nShe was prepared to some extent, but the reality was more than she imagined. Endless stacks of approval documents and protocol events. She missed the times when she could throw off this suffocating uniform and all these obligations and leisurely stroll through the night streets without a single stitch on.\n\nHanako rested her chin on her hand and looked out the window. People remember her only as an inscrutable genius or a weirdo who enjoys embarrassing jokes. The inner voice that truly wants to be understood has nowhere to reach."
 TRK_flavor_events.5.a: "A girl difficult to convey"

 # 뉴스 이벤트 (News Events)
 TRK_news_events_title.1: "Urawa Hanako Elected as Tea Party Host"
 TRK_news_events_title.2: "Yurizono Seia Elected as Tea Party Host"
 TRK_news_events_title.3: "Kirifuji Nagisa Elected as Tea Party Host"
 TRK_news_events_title.4: "Utazumi Sakurako Elected as Tea Party Host"
 TRK_news_events_desc.1: "In the first free election held in Trinity, candidate Urawa Hanako of the Student Coalition has been elected. This is a historic moment reflecting the public will in the presidential election held after the defeat of Misono Mika.\n\nPresident-elect Urawa Hanako promised the reform of Trinity. In her speech, she vowed that cases like Mika's would never be repeated. She also expressed her ambition to create a truly free academy.\n\nOther candidates also congratulated President-elect Urawa Hanako. With similar results in the general election, Hanako's reforms seem unlikely to lose momentum."
 TRK_news_events_desc.2: "In the first free election held in Trinity, candidate Yurizono Seia of the Sanctus Faction has been elected. Following the defeat of Misono Mika, a candidate from the Tea Party has once again been chosen in the presidential election.\n\nSeia heralded a transformation for Trinity. Through her speech, she shared her vision and showed her will for transformation while reflecting on the past. Since the Sanctus Faction also recorded a high vote share over other factions in the general election, her plans are expected to proceed without a hitch.\n\nOther candidates also congratulated President-elect Yurizono Seia. Time will tell whether Trinity's change will sweep through rapidly or proceed gradually."
 TRK_news_events_desc.3: "In the first free election held in Trinity, candidate Kirifuji Nagisa of the Filius Faction has been elected. Following the defeat of Misono Mika, a candidate from the Tea Party has once again been chosen in the presidential election.\n\nKirifuji Nagisa emphasized the gradual change of Trinity. She repeatedly stressed a practical approach in line with a changing world. She also conveyed a message through her speech that we must reflect on the past and move toward the future.\n\nIn the general election, the Filius Faction also recorded a high vote share, surpassing other factions. Other candidates also congratulated President-elect Kirifuji Nagisa."
 TRK_news_events_desc.4: "In the first free election held in Trinity, candidate Utazumi Sakurako of the Sisterhood has been elected. Although she bore the stigma of cooperating with Misono Mika, she was nonetheless elected supported by the public will.\n\nPresident-elect Utazumi Sakurako emphasized in her speech that conservative values should be cherished. She also made frequent mentions related to Trinity Christianity. Considering what kind of group the Sisterhood originally was, this is a natural course of action.\n\nIn the general election, the Sisterhood also recorded a high vote share, surpassing other factions. Other candidates also congratulated President-elect Utazumi Sakurako."
 TRK_news_events.1.a: "It is the will of the citizens!"
 TRK_news_events.1.b: "Watch the political process carefully."
 TRK_news_events.1.c: "Congratulations on your inauguration as Host!"
 TRK_news_events.1.d: "May there be mutual respect."

