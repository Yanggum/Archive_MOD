 # 결정 (Decisions) 및 카테고리
 TRK_election_campaign_cat: "Trinity's First Election"
 TRK_election_campaign_cat_desc: "A new charter has been revised, and Trinity held a free election to select the subsequent Host. This election holds great significance in that it is the first free election held since Misono Mika. In this election, Trinity's devastated representative democracy will be set right.\n\nCurrently, [TRK_election_potent]  ([?TRK_SU_var|C0], [?TRK_ST_var|O0], [?TRK_FI_var|Y0])"
 TRK_eden_collapse_decision_category: "Collapse of the Eden Administrative Body"
 TRK_eden_collapse_decision_category_desc: "The Eden Administrative Body was a Trinity military administration by Gehenna, but the Gehenna government completely collapsed before the military administration could be completed. As it becomes clear that the Gehenna military administration over Trinity can no longer be maintained, Gehenna bureaucrats in the Eden Administrative Body are discussing integration with us. Since their central government has collapsed, there is no possibility of them resisting us."
 TRK_eden_collapse_decision: "Handover of Jurisdiction"
 TRK_eden_collapse_decision_desc: "Take over jurisdiction from the military administration. [TRK.GetLeader] will sign the treaty."
 # 지도자 이력
 TRK_Urawa_Hanako_leader_desc: "A girl who became nothing because she could become anything. If one were to express Urawa Hanako in one sentence, such a sentence would be fitting. However, what Misono Mika left behind was enough to touch the deep heart of the girl."
 TRK_government_general_leader_desc: "The Gehenna-Trinity War ended in Trinity's defeat, and the territory Trinity used to govern is now under the rule of Gehenna Academy. The Gehenna military administration is stationed in the central district, looking for local collaborators."
 KPD_thalman_joke_leader_desc: "§YBirth:§! §LApril 16, 1886, Hamburg, German Empire§!\n§YBiography:§! §LThe question 'What does it mean that Thalmann backwards is Mantel?' is actually a question while not being a question; it's an attempt to find meaning while simultaneously being a gesture that quietly pushes the concept of meaning itself aside, and even if you don't see it that way, it doesn't matter at all, but in that it can be seen that way if you bother to look, this sentence has already fulfilled its role. The word Mantel is just the result of flipping Thalmann, but the act of flipping itself makes us expect something, and that expectation gives birth to thought, and thought pretends to be meaning but is actually just thought, so the more we try to go further here, the more the very idea of where we were going in the first place becomes blurred. At this point, doubts may arise as to whether distinctions like Thal and mann, front and back, beginning and end are even necessary, but those doubts too, if dug into deeply, quickly give way to other doubts, and so the doubts greet each other and scatter as if nothing happened. What remains in the end is the afterimage of the word, the length of the sentence, and a feeling that this text seems to be saying something but is actually saying nothing, yet in that it's okay even if you don't feel that, it could be said to be quite free. So, while the fact that Thalmann backwards is Mantel remains a fact, what that fact means is not important, and the fact that it's not important feels subtly important, and then you reach a non-conclusion that there's no need to even bother holding onto such a feeling. The talk has grown long like this, but the subject is still avoiding being somewhere, and the fact that the sentence can continue even if you don't bother to catch it might be the most certain characteristic of this sentence.§!"
