# National Spirits
KOR_cheonggye_idea: "Failure of the Aquatic Pest Eradication Project"
KOR_cheonggye_idea_desc: "The supernatural phenomena caused by the Great Shift have heavily impacted the city of Seoul in [ROOT.GetName]. The man-eating crabs and man-eating piranhas that began appearing in Cheonggyecheon effectively halted the development of the capital after 1935. Ugaki Kazushige, the Governor-General of Korea at the time, failed to exterminate the wildlife driven into a frenzy by the Great Shift, only resulting in meaningless casualties.\n\nThe Government-General of Korea was unable to cope with the devastation of Seoul caused by the Great Shift's influence. The burden of resolving the resulting economic losses and delayed industrial development has been left to the new government and [ROOT.GetLeader]."

KOR_two_languages_idea: "Bilingual System"
KOR_two_languages_idea_desc: "Starting from 1910, the year the Korean Empire fell, bureaucrats on the Korean peninsula were replaced by Japanese, and a large number of Japanese people migrated to the peninsula. Due to this rapid population shift, our society has formed a bilingual system. Official documents are written and used in Japanese, and local police chiefs and bureaucrats are still comprised of Japanese individuals.\n\nShould the [ROOT.GetAdjective] people learn both languages for the sake of harmony? Or shall we collapse this complex bilingual system by expelling the Japanese?"

KOR_two_languages_weak_idea: "Bilingual System"
KOR_two_languages_weak_idea_desc: "Starting from 1910, the year the Korean Empire fell, bureaucrats on the Korean peninsula were replaced by Japanese, and a large number of Japanese people migrated to the peninsula. Due to this rapid population shift, our society has formed a bilingual system.\n\nThe idealist Lyuh Woon-hyung believes that harmony and peace can be achieved if the Japanese remain in Korean society. Whether this idealistic experiment will succeed or create strife lasting more than a generation will only be known in the decades to come."
