   #Resistance
 FRA_resistance_of_locals_modifier: "Resistance of the Colonials"
 FRA_resistance_of_locals_modifier_desc: "Since the Barbary pirates of Algiers were subjugated in 1830, colonies spanning three continents have laid the foundation of today's glorious France. However, the struggle to win this is positioned exactly opposite to the modifier 'noble.' The Tricolour of the French Empire (Empire français) hoisted in every city on the continent merely took root on scattered blood. The Ministry of Colonies (Ministère des Colonies) massacred the natives who rebelled against us, split their relationships, and built a centralized colonial system by dividing them. Even though a hundred years have passed, West Africa and the tens of millions of subjects we rule always try to escape the shadow of the Latins. Hanoi, Brazzaville, Dakar, Casablanca... even in Algiers. As long as French national power was strong, the French army was prepared to crush any rebellion. But the situation has changed, the City of Light, Paris, has fallen into the hands of the enemy, and the 'French government' is merely a government-in-exile remaining in the Algiers Governor-General. Now that the situation has changed, this continent has become more terrifying than anything else. We must hold the reins tightly so as not to fall from this precariousness!"


 FRA_revolution_nationale: "National Revolution"
 FRA_revolution_nationale_desc: "$FRA_pet.6.d$"
 FRA_revolution_nationale_charles_de_gaulle_1: "National Revolution"
 FRA_revolution_nationale_charles_de_gaulle_1_desc:0 "Pétain's 'National Revolution' was merely a shackle created by old men soaked in defeatism in a secret room. However, the new revolution led by Charles de Gaulle is different. This is not an imposition from the top down, but the hot shouting itself emitted by tens of thousands of crowds gathered in the street. Frenchmen refused to be slaves! Our revolution will be the most dynamic and great 'national resistance', where all men and women of this land become one giant wave and sweep away the invaders."
 FRA_revolution_nationale_maurice_gamelin_1: "National Revolution"
 FRA_revolution_nationale_maurice_gamelin_1_desc:0 "The arbitrariness and oppression committed under the name of 'National Revolution' suffocated the true spirit of France, 'Liberty, Equality, Fraternity'. Marshal Maurice Gamelin reflects on the arrogance of the military stepping to the front of politics to try to remodel the nation. The true revolution is not creating something new, but returning to the constitutional spirit of 1875 and the values of the Republic that we lost. This 'National Revolution' will be established on the code of laws, not on combat boots, and victory will be won through the voluntary discipline and devotion of awakened citizens, not the command of a dictator."

