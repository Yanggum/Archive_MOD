 #France 
 FRA_country_intro_header: "§4The Country of Brilliant Culture and Indomitability§!"
 FRA_country_intro_content:0 "France has created a long history of resistance and liberty, equality, and fraternity, starting from the French Revolution and passing through the July Revolution, the February Revolution, and the Third Republic. This historical background of France is a source of great pride for the French and has also made it difficult for them to always escape political chaos.\n\nThe pride of the French reached its peak as they defeated the German Empire in the Great War and seized victory. After their honorable victory, French society began to develop again, overcoming its wounds. It rebuilt the northeast, which suffered massive damage, and led a major role in the world order.\n\nSince the Great Depression that originated in the United States, France has faced a giant recession. France continued to move away from all sorts of positive modifiers such as brilliance, dazzlingness, and beauty, and the confusing social aspect was reflected in politics as it was, becoming a momentum for the growth of socialism, fascism, and monarchists. This kind of recession gave the French people a great sense of frustration. However, such frustration did not make them give up. In the era of darkness, those with indomitable will have the will and strength to overcome it.\n\nAs we entered 1935, France had to fight a war with those it had encountered for the first time in history. Against the outsider beings called Kivotos, the French army, government, and people fought with all their might. However, France fell far short of their technological and combat power, and as the confusing political situation and power struggle loosened their defense, all of France fell into the hands of Kivotos, and figures from the government and military faced a great crisis as they fled into exile in North Africa.\n\nBut the French did not submit. Resistance is organized in various parts of the French mainland and is still continuing to resist against the outsider beings, and the French government-in-exile in North Africa is although in a slump, is still seeking ways to recover the mainland. And the French government-in-exile has enough will to fight until the end and finally win, liberate the people from the outsider forces, and send many people to their homes. All they need is to cultivate the capabilities of the government-in-exile itself.\n\nThe seriously divided government since the exile is blurring our purpose. Nevertheless, France will never submit.\n\n§YDevelopment : AfterImage, SKSKIe"
 FRA_guide:0 "[FRA_philippe_petain.getname]'s Leadership\n\n£white_dot Stabilize Africa.\n£white_dot Expand national capability through fast industrialization.\n£white_dot Reclaim the stolen hometown soil.\n£white_dot Restore the spirit of France from the incompetent and corrupt democratic forces."
