 FRA_prov_event.45.c:0 "Support the reconstruction of the colonies."
 FRA_prov_event.47.t: "French Social Party"
 FRA_prov_event.47.d:0 "A right-wing veteran-based group famous for the name 'Cross of Fire' by de la Rocque has organized an extra-political paramilitary organization for the recovery of Algeria. Originally enjoying support from European settlers in Algeria, they are currently operating under the name 'French Social Party' and are committing terrorism and direct action against anti-government actions opposing French rule in Algeria. They are pro-government, but can activate their internal fascist mechanisms at any time."
 FRA_prov_event.47.a: "Are they patriots?"
 FRA_prov_event.50.t: "Activities of the People's Party"
 FRA_prov_event.50.d: "Supported by external aid of suspicious origin, the general strike is reorganizing its organization."
 FRA_prov_event.50.a: "Damn it!"
 FRA_prov_event.51.t: "A Specter"
 FRA_prov_event.51.d: "The French Communist Party was a product of the interwar French socialist movement and maintained a distinct red hue politically, but after the riots of 1934, it adopted a joint struggle line with the SFIO and served as the left wing of the Popular Front. However, through the Great Transfer, the government and military 'threw the nation to the enemy' with severe incompetence, and social elites, financial capitalists, corporations, politicians, and military officers went into exile in North Africa. In contrast to them, however, the French Communist Party is in solidarity with the workers of large cities, organizing resistance against the authoritarian regime of [MIL.getadjective] and leading resistance movements, while on the other hand strongly protesting against the reactionary rule of the French government-in-exile.\n\nIn this situation, the North African socialist movement is being organized around the 'French General Confederation of Labour (CGT)' instead of the French Communist Party, which is focusing on mainland resistance. They are gathering the laboring masses and labor movement in one direction and rallying the mass movement against the government-in-exile, but they also show internal disunity, such as conflict between the North African independence movement faction and the French revanchist faction."
 FRA_prov_event.51.a: "In any case, they will be under constant surveillance."
 FRA_prov_event.52.t: "Situation of Colonial Administration"
 FRA_prov_event.52.d: "Since the exile of the French government, resistance to colonial rule has been strengthening across Africa. Security is first and foremost required for our colonial administration, and more extensive military intervention is inevitably necessary in protectorates like Morocco and Tunisia."
 FRA_prov_event.52.a: "Let's carry out stabilization operations."
 FRA_prov_event.53.t: "Naval Damage"
 FRA_prov_event.53.d: "Damage to the long-neglected ships has accumulated to the point where they can no longer be operated. We must let go of the ships we can no longer use."
 FRA_prov_event.53.a: "Damn."
 FRA_prov_event.54.t: "Armed Rebellion in the Mountains"
 FRA_prov_event.54.d: "As anti-government activities in urban areas have significantly diminished, major anti-colonial resistance movements are moving to mountainous areas. They are conducting guerrilla warfare in the mountains, becoming a major headache for our security and regular forces."
 FRA_prov_event.54.a: "Cockroaches!"
 FRA_prov_event.55.t: "Refused Proposal"
 FRA_prov_event.55.d: "[FROM.GetName] has refused our request."
 FRA_prov_event.55.a: "A pity."
 FRA_prov_event.56.t:0 "French Proposal"
 FRA_prov_event.56.d:0 "France has asked for permission to attack across our border when they carry out their mainland recovery operation. If we help them, we will be able to exert influence over them after they reclaim the mainland."
 FRA_prov_event.56.a:0 "Let's help them."
 FRA_prov_event.56.b:0 "France cannot be trusted."
 FRA_prov_event.57.t: "Exiles"
 FRA_prov_event.57.d: "Numerous French people who were defeated on the French mainland are fleeing to North Africa. They are becoming a great burden to our economy and society, and we must find a way to accommodate them."
 FRA_prov_event.57.a: "What a headache."
 FRA_prov_event.58.t:0 "Exile of the Resistance"
 FRA_prov_event.58.d:0 "Local French people who were resisting on the mainland or were dissatisfied with our rule have crossed over to North Africa."
 FRA_prov_event.58.a:0 "Let them do as they wish."
 FRA_prov_event.58.b:0 "Don't report this kind of thing to me anymore!"
 FRA_prov_event.59.t:0 "French Demand for Naval Basing Rights"
 FRA_prov_event.60.t:0 "Accepted Proposal"
 FRA_prov_event.60.d:0 "[FROM.GetName] has accepted our request for help."
 FRA_prov_event.60.a:0 "Much appreciated."
 FRA_prov_event.61.t: "Role of the Ministry of Colonies"
 FRA_prov_event.61.d: "Now that the mainland administrative network has collapsed and the government is unstable due to the coup, administration in many colonial districts is not being carried out properly. Accordingly, it is necessary to restore and solidify colonial administration by expanding the autonomy of the Ministry of Colonies. \nSome argue that in order to prevent the collapse of the French colonial empire, the Ministry of Colonies should be allowed to urgently exercise military command rights for local security more aggressively. However, such measures could lead to an excessive expansion of the Ministry's authority and could become a spark for anti-colonial resistance movements in the long run.\nOn the other hand, parliamentarians oppose both plans, seeing administration through the Ministry of Colonies as an extension of the departure from democratic order and checks."
 FRA_prov_event.61.a: "Let's expand the autonomy of the Ministry of Colonies."
 FRA_prov_event.61.b: "We need to arm them."
 FRA_prov_event.61_tt: "All §YFrench West Africa§! states:\n"
 FRA_prov_event.61_tt_1: "All §YFrench Equatorial Africa§! states:\n"
 FRA_prov_event.62.t: "The Path of Military Reform"
 FRA_prov_event.62.d: "The disastrous defeat on the mainland in 1935 left us with many military legacies. We first remember how the powerful mechanical engineering of the outsiders ruthlessly annihilated French soldiers. Also, the enemies with halos could not be effectively attacked with standard bullets. In such an environment, the traditional 'trench defense followed by counterattack' tactic only bought time for them to reorganize their ranks and identify our weaknesses. In future military reforms, it is necessary to adopt tactics that can resolve these problems.\n\nAnother military task is that amphibious operations are required for the recovery operation as a geographical obstacle. Fortunately, we were able to gain a lot of understanding of large-scale amphibious operations in the last Gallipoli battle. The point of debate was whether to pour fire on a single point or to perform mainland combat with mass landings at major strongholds.\n\nOn the other hand, [FRA_charles_de_gaulle.getname] and his supporters are importantly mentioning the historic victory at the 'Siege of Eridu' near Paris during the last defeat. At that time, [FRA_charles_de_gaulle.getname] utilized armored divisions based on maneuver warfare doctrine to completely destroy the enemy's second stronghold, which was a major victory that allowed the government to hold out for a month. For this reason, they want to organize mobile units and perform maneuver warfare in the mainland recovery operation. The only problem is producing the armored divisions themselves."
 FRA_prov_event.62.a: "It is an era of military upheaval."
 FRA_prov_event.63.t: "[FRA.getadjective] Battleship Sale"
 FRA_prov_event.63.d: "The [FRA.getadjective] government has proposed the purchase of one battleship to us."
 FRA_prov_event.63.a: "A good proposal."
 FRA_prov_event.63.b: "We cannot afford it."
 FRA_prov_event.63_tt: "Transfer §Y1 battleship§! to [PREV.getflag][PREV.getadjective] side"
 FRA_prov_event.64.t: "[FROM.getadjective] Battleship Purchase"
 FRA_prov_event.64.d: "Perhaps because we sold it cheaply, the [FROM.getname] side readily purchased our battleship."
 FRA_prov_event.64.a: "It was all necessary."
 FRA_prov_event.65.t: "[FROM.getadjective] Refusal of Battleship Purchase"
 FRA_prov_event.65.d: "The [FROM.getname] side refused our purchase proposal."
 FRA_prov_event.65.a: "Unfortunate."
 
 FRA_prov_event.70.t: "[BEL.getadjective] Refusal"
 FRA_prov_event.70.d: "The [BEL.getname] diplomatic mission has stated that it is ultimately difficult to accept the overall contents of the meeting."
 FRA_prov_event.70.a: "A pity."
 cant_FRA_befriend_with_belgium_flag: "§Y@BEL[BEL.getadjective]§! side refused the meeting."

 FRA_prov_event.72.t:0 "Treatment of Students"
 FRA_prov_event.72.d:0 "As all meaningful resistance from the students has been suppressed, most of the students who crossed over from the other world are currently incarcerated in prison. We might be able to promote the stability of France and the world by eliminating them. However, since they are also human, we could also file for a proper trial. If a trial is held, most of them will be sent to re-education facilities because they are teenagers."
 FRA_prov_event.72.a:0 "Shoot them."
 FRA_prov_event.72.b:0 "Let's file for a trial."
 FRA_prov_event.73.t:0 "Selection of the Eiffel Tower Site"
 FRA_prov_event.73.d:0 "With the Millennium Tower occupying the site where the original Eiffel Tower stood, we have been forced to select a location for the newly built Eiffel Tower. In the midst of such discourse, the Algerians who helped our return want to attract the Eiffel Tower to Algiers. If we grant their request, they will surely be more loyal to France."
 FRA_prov_event.73.a:0 "Build it next to the Millennium Tower."
 FRA_prov_event.73.c:0 "Why build a remnant of the old era again?"
 FRA_prov_event.74.t:0 "Eiffel Tower Completed!"
 FRA_prov_event.74.d:0 "The Eiffel Tower has been completed."
 FRA_prov_event.74.a:0 "Long live France!"
 FRA_prov_event.75.t:0 "The Marshal's Decision"
 FRA_prov_event.75.d:0 "As the reconstruction process is slowly wrapping up, military forces have proposed to Pétain to organize a 'temporary' oligarchy for the stability and territorial recovery of France."
 FRA_prov_event.75.a:0 "France still needs Pétain."
 FRA_prov_event.75.b:0 "My mission is finished."
 FRA_prov_event.77.t:0 "French General Strike!"
 FRA_prov_event.77.d:0 "An organized general strike has occurred across France. Generators have stopped, and factories are not producing. Shops have closed, and numerous labor organizations are marching toward the campus!"
 FRA_prov_event.77.a:0 "Damn it."
 FRA_prov_event.77_tt:0 "\nIf the war within the French mainland does not end within §Y360 days§!, the leadership of both countries will proceed with peace negotiations."
 FRA_prov_event.78.t:0 "Millennium Tower Disposal"
 FRA_prov_event.78.d:0 "The Millennium Tower has fallen into our hands. We must decide how to handle this tower."
 FRA_prov_event.78.a:0 "Use it as an administrative office."
 FRA_prov_event.78.b:0 "It would be perfect for a research institution."
 FRA_prov_event.78.c:0 "We cannot leave remnants of the French crisis."
 FRA_prov_event.78.e:0 "Use it as a residential space."
 FRA_prov_event.76_tt:0 "§tThis is an option usable when under a communist regime.§!"
 FRA_prov_event.79.t:0 "Transportation Facilities"
 FRA_prov_event.79.d:0 "We have acquired technology to equip modern transportation facilities."
 FRA_prov_event.79.a:0 "Focus on the mainland."
 FRA_prov_event.79.b:0 "Install them in all territories."
 FRA_prov_event.80.t:0 "Engineering Technology"
 FRA_prov_event.80.d:0 "Research on engineering technology from the other world has been completed. Now we will apply this to actual fields."
 FRA_prov_event.80.a:0 "This is innovation."
 FRA_prov_event.81.t:0 "Secured Power Technology"
 FRA_prov_event.81.d:0 "Since various facilities based on electricity were used in the other world, we closely analyzed their power technology. As a result, we were able to acquire superior power technology."
 FRA_prov_event.81.a:0 "Industry will develop further."
 FRA_prov_event.82.t:0 "Analyzed Mechanical Devices"
 FRA_prov_event.82.d:0 "We have meticulously analyzed mechanical devices from the other world, and through this, we were able to obtain various engineering knowledge."
 FRA_prov_event.82.a:0 "Use it in the transportation field."
 FRA_prov_event.82.b:0 "How about applying it to the military industry?"
 FRA_prov_event.83.t:0 "Control of Communication Lines"
 FRA_prov_event.83.d:0 "We have seized control of the communication lines of the other world and finished investigating them."
 FRA_prov_event.83.a:0 "Now real-time conversation is possible across the country."
 FRA_prov_event.84.t:0 "Automation Process"
 FRA_prov_event.84.d:0 "We have succeeded in receiving automation technology from students of the other world called 'Millennium.' We will apply this primarily to the production field."
 FRA_prov_event.84.a:0 "Send all the unemployed to the army."
 FRA_prov_event.85.t:0 "Robot Production"
 FRA_prov_event.85.d:0 "After persistent research, we have become able to produce combat robots."
 FRA_prov_event.85.a:0 "Deploy them to actual combat immediately!"
 FRA_prov_event.87.t:0 "Millennium Technology Leak"
 FRA_prov_event.87.d:0 "Resistance organizations continuing resistance on the mainland infiltrated a laboratory in the Millennium Central District and secured some of Millennium's technology."
 FRA_prov_event.87.a:0 "Impressive."
 FRA_prov_event.88.t:0 "Secured Industrial Equipment"
 FRA_prov_event.88.d:0 "The resistance organization transmitted various industrial equipment secured while continuing resistance in the northeastern part of our mainland to the mainland."
 FRA_prov_event.88.a:0 "Useful."
 FRA_prov_event.89.t:0 "Large-scale Resistance Suppression"
 FRA_prov_event.89.d:0 "To escape Millennium's nationwide resistance suppression, some of the resistance members decided to give up resistance and join North Africa, going into exile."
 FRA_prov_event.89.a:0 "They will be a big help."
 FRA_prov_event.89_tt:0 "\n§YResistance strength§! on the mainland has §Rdecreased§!."
 FRA_prov_event.90.t:0 "Medium-scale Resistance Defection"
 FRA_prov_event.90.d:0 "To escape nationwide resistance suppression, some of the resistance organization members gave up resistance and fled to North Africa."
 FRA_prov_event.90.a:0 "Don't ever come back!"
 FRA_prov_event.91.t:0 "Railway Completion"
 FRA_prov_event.91.d:0 "The railway crossing the Sahara has been successfully completed."
 FRA_prov_event.91.a:0 "Industrialization of West Africa is not far off."
 FRA_prov_event.92.t:0 "Railway Boom"
 FRA_prov_event.92.d:0 "Thousands of items of goods are being loaded onto trains to travel between West and North Africa, crossing the Sahara. The construction of the Sahara railway was successful, and we can accelerate industrialization."
 FRA_prov_event.92.a:0 "It was a wise policy."
 FRA_prov_event.92_tt:0 "\nIf §YSahara Railway Expansion§! has been completed, you receive a better effect."
 FRA_prov_event.92_tt_1:0 "\n§YSahara Railway Expansion§! has been completed, receiving a better effect."
 FRA_prov_event.93.t:0 "Student Resistance"
 FRA_prov_event.93.d:0 "Outsider student forces remaining within the recovered mainland are still resisting our rule."
 FRA_prov_event.93.a:0 "What a headache."
 FRA_prov_event.94.t: "End of the North African General Strike"
 FRA_prov_event.94.d: "Through our government's efforts, the leadership of the strike committee resolved to dissolve themselves and ended the strike. Smoke is rising from factories again, and ships are docking at the piers." 
 FRA_prov_event.94.a: "That's a relief."
 FRA_prov_event.95.t: "Equatorial Rubber Collaborative Collection"
 FRA_prov_event.95.d: "The industrial department of [FRA.getname] is collecting rubber in cooperation with our companies based on the previous contents of the '[295.getname] Conference'."
 FRA_prov_event.95.a:0 "Very good."
 FRA_prov_event.96.t: "Belgian-style Colonial Administration"
 FRA_prov_event.96.d: "Belgium's policy for operating the Belgian Congo is evaluated as very efficient compared to other countries. This maintains high profitability through centralized administration, strong executive power, colonial rule by technocrats, the formation of collusive relationships between corporations and the state, and regional production specialization under close cooperation with missionary groups. We also need to test-operate such a system."
 FRA_prov_event.96.a: "Ingenious."
 FRA_prov_event.97.t:0 "Swiss Acceptance"
 FRA_prov_event.97.d:0 "Switzerland has submitted to us."
 FRA_prov_event.97.a:0 "A wise choice."
 FRA_prov_event.98.t:0 "Swiss Refusal"
 FRA_prov_event.98.d:0 "Switzerland has refused our request."
 FRA_prov_event.98.a:0 "Force is sometimes the best means."
 FRA_prov_event.99.t: "Saigon Agreement"
 FRA_prov_event.99.d: "It is becoming clear that we can no longer maintain Indochina. We will abandon the colony while preserving as much profit as possible through an orderly withdrawal."
 FRA_prov_event.99.a: "This is correct."
 FRA_prov_event.100.t: "Resistance Council"
 FRA_prov_event.100.d: "Proud French people are still continuing their resistance against the oppression of the outsiders within France. There are two major political forces rallying them: one is the communists who have organized resistance centered on cities, and the other is the fascists based on Catholic sentiment and rural communities. However, while the communists show strong cohesion centered on the French Communist Party and the SFIO, the fascists only show individual resistance due to the numerous fascist groups.\n\nWe will be able to maintain influence on the mainland by utilizing them." 
 FRA_prov_event.100.a:0 "Reliable."
 FRA_prov_event.101.t: "Student Treatment"
 FRA_prov_event.101.d:0 "The students still remaining in southern France threaten public order and social safety, and are dangerous beings who can become Millennium's henchmen at any time. We will be able to block the danger in advance by exercising strict control over them."
 FRA_prov_event.101.a:0 "Yes. Execute all of them."
 FRA_prov_event.101.b:0 "Locking them in prison is enough."
 FRA_prov_event.102.t:0 "French Naval Blockade"
 FRA_prov_event.102.d:0 "The French fleet has blocked our sea trade routes."
 FRA_prov_event.102.a:0 "Cowardly."
 FRA_prov_event.103.t:0 "Border Conflict Victory"
 FRA_prov_event.103.d:0 "We have clearly repelled the enemy."
 FRA_prov_event.103.a:0 "Hurrah!"
 FRA_prov_event.104.t:0 "Border Conflict Defeat"
 FRA_prov_event.104.d:0 "We have temporarily withdrawn from the conflict area. But this absolutely does not mean our total defeat."
 FRA_prov_event.104.a:0 "Oh no."
 FRA_prov_event.105.t:0 "Cold Night"
 FRA_prov_event.105.d:0 "The moderates have finally completely ousted the radicals from the military government."
 FRA_prov_event.105.a:0 "Stability has arrived."
 FRA_prov_event.106.t:0 "Cold Night"
 FRA_prov_event.106.d:0 "As the radicals ousted [ROOT.GetLeader], they have solidified a firm advantage within the military government."
 FRA_prov_event.106.a:0 "Let's move forward!"
 FRA_prov_event.107.t:0 "Vichy Meeting"
 FRA_prov_event.107.d:0 "We will hold diplomatic meetings with Millennium in Vichy. Our delegation has decided to request mutual non-aggression and mutual exchange."
 FRA_prov_event.107.a:0 "They have arrived."
 FRA_prov_event.108.t:0 "Vichy Meeting"
 FRA_prov_event.108.d:0 "At the request of France, we conducted a meeting with their delegations in Vichy. They requested mutual non-aggression and exchange, saying they want to mitigate and eventually completely dissolve the confrontation and for Millennium and France to coexist."
 FRA_prov_event.108.a:0 "Further confrontation won't be good for anyone."
 FRA_prov_event.108.b:0 "No, talking with them is a waste."
 FRA_prov_event.109.t:0 "Millennium Acceptance"
 FRA_prov_event.109.d:0 "Millennium has accepted our request."
 FRA_prov_event.109.a:0 "The beginning of peace."
 FRA_prov_event.110.t:0 "Millennium Refusal"
 FRA_prov_event.110.d:0 "The Millennium delegation refused our request."
 FRA_prov_event.110.a:0 "We are powerless."
 FRA_prov_event.111.t:0 "Request to Join the Entente"
 FRA_prov_event.111.d:0 "After the liberation of France, France invited us to a firm line to liberate all of Europe from the outsider beings. By joining the Entente, we will be able to be guaranteed security, economic, and social solidarity and development."
 FRA_prov_event.111.a:0 "Like it or not, cooperating with them is the best."
 FRA_prov_event.111.b:0 "Cooperation with them is not a very good idea."
 FRA_prov_event.112.t:0 "Entente Economic Development Agreement"
 FRA_prov_event.112.d:0 "The Entente side has proposed that we participate in the Economic Development Agreement."
 FRA_prov_event.112.a:0 "Let's receive their help."
 FRA_prov_event.112.b:0 "Only an independent economic system is meaningful."
 FRA_prov_event.113.t:0 "Entente Re-recovery Organization"
 FRA_prov_event.113.d:0 "The Entente side has proposed that we join the Re-recovery Organization."
 FRA_prov_event.113.a:0 "Military coordination with them is meaningful."
 FRA_prov_event.113.b:0 "It's still too early."
 FRA_prov_event.114.t:0 "Deal with Colonials"
 FRA_prov_event.114.d:0 "We decided to allow them to become independent if they participate in the recovery of the mainland and diligently follow the government's instructions."
 FRA_prov_event.114.a:0 "Look toward the Mediterranean!"
 FRA_prov_event.114.b:0 "But, we have already completed decolonization."
 FRA_prov_event.115.t:0 "Fulfillment of Promise"
 FRA_prov_event.115.d:0 "We must fulfill the promise we made to the colonials about 3 years ago."
 FRA_prov_event.115.a:0 "Let's keep the promise to them."
 FRA_prov_event.115.b:0 "Independence is too early. Let's compromise by establishing an autonomous district."
 FRA_prov_event.115.c:0 "The promise to them was inevitable. France still holds ownership of the regions!"
 FRA_prov_event.115.e:0 "Conduct a referendum on whether to participate in the French Union."
 FRA_prov_event.117.t: "Isolated Indochina"
 FRA_prov_event.117.d:0 "The fall of the United Kingdom and Japan's strengthening hegemony in East Asia are rapidly weakening our ties with the colony. On the other hand, in Indochina, the Indochinese Communist Party, led by independence and socialist forces, is gaining strength. We must keep them in check."
 FRA_prov_event.117.a:0 "Damn it."
 FRA_prov_event.117_tt:0 "§YColonial governments§! can §Gremain loyal§! to §YFrance§! or §Rstart an independence war§! through §Yfocuses§!. The §Rindependence war§! will §Yend§! if §YFrance§! loses §Ycontrol§! of §Yall of Indochina§!."
 FRA_prov_event.120.t:0 "Coup"
 FRA_prov_event.120.d:0 "Since the miserable defeat on the mainland, the cabinet has been immersed in the greatest sense of defeat. The military has declared a 'temporary' military administration until all of France is recaptured, citing the incompetence of the cabinet during the wartime situation and the division of the current cabinet which has made no progress since the exile. [FRA_philippe_petain.getname] was recommended as the chairman of the Provisional Military Committee, and he has announced the reorganization of the cabinet into a systematic military government after a one-month preparation period."
 FRA_prov_event.120.a:0 "[FRA_philippe_petain.getname] leads France!"
 FRA_prov_event.121.t:0 "Terrorism"
 FRA_prov_event.121.d:0 "As the number of exiles increased, the French government began to demolish existing Algerian settlements and install housing facilities for the exiles. However, this has brought about great anger from the Algerians, leading to some terrorism and forming a sense of security crisis."
 FRA_prov_event.121.a:0 "Increase police forces!"
 FRA_prov_event.122.t:0 "Faulty Construction"
 FRA_prov_event.122.d:0 "Constantly driving and exploiting workers never meant efficiency. A decline in labor productivity and loss of morale led back to a decline in quality, particularly with many faulty roads and buildings discovered in Algiers city, forcing the government to take temporary measures."
 FRA_prov_event.122.a:0 "It's just a minor problem."
 FRA_prov_event.123.t:0 "Bond Payment"
 FRA_prov_event.123.d:0 "Having decided to pay the defense bonds, we must fulfill the debt."
 FRA_prov_event.123.a:0 "Every transaction has a price."
 FRA_prov_event.124.t:0 "Additional Exile"
 FRA_prov_event.124.d:0 "Young people from the southeastern mainland, closest to the government-in-exile, are joining our army to participate in the great cause."
 FRA_prov_event.124.a:0 "Good."
 FRA_prov_event.125.t:0 "Promise Extension"
 FRA_prov_event.125.d:0 "With the war continuing, we must temporarily postpone the promise with the colonials. However, as the promise is repeatedly extended, the protests from the colonials will grow stronger."
 FRA_prov_event.125_tt:0 "\nThere is a limit to the colonials' patience. After this choice, it can be extended §Y[?FRA_promise_var]§! more times."
 FRA_prov_event.125.a:0 "They will also understand."
 FRA_prov_event.125.b:0 "Wait, how many times did we postpone it?"
 FRA_prov_event.126.t:0 "Stresa Front"
 FRA_prov_event.126.d:0 "Due to the invasion by outsider beings, the Republic, the United Kingdom, and Italy had no choice but to sign the Stresa Front. However, with the Republic currently in exile, we need to accept Italy's demands to maintain the alliance with them. Therefore, Pétain and the military government decided to remain silent about the Italian army's stationing in Nice and Savoy."
 FRA_prov_event.126.a:0 "It's an inevitable choice."
 FRA_prov_event.127.t:0 "Collapsed Underground Economy"
 FRA_prov_event.127.d:0 "Due to the new economic policy implemented in Millennium, it has become difficult to maintain an underground economy of scale. Accordingly, the government decided to slowly withdraw from businesses related to the underground economy."
 FRA_prov_event.127.a:0 "That's a shame."
 FRA_prov_event.128.t:0 "Collapsed Underground Economy"
 FRA_prov_event.128.d:0 "Thanks to the policy we newly implemented, the economy at the bottom of the academy collapsed, unable to withstand the change. Accordingly, we have become able to control the overall economy of the academy."
 FRA_prov_event.128.a:0 "Good news just in time."
 FRA_prov_event.129.t:0 "French Investment Request"
 FRA_prov_event.129.d:0 "The French ambassador has requested investment from us."
 FRA_prov_event.129.a:0 "Let's invest in them."
 FRA_prov_event.129.b:0 "They cannot be trusted."
 FRA_prov_event.130.t:0 "[FROM.getname] Acceptance"
 FRA_prov_event.130.d:0 "The [FROM.getname] ambassador accepted our investment request."
 FRA_prov_event.130.a:0 "Much appreciated."
 FRA_prov_event.131.t:0 "[FROM.getname] Refusal"
 FRA_prov_event.131.d:0 "The [FROM.getname] ambassador refused our investment request."
 FRA_prov_event.131.a:0 "Disappointing."
 FRA_prov_event.133.t:0 "Completed Resocialization"
 FRA_prov_event.133.d:0 "The resocialization program targeting existing Millennium students has been completed. We will be able to utilize some of the obedient re-educated students as officers again."
 FRA_prov_event.133.a:0 "Just as intended."
 FRA_prov_event.134.t:0 "Rising Fascism"
 FRA_prov_event.134.d:0 "With the National Union winning the election, it has become certain that fascist forces are being supported by the citizens. In this situation, the three branches leading French fascism have repeated cooperation and competition with each other until now, but they can no longer continue the former. Only the rapidly changing political landscape and God will decide who will completely lead this fascist movement."
 FRA_prov_event.134.a:0 "Only faith and harmony change France."
 FRA_prov_event.134.b:0 "Remember the distant glory!"
 FRA_prov_event.134.c:0 "The success of fascism must follow precedent."
 FRA_prov_event.135.t:0 "Mass Mobilization"
 FRA_prov_event.135.d:0 "Regardless of whether they are violent, hundreds and thousands of young and middle-aged people are coming out to the streets every day, repeating protests and riots. Even while this chaos continues, it is necessary to consider which form of the masses was mobilized the most to find the leadership of fascism."
 FRA_prov_event.135.a:0 "Veterans and soldiers"
 FRA_prov_event.135.b:0 "Monarchists seem to be the most numerous."
 FRA_prov_event.135.c:0 "Look at the thousands of workers!"
 FRA_prov_event.136.t:0 "Propaganda and Political Agenda"
 FRA_prov_event.136.d:0 "The sound of leaflets and loudspeakers is wrapping the city. This is because all French fascists are focusing on propaganda with the single thought that there is no opportunity if not now. However, it is necessary to find out which agenda attracts the most people's attention among the major political agendas that differ for each faction."
 FRA_prov_event.136.a:0 "There is no individual apart from God."
 FRA_prov_event.136.b:0 "Restoration of the monarchy solidifies France."
 FRA_prov_event.136.c:0 "Only class and labor can solve actual problems."
 FRA_prov_event.137.t:0 "Core of Parliamentarism"
 FRA_prov_event.137.d:0 "We have gathered enough support and capacity. All that remains is to confront parliamentarism head-on. Now it's just a matter of which force will lead the masses first."
 FRA_prov_event.137.a:0 "Cross of Fire!"
 FRA_prov_event.137.b:0 "Action Française acts like its name!"
 FRA_prov_event.137.c:0 "The Francist Movement has stepped forward!"
 FRA_prov_event.138.t:0 "Dawn"
 FRA_prov_event.138.d:0 "As the repeated power struggle reaches the moment of fascist regime transfer, its blurriness is erased. A single faction will suppress the other two and lead French fascism. However, this does not mean the disappearance of other fascist factions. French fascists can still cooperate with each other, and situations can always change."
 FRA_prov_event.138.a:0 "The Cross of Fire leads France!"
 FRA_prov_event.138.b:0 "Long live Action Française and the King of France!"
 FRA_prov_event.138.c:0 "Loyalty to the Francist Movement and orthodox fascists!"
 FRA_prov_event.139.t:0 "Enthusiasm"
 FRA_prov_event.139.d:0 "Even though the French Communist Party is in exile, they have achieved as radical and advanced a transformation as possible. Now it must go beyond changing and start creating."
 FRA_prov_event.139.a:0 "Invest in national defense."
 FRA_prov_event.139.b:0 "Strengthen industry."
 FRA_prov_event.140.t:0 "Underground Economy"
 FRA_prov_event.140.d:0 "While we have been unable to touch the economy, it seems the French people have built a giant invisible system for mainland recovery across the economy. We'll need to look into this later."
 FRA_prov_event.140.a:0 "Troubling."
 FRA_prov_event.141.t:0 "Escaping Capitalists!"
 FRA_prov_event.141.d:0 "Many capitalists within the current occupied areas are escaping Millennium to support [FRA.GetName]."
 FRA_prov_event.141.a:0 "There will be disruptions in production."
 FRA_prov_event.142.t:0 "French Peace Proposal"
 FRA_prov_event.142.d:0 "France has requested a ceasefire on the condition of permanently ceding Corsica to Italy."
 FRA_prov_event.142.a:0 "Finally, Corsica has returned to the embrace of the motherland!"
 FRA_prov_event.142.b:0 "They will also have to cede Tunisia!"
 FRA_prov_event.143.t:0 "[ITA.getName] Demands Tunisia"
 FRA_prov_event.143.d:0 "[ITA.getName] has notified that they must gain control over the Tunisia region for a complete ceasefire."
 FRA_prov_event.143.a:0 "We cannot grant their demand."
 FRA_prov_event.143.b:0 "The situation is urgent. Let's accept their demand."
 FRA_prov_event.144.t:0 "French Refusal"
 FRA_prov_event.144.d:0 "France refused to transfer control of Tunisia."
 FRA_prov_event.144.a:0 "They don't know the value of peace."
 FRA_prov_event.144.b:0 "We cannot understand their demand."
 FRA_prov_event.145.a:0 "Adieu pour toujour, Millenium.\n(Goodbye forever, Millennium.)"
 FRA_prov_event.145.t:0 "Execution of Yuuka"
 FRA_prov_event.145.d:0 "\"...Considering the clear infringement of the Republic's sovereignty, groundless anti-humanitarian acts, and the fact that the defendant was negligent and complicit in them, the matter is grave and must be dealt with by severe punishment. The court sentences the defendant as follows-.\"\n\nThe momentary sound made by the second hand hanging above the courtroom felt like eternity.\n\n\"Defendant Hayase Yuuka, death.\"\n\nThe blunt gavel struck three times in succession in the hard courtroom. Hayase Yuuka's stomach churned. However, rather than the death sentence itself, the baptism of cheers pouring from the gallery pained Yuuka more. What on earth did she do wrong? In the courtroom, Yuuka's very existence became a mistake. Even when she denied it, even when she shouted that there was no fault, it was not accepted. Every time, anger mixed with sobbing tormented her. From the beginning, the end of the story had already been decided. It just gave her time to think.\n\nWhile the old technological empire breathed its last, Yuuka was breathing heavily in the underground and darkness of Marseille. The execution was already confirmed. But how? Yuuka thought of all possible scenarios she could conceive. Since she had to avoid dying painfully as much as possible, Yuuka thought that if she was destined to die anyway, she wanted to pass away comfortably. Ironically, after the times spent praying to live passed, she prayed to die.\n\n\"It's raining.\" On the day Yuuka sat against the bars and lost her night's sleep, it was raining. Just like that day when Millennium was burned under the torch of blue freedom, it was raining on that day. Yuuka wondered how Rio had turned out, whether Noa had safely escaped and was alive, and if the troublemaker Koyuki was still locked up. She laughed. There hadn't been a hint of laughter for a month, but as she reached the end, the laughter she had lost came back. There were too many variables so she had given up on calculation long ago, but logic and reason seemed to already know the answer. The falling rain cooled the heat of the machine.\n\n\"Condemned No. 18, come out here!\"\n\nThe guard shouted, opening the iron bars. Yuuka looked at the clock on the wall. It was midnight. Sensing that her midnight had arrived, she felt a heavy fear that she was instinctively standing at the crossroads of life. Yuuka opened her firmly closed mouth in the guess that this conversation would be the last. The last conversation had to be more rational and logical than any other time, and had to be provable.\n\n\"What happened to the Seminar officers?\"\n\n\"...\"\n\nUnkindly, even when Yuuka twisted her words, confessed her faults, and sought forgiveness in her last conversation, the guard did not answer. It was quite unpleasant, but she had no other way. She slowly walked down the fierce corridor of the prison. She carefully looked at the rooms next to her with a sidelong glance, but what caught her eye was a succession of endless empty rooms. She had certainly entered this place with numerous other girls. But now those girls seemed to have hidden somewhere and were not seen. Where on earth did they go? The calculator on the verge of shredding began its final calculation.\n\nAfter walking for about ten-odd minutes, she stepped out of the prison's 20cm iron door. Of course, she hadn't entertained any hope that she would be able to live and get out, but she also inwardly came to expect the hope of life. However, harsh logic and reason did not let her dream of vain hope. Her hands were tied to the execution block outside.\n\n\"My time has finally come.\"\n\n\"Many have already died besides you. Don't think strange thoughts and think of a last wish.\"\n\n\"Before I die, please answer my words. That is my last wish. Where on earth did Noa, Rio, and Koyuki go?\"\n\n\"They're right here.\"\n\n\"What?\"\n\n\"I said they're right here. Right above the ground you're standing on.\"\n\nIt was nauseating. The most precious people she had briefly thought about had all died long ago. And in the same way as Yuuka, first. Yuuka imagined Noa struggling in pain because she didn't die at once, Rio accepting everything before being hit by a bullet, and Koyuki struggling in the face of death. Yuuka had also expected these scenes, but judging them to be actually so made it even more disgusting.\n\nThe sound of combat boots slowly approaching also made it difficult to calm her down. By her guess, they were the footsteps of ten people. Even if she could die 'without pain' at once, Yuuka did not want to arrive before death. She wanted to live, and wanted to continue a lingering life.\n\n\"Execute.\" said a man who, even at a glance, looked like a high-ranking officer, with a French army regulation cap pressed down. At his short word, the people in front of the firing squad became busy. Journalists were prepared, and the soldiers' guns were checked. Yuuka derived the conclusion that they would not let her go easily.\n\n\"Prepare to fire -\"\n\nYuuka's heart began to beat extremely fast. No matter where she looked, there was no exit to escape. Water that permeated into the machine was bound to break the machine.\n\n\"- Fire!\"\n\nHer eyes snapped shut. As the grim reaper swung the scythe, she prayed that she had died in an instant."
 FRA_prov_event.146.t:0 "Northern France Devastation"
 FRA_prov_event.146.d:0 "Endless street fighting and attacks and defenses changing dozens of times a day have devastated the urban areas of the north, including Paris."
 FRA_prov_event.146.a:0 "It's just a minor sacrifice."
 FRA_prov_event.147.t:0 "Administrative Confusion"
 FRA_prov_event.147.d:0 "As we regained the mainland, the vast mainland and numerous French people have come under our control. We will experience great confusion in policy implementation until we restore the existing administrative system."
 FRA_prov_event.147.a:0 "What a headache."
 FRA_prov_event.148.t:0 "Southern France Devastation"
 FRA_prov_event.148.d:0 "Continuous rural resistance and guerrilla warfare in the southern region, along with devastation operations, have devastated the southern rural areas."
 FRA_prov_event.149.t:0 "Paris Commune Commemoration"
 FRA_prov_event.149.d:0 "In 1871, Paris citizens who refused to submit to the defeat of the Franco-Prussian War and rose up against the bourgeois government established the Paris Commune and practiced modern socialism for three months while fighting against government forces. Although the bourgeois government forces, supported by Germany, finally annihilated the National Guard defending Paris and massacred numerous citizens, the fighting spirit of the revolution still remains.\n\nMarch 18th is Paris Commune Day and will be designated as a public holiday by the state from now on."
 FRA_prov_event.149.a:0 "Arise, you too!"
 FRA_prov_event.150.t:0 "Socialist Constitution of [GetYear]"
 FRA_prov_event.150.d:0 "Having overcome capitalist society, Socialist France has finally appeared through a peaceful constitutional amendment. The newly written socialist constitution of France includes contents such as public ownership of the means of production, extensive social security and state-responsible welfare, establishment of worker power through the three labor rights and industrial councils, and comprehensive prohibition of discrimination regardless of whether it is codified."
 FRA_prov_event.150.a:0 "Let's move toward Socialist France!"
 FRA_prov_event.151.t:0 "Women's Liberationism"
 FRA_prov_event.151.d:0 "The mainstream of feminist thought until now has been 'liberal feminism.' However, such feminism has the limit of having claimed the advancement of women's rights without overcoming the inherent contradictions of capitalism and liberalism, and France is a rights-backward country that has not even completely achieved the policies claimed in liberal feminism.\n\nHowever, we will move toward an open society where domestic labor and care labor forced by capitalism are overcome, gender discrimination in general social sectors such as wages, promotion, and military service is boldly abolished, and women's physical freedom is actively recognized, guaranteeing abortion rights."
 FRA_prov_event.151.a:0 "Abolish discrimination!"
 FRA_prov_event.152.t:0 "Diversified Labor Unions"
 FRA_prov_event.152.d:0 "Labor unions generally work to promote the interests of members, but most of them have political orientations and operate in alliance with political parties.\n\nIn the midst of this, we will be able to strengthen the regime by implicitly supporting either a moderate reformist-leaning labor union or a radical-leaning labor union. Or, maintaining the government's neutrality would also be possible."
 FRA_prov_event.152.a:0 "Let's support moderate labor unions."
 FRA_prov_event.152.b:0 "Let's support radical-leaning socialist labor unions."
 FRA_prov_event.152.c:0 "It is desirable to maintain neutrality."
 FRA_prov_event.153.t:0 "Eastern France Devastation"
 FRA_prov_event.153.d:0 "Guerrilla warfare fought with limited visibility in mountains and forests has devastated eastern France to the point where the mining industry concentrated in the east can no longer function."

 FRA_recover.1.t:0 "Awarding Medals to Soldiers"
 FRA_recover.1.d:0 "The provisional committee organized after the declaration of liberation has decided to award medals to all those who shed blood and lost their lives to protect family, nation, and motherland in the war of recovery."
 FRA_recover.1.a:0 "They are all proud citizens."
 FRA_recover.3.t:0 "Spanish Influence"
 FRA_recover.3.d:0 "[SPR.getname] has demanded support for the reconstruction of its industry devastated by civil war as the price for helping us in the war of recovery."
 FRA_recover.3.a:0 "We must keep the promise."
 FRA_recover.4.t:0 "Dissolution of the Resistance"
 FRA_recover.4.d:0 "As our mainland is recovered, the Resistance will be reorganized into our regular army and dissolved."
 FRA_recover.4.a:0 "Everyone worked hard all this time."
 FRA_recover.5.t:0 "Handling Collaborators"
 FRA_recover.5.d:0 "We must deal with the ordinary citizens who cooperated with the outsiders after the Great Transfer."
 FRA_recover.5.a:0 "They will all be punished according to the law."
 FRA_recover.5.b:0 "They also must have had no choice. Instead, let's exclude them from the public sphere."
 FRA_recover.6.t:0 "Ownership Dispute"
 FRA_recover.6.d:0 "While many citizens were following the exile to North Africa, others remaining on the mainland were occupying the land and property they left behind. However, as the exiles return to the mainland, we must resolve the ownership dispute over these properties. Ways to solve this include returning property to the exiles, or recognizing the new owners while compensating the exiles for a significant portion of the lost property."
 FRA_recover.6.a:0 "Return property to the exiles."
 FRA_recover.6.b:0 "Compensate the exiles."

 FRA_ex_event.1.t:0 "Algerian Crisis"
 FRA_ex_event.1.d:0 "It has been several months since anger toward the home country for not keeping its promise covered the streets of Algiers. Algerians will begin movements criticizing and opposing the home country."
 FRA_ex_event.1.a:0 "They don't know their place."

 FRA_ex_event.3.t:0 "Sporadic Assemblies in Algeria"
 FRA_ex_event.3.d:0 "Shocking news has flown in from the security authorities. Starting from sunrise, assemblies of Arabs began in many places, including old stadiums and theaters, and within a few hours, the streets were filled with protesters. Algiers has already become a chaos.\n\nMost members of the cabinet say that the current situation stems from the mobilization order that came into effect right after the defeat. The state of the nation, whose share of the domestic economy has extremely decreased, has begun to destroy their lives. Perhaps we are squeezing them too much.\n\nA government-level statement was announced, and we hope this will somewhat dampen the Arabs' dissatisfaction. However, some security authorities argue that a ban on assemblies should be issued to extinguish the spark as soon as possible. The cabinet is split in half, and the time for decision is approaching."
 FRA_ex_event.3.a:0 "Ban the assemblies!"
 FRA_ex_event.3.b:0 "They will quiet down on their own."
 FRA_ex_event.4.t:0 "Anti-colonial Assembly"
 FRA_ex_event.4.d:0 "Left-wing groups held a protest demanding the withdrawal of colonial policies and the issuance of French citizenship to Algerians."
 FRA_ex_event.4.a:0 "They do not think of the national interest."
 FRA_ex_event.4.b:0 "Maybe that is correct."
 FRA_ex_event.5.t:0 "Backlash from the Algerian Community"
 FRA_ex_event.5.d:0 "The Algerian community living in France has joined the anti-colonial discourse and is speaking out about Algerian autonomy."
 FRA_ex_event.5.a:0 "The situation is becoming increasingly serious."
 FRA_ex_event.5.b:0 "We can delay no longer. Let's grant their demands."
 FRA_ex_event.6.t:0 "Algerian Armed Struggle"
 FRA_ex_event.6.d:0 "Self-explanatory."
 FRA_ex_event.6.a:0 "Damn it."
 FRA_ex_event.7.t:0 "International Condemnation"
 FRA_ex_event.7.d:0 "Self-explanatory."
 FRA_ex_event.7.a:0 "If only we had suppressed their remarks..."
 FRA_ex_event.7.b:0 "What if we reach an agreement with the Algerian leadership?"
 FRA_ex_event.8.t:0 "Algerian General Strike"
 FRA_ex_event.8.d:0 "Algerians have gone on a general strike to push through their demands."
 FRA_ex_event.8.a:0 "They have truly crossed the line."
 FRA_ex_event.9.t:0 "Referendum?"
 FRA_ex_event.9.d:0 "As the general strike continues for several months, domestic anti-colonial groups and the leadership of the Algerian independence movement have proposed to solve the current problem through democratic means."
 FRA_ex_event.9.a:0 "Democracy is a luxury for savages."
 FRA_ex_event.9.b:0 "They are right."
 FRA_ex_event.10.t:0 "Constantine Agreement"
 FRA_ex_event.10.d:0 "The agreement in Constantine was successfully carried out, succeeding in obtaining many concessions from the Algerians on the premise of independence."
 FRA_ex_event.10.a:0 "This is the diplomacy of agreement."
 FRA_ex_event.11.t:0 "Algerian War of Independence"
 FRA_ex_event.11.d:0 "Just yesterday, Algiers City Hall was occupied by thousands of crowds and the Algerian flag was hoisted there. Algerian political leaders rallied paramilitary organizations and youth and launched a surprise attack on the French military base."
 FRA_ex_event.11.a:0 "What was bound to come has come."
 FRA_ex_event.12.t:0 "Arab Support for Algeria"
 FRA_ex_event.12.d:0 "Neighboring countries of Algeria, such as Morocco and Tunisia, are supporting Algerian independence."
 FRA_ex_event.12.a:0 "Damn it!"
 FRA_ex_event.13.t:0 "Italian Interference"
 FRA_ex_event.13.d:0 "Italy is supporting Algeria."
 FRA_ex_event.13.a:0 "You guys are next after Algeria!"
 FRA_ex_event.14.t:0 "Pervasive Anti-war Public Opinion"
 FRA_ex_event.14.d:0 "At a point where the country must be rebuilt after reclaiming the mainland, it is meaningless to waste resources in a meaningless war with Algeria, and there is no justification. Young people think it's unfair for them to go to war."
 FRA_ex_event.14.a:0 "Kids these days..."
 FRA_ex_event.15.t:0 "Liberation"
 FRA_ex_event.15.d:0 "[FRA_philippe_petain.getname] looked at the City of Light, which confused his memories.\n\nIt could be shaken but could not sink, and even if the city crumbled, the blue light could not be extinguished.\n\nThe city shines.\n\nIt is shining even though the iron triangular tower disappeared and a white glass palace took its place.\nTraces of the old Republic are significantly lost and the city, which seems to have more gray than black and brown roofs, is still shining.\nParis is a presence that stays by your side for a lifetime, like a movable feast.\n\nPétain moved. Together with others, he headed toward the historic Dôme church by the Seine. The church where citizens swarmed and procured rifles during the time of the revolution when the Tricolour was fluttering was functioning as a mausoleum where France's heroes sleep, both before and now.\n\nLes Invalides.\n\nPétain looked at the coffin. He looked at the largest coffin in Les Invalides, the house where the remains of the greatest general under the Tricolour, the greatest Emperor of the French Empire, reside.\n\nThe child of the Bonaparte family born in a Corsican village seized hegemony over Europe. Although it ultimately collapsed unable to overcome the Russian cold, the myth of the Emperor is still valid.\n\nA few years ago, Pétain, who had to abandon the homeland and run away at Christmas time, merely looked at the coffin. It was a scene unimaginable even just a few months ago. He hoped to return to the motherland, but there were times he thought he wouldn't return until he went into a coffin to sleep.\n\nPétain, who had been such, finally returned. Driving out the students with halos over their heads, he stepped on the ground again as the owner of the hexagonal homeland.\nPétain came out of Les Invalides. Numerous crowds, cheers. Fluttering Tricolours.\n\nThey were looking at Pétain, their Marshal. Parisians, Frenchmen, those of the old Republic were cheering. France was looking down at Pétain.\n\nPétain was overcome with emotion.\nHe tried to be calm, but he could not.\n\nThe Marshal shouted."
 FRA_ex_event.15.a:0 "'Vive La France!'"
 FRA_ex_event.16.t:0 "Left-wing Suppression"
 FRA_ex_event.16.d:0 "Despite suspending the parliament, left-wing figures centered around Léon Blum and Édouard Daladier still exert great influence in the political sphere. Particularly, Léon Blum criticized Pétain's military dictatorship, saying, \"What is this, if not a cruel moral betrayal, a treason against democracy, for him who was a war hero and a symbol of victory to suspend the parliament.\"\n\nAfter this statement, Pétain issued an arrest order for left-wing figures for the sake of national stability, under the pretext of plotting communist terrorism against the government and responsibility for the defeat in the Millennium-France war. Daladier and Blum, who were issuing anti-military dictatorship statements in Paris, were arrested on the spot, and leaders of various left-wing parties were imprisoned one after another.\n\nCurrently, a bill to ban left-wing parties is being discussed within the Reconstruction Committee, viewing the incident seriously."
 FRA_ex_event.16.a:0 "To protect France from left-wing attacks..."
 FRA_ex_event.17.t:0 "Military Service for the Resistance"
 FRA_ex_event.17.d:0 "Since we reclaimed the mainland, Resistance members across France have been investigated by our government, and most of them seem to have disarmed.\n\nWe will be able to easily obtain a well-trained large-scale army by putting guns back in their hands and organizing Resistance divisions to oppose threat forces in Europe after the mainland recovery."
 FRA_ex_event.17.a:0 "I think the name National Liberation Army would be good."
 FRA_ex_event.17.b:0 "No, we don't need an army, we need workers."
 FRA_ex_event.18.t:0 "Tank Production Factory"
 FRA_ex_event.18.d:0 "While recovering control of Millennium's industrial facilities and adapting to high technology, we secured control of a large-scale tank production factory planned by Millennium Science School.\n\nMost of the authority held by Millennium Science School has been suspended so the factory cannot be restarted, but we will be able to form divisions with these tanks."
 FRA_ex_event.18.a:0 "Good."

#French Decisions
 FRA_ALG_war:0 "Algerian Crisis"
 FRA_ALG_war_desc:0 "As France reclaimed the mainland, 'many' French people cheered, but 'a few' French people, namely the Algerians treated as uncivilized populations, could never cheer. France, which had promised independence to other colonials on the condition of cooperation in the war, refused independence for Algeria, presenting an interpretation that they belong to the French and that the Algerian region corresponds to the French mainland. Oppression is bound to produce resistance. Algerians will resolutely oppose France."
