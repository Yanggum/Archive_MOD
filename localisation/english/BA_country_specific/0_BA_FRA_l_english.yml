 FRA_charles_maurras_focus_6: "Restoring the Orléanists"
 FRA_charles_maurras_focus_6_desc:0 "The Orléanists hold significant support among the monarchists of France. Although some critics prefer other royal candidates, there is little doubt that the Orléanist heir has the best chance to peacefully unify the country behind him."
 FRA_charles_maurras_focus_7: "Legitimate Succession"
 FRA_charles_maurras_focus_7_desc:0 "Legitimists regard a branch of the Carlists as the legitimate heirs to the French throne. Appointing their candidate to the throne opens up the tantalizing possibility of ruling Spain and France in a dual system of governance."
 FRA_charles_maurras_focus_8: "Proclamation of the Third Empire"
 FRA_charles_maurras_focus_8_desc:0 "Bonapartists may be seen as outsiders in the throne dispute, but they carry the dream of an era where all Europeans bowed their heads to the French Emperor."
