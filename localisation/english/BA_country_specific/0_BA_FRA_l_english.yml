 FRA_ALG_aftermath:0 "Aftermath of the Indigénat Abolition"
 FRA_ALG_aftermath_desc:0 "The Indigénat, enacted for France to assimilate and exploit Algerians for a long time, has been abolished, and all-encompassing French citizenship has been granted to Algerians. However, nationalist forces, hardline Muslims in Algeria, and hardline independence movement supporters are pouring high-intensity criticism on this decision. Also, as they are suddenly incorporated into French central administration, various social costs are being consumed."
 ALG_constantine_agreement:0 "Constantine Agreement"
 ALG_constantine_agreement_desc:0 "The agreement reached in Constantine is a convention where France maintains various interests in Algeria in exchange for permitting Algerian independence. Algeria is still subordinate to France, but after 10 years, they will be able to become fully independent."
