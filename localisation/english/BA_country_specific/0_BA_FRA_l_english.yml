 FRA_exile_navy_desc: "The French Navy has been left in damage for a long time due to excessive cargo loading during the exile period, unreasonable operation of exiled ships, and the absence of ship maintenance and repair infrastructure. If these problems are not resolved quickly, small damages to the ships could lead to larger problems."
 FRA_exile_navy_medi: "French National Navy"
 FRA_exile_navy_medi_desc: "The French Navy is being brilliantly reorganized and navigating the Western Mediterranean even after the exile."
