 FRA_indochina_issue:0 "French Indochina"
 FRA_indochina_issue_desc:0 "French Indochina is too far from the government-in-exile, making it difficult for the home country to intervene in the internal and external problems of the Governor-General. Nevertheless, we will be able to derive appropriate profits through Indochina."
 FRA_VIN_anti_resist_action:0 "Only one measure can be taken at a time."
 FRA_indochina_going_bad:0 "Deepening Colonial Resistance"
