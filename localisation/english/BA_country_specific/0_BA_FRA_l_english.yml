 FRA_across_mid_desc:0 "Utilizing our overwhelming naval superiority, we will devise more specific and planned amphibious operations to proceed with fast and safe landings."
 FRA_last_liberate_plan_flag_tt: "Another §Y£GFX_decision_icon_small Mainland Recovery Plan§! is running"
 FRA_fight_with_MIL_1: "Mainland Recovery Plan - I"
 FRA_fight_with_MIL_1_desc:0 "This plan, hundreds of pages long and discussed for a long time in the centralized general staff, is a specific operational plan for the recovery of the French mainland. This plan aims to cross the Mediterranean and land on the mainland with the cooperation of the navy, air force, and army. This operation is divided into several stages, and each stage requires thorough preparation and coordination.\n\nIn the first stage, we aim to land on the mainland and establish a bridgehead."
 FRA_fight_with_MIL_2: "Mainland Recovery Plan - II"
 FRA_fight_with_MIL_2_desc:0 "In the second stage, we aim to expand the bridgehead and perform trench warfare within the mainland. To this end, we will strengthen information collection and support in cooperation with local Resistance. We also plan to deploy additional troops and equipment to support military operations within the mainland.\n\nIn this stage, we will also pay attention to civilian protection and humanitarian support within the mainland."
 FRA_fight_with_MIL_3: "Mainland Recovery Plan - III"
 FRA_fight_with_MIL_3_desc:0 "In the third stage, we aim to recapture major cities and strategic hubs through a large-scale offensive within the mainland. To this end, we will concentrate all materials on the attack, and through this, we will completely expel Millennium's control within the mainland.\n\n§4It is the final showdown!§!"
 FRA_lib_bor:0 "Bordeaux Liberation"
 FRA_lib_mar:0 "Marseille Liberation"
 FRA_lib_vic:0 "Orléans Liberation"
 FRA_total_lib:0 "French Liberation Declaration"
 FRA_change_paris:0 "Set Capital to Paris"

 FRA_prepare_war:0 "Resistance"
 FRA_prepare_war_desc:0 "The French word for resistance - 'Résistance' is a general term for nationalist mass movements and resistance organizations resisting the rule of Millennium.\n\nThe Resistance operates in six divided regions and continues resistance against Millennium security organizations in each area. They can be temporarily wiped out or deterred, but because the massive support of the French people for them quickly restores their organizational power, Millennium cannot completely eliminate them unless by decisive means.\n\nMeanwhile, the Resistance infiltrating each region causes various sabotages in response to Millennium and supports their exiled motherland. Also, if some of them are wiped out and judged unable to continue resistance on the mainland, they can also leave for a large-scale exile to North Africa, just as their motherland did.\n"

