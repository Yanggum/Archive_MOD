 FRA_free_france_event.1.t: "Paralysis of Administrative Ability"
 FRA_free_france_event.1.d: "Since the French African government-in-exile collapsed due to the collective uprising of Africans, we have organized an army with officers who escaped in the chaos. However, our government lacks the ability to control even the depths of the desert, and can only watch as Africans of the desert declare independence."
 FRA_free_france_event.1.a: "I will reclaim it later."

 FRA_free_france_event.2.t: "Declaration of Malian Independence"
 FRA_free_france_event.2.d: "While we were in chaos, independence organizations in West Africa, heightened by seeing the collective uprising in North Africa, have begun their activities.\n\nThose calling themselves the Mali independence army have promulgated a declaration of independence toward us."
 FRA_free_france_event.2.a: "I cannot let that be."
 FRA_free_france_event.2.b: "It can't be helped."

 FRA_free_france_event.3.t: "Declaration of Mauritanian Independence"
 FRA_free_france_event.3.d: "While we were in chaos, independence organizations in West Africa, heightened by seeing the collective uprising in North Africa, have begun their activities.\n\nThose calling themselves the Mauritania independence army have promulgated a declaration of independence toward us."
 FRA_free_france_event.3.a: "I cannot let that be."
 FRA_free_france_event.3.b: "It can't be helped."

 FRA_free_france_event.4.t: "Independence of West Africa"
 FRA_free_france_event.4.d: "Seeing the declarations of independence of Mali and Mauritania, small minority independence organizations in West Africa also announced their own declarations of independence and sent a unilateral notification toward our government."
 FRA_free_france_event.4.a: "Suppress the rebellion."
 FRA_free_france_event.4.b: "Not this place."
 FRA_free_france_event.4.c: "...Recognize it."

