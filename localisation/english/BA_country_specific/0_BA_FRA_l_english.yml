l_english:
 #Parties (I support .yml denormalization)
 FRA_CGT: "General Confederation of Labour"
 FRA_CGT_long: "General Confederation of Labour\n§gThe French General Confederation of Labour (CGT) became a transitional focal point for the rallying of left-wing forces during the reorganization of the French political landscape after the exile. This occurred because the French Communist Party focused primarily on the resistance movement on the mainland, leading them to refrain from implicit, strong criticism regarding the home government's colonial administration. This created a struggle environment centered around unions rather than political parties. Their composition is diverse, ranging from Muslim Algerians seeking radical independence to Pieds-Noirs who only desire equal treatment with mainland France, and those who focus solely on the labor movement.§!"
 FRA_PPNA: "PPNA/SA-CGT"
 FRA_PPNA_long: "Algerian People's Party/General Confederation of Labour - Algeria Branch\n§gThe Algerian People's Party (PPNA) is a political organization that succeeded the 'North African Star' and is the most influential left-wing anti-imperialist organization in North Africa. They gained popularity among those angered by the French Communist Party's decision to turn a blind eye to the rightward shift of the government-in-exile under a national coalition. They are popular among the poor, the lower classes, middle-class Muslims, intellectuals, youth, and socialists. They have secured a massive organizational force, particularly by colluding with the CGT, which has resolved their ideological narrowness and clearly imprinted the single goal of anti-imperialist and anti-exploitation labor struggle upon their members.§!"
 FRA_neutrality_party_mil_gov: "War Cabinet"
 FRA_neutrality_party_mil_gov_long: "War Cabinet\n§gDespite the Third Republic, the French military still retains a conservative hue, and its leadership is, furthermore, partially reactionary. The military did not trust the elected government, and the failure on the mainland gave them a pretext to overthrow the principle of civilian control. Under the leadership of a single leader elected by the military, the War Cabinet is organized in a top-down manner, forming a vertical political structure.§!"
 FRA_democratic_party_mil_gov: "Popular Front"
 FRA_democratic_party_mil_gov_long: "French Popular Front\n§gThe party alliance of center-to-broad left-wing groups, including the Communist Party, the French Section of the Workers' International (SFIO), and the Radical Party, was organized to resist the wartime military coup after the exile. They have united to practice anti-dictatorship and anti-fascism more than any other group, and some radicals are even willing to exercise the right to resistance through violence.§!"
 FRA_PCF: "French Communist Party"
 FRA_PCF_long: "French Communist Party\n§gAfter declaring a complete break with the Algerian People's Party, the French Communist Party rapidly emerged as an alternative party for the first all-North African elections, excluding the PPNA which was banned from participating. As a party that accepts the revolutionary demands of Algerians while flexibly leading compromises with former French military government bureaucrats, the French Communist Party has criticized the radicalism of the PPNA daily. They have put forward the establishment of 'A Single Socialist French Union State' as their party platform, solidifying their position by conciliating those exhausted by the PPNA's revolutionary line and tolerating former bureaucrats.§!"
 FRA_democratic_party_nextgov: "Popular Front"
 FRA_democratic_party_nextgov_long: "French Popular Front\n§gThe party alliance of center-to-broad left-wing groups, including the Communist Party, the SFIO, and the Radical Party, has been the largest check-and-balance force against the wartime military coup since the exile. As France itself faced the crisis of disintegration and shifted to the right, the Popular Front transformed into what is effectively a single party. They have clearly drawn a line against radical lines like the PPNA, prioritizing compromise and checks, but now they have obtained the African regime as they desired.§!"
 FRA_PSF: "Social Party"
 FRA_PSF_long: "French Social Party\n§gOriginally known as the 'Cross of Fire,' the 'Secret Committee of Revolutionary Action' has organized meaningful political operations not only on the mainland but also within Algeria, unlike other fascist organizations. Gaining enthusiastic support among young Pieds-Noirs and exiled soldiers, they move on the principles of pragmatism and youth action based on anti-communism, forming the core of the French colonial system.§!"
 FRA_action_france: "Action Française"
 FRA_action_france_long: "Action Française\n§gThis far-right monarchist organization, flying the banner of 'Integral Nationalism' advocated by Charles Maurras, defined the fall of the mainland and the miserable end of the Third Republic as the inevitable corruption and failure of the democratic system. They emphasize that France can only be resurrected by restoring traditional Catholic values and the authority of the King within the government-in-exile. They enjoy fanatical support among conservative Pieds-Noirs who believe they have been betrayed and among the reactionary officer corps.§!"


 BA_resistance_icon_1_tt:0 "Resistance | §YWeak§!"
 BA_resistance_icon_2_tt:0 "Resistance | §ONormal§!"
 BA_resistance_icon_3_tt:0 "Resistance | §RStrong§!"
 FRA_propaganda_blank:0 "No propaganda has been posted yet."
 FRA_propaganda_tt:0 "No propaganda has been posted."
 FRA_propaganda_FRA_1:0 "§4Serve the Motherland!§!"
 FRA_propaganda_FRA_2:0 "§4Intensify the Offensive!§!"
 FRA_propaganda_FRA_3:0 "§4Glorious Motherland§!"
 FRA_propaganda_FRA_4:0 "§4Unite Under the Tricolour!§!"
 FRA_propaganda_FRA_5:0 "§4'We're almost there!' - Invest in the Liberation of France with National Defense Bonds!§!"
 FRA_propaganda_FRA_6:0 "§4Follow the Marshal's Instructions!§!"
 FRA_propaganda_FRA_7:0 "§4Devote All Strength to Liberation!§!"
 FRA_propaganda_FRA_8:0 "§4Reclaim Our Freedom!§!"

#France Events
 FRA_pet.1.t:0 "The Lion of Verdun"
 FRA_pet.1.d:0 "North Africa was familiar to him. The scenery outside the window, which reminded him of his service in the greatest war of the interwar period ten years ago, made him extinguish his pipe and stand up. [FRA_philippe_petain.getname] did not find the current situation pleasant. As an elite French officer, the fall of his country was humiliating and hollow, and it was a great burden for him to take on this troublesome yet momentous task. Nevertheless, he intuitively recognized that this was the last moment he could serve his country, and he knew which way the path to becoming a hero led.\n\nThe secretary in front of the office spoke.\n\n\"Monsieur le Maréchal, here is this month's business report.\""
 FRA_pet.1.a:0 "\"The Motherland calls me!\""
 FRA_pet.2.t:0 "A Decision for the Motherland"
 FRA_pet.2.d:0 "In the eyes of [FRA_philippe_petain.getname], the current situation is an emergency, and without a total methodology, France will not be able to move toward reclaiming the mainland. [FRA_philippe_petain.getname] will struggle to regain the heritage of his ancestors by cultivating national power, even if it means 'boldly' abandoning the legacy of French colonialism."
 FRA_pet.2.a:0 "Long live the Marshal!"
 FRA_pet.3.t: "The Flight of Pierre Laval"
 FRA_pet.3.d: "Even though the parliament was suspended due to the recent coup, Pierre Laval was still able to maintain his position as Prime Minister. However, this military coup came as a great threat to him, and the bleak future of the government-in-exile did not seem attractive. Instead, he decided to carry out what he had been contemplating for several days."
 FRA_pet.3.a: "\"Hurry, go quickly!\""
 FRA_pet.30.t: "The Flight of Pierre Laval"
 FRA_pet.30.d: "Even though the parliament was suspended due to the recent coup, Pierre Laval was still able to maintain his position as Prime Minister. However, this military coup came as a great threat to him, and the bleak future of the government-in-exile did not seem attractive.\n\nTherefore, Pierre Laval has fled into our academy's territory and is showing a move to play a mediating role between the French people within the country and our administration."
 FRA_pet.30.a: "Let's keep an eye on him for now."
 FRA_pet.4.t: "'Embers of the Republic'"
 FRA_pet.4.d: "[FRA_maurice_gamelin.getname] was a hero of the Great War and an elder of the military. When Paris fell, he sat in his chair and wept endlessly. This was an action born of his patriotic love for the Republic and democracy he admired. The spirit of the French constitution has been suspended due to [FRA_philippe_petain.getname]'s martial law, and with both the mainland and the system lost, he, as an elite staff officer, was merely waiting for orders as a soldier."
 FRA_pet.4.a: "\"I remember the spirit of July 14th!\""
 FRA_pet.4_tt: "§g[ROOT.getname] will look to take the position of Chairman of the Provisional Military Committee if Pétain is ousted.§!"
 FRA_pet.5.t: "'The Cross of Lorraine'"
 FRA_pet.5.d: "[ROOT.getname] is a figure currently drawing much attention within the French military. Only a few months ago, he destroyed a fortress city known as Eridu, an integrated total of future technologies. His armored units were brave, and he is receiving praise from the French public. Although he is still only a rising star, he knew well that he would become a central figure as time passed. To him, the French military was still submerged in the old era. It seemed that France would soon need his rule."
 FRA_pet.5.a: "\"France has only lost a battle.\""
 FRA_pet.6.t: "National Revolution"
 FRA_pet.6.d: "The 'National Revolution' is a nationwide social remodeling program to overcome the causes of the Third Republic's defeat, which the Marshal defined as stemming not only from military incompetence but also from internal 'liberalism,' 'socialism,' 'disorder,' and 'immorality.' To the Marshal, the recovery of the mainland must be accompanied by internal discipline along with external growth. France will rise again under the slogan of 'Labor, Family, Fatherland'!"
 FRA_pet.6.a: "Everyone is waiting for his guidance."
 FRA_pet.7.t: "Labor Charter"
 FRA_pet.7.d: "The Marshal has embarked on a massive labor reform to thwart all Marxist and socialist subversion attempts against the Republic. The 'Labor Charter' announced in [GetMonth] recognizes only single vocational unions controlled by the state as labor organizations, while banning and dissolving all other labor unions, creating a national corporatist economic system based on traditional Catholic order."
 FRA_pet.7.a: "Let us serve the Motherland!"
 FRA_pet.8.t: "The Role of Women"
 FRA_pet.8.d: "Over the many past years, the traditional family order has collapsed and a newly organized, corrupt, and decadent view of the family has taken place. This is clearly wrong. The Marshal will return the roles of women to their original place based on the Catholic order."
 FRA_pet.8.a: "Everything is returning to its proper place."
 FRA_pet.8_tt: "§gThe Muslim establishment in North Africa favors this policy.§!"
 FRA_dar.1.t: "The Administrator Admiral"
 FRA_dar.1.d: "[FRA_francois_darlan.getname] was able to have a deep sleep for the first time in a while. The nights spent planning the exile, the process of transporting tens of thousands of troops and civilians, and the late-arriving resentment from losing the motherland had tormented him, but standing after all that, he regained some mental stability. Fortunately, the untrustworthy politicians of the parliament were bound by the Marshal, and thanks to that, he could gather the hope in his heart. When he rose from his bed, he heard news from his aide."
 FRA_dar.1.a: "\"The Admiral has been designated as Prime Minister!\""
 FRA_appointed_by_prime_minister_tt: "§Y[ROOT.getname]§! is appointed as §YPrime Minister of the War Cabinet§!:\n"
 FRA_dar.2.t: "Exile of the Industrialists"
 FRA_dar.2.d: "We have successfully carried out an additional four-month exile plan from the southern mainland. The administrative network of [MIL.getname], which was still limited to the north and the cities, could not stop our contacts and intelligence activities in the vast rural areas and ports. As a result, we were able to secure more capital and manpower than expected at the beginning of the exile."
 FRA_dar.2.a: "That's a relief."
 FRA_dar.3.t: "The Mediterranean"
 FRA_dar.3.d: "Prime Minister [FRA_francois_darlan.getname] understands better than anyone that the future mainland recovery operations will involve a large-scale amphibious war. And he knows that what is most needed in a large-scale amphibious operation is overwhelming naval supremacy. The Prime Minister has decided to allocate a separate budget to invest in production for a large-scale naval showdown in the near future."
 FRA_dar.3.a: "The Mediterranean is ours!"
 FRA_dar.4.t: "Beyond the Mountains"
 FRA_dar.4.d: "[FRA_francois_darlan.getname] contacted [ITA.getname] to request a simple military concession. This is to temporarily occupy a part of the territory between the borders of [MIL.getname] and [ITA.getname] to use for training in a program to have well-organized resistance militias rise up."
 FRA_dar.4.a: "Will they accept the request?"

 FRA_prov_event.1.t:0 "Exile of the Resistance"
 FRA_prov_event.1.d:0 "Many Resistance members who were fighting on the mainland have joined the emergency government, feeling their limits."
 FRA_prov_event.1.a:0 "Welcome, comrades!"
 FRA_prov_event.3.t:0 "Great North African Uprising, Collapse of the Emergency Government"
 FRA_prov_event.3.d:0 "'Emergency' and 'Mobilization' were nothing more than other words for 'Dictatorship' and 'Slavery.' The 'Liberty, Equality, Fraternity' of the proud motherland we remembered could never be the slogan of an oppressor. \n\nFrance will be remembered as the first colonial empire to be destroyed by its colonial subjects. Due to a massive revolution carried out by independence forces from Algeria, Tunisia, Morocco, and numerous other African tribes, as well as soldiers who sympathized with them, the French emergency government collapsed today."
 FRA_prov_event.3.a:0 "Government should practice what all people universally desire. - Jean-Jacques Rousseau"
 FRA_prov_event.3.a_tt:0 "§RThe violent rule of the emergency government has returned to them like a boomerang. They will pay the price they deserve.§!"
 FRA_prov_event.4.t:0 "Economic Outlook of North Africa"
 FRA_prov_event.4.d:0 "Fortunately, the French government has invested heavily in the industry of the Algerian region over several decades. This region can be industrialized quickly."
 FRA_prov_event.4.a:0 "It is the foresight of Charles X!"
 FRA_prov_event.5.t:0 "Reform of the Indigénat"
 FRA_prov_event.5.d:0 "The French Indigénat refers to a series of discriminatory legal systems applied to colonial subjects. According to this law, French citizens and subjects are distinguished; subjects are not guaranteed citizenship or voting rights, and arbitrary punishment and mobilization for forced labor by administrators without trial are possible. To appease the general strike, we will grant them the right to trial and limited citizenship, and restrict indiscriminate conscription of them." 
 FRA_prov_event.5.a:0 "Second-class citizens!"
 FRA_prov_event.6.t:0 "Opposition to the Military Dictatorship"
 FRA_prov_event.6.d:0 "Some members of the 'French Section of the Workers' International (SFIO),' who were part of the majority coalition in parliament, and some deputies from the French Communist Party who followed the exile have begun to criticize [FRA_philippe_petain.getname]'s undemocratic seizure of power."
 FRA_prov_event.6.a:0 "No need to think long. Detain them all!"
 FRA_custody: "§RDetained§!"
 FRA_prov_event.8.t: "The Struggle for Diplomacy"
 FRA_prov_event.8.d: "Since the decision of Marshal [FRA_philippe_petain.getname], the [FRA.GetName] government has focused on justifying the military coup and securing legitimacy to succeed the previous government. Although many democratic countries expressed concern about our actions and communists on the mainland refused to call us the legitimate government, thanks to our efforts, we are currently regarded as the legitimate French government-in-exile by the international community."
 FRA_prov_event.8.a: "That's good to hear."
 FRA_prov_event.9.t: "Proposal for the Declaration of Granada"
 FRA_prov_event.9.d: "The [FRA.getname] government is currently in exile due to the interdimensional-Bolsheviks known as [MIL.getname]. The [FRA.getadjective] side wishes to establish a diplomatic-military cooperative relationship with us in the process of ending their exile and reclaiming the mainland. Since the northeastern region of our motherland [SPR.getadjective] was also usurped by interdimensional-Bolsheviks, we could benefit from cooperating with them."
 FRA_prov_event.9.a: "We are stronger together!"
 FRA_prov_event.9.b: "We don't need their help."
 FRA_prov_event.10.t: "French Military Governor"
 FRA_prov_event.10.d: "The home government has dispatched a military governor to strengthen control over the colonies."
 FRA_prov_event.10.a:0 "This is a headache."
 FRA_prov_event.11.t: "[FRA.getadjective] Proposal to Join the Southeast Asian Economic Bloc"
 FRA_prov_event.11.d: "The Ministry of Industry and Economy of the [FRA.GetName] government has proposed that [THIS.getname] join the Southeast Asian Economic Bloc, centered on the Indochina region. In this economic community, France exists only as an observer, but it is designed so that France effectively exercises the role of chairman because all voting rights exercised by the French colonial territories of Vietnam, Laos, and Cambodia are under French control. For that reason, this community will incorporate the economy of [THIS.getname] into the French economic sphere to some extent. However, investment and technology transfer from France, and mutual cooperation within the economic bloc, may come to us as benefits equivalent to such disadvantages."
 FRA_prov_event.11.a: "It's tempting."
 FRA_prov_event.11.b: "We will not be fooled by their shallow schemes."
 FRA_prov_event.12.t: "[FROM.getadjective] Withdrawal from the Southeast Asian Economic Bloc"
 FRA_prov_event.12.d: "The [FROM.getname] government has notified its withdrawal from the economic bloc, stating that the Southeast Asian Economic Bloc is no longer mutually beneficial."
 FRA_prov_event.12.a: "That's unfortunate."
 FRA_prov_event.13.t: "[FROM.getadjective] Acceptance"
 FRA_prov_event.13.d: "[FROM.GetName] has accepted our request."
 FRA_prov_event.13.a: "Wise of them."
 FRA_prov_event.14.t: "[FRA.getadjective] Trade Agreement Proposal"
 FRA_prov_event.14.d: "The [FRA.getname] government has proposed a Mediterranean trade agreement to us that would allow them to trade resources cheaply in exchange for our investment."
 FRA_prov_event.14.a: "It's a good deal."
 FRA_prov_event.14.b: "No need for it."
 FRA_prov_event.15.t: "[FROM.getadjective] Cancellation of the Mediterranean Trade Agreement"
 FRA_prov_event.15.d: "The [FROM.getname] government has terminated the trade agreement with us."
 FRA_prov_event.15.a: "It's not easy."
 FRA_prov_event.16.t: "[SPR.getadjective] Acceptance"
 FRA_prov_event.16.d: "The [SPR.getname] government has agreed to the set of declarations aimed at promoting diplomatic-military relations with us, which will be of great help in the future mainland recovery process."
 FRA_prov_event.16.a: "A reliable comrade."
 FRA_prov_event.17.t: "[SPR.getadjective] Refusal"
 FRA_prov_event.17.d: "The [SPR.getname] government has indicated a polite refusal regarding the Declaration of Granada."
 FRA_prov_event.17.a: "They are laughing at us."
 FRA_prov_event.21.t: "[FRA.getadjective]-[SPR.getadjective] Joint Military Exercise"
 FRA_prov_event.21.d: "A joint military exercise of both armies was conducted against the interdimensional-Bolshevik hostile forces [MIL.getname] and [WHY.getname]."
 FRA_prov_event.21.a: "Let's make the enemies surrender!"
 FRA_prov_event.20.t: "Friendship Treaty with Exile France"
 FRA_prov_event.20.d: "The [FRA.getname] side, a signatory of the Stresa Front, has requested more active cooperation for their mainland recovery while recognizing our Mediterranean hegemony. If we accept this, we can expand our territory without their interference."
 FRA_prov_event.20.a: "Our friendship is deep."
 FRA_prov_event.20.b: "No need to cooperate with them."
 FRA_prov_event.22.t: "[FROM.GetAdjective] Refusal"
 FRA_prov_event.22.d: "The [FROM.getname] government has refused our request."
 FRA_prov_event.22.a: "Unfortunate."
 FRA_prov_event.23.t: "[ITA.GetAdjective] Exile Cooperation"
 FRA_prov_event.23.d: "With the cooperation of the [ITA.getName] government, more exiles are crossing the border to support the government-in-exile. We will be able to further accelerate our preparations to reclaim the mainland using them as a springboard."
 FRA_prov_event.23.a: "Thank you."
 FRA_prov_event.24.t: "[FRA.getadjective] Investment Request"
 FRA_prov_event.24.d: "The [FRA.getname] government has requested investment from our industrialists. While investing in the North African desert may not yield much, if we actively invest in the Tunisia region to obtain the territory we aim for, we might be able to demand Tunisia as compensation when they reclaim the mainland."
 FRA_prov_event.24.a: "Tempting."
 FRA_prov_event.24.b: "A useless endeavor."
 FRA_prov_event.24_tt: "After @FRA§Y[FRA.getadjective]§! §4reclaims the mainland§!, we will be able to demand control over §Y[458.getname]§! and §Y[665.getname]§!."
 FRA_prov_event.25.t: "[ITA.GetAdjective] Investment"
 FRA_prov_event.25.d: "Italian industrialists have begun to invest in our region. However, in exchange for this, we may have to cede sovereignty over the Tunisia region to them."
 FRA_prov_event.25.a: "Immediate needs are more important."
 FRA_prov_event.26.t: "Construction of the North African Highway"
 FRA_prov_event.26.d: "The [FRA.getname] government, through construction collaboration with the [ITA.getName] government and the [SPR.getname] side, intends to build a 'North African Highway' from Ceuta to Tripoli. This is merely a scheme for their North African industrial base, but there is clear benefit for us too."
 FRA_prov_event.26.a: "A good proposal."
 FRA_prov_event.26.b: "This is no time to play along with them."
 FRA_prov_event.27.t: "[FROM.getadjective] Highway Construction"
 FRA_prov_event.27.d: "Fortunately, the [FROM.getname] side has participated in building the highway with us."
 FRA_prov_event.27.a: "Thank you."
 FRA_prov_event.28.t:0 "Failure on the Mainland"
 FRA_prov_event.28.d:0 "We were attacked in the midst of peace. An unpredicted Great Transfer from another world summoned tens of thousands of outsiders to the French mainland, and their state-of-the-art future technology burned France. France resisted, but the outsiders were strong, and the government was divided. The exile carried out at the end of total defeat was entirely a 'strategic retreat,' but no one can dare deny it was a 'failure on the mainland.'"
 FRA_prov_event.28.a:0 "What do we have left?"
 FRA_prov_event.29.t: "Contact Point Discovered"
 FRA_prov_event.29.d: "We have secured decisive evidence that the North African general strike was instigated by the Algerian People's Party! Because of this, the People's Party will have no choice but to act passively on the strike front."
 FRA_prov_event.29.a: "Communist scum!"
 FRA_prov_event.29_tt: "\nFrom now on, the increase in £GFX_repairing §YStrike Organization§! caused by £GFX_decision_icon_small §Y$FRA_PPNA_activation$§! is reduced to §R5§!."
 FRA_prov_event.30.t: "[295.getname] Conference"
 FRA_prov_event.30.d: "The [FRA.GetName] side met with the King of [BEL.getname], [BEL.getleadername], at [295.getname] to discuss industrial cooperation, joint security in the African region, and coordination in mainland recovery operations. Through this meeting, both countries can become reliable diplomatic partners for each other."
 FRA_prov_event.30.a: "Let's cooperate with them."
 FRA_prov_event.30.b: "It's a dangerous task."
 FRA_prov_event.30.c: "It's a desirable thing."
 FRA_prov_event.31.t: "[FROM.getadjective] Acceptance"
 FRA_prov_event.31.d: "The [FROM.getname] government has accepted the contents of the [295.getname] Conference."
 FRA_prov_event.31.a: "They are wise ones."
 FRA_prov_event.32.t: "Outlook for the National Navy"
 FRA_prov_event.32.d: "The French National Navy is an organization that originated from Cardinal Richelieu's Royal Navy in the 17th century and has proudly defended the world's oceans and France's overseas territories. However, almost all naval ships were mobilized to support all parts of France during the Great Transfer, and they had to perform a large-scale transport operation to North Africa shortly thereafter. As a result, fatigue from excessive cargo loading and unreasonable operation has accumulated in the current naval ships, and to make matters worse, due to the lack of maintenance facilities, the ships are currently temporarily anchored in North Africa.\nIf exposed to enemy attack in this state, the French Navy will suffer severe damage. Measures to resolve this are currently being strongly advocated by the navy to the government. If action is not taken quickly, the power of the navy will rapidly weaken."
 FRA_prov_event.32.a: "There is much to do."
 FRA_prov_event.33.t: "Negotiation"
 FRA_prov_event.33.d: "Through our series of measures, the strike forces are willing to admit that continuing the strike is no longer in their interest. The government sent a delegation to hold a meeting with the leadership of the strike committee, promising wage guarantees during the strike period and the implementation of mutually adjusted requirements. Soon the strike will end."
 FRA_prov_event.33.a: "Thank goodness."
 FRA_prov_event.35.t:0 "Military Dissatisfaction"
 FRA_prov_event.35.d:0 "Even though it was the decision of [FRA_philippe_petain.getname], the spiritual pillar of the military, many in the military feel skeptical about giving up French hegemony. Although [FRA_philippe_petain.getname] is settling this dissatisfaction with his own dignity and authority, everyone knows that the fact he was recommended by the Provisional Military Committee means his ousting is also possible by the military."
 FRA_prov_event.35.a:0 "\"It is all for the Republic.\""
 FRA_prov_event.35_tt: "\n§REvery time military dissatisfaction arises, the leader must stand trial.§!"
 FRA_prov_event.36.t: "Halifax Conference"
 FRA_prov_event.36.d: "Diplomats from [ENG.getname] and ambassadors from the [FRA.getname] side held a meeting in the Canadian city of Halifax. They discussed the reconstruction of a military alliance like the Entente from the Great War era, cooperation between the industries of the exiled regions, and mutual cooperation in colonial governance."
 FRA_prov_event.36.a: "Long live Franco-British friendship!"
 FRA_prov_event.37.t: "Halifax Conference"
 FRA_prov_event.37.a: "Stronger together!"
 FRA_prov_event.37.b: "Diplomacy we don't need."
 # French News Events
