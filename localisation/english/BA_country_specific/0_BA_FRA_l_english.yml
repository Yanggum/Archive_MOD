 FRA_industrialize:0 "The Path of Exile"
 FRA_industrialize_desc:0 "\n\n\n\n£GFX_decisions_fra_army\n\n\n\n\n\n\n\nAfter the 'failure on the mainland,' France set out on the path of exile. The motherland has faced numerous adversities and will continue to face them, but will nevertheless endure!\n\n§YIf the French crisis stage reaches §R10§!, the French colonial empire will perish!§!"

