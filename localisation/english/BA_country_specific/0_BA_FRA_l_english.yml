 FRA_inner_circle_petain.3.t: "The Leadership of Philippe Pétain"
 FRA_inner_circle_petain.3.d:0 "The sun of Algiers was hot, but only a cool silence lingered in Marshal Philippe Pétain's office. What was visible outside the window was not the ripples of the Seine but the rough waves of the Mediterranean, and what surrounded him were not the brilliant social circles of Paris but only exiled officers soaked in defeatism. 'Failure on the mainland'. That painful phrase weighed down the old Marshal's heart.\n\n\"The Republic is dead. No, it destroyed itself.\"\n\nPétain looked down at the report on his desk. Endless debates of the parliament, corruption of politicians, and an army that helplessly collapsed before the outsider monsters called 'Millennium'. The 'Liberty, Equality, Fraternity' that the Third Republic shouted finally brought only disorder, dissipation, and defeat. He was now realizing the weight of the cross he had to bear.\n\nSimply reclaiming the land was not enough. France had to be born again. The rotten illusions of democracy had to be swept away, and the soul of the nation had to be purified through discipline, order, and sacrifice. It would be a painful process, but it was an unavoidable path. He picked up his fountain pen with trembling hands.\n\n\"'Labor, Family, Fatherland (Travail, Famille, Patrie)'. This will be our new flag.\"\n\nThe document he signed was not a simple administrative order. It was a break from the past and a signal flare marking the beginning of a giant surgery called the 'National Revolution (Révolution nationale)'. The old lion made a lonely decision once again to save the motherland."
 FRA_inner_circle_petain.3.a: "France will be born again."

 FRA_inner_circle_maurice_gamelin.5.t: "Guardian of the Republic"
 FRA_inner_circle_maurice_gamelin.5.desc:0 "A heavy silence hung in the Algiers office. In the place where the giant idol called Philippe Pétain had collapsed, only remnants of authoritarianism and fragments of a confused Republic left by him were scattered. Maurice Gamelin was immersed in deep agony while looking at the waves of the Mediterranean outside the window. The military was unsettled, and in every part of the colony, voices demanding the restoration of democracy and a silence wishing for strong leadership were flowing simultaneously.\n\nHe told himself. But what form should the Republic that started to move again have? Old politicians and parliamentarians centered on Laval are demanding to immediately convene the parliament and restore the legal tradition of the Third Republic. That was the most certain way to restore legitimacy and gain support from the common people, but at the same time, there was a risk of bringing back the tedious political strife and inefficiency of the past. Now was wartime. The enemy was powerful, and we were too weak.\n\nOn the other hand, the staff argue that strong military control must be maintained until the war ends. It was the logic that the military should become the 'guardian' of the state and 'instruct' the Republic until the day of victory. It was efficient and... a tempting proposal, but the fear that he could fall into a path no different from Pétain's dictatorship which he so despised made him hesitate.\n\nThe hand of Gamelin, who held the pen, was filled with strength. His choice will decide the character of the government-in-exile, no, the future of France. He had to make a decision not as the honor of an old soldier, but as the true guardian of the Republic."
 FRA_inner_circle_maurice_gamelin.5.a: "Restore the parliament to secure democratic legitimacy."
 FRA_inner_circle_maurice_gamelin.5.b: "Until we win, the army will cover the Republic."

