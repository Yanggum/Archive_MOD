 FRA_african_rage_mission: "Spreading Resistance"

 FRA_disruption_event.1.t: "Small Ball - 1"
 FRA_disruption_event.1.d: "\"What's the story? Come on, tell me.\"\n\"I can't tell you in this state.\"\n\"Why?\"\n\"We are here representing 2,500 workers.\"\n\"Right. And?\"\n\"We use polite language, but you, the deputy factory manager and department heads, use informal language.\"\n\"It was our mistake.\"\n\n\"Exactly what are your demands?\"\n\"A 25% wage increase, immediate payment of unpaid wages, unconditional reinstatement of those unfairly dismissed - that's all.\"\n\"Wages were already adjusted and increased last February, and they are being paid according to that adjustment. Bonuses were also paid at the end of last year.\"\n\"It was a unilateral increase. The bonuses paid were at a level where they couldn't even be called bonuses. It was about a month's worth of overtime pay.\"\n\n\"Chapter head, hand over that notebook to us. And let's finish this.\"\n\"When will you give the company's answer to our demands?\"\n\"Don't wait. There's nothing to give to people who see everything in a negative light. I can't understand why you guys negate our development.\"\n\"That's not true. We workers are the ones working on the industrial front. We're just saying the benefits should be returned to us too. Why must we become weak for a healthy economy?\"\n\"Everything will be solved as time passes.\""
 FRA_disruption_event.1.a: "\"The workers have already been waiting for a long time.\""

 FRA_disruption_event.2.t: "Small Ball - 2"
 FRA_disruption_event.2.d: "Flames rose. We guarded the factory for two full days without sleeping. The gendarmerie were ruthless. I saw a colleague's head turn red. Fortunately, they couldn't enter the factory. The metallurgy factory became an impregnable fortress. We locked the managers in a room. Tools became weapons. Long wooden poles were preventing the gendarmerie's entry. We waited for Rahim, who went out to deliver news. Food was slowly running out.\n\nWe were completely surrounded by the gendarmerie. Nothing could enter the factory. Nor could anyone leave. Three cowards ran out of the factory but were beaten with clubs and fainted. They hadn't wanted to fight. Fortunately, Molotov cocktails were plenty. The furnace did not cool. If we poured molten metal, they couldn't come up.\n\nThe sound of something breaking and colliding came from the factory next door. Fifteen people joined our factory through a hidden path. They informed us that everyone in the next factory had been detained. There was no longer anywhere to step back.\n\nSoldiers were seen sporadically outside. I don't know French. They shouted something through a loudspeaker, and several colleagues hurriedly hid. I thought they were cowards. A wooden pole and a hard hat were protecting me. I threw a Molotov cocktail at them with all my might."
 FRA_disruption_event.2.a: "\"Fire!\""

 FRA_disruption_event.3.t: "Algerian Resistance"
 FRA_disruption_event.3.d: "Algeria, which has been managed as 'mainland' France, seems like the most stable region in French North Africa. However, structural dissatisfaction with colonial power and its oppression, and the sprouts of nationalism, are growing in this region. The 'North African Star (Étoile nord-africaine, ENA),' formed in 1926, is organizing a resistance movement based on nationalism, and although they have been outlawed several times, they are maintaining a cell organization underground and waiting for their time."
 FRA_disruption_event.3.a:0 "Horrible."
 FRA_disruption_event.3_tt: "\n§gBecause routes other than §4Philippe Pétain§! are not fully developed yet, in the §Wcurrent version§!, the §YFrench Crisis Stage§! does not rise above §R4§!!§!\n\n"

 FRA_disruption_event.4.t: "Winter of Oran"
 FRA_disruption_event.4.d: "Louis Martin began each day by carrying loads near the harbor every dawn. The small house his father left passed to the bank when wheat prices plummeted during the Great Depression. All that remained was a kitchen-sized rented room and an old bed.\n\n\"Louis, if you don't find a job today too, dinner is just bread.\"\nHis wife Marie said, rubbing her eyes in the dawn light. Instead of answering, Louis pressed his hat down and left through the door.\n\nAt the harbor, he competed for work while bumping shoulders with Algerian Muslim workers. Everyone was poor, and everyone was hungry. But Louis couldn't become their friend, nor their enemy. Between them, there was an invisible boundary. It was a distance created by a single French passport.\n\nOn the way back, Louis encountered Marie carrying a bundle and his two daughters. Louis was about to greet his family who had come to meet him but couldn't bring himself to do it. Water was pooling in the children's eyes. Without time to look after Marie's gloomy expression, Louis ran with all his might to find the house site.\n\n\"Crash!\"\nThe roof collapsed and dust rose. As the dust cleared, people holding sledgehammers found Louis.\n\nAn official who looked like the person in charge of the demolition work approached. Standing in front of Louis, he handed over a paper and pen. He pointed to a square column with his finger. It must have meant for him to sign. Louis soon raised his left hand.\n\nThe work happened in an instant. The official covered his face with both hands and bent his upper body. Blood flowed down between his hands. Louis hit the hunched man again. The official slumped forward. People holding sledgehammers belatedly swarmed and rushed at Louis."
 FRA_disruption_event.4.a:0 "It ended simply. Louis was lying on the ground as if dead."

 FRA_disruption_event.5.t: "Urbanization"
 FRA_disruption_event.5.d: "The early morning sea breeze was refreshing. Youcef Benhamid intuitively felt that spring had arrived. He began each day by smelling the coffee in the alleys of the Casbah every morning. His shop was a textile store inherited from his father, narrow but with a window where white cloth swayed in the wind. The harbor and people's footsteps seen outside the window were like his entire life. Even though he leaned his face out the window and inhaled the scent of spring to the full, his expression did not look happy at all. It was because today was the last day of the 'forced eviction' deadline announced by the city hall a month ago.\n\n\"This isn't just about moving houses, Youcef.\"\nHe remembered what his neighbor Jean-Pierre had said. \n\"They'll push over our shop and build a boulevard and a European-style square in its place.\"\n\nThe sound of prayer echoed from the mosque minaret. People lined up. Everyone walked following the soldier in front, leaving the buildings empty. They walked for half a day.\n\nThe soldiers stopped. The people also stopped. \nThe people at the very front asked the soldier. Where should they head now? \nThe soldier answered.\n\n\nYoucef had a terrible experience. The soldiers left the people on a plain without any facilities and departed. Fortunately, they could drink water from a narrow stream. Food could not be obtained. Some left. They couldn't head toward the city because of the soldiers. Youcef had a premonition that they would return within three days.\n\n\"Please! Please give us food! My son is dying!\"\nA week passed and desperate cries were heard from here and there. After three days, even those were not heard. Youcef starved for two days. Buildings of the city were hanging on the northern horizon. He wished for salvation."
 FRA_disruption_event.5.a:0 "\"Marshal, we are here!\""

 FRA_disruption_event.6.t: "Land"
 FRA_disruption_event.6.d: "In the spring of 1938, the barley on the Mitidja plain was ripening. But Abdelhamid and his family knew well that the grain was not theirs. The land they cultivated was owned by Monsieur Renault, a European landlord, and more than half of the harvest had to be paid as rent.\n\nThat winter, the colonial government increased the rent and forced cash payments. Even though the harvest had decreased due to drought and pests. The villagers gathered under the old fig tree behind the mosque.\n\nThe old Imam said.\n \"If the grain we grew with our sweat cannot enter our children's mouths, this is not God's will.\"\n\nAfter 그날, the peasants did not go out to the land. Pitchforks were left in the corner of the yard, and instead, they talked with activists who came from Algiers city. They heard the words 'peasant union' and 'rights'.\n\nOn the second day, the gendarmerie entered the village. Monsieur Renault took Abdelhamid's cow, saying it was a 'contract violation'. The children cried, but he did not bow his head.\n\nThe villagers no longer farmed. On the fourth day, the gendarmerie made a mess of the village and left. But people did not step out on the fifth day either. The gendarmerie took dozens of people, and the villagers resisted fiercely but were eventually all suppressed.\n\n\"...They say such a thing happened.\""
 FRA_disruption_event.6.a:0 "\"That's a good story. Let's publish it.\""
 FRA_disruption_event.7.t: "Cries of Justice Echoing from the Mitidja Plain"
 FRA_disruption_event.7.d: "                                                        Algiers, March 14, 1938 — Special Correspondent M. Laurent\n\nIn the fertile Mitidja plain of Algeria, poor Muslim peasants have embarked on a historic fight. They have lived under the exploitation of European landlords for decades. Today, more than half of the grain they cultivated is forcibly taken and loaded into the warehouses of bourgeois merchants in the home country via the harbor. While children go hungry and wives endure by sharing bread, landlords sip coffee in the cafes of Algiers city.\n\nLast week, the tenant farmers of the village gathered and resolved not to go out to the land. In their hands, instead of pitchforks, were flags of justice.\n \"Bread and Rights!\"\n This simple yet great demand filled the fields of Mitidja.\n\nWorkers and peasants of North Africa, listen! These peasants are our brothers and are in the same struggle. Their fight is the first step toward breaking the chains of colonial exploitation and workers and peasants moving toward freedom together.\n\nThe colonial government is sending gendarmerie to threaten, taking cows and intimidating. But we know — that the voice of the hungry will never be silenced. The cries echoing from the fields of Algeria will reach the docks of Oran, the factories of Constantine, and the steel mills of Annaba.\n\nWe are with them. Rent reduction! Cessation of cash payments! Cultivation rights for all peasants! The struggle of Algerian peasants is our struggle. For freedom and bread, as one front!\n\n- Algerian People's Party"
 FRA_disruption_event.7.a:0 "What on earth is this! Close down the publication immediately!"

 FRA_disruption_event.8.t: "Algerian People's Party"
 FRA_disruption_event.8.d:0 "The Algerian People's Party (PPNA) is a political organization that succeeded the 'North African Star' and is the most influential left-wing anti-imperialist organization in North Africa. They gained popularity among those angered by the French Communist Party's decision to turn a blind eye to the rightward shift of the government-in-exile under a national coalition. They are popular among the poor, the lower classes, middle-class Muslims, intellectuals, youth, and socialists. They have secured a massive organizational force, particularly by colluding with the CGT, which has resolved their ideological narrowness and clearly made the goal of anti-imperialist and anti-exploitation labor struggle clear to party supporters.\n\nAccording to intelligence, several party officials participated in the Comintern meeting in 1937, and it is confirmed they received funding from the Soviet Union."
 FRA_disruption_event.8.a:0 "What a headache."

 FRA_disruption_event.9.t: "Unemployment"
 FRA_disruption_event.9.d: "Workers worked in one factory but everyone just worked in a separated state. Lunchtime was not long. European workers entered the dining hall. We ate bread and olives in a corner of the factory. Supervisor Dumézil said this was the 'rule.' While saying so, he hurried our meal every time. Supervisors made us exercise as soon as we finished our meal. We went out to the yard and kicked a ball like crazy. They seemed to dislike it very much when we gathered and talked.\n\n \"Just because we don't know how to speak, this is a kind of fight.\"\n Mustafa came to me and talked.\n \"We must fight for the minimum treatment we should receive. A fight always happens when what is right and what is not collide. Think about which side we are on.\"\n Mustafa skipped lunch. I kicked the ball as usual.\n\n Pay decreased. Shiny machines were placed throughout the factory. The amount of work increased. By late night, we were tired. At times like that, Supervisor Dumézil used the word depression. We were afraid of the factory closing. Dumézil knew that.\n\n On the day of receiving money, workers were even more careful with their words. The colleague next to you was the hardest person to trust. Anyone who spoke of unfair treatment was kicked out without anyone knowing.\n\n Mustafa was not seen in the factory at some point. Even without asking colleagues, I could guess what happened to him."
 FRA_disruption_event.9.a:0 "'I felt sorry.'"
 
 FRA_strike_event.1.t: "Confrontation on the Street"
 FRA_strike_event.1.d: "\"Listen, communist scum! You are threatening security and plotting to overthrow the system! - Do not act rashly and disperse immediately! If you disperse, you will be pardoned!\"\n\n\n\"We will not back down!\"      \"Bread and milk for the hungry!\"       \"Land to the peasants!\"\n     \"Down with France!        \"Implement minimum wage system!\"          \"Down with the landlords!\"\n\"Guarantee fair wages!\"                                                               \"Release imprisoned comrades!\"\n                         \"Long live the liberation of oppressed nations!\"           \"Lift martial law!\"\n\"Abolish the Ministry of Colonies!\"                           \"Labor is ours!\"\n                            \"Abolish forced labor regulations!\"                  \"Let's establish a workers' and peasants' government!\""
 FRA_strike_event.1.b: "..."

 FRA_strike_event.2.t: "Disobedience"
 FRA_strike_event.2.d: "It has been revealed that Muslim North Africans among the Foreign Legion members, gathered from our various colonial districts to serve the Republic, refused training and plotted a socialist rebellion! They will all be shot.\n\nHowever, some French officers see this incident as a precursor to [ROOT.GetLeader]'s military purge, and the precursors of a coup to overthrow the leadership, which had been doubted since the general strike, are flowing."
 FRA_strike_event.2.a:0 "Is control over the army secure?"

 FRA_strike_event.3.t: "Tenancy Dispute"
 FRA_strike_event.3.d: "Since the small-scale tenancy dispute on the Mitidja plain, tenancy disputes have become frequent nationwide. They formed a nationwide solidarity demanding 'rent reduction,' and landlords mobilized thugs to wipe them out, but peasants are resisting such attempts and soon rising up. As the street parade of the last May Day protest was reported throughout North Africa, the tenant farmers of North Africa started the dispute shouting 'Farmland to the peasants! Factories to the workers!', and some are causing violent riots."
 FRA_strike_event.3.a:0 "Defend the large farms!"

 FRA_strike_event.4.t: "General Strike"
 FRA_strike_event.4.d: "The strike conducted recently was significantly different from the pattern of strikes we commonly see on the mainland. Political demands are hung along with economic demands on the street barricades. Muslims have rushed into the streets daily shouting 'Bread and Freedom!', and desert nomads are increasing the frequency of their plundering, taking advantage of the chaos. The Ministry of Colonies cannot take any administrative measures."
 FRA_strike_event.4.a:0 "We are in the worst situation."

 FRA_strike_event.5.t: "Eve of the Strike"
 FRA_strike_event.5.d: "The commemorative procession for the deceased from the recent shooting in Constantine gathered tens of thousands of people, exceeding expectations. The government's attempts to block the streets using all available means were frustrated, and the masses of North Africa are confronting the gendarmerie shouting 'Down with the dictatorship'."
 FRA_strike_event.5.a:0 "Mobilize more police!"

 FRA_strike_event.6.t: "Honorable Resignation of [FRA_philippe_petain.getname]"
 FRA_strike_event.6.d: "As the French crisis heightens, Marshal [FRA_philippe_petain.getname] has announced his honorable resignation. His resignation took place under pressure from the military and the Provisional Military Committee, and his resignation speech was conducted while being monitored by the military.\n His resignation heralds a great change in French politics, and attention is focused on whether the new leadership can solve the North African chaos and overcome the French crisis."
 FRA_strike_event.6.a:0 "A new leadership is needed."

 FRA_strike_event.7.t: "New Leadership of the Provisional Military Committee"
 FRA_strike_event.7.d: "Following the honorable resignation of the previous leadership, the Provisional Military Committee was convened to elect a new leadership. Currently, the most prominent candidates are General [FRA_maurice_gamelin.getname] and General [FRA_charles_de_gaulle.getname]. They each hold strong support within the military and are each presenting new strategies to overcome the French crisis. The new leadership will take on an important role to solve the North African chaos and overcome the French crisis."
 FRA_strike_event.7.a:0 "Gamelin for the Republic!"
 FRA_strike_event.7.b:0 "De Gaulle and Liberation!"

 FRA_strike_event.8.t: "Dissolution of the Provisional Military Committee"
 FRA_strike_event.8.d: "The 'Provisional Military Committee' was established under the authoritarian rule of [FRA_philippe_petain.getname] as a temporary measure to solve the French crisis. However, after his honorable resignation, [FRA_maurice_gamelin.getname] decided to dissolve this committee. He firmly believed in the principles of the democratic republic, and the policies of [FRA_philippe_petain.getname], a political criminal, were not needed there."
 FRA_strike_event.8.a:0 "The embers are burning!"

 FRA_strike_event.9.t: "Dissolution of the Provisional Military Committee"
 FRA_strike_event.9.d: "The 'Provisional Military Committee' was established under the oppressive rule of [FRA_philippe_petain.getname] as a temporary measure to solve the French crisis. However, after his honorable resignation, [FRA_charles_de_gaulle.getname] decided to dissolve this committee. The policies of [FRA_philippe_petain.getname], who put France in crisis due to criminal incompetence, were not needed there."
 FRA_strike_event.9.a:0 "Hero of the Republic!"


