 FRA_leading_of_fatherland: "Leading the Motherland"

# Philippe Pétain
 FRA_petain_focus_0: "'The Lion of Verdun'"
 FRA_petain_focus_1: "National Revolution\n (Révolution nationale)"
 FRA_petain_focus_2: "Labor (Travail)"
 FRA_petain_focus_3: "Family (Famille)"
 FRA_petain_focus_4: "Fatherland (Patrie)"
 FRA_petain_focus_0_desc:0 "In 1916, in the trenches of Verdun, we vowed that 'they shall not pass,' and ultimately we won. Today we have been pushed across the sea, but the Marshal's medal still shines. What the people who are soaked in defeatism need is a focal point. Marshal Philippe Pétain will willingly devote himself to France to save the motherland once again."
 FRA_petain_focus_1_desc:0 "The fall of the Third Republic is not simply because of military failure. It was the inevitable result called forth by corrupt parliamentary politics, decadent liberalism, and the moral hazard spread across society. To reclaim the motherland, we must first purify our interior. Washing away the filth of the past and rebuilding the soul of France, that is precisely the 'National Revolution'."
 FRA_petain_focus_2_desc:0 "The greed of capitalism and the propaganda of socialism have damaged the sacred value of labor. We refuse the destructive delusion of class struggle. All French people must sweat diligently in their respective positions, and the state will guide that labor so it can correctly contribute to the giant task of reclaiming the motherland."
 FRA_petain_focus_3_desc:0 "Individualistic dissipation has destroyed the family, the most basic unit of France. A strong state comes from a strong family. We must restore the traditional patriarchal order, encourage fecundity and nurturing, and redesign the future of France which is suffering from population shortage. The family will become the cradle of the National Revolution."
 FRA_petain_focus_4_desc:0 "Our loyalty must not be toward any political faction or ideology, but only toward the eternal entity called 'France'. We must gather scattered hearts into one, throw away selfishness, and instill patriotism to sacrifice for the whole. Only our motherland, proven by soil, blood, and history, is our only faith."

# Charles de Gaulle
 FRA_charles_de_gaulle_focus_0: "De Gaulle the Guardian"
 FRA_charles_de_gaulle_focus_1: "Offensive Doctrine"
 FRA_charles_de_gaulle_focus_2: "Curbing Conservatives in the Army"
 FRA_charles_de_gaulle_focus_0_desc:0 "The old marshals are still unable to wake up from the nightmare of trench warfare. But Charles de Gaulle knows. That this defeat was not because our courage was lacking, but because our methods were old. The vision and indomitable will of the young general is the only hope to wake up the army soaked in defeatism and transform it into a modern army."
 FRA_charles_de_gaulle_focus_1_desc:0 "Defense is merely another name for defeat. We will no longer hide behind the Maginot Line. Speed, maneuver, and concentration of fire. A bold offensive doctrine led by armored units is the only way to seize victory against an overwhelming enemy."
 FRA_charles_de_gaulle_focus_2_desc:0 "The defeatists who have seized the military high command and the conservatives obsessed with old doctrines are cancerous existences that block the reform of the army. General de Gaulle will expand his influence to exclude them from key positions and fill the staff with young and competent officers who only think of victory."

# Maurice Gamelin
 FRA_maurice_gamelin_focus_0: "Gamelin the Guardian"
 FRA_maurice_gamelin_focus_1: "Systematic Mobilization System"
 FRA_maurice_gamelin_focus_2: "Politicized Military"
 FRA_maurice_gamelin_focus_0_desc:0 "Although the mainland defense war ended in failure, Maurice Gamelin is still a seasoned commander who dominates the organization and administration of the army. Radical adventureism will only collapse the army in a precarious situation like now. Only Gamelin's prudent and systematic approach can maintain the confused exiled army as an orderly army."
 FRA_maurice_gamelin_focus_1_desc:0 "An improvised counterattack is a suicidal act. We must meticulously identify human and material resources across Algeria and all colonies and build a systematic mobilization system that can supply them to the army most efficiently. Victory starts from the supply depot and account books, not the battlefield."
 FRA_maurice_gamelin_focus_2_desc:0 "The army is not simply a group that fires guns. The army is the pillar of the state and the final bastion to guarantee political stability. General Gamelin will strengthen the political network within the military to make the army perform a leading role in the policy decisions of the government-in-exile."

# Joint (De Gaulle & Gamelin)
 FRA_charles_de_gaulle_maurice_gamelin_focus_2: "Reorganization of the French Army"
 FRA_charles_de_gaulle_maurice_gamelin_focus_2_desc:0 "Generals with different views, but they agree on one fact. That they can do nothing with the current rabble. Integrating and reorganizing the stragglers who escaped the mainland, colonial garrisons, and local conscripts under one command system is a more urgent task than any strategy."

# Maxime Weygand
 FRA_maxime_weygand_focus_0: "Weygand, Governor of Algeria"
 FRA_maxime_weygand_focus_1: "Algerian Foreign Legion"
 FRA_maxime_weygand_focus_0_desc:0 "Algeria is no longer just a colony. This place is France itself. Governor-General Maxime Weygand will make Algeria a sturdy fortress for the government-in-exile based on military rigor and administrative competence. All preparations for mainland recovery start right here, in Algiers."
 FRA_maxime_weygand_focus_1_desc:0 "We lack troops. Governor-General Weygand will summon the young people of Algeria under the flag of France. By promising them honor, pay, and future citizenship, he will found a strong Foreign Legion that can fight anywhere, regardless of desert or mountains."

# Charles Noguès
 FRA_charles_nogues_focus_0: "Noguès, Governor of Morocco"
 FRA_charles_nogues_focus_1: "Moroccan Foreign Legion"
 FRA_charles_nogues_focus_0_desc:0 "Morocco is a strategic hub connecting the Atlantic and the Mediterranean. Governor-General Charles Noguès has maintained the stability of Morocco by skillfully handling local sultans and tribal chiefs. His seasoned statecraft will remove unstable elements of the rear and transform Morocco into a logistics base for mainland recovery."
 FRA_charles_nogues_focus_1_desc:0 "The Berbers and Arabs of Morocco are rough but brave warriors. Governor-General Noguès will expand the Moroccan Foreign Legion by rallying them. They will become a precious force to perform operations in rough environments that the French regular army would find hard to handle."

# Charles Maurras
 FRA_charles_maurras_focus_0: "The Thinker Charles Maurras"
 FRA_charles_maurras_focus_1: "Labor and Fatherland"
 FRA_charles_maurras_focus_2: "Value of the Clergy"
 FRA_charles_maurras_focus_3: "Action Française"
 FRA_charles_maurras_focus_0_desc:0 "The republican government was a disease eating away the spirit of France. Charles Maurras, the leader of 'Action Française', believes the opportunity to cure that disease has now come. Only destroying the false idol called democracy and returning to the traditions and order unique to France is the way for our nation to survive."
 FRA_charles_maurras_focus_1_desc:0 "The struggle between capitalists and workers will only divide the nation. Maurras advocates for corporatism that goes beyond class conflict. Labor for the motherland, and the state protecting that labor. In this organic combination, the economy will regain stability and national power will be restored."
 FRA_charles_maurras_focus_2_desc:0 "The Catholic Church is the soul of French history. We must restore the authority of the church which anti-clerical republicans have damaged. Faith will mentally arm the people who have fallen into hardship and bestow moral legitimacy on the government-in-exile."
 FRA_charles_maurras_focus_3_desc:0 "Now is the time to act. Warriors with ideas are needed, not street thugs. By expanding the organization of 'Action Française', we will silence the opposition and spread the ideals of monarchist restoration and integral nationalism into every corner of society."

# François de La Rocque
 FRA_francois_de_la_rocque_focus_0: "The Thinker François de La Rocque"
 FRA_francois_de_la_rocque_focus_1: "Corporatist Economy"
 FRA_francois_de_la_rocque_focus_2: "French Youth Corps"
 FRA_francois_de_la_rocque_focus_3: "Unification of the Broad Right"
 FRA_francois_de_la_rocque_focus_0_desc:0 "Neither the old republican government nor reactionary monarchist restoration is the answer. François de La Rocque has advocated for order, authority, and the integration of the masses while leading the 'Cross of Fire'. He presents a new conservative revolutionary path appealing to the masses by combining Christian socialism and authoritarian leadership."
 FRA_francois_de_la_rocque_focus_1_desc:0 "Disorderly laissez-faireism is over. We must build a corporatist economic system where the state coordinates and vocational representatives participate. Through this, we will block the tyranny of capital, protect the rights and interests of workers, and maximize the productivity of the entire nation."
 FRA_francois_de_la_rocque_focus_2_desc:0 "The future lies with the youth. De la Rocque will organize the 'French Youth Corps' armed with discipline, patriotism, and Christian spirit of service. They are not merely boy scouts, but will be the vanguard of a new generation standing at the forefront of national reconstruction."
 FRA_francois_de_la_rocque_focus_3_desc:0 "To counter the threat of the left and the incompetence of the republicans, fragmented right-wing forces must be gathered into one. De la Rocque will seize political leadership by forming a broad right-wing coalition encompassing conservative, Catholic, and nationalist forces based on his mass popularity."

# Pierre Laval
 FRA_laval_focus_0: "Prime Minister Pierre Laval"
 FRA_laval_focus_1: "Strengthening Anti-communist Posture"
 FRA_laval_focus_0_desc:0 "Pierre Laval is a master of survival. He maintained the position of Prime Minister even amidst the ruins of the collapsing Third Republic. Although his power has been reduced by the military, his outstanding political skill and administrative ability are assets that cannot be absent in operating the confused government-in-exile."
 FRA_laval_focus_1_desc:0 "The enemy within is as dangerous as the enemy without. Prime Minister Laval will thoroughly suppress communists and socialists. By removing impure elements threatening security, he will seek social stability and solidify the support of the conservative class."

# François Darlan
 FRA_darlan_focus_0: "'Administrator Admiral' Darlan"
 FRA_darlan_focus_2: "Maritime Hegemony Strategy"
 FRA_darlan_focus_3: "Beyond the Mountains"
 FRA_darlan_focus_0_desc:0 "Admiral François Darlan is not just a soldier. He dominates the navy like his personal army and is also an administrator with outstanding political sense. Now that the army is defeated, Darlan, who holds the intactly preserved naval power, is a powerful figure that cannot be ignored within the government-in-exile."
 FRA_darlan_focus_2_desc:0 "The sea is our lifeline. Admiral Darlan will seize the command of the Mediterranean sea based on powerful naval power. This is the core strategy for maintaining a communication network with the mainland, protecting the movement of goods between colonies, and blocking the enemy's maritime infiltration."
 FRA_darlan_focus_3_desc:0 "Our gaze does not only stay on the sea. Watching the situation on the Italian border and beyond the Alps, we will conceive bold operations linking naval infantry and mountain units if necessary. Crossing the mountains seems impossible, but for Darlan, nothing is impossible."

# François Darlan & Pierre Laval (Joint)
