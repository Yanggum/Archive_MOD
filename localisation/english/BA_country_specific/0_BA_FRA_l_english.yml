 FRA_GATHERING_STORM_DESC_1:0 "France, the country of culture and art, and the victor of the Great War, won the war with Germany and seized brilliant glory. When invaders from another world burned all of Europe and came toward France, which was continuing political turmoil in 1935, France resisted the invaders but ultimately was defeated and turned to the path of exile.\n\nThe situation of France right after the exile is full of only darkness. Internal chaos still persists, but everyone is together seeking a way to recover the mainland. If they are still French, the long journey to reclaim the mainland is already before their eyes."

