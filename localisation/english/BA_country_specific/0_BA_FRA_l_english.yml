 FRA_focus.1:0 "The Exile is Over!"
 FRA_focus.1_desc:0 "Pétain burned with the determination to reclaim the mainland again."
 FRA_focus.1_tt:0 "\n§4We will clarify the emergency situation and specifically review total plans to enter the mainland.§!" 
 FRA_focus_ind:0 "Industrialization Preparation"
 FRA_focus_ind_desc:0 "We will expand industry through many sacrifices."
 FRA_focus_2:0 "Total Mobilization" 
 FRA_focus_2_desc:0 "To build a building standing tall on a barren plain, much sacrifice is needed. Through total and swift manpower mobilization, we will achieve industrialization in a short period."
 FRA_focus_3.1:0 "Tunisia Development"
 FRA_focus_3.1_desc:0 "Industry comes before people. Won't we have to develop first to give welfare or freedom?"
 FRA_focus_3:0 "Algeria Development"
 FRA_focus_3_desc:0 "Industry comes before people. Won't we have to develop first to give welfare or freedom?"
 FRA_focus_4:0 "Morocco Development"
 FRA_focus_4_desc:0 "Industry comes before people. Won't we have to develop first to give welfare or freedom?"
 FRA_focus_5:0 "West Africa Development"
 FRA_focus_5_desc:0 "Industry comes before people. Won't we have to develop first to give welfare or freedom?"
 FRA_focus_6:0 "Large Flour Mill in Algiers"
 FRA_focus_6_desc:0 "The food industry will support large-scale labor reproduction."
 FRA_focus_6.5:0 "Right-wing Militia"
 FRA_focus_6.5_desc:0 "Western France is full of conservative resistance organizations that have firmly engraved conservative values in their hearts. They can be a great force for us."
 FRA_focus_6.8:0 "Underground Economy"
 FRA_focus_6.8_desc:0 "Through the mainland's underground economy, we will obtain necessary goods and can cause economic negative effects on the foreign powers that have usurped our territory now."
 FRA_focus_7:0 "Private Industry Cultivation"
 FRA_focus_7_desc:0 "The foundation of industry is private industry. Even if it is this hot African land, we must cultivate private industry to lay the foundation of industry."
 FRA_focus_9:0 "Algerian Credit and Finance Company"
 FRA_focus_9_desc:0 "We need to expand controllable financial organizations as institutions that accommodate land purchases and agricultural development funds for settlers within North Africa."
 FRA_market_ideology: "Free Trade"
 FRA_market_ideology_desc: "We have no funds for industrialization. We must open all doors and sell off resources."
 FRA_focus_9.5:0 "Public Construction"
 FRA_focus_9.5_desc:0 "To accelerate the repeated industrialization plans, we will create large-scale apartment complexes where workers can stay cheaply and sturdily."
 FRA_focus_state_corporatism: "State Corporatism"
 FRA_focus_state_corporatism_desc: "The state must guide the economy through the coordination of various vocational groups to ensure national harmony."
 FRA_focus_technocratic_economy: "Technocratic Economy"
 FRA_focus_technocratic_economy_desc: "Economic decisions should be made by experts and scientists to maximize efficiency and industrial output."
 FRA_focus_free_market_economy: "Free Market Economy"
 FRA_focus_free_market_economy_desc: "The invisible hand of the market will best allocate resources for our national recovery."
 FRA_focus_10: "Centralized Planning"
 FRA_focus_10_desc: "A centralized command economy is necessary to focus all national resources on the singular goal of liberation."
 FRA_focus_10.5:0 "Algerian Franc"
 FRA_focus_10.5_desc:0 "Through currency reform, we will completely adapt to the African economy."
 FRA_focus_10.7:0 "Railway Crossing the Sahara"
 FRA_focus_10.7_desc:0 "Due to the giant barrier called the Sahara Desert, West African inland regions are in a situation where it is difficult to procure goods. The Sahara railway will completely solve this and accelerate inland regional development."
 FRA_focus_10.6:0 "Dam Construction"
 FRA_focus_10.6_desc:0 "Plateaus are formed in the Algerian interior. We will build dams to develop those regions and actively utilize water resources."
 FRA_focus_8: "All-out Intelligence Network"
 FRA_focus_8_desc: "Information warfare is the core of modern warfare. Information from the mainland must be organically linked and utilized in military operations."
 FRA_focus_11:0 "Controlled Economy"
 FRA_focus_11_desc:0 "The market-oriented growth myth only works in normal times. The state must directly intervene and adjust all aspects of industry so that the economy can maintain its best state."
 FRA_focus_12: "Rebuilding the Ministry of Colonies" 
 FRA_focus_12_desc: "It is necessary to maximize the efficiency of colonial administration by rebuilding the Ministry of Colonies (Ministère des Colonies) which oversees colonial administration."
 FRA_focus_13: "Equatorial Rubber"
 FRA_focus_13_desc: "We can secure rubber, a strategic resource, in the equatorial region."
 FRA_focus_15:0 "Withdrawal from Indochina"
 FRA_focus_15_desc:0 "It is becoming clear that we can no longer maintain Indochina. We will abandon the colony while preserving as much profit as possible through an orderly withdrawal."

 FRA_industry_focus_0: "Agricultural Land Reclamation"
 FRA_industry_focus_0_desc: "As urbanization proceeds, a burden is being placed on agricultural production. To prevent famine during industrialization, we must reclaim wilderness as vast as southern France."
 FRA_industry_focus_1: "Mining Industry Subsidies"
 FRA_industry_focus_1_desc: "Minerals are 곧 foreign currency earnings. The mining industry is the very source of national wealth!"
 

 FRA_Deuxieme_Bureau: "Second Bureau"
 FRA_Deuxieme_Bureau_tt: "If an §YIntelligence Agency§! has been established, §Gimprove§! the §YIntelligence Agency§!."

 FRA_focus_arm_1: "War Preparation"
 FRA_focus_arm_1_desc: "In the sweltering heat of Africa, we must now prepare to fight."
 FRA_focus_arm_2: "Large-scale Amphibious Operation"
 FRA_focus_arm_2_desc: "We must collectively deploy large-scale landing forces at major strongholds. We will produce infantry proficient in amphibious warfare through landing craft research and mock training."
 FRA_focus_new_arm_1: "Infantry Operation Doctrine"
 FRA_focus_new_arm_1_desc: "Bleakly, in a situation where different perspectives on military systems are presented, we lack the capacity to proceed with innovative attempts. Instead, we will bring a calm advantage over the enemies through strong infantry operation tactics."
 FRA_focus_new_arm_2: "Dispersed Formation"
 FRA_focus_new_arm_2_desc: "We will fight flexibly over a wide range by dispersing infantry."
 FRA_focus_new_arm_3: "Barrage Deployment"
 FRA_focus_new_arm_3_desc: "We will concentrate fire by massing infantry."
 FRA_focus_arm_13: "Stormtroopers"
 FRA_focus_arm_13_desc: "We will complete the core of infantry-oriented doctrine by organizing elite stormtrooper units."
 FRA_focus_new_arm_8: "'Élan Vital'"
 FRA_focus_new_arm_8_desc: "'Élan Vital' is a glorious tradition of the French Grand Army that has been handed down for a long time. We must engage in the offensive with only a strong mental spirit, and ultimately completely collapse the enemy's formation through a bayonet charge." # Infantry ends here
 FRA_focus_arm_3: "Single Point Breakthrough"
 FRA_focus_arm_3_desc: "In a situation where the fire power of the enemies is unknown, recklessly pushing in infantry is no different from suicide. First, it is important to collapse the enemy's formation by pouring overwhelming fire on one place and safely landing our forces."
 FRA_focus_new_arm_5: "Fire Support Doctrine"
 FRA_focus_new_arm_5_desc: "We will develop a fire support doctrine for infantry support."
 FRA_focus_arm_5: "Ground Support"
 FRA_focus_arm_5_desc: "Close integration between air and land forces will ensure that our soldiers always have wings above them."
 FRA_focus_new_arm_6: "Naval Gunfire"
 FRA_focus_new_arm_6_desc: "We will support the infantry's advance by concentrating fire on landing operations through the support fire of naval guns."
 FRA_focus_new_arm_9: "Will for Strong Firepower"
 FRA_focus_new_arm_9_tt: "\nAcquire Innovation Points:\n§YLand Warfare§!: §R-2§!" # Artillery ends here
 FRA_focus_arm_15: "New French Military Science"
 FRA_focus_arm_15_desc: "We need to analyze the reason for the defeat in the last war and establish a new military science. Through this, we will achieve victory in the mainland recovery operation."
 FRA_focus_new_arm_12: "Hold Ground after Landing"
 FRA_focus_new_arm_12_desc: "We will have to block the enemy's counterattack with defense on the front line after landing."
 FRA_focus_new_arm_13: "Induce War of Attrition"
 FRA_focus_new_arm_13_desc: "Defense is asymmetrically advantageous compared to attack. It is necessary to cut the enemy's supply lines and steadily consume the enemy's manpower and materials."
 FRA_focus_new_arm_14: "Well-planned Offensive"
 FRA_focus_new_arm_14_desc: "We must catch the enemy off guard through carefully planned offensives and collapse the enemy's formation." # Trench warfare ends here
 FRA_focus_arm_3.5: "Cavalry Tank Operation"
 FRA_focus_arm_3.5_desc: "[FRA_charles_de_gaulle.getname] and his supporters are importantly mentioning the historic victory at the 'Siege of Eridu' near Paris during the last defeat. At that time, [FRA_charles_de_gaulle.getname] utilized armored divisions based on maneuver warfare doctrine to completely destroy the enemy's second stronghold, which was a major victory that allowed the government to hold out for a month. For this reason, they want to organize mobile units and perform maneuver warfare in the mainland recovery operation."
 FRA_armor_factory: "Expansion of Production Facilities"
 FRA_armor_factory_desc: "The operation of armored divisions requires large-scale production facilities. We will increase the production of armored equipment by expanding the production facilities of tank factories."
 FRA_focus_new_arm_7: "Armored Showdown"
 FRA_focus_new_arm_7_desc: "We must break through the front line through maneuver warfare using cavalry tanks and fight a large-scale showdown with the enemy's main units." # Cavalry tanks end here
 FRA_focus_arm_4: "North African Army"
 FRA_focus_arm_4_desc: "It is necessary to merge military units that served on the mainland with military units serving in Africa and African military units. The new 'North African Army' will take the lead in mainland recovery as the regular army of the government-in-exile."
 FRA_focus_arm_14: "Foreign Legion Expansion"
 FRA_focus_arm_14_desc: "Natives of West Africa are Frenchmen like us even if they don't live on the mainland. We will expand the Foreign Legion so that many natives can serve in the Foreign Legion for France."
 FRA_focus_new_arm_4: "Muslim Warriors"
 FRA_focus_new_arm_4_desc: "It is necessary to once again co-opt great North African warrior groups like the Tirailleurs, Moroccan Goumiers, Spahis, and Chasseurs d'Afrique into France and nurture them."
 FRA_focus_new_arm_4_tt: "\n§YMuslim divisions§! from §YNorth Africa§! join §GFrance§!.\n\n"
 FRA_focus_new_arm_10: "Utilization of Captured Equipment"
 FRA_focus_new_arm_10_desc: "The securing of equipment is a major matter in operating a large-scale infantry. We will ensure the sustainability of the military supply system by capturing infantry equipment from the enemies."
 FRA_focus_new_arm_10_tt: "§GUsable§! during §4Mainland Recovery Showdown§!:\n"
 FRA_focus_new_arm_11: "Glory of the Grand Army"
 FRA_focus_new_arm_11_desc: "By reviving the glorious traditions of the French Grand Army, we will boost the morale of the North African Army and improve its combat power." # Foreign Legion ends here
 FRA_focus_new_arm_0: "High Institute of National Defense"
 FRA_focus_new_arm_0_desc: "Theories on the patterns and strategies and tactics of modern warfare are changing moment by moment. We will create a department to respond to these changes." 
 FRA_colonial_munitions_industry: "Operation of Colonial Arsenals"
 FRA_colonial_munitions_industry_desc: "We will operate arsenals in North Africa to support the production of military supplies for mainland recovery."
 FRA_focus_arm_6: "Halo Counter-technology"
 FRA_focus_arm_6_desc: "To defeat those with halos who do not fall to rifle bullets, more powerful fire power is needed. Anti-tank guns might be the answer to this." 
 FRA_vertical_integration: "Merging Small and Medium Industries"
 FRA_vertical_integration_tt: "§YNorth African§! states with §Y2§! or more §YCivilian Factories§!:"
 FRA_focus_arm_11: "Motorized Tactics"
 FRA_focus_arm_11_desc: "In the current situation, there are many difficulties in producing tanks with armor. It is time to design relatively cheap and fast vehicles by introducing technology." # High Institute ends here
 FRA_focus_arm_8: "Regrouping the Navy"
 FRA_focus_arm_8_desc: "There are dozens of warships used to escape from the mainland. We must systematically organize the ships remaining now and prepare for the future." 
 FRA_focus_arm_9: "Establishment of Marine Corps"
 FRA_focus_arm_9_desc: "We need to establish a Marine Corps that cooperates closely with the Navy to maximize the success rate in amphibious operations."
 FRA_focus_new_arm_15: "Amphibious Tank Development" 
 FRA_focus_new_arm_15_desc: "Powerful amphibious tank battalions will crush enemies at landing points and break through the front line at high speed. We will develop these and deploy them to the Marine Corps."
 FRA_focus_arm_10: "Shipyard Construction"
 FRA_focus_arm_10_desc: "The shipbuilding industry in North Africa is currently not sufficient to maintain and repair our fleet. We need to secure the sustainability of naval power by building shipyards."
 FRA_focus_arm_12.5: "Focus on Fleet Reconstruction"
 FRA_focus_arm_12.5_desc: "The place where we were defeated was the land, not the sea. Rather, the sea can be seen as a place of victory for us. This is because we possess almost all the ships from the time of our exile. We will solidify our superiority at sea by focusing on naval power reconstruction."
 FRA_naval_arms_race: "Naval Arms Race"
 FRA_naval_arms_race_desc: "French naval officers are very anxious that the [MIL.getadjective] navy will surpass our naval power. We will jump into the naval arms race for naval power enhancement."
 FRA_make_auxiliary: "Construction of Auxiliary Ships"
 FRA_make_auxiliary_desc: "We will focus on the construction of auxiliary ships to cultivate appropriate naval power."
 FRA_focus_arm_12: "Capital Ship Sale"
 FRA_focus_arm_12_desc: "The current French navy is oversaturated to the point where maintenance in North Africa is burdensome. We need to reorganize the navy to a manageable level by selling some capital ships."
 FRA_make_submarine: "Focus on Submarines"
 FRA_make_submarine_desc: "Submarines are the most effective means to block the enemy's sea supply lines. We will focus on submarine construction to improve sea supply line blocking capabilities."
 FRA_naval_commander: "Naval Operations Command"
 FRA_naval_commander_desc: "It is necessary to increase the efficiency of naval operations by establishing the Naval Operations Command."
 FRA_control_mediterrian: "Control of Western Mediterranean"
 FRA_control_mediterrian_desc: "Since our naval power is sufficiently superior compared to the enemy, the French Navy can control the entire Mediterranean, making it possible to execute operations more smoothly."
 FRA_control_mediterrian_tt_1: "When focus §Y$FRA_focus_arm_12.5$§! is completed:\n  "
 FRA_control_mediterrian_tt_2: "When focus §Y$FRA_focus_arm_12$§! is completed:\n  " # Navy ends here
 FRA_focus_arm_7: "Preparation for Mainland Air War"
 FRA_focus_arm_7_desc: "Our air force was helpless against the powerful jet fighters of [MIL.getadjective]. we need to cultivate an air force that can oppose jet fighters in preparation for the mainland air war."
 FRA_focus_arm_9.5: "Fighter Development"
 FRA_focus_arm_9.5_desc: "Fighters are the most important factor in seizing air superiority. We will focus on fighter development."
 FRA_focus_arm_8.5: "Close Air Support Aircraft Development"
 FRA_focus_arm_8.5_desc: "We need aircraft to support the army's offensive."
 FRA_focus_new_arm_16: "Establishment of Aircraft Manufacturing Facilities"
 FRA_focus_new_arm_16_desc: "We will lay the foundation for air power enhancement by establishing aircraft manufacturing facilities."
 FRA_paratroopers: "Nurturing Paratroopers"
 FRA_paratroopers_desc: "We will secure the ability to disturb the enemy's rear and launch surprise strikes by nurturing paratroopers."
 FRA_stop_air: "Giving Up on Air War"
 FRA_stop_air_desc: "In a situation where selection and concentration are forced, there is no room to support the air force. We will give up victory in the air war and instead focus on ground force support."
 FRA_defense_air: "Anti-air Defense"
 FRA_defense_air_desc: "The enemy's air war capability is threatening. We will suppress the enemy's air war capability by focusing on anti-air defense."
 FRA_sell_airplane: "Selling Aircraft"
 FRA_sell_airplane_desc: "We will invest in other sectors by selling aircraft." # Air force ends here

 FRA_authenticity_in_the_international_community: "Confirmation of Legitimacy in the International Community"
 FRA_authenticity_in_the_international_community_desc: "After the coup, our government has been undergoing controversy regarding whether it is a legitimate government-in-exile. This task must be resolved."
 FRA_mediterranean_diplomacy: "Mediterranean Diplomacy"
 FRA_mediterranean_diplomacy_desc: "To reclaim the mainland, a landing in the Mediterranean direction is inevitable, and to this end, securing the command of the Mediterranean sea must be supported. Although there may be a difference in the level of our fleet and the enemy's, we can overcome this difference through diplomacy with Mediterranean countries that are still robust."
 FRA_confirm_italian_hegemony: "Recognition of Italian Hegemony"
 FRA_confirm_italian_hegemony_desc: "Italy, which became our ally with the signing of the Stresa Front, currently reigns as the hegemon of the Mediterranean. Although pride may be crushed, we must maintain a friendly relationship by recognizing their hegemony in the Mediterranean. Their help is essential to seize the command of the Mediterranean."
 FRA_italian_invest: "Investment from Italian Industrialists"
 FRA_italian_invest_desc: "Many Italian industrialists are interested in the profits earned in the North African colonies."
 FRA_give_tunigia_invesment_right: "Granting Investment Rights in Tunisia"
 FRA_give_tunigia_invesment_right_desc: "Italian capitalists are looking for a new land of opportunity worth investing in, and we need their industrial investment. We can secure their investment in exchange for influence over Tunisia."
 FRA_in_the_same_boat: "In the Same Boat" 
 FRA_in_the_same_boat_desc: "A commonality exists between Spain and us in that we have lost territory to the outsiders. We need Spain's help to reclaim the mainland, and Spain needs us to drive out the outsiders and reunify Spain. Spain and France are in the same boat."
 FRA_barrier_against_kivotos-Bolshevism: "Barrier Against Interdimensional-Bolshevism"
 FRA_barrier_against_kivotos-Bolshevism_desc: "Outsiders and reactionary forces are positioned around the Catalan mountains. If we help Spain defeat them, Spain might lend strength to our mainland recovery war."
 FRA_north_africa_road: "North African Highway"
 FRA_north_africa_road_desc: "Our and Spanish colonies are adjacent, making them perfect for transporting goods. We can further promote goods transport by building a highway in North Africa."
 FRA_trade_treaty: "Mediterranean Trade"
 FRA_trade_treaty_desc: "Our ally, Britain, is in a situation where it's hard to provide timely economic support due to geographical limits. We can solve this problem by promoting trade with Mediterranean countries."
 FRA_mediterranean_economic_bloc: "Pan-Mediterranean Economic Zone"
 FRA_mediterranean_economic_bloc_desc: "Amid active trade between countries surrounding the Mediterranean, we must unite this into one economic zone and mobilize all capabilities."
 FRA_mediterranean_economic_bloc_tt: "Country possessing National Spirit §Y$FRA_mediterranean_trade_treaty$§!:"
 FRA_solidarity_between_governments_in_exile: "Solidarity between Governments-in-Exile"
 FRA_solidarity_between_governments_in_exile_desc: "After the Great Transfer, European countries that have lost their mainland, including us, are burning with enthusiasm toward mainland recovery. Although one national power may be insignificant, we can fill the national power gap through solidarity between governments-in-exile."
 FRA_halifax_conference: "Halifax Conference"
 FRA_halifax_conference_desc: "We and Britain were once the rulers of the world but had that position taken away by outsider countries due to the Great Transfer. Since coordination with Britain is essential to reclaim the mainland and restore the world order again, we have requested a meeting with them."
 FRA_invest_from_anglo_financier: "Investment from Anglo-Financiers"
 FRA_invest_from_anglo_financier_desc: "The United Kingdom is currently the most powerful country of finance. Even though they are in exile, we can become powerful if we attract investment from them."
 FRA_befriend_with_belgium: "Mainland Recovery Coordination with Belgium"
 FRA_invest_from_belgian_capitalist: "Investment from Wealthy Congo Capitalists"
 FRA_mining_rubber_with_bel: "Equatorial Rubber Collaborative Collection"
 FRA_belgian_model: "Belgian Model"
 FRA_claim_hegemony_on_equatorial_africa: "Equatorial Africa Hegemony"
 FRA_ouster_the_king: "Ousting the Oppressor King"
 FRA_belgium_provisional_mainland_restoration_government: "Belgian Provisional Mainland Recovery Government"
 FRA_befriend_with_netherland: "Friendship with the Dutch Government-in-Exile"
 FRA_befriend_with_netherland_desc: "The Dutch government is also in a situation where they fled to the East Indies due to the outsider attack like us. However, they are in a predicament due to Indonesian rebels. If by any chance the rebels win, the decolonization flow could become a global trend. We can no longer overlook this."
 FRA_focus_on_colonial_deiplomacy: "Focus on Colonial Diplomacy"
 FRA_focus_on_colonial_deiplomacy_desc: "We must pay attention not only to the African colonies but also to the colonies in the Middle East and Asia. We will secure control by France in Syria and Indochina."
 FRA_military_minister_to_indochina: "Dispatching Military Governor to Indochina"
 FRA_french_indochina: "French Indochina Development"
 FRA_french_indochina_desc: "There are abundant natural resources in Indochina. It is necessary to improve our industry by developing this region."
 FRA_withdraw_from_indochina: "Indochina Industrial Recovery"
 FRA_withdraw_from_indochina_desc: "We cannot maintain the unstable Indochina region forever. It is desirable to appropriately recover major industries and invest them in Algiers."
 FRA_withdraw_from_indochina_tt: "From each country to @FRA§Y[FRA.getadjective]§!:\n"
 FRA_southeast_asia_economic_bloc: "Southeast Asian Economic Bloc"
 FRA_southeast_asia_economic_bloc_desc: "The economic bloc founded under the leadership of [FRA.getadjective] aims for mutually beneficial economic cooperation, technology transfer, and trade alliance between member countries. In this economic community, France holds only the status of observer, but since France controls the voting rights of participating Vietnam, Laos, and Cambodia, France effectively serves as chairman."
 FRA_intervention_to_middle_east: "Intervention in the Middle East"
 FRA_intervention_to_middle_east_desc: "A large-scale fierce battle is taking place in the Middle East region. We cannot help but intervene to protect our interests."
 FRA_french_syr: "French Syria"
 FRA_french_syr_desc: "We must restore French Syria to provide our bridgehead in the Middle East again."
 

 FRA_focus_resistance_1:0 "Contact with the Mainland"
 FRA_focus_resistance_1_desc:0 "We have made contact with Resistance comrades active on the mainland. We must cooperate with them to reclaim our hometown."
 FRA_focus_resistance_2:0 "Active Approach"
 FRA_focus_resistance_2_desc:0 "In the last war, France won with a desperate defense tactic, but this time the enemies broke through our France's defense and won. Now we must strive for active mainland recovery, like the enemies of the past."
 FRA_focus_resistance_3:0 "Prudent Approach"
 FRA_focus_resistance_3_desc:0 "The reason we were defeated by the outsider enemy in an instant was not only the difference in combat power with the enemy, but also because there was no accurate information about the enemy's army. Taking lessons from past failures, we must approach while looking more prudently at the enemy's strategy and tactics."
 FRA_focus_resistance_4:0 "Rural Resistance Army"
 FRA_focus_resistance_4_desc:0 "Peasants faithful to the Catholic faith live in the fertile large plains of southern France. They are not united, but they will show a unified appearance in the fight with the outsiders."
 FRA_focus_resistance_5:0 "Toward a Cozy Place"
 FRA_focus_resistance_5_desc:0 "All preparations are finished. The French Grand Army, Navy, and Air Force are glaring at the invaders for their families. It is difficult to guarantee our victory, but we must go. Toward a cozy place!"
 FRA_ita_is_helping_tt:0 "\nSince §Y[ITA.getname]§! accepted our request, §YResistance units§! will rise up on the §YMillennium - [ITA.getname]§! border."
 FRA_spr_is_helping_tt:0 "\nSince §Y[SPR.getname]§! accepted our request, §YResistance units§! will rise up on the §YMillennium - [SPR.getname]§! border."
 FRA_focus_resistance_7:0 "Widespread Propaganda"
 FRA_focus_resistance_7_desc:0 "Now all citizens remaining on the French mainland need to know. We will post leaflets on the streets and announce our great will through radio broadcasts."
 FRA_focus_resistance_6:0 "Red Guerillas"
 FRA_focus_resistance_6_desc:0 "The French Communist Party has the largest resistance organization on the mainland. They link farms and factories, use universities as strongholds, carry and move media here and there, and perform guerrilla warfare in the northern port zones and Paris industrial zones."
 FRA_when_uprise: "When focus §Y$FRA_focus_resistance_14$§! is completed:\n"
 FRA_focus_resistance_9:0 "Organizing Resistance Liberation Army"
 FRA_focus_resistance_9_desc:0 "With the information brought by the Resistance who returned to the mainland, we realized that Millennium is currently in a confusing situation. Seizing this opportunity, all French citizens will take up weapons and drive out the outsider invaders and return home at any cost." 
 FRA_focus_resistance_10: "Liaison Office"
 FRA_focus_resistance_10_desc: "Establishing a sustainable communication system with the Resistance will make more efficient war execution possible."
 FRA_focus_resistance_8:0 "General Strike"
 FRA_focus_resistance_8_desc:0 "Among the comrades on the mainland, there are a few who can contact factory workers secretly. Conducting a large-scale general strike centering on them will temporarily paralyze the enemies' industry and help the main force's advance."
 FRA_focus_resistance_11:0 "Militia Training"
 FRA_focus_resistance_11_desc: "Ordinary citizens must be trained to become the silent army that will reclaim France from within."
 FRA_focus_resistance_12:0 "Port Infiltration"
 FRA_focus_resistance_12_tt: "§YResistance units§! will rise up in the §Yport cities§! of the mainland."
 FRA_focus_resistance_12_desc: "Infiltrating major ports will provide us with the necessary beachheads for our grand return."
 FRA_focus_resistance_13: "Coastal Reconnaissance"
 FRA_focus_resistance_13_desc: "Pre-information to perform amphibious operations is essential."
 FRA_focus_resistance_14:0 "Uprising!"
 FRA_focus_resistance_14_desc:0 "The Resistance is prepared! It is time to deliver a systematic blow to the enemy's heart!"
 FRA_prepare_for_naval_invasion: "Preparation for Amphibious War"
 FRA_prepare_for_naval_invasion_desc: "Coordinating our fleet with the ground forces will ensure a safe landing on the motherland's shores."

 FRA_focus_garrison_0: "Garrison Management"
 FRA_focus_garrison_0_desc: "Stabilizing our current territories is the first step toward reclaiming our lost ones."
 FRA_focus_garrison_1: "Adjustment of Interests"
 FRA_focus_garrison_1_tt: "§gThis branch will lower the French crisis stage by adjusting interests between French and colonials.§!"
