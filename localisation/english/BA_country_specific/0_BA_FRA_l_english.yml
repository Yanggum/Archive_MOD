 FRA_promise_cut:0 "Strong Colonial Resistance"
 FRA_promise_cut_desc:0 "Trusting the government's promise, hundreds of thousands of colonial men lost their lives on the battlefield, and hundreds of thousands of colonial women worked in workshops day and night. They can no longer trust the government and can throw away their ruined lives at any time to gain independence."
