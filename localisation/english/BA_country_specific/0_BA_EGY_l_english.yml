 EGY_south_africa.64.c:0 "아직은 상황이 이를 허락하지 않는다."
EGY_event.1.t:0 "아비도스 대책위원회의 망명"
EGY_event.1.d:0 "아비도스가 무너지고 적들의 수중에 떨어졌다. 그들은 대책위원회를 수배하며 아비도스 천명의 끝을 가져오리라 선언했다. 아비도스 교사의 농성은 며칠간의 전투로 끝났으며, 정겨운 고향 땅을 떠나야 함은 자명한 사실이 되었다.\n\n1만 명의 아비도스인, 그리고 1천 명의 현지인. 그들 살던 땅에 남은 대부분의 사람들과 다른 선택을 한 무리는 정처 없는 여행을 따라나섰다. 다뉴브를 건너, 보스포루스를 넘어. 끝도 보이지 않을 사막 저 너머로.\n\n제 살기 바쁜 시대에 그들을 받아주는 이들이 있을 리 무방했다. 더군다나 신비도 없는 이들이 어떻게 살아남겠는가ㅡ 모두가 걱정하던 사안이었으며, 모두 숨을 거둠으로 종언을 고했다. \n\n신비를 가진 이들은 슬퍼할 겨를이 없었다. 총탄 한두 발에 죽을 리 만무한 이들, 강한 아이들도 병과 굶주림에 어쩔 도리가 없었다. 하나, 둘 죽어나가는 소녀들을 뒤로한 채 해안을 따라 걸어나갔다. 그저 자그마한 안식처를 찾거나, 모두가 하늘 천명의 부름을 받을 때까지....\n\n그리고 이집트가 있었다.\n\n목에 사슬을 걸어 종속하던 브리튼이 무너지고 진정한 자유를 누리는 줄 알았다. 사하라 깊은 곳의 괴수가 움직이며 수만 명을 죽음으로 몰아넣은 후에야 자유의 대가를 치루어야 함을 알았다. 총탄, 포탄 한 발이 먹히지 않는 괴물에게 무력함을 느끼며 유럽을 유린한 키보토스 학원들에게 도움을 청했다. 답신이 오지 않았다.\n\n좌우를 막론한 모두가 무력감에 휩싸일 때쯤, 아비도스 무리라는 것들이 시나이 국경을 두드렸다. 헤일로가 있다. 신비를 가지고 있었다. 수천 년 고도를 넘보는 괴수를 물리칠 수 있는 이들이었다. 겨우 3백 명 남짓한 이들임에도, 분명 희망의 불빛이었으리라.\n\n이집트는 그들을 두 팔 벌려 환영해주었고,"
EGY_event.1.a:0 "아비도스는 마침내 안식처를 찾았다."

EGY_event.2.t:0 "수단의 총독"
EGY_event.2.d:0 ""전하, 그게 무슨 말씀이십니까. 돌아가라니요?"\n\n'스튜어트 경' 세이머스는 실색했다. 카이로 왕궁으로 오라는 긴급한 연락을 받고 비행편을 구했건만, 정작 받아들은 소식이 이 꼴이라니.\n\n"제가 수단에서 얼마나 많은 것들을 이루었는지 아시지 않습니까. 겨우 2년입니다. 아직 끝내지 못한 정책들이 수두룩한데, 겨우 이렇게 끝날 수는 없는 일입니다."\n\n"미안하지만 그 청을 윤허할 수 없네. 버킹엄은 자네가 수단 총독으로 재임하는 것을 더 이상 원치 않는 모양이더군. 그 명령을 내가 어떻게 거역하겠나? 국왕 폐하의 충성스러운 신민인 자네가 더 잘 알잖나."\n\n"그럴거면 내각은 왜 저를 탕가니카에서 데려왔답니까? 그 사람들은 아직 제가 필요합니다."\n\n"다시 말하지만, 내게는 버킹엄의 명령을 돌려보낼 권한이 없네. 잉글랜드로 돌아가서 잘 말해 보던가."\n\n지난 세월이 무색해지는 순간이다. 수단 총독으로 부임한 시절, 폐하의 명을 받들어 그들을 위한 정책을 주선하리라 결심했다. 그러나 경제 계획도 얼추 5년여를 잡는다는데, 2년의 시간은 너무도 짧다.\n\n그러나 내가 무엇을 할 수 있으랴. 내각은 그저 나보다 나은 이를 찾아냈기에 돌아오라 손짓할 뿐이니.\n\n"······캐나다로 돌아가겠습니다. 오타와 한구석에 처박혀 정계에 제 자리 따위는 없다는 것을 알게 되겠지요."\n\n언제나 유럽에만 집중하는 놈들이 아프리카에 신경을 쓸 리 없으니까.\n\n국왕은 그저 나를 바라보다, 안부의 말을 전했다."
EGY_event.2.a:0 ""잘 가게. 그동안 고생했네.""

EGY_event.3.t:0 "푸아드 1세의 사망"
EGY_event.3.d:0 "푸아드 1세 사망, 파루크 1세 즉위."
EGY_event.3.a:0 "파루크 1세 만세!"

EGY_event.4.t:0 "아비도스"
EGY_event.4.d:0 ""상부에서는 그대들의 망명을 수용하는 조건을 수용하기로 결정했습니다. 이에 대하여 괴수 ‘비나’ 격퇴에 협조할 것을 요구하고 있습니다."\n"알겠어. 대책위원회는 즉시 투입할 준비가 되어 있지만, 그동안 다른 사람들은 회복할 수 있도록 미리 거처를 마련해줘."\n\n한참을 상호 조건을 읊으며, 관료와 대책위원회는 대화를 이어갔다.\n\n"정착지는 카이로 중심부로 정하겠습니다."\n"…가능하다면 소도시로 해줘. 키보토스인들은 현지인과는 달라 대도시에서 살기 힘들 거야. 우리는 소도시에서 정착하기를 원해."\n\n이에, 관료는 자료를 뒤적였다. 애초에 카이로의 집성촌에 키보토스인들을 수용할 계획이었지만, 이게 크나큰 차질은 아니다. 이들이 왔던 곳의 이름이….아…아비도스. 그래. 아비도스라면…\n\n"음… 잠시만요. 당신들이 온 곳과 이름이 같은 ‘아비도스’라는 소도시가 있습니다. 그곳은 어떻습니까?"\n"아비도스…"\n\n아비도스. 이집트 역사상 최초의 수도로 쓰인 도시. 그러나 지금은 별 볼일 없는 유적지요 소도시다. 과연 이 도시에 이들을 정착시키면, 결국 득이 될지 실이 될지. 관료는 자신의 상관은 아니라고, 생각하기로 결심했다.\n\n"좋습니다. 그러면 모든 조건은 합의된 것으로 처리하겠습니다.""
EGY_event.4.a:0 ""좋아. 그럼, 어디로 가야 할까?""

EGY_event.5.t:0 "새벽의 호루스"
EGY_event.5.d:0 "새벽의 어스름 속, 주민이 소개된 알 파이움에 병사는 홀로 남았다. 대대의 전우들이 모두 사라진 지금, 괴수가 입에서 광선을 뿜으려는 그 찰나, 그의 몸은 이미 한계에 다다라 주저앉을 수밖에 없었다. 절망의 그림자가 그의 마음을 감싸는 순간, 하늘을 가르듯 혜성처럼 나타난 한 소녀가 보였다. 그 소녀는 마치 천상의 사자처럼 당당하게 뛰어들었다. 그녀의 눈빛은 불꽃처럼 타올랐고, 손에 쥔 무언가로 괴수를 강타하자, 아무리 공격해도 끄떡없던 괴수는 격렬하게 흔들렸다. 그는 그 광경에 말문이 막혔다.  \n\n그의 눈앞에서 펼쳐진 이 놀라운 전환은, 마치 고대 신 호루스의 눈부신 모습을 연상케 했다. 모든 전우들이 사라진 채, 그는 그 소녀의 용기와 힘에 경탄과 두려움이 뒤섞인 감정을 느꼈다. 비나가 그녀에게 시선을 돌리는 틈을 타 몸을 돌려 도망쳤다. 도망치던 그의 마음 한켠에서는, 소녀의 모습이 빛나는 호루스의 신비로운 형상처럼 선명하게 떠올라, 잊을 수 없는 인상을 남겨주었다.  "
EGY_event.5.a:0 "그리고 그것이 새벽의 호루스라는 이명의 시작이었다."

EGY_event.6.t:0 "1939년 사관학교 졸업식"
EGY_event.6.d:0 "1939년, 대전이 발생 3년 이후, 대전이의 여파에도 불구하고 이집트 사관학교 졸업식은 평소 정해진 절차에 따라 진행되었다. 졸업식장에는 정복을 단정히 입은 생도들이 차례로 계단을 내려왔으며, 공식 의전과 함께 졸업증서 수여가 이루어졌다. 졸업생 대표 가말 압델 나세르는 졸업생들 앞에서 짧은 연설을 하였으며, 졸업생들은 곧 수단으로 이동하여 장교로써 복무를 시작할 예정이다."
EGY_event.6.a:0 "어서 오라!"

