 EGY_event.1.t:0 "Exile of the Abydos Foreclosure Task Force"
 EGY_event.1.d:0 "Abydos has fallen into the hands of its enemies. They have declared they will hunt the Task Force and bring an end to the Abydos mandate. The Abydos Teacher's holdout ended after several days of fighting, and it became a clear reality that they must leave their beloved homeland.\n\nTen thousand Abydosians, and one thousand locals. The group that made a different choice from most who remained on the land set out on a wandering journey. Crossing the Danube, over the Bosphorus. Beyond that endless desert.\n\nIn an age where everyone was busy surviving, it was unlikely anyone would take them in. Furthermore, how would those without Mystery survive? It was a concern shared by all, and it seemed to end with everyone's death.\n\nThose with Mystery had no time to grieve. Although they were unlikely to die from a bullet or two, the strong girls could do nothing against disease and hunger. Leaving behind the girls dying one by one, they walked along the coast. Simply looking for a small sanctuary, or until everyone received the call of the heavenly mandate....\n\nAnd then there was Egypt.\n\nThey thought they were enjoying true freedom after Britain, which had shackled them, collapsed. They only realized they had to pay the price of freedom after the monster deep in the Sahara moved and drove tens of thousands to death. Feeling helpless against the monster that bullets and shells could not affect, they asked for help from the Kivotos academies that ravaged Europe. No reply came.\n\nJust when everyone, regardless of left or right, was swept by a sense of helplessness, a group called Abydos knocked on the Sinai border. They had halos. They possessed Mystery. They were ones who could repel the monster threatening the thousand-year-old city. Though only about 300 members, they must have been a light of hope.\n\nEgypt welcomed them with open arms,"
 EGY_event.1.a:0 "Abydos finally found a sanctuary."

 EGY_event.2.t:0 "The Governor-General of Sudan"
 EGY_event.2.d:0 "\"Your Highness, what are you saying? Return?\"\n\nSir Stewart Symes was aghast. He had secured a flight after receiving an urgent contact to come to the Cairo Palace, but the news he received was this.\n\n\"Do you not know how much I have achieved in Sudan? It has only been two years. There are numerous policies I have yet to finish; it cannot end like this.\"\n\n\"I am sorry, but I cannot grant that request. It seems Buckingham no longer wants you to serve as the Governor-General of Sudan. How could I disobey that order? You, a loyal subject of His Majesty, should know better.\"\n\n\"Then why did the cabinet bring me from Tanganyika? Those people still need me.\"\n\n\"Again, I do not have the authority to send back Buckingham's order. Go back to England and talk to them yourself.\"\n\nIt is a moment where the past years become meaningless. When appointed as the Governor-General of Sudan, he resolved to arrange policies for them following His Majesty's order. However, even economic plans are said to take about five years; the time of two years is too short.\n\nBut what could I do? The cabinet is simply beckoning me back because they found someone better than me.\n\n\"······I will return to Canada. I will find out in a corner of Ottawa that there is no place for me in politics.\"\n\nBecause those who only focus on Europe will never care about Africa.\n\nThe King just looked at me and sent words of greeting."
 EGY_event.2.a:0 "\"Farewell. You have worked hard.\""

 EGY_event.3.t:0 "Death of Fuad I"
 EGY_event.3.d:0 "Fuad I dies, Farouk I ascends the throne."
 EGY_event.3.a:0 "Long live Farouk I!"

 EGY_event.4.t:0 "Abydos"
 EGY_event.4.d:0 "\"The superiors have decided to accept the conditions for accepting your exile. In return, we require cooperation in repelling the monster ‘Binah’. \"\n\"Understood. The Task Force is ready to be deployed immediately, but please prepare a place for the others to recover in the meantime.\"\n\nThe official and the Task Force continued the conversation, reciting mutual conditions for a while.\n\n\"The settlement will be in the center of Cairo.\"\n\"…If possible, make it a small town. Kivotos people are different from locals and will find it hard to live in a big city. We want to settle in a small town.\"\n\nAt this, the official rummaged through the data. He originally planned to accommodate the Kivotos people in a collective village in Cairo, but this is not a major setback. The name of the place they came from was….Ah…Abydos. Yes. If it's Abydos…\n\n\"Um… Wait a moment. There is a small town called ‘Abydos’ that has the same name as the place you came from. How about that?\"\n\"Abydos…\"\n\nAbydos. The city used as the first capital in Egyptian history. However, now it is just an unremarkable ruin site and a small town. Whether settling them in this city will ultimately be a gain or loss—the official decided to think that it's not his concern.\n\n\"Good. Then all conditions will be treated as agreed.\""
 EGY_event.4.a:0 "\"Good. Then, where should we go?\""

 EGY_event.5.t:0 "Horus of the Dawn"
 EGY_event.5.d:0 "In the dim light of dawn, a soldier was left alone in Al Fayoum where the residents had been evacuated. With all the comrades of his battalion gone, at the moment when the monster was about to spit light from its mouth, his body had already reached its limit and he had no choice but to collapse. At the moment despairing shadows enveloped his heart, a girl who appeared like a comet cutting through the sky was seen. That girl jumped in boldly like a heavenly messenger. Her eyes burned like flames, and when she struck the monster with something she held in her hand, the monster, which had been unperturbed no matter how much it was attacked, shook violently. He was speechless at the sight.\n\nThis surprising turnaround that unfolded before his eyes was reminiscent of the dazzling appearance of the ancient god Horus. With all his comrades gone, he felt a mix of admiration and fear at the girl's courage and strength. Taking advantage of the moment Binah turned its gaze to her, he turned around and fled. In a corner of his heart while fleeing, the girl's appearance vividly floated up like the mysterious form of the shining Horus, leaving an unforgettable impression."
 EGY_event.5.a:0 "And that was the beginning of the epithet 'Horus of the Dawn'."

 EGY_event.6.t:0 "1939 Military Academy Graduation"
 EGY_event.6.d:0 "In 1939, three years after the Great Shift, the Egyptian Military Academy graduation was held according to the usual procedures despite the aftermath of the shift. At the graduation hall, cadets in neat dress uniforms came down the stairs in turn, and the graduation certificate ceremony was held with official protocol. Valedictorian Gamal Abdel Nasser gave a short speech in front of the graduates, and the graduates are scheduled to move to Sudan soon to begin their service as officers."
 EGY_event.6.a:0 "Welcome!"

