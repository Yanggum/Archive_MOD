EGY_event.22.t:0 "모하메드 나기브"
EGY_event.22.d:0 "모하메드 나기브는 담뱃연을 내뿜으며 참모본부에 들어섰다. 나의 가장 친애하는 부관ㅡ 가말 압델 나세르는 긴장한 채 대기하고 있었다. 그를 잠시 바라보고는, 어깨를 탁탁 쳐주었다. 긴장은 풀리지 않았다.\n\n"앉게. 할 이야기가 있다고.“\n\n대서 열방이 아프리카를 짓밟음에도 사막은 두려운 존재로 군림했다. 나일은 그 두려움으로부터 이집트를 지키는 핏줄로써 기능해왔고, 파라오는 이를 지배하며 권위를 행사했다. 이집트가 영국의 군홧발에 신음하며 왕가의 권위가 사라지고도, 그들은 아직 자신들이 파라오의 핏줄인 양 행세한다.\n\n이 모든 억압을 끝내기 위한 혁명은 두 사람의 염원이었다. 독일과 맞서 싸웠던 전쟁이 끝났지만 변한 건 없기에, 모든 이집트인이 평등하게 살아가는 세상을 보고 싶기에 우리는 감히 총칼로써 진정한 독립을 쟁취하려 들 것이다. \n\n”일전에 이야기한 건입니다. 명목상이라 할지라도, 그녀를 군사 정부의 지도자로 세우는 걸....“\n\n”안 되네.“\n\n나세르는 조용히, 그러나 근엄하게 말을 끊어버렸다. \n\n”오래도록 이야기하지 않았나. 이 혁명을 성공시키려면 우리는 공화정을 세워야 한다고. 왕정에 대항하는 왕정이라니, 세간이 도대체 어떻게 생각하겠나. 그 외계인 소녀를 여왕으로 세우는 건 우리의 정체성을 스스로 부정하는 일일세. 이건 이집트 민족의 일이지 아비도스의 일이 아니야. 미안하지만 연속되는 왕정은 있을 수 없네.“\n\n나세르는 눈을 감았다. 대령에 대한 존경은 여전했지만, 오늘 이 순간만큼은 그를 설득하는 일이 쉽지 않다는 것을 느끼고 있었다.\n\n”대령님, 우리는 이집트를 핍박하는 이들을 위해 싸워나가는 것이지 민족주의 따위를 위해 싸우는 게 아닙니다. 왕정이든 공화정이든, 상관없지 않습니까? 설령 민족의 길이 옳다고 하더라도 민족이 원하는 지도자를 정하는 데에 시간을 낭비할 수는 없는 일입니다. 저는 그녀가 민중의 지도자를 맡아야 한다고 생각합니다.“\n\n나기브는 불편한 미소를 지으며 고개를 저었다. \n\n”그렇다고 우리가 왕정을 세워야 하겠나. 우리들의 핏줄에는 수천년의 격동의 역사가 흐르지. 그 소녀는 이집트인도, 이집트와 친숙한 인물도 아니야. 그 격동의 피, 권위와 책임을 질 수 없을 걸세.“\n\n나세르는 침묵할 수밖에 없었다. 대령의 말이 옳을 수도 있겠다 싶었다. 그러나 상황은 급박하며, 국가를 위해 나아가던 청년은 선택해야만 했다. 이제는 더 이상 설득으로 해결될 일이 아니었다. 그는 슬며시 옷 속에서 총을 꺼내들었다.
EGY_event.22.a:0 "”대령님, 죄송합니다.“"

EGY_event.23.t:0 "둘로 나뉜 혁명"
EGY_event.23.d:0 "”....뭐 하는 겐가? 자네가 이런다고 해서 변하는 게 있으리라 믿나?“\n\n”국민의 뜻이니 이루어질 것입니다. 다시 한 번 죄송합니다, 대령님.“\n\n방 안의 그림자 속에서 숨어있던 장교들이 나타나 나기브를 포위했다. 나기브는 깜짝 놀랐지만, 그의 표정은 여전히 차분했다.\n\n”....결국 이리 되는가. 원망하지는 않겠네. 십수 년을 함께 지내왔으니, 자네도 이래야 할 명분과 사정을 가지고 있겠지. 자네를 영원히 이해하지는 못하겠지만 말일세.“\n\n나세르는 총을 낮추지 않으며, 그의 시선을 한동안 나기브에게 두었다.\n\n”각하께서 제게 가르쳐주신 모든 것들을 잊지 못할 겁니다. 그렇지만 대령님께서 말씀하신 것처럼, 제게도 이렇게 해야 할 사정이 있습니다. 개인적인 감정 따위는 아니니 걱정 마십시오. 이제는 조용히, 오랜 곳에서 휴식을 취하실 때입니다.“\n\n영원히.\n\n모하메드 나기브 대령은 충분한 경력을 쌓아온 사람이다. 현실을 파악하기에도, 그리고 그 현실에 순응하기에도 충분할 만큼. 재떨이에 담배를 비비자 부스스, 검은 재를 흩뿌렸다.\n\n”자네가 하고 싶은대로 하게. 이제는 실권도 없어질 테니.“\n\n나세르가 간단히 지시하자, 그의 명령을 들은 장교 하나가 나기브의 어깨를 붙잡았다. 그러니 대쪽같은 눈빛이 연행을 망설이게 했다. 나세르는 그가 알아서 나가게끔 둘 수밖에 없었다.\n\n다시는 볼 수 없을 고향같은 사무실을 떠나기 전, 나기브가 후임을 바라보았다.\n\n”나세르. 의무를 다하게. 나라를 위해 나아가게.“\n\n쏟은 물을 되돌릴 수 없듯이 내려진 결정을 취소할 수는 없는 법이다. 나세르는 이를 잘 알고 있었다. 나기브도 잘 알고 있었다. 몇 시간 전까지만 해도 혁명의 주인공으로 우뚝 서 있었을 남자는 차가운 현실 속으로 발을 움직였다.""
EGY_event.23.a:0 "내 일생 조국과 민족을 위하여."

EGY_event.24.t:0 "사라지는 브리튼의 기억"
EGY_event.24.d:0 "빅터 휴버트 테이트 경, 또는 이집트 왕국의 공군 수석 고문은 사막의 기후에 나름 적응하는 중이었다. 비록 캐나다의 겨울에 비해 정 반대라고 생각했지만, 건물 내부는 본래 생각했던 것보다 버틸 만했다. 적어도 대추야자 한두 알을 먹는 기쁨은 누릴 수 있었다.\n\n평온한 삶이었다. 아마 고문 임기를 마치면 캐나다로 돌아가던, 은퇴를 하던 하겠지. 오늘 왕궁의 호출이 끝나면 친우를 불러 저녁 식사를 할 생각이었다.\n\n”이집트 왕국은 지금까지 빅터 테이트 경의 노고에 감사하고 있네.“\n\n이례적인 송환 통고를 듣기 전까지는.\n\n다행히 일전에 예상한 사실이었다. 대영제국이 무너지고 국왕 전하께서 캐나다로 피신하셨으며, 유럽을 호령하던 대서 열방들이 차례차례 붕괴했다. 이집트도 행동해야 했다.\n\n”그렇다면.... 음, 뭐라 말슴드릴 게 없습니다. 결국 그 날이 왔군요.“\n\n”의회에서 결의하기를 런던 다리가 무너졌으니 영국의 손아귀에서 벗어날 때가 도래했다더군, 이집트는 영원히 브리튼과 함께해야 한다는 걸 모르고 말이야.“\n\n국왕께서는 자연스레 미소를 지으시면서도, 한켠에 몰려오는 시대의 불안을 담았다.\n\n”나는 그들을 거절할 수 없었네.“\n”현명한 판단이셨습니다. 아무래도 영국을 비롯한.... 여러 곳에, 변화의 풍파가 도래했으니 말입니다. 거부하셨다면 반발이 상당했을 테지요.“\n\n”지금까지 자네가 헌신해온 모든 것들, 잊지 못할 걸세. 이집트는 수천년 전부터 이 땅을 지배했지만, 시대에 발맞추지 못해 많은 것을 잃었지. 그러나 자네 덕분에 공군을 재건하고, 적의 공습에 충분히 대비할 수 있게 되었어. 고맙네.“\n\n국왕이 손을 내밀었고, 잠시간의 악수를 가졌다. 억센 손이었다.\n\n”언제나 굳세길 바라네.“\n\n”이집트는 제 마음 속에 언제나 있을 겁니다. 언제나 평안하십시오, 국왕 전하.“"
EGY_event.24.a:0 "브리튼의 마지막 잔재가 떠나갔다."


