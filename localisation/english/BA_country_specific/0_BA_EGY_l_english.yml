 # Army
 EGY_army_reforms:0 "Army Reforms"
 EGY_army_reforms_desc:0 "In the chaos caused by the dimension shift, we must strengthen our military to face new threats after gaining independence. Army reform is our first task."

 EGY_mobile_warfare:0 "Mobile Warfare"
 EGY_mobile_warfare_desc:0 "We must learn advanced tactics from other worlds and develop mobile warfare doctrine utilizing the vastness of the desert."

 EGY_shendi_horses:0 "Shendi Cavalry"
 EGY_shendi_horses_desc:0 "Cavalry using famous horses from the Shendi region will significantly improve our army's mobility."

 EGY_royal_camel_corps:0 "Royal Camel Corps"
 EGY_royal_camel_corps_desc:0 "Camel units roaming the desert will become a symbol of our army. Let's create a camel corps further strengthened by otherworldly technology."

 EGY_motorized_efforts:0 "Motorization Efforts"
 EGY_motorized_efforts_desc:0 "We must modernize our army by introducing advanced vehicle technology from other worlds."

 EGY_desert_mobility:0 "Like the Desert Wind"
 EGY_desert_mobility_desc:0 "Let's overpower enemies with mobility as fast and unpredictable as the desert wind."

 # Navy
 EGY_naval_reforms:0 "Naval Reforms"
 EGY_naval_reforms_desc:0 "Strong naval power spanning the Mediterranean and Red Sea will be the key to protecting our independence."

 EGY_naval_companies:0 "Merchant Marine"
 EGY_naval_companies_desc:0 "Having secured control of the Suez Canal, we must foster a strong merchant marine for economic gain."

 EGY_navy:0 "Continued Naval Reforms"
 EGY_navy_desc:0 "We must further strengthen our naval power by actively introducing naval technology from other worlds."

 EGY_expand_dockyards:0 "Expand Shipyards"
 EGY_expand_dockyards_desc:0 "Let's expand the shipyards in Alexandria and Port Said to grow our fleet further."

 EGY_the_queen_of_the_mediteranian:0 "Queen of the Mediterranean"
 EGY_the_queen_of_the_mediteranian_desc:0 "Egypt will emerge as the new powerhouse of the Mediterranean. Until our fleet rules the Mediterranean!"

 # Air Force
 EGY_aviation_reforms:0 "Aviation Reforms"
 EGY_aviation_reforms_desc:0 "We must build a strong air force that can protect our skies and overpower enemies by introducing advanced aviation technology from other worlds."

 EGY_pilot_training:0 "Pilot Training"
 EGY_pilot_training_desc:0 "Even the best aircraft is useless without a skilled pilot. Let's train our youth as the world's best pilots."

 EGY_expand_air_ports:0 "Expand Airports"
 EGY_expand_air_ports_desc:0 "We must expand the airports in Cairo and Alexandria to accommodate more aircraft."

 EGY_aviation_industry:0 "Aviation Industry"
 EGY_aviation_industry_desc:0 "Our goal is to possess our own aircraft production capability using otherworldly technology."

 EGY_rule_the_skies:0 "Rule the Skies"
 EGY_rule_the_skies_desc:0 "When the eagles of Egypt seize control of the Middle Eastern skies, our enemies will tremble in fear."

 # Army (Continued)
 EGY_grand_battle_plan:0 "Grand Strategy"
 EGY_grand_battle_plan_desc:0 "We must establish our own unique grand strategy by absorbing the knowledge of strategists from other worlds. A strategy combining the wisdom of the Nile and the power of the desert will baffle our enemies."

 EGY_expand_military_academy:0 "Expand Military Academy"
 EGY_expand_military_academy_desc:0 "We must expand the Cairo Military Academy and invite military instructors from other worlds to train our officers to a world-class level."

 EGY_planning_schools:0 "Planning Schools"
 EGY_planning_schools_desc:0 "Let's establish unique planning schools that combine otherworldly strategic theories and ancient Egyptian wisdom. This is where future strategists will be born."

 EGY_improve_officer_corps:0 "Improve Officer Corps"
 EGY_improve_officer_corps_desc:0 "Our officer corps must become even stronger despite the chaos caused by the dimension shift. Let's build a new officer education system that harmoniously combines otherworldly knowledge and our tradition."

 EGY_general_staff:0 "Egyptian General Staff"
 EGY_general_staff_desc:0 "Let's establish a General Staff that combines Pharaoh's wisdom and advanced otherworldly strategies. They will become the brain of the Egyptian army and lead us to victory."

 EGY_new_army:0 "New Egyptian Army"
 EGY_new_army_desc:0 "A new Egyptian army has been born, where ancient glory and future technology are fused. Now we fear no enemy!"

 EGY_domestic_gunsmiths:0 "Domestic Arms Production"
 EGY_domestic_gunsmiths_desc:0 "It is time to produce unique and powerful Egyptian weapons by combining advanced otherworldly technology and our traditional craftsmanship. Our weapons, rough as desert sand and sharp as the Nile current, will strike fear into our enemies."

 EGY_desert_training:0 "Desert Combat Training"
 EGY_desert_training_desc:0 "Our army must learn to fight in the harsh environment of the desert. With a training program combining otherworldly survival techniques and the wisdom of our ancestors, our soldiers will be able to operate as freely in the desert as fish swimming in water."

 EGY_labour_corps:0 "Labour Corps"
 EGY_labour_corps_desc:0 "Let's establish a modern labour corps, continuing the spirit of our ancestors who built the pyramids. Combining otherworldly construction technology and our perseverance, we will build a strong infrastructure that can overcome any obstacle."

 EGY_strengthen_royal_gendarmerie:0 "Strengthen Royal Gendarmerie"
 EGY_strengthen_royal_gendarmerie_desc:0 "Let's create a strong and efficient Royal Gendarmerie by combining advanced otherworldly policing technology and our traditional methods of maintaining order. They will not only maintain domestic stability but also assist the regular army if necessary."

 # Navy (Continued)
 EGY_defend_the_coasts:0 "Coast Defense"
 EGY_defend_the_coasts_desc:0 "Our country, with its long coastline along the Mediterranean and Red Sea, needs a strong coast defense system. Let's protect our coasts through otherworldly defense technology."

 EGY_light_cruisers:0 "Develop Light Cruisers"
 EGY_light_cruisers_desc:0 "Light cruisers, combining mobility and firepower, will be game-changers that can shift the dynamics of the Mediterranean."

 EGY_submarines:0 "Submarine Force"
 EGY_submarines_desc:0 "Let's prepare a strategic card to place the Suez Canal and the Mediterranean under our sphere of influence by introducing advanced otherworldly submarine technology."

 EGY_marine_focus:0 "Egyptian Marines"
 EGY_marine_focus_desc:0 "It's time to transform the Nile warriors into sea warriors. The Egyptian Marines will further strengthen our maritime dominance."

 # Air Force (Continued)
 EGY_dominate_the_sky:0 "Sky Dominance"
 EGY_dominate_the_sky_desc:0 "If the blessing of the god Ra and otherworldly aviation technology are combined, we can dominate the Middle Eastern skies."

 EGY_fighters:0 "Fighter Research"
 EGY_fighters_desc:0 "Let's research advanced fighter designs from other worlds and combine them with our traditional craftsmanship to create the world's best fighters."

 EGY_battle_ground_support:0 "Ground Support"
 EGY_battle_ground_support_desc:0 "Air superiority must lead to victory in ground warfare. Let's ensure our aircraft can effectively support ground forces on the desert battlefield."

 EGY_bombers:0 "Bomber Research"
 EGY_bombers_desc:0 "Long-range bombers capable of striking the enemy's rear will bring us a strategic advantage. Let the Egyptian eagles become objects of terror to our enemies."

 EGY_aviation_industry_investment:0 "Aviation Industry Investment"
 EGY_aviation_industry_investment_desc:0 "Independent aircraft production is essential for our independence and military strengthening. Let's make a full-scale investment in fostering the aviation industry based on otherworldly technology."

 # Navy (Additional)
 EGY_grand_navy:0 "Grand Navy"
 EGY_grand_navy_desc:0 "It is time to build a strong grand navy spanning the Mediterranean and Red Sea by combining ancient Egyptian maritime civilization and advanced otherworldly ship technology."

 EGY_heavy_cruisers:0 "Develop Heavy Cruisers"
 EGY_heavy_cruisers_desc:0 "When heavy cruisers carrying the dignity of the Pharaoh sail the Mediterranean, our enemies will tremble. Let's develop heavy cruisers further strengthened by otherworldly technology."

 EGY_destroyers:0 "Destroyer Efforts"
 EGY_destroyers_desc:0 "Fast and agile destroyers will be the backbone of our navy. Let's create destroyer flotillas as quick and deadly as the Nile crocodiles."

 # Air Force (Additional)
 EGY_air_defence_force:0 "Air Defence Force"
 EGY_air_defence_force_desc:0 "Protecting the Egyptian sky is our sacred duty. Let's build a unique air defense network using otherworldly air defense technology and our territory."

 EGY_egyptian_paratroopers:0 "Egyptian Paratroopers"
 EGY_egyptian_paratroopers_desc:0 "Egyptian warriors with the wings of Horus! Middle East's strongest paratrooper unit will be born through otherworldly airborne operation technology and our brave soldiers."

 # Additional Focuses
 EGY_desert_warfare_expertise:0 "Desert Warfare Expertise"
 EGY_desert_warfare_expertise_desc:0 "The desert is our fortress and weapon. Let's become the champions of desert warfare by combining the wisdom of desert combat accumulated over thousands of years and advanced otherworldly tactics."

 EGY_suez_canal_fortification:0 "Suez Canal Fortification"
 EGY_suez_canal_fortification_desc:0 "The Suez Canal is our lifeline. Let's make the canal an impregnable fortress using otherworldly defense technology, so no invader dares to look its way."

 EGY_ancient_wisdom_modern_warfare:0 "Ancient Wisdom, Modern Warfare"
 EGY_ancient_wisdom_modern_warfare_desc:0 "Let's create a new warfare paradigm that will surprise the world by fusing ancient Egyptian wisdom, which built the pyramids, and modern warfare technology from other worlds."

 EGY_nile_delta_industry:0 "Nile Delta Industrialization"
 EGY_nile_delta_industry_desc:0 "Industrialize the fertile Nile Delta region with otherworldly technology to make it the heart of our military industry. The weapons produced here will protect our independence."

 EGY_sphinx_guardians:0 "Sphinx Guardians"
 EGY_sphinx_guardians_desc:0 "Let's establish a special forces unit where ancient mystery and otherworldly technology are combined. The 'Sphinx Guardians' will protect Egyptian secrets and be objects of terror to our enemies."

 EGY_pharaohs_vengeance:0 "Pharaoh's Vengeance"
 EGY_pharaohs_vengeance_desc:0 "Our Egypt, which was under foreign rule for a long time, has finally achieved independence. Now, in the name of the Pharaoh, it is time to turn the blade of vengeance against those who oppressed us!"

