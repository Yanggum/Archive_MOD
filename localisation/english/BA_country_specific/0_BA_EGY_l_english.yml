l_english:
 EGY_guide: "Objectives\n\n£white_dot Achieve independence from the British Empire.\n£white_dot Stabilize political chaos and determine the government's direction.\n\n£white_dot §YBring victory to the Wafd Party and Democracy§!\n      -  Unite with Middle Eastern nations and liberate Africa under the banner of anti-colonialism.\n OR...\n£white_dot §YGuide the nation according to Islamic Law and ally with Italy to sweep away the corrupt and weak remnants of the old era.§!\n      -  Proclaim the Egyptian Empire and restore Egypt's glory.\n OR...\n£white_dot §YStrengthen the military's power to dissolve parliament and initiate a coup.§!\n      -  Swear loyalty to the Royal Family and proclaim the Egyptian Empire.\n     OR...\n      -  Oust the corrupt Royal Family and march toward Arab unification.\n\n\n§CDeveloped by - Mako, mintcoon§!"
 EGY_country_intro_header: "Cradle of a Brilliant and Flourishing Ancient Civilization"
 EGY_country_intro_header_1: "Foreign Rule and 1,800 Years of Darkness"
 EGY_country_intro_header_2: "The Land Where a New Sun Rises"
 EGY_country_intro_content: "The ancient Egyptian civilization began around 3,100 BC with the first unification of Upper and Lower Egypt, laying the foundation for a brilliant culture, art, and science that would remain forever in human history. Under the leadership of the legendary King Narmer (Menes), the two regions fused into one to establish a centralized state system, leading to the harmonious development of agriculture, religion, and politics centered on the Nile. During the Old Kingdom, large-scale construction projects such as the pyramids were promoted, maximizing the nation's authority and technical prowess, which became eternal monuments for posterity. The sophisticated administrative systems and religious rituals of the time brought stability and prosperity to society, providing the foundation for ancient Egyptians to flourish based on deep reverence for nature and the gods.\nIn the Middle Kingdom, political and administrative reforms and regional integration policies were successfully implemented, allowing Egypt to overcome internal and external crises and prepare for a leap forward in culture and art. During this period, outstanding achievements were made in literature, art, and architecture, further enhancing the nation's reputation, and development was achieved through efficient resource allocation and administrative reform across all social classes. Entering the New Kingdom, strong central power combined with military strength allowed Egypt to emerge victorious in wars with neighboring countries and establish its international status. Under the reign of great Pharaohs like Ramesses II, territorial expansion, economic prosperity, and cultural achievement were maximized, and Egypt established itself as a cultural center with a significant impact on world civilization based on the knowledge and technology accumulated over time. The religious ceremonies, art, and architecture of Egypt at the time were evaluated as exemplary achievements for future generations, and the operation of the entire nation as one organic system became living proof of positive historical development.\nStarting with the conquest of Alexander the Great in 332 BC, Egypt came under the influence of Greek culture, and the Ptolemaic dynasty was established, entering a new era where Hellenistic culture fused with traditional Egyptian culture. The Ptolemaic dynasty saw great developments in scholarship, art, and trade centered on Alexandria, and with the introduction of Greek styles, major changes occurred across politics, society, and culture. During this period, while traditional Egyptian values and customs were partially transformed, a complex aspect emerged where both cultures complemented each other. However, under the Ptolemaic dynasty, internal and external political conflicts and foreign interference increased, leading to a gradual weakening of autonomy compared to previous eras. These changes were evaluated as reflecting a neutral reality where the possibility of a new cultural leap was provided within the extension of positive development, while simultaneously diluting some existing traditions.\nAncient Egyptian civilization enjoyed a golden age from its initial unification through the Old, Middle, and New Kingdoms, exerting a profound influence on human culture, and the Hellenistic transition of the Ptolemaic dynasty became an important turning point in Egyptian history. Thus, ancient Egypt achieved stable development and cultural achievement for a long period after its first unification, and later provided a facet of history where efforts to preserve its long tradition and innovation coexisted amidst cultural fusion with foreign powers."
 EGY_country_intro_content_1: "Under the rule of the Roman Empire, Egypt originally possessed rich granaries and economic potential, but due to Roman colonial policies and excessive taxation, Egyptian society gradually entered an era of stagnation and suffering. The cold-blooded control of the Roman administrative system and resource extraction policies significantly withered Egypt's economic independence and cultural autonomy, causing many commoners and peasants to suffer extreme hardship and lose their livelihoods. At the time, Rome perceived Egypt as a strategic stronghold and implemented strong military and administrative control, during which Egypt's traditional values and social organizations were severely damaged. In this situation, Egypt lost its sovereignty, and the entire society fell into chaos due to Rome's excessive taxes and frequent conscription.\nEven during the Byzantine Empire, Egypt could not escape economic decline due to foreign interference and internal division. Constant instability persisted throughout society due to military threats, frequent rebellions, and an inadequate administrative system, leading to the gradual decline of traditional Egyptian culture and art. Under the pressure of the Roman and Byzantine systems, Egypt was forced to focus on a desperate struggle for survival rather than cultural development for a long period, descending into a dark age. Inequality and unjust treatment were rampant across all levels of society, and the lives of the people flowed in extreme pain and despair, while Egypt's past glory was gradually forgotten.\nEgypt before the Arab conquest thus continued in a state of general stagnation due to foreign exploitation, internal strife, and lack of administrative systems, with a bleak reality settling across society and the economy. External coercive rule, excessive taxes, and military burdens brought extreme suffering and dissatisfaction to Egyptians, and as a result, Egyptian society gradually lost its vitality. This dark age lasted until the Ottoman Empire set foot in the region, showing that Egypt's traditional values and culture were significantly withered amidst internal conflict and external pressure. Overall, Egypt at the time could be evaluated as a dark age where it lost its economic and political autonomy and fell into a cycle of suffering and stagnation for a long period."
 EGY_country_intro_content_2: "When Muhammad Ali took office as the Governor of Egypt in the early 19th century, Egypt, which was under the indirect rule of the Ottoman Empire, began to walk the path of full-scale modernization. Muhammad Ali breathed new vitality into Egyptian society by pushing for bold reform policies for military reform, reorganization of the administrative system, and economic, educational, and industrial development. At the time, he focused on transforming Egypt's traditional structure into a modern state system by actively introducing Western technology and institutions, which resulted in significant improvements in military and economic power. These reforms gradually brought stability to various social classes, and the introduction of modern civilization and infrastructure expansion occurred across the nation.\nFrom the late 19th century to the early 20th century, Egypt showed active nationalist movements despite the imperialist pressure of European powers. In 1919, a massive independence revolution broke out, an event where the Egyptian people actively expressed their desire for the restoration of sovereignty and political independence. During this period, Egyptians engaged in various independence movements and political attempts against British colonial rule, and these efforts gradually received positive evaluations in the international community. The efforts of independence activists to revive the nation's tradition and culture and prepare the foundation for self-reliance as a modern state held great significance.\nAfter Muhammad Ali, Egypt gradually established a modern administrative and industrial base while continuing efforts to restore its unique identity amidst foreign interference. Western systems and technologies were introduced in politics, economy, and culture, and these changes played an important role in establishing Egypt as a modern state. In particular, various social movements and political attempts for independence had a positive impact on the restoration of Egypt's sovereignty, raising the pride of the people and serving as a catalyst for future-oriented change. Egyptian society at the time showed a complex aspect where tradition and modernity coexisted, expanding its autonomy step by step through constant efforts for independence without yielding to foreign pressure.\nHowever, Egypt's efforts entered a new phase due to the impact of the 'Great Shift' that occurred in November 1935. The British Empire lost half of its home islands to an alien invasion, bringing Egypt's independence within reach, but the monster 'Binah' that appeared in the desert along with the Great Shift is draining the nation's resources. Unless a 'Savior' appears to handle them, this will remain a trial and suffering that Egypt must endure."

