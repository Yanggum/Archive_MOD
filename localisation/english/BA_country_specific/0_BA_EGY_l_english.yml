 EGY_event.32.t:0 "Report from Abydos"
 EGY_event.32.d:0 "*Ahem*! Sensei! We've finally set up our first permanent shelter here in this 'Abydos'. It's not exactly like home, but the sand feels familiar... maybe too familiar?"
 EGY_event.32.a:0 "It seems they have decided to settle here completely."

 EGY_event.33.t:0 "Expansion of Abydos Settlement"
 EGY_event.33.d:0 "Check this out! With some Kivotos engineering and a bit of sweat, this place is actually starting to look like a real town. We've even set up a local supply route! Shiroko's already found the best jogging paths."
 EGY_event.33.a:0 "Kivotos technology is amazing."

 EGY_event.34.t:0 "Development of Abydos into a Major City"
 EGY_event.34.d:0 "Can you believe it? This place is bustling! We've integrated our tech with the local grid, and the population is booming. It's almost like a new Kivotos district... just with a lot more pyramids."
