 EGY_industrial_modernization_idea:0 "Industrial Modernization Plan"
 EGY_industrial_modernization_idea_desc:0 "Our industrial modernization plan, combining ancient Egyptian craftsmanship and advanced otherworldly technology, will develop ceaselessly like the flow of the Nile."

 EGY_camel_corps_idea:0 "Camel Corps of Seth"
 EGY_camel_corps_idea_desc:0 "Named after the desert god Seth, our camel corps is equipped with gear enhanced by otherworldly technology, striking fear into enemies while roaming the desert."

 EGY_shendi_cavalry_idea:0 "Shendi Cavalry of Horus"
 EGY_shendi_cavalry_idea_desc:0 "Fast and strong as the wings of the sky god Horus, our cavalry composed of famous horses from the Shendi region plays a major role in repelling enemy attacks."

 EGY_military_schools:0 "Military Schools of Thoth"
 EGY_military_schools_desc:0 "Named after the god of wisdom Thoth, our military schools produce the best officers by harmoniously teaching ancient Egyptian strategy and modern otherworldly tactics."

 EGY_desert_training_idea:0 "Desert Training of Amun"
 EGY_desert_training_idea_desc:0 "Under the protection of the desert guardian god Amun, our soldiers are learning survival and combat skills in the harsh desert environment. Combined with otherworldly survival techniques, this training is making our army the ghosts of the desert."

 EGY_royal_gendarmerie:0 "Royal Police of Maat"
 EGY_royal_gendarmerie_desc:0 "Named after the goddess of justice and order Maat, our royal police protect domestic peace and stability by combining advanced otherworldly investigative technology and ancient Egyptian concepts of justice."

 EGY_merchant_marine_idea:0 "Armed Merchant Ships of Ra"
 EGY_merchant_marine_idea_desc:0 "Blessed by the sun god Ra, our armed merchant ships roam the seas at surprising speeds by adopting otherworldly propulsion technology. They play an important role in trade during peace and supporting the navy during war."

 ### Naval MIO ###
 suez_canal_company:0 "Suez Canal Company"
 suez_canal_company_desc:0 "This organization managing the Suez Canal, the gateway connecting the world and the otherworld, is now also focusing on developing maritime raiding vessels using state-of-the-art technology. These vessels, born from the meeting of ancient Egyptian wisdom and otherworldly technology, will be objects of terror to enemies."

 alexandria_shipyard:0 "Alexandria Shipyard"
 alexandria_shipyard_desc:0 "The shipyard in this city named after Alexander the Great is now producing state-of-the-art frigates by incorporating otherworldly technology. These vessels, where Cleopatra's elegance and modern technology's power are combined, will be responsible for our maritime defense."

 ### Aircraft MIO ###
 egypt_air:0 "EgyptAir"
 egypt_air_desc:0 "EgyptAir's light aircraft, as if having the wings of Horus, boast surprising mobility by adopting otherworldly flight technology. These aircraft are smooth as the Nile's current and fast as the desert wind."

 sudan_airways:0 "Sudan Airways"
 sudan_airways_desc:0 "Sudan Airways' medium aircraft, inheriting the power of Nubia's Black Pharaohs, show surprising performance by applying otherworldly engine technology. These aircraft boast a powerful presence traversing the Sahara Desert."

 ### Material MIO ###
 shoubra_engineering:0 "Shoubra Engineering"
 shoubra_engineering_desc:0 "Located in Shoubra, the heart of Cairo, this company produces the best infantry equipment by combining ancient Egyptian craftsmanship and advanced otherworldly technology. The weapons they make are bright and powerful as the light of Ra."

 egyptian_engineering:0 "Egyptian Engineering"
 egyptian_engineering_desc:0 "This company, combining the wisdom of our ancestors who built the pyramids and otherworldly firearm technology, develops artillery equipment of surprising performance. The cannons they make are destructive as if containing the wrath of Seth."

