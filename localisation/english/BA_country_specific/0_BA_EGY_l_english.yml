# 아이디어

EGY_industrial_modernization_idea:0 "산업 현대화 계획"
EGY_industrial_modernization_idea_desc:0 "고대 이집트의 장인 정신과 이세계의 첨단 기술을 결합한 우리의 산업 현대화 계획은 나일 강의 흐름처럼 멈추지 않고 발전할 것입니다."

EGY_camel_corps_idea:0 "세트의 낙타군단"
EGY_camel_corps_idea_desc:0 "사막의 신 세트의 이름을 딴 우리의 낙타군단은 이세계의 기술로 강화된 장비를 갖추고 사막을 누비며 적들에게 공포의 대상이 되고 있습니다."

EGY_shendi_cavalry_idea:0 "호루스의 센디 기병"
EGY_shendi_cavalry_idea_desc:0 "하늘의 신 호루스의 날개처럼 빠르고 강인한 센디 지역의 명마들로 구성된 우리의 기병대는 적의 공격을 물리치는 데 큰 역할을 하고 있습니다."

EGY_military_schools:0 "톳의 군사학교"
EGY_military_schools_desc:0 "지혜의 신 톳의 이름을 딴 우리의 군사학교는 고대 이집트의 전략과 이세계의 현대 전술을 조화롭게 가르쳐 최고의 장교들을 배출하고 있습니다."

EGY_desert_training_idea:0 "아문의 사막 훈련"
EGY_desert_training_idea_desc:0 "사막의 수호신 아문의 가호 아래, 우리 군인들은 혹독한 사막 환경에서의 생존과 전투 기술을 익히고 있습니다. 이세계의 생존 기술과 결합된 이 훈련은 우리 군을 사막의 귀신으로 만들고 있습니다."

EGY_royal_gendarmerie:0 "마아트의 왕립 경찰"
EGY_royal_gendarmerie_desc:0 "정의와 질서의 여신 마아트의 이름을 딴 우리의 왕립 경찰은 이세계의 첨단 수사 기술과 고대 이집트의 정의 관념을 결합하여 국내의 평화와 안정을 수호하고 있습니다."

EGY_merchant_marine_idea:0 "라의 무장 상선"
EGY_merchant_marine_idea_desc:0 "태양신 라의 축복을 받은 우리의 무장 상선들은 이세계의 추진 기술을 채택하여 놀라운 속도로 해상을 누비고 있습니다. 이들은 평화 시에는 무역을, 전시에는 해군을 지원하는 중요한 역할을 수행합니다."

### 해군 MIO ###
suez_canal_company:0 "수에즈 운하 공사"
suez_canal_company_desc:0 "세계와 이세계를 잇는 관문인 수에즈 운하를 관리하는 이 조직은 이제 최첨단 기술을 활용한 해상 습격 함정 개발에도 힘을 쏟고 있습니다. 고대 이집트의 지혜와 이세계의 기술이 만나 탄생한 이 함정들은 적들에게 공포의 대상이 될 것입니다."

alexandria_shipyard:0 "알렉산드리아 조선소"
alexandria_shipyard_desc:0 "알렉산드로스 대왕의 이름을 딴 이 도시의 조선소는 이제 이세계의 기술을 접목하여 최첨단 호위함을 생산하고 있습니다. 클레오파트라의 우아함과 현대 기술의 강력함이 결합된 이 함정들은 우리의 해상 방위를 책임질 것입니다."

### 항공기 MIO ###
egypt_air:0 "이집트 항공"
egypt_air_desc:0 "호루스의 날개를 단 듯한 이집트 항공의 경량 항공기들은 이세계의 비행 기술을 채택하여 놀라운 기동성을 자랑합니다. 이 항공기들은 나일 강의 흐름처럼 부드럽고, 사막의 바람처럼 빠릅니다."

sudan_airways:0 "수단 항공"
sudan_airways_desc:0 "누비아의 검은 파라오들의 힘을 계승한 수단 항공의 중형 항공기들은 이세계의 엔진 기술을 적용하여 놀라운 성능을 보여주고 있습니다. 이 항공기들은 사하라 사막을 가로지르는 강력한 존재감을 자랑합니다."

### 물자 MIO ###
shoubra_engineering:0 "슈브라 엔지니어링"
shoubra_engineering_desc:0 "카이로의 심장부 슈브라에 위치한 이 회사는 고대 이집트의 장인 정신과 이세계의 첨단 기술을 결합하여 최고의 보병 장비를 생산하고 있습니다. 이들이 만든 무기는 라의 빛처럼 밝고 강력합니다."

egyptian_engineering:0 "이집트 엔지니어링"
egyptian_engineering_desc:0 "피라미드를 세운 우리 조상들의 지혜와 이세계의 화기 기술을 결합한 이 회사는 놀라운 성능의 포병 장비를 개발하고 있습니다. 이들이 만든 대포는 마치 세트의 분노를 담은 듯 파괴적입니다."

EGY_binah_attack:0 "보병 투입"
EGY_binah_attack_desc:0 "인력을 투입하여 비나를 공격합니다."

EGY_binah_attack_ABYDOS:0 "이계인 지원 요청"
EGY_binah_attack_ABYDOS_desc:0 "아비도스라는 이계인에게 도움을 청하겠지만, 이는 그들의 영향력을 강화할 것입니다."

EGY_binah_artillery_bombardment:0 "비나 포격"
EGY_binah_artillery_bombardment_desc:0 "사막의 불꽃처럼 강력한 포탄을 발사하여 이계의 적을 격퇴합니다."

EGY_binah_cas_bombardment:0 "전장 지원 요격"
EGY_binah_cas_bombardment_desc:0 "사막의 바람처럼 빠르게 전장으로 이동하여 이계의 적을 저지합니다."

EGY_binah_attack_tt:0 "비나 포격 데미지 §Y1§!"
EGY_binah_artillery_bombardment_tt:0 "비나 포격 데미지 §Y2§!"
EGY_binah_cas_bombardment_tt:0 "비나 포격 데미지 §Y25§!"
EGY_binah_attack_ABYDOS_tt:0 "비나 포격 데미지 §Y100§!"

EGY_commander_tt:0 "§Y'가말 압델 나세르'§!, §Y압델 하킴 아메르§!, §Y자카리아 모히에딘§!가 장군이 됩니다."

EGY_sudan_good_tt:0 "§Y수단§!의 핵심주 중 §Y강한 수단 분리주의§!, §Y적당한 수단 분리주의§! 를 가진 주의 분리주의가 §Y1§!단계 낮아집니다."

EGY_suez_negotiate_tt:0 "£decision_icon_small §Y결정 해금§!:수에즈 협상\n§Y협상은 이집트의 민간공장이 30개 이상일 경우 자동으로 시작됩니다!§!"

FRA_flag_last_promise_end:0 "프랑스가 아프리카 식민지에 자치구를 설립함"

EGY_suez_money_tt:0 "수애즈 운하 매입에 필요한 §Y민간공장§! §Y1§!개 감소"
EGY_anti_colonism_tt:0 "£decision_icon_small §Y결정 해금§!:반식민주의 성전"
EGY_ethiopia_unite_tt:0 "£decision_icon_small §Y결정 해금§!:에티오피아 해방"
EGY_ethiopia_divide_tt:0 "£decision_icon_small §Y결정 해금§!:에리트레아 해방\n£decision_icon_small §Y결정 해금§!:소말리아 해방\n£decision_icon_small §Y결정 해금§!:아파르 해방\n£decision_icon_small §Y결정 해금§!:콰라인 해방\n£decision_icon_small §Y결정 해금§!:베니샹굴구무즈 해방\n£decision_icon_small §Y결정 해금§!:감벨라 해방\n£decision_icon_small §Y결정 해금§!:시다모 해방\n£decision_icon_small §Y결정 해금§!:오로모 해방"
# 이벤트
EGY_news.1.t:0 "이집트에서 조직된 푸른 셔츠단"
EGY_news.1.desc:0 "카이로 정계 신문은 최근 푸른 셔츠단이라 불리는 와프트당의 청년조직, 혹은 폭력배 집단에 우려를 표했습니다. 본래 반민주주의 정당 활동을 탄압하기 위해 조직된 집단이 극단적으로 변하며 민주주의 체제를 위협하고 있다는 것입니다. 몇몇 매체에서 푸른 셔츠단이 민간인에게 폭력을 행사하는 모습이 발견되며 국내외의 상당한 비판을 받았습니다.\n\n이집트 왕립 의회는 평화 유지에 문제가 없다고 발표했지만 정치학계 일각에서는 카이로 정계의 불안이 심화되고 있다며, 강력한 대책을 촉구했습니다. 신속한 대응 요구 아래, 정부는 푸른 셔츠단의 광범위한 조사를 예정하며 칼을 뽑아들었습니다. 그러나 시민들은 동요합니다: 대영제국이 무너진 이래 카이로가 흔들리고 있습니다."
EGY_news.1.a:0 "바이마르의 뒤를 따라가는군."

EGY_news.2.t:0 "만수라 협정 체결"
EGY_news.2.desc:0 "이집트 국내 정치권에서 와프트당이 의회의 과반 이상을 장악한 가운데, 국왕 파루크 1세가 입헌군주제 개혁안을 승인하여 ‘만수라 협정’이 체결되었습니다. 이번 협정을 통해 이집트는 공식적으로 입헌군주제 국가로 전환되었으며, 시민들은 국왕의 탁월한 영단을 칭송하였습니다. \n\n와프트당은 군소 정당들과의 타협을 통해 정치적 기반을 더욱 공고히 하며, 일당우위 민주주의 체제 구축의 가능성을 높이고 있는 것으로 분석되었습니다. 현지 전문가들은 이번 협정이 이집트의 정치 체제에 중대한 전환점을 마련한 사건으로 평가하였으며, 동시에 권력 집중에 따른 민주주의 후퇴 우려도 제기되었으나, 정부는 국민 통합과 안정된 정치 질서 확립에 주력하겠다는 입장을 분명히 하였습니다. 대외 언론은 이번 협정에 대해 긍정과 부정이 공존하는 복합적인 반응을 보이고 있으며, 향후 국내외 정세 변화에 미칠 영향에 주목하고 있습니다."
EGY_news.2.a:0 "아프리카 민주주의의 시작인가."

EGY_news.3.t:0 "반식민주의 선언"
EGY_news.3.desc:0 "최근 이집트 정부는 공식적으로 반식민주의 선언을 발표하며, 유럽의 식민지배에 단호히 맞서는 입장을 표명하였습니다. \n\n대영제국의 캐나다 망명 사태 이후 이집트와 영국령 동아프리카가 독립을 이룬 데 힘입어, 이집트는 아프리카 독립국들과의 긴밀한 협력을 모색하는 한편, 이탈리아의 에티오피아 지배를 공개적으로 비난하고 유럽 내 식민지 반란군 조직을 수용하는 등 적극적인 반식민주의적 행보를 보이고 있었습니다. \n\n정부 관계자들은 이번 선언을 통해 식민지배에 반대하는 국제 연대의지를 확고히 하고, 자주와 평등에 기반한 새로운 국제 질서 구축에 기여하고자 하였음을 강조하였습니다."
EGY_news.3.a:0 "이집트가 아프리카의 맹주가 되려 하는군."

EGY_news.4.t:0 "중동의 동맹"
EGY_news.4.desc:0 "AI돌려야 하는데 뭐라고 쓰지"
EGY_news.4.a:0 "과거의 적은 지금의 동지지."

 EGY_south_africa.60.t:0 "앙골라에 자유를"
 EGY_south_africa.60.d:0 "식민주의적 압제자들의 손아귀에서 해방된 [ANG.GetName] 국민들은 자신들의 운명을 스스로 책임질 준비가 되었습니다. 그들은 임시정부를 수립하였고 헌법 초안을 작성했습니다. 이제 남은 일은 권한을 우리 군정장관으로부터 새로운 [ANG.GetAdjective] 정부로 이양하는 것 뿐입니다."
 EGY_south_africa.60.a:0 "새로운 국가는 조심스럽게 이끌어져야 하며, 그렇지 않는다면 반혁명이 성공할 것이다!"
 EGY_south_africa.60.b:0 "우리는 그들을 두 팔 벌려 환영한다!"
 EGY_south_africa.60.c:0 "아직은 상황이 이를 허락하지 않는다."
