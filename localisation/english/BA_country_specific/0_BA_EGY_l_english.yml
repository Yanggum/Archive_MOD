 EGY_event.22.t:0 "Mohamed Naguib"
 EGY_event.22.d:0 "Mohamed Naguib entered the General Staff blowing out cigarette smoke. My dearest subordinate—Gamal Abdel Nasser was waiting tensely. After looking at him for a moment, I tapped his shoulder. The tension did not ease.\n\n\"Sit down. You said you had something to talk about.\"\n\nEven though the Western powers trampled Africa, the desert reigned as a fearsome existence. The Nile functioned as a vein protecting Egypt from that fear, and the Pharaoh ruled this and exercised authority. Even though Egypt groaned under the British military boots and the royal authority disappeared, they still act as if they are of the Pharaoh's blood.\n\nThe revolution to end all this oppression was the desire of the two men. The war fought against Germany ended but nothing changed, so we will dare to achieve true independence with guns and swords because we want to see a world where all Egyptians live equally.\n\n”It's about the matter I talked about previously. Even if just nominally, setting her as the leader of the military government....“\n\n”That won't do.“\n\nNasser quietly but solemnly cut him off.\n\n”Haven't we talked about it for a long time? To make this revolution successful, we must establish a republic. A monarchy against a monarchy—what on earth would the public think? Setting that alien girl as a queen is denying our own identity. This is a matter for the Egyptian nation, not for Abydos. I'm sorry, but a continuous monarchy cannot exist.“\n\nNasser closed his eyes. His respect for the Colonel remained, but he felt that persuading him today would not be easy.\n\n”Colonel, we are fighting for those who oppress Egypt, not for something like nationalism. Whether it's a monarchy or a republic, doesn't it matter? Even if the path of the nation is right, we cannot waste time deciding the leader the nation wants. I think she must take the lead of the masses.“\n\nNaguib shook his head with an uncomfortable smile.\n\n”Even so, should we establish a monarchy? Thousands of years of turbulent history flow in our blood. That girl is not Egyptian, nor someone familiar with Egypt. She won't be able to bear that turbulent blood, authority, and responsibility.“\n\nNasser had no choice but to remain silent. He thought the Colonel might be right. However, the situation was urgent, and the youth moving for the country had to choose. It was no longer a matter that could be solved by persuasion. He slowly pulled out a gun from his clothes."
 EGY_event.22.a:0 "”Colonel, I am sorry.“"

 EGY_event.23.t:0 "The Revolution Divided in Two"
 EGY_event.23.d:0 "”....What are you doing? Do you believe anything will change if you do this?“\n\n”It is the will of the people, so it will be done. Once again, I am sorry, Colonel.“\n\nOfficers who were hiding in the shadows of the room appeared and surrounded Naguib. Naguib was surprised, but his expression remained calm.\n\n”....So it ends like this. I won't resent you. Since we've spent over a decade together, you must have a justification and circumstances to do this. Though I will never be able to understand you.“\n\nNasser did not lower his gun and kept his gaze on Naguib for a while.\n\n”I will never forget everything you taught me. But just as you said, I also have circumstances to do this. Don't worry, it's not a personal feeling. Now, take a quiet rest in a long-standing place.“\n\nForever.\n\nColonel Mohamed Naguib is a person who has built up a sufficient career. Enough to understand reality and to conform to that reality. When he rubbed out his cigarette in the ashtray, it scattered black ash.\n\n”Do as you wish. My power will disappear anyway.“\n\nWhen Nasser gave a simple instruction, an officer who heard his command grabbed Naguib's shoulder. Then, a look like a bamboo stick made the escort hesitant. Nasser had no choice but to let him out on his own.\n\nBefore leaving the office that felt like home and he would never see again, Naguib looked at his successor.\n\n”Nasser. Do your duty. Move for the country.“\n\nJust as spilled water cannot be retrieved, a decision once made cannot be canceled. Nasser knew this well. Naguib also knew this well. The man who would have stood tall as the hero of the revolution until a few hours ago moved his feet into the cold reality.\""
 EGY_event.23.a:0 "For my life, my country, and my people."

 EGY_event.24.t:0 "The Fading Memory of Britain"
 EGY_event.24.d:0 "Sir Victor Hubert Tait, or the chief air force advisor of the Kingdom of Egypt, was adapting to the desert climate in his own way. Although he thought it was the exact opposite of the Canadian winter, the inside of the building was more bearable than originally thought. At least he could enjoy the joy of eating a date or two.\n\nIt was a peaceful life. He would probably return to Canada or retire after his advisor term ended. After today's palace call, he planned to call a friend for dinner.\n\n”The Kingdom of Egypt is grateful for Sir Victor Tait's hard work so far.“\n\nUntil he heard the unusual repatriation notice.\n\nFortunately, it was a fact predicted previously. The British Empire fell and His Majesty the King fled to Canada, and the Western powers that roared in Europe collapsed one by one. Egypt also had to act.\n\n”Then.... well, I have nothing to say. That day has finally come.“\n\n”The parliament resolved that since London Bridge has fallen, it's time to escape the hands of Britain, not knowing that Egypt must be with Britain forever.“\n\nThe King naturally smiled, but also contained the unrest of the times that was rushing in.\n\n”I could not reject them.“\n”It was a wise judgment. After all, the storm of change has arrived in many places, including Britain. If you had refused, the backlash would have been significant.“\n\n”Everything you've dedicated so far, I will never forget. Egypt has ruled this land since thousands of years ago, but lost many things by not keeping pace with the times. However, thanks to you, we were able to rebuild the air force and sufficiently prepare for enemy air raids. Thank you.“\n\nThe King reached out his hand and had a brief handshake. It was a firm hand.\n\n”I hope you always remain strong.“\n\n”Egypt will always be in my heart. Be at peace always, Your Majesty.“"
 EGY_event.24.a:0 "The last remnant of Britain has left."

