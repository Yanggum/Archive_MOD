l_english:
 EGY_guide: "목표\n\n£white_dot 대영제국으로부터 독립하십시오.\n£white_dot 정치적 혼란을 안정화하고 정부의 방향성을 결정하십시오.\n\n£white_dot §Y와프트당과 민주주의의 승리를 가져오십시오§!\n      -  중동 국가들과 연합하고 반식민주의의 기치 아래 아프리카를 해방하십시오.\n 혹은...\n£white_dot §Y이슬람 율법에 따라 국가를 계도하고 이탈리아와 연합해 부패하고 나약한 구시대의 잔재를 쓸어내십시오.§!\n      -  이집트 제국을 선포하고 이집트의 영광을 되찾으십시오.§R(미완성)§!\n\n\n§C개발- Mako, 민트쿤mintcoon§!"
 EGY_country_intro_header: "찬란하고 융성했던 고대 문명의 발상지"
 EGY_country_intro_header_1: "외세의 지배와 1800년간의 암흑기"
 EGY_country_intro_header_2: "새로운 태양이 떠오르는 땅"
 EGY_country_intro_content: "고대 이집트 문명은 기원전 3,100년경 상이집트와 하이집트가 최초로 통일되면서 시작되었으며, 이때부터 인류 역사에 길이 남을 찬란한 문화와 예술, 과학의 기틀이 마련되었었습니다. 전설적인 나르메르(메네스) 왕의 지도 아래 두 지역이 하나로 융합되어 중앙집권적 국가 체제가 수립되었으며, 나일강을 중심으로 한 농업과 종교, 정치의 조화로운 발전이 이루어졌습니다. 구왕국 시기에는 피라미드 건설과 같은 대규모 건축사업이 추진되면서 국가의 권위와 기술력이 극대화되었고, 이는 후세에 전해지는 영원한 기념물로 자리 잡았습니다. 당시의 정교한 행정 체계와 종교적 제의는 사회 전반에 안정과 번영을 가져오면서, 고대 이집트인들이 자연과 신에 대한 깊은 경외심을 바탕으로 한 문명을 꽃피울 수 있는 토대를 마련하였습니다.\n중왕국 시기에는 정치·행정 개혁과 지역 통합 정책이 성공적으로 이루어지면서, 이집트는 내외부의 위기를 극복하고 문화·예술 전반에 걸친 재도약의 기회를 마련하였습니다. 이 시기에는 문학과 예술, 건축 분야에서 뛰어난 성과가 나타나 국가의 명성이 한층 더 고양되었으며, 사회 각 계층에서 효율적인 자원 배분과 행정 개혁을 통한 발전이 이루어졌습니다. 신왕국 시기에 들어서는 강력한 중앙 권력과 군사력이 결합되어 이집트가 주변 국가와의 전쟁에서 승리하며 국제적 위상을 확립하였습니다. 람세스 2세와 같은 위대한 파라오의 통치 하에서 국토의 확장과 경제적 번영, 문화적 성취가 극대화되었으며, 이집트는 그동안 축적한 지식과 기술을 바탕으로 세계 문명에 큰 영향을 미치는 문화적 중심지로 자리매김하였습니다. 당시 이집트의 종교 의식과 예술, 건축은 후대에 귀감이 되는 업적으로 평가되었으며, 국가 전체가 하나의 유기적 시스템으로 운영되는 모습은 긍정적인 역사적 발전의 산 증거가 되었습니다.\n기원전 332년 알렉산더 대왕의 정복을 기점으로 이집트는 그리스 문화의 영향을 받게 되었으며, 이후 프톨레마이오스 왕조가 수립되어 헬레니즘 문화와 전통 이집트 문화가 융합되는 새로운 시대로 진입하였습니다. 프톨레마이오스 왕조는 알렉산드리아를 중심으로 학문과 예술, 무역이 크게 발달하였으며, 그리스적 양식이 도입됨에 따라 정치, 사회, 문화 전반에 걸쳐 큰 변화를 맞이하였습니다. 이 시기에는 이집트 고유의 전통적 가치와 관습이 부분적으로 변형되면서도, 양쪽 문화가 상호 보완되는 복합적 양상이 나타나게 되었습니다. 다만, 프톨레마이오스 왕조 하에서는 내외부의 정치적 갈등과 외세의 간섭이 증가하면서 이전 시대에 비해 자주성이 점차 약화되는 양상이 나타나기도 하였습니다. 이러한 변화는 긍정적 발전의 연장선상에서 새로운 문화적 도약의 가능성을 제공한 측면과 동시에, 기존 전통이 일부 희석되는 중립적 현실을 반영한 것으로 평가되었습니다.\n고대 이집트 문명은 그 통일의 시작부터 구, 중, 신왕국을 거쳐 황금기를 누리면서 인류 문화에 지대한 영향을 미쳤으며, 프톨레마이오스 왕조의 헬레니즘적 전환은 이집트 역사의 중요한 전환점이 되었습니다. 이와 같이 고대 이집트는 최초의 통일 이후 오랜 기간 동안 안정적 발전과 문화적 성취를 이루어왔으며, 이후 외세와의 문화 융합 속에서도 그 유구한 전통을 보존하려는 노력과 혁신이 공존한 역사의 한 단면을 제공하였습니다."
 EGY_country_intro_content_1: "로마 제국의 지배 하에 들어간 이집트는 본래 풍부한 곡창지대와 경제적 잠재력을 갖추고 있었으나, 로마의 식민지 정책과 과도한 세금 부과로 인해 이집트 사회는 점차 침체와 고통의 시대로 접어들었습니다. 로마 행정 체계의 냉혹한 통제와 자원 착취 정책으로 인해 이집트의 경제적 독립성과 문화적 자율성은 크게 위축되었으며, 많은 천민과 농민들이 극심한 고통을 겪으며 생활의 기반을 잃게 되었습니다. 당시 로마는 이집트를 전략적 요충지로 인식하여 군사적·행정적으로 강력한 통제를 시행하였으며, 이 과정에서 이집트의 전통적 가치와 사회 조직은 크게 훼손되었습니다. 이러한 상황 속에서 이집트는 자주권을 상실하고, 로마의 과도한 세금과 잦은 징병으로 인해 사회 전체가 혼란에 빠지게 되었습니다.\n비잔틴 제국 시기에도 이집트는 외세의 간섭과 내부 분열로 인한 경제적 쇠퇴를 면치 못하였습니다. 군사적 위협과 빈번한 반란, 행정 체계의 부실함 등으로 인해 사회 전반에 걸쳐 불안정한 상태가 지속되었으며, 이집트의 전통 문화와 예술은 점차 후퇴하였습니다. 당시 로마 및 비잔틴 체제의 압박 하에서 이집트는 오랜 기간 동안 문화적 발전보다는 생존을 위한 필사적인 투쟁에 집중할 수밖에 없는 암흑의 시대로 전락하였습니다. 사회 각층에서는 불평등과 부당한 대우가 만연하여 민중의 삶은 극심한 고통과 절망 속에서 흘러갔으며, 이집트의 과거 영광은 점차 잊혀져 갔습니다.\n아랍 정복 이전의 이집트는 이와 같이 외세의 착취와 내분, 행정 체계의 미비로 인한 전반적인 침체 상태가 지속되었으며, 사회와 경제 전반에 걸쳐 암울한 현실이 자리잡게 되었습니다. 외부의 강압적 통치와 과도한 세금, 군사적 부담은 이집트인들에게 극심한 고통과 불만을 안겨주었으며, 그 결과 이집트 사회는 점차 활력을 잃어갔습니다. 이러한 암흑기는 오스만 제국이 이 지역에 발을 들이기 전까지 지속되었으며, 이집트의 전통적 가치와 문화는 내부의 갈등과 외부의 압력 속에서 크게 위축되었음을 보여주었습니다. 전체적으로 당시 이집트는 경제적, 정치적 자주성을 상실하고, 오랜 기간 동안 고통과 침체의 굴레에 빠진 암흑기로 평가될 수 있었습니다."
 EGY_country_intro_content_2: "무함마드 알리가 19세기 초 이집트 총독으로 부임하면서, 오스만 제국의 간접 통치 하에 있던 이집트는 본격적인 근대화의 길을 걷기 시작하였습니다. 무함마드 알리는 군제 개혁과 행정 체계의 재정비, 경제·교육·산업 발전을 위한 과감한 개혁 정책을 추진함으로써 이집트 사회에 새로운 활력을 불어넣으였습니다. 당시 그는 서구의 기술과 제도를 적극 도입하여 이집트의 전통적 구조를 현대적 국가 체제로 전환하는 데 주력하였으며, 이로 인해 군사력과 경제력이 크게 향상되는 성과를 거두었습니다. 사회 각 계층에서는 이러한 개혁이 점차 안정을 가져다주었으며, 국가 전반에 걸쳐 근대 문물의 도입과 인프라 확충이 이루어졌습니다.\n19세기 후반부터 20세기 초까지 이집트는 유럽 열강의 제국주의적 압력 속에서도 민족주의 운동이 활발하게 전개되는 모습을 보이었습니다. 1919년 대대적인 독립 혁명이 발발하였으며, 이 혁명은 이집트 국민들이 자주권 회복과 정치적 독립을 향한 열망을 적극적으로 표출한 사건이었습니다. 이 시기에 이집트인들은 영국의 식민 통치에 맞서 다양한 독립 운동과 정치적 시도를 전개하였으며, 이러한 노력은 점차 국제 사회에서도 긍정적인 평가를 받게 되었습니다. 독립 운동가들은 자국의 전통과 문화를 되살리고, 근대 국가로서의 자립 기반을 마련하고자 한 노력이 큰 의의를 지니고 있었습니다.\n무함마드 알리 이후, 이집트는 근대적 행정과 산업 기반이 점차 확립됨과 동시에, 외세의 간섭 속에서도 독자적인 정체성을 회복하기 위한 노력을 지속하였습니다. 정치·경제·문화 전반에서 서구식 제도와 기술이 도입되었으며, 이러한 변화는 이집트가 점차 근대 국가로 자리매김하는 데 중요한 역할을 하였습니다. 특히, 독립을 위한 다양한 사회 운동과 정치적 시도는 이집트의 자주권 회복에 긍정적인 영향을 미쳤으며, 국민들의 자긍심을 높이고 미래지향적 변화를 촉진하는 계기가 되었습니다. 당시 이집트 사회는 전통과 근대가 공존하는 복합적 양상 속에서, 외세의 압력에도 굴하지 않고 독립을 위한 끊임없는 노력을 펼치면서 점진적으로 자치권을 확대해 나가는 모습을 보였습니다.\n하지만 이집트의 노력은 1935년 11월 일어난 대전이의 영향으로 새로운 국면으로 접어들었습니다. 대영제국은 이계인의 침공에 본토의 절반을 상실했고, 이집트의 독립이 눈앞에 다가오게 되었으나, 대전이와 함께 사막에서 출현한 괴수 '비나'는 국가의 역량을 갉아먹고 있습니다. 이들을 처리해줄 '구원자'가 나타나지 않는 한, 이는 이집트가 감내해야 할 고통이자 시험이 될 것입니다."

