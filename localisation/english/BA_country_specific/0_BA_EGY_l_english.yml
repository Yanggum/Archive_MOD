 # Events
 EGY_news.1.t:0 "Blue Shirts Organized in Egypt"
 EGY_news.1.desc:0 "Cairo political newspapers recently expressed concern over the Wafd Party's youth organization, or gang of thugs, called the Blue Shirts. Originally organized to suppress anti-democratic party activities, the group has become extreme and is threatening the democratic system. In several media outlets, the Blue Shirts were found exercising violence against civilians, receiving significant domestic and international criticism.\n\nThe Egyptian Royal Parliament announced there is no problem with maintaining peace, but some in political science circles claimed that unrest in Cairo's political world is intensifying and urged strong measures. Under the demand for a quick response, the government unsheathed its sword by scheduling a wide-scale investigation of the Blue Shirts. However, citizens are agitated: Cairo has been shaking since the British Empire fell."
 EGY_news.1.a:0 "It follows in the footsteps of Weimar."

 EGY_news.2.t:0 "Mansoura Agreement Signed"
 EGY_news.2.desc:0 "With the Wafd Party holding a majority in the domestic political world of Egypt, King Farouk I approved the constitutional monarchy reform plan, and the 'Mansoura Agreement' was signed. Through this agreement, Egypt officially transitioned to a constitutional monarchy state, and citizens praised the King's excellent decision.\n\nThe Wafd Party is further solidifying its political foundation through compromise with minor parties, and it was analyzed that the possibility of establishing a dominant-party democratic system is increasing. Local experts evaluated this agreement as an event that provided a major turning point in Egypt's political system, and at the same time, concerns about a retreat of democracy due to the concentration of power were raised, but the government clarified its position that it would focus on national unity and establishing a stable political order. Foreign media are showing a complex reaction to this agreement with both positive and negative views and are paying attention to the impact it will have on future domestic and international situations."
 EGY_news.2.a:0 "The start of African democracy."

 EGY_news.3.t:0 "Anti-Colonialist Proclamation"
 EGY_news.3.desc:0 "Recently, the Egyptian government officially announced an anti-colonialist proclamation, expressing a firm stance against European colonial rule.\n\nFollowing the independence of Egypt and British East Africa after the British Empire's exile to Canada, Egypt was seeking close cooperation with independent African states while publicly criticizing Italy's rule of Ethiopia and showing active anti-colonialist behavior such as accepting colonial rebel organizations within Europe.\n\nGovernment officials emphasized that this proclamation was intended to firm up the will for international solidarity against colonial rule and contribute to building a new international order based on autonomy and equality."
 EGY_news.3.a:0 "Egypt is trying to become the hegemon of Africa."

 EGY_news.4.t:0 "Middle East Alliance"
 EGY_news.4.desc:0 "According to news from Cairo, the Kingdom of Egypt is strengthening diplomatic contacts with several independent kingdoms on the Arabian Peninsula and signatories of the Treaty of Saadabad amidst the rapidly changing international situation. A government official stated that close cooperation with Arabia, Iran, and Turkey is an important step for protecting regional autonomy and expanding economic exchange.\n\nThese movements are being interpreted as a trend where independent countries in the Middle East unite to guarantee mutual security and political independence amidst intensifying confrontations between great powers. The Egyptian Ministry of Foreign Affairs announced that a meeting for strengthening a joint defense pact and economic cooperation will be held in the near future, which is expected to have a major impact on future regional balance."
 EGY_news.4.a:0 "Past enemies are now allies."

 EGY_news.5.t:0 "Green Shirts Organized in Egypt"
 EGY_news.5.desc:0 "In Cairo's political circles, the coalition between the Muslim Brotherhood and the Young Egypt Party has recently caused a great stir. As part of their cooperation, the two forces launched a youth organization modeled after Italy's Blackshirts, the so-called 'Green Shirts'.\n\nThey are intensifying political tension by violently clashing on streets and campuses with the 'Blue Shirts' operated by the Wafd Party. The Green Shirts advocate for Egyptian imperialism and Islamic fundamentalism, directly criticizing the existing democratic big-tent party, the Wafd Party. Political analysts predict that such confrontation may intensify future instability in the Egyptian political situation and likely lead to a reorganization of the domestic political order."
 EGY_news.5.a:0 "What does their imperialism look like?"

 EGY_news.6.t:0 "Reproduction of the March on Rome"
 EGY_news.6.desc:0 "An upheaval has occurred in the Cairo political situation. The 'Green Shirts' led by the coalition of the Young Egypt Party and the Muslim Brotherhood entered the Cairo Palace and virtually seized the initiative of the government. Foreign media are naming it the 'March on Cairo', saying it is reminiscent of Mussolini's March on Rome.\n\nKing Farouk I accepted their demands to avoid armed conflict, and as a result, Egyptian politics is rapidly transforming into a fascist system. Experts evaluate that Egypt has virtually abandoned democratic order and entered a new state system with strong authoritarian and Islamic fundamentalist colors, and the ripple effect across the entire Middle East is expected to be significant."
 EGY_news.6.a:0 "The birth of Italy's second unit."

 EGY_news.7.t:0 "Proclamation of the Egyptian Empire"
 EGY_news.7.desc:0 "Another turning point has been prepared in the Egyptian political situation. King Farouk I officially proclaimed the 'Egyptian Empire' and decided to use the title of Emperor. This is a choice different from traditional monarchical titles like Pharaoh, Sultan, or Khedive, and is causing no small stir domestically and internationally.\n\nPolitical analysts see that Farouk I chose the relatively neutral title of 'Emperor' rather than emphasizing the tradition of a specific group amidst the interests of various forces. This decision is interpreted as an attempt to secure Islamic legitimacy and modern state authority simultaneously, and is expected to bring major changes to Egypt's identity and foreign relations."
 EGY_news.7.a:0 "An Empire? Not a Pharaoh?"

 EGY_news.8.t:0 "Egyptian Coup"
 EGY_news.8.desc:0 "A major incident shaking the political situation has occurred in Egypt. King Farouk I initiated a coup with the military at the forefront and suspended the function of the parliament. Subsequently, he declared the restoration of the 1930 constitution, signaling the revival of virtual absolute monarchy.\n\nThis measure means that limited attempts toward parliamentary democracy have been frustrated, and it is being interpreted as a phase where a new power structure combining the military and royal power is formed. Experts analyze that Farouk I made the choice to control unstable internal affairs and social conflict by force, and it is predicted that this will intensify domestic factional conflict and deal a major blow to international credibility."
 EGY_news.8.a:0 "Power has returned to the King."

 EGY_news.9.t:0 "Free Officers Movement Uprising"
 EGY_news.9.desc:0 "A civil war between Royalist forces and the Free Officers revolutionary forces has fully begun in Egypt. Just a few days after the Free Officers initiated an armed uprising against Farouk I's proclamation of absolute monarchy and restoration of the 1930 constitution, both sides are engaged in fierce fighting centered on the capital Cairo and major military strongholds.\n\nA number of high-ranking officers and core units of the regular army joined the loyalists following the King's order, but a significant number of low-ranking officers and soldiers, who had long-accumulated dissatisfaction, joined the revolutionary army, and the front is rapidly expanding. Citizens are also showing a move to support the revolutionary forces due to resentment toward the wealth gap and corrupt court politics, so the civil war is heading toward an all-out confrontation over the state system beyond a simple power clash."
 EGY_news.9.a:0 "A Republic in Egypt?"

 EGY_south_africa.60.t:0 "Freedom for Angola"
 EGY_south_africa.60.d:0 "The people of [ANG.GetName], liberated from the hands of colonialist oppressors, are ready to take responsibility for their own fate. They have established a provisional government and drafted a constitution. Now the only thing left is to transfer authority from our military governor to the new [ANG.GetAdjective] government."
 EGY_south_africa.60.a:0 "The new nation must be led carefully, otherwise a counter-revolution will succeed!"
 EGY_south_africa.60.b:0 "We welcome them with open arms!"
 EGY_south_africa.60.c:0 "The situation does not allow this yet."
