 GEH_gehenna_academy_idea:0 "Academy of Freedom and Chaos"
 GEH_gehenna_academy_idea_desc:0 "Gehenna guarantees an extremely free lifestyle for the Kivotos population. Sometimes a little too free, unfortunately."

 GEH_hegemony_idea:0 "Pursuit of Hegemony"
 GEH_hegemony_4_idea:0 "Hegemony"

# Event
 GEHENNA_event.1.t:0 "Judgment of Justice"
 GEHENNA_event.1.desc:0 "The Gehenna Military Tribunal has concluded the war crimes trial against the leadership of the former Trinity General School and delivered its final verdict.\n\nThe major members of the Tea Party, including the Tea Party host, were all found guilty of launching an unjust war of aggression against Gehenna. The court sentenced them to lengthy prison terms, and they will soon be transferred to the Gehenna Correctional Bureau.\n\nWith this historic ruling, the era of Trinity has come to an end, and Gehenna's complete victory has been proclaimed to the world."
 GEHENNA_event.1.a:0 "Hmph. Justice has been served. —Hina"
