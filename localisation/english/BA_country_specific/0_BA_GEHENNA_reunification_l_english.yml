l_english:

 # 게헨나 선도부 & 판데모니움 소사이어티 통일 중점
 GEH_unified_gehenna:0 "통일 게헨나"
 GEH_unified_gehenna_desc:0 "판데모니움 소사이어티와 선도부 사이의 갈등은 게헨나의 모두가 알고 있을 만큼 유명했습니다. 이 갈등은 둘 중 하나가 물리적으로 파괴되어야만 해소될 수 있는 형태의 것이었으며, 비극적이지만 [ROOT.GetLeader]의 승리 역시 전쟁을 통해 이루어질 수밖에 없었습니다. 하지만 이 비극 이후, 우리는 재통합된 게헨나, 다시는 분열되지 않을 게헨나를 얻어대는 데 성공했습니다."

 GEH_hot_spring_cooperation:0 "온천개발부와 협력"
 GEH_hot_spring_cooperation_desc:0 "온천개발부는 머저리들이지만, 적어도 그들의 실행력과 건축 속도는 누구보다도 빠릅니다. 물론 저들이 순순히 게헨나를 위해 일하게 하는 것이 쉽지는 않을 것입니다.'"

# GEH_large_hot_spring:0 "게헨나 온천 부글부글 대작전"
# GEH_large_hot_spring_desc:0 "대전이 당시 일부 함께 전이된 힌놈 산맥의 온천수가 게헨나의 지하를 따라 이어지고 있다는 사실을 알고 있나요? 온천개발부는 아주 잘 알고 있습니다! 약간의... 폭발력과 과감함만 있다면, 우리는 이 원대한 '온천 부글부글 대작전'의 성공을 선언할 수 있을 것입니다."

 GEH_emergency_medicine_department_support:0 "응급의학부 지원"
 GEH_emergency_medicine_department_support_desc:0 "현지인들의 의학 기술은 키보토스에 비해 상당히 열등합니다. 단순한 형태의 인공호흡기가 검증되지 않은 최신 기술이며, 키보토스에서는 손쉽게 치료할 수 있는 병들이 아직도 치명적 질병으로 등록되어 있습니다. 응급의학부에 대한 지원은, 현지의 의료 수준을 높이고 게헨나의 현지인들의 수명을 증진시킬 것입니다."

 GEH_gehenna_academy:0 "통합된 게헨나의 미래"
 GEH_gehenna_academy_desc:0 "[ROOT.GetLeader] 아래에서 [ROOT.GetName]는 계속해서 발전하고, 또 성장해 나갈 것입니다. 통합된 게헨나의 미래를 이끌어 갈 [ROOT.GetLeader] 정부의 인도 아래에서 우리는 다시는 분열되고 서로 다투지 않을 것입니다."

 GEH_repudiation_of_the_eden_treaty: "에덴 조약 재추진"
 GEH_centralized_eden_treaty: "중앙화된 에덴 조약"
 GEH_decentralized_eden_treaty: "분권화된 에덴 조약"
 GEH_forced_integration: "강제 병합"
 GEH_trinity_war_crime_trial: "트리니티 전범 재판"

 GEH_68_problem:0 "[HEU.GetName] 문제"

 ## 선도부 승리 중점
 GEH_the_end_of_pandemonium:0 "만마전 통치권의 끝"
 GEH_the_end_of_pandemonium_desc:0 "만마전의 지배력은 이제 없으며, [ROOT.GetLeader]의 힘이 게헨나 전체를 장악했습니다. 우리는 이제 혼돈이 아닌 질서를 게헨나에 가져올 것이며, 만마전이 한 때 게헨나 땅에 뿌려 놓았던 풍기문란의 잔재들을 모조리 쓸어내 지울 것입니다."

 GEH_trial:0 "재판"
 GEH_trial_desc:0 "대전이 이전 만마전의 선도부 예산권 남용 등에 대한 법적 재판이 실행될 것입니다. 재판은 정당하게 진행될 것이며, 하누마 마코토와 이에 동조한 자들은 합리적인 수준의 처벌을 받게 될 것입니다."

 GEH_personnel_retraining:0 "의원 재신임선거"
 GEH_personnel_retraining_desc:0 "만마전은 의장과 의원의 내각제 체제로 이루어져 있습니다. 의장을 직접선거로 선출한다는 차이가 있지만요. 의원들에 대한 재신임선거 절차는 형식적이지만, 그들이 만마전에서 갖는 직급과 명예를 인정하겠다는 선언이기도 합니다."

 GEH_forced_dissolution:0 "정당한 숙청"
 GEH_forced_dissolution_desc:0 "복잡한 재판 절차가 필요할까요? 우리는 게헨나의 질서를 위하여 행동하지만, 만마전은 키보토스에서 단 한 번도 선도부의 질서를 인정한 적이 없습니다. [ROOT.GetLeader]에 의해 분류된 기준에 따라 만마전 중심 인물들은 재판 없이 즉각적인 처벌을 받을 것입니다."

 GEH_movement_downgrade_pandemonium:0 "주간 만마전 폐지"
 GEH_movement_downgrade_pandemonium_desc:0 "예쁜 탄가 이부키 사진 말고는 주간 만마전 신문에 솔직히 어떤 가치가 있었습니까? 아무것도 없었죠. 이것들을 위해 예산을 사용하는 것은 광기일 뿐입니다."

 GEH_legitimate_dominion:0 "정당한 지배권"
 GEH_legitimate_dominion_desc:0 "게헨나의 기존 법률에 따르면 만마전은 선도부의 (형식적인) 상급조직이었습니다. 이제는 아닙니다. 우리는 그 어떠한 상급조직을 필요로 하지 않으며, 만마전의 추악한 잔재는 영원히 역사 속으로 사라졌습니다."

 ## 만마전 승리 중점
 GEH_the_end_of_perfect_team:0 "선도부의 끝"
 GEH_the_end_of_perfect_team_desc:0 "'무적철갑 토라마루 모든 것을 쓸어버려라...' 자랑스러운 판데모니움 소사이어티 찬양가가 이제 선도부 본부에서도 흘러나옵니다. 게헨나의 패권 경쟁에서 승리한 것은 결국 만마전이었으며, 지긋지긋한 선도부의 존재 의미는 이제 사라졌습니다."

 GEH_take_command:0 "실행부 편입"
 GEH_take_command_desc:0 "게헨나 선도부는 행정조직인 기획부와 무력조직인 실행부 등으로 나뉘어져 있습니다. 아. 악명 높은 소라사키 히나의 정보부도 있었죠. 어쨌거나 이러한 조직들 중 우리에게 가장 필요한 것은 군부인 실행부입니다. 아마 절반 이상의 부원들이 우리에 대한 충성을 거부하겠지만, 금전적인 유혹은 일부의 마음을 돌릴 수 있게 할 것입니다."

 GEH_top_and_bottom_clothes:0 "간부진 편입"
 GEH_top_and_bottom_clothes_desc:0 "이미 독립적인 선도부는 없습니다. 아무리 만마전에 대한 뿌리 깊은 불신이 있다 하더라도, 간부들이 게헨나에서 치안을 위해 노력하고자 한다면, '만마전에 복종하는 게헨나 선도부'의 개념을 받아들여야 할 것입니다. 싫다면 무직자가 되는 거고요."

 GEH_perfect_team_disbanded:0 "선도부 해산"
 GEH_perfect_team_disbanded_desc:0 "선도부의 가장 말단 인원이라도 '판데모니움 소사이어티'를 위해 충성을 다할 것이라고 기대하기는 어렵습니다. 차라리 선도부를 해산하고 그들을 모조리 쫓아내버리는 것이 낫지 않을까요?"

 GEH_clearing_the_remnants:0 "질서경찰"
 GEH_clearing_the_remnants_desc:0 "선도부가 없어졌습니다. 이 소식은 게헨나 전체의 범죄자들에게 '게헨나가 범죄 합법 지대가 되었다'는 잘못된 생각을 가져다 주고 있습니다. 아니요. 만마전이 그 정도로 멍청한 조직은 (아마도) 아닙니다. 현지인들로 구성된 질서경찰은 선도부의 역할을 대신할 것입니다."

 GEH_civilian_control:0 "선도부 그 위의 만마전"
 GEH_civilian_control_desc:0 "선도부 통합 문제가 완전하게 해결되었습니다. 물론 백 퍼센트의 '완전'은 없습니다. 선도부원들은 여전히 우리를 증오할 것이며 만마전에 편입된 일부 인력들은 차별을 피할 수 없을 것입니다. 하지만 적어도 내전 상태보다는 낫지 않겠습니까?"

# 국민정신
 GEH_club_processing_idea:0 "게헨나 통합주의"
 GEH_club_integration_idea:0 "학생자치회"

 GEH_gehenna_academy_idea:0 "자유와 혼돈의 학원"
 GEH_gehenna_academy_idea_desc:0 "게헨나는 키보토스계 인구를 위한 매우 자유로운 생활을 보장합니다. 너무 자유롭다는 것이 문제가 될 때도 많지만요."

 GEH_hegemony_idea:0 "패권 추구"
 GEH_hegemony_4_idea:0 "패권"