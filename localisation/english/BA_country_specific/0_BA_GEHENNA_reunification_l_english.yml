l_english:

 TRM_auto_conference.1.t: "Weimar Conference"
 TRM_auto_conference.1.d: "As the joint Gehenna campaign against Trinity Academy progresses rapidly, the time has inevitably come for Gehenna to consider the disposition of Trinity's territories.\n\nThe detailed partition of Trinity Academy after the war may be temporarily postponed, and instead a provisional mandate administration could be established to eradicate the war radicals within Trinity.\n\nOur \"friends\" have expressed interest in such a conference. Without a doubt, they will want some form of compensation for their sacrifices."
 TRM_auto_conference.1.a: "We need a conference to discuss the future of Europe."
 TRM_auto_conference.1.b: "We cannot cooperate with [auto_conference_1_partner.GetNameDef]."
 TRM_auto_conference.101.t: "Weimar Conference"
 TRM_auto_conference.101.d: "The war with [TRM.GetNameDef] is rapidly approaching an inevitable phase, and discussions on Gehenna's future are now being held in Weimar.\n\nThey have proposed placing [TRK.GetNameDef] under a mandate administration called the 'Eden Administrative Authority.' This arrangement would partially compensate Gehenna Academy for its losses, while freeing us from the complicated political landscape of Gehenna and allowing us to establish full control over Trinity and expel the instigators of the war."
 TRM_auto_conference.101.a: "Let us support each other until the end."
 TRM_auto_conference.101.b: "Our peace will be decided by us."
 TRM_auto_conference.102.t: "[auto_conference_1_partner.GetNameDef] Refuses Participation"
 TRM_auto_conference.102.d: "The conference proposed by our nation to discuss the future of Gehenna has ended in failure.\n\nTo put it bluntly, regarding plans and cooperation for the post-war order in Europe, [auto_conference_1_partner.GetNameDef] has refused to acknowledge any necessity for them."
 TRM_auto_conference.102.a: "This is troubling."

 # Gehenna Prefect Team & Pandemonium Society Unification Focus
 GEH_unified_gehenna:0 "Unified Gehenna"
 GEH_unified_gehenna_desc:0 "The conflict between the Pandemonium Society and the Prefect Team was infamous enough that everyone in Gehenna knew about it. It was the kind of conflict that could only be resolved if one side was physically destroyed, and tragically, [ROOT.GetLeader]'s victory could only be achieved through war. Yet after this tragedy, we succeeded in creating a reunited Gehenna—one that will never again be divided."

 GEH_hot_spring_cooperation:0 "Cooperate with the Hot Spring Development Club"
 GEH_hot_spring_cooperation_desc:0 "The Hot Spring Development Club are idiots, but at the very least their execution and construction speed surpass anyone else's. Of course, getting them to work obediently for Gehenna will not be easy."

# GEH_large_hot_spring:0 "Gehenna Grand Bubbling Hot Spring Operation"
# GEH_large_hot_spring_desc:0 "Did you know that the hot spring waters of the Hinom Mountains, which were partially transported here during the Great War, now run beneath Gehenna's underground? The Hot Spring Development Club certainly knows! With just a bit of... explosive power and boldness, we may yet declare the success of this grand 'Bubbling Hot Spring Operation.'"

 GEH_emergency_medicine_department_support:0 "Support the Emergency Medicine Club"
 GEH_emergency_medicine_department_support_desc:0 "Local medical technology is significantly inferior compared to Kivotos. Even simple ventilators are considered unverified cutting-edge technology here, and diseases easily treatable in Kivotos are still classified as fatal illnesses. Supporting the Emergency Medicine Club will raise the local medical standard and extend the lifespans of Gehenna's local population."

 GEH_gehenna_academy:0 "The Future of a Unified Gehenna"
 GEH_gehenna_academy_desc:0 "Under the leadership of [ROOT.GetLeader], [ROOT.GetName] will continue to develop and grow. Guided by the government of [ROOT.GetLeader], which leads the future of a unified Gehenna, we will never again be divided and fight among ourselves."

 GEH_repudiation_of_the_eden_treaty: "Renew the Eden Treaty"
 GEH_centralized_eden_treaty: "Centralized Eden Treaty"
 GEH_decentralized_eden_treaty: "Decentralized Eden Treaty"
 GEH_forced_integration: "Forced Integration"
 GEH_trinity_war_crime_trial: "Trinity War Crimes Trial"

 GEH_68_problem:0 "[HEU.GetName] Problem"

 ## Prefect Team Victory Focus
 GEH_the_end_of_pandemonium:0 "The End of Pandemonium's Rule"
 GEH_the_end_of_pandemonium_desc:0 "The influence of the Pandemonium Society is now gone, and the power of [ROOT.GetLeader] has seized control of all Gehenna. We will now bring order—not chaos—to Gehenna, and sweep away every last trace of the moral decay that Pandemonium once spread across these lands."

 GEH_trial:0 "The Trial"
 GEH_trial_desc:0 "Legal proceedings will be carried out regarding the former Pandemonium leadership's abuse of the Prefect Team's budget before the Great War. The trial will proceed fairly, and Hanuma Makoto and those who cooperated with her will receive punishment at a reasonable level."

 GEH_personnel_retraining:0 "Council Reconfirmation Election"
 GEH_personnel_retraining_desc:0 "Pandemonium operates under a parliamentary system composed of a chairperson and council members—though the chairperson is directly elected. While the reconfirmation election for council members may be largely procedural, it is also a declaration recognizing their ranks and honor within Pandemonium."

 GEH_forced_dissolution:0 "Justified Purge"
 GEH_forced_dissolution_desc:0 "Do we really need complicated legal procedures? We act for the order of Gehenna, yet Pandemonium has never once acknowledged the authority of the Prefect Team in all of Kivotos. According to criteria determined by [ROOT.GetLeader], the central figures of Pandemonium will receive immediate punishment without trial."

 GEH_movement_downgrade_pandemonium:0 "Abolish Weekly Pandemonium"
 GEH_movement_downgrade_pandemonium_desc:0 "Aside from pretty photos of Tanga Ibuki, what real value did the Weekly Pandemonium newspaper ever have? None at all. Spending budget on this nonsense is nothing short of madness."

 GEH_legitimate_dominion:0 "Legitimate Authority"
 GEH_legitimate_dominion_desc:0 "According to Gehenna's existing laws, Pandemonium was once the (formal) superior organization of the Prefect Team. Not anymore. We require no higher authority, and the vile remnants of Pandemonium have vanished into history forever."

 ## Pandemonium Victory Focus
 GEH_the_end_of_perfect_team:0 "The End of the Prefect Team"
 GEH_the_end_of_perfect_team_desc:0 "'Invincible armored Toramaru, sweep everything away...' The proud anthem of the Pandemonium Society now echoes even within the Prefect Team headquarters. In the struggle for Gehenna's supremacy, it was ultimately Pandemonium that prevailed, and the tiresome existence of the Prefect Team has now come to an end."

 GEH_take_command:0 "Absorb the Execution Department"
 GEH_take_command_desc:0 "The Gehenna Prefect Team is divided into administrative organizations such as the Planning Department and armed units such as the Execution Department. Ah, and of course there was the infamous Intelligence Department led by Sorasaki Hina. In any case, among these organizations the one we need most is the military arm—the Execution Department. More than half of its members will likely refuse loyalty to us, but financial incentives may persuade some to reconsider."

 GEH_top_and_bottom_clothes:0 "Absorb the Leadership"
 GEH_top_and_bottom_clothes_desc:0 "The Prefect Team is no longer independent. No matter how deeply rooted their distrust of Pandemonium may be, if the leadership truly wishes to maintain order in Gehenna, they must accept the concept of a 'Gehenna Prefect Team subordinate to Pandemonium.' If they refuse, well... unemployment is always an option."

 GEH_perfect_team_disbanded:0 "Disband the Prefect Team"
 GEH_perfect_team_disbanded_desc:0 "Even the lowest-ranking members of the Prefect Team cannot be expected to devote their loyalty to the Pandemonium Society. Would it not be simpler to just dissolve the Prefect Team entirely and drive them all out?"

 GEH_clearing_the_remnants:0 "Order Police"
 GEH_clearing_the_remnants_desc:0 "The Prefect Team is gone. This news has led criminals across Gehenna to the mistaken belief that the academy has become a lawless paradise. No. The Pandemonium Society is not that foolish—probably. A new Order Police force composed of locals will take over the Prefect Team's role."

 GEH_civilian_control:0 "Pandemonium Above the Prefect Team"
 GEH_civilian_control_desc:0 "The issue of integrating the Prefect Team has been fully resolved. Of course, nothing is ever one hundred percent 'complete.' Many Prefect members will continue to hate us, and some personnel absorbed into Pandemonium will inevitably face discrimination. But surely this is still better than a state of civil war."

