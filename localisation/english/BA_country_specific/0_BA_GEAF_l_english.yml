 GEAF_the_four_year_plan_desc: "$GER_four_year_plan_desc$"
 GEAF_economic_self_reliance_attempt: "Re-pursue Economic Self-Reliance"
 GEAF_economic_self_reliance_attempt_desc: "While we have no reason to engage in reckless economic ventures like Mefo Bills, the economic self-reliance policy pursued by the previous government must continue. We will re-establish the Four-Year Plan and drive Germany's economic policy once more."
 GEAF_autarky_efforts: "Focus on Economic Autarky"
 GEAF_autarky_efforts_desc: "$GEK_autarky_desc$"
