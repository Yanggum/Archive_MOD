 GEAF_Mefo_return: "Securing Mefo Bills"
 GEAF_Mefo_return_desc: "We must now exchange the Mefo Bills we hold for tangible industrial assets. This will allow us to declare the recovery of the German economy and begin full-scale economic activity."
 GEAF_prioritize_economic_growth: "Prioritize Economic Growth"
 GEAF_prioritize_economic_growth_desc: "Long-standing, poor fiscal policies nearly bankrupted our economy. Now, we must build tractors instead of tanks, distribute shovels instead of rifles, and prioritize economic growth over the arms industry!"
 GEAF_currency_reforms: "Currency Reform"
 GEAF_currency_reforms_desc: "The first step toward economic recovery and revitalization is a comprehensive currency reform."
 GEAF_lower_taxes: "Lower Taxes"
 GEAF_lower_taxes_desc: "The tax burden on the people has steadily increased due to the rearmament plans. Relieving this burden may reduce national revenue in the short term, but it will allow the people to spend more of the money they have worked so hard to earn."
 GEAF_workers_rights: "Workers' Rights"
 GEAF_workers_rights_desc: "Labor unions have changed fundamentally over the past few years, to the point where they are unrecognizable from their original forms. By reforming them, we can rally the workers and allow them to enjoy the benefits they deserve."
 GEAF_abolish_price_controls: "Abolish Price Controls"
 GEAF_abolish_price_controls_desc: "The price control measures introduced to support rearmament are stifling the economy. Removing them may decrease national revenue, but it will enable people to start new businesses and revitalize the economy."
 GEAF_increased_trade: "Increased Trade"
 GEAF_increased_trade_desc: "For the German people to prosper, we must import what we cannot produce domestically. We must look outward and forge new trade agreements—naturally, in a direction that suits our interests."
 GEAF_housing_developments: "Housing Developments"
