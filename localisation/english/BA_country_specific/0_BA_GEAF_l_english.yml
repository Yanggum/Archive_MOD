 GEAF_institute_price_controls: "Institute Price Controls"
 GEAF_institute_price_controls_desc: "$GEK_institute_price_controls_desc$"
 GEAF_unlock_price_controls_decision_tt: "Unlocks Decisions: §Y$GEK_price_controls_cat$§! which can reduce §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 GEAF_industrial_consumer_goods_factor_limit_tt: "§Y[GetIndustrialModifier]§! have §Rless§! than $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y90%§!"
 GEAF_establish_the_reichswerke: "Establish the $GER_reichswerke$"
 GEAF_establish_the_reichswerke_desc: "We must eliminate the influence of fickle private industrial capitalists. Therefore, we will form an industrial conglomerate under our control to oversee growth in the mining and steel sectors. This will form the backbone of our defense industry."
 GEAF_unlock_reichswerke_tt: "Unlocks §Y$GER_reichswerke$§! as an Industrial Concern."
 GEAF_seize_foreign_industries: "Seize Foreign Industries"
 GEAF_seize_foreign_industries_desc: "$GER_seize_foreign_industries_desc$"
 GEAF_coal_liquefaction: "Coal Liquefaction"
 GEAF_coal_liquefaction_desc: "$GER_coal_liquidization_desc$"
 GEAF_subsidize_hoesch_benzin: "Subsidize Hoesch-Benzin"
 GEAF_subsidize_hoesch_benzin_desc: "$GER_subsidize_hoesch_benzin_desc$"
 GEAF_establish_buna_werke: "Establish Buna-Werke"
 GEAF_establish_buna_werke_desc: "$GER_establish_buna_werke_desc$"
 GEAF_autarky_achieved: "Autarky Achieved"
 GEAF_autarky_achieved_desc: "$GER_autarky_achieved_desc$"
 GEAF_improve_autarkic_economy_tt: "Improve §Y$autarkic_economy$§!"
 GEAF_accelerate_the_rearmament_program: "Accelerate Rearmament Program"
 GEAF_accelerate_the_rearmament_program_desc: "$GER_accelerate_the_rearmament_program_desc$"
 GEAF_concentrated_armament_program: "Concentrated Armament Program"
 GEAF_concentrated_armament_program_desc: "Our industry must be able to supply the military equipment needed for the nation's rearmament. A total rearmament plan must be implemented to rapidly modernize and expand our forces!"
 GEAF_establish_production_targets: "Establish Production Targets"
 GEAF_establish_production_targets_desc: "$GER_establish_production_targets_desc$"
 GEAF_prioritize_the_army: "Prioritize the Army"
 GEAF_prioritize_the_army_desc: "Germany, and Prussia before that, have always been a land power and relied on the army to safeguard our sovereignty and security. We must redirect our industrial efforts to ensure our army is well-equipped and capable of subjugating any foe."
 GEAF_prioritize_the_navy: "Prioritize the Navy"
 GEAF_prioritize_the_navy_desc: "Control over the seas will be vital if we want to expand our reach beyond our current borders. We must prioritize the navy so that it can rival any enemy fleet in size and power."
 GEAF_extra_funds_to_waffenamt: "Extra Funds to Waffenamt"
 GEAF_extra_funds_to_waffenamt_desc: "The Waffenamt, or Weapon Agency, supervises the design and development of military equipment. It collaborates with arms manufacturers and research institutes, and by giving it extra funds we might increase the rate of progress."
 GEAF_zentrale_planung: "Form Central Planning Committee"
 GEAF_zentrale_planung_desc: "$GER_zentrale_planung_desc$"
 GEAF_criteria_for_economy_laws_tt: "$GER_criteria_for_economy_laws_tt$"
 GEAF_create_rustungsstab: "Establish Rüstungsstab"
 GEAF_create_rustungsstab_desc: "$GER_create_rustungsstab_desc$"
 GEAF_armament_rationalization: "Armament Rationalization"
 GEAF_armament_rationalization_desc: "$GER_armament_rationalization_desc$"
 GEAF_totaler_krieg: "Total War"
 GEAF_totaler_krieg_desc: "To achieve complete victory, we must mobilize our entire society and bring total war to the doorsteps of our enemies. The time has come for [ROOT.GetNameDef] to rise and for the storm to break!"
 GEAF_gain_totaler_krieg_remove_total_mob_tt: "§RRemove§! §Y$tot_economic_mobilisation$§!. Gain §Y$totaler_krieg_economy$§!."


