 GE1_start_focus: "Unify West Germany"
 GE1_start_focus_desc: "Now that our military achievements have allowed our forces to unify West Germany, it is time to recall former government figures."
 GE2_start_focus: "Unify East Germany"
 GE2_start_focus_desc: "Now that our military achievements have allowed our forces to unify East Germany, it is time to recall former government figures."
 GE1_reorganize_nationale_volksarmee: "Found the National People's Army"
 GE1_reorganize_nationale_volksarmee_desc: "Corruption and fascist apologism are still rampant within our military. To prevent resistance and treason, we must first weed out those who would rebel against us. This process will create significant vacancies in the military, so to ensure the safety of the people, we must appoint new loyal officers to lead our brave soldiers into whatever battlefields may arise."
 GE1_monarchist_sentiment: "Monarchist Sentiment"
 GE1_monarchist_sentiment_desc: "Our people desire a monarchy, and they shall have one. While the form of government has not yet been specified, it is clear that Germans need a Kaiser."
 GE2_return_of_the_kaiserreich: "Resurgence of the German Empire"
 GE2_return_of_the_kaiserreich_desc: "Much has happened since our unification. Now, those who follow us desire a monarchy and will strive to restore the Kaiser to the throne."
 GE2_start_the_proletarian_revolution: "Proletarian Revolutionary Republic"
 GE2_start_the_proletarian_revolution_desc: "Now that our nation has unified the West German region and declared the revolution of the proletarian people, we are truly the vanguard of the revolution and the light of humanity."

 GE2_ambition_for_the_west: "Toward the Western Territories"
 GE2_united_homeland: "United Homeland"
 GE2_united_homeland_desc: "Now that the calamities of the Great War and the long unification wars have passed, we must seek the reconstruction of our homeland. We will ask the people to set aside personal convenience for a while so that we can focus all our resources on achieving this goal."
