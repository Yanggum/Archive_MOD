l_english:
 # national focus tree
 TRX_trinity_railway_construction: "Railway Connection with Trinity"
 TRX_trinity_railway_construction_desc: "Connecting the logistics of the Divine Mandate to the heart of Trinity is not merely an engineering feat; it is the physical manifestation of our sacred bond. Through these iron veins, the grace of the Tea Party shall flow to every corner of the frontier."
 TRX_spires_and_frozen_stones_covered_in_ashen_dus: "Spires and Frozen Stones Covered in Ashen Dust"
 TRX_spires_and_frozen_stones_covered_in_ashen_dus_desc: "Beneath the gray skies of this desolate land, the ancient architecture stands as a silent witness to a forgotten past. We must reclaim these ruins, for even in the coldest stone, the light of Trinity can find a home."
 TRX_national_reconstruction: "National Reconstruction"
 TRX_national_reconstruction_desc: "The scars of war run deep, but the resolve of the students is deeper. We shall rebuild what was lost, guided by the principles of elegance and order that define our academy."
 TRX_GetCapitalVictoryPointName_development: "Reconstruction of [ROOT.Capital.GetCapitalVictoryPointName]"
 TRX_GetCapitalVictoryPointName_development_desc: "Our capital shall no longer be a monument to ruin. It will be transformed into a beacon of civilization, a testament to the administrative excellence of the Trinity Council."
 TRX_GetCapitalVictoryPointName_establish_of_arsenal: "[ROOT.Capital.GetCapitalVictoryPointName] Arsenal"
 TRX_GetCapitalVictoryPointName_establish_of_arsenal_desc: "To protect our peace, we must possess the means to enforce it. A modern arsenal will ensure that our students are never left defenseless against the chaos of the wasteland."
 TRX_urban_housing_project: "Urban Housing Project"
 TRX_urban_housing_project_desc: "Proper housing is the foundation of a stable society. We will provide clean, orderly living spaces for the populace, ensuring they recognize the benevolence of their new protectors."
 TRX_arms_production: "Firearms Production Plant"
 TRX_arms_production_desc: "Standardization is key to military efficiency. By establishing local production of Trinity-pattern firearms, we secure our supply lines and maintain our tactical superiority."
 TRX_long_term_economic_planning: "Long-term Economic Planning"
 TRX_long_term_economic_planning_desc: "Prosperity is not an accident; it is the result of meticulous preparation. We will draft a blueprint for the future that ensures sustainable growth under Trinity's guidance."
 TRX_industrial_research_projects: "Industrial Research Projects"
 TRX_industrial_research_projects_desc: "Knowledge is the greatest resource. By investing in industrial research, we unlock the potential of this land and bring it closer to the technological standards of Kivotos."
 TRX_rebuilding_public_education: "Rebuilding Public Education"
 TRX_rebuilding_public_education_desc: "The mind must be cultivated as carefully as the soil. Our curriculum will instill the values of harmony, history, and the unique heritage of Trinity in the next generation."
 TRX_trinity_style_industry: "Trinity-Model Industrialization Plan"
 TRX_trinity_style_industry_desc: "We are not just building factories; we are building a legacy. Our industry will reflect the aesthetic and functional perfection that is the hallmark of Trinity’s finest workshops."
 TRX_eco_friendly_industry: "Introduction of Eco-friendly Elements"
 TRX_eco_friendly_industry_desc: "A true lady respects the environment. We shall ensure our industrial progress does not come at the cost of the landscape, preserving the natural beauty of the Mandate."
 TRX_infrastructure_restoration: "Infrastructure Restoration"
 TRX_infrastructure_restoration_desc: "Roads and bridges are the bridges between hearts. By restoring the broken infrastructure, we unify the territory and ensure the swift movement of both goods and our peacekeepers."
 TR3_infrastructure_modernization: "Modernization of Urban Infrastructure"
 TR3_infrastructure_modernization_desc: "The old ways must make room for the new. We will implement modern utilities and transport systems, bringing the comforts of a civilized world to these distant frontiers."
 

 # natioanl spirits
 TRN_trinity_controlled_divine_ns: "Trinity Civil-Military Administration"
 TR0_army_ns: "[ROOT.GetAdjective] Army"
 TR0_navy_ns: "[ROOT.GetAdjective] Navy"
 TR0_air_force_ns: "[ROOT.GetAdjective] Air Force"
 TR4_radaslau_astrouski_ns: "$BLR_radislau_astrouski$"
 TR4_radaslau_astrouski_ns_desc: "§YBorn:§! §LOctober 25, 1887, Minsk Governorate, Russian Empire§!\n§YHistory:§! §LRadaslau Astrouski was born into a family of landowners. While studying at the Slutsk school, he was expelled for participating in the 1905 Revolution. He entered Saint Petersburg University in 1908 but was arrested in 1911 for involvement in student riots. Fortunately released, he returned to the university to complete his studies.\n\nWorking as a teacher in Minsk after graduation, Astrouski witnessed the October Revolution of 1917. Opposing the Bolshevik regime, he advocated for Belarusian independence as a representative of the All-Belarusian Congress. This led to his arrest by the Red Guards, and he continued his struggle through repeated cycles of detention and release.\n\nFollowing the outbreak of war between Trinity and [SOV.GetName], he solidified his nationalist convictions and began cooperating with Trinity. The Belarusian Central Rada is striving to gain the support of the Belarusian people and reclaim their unique national identity. By convening the Second All-Belarusian Congress, they have rejected the Belorussian Soviet regime and declared themselves the legitimate successor to the Belarusian People's Republic.§!"
 TRN_central_council: "Belarusian Central Rada"
 TRN_central_council_desc: "\n\n\n£GFX_TRN_banner_central_council\n\n\n\n\nThe Belarusian Central Rada (Council) was established by Trinity through the recruitment of local collaborators. Centered around President $BLR_radislau_astrouski$, the Rada operates under a unique system of coexistence with the Northeastern Divine Mandate."
