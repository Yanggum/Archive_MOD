l_english:

 #하이랜더 불법 점거
 BA_train_school: "하이랜더 철도학원"
 BA_highlander_academy_generic: "하이랜더 철도학원"
 BA_highlander_academy_generic_desc: "학원 전역의 교통망은 하이랜더 철도학원에 의해 운영되고 있으며, 우리의 통제 하에 놓여있지 않습니다. 우리는 하이랜더 철도학원과 그들의 최대투자자에게 교통비를 지불해야하며, 혹은 여러 다른 조치들을 고려해 볼 수 있을 것입니다."
 BA_nationalized_highlander: "하이랜더의 §Y국내 선로§!에 대한 지분을 몰수했습니다."
 BA_highlander: "하이랜더 철도학원"
 BA_highlander_desc: " 하이랜더 철도학원은 키보토스 전역을 가로지르며 방대하게 펼쳐진 선로들을 운영하고 있습니다. 그러나 대전이 이후 하이랜더와 총학생회의 행정 역량은 예전과 같지 못하고, 학원들은 전이된 지역에 존재하는 철도들을 점유하게 되며 하이랜더 철도학원의 지위는 불안정합니다.\n\n 현재 상황에서 우리는 하이랜더가 보유한 선로들의 지분을 몰수하여 교통에 있어서의 자주를 이뤄내거나, 하이랜더 철도학원에 많은 자본을 투자하여 그들을 우리의 지배 하에 놓을 수 있습니다. 또한 철도학원은 투자할 때마다 교통에 관련해서 우리를 다양하게 지원할 것입니다.\n\n    [BA_highlander_best_invester]\n    @[this.gettag] §Y[THIS.getname]§!의 투자 : §Y[?THIS.BA_highlander_invest]§![BA_highlander_use_list]"
 BA_highlander_datasite: "하이랜더 철도학원\n- 열차 및 철도 연구 속도: §G+10%§!\n- [?var:global.highlander_best_invester.GetName] 측에 민간산업 지불: §R+3.00%§!"
 BA_press_highlander: "하이랜더 철도학원 압박"
 BA_press_highlander_desc: "하이랜더 철도학원의 본사가 우리의 통제에 놓여있습니다. 우리는 이들에게 적절한 압력을 가할 수 있을 것입니다."
 BA_highlander_hide_list: "하이랜더 이용 학원 목록 숨기기"
 BA_highlander_show_list: "하이랜더 이용 학원 목록 보이기"
 BA_highlander_hub_construction: "철도허브 설치"
 BA_highlander_hub_construction_desc: "주에 하이랜더 철도허브를 설치합니다.\n§W남은 횟수: §G[?BA_highlander_hub_available]§!§!"
 BA_invest_highlander: "하이랜더에 투자"
 BA_highlander_hub_eat: "철도허브 장악"
 BA_highlander_auto_investment_on: "자동 재투자 켜기"
 BA_highlander_auto_investment_on_desc: "하이랜더 투자로써 등장하는 이벤트가 자동으로 하이랜더 투자를 활성화하도록 합니다."
 BA_highlander_auto_investment_off: "자동 재투자 끄기"


 Highlander.1.t: "기반시설 건설"
 Highlander.1.d: "하이랜더 철도학원에서 영내의 기반시설 건설에 투자하였습니다."
 Highlander.3.t: "선로 증축"
 Highlander.3.d: "하이랜더 철도학원에서 우리 학원 내의 선로를 증축하기로 하였습니다."
 Highlander.3.a: "투자한 보람이 있군."
 Highlander.4.t: "열차 추가 배치"
 Highlander.4.d: "하이랜더 철도학원에서 우리 학원 내의 선로를 오가는 열차를 추가적으로 배치하기로 하였습니다."
 Highlander.5.t: "산업-철도 연계"
 Highlander.5.d: "철도 산업이 발전하면서 학원의 산업 또한 성장하고 있습니다."
 Highlander.6.t: "정상 운행"
 Highlander.6.d: "하이랜더 철도가 '정상적으로' 운행되고 있습니다."
 Highlander.6.a: "놀랍군!"
 Highlander.7.t: "철도학원 간부 파견"
 Highlander.7.d: "하이랜더 철도학원으로부터 우리 [ROOT.getname]의 영내 철로들을 관리하기 위해 중앙관제센터 관료가 파견되었습니다."
 Highlander.8.t: "하이랜더 최대투자국 변경"
 Highlander.8.d: "하이랜더 최대투자국이 변경되었습니다."
 Highlander.8.a: "그렇군."
 Highlander.9.t: "선로 재작업"
 Highlander.9.d: "대전이 이후 현지 철도와 키보토스의 철도는 연결되지 않은 채 산발되어 남아있습니다. 교통이 단절되었고, 수송이 중단되어 산업이 정체되었습니다. 빠른 학원 재건을 위해서는 선로에의 광범위한 재작업이 필수입니다."
 Highlander.9.a: "좋아, 빠르게 가자!"
 Highlander.10.t: "주식 매각"
 Highlander.10.d: "하이랜더 철도학원의 주가가 지속적으로 떨어짐에 따라 우리 학원의 일부 소액 투자자들이 주식을 매각했습니다."
 Highlander.10.a: "알겠다."
 Highlander.11.t: "지분 매각"
 Highlander.11.d: "안정적인 재정을 확보하기 위해서 정부의 관료들이 하이랜더 지분을 일부 매각했습니다."
 Highlander.12.t: "철도 불황"
 Highlander.12.d: "철도 산업이 정체되어 가고 있습니다. 우리 학원의 많은 투자자들이 관련 투자를 중단하고 있습니다."
 Highlander.12.a: "젠장."
 Highlander.13.t: "추가적인 투자"
 Highlander.13.d: "우리는 이번의 투자에서 보다 많은 지분을 획득하였습니다."
 Highlander.13.a: "좋군."
 Highlander.14.d: "하이랜더 철도학원으로부터 우리 [ROOT.getname]의 영내 철로들을 관리하기 위해 화물운송관리부 관료가 파견되었습니다. "
 Highlander.15.t: "궤간 문제"
 Highlander.15.d: "지속적인 노력 끝에 철도 문제는 어느 정도 해소되었고, 이제 우리는 하나의 표준 궤간을 정하여 전국 철도망을 통합, 개편할 계획을 세우고 있습니다. 그러나 여기서 새로운 고민이 생겼습니다. 수많은 궤간 중 어떤 것을 표준으로 채택할 것인가 하는 문제입니다. 각 궤간은 서로 다른 장단점을 지니고 있으며, 선택에 따라 다양한 이익을 얻을 수 있습니다."
 Highlander.15.a: "표준궤로 통일하자."
 Highlander.15.b: "표준궤에 협궤를 섞어 쓰자."
 Highlander.15.c: "이베리아 궤간을 쓰자."
 Highlander.15.e: "광궤를 쓰자."
 Highlander.15.b_tt: "\n§g협궤는 하이랜더 철도의 주류 규격입니다:§!\n"
 Highlander.16.t: "열차 소동"
 Highlander.16.d: "하이랜더의 열차 내에서 테러가 벌어져 도시가 일부가 공격받았습니다."
 Highlander.16.a: "골치 아프군."
 Highlander.17.t: "하이랜더 학생 파견"
 Highlander.17.d: "하이랜더 철도학원으로부터 우리 [ROOT.getname]의 영내 철로들을 원활히 하기 위해 학생이 파견되었습니다."
 Highlander.20.t: "철도허브 추가 설치"
 Highlander.20.d: "[HTA.getname]으로부터 추가적인 철도허브 설치 계획이 승인되었습니다."
 Highlander.20_tt: "§Y하이랜더 철도허브§!를 §G1§!만큼 더 설치할 수 있습니다."
 
 Highlander_upgrade.1.t: "철로 사업: 선로 재작업"
 Highlander_upgrade.1.d: "대전이 이후 현지 철도와 키보토스의 철도는 호환되고 있지 않으며, 지역 철도들은 서로 연결되지 않고 산발적인 채로 남아있습니다. 교통이 단절되었고, 수송이 중단되어 산업이 정체되었습니다. 우리는 이러한 문제를 해결하는 데에 중점을 두어야 합니다."
 Highlander_upgrade.1.a: "철로 사업을 채택하자."
 Highlander_upgrade.1.b: "다른 선택지를 기다리자."
 Highlander_upgrade.1_tt: "'§Y선로 재작업§!'을 철로 사업에 §G채택§!합니다."
 Highlander_upgrade.2.t: "철로 사업: 철도허브 설치"
 Highlander_upgrade.2.d: "하이랜더 철도허브는 [HTA.getname]의 물류 중심지이자 직접적인 활동지입니다. 이곳을 통해 학원의 크고 작은 물건들이 모이고 퍼지며 학원 산업 전역에 펌프질을 합니다. 하이랜더 철도허브의 확충은 보다 높은 산업력을 갖추는 왕도가 될 것이 분명합니다."
 Highlander_upgrade.2_tt: "'§Y철도허브 설치§!'를 철로 사업에 §G채택§!합니다.\n\n§Y하이랜더 철도허브§!를 §G2§!만큼 더 설치할 수 있습니다."
 Highlander_upgrade.3.t: "철로 사업: 교통 건설"
 Highlander_upgrade.3.d: "[HTA.getname] 측은 보다 넓은 범위에서 자신들이 통제하는 교통 시설을 원합니다. 한편, 우리에게는 교통 건설을 통한 산업 기반의 설립이 절실합니다. 이러한 상호 이해관계의 일치는 양측에게 큰 이득을 가져다 줄 것입니다."
 Highlander_upgrade.3_tt: "'§Y교통 건설§!'을 철로 사업에 §G채택§!합니다."
 Highlander_upgrade.4.t: "철로 사업: 적극적 투자"
 Highlander_upgrade.4.d: "[HTA.getname]의 최대투자국은 그들의 수익으로부터 배당금을 받고 있습니다. 그들이 키보토스 전역의 교통망에서 벌어들이는 수익을 생각한다면, 우리는 그들의 잠재가치에 투자하지 않을 수 없습니다. 적극적인 투자로써 우리는 [HTA.getname]의 최대투자국이 될 것입니다."
 Highlander_upgrade.4_tt: "'§Y적극적 투자§!'를 철로 사업에 §G채택§!합니다."
 Highlander_upgrade.5.t: "철로 사업: 하이랜더 제휴"
 Highlander_upgrade.5.d: "나는 하이랜더 실장 캐릭터들이 보고 싶어요."
 Highlander_upgrade.5_tt: "'§Y하이랜더 제휴§!'을 철로 사업에 §G채택§!합니다."

 
