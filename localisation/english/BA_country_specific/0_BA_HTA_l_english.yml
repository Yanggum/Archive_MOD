l_english:

 #Highlander Illegal Occupation
 BA_train_school: "Highlander Railway Academy"
 BA_highlander_academy_generic: "Highlander Railway Academy"
 BA_highlander_academy_generic_desc: "The transportation network across the Academy City is operated by the Highlander Railway Academy and is not under our control. We must pay transportation fees to the Highlander Railway Academy and its largest investor, or consider various other measures."
 BA_nationalized_highlander: "Seized the shares of Highlander's §Ydomestic tracks§!."
 BA_highlander: "Highlander Railway Academy"
 BA_highlander_desc: "The Highlander Railway Academy operates a vast network of tracks that stretch across all of Kivotos. However, since the Great Transfer, the administrative capabilities of Highlander and the General Student Council are no longer what they used to be. As schools occupy the railways existing in the transferred regions, Highlander Railway Academy's status has become unstable.\n\n Under the current circumstances, we can achieve transportation independence by seizing the shares of the tracks held by Highlander, or place them under our control by investing significant capital into the Highlander Railway Academy. Furthermore, every time we invest, the Railway Academy will provide us with various types of support regarding transportation.\n\n    [BA_highlander_best_invester]\n    @[this.gettag] §Y[THIS.getname]§!'s Investment: §Y[?THIS.BA_highlander_invest]§![BA_highlander_use_list]"
 BA_highlander_datasite: "Highlander Railway Academy\n- Train and Railway Research Speed: §G+10%§!\n- Paid civilian industry to [?var:global.highlander_best_invester.GetName]: §R+3.00%§!"
 BA_press_highlander: "Pressure Highlander Railway Academy"
 BA_press_highlander_desc: "The headquarters of the Highlander Railway Academy is under our control. We will be able to exert appropriate pressure on them."
 BA_highlander_hide_list: "Hide list of schools using Highlander"
 BA_highlander_show_list: "Show list of schools using Highlander"
 BA_highlander_hub_construction: "Install Railway Hub"
 BA_highlander_hub_construction_desc: "Install a Highlander Railway Hub in the state.\n§WRemaining uses: §G[?BA_highlander_hub_available]§!§!"
 BA_invest_highlander: "Invest in Highlander"
 BA_highlander_hub_eat: "Seize Railway Hub"
 BA_highlander_auto_investment_on: "Turn on Auto-Reinvestment"
 BA_highlander_auto_investment_on_desc: "Allows events that appear as Highlander investments to automatically activate Highlander investment."
 BA_highlander_auto_investment_off: "Turn off Auto-Reinvestment"


 Highlander.1.t: "Infrastructure Construction"
 Highlander.1.d: "Highlander Railway Academy has invested in the construction of infrastructure within our territory."
 Highlander.3.t: "Track Expansion"
 Highlander.3.d: "Highlander Railway Academy has decided to expand the tracks within our academy."
 Highlander.3.a: "It was worth the investment."
 Highlander.4.t: "Additional Train Deployment"
 Highlander.4.d: "Highlander Railway Academy has decided to deploy additional trains to run on the tracks within our academy."
 Highlander.5.t: "Industry-Railway Linkage"
 Highlander.5.d: "As the railway industry develops, the academy's industry is also growing."
 Highlander.6.t: "Normal Operation"
 Highlander.6.d: "The Highlander Railway is operating 'normally'."
 Highlander.6.a: "Surprising!"
 Highlander.7.t: "Railway Academy Official Dispatched"
 Highlander.7.d: "A Central Control Center official has been dispatched from Highlander Railway Academy to manage the tracks within our [ROOT.getname] territory."
 Highlander.8.t: "Highlander Top Investor Changed"
 Highlander.8.d: "The top investor in Highlander has changed."
 Highlander.8.a: "I see."
 Highlander.9.t: "Track Rework"
 Highlander.9.d: "Since the Great Transfer, the local railways and those of Kivotos remain disconnected and scattered. Transportation has been cut off and transit has halted, leading to industrial stagnation. Extensive rework of the tracks is essential for the rapid reconstruction of the academy."
 Highlander.9.a: "Alright, let's go fast!"
 Highlander.10.t: "Stock Sale"
 Highlander.10.d: "As Highlander Railway Academy's stock price continues to fall, some of our academy's small investors have sold their shares."
 Highlander.10.a: "Understood."
 Highlander.11.t: "Share Divestment"
 Highlander.11.d: "Government officials have sold some of their Highlander shares to secure stable finances."
 Highlander.12.t: "Railway Recession"
 Highlander.12.d: "The railway industry is stagnating. Many investors in our academy are halting related investments."
 Highlander.12.a: "Damn it."
 Highlander.13.t: "Additional Investment"
 Highlander.13.d: "We have acquired more shares through this investment."
 Highlander.13.a: "Good."
 Highlander.14.d: "A Freight Transport Management Department official has been dispatched from Highlander Railway Academy to manage the tracks within our [ROOT.getname] territory."
 Highlander.15.t: "Gauge Issue"
 Highlander.15.d: "After persistent effort, the railway issues have been resolved to some extent, and we are now planning to select a single standard gauge to integrate and reorganize the national railway network. However, a new concern has arisen: which gauge to adopt as the standard? Each gauge has different pros and cons, and various benefits can be gained depending on the choice."
 Highlander.15.a: "Unify with standard gauge."
 Highlander.15.b: "Use a mix of standard and narrow gauge."
 Highlander.15.c: "Use the Iberian gauge."
 Highlander.15.e: "Use broad gauge."
 Highlander.15.b_tt: "\n§gNarrow gauge is the mainstream standard for Highlander Railways:§!\n"
 Highlander.16.t: "Train Disturbance"
 Highlander.16.d: "A terrorist attack occurred on a Highlander train, and part of the city was attacked."
 Highlander.16.a: "What a headache."
 Highlander.17.t: "Highlander Student Dispatched"
 Highlander.17.d: "A student from Highlander Railway Academy has been dispatched to facilitate operations on the tracks within our [ROOT.getname] territory."
 Highlander.20.t: "Additional Railway Hub Installation"
 Highlander.20.d: "[HTA.getname] has approved plans for additional railway hub installations."
 Highlander.20_tt: "You can install §G1§! more §YHighlander Railway Hub§!."
 
 Highlander_upgrade.1.t: "Railway Project: Track Rework"
 Highlander_upgrade.1.d: "Since the Great Transfer, local railways and Kivotos railways are not compatible, and regional railways remain disconnected and scattered. Transportation has been cut off and transit has halted, leading to industrial stagnation. We must focus on solving these issues."
 Highlander_upgrade.1.a: "Adopt the railway project."
 Highlander_upgrade.1.b: "Wait for other options."
 Highlander_upgrade.1_tt: "§GAdopt§! '§YTrack Rework§!' into the railway project."
 Highlander_upgrade.2.t: "Railway Project: Railway Hub Installation"
 Highlander_upgrade.2.d: "The Highlander Railway Hub is the logistics center and direct base of operations for [HTA.getname]. Through this place, goods of all sizes from the academy are gathered and distributed, pumping life into the entire academy industry. Expanding the Highlander Railway Hub will surely be the royal road to achieving higher industrial power."
 Highlander_upgrade.2_tt: "§GAdopt§! '§YRailway Hub Installation§!' into the railway project.\n\nYou can install §G2§! more §YHighlander Railway Hubs§!."
 Highlander_upgrade.3.t: "Railway Project: Transportation Construction"
 Highlander_upgrade.3.d: "[HTA.getname] desires transportation facilities that they control over a wider range. Meanwhile, we desperately need the establishment of an industrial base through transportation construction. This alignment of mutual interests will bring great benefits to both sides."
 Highlander_upgrade.3_tt: "§GAdopt§! '§YTransportation Construction§!' into the railway project."
 Highlander_upgrade.4.t: "Railway Project: Aggressive Investment"
 Highlander_upgrade.4.d: "The top investor of [HTA.getname] receives dividends from their profits. Considering the profits they earn from the transportation network throughout Kivotos, we cannot help but invest in their potential value. Through aggressive investment, we will become the top investor in [HTA.getname]."
 Highlander_upgrade.4_tt: "§GAdopt§! '§YAggressive Investment§!' into the railway project."
 Highlander_upgrade.5.t: "Railway Project: Highlander Partnership"
 Highlander_upgrade.5.d: "I want to see the Highlander students in action. Their efficiency is legendary, even if their methods are... energetic."
 Highlander_upgrade.5_tt: "§GAdopt§! '§YHighlander Partnership§!' into the railway project."
 Highlander_upgrade.6.t: "Railway Utilization Focus: Railway Warfare"
 Highlander_upgrade.6.d: "One of the major battlefields of Kivotos is the urban area. While urban areas are very disadvantageous for infantry and armor due to tall, sturdy buildings, armed armored trains can penetrate the heart of the city via railways to seize transportation routes. New eras require new strategies!"
 Highlander_upgrade.6_tt: "§GAdopt§! '§YRailway Warfare§!' as the railway utilization focus."
 Highlander_upgrade.7.t: "Railway Utilization Focus: Train Supply"
 Highlander_upgrade.7.d: "Maintaining supply lines in a broad battlefield is a very difficult task. However, as long as there are railways, long-distance supply can be easily carried out via trains."
 Highlander_upgrade.7_tt: "§GAdopt§! '§YTrain Supply§!' as the railway utilization focus."
 Highlander_upgrade.8.t: "Railway Utilization Focus: Strongpoint Operation"
 Highlander_upgrade.8.d: "While we are currently maintaining efficient transportation through the Highlander Railway Hub, we should not stop there. By remodeling the Highlander Railway Hub into a military center, we may gain the upper hand in future warfare."
 Highlander_upgrade.8_tt: "§GAdopt§! '§YStrongpoint Operation§!' as the railway utilization focus."
 Highlander_upgrade.9.t: "Railway Utilization Focus: Railway and Industry"
 Highlander_upgrade.9.d: "There is room for further promotion of industrial development through railways."
 Highlander_upgrade.9_tt: "§GAdopt§! '§YRailway Industry§!' as the railway utilization focus."
 Highlander_upgrade.10.t: "Railway Utilization Focus: Our Railways"
 Highlander_upgrade.10.d: "Highlander Railway Academy stands in an unfair position by owning the railways within the academy. We will sequentially strip them of their status and establish our own railways entirely."
 Highlander_upgrade.10_tt: "§GAdopt§! '§YOur Railways§!' as the railway utilization focus."

 
