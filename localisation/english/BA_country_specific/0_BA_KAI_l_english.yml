##Intro
 KAI_country_intro_header: "The Logical Conclusion of Money"
 KAI_country_intro_content: "Ah, money, more money! It is clear that money, that mystical substance, possesses a charm that can lead even the most logical and wise individuals to walk directly into a deep pit. Everyone works for money. They provide services for money and obey the President for money. This \"Logical Conclusion of Money\" has always been taken for granted since the rise of Kaiser Corporation and Capital.\n\nThe Great Catastrophe had a profound impact on Kaiser's reign. Subsidiaries that had enjoyed prosperity across all of Kivotos were forced to return to the Kaiser Emergency Committee, and Kaiser's reputation fell to the ground. Kaiser products are no longer popular items. They are merely dismissed as high-quality but expensive garbage.\n\nTherefore, Kaiser must now seek a new path. It has become clear that they can no longer survive on mere product sales or stock manipulation, and the struggle against the British Empire emerges as if to support this new destiny for Kaiser.\n\nImmediately after the fall of London, numerous British corporations signed oaths of loyalty to Kaiser Corporation, and even on Earth, among humanity, this \"Logical Conclusion of Money\" was accepted as fact. This was a great comfort to the President and the Corporation, and we must fight for a new dawn. Seizing control of the British Isles and trampling over a pathetic, low-quality human civilization is now becoming a simple matter of time.\n\nStabilizing Kaiser Corporation, which has been reborn as a corporate state, redefining diplomacy to restore our glory, and once again placing all of Kivotos under our feet is no longer just our goal, but our manifest and clear destiny and dawn.\n\n§GProsper, Kaiser Corporation, prosper, wealth, and more capital—\n\nThe byproduct of a great civilization—the source of our joy and happiness!§!\n\n§YDeveloper - SKSKIe§!"
 KAI_guide: "Objectives\n\n£white_dot. End the British War.\n£white_dot. Restore the faded corporation and its glory once again.\n£white_dot. Sit back and accept the logical conclusions and results formed by the \"Logical Conclusion of Money,\" and prove to the whole world that you have seized control of all Kivotos and become the greatest corporation in the world.\n\nKaiser Corporation has transformed into a modern corporate state, a feat rarely attempted in history. Prove that such a corporate state of the new era is both the starting point and the final destination of prosperity. No matter what adversity exists, even if the opposing force is an unfathomable existence whose very establishment is impossible,\n\n§RBy any means necessary, prove the survival and prosperity of the corporate state.§!"

#Starting Focuses
 KAI_war_logistics: "British War Logistics"
 KAI_war_logistics_desc: "Contrary to the President's expectations, the British War has dragged on for over two months, and logistics for PMC soldiers are gradually running low. To prevent the neutralization of our military and ensure a firm and swift victory, we must conduct special logistics for the British War."
 KAI_FOCUS_1: "Expelling the Lion"
 KAI_FOCUS_1_desc: "The United Kingdom, putting up useless resistance in the British Isles, fails to realize how weak its own military power is. Now that the sleeping lion has been caught in a net, the only thing left to do is kill it."
 KAI_FOCUS_2: "Appeasing Capitalists"
 KAI_FOCUS_2_desc: "The logic of money is accurate here as well. Shillings? Marks? Pounds? They are all just scraps of paper now. If we appease the British capitalists by offering the Yen, which will rise as the new currency unit, they will easily join our side."
 KAI_FOCUS_8: "Victory of the Corporation"
 KAI_FOCUS_8_desc: "[ROOT.GetNameDef] has triumphed."

