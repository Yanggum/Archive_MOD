#Events
 KAI_political_event.1.t: "Dominance of Workers within the Corporation"
 KAI_political_event.1.d: "The labor union within [ROOT.GetName] has recently gained strong influence in the corporate power struggle, effectively taking the lead in the company. It is estimated that the workers are passing several procedures to establish internal democracy."
 KAI_political_event.1.a: "Internal democracy... interesting."

 KAI_political_event.2.t: "Dominance of the President within the Corporation"
 KAI_political_event.2.d: "In the power struggle of [ROOT.GetName], the President has recently secured strong political influence and effectively taken the lead in the company. Everyone in [ROOT.GetName] is paying attention to the President's next move."
 KAI_political_event.2.a: "Yes, this is my corporation."

 KAI_political_event.3.t: "Dominance of the Board within the Corporation"
 KAI_political_event.3.d: "The Board of Directors within [ROOT.GetName] appears to have successfully suppressed political groups and secured the strongest influence within the company. The Board of [ROOT.GetName] is now pursuing several procedures to generate corporate profit."
 KAI_political_event.3.a: "A counterattack by British capitalists."

 KAI_event.1.t: "Rebellion of the Board"
 KAI_event.1.d: "The Board of Directors has rebelled against the President."
 KAI_event.1.a: "This is the last resort."

 KAI_event.2.t: "Fate of the President"
 KAI_event.2.d: "The President enters the general shareholders' meeting calmly, awaiting his fate. As the representative of the labor union, you can pronounce the final sentence upon him. After a moment of deliberation, the sentence pronounced on behalf of the union flows from your lips."
 KAI_event.2.a: "Expel him."
 KAI_event.2.b: "Let him handle administrative tasks."

 KAI_event.3.t: "Kaiser Loan Proposal"
 KAI_event.3.d: "A proposal has come in from Kaiser Loan suggesting that we take a loan from them."
 KAI_event.3.a: "Good idea."
 KAI_event.3.b: "This is a deal with the devil."

 KAI_event.4.t: "Approaching Due Date"
 KAI_event.4.d: "The payment due date for the Kaiser Loan is approaching."
 KAI_event.4.a: "I will pay now."
 KAI_event.4.b: "The time has not yet come."

 KAI_event.5.t: "Margin Call"
 KAI_event.5.d: "Due to the recent drop in [ROOT.GetNameDef]'s credit rating, Kaiser Loan has demanded additional collateral. As a result, the payment due date can no longer be delayed."
 KAI_event.5.a: "Understood."
 KAI_event.5.b: "There is no money for the likes of you!"

 KAI_event.6.t: "[FROM.GetName] Rejects Loan Proposal"
 KAI_event.6.d: "X"
 KAI_event.6.a: "Understood."

 KAI_event.7.t: "[FROM.GetName] Accepts Loan Proposal"
 KAI_event.7.d: "X"
 KAI_event.7.a: "Understood."

 KAI_event.8.t: "[FROM.GetName] Refuses Loan Repayment"
 KAI_event.8.d: "X"
 KAI_event.8.a: "In that case, it's war."



# Fascism Path
 KAI_event.100.t: "Request for Cooperation"
 KAI_event.100.d: "The capitalists offer their hands, but can we trust the grip of those who only see numbers?"
 KAI_event.100.a: "Let's cooperate."
 KAI_event.100.b: "It's right not to trust capitalists, LOL."

 KAI_event.103.t: "African Bridgehead Issue"
 KAI_event.103.d: "The colonies in Africa have great potential, but our fleet cannot reach them. Therefore, we must somehow secure a middle point and a bridgehead for the invasion of Africa."
 KAI_event.103.a: "We will establish a plan."

 KAI_event.104.t: "Important Meeting"
 KAI_event.104.d: "After searching for a place to serve as a bridgehead for occupying Africa, the island of 'Cabo Verde,' currently under the effective control of Portugal, has been selected as a strong candidate."
 KAI_event.104.a: "Occupy it!"
 KAI_event.104.b: "We can buy it with money."

 KAI_event.105.t: "Portuguese Backlash"
 KAI_event.105.d: "Portugal, having had its colony seized, sent a letter of protest to us today."
 KAI_event.105.a: "They won't even be a stumbling block."
 KAI_Portugal: "They plundered our colony!"

# Story
 KAI_storyevent.1.t: "An Unpleasant Dream"
 KAI_storyevent.1.desc: "General Jackie Smith sat quietly in the tent serving as a temporary headquarters, reminiscing about the old days. When the Great War broke out, he willingly took up arms and fought for his country, and after the Great War, he was fulfilling his duties as a general. And the result? He was pushed to the brink of annihilation by a surprise attack from strange mechanical masses.\n\nHm, no, wait, it seems he had been in this absolute mess since November 1935, but did it make sense logically that \"things that are not human\" would \"suddenly one day\" appear and attack us? Rather, it was more rational to explain this as a poor-quality, long dream.\n\nJackie Smith had been having this poor-quality, unpleasant dream for over two months. From the temporary headquarters in Liverpool, he slightly turned up the volume of the radio and listened quietly. A song, seemingly slightly modulated and even crackling, was heard.\n\n\"Today we are going to sing a song,\"\n\n\"Give me your hand, your white hand,\"\n\n\"Goodbye, my love, goodbye, my love, stay well, stay well.\"\n\n\"Because we are going, because we are going,\"\n\n\"Because we are going towards Liverpool!\"\n\nListening quietly to the song, General Jackie Smith felt an inexplicable unpleasantness. He even tried throwing a ballpoint pen on the desk for no reason. This persistent dream showed no sign of ending.\n\nBefore many minutes had passed, the sound of mechanical gears clattering echoed. It was the sound of those very machines that the British Army would have named \"Heli-copters.\" As the orchestra of clattering, desperately loud noise reached its climax, the sound of machines moving was everywhere. It was them. Jackie Smith lit one of the cigars he had been saving. It would be useless to save it any longer, as he wouldn't be able to smoke it anyway.\n\nHe turned the phonograph beside him. Along with a crackling sound, Ivor Gurney's <Black Stitchel> flowed out.\n\nThe calmly flowing sound decorated the end. The city of Liverpool was burning. Helicopters were landing everywhere, sweeping everything away. Liverpool, Britannia, and by extension, even himself.\n\nThumping footsteps were heard, and then the mechanical legions were commanding an immediate surrender in awkward English.\n\nBut this is just a nonsensical dream anyway. Surrender is not gentlemanly. A true gentleman keeps his faith to the end for his country. Jackie Smith stood up from his seat, cigar in mouth, and shouted."
 KAI_storyevent.1.a:0 ""Fuck you, you pieces of shit.""
 KAI_tooltip_he_dead:0 "§gThe moment his words ended, the PMC soldiers opened fire. Until the moment his pathetic breath was cut short, he didn't even grimace once as he finished his unpleasant dream. That was all.§!\n\n@ENG §YJackie Smith§! KIA."


