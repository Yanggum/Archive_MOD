 KAI_power_of_the_corporate_state: "Internal Power Competition"
 KAI_power_of_the_corporate_state_desc: "§YKaiser Corporation§! fought a war with §Ythe United Kingdom§! after the Great Catastrophe. After the war, contact with many of §YKaiser Corporation§!'s partners was lost, and we found ourselves in a position to rule a single §Ynation§!.\n\nFactions within §YKaiser Corporation§! are diverse. From the corporate leadership centered around the President, to the §Ylabor union§! centered around the corporation's workers, and the §YBoard of Directors§! consisting of British capitalists—if §Gbalance§! is not achieved among these three factions, Kaiser Corporation will §Rcollapse§!.\n"
 kai_political_fascism_text: "President"
 kai_political_communism_text: "Corporation Workers"
 kai_political_democracy_text: "British Capitalists"
 kai_political_loyalty_desc_text: "Loyalty"
 kai_political_influence_desc_text: "Influence"

 kai_political_fascism_desc: "£GFX_BA_kai_political_fascism_texticon The §YPresident§! is the long-time leader of Kaiser Corporation and seeks powerful authority.\n£GFX_BA_kai_political_fascism_texticon The §YPresident§! is a competent leader and knows how to effectively suppress his opposition."
 kai_political_communism_desc: "£GFX_BA_kai_political_communism_texticon §YCorporation Workers§! are the employees working at Kaiser Corporation and they seek the distribution of capital.\n£GFX_BA_kai_political_communism_texticon §YCorporation Workers§! make up the absolute majority of the company and are capable of collective action."
 kai_political_democracy_desc: "£GFX_BA_kai_political_democracy_texticon §YBritish Capitalists§! are an emerging power that appeared as Kaiser Corporation began receiving investments after the Great Catastrophe.\n£GFX_BA_kai_political_democracy_texticon §YBritish Capitalists§! are skilled at handling local capital and know how to utilize the capital in their hands."

 kai_political_loyalty_TOOLTIP: "§YLoyalty§! represents the degree to which a faction intends to cooperate with corporate actions.\nAs §YLoyalty§! increases, the faction gains positive effects for the corporation. Conversely, it receives negative effects.\nIf §YLoyalty§! is low, they will not cooperate with the corporation and may engage in resistance activities."
 kai_political_influence_TOOLTIP: "§YInfluence§! represents the degree of influence a faction currently holds within the corporation.\nAs §YInfluence§! increases, the impact the faction has on the corporation grows.\nBefore disbanding a faction, a process to reduce §YInfluence§! to 0 through special decisions is required."

