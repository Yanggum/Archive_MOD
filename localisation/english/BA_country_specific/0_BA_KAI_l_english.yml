 KAI_redistribution_of_sovereignty_desc: "It is time to redistribute the sovereignty of the corporation."
 KAI_stockholder_pressure: "Union Solidarity"
 KAI_stockholder_pressure_desc: "Strong solidarity is required for the labor union to fully take over internal control."
 KAI_fire_president: "Internal Democracy"
 KAI_fire_president_desc: "We will distribute the company's sovereignty to the workers to gain their loyalty and improve labor productivity. Furthermore, by gradually distributing sovereignty, we can reduce the influence of British capitalists."
