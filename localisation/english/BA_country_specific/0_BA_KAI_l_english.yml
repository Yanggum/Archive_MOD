 KAI_no_more_torture_desc: "The excessive labor hours in [ROOT.GetNameDef] are creating several problems. We can achieve better productivity by reducing this overwork and securing leisure time for workers."
 KAI_president_fate: "Fate of the President"
 KAI_president_fate_desc: "Now that the labor union has completely taken over management rights, we can decide the treatment of the President."

