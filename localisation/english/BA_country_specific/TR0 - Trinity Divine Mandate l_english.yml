 TRN_trinity_controlled_divine_ns_desc: "트리니티가 설립한 트리니티 군민행정부는 점령지를 효율적으로 관리하기 위해 만들어진 행정 기관입니다. 겉으로 보기에는 군정처럼 보이지만, 실제로는 민정의 성격을 강하게 띠고 있습니다. 군민행정부는 트리니티에 경제적으로 종속되어 있으며, 행정 시스템을 마련하고 치안을 유지하는 것을 주된 목적으로 하고 있습니다."
