 GEK_religion_issue_cat_desc: "Since the Reformation, German religion has been largely split into two. Protestantism in the North and East, and Catholicism in the West and South. Historical conflicts like the Thirty Years' War, the Greater/Lesser Germany debates, and Bismarck’s Kulturkampf are prime examples. While these conflicts seemed to fade after unification, the friction between the Catholic-based Center Party (and the Rhenish industrialists) and the Protestant-based monarchist DNVP (and the Junkers) has resurfaced. Reclaiming only the West has amplified the Catholic voice, creating religious tension."
