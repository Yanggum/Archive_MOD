 # Kriegsmarine Tooltip
 GEK_get_halo_infantry_tt:0 "Students of §YOdyssey Maritime School§! are available."
 # Kriegsmarine Events
 GEK_demo_event.1.t: "Free Elections"
 GEK_demo_event.1.d: "Elections have been held."
 GEK_demo_event.1.a: "The Popular Front won the majority."
 GEK_demo_event.1.b: "The Black-White-Red Coalition won."

 GEK_event.1.t:0 "Seizure of Suspicious Vessel"
 GEK_event.1.desc:0 "A ship of unknown affiliation, not found in our records, was sailing around Gotland and was seized by our navy. Interrogating them, it seems they belong to Kivotos, as they have halos on their heads and call themselves Odyssey Maritime School."
 GEK_event.1.a:0 "Draft them."
 GEK_event.2.t:0 "Recycling"
 GEK_event.2.desc:0 "The ships of Odyssey Maritime School have very low combat capability, but they were built with advanced technology. We can either recycle them to incorporate them into our fleet or dismantle them to use the parts to strengthen our own ships."
 GEK_event.2.a:0 "Incorporate into the fleet."
 GEK_event.2.b:0 "Dismantle them. Something useful will surely turn up."
 GEK_event.3.t:0 "Communication"
 GEK_event.3.desc:0 "We have confirmed that the German Wehrmacht exists in the northern part of a group called Gehenna. They informed us that they tried to negotiate with Gehenna Academy, but it didn't go well, and they decided to take action. We will join hands with them and retake Germany. Without fail."
 GEK_event.3.com_desc:0 "We have confirmed that the German Wehrmacht exists in the northern part of a group called Gehenna. They informed us that they tried to negotiate with Gehenna Academy, but it didn't go well, and they decided to take action... however, they seem completely unaware that we overthrew the original officer corps and staged a mutiny."
 GEK_event.3.a:0 "Let's do it."
 GEK_event.3.b:0 "What should we do about this?"
 GEK_event.4.t:0 "Last Chance"
 GEK_event.4.desc:0 "Not long after the German Wehrmacht, which communicated with us, sent a message that they would start taking action, they established a temporary headquarters in Northern Germany and sent a message that they succeeded in securing their sphere of influence nearby. This will be the last chance given to Germany. While they settle the chaos, we must re-examine our forces and prepare for the coming storm."
 GEK_event.4.com_desc:0 "Not long after the German Wehrmacht, which communicated with us, sent a message that they would start taking action, they established a temporary headquarters in Northern Germany and sent a message that they succeeded in securing their sphere of influence nearby. However, after we informed them of our situation through communication, they seem to be seriously considering their attitude toward us."
 GEK_event.4.bad_desc:0 "Breaking news was delivered through our lines that the Wehrmacht in Northern Germany has begun a war against the faction known as Gehenna. Although we realized this fact too late due to our weak communication efforts, we must prepare countermeasures now."
 GEK_event.4.a:0 "The opportunity has finally come."
 GEK_event.4.b:0 "It is too reckless."
 GEK_event.4.c:0 "Neither you, nor us, nor anyone else wants an alliance."
 GEK_event.5.t:0 "Support Request from German Exiles"
 GEK_event.5.desc:0 "We received a contact from the German exiles who fled from the end of Europe. They are asking for support regarding the upcoming operation to retake Germany. We can accept the support request of the German exiles to help reclaim Germany, or we can step away from this dangerous business."
 GEK_event.5.a:0 "Europe needs allies."
 GEK_event.5.b:0 "It is too dangerous to face them."
 GEK_event.6.t:0 "Support Request Rejected by [FROM.GetName]"
 GEK_event.6.desc:0 "[FROM.GetName] refused to help us, emphasizing that supporting us is a very dangerous act."
 GEK_event.6.a:0 "You guys are next!"
 GEK_event.7.t:0 "[FROM.GetName] Accepted the Support Request"
 GEK_event.7.desc:0 "[FROM.GetName] reviewed the support request we sent a few days ago very positively and decided to support us."
 GEK_event.7.a:0 "Germany will not forget this"
 GEK_event.8.t:0 "Enemy Requesting Peace"
 GEK_event.8.gen_desc:0 "Today, a letter from the Pandemonium Society arrived for us. The letter, delivered by a common German postman, Mr. Hans, was written in Japanese, so our military officers could not read it. Not only that, but the content read by calling a soldier who could speak Japanese was horrific. Most of the grammar was wrong, and at the same time, the letter was full of pretentiousness and contained incorrect metaphors and expressions, which will go down as the darkest part of diplomatic history.\n\nOur leadership decided to reject the peace treaty, which was the main content of the letter, due to such diplomatic discourtesy and continue the war. However, Natsume Iroha, a high-ranking executive of the Pandemonium Society, visited [ROOT.capital.GetName] as an envoy, apologized directly, and entered negotiations with [ROOT.GetName] by proposing the condition of handing over the northern territory controlled by the Pandemonium Society."
 GEK_event.8.fam_desc:0 "Today, a letter from the Pandemonium Society arrived at [ROOT.capital.GetName]. The Gehenna student, who introduced herself as being sent by Natsume Iroha, a high-ranking executive of the Pandemonium Society, requested a peace treaty with us. The letter, starting with the content that the Pandemonium Society would withdraw from the Maginot Line, seemed to be earnestly wishing for peace."
 GEK_event.8.desc:0 "Today, a letter from the Pandemonium Society arrived at [ROOT.capital.GetName]. Although it took time to translate because it was written in Japanese, they seemed to be wishing for peace with us despite the quite chaotic and crude content."
 GEK_event.8.a:0 "The war is over."
 GEK_event.8.b:0 "No, we want their complete downfall."
 GEK_event.9.t:0 "[FROM.GetName] Accepted the Peace Request"
 GEK_event.9.desc:0 "[FROM.GetName] positively reviewed the peace we requested, and not long after, they complied with the treaty and signed the end of the war."
 GEK_event.9.a:0 "A diplomatic victory for the Pandemonium Society!"
 GEK_event.10.t:0 "Peace Request Rejected"
 GEK_event.10.desc:0 "The peace we requested was rejected by [FROM.GetName] for the reason that 'they are not prepared for the basic attitude of requesting peace,' and Hanuma Makoto, the president of the Pandemonium Society, is furious at the news.\n\nNot long after, Hanuma Makoto and the executives of the Pandemonium Society issued a mobilization order for Gehenna students, and Gehenna students began to participate in the mobilization order for the simple reason that it looked fun."
 GEK_event.10.a:0 "It is time to show the Pandemonium Society's prestige!"
 GEK_event.11.t:0 "Militia Uprising Behind the Lines"
 GEK_event.11.desc:0 "Wehrmacht commanders mobilized German civilians to form militias, and as they entered into battle with us, the war with Germany began to become even more difficult."
 GEK_event.11.a:0 "This is bad!"
 GEK_rm_event.11_tt:0 "\n§RIt's Game Over!§!"
 GEK_event.12.t:0 "Occupation of Åland"
 GEK_event.12.d:0 "We have occupied the Åland Islands, which are Finnish territory in the Baltic Sea."
 GEK_event.12.a:0 "We will return it later."
 GEK_event.13.t:0 "Occupation of Saaremaa"
 GEK_event.13.d:0 "We have occupied Saaremaa, which is Estonian territory in the Baltic Sea."
 GEK_event.14.t:0 "[GEK.getname] Illegally Occupying Our Territory"
 GEK_event.14.d:0 "The German Kriegsmarine turned into pirates after losing their government. They have illegally occupied our Baltic Sea territory."
 GEK_event.14.a:0 "Are they insane?"
 GEK_event.15.t:0 "Sailors' Demand for Better Treatment"
 GEK_event.15.d:0 "Despite the current crisis, the reckless sailors are demanding improvement in their situation on deck."
 GEK_event.15.a:0 "Let's compromise moderately."
 GEK_event.15.b:0 "Tell them to endure."
 GEK_event.16.t:0 "Mutiny!"
 GEK_event.16.d:0 "If asked who was the most radical and progressive in modern Germany, it might have been the sailors. Almost 20 years have passed, but the proud German sailors have successfully recreated the events of 1918. High-ranking officers were confined simultaneously on all ships, and Erich Raeder fled to Britain. The sailors are cheering, rank systems are being abolished on all ships, and democratic naval councils are being established on each vessel."
 GEK_event.16.a:0 "Long live the Red Kriegsmarine!"
 GEK_event.17.t:0 "Entry of Reinhard Heydrich"
 GEK_event.17.d:0 "A long time has passed since Europe was swept away by a faction called Kivotos that came from another world. It has just been confirmed that Reinhard Heydrich, a former German SS commander who had been fighting guerrilla warfare in the Trinity region, entered our country through the airport to escape Trinity's oppression."
 GEK_event.17.a:0 "Welcome him."
 GEK_event.18.t:0 "Landing Operation"
 GEK_event.18.desc:0 "Having discovered a Wehrmacht organization that had not scattered under Gehenna's oppression, we immediately decided to cooperate with them to wipe out the Kivotosians in the regions they control and establish a federated nation.\n\nIn the rapid operation process, many Wehrmacht organizations were scattered, and some Wehrmacht generals rebelled against our arbitrary operation planning and actions, but there should be no major problems."
 GEK_event.18.a:0 "Act quickly."
 GEK_event_18_tt:0 "§ROur sudden action occurred before the Wehrmacht organization could be reorganized, resulting in the loss of some Wehrmacht structures.§!"

 GEK_event_post_war_focus_4.1.t: "Leningrad Secret Pact"
 GEK_event_post_war_focus_4.1.d: "Early this morning, a ship of the remnants of the former German Kriegsmarine, huddling in Gotland, arrived secretly in Leningrad under the secret escort of the Soviet Navy, and an interesting proposal arrived from them. They say they will recognize our influence over the entire Baltic Sea in exchange for being ceded some territories and ports on the southern coast of the Baltic Sea. Effectively becoming our satellite state, it means they will become bullet shields against the invaders of the otherworld who appeared through the 'Great Shift.'\n\nThe People's Commissariat for Foreign Affairs evaluates this proposal as very enticing. We can seize hegemony over the Baltic Sea without a single gunshot and transform our former enemy into a useful buffer zone. Of course, risks also exist. There is no guarantee that they won't turn their guns on us again when they regain their strength.\n\nA decision is now needed: whether to reach out to our long-standing nemesis for future benefits or to nip the potential threat in the bud."
 GEK_event_post_war_focus_4.1.a: "This is a brilliant idea."
 GEK_event_post_war_focus_4.1.b: "No, we do not negotiate with militarist fascists." 
 GEK_event_post_war_focus_4_1_idea_189: "Leningrad Pact: Ceding Žemaitija"
 GEK_event_post_war_focus_4_1_idea_190: "Leningrad Pact: Ceding Kurzeme"
 GEK_event_post_war_focus_4_1_idea_811: "Leningrad Pact: Ceding Saaremaa"

 GEK_event_post_war_focus_4.101.t: "Kremlin's Response"
 GEK_event_post_war_focus_4.101.d: "Good news has arrived from the secret envoy sent to Leningrad. After several days of tense silence, the Soviet leadership has accepted our proposal. According to the treaty, the promised territories on the Baltic coast will be transferred to our side, and both sides will build a cooperative relationship against 'common threats.'\n\nThis goes beyond mere territorial acquisition; it is a significant diplomatic victory that has provided us, who were isolated, with a foothold for survival and reconstruction on the continent."
 GEK_event_post_war_focus_4.101.a: "For the future of the Fatherland."

 GEK_event_post_war_focus_4.102.t: "Cold Rejection"
 GEK_event_post_war_focus_4.102.d: "The secret envoy to Leningrad returned empty-handed. The Soviet side dismissed our proposal as 'militarist fascist deception' and rejected the negotiation itself. They made it clear that they had no intention of joining hands with a past enemy.\n\nOur diplomatic gamble has ended in failure. The plan to secure a bridgehead on the continent has come to nothing, and we must now seek other survival measures on this isolated island."
 GEK_event_post_war_focus_4.102.a: "We fight alone."

 GEK_event_post_war_focus_4.2.t: "The Seized Åland Islands!"
 GEK_event_post_war_focus_4.2.d: "The government buildings in Helsinki are enveloped in an icy silence. The German Kriegsmarine's unauthorized occupation of the Åland Islands goes beyond a mere border violation; it is a direct challenge to Finland's dignity and future. Debates are raging between military hardliners and diplomats advocating for caution, and the time to decide the nation's fate is approaching.\n\nThe military command is urging an immediate military response. 'A nation that remains silent even after its sovereignty has been violated is no longer a nation.' They argue that the Kriegsmarine is merely isolated remnants and can be sufficiently repelled if we counterattack quickly with determined resolve. Considering the strategic value of the Åland Islands, tolerating their military occupation is akin to putting a knife to the capital's throat.\n\nOn the other hand, the Foreign Ministry and economic officials maintain a cautious stance. War will cause immense human and economic losses, and the success of a landing operation against a powerful navy is uncertain. They warn that there may still be room for a diplomatic solution and that an premature start of war could isolate Finland and lead to a greater catastrophe.\n\nWill we answer the aggressor's arrogance with force, or will we wait for a better time and seek a diplomatic solution? Finland's future depends on our choice."
 GEK_event_post_war_focus_4.2.a: "This is a declaration of war!"
 GEK_event_post_war_focus_4.2.b: "Condemn them diplomatically. ...Not war." 

 GEK_event_post_war_focus_4.6.t: "[From.GetLeader] Pursuing Integration of Ostland"
 GEK_event_post_war_focus_4.6.d: "Once Western Belarus completely fell under the control of the [Root.GetFactionName], the [From.GetNonIdeologyName] administration announced that it would incorporate the occupied Ostland territories into the [From.GetAdjective] administration. Behind such an announcement is the goal of integrating the Baltic region and Belarus under the name of the State of the Teutonic Order and promoting the fusion of the Germanic-Baltic people."
 GEK_event_post_war_focus_4.6.a: "How ingenious!"
 GEK_event_post_war_focus_4.6.b: "No."

 GEK_event_post_war_focus_4.601.t: "[From.GetNameDefCap]'s Ceding of Ostland"
 GEK_event_post_war_focus_4.601.d: "We have succeeded in liberating the Ostland region through the [Root.GetAdjective] hands, and [From.GetNameDef] has agreed to make the Baltic states and Western Belarus territories belonging only to [Root.GetNameDef]."
 GEK_event_post_war_focus_4.601.a: "Excellent!"
 GEK_event_post_war_focus_4.602.t: "[From.GetNameDefCap]'s Rejection"
 GEK_event_post_war_focus_4.602.d: "The [Root.GetAdjective] request to transfer control of the Ostland occupied territories met with a blunt refusal from [From.GetNameDef]. The attempt to take control of the Ostland occupied territories was dismissed because it was an attempt to control major Baltic population centers and undermine [From.GetNameDef] for [Root.GetLeader]'s permanent integration of the Baltic."
 GEK_event_post_war_focus_4.602.a: "It is a sad day for the Kriegsmarine."

 GEK_news.1.t: "Declaration in Visby"
 GEK_news.1.d: "\"We will no longer be possessed by the ghosts of the past. The new order in Eastern Europe deserves to be respected, and we have no intention of clashing with the Soviet Union, the land guardian of that order.\"\n\nThe German exiled Kriegsmarine, isolated on Gotland Island, has cleared away past hostilities and taken its first step toward a new era. The statement released in the name of [GEK.getLeader] acknowledges that the Soviet Union is the key force maintaining stability and order in Eastern Europe and expressed a desire to avoid unnecessary military conflict between the two sides.\n\nThis announcement is accepted as a de facto non-aggression declaration and has opened up the possibility of starting military and economic exchanges, including maritime cooperation in the Baltic Sea, in the future."
 GEK_news.1.a: "Quickly, bring supplies from the Soviet Union!"
 GEK_news.1.b: "A good justification."
 GEK_news.1.c: "A perplexing incident."

 GEK_news.2.t: "Soviet Ceding of the [189.GetName] Region"
 GEK_news.2.d: "Following the Kremlin's final approval, the secret treaty with the German Kriegsmarine has been implemented. As of today, administrative authority over the [189.GetName] state has been officially transferred to the Kriegsmarine.\n\nThe Red Army in that region has begun a systematic withdrawal, and the Kriegsmarine advance team is taking over major ports and industrial facilities. Both sides stated that this treaty will bring stability to the Baltic Sea and serve as a cornerstone for jointly responding to 'external threats.'\n\nThis territorial ceding is an event that heralds a significant change in the Baltic Sea power structure, going beyond simple territorial changes. The world is watching this historic moment, showing that yesterday's enemy can become today's partner."
 GEK_news.2.a: "Good."
 GEK_news.2.b: "Treaty implementation."
 GEK_news.2.c: "The Baltic becomes completely red."
 GEK_news.3.t: "Soviet Ceding of the [190.GetName] Region"
 GEK_news.3.d: "Following the Kremlin's final approval, the secret treaty with the German Kriegsmarine has been implemented. As of today, administrative authority over the [190.GetName] state has been officially transferred to the Kriegsmarine.\n\nThe Red Army in that region has begun a systematic withdrawal, and the Kriegsmarine advance team is taking over major ports and industrial facilities. Both sides stated that this treaty will bring stability to the Baltic Sea and serve as a cornerstone for jointly responding to 'external threats.'\n\nThis territorial ceding is an event that heralds a significant change in the Baltic Sea power structure, going beyond simple territorial changes. The world is watching this historic moment, showing that yesterday's enemy can become today's partner."
 GEK_news.4.t: "Soviet Ceding of the [811.GetName] Region"
 GEK_news.4.d: "Following the Kremlin's final approval, the secret treaty with the German Kriegsmarine has been implemented. As of today, administrative authority over the [811.GetName] state has been officially transferred to the Kriegsmarine.\n\nThe Red Army in that region has begun a systematic withdrawal, and the Kriegsmarine advance team is taking over major ports and industrial facilities. Both sides stated that this treaty will bring stability to the Baltic Sea and serve as a cornerstone for jointly responding to 'external threats.'\n\nThis territorial ceding is an event that heralds a significant change in the Baltic Sea power structure, going beyond simple territorial changes. The world is watching this historic moment, showing that yesterday's enemy can become today's partner."

 GEK_news.5.t: "Kriegsmarine Occupies Åland Islands!"
 GEK_news.5.d: "Early this morning, the German exiled Kriegsmarine stationed in Gotland carried out a surprise landing operation on the Åland Islands and seized major facilities. The Kriegsmarine command claimed in a statement that this operation was in accordance with 'historical legitimacy.' They put forward the justification that the Åland Islands are historically Swedish territory and that the majority of residents are Swedish.\n\nSuch unilateral use of force is a clear violation of Finland's sovereignty and is raising military tensions across Scandinavia to a peak. The government demanded an immediate withdrawal, but the Kriegsmarine is not responding. Whatever their true intention may be, the peace of the Baltic has been shattered."
 GEK_news.5.a: "An excellent choice."
 GEK_news.5.b: "Quite radical."
 GEK_news.5.c: "What?"

 # Characters
 GEK_erich_raeder_desc:0 "Commander-in-Chief of the Kriegsmarine\n\nErich Raeder did not want this position. From the start, he never imagined he would become the leader of an exiled Kriegsmarine remaining on Gotland, a remnant of a destroyed Sweden. He is merely a soldier who has served his country his whole life since the days of the German Empire, and he is certainly not the leader of Germany.\n\nThe women of the otherworld destroyed Germany. People including the Führer went missing, and even yesterday's enemies, France and Britain, fell to their attacks. Around the time the three Scandinavian countries including Sweden collapsed due to their attacks, Raeder scraped together the remaining Kriegsmarine personnel, admirals, fleets, and German civilians living in coastal cities and fled to Gotland, which had become a masterless land.\n\nRaeder claims he does not have the qualities of a leader, arguing that he is but a mere admiral and is not at all suited for state affairs. However, admirals including Karl Dönitz trust and follow him, and the sailors and Germans also rely on him. Whether he likes it or not, Raeder has become the face and the mainstay of the Germans resisting the invaders from the otherworld.\n\nUltimately, Raeder, who has taken on this responsibility, handles duties silently in his office and inspects the fleet and sailors at the port to boost morale—all for the sake of the Fatherland groaning under the heel of the invaders. If not for that, then for what else?"

 GEK_central_navy_committee:0 "Central Committee of the Red Fleet"

 # Story Archive
 GEK_story_event.1.t: "Gazing at the Sea"
 GEK_story_event.1.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nKurt was cleaning the port of Gotland with a mop. Serving as a sailor on a Kriegsmarine destroyer, he had barely passed two years of military service, and he had not yet shed the rank of private. Kurt sighed deeply and looked at the sea. The faces of his father and family left behind on the mainland came to mind, making him uncomfortable.\n\nWhile talking to the sailor next to him, he heard a language that was not German. Turning toward the source of the sound, he saw women with various expressions and an instructor telling them what to do in their own language. He had heard rumors. That the Grand Admiral had pardoned those women to use them as military force; the things floating above their heads reminded Kurt and the sailors once again that they were beings from another world. And that it was those beings who brought down the Fatherland.\n\n“...Kurt, those bitches...”\n\n“It's the Grand Admiral's order, Heinrich. I know you want to beat them up, but just hold back and don't throw a punch. If you get dragged into a court-martial for nothing, it'll be a headache.”\n\nKriegsmarine command had already strictly instructed them never to lay a hand on or retaliate, but Kurt and the sailors were looking at them with displeased expressions. Although they knew those specific girls hadn't brought down the Fatherland, they still glared at those “Kivotos” women with gritted teeth. They looked frightened or were muttering something as if lamenting their fate while mopping the deck. He also began to mop again as if he wouldn't pay any more attention.\n\nThen trouble broke out. Another sailor pushed a Kivotos girl and knocked her over. Seeing their friend treated harshly, the other girls wanted to retaliate, but they were afraid and just silently went back to their work. His heart began to soften. With only the halo on her head, wasn't she just an ordinary girl in a military uniform? Kurt sighed and reached out to the girl who was lying on the floor in pain and helped her up. The girl wiped her tears and looked at him, and Kurt sighed and looked at her as if he were exhausted.\n\n“To be honest, I hate seeing you here. Besides, you guys destroyed our Fatherland. You shouldn't expect good treatment. If you understand, just get back to your chores.”\n\nThe girl had olive-colored bobbed hair and a halo. She couldn't understand anything he was saying. But at least she thought he had helped her like this because he was worried about her. Taking the mop back, the girl wiped her tears with her sleeve and said in a crawling voice.\n\n“...Danke schön...(...Thank you...)”"
 GEK_story_event.2.t: "A Patriot for a Friend"
 GEK_story_event.2.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nHeinrich could never look favorably upon those with halos. As a more fervent follower of the Führer than anyone else, he used to tell his friend Kurt that Germany would surely be reborn and that the time would come to take revenge on those corrupt nations of Britain and France. When the Führer went missing and the Fatherland disappeared, all that came to him was anger, futility, and the sorrow of losing his country.\n\nIt was the first time he had something to rely on since leaving the orphanage. But having lost it, Heinrich hated the women of Kivotos. He grabbed their collars and used violence whenever he met them. Heinrich's evaluations kept dropping, and the number of times he was dragged to a court-martial was countless. His relationship with his only friend, Kurt, also grew distant. Heinrich fell into further despair and anger over the fact that even his only friend from the orphanage had now completely left his side.\n\nHeinrich was once again smoking a cigarette after barely escaping a court-martial. Walking down the street while cursing under his breath, two shadows caught his eye. Moving in the direction the shadows were cast, he saw blurry figures. Following those figures, he saw Kurt and the Kivotos woman he hated so much.\n\nThe relationship between Kurt and that woman was hard to explain in words. At the very least, he hoped it wasn't what he thought it was. But contrary to his expectations, Kurt's face looked quite different than usual.\n\nA smile, which he had almost never seen before, was blooming on his only friend's face. It was the same for that woman. Heinrich could see clearly with his own eyes that their hands were overlapping on the rough concrete floor of the port.\n\nHeinrich returned to the destroyer with a complicated expression. He couldn't fall asleep even when the assembly bell rang and it was bedtime. Since Kurt's mother died in an unfortunate accident, he hadn't seen his friend's smile. Now, he was smiling, albeit slightly. His mind became even more confused.\n\nHeinrich was a man with a small and simple brain. How many complicated thoughts must have stirred in his head? Although he didn't want to admit it, he had no choice but to admit it in the end.\n\nThat among the women with halos, there wasn't only bad ones.\n\n\"So that one day, he can smile completely.\""
 GEK_story_event.3.t: "Memories in the Land Fled To"
 GEK_story_event.3.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nIt was effectively a state of martial law, and so it was hard for sailors like him to get leave. Even if he did, all he could do was spend time at an inn or a pub in Gotland. In this situation, he had planned to rest at an inn in Gotland, but when he came to his senses, there was bitter coffee and scones in front of him, and Mio was eating bread and coffee with milk with a smiling face. It was the first time he had voluntarily followed someone to a place he would normally never go.\n\n“What are you doing? Eat up! Don't feel pressured!”\n\nAt her urging, Kurt also put coffee and a scone into his mouth. To be honest, the quality of the coffee and scone was not good. The coffee just tasted bitter, and the scone was so dry that it felt like it would be tastier to chew on a sponge. Considering the situation, he should have been grateful for even that.\n\n\"Whew...\"\n\nCould there be a more awkward situation than this? Besides, it was natural to feel embarrassed thinking that a man and a woman were in such a place together.\n\n“Excuse me?”\n\nAt her words, he seemed a bit surprised for a moment. For a second, no words came out. Mio just looked at him while laughing. Why did she keep staring with those eyes? Barely holding back his face from turning red, he shoved the last scone into his mouth and downed the coffee in one shot.\n\n\"Cough...! Gack...\"\n\"Pfft, stay still. I'll go pay for it.\"\n\nBecause he suddenly shoved the food in, he was choking, and Mio paid first while he was coughing. Kurt tried to stop her. But how can you fix a barn that has already been destroyed?\n\nShe stayed by his side. He gave up on telling her to get away. Every time he said such things, she narrowed the distance even more. Instead of the sound of waves and seagulls heard nearby, all that was heard in his ears was the sound of a strongly beating heart.\n\n\"Hey, can't you move a bit away? What if others misunderstand?\"\n\"I don't want to? Are you embarrassed of me? What's the problem with comrades using the same ship hanging out together?\"\n\nDespite Kurt's words, Mio just made a bold expression. The bold expression on Mio's face, who looked up at his face, gradually faded, and soon she grabbed his finger. At the sudden soft touch, he felt like his breath was almost stopping.\n\n“You...”\n“....”\n\nAt his words, Mio answered by holding his hand strongly, not just his finger. He was sweating and flushing like a completely broken doll. If fellow sailors were there, he would have been a complete laughingstock. Although Heinrich and other superiors weren't seen at all. He hesitated for a moment about answering her action. But soon, having changed his mind, he also gripped her soft hand with his contrasting rough hand.\n\nThere weren't no happy moments at all. At least, he was like that before his mother left. As if she also felt his racing heart, she just held her thumping heart and quickened her pace without saying anything. And her heartbeat was also reaching his heart.\n\n“Sweetness felt in the gloom”"
 GEK_story_event.4.t: "Toward Each Other's Duties."
 GEK_story_event.4.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nWhen he first stepped on the Fatherland's soil, what he saw were Wehrmacht soldiers. Unlike the Kriegsmarine who fled to Gotland and pledged for the future, the remnants of the Wehrmacht were secretly fighting against “Gehenna.” Perhaps the Wehrmacht had already heard the news that women with halos had joined the Kriegsmarine, as they were looking at them with curious eyes or eyes mixed with hatred.\n\nAfter organizing all the supplies and sitting down in a quiet corner to rest, Mio sat next to him with her usual smiling face. Mio took a candy out of her pocket and gave it to him. Kurt silently put the candy in his mouth and savored the sweetness, and Mio was also rolling the candy in her mouth. Her appearance was the same as usual, but her eyes were dull.\n\n“I've been assigned to the Halo Infantry.”\n“...I see.”\n\nHe had heard it long ago. That the Commander-in-Chief would create a Halo Infantry division to retake the mainland, and he knew that Mio would be assigned to the soon-to-be-created Halo Infantry. Knowing it would be the key to opposing Kivotos, he knew she would undergo harsh training. And strangely, the fear of losing Mio began to show its face little by little in his heart.\n\nAs if noticing such a feeling, Mio looked at him while smiling.\n\n“I'm okay. Because I can be of help in saving Germany. You've always dreamed of it, right? Looking at the sea, you've kept the faces of your father and family in your mind to meet again someday. Trinity and Gehenna are definitely strong opponents... but I believe the Commander-in-Chief and the generals will lead us well... haha...”\n\nShe tried to reassure him by somehow smiling, but Mio's expression became darker and darker. Kurt was the same. The two people couldn't say anything, just like when they first met.\n\n“My body is fine even if I get hit by a bullet, right...? I'm more worried about you. Please survive. Unlike me, your life is at risk even with one bullet. I won't be able to protect you by your side... but my heart will be guarding your side. Even if our bodies are apart, our hearts are together.”\n\nMio ended her words, opened her arms, and hugged Kurt's body tightly. He hoped this moment would last forever. A hug that might be the first and last, so they hugged each other even more strongly. Their last time passed like an arrow, and the two people shared a bitter farewell. Even when they returned to their respective places, their heavy footsteps did not fall easily.\n\n“Auf Wiedersehen.(Goodbye.)”"
 GEK_story_event.5.t: "In the Pandemonium"
 GEK_story_event.5.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nA rain of steel covered the pitiful Halo Infantry wandering the battlefield. One soldier was holding her helmet in panic and muttering repeatedly that it couldn't be, and another soldier was screaming and slamming her rifle butt into a Gehenna girl. How could anyone stay sane in this chaos? In this chaotic situation, Mio was struggling to survive even a bit longer.\n\nThe melee continued until dawn. The flames lit up the night sky like broad daylight. She recalled life before the Great Shift. The memory of talking with a friend while looking at the sea on an Academy Ship remained in her mind like yesterday's event. Her thoughts, as she absentmindedly watched the living hell unfolding before her eyes, were cut off by Kotone, who she had been close with even before the Shift.\n\n“Get a grip! You'll die if you stay here!”\n“Kotone... but... I... I am...”\n\nSeeing Mio showing symptoms of panic, her friend grabbed her shoulders and shouted loudly. While Kotone tried to somehow snap Mio out of it, a shell shattered her halo. Kotone breathed her last cold breath without even being able to scream. Seeing her friend's sudden death, Mio picked up her assault rifle and ran with all her might, gasping for breath and ready to die.\n\nEven when she used up all her bullets and her physical strength was exhausted, she engaged in hand-to-hand combat with a scream-like shout. Blood was flowing on her face, her military uniform was torn, and wounds on her body were increasing. Mio thought of Kurt in her heart. She also thought of that first moment they met and the deep hug they shared at the end.\n\nThis fight would end someday. But she knew well. That she would not be alive by the time this fight ended. And as if her intuition was correct, a shell flying in a parabola caught her eye. The Gehenna students around her, and the German Halo Infantry next to her, also began to flee from the spot, but Mio couldn't move her body. Something black was approaching her with scorching heat.\n\n“Kurt,”\n\nIn her face, tears were flowing down her cheeks. Feeling her end, she barely swallowed dry spit and closed her eyes. And she showed the smile she first made to her heart, which would be the first and last.\n\n“I'm sorry.”\n\nThe battlefield was covered with acrid smoke and scorching fumes. Nothing was left in that place.\n\n“And the fight continued.”"
 GEK_story_event.6.t: "Under the Dark Sky"
 GEK_story_event.6.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nThe destroyer Kurt boarded was supposed to help the allies by providing coastal bombardment. Yes, surely it was supposed to be like that. But those women of Trinity sent torpedo bombers toward the destroyer and fleets he boarded and attacked the fleets, and so the fight on the sea began. The anti-aircraft guns installed on the destroyer spat out shells toward the incoming torpedo bombers, and before he knew it, the deck was turning into a scene of carnage.\n\n“Heinrich! Ammo!! Fast!!”\n“Take the ammo! Those bitches are giving us a grand welcome!”\n“Shut up and just carry the ammo!”\n\nKurt was supplying ammo to the anti-aircraft gun next to the gunner. Every time a bomb fell into the sea, cold and salty seawater soaked his body. Every time the waves danced, the destroyer couldn't properly steady its steel body. There were more than one or two times he almost fell. Enduring the seasickness that filled his throat, barely relying on the railings, Kurt performed his duty while holding onto his spirit that felt like it would break. It was when he loaded the last ammo and shouted while pointing his finger toward a torpedo bomber with Trinity's mark in the sky.\n\n“Torpedo!!”\n\nLess than 2 seconds after these words were heard, the ship shook strongly with a sound of something exploding. He barely raised his body, which had fallen from the impact, and looked up, seeing the merciless torpedo and bomb attacks of the torpedo bombers. Bullets fired from the machine guns of the torpedo bombers cut through the air and flew to brutally tear apart the anti-aircraft gunner and those around him. That explosion was enough to illuminate the dawn, when the sun hadn't even raised its head yet, as bright as day.\n\nIt was just when he was trying to take a position at the anti-aircraft gun while gasping for breath to face the torpedo bombers. Sailors moved away from him with shouts to run away. Turning his head to the sky, what he saw was a bomb falling to the sky; Kurt's mind instantly went blank.\n\n“Shit, Kurt!! What are you doing! Fast!!”\n\nHeinrich's voice was piercing his brain. His body wouldn't move. He had to get away quickly, why? His body, which had finished understanding the situation, struggled to somehow escape from the explosion that would incinerate him, but. Pathetically, the explosion happened behind his back. Without even realizing that his body floated up into the sky, Kurt was thrown into the cold sea as he was.\n\n“Kurt!!”\n\nHeinrich, seeing the situation unfold before his eyes, screamed. He ran toward the deck where the explosion happened, saying he would go to save him, but sailors restrained him, and Heinrich was dragged into the ship as he was. In the “safe” interior of the ship, he had no choice but to watch the sea swallowing his only friend. He hadn't repaid anything yet, he had only been annoyed with that bastard and nothing else. He cried and cursed, slamming the floor until his blood soaked his hands.\n\n- And at his own helplessness, he curled up and screamed once again."
 GEK_story_event.7.t: "Memory"
 GEK_story_event.7.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nA long time passed, but the war with Gehenna and Trinity was concluded. Germany was saved from the demonic hands of Kivotos, and the aliens would no longer consume Germany. However, Heinrich lost his precious friend. The friend who came to him, who had a twisted personality after leaving the orphanage, without hesitation and looked at him as a single person. After his friend disappeared, he drank alcohol every day. He wanted the alcohol to comfort and care for his heart. But Heinrich could never be at peace. After being discharged from the Kriegsmarine, he lived with several bottles of whiskey, doing almost nothing but staying in his room.\n\nHeinrich recalled that woman who was with Kurt. Even though he cursed so much and tried to use violence, that woman was not hostile to him. Of course, she showed feelings of being unpleasant, but she never said a harsh word to him. Heinrich's heart became even more complicated. No matter how much he wanted to deny it, he couldn't cover the sun with his palm. Because it was a fact in the end that his only friend regained his smile because that woman approached Kurt and was with him. And because it was also a fact that he regained happiness again.\n\nStrong whiskey went down burning his throat. Heinrich was a man with a small and simple brain soaked in alcohol. He recalled again. Had he ever properly done something for his friend? Kurt gave a lot to Heinrich, and Heinrich owed him countless debts. He took that kindness too much for granted.\n\nHe stood up as if he had decided on something. He scraped together all the money he had left to buy alcohol and purchased a typewriter and a pile of paper, and he sold all the alcohol he had at a bargain price. Heinrich recalled memories with Kurt, his only and precious friend, once again. And while saying a too late thank you to that woman who made his only friend happy. He wrote down the text one character at a time, slowly, and accurately.\n\n- “This is the only thing I can do.”"
 GEK_story_event.8.t: "Their Unforgettable Story"
 GEK_story_event.8.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n“Flowers Bloomed in Flames,” written by Kriegsmarine veteran “Heinrich Rademacher,” has been published. The book, which contains the story between an ordinary sailor and a woman of “Kivotos” who invaded Europe, received great interest, whether in a good or bad way. Despite the ill feelings accumulated between the aliens and the Europeans, the plot itself received very good evaluations. Some claimed that this book would be the first stepping stone for harmony between Kivotos and humanity, but someone dismissed it as mere delusion.\n\nAbove all, the fact that this book was based on a true story made many people interested, or shocked.\n\n“Heinrich Rademacher” answered the reason for writing the book as follows.\n\n“First, I must talk about my friend. That fellow... did a lot for me. He approached me when I was in the orphanage and showed kindness to me, who was a loner. I couldn't even say it all here. But I did nothing for him. I only made his heart rot, drank alcohol, and stole his cigarettes. Even so, that bastard just laughed it off.\n\nI traced back the memories I had with him. Before he lost his mother and lost his emotions, he used to always say this to me. That he wanted to become a person who would never be forgotten even after time passed. Well, I worried in my own way and easily got permission by talking to that fellow's father... I wanted to fulfill his wish like this at least.\n\nI suffered like a joke. I sat at the typewriter all day, and the alcohol I had vowed not to drink again kept coming to my mind. Most of all, the memory of living in the library to pull up my lacking writing skills was the most terrible. I lived buried in books... and every single character still remains in my head and seems to torment me.\n\nWell, even so, I think it was worth the suffering. Because everyone will remember my friend Kurt. It bothers me that the one people remember is that fellow's first love... but what of it. He'll surely understand from heaven. But I can't help but be quite scared thinking that he'll be the first to welcome me in the afterlife.”\n\n“Well, I was grateful in many ways, don't be sad there at least, and I hope you're happy with that woman forever.”\n\n_\"Thank you for the words.\""
 GEK_story_event.9.t: "In the Forgotten Outskirts"
 GEK_story_event.9.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nThere was a nameless village in a land located in the outskirts that everyone didn't even care about. People's footsteps hardly reached there, and the people living there were also living their own lives, unfolding each of their stories. As many do, the hidden stories of the villagers were countless and diverse. The sky became dark before they knew it, and only one house was emitting light. A man in that house slowly turned the pages of a newspaper while drinking coffee.\n\n“Hey~ what have you been reading for a while?”\n“Ah... the newspaper that came in the morning, as you know, it was quite busy today, right? So I was reading it now at least. Go in and rest first, I'll come in in a little while.”\n\nVarious news items caught the eyes of the man unfolding the newspaper. Scrawled across the pages were celebrity scandals, the end of the war between Kivotos and Germany, and all sorts of other stories. Just as the man was about to close the newspaper as if he were getting tired, an article with a familiar face caught his eye. The man, surprised, read down the article. Every time he read a word, a sentence slowly, a smile appeared at the corners of his mouth, and the corners of his eyes began to turn slightly red. At the sincerity of his friend who had fulfilled the words he used to say in his own way, tears like chicken droppings were flowing in the man's eyes before he knew it. The man closed the newspaper and went into the bedroom where his lover was waiting and lay down beside her. Beside her, who was mature both physically and mentally and still boasted beautiful looks, even with an ugly scar,\n\n“...Kurt, do you remember those words back then?”\n“...Of course I remember, that even if our bodies are apart, our hearts will always be together,”\n“Hehe, only one thing is important. Kurt. Now, even the sky won't be able to separate us anymore. Neither falling into the cold sea nor suffering in scorching heat will happen again.”\n“...That's just like you, Mio. Let's never be apart again. Never again.”\n\nHaving heard his answer, Mio hugged him tightly, and soon a deep soul-stirring kiss was shared. How much time passed, there was Mio sleeping while breathing softly and smiling in front of his eyes. Kurt also smiled, and he fell asleep peacefully while gently stroking her cheek.\n\nStars in the sky were shining brightly as if blessing them. The crescent moon in the sky was watching the man and woman who pledged to be together forever until the moment their bodies crumble. Kurt felt true happiness that he hadn't felt since his mother died.\n\n-And because he will never have a reason to shed tears again."

