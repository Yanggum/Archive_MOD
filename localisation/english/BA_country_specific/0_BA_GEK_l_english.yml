 # German Military Government - Focuses
 GEK_air_innovation:0 "Regrouping the Luftwaffe"
 GEK_air_innovation_desc:0 "We can regroup the Luftwaffe, which was scattered across Germany following the 'Great Shift' and the subsequent disappearance of Commander-in-Chief Göring, to serve the German Wehrmacht once more."
 GEK_long_range_escorts:0 "Heavy Fighter Research"
 GEK_long_range_escorts_desc:0 "Heavy fighters, capable of flying further distances and armed with more powerful firepower, will protect our skies and devastate the enemies'."
 GEK_four_year_plan:0 "2-Year Plan"
 GEK_four_year_plan_desc:0 "Since the establishment of the German military government, we have been surrounded by nearby enemies. We must create economic policies that yield results in a shorter time and produce more powerful weapons for the survival of the military government."
 GEK_form_the_reichskommissariats:0 "Greater German Ambition"
 GEK_form_the_reichskommissariats_desc:0 "Now that we have been reborn among these strangers, it is time to take back the European continent from those invaders. Germany and its loyal Wehrmacht will prepare for a Great War to reclaim all of Europe."
 GEK_government:0 "Navy in Exile"
 GEK_government_desc:0 "After the terrible defeat at Trinity, we fled to Gotland, which had fallen into a state of anarchy. The German Kriegsmarine will surely return to Germany one day."
 GEK_GER_government:0 "Establish Military Government"
 GEK_GER_government_desc:0 "Emergency situations require corresponding measures. We will take advantage of the internal conflict among those called 'Gehenna Academy' to reorganize our foundations and raise Germany from the ashes."
 GEK_free_german_legion:0 "Urging Militia Organization"
 GEK_free_german_legion_desc:0 "We will urge the Germans to unite through the radio, and our navy will help gather them in Gotland."
 GEK_communication_with_the_mainland:0 "Communication with the Mainland"
 GEK_communication_with_the_mainland_desc:0 "We will restore the communication that was cut off after the message that the Wehrmacht moved to Northern Germany and continue attempts to restore Germany through contact with the Wehrmacht."
 GEK_first_mainland_plan:0 "Mainland Reclamation Plan"
 GEK_first_mainland_plan_desc:0 "We cannot lose the opportunity we have gained. We must seize the last chance and reclaim Germany. There can be no second retreat."
 GEK_get_in_touch: "Operation: Rhineland Remilitarization"
 GEK_get_in_touch_desc: "It has been confirmed that the Fatherland's Wehrmacht is currently surviving at the northern edge, avoiding Gehenna's oppression. We must immediately cooperate with them to rally all German resistance organizations."
 GEK_get_in_touch_tt: "§RThis will greatly provoke Gehenna and Trinity.§!"
 GEK_seek_support: "Seek Support"
 GEK_seek_support_desc: "There will be nations in the world that look unfavorably upon 'Kivotos,' which has paralyzed all of Europe. We will obtain support from them, which will be of great help in rebuilding the German state."
 GEK_NC: "National Consolidation"
 GEK_NC_desc: "The path ahead is fraught with challenges, but with unwavering resolve, we shall forge a new future for our nation. Unity is our greatest weapon."

