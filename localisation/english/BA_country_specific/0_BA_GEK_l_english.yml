 GEK_gathering_storm_desc: "A new Germany is rising. Three years have passed since the dissolution of the Weimar Republic and the emergence of Hitler's Third Reich. The bitter days of the Great Depression have passed, the economy has stabilized, and mass unemployment has been resolved.\n\nHowever, since the Great Shift, Germany has collapsed. Though they succeeded in fleeing to the Swedish island of Gotland through the efforts of the Kriegsmarine, the once-mighty Germany is no more."

 GEK_protestant_state: "German Protestant State"
 GEK_catholic_state: "German Catholic State"
 TRN_christianity_state: "Trinity Catholic State"
 GEK_no_religion: "German Atheist/Free Religious State"
 GEK_ari_religion: "German Arius Catholic State"
 ARI_Gottglaubig_religion: "German Gottgläubig State"
 GEK_spirit_of_capitalism_state: "'Spirit of Capitalism'"
 GEK_christianity_tt: "All controlled §YGerman Catholic and Protestant states§!"
 GEK_protestant_patriotism: "Patriotic Christianity"
 GEK_protestant_patriotism_desc: "When the Fatherland is in crisis, the Church must also stand at the forefront of the front to reclaim it! Protestants will aid the Fatherland through active military enlistment and war support."
 GEK_protestant_patriotism_for_TRM: "Patriotic Christianity"
 GEK_protestant_patriotism_for_TRM_desc: "It seems the German Christians support the German government rather than our regime and are reluctant to be conscripted. We must crush the false, illegal West German government and teach them what true patriotism is."
 GEK_materialism: "Materialism and Productivity"
 GEK_materialism_desc: "Instead of unproductive, exploitative, and oppressive established religions, we can foster active worker-consciousness to face, analyze, and transform reality through the materialistic worldview found in Karl Marx's teachings."
 GEK_catholic_trade_union: "Catholic Trade Union"
 GEK_catholic_trade_union_desc: "Strength through faith and labor. May the workers' rights be protected under the divine guidance of the Church."
 GEK_secondary_citizenship: "Secondary Citizenship System"
 GEK_secondary_citizenship_desc: "Establishing a framework for those who are not yet fully integrated into our society, ensuring they have a place while maintaining national order."
 GEK_separation_law: "Otherworlder Segregation"

 NSD_the_SS_went_to_america: "§Y$reinhard_heydrich$§! is in §Y[USA.GetNameWithFlag]§!"
 NSD_the_SS_went_to_arius: "§Y$reinhard_heydrich$§! is in §Y[ARI.GetNameWithFlag]§!"
 NSD_the_SS_went_to_gottland: "§Y$reinhard_heydrich$§! is in §Y[GEK.GetNameWithFlag]§!"
 BA_is_GER_core_tt: "This state is a §YGerman Core§!"
 BA_is_GER_core_tt_NOT: "This state is NOT a §YGerman Core§!"

 BAY_event.1.t:0 "Military Government Established"
 BAY_event.1.desc:0 "Following the actions of the Wehrmacht, we have succeeded in retaking Northern Germany and establishing a military government. However, factional conflicts within the Wehrmacht have begun to surface, and anxiety regarding the unknown enemy is growing among the ranks."
 BAY_event.1.a:0 "Germany reborn once more."
 BAY_event.2.t:0 "Attack Plan"
 BAY_event.2.desc:0 "Now that the military has been reorganized, it is time for us to invade Gehenna to the south. We can choose the timing to begin our offensive."
 BAY_event.2.a:0 "Begin the advance right now!"
 BAY_event.3.t:0 "Integration of German Territory"
 BAY_event.3.desc:0 "We have returned the territories gained after the Wehrmacht's great victory back into the embrace of Germany. We are one step closer to German unification, and all German citizens are cheering."
 BAY_event.3.a:0 "We still have a long way to go."
 BAY_event.4.t:0 "Ultimatum from Germany"
 BAY_event.4.desc:0 "Shortly after the fall of Gehenna Academy, an ultimatum has arrived from Germany. The German government demands the return of the German lands we currently occupy and warns of a military response if we refuse."
 BAY_event.4.a:0 "Prepare for war."
 BAY_event.4.b:0 "Fine, take it then."
 BAY_event.5.t:0 "Ultimatum Rejected"
 BAY_event.5.desc:0 "Word has reached us that the ultimatum we sent out of benevolent tolerance has been rejected."
 BAY_event.5.a:0 "I knew it."

 GEK_rm_event.1.t: "Loyalty of the State Governments"
 GEK_rm_event.1.d: "We have succeeded in contacting the state governments, and they have promised to stop the aimless drifting caused by the absence of high-level administration and align with us. We will be able to secure the cooperation of the state governments in the battles to come."
 GEK_rm_event.1.a: "Things are proceeding smoothly."
 GEK_rm_event.1_tt: "Every state with the §YGerman State Government§! modifier: \n\n"
 GEK_rm_event.2.t: "Solidarity Beyond Ideology"
 GEK_rm_event.2.d: "To obtain broad and pluralistic cooperation, we have contacted all possible organizations—including political parties, trade unions, paramilitary groups, and student organizations within the German region—to request their collaboration. [GEK.getname] will overcome the Fatherland's defeat and crush the otherworlder invaders through solidarity that transcends ideology!"
 GEK_rm_event.2.a: "Toward the reclamation of Germany!"
 GEK_rm_event.3.t: "Link with the Communist Party"
 GEK_rm_event.3.d: "The link with the Communist Party of Germany (KPD), which received significant support during the Weimar Republic, is a dependable partner that can greatly supplement our lacking capabilities. With the help of those who enjoy strong support from the workers of Holstein, we were able to occupy Holstein and gain armed workers from Hamburg and Kiel as military forces."
 GEK_rm_event.3.a: "Nevertheless, we must remain wary of the communists!"
 GEK_rm_event.4.t: "Cooperation with the Social Democratic Party"
 GEK_rm_event.4.d: "The Social Democratic Party (SPD), the protagonist of the Weimar Republic, has a nationwide support base and political experience that no other party can match. Although they may not wield great power in the Westphalia region right now, they can serve as experienced policy advisors for us."
 GEK_rm_event.4.a: "Let us look forward to their performance."
 GEK_rm_event.5.t: "Mobilizing the Masses"
 GEK_rm_event.5.d: "To gain a voice within the United Liberation Front, pushing for a 'majority' is a viable method. We will attempt to rally the people to strengthen our position."
 GEK_rm_event.5.a: "Rally the Republicans."
 GEK_rm_event.5.b: "Rally the Conservatives."
 GEK_rm_event.5.c: "Rally the Party members."
 GEK_rm_event.5.e: "Long live the liberation of the Fatherland!"
 GEK_rm_event.6.t: "Alliance with the Center Party"
 GEK_rm_event.6.d: "This Catholic party, based in the German Rhine region, has long been a moderate party taking progressive, centrist, or sometimes conservative stances in politics. Therefore, its distinctive feature is the ability to cooperate with conservative democrats in contrast to the Social Democrats."
 GEK_rm_event.6.a: "Expect their progressive side."
 GEK_rm_event.6.b: "Expect their conservative side."
 GEK_rm_event.7.t: "The German Military"
 GEK_rm_event.7.d: "Our German military, originating from proud Prussia, was brought down by the Treaty of Versailles and the otherworlder invasion, but it was not defeated. Although the military has strong tendencies of the conservative Junker class, we have the resolve to judge what is right and act accordingly."
 GEK_rm_event.7.a: "For a better Germany!"
 GEK_rm_event.7.b: "The military does not act in politics."
 GEK_rm_event.8.t: "National Socialist German Workers' Party"
 GEK_rm_event.8.d: "The Nazi Party, which was ruling the Fatherland until only a few months ago, is an organization with the potential to exercise strong administrative power nationwide. Although they suffered a fatal blow from the otherworlder invasion, they can provide us with sufficient support in their strongholds of Nuremberg and Southern Germany."
 GEK_rm_event.8.a: "Nazis without Hitler, eh."
 GEK_rm_event.9.t: "Cracks in the Coalition"
 GEK_rm_event.9.d: "Everyone in the 'Grandest German Coalition' vaguely knew that the illusion would not last long."
 GEK_rm_event.9.a: "Damn it."
 GEK_rm_event.10.t: "Alliance with the National People's Party"
 GEK_rm_event.10.d: "The DNVP is the largest conservative party since the Great War, representing the Junkers in terms of class. Their deliberate political judgment and loyalty to the shining glory of the past will be of great help to us."
 GEK_rm_event.10.a: "Toward the Empire!"
 GEK_rm_event.11.t: "Civil War!"
 GEK_rm_event.11.d: "Political party factions opposing military rule have risen in revolt!"
 GEK_rm_event.11.a: "Damn it!"
 GEK_rm_event.12.t: "Joint Operation"
 GEK_rm_event.12.d: "There are signs of a massive invasion by the local army!"
 GEK_rm_event.12.a: "Help us, Prefect Team!"
 GEK_rm_event.13.t: "Aftermath of the Great Shift"
 GEK_rm_event.13.d: "We have now realized that we have experienced the 'Great Shift,' and an investigation into the world we are currently in is underway. The extensive military operations we launched to stop the resistance of the local military—which we mistook for an ambush—have almost reached success, and we now need to keep a close eye on the remaining remnants."
 GEK_rm_event.13.a: "Let us keep a close eye."
 GEK_rm_event.13.b: "Too bothersome. Can't we just leave them alone?"
 GEK_rm_event.13_tt: "\n§gThe Wehrmacht will take action.§!"
 GEK_rm_event.14.t: "Food Policy"
 GEK_rm_event.14.d: "It is a stroke of luck among misfortunes that we have reclaimed the West German territory. This is because the industrial complexes that beat vigorously along the Rhineland are stretched out endlessly here. Thanks to this, it seems we will be able to implement economic policies and outlooks without significant modification. However, the loss of vast farmlands in the eastern territories has presented us with another problem. Due to the rise in agricultural prices, the lives of the common people have significantly stagnated, risking a great constraint on our economic growth. But without much worry, we can solve this by simply importing food from other countries. The important thing is where we import the food from."
 GEK_rm_event.14.a: "Import from the United States."
 GEK_rm_event.14.b: "Import from Italy."
 GEK_rm_event.14.c: "Import from the Soviet Union."
 GEK_rm_event.14.e: "Receive aid from the Soviet Union."
 GEK_rm_event.14_tt_1: "§gBecause the food situation in the US is not smooth, we will have to pay more.§!\n\n"
 GEK_rm_event.14_tt_2: "§gOur communist government can expect free aid from the Soviet Union.§!"
 GEK_rm_event.15.t: "Agricultural Imports for [GEK.getname]"
 GEK_rm_event.15.d: "[GEK.getname] is importing agricultural products from us."
 GEK_rm_event.15.a: "Good."
 GEK_rm_event.16.t: "Religious Policy"
 GEK_rm_event.16.d: "Since the Reformation, German religion has been largely split into two. Protestantism in the North and East, and Catholicism in the West and South. Historical conflicts like the Thirty Years' War, the Greater/Lesser Germany debates, and Bismarck’s Kulturkampf are prime examples. While these conflicts seemed to fade after unification, the friction between the Catholic-based Center Party (and the Rhenish industrialists) and the Protestant-based monarchist DNVP (and the Junkers) has resurfaced. Reclaiming only the West has amplified the Catholic voice, creating religious tension.\n\nOn the other hand, new faiths brought by otherworlders after the Great Shift exist: 'Trinity Christianity' and 'Arius Christianity.' Research shows these are strikingly similar to our world's Christianity, but details are scarce due to limited contact.\n\nFinally, the otherworlders of 'Gehenna' do not seem to follow a uniform religion, and a high rate of atheism has been observed among them."
 GEK_rm_event.16.a: "What a headache."
 GEK_rm_event.17.t: "Catholic Backlash!"
 GEK_rm_event.17.d: "Catholic believers are protesting against the support policies for the Protestant Church!"
 GEK_rm_event.17.a: "Troublesome."
 GEK_rm_event.18.t: "Protestant Backlash!"
 GEK_rm_event.18.d: "Protestants are protesting against the support policies for the Catholic Church!"
 GEK_rm_event.19.t: "Damaged Industry"
 GEK_rm_event.19.d: "Over the past year, small and large battles have persisted throughout West Germany. Due to these conflicts, explosions, and destruction in the West German region—where Germany's major industrial facilities are concentrated—our industry is heavily damaged and in need of reconstruction."
 GEK_rm_event.19.a: "Damn it."
 GEK_rm_event.20.t: "Student Policy"
 GEK_rm_event.20.d: "Further investigation of those who crossed into this world revealed they transferred from a world called 'Kivotos,' which has a social structure where schools composed of students exercise autonomy. We now need to establish policies for the surrendered students and otherworlders."
 GEK_rm_event.20.a: "Hope they don't become a problem."
 GEK_rm_event.21.t: "The Student Problem"
 GEK_rm_event.21.d: "We have finally accepted the surrender of the otherworlders, but their resistance remains persistent."
 GEK_rm_event.21.a: "Difficult situation."
 GEK_rm_event.21_tt_1: "\n§gWe need to operate re-education camps once more to resolve student resistance.§!"
 GEK_rm_event.21_tt_2: "\n§gWe must also grant citizenship to the students of this academy.§!"
 GEK_rm_event.21_tt_3: "\n§gWe are now able to utilize additional assets from the otherworld.§!"
 GEK_rm_event.21_tt_4: "\n§gWe must set the rights for the otherworlders once again.§!"
 GEK_rm_event.21_tt_5: "\n§gWe must proceed with the separation process once more.§!"
 GEK_rm_event.22.t: "Selecting Collaborators"
 GEK_rm_event.22.d: "It's not that everyone at Gehenna Academy shares a unified purpose and mindset.\n\n...In fact, they are fragmented and shattered to the contrary. In such a situation, cooperating with multiple groups is not a good idea. We will secure stability in our collaborative relationship by cooperating with a specific group."
 GEK_rm_event.22.a: "Cooperate with Pandemonium Society."
 GEK_rm_event.22.b: "We need the help of the Prefect Team."
 GEK_rm_event.22.c: "Partner with the Clubs."
 GEK_rm_event.23.t: "Cooperation with Pandemonium Society"
 GEK_rm_event.23.d: "We are now able to utilize the executives of the Pandemonium Society—the central government of the former Gehenna regime—as advisors."
 GEK_rm_event.23.a: "Appoint Iroha."
 GEK_rm_event.23.b: "Appoint Ibuki."
 GEK_rm_event.24.t: "Cooperation with Prefect Team"
 GEK_rm_event.24.d: "We are now able to utilize the executives of the Prefect Team—the security organization of the former Gehenna regime—as advisors."
 GEK_rm_event.24.a: "Appoint Iori."
 GEK_rm_event.24.b: "Appoint Chinatsu."
 GEK_rm_event.24.c: "Appoint Ako."
 GEK_rm_event.25.t: "Cooperation with Clubs"
 GEK_rm_event.25.d: "We are now able to utilize the members of various clubs from the former Gehenna Academy as advisors."
 GEK_rm_event.25.a: "Partner with the Gourmet Research Society."
 GEK_rm_event.25.b: "Partner with the Hot Springs Development Department."
 GEK_rm_event.25.c: "Partner with the Emergency Medicine Department."
 GEK_rm_event.26.t: "Gourmet Research Society's Unexpected Outburst!"
 GEK_rm_event.26.d: "The Gourmet Research Society visited an aquarium in downtown [TRM.getname] and committed an act of terrorism! We can no longer avoid war with Trinity!"
 GEK_rm_event.26.a: "What?"

 GEK_event_for_auto.22.t: "Partnership with the Catholic Church"
 GEK_event_for_auto.22.d: "There is opposition from Protestant-affiliated organizations against the partnership with the Catholic Church."
 GEK_event_for_auto.22.a: "Why should we care about them?"
 GEK_event_for_auto.22.b: "If they say so."
 GEK_event_for_auto.27.t: "Partnership with the Protestant Church"
 GEK_event_for_auto.27.d: "There is opposition from Protestant-affiliated organizations against the partnership with the Protestant Church."

