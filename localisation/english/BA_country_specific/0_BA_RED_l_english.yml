 RED_council_for_worker: "A Council for the Workers"
 RED_council_for_worker_desc: "The phrase 'more equal people' gave birth to a terrible dictator called the Office. The newly created syndicalist workers' government will lead the people based on 'all people are equal, and more equal people do not exist.' "
 RED_to_left: "Struggle for Production"
 RED_to_left_desc: "The world is still full of numerous bourgeois oppressors. Leaning on capital handed over with a bright smile will only give birth to another dictator. It is time to start the struggle to build a self-reliant production economic system against them."
 RED_workerparty_upgrade: "Democratic Industrialization"
 RED_workerparty_upgrade_desc: "Unlike industrialization policies led by government orders, industrialization policies led by workers, which are carried out according to people's voluntary industrialization demands, are a unique social phenomenon that can only be seen in Red Winter."
 RED_union_igwan: "Planned City"
 RED_union_igwan_desc: "Under the initiative of the council, the southern Red Winter campus is undergoing planned urbanization. When construction is complete, the southern campus will be the most advanced and livable city in Red Winter."
 RED_industrial_union: "Establish Industrial Unions"
 RED_industrial_union_desc: "An industrial union refers to a union that anyone engaged in the same industry can join as a member. Our worker-friendly government actively encourages the establishment and expansion of industrial unions in many fields."
 RED_worekr_pro: "Worker Specialization"
 RED_worekr_pro_desc: "Workers skilled in each field are not only more efficient in work ability but also show high performance. Teaching their know-how to other workers will maximize overall production."
 RED_mechanize_agri: "Agricultural Mechanization"
 RED_mechanize_agri_desc: "While the natural environment of Northern Europe is not great for farming, agricultural machines applied with Kivotos' technology can use the farmland efficiently."
 RED_gaegan_silsi: "Farmland Expansion"
 RED_gaegan_silsi_desc: "Mechanization of agriculture has increased the land we can cultivate. The council is preparing a plan to plant crops on the wide plains around the campus that will enrich our people's tables and stomachs."
 RED_school_communism: "Additional Pudding Rationing"
 RED_school_communism_desc: "In his book 'The Conquest of Bread,' Pyotr Kropotkin, an anarchist of this world, argued that 'instead of the revolutionary government paying paper money to peasants, they should directly provide useful things to them.' Similarly, the current revolutionary government must essentially provide direct supplies to win firm support from the masses. In our case, pudding can play this role."
 RED_HYUSIK: "3-Day Work Week"
 RED_HYUSIK_desc: "The 3-day work week is the most ideal form of worker welfare that Red Winter workers have long desired, and there was almost no possibility of it being realized under the oppression of the Office. However, now that a council for workers has entered, content regarding the 3-day work week is being positively reviewed."
 RED_worekrs_research: "Most Advanced Labor Rights"
 RED_worekrs_research_desc: "Thanks to the activities of the worker-friendly council, Red Winter's workers go to work voluntarily to achieve more than the daily production amount and lead a higher quality and more comfortable life than workers in other countries on holidays."
 RED_council_set_up: "Socialist Industrial Complex"
 RED_council_set_up_desc: "The southern Red Winter campus is the area that was most severely destroyed by the fierce resistance of the Office gang during the revolution. The council, looking for a suitable site to build a factory, planned to establish a large-scale industrial complex in this area."
 RED_asdfdd: "Mining Promotion"
 RED_asdfdd_desc: "According to research results from local scientists, there are many undeveloped iron ores in the central Red Winter campus and its surrounding areas. To build a self-reliant production economic system, there is no reason to hesitate in mine development."
 RED_worker_republic_desc: "Through numerous efforts of the council, Red Winter successfully established worker-friendly policies. Now the people of Red Winter will live proudly and independently, and will not live suffering under greedy and selfish capitalism. Long live the Red Winter Workers' Republic!"
 RED_military_union: "Defense Union" 
 RED_military_union_desc: "To fully succeed in the revolution, it is important to foster the defense industry, and for this, it is necessary to capture the hearts of defense industry workers. Establishing a defense union is a way to gain support from related workers."
 RED_Civilian_factory_union: "Manufacturing Union"
 RED_Civilian_factory_union_desc: "Most workers in Red Winter are engaged in the manufacturing industry. To carry out their demands and listen well to their opinions, the establishment of a manufacturing union should be actively promoted."
 RED_infrastructure_union: "Construction Union"
 RED_infrastructure_union_desc: "The 'Red Winter Public Works Department,' one of the predecessors of the current council, was a club with a knack for civil engineering since they were in Kivotos. They will be a lot of help in establishing a construction union."
 RED_gun_gaebal: "Journalists' Union"
 RED_gun_gaebal_desc: "The Red Bear Editorial Department established a journalists' union to support the struggle of reporters and absorbed and integrated all broken local media outlets to report on the daily life of Red Winter. The council praised the union's struggle, giving Takane Miyoshi, the representative of the union, the title of 'Journalist of the People'."
 RED_soldier_union: "Soldiers' Union"
 RED_soldier_union_desc: "Soldiers fighting at the front of the war also need to unite to oppose unreasonable demands. The soldiers' union, formed with the young heroes of the revolutionary war at its center, will fight for the rights and interests of soldiers."
 RED_mil-ind_complex: "Clerical Union"
 RED_mil-ind_complex_desc: "Office workers in the Western world live like machine parts and are oppressed. We will give them the right to form a clerical union and grant greater autonomy to promote the struggle of these 'office workers'."
 RED_education_union: "Education Union"
 RED_education_union_desc: "Teachers in schools also have the right to be respected as 'educational workers.' Implementing the legitimate rights and welfare they demand will ultimately raise the quality of education."
 RED_combine_of_edu_and_labor: "Combination of Labor and Education"
 RED_combine_of_edu_and_labor_desc: "Red Winter's education is very excellent in fostering efficient and industrious workers, unlike the education of reactionary nations bound by hierarchical structures. Therefore, we should have local students receive the same education as us."
 RED_revolution_city: "Revolutionary City"
 RED_revolution_city_desc: "Building housing applied with new technology and a modern foundation near workers' workplaces, and providing this to workers and their families—it is no exaggeration to call a city where all this is applied a 'Revolutionary City'."
 RED_housing_committee: "Housing Development Committee"
 RED_housing_committee_desc: "If many people live in dirty shanty towns due to a lack of houses, they might distrust our government. The Housing Development Committee, established under the initiative of the construction union, is working on developing the campus and nearby land to match the growing population."
 RED_work_for_worker: "Toward Labor Liberation"
 RED_work_for_worker_desc: "For a long time in Red Winter, we struggled against oppressors and succeeded in creating a nation for workers while changing irrational social structures. Now the dawn of labor liberation is breaking in Red Winter."
 
 RED_minori_diplo_0: "Revolutionary Isolationism"
 RED_minori_diplo_0_desc: "Masses influenced by liberalism tend to think of isolation as something very old-fashioned, feudal, and negative regardless of context. However, maintaining isolation is essential to protect the revolution. Cooperating with or partnering with a regime or system that persecutes other working-class masses is a clear betrayal of the people and against the revolution."
 RED_minori_diplo_1: "Autonomy"
 RED_minori_diplo_1_desc: "\"An autonomous nation by the workers.\""
 RED_minori_diplo_2: "Equality"
 RED_minori_diplo_2_desc: "\"For an equal Red Winter!\""
 RED_minori_diplo_3: "Liberation"
 RED_minori_diplo_3_desc: "\"Workers of all Kivotos, workers of the world, unite for liberation!\""
 RED_minori_diplo_4: "March of Suffering"
 RED_minori_diplo_4_desc: "In Red Winter, unprecedented cold snaps hit every few years, causing great famines. This great famine was endured without much trouble due to our government's competent response, but we must fix the inadequate parts of the policy found through this march of suffering."
 RED_minori_diplo_5: "Food Self-Sufficiency"
 RED_minori_diplo_5_desc: "The task left for us who endured the biggest famine in Red Winter's history is perfect self-sufficiency in food. If we repeat failures like in the past, support for us will drop."
 RED_minori_diplo_6: "Prepare for Revolutionary War"
 RED_minori_diplo_6_desc: "Chaos in Red Winter is gradually subsiding, but the world is becoming increasingly chaotic. To oppose the bourgeoisie and imperialists of the world, we must accelerate preparations for the revolutionary war we were crying for."
 RED_minori_diplo_6_tt: "\nWhen a §Rwar§! with §Y@TRM [TRM.getname]§! occurs, the §YRevolutionary War§! national spirit is added according to the number of completed focuses under §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, and §Y$RED_redwinter_moustache_airport$§!."
 RED_minori_diplo_7: "All-Campus Joint Struggle Council"
 RED_minori_diplo_7_desc: "The All-Campus Joint Struggle Council, based on a motto of autonomous and horizontal student organizations, is an organization established by students from various fields for the peace of Red Winter. Their generous support will help in preparing for the revolutionary war."
 RED_minori_diplo_8: "Solidarity with Overseas Organizations"
 RED_minori_diplo_8_desc: "There are many organizations in the world struggling in the light and in the shadows for the liberation of workers. Whether that organization was established by Kivotos students or locals, if they move believing in the cause of worker liberation, they are all comrades, and we have an obligation to support them."
 RED_minori_diplo_9: "Red Volunteers"
 RED_minori_diplo_9_desc: "As we realized again in the Labor Day revolution, force must essentially accompany a revolution. We have created a volunteer force to help overseas organizations struggling for the autonomy of workers. The 'Red Volunteers,' named after their characteristic red military uniforms, include most of the heroes who participated in the Labor Day revolution."
 RED_minori_diplo_10: "Worker Internationalism"
 RED_minori_diplo_10_desc: "A war fought with equipment made by workers can ultimately be seen as a fight between worker comrades. Therefore, if a war begins, we must persuade workers to stop labor and aim for the swift conclusion of the war under the guidance of the Worker International, doing our best to bring forward the abolition of the capitalist class."
 RED_minori_diplo_11: "Red Finland Plan"
 RED_minori_diplo_11_desc: "Finland, where the Red Winter Defense Committee used to be, has served as a buffer zone between us and the Soviet Union. However, now that the threat of the Soviet Union has emerged, we must establish and review a plan to make Finland our side."
 RED_minori_diplo_12: "Anti-Monopoly"
 RED_minori_diplo_12_desc: "Millennium uses overwhelming scientific technology only as a monopoly. We can no longer overlook the waste of technology for a small number of people in power."
 RED_minori_diplo_13: "Anti-Nazi"
 RED_minori_diplo_13_desc: "They have a dangerous idea that they are the most superior. We must protect those they define as 'inferior races' so they are not persecuted."
 RED_minori_diplo_14: "Anti-Bolshevik"
 RED_minori_diplo_14_desc: "When there were nations with the same ideology as us in this world, we were happy. But they betrayed the noble ideology. Betrayers must be liquidated."
 RED_minori_diplo_15: "World Revolution"
 RED_minori_diplo_15_desc: "We led Red Winter to a shining future with the revolution. But we shouldn't stop here. We have an obligation to spread the sacred revolution beyond the world."
 RED_minori_diplo_16: "Anti-Imperialism"
 RED_minori_diplo_16_desc: "Britain and France are proud of the civilizations they built by exploiting others. This wrong imperialist mindset must be fixed."
 RED_minori_diplo_17: "Anti-Feudalism"
 RED_minori_diplo_17_desc: "The worn-out ideology that humans rule humans, which seems to have been used in ancient times, must be changed right away."
 RED_minori_diplo_18: "Anti-Fascist"
 RED_minori_diplo_18_desc: "Italy is the founding nation of fascism and currently carries out aggressive foreign policies. We must fight against evil ideologies."
 RED_minori_diplo_19: "Anti-Dictatorship"
 RED_minori_diplo_19_desc: "Arona took over the General Student Council without permission and practiced dictatorship. We must stop this crazy AI right now."
 RED_minori_diplo_20: "Anti-Capitalism"
 RED_minori_diplo_20_desc: "As long as capitalism, the archenemy of workers, prospers in America, the revolution will not end. Starting with America, the wave of revolution will sweep across the sea!"
 RED_minori_diplo_21: "§0Abolish Idealism§!"
 RED_minori_diplo_21_desc: "After something strange appeared, those who saw it were brainwashed. We must defeat that strange thing to prove that those who believe in things like the spirit are wrong."
 
 
#Naval Focuses
 RED_cruiser_question: "Recommission Norwegian Armored Ships"
 RED_cruiser_question_desc: "It is said that several coastal defense ships of the former Norwegian Navy are left abandoned after being decommissioned. Although they are quite old even by this world's standards, they can be recommissioned with a bit of refitting."
 RED_nortraship: "Secure Civilian Transports"
 RED_nortraship_desc: "For foreign supplies and swift troop transport, we must secure civilian transport ships even at a political cost."
 RED_naval_rearmament: "Naval Rearmament"
 RED_naval_rearmament_desc: "Enemies threatening Red Winter do not exist only in the sky and on land. Due to the geographical characteristic of being bordered by the sea on three sides, we must hurry naval rearmament."
 RED_coastal_artillery: "Build West Coast Fortresses"
 RED_coastal_artillery_desc: "Unlike the east, which borders several Baltic countries and has received much attention for defense, the defense facilities of the west coast where the Office is located are poor. Protecting the west coast, located at the gateway where the North Sea and the Danish Straits meet, is an essential task."
 RED_large_navy: "Large Fleet"
 RED_large_navy_desc: "To dominate the sea, we need a powerful fleet. Refining the doctrine and developing technology to operate this fleet well will significantly increase our power."
 RED_light_cruisers: "Light Cruiser Development"
 RED_light_cruisers_desc: "Although highly mobile light cruisers may not be the protagonists of fleet battles, they have shown unexpected activity in auxiliary roles. This has become the justification for accelerating light cruiser development."
 RED_heavy_cruisers: "Armored Ship Development"
 RED_heavy_cruisers_desc: "The existence of armored ships with effective counter-defense capabilities is essential for dominating the world beyond the Baltic Sea."
 RED_small_navy: "Raiding Fleet"
 RED_small_navy_desc: "Since it is beyond our reach to build a large fleet with Red Winter's weak industrial power, we must adopt and actively utilize a doctrine specialized for surprise attacks."
 RED_submarines: "Submarine Development"
 RED_submarines_desc: "Submarines made with excellent technology are not easily detected and can defeat enemies several times their size. Using this can maximize the possibility of survival in the shallow Baltic Sea compared to the ocean and create troops that can occupy various key points."
 RED_destroyers: "Destroyer Development"
 RED_destroyers_desc: "Transport ships responsible for sea supply and transport are vulnerable to submarines. We must not neglect the development of destroyers to respond to growing submarine technology."
 RED_controller_of_baltic: "Dominator of the Baltic"
 RED_controller_of_baltic_desc: "We succeeded in seizing absolute command of the Baltic Sea, which was a task to spread Red Winter's revolutionary spirit worldwide. We, who have achieved a feat that the empires that once existed in this land failed to achieve, can proudly say we are the dominators of the Baltic."
 
#Army Focuses
 RED_rearming_focus_0: "Rearmament Plan"
 RED_rearming_focus_0_desc: "Red Winter's army has fallen into a state where it does not reach its previous prestige due to the Great Transfer and fierce local resistance. We must hurry rearmament with the help of locals friendly to our government."
 RED_rearming_focus_1: "Increase Military Supply Production"
 RED_rearming_focus_1_desc: "As we can see from old sayings, stockpiling military supplies before a war is important. We must establish factories even on land outside the campus to increase production of military supplies."
 RED_rearming_focus_2: "Industrial Complex"
 RED_rearming_focus_2_desc: "Empty land stretches out near the old Red Winter school building located in Jämtland. If we set up an industrial complex on this empty land and mobilize the troublemakers from the old building to produce military goods, we can explosively increase production."
 RED_rearming_focus_3: "Improved Production Facilities"
 RED_rearming_focus_3_desc: "After continuous research by the Knowledge Liberation Front, a revolutionary production facility that can efficiently produce both Kivotos equipment and this world's equipment has been born. The Public Works Department expressed great interest in this facility, and soon all of their production facilities are expected to be replaced with the new ones."
 RED_rearming_focus_4: "Integrate Arsenals"
 RED_rearming_focus_4_desc: "Production factories scattered all over are inefficient for procuring military goods. Although they have the disadvantage of being vulnerable to enemy bombing, the integration of arsenals is essential for efficient equipment procurement."
 RED_rearming_focus_5: "Tundra Heavy Industry District"
 RED_rearming_focus_5_desc: "The barren tundra zone seems to have no benefit at first glance, but it has enough wide land for an industrial complex to enter. If we use our technology, we can turn the barren land into an industrial district."
 RED_rearming_focus_6: "Mass Production System"
 RED_rearming_focus_6_desc: "After countless repetitive tasks, students in charge of military goods production in the Public Works Department have become experts in this field. They have even created their own mass production system and are spreading it to students of the department in other factories."
 RED_rearming_focus_6_tt: "Factory Output: §G+3.00%§!\n"
 RED_rearming_focus_7: "Scientific Management of Labor"
 RED_rearming_focus_7_desc: "The Knowledge Liberation Front proposed a more advanced production system by improving the mass production system developed by the Public Works Department with a focus on production efficiency growth. If we adopt this system, we can achieve more efficient industrial growth."
 RED_rearming_focus_8: "Devotion to Production"
 RED_rearming_focus_8_desc: "It is important to pump out more equipment right now. Although the growth of production efficiency will drop, Red Winter competed with quantity over quality, and the result was always satisfactory."
 RED_rearming_focus_8_tt: "Factory Output: §G+5.00%§!\n£GFX_prod_eff Production Efficiency Growth: §R-5.00%§!"
 RED_rearming_focus_9: "Economies of Scale"
 RED_rearming_focus_9_desc: "Now the defense industry in Red Winter has become an economy. We must increase more factories to maintain the economic boom."
 RED_rearming_focus_10: "Labor Social Engineering Research Institute"
 RED_rearming_focus_10_desc: "The coexistence of labor and society is a serious reason directly linked to people's lives. Scientific evidence is needed to come up with policies to coordinate this in a balanced way. We must establish the Labor Social Engineering Research Institute to devise stable production policies without public agitation."
 RED_rearming_focus_11: "Passionate Sacrifice"
 RED_rearming_focus_11_desc: "If a war breaks out, the people's lives will fall into the abyss. If we can maintain peace by possessing overwhelming power at the cost of a little sacrifice and showing it off to prevent neighboring countries' invasions, this sacrifice will be remembered as a great sacrifice."
 RED_rearming_focus_12: "The Pulsing Pulse of Industry"
 RED_rearming_focus_12_desc: "Red Winter's military economy has entered a golden age. The sight of cores running busily as numerous factories pump out military supplies is like a giant heart beating. Once again, great Red Winter overcame the difficulties of the Great Transfer and took a step forward."
 RED_rearming_focus_13: "Artillery Factory"
 RED_rearming_focus_13_desc: "The artillery is the infantry's most reliable friend. And more guns also guarantee more victories! We must build artillery factories to secure a large-scale artillery support force in wartime."
 RED_rearming_focus_14: "Power Generation Complex"
 RED_rearming_focus_14_desc: "Power is an essential part of modern social life. We must supplement power generation facilities so that workers can work under warm lights."


 RED_army_production_improve: "Military-Industry-Academic Cooperation"
 RED_army_production_improve_desc: "Enemies threatening workers are everywhere. We must research military technology so that comrades do not tremble in fear."
 RED_army_production_improve_tt: "Research Speed: §G+2.50%§!"
 RED_strengthen_the_mobilization_plan: "Strengthen Mobilization"
 RED_strengthen_the_mobilization_plan_desc: "From long ago, Red Winter's army functioned with the banzai charge as the main tactic, lacking a military academic approach. We must introduce Red Winter's new and refined doctrine this time."
 RED_military_engineering: "War Engineering"
 RED_military_engineering_desc: "War here has its own way. If we cannot adapt to the way here, we will only be weeded out and disappear into history."
 RED_artillery: "Red Winter Artillery"
 RED_artillery_desc: "Several Red Winter officers have come to pay deep attention to artillery that can annihilate enemies from a distance."
 RED_the_means_to_wage_war: "Support Equipment Research"
 RED_the_means_to_wage_war_desc: "Support equipment researched and developed by the gathered elites of the Knowledge Liberation Front will assist those fighting on the battlefield."
 RED_superior_war_machines: "Superiority of Tanks"
 RED_superior_war_machines_desc: "Most locals do not know the power and fast mobility of tanks. However, we, who know the superiority of tanks in fighting against reactionaries, must mass-produce many tanks."
 RED_quantity: "'Quantity'"
 RED_quantity_desc: "\"I always defeated a small number with a large number of troops where I fought.\"\n\nThe meaning of this phrase, said to have been spoken by Napoleon, is clear."
 RED_quality: "'Quality'"
 RED_quality_desc: "The phrase 'small but elite' probably doesn't exist for nothing."
 RED_quantity_to_quality: "Law of Quantitative-to-Qualitative Transformation"
 RED_quantity_to_quality_desc: "The law of transition from quantity to quality is one of the core concepts of dialectical materialism, a law that quantitative changes 넘어서면 a certain stage cause qualitative changes and move to a new qualitative state. And the core of this concept is that such qualitative changes lead to quantitative expansion again. 'Quantity' and 'quality,' which seemed like parallel lines that would never meet, eventually head toward each other like magnets regardless of what was chosen!"
 RED_quantity_to_quality_tt: "Receive half of each effect of national spirits §Y$RED_quantity$§! and §Y$RED_quality$§!:\n\n"
 RED_tank_destroyer: "Tank Destroyer"
 RED_tank_destroyer_desc: "No matter how powerful halo-equipped infantry are, there are limits to dealing with tanks. Conversely, we have reached the conclusion that it would be very useful to develop specialized anti-tank weapons."
 RED_arms_industrial_optimize: "Defense Industry Optimization"
 RED_arms_industrial_optimize_desc: "The current composition of the defense industry is chaos itself. We need to maintain uniformity in the industry."
 RED_baltic_forts: "Tactical Mechanization"
 RED_baltic_forts_desc: "They, who die even from a single bullet, developed 'cars covered in armor.' Now that mysteries are lacking, we also need that technology."
 RED_defend_the_east_line: "Airship Technology"
 RED_defend_the_east_line_desc: "Combat ships combined with planes are a very creative technology of this world. We must adopt this technology."
 RED_improve_the_south_line: "Jet Engines"
 RED_improve_the_south_line_desc: "Gosh, something that can fly at high speed in the sky actually exists! We must research that aviation technology that equals, no, surpasses Millennium."
 RED_through_the_road_of_snow: "Through the Snowy Road"
 RED_through_the_road_of_snow_desc: "Loading supplies and going through snow fields to the battlefield. We're already experts at things like that."
 RED_rehabilitated_military: "Large-Scale Combat Doctrine Overhaul"
 RED_rehabilitated_military_desc: "Military science professors are advising that combat doctrine should be introduced to the academy. We must accept their advice and proceed with a large-scale military doctrine overhaul."
 RED_military_reorganization_tt: ""
 RED_trench_exp: "Trench Warfare Training"
 RED_trench_exp_desc: "Unlike Kivotos, where urban warfare was the main thing, trench warfare is the main thing here. Training in preparation for trench warfare is needed."
 RED_trench_exp_tt: "Entrenchment Speed: §G+5.0%§!\nMax Entrenchment: §G+5.0§!\nClose Air Support Damage Reduction: §G+5.0%§!"
 RED_an_adaptable_army: "Adaptable Army"
 RED_an_adaptable_army_desc: "The place where we settled is an environment with a climate similar to Red Winter, but the climate of other places is very unfamiliar to us. We must ensure that soldiers can adapt to various climates."
 RED_an_adaptable_army_tt: "Attrition from Cold: §G-10.00%§!\nAttrition from Heat: §G-5.00%§!\nTerrain Penalty Reduction: §G+10.0%§!"
 RED_penal_battalions: "Army of a New World"
 RED_penal_battalions_desc: "After pouring in a lot of time and budget to finish the large-scale military reorganization, Red Winter's army has gained the ability to flexibly deal with enemy tactics and perform various cooperative operations."
 RED_shock_troops: "Cooperative Training"
 RED_shock_troops_desc: "Training is the only secret to how a large-scale army can move organically together. We must foster teamwork among soldiers with continuous cooperative training."
 RED_restore_cossack_units: "'Discipline'"
 RED_restore_cossack_units_desc: "Unlike a sloppily trained army, a disciplined army does not panic in any unexpected situation and can draw out its abilities to the maximum."
 RED_restore_cossack_units_tt: "Infantry Division Soft Attack: §G+5.0%§!\nInfantry Speed: §G+5.00%§!"
 RED_cohesion_first: "'Enthusiasm'"
 RED_cohesion_first_desc: "If enthusiasm for Red Winter and the cause of revolution is sufficient, general workers or peasants can also enter the Winter Army. It will take some time to educate them, but the cohesion of those united with enthusiasm is equal to or greater than a disciplined army."
 RED_cohesion_first_tt: "Mobilization Speed: §G+5.00%§!\nDivision Recovery Rate: §G+5.0%§!\nTraining Time: §R+10.00%§!"

 RED_army_focus_1: "Professional Officers"
 RED_army_focus_1_desc: "Officers who have finished professional education at the military academy are indispensable talents in the military. We must apply full-scale revision and supplementation to Red Winter's military doctrine with their help."
 RED_army_focus_1_tt: "Planning Speed: §G+10.0%§!\nRecruitable Population Factor: §R-5%§!"
 RED_army_focus_2: "Supply First"
 RED_army_focus_2_desc: "As it is in old sayings, supply must be prepared beyond that for the army to roll well. We must organize the supply network efficiently to prepare for unexpected situations without a hitch. "
 RED_army_focus_2_tt: "Supply Efficiency: §G+10%§!"
 RED_army_focus_3: "Soldiers' Council"
 RED_army_focus_3_desc: "There are cases where communication in a rigid place like the military is not flexible. To solve this problem, we will establish a soldiers' council so they can personally plan and implement operations."
 RED_army_focus_3_tt: "Max Planning Factor: §R-5.0%§!\nPlanning Speed: §R-5.0%§!"
 RED_army_focus_4: "Mass Army Operation"
 RED_army_focus_4_desc: "Unlike other academies in Kivotos, Red Winter operates a large-scale infantry as its main force. Smooth cooperation of each branch will be needed to operate this efficiently."
 RED_army_focus_4_tt: "Army Combat Width: §G-10.0%§!"
 RED_army_focus_5: "Central Control"
 RED_army_focus_5_desc: "Thorough planning and preparation are the best ways to carry out a war. Central control must be carried out clearly to achieve this efficiently."
 RED_army_focus_5_tt: "Max Planning Factor: §G+10.0%§!"
 RED_army_focus_6: "Militia Deployment"
 RED_army_focus_6_desc: "In a devastating war, some people might burn with enthusiasm to volunteer for the local community and head to the battlefield. The army will train these patriots and lead them to the appropriate battlefield."
 RED_army_focus_6_tt: "Halo Militia Defense: §G+5.00%§!"
 RED_army_focus_7: "Principle of Democratic Centralism"
 RED_army_focus_7_desc: "'Formulate a decision democratically, and obey the determined matter.'\n\nIt's not hard. Soldiers will serve devotedly in war plans set by discussion and voting."
 RED_army_focus_7_tt: "Infantry Division Defense: §G+5.00%§!"

 
#Air Force Focuses
 RED_invest_only_one_mio: "Invest in Local Designers"
 RED_invest_only_one_mio_desc: "Due to the influence of the Great Transfer, the majority of aircraft made in Kivotos have become unusable. Investing in local companies will solve the absence of the air force."
 RED_airforce_training_project: "Air Force Training Project"
 RED_airforce_training_project_desc: "The environment of the new world is similar to our Red Winter's natural environment, but shows differences in geographical aspects. We must foster an air force suitable for the local area with the help of local air force officers."
 RED_redwinter_moustache_airport: "Red Winter Moustache Airport"
 RED_redwinter_moustache_airport_desc: "Red Winter Moustache Aviation is one of the symbols of Red Winter. If we rebuild this place, we can raise Red Winter's reputation."
 RED_extend_air_bases: "Expand Air Bases"
 RED_extend_air_bases_desc: "Even if there are well-trained pilots and new aircraft, it is difficult to fly smoothly if there is no airbase. We should start building airbases utilizing Red Winter's superior civil engineering technology."
 RED_air_doctrine_focus: "Establish Air Doctrine"
 RED_air_doctrine_focus_desc: "If we establish an air doctrine suitable for Red Winter's situation, more efficient tactical education will be possible."
 RED_offensive_airforce: "Shock and Awe"
 RED_offensive_airforce_desc: "Annihilating the enemy at the front, cutting supply lines for goods and fuel across the front, going beyond destroying gathered tank lines, what weapon could possibly infiltrate deep into the enemy's mainland and break the ability to wage war itself? Bombers, only bombers."
 RED_defensive_airforce: "Air Superiority"
 RED_defensive_airforce_desc: "Air supremacy is an important requirement that determines the victory or defeat of a battle. To block military goods, supplies, and the fear of bombs falling on the heads of the people, we must gain the upper hand in aerial combat."
 RED_air_bomber: "Focus on Bomber Design"
 RED_air_bomber_desc: "The importance of bombers has been proven through many past battles, and new bombers will blow away enemies' infrastructure and industrial facilities with more efficient and precise bombing."
 RED_air_fighter: "Focus on Fighter Design"
 RED_air_fighter_desc: "A large number of fighters can ignore qualitative differences with the opponent and take air supremacy. If we utilize Red Winter's labor, painting the sky with Red Winter's fighters might be a possible thing."
 RED_redwinter_airforce: "Red Winter Air Corps"
 RED_redwinter_airforce_desc: "Thanks to paying a lot of attention to air force expansion, the Red Winter Air Corps, composed of pilots perfectly adapted to the sky of the new world, flexible doctrines not seen in Kivotos, and aircraft armed with new weapons, has been created. Now the sky has also been reborn as our territory."
 
#Winter War Focuses
 
 RED_revolution_war_focus_0: "Anti-Fascist Crusade"
 RED_revolution_war_focus_0_desc: "The fascist invasion has begun! Trinity's army is advancing across Red Winter's borders and will not stop until they have completely subdued us. This war will be a crusade against the fascist counter-revolution coming to destroy socialism, and we will win whatever cost we pay!"
 RED_revolution_war_focus_1: "Wartime Mobilization"
 RED_revolution_war_focus_1_desc: "Since our industry and society have made many preparations to prepare for war, we must convert civilian industry into military factories and swiftly deploy all supplies to the front."
 RED_revolution_war_focus_2: "Efficient Transportation"
 RED_revolution_war_focus_2_desc: "In a wartime situation, if transportation is disrupted, supplies cannot be moved quickly. Even if there is opposition from some of the public, we must fill the gap in transportation by requisitioning transportation for military purposes and carrying out railway construction for efficient transportation."
 RED_revolution_war_focus_2_tt_1: "\nIf focus §Y$RED_improve_railway_network$§! is completed, the §YWinter Army§! is strengthened."
 RED_revolution_war_focus_2_tt_2: "\nSince focus §Y$RED_improve_railway_network$§! is completed, the §YWinter Army§! is strengthened:\n"
 RED_revolution_war_focus_3: "Self-Reliant Economy"
 RED_revolution_war_focus_3_desc: "Red Winter has made great efforts to survive alone from the past. Now the efforts of those numerous people will shine in the war with Trinity."
 RED_revolution_war_focus_3_tt_1: "If focus §Y$RED_synthetic_rubber$§! is completed, you get §YSynthetic Refineries§!."
 RED_revolution_war_focus_3_tt_2: "Since focus §Y$RED_synthetic_rubber$§! is completed, you get §YSynthetic Refineries§!:\n\n"
 RED_revolution_war_focus_4: "Political Commissars at the Front"
 RED_revolution_war_focus_4_desc: "Soldiers' minds become devastated in the fear and horror of war. Political commissars rushed to the front will raise their morale and remind them of the purpose for which they set out to protect the motherland."
 RED_revolution_war_focus_5: "Breakwater Composed of the People"
 RED_revolution_war_focus_5_desc: "The only way Red Winter survives in the war with Trinity is to believe in and unite with each other. The 'Breakwater Composed of the People' will remain steadfast even in the waves of war!"
 RED_revolution_war_focus_6: "Regional Student Training Centers"
 RED_revolution_war_focus_6_desc: "Students volunteering to enlist to protect the motherland against fascists are increasing explosively. We will accept the enthusiasm of these proud people for protecting the motherland and expand training centers in each region."
 RED_revolution_war_focus_6_tt: "States with §YInfrastructure§! of §G5§! or more:\n"
 RED_revolution_war_focus_7: "Rifle Production via Cottage Industry"
 RED_revolution_war_focus_7_desc: "In Red Winter, guns are easier to obtain than pens, and all workers, students, and even housewives in homes can make and assemble guns. Although reliability will be lower, we must have them produce guns and supply them to the troops at the front."
 RED_revolution_war_focus_8: "Large-Scale Mobilization"
 RED_revolution_war_focus_8_desc: "Many troops carrying guns have been deployed to the front, but Trinity is entering deeper into our territory. To block this, we must mobilize even reserve power and deploy it to the front."
 RED_revolution_war_focus_8_tt_1: "\nIf §YRed Winter Lunch Club§! is employed by the government, more troops will appear."
 RED_revolution_war_focus_8_tt_2: "\nSince §YRed Winter Lunch Club§! is employed by the government, more troops will appear:\n\n"
 RED_revolution_war_focus_9: "Occupied Territory Uprising"
 RED_revolution_war_focus_9_desc: "Soldiers secretly infiltrated behind enemy lines are continuing an invisible fight. They will seize the opportunity when the fascist occupiers' surveillance is lax and rise up together with workers and peasants to tie them down in the rear."
 RED_revolution_war_focus_9.5: "Armor Interception Technology"
 RED_revolution_war_focus_9.5_desc: "Trinity's main force is blitzkrieg, a doctrine that puts tanks at the fore. Against this, we must research anti-tank weapons and use them actively."
 RED_revolution_war_focus_9.5_tt_1: "\nIf focus §Y$RED_tank_destroyer$§! is completed, anti-tank gun divisions will be given."
 RED_revolution_war_focus_9.5_tt_2: "\nSince focus §Y$RED_tank_destroyer$§! is completed, anti-tank gun divisions will be given\n\n"
 RED_revolution_war_focus_10: "Mobile Defense"
 RED_revolution_war_focus_10_desc: "It is realistically difficult to defend all of the motherland's wide territory. However, if mobile power is operated and appropriate selection and concentration are applied to several regions in a defensive position, efficient defense will be possible. Our tanks and vehicles will travel all over the country and become 'winged shields' against the fascists' attacks."
 RED_revolution_war_focus_11: "Mountain Rangers"
 RED_revolution_war_focus_11_desc: "The Jämtland rangers are Red Winter's first-rate hunters, and by wrestling with the north wind and hunting wild animals, they are the best snipers themselves. They decided to fight for Red Winter in the war with Trinity."
 RED_revolution_war_focus_12: "Superiority in Firepower"
 RED_revolution_war_focus_12_desc: "Many gaps exist between Trinity's and our technology. However, no matter how thick the bulletproof vest the enemy is wearing, if an artillery shell dropped at their feet explodes, they will die screaming. We need a lot of asymmetric power."
 RED_revolution_war_focus_12_tt_1: "\nIf focus §Y$RED_artillery$§! is completed, rocket artillery divisions will be given."
 RED_revolution_war_focus_12_tt_2: "\nSince focus §Y$RED_artillery$§! is completed, rocket artillery divisions will be given:\n\n"
 RED_revolution_war_focus_12.5: "Anti-Air Tactics"
 RED_revolution_war_focus_12.5_desc: "Trinity's army is being successfully blocked, but news is coming that rear workplaces are being destroyed by air force attacks. To protect factories, the need for anti-air tactics is emerging"
 RED_revolution_war_focus_12.5_tt_1: "\nIf focus §Y$RED_the_means_to_wage_war$§! is completed, anti-aircraft gun divisions will be given."
 RED_revolution_war_focus_12.5_tt_2: "\nSince focus §Y$RED_the_means_to_wage_war$§! is completed, anti-aircraft gun divisions will be given:\n\n"
 RED_revolution_war_focus_13: "Operate All Workplaces"
 RED_revolution_war_focus_13_desc: "War is not only done at the front. At workplaces across the country, men and women of all ages are producing military goods for their sons and daughters, fathers and mothers at the front. We will even operate aging workplaces to support the troops at the front."
 RED_revolution_war_focus_13_tt: "Gains §YMilitary Factories§! according to the number of completed focuses of §Y$RED_rearming_focus_1$§! and below:\n\n"
 RED_revolution_war_focus_14: "Armor Utilization"
 RED_revolution_war_focus_14_desc: "To match the speed of the opponent's tank advance, the presence of armored troops is required. Armor can advance more quickly and can quickly handle gaps in the front in an emergency."
 RED_revolution_war_focus_15: "Counterattack"
 RED_revolution_war_focus_15_desc: "Trinity's army is groaning at the endless outpouring of army and partisan uprisings and facing falling morale due to their ideological flaws, and their advance speed is noticeably decreasing. Now it's time to attack our territory and tell the fascists 'in what direction' violence should be applied to be righteous."
 RED_revolution_war_focus_16: "Fortify the Entire Country"
 RED_revolution_war_focus_16_desc: "The Scandinavian Peninsula, where Red Winter is located, is a natural fortress with dense forests. If we build positions at key points everywhere and enter into a siege war, we can significantly slow down the enemy's advance speed."
 RED_revolution_war_focus_17: "Partisan War"
 RED_revolution_war_focus_17_desc: "Partisans hidden everywhere are raiding supply units through a war of attrition with the enemy in the rear and increasing the country's war weariness. Trinity will fight both the Red Winter and the partisans in the rear at the same time!"
 
 
