 RED_strike: "Sporadic Strikes"
 RED_strike_desc: "The Red Winter bureaucrats newly deployed to replace local bureaucrats and the Military Government are incompetent, inefficient, and exploitative. The center lacks the capacity to control them, and accordingly, the local labor movement is developing into broader industrial linkage and anti-regime movements rather than aiming for negotiation and economic struggle."
 RED_february_strike: "February General Strike"
 RED_february_strike_desc: "The Red Winter bureaucrats newly deployed to replace local bureaucrats and the Military Government are incompetent, inefficient, and exploitative. The center lacks the capacity to control them, and accordingly, the local labor movement is developing into broader industrial linkage and anti-regime movements rather than aiming for negotiation and economic struggle. Students are also joining in, and the sporadic strikes have expanded into a large-scale general strike since February 1936, igniting the seeds of conflict."
 
