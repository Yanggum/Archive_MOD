 RED_demand_cat: "Public Demands"
 RED_demand_cat_desc: "Our government is a government established under the firm support of the masses, and has an obligation to accept and carry out the demands of the masses. However, if we fail to faithfully implement their legitimate requirements, we will lose the support and trust of the masses and the legitimacy of our government will be shaken.\n\n\n  £GFX_air_experience Active Tasks: §Y[?RED.RED_public_mission_activated]§!\n  £GFX_air_experience Successful Tasks: §G[?RED.RED_public_mission_completed]§!\n  £GFX_air_experience Failed Tasks: §R[?RED.RED_public_mission_failed]§!\n"

 RED_demand_three_day_work: "Implementation of 3-Day Work Week"
 RED_demand_three_day_work_desc: "All working masses are demanding the implementation of a 3-day work week to guarantee a human life and enjoy full leisure. We need to quickly enact laws related to the 3-day work week."
 RED_demand_rearm: "Total Rearmament"
 RED_demand_rearm_desc: "The recent shocking and radical expansionist policy of [TRM.getname] is making the masses demand rearmament from us. Since Trinity is a country of a reactionary far-right clerical fascist oligarchy, it must inevitably be overthrown, and a revolutionary war with them must be planned as a people's liberation war to liberate the oppressed and exploited Trinity people."
 RED_demand_industrialization: "Industrialization Demand"
 RED_demand_industrialization_desc: "According to the historical development theory of the early theorist Marx, the superstructure is most influenced by the substructure—that is, the forces of production and relations of production. To put it differently, the best way to maintain socialism is to move toward a system with the most radical and advanced forces of production and relations of production. We will showcase a new era of industrialization to the world that has radical yet democratic simultaneity, unlike other 'National Socialists'!"
 RED_demand_quit: "Demand to Withdraw from Kivotos Cooperation Organization"
 RED_demand_quit_desc: "Currently, the Kivotos Cooperation Organization is nothing more than an 'anti-revolutionary international organization' for the maintenance of the systems of capitalists, dictators, and feudal lords. We must not stay still against such deception toward the working masses. We must protect our revolution and create an independent socialist system with resolute opposition and firm ranks."
 RED_demand_hospital: "Field Hospital Demand"
 RED_demand_hospital_desc: "As a soldiers' union was established, the clamoring demands of soldiers serving on the front were reported to the Central Committee. Soldiers are requesting more guarantee for their right to survival on the front. We will be able to include field hospitals in our templates for them."
 RED_demand_RMC_cut: "Dissolve Revolutionary Military Council"
 RED_demand_RMC_cut_desc: "'Red Bonapartism' refers to a transitional military administrative body in the civil war stage seizing the hegemony of political power. Military power-holders can never have working-class character from a class-based perspective. They are very likely to show pro-ruling-interest behavior, so we must quickly dissolve them and reorganize them into a soldiers' union to restore the revolutionary character of our military organization."
 RED_demand_stability: "Secure Stability"
 RED_demand_stability_desc: "The office workers' union requested 5 major policies and 15 detailed guidelines to improve the lives of the masses after the establishment of the socialist bureaucratic system, which are: securing public order, securing safety in living, securing bureaucratic stability, a reliable and trustworthy welfare system, and guaranteeing periodic political participation. By implementing these, the office workers' union is confident that the revolutionary regime will be able to seize clear ideological hegemony in the world-scale system competition."
 RED_demand_infra: "Infrastructure Expansion"
 RED_demand_infra_desc: "To rebuild the land devastated by the civil war, the construction union ordered the Central Committee to expand infrastructure. We might be able to allocate an additional budget by referring to their requirements in the economic development plan."
 RED_demand_arms: "Establish Military-Industrial Complex"
 RED_demand_arms_desc: "Recently, the defense industry union is showing its achievements in the defense industry and requesting the Central Committee to support qualitative expansion of business areas. A military-industrial complex will be an appropriate means to satisfy their demands, and military administration will be further improved through more direct military-industrial linkage."
 RED_demand_chemi: "Cultivate Heavy Chemical Industry"
 RED_demand_chemi_desc: "The manufacturing union reported an interesting plan at this regular committee meeting. The plan, which claims that resource imbalances can be resolved and a self-sufficient economic system can be established by cultivating the heavy chemical industry through synthetic refineries, was adopted, and the Central Committee will support it."
 RED_demand_core: "Scandinavian Integration"
 RED_demand_core_desc: "As anti-revolutionary forces are crushed and all military governments installed by Cherino's orders are disbanded, we need to treat them as equals to our own people. We must not stop re-education and adaptation support so that they can open their hearts to us."
 RED_demand_fin: "Eastern Offensive"
 RED_demand_fin_desc: "The working masses are afraid that the revolution they achieved will be brought down by the anti-revolution of external forces. They argue that a 'pre-emptive revolutionary war' should be launched to break such intentions and seize a solid regional hegemony in the world so that the sparks of revolution do not go out. Popularly, Finland is agreed upon as the most suitable target for such a 'pre-emptive revolutionary war', and we deeply understand that the people of Finland are being oppressed by reactionary feudal White forces."
 RED_demand_defense_capital: "Defend [141.GetCapitalVictoryPointName]"
 RED_demand_defense_capital_desc: "A war with [TRM.getname] has begun. The people have begun to arm themselves spontaneously, and regional defense committees are being summoned in each region to autonomously establish regional defense plans. The soldiers' union has begun to run campaigns to encourage conscription, and barricades have been built in every alley in villages near the front. The Central Committee has resolved to defend [141.GetCapitalVictoryPointName], where the campus for students is located, even if it means taking huge losses, and all the masses including workers, peasants, and students in the capital are united in organizing defense units themselves."
 RED_demand_system: "Complete the System"
 RED_demand_system_desc: "As the wave of revolution subsides, people are returning to their respective workplaces to perform their duties. They know a new world has come, but they are afraid that the swirling changes will rather ruin their lives. We need to complete the establishment of the system to reassure them."
 RED_demand_industry: "Industrial Restructuring"
 RED_demand_industry_desc: "We succeeded in overthrowing all capitalists and oppressors, but the outdated and anti-revolutionary relations of production have not yet been fully liquidated. We will complete radical industrial restructuring to organize a more progressive economic structure than any other nation."
 RED_demand_europe: "Liberate Europe"
 RED_demand_europe_desc: "Hundreds of millions of people to our south are still suffering from oppressors in the European region! We have an obligation to bring liberation to them."

 RED_zenkyoutou_cat_dynamic_modifier: "Zengakuren"
 RED_zenkyoutou_cat: "Zengakuren"
 RED_zenkyoutou_cat_desc: "The Academy has undergone a cataclysm since the glorious §YSocialist Revolution§! of the Head of Labor Service Division §tYasumori Minori§!. The Labor Service Division, which transformed the Academy through active acceptance of opinions and rapid change and response through autonomous organizations, gradually hit limits, and what they discovered by turning their eyes outward were §Yvarious methodologies§! that existed in this era. Among them, the international socialist student organization that the Central Committee intensively cultivated, inspired by §RAnarcho-Syndicalism§! active in France and Spain and socialist student organizations spread throughout Europe, is the §YAll-Campus Joint Struggle Council§!, also known as §t'Zengakuren'§!.\n"
 RED_install_zkt: "Establish Local Zengakuren in [FROM.Controller.getname]"

 RED_population_issue_cat: "Population Problem"
 RED_population_issue_cat_desc: "  Millions of students came over via the Great Translocation. City administration is saturated, and conflicts with locals are intensifying. Furthermore, administrators warn that if time is delayed, surplus food will run out and may cause famine.\n\n     £GFX_manpower_texticon  Population Saturation Stage: §Y[?RED_population_var]§!"
