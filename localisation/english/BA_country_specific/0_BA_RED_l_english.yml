l_english:
 
#Introduction
 RED_country_intro_header: "§RGlory to those who face the highest authority!§"
 RED_country_intro_content: "Red Winter Federal Academy is a super-sized academy with a vast campus and a massive student population that rivals the three major academies of Kivotos. Under the leadership of the Great Student Council President, Renkawa Cherino, order and balance have been maintained. However, due to near-daily revolutions over trivial matters and low exchange with other academies, the academy's recognition and financial status are on a steady decline.\n\nIn this situation, the sudden Great Transfer completely upended the increasingly unstable fate of Red Winter. Frequent revolutions and strikes by the Public Works Department had already weakened Red Winter's industry, and the void left by the Great Transfer dealt a critical blow to its fragile industrial base. Furthermore, as time passed, the shortage of supplies intensified due to the cessation of production facilities within the academy. To make matters worse, the academy fell deeper into crisis as locals and existing governments, who lost territory to Red Winter's sudden appearance, began military responses. Belatedly, a large-scale operation to suppress \"impure elements\" began under the leadership of Marina Ikekura, Chairperson of the Security Committee. Shortly after their influence began to wane, Civil Affairs Bureaus were established across the occupied territories by order of Tomoe Sashiro, Chief of Staff. However, these were all suspended due to the escalation of internal issues.\n\nIn the midst of this, a man introducing himself as Leon Trotsky contacted the Office. He proposed that if they cooperated with him, he would provide solutions to Red Winter's internal problems in return. While the Office hesitates over this suspicious man's proposal, Red Winter is being engulfed in the flames of chaos. Minori Yasumori, head of the Public Works Department who is already dissatisfied with Cherino's tyranny, has launched a general strike, and locals opposing the Office are joining in to expand their power. Meanwhile, impure elements within the Office are being purged one by one under Marina Ikekura, but if there is no sign of resolution, her loyalty may soon waver.\n\nMost coups in Red Winter's history ended with Cherino's reinstatement. But this time is completely different. If the chaos within the academy cannot be quelled, no one knows what path the next coup will take...\n\n§YDev: Jamm, satsuji, SKSKle, Afimage§!" #Honestly AFIMAGE did like 80% of the work.
            # ㄴ True, honestly.
 RED_guide: "Accepting Trotskyism\n\n£white_dot Rally the exiled Left Opposition.\n£white_dot Coordinate the power struggle between Leon Trotsky and Renkawa Cherino.\n£white_dot Launch a World Revolution with Trotsky and reclaim the Soviet Union.\n£white_dot Arm yourself with Leftist thought through Cherino’s reading sessions.\n\n\nFebruary General Strike\n\n£white_dot Overthrow the corrupt and decadent Office.\n£white_dot Rebuild Red Winter and proclaim a New System.\n£white_dot Give land to the peasants, factories to the workers, and freedom to the students.\n£white_dot Advance until the very last person is liberated!\n\n\nPursuing Ideological Integrity | §YUnfinished§!\n\n£white_dot Expose the hypocrisy of the oppressors and calmly proclaim true Marxism-Leninism.\n£white_dot Thoroughly crush counter-revolutionaries and left-wing adventurists.\n£white_dot Achieve dazzling development with a unified ranks and the Vanguard Party.\n£white_dot Break through the dual front of Capitalism-Fascism under the unity of World Communism!\n\n§RSeek out the North Star of the Revolution!§!"
 
 RED_GATHERING_STORM_DESC: "The Red Winter Federal Academy originally saw its Student Council President ousted nearly every week due to a revolution or coup. And every time, it ended with Cherino returning to the position of General Secretary.\n\nThe Great Transfer has completely changed this atmosphere in Red Winter. The academy faces an unprecedented crisis, and Cherino’s clumsy handling has led students to doubt her qualifications as General Secretary.\n\nA coup over the academy's leadership is approaching. However, in the next ousting, her return may no longer be guaranteed."
 
#Focuses
 RED_focus_shortcut_war: "Anti-Fascist Crusade"
 RED_focus_shortcut_rearming_2: "Rearmament: Military Reform"
 RED_focus_shortcut_rearming_1: "Rearmament: Defense Industry"
 RED_focus_shortcut_industry_1: "Industry: Industrial Planning"
 RED_focus_shortcut_industry_3: "Industry: Full Employment"
 RED_focus_shortcut_industry_4: "Industry: A.E.P."
 RED_focus_shortcut_industry_2: "Industry: Clubs"
 RED_focus_politic_1: "Politics: Trotsky"
 RED_focus_MILITARY_POPULATION: "Military Government Management"
 RED_focus_politic_3: "Politics: February General Strike"

 RED_cant_change_economy: "\n§RCannot change Economic Laws§!"

#Industry
 RED_road_to_south: "Southern Road Maintenance"
 RED_road_to_south_desc: "The roads in the south are relatively well-built compared to the north. A little maintenance will make them very useful."
 RED_road_to_south_tt: "\nA §Y£GFX_decision_icon_small Decision§! that §Gmitigates§! §RPopulation Saturation§!."
 RED_road_to_north: "Northern Road Redevelopment"
 RED_road_to_north_desc: "Although the North is underdeveloped compared to the South, it holds more potential because of it. Establishing a basic transportation network is the first step in regional development, so let's start redevelopment immediately."
 RED_land_research: "Solving the Housing Problem"
 RED_land_research_desc: "When the Great Transfer began, our homes were completely lost. We must uproot the housing problem to prevent the disaster of everyone sleeping on the streets."
 RED_improve_railway_network: "Railway Network Improvement"
 RED_improve_railway_network_desc: "Supply is the basis of war. We must secure supplies by reorganizing the railway system."
 RED_economy_dev_plan: "Economic Development Plan"
 RED_economy_dev_plan_desc: "Chronic economic stagnation is driving local residents into suffering. We need to improve the situation as soon as possible."
 RED_industrial_planning: "Industrial Planning"
 RED_industrial_planning_desc: "Since the economy is directly linked to the people's quality of life, we must approach economic recovery carefully to avoid losing public support for our government by lowering their standard of living."
 RED_entice_publicworks_cherino: "Bribe the Public Works Department"
 RED_entice_publicworks_minori: "Expand the Public Works Department"
 RED_entice_publicworks: "[RED_entice_publicworks]"
 RED_entice_publicworks_tt: "\n§YUpon Employment§!:"
 RED_entice_publicworks_desc: "The help of the Public Works Department is essential for economic recovery. We must persuade them to participate in the restoration work. Giving them plenty of pudding as a reward should be enough to win them over."
 RED_upgrade_heavy_industry: "Expand Heavy Industry"
 RED_upgrade_heavy_industry_desc: "To recover the economy, we need industrial facilities to serve as a foundation. First, we must expand heavy industry facilities to mass-produce metal materials, which are the basis for all industrial facilities."
 RED_upgrade_light_industry: "Foster Light Industry"
 RED_upgrade_light_industry_desc: "Red Winter is particularly underdeveloped in light industry compared to other academy cities. We must utilize local light industry facilities to foster the sectors where we are weak."
 RED_upgrade_army_industry: "Expand Defense Industry"
 RED_upgrade_army_industry_desc: "Investment to prepare for foreign invasion is essential. We must set up factories to produce military supplies."
 RED_steel_casting_industry: "Expand Iron Mines"
 RED_steel_casting_industry_desc: "Iron is the basic resource for all industries. We must expand iron mines to increase iron production."
 RED_synthetic_rubber: "Synthetic Rubber"
 RED_synthetic_rubber_desc: "The chronic shortage of rubber is causing production delays. Emerging synthetic rubber technology could solve this."
 RED_oil_production: "Oil Field Development"
 RED_oil_production_desc: "We lack oil. Fortunately, with our advanced technology, we can develop North Sea oil fields that the locals couldn't touch."
 RED_industrial_futurization: "Focus on Manufacturing"
 RED_industrial_futurization_desc: "To restore the people's quality of life, various goods are needed. We will need to invest more in civilian factories for this purpose."
 RED_future_production_line: "Military-Industrial Complex"
 RED_future_production_line_desc: "The production system here is incredibly inefficient. Now that the basic industry is somewhat in place, we must completely overhaul the production lines."
 RED_economic_miracle: "Economic Miracle"
 RED_economic_miracle_desc: "The policies implemented by our government for economic recovery are showing great effects. Normalizing the economy is only a matter of time."
 RED_restored_economy: "Restored Economy"
 RED_restored_economy_desc: "Through our government's efforts for economic recovery, we have overcome the horrors of the Great Transfer and led economic development. Long live the Red Winter Federal Academy!"

 RED_new_economy_focus_0: "Mobilize All Means"
 RED_new_economy_tt: "§gWe will move toward rapid growth through sacrifice.§!\n\n"
 RED_new_economy_focus_0_tt: "\nCompleting this focus will lock certain focuses under §Y$RED_rearming_focus_1$§!!"
 RED_new_economy_focus_0_desc: "To restore the industry and economy destroyed by the Great Transfer in the near future, we must mobilize every possible means, even if the process is difficult and painful."
 RED_new_economy_focus_1: "Toward Full Employment"
 RED_new_economy_focus_1_desc: "To rescue the unemployment rate that fell into the abyss in the wake of the Great Depression and the Great Transfer, state-led projects are essential. Through decent wages and 'For the Nation' propaganda, we must encourage the people to voluntarily participate in national recovery industries."
 RED_new_economy_focus_2: "Individual Workplace Placement"
 RED_new_economy_focus_2_desc: "Some workers may not have been placed where they can best demonstrate their skills. We must place workers in jobs that match their preferences and aptitudes for more efficient labor."
 RED_new_economy_focus_3: "Public Works"
 RED_new_economy_focus_3_desc: "The lives of the low-income class became even more stagnant after the Great Transfer. We need to provide them with temporary jobs to ensure a minimum livelihood. This public works system will also help the economic activity of the 'surplus labor force' in society."
 RED_new_economy_focus_4: "Service and Devotion"
 RED_new_economy_focus_4_desc: "While the economy is gradually recovering thanks to the efforts of many, decisive results have not yet emerged. We must accelerate economic recovery through propaganda encouraging service and devotion, as well as somewhat radical methods."
 RED_new_economy_focus_5: "Industrial Mobilization"
 RED_new_economy_focus_5_desc: "Although it will be followed by public backlash, forced industrial mobilization can rapidly boost industrial power in the short term, acting like 'shock therapy'."
 RED_new_economy_focus_6: "Large-Scale Disarmament"
 RED_new_economy_focus_6_desc: "Since the military is a group that only consumes, in the current situation, the military's manpower and supplies only need to be at the minimum amount for self-defense. Through large-scale disarmament, we can reduce military spending and focus on restoring domestic industry."
 RED_new_economy_focus_7: "Red Winter Reconstruction Bonds"
 RED_new_economy_focus_7_desc: "To activate economic policies, initial capital is required. We must issue bonds in the academy city to secure financial flexibility."
 RED_new_economy_focus_8: "Loans from Kaiser"
 RED_new_economy_focus_8_desc: "Kaiser Corporation is a dangerous 'Black Company' that once swallowed Abydos, but their support is essential for securing funds. Though the price we'll pay remains uncertain..."
 RED_new_economy_focus_9: "Monetary Policy"
 RED_new_economy_focus_9_desc: "The value of Red Winter's currency, which was precarious even before the Great Transfer, plummeted afterward. While the urgent shortage of capital was solved through bond issuance, if we do not hurry with currency reform, Red Winter's economy will fall further into the abyss."
 RED_new_economy_focus_10: "Unlimited Inflation"
 RED_new_economy_focus_10_desc: "While it uses somewhat artificial methods, a sure way to increase our government's revenue is simply to print more money. We can put out the immediate fire, but to handle the aftermath of inflation, we'll have to use rather extreme measures."
 RED_new_economy_focus_11: "Currency Suspension"
 RED_new_economy_focus_11_desc: "By carrying out currency reform for bond payments, the value of the old currency has become less than waste paper. While there will be immense confusion among the public, we must suspend the old currency to encourage the use of the new currency and prevent the circulation of the old."
 RED_new_economy_focus_12: "Wealth Ceiling"
 RED_new_economy_focus_12_desc: "The property holdings of Red Winter's people must be equal, as there is a possibility that they could lead to corruption into a bourgeois mindset. Through the wealth ceiling system derived during currency reform, we can prevent this corruption and supplement the government budget."
 RED_new_economy_focus_13: "Introduction of Labor Vouchers"
 RED_new_economy_focus_13_desc: "'Labor Vouchers' are a form of certificate for equal labor that functions as a currency substitute in a socialist society. It is time to ban the general monetary economy and move toward a labor-based socialist alternative economy!"
 RED_new_economy_focus_14: "Land Development"
 RED_new_economy_focus_14_desc: "Most of the land outside the Red Winter campus remains undeveloped. We must hurry development through our advanced technology and manpower."
 RED_new_economy_focus_15: "Focus on Resource Extraction"
 RED_new_economy_focus_15_desc: "According to local experts, much of the undeveloped land contains underground resources. Developing this land with our technology will allow us to achieve self-sufficiency in resources."
 RED_new_economy_focus_16: "Agricultural Modernization"
 RED_new_economy_focus_16_desc: "Since the Scandinavian Peninsula, where Red Winter is located, is in the northern hemisphere, it is not ideal for farming. However, by properly combining our technology with local farming methods, we can solve the food problem."

 RED_economy_focus_0: "Expand STEM Clubs"
 RED_economy_focus_0_desc: "Many clubs exist in Red Winter, but STEM clubs do not yet exist. We should actively encourage STEM clubs by injecting some subsidies for the development of scientific industry."
 RED_economy_focus_1: "Tundra Development"
 RED_economy_focus_1_desc: "Right now it's just a cold, useless piece of land, but leaving it alone is a serious waste of territory. By investing in infrastructure, we will lay the foundation for northern industrial development."
 RED_economy_focus_2: "[142.getname] Aluminum Mine"
 RED_economy_focus_2_desc: "We will move toward resource self-sufficiency by improving aluminum extraction."
 RED_economy_focus_3: "Appoint Local Technocrats"
 RED_economy_focus_3_desc: "There are still many valid local industries in this land we've transferred to. Developing these will provide high industrial advantages."
 RED_economy_focus_5: "Rural Planning"
 RED_economy_focus_5_desc: "We will develop agriculture, one of the key industries, through rural development plans."
 RED_economy_focus_6: "Support Agricultural Mechanization"
 RED_economy_focus_6_desc: "Every farmer can move toward increased production by plowing the fields with tractors."



 RED_economy_focus_8: "Consumer Goods Industry Planning"
 RED_economy_focus_8_desc: "The shortage of consumer goods due to the Great Transfer is reaching a catastrophic level. We must resolve this."
 RED_economy_focus_9: "1st Alternative Economic Policy"
 RED_economy_focus_9_desc: "Radical collectivization and nationalization are by no means solutions to the current situation. In this 'wartime' state for industry, an alternative economic policy is needed. Literally, the 'Alternative Economic Policy' (AEP) incorporates market elements to modify the original socialist economic policies, through which we will foster small and medium-sized enterprises and build a solid infrastructure for the industry."
 RED_economy_focus_10: "Support Private Businesses"
 RED_economy_focus_10_desc: "The academy cannot run all businesses when administrative paralysis is severe. We will entrust industry to various private businesses."
 RED_economy_focus_11: "Shipping Industry Recovery"
 RED_economy_focus_11_desc: "The land we've transferred to has a lot of contact with the sea. Investment in the ocean is investment in this land!"

 RED_economy_focus_13: "Activate Trade Industry"
 RED_economy_focus_13_desc: "Even if Red Winter chooses isolationism politically, trade is essential for the nation's survival. We will lift trade bans in limited fields to import resources lacking in our nation."
 RED_economy_focus_14: "2nd Alternative Economic Policy"
 RED_economy_focus_14_desc: "With the success of the 1st AEP, we have successfully proven the competence of our government. Not stopping there, we will announce the '2nd Alternative Economic Policy,' which supplements the shortcomings of the 1st AEP and maximizes its advantages."
 RED_economy_focus_15: "Currency Reform"
 RED_economy_focus_15_desc: "Because the currency systems of Kivotos and the local area are different, the financial industry is taking a big hit. We must hurry with currency reform to quell this confusion."
 RED_economy_focus_16: "Selective Welfare"
 RED_economy_focus_16_desc: "One of the main pillars of the 2nd AEP involves selective welfare. We will prioritize supporting the economically vulnerable according to policy to help them return to society."
 RED_economy_focus_17: "Market Socialism"
 RED_economy_focus_17_desc: "\"Wait, so we're using markets to reach socialism? Isn't that just... capitalism with extra steps? No, Cherino-sama said it's fine, so it's fine!\""
 RED_economy_focus_18: "Cash Crop Cultivation"
 RED_economy_focus_18_desc: "Agriculture isn't just for food self-sufficiency. We can gain additional wealth through cash crop cultivation."
 RED_economy_focus_19: "Commercial Agriculture"
 RED_economy_focus_19_desc: "By entrusting agricultural management to commercial entities, we will seek higher capital reproduction."
 RED_economy_focus_20: "Fishery and Aquaculture"
 RED_economy_focus_20_desc: "Due to the geographical condition of being bordered by the sea on three sides, the private fishing industry is thriving. By encouraging fisheries and aquaculture, we can solve the food problem."
 RED_economy_focus_21: "Red Horse Movement"
 RED_economy_focus_21_desc: "\"Chollima? No, we have the Red Horse! Everyone, work twice as fast for the Secretary's pudding!\""
 RED_economy_focus_22: "Cooperative Economy"
 RED_economy_focus_22_desc: "\"If we all work together, we get more snacks! It's basic math!\""
 RED_economy_focus_23: "Independent Central Bank"
 RED_economy_focus_23_desc: "\"Wait, why is the bank independent? Does that mean I can't just take money for my statues?\" — Cherino"
 RED_economy_focus_24: "Flexible Employment"
 RED_economy_focus_24_desc: "\"Moving students to where they are needed most! Like the construction site! Or the gulag!\""
 RED_economy_focus_25: "Rural Capitalism"
 RED_economy_focus_25_desc: "As our government's support focused on rural areas, a so-called 'rich peasant' class began to emerge in Red Winter. For now, we tolerate them as their reinvestment benefits the economy, but we need a new alternative to suppress their growth."
 RED_economy_focus_26: "Folkhemmet"
 RED_economy_focus_26_desc: "'Folkhemmet' means 'People's Home' in Swedish, a concept where equality, care, and cooperation are central in a good home. Applying this to the nation and the economy will abolish social and economic discrimination, ultimately gaining more support from the people."
 RED_first_aep_tt: "This focus is part of the §t1st Alternative Economic Policy§!.\n\n"
 RED_second_aep_tt: "This focus is part of the §t2nd Alternative Economic Policy§!.\n\n"
 RED_economy_focus_27: "Tighten Regulations"
 RED_economy_focus_27_desc: "The nature of the 'rich peasant' class we partially tolerated is gradually turning bourgeois. To prevent their corruption, we must regulate them somewhat forcefully."





 RED_club_focus_0: "Red Winter Computation Bureau"
 RED_club_focus_0_desc: "We must restore the academy, which stopped functioning due to the Great Transfer. First, we need to recover our paralyzed administrative power."
 RED_club_focus_1: "Rebuild the Lunch Club"
 RED_club_focus_1_desc: "Even if administrative power is restored and the academy returns to normal, it will collapse again if the fundamental food problem isn't solved. Let's rebuild the Lunch Club and avoid the worst."
 RED_club_focus_2: "Regain Control Over Clubs"
 RED_club_focus_2_desc: "There are many clubs in Red Winter, but they all share one thing in common: they are all eyeing the position of academy leader. We must control the threatening negligence of the clubs!"
 RED_club_focus_3: "Reconstruct the Old School Building"
 RED_club_focus_3_desc: "After the Great Transfer, the need arose to reconstruct the Old School Building where the troublemakers gather. Let's show that the academy is fine by rebuilding it."
 RED_club_focus_4: "Persuade Class 227"
 RED_club_focus_4_desc: "As we reconstruct the Old School Building, dealing with the troublemakers of Special Class 227 has become urgent. In a situation with many enemies threatening our ledger, we can't make them enemies too. A polite apology and some pudding should bring them to our side."
 RED_club_focus_4_tt: "§Y[THIS.getname]§! becomes a General."
 RED_club_focus_5: "Support Humanities and Social Sciences"
 RED_club_focus_5_desc: "\"Just as accurate measurement and astronomy cannot be done without mathematics, and iron cannot be made accurately without chemistry, one cannot think accurately about religion without theology.\" - John Hall\n\nAnd, one cannot cry for liberation without philosophy and sociology. Through higher education for workers, we will raise the general level of knowledge in society!"
 RED_club_focus_6: "Vanguardism"
 RED_club_focus_6_desc: "Creation must be a continuation of pain. We must break familiar molds, open new horizons, and spark infinite revolutions in our imagination. Only after denying, deconstructing, and trampling upon all reality, experience, concepts, and knowledge will there be true liberation!"
 RED_club_focus_7: "Realism"
 RED_club_focus_7_desc: "We must learn to look at capitalism and the feudal order critically and realistically through the eyes of 'Realist Literature.' All transformation begins with recognition and evaluation."
 RED_club_focus_8: "Commercial Literature"
 RED_club_focus_8_desc: "The pen is mightier than the sword. Plus, it gives you money. We will invest the academy's excellent writing capabilities into commerce."
 RED_great_punch: "A Powerful Blow"
 RED_great_punch_desc: "We desperately need a powerful new weapon, just in case."
 RED_rocket_romance: "Raketny Romantik"
 RED_rocket_romance_desc: "Rocket technology can be called the total assembly of all scientific technologies."
 RED_club_focus_9: "Knowledge Liberation Front"
 RED_club_focus_9_desc: "Due to our government's recent support for humanities clubs, students of the Knowledge Liberation Front, who were not actively cooperating with the government, are changing favorably toward us. Investing a little pudding should firmly bring them to our side."
 RED_club_focus_10: "Red Winter Public University"
 RED_club_focus_10_desc: "A university to foster future talents is essential for the advancement of science. Red Winter Public University, established by inviting local professors and some Millennium students, will be responsible for the future of Red Winter's science."
 RED_club_focus_11: "No. 227 Hot Springs"
 RED_club_focus_11_tt: "§Y[THIS.getname]§! becomes an Admiral."
 BA_onsen: "Hot Springs"
 
#Office Focuses
 RED_our_leader_cherino: "Our Leader Cherino"
 RED_our_leader_cherino_desc: "The great leader of Red Winter, Cherino, is the only leader who can settle the chaos of the Great Transfer and make our academy great again. Even if there is false agitation from reactionary elements, we must trust, follow, and fight the bourgeoisie of the world without doubt."
 RED_accept_trotskism: "Anti-Soviet Alternative Communism"
 RED_accept_trotskism_desc: "After the Great Transfer, to resolve the academy's situation of competing for the position of leader of international communism against a state called the Soviet Union in the East, Comrade Cherino personally granted a seat in the Red Winter Office to a strange exile named Trotsky. It's too early to trust him, but it's best to trust Comrade Cherino's choice."
 RED_the_fourth_international: "The Fourth International"
 RED_the_fourth_international_desc: "The ideals of the so-called Third International Stalinists have nothing to do with the theories written by Marx and Lenin; rather, they are distorting a democratically controlled workers' state into a dystopian dream. What we need is a new International to oppose them!"
 RED_restore_the_security: "Restore the Security Bureau"
 RED_restore_the_security_desc: "Currently, Red Winter is a mix of people loyal to Comrade Cherino and reactionary elements. If we restore and support the Security Bureau, whose system was broken by the Great Transfer, they will faithfully maintain public order."
 RED_locals_problem: "Control the Military Government"
 RED_locals_problem_desc: "It is time to formally manage the military governments that the Red Winter Federal Academy obtained as a price for the massive revolutionary war waged after the Great Transfer. We must break the current situation of ruling by violence and ultimately integrate all of Scandinavia with our academy."
 RED_locals_problem_tt: "\n§LClears corruption within the Military Government.§!\n\n"
 RED_depress_locals: "Forced Migration Policy"
 RED_depress_locals_desc: "We will relocate local people to places we can easily control through forced migration, and fill the void with students of the Red Winter Federal Academy and residents of the autonomous districts to achieve effective and rapid integration."
 RED_enticing_locals: "Establish Autonomous Republics"
 RED_enticing_locals_desc: "The people need not only the whip but also the appropriate pudding. We will end the excessive suppression of locals by the Security Bureau and establish a local autonomous government to coordinate the relationship between us and the locals, leading to a stable system."
 RED_enticing_locals_tt: "Changes the focus tree under §Y$RED_social_reform$§!.\n\n"
 RED_redwinter_office: "Red Winter Office"
 RED_redwinter_office_desc: "The Red Winter Office is the highest administrative body of the Federal Academy. We must put all our efforts into restoring the local administrative system broken after the Great Transfer and returning the academy's industrial and political sectors to normal."
 RED_redbear_editorial: "Red Bear Editorial Department"
 RED_redbear_editorial_desc: "There are huge holes in our administration, and all sorts of corruption are rampant in the process. This is the current reality where complaints are pouring in from all sides. Even so, one fortunate thing is that the only media organization currently existing in this academy is on our side. It is only a temporary fix, but it will be the best way to quiet the discontent for a while."
 RED_heros_at_front: "Heroes at the Front"
 RED_heros_at_front_desc: "Those who are out fighting at the front in our stead deserve the title of hero. President Cherino has praised their dedication and issued a glorious welfare decree to add one pudding to the heroes' diet."
 RED_welcome_immigrate: "Accept Local Communist Parties"
 RED_welcome_immigrate_desc: "We will actively utilize local organizations that partially agree with our cause."
 RED_welcome_thugs: "Forced Deployment of Migrant Workers"
 RED_welcome_thugs_desc: "To achieve the goals of complex industrial plans, we need to bring in and deploy manpower from various regions. Migrant workers will now be deployed to various wide-area industrial plans, such as building planned cities or expanding industrial facilities." 

 RED_kivotos_halo_militia_add-10_tt: "£GFX_unit_halo_militia_icon_small §CHalo Militia§! §YDivision Limit§!: §R-10§!\n"
 RED_kivotos_halo_militia_add1_tt: "£GFX_unit_halo_militia_icon_small §CHalo Militia§! §YDivision Limit§!: §G+1§!\n"
 RED_kivotos_halo_militia_add2_tt: "£GFX_unit_halo_militia_icon_small §CHalo Militia§! §YDivision Limit§!: §G+2§!\n"
 RED_kivotos_halo_militia_add3_tt: "£GFX_unit_halo_militia_icon_small §CHalo Militia§! §YDivision Limit§!: §G+3§!\n"
 RED_kivotos_halo_militia_add6_tt: "£GFX_unit_halo_militia_icon_small §CHalo Militia§! §YDivision Limit§!: §G+6§!\n"
 RED_administration_of_occupied_territories: "Occupied Territory Administration"
 RED_enlarge_secret_police: "Public Security Department"
 RED_enlarge_secret_police_desc: "Public security within the military government cannot rely solely on the military government itself. We must centralize decentralized public security tasks and manage them from the top down."
 RED_enlarge_secret_police_tt: "§RUnrest§! in §YMilitary Government§! §Gdecreases§!:\n\n"
 RED_enemy_of_class: "Enemies of the Class"
 RED_enemy_of_class_desc: "Despite our efforts to move toward a new society together, petty-bourgeois reactionary elements still remain in the region, counter-revolutionarily hindering us. We will declare them 'Enemies of the Class' and seize victory in the struggle against them!"
 RED_industry_of_mil_gov: "Industrialization of Military Zones"
 RED_industry_of_mil_gov_desc: "According to surveys, the areas we hold as military zones are regions where industrialization has progressed considerably. Industrializing the military zones directly from the center will not only strengthen control over the military government but also significantly enhance the academy's industrial power."
 RED_develope_local_industry: "Local Industry Development Plan"
 RED_develope_local_industry_desc: "We must admit that our capabilities are insufficient to adopt a planned economy. We must grant significant autonomy to the locals."
 RED_develope_local_industry_tt: "Focuses on §Yimproving§! regional §YIndustrial Efficiency§!."
 RED_local_economic_plan: "Top-Down Economic Plan"
 RED_local_economic_plan_desc: "A well-planned industrial design is more effective than anything else."
 RED_local_economic_plan_tt: "Focuses on the §GIndustrialization§! of the region."
 RED_social_reform: "Social Transformation"
 RED_social_reform_desc: "Industrialization must not end with the struggle in the economic and industrial sectors alone. We will transform the previous capitalist consciousness and cultural views to achieve spiritual industrialization beyond the material."
 RED_develop_re1: "Transformation of Denmark"
 RED_develop_re1_desc: "Detailed plans according to the implementation area have been completed."
 RED_develop_re2: "Transformation of Norway"
 RED_develop_re2_desc: "Detailed plans according to the implementation area have been completed."
 RED_develop_re3: "Transformation of Sapmi"
 RED_develop_re3_desc: "Detailed plans according to the implementation area have been completed."

 RED_horizontal_intergration: "Horizontal Integration"
 RED_horizontal_intergration_desc: "It is inefficient for multiple agencies to handle the same tasks simultaneously. We will prepare for horizontal merging."
 RED_intergrate_re1: "Danish Industrial Integration"
 RED_intergrate_re1_desc: "Detailed plans according to the implementation area have been completed."
 RED_intergrate_re2: "Norwegian Industrial Integration"
 RED_intergrate_re2_desc: "Detailed plans according to the implementation area have been completed."
 RED_intergrate_re3: "Sapmi Industrial Integration"
 RED_intergrate_re3_desc: "Detailed plans according to the implementation area have been completed."

 RED_advance_security: "Strengthen the Security Bureau"
 RED_advance_security_desc: "The Security Bureau has perfectly and faithfully performed the missions ordered by the Office, and they deserve more support and much more pudding."
 RED_advance_security_tt: "§GWin§! the §tSnake Game§!."
 RED_end_of_counter_revolution: "End of Counter-Revolution"
 RED_end_of_counter_revolution_desc: "Stupid actions like running a country under the threat of coups and civil wars must not continue. We must be able to eliminate all these threats with stronger and swifter administrative power."
 RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs: "Elevate Security Bureau to Ministry of Internal Affairs"
 RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs_desc: "Now the Security Bureau will move beyond simple public order maintenance activities and act as the Ministry of Internal Affairs for the security of our nation."
 RED_socialism_over_the_world: "Theory of Permanent Revolution"
 RED_socialism_over_the_world_desc: "Marxism says revolution is inevitable if conditions allow. However, conditions aren't always certain, and even if they are, it doesn't mean it's applicable everywhere. We must not settle for reality while waiting for a revolution that might happen centuries later. Right now, workers and peasants worldwide are suffering, and we cannot wait for their liberation."
 RED_the_builder_of_the_winter_army: "Legacy of the Workers' and Peasants' Red Army"
 RED_the_builder_of_the_winter_army_desc: "Under the leadership of Comrade Trotsky, the builder of the Workers' and Peasants' Red Army, Red Winter's military reform is progressing faster!"
 RED_the_builder_of_the_winter_army_tt: "\nThree random focuses from the §Y$RED_restore_cossack_units$§! or §Y$RED_cohesion_first$§! lines will be completed!"
 RED_collectivist_economy: "Collectivist Economy"
 RED_collectivist_economy_desc: "We will quickly move away from the capitalist mode of production."
 RED_strengthen_heavy_industry: "Strengthen Heavy Industry"
 RED_strengthen_heavy_industry_desc: "Heavy industry is the heart of our economy. To see the revolution not just survive but succeed, we must further strengthen the heavy industry sector."
 RED_strengthen_heavy_industry_tt: "\n§LClears corruption within the production sector.§!\n\n"
 RED_agricultural_collectivization: "Agricultural Collectivization"
 RED_agricultural_collectivization_desc: "Stalin's agricultural collectivization stemmed from his political motives, not from social analysis or revolutionary theory. However, because we have Trotsky and his capable theorists, we will overcome Stalin's 'failed' agricultural collectivization and complete true collective agriculture with them."
 RED_system_decentralization: "Decentralization of the System"
 RED_system_decentralization_desc: "Stalin concentrated not only the party but the entire nation on himself. This is clearly an anti-revolutionary approach that takes power away from the workers. In our Red Winter, contrary to that, we must ensure that workers can decide their own fates."
 RED_strengthen_the_trade_unions: "Strengthen Labor Unions"
 RED_strengthen_the_trade_unions_desc: "Under Stalin's leadership, labor unions were transformed from tools representing workers against management into tools of management to command workers, effectively preventing workers from gaining the benefits of the revolution. Fortunately, the workers here have very democratic and self-directed thoughts."
 RED_large_administrative: "Wide-Area Administration"
 RED_large_administrative_desc: "We must re-establish control over the underserved rural areas."
 RED_large_administrative_tt: "\n§LClears corruption within the rural areas.§!\n\n" 
 RED_strengthen_regional_party: "Strengthen Regional Party"
 RED_strengthen_regional_party_desc: "By giving more autonomy to the local party organizations, we can take a step closer to bottom-up democracy."
 RED_long_live_the_workers_government: "Secure Pudding Production"
 RED_long_live_the_workers_government_tt: "\n§GSecures§! additional §YPudding§!."
 RED_long_live_the_workers_government_desc: "What's important right now is welfare. We will first secure support from the masses before implementing policies." 
 RED_got_pudding_flag_tt: "\nAdditional §YPudding§! §Rnot secured§!:\n"
 RED_all_power_to_redwinter: "All Power to the Soviets!"
 RED_all_power_to_redwinter_tt_1: "§gEvery workplace, every rural village, from tea houses to plazas, is filled with discourse about the new society!§!"
 RED_all_power_to_redwinter_desc: "The 'Soviet,' or council, which is an organ for the people's participation in society, must no longer be controlled by the Office! Rather, the Office should now properly be under the control of the Soviets. As they say, 'All power to the Soviets!'"
 RED_all_power_to_redwinter_tt: "§YTail length§! is §Y5§! or more"
 RED_all_power_to_redwinter_tt_2: "\nGains up to §G3§! §YCivilian Factories§! based on §YTail length§! exceeding §Y5§!:\n"
 RED_invite_trotskists: "Invite Trotskyists"
 RED_invite_trotskists_desc: "Trotsky has his followers. They went into exile abroad early on or went underground around the world to avoid the Soviet surveillance network. We must convene them so they can work with him here."
 RED_expand_publishing_dep: "Expand Publishing Department"
 RED_expand_publishing_dep_tt: "§Y$RED_cherino$§!'s §RCommunist Knowledge§! is §Y6§! or more (Current: §Y[?RED_cherino_communism_knowledge]§!)"
 RED_expand_publishing_dep_desc: "All newspapers in this other world are filled with fake news just like the Kronos School. Only 'Red Bear,' published by the Publishing Department, is the true media. To issue more of it, we must expand the editorial department."
 RED_socialist_press: "Socialist Press"
 RED_socialist_press_desc: "The 'Red Bear' Publishing Department is currently rife with corruption, and at its center is Yakumo, the head of the department. Since she does anything for money, if we hand her a little pudding and have her prioritize publishing socialist journals, she will follow along faithfully."
 RED_kill_editorial: "Weaken Editorial Department"
 RED_kill_editorial_tt: "§LClears corruption within the Publishing Department.§!\n\n" 
 RED_kill_editorial_desc: "Yakumo, who is the head of the Publishing Department and in charge of editing, is a miser who does anything for money. She seems loyal to us for now, but if she is given more power, she might use that authority to release articles disparaging the General Secretary's power. We should curtail their authority first."
 RED_merger_of_educational_institutions: "Complete Absorption of Educational Institutions"
 RED_merger_of_educational_institutions_desc: "Western educational policies, full of bourgeois thinking, have no place in Red Winter. We must abolish all educational institutions that promote reaction and deliver Red Winter's educational methods to all educational institutions."
 RED_merger_of_educational_institutions_tt: "\n§LClears corruption within educational institutions.§!\n\n"
 RED_collectivist_propaganda: "Collectivist Propaganda"
 RED_collectivist_propaganda_desc: "The struggles of all people are shared, and we will not leave any individual to struggle alone. Therefore, the achievements of all people must be shared."
 RED_the_production_movement: "Struggle for Production"
 RED_the_production_movement_desc: "To solidify our position in the competition with capitalism, we must not be dependently dragged along by the capitalist world. We must build our own production base that is not interfered with by anyone, and it is time to start the struggle for production."
 RED_socialist_realism: "Socialist Realism"
 RED_socialist_realism_desc: "The path toward a brilliant Red Winter is not always smooth. In the process, some people may lose hope. We must encourage art that shows what Red Winter's reality is actually like and show that we are making an effort."
 RED_heroism_propaganda: "Heroism Propaganda"
 RED_heroism_propaganda_desc: "In Red Winter, while the achievements of all people are shared by all members of the working class, a few who have dedicated themselves to the people can become heroes for everyone to emulate."
 RED_marching_army: "Advancing Winter Army"
 RED_marching_army_desc: "The Winter Army is a military where the people who gathered themselves to protect the motherland are the main force. They are at the front line against the enemies for the liberation of the state and the workers."
 RED_war_hero: "War Hero"
 RED_war_hero_desc: "All the people of Red Winter have stood as one to fight against the enemies threatening Red Winter, and they always will. However, we must not ignore the soldiers among us who have shown exceptional abilities to protect the motherland."
 RED_pluralistic_view: "Pluralistic View"
 RED_pluralistic_view_desc: "As the authority of the Editorial Department has weakened, various articles that couldn't be published until now are being written. At the center is Takane Miyoshi, a recently popular critic and member of the Publishing Department. Her critiques are somewhat reactionary, but since she still seems loyal to our government, we will allow her critiques to be published."
 RED_liberal_for_debate: "Free Discussion"
 RED_liberal_for_debate_desc: "Due to the weakening of the Editorial Department's authority, discussions are continuing within the Publishing Department to seize power. At the center of the discussion is Takane Miyoshi, who gained great popularity with her famous critiques. As her support within the Publishing Department is surging, we need to build a friendly relationship with her."
 RED_press_commercial_magazine: "Publish Commercial Magazines"
 RED_press_commercial_magazine_desc: "The biggest change in the Publishing Department after Yakumo's corruption was purged is the publication of commercial magazines. Although previously taboo, the atmosphere has changed to tolerate the issuance of commercial magazines as the style of the Publishing Department has changed."
 RED_free_press: "Free Press"
 RED_free_press_desc: "As the authority of Takane Miyoshi, an impure element who wrote reactionary articles until recently, has become strong within the Publishing Department, the department is demanding the liberalization of the press. Although we don't like her, we must grant her demand to prevent this conflict from turning into a civil war."
 RED_principle_of_democratic_centralism: "Principle of Democratic Centralism"
 RED_principle_of_democratic_centralism_desc: "After fierce internal discussions in the Publishing Department, Takane Miyoshi was elected as the new head of the department through the principle of democratic centralism. With her increased authority within the Publishing Department, she is rebranding herself as a 'Journalist of the People' and reforming the department anew."


 RED_foreign_policy: "Foreign Policy"
 RED_foreign_policy_desc: "Prioritizing internal affairs in Red Winter's chaotic situation is important, but maintaining relationships with existing academy cities and forming relationships with local nations is also important. Red Winter must prepare to step out onto the world stage again."
 RED_political_realism: "Political Realism"
 RED_political_realism_desc: "Although blood must be shed to complete the revolution, much blood does not need to be shed. If we implement a more flexible foreign policy, we can complete the revolution while minimizing the sacrifice of the people."
 RED_expansionism: "Active Defense"
 RED_expansionism_desc: "\"The only true defense is active defense.\"\n- Mao Zedong"
 RED_attack_fin: "2nd Defense Committee"
 RED_attack_fin_desc: "Our Defense Committee, which launched a blitzkrieg into Finland as an extension of the Northern Offensive, was miserably defeated. However, that does not mean our defeat. We must restore the Defense Committee in the Finnish region and make it our war base!"
 RED_gotland_or_war: "Self-Defense in the North Sea"
 RED_gotland_or_war_desc: "Gotland was originally Swedish territory, but naval remnants of defeated Germany seized it in a surprise attack. However, since it is a necessary base for seizing complete hegemony in the Baltic Sea, we will send them an ultimatum to induce them to give up Gotland."
 RED_attack_ger: "Southern Strike"
 RED_attack_ger_desc: "The Scandinavian Peninsula and Europe are separated by a strait. This makes it very difficult for us to perform regional defense operations in the Danish zone. An offensive toward Schleswig, and further into Holstein, will lead to securing the Stör River, which will lead to the advantage of trench warfare using the river."
 RED_GEK_gave_goatland_flag: "§Y[GEK.GetAdjective]§! ceded §Y[124.getname]§!"
 RED_GEK_gave_goatland_flag_tt: "Current days: [?RED_GEK_gave_goatland_flag:days|Y0]"
 RED_hegemony_on_balt: "Baltic Hegemony"
 RED_hegemony_on_balt_desc: "We need clear hegemony in the Baltic Sea."
 RED_deal_with_fin: "Alliance with Buffer States"
 RED_deal_with_fin_desc: "Finland, which is next to us, also borders the Soviet Union, and they are hostile to the Soviet Union just like us. If we reach out to Finland first, they may not be hostile to us and may fight against the Soviet Union together."
 RED_deal_with_fin_tt: "\n§gCan be used against Intermarium countries at war with @SOV§Y[SOV.GetAdjective]§!.§!"
 RED_seek_allies: "Seek Allies"
 RED_seek_allies_desc: "We must seek out anti-Soviet allies."
 RED_support_german: "Support [GEK.getname]"
 RED_support_german_desc: "We must support comrades who stand against Trinity's hegemony."
 RED_support_geh: "Support Gehenna"
 RED_support_geh_desc: "We must support comrades who stand against Trinity's hegemony."
 RED_trade_with_KAI: "Activate Private Exchange"
 RED_trade_with_KAI_desc: "Isolation is not a good idea after all."
 RED_infiltrate_trm: "Infiltration of Trinity"
 RED_infiltrate_trm_desc: "We must prepare for Trinity's expansion."
 RED_unlock_operation_tt: "§YOperations§! targeting @TRM§Y[TRM.getadjective]§! §Gavailable§!:\n§YCounterfeit Currency§!, §YBiological Weapons§!"

 BA_fake_money_gang: "Issue Counterfeit Currency"
 BA_fake_money_gang_desc: "We will issue counterfeit currency to cause indelible damage to the opponent's economy."
 BA_corona_gang: "Deploy Biological Weapons"
 BA_corona_gang_desc: "I think I remember someone banning this sort of thing in the past..."

 RED_attack_sov: "Secure the Soviet Union"
 RED_attack_sov_desc: "Since the Soviet leader's self-righteous actions are becoming a threat to our revolution, it has become a reality that we must fight against them to complete the revolution. And now the time has come."
 RED_new_inteligence_agency: "New Intelligence Bureau"
 RED_new_inteligence_agency_desc: "The notoriety of the Red Winter Intelligence Bureau is famous among academy cities. President Cherino ordered the reorganization of the Red Winter Intelligence Bureau to prepare for internal and external enemies."
 RED_professioner_undercover: "Infiltration Expert" 
 RED_professioner_undercover_desc: "To safely infiltrate enemy lines, elite agents who have completed high-intensity mental and physical training must be deployed. Infiltration experts raised by agents friendly to our regime will be our eyes and ears in foreign lands."
 RED_fraktiya: "Agents Provocateurs"
 RED_fraktiya_desc: "It's time to deploy professional agents tasked with dividing local resistance organizations."
 RED_international_frontline: "Revolutionary Guard"
 RED_international_frontline_desc: "\"Wait, are we the guards or the ones being guarded? Actually, it doesn't matter, as long as we look cool in red!\""
 RED_communist_instigation: "International Soviet Volunteers"
 RED_communist_instigation_desc: "Maintaining proletarian internationalism is the duty of all workers."
 RED_anti_stalin_in_spain: "Anti-Stalin Ranks in Spain"
 RED_anti_stalin_in_spain_desc: "$SOV_covert_support_for_spanish_poum_desc$"
 RED_trotsky_s_world_revolution: "Trotsky's World Revolution"
 RED_trotsky_s_world_revolution_desc: "Recently, a conflict of opinion has broken out between our academy's Student Council President, Cherino, and Trotsky, the builder of the Federal Academy's ideology. We must support Comrade Trotsky's theory of World Revolution in this chaos and prepare for a revolutionary war toward the whole world."
 RED_cherino_s_systemic_revolution: "Cherino's Systemic Revolution"
 RED_cherino_s_systemic_revolution_desc: "Recently, a conflict of opinion has broken out between our academy's Student Council President, Cherino, and Trotsky, the builder of the Federal Academy's ideology. We must support Comrade Cherino's theory of Systemic Revolution in this chaos, break the power of vanguard organizations, and achieve sustainable communism."
 RED_party_reorganization: "New Theses"
 RED_party_reorganization_desc: "A new program to lead the Red Winter Soviet has been established, and all systems of the federation will soon be reorganized according to this program."
 RED_party_reorganization_tt: "§R[RED.getname] will undergo a political transition aligned with the ideology of Trotsky and the Left Opposition.§!"
 RED_party_reorganization_tt_1: "§R[RED.getname] will undergo a political transition aligned with the ideology of Cherino and the Office.§!"
 RED_centralization: "Centralized State"
 RED_centralization_tt: "\nThe military power of the §YReconstruction Council of Liberated Zones§! is strengthened."
 RED_union_nation_tt: "\nReceive more industry from the §YReconstruction Council of Liberated Zones§!."
 RED_union_nation: "Self-Determination of Nations" 
 RED_workers_state: "Workers' Republic"
 RED_workers_state_desc: "Our state, as a workers' republic, will take care not to become a workers' state corrupted by bureaucracy like the neighboring Soviet Union, and will continuously invest in the liberation of the world's people."


 RED_party_central_dissolution: "Dissolution of Party Center"
 RED_party_central_dissolution_desc: "The Central Committee of the Communist Party has continuously dominated the party as if its own opinions were the opinions of the entire Communist Party. Now, to move toward a party dictatorship rather than a Central Committee dictatorship, the influence of the Central Committee will be significantly reduced, and the right to speak for party comrades will be improved."
 RED_thesis_tt: "When focus §Y$RED_party_reorganization$§! is completed:\n\n"
 RED_freedom_of_debate_unity_of_action: "Freedom of Discussion and Unity of Action"
 RED_multi_party_system: "Multi-Party Cooperation"
 RED_soc_dem_party_name_long: "Social Democratic Labour Party"
 RED_soc_dem_party_name: "SDLP"
 RED_hegemony_struggle: "Cultural Hegemony Struggle"
 RED_free_soviets: "Free Soviets"
 RED_free_soviets_desc: "To move toward a party dictatorship, Soviets that are truly established and operated by the people are needed. Now workers in workplaces can freely establish and dissolve Soviets, and party officials can also be impeached by accusations."
 RED_democratic_planned_economy: "Central Industrial Control"
 RED_no_war_but_class_war: "No War But Class War"
 RED_ideal_of_bolshevism_again: "Reenacting the Ideal of Bolshevism"
 RED_cherino_core_of_solidarity: "Nucleus of Unified Solidarity"
 RED_day_of_victory: "Day of Victory"
 RED_return_of_left_oppisition: "Return of the Left Opposition"
 RED_revolutionary_trial: "Revolutionary Trial"
 RED_bolshevik_leninism: "Bolshevik-Leninism"
 RED_social_rebuild: "Social Recovery Project"
 RED_rebuild_party: "Rebuild the Vanguard Party"
 RED_annex_party: "Party Merger"
 RED_fix_error: "Ideological Error Correction"
 RED_creative_deconstructivism: "Creative Deconstruction"
 RED_federalization: "Federalization"
 RED_military_government: "Soviet Civil Oversight Bureau"
 RED_redwinter_in_world: "Red Winter in the World"
 #SOV Focuses Thieves
 RED_strengthen_the_trade_unions_by_sov: "$SOV_strengthen_the_trade_unions$"
 RED_the_peoples_revolution: "$SOV_the_peoples_revolution$"
 RED_the_supreme_soviet: "$SOV_the_supreme_soviet$"
 RED_for_the_common_good: "$SOV_for_the_common_good$"
 RED_victory_over_devastation: "$SOV_victory_over_devastation$"
 RED_victory_over_devastation_tt: "Consumer Goods Factories: §Y-2.0%§!\nStability from Party Popularity: §G+15.00%§!\nSurrender Limit: §G+10.00%§!\nFactory Repair Speed: §G+10.00%§!"
 RED_socialist_humanism: "$SOV_socialist_humanism$"
 RED_regional_development: "$SOV_regional_development$"
 RED_autonomous_soviet_republics: "$SOV_autonomous_soviet_republics$"
 RED_international_union_of_soviet_republics: "$SOV_international_union_of_soviet_republics$"
 RED_international_union_of_soviet_republics_tt: "Overlord Trade Cost: §G-10%§!\nStability from Party Popularity: §G+10%§!"

 RED_liberation_of_the_kibotus_states: "Kivotos Revolutionary War"
 RED_liberation_of_the_kibotus_states_desc: "We must achieve the first revolutionary war to dissolve the dictatorial systems of Kivotos academies and establish a nation for the people."
 RED_liberation_of_the_kibotus_states_tt: "§gCan be used against bordering Kivotos nations.§!"
 RED_armed_workers: "Proletarian Armament"
 RED_armed_workers_tt: "\n§gCan be used on nations at war.§!"
 RED_war_communism_focus: "War Communism" 
 RED_people_s_liberation_war: "World People's Liberation War"
 RED_people_s_liberation_war_desc: "The international liberation war to liberate the oppressed workers and peasants worldwide, and the people of the colonies, has begun. Our nation will head to the front as one for the liberation of the world."
 RED_people_s_liberation_war_tt: "Immediately §Rdeclare war§! on bordering §Yminor nations§!. (If a §YNon-Aggression Pact§! exists, war will §Rnot be declared§!.) The §Y£GFX_decision_icon_small Spread the Revolution§! decision now works against local minor nations as well."
 RED_permanent_revolution: "Permanent Revolution"
 
#Marina Route
 RED_no_error_at_ideology: "In Pursuit of Ideological Integrity"
 RED_ivan_kupla: "Ivan Kupala"
 RED_ivan_kupla_desc: "In Red Winter, a coup is like a cultural event that always happens. But now, it must not end as culture; a massive plan is needed to build a true academy. This Ivan Kupala festival will be its starting point."
 RED_coup_of_office: "Marina's Coup"
 RED_coup_of_office_desc: "Our coup was successful! Student Council President Renkawa Cherino, who failed to be a role model for students, fled her position upon hearing news of the coup, and the Guards have captured all student council and academy factions in the name of restoring order. No one will be able to stop Marina anymore, nor will anyone ever exist to do so.\n\n...Would saying that be okay, Marina?!" 
 RED_labor_party_problem: "The Public Works Department Issue"
 RED_labor_party_problem_desc: "After the coup, the Public Works Department harbored hostility toward us and decided to continue and execute sabotage and a general strike. Furthermore, at the center of the clubs that lost self-control due to the coup and withdrew even their support for the Office, there was always the Public Works Department."
 RED_suppress_the_labor_party: "Suppress the Public Works Department"
 RED_suppress_the_labor_party_desc: "Our first goal is to restrict the activities of the Public Works Department. After blocking their protests and mobilizing the Guards to disperse them to suppress their external activities, we must reduce the authority of the Public Works Department through revisions of the school rules within the Office."
 RED_arrest_minori: "Arrest Minori"
 RED_arrest_minori_desc: "\"Yasumori Minori, head of the Public Works Department!\n\nYou are hereby arrested for leading illegal assemblies and irregular general strikes, and for conspiring to stage a coup against the Office and the entire academy by instigating Red Winter Federal Academy students!\""
 RED_split_the_labor_party: "Form Factions within Public Works"
 RED_split_the_labor_party_desc: "With Minori gone, the Public Works Department has fallen into chaos. Even their temporarily formed leadership is flustered and unable to resolve this chaos, so this is surely an opportunity!"
 RED_keep_an_eye_on_labor_party: "Strengthen Surveillance of Public Works"
 RED_keep_an_eye_on_labor_party_desc: "Even if we arrested Minori and weakened the Public Works Department, our efforts will be in vain if a second or third Minori emerges. Therefore, we need to deploy surveillance personnel and steadily monitor their movements."
 RED_puppet_labor_party: "Puppetization of the Public Works Department"
 RED_puppet_labor_party_desc: "Perfect! Most of the members of the Public Works Department have pledged loyalty to the Office and decided to acknowledge Comrade Cherino's legacy and Marina's leadership!\n\nThe Public Works Department is ours now. We can do whatever we want with them."
 RED_down_with_traitors: "Hunt for Traitors"
 RED_down_with_traitors_desc: "Although the coup was successful, there are still forces scattered about that reject our paradigm and hegemony. This is a bad habit of Red Winter where \"coups\" remained a cultural element, so such unstable bad habits must be abolished. If we cannot arrest internal sympathizers, our era will soon come to an end."
 RED_military_purge: "Military Purge"
 RED_military_purge_desc: "Although the Guards and the newly organized Student Soldiers are the biggest support forces for Marina and the military, they also need to be checked as armed forces. If they try to oppose us with impure thoughts, we must personally drag them down to the concrete floor to keep them in her palm.\n\n\"Now, it's time for the purge.\""
 RED_trace_the_cherino: "Track Cherino's Whereabouts"
 RED_trace_the_cherino_desc: "After the last Ivan Kupala, Cherino completely vanished. However, ominous rumors are circulating within the academy that she is going around various clubs, plotting to destroy our hegemony. We must capture Cherino before her influence destroys our new future!"
 RED_fate_of_trotsky: "The Fate of Trotsky"
 RED_fate_of_trotsky_desc: "Leon Trotsky, once a prominent revolutionary of the Soviet Union and a political rival of Stalin, entered Red Winter after wandering the world since losing power to Stalin and his opponents. Even if he says he can dedicate himself to the revolution, there is no guarantee that his path will be the same as ours. Also, since the difference in goals is already significant, we must eliminate future trouble before he becomes a snake that bites our neck."
 RED_marina_is_the_only_one: "New Leader of Red Winter"
 RED_marina_is_the_only_one_desc: "Comrade Marina's efforts have made significant progress. Under her leadership, the chaotic academy has regained stability, and all coup attempts to threaten the current peace have long been crushed. She is certainly the true hero and revolutionary of Red Winter, and the new Student Council President who can more than replace the void left by Cherino."
 RED_heir_of_cherino: "Spokesperson of Red Winter"
 RED_heir_of_cherino_desc: "Although she took power through a coup, she has performed her previous role more than enough. The way she quickly suppressed the opposition and regained stability reminds people of Cherino, and it is time to accept her as the new Student Council President. The position that seemed to be eternal due to Comrade Cherino's stubbornness will now be continued by Marina, and this time, it will not change forever."
 RED_office_united_as_one: "Unified Office"
 RED_office_united_as_one_desc: "The chaos in the Office has finally subsided. Internal enemies threatening Marina have all been liquidated, and followers who wandered looking for Cherino can no longer set foot in this academy. Although the only survivor left in the Office is Marina, in other words, the Office was able to survive because she was there. We should know that pledging loyalty to the Office and the academy led by her, as a hero and unique leader rather than an enemy of the academy, is for the future of the academy."
 RED_secure_the_publishing_department: "Secure the Publishing Department"
 RED_secure_the_publishing_department_desc: "The Publishing Department is the academy's largest media organization, issuing the campus newspaper \"Red Bear\" and various journals. By seizing them, we will be able to secure our legitimacy."
 RED_appease_yakumo: "Appease Yakumo"
 RED_appease_yakumo_desc: "Yakumo Aramaki—her actions are notorious within the academy, but there probably isn't a student with more influence in the Publishing Department than her. If we persuade her to distribute various propaganda materials, a way to revive the status of the Office will also come to mind."
 RED_purge_the_redbear: "Purge the Red Bear Editorial Department"
 RED_purge_the_redbear_desc: "While no one denies that \"Red Bear\" is a truly truthful media outlet, the corruption and reactionary journalism committed by the head of that media were grave crimes that damaged our cause. We must stop his dominance and prevent further loss of prestige!"
 RED_redbear_new_editor_in_cheif: "New Editor-in-Chief of Red Bear"
 RED_redbear_new_editor_in_cheif_desc: "It is hard to deny that the quality of \"Red Bear\" has somewhat declined since the previous purge of the editorial department. Therefore, we should look for a new person to replace the existing editor-in-chief... Ah, there was already a suitable person. Takane Miyoshi, the Publishing Department's best critic, will surely break through this situation!"
 RED_purge_the_pd: "Purge the Publishing Department"
 RED_purge_the_pd_desc: "The staff of the Publishing Department is vast enough to influence all areas within the academy. However, because of that, there are people with various opinions, and among them, there may be those who are a threat to the Office. Therefore, we need to weed out reactionary elements as much as we can."
 RED_expand_the_pd_budget: "Expand Publishing Department Budget"
 RED_expand_the_pd_budget_desc: "Considerable tax revenue remained after carrying out the recent large-scale restructuring of the Publishing Department. Also, considering that the previous investigation showed that the working environment of the Publishing Department was quite poor, this might be a golden opportunity to raise them as a small elite group to maximize productivity."
 RED_new_redbear_movement: "New Red Bear Movement"
 RED_new_redbear_movement_desc: "Our plan, which started from \"Red Bear,\" has finally gotten on the right track. Their propaganda has ended the students' concerns, and various reorganization plans applied to the Publishing Department are providing more efficient, improved, and advanced journalism.\n\nThrough these series of reforms named the \"New Red Bear Movement,\" we have proven that Red Bear is the wisest and most truthful media more than any other!"
 RED_path_of_great_academy: "Path to the Great Academy"
 RED_path_of_great_academy_desc: "\"Marching forward toward a future of order and discipline! For the Glory of the Academy!\""
 RED_deal_with_GEM: "Deal with Pandemonium Society"
 RED_deal_with_GEM_desc: "\"Negotiating with Gehenna's leaders... I hope they don't try to pay us in weird trinkets or jokes.\""
 RED_tech_sharing_with_GEM: "Tech Sharing with Pandemonium Society"
 RED_tech_sharing_with_GEM_desc: "\"Their technology is chaotic, but powerful. If we can harness it for our security...\""
 RED_makoto_marina_treaty: "Makoto-Marina Treaty"
 RED_makoto_marina_treaty_desc: "\"A pact between two strong leaders. For the stability of our respective academies.\""
 RED_deal_with_mika: "Deal with Mika"
 RED_deal_with_mika_desc: "\"Talking to the girl from Trinity. She's... surprisingly enthusiastic about military matters.\""
 RED_sell_battleship_to_mika: "Propose Battleship Sale to Mika"
 RED_sell_battleship_to_mika_desc: "\"A battleship for her dreams, and funds for our security. A fair trade.\""
 RED_mika_marina_treaty: "Mika-Marina Treaty"
 RED_mika_marina_treaty_desc: "\"A strategic alliance born of mutual interest. Let others worry about the politics.\""
 RED_first_administrative_policy_speech: "First Administrative Policy Speech"
 RED_first_administrative_policy_speech_desc: "\"Students of Red Winter! Today, we leave behind the chaos of the past and step into an era of iron-clad stability!\""
 RED_contain_complaint_of_students: "Supplying Student Discontent"
 RED_contain_complaint_of_students_desc: "\"A firm hand and a steady supply of snacks should keep the restless quiet.\""
 RED_ban_illegal_rally: "Ban Illegal Assemblies"
 RED_ban_illegal_rally_desc: "\"Public gatherings without prior approval from the Security Bureau are a threat to order. They are now prohibited.\""
 RED_enact_law_of_AGO: "Enact Anti-State Group Law"
 RED_enact_law_of_AGO_desc: "\"Any group that threatens the unity of the academy will be labeled an enemy of the state.\""
 RED_the_constitution_of_marina: "The Marina Constitution"
 RED_the_constitution_of_marina_desc: "\"The new law of the land. Order, discipline, and the defense of Red Winter.\""
 RED_rebuild_the_bodyguards: "Rebuild the Guards"
 RED_rebuild_the_bodyguards_desc: "\"Our most loyal defenders. We must ensure they are better equipped and more disciplined than ever before.\""
 RED_order_No_228: "Order No. 228"
 RED_order_No_228_desc: "\"Not one step back in our duty to protect the academy! All personnel are to maintain their posts at all costs!\""
 RED_amnesty_for_special_class: "Amnesty for Special Class"
 RED_amnesty_for_special_class_desc: "\"The students of Class 227 have potential. We shall grant them a clean slate in exchange for their service.\""
 RED_new_security_commissar_Shigure: "Security Commissar Shigure"
 RED_new_security_commissar_Shigure_desc: "\"Her unique perspective and... resourcefulness... will be an asset to the internal security of Red Winter.\""
 RED_suspect_the_loyalty_of_bodyguards: "Suspect Loyalty of Guards"
 RED_suspect_the_loyalty_of_bodyguards_desc: "\"Power can corrupt anyone. We must ensure the Guards remain focused on their duty, not their ambitions.\""
 RED_last_track_down_work: "Final Purge Operation"
 RED_last_track_down_work_desc: "\"Cleaning out the last remnants of dissent. We cannot leave any weeds to grow back.\""
 RED_establish_red_guard: "Establish Red Guard"
 RED_establish_red_guard_desc: "\"A new elite force, personally loyal to the leadership and the vision of a unified Red Winter.\""
 RED_land_redistribution_problem: "Land Redistribution Issue"
 RED_land_redistribution_problem_desc: "\"The land must be used efficiently for the good of the academy. Private holdings will be reviewed.\""
 RED_overall_lands_resumption: "Total Land Resumption"
 RED_overall_lands_resumption_desc: "\"All territory is the property of the academy. We are reclaiming it for centralized management.\""
 RED_phased_redemption: "Execute Phased Resumption"
 RED_phased_redemption_desc: "\"A gradual approach to land recovery, to avoid sudden shocks to the local economy.\""
 RED_forced_migration_for_native: "Forced Migration of Locals"
 RED_forced_migration_for_native_desc: "\"Moving non-student populations to designated zones to streamline administration and security.\""
 RED_cleruchy_of_thugs: "Delinquent Military Colony System"
 RED_cleruchy_of_thugs_desc: "\"Putting the troublemakers to work on the frontiers. They get discipline, and we get secure borders.\""
 RED_overall_restructure_of_AD: "Total Administrative Restructuring"
 RED_overall_restructure_of_AD_desc: "\"Redrawing the maps for a more efficient and centralized government.\""
 RED_complete_land_reform: "Complete Land Reform"
 RED_complete_land_reform_desc: "\"The final step in our agricultural revolution. The land now serves the state perfectly.\""
 RED_united_and_progressive_our_school: "A United and Progressive Academy!"
 RED_united_and_progressive_our_school_desc: "\"Together, we build a future that is bright, strong, and unwavering!\""
 RED_first_footprint_for_war: "Marina's First Campaign"
 RED_first_footprint_for_war_desc: "\"The time for defense is over. We take the initiative to secure our future!\""
 RED_move_on_western_europe: "Southward Advance to Western Europe"
 RED_move_on_western_europe_desc: "\"Spreading the influence of Red Winter to the lands of the setting sun.\""
 RED_fufil_the_promise: "Fulfill the Promise"
 RED_fufil_the_promise_desc: "\"Honoring our agreements, for a strong leader's word is her bond.\""
 RED_the_castle_of_red_winter: "The Fortress of Red Winter"
 RED_the_castle_of_red_winter_desc: "\"We shall make our home an impregnable bastion against any threat!\""
 RED_great_revolution_of_kivotos: "Great Kivotos Revolution"
 RED_great_revolution_of_kivotos_desc: "\"The fire we started here shall consume all of Kivotos! No student left behind!\""
 RED_infiltrate_kivotos: "Infiltrate Kivotos"
 RED_infiltrate_kivotos_desc: "\"Quietly sowing the seeds of order in the chaos of the other academies.\""
 RED_revolutionary_war_of_kivotos: "Kivotos Revolutionary War"
 RED_revolutionary_war_of_kivotos_desc: "\"The final march. We bring the light of Red Winter to every school gate!\""
 RED_road_of_the_war: "Road to War"
 RED_road_of_the_war_desc: "\"The path is set. There is no turning back now. Victory or bust!\""
 RED_secure_general_student_council: "Seize General Student Council"
 RED_secure_general_student_council_desc: "\"The ultimate seat of power. Once we take this, Kivotos is truly ours.\""
 RED_trigger_student_revolution: "Trigger Student Revolution"
 RED_trigger_student_revolution_desc: "\"Inspiring the masses of Kivotos to rise up and join our glorious cause!\""
 RED_move_on_eastern_europe: "Eastward Advance to Eastern Europe"
 RED_move_on_eastern_europe_desc: "\"Our march continues! The East shall also know the order of Red Winter!\""
 RED_across_Baltic_Sea: "Across the Baltic Sea"
 RED_across_Baltic_Sea_desc: "\"Expanding our reach beyond the waters. No sea can stop our progress!\""
 RED_return_our_lands: "Reclaim Lost Territories"
 RED_return_our_lands_desc: "\"Taking back what was always ours. Red Winter shall be whole once more!\""
 RED_true_barrier_of_the_socialism: "True Bulwark of Socialism"
 RED_true_barrier_of_the_socialism_desc: "\"We stand as the final, unyielding wall against the forces of reaction!\""
 RED_unite_students_of_kivotos: "Students of Kivotos, Unite!"
 RED_unite_students_of_kivotos_desc: "\"Under one banner, under one leader, for a perfect future for all!\""
 RED_conquer_the_colors: "Conquer the Colors"
 RED_conquer_the_colors_desc: "\"Even the cosmic threats shall fall before the might of the unified Red Winter!\""
 RED_hunting_red_bear: "Hunting the Red Bear"
 RED_hunting_red_bear_desc: "\"It's time to deal with the giants of this world. We shall not be intimidated!\""
 RED_the_cradle_of_socialist_revolution: "Cradle of Socialist Revolution"
 RED_the_cradle_of_socialist_revolution_desc: "\"Red Winter shall be remembered as the place where the true future was born.\""
 
 
#Minori Route
 RED_first_focus: "§GThe focus selected right at the start.§!"
 RED_dipose_cherino: "February General Strike"
 RED_dipose_cherino_desc: "Despite the people's lives being devastated in the wake of the Great Transfer, the Red Winter Office is focused only on power struggles, ignoring us. We must prepare for a massive struggle against the rotten Cherino and the Red Winter Office."
 RED_labor_world: "Secure Rural Support"
 RED_labor_world_tt: "\nWhen §Y£GFX_decision_icon_small $RED_ousting_office$§! is completed in a §YRural§! state, §YArmed Poor Peasant Divisions§! will be spawned."
 RED_labor_world_desc: "The majority of those participating in the strike are workers, but there are also many poor peasants suffering from poverty. If we guarantee them fair rations, collectivization, and most importantly, a pudding rationing system, we will be able to secure enthusiastic support from them."
 RED_RMC: "Public Works Organization Policy"
 RED_RMC_desc: "To effectively lead the workers and peasants gathered from all over, and to successfully complete the revolution, a unified and organized leadership is needed. The Revolutionary Military Council, composed of veterans and students exceptional in combat, will take on this role."
 RED_native_leftists: "Join with Local Leftists"
 RED_native_leftists_desc: "Among the leaders of the locals participating in the general strike, there are several who share similar ideologies with us. As a result of contacting them for the establishment of a united front between locals and Kivotos students, they have promised to support the government of workers established after the revolution."
 RED_sans_culotte: "Seize the Armory"
 RED_crush_local_capitalist_government: "Crush Local Capitalist Regimes"

 RED_take_publish_club: "Co-opt the Publishing Department"
 RED_take_publish_club_tt: "\nIf this §Yfocus§! is §Ynot completed§!, §Y$RED_yakumo$§! will join the §Rcounter-revolution§!!"
 RED_swe_sdwp: "Alliance with Social Democratic Workers' Party"
 RED_the_threats_abound: "'May Day'"
 RED_the_threats_abound_desc: "Labor Day, whose true meaning has been faded by Cherino's personality cult, is approaching. On that day, together with supporters within the military and the revolutionary army, we will launch a revolution to overturn the contradictions of the old system and build a Red Winter for the workers."
 RED_maintaining_the_fire: "The Fire of Revolution"
 RED_maintaining_the_fire_desc: "\"Don't let the flame go out! Every extra hour on the picket line is another step toward freedom!\""
 RED_basic_military_science: "Basic Military Science"
 RED_freedom_of_thought: "Youth-Cadet Council"
 RED_freedom_of_thought_desc: "The Youth-Cadet Council conducts research for the workers and plays a role in fighting against those who harm workers. Young blood will make Red Winter Federal Academy younger!"
 RED_deal_with_ger: "Revolutionary Defense Front"
 RED_deal_with_ger_desc: "\"Working with foreign comrades to secure our borders. A worker's struggle has no borders!\""
 RED_back_to_workplace: "Support Dockworker Uprisings"
 RED_back_to_workplace_desc: "\"The ports must belong to those who toil in them! Free the docks!\""
 RED_back_to_workplace_tt: "Owned and non-demilitarized §YPort§! states:\n"
 RED_defense_revolution: "Raid the Old School Building"
 RED_defense_revolution_desc: "\"Taking back what was taken from us! The old building shall be the heart of our new world!\""
 RED_communist_diplo: "Arming Labor Union Members"
 RED_communist_diplo_desc: "\"A worker without a rifle is just a victim. Give every union member the means to defend their rights!\""
 RED_communist_diplo_tt: "Owned and non-demilitarized §YUrban§! states:\n"
 RED_new_council: "New Socialist Constitution"
 RED_new_council_desc: "As the revolution ended, the Revolutionary Committee resolved to voluntarily dissolve for the enactment of a new constitution, and the Constituent Assembly replaced them. To celebrate the success of the revolution and provide the foundation for our workers' government, discussions on a new constitution are continuing."
 RED_GGOKDUGAKSI: "Puppetization of Public Works"
 RED_workerfront: "Establish Councils"
 RED_attack_geh: "Southern Preemptive Offensive"
 RED_attack_geh_desc: "News of the Office's defeat and the revolution's success began to spread to military governments everywhere. Before the Office, which fled to Norway, can gather the military government's army, we must raid the Danish side close to us to prevent their mobilization."
 RED_anti_fascism_policy: "Revolutionary Trial"
 RED_anti_fascism_policy_desc: "Cherino and the Office were once again brought down by the workers. Now is the time to hold a trial for the reactionary elements of the Office who practiced dictatorship under the sweet lie of 'for the people'."

