 RED_event.15.t: "Revolutionary War"
 RED_event.15.d: "It was something that was bound to happen someday. Before the flames of revolution blooming in Scandinavia consume the whole world, we will burn the shadows of the reactionary fascist - far-right Nazi forces."
 RED_event.15.a: "Protect the Revolution, crush the Nazis!"
 RED_event.16.t: "Workers' Republic"
 RED_event.16.d: "Since the proletarian masses have taken all means of production into their own hands and have established themselves as the political ruling class, the Workers' Republic must strive for progress toward the future with other oppressed working-class comrades by boosting productivity as rapidly as possible. We took sufficient measures needed after the revolution, the economy is stabilized, and we have clearly proven that socialism without centralization is also feasible. Only progress remains ahead of Red Winter!"
 RED_event.16.a: "Long live Socialism!"
 RED_event.17.t: "Dawn of Syndicalism"
 RED_event.17.d: "Labor unions have been reorganized on a large scale in all sectors, and workers are producing, planning, expressing opinions, and voting through the unions. This is clearly a victory for syndicalism on the life front, and it can truly be called labor liberation."
 RED_event.17.a: "Long live the Labor Unions!"
 RED_event.18.t: "Socialists of Norway"
 RED_event.18.d: "As the integration of Norway is completed, Norwegian socialists want to participate in our government."
 RED_event.18.a: "Welcome, comrades!"
 
 RED_event.19.t: "Labor Service Division Rejected Marina"
 RED_event.19.d: "Wait, the Labor Service Division... they're refusing to listen to my orders?! But I'm the Security Director! This is... this is insubordination! \"Hey! Pick up those shovels and get back to work! Why are you looking at me like that?!\""
 RED_event.19.a: "Blast it..."
 RED_event.20.t: "Still Remaining Threats"
 RED_event.20.d: "I thought we cleaned out all the reactionaries, but reports keep coming in of secret meetings in the old campus buildings. It's like weeds—you pull one, and two more pop up. \"Tomoe, did you see where they went? No? Then we need more patrols! Double them! Triple them!\""
 RED_event.20.a: "\"You're saying there's still more?!\""
 
 RED_event.21.t: "Sudden Change"
 RED_event.21.d: "Although many cheered for the 3-day work week, it cannot be maintained permanently because production has decreased drastically. As an alternative, we decided to guarantee a 3-day work week only for students, and for local workers, a flexible work system and a 4.5-day work week."
 RED_event.21.a: "That's a shame."
 RED_event.21.b: "I think we can maintain it somehow."
 RED_event.22.t: "Evaluation of the 2nd AEP"
 RED_event.22.d: "Hundreds of People's Commissars gathered in a huge conference room. They held an ad-hoc meeting to argue over the pros and cons of the Alternative Economy Policy, led by those who wanted to dissolve the AEP.\n\n\"The fact that Comrade Arnold's background is a capitalist who exploited Danish workers is very public! Having such a person hold the position of industrial supervisor again is a clear defense of capitalism and an obvious threat to the socialist system!\"\n\n\"The taxes placed on petty-bourgeois businesses, such as small and medium-sized industries, are blurring the working-class character of the masses!\"\n\nFierce opinions from the opposition erupted, and since a decision through deliberation was not easily reached, the chairman put the pros and cons of the direction of the Alternative Economy Policy to a vote."
 RED_event.22.a: "Let's deepen it into Corporatism!"
 RED_event.22.b: "Let's resolve it into Market Socialism!"
 RED_event.22_tt_1: "We are having difficulty pushing the §YAEP§! because we did not reach the §R80§! §YCivilian Factories§! goal of the §Y2nd Alternative Economy Policy§!:\n"
 RED_event.22_tt_2: "We are having difficulty stopping the §YAEP§! because we reached the §G80§! §YCivilian Factories§! goal of the §Y2nd Alternative Economy Policy§!!"
 RED_event.24.t: "Mint Chocolate Liberation Front Coup"
 RED_event.24.d: "The Mint Chocolate Liberation Front launched a coup when their petitions for resolving the mint chocolate ration shortage caused by the Great Translocation were repeatedly ignored. Disguising themselves as delivery workers to avoid the Guards' suspicion, the members of the Mint Chocolate Liberation Front entered the central campus, occupied the entire building, and staged a sit-in, attacking the Guards. Surprised by the surprise attack, the Guards temporarily retreated from the campus."
 RED_event.24.a: "Oh, come on!"
 RED_event.24_tt: "\n§RCoups§! will continuously occur due to the National Spirit §Y$RED_threat_of_coup$§!. This National Spirit can be removed through the focus §Y$RED_club_focus_2$§!."
 RED_event.25.t: "Coup of the Gathering of Revolutionaries Against Lemon on Karaage"
 RED_event.25.d: "As terrorism by the Gathering of Revolutionaries Against Lemon on Karaage against students who eat karaage with lemon became more frequent after the Great Translocation, the Secretariat took measures for intensive crackdowns. Then, they gathered in the Cherinograd city center, attacked the campus in the middle of the night, overpowered security guards, and organized the Anti-Lemon Provisional Administrative Committee. They plan to announce the establishment of a new regime within a few days."
 RED_event.25.a: "These people are crazy."
 RED_event.26.t: "Midwinter Cold Water Rubdown General Federation Coup"
 RED_event.26.d: "At 3 AM last night, members of the Midwinter Cold Water Rubdown General Federation suddenly gathered on campus, occupied the Secretariat, and entered a sit-in. Bureaucrats who hadn't come to work yet are 'unfortunately' enjoying a mandatory paid vacation, and a suppression operation against them will soon be launched."
 RED_event.26.a: "Let's not rush."
 RED_event.27.t: "Suppression"
 RED_event.27.d: "The suppression operation against the last coup has been successfully completed, and security members are busy removing propaganda flyers and coup forces' flags throughout the city. [RED.getleader] sits back in the office chair and starts working again."
 RED_event.27.a: "Thank goodness."
 RED_there_is_coup_flag: "§tGovernment paralyzed due to a routine coup§!"
 RED_event.28.t: "Crushed Anti-Government Organizations"
 RED_event.28.d: "The threat of coups by anti-government forces that had persisted for a long time in Red Winter has been successfully crushed. Leaders of major anti-government organizations were taken away and detained in the Old School Building, and their remnants were scattered. Red Winter is now politically stable!"
 RED_event.28.a: "What a relief."
 RED_event.28_tt_1: "§LThe Midwinter Cold Water Rubdown General Federation has been disbanded.§!"
 RED_event.28_tt_2: "\n§LTerrorism by the Gathering of Revolutionaries Against Lemon on Karaage has been eradicated.§!"
 RED_event.28_tt_3: "\n§LAll assets of the Mint Chocolate Liberation Front have been seized.§!"
 RED_event.29.t: "Issuance of Counterfeit Currency"
 RED_event.29.d: "The enemy country is cowardly issuing counterfeit currency to ruin our country's economy!"
 RED_event.29.a: "Dammit!"
 RED_event.30.t: "The Great Winter War"
 RED_event.30.d: "It is being accepted by the people of both countries that the fight against the enemy country will not be easy. We must find a breakthrough in some way."
 RED_event.30.a: "Let's defeat them!"
 RED_event.31.t: "Biochemical Weapons"
 RED_event.31.d: "Biochemical weapons sprayed by the enemy country are hindering our operations!"
 RED_event.31.a: "I think I remember these things being banned in the past."
 RED_event.32.t: "Population Problem"
 RED_event.32.d: "Millions of students came here as they were due to the Great Translocation. Unfortunately, the limits of this place were clear. Students are suffering from the saturated population in the city, which is more than likely to lead to large-scale unrest and the collapse of the economy, order, and administration."
 RED_event.32.a: "We must solve this somehow!"
 RED_event.32_tt: "\nYou can mitigate §RPopulation Saturation§! through §Y£GFX_decision_icon_small decisions§! unlocked by the focus §Y$RED_land_research$§!."
 RED_event.33.t: "Gathering of Capitalist Roaders"
 RED_event.33.d: "It is clear that capitalist roaders advocating the capitalist line are growing. We must suppress them!"
 RED_event.33.a: "What a headache."
 RED_event.34.t: "Disintegrated Capitalist Roaders"
 RED_event.34.d: "The capitalist roaders were disintegrated thanks to an active anti-capitalist campaign."
 RED_event.34.a: "Good,"
 RED_event.35.t: "Resolution of the Population Problem"
 RED_event.35.d: "It was chaotic due to the Great Translocation, but we were barely able to solve the population problem. But it's not over yet. What they lack is not only food but also daily necessities and consumer goods. We must also work tirelessly to solve the consumer goods shortage."
 RED_event.35.a: "If only we had consumer goods to give them!"
 RED_event.36.t: "Minor Problem"
 RED_event.36.d: "After the offensive in Helgeland, Norway was completed, the Secretariat greatly increased the size of administrative and military administrative officer positions to minimize administrative confusion. With the threat to the Union Academy entering a lull, it has been confirmed that there are problems such as reports sent by some secretaries being omitted or contact being lost in some areas. More accurate information needs to be found through investigation, but it doesn't seem to be a big problem yet."
 RED_event.36.a: "We should strengthen the practical training of secretaries."
 RED_event.36.b: "What is a Military Government?"
 RED_event.37.t: "Revealed Corruption"
 RED_event.37.d: "A shocking report has been delivered to the Secretariat. The secretaries of the Union Academy were engaging in corruption in collusion with locals, and the administration of military government agencies is a mess. The production amounts written in the reports from each workplace were lies to get more support, and the supply department existed only on paper, so rations were not being distributed to students at all. The self-governing People's Guard divisions of students, which were reported to be serving faithfully for the Union Academy, had long since disintegrated or vanished after resolving to disband themselves, and we cannot trust the reports from the Winter Army either!"
 RED_event.37.a: "Shocking!"
 RED_event.38.t: "Glimmer of Industrial Development"
 RED_event.38.d: "The population saturation crisis, which approached as a crisis for Red Winter, has come back as an opportunity. Students are going to rural areas, workplaces, logging camps, sawmills, and mines—wherever labor is short—to help the people, and the increased population will clearly be the driving force to brighten the production of Scandinavia and the Union Academy!"
 RED_event.38.a: "That's a relief."
 RED_event.38_tt: "Three random focuses in the §YRecruit Local Technocrats§! branch are completed! If all focuses are completed, you receive §YCivilian Factories§! equal to the number of focuses not completed by this event.\n\n"
 RED_event.39.t: "Local Right-Wingers Victimized by Red Terror"
 RED_event.39.d: "While many local right-wing politicians went into exile with their king, many other right-wing youth organizations are still hindering our Academy construction. A mopping-up operation was carried out against them according to the decision of the Secretariat, but in the process of issuing orders, mopping-up quotas were assigned to each unit due to competition for performance between officers, leading to indiscriminate arrests and detentions of locals. Although the directive was withdrawn in a week, we have certainly defeated the paramilitary organizations hindering us."
 RED_event.39.a: "Is that a good thing?"
 
 RED_instability_system.1.a: "This is a bug if you see it"
 
 RED_instability_system.2.t: "Instability of the Military Government"
 RED_instability_system.2.d: "The military government commander of [FROM.GetName] has informed us that citizens are starting to break away from the Military Government's control in the current military government system. As situations not only in [FROM.GetName] but in all other military governments are starting to get out of control, we must strive to solve the Military Government's problems."
 RED_instability_system.2.a: "This is serious."
 RED_instability_system_2_tt: "Check the §YEvents and Decisions§! tab."
 
 RED_instability_system.3.t: "Mass Protests"
 RED_instability_system.3.d: "Crowds are holding protests on the main streets of [ROOT.capital.GetName]."
 RED_instability_system.3.a: "We can do nothing."
 RED_instability_system.3.b: "Disperse the protesters."
 
 RED_instability_system.4.t: "Wave of Revolution"
 RED_instability_system.4.d: "We cannot know if it is a systematically planned protest or a resistance we failed to grasp. However, the only certain fact is that citizens are organizing their own armies, and a huge crowd of protesters is marching toward our administrative building.\n\nAs a result, it has been proven that the current military government system was built on oppressive rule, and we might be paying the price for it now."
 RED_instability_system.4.a: "Let's join the protesters. We will personally step forward and persuade them."
 RED_instability_system.4.b: "Everyone, prepare for combat."
 
 RED_instability_system.6.t: "[FROM.GetAdjective] Spring"
 RED_instability_system.6.d: "The Military Government established in the [FROM.GetAdjective] region has joined the large-scale protests and is demanding negotiations with the protesters from our government. The protesters and the former military government headquarters criticize the rule we have carried out so far as oppressive and demand the establishment of peaceful relations with local nations."
 RED_instability_system.6.a: "Suppress the rebellion."
 RED_instability_system.6.b: "Fine... fine, let's start over."
 
 RED_instability_system.61.t: "[FROM.GetName] Remains Silent"
 RED_instability_system.61.d: "We attempted to negotiate with [FROM.GetName], but the [FROM.GetName] side remains silent. The negotiation is judged to have failed, and now we must prepare for [FROM.GetName]'s invasion."
 RED_instability_system.61.a: "Mount the final resistance."
 
 RED_instability_system.62.t: "Economy Starting to be Controlled"
 RED_instability_system.62.d: "[FROM.GetName] allowed the establishment of an independent state in exchange for mobilizing our resources for economic projects. We will be economically dependent on [FROM.GetName] for a while, but we have achieved independence."
 RED_instability_system.62.a: "It has borne fruit."

 RED_military_government_occupation.1.t: "Occupation of Denmark"
 RED_military_government_occupation.2.t: "Occupation of Norway"
 RED_military_government_occupation.3.t: "Occupation of Sweden"
 RED_military_government_occupation.4.t: "Occupation of Finland"

 RED_military_government_occupation.1.desc: "The forces of the Red Winter Union Academy have mopped up all rebels and entered their capital. Through this military operation, the residents of the region will not be able to revolt against our rule for a while.\n\nWe must now think of a plan to govern the region that has come under our control."
 RED_military_government_occupation.1.a: "Re-establish the Military Government."
 RED_military_government_occupation.1.b: "Establish a puppet regime."
 RED_military_government_occupation.1.c: "Rule directly."
 RED_military_government_occupation.1.d: "Integrate into the Union Academy!"

 RED_minori_event.1.t: "Quick Response"
 RED_minori_event.1.d: "Minori was quite taken aback. She thought it was too early for a large-scale riot. However, citizens disappointed with the Social Democratic Labour Party or existing labor unions, which were somewhat lukewarm toward systemic oppression, radicalized and lent their strength to the syndicalist-leaning SAC. Since citizens were burning with the desire for regime subversion faster than the Labor Service Division expected, some radical factions within the SAC, which advocated direct action, independently attacked the military parade held on May Day. As this was not discussed with any organization beforehand, it was largely temporary and more than likely to be suppressed, but Minori had to make a decision as soon as she heard the news. Because she trusted the Labor Service Division members, she personally visited various regions leading them and urged them to march to Cherinograd. Thus, the sparks of revolution that could have been extinguished in an instant were able to lead to regime subversion with the joining of the Labor Service Division members."
 RED_minori_event.1.a: "We know the value of solidarity!"
 RED_minori_event.2.t: "Labor Service Division"
 RED_minori_event.2.d: "With a loud whistle, Yasumori Minori finally appeared and approached the Special Class, placing a megaphone close to her mouth.\n\n\"Greetings, comrades! We are currently in the midst of an anti-regime revolution against Cherino. I have come to make a deal with you.\"\n\n\"What deal?\"\n\nShigure looked at Minori suspiciously. Minori looked at Shigure briefly, then turned back to the Special Class and shouted.\n\n\"All of Cherino's oppression will end now! Under the condition that you comrades join the Anti-Cherino Revolutionary Front, we will rescue you from the Old School Building and provide a place for you in the Main Campus!\""
 RED_minori_event.2.a: "\"I don't care about anything else, I just want to be able to make drinks as I please.\""
 RED_minori_event.3.t: "Contingency"
 RED_minori_event.3.d: "The May Day resistance was not something planned by the Labor Service Division or the Social Democratic Labour Party. It was very accidental and spontaneous, caused by the spontaneity of the SAC and the masses. Nevertheless, while the Labor Service Division actively participated in follow-up actions and achieved the goal of overthrowing the government, the Swedish Social Democratic Labour Party continued long discussions in an emergency party meeting. As the victory leaned toward the citizens, they concluded that the Social Democratic Labour Party must actively participate in the revolutionary government to prevent the 'radicalization' of the revolutionary government, and they participated in forming the government along with the Labor Service Division and local labor unions."
 RED_minori_event.3.a: "Does guarding against radicalization correspond to anti-revolution?"
 RED_minori_event.4.t: "May Day Assembly"
 RED_minori_event.4.d: "Like any other May Day, this year's May Day in Red Winter was scheduled to conclude colored by a brilliant noon military parade and a cult of personality toward Cherino. However, the expressions of the crowds watching the parade in Cherinograd were firmer than ever, and they looked like they had resolved something.\n\nAs the cavalry marched down the main street and military vehicles followed in formation, a loud whistle suddenly sounded, and the crowds systematically seized military vehicles and attacked the parade column. Soldiers were flustered by the surprise attack and could not respond properly, and ordinary soldiers even joined the protesters.\n\nIn the meantime, police stations, stations, banks, and administrative buildings throughout Cherinograd were occupied one by one by the angry crowds, and the masses began to arm themselves by raiding armories.\n\nThe citizens of Cherinograd only confirmed in the evening that Renkawa Cherino and the Secretariat, who were nothing more than her henchmen, had fled hurriedly to the west, but they are rejoicing in the victory they achieved themselves."
 RED_minori_event.4.a: "It's a Revolution!"
 RED_minori_event.5.t: "Approaching Anti-Revolution"
 RED_minori_event.5.d: "Uneasy news is currently being heard in Red Winter. Renkawa Cherino and the Secretariat, who have the support of lower-level administrative bureaucrats and officers, are gathering forces for an anti-revolution in the west.\n\nSince they can attack us quickly with the help of the Military Government's military power, we must prepare for their attack."
 RED_minori_event.5.a: "Let's block them with steel-like solidarity!"
 RED_minori_event.5_tt: "§RDisband all units§!\n\n"
 RED_minori_event.6.t: "Suppressed Oslo Uprising"
 RED_minori_event.6.d: "Last May 1st was the time when heat burned most intensely in Oslo. City traffic was paralyzed, government buildings were set on fire, and banners and various flags were fluttering in the streets. However, when the Secretariat Guards reached Oslo, a large-scale suppression operation was implemented. The people of Oslo were indiscriminately oppressed, and the week-long resistance that took place in factories, residences, and universities was all trampled, leaving many casualties. Although small street guerrilla units and rural partisans are continuing the resistance, we will have to move ourselves to liberate the people of Oslo."
 RED_minori_event.6.a: "Overthrow Cherino!"
 RED_minori_event.7.t: "Revolutionary Defense Front"
 RED_minori_event.7.d: "Some who were active in the Red Winter regular army joined our cause and deserted. We have been able to secure military assets to finally oppose the enemy's offensive by gathering and training them. The Revolutionary Defense Front is now entering a state of armament in connection with the Regional Soldiers' Council and the Workers' and Peasants' Red Army."
 RED_minori_event.7.a: "Crush the anti-revolution!"
 RED_minori_event.8.t: "Factory Committees"
 RED_minori_event.8.d: "Because Secretariat bureaucrats and capitalists have withdrawn in large numbers throughout Sweden, many workers and unions who went on strike are operating businesses by organizing factory committees themselves. The revolutionary government released a commentary saying it supports such a phenomenon and stated it would support and encourage it."
 RED_minori_event.8.a: "To the workplaces!"

 RED_minori_event.11.t: "Glory of Facing the Highest Authority"
 RED_minori_event.11.d: "The Secretariat and the Guards, who made Red Winter—once an academy of equality and liberation—practically operated by an oligarchy, and the reactionary Cherino who led all that, were arrested by a vigilante group composed of labor union members and students at a port in northern Norway. They were extradited to the capital Cherinograd as soon as they were arrested, and the Revolutionary Committee decided to refer Cherino to a 'People's Court' with the entire citizens of Cherinograd as the jury.\n\nA trial was held three days later, and Cherino had to proceed with the trial while being hit by stones thrown from the angry masses, without even getting a public defender, just as her other political rivals had. The public demanded her execution in a loud voice, citing that her crimes were extensive, large-scale, and serious. On the other hand, some intellectuals argued that her irrational rule stemmed from her own low intelligence, making labor reformatory punishment sufficient, and social democrats opposed it on the grounds that the death penalty is an outdated means of oppression. After deliberation, the Revolutionary Committee selected labor reformatory punishment and imprisonment as the two options and put them to a vote.\n\nAs a result, as she was sentenced to labor reformatory punishment, she was assigned to cleaning bathrooms and chores in the supply department within the Red Winter central campus. She will be able to reflect on herself properly by working diligently until she completes the 15-year release period."
 RED_minori_event.11.a: "This is the end of a dictator!"
 RED_minori_event.12.t: "Trotsky's Trial"
 RED_minori_event.12.d: "This week's Revolutionary Committee deliberation was unusually noisy, because of a Bolshevik named Leon Trotsky who was active as the Local People's Commissar in the Secretariat. Trotsky appeared to be a founding hero who was active in various fields in a place called the Soviet Union in the East, and it seems he joined the Secretariat while continuing his exile in Norway after being pushed out in an internal power struggle. Since Trotsky's track record was mostly opposing Cherino's authoritarian policies, even though he appeared to be participating in the anti-revolution, it was considered to be because he belonged to the Secretariat.\n\nIn particular, so-called 'Trotskyites', considered his supporters or followers, actively defended him and even claimed he should be recruited as a promising figure of the new government. They tried to actively interfere in the Revolutionary Committee's deliberations by organizing an 'International Workers' League', but the Revolutionary Committee, wary of this Bolshevik growing new power, concluded to 'expel' him, although it is quite controversial.\n\nAccording to the procedure, he will go into exile within a month, and local media reported that his likely destination will be Mexico."
 RED_minori_event.12.a: "A pity for the Trotskyites."
 RED_minori_event.12_tt: "§gHowever, the series of controversies surrounding Leon Trotsky were covered publicly by local media, and this is becoming an opportunity for many who belonged to the Secretariat or originally supported the Red Winter regime and radical students who want a strong socialist government to gather around the International Workers' League...§!"
 RED_minori_event.13.t: "Secretariat Practitioner"
 RED_minori_event.13.d: "Since Sashiro Tomoe, a practitioner of the Secretariat, has appropriate administrative capabilities, it is not desirable to imprison her. Therefore, the Revolutionary Committee gave her an opportunity to repent for her sins and serve the new revolutionary government. She moderately compromised and decided to take an administrative position in the form of labor reform, but Tomoe refused her position and requested to be assigned to the supply department where Cherino is."
 RED_minori_event.13.a: "The request was dismissed."
 RED_minori_event.14.t: "Victory in Denmark"
 RED_minori_event.14.d: "Our brave revolutionary army surprise attacked the Danish Military Government, which the Secretariat did not expect, and as their ranks collapsed miserably, we were able to bring down the Danish Military Government."
 RED_minori_event.14.a: "It's a victory!"
 RED_minori_event.15.t: "Liberation of the Old School Building"
 RED_minori_event.15.d: "The Old School Building is a structure symbolizing the oppression of the Cherino regime. Numerous anti-regime figures suffered while imprisoned in the Old School Building, but not anymore. Under a united rank, in the spirit of solidarity, we will rescue them."
 RED_minori_event.15.a: "Welcome, comrades!"
 RED_minori_event.16.t: "Leader of the Provisional Government"
 RED_minori_event.16.d: "Now that we have ended the Student Council President's oppressive politics, it is necessary to enact a constitution and organize a republic for the well-being of the Academy, local organizations, and the worker-peasant class. We must declare the Revolutionary Provisional Government, an interim body composed of a few union leaders, high-ranking party officials, leftist theorists, and students, and prepare for the constituent assembly.\n\nWe can elect a leader for the provisional government to reorganize the revolution and improve the people's economy. [RED_ernst_wigforss.getname], a revisionist Marxist economic theorist of the Social Democratic Labour Party, and [RED_minori.getname], the head of the Labor Service Division, were mentioned as major candidates."
 RED_minori_event.16.a: "The people's livelihood economy is the priority."
 RED_minori_event.16.b: "A determined leader is needed."
 RED_minori_event.16.c: "Let's just adopt a collective leadership system."
 RED_minori_event.17.t: "Scandinavian Social Democratic Union"
 RED_minori_event.17.d: "As the civil war ends and labor unionism, or syndicalist tendencies, are strongly advocated by translocators, the Social Democratic parties of the three Scandinavian countries (Swedish Social Democratic Labour Party, Norwegian Labour Party, Danish Social Democratic Party) found it necessary to rally their forces and create a solidarity body that is more left-leaning but blocks radicalism."
 RED_event.17.a: "Social democracy is truly for the workers."
 RED_minori_event.18.t: "Provisional Committee"
 RED_minori_event.18.d: "With the proclamation of the Revolutionary Provisional Government, the Provisional Committee has become a huge organization controlling industry, the people's livelihood, and the entire economy. The social democrats who were able to occupy key positions here will try to expand their influence around this organization."
 RED_minori_event.18.a: "Toward reconstruction!"
 RED_minori_event.19.t: "Revolutionary Committee"
 RED_minori_event.19.d: "In the revolutionary government, the Revolutionary Committee was the body in charge of the entire administration, led by students and left-wing radicals. However, as the importance of economic reconstruction was raised with the end of the civil war and the proclamation of the Revolutionary Provisional Government, their influence decreased significantly compared to during the civil war. However, they are still given the task of social transformation, and they are also overflowing with confidence to create a whirlwind of change in the middle of the transitional administration!"
 RED_minori_event.19.a: "Toward transformation!"
 RED_minori_event.19.b: "We must block any room for anti-revolution."
 RED_minori_event.20.t: "Formed Red Front"
 RED_minori_event.20.d: "Tens of thousands of people were gathered in the center of the Red Winter campus. Most were vigorously waving red flags, all to commemorate the formation of the Red Front.\n\nThe Red Front is a supra-partisan solidarity body with the organic integration of the [RED.GetCommunistParty] as its core, and in particular, as the 'Syndicalist Workers' Federation' (SAF), a national center that left the SAC in 1928 and became more left-radical, also participated in this body, syndicalist organizations nationwide have come to a total rally."
 RED_minori_event.20.a: "Long live the Syndicalist Republic!"
 RED_minori_event.21.t: "Independence of [FROM.getname]"
 RED_minori_event.21.d: "As the independence of [FROM.getname], which existed as a Military Government, is proclaimed, we must make a decision on whether to continue attacks on them. It is a clear fact that they were liberated from the Secretariat's oppression, but it is also true that the people will still be oppressed by bourgeois authoritarianism."
 RED_minori_event.21.a: "Let's attack them."
 RED_minori_event.21.b: "It's still premature."
 RED_minori_event.22.t: "Restoration of City Names"
 RED_minori_event.22.d: "For the idolization of Cherino and the Secretariat, the names of many regions currently follow place names derived from Cherino's name. As the revolution succeeded, we no longer need to follow these place names, and we will call them by the names locals originally called them."
 RED_minori_event.22.a: "The cult of personality is over!"
 RED_victorypoint_stockholm: "Stockholm"
 RED_victorypoint_yetebori: "Gothenburg"
 RED_victorypoint_udebala: "Uddevalla"
 RED_victorypoint_paloon: "Falun"

 RED_minori_event.23.t: "Labor Union General Assembly"
 RED_minori_event.23.d: "Since the inauguration of the provisional government, the demand for an immediate general election has been gradually increasing. Establishing a Labor Union General Assembly so that labor unions can influence our policies would not only be in line with syndicalist principles but also resolve such demands to some extent."
 RED_minori_event.23.a: "Toward a workers' government!"
 RED_minori_event.24.t: "Equality"
 RED_minori_event.24.d: "Capital continues its rule by dividing and alienating the masses from each other. Masses influenced by nationalism or chauvinism tear each other down and exclude each other even though they are fellow victims of exploitation and capital. Such things cannot be tolerated in a socialist society. Nationalism and chauvinism are merely instrumental ideologies to consolidate the power of the capitalist ruling class, just as medieval religion was. We very well understand that we must break this down and everyone in the human community must be treated inclusively and 'equally'.\n\nMany immigrants moving to Northern Europe come here mostly to avoid low-wage labor exploitation, for political exile, or to escape civil war or war. We must not exclude such people just because they are 'immigrants', employ them at low wages, or discriminate against them; we must recognize them as fellow members of the working class. All immigrants coming to Red Winter will be able to work freely in the future, be protected by Red Winter laws, and participate in and express opinions on Red Winter politics in general when they reside and work for more than a certain period."
 RED_minori_event.24.a: "We are different from capitalists."
 RED_minori_event.25.t: "Liberation"
 RED_minori_event.25.d: "Socialism in one country, claimed by a hypocrite called the 'Man of Steel', is a very wrong idea, a misunderstanding of socialism, and an error-filled approach. Revolution must not stop in any one country; it must be constantly spread and constantly repeated. We cannot and must not stop the revolution until all the masses in the world rule themselves—in other words, until they are 'liberated'. Naturally, we must overthrow all authoritarian, exploitative, capitalist, fascist, imperialist, despotic, and nationalist systems, including the Bolsheviks, and stand in solidarity with the people persecuted within them."
 RED_minori_event.25.a: "It's better to break the same chains together."
 RED_minori_event.26.t: "Invitation to Red Winter's Workers' International"
 RED_minori_event.26.d: "A socialist regime that recently took power in Red Winter has asked us for help to break its isolation. If an alliance is formed, a new comrade will be created to liberate the people of the world."
 RED_minori_event.26.a: "We become stronger through solidarity."
 RED_minori_event.26.b: "It's still early."
 RED_minori_event.27.t: "Labor Union Strike"
 RED_minori_event.27.d: "Workers have gone on strike demanding performance bonuses according to the remarkably developed economy."
 RED_minori_event.27.a: "Let's pay them bonuses."
 RED_minori_event.27.b: "Nonsense."
 RED_minori_event.28.t: "People's Recall System"
 RED_minori_event.28.d: "An elected official who was serving as mayor in a small town within Red Winter was recalled before the people due to an issue with his children's corruption. The people rebuked the elected official's corruption and passionately emphasized how anti-revolutionary and anti-socialist it was. Soon after, the residents referred the case of his impeachment to a popular vote, and the impeachment was passed in a vote held a week later as it exceeded 2/3 in favor."
 RED_minori_event.28.a: "This is direct democracy."
 RED_minori_event.29.t: "On the Path Called Struggle (1/2)"
 RED_minori_event.29.d: " Countless people swim through the sea called life and experience trials. They have clearly met waves. The strength and height of the waves will vary from person to person, but it is obvious that the waves have hit. Waves hit everyone. There is no one whom waves do not hit. However, the way each person deals with the waves is truly diverse.\n\n Just as the Chinese character for 'human' (人間) contains the character for 'between' (間), people are not alone. Humans experiencing trials often ask others for help. And similarly, people are often asked for help. Thus, in a world of mutual aid, an individual is both a client and a counselor.\n\n When clients come to them experiencing trials, many people advise them to 'endure' or 'accept' it. But another group of people is not like that. Those who shout to cast doubt on what they think is unfair, what they think is unjust, and what is considered natural—they are clearly distinguished from the former group. They are definitely 'revolutionaries'.\n\n When Christianity occupied cultural and intellectual hegemony and was considered truth by everyone, various intellectuals in the cities of Italy and the Hanseatic League stripped away the oppression of 'God' and placed humans on the cross. The theologians themselves also resisted the injustice and corruption of the established church, advocating for a reformed church. The story of a theologian from Germany writing a long list of 95 theses in total opposition to the church always gives us the courage to stand up.\n\n When they confirmed the back side of religion stripped away like this, revolutionaries saw ideological tools defending feudalism and absolute monarchy. The 'Divine Right of Kings', a hideous deal to justify labor exploitation by selling a non-existent God, was thoroughly denied by these intellectuals, and thus humanity entered modern society. This was all thanks to 'revolutionaries' who harbored doubts about what was natural and the 'masses' who followed them.\n\n There is a story of another German. When many people took it for granted to devote themselves to their nation—so nationalism was accepted as truth, and a world came where workers could 'freely' choose their occupations and contribute to society—there was a young man who just entered university and fell into philosophy. Thinking that nationalism justifies the rule of capitalists just as religion justified the rule of lords, the young man wrote a 'manifesto' and calmly shouted for socialism in the middle of Europe. Although no socialist revolution succeeded until he died, he is clearly a 'revolutionary' who strongly threw a question mark at capitalism, which everyone considered natural.\n\n People often say socialism is a failed idea. Some claim Marx presented the idea without considering human selfishness. But someone who knows Marx cannot say that. Marx revealed in 'Das Kapital' and 'Critique of the Gotha Programme' how exploitation occurs within the system of capitalism and how distribution should desirably take place in a future society. The fact that many criticisms of Marx are merely impressionistic seems to show how much socialism is isolated from our lives and thoughts, which is unfortunate."
 RED_minori_event.29.a: "..."
 RED_minori_event.30.t: "On the Path Called Struggle (2/2)"
 RED_minori_event.30.d: " Red Winter was reorganized into a Workers' Republic by the Red Front, a political organization led and formed by labor union leader Yasumori Minori and the Labor Service Division. They implemented experimental policies influenced by many other thinkers such as Proudhon, De Leon, Lenin, and Bakunin, including Marx. Everyone must have been anxious at first. Radical transformation might have felt like solving a Rubik's cube until society was twisted, contorted, and completely reorganized into something new. But they did it. In the middle of the 20th century, they succeeded in building a more progressive and democratic system than any other political force.\n\n And you were behind all this. Your decisions eventually made you face this text. When you chose the 'February General Strike' focus for some unknown reason, I don't think it was to lead the masses residing in Red Winter to liberation. You probably liked Minori or were suddenly drawn to an ultra-left route.\n\n But because you chose it, the masses acted. Like a famous scene from the renowned novel and musical 'Les Misérables', the citizens of Cherinograd attacked the army marching through the streets and raided armories to arm themselves and occupy various city facilities in time for the May Day assembly on May 1st. When Cherino and her henchmen gathered forces in Norway to try to extinguish the sparks of revolution, they stood resolutely against their wretched anti-revolutionary attempts. It was a bit radical, but there were inevitable sacrifices of Cherino and Marina to clearly process the remnants of the old era, city statues were demolished, and the names of cities were also changed.\n\n Of course, the masses after that must have troubled you with various demands. Sometimes the masses in general, sometimes unit-level suggestions from unions were reported to the Central Committee, and you would have struggled to process those requests in limited time. I hope you don't hate them for holding you back, or feel sad for not being able to complete a perfect revolutionary system because you couldn't fulfill many of their demands. By your choice, they lived in the most turbulent times of their lives and are those who experienced the strongest oppression and the most brilliant freedom at the same time in one life.\n\n When the blood shed by their families, friends, and comrades came back as the 'right to unionize', 'right to negotiate', and 'right to strike', when it was rewarded with the 'implementation of a 3-day work week', and when it was answered with 'public assistance and universal welfare', the 'masses'—regardless of workers, peasants, bureaucrats, soldiers, merchants, students, teachers, professors, women or men in charge of housework, and all other occupations—must have been certain of their happiness.\n\n I hope you who are reading this text don't take it too lightly just because it's in a mod of a game. Without talking about the Bolsheviks who abandoned Lenin's ideals or the People's Republic of China that turned to state capitalism, I simply want to say that socialism sets fire to our hearts. The fact that our blood sparkles red makes me think it's our instinct that stories like a dream of 'transformation' inspire us. Antonio Gramsci of the Italian Communist Party said, \"Pessimism of the intellect, optimism of the will.\" Our intellect remains in capitalism, but our will will clearly be in socialism.\n\n We learned 'equality', mutual equivalence, from the fact that the shape and size of waves hitting the sea of life differ for each person. We learned 'solidarity' from the fact that each of us is a client and counselor because we all experience trials. And from the acting masses of Red Winter, as well as just ordinary, but distantly brilliant general people who act, we learned 'the thinking of a revolutionary'.\n\n In swimming through the sea ahead, I hope you remain as a revolutionary when you disappear."
 RED_minori_event.30.a: "Thank you so much for playing!"
 RED_minori_event.30_tt: "I hope you and I can walk proudly and calmly on this path called struggle to a destination that might exist!\n§g- Wishing you red peace, from the modder §YAfterImage§!.§!"
 RED_minori_event.31.t: "Minori's Retirement"
 RED_minori_event.31.d: "Comrade Yasumori Minori, former head of the Red Winter Labor Service Division, protagonist of the May Revolution, political officer of the Revolutionary Military Council, and central member of the Republic's Standing Council, ended her term this month. Minori, who successfully finished her term amid the cheers of numerous people, showed high popularity with her approval rating reaching [RED.GetPartySupport]% just before retirement. To commemorate her heroic devotion to the people and society, the Central Committee transitioned the leadership system to collective leadership while leaving the position of Central Committee Chairperson vacant."
 RED_minori_event.31.a: "Good work, comrade!"
 RED_minori_event.32.t: "United Front"
 RED_minori_event.32.d: "The Social Democratic Labour Party has resolved to cooperate with us in the face of the threat of anti-revolution. Accordingly, the Anti-Cherino People's Front has been formed, which will allow us to exercise force with strong legitimacy throughout Sweden."
 RED_minori_event.32.a: "Let's move forward with steel-like solidarity!"
 RED_minori_event.33.t: "Redistribution"
 RED_minori_event.33.d: "As it secured administrative power of the city, the revolutionary government decided to distribute food assets belonging to Cherino and the Secretariat to the city for free. With this, the severity of the population saturation problem can be temporarily deferred."
 RED_minori_event.33.a: "That's a relief."
 RED_minori_event.34.t: "Securing Oslo"
 RED_minori_event.34.d: "As Oslo, where the Secretariat's temporary main office and the Norwegian Military Government headquarters are located, fell into our hands, we were finally able to achieve revenge for the last Oslo Uprising. Workers and political prisoners imprisoned in the city jail were released immediately, and some of the working masses spontaneously armed themselves and joined our ranks. We were also able to secure extra infantry equipment from the armory."
 RED_minori_event.34.a: "Good work, comrades!"
 RED_minori_event.35.t: "Formation of Revolutionary Government"
 RED_minori_event.35.d: "The May Day Revolution, direct action by the Swedish Central Workers' Organization that even the Labor Service Division did not grasp, was able to seize administrative power of the capital and overthrow the government along with the Labor Service Division's quick organizational alignment. Afterward, an organization to prepare for civil war was needed to organize such revolutionary movements, and a revolutionary government was composed of major labor unions, students, and politicians of local parties. They reorganized into the Provisional Committee in charge of local administration and the Revolutionary Committee that organizes and vanguards the revolution to efficiently prepare for the civil war situation. However, the Social Democratic Labour Party is exhausted by such unnegotiated situations, which has led to dissatisfaction with the leading forces of the revolution.\n\nThis eventually appeared as a conflict of opinion; the Provisional Committee takes the position of prioritizing the people's livelihood economy, while the Revolutionary Committee wants to overthrow the anti-revolution first. Deepening further, this difference of opinion led to the Provisional Committee's demand to stop requisitioning supplies from farms and focus on food production."
 RED_minori_event.35.a: "Prioritize food production."
 RED_minori_event.35.b: "Supply requisitioning must not stop!"
 RED_minori_event.36.t: "Thwarted Anti-Revolution"
 RED_minori_event.36.d: "High-ranking officers of the Military Government, realizing that further resistance is meaningless, finally made their own decision to change the Secretariat's regime. Cherino and Tomoe were extradited to Cherinograd as hostages for a temporary ceasefire. Although not all threats have been removed, we were forced to conclude the thwarting of the anti-revolution with a ceasefire due to the crumbling livelihoods and the strong backlash from the Provisional Committee."
 RED_minori_event.36.a: "It's a victory for the people!"
 RED_missions_char.1.t: "Public Demand - Implementation of 3-Day Work Week"
 RED_missions_char.1.d: "All working masses are demanding the implementation of a 3-day work week to guarantee a human life and enjoy full leisure. We need to quickly enact laws related to the 3-day work week."
 RED_missions_char.1.a: "Toward a human life!"
 RED_missions_char.2.t: "Public Demand - Failure"
 RED_missions_char.2.d: "We failed to satisfy the public's demand within the time limit. The public will withdraw their support for the current workers' cabinet."
 RED_missions_char.2.a: "Dammit."
 RED_public_mission_failed_over_5: "\nBecause §YPublic Demands§! have §Rfailed§! §Y6§! or more times, the public distrusts the regime even more."
 RED_public_mission_failed_over_2: "\nBecause §YPublic Demands§! have §Rfailed§! §Y3§! or more times, the public begins to distrust the regime in earnest."
 RED_missions_char.3.t: "Public Demand - Success"
 RED_missions_char.3.d: "We successfully satisfied the public's requests, and the new regime established in this land is being more trusted."
 RED_missions_char.3.a: "Socialism is firm here!"
 RED_missions_char.4.t: "Public Demand - Total Rearmament"
 RED_missions_char.4.d: "The recent shocking and radical expansionist policy of [TRM.getname] is making the masses demand rearmament from us. Since Trinity is a country of a reactionary far-right clerical fascist oligarchy, it must inevitably be overthrown, and a revolutionary war with them must be planned as a people's liberation war to liberate the oppressed and exploited Trinity people."
 RED_missions_char.4.a: "Let's crush the fascists!"
 RED_missions_char.5.t: "Public Demand - Industrialization"
 RED_missions_char.5.d: "According to the historical development theory of the early theorist Marx, the superstructure is most influenced by the substructure—that is, the forces of production and relations of production. To put it differently, the best way to maintain socialism is to move toward a system with the most radical and advanced forces of production and relations of production. We will showcase a new era of industrialization to the world that has radical yet democratic simultaneity, unlike other 'National Socialists'!"
 RED_missions_char.5.a: "All efforts into the struggle for achieving maximum productivity!"
 RED_missions_char.6.t: "Public Demand - Withdrawal from Kivotos Cooperation Organization"
 RED_missions_char.6.d: "Currently, the Kivotos Cooperation Organization is nothing more than an 'anti-revolutionary international organization' for the maintenance of the systems of capitalists, dictators, and feudal lords. We must not stay still against such deception toward the working masses. We must protect our revolution and create an independent socialist system with resolute opposition and firm ranks."
 RED_missions_char.6.a: "There is no compromise!"
 RED_missions_char.7.t: "Public Demand - Field Hospital Support"
 RED_missions_char.7.d: "As a soldiers' union was established, the clamoring demands of soldiers serving on the front were reported to the Central Committee. Soldiers are requesting more guarantee for their right to survival on the front. We will be able to include field hospitals in our templates for them."
 RED_missions_char.7.a: "Transformation continues even in the military!"
 RED_missions_char.8.t: "Public Demand - Dissolution of the Revolutionary Military Council"
 RED_missions_char.8.d: "'Red Bonapartism' refers to a transitional military administrative body in the civil war stage seizing the hegemony of political power. Military power-holders can never have working-class character from a class-based perspective. They are very likely to show pro-ruling-interest behavior, so we must quickly dissolve them and reorganize them into a soldiers' union to restore the revolutionary character of our military organization."
 RED_missions_char.8.a: "Let them practice service for the people."
 RED_missions_char.9.t: "Public Demand - Social Stabilization"
 RED_missions_char.9.d: "The office workers' union requested 5 major policies and 15 detailed guidelines to improve the lives of the masses after the establishment of the socialist bureaucratic system, which are: securing public order, securing safety in living, securing bureaucratic stability, a reliable and trustworthy welfare system, and guaranteeing periodic political participation. By implementing these, the office workers' union is confident that the revolutionary regime will be able to seize clear ideological hegemony in the world-scale system competition."
 RED_missions_char.9.a: "Toward the welfare and well-being of the people!"
 RED_missions_char.10.t: "Public Demand - Infrastructure Expansion"
 RED_missions_char.10.d: "To rebuild the land devastated by the civil war, the construction union ordered the Central Committee to expand infrastructure. We might be able to allocate an additional budget by referring to their requirements in the economic development plan."
 RED_missions_char.10.a: "Railroads are the lifeblood of industry!"
 RED_missions_char.11.t: "Public Demand - Formation of Military-Industrial Complex"
 RED_missions_char.11.d: "Recently, the defense industry union is showing its achievements in the defense industry and requesting the Central Committee to support qualitative expansion of business areas. A military-industrial complex will be an appropriate means to satisfy their demands, and military administration will be further improved through more direct military-industrial linkage."
 RED_missions_char.11.a: "Let's move toward innovation!"
 RED_missions_char.12.t: "Public Demand - Cultivating Heavy Chemical Industry"
 RED_missions_char.12.d: "The manufacturing union reported an interesting plan at this regular committee meeting. The plan, which claims that resource imbalances can be resolved and a self-sufficient economic system can be established by cultivating the heavy chemical industry through synthetic refineries, was adopted, and the Central Committee will support it."
 RED_missions_char.12.a: "Toward an independent economy!"
 RED_missions_char.13.t: "Public Demand - Scandinavian Integration"
 RED_missions_char.13.d: "As anti-revolutionary forces are crushed and all military governments installed by Cherino's orders are disbanded, we need to treat them as equals to our own people. We must not stop re-education and adaptation support so that they can open their hearts to us."
 RED_missions_char.13.a: "Liberty, Equality, Solidarity!"
 RED_missions_char.14.t: "Public Demand - Eastern Offensive"
 RED_missions_char.14.d: "The working masses are afraid that the revolution they achieved will be brought down by the anti-revolution of external forces. They argue that a 'pre-emptive revolutionary war' should be launched to break such intentions and seize a solid regional hegemony in the world so that the sparks of revolution do not go out. Popularly, Finland is agreed upon as the most suitable target for such a 'pre-emptive revolutionary war', and we deeply understand that the people of Finland are being oppressed by reactionary feudal White forces."
 RED_missions_char.14.a: "Let's crush the reactionaries!"
 RED_missions_char.15.t: "Public Demand - Defending [141.GetCapitalVictoryPointName]"
 RED_missions_char.15.d: "A war with [TRM.getname] has begun. The people have begun to arm themselves spontaneously, and regional defense committees are being summoned in each region to autonomously establish regional defense plans. The soldiers' union has begun to run campaigns to encourage conscription, and barricades have been built in every alley in villages near the front. The Central Committee has resolved to defend [141.GetCapitalVictoryPointName], where the campus for students is located, even if it means taking huge losses, and all the masses including workers, peasants, and students in the capital are united in organizing defense units themselves."
 RED_missions_char.15.a: "¡No pasarán! (They shall not pass!)"
 RED_missions_char.16.t: "Public Demand - Completion of the System"
 RED_missions_char.16.d: "As the wave of revolution subsides, people are returning to their respective workplaces to perform their duties. They know a new world has come, but they are afraid that the swirling changes will rather ruin their lives. We need to complete the establishment of the system to reassure them."
 RED_missions_char.16.a: "Speed up the transformation."
 RED_missions_char.17.t: "Public Demand - Industrial Restructuring"
 RED_missions_char.17.d: "We succeeded in overthrowing all capitalists and oppressors, but the outdated and anti-revolutionary relations of production have not yet been fully liquidated. We will complete radical industrial restructuring to organize a more progressive economic structure than any other nation."
 RED_missions_char.17.a: "Toward a syndicalist economy!"
 form_european_union_flag: "Completed §Y£GFX_decision_icon_small Realization of European Integration§!."
 RED_missions_char.18.t: "Public Demand - Liberation of Europe"
 RED_missions_char.18.d: "Hundreds of millions of people to our south are still suffering from oppressors in the European region! We have an obligation to bring liberation to them."
 RED_missions_char.18.a: "Long live People's Liberation!"

 RED_bop_event.1.t: "The Man with a Goatee"
 RED_bop_event.1.d: " Cherino reminisced.\n\n When the Secretariat was in disarray, Sashiro Tomoe of the Secretariat searched for a local advisor to help settle the situation.\n\n \"General Secretary Comrade, there is a socialist theorist called 'Leon Trotsky', and I have brought him as a local advisor.\"\n\n Trotsky handed a handshake to Cherino with a smile, as if the students doing the socialist movement were commendable. Afterward, Trotsky taught Cherino and high-ranking Secretariat executives about socialist theory or policy advice."
 RED_bop_event.1.a: "Cherino was bored throughout the lecture."

 RED_revolution.1.t: "Reflection"
 RED_revolution.1.d: " Unlike usual, Yasumori Minori lived very busily for the last 2 months. It was because she had to build and repair dozens of collapsed local buildings and military facilities every day. After directing a large-scale construction site all day, Minori fell asleep quickly at home, soaked in fatigue.\n\n How many hours had passed? Minori had to wake up from her sleep in a quite unrefreshed state. This was because of the noise outside; the sound of whistles and horseshoes, cheers, shouts, screams, and bellows ringing all day long disturbed her sleep. Minori stepped out in a daze to strongly protest against those violating her general right to pursue happiness.\n\n\"Observe the labor laws! Oppressors, get out!\"\n\n Outside was noisier than she thought. Not only was the square filled, but smoke rose from every alley. Minori was momentarily ashamed of herself. Although she was busy with work, the local workers were being suppressed and exploited while she was neglecting them."
 RED_revolution.1.a: "Only those who move and practice are real workers!" 
 RED_revolution.2.t: "Joining of the Labor Service Division"
 RED_revolution.2.d: "At the strong demand of Yasumori Minori, the Labor Service Division entered some solidarity strikes in response to the local workers' strikes. The Secretariat condemned Yasumori Minori's anti-regime misdeeds, but no one wanted to see the Secretariat's commentary."
 RED_revolution.2.a: "The working class is national in itself!"
 RED_revolution.3.t: "Solidarity with the National Center"
 RED_revolution.3.d: " Even before the active participation of the Labor Service Division, partial sympathy strikes by local labor union federations in Norway, Denmark, and Sweden were spreading in the February General Strike. Yasumori Minori visited the leadership of various labor union federations to actively request participation in the strike and succeeded in getting answers that they would consider the request positively. However, Minori also met with small and large backlashes from national center officials regarding this.\n\n\"...But keep in mind. A strike is not a political means or a tool for transformation, but merely another dialogue for the purpose of negotiation and economic struggle. We will resolve to lift the strike as soon as parliamentary democracy is restored and economic goals are achieved.\"\n\n\"Why are the workers here so passive?!\"\n\n Nevertheless, there was an organization that actively sympathized with Minori's opinion, and that was the 'Swedish Workers' Central Organization' (SAC). As a national center with syndicalist tendencies, the SAC shared the importance of direct action and anti-capitalist struggle with Minori and expressed it would take a leading role in this dispute." 
 RED_revolution.3.a: "Transformative movements stem from active participation."
 RED_revolution.4.t: "1936 Resolution No. 5"
 RED_revolution.4.d: "Even if they have a transformative leadership, there is much controversy about whether the Labor Service Division itself is transformative. Judging from the fact that almost all buildings in Red Winter are built by the Labor Service Division and they even go out for external orders, the Labor Service Division is a construction cooperative larger than any other construction company. However, the fact that they themselves are dependent on wage labor and perpetual to capitalist commodity production—coupled with the fact that many Labor Service Division members actually participated in the division for economic motives—functions as an obstacle to having that transformative character take root in the entire organization. A strong organizational policy directing all members of the Red Winter Labor Service Division to participate in a unified and united struggle rank has been raised to the center for several weeks, and it is undergoing deliberation within the Labor Service Division."
 RED_revolution.4.a: "Resolved."
 RED_revolution.4_tt: "§g1. All Labor Service Division members resolve to participate in the general strike as participants in the transformative struggle.\n2. Individual negotiation and compromise by any subordinate organization are prohibited.\n3. Opportunism is resolutely rejected, and we will not disband until the goal is achieved.\n§!"
 RED_revolution.5.t: "Social Democratic Labour Party"
 RED_revolution.5.d: "The concept of a socialist party participating in elections appeared in the late 19th century, and the Swedish Social Democratic Labour Party is one of them. The current Social Democratic Labour Party, which underwent repeated moderation through the struggle for voting rights, tried to keep away from violence as much as possible, but their disarmament policy did nothing more than help a quick surrender to Red Winter. Fortunately, in that respect, the Social Democratic Labour Party was able to maintain its power to some extent. Their broad popular base is enough to trigger the politicization of the general strike. However, their moderation will limit their demands to the 'restoration of parliamentary justice', which is Minori's great concern."
 RED_revolution.5.a: "Are they just another group of capitalists?"
 RED_revolution.6.t: "Compromise"
 RED_revolution.6.d: "\"Our goal is solely the restoration of parliamentary justice.\"\n\n Minori accepted his handshake with a nod as if it couldn't be helped."
 RED_revolution.6.a: "Seeking solidarity and not fearing isolation."
 RED_revolution.7.t: "Recruitment"
 RED_revolution.7.d: "Aramaki Yakumo has been happy for the past few weeks. Yakumo was happy enough that the sound of the printing press, which she had heard so much she was sick of it, sounded like birds chirping in the morning, and the clanking of machinery sounded like the bells of a clock tower. \n\nBecause right now, the more Yakumo printed trivial conspiracies or agitation regarding [RED.GetLeader], the more money and pudding— No, wait, uh, what did Minori say— Ah, right, the more the liberation of the working class was getting closer.\n\nWhen Yakumo was leaning against the printing press humming and checking the condition of the printed matter, Minori, who was inspecting the publishing department nearby, greeted her. Yakumo responded with a wide smile.\n\n\"Yakumo! You look in a good mood! How's the printing status?\"\n\n\"It's very good. Many faithful comrades are 'buying' a lot.\"\n\n\"... Yakumo, I'm sure I told you not to sell those for money...\" Minori said with a serious face, holding her head. Yakumo showed a sheepish smile and was anyway listening to Minori explaining the advantages of \"denouncing this and that\" and \"guaranteeing anything.\" No, she didn't even listen. Yakumo was savoring the situation where money would overflow even if she only received 5 yen for each.\n\n\"If I had known this, I would have printed this more than some stupid manga,\" Yakumo thought."
 RED_revolution.7.a: "Heh. Heh. Heh."
