 RED_racing_sov.2.d: "We successfully invited [ROOT.getname] to the academy."
 RED_racing_sov.2.d_1: "[RED.getname] rescued [ROOT.getname] and evacuated them to the academy."
 

 RED_tro_event.1.t: "[SOV.getname]'s Attempt to Assassinate Trotsky!"
 RED_tro_event.1.d: " Regrettably, 'Leon Trotsky,' who is active as a local advisor to our academy, once led the Bolsheviks, the revolutionary force against capitalism, together with Vladimir Lenin, the founding hero of the Soviet Union, and occupied a center of Soviet politics. However, in the 1920s, Trotsky lost his power significantly by losing in a power struggle with Joseph Stalin, the current ruler of the Soviet Union, and is currently here for exile. Meanwhile, Stalin is continuously attempting to assassinate Trotsky by mobilizing Soviet intelligence facilities to solidify his position in the Soviet Union by removing Trotsky.\n\n We will not give Comrade Trotsky's life to the 'degenerated workers' state' and will surely protect his safety. "
 RED_tro_event.1.a: "Strengthen the guard!"
 RED_tro_event.1_tt: "\nCan §Gwin§! the §YSnake Game§! through focus §Y$RED_advance_security$§! or §Y$RED_all_power_to_redwinter$§!."

 RED_tro_event.2.t: "Death of Trotsky"
 RED_tro_event.2.d: "We couldn't protect Trotsky. Even so, his dedication will leave many legacies to the academy."
 RED_tro_event.2.a: "What do we do now?"
 RED_tro_event.3.t: "Cherino's Dissatisfaction"
 RED_tro_event.3.d: " \"Why on earth are you saying you'll stop building my statue?!\"\n\n Renkawa Cherino was displeased with Trotsky, who intended to avoid her idolization. However, as the Great Transfer situation was being settled, many officials in the Office were following Trotsky.\n\n \"What's important now is guaranteeing the lives of the masses and students, not idol worship by any means.\"\n\n Cherino wanted to kick Trotsky out right away, and knowing she couldn't win against him with logic, she looked at Tomoe, but even Tomoe stopped her, saying, \"You shouldn't do that, Cherino-chan.\"\n\n Cherino became very grumpy."
 RED_tro_event.3.a: "Maybe I'll open a book."
 RED_tro_event.4.t: "Knowledge Liberation Front"
 RED_tro_event.4.d: "Momiji Akizumi is a student belonging to the Knowledge Liberation Front and working as a librarian at the library. When Momiji was focusing on her librarian work as usual, Cherino suddenly appeared with several security committee members.\n\n \"H-huh, President Cherino? Why did you come here all of a sudden?\"\n\n \"You asked well! The reason I came here is—\"\n\n \"No, I can tell even if you don't say it. You came to confiscate our Knowledge Liberation Front's precious books, right?\"\n\n \"No, I didn't come to confiscate books—\"\n\n \"But not this book! I haven't even read it properly yet!\"\n\n \"Wait, so the reason I came here is not because of such a trivial book, but to gain knowledge!\"\n\n \"Pardon..? What kind of knowledge do you want to gain here?\"\n\n \"I have to gain more knowledge than that person called Trotsky who has been threatening my position in the academy recently. That person is very smart, so I can't win a verbal fight about communism!\"\n\n \"If it's that problem... I'll lend you a book then. If you're planning to learn communism, Karl Marx's 'Communist Manifesto' would be good as an introduction!\"\n\n Cherino returned to the Office with the book."
 RED_tro_event.4.a: "Wait, I don't understand a single thing in here?!"
 RED_tro_event.5.t: "Establishment of the Exile Committee"
 RED_tro_event.5.d: "Since Trotsky helped us solve our problems, the Great Comrade Cherino promised to help in the matter of finding new comrades' friends. This committee, quickly set up by Comrade Cherino's direct order, will safely bring Trotskyists from all over the world, who are persecuted by Stalinists following a contaminated revolutionary spirit, to Red Winter."
 RED_tro_event.5.a: "Now let's go save them."
 RED_tro_event.5_tt: "\n§gCan rescue them by dispatching agents to countries where Trotskyist figures have gone into exile.§!"
 RED_tro_event.6.t: "Naming the Autonomous Republic"
 RED_tro_event.6.d: " \"The name Autonomous Republic seems so uncool.\"\n\n Cherino grumbled to Tomoe. Tomoe laughed for a moment and then left to deliver the name of the autonomous republic Cherino wanted to an Office member."
 RED_tro_event.6.a: "This cannot possibly be accepted."
 RED_tro_event.6.b: "If it's Cherino's opinion..."
 RED_tro_event.7.t: "World Revolution"
 RED_tro_event.7.d: "We can't delay any longer. We have decided to spread the revolutionary ideals of socialism to the whole world. From the Pacific to the Atlantic, from Asia to Oceania, from the North Pole to the South Pole! - we will have the red flag fluttering on every hill and factory!"
 RED_tro_event.7.a: "Long live the World Revolution!"
 RED_tro_event.7_tt: "\n§gIf at war, debuffs will be converted to half-buffs.§!"
 RED_tro_event.8.t: "Treatment of the Office"
 RED_tro_event.8.d: "We cannot deal with Cherino and the remnants of her Office unless power superiority is clearly determined now. However, simply being a rival in a power struggle is not a reason to exclude them. Nevertheless, looking at Stalin's precedent, removing them doesn't seem to be harmful."
 RED_tro_event.8.a: "Leave appropriate authority to the Office, but supervise them."
 RED_tro_event.8.b: "Cut off the arms and legs of the Office."
 RED_tro_event.9.t: "Forced Deployment of Migrant Workers"
 RED_tro_event.9.d: "To achieve the goals of complex industrial plans, we need to bring in and deploy manpower from various regions. Migrant workers will now be deployed to various wide-area industrial plans, such as building planned cities or expanding industrial facilities."
 RED_tro_event.9.a: "That's a good idea."

 RED_generic.1.t: "Investment Request from [RED.getname]"
 RED_generic.1.d: "A request has come from [RED.getname] to purchase their 'Reconstruction Bonds.' After the period expires, we will be able to recover the investment along with interest."
 RED_generic.1.a: "It's a good deal."
 RED_generic.1.b: "We're busy right now."
 RED_generic.2.t: "Acceptance by [FROM.getname]"
 RED_generic.2.d: "The [FROM.getname] side has purchased our bonds."
 RED_generic.2.a: "Thank you."
 RED_generic.3.t: "Refusal by [FROM.getname]"
 RED_generic.3.d: "The [FROM.getname] side refused our request."
 RED_generic.3.a: "That's a shame."
 RED_generic.4.t: "Adjust Domestic Bond Purchase"
 RED_generic.4.d: "Domestic capitalists and small capitalists are trying to purchase bonds."
 RED_generic.4.a: "Let's only permit small purchases."
 RED_generic.4.b: "Let's regulate them appropriately."
 RED_generic.4.c: "Leave them to do as they please."
 RED_investment_tt_1: "Civilian Factories provided: §G+2§!"
 RED_investment_tt_2: "Civilian Factories provided: §G+4§!"
 RED_investment_tt_3: "Civilian Factories provided: §G+6§!"
 RED_generic.5.t: "Reconstruction Bond Expiration"
 RED_generic.5.d: "The bond term has expired. We can now repay it or extend the term."
 RED_generic.5.a: "Let's repay it."
 RED_generic.5.b: "Let's extend it."
 RED_generic.6.t: "Bond Repayment by [RED.getname]"
 RED_generic.6.d: "The [RED.getname] side repaid the bonds we bought along with interest."
 RED_generic.6.a: "Good."
 RED_generic.7.t: "Repayment Postponement by [RED.getname]"
 RED_generic.7.d: "The [RED.getname] side postponed the repayment of the bonds we bought."
 RED_generic.7.a: "Is this a scam?"
 RED_generic.8.t: "Repayment Refusal by [RED.getname]"
 RED_generic.8.d: "The [RED.getname] side has renounced the repayment of the bonds we purchased."
 RED_generic.8.a: "Dammit, it's a scam!"
 RED_generic.9.t: "Credit Rating Plummet!"
 RED_generic.9.d: "As we renounce bond repayments, our credit is bottoming out, causing fears of paralysis across finance, the economy, and industry. We desperately need 'extreme' and 'radical' policies to overcome this."
 RED_generic.9.a: "Dammit!"
 RED_generic.9_tt: "\nUnless the focus §YUnlimited Inflation§! or §YCurrency Suspension§! is completed within §Y60§! days, the economy will completely collapse!"
 RED_generic.10.t: "Reconstruction Bonds"
 RED_generic.10.d: "The Academy's situation is, 'quite literally', horrific. Due to population saturation, food shortages, consumer goods shortages, devastated industrial facilities, and administrative paralysis, it is very clear there are limits to rebuilding our self-sufficiency alone. Meanwhile, we also need to apply the principles of socialism flexibly. By rebuilding, nurturing, and developing domestic industry through external investment, we will be able to complete industrial independence.\n\n ...Paying it back is a problem for later, of course."
 RED_generic.10.a: "Toward Economic Reconstruction!"
 RED_generic.10_tt: "After §Y365§! days, we may have to pay §Rtwice§! the amount of §YCivilian Factories§! we were granted for §Y365§! days."
 RED_generic.11.t: "Local Technocrats"
 RED_generic.11.d: "It has been public and obvious since the Great Translocation that the Academy lacks the capacity to restore civilian industry on its own. Therefore, we need to restore the industrial base by flexibly applying some socialist principles and recruiting local technocrats, or even capitalists, as advisors."
 RED_generic.11.a: "It can't be helped."
 RED_generic.12.t: "Alternative Economy Policy"
 RED_generic.12.d: "Radical collectivization and nationalization are by no means the solution to the current situation. In this 'wartime' state of industry, alternative economic policies are needed. Literally, the 'Alternative Economy Policy' is a modification of original socialist economic policies by incorporating a large number of market-oriented elements, through which we will nurture small and medium-sized enterprises and build a solid infrastructure for the entire industry."
 RED_generic.12.a: "It's not revisionism, it's an emergency measure."
 RED_generic.12_tt: "\nThe goal of the §Y1st Alternative Economy Policy§! is to exceed §G40§! §YCivilian Factories§!."
 RED_generic.12_tt_1: "\nThe goal of the §Y2nd Alternative Economy Policy§! is to exceed §G80§! §YCivilian Factories§!."
 RED_generic.13.t: "Dissolution of the Defense Committee"
 RED_generic.13.d: "As an extension of the offensive toward Sweden, Denmark, and Norway, the '[RE4.Getname]', organized for the advance into the Finland region, has resolved to finally dissolve at [148.GetCapitalVictoryPointName] after months of resistance. This is the end of our adventure toward the Scandinavian region."
 RED_generic.13.a: "Good work, everyone."
 RED_generic.15.t: "Evaluation of the 1st AEP"
 RED_generic.15.d: "Dozens of People's Commissars and economic experts gathered in a medium-sized conference room. They were summoned to evaluate the results of the Alternative Economy Policy (AEP); local technocrats gave positive evaluations, while some Kivotos-affiliated members gave negative evaluations, creating a mixed atmosphere in the room.\n\nEven though the decision on how successful the AEP was could bring significant changes to our economic policy, opinions are not converging."
 RED_generic.15.a: "The AEP was a success!"
 RED_generic.15.c: "It's underwhelming, but we need to watch the progress further."
 RED_generic.15.b: "We must stop this crazy policy experiment!"
 RED_generic.15.a_tt: "Because §YCivilian Factories§! exceeded §G40§!, the §YAEP§! is successfully supported:"
 RED_generic.15.b_tt: "§gWe will transition the industrial structure to a planned economy.§!\n\nLocked focuses below §Y$RED_rearming_focus_1$§! and some §YIndustrial Focuses§! in other §YIndustrial Focus Branches§! are unlocked:\n\n "
 RED_generic.15.c_tt: "Because §YCivilian Factories§! are §R40§! or below, the public is skeptical of the §YAEP§!:"
 RED_throw_aep_away: "Transition from §YAEP§! to §YPlanned Economy§!"
 RED_generic.16.t: "Early Goal Achievement"
 RED_generic.16.d: "We have achieved the AEP goal early."
 RED_generic.16.a: "Impressive."
 RED_generic.18.t: "Foreign Policy"
 RED_generic.18.d: "While we were focusing on internal affairs, the world was changing rapidly. We must turn our eyes outward now."
 RED_generic.18.a: "Let's make the most pragmatic choice."
 RED_generic.18.b: "We must actively defend our sovereignty."
 RED_generic.19.t: "Industrial Planning"
 RED_generic.19.d: "Precisely planned industry operates much more efficiently than the market. The problem is that since the place we translocated to was originally a capitalist system, the implementation of such a planned economy must be carried out in parallel with a socialist system transition. Although administrative power is still lacking, we have established a 10-year plan with a very long-term perspective. In particular, we will not neglect the military industry to prepare for upcoming internal and external conflicts, and we intend for the fruits of economic development to be distributed in a pluralistic manner in the long run through balanced development. Furthermore, for complete economic independence, resource development plans also occupy hundreds of pages in the proposal."
 RED_generic.19.a: "The economy must be adjusted calmly."
 RED_generic.20.t: "Border Conflict Defeat"
 RED_generic.20.d: "We have lost the border conflict."
 RED_generic.20.a: "Dammit"
 RED_generic.20.b: "If we lost the conflict, let's win the war!"
 RED_generic.21.t: "Border Conflict Victory"
 RED_generic.21.d: "We have won the border conflict."
 RED_generic.21.a: "Good."
 RED_generic.22.t: "Support from [RED.getname]"
 RED_generic.22.d: "Support from [RED.getadjective] has arrived."
 RED_generic.22.a: "Thanks."
 RED_generic.23.t: "Proposal from [RED.getname]"
 RED_generic.23.d: "A proposal has arrived from Red Winter regarding the import of low-wage workers."
 RED_generic.23.a: "That's a good deal."
 RED_generic.23.b: "It feels like we're the ones losing out."
 RED_generic.24.d: "A proposal has arrived from Red Winter regarding the exchange of resources and technology."
 RED_generic.25.t: "What is the Military Government?"
 RED_generic.25.d: "The Military Government is a military administrative department established under the Secretariat after Red Winter underwent the Western Offensive into Norway and the Northern Offensive against the Swedish remnants following the Great Translocation. Although they formally obey the orders of the Secretariat, they exercise uncontrolled authority in their jurisdiction. However, now that the administrative system has collapsed, we will have to spend a lot of effort to control them.\n\nDue to the geographical distance from the Academy, the Military Government has limited material support, which has led to fierce democratic resistance from locals in their occupied areas. This expands as democratic support increases, and consequently leads to a rise in the Military Government's instability. If the instability of the Military Government becomes high enough, it will soon collapse, and the region will fall out of our Academy's control. Therefore, we need to suppress the democratic support rate in the Military Government.\n\nHowever, the Military Government's instability can be reduced through decisions using equipment and command power or focuses like '$RED_enlarge_secret_police$', '$RED_enemy_of_class$', and '$RED_welcome_immigrate$'. To finally resolve the Military Government, you can transition it into an Autonomous Republic through the focus '$RED_enticing_locals$' and then integrate it through '$RED_welcome_immigrate$', or annex it through '$RED_depress_locals$' and slowly assimilate it."
 RED_generic.25.a: "Alright, I fully understand!"

 RED_generic.26.t: "Direction of Industrialization in Military Jurisdictions"
 RED_generic.26.d: "We must achieve industrialization in the areas previously governed by the Military Government. However, since our administrative power is still lacking, we can support them so they can industrialize on their own by assisting local industries. On the other hand, if we adopt a top-down economic plan, we will be able to fully control the entire industry."
 RED_generic.26.a: "Let's utilize local industry."
 RED_generic.26.b: "We'll fill the administrative gap somehow!"
 RED_generic.27.t: "Lifting of the Wartime State"
 RED_generic.27.d: "The wartime state declared about two months ago required the Secretariat's control over almost all sectors of the Academy and the local area. This placed a burden of overwork on individual bureaucrats and was excessively consuming our administrative power. Now that the Western Offensive has concluded, the Secretariat, following General Secretary Cherino's proposal, has resolved to lift the wartime state, which will be the first measure in the administrative restoration project expected in the future."
 RED_generic.27.a: "No significant threats remain!"
 RED_generic.28.t: "Threat of a General Strike"
 RED_generic.28.d: "The Red Winter bureaucrats newly deployed to replace local bureaucrats and the Military Government are incompetent, inefficient, and exploitative. The center lacks the capacity to control them, and accordingly, the local labor movement is developing into broader industrial linkage and anti-regime movements rather than aiming for negotiation and economic struggle. It will be difficult to expect stable rule of the Academy without hastily dissolving them."
 RED_generic.28.a: "Let's compromise moderately with the union members."
 RED_generic.28.b: "Suppress them."

 RED_reading.1.t: "'The Communist Manifesto'"
 RED_reading.1.d: " 'A spectre is haunting Europe—the spectre of communism.'\n\n 'The Communist Manifesto', which begins with meaningful phrases about communism, is a pamphlet written by Karl Marx and Friedrich Engels in February 1848. As it says, 'The history of all hitherto existing society is the history of class struggles,' the 'Manifesto' reveals various root concepts of the ideology of 'communism' itself and contains analyses of it.\n\n \"Blast it. I don't understand a single thing!\"\n\n Cherino decided to visit Trotsky and ask questions. Trotsky explained the industrial society and Enlightenment that covered the 19th century and introduced the historical context to Cherino.\n\n \"That is how two classes emerged, and they are the Bourgeoisie and the Proletariat.\"\n\n 'The Communist Manifesto' explains that the principle of historical development is 'class struggle.' Class struggle is the confrontation between the ruling class and the ruled class, collectively referring to relationships like freemen and slaves, patricians and plebeians, lords and serfs. Among them, the two main classes of industrial society are the Proletariat and the Bourgeoisie. The Bourgeoisie class, in the capitalist society that grew rapidly after the Industrial Revolution, owns the means of production (factories, land, machinery, etc.) and has seized economic and political power. In other words, they are the ruling class. On the other hand, the Proletariat is the class that must survive by selling only their labor power and exists being exploited by the Bourgeoisie. The contradictions and confrontations between these two classes create inequality and economic crises inherent within the capitalist system, eventually suggesting the necessity of a social transition through a Proletarian revolution.\n\n \"Furthermore, Marx did not stop at analyzing society but also presented the tasks of communists.\"\n\n In this pamphlet, Marx emphasized that the 'abolition of private property' is the task of communists and emphasized that a transition to socialism without classes is their goal.\n\n \"My head still hurts, but I think I mostly get it!\""
 RED_reading.1.a: "'Proletarians of all countries, unite!'"
 RED_reading.2.t: "Which book should I read?"
 RED_reading.2.d: "Cherino decided to visit the Knowledge Liberation Front and pick a book."
 RED_reading.2.a: "A book by Marx"
 RED_reading.2_tt_marx: "\nThere are §Y[?RED_read_marx]§! books by §RKarl Marx§! left."
 RED_reading.2.b: "A book by Kautsky"
 RED_reading.2_tt_kautsky: "\nOptions appeared by reading §Yall§! of §RKarl Marx's§! books.\n\nThere are §Y[?RED_read_kautsky]§! books by §RKarl Kautsky§! left."
 RED_reading.2.c: "A book by Lenin"
 RED_reading.2_tt_lenin: "\nOptions appeared by reading §Yall§! of §RKarl Marx's§! books.\n\nThere are §Y[?RED_read_lenin]§! books by §RVladimir Lenin§! left."
 RED_reading.2.e: "A book by Luxembourg"
 RED_reading.2_tt_luxembourg: "\nOptions appeared by reading §Yall§! of §RKarl Marx's§! books.\n\nThere are §Y[?RED_read_luxembourg]§! books by §RRosa Luxemburg§! left."
 RED_reading.2.f: "A book by Trotsky"
 RED_reading.2_tt_trotsky: "\nOptions appeared by reading §Yall§! of §RVladimir Lenin's§! books.\n\nThere are §Y[?RED_read_trotsky]§! books by §RLeon Trotsky§! left."
 RED_reading.2.g: "A book by Bukharin"
 RED_reading.2_tt_bukharin: "\nOptions appeared by reading §Yall§! of §RVladimir Lenin's§! books.\n\nThere are §Y[?RED_read_bukharin]§! books by §RNikolai Bukharin§! left."
 RED_reading.2.h: "A book by Zinoviev"
 RED_reading.2_tt_zinoviev: "\nOptions appeared by reading §Yall§! of §RVladimir Lenin's§! books.\n\nThere are §Y[?RED_read_zinoviev]§! books by §RGrigory Zinoviev§! left."
 RED_reading.2.i: "A book by Stalin"
 RED_reading.2_tt_stalin: "\nOptions appeared by reading §Yall§! the books of at least one of §RLeon Trotsky§!, §RNikolai Bukharin§!, or §RGrigory Zinoviev§!.\n\nThere are §Y[?RED_read_stalin]§! books by §RJoseph Stalin§! left."
 RED_reading.2.j: "There are no options!"
 RED_reading.2_tt_no: "\nYou have read all the books currently available.\n\n...However, there might be a capable Marxist in §Y@ITA [ITA.getname]§!.\n\n§tLet's dispatch an operative to Italy!§!"
 RED_reading.2.k: "A book by Gramsci"
 RED_reading.2_tt_gramsci: "\nOptions appeared by reading §Yall§! other remaining books.\n\nThere are §Y[?RED_read_gramsci]§! books by §RAntonio Gramsci§! left.\n\n§gThis is the last reading session.§!"
 RED_reading.3.t: "'Das Kapital'"
 RED_reading.3.d: " Cherino needed great courage. The sheer thickness just looking at it, the aura of difficulty emanating from those three characters... for several seconds, Cherino could not control the repulsion felt throughout her body. But unfortunately, Momiji found Cherino in that state.\n\n \"Wow... are you planning to read the difficult 'Das Kapital' this time? That's truly amazing!\"\n\n Cherino thought her authority as Student Council President would be tarnished if she honestly said she didn't want to read it. So, Cherino had no choice but to hold that very thick book in her hands.\n\n Cherino couldn't take naps. Since the Knowledge Liberation Front's return deadline was 2 weeks, she would be banned if she read slowly like before. However, the more Cherino read, the more she realized it was even harder than 'The Communist Manifesto', so she again sought help from Leon Trotsky.\n\n Trotsky explained using the Bungeo-ppang sold at the Academy store as an example. \"Comrade, do you know why Bungeo-ppang is an item that must be bought with money?\"\n\n \"Because it's delicious?\"\n\n \"That is also true, but there is a more fundamental reason. It is because Bungeo-ppang is a commodity made by putting in labor. Marx thought that 'use-value' and 'exchange-value' determine the value of a commodity.\"\n\n Cherino nodded, but her expression was still complex. Trotsky explained again.\n\n \"What would happen if the number of people making Bungeo-ppang in the Academy decreased?\"\n\n \"Then the number of Bungeo-ppang would decrease, so the price would go up!\"\n\n \"Exactly! However, in capitalism, this value is not determined by the simple law of supply and demand. The 'socially necessary labor time' it takes for a worker to make a Bungeo-ppang also affects the value.\"\n\n Cherino crossed her arms and fell into thought. \"Then capitalists will try to make workers work faster to leave more profit?\"\n\n Trotsky smiled. \"Comrade, you are getting a great feel for this.\"\n\n Cherino was now curious about how capitalist exploitation takes place. Trotsky spoke kindly. \"Suppose a worker making Bungeo-ppang works 10 hours a day. However, in reality, if they work only 5 hours, the worker can create the wage value necessary for their own living.\"\n\n \"Then what about the remaining 5 hours...?\"\n\n \"That goes into the capitalist's pocket. This is called 'surplus value'.\"\n\n Cherino clenched her fist. \"This is unfair! The worker works more, but what they get remains the same!\"\n\n Trotsky nodded. \"That is why we started the revolution. When the workers themselves control the means of production, a truly equal society is possible.\"\n\n A few days later, Cherino introduced 'Das Kapital' to the Secretariat executives at a meeting, declared the 'Bungeo-ppang Revolution', and emphasized its necessity."
 RED_reading.3.a: "The Secretariat executives' heads began to throb."

 RED_marina_event.1.t: "Fatigued Marina - 1"
 RED_marina_event.1.d: "\"...\"\n\n\"...Comrade Security Director, wake up!\"\n\n Marina Ikekura, who was dozing off at the Secretariat regular meeting, woke up with a start. Secretariat Secretary Renkawa Cherino gave Marina a warning and continued the discussion on the agenda they were discussing earlier.\n\n When Marina was listening carefully again, an absurd opinion about recruiting a mascot called Peroro to the Academy was being presented by Cherino and supported by Chief of Staff Tomoe. Instead of opening her mouth to speak, Marina surrendered her body again to her blurring vision."
 RED_marina_event.1.a: "Shouldn't we suggest she take a rest?"
 RED_marina_event.2.t: "Fatigued Marina - 2"
 RED_marina_event.2.d: " \"My thoughts remain firm. I am truly grateful for Comrade Molotov's will to support Red Winter, but we can still do it ourselves.\"\n\n \"If your views change, contact us anytime. The Union is ready to welcome you with open arms.\"\n\n Marina, who returned to her quarters at 3 AM looking tired, went to sleep."
 RED_marina_event.2.a: "...I don't want to go to the meeting tomorrow."
 RED_marina_event.3.t: "Fatigued Marina - 3"
 RED_marina_event.3.d: " \"And so, the October Revolution spread into the Red-White Civil War. In that process, I personally took charge of organizing the Workers' and Peasants' Red Army... ...Thus, to guard against Bonapartism, the complete realization of popular power...\"\n\n An old man had come to the Secretariat and was giving a 'lecture'. Many Secretariat members listened to him, but Marina was inwardly anxious that the old man, rich in military and theoretical experience, might push her out of her position. The thought that Tomoe had certainly brought him in to oust her did not leave her mind. The old man's explanation couldn't possibly enter her mind filled with worries, but Marina seemed to catch glimpses of criticism against the authoritarian measures handled by the Security Committee."
 RED_marina_event.3.a: "Right, I think Comrade Molotov mentioned something about this man before?"
 RED_marina_event.4.t: "Ivan Kupala"
 RED_marina_event.4.d: "Ivan Kupala, the summer solstice festival of Red Winter, was held right on the lands of the Union Academy, which had become a wreck after the Great Translocation. Everyone is going through hard times, but today they forgot their labor and enjoyed the festival happily."
 RED_marina_event.4.a: "If you've enjoyed it, it's back to work."
 RED_marina_event.5.t: "Fatigued Marina - 4"
 RED_marina_event.5.d: " \"That is a shameful insult to the General Secretary and our Union Academy. I will act as if I didn't hear today's conversation.\"\n\n \"Well, that man's reckless revolutionary view and self-righteous administration will surely corrupt the revolution. The expulsion of that person, who stands at the center of all sorts of anti-Soviet conspiracies, must proceed even at the risk of force. If you truly head toward socialism, strike down that snake and look toward the shining great cause.\""
 RED_marina_event.5.a: "\"Let's not meet each other anymore beyond this.\""
 RED_marina_event.6.t: "Fatigued Marina - 5"
 RED_marina_event.6.d: " \"What is the problem with catching and interrogating someone who violated school rules?\"\n\n Marina asked back in a loud voice.\n\n Trotsky asked Marina to view the people not as objects of control but as subjects of mutual aid for the actual establishment of power for the masses, so that the dictatorship of the proletariat could be properly established.\n\n \"Dammit, you only present ideals, and you're arrogant as hell. If you received the support of the people that way, why did the Western Offensive fail? You yourself are incompetent...\"\n\n \"Comrade Marina, show respect to the Comrade Local People's Commissar!\"\n\n When that damn Tomoe cut her off, Marina left the conference room saying she wasn't feeling well."
 RED_marina_event.6.a: "'Tomoe is definitely plotting something.'"
 RED_marina_event.7.t: "Ivan Kupala"
 RED_marina_event.7.d: "Even though discussions to remove Cherino's statues as an anti-authoritarian measure were ongoing, several Cherino busts were still lined up in the Secretariat corridor. Marina was in a foul mood because Cherino seemed to depend on Trotsky. Marina, unable to focus on her walking due to stray thoughts, heard a dull sound coming from the floor.\n\n  \"Dammit, I broke the bust.\""
 RED_marina_event.7.a: "'...'"
 RED_marina_event.8.t: "Summer - 1"
 RED_marina_event.8.d: "The sun's rays cannot heat the entire territory of Red Winter, but people relax and enjoy the coziness of that warmth. Above all, because the festival is in full swing, students of the Union Academy and interested locals are crowding the streets, coloring the downtown with their own hues.\n\n \"But Comrade Director, if this decision fails, the Security Committee and the Guards might be completely disbanded by that fellow Trotsky.\"\n\n \"That gives even more weight to the justification for action! There is a huge force outside the Academy that wants Trotsky. Declaring a surging 'Military Revolution' that rose in resistance to Trotsky's capture, the coup, and oppression with the help of that force—nothing will shine brighter than our justice appealing to the great cause! Take pride, be resolute against injustice, and stand proudly in solidarity with what is right!\"\n\n The basement maintained silence for several seconds, then filled with the cheers and applause of the security members."
 RED_marina_event.8.a: "'The Miluo River is overflowing...'"
 RED_marina_event.9.t: "Summer - 2"
 RED_marina_event.9.d: "When the faint moonlight divided the world with darkness, the people of the city could not sleep easily. Rhythmic footsteps echoed through the streets, and citizens living around the government building heard dozens of gunshots. The People's Guard, organized spontaneously by the masses, could not know the situation at the center, and the military was also neutralized as the Secretariat Guards emergency arrested the Winter Army General Headquarters on charges of anti-revolution.\n\n Subsequently, at 6 AM, after about 10 minutes of gunfire inside the Secretariat, the invocation of martial law due to an emergency incident was announced throughout Cherinograd. The Security Committee organized the Wartime Judicial Commission under special law, and subsequently, warrants were issued for major executives within the Secretariat. A few hours later, Trotskyite Secretariat members and Sashiro Tomoe, who were hostile to the Security Committee, were caught, but the whereabouts of high-ranking executives including Cherino and Trotsky were unknown, and a large-scale search operation to find them proceeded until 11 AM.\n\n However, having only found out that they were not in Cherinograd, the Wartime Judicial Commission plenary session was summoned."
 RED_marina_event.9.a: "First, let's declare a Military Revolution."
 RED_wartime_judicial_commission: "Wartime Judicial Commission"
 RED_marina_event.10.t: "Summer - 3"
 RED_marina_event.10.d: "Occupying the Secretariat using the capital's Guards and Security Committee was successful, but we gained no control over the suburbs and local regions. The government has fallen, and a new government is being formed. In the power vacuum, there's no telling what might bloom...!"
 RED_marina_event.10.a: "Dammit, we hurried too much!"
 RED_marina_event.11.t: "Labor Service Division Uprising"
 RED_marina_event.11.d: "Due to the collapsed administration, anti-government forces have risen!"
 RED_marina_event.11.a: "Dammit!"
 RED_marina_event.12.t: "Knowledge Liberation Front Rising!"
 RED_marina_event.13.t: "Publishing Department Independence!"
 RED_marina_event.14.t: "Uprising in the Old School Building!"
 RED_marina_event.15.t: "Trotsky's Uprising!"
 RED_marina_event.16.t: "Sápmi Independence!"
 RED_marina_event.17.t: "Reconstructed Secretariat!"


 RED_event.1.t: "Ultimatum from [FROM.GetName]"
 RED_event.1.d: "An ultimatum has arrived from [FROM.GetName]. They want to take control of Gotland and state that they will not hesitate to go to war if we do not comply.\n\nWhat should we do?"
 RED_event.1.a: "Do as they demand"
 RED_event.1.b: "This is impossible"
 RED_event.2.t: "[FROM.GetName] Accepted Our Demand"
 RED_event.2.d: "[FROM.GetName] eventually gave in to our pressure and decided to hand over control of Gotland to us."
 RED_event.2.a: "They made a wise choice"
 RED_event.3.t: "[FROM.GetName] Refused Our Demand"
 RED_event.3.d: "[FROM.GetName] stated that they would defend Gotland to the end despite our threats."
 RED_event.3.a: "They made a foolish choice"
 RED_event.4.t: "Resolution of the Military Government System"
 RED_event.4.d: "The military government system established by the Red Winter Union Academy after the war was effective in local control, but we must resolve the issues of commanders colluding with rebels, corruption within the military, and continuously intensifying resistance.\n\nFor the future of the Union Academy, it will be an essential means to abolish the military government system, which does not fit the Academy's ideology, and furthermore, to integrate the entire Scandinavia with the Union Academy."
 RED_event.4.a: "Certainly, the military government must be abolished."
 RED_event.5.t: "Balance of Power within the Secretariat"
 RED_event.5.d: "Leon Trotsky, a Bolshevik revolutionary from Russia, is quickly gaining great popularity and support among students. Cherino's monolithic leadership is cracking, and Trotsky is approaching the center of power."
 RED_event.5.a: "This is unusual."
 RED_event.6.t: "Direction of the Publishing Department"
 RED_event.6.d: " \"Comrade Cherino's agenda merely pretends to care for the masses with hypocrisy, calling it 'freedom' while leaving it to 'laissez-faire' like bourgeois democrats, without properly preventing the spread of unverified rumors and posts of impure intent like the propaganda of external anti-revolutionary forces. I ask you to withdraw the agenda.\"\n\n Trotsky's resolute voice filled the conference room clearly.\n\n \"If you say that, there's also plenty of room to say that you, Trotsky, are showing symptoms of a petty-bourgeois infantile disorder, distorting and misleading my intentions because you're worried that the editorial department where many of your supporters work will be reduced and your own political standing will be lowered! It's clear that the reporting regulations and scale censorship guidelines of the editorial department have long since lost their purpose of 'maintaining revolutionary character'!\"\n\n Trotsky countered again, saying that Cherino was deviating from the public agenda and committing an ad hominem fallacy."
 RED_event.6.a: "Cherino's opinion prevailed."
 RED_event.6.b: "Trotsky received the support of the standing committee members."
 RED_edit_disagree: "Cherino won the argument."
 RED_edit_disagree_1: "Trotsky won the argument."
 RED_event.7.t: "[FROM.GetName] Seeking an Alliance"
 RED_event.7.d: "[FROM.GetName] has visited us saying they are seeking an alliance. They are waiting for our choice."
 RED_event.7.a: "Good. Let's be with them"
 RED_event.7.b: "No, it's not needed"
 RED_event.8.t: "[FROM.GetName] Accepted Our Proposal"
 RED_event.8.d: "They have accepted our proposal."
 RED_event.8.a: "Great"
 RED_event.9.t: "[FROM.GetName] Refused Our Proposal"
 RED_event.9.d: "They have refused our proposal."
 RED_event.9.a: "Regrettable"
 RED_event.10.t: "[RED.getname] Requesting Passage"
 RED_event.10.d: "Military access has been requested from [RED.getname]."
 RED_event.10.a: "It can't be helped."
 RED_event.10.b: "Refuse it."
 RED_event.11.t: "Non-Aggression Pact Proposal from [RED.getname]"
 RED_event.11.d: "A non-aggression pact has been proposed by [RED.getname]. This will be useful in the face of the approaching [SOV.GetAdjective]."
 RED_event.11.a: "A good proposal."
 RED_event.11.b: "We do not compromise with them."
 RED_event.12.t: "Acceptance from [FROM.getname]"
 RED_event.12.d: "[FROM.getname] has accepted our proposal."
 RED_event.12.a: "Perfect."
 RED_event.13.t: "Refusal from [FROM.getname]"
 RED_event.13.d: "[FROM.getname] has refused our proposal."
 RED_event.13.a: "I see."
 RED_event.14.t: "Fleeing Trotskyites!"
 RED_event.14.d: "When many intellectuals, bureaucrats, and activists in the Soviet Union who agree with Comrade Trotsky's cause heard that Trotsky was resuming activities in [RED.getname], they left the USSR and went into exile. If we are lucky, Comrade Cherino will be able to rally them."
 RED_event.14.a: "The tide is turning."
 
 RED_event.15_tt: "\nObtain the lowest effect National Spirit by not completing §Y[?RED_prepare]§! focuses below §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§!."
