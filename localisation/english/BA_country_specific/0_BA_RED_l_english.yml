 RED_snake_game_decision_desc: "Stalin and his Soviet Union have sought Trotsky's life even after ousting him from politics. To escape the threat, you will have to move like a 'snake'.\n\n§YTrotsky's Snake Game§! has begun. §YTrotsky's Snake Game§! is a game aimed at thwarting Stalin's assassination attempts and surviving. Most rules are the same as a normal snake game, but there are some differences. §YYellow§! represents the §YHead§!, and §GGreen§! represents the §YTail§!. If you get an §GApple§!, you can increase the §YTail§!. If the §YHead§! collides with the §YTail§! or §YWall§!, §YTrotsky§! will be §RAssassinated§! immediately. §RRed Squares§! are obstructions attempted by the Soviet Union to assassinate Trotsky. If you hit a §RRed Square§!, the §YTail§! will decrease. If the §YTail§! completely disappears, §YTrotsky§! will be §RAssassinated§!.\n\n"

