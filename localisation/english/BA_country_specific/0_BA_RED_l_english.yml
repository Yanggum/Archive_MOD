#Events
 RED_ending_event.1.t: "Day of Victory"
 RED_ending_event.1.d: "It was something that was bound to happen someday. The endless fragmentation of the Marxist camp, which began from the Second International, was brought to an end by [RED.getleader]. The flag of Red Winter has been hoisted at the Kremlin, and the sovereign entity called the Soviet Union no longer exists!"
 RED_ending_event.1.a: "The long ideological war has ended."
 RED_ending_event.2.t: "Returned Left Opposition"
 RED_ending_event.2.d: " Trotsky thought the people, tired of the oppressive exploitation under the Stalinist system, would welcome him. However, the reality was different.\n\n \"The anti-Soviet terrorist ruined the country!\"\n\n \"Get out, you snake!\"\n\n \"We denounce the oppressor!\"\n\n Anti-Trotskyist rallies were happening throughout the federation due to the political manipulation of faithful Stalinists, and it was becoming clear that the future of the Left Opposition would not be smooth."
 RED_ending_event.2.a: "Damn it."
 RED_ending_event.2_tt: "\n§RMust stop the spreading Stalinist sentiment!§!"
 RED_ending_event.3.t: "Stalinist Resistance"
 RED_ending_event.3.d: "The war was still being fought! Urban workers are trying to escape from our control by being unified under the anti-revolutionary ranks by Stalinist partisans, and Stalinist guerrilla units are continuously active in rural areas with collective farms as their bases!"
 RED_ending_event.3.a: "It's getting serious, isn't it?"
 RED_ending_event.3_tt: "\n§RMust stop the spreading Stalinist partisans!§!"
 RED_ending_event.4.t: "Revolutionary Trial"
 RED_ending_event.4.d: "The spark of revolution is something that ignites itself. The February Revolution led to the October Revolution and the Russian Civil War, and the ideological war came to an end as an extension of the suppression of the rebellion in Kronstadt. Successive different counter-revolutions were stopped, and the true revolution is from now on. We will purge numerous Stalinist bureaucrats and military who betrayed Leninism and the cause of revolution throughout society, and this will be carried out at each regional revolutionary court under the guidance of the Central Revolutionary Court formed in Leningrad."
 RED_ending_event.4.a: "Hold them strictly accountable for their sins!"
 RED_ending_event.5.t: "Leningrad Revolutionary Trial: Major Bureaucrats"
 RED_ending_event.5.d: "Number: No. 0004\nTitle: Bill of Indictment\nThis Counter-Revolutionary Act Prosecution Committee prosecutes the following matters.\n\n\nI. Targets of Prosecution    $SOV_iosif_stalin$, $SOV_lazar_kaganovich$, $SOV_vyacheslav_molotov$\nII. Main Charges   Counter-revolutionary conspiracy, illegal seizure of state and party power, betrayal of the working class\nIII. Decision         Demand the death penalty for these three.\n\nIV. Grounds for Prosecution\n\n1. Stalin and two others denied the principles of worker democracy presented by Comrade Lenin and transformed the Soviet into a bureaucratic oligarchic state. He removed internal party democracy and replaced the dictatorship of the proletariat with Stalin's personal dictatorship.\n - Monopolized the decisions of the Central Committee and ousted major party officials including Leon Trotsky for irrational reasons.\n - Operated economic policies solely for the reproduction of power rather than based on socialist theory, worsening the lives of workers and peasants.\n - Replaced the dictatorship of the proletariat with a bureaucratic group oligarchic dictatorship, destroying socialism.\n\n2. Joseph Stalin and the Center's forced collective agriculture policy stemmed from his own maintenance of power, thoroughly oppressed the peasant class, and caused great harm to socialist construction and social transformation.\n - As millions of workers and peasants died due to the great famine that occurred in Ukraine and the Volga region from 1932 to 1933 due to forced exploitation.\n - Enforced violent forced exploitation without inducing the revolutionary participation of peasants, regressing the socialist economy.\n\n3. The Center betrayed the international proletarian revolution by hindering the international communist movement and blocking the worldwide spread of the revolution.\n - Abandoned revolutionary opportunities in Germany, China, and Spain, and failed to defend the world revolution.\n - Betrayed Leninist principles by reducing the Soviet Union to an isolated socialist state."
 RED_ending_event.5.a: "Approved."
 RED_ending_event.6.t: "Leningrad Revolutionary Trial: NKVD"
 RED_ending_event.6.d: "Number: No. 0009\nTitle: Bill of Indictment\nThis Counter-Revolutionary Act Prosecution Committee prosecutes the following matters.\n\n\nI. Targets of Prosecution    All high-ranking officials of the NKVD\nII. Main Charges   Counter-revolutionary conspiracy, violation of the dictatorship of the proletariat, betrayal of the working class\nIII. Decision         Death penalty for some and dissolution of the NKVD \n\nIV. Grounds for Prosecution\n\n1. The NKVD implemented a counter-revolutionary reign of terror within the Soviet Union and was used as a tool to purge revolutionary elements of the party and state, destroying the dictatorship of the proletariat and committing counter-revolutionary terror.\n - Systematically slaughtered major party officials and labor movement leaders during the Great Purge.\n  - Arrested, tortured, and executed Bolshevik comrades who dedicated themselves to the revolution as counter-revolutionary elements.\n - Destroyed internal party democracy and fell into a secret police maintaining Stalin's individual dictatorship.\n\n2. The NKVD systematically oppressed the working class and peasants under Stalin's orders.\n - Arrested, executed, or detained millions of peasants who rejected the forced collectivization policy in labor camps.\n - Suppressed the expression of opinions within the people's Soviet system and established surveillance systems within factories.\n - Systematically blocked opportunities for the working class to exercise political influence in factories and agricultural collectives.\n\n3. The NKVD fabricated counter-revolutionary conspiracies and committed torture in the process of driving faithful comrades of the revolution as counter-revolutionaries.\n - Fabricated counter-revolutionary conspiracies and executed numerous party officials by falsifying evidence.\n - Committed torture, mental pressure, and threats to extract forced confessions from suspects.\n - Forced false testimony in trials such as the Moscow Trials and performed counter-revolutionary false propaganda.\n\n4. The NKVD also caused purges within international labor movements and the Comintern under Stalin's instructions, destroying the international communist movement.\n - Division of revolutionary movements by committing terror within communist organizations during the Spanish Civil War.\n - Abduction and assassination of communist revolutionaries active overseas.\n - Tarnished the reputation of Soviet communism in the international community and destroyed proletarian internationalism."
 RED_ending_event.6.a: "Approved."
 RED_ending_event.6.b: "Partially rejected."
 RED_ending_event.6_tt: "§gThe NKVD will temporarily maintain its organization and become an organized shield against Stalinist terrorist plots.§!"
 RED_ending_event.7.t: "Leningrad Revolutionary Trial: Red Army"
 RED_ending_event.7.d: "Number: No. 0013\nTitle: Bill of Indictment\nThis Counter-Revolutionary Act Prosecution Committee prosecutes the following matters.\n\n\nI. Targets of Prosecution    Counter-revolutionary staff of the Workers' and Peasants' Red Army\nII. Main Charges   Counter-revolutionary conspiracy, sympathy with Stalin in the ideological war\nIII. Decision         Removal from office for some \n\nIV. Grounds for Prosecution\n\n1. Although the Red Army should play a role in defending the workers' state and overthrowing the enemies of the revolution, some counter-revolutionary bureaucrats within the military made the military out of the control of the working class and damaged proletarian military principles.\n - Sympathy with the counter-revolutionary camp in the ideological war"
 RED_ending_event.7.a: "Approved."
 RED_ending_event.7_tt: "§gIt will take a long time for the Red Army to recover its professionalism, and many generals will sympathize with Stalinist resistance directly or indirectly with dissatisfaction.§!"
 RED_ending_event.8.t: "Leningrad Revolutionary Trial: Stalinist Terrorists"
 RED_ending_event.8.d: "Number: No. 0041\nTitle: Bill of Indictment\nThis Counter-Revolutionary Act Prosecution Committee prosecutes the following matters.\n\n\nI. Targets of Prosecution    Stalinist terrorist organizations and participants\nII. Main Charges   Counter-revolutionary terrorism, betrayal of the working class\nIII. Decision         Death penalty for leaders and labor reformatory sentences for some \n\nIV. Grounds for Prosecution\n\n1. Stalinist counter-revolutionary forces are committing armed attacks on the workers' state, hindering socialist construction, and organized an armed rebellion to overthrow the Soviet government.\n - Armed terrorist organizations in rural areas killing Soviet peasants and party officials\n - Organization of destruction activities targeting factories and administrative agencies in cities, proceeding with a conspiracy to overthrow the worker Soviet.\n - Execution of attempts to paralyze the function of the workers' state by attacking railways, communication facilities, etc."
 RED_ending_event.8.a: "Approved."
 RED_ending_event.9.t: "Dissolution of Prosecution Committee"
 RED_ending_event.9.d: "Extreme measures should be prescribed for extreme situations, but that's it. We took all minimal active and radical measures to maintain order, and because voices of concern about the Prosecution Committee's absolute power within the party were continuously piling up, the last revolutionary trial ended and the Prosecution Committee resolved to dissolve itself. Since no public organization has the right to prosecute counter-revolutionary acts anymore, the Revolutionary Court naturally lost its function, and the judges returned as judges of the judiciary."
 RED_ending_event.9.a: "Good work."
 RED_ending_event.10.t: "Reconstructed Vanguard Party"
 RED_ending_event.10.d: "As the bureaucratic 'purification' business was completed, the party became able to perform its vanguard function fully. There must be no more betrayal of the revolution and the people, and the vanguard party will become the leader, moving ahead to organize and lead the masses!"
 RED_ending_event.10.a: "Let's follow Leninism!"
 RED_ending_event.10_tt: "Can remove §Y$RED_stalinist_sentiments_1$§! through the §Y£GFX_decision_icon_small Abolish Bureaucracy§! decision."
 RED_ordinary_event.1.t: "Cherino Who Lost Her Moustache"
 RED_ordinary_event.1.d: "\"\""
 RED_ordinary_event.2.t: "Special Class 227"
 RED_ordinary_event.2.d: " \"Damn it, what is this mess!\"\n\n Amami Nodoka complained with a voice mixed with dissatisfaction. \"Well, they must be out of their minds with the Great Transfer, so the old school building will naturally be completely forgotten.\"\n\n Mayoi Shigure spoke. These two vaguely understood that the day they return to the main building would have been delayed 10 times more than before the Great Transfer. Fortunately, it became possible to procure supplies from a nearby local village, so the situation of the old building improved a bit.\n\n However, on a day when her sleep was not good due to a particularly bad nightmare, Nodoka found that the old building had been completely reconstructed in one day."
 RED_ordinary_event.2.a: "Damn it, what is all this?!"
 RED_ordinary_event.3.t: "Heating"
 RED_ordinary_event.3.d: " As much as the old school building was reconstructed, a lot of fuel was needed to maintain heating in the increased number of classrooms. Amami Nodoka was looking for things made of wood among the ruins of the devastated old school building to use as firewood.\n\n \"Ugh, this wooden pillar must be stuck deep in the ground. It won't come out no matter how much I pull!\"\n\n \"Really? I'll help you, so let's pull at the same time!\"\n\n Thanks to Shigure's help, Nodoka was barely able to pull out the wooden pillar that was stuck in the ground.\n\n \"Yikes!\"\n\n Just then, a water stream that looked to be dozens of meters high spurted out from the spot where the pillar was pulled out, and soon created a water puddle, no, a small lake.\n\n \"Damn it, my clothes are all wet. No luck today.\"\n\n\"No, Nodoka, look closely at this water. The smell of sulfur... This is a hot spring!\""
 RED_ordinary_event.3.a: "\"Hot spring?!\""
 RED_ordinary_event.4.t: "Hot Spring!"
 RED_ordinary_event.4.d: " \"Hmm. By the way, what should we do with this hot spring water? It's not particularly useful, and it's unlucky.\"\n\n \"A hot spring is useless? I can't tolerate those words!\"\n\n The Gehenna hot spring development department members and Megu Shimokura, who suddenly appeared, ignored Nodoka, who was asking how they arrived here in absurdity, and built a large-scale ryokan and hot spring in the blink of an eye and left."
 RED_ordinary_event.4.a: "\"What was that? It's like a storm!\""

 RED_racing_sov.1.t: "Failed to Track [ROOT.getname]"
 RED_racing_sov.1.d: "We tried to track [ROOT.getname] but unfortunately failed."
 RED_racing_sov.1.t_1: "[RED.getname]'s Failure to Track [ROOT.getname]"
 RED_racing_sov.1.d_1: "[RED.getname] tried to track [ROOT.getname] but failed."
 RED_racing_sov.1.a: "I see."
 RED_racing_sov.2.t: "Secured [ROOT.getname]"
