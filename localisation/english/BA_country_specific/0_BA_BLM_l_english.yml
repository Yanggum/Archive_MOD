# Events
 BLM_event.1.t: "Ominous Silence"
 BLM_event.1.d: "A strange silence hangs over the back alleys and shopping districts of Brittany. Tensions between the Helmet Gang and the Sukeban, who have kept to their own territories in an unspoken peace until now, are subtly rising, and an atmosphere like the calm before a storm envelops the city.\n\nAccording to rumors, conflicts over the Black Market's profits and control are intensifying, and a series of provocations and subtle warnings over recent weeks have further soured their relationship. Whispers are spreading in the dark that an invisible power struggle between the Helmet Gang and the Sukeban has begun.\n\nPeople are noticeably tense, watching their surroundings with wary eyes, and even places where they would normally drink together are being avoided. An anxiety that could explode at any moment spreads like thorns through the city, suggesting that even a small spark could now bring about a fatal conclusion."
 BLM_event.1.a: "Oh, this isn't good."
 BLM_event_1_tt: "§RThe Gang War is approaching.§!"

 BLM_event.2.t: "Gang War"
 BLM_event.2.d: "Brittany's independence movement has now been completely frustrated, and a new order dominated by powerful criminal groups from another world is taking deep root in this land. The Black Market, flourishing in secret, has established itself in the cities and ports of Brittany, where various smuggled and prohibited goods are freely traded. While various criminal organizations cooperate for the expansion and prosperity of this Black Market, this region has become a lawless land beyond the reach of law and justice.\n\nHowever, their uneasy peace did not last long. As the conflict between the Helmet Gang and the Sukeban gradually surfaced, the tension between the two sides reached a breaking point. In particular, an incident where a member of the Helmet Gang decapitated a key figure of the Sukeban caused a rift that could no longer be mended. This incident was interpreted as more than a simple murder, but as an overt provocation against the rival organization. With brutal retaliation expected, the nights of Brittany have begun to be stained with blood.\n\nNow, this land has transformed into a field of dark plots and power struggles, with a murderous aura hanging over the once quiet streets and back alleys. In a cycle of betrayal, clash, and revenge, Brittany is falling into further chaos, and no one can predict who will emerge as the victor at the end of this war."
 BLM_event.2.a: "The struggle has begun."

 BLM_event.3.t: "Fate"
 BLM_event.3.da: "The long fight between the Helmet Gang and the Sukeban, who clashed fiercely in the dark back alleys and underworld of Brittany, has finally come to an end. The Sukeban seized victory by utilizing their intelligence for agile strategies and rapid responses, dismantling the Helmet Gang's strongholds one by one. While the Helmet Gang's trained forces and systematic structure occasionally held the upper hand, they were ultimately powerless against the Sukeban's overwhelming numerical advantage and nimble information network.\n\nHowever, the Helmet Gang did not completely collapse. During the fierce fighting, key figures and remaining forces of the Helmet Gang abandoned their main strongholds and quickly moved to the outskirts of Brittany to establish a new base. While acknowledging their defeat, the Helmet Gang is catching its breath, vowing revenge against the Sukeban. Their power remains intact, and they are instead using this retreat as an opportunity for internal reorganization and strategic revision.\n\nThe Sukeban have come to dominate a significant portion of the Black Market and the underworld within Brittany, but the Helmet Gang is biding its time for a counterattack in its own way. As the unstable balance between the two sides heralds a new phase in the darkness of Brittany, their conflict will unfold in a more complex and unpredictable manner for some time."
 BLM_event.3.db: "The fierce battle between the Helmet Gang and the Sukeban that took place in the back alleys and underworld of Brittany has finally ended. Based on well-trained forces, a thorough organizational system, and precise strategies, the Helmet Gang pressured the Sukeban one by one to achieve victory. The Sukeban's information network and numerical advantage lost their power before the Helmet Gang's sophisticated tactics, and their main strongholds were captured by the Helmet Gang in sequence.\n\nAlthough the Sukeban resisted until the end, they crumbled before the Helmet Gang's overwhelming organizational power and could no longer maintain their influence in the underworld. Remaining forces quickly scattered to hide or surrender, and the Sukeban's main leadership fell into the hands of the Helmet Gang. However, the remnants of the Sukeban have not completely disappeared. Scattered Sukeban personnel have temporarily retreated to reorganize their forces and look toward the future.\n\nThe Helmet Gang has now completely taken control of Brittany's underworld and Black Market. With this, the Helmet Gang reigns as the ruler of the Brittany underworld, ready to perfectly control Brittany's dark world through a stronger organizational structure and an efficient system of rule. However, in a situation where remnants of the past could reappear at any time, the Helmet Gang will manage Brittany more carefully and thoroughly to protect their dominance."
 BLM_event.3.dc: "With the conflict between the Helmet Gang and the Sukeban not easily resolved, Brittany is falling deeper into chaos. The two forces are in a stalemate, unable to suppress each other, and in the meantime, Brittany independence groups have begun to slowly rebuild their strength.\n\nTaking advantage of this gap, the independence groups have quietly resumed activities on the outskirts, gathering support amidst the confusion. As a result, law and order are collapsing in Brittany, and as anarchy accelerates, the region is falling into even greater chaos."
 BLM_event.3.a: "The Sukeban won."
 BLM_event.3.b: "The Gang won."
 BLM_event.3.c: "The chaos is not over."

 BLM_event.4.t: "Start of Brittany Independence"
 BLM_event.4.d: "Beyond the horizon of Brittany, after a long wait, the spark called 'Revolution' has finally begun to burn again. Graffiti written in blood is left on the city walls, and a song that has become a symbol of resistance is spreading like a whispered low voice. People are quietly catching their breath, slowly but surely raising the anger that has been suppressed for so long.\n\nNow we must decide. The incompetent and violent oppressors who have encroached upon Brittany for the past few years no longer have the right to rule our land and lives. Those who have only filled their own bellies while closing their ears to the suffering of the nation are now nothing more than the last remnants that must be swept from this land. It is time to build a true Brittany state, for the people of Brittany, by the hands of the people of Brittany.\n\nHowever, that path will by no means be smooth. True independence is not completed by simply changing the flag. At the deepest roots of this land exists a structure of crime and corruption, centered around a massive criminal syndicate known as the Black Market. This organization, which has encroached upon the city's economy and information network like a cancer, has nurtured vigilantes and criminal groups like the Helmet Gang and Sukeban behind the scenes, accumulating profits at the cost of much blood.\n\nThe weapons and drugs traded underground, the smuggled goods and false information, and the cartel of fear and silence that made all of this possible—we must put an end to all of it. We do not have much time. Revolution demands speed, and opportunities do not come twice. If we hesitate at this moment, history will return once more to pain and humiliation.\n\nBrittany's dawn will open with blood. But that blood must belong to the oppressor, and at the end of that blood, the light of liberation must rise.\n\nNow, the mission before us is clear."
 BLM_event.4.a: "\"Rebuild Brittany. More thoroughly than anything else.\""

 BLM_event.5.t: "Declaration of Statehood Written in Blood"
 BLM_event.5.d: "Under the sky of Brittany, a true morning has finally arrived.\n\nThe will of a nation that rose through much blood, sweat, and despair has pushed away the long darkness, and the revolution has earned the right to be called by the word 'Victory.' A series of successful operations, the joining of internal collaborators, and a decisive split within the criminal organization allowed the revolutionary army to land a single finishing blow, which became the turning point to reverse the tide of war.\n\nOn the night the main passages of the Black Market were captured, the city wailed amidst red flames, and resistance met its end as even the headquarters of the Helmet Gang, who had come from another world, crumbled. The remnants of the Sukeban declared surrender, and the criminal alliance was disbanded. And upon those ruins, the Brittany Provisional Government read the Declaration of Independence."
 BLM_event.5.a: "\"We now, as the true masters of this land, declare a state for the people of Brittany, by the people of Brittany.\""

 BLM_event.6.t: "Broken Dawn"
 BLM_event.6.d: "The Brittany Revolution has ultimately remained an unfinished narrative. This great attempt, which began amidst countless sacrifices, resolve, and hushed resistance, has withered away after a struggle more fierce than ever. The revolutionary forces seemed to spark a counteroffensive by capturing several key strongholds of the Black Market, but they ultimately collapsed helplessly before the counterattack of the criminal alliance, which held the advantage in organizational power and funding.\n\nThe revolution failed. But it was not just a defeat in battle; it was hope being swallowed by darkness once again.\n\nBlack curtains descended once more across the streets, and the magnates of the Black Market began to seize control of Brittany in more subtle and thorough ways. People no longer resisted. No, the very word 'resistance' was forgotten, never to be uttered again.\n\nAnd so, Brittany became a land of silence once more."
 BLM_event.6.a: "Justice was defeated, independence remained a dream, and freedom was thoroughly trampled after demanding a heavy price."
 
 BLM_opposition.1.t: "Arius Student Asylum: Joumae Saori"
 BLM_opposition.1.d: "It has just been reported that remnants of Arius Branch School, leading a few who escaped along with Trinity's suppression of the Arius Branch, have entered our Black Market. She appears to have crossed the border to us after evading Trinity's pursuit several times.\n\nAccording to a direct meeting with our personnel, she seems to have crossed the river to escape Trinity's pursuit, and afterwards gathered students from the branch who were in similar situations to come here to the Black Market. She seems to have adapted easily to the Black Market environment."
 BLM_opposition.1.a: "After all, the places where criminals gather are always the same."
 
 BLM_opposition.2.t: "Arius Student Asylum: Imashino Misaki"
 BLM_opposition.2.d: "A short while ago, it was reported that a student who appears to be from Arius entered the Black Market. She was dressed neatly, but her behavior was suspicious. Following her revealed that she was a student from the branch school.\n\nOur personnel's impression after meeting her directly is that she seems to be a very self-deprecating individual, and she appears to have fled to escape Trinity's pursuit."
 BLM_opposition.2.a: "Arius Branch School, huh..."
 
 BLM_opposition.3.t: "Arius Student Asylum: Hakari Atsuko"
 BLM_opposition.3.d: "A student in quite a noticeable outfit has entered the Black Market. She seems to have been quickly discovered by us due to her unique attire and refined behavior.\n\nSurprisingly, a direct meeting with our personnel revealed she belongs to the Arius Branch School. She crossed Trinity's border, broke through the Alsace Mountains alone to the south, and appears to have returned this way by boat."
 BLM_opposition.3.a: "Her actions are tougher than her appearance suggests."
 
 BLM_opposition.4.t: "Arius Student Asylum: Tsuchinaga Hiyori"
 BLM_opposition.4.d: "A suspicious sister suddenly entered our Black Market and was caught asking around for information about the Arius Branch School. Upon investigation, she is a student of the Arius Branch School and seems to have recently escaped.\n\nAfter a few questions, she revealed her name to be Tsuchinaga Hiyori and informed us of the quite unusual method she used to escape Trinity."
 BLM_opposition.4.a: "She escaped from there by train?"
