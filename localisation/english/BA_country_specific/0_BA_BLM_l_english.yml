#이벤트
 BLM_event.1.t: "불온한 침묵"
 BLM_event.1.d: "브르타뉴의 뒷골목과 상점가에는 묘한 정적이 감돌고 있습니다. 이제껏 암묵적인 평화 속에서 각자의 영역을 지켜온 헬멧단과 스케반 간의 긴장이 미묘하게 높아지며, 마치 폭풍 전야와 같은 기운이 도시를 감싸고 있습니다.\n\n소문에 의하면, 양 조직이 블랙 마켓의 수익과 통제권을 둘러싸고 갈등이 점차 격화되고 있으며, 최근 몇 주간 드러난 일련의 도발과 교묘한 경고들이 이들의 관계를 더욱 악화시켰다고 합니다. 헬멧단과 스케반 간에 보이지 않는 권력 다툼이 시작된 것이 아니냐는 속삭임이 어둠 속에서 퍼지고 있습니다.\n\n사람들은 눈에 띄게 긴장한 눈빛으로 주변을 경계하며, 평소라면 어울려 술을 기울이던 장소에도 조심스럽게 발길을 돌립니다. 언제든 터질 듯한 불안감이 가시처럼 도시에 퍼지며, 이제 작은 불씨 하나가 치명적인 결말을 불러올 수 있음을 암시하고 있습니다."
 BLM_event.1.a: "이런, 좋지 않아."
 BLM_event_1_tt: "§R갱단 전쟁이 다가옵니다.§!"

 BLM_event.2.t: "갱단 전쟁"
 BLM_event.2.d: "브르타뉴의 독립운동은 이제 완전히 좌절되었으며, 이계에서 건너온 강력한 범죄 집단이 지배하는 새로운 질서가 이 땅에 깊이 뿌리내리고 있습니다. 브르타뉴의 도시와 항구에는 암암리에 흥성하는 블랙 마켓이 자리잡아, 각종 밀수품과 금지 물품이 자유롭게 거래되고 있습니다. 다양한 범죄 조직들이 이 블랙 마켓의 확산과 번영을 위해 서로 협력하는 가운데, 이 지역은 이제 법과 정의의 손길이 닿지 않는 무법천지가 되어버렸습니다.\n\n그러나 그들 간의 불안한 평화는 오래가지 않았습니다. 헬멧단과 스케반 사이의 갈등이 점차 수면 위로 드러나면서, 양측의 긴장은 한계점을 향해 치닫고 있었습니다. 특히, 헬멧단의 단원 중 한 명이 스케반의 주요 인사를 참수하는 사건이 발생하면서 두 세력 간의 균열은 더 이상 되돌릴 수 없는 수준에 이르렀습니다. 이 사건은 단순한 살해를 넘어 상대 조직에 대한 노골적인 도발로 해석되었고, 잔혹한 보복이 예상되는 가운데, 브르타뉴의 밤은 점차 피로 물들기 시작했습니다.\n\n이제 이 땅은 암중모색하는 음모와 세력 다툼의 장으로 변모하여, 조용하던 거리와 뒷골목에는 살벌한 기운이 감도는 중입니다. 배신과 충돌, 그리고 복수의 악순환 속에서 브르타뉴는 더욱 혼란에 휩싸이며, 과연 이 전쟁의 끝에서 누가 승자가 될 것인지 아무도 예측할 수 없는 상황입니다."
 BLM_event.2.a: "항쟁이 시작되었군."

 BLM_event.3.t: "운명"
 BLM_event.3.da: "브르타뉴의 어두운 뒷골목과 지하 세계에서 치열하게 맞붙던 헬멧단과 스케반 간의 긴 싸움이 마침내 막을 내렸습니다. 스케반은 정보력을 활용한 기민한 전략과 빠른 대응으로 헬멧단의 거점을 하나씩 무너뜨리며 승리를 거머쥐었습니다. 헬멧단의 훈련된 병력과 체계적인 구조가 일시적으로 우위를 점하기도 했으나, 스케반의 압도적인 수적 우위와 민첩한 정보망 앞에서는 결국 무력할 수밖에 없었습니다.\n\n그러나 헬멧단은 완전히 무너지지 않았습니다. 격전이 이어지는 동안 헬멧단의 주요 인물들과 잔여 세력은 주요 거점을 버리고 신속하게 브르타뉴 외곽 지역으로 이동하여 새로운 근거지를 마련했습니다. 헬멧단은 패배를 인정하면서도 스케반에 대한 복수를 다짐하며 잠시 숨을 고르고 있습니다. 이들의 힘은 여전히 건재하며, 오히려 이번 후퇴를 통해 내부 재정비와 전략 수정의 기회를 얻고 있습니다.\n\n스케반은 브르타뉴 내의 블랙 마켓과 지하 세계를 상당 부분 장악하게 되었으나, 헬멧단은 언제든 반격의 기회를 노리며 그들만의 방식으로 세력을 유지하고 있습니다. 브르타뉴의 어둠 속에서 양측의 불안정한 균형이 새로운 국면을 예고하며, 한동안 이들의 갈등은 더욱 복잡하고 예측 불가능한 양상으로 전개될 것입니다."
 BLM_event.3.db: "브르타뉴의 뒷골목과 지하 세계에서 벌어졌던 헬멧단과 스케반 간의 치열한 전투는 드디어 막을 내렸습니다. 헬멧단은 잘 훈련된 병력과 철저한 조직 체계, 그리고 치밀한 전략을 바탕으로 스케반을 하나하나 압박하며 승리를 거두었습니다. 스케반의 정보망과 수적 우위는 헬멧단의 정교한 전술 앞에 힘을 잃었으며, 주요 거점은 헬멧단에 의해 차례로 점령당했습니다.\n\n스케반은 끝까지 저항했지만, 헬멧단의 압도적인 조직력 앞에 무너져 더 이상 지하 세계에서의 영향력을 유지할 수 없었습니다. 잔여 세력은 빠르게 흩어져 숨거나 항복했으며, 스케반의 주요 지도부는 헬멧단의 손에 넘어갔습니다. 그러나 스케반의 잔존 세력들은 완전히 사라지지 않았습니다. 흩어진 스케반의 인원들은 잠시 후퇴하여 세력을 정비하며 미래를 기약하고 있습니다.\n\n헬멧단은 이제 브르타뉴의 지하 세계와 블랙 마켓을 완전히 장악하게 되었습니다. 이로써 헬멧단은 브르타뉴 암흑가의 지배자로 군림하며, 더 강력한 조직 구조와 효율적인 지배 체제를 통해 브르타뉴의 어두운 세계를 완벽히 통제할 준비를 마쳤습니다. 그러나 과거의 잔재들이 언제 다시 나타날지 모르는 상황에서, 헬멧단은 그들의 지배권을 지키기 위해 더욱 조심스럽고 철저하게 브르타뉴를 관리해 나갈 것입니다."
 BLM_event.3.dc: "헬멧단과 스케반의 갈등이 쉽게 해결되지 않으면서, 브르타뉴는 혼란에 더욱 깊이 빠져들고 있습니다. 두 세력은 서로를 제압하지 못한 채 교착 상태에 놓여 있으며, 그 사이에 브르타뉴 독립 단체들이 서서히 세력을 재건하기 시작했습니다.\n\n이 틈을 타 독립 단체는 외곽에서 조용히 활동을 재개하며, 혼란 속에서 지지층을 모으고 있습니다. 이로 인해 브르타뉴는 법과 질서가 무너지고 무정부 상태가 가속화되는 가운데, 더 큰 혼돈 속으로 빠져들고 있습니다."
 BLM_event.3.a: "스케반이 승리했다."
 BLM_event.3.b: "갱단이 승리했다."
 BLM_event.3.c: "혼란은 끝나지 않았다."

 BLM_event.4.t: "브르타뉴 독립 시작"
 BLM_event.4.d: "브르타뉴의 지평선 너머에서, 마침내 오랜 기다림 끝에 '혁명'이라 불리는 불꽃이 다시금 타오르기 시작했습니다. 거리의 벽에는 피로 쓴 낙서가 남겨지고, 저항의 상징이 된 노래가 낮은 목소리로 속삭여지듯 퍼지고 있습니다. 사람들은 조용히 숨을 고르며, 오래도록 억눌려온 분노를 천천히, 그러나 확실하게 끌어올리고 있습니다.\n\n이제 우리는 결단해야 합니다. 지난 몇년간 브르타뉴를 잠식해온 무능하고 폭력적인 압제자들, 그들은 더 이상 우리의 땅과 삶을 지배할 자격이 없습니다. 자신들의 배만 불리며 민족의 고통에는 귀를 닫아온 그들, 이제 그들은 이 땅에서 쓸어내려야 할 마지막 잔재일 뿐입니다. 우리는 브르타뉴인을 위한, 브르타뉴인의 손으로 세운, 진정한 브르타뉴의 국가를 건설할 때가 되었습니다.\n\n그러나 그 길은 결코 평탄하지 않을 것입니다. 진정한 독립은 단지 깃발을 바꾸는 것으로 완성되지 않습니다. 이 땅의 가장 깊은 뿌리에까지 박힌 범죄와 부패의 구조, 그 중심에는 블랙 마켓이라는 이름으로 알려진 거대한 범죄 신디케이트가 존재합니다. 마치 암세포처럼 도시의 경제와 정보망을 잠식해온 이 조직은, 헬멧단과 스케반 같은 자경단과 범죄 집단을 배후에서 키우며, 수많은 피를 대가로 이익을 축적해 왔습니다.\n\n지하에서 거래되는 무기와 마약, 밀수품과 허위 정보, 그리고 이 모든 것을 가능케 한 공포와 침묵의 카르텔. 그 모든 것에 종지부를 찍어야 합니다. 우리에게는 시간이 많지 않습니다. 혁명은 속도를 요구하고, 기회는 두 번 오지 않습니다. 지금 이 순간, 우리가 망설인다면 역사는 다시 고통과 굴욕으로 되돌아올 것입니다.\n\n브르타뉴의 새벽은 피로 열릴 것입니다. 하지만 그 피는 압제자의 것이어야 하며, 그 피의 끝에는 해방의 빛이 솟아올라야 합니다.\n\n이제 우리 앞에 놓인 사명은 명확합니다."
 BLM_event.4.a: "\"브르타뉴를 재건하라. 그 무엇보다 철저하게.\""

 BLM_event.5.t: "피로 쓴 건국 선언"
 BLM_event.5.d: "브르타뉴의 하늘 아래, 마침내 진정한 아침이 찾아왔습니다.\n\n수많은 피와 땀, 절망을 뚫고 일어난 민족의 의지가 오랜 어둠을 밀어내며, 혁명은 승리라는 두 글자로 불릴 자격을 얻게 되었습니다. 잇따른 작전의 성공과 내부 협력자들의 합류, 그리고 결정적인 순간에 이루어진 범죄 조직 내부의 분열은 혁명군에게 단 한 번의 결정타를 허용했고, 그것이 전세를 뒤집는 전환점이 되었습니다.\n\n블랙 마켓의 중심 통로가 점령되던 날 밤, 도시는 붉은 불길 속에서 울부짖었고, 이계에서 넘어온 헬멧단의 본거지마저 무너져 내리며 저항은 끝을 맞이했습니다. 스케반의 잔당은 항복을 선언했고, 범죄 연합은 해체되었습니다. 그리고 그 폐허 위에서, 브르타뉴 임시 정부는 건국 선언문을 낭독했습니다."
 BLM_event.5.a: "\"우리는 이제, 이 땅의 진정한 주인으로서, 브르타뉴인을 위한 브르타뉴인의 국가를 선언한다.\""

 BLM_event.6.t: "무너진 새벽"
 BLM_event.6.d: "브르타뉴의 혁명은 끝내 완성되지 못한 서사로 남게 되었습니다. 수많은 희생과 결의, 그리고 숨죽인 저항 속에서 시작된 이 위대한 시도는, 그 어느 때보다 치열한 투쟁 끝에 스러지고 말았습니다. 혁명 세력은 블랙 마켓의 핵심 거점을 몇 차례 점령하며 반격의 불씨를 지피는 듯했으나, 결국 조직력과 자금력에서 우위를 점한 범죄 연합의 반격 앞에 속수무책으로 무너졌습니다.\n\n혁명은 실패했습니다. 그러나 그것은 단지 싸움에서의 패배가 아니라, 희망이 다시 어둠에 잠식당한 것이었습니다.\n\n거리 곳곳엔 다시 검은 장막이 내려앉고, 블랙 마켓의 거물들은 더 교묘하고 철저한 방식으로 브르타뉴를 장악해가기 시작했습니다. 사람들은 이제 더 이상 반항하지 않았습니다. 아니, 반항이라는 단어 자체를 입 밖으로 꺼내는 일조차 잊혀졌습니다.\n\n그리고 그렇게, 브르타뉴는 다시 침묵의 땅이 되었습니다."
 BLM_event.6.a: "정의는 패배했고, 독립은 꿈으로 남았으며, 자유는 값비싼 대가를 요구한 끝에 철저히 짓밟혔습니다."
 
 BLM_opposition.1.t: "아리우스 학생 망명 : 조마에 사오리"
 BLM_opposition.1.d: "트리니티의 아리우스 분교 진압과 함께 탈출한 몇 명을 이끌고, 아리우스 분교의 잔당이 우리 블랙마켓에 들어온 사실이 방금 알려졌습니다. 그녀는 여러 차례 트리니티의 추격을 피해 국경을 넘어 우리에게 온 것으로 보입니다.\n\n그녀는 우리 측 인물이 직접 만나본 결과, 강을 넘어 트리니티의 추격을 피해 도주한 것으로 보이며, 이후 비슷한 처지의 분교 출신 학생들을 모아 이곳 블랙 마켓으로 온 것으로 보입니다. 그녀는 블랙 마켓의 환경에는 쉽게 적응한 것으로 보입니다."
 BLM_opposition.1.a: "결국 범죄자가 모이는 곳은 정해져 있으니까."
 
 BLM_opposition.2.t: "아리우스 학생 망명 : 이마시노 미사키"
 BLM_opposition.2.d: "조금 전, 아리우스 출신으로 보이는 학생이 한 명 블랙 마켓에 들어온 사실이 알려졌습니다. 그녀는 말끔한 복장을 하고 있으나, 행동이 수상하여 미행해 본 결과 분교 출신 학생인 걸 알아낼 수 있었습니다.\n\n우리 측 인물이 그녀를 직접 만나 본 소감은 상당히 자기 비관적인 인물인 것 같으며, 트리니티의 추격을 피해 도주한 것으로 보입니다."
 BLM_opposition.2.a: "아리우스 분교라..."
 
 BLM_opposition.3.t: "아리우스 학생 망명 : 하카리 아츠코"
 BLM_opposition.3.d: "상당히 눈에 띄는 복장을 한 학생이 한 명 블랙 마켓에 입장했습니다. 그녀는 독특한 복장과 고풍스러운 행동으로 인해 우리에게 빠르게 발견된 것으로 보입니다.\n\n의외로 우리 측 인물이 직접 만나본 결과 아리우스 분교 소속으로 보이며, 트리니티의 국경을 넘어 알자스 산맥을 홀로 돌파해 남하 후 배를 통해 이쪽으로 돌아온 것으로 보입니다."
 BLM_opposition.3.a: "외모와는 다르게 행동이 터프하군."
 
 BLM_opposition.4.t: "아리우스 학생 망명 : 츠치나가 히요리"
 BLM_opposition.4.d: "수상한 수녀가 갑자기 우리 블랙 마켓에 들어와서 아리우스 분교에 대한 정보를 캐묻고 다니는 걸 보고 잡아서 조사해 본 결과 그녀는 아리우스 분교의 학생이며 최근 탈출한 것으로 보입니다.\n\n몇 가지 질문이 오간 이후 그녀의 이름은 츠치나가 히요리이며 상당히 특이한 방법으로 트리니티를 탈출한 사실을 알려왔습니다."
 BLM_opposition.4.a: "거기서 열차를 타고 탈출했다고?"