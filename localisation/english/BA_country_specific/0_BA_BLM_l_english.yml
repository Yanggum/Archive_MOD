 BLM_gang_thugs_war_1: "Rising Tensions"
 BLM_gang_thugs_war_1_desc: "The discord between the Sukeban and the Helmet Gang has fostered more animosity within their temporary cooperation after the Great Migration. Amidst the actions of two groups infringing on each other's interests, a large-scale struggle is about to bloom."
 BLM_gang_thugs_war_2: "A Night of Gunfire"
 BLM_gang_thugs_war_2_desc: "The situation that unfolded after the Helmet Gang decapitated a Sukeban clearly points to an all-out war between the Sukeban and the Helmet Gang. The struggle has already begun, and we must now support the side that will prevail in the final moment."

 BLM_gang_thugs_war_thugs_side_1: "Activities of Kurihama Akemi"
 BLM_gang_thugs_war_thugs_side_1_desc: "Kurihama Akemi is a figure with the status of a 'Legendary Sukeban' among outlaws. She burns with a desire for revenge against the Helmet Gang, who caused her to be locked in the Correctional Bureau, and her activities will serve as a great advantage for the Sukeban."
 BLM_gang_thugs_war_thugs_side_1_end: "Appease Kurihama Akemi"
 BLM_gang_thugs_war_thugs_side_1_end_desc: "Since Kurihama Akemi's activities pose a potential threat to our Black Market, we must stop her from continuing to act on the side of the Sukeban."
