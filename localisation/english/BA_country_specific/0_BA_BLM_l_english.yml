# Focuses
 BLM_dawn_of_bretagne_port: "Dawn of the Brittany Port"
 BLM_dawn_of_bretagne_port_desc: "The ports of Brittany will now awaken from the darkness of dawn to be reborn as centers of crime. This place, where smugglers and criminal organizations gather, is preparing to gain international infamy."
 BLM_crime_division_of_labor: "Division of Criminal Labor"
 BLM_crime_division_of_labor_desc: "As criminal activities become more sophisticated, we will divide roles within the organization and build specialized systems. This will ensure experts are placed in each field, allowing crime to operate as efficiently as any industry."
 BLM_criminal_syndicate: "Syndicate Formation"
 BLM_criminal_syndicate_desc: "Small criminal organizations in Brittany will now unite into a single syndicate, cooperating for mutual benefit. This syndicate is preparing to integrate the management of all criminal activities, centralizing power and resources."
 BLM_smuggled_weapons_research: "Smuggled Weapons Research"
 BLM_smuggled_weapons_research_desc: "Research begins based on smuggled weapons, and the Black Market will strive to secure the latest weapon technology and military armament."
 BLM_smuggling_export_industry_expansion: "Expansion of Smuggling Export Industry"
 BLM_smuggling_export_industry_expansion_desc: "Brittany will adopt the smuggling export industry as its primary economic resource, preparing to maximize profits by systematically expanding smuggling networks."
 BLM_securing_drug_production_facilities: "Securing Drug Production Facilities"
 BLM_securing_drug_production_facilities_desc: "We will establish drug production facilities in the outskirts of Brittany to strengthen the international drug supply chain. Organizations are preparing to strictly protect these facilities and accelerate drug production."
 BLM_international_crime_port: "International Criminal Port"
 BLM_international_crime_port_desc: "The port of Brittany will soon establish itself as the center of European criminal networks. Various illegal trades, including drugs, weapons, and human trafficking, will thrive here."
 BLM_sicilian_mafia_cooperation: "Cooperation with the Sicilian Mafia"
 BLM_sicilian_mafia_cooperation_desc: "The Brittany Black Market will join hands with the Sicilian Mafia, seeking greater profits by participating in international criminal networks. This cooperation will double the organization's power."
 BLM_balkan_market_expansion: "Balkan Expansion"
 BLM_balkan_market_expansion_desc: "The Black Market plans to advance into the Balkan market to expand its influence. Through cooperation with the Balkan region, we will broaden the scope of smuggling and weapons trade, further strengthening the organization's power."
 BLM_kivotos_crime_sponsorship: "Kivotos Crime Sponsorship"
 BLM_kivotos_crime_sponsorship_desc: "Through sponsorship of crime in Kivotos, the Black Market will secure new funding sources and international solidarity. This will further solidify the organization's base of operations."
 BLM_second_market_domination: "Second Market Domination"
 BLM_second_market_domination_desc: "With the goal of dominating the Second Market, the Black Market is focusing on expanding its influence. We are preparing to broaden our economic influence by strengthening dominance over the black market as a whole."
 BLM_london_gang_contact: "London Gang Contact"
 BLM_london_gang_contact_desc: "Through contact with London gangs, the Black Market will strengthen its international network. We plan to secure more resources and expand our influence through this connection."
 BLM_atlantic_smuggling_route_establishment: "Establishing Atlantic Smuggling Routes"
 BLM_atlantic_smuggling_route_establishment_desc: "By establishing smuggling routes across the Atlantic, Brittany organizations will transport weapons and drugs to North America and Europe. This will prepare us to generate even greater economic profits."
 BLM_great_leap: "The Great Leap"
 BLM_great_leap_desc: "The Brittany Black Market is now preparing for a 'Great Leap' to advance the scale of the criminal industry to the next level. This will maximize the organization's economic and political influence."
 BLM_systematic_industrialization: "Systematic Industrialization"
 BLM_systematic_industrialization_desc: "Through systematic industrialization, the Brittany Black Market will operate criminal activities more efficiently. We are preparing to solidify the organization's power by building specialized systems and infrastructure."
 BLM_crime_enterprise: "Criminal Enterprise"
 BLM_crime_enterprise_desc: "The Brittany Black Market is now preparing to transform into a 'Criminal Enterprise.' By organizing crime into an industry, we will secure stable profits and continuous influence."
 BLM_international_crime_industry_alliance: "International Criminal Industry Alliance"
 BLM_international_crime_industry_alliance_desc: "By establishing an international criminal industry alliance, the Black Market will cooperate with criminal organizations worldwide. This will prepare us to generate massive profits by sharing global networks and resources."

 BLM_bretagne_independent_organization_and_start_of_war: "Declaration of the Brittany Struggle"
 BLM_bretagne_independent_organization_and_start_of_war_desc: "Nationalist militias in the Brittany region continue to be hostile toward us and grow in strength. For the interests of the Black Market, we must begin an all-out war against them."
 BLM_gang_thugs_domination: "Gangs, Sukeban, and the Ruler"
 BLM_gang_thugs_domination_desc: "Complete dominance over the Brittany region is near. The Black Market will now once again reveal itself to the world."
 BLM_sealing_conflicts_in_confusion: "Sealing Conflicts in Confusion"
 BLM_sealing_conflicts_in_confusion_desc: "Conflicts between the Sukeban and the Helmet Gang are intensifying, but all organizations agree that under current circumstances, they must join forces. Now, all organizations will temporarily cooperate for survival."
 BLM_gang_priority: "Helmet Gang Advantage"
 BLM_gang_priority_desc: "The Helmet Gang reigns as a sizable power in the underworld through well-trained personnel and a systematic organizational structure. We will support the Helmet Gang and effectively use the resources they possess."
 BLM_thugs_priority: "Sukeban Advantage"
 BLM_thugs_priority_desc: "The Sukeban show looser organization and a lack of training compared to the Helmet Gang, but they stand as a rival power through intelligence gathered from various academies and a large number of personnel. We will support them and utilize the power the Sukeban possess."
 BLM_organized_public_security_management: "Organized Public Security Management"
 BLM_organized_public_security_management_desc: "The Helmet Gang possesses excellent organizational skills, which are suitable for systematic and organized maintenance of public security. They will perform well in suppressing independence movements or riots by various petty criminals in the Brittany region."
 BLM_suppression_of_skeban_radicals: "Suppression of Sukeban Radicals"
 BLM_suppression_of_skeban_radicals_desc: "Due to their loose organizational structure, some Sukeban ignore agreements between major organizations and cause disturbances. We will suppress them to contribute to the stability of the Black Market."
 BLM_mimicking_of_bills: "Mimicking of Bills"
 BLM_mimicking_of_bills_desc: "Mimicking and utilizing bills from other countries is quite useful. We will expand our organizational structure by mimicking a systematically established judicial system."
 BLM_free_district_bretagne: "Free District Brittany"
 BLM_free_district_bretagne_desc: "The core of the Black Market, where Sukeban from all over Kivotos gather, lies in freedom. Sukeban, who engage in free activities without being bound by any school rules, are the most suitable for the Black Market culture."
 BLM_loose_zone_order: "Loose Zone Order"
 BLM_loose_zone_order_desc: "We are fundamentally a criminal organization; we don't need to maintain a systematic and tight social order like other countries!"
 BLM_free_skeban_spirit: "Free Sukeban Spirit"
 BLM_free_skeban_spirit_desc: "No other force can match the freedom of the Sukeban. We will develop this aspect to form an accessible organization and expand the scale of the Sukeban."
 BLM_organized_armament_strengthening: "Strengthening Organized Armament"
 BLM_organized_armament_strengthening_desc: "To respond to the threat of otherworldly transition, we must strengthen the armament of various organizations even if it means incurring losses. Under the secret agreement of the Black Market leaders, the strengthening of armaments has begun."
 BLM_return_of_seven_prisoners: "Return of the Seven Prisoners"
 BLM_return_of_seven_prisoners_desc: "Amidst the chaos of the GSC President's disappearance, the Seven Prisoners—idols to many outlaws—have escaped. By recruiting them, we can secure powerful military force and earn the loyalty of the organizations."
 BLM_bretagne_law: "Brittany Law"
 BLM_bretagne_law_desc: "In Brittany, one must now follow the law of the Black Market. Together with the Market Guard and the cooperation of various organizations, we can form a formidable lawless zone."

 BLM_gang_thugs_war_focus: "Gang War"
 BLM_gang_thugs_war_focus_desc: "Last night, an unfortunate incident occurred. The clash between the Sukeban and the Helmet Gang has become a reality, and their conflict will pose a threat to the Black Market. Quickly, we must decide on a direction."
