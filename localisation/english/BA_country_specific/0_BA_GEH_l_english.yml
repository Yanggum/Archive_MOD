 GEH_luxembourg_rules: "룩셈부르크 규정"
 GEH_luxembourg_rules_desc: "게헨나 학생들이 법률이나 규제에 익숙하지 않으며, '혼돈의 학원'이라 불릴 만큼 자유분방한 것은 유명합니다. 자신들끼리의 말다툼에 수류탄을 사용하는 것은 기본이고, 총기 난사는 거의 일상에 가까웠습니다. 문제는 이러한 삶이 키보토스에서는 문제가 되지 않았지만 지구에서는 큰 문제가 된다는 것입니다.\n\n대전이 직후 룩셈부르크에서 일어난 게헨나계 주도의 학살 사건은 선도부에게 큰 경각심을 일으켰습니다. 아마우 아코가 제안하고 소라사키 히나가 결정한 '룩셈부르크 규정'은 폭력에 익숙한 게헨나계에 의한 총기 범죄를 막기 위해 도입되었습니다.\n\n1. 모든 게헨나계와 현지인의 거주지를 분리한다.\n2. 모든 게헨나계 인구는 현지인 거주지에 출입하기 전 총기를 반납해야 한다.\n\n두 가지 항목으로 이루어진 이 룩셈부르크 규정은 대전이 직후 선도부가 질서를 유지하는 데에 큰 도움을 주었습니다. 하지만 모든 현지인 거주지를 보호하고 총기를 압류하기에는 부족한 행정력, 그리고 키보토스인들에게는 옷과 같은 일상품으로 취급되는 총을 임의로 압류하는 정책은 게헨나 학생들의 분노를 사고 있습니다. 정말 우리가 이 정책을 장기적으로 유지할 수 있을까요?"

 GEH_centre_of_culture_idea: "게헨나-바이에른 문화"
 GEH_centre_of_culture_idea_desc: "두 개의 세계에서 온 이질적인 문화의 융합은 키보토스계와 현지인 사이의 갈등을 줄이고, 서로가 서로를 더 깊이 이해할 수 있게 만들어주는 무기입니다." 

 GEH_cultural_revolution_idea: "전국가적 문화 전복"
 GEH_cultural_revolution_idea_desc: "두 개의 세계의 급진적인 충돌, 그리고 소라사키 히나의 실종은 모든 정치적-사회문화적 충격을 가져왔으며, 이는 모든 게헨나 예술, 문화, 질서, 전통에 대한 공격적인 전복 혁명을 불러왔습니다...." 

 GEH_artistic_ultraconservatism: "예술적 초보수주의"
 GEH_artistic_ultraconservatism_desc: "변화는 게헨나의 죽음을 부른다! 모든 변화를 거부하라, 더 이상의 변화는 없다! 게헨나와 독일의 순수 문화 만세! 문화 분리 만세!" 

 GEH_avant_garde_prelude: "아방가르드 기조"
 GEH_avant_garde_prelude_desc: "모든 문화를 전복시켜라! 새 시대의 문화 만세! 게헨나와 독일이라는 과거의 망령을 역사 속에 파묻어버려라! 위대한 혁명, 좋은 혁명!" 
 GEH_cultural_revolution_idea_tt: "우리가 어느 반역자를 공격했는지에 따라 §Y중점의 효과§!가 달라집니다.\n\n"

 GEH_prefect_team_culture: "도이치인과 우리의 관계"
 GEH_prefect_team_culture_desc: "대전이 이후 게헨나인들은 도이치인들로 이루어진 거대한 국가에 포위된 소수민족이 되었습니다. 비록 우리가 여전히 도이칠란트에 대한 주도적인 통치권을 행사하고 있다고는 하지만, 도이치인들에 의한 키보토스 전이자들의 차별을 막고 우리의 문화를 지켜나가기 위해 단호한 결정이 필요합니다.\n\n국방군을 비롯한 현지인 군사 세력의 영향력을 분쇄하고, 키보토스의 훨씬 자유로운 문화가 백년 이상 뒤쳐진 도이칠란트의 억압적 문화에 의해 억눌리지 않게 하는 것. 그것이야말로 새로운 세계에서 우리가 할 수 있는 적법한 '선도' 행위입니다."

 GEH_ogas: "오가스"
 GEH_ogas_desc: "우리 게헨나의 과학기술은 분명히 밀레니엄에 비해 부족합니다. 그렇기에 컴퓨터 통신을 이용해 국가가 모든 기업, 행정을 관리할 수 있게 하는 프로그램은 정교한 수준이 아니며 분명한 한계가 존재합니다.\n\n하지만 기계신이신 소라사키 히나의 영도와, 기초적인 우리의 컴퓨터 기술만으로도 게헨나 전국으로 퍼진 네트워크 통신망을 통해 기업체들과 행정부를 연결하고 실물 현금 대신 신용카드와 같은 전자화폐만을 사용하는 수준의 초보적인 자동화 경제 체제를 구축할 수 있을 것입니다.\n\n우리의 오가스 프로그램은 모든 행정의 전자화, 그리고 모든 기업과 행정부 사이를 전자통신으로 연결하여 기계신께서 경제를 직접 통제할 수 있도록 하는 것입니다."

 GEH_sorasakism: "소라사키 신앙"
 GEH_sorasakism_desc: "소라사키 히나를 현인신으로서 숭배하는 신이교주의 신앙입니다. 지역 가톨릭, 개신교 조직을 향한 매우 강경한 탄압과 함께 신자들의 히나에 대한 광신적 숭배가 뒤따릅니다."

 GEH_royal_guards: "친위부"
 GEH_royal_guards_desc: "아마우 아코가 이끄는 친위부는 소라사키 히나에 대한 숭배를 거부하는 반체제 세력을 포함하여, 국가의 안전에 해를 끼치는 사상범에 대한 사법권을 갖는 독립적인 군 조직입니다. 게헨나 정규군과는 지휘 체계가 분리되어 있으며, 명목상 기술관료 조직인 기획부의 관리를 받습니다.\n\n선임행정관 겸 친위부장인 아마우 아코의 냉정한 성격으로 인해, 친위부의 광기는 최소한의 수준으로 제어되고 있습니다. 히나는 아코를 친위부장으로 임명함으로서 자신의 광신도들이 필요 이상으로 날뛰지 못하도록 하고, 그들이 안전한 사냥개로 머무르도록 다른 부서들의 견제를 받게 합니다."

 GEH_denazification: "탈나치주의"
 GEH_denazification_desc: "[ROOT.GetAdjective] 내각은 비록 우익이나 좌익으로 구분지을 수 있는 정치적 성향을 가지고 있지 않지만, 한 가지 확실한 점은 '대전이' 이후 우리 체제가 '반나치'를 가장 중요한 가치로 내세웠다는 점입니다. 만마전이 국방군과 협력하려 하는 등 구 도이칠란트 나치 세력과 우호적인 관계를 맺은 것에 비해, 선도부 지도부는 국가사회주의 독일 노동자당(NSDAP)을 선도부가 추구하는 도덕과 질서에 맞지 않는 세력으로 간주했습니다.\n\n게헨나 선도부는 국방군 내지는 도이치 NSDAP 잔당과의 어떠한 협력, 교류도 거부한 채 적대적인 움직임을 보이고 있으며, 이러한 움직임은 도이칠란트 사회민주당, 반나치 성향의 예술인들에게 우리 정부가 지지를 받는 원동력이 되어 왔습니다. 소라사키 히나가 NSDAP를 '무질서, 부도덕'으로서 규정한 이상, 우리가 이러한 기조를 바꾸거나 완화하는 것은 지지자들에게 있어서 큰 배신으로 간주될 것입니다."

 GEH_denazification_victory: "탈나치주의 이상의 승리"
 GEH_denazification_victory_desc: "[ROOT.GetAdjective] 내각은 비록 우익이나 좌익으로 구분지을 수 있는 정치적 성향을 가지고 있지 않지만, 한 가지 확실한 점은 '대전이' 이후 우리 체제가 '반나치'를 가장 중요한 가치로 내세웠다는 점입니다. 만마전이 국방군과 협력하려 하는 등 구 도이칠란트 나치 세력과 우호적인 관계를 맺은 것에 비해, 선도부 지도부는 국가사회주의 독일 노동자당(NSDAP)을 선도부가 추구하는 도덕과 질서에 맞지 않는 세력으로 간주했습니다.\n\n우리는 국방군과 협력하는 판데모니움 소사이어티를  파괴함으로서 우리의 순수한 이상을 지켜내는 데 성공했습니다. 우리의 승리는 도이칠란트에 뿌리를 내리고 있던 검은 어둠을 몰아내는 큰 반환점이 될 것입니다."

 GEH_victory_trinity: "트리니티에서의 전훈"
 GEH_victory_trinity_desc: "에덴 결전에서 우리가 거둔 승리는, 우리의 장교들의 질적 수준을 크게 향상시키는 매우 중요한 경험이 되었습니다. 이 경험은 앞으로 한 세대에 걸쳐 [ROOT.GetName]의 군사 교리에 영향을 줄 것입니다."

 GEH_ako_no_hina_idea: "게헨나 국가자본주의"
 GEH_ako_no_hina_idea_desc: "게헨나계 기술관료들에 의하여 군수업부터 시작해 경공업, 중공업에 이르기까지 광범위한 국가자본주의 체제가 이루어지고 있습니다."

 GEH_human_right_law_iroha: "도이치인 임용 제한"
 GEH_human_right_law_iroha_desc: "키보토스와 같은 총기 난사와 폭력이 도이칠란트에는 없었을까요? 바이마르 공화국 후기 나치와 공산주의자들의 대립에서 볼 수 있듯, 도이칠란트인들은 내면의 폭력성을 잠재하고 있습니다.\n\n기업들에 도이치계 인구의 고용에 불이익을 주도록 강제하고, 공무원 임용에는 더욱 엄격한 제한을 가할 것입니다. 이러한 정책들은 도이치계 인구가 1차산업을 비롯해 전문적이지 못한 직업에만 머무르도록 강제할 것입니다."

 GEH_human_right_law_kayoko: "민권보장기구"
 GEH_human_right_law_kayoko_desc: "도이칠란트와 게헨나 두 민족의 갈등에도 불구하고, 우리는 서로가 이 땅에서 공존해야 한다는 것을 인정해야만 합니다. 각 기업, 공공기관 등에 키보토스계 상급자에 의한 도이치인에 대한 부당한 차별이 일어나지 않는지 감시하는 국영기구인 민권보장기구가 설립될 것입니다."

 GEH_military_tradition_1: "[ROOT.GetAdjective] 군사 전통"
 GEH_military_tradition_1_desc: "허례허식과 파티의 전통을 가지고 있는 판데모니움 소사이어티와 달리, 선도부는 오랜 군사적 전통과 역사를 가지고 있으며 실전에 단련되어 있습니다. 비록 이 군사적 전통과 역사를 비키보토스계 군인들에게 전달하는 것이 어려운 일이라 할지라도요."

 GEH_military_tradition_2: "[ROOT.GetAdjective] 군사 전통"
 GEH_military_tradition_2_desc: "허례허식과 파티의 전통을 가지고 있는 판데모니움 소사이어티와 달리, 선도부는 오랜 군사적 전통과 역사를 가지고 있으며 실전에 단련되어 있습니다. 비록 이 군사적 전통과 역사를 비키보토스계 군인들에게 전달하는 것이 어려운 일이라 할지라도요."

 GEH_military_tradition_3: "[ROOT.GetAdjective] 군사 전통"
 GEH_military_tradition_3_desc: "[ROOT.GetAdjective]는 오랜 군사적 전통과 역사를 가지고 있으며 실전에 단련되어 있습니다. 광범위한 군사적 개혁과 지속적인 군 명령 체계로 인해, 현재 우리 군은 비키보토스계 군인들과 키보토스계 군인들의 합동 작전에 익숙해졌습니다."

 GEH_gehenna_council_idea: "[ROOT.GetAdjective] 평의회"
 GEH_gehenna_council_idea_desc: "간선제로 의원들을 선출하는 평의회는 정상국가화를 진행하는 게헨나의 새로운 의회 조직이자, 법적으로는 1918년 바이마르 공화국 의회의 역사를 계승한다고 주장합니다. 평의회는 게헨나 통제민주주의의 상징이자, 게헨나가 소라사키 히나 한 사람의 독재 국가에서 과두제 국가로 변화하는 과정을 상징하는 조직입니다."

 GEH_gehenna_war_department_idea: "[ROOT.GetAdjective] 전쟁부"
 GEH_gehenna_war_department_idea_desc: "게헨나 학원의 광범위한 군사 작전과 대전략, 그리고 총체적인 작전계획을 통괄하는 합동참모본부로, 게헨나 학생군과 독일인으로 이루어진 군대, 그 외 수많은 통합된 하위 조직들을 지휘하며 게헨나 학원의 실질적인 군수 통수권이자 대전쟁을 준비하는 거대한 조직입니다."

 GEH_intelligence_reform: "방첩 개혁"
 GEH_intelligence_reform_desc: "게헨나 정보부는 이제 외부에 대한 방첩 권한만을 가지며, 국내 수사에 대한 권한은 사실상 박탈됩니다. 이는 지금까지 기획부에 펼쳐온 정보부를 향한 단순한 보복성 조치 이상을 넘어, 정보부가 필요 이상으로 권한을 행사하지 못하게 하기 위함이기도 합니다."

 GEH_with_SPD: "사회민주당 연합"
 GEH_with_SPD_desc: "SPD는 이제 게헨나의 모든 연방 자유주에서 압도적인 영향력을 발휘할 것입니다. 심지어 가장 보수적인 바이에른 인민당이 SPD를 압도하는 바이에른에서도요. 비록 이를 위하여 매우 정교한 지역구 게리멘더링이 이루어질 것이지만, 다른 정당들이 지방자치를 장악하는 것보다는 낫습니다."

 GEH_with_trinity: "에덴 소협상"
 GEH_with_trinity_desc: "트리니티와 게헨나의 오랜 분열과 대립은 대전이 이후 인류와 키보토스계의 분열만큼 심하지는 않습니다. 우리는 지방 관료들을 임명하는 데 있어서 트리니티계에 대한 엄격한 할당제를 실시하고 트리니티와 게헨나가 진정으로 친구가 될 수 있도록 노력할 것입니다."

 GEH_managed_democracy_union_idea: "통제민주주의 협력국"
 GEH_managed_democracy_union_idea_desc: "[ROOT.GetName]은(는) [GEH.GetName]을 위하여 충성하는 통제민주주의 협력국입니다. 국민들에게 권리를 제한함으로서 극단주의 세력으로부터 사회 질서를 보호하며, 동시에 자유주의적인 이상의 실현을 위해 노력합니다."

 GEH_winter_special_equipment: "동계 장비 생산에 집중"
 GEH_winter_special_equipment_desc: "동부전선에서의 승리를 위하여 동계 장비 생산에 집중하고 있습니다."

 GEH_gehenna_first_discipline: "게헨나 규율의 강제"
 GEH_gehenna_first_discipline_desc: "우리의 점령지에서도 게헨나의 규율은 엄격하게 지켜져야만 합니다."

 GEH_weapons_licensing: "장비 라이센스 투자"
 GEH_weapons_licensing_desc: "[ROOT.GetAdjective] 무기만이 아니라, 해외에서 수입한 라이센스 병기들 역시 중요합니다."

 GEH_gehenna_order_department_idea: "[ROOT.GetAdjective] 질서부"
 GEH_gehenna_order_department_idea_desc: "질서부는 위대한 철인 지도자 소라사키 히나의 직속 부대로서, 국가의 안전에 해를 끼치는 사상범에 대한 사법권을 갖는 독립적인 군 조직입니다. 게헨나 정규군과는 지휘 체계가 분리되어 있으며, 어떠한 정치적, 군사적 견제 세력도 존재하지 않습니다.\n\n[GEH.GetNameDef]의 정규군인 실행부와의 관계성 문제로 인하여 질서부는 새로운 정치적 분란을 일으키고 있습니다."

 GEH_hina_freie_gehenna_jugend_idea: "자유 게헨나 청년단"
 GEH_hina_freie_gehenna_jugend_idea_desc: "게헨나의 청년들이 강제적으로 소속되어야 하는 정치조직입니다. 이 조직은 일당 독재 체제를 유지하기 위하여 청년들을 통제하고 관리하는 역할을 맡습니다."

 GEH_hina_friendship_idea: "키보토스 범민족주의"
 GEH_hina_friendship_idea_desc: "키보토스인은 위대하며, 지구의 현지인들을 지배할 수 있는 명백한 운명을 타고났습니다. 그들은 헤일로조차 없는 미개한 종족 아니던가요?"

 GEH_hina_solidarity_idea: "국민 연대"
 GEH_hina_solidarity_idea_desc: "현지인들은 키보토스계에 비해 '덜 평등'하지만, 조국의 승리를 위하여 '국민적 연대'를 해야 할 의무를 갖습니다."

 GEH_sorasaki_leadership: "일인독재"
 GEH_sorasaki_leadership_desc: "이제 게헨나는 히나를 추종하는 열성부원들이 다른 파벌들을 압도하는 국가가 아닙니다. 더 이상 열성부원이 아닌 파벌은 존재하지 않게 되었습니다. 히나 개인의 지도력이 완성되고 남은 세력은 그녀의 추종자들 뿐인 지금, 게헨나는 무자비한 일인 독재 체제가 완성되었습니다."

 GEH_nsdap_gercom_revolt: "도이칠란트 최후 반란"
 GEH_nsdap_gercom_revolt_desc: "알베르트 슈페어 국가수상과 에른스트 텔만 대통령의 연합 정부인 '도이칠란트 구국정부'는 게헨나 전역에서 최후의 민중 반란을 일으켰습니다. NSDAP와 도이칠란트 공산당 지지자들로 이루어진 레지스탕스 세력들은 게헨나를 파괴하고 새로운 도이치 공화국을 건설하겠다고 합의했습니다.\n\n얼마나 어리석습니까?"

