#히나독재
 GEH_last_focus_effect_h_rout: "소라사키 히나의 위대한 기록"
 GEH_last_focus_effect_h_rout_desc: "소라사키 히나의 완전한 승리의 날입니다. 제4차 총회 종료를 기념하는 카 퍼레이드가 열리게 되었으며, 히나는 도이칠란트 전체의 위대한 수장으로서 이 자리에 섰습니다."

 GEH_hina_we_must_dissent: "우리는 저항해야 한다"
 GEH_hina_we_must_dissent_desc: "누가, 무엇을 상대로 저항해야 하는 걸까? 내가 바알에게? 바알이 나에게?"

 GEH_hina_ishbosheth: "이스보셋"
 GEH_hina_ishbosheth_desc: "위대한 기록이 아닌 부끄럽고 저주받은 기록일지라도."

 ## 학생 인민의 의지 ##

 GEH_hina_jacobinisme_reform: "국민주의 개혁"
 GEH_hina_jacobinisme_reform_desc: "국가와 히나 의장은 인민 대중의 의지를 상징하는 존재가 되어야만 합니다. 대중을 우선하는 새로운 경제 시스템은 노동자들이 기업을 장악하는 노동조합 중심의 국민생디칼리슴 체제로 결정되었습니다."

 GEH_hina_national_syndicalism: "모든 공장에 조합을"
 GEH_hina_national_syndicalism_desc: "국민생디칼리슴 체제 아래에서 모든 노동조합이 기업을 통제할 것입니다. 물론 이 노동조합들은 친정부적인 국영 조직으로 운영되어야만 합니다. 정부는 조합을 이용하여 제조업 공장들을 간접적으로 통제할 것입니다."

 GEH_hina_state_capitalism: "국가자본주의"
 GEH_hina_state_capitalism_desc: "우리의 새로운 경제 체제는 자본가들을 중심으로 이루어질 것이지만, 자본의 흐름은 계획 경제 시스템을 통해 우리가 고삐를 잡아야만 합니다. 모든 자본은 위대한 국가의 의지에 따라서만 움직일 수 있을 것입니다."

 GEH_hina_patriotic_entrepreneur: "애국적 자본가"
 GEH_hina_patriotic_entrepreneur_desc: "모든 자본가들은 국가의 명령에 따라 애국적으로 자신의 자산을 언제라도 반납할 수 있어야만 합니다. 자발적으로 반납하지 않는다면? 어떠한 일이 일어날 것인지 우리 모두가 알고 있습니다."

 GEH_hina_new_constitution: "신헌법 반포"
 GEH_hina_new_constitution_desc: "히나 의장은 모든 게헨나 대중의 의지를 상징하는 지도자입니다. 열성부원들의 환호 속에서 히나 의장의 권위를 높이는 새로운 헌법이 반포됩니다. 대게헨나국 만세!"

 GEH_hina_freie_gehenna_jugend: "자유 게헨나 청년단"
 GEH_hina_freie_gehenna_jugend_desc: "게헨나 시민들의 단결과 우애를 위하여, 모든 게헨나 청년들은 자유 게헨나 청년단(Freie Gehenna Jugend) 조직에 소속되어야만 합니다. FGJ는 게헨나 청년들의 우애와 애국심을 키우고, 그들을 더욱 효율적으로 동원할 수 있도록 만듭니다."

 GEH_hina_youth_gehenna_party: "청년 게헨나당"
 GEH_hina_youth_gehenna_party_desc: "새로운 게헨나의 집권여당이자 유일한 당이 된 청년 게헨나당은 대중의 의지에 따라 게헨나를 대중주의적 방향으로 개혁하고, 모든 국민들이 조국에 충성하는 새로운 국가를 건설하고자 합니다."

 GEH_hina_country_for_the_public: "하나는 전체를 위하여"
 GEH_hina_country_for_the_public_desc: "대중이 조국을 위하여 단결하는 만큼, 조국도 대중을 위하여 봉사하여야만 합니다. 다양한 기본 복지 시스템들은 게헨나의 일반 시민들이 조국에 대한 애국심과 소속감을 갖도록 만들 것입니다."

 GEH_hina_friendship: "키보토스 사이의 우정"
 GEH_hina_friendship_desc: "악마의 뿔이 있던, 천사의 날개가 있던. 히나 의장의 의지와 위대한 조국의 이름 아래에서 우리 모두는 같은 민족입니다. 범키보토스 탈민족주의는 키보토스 전체의 단결과 통합을 이루어 낼 것입니다."

 GEH_hina_solidarity: "연대하라"
 GEH_hina_solidarity_desc: "비록 많은 신체적 차이점을 가지고 있지만, 키보토스계 인구와 현지인들은 모두 같은 깃발에 충성하는 동료 시민입니다. 모두 연대합시다. 그리고 게헨나의 질서 아래에서 순응합시다."

 GEH_hina_ishbosheth_route_ending: "에스바알"
 GEH_hina_ishbosheth_route_ending_desc: "...많은 사람들을 행복하게 만들었어. 많은 사람들의 의지에 따라 행동했어. 하지만 여기에 내 의지는 없었어. 모두는 히나 의장을 위해 움직인다고 말하지만, 정말 그들은 나를 위해 움직이는 걸까? 아니면 그들이 상상하는 이상적인 소라사키 히나를 위해 움직이는 걸까?"

 ## 게헨나의 지도자 ##

 GEH_hina_terror_route_start: "§R종막§!"
 GEH_hina_terror_route_start_desc: "§R드디어 승리했다.§!"

 GEH_hina_terror_route_1: "선도부 질서 재정립"
 GEH_hina_terror_route_1_desc: "게헨나의 질서는 선도부가 통제하며, 선도부는 소라사키 히나가 통제합니다. 그것을 이해하지 못하는 선도부 내부의 반대파들은 제거될 필요가 있습니다. 그들이 누구를 위하여 그곳에서 복무하는 것인지는 이해해야지요."

 GEH_hina_terror_route_2: "나의 질서 강요"
 GEH_hina_terror_route_2_desc: "게헨나에 저항하는 파시스트, 공산주의자들을 제거하기 위한 계획이 실시될 것입니다. 원래 그것들은 인간이 아니고, 좀 더 빨리 죽었어야 할 해충들입니다. 비로소 게헨나에 질서가 바로 설 것입니다."

 GEH_hina_terror_route_3: "자아의 말살"
 GEH_hina_terror_route_3_desc: "도이치인들은 인간이 아닙니다. 게헨나인들은 인간이지만, 개개인으로서 존재하는 것이 아닌 소라사키 히나를 위한 존재로서만 가치가 있습니다. 그들은 개개인의 자아를 갖는 자유인이 아닌, 거대한 질서 아래에서 움직이는 부품이 되어야 합니다."

 GEH_hina_terror_route_ending: "완성"
 GEH_hina_terror_route_ending_desc: "도이칠란트의 반란 세력은 이제 더 이상 존재하지 않습니다. 게헨나 선도부 내부의 저항 세력도 남아 있지 않습니다. 지금까지 키보토스에서 소라사키 히나처럼 강력한 절대 권력을 가지는 지도자는 결코 없었습니다. 심지어 총학생회장조차요. ...우리는 위대한 승리를 거두었습니다."

 GEH_hina_the_darkest_hour: "어두운 시간을 지나"
 GEH_hina_the_darkest_hour_desc: "나는 강한 사람이 아니야. 바알이 등장한 이유도 내가 나약한 존재였기 때문이지. 하지만 그게 잘못된 것일까? 내 나약함을 부정할 필요가 있을까? 나 자신을 받아들이자. 내 나약한 면 역시 나니까. 나약한 소라사키 히나도 나의 소중한 면모니까."

 GEH_hina_the_darkest_hour_2: "게헨나 임시 의회 설립"
 GEH_hina_the_darkest_hour_2_desc: "나는 독재자가 될 생각이 없었어. 어느 순간 열성부원들의 열성에 따르다가, 원치 않는 독재자가 되어 버렸지만. ...이미 게헨나는 내 한 마디에 너무 크게 의존하는 나라가 되었기에, 권력을 내려놓는 건 너무도 어려운 일이야. 자문기관부터 시작하자. 오랜 시간에 걸쳐, 내 권력을 분산할 거야."

 GEH_hina_the_darkest_hour_3: "선도부 질서 회복"
 GEH_hina_the_darkest_hour_3_desc: "내가 생각하던 '질서'는 분명 어긋나 있었어. 나는 동료들과의 인연을 잊고 있었고, 내 가장 소중한 사람들이 곁에 있다는 것을 간과했어. 나는 뇌제도 철인 독재자도 아니야. 나는 내 정책을 결정하기 위해, 소중한 동료들의 조언이 필요해. 골방에서 나와, 실행부와 기획부에 더 많은 권한을 줄 거야."

 GEH_hina_the_darkest_hour_4: "질서부 억제"
 GEH_hina_the_darkest_hour_4_desc: "질서부는 내 명예를 드높이겠다면서, 오히려 내 명예를 더럽히고 있어. 질서부보다 실행부가 더 우위에 있는 군사 조직이라는 것을 명문화 할 필요가 있겠지."

 GEH_hina_the_darkest_hour_route_ending: "미래, 자유"
 GEH_hina_the_darkest_hour_route_ending_desc: "나 자신의 자유는, 내가 완벽한 사람이 되어야만 한다는 그 강박적인 생각에서 벗어났을 때 찾아왔다. 나는 초인이 아니다. 하지만, 나를 소중하게 생각하는 동료들이 있다. 그거면 충분한 것 아닌가?"

 GEH_hina_panopticon_institution: "파놉티콘 기관"
 GEH_hina_panopticon_institution_desc: "예비 범죄자라고 할 수 있는 노동자들의 조직화된 반란, 태업을 막기 위하여 모든 노동자들을 감시할 수 있는 파놉티콘 기관을 각 공장에 의무적으로 설치합니다. 헬멧을 이용해 시선을 가린 질서부의 감시 요원들이 공업지대에 영구적으로 상주할 것입니다."

 GEH_hina_national_delusion: "민족이라는 망상"
 GEH_hina_national_delusion_desc: "여러 키보토스 학원 국가의 개념들과 도이칠란트의 문화적 역사적 기록. 그 모든 것은 위대한 대게헨나국의 부품들에게 무의미한 새로운 가치관을 심어주며 다양한 범죄 가능성을 증대시킵니다."

 GEH_hina_cult_of_leader: "히나 숭배"
 GEH_hina_cult_of_leader_desc: "개인은 위대한 지도자 앞에서는 아무런 가치가 없습니다. 특히 개인의 의지는 더더욱 그렇습니다. 게헨나의 모든 국민들은 지도자를 위하여 움직이는 부품이 되어야 합니다."

 GEH_hina_extermination_german: "도이치 말살"
 GEH_hina_extermination_german_desc: "현지 도이치인들의 독립 의지를 꺾기 위하여, 모든 도이칠란트 아동들은 가정으로부터 분리되어 집단 교육 시설에서 특수한 '게헨나화' 교육을 받게 될 것입니다. 이는 장기적으로 도이치 현지 문화의 영구적 말살과 도이칠란트 분리주의의 소멸을 일으킬 것입니다."

 GEH_hina_two_class_society: "계급사회"
 GEH_hina_two_class_society_desc: "우리는 귀족 제도를 만들어내지 않을 것입니다. 하지만 사실상 귀족 제도와 같은, 현지인들을 차별하기 위한 유사 신분제를 만들 수 있습니다."

 GEH_hina_nationalist_education: "게헨나화 교육"
 GEH_hina_nationalist_education_desc: "우리는 자랑스러운 게헨나의 신민으로서, 위대한 지도자의 영도 아래에서 하나로서 단결됩니다. 도이칠란트 문화의 말살은 초등교육 단계에서부터 단계적으로 진행될 것이며, 1세기 안에 완전한 문화적 동화가 완료될 것입니다."

 GEH_hina_planned_backwardness: "계획적 후진화"
 GEH_hina_planned_backwardness_desc: "키보토스의 인구는 지구의 현지인들에 비하여 상대적으로 적은 인구를 가지고 있습니다. 우리는 현지인 인구가 거주하는 지역의 의료 시설을 철거하고, 그들을 농업과 공업의 지옥으로 밀어넣을 것입니다. 그들의 삶의 질을 떨어뜨림으로서 그들의 인구는 점점... 키보토스계와 균형을 맞출 것입니다."

 GEH_hina_eradication_of_decadent_individualism: "퇴폐적 개인주의 금지"
 GEH_hina_eradication_of_decadent_individualism_desc: "방종과 혼돈은 게헨나를 범죄의 학원으로 만들었습니다. 더는 그러한 방종이 허가되는 일은 없을 것입니다. 위대한 통합과 질서 아래에서 우리는 번영하리라."

 GEH_hina_one_for_all: "전체는 하나를 위하여"
 GEH_hina_one_for_all_desc: "단순히 개인주의에 대한 탄압만이 아니라, 대게헨나국의 모든 신민들은 스스로를 위대한 지도자를 위하여 사용되는 '인적 자원'으로서 생각하도록 교육되어야만 합니다. 게헨나인들은 광산에서 캐내는 석탄과 같이 불태워 소모할 수 있는 자원이며, 히나 의장은 그들이 마지막 불꽃으로 타오르도록 지켜볼 것입니다."

#아코
 GEH_last_focus_effect_a_rout: "선도부의 새로운 개혁"
 GEH_last_focus_effect_a_rout_desc: "아마우 아코의 관료제 개혁은 선도부를 군대가 통제하는 군벌 국가에서 근대적인 관료제 국가로 변화시켰습니다. 선도부라는 이름은 여전히 역사에 남을 것이지만, 이제 경찰 조직이 관료를 이끄는 것이 아닌 관료가 경찰 조직을 이끌 것입니다. 기술관료들의 관리 아래에서 우리가 계속해서 번영할 수 있기를!"

 ## 아마우 선임행정관 루트
 GEH_amau_administrative_officer: "아마우 선임행정관"
 GEH_amau_administrative_officer_desc: "소라사키 히나는 아마우 아코의 스캔들을 막기 위해 고의적으로 아코와 거리를 두고 그녀를 배척해 왔습니다. 아코는 결국 이것이 히나가 자신을 보호하기 위해 내린 결정이라는 것을 이해하겠지만, 결국 히나와 거리를 둔 아코의 기술관료 개혁은 축소되고 온건한 형태가 될 수밖에 없습니다."

 GEH_amau_seminar: "기획부의 예산안 간섭"
 GEH_amau_seminar_desc: "밀레니엄의 '세미나'는 기술관료제의 보석이라고 할 수 있을 만큼 완벽하고 모범이 되는 집단입니다. 뛰어난 기술관료들로 구성된 조직이 예산편성을 담당하며, 다른 부서들은 자신들이 하려는 모든 기획을 세미나에 제출하고 그 예산안을 승인받아야 합니다. 비록 우리가 세미나와 동일한 조직을 만드는 걸 허가받지는 못하겠지만, 히나는 예산 편성에 기획부의 기술관료들이 간섭할 수 있는 권한을 제공할 것입니다."

 GEH_amau_check_military: "실행부 견제"
 GEH_amau_check_military_desc: "실행부는 최소한의 견제가 필요하며, 히나 부장님을 자신들의 군국주의적 목적으로 이용할 수 없도록 지속적인 감시가 필요합니다."

 GEH_amau_free_internet_policy: "무상 인터넷 서비스"
 GEH_amau_free_internet_policy_desc: "대전이 이후 우리의 인터넷 서비스가 인공위성 등을 잃어버리며 크게 후퇴한 것은 사실이지만, 여전히 유선랜을 이용한 인터넷이 게헨나 전역에 널리 퍼져 있습니다. 모든 국민들을 위해 무료로 인터넷을 제공하는 것은 장기적으로 우리 국민들의 지식 수준을 높이고, 또 기획부가 꿈꾸는 '지식인들의 국가'라는 목표에 느리지만 천천히 다가가는 길이 될 것입니다."

 GEH_amau_to_the_sky: "하늘을 향해!"
 GEH_amau_to_the_sky_desc: "우리는 20년 안에 밀레니엄의 최신 과학 기술을 완전히 따라잡을 것입니다. 비록 현실적인 무리가 있다고 하더라도요."

 GEH_amau_rotue_ending: "§Y당신의 곁에서§!"
 GEH_amau_rotue_ending_desc: "모든 고난을 넘어, 우리는 한 이야기의 끝을 맞이합니다."

 ## 소라사키 아코 루트
 GEH_ako_sorasaki_administrative_officer: "소라사키 아코"
 GEH_ako_sorasaki_administrative_officer_desc: "소라사키 히나는 아마우 아코와의 공개 연애를 통해 아코에 대한 비난이 곧 자신에 대한 비난이라고 주장하며 아코를 보호했습니다. 히나와 아코 두 사람의 결혼식은 히나가 자신의 일생동안 아코의 편이 되어 줄 것이며, 사랑하는 그녀가 주도하는 개혁을 어떠한 일이 있더라도 지켜낼 것이라는 의지의 표명이기도 합니다. 물론 정치적인 이유 외에도, 두 사람의 깊은 관계가 결실을 맺는 아름다운 순간이기도 하고요."

 GEH_ako_sorasaki_seminar: "게헨나 세미나"
 GEH_ako_sorasaki_seminar_desc: "밀레니엄의 '세미나'는 기술관료제의 보석이라고 할 수 있을 만큼 완벽하고 모범이 되는 집단입니다. 뛰어난 기술관료들로 구성된 조직이 예산편성을 담당하며, 다른 부서들은 자신들이 하려는 모든 기획을 세미나에 제출하고 그 예산안을 승인받아야 합니다. 이제 왜 선도부에 세미나가 필요한지 알 수 있겠죠? 아코 선임행정관과 기획부가 총괄하는 세미나는 모든 부서들의 예산을 관리할 것입니다."

 GEH_ako_sorasaki_civilian_control: "문민 통제의 원칙"
 GEH_ako_sorasaki_civilian_control_desc: "이제 게헨나 군부나 다름 없는 실행부는 민간 조직의 개입을 전혀 받지 않은 채 활동하고 있었습니다. 아니요. 게헨나는 군벌 국가가 아닌 근대 행정 국가가 되어야만 하며, 실행부의 여러 간부들은 제복을 벗고 민간 소속이 되어야 할 것입니다."

 GEH_ako_sorasaki_promotion_of_science: "무법이 아닌 과학"
 GEH_ako_sorasaki_promotion_of_science_desc: "기술관료 위주의 새로운 게헨나는 '자유와 혼돈의 학원'이라는 오명을 벗어나 뛰어난 학자들과 지식인들을 위한 국가로 거듭나야 합니다. 비록 매우 큰 기술력의 차이가 있기는 하지만, 우리는 언젠가 밀레니엄까지도 따라잡을 수 있을 것입니다."

 GEH_ako_sorasaki_ako_s_puppet: "§C오직 아코만§!"
 GEH_ako_sorasaki_ako_s_puppet_desc: "아코는 언제나 히나의 편이었습니다. 그녀는 늘 히나에게 도움이 되어 주었고, 그녀는 가장 힘들었을 때 히나의 곁에 있었습니다. 그리고 ...사랑하는 아내가 모든 것을 대신 해 줄 텐데, 왜 생각 따위를 해야 하나요? 히나는 눈을 감고, 자신의 모든 사고와 가치관을 아코에게 맡기기로 합니다. 히나는 이제 사랑하는 아내의 결정을 똑같이 따라 읽는 꼭두각시로의 삶을 기쁜 마음으로 받아들일 것입니다."

 GEH_ako_sorasaki_ako_s_partner: "§G최고의 파트너§!"
 GEH_ako_sorasaki_ako_s_partner_desc: "아코는 언제나 히나의 편이었습니다. 그녀는 늘 히나에게 도움이 되어 주었고, 그녀는 가장 힘들었을 때 히나의 곁에 있었습니다. 히나는 여전히 선도부를 위해 해야 할 일이 많다는 것을 압니다. 하지만, 그런 자신의 곁에 가장 소중한 아내이자 파트너가 있다면 어떠한 고난도 넘어설 수 있을 것입니다."

 GEH_ako_sorasaki_route_ending: "Before I Rise"
 GEH_ako_sorasaki_route_ending_desc: "하나의 이야기가 끝납니다. 그리고 하나의 아름다운 결말이 피어오릅니다."

 ## 소라사키 아코 & 아마우 선임행정관 공용 중점
 GEH_4th_ako_reduction_in_defense_budget: "국방 예산 삭감"
 GEH_4th_ako_reduction_in_defense_budget_desc: "게헨나의 재통일과 부흥이 완료된 지금, 기획부는 비대하게 많은 실행부의 예산을 축소하고 이를 산업 발전으로 돌리기를 바랍니다. 소라사키 히나 역시 이 조치에 동의할 것입니다."

 GEH_4th_ako_centre_of_culture: "문화의 학원"
 GEH_4th_ako_centre_of_culture_desc: "과거의 게헨나는 '자유와 혼돈의 학원'으로서 학생들의 출석조차 제대로 이루어지지 않는 무질서한 장소였습니다. 새로운 관료제 체제는 게헨나 교육기관의 출석율을 높이기 위한 징벌적 조치를 실시하면서, 동시에 자유로운 게헨나의 문화적 풍토를 지켜나가기 위해 학생들의 활발한 예술 활동을 지원할 것입니다."

 GEH_4th_ako_intelligence_reform: "정보부 개혁"
 GEH_4th_ako_intelligence_reform_desc: "정보부는 아코와 그녀가 이끄는 기획부와 가장 큰 정치적 대립을 해 왔던 기관이었습니다. 소라사키 히나조차도 정보부가 지나칠 정도로 내부 권력 다툼에 집중해 왔으며, 아코를 불필요하게 괴롭혀 왔다는 것을 인정합니다. 정보부는 정치 권력에서 철저하게 분리되어야만 하며, 앞으로는 외부 방첩에만 집중하게 될 것입니다."

 GEH_4th_ako_second_weimar_republic: "제2차 바이마르 공화국"
 GEH_4th_ako_second_weimar_republic_desc: "새로운 연방공화국은 소수의 키보토스계만을 대표하는 국가가 아닌, 모든 도이칠란트 국민들을 대표하는 '새로운 바이마르 공화국'이 되어야만 합니다. 결국 우리는 소수의 인구만을 가지고 국가를 운영해 나갈 수는 없는 법이니까요."

 GEH_4th_ako_coalition_with_SPD: "사회민주당과 연합"
 GEH_4th_ako_coalition_with_SPD_desc: "도이칠란트 사회민주당을 중앙 정부에 합류시킨다는 뜻은 아닙니다. 어디까지나 우리는 게헨나로서의 정체성을 유지해 나가야만 합니다. 하지만, 적절한 선거 개입을 통하여 지방정부에서 사회민주당의 영향력을 확대시킬 수는 있습니다. SPD는 우리 정부에 가장 우호적인 현지인 정당이기에, 현지인들과 키보토스계 사이의 가교 역할을 할 수 있을 것입니다."

 GEH_4th_ako_oath_of_bureaucratic: "현지인 관료 충성맹세"
 GEH_4th_ako_oath_of_bureaucratic_desc: "군 조직이라면 몰라도 현지인들을 '관료'로 받아들이는 것은 매우... 조심스러운 일이었습니다만, 우리가 도이칠란트의 주도적 세력이 되었기 때문에, 게헨나의 질서에 충성을 맹세한 현지인들은 우리의 기술관료 조직의 말단으로 편입시킬 수 있을 것입니다. 당연히, 그들이 주도권을 잡는 것은 절대로 불가능할 것이지만요."

 GEH_4th_ako_from_gehenna_to_trinity: "게헨나에서부터 트리니티까지"
 GEH_4th_ako_from_gehenna_to_trinity_desc: "우리의 목표는 게헨나와 트리니티라는 두 분열된 세력을 하나로 통합하고, 키보토스계의 단결을 이루어내는 것입니다. 현지인들의 권리도 중요하지만, 어디까지나 '두 번째'입니다."

 GEH_4th_ako_eden_union: "에덴 소협상"
 GEH_4th_ako_eden_union_desc: "어디까지나 게헨나, 트리니티 두 학원은 같은 키보토스계로서 동일한 헤일로를 가진 사이이지만... 학생들끼리 평균적인 외형상의 차이가 있는 것은 사실입니다. 에덴 협정의 이름을 딴 '에덴 소협상'은 우리 기술관료 집단에 필수적으로 트리니티 출신 할당제를 부여하여 두 학원의 평화를 점진적으로 이루어내는 것을 목표로 합니다."

 GEH_4th_ako_federation_for_kivotos: "키보토스 연합"
 GEH_4th_ako_federation_for_kivotos_desc: "다양한 학원, 수인, 로봇 등 키보토스 출신 인구들이 우리 국가의 번영을 위하여 협조할 것입니다. 키보토스 인구들이 뭉쳐 만들어진 시민단체들은 우리의 인구가 비록 현지인들에 비해 적다 하더라도, 우리가 강한 단결을 통해 현지인들에게 주도권을 빼앗기지 않게 만듭니다."

#이오리
 GEH_last_focus_effect_c_rout: "피로 물든 얼룩 지우기"
 GEH_last_focus_effect_c_rout_desc: "소라사키 히나와 충성스러운 선도부는 게헨나 전역을 평정하고 안정을 가져오는 걸 성공했습니다. 이제 우리는 더 나아가 급진적인 전쟁과 군사화된 체제를 해결하고 미래를 위한 투자를 시작할 때입니다."

