 hina_assembly.8.t: "1st Prefect General Assembly: Inexperience in State Management"
 hina_assembly.8.desc: "Prefect Head Sorasaki Hina and the Prefect members began discussing their biggest problem. The first agenda, started with Sorasaki Hina's speech noting that while no one in the Prefect Team has experience in actual state administration, they are now faced with the situation of running a country, soon converged into three opinions.\n\nThe Planning Bureau argues they should be expanded into an administrative institution based on being the most competent administrative organization currently.\n\nThe Enforcement Bureau requests they be granted administrative power to maintain local security and control the economy, claiming strong control is needed to overcome the crisis facing the Prefect Team.\n\nAlternatively, we could settle the dissatisfaction of both departments by compromising and creating a new administrative institution."
 hina_assembly.8.a: "Expand the Planning Bureau into an administrative institution."
 hina_assembly.8.b: "Create a new administrative organization by drawing personnel from all institutions."
 hina_assembly.8.c: "Grant authority to the Enforcement Bureau."

 hina_assembly.9.t: "1st Prefect General Assembly: Stance on Nazi Supporters"
 hina_assembly.9.desc: "After the issue of local Germans emerged as a major agenda, the second meeting began. With Sorasaki Hina's brief explanation that the Prefect Team currently exists on the territory of the nation known as Germany before the Great Migration, it was discussed that this Germany was the center of the Nazi Party, which committed criminal dictatorial acts such as the Enabling Act and the 'Night of the Long Knives.' The problem is the exclusive attitude the Nazi Party has toward other ethnicities, and the contemptuous gaze of Nazi supporters toward Kivotosian migrants.\n\nThe Planning Bureau, with opinions unified under Amau Ako's hardline stance, argued that Nazi supporters are 'potential criminals' capable of lynching the ethnic minority Kivotosians, and claimed that all citizens with Nazi Party membership records need to be monitored.\n\nHowever, Hinomiya Chinatsu and the majority of the Prefect Team think Amau Ako is excessively paranoid and that monitoring the private lives of all ordinary Nazi Party members nationwide is an excessive measure. The majority, centered on Chinatsu, proposed a moderate policy of punishing only those Nazi Party members who carry out racist actions or join subversive organizations.\n\nShiromi Iori agrees with Ako's opinion but is putting forward a radical claim that to educate the Germans who supported the Nazi Party, we need 'education to erase Nazi ideology' by forcibly conscripting Nazi Party members into the military and making them roll around in units with Kivotosian populations, making even the Planning Bureau Prefect members hesitant."
 hina_assembly.9.a: "Under Amau Ako's leadership, the Nazi Party Member Monitoring Law will be enforced."
 hina_assembly.9.b: "It might be better to follow the majority opinion."
 hina_assembly.9.c: "Shiromi Iori's claim is radical, but useful."

 hina_assembly.10.t: "1st Prefect General Assembly: Need for Expansion"
 hina_assembly.10.desc1: "The Prefect Team is too small in scale to rule all of Bavaria. Since other key executives also agree with this point, unlike major agendas thought of by many Prefect members, this issue began its meeting first. The meeting started with Sorasaki Hina's usual brief explanation, but unlike before, no large discussion took place.\n\nUltimately, the choice will be made by the decision of Sorasaki Hina and a few executives. There will be options like stably recruiting Gehenna students or broadly accepting students from other schools." #9-a, b
 hina_assembly.10.desc2: "The Prefect Team is too small in scale to rule all of Bavaria. Since other key executives also agree with this point, unlike major agendas thought of by many Prefect members, this issue began its meeting first. The meeting started with Sorasaki Hina's usual brief explanation, but unlike before, no large discussion took place.\n\nUltimately, the choice will be made by the decision of Sorasaki Hina and a few executives. There will be options like stably recruiting Gehenna students, broadly accepting students from other schools, or even appointing local German citizens to run an autonomous government." # 9-c
 hina_assembly.10.a: "Let's actively gather members."
 hina_assembly.10.b: "Allow students from other schools to join."
 hina_assembly.10.c: "...Maybe, appointing local Germans might be the answer."

 hina_assembly.11.t: "1st Prefect General Assembly: Budget Securing Plan"
 hina_assembly.11.desc: "Now that Pandemonium has begun investing its own capital into administrative operations, the budget for operating the Prefect Team is gradually becoming insufficient. This agenda, started amidst the enthusiastic participation of Prefect members, is about plans to secure the Prefect Team's budget. The meeting began with Sorasaki Hina's speech explaining the budget shortage and the need for a securing plan, and the debate converged on major focus points.\n\nThe Planning Bureau is largely divided into two agendas but, under Amau Ako's leadership, desires to establish a massive bureaucratic state like Millennium Science School.\n\nA large number of ordinary Prefect members want to maintain the current Prefect Team system.\n\nThe Medical and Enforcement Bureaus argue for issuing orders to corporations for immediate military-social economic mobilization."
 hina_assembly.11.a: "Bureaucracy is what's most familiar to us."
 hina_assembly.11.b: "Let's maintain the current state as much as possible through austerity measures and local tax collection."
 hina_assembly.11.c: "We need economic mobilization right now."
 GEH_factory_focus_7_tt: "This focus is unlocked according to the §Yeconmic policy§! selected during the §Y1st Prefect General Assembly§!."

 hina_assembly.12.t: "1st Prefect General Assembly: Loyalty Toward the Prefect Head"
 hina_assembly.12.desc: "Prefect members fell into excessive enthusiasm seeing the Prefect Head solving the sudden crisis with strong charisma and orderly leadership. This meeting, started amidst overwhelming support from Prefect members, is about the Prefect Team's national form.\n\nAmau Ako sympathized with this enthusiastic support for Sorasaki Hina and stood by these movements, and the Planning Bureau is also silent.\n\nShiromi Iori and other executives express dissatisfaction that their efforts are being overshadowed.\n\nAnd, a significant number of ordinary Prefect members are praising the Prefect Head's actions."
 hina_assembly.12.a: "This shouldn't be a major problem."
 hina_assembly.12.b: "Promote the executives of the Prefect Team."
 hina_assembly.12.c: "Accept the enthusiasm." # Opened upon c-b-a-b


