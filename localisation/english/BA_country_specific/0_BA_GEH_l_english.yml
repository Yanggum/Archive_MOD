 GEH_hina_corruption_text_tt: "§gAt the bottom of Gehenna, in the Valley of Hinnom, hell still burns. §RBaal's Mystery§! is in a [GEH_hina_corruption_loc] ([?GEH_hina_corruption_var]) state.§!"
 GEH_hina_corruption_text_tt_delayed: "§YNote§!:§g The focus tree at the 4th Prefect Team General Assembly changes according to Sorasaki Hina's mental state. Once the 4th General Assembly is completed, it is impossible to §GImprove§! or further §RDecline§! her mental state.§!"
 GEH_hina_corruption_numerical_limit_tt: "Hina's corruption state must be between §Y-5§! and §Y5§!."

 GEH_hina_corruption_hina_frame_text_tt: "§gSorasaki Hina's conscience seeks to reject corruption. Hina may attempt to maintain her humanity through her relationships with Prefect Team members. Alternatively, completing the §G4th Prefect Team General Assembly§! before her mind completely breaks could be another alternative.\n\nHina's mental state is divided into three stages: §YHunger§!, §OFulness§!, and §RAwakened§!. For Sorasaki Hina to maintain herself in the 4th General Assembly, she must keep her mental state from reaching the Awakened stage. §ROf course, it's not like a penalty will occur even if she doesn't.§!§!"
 GEH_hina_corruption_hina_frame_text_tt_delayed: "§gThrough thee will we push down our enemies: through thy name will we tread them under that rise up against us.\nFor I will not trust in my bow, neither shall my sword save me.\nBut thou hast saved us from our enemies, and hast put them to shame that hated us.\n\nPsalm 44:5-7§!"
 GEH_hina_corruption_ako_frame_text_tt: "§gBaal is proposing power and continuous negotiation. By Hina negotiating with the Baal within her and accepting power, the Great Gehenna Nation can gain permanent §GRewards§!.\n\nOf course, those rewards are not given for free. Each time a reward is given, Hina's corruption accelerates, and maintaining humanity becomes difficult. §RBut what does that matter?§!§!"
 GEH_hina_corruption_ako_frame_text_tt_delayed: "§gCasting all your care upon him; for he careth for you.\nBe sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour:\nWhom resist stedfast in the faith, knowing that the same afflictions are accomplished in your brethren that are in the world.\n\n1 Peter 5:7-9§!"

