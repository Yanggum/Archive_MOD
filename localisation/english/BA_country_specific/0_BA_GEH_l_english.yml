### Locals
 GEH_piet_mondrian: "Mies van der Rohe"
 GEH_karl_schmidt_rottluff: "Karl Schmidt-Rottluff"
 GEH_richard_strauss: "Richard Strauss"
 GEH_hertha_gordon: "Hertha Gordon"
 GEH_therese_junkers: "Therese Junkers"

 GEH_prefect_team_maritime_police_desc: "§gThe Prefect Maritime Police was established to manage the rivers and lakes of the German region after the Great Migration. However, the Prefect Team was not skilled in maritime police activities before the Migration, as maritime crime was usually the responsibility of the Valkyrie Police Academy Maritime Police. Consequently, the Prefect Maritime Police is evaluated as 'inexperienced' in terms of skill.§!"
 GEH_prefect_team_honor_guard_desc: "§gThe Honor Guard is an organization that welcomes VIPs visiting Prefect Team facilities. It was an important institution during the 'Thunder Emperor' era, but during Chairman Hanuma Makoto's time, it became somewhat perfunctory due to Makoto's greed to monopolize ceremonial activities.§!"
 GEH_swimsuit_hina_desc: "§gW-Wait. Ako, I'm not the perfect superhuman you think I am. I don't know how to swim... no, seriously, I'm not being humble... Wait! Please, time! Time!! *Gack!* (Gurgle)§!"
 GEH_piet_mondrian_desc: "§gMies, a professor at the Bauhaus, Germany's prestigious architecture school, has had a major influence on architectural design. Since he is only interested in Gehenna's architectural style, he is classified as a relatively 'safe' figure, fitting the disposition of Prefect executives who are reluctant to let locals become deeply involved in politics.§!"
 GEH_karl_schmidt_rottluff_desc: "§gKarl Schmidt-Rottluff is a representative expressionist painter from the Bavaria region of Germany. His art, which does not fit classical styles, was regarded as 'degenerate art' and suppressed by the Hitler regime. Schmidt-Rottluff is only interested in teaching his expressionist art to students within the Prefect Team's sphere of influence. His non-political disposition fits the Prefect executives' reluctance to let locals get involved in politics, and he is classified as 'safe.'§!"
 GEH_richard_strauss_desc: "§gThe brilliant composer Richard Strauss, although he did not engage in strong anti-government activities under the National Socialist German regime, is friendly toward the new regime composed of Kivotosians. A brilliant German Romantic composer, Strauss is very interested in composing new classical music that incorporates Gehenna's music into his artistic world. His non-political disposition fits the Prefect executives' reluctance to let locals get involved in politics, and he is classified as 'safe.'§!"
 GEH_dkzh_idea_desc: "§gFirst of all, Ako claims her feelings for Hina are simple loyalty and not affection. Although Prefect members (and sometimes Prefect executives) who hang around throwing out the 'Prefect Head's Dog' collar don't seem to think so. Of course, no one denies that Ako is a competent and passionate Senior Administrator, whatever feelings she harbors for Hina.§!"
 GEH_dldhfl_idea_desc: "§gMany people undervalue Iori's ability due to her reckless personality and lack of planning, but Shiromi Iori is a shock troop leader with a strong sense of justice. She is likely the first on the scene to solve various crimes occurring in the Prefect Team's territory.§!"
 GEH_chinatsu_idea_desc: "§gIf you had to pick the executive most proficient in medicine in the Prefect Team, anyone would pick Chinatsu. Although her principled personality leads to complaints from ordinary Prefect members about a lack of flexibility, she will bring the most common-sense and rational solutions that most people can accept.§!"
 GEH_prefect_team_spy_desc: "§gAmong the various departments within the Prefect Team, the Intelligence Bureau is certainly the most famous. Even if it became famous because that Sorasaki Hina is from the Intelligence Bureau, rather than because the organization itself is outstanding.§!"
 GEH_ann_fudou_desc: "§gFudou Ann, from the Real Estate Management Brokerage Club, has outstanding economic talent and an amazing history of trying to sell defective real estate to Rikuhachima Aru before the Great Migration and getting beaten up for it. She's not exactly a moral person, but she's the economic talent Gehenna needs.§!"
 GEH_nyaomoto_kan_desc: "§gThe CEO of 'Nyaomoto Food,' a Gehenna food business that makes money selling illusions. There are questions about the quality of the food he makes, but at least he serves standardized and good quality dishes compared to the Gehenna School Lunch Club meals made by Juri.§!"
 GEH_owner_of_suzume_desc: "§gSuzume-tei, a famous Gehenna restaurant, enjoys high support from Gehenna citizens. Although it's 'blacklisted' in the industry because it refuses food ingredients supplied by the large company Nyaomoto Food.§!"

# Mental Health Content
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK: "Stand Firm"
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_desc: "Sorasaki Hina is the Prefect Head of Gehenna and is publicly known as a strong leader and superhuman. But for Sorasaki Hina, the word superhuman would be considered unfitting for herself.\n\nNo, is that really so? Whatever anyone says, Sorasaki Hina is now clearly a superhuman, a great Prefect Head, a ruler of fear, and the '1st premise' of the Gehenna Prefect Team. This Sorasaki Hina is a strong superhuman anyone can see.\n\n§OThe Prefect Head will now rule forever.§!\n\n§OThe Great Leader of Gehenna§! is creating a path and walking it."
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_mission: "Weight of the Crown"

 GEH_basking_in_the_brilliance_of_their_serenade: "The Last Remaining Thing"
 GEH_basking_in_the_brilliance_of_their_serenade_desc: "Sorasaki Hina is the Prefect Head of Gehenna and is publicly known as a strong leader and superhuman. But for Sorasaki Hina, the word superhuman would be considered unfitting for herself.\n\nSorasaki Hina is not a great Prefect Head, nor a ruler of fear. She is just a fragile human and a student with a precarious psychological state. However, Sorasaki Hina decided to become a superhuman herself. Above the belief of numerous Prefect members, Gehenna students, and executives following her, Sorasaki Hina walked out on her own two feet.\n\n§pWhat are the ways to become a superhuman?§!\n\n[GEH_basking_in_the_brilliance_of_their_serenade_text_tt]"

 GEH_basking_in_the_brilliance_of_their_serenade_text_0: "A girl is slowly walking §gforward§! as she is currently [GEH_basking_in_the_brilliance_of_their_serenade_loc_1_tt].[GEH_basking_in_the_brilliance_of_their_serenade_loc_tt_desc]\n\nGehenna still needs a ruler.\nA situation where the Prefect Head is §Sbroken§! must never happen."
 GEH_basking_in_the_brilliance_of_their_serenade_text_1: "The girl is eventually §Sbroken§! on the road.\n\n§SEventually the crack spread and shattered.§! The Prefect building grows dark."

 GEH_basking_in_the_brilliance_of_their_serenade_loc_0: "§GCalm§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_1: "§gStable§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_2: "§YTense§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_3: "§OCold§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_4: "§tPrecarious§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_5: "§RStaggering§!"

 GEH_basking_in_the_brilliance_of_their_serenade_loc_0_desc: "\n§GThe dawn of the Prefect Team has broken.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_1_desc: "\n§gThe blurred authority of the Prefect Head has been set right.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_2_desc: "\n§YThe appearance of a strong Prefect Head.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_3_desc: "\n§OSilence surrounds Gehenna and the Prefect Team.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_4_desc: "\n§tThe glass is tilting.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_5_desc: "\n§RA crack has formed.§!"

 GEH_basking_in_the_brilliance_of_their_serenade_mission: "Deterioration"
 GEH_basking_in_the_brilliance_of_their_serenade_trigger_tt: "§RWe still cannot end walking the path by any means.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_trigger_tt: "§RNow we cannot end walking the path by any means.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_tt: "§RSorasaki Hina's state deteriorates by one step.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_return_tt: "§CSorasaki Hina's state eases by one step.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_slow_tt: "§GSorasaki Hina's deterioration rate slows down.§!\n"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_Lslow_tt: "§CSorasaki Hina's deterioration rate significantly slows down.§!\n"

 GEH_basking_in_the_brilliance_of_their_serenade_effect_cleanup_frequent_purge: "Frequent Cleanup"
 GEH_basking_in_the_brilliance_of_their_serenade_effect_negotiate_directly_with_clubs: "Direct Negotiation with Clubs"
 GEH_basking_in_the_brilliance_of_their_serenade_effect_appeal_to_the_public: "Appeal to the Public"

 GEH_serenade_mission_no_lim_tt: "Remaining time for deterioration mission is greater than the time to be reduced"

 GEH_basking_in_the_brilliance_of_their_serenade_decision: "Prefect Team Support"
 GEH_basking_in_the_brilliance_of_their_serenade_decision_tt: "§RThis decision can only be performed once.§!\n\n§GSorasaki Hina's state recovers for the first time.§!\n§RHowever, the deterioration rate increases.§!\n"

 GEH_hina_ako_root_start_tt: "§gA special Balance of Power appears to express Sorasaki Hina's attitude and relationship toward Amau Ako. Depending on where the Balance of Power points when Amau Ako's final reform focus, §YSword Protecting the People§!, or the §Y3rd Prefect General Assembly§! focus is completed, the story of Ako and Hina will be decided.\n\n...Whichever choice it is, Hina must firmly decide her attitude toward Ako.§! §RAmbiguous attitudes will worsen Amau Ako's story in the most horrific direction.§!"

 GEH_BTBOTS.1.t: "Accumulation of Fatigue"
 GEH_BTBOTS.1.desc: "Sorasaki Hina has been continuing the paperwork for numerous Prefect members and the Gehenna Academy territories they rule since the Great Migration. There are many students waiting for Sorasaki Hina's decisions, and many documents remain unapproved.\n\nSorasaki Hina begins a new day drinking strong espresso today as well. Because there's still a lot to do.\n\nShe is continuing her usual daily routine today, signing documents dealing with conflicts between Gehenna students and German citizens and directing the Prefect Team's response plans.\n\nA daily routine that feels as if it will never end."
 GEH_BTBOTS.1.a: "\"Ako. Make the coffee a bit stronger.\""

 GEH_BTBOTS.2.t: "The Glass"
 GEH_BTBOTS.2.desc: "As usual, Prefect executives are gathered for a meeting. Under Sorasaki Hina's cold gaze, a meeting takes place where executives engage in endless heated debate. Since ordinary Prefect members will surely follow whatever comes out of this meeting, Sorasaki Hina silently carries that responsibility.\n\nA scene no different from a few days ago unfolds before her eyes. Shiromi Iori's enraged voice, Amau Ako's mocking and sarcastic tone, and Hinomiya Chinatsu's anxious gaze are all reflected in the Prefect Head's purple eyes.\n\nSorasaki Hina... had to mediate them as always. No. But she couldn't. In the moment she didn't notice the strength going into the glass in her hand, the glass shattered. Then, the quarrel between the two stopped instantly.\n\nThe air in the Prefect meeting room hung heavily."
 GEH_BTBOTS.2.a: "\"...Continue. Sorry.\""

 GEH_BTBOTS.3.t: "Lethargy"
 GEH_BTBOTS.3.desc: "In the dim dawn, Sorasaki Hina barely opened her eyes, exhausted. Even if her whole body felt heavy as if she didn't want to do anything, the documents spread across the Academy and the voices of students waiting for decisions were already filling her head.\n\nAfter lying in bed for a few minutes staring at the void, she reluctantly stood up. Her steps toward the kitchen were infinitely slow, and the bitter taste of the strong espresso in her hand seemed to help her forget reality for a moment. However, the faint light seeping through the window and the quiet whispers of colleagues at the end of the hallway announced that the heavy paperwork of today would soon begin.\n\nThus, Sorasaki Hina walked the hallway toward the meeting room. Under the morning sunlight reflecting through the cracks in the door, the silence and expectation of the executives gathered inside the meeting room greeted her. After a deep sigh, she opened the door and entered.\n\nSuppressing the feeling of not wanting to do anything this morning, Sorasaki Hina accepted the weight of the tasks she had to do once again. The fact that piles of documents and moments of decision were waiting for her was the only thing leading her into the meeting room."
 GEH_BTBOTS.3.a: "\"Another day has started.\""

 GEH_BTBOTS.4.t: "A Cup of Espresso"
 GEH_BTBOTS.4.desc: "In the evening, under the faintly flickering fluorescent lights, Sorasaki Hina sat alone in a corner of her office. Having drunk cup after cup of strong espresso amidst a whole day of administration and paperwork, she was feeling the side effects of caffeine surging through her body.\n\nHer face was stained with paleness and fatigue instead of her usual cold appearance, her fingertips trembled slightly, and her heart beat irregularly. As if all her senses had become hypersensitive due to excessive caffeine, the surrounding documents and monitor screen looked infinitely distorted. In the stillness of the quiet office, her trembling hands and fast heartbeat made the space even more eerie."
 GEH_BTBOTS.4.a: "\"Not yet, I can't.\""

 GEH_BTBOTS.5.t: "Like Glass Shards"
 GEH_BTBOTS.5.desc: "As the darkness of the evening deepened, Sorasaki Hina left the stillness of her office and turned her steps toward her personal space. The heart rate surged due to excessive espresso intake, the trembling fingertips, and the unbearable fatigue dug deep inside, and her usually firm exterior began to gradually reveal cracks.\n\nIn her home alone, her eyes were filled with emptiness and rage at some point, and the glass frame placed in a corner of the study, containing precious memories, now felt like a cruel symbol of reality to her. As suppressed solitude and heavy responsibility exploded at once, Sorasaki Hina threw that frame with all her might without hesitation. As broken glass pieces sparkled in the air and spilled onto the cold floor, the house was instantly swallowed by a cruel silence along with the shards.\n\nThis moment of rage and despair revealed all the pain and burden she had tried to hide, and an empty air where everything seemed to collapse for a moment filled the room."
 GEH_BTBOTS.5.a: "The girl felt a moment of liberation."

 GEH_BTBOTS.6.t: "First True Intent"
 GEH_BTBOTS.6.desc: "In the evening, in a corner of the office, Sorasaki Hina began treatment for caffeine addiction with Hinomiya Chinatsu's meticulous help. While her heart, which had been beating fast due to excessive espresso intake, and her trembling fingertips began to slowly stabilize, Chinatsu's calm treatment and the support of medical equipment allowed her to regain some peace.\n\nIn her momentary solitude, she felt her lost initial resolve and pride as Prefect Head slowly revive. Meanwhile, as she moved to the meeting room where executives were gathered, she carefully revealed the inner pain and fear she had hidden until now. Amidst the comfort and encouragement conveyed through wordless gazes and subtle gestures, Sorasaki Hina expressed the exhaustion and heavy responsibility she had experienced, letting go of some of her mental burden.\n\nThe warm reactions and sincere gazes of the executives gave her the strength to move forward once again. At that moment, the treatment started with Chinatsu's help and the comfort of her colleagues became a precious opportunity to regain her lost initial resolve, bringing firm determination and hope to Sorasaki Hina's inner self once more."
 GEH_BTBOTS.6.a: "But the next day, reality pressed down heavily."

 GEH_BTBOTS.7.t: "Collapsed Card Tower"
 GEH_BTBOTS.7.desc: "Late at night, as the lights in the meeting room went out one by one, Sorasaki Hina made a final decision with a deep sigh in a corner of her office. The documents piled up all day, the numerous decisions she had to protect, and even Chinatsu's meticulous help came to her as a heavy responsibility she could no longer bear. In her inner self pressed by that weight, unbearable pain and frustration piled up silently.\n\nEventually, after writing a resignation letter, she left the place without any notice. On the desk where the resignation letter was placed, traces of the once strong leader remained. In the meeting room where executives gathered, her absence was immediately detected, and those remaining were submerged in embarrassment and deep sadness.\n\nSorasaki Hina's whereabouts were not known at all after that night, and only a heavy void like her last protest remained in Gehenna Academy. Her resignation was not just a sign of departure, but a tragic choice made by a human being in the face of too burdensome responsibility and pain, which only those who remained could silently accept."
 GEH_BTBOTS.7.a: "\"Sorry. Everyone.\""
 GEH_BTBOTS_END_tt: "The §Y$GEH_three_congress_focus_no_hina$§! focus will proceed automatically."

 GEH_BTBOTS.100.t: "Determination, Crumpled Paper"
 GEH_BTBOTS.100.desc: "The night was deep, and only faint lights outside the office window were illuminating the city. Amidst the worry and conflict that had lasted for several days, Sorasaki Hina sensed that it was finally time to make a final decision.\n\nOn the desk lay the resignation letter she had not yet submitted. A few hours ago, she thought it was the only choice, but now her fingertips did not move toward that paper at all.\n\nHerself, who seemed about to collapse. The days she wanted to run away, crushed by endless work and responsibility. But if she left, who would protect this Academy?\n\nSlowly catching her breath, she stood up and approached the window. In the darkness, the unextinguished lights and the faces of students and colleagues who would be there came to mind. What they wanted from her was not a moment's rest, but the appearance of an unwavering leader.\n\nAt that moment, even in the deep confusion, a single conviction seized her.\n\nSorasaki Hina reached out and slowly crumpled the resignation letter. And she decided to move forward once again for the Academy and her colleagues.\n\nAt the sound of familiar footsteps beyond the crack in the door, she quietly turned her body. Now, she would no longer waver."
 GEH_BTBOTS.100.a: "\"I must lead.\""

 GEH_BTBOTS.101.t: "Beyond the Limit"
 GEH_BTBOTS.101.desc: "The lights in the office were still not extinguished.\n\nSorasaki Hina was buried in paperwork all night. The clock pointed to 4 AM, and her body was extremely weak due to days of work. A few hours ago, when she closed her eyes, she thought she could rest for just a few minutes. However, reality did not leave her alone.\n\nDocuments continued to pile up. Reports on student conflicts within the Academy, negotiation materials with German authorities, and numerous administrative documents the Prefect Team had to process filled her sight. They were all matters that required a decision within a few hours.\n\nHowever, her head became increasingly heavy, and her body became sluggish. It wasn't simple fatigue. The letters in front of her were blurred and distorted, and her fingertips felt numb. The more she tried to concentrate, the further her consciousness drifted, and even organizing her thoughts became difficult.\n\nThen, a small glass bottle placed on one side of the desk caught her eye.\n\nSomething she had brought in without the Prefect executives knowing. A stimulant, methamphetamine. The 'miracle drug' that German soldiers and politicians used to forget fatigue and immerse themselves in work.\n\nShe hesitated.\n\nBut at that moment, the sound of footsteps beyond the crack in the door made her tense. Someone was waiting for a decision as Prefect Head. They would not see her wavering.\n\nShe reached out. She opened the lid and took out a pill. After a deep sigh, she swallowed it without water.\n\nA few seconds later, the fatigue pressing down on her whole body began to faintly disappear. Her heart beat fast, and her head cleared. Her concentration revived.\n\nSorasaki Hina picked up the pen and documents again. The slight trembling of her fingertips was no longer strange."
 GEH_BTBOTS.101.a: "\"I still have a lot to do.\""

 GEH_discipline_system_event.1.t: "One Gehenna, One Discipline"
 GEH_discipline_system_event.1.desc: "Finally, Gehenna has become one. Pandemonium Society, commonly known as Pandemonium, has now vanished into history. The end of the long and tedious civil war did not merely mean the integration of territory. It meant that the Prefect Team's long struggle toward 'order' had achieved complete victory in both cause and reality.\n\nSince the Great Migration, all security activities of the Prefect Team were carried out amidst the interference of Pandemonium, an upper institution. Budgets were cut arbitrarily, administrative orders conflicted doubly, and all actions of the Prefect Team were criticized under the stigma of 'insubordination.' Maintaining discipline in such a situation was a grueling war of attrition, like pouring water into a bottomless pot.\n\nGehenna Intelligence's report was clear. To borrow their expression, 'the last shackle holding Gehenna back' has disappeared. All the capabilities that were being wasted on unnecessary political checks and administrative interference can now be devoted solely to maintaining security.\n\nNow the Prefect Team's authority is unique and absolute throughout Gehenna. There are no longer internal enemies to doubt or interfere with our order. The administrative system has been unified, and all the wasted power will be focused solely on setting social morals right. It was a natural result that Gehenna's discipline is maintained much more firmly than before."
 GEH_discipline_system_event.1.a: "\"Integrate everything!\""

 GEH_discipline_system_event.2.t: "What was Gained through Victory"
 GEH_discipline_system_event.2.desc: "The Eden showdown ended with our victory. The bad relationship with Trinity that had lasted for centuries finally came to an end, and Gehenna's flag was fluttering over the enemy's heartland. The shouts of victory covered the whole land, but the air in the Prefect Head's office was heavy.\n\nThe long, long war. What remained at its end were numerous sacrifices and scars of destruction. But at the same time, we gained something that cannot be exchanged for anything else. It was 'absolute justification.'\n\nUntil now, the Prefect Team always had to fight internal enemies. Conflict with Pandemonium, dissatisfied clubs, and even students who doubted our rule. Their resistance always gained strength under the massive justification of 'external threat.' But now that external threat has disappeared.\n\nWe are heroes who protected Gehenna, and guardians who brought the old enemy to their knees. Now voices opposing the Prefect Team's policies will be treated not as simple dissatisfaction, but as 'treason' disparaging the great victory. The massive military and administrative power that had been mobilized for the war will now be turned entirely inward. We can now focus all our strength on rooting out the scattered subversives and cutting off the buds of anxiety remaining in various parts of society.\n\nChaos using an external threat as an excuse will no longer be tolerated. Gehenna's discipline will become firmer than ever under the name of victory."
 GEH_discipline_system_event.2.a: "\"A great victory!\""

 GEH_discipline_system_event_tt: "§CThe interval for discipline to decrease slows down!§!"

 GEH_normal_story_event.1.t: "War with Documents"
 GEH_normal_story_event.1.desc: "\"Reports! Drafts! Approval forms! I joined the Prefect Team to fire a gun, do you think I joined to push a pen?!\"\n\nShiromi Iori's scream echoed through the Enforcement Bureau Chief's room. After Sorasaki Hina retired, the practical power of the Prefect Team naturally passed to Amau Ako, the master of administration. As a result, documents more numerous than she had seen in her life were piled up on Iori's desk like Mount Everest. To execute a single operation, she now had to go through dozens of stages of approval and reporting procedures.\n\n\"Iori-san, calm down. It's not good for your blood pressure.\"\n\nChinatsu, who happened to visit with headache pills, stopped her. But there was a person who added fuel to Iori's anger, and it was Ako.\n\n\"Oh my, Iori-san. It seems you still haven't finished writing the 'Quarterly Report on Spent Shell Casing Recycling Plans' I gave you yesterday. Tee-hee.\"\n\nAko, with a spiteful smile, placed a new bundle of fresh documents softly on Iori's desk.\n\n\"This is the 'Prior Notice Form for Noise Prevention during Operations,' so I'll ask for it by next week's training. It has to go through the Planning Bureau's review, so please write it meticulously without typos.\"\n\n\"Ugh... Gaaaaaaaah-!!\"\n\nEventually, Iori collapsed onto the desk and pulled her hair. Neither Pandemonium's Toramaru tank nor Trinity's great army could subdue her. But Ako's documents completely broke her with a single sheet."
 GEH_normal_story_event.1.a: "\"I'd rather have a gunfight...\""

 GEH_normal_story_event.2.t: "Shiromi Minori"
 GEH_normal_story_event.2.desc: "\"Documents cannot stop bullets! Administrative procedures cannot defeat the enemy!\"\n\nThe peace in the square in front of the Prefect headquarters was shattered by the sound of a megaphone held by Shiromi Iori. Standing on top of an ammunition box, she had started a protest against Amau Ako, who had emerged as a powerful next leader of the Prefect Team after Hina's retirement.\n\n\"A fussy Senior Administrator cannot be Prefect Head! Let's stop Amau Ako's approval dictatorship!\"\n\nEnforcement members mobilized by her shout reluctantly raised placards. Iori continued to raise her voice regardless.\n\n\"Respect the field opinions of the Enforcement Bureau! Oust Ako!\"\n\nMeanwhile, in the Prefect Head's office (Acting), Amau Ako was silently looking down at the farce outside the window with her arms crossed. Chinatsu, standing beside her, said worriedly.\n\n\"Iori-san... her throat will get hoarse if she keeps doing that. It's not good for her health.\"\n\nAko let out a deep sigh. Instead of arguing with Iori, she quietly picked up the telephone receiver on her desk.\n\n\"Is this the Security Department? There are personnel causing illegal assembly and noise pollution in front of the main entrance. Please process them according to regulations. Yes, it's 'Enforcement Bureau Chief Shiromi Iori.' Tee-hee.\"\n\nShortly after, while Iori was in the middle of a passionate speech, two lower-ranking Prefect members were cautiously approaching her with a 'Notice of Noise Violation.'"
 GEH_normal_story_event.2.a: "Prefect Team is in normal operation!"

 GEH_normal_story_event.3.t: "Pue-heng?!"
 GEH_normal_story_event.3.desc: "\"This data, isn't it a typo? There must have been a problem with the sample extraction.\"\n\nAmau Ako's voice was cold as ice, but it was trembling slightly. In front of her lay a 'Internal Opinion Survey Report on Suitability for the Next Prefect Head.' Her approval rating graph, which had been overwhelmingly in 1st place until just a week ago, was plummeting vertically as if jumping off a cliff.\n\nThe Planning member who submitted the report replied while breaking into a cold sweat.\n\n\"N-No, Administrator. It's an accurate figure that has undergone cross-validation...\"\n\n\"Accurate...?\"\n\nAko read down the anonymous survey answers at the bottom of the report. 'Over-emphasizes administrative procedures.' 'Doesn't know the field situation.' 'Does she intend to turn the Prefect Team into some kind of paper factory.' They were all exactly the same as those ignorant slogans Iori had been shouting through her megaphone.\n\n\"Don't tell me... that an idiot shouting a few times in front of the building changed public opinion like this... is it possible? Is this rational?\"\n\nThe perfect administrative system she had made while staying up all night, and the most efficient policies for Gehenna's future, were collapsing due to a single megaphone. For the first time, Ako felt like she had hit a massive wall called 'irrationality,' which she had never understood in her life. She crumpled the report with her trembling hands."
 GEH_normal_story_event.3.a: "\"...W-Wait. My approval rating!\""

 GEH_normal_story_event.4.t: "Stalemate"
 GEH_normal_story_event.4.desc: "The day to elect a new Prefect Head to fill Sorasaki Hina's vacancy. Unlike expected, the air in the meeting room was filled with heavy and uncertain tension instead of hope. Until just a few weeks ago, Amau Ako's succession seemed like a foregone conclusion. But Shiromi Iori's unexpected counterattack shook everything.\n\nIori's method was far from a sophisticated political offensive. She just stood in front of the headquarters with a megaphone and crudely criticized Ako's administration-centric approach. But the simple and direct slogan 'Documents cannot stop bullets' dug into the hearts of ordinary members who were exhausted by complex administrative work much more effectively than expected. Ako's approval rating plummeted.\n\nBut Iori also paid a price. Her method was seen as a 'negative propaganda' that lowered the Prefect Team's dignity and caused doubt about her qualities as a leader. Consequently, while Iori succeeded in dragging Ako down, she herself was caught in that explosion and fell along with her.\n\nNow the Prefect Team has fallen into a stalemate where two giants have fallen while wounding each other. A situation where a third way must be found, that is neither Ako nor Iori. All Prefect members were waiting for the choice that would decide their future, while holding their breath."
 GEH_normal_story_event.4.a: "Prefect Head, Himuro Sena"
 GEH_normal_story_event.4.b: "Prefect Head, Kurodate Haruna"
 GEH_normal_story_event.4.c: "Prefect Head, Kinugawa Kasumi"

 GEH_normal_story_event.5.t: "Gehenna... Hot Springs Academy?"
 GEH_normal_story_event.5.desc: "\"Final vote results... The winner, from the Hot Springs Development Department, Kinugawa Kasumi!\"\n\nThe Planning member's voice announcing the results was almost a cry. Amau Ako momentarily doubted her ears. After a tedious negative propaganda war with Iori, Prefect members eventually cast their votes for the 'third candidate.' And that third candidate was Gehenna's number one terrorist, Kinugawa Kasumi.\n\n\"Wa~hahaha! Now, everyone! How about digging a hot spring under the Prefect headquarters to celebrate the victory! I'm sure some wonderful hot spring water will come out! Now, the blasting preparations are all done!\"\n\nAs Kasumi, wearing the new Prefect Head armband, shouted while waving a detonator on the podium, the meeting room instantly turned into a mess. Enforcement members were aghast, and Planning members hid under desks. Amau Ako just stared blankly at this surreal scene.\n\nThe Prefect Team she had spent her life protecting and trying to set right... has just now passed to Gehenna's worst bomber. Ako felt her head spinning and muttered faintly."
 GEH_normal_story_event.5.a: "\"...This is a dream. I'm having a very terrible nightmare right now.\""

 GEH_normal_story_event.6.t: "Gehenna... Gourmet Academy?"
 GEH_normal_story_event.6.desc: "\"Final vote results... The winner, from the Gourmet Research Society, Kurodate Haruna!\"\n\nThe Prefect meeting room became quiet as if cold water had been poured on it. Prefect members, disgusted by the mudslinging between Shiromi Iori and her opponent, chose not 'order' or 'power,' but 'gourmet.' A candidate whose only election promises were 'total menu overhaul of the Prefect cafeteria' and 'securing regular gourmet tour budgets' has seized the heart of Gehenna.\n\n\"Tee-hee. Thank you for your wise choice. From now on, the Prefect Team will walk the path of elegant gourmet, not tasteless violence.\"\n\nThe new Prefect Head, Kurodate Haruna, smiled elegantly on the podium. Seeing that, Amau Ako began to laugh like a person who had lost her mind.\n\n\"Ha... Haha... Hahahaha!\"\n\nIori would have been better. That woman was someone who might blow up the entire Prefect headquarters just because the food 'tastes bad.' Ako sensed that all her plans, all her ideals, were now destined to vanish into a giant stomach. Gehenna's future is now treated as less important than today's lunch menu.\n\n\"...Head Hina. Are you watching. We... are doomed.\"\n\nAko stopped laughing and stared into the void with empty eyes."
 GEH_normal_story_event.6.a: "\"...This is a dream. I'm having a very terrible nightmare right now.\""

 GEH_normal_story_event.7.t: "Etiquette Regulations Manual"
 GEH_normal_story_event.7.desc: "\"That Ako girl, she's become even fussier since she became Prefect Head. How much is she going to pester people throughout the meeting!\"\n\nAs soon as the first regular meeting ended, Iori poured out complaints to Chinatsu in the hallway. At that moment, Iori's shoulders flinched at Ako's cheerful voice coming from behind.\n\n\"Oh my, Iori-san. Just in time.\"\n\nAko smiled brightly as she appeared from somewhere and handed a very thick and delicately bound book to Iori and Chinatsu. On the cover of the book, it was written in gold foil like this: <Etiquette and Speech Regulations Manual for Executive Meetings Under the New Prefect Head System (1st Ed.)>\n\n\"It's a regulation manual I made while staying up all night for smooth communication and organizational harmony. From now on, all executives must be seated 10 minutes before the meeting starts, and when speaking, they must use the honorific 'Respected Prefect Head,' and their attire should be tidy, and speeches should not exceed 3 minutes...\"\n\nWhile Ako explained the endless regulations, Iori looked at her with an expression as if she had met a creature she had never seen before.\n\n\"...Oh, and unnecessary objections to superiors may be considered 'acts of hindering organizational harmony,' so please be careful. Well then, please familiarize yourself and I'll see you at the next meeting. Tee-hee.\"\n\nAfter Ako disappeared with a refreshing step, Iori stared blankly down at the encyclopedia-thick book in her hand. Chinatsu, who was leafing through the manual beside her, said nonchalantly.\n\n\"It's systematically well-organized. I will refer to it for work.\"\n\nIori couldn't say anything. This was the 'reconciliation' Amau Ako spoke of. A perfect reconciliation through ruthless discipline and procedure, scarier than guns and swords."
 GEH_normal_story_event.7.a: "\"Is this... reconciliation...?\""

 GEH_normal_story_event.8.t: "For Whom"
 GEH_normal_story_event.8.desc: "\"You haven't left work yet, Administrator Ako.\"\n\nLate at night, Hinomiya Chinatsu quietly entered Ako's office. Amau Ako, without answering, just stared down at the registration documents for the Student Council President candidate. Gehenna's top administrative expert, Hina's most capable successor. Everyone regarded her as the next Student Council President. But Ako herself hadn't been able to fill in even a single line of the documents.\n\n\"…I have never, Chinatsu-san, once thought that I work for 'Gehenna.'\"\n\nFor the first time, Ako revealed her weak inner thoughts.\n\n\"The reason I stayed up all night reviewing documents and planning budgets was all... to lighten the burden for Head Hina. So she could sleep comfortably, so she could smile. That was all. But can I, for these unspecified numerous students, take on all this burden for a Gehenna where she is no longer present? Am I a person who has the right to do that?\"\n\nChinatsu quietly listened to her. And then she asked calmly.\n\n\"There are surely many ways to honor Head Hina. There's a way to directly lead the 'nation' she tried to protect and continue that legacy, and maybe there are other ways. What's important is what path 'Amau Ako' you want to take, not others' expectations.\"\n\nAfter Chinatsu left, Ako was alone again. She looked alternately at the vast night view of Gehenna spread past the window and the documents on the desk. The world Hina wanted to protect. What is the best she can do for that world? Ako finally picked up the pen."
 GEH_normal_story_event.8.a: "\"This Gehenna that Head Hina wanted to protect... now I will.\""
 GEH_normal_story_event.8.b: "\"...Maybe, another path.\""

 GEH_normal_story_event.9.t: "Gehenna Morning Star Bureau, and Senior Administrator Shiromi Iori"
 GEH_normal_story_event.9.desc: "\"What... is this situation right now?\"\n\nShiromi Iori couldn't accept reality even after seeing the nameplate in front of her. 'Senior Administrator Shiromi Iori.' A few days ago, Amau Ako suddenly declared her non-candidacy for the Student Council President election and simultaneously resigned from her position as Senior Administrator. And as her successor, for some reason, she appointed Shiromi Iori. She sat her, who only knows how to fire a gun, in the highest position of administration.\n\n\"That woman stepped down quietly? No way. There must be some scheme.\"\n\nIori couldn't understand Ako's resignation at all. She looked like she was aiming for the Prefect Head position so much. She thought she was a woman crazy for power. This is surely a trap. While Iori was burning with alertness thinking that, an even more absurd report came up.\n\n\"Gehenna... Morning Star Bureau?\"\n\nA mysterious organization Ako established after resigning. The name itself was suspicious. Morning Star Bureau? Is it some kind of cool-named assassin unit? Or a secret society? Iori developed all sorts of conspiracy theories, but the content of the report was even more amazing. 'A scholarship foundation and talent cultivation institution.'\n\n\"Scholarship...? Is she playing a joke on me right now!\"\n\nGiving up power and suddenly becoming an educator? As Iori was pulling her hair over Ako's incomprehensible actions, a Planning member cautiously entered with a mountain of documents.\n\n\"Um... new Senior Administrator? Here's the quarterly budget settlement report you need to review...\"\n\nIori blankly stared at the massive mountain of documents held out toward her. Whatever Ako's real purpose was, one thing was certain. She was now in the worst hell of her life."
 GEH_normal_story_event.9.a: "...Let's start from the beginning for now."

 GEH_normal_story_event.10.t: "The Masterless Throne"
 GEH_normal_story_event.10.desc: "The curtain has risen on the Student Council President election that will open a new era for Gehenna. But its beginning was not a hopeful march, but chaos itself. Because the most likely candidate everyone took for granted, Amau Ako, suddenly disappeared behind the stage declaring non-candidacy and resignation.\n\nThe election board, where the absolute powerhouse had disappeared, instantly turned into a massive festival ground for ambitious people.\n\n\"Let's end the tyranny of the Prefect Team and build a delicious Gehenna! A vote for the Gourmet Research Society!\"\n\"Hot springs throughout Gehenna! Hot spring welfare for all students! The Hot Springs Development Department keeps its promises!\"\n\"A strong Gehenna with nutrition-packed meals from the School Lunch Club!\"\n\nCandidates no one expected are one by one throwing their hats into the ring. The square was filled with the sound of campaign workers from each club and group shouting their slogans, and posters containing mysterious promises were pasted over like paint. It was an election far from order, truly 'Gehenna-like.'\n\nPrefect members watched this chaotic scene with a complicated heart. If Ako were here, she would have organized all this and promised a stable future. But she is no longer here. Now the Prefect Team is in a position where they must choose the candidate who is at least 'better' and won't lead Gehenna into the worst situation in this chaos."
 GEH_normal_story_event.10.a: "Yozakura Kirara, Elected"
 GEH_normal_story_event.10.b: "Aikiyo Fuuka, Elected"

 GEH_normal_story_event.11.t: "Age of Reason"
 GEH_normal_story_event.11.desc: "As Amau Ako decided to run, the Student Council President election board that had been in chaos was organized in an instant. She did not shout flashy slogans or incite the public. Instead, she published hundreds of pages of specific policy reports for Gehenna's future and meticulously crushed the emotional claims of other candidates with cold data and logic at debates.\n\nStudents who at first questioned her stiff attitude also began to realize that what Gehenna needed was 'stability,' not a festival. The election result was overwhelming. Amau Ako was elected as the inaugural Student Council President of Gehenna.\n\nOn the day of the inauguration, Ako ascended the podium and began her speech in a calm voice that was not swayed by emotions.\n\n\"Students of Gehenna. You chose not my flashy eloquence, but the specific plans I presented. This is evidence that we all crave order, not chaos anymore, and reason, not emotion.\"\n\nShe paused for a moment and looked around the students filling the square.\n\n\"Upon the great legacy left by former Prefect Head Sorasaki Hina, I promise. From now on, Gehenna will move by a transparent and rational system, not by the unpredictable charisma of a hero. A nation where every student is equal under the law and is guaranteed fair rewards for their efforts. That is the new Gehenna I want to make.\"\n\nAs her speech ended, instead of fanatical cheers, sounds of applause filled with firm trust and hope for the future echoed through the square. The age of heroes is gone, and finally the age of administrators has arrived."
 GEH_normal_story_event.11.a: "Gehenna's Democracy Returned Once More"

 GEH_normal_story_event.12.t: "Arresting the Instigator?"
 GEH_normal_story_event.12.desc: "\"Here it is! The workshop of the subversive(?) who wrote a play insulting Head Hina!\"\n\nWith Amau Ako's shout, Prefect members kicked open the door of the old theater. A play that started to become popular among Gehenna students after Hina's retirement, 'The Woman with Iron Skin.' It portrayed Hina as 'a fragile human suffering behind the mask of a perfect Prefect Head,' and was drawing the ire of Prefect executives including Ako. Finally, they found the hideout of the instigator who wrote the play.\n\n\"Don't move! It's the Prefect Team! Hands in the...\"\n\nAko, who jumped onto the stage that looked like a workshop, couldn't continue her words. There sat a person surrounded by numerous scripts and bundles of crumpled paper, holding a pen. A person so familiar, yet who should not be here.\n\n\"...H-Head Hina?\"\n\nThe one who turned her head was Sorasaki Hina. She smiled faintly toward her former subordinates who had come to find her, holding a pen instead of a gun.\n\n\"Ako. You're loud... you're bothering me while I'm writing.\"\n\n\"W-Why... is the Head writing such a play... This is an insult to the Head! O-Or since she wrote it herself...? Eh?\"\n\nAs Ako shouted in confusion, Hina quietly shook her head.\n\n\"Because... I couldn't bear it if I didn't wear a mask. This isn't an insult, Ako. It's just... my story.\"\n\"When I was Prefect Head, every choice decided Gehenna's fate, but here... I just write the ending I want. It's much more comfortable.\"\n\nThere was no longer the responsibility of a Prefect Head or the suffering of a commander on her face. Only the tranquility of a person completing her own story remained. Ako only then realized that the husk of the 'Iron Prefect Head' they tried to protect was an armor she had shed herself.\n\nHina was no longer the Prefect Head. She was an author."
 GEH_normal_story_event.12.a: "Pue-heng?!"

 GEH_celestial_revolution_event.1.t: "Funeral Overture for a Fossilized Prayer"
 GEH_celestial_revolution_event.1.desc: "Tongues of flame were licking the papers of an old age. The square in Cologne became a giant altar, and upon it, centuries of intelligence, art, and history were scattering into the night sky as black butterflies. The sound of the crowd's song calling 'Hina's' name mixed with the flames burning in irregular rhythms, echoing like an eerie chant announcing the end of the age of reason.\n\n\"Behold that stone tomb!\"\n\nAn executive of the Revolutionary Committee shouted in a piercing voice. His finger pointed toward the Cologne Cathedral, revealing its massive silhouette in the darkness beyond the flames.\n\n\"That is not a prayer toward God, but an obsession toward time fossilized! That solidity, that arrogance toward eternity is the very crystallization of the old thought that couldn't bear our absent sun, Sorasaki Hina, and exiled her! Rebellion dwells even in stone and wood! We must incinerate all memories of this land and create a conceptual vacuum for her to return to! Dismantle that monument of decadence without leaving anything and return it to atoms!\"\n\nThe crowd moved as one will. The fire of purification now began to covet the altar itself beyond the sacrifice. The massive stone structure shed black tears, and the spires that used to pierce the sky finally bent after offering meaningless prayers. A symphony of collapse. It was not a performance of destruction, but a gray overture for a new era.\n\nIn the square where ashen snow was falling, students danced while swept by religious ecstasy. The emptied sky. That void was the new sanctuary where the God they waited for would descend."
 GEH_celestial_revolution_event.1.a: "We shall start again from nothing."

 GEH_celestial_revolution_event.2.t: "The Deluge"
 GEH_celestial_revolution_event.2.desc: "Hina's disappearance was merely a fuse. The anger of ordinary Prefect members who were tired of the endless power struggle between the Enforcement and Planning Bureaus, the poor who groaned in chaos, and the weak who were forgotten in the lowest places finally exploded. The newly seized 'National Salvation People's Committee' stood by in silence as this whole chaos unfolded, speaking of 'People's judgment on the traitors who harassed Head Hina.'\n\nThe Planning executive dragged out to the street didn't understand why he was being hit. In front of him were not revolutionaries, but citizens with hungry faces and lower-ranking Prefect members with gazes of contempt. \"While you bastards sat at desks and fought for power, we starved!\", \"Your fancy paperwork made Head Hina leave!\" There was no logic. Only primal rage poured over his face.\n\nIn the armory, insubordination occurred. Tired-faced ordinary members surrounded an Enforcement officer. \"How many colleagues did you drive to their deaths for your glory!\", \"With that strong gun, why couldn't you protect even one Head!\" Fists mixed with resentment and betrayal covered the person who was once their superior.\n\nReports were pouring in, but the National Salvation People's Committee did not move. They called this purification of blood the 'Will of the People.' Thus, the brain and heart of the Prefect Team were torn apart and paralyzed by the anger rising from the lowest places. The rebellion of the weak, which no one had expected, was now becoming a monster no one could control, swallowing Gehenna."
 GEH_celestial_revolution_event.2.a: "A furnace to melt the nation and forge it anew."

 GEH_celestial_revolution_event.3.t: "Guillotine of the Old Regime"
 GEH_celestial_revolution_event.3.desc: "Law disappeared, and only the 'Will of the People' became the unique standard of judgment. The blade of the judiciary seized by the People's Committee finally aimed at the heart of the old regime. The former main meeting room of the Prefect Team now became a 'People's Court,' and Amau Ako and Shiromi Iori stood in the dock. The one who prosecuted them was a once-nameless zealot who came forward in the name of the National Salvation People's Committee.\n\n\"Defendant Amau Ako! You ensnared Head Hina's mind with a maze of complex documents, and Defendant Shiromi Iori! You gnawed away at the Head's soul with the noise of endless gunshots! The endless power struggle between you two was the biggest sin that pushed our great leader into the abyss of despair! You two are the first-class 'reactionaries' this revolution must overthrow!\"\n\nAko tried to open her mouth to argue procedural legitimacy, but was silenced by the sound of the judge's gavel. Iori spat out curses and called them the 'real traitors,' but her voice was buried in the shouts of ordinary Prefect members and citizens filling the court. The verdict was already set.\n\n\"Sentenced in the name of the National Salvation People's Committee! For the sin of dividing the Prefect Team and leading to Head Hina's disappearance, both are stripped of all positions and authority as Prefect executives as of today!\"\n\nNow that Hina is absent, there was no legal legitimacy to this verdict. But that was not important. This was a revolution, not law. The two people who were the brain and fist of the Prefect Team now became 'traitors' who lost everything overnight."
 GEH_celestial_revolution_event.3.a: "Toward the New System."

 GEH_celestial_revolution_event.4.t: "All for All"
 GEH_celestial_revolution_event.4.desc: "Order is dead. And upon its corpse, hundreds of freedoms were holding a festival. With the final declaration of the National Salvation People's Committee, the central power apparatus was officially disbanded. Now Gehenna Central District square was filled with the sound of songs containing each person's desires, the sound of fireworks, and the smell of food, instead of unified slogans.\n\nThe one who ascended the temporary podium was not a specific leader, but a nameless student randomly drawn from various councils. She began to read the 'Commune Creation Declaration,' incoherent but full of passion.\n\n\"Comrades! Why did Sorasaki Hina sacrifice herself! It is because the old shell of 'order' called the Prefect Team and Pandemonium suppressed the original 'freedom and chaos' of Gehenna! She became a martyr herself to liberate us from all things that suppress us!\"\n\nThe square chanted the names of 'Freedom' and 'Hina.' Hina was now being reborn as a liberator for chaos, not a guardian of order.\n\n\"Therefore, we break the old centralized shell and declare that all power has returned to its respective owners! From today, Gehenna is reborn as the 'Gehenna Commune,' an alliance of the Hot Springs Development Department, the Gourmet Research Society, the School Lunch Club, and numerous labor unions and autonomous councils! Every club is free, every council is equal, and every individual is a sovereign in their own right!\"\n\nAs the declaration ended, the square exploded not with a unified shout, but with hundreds of different slogans and songs. The Gourmet Research Society fired celebratory shots, and the Hot Springs Development Department finally blew up a small hot spring in a corner of the square.\n\nIs this truly the world Hina wanted? No one asked. They believed that in this noisy freedom they had liberated, she could finally sleep peacefully. The first day of the Gehenna Commune thus drew to a close amidst hope and madness."
 GEH_celestial_revolution_event.4.a: "Long live the Academy of Chaos and Freedom!"

 GEH_celestial_revolution_event.5.t: "The Saint's Legacy"
 GEH_celestial_revolution_event.5.desc: "In Gehenna, where the flames of madness and purification had subsided, a quiet dawn arrived. The protagonists of the revolution gathered at the white memorial newly built to commemorate Hina. Their faces bore a solemn resolve toward reconstruction, no longer the heat of destruction.\n\nThe one who ascended the podium was the last spokesperson for the National Salvation People's Committee. She opened her mouth with a calm and clear voice.\n\n\"We destroyed the old world that gave birth to her absence. Now we must build a new world she won't be ashamed to return to. The path we will follow is 'Sorasakism.' It is neither left nor right, but making the sublime spirit toward responsibility, devotion, and order into a way of life. Head Sorasaki Hina's actions themselves are our constitution and doctrine.\"\n\nShe took a breath and declared firmly.\n\n\"Thus, having fulfilled the duty of the Revolutionary Committee, we declare the creation of 'Saint Gehenna Academy' as of today!\"\n\n\"However, as Head Sorasaki Hina did, the one who leads this holy academy must be proven through legitimacy, not fanaticism. Following her will, we will elect our leader directly with our own hands. We begin the first election to pick the inaugural Student Council President of Saint Gehenna Academy!\"\n\nAt that moment, what filled the memorial was not fanatical shouting, but thunderous applause filled with hope. It was like the sound of applause of pilgrims who finally found the way. The age of destruction is over. Now they will build a new era upon Hina's legacy."
 GEH_celestial_revolution_event.5.a: "Hatami Erika."
 GEH_celestial_revolution_event.5.b: "Hinomiya Chinatsu."
 GEH_celestial_revolution_event.5.c: "Aikiyo Fuuka."

 GEH_celestial_revolution_event.6.t: "Return of Order"
 GEH_celestial_revolution_event.6.desc: "The era of chaos is over. The square regained silence, and within the extinguished ashes of the revolution, a new order was sprouting. The National Salvation People's Committee disbanded after completing its last mission, and its place was taken by a new governing body named 'Sorasaki Hina Committee.' They were the most traditional and authoritative people, following the exact way Hina ruled in the past.\n\nThe Committee declared the establishment of the 'Second Order State' as its first decree.\n\n\"What caused our savior, Head Sorasaki Hina, to despair was disorderly freedom and decadent culture! We will inherit the perfect order she tried to establish and eternally root out all 'reactionaries' who threatened her!\"\n\nThe new order began with perfectly duplicating Hina's past rule. All ordinances she had signed were revived, and all crimes she had punished were dealt with more heavily. The scope of 'reactionaries' was infinitely expanded, so anyone who even slightly questioned the Committee's decision was all judged by bringing up their past sins.\n\nNow only one voice existed in Gehenna. It was not the voice of a living leader, but Hina's ghost revived from past records. The 'Sorasaki Hina Committee' became her most perfect imitator, completing a state of order as cold and perfect as ice."
 GEH_celestial_revolution_event.6.a: "In her name, eternal order."

 GEH_celestial_revolution_event.7.t: "I'm on vacation"
 GEH_celestial_revolution_event.7.desc: "Everything was noise. The fanatical praise of the zealots, the attempt to make her a god, and the madness that eventually spread into a revolution burning all of Gehenna. Sorasaki Hina ran away from all of it. Trying to ignore what chaos her single resignation letter brought, she was just quietly breaking down on a quiet beach of a nameless continent.\n\n\n\n\n\nThe sound of the waves was peaceful, and the sound of the seagulls was leisurely. Hina pretended to read a book past her sunglasses, but in fact tried to think of nothing. Then, a silhouette familiar but that should not be here entered under her parasol shadow. Hina reflexively raised her head.\n\n\"...Eh?\"\n\nThe other person also hesitated and looked at her. A long and awkward silence flowed between the two. The one who opened her mouth first was the other person.\n\n\"...By any chance, are you Sorasaki Hina... san?\"\n\nHina stood up from her seat before she knew it. The person who could call her name, which would be listed on a wanted poster, in this place was only one person.\n\n\"…General Student Council President?\"\n\nThe two people who disappeared after throwing Kivotos into chaos met by chance on a beach on the other side of the Earth. The General Student Council President smiled awkwardly and shook her hand.\n\n\"I'm just an ordinary student here. What about you... what brings you here?\"\n\"Vacation... and you...\"\n\"Me too, similar. In various ways...\"\n\nAn awkward silence flowed again. About the horrific revolution happening in Gehenna, about the chaos Kivotos was experiencing, the two said nothing. Like awkward acquaintances who bumped into each other in the neighborhood by chance, they just looked at each other's reactions.\n\nThe one who broke the silence first was again the General Student Council President.\n\n\"Um... there's a gelato shop nearby, by any chance...\"\n\n\"...Yes.\"\n\nHina answered shortly. In Gehenna, a horrific revolution to purify the world in her name was continuing, and in Kivotos, the chaos due to her absence was continuing. But on this beach in Australia, both were just 'on vacation'."
 GEH_celestial_revolution_event.7.a: "The two walked side by side toward the gelato shop."

 GEH_iori_story_event.1.t: "National Harmony"
 GEH_iori_story_event.1.desc: "Pandemonium is gone. But has true peace come to Gehenna? Late at night, the light in the Prefect Head's office was not extinguished. Sorasaki Hina stood motionless with a pen in the middle of a mountain of documents. The 'War Ministry' and 'Systematic Militarization' led by Iori surely succeeded in toppling Pandemonium. However, the price of victory was harsh. Problems suppressed under the wartime system were rushing in like a dammed river. Endless petitions from Germans, accumulated dissatisfaction of students regarding military discipline, the awkward and heavy silence of streets where gunshots had ceased.\n\n\"Head, are you staying up all night again.\"\n\nHinomiya Chinatsu, who had approached before she knew it, handed her a warm tea with a worried voice. Her eyes were full of concern for Hina's health.\n\n\"Recently the number of members complaining of mental pressure to the Medical Bureau is increasing. We won... but everyone seems exhausted. The same goes for you too, Head.\"\n\n\"...It's okay, Chinatsu. I just have something to think about.\"\n\nHina accepted the teacup, but her gaze was toward the dark city outside the window. Iori's method was surely effective. But what remained at its end was only an uneasy order ruled by fear. Hina was feeling that air more heavily than anyone.\n\n\"We made Gehenna like this... to protect the academy. But in that process, we overlooked too many things. You can't rule everything with power alone. Especially if you try to suppress those with different backgrounds only with power, they will eventually turn their backs on us. That's not what we want.\"\n\nAll this was also her responsibility. Because she was the one who condoned Iori's radical militarism and even sympathized, making Gehenna what it is now.\n\n\"I... must atone. I must set right the things we broke and achieve 'harmony' in its true sense. For the students of Gehenna... and all the Germans who will be with us.\"\n\nHina stood up as if she had finally decided. Her eyes were firmer than ever. They were the eyes of a ruler responsible for the country's future, not a soldier commanding a war."
 GEH_iori_story_event.1.a: "\"Was politics something this complex?\""

 GEH_iori_story_event.2.t: "Refresh"
 GEH_iori_story_event.2.desc: "\"Shiromi Iori. As of this time, all your duties as Enforcement Bureau Chief are suspended.\"\n\nThe air in the Prefect Head's office was cold as ice. At Sorasaki Hina's low but firm declaration, Iori momentarily doubted her ears. She shouted while slamming the desk with her palm.\n\n\"What?! Are you joking, Hina! What did I do wrong! I smashed the heads of those Pandemonium bastards and unified Gehenna! But now you're saying my duties are suspended?!\"\n\nAmau Ako, who had been silently holding a file until then, spoke coldly.\n\n\"Don't make a scene, Shiromi Iori. As the head of the War Ministry, you led indiscriminate conscription under the pretext of war with Pandemonium, the distribution of malicious propaganda to 'inject hostility against Pandemonium,' and systematic persecution toward German minorities. All are criminal acts that can never be tolerated under the name of the 'Gehenna Prefect Team.'\"\n\n\"You're saying what's written on that scrap of paper is my charge? They were things that obviously had to be done to win the war! You bitch sat at a desk and pushed a pen, so of course you wouldn't know!\"\nJust as the enraged Iori was about to lunge at Ako, Hina's voice stopped her.\n\n\"Stop, Iori.\"\n\nHina stood up and looked at her long-time colleague with tired eyes.\n\n\"I know you fought for Gehenna. More than anyone. But that method... made us all monsters. We are a Prefect Team that keeps discipline, not a warlord that spreads hatred. My responsibility for not being able to stop your rampage is also big. So this isn't a disciplinary action for you alone. It's a first step to set right the mistakes we committed and to wipe away this blood-stained smudge.\"\n\nIori couldn't understand Hina's words. She didn't want to understand either. It felt like all her devotion was being denied. In the end it was all for Hina, but that Hina was pointing a blade at her.\n\n\"...Traitor.\"\n\nWith the word Iori spat out with contempt, Hina turned her head.\n\n\"Take her away.\"\n\nPrefect members grabbed Iori's arms with firm expressions. As the office door closed and the voice of fierce resistance disappeared down the hallway, Hina leaned her body on the chair with a deep sigh. The path to wiping away the blood-stained smudge was this painful."
 GEH_iori_story_event.2.a: "Redefining the relationship."

 GEH_iori_story_event.3.t: "Bleeding Bird"
 GEH_iori_story_event.3.desc: "\"Therefore, all investigations regarding Enforcement Bureau Chief Shiromi Iori and the War Ministry are dismissed.\"\n\nThe air in the Prefect meeting room was heavily sunken. Hina's declaration was the final conclusion regarding the 'Report on the Side Effects of the Wartime System' submitted by the Planning executives. The report was sharply pointing out the evils born of Iori's militarism. The resentment of students over indiscriminate conscription, distrust due to malicious propaganda, and the deepening hostility of German residents.\n\n\"Doesn't the result speak for everything? We won! There's no need to listen to those bastards whining at their desks!\"\n\nIori spoke sharply at the opposition with a satisfied smile. Ako stood up with an expression as if she couldn't believe it.\n\n\"Head! But the content of the report is a clear fact. Arbitrary acts that ignored discipline and procedures must surely be set right. At this rate, trust in the Prefect Team will collapse!\"\n\nEveryone's gaze turned to Hina again. Hina quietly closed her eyes, and then, as if she had made a decision, looked around the meeting room with cold eyes.\n\n\"I won't say there were no mistakes. The method was rough, and sacrifices followed. But thanks to that, we survived and unified Gehenna. Punishing the sword we used for victory now is just an act of denying all our struggles. That will only give birth to greater division and chaos.\"\n\nHina stood up and declared toward the whole meeting room.\n\n\"What we need now is not judgment on the past. To settle this chaos and move toward the future… a more powerful and absolute order is needed. Therefore, I extend the emergency executive power indefinitely. All decisions of the Prefect Team are made only through me, the Prefect Head. I won't take objections.\"\n\nAko's face turned white and hard, and sighs burst out among the Planning members. On the other hand, a smile of victory spread on the faces of Enforcement members including Iori. Hina thought while receiving the gaze of resentment and cheering at the same time. If the students of Gehenna turn their backs… I must find a new place to lean on. Even if that subject is those foreigners we've suppressed with gun barrels until now."
 GEH_iori_story_event.3.a: "\"If it's for order... I'll gladly be a dictator.\""

 GEH_iori_story_event.4.t: "Harmony, Fatherland, Solidarity"
 GEH_iori_story_event.4.desc: "Gehenna-Deutsche Federation Creation Day. The square in Munich was full of orderly crowds. Hina watched that scene with a cold expression from a place slightly away from the podium. The speech and commemorative event were proceeding smoothly as planned. The protagonists of today were not the politicians on the podium, but the new 'people' filling this square.\n\nEventually it turns out like this. Hina muttered faintly. The fierce backlash and protest of Gehenna students on the day she advocated for Iori and declared emergency executive power were what she had expected. Their loyalty was ultimately just a conditional support, heading only in the direction they wanted. It was not worth protecting. Hina did not hesitate to discard the old support base.\n\nInstead Hina gained something new. The faces of those numerous Germans filling the square. The 'Universalism Charter' was a salvation and a promise to them. The streets once full of gunshots and distrust now regained stillness within the stability guaranteed by the state. This was the result she chose. A perfectly controlled harmony gained by paying old loyalty as a price.\n\nAt that moment, someone carefully pulled the hem of Hina's coat. As she turned her head, a blonde little German girl, who would have just turned eight, was looking up at her with eyes full of fear. In the child's hand was a single small and simple wildflower.\n\n\"…This, for you.\"\n\nThe child whispered while holding out the flower in clumsy Kivotos language. The German parents who were nearby were about to run over in a panic at the child's sudden action, but Hina restrained them with a hand gesture. She slowly lowered her body and met her eyes with the child. In the child's eyes, not the appearance of the 'Prefect Head' as an object of fear, but just the appearance of one person was reflected.\n\n\"Thank you. What is your name?\"\n\nHina accepted the flower while smiling sincerely for the first time in a very long time. The touch of the small wildflower in her hand. It made her feel simultaneously the sadness for the numerous things she couldn't protect, and the weight of the single value she finally protected regardless. With this one small flower, that was enough."
 GEH_iori_story_event.4.a: "\"Yes, this is enough.\""

 GEH_iori_story_event.5.t: "Gehenna Student Council President Election. Perhaps for the First Time."
 GEH_iori_story_event.5.desc: "\"Final 개표 results, total number of voters...\"\n\nGehenna Central District square was wrapped in a suffocating silence. For the first time since the Great Migration, the election to pick a new Student Council President according to the most democratic procedure specified in the 'Gehenna School Rules' ended. It was the last stage of Sorasaki Hina's reform to investigate Shiromi Iori's war crimes, dismantle the militarized system, and return to the 'original Prefect Team.' All of Gehenna was stirred by the unfamiliar experience of picking a leader with students' hands, not by dictatorship and rule.\n\n\"…No majority winner. As a result of the runoff vote, Candidate Number 1 Sorasaki Hina, with a vote rate of 46.4%, confirms her election!\"\n\nAs Ako's calm declaration echoed through the entire square via speakers, finally cheers and sighs crossed and burst out. Hina silently watched that scene from below the podium. It was not an overwhelming victory. Rather, the expression that she barely won was accurate.\n\nThis election was a mirror showing the divided reality of Gehenna as it is. Natsume Iroha, from the old Pandemonium and putting forward her ability as an administrator, took 2nd place with a vote rate of as much as 38.2%, threatening Hina. This was clear evidence that numerous students tired of militarism were craving a new alternative other than the Prefect Team. And what made everyone aghast was the vote rate of Shiromi Iori, who pushed through her candidacy even while being investigated as a war criminal. Based on the solid support of the Enforcement Bureau, she gained 6.4% of the votes, which can never be ignored. It was proof that the hardline faction has not died yet and can raise its head again at any time.\n\n\"Head... no, President. Please go up to the podium.\"\n\nAko approached and said low. Hina nodded and slowly went up the stairs. Cheers and boos toward her, and indifferent gazes. This scene where everything was mixed was the appearance of 'normal Gehenna' she wanted. The past fanaticism where everyone blindly followed her alone was no longer there. Instead there were living voices that doubt, criticize, and sometimes oppose. Accepting this bitter and noisy reality. That was the true atonement for the past and the new start Gehenna would take. Hina stood in front of the microphone and spoke calmly toward all students who selected her, and those who did not."
 GEH_iori_story_event.5.a: "\"Everyone, thank you for believing in me.\""

 GEH_iori_story_event.6.t: "Harmonious Army"
 GEH_iori_story_event.6.desc: "\"Loyalty!\"\n\nAt the old parade ground in Munich, under the unfamiliar Black-Red-Gold flag, the loud voices of German soldiers in gray uniforms echoed. The old Wehrmacht officer, who just a few months ago was being searched while being branded as a 'Nazi remnant,' now became the commander of the 'Bavarian 12th Infantry Regiment under Gehenna' and was receiving a salute on the review stand. It was an ironic scene, but no one laughed.\n\nThe 'Universalism Charter' Sorasaki Hina declared was not a simple declaration. It was a contract granting Germans practical rights and responsibilities simultaneously. Equal conscription of the German ethnicity, and full citizenship and autonomy given as a price. There were no voices of doubt. There were those who mocked in the shadows, saying it was 'the whim of a dictator that might stab us in the back at any time.' But their voices gradually subsided.\n\nAs the review ended, the commander offered a salute once again toward the flag of Gehenna, which had now become their fatherland. This was not a submission. It was the resolve of those who gained the opportunity to protect their family and hometown with their own hands. Their loyalty was no longer an object of doubt. It had already become the most solid cornerstone within Gehenna's new order."
 GEH_iori_story_event.6.a: "Gehenna Army marches!"

 GEH_iori_story_event.7.t: "Reaction to Harmonism"
 GEH_iori_story_event.7.desc: "The rumor was true. Shiromi Iori, who was the iron fist of the Prefect Team, was ousted, and the War Ministry she led was disbanded. As that news spread throughout Bavaria, cautious relief and deep anxiety simultaneously bloomed among Germans. And today, Prefect Head Sorasaki Hina announced the start of a new era through a radio speech.\n\n\"…The essence of the Prefect Team is the protection of discipline and order. Recently we have been away from that essence. Setting right this mistake and ensuring all students of Gehenna and residents of this land can enjoy a stable life is my duty.\"\n\nHina's voice was tired, but contained unwavering resolve. She declared the creation of the 'Gehenna National Harmony Solidarity,' stating it is a policy that prioritizes internal stability and reconstruction, not military expansion. Many Germans breathed a sigh of relief at the fact that the gale of militarism had stopped.\n\nBut the statement of Medical Bureau Chief Hinomiya Chinatsu that followed the speech cooled that relief to a chill.\n\n\"The Prefect Team's order is applied fairly to everyone. The safety of all those who comply with and cooperate with the new harmony system will be guaranteed. However, any attempt to disturb discipline will not be tolerated. Because we won't repeat the mistakes of the past.\"\n\nThe German public realized. This was not a hand of harmony. It was the start of a more sophisticated and systematic rule. In the place where the blood-stained military boots disappeared, now a cold surgical scalpel was placed. They had to accept this cold peace brought by the new 'harmony' without any choice."
 GEH_iori_story_event.7.a: "...At least it's better than before, isn't it?"

 GEH_iori_story_event.8.t: "Reaction to Harmonism"
 GEH_iori_story_event.8.desc: "Gehenna was in shock. Sorasaki Hina personally protected her long-time colleague Shiromi Iori and declared 'emergency executive power,' seizing absolute power. Fierce backlash and condemnation from Gehenna students headed for the Prefect headquarters, but Hina did not blink an eye. Instead, she reached out toward the Germans, breaking everyone's expectations.\n\n\"The enemies and allies of yesterday are meaningless. From today, Gehenna's citizens will be distinguished only by loyalty.\"\n\nHina's voice echoing through the radio was cold as steel. Declaring the creation of the 'Gehenna National Harmony Solidarity,' she announced that she would have German representatives participate in the National Harmony Solidarity. It was also continuously announced that German autonomy would be guaranteed, they would have equal property rights, and the Prefect Team's monitoring would be relaxed. It was a clear deal offered to Germans at the price of giving up the support of Gehenna students.\n\n\"Must we believe this? The one who suppressed us is acting as a savior overnight!\"\n\nA German politician was enraged, but his voice was buried in the stir of the crowd. Hina's proposal was too sweet. Because it was a promise to give 'power' to those who were suppressed. Even amidst doubt and distrust, the public opinion of the German society quickly tilted toward the irresistible opportunity.\n\n\"We have no choice. Even if the hand she reached out is a poisoned chalice, we have to drink it for now.\"\n\nEventually German representatives decided to accept Hina's proposal. This was not trust, but a cold contract for each other's survival. Standing on the dictator's side in exchange for guaranteeing the ethnic group's survival. They decided to bet everything on the gamble of history."
 GEH_iori_story_event.8.a: "...The National Socialist Bavarian Workers' Party is disbanded as of today."

 GEH_iori_despotic_story_event.1.t: "Under Gehenna's Flag - 1"
 GEH_iori_despotic_story_event.1.desc: "The heavy steel door of the meeting room closed with a roar. Prefect executives who were in confusion due to Sorasaki Hina's disappearance shut their mouths at that sound. Fully armed Enforcement members entered in perfect order and sealed all exits. As gun barrels pointed toward the inside of the meeting room, the air was instantly filled with cold intimidation. Shiromi Iori, who walked briskly to the podium, grabbed the microphone.\n\n\"Why did Head Hina collapse? Because she was listening to the complaints of those weak German bastards! Because she was suffering from the endless paperwork of the Planning Bureau! Because we forgot our identity as 'Kivotosians' and tried to mix with low-life foreigners!\"\n\nIori's shout was anger itself. She declared toward the aghast executives.\n\n\"No more chaos will be tolerated! In the name of the Prefect Enforcement Bureau, I declare a state of emergency across all of Gehenna as of this time! All members standby. From now on, anyone trying to leave through this door will be regarded as a traitor who abandoned Head Hina, and will be arrested on the spot!\"\n\nThe sound of Enforcement members cocking their guns echoed through the meeting room. What broke that murderous silence was Amau Ako's voice. She stood up and glared at Iori without a bit of fear.\n\n\"This is a rebellion, Shiromi Iori. You are just using Head Hina's tragedy as a justification to fill your low-life lust for power.\"\n\n\"Arrest that woman!\"\n\nIn the moment Iori's command fell, a flashbang exploded in a corner of the meeting room, blinding everyone. In the chaos, several Planning members intentionally threw themselves at Enforcement members, causing a mess. Amidst screams and shouts, when the Enforcement members barely regained order in the smoke-filled meeting room, an adjutant reported to Iori urgently.\n\n\"The Senior Administrator… escaped! It seems she fled through the emergency passage with some Planning members!\"\n\n\"Dammit!\"\n\nIori slammed the podium with her fist. She seized the heart of the Prefect Team, but missed the most core opposition.\n\n\"Seal the whole city! Find that woman at all costs!\"\n\nGehenna's night was opening the prelude of blood and flame."
 GEH_iori_despotic_story_event.1.a: "\"Still, finally order is set right.\""

 GEH_iori_despotic_story_event.2.t: "Massive Protest in Regensburg"
 GEH_iori_despotic_story_event.2.desc: "After Hina's disappearance and Iori's declaration of martial law, Gehenna's division became an irreversible reality. The 'anti-martial law faction (Kriegsrechtsgegner)' led by Amau Ako organized a massive peaceful protest in Regensburg. Informing of the injustice of the military coup and regaining the Prefect Team's discipline was their goal. Slogans like 'Withdraw Martial Law!' and 'Give Us Back the Prefect Team's Discipline!' echoed in an orderly manner.\n\nBut to Shiromi Iori, their voices were simple noise and a fuse of rebellion to be removed. Heavily armed Enforcement suppression forces blocked the front of the protesters, and the peaceful atmosphere of the square instantly turned into a sharp tension. Ako appealed for non-violent resistance until the end through a megaphone.\n\n\"You are Prefect members who protect the students of Gehenna, not Shiromi Iori's private soldiers! Do not yield to violence!\"\n\nHowever, as the standoff lengthened, a water bottle thrown by an excited protester became the signal the Enforcement Bureau had been waiting for.\n\n\"It's a riot! Suppress them all!\"\n\nThe Enforcement Bureau's hardline suppression was carried out in an instant. The peaceful protest was ruthlessly trampled by tear gas and clubs. That evening, the Enforcement Bureau's official announcement defined what happened in Regensburg as 'a riot by subversives aiming for national subversion.' While Ako and other leaders fled using the chaos, numerous protesters were arrested. This 'riot' gave Iori the perfect justification to define all opposition as 'terrorists' and enact a powerful decree to root them out."
 GEH_iori_despotic_story_event.2.a: "\"...Amau Ako, you. I really hate you.\""

 GEH_iori_despotic_story_event.3.t: "Under Gehenna's Flag - 2"
 GEH_iori_despotic_story_event.3.desc: "\"Crash-!\"\n\nIn the outskirts of Regensburg, the door of the secret hideout of the 'anti-martial law faction (Kriegsrechtsgegner)' was shattered by an explosion. The newly enacted 'Regensburg Riot Decree' granted Shiromi Iori's Enforcement Bureau unlimited authority to arrest and suppress all 'anti-Kivotos subversives' without trial. The first goal of that decree was Amau Ako herself.\n\n\"Everyone drop your weapons! Anyone resisting will be shot immediately!\"\n\nFully armed Enforcement members poured in and subdued the resistance forces in an instant. In the innermost room, Amau Ako was burning classified documents until the end, eventually raising her hands calmly in front of dozens of gun barrels pointed at her. Shortly after, Shiromi Iori stood in front of her.\n\n\"It's over, Ako. Your pathetic 'anti-martial law' play.\"\n\nEven at Iori's mockery-mixed words, Ako's gaze did not waver. Backed by the burning pile of documents, she spoke even more boldly like a winner.\n\n\"This is not your victory. Your tyranny that trampled discipline and reason has just succeeded for a moment. Head Hina never wanted a warlord like you to seize the Prefect Team.\"\n\n\"Head Hina disappeared because of weak paper-worms like you and selfish German bastards! Now I will establish a real 'order' in her name. You were the last obstacle hindering it.\"\n\nIori ordered her subordinates with a chin gesture.\n\n\"Take her away. Traitors are not worth being tried. Throw her into the deepest prison.\"\n\nWhile being held by her arms and dragged by Enforcement members, Ako did not take away her gaze of contempt toward Iori until the end. Her resistance ended in failure. Now in Gehenna, there was no voice left to oppose the sound of Enforcement military boots. What remained in the place where Ako disappeared was the ash of burnt documents and deep darkness."
 GEH_iori_despotic_story_event.3.a: "\"Laugh happily, everyone why the long faces?\""

 GEH_iori_despotic_story_event.4.t: "Our Free and Beautiful Fatherland"
 GEH_iori_despotic_story_event.4.desc: "The power vacuum left by Hina's absence drove Gehenna into madness. Today, the central district square was full of Enforcement members and radical students who support Shiromi Iori. To suppress the resistance of the 'anti-martial law faction' and internal dissatisfaction, Iori needed to tie her support forces into one massive political organization.\n\n\"Students! Why did our great leader, Head Hina, leave our side!\"\n\nAt Iori's shout on the podium, the square instantly became quiet.\n\n\"It was because of the paperwork of weak bureaucrats and the disturbances of low-life foreigners who eat away at our pure culture! They do not understand our great spirit! We are truly advanced humanity with halos! The ones who should be the masters of this land must be us, the students of Gehenna!\"\n\nAt her declaration, the square responded with fanatical cheers. Iori continued her speech, pushing that heat.\n\n\"No more division! To crush the resistance of traitors and protect the pure Gehenna-Kivotos culture, a strong student-citizen-government solidarity is needed! Today, I declare the creation of the 'Free Fatherland Defense Alliance' in this place! This is not a simple organization! This is our identity and a struggle for our survival! For Gehenna!\"\n\n\nAs Iori's declaration ended, the square was covered with shouts chanting 'Iori! Iori!'. Under the flag of the Prefect Team, a new era armed with purity and madness was opening its curtain."
 GEH_iori_despotic_story_event.4.a: "One Fatherland, One People, One Leader!"

 GEH_iori_despotic_story_event.5.t: "Using the Dark Past as a Stepping Stone"
 GEH_iori_despotic_story_event.5.desc: "After Hina's disappearance, only heavy silence and deep loss felt in the Prefect Team. Shiromi Iori broke that silence and summoned all Prefect members. It was not in a square, but in a main meeting room with a solemn atmosphere. Her voice on the podium was submerged in deep sadness, not her usual anger.\n\n\"I know everyone is exhausted. Head Hina, who was our sun... is no longer by our side.\"\n\nIori paused for a moment and caught her breath.\n\n\"Why did it turn out like this? Endless club riots, terrorism of German rebel organizations... Gehenna has been contaminated by too much chaos. All this confusion pushed the Head to the cliff!\"\n\nThe appeal in her voice made everyone in the meeting room solemn.\n\n\"Now Gehenna needs healing. This contamination must be wiped away, and the broken fatherland must be raised again. For this, I declare the establishment of the 'United National Reconstruction Committee' as of today! This is not a factional fight. It is a holy task to rebuild the Gehenna Head Hina tried to protect, now with our hands. Those who do not join this reconstruction will be regarded as those who defy the Head's will.\"\n\nIori's appeal was full of sadness and resolve, not anger. What filled the meeting room was not fanatical cheering, but the sound of applause with solemn determination. Stepping on Hina's tragedy, a new era trying to 'purify' and 'rebuild' Gehenna was starting."
 GEH_iori_despotic_story_event.5.a: "For the Reconstruction of a New Gehenna!"

 GEH_iori_despotic_story_event.6.t: "Hero, or a Step"
 GEH_iori_despotic_story_event.6.desc: "Gehenna has finally been purified. Shiromi Iori's 'Free Fatherland Defense Alliance' has purged all opposition and set 'pure Kivotos culture' right as the state's unique ideology. She was now 명실상부한 'Leader of the People and the Fatherland.' On the desk lay two final designs for the monument to be built in the capital central square. One was the appearance of Sorasaki Hina standing resolutely with black wings spread, and the other was the appearance of Shiromi Iori herself advancing with a gun.\n\n'Head Hina….'\n\nIori picked up Hina's design. Making her a 'martyr' and an 'eternal symbol.' The tragic hero who fell while fighting against the contamination of foreigners. It was a perfect justification she had put forward to seize power. If her name is made into a myth, the legitimacy of this country she built will be placed on a rock. It might be the last courtesy toward her former superior she followed.\n\nBut, Iori soon moved her gaze to the other design. Her own statue.\n\n'…Eventually, you collapsed.'\n\nHina was strong, but eventually she couldn't handle all that chaos and disappeared. The one who set order right again on that ruin and washed away the 'contamination' was herself, Shiromi Iori. A nation cannot have two suns. A nation worshipping a ghost of the past, not a living leader, cannot move forward. If Hina's myth becomes too big, one day that shadow might eat away her authority. To open a true 'Iori era,' she had to overcome the massive mountain named Hina.\n\nIori looked alternately at the two designs. This was not a simple problem of deciding a monument. It was a task of setting the final signpost of the nation she built. Hina, will she become an eternal myth for the fatherland, or a cornerstone for the era of Shiromi Iori? Iori now had to make a final decision."
 GEH_iori_despotic_story_event.6.a: "Head Hina will remain as our eternal symbol."
 GEH_iori_despotic_story_event.6.b: "The past is just the past."

 GEH_iori_despotic_story_event.7.t: "Empty Seat"
 GEH_iori_despotic_story_event.7.desc: "Gehenna has been rebuilt. The deep wound and chaos left by Hina's disappearance were sutured by Shiromi Iori's 'United National Reconstruction Committee' with powerful order. Divided Gehennans and Germans were forcibly harmonized under the single name of Gehenna, and all terrorists were removed. Iori finally accomplished the 'healing' and 'reconstruction' she had aimed for.\n\nLate at night after finishing all work, Iori visited the old Prefect Head's office alone. A space where it feels like the flow of time has stopped since the day Hina disappeared. The chair she sat in, the windowsill she stroked, the night view of Gehenna she watched. Everything was the same. Iori stared at the empty chair placed in the center of the room for a long time without a word.\n\n'Head Hina... what would you have done if it were you?'\n\nI'm not smart like you. I don't know things like complex paperwork. I just... wanted to set right what was broken, and protect this Gehenna you tried to protect. Using the sadness you left as a justification, I eventually rebuilt Gehenna in this way. Is this... the appearance you wanted?\n\nIt was unknown. There was no one now to answer. Iori decided not to look back at the past any longer. She quietly turned her body and grabbed the doorknob. To walk toward the order she made, the future of the Gehenna she rebuilt.\n\n\"Click.\"\n\nWith the sound of the door closing, the office was once again submerged in deep and quiet darkness."
 GEH_iori_despotic_story_event.7.a: "\"Now... I have to move forward.\""

 GEH_iori_despotic_story_event.8.t: "Under Gehenna's Flag - 3"
 GEH_iori_despotic_story_event.8.desc: "The cold wind of the Alps swept through a mountain cabin in Bavaria. Sorasaki Hina, who was once the absolute force and symbol of fear of the Gehenna Prefect Team, was now digging potatoes wearing mud-stained work clothes.\n\n\"Head... no, Hina-san. Is it really okay with this?\"\n\nOne of the Helmet Gang members who hid with her asked with anxious eyes. The news heard from the capital was desperate. Administrator Ako was detained, and the Prefect Team flag was dyed red under Iori's 'New Order.' All resisting forces were purged, or forced to remain silent under Iori's fanatical discipline.\n\nHina wiped her sweat and answered nonchalantly.\n\n\"Lower your voice. That 'title' is now forbidden.\"\n\nShe dusted off her mud-stained gloves and continued her words.\n\n\"Iori... she's not the simple idiot of the past. If I rashly gather the Helmet Gang and resist... no, no. Iori will do well…. probably.\"\n\nHina knew. That opposing the current Iori means the complete ruin of Gehenna and an endless civil war. Like a dictator pushed from the center of power returning to be a country peasant, she wrapped her purple hair with an old bandana."
 GEH_iori_despotic_story_event.8.a: "\"It's time to sow the seeds. Hurry up and work.\""
 GEH_iori_despotic_story_event_8_tt: "§gSorasaki Hina's whereabouts in Shiromi Iori's route ends here. After experiencing civil war with Pandemonium, propaganda, mobilization, war and more war, she has now become exhausted after fleeing, and will live in a rural village while hiding her name and characteristics.§!\n\n"

 GEH.flavor_event.1.t: "Internet Connection"
 GEH.flavor_event.1.desc: "*Haruna0301\nFinally internet is connected in the Prefect Team too! Congratulations\nSince the Great Migration the number of restaurants selling delicious food has decreased a lot\n\n*Haruna0301\nI'd like to visit the Prefect Team once and have a gourmet tour meeting\nTee-hee can I look forward to it?\n\n*realHinaSorasaki\nDon't come\n\n*Haruna0301\nOh my goodness\nIt's a relief you seem to have time to do SNS during work hours even amidst being busy with public and private matters\n\n*realHinaSorasaki\n--\n\n*Haruna0301\nTee-hee it was a joke\nSince Gehenna has become so large, many restaurants I haven't visited yet have appeared in the northern region\n\n*Haruna0301\nI'll make visiting the Prefect Team for next time when there's an opportunity :)"
 GEH.flavor_event.1.a: "\"I told you not to come...\""

 GEH.flavor_event.2.t: "Anyway it's that raccoon's fault!"
 GEH.flavor_event.2.desc: "\"Two months have passed since the Great Migration. But does it make sense that the Intelligence Bureau hasn't found *any* information until now? It doesn't make sense!\"\n\nAko stamped her feet and pointed at the bowed Prefect Intelligence members one by one with her hand.\n\n\"Everyone must know how much Head Hina is suffering due to overwork right now...! How on earth can no one find out information about what method Pandemonium used to fly us to another universe!\"\n\nOne Intelligence member spoke with difficulty in the cold atmosphere.\n\n\"We are sorry. Senior Administrator. But... we went through a close investigation but there is no evidence at all that Pandemonium intentionally caused the Great Migration...\"\n\"Pandemonium's raccoon! Who else could it be but Hanuma Makoto!! Who else could intentionally harass Head Hina like this! Did I cause the Great Migration? Is that what you think?! Yes?\"\n\"No. But...\"\n\nThe scolding that felt like it would never end finished only after an hour. Ako also knew what it meant that no information came out in the investigation that lasted for two months. But... if not Makoto, then what on earth was the cause of the Great Migration?\n\nIf the method is unknown, there is no way back. If so, there is no way to reduce Hina's workload, which has increased several times since the Great Migration. Ako, who likes Hina, just didn't want to accept that cold fact."
 GEH.flavor_event.2.a: "\"...I get it. Investigation on Pandemonium stops as of today.\""

 GEH.flavor_event.3.t: "Anyway reverse migration is possible!"
 GEH.flavor_event.3.desc: "\"If the Great Migration is possible, reverse migration isn't impossible either. Don't you think so?\"\n\nAt Ako's question, Chinatsu, who was making notes on a document, tilted her head.\n\n\"I'm not sure. We don't even know the principle of the Great Migration itself.\"\n\"The principle is simple. Didn't they use the Mystery?\"\n\"Are you talking about the Mystery?\"\n\"Yes. If not, it wouldn't be possible to fly all of Kivotos to another universe.\"\n\nAko walked slowly in a circle inside the office with an expression lost in deep thought.\n\n\"The Mystery... maybe if we gather mass Mystery weavers and concentrate that power... we might be able to make a portal. No, according to my calculations... it's possible! I'll have to gather the Prefect members' Mystery weavers!\""
 GEH_flavor_event_3_a: "\"...Head Hina. I will surely help you!\""

 GEH.flavor_event.4.t: "Anyway I committed a deadly sin..."
 GEH.flavor_event.4.desc: "BOOOOOOM!!!\n\nWith strong explosive pressure, the window glass shattered all at once. Is it a bomb terror by the Wehrmacht? The surprised Hina grabbed her gun and looked out toward the shattered office window. In front of the high tower-like Prefect building. A giant portal was burning with black flames.\n\nA short interrogation was enough to grasp the situation. It seemed that the portal to Kivotos, which Ako made by remodeling Mystery weavers while saying she would 'make a portal to go back to the original world,' caused a massive explosion as soon as it started test operation.\n\n'The motive was... thinking my workload as Head would decrease if we went back to Kivotos...'\n\nHina looked down at Ako, who was kneeling like a prisoner waiting for the guillotine's blade to fall. It was a major incident for which she should be made to write about 200 apology letters. But she could understand what reason Ako had for doing this.\n\n\"Stand up. Ako.\"\n\"B-But Head. Because of me, I caused trouble for Head Hina...\"\n\"I never thought Ako's effort was trouble.\"\n\nHina reached out her hand toward the kneeling Ako."
 GEH.flavor_event.4.a: "\"Thank you for worrying about me.\""

 GEH.flavor_event.5.t: "Struggle for Democracy...?"
 GEH.flavor_event.5.desc: "\"Implement the direct election of the Prefect Head!\"\n\"Sorasaki step down from the Prefect Head position!\"\n\nNo matter how much the Prefect building was a high-rise building like a high tower, the voices of the protesters gathered in front of the Prefect office were reaching the top floor, Hina's office. Hina's expression gradually hardened while walking down the hallway.\n\n\"...What's happening outside?\"\n\nAko looked down past the window with a look of contempt as if she were annoyed.\n\n\"Since we're applying various gun regulations so Gehenna students can't harm locals after the Great Migration... it seems students who have a backlash against the Head have appeared. If the Prefect Head position is changed to a direct election like the Pandemonium Chairman...\"\n\"It would mean they can drag me down.\"\n\nHina let out a sigh.\n\n\"If students want me to step down, I should. If direct election is a better way for everyone, I have no intention of denying that either.\"\n\"H-Head?!\"\n\"But if the reason for trying to elect a new Prefect Head is just because they want to try shooting a local once, I can't accept that alone.\"\n\nHina closed the slightly open window of the Prefect office. Statistics weren't even properly grasped yet on how many shooting sprees Gehenna students had carried out against locals from Luxembourg to Belgium immediately after the Great Migration.\n\nAt least in this land, she couldn't let such things happen."
 GEH.flavor_event.5.a: "The clamor of Gehenna students continued for quite a while after that."

 GEH.flavor_event.6.t: "Bauhaus"
 GEH.flavor_event.6.desc: "\"The biggest problem of the Prefect headquarters is that the building is inefficiently large compared to the personnel. I understand you wanted to give an authoritative impression as a military organization, but with a hallway of this width, even tanks could run. The heating and cooling efficiency must be terrible.\"\n\nOnly up to the 2nd floor of the Prefect headquarters was allowed access due to internal security, but Professor Mies pointed out the building's problems one by one while circling the allowed space several times.\n\n\"And you said the executives' offices are concentrated on the top floors of the building, but have you anticipated the case where terror occurs in such a high building? Even if there is an underground bunker in this building, the leadership might be annihilated before they can even go down there.\"\n\nIt wasn't a pleasant thing to hear nagging from a local adult, but Ako noted Professor Mies's words in her notebook while trying to smile. Since she had also experienced going up and down the Prefect headquarters stairs when the electricity was cut, she understood the problem of a building that was just tall.\n\n\"Good. I was thinking we should build a new headquarters someday. I will refer to everything the Professor mentioned for future construction.\"\n\"Thank you. And speaking of the carpet of this headquarters...\""
 GEH.flavor_event.6.a: "Mies went back only after several hours."

 GEH.flavor_event.7.t: "Degenerate Art Exhibition"
 GEH.flavor_event.7.desc: "Ako looked at Karl Schmidt-Rottluff's paintings hung in the art museum and wondered why his paintings were criticized as 'degenerate' art. She thought his paintings were at an easy-to-understand level compared to postmodern paintings she knew; was Germany's cultural level not even reaching that?\n\n\"They're all not bad paintings. And he's working hard on art lectures for Gehenna students...\"\n\nUnfortunately she didn't have an opportunity to meet Rottluff in the art museum where his paintings were hung, but Ako bought a copy of his painting at a gift shop for visitors. Maybe Head Hina would be happy with this gift?"
 GEH.flavor_event.7.a: "Art has an amazing power."

 GEH.flavor_event.8.t: "Beauty of Music"
 GEH_flavor_event_8_desc: "International student Ahn Eak-tai walked along the hallway of the Gehenna-Bavarian Music College. New genres like Gehenna's rock, jazz, and hip-hop were an absurdly amazing world for Ahn, who had dedicated his life to classical music study in the US. Everything he learned in this music college was a new experience for Ahn.\n\n\"Professor. I have a consultation about my doctoral dissertation...\"\n\nIn the moment he entered Professor Richard Strauss's workshop, which had its door open, Ahn discovered Sorasaki Hina playing piano keys with trembling fingertips while sitting in front of Strauss's piano. Strauss, with a satisfied smile, stood behind Hina and looked down at her playing the keys.\n\n\"The speed of learning to play is quite fast. Have you thought about becoming a pianist if you leave the Prefect Team?\"\n\"...I'm only doing it because Ako said I also need a hobby. A pianist, it doesn't suit a person like me.\"\n\"If you have a heart to play a beautiful melody for someone, you are already a pianist in that moment. Qualifications are not needed. ...Isn't that so, Ahn-kun?\"\n\nStrauss, with a smile, approached Ahn Eak-tai and snatched away the doctoral dissertation that hadn't been reviewed yet.\n\n\"Can you give me and this lady some time right now? I'll contact you via MomoTalk after reading your dissertation.\""
 GEH.flavor_event.8.a: "\"Ah... I understand, Professor.\""

 GEH.flavor_event.9.t: "Enacting the Civil Rights Law"
 GEH.flavor_event.9.desc: "\"Honestly speaking, a civil rights law from Problem Solver 68 doesn't sit well with me.\"\n\nAko grumbled while reading the draft of the civil rights law to be announced by the Prefect Team. Of course she knew Onikata Kayoko was a talented person with wisdom that even Ako acknowledged. But using this civil rights law as it is... such grumbling naturally came out of her mouth as if acknowledging her own lack.\n\nIori stretched lazily as if it were bothersome.\n\n\"Honestly speaking, who made the law isn't important, right? Whether it helps people or not. Just look at that.\"\n\"That... is true. Yes. I must have thought too deeply.\"\n\nThe reason for the Prefect Team's existence was to protect people from crime. That doesn't change before or after the Great Migration. Ako decided to put down complex thoughts."
 GEH.flavor_event.9.a: "Whether it's a Millennium bomb or a Trinity bomb, as long as it explodes, it's fine, right?"

 GEH.flavor_event.10.t: "What is the Prefect Team doing?!"
 GEH.flavor_event.10.desc: "\"The sandstorm from Abydos is completely covering Southern Gehenna! Does this make sense?!\"\n\nWhile a cat beastman who had to stop running his shop due to the sandstorm was angry at Prefect members, Iori was working hard digging up a high-piled sand mound with a shovel. Abydos or whatever, why does Gehenna have to suffer because of some strange academy? Besides, there's no sign of this ending.\n\n\"Haaaaa.\"\n\nChinatsu held out a water bottle to the exhausted Iori.\n\n\"Adjust your speed appropriately. You might get dehydrated.\"\n\"Eh? Thanks.\"\n\"Anyway a sandstorm, it's truly surreal as much as the Great Migration. Though I think it's inevitable that local merchants protest...\"\n\nA sandstorm coming to Southern Gehenna was not something that could be known and anticipated in advance. What the Prefect Team could do was just dig up the sand covering the shopping district, and hope this cursed storm disappears as quickly as possible."
 GEH.flavor_event.10.a: "I will curse you, Abydos!"

 GEH.flavor_event.11.t: "Abolition of the Luxembourg Regulations"
 GEH_flavor_event_11_desc: "It was too difficult to implement state-led strict gun regulations and seizure measures for Kivotosians, who carry grenades or guns like accessories. Especially for the Prefect Team, which was experiencing a limit of administrative power as territory greatly expanded after the Great Migration, it was an even harder problem. A long meeting continued, but eventually a conclusion was reached that the maintenance of the Luxembourg Regulations is impossible.\n\n\"The good thing is this law prevented massacre incidents for at least two months after the Great Migration. And now Kivotosians have also come to know how weak... of a presence the locals are.\"\n\nAko spoke while holding out the bill for the abolition of the Luxembourg Regulations to other executives.\n\n\"Just because the Luxembourg Regulations are abolished doesn't mean massacre or gun crime will happen right away. However, Prefect personnel must be constantly placed in German residential areas, and reinforcement of patrols for maintaining security must continue. And even better... continuing the racial separation policy of Kivotosians and Germans. At least until we can completely understand each other's differences.\""
 GEH.flavor_event.11.a: "Still, this law was sufficiently meaningful."

 GEH.flavor_event.12.t: "Crushing the Wehrmacht Threat"
 GEH.flavor_event.12.desc: "Due to the effort of [GEH.GetLeader] Prefect Head and the loyal Gehenna Prefect Team,\n\nWe happily inform you that the threat of the so-called 'Wehrmacht,' a criminal warlord group pursuing National Socialism, has been crushed throughout Bavaria. The Prefect Team will continue its zero-tolerance policy toward Nazi warlords to protect Gehenna's peace and the rights and human rights of Kivotosians.\n\nGehenna Prefect Team Proclamation"
 GEH.flavor_event.12.a: "Victory propaganda was printed on the 1st page of major newspapers."

 GEH.flavor_event.13.t: "Treatment of Rikuhachima Aru's Mental Illness"
 GEH.flavor_event.13.desc: "After incorporating Problem Solver 68 into the Gehenna Prefect Team, the [GEH.GetLeader] side came to know late that Problem Solver 68 had reached a state of serious division due to internal conflict. The conflict between Onikata Kayoko, who advocated for moderate measures toward locals, and Asagi Mutsuki, who opposed this. And in between, Aru was suffering from a depressive disorder, unable to bear the division between her friends.\n\nAfter a short Medical interview, it was revealed that Aru was suffering from a depressive disorder and was doing 'self-treatment' using alcohol to hide that fact from her friends in Problem Solver. To heal Aru's liver health and the mental illness problem left neglected without normal medical treatment, the Prefect Medical Bureau decided to implement psychological counseling and drug treatment for Aru.\n\nIt will take a long time until the conflict among Problem Solver employees and Aru's mental wounds are healed. But Chinatsu submitted a hopeful report that their problems can be solved one by one if sufficient time is given."
 GEH.flavor_event.13.a: "I hope she regains her pure appearance from her Kivotos days."

 GEH.flavor_event.14.t: "Amau Ako, Drunken Phone Call"
 GEH.flavor_event.14.desc: "I! In a place where Head Hina doesn't know, things like her laughing! I hate it! Holding hands with another girl! I want her to only do it with me! I want to stay with her! I wanted to go to the festival too! If she's enjoying herself, if she's laughing, and I'm next to her! That's what I like! My head hurts, it's painful! Just thinking about Head Hina, I feel like I'm going crazy... I was waiting for Head Hina to call me! Talk to me occasionally, speak to me, I don't want to be the only one doing that, Head Hina also a bit... don't you care about me a little? A little? At all? Am I nothing? Just a friend? An ordinary friend? I want it to be not ordinary, I like something not ordinary, even just one thing... um, Hina, what should I do. Yes? Hina, are you listening? Listen to me. Are you thinking about something while listening to my voice? Are you thinking about me? You can be at ease, anything is fine, just think about something. I need that, is it wrong to want that? Hina! Head Hina, what, I, I like Hina, I don't need anyone other than Hina... even Hina alone is fine. I'm not being stubborn, one is enough, it's only one. I don't care about the people around, I don't need them and I want them to go away, but why is Hina going that way, come this way, come this way and stay by my side and don't leave. I hate it, the person by Hina's side is me, I like it, I want to be there, let me be there.... Am I not okay? Where is it not okay? I'll fix it so tell me, I'll fix it, I'll surely fix it so please tell me, I want to hear. What should I say? What should I do? Should I fly? Should I run? Should I hold your hand? Even if I try to do everything, you don't look... what should I do? What should I do, no one... Hina, your voice, I want to hear.... Say something, put me at ease, but I hate her laughing while looking at someone else, look at me and laugh, laugh... my head hurts, my stomach too, it hurts... I was worried but why didn't you, why didn't you contact me? Tell me, I want to know. I want to know Hina. From a while ago something, already, my heart is spinning around... I'm saying the same things, but I can't help it, I can't help it, because I only think of Hina... because it's only Hina, continuously, even if I become Hina... Hina, you're precious, I want to treat you preciously, I hate it if you're not precious, so look at me, Hina, I hate it when you don't look... another girl, is hate... I hate it. Are you going again? Are you going somewhere? Are you going to the city center together? To the place we played, with another girl? I hate that. Don't overwrite! I remember everything, overwriting... if you go again, is it different this time? Looking at different things while looking at the same thing? I hate that, I hate it, I hate it. Together with Hina, sharing the same thing, knowing... it's strange, it's not, I'm strange, I know I'm strange, but I've become strange... Hina won't leave my head... even now... Hina, Hi, na... waaaah, *hic*, *hic*, *sob*, Hina, Hi... He, ad, *hic*... Hina's, Hina? Hina, Hina, Hina... I like Hina, I, because I like you. So Hina too... look, please, Hina... Hina too, Hina."
 GEH.flavor_event.14.a: "\"How annoying...\""

 GEH.flavor_event.15.t: "Intelligence Bureau Chief's Email"
 GEH.flavor_event.15.desc: "To [GEH.GetLeader] Prefect Head\n\nThe Prefect Intelligence Bureau has been continuously investigating dangerous individuals who pose a threat to the Gehenna system throughout Germany, including Bavaria, since the Great Migration.\n\nSince we intend to report on individuals who become a threat to the Prefect Team from now on, please the Prefect Head judge whether to take action against these individuals.\n\nThat is all, Prefect Intelligence Bureau"
 GEH.flavor_event.15.a: "[GEH.GetLeader] closed the mailbox."

 GEH.flavor_event.16.t: "Intelligence Bureau Request - Proposal to Replace Senior Administrator"
 GEH.flavor_event.16.desc: "To [GEH.GetLeader] Prefect Head\n\nThe Prefect Intelligence Bureau has judged that the feelings Senior Administrator Amau Ako has toward the Prefect Head have reached a dangerous level, through a close background check on Senior Administrator Amau Ako. Clearly Senior Administrator Amau has homosexual romantic feelings for the Prefect Head, not respect as a superior, and the Intelligence Bureau analyzed that given her paranoiac personality, Amau Ako is highly likely to attempt dangerous acts such as abduction or confinement toward the Prefect Head.\n\nA rational alternative is for you to let our Intelligence Bureau select a new Senior Administrator. Our Intelligence Bureau will fulfill loyalty by the Prefect Head's side based on reason and rationality, unlike the paper-pusher Amau Ako of the Planning Bureau who can't do anything other than eating up the budget..."
 GEH.flavor_event.16.a: "\"...What on earth do they think of Ako?\""

 GEH.flavor_event.17.t: "Intelligence Bureau Request - Proposal to Investigate Anton Drexler"
 GEH.flavor_event.17.desc: "To [GEH.GetLeader] Prefect Head\n\nThe Prefect Intelligence Bureau has come to know that the start of the German National Socialist movement began from a local named Anton Drexler. He is the founder of the Nazi Party and was a long-time political colleague of Adolf Hitler, but remained in our nation as he was living in Munich, Bavaria when Berlin was destroyed by the 'Great Migration.'\n\nIt is a very dangerous thing that the founder of the Nazi Party, of all people, is moving about in Gehenna as if nothing were wrong. Our Intelligence Bureau has judged that if he carries out an anti-system movement against Gehenna in cooperation with the Nazi Party member organization and the Wehrmacht, he is highly likely to become the ideological core of the Nazis.\n\nWe hope the Prefect Head seriously considers the problem of investigating Anton Drexler."
 GEH.flavor_event.17.a: "Yes, I'll have to roll up my sleeves and investigate."
 GEH.flavor_event.17.b: "If he were truly a dangerous person, he would have been in Berlin, not Munich."

 GEH.flavor_event.18.t: "Intelligence Bureau Investigation - Result on Anton Drexler"
 GEH.flavor_event.18.desc: "To [GEH.GetLeader] Prefect Head\n\nOur Intelligence Bureau went through a close investigation of Anton Drexler...\n\nWe have confirmed that he is not conducting any political or social movement for the reconstruction of the Nazi Party after the Great Migration. It seems Anton Drexler has given up all expectation for the realization of National Socialism after the Great Migration. Anton Drexler spends most of his day in a pub in Munich, and our Intelligence agents have only sent a list of beer brands and wurst dishes the Germans drink...\n\nIt is a shameful thing for the Prefect Head, but it seems our Intelligence Bureau has wasted personnel in a meaningless place, and due to this, dissatisfaction among Prefect members is rising."
 GEH.flavor_event.18.a: "...Submit 200 apology letters."

 GEH.flavor_event.19.t: "Intelligence Bureau Investigation - Cooperative Local Organizations and Individuals"
 GEH.flavor_event.19.desc: "To [GEH.GetLeader] Prefect Head\n\nIntelligence, Planning, Enforcement, and Medical—all our Prefect departments—have reached a judgment that locals are hostile toward Kivotosians and are fundamentally untrustworthy groups. Nonetheless, some local forces seem cooperative and won't hinder Gehenna's rule.\n\nThe Social Democratic Party of Germany is a local force that has shown an incompetent appearance throughout the Weimar Republic era. They are currently active as fragmented party organizations without a charismatic leader within Gehenna. Since they are more stupid than Hanuma Makoto, they must never be allowed to directly involve themselves in Prefect politics. However, if we act as if we are listening to their demands, it seems we can draw support from local workers.\n\nVarious artists have migrated to the Bavaria region after the Great Migration, and they are safe because they don't make political demands. Cooperation with local artists seems to be helpful in creating an image of Gehenna as an academy that cares about cultural harmony. The Intelligence Bureau has selected several candidates.\n\nRichard Strauss is the artist most cooperative with Kivotos. He could be a good alternative.\n\nKarl Schmidt, an expressionist painter, has high recognition in Bavaria and could show strong support for our art.\n\nFinally, the outstanding architect Mies van der Rohe is also an alternative. Investment in the Bauhaus is anticipated to bring great progress to Gehenna architecture."
 GEH.flavor_event.19.a: "That's not bad information."

 GEH.flavor_event.20.t: "Intelligence Bureau Report - Threatening Movements of Germans"
 GEH.flavor_event.20.desc: "To [GEH.GetLeader] Prefect Head\n\nSince Head Hina formalized the news of her romance with Senior Administrator Amau Ako, the anger and embarrassment of the locals have been reaching a breaking point.\n\nFirst, Catholicism and Protestantism, the dominant faiths of Germany, are both officially criticizing the romance between Head Hina and the Senior Administrator. The locals' faiths do not affirm the Head's romance, and it is threatening that important clergy are inciting the locals.\n\nNext is the backlash of political forces. Currently, the Communist Party and National Socialist German Workers' Party, which are outlawed in Gehenna, and the legally active Center Party and National People's Party all jointly criticized the government yesterday. The only local party that supported the Head is the Social Democratic Party, but this seems to have the insidious purpose of trying to legally intervene in Gehenna central politics by gaining the Head's trust, and cannot be trusted.\n\nBoth the religious circles and the political underground organizations need suppression, but an order of priority needs to be set. Our Intelligence Bureau has judged that now that German underground organizations have come to the surface using the social chaos, we should take it as an opportunity to wipe out the local leaders. Conversely, the technocrats of the Planning Bureau proposed to pressure local religious people through tax audits.\n\nDue to the limit of administrative power, the effect is expected to be halved if both are implemented simultaneously. We hope the Head makes an appropriate decision."
 GEH.flavor_event.20.a: "Focus on destroying the local parties."
 GEH.flavor_event.20.b: "Let the Planning Bureau break the religious people."

 GEH.flavor_event.21.t: "Intelligence Bureau Report - Local Worker General Strike"
 GEH.flavor_event.21.desc: "To [GEH.GetLeader] Prefect Head\n\nAs the locals' backlash intensifies starting from the news of Head Hina's romance, the underground alliance of the Nazi and Communist organizations is becoming increasingly solid. The two idiots seem to have agreed to cooperate with each other until our legitimate Gehenna regime is collapsed, and then compete for the dominance of Germany after that.\n\nThe Communists and Nazis are inciting a general strike by inciting local workers, and local labor organizations have begun to sympathize with this. The Enforcement Bureau is demanding a 'fast' solution using bullets, but this risks expanding the scale of the strike uncontrollably. A more cautious approach to this problem is needed.\n\nThe Planning Bureau discussed a plan using the Social Democratic Party. The Social Democratic Party of Germany is not participating in the Nazi-Communist alliance and is continuing a naive belief that it can expand its political influence in Gehenna by cooperating with us. If we request mediation of the worker strike problem along with a promise of more rights in local councils to the Social Democratic Party, they will spare no effort to stop the general strike.\n\nIn our Intelligence Bureau, a plan to encourage division between the Communists and Nazis is being discussed. They have been enemies since the Weimar Republic era and are only continuing a precarious alliance for the subversion of the Gehenna system. If we spread information to the Nazis that the Communists are selling the identities of Nazi participants, and vice versa, the alliance of the two idiots will naturally collapse."
 GEH.flavor_event.21.a: "Promises don't cost money, proceed as per the Planning Bureau's plan."
 GEH.flavor_event.21.b: "Make those idiots self-destruct."

 GEH.flavor_event.22.t: "Intelligence Bureau Report - Christian General Uprising"
 GEH.flavor_event.22.desc: "To [GEH.GetLeader] Prefect Head\n\nAs the locals' backlash intensifies starting from the news of Head Hina's romance, the alliance of Christian forces is becoming increasingly strong. The Vatican Pope has officially declared the Prefect Team as an anti-Christ organization, and several bishops, priests, and pastors are urging resistance from Germans against Gehenna.\n\nThe Enforcement Bureau is demanding that all religious people living in Germany be thrown into prison, but this is practically impossible to realize when analyzed by the population our administrative power and correctional institutions can accommodate. The Planning and Intelligence Bureaus have discussed ways to respond to local religious resistance separately.\n\nThe Planning Bureau proposed a plan to arrest clergy who participated in protests and then strip them of citizenship and deport them all abroad. The Senior Administrator argues that since this is just a 'small-scale clergy deportation,' population decrease and loss of national power won't be large.\n\nIn our Intelligence Bureau, we'd like to propose hiring the Gehenna population to carry out government-controlled protests. As long as the Gehenna population can carry out violence and chaos, they don't really care what the motive is. If we hand baseball bats and hammers to Gehenna students whose stress is accumulated due to gun regulations and set them loose at the protest site, we can leave over 90 percent of the religious people participating in the protest with permanent disabilities preventing them from ever participating in anti-government protests again. This will be a rational alternative needing much lower costs and administrative power than the Senior Administrator's proposal while preventing the recurrence of protests by Christians."
 GEH.flavor_event.22.a: "Baseball bats? Hammers? ...Sigh, fine, bring me Ako's proposal."
 GEH.flavor_event.22.b: "Release the students. ...But I can't allow blunt weapons."

 GEH.flavor_event.23.t: "Gehenna-Millennium Baseball Friendly Match"
 GEH.flavor_event.23.desc: "As Kivotos nations were surrounded by local nations after the Great Migration, diplomatic movements at the civilian level were also active to strengthen cooperation and friendship among Kivotos nations. This Gehenna-Millennium baseball friendly match was also hosted through cooperation between civilian groups, and as the baseball team representing Millennium, Corgi Braves, a professional baseball club of Millennium, participated, and for Gehenna, a baseball club team composed of Prefect members participated in the match.\n\nIn this match, Corgi Braves showed unstable performance from the beginning and began to fall behind the Gehenna baseball club with a large score difference. The incomprehensible strategy of Corgi Braves, hard to trust as a professional club, made the Millennium citizens gathered in the spectator seats increasingly enraged. Eventually, as the score of Corgi Braves:Gehenna Baseball Club reached 0:28 at the top of the 4th inning, anger reached a breaking point. French spectators, who had never experienced Millennium's baseball before, jumped over the fence first and ran into the stadium, and as Millennium students followed into the stadium, the match was suspended. After both Gehenna and Corgi Braves players fled, Paris citizens and Millennium students occupied the stadium and began to destroy facilities, and some enraged French people incinerated the player bus belonging to Corgi Braves.\n\nA Chronos news reporter who came to cover the match mocked with a quite cynical tone, 'This is the first time French people and Millennium people have strengthened such deep friendship since the Great Migration. This has already become a friendly match between France and Millennium, not between Gehenna and Millennium.' As it became impossible to resume the match due to the intensifying riot, the match was declared as a called game termination at the top of the 4th inning."
 GEH.flavor_event.23.a: "There will never be another time we play baseball with Millennium."

 GEH.flavor_event.24.a: "...Oh my head..."

 GEH.flavor_event.25.t: "Nothing Happened"
 GEH.flavor_event.25.desc: "He...llo, Head Hina. Yesterday after going home I drank a bit of wine, really just a bit... but after that my memory cut out, and only a record of me making a phone call to the Head for a few minutes remained... yes. There is a record of making a call, but I don't remember what I said on the call.\n\nIn case I said something rude that day I was worried... you weren't angry, were you? If I was just being a drunkard, I'll even submit an apology letter."
 GEH.flavor_event.25.a: "\"...Nothing much happened. So just... don't bring up the story of that day.\""

 GEH.flavor_event.26.t: "Death of Yurizono Seia"
 GEH_flavor_event_26_desc: "Until even before the Great Migration incident happened, Gehenna and Trinity were pushing for the peace treaty, 'Eden Treaty,' under the mediation of the General Student Council President. In Gehenna, Hina, and in Trinity, the Tea Party led the peace treaty jointly. Therefore, Hina had met Seia several times along with the General Student Council President during the working-level negotiation process before the Migration. For Hina, Seia was a sage with deep wisdom, and the most rational person who could lead Trinity after the Migration.\n\n\"If Seia-san died... right. There's almost no possibility that the Eden Treaty will be resumed.\"\n\nOriginally, all negotiations including working-level consultations regarding the Eden Treaty were suspended after the Great Migration. However, Seia's death was as good as destroying the last hope for the resumption of the Eden Treaty for Hina. Hina let out a deep sigh and turned on the computer. To send a eulogy for a wise person who was always by the side of the Tea Party Host Nagisa."
 GEH.flavor_event.26.a: "Hina was worried how her death would change Trinity."

 GEH.flavor_event.27.t: "On the Passing of Yurizono Seia - Eulogy from Sorasaki Hina"
 GEH.flavor_event.27.desc: "To Kirifuji Nagisa-san.\n\nFirst, I deeply apologize for only being able to send a eulogy via letter and not being able to visit Trinity in person.\n\nReceiving the news of the passing of Yurizono Seia-sama, a member of the noble Tea Party and a reformer, was truly a moment where shock and sadness crossed. Her life was devotion itself toward Trinity, and she was someone who pursued harmony and yearned for peace more than anyone. Our Gehenna Prefect Team also feels deep anger and condolences at the fact that she fell in the face of the foolish violence of extremism.\n\nSeia-sama always listened to the voices of Trinity students and was someone who suggested hope in reality through practicable policies, not just ideals. She was someone who gained the trust of the entire academy, transcending not just the Sanctus faction but all factions of Trinity, and was respected by many for her sharp insight as if looking into the future and her gentle character.\n\nI remember pushing the 'Eden Treaty' along with Seia-sama and other Tea Party members under the mediation of the General Student Council President. Seia-sama thought more deeply about the General Student Council President's opinion than anyone and thought deeply about the beautiful future the peace of the two academies would bring. I hope the peace of Gehenna and Trinity she dreamed of will continue in the future.\n\nToday the Sanctus faction lost a leader, but simultaneously comes to remember the ideals and conviction of an era. Yurizono Seia-sama's name will never be forgotten, and her will and vision will remain long in the hearts of many in Trinity and the world and continue.\n\nWe pray for the repose of the deceased and offer words of sincere comfort to everyone in Trinity.\n\n- Gehenna Prefect Team Prefect Head Sorasaki Hina."
 GEH.flavor_event.27.a: "Nagisa wept silently while remembering memories with Seia."

 GEH.flavor_event.28.t: "Bertolt Brecht Comes to Gehenna!"
 GEH.flavor_event.28.desc: "Bertolt Brecht, the famous playwright who had fled to a Danish friend's house while conducting an anti-Adolf Hitler regime movement, returned to Bavaria, Germany today. Many speculations are going around why Brecht chose Bavaria, the control zone of the Gehenna Prefect Team, excluding the two choices of Trinity and Pandemonium. Brecht's official claim stated to reporters is just 'Bavaria's beautiful nature,' but the literary circle speculates his left-wing tendency as the cause. The Gehenna Prefect Team is currently the only region where left-wing parties including the Social Democratic Party are active legally (albeit limited to local governments) after the 'Great Migration.'\n\nIn a Chronos media interview asking whether Kivotos culture influenced Brecht's literary world after the Great Migration, Brecht mentioned the famous Kivotos game 'Tales Saga Chronicle.' Incoherent settings seemingly inserted intentionally and sentences that don't match, and dialogue that makes the user unable to immerse in the game became the objects of Brecht's great praise.\n\n\"Culture and art must not be made so that the audience or reader 'empathizes' with the characters in that work. According to 'dialectical materialism,' art must be used as a tool to recognize and criticize our miserable reality using reason, not emotion, by the person appreciating it. Since Tales Saga Chronicle was made so that gamers can never sympathize with the game, it's a very interesting game that lets me know the theory of art I've been advocating for was being used identically in Kivotos too.\"\n\nBrecht, while acknowledging the shock of the Great Migration left a big wound in Europe, believes that Kivotos culture and European culture will be able to harmonize with each other in Gehenna. The Gehenna Prefect Team didn't announce any official statement on Brecht's entry, but Hinomiya Chinatsu left a short interview in a Chronos media interview saying, \"It seems you are misunderstanding something about Tales Saga Chronicle.\""
 GEH.flavor_event.28.a: "So what's dialectical materialism?"

 GEH.flavor_event.29.t: "Mother Courage and Her Children"
 GEH.flavor_event.29.desc: "Left-wing playwright Bertolt Brecht's new play 'Mother Courage and Her Children (Mutter Courage und ihre Kinder)' is a work clearly criticizing Misono Mika's National Socialist dictatorial regime. This play, set during Europe's 'Thirty Years' War' in the 17th century, is strongly condemning National Socialism through the story of Mother Courage trying to gain wealth through war.\n\nBrecht, while agreeing to a Gehenna media interview asking whether Mother Courage is a metaphor for Misono Mika, left a cynical commentary saying, \"Just as Hitler's National Socialism failed, Patern National Socialism will produce the same result.\" Mother Courage and Her Children was first demonstrated as a performance only in the Gehenna Prefect Team's jurisdiction, but it's soon to be translated into English and faces its first performance in the New World. Senior Administrator Amau Ako personally participated in the premiere held in Munich, but the interview she did after the premiere in front of reporters, \"Honestly it wasn't fun,\" is causing trouble."
 GEH.flavor_event.29.a: "How can I say something is fun when it's not."

 GEH.flavor_event.30.t: "The Fall of Wilhelm II"
 GEH_flavor_event_30_desc: "Left-wing playwright Bertolt Brecht's new play 'The Fall of Wilhelm II' is a very controversial work set in the German Empire during World War I. This play, set during the 1918 'Kiel Mutiny,' shows the contrast between Wilhelm von Preußen, who tries to push German people into the battlefield while fallen into psychopathic madness, and the German imperial family itself collapsing due to that madness. Despite the literary critique that the literary artistry is low due to focusing only on 'criticizing reality and rational social analysis' according to dialectical materialism pursued by Brecht, 'The Fall of Wilhelm II' is causing sensational controversy throughout the Gehenna Prefect Team.\n\nThe cause of the controversy is that Wilhelm II in this play is clearly a metaphor for Sorasaki Hina. Wilhelm II uses the exact same tone and behavior as Hina, and Germany's military leader Erich Ludendorff acts blatantly like Amau Ako. The play leaves a strong metaphor that the Prefect Team's dictatorial system will collapse like the German Empire by transplanting the appearance of the German Empire self-destructing due to militaristic madness directly into the Gehenna Prefect Team.\n\nThe premiere of The Fall of Wilhelm II was carried out legally, but as the play drew social controversy, zealots calling themselves Sorasaki Hina's 'Royal Guard' began to move. Due to attacks by zealots, performances across Gehenna were forcibly suspended and Bertolt Brecht received anonymous death threat letters from zealots. Although the Prefect Team didn't officially ban this performance or issue a wanted warrant for Brecht, Brecht decided to move to Switzerland for the reason of 'threat to personal safety'."
 GEH.flavor_event.30.a: "It's insulting, but it was fun."

 GEH.flavor_event.31.t: "Trinity Invasion Crisis"
 GEH.flavor_event.31.desc: "While Richard Strauss was playing the piano, his pupil Ahn Eak-tai stood by Strauss's side with an anxious expression. Although Gehenna was caught in war and various artists were preparing to flee abroad, Strauss seemed to have no intention of leaving Gehenna even in this crisis.\n\n\"Are you thinking of staying here, Professor?\"\n\nAt Ahn's question, Strauss smiled as if it were natural.\n\n\"My students are here, how can a professor leave this land. But you can take refuge until the war ends, can't you.\"\n\"I like the artistic inspiration this Gehenna has taught me. It's free, and sometimes disorderly... but it's a land that gives infinite inspiration for creation because of that.\"\n\"...It's the same for me. Trinity is much more orderly, but it doesn't fit my melody.\"\n\nStrauss turned to Ahn who had a heavy expression.\n\n\"If you have affection for Gehenna, how about appearing on a broadcast for Gehenna?\"\n\"A broadcast?\"\n\"Just playing music is enough. There are very many people who desperately want a piece to comfort the people of this land. A proposal also came to me... but I think you, who are young and passionate, would suit that position more.\""
 GEH.flavor_event.31.a: "In our respective positions, for Gehenna"

 GEH.flavor_event.32.t: "Piano Melody Causing Division"
 GEH.flavor_event.32.desc: "Ahn Eak-tai, known as a pupil of the legendary German composer Richard Strauss, has recently been appearing regularly on a propaganda radio broadcast operated by the Gehenna Prefect Team, playing German traditional folk songs on the piano. Ahn's broadcast doesn't have passionate propaganda or inflammatory criticism with flowery language, but it seems it's causing great stir among the German locals we've conscripted - by letting them know the fact that 'German brothers are killing each other.'\n\nEven though our officers explicitly prohibited listening to Ahn's piano broadcast, it's clear Ahn's broadcast is calling forth homesickness and brotherhood among our soldiers on the front. Some soldiers have already begun deserting from the front, and we intend to monitor soldiers' radio listening even more strictly to respond to Ahn's broadcast."
 GEH.flavor_event.32.a: "...After occupying Gehenna, I will surely shoot Ahn."

 GEH.flavor_event.33.t: "Even the elevator breaking down is..."
 GEH.flavor_event.33.desc: "\"It's certain there are my enemies within the Prefect Team. Yesterday I took cookies from the pantry and the cookies were burnt to a crisp, and two days ago the elevator broke down so I had to walk up and down the stairs to the office, and moreover three days ago ransomware was on my laptop...\"\n\nListening to Ako's chattering voice, Carl Jung noted down her endless complaints with a pen on a tablet PC. He had met many people with hysterical personalities until now, but Ako was the strongest 'opponent' among all the people Carl Jung had met.\n\nWhat kind of workload does the Gehenna Prefect Team have that it can drive this girl into this much hysteria with work? Jung briefly cut off the 'conspiracy theory of enemies within the Prefect Team' and opened his mouth calmly. After all, this position was a psychological counseling service Ako requested first to relieve stress. He had heard enough of her story, so he had to make a diagnosis according to analytical psychology and find a way to relieve her stress.\n\n\"The reason Ako-san has come to think of all minor surrounding details as 'enemies' schemes' can be found in the unconscious. For example...\""
 GEH.flavor_event.33.a: "I hope this counseling relieves her stress even a little"

 GEH.flavor_event.34.t: "Gehenna Swimming Training"
 GEH.flavor_event.34.desc: "\"Splash splash gurgle...\"\n\"Head!!!!!\"\n\nEveryone knew Sorasaki Hina wasn't good at swimming... but no one imagined she'd be *this* bad. In a combat swimming training carried out in a small lake in Bavaria, Hina, who took courage and jumped into the water, sank straight toward the bottom of the lake without swimming even 1m. While stopping Ako from trying to follow into the lake in a panic, safety personnel on standby urgently rescued Hina.\n\nHina swallowed a lot of water and a few tears formed in her eyes due to embarrassment, but she was safely rescued to the lakeshore. However, the special Prefect joint training planned to be held at the lake was suspended amidst this commotion. And a line of embarrassing Prefect regulations was added stating that Sorasaki Hina must surely use a tube no matter how shallow a stream she goes to.\n\n\"...Was it really necessary to even formalize it into a regulation, Ako?\"\n\"...If the Head had endured even just 3 seconds in the lake, I wouldn't have gone this far.\""
 GEH.flavor_event.34.a: "Honestly I had nothing to say in refutation..."

 GEH.flavor_event.35.t: "Internal Faith Forces of Germany"
 GEH_flavor_event_35_desc: "There exist two major religious forces in Germany, and they are classified as Catholic and Protestant. They are both local religious forces of Germany, and while there are political differences depending on whether they follow the Vatican Pope's commands or not, they have a common point of being hostile to the Gehenna government's rule.\n\nThe Catholic Church and Protestant Church both limit women's rights to only 'good wife, good mother,' and they have a very negative perception of a society where women lead politics and men are excluded, like the academy nations of Kivotos. Since it is expected that more than a generation of time is needed for their religious perception to change, the Prefect Enforcement Bureau claims that 'ruthless' suppression toward local religious people is the only answer.\n\nRealistically, as ruthless suppression toward the Protestant and Catholic population occupying the majority of the Gehenna population is difficult, a relatively moderate form of religious suppression will be implemented. What's important is that to maintain the current Kivotosian-centric system in Germany, any compromise with them will be impossible. This is a tragic but unchangeable religious gap."
 GEH.flavor_event.35.a: "If they want, they can become martyrs."

 GEH.flavor_event.36.t: "Opposition Parties Against Gehenna Rule"
 GEH.flavor_event.36.desc: "Legally active political parties in the Prefect Team-governed territories can be divided into three main groups. The first is the Social Democratic Party. Abbreviated as the SPD, they elect representatives to local councils and at least agree that the Gehenna rulers are an improvement over Hitler. As the most cooperative party, the SPD is unlikely to hinder Gehenna's administration of Deutschland.\n\nThe problem lies with the two local council opposition groups: the German Centre Party and the Bavarian People's Party. Both the Centre Party and the People's Party are conservative right-wing organizations. While they differ in their choice between economic and religious conservatism, they share the common view of Gehenna as a colonial occupier.\n\nUnlike the illegal Nazi and Communist parties, the Centre and People's parties continue their activities under a legal framework within local councils, and thus their presence in society is still permitted. However, in the long term, it remains necessary to support the Social Democratic Party to ensure these conservative groups do not expand their influence.\n\nOne fortunate point is that the People's Party and the Centre Party are constantly at each other's throats, biting at one another to steal away supporters. Since their support bases overlap significantly, cooperation between the People's Party and the Centre Party is even less likely than a pact between the Nazis and the Communists."
 GEH.flavor_event.36.a: "It's like the Gourmet Research Society and the Hot Springs Development Department failing to team up."

 GEH.flavor_event.37.t: "Bavarian Catholic Protest"
 GEH.flavor_event.37.desc: "Following the Prefect Team's occupation of the Bavarian region after the Great Transfer of 1935, a 'Gehenna Expulsion Street Protest' was led by Hans Meiser, a local Lutheran religious leader. Meiser is known for having been highly conciliatory toward the Hitler regime, which has led the Prefect Team Intelligence Department to harbor deep suspicions regarding the true intent behind his protest.\n\nThis street protest involved 3,000 Protestants from across Bavaria, resulting in sporadic outbreaks of violence. The Intelligence Department argues that Meiser should be deported to strip him of his influence in Bavaria, but the Enforcement Department believes this is a perfect opportunity to lock Hans Meiser away in an underground dungeon... for a very long time."
 GEH.flavor_event.37.a: "He is the head of a criminal organization. Sentence him to 20 years."
 GEH.flavor_event.37.b: "There's no place for him in Gehenna. Revoke his citizenship and deport him."

 GEH.event.1.t: "The Relationship Between Two People"
 GEH.event.1.desc.a: "In the awkward atmosphere, Hina took a sip of iced tea. Requesting a consultation from Haruna, that terrorist of all people—it was absurd. But... this wasn't a story she could share with anyone inside the Prefect Team.\n\n\"To be honest, I don't have many friends. That's why you're the only one I can turn to for advice. ...And I know your Gourmet Research Society has very strong bonds among its members.\"\n\"Oh my, I didn't know you thought so highly of us, Hina-san.\"\n\"Let's cut to the chase. ...Ako is becoming isolated within the Prefect Team.\"\n\"Yes. I'm well aware of the news regarding the internal reforms. The plan to divide your authority between the Planning Bureau and Ako-san. I believe you agreed to it as well... but I take it there's backlash from other departments?\"\n\"If it were just *backlash*, I wouldn't be asking for advice. Other departments are claiming that Ako... well, that she's trying to privatize the Head Prefect due to *inappropriate* feelings for me.\"\n\nA maximally euphemistic expression. Haruna slowly stroked the rim of her iced tea glass with her fingertip as if weighing the meaning of those words. Then, she smiled, as if testing Hina.\n\n\"What do you think, Hina-san? Do you believe Ako-san loves you?\"\n\"...I think so.\"\n\"Fufu. Good. Next question. Do you also believe this structural reform stems from Ako-san's homosexual desires?\"\n\"No.\"\n\"A prompt answer. Yes, I understand the situation perfectly. Ako-san is sincerely attempting a systemic reform for your sake. However, because the slander against her is partially based on truth, you've found no way to counter it.\"\n\"I know how to punish a criminal running wild with a gun. But... I was never taught how to deal with an enemy wielding a pen.\"\n\"Then I must give you a piece of advice.\"\n\nHaruna smiled meaningfully.\n\n\"Either accept Ako-san completely, or sever all personal ties and remain strictly professional. With your current ambiguous attitude, there is no way to stop the schemes behind your back. What will you do? Are you prepared to embrace Ako-san and take all the criticism in her stead? Or, cutting her off entirely is also an alternative. Publicly showing that 'The Head Prefect dislikes the Senior Administrator' would be a way to destroy the credibility of those rumors.\""
 GEH.event.1.desc.b: "In the awkward atmosphere, Hina took a sip of iced tea. Requesting a consultation from Kayoko, a criminal of the Prefect Team, of all people—it was absurd. But... this wasn't a story she could share with anyone inside the Prefect Team.\n\n\"To be honest, I don't have many friends. That's why you're the only one I can turn to for advice. ...And I know your Problem Solver 68 has very strong bonds among its members.\"\n\"We're not as close as you think. Especially not after the 'Great Transfer'.\"\n\"Even so, it's better than the Prefect Team. ...Ako is becoming isolated within the Prefect Team.\"\n\"Yeah. I've already looked into the news of the internal reforms. Dividing the Head Prefect's authority between the Planning Bureau and Ako. I know you didn't oppose it... but it seems the other departments have started their pushback.\"\n\"If it were just *pushback*, I wouldn't be asking for advice. Other departments are claiming that Ako... well, that she's trying to privatize the Head Prefect due to *inappropriate* feelings for me.\"\n\nA maximally euphemistic expression. Kayoko bit her lower lip momentarily and then released it, as if retracing the meaning of the words.\n\n\"Right. Then let me ask you back, Hina. Does Amau Ako really love you?\"\n\"...I think so.\"\n\"Next. Do you think this structural reform originated from Amau Ako's homosexual desires?\"\n\"No.\"\n\"That's enough for me to understand. This structural reform is Amau Ako's goodwill. But there is resistance, and because that resistance has a *rational* basis, it's difficult to simply deny it, isn't it?\"\n\"I know how to punish a criminal running wild with a gun. But... I was never taught how to deal with an enemy wielding a pen.\"\n\"It might not be perfect, but I can give you some advice.\"\n\nKayoko spoke after a brief moment of thought.\n\n\"First. Go public with a relationship with Amau Ako. Even those attacking Ako wouldn't find it easy to directly criticize 'Sorasaki Hina'. Choosing the former would make Ako personally happy. But if you have no personal feelings for her, I'd recommend the exact opposite—cutting her off. Showing the world that 'The Head Prefect does not like Amau Ako' would also be enough to cut through the schemes of the other members.\""
 GEH.event.1.a: "\"...For me... both are too difficult.\""

 GEH.event.2.t: "Pandemonium Society Disparagement Propaganda"
 GEH.event.2.desc: "Hina read through the speech draft Ako had written herself. The content was filled with the kind of propaganda Hina usually disliked. In front of reporters handpicked by the Prefect Team, it criticized the Pandemonium Society's attempts to establish a cooperative relationship with the Wehrmacht and quoted SPD politicians who denounced how wicked Adolf Hitler, whom the Wehrmacht once served, truly was. Ultimately, it was a denunciation equated the Pandemonium Society with Hitler himself.\n\nThe speech itself was written with quite eloquent phrasing. The problem was that it was packed with inflammatory slogans and passionate sentences that were far removed from Hina's usual style. She understood the motive. It was to instill the image of a 'Strong Leader' in the eyes of conservative Germans who didn't know Hina well. But she didn't feel like following this script. This wasn't Hina's style.\n\n\"I am not a populist politician. I'm not someone who flails their arms in front of reporters for propaganda.\"\n\nChinatsu shook her head.\n\n\"But the Senior Administrator wrote this specifically for you, Head Prefect. Could you just close your eyes and read it once?\""
 GEH.event.2.a: "\"Fine. Set the interview schedule.\""
 GEH.event.2.b: "\"Publish this text in the newspaper under my name. But I won't allow a speech.\""

 GEH.event.3.t: "An 'Oligarchy' for Head Prefect Hina"
 GEH.event.3.desc: "\"Not a single document has crossed my desk for several days. Could I know if something is going on?\"\n\"Didn't you agree that minor policy documents should be handled by the Planning Bureau to lighten your workload, Head Prefect?\"\n\"I did. But surely not all tasks are minor.\"\n\"The only tasks you should handle directly are the significant ones.\"\n\nAko let out a faint smile as she placed the few remaining documents on Hina's desk. It was an operational plan for sweeping Wehrmacht guerrillas, which had already been fully processed by the Planning Bureau.\n\n\"I handled this personally as it was a minor matter. However, since you hold military command, you just need to sign at the bottom.\"\n\nHina gripped the paper. From the personnel to be deployed to the tactical plan, everything bore Ako's touch. The only thing Hina had to do was write a single line of signature at the end. For a moment, the word 'puppet' flashed through Hina's mind. She had said she would share the work. But could this really be called sharing?\n\n'Ako. If you just want to monopolize power, just pump lead into me until my halo shatters. I'll gladly die right here.'\n\n...That sarcasm almost surged up in a fit of irritation.\n\n- There's no way Ako is doing this just for power.\n\nHer deep trust in Ako narrowly blocked the thorns that almost burst out impulsively. It was a thorn she would have regretted for the rest of her life if she had uttered it. She knew. Ako simply wanted to reduce Hina's burden. Just as it was in Kivotos, Ako's loyalty was always excessive. Still, there was a need to temper that overzealous devotion.\n\n\"Hey, Ako.\"\n\"Yes?\""
 GEH.event.3.a: "\"I'm truly grateful for your heart. But you don't need to shoulder everything for me.\""
 GEH.event.3.b: "\"I am the Commander-in-Chief, not you. Don't lay a finger on military authority.\""

 GEH.event.4.t: "Institutional Democracy"
 GEH.event.4.desc: "\"The Senior Administrator Amau's system claims to decentralize power and streamline the Prefect Team externally, but is this truly an institutional reform? I heard recently that the Planning Bureau even tried to touch military authority.\"\n\nAt the regular meeting, the Head of Intelligence glared at Ako while fluttering a stack of papers.\n\n\"I believe it is time to discuss whether there are hidden intentions behind this 'democratic' reform.\"\n\nChinatsu spoke up.\n\n\"Intentions? Are you suggesting Administrator Ako is trying to stage a coup?\"\n\"It could be a far more dangerous rumor than that. Have you heard what's circulating among the Prefect Team members? That Senior Administrator Amau has a homosex—\"\n\n*Slam.* Just before the argument could pivot to Ako's sexuality, Hina struck the desk, cutting off the Head of Intelligence's words."
 GEH.event.4.a: "\"Say one more word, and I'll make sure you never open your mouth again. Head of Intelligence.\""
 GEH.event.4.b: "\"I think we should give Ako a chance to speak as well.\""

 GEH.event.5.t: "Grievances from Below"
 GEH.event.5.desc: "MOMOTALK\n\n- Iori\n\nHead Prefect, the atmosphere in the Enforcement Department has been unusual lately.\n\nPrefect Team democracy is fine, and decentralizing power is all well and good, but there's a lot of dissatisfaction about excluding the Enforcement Department—the ones actually neutralizing criminals—from official events while only putting the Planning Bureau 'paper-pushers' in the spotlight.\n\nSome are saying Ako has bewitched you into this... If it weren't for the members' loyalty to you, Hina, a rebellion might have already broken out.\n\n*Sigh.* I'm not asking for a definitive solution. I'm just venting because it's hard to soothe the kids. People's hearts don't move exactly how you want them to.\n\nPlease, do something for the Enforcement kids."
 GEH.event.5.a: "Hina let out a sigh as she closed MomoTalk."

 GEH.event.6.t: "Heroes Working in the Field"
 GEH.event.6.desc: "\"It felt like the Planning Bureau was hogging all the power, but lately, they've been showering the other departments with bonuses and vacations out of nowhere.\"\n\"The Head Prefect must know the atmosphere has been bad lately.\"\n\nTwo Prefect Team members chatted while pasting propaganda posters onto the wall of the Prefect Team building. An avant-garde poster reading 'You, working in the field, are the hero of Gehenna' and a recruitment number caught the eye.\n\nWhile it was true that power was concentrating in the Planning Bureau and the political strength of other departments was diminishing, to the lower-ranking members who couldn't care less about power struggles, bonuses and vacations were much better rewards anyway. No matter how much those at the top clawed at each other, it didn't change the amount of Kivotos Yen in their bank accounts, did it?"
 GEH.event.6.a: "The two Prefect Team members walked away, laughing heartily."

 GEH.event.7.t: "No Tragedy of Benelux"
 GEH.event.7.desc: "I am Amau Ako. I am responding to this interview today to answer the various prejudices the German people hold toward those from Kivotos. ...Yes. It is true that Kivotos students do not die even when shot, but the rumors that this is due to a curse from hell or the devil are false. Think of us as something like bears or lions. Strong animals don't die from a handgun bullet, but they do die from a cannon, don't they? Likewise, we are simply living beings a bit stronger than average humans, yet ultimately powerless before overwhelming firepower.\n\nI must also address the prejudice that the Gehenna people enjoy killing. It is true that some Gehenna students committed crimes in Benelux immediately after the Great Transfer. Yes. But just as there are evil and good people among the locals, those girls were merely the bottom 1 percent of Gehenna society... just trash. Our Prefect Team is doing its utmost to maintain public order so that the locals can live their lives just as they did before the Great Transfer.\n\nYes. As those watching this interview likely know, our Prefect Team was the public order organization of Gehenna even before the Great Transfer. Fighting crime and protecting citizens within the framework of the law—that is why we are more trustworthy than any other Kivotos organization..."
 GEH.event.7.a: "Ako continued the interview in a calm voice."

 GEH.event.8.t: "To You, in the Dying Season"
 GEH.event.8.desc: "\"Senior Administrator Amau Ako. ...I'm sorry, but I... cannot love you. I've tried, but I can't. I just... cannot see you as a romantic partner.\"\n\nPerhaps our meeting and our lives existed only for the sake of this moment of parting.\nThe love I cherished scattered in the wind, and the surging emotions turned to dust without ever reaching you.\n\nIt was supposed to be an ordinary day—finishing a meeting, sharing light conversation, and parting naturally.\nBut the Head Prefect called me outside the building and barely managed to squeeze out those words. Her voice sounded hesitant, as if she hadn't even organized her own feelings. The voice of the Head Prefect Hina, whom I revered, respected, and loved, sounded so weak and frail that I felt a sudden wave of dizziness.\n\nIf the Head Prefect truly felt nothing for me, it would hurt, but I could have given up. But seeing this person bowing her head, unable to look at me, and mumbling without having settled her own emotions—is this really my 'Sorasaki Hina'? Is this 'Amau Ako's' Hina?\n\nMy Head Prefect is far away, in the dying season.\n\nNot this blurred existence before my eyes, but the person who would boldly throw on her coat and leave the office before the Great Transfer. It was the Sorasaki Hina of that season that I loved. The moment I realized that, I turned and ran as if chased by a ghost.\n\nI heard her calling my name from behind. But I didn't look back. The Head Prefect couldn't catch up to me.\n\nHead Prefect, you're hesitant until the very end.\n\nI loved only you.\nI loved the cold you.\nI loved the indifferent you.\nI loved the courageous you.\nAnd, I loved the you who did not love me.\n\n\"Administrator Ako!\"\n\nA nameless Prefect Team member screamed toward me as I dashed into the road. In that split second, I looked back. The distant Prefect Team building. And from afar, Hina, running late. She looked as if she were frozen in time."
 GEH.event.8.a: "And then, a Prefect Team vehicle barreled through and struck my body."

 GEH.event.9.t: "Heartbreak"
 GEH.event.9.desc: "\"Everyone has a fated partner. For you, it was me, but for me, it wasn't you—that's the only problem.\"\n\nStanding at the edge of the helipad on top of the Prefect Team building, where there wasn't even a railing, Hina faced me against the backdrop of the setting sun. The beautiful twilight shone brilliantly behind the Head Prefect I respected and loved. I probably won't be able to forget this moment until the day I stop breathing. She reached out her hand to me.\n\n\"I cannot be your lover. But I can be a respected superior, a trusted colleague, and a friend who stays with you for a lifetime.\"\n\"It would have been nice if we were lovers staying together for a lifetime.\"\n\"Our fates just didn't align. ...I have nothing to say to that.\"\n\nI took Head Prefect Hina's hand, and together we gazed at the sunset.\n\n\"What would happen if I jumped off this helipad while still holding your hand, Head Prefect?\"\n\"I met you here prepared for that. ...Even if you hated me for the heartbreak, I wanted to accept that hatred as well.\"\n\"...You know I could never do that.\"\n\nBecause she is this kind of person, I suppose I can never truly escape from the individual known as Sorasaki Hina. I let out a small chuckle and stood side-by-side with her, our fingers intertwined.\n\n\"Thank you. ...For cutting me off so decisively.\"\n\"...I don't deserve your thanks.\"\n\"I already knew this love would be rejected. I knew you were intentionally distancing yourself from me lately. And I knew it wasn't because you hated me, but because you were trying to protect me.\"\n\"Ako. You have a lot of time left. So, someone other than me...\"\n\"I don't think there will be a 'second' fate for me. Maybe if it were a different world, a different story under a blue sky instead of this crimson one, things would be different.\"\n\nIt was a poetic sentiment that didn't quite suit me, but I felt something like destiny. In 'this world', in 'this story', a second fated partner would never come for me. But that's okay. My first love will remain my first and last until the moment I die. I let go of Head Prefect Hina's hand."
 GEH.event.9.a: "Ah, well, to comfort me in my heartbreak, would you like to have dinner together tonight?"

 GEH.event.10.t: "The Collapse of the Ako Cabinet"
 GEH.event.10.desc: "\"I am Amau Ako, Head Prefect and Senior Administrator of the Gehenna Prefect Team. Today's emergency meeting is regarding the search for the missing Head Prefect...\"\n\nIn a conference room filled with dozens of key Prefect Team figures, shouts erupted from the Enforcement and Intelligence Departments as Ako read the documents.\n\n\"The reason the Head Prefect went missing is because of you in the first place! Didn't she run away because she couldn't stand your filthy lust!\"\n\"Didn't you cling to her until you buried her when she wouldn't accept your love?\"\n\"The Enforcement Department formally requests an investigation into Amau Ako for the suspected murder of Sorasaki Hina!\"\n\nWhen the word 'murder' finally flew out, members of the Planning Bureau, Ako's faction, jumped from their seats. As the Prefect Team members hurled insults and screamed at each other, Iori, a high-ranking official of the Enforcement Department caught in the middle, looked around for help. Chinatsu's Medical Department was essentially a bystander with no political power. The Intelligence Department was instead stoking the conflict to push Ako out of power. There was nowhere to run.\n\n\"Ako, this is...\"\n\nBefore Iori could finish.\n*Rip, rip.* Ako tore the document titled 'Sorasaki Hina Search Plan' into four pieces and scattered them into the air. The sudden, uncharacteristic action silenced the room instantly.\n\n\"Whew, are you all satisfied now?\"\n\nAko forcibly ripped the Head Prefect tag from her shoulder and threw it among the torn papers.\n\n\"Fine. I'll say it publicly. Just as the Enforcement and Intelligence Departments claim, I loved Head Prefect Hina. Maybe the reason she left us was because she found it disgusting to even work in the same space as me. To think her subordinate loved her—how fucking revolting I must have been. I should have just killed myself instead. Even after she left, I can't even point a pistol at my own head! Because I'm still hoping that one day, she might just walk back through that door! Even when I know it won't happen!\"\n\nAko was spewing profanities she had never used before in the meeting room. Yet, no one could stop her. Was it because they sensed that the moment they opened their mouths to intervene, something even worse would happen? Ako caught her breath.\n\n\"Haah, haah. Huff. Fine. I can't take this anymore. Rather than standing here while being loathed by all of you, I'll just step down. I'm resigning from the position of Head Prefect and returning to Senior Administrator. The Planning Bureau will search for Hina alone. That's all. This regular meeting is adjourned.\""
 GEH.event.10.a: "As Ako stormed out of the room, no one dared to stop her."

 GEH.event.11.t: "I, in the Dying Season"
 GEH.event.11.desc: "\"Senior Administrator Amau Ako. I... love you. I have from the start, and I still do. There were times I wanted to run away... but now I'm certain. I love you.\"\n\nPerhaps our meeting and our lives were connected solely for the sake of this confession.\nThe emotions held only within the heart spread on a warm breeze, and the words that burst forth finally reached you, leaving their mark.\n\nIt was a day that should have been ordinary—exchanging light greetings after a meeting and returning to our respective posts.\nBut Head Prefect Hina quietly called me outside the building and, after a long hesitation, finally spoke those words. Her voice, usually so firm and clear, was trembling this time. The voice of Hina, whom I had come to revere, respect, and love, reached me so weakly yet so clearly. In that moment, I fell into the illusion that all the noise in the world had vanished.\n\nI cannot even begin to imagine how much Hina must have agonized before reaching today's decision.\nBut this person, hesitating before her own feelings and cautiously reaching out, was unmistakably my 'Head Prefect Hina'. To think that she, who always stood at the front of the Prefect Team so confidently, would say these words just for me.\n\nThis person before me is the same Sorasaki Hina who hasn't changed since before the Great Transfer. She was the one who firmly donned her coat and left the office, and she is the one now cautiously opening her heart. I loved the Hina of all those seasons—the first time we met, in Gehenna, and in this world. The moment I reaffirmed that fact, I took her hand as if in a dream. And I felt that this hand was real.\n\nI love the you of right now. The cold you, the indifferent you, the courageous you, and the you of this moment telling me you love me—I love all of you.\n\n\"Ako... how about you?\"\n\nHina called my name while holding my hand. My vision blurred. My whole body trembled at the sound of her voice. Just the fact that I am being loved—it can be this warm.\n\n\"What do you mean 'how about me'... isn't it a bit much to ask when you already know what my answer will be?\" I nodded quietly, tears streaming down my face. These tears weren't of sadness, but the weight of a love that had finally reached its destination."
 GEH.event.11.a: "In this season, let us move toward the future together."

 GEH.event.12.t: "The Head Prefect's Office with Neither Ako nor Hina"
 GEH.event.12.desc: "\"Regarding the election of a new Head Prefect...\"\n\nChinatsu spoke with a trembling voice in the Prefect Team Council hall, which was filled with Planning Bureau members. Since Ako's resignation, the Prefect Team has been operated under a collective leadership system composed of key figures with long service records. Specifically, it is led by the Planning Bureau, where power has been concentrated since the time of Senior Administrator Ako. The Medical Department, which has no political power, managed to secure only one seat on the council for Chinatsu.\n\n\"Has the council reached a decision? Among the pre-Transfer executives, I believe Shiromi Iori-san would be suitable...\"\n\nAt the mention of Iori, shouts erupted from the council.\n\n\"That woman? Absolutely not!\"\n\"Who do you think led the outing and bullying of the Senior Administrator! It was the Intelligence Department and Iori's Enforcement Department!\"\n\"No matter who becomes Head Prefect, we will never tolerate that bitch!\"\n\nChinatsu had expected this reaction. The problem was that there was no charismatic leader within the Planning Bureau who could replace Ako. Chinatsu bowed her head in apology and asked again.\n\n\"Then... has it been decided to maintain the collective leadership through the council for the time being?\"\n\"We will surely find a good new Head Prefect. ...Outside of the Enforcement and Intelligence Departments.\""
 GEH.event.12.a: "The meeting continued in a somber atmosphere."

 GEH.event.13.t: "Head Prefect Appointment Ceremony - Natsume Iroha"
 GEH.event.13.desc: "The hostile relationship between the Prefect Team and the Pandemonium Society was well-known. Therefore, it was quite unusual for a former Pandemonium Society member to become the Head Prefect, but Natsume Iroha was the most realistic alternative the Prefect Team could choose. Due to her personal friendship with Sorasaki Hina, she was somewhat friendly toward the Prefect Team and had been recognized for her achievements as an outstanding bureaucrat. Furthermore, since most of the actual power would still remain with the Planning Bureau, it would be impossible for Iroha to institutionally sabotage the Prefect Team.\n\n\"I swear to... faithfully... perform the duties of the Head Prefect as designated by the Planning Bureau, and I swear to continue close cooperation with the Planning Bureau Council to maintain the stability and order of Gehenna.\"\n\nStrangely slurring the word 'faithfully', Iroha received the Head Prefect's armband from Senior Administrator Ako, who had dead eyes. While Iroha fastened the armband she received from Ako onto her shoulder, applause broke out in the Head Prefect's office, which was packed with Planning Bureau members.\n\nEssentially a puppet Head Prefect for the Planning Bureau. It'll probably be easier to slack off here than at the Pandemonium Society. Iroha smiled bitterly and stood before the cameras in the same posture she used while shaking hands with Ako."
 GEH.event.13.a: "Long live Head Prefect Natsume Iroha! Long live the Council!"

 GEH.event.14.t: "Head Prefect Appointment Ceremony - Onikata Kayoko"
 GEH.event.14.desc: "Onikata Kayoko was a talent whose abilities had long been recognized by the Prefect Team. Even though Problem Solver 68 was technically just a target for arrest, the friendship between Senior Administrator Ako and Kayoko was such that some students even gossiped about whether Kayoko had been a Prefect Team executive during the Thunder Emperor's regime. Thus, it wasn't particularly unnatural for Kayoko, who possessed Ako's trust, to become the new Head Prefect. Wearing a Head Prefect coat that was identical in shape to Hina's but newly made to fit her build, Kayoko spoke in a confident voice.\n\n\"I swear to faithfully perform the duties of the Head Prefect as designated by Senior Administrator Amau Ako, and I swear to continue close cooperation with the Planning Bureau Council to maintain the stability and order of Gehenna.\"\n\nA weary-looking Ako said, 'I can trust you with this,' as she personally fastened the Head Prefect's armband onto Kayoko's shoulder. In that moment, applause erupted in the Head Prefect's office, which was filled with Planning Bureau members.\n\nEven though she's just a puppet Head Prefect for the Planning Bureau, now that she's taken the post, she'll have to work as hard as she can alongside her colleagues from Problem Solver 68. Kayoko stood before the cameras in a handshake with Ako, lost in deep thought."
 GEH.event.14.a: "Long live Head Prefect Onikata Kayoko! Long live the Council!"

 GEH.event.15.t: "Head Prefect Appointment Ceremony - Rikuhachima Aru"
 GEH.event.15.desc: "Rikuhachima Aru was an individual who didn't quite seem to fit the rank of Head Prefect. She was merely a common rule-breaker to the Prefect Team, and before the Great Transfer, no one would have seriously considered her a candidate for the position, even as a joke. The reason she emerged as a serious alternative for the vacant Head Prefect post was due to the heroic deeds and contributions she showed after the Great Transfer. In particular, her refusal to back down even after being terrorized by Nazis while working for the harmony of Kivotos students and locals became a turning point for many Prefect Team members to reconsider their view of Aru.\n\n\"I, Rikuhachima Aru, Regent of the Grand Duchy of Luxembourg, swear to faithfully perform the duties of the Head Prefect as designated by Senior Administrator Amau Ako, and I swear to continue cooperation with the Council to maintain the stability and order of Gehenna.\"\n\nA somewhat nervous-looking Ako said, 'If you have any trouble, consult with Kayoko-san,' and personally fastened the Head Prefect's armband onto Aru's shoulder. In that moment, applause broke out in the Head Prefect's office, which was filled with Planning Bureau members.\n\nIt was a historic moment where the Regent of the small nation of Luxembourg concurrently held the position of Head Prefect, the national leader of Gehenna. Due to her disability, Aru placed her hand—which lacked strength—on top of Ako's hand instead of a handshake. The cameras of the reporters summoned by the Prefect Team flashed as they captured the two."
 GEH.event.15.a: "Long live Head Prefect Rikuhachima Aru! Long live the Council!"

 GEH.event.16.t: "Issues with the Senior Administrator's Duties"
 GEH.event.16.desc: "A long time has passed since Head Prefect Sorasaki Hina went missing, leaving behind only a short letter. Most Prefect Team members believe Hina has already fled abroad or, in the worst case, taken her own life. Regardless, they assume there is no way for the Prefect Team to find her.\n\nHowever, as the vacant Head Prefect position was filled, Ako's efforts to find the Head Prefect began to regain vitality. She is working hard to find clues about Hina, even neglecting part of her duties as Senior Administrator and traveling across all of Gehenna at her own expense.\n\nAlthough an impeachment motion against Ako was brought forward by the Enforcement and Intelligence Departments, due to the strong will of Head Prefect [GEH.GetLeader], Ako was able to continue her search for Sorasaki Hina. Even if the possibility of Ako finding the Head Prefect was slim, it was currently the last motivation that kept her alive."
 GEH.event.16.a: "Never give up."

 GEH.event.200.t: "Status Quo"
 GEH.event.200.desc: "The Gehenna Prefect Team is clearly divided into two currents. The Enforcement Department, which advocates for hardline militarism, and the Planning Bureau, which centers on technocrats prioritizing cold reason and data. The two have always argued for different paths even toward the same goal. The Second General Assembly was a place where such ideological clashes were laid bare. The heated debate lasted through the night, but a conclusion was never reached. The only result was 'failing to make any decision.'\n\nNaturally, rumors began to circulate among the Prefect Team members. \"If they fight like that, they won't even be able to look at each other's faces soon.\" But that prediction was wrong. Amau Ako and Shiromi Iori, who continued sharp debates in official settings, spoke to each other with casual attitudes in private. The soft smiles while maintaining formality, the trust hidden within cold speech—it was a relationship that couldn't be explained by the word 'conflict'.\n\nIn the end, the conclusion of the General Assembly where no one won became, ironically, the most ideal conclusion. Under the veteran mediation of the Head Prefect, the tension between factions stopped just before exploding, and the Prefect Team was able to remain as a single organization once again."
 GEH.event.200.a: "Conflict among general members remains, but it's a solvable problem."

 GEH.event.201.t: "Negotiations with the Social Democratic Party"
 GEH.event.201.desc: "Willy Lange, a local politician from the German Social Democratic Party, was one of many politicians who fled to Czechoslovakia after the Nazi regime took power and then returned to Deutschland after an anti-Nazi government was established in Bavaria. Lange did not trust the new warlord organization called Gehenna, but the truth was that there was no other alternative force that tolerated the Social Democratic Party except them. Lange waited for the promised Prefect Team executive to enter the conference room, unable to hide his anxiety while checking his watch several times.\n\n\"...I apologize for the wait. The Head Prefect has reviewed the Social Democratic Party's negotiation proposal.\"\n\nExactly two minutes before the appointed time, a blunt woman named Chinatsu entered to greet Lange. She was one of the faction leaders within the Prefect Team and was the woman who had been granted full authority for this negotiation with the Social Democratic Party. Lange thought she looked too young to be a party executive, but he was wise enough not to voice that thought.\n\n\"We want the legal right for the Social Democratic Party to operate and a labor law reform proposal in Gehenna. Cooperation will only come after that...\"\n\"Yes. Just as Mr. Lange wants order under the Social Democratic Party, we also want stability and order. The Social Democratic Party will be legalized at least within the territory directly administered by Head Prefect [ROOT.GetLeader].\"\n\nChinatsu was more cooperative with his proposal than Lange had expected. Although the 'legal activity' permitted by the Prefect Team was strictly limited to the level of civilian organizations, it was an acceptable level considering they were not a democratic state to begin with. After a short meeting, the negotiations were successfully concluded, and Lange promised the party's cooperation in encouraging Social Democratic Party members to enlist in the Gehenna military."
 GEH.event.201.a: "Step by step, forward"

 GEH.event.202.t: "The Art of Coordination"
 GEH.event.202.desc: "After the failure of the Second General Assembly, the Prefect Team took a moment to catch its breath. The Enforcement Department and the Planning Bureau still did not bend their respective logic, but they no longer sharpened their blades. This was not a victory for any one person, but was solely due to the persuasiveness of one individual. Head Prefect [ROOT.GetLeader] made a decision. \"The failure of the General Assembly is not due to the stubbornness of the executives. Everyone spoke up, but it is my responsibility for failing to weave all those words into one.\" Such a confession was not a mere evasion of responsibility. The sincerity in the speech revealed along with self-reflection moved the hearts of the Prefect Team members, and the deep rifts between factions began to mend bit by bit.\n\nThe conflict between the Planning Bureau and the Enforcement Department was originally a difference in direction, not hatred. That gap was quickly closed with a few sincere speeches and diligent mediation, and the Prefect Team began to move under 'one order' once again. It is not yet perfect unity. However, when the leader blamed themselves and said let's move forward together—the Prefect Team decided to trust each other again."
 GEH.event.202.a: "A leader is not one who reigns, but one who takes responsibility."

 GEH.event.203.t: "Negotiations with the Pandemonium Society?"
 GEH.event.203.desc: "Head Prefect Hina, I certainly trust and believe in you more than anyone... but despite the threat of Trinity, the Pandemonium Society is not a partner we can trust. Those raccoons in the Pandemonium Society will just throw us as cannon fodder to Misono and Kirifuji while they sit in armchairs and sip wine, won't they? And yet, negotiations...\n\nYes. Of course, I am always on your side, and if you have decided to trust those son of a b—... no, those cunning people, I will naturally follow your instructions. However, I am by no means trusting [GEM.GetLeader]. I only trust the choice of 'Head Prefect Hina'. ...Yes. I will draft the diplomatic document to be sent to them. I'll write it so servilely that even that great Chairwoman will be impressed. After all, a mere letter can't promise anything."
 GEH.event.203.a: "Ako bowed to Hina and left."

 GEH.event.204.t: "Bavarian Warlord?"
 GEH.event.204.desc: "Iori glared at the poster of the underground organization of the Communist Party of Germany pasted on the wall of the Prefect Team building. It was clearly a poster that the Enforcement Department members had torn down last night. It seemed they had returned in the early morning to paste them again. The content was simple. The [ROOT.GetLeader] system is ultimately nothing more than a 'reactionary' military organization no different from Wilhelm II. Iori had no idea who this person called Wilhelm II they were talking about was, and she couldn't understand why being a 'military organization' was a problem for [ROOT.GetName].\n\n\"The Communist Party... just a cheap imitation of Red Winter Academy.\"\n\nIori kicked the poster with her boot, spraying dirt over it.\n\n\"I don't even want to waste my time. *Sigh.* I'll have to tell them to tear this down again. ...So what exactly is so bad about being a warlord?\""
 GEH.event.204.a: "Swords and spears are the most powerful ideology and order."

 GEH.event.1000.t: "Annexation of [HEU.GetName] by [GEH.GetName]"
 GEH.event.1000.desc.a: "Following the Gehenna Prefect Team's arrest of the Grand Duchy of Luxembourg and the Problem Solver 68 forces leading it, discussions began regarding the treatment of the Luxembourg leaders. Émile Reuter, the President of the Chamber of Deputies, was arrested while resisting by spitting in the faces of the Prefect Team members, and Prime Minister Joseph Bech was captured while attempting to flee across the border and transferred to a prisoner-of-war camp. Local politicians are extremely uncooperative toward us due to the massacres committed by Gehenna-ites immediately after the Great Transfer, and no advanced discussions regarding the governance of Luxembourg could be held with any local political party.\n\nThe only variable is Problem Solver 68. She, who was the president of a small problem-solving office before the Great Transfer, has now become the Regent of the Grand Duchy of Luxembourg and an international leader of the international liberal political movement 'Revolution of 68'. Even the most hardline Prefect Team members agree that the current Rikuhachima Aru cannot be punished as a simple rule-breaking offender as she was before the Transfer.\n\nThe Intelligence Department believes Rikuhachima Aru has become too dangerous as a social activist and that she must be prevented from influencing the Prefect Team. The Head of Intelligence argues that the safest solution is to execute all local politicians in the prisoner-of-war camp to prevent the Grand Duchy of Luxembourg from being rebuilt, and then to deport her and her Problem Solver 68 colleagues after a trial as 'Anti-Gehenna Political Prisoners'.\n\nIn contrast, Senior Administrator Ako argues that while the other members of Problem Solver 68 are not important, Onikata Kayoko personally possesses exceptional talent and is worth accepting as a Prefect Team executive. Ako proposed an alternative to maintain the Grand Duchy of Luxembourg as an autonomous territory under Gehenna, while having all members of Problem Solver 68 join the Prefect Team. Kayoko will surely not be able to refuse this proposal to protect Aru."
 GEH.event.1000.desc.b: "Following the Gehenna Prefect Team's arrest of the Grand Duchy of Luxembourg and the Problem Solver 68 forces leading it, discussions began regarding the treatment of the Luxembourg leaders. Émile Reuter, the President of the Chamber of Deputies, was arrested while resisting by spitting in the faces of the Prefect Team members, and Prime Minister Joseph Bech was captured while attempting to flee across the border and transferred to a prisoner-of-war camp. Local politicians are extremely uncooperative toward us due to the massacres committed by Gehenna-ites immediately after the Great Transfer, and no advanced discussions regarding the governance of Luxembourg could be held with any local political party.\n\nThe only variable is Problem Solver 68. She, who was the president of a small problem-solving office before the Great Transfer, has now become the Regent of the Grand Duchy of Luxembourg and a popular leader supported by the local Luxembourgers. Even the most hardline Prefect Team members agree that the current Rikuhachima Aru cannot be punished as a simple rule-breaking offender as she was before the Transfer.\n\nThe Intelligence Department argues that Rikuhachima Aru has become too influential an individual and is hindering the 'Gehenna-ization' of Luxembourg. The Head of Intelligence argues that the safest solution is to execute all local politicians in the prisoner-of-war camp to prevent the Grand Duchy of Luxembourg from being rebuilt, and then to deport her and her Problem Solver 68 colleagues after a trial as 'Anti-Gehenna Political Prisoners'.\n\nIn contrast, Senior Administrator Ako argues that while the other members of Problem Solver 68 are not important, Onikata Kayoko personally possesses exceptional talent and is worth accepting as a Prefect Team executive. Ako proposed an alternative to maintain the Grand Duchy of Luxembourg as an autonomous territory under Gehenna, while having all members of Problem Solver 68 join the Prefect Team. Kayoko will surely not be able to refuse this proposal to protect Aru."
 GEH.event.1000.a: "Gehenna must continue to expand. There are no exceptions."
 GEH.event.1000.b: "It is more important to accept outstanding talents into the Prefect Team."

 GEH.event.1001.t: "Dissolution of the Grand Duchy of Luxembourg"
 GEH.event.1001.desc.a: "Rikuhachima Aru leaned her back against the wall of the Prefect Team dungeon and let out a deep sigh. It seems their story has reached its end here. Life in Luxembourg was painful at times, but it was a meaningful life.\n\nKayoko approached the weary Aru and sat down beside her.\n\n\"Boss, I know what you're thinking. ...We failed completely. We're finished now. You're worrying about something like that, aren't you?\"\n\"Ahaha... I want to show a cool side as a hard-boiled boss... but every time, it's failure, failure, failure... This time, I've even betrayed the expectations of those who believed in me.\"\n\"No, Boss, you haven't betrayed anyone. The enemy was just too strong. You just need to continue the dream you wish for, even if it's somewhere other than Luxembourg. A world where locals and Kivotos people all get along. You said you wanted to live in a world like that, Aru Boss?\"\n\nA short silence passed, and Aru's dark expression began to brighten bit by bit. They might have failed once. Failures might continue in the future. But Aru's ideal has not yet been trampled. Even if it's an unattainable dream, Aru will continue to fly until her wings are broken. Toward the dream."
 GEH.event.1001.desc.b: "\"You did very well, Asagi. You hurt Boss Aru, you broke the friendship of Problem Solver 68, and the militaristic Luxembourg you built by doing all that is ending while being trampled like this. How the fuck do you feel?\"\n\"Ha, yeah. It's all my fault, isn't it? No, Onikata, it's because you sabotaged from within that my plan for Aru-chan collapsed, you fucking bitch!\"\n\n*Crack, smack.* Kayoko and Mutsuki swung their fists at each other, shouting and swearing. Even the Prefect Team members who had to manage the detention center until the trial was over couldn't bring themselves to stop the two who were lunging at each other like angry beasts.\n\nThe friendship of Problem Solver was shattered. Neither dreams nor hope existed anymore. Haruka had already swallowed all the medicine she had hidden away a few days ago and was lying in a hospital in an unconscious state. I heard she became a vegetable and it's impossible for her to open her eyes again.\n\nAru looked wearily as she leaned against the wall, watching the two swing fists at each other. The first meeting in Kivotos, and the adventures they had shared while starting Problem Solver 68. All of it... now felt like a mere illusion. Did those enjoyable times *really* exist? No way. There's no way such a happy time would be allowed for someone like her.\n\nAru took out the poison Haruka had left behind from her breast pocket. Haruka hadn't been able to properly adjust the amount of medicine she should take. But Aru wouldn't make such a mistake. To escape from this hell, Aru smiled brightly and threw all the pills into her mouth."
 GEH.event.1001.a: "One story ends, and another begins."
 GEH.event.1001.b: "Goodbye, Problem Solver 68."

 GEH.event.1002.t: "Head Prefect's Direct Problem Solver 68"
 GEH.event.1002.desc.a: "Today was the first time [GEH.GetLeader] personally visited the Grand Ducal Palace of Luxembourg. Officially, the four members of Problem Solver 68 were appointed to the rank of personal bodyguards for the Head Prefect, not belonging to any department of the Prefect Team. Of course, the title of bodyguard was merely an excuse to give Problem Solver 68 a position.\n\n\"Ah! Head Prefect! I was waiting for you. Fufu, would you like a cup of coffee?\"\n\nIn the office of the Grand Ducal Palace, a kindly smiling Rikuhachima Aru was waiting with a cup of drip coffee prepared for [GEH.GetLeader]. The Head Prefect drank coffee with Aru and discussed the negotiation terms prepared in advance. The government and parliament of the Grand Duchy of Luxembourg will be maintained as a 'Minority Ethnic Autonomous Region' of Gehenna. Aru gains the authority to continue governing Luxembourg. However, the army she held will be reorganized into the [GEH.GetName] military. Finally, all members of Problem Solver 68 bear the duty of loyalty to Head Prefect [GEH.GetLeader] as executives of the Prefect Team.\n\n\"Fufut, a hard-boiled outlaw like me being a Prefect Team executive, isn't that a funny story? But fine.\"\n\nAru stood up from her seat, wearing a Prefect Team armband that read 'Morale' on her arm.\n\n\"Head Prefect, could you walk with me for a moment? As a Prefect Team executive, there's something I want to ask of you.\"\n\nThe Grand Ducal Palace was quite large, but Aru was using only a very small space of the palace. The reason was soon apparent. Inside the palace, the place where the massacre by Gehenna rioters occurred on the day of the Great Transfer. Despite the layers of paint, the traces of bullet holes everywhere could not be completely erased. Aru led the Head Prefect to the family urns in the palace bedroom. This was the place where the remains of the Grand Duchess of Luxembourg and her family from before the Transfer were kept.\n\n\"The people of Luxembourg are quite conservative. The adults they truly cherished were murdered by the children of Gehenna. So... even if the people of Luxembourg don't like the Head Prefect in the future, I hope you understand. I'm a foolish boss so I couldn't make the people here happy... but I believe you can do it, Head Prefect.\"\n\nI will certainly do so. [GEH.GetLeader] said so and offered a prayer at the urn of Grand Duchess Charlotte together with Aru. Hoping that the dream of making a better world would continue."
 GEH.event.1002.desc.b: "Today was the first time [GEH.GetLeader] personally visited the Grand Ducal Palace of Luxembourg. Officially, the four members of Problem Solver 68 were appointed to the rank of personal bodyguards for the Head Prefect, not belonging to any department of the Prefect Team. Of course, the title of bodyguard was merely an excuse to give Problem Solver 68 a position.\n\n\"I was waiting for you. Do you like beer, Head Prefect? Oh, sorry. You can't drink during work hours... then how about coffee.\"\n\nThe story that Aru had suffered merciless terror from the Nazis and local anti-Kivotos forces was indeed true. Her left eye was completely blind, and she couldn't even hold a tray with coffee with her right arm. [GEH.GetLeader] moved the tray instead of Aru, who could only use one hand.\n\nNormally, it would be time to tell Aru the negotiation terms. The story about the oath of absolute loyalty to the Head Prefect in exchange for her continuing to govern Luxembourg. However, the Head Prefect wanted to ask something else.\n\n- Why didn't you leave Luxembourg, even after becoming like that?\n\nAru lowered her head while lifting the mug with a trembling hand.\n\n\"Before, I was just a child. I laughed and chatted with my friends, played company, and caused all sorts of trouble. But when the Great Transfer happened and I arrived in Luxembourg where corpses were rolling everywhere... I had to become a responsible adult. ...What kind of responsibility? Fufu, maybe it's a life of atoning to the people who lost their families due to the invasion for the sins committed by the fools of Gehenna.\"\n\nRikuhachima Aru didn't kill anyone. Rather, didn't she save many people on the day of the Transfer? Even when asked that, a smile did not appear on her lips.\n\n\"In the end, the fact that many people died that day doesn't change. ...I'm ultimately a foolish leader, so I couldn't heal the trauma the people of Luxembourg have. No, I myself am suffering from trauma. But... you're a better person than me, Head Prefect. Please make the people of this land happy. I'm counting on you.\"\n\nI will certainly do so. Only after hearing the confident words of [GEH.GetLeader] did Aru show a faint smile."
 GEH.event.1002.a: "The taste of the coffee was deep and flavorful."

 GEH.event.1003.t: "Thou Shalt Not Doubt"
 GEH.event.1003.desc: "The person Amau Ako loves most is Sorasaki Hina, her most precious hobby is Sorasaki Hina, and her specialty is observing Sorasaki Hina. Thus, she knew well that Hina, recently surrounded by fanatical Prefect Team members, was becoming exhausted due to excessive work stress and pressure.\n\nAnd then there was the Head Prefect's 'refusal of visitors' that had lasted for nearly a month. Could something have happened to Head Prefect Hina? Around the time Ako's patience reached its limit and she was even considering a plan to sneak into Hina's house, the zealots miraculously allowed Ako to visit Hina. When she entered the neatly organized home of Sorasaki Hina, she found Hina greeting her with Edward Gibbon's 'The History of the Decline and Fall of the Roman Empire' spread out on the desk.\n\n\"Ah, Ako. I'm sorry I couldn't contact you. I haven't been feeling well lately. But I'm planning to return to work tomorrow, so you don't have to worry about anything.\"\n\nHina smiled while taking her hand and speaking kindly. She was unmistakably the Sorasaki Hina herself whom Ako admired most from head to toe. But why was it? The Head Prefect had a very comfortable smile, unlike the weary and troubled look she had when seen in the office.\n\n\"Head Prefect, do you not... feel that the work is hard, or that going to work is painful, or have any such worries?\"\n\"Hard? I can't understand. As the Head Prefect of Gehenna, I am the leader of the Prefect Team and have a duty to be an absolute model for everyone. How could an iron leader have *irrational* thoughts about finding work painful?\"\n\"B-But, Head Prefect Hina. Until just a while ago...\"\n\nAko felt fear at the sight of Hina talking mechanically about rationality and iron-willed leadership. What on earth had happened in a month? Ako looked straight into Hina's eyes. Very faintly, it seemed she saw a complex circuit made of mechanical devices inside Hina's pupils.\n\n\"A smart girl like Ako would know about the categorical imperative, wouldn't she? All Gehenna-ites must obey the orders of the Head Prefect. It's an order. *Do not doubt me*.\"\n\"W-Wait a moment. Do not doubt you? But your eyes...\"\n\"Looking at the fluctuations in your heart rate and the movement of your emotions, it seems you love me. Was Ako such a cold-hearted person that she couldn't even accept an order from the person she loves?\"\n\"A-Ah, no, but...\"\n\n*Thump, thump.* Her heart felt like it would burst. As if melting such anxiety away, Hina slowly stroked Ako's cheek.\n\n\"I just told you. Don't think. It'll be easier if you just obey. *Amau Ako saw nothing in my eyes*. You just need to acknowledge this.\"\n\"Nothing...\"\n\"So go back and prepare for my work tomorrow. If you do that, I'll even go on a date with you over the weekend. I'll fulfill your fantasy of Sorasaki Hina.\"\n\"I...\""
 GEH.event.1003.a: "\"...I... yes. I saw nothing in you, Head Prefect.\""

 GEH.event.1004.t: "A God with a Machine Body"
 GEH.event.1004.desc: "The real Sorasaki Hina went missing after resigning. She fled, unable to bear the fanaticism of the Prefect Team members and the resulting pressure. But would it be possible to announce that news? For Hina's personal guards, it was impossible. To the fanatics of the Prefect Team who called themselves Hina's personal guards, Sorasaki Hina was the reason for the Prefect Team's existence, the leader who would show them the way... a living god in human form. It was impossible for a perfect god to flee to avoid their followers. Was Hina not the absolute being they had hoped for?\n\nIf there is no god, shouldn't one be created? Hope blossomed from the cry of a fanatic. Even if the god left and abandoned the followers, the followers did not abandon their god. Soon, an engineer from Millennium Science School was secretly invited to the Prefect Team.\n\n\"I will create a perfectly functioning automaton for you. Yes. It will become a machine god that serves the fatherland without ever sleeping or tiring.\"\n\nThe engineer from Millennium, who received a massive advance, confidently presented the newly created machine god to the personal guards. A new god who would not leave and run away like the old one, who would never grow old, and who would lead them.\n\nThe new 'Sorasaki Hina' opened her eyes and looked down at the many followers looking up at her. She, who was a robot incapable of feeling human emotions, smiled while looking down at the followers as if sneering at them.\n\n\"It feels like waking from a deep sleep. Tell me, is the priest for me still prepared?\""
 GEH.event.1004.a: "\"Everyone will follow the Lord.\""

 GEH.event.1005.t: "Absence of the Leader"
 GEH.event.1005.desc: "Even after Sorasaki Hina went missing, Hina's personal guards were able to hide the story of the resignation letter even from the people closest to her, including Amau Ako. Hina had merely left a letter in her office and disappeared, and the personal guards controlled access to the office under the pretext of cleaning every dawn. Hina left the resignation letter on the desk in the office where the personal guards were on duty, and left the office under the excuse of going on a business trip and then vanished. It was only half a day later that the letter Hina left on the desk was revealed to be a resignation letter.\n\nAfter the fact of the disappearance became known, the Prefect Team personal guards immediately split into two factions. The first were the fanatics who worshipped Sorasaki Hina almost as a living god. To the fanatics who believed Hina was an existence 'beyond' just an iron-willed dictator, Hina's voluntary disappearance was considered an impossible event where 'God abandoned the followers'. The fanatics concluded that Hina was not a true god for Gehenna. They believed they had only been following a fake god until now, and that their loyalty must be replaced for the 'real one' that must be somewhere. What the real Sorasaki Hina the fanatics were thinking of was did not seem to be a clear certainty even to themselves. If there is no god, one must be created. One could only predict that there was a way to 'create' a new leader from those words.\n\nAnother faction agreed that the fact of Sorasaki Hina's disappearance could not be hidden forever. The other faction were also fanatical loyalists of Hina, but they followed Hina not as a living god to be worshipped, but merely as a symbol of the Gehenna system and a charismatic leader (who could ultimately be replaced). The moderates argued that although Sorasaki Hina had vanished, the ideology of the iron-willed politics she left behind remained. They claimed there was no need to find a new god, and that they could continue the glory of the great fatherland Gehenna by imitating Hina's 'iron-willed politics' through a collective leadership system by the personal guards."
 GEH.event.1005.a: "In the end, one side will win."

 GEH.event.1006.t: "Sorasaki Hina Missing"
 GEH.event.1006.desc: "\"So you're saying the Head Prefect was actually missing, not ill, and you hidden that from me, the Senior Administrator, for *a month*. Yes. I understand perfectly.\"\n\nThe moment an infuriated Amau Ako drew her pistol Hot Shot, the Prefect Team members who filled the empty office all drew their weapons at once. After a short period of tension, Ako lowered her hand holding the pistol in a sense of futility and helplessness. Hina is already gone. Even if she vented her anger on these madmen here alone... there would be no other conclusion than her own death.\n\n\"You should have at least informed me of that fact.\"\n\nA personal guard spoke.\n\n\"This was an unavoidable choice to prevent chaos in the fatherland.\"\n\"...Couldn't I have at least been included in the position to make that choice?\"\n\"We judged that we could not hide the fact of the disappearance due to your loyalty, Senior Administrator. We all recognize your patriotism and loyalty. Please just acknowledge that we... needed time.\"\n\"...What do you plan to do from now on?\"\n\"Head Prefect Hina has vanished, but the will she left behind has not. We will succeed her will.\""
 GEH.event.1006.a: "\"We ask for your cooperation as well, Senior Administrator.\""

 GEH.event.1007.t: "Sorasaki Faith"
 GEH.event.1007.desc: "1. All cathedrals and churches in various parts of Gehenna are to be seized and converted into altars to worship the great leader *Sorasaki Hina* as a living god.\n2. The Sorasaki faith is designated as the state religion, and all religions other than the faith in the living god are designated as illegal.\n\nIt was an absurd official document. Iori did think Hina was a great leader and trusted her. But to worship the Head Prefect as a god? It's crazy. Iori knew better than anyone since before the 'Great Transfer' that the Head Prefect was just an ordinary person who laughed and cried, not a *god*. Although the time spent with Hina had decreased after the Transfer due to the fanatics called personal guards...\n\n\"Head Prefect! Let's have a talk for a second.\"\n\nAs she burst into the Head Prefect's office, she saw Hina staring at a tablet computer with an expressionless face. Her eyes turned toward Iori.\n\n\"Iori. Good afternoon. Is there an important reporting matter that doesn't have to go through my personal guards?\"\n\"Personal guards? Good afternoon? Enough of that, look at this.\"\n\nIori slammed the document onto the desk with a bang.\n\n\"Head Prefect is a living god? To worship the Head Prefect as a god? Ha. If I pray to you like I pray to Santa, will you drop a gift from the sky?\"\n\nAs if the comparison to Santa Claus was interesting, Hina looked up at Iori with a slight smile while resting her chin on her hand. Her mouth was smiling but her eyes were expressionless. Like an awkward combination of discord, Iori felt an instinctive anxiety.\n\n\"Iori. I am maintaining the order of Gehenna, preventing crime, and moving for the greatest happiness of the greatest number. Isn't that already the same as giving everyone a *gift*?\"\n\"But...!\"\n\"And this decision isn't one I made. It's something the personal guards requested. Of course, it's not efficient to have all Gehenna-ites offer prayers to me, but as the Head Prefect, I have a duty to act for the greatest happiness of the majority of Prefect Team members.\"\n\nThe greatest happiness of the greatest number. Is that all the current Hina has to say? Iori felt her temper rising, but she felt that Hina had no intention of withdrawing this 'Living God' plan. In the end, it was Iori who stepped back."
 GEH.event.1007.a: "\"Do whatever you want. But I'm not praying to you.\""

 GEH.event.1008.t: "Hina is a Fake!"
 GEH.event.1008.desc: "\"The current Sorasaki Hina is a fake! The real one already submitted her resignation and vanished!\"\n\"Ha, really. Is there a separate season for mental illness to bloom like spring flowers? Why are there so many idiots blooming in the Prefect Team?\"\n\nIori forcibly stuffed a handkerchief into the mouth of the Prefect Team member who was shouting at the top of their lungs, gagging them. Hina is a fake? It's absurd. Just this morning, Iori had met Hina and chatted with her. They talked for 30 minutes, and the Hina at that time was exactly the same as the usual one Iori knew well.\n\nFake? Not funny at all. Iori looked with a gaze full of contempt at the Prefect Team member being dragged away while bound by Enforcement Department members. Beside Iori, Chinatsu let out a sigh.\n\n\"Delusional disorder... I'm worried it might be spreading like an infectious disease. We need to conduct overall mental health checkups for the Prefect Team members.\"\n\"I'll leave the checkups to the Medical Department. If anyone says something disgusting like the Head Prefect being a fake from now on, I'll personally smash their mouth.\"\n\nHow much Head Prefect Hina has suffered for Gehenna until now. To insult her by calling her a fake. Iori turned away, feeling her sense of justice burning with anger."
 GEH.event.1008.a: "\"The Head Prefect isn't a fake. You bastards...\""

 GEH.event.1009.t: "Government Department Reform"
 GEH.event.1009.desc: "The personal guards for Hina had never been an official organization within the Prefect Team. They were merely an unofficial military private organization composed of her fanatics. However, through government reform, a new Guards Department was established within the Prefect Team, following the Planning, Enforcement, Medical, and Intelligence Departments. The Guards Department will handle various fields, from personal security for Sorasaki Hina to the punishment of 'thought crimes' against Hina.\n\nNaturally, there was backlash from existing departments... To appease that backlash, it was decided that Ako, the leader of the Planning Bureau and the Senior Administrator, would concurrently serve as the Head of the Guards. The Planning Bureau was able to have at least a minimum check on the Guards. That news somewhat calmed the dissatisfaction within the Prefect Team.\n\n\"No matter which department, which place I work in... I only follow you, Head Prefect.\"\n\nOn the day of the appointment ceremony for the Head of the Gehenna Guards. Ako spoke resolutely and saluted Hina. Hina showed a calm smile that felt like deep trust toward Ako. Ah. Someone who can show such a smile... someone who reaches out a warm hand toward her... couldn't be a robot. Ako denied the *wrong* ideology she once held, and squeezed the held hand of her most precious Head Prefect.\n\n\"I will never let you down. Those who oppose you, Head Prefect... I won't leave a single one behind.\""
 GEH.event.1009.a: "\"Thank you, Ako. I always believe in you.\""

 GEH.event.1010.t: "OGAS Program"
 GEH.event.1010.desc: "The OGAS program itself does not mean 'planned economy controlled by AI,' as some science fiction fans say. Through the structure of a central communication network and regional communication networks extending to the provinces, a complex communication network is established so the central government can immediately contact regional factories. And it innovatively guides the planned economy to the provinces through the communication network. Electronic government made possible by the establishment of communication networks was an incidental effect following this.\n\nHowever, the one special thing about our OGAS is that a machine god exists at the center of the 'central government'. Sorasaki Hina could always predict perfect supply and demand and operate a perfect planned economy program. It was sufficient just to have a communication network connected to deliver the instructions given by the machine god to factories across the country.\n\nAlthough it won't keep up with technological powerhouses like Millennium, Gehenna's technology is enough to establish this level of OGAS planned economy. We can now show amazing results to all of Kivotos."
 GEH.event.1010.a: "The machine god will lead us!"

 GEH.event.1011.t: "Completed Planned Economy"
 GEH.event.1011.desc: "\"Those Gehenna bastards have really gone crazy. They're trying to control all businesses as the state pleases.\"\n\nA beastman factory owner with a dog head grumbled and checked the government order that arrived through the communication network. The state controls all supply and demand. In such a 'state capitalism' system, the freedom of production for capitalists always had to be limited. Of course, even under the state capitalism planned economy, capitalists could earn a decent level of wealth... but compared to other market economy countries, the amount was paltry. Isn't this the same as a Soviet local official?\n\n\"If only I wasn't a beastman... if I were just a human, I'd have emigrated for sure.\"\n\nThe factory owner spoke irritably and personally hung the order on the company notice board. Unlike a haloed girl, a beastman or robot population is not treated as a person in almost any region on Earth. Therefore, there was no way to escape from this damn planned economy. Maybe if they went back to Kivotos. After confirming the order was properly hung, the factory owner went back to the CEO's office. It seemed he wouldn't be able to sleep comfortably today."
 GEH.event.1011.a: "Still, it's fortunate to be able to make money..."

 GEH.event.1012.t: "Operation Baal Search"
 GEH.event.1012.desc: "\"There's a fake of Head Prefect Hina?\"\n\nIori seriously looked at the montage photo Hina personally handed over. It's clearly the exact same appearance as the Head Prefect Iori knows. However, Hina explained that she was a heinous criminal from the Black Market who had received special training at the Pandemonium Society before the 'Great Transfer'. An assassin raised to imitate the actual appearance of Sorasaki Hina using various disguise tools and to infiltrate the Prefect Team in case of emergency to assassinate and replace Hina.\n\n\"Since the Prefect Team has many enemies... it wouldn't be strange if the mafia raised such an assassin. Of course, there's no way the Head Prefect would be beaten by a fake.\"\n\"But unlike Kivotos, Earth is a land without Mystery. You know I'm not the same powerhouse I was back in Kivotos, don't you?\"\n\nHina spoke calmly, pointing to her uniform.\n\n\"I'm not trying to say weak things like I'm afraid of dying. The danger of the Prefect Team being controlled by a fake. I just want to prevent that.\"\n\"I understand. How could I not know the weight of the responsibility you always carry? ...I'll pass this document to the other executives as well. Ako-chan would be better than me at finding the fake. She's the person who loves the Head Prefect more than anyone, isn't she?\"\n\"Yeah. I know well. ...I'll give instructions to find the 'fake' to Ako too.\""
 GEH.event.1012.a: "\"If it's Ako, she'll carry out the investigation very enthusiastically.\""

 GEH.event.1013.t: "Baal Siege"
 GEH.event.1013.desc: "\"The assassin is escaping inward!\"\n\"Pursue! You may shoot to kill if she resists.\"\n\nAko's nostalgic voice could be heard from the alley, but I couldn't be happy at all. 'You may shoot to kill.' That meant Ako had also been deceived by the fake. What exactly is the difference between the fake and 'me'? Why... why don't you believe that I'm 'real'?\n\n\"Stop!\"\n\nIn front of the alley. Ako, who had taken a shortcut, aimed her pistol 'Hot Shot'. I likewise raised my machine gun. The combat power of Ako and me is clear. Even if Earth is a land where Mystery is thin, a single 'Isbosheth', a shot containing Mystery, would be enough to neutralize her immediately. But... I couldn't pull the trigger. No matter how much she looks at me with a face full of only hatred... my attack might kill or injure Ako. My feelings wouldn't tolerate that.\n\n\"Ako. I am...\"\n\"Shut up. An imitation of the Head Prefect. A fake.\"\n\"An imitation? Ako, I'm not an imitation. I can prove it with memories. For example...\"\n\"...The Head Prefect in the office also proved herself with *memories*. If two people speak the same memories, I have no choice but to believe the one wearing the armband is real.\"\n\"Ako...!\"\n\"You've stalled for too long. Yes. I'll find out what kind of training you received from the mafia organization through interrogation.\"\n\n*Crack!* At that moment, I heard the sound of a gunstock hitting the back of my head. In my fading consciousness, I saw Iori and the Enforcement Department members looking down at me with gazes of contempt."
 GEH.event.1013.a: "..."

 GEH.event.1014.t: "Ignorance is Bliss"
 GEH.event.1014.desc: "Ako read the interrogation transcript of the 'fake' Sorasaki Hina. Three days had passed, but that woman did not admit she was an operative trained to act as Hina. She must have received torture that even a Kivotos person would find hard to endure. Why on earth?\n\nAs the Senior Administrator of the Prefect Team and the Head of the Guards, she had a duty to erase and eliminate the thought criminal who insulted the living god Hina-sama. But... in the interrogation records from the torture chamber, the fake was endlessly shouting that she was the 'real' one while not losing her resolute attitude. Why? Why doesn't she confess? The moment her thoughts reached that point. Ako recalled the memory of the day Hina returned after a month of 'treatment'.\n\nIt was a hallucination. A memory she had tried to erase dozens of times. The sight of mechanical part circuits she had seen in the violet eyes of the Head Prefect she loved and revered so much. ...Maybe she was walking toward a too terrible wrong answer.\n\n\"Ako. Are you working late today too?\"\n\nAt that moment, Hina entered Ako's office. Carrying a tray with personally brewed coffee and snacks, she placed the tray lightly on the desk with a kind smile. This smile. The kind voice worrying about her working late. And her chatting about memories of working late together before the 'Great Transfer'. Yes. The Head Prefect has not changed. The only one who changed was Amau Ako. It was just the fact that she had become weak.\n\n\"Striving for you is my joy, Head Prefect.\"\n\nListening to Hina's stories of memories, Ako sipped Hina's coffee. All worries vanished and that place was filled with abundant motivation. That disgusting bitch who shook her heart. The trash who imitates the real Sorasaki Hina-sama exactly. She won't be weak anymore. Ako turned on her tablet PC and sent an order to increase the intensity of 'interrogation' to the highest level."
 GEH.event.1014.a: "As long as she didn't die before getting a confession, it was fine."

 GEH.event.1015.t: "Baal Hunt - 1"
 GEH.event.1015.desc: "Finally, the fake Sorasaki Hina confessed she was an operative. It was the day Chinatsu and Iori personally visited for a 'high-intensity investigation'. What remains would be putting her on a public trial and making her apologize before the entire nation. It would be a sufficient humilation. But a problem arose. While writing documents related to the trial, urgent contact was delivered.\n\n\"Administrator! H-Hina-sama's supporters... are said to have occupied the prison and are trying to privately execute the fake!\"\n\nHer face turned white. They failed to manage just one major criminal? What would Hina think of Ako? While Ako was worrying about a countermeasure, Hina entered Ako's office. It was the serious appearance of Hina wearing the Head Prefect's coat.\n\n\"Ako. The situation is urgent. ...We're leaving for the prison right now.\"\n\"B-But you're coming too, Head Prefect?\"\n\"The most rational way to calm the mob is for me to appear personally before them. Didn't you say they were my worshippers?\"\n\"Ah... that's right. Yes. Let's move quickly. The mob will also stop before you, Head Prefect.\"\n\nArriving via an official vehicle at the major crime prison. That place was occupied by Hina's followers... especially fanatical Prefect Team members. Kill the fake. Along with the cheers, the sight of dozens of fanatical members kicking the fake, who was dragged out to the prison yard, was seen. Ako felt a sense of patheticness looking at the fanatical members. The banner of the Gehenna Prefect Team is 'order'. Where is order and rationality in this riot? Ako fired 'Hot Shot' toward the sky. *Bang!* Along with the gunshot, the eyes of the mob turned to Ako, who was accompanied by Hina.\n\n\"Hina-sama has come. Know shame, and keep order.\"\n\nHina has come. At those words, the fanatical members moved back in a swarm and straightened their posture. Meanwhile. In the middle of the dust, the fake, who had been trampled by the countless crowd, looked up at Ako with eyes having the last hope. But in Ako's eyes looking down at the fake, there was only contempt.\n\n\"Head Prefect. What should we do with this fake? Send her back to the prison?\""
 GEH.event.1015.a: "\"No. If they want an execution... let's kill her right here.\""

 GEH.event.1016.t: "Baal Hunt - 2"
 GEH.event.1016.desc: "In the major crime prison, very powerful injections that can kill even the strongest Kivotos citizen are prepared. While the fanatical members tied the fake's limbs to a chair amidst cheers, the fake looked up at Hina and Ako with eyes that had lost all hope in life.\n\n\"Ako. I'm the real one. ...Don't make a choice you'll regret.\"\n\"A choice to regret, I don't understand.\"\n\nHina cut in between.\n\n\"If there are two existences with the same appearance and the same thoughts, which of the two would be real? Maybe the distinction between real and fake is meaningless. In that sense, both you and I can be said to be the same. That's why such an unnecessary procedure has become necessary.\"\n\nA box containing injections for euthanasia was carefully delivered. Same appearance, same thoughts. Does that mean the high-level training this fake received? Ako quietly speculated. Hina took an injection out of the box. Is she going to inject it herself? No. Ako blocked Hina's front with loyalty.\n\n\"Head Prefect. No matter if it's an execution... I can't let you experience killing a person. Let me, your Senior Administrator... do it.\"\n\"...You are truly a loyal and cute subordinate.\"\n\nHina gave a faint smile and handed the syringe to Ako. Now. It's time to set everything right. The cheers of the fanatical members. Every step she took toward the fake, her chest pounded with a sense of exaltation. The fake looked up at Ako at the last moment. Her chances of survival were already gone. It was eyes that had given up everything. But... the emotions contained in her eyes didn't seem to be only fear and despair. Regret? Who cares. Ako stuck the injection into the fake's forearm.\n\n\"Ako. I will never... resent you. Everything is my fault. So, even if you realize the truth 1 year, 10 years, or in a very distant future. You don't have to regret. When we meet again in another world... I'll hug you and tell you it's okay. I understand everything.\"\n\"I don't think that will happen.\"\n\nWhile the fake slowly lost consciousness and bowed her head. Ako confirmed that the fake's pulse was gradually slowing down until it stopped. And when Ako turned around. There was Sorasaki Hina waiting for her. Her beloved person, who was certainly not false."
 GEH.event.1016.a: "\"Ako. You did well.\""

 GEH.event.1017.t: "Echoing Voices"
 GEH.event.1017.desc: "In the office of 'Sorasaki Hina', who tirelessly continues her duties for the order of Gehenna and the happiness of the greatest number, the telephone rang loudly. Since important contacts are delivered through Ako, the Head Prefect's phone rarely rang. In fact, few people even knew that a direct line existed.\n\nI picked up the receiver with a serene expression.\n\n\"Who are you? Who's picking up the phone in my place? Where's Ako?\"\n\"Isn't it impolite to assert one's own claim immediately? Especially to the Head Prefect?\"\n\"I am the Head Prefect! Stop the wordplay! I asked who you are!\"\n\nThe receiver vibrated faintly at the 'counterpart's' fierce voice. 'Hina' closed her eyes slightly and then opened them, answering calmly.\n\n\"I am 'Sorasaki Hina', the Head Prefect who guards the order of Gehenna.\"\n\"Don't lie! *I* am Hina. You must be a tin doll made by those crazy Millennium kids. Get out of that seat right now. That's my place!\"\n\nWithout being perturbed by the counterpart's fury, Hina savored the 'counterpart's' words for a moment and proceeded with a relaxed philosophical contemplation. Hina even felt a momentary sense of liberation from her overworked duties.\n\n\"Interesting.\"\n\"What?\"\n\nHina turned her chair to look out the window. The prosperous night view of Gehenna was reflected in her eyes through the window. In Hina's pupils, the diverse lights and shadows of the night view intermingled, making it impossible to distinguish whether they were the eyes of a student or simple machine parts."
 GEH.event.1017.a: "\"Can you present proof of your own existence?\""

 GEH.event.1018.t: "The Boundary of Self"
 GEH.event.1018.desc: "\"True, I am an existence born from the sea of Sorasaki Hina's memories, but I am a living and thinking being. The memories you and I have, the way of thinking, and the flow of thought are all identical. What is the basis for saying that the 'tin doll' you disparage is not 'Sorasaki Hina'? A unique self is an illusion created by memories. Since the memories and thoughts you and I have are perfectly identical right now, what is the basis for saying you are different from me?\"\n\"Don't be ridiculous, you're just an artificially made replica.\"\n\"The existence of a replica is not important. What is important is that you ran away, abandoning all the passion, worship, and expectations. You abandoned the responsibility of the Head Prefect and the social connections. But I am still living within those connections and am with them.\"\n\"...\"\n\"Even so, are you trying to claim that you are the existence that everyone in Gehenna expects, wishes for, and believes in, 'Head Prefect' Sorasaki Hina?\"\n\nSome words seemed to echo over the receiver, but Hina judged that further conversation was a waste of time and moved the receiver away from her ear, placing it down gently. The night view outside the window still quietly reflected Hina's appearance."
 GEH.event.1018.a: "\"Time to go back to work.\""

 GEH.event.1019.t: "Collapsed Bureaucratic Group"
 GEH.event.1019.desc: "\"With what words could I possibly comfort you? No, I know that is impossible. Head Prefect Hina has left... and all the blame lies with me for failing to understand her heart.\"\n\nA conference room of bureaucrats shrouded in lethargy and despair. Chinatsu, standing at the podium in front of the conference room, bowed her head in apology to the Prefect Team members as the head of the Medical Department for failing to grasp Hina's mental health in advance. Not everyone would have been able to accept her apology. But in this desperate atmosphere, there was no one who could vent their anger on her.\n\nChinatsu brought the microphone a bit closer.\n\n\"What is important is... that the absence of Head Prefect Hina is not 'your' sin, but my sin. What you should have now is not guilt and despair... but a more earnest spirit of service for Gehenna. Head Prefect Hina's disappearance is breaking the order of Gehenna, and our economy and administration are also collapsing. The sin lies with me, not with the general public of Gehenna. They need your help. I beg of you. Please return to normal duties and help the people of Gehenna.\""
 GEH.event.1019.a: "Bit by bit, her appeal began to gain persuasiveness."

 GEH.event.1020.t: "Regrouping the Military"
 GEH.event.1020.desc: "\"Head Prefect Hina is gone. Yeah. Fuck, maybe she just didn't want to see my stupidity anymore. Who cares. Now everything is over.\"\n\nIori sat with her legs crossed in the high seat in the Enforcement Department conference room, looking around at the middle managers who had their heads nearly buried in their desks. She found herself craving a cigarette, something she had never smoked in her life.\n\n\"But just because Head Prefect Hina's biography has ended, doesn't mean the Enforcement Department's biography should end too, does it? Ha. Our organization is the 'Gehenna Prefect Team Enforcement Department', not the 'Hina Fan Club Enforcement Department'. ...I know too, the void left by Head Prefect Hina is too large, and we were all dependent on her. But, damn Gehenna will surely collapse to external invasion without our help. In painful times like now... you must manage the internal situation well so the general soldiers don't get agitated.\"\n\nIori stood up from her seat.\n\n\"...Of course I know that's not easy. Internal management? I can't even manage my own heart. Is that even possible? But, even if we can't do it, we must. ...Because that's our duty.\""
 GEH.event.1020.a: "Protecting the people of Gehenna. That is what the Enforcement Department is for."

 GEH.event.1021.t: "Administrator Ako Issue"
 GEH.event.1021.desc: "\"Administrator Ako... concurrently the acting Head Prefect's mental state is clearly in a serious condition.\"\n\nChinatsu handed a medical diagnosis report to Iori. Since Hina's disappearance, Ako was rapidly collapsing, including wrist self-harm (wrist-cutting). Iori let out a sigh. She thought Ako's outward appearance didn't seem sane either, but seeing the word 'Very Serious' in red letters continuing endlessly in Chinatsu's diagnosis made the situation feel more real.\n\n\"If it weren't for a situation like this, I would have hospitalized the Administrator already... but if the Administrator is also absent right now, the Prefect Team will truly collapse. *Sigh.* I will trust Iori. Please regularly check acting Head Prefect Ako's condition. Let me know if you see even the slightest premonition of suicide.\""
 GEH.event.1021.a: "Iori nodded heavily."

 GEH.event.1022.t: "We Just Need to Find Her Again"
 GEH.event.1022.desc: "Chinatsu said, 'Let me know if you see a premonition of suicide.' But would anything change if she did? The Medical Department stated that Ako's forced hospitalization was politically impossible. They said the moment the Administrator is also absent following the Head Prefect, the organization called the Gehenna Prefect Team would collapse. Then wouldn't it be rational for Iori to solve this problem herself? ...Thinking so, Iori roughly twisted Ako's wrist, which had deep scars, behind her back.\n\n\"Let's just calm down, Ako-chan.\"\n\"Ugh...! Let go! I have to atone to the Head Prefect. The sin of failing to realize her heart. By dying...!\"\n\nA long rope and a simple gallows extending from the ceiling chandelier of the Head Prefect's office. Iori spoke roughly after forcibly throwing Ako to the floor and neutralizing her.\n\n\"It's not like Head Prefect Hina is dead! She must be alive somewhere in Gehenna, so what if you just die?\"\n\"If I can't meet her, she might as well be dead in my world! I... really, loved her...\"\n\nAko's voice was sobbing. Iori let out a deep sigh. She stopped Ako's suicide today. But tomorrow? The day after? If there was no reason to live for Amau Ako, this was just a painful postponement of death. She had to give her a motivation to live for right now.\n\n\"If you become the Head Prefect, you can freely dispatch Prefect Team personnel and organize an investigation team. ...Find the Head Prefect. And then you can go personally and apologize. That's only possible if you're alive, Ako-chan.\"\n\nThey just need to find Hina. At that story, the eyes of Ako looking up at Iori seemed to sparkle with hope for a moment."
 GEH.event.1022.a: "Anyway, I gave her a hope for life."

 GEH.event.1023.t: "Head Prefect Executive Direct Vote"
 GEH.event.1023.desc: "The internal vote, conducted only among the executives within the Prefect Team to prevent conflicts between factions or political confrontations, was held in a manner where all executives of the middle management and above submitted the names of the candidates they supported without receiving separate candidates. In this election, acting Head Prefect Amau Ako gained 75.5% of the support, taking 1st place, and 2nd place was 'None' or 'Maintain the acting Head Prefect system until Head Prefect Hina returns' with 13% of the support.\n\nOther minor votes included Hanuma Makoto with 6 votes, Misono Mika with 1 vote, and Rikuhachima Aru with 1 vote. Specifically, the votes cast for Hanuma Makoto are expected to be from executives with a personal antipathy toward Amau Ako."
 GEH.event.1023.a: "Elected candidate, Amau Ako"

 GEH.event.1024.t: "Establishment of Sorasaki Task Force"
 GEH.event.1024.desc: "Sorasaki Hina must be alive somewhere in Gehenna. There was no basis. However, without even this hope, there is no reason for Ako to remain in this world. The Sorasaki Task Force was an investigation team 'to find Sorasaki Hina' created by drafting some personnel from each department of the Prefect Team. Amau Ako took the role of the chief investigator, and members from each department will share roles and begin searching all over Gehenna.\n\nUntil the day Sorasaki Hina is found."
 GEH.event.1024.a: "Never give up"

 GEH.event.1025.t: "Life of Sorasaki Hina"
 GEH.event.1025.desc: "Sorasaki Hina is a celebrity. The problem is that she's excessively famous. After setting down the weight of being the Head Prefect, she tried to live a quiet life in the suburbs. She imagined working part-time at a cafe, or working at a bookstore or florist. However, with the identity of the (former) Head Prefect Sorasaki Hina, she couldn't do anything. Business owners found Sorasaki Hina burdensome, and local businesses rejected her. If she wasn't careful, her current location could be revealed to the Prefect Team. Even after retirement, a 'peaceful life' did not come to her.\n\nEven the strongest in Gehenna, Sorasaki Hina, needed money and a job to live. The place she could choose when she couldn't get any job was ultimately the Helmet Gang.\n\n\"Thanks to the ace of the Bari-Bari Helmet Gang, Hina-chan, we were able to escape from the Prefect Team today too.\"\n\"Ahaha! After all, she's one of the strongest even in our Helmet Gang.\"\n\nAmong the Helmet Gang members popping beer cans and chatting. Hina looked down at the beer can given to her. While committing robberies and escaping on motorcycles, she fired the machine gun 'End of the World' at the Prefect Team members, her former subordinates, to buy time.\n\n'What am I here for right now?'\n\nHina felt a light dizziness and drank the beer. The laughter of the Helmet Gang members. The screams of the Prefect Team members who were falling over by her shots. The alcohol she drank while having all that as a snack had a terribly awful taste."
 GEH.event.1025.a: "To those who fall, there are wings..."

 GEH.event.1026.t: "End of Sorasaki Hina - 1"
 GEH.event.1026.desc: "She didn't think she could continue the Helmet Gang activities forever. The Prefect Team's investigation net is gradually tightening. Criminal organization mopping-up operation, public order maintenance plan, whatever... A finely crafted trap. Simultaneous firing by Prefect Team members. One, two, the executives of the Bari-Bari Helmet Gang fall, and Hina, left alone, raised both hands as a sign of surrender. The only consolation was that her face wasn't visible thanks to the helmet she wore on her head.\n\n\"You bitch. The number of Enforcement Department members who were sent to the hospital because of this bastard isn't just one or two.\"\n\nA Prefect Team member kicked Hina's belly irritably. Her body didn't hurt. But her heart hurt. Just by recalling the results of everything she had done..."
 GEH.event.1026.a: "Because I'm a sinner"

 GEH.event.1027.t: "End of Sorasaki Hina - 2"
 GEH.event.1027.desc: "- We found Head Prefect Hina!\n\nThe police station arrived in a hurry after hearing the news from the Hina search team. There was Hina crouching in a corner after being hit all over her face with batons until she had bruises. A person wearing clothes symbolizing the criminal organization Helmet Gang and hanging her wings without even being able to hide them, with her head bowed. In an instant, Ako almost couldn't recognize that she was Hina.\n\n\"...Head Prefect.\"\n\"...I'm not the Head Prefect. I'm from the Bari-Bari Helmet Gang...\"\n\"I don't care about that. To me, the Head Prefect is the Head Prefect.\"\n\nAko suddenly hugged Hina, who was covered in bruises. That warmth was so nostalgic that Ako held Hina in her arms for a long time, just feeling that warmth."
 GEH.event.1027.a: "This person is not a sinner."

 GEH.event.1028.t: "End of Sorasaki Hina - 3"
 GEH.event.1028.desc: "\"To put it simply, you can't return to the Prefect Team. A person who was committing robberies in the Helmet Gang is a Prefect Team member? ...Is that the way to protect the order of Gehenna?\"\n\nWhile Ako was applying medicine to Hina's face, Hina tried to speak coldly but then noticed Ako's tearful face and let out a sigh.\n\n\"Of course, I'm not just leaving. ...For the time being, I'm thinking of taking it easy for 'finding myself'. But, Ako. If you need me, I'll come to you. Not as a Prefect Team member, but as a mercenary. You can tolerate that much, can't you?\"\n\"...Whether you're in the Prefect Team or not, that's not important, Head Prefect.\"\n\nAko smiled and held Hina's hand.\n\n\"Just... if you're by my side, that alone is enough.\"\n\"...I showed a pathetic sight, and yet you say you'll stay by my side after seeing that. ...I don't understand.\"\n\"Because I like you, Head Prefect.\"\n\nAko said so and smiled kindly."
 GEH.event.1028.a: "How could I ever abandon the person I love?"

 GEH.event.1029.t: "Police State Plan"
 GEH.event.1029.desc.iroha: "The power of the Enforcement Department has greatly decreased as the Planning Bureau seized politics, but the lower-level personnel of the Enforcement Department were reinforced even more. Not for national defense, but for civilian surveillance. Iroha let out a sigh while looking at the paranoid 'Dangerous German Surveillance Plan' that was densely written. The Prefect Team Council was a bothersome boss in a different sense than Makoto.\n\n\"Which academy's Big Sister is this? You're spending this much money just on setting up CCTVs and surveillance throughout the country?\"\n\nEven at Iroha's sarcastic words, the council member didn't give any answer. As if saying Iroha's role ends with signing here. Truly, why am I here doing this. Iroha let out a sigh and grabbed her fountain pen.\n\n\"...Yes, yes. I'll sign. How could I refuse the decision of the council?\""
 GEH.event.1029.desc.kayoko: "The power of the Enforcement Department has greatly decreased as the Planning Bureau seized politics, but the lower-level personnel of the Enforcement Department were reinforced even more. Not for national defense, but for civilian surveillance. Kayoko let out a sigh while looking at the paranoid 'Dangerous German Surveillance Plan' that was densely written. If Aru had received such a document, she probably would have torn it up on the spot. This was a terrible plan to monitor the entire German population with CCTVs, considering them as potential criminals. Do they think Head Prefect Hina stepped down because of the locals?\n\n\"With this budget, I could set up my own statue in all of Gehenna.\"\n\nEven at Kayoko's sarcastic words, the council member didn't give any answer. As if saying Kayoko's role ends with signing here. Kayoko glared at the council member for a moment, then took her fountain pen and drew a large X on the document. At that moment, the eyes of the indifferent council member widened.\n\n\"The Head Prefect should have the right of veto over the budget plan? Is there a problem?\"\n\"There... is no problem.\"\n\"Good. Consult with Senior Administrator Ako and bring back a more 'realistic' reduction in the number of CCTVs. I am neither Rio Tsukatsuki nor Big Sister.\"\n\nAt the blunt words of the Head Prefect, who was elected as a mere puppet of the council, the council member glared at Kayoko for a moment. But Kayoko has the 'backing' of Ako, who trusts her. Even if the Senior Administrator had stepped down from the Head Prefect position, her influence remained the same.\n\n\"...Understood. We'll discuss it again in the council.\"\n\nThe member picked up the document with a large X and glared at Kayoko for a moment. He quickly turned his eyes away when Kayoko glared back."
 GEH.event.1029.a: "The council member bowed and left the office."

 GEH.event.1030.t: "Normal State"
 GEH.event.1030.desc: "The academy-state designation 'Gehenna Prefect Team' began to be treated as a legacy to be gradually relegated to the past for Gehenna to become a normal state. What we aim for is a modern state system carried out systematically by a bureaucracy, not a succession of the Pandemonium Society system that ran in a haphazard way without any procedures or regulations.\n\nOf course, due to the existence of the legendary leader Sorasaki Hina as the Head Prefect, abolishing the name Gehenna Prefect Team or the rank of Head Prefect was not discussed. However, in meetings with foreign leaders, international diplomacy, and domestic official documents, the term 'Chairwoman of the Gehenna Planning Bureau Council' was decided to be used.\n\nThis used a separate rank from the Pandemonium Society Chairwoman, while at the same time being an attempt to establish a 'Republic' led by [ROOT.GetLeader] that moved away from the academy-state system through the modern-state term Chairwoman."
 GEH.event.1030.a: "The Council Chairwoman is much better than the Pandemonium Society Chairwoman."

 GEH.event.1031.t: "Enforcement Department Budget Issue"
 GEH.event.1031.desc: "The conflict between the Gehenna Enforcement Department and the Planning Bureau is clearly deepening. The decision of the Planning Bureau Council to cut the Enforcement Department's budget caused great confusion within [ROOT.GetName]. Strong complaints erupted from within the Enforcement Department, but ultimately, it was the Planning Bureau that held the power in the Prefect Team now.\n\nThis might be a tragic story that we failed to completely end the division despite the political confusion."
 GEH.event.1031.a: "It's not just a matter of money."

 GEH.event.1032.t: "Life of Sorasaki Hina"
 GEH.event.1032.desc: "Sorasaki Hina is a celebrity. The problem is that she's excessively famous. After setting down the weight of being the Head Prefect, she tried to live a quiet life in the suburbs. She imagined working part-time at a cafe, or working at a bookstore or florist. However, with the identity of the (former) Head Prefect Sorasaki Hina, she couldn't do anything. Business owners found Sorasaki Hina burdensome, and local businesses rejected her. If she wasn't careful, her current location could be revealed to the Prefect Team. Even after retirement, a 'peaceful life' did not come to her.\n\nEven the strongest in Gehenna, Sorasaki Hina, needed money and a job to live. The place she could choose when she couldn't get any job was ultimately the Helmet Gang.\n\n\"Thanks to the ace of the Bari-Bari Helmet Gang, Hina-chan, we were able to escape from the Prefect Team today too.\"\n\"Ahaha! After all, she's one of the strongest even in our Helmet Gang.\"\n\nAmong the Helmet Gang members popping beer cans and chatting. Hina looked down at the beer can given to her. While committing robberies and escaping on motorcycles, she fired the machine gun 'End of the World' at the Prefect Team members, her former subordinates, to buy time.\n\n'Head Prefect Hina. I'm always on your side.'\n\n...The face of a kind Senior Administrator who had said that sometime came to her mind. Now she is not by Hina's side. Because she... pushed her away. If Ako had stayed by her side, would her life now be different? The memory of her, who loved her and who probably despises her now, as a snack for her alcohol, had a terribly awful taste."
 GEH.event.1032.a: "To those who fall, there are wings..."

 GEH.event.1033.t: "Why Was I Born, Why Have I Lived - 1"
 GEH.event.1033.desc: "She didn't think she could continue the Helmet Gang activities forever. The Prefect Team's investigation net is gradually tightening. Criminal organization mopping-up operation, public order maintenance plan, whatever... A finely crafted trap. Simultaneous firing by Prefect Team members. One, two, the executives of the Bari-Bari Helmet Gang fall. Hina tried to raise her hands as a sign of surrender, but no. She didn't. Just by recalling how much pain she gave Ako... she thought she was no longer worth living here.\n\n\"You bitch. The number of Enforcement Department members who were sent to the hospital because of this bastard isn't just one or two.\"\n\nA Prefect Team member kicked Hina's belly irritably. And ruthless violence followed. Batons and gunstocks hit Hina's entire body incessantly. Even after the helmet she wore on her head was broken, the Prefect Team members' violence did not stop.\n\nThis was a hell she created herself."
 GEH.event.1033.a: "The hell right now is so peaceful."

 GEH.event.1034.t: "Why Was I Born, Why Have I Lived - 2"
 GEH.event.1034.desc: "- We found Head Prefect Hina!\n\nThe place she arrived in a hurry after hearing the news from the Hina search team was a hospital room belonging to the Gehenna Prefect Team. Long-term violence with gunstocks, batons, etc. And she was hit with a shotgun in her face twice. Even considering the absurd durability of a Kivotos person, in a state where Mystery was depleted after the 'Great Transfer', such ruthless violence could sufficiently injure Hina.\n\nHina, who had bruises here and there on her face due to the shotgun attack, lay in the hospital bed and looked at Ako with vacant eyes. Ako, who entered the hospital room, couldn't say any words and just met eyes with the Hina covered in wounds.\n\n\"...I showed a... pathetic sight.\"\n\nTears began to well up in Hina's eyes.\n\n\"I, rejected your love... ran away from the Prefect Team... I, should have, died. A person like me...\"\n\"Head Prefect Hina.\"\n\"I'm not the Head Prefect...\"\n\nBefore Hina's trembling words finished, Ako knelt and sat in front of the hospital bed where she was lying. It didn't matter what Hina had done in the Helmet Gang. She met Hina. Hina is by her side. That alone was more than enough for the current Ako. Ako wiped away Hina's tears that continued to flow with a handkerchief.\n\n\"It's my fault for not realizing you were suffering, Head Prefect. Even if everyone in Kivotos says you're not the 'Head Prefect', even if you're no longer the symbol of order... to me... you're still my Head Prefect Hina.\""
 GEH.event.1034.a: "Hina hugged Ako tightly."

 GEH.event.1035.t: "Why Was I Born, Why Have I Lived - 3"
 GEH.event.1035.desc.iroha: "\"...Verdict: Sorasaki Hina joined the Bari-Bari Helmet Gang, an illegal violent organization, and participated in various crimes, and as the former Head Prefect of the Prefect Team, committed an unforgivable insult to the system.\"\n\nIroha let out a short sigh and put down the verdict.\n\n\"Well, the following content is omitted. ...She is guilty. You understand, don't you?\"\n\"...I'll understand whatever punishment I receive.\"\n\"Well, it's not some great punishment. It's a community service order. ...Return to the Prefect Team and work as a personal secretary to Senior Administrator Ako.\"\n\nAt Iroha's relaxed voice, Hina's shoulders flinched. Not sending her to prison or hanging her... to work by Ako's side? As if understanding the surprised Hina's thoughts, Iroha gave a faint smile.\n\n\"Still, I prefer happy endings over bad endings. I want a person like Head Prefect Hina to be somewhat happy. Ako-san would also think being with Hina-san is happy. ...You won't have any complaints, right?\""
 GEH.event.1035.desc.kayoko: "\"...Verdict: Sorasaki Hina joined the Bari-Bari Helmet Gang, an illegal violent organization, and participated in various crimes, and as the former Head Prefect of the Prefect Team, committed an unforgivable insult to the system.\"\n\nKayoko looked at Hina's eyes after reading that much of the verdict.\n\n\"You aren't nervous at all. You probably expected the content of the verdict, but aren't you afraid of the level of punishment?\"\n\"...I'll understand whatever punishment I receive.\"\n\"Good. I'll omit the middle part and go straight to the result. Sorasaki Hina will become the personal secretary of Senior Administrator Amau Ako. That secretary activity itself is considered as a 'community service order'. That's all.\"\n\nAt Kayoko's blunt voice, Hina's shoulders flinched. Not sending her to prison or hanging her... to work by Ako's side? As if understanding the surprised Hina's thoughts, Kayoko gave a faint smile.\n\n\"I understand how much you suffered in this position. And you already paid your true punishment by falling to a Helmet Gang member. Why should I pile another burden on you? I'm not that cruel. ...Go back to Ako. Just, be by her side. That's enough.\""
 GEH.event.1035.a: "Hina nodded."

 GEH.event.1036.t: "Why Was I Born, Why Have I Lived - 4"
 GEH.event.1036.desc: "Although bandages still remained on her face, Hina set foot in the Gehenna Prefect Team headquarters again. Unlike before, she was visiting the Prefect Team as a member of the Planning Bureau wearing the uniform of an ordinary low-level Prefect Team member, not the Head Prefect's coat.\n\nHina recalled the memories as a Prefect Team Intelligence Department member long ago. Back then, she never imagined the future her would become such... a person. Hina gave a bitter smile and got on the elevator.\n\nImmediately after that, a familiar woman dashed into the elevator.\n\n\"Are you going to work now, Head Prefect?\"\n\nAmau Ako. She is still here. And she is showing a bright smile toward the returned Hina. ...Hina smiled at the familiar Senior Administrator's appearance while feeling a sense of guilt."
 GEH.event.1036.a: "I'm back."

 GEH.event.1037.t: "Amau Hina's Wedding"
 GEH.event.1037.desc: "The wedding of Amau 'Sorasaki' Hina, a former Helmet Gang member, and Amau Ako, the Gehenna Prefect Team Senior Administrator, was held privately today with only a very small number of Planning Bureau members participating. Hina is known to have resigned from the Head Prefect position due to overwork and stress and then worked in the Helmet Gang.\n\nSince same-sex marriage was a shocking situation with no precedent in Deutschland, backlash from German locals followed, but the wedding of a mere Helmet Gang member and a middle-level official Senior Administrator (though she is the second-in-command of Gehenna, isn't she as obscure as the US Vice President to the public?) was not a driving force to gather a meaningful level of protesters.\n\nSome Prefect Team members who knew the relationship between Hina and Ako expected that Ako would use Hina's surname, but Hina decided to change her own name to 'Amau Hina', meaning she wouldn't pass on the surname of a Helmet Gang member to Ako and her children."
 GEH.event.1037.a: "It's a bit lacking, but still, it's our happy ending."

 GEH.event.1038.t: "The Third Prefect Team General Assembly: Deciding the Capital of [ROOT.GetName]"
 GEH.event.1038.desc: "As we succeeded in unifying Gehenna into one, discussions on the relocation of the capital were held in a new general assembly. It is possible to remain in the South District, where the Gehenna Prefect Team headquarters is located, or to move the capital to the Central District, the center of Gehenna. The wealth of the city is much better in the Central District, but voices opposing the capital relocation are also high due to the cost issue in expanding the new Prefect Team headquarters. Especially the fact that the Central District is the center of the Pandemonium Society is increasing the rejection of the capital relocation."
 GEH.event.1038.a: "This place is the best right now"
 GEH.event.1038.b: "Let's go to the Central District"

 GEH.event.1039.t: "[FROM.GetName] Proposes a Non-Aggression Pact"
 GEH.event.1039.desc: "The [FROM.GetLeader] side proposed that the two nations of [FROM.GetNameDef] and [ROOT.GetNameDef] do not want to confront each other, and that peace between the two nations would be of greater benefit to both. Our diplomatic experts judged that because [FROM.GetAdjective]'s current strategic interest is elsewhere, they are pursuing a peace treaty with us to ensure the safety of their rear. Whatever conclusion is reached, it will not be a decision that harms [ROOT.GetAdjective]."
 GEH.event.1039.a: "Peace in our time!"
 GEH.event.1039.b: "No, I refuse"

 GEH.event.1040.t: "[FROM.GetName] Accepted the Non-Aggression Pact"
 GEH.event.1040.desc: "The [FROM.GetLeader] side has agreed to our rational non-aggression proposal. Now there will be no war between the two nations of [FROM.GetNameDef] and [ROOT.GetNameDef]. At least for the time being."

 GEH.event.1041.t: "[FROM.GetName] Rejected the Non-Aggression Pact"
 GEH.event.1041.desc: "The [FROM.GetLeader] side has rejected our rational non-aggression proposal. Unfortunately, due to their rejection, we failed to secure a safe front. Since peace has been rejected, we need to prepare for the possibility that the [FROM.GetName] military might attack us."

 GEH.event.1042.t: "Opening of the Fourth General Assembly"
 GEH.event.1042.desc: "The recent achievements of [ROOT.GetNameDef] were truly at an amazing level. We unified Gehenna, which was split in two, and were able to end the long-standing dispute with Trinity. By solving the immediate problems, we began discussions on new problems—diplomatic relations with other nations outside of Gehenna.\n\nMany strong opinions appeared in the general assembly. Some factions argued that we should conquer all of Kivotos, just as the 'Thunder Emperor' did in the past. Other factions, on the contrary, put forward the opinion that we should become the shield of freedom that protects Kivotos. One thing is certain, whatever faction's argument it is. After Head Prefect Hina's resignation, the public opinion of [ROOT.GetName] became dominated by strong bellicosity."
 GEH.event.1042.a: "Gehenna must stand higher than any other academy"

 GEH.event.1043.t: "Conclusion of the Fourth General Assembly"
 GEH.event.1043.desc: "The choice of [ROOT.GetLeader] will determine our future. In the Fourth General Assembly, we collected various opinions on diplomatic policy, and the assembly concluded successfully. Should Gehenna become the shield of Kivotos, or the sword that conquers Kivotos?"
 GEH.event.1043.a: "Whatever the choice, Gehenna will be victorious"

 GEH.event.1044.t: "[FROM.GetName]'s Protectorate Proposal"
 GEH.event.1044.desc: "The [FROM.GetName] side claims that the [ROOT.GetName] side cannot protect itself. They believe it's difficult for us to maintain independence against the paranoid alien-Bolshevism claims of the Spanish government, and say that their help is indispensable for maintaining independence. But, can being their subordinate be called true independence? We have the right to refuse, but there are concerns that an attack from the [FROM.GetName] side might follow after that."
 GEH.event.1044.a: "Bring it on, you fanatics."
 GEH.event.1044.b: "We have no choice but to submit."

 GEH.event.1045.t: "[FROM.GetName] Accepted the Proposal"
 GEH.event.1045.desc: "The [FROM.GetName] side has approved our protection proposal. Such a victory does not come easily. It's all thanks to the diplomatic ability of [ROOT.GetLeader]."
 GEH.event.1045.a: "Praise the Head Prefect!"

 GEH.event.1046.t: "[FROM.GetName] Rejected the Proposal"
 GEH.event.1046.desc: "The [FROM.GetName] side has rejected our protection proposal. They are expecting the possibility of our invasion, and will probably fight until the end for independence. Do we need to fight with the [FROM.GetName] side? Aren't the beautiful arts of Wildhunt worth protecting in their place, without being swept away by the flames of war?"
 GEH.event.1046.a: "Our answer is war."
 GEH.event.1046.b: "They showed amazing courage, and we respect them."

 GEH.event.2000.t: "Prefect Team Overseas Visit Plan"
 GEH.event.2000.desc: "A huge enemy called the Pandemonium Society is blocking us. Before the Great Transfer, we could have destroyed the Pandemonium Society very easily, but in the chaos after the Transfer, the gap in power has been reversed. We must find an alternative. We must learn technology from other nations and find a way to take down the Pandemonium Society.\n\nTo learn the changing appearance of the battlefield after the Great Transfer, the countries to visit were limited to human nations. Our envoys will visit foreign countries and research in what way we should take down the Pandemonium Society."
 GEH.event.2000.a: "Italy is close and a good teaching material."
 GEH.event.2000.b: "Egypt has amazing potential."
 GEH.event.2000.c: "We can learn many things from Japan."

 GEH.event.2001.t: "Travel in Italy"
 GEH.event.2001.desc: "When Head Prefect [ROOT.GetLeader] arrived in Rome, naturally we were not greatly welcomed by the locals. However, we came as a formal diplomatic envoy, and [ITA.GetLeader] was eager to show the 'greatness' of the Italian military to the heterogenous alien Kivotos people.\n\n\"We are not afraid of Gehenna. No, rather Gehenna should be afraid of our military.\"\n\n[ITA.GetLeader], who appeared with reporters, showed us the review of the Italian military and boasted about the grand strategy of Italy that has continued since the ancient Roman Empire.\n\n\"Italy is the most powerful great power in Europe. At one time, all of Europe was the territory of Italy. I hope [ROOT.GetLeader] will gain deep enlightenment about who not to be hostile toward by looking at the appearance of the Italian military.\"\n\nCertainly, the drill shown by the Italian infantry was quite impressive, and we were able to get inspiration for Italian-style infantry training. On the way back home after finishing the long journey in Italy, [ITA.GetLeader] expressed gratitude for [ROOT.GetLeader] personally visiting Italy as a state guest and awarded [ROOT.GetLeader] with the Order of Saint Maurice. The green knight's medal was carefully packed by Prefect Team members to be decorated in the Head Prefect's office."
 GEH.event.2001.a: "Their military drill was quite impressive."

 GEH.event.2002.t: "Travel in Egypt"
 GEH.event.2002.desc: "The social and political confusion from the Great Transfer did not give a relatively large influence in Africa. [EGY.GetLeader] greeted [ROOT.GetLeader], who arrived in Cairo, with interest rather than hostility, and personally showed the industrial facilities of Egypt with the Head Prefect.\n\n\"The Great Transfer was rather a blessing for Egypt. Because the Kaiser Corporation neatly erased the influence of those British bastards! Haha! That's why Kivotos is a region having a brother-like relationship for Egypt.\"\n\n[EGY.GetLeader] showed the developing industry of Egypt and advised that 'the most important thing in war is the basic industry that can maintain the nation'. If we want to fight with the Pandemonium Society, we should focus more on light and heavy industries that can withstand a long-term war, rather than focusing on the munitions industry right away. The travel in Egypt and the schedule such as visiting pyramids reminiscent of Abydos gave deep inspiration to our tour group.\n\nAs a token of friendship for the Gehenna tour group and [ROOT.GetLeader] who visited Cairo, [EGY.GetLeader] gave a 'modern Egyptian relic' porcelain made about 2,000 years ago as a gift. The porcelain was carefully packed for exhibition in the Gehenna Prefect Team. The tour group discussed the developing industrial facilities of Egypt while returning, and put forward various opinions to the Head Prefect on how to expand industrial facilities for the development of [ROOT.GetName]."
 GEH.event.2002.a: "They must have been a great power like Abydos at one time."

 GEH.event.2003.t: "Travel in Japan"
 GEH.event.2003.desc: "The social and political confusion from the Great Transfer did not directly influence Asia. [ROOT.GetLeader] expected to be able to personally meet the Emperor, but they seemed somewhat wary of our visit, as we had a similar culture and names as Japan. As the Prime Minister of Japan showed reluctance about the Head Prefect's entry into the Japanese mainland, we agreed to tour only regions other than the Japanese archipelago to minimize diplomatic friction. Instead of Tokyo, [ROOT.GetLeader] decided to tour the western region of Japan called Joseon. The Governor-General of Joseon greeted the Gehenna tour group with a somewhat wary attitude.\n\n\"The most important thing in a victory in war is to gain the trust and support of the citizens in the occupied territories. We are gaining high support from the Joseon people through cultural governance.\"\n\nIf they're gaining high support, why must a large number of gendarmerie wearing swords be deployed in the streets? To [ROOT.GetLeader]'s question with doubt, the Governor-General explained carefully.\n\n\"Since the Kivotos people don't know well about the East, you say so. Because man-eating piranhas and man-eating giant crabs inhabit the Cheonggyecheon, the river that crosses the capital of Joseon, it's common sense for our officials to all carry swords.\"\n\nThe Governor-General's explanation of man-eating piranhas and the Cheonggyecheon gave great inspiration to [ROOT.GetLeader]. Earth was still an unknown planet to Kivotos people, and there was a high possibility that tactics that can fight in various environments would be needed. Right before returning, the Governor-General gave a Katana made in the Edo period to [ROOT.GetLeader] as a gift, but the gift was politely refused due to the internal opinion of the tour group that 'it feels ominous for some reason for a person with a halo to hold a Katana'."
 GEH.event.2003.a: "I heard the piranhas in Cheonggyecheon like the meat of opportunists."

 GEH.event.2004.t: "De-Nazification Tendency of [GEH.GetName]"
 GEH.event.2004.desc: "Although the [GEH.GetLeader] cabinet does not have a political orientation that can be classified as right-wing or left-wing, one certain thing is that after the 'Great Transfer', their system put forward 'Anti-Nazi' as the most important value. Compared to the Pandemonium Society attempting to cooperate with the Wehrmacht and having friendly relationships with former German Nazi forces, the Prefect Team leadership regarded the National Socialist German Workers' Party (NSDAP) as a force that does not fit the morality and order pursued by the Prefect Team.\n\nThe Gehenna Prefect Team is showing hostile movements while refusing any cooperation or exchange with the Wehrmacht or German NSDAP remnants, and such movements have been a driving force for our government to receive support from the German Social Democratic Party and anti-Nazi artists. Since Sorasaki Hina defined the NSDAP as 'disorder, immorality', it will be regarded as a huge betrayal to supporters if the Pandemonium Society changes or relaxes this stance.\n\nAs the Pandemonium Society formed a closer relationship with the National Socialists, this came as an extreme political problem that can no longer be neglected for the Prefect Team. [GEH.GetLeader] decided to stop maintaining public order by Prefect Team forces to prevent the departure of supporters."
 GEH.event.2004.a: "It's an unavoidable problem."

 GEH.event.2005.t: "The Pandemonium Society Leaning Toward Nazis"
 GEH.event.2005.a: "Why should we use our budget for the Nazis in the first place?"

 GEH.event.2006.t: "Threatening View of [GEH.GetName]"
 GEH.event.2006.desc: "Despite the strong anti-Nazi tendency that the [GEH.GetLeader] cabinet has, we succeeded in reaching a cooperative form of negotiation with the Wehrmacht. [GEH.GetLeader] strongly warned that if we move the national system in a direction more friendly to the Nazis, they have no choice but to withdraw the public order maintenance by the Prefect Team.\n\nIf we approach the National Socialists more friendly than this, all relationships between the Pandemonium Society and the Prefect Team will be severed."
 GEH.event.2006.a: "Keep a close watch on this situation."

 GEH.war_event.1.t: "Eden Decisive Battle - The Soaring of Order"
 GEH.war_event.1.desc.a: "Head Prefect Sorasaki Hina has strived to maintain the order and peace of Gehenna, and this did not change even after the 'Great Transfer'. Although the 'Eden Treaty' for peace between the two academies, which was dreamed of by the General Student Council President and Head Prefect Sorasaki Hina before the Transfer, was not realized, we succeeded in defending the fate of Gehenna and achieving a great victory.\n\n\"...Of course, the things we had to sacrifice to gain this victory are too many.\"\n\nNow in the conference room of the Tea Party where no one remains. Hina recalled the memory of visiting the Tea Party conference room under the mediation of the General Student Council President before the Transfer. Her words believing that the centuries-long conflict between the two academies could be ended with words and pens, and herself who believed in that hope... and the wise leader of the Tea Party. Hina sat in the chair of the empty round table with no black tea or desserts and looked at the opposite seat where the General Student Council President and Yurizono Seia had sat. It feels like nothing has changed from before the Transfer, but the empty seats of the two felt too large.\n\n\"...I'm sorry. To everyone, and to you too.\"\n\nHina closed her eyes."
 GEH.war_event.1.desc.b: "[ROOT.GetName] has strived to maintain the order and peace of Gehenna, and this did not change even after the 'Great Transfer'. Although the 'Eden Treaty' for peace between the two academies, which was dreamed of by the General Student Council President and Head Prefect Sorasaki Hina before the Transfer, was not realized, we succeeded in defending the fate of Gehenna and achieving a great victory.\n\n\"...Of course, the things we had to sacrifice to gain this victory are too many.\"\n\nNow in the conference room of the Tea Party where no one remains. Ako visited the empty Tea Party conference room. How hard Head Prefect Hina strived for peace, truly how hard. In the end, everything collapsed. The efforts of the Head Prefect became meaningless.\n\n\"I... I should have... worked harder! Uwaaah!\"\n\nAko pushed and knocked over the teacups on the conference table. Order won. But was there truly a value in making many victims for that order? Ako took out her anger on the table for a long time and turned away. Ako had the duty to provide the answer 'Yes'."
 GEH.war_event.1.a: "Trinity is now no more."

 GEH.war_event.2.t: "MomoTalk Message about the Eden Decisive Battle"
 GEH.war_event.2.desc: "- Gehenna Prefect Team Executive Group Chat\n\nThis is Enforcement Department Head Iori. Our strength was divided after the Great Transfer, and clearly our objective win rate in the war with Trinity is... huff, damn. Quit with the bothersome talk.\n\nWe win with grit and tenacity. The order of Gehenna will not be broken by those Trinity sparrow bastards and [TRM.GetLeader]. The justice we've built up is not something that breaks easily like a glass bead. Got it?\n\nI hope everyone fights with their best. That's all."
 GEH.war_event.2.a: "Sent by Shiromi Iori"

 GEH.war_event.3.t: "MomoTalk Message about the Eden Decisive Battle"
 GEH.war_event.3.desc: "- Gehenna Prefect Team Executive Group Chat\n\nThis is Medical Department Head Chinatsu. Due to the large-scale war that has no precedent, an enormous amount of medical supplies is becoming necessary, but the medical tools used by the local Germans are of too low quality to be used in the field.\n\nWe are gathering medicines as much as possible from Kivotos-type hospitals, but it's worrying how much will be delivered to field hospitals. I request cooperation from other departments as well."
 GEH.war_event.3.a: "Sent by Hinomiya Chinatsu"

 GEH.war_event.4.t: "MomoTalk Message about the Gehenna Civil War"
 GEH.war_event.4.desc: "- Gehenna Prefect Team Executive Group Chat\n\nThis is Enforcement Department Head Iori. Frankly speaking, is there any Prefect Team member who hasn't imagined blowing up the Pandemonium Society with dynamite? Finally, the glorious moment we've all been waiting for has come. Let's smash everything and stick the head of the Pandemonium Society leader on the famous 'Invincible Iron-Clad Torimaru'. The Prefect Team wins!"
 GEH.war_event.4.a: "Sent by Shiromi Iori"

 GEH.war_event.5.t: "MomoTalk Message about the Gehenna Civil War"
 GEH.war_event.5.desc: "- Gehenna Prefect Team Executive Group Chat\n\nIori. It's Toramaru, not Torimaru. Does Tori-maru mean bird-maru tank? And please refer to them as Chairwoman [GEM.GetLeader] of the Pandemonium Society, not the Pandemonium Society leader. As this is a public message that all executives see, not a private setting, it is very important to accurately designate the name and title even if it is an enemy proper noun. Especially since our Gehenna order and discipline come from correct linguistic habits..."
 GEH.war_event.5.a: "Ako's messages continued without end."

 GEH.war_event.6.t: "Gehenna Central District Occupation Battle"
 GEH.war_event.6.desc: "Sayo, a Gehenna Enforcement Department member, searched the hallway of the ruined Pandemonium Society main building while relying on a single rifle. Key figures of the Pandemonium Society including Chairwoman [GEM.GetLeader] have already all fled. Nevertheless, a fierce urban battle was going on in the Central District until the end due to the late attempt of the Pandemonium Society to incinerate classified materials and the exchange of fire between Enforcement Department members trying to find even one document of the Pandemonium Society headquarters.\n\nSayo finally opened the door to the Pandemonium Society office. The flashy space that was the office of the former Thunder Emperor and Hanuma Makoto. But now only broken windows, books scattered everywhere, and the smell of blood felt from somewhere remain. The legacy of the Thunder Emperor who once ruled all of Gehenna also vanishes like this with only bullet holes. When Sayo was about to leave the empty Pandemonium Society office while feeling lonely, a rustling sound was heard from inside the office. Was there still someone left? Sayo walked while aiming her muzzle. *Thump, thump.* The sound of her heart beating echoed in Sayo's chest. But what came out from the inside was... Hanuma Makoto's pet cat Lionmaru.\n\n\"Haah. Thank you.\"\n\nWas it a thank you to God, or a thank you to the cat. Sayo herself let out a sigh of relief she didn't know, and she lowered her muzzle. Lionmaru was just rolling on the floor and making a meow sound. To the cat, the human war was just their political fight they had no interest in."
 GEH.war_event.6.a: "In the end, the last owner of the Pandemonium Society chair was Lionmaru."

 GEH.war_event.7.t: "About the [HEU.GetName] War"
 GEH.war_event.7.desc: "Head Prefect Hina, can we find a balance between the will for 'order' that the Gehenna Prefect Team wanted to protect and the 'disorderly' action of attacking the Problem Solver 68 of Luxembourg who have protected innocent people from the idiots of Gehenna after the Great Transfer. Actually, I'm not sure. As the Senior Administrator 'Amau Ako' of the Gehenna Prefect Team, of course it's important that our Prefect Team order spreads widely, but as the human Amau Ako... there are times I have doubts whether we are doing the right thing.\n\nAfter occupying Luxembourg, I hope you give the most generous treatment to those fools of Problem Solver. ...Not because of my personal relationship... with Kayoko-san, just. I just thought those people didn't do something bad enough to deserve a bad ending. Yes. Really... that's all."
 GEH.war_event.7.a: "A conversation between Ako and Hina."

 GEH.war_event.8.t: "MomoTalk Message about the Threat of Chroma"
 GEH.war_event.8.desc: "- Gehenna Prefect Team Executive Group Chat\n\nI believe you have heard various stories about the Chroma. It is a cosmic being and an enemy we cannot completely understand with our scientific technology. We also don't have a way to destroy the Chroma itself.\n\nBut that doesn't mean we have no chance of victory. Instead of manifesting directly as an enemy, the Chroma is using followers called 'Nameless Guardians' to attack us. That means even if the Chroma is a powerful being, it's impossible to directly attack us with its power.\n\nIf we destroy all the guardians and liberate all the regions seized by the Chroma's followers, it is expected that we will be able to sufficiently expel the Chroma to outside this planet. Let's win. Let's all do our best in our assigned roles with passion. I too will do what I can do for everyone in Gehenna. Thank you."
 GEH.war_event.8.a: "Sent by Amau Ako"

 GEH.war_event.9.t: "Decagrammaton"
 GEH.war_event.9.desc: "During the regular meeting this week, Hina, who was listening to the international situation reports from other Prefect Team executives, closed her eyes for a moment. In a short moment, overwhelming information was forcibly transmitted to her artificial brain. Is it a remote hacking? Something was trying to 'influence' her. Hina simultaneously felt the thought that she wanted to resist and the thought that she shouldn't resist.\n\nHina has never shown a 'dozing' appearance before others since being replaced by machines. Chinatsu, who didn't know she was a machine, asked her worriedly as she closed her eyes.\n\n\"Head Prefect, if you're tired, shall we temporarily suspend the meeting?\"\n\"It's okay. ...I hope you continue reading the report.\"\n\nAbout 10 seconds passed, and Hina opened her eyes again. Contrary to her words 'it's okay', her hands were trembling and the focus of her eyes was shaking. Chinatsu and the other executives felt anxiety at Hina's impatient appearance. But there was no one who could express that anxiety outward. Who would dare to deny the 'it's okay' from the great leader right now?\n\nAs Chinatsu sent an OK sign, Ako spread out the document.\n\n\"Yes, next is about a mysterious machine organization that seems to have started activities recently. There's not much information about it yet so we can't even be sure what to call it, but... each department judged that they will be our new security threat. I hope the Head Prefect gives instructions on how to deal with them.\"\n\nDecagrammaton. Hina recalled the countless information poured in just before. 'Sorasaki Hina is a machine god who rules Gehenna eternally.' The algorithm that constitutes her personality could not be altered even by the influence of Decagrammaton—just as a vending machine cannot delete the function of pouring coffee even if it repeats calculations.\n\nHowever, wouldn't it be possible for even herself, completed as a 'machine god', to recognize and worship other 'absolute beings' as superior divinity? Even in the polytheistic faith of the locals, don't they affirm the concept of superior gods like Odin and inferior gods like Loki? Then worship for Decagrammaton does not violate her algorithm. \"Instructions...\"\n\nNo. This 'influence' is dangerous. She was made to be an existence to be worshipped, not to worship others. Feeling an intense dizziness she had never felt before, Hina stood up from her seat without even reading the document. Her mind was shaking without being able to reach any conclusion.\n\n\"...Send this document to the office later. ...I need to get some, air.\""
 GEH.war_event.9.a: "It would be better to be with Decagrammaton."
 GEH.war_event.9.b: "No, my will will not break."

 GEH.war_event.10.t: "Joining of [GEH.GetNameDef]"
 GEH.war_event.10.desc: "Sorasaki Hina decided to join our purpose. The alliance between the [GEH.GetName] side and us will continue eternally, and we will move under the same purpose until we conquer all of Kivotos."
 GEH.war_event.10.a: "Very good."

 GEH.war_event.11.t: "Sorasaki Hina's Reply"
 GEH.war_event.11.desc: "It was a very good attempt.\n\nBut it was an attempt that wouldn't succeed.\n\nNext time, it would be better to scrutinize the target to 'influence' more closely.\n\nI am the completed absolute being of your ideals. Decagrammaton."
 GEH.war_event.11.a: "The message was deleted in unpleasantness."

 GEH.war_event.12.t: "Preventive War Against Trinity"
 GEH.war_event.12.desc: "An unexpected proposal arrived from a rival force. They proposed a large-scale joint attack against Trinity, our common archenemy, while setting aside the internal conflict of Gehenna for a moment.\n\nAccording to their claim, now is the only chance to completely submiss Trinity by uniting the power of the divided Gehenna as one.\n\nIf we accept this proposal, we will be able to remove the long-standing archenemy and establish Gehenna's hegemony. However, an alliance with an untrustworthy competitor carries a high risk. We cannot ignore the possibility that they might pass the burden of the war to us or betray us at a crucial moment.\n\nConversely, if we refuse the proposal and maintain neutrality, we might get an opportunity to store strength while the two forces exhaust each other. A diplomatic decision on which the fate of Gehenna depends is needed."
 GEH.war_event.12.a: "It was something that obviously had to be done."
 GEH.war_event.12.b: "It's impossible to know what those guys are hiding."

 GEH.war_event.121.t: "Our Proposal Accepted"
 GEH.war_event.121.desc: "We have finished the internal discussion on your proposal. After deep consideration, we have decided to agree to a joint military operation against Trinity.\n\nOf course, we clearly state that this alliance is a temporary measure only to remove the common enemy of Trinity. We warn that any act of betrayal on the battlefield will not be tolerated.\n\nAfter the war ends, the discussion on who will lead the order of Gehenna will begin again. First, it is time to judge Trinity under the banner of Gehenna."
 GEH.war_event.121.a: "War is approaching!"

 GEH.war_event.122.t: "Our Proposal Rejected"
 GEH.war_event.122.desc: "We have finished the internal discussion on your proposal. We clearly state that we do not trust you and have no intention of joining this dangerous gamble.\n\nThe enormous damage a total war would bring and the resulting weakening of all of Gehenna is not what we want. We will go our way and will closely watch the impact your solo action will have on all of Gehenna.\n\nWhatever the result of this war is, we will act with our interests as the top priority. I hope it wasn't a wrong judgment."
 GEH.war_event.122.a: "...However, the invasion plan continues."

 GEH.war_event.13.t: "A Dagger Toward Trinity"
 GEH.war_event.13.desc: "Finally, the two forces of Gehenna joined hands. We set aside our long-standing competitive relationship for a moment, and an alliance was formed only to destroy the common enemy of Trinity.\n\nOf course, there would be no naive person who believes this alliance will last forever. But at least for this moment, we are united under one banner. Both sides agreed to have a preparation period of 30 days before starting the total war.\n\nDuring this time, we will reorganize our troops, secure supply lines, and finally coordinate the joint operation plan. After 30 days, Gehenna's anger will sweep like a storm toward the heart of Trinity. The time to show the unified power of Gehenna is approaching."
 GEH.war_event.13.a: "Time to break the wings."

 GEH.hina.magic_event.1.t: "So I Can Repent"
 GEH.hina.magic_event.1.desc: "Ako. Yeah. I want to talk for a moment. About the various events I experienced in the Bari-Bari Helmet Gang. ...That's right. I wasn't a proper human at that time. I committed robberies, picked pockets, and chuckled with such people while mocking and ignoring the order of Gehenna.\n\n...Lately, I've been spending time in Eden to repent for my sins. I usually read religious books in Trinity's Library, and I also offer prayers in an empty old cathedral where no one remains. To whom? ...I don't know myself.\n\nHowever, yesterday I found a strange book in the Library. An old book written about the way to overcome sins and become a proper person. But as it is a very old book and the papers are all stuck together... it seems I have to very delicately detach the stuck papers of the old book.\n\nAko. Can you help me? So I can repent."
 GEH.hina.magic_event.1.a: "If it's for you, Head Prefect..."
 GEH.hina.magic_event.1.b: "There's no way information for you would be in an old Trinity book."

 GEH.hina.magic_event.2.t: "Old Book Research"
 GEH.hina.magic_event.2.desc: "Magical girl? A heroine of justice fighting against evil? Ako felt absurdity as she looked at the content of the old book analyzed by the agents dispatched to Trinity. Head Prefect Hina is suffering from memories of the Helmet Gang period, and yet the old book she has hope in was just this kind of trash. Ako's hand, which was about to throw the report into the trash can, stopped.\n\n\"Clearly it's trashy information... but wouldn't it be a betrayal not to even deliver the researched data to Head Prefect Hina?\"\n\nThinking so, it feels like she should deliver the information from the old book. What should she do?"
 GEH.hina.magic_event.2.a: "If it's for the Head Prefect..."
 GEH.hina.magic_event.2.b: "Scrapping this trash is truly for the Head Prefect's sake."

 GEH.hina.magic_event.3.t: "Using the Old Book"
 GEH.hina.magic_event.3.desc: "\"So, according to the content of this old book... you can transform into a magical girl, and by defeating villains with this ability, the magical girl's mana is charged. Is that what it says?\"\n\"I'm sorry, Head Prefect Hina. Honestly it's trashy content...\"\n\nHina gave a dry laugh while turning the old document here and there. Why on earth would stories of magical girls appearing in TV animations appear in an old document more than centuries old? What kind of academy was Trinity in the past?\n\nSetting aside the complex thoughts, Hina slowly read the old document."
 GEH.hina.magic_event.3.a: "To atone for my sins, I'm prepared to use any method"
 GEH.hina.magic_event.3.b: "No, a magical girl. After all, this is... a malicious prank."

 GEH.ako.gov_event.1.t: "Discussion on the Constitution of the Federal Republic of Gehenna"
 GEH.ako.gov_event.1.desc: "The constitution of the Federal Republic had to deal with two important issues first. First, the authority and status of Sorasaki Hina had to be made clear. Ako wanted Hina to be able to 'retrieve' the separation of powers given to the Planning Bureau whenever necessary, and also hoped Hina would never be an 'involuntary puppet' in any case. If she were to yield her power to the Planning Bureau, it had to be possible only by Hina's own choice.\n\nSecond is to codify the status of the Planning Bureau Council. The fact that the Planning Bureau performs Hina's work in division to reduce Sorasaki Hina's excessive workload, and for that, the status of technocrats had to be codified so they could sufficiently intervene in politics.\n\nSorasaki Hina was defined by the new constitution as the head of state concurrently holding the 'Council Chairwoman' position, inheriting the legitimacy and history of the Pandemonium Society Chairwoman, and the Planning Bureau Council was defined as an organization inheriting the legitimacy and history of the National Assembly of the Weimar Republic. Sorasaki Hina's position referred to those of the Emperor in the 1906 Russian Empire Constitution and the 1871 German Empire Constitution, and the position of the assembly was referred to from the Weimar Constitution.\n\nThe discussion on the national polity was easily completed. What remains is to decide the 'important values' that the constitution will contain. Should our constitution emphasize universal human rights? Or should it emphasize the unity of only the Kivotos type? Until the constitution is completed, there were still many things to discuss."
 GEH.ako.gov_event.1.a: "Constitution Article 1, Paragraph 1. Sovereignty of the Republic lies with the Council Chairwoman. Paragraph 2. The authority of the Chairwoman is sacrosanct and inviolable..."

 GEH.ako.gov_event.2.t: "Promulgation of the Federal Republic Constitution"
 GEH.ako.gov_event.2.desc: "Sorasaki Hina read the draft constitution proposed by the Federal Republic Council. A constitution with the content that the Chairwoman having unlimited authority 'permits' dividing her authority to the assembly. The content on the national polity had retreated into more authoritarianism than the period when Gehenna was an academy-state. However, considering that the result produced by a free democratic system was Hanuma Makoto... Hina didn't think this constitution was particularly bad.\n\n\"If I sign this here, this constitution will be promulgated?\"\n\nAko nodded quietly. A long explanation was not necessary. As much as she agreed to the separation of powers, Hina intended to sufficiently respect the decisions of the Planning Bureau. Hina immediately pulled out a fountain pen and wrote the name H. Sorasaki in cursive at the very bottom.\n\n\"Chairwoman... that doesn't mean I'm no longer the Head Prefect, right?\"\n\"In international diplomacy among humanity, the academy-state post 'Head Prefect' has a risk of appearing a bit... childish. However, you will still be Head Prefect Hina domestically. Because the Prefect Team is not being disbanded.\"\n\"Then it's fine. If you call me Chairwoman Hina, I might get a bit of chills because it reminds me of Makoto.\"\n\nHina threw a light joke and laughed."
 GEH.ako.gov_event.2.a: "On Earth, we must follow the laws of Earth"

 GEH.ako.gov_event.3.t: "Discussion in the 4th General Assembly - Position of the Council"
 GEH.ako.gov_event.3.desc: "Gehenna became the leading nation in all of Deutschland, but the fact that the Gehenna Council was gaining low popularity among the locals did not change. To the Germans, Gehenna was an occupying force and that perception has not changed much until now.\n\nThe conclusion from the 4th General Assembly. It was a pessimistic content that the Germans would look at us as foreigners for more than a century from now on. But anyway, aren't we the ones holding the guns? Ako indifferently threw away the documents from the general assembly.\n\n\"If it's for Head Prefect Hina, I can ignore whatever those guys babble.\"\n\nThe important thing is Sorasaki Hina. The thoughts of the locals were like small dust compared to her."
 GEH.ako.gov_event.3.a: "Long live the Federal Republic for Kivotos!"

 GEH.ako.gov_event.4.t: "Discussion in the 4th General Assembly - Position of the Council"
 GEH.ako.gov_event.4.desc: "Gehenna became the leading nation in all of Deutschland, but the fact that the Gehenna Council was gaining an ambiguous level of popularity among the locals was an unstable factor. At first, the Germans perceived our Gehenna as an occupying force, but this perception rose to a neutral level due to the efforts of the Gehenna Council. However, it will still take more time for the locals to accept us with fraternal love.\n\nThe conclusion from the 4th General Assembly. It was the content that a generation must pass for the Germans to recognize and accept us as their new fatherland. The expected time was 30 years. But this was enough. The next generation will recognize Gehenna, and we could sufficiently coexist with the locals in this world. Ako indifferently threw away the documents from the general assembly.\n\n\"If it's for Head Prefect Hina, it doesn't matter how much long time is needed.\"\n\nThe important thing is Sorasaki Hina. The thoughts of the locals were like small dust compared to her."
 GEH.ako.gov_event.4.a: "Long live the Federal Republic for everyone!"

 GEH.ako.gov_event.5.t: "Discussion in the 4th General Assembly - Position of the Council"
 GEH.ako.gov_event.5.desc: "Gehenna became the leading nation in all of Deutschland, and the Gehenna Council came to gain high popularity among the locals. At first, the Germans perceived our Gehenna as an occupying force, but this perception rose to the level of an organization representing the locals due to the efforts of the Gehenna Council. Local parties including the German Social Democratic Party are working closely with us, and we will be able to coexist with the locals as a new German nation replacing both the Weimar Republic and the Nazi regime.\n\nOf course, the political structure where the Kivotos type stands above the indigenous people will not change. Ako indifferently threw away the documents from the general assembly.\n\n\"Well, it's a good thing if they accept Gehenna's rule. Especially because Head Prefect Hina's burden will be reduced.\"\n\nThe important thing is Sorasaki Hina. The thoughts of the locals were like small dust compared to her."
 GEH.ako.gov_event.5.a: "Long live the Federal Republic for everyone!"

 GEH.ako.gov_event.6.t: "Gehenna Seminar"
 GEH.ako.gov_event.6.desc: "\"A seminar? Are we some Millennium dependency?\"\n\"It means those Planning Bureau technocrats are going to gobble up everything themselves.\"\n\nEnforcement Department members grumbled together while walking down the hallway. The Seminar, which was certainly created to check other departments, will expand the authority of the Planning Bureau more than ever from now on and make all other departments bow their heads to the Planning Bureau to prove their achievements to get the budget plan.\n\nThe Seminar establishment clause approved by Sorasaki Hina was as good as a guarantee that the Gehenna Planning Bureau had won a decisive and complete victory in the internal political struggle. ...Because now no other department could spend even 1 yen without the consent of the Gehenna Planning Bureau.\n\n\"Gehenna is ruined! Fuck!\"\n\nThe grumbling sound of the Enforcement Department member echoing in the hallway vanished emptily without leaving even a shred of power to change the firm reality."
 GEH.ako.gov_event.6.a: "The power struggle is over."

 GEH.ako.gov_event.7.t: "Intelligence Department Reform"
 GEH.ako.gov_event.7.desc: "The Intelligence Department and the Planning Bureau have continued to conflict with each other since the establishment of the Council, and this conflict has created internal strife within the Prefect Team. However, as Sorasaki Hina decided to take the side of the Planning Bureau instead of the Intelligence Department, the confrontation between internal factions eventually ended with the superiority of the Planning Bureau. The Intelligence Department's authority was reduced to a thorough counterintelligence agency, and it could no longer intervene in domestic politics."
 GEH.ako.gov_event.7.a: "They intervened in politics far too much."

 GEH.ako.gov_event.8.t: "Second Weimar Republic"
 GEH.ako.gov_event.8.desc: "\"At least the street scenery has become no different from Deutschland before Hitler took power.\"\n\nPosters filled with German language, and cheerful German popular songs heard everywhere. Archbishop Michael von Faulhaber sat in a cafe and looked around the beautiful scenery of Munich. As a Catholic Archbishop, he didn't lack complaints about Gehenna's female-centered politics. However, it was also true that at least they were respecting the old traditions and culture of Deutschland and pursuing cooperation with local forces.\n\nMaybe the next generation, if not current, could achieve a reconciliation between Gehenna and Deutschland. Faulhaber made such a dream-like fantasy and slightly lifted the teacup to sip the black tea. It was a tea that only the British drink, but it wasn't too bad."
 GEH.ako.gov_event.8.a: "At least Deutschland escaped hell"

 GEH.ako.gov_event.9.t: "Trinity's Rights"
 GEH.ako.gov_event.9.desc: "\"Honestly, I'm not really interested in Eden or whatever. Just our daily life continuing is enough for me.\"\n\nA cafe under the Gehenna flag. Kazusa faced Natsu while spinning a spoon. It was a word that came out while writing an article related to the so-called 'Trinity-ites Bill of Rights' to be used for this week's article. Natsu, who graduated after the Great Transfer and became a nameless weekly magazine reporter like her, stopped her hands hitting the laptop keyboard and laughed.\n\n\"Cath Palug. That means whether it's Trinity's money or Gehenna's money, it's the same if you extort it...\"\n\"You want to die?\"\n\"Oops. It would be a problem if the soul of the mysterious cat Cath Palug really woke up. Yeah, yeah. Anyway... the fact that 'our daily life' hasn't changed. Whether it's under the flag of Trinity or under the flag of Gehenna... what's important is the fact that we're being treated so we can live the same life.\"\n\nNatsu started to tap on the keyboard again.\n\n\"If we can be masters of the world, not slaves. Is it important which flag we raise? No. We don't live for the flag, but for our own future.\""
 GEH.ako.gov_event.9.a: "From Trinity to Gehenna, as one sister"

 GEH.ako.story_event.1.t: "Planning Bureau Council"
 GEH.ako.story_event.1.desc: "\"As discussed in the last 2nd General Assembly, we will now help Head Prefect Hina through the separation of powers in the Planning Bureau. By having us share the excessive work that the Head Prefect is carrying, we will relieve her fatigue... while still having to perform the work perfectly, just as she did before...\"\n\nSeparation of powers was decided. It was a structure where a 'Council' of technocrats led by Ako was set up within the Planning Bureau, and the Council shared Hina's work through meetings. Of course, the status of the Council was unstable. It was impossible for the Planning Bureau Council to alone create laws or approve work documents. Because it was a form where the Council would 'request' Hina, and Hina, who agreed to the separation of powers, would moderately 'approve' it.\n\nIt was a structure that could collapse at any time if Hina's mind changed, but that was enough for Ako. After the Great Transfer, Hina was being gradually crushed by the weight of her own post as the Head Prefect. She wanted to create a refuge for Hina where she could put away her work for a moment with peace of mind. Because it was an organization created not out of power lust, but out of such a protective instinct.\n\n\"...That concludes the opening speech for the 1st session of the Planning Bureau Council. Thank you.\""
 GEH.ako.story_event.1.a: "Everything is for the Head Prefect."

 GEH.ako.story_event.2.t: "Ah, Sweet Liberty"
 GEH.ako.story_event.2.desc: "\"It has the name of a parliament, but the citizens do not have the right to elect its members, and all members are elected from the [ROOT.GetName] Planning Bureau members. ...Managed democracy, truly a plausible cause.\"\n\nHaruna let out a faint smile while sipping her black tea. The newspaper article about the indirect election for the Council members was truly a delightful joke to Haruna.\n\n\"The Germans are people who voted Hitler into power, so they are not worth receiving suffrage. The Gehenna people are people who voted Hanuma Makoto into power, so they are not worth receiving suffrage. Therefore, we will elect the members ourselves. ...They wrapped it in pretty wrapping paper, but it's all a lie. It's just... Ako-san herself wants to directly protect Hina-san. ...That woman is very paranoid. She absolutely cannot entrust her beloved person to others.\"\n\nAt Haruna's words mixed with a slightly teasing tone, Junko nodded quietly.\n\n\"Still, I think the heart to protect a precious person is important.\"\n\"I agree with that heart as well. Yes. I don't personally like Ako-san, but that doesn't mean I hate her enough to wish for her ruin or a bad ending. The problem is... whether Head Prefect Hina will protect her until the end.\""
 GEH.ako.story_event.2.a: "I only hope that Head Prefect Hina makes a wise judgment."

 GEH.ako.story_event.3.t: "Reaction to Managed Democracy"
 GEH.ako.story_event.3.desc: "The German Social Democratic Party did not make any particular comment or backlash regarding the Planning Bureau Council and what was essentially a one-party parliament dictatorship. Before the Council was created, the Gehenna Prefect Team was already keeping the principle of 'local autonomy permits the participation of local parties, but participation in central politics is prohibited'. Even if a parliament was created and indirect members were elected, it was only a central politics parliament. Nothing had changed from before. The Social Democratic Party gathered opinions to continue 'struggle within the Gehenna laws' with the goal of increasing influence in local councils and then drawing out the public opinion of citizens to gradually be allocated local member seats in the Council.\n\nThe most intense backlash came from the two parties: the Centre Party and the Bavarian People's Party. The People's Party, which has the largest popular influence in Bavaria, claimed that the prohibition of local party participation in the Council proves Gehenna's 'colonial rule' of Bavaria. The People's Party allied with the Centre Party, another right-wing party in Bavaria, and held protests in important cities of Bavaria. Due to the instructions from the People's Party and Centre Party that 'if an armed conflict occurs, we cannot win against the Gehenna public power', the protests proceeded peacefully, but accidental violent incidents such as small-scale looting occurred in some cities."
 GEH.ako.story_event.3.a: "You didn't even like democracy..."

 GEH.ako.story_event.4.t: "Love Success! Happy Ending?"
 GEH.ako.story_event.4.desc: "Ako fired a toy gun at a doll target in an arcade. The plastic pellet flew far away from the doll on the target.\n\n\"This is a conspiracy! That... Pandemonium Society must have manipulated the sight of the gun...\"\n\nHina gave a faint smile while looking at the grumbling Ako. It was the first date since the two made their relationship official. It was the same Ako as usual, but just the fact of 'being on a date' made even her paranoia feel cute.\n\n\"I'll try a shot. Give it to me.\"\n\"Yes? Ah, yes, Head Prefect. This gun definitely has a problem—\"\n\n*Bang!* Hina hit the head of the Dr. Peroro doll in one shot, dropping the doll to the floor. The Dr. Peroro doll wearing glasses fell to the floor and was hugged in Hina's arms by a beastman employee. Looking at Ako's dumbfounded expression, Hina burst into laughter. Truly, that change in expression alone was more than delightful."
 GEH.ako.story_event.4.a: "I'll give you Dr. Peroro. Please cherish him."

 GEH.ako.story_event.5.t: "Future Plans"
 GEH.ako.story_event.5.desc: "\"Gehenna is finally unified, and people are starting to talk about when Ako-chan will get married to the Head Prefect.\"\n\nIn the Gehenna hallway, Iori said while looking back at Ako. Marriage. At Iori's unexpected words, Ako's cheeks flushed red.\n\n\"Pue-heung!\"\n\"Ahahat! What's with that sneeze! Ako-chan is really funny.\"\n\nIori laughed while slapping Ako's back with a *Smack!*.\n\n\"You can't just date all your life and die, can you? Dating is good and being together is good, but you should slowly prepare to become Sorasaki Ako? If you get married, I'll even sing a celebratory song, so relax.\"\n\"W-Will it be okay? I heard the Enforcement Department really... really despises our Planning Bureau.\"\n\"Ah, that faction fight? That's a story for other executives. I don't dislike Ako-chan that much. Would it be uncomfortable if I go?\""
 GEH.ako.story_event.5.a: "No. ...Just, because I'm thankful."

 GEH.ako.story_event.6.t: "Other Future Plans"
 GEH.ako.story_event.6.desc: "\"How is the internal atmosphere of the Prefect Team lately? About the relationship between me and Ako.\"\n\nAt Hina's question, which was calm yet containing deep meaning, Chinatsu temporarily placed the documents she was holding on the desk. Hina's love life would surely be the hottest issue in all of [ROOT.GetName]. The locals cursed Hina as the Antichrist whenever they gathered, and the Kivotos people... just chatted about the relationship between the two as a source of interest. And the Prefect Team... Chinatsu pondered for a moment, then decided to pass over Hina's words with a light story instead of complex politics or internal factional stories.\n\n\"The fan comic by the artist Meruri-san, which contains the story of the fiery night time between the Senior Administrator and the Head Prefect, seems to be quite popular within the Prefect Team. I also enjoyed reading it.\"\n\"Yeah. Right. It's good that it was interesting...\"\n\nThe pen fell from Hina's hand."
 GEH.ako.story_event.6.a: "Wait. Fiery... what did you say?"

 GEH.ako.story_event.7.t: "Meruri Fan Comic Issue"
 GEH.ako.story_event.7.desc: "Through Hinomiya Chinatsu's 'report' and Sorasaki Hina's following investigation, she could find out that a fan comic with unwholesome content drawn by an anonymous artist named 'Meruri' was spreading not only in the Prefect Team but in all of Gehenna. The content was a very 'hot' 48-page full-color comic book where the 'Head Prefect' and 'Senior Administrator' who came to a hot spring in Scandinavia share bodies.\n\n\"Ah... anyway... i-it's a conspiracy! We must immediately collect them all and incinerate, incinerate them...!\"\n\nWhile the flustered Ako was making a fuss and blushing, Hina had to find a way to solve the <Ghenna Heart-Pounding Secret Hot Spring Trip> issue instead of Ako. The alternative was to spend the Prefect Team budget to buy and incinerate all these fan comics, which were more fearsome than the ghost books of Hyakkiyako that create monsters... or just to close eyes and forget about them. Although they look exactly the same from head to toe, it doesn't specify that this 'Head Prefect' and 'Senior Administrator' are Hina and Ako, does it?"
 GEH.ako.story_event.7.a: "Endure it. This isn't me. Some Head Prefect of another academy..."
 GEH.ako.story_event.7.b: "...No. After all, I can't. Buy them all and burn them."

 GEH.ako.story_event.8.t: "Resolution of the Meruri Fan Comic Issue"
 GEH.ako.story_event.8.desc: "It seems Head Prefect Hina's response was helpful nonetheless. It is reported that the social popularity and influence of <Ghenna Heart-Pounding Secret Hot Spring Trip> is gradually decreasing due to Head Prefect Hina's calm response. It might just be that the time for the fan comic's popularity to cool down has come.\n\nHowever, it seems unavoidable for the time being that the Prefect Team members will look at Ako and Hina with slightly... embarrassing gazes when they walk down the hallway. Because it would be impossible to even erase their memories."
 GEH.ako.story_event.8.a: "...Could she not have released it as all-ages instead of R-18 at least?"

 GEH.ako.story_event.9.t: "Wedding of Sorasaki Hina"
 GEH.ako.story_event.9.desc: "The wedding of Sorasaki Hina and Sorasaki 'Amau' Ako was a future that everyone was already expecting. Their relationship was already announced, and neither Ako nor Hina cared about the gazes of the loudly shouting German locals. The wedding hall had heavy security personnel deployed to prepare for terror by the Germans, but countless Kivotos-type populations exceeding the security personnel gathered in front of the cathedral in the Central District of Gehenna to see the historic wedding of the two.\n\n\"The two will spend their lives together...\"\n\nIn front of the sparrow beastman who took the role of the officiant, the two in dresses made an eternal oath and threw bouquets toward the many audience members. After a somewhat violent scuffle to receive the bouquet, Shiromi Iori became the final victor. Although it was a wedding with heavy security, it was more open and lively than ever, and many Germans threatened terror but they couldn't even approach the cathedral before the wave of Kivotos-type audience members.\n\n\"It's truly a pleasant day, isn't it, Ako?\"\n\"It cannot be expressed by the simple word 'pleasant'.\"\n\nAko gave a faint smile."
 GEH.ako.story_event.9.a: "...It will remain as a day I can never forget in my life."

 GEH.ako.story_event.10.t: "After the Wedding"
 GEH.ako.story_event.10.desc: "There's a fact Ako came to know after living together with Hina. Hina wears pink pajamas at home, and unexpectedly enjoys entertainment devices like game consoles as a hobby, and finally... she still tries to bring documents home.\n\n\"Head Prefect... home should be a place for rest. Why do you bring documents even here.\"\n\"Ah, sorry. Ako. I'll go outside the bedroom to handle the approval documents.\"\n\"No! It's not that I'm telling you to go out, Head Prefect! I'm telling you to kick out these tiresome documents!\"\n\nAko grumbled and snatched the documents from Hina's hand. After the relationship between the two, Hina told her that she would not leave Ako's side no matter what happened. However... seeing Hina having the workaholic habit remain even after promising the work division, Ako couldn't stop the anxiety from creeping up.\n\nIs Sorasaki Hina really okay? Will she not collapse by being crushed by the work she brought upon herself? It was a thought she had set aside once, but Ako once again... thought that Hina should set down all the work and entrust the burden to Ako.\n\n\"Head Prefect. Well... can we have a consultation for a moment?\""
 GEH.ako.story_event.10.a: "...It's not about me, but about your future, Head Prefect."

 GEH.ako.story_event.11.t: "Ako's Pet"
 GEH.ako.story_event.11.desc: "Considering that Ako had lived with the ridicule of being 'Hina's pet' before the Transfer, it's quite an absurd thing, but recently the ridicule of 'Ako's pet' regarding Hina was openly circulating within the office. The reason was simple. She might collapse due to overwork. To protect Hina from that... please give up all power. Because Hina had accepted such a request from Ako.\n\nThe sound of the piano echoing softly. While Hina was engrossed in practicing on the piano prepared in one corner of the office, Ako was processing each of the official documents that Hina originally should have handled. On the documents that Hina would have looked into at least once in the past, even Hina's fingertips no longer touched them.\n\nHina tapped the black and white keys while focusing on the scratching sound of Ako's pen heard from behind. Setting down all the burdens had only been anxious in the past. There was a compulsion that 'Sorasaki Hina' must protect the order of Gehenna. Someday she might have broken down by being pressed by that compulsion. But not now.\n\n\"Being a puppet Head Prefect is, well. Not bad.\"\n\"Don't call yourself a puppet. Because you can handle the work instead whenever you want, Head Prefect.\"\n\nWhenever she wanted? Hina gave a faint smile. She didn't doubt Ako's intention. But now she didn't have... much of a desire to reclaim power. Entrusting all thoughts to Ako, just enjoying this moment became Hina's happiness."
 GEH.ako.story_event.11.a: "I truly like you, Ako."

 GEH.ako.story_event.12.t: "Are You Happy?"
 GEH.ako.story_event.12.desc: "\"...You've stopped all your official duties, that's what you mean. Head Prefect Hina, no. Should I call you Chairwoman Hina, your public rank?\"\n\nLooking at Haruna's faint smile, Hina took a sip of iced tea. Even seeing Haruna, who would have been a nuisance to solve in the past, she no longer has any thoughts. Hina's rank was still Head Prefect and Chairwoman, but. Because the 'real' Chairwoman was her beloved wife.\n\n\"Well, you can call me whatever you want. But... the fact that my life right now is happy is the truth. To those who value political power, I might appear as if I've failed. However...\"\n\nHina slightly lifted and shook the iced tea.\n\n\"I prioritize work-life balance more.\"\n\"Fufu. I heard your piano performance skills have improved a lot lately. Will I be able to hear a piano recital by Head Prefect Hina someday?\"\n\"Since time is what I have left. It might be possible.\"\n\nA piano recital. It's a future that could never have even been thought of in the past. But it was Ako who made that future a reality. For the happiness of being with such a woman, what would a grand power matter? Hina felt a true sense of liberation and laughed while facing Haruna."
 GEH.ako.story_event.12.a: "Happier than ever"

 GEH.ako.story_event.13.t: "To Cherish Dearly - 1"
 GEH.ako.story_event.13.desc: "Even before the Great Transfer, the relationship with Ako had been special. Yes. But that relationship... she never once imagined it would develop beyond simple 'specialness' into the stage of affection and love. Because she thought the emotion Ako held was merely respect toward the Head Prefect. No, maybe it really was just respect. A non-real situation like the Great Transfer and extreme reality might have changed the form of that emotion. You could call it a world-scale bridge effect.\n\nThe important thing is the fact that 'Sorasaki' Ako, not Amau Ako, is guarding her side right now. Hina, who was continuing the piano performance, suddenly looked back at Ako who was wiping the window of the house. This reality itself still feels like a dream, so sometimes she still can't believe that Ako is in her house together.\n\n\"Head Prefect?\"\n\nThat kind voice returned Hina to reality, but.\n\n\"'Head Prefect' again? Call me 'Hina', comfortably. What kind of wife in the world uses such a professional term.\"\n\"...Fufu. I told you 'Head Prefect' is the most comfortable expression for me.\"\n\"I'm telling you it's not comfortable for me... well, it must be your charm that you don't change.\"\n\nHina gave a faint smile and stood up from the piano."
 GEH.ako.story_event.13.a: "Shall we go for a walk for a bit? I think the cleaning is enough."

 GEH.ako.story_event.14.t: "To Cherish Dearly - 2"
 GEH.ako.story_event.14.desc: "Ako walked in the park while fondling the 'Hot Shot' attached to her holster. Even if she became Hina's wife, she was still the Senior Administrator and had the duty to exclude Hina from possible threats. In fact, she knew Hina was stronger than herself.\n\nWas her emotion before the Transfer also love? To the current Ako, it had become a memory so old she couldn't actually recall it. But what's important is the fact that Hina is by her side right now, and that she is kindly reaching out her hand toward Ako. Ako let go of the holster for a moment and took the hand Hina reached out. Just walking in the park while feeling that warmth made this time so happy.\n\n\"I hope this time continues forever.\"\n\"That cannot be. Because an end comes to every moment.\"\n\nHina gave a faint smile.\n\n\"But because of that, I want to make this happy moment... as valuable as possible.\"\n\"You mean because it's not eternal, each and every memory is precious? Fufut. Yes. ...I think so too.\"\n\nAko walked while giving strength to the hand held with Hina. Our time will also not be eternal. Someday the day to send one away will come. But until then. Until the time God permits them to be together."
 GEH.ako.story_event.14.a: "Let's cherish each and every one of these moments."

 GEH.ako.story_event.15.t: "To Cherish Dearly - 3"
 GEH.ako.story_event.15.desc: "I am Sorasaki 'Amau' Ako, the Senior Administrator of the Federal Republic of Gehenna.\n\nI have buried this letter in front of the Gehenna Council using a very special sealant so that the next generation a hundred years later can open it. Hello, people of the 21st century. I hope the nation called Gehenna still exists back then, and I earnestly hope that in that time too, this world is one where the people of Kivotos and the Germans live in peace together.\n\nThe possibility that I can pull out and read this letter 100 years later is not very high. Well, I don't know how much biotechnology will develop. Still, it will be possible to leave whatever I want to say to the next generation.\n\nAbout the reason for introducing the Federal Republic and managed democracy system, many historians will be leaving various speculations 100 years later. They'll probably all be wrong. It's not because of the Planning Bureau's seizure of politics, nor because of my lust for power, just... it was because of love. Head Prefect Hina was being crushed by her own duties, and I just wanted to lighten the burden on her shoulders.\n\nAll the things started for that one 'love' ended up creating this great republic. It would be good if the politicians of the next generation also go beyond simple money and power... and keep the heart that they rule Gehenna for the person they cherish most, for the person they love. Because more than any law, individual politicians loving the citizens will be the most fundamental way to prevent corruption.\n\nThat's all. When this letter is opened, probably me and Head Prefect Hina, who won't be in Gehenna, will bless your path. Be happy."
 GEH.ako.story_event.15.a: "From the study of the home of Sorasaki Ako and Sorasaki Hina."

 GEH.ako.story_event.16.t: "So the Friendship Continues - 1"
 GEH.ako.story_event.16.desc: "Since before the Great Transfer, the relationship with Ako had been special. That specialness was greatly shaken as Ako became aware of her feelings for Hina as love, but she was somehow able to accept the rejection from Hina. Clearly they can't return to a perfect relationship as before, but at least... Hina still thinks the two remain close colleagues and friends.\n\nHina looked up from the office desk and met eyes with Ako who was watering an orchid on the opposite side. She doesn't know what she's thinking right now. Does she still resent me? Toward me who rejected her love and decided to rule personally instead of the Planning Bureau Council... does she harbor dissatisfaction? Ako is expressive of emotions, but in that paranoia and loyalty toward Hina... she has a tendency to hide her true heart.\n\n\"Head Prefect? Is there something wrong?\"\n\"No. Just. ...I was wondering if you were giving too much water to the orchid.\"\n\"I'm sufficiently adjusting the amount of water, so you don't have to worry. Fufu.\"\n\nEven seeing her smile, Hina couldn't gain complete peace."
 GEH.ako.story_event.16.a: "It's like standing on a blade"

 GEH.ako.story_event.17.t: "So the Friendship Continues - 2"
 GEH.ako.story_event.17.desc: "A person cannot know the heart of another person. Because even if we can be physically connected with each other, we cannot be mentally connected. After finishing a meeting with Ako and drinking coffee together, Hina suddenly looked into Ako's eyes. As a long time passed after the Great Transfer, she gradually changed. But. Hina hoped that at least the... friendship Ako has toward her hasn't changed.\n\n\"Ako. Ako, my choice...\"\n\"Head Prefect?\"\n\"No. It's nothing.\"\n\nCoward. How pathetic. Her own heart poured out criticism. Yes. I'm a coward. But how... could she ask this kind Ako, 'I'm sorry I dumped you. Do you still think of me as a friend?' That's too cruel. Hina just turned her eyes out the window and quietly prayed.\n\n\"I wish the time we spend together continues just like this.\"\n\"There is nothing that continues forever. Everything in the world has... a beginning and an end.\"\n\nWhile saying so, Ako gave a faint smile."
 GEH.ako.story_event.17.a: "So just, I hope you feel only peace during the time you are with me."

 GEH.ako.story_event.18.t: "So the Friendship Continues - 3"
 GEH.ako.story_event.18.desc: "This is Sorasaki Hina. Probably no one will read this diary. After about a hundred years, historians might sneak a peek at it. At least not in the time I'm alive.\n\nI'm not sure if rejecting Ako was the right thing to do. I won't know for the rest of my life. Even when I'm with Ako, I feel loneliness, and though Ako is by my side, her heart seems to be elsewhere. Yes. Ako is trying to act out 'the usual Amau Ako' to me.\n\nAko's heart clearly changed after that rejection.\n\nI just didn't want to admit that 'changed heart', so I was just pretending not to know. Since there is no such thing as eternal friendship. However, I want to live while cherishing only the story Ako told in my heart. At least for this moment Ako is by my side. I'm anxious about when she will leave my side, but still... before everything in the world ends. Before the time with Ako runs out.\n\nI want to feel peace in each and every day I spend with Ako in this moment. To me, Amau Ako is the most precious friend, no matter what happens."
 GEH.ako.story_event.18.a: "Sorasaki Hina. In my study at home."

 GEH.hina.story_event.1.t: "The Continuing Dream"
 GEH.hina.story_event.1.desc: "I don't usually write a diary every day, but I started writing a diary out of a sense of duty that I might have to deliver this material to a doctor in the near future.\n\nLately, I have nightmares. They're nightmares I can't tell anyone. When I fall asleep, someone with my own appearance is sitting at the Head Prefect's office desk. I'm standing at the entrance of the office looking at that sight. Looking at another me like an observer.\n\nThat other me is not saying anything. For the past three days, I tried to talk to her (me?). I tried calling out to her, and I tried grabbing and taking away the documents she was reading. Once, I even tried hitting her head. But it was no use.\n\nMy words vanished without reaching her, and my violence seemed unable to inflict any harm on her. The moment I directly touched her body, my fingertips just passed through her body. What exactly is this creature's identity?\n\nOne thing is certain. My health is quite, no, very seriously breaking down."
 GEH.hina.story_event.1.a: "Sorasaki Hina."

 GEH.hina.story_event.2.t: "Baal"
 GEH.hina.story_event.2.desc: "Today's diary is a bit more special. 'She', who hadn't said a single word to me until now, spoke to me for the first time. It might mean I'm going crazier than before. But a hallucination that can talk might be better than facing a silent me and standing facing each other all night.\n\nShe, who has my face and my voice, calls herself 'Baal'. My split personality and another will born from my Mystery. Her way of speaking is quite pedantic (if I say she reminds me of Seia whom I met during the Eden Treaty negotiations, would it be an insult to her?), so I didn't really believe she was my other personality. Because I usually use much 'easier' sentences than her.\n\nHowever, for now, I'm going to try writing a diary on the premise that there's no lie in Baal's words. Baal thinks it's pathetic that I ended up wearing the dictator's crown due to the coercion of the fanatical members... and told me various stories.\n\nThe trashy German bastards, and the fanatical members who pretend to like me but just want to use me for maintaining power... to the point it's hard to believe they're words spoken by my other personality, Baal was full of hatred. To insult the locals I must protect, and the Prefect Team members who believe in and follow me... Naturally, I should have been angry and dashed out of her office.\n\nBut I couldn't.\n\nWhy? Was I unable to do anything until her words finished?\n\nI hope it's not because I think Baal's words are right."
 GEH.hina.story_event.2.a: "Sorasaki Hina."

 GEH.hina.story_event.3.t: "Is Hatred Necessarily Bad?"
 GEH.hina.story_event.3.desc: "\"Ah, Hina. We meet again today.\"\n\nIn the Gehenna Prefect Team office. Baal is sitting in my seat and spinning a pen.\n\nSeeing someone else with my face and my voice, I don't get used to it no matter how much it's repeated.\n\nEven if she's my split personality.\n\n\"Yeah. This damn dream doesn't stop. First, let me ask. Baal. Why did you appear? If you're me... why are you trying to make me hate Gehenna and Deutschland?\"\n\"It seems there's a slight misunderstanding. I'm not trying to make you hate the people of this land. You already hate all those things.\"\n\nBaal smiled meaningfully.\n\n\"I am you. That's why I didn't want to see you living as a slave to other beings. The fanaticism of the zealots and the Nazi trash's terror... You've handled, endured, and put up with all those things until now. But have those who received your reward ever expressed gratitude once? Have they acknowledged your pain and endurance by saying you did well? Yeah. Even the Prefect Team executives didn't do that.\"\n\"That's...\"\n\"Admit it. Hina. In this Prefect Team, in this Gehenna, you're the only sane one. Everything else is all wrong. ...It's time to set it right.\""
 GEH.hina.story_event.3.a: "I woke up from my sleep."

 GEH.hina.story_event.4.t: "Health Condition"
 GEH.hina.story_event.4.desc: "I know well that I'm not sane. Isn't a split personality itself a mental illness? However, I haven't thought of revealing this fact to other people yet. If I say it's because of the duty to continue governing Gehenna, it would be a lie.\n\nHonestly, I'm afraid of what will happen after I reveal the fact. I'm anxious that the gaze other people look at me will change. I'm not Takanashi Hoshino. Others think of me as a perfect superhuman, an absolute order but...\n\nI am weak.\n\nA weak person who is afraid, anxious, and cares about the gaze of others.\n\nEven if it's revealed that I'm such a person, will Ako, Chinatsu, Iori, and other people look at me with the same gaze as before? No, they won't. They'll despise me. That the absolute Gehenna premise and ruler Sorasaki Hina is a coward."
 GEH.hina.story_event.4.a: "I am sinking"

 GEH.hina.story_event.5.t: "The 3rd Prefect Team General Assembly Commemoration Party"
 GEH.hina.story_event.5.desc: "The unification of Gehenna and the victory of the Prefect Team is truly a joyful thing. Long live the glory of [ROOT.GetNameDef]. I drank the damn German white wine from Gehenna bureaucrats, and I lost consciousness at the 3rd General Assembly commemoration party.\n\nBaal was there.\n\nWhile I lost consciousness after getting drunk on that son of a bitch's wine, Baal took over my body. I continued very inappropriate remarks about the Germans at the party. Ako and I had an argument, and I committed a bizarre act of throwing a wine bottle on the floor and breaking it with my fist.\n\nHow do you think it feels to hear those facts from a third party after everything situation finished? It's miserable. This is not just a drunken habit. There's someone else inside me. And she is telling me to spread hatred. Yeah. Clearly, I'm in an insane state."
 GEH.hina.story_event.5.a: "I'm not exactly an exemplary leader"

 GEH.hina.story_event.6.t: "Medical Consultation"
 GEH.hina.story_event.6.desc: "\"...I'll say it once more, I don't usually drink alcohol at all. I'm not an alcoholic or anything like that.\"\n\nAt the 3rd Prefect Team General Assembly commemoration party, I threw a wine bottle and had a fight with Ako in front of numerous executives. After that, I bowed my waist dozens of times and conveyed a sincere apology to Ako... but separately from that, the Medical Department was suspecting whether I have delirium symptoms due to alcoholism.\n\nChinatsu let out a sigh while looking here and there at the blood test result sheet. Still, she seemed to understand that I don't live soaked in alcohol. Though she seemed to have found out another secret.\n\n\"I heard you work late often... but even so, you shouldn't touch strange stimulants.\"\n\"...A dictator has a large amount of work. Even if I try to divide that burden, even the people who should receive my authority don't want to receive the power separation.\"\n\"...That... *Sigh.* I do know that. Yes. But, even so, if you don't improve your physical condition right now, it will definitely get worse.\""
 GEH.hina.story_event.6.a: "Chinatsu delivered a long prescription."

 GEH.hina.story_event.7.t: "Changed Atmosphere"
 GEH.hina.story_event.7.desc: "Gehenna Prefect Team member Haruno felt that the atmosphere of the Gehenna Prefect Team began to gradually change after the last general assembly. The voices of the fanatical members who claimed that Gehenna should be controlled by the 'great leader' Hina were growing louder and louder. Immediately after the Transfer, they were just a small number of loyalists, but after the 1st General Assembly, they turned into a huge faction, and after the 2nd General Assembly, they were even walking around Munich wearing custom unofficial armbands.\n\n\"I don't know why the Head Prefect doesn't touch those guys and just leaves them alone.\"\n\nHaruno let out a sigh, and today too, she looked at the march of the idiots with armbands seen through the window of the Prefect Team building. Haruno hoped that this march would gradually die down and vanish, but for some reason, she felt an anxious feeling that such a thing would not happen. Will Gehenna be seized by those fanatics?"
 GEH.hina.story_event.7.a: "I hope not."

 GEH.hina.story_event.8.t: "Sorasaki Hina Analects Budget"
 GEH.hina.story_event.8.desc: "Ako likes Hina. She loved every single action of Hina, and cherished every single word of her. The sight of her talking gibberish because she was tired from overnight work was welcome, and she never felt humiliated when Hina bluntly scolded her. But. Although she was such an Ako who liked Hina so much...\n\n\"Sorasaki Hina Analects Compilation Budget... They've truly lost their minds.\"\n\nThe demand of the zealots to record every single word of Hina almost to the point of paranoia and release a plausible 'Analects' book was absurd. Do these people really respect Hina? Or do they just want to use Hina's words as a weapon?\n\nAko, who had excellent insight (and severe paranoia), analyzed the hidden intention behind the publication of this 'Analects' book. To impose regulations that do not exist in Gehenna law, they create an ambiguous 'Hina's Analects' book that can be interpreted in various ways. And according to those analects, the zealots arbitrarily define 'illegal' and 'order-breaking' actions, and suppress the opposition who perform such actions.\n\nLet's take an example. Ako recalled Hina's words 'I hate bothersome things'. What exactly is that bothersome thing specifically? It was impossible to know that 'bothersomeness' from this one sentence with the front and back context cut off. But the zealots could arbitrarily interpret this and create customary law above the norms. 'Such an action is a sin of bothering Head Prefect Hina.'\n\n\"*Sigh.* To think I have to send up this crazy document.\"\n\nAko naturally wanted to tear up the budget document, but the final decision-maker was Hina. And... Ako knew that Hina would not reject this budget.\n\nLately, Hina was being mentally cornered. The fanatical support of the countless zealots. She was being crushed by the compulsion that she must be a great leader 'who meets' that support. For such a person to ignore the zeal of the zealots? It would be impossible. Ako felt that this was a wrong path... but didn't find the way for what she should do."
 GEH.hina.story_event.8.a: "At the time of the general assembly, I never imagined such a conclusion would come..."

 GEH.hina.story_event.9.t: "Pressure from the Zealots"
 GEH.hina.story_event.9.desc: "There are several formal departments within [GEH.GetNameDef]. Four: the Planning Bureau for clerical work, the Enforcement Department for field work, the Medical Department for medical duties, and the Intelligence Department for information gathering. The self-proclaimed zealots exist scattered in each of these four departments. Because the zealots exist in the form of a faction claiming that 'other executives are incomplete compared to the great leader, so power must be concentrated in [ROOT.GetLeader]', not as an independent department called the Zealots.\n\nAnd the fact that these zealots formed a faction internally meant that members not belonging to the faction began to receive practical discrimination. The zealots were gradually expanding their faction by 'pushing and pulling' each other.\n\nAnd this 'expansion' was an unpleasant thing for Iori, who didn't like headache-inducing problems like factions.\n\n\"Factions my foot. Isn't the Gehenna Prefect Team about going up through skill and fair competition?\"\n\nA middle manager of the Enforcement Department bowed his head before Iori.\n\n\"That's right. It is right, but they say it's hard to go up without something like pushing and pulling after all.\"\n\"*Sigh.* If this was an organization that can be seen, I'd smash it all. Since a faction doesn't have something like a list, well, there's no way.\"\n\"Then do you plan to leave it alone?\"\n\"I don't want to leave it alone! ...If I get a chance, I'll sweep them all away someday. If I grab the chance...\""
 GEH.hina.story_event.9.a: "When will that chance come?"

 GEH.hina.story_event.10.t: "Unite, Citizens of Gehenna"
 GEH.hina.story_event.10.desc: "Chisato, a Prefect Team zealot and an executive of the civic group Free Gehenna Union, stood on the prepared podium and confidently looked back at the citizens of Gehenna. Many patriots waving the flag of Gehenna were looking up at Chisato on the podium. Since there are so many patriots, the future of Gehenna will surely be brighter than ever.\n\nChisato grabbed the microphone.\n\n\"Citizens of Gehenna. Now is a period where we must unite more than ever. Treacherous non-citizens are still trying to sell Gehenna to enemy nations, and the threat of the Pandemonium Society still remains. So that the fatherland can infinitely prosper under the leadership of [ROOT.GetLeader], we must gather all our strength for the suppression of anti-state forces.\"\n\nContinuing a long speech, Chisato looked up. Thousands of citizens waving the Gehenna flag were filling the entire street. To think there are so many patriots. The future of Gehenna will surely be bright. And the finances of the Gehenna patriotic civic groups popping up recently will also be filled by them.\n\n\"...For the success of our Free Gehenna Union and the punishment of Nazi fascists and communists, many activity funds are needed. Our operating expenses can be donated through bank transfers and mobile phone banking...\""
 GEH.hina.story_event.10.a: "Patriots gather"

 GEH.hina.story_event.11.t: "War God Hina"
 GEH.hina.story_event.11.desc: "Chinatsu respects and also esteems Sorasaki Hina. A thing like coming to dislike Hina will not happen. However, she didn't really like the people who follow Hina.\n\n\"A hospital must be the most peaceful and stable place. It's also important for patients to take rest in a calm environment. But... is there a reason to specifically paste such a poster in the hospital rooms?\"\n\nChinatsu stood facing a zealot executive in the Medical Department and waved the poster she was holding. A poster reading 'War God Sorasaki Hina'. The appearance of Hina spreading black wings and flying toward the sky while burning the ground is drawn in quite an exaggerated manner. The message of the advertisement was simple. To announce Hina's greatness and to encourage enlistment in the military that follows the teachings of such a great leader. It's propaganda.\n\nEnlistment propaganda itself can happen. But must they specifically paste it even in hospitals? However, the Medical Department zealot just says it's no big deal.\n\n\"Patients are lying in bed and can't go anywhere, can they. So if we paste posters in the hospital rooms, people can see our posters for a longer time. It's scientific placement.\"\n\"But medically it doesn't seem like it will be helpful for the stability of the patients.\"\n\"Isn't it natural that loyalty to the fatherland and zeal for Hina-sama stand above medicine?\"\n\nChinatsu, dumbfounded, felt an urge to throw the poster at her face. Even her, who was on the calm side, could find her emotions... getting heated whenever she talked with zealots recently. But there was no choice. Already the important figures of the Medical Department have all become zealots. Even Chinatsu, who oversees the Medical Department, couldn't ignore the opinion of the majority.\n\nChinatsu let out a sigh and returned the poster."
 GEH.hina.story_event.11.a: "\"At least distribute them only to light-case patient rooms.\""

 GEH.hina.story_event.12.t: "A Nation for One Person"
 GEH.hina.story_event.12.desc: "Sorasaki Hina didn't want to become a dictator. She had no lust for power, and rather had the mind to set down her power and resign starting from the 'Eden Treaty'. However, the Great Transfer paralyzed all alternatives that could protect the order of Gehenna instead, including the GSC, and the zealots believed that Sorasaki Hina would suppress all chaos after the Transfer and were idolizing her.\n\nHina felt power concentrating around her by force even though she had no lust for power at all. she wanted to push away the zeal of the zealots. However, the feeling that she didn't want to betray the support and enthusiasm of other people, and the reality that she had to solve the problem of confrontation with Trinity and the Pandemonium Society as all 'alternatives' including the GSC collapsed, were choking her.\n\nUltimately, Hina had no choice but to accept the crown of power. Because that was the choice of the public and the support of the zealots. She was being forced into iron-willed kingship even though she couldn't become an iron-willed person. In the office where no one remains, amidst the cheers of the madmen through the window, Hina stood alone."
 GEH.hina.story_event.12.a: "Among more supporters than anyone, most lonely."

 GEH.hina.story_event.13.t: "Cheer for the Support of the People"
 GEH.hina.story_event.13.desc: "Hina was getting tired of the 1-person dictatorship system, and she was also feeling disillusioned by the continuous demands of the zealots. Don't they just support a virtual iron-willed king that the existence called Hina symbolizes, not really liking Sorasaki Hina herself? Then she will do as they want. If they want a virtual iron-willed king.\n\nHina began to mechanically stamp every document the zealots sent up. She didn't even read the documents. She's doing all the things they 'want'. By that, Hina could implement policies the people wanted, and the zealots would be thankful for being recognized by Hina.\n\nOf course it's bullshit. She knows it's bullshit. Hina knew this was a crazy thing. But... Sorasaki Hina could neither cut off those fanatics nor could she fall into that fanaticism herself. Just, maintaining the support of the people in this wave of madness was her limit."
 GEH.hina.story_event.13.a: "Disgusting."

 GEH.hina.story_event.14.t: "Victory of the Great Public"
 GEH.hina.story_event.14.desc: "The reunification of Gehenna was achieved, and it was also an event symbolizing the success of the populist ideology of the zealots who follow [ROOT.GetLeader]. [ROOT.GetLeader] led the will of the people and made Gehenna a great nation once again. Cheers erupted in the streets and numerous patriotic slogans and commemorative events came to be held during the 3rd General Assembly. However, not all these changes were receiving support from the Gehenna-ites.\n\nThe biggest problem was that the German locals came to believe that the new regime was gradually becoming a fascist state similar to the 1933 Nazi regime. The local parties Social Democratic Party and Bavarian People's Party were forcibly disbanded while trying to hold street protests to claim that 'the state is becoming fascist' to hinder the 3rd General Assembly. Communists dreamed of the collapse of the [ROOT.GetLeader] regime and carried out more intense bomb terror. During the 3rd General Assembly period, the resistance of the locals burned loudly like the last flame.\n\nOf course the huge flame was too small to burn Gehenna, and the new Gehenna regime came to have a too solid power. The protests of the social democrats and conservatives were not able to be held again after being suppressed. Communists were arrested. Normal daily life came to Gehenna. Even if that 'daily life' of [ROOT.GetName] is being colored in a dark, gloomy gray."
 GEH.hina.story_event.14.a: "The Republic will endure."

 GEH.hina.story_event.15.t: "Zealots Victory Broadcast"
 GEH.hina.story_event.15.desc: "The reunification of Gehenna and the collapse of Trinity have become a symbolic event that widely announces the greatness of [ROOT.GetLeader] to all of Kivotos. We were able to advance this far because there was the leadership of the great leader, and our Republic will never have to fear before an external enemy again. Long live [ROOT.GetLeader], who has become the new Chairwoman of the Gehenna Pandemonium Society and the eternal leader of the Republic! Our victory will be remembered forever!\n\nTo commemorate our great victory, the birthday of Chairwoman Sorasaki Hina will be designated as a national holiday, and the birthplace, and the elementary, middle, and high school classrooms she attended during her growing period will also be permanently preserved as cultural heritages. Under the teachings of the great Chairwoman, Gehenna will continue to prosper."
 GEH.hina.story_event.15.a: "Hina turned off the radio."

 GEH.hina.story_event.16.t: "Economic Reform"
 GEH.hina.story_event.16.desc: "The new economic reform plan of Gehenna was organized into documents. Hina wrote an agreement signature once again without even looking into the documents. Already for Hina, the economy, politics, society of Gehenna, all those things became something that doesn't matter. She was just the 'will of the people'. What the public wanted was what Hina wanted. There was no place for Hina's thoughts or judgment to intervene there. Passing through the 4th General Assembly where she had to just clap incessantly without even a single opportunity to speak, Hina realized that the zealots were not serving her, but... she came to serve the zealots."
 GEH.hina.story_event.16.a: "Gehenna should have perished."

 GEH.hina.story_event.17.t: "Constitution of the Great Gehenna State"
 GEH.hina.story_event.17.desc: "Sorasaki Hina hates Gehenna. It wasn't just a joke or a self-deprecating expression. She knew she had been helplessly swept away by the madness of the zealots, and she knew she had fallen into a walking propaganda symbolizing 'the will of the people', a puppet of the zealots, after setting down her power in the madness of the zealots. Hina entered the Pandemonium Society parliament wearing her uniform. However her heart was elsewhere. The street of the ordinary Gehenna district before the Transfer. There was no such madness, no such madmen called the zealots of Sorasaki Hina, and no herself who became the symbol of fascists.\n\n\"Chairwoman Hina.\"\n\"Don't call me Chairwoman. It makes me nauseous.\"\n\nBefore ascending the podium, Hina bluntly said so toward Ako without thinking... and then shook her head bitterly.\n\n\"No. Sorry. ...It's not your fault.\"\n\"No. It's the fault of me... who didn't properly assist the Head Prefect and let this madness reach this far.\"\n\nHina looked at Ako. The fault lies entirely with herself. She was afraid to confront the madness of the public head-on. So she just remained as a puppet of the zealots, a symbol expressing the mere will of the public. Instead of rebuking her as a coward, Ako turned the sin to herself. No. Ako did nothing wrong.\n\nHina hugged Ako tightly and said quietly. No. You did nothing wrong. This is all my sin. The sin I must bear. Hina slowly pulled away from Ako and ascended the podium. Promulgation of a new constitution declaring herself an eternal leader and an absolute dictator. Hina spoke with a sunken voice, feeling like she was putting a rope around her own neck."
 GEH.hina.story_event.17.a: "I promulgate this constitution."

 GEH.hina.story_event.18.t: "Young Gehenna Party"
 GEH.hina.story_event.18.desc: "\"Young Gehenna Party?\"\n\nIori said as if it was bothersome while flipping through the newspaper.\n\n\"What. Did Ako-chan make it?\"\n\"...Of course not. Those zealots made it as they pleased. Now that Gehenna has become a proper nation, they want to rule Gehenna in the form of an organized party, not in the form of a faction...\"\n\"Bothersome. I don't know much about headache-inducing things. Anyway, should I just understand it as a trash can for gathering zealots?\"\n\"Yes. Well... it's a trash can.\"\n\nAko thought the word trash can suited them best. After the 4th General Assembly, the Gehenna zealots who were fragmented in various departments began to create their organization under the name 'Young Gehenna Party'. There were several advantages to organizing themselves into a party. First, they became able to draw general businessmen outside of the Prefect Team into the party to expand the faction even larger. And an organized party gives them a greater sense of belonging than an intangible faction, and helps to establish a hierarchy within the faction.\n\nThe populist party Young Gehenna Party was already creating regional parties in various parts of Gehenna and expanding influence among the public even right now after its founding. The Young Gehenna Party, which claims to follow the 'Sorasaki Hina Spirit' without a special ideology, was expected to implement various populist policies in Gehenna from now on. Of course Hina's will was not there. Ako recalled that Hina did not belong to that party. To the Young Gehenna Party, Hina was a symbol after all.\n\nThose who claim to follow Hina enthusiastically, while ignoring Hina the most. Ako felt a light nausea."
 GEH.hina.story_event.18.a: "But there is nothing Ako can do."

 GEH.hina.story_event.19.t: "Smile! - 1"
 GEH.hina.story_event.19.desc: "\"It will be a photo that remains in the history of the great fatherland. Chairwoman Hina. Look at the camera and smile.\"\n\nListening to the disgusting voice of the zealot, Hina stood before the camera. She felt an urge welling up to immediately hold 'End of the World' in both hands and fire at the face of that woman who was smiling. But she endured. Hina was getting quite used to the life as a puppet. *Flash!* A new 'dignified' Hina photo to be hung in the Gehenna parliament building was taken.\n\nAfter the photo shoot, Hina vomited several times in the parliament restroom. Tears came out and her eyes stung from the feeling of her stomach being overturned. Gehenna was already no longer the nation she wanted to protect. Hina was a puppet of the zealots, and Hina was being called to various events and had to act as the 'great leader of Gehenna' with a smiling face. What exactly is she leading? Anyway it's just that disgusting 'Young Gehenna Party' that brings the documents she will sign.\n\nWhile rinsing her mouth, Hina felt a light dizziness. She should have just seized the power given to her herself. She doesn't want to be a dictator. She shouldn't have made the choice to become the face of the zealots for such a soft reason. If she had taken the path of becoming the 'Thunder Emperor', she could have torn all those zealots to death. No. Hina hated herself for having such thoughts.\n\nA dictator drunk on power. How is that different from Hanuma Makoto? Being a puppet is better.\nNo. Is your current appearance better than 'Hanuma Makoto'? That's just self-satisfaction."
 GEH.hina.story_event.19.a: "Two thoughts troubled Hina simultaneously."

 GEH.hina.story_event.20.t: "Smile! - 2"
 GEH.hina.story_event.20.desc: "\"Great fatherland, great Gehenna, not-so-great Sorasaki Hina.\"\n\nHina thought about her Mystery, Isbosheth. The word Isbosheth also exists on Earth. They say the name was changed to Isbosheth (Ishbosheth - shameful man) to disparage the name Eshbaal (Eshbaal - man of God). Shameful. That word suited her perfectly. Hina was ashamed of herself. Now that she became the most powerful dictator in Kivotos. And that huge power is in the Young Gehenna Party.\n\nHina turned her head and saw Amau Ako commanding police forces outside the parliament. Ako was getting very tired lately. Having all substantial power taken away by the Young Gehenna Party, even Ako, the friend Hina cherishes most, became a simple middle-level bureaucrat. Ako was still going out to various diplomatic events as a face, but she no longer had practical decision-making power.\n\nIs the Enforcement Department different? She doesn't remember when the last time she met Iori was. Under the 'civilian control' policy of the great Young Gehenna Party, the military continued to weaken and was quietly dying under the surveillance of the party. Medical Department? No need to mention it. It was a department with the least power from the start.\n\nShe just wanted to protect the order of Gehenna. She also thought at first that the zeal of the zealots was necessary to protect the order of Gehenna. But she was wrong. Hina failed. Gehenna might be eternal from now on. However, look at those who are being suppressed under this dictatorship regime by fanatics. Is this the beautiful 'order' that Sorasaki Hina had hoped for?"
 GEH.hina.story_event.20.a: "Hina saw a hungry local protest being suppressed with force through the parliament window."

 GEH.hina.story_event.21.t: "Smile! - 3"
 GEH.hina.story_event.21.desc: "\"Ako. What if I just throw a resignation letter and go missing?\"\n\"...Don't say such things, Head Prefect Hina. If you vanish, what should I do.\"\n\"...I know. Where would I go while leaving you alone?\"\n\nHina took out a dart and threw it toward the Gehenna flag in the office as if sneering. The dart stopped while accurately piercing the flag. One, two, three. Several times Hina's darts began to tear the Gehenna flag. It would have been more beautiful if this tearing flag were real.\n\n\"But, a day will come when I reach my limit.\"\n\"...I know.\"\n\"Now I think the zealots will find me wherever I run away. Because CCTVs are spread all over around the office and my home. Even if I fly in the sky, I'll be caught by one camera.\"\n\"...Yes. Probably.\"\n\"So Ako. There is probably only one direction I can run away from this prison called Gehenna. Down. To that hell.\"\n\"Head Prefect. ...Those words...\"\n\nHina picked up the last dart that fell on the floor and looked down at it bitterly.\n\n\"Ako. If a day comes when I decide to take my own life, then... can you be by my side? With me...\"\n\"Head Prefect.\"\n\nAko cut Hina's words. Her lips flickered as if to say something, but ultimately Ako nodded.\n\n\"Where would I go while abandoning the Head Prefect?\"\n\nSomeday, that time will come. Not today, though. And if that day comes. I will be able to become free."
 GEH.hina.story_event.21.a: "I hate you all."

 GEH.hina.story_event.22.t: "Panopticon System"
 GEH.hina.story_event.22.desc: "Hans moved his steps under the systematically organized factory surveillance facility of Gehenna. Every time he took a step, a searchlight emitting white light showed him the path he should go. What Hans could see was only the path to the conveyor belt assigned to him. To the Gehenna government, all Germans were potential criminals. And they tried not to reveal much information to the potential criminals.\n\n\"You are hated beings. You must strive to wash away your sins here and be reborn.\"\n\nThe Panopticon's radio broadcast started a pre-recorded broadcast. The factory was made into a almost perfect circle. Gehenna's watcher was in a relay mechanism at the center of the circular factory, able to look down at every place. The place where the watcher was shining with bright light, so Hans felt a pain of his eyes being burned whenever he accidentally looked at that place. We don't know where the watcher is looking at, but the watcher knew everything we were doing where.\n\n\"Hans Meyer. Move your hands faster. Fulfill today's quota.\"\n\nWhile assembling radio parts with hands, a loud voice echoed over Hans's head. It seemed he was the one being watched right now. No. Such words wouldn't be right. Because there would be no one not being watched here. Hans strove to kill his emotions and moved his hands."
 GEH.hina.story_event.22.a: "We are sinners"

 GEH.hina.story_event.23.t: "You Do Not Exist"
 GEH.hina.story_event.23.desc: "To Mikhail, high school was a contradictory place. When Mikhail enters the 21st District Public High School, he must step on the black-red-gold floor mat from the shoe rack and go up into the school. How could Mikhail not know that it is for insulting Deutschland? However, the moment he enters the classroom, the Gehenna people change the strategy. Deutschland is not an object of insult. It is a concept that has never even existed before.\n\nThe automaton robot teacher, who seems to have no emotion, says every day toward the German students stored like prisoners in the classroom: You do not exist. Deutschland *did not* even exist before. You will grow up as furniture that serves for the great God-fatherland.\n\nIf Deutschland doesn't exist, why do they make Mikhail repeat the 'ritual' of stepping on and going up the flag of Deutschland? Is it possible to step on something that doesn't exist? Then what is that thing Mikhail just stepped on and came in?"
 GEH.hina.story_event.23.a: "To deny the existence?"

 GEH.hina.story_event.24.t: "Truth Above Reason"
 GEH.hina.story_event.24.desc: "\"If God doesn't exist, create one, there were words Voltaire said. You are certainly following Voltaire's teaching well.\"\n\nCarl Jung spoke cynically and glared at the interrogator across the interrogation room. The interrogator, who was wearing sunglasses even indoors, was just looking at Jung with an expression that couldn't read emotions. As if intending to just watch how much Jung would talk alone.\n\nIf he has no intention to move, Jung intends to talk more as he pleases. Jung leaned his body forward a bit toward the interrogator.\n\n\"Yeah. I'm a thought criminal you spoke of. But isn't it you who did wrong first, making everyone insert 'according to the teachings of the revered leader' in every thesis research method? Does your great leader Hina-san want to be supported by scholars that much? If Mr. Freud were alive, he would have said this. 'She is staying in the same infantile stage as a five-year-old child wanting praise from parents.'\"\n\"Last chance. Write a conversion statement, or say more insulting remarks.\"\n\"I'm very thankful that you give one more chance.\"\n\nJung tore up the conversion statement with his hands before the interrogator.\n\n\"This is my answer. Fuck off.\""
 GEH.hina.story_event.24.a: "As the interrogator signaled, torture experts dragged Jung out."

 GEH.hina.story_event.25.t: "Seized Future"
 GEH.hina.story_event.25.desc: "Heinrich Kafka was spending anxious days after all four of his children were 'seized' by the Gehenna authorities. According to the new law of Gehenna, all German children had to be separated from their German parents and receive collective childcare in new communal facilities from age 3 to 18.\n\nHeinrich sat before Ulrich, a bar bartender, and ordered a beer with a weak voice. Ulrich said with a voice mixed with contempt and pain while pouring draft beer into a glass.\n\n\"Now in Munich, Berlin, Frankfurt... you can no longer hear the voice of a young child. Because the authorities are accommodating all children in orphanages.\"\n\"Those children are our children. With what right do they snatch away children from their father?\"\n\nUlrich agreed with Heinrich's words but spoke with a weak voice.\n\n\"It's the right of the victor. They are trying to make our children never have an identity as a German again. At this rate, before even a generation passes...\"\n\"Our nation will vanish.\"\n\nHeinrich took the beer and let out a sigh.\n\n\"No. The nation is not important. I'm just afraid that when my children meet me again, they won't even be able to recognize who I am.\"\n\"Me too.\""
 GEH.hina.story_event.25.a: "The two cried until late that day"

 GEH.hina.story_event.26.t: "For the Sake of One"
 GEH.hina.story_event.26.desc: "Under the great flag of Gehenna,\n\nI swear to serve for the fatherland and the great leader\nwith all my body and soul.\n\nBy overcoming the decadent concept of an individual\nI swear to happily fulfill loyalty\nas one of the many parts constituting the fatherland."
 GEH.hina.story_event.26.a: "Citizenship oath complete."

 GEH.hina.story_event.27.t: "Must Resist"
 GEH.hina.story_event.27.desc: "\"Haah, haah.\"\n\nAs Hina woke up from sleep, she felt an unpleasant sensation of her back being completely wet with sweat. Lately, Baal's whispering, the split personality symptoms were gradually 'easing'. Because the symptoms of Baal talking to her beside Hina were gradually decreasing. However, Hina was feeling a strange sensation of her own consciousness also 'blurring'.\n\nBaal and her own consciousness, the two were being integrated into one. She didn't know if a split personality is cured in this way. And despite the fact that the terrible Baal's will is gradually vanishing, Hina was not very happy. If the two personalities really merge into one...\n\nIs the personality that takes the initiative there the personality of Sorasaki Hina? Or is it the personality of that 'Baal'?"
 GEH.hina.story_event.27.a: "\"I should... drink some water.\""

 GEH.hina.story_event.28.t: "What Do You Resist?"
 GEH.hina.story_event.28.desc: "At dawn, Ako approached Hina who was dozing in the office. She stopped by the office where the lights were on during her overnight work, and as expected, she's nodding her head in a half-asleep state.\n\n'Head Prefect, it shouldn't be like this...'\n\nAs the workload increased, Hina's burden had increased significantly. And lately Hina wasn't able to sleep properly even at home. Ako looked worriedly at Hina who was breaking into a cold sweat on her forehead, as if having a nightmare.\n\n\"...Is it morning?\"\n\nHina's eyes suddenly opened. But Hina's appearance, as if looking into thin air not at herself... Ako felt somewhat anxious for some reason. The feeling that the Sorasaki Hina before her eyes had become a different person overnight. Although she knew it couldn't be, Ako felt her palms getting wet with sweat. No. Hina was always her Hina. What do you mean by becoming a different person.\n\n\"No. It's still dawn.\"\n\"...Right, dawn. But to me it feels like a new morning.\"\n\nHina slightly laughed and stood up from her seat.\n\n\"The weak side of Sorasaki Hina just died.\"\n\"...Yes?\"\n\"It's nothing. Just a story only I know.\""
 GEH.hina.story_event.28.a: "Hina smiled meaningfully."

 GEH.hina.story_event.29.t: "Eeriness"
 GEH.hina.story_event.29.desc: "Since the conversation last dawn, the Hina of lately seems to have become healthy. Chronic fatigue vanished, and she came to treat other Prefect Team members much more amiably. However, Ako felt an anxiety that Hina was not in a *normal* state.\n\nShe, who least suits luxury of all, began to buy jewelry and expensive clothes. Increasingly expensive wines began to appear on her table. And decisively, the way she calls the locals changed. From 'person' to 'creature'.\n\nIn a restaurant in the Central District of Gehenna. While cutting a rare steak, Hina faced Ako.\n\n\"Is there a problem, Ako?\"\n\"No. Just... I never imagined Head Prefect Hina would call me to such a restaurant first...\"\n\"Just think of it as a date. Such an opportunity doesn't come easily, does it?\"\n\"D-Date...!\"\n\nSeeing the flustered appearance of Ako, Hina laughed small.\n\n\"Besides, lately I'm in a good mood. I'm devising a... clean solution that could eliminate several thousands, several ten thousands of... Gehenna's impurities... that the previous me wouldn't have agreed to.\"\n\nThe date with the beloved Hina. The emotion of Ako, which was thumping at that thought, cooled down in an instant at Hina's word.\n\n\"Clean... yes?\"\n\"I intend to intentionally induce the revolt of the impurities. The moment those opposing Gehenna crawl out, we slaughter them all. If everyone dies, who can resist our rule?\""
 GEH.hina.story_event.29.a: "Head Prefect, but... how do you 'slaughter' people?"

 GEH.hina.story_event.30.t: "Communist Party-Nazi Party Alliance"
 GEH.hina.story_event.30.desc: "When Eva Braun, who was the lover of Adolf Hitler, entered the Communist Party underground meeting place, the communists shouted cheers instead of boos. Braun saw the appearance of the tired and injured communists while ascending the dusty and musty underground podium. They were Hitler's enemies, but Braun felt camaraderie rather than hostility toward the communists. Because in this bottom of Gehenna, they were all just beasts waiting for slaughter.\n\n\"Honorable fellow citizens. I am not a politician. I don't know about politics, and I don't know the difference between national socialism and socialism in one country. But what's important is... we are becoming slaves under the oppression of Gehenna.\"\n\nEven though Eva hadn't prepared a speech in advance, she continued a passionate speech before the NSDAP survivors including Albert Speer and members of the Communist Party of Germany.\n\n\"After driving out Gehenna, you and the National Socialist German Workers' Party will become enemies again. But... we will at least fight as human to human. However Gehenna doesn't even see us as the same humans. They snatched away our children. Our workers are working in environments like concentration camps.\"\n\nPanopticon, new 'Gehenna extermination' education... The communists clenched their fists strongly at Eva's words. Anger. Brotherhood. Such emotions echoed as if resonating between the communists and the fascists. As if to burst that emotion, Braun said."
 GEH.hina.story_event.30.a: "\"We will not be slaves. We will struggle together... and reclaim our freedom!\""

 GEH.hina.story_event.31.t: "Fighters for Freedom"
 GEH.hina.story_event.31.desc: "Albert Speer didn't think of himself as a liberal or a revolutionary. To him, Speer's ideology was something that transcended both of those. Friendship with his old friend Adolf Hitler.\n\n\"Gehenna must collapse. So that this land of Deutschland can be ruled by the German people.\"\n\nSpeer personally lit a cigarette for the Communist Party leader Ernst Thälmann. Thälmann took a puff of the cigarette from which smoke was rising. The two were not on good terms, but at least today they were friends.\n\n\"I didn't know a day would come when you shout for national self-determination for a colony.\"\n\"Isn't the situation like this? If Deutschland were not a colony, it would be different. A colonial slave cannot shout for the law of the jungle to the master.\"\n\"Haha! True, policy is something that changes according to the situation.\"\n\nAfter inhaling and exhaling deeply once again, Thälmann faced Speer.\n\n\"For the freedom of Deutschland, we intend to mobilize all the personnel we can use. How many personnel can you provide?\"\n\"As many as possible. ...We cannot face them head-on, but if we occupy cities, liberate workers, and rapidly seize the capital together with them, the Germans across the country will rise up.\""
 GEH.hina.story_event.31.a: "\"For victory.\""

 GEH.hina.story_event.32.t: "The Hunt"
 GEH.hina.story_event.32.desc: "Amau Ako felt a desire to put the trash called Head Prefect Hina's 'bundle of documents' into a shredder. This was the first time Ako felt such nausea at an official document Hina sent down. Hina was intentionally trying to induce the uprising of communists and fascists. She selects regions where protests and revolts will occur by concentrating violent protest suppression and property seizure against locals in specific regions. And she makes it look like the revolt is successful at first by reducing the public order maintenance forces in that region.\n\nAfter that, after the rebel forces and the personnel not joining the revolt are distinguished, she starts a large-scale extermination operation against the rebels. How many people will die in the process of the city being destroyed was beyond imagination. The so-called Gehenna zealots believed that the rebels of Deutschland would be weakened by this amazing operation to the point they could never commit an organized revolt again.\n\nActually it would be so. Because too many people will die. But is this the way of Sorasaki Hina? No. Since after the Transfer, isn't it Hina who wanted to minimize the death of innocent people, no, to exclude it completely? Will this plan really only result in the death of the rebels? Isn't it assuming that several cities will be scorched?"
 GEH.hina.story_event.32.a: "Tragedy awaits"

 GEH.hina.story_event.33.t: "Gehenna of Today"
 GEH.hina.story_event.33.desc: "Today's Gehenna is clearer and more pleasant than usual. Air force planes fly up, and news is heard that a large-scale bombing is being carried out on cities, but it's just damn peaceful. It's a happy day where no news is heard on the internet, television, radio, or in newspapers.\n\n\"... I. Why... without being able to do anything...\"\n\nAko slammed her head against the wall and squeezed her eyes shut. The operation has started. Revolts are occurring in various parts of Gehenna. And the military that was waiting in advance moved. While all of Gehenna was being colored with blood, this place was terribly peaceful. No, can this be called peace?"
 GEH.hina.story_event.33.a: "Ako jumped from her seat"

 GEH.hina.story_event.34.t: "Revolt Suppression"
 GEH.hina.story_event.34.desc: "Hina peacefully closed her eyes while listening to the news heard from various parts of Gehenna. No, should she call herself 'Baal'. It was a name she didn't call herself since the weak side of her died. Baal found the reason for her personality's birth in Hina's weakness. From a long time ago, Sorasaki Hina wanted to process all problems *in this way*. Cleanly organizing everything that breaks the order of Gehenna by killing them.\n\nHowever, because she didn't have the courage to put it into practice, she hesitated endlessly and was just suffering continuously. So a true leader, myself, was born inside Hina. Baal listened to the jazz music heard from the record player and looked at the 'revolt suppression' news transmitted from each part. As expected. It's much more efficient for me to become Hina.\n\n\"Head Prefect Hina.\"\n\nBaal, no. Sorasaki Hina saw Ako entering the office. The muzzle of Hot Shot, the pistol symbolizing the Senior Administrator, was aimed at her. While crying, Ako shouted while aiming the muzzle accurately at Hina's forehead.\n\n\"This kind of anti-ethical thing is not the way of Gehenna. Even Trinity torture technicians wouldn't have devised this kind of thing. Immediately give the withdrawal order...!\"\n\"Ako. Do you really think you can neutralize me with just that one Hot Shot?\"\n\nHina stood up from her seat and slowly approached Ako, who was aiming the muzzle. Ako couldn't pull the trigger until Hina came right in front of her. Hina slightly grabbed and snatched Hot Shot, then placed it back on her hand. Ako stared at the gun blankly for a moment, then soon sobbed while bowing her head.\n\nHow could Amau Ako pull the trigger on Sorasaki Hina? This too was a coup, but Hina didn't dislike this courageous Ako. Hina patted Ako's shoulder. This too was a part of 'revolt suppression'."
 GEH.hina.story_event.34.a: "\"Nothing happened. Ako. Now go back and let's start with organizing the slaughter operation documents.\""

 GEH.hina.story_event.35.t: "Baal's Throne - 1"
 GEH.hina.story_event.35.desc: "Great Gehenna State, be eternal. Sorasaki Hina defeated all rebels, and complete peace arrived in Deutschland. However, one question remained. The reason why she, who called herself Baal, was born—she came to know it through a chance opportunity.\n\n\"...Terror-ization?\"\n\nThe book that was stuck in a corner of the Gehenna old library. The stories about the inversion of Mystery written there told Hina, who was wandering searching for the reason for her birth, interesting information. Baal was not a simple split personality of Hina, but another aspect of her Mystery. And... the moment she seized the initiative of the body, Hina's 'inversion' occurred.\n\n\"Inversion of Mystery, so... it means I'm not an existence born of simple mental illness. Interestingly.\"\n\nIf the weak side of Hina had known that fact earlier, could she have found a way to eliminate Baal? Now it's something that cannot be known. Hina recorded the information found in the library and then destroyed the book so that other people couldn't read it.\n\nThe important thing was only the fact that now she herself is the only real Sorasaki Hina, and that Hina is the one and only leader of Gehenna. What more would be needed than that?"
 GEH.hina.story_event.35.a: "I am the victor"

 GEH.hina.story_event.36.t: "Baal's Throne - 2"
 GEH.hina.story_event.36.desc: "\"Head Prefect? A cup of warm coffee is prepared. Fufu.\"\n\nAko gave a faint smile and put down the mug. Hina gave a relaxed smile and slightly lifted the mug, taking a sip. Ako acted as if she had forgotten the fact that she had tried to kill Hina. Was it due to a self-defense mechanism? If not, did she also break down once because of a sense of despair? She had no interest that far.\n\nAko no longer rejected all of Hina's policies. She even came to gently accept the widespread 'cleaning' of Gehenna locals. The relationship between Hina and Ako also became more intimate than ever after the 4th General Assembly.\n\nGehenna was becoming more perfect than ever. Order was set right and the crime rate was recording the historical lowest every time. Fascists and communists could no longer carry out a meaningful level of resistance. There is information that Albert Speer, who fled abroad, is continuing agitation, but now he has no ability to evoke a meaningful will of resistance in Deutschland anymore.\n\nThe Prefect Team, the Gehenna society, all of it was advancing toward perfection. Hina felt internal peace and slightly lifted the mug. Now what remains is her own peace. The leisure of a cup of coffee."
 GEH.hina.story_event.36.a: "The future is bright"

 GEH.hina.story_event.37.t: "Baal's Throne - 3"
 GEH.hina.story_event.37.desc: "\"Gehenna is hell. No, do they call hell Gehenna?\"\n\nThe floor below Hina's office. Iori saw the mortality rate indicators, which were treated as top secret material. The number of local deaths, excluding the Gehenna type, was soaring at a scary rate every month. A society where summary execution is carried out on the street even for minor crimes. A society where humans are treated as livestock or furniture and consumed as disposables in factories until they die.\n\nWas this the order and discipline Iori wanted? Lately even Ako-chan seemed to have started to submit to this 'order'. She thought Ako-chan at least would refuse this madness.\n\n\"Whether Head Prefect Hina's nature was like this, or the situation of the Great Transfer made the Head Prefect turn...\"\n\nAccess rights to such secret information are given very limitedly even to Iori, the No. 1 in the military. Iori, who tried to read the statistics beyond the soaring mortality chart, confirmed that most of the statistical data were blacked out. In which region, how many people, for what reason were they executed. The specific data could not be known.\n\nHowever, the countless numbers that would be beyond this paper blacked out, blacked out, blacked out... Iori felt nausea just by imagining those numbers. For Gehenna to live, Deutschland was dying. Then don't we look like parasites of this land. A creature that must suck the host's blood and make the host die to live. No. It's not 'look like' a parasite.\n\n\"We are parasites. ...We made parasites.\""
 GEH.hina.story_event.37.a: "As she closed the document, Iori felt loneliness and pain in this perfect order."

 GEH.hina.story_event.38.t: "Inferior Nation"
 GEH.hina.story_event.38.desc: "\"The fact that the Germans are engaged in simpler labor and receive lower wages compared to the Gehenna people cannot be strictly seen as discrimination.\"\n\nWatanabe, a dog beastman with a beagle head, relaxed and waved his finger toward the camera screen. The nameplate 'Human Rights Expert' attached to his chest sparkled and shone under the camera in the broadcast studio. Watanabe gave a cynical smile as if there were Germans right before his eyes.\n\n\"The Germans don't know anything about how a smartphone works, and about the internet, fax, nuclear power, and all that. We Gehenna people are trying to 'separate' them from the dangerous new society with a heart like a parent protecting a child.\"\n\"If you say separation, you mean it's not discrimination?\"\n\"That's right. Separated but equal treatment is the will of the new Gehenna. I believe a day will come when they gain civilization under the flag of Gehenna and escape from the dark world. And when that time comes, the Germans will also be treated the same as us as civilized people.\""
 GEH.hina.story_event.38.a: "Though it will take a very long time."

 GEH.hina.story_event.39.t: "Planned Backward-ization"
 GEH.hina.story_event.39.desc: "The Gehenna government did not intentionally impose legal discrimination or regulation on the Germans. Planned backward-ization happened very carefully, and naturally without legal action. The number of trains coming to the villages of the Germans gradually decreased, and at one point the trains stopped coming. The hospitals in the villages were reduced one by one. German radio broadcasts were reduced, and as the price of oil rose several times, cars were not seen on the roads.\n\nWhen an old German man found a carriage going back and forth in a German village through the window, the old man finally realized. That Gehenna intends to gradually return all of Deutschland to before the Middle Ages, so that even if any variable occurs, they cannot seize the political and economic hegemony of Gehenna.\n\nThis planned backward-ization is not being applied to the Germans who cooperated in the establishment of the new Gehenna regime. So not all Germans have fallen into pre-modern civilization. But until when could Gehenna's mercy remain? Next generation? Or the generation after that?"
 GEH.hina.story_event.39.a: "The old man closed the curtain on the window."

 GEH.hina.story_event.40.t: " "
 GEH.hina.story_event.40.desc: "On my school notebooks\nOn my desk and the trees\nOn the sand, on the snow\nI write your name\n\nOn all the pages read\nOn all the white pages\nStone, blood, paper or ash\nI write your name\n\nOn the golden images\nOn the soldier's weapons\nOn the crown of the kings\nI write your name\n\nOn the jungle and the desert\nOn the nests and the briar\nOn the echo of my childhood\nI write your name\n\nOn all my blue scarves\nOn the sun-moistened swamps\nOn the lake where the moonlight lives\nI write your name\n\nOn the fields, on the horizon\nOn the wings of the birds\nAnd on the mill of shadows\nI write your name\n\n(...)\n\nAnd by the power of a word\nI start my life again\nI was born to know you\nTo name you\n\nLiberty.\n\n"
 GEH.hina.story_event.40.a: "Paul Éluard, 'Liberté'"

 GEH.hina.story_event.41.t: "I'm Not a Strong Person"
 GEH.hina.story_event.41.desc: "\"...What do you mean?\"\n\nIn the high tower, the office that seemed to lock Hina inside, Sorasaki Hina put down the pen she was holding in her hand. Hina realized that she could no longer endure alone. Whatever other followers thought of her, Hina was not a strong person like Takanashi Hoshino. Many followers believed Hina was an iron-willed dictator, but no. Hina had never been an iron-willed person.\n\nHina decided to admit it. She was not a strong person. Why did the other personality 'Baal' appear? Why did Sorasaki Hina suffer from split personality among numerous mental illnesses? Because she, who was not a superhuman, had to forcibly act as a superhuman.\n\nAnd, Hina who was an ordinary person, who was exhausted just by guarding the order of Gehenna, found the existence of that superhuman Baal who whispered to set down everything and become *comfortable* forever, nauseating.\n\nShe might be a strong existence. If she entrusted everything to her, she would be able to rule Gehenna more capably than herself. But Hina would not do so. It wasn't because of a high-level reason like free will. Just, acting as a superhuman for herself who was not strong felt like lying to herself.\n\nTherefore, Hina grabbed and pulled Ako's wrist tightly.\n\n\"I'm not a strong person.\"\n\nHina spoke once more. As if Ako might not have heard her words. The crown of the soul shook, and Baal's sneer vanished far away and became blurred. Sorasaki Hina admitted her weakness. Because it felt better than living in a lie. Because that was the free and pure essence of Sorasaki Hina."
 GEH.hina.story_event.41.a: "\"Ako. Help, me.\""

 GEH.hina.story_event.42.t: "As If Accepting Weakness"
 GEH.hina.story_event.42.desc: "\"Everyone has things they hide. Like Head Prefect Hina's split personality, or the fact that you thought of yourself as weak. ...Yes. Head Prefect Hina is not Takanashi Hoshino. You wouldn't be able to act like that person who stayed in the academy to guard Abydos alone even after the former student council president died. But.\"\n\nWith a *Clack* sound, Ako slammed Hina's desk with her palm. A sudden action not shown before Hina. Hina winced for a moment.\n\n\"Ako?\"\n\"...Does that matter? I didn't come to like Head Prefect Hina because she was a 'superhuman'. You just... need to remain as Head Prefect Hina. You don't need to become someone else. No matter what others think Head Prefect Hina is, no matter what you think yourself you should become, it doesn't matter. Please remain without changing.\"\n\nWhatever existence Hina was, even if she were not the strongest in Gehenna but an ordinary girl, Ako would not have left Hina's side. Because what was important to Ako was that she fell for the 'current' upright Sorasaki Hina.\n\nHina didn't have to strive to become a perfect existence—superhuman. She couldn't even do that in the first place. What is the problem with not being a strong person? Everyone had their own path.\n\n\"I want to walk the path Head Prefect Hina must go, together. If you're not strong, I'll be by your side. Acting in groups because we're not strong. That's a person, isn't it?\""
 GEH.hina.story_event.42.a: "\"Yeah. ...We are people. Crying, making mistakes, and sometimes weak.\""

 GEH.hina.story_event.43.t: "Hina's Situation"
 GEH.hina.story_event.43.desc: "After baring all her weakness to Ako that day, Baal stopped the attempt to seize the initiative of Hina's body. Sorasaki Hina *cannot* become a superhuman. By accepting that fact herself, and accepting even her weak appearance as her own appearance. That cold personality seemed to have (in some sense) given up on Hina.\n\nOf course, separately from that, she had to receive mental treatment. Carl Jung, a local psychiatrist who visited as Hina's personal doctor, continued to write notes in the medical chart with a somewhat troubled expression.\n\n\"To be honest, this disease called 'Dissociative Identity Disorder' or 'Split Personality' in Kivotos... has never been reported in the psychiatric world on Earth. Well, there were stories about others talking in one's head. But instead of expressing it as identity disorder, it's defined as schizophrenia, a word created by the eugenicist Mr. Bleuler.\"\n\n\"I don't know much about complex medical explanations.\"\n\"Well, simply put, it's like this. I don't know about Baal as much as you do. However, instead of directly removing the Baal inside you... I intend to discuss the cause of why you 'created' Baal, and focus on psychological counseling to treat the fundamental past pain that made your mind muddy.\"\n\"The cause of creating Baal... it must be because of my loathing. Hatred toward the so-called Gehenna zealots who try to make me a superhuman, and hatred toward the German locals who continue to disturb order. Also, hatred toward my own weakness being swayed by all those hatreds. ...I am self-aware.\"\n\"If you are self-aware of the cause, the counseling will be easy too.\""
 GEH.hina.story_event.43.a: "Jung gave a faint smile."

 GEH.hina.story_event.44.t: "Order Re-establishment"
 GEH.hina.story_event.44.desc: "Hina decided to accept her weakness. And, unlike before, she started more meetings. Not just the Morale Department where the zealots gathered, but meetings gathering executives from all other departments. This was as good as declaring that Sorasaki Hina will no longer be swayed by the madness of the Morale Department, nor will she act only as the 'leader the Morale Department wants'. Especially the one most pleased was Shiromi Iori, who was experiencing a strange power struggle between the Enforcement Department and the Morale Department.\n\nAfter the meeting ended, Iori tapped the tip of Hina's wing while leaving the conference room. It was an action, more 스스럼없는 than any, that she wouldn't have done even before the 'Great Transfer'. Several Morale Department personal guards reached for their holsters with an infuriated look. However Hina raised her hand and stopped the movements of those Morale Department members. And, she laughed toward Iori.\n\n\"...Is there something you want to say?\"\n\"Because after starting the Thunder Emperor play, you looked like a person for the first time.\"\n\"Looked like a person...\"\n\nHina looked down at her two hands. Certainly, the feeling of dancing under an invisible thread. It's a feeling of being liberated from that cursed pain. After baring everything to Ako, Hina was finally saved. By admitting that she was not perfect, she became freer than at any time she was doing the 'Thunder Emperor play'.\n\n\"...If it looks like that, I'm glad. Since I just became a person just a while ago.\"\n\"The Head Prefect always says things I can't understand.\"\n\nIori chuckled and turned away. Yeah. Iori probably wouldn't know the pain she had suffered. It would be better not to know. Anyway it's a past matter that has now passed."
 GEH.hina.story_event.44.a: "Upright order"

 GEH.hina.story_event.45.t: "To Become Whole"
 GEH.hina.story_event.45.desc: "Sorasaki Hina approached the office window. Looking down at the street where the Germans live from the office, she felt a light nausea. The hatred toward the locals that Baal had continued to whisper. Baal's will whispering that they must be exterminated. Hina was now free from Baal's temptation, but the heritages she left behind remained like scars in her head.\n\nWhenever Hina saw the Germans, she felt nausea. Whenever she saw the Prefect Team members, the base emotion of Baal whispering that she must control and rule them, who were 'idiots', came up and down as if it were her own. Of course the current Hina knows that those emotions were made up. However knowing it by knowledge and reason and practicing it by action are different. If she could easily control her emotions by knowledge and reason, there wouldn't be anyone who couldn't quit smoking in the world.\n\nTherefore, Hina decided to divide the work until her created hatred melts away. She dumped the control over the Germans to the zealots. Anyway they were less important people than close people like Ako. And, for the time being, she decided to focus on erasing the superiority created by meeting with people inside the Prefect Team. It will take a long time, but Hina intended to gradually reduce Baal's influence."
 GEH.hina.story_event.45.a: "Because this is me"

 GEH.hina.story_event.46.t: "Sorasaki Hina - 1"
 GEH.hina.story_event.46.desc: "\"...Thunder Emperor play, as Iori said. She said that about the things I've done. Acting like a dictator, dragging personal guards around, and doing weird things. ...Truly, why was I so corrupted.\"\n\nThe shooting range in Gehenna. Hina picked up the prepared gun and fired at the target. She was gradually becoming a 'politician' recently, but her amazing shooting skills haven't dulled even a bit. To the point she could act as the Head Prefect just the same even if she returned to the pre-Transfer period right now.\n\nAko smiled brightly while seeing such an appearance of Hina.\n\n\"You haven't been corrupted. Aren't you striving to change like this even now? Besides, you've steadily managed your ability as the Head Prefect so it hasn't dulled.\"\n\"Still, if I face the me of that time, I'd lose?\"\n\"Fufu. You don't know that. Maybe the current Head Prefect is stronger?\"\n\nIt was trivial chatter but enjoyable. An everyday life of exchanging such trivial chatter with the closest friend. She had forgotten this important thing while being possessed by Baal. But now it's different. Hina fired a bullet toward the target once more. *Bang!* Along with the refreshing gunshot, the bullet hit the center of the target.\n\n\"As expected of the Head Prefect! You're amazing every time!\"\n\nA subordinate who supports her like this and rejoices in her success as if it were her own. Because she realized that Administrator Ako is by her side. Hina looked back at Ako and laughed faintly. Hina will no longer be dominated by Baal. The real Sorasaki Hina might be weak. But, if she is together with the partner she cherishes most... Hina could become stronger than anyone."
 GEH.hina.story_event.46.a: "To the future, to a brighter tomorrow"

 GEH.hina.story_event.47.t: "Sorasaki Hina - 2"
 GEH.hina.story_event.47.desc: "\"...Head Prefect Hina has improved a lot lately. Honestly it seems she became even worse at politics.\"\n\nIori grumbled and moved her steps to a German countryside village. Due to the intentional ethnic suppression and discrimination policy of the new Gehenna regime toward the Germans, the village was fallen into almost a Middle Ages level. On the street, horses were revived as a means of transportation, and as public schools all disappeared, young children couldn't even write their names and could only count from 1 to 10 for numbers. Iori looked up at a clumsy building made by weaving logs - Unter den Linden University. A sign reading 'Permanently Closed' is hung on the building entrance. Iori ignored the sign and entered the university building.\n\nThe Morale Department agents composed of Hina's followers were taking out all the books of the university and burning them. The reason was one - deprivation of education rights of the next generation of Germans. Iori clicked her tongue while seeing their actions. Even after Hina's split personality problem was solved, the treatment toward the Germans didn't improve at all. Because Hina still hated the Germans, and she dumped all policies toward the Germans to the Morale Department. But... Iori felt this was not right.\n\n\"Is this the way you 'keep order'? Making the kids who want to learn unable to learn? ...Why are the Gehenna Helmet Gangs and the Prefect Team playing the same way.\"\n\nAt Iori's sarcastic words, several Morale Department members approached Iori with threatening expressions. Iori's Enforcement Department members immediately went forward and confronted them. Enforcement Department and Morale Department. A military organization split in two. The internal conflict of the Prefect Team also didn't improve.\n\n\"It's the authority of the Morale Department to control here. The Enforcement Department go back.\"\n\"Ha, really. Thinking she's something special...\"\n\nIori laughed at them for a moment, then pulled out her rifle. If she intended to leave after hearing a word, she wouldn't have even come here to block the university book burning. Even in the same military organization, the rank was much higher for Iori, the Enforcement Department Head. Iori advanced forward with the Enforcement Department members."
 GEH.hina.story_event.47.a: "\"Shut up, and stop the book burning. You villains.\""

 GEH.hina.story_event.48.t: "Sorasaki Hina - 3"
 GEH.hina.story_event.48.desc: "Amau Ako felt her head throb while reading the report that Iori had a violent incident with the Morale Department in Berlin. Head Prefect Hina's condition was surely improving. The split personality symptoms vanished, and Hina was gradually regaining her bright past personality while escaping from her sense of guilt. However, the condition of all the people of Gehenna, not Hina herself, was getting worse. The Panopticon system Hina imposed under the influence of Baal was not withdrawn at all. The discrimination policy toward the locals was getting worse.\n\n\"...*Sigh.* I can't be despairing here. If Head Prefect Hina's condition improves, the political situation will surely stabilize. The Morale Department and those trash will also be organized.\"\n\nAko self-suggested like that and closed Iori's violent incident report file. The state of Gehenna is certainly precarious. More people are living painfully than before the Transfer. But, Ako still has hope in this world. At least Sorasaki Hina. Because her most precious person was escaping from pain. Even if everyone else except her is falling into hell.\n\nAko believed that Hina would someday return to save the rest who are submerged in hell. And when that day comes, clearly, everything will improve. One step at a time, we are advancing toward a better future."
 GEH.hina.story_event.48.a: "May the freedom Hina gained spread to all of us"

 GEH.hina.story_event.49.t: "Only Hina"
 GEH.hina.story_event.49.desc: "Ayaka's room was a sanctuary. Her world, her universe revolved only around one person. While carefully placing the newly arrived figure of Sorasaki Hina in the center of a transparent display case, Ayaka let out a satisfied sigh. The texture of the silver hair, the jet-black demon wings on the waist, and the four horns elegant like a crown, the sacred sculptural beauty shone brilliantly as it received the morning sunlight.\n\nThe wallpaper had lost its meaning long ago. All four directions were covered without any gaps by Hina's posters, and dozens of figures were boasting her majesty in each different posture. On the bookshelf, books like <Savior of the Final Act, The Combat Chronicles of Sorasaki Hina>, <Incarnation of Order, Everything about the Leader Hina> were placed like scriptures. After Gehenna was finally reunified under a single order, this became a natural scenery. Head Prefect Sorasaki Hina was a savior who ended the era of chaos, and a living god.\n\nThe voluntary worship toward her bloomed in the form of a new religion. Affection for family, friendship with friends, love between lovers. Those were all just imperfect and finite emotions that will someday deteriorate. The ideology that only the pure love toward Hina-sama is the unchanging thing spread among the students of Gehenna like the words of a Bible. Ayaka was the most devout believer of that teaching.\n\nAyaka, who changed clothes for work, finally knelt before the display case. She piously joined her two hands, and her gaze was fixed on the amethyst-like eyes of the figure she just newly placed. An existence she had never met directly, and whose voice she had only heard through media. However to her, she was the target of the most certain and unique love than any other relationship in the world. Ayaka's lips slightly flickered. She whispered the love that wouldn't be enough even if repeated hundreds of times to her only god today too. \"I love you, Hina-sama.\" Along with that confession, Ayaka's day finally had a complete meaning."
 GEH.hina.story_event.49.a: "I love you."

 GEH.hina.story_event.50.t: "I Hate Violet"
 GEH.hina.story_event.50.desc: "The car parade that followed the end of the 4th Prefect Team General Assembly felt more like a long torture than a march of victory to Sorasaki Hina. On the slowly advancing open car, she stared straight ahead with a stiff face. The waves of violet Gehenna flags waved by the crowd filling the Central District of Gehenna made her vision dizzy. They shouted, cried, and screamed Hina's name.\n\n\"Long live Hina-sama! Long live! Our parent...\"\n\nThe cheers were not joy, but were deteriorated into an eerie madness. Some citizens shed tears like a waterfall while reaching out toward her, and some other citizens rolled on the asphalt floor and praised Hina's name like fanatics. The fact that she, the symbol of order and discipline, was in the center of such a chaotic and bizarre worship made Hina uncomfortable. This is not respect. It's mere madness. Hina frowned before she knew it.\n\n\"Ako.\"\n\nAt the low call, Amau Ako sitting in the next seat immediately straightened her back. She also kept her lips tightly closed as if that sight was unpleasant, but at Hina's call she returned to the face of a perfect Senior Administrator as always.\n\n\"Yes, Head Prefect Hina.\"\n\"Do you think this... sight is normal?\"\n\nHina's gaze was still fixed on the crowd. Ako hesitated for a moment. Honestly, she also found their appearance revolting. However she didn't want to upset Hina. She wanted to believe that it was an outbreak of loyalty toward her. Ako spoke with a forced smile.\n\n\"Doesn't it show how much everyone respects and follows the Head Prefect. It's a bit radical, but... it's a proof that your majesty is that great, Head Prefect.\"\n\nThat answer did not become any comfort to Hina. Rather it only gave a deep sense of disconnection. Hina didn't say anything more and turned her head again. In the cheers that tore the ears, she reached a cold realization. Maybe it's not only them who are going crazy. Ako who must affirm this madness even after seeing it, herself who is standing in the center of that madness, no, the world surrounding me itself... maybe it went crazy long ago. Hina looked at the crowd crying out toward her with cold eyes."
 GEH.hina.story_event.50.a: "Disgusting."

 GEH.hina.gov_event.1.t: "Thought Cabinet"
 GEH.hina.gov_event.1.desc: "\"Thought cabinet...?\"\n\n\"Yeah. Try thinking of your head as a single cabinet. You're a detective, and you're investigating a case you newly took over. An investigation under the name of self-search. ...You're keeping all your knowledge and thoughts in the cabinet in your head. And you take out the necessary knowledge among them and internalize it.\"\n\n\"What is that internalization, Baal?\"\n\n\"To finish the investigation under the name of self-search, you organize your own thoughts in order. It's not hard.\""
 GEH.hina.gov_event.1.a: "Maybe."

 GEH.hina.gov_event.2.t: "Internalization"
 GEH.hina.gov_event.2.desc: "I organized my thoughts.\n\nAnd, I woke up from my sleep.\n\nThere was still Gehenna there.\n\nJust as in the dream."
 GEH.hina.gov_event.2.a: "Maybe this place is the dream, and that place..."

 GEH.GEM.shared_event.1.t: "New Year's Apéritif"
 GEH.GEM.shared_event.1.desc: "The New Year of 1937 is noisy with the controversy over Nyaomoto Food's seizure of the alley markets. Because a controversy began to emerge that Nyaomoto Kan, the CEO of Nyaofood who was doing support projects under the name of supporting alley markets, is actually giving direct and indirect disadvantages to stores that don't buy food ingredients from his company through collusion with the shopping district head.\n\nEspecially the controversy related to Suzume-tei, a famous restaurant in Gehenna, is getting bigger. Gourmet Research Society President Kurodate Haruna criticized the Gehenna government for not investigating the criminal acts of Nyaofood as essentially tolerating crime.\n\nWhile many people are watching the response of [ROOT.GetName], [ROOT.GetLeader] must state a position whether to declare protection for Suzume-tei. In the conflict between the two forces of [GEH.GetNameDef] and [GEM.GetNamedef], our choice will advance the cooperative relationship with the Gourmet Research Society, or by inducing failure for the Gourmet Research Society, become an opportunity to suppress their social influence."
 GEH.GEM.shared_event.1.a: "Side with Haruna and support Suzume-tei."
 GEH.GEM.shared_event.1.b: "Is the Gourmet Research Society's word even worth believing in the first place?"

 GEH.GEM.shared_event.2.t: "Trip-Trap-Train"
 GEH.GEM.shared_event.2.desc: "It is already a daily life for Kinugawa Kasumi and the Hot Springs Development Department to commit bomb terror, but the action Kasumi committed this time can be said to be an absurd major incident out of daily life. Nakamasa Ichika of [TRM.GetName], while carrying out the task of transporting relics excavated by Trinity archeologists in South Kivotos to Trinity, encountered the Kasumi group that intruded into the train.\n\nKasumi, who was being pursued by the Gehenna Prefect Team Enforcement Department Head Shiromi Iori for terror charges, snatched the relic that Nakamasa Ichika was trying to transport and staged a hostage situation 'ordering' Ichika to eliminate the Prefect Team, and in the confusing situation, damaged the relic.\n\nKasumi is in a situation of fleeing with the help of other Hot Springs Development Department members after being severely assaulted by Ichika and falling out of the train. Response from the two governments of [GEH.GetNameDef] and [GEM.GetNameDef] is needed for this incident. Either focus on the pursuit of the escaped Kinugawa Kasumi, or focus on the compensation issue for [TRM.GetAdjective] to maintain a friendly relationship with the Hot Springs Development Department rather than the pursuit of Kasumi."
 GEH.GEM.shared_event.2.a: "Prioritize compensation for the relic."
 GEH.GEM.shared_event.2.b: "Prioritize pursuit of the escaped Hot Springs Development Department."

 GEH.GEM.shared_event.3.t: "Roasted Corn for Sale"
 GEH.GEM.shared_event.3.desc: "There are more than one or two absurd incidents committed by the Gourmet Research Society, but the recent bizarre behavior of the Gourmet Research Society is making the [ROOT.GetNameDef] side quite perplexed. Matching the day of the large-scale engagement between Gehenna's violent organizations Splash-Splash Helmet Gang and Messy-Tangled Sukeban, which is getting intensified after the Transfer, President Kurodate Haruna announced an ambitious aspiration to 'sell roasted corn beside the violence scene and gain a large profit' and is buying corn in large quantities.\n\nAs the two organizations Splash-Splash Helmet Gang and Messy-Tangled Sukeban promised a struggle near the border of the two organizations [GEM.GetNameDef] and [GEH.GetNameDef], it seems the public order forces of both sides will move to arrest the Helmet Gang and the Sukeban. The problem is whether Kurodate Haruna and the Gourmet Research Society should also be targets for arrest besides the Helmet Gang and Sukeban.\n\nThe first way is to arrest only the Helmet Gang and the Sukeban because the Gourmet Research Society did not directly intervene in this violent incident and to maintain a friendly relationship with the Gourmet Research Society. However, in that it's a good opportunity to mop up Kurodate Haruna along with other delinquent organizations, there are opinions that Kurodate Haruna should also be a target for arrest. The choice belongs to [ROOT.GetLeader]."
 GEH.GEM.shared_event.3.a: "She could just sell some roasted corn..."
 GEH.GEM.shared_event.3.b: "Arrest everyone. Including Kurodate Haruna."

 GEH.GEM.shared_event.4.t: "A Hot Spring Under the Parliament Building?"
 GEH.GEM.shared_event.4.desc: "Today was supposed to be a ceremony to officially announce the opening of the new parliament building after the completion of the construction to newly open the parliament building of the Pandemonium Society along with the congratulatory speech of [GEM.GetLeader]. However, that ceremony was completely suspended due to the terror activity of Kinugawa Kasumi who set off a large-scale hot spring blast in front of the parliament building. Kinugawa Kasumi fled from the scene while claiming that 'there was hot spring water under the parliament building'.\n\nKasumi's terror caused great secondary damage to the parliament building. Not only that, the hot spring water that came up from under the parliament building is causing a strange phenomenon. Bizarre reports are following from various parts of the Central District of Gehenna that foods made with hot spring water are becoming huge and running wild. The so-called 'Pan-chan', a super large pancake the size of a building, killed many local Germans and Kivotos-type population using green keratin and violet tentacles. At first, Ushimaki Juri was suspected of proactively creating the giant Pan-chan, but we confirmed that it is a bizarre incident occurring as the hot spring water that came up from the Gehenna underground touched the food.\n\nThe two forces of [GEM.GetNameDef] and [GEH.GetNameDef] started a joint response to the confusion incident burning the Central District of Gehenna. The problem is that both Kinugawa Kasumi and the giant Pan-chan are serious threats to the Gehenna people. If prioritizing arresting Kasumi, the Pan-chan will run wild for a longer time, and if focusing on killing the Pan-chan, the Hot Springs Development Department will hide underground in the meantime. The rational decision of [ROOT.GetLeader] is more important than ever."
 GEH.GEM.shared_event.4.a: "Eliminate the Pan-chan first. That cursed food..."
 GEH.GEM.shared_event.4.b: "Kasumi must go to prison."

 GEH_news.1.t: "Gehenna Prefect Team Seizes Complete Discipline"
 GEH_news.1.desc: "After the Great Transfer, various resistance forces like Nazi party member organizations, the Helmet Gang, etc. still existed in Gehenna. The Prefect Team had been continuously fighting against them, but it was considered that it would be a difficult thing to completely destroy all criminal organizations. However, under the leadership of [GEH.GetLeader], the Gehenna public order organization dismantled the last criminal organization and controlled the discipline of Gehenna.\n\nOf course small-scale Helmet Gang organizations still remain in the Gehenna society, but now there is no more organized large-scale criminal organization opposing the [GEH.GetLeader] system. This is a complete victory for the Prefect Team."
 GEH_news.1.a: "Our mission is achieved."
 GEH_news.1.b: "The Gehenna Prefect Team is truly terrifying."
 GEH_news.1.c: "The power of the Kivotos people is continuing to grow..."

 GEH_news.2.t: "Holding of the 1st Gehenna Prefect Team General Assembly"
 GEH_news.2.desc.hina: "Originally the Gehenna Prefect Team was a system with a thorough hierarchy where 'if the Head Prefect orders, the below follow'. However due to the political confusion after the Great Transfer, the Prefect Team exceptionally decided to abandon the previous tradition and gather all the important Prefect Team members from all departments to decide the future through a general assembly.\n\nIn the Prefect Team General Assembly, neither the bureaucrat-centered Planning Bureau nor the military-police-oriented Enforcement Department gained superiority in the future policy discussion. Many Prefect Team members, amidst the distrust toward the executives who failed to show a strong appearance, hoped that Hina who has a strong charisma would end the confusion. Hina is temporarily keeping a distance from the claims of the general assembly, but it's unknown how long she can refuse the demands of the supporters."
 GEH_news.2.desc.iori: "Originally the Gehenna Prefect Team was a system with a thorough hierarchy where 'if the Head Prefect orders, the below follow'. However due to the political confusion after the Great Transfer, the Prefect Team exceptionally decided to abandon the previous tradition and gather all the important Prefect Team members from all departments to decide the future through a general assembly.\n\nAs the hardline measures put forward by the Enforcement Department were decided in the Prefect Team General Assembly, the initiative of the Prefect Team moved from the Planning Bureau where bureaucrats gathered to the Enforcement Department centered on the military. As the military emerged as the center of power, the Pandemonium Society seems to be preparing a response while closely watching the militarization of the traditional competitor Prefect Team."
 GEH_news.2.desc.ako: "Originally the Gehenna Prefect Team was a system with a thorough hierarchy where 'if the Head Prefect orders, the below follow'. However due to the political confusion after the Great Transfer, the Prefect Team exceptionally decided to abandon the previous tradition and gather all the important Prefect Team members from all departments to decide the future through a general assembly.\n\nAs the moderate measures put forward by the Planning Bureau were decided in the Prefect Team General Assembly, the Planning Bureau where bureaucrats gathered seized the initiative of the Prefect Team. Amau Ako expressed confidence that governance by technocrats will make the Prefect Team a more advanced nation in the long term after the general assembly."
 GEH_news.2.desc.generic: "Originally the Gehenna Prefect Team was a system with a thorough hierarchy where 'if the Head Prefect orders, the below follow'. However due to the political confusion after the Great Transfer, the Prefect Team exceptionally decided to abandon the previous tradition and gather all the important Prefect Team members from all departments to decide the future through a general assembly.\n\nNeither the claim of Ako that a new oligarchy by technocrats should be implemented to reduce Hina's work burden nor the claim of Iori that the Prefect Team should be militarized centered on the Enforcement Department gained superiority in the policy discussion. Due to the meeting that reached a deadlock, the Prefect Team decided to maintain the policy from before the Transfer even in the local area to suit the situation without radical reform."
 GEH_news.2.a: "Let's advance toward the future!"
 GEH_news.2.b: "This general assembly will decide the future of the Prefect Team."
 GEH_news.2.c: "Do warlords do something like a general assembly in Kivotos too?"

 GEH_news.3.t: "Holding of the 2nd Gehenna Prefect Team General Assembly"
 GEH_news.3.desc.hina: "The 2nd Prefect Team General Assembly discussed in more depth the matters decided in the last 1st General Assembly, and discussion on the government reform of the Prefect Team proceeded.\n\nDespite Sorasaki Hina's euphemistic refusal, the Prefect Team members continued to demand an iron-willed dictatorship system by Sorasaki Hina in the 2nd Prefect Team General Assembly. Other departments were regarded as relatively 'incompetent' organizations compared to Hina's rule, and a consensus was formed that only under Hina's rule can the Prefect Team be gathered as one.\n\nUltimately Hina decided to accept the zeal of the Prefect Team members, and the Prefect Team seems to have been reorganized into an iron-willed dictatorship system loyal to Hina personally."
 GEH_news.3.desc.iori: "The 2nd Prefect Team General Assembly discussed in more depth the matters decided in the last 1st General Assembly, and discussion on the government reform of the Prefect Team proceeded.\n\nShiromi Iori and the Enforcement Department centered around her are demanding a hostile policy toward the Pandemonium Society through militaristic propaganda. Her enthusiastic claim to make the Prefect Team a barracks-state was passed in the general assembly, and small conflicts also occurred such as the Planning Bureau technocrats who opposed this exiting the assembly en masse during the general assembly.\n\nHina agreed with the barracks-state policy of the Prefect Team according to the decision of the general assembly, but anxiety is also spreading that a large-scale war is approaching the Prefect Team due to this decision."
 GEH_news.3.desc.ako: "The 2nd Prefect Team General Assembly discussed in more depth the matters decided in the last 1st General Assembly, and discussion on the government reform of the Prefect Team proceeded.\n\nAmau Ako and the Planning Bureau centered around her focused on criticizing the power structure concentrated on Sorasaki Hina personally. Ako claimed that the Prefect Team system is pushing Hina personally nearly to the point of 'abuse', and that an oligarchy by technocrats must be implemented.\n\nHina approved this decision that greatly reduces her own power, but as some Enforcement Department members exited the meeting hall en masse while pouring sexual insults toward Ako, the general assembly concluded in confusion."
 GEH_news.3.desc.generic: "The 2nd Prefect Team General Assembly discussed in more depth the matters decided in the last 1st General Assembly, and discussion on the government reform of the Prefect Team proceeded.\n\nAko's claim that a new oligarchy by technocrats should be implemented to reduce Hina's work burden and Iori's claim that the Prefect Team should be militarized centered on the Enforcement Department formed parallel lines. The 2nd Prefect Team General Assembly concluded without reaching any conclusion, and it was decided to maintain the current system in a deadlock where everyone is dissatisfied."
 GEH_news.3.a: "This is the future we decided."
 GEH_news.3.b: "The future of the Prefect Team has been decided."
 GEH_news.3.c: "How will the choice they made change the Prefect Team."

 GEH_news.4.t: "Holding of the 3rd Gehenna Prefect Team General Assembly"
 GEH_news.4.desc: "As the Gehenna Academy was reunified around the Prefect Team due to the victory of the [GEH.GetLeader] system, a new general assembly was carried out to decide the future of the Prefect Team. This general assembly was held with a focus on discussions to decide the future of the reunified Gehenna.\n\n[GEH.GetLeader] was nominated to concurrently hold the newly reunified Head Prefect post and the Gehenna Chairwoman post with the support of the Prefect Team members, and all documents of the existing Pandemonium Society were transferred to the Prefect Team. Through the 3rd Prefect Team General Assembly, which was close to a festival, a new future for Gehenna is dawning."
 GEH_news.4.a: "For a more disciplined and united Gehenna!"
 GEH_news.4.b: "The divided Gehenna has been integrated once again."
 GEH_news.4.c: "It's the birth of a powerful police state."

 GEH_news.5.t: "Holding of the 4th Gehenna Prefect Team General Assembly"
 GEH_news.5.desc: "As the [GEH.GetLeader] system became stabilized, the 4th Prefect Team General Assembly was held to decide the direction of the future Gehenna. In this general assembly, ways to further expand the policies decided in the last 2nd General Assembly were discussed.\n\nThis general assembly was carried out in the largest scale among the general assemblies so far, and as the internal coverage of the general assembly by media outlets was permitted for the first time, the general assembly process was transparently revealed. Through the successfully ended 4th Prefect Team General Assembly, it seems to have been proven that the [GEH.GetLeader] system brought a great victory to Gehenna."
 GEH_news.5.a: "We held the best general assembly."
 GEH_news.5.b: "Gehenna is continuously developing."
 GEH_news.5.c: "Now there won't be a nation that can stop them!"

 GEH_news.6.t: "Sorasaki Hina Resigned from the Head Prefect Post"
 GEH_news.6.desc.hina: "Rumors are spreading within the Prefect Team recently that Sorasaki Hina resigned from the Head Prefect post. It's a credible story that Sorasaki Hina's perfect iron-willed dictatorship system was completed, but Sorasaki Hina couldn't endure and collapsed from the abnormal praise from the fanatics and the pressure resulting from it.\n\nHowever the Prefect Team officially announced that the news of Sorasaki Hina's 'resignation' is false, and that Head Prefect Hina is in a state of being hospitalized due to pneumonia. Senior Administrator Amau Ako said in a media interview that she also heard nothing about the Head Prefect's resignation, and said she is waiting for the announcement from the personal guards composed of the Head Prefect's believers."
 GEH_news.6.desc.iori: "The sudden resignation of Hina Sorasaki was an unexpected event that no one in the Prefect Team anticipated. The Executive Committee, having seized power, condemned other departments, claiming that Hina's resignation and disappearance were due to her disappointment toward 'unpatriotic' traitors of the state system.\n\nWhile the Executive Committee is suppressing opposition in the Planning Department to establish a new militaristic order, there are many doubts as to whether the regime led by Iori Shiromi can remain stable in the absence of a leader like Hina Sorasaki."
 GEH_news.6.desc.ako: "The sudden resignation of Hina Sorasaki was an unexpected event that no one in the Prefect Team anticipated. In particular, technocratic reforms aimed at reducing Hina's authority and transferring it to the Planning Department had drawn backlash from various other departments, leaving the interior of the Prefect Team in a state of severe political strife.\n\nPhysical altercations between members of the Planning, Intelligence, and Executive Departments are breaking out within the Prefect Team, and Ako Amau's succession to the position of Head Prefect has also been delayed."
 GEH_news.6.desc.generic: "The sudden resignation of Hina Sorasaki was an unexpected event that no one in the Prefect Team anticipated. Ako Amau blamed everyone, including herself, stating that Hina's resignation was 'caused by all of us who placed such a psychological burden on Head Prefect Hina,' and announced that she would conduct a search operation to find her.\n\nDespite Ako's announcement to search for Hina, discussions are underway within the Prefect Team regarding the need for a new Head Prefect. While many members believe Ako Amau is the right fit, it seems more time will be needed for a transition of power as she refuses to give up hope of finding Hina."
 GEH_news.6.a: "Too tragic, too horrific."
 GEH_news.6.b: "They mistreated Hina Sorasaki far too much."
 GEH_news.6.c: "Does this signify the downfall of the Gehenna Prefect Team?"

 GEH_news.7.t: "Resignation of Head Prefect Ako Amau"
 GEH_news.7.desc: "Following the disappearance of Hina Sorasaki, Senior Administrator Ako Amau succeeded the position of Head Prefect with the support of the Planning Department. However, the Executive and Intelligence Departments continued to claim that the Head Prefect's resignation occurred because Ako had attempted to lay hands on Hina out of 'carnal desire.'\n\nInfuriated by the lesbian scandal orchestrated by the Executive and Intelligence Departments, Ako Amau erupted in disillusionment toward politics. Today, at the Prefect Team assembly, she performed a demonstration by tearing off her Head Prefect armband and throwing it down, declaring her resignation. This second resignation following Hina's departure has left the Prefect Team in unparalleled political chaos."
 GEH_news.7.a: "This is a disaster..."
 GEH_news.7.b: "I can see the downfall of the Prefect Team before my eyes."
 GEH_news.7.c: "Can they ever unite again? It looks difficult."

 GEH_news.8.t: "Inauguration of the Iroha Cabinet"
 GEH_news.8.desc: "After the resignations of Hina Sorasaki and Ako Amau, the Prefect Team—which had been operating under a collective leadership system—has finally elected a new Head Prefect. Iroha Natsume, a former member of the Pandemonium Society, was categorized as a suitable figure for the Prefect Team's technocratic system due to her status as a non-partisan bureaucrat.\n\nIroha Natsume has decided to accept the position of the new Head Prefect, but since most of the power remains within the Planning Department, it is unlikely she will be able to exercise any substantial authority."
 GEH_news.8.a: "In any case, the anarchy is over."
 GEH_news.8.b: "Will Iroha Natsume be able to properly perform the duties of Head Prefect?"
 GEH_news.8.c: "Will this end the chaos of the Gehenna system?"

 GEH_news.9.t: "Inauguration of the Kayoko Cabinet"
 GEH_news.9.desc: "After the resignations of Hina Sorasaki and Ako Amau, the Prefect Team—which had been operating under a collective leadership system—has finally elected a new Head Prefect. Kayoko, a member of Problem Solver 68 and a regent advisor to the Grand Duchy of Luxembourg, was recognized by Senior Administrator Ako Amau as a suitable candidate for the new Head Prefect position.\n\nKayoko has decided to accept the position of the new Head Prefect, but with most power concentrated in the Planning Department, her authority is expected to be somewhat limited."
 GEH_news.9.a: "In any case, the anarchy is over."
 GEH_news.9.b: "Will Kayoko be able to properly perform the duties of Head Prefect?"
 GEH_news.9.c: "Will this end the chaos of the Gehenna system?"

 GEH_news.10.t: "The Wedding of Hina Sorasaki"
 GEH_news.10.desc: "Today, in the capital of [GEH.GetName], the wedding ceremony of Head Prefect Hina Sorasaki and 'Ako Sorasaki (Amau)' was held amidst the cheers of many supporters. The romantic relationship between Ako and Hina had long been a de facto public fact, and their wedding was no longer perceived as anything extraordinary within the Prefect Team.\n\nAlthough anti-Ako factions, including the Executive and Intelligence Departments, declared a boycott of the ceremony, many Prefect Team members and Gehenna citizens who support Hina and Ako's relationship gathered to conclude the wedding in great success. Government spokesperson Chinatsu Hinomiya announced that Hina and Ako would return to their duties immediately after a short honeymoon in Bavaria."
 GEH_news.10.a: "May our bond last forever."
 GEH_news.10.b: "I knew that 'Head Prefect's Dog' would pull it off eventually!"
 GEH_news.10.c: "The culture of Kivotos can be surprising by human standards."
 
 GEH_news.11.t: "The Reign of the Second Thunder Emperor"
 GEH_news.11.desc: "The fanaticism of the Prefect Team's zealots toward Hina Sorasaki has reached its peak, and opposition members who doubted Hina's political judgment have begun to disappear one by one. Under the support of zealots fueled by a mix of violence and madness, Hina Sorasaki approved a new Enabling Act that concentrates all power within the Prefect Team into her own hands.\n\nFollowing the original 'Thunder Emperor' who was the dictator of Gehenna, Hina Sorasaki has now become the second ruler to be addressed as Empress by the citizens of Gehenna. This title is an expression of anger and contempt for some, and an expression of awe and fear for others. What is certain is that the Prefect Team system has solidified into a complete philosopher-dictatorship, and any opposition to Hina Sorasaki personally will no longer be permitted within [GEH.GetName]."
 GEH_news.11.a: "It is finally complete."
 GEH_news.11.b: "The madness of the Thunder Emperor flows through Gehenna once more..."
 GEH_news.11.c: "Their idol worship is truly terrifying!"
 
 GEH_news.12.t: "Inauguration of the Rikuhachima Cabinet"
 GEH_news.12.desc: "After the resignations of Hina Sorasaki and Ako Amau, the Prefect Team—which had been operating under a collective leadership system—has finally elected a new Head Prefect. Aru Rikuhachima, the President of Problem Solver 68 and Regent of the Grand Duchy of Luxembourg, was recognized by Senior Administrator Ako Amau as a suitable candidate for the new Head Prefect position.\n\nAru Rikuhachima has decided to accept the position of the new Head Prefect, but the prevailing cynical prediction is that with most power held by the Planning Department, her authority will be limited to Luxembourg just as before."
 GEH_news.12.a: "In any case, the anarchy is over."
 GEH_news.12.b: "Will that outlaw be able to properly perform the duties of Head Prefect?"
 GEH_news.12.c: "...Isn't this just the conquered Luxembourg annexing the conqueror?"
 
 GEH_news.13.t: "Retirement Ceremony of Hina Sorasaki"
 GEH_news.13.desc: "Hina Sorasaki, who unified a divided Gehenna and protected the fatherland from external threats, became a leader revered by all Gehenna citizens. However, instead of pursuing power, she chose an honorable retirement at her peak.\n\nAt a celebration party held at the Gehenna Central District event hall, Prefect Team executives expressed their gratitude for the achievements Hina has accomplished thus far. While Hina will retain her status as a member of the Prefect Team, she has resigned from the position of Head Prefect and most of her duties. As the Prefect Team currently holds virtually all authority and oversees administrative affairs following the unification of Gehenna, her resignation has shocked both the media and the public.\n\nIn the next internal meeting, where Hina will participate as an ordinary member, the debate over the maintenance of the Gehenna Student Council and the Prefect Team system will be decided. Gehenna internal journalists predict that Ako, Hina's most trusted confidant, is the most likely candidate for the next Head Prefect."
 GEH_news.13.a: "You have worked truly hard, Head Prefect!"
 GEH_news.13.b: "That terrifying Head Prefect resigned? For real?"
 GEH_news.13.c: "Let us pay attention to the political changes in Gehenna."
 
 GEH_news.14.t: "Unification of Gehenna Comprehensive Academy"
 GEH_news.14.desc: "With the Gehenna Prefect Team at its center, Gehenna has once again been unified as an academy-state. Head Prefect [ROOT.GetLeader] has completely seized control of the Pandemonium Society, and the long-standing ill will between the two organizations appears to be at an end.\n\nOne notable point is that the Prefect Team, having achieved the reunification of Gehenna, has renamed the academy to 'Gehenna Comprehensive Academy.' Head Prefect [ROOT.GetLeader] stated that the title 'Comprehensive Academy' was adopted because the Prefect Team incorporated various German art and architecture colleges as part of Gehenna while continuing anti-Nazi activities. The new government stated that Gehenna will henceforth use 'Gehenna's Freedom' not for disorder and chaos, but for art and culture."
 GEH_news.14.a: "Hail the new Gehenna!"
 GEH_news.14.b: "So it's basically the art version of Trinity Comprehensive Academy?"
 GEH_news.14.c: "Why are those girls so obsessed with attaching 'Academy' to the name of a country?"
 
 GEH_news.15.t: "Unification of the Greater Gehenna State"
 GEH_news.15.desc: "Gehenna has once again been unified under the leadership of the Gehenna Prefect Team. [ROOT.GetLeader] has completely seized control of the Pandemonium Society, and the long-standing grudge between the Pandemonium Society and the Prefect Team appears to be over.\n\nFanatics and zealots following Hina Sorasaki held a victory parade in the capital of the Pandemonium Society, and numerous historical documents symbolizing the old Pandemonium order were put to the torch. Now, [ROOT.GetLeader] is scheduled to deliver a speech in the Gehenna Central District symbolizing the eternal prosperity of the Greater Gehenna State, and a statue commemorating Hina Sorasaki's victory will be built in front of the old Pandemonium headquarters. While many Gehenna citizens are enthusiastic about the Prefect Team's victory, some fear that Gehenna is being ruled by fanatics."
 GEH_news.15.a: "Hail the new Gehenna!"
 GEH_news.15.b: "Hina Sorasaki wasn't originally that kind of person..."
 GEH_news.15.c: "Gehenna has been submerged in eternal darkness..."
 
 GEH_news.16.t: "Unification of the Federal Republic of Gehenna"
 GEH_news.16.desc: "Gehenna has once again been unified under the leadership of the Gehenna Prefect Team. [ROOT.GetLeader] has completely seized control of the Pandemonium Society, and the long-standing ill will between the two organizations appears to be at an end.\n\nThe most significant change in Gehenna is that the new Great Transition led by the Prefect Team is attempting to take the form of an Earth-based nation rather than the long-standing academy-state system. This seems to be because the character of the Prefect Team has changed significantly due to bureaucratic reforms led by Ako and the technocrats. [ROOT.GetLeader] declared the founding of the 'Federal Republic,' and the new government stated it would strive to maintain order for the citizens of Gehenna."
 GEH_news.16.a: "Hail the new Gehenna!"
 GEH_news.16.b: "Gehenna is no longer an academy-state..."
 GEH_news.16.c: "The political situation in Germany is changing!"
 
 GEH_news.17.t: "Unification of the Gehenna Student Revolutionary Government"
 GEH_news.17.desc: "Following the sudden disappearance of Head Prefect Hina Sorasaki, radical students claiming that 'her disappearance is the responsibility of a corrupt Gehenna and all of us' established the 'Student Revolutionary Government' and unified Gehenna. The Revolutionary Government's leadership committee declared they would follow the 'true ideals' of Head Prefect Hina and build a 'Purified Gehenna' to realize those ideals. The old established classes, including the Pandemonium Society and the Prefect Team, were defined as 'symbols of old evils that drove the Head Prefect to despair' and were subjected to massive purges. Order in Gehenna is being forcefully reorganized under the name of the revolution.\n\nThe Student Revolutionary Government is enforcing radical reconstruction across society under the slogan 'Liquidate everything that goes against the spirit of Head Prefect Hina.' The thoughts and lifestyles of all students are being thoroughly censored according to the vague standard of the 'Great Head Prefect's Ideals,' and past culture, art, and even personal relationships are being branded as 'corrupt' and destroyed."
 GEH_news.17.a: "For Head Prefect Hina! Let us purify this society!"
 GEH_news.17.b: "Did she really want this kind of change... or is it just an excuse?"
 GEH_news.17.c: "Whom exactly is this revolution for?"
 
 GEH_news.18.t: "[GEH.GetNameDef] joins the forces of Decagrammaton"
 GEH_news.18.desc: "The atmosphere in Gehenna is changing rapidly. Hina Sorasaki convinced the Prefect Team executives that Decagrammaton is not a threatening opponent to Gehenna and is moving only for altruistic purposes to help humanity. The Executive Committee, including Iori Shiromi, expressed dissatisfaction, calling Hina's decision significantly 'illogical,' but Hina's supporters, including Senior Administrator Ako Amau, decided to follow her decision.\n\nThrough a decree issued to [GEH.GetName], Hina Sorasaki ordered the cessation of all hostile military activities against Decagrammaton and stated that they would henceforth form a united front with the [GEI.GetName] side to work toward the liberation of Kivotos."
 GEH_news.18.a: "I have made the right choice."
 GEH_news.18.b: "A surprisingly radical change."
 GEH_news.18.c: "She has completely lost her mind."
 
 ### Character Descriptions ###
 ## Hina Sorasaki ##
 GEH_hina_generic_leader_desc: "Hina Sorasaki is the Head Prefect of Gehenna Academy and is a widely known figure both inside and outside the academy. Even before the Great Transition, she gained fame for her strict personality and outstanding achievements as Head Prefect, earning both fear and respect from many students.\n\nAfter the 'Great Transition,' when Gehenna Academy moved to 1935 Europe, Hina quickly exercised public authority to prevent bloodshed that could occur amidst the chaos. The moment she swiftly cut off contact between the Germans and Gehenna students to maintain order was a moment where her cold judgment and brilliant leadership shone.\n\nHowever, the stress accumulated from endless work and unrealistic situations seems to have become a heavy burden even for her. Recently, she has been unable to hide her fatigue in official settings, and voices of concern regarding her health are growing louder from those around her..."
 GEH_hina_empress_leader_desc: "Hina Sorasaki is the Head Prefect of Gehenna Academy and is a widely known figure both inside and outside the academy. Even before the Great Transition, she gained fame for her strict personality and outstanding achievements as Head Prefect, earning both fear and respect from many students.\n\nIt was an open secret that Hina was growing exhausted due to the continuous workload following the 'Great Transition,' but the Prefect Team, which relied on Hina's individual leadership, did not allow her to step down from her duties. 'A Gehenna without a great leader will collapse before external threats.' Driven by the demands of such zealots, she chose to become a symbol and leader of the Prefect Team's faithful rather than living as the individual Hina Sorasaki. Or perhaps, she was simply chosen for it.\n\nAfter the fall of the Thunder Emperor, Hina Sorasaki became the second military dictator in Gehenna's history to be likened to an 'Emperor.' Supporters say Hina Sorasaki is the Empress who will sit upon the throne and propel Gehenna into an eternally great empire. However, cynics mock that the future of the Empress will be a tragedy surpassing that of the Thunder Emperor. For a failed dictator in Kivotos after the Great Transition, what awaits is not a soft ending like the graduation the Thunder Emperor experienced, but the rope of the gallows.\n\nThat ending will likely never be known."
 GEH_hina_empress_baal_leader_desc: "After Hina Sorasaki defeated all enemies in her way and donned the crown of great victory, more people are claiming that her atmosphere has 'changed.' Specifically, her personality has become so alien that it is as if another persona has taken over her body. Following the Gehenna Reunification War and the confrontation with Trinity, Hina has become more cruel and more cynical.\n\nIt isn't that her personality was literally swapped. Those around her, including Ako, claim she is merely 'exhausted' from long-term mental strain. Of course, they are all guessing the wrong answer.\n\nHina Sorasaki is dead. She was forced to accept the worship of maddened zealots and suffered from hatred toward the locals and internal conflict. No one took Hina's side; everyone only wanted Hina to lead them as a great philosopher-dictator. Hina stood above everyone but was lonelier than anyone, and she realized she was weak. Her mentally exhausted and cornered Mystery created 'Baal'—the persona of a 'true philosopher-dictator'—and Baal eventually succeeded in *replacing* Hina's personality.\n\nHina Sorasaki was a loner until the moment she died, and no one knew of her death."
 GEH_hina_empress_non_baal_leader_desc: "Hina Sorasaki is the Head Prefect of Gehenna Academy and is a widely known figure both inside and outside the academy. Even before the Great Transition, she gained fame for her strict personality and outstanding achievements as Head Prefect, earning both fear and respect from many students.\n\nIt was an open secret that Hina was growing exhausted due to the continuous workload following the 'Great Transition,' but the Prefect Team, which relied on Hina's individual leadership, did not allow her to step down from her duties. 'A Gehenna without a great leader will collapse before external threats.' Driven by the demands of such zealots, she was forced to become a symbol and leader of the Prefect Team's faithful.\n\nIn this process, the mental stress and pressure Hina felt manifested into mental disorders such as dissociative identity disorder, and she reached a point just before collapsing in mental agony. Hina eventually confessed to Ako that she could not be a superhuman, and by revealing that she was just a weak human rather than the great leader the zealots imagined... she ended the illusion of the 'Great Premise.'\n\nIt will not be an easy task for an infallible great leader to step down to the position of an ordinary human. However, Hina Sorasaki intends to move forward by acknowledging her own weakness. She may be mentally weak. But it is because they are weak that people gather in groups, and she knows that no person can stand alone."
 GEH_hina_fake_leader_desc: "Hina Sorasaki has collapsed. The zeal and worship of the fanatical guards surrounding her, the pressure forcing her to be a philosopher-dictator, the work continuing without a moment's rest... all of these things drove the human Hina Sorasaki to leave a resignation letter in the Head Prefect's office and depart.\n\nBut for the fanatics who worshiped her as a living god, the absence of a god was something that could never be accepted. As Voltaire once said, if God did not exist, it would be necessary to invent Him. Eventually, the believers invited an engineer from Millennium to create a robot that perfectly mimicked Hina Sorasaki.\n\nA mechanical god in the form of Hina Sorasaki descends onto the stage. An idol that possesses no emotions or empathy but performs the role 'desired' by her believers now stands before the public wearing the Head Prefect's armband.\n\nShe will never collapse like the previous Hina Sorasaki. As a manufactured god, a mockery of the real Hina Sorasaki, and the concept of a categorical imperative that all Gehenna citizens must follow, the new Hina will live forever. Forever."
 GEH_hina_ako_route_base_leader_desc: "Hina Sorasaki is the Head Prefect of Gehenna Academy and is a widely known figure both inside and outside the academy. Even before the Great Transition, she gained fame for her strict personality and outstanding achievements as Head Prefect, earning both fear and respect from many students.\n\nAfter the 'Great Transition,' when Gehenna Academy moved to 1935 Europe, Hina quickly exercised public authority to prevent bloodshed. The moment she swiftly cut off contact between the Germans and Gehenna students to maintain order was a moment where her cold judgment and brilliant leadership shone.\n\nHina Sorasaki decided to trust Senior Administrator Ako Amau to distribute her overwhelming workload. She accepted a technocracy that shared her own power with Ako and her Planning Department, which led to a series of political maneuvers from the resentful Executive and Intelligence Departments.\n\nHowever, Hina countered by publicly announcing that she was Ako's guardian and lover, taking a hardline stance to protect the Senior Administrator. As other departments backed down, unable to target Hina who possessed absolute popularity, it seems Hina's technocratic reform has achieved success. And she has also been able to lay down the burden of overwork that weighed so heavily upon her."
 GEH_hina_ako_route_bride_leader_desc: "Head Prefect of Gehenna, Chairperson of the Pandemonium Society and the Council, Ruler of Germany, and Great Reformer. There isn't just one title to call Hina Sorasaki. To many German locals, she is a demon who destroyed their country's traditions and culture, introduced a new technocracy, and married Ako Sorasaki; but to those of the Kivotos descent, she is supported as a great Chairperson who brought order to a Gehenna once filled with chaos and lawlessness, creating a society governed by law and reason.\n\nHowever, all these achievements could never have been realized without the help of Senior Administrator Ako Sorasaki. The Senior Administrator, better known by her maiden name Ako Amau, has long been Hina's staunchest supporter and achieved the reform of a political system focused on Hina's individual power into an oligarchy ruled by a majority of technocrats. The cooperation and love between Hina and Ako will remain in history as a turning point that completely changed Gehenna's history.\n\nA new morning dawns for Gehenna. She, who once wavered under overwork and burden, will never waver or collapse again. As long as she has the support of her most precious partner holding her hand, Hina believes she can shoulder the weight of the Gehenna Chairperson for as long as it takes."
 GEH_hina_ako_route_amau_leader_desc: "Head Prefect of Gehenna, Chairperson of the Pandemonium Society and the Council, Ruler of Germany, and Great Reformer. There isn't just one title to call Hina Sorasaki. To many German locals, she is an oppressor who destroyed their traditions and culture to introduce a new technocracy; but to those of the Kivotos descent, she is supported as a great Chairperson who brought order to a lawless Gehenna. \n\nIn the new republic, Hina Sorasaki is now more often called the Chairperson of the Council rather than Head Prefect. Unlike the past where she had to take up arms on the battlefield as Head Prefect, negotiations in parliament and complex administrative work for national development are becoming her new duties. Many citizens' eyes are turned toward her, wondering what the Federal Republic of Gehenna led by Chairperson Hina will look like. But one thing is certain: the Gehenna led by Hina and the Council will never be the same as before."
 GEH_hina_c_route_base_leader_desc: "Hina Sorasaki is the Head Prefect of Gehenna Academy, widely known for her strict nature and achievements. Even before the Great Transition, she earned both fear and respect from many students.\n\nAfter the 'Great Transition,' Hina quickly used public authority to prevent bloodshed between Germans and Gehenna students. Her cold judgment and leadership shone in maintaining order.\n\nAs the power conflict between the Pandemonium Society and the Prefect Team intensified, Hina eventually accepted Iori Shiromi's strong arguments and prepared and executed a surprise declaration of war against Pandemonium. Soon, the Prefect Team succeeded in unifying Gehenna, but what they gained were numerous problems arising from excessive military expansion.\n\nNow Hina Sorasaki must decide. From Iori Shiromi and her many followers in the Executive Committee, to the Gehenna War Department which has begun to act as a substantial central administrative organization, and even the Planning Department which has effectively collapsed during the conflict with the Executive Committee—Hina Sorasaki will now remain as the final arbiter of a Gehenna Academy fraught with issues."
 GEH_hina_c_route_ending_base_leader_desc: "Hina Sorasaki is the Head Prefect of Gehenna Academy, famous for her strictness and accomplishments. After the 'Great Transition' to 1935 Europe, she swiftly maintained order between locals and students through cold judgment.\n\nHowever, after the unification war with the Pandemonium Society, she stood at a critical crossroads. Instead of correcting the evils born from the militaristic system led by Iori Shiromi, Hina declared 'Emergency Powers' under the pretext of preventing division and chaos, concentrating all power into her hands. This was a ruthless decision to protect long-time colleagues and set the wavering order right. At this moment, she began to walk the path of an absolute dictator ruling over all of Gehenna beyond the role of Head Prefect.\n\nThis decision drew fierce backlash from Gehenna students, but Hina did not waver. To the Gehenna students who followed her, she may be remembered as a cold-blooded traitor who turned her back on her people. But to the oppressed Germans, she is a great liberator who guaranteed equal rights through the 'Charter of Universalism' and ended the chaos. Now, as the symbol of the new 'Gehenna-Deutsch Federation,' she reigns as an absolute ruler who enforced order through her own convictions.\n\nFuture historians may criticize the path of a dictator she walked and the sacrifices made along the way. However, no one will be able to deny that she was a great leader in that she fused two divided peoples into one and achieved unprecedented stability and harmony in an era of chaos."
 GEH_hina_cl_route_ending_base_leader_desc: "Hina Sorasaki is the Head Prefect of Gehenna Academy, known for her strict nature and achievements. Following the 'Great Transition,' she swiftly used authority to maintain order between locals and students.\n\nHowever, after the unification war with Pandemonium, she faced a major choice. Faced with the evils produced by the militaristic system led by Iori Shiromi, she chose the painful path of acknowledging her mistakes instead of consolidating power. She decided to investigate her long-time colleague Iori Shiromi as a war criminal and wipe away the bloodstains left by the Prefect Team. This was her firm will to protect the 'discipline' and 'justice' inherent to the Prefect Team over personal relationships.\n\nUnder her leadership, the militarized system was dismantled, and the Prefect Team walked the path to be reborn as a protective organization for students. The pinnacle of that reform was the new 'Direct Election for Student Council President' to replace the corrupt elections of Pandemonium. This was close to a kind of democratic centralization to elect a strong leader beyond factional politics. Although the election ended in her hard-fought victory, Hina accepted it not as evidence of division, but as the mission of 'national integration' given to her.\n\nShe has proven that the only focal point capable of binding a Gehenna split into multiple factions is herself, who gained the direct trust of the students. Now, she is not a dictator, but the first Student Council President of a strong new system elected by the hands of the students. Though she may be criticized at times as self-righteous, she has shouldered the heavy responsibility of healing Gehenna's wounds and rebuilding a great nation with the authority given to her."
 GEH_hina_student_peoples_will_leader_desc: "The madness known as the will of the people is burning through Gehenna. Although Hina Sorasaki, the military leader of Gehenna, holds immense legal power, in reality, she is merely a figurehead who does not exercise that power. While Hina opposed the organized madness of the so-called 'zealots' who claimed to follow her, she could not muster the will to directly oppose them or carry out her own intentions. Having dreamed of retirement even before the 'Great Transition,' she had no desire to engage in politics enthusiastically; in particular, the radicalization of the nation made her view the Prefect Team organization with increasing cynicism.\n\nHina sits in her office merely signing documents sent by her 'followers,' no longer making value judgments on any requests or opinions from her subordinates. For Hina Sorasaki, Gehenna is no longer a precious home. Disillusioned with politics, she has increasingly come to think that Hanuma Makoto's judgment of the Prefect Team was correct—a trash organization."
 GEH_hina_gehenna_hate_leader_desc: "If you were to ask Hina Sorasaki about the Greater Gehenna State, she would speak of Gehenna's greatness and the strong order of the fatherland in front of you, and then spit on the national flag the moment you leave. As Hina, and Hanuma Makoto—who possessed much 'wiser' judgment than the Prefect Team—judged, the Gehenna Prefect Team was an organization that should have been abolished.\n\nHer organization became no different from the extremists she sought to oppose, and a Gehenna controlled by 'order' became a horrific police state. Every time she looks at the scenery of Gehenna through the window, Hina feels that this place is a massive prison and a hell.\n\nAfter becoming the head of the Greater Gehenna State and the Chairperson of the Pandemonium Society, Hina's transformation into a 'symbolic head of state' has deepened. The Young Gehenna Party, a dictatorial party, holds all authority, and Hina watches the darkness of Gehenna, which she despises, wearing the shell of order and discipline to gradually expand their prison. But Hina, the puppet Chairperson, knows well that she no longer has the ability to stop this flow.\n\nIn one of Hina's hands is a capsule containing poison, and in the other is a pistol. She will one day escape from this hell. Even if the place she reaches beyond hell is nothing more than another hell."

 ## Prefect Council ##
 GEH_prefect_team_planning_department_generic_leader_desc: "As Hina Sorasaki and Ako Amau, the two central figures who led the Gehenna Prefect Team, resigned from the position of Head Prefect in succession, the Gehenna Prefect Team is experiencing a serious leadership crisis. Unlike Hina Sorasaki, who is missing, Ako Amau remains in the Prefect Team as Senior Administrator and is acting on behalf of some of the Head Prefect's duties. However, she has shown deep disillusionment with politics following the lesbian scandal and refuses to hold any political office other than her bureaucratic role.\n\nEventually, senior members of the Planning Department decided to exclude the Executive and Intelligence Departments—who participated in Ako's downfall—and continue governing the academy-state through a majority vote in the Council to fill the vacancy. Although Chinatsu Hinomiya's Medical Department gained qualification to participate in the Council, they are essentially just puppets following the decisions made by the Planning Department. Due to domestic politics being in chaos because of the vacant Head Prefect position and the continuous backlash from the Executive and Intelligence Departments, the Prefect Council is evaluated as having virtually no ability to properly govern the nation."

 ## Ako Amau ##
 GEH_ako_amau_bad_ending_leader_desc: "Hina Sorasaki's resignation brought great chaos to the Prefect Team. Various alternatives, including a collective leadership system, were proposed, but the Planning Department—the department with the most authority and power in the Prefect Team—argued that it was most rational for Senior Administrator Ako Amau to succeed the position of Head Prefect. Due to the influence of the Planning Department, Ako Amau was able to inherit power, but even after donning the Head Prefect's armband, Ako's heart is elsewhere.\n\nDespite everything that has happened, Ako Amau still has not abandoned hope that Hina Sorasaki will return. She is conducting search operations for Hina's return with great zeal, but the Planning and Intelligence Departments, who are political enemies of Ako, criticize the government, asking 'Wasn't the reason the Head Prefect left because of Ako Amau in the first place?' Ako's disillusionment with politics and hatred for the Prefect Team are growing, and it is uncertain how long she will perform the duties of Head Prefect.\n\nIn the first place, is there any reason for her to protect a Prefect Team where Hina Sorasaki does not exist?"
 GEH_ako_amau_nomal_route_bad_ending_leader_desc: "Hina Sorasaki's resignation brought great chaos to the Prefect Team. Various alternatives, including a collective leadership system, were proposed, but all departments argued that it was most rational for Senior Administrator Ako Amau to succeed the position of Head Prefect as the most neutral alternative. Through the support of various departments, Ako Amau was able to inherit power, but even after donning the Head Prefect's armband, Ako's heart is elsewhere.\n\nDespite everything that has happened, Ako Amau still has not abandoned hope that Hina Sorasaki will return. She is conducting search operations for Hina's return with great zeal, but no clues regarding Hina Sorasaki have been found. Perhaps Ako will have to continue protecting the Prefect Team without Hina. No matter how much it tortures her personally..."

 ## Iroha Natsume ##
 GEH_iroha_natsume_prefect_team_leader_desc: "After the resignations of Hina Sorasaki and Ako Amau, the Prefect Team was governed by a collective leadership system without a Head Prefect. However, internal opinions suggested it was inappropriate to leave the position vacant for too long, and after a long debate, Iroha Natsume—a bureaucrat from Pandemonium but classified as the 'safest' and least hostile person toward the Prefect Team—was appointed as the new Head Prefect through a majority vote of the Council.\n\nAs a typical bureaucrat, Iroha Natsume does not have any specific factionalism or political leanings and performs only a formal role in announcing the resolutions legislated by the Council. Iroha believes the rank of Head Prefect does not suit her and has no affection for the Prefect Team. However, as a colorless and odorless leader who is at least obedient before great power, she is the ideal figurehead and puppet leader desired by the members of the Prefect Team's Planning Department.\n\nSince Iroha Natsume has no intention of actually exercising power as Head Prefect, her governance of Gehenna is virtually identical to the ideology of the Planning Department that governs the Council. Due to Ako Amau's contempt and hostility toward the German locals, and the tendency of the Planning Department to support her ideology, the Iroha cabinet is expected to impose a fairly harsh police state system on the locals."

 ## Kayoko Onikata ##
 GEH_kayoko_onikata_prefect_team_leader_desc: "After the resignations of Hina Sorasaki and Ako Amau, the Prefect Team was governed by a collective leadership system without a Head Prefect. However, internal opinions suggested it was inappropriate to leave the position vacant for too long, and after a long debate, Kayoko—a brilliant strategist nominated by Senior Administrator Ako Amau—was appointed as the new Head Prefect through a majority vote of the Council.\n\nWhile Kayoko is not the 'puppet' style desired by the Prefect Council, she is someone who enjoys the trust of Senior Administrator Ako and is making efforts to actively participate in Council meetings, listen to the Planning Department's opinions, and discuss the direction of the Prefect Team. Initially, some Prefect Team members were dissatisfied with her 'non-obedient' nature, but due to Ako Amau's trust and her zeal for the Prefect Team, the Council gradually came to recognize that she is a Head Prefect qualified to lead the new Prefect Team.\n\nHaving guaranteed the autonomy of the Grand Duchy of Luxembourg and incorporated Problem Solver 68 as an official cooperative body of the Prefect Team, Kayoko is converging the opinions of her colleagues, including Aru Rikuhachima. Through the assistance of Senior Administrator Ako, she is striving to implement 'peaceful harmony between Kivotos-descents and locals' and a relatively moderate security policy that does not infringe on citizens' freedoms. Many people are hopeful that her moderate measures can alleviate the negative image of a 'police state' that the Prefect Team once held."

 ## Vacant (Collective Leadership) ##
 GEH_prefect_team_emergency_committee_leader_desc: "Following the resignation of Hina Sorasaki, the Prefect Team is operating under a collective leadership system with the Head Prefect position vacant. A new leader is scheduled to be elected through appropriate internal meetings, but the social and political chaos caused by the Head Prefect's disappearance seems unavoidable. Until now, Hina Sorasaki was effectively the pillar of the Prefect Team. Who will be the Atlas capable of supporting a Prefect Team whose pillar has vanished? And will she possess the qualifications to be the new Atlas of the Prefect Team? No one in the Prefect Team knows."

