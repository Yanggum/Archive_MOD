 NextPhase.0.t: "Opportunity"
 NextPhase.0.desc: "Despite the Prefect Head's warning, [GEM.GetName] is continuing negotiations with the Wehrmacht."
 NextPhase.0.a: ""
 NextPhase.0.b: "...I'll have to postpone the plan"

 NextPhase.1.t: "Scheduled Bloodshed"
 NextPhase.1.desc: "The Prefect Team, responsible for Gehenna's security and defense, has declared an arrest warrant for major Pandemonium Society executives.\nThis is Senior Administrator Amau Ako.\n\n\"The cause of this incident lies entirely with Pandemonium. We intend to investigate Chairman Hanuma Makoto's allegations of election fraud, continuous obstruction of Prefect Team duties, and negligent management.\"\n\nAdministrator Amau stated that Pandemonium's failure to stop checking the Prefect Team despite the national state of emergency is the biggest problem, promising to suppress Pandemonium and establish an interim committee under Prefect Team control to stabilize the nation.\nPursuant to Head Sorasaki Hina's ordinance, Prefect Team forces are currently gathering at Pandemonium HQ.\nAccording to field reports, the Prefect Riot Squad and Pandemonium's 1st Guard Panzer Division have begun engaging on the main street, and a curfew has been declared for residents in the area...."
 NextPhase.1.a: "Is it a coup, or a revolution?"

 NextPhase.2.t: "Victory of the Revolution"
 NextPhase.2.desc: "\"You knew it would turn out like this eventually.\"\n\nHina spoke as she looked down coldly at Chairman Hanuma Makoto, who was forced to kneel in her own office, glaring back at her.\nChairman Makoto said nothing.\nShe merely clenched her fists, unable to hide her rage toward Hina even in this humiliating situation.\n\nAfter the Chairman and representatives were transported to a safe house by Prefect members, Hina looked out the window in the empty Chairman's office.\nShe briefly showed a gentle smile toward Ibuki, who was waving at her while following the representatives, but now her face was submerged in the cold reality.\nAko, who had entered the office and was standing at a distance behind her, asked cautiously.\n\n\"So... what do you plan to do first?\"\n\nHina didn't answer immediately, seemingly lost in thought as she continued to look outside.\nThen, she eventually turned toward Ako and replied.\n\n\"....I'm not sure.\""
 NextPhase.2.a: "\"There's just too much to do.\""

 NextPhase.3.t: "Trinity Invasion!"
 NextPhase.3.desc: "While the Prefect Team was conducting rapid industrialization and military reform, Gehenna entered a state of war due to Trinity's sudden invasion. It is time to see if the industrialization and military reforms the Prefect Head has carried out so far have been properly implemented. If not, the Prefect Team and Gehenna will groan forever under the demons of Trinity.\n\nTrinity's soldiers are advancing toward Northern Gehenna. If we cannot defend Northern Gehenna from Trinity, we will not be able to protect Gehenna Academy.\n\nThe front lines are already seeing a succession of wounded soldiers. Gehenna's fate depends on you."
 NextPhase.3.a: "Resistance!"

 hina.1.t: "Opening of the 3rd Prefect General Assembly"
 hina.1.desc: "The Prefect Team, which had been active in the shadows obscured by Pandemonium's light, witnessed the corruption of Pandemonium as it stood by during the recent Kivotos political chaos and rose up in total revolt, unable to tolerate the injustice. Thus, the Prefect Team made a brilliant appearance on the stage of a chaotic Kivotos. The headquarters used by Pandemonium has now been perfectly remodeled into the Prefect Team's headquarters. As news of the 2nd Prefect General Assembly spread widely, many students became interested in the Prefect Team.\n\nIn the first assembly, the situation of Gehenna after the revolution and its future directions were presented, and the assembly proceeded smoothly. With various opinions gathered and garnering support, the assembly is moving forward in a positive atmosphere.\n\nPrefect Head Sorasaki Hina began her opening speech for the assembly with Prefect flags placed on both sides. The Head appealed for them to continue moving forward without losing the legitimacy of the revolution and to maintain a progressive stance. This atmosphere brought back the feeling of when they captured the central district and reclaimed the northern district, and the 3rd Prefect General Assembly officially began."
 hina.1C.desc: "With Prefect Head Sorasaki Hina gone and the threat of Pandemonium rising day by day, the Prefect Team, unable to watch any longer, finally rose up in total revolt against Pandemonium. Thus, the Prefect Team made a brilliant appearance on the stage of a chaotic Kivotos. The headquarters used by Pandemonium has now been perfectly remodeled into the Prefect Team's headquarters. As news of the 2nd Prefect General Assembly spread widely, many students became interested in the Prefect Team.\n\nIn the first assembly, the situation of Gehenna after the revolution and its future directions were presented, and the assembly proceeded smoothly. With various opinions gathered and garnering support, the assembly is moving forward in a positive atmosphere.\n\nWhile the Prefect Head's absence continued to be noticeable, several executives refreshed the atmosphere with speeches encouraging the current situation and a moment of silence for the vacant Head position, appealing that they must continue to improve themselves without losing the legitimacy of Gehenna Academy."
 hina.1.a: "Effort Revolution!"

 hina.2.t: "Closing"
 hina.2.desc: "After several weeks of careful consideration, the 3rd Prefect General Assembly has officially closed. Many things were decided, but many issues remain unresolved.\n\nAuthority for the Prefect Team's sub-departments has significantly increased. The Enforcement Bureau has become responsible for national defense, and the Planning Bureau handles the economy, giving roles to sub-departments. Though they may be inexperienced now, they will become more efficient as time passes.\n\n"
 hina.2.a: "Effort Revolution!"

 hina.3.t: "Heart of German Industry"
 hina.3.desc: "The Ruhr industrial region was once the center of German industry, but it lost its former prosperity after what the humans of this world call the Great War.\nThe victors plundered the losers to pursue their own rights, and the citizens of the Ruhr region suffered wounds that cannot be washed away.\n\nToday, Senior Administrator Amau submitted a development plan for Gehenna's sphere of influence through the reconstruction of the Ruhr industrial region to Prefect Head Sorasaki.\nAfter a long discussion, this plan was approved, and unlike the incomplete reconstruction of previous regimes, it is expected that this plan will lead the progress of the entire West German region. It will require massive manpower, budget, and significant time, but everyone is certain it will be worth it."
 hina.3.a: "The pulse beats once again."

 hina.4.t: "Opening of the 1st Prefect General Assembly"
 hina.4.desc: "The chaos of the new world has gradually settled, and its outline has begun to slowly emerge. In this critical time, Prefect Head Sorasaki Hina has urgently summoned all Prefect members. Responding to her call, Prefect members performing various duties, large and small, have gathered one by one.\n\nThe wide assembly hall was quickly filled with tension and expectation. As Prefect members of various backgrounds and abilities took their seats, there was a sense in the air that something important was about to happen.\n\nFinally, Sorasaki Hina ascended the podium with her closest associates. A resolute will was felt in her eyes, and her presence alone brought a sense of solemnity to the entire hall. Hina caught her breath for a moment and began her speech declaring the opening of the 1st Prefect General Assembly.\n\nHer speech revolved around three core themes: Loyalty, Unity, and Courage. Hina first emphasized the role and responsibility of the Prefect Team in the new world, stressing how important the loyalty of all members is. She then emphasized that solid unity among Prefect members is essential to overcome future challenges. Finally, Hina declared that the courage to fight unknown dangers would be our most powerful weapon.\n\nEach and every one of her words carried power and resonated in the hearts of the audience. When the speech reached its climax, the hall was filled with enthusiastic applause and cheers.\n\nAs the speech ended, the hall was once again filled with thunderous applause. Sorasaki Hina's charismatic leadership and vision made a deep impression on all Prefect members, igniting a new flame in their hearts.\n\nIn this atmosphere of heat and resolve, the 1st Prefect General Assembly officially began. All attendees sensed that this meeting was a historic moment signaling the start of a new era, and they were filled with expectation for the discussions to follow."
 hina.4.a: "Advance!"

 hina.5.desc: "After several days of careful consideration, the 1st Prefect General Assembly has closed. Problems regarding the Wehrmacht and the future were primarily discussed, but several parts remain unresolved.\n\nThe Prefect Team will soon begin operations to expel the Wehrmacht and will also need to monitor Pandemonium's activities. What Pandemonium does is not a major issue, but we must show that the Prefect Team will not tolerate them joining hands with enemies."

 hina.6.t: "Returned Stability"
 hina.6.desc: "By disarming the Wehrmacht remnants, we have escaped the threat. This is thanks to the Prefect Team's thorough operations and the efforts of its members. With the Wehrmacht neutralized, regions controlled by the Prefect Team are enjoying significant stability. However, we must not let our guard down. Just as remnants hid in the cities, we must prepare for potential threats. We will continue to gather information, train for threats, and cooperate with local residents. Using the current situation as a stepping stone to move toward the future will be our next task."
 hina.6.a: "$hina.4.a$"

 hina.7.t: "[GEM.Getname] Created a Federation with Germany!"
 hina.7.desc: "[GEM.Getname] has ignored [GEH.Getname]'s opinion and created a federation with German organizations, including the German Wehrmacht we were hostile toward! This is an act of betraying the legitimacy of Gehenna Academy!"
 hina.7.a: "We exist for Gehenna Academy and its students."

 hina.8.t: "After Toppling Pandemonium, What Next?"
 hina.8.desc: "The Enforcement Bureau had to be different from the Planning Bureau, which merely fumbled through files in an office. What was needed for Gehenna's order was not complex, meaningless bureaucratic reorganization and number-crunching, but encouraging those on the front lines. Under Iori's leadership, all capabilities of the Gehenna Prefect Team were focused on collapsing the Pandemonium Society and their incompetent government. The Prefect Team must replace Pandemonium. Once Pandemonium falls and the Prefect Team gains power, everything will go well.\n\n\"And... we won. We actually won.\"\n\nIn Gehenna Central District, while stepping on the ruins of a destroyed Toramaru tank, Iori felt a strange sense of unease rather than victory. Until now, we had encouraged frontline soldiers and rear-line workers with propaganda that everything would be fine once we toppled Pandemonium. The reason soldiers' treatment was poor was because of Pandemonium. Factory sabotage was a plot by Pandemonium. Rising prices were due to Pandemonium Intelligence operations. But now, Pandemonium could no longer be used as an excuse.\n\nIori looked down at her gun atop the Toramaru. The war with Pandemonium was over. Now was the time to raise Gehenna's quality of life through the power of real documents and contracts. But... no one in the Enforcement Bureau had the ability to do that. Iori and other key figures in the Enforcement Bureau were only used to firing guns and encouraging subordinates through propaganda.\n\n\"Propaganda. Right, we don't have to end the propaganda yet, do we?\"\n\nThe reason we are suffering, and the reason life hasn't changed even after the war, is because 'remnants' of Pandemonium still remain. Amidst her anxiety, Iori quickly thought of a plan for new propaganda."
 hina.8.a: "Because I have no other alternative but this...."

 hina.9.t: "Propaganda Until When?"
 hina.9.desc: "\"I don't know what the Enforcement Bureau is thinking. Suppressing dissatisfaction forever with propaganda and agitation? Do they think they're some kind of Red Winter Labor Bureau?\"\n\nAmau Ako muttered cynically as she sat in her Senior Administrator's chair, leafing through the new 'Weekly Pandemonium' newspaper controlled by the Enforcement Bureau. The reason the wartime economy isn't resolving even after the previous Pandemonium government collapsed is that old Pandemonium guerrillas remain. The incident where a giant Fan-chan appeared in the Gehenna Central District and seriously injured three Germans was also due to sabotage by old Pandemonium guerrillas. The constantly rising prices are also because old Pandemonium guerrillas are operating in the shadows.\n\n'Hah, why don't they just write that the defeated Pandemonium is ruling the world? It seems Hanuma Makoto's world conquest plan succeeded without me knowing.'\n\nAko chuckled and turned her gaze past the window of the Prefect headquarters. The Enforcement Bureau's propaganda might have worked well while Pandemonium was still alive. But how long do they think Pandemonium propaganda will work on the public? She could see a crowd of protesters shouting and scuffling with Prefect members outside the headquarters.\n\nThere were still people who believed the 'shadowy Pandemonium remnants' agitation, but dissenters were appearing one by one. That alone meant the propaganda's effectiveness was already fading. How long could Iori use the dead Pandemonium for her agitation? Ako closed the curtains in her office."
 hina.9.a: "Propaganda that can't convince others is just meaningless self-consolation."

## 3rd Assembly ##
 hina_assembly.1.t: "Authority of the Enforcement Bureau?"
 hina_assembly.1.desc: "The Enforcement Bureau was responsible for force within the Prefect Team, but through the last war, it became responsible for Gehenna's national defense. However, there isn't only good news. The Enforcement Bureau showed major flaws in the last war, and the need for reform was strongly felt. In particular, voices calling for a change into a small, elite military group and those calling for strong military power based on lessons from the revolutionary war are sharply clashing.\n\nHowever, on one side, voices of concern are growing. As the Enforcement Bureau's authority increases, several people have appeared worrying about military factions. While Sorasaki Hina is Prefect Head, it will be safe, but if someone else takes the Prefect Head position, conflict with the Enforcement Bureau will be inevitable."
 hina_assembly.1.a: "I get it, so everyone calm down!"

 hina_assembly.2.t: "Planning Bureau and Pandemonium"
 hina_assembly.2.desc: "The Planning Bureau is a massive bureaucratic organization managing Gehenna as a whole. It has been granted significant autonomy, helping with paperwork within the Prefect Team or handling tasks independently.\n\nWhile the Prefect Team was toppling Pandemonium and restoring administration through the revolutionary war, huge problems were discovered. We realized Pandemonium's administration was corrupt and functioned with terrible inefficiency. It may take quite some time to process Pandemonium's administration."
 hina_assembly.2.a: "The Planning Bureau Chief should be able to solve it herself."

 hina_assembly.3.t: "Medical Bureau?"
 hina_assembly.3.desc: "The Medical Bureau has been active behind the scenes of the revolutionary war for others. In particular, the scenes of relief activities centered on Chinatsu attracted great interest from Gehenna students and were recognized for their contributions.\n\nHowever, voices of opposition are appearing regarding their reorganization into a new organization. Special care will be needed if they are not to be reorganized into another department."
 hina_assembly.3.a: "They will be able to prove themselves."

## 1st Assembly ##
 hina_assembly.4.t: "Handling the Situation"
 hina_assembly.4.desc: "About 50 days have passed since the incident. Under the Prefect Head's strong leadership and strategic decisiveness, the Gehenna Prefect Team settled into stability faster than expected, and Wehrmacht forces have reached a state of near-annihilation, at least in areas where the Prefect Team's rule reaches. Prefect members are now carrying out relief activities and reconstruction efforts for civilians affected by combat and chaos.\n\nHowever, some argue that civilians are also uncertain entities who could join hands with Wehrmacht remnants at any time, and that we must not lower our guard. They strongly insist on limiting relief activities to a minimum and stockpiling the Prefect Team's military power and resources. These hardline arguments became a hot potato within the Prefect Team in an instant, presenting many Prefect members with ethical dilemmas and strategic concerns.\n\nIf we actively help civilians, the Prefect Team may gain public support and legitimacy, but pouring too many resources into support could weaken the Prefect Team's power in the long run. There are concerns this could lower the ability to prepare for future threats. The Prefect Team now faces the task of finding a delicate balance between short-term humanitarian needs and long-term security maintenance."
 hina_assembly.4.a: "We must balance the two."

 hina_assembly.5.t: "Was the Wehrmacht Annihilated?"
 hina_assembly.5.desc: "After desperate efforts by the Prefect Team, a report was received that Wehrmacht forces suffered near-annihilating damage. However, this is only the surface situation; the reality is still uncertain. Everyone, even the Prefect Head, senses that the Wehrmacht has not been completely destroyed.\n\nThe Intelligence Bureau revealed information gathered at the recent assembly. Remnants of the Wehrmacht are hiding in two major cities, barely surviving with the tacit support of local residents. This information immediately caused tension in the assembly.\n\nThe Wehrmacht still poses a serious threat to the Prefect Team. Their guerrilla tactics and ability to hide in cities are problems that cannot be easily suppressed with the Prefect Team's traditional military power. Furthermore, the Wehrmacht still receives support from some citizens, making it a political and ideological challenge beyond a simple military threat.\n\nThe Prefect Team has already suffered numerous casualties in battles with the Wehrmacht. The loss of experienced agents means more than just a number. The experience, skill, and camaraderie each agent possessed were precious assets that cannot be easily replaced. These losses significantly impacted not only the Prefect Team's combat power but also the organization's morale.\n\nThe reaction of Prefect members to the news that the Wehrmacht was found in cities was complex. Some showed anger and resolve, but the majority felt deep fatigue and anxiety. Many felt psychological pressure at the fact they had to bleed again to root out the enemy. Some Prefect members even expressed futility and frustration over the endless fighting.\n\nBut this time is different. We have learned valuable lessons through past bitter experiences and are researching new tactics to counter the Wehrmacht. Efforts are being made, such as creating units specialized in urban combat and civil relations improvement, and strengthening information networks. Cautious optimism is spreading among Prefect members. Though they acknowledge it will be a hard fight, confidence is slowly taking root that they won't be helplessly victimized as before."
 hina_assembly.5.a: "Let them come!"

 hina_assembly.6.t: "The Missing General Student Council President"
 hina_assembly.6.desc: "The sudden disappearance of the General Student Council President has thrown all of Kivotos into chaos. This goes beyond a simple absence of a leader, causing political instability and uncertainty about Kivotos' future.\n\nParticularly concerning is the fact that the General Student Council President was the key figure driving the \"Eden Treaty,\" a historic peace and friendship treaty between Trinity and Gehenna. Due to his disappearance, efforts to alleviate the tense relationship between the two camps have met a major crisis.\n\nTe fate of the Eden Treaty has now become uncertain. In the worst case, there are concerns the treaty could be completely discarded. While some argue for a temporary halt to negotiations until a new leadership is established, others are moving to use this opportunity to nullify the treaty itself.\n\nTrinity's response in this situation is expected to play a decisive role. If Trinity maintains a cooperative stance and shows a willingness to proceed with the treaty, the Eden Treaty may maintain its existence even amidst difficulties. On the other hand, if Trinity uses this as an opportunity to take a hardline stance or present additional demands, the treaty could be at risk of being completely scuttled."
 hina_assembly.6.a: "Let's hope they act rationally."

 hina_assembly.7.t: "Pandemonium's Movements?"
 hina_assembly.7.desc: "The Pandemonium Society, also known as Pandemonium, is a core institution of Gehenna Academy and currently faces a major crisis that could threaten the existence of the Academy. This crisis is taking on a complex form that goes beyond simple internal problems, potentially deciding the future of the Academy itself.\n\nThe remaining influence of the Wehrmacht forces is still a big problem. The not-fully-eliminated Wehrmacht remains latent like a shadow throughout the Academy, looking for an opportunity to counterattack at any time. This continues to threaten Pandemonium's authority and control. Also, the relationship between Pandemonium and the German state governments is unstable. Contrary to what Pandemonium expected, the state governments are not showing perfect cooperation. This is a major obstacle to maintaining the Academy's autonomy and independence, increasing the possibility of external intervention. \n\nEven within Gehenna, control is not easy. In particular, the independent actions of the Gourmet Research Society and the Hot Springs Development Department are challenging Pandemonium's authority. These two clubs ignore or do not follow Pandemonium's demands, acting according to their own will, which is a serious challenge to Pandemonium's control. \n\nMost shocking is a chilling rumor spreading within the Prefect Team. It is that Pandemonium is currently preparing secret negotiations with the German Wehrmacht. If this rumor is true, the result could seriously threaten the Prefect Team's status. If Pandemonium proceeds with independent negotiations with the Wehrmacht while excluding the Prefect Team, this will be a major event that could completely shake the power structure within Gehenna Academy. From the Prefect Team's perspective, they could face a situation where their influence and value of existence are fundamentally challenged."
 hina_assembly.7.a: "It's unpredictable."

