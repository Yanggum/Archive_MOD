 # 프롤로그
 GEH_start_focus: "철인의 길"
 GEH_start_focus_desc: "결국, 선도부는 해당 사태에 대비해야 합니다. 아니, 소라사키 히나는 해당 사태를 책임지고 수습해야만 합니다. 그렇지 않다면, 소라사키 히나와 그를 믿고 따르는 수많은 게헨나의 학생들의 이상과 선도부 임원들의 운명을 꺾어버리는 것일 뿐입니다. 그러기에 소라사키 히나는 밖으로 나와야만 합니다."

 GEH_zero_congress_focus: "제1차 선도부 총회"
 GEH_zero_congress_focus_desc: "사태가 어느정도 진정되고 노력끝에 일상을 되찾아가고 있습니다. 선도부원들은 우리의 미래를 정하기 위해 총회를 개최하고 향후 계획을 세워야 한다고 목소리를 높히고 있습니다."

 GEH_Nuremberg_Wehrmacht: "뉘른베르크 수색"
 GEH_Nuremberg_Wehrmacht_desc: "나치 잔당과 국방군과 협력하려는 마음이 가득한 만마전의 너구리들과는 달리, 선도부는 도덕적 무결성을 위해 국가사회주의자들과 일절의 협력도 하지 않을 것입니다. 정보부의 정보에 의하면 뉘른베르크에 국방군 잔당의 지하 조직이 비밀리에 활동하고 있다고 합니다. 시가전을 하는 한이 있더라도 그들은 모두 제거되어야 합니다."

 GEH_Regensburg_Wehrmacht: "레겐스부르크 수색"
 GEH_Regensburg_Wehrmacht_desc: "나치 잔당과 국방군과 협력하려는 마음이 가득한 만마전의 너구리들과는 달리, 선도부는 도덕적 무결성을 위해 국가사회주의자들과 일절의 협력도 하지 않을 것입니다. 정보부의 정보에 의하면 레겐스부르크에 국방군 잔당의 지하 조직이 비밀리에 활동하고 있다고 합니다. 시가전을 하는 한이 있더라도 그들은 모두 제거되어야 합니다."

 GEH_focus_111111: "되찾은 안정"
 GEH_focus_111111_desc: "나치들과 결코 협력은 없을 것입니다. 게헨나 선도부는 전통적 질서와 도덕을 위해 싸울 것이며, 아돌프 히틀러에게 충성했던 조직화된 국방군을 철저하게 짓밟았습니다. 국방군 잔당들을 모조리 무장 해제함으로써 우리는 국내에서의 가장 큰 안보 문제를 해결했습니다. 점조직으로 움직이는 나치 당원 게릴라들과 헬멧단원들 문제는 국방군만큼 중대한 위협은 아닙니다."

 # 챕터 : 1
 GEH_Prefect_Team_muster: "선도부 소집"
 GEH_Prefect_Team_muster_desc: "대전이 이후 2개월여간의 혼란 속에서, 많은 선도부원들이 질서 유지와 게헨나 수호라는 정의로운 명분을 버리고 도주를 선택했습니다. 하지만 비관주의자들의 생각과 달리 우리는 질서 있게 지난 두 달을 견뎌내었으며, 제1차 총회에 맞춰 흔들렸던 선도부 부서들도 다시 조직화되며 규율을 되찾기 시작했습니다."

 GEH_focus_can_only_be_completed_by_focus_tt: "이 중점은 §Y$FOCUS$§! 중점이 진행되는 도중 자동으로 시작될 수 있습니다."
 
 GEH_rework_focus_1: "기획부"
 GEH_rework_focus_1_desc: "아마우 아코가 이끄는 기획부는 선도부의 행정과 전략 수립을 담당하는 핵심 부서입니다. 이들은 뛰어난 서류 작업 능력을 바탕으로 선도부의 운영을 체계화하고, 다양한 작전과 정책을 수립하여 선도부의 효율적인 운영을 지원합니다."

 GEH_rework_focus_2: "의료부"
 GEH_rework_focus_2_desc: "히노미야 치나츠가 이끄는 의료부는 선도부의 의료 지원을 담당하는 중요한 부서로, 전투 인원의 치료와 건강 관리를 전문적으로 수행합니다. 의료부는 기획부와 실행부 두 부서에 비해 정치적 입지가 약하기 때문에, 단독으로 권력을 쥘 가능성은 없습니다."

 GEH_rework_focus_3: "실행부"
 GEH_rework_focus_3_desc: "시로미 이오리가 지휘하는 실행부는 선도부의 군사력을 관리하고 전투 훈련을 담당하는 핵심 부서입니다. 이들은 엄격한 훈련 프로그램을 통해 선도부원들의 전투 능력을 향상시키고, 필요시 신속하고 효과적인 군사 작전을 수행하여 선도부의 안전과 목표 달성을 보장합니다."

 GEH_fear_eyes: "풍기집행"
 GEH_fear_eyes_desc: "만마전이 우리를 적대시함은 확실해졌습니다.\n이렇게 된 이상 게헨나의 가장 문젯거리였던 만마전에게 \"풍기집행\"을 할 때가 되었습니다."

 GEH_fear_eyes_tt: "우리는 $GEH_operation_countenance$ 시작과 동시에 [GEM.GetNameDef]에 선전포고하기 전까지 §Y30일§! 동안 준비할 수 있을 것입니다. \n$GEH_fear_eyes_mission_tt$\n"
 GEH_fear_eyes_mission_tt: "§Y$GEH_operation_countenance$§! 임무가 활성화되면 [GetOperationCountenanceTooltip] 부대가 [GEM.GetNameDef]측을 항복시키기까지 §Y60 일§!을 갖게 됩니다. 만약 이 기한이 지날 경우 그들은 다른 세력에 가담하려고 시도할 것이고, 우리 국민들은 우리의 군사력에 대해 걱정하기 시작할 것입니다."

 GEH_shocked_by_surprise_attack: "기습 공격에 놀람"
 GEH_shocked_by_surprise_attack_desc: "우리에 대항한 선도부의 전략, 풍기집행은 우리 만마전 전체를 충격에 빠지게 하였습니다. 우리 군은 압도되었고, 우리 연락망은 단절되었으며, 상대 측 책임자들을 불러 해명을 요구하는 것도 의미 없다는 것을 알았습니다. 우리 측이 이 사태를 파악하려는 동안, 우리의 외교 관계는 무력화 될 것입니다."

 GEH_preparations_for_operation_countenance: "풍기집행 준비"
 GEH_operation_countenance: "풍기집행"
 GEH_external_activities: "선도부의 대외 활동"
 GEH_external_activities_desc: "게헨나 선도부는 대전이 이전 게헨나 학원이라는 거대 학원의 사법 집행 기관이었습니다. 그러나 대전이 이후 각지의 수많은 분쟁을 해결하며 만마전과의 의견 불일치로 점차 분리되었고, 이내 게헨나 선도부는 독립적인 군벌 집단을 형성하기에 이르렀습니다. 그러기에 게헨나 선도부의 외교 활동은 게헨나 학원을 평정하고 단일 학원을 수립하는 것에 있습니다."

 GEH_second_congress_focus: "제2차 선도부 총회"
 GEH_second_congress_focus_desc: "제1차 선도부 총회에서 결정된 정치적 방향을 이제 제2차 총회에서 본격적으로 논의하고 작성하여야 합니다."
 GEM_Start_nego_tt: "@GEM§Y[GEM.GetAdjective]§!(이)가 @GEA§Y[GEA.GetName]§!(과)와 협상 중임"

 GEH_stabilization_of_gehenna_nation: "게헨나 국가 안정화"
 GEH_stabilization_of_gehenna_nation_desc: "우리는 게헨나 전체를 대표하는 치안기관이며, 우리의 치안 활동은 만마전이 존재하는지 여부를 따지지 않고 게헨나 전체 영토에 이루어집니다. 우리가 하지 않는다면 누가 이 일을 하겠습니까?"

 GEH_cooperation_with_pandemonium: "만마전과 협력"
 GEH_cooperation_with_pandemonium_desc: "만마전에게도 치안을 유지하고자 하는 최소한의 의지는 있습니다. 물론 [GEM.GetLeader]가 그럴 수 있는 능력이 있을 것이라 생각하지는 않지만요. 우리가 그들과 협력한다면 더 많은 일을 해낼 수 있을 것입니다."

 GEH_instigating_confusion_in_pandemonium: "만마전 혼란 조장"
 GEH_instigating_confusion_in_pandemonium_desc: "우리는 게헨나 전체를 대표하는 치안기관이며, 이는 우리가 의도적인 사보타주를 조장한다면 만마전의 치안 능력에 혼란을 조장하고 게헨나 시민들이 만마전에 대한 더 큰 불만을 갖게 할 수 있다는 뜻이기도 합니다. 정의감을 가진 선도부원들은 이 소식을 불편하게 생각할지도 모르지만요."

 GEH_additional_leadership_personnel_employment: "추가적인 선도부원 모집"
 GEH_additional_leadership_personnel_employment_desc: "행정 인력 부족이 확인된 지난 총회 이후, 게헨나 선도부의 행정 부담은 지속되어 왔습니다. 우리는 이제 이 문제를 해결하기 위한 다양한 모집 방안을 추구해야 합니다."

 GEH_establishment_of_german_autonomous_government: "독일 자치정부 수립"
 GEH_establishment_of_german_autonomous_government_desc: "독일 민족의 자치 정부 위원회, 약칭 독일 자치정부는 우리가 독일인들을 행정부로 등용하기 시작하면서 추진되기 시작한 독일 주 정부를 우리 아래에 통합하기 위한 기관입니다."

 GEH_establishment_of_german_militia: "독일인 민병대"
 GEH_establishment_of_german_militia_desc: "강제로 해산된 국방군, 또는 탈영병, 그 외 수많은 좌우를 가리지 않는 전 민병대원들까지. 이들을 동원한다면 간편하게 선도부의 인력을 확충할 수 있을 것입니다."

 ## 이오리 루트 ##
 GEH_iori_route_focus: "시로미 이오리의 중점"
 GEH_preparation_of_war_with_pantemonium: "[GEM.GetAdjective] 측과의 전쟁 준비"
 GEH_indiscriminate_conscription: "무차별 징병제 도입"
 GEH_propaganda_spread: "프로파간다 살포"
 GEH_expulsion_of_pandemonium: "판데모니엄 축출"
 GEH_systemic_militarization: "체제적 군사화"
 GEH_injecting_hostility: "적대감 주입"
 GEH_leadership_of_the_executive_branch: "실행부의 지도"
 GEH_war_department: "전쟁부 통합 초안"
 GEH_military_leadership_committee: "군사선도위원회"

 GEH_iori_route_focus_desc: "시로미 이오리는 이전 총회에서 자신의 능력을 입증하였고, 이내 만마전을 향한 공격이라는 거대한 테제 아래에 움직이는 선도부의 방향을 결정했습니다."
 GEH_preparation_of_war_with_pantemonium_desc: "[GEM.GetAdjective] 측은 우리 선도부를 향한 적대 행위를 대전이 이전부터 이어오고 있으며, 대전이 이후로는 공식적으로 우리를 향한 적대를 서슴지 않고 있습니다. 이들을 완전히 파멸시키지 않고서는 선도부에 미래란 존재하지 않습니다!"
 GEH_indiscriminate_conscription_desc: "만마전을 향한 거대한 투쟁을 위해서는 수많은 병력의 동원이 필요합니다. 학생과 독일인들을 가리지 않고 향후 벌어질 진격에 동원하기 위해 광범위한 동원 절차가 마련될 것입니다."
 GEH_propaganda_spread_desc: "[GEM.GetAdjective]의 지배 하에 있는 지역에 선도부를 향한 선전물을 배부하는 것은 만마전의 추악한 이상을 공개하고 선도부를 향한 지지를 끌어올릴 수 있을 것입니다. 적어도, 당분간은요. 우리의 명분과 이상을 져버릴지라도, 만마전을 향한 네거티브 정치 공작과 반만마전 포퓰리즘은 지속되어야 합니다."
 GEH_expulsion_of_pandemonium_desc: "이제 때가 되었습니다! 신속하고 빠르게 선도부의 군은 [GEM.GetAdjective]의 지배 영토로 향할 것입니다. 원한의 고리를 끊어내고 선도부의 항구적 평화를 만들어 내어야만 합니다."
 GEH_systemic_militarization_desc: "실행부는 선도부의 광범위한 무력행사를 담당하는 기관이며, 실행부의 지배적 권한을 정립하기 위해서는 다양한 군사적 체제가 도입되어야만 합니다."
 GEH_injecting_hostility_desc: "만마전을 향한 적대적 선전 교육을 의무화하여 우리의 낮은 지지율로 인한 학생들의 전쟁 동원 거부를 해결할 것입니다."
 GEH_leadership_of_the_executive_branch_desc: "언제까지 소라사키 히나의 책임을 가중하며 모든 군사작전을 직접 감독하에 진행할 수는 없습니다. 소라사키 히나의 개인에 가중되는 책임을 실행부에 양도할 것입니다. 이제는 선도부장이 아닌 선도부가 강조되어야 합니다."
 GEH_war_department_desc: "선도부는 이제 광범위한 전쟁을 준비해야 하며, 이러한 행동을 돕기 위해 실행부와 비슷한 역할을 하지만 조금 더 실험적이고 대비적인 핵심 인물들을 모은 전쟁부를 신설할 것입니다."
 GEH_military_leadership_committee_desc: "선도부의 통치는 선도부원이 선행되어야 합니다. 군사적 영광과 교리의 정립이 선도부의 존재 이유이자 선도부 이데올로기의 근간입니다. 기획된 전쟁부는 이제 공식적으로 부의 일부로 편입될 것이며, 게헨나 학원의 구국적 안정과 광역적인 통제를 위한 첫 걸음이 될 것입니다."

 ## 히나 루트 ##
 GEH_hina_route_focus: "소라사키 히나의 영도"
 GEH_one_person_leadership_system: "일인 지도 체제"
 GEH_firm_leadership: "확고한 지도력"
 GEH_gehenna_leader: "게헨나의 지도자"
 GEH_gehenna_leader_tt: "§R이제 소라사키 히나는 어떤 일이 있더라도 무너지지 않을 것입니다. 그녀의 결심이니까요.§!"
 GEH_distribution_of_propaganda_materials_in_gehenna: "게헨나 내 선전물 배부"
 GEH_distribution_of_propaganda_materials_in_gehenna_tt: "점령법 해금: §Y게헨나 통일 지배§!."
 GEH_national_unity: "국가적 단결"
 GEH_student_peoples_will: "학생 인민의 의지"
 GEH_distinction_of_zealous_members: "열성부원 구분"
 GEH_sorasaki_hina_quotes_compilation: "소라사키 히나 어록 편찬"
 GEH_prefect_team_fanaticism: "선도부의 광신"

 GEH_hina_route_focus_desc: "소라사키 히나의 가중된 책임이 불러온 편집증적인 현상 유지 정책이 결국 선도부원 전체의 열성적인 지지로 끝을 맺었습니다. 소라사키 히나 본인도, 선도부 임원 그 누구도 바라지 않던 일이나. 이제는 시작해야 합니다."
 GEH_one_person_leadership_system_desc: "선도부는 언제나 소라사키 히나의 최종 검수 하에 운영됩니다. 이는 강력한 정치적 카리스마를 제공하며, 소라사키 히나의 정책에 대한 반발을 크게 줄일 것입니다."
 GEH_firm_leadership_desc: "\"소라사키 히나 선도부장님의 영도를 따르지 않는 독일 나치스트들의 산업을 모조리 몰수하여야 한다! 모든 산업을 선도부에게!\" - 소라사키 히나 선전물 (중)"
 GEH_gehenna_leader_desc: "소라사키 히나는 광신적인 선도부원들의 열성을 위해서라도, 물러설 수 없습니다. 이제 소라사키 히나는 모든 수단을 동원하여 무거운 자리에 올라설 것입니다. 소라사키 각하시여. 이제 선도부의 첫 번째 전제 사항이 되신 것을 환영합니다."
 GEH_distribution_of_propaganda_materials_in_gehenna_desc: "소라사키 히나 선도부장님의 위대함을 게헨나 전체에 알린다면 소라사키 히나 선도부장님 또한 좋아하실 것이 분명합니다. 이 훌륭한 계몽 작업이 즉시 진행되어야 합니다."
 GEH_national_unity_desc: "게헨나 전체는 소라사키 히나 선도부장님의 영도 아래에 통합되어야만 합니다. 이는 모든 선도부원의 의지이자 게헨나의 미래입니다."
 GEH_student_peoples_will_desc: "광신적인 열성을 모두 학생과 선도부원 그리고 충성스러운 독일인들에게 돌린다면 잠깐은 이 열성에서 벗어날 수 있을지 모릅니다. 어쩌면 앞으로도 말이죠."
 GEH_distinction_of_zealous_members_desc: "선도부장님을 향해 충성하는 선도부원들이 구분되어야 합니다. 이는 충성적이지 않은 선도부원들을 한직으로 쫓아내는 것으로 시작될 것입니다."
 GEH_sorasaki_hina_quotes_compilation_desc: "\"게헨나의 모두가 알 수 있도록 소라사키 히나 선도부장 님의 위대한 어록을 편찬한 책\" - 소라사키 히나 어록 설명"
 GEH_prefect_team_fanaticism_desc: "선도부장님이야말로 이 선도부를 구원할 아주 강인한 초인이 분명합니다. 우리는 선도부장님을 더 강력하게 받들고 충성해야 합니다. 그 어떤 존재도 선도부장님의 권위에 도전하지 못하도록 말이죠!"

 ## 아코 루트 ##
 GEH_ako_route_focus: "아마우 아코의 계획"
 GEH_ako_route_focus_desc: "\"다들 솔직해져보자고요. 대전이 이후 히나 부장님이 얼마나 많은 업무로 무리하고 있는지 알고 있잖아요? 그저 그 주제를 꺼내면 부장님의 업무를 나눠받을까 무서워서 입을 다물고 있는 거 뿐이죠. 지금 우리가 부장님을 도와야 해요. 이러다가 히나 부장님이 쓰러지시기라도 하면 책임 지실 거예요?\""

 GEH_deterioration_of_manmajeon_authority: "만마전 폄훼"
 GEH_deterioration_of_manmajeon_authority_desc: "\"저는 대전이가 하누마 마코토, 그 너구리에 의해 일어났다고 생각했어요. 네, 뭐. 결국 아무런 물증도 없었지만요. 중요한 건 적어도 만마전이란 너구리굴이 대전이를 이용하고 있다는 점이예요. 나치 국방군과 협력하고, 게헨나 학생들을 파시스트 어른들에게 팔아넘기려 한다고요! 국방군과 어떠한 협력도 하지 않는 우리 선도부가, 만마전보다도 게헨나를 위하는 조직이라는 것을 홍보할 필요가 있어요.\""

 GEH_abolition_of_authority: "권위 해지"
 GEH_abolition_of_authority_desc: "\"히나 부장님이 훌륭한 분이 아니라는 뜻이 아니예요! 그저 부장님이 우리의 *모든* 일을 대신하는 초인이 아니라는 건 인정해야 한다는 점이죠. 히나 부장님과 직접 만나서, 선임행정관인 저와 기획부가 부장님의 국가 운영 업무 일부를 대신 처리할 수 있도록 협의할 생각이예요.\""

 GEH_prefect_team_democracy: "선도부 민주주의"
 GEH_prefect_team_democracy_desc: "선도부는 군사 조직이라는 특성 때문에 '군벌'이라는 부정적인 대외적 이미지를 갖고 있었습니다. 이를 해결하기 위해서는 적어도 선도부가 민주적, 탈권위주의적인 조직으로 보이게 할 필요가 있습니다. 중무장한 실행부의 대민활동을 축소하고, 아마우 아코를 대표로 한 관료들이 대민 활동에 앞설 것입니다."

 GEH_relaxation_of_german_peoples: "독일 민중 진정"
 GEH_relaxation_of_german_peoples_desc: "선도부는, 정확히는 아마우 아코는 소위 도이칠란트의 '어른들'을 믿지 않습니다. 하지만 아코는 자신의 현지인 혐오를 눌러두고서라도, 직접 지역 언론 앞에 나서서 도이칠란트인들이 우려하는 '룩셈부르크 학살' 같은 일이 선도부 내에서 결코 일어나지 않을 거라는 점, 그리고 도이치가 결코 게헨나의 '노예' 계층이 되는 일이 없을 거라는 점을 확신시킬 것입니다."

 GEH_system_propaganda: "체제 선전"
 GEH_system_propaganda_desc: "보수적인 현지 도이치인들이 새로운 여성 지도자를 썩 반기지 않는다는 것은 분명합니다. 아코는 현지인들에게 '위대한 지도자 [GEH.GetLeader]'가 아닌, '위대한 조직 선도부'를 선전하는 것이 현지인들의 반감을 줄여 나갈 더 좋은 방법이라고 생각합니다. 선도부 경찰국가 체제에 대한 지지가 상승한다면 자연스럽게 선도부장에 대한 반감도 감소할 것입니다."

 GEH_heroism_propaganda: "선도부 영웅주의"
 GEH_heroism_propaganda_desc: "아코 선임행정관과 기획부의 개혁은 철저하게 실행부나 정보부의 권한을 축소하고, 선도부를 단순한 군벌에서 근대적 관료 국가로 개혁하려는 것에 집중되어 있습니다. 물론 이는 선도부장의 업무를 여러 관료들이 나누어서 업무 과다를 줄이기 위한 일이지만, 점점 커져가는 실행부, 정보부의 분노를 가라앉히기 위해 군 조직에 최소한의 보상과 영웅주의 프로파간다를 섞어 줄 필요가 있습니다."

 GEH_sword_defending_gehenna_peoples: "민중을 수호하는 검"
 GEH_sword_defending_gehenna_peoples_desc: "아코 선임행정관은 선도부를 단순한 군벌에서 개혁된 관료제 학원국가로 만들었으며, 게헨나 학생들과 도이치 현지인들의 지지를 이끌어냈습니다. 과로로 시달리던 히나의 부담을 축소한 것 역시 큰 성과이고요. 물론 가장 중대한 성과는 우리의 노력으로 인해 국민들이 우리를 '군벌'이 아닌 '사회의 수호자'로 보기 시작했다는 점입니다."

 ## 노멀 루트 ##
 GEH_main_route_focus: "선도부의 통치"
 GEH_main_route_focus_desc: "군국주의 체제를 원하던 선도부 실행부의 강경한 주장과, 선도부 기획부를 구성하는 기술관료들의 온건한 주장은 끊임 없는 평행선을 이루었습니다. 결국 [GEH.GetLeader]의 결정으로 인해 '현상유지'라는 결정이 내려졌지만... 대전이라는 미증유의 사건 속에서 현상유지가 정말 옳은 선택일까요?"

 GEH_fortress_preparing_for_war: "대트리니티 요새"
 GEH_fortress_preparing_for_war_desc: "우리의 가장 위협적인 적은 만마전일까요, 아니면 트리니티일까요? 아마 둘 다 위협적인 적이겠지만, 만마전과의 국경을 요새화하는 것보다는 트리니티와의 국경을 요새화하는 것이 훨씬 정치적인 부담이 적습니다. 새로운 요새는 완벽하지는 않지만, 적어도 전쟁이 발발하면 짧은 시간 트리니티의 공격을 저지해 줄 것입니다."

 GEH_continuing_rule: "내부 갈등 조화"
 GEH_continuing_rule_desc: "실행부와 기획부 두 조직의 충돌로 인해 일어난 현상유지 정책과 그로 인한 개혁의 좌절은 심각한 정치적 갈등을 만들었습니다. 선도부장은 개혁의 실패가 두 부서의 잘못이 아닌 자신의 지도력이 부족했기 때문에 일어난 일이라고 인정하고, 부서들간의 대립과 내부 파벌 싸움을 중재할 것입니다."

 GEH_improving_relationships_with_manmajeon: "만마전과의 관계 개선"
 GEH_improving_relationships_with_manmajeon_desc: "아코는 '그들과의 관계 개선에는 1 키보토스 엔을 쓰는 것도 아깝다'며 관계 개선안을 냉소적으로 바라보고 있지만, 정보부는 대전이 이후 만마전이 선도부보다 훨씬 강력한 국력을 갖게 되었다는 점을 우려스럽게 생각합니다. 우리가 지금 게헨나 중앙구로 전차를 밀고 들어갈 능력이 없다면, 전쟁을 미루는 것이 훨씬 낫습니다."

 GEH_pursuing_peaceful_unification: "평화적인 통합 추구"
 GEH_pursuing_peaceful_unification_desc: "만마전이 마음에 들지 않는 것은 사실이지만, 트리니티를 비롯한 외부의 위협에 맞서기 위해서는 그들과 협력할 필요가 있습니다. 대전이라는 매우 특수한 상황을 감안할 때, 만마전도 지금만은 우리와 협력하는 것을 진지하게 고려할 것입니다."

 GEH_preparing_for_civil_war: "내전을 대비"
 GEH_preparing_for_civil_war_desc: "만마전의 너구리들이 선도부를 파괴하려던 음모를 꾸민 것이 언제부터였을까요? 워낙 예전부터라 기억조차 안 나네요. 우리는 만마전의 공격에 대비되어 있어야만 합니다. 그리고 이를 위해서는 철저한 무장이 필요합니다."

 GEH_bavaria_governance_method: "바이에른의 선도부"
 GEH_bavaria_governance_method_desc: "혁신적 개혁 없이 우리 선도부가 점차 '군벌화'되고 있다는 기획부의 우려가 커지고 있기는 하지만, 실행부는 군벌국가가 꼭 부정적인 것만은 아니라고 말합니다. 어쨌거나 군벌국가화는 우리의 국력이 국방에 집중된다는 뜻이며, 이는 바이에른의 국력을 주변 국가들이 과대평가하게 될 것이라는 주장입니다."

 GEH_negotiation_with_german_delegation: "도이치 대표단과 협상"
 GEH_negotiation_with_german_delegation_desc: "[GEH.GetLeader] 선도부장은 만마전의 너구리가 아니며, 만마전과 달리 절대로 나치와 협력하지 않을 것입니다. 우리는 대신 사회민주당 잔당들과 접촉할 것입니다. 선도부는 노동자들을 위한 근로기준법 개정안을 추진하는 대신, 사회민주당 당원 조직은 만마전과 트리니티라는 두 악을 물리치기 위해 현지인들이 우리 군에 입대하도록 독려할 것입니다."

 GEH_institutional_stabilization: "제도적 안정화"
 GEH_institutional_stabilization_desc: "현상유지 정책으로 인해 선도부가 바이에른의 안정화에 실패할 것이라는 비관적인 예측이 많았지만, 여전히 우리는 치안을 유지하고 바이에른을 통치하기 위한 충분한 역량을 가지고 있었습니다. 우리는 바이에른의 친나치 정당인 바이에른 인민당을 파괴하는 데 성공했으며, 모든 도시의 행정을 장악해가고 있습니다."

 GEH_industrial_development: "산업 개발"
 GEH_industrial_development_desc: "기획부의 기술관료들을 중심으로 바이에른 지역의 산업을 활성화하기 위한 중공업 진흥 정책이 고안되었습니다. 대전이 후 일자리를 잃어버린 키보토스계 수인과 로봇 인구들도 새로운 공장에서 일자리를 얻을 수 있을 것입니다."

 # 챕터 : 2
 GEH_Conquer_the_Central: "중앙구 공세"
 GEH_Conquer_the_Central_desc: "중앙구에 대한 전격전은 선도부가 게헨나 중앙구를 장악하기 위한 계획중인 군사 작전 중 하나입니다. 우리는 만마전의 권력 중심부를 직접적으로 타격하여 적의 사기를 꺾고 전략적 우위를 확보하는 것을 목표로 해야 합니다."

 GEH_Officer_Appeasement: "임원 회유"
 GEH_Officer_Appeasement_desc: "만마전이 선도부에 비해 부패하고 상당히 무능력한 지도부 집단으로 운영되고 있다는 것은 유명합니다. 능력이 있지만 [GEM.GetLeader] 개인과의 친밀감이 부족하다는 이유로 중용되지 못한 임원들을 선도부로 충분히 영입해 올 수 있을 것입니다."

 GEH_no_more_Heer: "규율 강요"
 GEH_no_more_Heer_desc: "우리는 선도부에서 복무하는 학생들에게 규율을 지키고 민사 규칙을 적절히 따르도록 해야 합니다. 선도부가 강력한 전투력과 규율과 존경을 받을 수 있는 부대라는 명성을 얻도록 해야 합니다."

 GEH_get_legitimacy: "정통성 확보"
 GEH_get_legitimacy_desc: "정통성이란 카드 게임과는 달라서, 새로운 포커 카드를 뽑는 것처럼 손쉽게 얻어낼 수 있는 것이 아닙니다. 적극적 치안 활동을 통해 게헨나계와 도이치계 모두의 대중적 지지를 받고, 프로파간다 활동을 통해 [GEH.GetLeader] 선도부장의 인기를 관리하며, 우리가 단순한 군벌이 아닌 게헨나의 대표가 될 자격이 있음을 정책의 실천으로 증명해야 합니다."

 GEH_get_legitimacy_trigger_tt: "@GEM§Y[GEM.GetName]§!(이)가 @GEA§Y[GEA.GetName]§!(과)와 통합됨"

 GEH_focus_8: "대공세"
 GEH_focus_8_desc: "만마전을 완전히 파괴하기 위하여, 우리는 공세를 멈추어서는 안 됩니다. 매우 공격적인 전술을 통해 만마전을 외부에서부터 분쇄할 것입니다. 비록 이것이 우리에게도 큰 피해를 입힌다 하더라도요."

 GEH_Securing_supplies: "물자 확보"
 GEH_Securing_supplies_desc: "다가오는 만마전과의 전쟁을 대비하기 위해 물자를 확보하는 것은 중요한 문제입니다. 다행히 국방군과 긴밀한 관계를 맺고 있는 만마전에 대한 반발심으로 인해, 도이치 사회민주당 조직이 나치가 바이에른 지역 은행에 보유하고 있던 금 등의 현물 자산을 강탈해 제공했습니다."

 GEH_Armoury_Raid: "무기고 급습"
 GEH_Armoury_Raid_desc: "대전이 이후 제대로 관리되지 않은 채 방치된 공장의 숫자는 아직까지 통계에도 잡히지 않을 정도입니다. 정보부는 만마전이 확보하지 못한 산업시설들을 우리의 통제 지역 안으로 빠르게 이전하는 급습 작전을 기획했습니다. 만마전은 뒤늦게 자신들이 무엇을 놓쳤는지 알아차리겠지만, 이미 늦었을 것입니다."

 GEH_Pandemonium_Society_Building_Control: "대중을 집결시켜라"
 GEH_Pandemonium_Society_Building_Control_desc: "선도부는 만마전의 폭정을 끌어내리도록 대중들을 이끌어야 합니다. 학원의 학생들만이 아니라, 게헨나에 거주하는 키보토스계 인구를 모두 규합하여 혁명에 참여하도록 만듭시다!"

 #챕터 3
 GEH_first_congress_focus: "제3차 선도부 총회"
 GEH_first_congress_focus_desc: "선도부는 모든 역경을 딛고 혼란스러운 키보토스의 정치 상황에 강력한 존재감과 함께 나타났습니다. 수많은 선도부원은 선도부 총회를 개최하여 미래에 대비하고 게헨나를 변화시켜야 한다고 목소리를 높히고 있습니다."

 GEH_Army_Reformation: "실행부 개편"
 GEH_Army_Reformation_desc: "실행부는 현재 게헨나에서 국방을 담당하는 부서입니다. 지난 만마전과의 전쟁에서 실행부에게 큰 결점이 드러났습니다."

 GEH_Leverage_Perfect_team_strengths: "실행부 전문화"
 GEH_Leverage_Perfect_team_strengths_desc: "헤일로를 가진 키보토스계의 능력은 현지인 군대보다 훨씬 앞서고 있습니다. 실행부를 정예화 시켜 한 명 한 명 정예 인력으로 길러 낸다면 게헨나 학원의 군사력도 대폭 증가할 것입니다."

 GEH_army_focus_tt: "§g강력하지만 적은 인력을 기반으로하는 군사 개혁 중점입니다.§!"
 GEH_army_focus_2_tt: "§g특색이 없지만 무난한 군사 개혁 중점입니다.§!"

 GEH_look_to_the_west: "전쟁의 교훈"
 GEH_look_to_the_west_desc: "만마전과의 내전은 우리가 키보토스에서 겪었던 것과 같은 소규모 전쟁이 아닌, 대규모의 군사력을 갖춰야 한다는 것을 깨닫게 했습니다. 헤일로를 가지지 않은 현지인 인력을 군대에 더 적극적으로 받아들이고 군의 규모를 키우는 것을 고려해야만 할 시기입니다."

 GEH_Gehenna_Rebuilding: "기획부의 계획"
 GEH_Gehenna_Rebuilding_desc: "선임행정관인 아마우 아코가 계획한 경제 계획은 주먹구구식으로 굴러가던 게헨나 경제에 큰 도움이 될 것입니다. 기획서는 이미 선도부장에게 전해졌습니다."
 
 GEH_approve_plan: "예산 배정"
 GEH_approve_plan_desc: "선도부장은 아마우 아코의 경제 계획을 승인하였고 적절한 예산을 배정 받았습니다. 철저하고도 완벽한 계획 아래에 아마우 아코는 게헨나 경제를 부흥 시킬 것입니다."
 
 GEH_first_five_year_plan: "1차 5개년 계획"
 GEH_first_five_year_plan_desc: "평화가 지속되는 동안 우리는 계획에 맞춰 산업화를 더욱 빨리 추진해야 합니다. 이전 도이칠란트 정부의 산업화 계획을 이어받을 수 있기 때문에, 우리의 산업화에 더욱 박차가 가해지고 있습니다."
 
 GEH_nationalise_railways: "게헨나 철도"
 GEH_nationalise_railways_desc: "게헨나를 잇고 있는 것은 도로가 아닙니다. 철도 또한 게헨나의 생명줄입니다. 지난번의 전쟁으로 크게 파손된 철도들에 대해, 하이랜더 철도학원은 '도이칠란트 정부가 건설한 철도는 우리의 소관이 아니다'라고 주장하고 있습니다. 결국 아쉬운 것은 우리이니, 철도 수리도 우리의 예산을 써야 합니다."

 GEH_factory_focus_1: "버려진 공장 재활용"
 GEH_factory_focus_1_desc: "실행부에서 게헨나 서구를 조사하던 중 강을 따라 이어진 곳에 수많은 공장이 있는 것을 발견하였습니다. 정보부의 조사를 통해 이는 옛 아돌프 히틀러 정권이 베르사유 조약을 어기며 비밀리에 군비 확충을 위해 조성한 공장 지대였던 것으로 확인되었습니다. 이 시설들을 나치가 사용하는 것보다는 우리가 쓰는 편이 더 낫지 않겠습니까?"

 GEH_factory_focus_3: "국방 기금"
 GEH_factory_focus_3_desc: "게헨나 통일 과정에서 우리는 막대한 전쟁비용을 사용했습니다. 우리는 국가 재건을 위하여 게헨나 시민들을 상대로 국방 기금 모집을 실시할 예정입니다. 어디까지나 자발적인 모금인 만큼 한계는 있겠지만, 통일 과정에서의 상처를 치유할 시간은 벌 수 있을 것입니다."

 GEH_factory_focus_4: "중공업 재편"
 GEH_factory_focus_4_desc: "중공업을 발전시키는 과정에서 우리는 부패한 키보토스계 자본의 유입을 확인하였습니다. 부정부패와 비리를 척결하고 새로운 기업들이 담합 없이 발전할 수 있도록 게헨나 정부 주도로 통제한다면 우리의 공업력은 계속 발전할 수 있을 것입니다."

 GEH_factory_focus_6: "생산량 증대"
 GEH_factory_focus_6_desc: "게헨나만의 생산 방식은 다른 학원들을 초월할 수 없습니다. 새로운 생산 방식을 시행하고 새로운 기술을 도입하면서 다른 학원과 비슷하거나 추월해야 합니다."

 GEH_control_market_investment: "관제 시장 투자"
 GEH_control_market_investment_desc: "우리의 경제 정책에 큰 부분을 차지하는 관제 기업들에 대한 다양한 시장 투자를 활성화하여 국내 자본을 선도부에 종속시키고 유연하고 현실적인 시장 구조를 형성할 것입니다."

 GEH_prefect_team_priority: "선도부 우선"
 GEH_prefect_team_priority_desc: "모든 경제정책은 결국 선도부와 선도부원을 위해 운영되어야 한다는 본분을 잊어버리는 행동을 해서는 안 됩니다. 우리는 경제정책에 있어서 선도부의 운영을 최우선 사항으로 고려할 것입니다."

 GEH_vertical_integration: "수직적 통합"
 GEH_vertical_integration_desc: "선도부의 최적화된 관료제하에 여러 경제 프로그램을 진행할 것입니다. 산업의 수직적 통합과 중앙 관제를 통해 여러 반면에서의 효율적인 경제 구조를 형성할 것입니다."
 
 GEH_Cooperation_with_HID: "정보부 확대"
 GEH_Cooperation_with_HID_desc: "소라사키 히나가 과거 정보부 출신이라는 점은 널리 알려져 있는 사실입니다. 비록 정보부의 비밀스러운 활동을 모두가 좋아하지는 않지만, 적에 대한 정보를 미리 알고 대처하는 것이 중요하다는 것은 모두가 인정할 것입니다."

 GEH_hit_wehrmacht: "국방군 공격"
 GEH_hit_wehrmacht_desc: "비록 우리가 바이에른 지역의 국방군을 완전히 섬멸하였음에도 불구하고 암덩어리와 같은 구 국방군 조직은 서부 도이칠란트 전역에 걸쳐 저항을 이어가고 있습니다. 그들은 게헨나의 암과도 같은 존재이기에 어떠한 자비도 베풀어서는 안 됩니다."

 GEH_hit_wehrmacht_2: "주 정부 인수"
 GEH_hit_wehrmacht_2_desc: "독일의 주 정부를 인수해 선도부의 행정 부담을 약화시키고 지방 정부에 대한 통제력을 손쉽게 확보할 수 있을 것입니다."

 GEH_HID_benriya: "룩셈부르크 주권에 대한 의문"
 GEH_HID_benriya_desc: "룩셈부르크 대공국은 대전이 이후 서유럽 국가들 중 유일하게 국체를 보존한 현지인 국가입니다. 문제는 대전이 이후 룩셈부르크인 다수가 게헨나계로 대체되었으며, 룩셈부르크를 지키고 있는 아루의 존재 역시 우리에게 위협이 된다는 것입니다. 선도부의 강경파는 룩셈부르크에 대한 예방전쟁을 요구하고 있습니다."

 GEH_benriya_annex: "룩셈부르크 직할령화"
 GEH_benriya_annex_desc: "룩셈부르크 대공국이라는 국가는 해산될 것이며, 리쿠하치마 아루와 그녀의 동료들은 재판을 거쳐 추방될 것입니다. 이것은 그녀들에게 잔혹한 일이 될 수 있지만, 이미 게헨나계 인구가 충분히 많은 룩셈부르크는 '게헨나화' 시킬 수 있는 좋은 먹잇감입니다."
 
 GEH_benriya_tolerate: "선도부 소속 흥신소 68"
 GEH_benriya_tolerate_desc: "작은 소국을 병합하기 위해 흥신소 68의 뛰어난 인재들을 버리는 것은 합리적인 선택이 아닙니다. 리쿠하치마 아루가 마음대로 룩셈부르크에서 자치를 이어갈 수 있게 허가합시다. 대신 흥신소 68은 선도부 간부로 임명될 것이며, 그녀들은 국가 위기 상황에서 선도부를 위해 충성해야 할 의무를 갖습니다."

 GEH_HID_trinity: "어둠 속의 눈"
 GEH_HID_trinity_desc: "선도부가 만마전을 꺾어내었다고 하여도 아직 내부에는 만마전과 유통한 사람이 존재할 수 있습니다. 보이지 않는 곳에서 그들을 감시하고 기록해야합니다."
 GEH_HID_millennium: "군 감시제도"
 GEH_HID_millennium_desc: ""
 GEH_preventive_attack: "'예방전쟁'"
 GEH_preventive_attack_desc: ""

 GEH_Army_focus_1: "장비 개량"
 GEH_Army_focus_1_desc: "선도부는 치안 기관이었다는 근본적 한계로 인해 선도부원들에게 제공되는 무기의 질이 정규군 수준에 미치지 못했습니다. 게헨나 통일 과정에서 우리는 만마전의 군인들에 비해 선도부 군인들의 무장 수준이 떨어진다는 것을 확인했으며, 이를 개선하기 위한 예산안 투자가 논의되고 있습니다."

 GEH_Army_focus_3: "야포 개발"
 GEH_Army_focus_3_desc: "대전이 이전의 키보토스에서는 소라사키 히나 개인이 선도부의 가장 강력한 화력이었지만, 영토가 커지고 신비가 고갈되는 문제로 인해 더는 대전이 이전과 같은 전쟁 형태는 불가능해졌습니다. 대안은 포병대를 확충하고 키보토스에서의 신비가 가진 힘을 포병대로 (조금이나마) 재현하는 것입니다."

 GEH_Army_focus_2: "지형 적응"
 GEH_Army_focus_2_desc: "멋지게 다져진 게헨나 자치구의 넓은 도로에서 헬멧단을 상대로 시가전만을 벌이면 되었던 아름다웠던 시절은 끝났습니다. 이제 선도부는 산에서, 언덕에서, 숲에서, 평야에서의 교전을 염두에 두고 움직여야만 합니다. 전직 SRT 소속 졸업생 등을 초빙해 다양한 지형에서의 싸움을 고려한 전술 교본을 만들 필요가 있습니다."

 GEH_DNVP_focus_3: "[GEH_DNVP_focus_3_text]"
 GEH_DNVP_focus_3_desc: "우리는 전쟁의 교훈을 통하여 실행부에 대한 개혁을 진행할 것입니다."

 GEH_DNVP_focus_3_1: "실행부 확대"
 GEH_DNVP_focus_3_1_desc: "실행부는 우리 게헨나의 국방부이며, 이번 전쟁을 통해 실행부가 더 크고 막대한 규모를 가져야 한다는 것이 드러났습니다. 더 많은 실행부원들을 모집하고 그 규모를 확대시킨다면 미래의 안보 위기를 해소할 수 있을 것입니다."

 GEH_DNVP_focus_3_2: "정예화 가속"
 GEH_DNVP_focus_3_2_desc: "대전이 이후 우리는 헤일로를 가진 키보토스계 인구와 헤일로가 없는 인간의 신체적 능력 차이가 확연하다는 것을 깨달았습니다. 헤일로가 없는 나약한 다수의 병사들보다는 소규모의 정예군에 집중하는 것이 좋은 대안이 될지 모릅니다."

 GEH_Army_focus_5: "정예 핵심"
 GEH_Army_focus_5_desc: "수많은 선도부원들이 있지만 통일 전쟁에 참여한 이들은 그 중 소수에 불과합니다. 이로써 우리가 알 수 있는 점은 많은 수의 인원을 전장에 쏟아붓는건 비효율적이라는 것과, 정예 인원들의 체계적인 육성이 그 무엇보다 중요하다는 사실입니다. "

 GEH_prefect_army_focus_2: "제병합동"
 GEH_prefect_army_focus_2_desc: "신속하고 유기적인 지휘체계의 협동은 신세계의 전장에서 가장 부대 손실률이 적은 성과를 보였습니다. 아직 시험 단계인 제병협동을 신속히 도입해야합니다. "

 GEH_prefect_army_focus_3: "철저한 총참모부 교육"
 GEH_prefect_army_focus_3_desc: "대전이 이전 선도부의 전투력은 소라사키 히나의 무력과 지휘에만 의존하는 기형적인 구조를 가지고 있었습니다. 체계적인 교육을 통해 우리는 이전처럼 히나 부장이 모든 전장의 전면에 설 수 없는 상황에서도 적과 대처할 수 있을 것입니다."

 GEH_prefect_DNVP_focus_3: "선도부 특수사관부"
 GEH_prefect_DNVP_focus_3_desc: "선도부의 정예화를 추진하는 우리의 계획은 성공적으로 이뤄지고 있습니다. 각 전쟁에서 두각을 보이는 학생들을 지원하기 위해서, 선도부에서는 특수사관부를 만들어 이들을 전폭 지원하기로 결정했습니다."

 GEH_Army_focus_6: "징병 확대"
 GEH_Army_focus_6_desc: "선도부는 대전이 이후 지속적으로 도이칠란트 현지인들과 거리를 두어 왔습니다. 하지만 만마전과의 전쟁을 통해 키보토스계가 게헨나의 소수 인구가 된 지금, 더 많은 현지인 인력의 모집 없이는 게헨나를 방어할 수 있는 국방력을 갖추는 것이 불가능하다는 결론이 내려졌습니다."

 GEH_west_army_focus_2: "새로운 병과의 활용"
 GEH_west_army_focus_2_desc: "게헨나 통일 전쟁에서 최후까지 맞서 싸우다 우리 군에게 완파된 만마전의 전차 토라마루는 선도부 임원들에게 큰 인상을 남겼습니다. 기갑사단은 미래 선도부를 이끌 새로운 병과이며 아무리 비용이 비싸다고 하더라도 투자할 만한 가치가 있습니다."

 GEH_west_army_focus_3: "실행부와 기획부 갈등 중재"
 GEH_west_army_focus_3_desc: "대전이 이후 사실상의 국방부 역할을 맡은 실행부와, 행정과 경제를 담당하는 기술관료 조직인 기획부는 사실 그렇게 사이가 좋지 않습니다. 두 조직의 리더인 이오리와 아코 두 사람의 개인적 관계와 무관하게, 조직간의 파벌 갈등은 효율적인 군 예산 배정을 어렵게 만듭니다. 파벌 갈등을 완전히 없앨 수는 없겠지만, 적어도 '완화'시키도록 노력하는 건 가능할 것입니다."

 GEH_west_DNVP_focus_3: "학원 안의 사관학교"
 GEH_west_DNVP_focus_3_desc: "대전이 이후 우리는 새로운 전장에서 어떻게 병사들을 통솔해야 하는지 깨달았으며, 선도부 실행부 일반 사병들을 위한 적응 훈련 과정을 새롭게 창설했습니다. 병사 하나하나를 정예로 만들 수는 없겠지만, 그들이 한 사람 몫을 하도록 도울 수는 있겠죠!"

 GEH_Army_focus_7: "게헨나의 새로운 군대"
 GEH_Army_focus_7_desc: "게헨나의 깃발을 올리고, 선도부가 다가왔음을 적에게 알립시다! 우리의 군사적인 발전은 지금까지 그 어떤 게헨나의 지도자들도 이루지 못했던 업적입니다. 게헨나 선도부라는 존재는 주변 국가들을 공포에 떨게 하는 이름으로 역사에 남을 것입니다."

 dldhfl_flag: "$BA_news.52.t$"
 #챕터 4
 
 GEH_Trinity_war: "트리니티 침공 계획"
 GEH_Trinity_war_desc: "게헨나와 [TRM.GetName] 측은 전통적인 적대국이었으며, 특히 [TRM.GetLeader]의 존재가 우리에게 심각한 안보 위협이 된다는 것은 분명합니다. 만약 그들이 우리를 침공할 준비를 하고 있다면, 우리는 그녀들을 먼저 공격할 필요가 있습니다."

 GEH_war_factory_focus_1: "군수시설 확장"
 GEH_war_factory_focus_1_desc: "트리니티와의 에덴 결전을 위해서는 게헨나가 장기적으로 군수 물자를 생산할 수 있는 능력을 갖추고 있어야만 합니다. 군수 시설을 확장하고, 장기전을 수행할 수 있는 전략 능력을 갖출 필요가 있습니다."
 
 GEH_war_factory_focus_3: "지하 산업 획득"
 GEH_war_factory_focus_3_desc: "에덴 결전은 게헨나를 완전히 파괴하고자 하는 트리니티의 야망으로 이루어졌습니다. 만약 이 전쟁이 트리니티의 승리로 끝난다면 게헨나에는 작은 초목 하나조차 남지 않을 것입니다. 그렇기에 우리가 범죄 조직들의 재산을 압류해 활용하는 것은 어떤 의미에서는 범죄자들의 미래까지 생각하는 아가페적인 정책이기도 합니다."

 GEH_war_factory_focus_4: "게헨나 야포"
 GEH_war_factory_focus_4_desc: "게헨나 선도부 기술자들이 직접 개량한 게헨나만의 야포입니다. 강력한 화력을 이용해 트리니티의 포병대를 박살 내 버릴 준비를 마쳤습니다. 물론 새로운 병기가 얼마나 큰 활약을 할 수 있을지는 전장에서 알 수 있겠죠!"

 GEH_war_focus_2: "선전부 창설"
 GEH_war_focus_2_desc: "에덴 결전은 게헨나의 역사상 한 번도 없었던 미증유의 사건입니다. 그리고 우리는 사용할 수 있는 모든 자산을 활용해야만 합니다. 선전부를 창설하여 전쟁 도중 선도부의 업적을 홍보하고, 선도부에 대한 지지를 확대해야 합니다."

 GEH_war_focus_3: "게헨나 수호 집중"
 GEH_war_focus_3_desc: "우리의 가장 중대한 목표는 트리니티의 공격으로부터 게헨나를 수호하는 것입니다. 지금은 방어에 집중하며 한 발자국도 물러서지 않겠다는 의지를 다져야 할 시기입니다."

 GEH_unlimited_conscription: "징병 제한 제거"
 GEH_unlimited_conscription_desc: ""

 GEH_chinatsu_focus_1: "의료부 충원"
 GEH_chinatsu_focus_1_desc: "의료부는 정치적 기반의 부재로 인해 지금까지 제대로 된 대우를 받지 못했습니다. 하지만 전시 상황에서 선도부원들의 피해를 줄이기 위해서는 의료부의 지원이 매우 절실합니다."

 GEH_chinatsu_focus_2: "의무 부대"
 GEH_chinatsu_focus_2_desc: "새로은 의무 부대 창설은 지금까지 후방으로 운송되어 온 선도부원들에 대한 치료에 집중하는 것을 넘어서, 지금까지의 선도부에는 익숙하지 않았던 야전병원의 개념을 도입하기 위한 시도입니다."

 #GEH_chinatsu_focus_5: "의료 활동 지속"
 #GEH_chinatsu_focus_5_desc: "의료부가 확대되고 그 인원이 충원되면서, ."

 #GEH_chinatsu_focus_3: "전선 병원"

 GEH_chinatsu_focus_4: "전선의 여성들이여!"
 GEH_chinatsu_focus_4_desc: "틈만 나면 우리 게헨나의 정치에 슬그머니 손을 뻗으려 하는 현지인들을 우리 선도부는 비록 기회주의자들 그 이상으로 보고 있지는 않지만, 도이칠란트의 래디컬 페미니스트 사회운동가인 아니타 아우크슈푸르크는 선도부가 여성만으로 이루어진 조직이란 점을 찬양하며, 도이치 여성 노동권에 대한 혁신적 협상이 이루어질시 조직적으로 여성주의자들의 군 입대를 독려하겠다고 약속했습니다."
 #Anita Augspurg

 GEH_war_focus_7: "게헨나 방어 계획"
 GEH_war_focus_7_desc: "트리니티의 군대가 우리의 영토를 위협하고 있는 지금, 국토를 방어하기 위한 최선의 전략이 필요한 상황입니다. 한 발자국도 물러설 수는 없습니다."

 GEH_war_focus_8: "게헨나 수복 계획"
 GEH_war_focus_8_desc: "적의 강력한 공세로 인해 상실된 영토를 수복하고, 역으로 트리니티를 향해 전진하기 위한 준비를 할 시간입니다."

 GEH_war_focus_9: "트리니티 공세 계획"
 GEH_war_focus_9_desc: "우리는 [TRM.GetLeader]의 군대를 패퇴시키고 적의 심장부로 칼을 꽂을 준비를 마쳤습니다. 게헨나의 영광을 위하여 공세를 실시합시다. [ROOT.GetLeader] 만세! 게헨나의 자유가 영원히 사그라지지 않도록 하기를!"

 # 해군 개혁
 GEH_prefect_team_navy: "게헨나 해상선도부 군사화"
 GEH_prefect_team_navy_desc: "선도부는 내륙국에서 해안가를 접한 해양국가로 발돋움하였으며, 지금까지 단순히 강과 호수를 지키던 경비대에 불과했던 선도부 해양 병력을 조직화된 '군대화'하기 위한 첫 번째 기획이 시작되었습니다."
 
 GEH_prefect_team_navy_marine: "해병대"
 GEH_prefect_team_navy_marine_desc: "바다 건너에 있는 적을 타격하기 위하여, 현지인들을 중심으로 소규모의 해병대를 양성하기 위한 논의가 진행되었습니다. 우리는 가장 위험한 시기 [GEI.GetName]와(과) 같은 키보토스의 적을 상대로 단호한 국제적 조치를 취할 수 있을 것입니다."
 
 GEH_prefect_team_navy_disciplinary_committee: "실행부 해군과"
 GEH_prefect_team_navy_disciplinary_committee_desc: "선도부 해상경찰이 군대화되면서 이들이 독립적인 부서가 되어야 하는지에 대한 논의가 진행되었습니다. 게헨나 해군의 규모가 크지 않을 것으로 판단되는 지금, 우리는 해군을 별도의 조직으로 구분짓지 않은 채 기존에 존재하던 실행부의 하위 '해군과' 소속으로 편입할 것입니다."
 
 GEH_prefect_team_navy_disciplinary_committee_transport: "튜브를 넘어서"
 GEH_prefect_team_navy_disciplinary_committee_transport_desc: "선도부는 대전이 이전에도 바닷가에서 사용하기 위한 특수 튜브를 이용하고 있었습니다만... 이제 더 이상 튜브만으로 바다에 둥둥 떠서 선도부원들을 운송할 수는 없게 되었습니다. 수송선의 충원은 우리가 조금 더 먼곳으로 나아갈 수 있도록 하는 원동력이 될 것입니다."
 
 GEH_prefect_team_navy_disciplinary_committee_submarine: "안전한 접근법"
 GEH_prefect_team_navy_disciplinary_committee_submarine_desc: "대전이 이전의 해양 훈련 시간, 소라사키 히나 부장이 전투수영을 위해 바다에 힘차게 뛰어들었다 그대로 가라앉는 모습을 보면서 선도부는 아무리 강한 힘을 가진 자도 대양 밑바닥의 힘을 이길 수 없다는 것을 알게 되었습니다. 히나 부장을 딱히 모욕하려는 의미는 아니었지만, 실행부는 그 때의 경험을 토대로 '바다 밑의 힘'을 우리가 더 적극적으로 활용할 필요가 있다고 주장하고 있습니다."
 
 GEH_prefect_team_navy_disciplinary_committee_destroyer: "연안해군"
 GEH_prefect_team_navy_disciplinary_committee_destroyer_desc: "게헨나 선도부의 활동은 어디까지나 지상에서만 이루어졌습니다. 실행부에는 바다에 대해 깊이 아는 전문가가 없으며, 우리의 해군이 연안해군 이상으로 벗어나기 쉽지 않으리라는 현실을 받아들여야 합니다. 가장 작고 저렴한 소형 구축함을 만들어낸다 하더라도, 당장 그 구축함을 몰 장교들을 교육할 기관조차 전무한 상태이니까요. 우리는 작은 구축함들을 몇 척 정도 만들어낼 수 있겠지만, 그 이상을 기대하지는 않을 것입니다."
 
 GEH_prefect_team_navy_disciplinary_committee_defense: "해안 방어"
 GEH_prefect_team_navy_disciplinary_committee_defense_desc: "솔직하게 말해서, 우리 실행부가 운용하는 해군이 다른 해군을 상대로 이길 수 있으리라고 자신할 수 있는 사람은 없습니다. 오디세이아 학원의 관광용 크루즈선과 해전을 벌여도 우리 구축함이 먼저 격침당할 것이 분명하거든요. [ROOT.GetLeader]의 동의를 얻어, 우리는 해전에서 결국 패배할 것을 가정하고, 적의 상륙을 거부하기 위한 해상요새 건설에 집중하기로 결정했습니다."
 
 GEH_prefect_team_navy_disciplinary_committee_officer: "전직 발키리 해상경찰 영입"
 GEH_prefect_team_navy_disciplinary_committee_officer_desc: "우리들 중 배를 몰아본 적 있는 사람? 아니, 하츠 오브 키보토스 인가 하는 재미 없는 그 밀레니엄 게임에서 조종해본 건 예외로 두고 말이야. 그래. 아무도 없지? 발키리 경찰학교에서 교관을 모집해 오는 게 유일한 대안이야. 돈을 좀 많이 줘야 하겠지만... 게임 콘솔로밖에 배를 몰아본 적 없는 너희보다야 낫겠지."
 
 GEH_prefect_team_navy_disciplinary_committee_valkyrie_BD: "발키리 BD 구매"
 GEH_prefect_team_navy_disciplinary_committee_valkyrie_BD_desc: "우리에게 정상적인 해군 교리를 운용할 능력이 없는 만큼, 발키리 해양경찰이 교육용으로 사용하던 BD를 구매해 그들을 똑같이 따라하는 것이 제격일 것입니다. 물론 해양경찰의 교육 프로그램인 만큼, 대규모 해전에는 알맞지 않겠지만요."
 
 GEH_prefect_team_independent_navy: "게헨나 크릭스마리네"
 GEH_prefect_team_independent_navy_desc: "겁쟁이들은 우리 게헨나가 해군을 양성한 적이 없으며 그렇기 때문에 대양해군을 만드는 것이 공상되었다고 말합니다. 하지만 위대한 영도자인 소라사키 히나 부장께서 이끄시는 게헨나가 연안해군 따위를 운용하는 것은 부끄러울 뿐만이 아니라 [ROOT.GetLeader]에 대한 모욕이기까지 합니다. 위대한 조국에게는 위대한 해군이 필요하며, 겁 많은 반대파들은 팔다리가 묶여 북해 바다로 던져질 것입니다."
 
 GEH_prefect_team_independent_navy_carrier: "소라사키급 항공모함"
 GEH_prefect_team_independent_navy_carrier_desc: "우리는 현지인들에 비해 더 발전한 기술을 가지고 있으며, 그렇기 때문에 웅장한 전함이 장기적으로 '어떤' 결말을 맞는지도 알고 있습니다. 가장 합리적인 대양해군의 시작은 항모전단에서부터 시작되어야 합니다. 그리고 위대한 게헨나의 어머니이신 소라사키 히나의 이름을 딴 소라사키급 항공모함의 건조 계획이 승인되었습니다."
 
 GEH_prefect_team_independent_navy_navalized_aircraft: "함재기 계획"
 GEH_prefect_team_independent_navy_navalized_aircraft_desc: "우리는 더 발전한 함재기 기술의 도입을 통하여 게헨나의 항공모함들이 더욱 멀리 진출할 수 있도록 할 것입니다."
 
 GEH_prefect_team_independent_navy_destroyer: "함대 확장"
 GEH_prefect_team_independent_navy_destroyer_desc: "우리가 대양해군을 구축하기까지 주변 국가들은 영원히 기다려주지 않을 것입니다. 막대한 예산을 투자하더라도, 우리는 빠른 속도로 함대를 확장해야만 합니다."
 
 GEH_prefect_team_independent_navy_dockyard: "게헨나 조선소 지구"
 GEH_prefect_team_independent_navy_dockyard_desc: "우리의 위대한 함대는 더욱 많은 예산을 필요로 합니다! 가능한 가장 크고 위대한 조선소 지구가 우리 해안 도시들에 건설될 것입니다."
 
 GEH_prefect_team_independent_navy_german_officer: "도이치식 장교 훈련"
 GEH_prefect_team_independent_navy_german_officer_desc: "게헨나 영토 내에 거주하는 도이치 해군 장교들의 도움을 받아, 우리 게헨나의 새로운 해군을 이끌 젊고 유능한 장교를 육성해 낼 필요가 있습니다."
 
 GEH_prefect_team_independent_navy_oil: "기적의 원유"
 GEH_prefect_team_independent_navy_oil_desc: "대양해군은 막대한 원유를 필요로 합니다. 하지만 이 도이칠란트 땅에서는 석유를 채굴할 수 없습니다. 적절한 외국에서 원유를 수입하는 것도 합리적인 방법이지만, 전시 상황을 가정했을 때 원유 수입에 타격이 생길 가능성이 있습니다. 이것이 우리가 합성 원유 산업에 투자해야 할 합리적인 이유입니다."

 # 공군 개혁
 GEH_prefect_team_luftwaffe: "게헨나 루프트바페"
 GEH_prefect_team_luftwaffe_desc: "선도부는 어디까지나 치안 조직이었으며, 조직화된 공군을 가지고 있지는 않았습니다. 만마전이라면 어느 정도 항공기를 보유하고 있었을지도 모르지만요. 하지만 우리는 나치에 의해 재산권을 침해당했으나 반나치 조직인 우리 게헨나 선도부에 의해 자유를 되찾은 항공사 '융커스'와 접촉하였으며 그들의 도움을 받을 수 있게 되었습니다. 게헨나 루프트바페가 찬란한 상공으로 날아오릅니다."
 
 GEH_prefect_team_luftwaffe_primitive_helicopter: "원시적 헬리콥터"
 GEH_prefect_team_luftwaffe_primitive_helicopter_desc: "우리는 대전이 이전에도 선도부 소속 헬리콥터들을 여러 대 보유하고 있었습니다. 하지만 대전이 이후 우리가 자력으로 이 헬리콥터를 양산할 수 있는 방법은 없었기 때문에, 대신 우리는 이들 중 한 대를 융커스에게 맡겨 역설계를 제안했습니다. 융커스의 공학자들은 수십년 이상 앞서가는 기술력을 가진 우리의 헬리콥터 구조를 거의 이해하지 못했지만, 어떻게든 프로펠러를 통해 비행하는 원시적 기체를 역설계로 만들어낼 수는 있었습니다."
 
 GEH_prefect_team_luftwaffe_true_helicopter: "게헨나 헬리콥터"
 GEH_prefect_team_luftwaffe_true_helicopter_desc: "융커스의 초기 헬리콥터는 상당히 조악한 수준이었지만, 우리가 게헨나 전역을 석권한 이후 더 다양한 자료를 얻을 수 있게 되면서 현대적 헬리콥터의 재구성이 가능해졌습니다."
 
 GEH_prefect_team_luftwaffe_junkers: "게헨나 융커스 확장"
 GEH_prefect_team_luftwaffe_junkers_desc: "현지인 사업가들과 키보토스계 사업가들의 협력을 통하여, 게헨나 융커스가 규모를 불려가고 있습니다. 우리에게 공군 기술이 없는 만큼 도이치계 기업의 도움은 매우 절실한 상황입니다. 융커스 확장을 지원하고 그들이 앞으로도 게헨나에서 최고의 공군 전력을 만들어낼 수 있도록 지원합시다."
 
 GEH_prefect_team_luftwaffe_therese_junkers: "테레제 융커스"
 GEH_prefect_team_luftwaffe_therese_junkers_desc: "융커스는 나치에 의해 가장 잔인한 탄압을 받은 기업이기도 했습니다. 이전 대표였던 휴고 융커스는 가택연금을 당한 뒤 사망했으며, 그의 사후 기업의 지도자가 된 아내 테레제 융커스가 나치의 협박으로 인해 1935년 모든 기업 권리를 히틀러 정권에게 넘겨주었습니다. 하지만 시대가 바뀌었습니다. 테레제는 융커스에 대한 모든 권리를 다시 되찾았으며 게헨나를 위하여 새로운 비행기 연구를 위해 투자를 할 준비를 마쳤습니다."

 GEH_prefect_team_luftwaffe_fighter_design: "전투기 연구"
 GEH_prefect_team_luftwaffe_fighter_design_desc: "융커스와의 협력을 통해 우리는 더욱 발전된 항공 전력을 확충할 수 있게 되었습니다."

 GEH_prefect_team_luftwaffe_tactical_bombers: "전술 폭격 계획"
 GEH_prefect_team_luftwaffe_tactical_bombers_desc: "융커스는 우리에게 새로운 폭격기 시안을 제시하였으며, 이는 충분히 실전에서 사용할 수 있는 가치가 있어 보입니다."

 GEH_prefect_team_luftwaffe_multi_role_aircraft: "공군 혁신 계획안"
 GEH_prefect_team_luftwaffe_multi_role_aircraft_desc: "트리니티를 비롯한 주변 국가들과의 전쟁에 대비하기 위하여, 우리는 더욱 혁신적이고 발전된 항공 병기를 필요로 합니다. 테레제 융커스와 그녀가 고용한 뛰어난 공학자들의 도움을 통해 우리는 더 '혁신적'인 공군 개혁안을 준비할 수 있게 되었습니다. [ROOT.GetLeader]의 자금 지원 서류는 이미 결재되었습니다."

 GEH_prefect_team_luftwaffe_long_range_bombing: "선도부는 결코 피할 수 없다"
 GEH_prefect_team_luftwaffe_long_range_bombing_desc: "우리는 장거리를 비행해 적의 후방을 폭격하기 위한 새로운 전략폭격 계획에 대해 논의를 시작했습니다. 융커스에 새롭게 편입된 키보토스계 공학자들은 이것이 단순한 공상이 아닌 충분히 실현 가능한 계획이라고 말합니다."

 GEH_prefect_team_luftwaffe_jet: "엔진 가동"
 GEH_prefect_team_luftwaffe_jet_desc: "더 좋은 엔진, 그리고 더 빠르게 날아가는 전투기! 키보토스계 공학자들의 노력이 드디어 빛을 보기 시작했습니다."

 GEH_prefect_team_luftwaffe_anti_air: "게헨나 대공망"
 GEH_prefect_team_luftwaffe_anti_air_desc: "우리가 공군을 발전시키고 있는 사이, 트리니티를 비롯한 다른 국가들도 공군을 양성하고 있을 것입니다. 공격만을 생각할 것이 아니라, 방어에도 대비하는 것이 합리적인 대안입니다."

 GEH_prefect_team_luftwaffe_nuke: "최종장"
 GEH_prefect_team_luftwaffe_nuke_desc: "정말로 우리는 모든 준비를 마친 것일까요? 우리가 하늘에서 할 수 있는 모든 것들을 다 준비했다고 할 수 있을까요? ...무언가, 빠진 것이 있는 건 아닐까요?"

#챕터5
 GEH_three_congress_focus: "제4차 선도부 총회"
 GEH_three_congress_focus_desc: "파도가 휩쓴 자리에는 두 발을 딛고 서있는 선도부와 게헨나가 남아있었으며, 어느새 키보토스에서의 하루가 까마득히 먼 옛날이 되었습니다.\n수많은 선도부원들이 제4차 선도부 총회를 개최해야 한다며 목소리를 높히고 있습니다. 그리고 이 총회에서 우리들의 미래가 정해질 것입니다."
 GEH_three_congress_focus_trigger: "§Y$GEH_Army_Reformation$§! 중점의 아래 중점 계통도 3개 이상 완료"
 GEH_three_congress_focus_tt: "§C소라사키 히나는 더 이상 무너지지 않습니다.§!"
 GEH_three_congress_focus_no_hina: "선도부장이 없는 하루"
 GEH_three_congress_focus_no_hina_desc: "불길한 어둠이 감도는 긴 밤이 지나고. 일어나선 안 될 일이 일어났습니다.\n소라사키 히나 선도부장님이 현재 부재중인 상황이기에. 우리는 다급하게 문제를 해결해야 합니다."
 GEH_three_congress_focus_no_hina_can_only_be_completed_by_focus_tt: "이 중점은 §Y$GEH_hina$§!가 §S무너진§! 경우 자동으로 시작될 것입니다."
 GEH_BTBOTS_END_flag: "§Y$GEH_hina$§!가 §S무너진§! 상태임"
 GEH_BTBOTS_END_NEXT_flag: "§Y$GEH_hina$§!의 빈자리를 성공적으로 대처함"
 GEH_three_congress_focus_no_hina_htt: "우리가 §Y$GEH_hina_route_focus$§! 중점도에 진입했기 때문에 선도부 내에서 가장 거대한 정치적 변화가 벌어질 것입니다."
 GEH_three_congress_focus_no_hina_att: "우리가 §Y$GEH_ako_route_focus$§! 중점도에 진입했기 때문에 §Y$GEH_dkzh$§!가 권력을 장악할 것입니다."
 GEH_three_congress_focus_no_hina_ctt: "우리가 §Y$GEH_iori_route_focus$§! 중점도에 진입했기 때문에 §Y$GEH_dldhfl$§!가 권력을 장악할 것입니다."
 GEH_three_congress_focus_no_hina_ntt: "우리는 선도부의 정치적 균형을 유지했기 때문에 §Y$GEH_dkzh$§!가 권한 대행을 수행할 것입니다."
 GEH_three_congress_focus_no_hina_ftt: "§R우리가 §Y$GEH_zero_congress_focus$§! 중점을 완료하지 않았기 때문에 게임이 종료됩니다.§!"
 GEH_trinity_focus_1: "트리니티 우상숭배 금지"
 GEH_trinity_focus_1_desc: "<설명 필요>"
 GEH_trinity_focus_2: "통제 강화"
 GEH_trinity_focus_2_desc: "<설명 필요>"
 GEH_trinity_focus_3: "게헨나 복구 사업"
 GEH_trinity_focus_3_desc: "<설명 필요>"
 GEH_trinity_focus_4: "현지 경찰 설립"
 GEH_trinity_focus_4_desc: "<설명 필요>"
 GEH_trinity_focus_5: "강철의 학원"
 GEH_trinity_focus_5_desc: "<설명 필요>"
 GEH_trinity_integration: "트리니티 통합"
 GEH_trinity_integration_desc: "우리가 트리니티와의 대전쟁에서 승리하고 향후 발생할 두 번째 충돌을 막아세우기 위해서는 '에덴 조약'의 완성이 필연적입니다. 우리는 다양한 군사적, 정치적 수단을 동원하여 트리니티를 게헨나 학원에 편입하기 위해 모든 수단을 동원할 것입니다."
 GEH_trinity_integration_target: "[FROM.GetName] 주의 저항 완화"
 GEH_trinity_integration_target_tt: "[FROM.GetName] 주의 통합 절차가 준비될 것입니다.\n"
 GEH_trinity_integration_complete: "[FROM.GetName] 주의 통합 절차"
 GEH_last_focus_3: "결과"
 GEH_last_focus_3_desc: "게헨나의 통일, 트리니티의 위협. 그 모든 문제들이 파도와 같이 몰려왔으나, 선도부는 굳건하게 버텨내었습니다. 이제 우리는 게헨나의 미래를 찾고 길을 밝혀나가는 유일한 등불이 되었습니다."
 GEH_last_focus_3_tt: "§Y후속 중점도§!가 나타납니다."
 GEH_last_focus_3_h_tt: " 우리가 §Y$GEH_hina_route_focus$§! 중점도에 진입했기 때문에 §Y$GEH_last_focus_effect_h_rout$§! 중점도가 나타납니다."
 GEH_last_focus_3_a_tt: " 우리가 §Y$GEH_ako_route_focus$§! 중점도에 진입했기 때문에 §Y$GEH_last_focus_effect_a_rout$§! 중점도가 나타납니다."
 GEH_last_focus_3_c_tt: " 우리가 §Y$GEH_iori_route_focus$§! 중점도에 진입했기 때문에 §Y$GEH_last_focus_effect_c_rout$§! 중점도가 나타납니다."
 GEH_last_focus_3_n_tt: " 우리는 선도부의 정치적 균형을 유지했기 때문에 §Y$GEH_last_focus_effect_normal_rout$§! 중점도가 나타납니다."

 GEH_woe_to_the_vanquished: "패배자에겐 비애뿐"
 GEH_woe_to_the_vanquished_desc: "<설명 필요>"
 GEH_woe_to_the_vanquished_2: "하나의 게헨나, 하나의 지도자"
 GEH_woe_to_the_vanquished_2_desc: "<설명 필요>"
