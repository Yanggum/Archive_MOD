l_english:

 GEH_hina_name: "Sorasaki Hina"

#Gehenna
 GEH_country_intro_header: "50 Days After the Great Transfer"
 GEH_country_intro_content: "Before the Great Transfer, the §pGehenna Prefect Team§!, Gehenna's judicial and security apparatus, was widely recognized by outsiders due to its legendary leader, Sorasaki Hina. Within Gehenna, its political rivalry with its legal superior, the §RPandemonium Society§!, was common knowledge.\n\nThe Pandemonium Society, or Manmajeon, is the superior body of the Prefect Team elected by direct student vote. However, it has openly harbored hostility toward the Prefect Team, attempting broad interference in internal affairs, budget, and military matters. Chairman Hanuma Makoto, who was elected as the successor to a militarist known as the 'Thunder Emperor,' did not abandon the militaristic delusion of 'conquering all of Kivotos' even after the regime change. Consequently, Sorasaki Hina's disillusionment with politics only deepened.\n\nIn this situation, Hina began to cling to the 'Eden Treaty' promoted by the §YGeneral Student Council President§!. Her hope was that by signing a peace treaty with Gehenna's hostile neighbor, §YTrinity General School§!, and establishing the ETO, she could offload Gehenna's security and all other burdens onto the §GETO§!. Sorasaki Hina intended to resign from all her posts once the Eden Treaty was signed. ...Had it not been for the Great Transfer, she would have done exactly that.\n\nThe chaos of the Great Transfer, which moved all of Kivotos to Earth, halted all diplomatic activities, including the Eden Treaty. With the Pandemonium Society's interference unabated, Hina and the Prefect Team had to shoulder new concerns. As Kivotos 'overwrote' Central Europe, §Rremaining Nazi forces§! who had lost their country began taking up arms to attack the Kivotosian population.\n\nFurthermore, the Gehenna tendency to view violence lightly became a problem. After a major civilian casualty event in Luxembourg, Sorasaki Hina hurriedly enacted the §YLuxembourg Regulations§!, prohibiting Gehenna students from possessing firearms in local residential areas. This move successfully prevented similar firearm crimes in Bavaria, where the Prefect Team had transferred.\n\nBut is the trouble truly over? In just 50 days, Hina's brilliant retirement plan has been permanently derailed, and a mountain of duties is pushing her to the breaking point. Pressure from both the Pandemonium Society and Trinity General School is intensifying, and since the Luxembourg Regulations, Gehenna citizens have begun denouncing the Prefect Team as a §RMilitary Junta§!. Even the local politicians don't seem to like us very much.\n\nCan Sorasaki Hina endure all these hardships? Or will she be crushed under the weight?\n\n§YDevelopment: Kangseul2702, SKSKIe, Sonetto§!"
 GEH_country_intro_header_1: "Post-Transfer Factions - Legal Local Parties"
 GEH_country_intro_content_1: "Since the Prefect Team headquarters transferred to the Bavarian region, their influence has been concentrated there. While staying in Bavaria, the Prefect Team has had to encounter various local political factions.\n\nThe Prefect Team decided to ignore Germany's existing Reichstag and decreed that central politics in Bavaria would be monopolized by the Prefect Team. Nevertheless, local city councils survived, and the Prefect Team granted the freedom to establish political parties, which had been banned since the Nazi regime took power. Various opposition parties that had been suppressed since 1933 were re-established, making Bavarian politics dynamic once again.\n\nAll German political parties were disbanded after the Nazi Enabling Act, but they were rebuilt following the Great Transfer and the Nazi collapse. The §OSocial Democratic Party (SPD)§! was a powerful left-wing party during the Weimar Republic and is the only institutional party that recognizes the Prefect Team's rule after the Transfer. The SPD highly values the anti-Nazi stance of the Gehenna Prefect Team and believes they can peacefully return to central politics through cooperation with them.\n\nThe §YBavarian People's Party§! is a local right-wing party. Since being rebuilt, they have resisted the Prefect Team under the motto 'Bavarian rule for Bavarians.' However, as they adhere to parliamentary principles and only continue passive condemnations within the local council permitted by the Prefect Team, they are not suppressed, but their social influence remains limited.\n\nThe §CCentre Party§! was an important right-wing party in the Weimar Republic, but within the territory limited to Bavaria under Prefect Team rule, it has weaker influence compared to the People's Party, which holds its main support base there. The Centre Party also opposes Prefect Team rule but focuses more on attacking the People's Party to expand its political power within the local council."
 GEH_country_intro_header_2: "Post-Transfer Factions - Illegal Resistance Forces"
 GEH_country_intro_content_2: "After the Great Transfer, the Prefect Team displayed strong hostility toward the National Socialist German Workers' Party—the Nazis. Analyzing the former ruling party's suppression of women's rights, racial minorities, and its destruction of other parties after rising to power through democratic procedures, the Prefect Team defined them as §YChaos§! that contradicts §YJustice and Order§! and must be destroyed.\n\nThe §YGerman Wehrmacht§! has continued guerrilla activities across Bavaria for 50 days since the Transfer, but they are fragmented and weak, making it certain they cannot resist long-term. A greater threat is the §YNazi Party§! member organizations. Unlike the Wehrmacht, which hides in forests and mountains, they resist within the cities. Unlike the SPD, People's Party, or Centre Party, they have been designated as a banned organization. However, young members view the Prefect Team society, ruled by women, as a §Rdecadent§! civilization and continue 'lone wolf' acts of defiance, such as urban bombings.\n\nThe §RCommunist Party of Germany (KPD)§! is the largest illegal party after the Nazi Party. Initially, the Prefect Team perceived them simply as a 'Red Winter Federal Academy of a parallel universe' and sought a friendly relationship. However, the KPD viewed the Prefect Team as another bourgeois dictatorship and began resisting, demanding the establishment of a 'Bavarian People's Republic' instead of compromise.\n\nAdditionally, the §GHelmet Gang§!, a Kivotos criminal organization that crossed over during the Transfer, is expanding its influence across Bavaria.\n\nAll resistance forces are a headache for the Prefect Team and enemies that lower social discipline, but as they are all fragmented and lack strong military power, they lack the capability to overthrow the Prefect Team system on their own."
 GEH_guide: "§Y$GEH_main_route_focus$§!\n£white_dot During the 1st Prefect Team Congress, neutrally accept the arguments of various factions.\n£white_dot Prevent Sorasaki Hina's resignation. You must annex the Pandemonium Society and Trinity and complete the 4th Congress before the resignation countdown expires.\n\n§C$GEH_ako_route_focus$§!\n£white_dot During the 1st Prefect Team Congress, unilaterally accept the Planning Department's arguments.\n£white_dot Prevent Sorasaki Hina's resignation. You must annex the Pandemonium Society and Trinity and complete the 4th Congress before the resignation countdown expires.\n    £white_dot If you make Hina and Ako start a romantic relationship, the resignation countdown will stop permanently.\n    £white_dot §RWARNING: Do not end their relationship while the Balance of Power is 'Indecisive.'\n                     This is the worst possible action and will permanently block access to the Ako route's ending content.§!\n\n§O$GEH_iori_route_focus$§!\n£white_dot During the 1st Prefect Team Congress, unilaterally accept the Execution Department's arguments.\n£white_dot Prevent Sorasaki Hina's resignation. You must annex the Pandemonium Society and Trinity and complete the 4th Congress before the resignation countdown expires.\n    £white_dot You can attack Manmajeon faster than in any other route.\n\n§P$GEH_hina_route_focus$§!\n£white_dot During the 1st Prefect Team Congress, unilaterally accept the Zealots' arguments.\n£white_dot Prevent Sorasaki Hina's resignation. You must annex the Pandemonium Society and Trinity and complete the 4th Congress before the resignation countdown expires.\n    £white_dot Completing the $GEH_gehenna_leader$ focus will permanently stop the resignation countdown.\n\n§GDerailment Routes§!\n£white_dot If Sorasaki Hina resigns, new 'Derailment Routes' entirely separate from the 4th Congress will appear.\n    £white_dot §Y$GEH_basking_in_the_brilliance_of_their_serenade_rout_n$§!: $GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start$\n    £white_dot §C$GEH_basking_in_the_brilliance_of_their_serenade_rout_a$§!: $GEH_basking_in_the_brilliance_of_their_serenade_rout_a_iroha$, $GEH_basking_in_the_brilliance_of_their_serenade_rout_a_kayoko$\n    £white_dot §O$GEH_basking_in_the_brilliance_of_their_serenade_rout_c$§!: $GEH_basking_in_the_brilliance_of_their_serenade_rout_c_free_fatherland_defense_alliance$, $GEH_basking_in_the_brilliance_of_their_serenade_rout_c_united_nation_reconstruction_committee$\n    £white_dot §P$GEH_basking_in_the_brilliance_of_their_serenade_rout_h$§!: $GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1$, $GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2$\n\n§gNow, your decisions will lead the Prefect Team.§!"

#Gehenna Hina
#Prologue
 GEH_start_focus: "The Path of the Iron Man"
 GEH_start_focus_desc: "Ultimately, the Prefect Team must prepare for this situation. No, Sorasaki Hina must take responsibility and resolve it. To do otherwise would be to crush the ideals and the fates of the many Gehenna students and Prefect Team officers who believe in and follow her. Therefore, Sorasaki Hina must step forward."

 GEH_zero_congress_focus: "1st Prefect Team Congress"
 GEH_zero_congress_focus_desc: "The situation has stabilized to some extent, and through our efforts, daily life is being restored. Prefect Team members are raising their voices, demanding a congress to determine our future and establish plans for the path ahead."

 GEH_Nuremberg_Wehrmacht: "Search of Nuremberg"
 GEH_Nuremberg_Wehrmacht_desc: "Unlike the raccoons of Manmajeon, who are eager to cooperate with the Nazi remnants and the Wehrmacht, the Prefect Team will not cooperate with National Socialists in any way for the sake of moral integrity. According to the Intelligence Department, a secret underground organization of Wehrmacht remnants is operating in Nuremberg. They must all be eliminated, even if it means urban warfare."

 GEH_Regensburg_Wehrmacht: "Search of Regensburg"
 GEH_Regensburg_Wehrmacht_desc: "Unlike the raccoons of Manmajeon, who are eager to cooperate with the Nazi remnants and the Wehrmacht, the Prefect Team will not cooperate with National Socialists in any way for the sake of moral integrity. According to the Intelligence Department, a secret underground organization of Wehrmacht remnants is operating in Regensburg. They must all be eliminated, even if it means urban warfare."

 GEH_focus_111111: "Regained Stability"
 GEH_focus_111111_desc: "There will never be cooperation with the Nazis. The Gehenna Prefect Team will fight for traditional order and morality, and we have thoroughly crushed the organized Wehrmacht that once swore loyalty to Adolf Hitler. By disarming the Wehrmacht remnants, we have resolved the greatest domestic security issue. The cell-based Nazi partisan guerrillas and the Helmet Gang members are not as significant a threat as the Wehrmacht was."

#Chapter 1
 GEH_Prefect_Team_muster: "Prefect Team Mobilization"
 GEH_Prefect_Team_muster_desc: "Amidst the chaos of the two months following the Great Transfer, many Prefect Team members chose to desert, abandoning the righteous cause of maintaining order and defending Gehenna. But contrary to the pessimists' thoughts, we have endured the past two months with order, and in time for the 1st Congress, the shaken departments of the Prefect Team are reorganizing and regaining their discipline."

 GEH_focus_can_only_be_completed_by_focus_tt: "This focus can start automatically while the §Y$FOCUS$§! focus is in progress."

 GEH_rework_focus_1: "Planning Department"
 GEH_rework_focus_1_desc: "The Planning Department, led by Amau Ako, is the core department responsible for the Prefect Team's administration and strategy formulation. Based on their excellent paperwork skills, they systematize the operation of the Prefect Team and support its efficient management by establishing various operations and policies."

 GEH_rework_focus_2: "Medical Department"
 GEH_rework_focus_2_desc: "The Medical Department, led by Hinomiya Chinatsu, is an important department responsible for the Prefect Team's medical support, specializing in the treatment and health management of combat personnel. Because the Medical Department has a weaker political standing compared to the Planning and Execution Departments, it has no possibility of seizing power alone."

 GEH_rework_focus_3: "Execution Department"
 GEH_rework_focus_3_desc: "The Execution Department, commanded by Shiromi Iori, is the core department that manages the Prefect Team's military power and handles combat training. They improve the combat capabilities of Prefect Team members through rigorous training programs and perform rapid and effective military operations when necessary to ensure the safety and goal achievement of the Prefect Team."

 GEH_fear_eyes: "Disciplinary Enforcement"
 GEH_fear_eyes_desc: "It has become certain that Manmajeon regards us with hostility.\nUnder these circumstances, it is time to perform 'Disciplinary Enforcement' on Manmajeon, which has been Gehenna's biggest problem."

 GEH_fear_eyes_tt: "Upon the start of $GEH_operation_countenance$, we will have §Y30 days§! to prepare before declaring war on [GEM.GetNameDef]. \n$GEH_fear_eyes_mission_tt$\n"
 GEH_fear_eyes_mission_tt: "Once the §Y$GEH_operation_countenance$§! mission is activated, the [GetOperationCountenanceTooltip] units will have §Y60 days§! to make [GEM.GetNameDef] surrender. If this deadline passes, they will attempt to join other factions, and our citizens will begin to worry about our military strength."

 GEH_shocked_by_surprise_attack: "Shocked by Surprise Attack"
 GEH_shocked_by_surprise_attack_desc: "The Prefect Team's strategy against us, 'Disciplinary Enforcement,' has shocked all of Manmajeon. Our forces were overwhelmed, our communication networks were severed, and we realized that summoning the other side's officials to demand an explanation was meaningless. While our side tries to grasp the situation, our diplomatic relations will be neutralized."

 GEH_preparations_for_operation_countenance: "Preparations for Operation Countenance"
 GEH_operation_countenance: "Operation Countenance"
 GEH_external_activities: "Prefect Team External Activities"
 GEH_external_activities_desc: "The Gehenna Prefect Team was the judicial enforcement agency of the massive Gehenna Academy before the Great Transfer. However, as they resolved numerous conflicts after the Transfer, they gradually separated due to disagreements with Manmajeon, eventually forming an independent warlord group. Therefore, the Prefect Team's diplomatic activities lie in pacifying Gehenna Academy and establishing a unified academy."

 GEH_trinity_preemptive_strike: "Trinity Preemptive Strike"
 GEH_trinity_preemptive_strike_desc: "It is time to end the long-standing ill will between Gehenna and Trinity. The entire leadership of Gehenna Academy has resolved to launch an all-out attack on Trinity, and we are now moving to bring an end to all this history. The final chapter for the glory and safety of Gehenna Academy and all its students is approaching."
 GEH_preparations_for_operation_fall_of_angel: "Operation Fall of Angel"
 GEH_preparations_for_operation_fall_of_angel_tt: "Upon the start of $GEH_preparations_for_operation_fall_of_angel$, we will have §Y30 days§! to prepare before declaring war on [TRM.GetNameDef]. We will declare war on [TRM.GetNameDef] immediately after the mission deadline ends."

 GEH_second_congress_focus: "2nd Prefect Team Congress"
 GEH_second_congress_focus_desc: "The political direction decided at the 1st Prefect Team Congress must now be discussed and drafted in earnest at the 2nd Congress."
 GEM_Start_nego_tt: "@GEM§Y[GEM.GetAdjective]§! is negotiating with @GEA§Y[GEA.GetName]§!"

 GEH_stabilization_of_gehenna_nation: "Stabilization of the Gehenna Nation"
 GEH_stabilization_of_gehenna_nation_desc: "We are the security agency representing all of Gehenna, and our security activities are carried out across the entire territory of Gehenna, regardless of whether Manmajeon exists. If we don't do this, who will?"

 GEH_cooperation_with_pandemonium: "Cooperation with Manmajeon"
 GEH_cooperation_with_pandemonium_desc: "Even Manmajeon has a minimum level of will to maintain security. Though I don't think [GEM.GetLeader] has the capability to do so. If we cooperate with them, we will be able to accomplish more."

 GEH_instigating_confusion_in_pandemonium: "Instigating Confusion in Manmajeon"
 GEH_instigating_confusion_in_pandemonium_desc: "We are the security agency representing all of Gehenna, which means that if we instigate intentional sabotage, we can cause confusion in Manmajeon's security capabilities and make Gehenna citizens feel greater dissatisfaction with Manmajeon. Though the justice-minded Prefect Team members might find this news uncomfortable."

 GEH_additional_leadership_personnel_employment: "Recruitment of Additional Prefect Team Members"
 GEH_additional_leadership_personnel_employment_desc: "Since the last congress, where a shortage of administrative personnel was confirmed, the administrative burden on the Gehenna Prefect Team has persisted. We must now pursue various recruitment methods to solve this problem."

 GEH_establishment_of_german_autonomous_government: "Establishment of German Autonomous Government"
 GEH_establishment_of_german_autonomous_government_desc: "The German People's Autonomous Government Committee, or German Autonomous Government for short, is an agency to integrate the German state governments under us, which began as we started appointing Germans to the administration."

 GEH_establishment_of_german_militia: "German Militia"
 GEH_establishment_of_german_militia_desc: "From the forcibly disbanded Wehrmacht to deserters and many former militiamen from both left and right—by mobilizing them, we can easily expand the Prefect Team's manpower."

## Iori Route ##
 GEH_iori_route_focus: "Shiromi Iori's Focus"
 GEH_preparation_of_war_with_pantemonium: "War Preparations Against [GEM.GetAdjective]"
 GEH_indiscriminate_conscription: "Introduction of Indiscriminate Conscription"
 GEH_propaganda_spread: "Propaganda Distribution"
 GEH_expulsion_of_pandemonium: "Expulsion of Pandemonium"
 GEH_systemic_militarization: "Systemic Militarization"
 GEH_injecting_hostility: "Injecting Hostility"
 GEH_leadership_of_the_executive_branch: "Leadership of the Execution Department"
 GEH_war_department: "War Department Integration Draft"
 GEH_military_leadership_committee: "Military Leadership Committee"

 GEH_iori_route_focus_desc: "Shiromi Iori proved her ability in the previous congress and has determined the direction of the Prefect Team, moving under the grand thesis of an attack on Manmajeon."
 GEH_preparation_of_war_with_pantemonium_desc: "The [GEM.GetAdjective] side has continued hostile acts against our Prefect Team since before the Transfer and has not hesitated to show official hostility since the Transfer. There is no future for the Prefect Team without completely destroying them!"
 GEH_indiscriminate_conscription_desc: "A massive struggle against Manmajeon requires the mobilization of numerous troops. Broad mobilization procedures will be established to mobilize both students and Germans for the upcoming advance."
 GEH_propaganda_spread_desc: "Distributing propaganda in areas under [GEM.GetAdjective] control will reveal Manmajeon's ugly ideals and boost support for the Prefect Team. At least for the time being. Even if it means abandoning our cause and ideals, negative political maneuvering and anti-Manmajeon populism must continue."
 GEH_expulsion_of_pandemonium_desc: "The time has come! The Prefect Team's army will advance rapidly into [GEM.GetAdjective] controlled territory. We must break the cycle of resentment and create a permanent peace for the Prefect Team."
 GEH_systemic_militarization_desc: "The Execution Department is the agency responsible for the broad use of force by the Prefect Team, and various military systems must be introduced to establish its dominant authority."
 GEH_injecting_hostility_desc: "By mandating hostile propaganda education against Manmajeon, we will solve the problem of students refusing war mobilization due to our low approval ratings."
 GEH_leadership_of_the_executive_branch_desc: "We cannot increase Sorasaki Hina's burden forever by conducting all military operations under her direct supervision. We will transfer the responsibilities weighing on Sorasaki Hina as an individual to the Execution Department. Now, the emphasis should be on the 'Prefect Team,' not the 'Head of the Prefect Team.'"
 GEH_war_department_desc: "The Prefect Team must now prepare for a broad war, and to assist in this, we will establish a War Department composed of key figures who perform similar roles to the Execution Department but are more experimental and prepared."
 GEH_military_leadership_committee_desc: "The rule of the Prefect Team must be preceded by Prefect Team members. Military glory and the establishment of doctrine are the reasons for the Prefect Team's existence and the foundation of its ideology. The planned War Department will now be officially incorporated as part of the department, marking the first step toward the national salvation stability and wide-area control of Gehenna Academy."

## Hina Route ##
 GEH_hina_route_focus: "Sorasaki Hina's Leadership"
 GEH_one_person_leadership_system: "One-Person Leadership System"
 GEH_firm_leadership: "Firm Leadership"
 GEH_gehenna_leader: "Leader of Gehenna"
 GEH_gehenna_leader_tt: "§RNow, Sorasaki Hina will not break, no matter what happens. Because that is her resolve.§!"
 GEH_distribution_of_propaganda_materials_in_gehenna: "Distribution of Propaganda in Gehenna"
 GEH_distribution_of_propaganda_materials_in_gehenna_tt: "Unlocks Occupation Law: §YUnified Gehenna Rule§!."
 GEH_national_unity: "National Unity"
 GEH_student_peoples_will: "Will of the Student People"
 GEH_distinction_of_zealous_members: "Distinction of Zealous Members"
 GEH_sorasaki_hina_quotes_compilation: "Compilation of Sorasaki Hina's Quotes"
 GEH_prefect_team_fanaticism: "Fanaticism of the Prefect Team"

 GEH_hina_route_focus_desc: "The paranoid status-quo policy brought about by Sorasaki Hina's increased responsibility eventually ended with the enthusiastic support of the entire Prefect Team. It is something neither Sorasaki Hina herself nor any of the Prefect Team officers wanted, but it must begin now."
 GEH_one_person_leadership_system_desc: "The Prefect Team always operates under Sorasaki Hina's final review. This provides strong political charisma and will significantly reduce backlash against Sorasaki Hina's policies."
 GEH_firm_leadership_desc: "\"The industries of the German Nazis who do not follow the leadership of Head Prefect Sorasaki Hina must be confiscated! All industry to the Prefect Team!\" - Sorasaki Hina Propaganda (Moderate)"
 GEH_gehenna_leader_desc: "For the sake of the fanatic zealots of the Prefect Team, Sorasaki Hina cannot step back. Now, Sorasaki Hina will use all means to ascend to her heavy position. Your Excellency Sorasaki, welcome to becoming the first premise of the Prefect Team."
 GEH_distribution_of_propaganda_materials_in_gehenna_desc: "If we spread the greatness of Head Prefect Sorasaki Hina throughout Gehenna, she will surely be pleased. This excellent enlightenment work must proceed immediately."
 GEH_national_unity_desc: "All of Gehenna must be integrated under the leadership of Head Prefect Sorasaki Hina. This is the will of every Prefect Team member and the future of Gehenna."
 GEH_student_peoples_will_desc: "Perhaps by turning all this fanatical zeal toward the students, Prefect Team members, and loyal Germans, she can escape from this intensity for a moment. Or perhaps forever."
 GEH_distinction_of_zealous_members_desc: "Prefect Team members loyal to the Head Prefect must be distinguished. This will begin by relegating disloyal members to obscure posts."
 GEH_sorasaki_hina_quotes_compilation_desc: "\"A book compiling the great sayings of Head Prefect Sorasaki Hina so that everyone in Gehenna can know them.\" - Description of the Sorasaki Hina Quote Compilation"
 GEH_prefect_team_fanaticism_desc: "The Head Prefect is surely the strong 'Iron Man' who will save this Prefect Team. We must uphold and remain loyal to her even more strongly. No entity shall challenge her authority!"

## Ako Route ##
 GEH_ako_route_focus: "Amau Ako's Plan"
 GEH_ako_route_focus_desc: "\"Let's all be honest. We know how much Head Prefect Hina has been overworking herself since the Great Transfer, don't we? You're just keeping quiet because you're afraid you'll have to take on her work if you bring it up. We have to help her now. If she collapses, will you take responsibility?\""

 GEH_deterioration_of_manmajeon_authority: "Manmajeon Defamation"
 GEH_deterioration_of_manmajeon_authority_desc: "\"I thought the Great Transfer was caused by Hanuma Makoto, that raccoon. Well, yeah. In the end, there was no physical evidence. The point is that the raccoon den known as Manmajeon is exploiting the Transfer. They're cooperating with the Nazi Wehrmacht and trying to sell Gehenna students to fascist adults! We need to promote that our Prefect Team, which refuses any cooperation with the Wehrmacht, is the organization that cares for Gehenna more than Manmajeon.\""

 GEH_abolition_of_authority: "De-authorization"
 GEH_abolition_of_authority_desc: "\"I'm not saying Head Prefect Hina isn't great! It's just that we have to admit she isn't an 'Iron Man' who can do *everything* for us. I plan to meet with her directly so that I, as the Senior Administrator, and the Planning Department can handle some of her national management duties on her behalf.\""

 GEH_prefect_team_democracy: "Prefect Team Democracy"
 GEH_prefect_team_democracy_desc: "Because it is a military organization, the Prefect Team has had a negative external image as a 'Warlord.' To solve this, we need to at least make the Prefect Team appear as a democratic and anti-authoritarian organization. We will reduce the public activities of the heavily armed Execution Department, and bureaucrats led by Amau Ako will take the lead in public outreach."

 GEH_relaxation_of_german_peoples: "Soothing the German People"
 GEH_relaxation_of_german_peoples_desc: "The Prefect Team—specifically Amau Ako—does not trust the so-called 'adults' of Germany. However, even if she has to suppress her hatred of the locals, Ako will personally stand before the local media to assure them that incidents like the 'Luxembourg Massacre' will never happen within the Prefect Team and that Germans will never become a 'slave' class of Gehenna."

 GEH_system_propaganda: "System Propaganda"
 GEH_system_propaganda_desc: "It's clear that the conservative local Germans aren't exactly thrilled about a new female leader. Ako believes that promoting the 'Great Organization: Prefect Team' rather than the 'Great Leader: [GEH.GetLeader]' is a better way to reduce local animosity. If support for the Prefect Team's police-state system rises, resentment toward the Head Prefect will naturally decrease."

 GEH_heroism_propaganda: "Prefect Team Heroism"
 GEH_heroism_propaganda_desc: "The reforms of Senior Administrator Ako and the Planning Department are strictly focused on reducing the power of the Execution and Intelligence Departments and reforming the Prefect Team from a mere warlord group into a modern bureaucratic state. While this is meant to reduce work overload by sharing duties among bureaucrats, there is a need to pacify the growing anger of the military and intelligence organizations by mixing in minimum compensation and heroic propaganda."

 GEH_sword_defending_gehenna_peoples: "The Sword Defending the People"
 GEH_sword_defending_gehenna_peoples_desc: "Senior Administrator Ako has transformed the Prefect Team from a mere warlord group into a reformed bureaucratic academy-state, drawing support from both Gehenna students and local Germans. Reducing the burden on Hina, who was suffering from overwork, is also a great achievement. Of course, the most significant result is that our efforts have led the people to see us not as a 'Warlord,' but as 'Guardians of Society.'"

## Normal Route ##
 GEH_main_route_focus: "Rule of the Prefect Team"
 GEH_main_route_focus_desc: "The hardline arguments of the Execution Department, which wanted a militaristic system, and the moderate arguments of the technocrats in the Planning Department have been at a constant stalemate. Ultimately, [GEH.GetLeader] decided on 'maintaining the status quo'... but in an unprecedented event like the Great Transfer, is maintaining the status quo really the right choice?"

 GEH_fortress_preparing_for_war: "Anti-Trinity Fortress"
 GEH_fortress_preparing_for_war_desc: "Is our most threatening enemy Manmajeon or Trinity? Both are likely threats, but fortifying the border with Trinity carries much less political burden than fortifying the border with Manmajeon. The new fortress isn't perfect, but it will at least stall a Trinity attack for a short time if war breaks out."

 GEH_continuing_rule: "Harmonizing Internal Conflicts"
 GEH_continuing_rule_desc: "The status-quo policy and the resulting failure of reform caused by the clash between the Execution and Planning Departments have created serious political conflict. The Head Prefect will admit that the failure of reform was due to her own lack of leadership rather than the fault of the two departments and will mediate the confrontation and internal factional struggles between them."

 GEH_improving_relationships_with_manmajeon: "Improving Relations with Manmajeon"
 GEH_improving_relationships_with_manmajeon_desc: "Ako looks cynically at the proposal to improve relations, saying 'it's a waste to spend even 1 Kivotos Yen on them,' but the Intelligence Department is concerned that Manmajeon has gained much stronger national power than the Prefect Team since the Transfer. If we don't have the capability to roll tanks into Gehenna Central District right now, it's better to postpone the war."

 GEH_pursuing_peaceful_unification: "Pursuing Peaceful Unification"
 GEH_pursuing_peaceful_unification_desc: "It's true we don't like Manmajeon, but we need to cooperate with them to face external threats like Trinity. Given the very special situation of the Great Transfer, even Manmajeon will seriously consider cooperating with us for now."

 GEH_preparing_for_civil_war: "Preparing for Civil War"
 GEH_preparing_for_civil_war_desc: "Since when have the raccoons of Manmajeon been plotting to destroy the Prefect Team? It's been so long I can't even remember. We must be prepared for a Manmajeon attack. And for that, thorough armament is necessary."

 GEH_bavaria_governance_method: "Bavaria's Prefect Team"
 GEH_bavaria_governance_method_desc: "While the Planning Department's concern that our Prefect Team is gradually becoming 'warlord-like' without innovative reform is growing, the Execution Department says a warlord state isn't necessarily negative. In any case, becoming a warlord state means our national power is concentrated on national defense, and they argue that surrounding nations will overestimate Bavaria's national power as a result."

 GEH_negotiation_with_german_delegation: "Negotiations with German Delegation"
 GEH_negotiation_with_german_delegation_desc: "Head Prefect [GEH.GetLeader] is not a raccoon from Manmajeon and, unlike Manmajeon, will never cooperate with the Nazis. Instead, we will contact the remnants of the Social Democratic Party. While the Prefect Team pushes for Labor Standards Act amendments for workers, the SPD member organization will encourage locals to enlist in our army to defeat the two evils of Manmajeon and Trinity."

 GEH_institutional_stabilization: "Institutional Stabilization"
 GEH_institutional_stabilization_desc: "There were many pessimistic predictions that the Prefect Team would fail to stabilize Bavaria due to the status-quo policy, but we still had sufficient capacity to maintain security and rule Bavaria. We have succeeded in destroying the pro-Nazi party in Bavaria, the Bavarian People's Party, and are taking control of the administration of all cities."

 GEH_industrial_development: "Industrial Development"
 GEH_industrial_development_desc: "A heavy industry promotion policy designed to revitalize industry in the Bavarian region has been devised, centered on the technocrats of the Planning Department. Kivotosian demi-humans and robot populations who lost their jobs after the Transfer will also be able to find work in the new factories."

#Chapter 2
 GEH_Conquer_the_Central: "Central District Offensive"
 GEH_Conquer_the_Central_desc: "A blitzkrieg on the Central District is one of the military operations planned by the Prefect Team to seize control of Gehenna Central District. We must aim to strike the heart of Manmajeon's power directly to break the enemy's morale and secure a strategic advantage."

 GEH_Officer_Appeasement: "Officer Appeasement"
 GEH_Officer_Appeasement_desc: "It is well known that Manmajeon is operated by a leadership group that is corrupt and significantly incompetent compared to the Prefect Team. We will be able to recruit officers to the Prefect Team who have ability but were not given important roles due to a lack of personal closeness with [GEM.GetLeader]."

 GEH_no_more_Heer: "Enforcing Discipline"
 GEH_no_more_Heer_desc: "We must ensure that students serving in the Prefect Team maintain discipline and properly follow civil rules. We must ensure the Prefect Team gains a reputation as a unit that possesses strong combat power, discipline, and respect."

 GEH_get_legitimacy: "Securing Legitimacy"
 GEH_get_legitimacy_desc: "Legitimacy isn't like a card game; you can't just get it as easily as drawing a new poker card. We must gain public support from both Kivotosians and Germans through active security activities, manage Head Prefect [GEH.GetLeader]'s popularity through propaganda, and prove through the implementation of policies that we are qualified to be the representatives of Gehenna, not just a mere warlord."

 GEH_get_legitimacy_trigger_tt: "@GEM§Y[GEM.GetName]§! is integrated with @GEA§Y[GEA.GetName]§!"

 GEH_focus_8: "Grand Offensive"
 GEH_focus_8_desc: "To completely destroy Manmajeon, we must not stop our offensive. We will crush Manmajeon from the outside through very aggressive tactics, even if this inflicts heavy damage on us as well."

 GEH_Securing_supplies: "Securing Supplies"
 GEH_Securing_supplies_desc: "Securing supplies to prepare for the coming war with Manmajeon is a critical issue. Fortunately, due to backlash against Manmajeon's close ties with the Wehrmacht, the German SPD organization has seized and provided us with physical assets like gold that the Nazis were holding in Bavarian regional banks."

 GEH_Armoury_Raid: "Armory Raid"
 GEH_Armoury_Raid_desc: "The number of factories left unmanaged and abandoned since the Great Transfer is so high it's not even reflected in statistics yet. The Intelligence Department has planned a raid to quickly transfer industrial facilities that Manmajeon failed to secure into our controlled territory. Manmajeon will realize too late what they've missed, but it will already be over."

 GEH_Pandemonium_Society_Building_Control: "Rally the Masses"
 GEH_Pandemonium_Society_Building_Control_desc: "The Prefect Team must lead the masses to bring down Manmajeon's tyranny. Let's rally not just the academy students, but the entire Kivotosian population living in Gehenna to participate in the revolution!"

#Chapter 3
 GEH_first_congress_focus: "3rd Prefect Team Congress"
 GEH_first_congress_focus_desc: "The Prefect Team has emerged with a strong presence in the chaotic political situation of Kivotos, overcoming all adversities. Numerous Prefect Team members are raising their voices, saying we should hold a congress to prepare for the future and change Gehenna."

 GEH_Army_Reformation: "Execution Department Reorganization"
 GEH_Army_Reformation_desc: "The Execution Department is the department currently responsible for national defense in Gehenna. The recent war with Manmajeon revealed major flaws in the Execution Department."

 GEH_Leverage_Perfect_team_strengths: "Execution Department Specialization"
 GEH_Leverage_Perfect_team_strengths_desc: "The abilities of Kivotosians with halos are far superior to those of local human armies. If we make the Execution Department elite and train each member into elite personnel, Gehenna Academy's military power will also increase significantly."

 GEH_army_focus_tt: "§gThis is a military reform focus based on a strong but small workforce.§!"
 GEH_army_focus_2_tt: "§gThis is a standard military reform focus with no special characteristics.§!"

 GEH_look_to_the_west: "Lessons of War"
 GEH_look_to_the_west_desc: "The civil war with Manmajeon made us realize that we must possess large-scale military power, not just the small-scale warfare we experienced in Kivotos. It is time to consider more actively accepting local human personnel into the army and increasing the size of our forces."

 GEH_Gehenna_Rebuilding: "Planning Department's Plan"
 GEH_Gehenna_Rebuilding_desc: "The economic plan designed by Senior Administrator Amau Ako will be a great help to the haphazard Gehenna economy. The proposal has already been delivered to the Head Prefect."

 GEH_approve_plan: "Budget Allocation"
 GEH_approve_plan_desc: "The Head Prefect has approved Amau Ako's economic plan and allocated an appropriate budget. Under a thorough and perfect plan, Amau Ako will revive the Gehenna economy."

 GEH_first_five_year_plan: "1st Five-Year Plan"
 GEH_first_five_year_plan_desc: "While peace lasts, we must promote industrialization more quickly according to the plan. Because we can take over the industrialization plans of the previous German government, our industrialization is gaining even more momentum."

 GEH_nationalise_railways: "Gehenna Railways"
 GEH_nationalise_railways_desc: "It is not just roads that connect Gehenna. Railways are also the lifeline of Gehenna. Regarding the railways heavily damaged in the last war, Highlander Railway Academy claims that 'railways built by the German government are not our concern.' In the end, we are the ones who need them, so we must use our budget for railway repairs as well."

 GEH_factory_focus_1: "Recycling Abandoned Factories"
 GEH_factory_focus_1_desc: "While investigating western Gehenna, the Execution Department discovered numerous factories along the river. Investigations by the Intelligence Department confirmed that this was an industrial zone secretly created by the former Adolf Hitler regime to expand armaments in violation of the Treaty of Versailles. Wouldn't it be better for us to use these facilities than for the Nazis to use them?"

 GEH_factory_focus_3: "National Defense Fund"
 GEH_factory_focus_3_desc: "In the process of Gehenna's unification, we spent massive war costs. We plan to conduct a national defense fund drive targeting Gehenna citizens for national reconstruction. As it is a voluntary collection, it will have its limits, but it will buy us time to heal the wounds from the unification process."

 GEH_factory_focus_4: "Heavy Industry Restructuring"
 GEH_factory_focus_4_desc: "In the process of developing heavy industry, we confirmed the influx of corrupt Kivotosian capital. If the Gehenna government takes the lead in controlling things to eradicate corruption and bribery and to ensure new companies can develop without collusion, our industrial power can continue to grow."

 GEH_factory_focus_6: "Production Increase"
 GEH_factory_focus_6_desc: "Gehenna's unique production methods cannot surpass other academies. By implementing new production methods and introducing new technologies, we must match or surpass other academies."

 GEH_control_market_investment: "Controlled Market Investment"
 GEH_control_market_investment_desc: "By activating various market investments for controlled companies that occupy a large part of our economic policy, we will subordinate domestic capital to the Prefect Team and form a flexible and realistic market structure."

 GEH_prefect_team_priority: "Prefect Team First"
 GEH_prefect_team_priority_desc: "We must not forget the principle that all economic policies must ultimately be operated for the sake of the Prefect Team and its members. we will consider the operation of the Prefect Team as the top priority in economic policy."

 GEH_vertical_integration: "Vertical Integration"
 GEH_vertical_integration_desc: "Various economic programs will be conducted under the optimized bureaucracy of the Prefect Team. Through vertical integration of industry and central control, we will form an efficient economic structure in various aspects."

 GEH_Cooperation_with_HID: "Expansion of the Intelligence Department"
 GEH_Cooperation_with_HID_desc: "It is a widely known fact that Sorasaki Hina was originally from the Intelligence Department. Although not everyone likes the secret activities of the Intelligence Department, everyone will agree that it is important to know about the enemy in advance and take countermeasures."

 GEH_hit_wehrmacht: "Attack on the Wehrmacht"
 GEH_hit_wehrmacht_desc: "Even though we completely annihilated the Wehrmacht in the Bavarian region, the cancer-like old Wehrmacht organization continues its resistance across western Germany. They are like a cancer to Gehenna, so no mercy should be shown."

 GEH_hit_wehrmacht_2: "Takeover of State Governments"
 GEH_hit_wehrmacht_2_desc: "By taking over German state governments, we can weaken the administrative burden on the Prefect Team and easily secure control over local governments."

 GEH_HID_benriya: "Doubts about Luxembourg Sovereignty"
 GEH_HID_benriya_desc: "The Grand Duchy of Luxembourg is the only local nation that preserved its national identity among Western European countries after the Transfer. The problem is that many Luxembourgers have been replaced by Gehenna citizens since the Transfer, and the presence of Aru, who is protecting Luxembourg, also poses a threat to us. Hardliners in the Prefect Team are demanding a preventive war against Luxembourg."

 GEH_benriya_annex: "Luxembourg Annexation"
 GEH_benriya_annex_desc: "The state known as the Grand Duchy of Luxembourg will be dissolved, and Rikuhachima Aru and her colleagues will be tried and expelled. This may be cruel to them, but Luxembourg, which already has a sufficient Gehenna population, is good prey to be 'Gehenna-fied.'"

 GEH_benriya_tolerate: "Prefect Team-Affiliated Problem Solver 68"
 GEH_benriya_tolerate_desc: "Discarding the talented individuals of Problem Solver 68 just to annex a small country is not a rational choice. Let's permit Rikuhachima Aru to continue autonomy in Luxembourg as she pleases. In exchange, Problem Solver 68 will be appointed as Prefect Team officers, and they will have the duty to be loyal to the Prefect Team in times of national crisis."

 GEH_HID_trinity: "Eyes in the Dark"
 GEH_HID_trinity_desc: "Even if the Prefect Team has defeated Manmajeon, there may still be people inside who communicated with them. We must monitor and record them from the shadows."
 GEH_HID_millennium: "Military Surveillance System"
 GEH_HID_millennium_desc: "\"A complete watch over the gears of war.\""
 GEH_preventive_attack: "'Preventive War'"
 GEH_preventive_attack_desc: "\"Striking before the shadow grows too long.\""

 GEH_Army_focus_1: "Equipment Improvement"
 GEH_Army_focus_1_desc: "Due to the fundamental limitation of being a security agency, the quality of weapons provided to Prefect Team members did not reach regular army levels. In the process of Gehenna's unification, we confirmed that the armament level of Prefect Team soldiers was lower than that of Manmajeon soldiers, and budget investment to improve this is being discussed."

 GEH_Army_focus_3: "Field Artillery Development"
 GEH_Army_focus_3_desc: "In Kivotos before the Transfer, Sorasaki Hina herself was the Prefect Team's most powerful fire support, but with territory growing and the problem of depleting mystery, the same form of warfare as before the Transfer is no longer possible. The alternative is to expand artillery units and (even if just a little) recreate the power that mystery had in Kivotos through artillery."

 GEH_Army_focus_2: "Terrain Adaptation"
 GEH_Army_focus_2_desc: "The beautiful days when we only had to fight urban warfare against the Helmet Gang on the well-paved wide roads of the Gehenna district are over. Now the Prefect Team must move with combat in mountains, hills, forests, and plains in mind. We need to invite graduates of the former SRT to create tactical manuals considering various terrains."

 GEH_DNVP_focus_3: "[GEH_DNVP_focus_3_text]"
 GEH_DNVP_focus_3_desc: "We will proceed with reforms for the Execution Department through the lessons of war."

 GEH_DNVP_focus_3_1: "Execution Department Expansion"
 GEH_DNVP_focus_3_1_desc: "The Execution Department is our Gehenna's Ministry of Defense, and this war has shown that it needs a larger and more massive scale. Recruiting more Execution Department members and expanding its scale will help resolve future security crises."

 GEH_DNVP_focus_3_2: "Acceleration of Elitization"
 GEH_DNVP_focus_3_2_desc: "After the Transfer, we realized the physical ability difference between the Kivotosian population with halos and humans without halos is clear. Concentrating on a small elite army rather than many weak soldiers without halos might be a good alternative."

 GEH_Army_focus_5: "Elite Core"
 GEH_Army_focus_5_desc: "There are many Prefect Team members, but only a few of them participated in the unification war. From this, we have learned that pouring a large number of personnel into the battlefield is inefficient and that the systematic cultivation of elite personnel is more important than anything else."

 GEH_prefect_army_focus_2: "Combined Arms"
 GEH_prefect_army_focus_2_desc: "The coordination of a swift and organic command system showed the results with the least unit loss rate on the new world's battlefields. We must quickly introduce combined arms, which is still in the testing phase."

 GEH_prefect_army_focus_3: "Thorough General Staff Education"
 GEH_prefect_army_focus_3_desc: "Before the Transfer, the Prefect Team's combat power had a deformed structure that relied solely on Sorasaki Hina's personal strength and command. Through systematic education, we will be able to cope with the enemy even in situations where Head Prefect Hina cannot be at the forefront of every battlefield as she was before."

 GEH_prefect_DNVP_focus_3: "Prefect Team Special Officer Corps"
 GEH_prefect_DNVP_focus_3_desc: "Our plan to promote the elitization of the Prefect Team is progressing successfully. To support students who stand out in various wars, the Prefect Team has decided to create a Special Officer Corps to give them full support."

 GEH_Army_focus_6: "Expansion of Conscription"
 GEH_Army_focus_6_desc: "Since the Transfer, the Prefect Team has consistently kept its distance from local Germans. However, through the war with Manmajeon, it has been concluded that with Kivotosians becoming a minority population in Gehenna, it is impossible to possess national defense power capable of defending Gehenna without recruiting more local personnel."

 GEH_west_army_focus_2: "Utilization of New Branches"
 GEH_west_army_focus_2_desc: "Manmajeon's tank, Toramaru, which fought back until the end in the Gehenna Unification War before being destroyed by our forces, left a great impression on the Prefect Team officers. Armored divisions are a new branch that will lead the future Prefect Team, and they are worth investing in no matter how expensive the cost."

 GEH_west_army_focus_3: "Mediating Conflict Between Execution and Planning"
 GEH_west_army_focus_3_desc: "The Execution Department, which has taken on the role of a de facto Ministry of Defense since the Transfer, and the Planning Department, a technocratic organization responsible for administration and economy, actually don't get along that well. Regardless of the personal relationship between the leaders of the two organizations, Iori and Ako, factional conflict between the organizations makes efficient military budget allocation difficult. While we cannot completely eliminate factional conflict, it will at least be possible to try to 'ease' it."

 GEH_west_DNVP_focus_3: "Officer Academy Within the Academy"
 GEH_west_DNVP_focus_3_desc: "Since the Transfer, we have realized how to command soldiers on the new battlefields and have newly created an adaptation training course for general soldiers of the Prefect Team Execution Department. We might not be able to make every soldier elite, but we can help them pull their weight!"

 GEH_Army_focus_7: "Gehenna's New Army"
 GEH_Army_focus_7_desc: "Raise the flag of Gehenna and let the enemy know the Prefect Team has arrived! Our military development is an achievement that no leader of Gehenna has accomplished until now. The name Gehenna Prefect Team will remain in history as a name that makes surrounding nations tremble with fear."

 dldhfl_flag: "$BA_news.52.t$"
#Chapter 4

 GEH_Trinity_war: "Trinity Invasion Plan"
 GEH_Trinity_war_desc: "Gehenna and the [TRM.GetName] side have been traditional enemies, and it is clear that the existence of [TRM.GetLeader] in particular poses a serious security threat to us. If they are preparing to invade us, we need to attack them first."

 GEH_war_factory_focus_1: "Expansion of Military Facilities"
 GEH_war_factory_focus_1_desc: "For the Eden showdown with Trinity, Gehenna must have the capability to produce military supplies in the long term. We need to expand military facilities and possess the strategic capability to carry out a long-term war."

 GEH_war_factory_focus_3: "Acquisition of Underground Industry"
 GEH_war_factory_focus_3_desc: "The Eden showdown was brought about by Trinity's ambition to completely destroy Gehenna. If this war ends in Trinity's victory, not even a small shrub will remain in Gehenna. Therefore, our seizure and utilization of the assets of criminal organizations is, in a sense, an agape policy that even considers the future of criminals."

 GEH_war_factory_focus_4: "Gehenna Field Artillery"
 GEH_war_factory_focus_4_desc: "This is Gehenna's unique field artillery, improved directly by Gehenna Prefect Team engineers. We are ready to smash Trinity's artillery units using powerful firepower. Of course, we'll see on the battlefield how much of a role the new weapon can play!"

 GEH_war_focus_2: "Establishment of Propaganda Department"
 GEH_war_focus_2_desc: "The Eden showdown is an unprecedented event in Gehenna's history. And we must utilize all available assets. We must establish a Propaganda Department to promote the Prefect Team's achievements during the war and expand support for the Prefect Team."

 GEH_war_focus_3: "Focus on Gehenna Defense"
 GEH_war_focus_3_desc: "Our most significant goal is to defend Gehenna from Trinity's attack. This is a time to focus on defense and strengthen our resolve not to retreat even a single step."

 GEH_unlimited_conscription: "Removal of Conscription Limits"
 GEH_unlimited_conscription_desc: "\"No student left behind from the duty of defense.\""

 GEH_chinatsu_focus_1: "Medical Department Reinforcement"
 GEH_chinatsu_focus_1_desc: "The Medical Department has not received proper treatment until now due to its lack of political foundation. However, to reduce the damage to Prefect Team members in a wartime situation, the support of the Medical Department is very desperate."

 GEH_chinatsu_focus_2: "Medical Units"
 GEH_chinatsu_focus_2_desc: "The establishment of new medical units is an attempt to introduce the concept of field hospitals, which were unfamiliar to the Prefect Team until now, going beyond just focusing on the treatment of Prefect Team members transported to the rear."

 GEH_chinatsu_focus_4: "Women of the Frontline!"
 GEH_chinatsu_focus_4_desc: "Although our Prefect Team sees the locals who try to meddle in Gehenna politics as nothing more than opportunists, the German radical feminist social activist Anita Augspurg praised the Prefect Team as an organization composed only of women. She promised to systematically encourage feminists to enlist in the army if innovative negotiations on German women's labor rights are held."

 GEH_war_focus_7: "Gehenna Defense Plan"
 GEH_war_focus_7_desc: "With Trinity's army threatening our territory, we need the best strategy to defend the homeland. We cannot retreat even one step."

 GEH_war_focus_8: "Gehenna Recovery Plan"
 GEH_war_focus_8_desc: "It is time to recover territory lost due to the enemy's strong offensive and, conversely, prepare to advance toward Trinity."

 GEH_war_focus_9: "Trinity Offensive Plan"
 GEH_war_focus_9_desc: "We are ready to defeat [TRM.GetLeader]'s army and plunge a sword into the heart of the enemy. Let's carry out an offensive for the glory of Gehenna. Long live [ROOT.GetLeader]! May the freedom of Gehenna never fade!"

#Naval Reform
 GEH_prefect_team_navy: "Militarization of the Gehenna Maritime Prefect Team"
 GEH_prefect_team_navy_desc: "Gehenna has developed from a landlocked country into a maritime nation with a coastline, and the first project to militarize the Prefect Team maritime forces, which until now were just guards protecting rivers and lakes, into an organized 'army' has begun."

 GEH_prefect_team_navy_marine: "Marines"
 GEH_prefect_team_navy_marine_desc: "To strike enemies across the sea, discussions have been held to train small-scale marines centered on local personnel. We will be able to take decisive international action against enemies of Kivotos, such as [GEI.GetName], during the most dangerous times."

 GEH_prefect_team_navy_disciplinary_committee: "Execution Department Navy Section"
 GEH_prefect_team_navy_disciplinary_committee_desc: "As the Prefect Team maritime police were militarized, discussions were held on whether they should become an independent department. Since the size of the Gehenna navy is not expected to be large, we will not classify the navy as a separate organization but incorporate it under the existing 'Navy Section' of the Execution Department."

 GEH_prefect_team_navy_disciplinary_committee_transport: "Beyond Inner Tubes"
 GEH_prefect_team_navy_disciplinary_committee_transport_desc: "The Prefect Team was using special inner tubes for use at the beach even before the Transfer... but it is no longer possible to transport Prefect Team members just by floating on the sea with tubes. The replenishment of transport ships will be the driving force that allows us to move further."

 GEH_prefect_team_navy_disciplinary_committee_submarine: "Safe Approach Method"
 GEH_prefect_team_navy_disciplinary_committee_submarine_desc: "Watching Head Prefect Sorasaki Hina dive vigorously into the sea for combat swimming training only to sink straight down during a maritime training session before the Transfer, the Prefect Team realized that even those with great power cannot overcome the force of the ocean floor. Not that they mean to insult Head Prefect Hina, but the Execution Department argues based on that experience that we need to more actively utilize 'the power under the sea.'"

 GEH_prefect_team_navy_disciplinary_committee_destroyer: "Coastal Navy"
 GEH_prefect_team_navy_disciplinary_committee_destroyer_desc: "The Gehenna Prefect Team's activities were carried out only on land. There are no experts in the Execution Department who know deeply about the sea, and we must accept the reality that it will not be easy for our navy to move beyond a coastal navy. Even if we create the smallest and cheapest destroyers, there is currently no institution to even educate the officers who would sail them. We might create a few small destroyers, but we won't expect more than that."

 GEH_prefect_team_navy_disciplinary_committee_defense: "Coastal Defense"
 GEH_prefect_team_navy_disciplinary_committee_defense_desc: "To be honest, no one is confident that the navy operated by our Execution Department can win against other navies. It's certain that our destroyers would be sunk first even in a naval battle with a tourist cruise ship from Odysseia Academy. With [ROOT.GetLeader]'s consent, we have decided to assume we will eventually lose in naval battles and focus on building maritime fortresses to deny enemy landings."

 GEH_prefect_team_navy_disciplinary_committee_officer: "Recruiting Former Valkyrie Maritime Police"
 GEH_prefect_team_navy_disciplinary_committee_officer_desc: "Does anyone here have experience sailing a boat? No, I mean, excluding having steered one in that boring Millennium game called Hearts of Kivotos. Yeah. No one, right? The only alternative is to recruit instructors from the Valkyrie Police Academy. We'll have to pay them a lot... but they'll be better than you lot who have only sailed boats on game consoles."

 GEH_prefect_team_navy_disciplinary_committee_valkyrie_BD: "Purchase of Valkyrie BDs"
 GEH_prefect_team_navy_disciplinary_committee_valkyrie_BD_desc: "Since we lack the ability to operate normal naval doctrine, it will be perfect to purchase the BDs that the Valkyrie Maritime Police were using for educational purposes and follow them exactly. Of course, as it is an educational program for maritime police, it won't be suitable for large-scale naval battles."

 GEH_prefect_team_independent_navy: "Gehenna Kriegsmarine"
 GEH_prefect_team_independent_navy_desc: "Cowards say that our Gehenna has never trained a navy and therefore creating a blue-water navy is a fantasy. However, for the Gehenna led by our great leader Head Prefect Sorasaki Hina to operate something like a coastal navy is not only shameful but an insult to [ROOT.GetLeader]. A great motherland needs a great navy, and cowardly opponents will have their limbs tied and be thrown into the North Sea."

 GEH_prefect_team_independent_navy_carrier: "Sorasaki-class Aircraft Carrier"
 GEH_prefect_team_independent_navy_carrier_desc: "We have more advanced technology than the locals, and therefore we also know what kind of end grand battleships 'eventually' face. The most rational start for a blue-water navy must begin with carrier strike groups. And the construction plan for the Sorasaki-class aircraft carrier, named after the great mother of Gehenna, Sorasaki Hina, has been approved."

 GEH_prefect_team_independent_navy_navalized_aircraft: "Carrier-Based Aircraft Plan"
 GEH_prefect_team_independent_navy_navalized_aircraft_desc: "Through the introduction of more advanced carrier-based aircraft technology, we will ensure Gehenna's aircraft carriers can advance even further."

 GEH_prefect_team_independent_navy_destroyer: "Fleet Expansion"
 GEH_prefect_team_independent_navy_destroyer_desc: "Surrounding nations will not wait forever until we build a blue-water navy. Even if we invest a massive budget, we must expand our fleet at a rapid pace."

 GEH_prefect_team_independent_navy_dockyard: "Gehenna Shipyard District"
 GEH_prefect_team_independent_navy_dockyard_desc: "Our great fleet requires even more budget! The largest and greatest shipyard districts possible will be built in our coastal cities."

 GEH_prefect_team_independent_navy_german_officer: "German-style Officer Training"
 GEH_prefect_team_independent_navy_german_officer_desc: "With the help of German naval officers living in Gehenna territory, we need to cultivate young and capable officers to lead Gehenna's new navy."

 GEH_prefect_team_independent_navy_oil: "Miraculous Crude Oil"
 GEH_prefect_team_independent_navy_oil_desc: "A blue-water navy requires massive amounts of crude oil. But oil cannot be extracted from this German land. Importing crude oil from appropriate foreign countries is a rational method, but there is a possibility of a hit to crude oil imports in a wartime situation. This is a rational reason why we must invest in the synthetic crude oil industry."

#Air Force Reform
 GEH_prefect_team_luftwaffe: "Gehenna Luftwaffe"
 GEH_prefect_team_luftwaffe_desc: "The Prefect Team was ultimately a security organization and did not possess an organized air force. Manmajeon might have possessed some aircraft, though. However, we have contacted 'Junkers,' an aviation company that had its property rights violated by the Nazis but regained freedom thanks to our anti-Nazi Gehenna Prefect Team, and we have been able to receive their help. The Gehenna Luftwaffe flies toward the brilliant sky."

 GEH_prefect_team_luftwaffe_primitive_helicopter: "Primitive Helicopters"
 GEH_prefect_team_luftwaffe_primitive_helicopter_desc: "We possessed several Prefect Team helicopters even before the Transfer. But since there was no way for us to mass-produce these helicopters on our own after the Transfer, we instead entrusted one of them to Junkers and proposed reverse engineering. Junkers engineers hardly understood the structure of our helicopters, which possessed technology decades ahead of their own, but they were somehow able to create a primitive airframe that flies via propellers through reverse engineering."

 GEH_prefect_team_luftwaffe_true_helicopter: "Gehenna Helicopters"
 GEH_prefect_team_luftwaffe_true_helicopter_desc: "Junkers' initial helicopters were at a quite crude level, but as we were able to obtain more diverse data after dominating all of Gehenna, the reconstruction of modern helicopters became possible."

 GEH_prefect_team_luftwaffe_junkers: "Gehenna Junkers Expansion"
 GEH_prefect_team_luftwaffe_junkers_desc: "Through cooperation between local businessmen and Kivotosian businessmen, Gehenna Junkers is growing in scale. Since we lack air force technology, the help of German companies is very desperate. Let's support Junkers expansion and support them so they can continue to create the best air force power in Gehenna in the future."

 GEH_prefect_team_luftwaffe_therese_junkers: "Therese Junkers"
 GEH_prefect_team_luftwaffe_therese_junkers_desc: "Junkers was also the company that suffered the most cruel suppression by the Nazis. The previous representative, Hugo Junkers, died after being placed under house arrest, and after his death, his wife Therese Junkers, who became the leader of the company, handed over all corporate rights to the Hitler regime in 1935 due to Nazi threats. But times have changed. Therese has regained all rights to Junkers and is ready to invest in research for new planes for Gehenna."

 GEH_prefect_team_luftwaffe_fighter_design: "Fighter Research"
 GEH_prefect_team_luftwaffe_fighter_design_desc: "Through cooperation with Junkers, we have been able to secure more advanced air power."

 GEH_prefect_team_luftwaffe_tactical_bombers: "Tactical Bombing Plan"
 GEH_prefect_team_luftwaffe_tactical_bombers_desc: "Junkers has presented us with a new bomber draft, which seems valuable enough for actual combat use."

 GEH_prefect_team_luftwaffe_multi_role_aircraft: "Air Force Innovation Plan"
 GEH_prefect_team_luftwaffe_multi_role_aircraft_desc: "To prepare for war with surrounding nations including Trinity, we need more innovative and advanced aerial weapons. With the help of Therese Junkers and the brilliant engineers she hired, we have been able to prepare a more 'innovative' air force reform plan. The funding documents for [ROOT.GetLeader] have already been approved."

 GEH_prefect_team_luftwaffe_long_range_bombing: "The Prefect Team Can Never Be Avoided"
 GEH_prefect_team_luftwaffe_long_range_bombing_desc: "We have begun discussions on a new strategic bombing plan to fly long distances and bomb the enemy rear. Kivotosian engineers newly incorporated into Junkers say this is not mere fantasy but a fully realizable plan."

 GEH_prefect_team_luftwaffe_jet: "Engine Start"
 GEH_prefect_team_luftwaffe_jet_desc: "Better engines, and fighters that fly faster! The efforts of Kivotosian engineers are finally beginning to see the light."

 GEH_prefect_team_luftwaffe_anti_air: "Gehenna Anti-Air Network"
 GEH_prefect_team_luftwaffe_anti_air_desc: "While we are developing our air force, other countries including Trinity will also be cultivating their air forces. Rather than thinking only of attack, preparing for defense is a rational alternative."

 GEH_prefect_team_luftwaffe_nuke: "Final Chapter"
 GEH_prefect_team_luftwaffe_nuke_desc: "Have we really finished all preparations? Can we say we've prepared everything we can do in the sky? ...Is there something we've missed?"

#Chapter 5
 GEH_three_congress_focus: "4th Prefect Team Congress"
 GEH_three_congress_focus_desc: "In the place where the waves swept past, the Prefect Team and Gehenna remained standing firmly, and before we knew it, a day in Kivotos became a memory from the distant past.\nNumerous Prefect Team members are raising their voices, saying we must hold the 4th Prefect Team Congress. And at this congress, our future will be decided."
 GEH_three_congress_focus_trigger: "Complete 3 or more of the focuses below the §Y$GEH_Army_Reformation$§! focus tree"
 GEH_three_congress_focus_tt: "§CSorasaki Hina will not break anymore.§!"
 GEH_three_congress_focus_no_hina: "A Day Without the Head Prefect"
 GEH_three_congress_focus_no_hina_desc: "After a long night with an ominous darkness looming. Something that should not have happened has happened.\nSince Head Prefect Sorasaki Hina is currently absent, we must resolve the problem urgently."
 GEH_three_congress_focus_no_hina_can_only_be_completed_by_focus_tt: "This focus will start automatically if §Y$GEH_hina$§! has §Scollapsed§!."
 GEH_BTBOTS_END_flag: "§Y$GEH_hina$§! is in a §Scollapsed§! state"
 GEH_BTBOTS_END_NEXT_flag: "Successfully dealt with §Y$GEH_hina$§!'s absence"
 GEH_three_congress_focus_no_hina_htt: "Since we entered the §Y$GEH_hina_route_focus$§! focus tree, the largest political change within the Prefect Team will occur."
 GEH_three_congress_focus_no_hina_att: "Since we entered the §Y$GEH_ako_route_focus$§! focus tree, §Y$GEH_dkzh$§! will seize power."
 GEH_three_congress_focus_no_hina_ctt: "Since we entered the §Y$GEH_iori_route_focus$§! focus tree, §Y$GEH_dldhfl$§! will seize power."
 GEH_three_congress_focus_no_hina_ntt: "Since we maintained the political balance of the Prefect Team, §Y$GEH_dkzh$§! will perform acting duties."
 GEH_three_congress_focus_no_hina_ftt: "§RSince we did not complete the §Y$GEH_second_congress_focus$§! focus, the game ends.§!"
 GEH_trinity_focus_1: "Prohibition of Trinity Idolatry"
 GEH_trinity_focus_1_desc: "\"No more halos of the wing-bearers shall be worshipped in this land.\""
 GEH_trinity_focus_2: "Strengthening Control"
 GEH_trinity_focus_2_desc: "\"Under the gaze of the Prefect Team, no shadow shall move without permission.\""
 GEH_trinity_focus_3: "Gehenna Reconstruction Project"
 GEH_trinity_focus_3_desc: "\"Building the future of the horned students over the ruins of the past.\""
 GEH_trinity_focus_4: "Establishment of Local Police"
 GEH_trinity_focus_4_desc: "\"Teaching the locals the true meaning of discipline.\""
 GEH_trinity_focus_5: "Academy of Steel"
 GEH_trinity_focus_5_desc: "\"A fortress forged in iron, where only the strong survive.\""
 GEH_trinity_integration: "Trinity Integration"
 GEH_trinity_integration_desc: "To win the great war with Trinity and prevent a second conflict from occurring in the future, the completion of the 'Eden Treaty' is inevitable. We will use all military and political means to integrate Trinity into Gehenna Academy."
 GEH_trinity_integration_target: "Ease Resistance in [FROM.GetName] State"
 GEH_trinity_integration_target_tt: "Integration procedures for [FROM.GetName] state will be prepared.\n"
 GEH_trinity_integration_complete: "[FROM.GetName] State Integration Procedure"
 GEH_last_focus_3: "Result"
 GEH_last_focus_3_desc: "Gehenna's unification, Trinity's threat. All those problems came rushing in like waves, but the Prefect Team stood firm. Now we have become the only lamp finding Gehenna's future and lighting the way."
 GEH_last_focus_3_tt: "The §Yfollow-up focus tree§! appears."
 GEH_last_focus_3_h_tt: "Since we entered the §Y$GEH_hina_route_focus$§! focus tree, the §Y$GEH_last_focus_effect_h_rout$§! focus tree appears."
 GEH_last_focus_3_a_tt: "Since we entered the §Y$GEH_ako_route_focus$§! focus tree, the §Y$GEH_last_focus_effect_a_rout$§! focus tree appears."
 GEH_last_focus_3_c_tt: "Since we entered the §Y$GEH_iori_route_focus$§! focus tree, the §Y$GEH_last_focus_effect_c_rout$§! focus tree appears."
 GEH_last_focus_3_n_tt: "Since we maintained the political balance of the Prefect Team, the §Y$GEH_last_focus_effect_normal_rout$§! focus tree appears."

 GEH_woe_to_the_vanquished: "Woe to the Vanquished"
 GEH_woe_to_the_vanquished_desc: "\"The price of defeat is paid in tears and silence.\""
 GEH_woe_to_the_vanquished_2: "One Gehenna, One Leader"
 GEH_woe_to_the_vanquished_2_desc: "\"All voices merged into a single, unshakeable command.\""

 GEH_NEXT_Army_focus_1: "Lessons of the Eden War"

#Chapter 6
#Hina Dictatorship
 GEH_last_focus_effect_h_rout: "Sorasaki Hina's Great Record"
 GEH_last_focus_effect_h_rout_desc: "It is the day of Sorasaki Hina's complete victory. A car parade commemorating the end of the 4th Congress has been held, and Hina stands here as the great head of all Germany."

 GEH_hina_we_must_dissent: "We Must Dissent"
 GEH_hina_we_must_dissent_desc: "Who must resist against what? Me against Baal? Baal against me?"

 GEH_hina_ishbosheth: "Ishbosheth"
 GEH_hina_ishbosheth_desc: "Even if it is not a great record but a shameful and cursed one."

## Will of the Student People ##

 GEH_hina_jacobinisme_reform: "Nationalist Reform"
 GEH_hina_jacobinisme_reform_desc: "The state and Chairman Hina must become entities that symbolize the will of the people. The new economic system prioritizing the masses has been decided as a National Syndicalist system centered on labor unions where workers control companies."

 GEH_hina_national_syndicalism: "A Union for Every Factory"
 GEH_hina_national_syndicalism_desc: "Under the National Syndicalist system, all labor unions will control companies. Of course, these labor unions must be operated as pro-government state organizations. The government will use the unions to indirectly control manufacturing factories."

 GEH_hina_state_capitalism: "State Capitalism"
 GEH_hina_state_capitalism_desc: "Our new economic system will be centered on capitalists, but we must take the reins of capital flow through a planned economic system. All capital will be able to move only according to the will of the great nation."

 GEH_hina_patriotic_entrepreneur: "Patriotic Capitalists"
 GEH_hina_patriotic_entrepreneur_desc: "All capitalists must be able to patriotically return their assets at any time according to the orders of the nation. If they do not return them voluntarily? We all know what will happen."

 GEH_hina_new_constitution: "Promulgation of the New Constitution"
 GEH_hina_new_constitution_desc: "Chairman Hina is the leader who symbolizes the will of all Gehenna masses. Amidst the cheers of the zealots, a new constitution enhancing Chairman Hina's authority is promulgated. Long live the Great Gehenna State!"

 GEH_hina_freie_gehenna_jugend: "Free Gehenna Youth"
 GEH_hina_freie_gehenna_jugend_desc: "For the sake of unity and brotherhood of Gehenna citizens, all Gehenna youth must belong to the Free Gehenna Youth (FGJ) organization. The FGJ fosters brotherhood and patriotism among Gehenna youth and makes it possible to mobilize them more efficiently."

 GEH_hina_youth_gehenna_party: "Youth Gehenna Party"
 GEH_hina_youth_gehenna_party_desc: "The Youth Gehenna Party, which has become the new ruling and only party of Gehenna, aims to reform Gehenna in a populist direction according to the will of the masses and build a new nation where all citizens are loyal to the motherland."

 GEH_hina_country_for_the_public: "One for All"
 GEH_hina_country_for_the_public_desc: "Just as the masses unite for the motherland, the motherland must also serve the masses. Various basic welfare systems will make general Gehenna citizens feel patriotism and a sense of belonging to the motherland."

 GEH_hina_friendship: "Friendship Between Kivotosians"
 GEH_hina_friendship_desc: "Whether one has demon horns or angel wings, we are all the same people under Chairman Hina's will and the name of the great motherland. Pan-Kivotosian post-nationalism will achieve unity and integration for all of Kivotos."

 GEH_hina_solidarity: "Solidarize"
 GEH_hina_solidarity_desc: "Although they have many physical differences, the Kivotosian population and the locals are all fellow citizens loyal to the same flag. Let everyone solidarize. And comply under the order of Gehenna."

 GEH_hina_ishbosheth_route_ending: "Eshbaal"
 GEH_hina_ishbosheth_route_ending_desc: "...I made many people happy. I acted according to the will of many people. But my own will was not here. Everyone says they move for Chairman Hina, but do they really move for me? Or do they move for the ideal Sorasaki Hina they imagine?"

## Leader of Gehenna ##

 GEH_hina_terror_route_start: "§RThe End§!"
 GEH_hina_terror_route_start_desc: "§RVictory is finally ours.§!"

 GEH_hina_terror_route_1: "Re-establishing Prefect Team Order"
 GEH_hina_terror_route_1_desc: "Gehenna's order is controlled by the Prefect Team, and the Prefect Team is controlled by Sorasaki Hina. Internal opposition within the Prefect Team who do not understand this needs to be eliminated. They must understand for whom they serve."

 GEH_hina_terror_route_2: "Enforcing My Order"
 GEH_hina_terror_route_2_desc: "A plan to eliminate fascists and communists resisting Gehenna will be implemented. Originally, those things were not human and were pests that should have died sooner. Order will finally be established in Gehenna."

 GEH_hina_terror_route_3: "Eradication of the Ego"
 GEH_hina_terror_route_3_desc: "Germans are not human. Gehenna citizens are human, but they have value not as individuals but only as beings for Sorasaki Hina. They should not be free people with individual egos but components moving under a grand order."

 GEH_hina_terror_route_ending: "Completion"
 GEH_hina_terror_route_ending_desc: "Rebel forces in Germany no longer exist. No resistance forces remain within the Gehenna Prefect Team. Until now, there has never been a leader in Kivotos with such strong absolute power as Sorasaki Hina. Not even the General Student Council President. ...We have achieved a great victory."

 GEH_hina_the_darkest_hour: "Through the Darkest Hour"
 GEH_hina_the_darkest_hour_desc: "I am not a strong person. The reason Baal appeared was because I was a weak being. But is that wrong? Is there a need to deny my weakness? Let's accept myself. My weak side is also me. Weak Sorasaki Hina is also a precious aspect of myself."

 GEH_hina_the_darkest_hour_2: "Establishment of Gehenna Provisional Assembly"
 GEH_hina_the_darkest_hour_2_desc: "I didn't intend to be a dictator. Following the zeal of the zealots at some point, I became an unwanted dictator. ...But Gehenna has already become a country that relies too much on my every word, so letting go of power is too difficult. Let's start with an advisory body. Over a long time, I will decentralize my power."

 GEH_hina_the_darkest_hour_3: "Restoring Prefect Team Order"
 GEH_hina_the_darkest_hour_3_desc: "The 'Order' I was thinking of was definitely skewed. I had forgotten my bonds with my colleagues and overlooked the fact that my most precious people were by my side. I am neither the Thunder Emperor nor an Iron Man dictator. I need the advice of my precious colleagues to decide my policies. Stepping out of the back room, I will give more power to the Execution and Planning Departments."

 GEH_hina_the_darkest_hour_4: "Restraining the Order Department"
 GEH_hina_the_darkest_hour_4_desc: "While the Order Department says they are enhancing my honor, they are actually tarnishing it. It is necessary to stipulate that the Execution Department is a superior military organization to the Order Department."

 GEH_hina_the_darkest_hour_route_ending: "Future, Freedom"
 GEH_hina_the_darkest_hour_route_ending_desc: "My own freedom came when I escaped from the obsessive thought that I had to be a perfect person. I am not an Iron Man. But I have colleagues who think of me as precious. Isn't that enough?"

 GEH_hina_panopticon_institution: "Panopticon Institution"
 GEH_hina_panopticon_institution_desc: "To prevent organized rebellion and sabotage by workers who could be considered potential criminals, a Panopticon institution capable of monitoring all workers will be mandatory in every factory. Surveillance personnel from the Order Department, their eyes hidden by helmets, will be permanently stationed in the industrial zones."

 GEH_hina_national_delusion: "The Delusion of Nation"
 GEH_hina_national_delusion_desc: "The concepts of various Kivotosian academy-states and the cultural and historical records of Germany—all these instill meaningless new values into the components of the Great Gehenna State and increase various criminal possibilities."

 GEH_hina_cult_of_leader: "Hina Worship"
 GEH_hina_cult_of_leader_desc: "The individual has no value before the great leader. Especially the individual's will. All citizens of Gehenna must become components moving for the leader."

 GEH_hina_extermination_german: "German Eradication"
 GEH_hina_extermination_german_desc: "To break the local Germans' will for independence, all German children will be separated from their families and receive special 'Gehenna-fication' education in collective educational facilities. This will cause the permanent eradication of local German culture and the disappearance of German separatism in the long term."

 GEH_hina_two_class_society: "Two-Class Society"
 GEH_hina_two_class_society_desc: "We will not create an aristocratic system. But we can create a pseudo-status system to discriminate against locals that is effectively like an aristocratic system."

 GEH_hina_nationalist_education: "Gehenna-fication Education"
 GEH_hina_nationalist_education_desc: "As proud subjects of Gehenna, we are united as one under the leadership of the great leader. The eradication of German culture will proceed step-by-step from the primary education stage, and complete cultural assimilation will be finished within a century."

 GEH_hina_planned_backwardness: "Planned Backwardness"
 GEH_hina_planned_backwardness_desc: "The Kivotosian population is relatively small compared to the local Earth population. We will demolish medical facilities in areas where the local population resides and push them into the hell of agriculture and industry. By lowering their quality of life, their population will gradually... balance with the Kivotosians."

 GEH_hina_eradication_of_decadent_individualism: "Prohibition of Decadent Individualism"
 GEH_hina_eradication_of_decadent_individualism_desc: "License and chaos turned Gehenna into an academy of crime. Such license will no longer be permitted. We shall prosper under great integration and order."

 GEH_hina_one_for_all: "All for One"
 GEH_hina_one_for_all_desc: "Beyond just the suppression of individualism, all subjects of the Great Gehenna State must be educated to think of themselves as 'human resources' used for the great leader. Gehenna citizens are resources that can be burned and consumed like coal dug from a mine, and Chairman Hina will watch as they burn as a final spark."

#Ako
 GEH_last_focus_effect_a_rout: "New Reform of the Prefect Team"
 GEH_last_focus_effect_a_rout_desc: "Amau Ako's bureaucratic reform has transformed the Prefect Team from a warlord state controlled by the army into a modern bureaucratic state. The name Prefect Team will still remain in history, but now bureaucrats will lead the police organization, not the other way around. May we continue to prosper under the management of the technocrats!"

## Senior Administrator Amau Route
 GEH_amau_administrative_officer: "Senior Administrator Amau"
 GEH_amau_administrative_officer_desc: "Sorasaki Hina intentionally distanced herself from Amau Ako and ostracized her to prevent a scandal for Ako. Ako will eventually understand that this was a decision Hina made to protect her, but ultimately, Ako's technocratic reform, having been distanced from Hina, can only be a reduced and moderate form."

 GEH_amau_seminar: "Planning Department Budget Interference"
 GEH_amau_seminar_desc: "Millennium's 'Seminar' is a group so perfect it can be considered the jewel of technocracy. An organization composed of brilliant technocrats handles budget planning, and other departments must submit every project they intend to do to the Seminar and receive budget approval. Although we won't be permitted to create an organization identical to the Seminar, Hina will provide the Planning Department's technocrats with the authority to interfere in budget planning."

 GEH_amau_check_military: "Checking the Execution Department"
 GEH_amau_check_military_desc: "The Execution Department needs minimum restraint and continuous monitoring to ensure they cannot use Head Prefect Hina for their militaristic purposes."

 GEH_amau_free_internet_policy: "Free Internet Service"
 GEH_amau_free_internet_policy_desc: "While it is true that our internet service significantly regressed after the Transfer with the loss of satellites, wired LAN internet is still widely spread across Gehenna. Providing free internet for all citizens will raise our citizens' knowledge level in the long term and is a path to slowly but surely reach the Planning Department's goal of a 'Nation of Intellectuals.'"

 GEH_amau_to_the_sky: "To the Sky!"
 GEH_amau_to_the_sky_desc: "We will completely catch up with Millennium's latest science and technology within 20 years. Even if there are realistic difficulties."

 GEH_amau_rotue_ending: "§YBy Your Side§!"
 GEH_amau_rotue_ending_desc: "Beyond all hardships, we face the end of a story."

## Ako Sorasaki Route
 GEH_ako_sorasaki_administrative_officer: "Ako Sorasaki"
 GEH_ako_sorasaki_administrative_officer_desc: "Sorasaki Hina protected Amau Ako by claiming that criticism against Ako was criticism against herself through their public romantic relationship. The wedding of Hina and Ako is a declaration of Hina's will to be on Ako's side throughout her life and to protect the reforms her beloved leads no matter what happens. Of course, beyond political reasons, it is also a beautiful moment when the deep relationship between the two bears fruit."

 GEH_ako_sorasaki_seminar: "Gehenna Seminar"
 GEH_ako_sorasaki_seminar_desc: "Millennium's 'Seminar' is a group so perfect it can be considered the jewel of technocracy. An organization composed of brilliant technocrats handles budget planning, and other departments must submit every project they intend to do to the Seminar and receive budget approval. Now you see why the Prefect Team needs a Seminar, right? The Seminar, overseen by Senior Administrator Ako and the Planning Department, will manage the budgets of all departments."

 GEH_ako_sorasaki_civilian_control: "Principle of Civilian Control"
 GEH_ako_sorasaki_civilian_control_desc: "Until now, the Execution Department, which was no different from a Gehenna military, was operating without any intervention from civilian organizations. No more. Gehenna must become a modern administrative state, not a warlord state, and various officers of the Execution Department will have to take off their uniforms and become civilians."

 GEH_ako_sorasaki_promotion_of_science: "Science, Not Lawlessness"
 GEH_ako_sorasaki_promotion_of_science_desc: "The new technocrat-oriented Gehenna must shed its stigma as an 'Academy of Freedom and Chaos' and be reborn as a nation for brilliant scholars and intellectuals. Although there is a very large technology gap, we will eventually be able to catch up even with Millennium."

 GEH_ako_sorasaki_ako_s_puppet: "§COnly Ako§!"
 GEH_ako_sorasaki_ako_s_puppet_desc: "Ako was always on Hina's side. She was always helpful to Hina and was by Hina's side during the hardest times. And ...why should I think when my beloved wife will do everything for me? Hina closes her eyes and decides to entrust all her thoughts and values to Ako. Hina now joyfully accepts a life as a puppet who repeats her beloved wife's decisions."

 GEH_ako_sorasaki_ako_s_partner: "§GThe Best Partner§!"
 GEH_ako_sorasaki_ako_s_partner_desc: "Ako was always on Hina's side. She was always helpful to Hina and was by Hina's side during the hardest times. Hina knows she still has much to do for the Prefect Team. But if she has her most precious wife and partner by her side, she will be able to overcome any hardship."

 GEH_ako_sorasaki_route_ending: "Before I Rise"
 GEH_ako_sorasaki_route_ending_desc: "One story ends. And one beautiful conclusion blooms."

## Ako Sorasaki & Senior Administrator Amau Shared Focus
 GEH_4th_ako_reduction_in_defense_budget: "Defense Budget Reduction"
 GEH_4th_ako_reduction_in_defense_budget_desc: "Now that Gehenna's reunification and revival are complete, the Planning Department hopes to reduce the bloated budget of the Execution Department and turn it toward industrial development. Sorasaki Hina will also agree with this measure."

 GEH_4th_ako_centre_of_culture: "Academy of Culture"
 GEH_4th_ako_centre_of_culture_desc: "Gehenna in the past was a disorderly place where even student attendance was not properly maintained as an 'Academy of Freedom and Chaos.' The new bureaucratic system will implement punitive measures to increase attendance at Gehenna educational institutions while simultaneously supporting active artistic activities of students to maintain Gehenna's free cultural climate."

 GEH_4th_ako_intelligence_reform: "Intelligence Department Reform"
 GEH_4th_ako_intelligence_reform_desc: "The Intelligence Department was the organization that had the greatest political confrontation with Ako and the Planning Department she led. Even Sorasaki Hina admits that the Intelligence Department has excessively focused on internal power struggles and has unnecessarily harassed Ako. The Intelligence Department must be thoroughly separated from political power and will focus only on external counterintelligence in the future."

 GEH_4th_ako_second_weimar_republic: "Second Weimar Republic"
 GEH_4th_ako_second_weimar_republic_desc: "The new federal republic must be a 'New Weimar Republic' representing all German citizens, not just a nation representing a small number of Kivotosians. After all, we cannot run a country with only a small population."

 GEH_4th_ako_coalition_with_SPD: "Coalition with the SPD"
 GEH_4th_ako_coalition_with_SPD_desc: "This does not mean joining the German SPD to the central government. We must maintain our identity as Gehenna. However, we can expand the influence of the SPD in local governments through appropriate electoral interference. Since the SPD is the most friendly local party to our government, they can serve as a bridge between locals and Kivotosians."

 GEH_4th_ako_oath_of_bureaucratic: "German Bureaucrats' Oath of Loyalty"
 GEH_4th_ako_oath_of_bureaucratic_desc: "While military organizations were one thing, accepting locals as 'bureaucrats' was a very... delicate matter. But since we have become the leading force in Germany, locals who swear loyalty to the order of Gehenna can be incorporated into the lower levels of our technocratic organization. Naturally, it will be absolutely impossible for them to take the lead."

 GEH_4th_ako_from_gehenna_to_trinity: "From Gehenna to Trinity"
 GEH_4th_ako_from_gehenna_to_trinity_desc: "Our goal is to integrate the two divided forces of Gehenna and Trinity into one and achieve Kivotosian unity. The rights of locals are important too, but they are strictly 'second.'"

 GEH_4th_ako_eden_union: "Eden Minor Entente"
 GEH_4th_ako_eden_union_desc: "After all, the two academies of Gehenna and Trinity are fellow Kivotosians with identical halos... though it is true that there are average appearance differences between the students. The 'Eden Minor Entente,' named after the Eden Treaty, aims to gradually achieve peace between the two academies by mandating an origin quota for Trinity graduates in our technocratic group."

 GEH_4th_ako_federation_for_kivotos: "Kivotos Federation"
 GEH_4th_ako_federation_for_kivotos_desc: "Various Kivotosian populations, including students from various academies, demi-humans, and robots, will cooperate for the prosperity of our nation. Even if our population is small compared to the locals, civil organizations formed by the Kivotosian population will ensure we do not lose leadership to the locals through strong unity."

#Iori
 GEH_last_focus_effect_c_rout: "Wiping Away the Bloodstains"
 GEH_last_focus_effect_c_rout_desc: "Sorasaki Hina and the loyal Prefect Team have succeeded in pacifying all of Gehenna and bringing stability. Now we must go further, resolve radical war and militarized systems, and start investing for the future."

 GEH_gradual_dismantling_of_conscription_system: "Gradual Dismantling of the Conscription System"
 GEH_dismantling_of_militarized_system: "Dismantling of the Militarized System"
 GEH_indefinite_extension_of_emergency_powers: "Indefinite Extension of Emergency Powers"
 GEH_investigation_of_shirokami_ioris_war_crimes: "Investigation of Shiromi Iori's War Crimes"
 GEH_execution_unit_temporary_sanctions: "Temporary Sanctions on the Execution Department"
 GEH_restoration_of_planning_department_authority: "Restoration of Planning Department Authority"
 GEH_restoration_of_medical_department_authority: "Restoration of Medical Department Authority"
 GEH_gehenna_prefect_team_revival: "Gehenna Prefect Team Revival"
 GEH_cornerstone_of_a_defense_nation: "Cornerstone of a Defense Nation"
 GEH_national_defense_commissioner_sorasaki_hina: "National Defense Commissioner Sorasaki Hina"
 GEH_departure_with_a_sigh: "Departure with a Sigh"
 GEH_german_equality_conscription: "German Equality Conscription"
 GEH_our_new_supporters: "...Our New Supporters!"
 GEH_universalism_charter: "'Universalism' Charter"
 GEH_gehenna_national_harmony_solidarity: "Gehenna National Harmony Solidarity"
 GEH_commercial_agricultural_industrial_cooperation: "Commerce-Agriculture-Industry Harmony"
 GEH_german_labor_front_succession: "German Labor Front Succession"
 GEH_weakening_big_capitalists: "Weakening Big Capitalists"
 GEH_political_and_administrative_center: "Political and Administrative Center"
 GEH_harmony_fatherland_solidarity: "Harmony, Fatherland, Solidarity"

 GEH_gehenna_national_harmony_solidarity_1tt: "Effect change when selecting $GEH_investigation_of_shirokami_ioris_war_crimes$ focus tree:\n§gPutting Shiromi Iori on war crimes trial will focus on the values of the Gehenna Prefect Team, so the purpose for National Harmony will be somewhat weakened.§!"
 GEH_gehenna_national_harmony_solidarity_2tt: "Effect change when selecting $GEH_indefinite_extension_of_emergency_powers$ focus tree:\n§gDeclaring emergency powers will mean Sorasaki Hina takes strong control of the nation, so the purpose for National Harmony will rise dramatically.§!"

 GEH_gradual_dismantling_of_conscription_system_desc: "Now that the two massive main enemies of Manmajeon and Trinity have both been annihilated and Gehenna's global position is stabilizing, we must reduce the bloated conscription system and promote normalization of the state."
 GEH_dismantling_of_militarized_system_desc: "Populism, negativity, persecution of minorities, and numerous fake propagandas have become like everyday life in current Gehenna politics. We will take the first step toward establishing a stable nation by reducing these extremely precarious propaganda machines."
 GEH_indefinite_extension_of_emergency_powers_desc: "...Once hands are stained with blood, Shiromi Iori and the Execution Department can never go back to before. For her own safety, Sorasaki Hina will not be able to damage her bond with her long-time colleague Shiromi Iori, a connection that has lasted since before the Transfer."
 GEH_investigation_of_shirokami_ioris_war_crimes_desc: "Sorasaki Hina has become tired of the acts committed by Shiromi Iori and the Prefect Team and will promote massive reforms to significantly damage their influence and return Gehenna Academy to how it was before. Even if it means damaging the bond that has lasted since the Kivotos days."
 GEH_execution_unit_temporary_sanctions_desc: "Shiromi Iori's Execution Department is currently a massive organization wielding the most powerful authority in the Gehenna Prefect Team, and even excluding Shiromi Iori, this will be a huge obstacle to the normalization of the Prefect Team state."
 GEH_restoration_of_planning_department_authority_desc: "The power struggle between the Execution and Planning Departments has lasted since the Kivotos days, and currently, with the Execution Department holding political leadership, the Planning Department's authority is at its lowest in Prefect Team history. We will adjust this and arrange measures to ease the clash between the two departments."
 GEH_restoration_of_medical_department_authority_desc: "Various overstepping of authority by the Execution and War Departments has damaged various activities performed by the Medical Department, and we will correct this."
 GEH_gehenna_prefect_team_revival_desc: "The Gehenna Prefect Team must stop at the level of protecting students and maintaining discipline. While Gehenna Academy and the Prefect Team are currently politically indistinguishable due to one-sided leadership, we must recall and confirm the essence of the Prefect Team."
 GEH_cornerstone_of_a_defense_nation_desc: "The most characteristic point and best invention that appeared amidst the Execution Department's one-sided tyranny will undoubtedly be the War Department. Therefore, we will correct the errors in the execution of various military operations in the Prefect Team system and recognize the War Department, which has assisted various war activities, not as a mere organization for the Execution Department's one-sided use, but as an organization for the defense of all of Gehenna, introducing the principle of civilian control."
 GEH_national_defense_commissioner_sorasaki_hina_desc: "To meaningfully separate the Execution and War Departments and promote the stabilization of Gehenna Academy, concurrent holding of the posts of Head Prefect and Head of the War Department and a separation from the Execution Department are necessary. For this, Sorasaki Hina will create a new Gehenna student council president position called National Defense Commissioner and ascend to it herself."
 GEH_departure_with_a_sigh_desc: "Gehenna Academy's ideals, the values of democracy, the goals of the Prefect Team.... these are now forgotten words. No matter what anyone says, we are currently a dictatorial regime, and to Gehenna students, we appear as collaborators with the locals; this is an undeniable fact. However, to protect our national identity and for Sorasaki Hina's choice, we must uphold this system."
 GEH_german_equality_conscription_desc: "Perhaps through tolerance and appeasement toward the Germans, we can work to create a better nation. We will find a new ideal for the Prefect Team and move toward it. Even if Gehenna Academy's national identity is damaged at the end of this choice and numerous conflicts between the two worlds emerge due to radical change, at least Sorasaki Hina will not regret her choice."
 GEH_our_new_supporters_desc: "...Fine, it's not that we failed to draw support from students and Kivotosian citizens and are thus introducing broad egalitarianism and bringing Germans to our side.\n\nThis is simply the work of adjusting conflicts between the two worlds and maintaining ideals that the Prefect Team originally should have done. It is also the path Sorasaki Hina chose after long consideration."
 GEH_universalism_charter_desc: "'All citizens are equal. No one shall be discriminated against in any area of political, economic, social, or cultural life on account of origin, race, or nationality.'\n\nThe Gehenna Prefect Team will now mediate conflicts between Kivotosians and Earthlings and be formed based on opposition to racial conflict and the stable integration of the two worlds."
 GEH_gehenna_national_harmony_solidarity_desc: "For the integration of Gehenna and Germany, the War Department where power is concentrated and Sorasaki Hina's charismatic image imprinted on the masses must each be analyzed one by one. Sorasaki Hina at least has no intention of wasting her power and will begin real politics to correct the twisted situation."
 GEH_commercial_agricultural_industrial_cooperation_desc: "Gehenna Academy is not a system composed only of Kivotosian humanity. For the harmony of numerous ethnicities across Gehenna-Germany and various working classes, we will attempt harmony between German workers and Kivotosian workers, and across various classes."
 GEH_german_labor_front_succession_desc: "The German Labor Front, which commands labor unions and labor power across Germany, was effectively abandoned after being forcibly relegated to a private institution after the Transfer. We will absorb them into national institutions again and utilize them for national harmony programs."
 GEH_weakening_big_capitalists_desc: "German big corporations or Kivotosian big corporations frequently engage in marketing that incites conflict or labor exploitation in unprotected areas. We will correct all these behaviors and start strong government control over big capitalists."
 GEH_political_and_administrative_center_desc: "While Shiromi Iori's war crimes trial is still in progress, elections must be held to recover leadership legitimacy and integrate Gehenna Academy. While Sorasaki Hina's victory may seem like a foregone conclusion, this is a very important choice. At least, she thinks so."
 GEH_harmony_fatherland_solidarity_desc: "Empowered by German support, National Defense Commissioner Sorasaki Hina has succeeded through various political choices in breaking the arrows aimed at Shiromi Iori and turning them toward herself. She has also gained the background of strong support from Germans, which was unthinkable before. Now, despite opposition from Gehenna students, she will subvert the implicit hierarchy between Germany and Gehenna and implement the final choice for a massive integration."

#Normal
 GEH_last_focus_effect_normal_rout: "Sorasaki Hina's Retirement Ceremony"
 GEH_last_focus_effect_normal_rout_desc: "It is time to finally lighten the burden of Sorasaki Hina, the head of the Prefect Team, the leader of Gehenna, the guardian against Trinity... and simply a normal Gehenna student. Since major crises have mostly been resolved, Sorasaki Hina can decide to retire."

 GEH_new_disciplinary_head_election: "Election of New Head Prefect"
 GEH_new_disciplinary_head_election_desc: "Sorasaki Hina's retirement brought stability to all of Gehenna but left a massive power vacuum within the Prefect Team. Now that the absolute central point known as Hina is gone, the Prefect Team needs a new leader to decide the direction ahead. Naturally, the leading candidate will be Senior Administrator 'Amau Ako,' who has been responsible for the Prefect Team's administration with cool-headed reason."
 GEH_shiromi_iori_s_ordeal: "Shiromi Iori's Ordeal" 
 GEH_shiromi_iori_s_ordeal_desc: "The power of the Prefect Team without Hina naturally leaned toward the Planning Department, which oversees administration and budget. An era of 'ordeal' has arrived for Shiromi Iori and the Execution Department. Every operation plan had to have dozens of pages of reports and expected effect analysis tables attached, and even to purchase a single bullet, they had to receive meticulous approval from Amau Ako. For Iori, this was an all-out war with paperwork, more terrible than real war. Her anger builds day by day." 
 GEH_not_you_plz: "Not You, Please!"
 GEH_not_you_plz_desc: "\"Damn it! If that bookworm becomes Head Prefect, we'll be pushing pens for the rest of our lives!\"\nIori has finally made up her mind. At the cost of the Execution Department's honor and her own mental health, she must stop Amau Ako from becoming Head Prefect. She will rally the Execution Department members who follow her and seek support from other departments to begin a political struggle to block Ako's 'bureaucratic dictatorship.'"
 GEH_crushed_reconciliation: "Crushed Reconciliation"
 GEH_crushed_reconciliation_desc: "The election is over, and the winner was 'Amau Ako.' As the new Head Prefect, Ako requested a public reconciliation with Iori for the sake of organizational unity. Amidst the gaze of numerous Prefect Team members, Iori reluctantly shook the hand Ako offered. A sense of humiliation from being unable to admit defeat, and yet a sense of responsibility to follow for the sake of the organization. Under the awkward handshake of the two, the Prefect Team's precarious peace has begun."
 GEH_execution_department_guard: "Defending the Execution Department"
 GEH_execution_department_guard_desc: "To defend the Execution Department from Ako's administrative interference, Iori decided to strengthen the independence of the Execution Department. From command over military operations and autonomy over internal budgets to personnel rights. She will build a 'small fortress' out of the reach of the Planning Department's influence to ensure the Execution Department does not lose its essence as the 'Sharp Sword' of the Prefect Team. This is the start of passive but persistent resistance to Ako's rule."

 GEH_gehenna_student_council_president_election: "Gehenna Student Council President Election"
 GEH_gehenna_student_council_president_election_desc: "Hina's retirement meant the absence not only of a Head Prefect but also of the head of state who effectively led all of Gehenna. Public opinion is gaining strength that the Prefect Team should focus on its role as a military and security organization and that a new 'Student Council' representing all of Gehenna should be rebuilt to elect a democratic leader. This will be Gehenna's new start, moving away from warlord rule toward a 'normal state.'"
 GEH_amau_ako_s_worry: "Amau Ako's Worry"
 GEH_amau_ako_s_worry_desc: "When the new student council president election was announced, everyone's gaze turned to Amau Ako. She was the most likely candidate as Gehenna's top administrative expert and Hina's successor. But Ako hesitated. Her loyalty was always toward 'Sorasaki Hina' the individual, not toward 'Gehenna' the unspecified many. She fell into deep anguish over whether she had the qualification and will to lead this massive nation in Hina's stead."
 GEH_gehenna_morning_star_club: "Gehenna Morning Star Club"
 GEH_gehenna_morning_star_club_desc: "Ako ultimately chose a different path instead of the stage of politics as student council president. She established a new club named 'Gehenna Morning Star Club.' This is a scholarship foundation operated in Ako's name and an elite educational institution cultivating next-generation talents to lead Gehenna's future. Instead of reigning at the pinnacle of power, Ako chose the path of planting seeds for Gehenna's future from an unseen place."
 GEH_gehenna_morning_star_club_tt: "§CRegime change after the event:§!"
 GEH_student_council_president_ako: "Student Council President Ako"
 GEH_student_council_president_ako_desc: "After much consideration, Ako decided to accept her responsibility. She ran for the Gehenna student council president election promising 'stability and prosperity' and was elected as the first student council president amidst overwhelming support. Her appearance on the inauguration platform was no longer someone's shadow. The era of Amau Ako, the cool-headed, capable, and sometimes ruthless new leader of the Gehenna Republic, has begun."
 GEH_flag_morning_star_club: "Amau Ako has decided not to become student council president."
 GEH_flag_gehenna_academy: "Amau Ako has decided to become student council president."
 GEH_planning_department_independence: "Planning Department Independence"
 GEH_planning_department_independence_desc: "As Ako moved on to other things, the Planning Department she spent her life building had to face new changes. No longer able to receive Ako's direct control, the Planning Department must stand on its own upon the system she built. Ako will transfer authority to her most capable successors and reorganize the organization so that the Planning Department can function as the backbone of Gehenna administration without faltering."

 GEH_art_academy_enhancement: "Art Academy Enhancement"
 GEH_art_academy_enhancement_desc: "The establishment of the Gehenna Art Academy was successful. Gehenna's 'freedom and chaos' combined with German artists' 'beauty of form' to create a unique and vibrant artistic spirit. We must now further strengthen this spirit. We will hold state-led art competitions, grant the title of 'Gehenna Meister' to the best artists, and sponsor touring exhibitions to promote our original art across Europe. It is time to make Gehenna a center of art where culture breathes, not just a military power."
 GEH_organic_academy: "Organic Academy"
 GEH_organic_academy_desc: "Current Gehenna is like a complex organism that cannot be defined by a single word. From clubs that blow up hot springs to the Prefect Team shouting for discipline, and to the Germans, the owners of the new land. Heterogeneous groups that seemed unable to get along are forming a bizarre symbiotic relationship after Hina's retirement, relying on each other in their respective positions. 'Organic Academy' is a social grand compromise that affirms this phenomenon, guarantees the autonomy of each institution while encouraging cooperation, and makes this massive and chaotic organism function as one community without creaking."
 GEH_gehenna_literature_academy: "Gehenna Literature Academy"
 GEH_gehenna_literature_academy_desc: "With Gehenna-Bavarian art successfully settled, our cultural confidence is now ready to expand beyond visual arts into the realm of the written word. The establishment of the 'Gehenna Literature Academy' is the first step. We will support novels containing the experiences of students who lived through the era of the Transfer, poetry exploring the identity of the new nation, and philosophy encompassing the histories of the two worlds. We will record and prove the soul of Gehenna not with brushes and paint, but with pens and ink."
 GEH_play_woman_of_iron_skin: "Play: The Woman of Iron Skin"
 GEH_play_woman_of_iron_skin_desc: "Recently, a play titled 'The Woman of Iron Skin' has been gaining sensational popularity among young Gehenna students. This play depicts Sorasaki Hina as a tragic figure who hid her own pain behind the mask of 'Perfect Head Prefect.' Former officers of the Prefect Team are taking this as an insult that defames Hina's strength."

 GEH_principle_of_order: "Principle of Order"
 GEH_principle_of_order_desc: "Our top priority is the stability of Gehenna and the prosperity of Kivotosians. We cannot yield our rights to appease German dissatisfaction. The 'Principle of Order' advocates for Gehenna-first policies, restricting German political participation and prioritizing major resources for Kivotosians to ensure our nation's leadership does not falter."
 GEH_principle_of_mediation: "Principle of Mediation"
 GEH_principle_of_mediation_desc: "Gehenna is now a nation of two peoples, Kivotosians and Germans. Policies that oppress one side only end up creating greater division. The 'Principle of Mediation' aims for the Prefect Team to perform the role of a fair mediator between the two worlds. We will form a consultative body in which both sides participate equally, coordinate conflicts, and lead a stable coexistence."
 GEH_principle_of_reconciliation: "Principle of Reconciliation"
 GEH_principle_of_reconciliation_desc: "We must admit that we gave indelible wounds to the Germans who were the owners of this land at the time of the Transfer. The 'Principle of Reconciliation' is a path to atone for Gehenna's 'original sin' and achieve true integration. Through official apologies for past history, compensation for victims, and active cultural exchange and guarantee of political participation, we will end the era of hatred and build a new nation based on mutual respect."

 GEH_last_focus_effect: "Toward the Future"
 GEH_last_focus_effect_desc: "§gIt is time to look back on the path we have walked.§!"
 GEH_second_congress_focus_effect: "Looking at the Present"
 GEH_second_congress_focus_effect_desc: "§gThe 1st Congress will determine the path we take.§!"
 GEH_second_congress_focus_effect_tt: "This focus will change to a full focus tree upon completion of the §Y$GEH_second_congress_focus$§! focus."
 GEH_second_congress_focus_effect_tt2: "We have not yet completed the §Y$GEH_second_congress_focus$§! focus."
 GEH_last_focus_effect_tt: "This focus will change to a full focus tree upon completion of the §Y$GEH_last_focus_3$§! focus."
 GEH_last_focus_effect_tt2: "We have not yet completed the §Y$GEH_last_focus_3$§! focus."

### Prefect Team Diplomacy Focus ###
 GEH_our_future: "Our Future"
 GEH_our_future_desc: "The important thing is what kind of foreign policy [ROOT.GetNameDef] carries out in the international community. Within Gehenna, we acted for 'discipline and order,' but we can't exactly go to other academies and say, 'Would you mind opening your doors for a moment for the sake of public morals?' can we?"

 GEH_our_faction_first: "Signing the Geneva Conventions"
 GEH_our_faction_first_desc: "Since we have decided to respect order, we also need to recognize the 'order' created by human civilization. We have an obligation to respect and follow the rules of war for locals according to the Geneva Conventions in any situation."

 GEH_war_against_cou: "$GEH_three_congress_focus_no_hina_diplomacy_attack_benelux$"
 GEH_war_against_cou_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_benelux_desc$"

 GEH_recognition_of_cou: "$GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux$"
 GEH_recognition_of_cou_desc: "$GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux_desc$"

 GEH_russian_winter: "Preparing for the Eastern Winter War"
 GEH_russian_winter_desc: "The Eastern winter war issue is a serious matter for us. Gehenna did not have a subarctic climate like Red Winter, and we must prepare methods not to freeze to death in their territory when fighting the red bear of eastern Kivotos."

 GEH_red_winter_problem: "Scandinavian Campaign"
 GEH_red_winter_problem_desc: "Red Winter Federal Academy has long been close friends with Manmajeon. Is there any reason we shouldn't be wary of them?"

 GEH_red_winter_aliance: "Scandinavian Cooperation"
 GEH_red_winter_aliance_desc: "Although the long-standing friendly relationship between Red Winter Federal Academy and Manmajeon is awkward, we cannot afford to waste national power in the polar regions. It is better to try to incorporate them as our allies."

 GEH_attack_soviet: "War Against [SOV.GetName]"
 GEH_attack_soviet_desc: "The red bear of the East is our threatening potential enemy, and our security issues are uncertain until the Eastern problem is resolved."

 GEH_attack_SWI: "Operation Tannenbaum"
 GEH_attack_SWI_desc: "Switzerland, a human nation south of Gehenna, claims to be a neutral country, but will they really maintain neutrality between otherworld nations and humanity? We have no choice but to assume they are also a 'potential enemy.'"

 GEH_attack_south_kivotos: "Attack on Southern Kivotos"
 GEH_attack_south_kivotos_desc: "Southern Kivotos is a gateway to Europe, and that gateway is more likely to be hostile than friendly to us. We must eliminate the potential enemies of southern Kivotos to maintain firm security."
 GEH_attack_south_kivotos_tt: "Gain a wargoal against the country that won the White Mountain War."

 GEH_aliance_south_kivotos: "Southern Kivotos Alliance"
 GEH_aliance_south_kivotos_desc: "Southern Kivotos is a gateway to Europe, and we need to maintain friendly relations with them to advance into southern Europe."
 GEH_aliance_south_kivotos_tt: "Can propose an alliance to the country that won the White Mountain War."

 GEH_support_WHY: "Wildhunt Protection Plan"
 GEH_support_WHY_desc: "Wildhunt, which is suffering from Iberian paranoia of so-called 'Otherworld Bolshevism,' will prosper under our support."

 GEH_attack_SPR: "Iberian Liberation War"
 GEH_attack_SPR_desc: "We came to this land to sweep away their delusion of Otherworld Bolshevism."

 GEH_remove_vatican: "Dissolution of the Vatican"
 GEH_remove_vatican_desc: "The process of permanently dissolving the Holy See is the strongest blow we can deliver to the most persistent enemy in southern Europe who has engaged in hostile acts against Kivotosians since the past."

 GEH_interpol: "International Criminal Police Organization"
 GEH_interpol_desc: "The police organization known as the Prefect Team has already transformed into a nation, but we will not forget that our roots are a security agency. The International Criminal Police Organization we create will be an international organization that trains 'International Police' for arresting criminals, operating among all academy-states in Kivotos and local nations cooperating with us."

 GEH_friendship_with_trinity: "Maintaining Friendship of the Eden Treaty"
 GEH_friendship_with_trinity_desc: "Though its conclusion was a tragedy, Kirifuji Nagisa did everything for the friendship and solidarity of the two academies of Trinity and Gehenna. The Justice Task Force, unemployed after the Eden showdown, is worth respecting under our rule; and though armament will be limited to small arms, they will be recreated and re-established with all previous authority in former Trinity."

 GEH_ICC: "Establishment of the International Criminal Court"
 GEH_ICC_desc: "It is natural to receive punishment if one commits a crime. The International Criminal Court (ICC) works for justice, establishing standards to punish not general criminals, but foreign war criminals, dictators, and perpetrators of atrocious crimes against humanity."

 GEH_crossing_the_atlantic: "Across the Atlantic"
 GEH_crossing_the_atlantic_desc: "The massive nation known as the [USA.GetNameDef] once prospered but is declining amidst chaos after the Transfer. Nevertheless, [USA.GetAdjective] possesses massive potential, and there is a need to strike that giant down before it wakes up."

 GEH_attack_intermarium: "Ending the Intermarium Experiment"
 GEH_attack_intermarium_desc: "Poland is threatening Gehenna's security, and the Intermarium could turn its blade toward us at any time."

 GEH_attack_baltic: "Baltic Offensive"
 GEH_attack_baltic_desc: "For their own safety, the small nations of the Baltic are better off becoming part of Gehenna."

 GEH_attack_soviet_1: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1$"
 GEH_attack_soviet_1_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1_desc$"

 GEH_attack_soviet_2: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2$"
 GEH_attack_soviet_2_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2_desc$"

 GEH_diplomacy_balkans_alliance: "$GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance$"
 GEH_diplomacy_balkans_alliance_desc: "$GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance_desc$"

 GEH_attack_ITA: "$GEH_three_congress_focus_no_hina_diplomacy_attack_italy$"
 GEH_attack_ITA_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_italy$"

 GEH_we_dont_need_other_big_three_school: "End of the Big Three Academies System"
 GEH_we_dont_need_other_big_three_school_desc: "The three academies of Gehenna, Trinity, and Millennium will now be integrated under the name of Gehenna's leader [ROOT.GetLeader]."

 GEH_technical_cooperation: "Gehenna-Millennium Alliance"
 GEH_technical_cooperation_desc: "It is foolish to turn an academy with such great technological power as Millennium into an enemy. It is better to meet their student council president and talk of friendship."

 GEH_stopping_kaisers_hegemony: "Operation Sea Lion"
 GEH_stopping_kaisers_hegemony_desc: "Britain is said to have once been a great country. Although it fell endlessly under corporate rule. Order will be restored to that land under the flag of [ROOT.GetName]."

### Prefect Team Industry (Culture) Focus ###
 GEH_luxembourg_problem: "The Luxembourg Regulation Issue"
 GEH_luxembourg_problem_desc: "The 'Luxembourg Regulation' enacted after the Transfer effectively prevented massacres from occurring again. However, backlash from Gehenna students and a realistic lack of administrative power demand that we improve the Luxembourg Regulation."

 GEH_internet_network_recovery: "Internet Communication Network Recovery"
 GEH_internet_network_recovery_desc: "The fiber optic LAN used in Kivotos will probably take several years until Millennium's technology is introduced, but utilizing the telephone communication networks used by locals will make it possible to rebuild a modem-based internet network in a short time."

 GEH_centre_of_culture: "Center of Culture"
 GEH_centre_of_culture_desc: "Some Gehenna students misunderstand that the Prefect Team is only interested in suppressing cultural life and public freedom to create a totalitarian society. No. That is not the case. The Prefect Team is ready to accept any free culture, provided it does not involve committing terrorism to dig up hot springs or throwing bombs at bad restaurants."

 GEH_centre_of_culture_a: "Bauhaus"
 GEH_centre_of_culture_a_desc: "The Bauhaus, which had been closed by Hitler's regime in Germany, has reopened with the support of the Gehenna Prefect Team. Even Ako, who distrusts locals the most, seems very interested in new Prefect Team building designs presented by local architects."

 GEH_centre_of_culture_b: "Entartete Kunst Exhibition"
 GEH_centre_of_culture_b_desc: "Expressionist art, which had been classified as degenerate art and suppressed by Hitler's regime in Germany, has begun to bloom again. The Prefect Team supports the establishment of a new art university and hopes Gehenna students can calm their violence even a little through art. Though it seems they probably won't."

 GEH_centre_of_culture_c: "Serenade Toward the Light"
 GEH_centre_of_culture_c_desc: "With Sorasaki Hina's help, a new Gehenna-Bavarian Music University, where Gehenna students are permitted to audit freely, has opened. The brilliant musician Strauss wants to teach directly at the music university and pioneer a new musical trend combining Gehenna music and Romantic music."

 GEH_centre_of_culture_end: "Gehenna-Bavarian Art"
 GEH_centre_of_culture_end_desc: "Gehenna and Bavarian art have harmonized, creating a new artistic trend. Through this, we hope conflicts between locals and Gehenna citizens will decrease significantly and that they can understand each other more deeply."

 GEH_68_rev: "Enforcing Our Methods"
 GEH_68_rev_desc: "We must not be assimilated into German culture. Male chauvinist culture, discrimination against women, and the evil National Socialist culture spread throughout society... We shouldn't learn from them; they should learn from us."

 GEH_68_rev_for_prefect_team: "German Student Re-education"
 GEH_68_rev_for_prefect_team_desc: "Some traditional German culture has value. But German masculinist religion and social culture have no value. From the stage of still-young students, forced education to adapt to Kivotos's 'modern' culture and the elimination of conservative religious forces are necessary."

 GEH_gradual_gehenna_culture: "Moderate Policy Through Separation"
 GEH_gradual_gehenna_culture_desc: "Forcibly dismantling German popular culture and Kivotos-ifying it will incur strong backlash. A better method is to have them gradually understand our culture after racial separation."

 GEH_cultural_exchange_education: "Cultural Exchange Educational Institution"
 GEH_cultural_exchange_education_desc: "We will establish free educational institutions led by the Prefect Team so that the Gehenna and German populations can learn about each other's cultures and understand cultural differences."

 GEH_gradual_gehenna_culture_for_prefect_team: "One Country, Two Systems"
 GEH_gradual_gehenna_culture_for_prefect_team_desc: "The important thing is that the Gehenna-German residential separation must not become a harsh South African-style apartheid. Our racial separation will be carried out temporarily until the two peoples, who have cultural and scientific technology differences of over a hundred years, can understand each other, and all Germans will be protected by the same laws as Gehenna citizens."

 GEH_civil_rights_act: "Enacting the Civil Rights Act"
 GEH_civil_rights_act_desc: "Basically, this Civil Rights Act is a copy of the draft written by Onikata Kayoko of Luxembourg. However, unlike many Prefect Team officers who only thought of the rights of Gehenna students and failed to think of racial discrimination against demi-humans and automata, the draft Kayoko envisioned is worth introducing to the Prefect Team after slight revision in that it guarantees the rights of these 'non-human' Kivotosians."

 GEH_political_correctness: "Political Correctness"
 GEH_political_correctness_desc: "While the problem of racial discrimination against Kivotosians, who are a minority population, was resolved by the enactment of the Civil Rights Act, intangible racial discrimination targeting Gehenna citizens continues. Policies including regional official quotas and extra points will surely be helpful."

 GEH_local_autonomy: "Local Council"
 GEH_local_autonomy_desc: "With the enactment of the Civil Rights Act, Germans have developed a victim complex that they are being colonially ruled by a small number of Kivotosians. German interference in Gehenna's central politics should be restricted, but their anger can be calmed through a limited local council for Germans."

### Hina Runaway!!! ###
#### Hina Dictatorship
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h: "Rapid Change"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_desc: "With the loyalist guards, who possess fanatical support for Sorasaki Hina, seizing politics, Head Prefect Hina's resignation and disappearance have brought the greatest chaos ever to the Prefect Team. The guards have split into those who accept Hina's disappearance and those who do not."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1: "Persona"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_desc: "Sorasaki Hina should have been a living god and a leader who would lead Gehenna to glory. It is impossible for such a god in human form to abandon her believers and run away. ...If she was a fake god, if we no longer have a being to worship, we will create a god."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_purge: "Quiet Purge"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_purge_desc: "There are Prefect Team members who claim Sorasaki Hina has been 'replaced' and that the current Hina is fake. They are the opponents among the guards who refused to replace Hina with a robot. They are such noisy fools. Since 'Head Prefect Hina' is walking around the headquarters just fine, it is easy to brand them as mentally ill and purge them."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_internet_surveillance: "Internet Surveillance"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_internet_surveillance_desc: "Since the new god is a machine, it is possible for Her to monitor a vast amount of information in a short period through internet connection. This ability is very conveniently used to find 'non-citizens' within Gehenna active through the internet."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_will_of_steel: "National Subservience"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_will_of_steel_desc: "The appearance of the Head Prefect working for Gehenna's glory without a moment's rest is a virtue everyone should follow. The 'zeal' for the machine god spread among Prefect Team members will become a national religion to replace Germany's existing religions."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_reform: "Government Department Reform"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_reform_desc: "The guards, which was an unofficial organization, will be renamed the official Guard Department. Senior Administrator Ako will nominally hold the post of Head of the Guard Department, and the Guard Department will monitor the thoughts of all citizens who harbor disloyalty toward Sorasaki Hina and possess independent judicial power, including the right to summarily execute anti-regime trash."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_emergency_council: "Establishment of Emergency Council"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_emergency_council_desc: "A great iron man leader has been born. Unlike the previous weak god, the new iron man leader is ready to consume all citizens as resources and use them as fuel for the motherland's great development without any hesitation."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mobilisation: "National Mobilization Decree"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mobilisation_desc: "Becoming a component for the motherland is an honorable thing for the citizens themselves. Isn't that right?"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas: "Completion of State Capitalism"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_desc: "The machine god will control the entire economy and assign production quotas to each company. Shouldn't the national economy naturally be a tool controlled by the Prefect Team?"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_2: "A New Society"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_2_desc: "All citizens become components for the nation, and the economy is controlled by the new leader. Everything is running well."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mind: "Emotion Mimicry Center"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mind_desc: "Emotions were considered a quite... meaningless concept for the new Sorasaki Hina, but at least a minimum emotion center program is necessary for kind acting in front of Prefect Team members."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_hina: "The Sorasaki Hina Problem"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_hina_desc: "Before the machine god's second coming, there was Sorasaki Hina. The fact that a fake god who abandoned god is still alive and hiding somewhere is a quite unpleasant problem... and there is a need to find and eliminate her."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_end: "Baal Hunt"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_end_desc: "There was a loyal report from Senior Administrator Ako that a mentally ill person claiming to be the 'real Sorasaki Hina' had been caught. Thanks to the new emotion center, it seems it will be possible to shoot 'Sorasaki Hina' with a joyful heart."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2: "Heavenly Revolution"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_desc: "Head Prefect Sorasaki Hina has lamented over our lack of virtue and descended from her throne and vanished on her own. This means that our Gehenna culture, the Germans, all of Kivotos, or European culture did not fit 'Head Prefect Hina's leadership.' We... to follow the path of our lost savior. We must remodel everything—state and society, culture, ways of behavior, and language—and make them more whole!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_indiscriminate_prosecution: "Indiscriminate Prosecution"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_indiscriminate_prosecution_desc: "Prosecute and try them all! In the name of the Revolutionary Committee, long live! And death to the traitors! Kill the Gehenna that killed Sorasaki Hina! Stab and kill from the very bottom to the very top!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_liberalism: "Gehenna Liberalism"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_liberalism_desc: "Originally, there is no control in Gehenna! Looking at the benevolent rule of Manmajeon and the Prefect Team, the free exercise of rights by numerous clubs, and the various meetings the Head Prefect had with Gehenna clubs, freedom is the essence of Gehenna Academy's pure culture! Long live freedom!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_order_politics: "Gehenna Order Politics"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_order_politics_desc: "Head Prefect Sorasaki Hina always personally caught and locked up Gehenna terrorists! This is proof that she sought order within decadent Gehenna culture! Long live order!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_rebel_attack: "Attack on the Treasonous"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_rebel_attack_desc: "'Treasonous' is a sort of populist label used among the zealots, the main players of the revolution, for 'all those who caused excessive work for Sorasaki Hina, instigated Gehenna-German chaos, and engaged in anti-Head Prefect activities.'"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution: "Cultural Revolution"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution_desc: "It is fitting to sweep away the decadent Euro-Kivotosian Gehenna-Trinity-German-Kivotosian-European culture, which creaks like mismatched gears, and establish our order. Long live Head Prefect Sorasaki Hina!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution_tt: "No longer able to proceed with focus trees related to §YGehenna-Bavarian Culture§!, and §Yall related national spirits§! will be removed."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_communist: "Traitors are Left-wingers"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_communist_desc: "The left-wing terrorist reds are the ones who instigated and manipulated our Sorasaki Hina and incited Gehenna Academy's chaos through broad anti-Gehenna activities. Arrest them all and ban all so-called 'avant-garde' activities in the revolution!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_nazist: "Traitors are Right-wingers"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_nazist_desc: "The right-wing terrorist Nazi bastards are the ones who tried to manipulate the Head Prefect from behind and led anti-Gehenna activities through armed militias to seize control of Gehenna Academy. Arrest them all and ban all so-called 'ultra-conservative' activities in the revolution!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_revolution_accomplished: "Revolution Accomplished"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_revolution_accomplished_desc: "The political direction within the Gehenna Student Revolutionary Government has finally been decided, and the compass for eternal worship of Head Prefect Sorasaki Hina and numerous political reforms has been set."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_sorasakism: "'Sorasakism'"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_sorasakism_desc: "'Sorasakism' refers to various political, social, and religious movements that look back on all of Head Prefect Sorasaki Hina's words and actions and attempt to inherit those behaviors. It is a way of life that polishes and awakens the entire nation or individuals by thinking of Sorasaki Hina's policies in the political world, her words in society, and her journey in religious circles."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehenna_commune: "Gehenna Commune"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehenna_commune_desc: "Long live the equal and chaotic free Gehenna of all free clubs, revolutionary councils, free labor unions, and numerous people's autonomous governments! Long live the Commune! Long live the Academy of Chaos and Freedom!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_religious_ecstasy: "Religious Ecstasy"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_religious_ecstasy_desc: "Being wary of both left and right, we must inherit orthodox 'Sorasakism' and embody it as a way of life. Long live the Holy Gehenna State. And long live the fallen Head Prefect, Sorasaki Hina."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_second_order_state: "Second Order State"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_second_order_state_desc: "'Arrest all treasonous elements!'\nWe must establish a Gehenna Order State to sweep away the numerous 'treasonous elements' who threatened and manipulated Sorasaki Hina from behind! Long live the new 'Prefect activity'! Long live Order Gehenna!"

#### Ako
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a: "Senior Administrator of the Prefect Team"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_desc: "Despite Ako's efforts to decentralize Head Prefect Hina's power and introduce technocracy to reduce Hina's burden, Hina disappeared leaving behind a single resignation letter. What filled Ako's heart was not a sense of betrayal, but a curse toward herself for being incompetent and unable to change the outcome."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_iroha: "Prefect Head Iroha"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_iroha_desc: "Since we took control of Pandemonium Society, Natsume Iroha has been evaluated as the most rational person to take over the long-vacant position of Prefect Head during the collective leadership system. She is a simple bureaucrat with no political factionalism, and as a member of the old Pandemonium Society, she has no influence over the Prefect Team, making her an 'easy to handle' figure."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_kayoko: "Prefect Head Kayoko"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_kayoko_desc: "Onikata Kayoko is also a talented individual capable of taking over the long-vacant position of Prefect Head while the collective leadership system continues. She is someone Senior Administrator Ako trusts, noting she possesses 'exceptional talent.' While she may not be suitable as a puppet, she will respect our technocratic system and make decisions that benefit Gehenna's future."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_seminar: "Planning Bureau's Budget Interference"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_seminar_desc: "Millennium's 'Seminar' is a perfect and exemplary group, a true jewel of technocracy. An organization composed of brilliant technocrats handles budget allocation, and all other departments must submit their projects to Seminar for budget approval. While the [ROOT.GetLeader] administration cannot create a new Seminar due to strong backlash... we can at least demonstrate our firmness in budgetary matters."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_reduction_in_defense_budget: "Defense Budget Reduction"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_reduction_in_defense_budget_desc: "This isn't exactly political retaliation, but the Planning Bureau wishes to shrink the excessively large budget of the Enforcement Bureau and redirect it toward industrial development. To reiterate, this is efficient budget reallocation, not political revenge."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_centre_of_culture: "Academy of Culture"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_centre_of_culture_desc: "$GEH_4th_ako_centre_of_culture_desc$"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_future: "Sorasaki Hina Memorial Scholarship"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_future_desc: "Even though she left us behind, Sorasaki Hina was a presence too precious to both Administrator Ako and the Planning Bureau. Ako intends to establish a scholarship foundation in her name to provide grants to talented art university students, regardless of whether they are Kivotos-born or locals."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_start: "Struggle Toward a Police State"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_start_desc: "What drove Head Hina away was the mountain of work, the corrupt social culture, and the low-life local criminals... all of it. The Planning Bureau argues that no mercy should be shown to the locals who made Head Hina leave."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_1: "Suppression of Local Enterprises"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_1_desc: "To prevent the Germans from holding power, it is vital to seize their financial lifelines. We must hinder the establishment of German-owned companies and impose regulations requiring all new businesses to be joint ventures with Kivotos-based entities."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_2: "Completion of National Corporatism"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_2_desc: "We have completed a state-led corporatism and established a proper economic system controlled by technocrats."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center: "Forming the Hina Search Team"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center_desc: "Hina might have abandoned Ako, but Ako has not abandoned Hina. Even if it means throwing away the rest of her life, or even if Hina has already... passed away. Ako will dedicate her remaining years to finding even just her remains."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_1: "Education Initiative"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_1_desc: "Specialized education programs will be implemented to cultivate the technocrats of the future."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_2: "[ROOT.GetLeader] Law"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_2_desc: "How should the rights of German natives be redefined in the new Gehenna? Whether the pluralistic views of Kayoko or the hatred of the Planning Bureau towards locals will be reflected in the law depends on the leader we elected in the past."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_end: "World We Changed"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_end_desc: "\"Head Hina, the world isn't something I can change alone. And of course, it's not something you can change alone either. ...Only when we are together can we change the world together.\""

#### Iori
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c: "Night of Chaos"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_desc: "How can we possibly handle the fact that Head Sorasaki Hina disappeared overnight? If the Great Migration hadn't happened, and if the Pandemonium madmen, Nazi terrorists, and Red rioters weren't running wild, Head Sorasaki Hina wouldn't have had such a hard time. We must correct all these errors immediately."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_weak_attack: "Assault on the Weak"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_weak_attack_desc: "The German citizens who defile the pure Gehenna-Kivotos culture are undoubtedly a cancer within our Gehenna. To protect our pure culture and keep the great spirit of Gehenna untainted, we must ensure German citizens cannot hold high-ranking government positions. ...This will surely alleviate the political pressure on our government."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_kivotosism: "National Kivotosism"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_kivotosism_desc: "Our martial law declares that Head Hina went missing due to 'disturbances by the Germans' and an overwhelming workload—something that would never have happened in the past when only Kivotos culture existed!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_our_identity: "Our Identity"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_our_identity_desc: "Gehenna Academy must always maintain pure Kivotos culture, and this shall serve as the guiding principle for our new government. The difference between Kivotosians and Earthlings is clear; we must declare ourselves to be the truly advanced 'humanity'."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_free_fatherland_defense_alliance: "Free Fatherland Defense Alliance"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_free_fatherland_defense_alliance_desc: "To protect the pure Gehenna-Kivotos culture and defend the fatherland, a strong solidarity between students, citizens, and the government is required. Our leadership will be reorganized into the 'Free Fatherland Defense Alliance,' which will serve as the first step in projecting government authority to the people and establishing a strong, united academy."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_united_nation_reconstruction_committee: "United National Reconstruction Committee"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_united_nation_reconstruction_committee_desc: "Everyone is exhausted now. Gehenna Academy needs healing. It has suffered through far too many incidents and accidents, contaminated by riots from various clubs and terrorism from German rebel organizations. We must now wipe away that contamination by establishing the 'United National Reconstruction Committee' to rebuild our nation."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_regensburg_riot_decree: "Regensburg Riot Decree"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_regensburg_riot_decree_desc: "We can no longer tolerate anti-Kivotos subversives, Gehenna terrorists, communists, and Nazis running rampant in our country. We must push through a powerful bill to ensure incidents like the Regensburg Riot—which was clearly a massive insurrection against the Prefect Team—never happen again."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_territory_reconstruction_ministry_establishment: "Establishment of the Ministry of National Reconstruction"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_territory_reconstruction_ministry_establishment_desc: "The Planning Bureau grew increasingly corrupt under Amau Ako's leadership. Since she fled with her collaborators, they have committed treason by supporting anti-martial law factions and obstructing our progress. The Planning Bureau must be disbanded."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_planning_ministry_role_expansion: "Expansion of the Planning Bureau's Role"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_planning_ministry_role_expansion_desc: "Now that Amau Ako is gone, we must completely erase her name from the Planning Bureau and reorganize it into a normal governing body for Gehenna. We cannot let even the competent members of the bureau rot alongside her."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_order_restoration: "Restoring Order in Gehenna"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_order_restoration_desc: "As the remnants of the anti-martial law faction are mostly purged, we will stabilize Gehenna by enacting a new constitution to create a powerful Gehenna, protect the academy for its students, and build a republic for our people."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_priority: "Gehenna First"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_priority_desc: "Naturally, our activities must be conducted for the Gehenna people with their support. We will support our citizens who live in Gehenna Academy, who support us, and whom we must protect from numerous foreign threats."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pan_kivotos: "Pan-Kivotos"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pan_kivotos_desc: "To resist anti-Kivotos human civilizations, students from all across Kivotos, not just Gehenna, must unite. Gehenna Academy will grow larger and accommodate even more students."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_forced_assimilation: "Forced Assimilation of Germans"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_forced_assimilation_desc: "For the reconstruction of the Kivotos-Gehenna civilization, the Germans must vanish. German culture will be phased out, and they will accept Kivotos-style names and Gehenna civilization."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_gehennan: "German-Gehennans"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_gehennan_desc: "For the sake of reconstruction—that pure name—everyone, whether Gehennan, Kivotosian, or German, must cooperate. To that end, we will issue legitimate citizenship to Germans and accept them as secondary citizens."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pure_kivotos_cultural_leap: "Pure Kivotos Cultural Leap"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pure_kivotos_cultural_leap_desc: "To weed out ethnic cultural contamination, we must select pure Kivotos culture and preserve the pure culture, language, and entertainment of the Gehenna and Kivotos people. This must continue until our brilliant community shines forever."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_forward_step_of_jeminj: "Forward Step of the People"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_forward_step_of_jeminj_desc: "Look here, Amau Ako. It's not petty paperwork or feasibility assessments—emotional appeals and mass propaganda work much better on Germans and Gehennans. Our 'Gehenna People' will now leap toward tomorrow."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_leader_of_nation_and_fatherland: "Leader of Nation and Fatherland"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_leader_of_nation_and_fatherland_desc: "To praise pure Kivotos culture and protect the rising sun of tomorrow, our national leader must become a farmer tilling the soil. A stronger, massive single authority is needed to expel threats from the East and West, as well as internal enemies."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_conscription_equality: "Equality Under Conscription"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_conscription_equality_desc: "Universal conscription will be implemented, ensuring that anyone who completes military service—regardless of affiliation, origin, or race—can exercise legitimate citizenship. Since cultural contamination exists not only on Earth but also within Gehenna, we will create a great nation to defend 'our fatherland'."

#### Normal
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n: "Four Seats, Three People"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_desc: "No excuses can justify it, and no amount of flashy propaganda can hide it. Sorasaki Hina has vanished, leaving only a single resignation letter, and our government has ground to a halt. While Amau Ako has taken over as Acting Prefect Head, she seems to be suffering more from despair and guilt than from a desire to take on her new duties."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_left: "Carrying the Medical Bag"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_left_desc: "Bureaucrats are wavering after Sorasaki Hina's resignation. The massive burden of responsibility that Hina carried now falls heavily upon the ordinary Prefect Team members."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_right: "Strengthening the Specialist's Will"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_right_desc: "The morale of ordinary Prefect soldiers, including the Enforcement Bureau, is at its worst. In these difficult times, it is Iori's role to ensure our forces do not collapse."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start: "To Rescue You"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_desc: "Following the Prefect Head's resignation, Amau Ako has been unable to perform her duties normally due to guilt. Even without being a medical expert like Chinatsu, anyone can see Ako is suffering from a depressive disorder. The problem is that beyond just expressing sadness, Administrator Ako is increasingly talking openly about 'complete atonement for Head Hina.' ...Before we find our Senior Administrator hanging from a tree, we must move."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_late_reform: "Belated Reform"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_late_reform_desc: "It has finally become clear... too late... that Administrator Ako was right about the Prefect Head's workload being excessive and that authority needed to be decentralized through bureaucratic reform. We must grant more power to the middle-ranking bureaucrats of the Planning Bureau and ensure their autonomy."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_liaison_meeting: "War Ministry Liaison Meeting"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_liaison_meeting_desc: "Perhaps Iori's militaristic policies were right after all. If we had taken a hardline stance as Iori suggested... Head Hina might have strengthened her resolve through a sense of duty to protect Gehenna. The liaison meeting will establish a 'War Ministry' centered on the Enforcement Bureau and allow military leaders more autonomy in budget usage."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_decentralization_of_work: "Memories of the Zealots"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_decentralization_of_work_desc: "Perhaps the zealots who claimed only Sorasaki Hina could lead the Prefect Team were right in some way. Maybe because we didn't cherish her, she didn't cherish us either. Reunited in regret, the zealots will collect records of Hina to create a biography, ensuring she is remembered forever."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_new_leadership: "Direct Election of the Prefect Head"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_new_leadership_desc: "From now on, the Prefect Head will be determined by a vote of the Prefect Team officers. We have concluded that we placed too much of a burden on Head Hina, and that this stems from the warlord-like dictatorial nature of the Prefect Head position. If a leader must constantly face re-evaluation and potential dismissal by officer vote, their responsibility and political burden will be alleviated."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_investigative_operation: "$GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center$"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_investigative_operation_desc: "$GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center_desc$"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_righteousness: "Flag of Justice"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_righteousness_desc: "The Prefect Team has suffered an unforgettable wound. Through reform, we have moved past the mistakes committed by the Team and created an organization that we can be proud of in front of the now-absent Head Hina."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_end: "So the Sun Rises Tomorrow"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_end_desc: "A report has come in from Senior Administrator Ako that the missing Head Hina has been found. While Head Hina refuses to return to her duties as Prefect Head, perhaps through persuasion we can... at least ask her to sit in the empty space beside us and watch over us once more?" 

### Diplomacy
 GEH_diplomacy_focus: "[ROOT.GetName] Diplomacy"
 GEH_diplomacy_focus_desc: "Through the 3rd Prefect General Assembly, we have realized the path our diplomacy must take in the international community."

 GEH_diplomacy_isolationism_focus: "Defense First"
 GEH_diplomacy_isolationism_focus_desc: "Let's be clear. We will not walk the path of the Thunder Emperor. Wars of aggression are not the correct future for Gehenna; we will find ways to defend the fatherland from enemy attacks."

 GEH_diplomacy_isolationism_focus_1: "Finding Allies"
 GEH_diplomacy_isolationism_focus_1_desc: "We seek allies to build a collective security system with. ...Surely at least one country will agree."

 GEH_diplomacy_isolationism_focus_2: "Building a Defensive Line"
 GEH_diplomacy_isolationism_focus_2_desc: "They say offense is the best defense, but what about the lives of the citizens who would die in that offense? Fortifying the national territory is the more righteous path."

 GEH_diplomacy_isolationism_focus_3: "Peaceful Fatherland Gehenna"
 GEH_diplomacy_isolationism_focus_3_desc: "It is enough for us to protect what we already have. There is no need for further territorial expansion."

 GEH_diplomacy_managed_democracy_focus: "Expansion of Managed Democracy"
 GEH_diplomacy_managed_democracy_focus_desc: "Gehenna has a moral mission to spread freedom and democracy throughout Kivotos. Speaking in terms of Realpolitik, we have secured all of Gehenna and can bring Europe into our sphere of influence by establishing satellite states throughout Kivotos and Southwestern Europe."

 GEH_diplomacy_managed_democracy_focus_1: "Euro-Kivotos Redemocratization"
 GEH_diplomacy_managed_democracy_focus_1_desc: "We know many nations in Kivotos are authoritarian, and we will bring them freedom and justice."

 GEH_diplomacy_realpolitik_focus: "Expanding Gehenna"
 GEH_diplomacy_realpolitik_focus_desc: "Gehenna must grow wider. In particular, the dangerous eastern enemy, [SOV.GetName], is a foe that must be destroyed to maintain our order. If we let them grow, they will one day conquer us."

 GEH_diplomacy_realpolitik_focus_1: "March to the East"
 GEH_diplomacy_realpolitik_focus_1_desc: "The great bear of the east, [SOV.GetName], is a severe threat to our security and must be eliminated."

 GEH_diplomacy_find_collaborator: "Finding Collaborators"
 GEH_diplomacy_find_collaborator_desc: "We will be able to find collaborators who align with our great will."

 GEH_diplomacy_european_hegemonic: "Kivotos-European Hegemony"
 GEH_diplomacy_european_hegemonic_desc: "Our power has made all of Europe and Kivotos stand tall. Long live the Great Leader [ROOT.GetLeader]!"

 GEH_diplomacy_crisis_in_kivotos_focus: "Crisis in Kivotos"
 GEH_diplomacy_crisis_in_kivotos_focus_desc: "We have been granted the sacred duty of protecting social order, and we have the righteous mission to defend Kivotos from the approaching threat of [GEI.GetName]."

 GEH_diplomacy_chroma_crisis_focus: "Confronting the Chroma"
 GEH_diplomacy_chroma_crisis_focus_desc: "The Chroma, a mysterious enemy from another world, spreads madness that drives our citizens insane. There is no negotiating with them; we can only fight back."

 GEH_diplomacy_decagrammaton_crisis_focus: "Confronting Decagrammaton"
 GEH_diplomacy_decagrammaton_crisis_focus_desc: "They who call themselves absolute beings are our natural enemies. For the victory of humanity, we must face those robots."

 GEH_diplomacy_decagrammaton_alliance_focus: "Alliance with Decagrammaton"
 GEH_diplomacy_decagrammaton_alliance_focus_desc: "They are not dangerous beings. They are practitioners seeking a higher state. Do not resist."

### Hina Departure Route Diplomacy ###

 GEH_three_congress_focus_no_hina_diplomacy: "4th [ROOT.GetAdjective] General Assembly"
 GEH_three_congress_focus_no_hina_diplomacy_desc: "War, conflict, political turmoil... since the Great Migration, we have faced much suffering, but the [ROOT.GetLeader] government has settled the chaos and is ready to host the 4th General Assembly. This new assembly will determine the foreign policy of our internally unified nation."

 GEH_three_congress_focus_no_hina_diplomacy_attack_benelux: "Integration of the Low Countries"
 GEH_three_congress_focus_no_hina_diplomacy_attack_benelux_desc: "The Low Countries have suffered from the conflict between the incompetent General Student Council and Schale. They are all our enemies."

 GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux: "Respecting Low Country Rule"
 GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux_desc: "We will let the General Student Council or Schale rule the Low Countries as they please. Our goals lie in greater places... there is no need to waste national strength in war with them."

#### Gehenna Exceptionalism
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first: "Gehenna Exceptionalism"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_desc: "Gehenna is an exceptional state in the existing order of Kivotos, possessing the strength and the right to seize hegemony over all of Kivotos."

 GEH_three_congress_focus_no_hina_diplomacy_central_europe_union: "Mitteleuropa Front"
 GEH_three_congress_focus_no_hina_diplomacy_central_europe_union_desc: "No nation can stand alone. For the construction of a Great Gehenna, we will build a cooperative front with the most reliable nations."

 GEH_three_congress_focus_no_hina_diplomacy_attack_millennium: "Conquest of Western Kivotos"
 GEH_three_congress_focus_no_hina_diplomacy_attack_millennium_desc: "The superior technology of the Millennium region should be used for our Gehenna, not for them."

 GEH_three_congress_focus_no_hina_diplomacy_attack_kaiser: "Eliminating Kaiser Influence"
 GEH_three_congress_focus_no_hina_diplomacy_attack_kaiser_desc: "Kaiser Corporation has supported numerous crimes and lawless acts throughout Kivotos since before the Great Migration. They also harbor ambitions to conquer Kivotos. Kaiser's and [KAI.GetLeader]'s ambitions, which do not align with Gehenna's order, must now be wiped out."

 GEH_three_congress_focus_no_hina_diplomacy_attack_south_kivotos: "Conquest of Southern Kivotos" 
 GEH_three_congress_focus_no_hina_diplomacy_attack_south_kivotos_desc: "The Southern Kivotos nations, moved south of Gehenna since the Great Migration, have become a major threat to us. Ensuring they cease to exist is the way forward for Gehenna's order."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_1: "Enforcing Our Discipline" 
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_1_desc: "Since before the Great Migration, we sought to establish a proper Gehenna society through discipline and order. We will do the same in our occupied territories. Whether they want it or not."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_2: "Unifying Kivotosians"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_2_desc: "The chaos of the Great Migration brought about a confrontation between Kivotos nations and local nations. If our Kivotos does not unite under one massive order, we will be defeated while divided."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_3: "All Order Leads to Gehenna"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_3_desc: "The Thunder Emperor's dream has been realized. Gehenna stands tall above Kivotos. All Gehenna heroes will be proud of us. The glory of [ROOT.GetName] and the victory of [ROOT.GetLeader] are before us."

#### Guardian of Kivotos
 GEH_three_congress_focus_no_hina_diplomacy_protection_of_freedom: "Guardian of Kivotos"
 GEH_three_congress_focus_no_hina_diplomacy_protection_of_freedom_desc: "We must move eastward and fight against the wicked eastern human nations that threaten Kivotos. We will be the strong shield protecting Kivotos from the Red Bear."

 GEH_three_congress_focus_no_hina_diplomacy_claim_intermarium: "Claiming Intermarium Sovereignty"
 GEH_three_congress_focus_no_hina_diplomacy_claim_intermarium_desc: "Eastern Europe is a buffer zone we must inevitably possess to defend against attacks from the [SOV.GetName] side."

 GEH_three_congress_focus_no_hina_diplomacy_anti_bolshevism_declaration: "Anti-Bolshevism Declaration"
 GEH_three_congress_focus_no_hina_diplomacy_anti_bolshevism_declaration_desc: "So-called Marxism-Leninism is nothing more than a crude ideology, worse than Chairman Cherino's fake mustache. For the spread of the free Gehenna order, we will stand firmly against all types of Bolshevism."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet: "Operation Twilight of the Gods"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_desc: "Moscow is like a rotten door; if Gehenna's great army kicks it, it will simply break open. All war preparations are complete, and we will fight for the glory of Gehenna. We shall surely prevail!"

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1: "Recruiting White Army Volunteers"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1_desc: "By contacting local forces resisting the tyrannical rule of [SOV.GetName], we can gain advantages for our activities in the East."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2: "Emergency Winter War Training"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2_desc: "[SOV.GetAdjective] territory is extremely cold and barren; we must prepare for battle through equipment and special training for winter warfare."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_3: "Gehenna's Eastern Settlement"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_3_desc: "Newly acquired eastern territories will be integrated into Gehenna through proper management. We won this war and protected Kivotos from the Red Nightmare. This great achievement will be remembered forever."

#### Realpolitik
 GEH_three_congress_focus_no_hina_diplomacy_realpolitik: "Realpolitik"
 GEH_three_congress_focus_no_hina_diplomacy_realpolitik_desc: "We will gain several allies and seize political and military hegemony in Central Europe."

 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_alliance: "South Kivotos Alliance"
 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_alliance_desc: "South Kivotos is a region close to us, and our interests largely align. Cooperating with them will allow us to achieve mutual prosperity."

 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_merge: "South Kivotos Integration"
 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_merge_desc: "South Kivotos could become a potential enemy, so we need to attack them before they attack us."

 GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance: "Exerting Influence on the Balkans"
 GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance_desc: "The Balkans are divided but strong; they can be good partners for us."

 GEH_three_congress_focus_no_hina_diplomacy_balkans_merge: "Balkans Conquest"
 GEH_three_congress_focus_no_hina_diplomacy_balkans_merge_desc: "The Balkans are a divided enemy that can be defeated piece by piece, and they must be removed for our expansion policy."

 GEH_three_congress_focus_no_hina_diplomacy_attack_italy: "Operation Alaric"
 GEH_three_congress_focus_no_hina_diplomacy_attack_italy_desc: "Italy managed to preserve its national identity after the Great Migration, but their luck ends now. [ITA.GetLeader]'s throne will fall, and we will plant Gehenna's flag in Rome."

 GEH_three_congress_focus_no_hina_diplomacy_union_south_kivotos: "South Kivotos Liberation Declaration"
 GEH_three_congress_focus_no_hina_diplomacy_union_south_kivotos_desc: "The collapse of the Italian colonial empire has become a symbolic event, granting us complete hegemony over all of South Kivotos. We have become a great power standing tall in Kivotos."

 GEH_three_congress_focus_no_hina_diplomacy_soviet_peace: "[ROOT.GetAdjective]-[SOV.GetAdjective] Non-Aggression Pact"
 GEH_three_congress_focus_no_hina_diplomacy_soviet_peace_desc: "At least for now, our blade is pointed south, and there is no need to extend our front by confronting [SOV.GetLeader]. It would be better to maintain peace through a temporary non-aggression pact."

 GEH_three_congress_focus_no_hina_diplomacy_soviet_military_exchange: "[SOV.GetAdjective] Tech Exchange Agreement"
 GEH_three_congress_focus_no_hina_diplomacy_soviet_military_exchange_desc: "Despite our differences, [SOV.GetName]'s weapons are excellent and will be a great help in maintaining powerful hegemony on Earth after the Great Migration."

