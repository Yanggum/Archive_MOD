 GEH_iori_despotic_route_ending_1_tt: "§gThe ending of the Iori route where Hina has disappeared unfolds. In the chaos left by Sorasaki Hina's absence, Shiromi Iori established order with an iron fist. Crying out for the superiority of 'Pure Kivotos Culture' and the 'Halo,' she purged all opposition and transformed Gehenna into a powerful nationalist state united by hatred for the outside. Now, under the banner of Gehenna, Iori's steel will shall lead the motherland into a new era of war.\n\nThis story would not have been possible without everyone who played the mod! Thank you!§!\n\n"
 GEH_iori_despotic_route_ending_2_tt: "§gThe ending of the Iori route where Hina has disappeared unfolds. Using Sorasaki Hina's tragedy as a pretext, Shiromi Iori bound the scattered Gehenna together under the banners of 'Healing' and 'Reconstruction.' Her order silenced all dissenting opinions and forcibly melted the disparate German culture into the great crucible of Gehenna to create a single people. Amidst the stability she achieved, Iori faced the shadows of the past alone and resolved to move forward regardless. Gehenna's future now rests in her hands.\n\nThis story would not have been possible without everyone who played the mod! Thank you!§!\n\n"
 GEH_iori_route_ending_1_tt: "§gThe 'War Crimes Investigation' ending of the Iori route unfolds. Sorasaki Hina chose the most painful path to erase the bloodstained marks left by Shiromi Iori's militarism. She brought past comrades to the judgment stand and dismantled the militarized system, bringing an unstable but new democracy to Gehenna. Though complete integration was not achieved, she believes this divided reality is her atonement and Gehenna's new beginning.\n\nThank you for enjoying all the content made for the Gehenna Prefect Team. This would not have been possible without the players. Thank you!§!\n\n"
 GEH_iori_route_ending_2_tt: "§gThe 'Extension of Emergency Powers' ending of the Iori route unfolds. Sorasaki Hina willingly chose the path of a dictator to protect her comrades and defend order. She paid the price of losing the support of Gehenna students, but in exchange, she established a new nation called the 'Gehenna-Deutsch Federation' through solidarity with the Germans. The peace and harmony she achieved will at least remain as an achievement, and no one knows what emotions she felt at the end of that road.\n\nThank you for enjoying all the content made for the Gehenna Prefect Team. This would not have been possible without the players. Thank you!§!\n\n"
 GEH_normal_route_ending_tt: "§gThe ending of the Prefect Team's competitive route unfolds. Sorasaki Hina endured all the weight pressing down on her and finally brought stability to Gehenna. Neither a dictator nor a martyr, she chose the path of retiring with honor as a student who fulfilled her duties. Now, having cast off the heavy armor of the Prefect Head, she will be writing her own story somewhere quiet.\n\nThank you for enjoying all the content made for the Gehenna Prefect Team. This would not have been possible without the players. Thank you!§!\n\n"
 GEH_ako_route_ending_tt: "§gThe ending of the Ako route unfolds. Though the story of Ako and Hina ends here, the two can continue to create wonderful stories in this world. Toward the future, the two friends of the Gehenna Prefect Team move forward together.\n\nThank you for enjoying all the content made for the Gehenna Prefect Team. This would not have been possible without the players. Thank you!§!\n\n"
 GEH_no_hina_ending_tt: "§gThe Hina Desertion route ending unfolds. Next time, please make sure Sorasaki Hina doesn't throw away her position as Prefect Head!\n\nThis story would not have been possible without everyone who played the mod! Thank you!§!\n\n"
 GEH_hina_route_ending_1_tt: "§gThe Hina route ending unfolds. Sorasaki Hina's original personality succumbed to another and vanished. Deutschland has now turned into a hell on earth. But, even at the bottom of that Hinnom, within the pillars of Gehenna's fire, people live on. To face tomorrow.\n\nThank you for enjoying all the content made for the Gehenna Prefect Team. This would not have been possible without the players. Thank you!§!\n\n"
 GEH_hina_route_ending_2_tt: "§gThe Hina route ending unfolds. Sorasaki Hina overcame her inner malice and decided to move toward the future embracing even her weakness. Gehenna's present is submerged in deep darkness, but a better day will come tomorrow. At least, Ako believes so.\n\nThank you for enjoying all the content made for the Gehenna Prefect Team. This would not have been possible without the players. Thank you!§!\n\n"
 GEH_hina_route_ending_3_tt: "§gThe Hina route ending unfolds. Sorasaki Hina is waiting for the day she and Ako will 'disappear' from this world together. The trigger will eventually be pulled, and the piano melody will one day stop. But at least, that day is not today.\n\nThank you for enjoying all the content made for the Gehenna Prefect Team. This would not have been possible without the players. Thank you!§!\n\n"

