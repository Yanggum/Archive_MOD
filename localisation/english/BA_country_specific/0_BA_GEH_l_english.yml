 GEH_universalism_charter: "'보편주의' 헌장"
 GEH_gehenna_national_harmony_solidarity: "게헨나 국가조화연대"
 GEH_commercial_agricultural_industrial_cooperation: "상농공 협화"
 GEH_german_labor_front_succession: "독일 노동전선 인계"
 GEH_weakening_big_capitalists: "대자본가 약화"
 GEH_political_and_administrative_center: "정치와 행정의 중심지"
 GEH_harmony_fatherland_solidarity: "조화, 조국, 연대"

 GEH_gradual_dismantling_of_conscription_system_desc: "만마전과 트리니티라는 거대한 주적 두 개가 모두 궤멸하고, 게헨나의 세계적 위치가 안정돼 가는 현재, 우리는 비대한 징병제를 축소하고 정상 국가화를 추진해야 합니다."
 GEH_dismantling_of_militarized_system_desc: "대중영합주의와 네거티브, 그리고 소수자 박해와 수많은 가짜 선전들은 현재 게헨나 정치의 일상과도 같아졌습니다. 우리는 이 극도로 위태로운 선전 기계들을 축소하고 안정적인 국가를 수립하기 위한 첫걸음을 내디딜 것입니다."
 GEH_indefinite_extension_of_emergency_powers_desc: "...한번 피를 묻힌 이상, 시로미 이오리와 실행부는 두 번 다시는 이전으로 돌아갈 수 없습니다. 소라사키 히나는 본인의 안녕을 위해 시로미 이오리라는 기나긴 동료이자 대전이 이전부터 이어온 연을 훼손시킬 수 없을 것입니다."
 GEH_investigation_of_shirokami_ioris_war_crimes_desc: "소라사키 히나는 시로미 이오리와 선도부가 벌이는 행위에 질렸으며, 이내 그들의 영향력을 크게 훼손시키고 게헨나 학원을 이전으로 되돌리기 위한 거대한 개혁을 추진할 것입니다. 비록 그것이 키보토스 시절부터 이어져 온 연을 훼손시킬지라도요."
 GEH_execution_unit_temporary_sanctions_desc: "시로미 이오리의 실행부는 현재 게헨나 선도부에서 가장 막강한 권력을 휘두르는 거대 조직이며, 이는 시로미 이오리를 제외하더라도 선도부의 정상국가화에 크나큰 장애물이 될 것입니다."
 GEH_restoration_of_planning_department_authority_desc: "실행부와 기획부 간의 권력 투쟁은 키보토스 시절부터 이어져 왔으며, 실행부가 정치적 주도권을 가지고 있는 현재 기획부의 권한은 선도부 사상 최악으로 축소되어 있습니다. 우리는 이를 조정하고 양 부서의 충돌을 완화할 방안을 마련할 것입니다."
 GEH_restoration_of_medical_department_authority_desc: "실행부와 전쟁부의 다양한 월권 행위들에 의해 의료부가 행하는 여러 활동은 손상되어 왔으며, 우리는 이를 바로잡을 것입니다."
 GEH_gehenna_prefect_team_revival_desc: "게헨나 선도부는 학생을 보호하고 규율을 유지하는 선에서 멈춰 서야만 합니다. 게헨나 학원과 선도부는 현재 구분되지 아니할 정도로 정치적 지도력이 일방적이나, 우리는 선도부의 본질을 다시 되새기고 확인해야 합니다."
 GEH_cornerstone_of_a_defense_nation_desc: "실행부의 일방적인 폭정 속에서 나타난 가장 특징적인 점이자, 최고의 발명품은 다름 아닌 전쟁부일 것입니다. 그러기에 우리는 선도부 체제의 여러 군사 작전 수행의 오류를 수정하고 다양한 전쟁 활동을 보조해 온 전쟁부를 고작 실행부의 일방적 이용 조직이 아닌, 문민 통제의 원칙을 도입하고 게헨나 전체의 방위를 위한 조직으로 인정할 것입니다."
 GEH_national_defense_commissioner_sorasaki_hina_desc: "실행부와 전쟁부를 유의미하게 분리하고 게헨나 학원의 안정화를 추진하기 위해서는, 선도부장과 전쟁부장의 겸임과 실행부와의 괴리가 필요합니다. 소라사키 히나는 이를 위해 국방위원장이라는 새로운 게헨나 학생회장직을 창설하고, 이에 스스로 오를 것입니다."
 GEH_departure_with_a_sigh_desc: "게헨나 학원의 이상, 민주주의의 가치, 선도부의 목표.... 이제는 잊힌 말입니다. 누가 뭐라고 하더라도, 현재의 선도부는 군부 독재정권으로 비치며, 사실은 부정할 수 없는 사실입니다. 그러나, 우리는 우리의 국체를 지키기 위해서. 이 체제를 수호해야 합니다."
 GEH_german_equality_conscription_desc: "어쩌면, 독일인들을 향한 관용과 유화책을 통해 더 나은 국가를 만들기 위해 노력할 수 있습니다. 새로운 선도부의 이상향을 찾아내고 우리는 그 것을 향해 움직일 것입니다."
 GEH_our_new_supporters_desc: "좋아요, 절대로 학생과 키보토스계 인류의 지지를 끌어내는 데 실패해서 광범위한 평등주의를 도입하고 독일계를 편으로 끌어들이는 것이 아닙니다. 이는 그저 선도부가 본래 해야 했을 두 세계 간의 갈등을 조절하고 이상을 유지하는 일일 뿐입니다."
 GEH_universalism_charter_desc: "'모든 국민은 평등하다. 누구든지 출신 지역, 인종, 국적에 의하여 정치적 - 경제적 - 사회적 - 문화적 생활의 모든 영역에 있어서 차별을 받지 아니한다.'\n\n게헨나 선도부는 이제 키보토스인과 지구인 간 갈등을 중재하고, 두 세계의 안정적인 통합과 인종 갈등에 대한 반대로 이루어질 것입니다."

