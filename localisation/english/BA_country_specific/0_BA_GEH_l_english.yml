 GEH_ako_love_balance: "히나의 아코에 대한 생각"

 GEH_hina_love_ako_side: "사적인 친밀함"
 GEH_hina_hate_ako_side: "사무적인 관계"

 GEH_ako_love_netural_side: "갈팡질팡"

 GEH_hina_love_ako_side_low: "애정을 받아들임"
 GEH_hina_love_ako_side_win: "사실상의 커플"

 GEH_hina_hate_ako_side_low: "거리를 둠"
 GEH_hina_hate_ako_side_win: "'아마우 선임행정관'"

 ### 디시전 ###
 GEH_walk_with_ako: "아코와의 사적인 휴가"
 GEH_walk_with_ako_desc: "기획부가 선도부장의 업무 중 많은 부분을 담당하게 되었기 때문에 키보토스에서라면 불가능했을 자유로운 휴가가 가능해졌습니다. 물론 너무 잦은 휴가를 사용할 수는 없겠지만, 아코와 함께 여행을 떠나자고 제안하는 건 그녀도 거절하지 않을 겁니다."
 
 GEH_give_ako_present: "아코에게 선물 제공"
 GEH_give_ako_present_desc: "비싸지 않은 물건이라도, 아코는 선도부장의 선물 자체를 반길 것입니다."
 
 GEH_visit_planning_department: "기획부 방문"
 GEH_visit_planning_department_desc: "답답한 선도부장실에서 혼자 서류 업무를 처리하고 있을 겁니까? 아코를 만나기 위해 기획부를 직접 찾아가, 그녀의 책상 맞은 편에서 함께 서류 업무를 처리하는 게 더 낫지 않을까요?"
  
 GEH_pressure_on_planning_department: "기획부 압박"
 GEH_pressure_on_planning_department_desc: "기획부에 많은 업무를 떠넘기고 태업하는 것으로 아코가 부장실에 찾아올 시간 여유를 주지 않을 생각입니다. 아코는 이러한 행동이 무엇을 의미하는지 이해할 만큼 머리가 좋은 사람일 겁니다."
 
 GEH_ako_denial: "아코의 면담 거부"
 GEH_ako_denial_desc: "'아마우 아코 선임행정관이 선도부장실에 출입하는 것을 당분간 금한다.'"
 
 GEH_ako_berate: "공개적 모욕"
 GEH_ako_berate_desc: "다른 선도부원들 앞에서 아코의 서류, 문서 처리를 공개적으로 비난합니다. 물론 히나가 아코를 미워하기 때문이 아닙니다. 이것은 다른 선도부원들이 '선도부장이 선임행정관을 미워한다'는 인식을 갖게 하기 위함입니다."

 GEH_discipline_system_category: "[GEH.GetName]의 규율"

 geh_discipline_system_desc: "대전이 이전부터 §G게헨나 선도부§!는 사회의 질서를 지키고 풍기를 유지하기 위한 치안 조직이었습니다. 판데모니움 소사이어티와 달리 우리는 도이칠란트 점령지의 질서를 유지하고, 소수에 불과한 키보토스계 인구가 다수의 도이치계 인구를 통제하는 §Y통제된 사회§!를 유지하는 데 성공했습니다.\n\n하지만 우리의 §Y질서§!는 아무런 노력 없이 유지될 수 있는 것이 아닙니다. 실행부가 직접 현장에서 교전하는 §R국방군§! 잔당들만이 아니라, 우리 도시에는 다양한 §R범죄 조직§!들이 난립하고 있습니다. 나치당 당원 조직, 헬멧단, 심지어는 온천개발부까지 수많은 §R범죄 조직§!들이 사회 질서를 어지럽힙니다. 이들을 체포하고 §Y사회의 풍기를 유지§!하는 것이야말로 우리 게헨나 선도부의 의무입니다.\n\n§Y현재의 규율§!: [?geh_discipline_var|1%%]\n\n현재 규율로 인한 효과:\n 사단 공격: [?geh_discipline_army_attack_factor|=+%2]\n 사단 방어: [?geh_discipline_army_defence_factor|=+%2]\n 사단 돌파: [?geh_discipline_breakthrough_factor|=+%2]"

 GEH_discipline_system_weak_discipline: "약화되는 풍기"

 GEH_discipline_system_attack_nazi: "나치당 당원 조직 공격"
 GEH_discipline_system_attack_nazi_desc: "국방군과 나치당은 비슷한 구 도이칠란트의 산하기관이었지만, 대전이로 지도부를 잃어버린 이후엔 개별 활동을 하고 있습니다. 일반적으로 나치당원 조직은 군사 훈련을 받지 않은 민간인들로 구성되어 있으며, 거리에서 수인이나 로봇 등 키보토스계 인구에게 폭력 범죄를 저지르는 갱단 활동을 이어갑니다."
 
 GEH_discipline_system_attack_helmet: "헬멧단 조직 공격"
 GEH_discipline_system_attack_helmet_desc: "헬멧단은 키보토스에서도 존재했던 범죄 조직을 의미하는 일반명사입니다. 헬멧을 머리에 뒤집어쓰고 총질을 하는 것으로 유명했고, 대전이 이후에도 비슷한 짓을 멈추지 않는 것으로 악명이 높습니다."

 GEH_discipline_system_attack_onsen: "온천개발부 조직 공격"
 GEH_discipline_system_attack_onsen_desc: "온천을 개발하기 위해서라면 어떠한 공공시설도 폭파시킬 준비가 되어 있는 이 테러리스트들에게는 일말의 자비도 필요하지 않습니다."

 GEH_discipline_system_get_weapons: "나치 수공업 군사공장 장악"
 GEH_discipline_system_get_weapons_desc: "나치당원 조직이 만들어낸 수공업 공장을 장악해 우리의 통제 아래에서 계속 사용합니다. 나치가 만들어 낸 지하 불법 시설을 우리가 사용하는 것은 선도부원들에게 부도덕적인 행동으로 평가받을 것입니다."

 GEH_discipline_system_boom_weapons: "나치 수공업 군사공장 폭파"
 GEH_discipline_system_boom_weapons_desc: "나치당원 조직이 만들어낸 수공업 공장을 장악해 철저하게 파괴합니다."

 GEH_discipline_system_alliance_with_hitler: "히틀러와의 동맹"
 GEH_discipline_system_alliance_with_hitler_desc: "반나치, 친유대 성향의 자본가인 앙겔라 히틀러는 대중들에게 두 가지 이야기로 유명합니다 - 성공한 담배 공장 사업가이자, 대전이 때 사망한 아돌프 히틀러 나치당 당수의 누나라는 점입니다.\n\n히틀러는 유대인 학생들을 아리아인 우월주의자들로부터 보호하기 위한 유다이카 기숙사 운영을 위한 자금을 원하며, 우리는 그 대신 게헨나 내부의 나치 잔당 탄압을 위한 물자 지원을 받을 수 있습니다."

 GEH_discipline_system_alliance_with_nyaomoto: "냐오푸드와의 계약"
 GEH_discipline_system_alliance_with_nyaomoto_desc: "냐오푸드는 단순한 식료품 기업이 아닙니다. 그들은 자신들에게 반항하는 세력을 탄압하기 위한 일종의 '헬멧단 부대'를 사기업 소속 부대로 편성하고 있습니다.\n\n냐오푸드와의 계약은 이러한 사기업 소속 부대를 우리가 운용할 수 있도록 하는 용역 계약입니다. 게헨나의 질서를 위해 활동한다는 우리의 대의를 어기는 일이 되겠지만, 현지인 범죄 조직들에 비하면 헬멧단 같은 잡범들을 고용하는 것은 사소한 문제 아니겠습니까?"

 geh_discipline_system_tt: "우리의 §Y규율§!이 $RIGHT|+=1$ 변화"
 GEH_discipline_system_weak_discipline_tt: "\n§g$GEH_first_congress_focus$ 중점이 완료된다면 감소하는 규율의 양이 절반(소숫점 반올림)으로 감소합니다.§!"
 GEH_end_discipline: "규율은 $GEH_Army_focus_7$ 중점을 완료하면 최대치로 고정되며, 더 이상 감소하지 않습니다."

 GEH_military_power_category: "[ROOT.GetAdjective] 국방정책"
 GEH_military_power_category_desc: "\n\n\n\n\n£GFX_GEH_military_power_prefect_team\n\n\n\n\n\n\n\n\n§G게헨나 선도부§!는 대전이 이전에는 단독으로 §Y판데모니움 소사이어티§!를 완전히 파괴할 수 있는 강력한 조직이었으나, §Y대전이§!로 인한 신비의 고갈과 도이칠란트인들의 유입이라는 예상할 수 없는 상황으로 인해 국력의 격차가 발생했습니다.\n\n우리가 시대의 흐름 앞에 무너지는 일이 발생하지 않도록, 우리는 우리가 가진 자산을 최대한 활용하고 [ROOT.GetAdjective]의 지속적인 존립을 위하여 계속해서 §Y국방력§!에 투자해야만 합니다. [ROOT.GetAdjective]의 미래는 우리가 어떻게 행동하는지에 따라 결정될 것입니다.\n"

 GEH_military_power_52_factory: "[52.GetName] 군수 공장 설립"
 GEH_military_power_52_factory_desc: "새로운 군수 공장 설립을 위한 적극적인 투자는 다가오는 전쟁을 위한 중요한 자산이 될 것입니다."

 GEH_military_power_53_factory: "[53.GetName] 군수 공장 설립"
 GEH_military_power_53_factory_desc: "$GEH_military_power_52_factory_desc$"

 GEH_military_power_54_factory: "[54.GetName] 군수 공장 설립"
 GEH_military_power_54_factory_desc: "$GEH_military_power_52_factory_desc$"

 GEH_military_power_52_steel_mill: "[52.GetName] 제철소 공단 설립"
 GEH_military_power_52_steel_mill_desc: "군수품을 비롯한 기본적인 전시 자원 생산을 위하여, 우리는 필연적으로 새로운 제철소 건설을 위해 예산을 투자해야만 합니다."

 GEH_military_power_53_steel_mill: "[53.GetName] 제철소 공단 설립"
 GEH_military_power_53_steel_mill_desc: "$GEH_military_power_52_steel_mill_desc$"

 GEH_military_power_54_steel_mill: "[54.GetName] 제철소 공단 설립"
 GEH_military_power_54_steel_mill_desc: "$GEH_military_power_52_steel_mill_desc$"

 GEH_military_power_prefect_team_tank_levelup: "선도부 전차 연구소 확장"
 GEH_military_power_prefect_team_tank_levelup_desc: "선도부의 전차 기술은 명백하게 키보토스의 치안을 유지하기 위한 경전차에 치중되어 있었습니다. 대전이 이후 세계에서 총력전에 활용하기에는 우리의 기갑 능력은 상당히 부족합니다. 이러한 문제를 해결하기 위해 연구소 인력에 대한 투자가 필요한 이유입니다."

 GEH_military_power_prefect_team_gun_levelup: "선도부 총기 연구소 확장"
 GEH_military_power_prefect_team_gun_levelup_desc: "대전이 이전에는 소라사키 히나 선도부장이 단독으로 만마전 전체를 상대할 수 있었다고 합니다. 이제 와서는 반 즈음 전설이 되어버린 이야기이기는 하지만, 만마전이 선도부에 배정된 예산을 전액 삭감하자 히나 부장이 단독으로 만마전 건물을 휩쓸며 항의하고 다녔던 사건은 너무 유명하죠.\n\n하지만 대전이 이후 신비의 힘이 존재하지 않는 지구에서 우리 키보토스계는 힘의 약화를 겪어야만 했습니다. 우리의 선도부 총기 연구소는 신비 직조기 생산을 위해 노력하고 있지만, 지속적인 투자 없이는 제대로 된 활약을 할 수 없을 것입니다."

 GEH_military_power_prefect_team_visit_world: "선도부장의 외국 탐방"
 GEH_military_power_prefect_team_visit_world_desc: "[GEH.GetName]은(는) 작은 나라입니다. [GEH.GetLeader] 선도부장이 외국의 발전된 국가를 방문하고 그들이 어떠한 방식으로 전쟁에 대비하는지 알아보는 것도 좋은 경험이 될 것입니다. 대전이라는 미증유의 사건에 대비하기 위하여, 키보토스 국가가 아닌 인류 국가가 방문 대상으로 결정되었습니다.\n\n정보부에서 제안한 선택지는 이탈리아와 이집트, 그리고 일본입니다. [GEH.GetLeader] 선도부장은 원하는 어느 곳이라도 방문할 수 있을 것입니다. 물론 외교적인 문제가 없을 경우에 말이죠!"

 GEH_military_power_52_infrastructure: "[52.GetName] 도로 시설 정비"
 GEH_military_power_53_infrastructure: "[53.GetName] 도로 시설 정비"
 GEH_military_power_54_infrastructure: "[54.GetName] 도로 시설 정비"

 GEH_military_power_non_halo_reorganize: "정신적 헤일로 보병 사단"
 GEH_military_power_non_halo_reorganize_desc: "이 계획은 교도소에 처박혀 있는 국방군 포로들이 게헨나를 위해 봉사하도록 하기 위한 계획입니다. 우리는 정말로 국방군 포로들에게 헤일로를 만들어 준다거나 하지 않을 것입니다. 대신 그들이 헤일로 보병과 같은... 힘을 가진 것처럼 느끼도록 하는 정훈교육을 시킨 뒤, 갑옷을 입혀 최전방으로 내보낼 것입니다.\n\n진짜 헤일로가 생긴 것은 아니지만, 헤일로 보병과 똑같은 전술적 목적을 가지고 최전방으로 투입되며, 어쨌거나 헤일로 보병과 같은 방식으로 전장에 투입될 것이니, 이들은 정신적 헤일로 보병이라고 할 수 있지 않을까요?\n\n아니라고요? 우리가 나치에게 얼마나 더 인도적인 대우를 해 줄 것이라고 기대했습니까?"

 GEH_gehenna_art_category: "게헨나 예술 학원"
 GEH_gehenna_art_category_desc: "§Y대전이§! 이전까지의 §G게헨나§!는 학원도시 속의 학원국가였습니다. 게헨나 자치구 지역을 따라 게헨나의 영토가 퍼져 있었고, 게헨나 학생들과 키보토스 시민들이 학원을 중심으로 생활했습니다. 학원은 우리들의 당연한 일부였고, 게헨나라는 나라는 새로운 것을 배우고 미래를 향해 나아가기 위한 장소이기도 했습니다. 뭐, 결석계조차 내지 않고 학생들이 다 수업을 빠지는 학교에 붙이기엔 좀 과분한 호칭이기는 한 것 같지만요.\n\n대전이 이후 게헨나의 문화는 빠르게 변화하고 있습니다. 그러나 권력에 빠져 §Y국방군§!과 붙어 먹느라 자신들의 정체성을 잃어버린 §Y만마전§!과는 달리, 우리는 우리의 §Y근본§!이 학원 국가라는 것을 잊지 않았습니다. 키보토스가 아닌 지구에서, 게헨나의 전통은 이어져 나가야만 합니다.\n\n이제 더 이상 키보토스에서처럼 거리에서 총을 쏘고 다닐 수는 없습니다. 하지만 게헨나의 개성인 §G자유와 혼돈§!은 예술가들에게 있어서 하나의 영감이 될 수 있습니다. §G선도부의 질서§! 아래에서, 혼란스러웠던 '자유와 혼돈'은 폭력이 아닌 '예술'로서 승화되어 보존될 것입니다. 이것이야말로 게헨나의 전통과 학원 국가로서의 역사를 지키고, 우리의 강점을 살려 나갈 방법입니다.\n"

 GEH_gehenna_art_music_munich_conservatory: "국립 음악 아카데미 후원"
 GEH_gehenna_art_music_munich_conservatory_desc: "국립 음악 아카데미(Staatliche Akademie der Tonkunst)는 1846년 설립된 도이칠란트의 전통 있는 아카데미로서, 많은 학생들이 이곳에서 음악을 배우며 또 놀라운 작곡 성과를 내놓고 있습니다. '대전이' 이후 국립의 의미는 도이칠란트에서 게헨나로 변화했지만, 여전히 이곳은 도이치 전체에서 가장 권위 있는 음악 대학입니다.\n\n[ROOT.GetLeader]가 음악 아카데미의 교수들에게 자금을 후원한다면, 우리는 도이치인과 게헨나인 모두를 위한 멋진 새 곡을 만들어 낼 수 있을 것입니다."

 GEH_gehenna_art_music_concert: "음악 순회 콘서트"
 GEH_gehenna_art_music_concert_desc: "게헨나의 록 음악들은 아직 도이칠란트 일반 대중들에게는 높은 인기를 얻지 못하고 있지만, 그럼에도 불구하고 키보토스계 인구의 열정적 사랑을 받고 있습니다. 새로운 콘서트는 우리 국민들을 위한 즐거운 이벤트가 될 것입니다."

 GEH_gehenna_art_music_jazz: "도이치를 위한 재즈"
 GEH_gehenna_art_music_jazz_desc: "도이칠란트 나치 정권은 재즈가 '퇴폐적'인 음악이라는 이유로 그것을 금지했으며, 재즈 음악가들을 추방했습니다. 정말로 사회의 질서를 해치는 퇴폐적인 존재가 음악의 선율이었는지, 아니면 그들 자신이었는지 마지막까지 깨닫지 못한 것이 안타까울 뿐입니다. 재즈 음악은 게헨나의 키보토스 인구에게는 이미 흘러간 과거의 유산이지만, 인구의 많은 수를 차지하는 현지인들에게는 매력적인 최신 음악입니다. 재즈 콘서트의 개최는 많은 도이치인들을 위한 복지가 될 것입니다."

 GEH_gehenna_art_gehenna_music_make: "게헨나 환상곡 제작 요청"
 GEH_gehenna_art_gehenna_music_make_desc: "게헨나를 대표하는 곡이 하누마 마코토가 녹음한 '대 판데모니움 찬가'라는 것은 너무도 부끄러운 일입니다. 불패의 초무적철갑 토라마루... 세상에나. 전설적인 작곡가인 리하르트 슈트라우스의 제자인 안익태는 게헨나에 머무르며 음악 활동을 이어가고 있습니다. 충분한 예산 지원이 있다면 그가 우리를 위해 게헨나를 대표하는 새로운 음악을 만들어 줄 것입니다."

 GEH_gehenna_art_gehenna_music_new_military_song: "게헨나 군가 정립"
 GEH_gehenna_art_gehenna_music_new_military_song_desc: "단순한 학원 국가에 불과했던 대전이 이전과 달리, 우리는 학원 국가의 전통을 이어가면서도 현지인들을 영입한 군대를 통해 '지구에서의 생존 방식'을 익혀야만 합니다. 새롭고 합리적인 군가가 필요하며, 도이치인과 게헨나인 모두를 만족시킬 수 있는 선율이어야 합니다. 1914년의 '대전쟁' 참전 군인 출신으로 뮌헨에서 활동하는 엄격한 보수주의자 작곡가인 카를 오르프(Carl Orff)는 웅장한 새로운 군가의 의뢰를 받게 될 것입니다."

 GEH_gehenna_art_music_serenade: "게헨나 특별 파티"
 GEH_gehenna_art_music_serenade_desc: "게헨나 학원 인물들만이 아니라, 경영인들을 비롯한 여러 게헨나 내부 외부 중요 인사들을 초청한 파티를 개최합니다. 그리고 이 파티의 핵심은 드레스를 입은 소라사키 히나가 직접 등장해, 파티에서 직접 연주회를 하는 시간입니다."

 GEH_gehenna_art_bauhaus: "슈타틀리헤스 바우하우스 후원"
 GEH_gehenna_art_bauhaus_desc: "슈타틀리헤스 바우하우스(Staatliches Bauhaus)는 1933년 나치 정권 집권 이후 강제로 폐교당하는 아픔을 겪었던 도이칠란트 최고의 건축대학입니다. 우리가 바이에른에서 나치의 영향력을 일소한 후 게헨나 학원의 일부로서 재건되었습니다. 바우하우스는 모더니즘 건축의 심장과도 같은 곳으로, 이곳에 대한 지원은 바우하우스 교장인 루트비히 미스(Ludwig Mies)와 같은 천재적 건축가들이 게헨나의 건축 산업에 큰 영향을 끼치도록 도울 것입니다."

 GEH_gehenna_art_urban_aesthetic_project: "도시 재개발 사업"
 GEH_gehenna_art_urban_aesthetic_project_desc: "게헨나의 낙후된 지역들에 손을 대고, 도시 구역들을 정돈합니다."

 GEH_gehenna_art_efficient_factory: "효율적인 군수 공장"
 GEH_gehenna_art_efficient_factory_desc: "건축학자들은 우리 게헨나의 공업 시설들이 상대적으로 비효율적인 구조를 가지고 있다고 조언합니다. 동선을 줄이고, 공장과 시장을 연결하는 교통망을 개선하는 것으로 우리의 산업 시설을 더욱 발전시킬 수 있을 것입니다."

 GEH_gehenna_art_reconstruction_of_headquartersy: "선도부 본부 재건설"
 GEH_gehenna_art_reconstruction_of_headquartersy_desc: "뛰어난 건축학 교수인 피트 몬드리안은 게헨나 재통일 이후 우리의 선도부 본부의 재건축 디자인을 맡게 되었습니다. 몬드리안은 새로운 선도부 본부 건설에 있어서 두 가지를 중점으로 삼았습니다. 첫 번째는 효율성입니다. 각 부서 사이의 이동 동선을 줄이고 냉난방에 필요한 에너지가 최소한으로 필요하도록 작업합니다. 두 번째는 외형의 아름다움입니다. 몬드리안은 불필요한 장식들을 줄인 모더니즘 건축물도 미적 아름다움과, 국가원수의 집무실로서의 위엄을 갖출 수 있다고 주장합니다."

 GEH_gehenna_art_reconstruction_of_pandemonium_society: "만마전 개조"
 GEH_gehenna_art_reconstruction_of_pandemonium_society_desc: "뛰어난 건축학 교수인 피트 몬드리안은 게헨나 재통일 이후 지나칠 정도로 크고 화려한 만마전을 격하하기 위해 구 만마전 시설 전체를 압류하고 시민들을 위한 도서관으로 개조하기로 했다. 비록 선도부와 만마전의 교전 과정에서 만마전 본부와 의장의 집무실 등에 많은 총알 자국들이 남기는 했지만, 우리의 전문가들은 이러한 흔적들을 깨끗하게 지울 방법을 알고 있다고 말하고 있다.\n\n만마전이 격하된 채로 유지될 경우를 대비하여, 몬드리안은 만마전 본부 뒤편 게헨나 학원의 낡은 구교사를 만마전 의장 건물로 재활용하기로 합의했다. 작고 낡았지만, 모든 권한이 선도부로 이전된 지금이라면 별다른 문제는 없을 것이다."

 GEH_gehenna_art_pool: "히나를 위한 개인 수영장"
 GEH_gehenna_art_pool_desc: "소라사키 히나 부장이 수영을 할 줄 모른다는, 그러니까... 바다에 들어가면 바로 가라앉는다는 말도 안 되는 소문이 있습니다! 음, 정말 말도 안 되는 소문이죠? ...그렇죠? 소라사키 히나는 튜브 없이 남들 앞에서 멋지게! 수영할 수 있는 그 날을 위해, 작은 개인 수영장 하나의 건축을 요청했습니다. ...취미 생활을 잘 만들지 않고, 자신의 이익을 위해 행동하지 않는 그녀에게는 드문 일입니다. 어쩌면 욕조에서 미끄러졌다 익사할 뻔이라도 한 것일지도요."

 GEH_gehenna_art_hot_spring: "힌놈 온천사업"
 GEH_gehenna_art_hot_spring_desc: "온천개발부는 딱히 온천이 없을 것 같은 장소도 일단 발파하고 보지만, 우리는 게헨나 학원 중앙구 뒤에 있던 '힌놈 산맥'에 유황 온천이 이미 존재했다는 것을 알고 있습니다. 대전이 이후 아비도스의 사막 모래 폭풍이 함께 전이되어 일시적으로 바이에른을 엉망으로 만든 것처럼, 중앙구에도 힌놈 산맥의 천연 온천이 전이된 상태입니다.\n\n우리는 이 온천을 더 정교하게 재개발하는 것을 고려해 볼 수 있습니다."

 GEH_gehenna_art_munich_academys: "뮌헨 미술원 후원"
 GEH_gehenna_art_munich_academys_desc: "뮌헨 미술원(Akademie der Bildenden Künste München)은 1770년에 설립되어 지금까지 이어져 오고 있는 도이칠란트의 위대한 미술대학입니다. 수백년의 역사를 거치는 동안 이곳에서 수많은 미술가들이 탄생했으며, 탄생하고 있으며, 앞으로도 탄생할 예정입니다. 이 대학을 후원하는 것은 우리 정부가 예술에 대해 가진 관심을 보여주기에 알맞습니다."

 GEH_gehenna_art_exhibition: "퇴폐 전시전"
 GEH_gehenna_art_exhibition_desc: "과거 나치 정권은 자신들의 규정에 맞지 않는 모든 미술 작품들을 '퇴폐 미술'이라며 조롱했습니다. 이러한 '퇴폐적' 미술 전시회를 후원하는 것은 게헨나가 다양한 문화적 자유를 수용하게 하며, 도이칠란트에서 나치의 영향력을 일소시킬 것입니다."

 GEH_gehenna_art_propaganda: "게헨나 홍보 만화 제작"
 GEH_gehenna_art_propaganda_desc: "미술의 범주에 만화가 들어가지 않는다는 것은 상상할 수 없는 일입니다. 게헨나 학원을 홍보하기 위한 프로파간다성 만화 제작을 위해, 여러 만화가들에게 국비 지원을 할 것입니다."

 GEH_gehenna_art_hina_propaganda: "소라사키 히나 일대기 만화 제작"
 GEH_gehenna_art_hina_propaganda_desc: "대전이 이전 소라사키 히나가 어떠한 업적을 이루었고 어떤 범죄 수사를 진행하였는가를 홍보 자료로 만들 수 있을 것입니다. 이것을 '프로파간다'라고 부를 수도 있겠죠. 하지만 여기에 거짓된 내용을 담을 것도 아니지 않습니까?"

 GEH_gehenna_art_ibuki_university: "이부키 화가 교육"
 GEH_gehenna_art_ibuki_university_desc: "탄가 이부키는 화가가 되고 싶어 합니다. 차라리 그게 나은 일이겠죠. 그녀가 성장한 이후에도 다시는 정치에 신경쓰지 않고, 만마전보다는 미술관에 틀어박혀 있도록 하는 것이 게헨나 정치에도 좋은 일일 것입니다. 그녀는 위험할 정도로 게헨나에서 대중적 인기가 높으면서도, 정치보다 다른 곳에 더 관심이 많거든요. 이부키는 정계를 떠나 화가가 되기 위한 교육을 받게 될 것입니다."

 GEH_gehenna_art_headquartersy: "선도부 본부 장식"
 GEH_gehenna_art_headquartersy_desc: "미술가들을 모아, 선도부 본부의 위엄을 더하기 위한 내부 그림들을 걸고, 역대 선도부장들의 초상화를 보관하는 특별한 공간을 만들 것입니다. 이러한 내부 장식 과정은 단순한 사치가 아닌, 우리 선도부의 성공을 대중들에게 보이기 위한 작업이기도 합니다."

 GEH_gehenna_legitimacy_category: "게헨나의 정통성"
 GEH_gehenna_legitimacy_category_desc: "§Y대전이§! 이후에도 계속되고 있는 선도부와 만마전 사이의 대립으로 인하여, 우리는 §Y게헨나의 중심§!이 어디인지에 대한 정통성 문제를 겪고 있습니다. 우리가 게헨나의 학생들만이 아니라 시민들에게도 신뢰를 주는 모습을 보인다면, 우리의 정통성을 상승시킬 수 있을 것입니다.\n"

 GEH_gehenna_legitimacy_up: "정통성 상승"
 GEH_gehenna_legitimacy_up_desc: "선도부의 치안 경험 상승은, 우리가 게헨나인들에게 더 깊은 신뢰를 받도록 만들었습니다."

 #### 민주주의 아코

 GEH_ako_democratic_system_category: "[ROOT.GetAdjective] 기획부 평의회"
 GEH_ako_democratic_system_category_desc: "\n[ROOT.GetName] 정부가 기존의 학원국가 체제에서 빠르게 기술관료들에 의한 일반 국가로 변화하고 있습니다. 가장 큰 변화는 정부 내에 §Y제한적인 민주제§!가 도입되었다는 점입니다. §G평의회§!는 기획부원들의 투표로 선출되는 우리의 간선제 의회로, §Y소라사키 히나§! 부장님이 여전히 전권을 가지는 만큼 어디까지나 §Y자문기관§!의 역할을 맡습니다.\n\n우리는 평의회 투표권을 일반 대중들에게 확대하는 것이 불가능합니다. 키보토스계는 대전이 이후 도이칠란트의 소수민족이며, 직접선거의 도입은 민주 투표로 나치를 선출한 도이치인들에게 게헨나를 가져다 바치는 일이 될 것입니다. 그렇기에 평의회는 소규모의 §Y외부 참관인§!을 받는 것 이외에는 기술관료들이 의석을 독점하는 §C통제 민주주의§! 체제로 운영됩니다.\n\n우리의 통제 민주주의 체제 아래에서, 평의회는 §G현지인들의 개§!, §Y중립적 중재자§!, §O게헨나의 지도자§! 중 한 가지의 대중적 평가를 듣게 될 것입니다. 평의회의 시선은 §Y제4차 총회§! 이후 최종적인 중점 계통도에 영향을 미치며, 만약 히나 부장이 어떠한 이유로든 내각을 떠난다면, 현지인들에 대한 증오가 평의회를 장악하며 §R균형은 붕괴될 것§!입니다."

 GEH_ako_democratic_system_meeting_with_SPD: "사회민주당과의 접촉 강화"
 GEH_ako_democratic_system_meeting_with_SPD_desc: "도이칠란트 사회민주당은 [ROOT.GetName] 내에서 정치 권력을 가지고 있지 않지만, 지역 단위에서는 여전히 노동자들과 접촉하며 그들의 요구사항을 우리 정부에 전달하는 역할을 맡습니다. 사회민주당은 현지 정당들 중 유일하게 우리 정부의 통치권을 인정하는 정당이기에 노동자들과의 우호 관계를 위하여 그들과의 접촉을 늘릴 가치는 충분합니다."

 GEH_ako_democratic_system_meeting_with_capitalists: "키보토스계 사교 파티 참가"
 GEH_ako_democratic_system_meeting_with_capitalists_desc: "키보토스계 수인, 로봇 자본가들과 소시민들은 대전이 이후 소수민족으로 몰리면서 더욱 단결하였으며, 도이치인들과 분리된 자신들만의 정체성을 유지하려 노력하고 있습니다. [ROOT.GetLeader]의 키보토스계 사교 파티 참가는 대전이 이후 분열된 우리의 단결을 가져다 줄 것입니다."

 GEH_ako_democratic_system_constitution: "게헨나 헌법 제정"
 GEH_ako_democratic_system_constitution_desc: "우리가 게헨나의 통일된 지도자가 됨에 따라, 우리는 한층 나아가 연방공화국의 헌법을 제정할 수 있게 되었습니다."

 GEH_ako_democratic_system_constitution_human_right: "§G헌법 정신§!: 보편 인권 강조"
 GEH_ako_democratic_system_constitution_human_right_desc: "우리의 헌법의 중대한 가치로 '모든 인간의 인권'을 강조합니다. 성별, 인종, 성적 지향, 장애, 민족 그리고 종교로 인한 부당한 차별을 받지 않아야 한다는 점이 헌법 정신으로 강조될 것입니다." #친현지인

 GEH_ako_democratic_system_constitution_esperanto: "§G헌법 정신§!: 에스페란토 지위 보장"
 GEH_ako_democratic_system_constitution_esperanto_desc: "우리의 헌법의 중대한 가치로 '모든 인류 국가와의 소통'을 강조합니다. 에스페란토(지구 국제어)를 헌법에 게헨나의 표준어 중 하나로 등재하고 모든 법률을 에스페란토어로도 등재하도록 하는 것은, 우리가 인류 문명과 그들의 역사를 존중한다는 증표가 됩니다." #친현지인

 GEH_ako_democratic_system_constitution_worker: "§G헌법 정신§!: 노동권"
 GEH_ako_democratic_system_constitution_worker_desc: "우리의 헌법의 중대한 가치로 '노동자들의 권리'를 강조합니다. 이는 특히 현지인 정당인 도이칠란트 사회민주당의 주장을 수용한 것으로, 노동자들의 숫자 중 압도적으로 키보토스계보다 현지인이 많다는 점에서, 선진적인 노동법을 헌법 수준에서부터 지지하는 것은 큰 의미가 있습니다." #친현지인

 GEH_ako_democratic_system_constitution_state_capitalism: "§O헌법 정신§!: 국가자본주의"
 GEH_ako_democratic_system_constitution_state_capitalism_desc: "우리의 헌법의 중대한 가치로 '국가자본주의'를 강조합니다. 모든 경제는 [ROOT.GetLeader]와 충성스러운 기술관료들에 의해 정부 주도로 통제되어야 합니다. 국가가 시장을 통제하는 특수한 자본주의 체제가 헌법 정신으로 강조될 것입니다." #친키보토스

 GEH_ako_democratic_system_constitution_internationalism: "§O헌법 정신§!: 학원간 연대"
 GEH_ako_democratic_system_constitution_internationalism_desc: "우리의 헌법의 중대한 가치로 '학원간 연대'를 강조합니다. 게헨나만이 아니라 트리니티, 밀레니엄, 산해경, 붉은겨울 등 모든 키보토스 국가들과의 연대를 통해 지구에서 생존해야 한다는 점이 헌법 정신으로 강조될 것입니다." #친키보토스

 GEH_ako_democratic_system_constitution_leader_principle: "§O헌법 정신§!: 지도자 원리"
 GEH_ako_democratic_system_constitution_leader_principle_desc: "우리의 헌법의 중대한 가치로 '히나 의장에 대한 무한한 충성'을 강조합니다. 이미 우리의 헌법은 평의회 의장인 소라사키 히나에게 무한한 권력을 보장하고 있지만, 이것은 단순한 권력 보장을 넘어 모든 공무원, 국가 조직, 법률은 '소라사키 히나의 뜻'을 이루기 위해 존재하며 이를 따라야 한다는 점을 명문화한다는 점에서 단순한 권력 보장 이상의 의미를 갖습니다.\n\n소라사키 히나는 나치를 비롯한 우익 파시스트부터 스탈린주의자와 같은 좌익 파시스트에 이르기까지 다양한 적들을 상대로 통제민주주의를 수호할 수 있는 자유와 질서의 상징이며, 그분의 뜻에 따라 국가가 일사분란하게 움직이는 것은 당연한 일로 강조될 것입니다." #친키보토스

 GEH_ako_democratic_system_constitution_feminism: "§Y헌법 정신§!: 여성주의"
 GEH_ako_democratic_system_constitution_feminism_desc: "우리의 헌법의 중대한 가치로 '여성주의'를 강조합니다. 이는 헤일로를 가진 여성 위주의 문명인 키보토스 문명과 전통에 대한 지지이기도 하며, 동시에 도이칠란트 현지 페미니스트들이 꿈꿔 온 일이기도 합니다. 키보토스계와 현지 진보주의자들 모두가 동의하는 규정이며, 동시에 헤일로를 갖지 못한 키보토스 수인, 로봇들과 현지 보수파들 모두가 반대하는 헌법 정신이라는 점에서... 이는 가장 '중립적'인 헌법 정신이 될 것입니다." #중립

 ## 일반 법률

 GEH_ako_democratic_system_law_jewish_protection: "유대인 보호법"
 GEH_ako_democratic_system_law_jewish_protection_desc: "1933년 도이칠란트 히틀러 정권이 집권한 이후 1935년 붕괴하기까지, 유대인들은 도이칠란트에서의 재산권 문제에 있어서 큰 침해를 입었습니다. 새로운 법률은 유대인들이 자신들이 나치에 의하여 개인 사업체나 토지 등을 강탈당했다는 것을 증명할 수 있을 경우 이것에 대해 보상하도록 지원합니다. 그 예산은 히틀러를 선출한 도이치인들이 세금으로 부담하게 될 것입니다."

 GEH_ako_democratic_system_law_dissolution_of_prussia: "프로이센 자유주 해체"
 GEH_ako_democratic_system_law_dissolution_of_prussia_desc: "도이칠란트 바이마르 공화국에서도 가장 크고 강대했던 프로이센 자유주는 우리 게헨나 연방에 있어서는 불필요한 존재일 뿐입니다. 우리는 바이마르 공화국의 연방제와 지방자치를 존중하지만, 지나치게 큰 자유주를, 그것도 영토의 중심지가 트리니티 전역을 차지하는 프로이센을 방치하는 것은 위험합니다. 프로이센은 해체될 것이며, 브란덴부르크 자유주를 비롯한 작은 주들로 분할될 것입니다."

 GEH_ako_democratic_system_law_nationalization_of_resources_act: "자원국유화법"
 GEH_ako_democratic_system_law_nationalization_of_resources_act_desc: "도이칠란트의 자연, 숲과 호수 강과 같은 대지는 게헨나를 위하여 사용되어야 합니다. 우리는 적절한 자원이 존재하는 것으로 여겨지는 미개발 지대를 국영 토지로 압류할 수 있는 권한을 얻습니다. 우리의 법률로 몰수할 수 있는 자원은 도이칠란트인들이 소유한 천연 자원만을 의미하며, 키보토스에서 이주한 자본가들이 만드는 합성고무와 같은 '인공 자원'은 몰수 대상에 포함되지 않습니다. 이 법률은 대전이 이후에도 살아남은 융커들의 토지를 철저하게 몰수하고 그들의 권력을 영구적으로 배제하도록 할 것입니다."

 GEH_ako_democratic_system_law_proportional_representation: "지방의회 비례대표제"
 GEH_ako_democratic_system_law_proportional_representation_desc: "우리의 통제민주주의로 인하여 도이치인들은 중앙정치에 관여할 수 없지만, 그들은 여전히 자신들의 자치권을 행사할 수 있는 지방의회를 가지고 있습니다. 지방의회에서 키보토스계에게 유리하게 지역구가 책정되는 소선거구제 의석을 줄이고 비례대표 의석을 도입하는 것은 지방 의회에서 도이치인들이 자신들의 권리를 더 많이 행사할 수 있게 만들 것입니다."

 GEH_ako_democratic_system_law_wage_control: "임금통제법"
 GEH_ako_democratic_system_law_wage_control_desc: "통제민주주의와 국가자본주의라는 두 가지 국가 체제를 유지하기 위해서는 대중들의 지지를 잃어버리지 않는 것도 중요합니다. 임금통제법은 국가가 지나치게 임금이 낮다고 판단되는 사업에 관여하여 노동자들의 임금을 직접 '협상'할 수 있도록 노동자들을 지원합니다."

 GEH_ako_democratic_system_law_special_punishment_act_on_economic_crimes: "경제범죄 특별처벌법"
 GEH_ako_democratic_system_law_special_punishment_act_on_economic_crimes_desc: "도이칠란트 사회민주당과의 협력을 통하여, 우리는 탈세, 임금 체불, 부당한 근로계약 등을 체결하는 자본가들을 수사하기 위한 특수 경제수사팀을 설립하고, 자본가들에게는 보유한 재산에 비례하여 벌금형 액수를 증액하는 '특별처벌법'을 제정할 것입니다. 게헨나의 질서와 법치는 무력 범죄만이 아닌 경제 범죄에도 동일하게 적용되어야만 합니다."

 GEH_ako_democratic_system_law_public_security_act: "치안유지법"
 GEH_ako_democratic_system_law_public_security_act_desc: "게헨나 국가 질서를 위협하는 공산주의자들의 정치 활동을 억제하는 이 법률은, 놀랍게도 도이칠란트 사회민주당의 강한 지지를 받습니다. 공산주의자들과 사회민주주의자들은 바이마르 공화국 내내 대립 관계였으며, 사회민주주의자들은 나치당만큼이나 혐오하는 공산주의자들이 게헨나 땅에서 다시는 보이지 않게 되기를 바랍니다."

 GEH_hina_corruption_category: "바알의 왕좌"
 #GEH_hina_corruption_category_desc: "\n\n\n"

 GEH_hina_corruption_gui_text_desc: "이곳에 디시전 텍스트 입력"

 GEH_hina_corruption_thought_cabinet_advanced_race_theory: "§O생각 캐비닛§!: 고등 인종론"
 GEH_hina_corruption_thought_cabinet_advanced_race_theory_desc: "헤일로를 가지지 못하고, 신비와 숭고의 편린조차 보이지 않는 현지인들을 같은 지적 생물이라고 할 수 있을까? 키보토스의 수인, 로봇들은 적어도 인간이 아닌 척이라도 하지만. 이 생명체들은 어설프게 인간을 모방하고 있을 뿐이잖아? 메스꺼워. 정말로."

 GEH_hina_corruption_thought_cabinet_bringing_of_the_law: "§O생각 캐비닛§!: 법의 인도자"
 GEH_hina_corruption_thought_cabinet_bringing_of_the_law_desc: "나야말로 게헨나 법의 인도자이자 질서야. 그 질서를 지키지 않는 존재들은 곧 나를 부정하는 거나 마찬가지지. 나를 공격하는 적에게 맞서는 것이 정당방위이듯, 고문을 비롯한 특별한 심문 방법들도 일종의... 정당방위일 뿐이지 않을까? 먼저 날 공격한 건 그들이니까."

 GEH_hina_corruption_thought_cabinet_cop_of_the_apocalypse: "§O생각 캐비닛§!: 종말의 경찰"
 GEH_hina_corruption_thought_cabinet_cop_of_the_apocalypse_desc: "인류 문명은 멸절되어야 하지 않을까? 그들이 존재함으로서 게헨나와 키보토스에 악영향을 미치고 있어. 마치 독극물이 잔에 퍼지는 것처럼, 서서히. 스며들어가. 그 죄악이."

 GEH_hina_corruption_thought_cabinet_finger_on_the_eject_button: "§G생각 캐비닛§!: 탈출 버튼 위의 손가락"
 GEH_hina_corruption_thought_cabinet_finger_on_the_eject_button_desc: "이 빌어먹을 생각들이 나를 조종하려고 해도... 소용 없을 거야. 그래. 차라리 내 머리를 날려버리고 말지. 내가 현지인들을 좋아해서가 아니야, 바알. 내 이중인격이라고 주장하는 네 존재에 지배당하는 꼭두각시가 되지 *않겠다*는 의지지."

 GEH_hina_corruption_thought_cabinet_derealization: "§G생각 캐비닛§!: 미시감"
 GEH_hina_corruption_thought_cabinet_derealization_desc: "세상의 모든 것이 비현실적이고, 또 멀리 있는 것처럼 보여. 아니, 실제로 그렇지. 이곳은 키보토스이면서 동시에 키보토스가 아니야. 키보토스는 '지구'라는 행성에 기생해 있을 뿐이니까. ...키보토스에서의 상식, 키보토스에서의 지식을 이 세계에 일률적으로 적용하려 하는 것 자체가 오만이고, 바알이 자아내는 거짓된 명령일 뿐이야."

 GEH_hina_corruption_thought_cabinet_rigorous_self_critique: "§G생각 캐비닛§!: 엄격한 자아비판"
 GEH_hina_corruption_thought_cabinet_rigorous_self_critique_desc: "네 직급은 선도부장이었어. 과거의 직급이고, 이제 나는 어른이 되었고, 뭐... 이젠 의장이라는 직급으로 불리게 되겠지만. 네가 '선도부장'이었다는 게 변하는 건 아니잖아? 소라사키 히나. 진정하는 거야. 너는 학교의 질서를 지키는 학생 대표일 뿐 누군가의 생명을 저울질할 수 있는 자격 자체가 없는 사람이야. 그러니까. 이 빌어처먹을 바알에게 가운뎃손가락을 올리고, 그 생각들을 밀어버리자. 제발."

 GEH_hina_corruption_meeting_with_perfect_team: "선도부 간부들과의 사적인 만남"
 GEH_hina_corruption_meeting_with_perfect_team_desc: "바알은 개새끼야. 사실, 나는 욕설을 하는 걸 그다지 좋아하지는 않지만... 그 여자는 개새끼가 맞아. 내 이중인격인 주제에 나를 파멸시키려 하고, 도이치인들만이 아니라 선도부에 대한 냉소적이고 경멸적인 사고까지 박아넣으려 하고 있어.\n\n현지인들이 다 죽든 말든, 그 빌어먹을 것들에 대해서는 논하고 싶지 않아. 하지만 선도부는 달라. 아코, 이오리, 그리고 치나츠만은 미워하고 싶지 않아. 세 사람은 벽에다 내 사진을 걸어놓고 절하는 열성당원들과 달리 나를 소라사키 히나로서 봐 주니까. 그 애들과 함께 시간을 보낼 수 있다면... 조금은 견딜 수 있을 거야. 그렇게 믿어."

 GEH_hina_corruption_meeting_with_zealot: "선도부 열성당원들과의 만남"
 GEH_hina_corruption_meeting_with_zealot_desc: "열성당원들은 '위대한 히나 부장님 없이는 게헨나도 없다'고 떠들어대는 바보들이지. 좋은 점이 있다면 질서부라는 쓰레기통에 몰아넣은 그 열성당원들을 직접 만나면... 게헨나 선도부가 내 생각처럼 좋기만 한 조직이 아니라는 걸 깨달을 수 있다는 거야.\n\n그리고 또 다른 좋은 점이 있다면, 그것들과의 '대화'를 이어가다보면 내 머릿속이 증오로 활활 타오른다는 점일까. 그게 좋은 점인 이유? 내 감정에 솔직해질 수 있거든. 나 자신이 내가 되는 기분이야."

 ## 일반 법률

 GEH_hina_corruption_law_civil_surveillance_act: "시민감시법"
 GEH_hina_corruption_law_civil_surveillance_act_desc: "게헨나의 치안과 질서를 지키기 위해서는 다소의 자유는 침해될 수 있어. 우리가 밀레니엄처럼 완벽한 미래적 감시 조직을 갖추지는 못하겠지만, 모든 골목, 거리, 도로, 공공기관, 학교 내부에 CCTV를 설치하고 예비 범죄자들을 잡아낼 거야. 무슨 대가가 따르더라도."

 GEH_hina_corruption_law_violence_act: "강제 교화 허가"
 GEH_hina_corruption_law_violence_act_desc: "나치나 다른 반정부적 조직에 가담되어 있을 수 있는 예비 범죄자들을 잡아내기 위하여, 체포된 용의자들 심문에 무력을 사용하는 것이 허가될 거야. 뭐, 억울하다면 범죄를 저지르지 말았어야겠지."

 GEH_hina_corruption_law_special_religious_tax: "종교특별세"
 GEH_hina_corruption_law_special_religious_tax_desc: "가톨릭과 프로테스탄트는 대전이로 전이된 키보토스계를 적대하기 때문에, 그 영향력을 감소시킬 필요가 있어. 신앙을 가진 것으로 등록된 인구는 무거운 인두세를 내게 될 거야. 피할 방법은 없겠지."

 GEH_hina_corruption_law_no_zealot_law: "질서부 평시 무장 약화"
 GEH_hina_corruption_law_no_zealot_law_desc: "질서부는 실행부와 분리되어 있는 준군사조직으로서 게헨나 내부의 분열을 일으키고 있어. 그리고 그 녀석들이 내 이름을 팔아 저지르는 폭력, 범죄 등의 행동도 용납할 수 없고. 질서부의 평시 무장을 더 가볍게 경량화하는 것은 질서부가 게헨나 시민들에게 저지르는 악행을 막고, 또 게헨나 선도부의 화합을 이루어낼 수도 있을 거야.\n\n싸우는 것보다는, 서로 사이 좋게 지내는 편이 낫잖아."

 GEH_hina_corruption_law_sophisticated_judicial_system: "현지 사법 제도 존중"
 GEH_hina_corruption_law_sophisticated_judicial_system_desc: "대전이 이전 게헨나에서는 선도부가 곧 법률이었지. 재판은 없고, 내 명령서에 따라 범죄자들이 게헨나 선도부 지하 감옥에 처박혔어. 뭐, 중범죄자들은 발키리 교정국으로 보내지는 게 원칙이기는 했지만... 어쨌거나 형사재판이 없었다는 건 변하지 않지.\n\n하지만 여기에서는 그러지 않는 게 나을 거야. 현지 사법 제도와 3심제를 존중하고, 그것이 아무리 시간이 오래 걸리고 귀찮은 과정이라 해도 따르도록 지시할 거야."

 GEH_hina_corruption_law_esperanto: "에스페란토 교육"
 GEH_hina_corruption_law_esperanto_desc: "현지인들의 문화를 배우고 서로 다른 언어를 가진 민족끼리의 더 효율적인 소통을 위해, 인류의 '국제어'인 에스페란토를 정규 교육 과정에 넣어 모두에게 가르칠 생각이야. 지금 세대에게 바로 효과가 나타나지는 않겠지만, 다음 세대는 서로를 조금 더 잘 이해하게 되겠지."

