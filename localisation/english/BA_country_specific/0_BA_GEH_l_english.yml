 GEH_luxembourg_rules: "Luxembourg Regulations"
 GEH_luxembourg_rules_desc: "It is famous that Gehenna students are not accustomed to laws or regulations, and are free-spirited enough to be called an 'Academy of Chaos.' Using grenades in arguments among themselves was basic, and shooting sprees were almost a daily routine. The problem is that while this lifestyle wasn't a problem in Kivotos, it's a huge problem on Earth.\n\nImmediately after the Great Migration, a Gehenna-led massacre in Luxembourg caused a major wake-up call for the Prefect Team. Proposed by Amau Ako and decided by Sorasaki Hina, the 'Luxembourg Regulations' were introduced to prevent gun crimes by the violence-accustomed Gehennans.\n\n1. All Gehennans and locals' residences are separated.\n2. All Gehennan populations must return firearms before entering local residential areas.\n\nThese two items of the Luxembourg Regulations were a great help in maintaining order for the Prefect Team immediately after the Great Migration. However, insufficient administrative power to protect all local residences and seize firearms, and the policy of arbitrarily seizing guns—which are treated as daily items like clothes by Kivotosians—are drawing the ire of Gehenna students. Can we truly maintain this policy long-term?"

 GEH_centre_of_culture_idea: "Gehenna-Bavarian Culture"
 GEH_centre_of_culture_idea_desc: "The fusion of heterogeneous cultures from two worlds is a weapon that reduces conflict between Kivotosians and locals, making them understand each other more deeply." 

 GEH_cultural_revolution_idea: "Nationwide Cultural Subversion"
 GEH_cultural_revolution_idea_desc: "The radical collision of two worlds, and the disappearance of Sorasaki Hina, brought total political-socio-cultural shocks, calling for an aggressive subversive revolution against all Gehenna art, culture, order, and tradition...." 

 GEH_artistic_ultraconservatism: "Artistic Ultra-conservatism"
 GEH_artistic_ultraconservatism_desc: "Change brings death to Gehenna! Reject all change, there is no more change! Long live the pure culture of Gehenna and Germany! Long live cultural separation!" 

 GEH_avant_garde_prelude: "Avant-garde Keynote"
 GEH_avant_garde_prelude_desc: "Subvert all culture! Long live the culture of the new era! Bury the ghosts of the past called Gehenna and Germany into history! Great revolution, good revolution!" 
 GEH_cultural_revolution_idea_tt: "The §Yfocus effect§! will vary depending on which rebel we attack.\n\n"

 GEH_prefect_team_culture: "Relation Between Germans and Us"
 GEH_prefect_team_culture_desc: "After the Great Migration, Gehennans became an ethnic minority surrounded by a massive nation composed of Germans. Although we still exercise dominant governing power over Germany, a firm decision is needed to prevent discrimination of Kivotos migrants by Germans and to protect our culture.\n\nCrushing the influence of local military forces, including the Wehrmacht, and ensuring that Kivotos's much freer culture is not suppressed by Germany's oppressive culture, which is over a hundred years behind. That is the legitimate act of 'discipline' we can do in the new world."

 GEH_ogas: "OGAS"
 GEH_ogas_desc: "Our Gehenna technology is certainly lacking compared to Millennium. Therefore, programs that allow the state to manage all companies and administration using computer communication are not at a sophisticated level and have clear limits.\n\nHowever, even with only the leadership of the Machine God Sorasaki Hina and our basic computer technology, we will be able to build a rudimentary automated economic system that connects corporations and the administrative department through a network communication system spread throughout all of Gehenna, using only electronic currency like credit cards instead of physical cash.\n\nOur OGAS program aims to electronize all administration and connect all companies and administrative departments via electronic communication so the Machine God can directly control the economy."

 GEH_sorasakism: "Sorasaki Faith"
 GEH_sorasakism_desc: "A Neo-pagan faith worshipping Sorasaki Hina as a living god. It is followed by very hardline suppression toward local Catholic and Protestant organizations and the fanatical worship of Hina by believers."

 GEH_royal_guards: "Royal Guards"
 GEH_royal_guards_desc: "The Royal Guards led by Amau Ako is an independent military organization with judicial power over ideological criminals who harm national safety, including anti-establishment forces rejecting the worship of Sorasaki Hina. Its command system is separate from the Gehenna regular army and is nominally managed by the Planning Bureau, a technocratic organization.\n\nDue to the cold personality of the Senior Administrator and Royal Guard Chief Amau Ako, the madness of the Royal Guard is controlled at a minimum level. By appointing Ako as Royal Guard Chief, Hina ensures her fanatics do not run wild more than necessary, keeping them as safe hounds checked by other departments."

 GEH_denazification: "Denazification"
 GEH_denazification_desc: "Although the [ROOT.GetAdjective] cabinet has political tendencies that cannot be classified as right or left, one certain thing is that our system has put forward 'anti-Nazi' as its most important value since the 'Great Migration.' Compared to Pandemonium Society's friendly relations with old German Nazi forces, such as attempting cooperation with the Wehrmacht, the Prefect Team leadership regarded the National Socialist German Workers' Party (NSDAP) as a force that does not fit the morality and order pursued by the Prefect Team.\n\nThe Gehenna Prefect Team is showing hostile movements while rejecting any cooperation or exchange with Wehrmacht or German NSDAP remnants, and these movements have been the driving force behind our government's support from the Social Democratic Party of Germany and anti-Nazi artists. Since Sorasaki Hina defined the NSDAP as 'disorder and immorality,' changing or relaxing this keynote will be regarded as a major betrayal by supporters."

 GEH_denazification_victory: "Victory of Denazification Ideals"
 GEH_denazification_victory_desc: "Although the [ROOT.GetAdjective] cabinet has political tendencies that cannot be classified as right or left, one certain thing is that our system has put forward 'anti-Nazi' as its most important value since the 'Great Migration.' Compared to Pandemonium Society's friendly relations with old German Nazi forces, such as attempting cooperation with the Wehrmacht, the Prefect Team leadership regarded the National Socialist German Workers' Party (NSDAP) as a force that does not fit the morality and order pursued by the Prefect Team.\n\nWe succeeded in protecting our pure ideals by destroying the Pandemonium Society, which cooperated with the Wehrmacht. Our victory will be a major turning point in driving out the black darkness that had taken root in Germany."

 GEH_victory_trinity: "Lessons from Trinity"
 GEH_victory_trinity_desc: "The victory we achieved in the Eden showdown became a very important experience that greatly improved the quality of our officers. This experience will influence [ROOT.GetName]'s military doctrine for generations to come."

 GEH_ako_no_hina_idea: "Gehenna State Capitalism"
 GEH_ako_no_hina_idea_desc: "A wide-ranging state capitalist system is being implemented by Gehenna technocrats, starting from the arms industry to light and heavy industries."

 GEH_human_right_law_iroha: "German Employment Restrictions"
 GEH_human_right_law_iroha_desc: "Was there no shooting and violence like in Kivotos in Germany? As seen in the confrontation between Nazis and Communists in the late Weimar Republic, Germans possess latent inner violence.\n\nWe will force companies to penalize the employment of the German population and impose stricter limits on civil servant appointments. These policies will force the German population to remain only in non-professional jobs, including primary industries."

 GEH_human_right_law_kayoko: "Civil Rights Protection Agency"
 GEH_human_right_law_kayoko_desc: "Despite the conflict between the German and Gehenna nations, we must acknowledge that we must coexist on this land. The Civil Rights Protection Agency, a state-run agency, will be established to monitor whether unfair discrimination against Germans by Kivotosian superiors occurs in each company and public institution."

 GEH_military_tradition_1: "[ROOT.GetAdjective] Military Tradition"
 GEH_military_tradition_1_desc: "Unlike the Pandemonium Society, which has a tradition of vanity and parties, the Prefect Team has a long military tradition and history and is hardened by actual combat. Even if transferring this military tradition and history to non-Kivotosian soldiers is a difficult task."

 GEH_military_tradition_2: "[ROOT.GetAdjective] Military Tradition"
 GEH_military_tradition_2_desc: "Unlike the Pandemonium Society, which has a tradition of vanity and parties, the Prefect Team has a long military tradition and history and is hardened by actual combat. Even if transferring this military tradition and history to non-Kivotosian soldiers is a difficult task."

 GEH_military_tradition_3: "[ROOT.GetAdjective] Military Tradition"
 GEH_military_tradition_3_desc: "[ROOT.GetAdjective] has a long military tradition and history and is hardened by actual combat. Due to extensive military reforms and a continuous military command system, our army is now accustomed to joint operations between non-Kivotosian and Kivotosian soldiers."

 GEH_gehenna_leadership_committee_idea: "Prefect Team Committee"
 GEH_gehenna_leadership_committee_idea_desc: "The committee, which elects the Prefect Head through an indirect election system, is the organization representing Gehenna in the era after Sorasaki Hina and claims to legally inherit the history of the small old Prefect Team of Gehenna Academy. The committee is the symbol of the Gehenna Prefect Team and the organization symbolizing the process of Gehenna changing from a dictatorial state under one Prefect Head to an oligarchical democratic state."
 GEH_gehenna_leadership_committee: "§Y$GEH_gehenna_leadership_committee_idea$§! Modifier"

 GEH_gehenna_student_council_idea: "[ROOT.GetAdjective] Student Council"
 GEH_gehenna_student_council_idea_desc: "The Student Council, which elects the Student Council President through a direct election system, is the organization representing Gehenna in the era after Sorasaki Hina and claims to legally inherit the history of the Gehenna Academy Student Council—Pandemonium. The council is the symbol of Gehenna democracy and the organization symbolizing the process of Gehenna changing from a dictatorial state under one Prefect Head to an elected Student Council President system state."
 GEH_gehenna_student_council: "§Y$GEH_gehenna_student_council_idea$§! Modifier"

 GEH_gehenna_council_idea: "[ROOT.GetAdjective] Council"
 GEH_gehenna_council_idea_desc: "The Council, which elects members through an indirect election system, is Gehenna's new parliamentary organization undergoing normalization and claims to legally inherit the history of the 1918 Weimar Republic Parliament. The Council is the symbol of Gehenna's managed democracy and the organization symbolizing the process of Gehenna changing from a dictatorial state under Sorasaki Hina to an oligarchical state."

 GEH_gehenna_war_department_idea: "[ROOT.GetAdjective] War Ministry"
 GEH_gehenna_war_department_idea_desc: "A Joint Chiefs of Staff that oversees Gehenna Academy's extensive military operations, grand strategy, and overall operational plans, commanding the Gehenna student army, the army composed of Germans, and numerous other integrated sub-organizations, serving as the practical military command of Gehenna Academy and a massive organization preparing for the Great War."

 GEH_intelligence_reform: "Counterintelligence Reform"
 GEH_intelligence_reform_desc: "The Gehenna Intelligence Bureau now only has counterintelligence authority over external matters, and its authority over domestic investigations is effectively stripped. This goes beyond a simple retaliatory measure from the Planning Bureau and aims to prevent the Intelligence Bureau from exercising more authority than necessary."

 GEH_with_SPD: "Social Democratic Party Alliance"
 GEH_with_SPD_desc: "The SPD will now exert overwhelming influence in all federal Free States of Gehenna. Even in Bavaria, where the most conservative Bavarian People's Party used to overwhelm the SPD. Although very sophisticated district gerrymandering will be carried out for this, it is better than other parties seizing local autonomy."

 GEH_with_trinity: "Eden Little Pact"
 GEH_with_trinity_desc: "The long-standing division and confrontation between Trinity and Gehenna are not as severe as the division between humanity and Kivotosians after the Great Migration. We will implement a strict quota system for the Trinity-born in appointing local bureaucrats and strive for Trinity and Gehenna to truly become friends."

 GEH_managed_democracy_union_idea: "Managed Democracy Collaborator"
 GEH_managed_democracy_union_idea_desc: "[ROOT.GetName] is a managed democracy collaborator loyal to [GEH.GetName]. It protects social order from extremist forces by limiting rights to citizens, while simultaneously striving for the realization of liberal ideals."

 GEH_winter_special_equipment: "Focus on Winter Equipment Production"
 GEH_winter_special_equipment_desc: "Focusing on winter equipment production for victory on the Eastern Front."

 GEH_gehenna_first_discipline: "Enforcement of Gehenna Discipline"
 GEH_gehenna_first_discipline_desc: "Gehenna's discipline must be strictly observed in our occupied territories as well."

 GEH_weapons_licensing: "Investment in Equipment Licenses"
 GEH_weapons_licensing_desc: "Not just [ROOT.GetAdjective] weapons, but licensed weapons imported from overseas are also important."

 GEH_gehenna_order_department_idea: "[ROOT.GetAdjective] Order Bureau"
 GEH_gehenna_order_department_idea_desc: "The Order Bureau is a unit directly under the Great Philosopher Leader Sorasaki Hina, an independent military organization with judicial power over ideological criminals who harm national safety. Its command system is separate from the Gehenna regular army, and no political or military check forces exist.\n\nDue to the relationship with the Enforcement Bureau, the regular army of [GEH.GetNameDef], the Order Bureau is causing new political turmoil."

 GEH_hina_freie_gehenna_jugend_idea: "Free Gehenna Youth"
 GEH_hina_freie_gehenna_jugend_idea_desc: "A political organization that Gehenna's youth must forcibly belong to. This organization takes on the role of controlling and managing youth to maintain the one-party dictatorial system."

 GEH_hina_friendship_idea: "Kivotos Pan-Nationalism"
 GEH_hina_friendship_idea_desc: "Kivotosians are great and are born with a manifest destiny to rule the Earth's locals. Are they not a primitive race without even a halo?"

 GEH_hina_solidarity_idea: "National Solidarity"
 GEH_hina_solidarity_idea_desc: "Locals are 'less equal' than Kivotosians, but they have the duty to maintain 'national solidarity' for the victory of the fatherland."

 GEH_sorasaki_leadership: "One-Man Dictatorship"
 GEH_sorasaki_leadership_desc: "Gehenna is no longer a country where zealots following Hina overwhelm other factions. There are no longer any factions that are not zealots. Now that Hina's personal leadership is complete and the only remaining forces are her followers, Gehenna's ruthless one-man dictatorial system is finalized."

 GEH_nsdap_gercom_revolt: "Final German Rebellion"
 GEH_nsdap_gercom_revolt_desc: "The 'German Salvation Government,' a coalition government of Reich Chancellor Albert Speer and President Ernst Thälmann, has launched a final popular rebellion across Gehenna. Resistance forces composed of NSDAP and Communist Party of Germany supporters have agreed to destroy Gehenna and build a new German Republic.\n\nHow foolish."

 GEH_international_judicial_order: "International Judicial Order"
 GEH_international_judicial_order_desc: "We are the Gehenna Prefect Team. That is, in whatever form our national system changes, we must contribute to maintaining the international judicial order and lowering the world's crime rate."

