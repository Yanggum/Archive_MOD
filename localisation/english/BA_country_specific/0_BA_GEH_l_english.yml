 GEH_hina_corruption_last_decision_category: "The Final Rebellion"
 GEH_hina_corruption_last_decision_category_desc: "The Nazis and Communists have begun their final §YRebellion§!. This rebellion gathers their §YLast Remaining Strength§!; if this rebellion fails, they will never be able to stage an organized resistance again.\n\nIt is time to clean up Gehenna."

 GEH_hina_corruption_last_decision_attack_1: "Besiege Key Cities"
 GEH_hina_corruption_last_decision_attack_1_desc: "Leave not a single soul."

 GEH_hina_corruption_last_decision_attack_2: "Massive Bombardment"
 GEH_hina_corruption_last_decision_attack_2_desc: "The moment they hid fascists and communists, every resident of that city became a fascist communist."

 GEH_luxembourg_negotiations_category: "[GEH.GetNameDef]-[HEU.GetNameDef] Unification Negotiations"
 GEH_luxembourg_negotiations_category_desc: "Since the Great Transfer, §YGehenna§! has been largely divided into three political factions: the §OPandemonium Society§!, the political center of Gehenna; the §YGehenna Prefect Team§!, Gehenna's military organization; and the §GGrand Duchy of Luxembourg§!, a local nation where the Gehenna-descended hold political leadership.\n\nRikuachima Aru had no interest in holding the leadership of Gehenna either before or after the Transfer, only wishing for the peace of Luxembourg. This has been maintained even after the Pandemonium Society fled to Luxembourg City during the war with §RTrinity General School§!, and after the Luxembourg government occupied the Gehenna Central District.\n\nTherefore, [ROOT.GetLeader] is very cautiously weighing the possibility of a §GPaceful Unification of Gehenna§!. If the autonomy of the Grand Duchy of Luxembourg is guaranteed and she is allowed to maintain her idealistic beliefs, it may be possible for [ROOT.GetNameDef] and Luxembourg to become one."

 GEH_luxembourg_negotiations: "Gehenna Unification Consultative Conference"

 prefect_team_decolonisation_decision_category: "[ROOT.GetNameDef]-led Management of New Territories"
 prefect_team_decolonisation_decision_category_desc_ako: "Sweet freedom! For democracy! The [ROOT.GetLeader] government has fought foreign fascist forces to spread free §YManaged Democracy§!, and the [ROOT.GetName] government has an obligation to embrace them as sister nations rather than through oppression.\n\nWe are discussing the construction of new civilian governments in occupied areas to establish Managed Democracy partner states. This is to show that we did not fight the war for simple territorial expansion, but to spread the order of [ROOT.GetLeader] and §YGehenna§!, and to allow them to enjoy truer freedom under safe order and correctly managed democracy."
 prefect_team_decolonisation_decision_category_desc_hina: "The expansionist policies of the [ROOT.GetNameDef] government continue, and the violent actions of fanatics following Sorasakiism in the occupied territories are becoming increasingly difficult to control. We are discussing the construction of Reichskommissariats for the management of occupied territories according to the will of [ROOT.GetLeader].\n\nThis is not to forcibly control the occupied territories or suppress their freedom. The locals are excessively weak compared to those from Kivotos, and they need time to be §GEdified§! under the correct teachings of the Great Führer and Leader, Sorasaki Hina. Under several decades of merciful rule, they will forget their existing values and learn how to be obedient under the correct §YOrder§!."
 prefect_team_decolonisation_decision_category_desc_iori: "The expansionist policies of the [ROOT.GetNameDef] government continue, and resistance in the occupied territories is becoming increasingly difficult to control. We are discussing the construction of Reichskommissariats for the management of occupied territories according to the will of [ROOT.GetLeader].\n\nThis is not because we are sadists who enjoy abusing them. The spirit of the Gehenna Prefect Team is order and discipline, and the locals are too chaotic to establish order and discipline themselves—much like the Pandemonium Society. We wish to give them time to be §GEdified§! under the correct order of the Prefect Team. Under several decades of merciful rule, they will forget their existing values and learn how to be obedient under the correct §YOrder§!."
 prefect_team_decolonisation_decision_category_desc_generic: "The expansionist policies of the [ROOT.GetNameDef] government continue, and resistance in the occupied territories is becoming increasingly difficult to control. We are discussing the construction of Federal States for the management of occupied territories according to the will of [ROOT.GetLeader].\n\nA Governor dispatched from Kivotos will manage them, and we will sufficiently teach those who are as chaotic as the §YPandemonium Society§! what §YTrue Freedom§! looks like under control."

 prefect_team_decolonisation_decision_LP1: "Establish [LP1.GetNameDef]"
 prefect_team_decolonisation_decision_LP1_desc: "France is very different from other regions. While many French people reside there, it is also a region where Millennium-ization has progressed since the Transfer. We cannot take Paris from the French, nor can we take the Millennium Campus from the Millennium students. Under the correct order of the Prefect Team, we will edify Millennium and France so they can establish a self-governing government on equal footing."
