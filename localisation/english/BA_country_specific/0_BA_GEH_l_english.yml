 GEH_hina_name: "소라사키 히나"

 #게헨나
 GEH_country_intro_header: "대전이 이후 50일"
 GEH_country_intro_content: "대전이 이전 게헨나의 사법/치안 기구였던 §p게헨나 선도부§!는 외부인들에게는 키보토스의 전설적인 지도자인 소라사키 히나 때문에 높은 인지도를 가지고 있었고, 게헨나인들에게는 법적 상급기구인 §R판데모니움 소사이어티§!와의 정치 대립이 널리 알려져 있었습니다.\n\n판데모니움 소사이어티, 약칭 만마전은 학생들의 직접선거로 선출되는 선도부의 상급기관이지만, 노골적으로 게헨나 선도부에 적개심을 가지고 내정, 예산, 군사 분야에 폭넓은 간섭을 하려고 했습니다. '뇌제'라 불린 군국주의자의 후임으로 당선된 하누마 마코토 의장은 정권교체 이후에도 '키보토스 전체를 정복하겠다'는 군국주의적인 망상을 버리지 않았으며 소라사키 히나의 정치에 대한 환멸은 점점 심해져갔습니다.\n\n이러한 상황 속에서 히나는 §Y총학생회장§!이 추진한 '에덴 조약'에 매달리기 시작했습니다. 게헨나의 적성국인 §Y트리니티 종합학원§!과 평화 조약을 맺고, 공동협정조직인 ETO를 설립하게 된다면, 게헨나의 치안을 비롯한 모든 고민을 §GETO§!에 떠맡길 수 있을 것이라는 기대였습니다. 소라사키 히나는 에덴 조약이 체결되는 것을 마지막으로 모든 직에서 사임하려고 했습니다. ...대전이라는 상황만 없었다면, 그렇게 했을 것입니다.\n\n키보토스 전체가 지구로 전이되는 대전이의 혼란은 에덴 조약을 비롯한 모든 키보토스에서의 외교 활동을 중단시켰습니다. 판데모니움 소사이어티의 간섭은 멈추지 않은 상태에서 히나와 선도부는 새로운 고민들을 안아야 했습니다. 키보토스가 지구의 중부 유럽 전역을 '덮어씌우면서' 조국을 잃어버린 §R나치 잔당§!들이 총기를 들고 키보토스계 인구를 공격하기 시작했습니다.\n\n게다가 폭력을 대수롭지 않게 생각하는 게헨나계의 성향도 문제가 되었습니다. 룩셈부르크에서 대규모의 민간인 사망 사건이 일어나자, 소라사키 히나는 급하게 게헨나계의 총기 소유를 (현지인 거주지에서) 금지하는 §Y룩셈부르크 규정§!을 제정하여 선도부가 전이된 바이에른에서의 비슷한 총기 범죄를 막아냈습니다.\n\n하지만 모든 문제가 끝난 것일까요? 50일이라는 시간 동안 소라사키 히나의 빛나는 은퇴 계획은 영구적으로 좌절되었고, 수많은 업무들이 그녀를 정신적으로 몰아세우고 있습니다. 판데모니움 소사이어티와 트리니티 종합학원이라는 두 외부의 압박은 거세지고 있으며, 룩셈부르크 규정 이후 게헨나인들을 우리를 §R군벌§!이라며 비난하고 있습니다. 현지 정달들도 우리를 좋아하지 않는 것 같습니다.\n\n소라사키 히나는 이 모든 고난을 견뎌낼 수 있을까요? 아니면, 그 무게에 짓눌려 부서지고 말까요?\n\n§Y개발 : Kangseul2702, SKSKIe, Sonetto§!"
 GEH_country_intro_header_1: "대전이 이후의 파벌 - 합법 현지 정당"
 GEH_country_intro_content_1: "대전이 이후 선도부 본부가 바이에른 지역으로 전이되었기에, 선도부의 영향력은 바이에른에 집중되었습니다. 선도부는 대전이 이후 바이에른에 머무르며 다양한 현지인 정치 파벌들과 마주해야만 했습니다.\n\n선도부는 도이칠란트의 기존 라이히스탁을 부정하고 바이에른의 중앙 정치를 선도부가 독점하기로 결정했습니다. 그럼에도 불구하고 지방 시의회들은 살아남았으며, 선도부는 나치 정권이 들어선 이후 금지당한 정당 설립의 자유를 허가하였습니다. 1933년 이후 탄압받아 왔던 여러 야당들이 다시 설립되며 바이에른의 정치는 역동적으로 변화했습니다.\n\n도이칠란트의 모든 정당들은 나치 수권법 이후 해산되었으나, 대전이와 나치 붕괴 이후 다시 재건되었습니다. §O사회민주당§!은 과거 바이마르 공화국 당시의 강력한 좌익 정당으로, 대전이 이후 게헨나 선도부의 통치를 인정하는 유일한 제도권 정당입니다. 사회민주당은 게헨나 선도부가 가진 반나치 성향을 높게 평가하며 선도부와의 협력을 통해 평화적으로 중앙 정치에 복귀할 수 있으리라고 믿습니다.\n\n§Y바이에른 인민당§!은 바이에른 지역의 지방 우익 정당으로, 재건된 이후 '바이에른의 통치는 바이에른인에게'라는 모토를 중심으로 선도부에 저항하고 있습니다. 하지만 그들은 의회주의 원칙을 지키며 게헨나 선도부가 용인하는 지방 의회에서의 소극적인 규탄만을 이어가고 있기에, 선도부의 탄압도 받지 않지만 사회적 영향 역시 제한되어 있습니다.\n\n§C중앙당§!은 바이마르 공화국의 중요 우익 정당이었으나, 바이에른으로 영토가 한정된 선도부 통치권 내에서는 바이에른이 중심 지지층인 인민당에 비해 약소한 영향력을 갖고 있습니다. 중앙당 역시 선도부의 통치에 반대하지만 선도부보다는 인민당을 공격하며 지방의회에서의 정치력을 더 확장하고자 합니다."
 GEH_country_intro_header_2: "대전이 이후의 파벌 - 불법 저항세력"
 GEH_country_intro_content_2: "대전이 이후 선도부는 국가사회주의노동자당, 즉 나치에 대한 강한 적대 의식을 드러냈습니다. 선도부는 과거 도이칠란트의 여당이었던 나치당의 여성 권리 탄압, 소수 인종 탄압, 그리고 민주적 절차를 이용해 집권한 이후 타 정당을 탄압하는 모습을 분석하고 그들이 §Y정의와 질서§!에 어긋나는 파괴해야 할 §Y혼돈§!으로 규정지었습니다.\n\n§Y도이칠란트 국방군§!은 대전이 이후 50일간 바이에른 각지에서 게릴라 활동을 이어가고 있으나, 분열되고 나약해 장기간 저항하지 못할 것임은 확실합니다. 더 큰 위협이 되는 것은 §Y나치당§! 당원 조직입니다. 당원 조직은 국방군처럼 숲과 산에서의 게릴라 활동 대신 도시 안에서 저항합니다. 그들은 사민당, 인민당, 중앙당과 달리 금지정당으로 지정되었으나, 젊은 당원들은 여성이 통치하는 선도부 사회를 §R퇴폐적§! 문명으로 간주하고 도시에서의 폭탄 테러 등 '외로운 늑대' 식의 반항을 이어가고 있습니다.\n\n§R도이칠란트 공산당§!은 나치당 다음으로 규모가 큰 불법 정당입니다. 선도부는 초기에 그들을 단순한 '평행우주의 붉은겨울 연방학원'으로 인식하고 우호적 관계를 맺고자 하였으나, 공산당은 선도부를 또 다른 부르주아 독재 정권으로 인식하고 타협 대신 '바이에른 인민공화국'의 설립을 요구하며 저항을 시작했습니다.\n\n그 외에는 대전이로 인해 함께 넘어온 키보토스 범죄 조직인 §G헬멧단§!이 바이에른 각지로 영향력을 넓히고 있습니다.\n\n모든 저항 세력들은 선도부의 골칫거리이며 사회의 규율을 떨어뜨리는 적들이지만, 그 모두가 파편화되어 있고 군사력이 강하지 않아, 선도부 체제 자체를 자력으로 전복시킬 능력은 없습니다."
 GEH_guide: "§Y$GEH_main_route_focus$§! | 미완성\n£white_dot 제1차 선도부 총회에서 선택지에서 여러 파벌의 주장을 중립적으로 수용합니다.\n£white_dot 소라사키 히나의 사임을 막으십시오. 사임 카운트다운이 다 되기 전, 판데모니움 소사이어티와 트리니티를 병합하고 제4차 총회를 완성해야만 합니다.\n£white_dot §R경고: 이 루트는 4차 총회 이후의 콘텐츠가 존재하지 않습니다.§!\n\n§C$GEH_ako_route_focus$§!\n£white_dot 제1차 선도부 총회에서 선택지에서 기획부의 주장을 일방적으로 수용합니다.\n£white_dot 소라사키 히나의 사임을 막으십시오. 사임 카운트다운이 다 되기 전, 판데모니움 소사이어티와 트리니티를 병합하고 제4차 총회를 완성해야만 합니다.\n£white_dot 히나와 아코가 서로 연애를 시작하게 만든다면, 사임 카운트다운은 영구적으로 중단될 것입니다.\n£white_dot §R경고: 힘의 균형이 '갈팡질팡'인 상태로 두 사람의 관계를 종료하지 마십시오. 최악의 행동이며, 영구적으로 아코 루트의 엔딩 콘텐츠 진입을 차단할 것입니다.§!\n\n§O$GEH_iori_route_focus$§! | 미완성\n£white_dot 제1차 선도부 총회에서 선택지에서 실행부의 주장을 일방적으로 수용합니다.\n£white_dot 소라사키 히나의 사임을 막으십시오. 사임 카운트다운이 다 되기 전, 판데모니움 소사이어티와 트리니티를 병합하고 제4차 총회를 완성해야만 합니다.\n£white_dot §R경고: 이 루트는 4차 총회 이후의 콘텐츠가 존재하지 않습니다.§!\n\n§P$GEH_hina_route_focus$§! | 미완성\n£white_dot 제1차 선도부 총회에서 선택지에서 열성부원들의 주장을 일방적으로 수용합니다.\n£white_dot 소라사키 히나의 사임을 막으십시오. 사임 카운트다운이 다 되기 전, 판데모니움 소사이어티와 트리니티를 병합하고 제4차 총회를 완성해야만 합니다.\n£white_dot $GEH_gehenna_leader$ 중점을 완료할 경우 사임 카운트다운은 영구적으로 중단될 것입니다.\n£white_dot §R경고: 이 루트는 4차 총회 이후의 콘텐츠가 존재하지 않습니다.§!\n\n§G탈선 루트§!\n£white_dot 소라사키 히나가 사임할 경우, 기존의 제4차 총회와 완전히 분리된 새로운 '탈선 루트'들이 나타납니다.\n£white_dot §R경고: $GEH_iori_route_focus$의 탈선 루트는 미완성입니다.§!"
