 GEH_Armed_Neutrality_desc: "게헨나 학원은 현재 내전의 피해를 복구하기 위해 중립을 선언하였습니다."
 GEH_popular_support_desc: "비록 만마전과 선도부의 대립 관계가 잘 알려지 있기는 했지만, 학원 내 조직 법률 상으로 선도부는 어디까지나 만마전의 하위 조직에 불구합니다. 대전이 이후 선도부가 사실상 만마전의 모든 통제에서 벗어나 독립 정부를 건설하였지만, 우리의 정통성에는 큰 타격을 입었습니다. 중앙 정부의 명령을 따르지 않고 할거하는 군사 세력이 '군벌'과 무엇이 다르냐고 묻는다면, 우리는 어떤 답을 해 줘야 할까요?\n\n결국 게헨나 선도부가 게헨나 학원의 적법한 지도 세력으로서 인정받기 위해서는 정통성을 얻기 위한 노력이 필요합니다. 바로 우리가 그들보다 더 나은 조직이라는 것을 게헨나 학생들에게 인정받는 것이지요."
