 ## 선도부 히나(바알) 마지막 디시전

 GEH_hina_corruption_last_decision_category: "최후 반란"
 GEH_hina_corruption_last_decision_category_desc: "나치와 공산주의자들이 최후의 §Y반란§!을 시작했습니다. 이번 반란은 그들의 §Y마지막 여력§!을 모두 모은 것으로 이번 반란이 실패한다면 그들은 다시는 조직적인 저항을 펼치지 못할 것입니다.\n\n게헨나의 정리를 시작할 시간입니다."

 GEH_hina_corruption_last_decision_attack_1: "중요 도시 포위"
 GEH_hina_corruption_last_decision_attack_1_desc: "한 사람도 남기지 말라."

 GEH_hina_corruption_last_decision_attack_2: "대규모 폭격"
 GEH_hina_corruption_last_decision_attack_2_desc: "파시스트와 공산주의자를 숨긴 순간, 그 도시의 모든 주민들은 파시스트적 공산주의자가 되었다."

