 GEH_amau_administrative_officer_tt: "As the Federal Republic has stabilized, Sorasaki Hina will reclaim some of the power previously delegated to the Planning Bureau. The §YPlanning Bureau§! and the §YCouncil§! will exercise much more limited authority than before.\n\n"
 
