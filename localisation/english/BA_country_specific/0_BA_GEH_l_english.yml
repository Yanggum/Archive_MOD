 ### 선도부 산업(문화) 중점 ###
 GEH_luxembourg_problem: "룩셈부르크 규정 문제"
 GEH_luxembourg_problem_desc: "대전이 이후 제정된 '룩셈부르크 규정'은 다시금 일어날 수 있는 학살을 효과적으로 막아냈습니다. 하지만 게헨나계의 반발과 현실적인 행정력 부족은 우리에게 피할 수 없는 룩셈부르크 규정의 개선을 요구하고 있습니다."

 GEH_internet_network_recovery: "인터넷 통신망 복구"
 GEH_internet_network_recovery_desc: "키보토스에 사용하던 광랜은 아마 밀레니엄 측의 기술이 도입되기까지 몇 년 정도 시간이 걸리겠지만, 현지인들이 사용하는 전화 통신망을 이용하면 모뎀 기반의 인터넷망을 빠른 시간 안에 재건할 수 있을 것입니다."

 GEH_centre_of_culture: "문화의 중심부"
 GEH_centre_of_culture_desc: "일부 게헨나계 학생들은 선도부가 문화 생활과 대중들의 자유를 억압하고 전체주의적인 사회를 만드는 것에만 관심이 있다고 오해합니다. 아니요. 그렇지 않습니다. 선도부는 온천을 파기 위해 테러를 저지르거나, 맛없는 음식점에 폭탄을 던지는 것만 아니라면 어떠한 자유 문화도 수용할 준비가 되어 있습니다."

 GEH_centre_of_culture_a: "바우하우스"
 GEH_centre_of_culture_a_desc: "도이칠란트 히틀러 정권에 의하여 폐쇄되었던 바우하우스는 게헨나 선도부의 지원으로 인해 다시 문을 열었습니다. 현지인들을 가장 믿지 못하는 아코도 현지인 건축가들이 제시하는 새로운 선도부 건축물 디자인에는 관심이 많아 보이는군요."

 GEH_centre_of_culture_b: "퇴폐 미술전"
 GEH_centre_of_culture_b_desc: "도이칠란트 히틀러 정권에 의하여 퇴폐 미술로 분류되어 탄압받았던 표현주의 예술이 다시 꽃을 피우기 시작했습니다. 선도부는 새로운 미술대학의 설립을 지원하고 게헨나 학생들이 예술을 통해 조금이라도 자신들의 폭력성을 가라앉히기를 바랍니다. 아마 그러지 않을 것 같긴 하지만요."

 GEH_centre_of_culture_c: "빛으로 나아가는 소야곡"
 GEH_centre_of_culture_c_desc: "소라사키 히나의 도움을 통해 게헨나 학생들의 자유 청강이 허가되는 새로운 게헨나-바이에른 음악대학이 문을 열었습니다. 뛰어난 음악가인 슈트라우스는 음악대학에서 직접 교편을 잡아 게헨나 음악과 낭만주의 음악을 결합한 새로운 음악 사조를 개척하고 싶어 합니다."

 GEH_centre_of_culture_end: "게헨나-바이에른 예술"
 GEH_centre_of_culture_end_desc: "게헨나와 바이에른의 예술이 조화를 이루어, 새로운 예술적 사조를 만들어냈습니다. 이로서 현지인과 게헨나계 사이의 갈등이 훨씬 감소하고, 서로가 서로를 더 깊이 이해할 수 있는 계기가 되기를 바랍니다."

 GEH_68_rev: "우리의 방법 강제"
 GEH_68_rev_desc: "우리가 도이칠란트 문화에 동화되어서는 안 됩니다. 남성우월주의 문화, 여성에 대한 차별, 그리고 사회에 널리 퍼진 사악한 국가사회주의 문화... 우리가 그들에게서 배우는 게 아니라, 그들이 우리에게서 배워야만 합니다."

 GEH_68_rev_for_prefect_team: "도이치 학생 재교육"
 GEH_68_rev_for_prefect_team_desc: "일부 도이칠란트 전통 문화는 가치가 있습니다. 하지만 도이칠란트의 남성주의적 종교, 사회문화에는 가치가 없습니다. 아직 어린 학생 단계에서부터 키보토스의 '현대적' 문화에 적응하기 위한 강제적 교육과 보수주의적 종교 세력에 대한 일소가 필요합니다."

 GEH_gradual_gehenna_culture: "분리를 통한 온건책"
 GEH_gradual_gehenna_culture_desc: "도이칠란트 대중 문화를 강제적으로 해체하고 키보토스화하는 것은 강한 반발을 살 것입니다. 더 나은 방법은 인종분리 후 점진적으로 그들이 우리의 문화를 이해하도록 하는 것입니다."

 GEH_cultural_exchange_education: "문화 교류 교육기관"
 GEH_cultural_exchange_education_desc: "우리는 게헨나계와 도이치계 인구가 서로의 문화에 대해 배우고 문화적인 차이를 이해할 수 있도록 하는 선도부 주도의 무료 교육 기관을 설립할 것입니다."

 GEH_gradual_gehenna_culture_for_prefect_team: "일국양제"
 GEH_gradual_gehenna_culture_for_prefect_team_desc: "중요한 것은 게헨나-도이치인간 거주지 분리가 남아프리카식의 거친 인종분리 정책이 되어서는 안 된다는 것입니다. 우리의 인종분리는 백년 이상의 문화적, 과학 기술상의 차이를 가진 두 민족이 서로를 이해할 수 있을 때까지 한시적으로 이루어질 것이며 모든 도이치인들은 게헨나인과 동일한 법률로 보호받을 것입니다."

 GEH_civil_rights_act: "민권법 제정"
 GEH_civil_rights_act_desc: "기본적으로 이 민권법은 룩셈부르크의 오니카타 카요코가 작성한 초안을 베껴온 것이기는 합니다. 하지만 선도부의 많은 임원들이 게헨나계의 권리만을 생각했을 뿐 수인, 오토마타를 향한 인종차별을 미처 생각하지 못했던 것과 달리, 카요코가 구상한 민권법 초안은 이러한 '비인간' 키보토스계 인구의 권리를 보장한다는 점에서 약간의 개정을 거쳐 선도부에도 도입할 가치가 있습니다."

 GEH_political_correctness: "정치적 올바름"
 GEH_political_correctness_desc: "민권법 제정으로 인해 소수 인구인 키보토스계를 향한 인종차별 문제는 해결되었으나, 여전히 게헨나계를 대상으로 한 무형의 인종 차별이 계속되고 있습니다. 지역 공무원 할당제, 가산점을 비롯한 정책이 분명 도움이 될 것입니다."

 GEH_local_autonomy: "지방의회"
 GEH_local_autonomy_desc: "민권법 제정으로 인해 도이치인들은 자신들이 소수에 불과한 게헨나계에 의해 식민통치를 당하고 있다는 피해의식을 갖게 되었습니다. 게헨나의 중앙정치에 현지인의 간섭은 제한되어야 하지만, 도이치인들을 위한 제한적 지방의회를 통해 그들의 분노를 가라앉힐 수 있을 것입니다."

 ### 히나 탈주!!! ###
 #### 히나 독재
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h: "급격한 변화"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_desc: "소라사키 히나에 대한 광신적 지지를 가진 친위대원들이 정치를 장악한 상황에서, 히나 부장의 사임과 실종은 선도부에 지금까지 없었던 가장 큰 혼란을 가져왔습니다. 친위대원들은 히나의 실종을 납득하는 자들과 납득하지 못하는 자들로 분열되었습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1: "페르소나"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_desc: "소라사키 히나는 현인신이자 게헨나를 영광으로 이끌 영도자여야 했습니다. 그런 인간의 모습을 한 신이 신자들을 버리고 도망친다는 것은 있을 수 없는 일입니다. ...만약 그녀가 가짜 신이었다면, 우리에게 숭배해야 할 존재가 더 이상 없다면, 우리는 신을 만들어낼 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_purge: "조용한 숙청"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_purge_desc: "소라사키 히나가 '대체'되었으며, 지금의 히나가 가짜라고 주장하는 선도부원들이 있습니다. 친위대원들 중 히나를 로봇으로 대체하는 것을 거부했던 반대파들입니다. 참 시끄러운 바보들이지요. '히나 부장'이 멀쩡하게 본부를 걸어다니고 있는 만큼, 그들을 정신병자로 몰아 숙청하는 것은 손쉬운 일입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_internet_surveillance: "인터넷 감시"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_internet_surveillance_desc: "새로운 신은 기계장치이시기에, 인터넷과의 연결을 통하여 짧은 기간에 수많은 정보를 감시하는 것이 가능하십니다. 이 능력은 인터넷을 통해 활동하는 게헨나 내부의 '비국민'을 찾아내는 것에 매우 용이하게 사용될 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_will_of_steel: "민족적 굴종"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_will_of_steel_desc: "조금도 쉬지 않고 게헨나의 영광을 위하여 일하는 선도부장의 모습은 모든 이들이 따라야 할 덕목입니다. 선도부원들 사이에서만 퍼져 있는 기계신에 대한 '열성'은 도이칠란트의 기존 종교를 대체할 국교가 될 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_reform: "정부 부처 개혁"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_reform_desc: "비공식적인 조직이었던 친위대는 공식적인 친위부로 개칭될 것입니다. 아코 선임행정관이 명목상 친위부의 부장을 겸하게 될 것이며, 친위부는 소라사키 히나에 대한 불충을 가진 전국민의 사상을 감시하고 반체제적 쓰레기들에 대한 즉결처형권을 포함한 독립된 사법권을 가질 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_emergency_council: "긴급위원회 설립"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_emergency_council_desc: "위대한 철인 지도자가 탄생했습니다. 이전의 나약한 신과 달리, 새로운 철인 지도자는 아무런 망설임 없이 모든 국민들을 자원으로서 소모하여 조국의 위대한 발전을 위한 땔감으로 사용할 준비가 되어 있습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mobilisation: "국가총동원령"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mobilisation_desc: "조국을 위한 부품이 되는 것은 국민 스스로에게도 영광스러운 일입니다. 그렇지 않나요?"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas: "국가자본주의 완성"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_desc: "기계신께서 모든 경제를 통제하고, 각 기업에 생산량을 하달할 것입니다. 국가 경제 역시 당연히 선도부에 의해 통제되는 도구여야 하지 않을까요?"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_2: "새로운 사회"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_2_desc: "모든 국민은 국가를 위한 부품이 되며, 경제는 새로운 지도자에 의해 통제됩니다. 모든 것이 잘 돌아가고 있습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mind: "감정 모방 중추"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mind_desc: "감정은 새로운 소라사키 히나에게 있어서 상당히... 무의미한 개념이라고 여겨졌지만, 적어도 선도부원들 앞에서의 다정한 연기를 위해 최소한의 감정 중추 프로그램은 필요합니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_hina: "소라사키 히나 문제"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_hina_desc: "기계신의 재림 이전 소라사키 히나가 있었습니다. 신을 저버린 가짜 신이 여전히 살아서 어딘가에 숨어 있다는 것은 상당히 불쾌한 문제이며... 그녀를 찾아내 제거할 필요가 있습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_end: "바알 사냥"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_end_desc: "자기가 '진짜 소라사키 히나'라고 주장하는 정신이상자를 붙잡았다는 아코 선임행정관의 충성스러운 보고가 있었습니다. 새로운 감정 중추 덕분에 '소라사키 히나'를 즐거운 마음으로 사살할 수 있을 것 같습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2: "천상의 혁명"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_desc: "소라사키 히나 선도부장님이 우리들의 부덕함에 통탄하며 스스로 권좌를 내려놓고 사라지셨습니다. 이는 우리의 게헨나 문화가, 독일인들이, 키보토스 전체가, 또는 유럽의 문화가 '히나 선도부장님의 영도'에 맞지 않았다는 걸 의미합니다. 우리는.... 잃어버린 우리의 구원자의 길을 따르기 위해. 국가와 사회, 문화, 행동 방식, 언어와 같은 모든 것들을 개조하고, 보다 온전하게 만들어야만 합니다!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_indiscriminate_prosecution: "무차별 기소"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_indiscriminate_prosecution_desc: "모조리 기소하고 재판해라! 혁명위원회의 이름으로, 만세! 그리고 반역자에게 죽음을! 소라사키 히나를 죽인 게헨나를 죽인다! 가장 밑바닥에서 가장 위를 찔러 죽여내라!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_liberalism: "게헨나의 자유주의"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_liberalism_desc: "게헨나에 본래 통제란 없습니다! 만마전과 선도부의 자애로운 통치와 수많은 동아리의 자유로운 권리 행사, 그리고 선도부장님이 게헨나의 동아리들과 한 여러 만남을 보면 자유야말로 게헨나 학원의 순수 문화의 본질입니다! 자유 만세!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_order_politics: "게헨나의 질서정치"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_order_politics_desc: "소라사키 히나님은 언제나 게헨나의 테러리스트들을 직접 잡아넣었습니다! 이건 소라사키 히나님이 퇴폐 게헨나 문화에서 질서를 추구했다는 방증입니다! 질서 만세!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_rebel_attack: "반역주의자 공격"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_rebel_attack_desc: "'반역주의자'는 혁명의 주역인 열성부원들 사이에서 불리는 '소라사키 히나에게 막중한 업무 과중을 일으키고, 게헨나-독일의 혼란을 조장하고 반선도부장적 활동을 한 모든 이들'에게 불리는 일종의 대중주의적 꼬리표입니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution: "문화 혁명"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution_desc: "맞지 않는 톱니바퀴를 끼운 것 처럼 삐걱이는 유로-키보토스의 퇴폐 게헨나-트리니티-독일-키보토스-유럽 문화를 쓸어내고 우리의 질서를 세워 마땅합니다. 소라사키 히나 선도부장 만세!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution_tt: "더 이상 §Y게헨나-바이에른 문화§!와 관련된 중점 계통도를 진행할 수 없고, 관련된 §Y모든 국민정신§!이 소멸합니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_communist: "반역자는 좌파다"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_communist_desc: "좌파 테러리스트 빨갱이들이야말로 우리 소라사키 히나님을 선동하고 조종했으며, 광범위한 반게헨나 활동을 통해 게헨나 학원의 혼란을 조장했습니다. 이들을 모두 체포하고 혁명에 있어 소위 '아방가르드' 활동을 모두 금지해야 합니다!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_nazist: "반역자는 우파다"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_nazist_desc: "우파 테러리스트 나치 놈들이야말로 선도부장님을 배후에서 조종하려 들었으며, 무장 민병대를 통한 반게헨나 활동을 주도하며 게헨나 학원을 장악하려 들었습니다. 이들을 모두 체포하고 혁명에 있어 소위 '초보수주의' 활동을 모두 금지해야 합니다!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_revolution_accomplished: "혁명 완수"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_revolution_accomplished_desc: "게헨나 학도혁명정부 내 정치적 방향성이 드디어 결정되었으며, 이후 소라사키 히나 선도부장을 향한 영원한 숭배와 수 많은 정치적 개혁의 나침반이 지정되었습니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_sorasakism: "'소라사키주의'"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_sorasakism_desc: "'소라사키주의'란 소라사키 히나 선도부장이 행한 모든 어록과 행보를 되살피며 그 행동을 계승하려 하는 수많은 정치적, 사회적, 종교적 운동입니다. 정계에서는 소라사키 히나의 정책을, 사회에서는 소라사키 히나의 어록을, 종교계에서는 소라사키 히나의 행보를 생각하며 국가 전체, 또는 개인을 정진하고 일깨우는 하나의 생활 방식입니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehenna_commune: "게헨나 코뮌"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehenna_commune_desc: "모든 게헨나의 자유 동아리와 혁명평의회, 그리고 자유노동조합과 수 많은 인민자치정부들의 평등하고 혼돈의 자유 게헨나 만세! 코뮌 만세! 혼돈과 자유의 학원 만세!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_religious_ecstasy: "종교적 황홀감"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_religious_ecstasy_desc: "좌경과 우경 모두를 경계하며 정통 '소라사키주의'를 계승하고 삶의 방식으로 체화시켜야 합니다. 신성 게헨나국 만세. 그리고 스러져간 소라사키 히나 선도부장님, 만세."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_second_order_state: "제2 질서국가"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_second_order_state_desc: "'모든 반역주의자를 체포하라!'\n소라사키 히나님을 위협하고 배후에서 조종해온 수 많은 '반역주의자'를 일거에 청소하게 게헨나 질서국가를 수립해야합니다! 새로운 '선도 활동' 만세! 질서 게헨나 만세!"

#### 아코
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a: "선도부의 선임행정관"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_desc: "히나 부장의 권력을 분산하고 기술관료제를 도입해 히나의 부담을 줄여주려 했던 아코의 노력에도 불구하고, 히나는 사직서 한 장을 남겨두고 실종되었습니다. 아코의 마음을 채운 것은 배신감이 아닌, 결과를 바꾸지 못한 무능력한 스스로에 대한 저주였습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_iroha: "이로하 선도부장"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_iroha_desc: "우리가 만마전을 장악한 이후, 나츠메 이로하는 집단지도체제가 이어지는 사이 오랜 시간 공석이었던 선도부장직을 이어받을 수 있는 가장 합리적인 인물로 평가받았습니다. 그녀는 정파성이 없는 단순한 관료이며, 구 만마전 출신이기 때문에 선도부에 영향력이 없어 '다루기 쉬운' 인물이기도 합니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_kayoko: "카요코 선도부장"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_kayoko_desc: "오니카타 카요코는 집단지도체제가 이어지는 사이 오랜 시간 공석이었던 선도부장직을 이어받을 수 있는 뛰어난 인재이기도 합니다. 그녀는 아코 선임행정관이 '뛰어난 재능을 가지고 있다'며 신뢰하는 인물이며, 비록 꼭두각시에는 알맞지 않지만 우리의 기술관료 체제를 존중하고 게헨나의 미래에 득이 되는 판단을 내릴 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_seminar: "기획부의 예산안 간섭"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_seminar_desc: "밀레니엄의 '세미나'는 기술관료제의 보석이라고 할 수 있을 만큼 완벽하고 모범이 되는 집단입니다. 뛰어난 기술관료들로 구성된 조직이 예산편성을 담당하며, 다른 부서들은 자신들이 하려는 모든 기획을 세미나에 제출하고 그 예산안을 승인받아야 합니다. 비록 강경한 반발로 인해 [ROOT.GetLeader] 체제가 새로운 세미나를 만들 수는 없겠지만... 적어도 예산안 문제에서 우리의 강경함을 보여줄 수는 있을 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_reduction_in_defense_budget: "국방 예산 삭감"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_reduction_in_defense_budget_desc: "딱히 정치적 보복 때문은 아닙니다만, 기획부는 비대하게 많은 실행부의 예산을 축소하고 이를 산업 발전으로 돌리기를 바랍니다. 다시 한 번 말하지만, 이것은 정치적 보복이 아닌 효율적인 예산 재배분입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_centre_of_culture: "문화의 학원"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_centre_of_culture_desc: "$GEH_4th_ako_centre_of_culture_desc$"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_future: "소라사키 히나 기념 장학금"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_future_desc: "비록 우리를 저버리고 떠나가셨지만, 소라사키 히나는 아코 행정관과 기획부 모두에게 있어서 너무도 소중한 존재였습니다. 아코는 그녀의 이름을 딴 장학재단을 만들어, 키보토스계와 현지인 모두를 가리지 않고 뛰어난 예술대학 학생들에게 장학금을 전달하고자 합니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_start: "경찰국가를 향한 투쟁"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_start_desc: "히나 부장님을 떠나게 만든 것은 수많은 업무, 타락한 사회적 문화, 저열한 현지인 범죄자들... 그 모든 것들이었습니다. 기획부는 히나 부장을 떠나게 만든 현지인들에게는 일말의 자비도 허락되어서는 안 된다고 주장합니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_1: "현지인 기업 탄압"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_1_desc: "도이칠란트인들에게 권력을 쥐어주지 않기 위해서는 그들의 돈줄을 빼앗는 것이 중요합니다. 도이치계가 기업을 설립하는 것을 방해하고, 기업을 설립할 경우에는 반드시 키보토스계와의 합작회사로 이루어지도록 제약을 걸 필요가 있습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_2: "국가 협동조합주의의 완성"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_2_desc: "우리는 국가 주도의 협동조합주의를 완성하고, 기술관료들에 의하여 통제되는 올바른 경제 체제를 만들었습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center: "히나 수색팀 구성"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center_desc: "히나는 아코를 버렸을지언정, 아코는 히나를 버리지 않았습니다. 아코는 남은 자신의 인생 전체를 모두 버리는 한이 있더라도, 혹시라도 이미 히나가... 세상을 떠났다고 하더라도. 그녀의 유해라도 찾아내기 위해 남은 삶을 모두 바칠 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_1: "교육 계획"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_1_desc: "미래의 기술관료들을 육성하기 위하여, 전문적인 교육 프로그램이 실시될 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_2: "[ROOT.GetLeader] 법"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_2_desc: "새로운 게헨나에서 도이칠란트 원주민들의 권리는 어떻게 재설정되어야 할까요? 다원주의적인 카요코와 현지인에 대한 증오심을 가진 기획부 중 누구의 의견이 법률에 반영될 것인가는, 우리가 과거에 선출한 지도자에 따라 결정될 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_end: "World We Changed"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_end_desc: "\"부장님, 세상은 저 혼자 바꿔나갈 수 있는 게 아니에요. 물론 부장님 홀로 바꿀 수 있는 것도 아니고요. ...저와 부장님 두 사람이 함께 있어야만, 우리는 함께 세계를 바꿀 수 있어요.\""

#### 이오리
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c: "혼란의 밤"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_weak_attack: "약자 공격"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_weak_attack_desc: "게헨나-키보토스 순수 문화를 더럽히는 독일계 시민들은 분명히 우리 게헨나의 암 덩어리들이 분명합니다. 키보토스 순수 문화를 수호하고, 게헨나의 위대한 정신을 더럽히지 않기 위해 우리는 독일계 시민들이 정부 고위직에서 일할 수 없도록 만들어야 합니다. ...물론 이를 통해 우리 정부에게 가해지는 정치적 압력을 해소할 수 있을 것입니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_kivotosism: "국가 키보토스주의"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_kivotosism_desc: "우리의 계엄령은 히나 선도부장이 '독일인들의 소요에 의해' 막중한 업무에 시달리다 실종되었으며, 이는 키보토스 문화만이 존재하던 과거에는 벌어지지 않았을 일이 분명합니다!"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_our_identity: "우리의 정체성"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_our_identity_desc: "게헨나 학원은 언제나 순수 키보토스 문화를 유지해야 하며, 이는 우리 신정부의 지도 방침으로 자리 잡을 것입니다. 키보토스인과 지구인의 차이는 명백하며, 우리야말로 진정으로 진보된 '인류'임을 선포해야 합니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_free_fatherland_defense_alliance: "자유조국방위연합"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_free_fatherland_defense_alliance_desc: "게헨나-키보토스 순수 문화를 수호하고 조국을 방위하기 위해서는 강력한 학생-시민-정부의 연대가 필요합니다. 우리의 지도부는 새로운 '자유조국방위연합'으로 재편될 것이며, 이는 정부의 지도력을 민중에게 투사하고, 강력하고 단결된 학원을 수립하기 위한 첫걸음이 될 것입니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_united_nation_reconstruction_committee: "연합국가재건위원회"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_united_nation_reconstruction_committee_desc: "이제는 모두가 지쳤습니다. 게헨나 학원에는 치유가 필요합니다. 게헨나 학원은 너무나도 많은 사건과 사고에 시달렸으며, 수많은 동아리의 폭동과 독일계 반란 조직의 테러리즘에 의해 오염되었습니다. 이제 우리는 그 오염을 닦아내야 하기에, '연합국가재건위원회'를 수립하여 우리들의 국가를 재건할 것입니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_regensburg_riot_decree: "레겐스부르크 폭동 법령"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_regensburg_riot_decree_desc: "우리는 반키보토스 불순분자, 게헨나 테러리스트, 공산주의자, 나치스트들이 국가에서 활개 치는 걸 더 이상 두고 볼 수 없습니다. 명백히 선도부를 향한 대규모의 폭동이었던 레겐스부르크 폭동과 같은 일이 두 번 다시 벌어질 수 없도록 하는 강력한 법안을 추진해야 합니다."
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_territory_reconstruction_ministry_establishment: "국토 재건부 설립"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_planning_ministry_role_expansion: "기획부의 역할 확대"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_order_restoration: "게헨나의 질서 회복"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_priority: "게헨나 우선"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pan_kivotos: "범키보토스"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_forced_assimilation: "독일인 강제동화"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_gehennan: "독일계 게헨나인"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pure_kivotos_cultural_leap: "순수 키보토스 문화 도약"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_forward_step_of_jeminj: "제민족의 진일보"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_leader_of_nation_and_fatherland: "민족과 조국의 지도자"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_conscription_equality: "징병 하 평등"

#### 노말
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n: "네 자리, 세 명"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_desc: "어떠한 말로도 변명할 수 없으며 어떠한 화려한 프로파간다로도 숨길 수 없습니다. 소라사키 히나는 한 장의 사직서만을 남긴 채 실종되었으며, 우리 정부는 마비 상태에 이르렀습니다. 아마우 아코가 선도부장 권한대행직을 맡게 되었으나 그녀는 새 업무를 맡고자 하는 의욕보다도 절망감과 죄의식에 더욱 시달리는 것 같습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_left: "의료 가방을 매고"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_left_desc: "관료들은 소라사키 히나의 사임 이후 흔들리고 있습니다. 히나가 지고 있던 거대한 책임감의 짐이 일반 선도부원들에게 무겁게 내려옵니다. "

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_right: "스페셜리스트의 의지를 다지며"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_right_desc: "실행부원들을 비롯한 일반 선도부 병사들의 사기는 최악입니다. 우리 군이 붕괴되지 않도록 하는 것이야말로 가장 어려운 시기 이오리의 역할입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start: "당신을 구해내도록"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_desc: "선도부장의 사임 이후 아마우 아코는 죄책감으로 인해 정상적인 업무 수행을 하지 못하고 있습니다. 의학 전문가인 치나츠가 아니라도 아코의 상태가 우울장애에 해당한다는 것은 누구라도 알 수 있을 것입니다. 문제는 아코 행정관이 단순한 우울감 표현을 넘어, '히나 부장님에 대한 완전한 속죄'에 대한 이야기를 점점 공공연하게 하고 있다는 것입니다. ...나무에 목을 매단 선임행정관의 모습을 보기 전, 우리는 움직여야만 합니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_late_reform: "늦어버린 개혁"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_late_reform_desc: "선도부장에 대한 업무가 지나칠 정도로 과다했으며, 관료제 개혁을 통해 권한을 분산해야 했다는 아코 선임행정관의 고안이 옳았음이... 너무 늦게 드러났습니다. 기획부 중간 관료들에게 더 많은 권한을 주고, 기획부의 자율성을 보장하는 개혁이 필요합니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_liaison_meeting: "전쟁부 연락 회의"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_liaison_meeting_desc: "이오리의 군국주의적인 정책이 어쩌면 옳았을지 모릅니다. 이오리의 정책대로 우리가 강경책을 실시했더라면... 히나 부장은 게헨나를 지켜야 한다는 사명감으로 자신의 의지를 다질 수 있었을지도요. 연락 회의는 선도부 실행부를 중심으로 한 '전쟁부'를 세우고, 실행부 군사 지도자들이 더 자율적으로 예산을 사용할 수 있도록 허용합니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_decentralization_of_work: "열성부원들의 추억"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_decentralization_of_work_desc: "소라사키 히나만이 선도부를 이끌 수 있을 것이라 말하던 열성부원들의 열정도 옳은 점이 있었을지 모릅니다. 우리가 그녀를 소중하게 생각하지 않았기에, 그녀 역시 우리를 소중하게 생각하지 않았는지도요. 후회 속에서 다시 모인 열성부원들은 히나에 대한 기록을 모아 평전을 만들고, 그녀가 영원히 추억되도록 할 것입니다."
 
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_new_leadership: "선도부장 직선제"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_new_leadership_desc: "앞으로 선도부장은 선도부 간부들에 의한 투표를 통해 결정될 것입니다. 우리는 히나 부장에게 지나칠 정도로 부담을 몰아주었으며, 이는 선도부장이라는 직급이 가진 군벌 독재자 다운 면모에서 유래한다는 결론을 내렸습니다. 간부들의 투표에 의해 언제라도 재신임을 묻고, 낙선될 수 있는 지도자라면 책임과 정치적 부담도 경감될 것입니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_investigative_operation: "$GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center$"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_investigative_operation_desc: "$GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center_desc$"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_righteousness: "정의의 깃발"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_righteousness_desc: "선도부는 영원히 잊을 수 없는 상처를 입었습니다. 우리는 개혁을 통하여 선도부가 저지른 과오를 넘어서서, 이제 없는 히나 부장에게 부끄럽지 않은 조직을 만들었습니다."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_end: "내일의 태양이 뜨도록"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_end_desc: "아코 선임행정관에게서 실종된 히나 부장을 발견했다는 보고가 들어왔습니다. 히나 부장은 선도부장으로서의 업무 복귀를 거부하고 있지만, 설득을 통해 어떻게든... 적어도 우리의 곁에 비어버린 빈자리에 다시 앉아, 우리들을 지켜봐 주시기라도 하기를 바랄 수는 없을까요?" 

### 외교
 GEH_diplomacy_focus: "[ROOT.GetName] 외교"
 GEH_diplomacy_focus_desc: "제3차 선도부 총회를 거쳐, 우리는 국제 사회에서 우리가 어떠한 방식으로 외교를 진행해야 하는지 그 미래를 깨달았습니다."

 GEH_diplomacy_isolationism_focus: "방어를 우선"
 GEH_diplomacy_isolationism_focus_desc: "확실하게 합시다. 우리는 뇌제의 길을 걷지 않을 것입니다. 침략전쟁은 게헨나의 올바른 미래가 아니며, 우리는 적들의 공격으로부터 조국을 방어할 방법을 찾을 것입니다."

 GEH_diplomacy_isolationism_focus_1: "동맹국 찾기"
 GEH_diplomacy_isolationism_focus_1_desc: "우리와 함께 집단안보체제를 구축할 동맹국을 찾습니다. ...적어도 한 나라 정도는 동의해 주겠죠."

 GEH_diplomacy_isolationism_focus_2: "방어선 구축"
 GEH_diplomacy_isolationism_focus_2_desc: "공격이 최선의 방어라고 하지만, 그 공격으로 인해 죽어갈 국민들의 생명은 어떻게 하나요? 국토 요새화가 더 올바른 길입니다."

 GEH_diplomacy_isolationism_focus_3: "평화의 조국 게헨나"
 GEH_diplomacy_isolationism_focus_3_desc: "우리는 지금 가진 것을 지켜나가는 것만으로도 충분합니다. 더 넓은 영토를 확장할 필요는 없습니다."

 GEH_diplomacy_managed_democracy_focus: "통제민주주의 확대"
 GEH_diplomacy_managed_democracy_focus_desc: "게헨나는 자유와 민주주의를 키보토스 전체로 전파해야만 하는 도덕적인 사명이 있습니다. 뭐 현실정치적으로 말하자면, 우리는 게헨나 전역을 손에 넣었으며, 키보토스와 서남부 유럽 전체에 위성국들을 세워 유럽을 우리의 영향권 안으로 포섭할 수 있을 것입니다."

 GEH_diplomacy_managed_democracy_focus_1: "유럽-키보토스 재민주화"
 GEH_diplomacy_managed_democracy_focus_1_desc: "우리는 키보토스의 많은 국가들이 권위주의적인 국가라는 거을 알고 있으며, 그들에게 자유와 정의를 가져다 줄 것입니다."

 GEH_diplomacy_realpolitik_focus: "팽창하는 게헨나"
 GEH_diplomacy_realpolitik_focus_desc: "게헨나는 더욱 넓어져야 합니다. 특히 동방의 위험한 적인 [SOV.GetName] 측은 우리의 질서를 유지하기 위하여... 파괴되어야만 하는 적입니다. 그들이 성장하게 내버려둔다면 언젠가 그들이 우리를 정복할 것입니다."

 GEH_diplomacy_realpolitik_focus_1: "동방으로의 진출"
 GEH_diplomacy_realpolitik_focus_1_desc: "동방의 거대한 곰 [SOV.GetName]은(는) 우리의 심각한 안보 위협이며 반드시 제거되어야만 합니다."

 GEH_diplomacy_find_collaborator: "협력자 찾기"
 GEH_diplomacy_find_collaborator_desc: "우리는 우리의 위대한 의지와 함께 할 협력자들을 찾을 수 있을 것입니다."

 GEH_diplomacy_european_hegemonic: "키보토스-유럽 패권"
 GEH_diplomacy_european_hegemonic_desc: "우리의 힘은 유럽과 키보토스 전체를 우뚝 서게 했습니다. 위대한 지도자 [ROOT.GetLeader] 만세!"

 GEH_diplomacy_crisis_in_kivotos_focus: "키보토스의 위기"
 GEH_diplomacy_crisis_in_kivotos_focus_desc: "우리는 사회의 질서를 수호하는 신성한 임무를 부여받았으며, [GEI.GetName]의 다가오는 위협으로부터 키보토스를 수호해야만 할 정의로운 임무가 있습니다."

 GEH_diplomacy_chroma_crisis_focus: "색채와의 대적"
 GEH_diplomacy_chroma_crisis_focus_desc: "이세계에서 온 정체불명의 적인 색채는 우리 시민들을 미치게 만드는 광기를 흩뿌리고 있습니다. 그들과 협상할 수 있는 방법은 없으며, 오로지 맞서 싸워야만 합니다."

 GEH_diplomacy_decagrammaton_crisis_focus: "데카그라마톤과의 대적"
 GEH_diplomacy_decagrammaton_crisis_focus_desc: "자칭 절대존재라는 그들은 우리의 당연한 적이며, 인류의 승리룰 위해 저 로봇들과 맞서 싸워야만 합니다."

 GEH_diplomacy_decagrammaton_alliance_focus: "데카그라마톤과의 연합"
 GEH_diplomacy_decagrammaton_alliance_focus_desc: "그들은 위험한 존재가 아닙니다. 더 높은 경지로 수행하는 수행자입니다. 저항하지 마십시오."

 ### 히나 탈주 루트 외교 ###

 GEH_three_congress_focus_no_hina_diplomacy: "제4차 [ROOT.GetAdjective] 총회"
 GEH_three_congress_focus_no_hina_diplomacy_desc: "전쟁, 분쟁, 정치적 혼란... 대전이 이후 우리에게는 많은 고통이 있었지만, 그럼에도 불구하고 [ROOT.GetLeader] 정부는 혼란을 수습하고 제4차 총회를 개최할 준비를 마쳤습니다. 새로운 총회에서는 내부 통합을 마친 우리의 대외 정책을 결정할 예정입니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_benelux: "저지대 통합"
 GEH_three_congress_focus_no_hina_diplomacy_attack_benelux_desc: "저지대는 무능력한 총학생회와 샬레의 대립으로 혼란을 겪었습니다. 그들 모두가 우리의 적입니다."

 GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux: "저지대 통치 존중"
 GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux_desc: "우리는 총학생회나 샬레가 저지대를 마음대로 통치하도록 내버려 둘 것입니다. 우리의 목표는 더 큰 곳에 있으며... 그들과의 전쟁으로 인해 국력을 낭비할 필요는 없습니다."

 #### 게헨나 예외주의
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first: "게헨나 예외주의"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_desc: "게헨나는 키보토스의 기존 질서에서 예외적인 국가이며, 키보토스 전체의 패권을 장악할 국력과 자격을 갖추고 있습니다."

 GEH_three_congress_focus_no_hina_diplomacy_central_europe_union: "미텔에우로파 전선"
 GEH_three_congress_focus_no_hina_diplomacy_central_europe_union_desc: "어느 국가도 홀로 설 수 없습니다. 위대한 게헨나의 건설을 위하여 우리는 가장 믿을 수 있는 국가들과 협력 전선을 구축할 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_millennium: "서부 키보토스 정복"
 GEH_three_congress_focus_no_hina_diplomacy_attack_millennium_desc: "밀레니엄 지역의 뛰어난 기술은 그녀들이 아닌 우리 게헨나를 위하여 사용되어야만 합니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_kaiser: "카이저의 영향력 일소"
 GEH_three_congress_focus_no_hina_diplomacy_attack_kaiser_desc: "카이저 코퍼레이션은 대전이 이전부터 키보토스 각지에서 수많은 범죄, 무법 행위를 지원했습니다. 그리고 그들 역시 키보토스를 정복하고자 하는 야망을 가지고 있습니다. 게헨나의 질서에 부합하지 않는 카이저와 [KAI.GetLedaer]의 야망은 이제 일소되어야만 합니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_south_kivotos: "남부 키보토스 정복" 
 GEH_three_congress_focus_no_hina_diplomacy_attack_south_kivotos_desc: "대전이 이후 게헨나 남부로 옮겨진 남부 키보토스 국가들은 우리에게 큰 위협이 되고 있습니다. 그들이 존재하지 않게 하는 것이 게헨나의 질서를 위한 길입니다."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_1: "우리의 규율 강제" 
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_1_desc: "우리는 대전이 이전부터 규율과 질서를 통해 올바른 게헨나 사회를 이룩하고자 했습니다. 우리의 점령지들에서도 같은 일을 할 것입니다. 그들이 원하든, 원하지 않든."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_2: "키보토스계가 하나로"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_2_desc: "대전이로 인한 혼란은 키보토스 국가들과 현지 국가들의 대립을 불러 일으켰습니다. 우리 키보토스가 하나의 거대한 질서 아래에 뭉치지 않는다면, 분열된 채로 패배하게 될 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_3: "모든 질서는 게헨나로 향한다"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_3_desc: "뇌제의 꿈은 이루어졌습니다. 게헨나는 키보토스 위에 우뚝 섰습니다. 모든 게헨나의 영웅들이 우리를 자랑스럽게 생각할 것입니다. [ROOT.GetName]의 영광과 [ROOT.GetLeader]의 승리가 우리 앞에 있습니다."

 #### 키보토스의 수호자
 GEH_three_congress_focus_no_hina_diplomacy_protection_of_freedom: "키보토스의 수호자"
 GEH_three_congress_focus_no_hina_diplomacy_protection_of_freedom_desc: "우리는 동방으로 나아가, 키보토스를 위협하는 사악한 동부 인류 국가들과 맞서 싸워야 합니다. 우리는 키보토스를 붉은 곰으로부터 지켜내는 강인한 방패가 될 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_claim_intermarium: "인터마리움 영유권 주장"
 GEH_three_congress_focus_no_hina_diplomacy_claim_intermarium_desc: "동부 유럽은 [SOV.GetName] 측의 공격을 방어하기 위해, 필연적으로 우리가 소유해야만 하는 안전지대입니다."

 GEH_three_congress_focus_no_hina_diplomacy_anti_bolshevism_declaration: "반볼셰비즘 선언"
 GEH_three_congress_focus_no_hina_diplomacy_anti_bolshevism_declaration_desc: "소위 마르크스-레닌주의라는 것은 붉은겨울의 체리노 서기장의 모형 콧수염보다도 못한 조잡한 이데올로기에 불과합니다. 자유로운 게헨나 질서의 전파를 위하여 우리는 모든 종류의 볼셰비즘에 단호히 맞서 싸울 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet: "신들의 황혼 작전"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_desc: "모스크바는 썩은 문과 같으며, 게헨나의 위대한 군대가 발로 차면 그대로 부서져 열릴 것입니다. 모든 전쟁 준비가 완료되었으며 우리는 게헨나의 영광을 위해 싸울 것입니다. 반드시 승리하리라!"

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1: "백군 지원자 모집"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1_desc: "폭압적인 [SOV.GetName]의 통치로부터 저항하는 현지 세력들과 접촉해, 우리는 동방에서의 활동에 이익을 얻을 수 있습니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2: "동계전 긴급 훈련"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2_desc: "[SOV.GetAdjective] 영토는 매우 춥고 척박하며, 동계전을 위한 장비와 특수 훈련을 통해 전장에서의 싸움에 대비해야만 합니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_3: "게헨나 동방 개척"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_3_desc: "새로 얻은 동부 영토는 적절한 관리를 거쳐 게헨나에 통합될 것입니다. 우리는 이 전쟁에서 승리하고 키보토스를 붉은 악몽으로부터 보호했습니다. 이 위대한 업적은 앞으로도 기억될 것입니다."

 #### 현실정치
 GEH_three_congress_focus_no_hina_diplomacy_realpolitik: "현실정치"
 GEH_three_congress_focus_no_hina_diplomacy_realpolitik_desc: "우리는 여러 동맹국들을 얻고, 중부유럽의 정치적, 군사적 패권을 장악할 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_alliance: "남키보토스 동맹"
 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_alliance_desc: "남키보토스는 가까운 거리를 가진 지역이며, 우리와 이해관계가 다소 일치합니다. 그들과 협력하는 것이 서로의 공동 번영을 이루어낼 수 있을 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_merge: "남키보토스 통합"
 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_merge_desc: "남키보토스는 우리의 잠재적인 적이 될 수 있으며, 그들이 우리를 공격하기 전에 우리가 먼저 그들을 공격할 필요가 있습니다."

 GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance: "발칸에 영향력 행사"
 GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance_desc: "발칸은 분열되어 있지만 강하며, 그들은 우리의 좋은 파트너가 될 수 있습니다."

 GEH_three_congress_focus_no_hina_diplomacy_balkans_merge: "발칸 정복"
 GEH_three_congress_focus_no_hina_diplomacy_balkans_merge_desc: "발칸은 분열되어 있기 때문에 각개격파할 수 있는 적이며, 우리의 확장 정책을 위하여 제거되어야만 합니다."

 GEH_three_congress_focus_no_hina_diplomacy_attack_italy: "알라리크 작전"
 GEH_three_congress_focus_no_hina_diplomacy_attack_italy_desc: "이탈리아는 대전이 이후에도 국체를 보존하는 데 성공하였지만, 그들의 행운은 이제 끝입니다. [ITA.GetLeader]의 권좌는 무너질 것이며, 우리는 로마에 게헨나의 깃발을 꽂을 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_union_south_kivotos: "남키보토스 해방 선언"
 GEH_three_congress_focus_no_hina_diplomacy_union_south_kivotos_desc: "이탈리아 식민제국의 붕괴는 우리가 남키보토스 전체의 패권을 완전히 얻게 되는 상징적인 사건이 되었습니다. 우리는 키보토스에 우뚝 선 강대국이 되었습니다."

 GEH_three_congress_focus_no_hina_diplomacy_soviet_peace: "[ROOT.GetAdjective]-[SOV.GetAdjective] 불가침조약"
 GEH_three_congress_focus_no_hina_diplomacy_soviet_peace_desc: "적어도 지금 당장은 우리으 칼끝은 남방을 향하고 있으며, [SOV.GetLeader] 측과 당장 대립각을 세우며 전선을 늘릴 필요는 없습니다. 그들과 일시적인 불가침 조약을 맺고 평화를 유지하는 편이 나을 것입니다."

 GEH_three_congress_focus_no_hina_diplomacy_soviet_military_exchange: "[SOV.GetAdjective] 기술교류협정"
 GEH_three_congress_focus_no_hina_diplomacy_soviet_military_exchange_desc: "서로의 차이에도 불구하고 [SOV.GetName]의 무기들은 매우 우수하며, 우리가 대전이 이후 지구에서 강력한 패권을 유지하는 데에 큰 도움이 될 것입니다."

