 ### Decisions ###
 GEH_walk_with_ako: "Private Vacation with Ako"
 GEH_walk_with_ako_desc: "Since the Planning Department has taken over many of the Head Prefect's duties, free vacations that would have been impossible back in Kivotos have become possible. Of course, we can't take vacations too often, but she won't refuse a proposal to go on a trip together."
 
 GEH_give_ako_present: "Provide Gift to Ako"
 GEH_give_ako_present_desc: "Even if it's not an expensive item, Ako will welcome the gift from the Head Prefect itself."
 
 GEH_visit_planning_department: "Visit the Planning Department"
 GEH_visit_planning_department_desc: "Are you going to handle paperwork alone in the stuffy Head Prefect's office? Wouldn't it be better to visit the Planning Department directly to meet Ako and handle paperwork together across from her desk?"
  
 GEH_pressure_on_planning_department: "Pressure the Planning Department"
 GEH_pressure_on_planning_department_desc: "I intend to not give Ako any time to visit the Head Prefect's office by dumping a lot of work on the Planning Department and engaging in a work slowdown. Ako is smart enough to understand what this behavior means."
 
 GEH_ako_denial: "Refuse Meeting with Ako"
 GEH_ako_denial_desc: "'Senior Administrator Ako Amau is prohibited from entering the Head Prefect's office for the time being.'"
 
 GEH_ako_berate: "Public Insult"
 GEH_ako_berate_desc: "Publicly criticize Ako's paperwork and document processing in front of other Prefect Team members. Of course, it's not because Hina hates Ako. It is to make other members perceive that 'the Head Prefect hates the Senior Administrator.'"

 GEH_discipline_system_category: "Discipline of [GEH.GetName]"

 geh_discipline_system_desc: "Even before the Great Transition, the §GGehenna Prefect Team§! was a security organization dedicated to protecting social order and maintaining public morals. Unlike the Pandemonium Society, we have succeeded in maintaining order in the German occupied territories and sustaining a §YControlled Society§! where a minority Kivotos-descendant population controls a majority German population.\n\nHowever, our §YOrder§! cannot be maintained without effort. Not only are there remnants of the §RWehrmacht§! whom the Executive Committee engages directly in the field, but various §RRat Organizations§! are also rampant in our cities. Nazi Party member organizations, the Helmet Gang, and even the Hot Springs Development Department—numerous §RRat Organizations§! disturb social order. It is the duty of our Gehenna Prefect Team to arrest them and §YMaintain Public Morals§!.\n\n§YCurrent Discipline§!: [?geh_discipline_var|1%%]\n\nCurrent effects of Discipline:\n Division Attack: [?geh_discipline_army_attack_factor|=+%2]\n Division Defense: [?geh_discipline_army_defence_factor|=+%2]\n Division Breakthrough: [?geh_discipline_breakthrough_factor|=+%2]"

 GEH_discipline_system_weak_discipline: "Weakening Morals"

 GEH_discipline_system_attack_nazi: "Attack Nazi Party Member Organizations"
 GEH_discipline_system_attack_nazi_desc: "The Wehrmacht and the Nazi Party were once similar subordinate institutions of the old Germany, but after losing their leadership in the Great Transition, they have been operating individually. Generally, Nazi Party organizations consist of civilians without military training, acting as gangs committing violent crimes against Kivotos-descendant populations such as beastmen or robots on the streets."
 
 GEH_discipline_system_attack_helmet: "Attack Helmet Gang Organizations"
 GEH_discipline_system_attack_helmet_desc: "The Helmet Gang is a common noun referring to criminal organizations that also existed in Kivotos. They were famous for putting helmets over their heads and shooting guns, and they are notorious for not stopping similar activities even after the Great Transition."

 GEH_discipline_system_attack_onsen: "Attack Hot Springs Development Department"
 GEH_discipline_system_attack_onsen_desc: "Not a shred of mercy is needed for these terrorists who are ready to blow up any public facility just to develop a hot spring."

 GEH_discipline_system_get_weapons: "Seize Nazi Handicraft Military Factories"
 GEH_discipline_system_get_weapons_desc: "We seize the handicraft factories created by Nazi Party organizations and continue to use them under our control. Using illegal underground facilities created by Nazis will be evaluated as immoral behavior by the Prefect Team members."

 GEH_discipline_system_boom_weapons: "Detonate Nazi Handicraft Military Factories"
 GEH_discipline_system_boom_weapons_desc: "We seize and thoroughly destroy the handicraft factories created by Nazi Party organizations."

 GEH_discipline_system_alliance_with_hitler: "Alliance with Hitler"
 GEH_discipline_system_alliance_with_hitler_desc: "Angela Hitler, an anti-Nazi and pro-Jewish capitalist, is famous among the public for two things—being a successful tobacco factory entrepreneur and being the older sister of the Nazi Party leader Adolf Hitler, who died during the Great Transition.\n\nHitler wants funds to operate the Judaica Dormitories to protect Jewish students from Aryan supremacists, and in exchange, we can receive material support for suppressing Nazi remnants within Gehenna."

 GEH_discipline_system_alliance_with_nyaomoto: "Contract with Nyaofood"
 GEH_discipline_system_alliance_with_nyaomoto_desc: "Nyaofood is not just a food company. They organize a kind of 'Helmet Gang Unit' as a private military unit to suppress forces that oppose them.\n\nA contract with Nyaofood is a service contract that allows us to operate these private company units. It would be an act that violates our cause of acting for the order of Gehenna, but compared to the local criminal organizations, isn't hiring petty criminals like the Helmet Gang a minor issue?"

 GEH_discipline_system_military_deployment: "Deploy Military"
 GEH_discipline_system_military_deployment_desc: "If minor protests are left alone, they will spread like a wildfire and put the entire academy in danger. We will deploy full-scale elite forces to forcibly disperse the protesters."
 decision_cost_pp_10_cp_5: "£pol_power  §Y10§! £command_power  §Y5§!"
 decision_cost_pp_10_cp_5_blocked: "£pol_power  §R10§! £command_power  §R5§!"

 GEH_discipline_system_militia_mobilization: "Mobilize Militia"
 GEH_discipline_system_militia_mobilization_desc: "If we organize those loyal to the cause of the Prefect Team and Executive Committee and mobilize them for security maintenance, we can solve all problems easily. We can find any number of devout residents filled with admiration for pure Kivotos culture and resentment toward the locals."

 geh_discipline_system_tt: "Our §YDiscipline§! changes by $RIGHT|+=1$"
 GEH_discipline_system_weak_discipline_tt: "\n§gIf the $GEH_first_congress_focus$ focus is completed, the amount of decreasing discipline is reduced by half (rounded up).§!"
 GEH_end_discipline: "Discipline will be fixed at the maximum value upon completing the $GEH_NEXT_Army_focus_1$ focus and will no longer decrease."

 GEH_military_power_category: "[ROOT.GetAdjective] Defense Policy"
 GEH_military_power_category_desc: "\n\n\n\n\n£GFX_GEH_military_power_prefect_team\n\n\n\n\n\n\n\n\nThe §GGehenna Prefect Team§! was a powerful organization capable of completely destroying the §YPandemonium Society§! on its own before the Great Transition, but a gap in national power has occurred due to the depletion of Mystery caused by the §YGreat Transition§! and the unpredictable influx of Germans.\n\nTo ensure we do not collapse before the flow of the era, we must utilize our assets to the maximum and continue to invest in §YNational Defense§! for the continued survival of [ROOT.GetAdjective]. The future of [ROOT.GetAdjective] will be determined by how we act.\n"

 GEH_military_power_52_factory: "Establish Military Factory in [52.GetName]"
 GEH_military_power_52_factory_desc: "Active investment in establishing new military factories will be an important asset for the upcoming war."

 GEH_military_power_53_factory: "Establish Military Factory in [53.GetName]"
 GEH_military_power_53_factory_desc: "$GEH_military_power_52_factory_desc$"

 GEH_military_power_54_factory: "Establish Military Factory in [54.GetName]"
 GEH_military_power_54_factory_desc: "$GEH_military_power_52_factory_desc$"
 GEH_military_power_52_steel_mill: "[52.GetName] Steel Mill Complex Established"
 GEH_military_power_52_steel_mill_desc: "In order to produce basic wartime resources, including munitions, we must inevitably invest our budget into the construction of new steel mills."

 GEH_military_power_53_steel_mill: "[53.GetName] Steel Mill Complex Established"
 GEH_military_power_53_steel_mill_desc: "$GEH_military_power_52_steel_mill_desc$"

 GEH_military_power_54_steel_mill: "[54.GetName] Steel Mill Complex Established"
 GEH_military_power_54_steel_mill_desc: "$GEH_military_power_52_steel_mill_desc$"

 GEH_military_power_prefect_team_tank_levelup: "Expansion of Prefect Team Tank Research Institute"
 GEH_military_power_prefect_team_tank_levelup_desc: "The Prefect Team's tank technology was clearly focused on light tanks for maintaining public order in Kivotos. Our armored capabilities are significantly lacking for use in total war in the post-Great Transfer world. This is why investment in research personnel is necessary to solve these problems."

 GEH_military_power_prefect_team_gun_levelup: "Expansion of Prefect Team Firearm Research Institute"
 GEH_military_power_prefect_team_gun_levelup_desc: "It is said that before the Great Transfer, Prefect Head Sorasaki Hina could face the entire Pandemonium Society alone. While it has become something of a legend now, the incident where Head Hina single-handedly stormed the Pandemonium Society building to protest their total cut of the Prefect Team's budget is all too famous.\n\nHowever, in an Earth where the power of Mystery does not exist following the Great Transfer, those of us from Kivotos have suffered a weakening of our power. Our Prefect Team Firearm Research Institute is working hard to produce Mystery Looms, but without continuous investment, they will not be able to perform properly."

 GEH_military_power_prefect_team_visit_world: "The Prefect Head's World Tour"
 GEH_military_power_prefect_team_visit_world_desc: "[GEH.GetName] is a small nation. It would be a good experience for Prefect Head [GEH.GetLeader] to visit advanced foreign nations and see how they prepare for war. To prepare for the unprecedented event of the Great Transfer, human nations—rather than Kivotos nations—have been chosen as visit destinations.\n\nThe options proposed by the Intelligence Department are Italy, Egypt, and Japan. Prefect Head [GEH.GetLeader] may visit any of these locations... provided there are no diplomatic issues, of course!"

 GEH_military_power_52_infrastructure: "[52.GetName] Road Infrastructure Maintenance"
 GEH_military_power_53_infrastructure: "[53.GetName] Road Infrastructure Maintenance"
 GEH_military_power_54_infrastructure: "[54.GetName] Road Infrastructure Maintenance"

 GEH_military_power_non_halo_reorganize: "Spiritual Halo Infantry Division"
 GEH_military_power_non_halo_reorganize_desc: "This plan is designed to make the Wehrmacht prisoners rotting in our jails serve Gehenna. We aren't actually going to give these Wehrmacht prisoners Halos or anything. Instead, we will give them 'moral education' to make them feel as if they possess the power of Halo infantry, then suit them up in armor and send them to the front lines.\n\nThey haven't actually grown Halos, but they are deployed to the front with the same tactical objectives as Halo infantry, and they'll be utilized in the same manner anyway—so can't we just call them 'Spiritual Halo Infantry'?\n\nNo? Honestly, how much more 'humane' treatment did you expect us to give to Nazis?"

 GEH_gehenna_cultural_revolution_category: "Revolutionary Arts Commission"
 GEH_gehenna_cultural_revolution_category_desc: "Until the §YHeavenly Revolution§!, §GGehenna§! was a space riddled with contradictions. The Academy promised students learning and growth, yet within it, disordered violence and corrupt power coexisted. All this decadence, chaos, and hypocritical order were the original sins that weighed down our great savior, §YSorasaki Hina§!, and caused her to leave our side.\n\nFollowing the revolution, Gehenna's culture must be rewritten from its very foundations. Everything from the past that the §YReactionaries§! advocated—the self-indulgent individualism of Kivotos, the stale romanticism of Deutschland—is a pollutant that must be §RPurified§!. We no longer seek fusion or harmony. Our §YFoundation§! is exclusively §YSorasakiism§!, and everything else is merely an antiquity of the old era to be destroyed.\n\nChaos and freedom of the past will no longer be tolerated. Art is not a pastime for individual satisfaction, but a sacred tool to implement the §1Will of the Revolution§! and praise the achievements of §GHead Hina§!. Under the §1Revolutionary Arts Commission§!, all creative activity will be a 'weapon' to burn down the old world and a 'prayer' to welcome the new world she will return to. This is the only way to establish Gehenna's true tradition and spread our ideology."
 GEH_gehenna_art_avant_upgrade_tt: "\nWhen choosing Avant-Garde Art:\n"
 GEH_gehenna_art_ultracon_upgrade_tt: "\nWhen choosing Ultra-Conservative Art:\n"

 GEH_gehenna_art_avant_garde_deconstruction: "Deconstructivist Architecture"
 GEH_gehenna_art_avant_garde_deconstruction_desc: "Buildings do not exist for function or comfort. They are manifestos to destroy existing notions of space. We will intentionally 'deconstruct' the structures of the old era and reassemble the debris illogically to create new forms that force discomfort and reflection upon everyone. Stability is merely a bourgeois illusion."

 GEH_gehenna_art_avant_garde_noise_music: "Revolutionary Noise Symphony"
 GEH_gehenna_art_avant_garde_noise_music_desc: "Harmony and melody are the opium that puts the masses to sleep. We will collect the mechanical noise of factories, distorted radio speeches, and the screams of 'Reactionaries' to compose a new symphony. This 'Revolutionary Noise' is the most honest music, paralyzing the listener's reason and forcing them to confront the fundamental pain of a world left behind by Hina's absence."

 GEH_gehenna_art_avant_garde_theater_of_cruelty: "Theater of Cruelty"
 GEH_gehenna_art_avant_garde_theater_of_cruelty_desc: "The audience is no longer a safe observer. Our theater will tear down the boundary between stage and seating; actors will directly accuse the audience members of being 'Reactionaries,' attacking their complacency. Narrative is destroyed, meaning is deconstructed, and only raw emotion and shock remain to lead the audience to a revolutionary awakening."

 GEH_gehenna_art_avant_garde_anti_art: "Anti-Art Manifesto"
 GEH_gehenna_art_avant_garde_anti_art_desc: "The act of painting on canvas or carving stone is a legacy of the past. True revolutionary art lies in destruction itself. We will burn down museums and proclaim the footage documenting the process as the 'Masterpieces of the Era.' The death of art is the greatest art."

 GEH_gehenna_art_avant_garde_automatic_writing: "Automatic Writing Poetry"
 GEH_gehenna_art_avant_garde_automatic_writing_desc: "Reason is a product of the old era. To receive Hina's true subconscious will, poets will discard all thought and pour out words exactly as their hands move. The 'cut-up' technique—cutting and randomly reassembling law books and philosophy texts of the old world—will also be encouraged. The resulting disordered sentences are the prophecies of the new era."

 GEH_gehenna_art_avant_garde_happening: "Zero Hour (0:00) Happening"
 GEH_gehenna_art_avant_garde_happening_desc: "To abolish individualism and achieve perfect collective unconsciousness, we will declare a 'Zero Hour' across the entire city without warning. For the hour the sirens wail, all citizens must stop what they are doing and hum a single note toward Hina's former office. This massive theater of the absurd is the pinnacle of the art we seek."

 GEH_gehenna_art_ultracon_monumentalism: "Neoclassical Monumental Architecture"
 GEH_gehenna_art_ultracon_monumentalism_desc: "We will abolish decadent modernist architecture and erect massive, monumental structures that symbolize the eternity and greatness of the state. All public buildings will be unified in the Neoclassical style, symbolizing order and authority, with a scale intended to overwhelm the viewer and instill awe for the nation."

 GEH_gehenna_art_ultracon_marches: "National Total War Marches"
 GEH_gehenna_art_ultracon_marches_desc: "All individualistic and decadent music, such as jazz and rock, is prohibited. State-authorized composers have the duty to compose only military marches and national songs that praise Hina's greatness, devotion to the motherland, and the sanctity of labor. Music is not for appreciation; it is a tool for mobilization."

 GEH_gehenna_art_ultracon_realism: "Heroic Realism Painting"
 GEH_gehenna_art_ultracon_realism_desc: "The sole purpose of art is to edify the people. All painters, under state guidance, must depict only the idealized image of the Leader Hina, robust students sweating for the motherland, and peasants rejoicing in a bountiful harvest. Abstract art and expressionism are defined as 'Reactionary Art' and will be incinerated immediately."

 GEH_gehenna_art_ultracon_epic_poem: "Compilation of the Gehenna National Epic"
 GEH_gehenna_art_ultracon_epic_poem_desc: "History must have only one correct story. The Commission will mobilize all the nation's literary capabilities to compile a single 'National Epic' spanning from the creation of Gehenna to Hina's martyrdom and the Great Revolution. All history books and literature other than this epic will be designated as forbidden texts."

 GEH_gehenna_art_ultracon_uniform: "Enactment of National Standard Dress"
 GEH_gehenna_art_ultracon_uniform_desc: "Diverse clothing that reveals individual taste is equivalent to revealing ideological impurity. To eradicate decadent individualism, all citizens must wear only the simple, unified 'National Standard Dress' established by the state in public places. Fashion is counter-revolutionary."

 GEH_gehenna_art_ultracon_mass_games: "Mass Games and Artistic Performances"
 GEH_gehenna_art_ultracon_mass_games_desc: "Individual artistic talent is meaningless. True beauty is manifested when a massive collective moves like a single organism. We will hold 'Mass Games' involving tens of thousands of students, creating spectacles that depict Hina's portrait and revolutionary slogans through card stunts. The individual is merely a single pixel for the glory of the whole."

 GEH_gehenna_art_category: "Gehenna Academy of Arts"
 GEH_gehenna_art_category_desc: "Until the §YGreat Transfer§!, §GGehenna§! was an Academy-State within an Academy-City. Gehenna's territory spread along the Gehenna autonomous districts, and Gehenna students and Kivotos citizens lived their lives centered around the Academy. The Academy was a natural part of us, and the nation of Gehenna was a place for learning new things and moving toward the future. Well, though calling it a 'school' might be a bit of a stretch given students skipped classes without even submitting absence notices.\n\nAfter the Great Transfer, Gehenna's culture is rapidly changing. However, unlike the §YPandemonium Society§!, who lost their identity while cozying up to the §YWehrmacht§! for power, we have not forgotten that our §YFoundation§! is an Academy-State. Here on Earth, and not Kivotos, Gehenna's traditions must continue.\n\nWe can no longer go around shooting guns in the streets like we did in Kivotos. But Gehenna's unique trait—§GFreedom and Chaos§!—can serve as an inspiration for artists. Under the §GOrder of the Prefect Team§!, the formerly chaotic 'Freedom and Chaos' will be sublimated and preserved not as violence, but as 'Art.' This is the way to protect Gehenna's traditions and history as an Academy-State while utilizing our strengths.\n"

 GEH_gehenna_art_music_munich_conservatory: "Sponsorship of the National Academy of Music"
 GEH_gehenna_art_music_munich_conservatory_desc: "The National Academy of Music (Staatliche Akademie der Tonkunst) is a traditional German academy founded in 1846, where many students learn music and produce amazing compositional results. While the meaning of 'National' shifted from Deutschland to Gehenna after the 'Great Transfer,' it remains the most prestigious music university in all of Germany.\n\nIf [ROOT.GetLeader] sponsors the professors of the Music Academy, we can create wonderful new pieces for both Germans and Gehennans."

 GEH_gehenna_art_music_concert: "Music Concert Tour"
 GEH_gehenna_art_music_concert_desc: "Gehenna's rock music has not yet gained high popularity among the general German public, but it is nonetheless passionately loved by the Kivotos-descended population. A new concert will be a joyful event for our citizens."

 GEH_gehenna_art_music_jazz: "Jazz for Deutschland"
 GEH_gehenna_art_music_jazz_desc: "The Nazi regime in Germany banned jazz, labeling it 'decadent' music, and expelled jazz musicians. It is only regrettable they never realized until the end whether it was the melodies of music that truly harmed social order, or themselves. While jazz is a legacy of the past for the Kivotos population of Gehenna, it is attractive modern music for the locals who make up a large portion of the population. Holding jazz concerts will serve as welfare for many Germans."

 GEH_gehenna_art_gehenna_music_make: "Request for 'Gehenna Fantasia'"
 GEH_gehenna_art_gehenna_music_make_desc: "It is quite embarrassing that the song representing Gehenna is 'Hymn of the Great Pandemonium' recorded by Hanuma Makoto. 'The Invincible, Super-Mighty Ironclad Toramaru'... Good grief. Eak-tai Ahn, a disciple of the legendary composer Richard Strauss, is staying in Gehenna and continuing his musical activities. With sufficient budget support, he will be able to create new music that truly represents Gehenna for us."

 GEH_gehenna_art_gehenna_music_new_military_song: "Establishing the Gehenna Military Anthem"
 GEH_gehenna_art_gehenna_music_new_military_song_desc: "Unlike the pre-Transfer days when we were merely an Academy-State, we must now learn the 'way of survival on Earth' through a military that incorporates locals while maintaining Academy traditions. We need a new and rational military anthem, with a melody that can satisfy both Germans and Gehennans. Carl Orff, a veteran of the 'Great War' of 1914 and a strict conservative composer active in Munich, will receive the commission for this grand new anthem."

 GEH_gehenna_art_music_serenade: "Gehenna Special Party"
 GEH_gehenna_art_music_serenade_desc: "We will host a party inviting not only Gehenna Academy figures but also business leaders and various other important internal and external figures of Gehenna. The highlight of this party will be Sorasaki Hina appearing in a dress to personally perform a recital."

 GEH_gehenna_art_bauhaus: "Sponsorship of the Staatliches Bauhaus"
 GEH_gehenna_art_bauhaus_desc: "The Staatliches Bauhaus was Germany's finest architectural school, suffering the pain of forced closure after the Nazi regime took power in 1933. It has been rebuilt as part of Gehenna Academy after we cleared Nazi influence from Bavaria. The Bauhaus is the heart of modernist architecture; supporting it will help genius architects like Director Ludwig Mies have a major impact on Gehenna's construction industry."

 GEH_gehenna_art_urban_aesthetic_project: "Urban Redevelopment Project"
 GEH_gehenna_art_urban_aesthetic_project_desc: "We will attend to the dilapidated areas of Gehenna and reorganize the urban districts."

 GEH_gehenna_art_efficient_factory: "Efficient Military Factories"
 GEH_gehenna_art_efficient_factory_desc: "Architects advise that Gehenna's industrial facilities have relatively inefficient structures. By reducing movement paths and improving the transportation network connecting factories and markets, we can further develop our industrial facilities."

 GEH_gehenna_art_reconstruction_of_headquartersy: "Reconstruction of Prefect Team Headquarters"
 GEH_gehenna_art_reconstruction_of_headquartersy_desc: "The brilliant professor of architecture, Mies van der Rohe, was tasked with designing the reconstruction of our Prefect Team Headquarters following the reunification of Gehenna. Mies focused on two points for the new headquarters. First is efficiency: minimizing movement paths between departments and ensuring energy requirements for heating and cooling are kept to a minimum. Second is external beauty: Mies argues that modernist buildings with minimal ornamentation can still possess aesthetic beauty and the dignity befitting the office of a head of state."

 GEH_gehenna_art_reconstruction_of_pandemonium_society: "Pandemonium Society Remodeling"
 GEH_gehenna_art_reconstruction_of_pandemonium_society_desc: "To downgrade the excessively large and flashy Pandemonium Society after the reunification of Gehenna, the brilliant architectural professor Mies van der Rohe decided to seize the entire facility and remodel it into a library for citizens. Although many bullet holes remain in the headquarters and the Chairman's office from the engagement between the Prefect Team and the Pandemonium Society, our experts say they know how to cleanly erase these traces.\n\nIn preparation for the Pandemonium Society remaining downgraded, Mies agreed to repurpose the old, dilapidated school building behind the main headquarters as the building for the Pandemonium Chairman. It is small and old, but with all authority transferred to the Prefect Team, it shouldn't be much of a problem."

 GEH_gehenna_art_pool: "Private Swimming Pool for Hina"
 GEH_gehenna_art_pool_desc: "There is an absurd rumor that Head Sorasaki Hina doesn't know how to swim—that is, she sinks immediately upon entering the water! Um, that's a truly ridiculous rumor, right? ...Right? For the day she can swim gracefully in front of others without a tube, she requested the construction of a small private pool. ...It is rare for her, who usually has no hobbies and doesn't act for her own benefit. Perhaps she almost drowned after slipping in the bathtub once."

 GEH_gehenna_art_hot_spring: "Hinnom Hot Springs Project"
 GEH_gehenna_art_hot_spring_desc: "The Hot Springs Development Department usually just blasts away at places that don't even look like they'd have hot springs, but we know that sulfur springs already existed in the 'Hinnom Mountains' behind the Central District of Gehenna Academy. Just as the sandstorms of Abydos's desert were transferred and temporarily messed up Bavaria, the natural hot springs of the Hinnom Mountains have also been transferred to the Central District.\n\nWe may consider redeveloping these hot springs more sophisticatedly."

 GEH_gehenna_art_munich_academys: "Sponsorship of the Munich Academy of Fine Arts"
 GEH_gehenna_art_munich_academys_desc: "The Munich Academy of Fine Arts (Akademie der Bildenden Künste München) is a great German art university founded in 1770 that continues to this day. Over its centuries of history, countless artists have been, are being, and will be born here. Sponsoring this university is fitting to show our government's interest in art."

 GEH_gehenna_art_exhibition: "Degenerate Art Exhibition"
 GEH_gehenna_art_exhibition_desc: "The past Nazi regime mocked all artworks that did not fit their regulations as 'Degenerate Art.' Sponsoring an exhibition of such 'degenerate' art will allow Gehenna to embrace diverse cultural freedoms and help wipe out Nazi influence in Deutschland."

 GEH_gehenna_art_propaganda: "Production of Gehenna Promotional Comics"
 GEH_gehenna_art_propaganda_desc: "It is unthinkable for comics not to be included in the category of art. To produce propaganda-style comics to promote Gehenna Academy, we will provide state funding to various comic artists."

 GEH_gehenna_art_hina_propaganda: "Production of Sorasaki Hina Biography Comics"
 GEH_gehenna_art_hina_propaganda_desc: "We can create promotional materials regarding what Sorasaki Hina achieved and what criminal investigations she conducted prior to the Great Transfer. One might call this 'propaganda,' but it's not like we're going to put false information in it, right?"

 GEH_gehenna_art_ibuki_university: "Ibuki's Artistic Education"
 GEH_gehenna_art_ibuki_university_desc: "Tanga Ibuki wants to be an artist. That might actually be for the better. It would be good for Gehenna's politics to ensure she stays cooped up in an art museum rather than the Pandemonium Society even after she grows up. She is dangerously popular in Gehenna while being more interested in things other than politics. Ibuki will leave the political scene to receive education to become a painter."

 GEH_gehenna_art_headquartersy: "Decorating the Prefect Team Headquarters"
 GEH_gehenna_art_headquartersy_desc: "We will gather artists to hang internal paintings to add to the dignity of the Prefect Team Headquarters and create a special space to preserve the portraits of past Prefect Heads. This internal decoration process is not mere luxury, but a task to demonstrate the success of our Prefect Team to the public."

 GEH_hina_art_disciplined_expressionism: "Disciplined Expressionism"
 GEH_hina_art_disciplined_expressionism_desc: "\"Chaos didn't just give birth to destruction. Within the right framework, it can become the most powerful driving force for creation.\"\n\nThe success of 'The Woman of Iron Skin' didn't just end with the hit of a single play. It was the signal flare marking the start of a new artistic movement. Inspired by Hina's work, Gehenna's artists have begun new attempts to explode Gehenna's unique identity of 'Freedom and Chaos' not through disordered violence, but within a strict beauty of form.\n\nThis new movement does not deny passionate emotions or raw energy, but instead sublimates them artistically by containing them within a well-structured form like the Prefect Team's 'Order.' Music with intense but refined melodies, paintings with chaotic compositions that achieve perfect balance, and plays with tragic narratives executed without a single error. Gehenna's art now goes beyond simple entertainment, containing a philosophy of controlling chaos and creating beauty within order. This is truly the greatest fruit borne of Gehenna and Bavarian culture."

 GEH_hina_art_new_figuration: "Neo-Gehenna Figuration"
 GEH_hina_art_new_figuration_desc: "\"The truth of this world is like the sound of gunfire hidden within a beautiful landscape. Art must capture both.\"\n\nSorasaki Hina's self-confessional play posed a new question to the Gehenna art world: 'How shall we capture our reality?' If the first generation after the Transfer expressed chaos and shock directly, their successors have now begun to create a new art that captures both Gehenna's chaos and Bavaria's tranquility on a single canvas. 'Neo-Gehenna Figuration' was born this way.\n\nThe painters of this movement boldly depict the scars of the Great Transfer atop Bavaria's beautiful natural landscapes. Torn tank tracks float upon tranquil lakes, and black marks from shellfire are stark against the snowy peaks of the Alps. Borrowing the coarse brushwork and intense colors of German Expressionism, they express without reservation the collision of two contradictory worlds: 'Violence,' which was the daily life of Gehenna, and 'Romance,' the tradition of Bavaria. One art critic noted, 'Their canvases are filled with silent screams.' This new art is our identity, and the most honest self-portrait of an era that bloomed amidst turmoil."

 GEH_gehenna_legitimacy_category: "Gehenna's Legitimacy"
 GEH_gehenna_legitimacy_category_desc: "Due to the ongoing conflict between the Prefect Team and the Pandemonium Society even after the §YGreat Transfer§!, we are facing a legitimacy issue regarding where the §YCenter of Gehenna§! lies. If we show ourselves to be trustworthy not just to Gehenna students but also to the citizens, we can increase our legitimacy.\n"

 GEH_gehenna_legitimacy_up: "Increase Legitimacy"
 GEH_gehenna_legitimacy_up_desc: "The increase in the Prefect Team's policing experience has led us to gain deeper trust from the people of Gehenna."

 GEH_ako_democratic_system_category: "[ROOT.GetAdjective] Planning Bureau Council"
 GEH_ako_democratic_system_category_desc: "\nThe [ROOT.GetName] government is rapidly transforming from a traditional Academy-State system into a general state run by technocrats. The biggest change is the introduction of a §Ylimited democracy§! within the government. The §GCouncil§! is our indirectly elected legislature, chosen by votes from Planning Bureau members, and since Head §YSorasaki Hina§! still holds full power, it serves primarily as an §Yadvisory body§!.\n\nIt is impossible for us to expand Council voting rights to the general public. Those from Kivotos are a minority ethnic group in Deutschland following the Transfer, and introducing direct elections would mean handing Gehenna over to the Germans who elected the Nazis through democratic voting. Thus, the Council is operated as a §CManaged Democracy§! system where technocrats monopolize seats, with the exception of receiving a small number of §Youtside observers§!.\n\nUnder our managed democracy system, the Council will receive public evaluations as either §GLocals' Dogs§!, §YNeutral Mediators§!, or §OGehenna's Leaders§!. The Council's perspective will influence the final focus tree after the §Y4th General Assembly§!, and if Head Hina leaves the cabinet for any reason, hatred toward the locals will seize the Council and the §Rbalance will collapse§!."

 GEH_ako_democratic_system_meeting_with_SPD: "Strengthening Contact with the SPD"
 GEH_ako_democratic_system_meeting_with_SPD_desc: "The Social Democratic Party of Germany (SPD) holds no political power within [ROOT.GetName], but at the local level, they still play a role in contacting workers and conveying their demands to our government. Since the SPD is the only local party that recognizes our government's right to rule, it is well worth increasing contact with them for friendly relations with the workers."

 GEH_ako_democratic_system_meeting_with_capitalists: "Participating in Kivotos-Affiliated Social Parties"
 GEH_ako_democratic_system_meeting_with_capitalists_desc: "Kivotos-descended demi-humans, robots, capitalists, and commoners have become more united as they were pushed into being a minority after the Transfer, striving to maintain their own identity separate from the Germans. [ROOT.GetLeader]'s participation in Kivotos-affiliated social parties will bring us the unity that was fragmented after the Transfer."

 GEH_ako_democratic_system_constitution: "Enacting the Gehenna Constitution"
 GEH_ako_democratic_system_constitution_desc: "As we have become the unified leader of Gehenna, we can go a step further and enact a constitution for the Federal Republic."

 GEH_ako_democratic_system_constitution_human_right: "§GConstitutional Spirit§!: Emphasis on Universal Human Rights"
 GEH_ako_democratic_system_constitution_human_right_desc: "Emphasizes 'the human rights of all people' as a vital value of our constitution. The point that no one should suffer unjust discrimination due to gender, race, sexual orientation, disability, ethnicity, or religion will be emphasized as a spirit of the constitution."

 GEH_ako_democratic_system_constitution_esperanto: "§GConstitutional Spirit§!: Guaranteeing the Status of Esperanto"
 GEH_ako_democratic_system_constitution_esperanto_desc: "Emphasizes 'communication with all human nations' as a vital value of our constitution. Registering Esperanto (the international language of Earth) as one of Gehenna's standard languages in the constitution and requiring all laws to be registered in Esperanto serves as a token of our respect for human civilization and its history."

 GEH_ako_democratic_system_constitution_worker: "§GConstitutional Spirit§!: Labor Rights"
 GEH_ako_democratic_system_constitution_worker_desc: "Emphasizes 'workers' rights' as a vital value of our constitution. This specifically accepts the claims of the local party, the SPD; since the overwhelming majority of workers are locals rather than Kivotos-descended, supporting advanced labor laws at the constitutional level carries great significance."

 GEH_ako_democratic_system_constitution_state_capitalism: "§OConstitutional Spirit§!: State Capitalism"
 GEH_ako_democratic_system_constitution_state_capitalism_desc: "Emphasizes 'state capitalism' as a vital value of our constitution. The entire economy must be controlled by the government under the lead of [ROOT.GetLeader] and loyal technocrats. A special capitalist system where the state controls the market will be emphasized as the constitutional spirit."

 GEH_ako_democratic_system_constitution_internationalism: "§OConstitutional Spirit§!: Inter-Academy Solidarity"
 GEH_ako_democratic_system_constitution_internationalism_desc: "Emphasizes 'inter-academy solidarity' as a vital value of our constitution. The point that we must survive on Earth through solidarity with all Kivotos nations—not just Gehenna, but Trinity, Millennium, Shanhaijing, Red Winter, and others—will be emphasized as the constitutional spirit."

 GEH_ako_democratic_system_constitution_leader_principle: "§OConstitutional Spirit§!: Führerprinzip"
 GEH_ako_democratic_system_constitution_leader_principle_desc: "Emphasizes 'infinite loyalty to Chairman Hina' as a vital value of our constitution. While our constitution already guarantees infinite power to Council Chairman Sorasaki Hina, this goes beyond mere power guarantees to codify that all public officials, state organizations, and laws exist to fulfill 'Sorasaki Hina's will' and must follow it.\n\nSorasaki Hina will be emphasized as a symbol of freedom and order who can defend managed democracy against various enemies ranging from right-wing fascists like the Nazis to left-wing fascists like Stalinists, making it only natural for the state to move in unison according to her will."

 GEH_ako_democratic_system_constitution_feminism: "§YConstitutional Spirit§!: Feminism"
 GEH_ako_democratic_system_constitution_feminism_desc: "Emphasizes 'feminism' as a vital value of our constitution. This is both a support for Kivotos civilization and tradition—which is a civilization centered around women with Halos—and simultaneously something that local German feminists have dreamed of. Since it is a regulation agreed upon by both Kivotos-descended and local progressives, while being opposed by both Halo-less Kivotos demi-humans/robots and local conservatives... this will be the most 'neutral' constitutional spirit."

 GEH_ako_democratic_system_law_jewish_protection: "Jewish Protection Act"
 GEH_ako_democratic_system_law_jewish_protection_desc: "From the time Hitler's regime took power in Germany in 1933 until its collapse in 1935, Jewish people suffered great infringements on their property rights. The new law supports compensation for Jews if they can prove their private businesses or land were seized by the Nazis. The budget for this will be borne by the taxes of the Germans who elected Hitler."

 GEH_ako_democratic_system_law_dissolution_of_prussia: "Dissolution of the Free State of Prussia"
 GEH_ako_democratic_system_law_dissolution_of_prussia_desc: "The Free State of Prussia, which was the largest and most powerful in the Weimar Republic, is merely an unnecessary existence for our Gehenna Federation. We respect the federalism and local autonomy of the Weimar Republic, but leaving such an oversized state unchecked—especially when its territorial heart occupies all of Trinity—is dangerous. Prussia will be dissolved and divided into smaller states, including the Free State of Brandenburg."

 GEH_ako_democratic_system_law_nationalization_of_resources_act: "Resource Nationalization Act"
 GEH_ako_democratic_system_law_nationalization_of_resources_act_desc: "The nature of Deutschland—its forests, lakes, and rivers—must be used for Gehenna. We gain the authority to seize undeveloped land where appropriate resources are believed to exist as state-owned land. Resources that can be confiscated under our laws refer only to natural resources owned by Germans; 'artificial resources' such as synthetic rubber produced by capitalists who migrated from Kivotos are not subject to confiscation. This law will thoroughly confiscate the land of the Junkers who survived the Transfer and permanently exclude their power."

 GEH_ako_democratic_system_law_proportional_representation: "Proportional Representation for Local Councils"
 GEH_ako_democratic_system_law_proportional_representation_desc: "Due to our managed democracy, Germans cannot participate in central politics, but they still have local councils where they can exercise their autonomy. Reducing the number of seats under the single-member constituency system, which is favored for the Kivotos-descended, and introducing proportional representation seats will allow Germans to exercise more of their rights in local councils."

 GEH_ako_democratic_system_law_wage_control: "Wage Control Act"
 GEH_ako_democratic_system_law_wage_control_desc: "To maintain the dual state systems of managed democracy and state capitalism, it is also important not to lose the support of the masses. The Wage Control Act allows the state to intervene in businesses where wages are judged to be excessively low and directly support workers by 'negotiating' their wages."

 GEH_ako_democratic_system_law_special_punishment_act_on_economic_crimes: "Special Punishment Act on Economic Crimes"
 GEH_ako_democratic_system_law_special_punishment_act_on_economic_crimes_desc: "Through cooperation with the SPD, we will establish a special economic investigation team to investigate capitalists who commit tax evasion, wage theft, or enter into unfair labor contracts, and enact a 'Special Punishment Act' that increases fine amounts in proportion to the assets held by capitalists. Gehenna's order and rule of law must apply equally to economic crimes as well as violent ones."

 GEH_ako_democratic_system_law_public_security_act: "Public Security Maintenance Act"
 GEH_ako_democratic_system_law_public_security_act_desc: "This law, which suppresses the political activities of communists who threaten Gehenna's national order, surprisingly receives strong support from the SPD. Communists and Social Democrats were in conflict throughout the Weimar Republic, and the Social Democrats hope that the communists—whom they loathe as much as the Nazi Party—will never be seen in Gehenna again."

 GEH_hina_corruption_category: "Throne of Baal"
 GEH_hina_corruption_thought_cabinet_advanced_race_theory: "§OThought Cabinet§!: Advanced Race Theory"
 GEH_hina_corruption_thought_cabinet_advanced_race_theory_desc: "Can these locals, who lack Halos and show not even a sliver of Mystery or Sublimity, truly be called the same kind of intelligent beings? At least the demi-humans and robots of Kivotos don't pretend to be human. These creatures are just clumsily imitating humans, aren't they? It's sickening. Truly."

 GEH_hina_corruption_thought_cabinet_bringing_of_the_law: "§OThought Cabinet§!: Bringer of the Law"
 GEH_hina_corruption_thought_cabinet_bringing_of_the_law_desc: "I am the bringer of Gehenna's law and its order. Those who do not follow that order are effectively denying me. Just as it is self-defense to face an enemy attacking me, wouldn't special interrogation methods, including torture, also be a kind of... self-defense? They were the ones who attacked me first."

 GEH_hina_corruption_thought_cabinet_cop_of_the_apocalypse: "§OThought Cabinet§!: Cop of the Apocalypse"
 GEH_hina_corruption_thought_cabinet_cop_of_the_apocalypse_desc: "Shouldn't human civilization be eradicated? Their very existence is exerting a negative influence on Gehenna and Kivotos. Like poison spreading in a glass, it's slowly... seeping in. That sin."

 GEH_hina_corruption_thought_cabinet_finger_on_the_eject_button: "§GThought Cabinet§!: Finger on the Eject Button"
 GEH_hina_corruption_thought_cabinet_finger_on_the_eject_button_desc: "Even if these damn thoughts try to control me... it's no use. Right. I'd rather blow my own head off. It's not because I like the locals, Baal. It's my will *not* to become a puppet ruled by your existence, you who claim to be my split personality."

 GEH_hina_corruption_thought_cabinet_derealization: "§GThought Cabinet§!: Derealization"
 GEH_hina_corruption_thought_cabinet_derealization_desc: "Everything in the world feels unreal and distant. No, it actually is. This place is Kivotos while simultaneously not being Kivotos. Kivotos is merely parasitic on this planet called 'Earth.' ...The very act of trying to uniformly apply the common sense and knowledge of Kivotos to this world is arrogance, and merely a false command spun by Baal."

 GEH_hina_corruption_thought_cabinet_rigorous_self_critique: "§GThought Cabinet§!: Rigorous Self-Critique"
 GEH_hina_corruption_thought_cabinet_rigorous_self_critique_desc: "Your rank was Prefect Head. It's a past rank, and now I've become an adult, and well... I'll be called by the rank of Chairman now. But the fact that you were 'Prefect Head' doesn't change, does it? Sorasaki Hina. Calm down. You're just a student representative maintaining the school's order; you have no right to weigh the lives of others. So. Let's give the middle finger to this damn Baal and push those thoughts away. Please."

 GEH_hina_corruption_meeting_with_perfect_team: "Private Meeting with Prefect Team Officers"
 GEH_hina_corruption_meeting_with_perfect_team_desc: "Baal is a bastard. Actually, I don't really like using profanity... but that woman is a bastard. Despite being my split personality, she's trying to ruin me, and planting cynical and contemptuous thoughts not just about the Germans but about the Prefect Team as well.\n\nWhether the locals all die or not, I don't even want to discuss those damn things. But the Prefect Team is different. I don't want to hate Ako, Iori, and Chinatsu. Those three see me as Sorasaki Hina, unlike the fanatics who hang my picture on the wall and bow to it. If I can spend time with them... I might be able to endure a little longer. I want to believe that."

 GEH_hina_corruption_meeting_with_zealot: "Meeting with Prefect Team Fanatics"
 GEH_hina_corruption_meeting_with_zealot_desc: "Fanatics are fools who blabber that 'without the Great Head Hina, there is no Gehenna.' If there's a good point to meeting those fanatics who were thrown into the trash bin known as the Order Department... it's realizing that the Gehenna Prefect Team isn't the perfect organization I thought it was.\n\nAnd if there's another good thing, is it that my head burns with hatred when I continue 'conversations' with them? Why is that good? Because I can be honest with my emotions. I feel like I am becoming myself."

 GEH_hina_corruption_law_civil_surveillance_act: "Civil Surveillance Act"
 GEH_hina_corruption_law_civil_surveillance_act_desc: "To protect Gehenna's peace and order, some freedom may have to be infringed. While we may not have a perfect futuristic surveillance organization like Millennium, we will install CCTV in every alley, street, road, public institution, and school to catch potential criminals. No matter the cost."

 GEH_hina_corruption_law_violence_act: "Authorization of Forced Reformation"
 GEH_hina_corruption_law_violence_act_desc: "To catch potential criminals who may be involved with the Nazis or other anti-government organizations, the use of force in interrogating arrested suspects will be authorized. Well, if they feel it's unfair, they shouldn't have committed a crime."

 GEH_hina_corruption_law_special_religious_tax: "Special Religious Tax"
 GEH_hina_corruption_law_special_religious_tax_desc: "Since Catholics and Protestants are hostile toward the Kivotos-descended who transferred here, it is necessary to reduce their influence. The population registered as having faith will pay a heavy poll tax. There will be no way to avoid it."

 GEH_hina_corruption_law_no_zealot_law: "Weakening the Order Department's Peacetime Armament"
 GEH_hina_corruption_law_no_zealot_law_desc: "The Order Department is a paramilitary organization separate from the Executive Department, causing division within Gehenna. And I cannot tolerate the violence and crimes they commit in my name. Lightening the Order Department's peacetime armament will prevent the evils they commit against Gehenna citizens and may also achieve harmony within the Gehenna Prefect Team.\n\nIt's better to get along than to fight."

 GEH_hina_corruption_law_sophisticated_judicial_system: "Respect for Local Judicial System"
 GEH_hina_corruption_law_sophisticated_judicial_system_desc: "In Gehenna before the Transfer, the Prefect Team was the law. There were no trials; criminals were thrown into the Gehenna Prefect Team's underground dungeon according to my orders. Well, the rule was to send serious criminals to the Valkyrie Corrective Bureau... but the fact remains that there were no criminal trials.\n\nBut here, it would be better not to do that. I will order respect for the local judicial system and the three-tier trial system, following it even if it is a time-consuming and annoying process."

 GEH_hina_corruption_law_esperanto: "Esperanto Education"
 GEH_hina_corruption_law_esperanto_desc: "To learn the locals' culture and for more efficient communication between ethnicities with different languages, I plan to include the 'international language' of humanity, Esperanto, in the regular curriculum to teach everyone. The effect won't appear immediately in this generation, but the next generation will understand each other a little better."

