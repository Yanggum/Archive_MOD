 GEH_artist_advisor_tt: "\n§g게헨나 선도부는 §!§Y예술가§!§g 특성을 가진 조언가를 고용할 경우, 게헨나의 예술적 개혁과 관련된 특수한 결정을 얻습니다.§!"

 GEH_ako_route_ending_tt: "§g아코 루트의 엔딩이 펼쳐집니다. 아코와 히나의 이야기는 이렇게 끝을 맺지만, 이 세계에서 두 사람은 앞으로도 멋진 이야기들을 만들어 나갈 수 있을 것입니다. 미래를 향해, 게헨나 선도부의 두 친우는 함께 나아갑니다.\n\n게헨나 선도부를 위해 만들어진 모든 컨텐츠를 즐겨 주셔서 감사합니다. 플레이 해 주신 여러분들이 없었다면 불가능했을 것입니다. 감사합니다!§!\n\n"
 GEH_no_hina_ending_tt: "§g히나 탈주 루트의 엔딩이 펼쳐집니다. 다음 번에는 소라사키 히나가 선도부장직을 내던지지 않게 만들어 주세요!\n\n여기까지의 이야기는 모드를 플레이 해 주신 여러분들이 없었다면 불가능했을 것입니다. 감사합니다!§!\n\n"
 GEH_hina_route_ending_1_tt: "§g히나 루트의 엔딩이 펼쳐집니다. 소라사키 히나의 원본 인격은 다른 인격에게 굴복하고 소멸했습니다. 도이칠란트는 이제 대지 위의 지옥으로 변했습니다. 하지만, 그 힌놈의 밑바닥, 게헨나의 불기둥 속에서도 사람들은 살아갑니다. 내일을 맞이하기 위하여.\n\n게헨나 선도부를 위해 만들어진 모든 컨텐츠를 즐겨 주셔서 감사합니다. 플레이 해 주신 여러분들이 없었다면 불가능했을 것입니다. 감사합니다!§!\n\n"
 GEH_hina_route_ending_2_tt: "§g히나 루트의 엔딩이 펼쳐집니다. 소라사키 히나는 내면의 악함을 극복하고, 자신의 나약함까지 안은 채 미래로 나아가기로 했습니다. 게헨나의 현재는 깊은 어둠 속에 잠겨 있지만 내일은 더 좋은 날이 올 것입니다. 적어도 아코는 그렇게 믿고 있습니다.\n\n게헨나 선도부를 위해 만들어진 모든 컨텐츠를 즐겨 주셔서 감사합니다. 플레이 해 주신 여러분들이 없었다면 불가능했을 것입니다. 감사합니다!§!\n\n"
 GEH_hina_route_ending_3_tt: "§g히나 루트의 엔딩이 펼쳐집니다. 소라사키 히나는 언젠가 아코와 함께 이 세상에서 '사라질' 날을 기다리고 있습니다. 방아쇠는 언젠가 당겨질 것이고 피아노의 선율도 멈추는 날이 올 것입니다. 하지만, 적어도 그 날이 오늘은 아닐 것입니다.\n\n게헨나 선도부를 위해 만들어진 모든 컨텐츠를 즐겨 주셔서 감사합니다. 플레이 해 주신 여러분들이 없었다면 불가능했을 것입니다. 감사합니다!§!\n\n"

 TRM_auto_conference_1_division_tt: "다음 주는 게헨나 전체의 합동 조약기구인 '에덴 관리기구'의 위임통치령으로 인정될 것입니다:\n§Y[5.GetName]§!, §Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[86.GetName]§!, §Y[188.GetName]§!, §Y[762.GetName]§!, §Y[763.GetName]§!, §Y[807.GetName]§! .\n\n"

 GEH_managed_democracy_union_tt: "우리의 위성국들을 §Y통제민주주의 협력국§!으로 지정합니다. 새롭게 위성국이 되는 국가에도 적용됩니다."
 GEH_if_faction_leader_tt: "만약 §Y[ROOT.GetNameDef]§!이(가) 세력 지도국이라면:"

 GEH_hina_corruption_text_tt: "§g게헨나의 밑바닥, 힌놈의 계곡에서 여전히 지옥은 불타오르고 있습니다. §R바알의 신비§!는 [GEH_hina_corruption_loc] ([?GEH_hina_corruption_var]) 상태입니다.§!"
 GEH_hina_corruption_text_tt_delayed: "§Y참고§!:§g소라사키 히나의 정신적 상태에 따라 §Y제4차 선도부 총회§!에서의 중점 계통도가 변화합니다. 제4차 선도부 총회를 완료한 시점에서 정신적 상태를 §G호전§!시키거나 더 이상 §R악화§!시키는 것은 불가능합니다.§!"
 GEH_hina_corruption_numerical_limit_tt: "히나의 타락 상태가 §Y-5§!에서 §Y5§! 사이여야만 합니다."

 GEH_hina_corruption_hina_frame_text_tt: "§g소라사키 히나의 양심은 타락을 거부하고자 합니다. 히나는 선도부원들과의 관계로 인간성을 유지하려고 시도할 수 있습니다. 아니면 정신이 완전히 무너지기 전에 §G제4차 선도부 총회§!를 마무리짓는 것도 다른 대안이 될 수 있습니다.\n\n히나의 정신적인 상태는 세 단계로 나뉩니다. §Y굶주림§!, §O충만함§!, §R각성함§!. 제4차 총회에서 소라사키 히나가 스스로를 유지하기 위해서는 각성함 상태가 되지 않도록 히나의 정신적 상태를 유지해야 합니다. §R물론 그러지 않는다고 해서, 손해가 오는 것은 아닙니다.§!§!"
 GEH_hina_corruption_hina_frame_text_tt_delayed: "§g우리가 주를 의지하여 우리 대적을 누르고 우리를 치려 일어나는 자를 주의 이름으로 밟으리이다\n나는 내 활을 의지하지 아니할 것이라 내 칼도 나를 구원치 못하리이다\n오직 주께서 우리를 우리 대적에게서 구원하시고 우리를 미워하는 자로 수치를 당케 하셨나이다\n\n시 44:5-7§!"
 GEH_hina_corruption_ako_frame_text_tt: "§g바알은 힘과 지속적인 협상을 제안하고 있습니다. 히나가 자신의 내면 속 바알과 협상하고 힘을 받아들이는 것으로 대게헨나국은 영구적인 §G보상§!을 얻을 수 있습니다.\n\n물론 그 보상이 그저 주어지는 것은 아닙니다. 보상이 주어질 때마다 히나의 타락은 가속화되며, 인간성을 유지하는 것은 어려워집니다. §R하지만 그게 무엇이 대수겠습니까?§!§!"
 GEH_hina_corruption_ako_frame_text_tt_delayed: "§g너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라\n근신하라 깨어라 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니\n너희는 믿음을 굳게 하여 저를 대적하라 이는 세상에 있는 너희 형제들도 동일한 고난을 당하는 줄을 앎이니라\n\n베 5:7-9§!"

