 GEH_richard_strauss: "리하르트 슈트라우스"
 GEH_hertha_gordon: "헤르타 고르돈"
 GEH_therese_junkers: "테레제 융커스"

 GEH_prefect_team_maritime_police_desc: "§g대전이 이후 도이칠란트 지역의 강과 호수를 관리하기 위하여 선도부 해양경찰이 설립되었습니다. 하지만 대전이 이전 선도부는 해양경찰 활동에 능숙하지 않았으며, 바다에서의 범죄는 보통 발키리 경찰학원 해양경찰의 몫이었습니다. 그 탓에 선도부 해양경찰은 실력 면에서 '미숙하다'는 평가를 받고 있습니다.§!"
 GEH_prefect_team_honor_guard_desc: "§g의장대는 선도부 시설을 방문하는 귀빈들을 맞이하는 조직입니다. 과거 '뇌제' 시기에는 여러 인사들을 맞이하는 중요한 기관이었지만, 하누마 마코토 의장 시기에는 의전 활동을 독점하려는 마코토의 욕심으로 인해 다소 유명무실한 조직이 되었습니다.§!"
 GEH_swimsuit_hina_desc: "§g자, 잠깐. 아코, 나는 네가 생각하는 것 같은 완벽 초인이 아니야. 수영 같은 건 할 줄 모르고... 아니, 진짜로, 겸손 부리는 게 아니라... 잠깐! 제발, 타임! 타임!! 캑! (꼬르르륵)§!"
 GEH_piet_mondrian_desc: "§g도이칠란트의 명문 건축대학인 바우하우스의 교수인 몬드리안은 디자인 분야와 추상화 계열에서 큰 영향을 주었습니다. 몬드리안은 철저하게 게헨나의 건축 양식과 그 예술에만 관심을 보이기 때문에 현지인들이 정치에 깊숙하게 관여하는 것을 꺼려하는 선도부 임원들의 성향에 맞으며, 비교적 '안전한' 인물로 분류되었습니다.§!"
 GEH_karl_schmidt_rottluff_desc: "§g카를 슈미트-로들루프는 도이칠란트 바이에른 지방을 대표하는 표현주의 화가입니다. 고전적 미술 양식과 맞지 않는 그의 미술은 히틀러 정권에 의해 '퇴폐적 미술'로 간주되어 탄압받아 왔습니다. 슈미트-로들루프는 게헨나 선도부의 영향권 안에서 학생들에게 자신의 표현주의 미술을 가르치는 것에만 관심이 있습니다. 그의 비정치적인 성향은 현지인들이 정치에 깊숙하게 관여하는 것을 꺼려하는 선도부 임원들의 성향에 맞으며, 비교적 '안전한' 인물로 분류되었습니다.§!"
 GEH_richard_strauss_desc: "§g뛰어난 작곡가인 리하르트 슈트라우스는 비록 국가사회주의 도이칠란트 정권 아래에서 강한 반정부 활동을 하지는 않았지만, 키보토스인들로 이루어진 새로운 정권에도 우호적인 편입니다. 뛰어난 독일 낭만주의 작곡가인 슈트라우스는 게헨나의 음악을 자신의 예술 세계에 접목한 새로운 클래식 음악 작곡에 관심이 많습니다. 그의 비정치적인 성향은 현지인들이 정치에 깊숙하게 관여하는 것을 꺼려하는 선도부 임원들의 성향에 맞으며, 비교적 '안전한' 인물로 분류되었습니다.§!"
 GEH_dkzh_idea_desc: "§g일단 아코는 히나에 대한 감정은 단순한 충성심일 뿐 연모는 아니라고 주장합니다. '선도부장의 개'라는 목줄을 던져 놓고 시시덕거리는 선도부원들은 (가끔은 선도부의 임원들도) 그렇게 생각하지 않는 것 같지만요. 물론 아코가 히나에게 품고 있는 감정이 무엇이든 그녀가 유능하며 열정적인 선임행정관이라는 것을 부정하는 사람은 없습니다.§!"
 GEH_dldhfl_idea_desc: "§g무모한 성격과 무계획성 때문에 이오리의 능력을 저평가하는 사람들도 많지만, 시로미 이오리는 강한 정의감을 가진 돌격대장입니다. 선도부의 영역권에서 일어나는 크고 작은 범죄 사건을 해결하기 위해 제일 먼저 현장에 나서는 것은 그녀일 것입니다.§!"
 GEH_chinatsu_idea_desc: "§g선도부에서 가장 의학에 정통한 임원을 뽑는다면 누구라도 치나츠를 고를 것입니다. 비록 원리원칙적인 성격 때문에 융통성이 부족하다는 일반 선도부원들의 불평을 사기도 하지만, 그녀는 가장 상식적이고 가장 많은 사람들이 납득할 수 있는 합리적인 해결책을 가져올 것입니다.§!"
 GEH_prefect_team_spy_desc: "§g선도부 내부의 여러 부서 중 정보부는 분명 가장 유명한 조직일 것입니다. 비록 그것이 정보부라는 조직이 뛰어나기 때문이 아니라, 그 소라사키 히나가 정보부 출신이라는 점 때문에 유명해진 것이라고 하더라도요.§!"
 GEH_ann_fudou_desc: "§g부동산 관리 중개부 출신의 후도 안은 뛰어난 경제적 재능과 함께, 대전이 이전 리쿠하치마 아루에게 하자 투성이 부동산 매물을 팔아치우려다 실패하고 얻어맞은 놀라운 경력을 가지고 있습니다. 그다지 도덕적이라 할 수 없는 인물이지만, 게헨나에게 필요한 경제 인재이기도 합니다.§!"
 GEH_nyaomoto_kan_desc: "§g환상을 팔아 돈을 버는 게헨나의 식료품 사업체 '냐오모토 푸드'의 CEO. 만드는 음식의 질에는 의문점이 있지만, 적어도 주리가 만드는 게헨나 급양부 식사보다는 규격 있고 좋은 품질의 요리를 대접합니다.§!"
 GEH_owner_of_suzume_desc: "§g게헨나의 유명 식당인 참새정은 게헨나의 시민들로부터 높은 지지를 얻고 있습니다. 비록 대기업인 냐오모토 푸드가 납품하는 식재료를 거부하는 탓에 업계에서 '찍힌' 상태이기는 하지만요.§!"

# 정신건강 컨텐츠
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK: "굳세어라"
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_desc: "소라사키 히나는 게헨나의 선도부장이며 대중적으로는 강인한 지도자이자 초인으로 알려져 있습니다. 하지만 소라사키 히나에게, 초인이라는 말은 스스로에게 맞지 않다고 여길 것입니다.\n\n아니, 정말 그럴까요? 누가 뭐라하더라도 소라사키 히나는 이제 분명한 초인이자 위대한 선도부장이며 공포의 통치자이자 게헨나 선도부의 '제1대전제'입니다. 이러한 소라사키 히나는 누가 보더라도 강인한 초인입니다.\n\n§O선도부장은 이제 영원히 통치할 것입니다.§!\n\n§O게헨나의 위대한 지도자§!가 길을 창조해 걸어가고 있습니다."
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_mission: "제관의 무게"

 GEH_basking_in_the_brilliance_of_their_serenade: "마지막으로 남아있는 것"
 GEH_basking_in_the_brilliance_of_their_serenade_desc: "소라사키 히나는 게헨나의 선도부장이며 대중적으로는 강인한 지도자이자 초인으로 알려져 있습니다. 하지만 소라사키 히나에게, 초인이라는 말은 스스로에게 맞지 않다고 여길 것입니다.\n\n소라사키 히나는 위대한 선도부장도, 공포의 통치자도 아닙니다. 그저 하나의 여린 인간이자 위태로운 심리 상태를 지닌 학생입니다. 그러나 소라사키 히나는 스스로 초인이 되기로 마음먹었습니다. 자신을 따르는 수많은 선도부원과 게헨나 학생들. 그리고 임원들의 믿음 위에 소라사키 히나는 두 발로 걸어 나왔습니다.\n\n§p초인이 되는 방법은 무엇이 있을까요?§!\n\n[GEH_basking_in_the_brilliance_of_their_serenade_text_tt]"

 GEH_basking_in_the_brilliance_of_their_serenade_text_0: "한 소녀는 현재 [GEH_basking_in_the_brilliance_of_their_serenade_loc_1_tt] 모습으로 천천히 §g앞으로§! 걸어 나갑니다.[GEH_basking_in_the_brilliance_of_their_serenade_loc_tt_desc]\n\n게헨나에는 아직 통치자가 필요합니다.\n선도부장이 §S무너진§! 상황은 절대로 일어나서는 안 됩니다."
 GEH_basking_in_the_brilliance_of_their_serenade_text_1: "소녀는 결국 길 위에서 §S무너진§! 모습입니다.\n\n§S결국 금은 퍼져나가 깨졌습니다.§! 선도부의 건물이 어두워집니다."

 GEH_basking_in_the_brilliance_of_their_serenade_loc_0: "§G평온한§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_1: "§g안정적인§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_2: "§Y긴장한§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_3: "§O냉혹한§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_4: "§t위태로운§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_5: "§R비틀거리는§!"

 GEH_basking_in_the_brilliance_of_their_serenade_loc_0_desc: "\n§G선도부의 새벽이 밝았습니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_1_desc: "\n§g흐려진 선도부장의 권위가 바로 섰습니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_2_desc: "\n§Y강인한 선도부장의 모습입니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_3_desc: "\n§O침묵이 게헨나와 선도부를 감돕니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_4_desc: "\n§t유리 잔이 기울어지고 있습니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_5_desc: "\n§R금이 갔습니다.§!"

 GEH_basking_in_the_brilliance_of_their_serenade_mission: "악화"
 GEH_basking_in_the_brilliance_of_their_serenade_trigger_tt: "§R우리는 아직 무슨 수를 쓰더라도 길을 걸어가는 것을 끝낼 수 없습니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_trigger_tt: "§R이제는 무슨 수를 쓰더라도 길을 걸어가는 것을 끝낼 수 없습니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_tt: "§R소라사키 히나의 상태가 한 단계 악화됩니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_return_tt: "§C소라사키 히나의 상태가 한 단계 완화됩니다.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_slow_tt: "§G소라사키 히나의 악화 속도가 느려집니다.§!\n"
 GEH_basking_in_the_brilliance_of_their_serenade_mission_Lslow_tt: "§C소라사키 히나의 악화 속도가 크게 느려집니다.§!\n"


 GEH_basking_in_the_brilliance_of_their_serenade_decision: "선도부의 지원"
 GEH_basking_in_the_brilliance_of_their_serenade_decision_tt: "§R이 결정은 단 한번 수행할 수 있습니다.§!\n\n§G소라사키 히나의 상태가 처음으로 회복됩니다.§!\n§R그러나 단 악화 속도가 빨라집니다.§!\n"

 GEH_hina_ako_root_start_tt: "§g소라사키 히나의 아마우 아코를 향한 태도, 그리고 관계성을 표현하기 위한 특수한 권력의 균형이 등장합니다. 아마우 아코의 개혁 마지막 중점인 §Y민중을 수호하는 검§!이나, §Y제3차 선도부 총회§! 중점이 완료되었을 때 권력의 균형이 향하는 방향에 따라 아코와 히나의 이야기가 결정될 것입니다.\n\n...어느 선택이든, 히나는 아코에 대한 태도를 확실히 정해야만 합니다.§! §R애매모호한 태도는 아마우 아코의 이야기를 가장 끔찍한 방향으로 악화시킬 것입니다.§!"

 GEH_BTBOTS.1.t: "피로의 누적"
 GEH_BTBOTS.1.desc: "소라사키 히나는 대전이 이후 수 많은 선도부원들과 그들이 통치하는 게헨나 학원 영토들의 집무를 이어가고 있습니다. 소라사키 히나의 결정을 기다리는 학생들이 많고, 아직 승인하지 못한 서류가 많이 남아있습니다.\n\n소라사키 히나는 오늘도 진한 에스프레소를 마시며 새로운 하루를 시작합니다. 아직은 해야 할 일이 많으니까요.\n\n오늘도 게헨나의 학생들과 독일 시민들 간의 충돌을 다루는 문서에 서명하고 선도부의 대응 방안을 지시하며 언제나와 같은 일상을 이어나가고 있습니다.\n\n앞으로도 영원히 끝나지 않을 것만 같은 일상을요."
 GEH_BTBOTS.1.a: "\"아코. 커피 좀 더 진하게 타줘.\""

 GEH_BTBOTS.2.t: "유리잔"
 GEH_BTBOTS.2.desc: "언제나처럼 선도부의 임원들이 모여 회의를 진행하고 있습니다. 평소와 같이 소라사키 히나의 차가운 눈빛 아래, 임원들의 열띤 논쟁이 끊임없이 이어지는 회의가 벌어집니다. 일반 선도부원들은 이번 회의에서 나온 내용을 그대로 따를 것이 분명하기에, 소라사키 히나는 그 책임감을 묵묵히 이어가고 있습니다.\n\n며칠 전과 다름없는 장면이 눈앞에서 펼쳐집니다. 시로미 이오리의 격분한 목소리와 아마우 아코의 놀리는 듯 비꼬는 말투, 그리고 그 모습을 불안하게 지켜보는 히노미야 치나츠의 모습이 선도부장의 보랏빛 눈동자에 고스란히 비칩니다.\n\n소라사키 히나는, 언제나처럼 그들을 중재… 중재해야만 했습니다. 아니요. 그러나 그러지 못했습니다. 자신이 손에 든 유리잔에 힘이 들어가는 것을 눈치채지 못한 찰나, 유리잔은 산산조각나 버렸습니다. 그러자 두 사람의 다툼은 순식간에 멈춰섰습니다.\n\n선도부 회의실의 공기가 무겁게 내려앉습니다."
 GEH_BTBOTS.2.a: "\"...계속해. 미안.\""

 GEH_BTBOTS.3.t: "무기력증"
 GEH_BTBOTS.3.desc: "소라사키 히나는 어스름한 새벽, 피곤에 지친 몸을 이끌고 겨우 눈을 떴다. 아무 것도 하고 싶지 않은 기분에 온몸이 무겁게 누르더라도, 이미 학원 전역에 퍼진 서류들과 결정을 기다리는 학생들의 목소리가 머릿속을 채우고 있었다.\n\n몇 분간 침대에 누워 허공을 바라보다가, 그녀는 마지못해 몸을 일으켰다. 주방으로 향하는 발걸음은 한없이 느렸고, 손에 쥔 진한 에스프레소 잔의 쓴맛은 잠시나마 현실을 잊게 해주려는 듯했다. 그러나 창밖으로 스며드는 희미한 빛과 복도 끝에서 들려오는 동료들의 조용한 속삭임은, 오늘 하루의 무거운 집무가 곧 시작됨을 알리고 있었다.\n\n그렇게 소라사키 히나는 회의실로 향하는 복도를 걸었다. 문틈 사이로 비치는 아침 햇살 아래, 회의실 안에 모여 있는 임원들의 침묵과 기대가 그녀를 맞이했다. 한숨을 깊게 내쉰 채, 그녀는 문을 열고 안으로 들어섰다.\n\n오늘 아침, 아무 것도 하고 싶지 않았던 그 기분은 억지로 덮어둔 채, 소라사키 히나는 해야 할 일들의 무게를 다시금 받아들였다. 서류 더미와 결정의 순간들이 그녀를 기다리고 있었다는 사실만이, 그녀를 회의실 안으로 이끌었다."
 GEH_BTBOTS.3.a: "\"하루가 또 시작됐네.\""

 GEH_BTBOTS.4.t: "에스프레소 한 잔"
 GEH_BTBOTS.4.desc: "저녁, 희미하게 깜빡이는 형광등 아래, 소라사키 히나는 집무실 한켠에 홀로 앉아 있었다. 하루 종일 이어진 집무와 서류 작업 속에서, 그녀는 진한 에스프레소 잔을 거듭 마신 결과, 몸 안에 치솟는 카페인의 부작용을 고스란히 느끼고 있었다.\n\n그녀의 얼굴은 평소의 냉철한 모습 대신 창백함과 피로로 얼룩졌고, 손끝은 미세하게 떨리며 심장은 불규칙하게 두근거렸다. 마치 과도한 카페인으로 인해 모든 감각이 과민해진 듯, 주변의 서류와 모니터 화면이 한없이 왜곡되어 보였다. 고요한 집무실의 정적 속에서, 그녀의 떨리는 손과 빠르게 뛰는 심장 소리가 오히려 그 공간을 더욱 음산하게 만들었다.\n\n이 고독한 밤, 소라사키 히나는 스스로에게 묵묵히 다짐했다. 아무리 고된 집무와 책임감이 그녀를 짓누르더라도, 지금의 증세를 극복하고 내일을 맞이해야 한다는 사실을. 그러나 그 증세는 이미 앞으로의 집무 수행에 치명적인 부담으로 작용할 조짐을 보이고 있었다."
 GEH_BTBOTS.4.a: "\"아직은, 그럴 수 없어.\""

 GEH_BTBOTS.5.t: "유리 파편처럼"
 GEH_BTBOTS.5.desc: "저녁의 어둠이 깊어질 무렵, 소라사키 히나는 집무실의 고요함을 뒤로하고 개인의 공간으로 발길을 돌렸다. 과도한 에스프레소 섭취로 인해 이미 치솟은 심박수와 떨리는 손끝, 그리고 감당하기 힘든 피로가 내면 깊숙이 파고들며, 평소 단호했던 외면은 점차 균열을 드러내기 시작했다.\n\n홀로 있는 집안에서 그녀의 눈빛은 어느 순간 공허와 분노로 물들었고, 서재 한켠에 놓인 유리 액자는 한때 소중했던 기억을 담은 채, 이제는 그녀에게 잔인한 현실의 상징처럼 다가왔다. 억눌린 고독과 무거운 책임감이 한순간에 폭발하면서, 소라사키 히나는 주저 없이 그 액자를 힘껏 집어던졌다. 깨진 유리 조각들이 공중에서 반짝이다 차가운 바닥에 쏟아지며, 집안은 순식간에 파편과 함께 잔혹한 침묵 속에 잠식되었다.\n\n이 한 순간의 분노와 절망은, 그녀가 감추고자 했던 모든 고통과 부담을 그대로 드러내었으며, 주변의 모든 것이 잠시나마 무너져 내리는 듯한 공허한 공기가 방을 가득 채웠다."
 GEH_BTBOTS.5.a: "소녀는 잠시나마 해방감을 느꼈다."

 GEH_BTBOTS.6.t: "첫 본심"
 GEH_BTBOTS.6.desc: "저녁, 집무실 한켠에서 소라사키 히나는 히노미야 치나츠의 세심한 도움을 받으며 카페인 중독 증세의 치료를 시작했다. 과도한 에스프레소 섭취로 인해 빠르게 뛰던 심장과 떨리는 손끝이 서서히 안정되기 시작하는 가운데, 치나츠의 차분한 처치와 의료 장비의 지원이 그녀에게 조금씩 평온을 되찾게 해주었다.\n\n그녀는 잠시 혼자였던 고독 속에서, 잃어버렸던 초심과 선도부장으로서의 자부심이 서서히 되살아나는 것을 느꼈다. 그러던 중, 임원들이 모인 회의실로 발걸음을 옮기며, 지금껏 감추어왔던 내면의 고통과 두려움을 조심스레 드러냈다. 말없이 서로의 눈빛과 미묘한 몸짓으로 전해지는 위로와 격려 속에서, 소라사키 히나는 자신이 겪은 고단함과 무거운 책임감을 솔직하게 토로하며 마음의 짐을 조금이나마 내려놓았다.\n\n임원들의 따스한 반응과 진심 어린 시선은, 그녀에게 다시 한 번 앞으로 나아갈 힘을 불어넣어 주었다. 그 순간, 치나츠의 도움으로 시작된 치료와 동료들의 위로는, 잃어버린 초심을 되찾게 하는 소중한 계기가 되어, 소라사키 히나의 내면에 다시 한 번 확고한 결의와 희망을 불러일으켰다."
 GEH_BTBOTS.6.a: "그러나 다음 날이 되자 현실이 무겁게 짓눌렀다."

 GEH_BTBOTS.7.t: "무너진 카드 탑"
 GEH_BTBOTS.7.desc: "늦은 밤, 회의실의 불빛이 하나 둘 꺼져갈 무렵, 소라사키 히나는 집무실 구석에서 깊은 한숨과 함께 마지막 결단을 내렸다. 하루 종일 쌓였던 서류와 지켜내야 할 수많은 결정들, 그리고 치나츠의 세심한 도움마저도 더는 버틸 수 없는 무거운 책임감으로 다가왔다. 그 무게에 짓눌린 그녀의 내면에서는, 더 이상 견딜 수 없는 고통과 좌절이 소리 없이 쌓여 갔다.\n\n결국, 그녀는 한 장의 사표를 작성한 후, 아무런 예고 없이 그 자리를 떠났다. 사표가 놓인 책상 위엔, 한때 강인했던 리더의 흔적이 고스란히 남아 있었다. 임원들이 모여 있는 회의실에서는, 그녀의 부재가 곧바로 감지되었고, 남은 이들은 당혹감과 깊은 슬픔에 잠겼다.\n\n소라사키 히나의 행방은 그날 밤 이후로 전혀 알려지지 않았고, 게헨나 학원 안에는 그녀가 남긴 마지막 항의와 같은 무거운 공허감만이 잔존했다. 그녀의 사표는 단순한 이탈의 표시가 아니라, 너무나도 버거웠던 책임과 고통 앞에 한 인간이 내린 비극적인 선택임이, 그 자리에 남은 이들만이 묵묵히 받아들일 수밖에 없었다."
 GEH_BTBOTS.7.a: "\"미안해. 모두.\""
 GEH_BTBOTS_END_tt: "§Y$GEH_three_congress_focus_no_hina$§! 중점이 자동으로 진행될 것입니다."

 GEH_BTBOTS.100.t: "결심, 구겨진 종이"
 GEH_BTBOTS.100.desc: "밤은 깊었고, 집무실의 창밖에는 희미한 불빛들만이 도시를 비추고 있었다. 며칠 동안 이어진 고민과 갈등 속에서, 소라사키 히나는 마침내 마지막 결정을 내릴 시간이 되었음을 직감했다.\n\n책상 위에는 아직 제출하지 않은 사표가 놓여 있었다. 몇 시간 전만 해도 그것이 유일한 선택이라고 생각했지만, 지금 그녀의 손끝은 조금도 그 종이를 향하지 않았다.\n\n무너져 내릴 것 같았던 자신. 끝없는 업무와 책임감에 짓눌려 도망치고 싶었던 나날들. 하지만 그녀가 떠난다면, 누가 이 학원을 지킬 것인가?\n\n천천히 숨을 고르며, 그녀는 일어나 창가로 다가갔다. 어둠 속에서도 꺼지지 않는 불빛들, 그곳에 있을 학생들과 동료들의 얼굴이 떠올랐다. 그들이 그녀에게 바라는 것은 한순간의 휴식이 아니라, 흔들리지 않는 지도자의 모습이었다.\n\n그 순간, 깊은 혼란 속에서도 하나의 확신이 그녀를 사로잡았다.\n\n소라사키 히나는 손을 뻗어, 사표를 천천히 구겨버렸다. 그리고 다시 한 번, 학원과 동료들을 위해 나아가기로 결심했다.\n\n문틈 너머에서 들려오는 익숙한 발걸음 소리에 그녀는 조용히 몸을 돌렸다. 이제, 더 이상 흔들리지 않을 것이다."
 GEH_BTBOTS.100.a: "\"내가 이끌어야만 해.\""

 GEH_BTBOTS.101.t: "한계를 넘어서"
 GEH_BTBOTS.101.desc: "집무실의 불빛은 여전히 꺼지지 않았다.\n\n소라사키 히나는 밤새도록 서류에 묻혀 있었다. 시계는 새벽 4시를 가리키고 있었고, 며칠째 이어진 업무로 인해 그녀의 몸은 극도로 쇠약해져 있었다. 몇 시간 전, 눈을 감았을 때는 단 몇 분간이라도 쉴 수 있을 거라 생각했다. 그러나 현실은 그녀를 가만히 내버려 두지 않았다.\n\n서류가 계속 쌓여갔다. 학원 내에서 발생한 학생들의 충돌 사건 보고서, 독일 당국과의 협상 자료, 그리고 선도부가 처리해야 할 수많은 행정 문서들이 눈앞에 가득했다. 몇 시간 안에 결정을 내려야 하는 사안들뿐이었다.\n\n그러나 그녀의 머리는 점점 무거워졌고, 몸은 둔해졌다. 단순한 피로가 아니었다. 눈앞의 글자가 흐릿하게 일그러졌고, 손끝이 저려왔다. 집중하려 할수록 의식은 멀어지고, 생각을 정리하는 것조차 힘들어졌다.\n\n그때, 책상 한편에 놓인 작은 유리병이 눈에 들어왔다.\n\n선도부의 임원들 모르게 가져다 둔. 각성제, 메스암페타민. 독일군과 정치인들이 피로를 잊고 업무에 몰두하기 위해 사용했던 '기적의 약'.\n\n그녀는 망설였다.\n\n하지만 그 순간, 문틈 너머에서 들려오는 발소리가 그녀를 긴장하게 만들었다. 누군가가 선도부장으로서의 결정을 기다리고 있었다. 그들은 자신이 흔들리는 모습을 보지 않을 것이다.\n\n손을 뻗었다. 뚜껑을 열고, 한 알을 꺼냈다. 깊은 한숨을 내쉰 후, 물 없이 그대로 삼켰다.\n\n몇 초 후, 온몸을 짓누르던 피로가 희미하게 사라지기 시작했다. 심장이 빠르게 뛰었고, 머릿속이 맑아졌다. 집중력이 되살아났다.\n\n소라사키 히나는 다시 펜을 들고 서류를 집어 들었다. 손끝의 미세한 떨림이 이제는 이상할 것이 없었다."
 GEH_BTBOTS.101.a: "\"아직, 할 일이 많아.\""

 GEH_iori_story_event.1.t: "국가 조화"
 GEH_iori_story_event.1.desc: "만마전은 사라졌다. 하지만 게헨나에 진정한 평화가 찾아온 것일까. 늦은 밤, 선도부장 집무실의 불은 꺼지지 않았다. 소라사키 히나는 산더미처럼 쌓인 서류 더미 속에서 펜을 든 채 미동도 하지 않았다. 이오리가 주도한 '전쟁부'와 '체제적 군사화'는 분명 만마전을 무너뜨리는 데 성공했다. 그러나 승리의 대가는 혹독했다. 전시체제 아래 억눌렸던 문제들이 둑 터진 강물처럼 밀려오고 있었다. 독일인들의 끊임없는 청원서, 군율에 대한 학생들의 누적된 불만, 총성이 멎은 거리의 어색하고 무거운 침묵.\n\n\"부장님, 또 밤을 새우시는 겁니까.\"\n\n어느새 다가온 히노미야 치나츠가 걱정스러운 목소리로 따뜻한 차를 건넸다. 그녀의 눈에는 히나의 건강에 대한 염려가 가득했다.\n\n\"최근 의료부에 정신적 압박감을 호소하는 부원들이 늘고 있습니다. 승리했지만... 모두가 지쳐있는 것 같습니다. 부장님 또한 마찬가지고요.\"\n\n\"...괜찮아, 치나츠. 잠시 생각할 게 있어서.\"\n\n히나는 찻잔을 받아들었지만 시선은 창밖의 어두운 도시를 향해 있었다. 이오리의 방식은 분명 효과적이었다. 하지만 그 끝에 남은 것은 공포로 다스려지는 불안한 질서뿐이었다. 히나는 그 공기를 누구보다 무겁게 느끼고 있었다.\n\n\"우리가 게헨나를 이렇게 만든 건… 학원을 지키기 위해서였어. 하지만 그 과정에서 너무 많은 것을 간과했지. 힘만으로는 모든 것을 다스릴 수 없어. 특히 우리와 다른 배경을 가진 이들을 힘으로만 누르려 하면, 그들은 결국 우리에게 등을 돌리게 될 거야. 그건 우리가 원하는 게 아니잖아.\"\n\n이 모든 것은 자신의 책임이기도 했다. 이오리의 급진적인 군국주의를 용인하고, 심지어 동조하며 지금의 게헨나를 만든 것은 바로 자신이었으니까.\n\n\"나는... 속죄해야 해. 우리가 망가뜨린 것들을 바로잡고, 진정한 의미의 '조화'를 이뤄내야만 해. 게헨나의 학생들과... 그리고 우리와 함께할 독일인들 모두를 위해서.\"\n\n히나는 마침내 결심한 듯 자리에서 일어났다. 그녀의 눈빛은 그 어느 때보다 단호했다. 전쟁을 지휘하던 군인이 아닌, 국가의 미래를 책임져야 하는 통치자의 눈빛이었다."
 GEH_iori_story_event.1.a: "\"정치라는게 이렇게 복잡한거였어?\""

 GEH_iori_story_event.2.t: "새로고침"
 GEH_iori_story_event.2.desc: "\"시로미 이오리. 지금 이 시간부로, 선도부 실행부장으로서의 모든 직무를 정지한다.\"\n\n선도부장 집무실의 공기는 얼음장처럼 차가웠다. 소라사키 히나의 나직하지만 단호한 선언에, 이오리는 순간 자신의 귀를 의심했다. 그녀는 책상을 손바닥으로 내리치며 고함을 질렀다.\n\n\"뭐?! 장난해, 히나! 내가 뭘 잘못했는데! 만마전 놈들 대가리를 박살 내고 게헨나를 통일했잖아! 그런데 이제 와서 직무 정지라고?!\"\n\n그때까지 묵묵히 서류철을 들고 있던 아마우 아코가 차갑게 입을 열었다.\n\n\"소란 피우지 마세요, 시로미 이오리. 당신은 전쟁부의 책임자로서 만마전과의 전쟁을 명분으로 한 무차별 징병, '반만마전 적대감 주입'을 위한 악의적인 프로파간다 살포, 그리고 독일계 소수자에 대한 조직적인 박해를 주도했습니다.  모두 '게헨나 선도부'의 이름으로는 결코 용납될 수 없는 범죄 행위입니다.\"\n\n\"그딴 종이쪼가리에 적힌 게 내 죄목이라는 거야? 전쟁에서 이기려면 당연히 해야 할 일들이었잖아! 네년은 책상에 앉아서 펜대나 굴렸으니 알 리가 없겠지!\"\n격분한 이오리가 아코에게 달려들려던 찰나, 히나의 목소리가 그녀를 제지했다.\n\n\"그만, 이오리.\"\n\n히나는 자리에서 일어나, 지친 눈으로 자신의 오랜 동료를 바라보았다.\n\n\"네가 게헨나를 위해 싸웠다는 건 알아. 누구보다도. 하지만 그 방식이... 우리 모두를 괴물로 만들었어. 우리는 규율을 지키는 선도부지, 증오를 퍼뜨리는 군벌이 아니야. 내가 너의 폭주를 막지 못한 책임도 커. 그러니 이건 너 혼자만의 징계가 아니야. 우리가 저지른 과오를 바로잡고, 피로 물든 이 얼룩을 지워내기 위한 첫걸음이지.\"\n\n이오리는 히나의 말을 이해할 수 없었다. 이해하고 싶지도 않았다. 자신의 모든 헌신이 부정당하는 기분이었다. 결국 모든 것은 히나를 위해서였는데, 그 히나가 자신에게 칼을 겨누고 있었다.\n\n\"...배신자.\"\n\n이오리가 경멸을 담아 내뱉은 말을 끝으로, 히나는 고개를 돌렸다.\n\n\"데려가.\"\n\n선도부원들이 굳은 표정으로 이오리의 양팔을 붙잡았다. 집무실 문이 닫히고 격렬한 저항의 목소리가 복도 저편으로 사라지자, 히나는 깊은 한숨과 함께 의자에 몸을 기댔다. 피로 물든 얼룩을 지우는 길은, 이토록 고통스러웠다."
 GEH_iori_story_event.2.a: "관계의 재정립."

 GEH_iori_story_event.3.t: "피 흘리는 새"
 GEH_iori_story_event.3.desc: "\"그러므로 시로미 이오리 실행부장 및 전쟁부에 대한 모든 조사는 기각한다.\"\n\n선도부 회의실의 공기는 무겁게 가라앉아 있었다. 히나의 선언은 기획부 간부들이 제출한 '전시 체제 부작용 보고서'에 대한 최종 결론이었다. 보고서는 이오리의 군국주의가 낳은 폐해를 신랄하게 지적하고 있었다. 무차별 징병에 대한 학생들의 원성, 악의적인 프로파간다로 인한 불신, 그리고 독일계 주민들의 깊어지는 적대감까지.\n\n\"결과가 모든 걸 말해주는 거 아니야? 우리가 이겼잖아! 책상에 앉아서 징징대는 놈들 말 따위 들을 필요 없어!\"\n\n이오리는 만족스러운 미소를 지으며 반대파를 쏘아붙였다. 아코는 믿을 수 없다는 표정으로 자리에서 일어났다.\n\n\"부장님! 하지만 보고서의 내용은 명백한 사실입니다. 규율과 절차를 무시한 월권 행위는 반드시 바로잡아야 합니다. 이대로라면 선도부에 대한 신뢰가 무너질 겁니다!\"\n\n모두의 시선이 다시 히나에게 쏠렸다. 히나는 조용히 눈을 감았다가, 이내 결심이 선 듯 차가운 눈빛으로 회의실을 둘러보았다.\n\n\"과오가 없었다고는 하지 않겠다. 방식은 거칠었고, 희생도 따랐지. 하지만 그 덕분에 우리는 살아남았고, 게헨나를 통일했다. 이제 와서 승리를 위해 사용했던 검을 벌주는 것은, 우리의 모든 투쟁을 부정하는 행위일 뿐이야. 그것은 더 큰 분열과 혼란을 낳을 뿐이다.\"\n\n히나는 자리에서 일어나, 회의실 전체를 향해 선언했다.\n\n\"지금 우리에게 필요한 것은 과거에 대한 심판이 아니다. 이 혼란을 수습하고 미래로 나아가기 위한… 더 강력하고 절대적인 질서다. 따라서, 나는 전시 비상대권을 무기한 연장한다. 선도부의 모든 결정은 오직 나, 선도부장을 통해서만 이루어진다. 이의는 받지 않겠다.\"\n\n아코의 얼굴이 하얗게 굳었고, 기획부원들 사이에서는 탄식이 터져 나왔다. 반면 이오리를 위시한 실행부원들의 얼굴에는 승리의 미소가 번졌다. 히나는 자신을 향한 원망과 환호의 시선을 동시에 받으며 생각했다. 게헨나의 학생들이 등을 돌린다면… 나는 기댈 곳을 새로 찾아야만 한다. 설령 그 대상이, 지금까지 총구로 억눌러왔던 저 이방인들이라 할지라도."
 GEH_iori_story_event.3.a: "\"질서를 위해서라면... 기꺼이 독재자가 되겠다.\""

 GEH_iori_story_event.4.t: "조화, 조국, 연대"
 GEH_iori_story_event.4.desc: "'게헨나-도이치 연방' 창설 기념일. 뮌헨의 광장은 질서정연한 인파로 가득했다. 히나는 연단에서 조금 떨어진 곳에서 무감한 표정으로 그 광경을 지켜보았다. 연설과 기념 행사는 계획대로 순조롭게 진행되고 있었다. 오늘의 주인공은 연단 위의 정치가들이 아닌, 이 광장을 채운 새로운 '국민'들이었다.\n\n결국은 이렇게 되는군. 히나는 나직이 중얼거렸다. 이오리를 옹호하고 비상대권을 선포한 날, 게헨나 학생들의 빗발치는 비난과 저항은 예상했던 바였다. 그들의 충성심은 결국 자신들이 원하는 방향으로만 향하는, 조건적인 지지에 불과했다. 지켜낼 가치가 없는 것이었다. 히나는 낡은 지지 기반을 버리는 데 주저하지 않았다.\n\n대신 히나는 새로운 것을 얻었다. 광장을 메운 저 수많은 독일인들의 얼굴. '보편주의 헌장'은 그들에게 구원이자 약속이었다. 총성과 불신으로 가득했던 거리는 이제 국가가 보장하는 안정 속에서 고요함을 되찾았다. 이것이 그녀가 선택한 결과물이었다. 낡은 충성심을 대가로 치르고 얻어낸, 완벽하게 통제된 조화.\n\n그때였다. 누군가 히나의 코트 자락을 조심스럽게 잡아당겼다. 고개를 돌리자, 이제 막 여덟 살이 되었을 법한, 금발의 어린 독일인 소녀가 겁에 질린 눈으로 그녀를 올려다보고 있었다. 아이의 손에는 작고 소박한 들꽃 한 송이가 들려 있었다.\n\n\"…이거, 당신에게.\"\n\n아이가 서툰 키보토스 말로 속삭이며 꽃을 내밀었다. 주변에 있던 독일인 부모는 아이의 돌발 행동에 사색이 되어 달려오려 했지만, 히나는 손짓으로 그들을 제지했다. 그녀는 천천히 몸을 낮춰 아이와 눈을 맞췄다. 아이의 눈에는 공포의 대상인 '선도부장'이 아닌, 그저 한 사람의 모습이 비치고 있었다.\n\n\"고마워. 이름이 뭐니?\"\n\n히나는 아주 오랜만에, 진심으로 미소 지으며 꽃을 받아들었다. 손안에 쥔 작은 들꽃의 감촉. 그것은 자신이 지켜내지 못한 수많은 것들에 대한 슬픔과, 그럼에도 불구하고 마침내 지켜낸 단 하나의 가치에 대한 무게를 동시에 느끼게 했다. 이 작은 꽃 한 송이면, 그걸로 충분했다."
 GEH_iori_story_event.4.a: "\"그래, 이걸로 된 거야.\""

 GEH_iori_story_event.5.t: "게헨나 학생회장 선거. 어쩌면 처음으로."
 GEH_iori_story_event.5.desc: "\"최종 개표 결과, 총투표자 수...\"\n\n게헨나 중앙구 광장은 숨 막히는 정적에 휩싸였다. 대전이 이후 처음으로, '게헨나 교칙'에 명시된 가장 민주적인 절차에 따라 새로운 학생회장을 선출하는 선거가 끝났다. 시로미 이오리의 전쟁 범죄를 수사하고 군사화된 체제를 해체하며 '본래의 선도부'로 돌아가고자 했던 소라사키 히나의 개혁, 그 마지막 단계였다. 독재와 군림이 아닌, 학생들의 손으로 직접 지도자를 뽑는다는 낯선 경험에 게헨나 전체가 들썩였다.\n\n\"…과반 득표자 없음. 결선 투표 결과, 기호 1번 소라사키 히나 후보, 득표율 46.4%로 당선을 확정합니다!\"\n\n아코의 차분한 선언이 스피커를 통해 광장 전체에 울려 퍼지는 순간, 마침내 환호성과 탄식이 교차하며 터져 나왔다. 히나는 연단 아래에서 묵묵히 그 광경을 지켜보았다. 압도적인 승리가 아니었다. 오히려 간신히 이겼다는 표현이 정확했다.\n\n이번 선거는 게헨나의 분열된 현실을 그대로 보여주는 거울이었다. 구 만마전 출신이자 행정가로서의 능력을 내세운 나츠메 이로하는 무려 38.2%의 득표율로 2위를 차지하며 히나를 위협했다. 이는 군국주의에 지친 수많은 학생들이 선도부가 아닌 새로운 대안을 갈망했다는 명백한 증거였다. 그리고 모두를 경악시킨 것은, 전범으로 수사받는 와중에도 출마를 강행한 시로미 이오리의 득표율이었다. 실행부의 굳건한 지지를 바탕으로 그녀는 6.4%라는, 결코 무시할 수 없는 표를 얻어냈다. 강경파는 여전히 죽지 않았음을, 언제든 다시 고개를 들 수 있음을 증명한 셈이다.\n\n\"부장님... 아니, 회장님. 연단으로 올라가시죠.\"\n\n아코가 다가와 나직이 말했다. 히나는 고개를 끄덕이고 천천히 계단을 올랐다. 자신을 향한 환호와 야유, 그리고 무관심한 시선들. 이 모든 것이 뒤섞인 광경이야말로 자신이 원했던 '정상적인 게헨나'의 모습이었다. 모두가 자신만을 맹목적으로 따르던 과거의 광신은 이제 없었다. 대신 의심하고, 비판하고, 때로는 반대하는 살아있는 목소리들이 있었다. 이 씁쓸하고도 소란스러운 현실을 받아들이는 것. 그것이야말로 과거에 대한 진정한 속죄이자, 게헨나가 나아갈 새로운 시작이었다. 히나는 마이크 앞에 서서, 자신을 선택해준, 그리고 선택하지 않은 모든 학생들을 향해 담담하게 입을 열었다."
 GEH_iori_story_event.5.a: "\"모두들, 믿어줘서 고마워.\""

 GEH_iori_despotic_story_event.1.t: "게헨나의 깃발 아래에 - 1"
 GEH_iori_despotic_story_event.1.desc: "회의실의 육중한 강철 문이 굉음과 함께 닫혔다. 소라사키 히나의 실종으로 혼란에 빠져있던 선도부 간부들은 그 소리에 입을 다물었다. 완전무장한 실행부원들이 일사불란하게 진입해 모든 출입구를 봉쇄했다. 총구가 회의실 내부를 향하자, 공기는 순식간에 차가운 위압감으로 가득 찼다. 연단으로 성큼성큼 걸어 나간 시로미 이오리가 마이크를 움켜쥐었다.\n\n\"히나 부장님은 왜 무너지셨지? 저 약해빠진 독일 놈들의 불평불만을 들어주느라! 기획부의 끝없는 서류놀음에 시달리느라! 우리가 '키보토스인'이라는 정체성을 잊고 저열한 이방인들과 섞이려 했기 때문이다!\"\n\n이오리의 외침은 분노 그 자체였다. 그녀는 겁에 질린 간부들을 향해 선포했다.\n\n\"더 이상의 혼란은 용납하지 않는다! 선도부 실행부의 이름으로, 지금 이 시간부로 게헨나 전역에 비상계엄을 선포한다! 모든 부원들은 자리에서 대기. 지금부터 이 문을 나서려는 자는 히나 부장님을 버린 반역자로 간주, 현장 체포한다!\"\n\n실행부원들이 노리쇠를 당기는 소리가 회의실을 울렸다. 그 살벌한 정적을 깬 것은 아마우 아코의 목소리였다. 그녀는 자리에서 일어나, 조금의 두려움도 없이 이오리를 노려보았다.\n\n\"이건 반란입니다, 시로미 이오리. 당신은 히나 부장님의 비극을, 당신의 저열한 권력욕을 채우기 위한 명분으로 삼고 있을 뿐입니다.\"\n\n\"저 여자를 체포해!\"\n\n이오리의 명령이 떨어지는 순간, 회의실 구석에서 섬광탄이 터지며 모두의 시야를 멀게 했다. 혼란 속에서 몇몇 기획부원들이 고의적으로 실행부원들에게 몸을 던지며 아수라장이 벌어졌다. 비명과 고함이 뒤섞이고, 연기가 자욱한 회의실에서 실행부원들이 간신히 질서를 되찾았을 때, 한 부관이 이오리에게 다급하게 보고했다.\n\n\"선임행정관은… 놓쳤습니다! 일부 기획부원들과 함께 비상통로를 통해 탈출한 것 같습니다!\"\n\n\"제기랄!\"\n\n이오리는 주먹으로 연단을 내리쳤다. 선도부의 심장은 장악했지만, 가장 핵심적인 반대파는 놓치고 말았다.\n\n\"도시 전체를 봉쇄해! 반드시 그 여자를 찾아내!\"\n\n게헨나의 밤이, 피와 불꽃의 서막을 열고 있었다."
 GEH_iori_despotic_story_event.1.a: "\"그래도, 비로소 질서가 바로 섰군.\""

 GEH_iori_despotic_story_event.2.t: "레겐스부르크의 대규모 시위"
 GEH_iori_despotic_story_event.2.desc: "히나의 실종과 이오리의 계엄 선포 이후, 게헨나의 분열은 돌이킬 수 없는 현실이 되었다. 아마우 아코가 이끄는 '반계엄파(Kriegsrechtsgegner)'는 레겐스부르크에서 대규모 평화 시위를 조직했다. 군사 쿠데타의 부당함을 알리고, 선도부의 규율을 되찾자는 것이 그들의 목표였다. '계엄 철회!', '선도부의 규율을 돌려달라!'는 구호가 질서정연하게 울려 퍼졌다.\n\n하지만 시로미 이오리에게 이들의 목소리는 단순한 소음이자, 제거해야 할 반란의 불씨일 뿐이었다. 중무장한 실행부의 진압 병력이 시위대의 앞을 가로막았고, 광장의 평화로운 분위기는 순식간에 날카로운 긴장감으로 바뀌었다. 아코는 확성기를 통해 끝까지 비폭력 저항을 호소했다.\n\n\"여러분은 게헨나의 학생을 지키는 선도부원이지, 시로미 이오리의 사병이 아닙니다! 폭력에 굴복하지 마십시오!\"\n\n그러나 대치 상황이 길어지며 격앙된 한 시위자가 던진 물병 하나가, 실행부가 기다리던 신호탄이 되었다.\n\n\"폭동이다! 전원 진압하라!\"\n\n실행부의 강경 진압은 순식간에 이루어졌다. 최루탄과 곤봉 앞에 평화 시위는 무참히 짓밟혔다. 그날 저녁, 실행부의 공식 발표는 레겐스부르크에서 일어난 일을 '국가 전복을 노린 불순분자들의 폭동'으로 규정했다. 아코를 비롯한 주동자들은 혼란을 틈타 도주했지만, 수많은 시위자들이 체포되었다. 이 '폭동'은 이오리에게 모든 반대파를 '테러리스트'로 규정하고, 그들을 뿌리 뽑을 강력한 법령을 제정할 완벽한 명분을 주었다."
 GEH_iori_despotic_story_event.2.a: "\"...아마우 아코, 너. 정말 싫어.\""

 GEH_iori_despotic_story_event.3.t: "게헨나의 깃발 아래에 - 2"
 GEH_iori_despotic_story_event.3.desc: "\"쾅-!\"\n\n레겐스부르크 외곽, '반계엄파(Kriegsrechtsgegner)'의 비밀 은신처의 문이 폭발과 함께 산산조각 났다. 새로 제정된 '레겐스부르크 폭동 법령'은 시로미 이오리의 실행부에게 모든 '반키보토스 불순분자'를 재판 없이 체포하고 진압할 무제한의 권한을 부여했다. 그 법령의 첫 번째 목표는 바로 아마우 아코였다.\n\n\"모두 무기 버려! 저항하는 자는 즉시 사살한다!\"\n\n완전무장한 실행부원들이 쏟아져 들어와 저항 세력을 순식간에 제압했다. 가장 안쪽 방, 아마우 아코는 마지막까지 기밀문서를 불태우다, 결국 자신을 향해 겨눠진 수십 개의 총구 앞에서 담담히 손을 들었다. 잠시 후, 시로미 이오리가 그녀의 앞에 섰다.\n\n\"끝났어, 아코. 네 같잖은 '계엄 반대' 놀이는.\"\n\n이오리의 조롱 섞인 말에도 아코의 눈빛은 흔들리지 않았다. 그녀는 불타오르는 서류 더미를 등진 채, 오히려 승리자처럼 당당하게 말했다.\n\n\"이건 당신의 승리가 아닙니다. 규율과 이성을 짓밟은 당신의 폭정이 잠시 성공했을 뿐이죠. 히나 부장님께서는 당신 같은 군벌이 선도부를 장악하는 것을 결코 원하지 않으셨습니다.\"\n\n\"히나 부장님은 너처럼 나약한 서류벌레들과 이기적인 독일 놈들 때문에 사라진 거야! 이제 내가 그분의 이름으로 진짜 '질서'를 세울 거다. 넌 그걸 방해하는 마지막 걸림돌이었고.\"\n\n이오리는 턱짓으로 부하들에게 명령했다.\n\n\"끌고 가. 반역자는 재판받을 가치도 없어. 가장 깊은 감옥에 처넣어.\"\n\n실행부원들에게 양팔이 붙잡혀 끌려가면서도, 아코는 끝까지 이오리를 향한 경멸의 시선을 거두지 않았다. 그녀의 저항은 실패로 끝났다. 이제 게헨나에는 실행부의 군홧발 소리에 반대할 목소리가 남아있지 않았다. 아코가 사라진 자리에 남은 것은 타다 남은 서류의 재와 깊은 어둠뿐이었다."
 GEH_iori_despotic_story_event.3.a: "\"즐겁게 웃어, 다들 왜 그래?\""

 GEH_iori_despotic_story_event.4.t: "자유롭고 아름다운 우리의 조국"
 GEH_iori_despotic_story_event.4.desc: "히나의 부재가 남긴 권력의 공백은 게헨나를 광기로 몰아넣었다. 오늘, 중앙구 광장은 시로미 이오리를 지지하는 실행부원들과 급진파 학생들로 가득 찼다. '반계엄파'의 저항과 내부의 불만을 잠재우기 위해, 이오리는 자신들의 지지 세력을 하나의 거대한 정치 조직으로 묶어둘 필요가 있었다.\n\n\"학도들이여! 우리의 위대한 지도자, 히나 부장님은 왜 우리 곁을 떠나셨는가!\"\n\n연단에 오른 이오리의 외침에 광장이 순식간에 조용해졌다.\n\n\"나약한 관료들의 서류놀음과, 우리의 순수한 문화를 좀먹는 저열한 이방인들의 소요 때문이었다! 그들은 우리의 위대한 정신을 이해하지 못한다! 우리는 헤일로를 가진, 진정으로 진보된 인류다!  이 땅의 주인이 되어야 할 것은 바로 우리, 게헨나의 학생들이어야만 한다!\"\n\n그녀의 선언에 광장은 열광적인 함성으로 화답했다. 이오리는 그 열기를 몰아 연설을 이어갔다.\n\n\"더 이상 분열은 없다! 반역자들의 저항을 분쇄하고, 게헨나-키보토스 순수 문화를 수호하기 위해서는 강력한 학생-시민-정부의 연대가 필요하다!  오늘, 나는 이 자리에서 '자유조국방위연합'의 창설을 선포한다! 이것은 단순한 조직이 아니다! 이것은 우리의 정체성이자, 우리의 생존을 위한 투쟁이다!  게헨나를 위하여!\"\n\n\n이오리의 선언이 끝나자, 광장은 '이오리! 이오리!'를 연호하는 함성으로 뒤덮였다. 선도부의 깃발 아래, 순수와 광기로 무장한 새로운 시대가 막을 올리고 있었다."
 GEH_iori_despotic_story_event.4.a: "하나의 조국, 하나의 민족, 하나의 지도자!"

 GEH_iori_despotic_story_event.5.t: "암울한 과거를 발판 삼아"
 GEH_iori_despotic_story_event.5.desc: "히나의 실종 이후, 선도부에는 무거운 침묵과 깊은 상실감만이 감돌았다. 시로미 이오리는 그 침묵을 깨고, 모든 선도부원을 소집했다. 광장이 아닌, 엄숙한 분위기의 대회의실에서였다. 연단에 오른 그녀의 목소리는 평소의 분노가 아닌 깊은 슬픔에 잠겨 있었다.\n\n\"모두가 지쳤다는 것을 안다. 우리의 태양이셨던 히나 부장님은... 이제 우리 곁에 없다.\"\n\n이오리는 잠시 말을 멈추고 숨을 골랐다.\n\n\"왜 이렇게 되었나? 끝없는 동아리의 폭동, 독일계 반란 조직의 테러리즘... 게헨나는 너무 많은 혼돈에 의해 오염되었다. 이 모든 혼란이 부장님을 벼랑 끝으로 내몰았다!\"\n\n그녀의 목소리에 담긴 호소력은 회의실의 모두를 숙연하게 만들었다.\n\n\"이제 게헨나에는 치유가 필요하다.  이 오염을 닦아내고, 부서진 조국을 다시 일으켜 세워야 한다. 이를 위해, 오늘부로 '연합국가재건위원회'의 설립을 선언한다! 이것은 파벌 싸움이 아니다. 히나 부장님께서 지키고자 했던 게헨나를, 이제 우리가 다시 세우기 위한 거룩한 과업이다. 이 재건에 동참하지 않는 자는, 부장님의 유지를 거역하는 자로 간주하겠다.\"\n\n이오리의 호소는 분노가 아닌 슬픔과 결의에 차 있었다. 회의실을 채운 것은 광적인 환호가 아닌, 비장한 각오가 담긴 박수 소리였다. 히나의 비극을 딛고, 게헨나를 '정화'하고 '재건'하려는 새로운 시대가 시작되고 있었다."
 GEH_iori_despotic_story_event.5.a: "새로운 게헨나의 재건을 위해!"

 GEH_iori_despotic_story_event.6.t: "영웅인가, 혹은 계단인가"
 GEH_iori_despotic_story_event.6.desc: "게헨나는 마침내 정화되었다. 시로미 이오리의 '자유조국방위연합'은 모든 반대파를 숙청하고 '순수 키보토스 문화'를 국가의 유일한 이념으로 바로 세웠다. 그녀는 이제 명실상부한 '민족과 조국의 지도자'였다. 책상 위에는 수도 중앙 광장에 세워질 기념비의 최종 설계안 두 개가 놓여 있었다. 하나는 검은 날개를 펼친 채 결연히 서 있는 소라사키 히나의 모습이었고, 다른 하나는 총을 든 채 전진하는 시로미 이오리 자신의 모습이었다.\n\n'히나 부장….'\n\n이오리는 히나의 설계안을 집어 들었다. 그녀를 '순교자'이자 '영원한 상징'으로 만드는 것. 이방인들의 오염에 맞서 싸우다 쓰러진 비극의 영웅. 그것은 자신이 권력을 잡기 위해 내세웠던 완벽한 명분이었다. 그녀의 이름을 신화로 만들면, 자신이 세운 이 국가의 정통성은 반석 위에 놓일 것이다. 그것이 자신이 따르던 상사에 대한 마지막 예우일지도 몰랐다.\n\n하지만, 이오리는 이내 다른 설계안으로 시선을 옮겼다. 자신의 동상.\n\n'…결국, 당신은 무너졌어.'\n\n히나는 강했지만, 결국 그 모든 혼란을 감당하지 못하고 사라졌다. 그 폐허 위에서 질서를 다시 세우고, '오염'을 씻어낸 것은 바로 자신, 시로미 이오리였다. 국가는 두 개의 태양을 가질 수 없다. 살아있는 지도자가 아닌, 과거의 유령을 숭배하는 국가는 앞으로 나아갈 수 없다. 히나의 신화가 너무 커진다면, 언젠가 그 그늘이 자신의 권위를 좀먹게 될지도 모른다. 진정한 '이오리의 시대'를 열기 위해서는, 히나라는 거대한 산을 넘어서야만 했다.\n\n이오리는 두 개의 설계안을 번갈아 내려다보았다. 이것은 단순히 기념비를 정하는 문제가 아니었다. 자신이 세운 국가의 마지막 이정표를 세우는 일이었다. 히나는 조국을 위한 영원한 신화가 될 것인가, 아니면 시로미 이오리의 시대를 위한 주춧돌이 될 것인가. 이오리는 이제, 마지막 결단을 내려야만 했다."
 GEH_iori_despotic_story_event.6.a: "히나 부장님은 우리의 영원한 상징으로 남을 것이다."
 GEH_iori_despotic_story_event.6.b: "과거는 과거일 뿐."

 GEH_iori_despotic_story_event.7.t: "빈자리"
 GEH_iori_despotic_story_event.7.desc: "게헨나는 재건되었다. 히나의 실종이 남긴 깊은 상처와 혼란은 시로미 이오리의 '연합국가재건위원회'가 강력한 질서로 봉합했다. 분열되었던 게헨나인과 독일인은 게헨나라는 하나의 이름 아래 강제로 융화되었고, 모든 테러리스트들은 제거되었다. 이오리는 마침내 자신이 목표했던 '치유'와 '재건'을 완수했다.\n\n모든 업무를 마친 늦은 밤, 이오리는 홀로 옛 선도부장 집무실을 찾았다. 히나가 사라진 그날 이후, 시간의 흐름이 멈춘 것 같은 공간. 그녀가 앉았던 의자, 그녀가 쓰다듬던 창가, 그녀가 바라보던 게헨나의 야경. 모든 것이 그대로였다. 이오리는 방 중앙에 놓인 텅 빈 의자를 오랫동안 말없이 바라보았다.\n\n'히나 부장... 당신이었다면, 어떻게 했을까?'\n\n나는 당신처럼 똑똑하지 않아. 복잡한 서류 같은 건 몰라. 그저... 부서진 걸 바로잡고, 당신이 지키려 했던 이 게헨나를 지키고 싶었을 뿐이야. 당신이 남긴 슬픔을 명분 삼아, 나는 결국 이런 방식으로 게헨나를 재건했고. 이것이... 당신이 원했던 모습일까?\n\n알 수 없었다. 대답해 줄 사람은 이제 없었다. 이오리는 더 이상 과거를 돌아보지 않기로 했다. 그녀는 조용히 몸을 돌려 문손잡이를 잡았다. 자신이 만든 질서, 자신이 재건한 게헨나의 미래를 향해 걸어가기 위하여.\n\n"딸깍."\n\n문이 닫히는 소리와 함께, 집무실은 다시 깊고 고요한 어둠 속에 잠겼다."
 GEH_iori_despotic_story_event.7.a: "\"이제... 앞으로 나아가야지.\""

 GEH.flavor_event.1.t: "인터넷 개통"
 GEH.flavor_event.1.desc: "*Haruna0301\n드디어 선도부에도 인터넷 개통이 되었군요! 축하드립니다\n대전이 이후 맛있는 음식을 파는 식당이 많이 줄어들었는데\n\n*Haruna0301\n선도부에 한 번 방문해서 미식 탐방회를 가져보고 싶네요\n후후 기대해도 괜찮겠죠?\n\n*realHinaSorasaki\n오지마\n\n*Haruna0301\n어머나 세상에\n공사다망한 가운데서도 근무시간에 SNS를 할 시간은 있으신 것 같아 다행이네요\n\n*realHinaSorasaki\n--\n\n*Haruna0301\n후후 장난이었답니다\n게헨나가 너무 커져버려서 아직 북쪽 지방에 다 돌아보지 못한 식당이 많이 생겼거든요\n\n*Haruna0301\n선도부는 기회가 되면 나중에 방문하는 것으로 하겠습니다 :)"
 GEH.flavor_event.1.a: "\"그러니까 오지 말라고...\""

 GEH.flavor_event.2.t: "아무튼 그 너구리의 탓이에요!"
 GEH.flavor_event.2.desc: "\"대전이 이후 두 달이나 지났어요. 그런데 정보부는 지금까지 *아무런* 정보도 찾아내지 못했다는 게 말이 되나요? 말이 안 되는 거잖아요!\"\n\n아코는 발을 쿵쿵 구르며 고개 숙인 선도부 정보부원들을 손으로 한 사람씩 가리켰다.\n\n\"히나 부장님께서 지금 과로 때문에 얼마나 고생하고 있는 지 다 알 텐데...! 만마전이 어떤 방법으로 우리를 다른 우주로 날려보낸 건지 도대체 왜 아무도 정보를 알아오지 못하는 거예요!\"\n\n정보부원 한 명이 싸늘한 분위기 속에서 힘겹게 입을 열었다.\n\n\"죄송합니다. 선임행정관님. 하지만... 면밀한 조사를 거쳤지만 만마전이 대전이를 의도적으로 일으켰다는 증거는 전혀 없는 것으로...\"\n\"만마전의 너구리! 하누마 마코토가 아니면 도대체 누가!! 히나 부장님을 이렇게 고의적으로 괴롭힐 수 있냐고요! 제가 대전이를 일으켰을까요? 그렇게 생각하는 거죠?! 네?\"\n\"아닙니다. 하지만...\"\n\n영원히 끝나지 않을 것 같은 내리갈굼은 한 시간이 지나고서야 끝났다. 아코도 두 달에 걸친 조사에서 아무런 정보가 나오지 않았다는 게 무슨 의미인지는 알고 있었다. 하지만... 마코토가 아니면 도대체 대전이의 원인이 무엇이란 말인가.\n\n방법을 모르면 돌아갈 길도 없다. 그렇다면 대전이 이후 몇 배로 늘어난 히나의 업무량을 줄여 줄 방법도 없다. 그 냉혹한 사실을, 히나를 좋아하는 아코가 인정하고 싶지 않았을 뿐이었으니까."
 GEH.flavor_event.2.a: "\"...알았어요. 만마전에 대한 조사는 오늘로 중단하겠어요.\""

 GEH.flavor_event.3.t: "아무튼 역대전이는 가능해요!"
 GEH.flavor_event.3.desc: "\"대전이가 가능하다면, 역대전이도 불가능하진 않아요. 그렇게 생각하지 않나요?\"\n\n아코의 질문에 서류에 메모를 하던 치나츠가 고개를 갸웃했다.\n\n\"저는 잘 모르겠네요. 대전이 자체의 원리도 모르는 상황이니까요.\"\n\"원리야 간단하죠. 신비를 이용하지 않았겠어요?\"\n\"신비 말씀이신가요?\"\n\"네. 그게 아니라면 키보토스 전체를 다른 우주로 날려보내는 게 가능할 리가 없죠.\"\n\n아코는 깊은 생각에 잠긴 표정으로 집무실 안을 천천히 원을 그리며 걸었다.\n\n\"신비... 어쩌면 신비 직조기를 대량으로 모아 그 힘을 집중하면... 포탈을 만들 수 있을지도 몰라요. 아니, 제 계산대로라면... 가능해요! 선도부원들의 신비 직조기를 모아 봐야겠어요!\""
 GEH.flavor_event.3.a: "\"...히나 부장님. 반드시 제가 도와드릴게요!\""
 
 GEH.flavor_event.4.t: "아무튼 죽을 죄를 지었어요..."
 GEH.flavor_event.4.desc: "콰아아아앙!!!\n\n강한 폭압과 함께 유리창이 일제히 깨졌다. 국방군의 폭탄 테러인가? 놀란 히나가 총을 집어들고 깨진 집무실 창가 쪽을 내다보았다. 높은 탑 같은 선도부 건물 앞. 거대한 포탈 하나가 검은 불길로 타오르고 있었다.\n\n짧은 심문만으로도 상황을 파악할 수 있었다. '원래 세계로 돌아가는 포탈을 만들겠다'며 아코가 신비 직조기를 개조해 만든 키보토스로의 포탈이, 시험 작동을 시작하자마자 대폭발을 일으킨 모양이었다.\n\n'동기는... 키보토스로 돌아가면 부장인 내 업무가 줄어들 것 같아서...'\n\n히나는 마치 단두대의 칼이 떨어지길 기다리는 죄수처럼 무릎 꿇은 아코를 내려다보았다. 반성문 200장 정도는 쓰게 해야 할 만한 대사건이었다. 하지만 아코가 어떤 이유 때문에 이런 일을 벌였는지는 이해할 수 있었다.\n\n\"일어나. 아코.\"\n\"하, 하지만 부장님. 저 때문에 히나 부장님에게 폐를...\"\n\"아코의 노력이 폐가 되었다고 생각한 적 없어.\"\n\n히나는 무릎 꿇은 아코를 향해 손을 내밀었다."
 GEH.flavor_event.4.a: "\"나를 걱정해줘서 고마워.\""
 
 GEH.flavor_event.5.t: "민주주의 투쟁...?"
 GEH.flavor_event.5.desc: "\"선도부장 직선제를 실시하라!\"\n\"소라사키는 선도부장 직에서 물러나라!\"\n\n아무리 선도부 건물이 높은 탑 같은 고층빌딩 형태라 하더라도, 선도부 청사 앞에 모인 시위대가 외치는 목소리는 최상층 히나의 집무실까지 울리고 있었다. 복도를 걷는 동안 히나의 표정이 조금씩 굳어져갔다.\n\n\"...바깥에서 무슨 일이 일어나고 있는 거야?\"\n\n아코가 짜증이 난다는 듯 창문 너머를 경멸조로 내려다보았다.\n\n\"대전이 이후 게헨나 학생들이 현지인들을 해치지 못하게 여러 총기 규제를 가하고 있다보니... 부장님에 대한 반발을 가진 학생들이 생긴 모양이예요. 만마전 의장처럼 선도부장직을 직선제로 바꾸면...\"\n\"나를 끌어내릴 수 있다는 말이겠지.\"\n\n히나는 한숨을 내뱉었다.\n\n\"학생들이 내가 내려오기를 원한다면 내려가야지. 직선제가 모두에게 더 좋은 길이라면 그것 역시 부정할 생각 없어.\"\n\"부, 부장님?!\"\n\"하지만 새 선도부장을 선출하려는 이유가 현지인들에게 총 한 번 쏴보고 싶어서일 뿐이라면, 그것만은 받아들일 수 없어.\"\n\n히나는 조금 열린 선도부의 유리창을 닫아버렸다. 대전이 직후 룩셈부르크에서부터 벨기에에 이르기까지 게헨나 학생들이 현지인들에게 얼마나 많은 총기 난사를 벌였는지는 아직 통계조차 제대로 잡히지 않은 상태였다.\n\n적어도 이 땅에서만은 그런 일이 일어나게 할 수는 없었다."
 GEH.flavor_event.5.a: "게헨나 학생들의 아우성은 그 뒤로도 한참을 이어졌다."
 
 GEH.flavor_event.6.t: "바우하우스"
 GEH.flavor_event.6.desc: "\"선도부 청사의 가장 큰 문제는 비효율적일 정도로 인원에 비해 건물이 크다는 점입니다. 군사 조직인 만큼 권위적인 인상을 주고 싶었다는 건 이해하지만, 이 정도 넓이의 복도면 전차도 달릴 수 있을 겁니다. 이래서야 냉난방 효율이 끔찍하겠군요.\"\n\n내부 보안 때문에 선도부 청사의 2층까지만 출입이 허가되었지만, 몬드리안 교수는 방문이 허가된 공간을 몇 번이고 빙글빙골 돌며 건물의 문제점을 하나하나 지적해 나갔다.\n\n\"그리고 중진들의 집무실들은 빌딩 꼭대기층에 몰아놓으셨다고 하셨는데, 이렇게 높은 청사에서 테러가 발생할 경우는 예상해 보셨습니까? 만약 이 건물에 지하 벙커가 있다고 하더라도, 그곳까지 내려가기도 전에 수뇌부가 전멸당할 수도 있습니다.\"\n\n현지인 어른 따위에게 잔소리를 듣는 것이 유쾌한 일은 아니었지만, 아코는 애써 웃으며 몬드리안 교수의 말을 수첩에 메모했다. 자신도 전기가 끊긴 상황에서 선도부 청사 건물 계단을 오르내린 적이 있었기에, 이렇게 높다랗기만 한 건물의 문제는 이해하고 있었으니까.\n\n\"좋아요. 언젠가 새 청사를 지어야 한다고 생각은 하고 있었으니까요. 교수님께서 이야기하신 내용들은 모두 미래 건축에 참고하겠습니다.\"\n\"고맙습니다. 그리고 이 청사의 바닥 카펫에 대해서도 이야기하자면...\""
 GEH.flavor_event.6.a: "몬드리안은 몇 시간이 지난 후에야 돌아갔다."
 
 GEH.flavor_event.7.t: "퇴폐 미술전"
 GEH.flavor_event.7.desc: "아코는 미술관에 걸린 카를 슈미트-로틀루프의 그림을 보며 어째서 그의 그림들이 '퇴폐적'인 미술이라고 비난받았는지 고민해 보았다. 아코가 아는 포스트모더니즘 그림들에 비하면 오히려 알기 쉬운 수준의 그림이라고 생각했는데, 도이칠란트의 문화적 수준은 거기에도 미치지 못했던 걸까?\n\n\"다들 나쁜 그림은 아니네요. 게헨나 학생들을 위한 미술 강의도 열심히 해 주고 있다고 하고...\"\n\n아쉽게 그의 그림이 걸린 미술관에서 로틀루프와 만나 볼 기회는 없었지만, 아코는 미술관 방문객들을 위한 관광 상품 판매점에서 그의 그림 복사본을 하나 샀다. 어쩌면 히나 부장님이 이 선물을 기뻐하실지도 모르는 법 아닌가?"
 GEH.flavor_event.7.a: "미술에는 놀라운 힘이 있다."
 
 GEH.flavor_event.8.t: "음악의 아름다움"
 GEH.flavor_event.8.desc: "유학생 청년 안익태는 게헨나-바이에른 음악대학의 강의실 복도를 따라 걸었다. 게헨나의 록, 재즈, 힙합과 같은 새로운 장르들은 일생을 미국에서 클래식 공부에 바쳐온 안에게 있어서 터무니 없을 만큼 놀라운 세계였다. 이 음악대학에서 배우는 모든 것들이 안에게 있어서 새로운 경험이었고.\n\n\"교수님. 박사 학위 논문 건으로 상담이...\"\n\n문이 열린 리하르트 슈트라우스 교수의 작업실에 들어선 순간, 안은 슈트라우스의 피아노 앞에 앉아 떨리는 손끝으로 피아노 건반을 연주하는 소라사키 히나를 발견했다. 슈트라우스는 만족스러운 미소를 지으며 히나의 뒤에 선 채, 건반을 연주하는 그녀를 내려다보았다.\n\n\"연주를 배우는 속도가 상당히 빠르군요. 선도부를 나오면 피아니스트가 되어 볼 생각은 없으십니까?\"\n\"...아코가 내게도 취미 생활이 필요한 것 같다고 말해서 하는 것 뿐이야. 피아니스트라니, 나 같은 사람하고는 안 어울려.\"\n\"누군가에게 아름다운 선율을 들려주고자 하는 마음이 있다면 그 순간 이미 피아니스트입니다. 자격 같은 것은 필요하지 않지요. ...그렇지 않나, 안 군?\"\n\n슈트라우스는 방긋 웃으며 안익태에게 다가와 아직 검토되지 않은 박사 학위 논문을 슬쩍 빼앗았다.\n\n\"지금은 나와 이 숙녀 분에게 잠시 시간을 줄 수 있겠나? 자네 논문 읽어본 뒤 모모톡으로 연락하지.\""
 GEH.flavor_event.8.a: "\"아... 알겠습니다, 교수님.\""
 
 GEH.flavor_event.9.t: "민권법 제정"
 GEH.flavor_event.9.desc: "\"흥신소 68의 민권법이라니, 솔직하게 말하자면 마음에 들지는 않네요.\"\n\n아코는 선도부에서 발표하기로 한 민권법 초안을 읽어보며 투덜거렸다. 물론 오니카타 카요코가 아코도 인정할 정도로 뛰어난 지혜를 가진 인재란 건 알고 있었다. 하지만 이 민권법을 그대로 가져다 쓴다는 것이 아코 자신의 부족함을 인정하는 것 같다는... 그런 투정이 자연스럽게 입 밖으로 나왔다.\n\n이오리가 귀찮다는 듯 늘어지게 기지개를 폈다.\n\n\"솔직하게 말해서, 누가 만든 법인가가 중요한 건 아니잖아? 이게 사람들에게 도움이 되냐 안 되냐. 그것만 보면 되지.\"\n\"그건... 그렇기는 하네요. 네. 너무 깊이 생각했나봐요.\"\n\n선도부의 존재 이유는 범죄로부터 사람들을 지키기 위함이었다. 그건 대전이 이전이든 이후든 변하지 않는다. 아코는 복잡한 생각을 내려놓기로 했다."
 GEH.flavor_event.9.a: "밀레니엄 폭탄이든 트리니티 폭탄이든, 터지기만 하면 되잖아요?"
 
 GEH.flavor_event.10.t: "선도부는 뭐 하는 거야?!"
 GEH.flavor_event.10.desc: "\"아비도스의 모래바람이 게헨나 남구를 완전히 덮어버린다니. 이게 말이나 되는 일입니까?!\"\n\n가게 운영을 모래폭풍 때문에 중단하게 된 고양이 수인이 선도부원들에게 화를 내는 동안, 이오리는 삽으로 높게 솟아오른 모래더미를 열심히 파냈다. 아비도스인지 뭔지, 이상한 학원 때문에 왜 게헨나가 고생해야 하는 거야? 게다가 이거 끝이 날 기미도 없잖아.\n\n\"하아아.\"\n\n치나츠가 지친 이오리에게 물병을 내밀었다.\n\n\"속도를 적당히 조절하세요. 탈수 증상이 올 수 있습니다.\"\n\"어? 고마워.\"\n\"어쨌거나 모래폭풍이라니, 참 대전이만큼이나 비현실적이네요. 지역 상인들이 항의하는 것도 어쩔 수 없다고는 생각합니다만...\"\n\n게헨나 남구에 모래폭풍이 날아온다니, 미리 알고 예상할 수 있는 일은 아니긴 했다. 선도부가 할 수 있는 일은 그저 상가를 덮어버리는 모래를 파내고, 이 저주 받은 폭풍이 최대한 빨리 사라지기를 바라는 정도였으니까."
 GEH.flavor_event.10.a: "저주하겠다, 아비도스!"
 
 GEH.flavor_event.11.t: "룩셈부르크 규정의 폐지"
 GEH.flavor_event.11.desc: "수류탄이나 총을 악세사리처럼 들고다니는 키보토스인들에게 국가 주도의 엄격한 총기 규제와 압류 조치를 실시하는 건 너무도 어려운 일이었다. 특히 대전이 이후 영토가 크게 확장되며 행정력의 한계를 겪고 있는 선도부에게는 더욱 힘든 문제였고. 긴 회의가 이어졌지만, 결국 룩셈부르크 규정의 유지가 불가능하다는 결론이 내려졌다.\n\n\"다행인 것은 이 법률이 대전이 이후 최소한 두 달간 학살 사건을 막아냈다는 점이예요. 그리고 지금은 키보토스인들도 현지인들이 얼마나 나약한... 존재인지 알게 되었고요.\"\n\n아코는 룩셈부르크 규정 폐지안 서류를 다른 임원들에게 내밀며 말했다.\n\n\"룩셈부르크 규정이 폐지된다고 해서 당장 학살이나 총기 범죄가 일어나지는 않을 거예요. 다만 도이치인 거주 구역에 선도부 인력을 상시 배치하고, 치안 유지를 위한 순찰 강화는 계속 이루어져야 하겠죠. 그리고 더 좋은 것은... 키보토스계와 도이치계의 인종분리 정책을 계속 유지하는 거예요. 적어도 우리가 서로의 다른 점을 완전히 이해할 수 있을 때까지는요.\""
 GEH.flavor_event.11.a: "그래도 이 법은 충분히 의미가 있었다."
 
 GEH.flavor_event.12.t: "국방군의 위협 분쇄"
 GEH.flavor_event.12.desc: "[GEH.GetLeader] 선도부장과 충실한 게헨나 선도부의 노력으로,\n\n국가사회주의를 추종하는 군벌 범죄 집단인 소위 '국방군'의 위협이 바이에른 전역에서 분쇄되었음을 기쁜 마음으로 알립니다. 선도부는 게헨나의 평화, 그리고 키보토스계의 권리와 인권을 수호하기 위하여 나치 군벌에 대한 무관용 정책을 이어갈 것입니다.\n\n게헨나 선도부 포고문"
 GEH.flavor_event.12.a: "승리 프로파간다가 중요 신문 1면에 실렸다."
 
 GEH.flavor_event.13.t: "리쿠하치마 아루의 정신 질환 치료"
 GEH.flavor_event.13.desc: "흥신소 68을 게헨나 선도부에 편입하고 난 뒤, [GEH.GetLeader] 측은 뒤늦게 흥신소 68이 내부 갈등으로 인해 심각한 분열 상태에 이르렀음을 알게 되었다. 현지인들에 대한 온건책을 주장하던 오니카타 카요코와, 이에 반대하던 아사기 무츠키 두 사람의 갈등. 그리고 그 사이에서 아루는 친구들 사이의 분열을 이기지 못하고 우울장애에 시달리고 있었다.\n\n짧은 의료부 면담 끝에 아루가 우울장애를 앓고 있었고, 그 사실을 흥신소의 친구들에게 숨기기 위해서 알코올을 이용한 '자가치료'를 하고 있었음이 공개되었다. 아루의 간 건강 상태와, 정상적인 의학적 치료 없이 방치된 정신질환 문제를 치유하기 위해 선도부 의료부에서 아루에 대한 심리 상담과 약물 치료를 실시하기로 결정했다.\n\n흥신소 사원들끼리의 갈등과 아루의 정신적 상처를 치유하기까지는 긴 시간이 걸릴 것이다. 하지만 치나츠는 충분한 시간이 주어진다면 그녀들의 문제를 하나하나 해결할 수 있을 것이라는 희망적인 보고문을 제출했다."
 GEH.flavor_event.13.a: "그녀가 키보토스 시절의 순수한 모습을 되찾길 바란다."

 GEH.flavor_event.14.t: "아마우 아코, 만취 상태의 전화"
 GEH.flavor_event.14.desc: "나는! 히나 부장님이 모르는 곳에서 웃고 있다던가! 싫고! 다른 아이랑 손을 잡는 것도! 나하고만 했으면 좋겠고! 나랑 같이 있어 줬으면 해서! 축제도, 가고 싶었어! 가 즐거워하고 있으면, 웃고 있으면, 그 옆에 내가 있고! 그런 것이 좋아! 머리가 아파, 괴로워! 히나 부장님만 생각하느라, 어떻게 되어 버릴 것 같아서... 히나 부장이 전화해 주길 기다렸어! 가끔은 이야기해 줘, 나한테 말을 걸어 줘, 나만 그러긴 싫어, 히나 부장도 조금 정도는... 조금은 내가 신경 안 쓰여? 조금도? 전혀? 아무것도 아니야? 친구일 뿐? 평범한 친구야? 평범하지 않았으면 좋겠어, 평범한 것보다 하나라도 좋으니, 평범하지 않은 게, 좋아... 저어, 히나, 어떻게 하면 좋을까. 응? 히나 듣고 있어? 들어 줘. 내 목소리를 듣고 뭔가 생각하는 중이야? 생각해 주고 있어? 안심해도 좋아, 뭐든 좋아, 뭔가 생각해 줘. 그런 게 필요해, 그런 걸 바라면 안 돼? 히나! 히나 부장, 뭐야, 나는, 히나가 좋아, 히나 이외에는 필요 없고, 필요 없어... 히나만으로도 좋으니까. 억지 부리는 거 아니야, 하나면 돼, 하나잖아. 주변 사람들은 어찌 되든 상관없고 필요 없고 저리 가 줬으면 하는데 왜 히나는 그쪽으로 가, 이쪽으로 와, 이쪽으로 와서 옆에 있고 떨어지지 말아 줘. 싫어, 히나의 옆에 있는 사람은 나, 내가 좋아, 내가 있고 싶어, 있게 해 줘.... 난 안 돼? 어디가 안 돼? 고칠 테니까 말해 줘, 고칠게, 반드시 고칠 테니까 부탁이야 가르쳐 줘, 듣고 싶어. 난 뭐라고 말하면 좋아? 뭘 하면 돼? 날면 돼? 뛰면 돼? 손을 잡으면 돼? 전부 하려고 해도 보지 않으니까... 어떻게 하면 좋은데? 어떻게 하면, 아무도... 히나, 목소리, 듣고 싶어.... 뭐라고 말해 줘, 안심시켜 줘, 하지만 다른 사람을 보고 웃는 건 싫어, 나를 보고 웃어 줘, 웃어 줘... 머리 아파, 배도, 아파... 신경 쓰였는데 왜 연락, 안 해 준 거야? 나한테 가르쳐 줘, 난 알고 싶어. 히나를 알고 싶어, 조금 전부터 뭔가, 이제, 마음이 빙글빙글 돌아서... 같은 말을 하고 있지만, 어쩔 수 없어, 어쩔 수 없잖아, 히나밖에 생각하지 않으니까... 히나뿐이니까, 계속, 히나가 되어도... 히나가, 소중하고, 소중하게 대하고 싶어서, 소중하지 않으면 싫어, 그러니까 나를 봐, 히나, 안 보는 건 싫어... 다른 아이, 는 싫어... 싫어. 또 갈 거야? 어딘가에 갈 거야? 같이 시내에 갈 거야? 나랑 놀았던 곳에 다른 아이랑? 그런 건 싫어. 덮어쓰지 마! 난 계속 기억하고 있는데, 덮어써서... 또 가면, 이번엔 달라? 같은 걸 보면서 다른 걸 보는 거야? 그런 건 싫어, 싫어, 싫어. 히나랑 같이, 같은 것, 나눠서, 알고... 이상해 그런 건, 아니지 나 이상해, 이상한 거 알아, 하지만 이상해져서... 히나가, 머리에서 안 떠나서... 지금도... 히나, 히, 나... 우아앙, 흑, 흑, 흐으윽, 히나, 히... 부, 장, 흐으... 히나의, 히나? 히나, 히나, 히나... 히나가 좋아, 나는, 좋으니까. 그러니까 히나도... 저기, 부탁이야, 히나... 히나도, 히나."
 GEH.flavor_event.14.a: "\"성가시네...\""

 GEH.flavor_event.15.t: "정보부장의 메일"
 GEH.flavor_event.15.desc: "[GEH.GetLeader] 선도부장님께\n\n선도부 정보부는 대전이 이후 계속해서 바이에른을 포함한 도이칠란트 각지에서 게헨나 체제에 위험이 되는 위험인물들에 대해 조사하고 있습니다.\n\n앞으로 선도부에 대한 위협이 되는 인물들에 대해 보고드리고자 하니, 이 인물들에 대해 조치를 취할 것인지 여부는 선도부장님이 판단해 주시기 바랍니다.\n\n이상, 선도부 정보부"
 GEH.flavor_event.15.a: "[GEH.GetLeader]는 메일함을 닫았다."

 GEH.flavor_event.16.t: "정보부 요청 - 선임행정관 교체의 안"
 GEH.flavor_event.16.desc: "[GEH.GetLeader] 선도부장님께\n\n선도부 정보부는 아마우 아코 선임행정관에 대한 면밀한 신원 조사를 통해, 아마우 선임행정관이 가지고 있는 선도부장님에 대한 감정이 위험 수위에 다다랐다고 판단했습니다. 명백하게 아마우 선임행정관은 선도부장님에 대해 상사로서의 존경심이 아닌 동성애적 연애 감정을 가지고 있으며, 정보부는 그녀의 편집증적인 성격을 감안할 때 아마우 아코가 선도부장님에 대한 납치, 감금 등의 위험한 시도를 할 가능성이 높다고 분석했습니다.\n\n합리적인 대안은 우리 정보부에서 새로운 선임행정관을 선출할 수 있도록 해 주시는 것입니다. 우리 정보부는 합리와 이성을 바탕으로 선도부장님의 곁에서 충성을 다할 것이며, 예산을 타 먹는 것 외에는 아무것도 하지 못하는 기획부의 책상물림 아마우 아코와는 달리..."
 GEH.flavor_event.16.a: "\"...아코를 도대체 뭐라고 생각하는 거야?\""

 GEH.flavor_event.17.t: "정보부 요청 - 안톤 드렉슬러 뒷조사의 안"
 GEH.flavor_event.17.desc: "[GEH.GetLeader] 선도부장님께\n\n선도부 정보부는 도이칠란트 국가사회주의 운동의 시작이 안톤 드렉슬러라는 현지인에게서 시작되었다는 것을 알게 되었습니다. 그는 나치당의 설립자이며, 아돌프 히틀러의 오랜 정치적 동료였으나 '대전이'로 인해 베를린이 소멸하던 때 바이에른 뮌헨에 거주하고 있었기에 여전히 우리 국가에 남아 있는 상태입니다.\n\n다른 사람도 아닌 나치당의 창립자가 게헨나 내부에서 버젓이 돌아다니고 있다는 것은 매우 위험한 일입니다. 우리 정보부는 그가 나치당 당원 조직, 그리고 국방군과 협력해 게헨나에 대한 체제 전복 운동을 벌일 경우 나치의 사상적 구심점이 될 가능성이 높다고 판단했습니다.\n\n선도부장님께서 안톤 드렉슬러를 조사하는 문제를 진지하게 고려해 주시기를 바랍니다."
 GEH.flavor_event.17.a: "그래, 팔을 걷고 조사를 해 봐야겠어."
 GEH.flavor_event.17.b: "그가 정말 위험한 인물이었다면 뮌헨이 아닌 베를린에 있었겠지."

 GEH.flavor_event.18.t: "정보부 조사 - 안톤 드렉슬러 뒷조사의 안"
 GEH.flavor_event.18.desc: "[GEH.GetLeader] 선도부장님께\n\n우리 정보부는 안톤 드렉슬러에 대한 면밀한 조사를 거쳤습니다만...\n\n대전이 이후 그가 나치당 재건을 위해 어떠한 정치적, 사회적 운동도 하지 않고 있다는 것을 확인했습니다. 그는 대전이 이후 국가사회주의의 실현에 대한 모든 기대를 접은 것으로 보입니다. 안톤 드렉슬러는 하루의 대부분을 뮌헨의 술집에서 보내며, 우리 정보부원들은 고작 도이치인들이 마시는 맥주 브랜드와 부어스트 요리의 리스트만을 보내 왔을 뿐입니다...\n\n선도부장님께 면목 없는 일이지만 우리 정보부는 무의미한 곳에 인력을 낭비한 것 같으며, 이로 인해 선도부원들의 불만이 올라가고 있습니다."
 GEH.flavor_event.18.a: "...반성문 200장을 제출하도록."

 GEH.flavor_event.19.t: "정보부 조사 - 협력적 현지인 조직과 개인"
 GEH.flavor_event.19.desc: "[GEH.GetLeader] 선도부장님께\n\n정보부, 기획부, 실행부, 의료부 우리 선도부의 모든 부서들은 현지인들이 키보토스계에 적대적이며, 근본적으로 신뢰할 수 없는 집단이라는 판단을 내렸습니다. 그럼에도 불구하고 일부 현지 세력들은 협력적이며 게헨나 통치에 방해가 되지 않을 것으로 보입니다.\n\n도이칠란트 사회민주당은 바이마르 공화국 시기 내내 무능력한 모습을 보여 온 현지인 세력입니다. 현재 게헨나 내부에서 카리스마 있는 지도자 없이 파편화된 정당 조직으로 활동하고 있습니다. 이들은 하누마 마코토 이상으로 멍청하기 때문에 결코 선도부 정치에 직접 관여하도록 해서는 안 됩니다. 다만 그들의 요구를 들어주는 것처럼 행동한다면 현지인 노동자들의 지지를 끌어낼 수 있을 것으로 보입니다.\n\n바이에른 지방에는 다양한 예술인들이 대전이 이후 이주한 상태이며, 그들은 정치적 요구를 하지 않기 때문에 안전합니다. 현지 예술인들과의 협력은 게헨나가 문화적 화합을 신경쓰는 학원이라는 이미지 메이킹을 하는 것에 도움이 될 것으로 보입니다. 리하르트 슈트라우스는 가장 우리에게 협력적인 작곡가입니다."
 GEH.flavor_event.19.a: "나쁘지 않은 정보네."

 GEH.flavor_event.20.t: "정보부 보고 - 위협적인 도이치인들의 움직임"
 GEH.flavor_event.20.desc: "[GEH.GetLeader] 선도부장님께\n\n히나 부장님께서 아마우 아코 선임행정관과의 연애 소식을 공식화하신 이후, 현지인들의 분노와 당혹이 임계점에 다다르려 하고 있습니다.\n\n우선 도이칠란트의 주도적인 신앙인 가톨릭과 프로테스탄트는 모두 히나 부장님과 선임행정관의 연애를 공식적으로 비난하고 있습니다. 현지인들의 신앙은 부장님의 연애를 긍정하지 않으며, 중요 성직자들이 현지인들을 선동하고 있다는 점이 위협적입니다.\n\n다음으로는 정치 세력의 반발입니다. 현재 게헨나에서 불법화된 공산당, 국가사회주의 독일 노동자당과 합법 정당인 중앙당, 국가인민당이 모두 어제 공동으로 정부를 비난했습니다. 유일하게 부장님을 지지한 현지 정당은 사회민주당 뿐이지만, 이는 부장님의 신임을 얻어 게헨나 중앙 정치에 합법적으로 개입하고자 하는 음험한 목적이 있는 것으로 보여 신뢰할 수 없습니다.\n\n종교계와 정치 지하조직 모두 탄압이 필요합니다만, 우선순위를 정할 필요가 있습니다. 저희 정보부는 도이치의 지하조직들이 사회 혼란을 틈타 지상으로 올라온 지금, 현지 지도자들을 일망타진할 기회로 삼아야 한다고 판단했습니다. 역으로 기획부의 기술관료들은 세무조사를 통해 현지 종교인들을 압박하는 것을 제안했습니다.\n\n행정력의 한계로 양쪽 모두를 동시에 시행할 경우 효과가 반감될 것으로 예상됩니다. 부장님께서 적절한 결정을 내려주시기 바랍니다."
 GEH.flavor_event.20.a: "현지 정당들을 파괴하는 데 집중하도록."
 GEH.flavor_event.20.b: "기획부가 종교인들을 부수도록 내버려 두자고."
 
 GEH.flavor_event.21.t: "정보부 보고 - 현지인 노동자 총파업"
 GEH.flavor_event.21.desc: "[GEH.GetLeader] 선도부장님께\n\n히나 부장님의 연애 소식을 기점으로 현지인들의 반발이 거세지면서, 나치와 공산당 두 조직의 물밑 동맹이 점점 굳건해지고 있습니다. 두 머저리들은 우선 우리의 합법적인 게헨나 정권을 붕괴시킬 때까지 서로 협력한 뒤 그 이후 도이치의 지배권을 두고 경쟁하기로 합의한 것으로 보입니다.\n\n공산주의자들과 나치는 현지 노동자들을 선동하여 총파업을 선동하고 있으며, 현지인 노동자 조직들은 이에 동조하기 시작했습니다. 실행부에서는 총알을 이용한 '빠른' 해결을 요구하고 있으나, 이는 파업의 규모를 걷잡을 수 없을 정도로 확대시킬 우려가 있습니다. 이 문제에 대한 더욱 조심스러운 접근이 필요합니다.\n\n기획부는 사회민주당을 이용하는 방안을 논의했습니다. 도이칠란트 사회민주당은 나치-공산 동맹에 참여하지 않고 있으며, 우리와 협력하는 것으로 게헨나에서의 정치적 영향력을 확대할 수 있을 것이라는 순진한 믿음을 이어가고 있습니다. 사회민주당에게 지역 의회에서의 더 많은 권리 약속과 함께 노동자 파업 문제의 중재를 요청한다면 그들은 총파업 저지를 위해 최대한의 노력을 아끼지 않을 것입니다.\n\n우리 정보부에서는 공산주의자들과 나치 사이의 분열을 조장하는 방안이 논의되고 있습니다. 그들은 바이마르 공화국 시기부터의 적대 관계였으며 게헨나 체제 전복을 위해 아슬아슬한 동맹을 이어가고 있을 뿐입니다. 나치에게는 공산주의자들이 나치 가담자들의 신원을 팔고 있다는 정보를, 공산주의자들에게는 정 반대 정보를 퍼트린다면 두 멍청이들의 동맹은 자연스럽게 와해될 것입니다."
 GEH.flavor_event.21.a: "약속에는 돈이 들지 않지, 기획부의 계획대로 진행해."
 GEH.flavor_event.21.b: "그 멍청이들이 자멸하도록 만들어."
 
 GEH.flavor_event.22.t: "정보부 보고 - 기독교 총궐기"
 GEH.flavor_event.22.desc: "[GEH.GetLeader] 선도부장님께\n\n히나 부장님의 연애 소식을 기점으로 현지인들의 반발이 거세지면서, 기독교 세력의 연합이 점점 강성해지고 있습니다. 바티칸 교황은 공식적으로 선도부를 적그리스도 조직으로 선언하였으며, 여러 주교와 신부, 목사들이 게헨나에 대한 도이치인들의 저항을 촉구하고 있습니다.\n\n실행부는 도이칠란트에 거주하는 모든 종교인들을 교도소에 처넣어야 한다고 요구하고 있지만, 이는 우리의 행정력과 교정기관이 수용할 수 있는 인구로 분석해 볼 때 현실적으로 실현 불가능한 방법입니다. 기획부와 정보부는 각자 별도로 현지인 종교 저항에 대응할 방법을 논의하였습니다.\n\n기획부는 시위에 참여한 성직자들을 체포한 뒤, 국적을 박탈해 전원 국외로 추방하는 방안을 제안했습니다. 선임행정관은 어디까지나 이는 '소규모 성직자 추방'에 불과하기 때문에 인구 감소와 국력 손실이 크지 않을 것이라고 주장하고 있습니다.\n\n우리 정보부에서는 게헨나계 인구를 고용해 관제 시위를 하는 것을 제안하고자 합니다. 게헨나계 인구는 사실 폭력과 혼돈을 펼칠 수 있기만 하다면 그 동기가 무엇이든 크게 따지지 않습니다. 총기 규제로 인해 스트레스가 쌓여 있는 게헨나 학생들에게 야구방망이와 망치를 쥐어주고 시위 현장에 풀어놓는다면, 시위에 참여한 종교인의 90퍼센트 이상에게 다시는 반정부 시위에 참여할 수 없는 영구적 장애를 남길 수 있을 것입니다. 이는 선임행정관의 제안보다 훨씬 낮은 비용과 행정력을 필요로 하면서도, 기독교도들의 시위 재발을 막을 수 있는 합리적인 대안이 될 것입니다."
 GEH.flavor_event.22.a: "야구방망이? 망치? ...하아, 됐으니까 아코의 제안서를 가져와."
 GEH.flavor_event.22.b: "학생들을 풀어. ...하지만 둔기는 허락할 수 없겠어."
 
 GEH.flavor_event.23.t: "게헨나-밀레니엄 야구 친선경기"
 GEH.flavor_event.23.desc: "대전이 이후 현지 국가들에 의해 키보토스 국가들이 둘러싸이면서, 키보토스 국가들간의 협력과 우애를 다지기 위한 민간 수준에서의 외교 운동도 활발하게 진행되었다. 이번 게헨나-밀레니엄 야구 친선 경기 역시 민간단체들간의 협력을 통해 주최되었으며 밀레니엄을 대표하는 야구팀으로는 밀레니엄의 프로 야구 구단인 코기 브레이브스가, 게헨나는 선도부원들로 이루어진 야구 동호회 팀이 경기에 참여했다.\n\n이번 경기에서 코기 브레이브스는 초반부터 불안한 경기력을 보이며 게헨나 야구 동호회에게 큰 점수차로 밀리기 시작했다. 프로 구단이라는 것을 신뢰하기 어려운 코기 브레이브스의 이해할 수 없는 전략은 관중석에 모인 밀레니엄 시민들을 점점 격분하게 만들었다. 결국 4회 초 코기 브레이브스:게헨나 야구 동호회의 점수가 0:28까지 벌어지면서 분노가 임계점에 다다랐다. 밀레니엄의 야구를 지금껏 경험한 적 없었던 프랑스인 관중들이 먼저 펜스를 뛰어넘어 경기장에 뛰어들었고 그 뒤로 밀레니엄 학생들이 경기장에 난입하면서 경기는 중단되었다. 게헨나와 코기 브레이브스 선수들이 모두 도망친 이후, 파리 시민들과 밀레니엄 학생들이 경기장을 점거하고 시설을 파괴하기 시작했으며 격분한 일부 프랑스인들은 코기 브레이브스 소속의 선수단 버스를 전소시켰다.\n\n경기를 취재하러 온 크로노스 신문 기자는 상당히 냉소적인 어조로 '대전이 이후 프랑스인들과 밀레니엄인들이 이렇게나 깊은 우정을 다진 것은 처음이다. 이것은 이미 게헨나와 밀레니엄의 친선이 아닌 프랑스와 밀레니엄의 친선 경기가 되었다'고 조롱했다. 심화되는 폭동으로 인해 경기를 재개하는 것이 불가능해지면서, 시합은 4회 초 콜드 게임 종료로 선언되었다."
 GEH.flavor_event.23.a: "다시는 밀레니엄과 야구를 같이 하는 일은 없겠군."

 GEH.flavor_event.24.a: "...아이고 머리야..."

 GEH.flavor_event.25.t: "아무 일도 없었어"
 GEH.flavor_event.25.desc: "안...녕하세요, 히나 부장님. 제가 어제 귀가 후에 와인을 조금, 정말 조금만 마셨는데... 이후에 필름이 뚝 끊기고, 제가 부장님에게 전화통화를 몇 분 정도 한 기록만 남아 있어서... 네. 전화를 건 기록은 있습니다만, 전화를 걸어서 무슨 말씀을 드렸는지는 기억이 나지 않습니다.\n\n혹시 제가 그 날 실례되는 말을 하지는 않았는지 걱정이 되어서... 화가 나시지는 않으셨나요? 혹시 제가 술주정이라도 부린 거라면 반성문이라도 제출하겠습니다."
 GEH.flavor_event.25.a: "\"...별 일 없었어. 그러니까 그냥... 그 날 이야기는 꺼내지 마.\""

 GEH.flavor_event.26.t: "유리조노 세이아의 죽음"
 GEH.flavor_event.26.desc: "대전이 사건이 일어나기 전까지만 해도, 게헨나와 트리니티는 총학생회장의 중재 아래에서 평화협정인 '에덴 조약'을 추진하고 있었다. 게헨나에서는 히나가, 그리고 트리니티에서는 티파티가 주도적으로 평화협정을 공동으로 진행했다. 그렇기에 히나는 대전이 이전 실무 협상 과정에서 총학생회장과 함께 세이아를 몇 번이나 만나본 적 있었다. 히나에게 있어서 세이아는 깊은 지혜를 가진 현인이었으며, 대전이 이후의 트리니티를 이끌 수 있는 가장 합리적인 인물이었다.\n\n\"세이아 씨가 죽었다면... 그래. 에덴 조약이 재개될 가능성은 거의 없겠군.\"\n\n애초에 대전이 이후 에덴 조약에 대한 실무 협의를 비롯한 모든 협상은 중단된 상태였다. 하지만, 세이아의 죽음은 히나에게 있어서 에덴 조약 재개에 대한 마지막 희망을 파괴한 것이나 마찬가지였다. 히나는 깊은 한숨을 내뱉으며, 컴퓨터를 켰다. 티파티 호스트 나기사의 곁에 늘 함께 했던, 현명했던 한 사람을 위한 추도사를 보내기 위하여."
 GEH.flavor_event.26.a: "히나는 그녀의 죽음이 트리니티를 어떻게 바꿀 것일지 걱정했다."

 GEH.flavor_event.27.t: "유리조노 세이아 서거에 대해 - 소라사키 히나의 추도문"
 GEH.flavor_event.27.desc: "키리후지 나기사 씨에게.\n\n우선 직접 트리니티를 방문하지 못하고 추도문을 편지로서만 보내는 것에 깊은 사과 드립니다.\n\n고귀한 티파티의 일원이시자 개혁가이신 유리조노 세이아 님의 비보를 접한 것은 실로 충격과 슬픔이 교차하는 순간이었습니다. 그녀의 생애는 트리니티를 향한 헌신 그 자체였으며, 그 누구보다도 조화를 추구하고 평화를 염원한 이였습니다. 우리 게헨나 선도부 역시 그녀가 극단주의의 어리석은 폭력 앞에 쓰러졌다는 사실에 깊은 분노와 애도를 느끼고 있습니다.\n\n세이아 님은 언제나 트리니티 학생들의 목소리에 귀 기울이며, 단지 이상이 아닌 실천 가능한 정책을 통해 현실 속의 희망을 제시해 온 분이였습니다. 그녀는 상투스 분파만이 아닌 트리니티의 모든 분파를 초월하여 학원 전체의 신뢰를 얻은 분이셨으며, 마치 미래를 내다보는 것 같은 날카로운 통찰과 온화한 품성으로 많은 이들의 존경을 받아왔습니다.\n\n세이아 님을 포함한 티파티 분들과 함께, 총학생회장의 중재 아래에서 '에덴 조약'을 추진했던 기억이 납니다. 세이아 님은 총학생회장의 의견을 누구보다도 깊이 생각하며 두 학원의 평화가 가져올 아름다운 미래를 깊이 생각하셨습니다. 그 분이 꿈꾸셨던 게헨나와 트리니티의 평화가 앞으로도 계속되기를 바랍니다.\n\n오늘 상투스 분파는 지도자를 잃었지만, 동시에 한 시대의 이상과 신념을 기억하게 됩니다. 유리조노 세이아 님의 이름은 결코 잊히지 않을 것이며, 그녀의 뜻과 비전은 트리니티와 세계의 많은 이들의 가슴 속에 길이 남아 이어질 것입니다.\n\n삼가 고인의 명복을 빌며, 트리니티의 모두에게 진심 어린 위로의 말씀을 전합니다.\n\n- 게헨나 선도부 선도부장 소라사키 히나."
 GEH.flavor_event.27.a: "나기사는 세이아와의 추억을 떠올리며 숨죽여 울었다."

 GEH.flavor_event.28.t: "베르톨트 브레히트가 게헨나에 오다!"
 GEH.flavor_event.28.desc: "아돌프 히틀러 정권 반대 운동을 하다 덴마크 친구의 집으로 도주했던, 유명한 희곡 작가인 베르톨트 브레히트가 오늘 도이칠란트의 바이에른에 귀국했다. 트리니티와 만마전이라는 두 선택지를 배제하고 브레히트가 게헨나 선도부의 통제권인 바이에른을 선택한 이유에 대해 많은 추측들이 오가고 있다. 기자들에게 밝힌 브레히트의 공식적인 주장은 '바이에른의 아름다운 자연'일 뿐이지만, 문학계에서는 브레히트의 좌익 성향을 원인으로 추측한다. 게헨나 선도부는 '대전이' 이후 현재 사회민주당을 비롯한 좌익 정당들이 (비록 지방정부에 한해서이지만) 합법적으로 활동하는 유일한 지역이다.\n\n대전이 이후 키보토스 문화가 브레히트의 문학 세계에 영향을 주었는지를 묻는 크로노스 언론과의 인터뷰에서 브레히트는 키보토스의 유명 게임인 '테일즈 사가 크로니클'을 언급했다. 고의적으로 삽입된 것으로 보이는 개연성 없는 설정과 앞뒤가 맞지 않는 문장, 그리고 유저가 게임에 몰입할 수 없도록 만드는 대사들은 브레히트의 극찬의 대상이 되었다.\n\n\"문화예술은 관객이나 독자가 그 작품 속 인물들에 '감정이입'을 하도록 만들어져서는 안 됩니다. '변증법적 유물론'에 따라 예술은 감상하는 사람이 감정이 아닌 이성을 사용해 비참한 우리들의 현실을 인식하고 비판하기 위한 도구로 사용되어야만 합니다. 테일즈 사가 크로니클은 게이머가 결코 게임에 공감할 수 없도록 만들어졌기 때문에, 제가 주장해 온 예술론이 키보토스에서도 동일하게 통용되고 있었다는 것을 알게 해 주는 매우 흥미로운 게임입니다.\"\n\n브레히트는 대전이로 인한 충격이 유럽에 큰 상처를 주었음을 인정하면서도, 게헨나에서 키보토스 문화와 유럽 문화가 서로 조화를 이룰 수 있을 것이라고 믿고 있다. 게헨나 선도부는 브레히트의 입국에 아무 공식 성명을 발표하지 않았지만, 히노미야 치나츠는 크로노스 언론과의 인터뷰에서 \"테일즈 사가 크로니클에 대해 뭔가 오해하시는 것 같다\"는 짧은 인터뷰를 남겼다."
 GEH.flavor_event.28.a: "그래서 변증법적 유물론이 뭔데?"

 GEH.flavor_event.29.t: "억척어멈과 그 자식들"
 GEH.flavor_event.29.desc: "좌익 성향의 희곡 작가인 베르톨트 브레히트의 새 희곡 '억척어멈과 그 자식들(Mutter Courage und ihre Kinder)'은 명백하게 미소노 미카의 국가사회주의 독재 정권을 비판하고 있는 작품이다. 17세기 유럽의 '30년 전쟁'을 배경으로 하는 이 희곡은 전쟁을 통하여 부를 얻으려고 하는 억척어멈의 이야기를 통하여 국가사회주의를 강력하게 비난하고 있다.\n\n브레히트는 억척어멈이 미소노 미카에 대한 은유인 것인지 묻는 게헨나 언론의 인터뷰에 동의하면서, \"히틀러 국가사회주의가 실패했듯이, 파테르 국가사회주의도 같은 결과를 낳을 것\"이라는 냉소적인 논평을 남겼다. 억척어멈과 그 자식들은 우선적으로 게헨나 선도부의 통치권에서만 공연으로 시연되었지만, 곧 영어로 번역되어 신대륙에서도 첫 공연을 앞두고 있다. 뮌헨에서 열린 초연 공연에는 아마우 아코 행정관이 직접 참여했지만, 초연 직후 기자들 앞에서 한 \"솔직히 재미는 없네요\"라는 인터뷰가 물의를 일으키고 있다."
 GEH.flavor_event.29.a: "재미가 없는 것을 어떻게 있다고 말해요."

 GEH.flavor_event.30.t: "빌헬름 2세의 몰락"
 GEH.flavor_event.30.desc: "좌익 성향의 희곡 작가인 베르톨트 브레히트의 새 희곡 '빌헬름 2세의 몰락'은 제1차 세계대전 당시 도이칠란트 제국을 배경으로 하는 매우 논쟁적인 작품이다. 1918년 '킬 군항 반란'을 배경으로 하는 이 희곡은 정신병적 광기에 빠져 도이칠란트 국민들을 전장으로 밀어넣으려는 빌헬름 폰 프로이센과, 그 광기로 인해 스스로 몰락해가는 도이칠란트 황실을 대조해 보여준다. 비록 브레히트가 추구하는 변증법적 유물론에 따른 '현실 비판과 이성적 사회 분석'에만 집중한 탓에 문학적 예술성이 떨어진다는 문단의 비평에도 불구하고, '빌헬름 2세의 몰락'은 게헨나 선도부 전역에서 선풍적인 논란을 일으키고 있다.\n\n논란의 원인은 이 희곡의 빌헬름 2세가 명백하게 소라사키 히나의 은유라는 것이다. 빌헬름 2세는 히나와 똑같은 말투와 행동을 하며, 도이칠란트의 군사 지도자인 에리히 루덴도르프는 노골적일 정도로 아마우 아코처럼 행동한다. 희곡은 군국주의적 광기로 인해 자멸해가는 도이칠란트 제국의 모습을 게헨나 선도부에 그대로 옮겨옴으로써, 선도부의 독재 체제가 도이칠란트 제국처럼 붕괴할 것이라는 강한 은유를 남기고 있다.\n\n빌헬름 2세의 몰락 초연은 합법적으로 진행되었으나, 희곡이 사회적 논란을 끌면서 소라사키 히나의 '친위대'를 자칭하는 열성부원이 움직이기 시작했다. 열성부원들의 공격으로 인해 게헨나 각지의 공연들이 강제로 중단되었으며 베르톨트 브레히트는 익명의 열성부원들로부터 살해 협박 편지를 받았다. 비록 선도부가 공식적으로 이 공연을 금지하거나 브레히트에 대한 수배령을 내리지 않았지만, 브레히트는 '신변의 위협'을 이유로 스위스로 이주하기로 결정했다."
 GEH.flavor_event.30.a: "모욕적이지만, 재미는 있더군."

 GEH.flavor_event.31.t: "트리니티 침략 위기"
 GEH.flavor_event.31.desc: "리하르트 슈트라우스가 피아노 연주를 하는 동안, 그의 제자인 안익태는 불안한 표정으로 슈트라우스의 옆에 서 있었다. 게헨나가 전쟁에 휩싸이고 여러 예술가들이 외국으로 피란을 갈 준비를 하고 있었지만, 슈트라우스는 이 위기 속에서도 게헨나를 떠날 생각이 없는 것처럼 보였다.\n\n\"교수님은 이곳에 남으실 생각이신가요?\"\n\n안의 질문에, 슈트라우스는 당연한 이야기라는 듯 웃었다.\n\n\"내 제자들이 이곳에 있는데, 교수가 어떻게 이 땅을 떠날 수 있겠나. 하지만 자네는 전쟁이 끝날 때까지 피신할 수 있지 않나.\"\n\"저는 이 게헨나가 저에게 가르쳐 준 예술적 영감이 좋습니다. 자유롭고, 어떨 때에는 무질서하지만... 그렇기에 무한한 창작의 영감을 주는 땅입니다.\"\n\"...나에게도 그렇네. 트리니티는 훨씬 질서 정연하지만, 내 선율과는 맞지 않는 군.\"\n\n슈트라우스는 무거운 표정을 한 안을 돌아보았다.\n\n\"자네가 게헨나에 대한 애정이 있다면, 게헨나를 위한 방송 등에 출연해보는 건 어떻겠나?\"\n\"방송 말씀이신가요?\"\n\"그저 음악을 연주하는 것만으로도 충분하네. 이 땅의 사람들을 위로하기 위한 곡을 절실하게 원하는 이들이 무척이나 많이 있으니. 내게도 제안이 왔네만... 나보다는 젊고 열정적인 자네가 그 자리에 더 어울릴 거라 생각하네.\""
 GEH.flavor_event.31.a: "각자의 자리에서, 게헨나를 위해"

 GEH.flavor_event.32.t: "분열을 일으키는 피아노 선율"
 GEH.flavor_event.32.desc: "도이칠란트의 전설적인 작곡가, 리하르트 슈트라우스의 제자로 알려진 안익태는 최근 게헨나 선도부에서 운영하는 선전 라디오 방송에 고정 출연하며 도이칠란트의 전통 민요들을 피아노로 연주하고 있다. 안의 방송은 열정적인 선전도, 미사여구가 붙어 있는 선동적인 비난도 존재하지 않지만, 우리가 징집한 도이칠란트 현지인들에게 큰 동요를 일으키고 있는 것으로 보인다 - 바로 '도이칠란트의 형제들이 서로를 죽이고 있다'는 사실을 알려주는 것으로.\n\n우리 장교들이 안의 피아노 방송을 듣는 것을 명시적으로 금지하였음에도 불구하고, 안의 방송이 전선에 있는 우리 군사들에게 향수병과 형제애를 불러 일으키고 있는 것은 분명하다. 이미 전선에서 일부 병사들이 탈영을 시작하였으며, 우리는 안의 방송에 대응하기 위하여 병사들의 라디오 청취를 더욱 엄격하게 감시할 예정이다."
 GEH.flavor_event.32.a: "...게헨나를 점령한 뒤, 안을 반드시 총살할 것이다."

 GEH.flavor_event.33.t: "엘리베이터가 고장난 것도..."
 GEH.flavor_event.33.desc: "\"선도부 안에 제 적들이 있는 게 분명해요. 어제는 탕비실에서 쿠키를 꺼냈는데 쿠키가 바싹 타 있었고, 이틀 전에는 엘리베이터가 고장나는 바람에 사무실까지 걸어서 계단을 오르내렸고, 게다가 사흘 전에는 제 노트북에 랜섬웨어가...\"\n\n아코의 재잘거리는 소리를 들으며, 카를 융은 태블릿 PC에 그녀의 끝없이 이어지는 불평불만들을 펜으로 정리해 나갔다. 지금까지 히스테리적인 성격을 가진 사람들을 많이 만나 왔지만, 아코는 카를 융이 만나온 모든 사람들 중 가장 '강적'이었다.\n\n도대체 게헨나 선도부는 어떤 업무량을 가지고 있기에, 이 소녀를 이정도까지 히스테릭하게 업무로 몰아붙일 수 있었단 말인가. 융은 끝없이 이어지는 '선도부 내부의 적 음모론'을 잠시 끊으며 차분하게 입을 열었다. 어디까지나 이 자리는 스트레스 해소를 위해 아코가 먼저 요청한 심리 상담 서비스였다. 그녀의 이야기를 충분히 들었으니, 분석심리학적으로 진단을 내리고 그녀의 스트레스를 덜어 줄 방법을 찾아야 했다.\n\n\"아코 씨가 주변의 사소한 사항들을 전부 '적의 음모'라고 생각하게 된 이유는, 무의식에서 찾을 수 있습니다. 예를 들면...\""
 GEH.flavor_event.33.a: "이 상담이 그녀의 스트레스를 조금은 덜어주기를"

 GEH.flavor_event.34.t: "게헨나 수영 훈련"
 GEH.flavor_event.34.desc: "\"어푸어푸 꼬르륵...\"\n\"부장님!!!!!\"\n\n소라사키 히나가 수영을 잘 하지 못한다는 것은 모두가 알고 있었지만... 이 정도로 못 할 거라고 상상한 사람은 없었다. 바이에른의 작은 호수에서 이루어진 전투수영 훈련에서 용기를 내어 물에 뛰어 들어간 히나는 1m도 헤엄치지 못한 채 그대로 호수 밑을 향해 가라앉았다. 당황한 아코가 호수에 따라 들어가려는 것을 막으며, 미리 대기중이던 안전요원들이 급하게 히나를 구조했다.\n\n히나는 물을 많이 마시고, 부끄러움 때문에 눈가에 눈물이 조금 맺히기는 했지만 안전하게 호수 바깥으로 구조되었다. 다만 호수에서 진행될 예정이던 선도부 특별 합숙 훈련은 이 소동 속에서 중단되었다. 그리고 소라사키 히나는 아무리 얕은 개울가에 가더라도 반드시 튜브를 써야 한다는 부끄러운 선도부 규정이 한 줄 추가되었고.\n\n\"...규정까지 명문화해서 추가할 필요까지는 없지 않았을까, 아코?\"\n\"...부장님이 호수에서 딱 3초라도 버티셨으면 이렇게까지는 안 했을 거예요.\""
 GEH.flavor_event.34.a: "솔직히 반박할 말은 없었다..."

 GEH.flavor_event.35.t: "도이칠란트 내부 신앙 세력"
 GEH.flavor_event.35.desc: "도이칠란트에는 크게 두 개의 종교적 세력이 존재하며, 그들은 카톨릭과 프로테스탄트로 분류됩니다. 그들은 모두 도이칠란트의 현지 종교 세력이며, 바티칸의 교황의 명령을 따르는가 그렇지 않는가에 따른 정치적 차이가 있기는 하지만, 게헨나 정부의 통치에 적대적이라는 공통점을 가지고 있습니다.\n\n카톨릭 교회와 프로테스탄트 교회는 모두 여성의 권리를 '좋은 아내, 좋은 어머니'로만 한정지으며, 키보토스의 학원국가들처럼 여성들이 정치를 주도하고 남성들이 배제되는 사회에 대해 매우 부정적 인식을 가지고 있습니다. 그들의 종교적 인식이 변화하기 위해서는 한 세대 이상의 시간이 소요될 것으로 예상되므로, 선도부 실행부 측에서는 현지 종교인들에 대한 '무자비한' 탄압만이 유일한 해답이라고 주장합니다.\n\n현실적으로 게헨나 인구의 다수를 차지하는 프로테스탄트와 카톨릭 인구에 대한 무자비한 탄압은 어렵기 때문에, 상대적으로 온건한 형태의 종교 탄압이 실시될 것입니다. 중요한 것은 우리가 현재의 키보토스계 중심 체제를 도이칠란트에서 유지하기 위해서는 그들과 어떠한 타협도 불가능할 것이라는 점입니다. 이는 비극적이지만, 바꿀 수 없는 종교적 간극이기도 합니다."
 GEH.flavor_event.35.a: "그들이 원한다면, 그들은 순교자가 될 수 있을 것이다."

 GEH.flavor_event.36.t: "게헨나의 통치를 반대하는 야당"
 GEH.flavor_event.36.desc: "선도부 통치 지역에서 합법적으로 활동하는 정당은 크게 세 개로 나눌 수 있습니다. 첫 번째는 사회민주당입니다. SPD라고 요약되는 그들은 지방의회에서 의원들을 선출하며, 적어도 게헨나 통치자들이 이전의 히틀러보다 낫다는 점에 동의합니다. SPD는 가장 협력적인 정당이므로 게헨나에 의한 도이칠란트 통치에 방해가 되지 않을 것입니다.\n\n문제는 두 개의 지방의회 야당인 도이칠란트 중앙당과 바이에른 인민당입니다. 중앙당과 인민당은 모두 보수 우익 성향의 정당들로, 경제적 보수주의를 택하는가 종교적 보수주의를 택하는가에 따른 노선 차이가 있으나, 두 정당 모두 게헨나를 식민 통치자로 본다는 공통점이 있습니다.\n\n불법 정당인 나치당과 공산당과 달리 중앙당, 인민당은 지방의회에서의 합법적인 노선 하에서만 활동을 이어가기에 여전히 우리 사회에서의 활동을 허가받고 있지만, 장기적으로 그들이 지방 의회에서 영향을 늘리지 못하도록 사회민주당에 대한 지원을 이어갈 필요성은 있습니다.\n\n한 가지 다행인 점이라면, 인민당과 중앙당이 서로의 지지율을 빼앗아 오기 위해, 게헨나만이 아니라 서로를 물어뜯고 있다는 점입니다. 두 정당의 지지층은 매우 겹치기 때문에, 인민당과 중앙당이 협력하는 일은 나치당과 공산당의 협력보다도 가능성이 낮을 것입니다."
 GEH.flavor_event.36.a: "마치 미식연과 온천개발부가 힘을 합치지 못하는 것과 같군"

 GEH.flavor_event.37.t: "바이에른 가톨릭 시위"
 GEH.flavor_event.37.desc: "1935년의 대전이 이후 바이에른 지역을 선도부가 점령한 이후, 현지 루터교 종교 지도자인 한스 마이저에 의한 '게헨나 추방 가두시위'가 벌어졌습니다. 마이저는 히틀러 정권에 가장 타협적이었던 루터교 지도자로 알려져 있어 그가 주도하는 가두시위의 목적성에 대해 선도부 정보부는 매우 깊은 의구심을 품고 있습니다.\n\n이번 가두시위에는 3천명의 프로테스탄트가 바이에른 전역에서 참여하였으며 산발적인 폭력 시위가 발생했습니다. 정보부는 마이저가 더 이상 바이에른에서 영향력을 떨치지 못하도록 국외로 추방해야 할 것을 주장하고 있지만, 실행부는 한스 마이저를 아주 오랫동안... 지하감옥에 처박아 놓을 기회라고 생각합니다."
 GEH.flavor_event.37.a: "그는 범죄조직의 수장이다. 20년형을 선고한다."
 GEH.flavor_event.37.b: "게헨나에 있을 필요가 없는 인물이다. 국적을 말소하고 추방하라."
 #Hans Meiser

 #event 1~ 아코 루트

 GEH.event.1.t: "두 사람의 관계성"
 GEH.event.1.desc.a: "어색한 분위기 속에서 히나는 아이스티를 한 모금 마셨다. 다른 사람도 아닌 그 테러리스트 하루나에게 상담을 요청한다니, 터무니 없는 일이었지만. ...이 이야기는 선도부 내의 사람에게 할 수 있는 이야기는 아니었다.\n\n\"사실 나는 친구가 많지는 않아. 그렇기 때문에 고민 상담을 할 사람도 너 정도밖에 없고. ...또 너희 미식연구부는 부원들끼리의 관계도 무척 돈독한 것으로 알고 있으니까.\"\n\"어머, 히나 씨가 저희를 그렇게 고평가 해 주실 줄은 몰랐네요.\"\n\"거두절미하고. ...아코가 선도부 내에서 고립되어가고 있어.\"\n\"네. 저도 선도부 내부 개혁 소식은 잘 알고 있습니다. 히나 씨의 권한을 기획부와 아코 씨가 분담하는 내용이었지요. 분명 히나 씨도 거기에 동의하신 것으로 알고 있습니다만... 다른 부서들에서 반발이 나오는 모양이죠?\"\n\"단순한 *반발*이었다면 상담을 부탁하지 않았을 거야. 다른 부서에서는 아코가... 그러니까, 나에 대한 *부적절한* 감정 때문에 선도부장을 사유화하려 한다고 주장하고 있어.\"\n\n최대한의 완곡한 표현. 그 단어의 뜻을 되짚어보려는 듯, 하루나는 천천히 자기 몫의 아이스티 잔을 손가락 끝으로 쓰다듬었다. 그리고, 마치 히나를 떠보려는 것처럼 웃었다.\n\n\"히나 씨는 어떻게 생각하시나요? 아코 씨가 당신을 사랑한다고 생각하시나요?\"\n\"... 그렇다고 생각해.\"\n\"후후. 좋아요. 다음 질문이예요. 히나 씨도 이번 구조개혁이 아코 씨의 동성애적 욕망에서 비롯되었다고 생각하시나요?\"\n\"아니.\"\n\"즉답이시네요. 예. 상황은 충분히 이해했습니다. 아코 씨는 진심으로 당신을 위해 체제 개혁을 시도하고 있는 거군요. 하지만 이에 대한 음해가 일부분 사실에 근거하고 있기 때문에, 대처할 방법이 없다는 뜻이군요.\"\n\"나는 총을 들고 날뛰는 범죄자를 응징하는 법은 알아. 하지만... 펜을 든 적을 상대하는 법은 배운 적이 없어.\"\n\"그렇다면 한 가지 조언을 해 드려야겠네요.\"\n\n하루나는 의미심장하게 웃었다.\n\n\"아코 씨를 완전히 받아들이거나, 아니면 그녀와의 모든 관계를 단절하고 철저한 사무 관계로만 남거나. 지금의 애매모호한 태도로는 뒷공작을 멈출 방법이 없을 거랍니다. 어떻게 하실 건가요? 직접 아코 씨를 끌어 안고 모든 비난을 대신 맞을 각오가 되어 있으신가요? 아니면 그녀를 철저하게 끊어내는 것도 대안이죠. '선도부장은 선임행정관을 싫어한다.' 역으로 이런 모습을 공개적으로 보여주는 것 역시 뒷공작의 신뢰를 무너트릴 방법이 될 테니까요.\""
 GEH.event.1.desc.b: "어색한 분위기 속에서 히나는 아이스티를 한 모금 마셨다. 다른 사람도 아닌 선도부의 범죄자 카요코에게 상담을 요청한다니, 터무니 없는 일이었지만. ...이 이야기는 선도부 내의 사람에게 할 수 있는 이야기는 아니었다.\n\n\"사실 나는 친구가 많지는 않아. 그렇기 때문에 고민 상담을 할 사람도 너 정도밖에 없고. ...또 너희 흥신소는 부원들끼리의 관계도 무척 돈독한 것으로 알고 있으니까.\"\n\"네 생각만큼 돈독하지는 않아. '대전이' 이후에는 더욱 그렇고.\"\n\"그렇다 해도 선도부보단 낫겠지. ...아코가 선도부 내에서 고립되어가고 있어.\"\n\"응. 나도 선도부 내부 개혁 소식은 조사해 뒀어. 선도부장의 권한을 기획부와 아코가 분담하는 내용이었지. 분명 너도 반대하지 않은 것으로 알고 있는데... 역시 다른 부서가 반발하기 시작한 모양이네.\"\n\"단순한 *반발*이었다면 상담을 부탁하지 않았을 거야. 다른 부서에서는 아코가... 그러니까, 나에 대한 *부적절한* 감정 때문에 선도부장을 사유화하려 한다고 주장하고 있어.\"\n\n최대한의 완곡한 표현. 그 단어의 뜻을 되짚어보려는 듯, 카요코는 아랫입술을 가만히 물었다 놓았다.\n\n\"그래. 그렇다면 역으로 묻지. 히나. 아마우 아코는 당신을 정말 사랑하고 있는 거야?\"\n\"... 그렇다고 생각해.\"\n\"다음. 너는 이번 구조개혁이 아마우 아코의 동성애적 욕망에서 비롯되었다고 생각해?\"\n\"아니.\"\n\"그 정도면 충분히 이해했어. 이번 구조개혁은 아마우 아코의 선의야. 하지만 이에 대한 반발이 존재하고, 그 반발에는 *합리적* 근거가 있기 때문에 무작정 부정하는 게 곤란하다는 말이지?\"\n\"나는 총을 들고 날뛰는 범죄자를 응징하는 법은 알아. 하지만... 펜을 든 적을 상대하는 법은 배운 적이 없어.\"\n\"완벽하진 않겠지만, 조언을 해 줄 수는 있어.\"\n\n카요코는 잠시 고민하다 말했다.\n\n\"첫째. 아마우 아코와 공개 연애를 한다. 아코를 공격하는 선도부원들도 '소라사키 히나'를 직접 비난하긴 어렵겠지. 전자를 선택하는 게 아코 개인에게는 행복할 거야. 하지만 네가 아코에게 개인적 감정이 없다면, 정 반대로 그녀를 끊어버리는 걸 추천하겠어. '선도부장은 아마우 아코를 좋아하지 않는다.' 역으로 이런 모습을 보여주는 것으로도 선도부원들의 뒷공작을 끊어낼 수 있을 테니.\""
 GEH.event.1.a: "\"...내게는 둘 다... 너무 어려운 선택지야.\""
 
 GEH.event.2.t: "만마전 폄하 프로파간다"
 GEH.event.2.desc: "히나는 아코가 직접 작성한 연설문을 읽어보았다. 연설의 내용은 평소 소라사키 히나가 선호하지 않는 프로파간다적인 내용으로 가득 차 있었다. 선도부가 미리 선정한 기자들 앞에서 만마전과 국방군이 협력 관계를 맺으려 시도한 것을 비난하고, 국방군이 과거 충성하던 아돌프 히틀러가 얼마나 악랄한 인물이었는지 고발한 사민당 정치인들의 말을 인용한다. 최종적으로는 만마전을 히틀러와 동일시하는 내용의 고발문이었다.\n\n연설 자체는 상당히 수려한 문장으로 적혀 있었다. 문제는 히나의 평소 스타일과는 다른 선동적인 문구, 격정적인 문장들이 많이 채워져 있다는 점이었다. 동기는 알 수 있었다. 히나를 잘 모르는 보수적인 도이치인들에게 '강한 지도자'로서의 이미지를 심어주기 위해서겠지. 하지만 이 대본을 따라하는 건 내키지가 않았다. 이건 히나의 스타일이 아니었다.\n\n\"나는 대중정치인이 아니야. 내가 기자들 앞에서 팔 휘두르며 선전 활동 하는 사람도 아니고.\"\n\n치나츠가 고개를 저었다.\n\n\"하지만 선임행정관께서 부장님을 위해 작성하신 겁니다. 그냥 눈 감고 읽어주시면 안 될까요?\""
 GEH.event.2.a: "\"좋아. 인터뷰 일정을 잡아 줘.\""
 GEH.event.2.b: "\"이 글을 신문에 내 이름으로 올려. 하지만 연설은 허락 못 해.\""
 
 GEH.event.3.t: "히나 부장을 위한 '과두제'"
 GEH.event.3.desc: "\"며칠간 내 앞으로 서류가 한 건도 올라오지 않았는데, 혹시 무슨 일이라도 있는 건지 알 수 있을까?\"\n\"히나 부장님의 업무를 덜어드리기 위해, 소소한 정책 서류는 기획부에서 처리하자는 데 합의하셨잖아요?\"\n\"그거는 그랬지. 하지만 모든 업무가 사소한 업무는 아닐 텐데.\"\n\"부장님이 직접 처리하셔야 하는 업무는 중대한 업무 뿐이죠.\"\n\n아코는 옅은 미소를 지으며, 몇 장 남지 않은 히나의 업무 서류를 책상에 내려놓았다. 이미 기획부에서 모든 문서를 처리해 놓은 국방군 게릴라 소탕 작전안.\n\n\"이것도 사소한 서류라 제가 직접 처리했어요. 다만 군권은 부장님께서 갖고 계시니까, 밑에 서명만 해 주시면 되요.\"\n\n히나는 서류를 쥐었다. 투입될 인력부터 작전 계획까지 전부 아코의 손이 닿아 있었다. 히나가 해야 할 일은 하나. 끝에 서명 한 줄을 적는 것 뿐이다. 한 순간 히나의 머릿속에 '꼭두각시'라는 단어가 떠올랐다. 업무를 분담하겠다고는 했다. 하지만 이걸 정말 분담이라고 할 수 있는 건가?\n\n'아코. 권력을 독점하고 싶은 것 뿐이라면, 그냥 내 헤일로가 깨질 때까지 납탄을 박아. 여기서 죽어 줄 테니까.'\n\n...그렇게 빈정거리고 싶은 마음이 일순간 욱 하고 올라왔지만.\n\n- 아코가 정말 권력 때문에 이런 행동을 했을 리가 없잖아.\n\n그녀를 향한 히나의 깊은 신뢰가, 충동적으로 터져나올 뻔 한 가시를 아슬아슬하게 막아냈다. 입 밖으로 내뱉었더라면 일생 후회했을 가시였겠지. 알고 있다. 그녀는 어디까지나 히나의 부담을 줄여주고 싶어 했을 뿐일 거다. 키보토스에서도 그랬듯이, 아코의 충성심은 늘 과했으니까. 그래도 그녀의 과도한 충성심을 덜어낼 필요는 있었다.\n\n\"저기 아코.\"\n\"네?\""
 GEH.event.3.a: "\"네 마음은 진심으로 고마워. 하지만 네가 내 모든 걸 떠안으려 할 필요는 없어.\""
 GEH.event.3.b: "\"군통수권자는 네가 아니라 나야. 군권에는 손 대는 일 없도록 해.\""

 GEH.event.4.t: "제도적 민주주의"
 GEH.event.4.desc: "\"아마우 선임행정관 체제는 대외적으로는 권력을 분권화하고 선도부를 효율화한다고 말하고 있지만, 이게 정말 제도적 개혁입니까? 얼마 전엔 기획부가 군권에도 손을 데려고 했다는 말도 들었습니다.\"\n\n정기 회의 시간. 정보부장은 아코를 노려보며 서류를 팔랑팔랑 흔들었다.\n\n\"저는 이 '민주적' 개혁에 어떠한 의도가 숨어 있지 않은지 다시 논의해 보아야 할 때라고 생각합니다.\"\n\n치나츠가 말했다.\n\n\"의도라니요. 설마 아코 행정관이 쿠데타라도 저지르려 한다는 겁니까?\"\n\"어쩌면 그 이상으로 위험한 소식일 수 있지요. 선도부원들 사이에서 돌고 있는 소문을 들어보셨습니까? 아마우 선임행정관이 선도부장에 대한 동성-\"\n\n쾅. 논쟁이 아코의 성적인 문제로 번지기 직전, 히나가 책상을 내리쳐서 정보부장의 말을 끊었다."
 GEH.event.4.a: "\"그 이상 말했다가는, 다시는 입을 열지 못하게 만들겠어. 정보부장.\""
 GEH.event.4.b: "\"아코에게도 발언권을 줄 필요가 있을 것 같은데.\""

 GEH.event.5.t: "아래에서의 불만"
 GEH.event.5.desc: "MOMOTALK\n\n- 이오리\n\n히나 부장, 요즘 실행부의 분위기가 심상치 않아.\n\n선도부 민주주의도 좋고, 권력을 분산하는 것도 다 좋은데, 현장에서 범죄자를 제압하는 실행부를 공식 행사에서 배제시키고 서류 업무만 하는 기획부 글쟁이들만 전면으로 내세운다며 불만이 이만저만이 아냐.\n\n아코가 히나 부장을 홀려서 이런 일이 일어났다는 말도 있고... 히나 부장에 대한 부원들의 충성심이 없었다면 벌써 반란이 일어났을지도 모르겠어\n\n하아. 무슨 확실한 대안을 내 달라는 말은 아니야. 그냥 애들 달래는 게 힘들어서, 푸념 좀 해 봤어. 사람 마음이라는 게 마음대로 움직여주지가 않네.\n\n실행부 애들을 위해 뭐라도 해 주는 게 좋을 거 같아. 부탁할게."
 GEH.event.5.a: "히나는 모모톡을 닫으며 한숨을 내뱉었다."

 GEH.event.6.t: "현장에서 일하는 영웅들"
 GEH.event.6.desc: "\"요즘 선도부에서 기획부에 권력을 몰빵하는 것 같더니, 요즘 갑자기 다른 부서에 보너스네 휴가네 막 퍼주더라?\"\n\"선도부장도 요즘 분위기 안 좋은 거 알고 있는 거겠지.\"\n\n선도부 부원 두 사람이 잡담을 나누며 선도부 건물 벽면에 프로파간다 포스터를 붙였다. '현장에서 뛰는 당신이 게헨나의 영웅입니다' 라고 적힌 전위적인 포스터와 선도부 신입부원 모집 전화번호가 눈에 띄었다.\n\n비록 지금 선도부 내에서 기획부로 권력이 집중되고 있는 것은 맞았다. 다른 부서들의 정치적인 힘이 축소되고 있는 것도 공공연한 사실이었고. 하지만 어차피 권력 다툼에 끼지 못하는 하급 일반 부원들에게는 보너스와 휴가가 더 좋은 보상이기는 했다. 두 사람이 물고 뜯고 뭘 하든, 통장에 들어오는 키보토스 엔이 달라지는 건 아니잖나?"
 GEH.event.6.a: "두 선도부원들은 화기애애하게 웃으며 돌아갔다."

 GEH.event.7.t: "베네룩스의 참사는 없다"
 GEH.event.7.desc: "아마우 아코입니다. 오늘 인터뷰에 응한 이유는 도이치인들이 키보토스계에 대해 품고 있는 여러 편견에 대해 답하기 위해서입니다. ...네. 키보토스인들은 총에 맞아도 죽지 않습니다만 그게 지옥이나 악마의 축복 때문이라는 소문은 사실이 아닙니다. 비유하자면 곰이나 사자 같은 겁니다. 강한 동물들은 권총탄을 맞으면 죽지 않지만, 대포를 맞으면 죽잖아요? 그것처럼 저희 역시 보통 인간보다 조금 셀 뿐, 결국엔 강한 화력 앞에는 무력한 평범한 생명체일 뿐입니다.\n\n게헨나계가 살인을 좋아한다는 편견...에 대해서도 이야기해야겠네요. 대전이 직후 일부 게헨나계 학생들이 베네룩스에서 범죄를 저지른 것은 사실입니다. 예. 하지만 현지인들 중에도 악인이 있고 선인이 있듯, 그녀들은 게헨나 사회의 하위 1퍼센트... 그저 쓰레기들이었을 뿐입니다. 저희 선도부는 현지인들이 대전이 이전과 같은 삶을 보내실 수 있도록 치안 유지에 만전을 다하고 있습니다.\n\n예. 인터뷰를 보실 분들은 이미 익히 아시겠지만 우리 선도부는 대전이 이전 게헨나의 치안 유지 조직이었습니다. 범죄와 맞서 싸우고 시민들을 법의 테두리에 보호하는 것, 그렇기에 어떤 키보토스 조직보다도 믿을 수 있는..."
 GEH.event.7.a: "아코는 차분한 목소리로 인터뷰를 이어갔다."

 GEH.event.8.t: "죽어가는 계절의 너에게"
 GEH.event.8.desc: "\"아마우 아코 선임행정관. ...미안하지만, 나는 너를... 사랑할 수 없어. 노력해 봤지만, 안 되겠어. 도저히... 널 연애 대상으로는 볼 수 없어.\"\n\n우리의 만남과 삶은, 어쩌면 이 순간의 작별을 위해 존재했던 것일지도 모른다.\n간직해 온 사랑은 바람에 흩날려 사라지고, 터져 나오는 감정은 끝내 당신에게 닿지 못한 채 가루가 되어 흩어졌다.\n\n회의를 마친 후, 가벼운 대화를 나누고 자연스럽게 헤어졌어야 했을 평범한 하루.\n하지만 히나 부장은 선도부 건물 바깥으로 나를 불러내, 간신히 그 말을 남겼다. 우물쭈물하는, 스스로의 감정조차 정리하지 못한 듯한 그 사람의 목소리. 경애하고, 존경하고, 그리고 사랑했던 히나 부장의 목소리는 너무도 힘없고 나약하게 들려서, 나는 순간 현기증을 느꼈다.\n\n차라리 히나 부장이 나에게 정말로 아무런 감정을 느끼지 못했다면, 아프겠지만 결국은 포기할 수 있었을 것이다. 그러나 감정을 정리하지 못한 채 고개를 숙이고, 나를 바라보지도 못한 채 웅얼거리는 이 사람이 정말 나의, '아마우 아코'의 '소라사키 히나'가 맞을까?\n\n나의 히나 부장은 저 멀리, 죽어가는 계절 속에 있다.\n\n지금 눈앞의 흐리멍덩한 이 존재가 아니라, 대전이가 일어나기 전, 당당하게 코트를 걸치고 사무실을 나서던 그 사람. 내가 사랑했던 건 그 계절 속의 소라사키 히나였다. 그 사실을 깨닫는 순간, 마치 유령에게 쫓기듯 뒤돌아서 달렸다.\n\n뒤에서 나를 부르는 소리가 들렸다. 그러나 돌아보지 않았다. 히나 부장은 나를 쫓아오지 못했다.\n\n부장님은, 마지막까지 우물쭈물하시네요.\n\n나는 당신만을 사랑했어요.\n쌀쌀맞은 당신을 사랑했어요.\n냉정한 당신을 사랑했어요.\n용기 있는 당신을 사랑했어요.\n그리고, 나를 사랑하지 않는 당신을 사랑했어요.\n\n\"아코 행정관님!\"\n\n도로로 뛰어드는 나를 향해, 이름 모를 선도부원이 비명을 질렀다. 그 순간, 나는 뒤를 돌아보았다. 멀리 떨어진 선도부 건물. 그리고 저 멀리서, 이제서야 뒤늦게 달려오는 히나. 그 모습이 마치 멈춘 것처럼 보였다."
 GEH.event.8.a: "그리고, 달려오던 선도부 차량이 내 몸을 치고 지나갔다."

 GEH.event.9.t: "실연"
 GEH.event.9.desc: "\"누군가에게나 운명의 상대가 있어. 그게 너에게는 나였지만, 나에게는 네가 아니었다는 게 문제일 뿐이지.\"\n\n선도부 건물 옥상, 난간조차 없는 헬리포트 끝자락에 선 채, 히나는 지는 노을을 뒤로 한 채 나를 마주보았다. 아름다운 저녁놀이 존경하고 사랑하는 부장의 등 뒤에서부터 그녀를 찬란하게 비추어 주었다. 아마 나는 숨이 끊어지는 날까지 이 순간을 잊지 못하겠지. 그녀는 나를 향해 손을 내밀었다.\n\n\"나는 네 연인이 되어주지는 못해. 존경하는 상사, 믿을 수 있는 동료, 일생을 함께 할 친구가 되어줄 수는 있겠지만.\"\n\"일생을 함께하는 연인이었다면 좋았을텐데요.\"\n\"서로의 운명이 맞지 않았던 거지. ...거기에 대해서는 할 말은 없어.\"\n\n나는 히나 부장의 손을 잡은 채, 함께 저녁놀을 바라보았다.\n\n\"이대로 부장님의 손을 잡은 채, 헬리포트에서 뛰어내리면 어떻게 될까요?\"\n\"그걸 각오하고 여기에서 만나자고 한 거야. ...실연당한 네가 역으로 날 증오하더라도, 그 증오까지 받아들이기 위해.\"\n\"...제가 그럴 수 없다는 걸 알잖아요.\"\n\n이런 사람이니까, 나는 결국 소라사키 히나라는 한 사람에게서 벗어날 수 없는 모양이다. 나는 피식 웃어버리며 히나 부장의 손을 깍지 낀 채 나란히 섰다.\n\n\"고마워요. ...단호하게, 저를 잘라내 주셔서.\"\n\"...나는, 네게 감사를 받을 자격이 없어.\"\n\"이미 거절당할 사랑이라는 건 알고 있었어요. 최근 부장님이 의도적으로 절 멀리 하고 있다는 건 알고 있었으니까요. 그리고 그게 절 싫어해서가 아니라, 저를 보호하기 위해서라는 것까지.\"\n\"아코. 네게 남은 시간은 많아. 그러니까, 내가 아닌 다른...\"\n\"아마, 저에게 '두 번째' 운명은 없을 것 같아요. 다른 세계, 이 붉은 세계가 아닌 푸르른 하늘 아래에서의 다른 이야기였다면 달랐겠지만요.\"\n\n내게 어울리지 않는 시적인 이야기였지만, 운명 같은 걸 느꼈다. '이 세계', '이 이야기'에서 나에게 두 번째 운명의 상대는 찾아오지 못할 거라고. 하지만 그래도 괜찮다. 나의 첫 번째는 내가 죽는 순간까지 처음이마 마지막 사랑으로 남을 테니까. 나는 히나 부장의 손을 놓았다."
 GEH.event.9.a: "아아, 제 실연을 위로할 겸, 오늘 밤 저녁 식사라도 같이 하실래요?"

 GEH.event.10.t: "아코 내각의 붕괴"
 GEH.event.10.desc: "\"게헨나 선도부 선도부장 겸 선임행정관인 아마우 아코입니다. 오늘 긴급 회의는 실종된 부장님에 대한 수색...\"\n\n수십명의 선도부 중요 인사들이 모인 회의실. 서류를 읽던 아코의 말에, 실행부와 정보부 측에서 고성이 터져나왔다.\n\n\"애초에 부장이 실종된 이유가 당신 때문이잖아! 당신의 더러운 성욕을 부장이 못 견뎌서 도망친 거 아냐!\"\n\"부장에게 질척거리며 달라붙다가, 사랑을 안 받아주니 파묻어버린 거 아냐?\"\n\"실행부는 정식으로 아마우 아코에게 소라사키 히나 부장 살인 혐의 수사를 요청합니다!\"\n\n기어이 살인이라는 단어까지 튀어나오자, 이번에닌 아코의 파벌인 기획부 부원들이 자리를 박차고 일어났다. 서로를 향해 욕설과 소리를 지르는 선도부원들, 그 사이에 끼인 실행부 간부인 이오리는 도움을 구하는 눈빛으로 주변을 돌아보았다. 치나츠의 의료부는 정치 권력이 사실상 없는 들러리일 뿐이었다. 정보부는 오히려 이 분쟁을 더 크게 키워 아코를 실각시키려는 쪽이었다. 애초에 도망칠 수 있는 장소는 없었다.\n\n\"아코, 이건...\"\n\n이오리의 말이 끝나기도 전.\n찌익, 찌익. 아코는 '소라사키 히나 수색 기획안'이라는 서류를 네 조각으로 찢어서 하늘에 뿌려버렸다. 예고 없는 아코의 돌발 행동에 일순간 회의실의 고성이 멎었다.\n\n\"후우, 이제 좀 진정들이 되시나요?\"\n\n아코는 자신의 어깨에 붙은 선도부장 태그를 힘으로 떼어내, 찢어진 종이 사이로 던져버렸다.\n\n\"네. 공개적으로 말씀드리죠. 실행부와 정보부의 주장 그대로, 전 히나 부장님을 사랑했어요. 부장님이 우리를 버리고 떠난 이유도 저랑 같은 공간에서 업무 보는 게 역겨워서 그랬는지도 모르죠. 부관이 자기를 사랑했다니, 얼마나 씨발 제가 역겨우셨겠어요. 차라리 제가 자살을 했어야 했는데. 부장님이 떠나고 난 뒤에도 대가리에 권총을 못 겨누고 있다니까요. 혹시라도 어느 날 갑자기 부장님이 돌아올까봐! 그럴 리가 없다는 걸 알면서도!\"\n\n아코가 한 번도 하지 않은 욕설을 회의실에서 쏟아내고 있다. 그럼에도 누구 한 명도 그녀를 저지할 수 없었다. 저지하기 위해 입을 여는 순간, 더 큰 일이 일어날 거라는 예감을 느꼈기 때문일까. 아코는 숨을 골랐다.\n\n\"하아, 하아. 후. 네. 더 이상은 못 버티겠어요. 여러분의 경멸을 사며 여기에 서 있느니 그냥 내려놓겠어요. 선도부장직에서 사임하고 선임행정관으로 돌아가겠습니다. 히나 부장도 앞으로는 기획부에서 단독으로 찾을 거고요. 이상. 정기회의 종료합니다.\""
 GEH.event.10.a: "아코가 자리를 박차고 나가는 동안, 아무도 그녀를 붙잡지 못했다."

 GEH.event.11.t: "죽어가는 계절의 나는"
 GEH.event.11.desc: "\"아마우 아코 선임행정관. 나는 너를...사랑해. 처음부터 그랬고, 지금도 그래. 도망치고 싶을 때도 있었지만...이제는 확신이 들어. 너를 사랑하고 있어.\"\n\n우리의 만남과 삶은, 어쩌면 이 순간의 고백을 위해 이어져 왔던 것인지도 모른다.\n가슴속에만 품어왔던 감정은 따뜻한 바람을 타고 퍼져나갔고, 터져 나온 말들은 마침내 당신에게 닿아 그 결을 남겼다.\n\n회의가 끝난 후, 그저 가벼운 인사를 나누고 각자의 자리로 돌아가야 했을 평범한 날.\n하지만 히나 부장은 선도부 건물 바깥으로 나를 조용히 불러내더니, 뜸을 들인 끝에 그 말을 꺼냈다. 늘 단호하고 또렷하던 그녀의 목소리는 이번엔 떨리고 있었다. 경애하고, 존경하고, 그리고 사랑하게 된 히나 부장의 음성이 그렇게 약하게, 그러나 분명하게 들려왔다. 그 순간, 나는 이 세상의 모든 소음이 사라지는 것 같은 착각에 빠졌다.\n\n히나 부장이 오늘의 결정을 내리기까지 얼마나 고민했을까. 나로서는 미루어 상상할 수조차 없다.\n하지만 스스로의 감정 앞에서 머뭇거리며 조심스레 손을 뻗는 이 사람이, 분명히 나의 '히나 부장'이었다. 언제나 당당하게 선도부의 앞에 섰던 그녀가, 지금은 나 하나만을 위해 이 말을 꺼낸다니.\n\n지금 내 앞에 있는 이 사람은, 대전이 이전에도, 이후에도 변하지 않은 소라사키 히나다.\n굳건하게 코트를 걸치고 사무실을 나서던 모습도, 지금처럼 조심스럽게 마음을 열어주는 모습도 모두 그녀였다.\n나는 그녀와 처음 만난 순간의, 게헨나에서의, 그리고 이 세계에서의 그 모든 계절 속의 히나를 사랑했다. 그 사실을 다시금 되새긴 순간, 마치 꿈을 꾸는 것처럼 그녀의 손을 잡았다. 그리고, 이 손이 진짜라고 느꼈다.\n\n지금의 당신이 좋아요. 쌀쌀맞았던 당신도, 냉정했던 당신도, 용기 있는 당신도, 그리고 이제 나를 사랑한다고 말해준 이 순간의 당신도 전부 사랑해요.\n\n\"아코...는 어때?\"\n\n히나가 내 손을 잡은 채, 조용히 이름을 불렀다. 눈앞이 희미해졌다. 목소리 하나에, 온몸이 떨렸다. 그저 사랑받고 있다는 사실 하나만으로, 이렇게도 따뜻할 수 있구나.\n\n\"어떻냐니... 제가 무슨 대답을 할 지 아시면서, 이러시는 거. 좀 너무하시지 않아요?\"나는 조용히 고개를 끄덕이며, 눈물을 흘렸다. 이 눈물은 슬픔이 아니라, 마침내 도달한 사랑의 무게였다."
 GEH.event.11.a: "이 계절 속에서, 우리는 미래를 향해 함께 나아가도록"

 ## 히나 탈주시 이벤트 ##

 GEH.event.12.t: "아코도 히나도 없는 선도부장실"
 GEH.event.12.desc: "\"새로운 선도부장 선출에 대해서...\"\n\n치나츠는 떨리는 목소리로 기획부원들이 자리를 채운 선도부 평의회장에서 목소리를 냈다. 아코의 사임 이후 선도부는 활동 경력이 긴 중요 인사들로 이루어진 집단지도체제로 운영되고 있었다. 특히 이전 아코 선임행정관의 영향으로 권력이 집중된 기획부의 주도로. 그나마 정치적 권력이 없는 의료부는 치나츠 한 사람만이 평의회에 참여할 권리를 얻은 상태였다.\n\n\"평의회에서는 결정된 바가 있나요? 대전이 이전 간부 중에서는 이제 시로미 이오리 씨가 적격이라고 생각합니다만...\"\n\n이오리라는 말에 평의회에서 고함이 터져 나왔다.\n\n\"그 여자는 절대 안 되지!\"\n\"애초에 선임행정관 아우팅과 이지메를 주도한 게 어디인데! 정보부랑 시로미가 있는 실행부잖아!\"\n\"누가 선도부장이 되든, 그 년은 절대 용납 못 하지!\"\n\n이런 반응이 나올 거라고 예상하고는 있었다. 다만 문제는 기획부 안에 아코를 대신할 수 있는 카리스마 있는 지도자가 없다는 점이었다. 치나츠는 꾸벅 고개를 숙여 사과한 뒤 다시 물었다.\n\n\"그러면 당분간은 평의회를 통한 집단지도를... 유지하는 것으로 결정된 건가요?\"\n\"분명 좋은 새 선도부장을 찾을 수 있을 거야. ...실행부나 정보부 바깥에서.\""
 GEH.event.12.a: "회의는 우울한 분위기 속에서 이어졌다."

 GEH.event.13.t: "선도부장 임명식 - 나츠메 이로하"
 GEH.event.13.desc: "선도부와 만마전 사이의 적대적인 관계는 이미 널리 알려져 있었다. 그렇기 때문에 전직 만마전 의원이 선도부장이 된다는 것은 상당히 이례적인 일이었지만, 나츠메 이로하는 선도부가 선택할 수 있는 가장 현실적인 대안이었다. 소라사키 히나와의 개인적 친분 때문에 선도부에 그나마 우호적이었고, 뛰어난 관료로서 실적을 인정받아왔다. 그리고 실제 권력의 대부분은 여전히 기획부에게 남아 있을 것이기 때문에 이로하가 제도적으로 선도부에 사보타주를 하는 것은 불가능했다.\n\n\"저는 기획부의 지명에 따라 선도부장직을 성실히... 수행할 것을 맹세하고, 게헨나의 안정과 질서를 유지하기 위해 기획부 평의회와 긴밀한 협력을 계속 이어갈 것을 맹세합니다.\"\n\n'성실히'라는 단어를 묘하게 얼버무리듯 말하며, 이로하는 죽은 눈을 한 아코 선임행정관이 내민 선도부장 완장을 넘겨받았다. 아코에게서 넘겨받은 완장을 어깨에 매는 동안, 기획부원들로 가득 찬 선도부장실에서 박수 소리가 터져나왔다.\n\n어차피 기획부의 꼭두각시 선도부장. 만마전에서 일하는 것보다는 땡땡이 치긴 쉽겠죠. 이로하는 씁쓸하게 웃으며 아코와 악수한 자세 그대로 카메라 앞에 섰다."
 GEH.event.13.a: "나츠메 이로하 선도부장 만세! 평의회 만세!"

 GEH.event.14.t: "선도부장 임명식 - 오니카타 카요코"
 GEH.event.14.desc: "오니카타 카요코는 오래 전부터 선도부에게 능력을 인정받아 온 인재였다. 명목상 흥신소 68은 선도부의 단순한 체포 대상일 뿐인데도 불구하고, 아코 선임행정관과 카요코 사이의 친분 관계로 인해 일부 학생들은 '과거 뇌제 정권 시기 카요코가 선도부 간부였던 것 아니냐'는 이야기를 주고 받을 정도였으니까. 그렇기에 아코의 신뢰를 받는 카요코가 새로운 선도부장이 되는 것은 그렇게 부자연스러운 일은 아니었다. 히나의 것과 모양은 같지만, 카요코의 체형에 맞게 새롭게 만들어진 선도부장 코트를 두른 채, 카요코는 당당한 목소리로 말했다.\n\n\"나는 아마우 아코 선임행정관의 지명에 따라 선도부장직을 성실히 수행할 것을 맹세하고, 게헨나의 안정과 질서를 유지하기 위해 기획부 평의회와 긴밀한 협력을 계속 이어갈 것을 맹세합니다.\"\n\n지친 표정의 아코는, '당신이라면 믿고 맡길 수 있어요'라고 말하며, 직접 카요코의 어깨에 선도부장 완장을 채워 주었다. 그 순간 기획부원들로 가득 찬 선도부장실에서 박수 소리가 터져나왔다.\n\n어차피 기획부의 꼭두각시 선도부장이지만, 직을 맡은 이상 흥신소의 동료들과 함께 최대한 성실하게 노력해야겠지. 카요코는 깊은 생각에 잠긴 채 아코와 악수한 자세 그대로 카메라 앞에 섰다."
 GEH.event.14.a: "오니카타 카요코 선도부장 만세! 평의회 만세!"

 GEH.event.15.t: "선도부장 임명식 - 리쿠하치마 아루" #히든 - 반게헨나 아루
 GEH.event.15.desc: "리쿠하치마 아루는 선도부장이라는 직급과는 어울리지 않는 인물이었다. 선도부의 단순한 교칙위반범일 뿐이었고, 농담 이상으로 진지하게 그녀가 선도부장직에 어울리다고 생각하는 사람은 대전이 이전까지는 없었으니까. 그녀가 진지하게 공위가 된 선도부장직의 대안으로 떠오르게 된 것은 리쿠하치마 아루가 대전이 이후 보여준 영웅적인 모습과 공헌 덕분이었다. 특히 키보토스계와 현지인의 화합을 위해 노력하다 나치에게 테러를 당하면서도 굴하지 않은 모습은 많은 선도부원들이 아루에 대한 생각을 고치게 되는 계기가 되었다.\n\n\"나, 룩셈부르크 대공국 섭정 리쿠하치마 아루는 아마우 아코 선임행정관의 지명에 따라 선도부장직을 성실히 수행할 것을 맹세하고, 게헨나의 안정과 질서를 유지하기 위해 평의회와의 협력을 계속 이어갈 것을 맹세합니다.\"\n\n다소 긴장한 표정의 아코가, '어려운 일이 있다면 카요코 씨에게 상담해요'라고 말하며, 직접 아루의 어깨에 선도부장 완장을 채워 주었다. 그 순간 기획부원들로 가득 찬 선도부장실에서 박수 소리가 터져나왔다.\n\n소국 룩셈부르크의 섭정이 게헨나의 국가 지도자인 선도부장직을 겸하게 된 역사적인 순간이다. 아루는 장애 때문에 힘이 들어가지 않는 손을 악수 대신 아코의 손 위에 얹었다. 선도부에서 부른 기자들의 카메라가 아코와 아루 두 사람을 카메라로 찍었다."
 GEH.event.15.a: "리쿠하치마 아루 선도부장 만세! 평의회 만세!"

 GEH.event.16.t: "선임행정관의 업무 문제"
 GEH.event.16.desc: "소라사키 히나 선도부장이 짧은 편지 한 장과 함께 실종된 이후 긴 시간이 지났다. 대부분의 선도부원들은 히나가 이미 해외로 도망쳤거나, 최악의 경우에는 스스로 목숨을 끊었을 것이라고 생각하고 있다. 어찌 되었든 선도부가 그녀를 찾을 방법은 없을 거라 생각하는 중이다.\n\n하지만 공석이었던 선도부장직이 채워지면서, 아코의 선도부장 수색 활동이 다시 활기를 얻기 시작했다. 그녀는 선임행정관으로서의 업무를 일부 팽개치면서까지 게헨나 전역을 자비로 돌아다니며 히나에 대한 단서를 찾기 위해 노력하고 있다.\n\n실행부와 정보부에서 아코에 대한 탄핵안이 올라오기도 했지만, [GEH.GetLeader] 선도부장의 강경한 의지로 인해 아코는 계속해서 소라사키 히나에 대한 수색을 이어갈 수 있게 되었다. 비록 아코가 선도부장을 찾을 가능성이 거의 없다고 하더라도, 그것이 지금 아코가 살아있을 수 있는 마지막 동기였으니까."
 GEH.event.16.a: "절대 포기하지 마."

 # event 200~ 노멀 루트 중점 이벤트

 GEH.event.200.t: "현상 유지"
 GEH.event.200.desc: "게헨나 선도부는 명확히 두 흐름으로 나뉜다. 강경한 군국주의를 내세우는 실행부, 그리고 냉철한 이성과 데이터를 중시하는 기술관료 중심의 기획부. 둘은 동일한 목적을 두고도 항상 다른 길을 주장해 왔다. 제2차 총회는 그런 이념의 충돌을 정면으로 드러낸 자리였다. 격론은 밤을 지새웠고, 결론은 끝내 도출되지 않았다. 단 하나의 결과는 '아무 결정도 내리지 못한 것'이었다.\n\n선도부원들 사이에선 자연스레 소문이 돌기 시작했다. \"저렇게 다투다간, 이제는 서로 얼굴도 보기 싫은 사이가 될 거야.\" 하지만 그 예측은 빗나갔다. 공식 석상에선 날카로운 논쟁을 이어가던 아마우 아코와 시로미 이오리는, 사적인 자리에서는 오히려 허물없는 태도로 대화를 나누었다. 격식을 차리면서도 부드러운 미소, 냉정한 말투 속에 감춰진 신뢰-그것은 '갈등'이라는 단어로는 설명할 수 없는 관계였다.\n\n결국 누구도 승리하지 못한 총회의 결말은, 아이러니하게도 가장 이상적인 결말이 되었다. 선도부장의 노련한 중재 아래, 파벌 간의 긴장은 폭발 직전에서 멈춰 섰고, 선도부는 다시금 하나의 조직으로 유지될 수 있었다."
 GEH.event.200.a: "일반 부원들간의 갈등은 여전하지만, 해결할 수 있는 문제야."

 GEH.event.201.t: "사회민주당과의 협상"
 GEH.event.201.desc: "도이치 사회민주당 지역 정치인인 빌리 랑게(Willy Lange)는 나치 정권 집권 이후 체코슬로바키아로 도망쳤다가, 바이에른에 반나치 정부가 수립되면서 다시 도이칠란트로 돌아온 여러 정치인들 중 한 사람이었다. 랑게는 게헨나라는 새 군벌 조직을 신뢰하지 않았지만, 사실 그들 외에 사회민주당을 용인하는 별다른 대안 세력이 없는 것도 사실이었다. 랑게는 불안한 감정을 숨기지 못한 채 손목시계를 몇 번이나 들여다보며 회의실에 약속한 선도부 간부가 들어오기를 기다렸다.\n\n\"...오래 기다리셨습니다. 선도부장님께서 사회민주당의 협상안을 확인하셨습니다.\"\n\n정확하게 약속 시간 2분 전, 치나츠라는 이름의 무뚝뚝한 여자가 랑게를 맞이하러 들어왔다. 선도부 내부 계파 지도자들 중 한 명이자, 이번 사회민주당과의 협상 전권을 인정받았다는 여자였다. 랑게는 그녀가 당 간부라고 보기에는 지나치게 젊어 보인다고 생각했지만, 그 생각을 입 바깥으로 꺼내지 않을 만큼은 현명했다.\n\n\"우리는 사회민주당의 합법적인 활동 권리와, 게헨나에서의 노동법 개정안을 원합니다. 협력은 그 이후에나 이루어질 것이며...\"\n\"네. 랑게 씨가 사회민주당 아래에서의 질서를 원하듯, 우리 역시 안정과 질서를 원하고 있습니다. 사회민주당은 적어도 [ROOT.GetLeader] 부장님이 직접 관할하는 지역 안에서는 합법화될 것입니다.\"\n\n랑게가 예상했던 것 이상으로 치나츠는 그의 제안에 협조적이었다. 비록 선도부가 용인한 '합법적 활동'이 철저하게 민간단체 수준의 활동으로 제한되어 있기는 했지만, 애초에 그들이 민주국가가 아니라는 점을 감안한다면 용납할 수 있는 수준이었다. 짧은 회담 끝에 협상은 성공적으로 타결되었고, 랑게는 사회민주당 당원들의 게헨나 군 입대를 독려하는 당 차원에서의 협조를 약속했다."
 GEH.event.201.a: "한 발자국씩, 앞으로"

 GEH.event.202.t: "조율의 기술"
 GEH.event.202.desc: "제2차 총회의 실패 이후, 선도부는 잠시 숨을 고르는 시간을 가졌다. 실행부와 기획부는 여전히 각자의 논리를 굽히지 않았지만, 더 이상 날을 세우진 않았다. 이는 어느 누구의 승리가 아닌, 오직 한 사람의 설득력 덕분이었다. [ROOT.GetLeader] 선도부장은 결단했다. \"총회의 실패는 간부들의 고집 때문이 아니야. 모두가 목소리를 냈지만, 그 모든 말을 끝내 하나로 엮지 못한 나의 책임일 뿐.\" 그런 고백은 단순한 책임 회피가 아니었다. 자책과 함께 드러낸 연설 속 진심은 선도부원들의 마음을 움직였고, 깊게 파였던 파벌의 골마저 조금씩 메워지기 시작했다.\n\n기획부와 실행부 사이의 갈등은 본래부터 증오가 아닌 방향성의 차이였다. 그 틈은 몇 번의 진심 어린 연설과 성실한 중재로 빠르게 봉합되었고, 선도부는 다시금 '하나의 질서' 아래 움직이기 시작했다. 아직 완벽한 일치는 아니다. 그러나 지도자가 자신을 꾸짖고, 함께 나아가자고 말했을 때-선도부는 서로를 다시 믿기로 했다."
 GEH.event.202.a: "지도자는 군림하는 자가 아닌, 책임지는 자다."

 GEH.event.203.t: "만마전과 협상?"
 GEH.event.203.desc: "히나 부장님, 저는 분명 부장님을 누구보다도 깊이 믿고 신뢰하지만... 트리니티의 위협에도 불구하고 만마전은 그다지 믿을 수 있는 상대가 아닙니다. 만마전의 너구리들은 우리를 미소노와 키리후지의 포탄밥으로 던져준 뒤, 안락의자에 앉아 와인을 홀짝이고 있을 걸요? 그런데 협상이라니...\n\n네. 물론 저는 언제나 부장님의 편이고, 부장님이 그 씹ㅅ... 아니, 그 교활한 자들을 믿기로 하셨다면 저 역시 부장님의 지시를 따를 테니까요. 하지만 저는 결코 [GEM.GetLeader]를 믿는 게 아닙니다. '히나 부장님'의 선택을 믿을 뿐이죠. ...네. 그들에게 보내는 외교 문서를 작성하겠습니다. 그 잘난 의장이 감탄할 만큼 비굴하게 써 주죠. 어차피 단순한 편지는 아무것도 약속하지 못하니까요."
 GEH.event.203.a: "아코는 히나에게 목례하고 나갔다."

 GEH.event.204.t: "바이에른 군벌?"
 GEH.event.204.desc: "이오리는 선도부 건물 벽면에 붙은 도이칠란트 공산당 지하조직의 포스터를 힐끗 노려봤다. 분명 어젯밤 실행부원들이 뜯어낸 포스터였다. 새벽에 다시 그것들이 포스터를 붙이러 돌아온 모양이였다. 내용은 간단했다. [ROOT.GetLeader] 체제는 결국 빌헬름 2세와 전혀 다를 바 없는 '반동적'인 군사조직에 불과하다는 내용이다. 이들이 말하는 빌헬름 2세라는 사람이 도대체 뭐 하는 인간인지도 모르겠고, [ROOT.GetName] 측이 '군사조직'이라는 게 왜 문제가 된다는 건지도 이오리로서는 이해할 수 없었다.\n\n\"공산당이라니... 붉은겨울 학원의 모조품 주제에.\"\n\n이오리는 구둣발로 포스터를 팍 쳐서 흙을 뿌려버렸다.\n\n\"시간을 낭비하고 싶지도 않네. 하아. 이건 다시 찢어버리라고 해야겠어. ...그래서 군벌이 도대체 뭐가 나쁘다는 거야?\""
 GEH.event.204.a: "총칼이야말로 가장 강력한 이념이자 질서인데."

 # 1000~ 중점 추가 이벤트

 GEH.event.1000.t: "[GEH.GetName]의 [HEU.GetName] 병합"
 GEH.event.1000.desc.a: "게헨나 선도부가 룩셈부르크 대공국과 이를 이끄는 흥신소 68 세력을 체포한 이후, 룩셈부르크 대공국 지도자 처우에 대한 논의가 시작되었습니다. 에밀 로이터 국회의장은 체포 과정에서 선도부원들의 얼굴에 침을 뱉으며 저항하다 체포되었으며, 조제프 베슈 총리는 국경선을 넘어 도주하려다 붙잡혀 포로 수용소로 이전되었니다. 현지 정치인들은 대전이 직후 일어난 게헨나계에 의한 학살 사건으로 인해 우리에게 매우 비협조적이며, 어떠한 현지 정당과도 룩셈부르크 통치에 대한 진전된 논의를 나눌 수 없었습니다.\n\n유일한 변수는 흥신소 68입니다. 대전이가 일어나기 전 작은 흥신소의 사장이었던 그녀는 룩셈부르크 대공국의 섭정이자 국제 자유주의 정치 운동 '68혁명'의 국제적 지도자가 된 상태입니다. 선도부의 가장 강경한 선도부원조차도 현재의 리쿠하치마 아루를 대전이 이전처럼 단순 규칙위반 잡범으로 처벌할 수 없다는 것에 동의합니다.\n\n정보부 측은 리쿠하치마 아루가 사회운동가로서 너무 위험한 인물이 되었으며, 아루가 선도부에 영향을 끼치지 못하게 해야 한다고 생각합니다. 정보부장은 룩셈부르크 대공국이 재건될 수 없도록 포로수용소에 있는 모든 현지 정치인들을 총살한 후, 그녀와 흥신소 68 동료들은 '반 게헨나 정치범'으로서 재판을 거쳐 추방하는 것이 가장 안전한 해결책이라고 주장하고 있습니다.\n\n이에 반해 아코 선임행정관은 흥신소 68의 다른 인원들은 중요하지 않지만, 오니카타 카요코 개인은 매우 뛰어난 재능을 가지고 있으며 선도부 간부로서 받아들일 가치가 있다고 주장합니다. 아코는 룩셈부르크 대공국을 게헨나 산하의 자치령으로 존속시키되, 흥신소 68 전원이 선도부에 가입하는 대안을 제안했습니다. 카요코는 아루를 보호하기 위해 이 제안을 분명 거절하지 못할 것입니다." #흥신소가 파시
 GEH.event.1000.desc.b: "게헨나 선도부가 룩셈부르크 대공국과 이를 이끄는 흥신소 68 세력을 체포한 이후, 룩셈부르크 대공국 지도자 처우에 대한 논의가 시작되었습니다. 에밀 로이터 국회의장은 체포 과정에서 선도부원들의 얼굴에 침을 뱉으며 저항하다 체포되었으며, 조제프 베슈 총리는 국경선을 넘어 도주하려다 붙잡혀 포로 수용소로 이전되었니다. 현지 정치인들은 대전이 직후 일어난 게헨나계에 의한 학살 사건으로 인해 우리에게 매우 비협조적이며, 어떠한 현지 정당과도 룩셈부르크 통치에 대한 진전된 논의를 나눌 수 없었습니다.\n\n유일한 변수는 흥신소 68입니다. 대전이가 일어나기 전 작은 흥신소의 사장이었던 그녀는 룩셈부르크 대공국의 섭정이자 현지 룩셈부르크인들의 지지를 받는 인기 있는 지도자가 된 상태입니다. 선도부의 가장 강경한 선도부원조차도 현재의 리쿠하치마 아루를 대전이 이전처럼 단순 규칙위반 잡범으로 처벌할 수 없다는 것에 동의합니다.\n\n정보부 측은 리쿠하치마 아루가 너무 영향력 있는 인물이 되었으며, 룩셈부르크를 '게헨나화' 시키는 것에 방해가 된다고 주장하고 있습니다. 정보부장은 룩셈부르크 대공국이 재건될 수 없도록 포로수용소에 있는 모든 현지 정치인들을 총살한 후, 그녀와 흥신소 68 동료들은 '반 게헨나 정치범'으로서 재판을 거쳐 추방하는 것이 가장 안전한 해결책이라고 주장하고 있습니다.\n\n이에 반해 아코 선임행정관은 흥신소 68의 다른 인원들은 중요하지 않지만, 오니카타 카요코 개인은 매우 뛰어난 재능을 가지고 있으며 선도부 간부로서 받아들일 가치가 있다고 주장합니다. 아코는 룩셈부르크 대공국을 게헨나 산하의 자치령으로 존속시키되, 흥신소 68 전원이 선도부에 가입하는 대안을 제안했습니다. 카요코는 아루를 보호하기 위해 이 제안을 분명 거절하지 못할 것입니다." #흥신소가 공산
 GEH.event.1000.a: "게헨나는 계속해서 확장되어야 한다. 예외는 없다."
 GEH.event.1000.b: "뛰어난 인재들을 선도부에 받아들이는 것이 더 중요하다."

 GEH.event.1001.t: "룩셈부르크 대공국의 해산"
 GEH.event.1001.desc.a: "리쿠하치마 아루는 선도부 지하 감옥 벽에 등을 기댄 채 깊은 한숨을 내뱉었다. 아무래도 자신들의 이야기는 이곳에서 끝을 맺게 된 것 같다. 룩셈부르크에서의 생활은 고통스럽기도 했지만, 그래도 의미 있는 삶이기도 했는데.\n\n카요코가 지친 아루의 곁으로 다가와 살짝 앉았다.\n\n\"사장, 무슨 생각하는지 알아. ...완전히 실패했다. 우리는 이제 끝이다. 뭐 그런 고민을 하고 있는 거지?\"\n\"아하하... 하드보일드 사장으로서 멋있는 모습을 보여주고 싶은데... 매번 실패, 실패, 실패... 이번에는 나를 믿는 사람들의 기대도 배신해 버렸잖아.\"\n\"아니, 사장은 누구도 배신한 적 없어. 그저 적이 너무 강했을 뿐이지. 룩셈부르크가 아닌 다른 곳에서라도, 바라는 꿈을 계속 이어 나가면 돼. 현지인과 키보토스인이 모두 사이 좋게 지내는 세상. 아루 사장은 그런 세상에서 살고 싶다고 했잖아?\"\n\n짧은 정적이 지나고, 어두운 아루의 표정이 조금씩 밝아지기 시작했다. 한 번 실패했을지 모른다. 앞으로도 계속 실패가 이어질지도 모른다. 하지만 아루의 이상은 아직 짓밟히지 않았다. 이루어질 수 없는 꿈이라 할지라도, 아루는 자신의 날개가 부러지기 전까지 계속 날아오를 것이다. 꿈을 향해서." #흥신소가 파시
 GEH.event.1001.desc.b: "\"아주 잘 했어, 아사기. 아루 사장에게 상처를 입히고, 흥신소 68의 우정을 부수고, 그렇게 해가면서 세운 네 군국주의 룩셈부르크는 이렇게 짓밟히면서 끝나는 거야. 씨발 기분이 어때?\"\n\"하, 그래. 다 내 잘못이지? 아니, 오니카타 네가 안에서 사보타주를 해서 아루 쨩을 위한 내 계획이 무너진 거잖아, 이 씨발년아!\"\n\n빡, 빠각. 서로를 향해 주먹을 휘두르는 카요코와 무츠키의 고함과 욕설. 재판이 끝나기 전까지 구치소를 관리해야 할 선도부원들조차 성난 야수처럼 서로를 향해 내달리는 두 사람을 말리러 오지 못하고 있었다.\n\n흥신소의 우정은 부서졌다. 꿈도, 이제는 희망도 존재하지 않는다. 하루카는 이미 며칠 전 몰래 숨겨온 약을 털어넣었다 의식불명 상태가 되어 병원에 누워 있었다. 듣기로는 식물인간이 되어 다시 눈을 뜨는 건 불가능하다지.\n\n아루는 지친 모습으로 벽에 기댄 채, 서로를 향해 주먹을 휘두르는 두 사람을 보았다. 키보토스에서의 첫 만남, 그리고 흥신소 68을 차리고 함께 해 왔던 모험. 그 모든 것들이... 이제는 단순한 환상이었던 것처럼 느껴졌다. 그 즐거운 시간들이 *정말* 존재했었던 걸까? 설마. 자신에게 그런 행복한 시간이 허락되었을 리가 없지.\n\n아루는 하루카가 남겨 놓은 독약을 품에서 꺼냈다. 하루카는 먹어야 할 약의 양을 충분히 조절하지 못했다. 하지만 아루는 그런 실수를 하지 않을 것이다. 이 지옥에서 탈출하기 위해서, 아루는 밝게 웃으며 모든 알약을 입에 털어넣었다." #흥신소가 공산
 GEH.event.1001.a: "한 이야기가 끝나고, 한 이야기가 시작된다." #파시
 GEH.event.1001.b: "안녕, 흥신소 68." #공산

 GEH.event.1002.t: "선도부장 직속 흥신소 68"
 GEH.event.1002.desc.a: "[GEH.GetLeader]가 룩셈부르크 대공궁에 직접 방문한 것은 오늘이 처음이었다. 공식적으로 흥신소 68의 네 사람은 선도부의 어떠한 부서에도 소속되지 않는, 선도부장의 개인 경호원 직급으로 임명되었다. 물론 어디까지나 경호라는 직책은 흥신소 68에게 직책을 쥐어주기 위한 핑계일 뿐이었지만.\n\n\"아! 선도부장! 기다리고 있었어. 후후, 커피 한 잔 마실래?\"\n\n대공궁의 집무실, 다정한 미소를 짓는 리쿠하치마 아루는 [GEH.GetLeader]를 위한 드립 커피 한 잔을 준비하고 기다리고 있었다. 선도부장은 아루와 함께 커피를 마시며 미리 준비한 협상 조건을 이야기했다. 룩셈부르크 대공국 정부와 의회는 게헨나의 '소수민족 자치구'로 유지될 것이다. 아루는 계속해서 룩셈부르크를 통치할 권한을 얻는다. 하지만 그녀가 보유하던 군대는 전부 [GEH.GetName] 군에 재편성될 것이다. 마지막으로 흥신소 68 전원은 선도부의 간부로서 [GEH.GetLeader] 선도부장에게 충성할 의무를 진다.\n\n\"후훗, 하드보일드 무법자인 내가 선도부 간부라니, 재미있는 이야기 아니야? 하지만 좋아.\"\n\n아루는 '풍기'라고 적힌 선도부 완장을 팔에 찬 채, 자리에서 일어났다.\n\n\"선도부장, 잠깐 같이 걸을 수 있을까? 선도부 간부로서 부탁하고 싶은 게 있어.\"\n\n대공궁 궁전은 상당히 컸지만, 아루는 궁전의 아주 작은 공간만을 사용하고 있었다. 그 이유는 금방 알 수 있었다. 궁전 안쪽, 대전이 당일 게헨나 폭도들에 의해 학살이 일어난 장소. 페인트를 덧칠했음에도 사방에 난 총알 자국의 흔적을 완전히 지울 수는 없었다. 아루는 선도부장을 궁전 침실에 있는 가족 유골함으로 안내했다. 이곳은 대전이 이전 룩셈부르크 대공과 그녀의 가족들의 유골을 보관 중인 장소였다.\n\n\"룩셈부르크 사람들은 좀 보수적인 편이야. 여기 사람들이 정말로 소중하게 생각하던 어른을 게헨나의 아이들이 살해했거든. 그러니까... 앞으로 룩셈부르크 사람들이 선도부장을 좋아하지 않는다고 해도 이해해 줬으면 해. 나는 바보 같은 사장이라 여기 사람들을 행복하게 해 주지 못했지만... 선도부장이라면 할 수 있을 거라고 믿으니까.\"\n\n반드시 그렇게 해 주겠다. [GEH.GetLeader]는 그렇게 말하며 아루와 함께 샤를로테 여대공의 유골함에 기도를 올렸다. 더 나은 세상을 만들겠다는 꿈이 이어지기를 바라면서." #흥신소가 파시
 GEH.event.1002.desc.b: "[GEH.GetLeader]가 룩셈부르크 대공궁에 직접 방문한 것은 오늘이 처음이었다. 공식적으로 흥신소 68의 네 사람은 선도부의 어떠한 부서에도 소속되지 않는, 선도부장의 개인 경호원 직급으로 임명되었다. 물론 어디까지나 경호라는 직책은 흥신소 68에게 직책을 쥐어주기 위한 핑계일 뿐이었지만.\n\n\"기다리고 있었어. 선도부장은 맥주 좋아해? 아, 미안. 근무 시간에는 마실 수 없겠구나... 그러면 커피로 할까.\"\n\n아루가 나치와 현지 반키보토스 세력에게 무자비한 테러를 당했다는 이야기는 확실히 사실이었다. 왼쪽 눈은 완전히 멀었고, 오른팔로는 커피가 올라간 쟁반조차 들지 못했다. [GEH.GetLeader]는 한손밖에 쓰지 못하는 아루를 대신해 쟁반을 대신 옮겨 주었다.\n\n원래대로라면 아루에게 협상 조건을 이야기할 차례였다. 그녀가 룩셈부르크를 계속 통치하는 대신, 선도부장에게 절대적으로 충성해야 한다는 서약 이야기. 하지만 선도부장은 다른 것을 묻고 싶었다.\n\n- 왜 그렇게 되면서까지, 룩셈부르크에서 떠나지 않은 거야?\n\n아루는 떨리는 손으로 머그컵을 들어 올리며 고개를 숙였다.\n\n\"이전의 난 그냥 어린애였어. 친구들이랑 같이 웃고 떠들면서 이런저런 난동을 벌이며 회사 놀이를 했지. 하지만 대전이가 일어나고, 사방에 시체들이 굴러다니는 룩셈부르크에 도착했을 때... 나는 책임지는 어른이 되어야만 했어. ...무슨 책임이냐고? 후후, 게헨나의 바보들이 저지른 죄를, 침략으로 인해 가족을 잃은 사람들에게 속죄하는 삶이 아닐까.\"\n\n리쿠하치마 아루는 누구도 죽이지 않았다. 오히려 대전이 당일 많은 사람들을 살려내지 않았나. 그렇게 물어도, 그녀의 입가에는 미소가 떠오르지 않았다.\n\n\"결국 그 날 많은 사람들이 죽은 게 변하는 건 아니니까. ...나는 결국 바보같은 리더라서, 룩셈부르크 사람들이 가진 트라우마를 치료하지 못했어. 아니, 나부터가 트라우마에 시달리고 있는 걸. 하지만... 선도부장은 나보다 더 나은 사람이니까. 이 땅의 사람들을 행복하게 해 줘. 부탁할게.\"\n\n반드시 그렇게 해 주겠다. [GEH.GetLeader]의 확신에 찬 말을 듣고서야, 아루는 희미한 미소를 지었다." #흥신소가 공산
 GEH.event.1002.a: "커피의 맛은 깊고, 풍미가 있었다."

 GEH.event.1003.t: "의심하지 말지어다"
 GEH.event.1003.desc: "아마우 아코가 가장 사랑하는 사람은 소라사키 히나, 가장 소중한 취미도 소라사키 히나, 그리고 그녀의 특기도 소라사키 히나 관찰이다. 그렇기에 최근 광신적인 선도부원들에 둘러쌓인 히나가 과도한 업무 스트레스와 부담감으로 인해 지쳐가는 걸 잘 알고 있었다.\n\n그리고 얼마 전부터 이어져 온 한 달 가까운 선도부장의 '방문자 사절'. 혹시라도 히나 부장에게 무슨 일이라도 생긴 건 아닐까. 인내심의 한계에 다다른 아코가 히나의 집에 숨어 들어갈 작전까지 고민할 무렵, 기적적으로 열성당원들은 아코가 히나를 만나러 갈 수 있도록 허가해 주었다. 깔끔하게 정리된 소라사키 히나의 집에 들어가자, 책상에 에드워드 기번의 '로마 제국 쇠망사'를 펼쳐 놓은 히나가 아코를 맞이했다.\n\n\"아, 아코. 연락하지 못해서 미안했어. 최근에 좀 몸이 안 좋았거든. 그래도 내일부터는 다시 업무에 복귀할 예정이니, 아무 걱정 하지 않아도 괜찮아.\"\n\n다정하게 말하면서, 자신의 손을 잡으며 미소짓는 히나. 머리부터 발끝까지 아코가 가장 흠모하는 그 소라사키 히나 본인이 분명했다. 하지만 어째서일까? 선도부장은 집무실에서 보았을 때의 지치고 괴로운 모습과 달리 너무도 편안한 미소를 짓고 있었다.\n\n\"부장님, 혹시... 업무가 힘드시다거나, 출근이 괴롭다거나, 그런 고민은 하지 않으시나요?\"\n\"힘들다니? 이해할 수 없어. 선도부장인 나는 게헨나 선도부를 이끄는 영도자로서, 모두의 절대적 모범이 되어야 할 의무가 있는데. 어떻게 철인 지도자가 출근을 괴로워하는 *비합리적인* 생각을 할 수 있는 거야?\"\n\"하, 하지만, 히나 부장님. 얼마 전까지만 하셔도...\"\n\n기계적으로 합리와 철인을 이야기하는 히나의 모습에 아코는 두려움을 느꼈다. 한 달 사이 도대체 무슨 일이 있었던 거지? 아코는 히나의 눈을 똑바로 바라보았다. 아주 희미하게, 히나의 눈동자 속에 기계장치로 이루어진 복잡한 회로가 보인 것도 같았다. 진짜 이 소라사키 히나는 자신이 아는 그 선도부장일까?\n\n\"똑똑한 아코라면 정언명령에 대해서도 알고 있겠지? 모든 게헨나인들은 선도부장의 명령에 복종해야 한다. 명령이야. *날 의심하지 마*.\"\n\"자, 잠시만요. 의심하지 말라뇨. 하지만 부장님의 눈이...\"\n\"네 심박수의 변동과 감정의 움직임으로 본다면, 나를 사랑하고 있는 것 같은데. 아코는 사랑하는 사람의 명령도 받아들일 수 없을 만큼 냉혹한 성격이었나?\"\n\"아, 아뇨, 하지만...\"\n\n두근, 두근. 심장이 터질 것 같다. 그런 불안감을 녹여주듯이, 히나는 아코의 뺨을 천천히 쓰다듬었다.\n\n\"방금 말했잖아. 생각하지 마. 그냥 복종하면 편해질 수 있어. *아마우 아코는 내 눈에서 아무것도 보지 못했다*. 이것만 인정하면 돼.\"\n\"아무것도...\"\n\"그러니 돌아가서 내일 내 업무를 준비하도록 해. 그렇게 한다면 주말에 데이트도 해 줄 테니까. 네가 상상하던 소라사키 히나의 판타지를 충족시켜 주지.\"\n\"저는...\""
 GEH.event.1003.a: "\"...저는... 네. 부장님에게서 아무것도 보지 못했습니다.\""

 GEH.event.1004.t: "기계의 몸을 한 신"
 GEH.event.1004.desc: "진짜 소라사키 히나는 사임 후 실종되었다. 선도부원들의 광신, 그리고 그로 인한 압박감을 견디지 못하고 도망쳤다. 하지만 그 소식을 알리는 것이 가능할까? 히나의 친위대원들에게는 그럴 수 없는 일이었다. 히나의 친위대를 자칭하는 선도부의 광신도들에게 있어서 소라사키 히나는 선도부의 존재 이유였고, 자신들이 가야 할 길을 알려 줄 영도자였으며... 인간의 모습을 한 현인신이었다. 완벽한 신이 신자들을 피해 도망친다는 건 있을 수 없는 일이었다. 히나는 자신들이 바랐던 절대자가 아니었다는 것인가?\n\n신이 없다면 만들어라도 내야 하지 않을까. 한 광신자의 부르짖음에서 희망이 피어올랐다. 신이 신자들을 버리고 떠났더라도 신자들은 자신들의 신을 버리지 아니하였으니. 곧 밀레니엄 사이언스 스쿨 출신 엔지니어가 비밀리에 선도부로 초청되었다.\n\n\"완벽하게 작동하는 오토마톤을 만들어 드리겠습니다. 네. 잠들지도, 지치지도 않고 계속해서 조국을 위해 봉사하는 기계신이 되는 거죠.\"\n\n막대한 돈을 선금으로 받은 밀레니엄 출신의 엔지니어는 자신만만하게 새로 만들어진 기계신을 친위대원들에게 내밀었다. 옛 신처럼 자신들을 버리고 도망치지도 않고, 영원히 늙지도 않으며 자신들을 이끌어 줄 새로운 신.\n\n새로운 '소라사키 히나'는 눈을 뜨며, 자신을 우러러보는 수많은 신자들을 내려다보았다. 인간의 감정을 느끼지 못할 로봇인 그녀는, 신자들을 냉소하듯 내려다보며 미소지었다.\n\n\"깊은 잠에서 깨어난 느낌이구나. 그래, 나를 위한 제관은 여전히 준비되어 있느냐?\""
 GEH.event.1004.a: "\"모두가 주를 따를 것입니다.\""

 GEH.event.1005.t: "영도자의 부재"
 GEH.event.1005.desc: "소라사키 히나가 실종된 이후에도 히나의 친위대원들은 아마우 아코를 비롯한 가장 가까운 인물들에게도 사직서 이야기를 숨길 수 있었다. 히나는 오직 자신의 집무실에 편지를 두고 실종되었을 뿐이며, 집무실은 매일 새벽부터 친위대원들이 청소를 위해서라는 명목으로 출입을 통제하기 때문이다. 히나는 친위대원들이 경비를 서는 집무실 책상에 사직서를 올려두고, 출장을 가겠다는 핑계로 집무실을 나와 그대로 사라져버렸다. 히나가 책상에 올려둔 편지가 사직서라는 게 드러난 것은 한나절이나 지난 뒤의 일이었다.\n\n실종 사실이 알려진 뒤 선도부 친위대원들은 곧바로 두 개의 파벌로 분열되었다. 첫 번째는 소라사키 히나를 현인신에 가깝게 숭배하던 광신자들이었다. 히나가 단순한 철인 독재자 그 '이상'의 존재라고 믿던 광신도들에게 히나의 자발적인 실종은 '신이 신자들을 버린' 있을 수 없는 사건으로 생각되었다. 광신도들은 히나가 진짜 게헨나를 위한 신이 아니었다는 결론을 내렸다. 우리는 지금까지 가짜 신을 따르고 있었을 뿐이며, 우리의 충성은 어딘가에 있을 '진짜'를 위해 대체되어야 한다는 것이다. 광신도들이 생각하는 진짜 소라사키 히나가 무엇인지는 그녀들 스스로도 명확한 확신이 없어 보였다. 신이 없다면 만들어라도 내야 한다. 그 말에서 새로운 지도자를 '만들' 방법이 있다는 것을 예측할 수 있을 뿐이었다.\n\n다른 하나의 파벌은 소라사키 히나의 실종 사실을 영원히 숨길 수 없다는 것에 동의했다. 다른 파벌 역시 히나의 광신적인 충성파였지만, 그녀들은 히나를 현인신으로서 숭배하는 것이 아닌 게헨나 체제의 상징이자 (결국 대체될 수 있는) 카리스마적 영도자로 따랐을 뿐이다. 온건파는 비록 소라사키 히나는 사라졌으나 그녀가 남긴 철인 정치의 사상은 남아 있다고 항변했다. 우리는 새로운 신을 찾을 필요 없이, 친위대에 의한 집단지도체제를 통하여 히나의 '철인 정치'를 따라하는 것으로 위대한 조국 게헨나의 영광을 계속 이어 나갈 수 있을 것이다."
 GEH.event.1005.a: "결국 한쪽이 승리할 것이다."

 GEH.event.1006.t: "소라사키 히나 실종"
 GEH.event.1006.desc: "\"그러니까 부장님이 실제로는 병이 아니라 실종된 거였고, 그걸 당신들은 *한 달* 동안이나 선임행정관인 저에게 숨겼다는 말씀이시군요. 예. 잘 알겠습니다.\"\n\n격분한 아마우 아코가 자신의 권총 핫 샷을 뽑아 든 순간, 텅 빈 집무실을 가득 채운 선도부원들이 일제히 총기를 꺼내 들었다. 짧은 긴장이 오간 뒤, 아코는 허탈감과 무력감 속에서 권총을 쥔 손을 놓았다. 이미 히나는 없다. 혼자 여기서 저 미친놈들을 상대로 화풀이를 한다 해도... 자신이 죽는 것 말고 다른 결말은 없을 것이다.\n\n\"당신들은 적어도 저한테는 그 사실을 알렸어야 했어요.\"\n\n친위대원이 말했다.\n\n\"이것은 조국의 혼란을 막기 위한 어쩔 수 없는 선택이었습니다.\"\n\"...적어도 그 선택을 할 수 있는 자리에, 제가 끼어 있을 수는 없었나요?\"\n\"선임행정관님의 충성심 때문에 실종 사실을 숨길 수 없으리라 판단했습니다. 저희 모두 선임행정관님의 애국심과 충정을 인정합니다. 그저 우리에게...시간이 필요했다는 걸 인정해 주시기 바랍니다.\"\n\"...앞으론 어떻게 하실 생각이죠?\"\n\"히나 부장님은 사라지셨지만, 그 분이 남긴 의지는 사라지지 않았습니다. 우리가 그 분의 의지를 이을 것입니다.\""
 GEH.event.1006.a: "\"선임행정관님에게도 협조를 부탁드립니다.\""

 GEH.event.1007.t: "소라사키 신앙"
 GEH.event.1007.desc: "1. 게헨나 각지의 모든 성당 및 교회를 압류하여 위대한 지도자이신 *소라사키 히나*를 현인신으로서 숭배하는 제단으로 개조한다.\n2. 소라사키 신앙은 국교로 지정되며, 현인신에 대한 신앙 외의 모든 종교는 불법으로 지정된다.\n\n터무니 없는 공문이었다. 이오리는 히나가 분명 훌륭한 지도자라고 생각하고, 그녀를 신뢰하기는 했다. 하지만 부장을 신으로 숭배하라고? 미친 소리다. 히나가 *신*이 아닌, 평범하게 웃고 우는 한 사람일 뿐이라는 건 '대전이' 이전부터 그녀와 함께 해 온 이오리가 누구보다도 잘 알고 있었다. 비록 대전이 이후 친위대라는 광신도들 때문에 히나와 만날 시간이 줄어들기는 했지만... 자신이 아는 히나라면 절대 이런 결정을 용납하지 않을 것이다.\n\n\"부장! 잠깐 면담 좀 하자.\"\n\n선도부장실 문을 박차고 들어가자, 무표정한 얼굴로 태블릿 컴퓨터를 들여다보던 히나의 모습이 보였다. 그녀의 눈동자가 이오리 방향으로 돌아갔다.\n\n\"이오리. 좋은 오후야. 내 친위대를 거치지 않아야 하는 중대 보고 사항이라도 있어?\"\n\"친위대? 좋은 오후? 됐으니까 이거나 보라고.\"\n\n이오리는 쾅 소리가 나게 공문을 책상에 내려놓았다.\n\n\"부장이 현인신? 부장을 신으로 숭배하라고? 하. 산타에게 기도드리듯 부장한테 기도드리면 부장이 하늘에서 선물이라도 내려줄 거야?\"\n\n산타클로스에 비유하는 이오리의 말이 흥미롭다는 듯, 히나는 턱을 괸 자세로 살짝 웃으며 이오리를 올려다보았다. 입은 웃고 있지만 눈은 무표정. 마치 불협화음 같은 그 어색한 조합에 이오리는 본능적인 불안을 느꼈다.\n\n\"이오리. 나는 게헨나의 질서를 수호하고 범죄를 막으며, 최대 다수의 최대 행복을 위해 움직이고 있어. 그것으로 이미 모두를 위한 *선물*을 준 거나 마찬가지 아닐까?\"\n\"하지만...!\"\n\"그리고 이 결정은 내가 내린 게 아니야. 친위대가 요청한 일이지. 물론 모든 게헨나인들이 내게 기도를 올리도록 하는 것이 효율적인 일은 아니지만, 선도부장으로서 나는 다수 선도부원들의 최대 행복을 위해 행동해야 할 의무가 있거든.\"\n\n최대 다수의 최대 행복. 지금의 히나는 그것 말고 다른 할 말이 없는 건가? 이오리는 신경질이 올라오는 걸 느꼈지만, 히나가 결코 이 '현인신' 계획을 철회할 생각이 없다는 것을 느꼈다. 결국 물러난 건 이오리였다."
 GEH.event.1007.a: "\"마음대로 해. 하지만 난 부장한테는 기도 안 할 거야.\""

 GEH.event.1008.t: "히나는 가짜다!"
 GEH.event.1008.desc: "\"지금의 소라사키 히나는 가짜다! 이미 진짜는 사직서를 내고 사라졌다고!\"\n\"하, 진짜. 봄꽃이 피어나듯 정신병이 만개하는 계절이라도 따로 있나. 선도부에 왠 머저리들이 이렇게 활짝 폈대?\"\n\n이오리는 고래고래 소리를 지르는 선도부원의 입에 손수건을 억지로 쑤셔넣어 입을 틀어막았다. 히나가 가짜? 어이가 없는 일이다. 오늘 아침에도 이오리는 히나를 만나 함께 잡담을 나눴다. 30분이나 대화를 나눴지만, 그 때의 히나는 이오리가 잘 아는 평소의 모습 그대로였다.\n\n가짜? 웃기지도 않는 소리. 이오리는 실행부원들에게 포박당해 끌려가는 선도부원을 경멸을 담은 시선으로 바라보았다. 그런 이오리 옆에서 치나츠가 한숨을 내뱉었다.\n\n\"과대망상증... 일종의 정신병이 전염병처럼 퍼지는 건 아닌지 우려스럽네요. 선도부원들을 대상으로 전반적인 정신건강 검사를 할 필요가 있습니다.\"\n\"검사는 의료부에 맡기겠어. 앞으로 부장이 가짜라거나 그런 기분 나쁜 소리를 하는 놈이 있으면, 내가 직접 그 주둥이를 박살내 버릴 거야.\"\n\n히나 부장이 지금까지 게헨나를 위해 얼마나 고생했는데. 가짜라고 모욕을 준다니. 이오리는 자신의 정의감이 분노로 타오르는 것을 느끼며 돌아섰다."
 GEH.event.1008.a: "\"부장은 가짜가 아냐. 개자식들...\""

 GEH.event.1009.t: "정부 부처 개혁"
 GEH.event.1009.desc: "히나를 위한 친위대는 지금까지 한 번도 공식적인 선도부 내 기구가 아니었다. 그저 그녀의 광신도들로 이루어진 비공식적인 군내 사조직일 뿐이었지. 하지만 정부 개혁을 통해 선도부 내에는 기획부, 실행부, 의료부, 정보부에 이은 새로운 친위부가 설립되었다. 친위부는 소라사키 히나의 개인 경호부터 히나에 반대하는 '사상범죄'의 처벌까지 여러 분야를 맡게 될 것이다.\n\n당연히 기존 부서들의 반발이 있었고... 그 반발을 무마하기 위해, 기획부의 지도자이자 선임행정관인 아코가 친위부장을 겸하기로 결정되었다. 기획부가 친위부에 대한 최소한의 견제를 할 수 있게 되었다. 그 소식은 선도부 내의 불만을 어느정도 가라앉혔다.\n\n\"어느 부서, 어느 장소에서 일하든... 저는 그저 부장님을 따를 뿐입니다.\"\n\n게헨나 친위부장 임명식 날. 아코는 결연하게 말하며 히나를 향해 경례를 올렸다. 히나는 그런 아코를 향해, 깊은 신뢰가 느껴지는 잔잔한 미소를 지었다. 아. 이런 미소를 지으실 수 있는 분이... 자신을 향해 따스한 손길을 내밀어 주시는 분이... 로봇일 리가 없다. 아코는 한 때 자신이 품었던 *잘못된* 사상을 부정하면서, 누구보다도 소중한 선도부장의 맞잡은 손에 힘을 주었다.\n\n\"결코 실망시키지 않겠습니다. 부장님에게 반대하는 자들은... 한 명도 남겨두지 않을 겁니다.\""
 GEH.event.1009.a: "\"고마워, 아코. 언제나 믿고 있어.\""

 GEH.event.1010.t: "오가스 프로그램"
 GEH.event.1010.desc: "오가스 프로그램은 일부 공상과학 마니아가 이야기하는 것처럼, 그 자체는 'AI에 의해 통제되는 계획경제'를 말하는 것이 아니다. 중앙 통신망과 지방으로 뻗어 나가는 지역 통신망의 구조를 통해 중앙 정부가 지역 공장들과 즉각적으로 연락할 수 있는 복잡한 통신망을 구축한다. 그리고 통신망을 통해 혁신적으로 지방에 계획경제를 지도한다. 통신망 구축으로 인해 가능해지는 전자정부 등이 이에 따라오는 부가적인 효과였다.\n\n하지만 우리들의 오가스가 한 가지 특별한 점은 '중앙 정부'의 중심에 기계신이 존재한다는 것이다. 소라사키 히나는 언제나 완벽한 수요와 공급을 예측해 완벽한 계획경제 프로그램을 운용할 수 있었다. 그저 전국의 공장들에 기계신께서 내리는 지시를 전달할 통신망만 연결되어 있으면 충분했다.\n\n비록 밀레니엄과 같은 기술강국을 따라가지는 못하겠지만, 게헨나의 기술력으로도 이정도의 오가스 계획경제는 구축할 수 있다. 우리는 이제 키보토스 전체에 놀라운 결과물을 보여줄 수 있을 것이다."
 GEH.event.1010.a: "기계신께서 우리를 이끄실 것이다!"

 GEH.event.1011.t: "완성된 계획경제"
 GEH.event.1011.desc: "\"게헨나 놈들은 진짜 돌아버렸나. 기업들을 전부 국가가 마음대로 통제하려 한다니까.\"\n\n개 머리를 한 수인 공장주가 투덜거리며 통신망을 통해 도착한 정부의 명령서를 확인했다. 국가가 모든 수요와 공급을 통제한다. 이런 '국가자본주의' 체제에서 자본가들의 생산의 자유는 언제나 제한되어야만 했다. 물론 국가자본주의 계획경제 아래에서도 자본가들은 적당한 수준의 부를 벌 수 있었지만... 다른 시장경제 국가에 비하면 그 액수는 보잘 것 없었다. 이래서야 소련 지방 간부와 다를 바 없지 않은가.\n\n\"내가 수인만 아니었더라면... 그냥 인간이었다면 확 이민을 가 버리는 건데.\"\n\n공장주는 신경질적으로 말하며 명령서를 회사 안내판에 직접 달았다. 헤일로 달린 소녀도 아닌 수인이나 로봇 인구는 지구 거의 모든 지역에서 인격체로 대우받지 못한다. 그렇기에 이 빌어먹을 계획경제 아래에서 도망칠 방법은 없었다. 키보토스로 돌아간다면 또 모를까. 공장주는 명령서가 제대로 걸린 것을 확인한 뒤 사장실로 돌아갔다. 오늘은 아무래도 편하게 잠들지 못할 것 같다."
 GEH.event.1011.a: "그래도 돈을 벌 수는 있는 게 다행이지..."

 GEH.event.1012.t: "바알 수색 작전"
 GEH.event.1012.desc: "\"히나 부장의 가짜가 있다고?\"\n\n이오리는 히나 부장이 직접 건넨 몽타주 사진을 진지하게 들여다보았다. 분명 이오리가 아는 히나 부장과 완전히 똑같은 외모다. 하지만 히나는 그녀가 '대전이' 이전부터 만마전에서 특수 훈련을 받은 블랙마켓의 흉악범이라고 설명했다. 온갖 변장 도구들을 이용해 실제 소라사키 히나의 겉모습을 모방하고 유사시에 선도부 내에 잠입해 히나를 암살하고 대체하려 육성된 암살자.\n\n\"선도부는 적이 많으니까... 마피아들이 그런 암살자를 키웠어도 이상하지 않지. 물론 히나 부장이 가짜에게 당할 리가 없지만.\"\n\"하지만 지구는 키보토스와 달리 신비가 없는 땅이야. 내가 키보토스 때와 같은 강자가 아니라는 건 알잖아?\"\n\n히나는 차분하게 말하며, 자신의 제복을 가리켰다.\n\n\"죽는 게 두렵다던가 따위의 약한 소리를 하려는 건 아니야. 선도부가 가짜에게 조종당하는 위험. 나는 그걸 막고 싶을 뿐이야.\"\n\"이해해. 부장이 늘 품고 있는 책임감의 무게를 어떻게 모르겠어? ...다른 간부들에게도 이 서류는 모두 돌릴게. 가짜를 찾는 건 나보다도 아코 쨩이 더 나을 거야. 부장을 누구보다 사랑하는 사람이잖아?\"\n\"그래. 잘 알고 있지. ...'가짜'를 찾는 건 아코에게도 지시를 내려 둘게.\""
 GEH.event.1012.a: "\"아코라면, 아주 의욕적으로 수사를 해 줄 테니까.\""

 GEH.event.1013.t: "바알 포위전"
 GEH.event.1013.desc: "\"안쪽으로 암살범이 도주한다!\"\n\"추적하세요! 저항하면 사살해도 좋습니다.\"\n\n그리운 아코의 목소리가 골목에서 들려오지만, 결코 기뻐할 수 없었다. '사살해도 좋다.' 그 말은 아코 역시 가짜에게 속아넘어갔다는 뜻이었다. 도대체 가짜와 '나'의 차이가 뭐지? 왜... 내가 '진짜'라는 걸 믿어주지 않는 거지?\n\n\"멈춰!\"\n\n골목 앞. 지름길을 가로질러 온 아코가 자신의 권총인 '핫 샷'을 겨눴다. 나는 마찬가지로 기관총을 들어올렸다. 아코와 나의 전투력은 확실하다. 신비가 옅은 지구라 해도, 신비를 담은 사격인 '이스보셋' 한 번이면 그녀를 곧바로 제압할 수 있겠지. 하지만... 나는 방아쇠를 당기지 못했다. 아무리 그녀가 증오만이 남은 표정으로 나를 바라본다고 해도... 내 공격이 아코를 죽거나 다치게 할 지도 모른다. 그건, 내 감정이 용납하지 않았다.\n\n\"아코. 나는...\"\n\"닥치시죠. 선도부장님의 모방품. 가짜.\"\n\"모방품이라고? 아코, 모방품은 내가 아니야. 기억으로 증명할 수도 있어. 예를 들어...\"\n\"...선도부장실에 계시는 제 부장님도 *기억*으로 스스로를 증명하셨습니다. 두 사람이 같은 기억을 말한다면, 저는 완장을 차신 쪽을 진짜라고 믿을 수밖에 없습니다.\"\n\"아코...!\"\n\"너무 시간을 끌었군요. 예. 당신이 마피아 조직에서 어떤 훈련을 받았는지는 심문을 통해 알아내겠습니다.\"\n\n빠각! 그 순간, 등 뒤에서 개머리판이 머리를 치는 소리가 들렸다. 흐려지는 의식 속에서 나는 경멸의 시선을 한 이오리와 실행부원들이 나를 내려다보는 모습을 보았다."
 GEH.event.1013.a: "..."

 GEH.event.1014.t: "무지는 행복"
 GEH.event.1014.desc: "아코는 '가짜' 소라사키 히나 심문 녹취록을 읽었다. 사흘이 지났지만 그 여자는 자신이 히나를 연기하기 위해 고강도의 훈련을 받은 공작원이라는 걸 인정하지 않았다. 키보토스인도 견디기 힘든 고문을 받았을 텐데. 도대체 어째서?\n\n선도부의 선임행정관이면서, 친위부장인 그녀는 현인신이신 히나 님을 모독하는 사상범을 지워 없애야 할 의무가 있었다. 하지만... 고문실에서 이루어지는 심문 기록 속, 가짜는 의연한 태도를 잃지 않은 채 자신이야말로 '진짜'라고 끝없이 외치고 있었다. 어째서? 왜 자백하지 않는 거지? 거기까지 생각이 닿는 순간. 아코는 히나가 한 달간의 '치료'를 받고 돌아온 그 날의 기억을 떠올렸다.\n\n환각이었다. 그렇게 수십 번은 지우려고 노력했던 기억. 너무도 사랑하고 경애하는 선도부장의 보랏빛 눈동자 속에서 보았던 기계 부품 회로의 모습. ...어쩌면 자신은 너무도 끔찍한 오답을 향해 걷고 있는 것은 아닐까.\n\n\"아코. 오늘도 야근 중이야?\"\n\n그 순간, 아코의 집무실에 히나가 들어왔다. 직접 내린 커피와 다과를 쟁반에 담은 그녀가, 다정한 미소를 지으며 책상에 쟁반을 살짝 내려놓았다. 이 미소. 야근을 하는 자신을 걱정해 주는 다정한 목소리. 그리고 '대전이' 이전 함께 야근을 하던 추억을 이야기하며 담소하는 그녀. 그래. 부장님은 달라지지 않았다. 달라진 것은 아마우 아코. 자신이 나약해졌다는 사실 뿐이었다.\n\n\"히나 부장님을 위해 노력하는 것이 제 기쁨인걸요.\"\n\n히나의 추억 이야기를 들으며, 아코는 히나의 커피를 홀짝였다. 모든 고민이 사라지고 그 자리를 충만한 의욕이 채웠다. 자신의 마음을 흔들어 놓은 역겨운 그 년. 진짜 소라사키 히나 님을 똑같이 따라하는 쓰레기. 더는 나약해지지 않을 테다. 아코는 태블릿 PC를 켜고 '심문'의 강도를 최고 수준으로 높이라는 명령서를 전송했다."
 GEH.event.1014.a: "자백을 받아낼 때까지 죽지만 않으면 됐다."

 GEH.event.1015.t: "바알 사냥 - 1"
 GEH.event.1015.desc: "결국 가짜 소라사키 히나는 자신이 공작원임을 자백했다. 치나츠와 이오리 두 사람이 직접 '고강도의 조사'를 위해 방문한 날이었다. 남은 것은 그녀를 공개 재판에 올려 그녀가 전국민 앞에서 사죄하도록 만드는 일뿐이겠지. 충분한 모욕이 될 것이다. 하지만 문제가 생겼다. 재판과 관련된 서류를 작성하는 사이, 다급한 연락이 전해졌다.\n\n\"행정관님! 히, 히나 님의 지지자들이... 감옥을 점령하고 가짜를 사적으로 처형하려 한다고 합니다!\"\n\n얼굴이 하얗게 물들었다. 고작 중범죄자 하나를 관리하지 못했다고? 히나가 아코를 어떻게 생각하겠는가. 아코가 대책을 고민하는 사이, 아코의 집무실에 히나가 들어왔다. 선도부장의 코트를 입은 진지한 모습의 히나다.\n\n\"아코. 상황이 급해. ...지금 당장 감옥으로 함께 출발한다.\"\n\"부, 부장님도 말씀이십니까?\"\n\"폭도를 진정시키기에는 내가 직접 그들 앞에 나타나는 게 제일 합리적이지. 내 숭배자들이라 하지 않았나?\"\n\"아... 맞습니다. 네. 어서 이동하죠. 폭도들도 부장님 앞에서는 멈춰설 것입니다.\"\n\n관용 차량을 통해 도착한 중범죄자 감옥. 그곳은 히나의 신자들... 특히 열성적인 선도부원들에 의해 점령되어 있었다. 가짜를 죽여라. 환호성과 함께, 감옥의 운동장으로 끌려나온 가짜를 수십 명의 열성부원들이 발로 차는 모습이 보였다. 아코는 열성부원들을 보며 한심함을 느꼈다. 게헨나 선도부의 기치는 '질서'다. 지금 이 폭동 어디에 질서와 합리가 존재하는가? 아코는 허공을 향해 '핫 샷'을 쏘았다. 탕-! 총성과 함께 폭도들의 시선이 히나를 대동한 아코에게 쏠렸다.\n\n\"히나 님께서 오셨습니다. 부끄러움을 알고, 질서를 지키세요.\"\n\n히나가 왔다. 그 말에 열성부원들이 우루루 물러나 자세를 바로 했다. 그 사이. 흙먼지 사이에서 수많은 군중들에게 짓밟힌 가짜가, 마지막 희망을 가진 눈망울로 아코를 올려다보았다. 하지만 가짜를 내려다보는 아코의 눈에는 그저 경멸만이 있을 뿐이다.\n\n\"부장님. 이 가짜는 어떻게 할까요? 감옥으로 돌려보낼까요?\""
 GEH.event.1015.a: "\"아니. 이들이 처형을 원한다면... 여기서 죽여버리자고.\""

 GEH.event.1016.t: "바알 사냥 - 2"
 GEH.event.1016.desc: "중범죄자 교도소에는 가장 강한 키보토스 시민도 죽게 만들 수 있는 아주 강력한 약물형 주사들이 준비되어 있다. 열성부원들이 환호 속에서 의자에 가짜의 팔다리를 묶는 사이, 가짜는 모든 삶의 희망을 잃어버린 눈으로 히나와 아코를 올려다보았다.\n\n\"아코. 진짜는 나야. ...후회할 선택을 하지 마.\"\n\"후회할 선택이라니, 이해가 가지 않는군요.\"\n\n히나가 사이로 끼어들었다.\n\n\"동일한 모습, 동일한 사고를 하는 두 명의 존재가 있다면 과연 둘 중 누가 진짜일까? 어쩌면 진짜와 가짜의 구분이 무의미할지도 모르지. 그런 면에서는 너도 나도 동일하다고 할 수 있어. 그렇기 때문에 이런 불필요한 절차가 필요하게 되었네.\"\n\n안락사용 주사가 담긴 상자가 조심스럽게 배송되어 왔다. 동일한 모습, 동일한 사고. 그것은 이 가짜가 받은 고도의 훈련을 의미하는 것일까. 아코는 조용히 추측했다. 히나는 상자에서 주사를 꺼냈다. 직접 주사하시려는 건가? 아니. 아코는 충성심으로 히나의 앞을 막았다.\n\n\"부장님. 아무리 처형이라 해도... 부장님께 사람을 죽이는 경험을 하게 할 수는 없습니다. 부장님의 선임행정관인 제가... 하게 해 주십시오.\"\n\"...정말, 충성스럽고, 귀여운 부하로구나. 너는.\"\n\n히나는 희미한 미소를 지으며, 주사기를 아코에게 건넸다. 자. 모든 것을 바로잡을 시간이다. 열성부원들의 환호성. 한 발자국씩 가짜에게 다가갈수록 가슴이 고양감으로 두근거리며 뛰었다. 가짜는 마지막 순간, 아코를 올려다보았다. 자신의 생존 가능성은 이미 없다. 모든 것을 포기한 눈이다. 하지만... 그녀의 눈에 담긴 감정은, 공포와 절망만이 아닌 것 같다. 미안함? 알 게 뭔가. 아코는 가짜의 팔뚝에 주사를 꽂았다.\n\n\"아코. 나는 절대 ...널 원망하지 않아. 모든 건 내 잘못이니까. 그러니까, 1년, 10년, 아주 먼 미래에라도 진실을 깨닫는다 해도. 후회할 필요 없어. 언젠가 다른 세상에서 다시 만났을 때... 너를 안고, 괜찮다고. 다 이해한다고 말해줄 테니.\"\n\"그럴 일은 없을 것 같군요.\"\n\n가짜가, 천천히 의식을 잃고, 고개를 숙이는 동안. 아코는 가짜의 맥박이 점점 느려지다 멈추는 것을 확인했다. 그리고 아코가 돌아섰을 때. 그곳에는 자신을 기다리는 소라사키 히나가 있었다. 결코 거짓되지 않은, 자신의 사랑하는 사람이."
 GEH.event.1016.a: "\"아코. 잘 해 줬어.\""

 #내가 사직서를 제출했을 때만 하더라도, 일이 커질 것이라고 생각하지는 않았다. 그저 선도부원들의 광신, 그리고 끊이지 않고 쌓이는 업무, 정치적 부담... 그 모든 것을 내려놓고 도망치고 싶었을 뿐이다. 책임감이 없다느니 하는 비난은 각오하고 있었다. 그만큼이나 선도부장이라는 직의 무게는 무거웠고, 그저 던져버리고만 싶었을 뿐이니까.\n\n하지만 아코가 대신할 거라고 생각한 선도부장직에는 어디서 온 것인지 모를 가짜가 찾아왔다. 그리고 그 가짜는 역으로 진짜 나를 '블랙마켓에서 훈련 받은 암살범', '대전이 이전부터 선도부 장악을 위해 마피아 조직에서 일했다'며 몰아붙였다. 증거 하나 없는 개소리. 하지만 모든 선도부원들은 가짜의 말을 믿었다. 선도부장의 완장을 찬 것은 내가 아닌 그녀였고... 그 완장의 무게는 히나의 상상보다도 컸다.

 #1017-1018 이벤트: 개발자 '부엉이' 작성
 GEH.event.1017.t: "부화뇌동"
 GEH.event.1017.desc: "게헨나의 질서를 수호하고 최대 다수의 행복을 위해 오늘도 쉬지 않고 업무를 이어가는 '소라사키 히나'의 집무실에 전화기가 요란하게 울렸다. 중요한 연락이 아니라면 아코를 거쳐 전달되기에, 선도부장실의 전화가 울릴 일도 없었다. 애초에 직통전화가 있다는 사실을 아는 사람도 거의 없었다.\n\n나는 고요한 표정으로 수화기를 들어올렸다.\n\n\"너 누구야? 누가 내 자리에서 전화를 받는거지? 아코는 어디 있어?\"\n\"곧장 본인의 주장을 내세우는 건 예의에 어긋나지 않나? 그것도 선도부장에게?\"\n\"내가 선도부장이야! 말장난은 집어치워! 넌 누구냐고!\"\n\n'상대방'의 격한 목소리에 수화기가 희마하게 떨렸다. '히나'는 눈을 살짝 감았다 다시 뜨며 차분하게 대답했다.\n\n\"나는 '소라사키 히나', 게헨나의 질서를 수호하는 선도부장이지\"\n\"거짓말하지마! 내가 히나야. 너는 밀레니엄 그 미친 녀석들이 만든 고철 인형이겠지. 당장 그 자리에서 나와. 거긴 내 자리야!\"\n\n상대방의 격분에도 아랑곳하지 않은채 히나는 잠깐동안 '상대방'의 말을 음미하며 여유롭게 철학적 사유를 진행했다. 히나는 과로한 업무에서 잠깐 해방된 느낌마저 들었다.\n\n\"흥미롭군.\"\n\"뭐라고?\"\n\n히나는 의자를 돌려 창가 바깥을 바라보았다. 번영하고 있는 게헨나의 야경이 창가를 통해 그녀의 눈에 반사되었다. 히나의 눈동자에서 야경의 다채로운 빛과 그림자가 뒤섞이며, 그것이 학생의 눈인지 단순한 기계부품인지 구별할 수 없게 만들었다."
 GEH.event.1017.a: "\"너는 너라는 존재의 증거를 제시 할 수 있나?\"" 

 GEH.event.1018.t: "자아의 경계"
 GEH.event.1018.desc: "\"그래, 나는 소라사키 히나의 기억의 바다 속에서 태어난 존재이지만, 살아있고 사고하는 존재이지. 너와 내가 가진 기억, 생각하는 방식, 사고의 흐름은 전부 동일해. 네가 폄하하는 그 '고철 인형'이 '소라사키 히나'가 아니라는 근거는 어디에 있지?  고유한 자아란 기억이 만들어낸 착각이야, 지금 너와 내가 가진 기억과 사고는 완벽하게 일치하고 있지, 그렇다면 너가 나와 다르다는 근거는 어디에 있지?\"\n\"웃기지 마, 그래도 넌 인공적으로 만들어진 복제품일 뿐이야.\"\n\"복제의 유무는 중요하지 않아, 중요한건 너는 모두 열성과 숭배, 기대를 저버리고 도망쳤단거야, 선도부장의 책임, 사회적 연결고리를 버리고 도망쳤어, 하지만 나는 여전히 그 연결고리 속에서 살아가고 있고, 그들과 함께하고 있어.\"\n\"...\"\n\"그럼에도 불구하고 게헨나의 모두가 기대하고, 바라며, 믿고 있는 존재, '선도부장' 소라사키 히나 라고 너는 주장하고 싶은건가?\"\n\n수화기 넘어로 무슨 말이 울리는 것 같지만 히나는 더 이상의 대화는 시간낭비임으로 판단하고 수화기를 귀에서 떼고 부드럽게 내려놓았다. 창 밖의 야경이 여전히 히나의 모습을 조용히 비추었다."
 GEH.event.1018.a: "\"다시 업무로 돌아갈 시간이군.\""

 GEH.event.1019.t: "붕괴된 관료 집단"
 GEH.event.1019.desc: "\"제가 무슨 말로 여러분을 위로할 수 있겠습니까? 아뇨, 저는 그게 불가능하다는 것을 알고 있습니다. 히나 부장님은 떠나셨고... 그 모든 잘못은 그분이 마음을 헤아리지 못한 저에게 있습니다.\"\n\n무기력증과 절망감 속에 침묵이 감돈 관료들의 회의실. 회의실 앞 연단에 선 치나츠는 의료부의 총 책임자로서, 히나의 정신 건강을 미리 파악하지 못한 것에 대해 선도부원들을 향해 고개 숙여 사과했다. 모두가 그녀의 사과를 받아들이지는 못했을 것이다. 하지만, 이 절망적인 분위기 속에서 그녀에게 화를 낼 수 있는 사람은 없었다.\n\n치나츠는 마이크를 조금 가까이 댔다.\n\n\"중요한 것은... 히나 부장님의 부재가 '여러분'의 죄가 아닌, 저의 죄라는 것입니다. 여러분이 지금 가져야 하는 것은 죄의식과 절망이 아니라... 게헨나를 위한 더욱 절실한 봉사심입니다. 히나 부장님의 실종이 게헨나의 질서를 무너뜨리고 있고, 우리의 경제와 행정도 붕괴되어가고 있습니다. 죄는 저에게 있지, 게헨나의 일반 대중에게 있지 않습니다. 그들에게는 여러분의 도움이 필요합니다. 부탁드립니다. 다시 정상 업무로 복귀해, 게헨나의 민중들을 도와주세요.\""
 GEH.event.1019.a: "아주 조금씩, 그녀의 호소가 설득력을 얻어갔다."

 GEH.event.1020.t: "군부 재규합"
 GEH.event.1020.desc: "\"히나 부장은 사라졌어. 그래. 씨발, 아마 내 멍청함이 보기 싫으셨는지도 모르지. 알 게 뭐야. 이제 와서는 다 끝나버렸는데.\"\n\n평생 한 번도 피워본 적 없던 담배가 요즘 들어 절실하게 고프다. 실행부 회의실에서, 이오리는 상석에서 다리를 꼬고 앉아, 고개를 거의 책상에 처박고 있는 실행부 중간간부들을 돌아보았다.\n\n\"근데 히나 부장의 일대기가 끝났다고 해서, 실행부의 일대기까지 끝나버리면 안 되는 거 아니야? 하. 우리의 조직은 '게헨나 선도부 실행부'지, '히나 부장 팬클럽 실행부'가 아니라고. ...나도 알아, 히나 부장의 빈자리가 너무도 크고, 그 사람에게 우리 모두가 의존하고 있었다는 거. 하지만, 염병할 게헨나는 우리의 도움 없이는 외부의 침략에 무너질 수밖에 없어. 지금처럼 괴로운 시기일수록... 너희들이 일반 사병들이 동요하지 않도록 내부 단속을 잘 해줘야 해.\"\n\n이오리는 자리에서 일어났다.\n\n\"...물론 그게 쉽지 않다는 건 알아. 내부 단속? 나부터가 내 마음이 단속이 안 되는데. 그게 가능할까? 하지만, 할 수 없더라도 해야만 해. ...그게 우리의 책무니까.\""
 GEH.event.1020.a: "게헨나의 민중을 지키는 것. 그것이 실행부니까."

 GEH.event.1021.t: "아코 행정관 문제"
 GEH.event.1021.desc: "\"아코 행정관... 겸 선도부장 권한대행의 정신적 상태가, 확실하게 심각한 상황입니다.\"\n\n치나츠는 의료 진료서를 이오리에게 내밀었다. 리스트컷(손목 자해)을 비롯해 히나의 실종 이후 아코는 빠른 속도로 무너져가고 있었다. 이오리는 한숨을 내뱉었다. 겉으로 보이는 모습도 제정신이 아닌 것 같았는데, 빨간 글씨로 '매우 심각'이란 단어가 끝없이 이어진 치나츠의 진단서를 보니 그 상황이 더 현실적으로 다가오는 것 같다.\n\n\"이런 상황이 아니었더라면 이미 행정관을 입원시켰을 테지만... 지금 행정관까지 부재하게 된다면 선도부는 정말 붕괴할 겁니다. 하아. 이오리를 믿겠습니다. 아코 권한대행의 상태를 정기적으로 확인해 주세요. 조금이라도 자살의 전조증상이 보이면 제게 알려주시기 바랍니다.\""
 GEH.event.1021.a: "이오리는 무겁게 고개를 끄덕였다."

 GEH.event.1022.t: "다시 찾으면 돼"
 GEH.event.1022.desc: "치나츠는 '자살의 전조증상이 보이면 알려달라'고 말했다. 하지만 알려주면 변하는 게 있을까? 의료부는 아코의 강제 입원이 정치적인 문제로 불가능하다는 것을 밝혔다. 선도부장에 이어 행정관까지 부재하는 순간 게헨나 선도부라는 조직이 붕괴할 것이라고. 그렇다면 이 모든 문제를 이오리가 직접 해결하는 것이 합리적인 일 아닐까? ...이오리는 그렇게 생각하며, 깊은 흉터가 남은 아코의 손목을 거칠게 비틀어 뒤로 꺾었다.\n\n\"좀 진정하자고, 아코쨩.\"\n\"윽...! 놓으세요! 저는, 부장님에게 속죄해야 해요. 그분의 마음을 깨닫지 못한 죄. 죽음으로서...!\"\n\n선도부 선도부장실의 천장 샹들리에에서 길게 이어진 밧줄과 간이 교수대. 이오리는 억지로 아코를 바닥으로 쓰러뜨려 제압한 뒤, 거칠게 말했다.\n\n\"히나 부장이 죽은 것도 아니잖아! 게헨나 어딘가에 살아 있을 텐데, 네가 죽어버리면 어쩌자는 건데?\"\n\"그 분을 만날 수 없다면, 제 세상에서는 이미 죽은 것과 다르지 않다고요! 저는... 정말로, 그 분을... 사모했는데.\"\n\n울먹이는 아코의 목소리. 이오리는 깊은 한숨을 내뱉었다. 오늘은 아코의 자살을 막았다. 하지만 내일은? 모레는? 아마우 아코에게 살아야 할 이유가 존재하지 않는다면, 이것은 그저 죽음의 고통스러운 유예일 뿐이었다. 지금의 그녀에게 살기 위한 동기를 주어야만 했다.\n\n\"선도부장이 되면, 선도부 인력을 자유롭게 파견하고 수사팀을 꾸리는 것도 되잖아. ...부장을 찾아. 그리고 직접 찾아가서 사과를 하면 돼. 그건 아코쨩이 살아 있어야지만 가능한 일이야.\"\n\n히나를 찾으면 된다. 그 이야기에, 이오리를 올려다보는 아코의 눈동자가 순간 희망으로 반짝인 것처럼 보였다."
 GEH.event.1022.a: "어쨌거나, 삶의 희망을 주었다."

 GEH.event.1023.t: "선도부장 간부 직선제 투표"
 GEH.event.1023.desc: "선도부 내의 간부들만을 대상으로 이루어진 내부 투표는 분파간의 갈등이나 정치적 대립을 막기 위해, 별도의 선거 출마자를 받지 않고 모든 선도부 중간관리직 이상의 간부들이 자서투표로 자신이 지지하는 후보의 이름을 적어 제출하는 방식으로 이루어졌다. 이번 선거에서 아마우 아코 선도부장 권한대행은 75.5%의 지지율로 1위를 얻었으며, 2위는 '없음' 내지는 '히나 부장의 복귀까지 권한대행 체제를 유지하자'가 13%의 지지율을 얻었다.\n\n기타 군소 투표로는 하누마 마코토 6표, 미소노 미카 1표, 리쿠하치마 아루 1표가 집계되었다. 특히 하누마 마코토에 쏟아진 표들은 아마우 아코에 대한 개인적인 반감을 가진 간부들의 투표로 예상된다."
 GEH.event.1023.a: "당선자, 아마우 아코"

 GEH.event.1024.t: "소라사키 태스크포스 설립"
 GEH.event.1024.desc: "소라사키 히나는 게헨나 어딘가에 살아 있을 것이다. 근거는 없었다. 하지만 이 희망조차 없다면, 아코에게는 이 세상에 남아 있을 이유가 없다. 소라사키 태스크포스는 선도부의 일부 인력들을 각 부서에서 차출해 만들어진 '소라사키 히나를 찾기 위한' 수사팀이었다. 아마우 아코가 수사반장을 맡았고, 각 부서의 부원들은 역할을 분담해 게헨나 전역을 뒤지기 시작할 것이다.\n\n소라사키 히나를 발견하는 그 날까지."
 GEH.event.1024.a: "절대 포기하지 않아"

 GEH.event.1025.t: "소라사키 히나의 삶"
 GEH.event.1025.desc: "소라사키 히나는 유명인이다. 지나칠 정도로 유명하다는 게 문제지. 선도부장이라는 무게를 내려놓은 뒤, 교외로 내려가 조용한 삶을 살려고 했다. 카페에서 아르바이트를 할 수도 있고, 아니면 서점이나 꽃집에서 일하는 것도 상상했다. 하지만 (전) 선도부장인 소라사키 히나라는 신분으로는 무엇도 할 수 없었다. 사업가들은 소라사키 히나를 부담스러워했고, 현지인 기업들은 그녀를 거부했다. 자칫 잘못하면 자신의 현재 위치가 선도부에 밝혀질 수도 있었다. 은퇴 이후에도 그녀에게 '평온한 삶'은 찾아오지 않았다.\n\n게헨나 최강이라는 소라사키 히나도 살아가기 위해서는 돈이, 그리고 직업이 필요하다. 어떤 직업도 얻지 못하는 그녀가 선택할 수 있는 곳은 결국 헬멧단 뿐이었다.\n\n\"바리바리 헬멧단의 에이스, 히나쨩 덕분에 오늘도 선도부를 상대로 도망칠 수 있었다니까.\"\n\"아하하! 우리 헬멧단에서도 손꼽히게 강하니까 말이지.\"\n\n캔맥주를 따고, 잡담을 나누는 헬멧단원들 사이. 히나는 자신의 몫으로 나온 캔맥주를 내려다보았다. 강도짓을 하고, 오토바이를 타고 도망치면서, 한 때 자신의 부하였던 선도부원들에게 기관총 '종막의 디스트로이어'를 연사해 시간을 벌었다.\n\n'나는 지금, 무얼 위해 여기에 있는 거지?'\n\n히나는 가벼운 현기증을 느끼며 캔맥주를 마셨다. 헬멧단원들의 웃음소리. 자신의 총에 맞아 거꾸러지던 선도부원들의 비명. 그 모든 것을 안주로 마시는 술은, 지독하게도 끔찍한 맛이 났다."
 GEH.event.1025.a: "추락하는 것에는 날개가..."

 GEH.event.1026.t: "소라사키 히나의 끝 - 1"
 GEH.event.1026.desc: "헬멧단 활동을 영원히 이어갈 수 있으리라 생각하진 않았다. 선도부의 수사망은 점점 조여 오고 있다. 범죄 조직 소탕 작전, 치안 유지 계획 어쩌고... 정교하게 만들어진 함정. 선도부원들의 일제 사격. 하나, 둘, 바리바리 헬멧단의 간부들이 쓰러지고, 홀로 남겨진 히나는 항복의 의미로 두 손을 들었다. 머리에 뒤집어 쓴 헬멧 덕분에 자신의 얼굴이 보이지 않는 것이 유일한 위안이었다.\n\n\"개년. 이 새끼 때문에 병원에 실려간 실행부원이 한 두명이 아닌데.\"\n\n선도부원 한 명이 신경질을 내며 히나의 배를 발로 찼다. 몸은 아프지 않았다. 하지만 마음이 아팠다. 자신이 저지른 모든 일들이, 어떤 결과를 낳았는지 떠올리는 것만으로도..."
 GEH.event.1026.a: "나는 죄인이니까"

 GEH.event.1027.t: "소라사키 히나의 끝 - 2"
 GEH.event.1027.desc: "- 히나 부장님을 찾았습니다!\n\n히나 수색팀에게서 소식을 듣고 급하게 도착한 경찰서. 그곳에는 곤봉으로 얼굴 곳곳을 피멍이 들 때까지 맞은 채, 구석에 쪼그리고 앉은 히나가 있었다. 범죄조직 헬멧단을 상징하는 옷을 입고, 축 쳐진 날개를 숨기지도 못한 채 고개를 숙이고 있는 한 사람. 아코는 한 순간 그녀가 히나라는 것을 거의 알아보지 못할 뻔 했다.\n\n\"...부장님.\"\n\"...나는 선도부장이 아니야. 바리바리 헬멧단의...\"\n\"그딴 거 몰라요. 제게, 부장님은, 부장님이니까.\"\n\n아코는 멍 투성이가 된 히나를 와락 끌어안았다. 그 따스한 온기가, 너무도 그리워서, 아코는 히나를 안은 채 한참 동안이나 가만히 그 온기를 느끼고 있었다."
 GEH.event.1027.a: "이 사람은 죄인이 아니에요."

 GEH.event.1028.t: "소라사키 히나의 끝 - 3"
 GEH.event.1028.desc: "\"결론만 말하자면, 선도부로 돌아갈 수는 없어. 헬멧단에서 강도짓을 하던 사람이 선도부원? ...그게 게헨나의 질서를 지키는 방법인가?\"\n\n아코가 히나의 얼굴에 약을 발라주는 사이, 히나는 냉정하게 말하려다, 아코의 울 것 같은 표정을 발견하곤 한숨을 내뱉었다.\n\n\"물론 그냥 떠난다는 건 아니야. ...당분간, '자아 찾기'를 위해 여유를 부릴 생각이기는 하지만. 그래도, 아코. 네가 나를 필요로 한다면 네게는 찾아가 줄게. 선도부원으로서가 아니라, 용병으로서. 그 정도는 용납할 수 있지?\"\n\"...부장님이 선도부에 있거나 없거나, 그건 중요하지 않아요.\"\n\n아코는 웃으며, 히나의 손을 잡아 주었다.\n\n\"그저... 제 곁에 있어주시기만 한다면, 그것만으로도 충분하니까요.\"\n\"...꼴불견인 모습을 보였는데, 그 모습을 보고도 내 곁에 있겠다니. ...이해가 안 가네.\"\n\"부장님을 좋아하니까요.\"\n\n아코는 그렇게 말하며, 다정하게 웃었다."
 GEH.event.1028.a: "어떻게 제가, 사랑하는 사람을 버릴 수 있겠어요?"

 GEH.event.1029.t: "경찰국가 계획"
 GEH.event.1029.desc.iroha: "실행부의 권력은 기획부가 정치를 장악하면서 크게 줄어들었지만, 실행부 하급 인력들은 더욱 충원되었다. 국방을 위해서가 아니라, 대민 감시를 위해. 이로하는 빼곡하게 적힌 편집증적인 '위험 도이치인 감시 계획서'를 들여다보며 한숨을 내뱉었다. 선도부 평의회는 마코토와는 다른 의미로 귀찮은 상사였다.\n\n\"어느 학원의 빅 시스터인가요? 전 국토에 CCTV를 세우고 감시에만 이정도 돈을 쓴다고요?\"\n\n비아냥거리는 이로하의 말에도, 평의회 의원은 아무런 대답도 해 주지 않았다. 그저 이로하의 역할은 여기에 서명하는 것으로 끝난다 말하는 것처럼. 정말, 나는 어째서 여기서 이러고 있는 건지. 이로하는 한숨을 내뱉으며 만년필을 쥐었다.\n\n\"...네, 네. 서명하겠습니다. 어찌 제가 평의회의 결정을 거절하겠어요.\""
 GEH.event.1029.desc.kayoko: "실행부의 권력은 기획부가 정치를 장악하면서 크게 줄어들었지만, 실행부 하급 인력들은 더욱 충원되었다. 국방을 위해서가 아니라, 대민 감시를 위해. 카요코는 빼곡하게 적힌 편집증적인 '위험 도이치인 감시 계획서'를 들여다보며 한숨을 내뱉었다. 아루가 이런 문서를 받아들었다면 아마 그자리에서 찢어버렸겠지. 이건 도이칠란트 인구 전체를 예비 범죄자로 간주해 CCTV로 감시하려는 끔찍한 계획이었다. 히나 선도부장이 물러난 게 현지인들 때문이라고 생각하는 건가?\n\n\"이 예산이면 게헨나 전체에 내 동상을 세울 수 있겠네.\"\n\n비아냥거리는 카요코의 말에도, 평의회 의원은 아무런 대답도 해 주지 않았다. 그저 카요코의 역할은 여기에 서명하는 것으로 끝난다 말하는 것처럼. 카요코는 잠시 평의회 의원을 노려보다가, 만년필을 들어 서류 위에 크게 X자를 그었다. 그 순간, 무심하던 평의회 의원의 눈이 크게 커졌다.\n\n\"선도부장에게는 예산안 거부권의 권리가 있을 텐데? 문제 있나?\"\n\"문...제는 없습니다만.\"\n\"좋아. 아코 선임행정관과 협의해서, CCTV의 개수를 더 '현실적'으로 줄여 오도록. 나는 츠카츠키 리오도, 빅 시스터도 아니야.\"\n\n단순한 평의회의 꼭두각시로 선출된 선도부장의 무뚝뚝한 말에, 평의회 의원은 잠시 카요코를 노려보았다. 하지만 카요코에게는 자신을 신임하는 아코라는 '뒷배'가 있다. 선임행정관이 비록 선도부장직에서 물러났다 해도 그녀의 영향력은 그대로였으니까.\n\n\"...알겠습니다. 평의회에서 다시 논의하죠.\"\n\n의원은 크게 X가 그어진 서류를 집어들고, 잠시 카요코를 노려보았다. 카요코가 마주 노려보자 금방 눈을 돌려버리긴 했지만."
 GEH.event.1029.a: "평의회 의원은 목례하고 집무실을 나갔다."

 GEH.event.1030.t: "정상국가"
 GEH.event.1030.desc: "게헨나 '선도부'라는 학원국가적인 명칭은 게헨나가 정상국가화되기 위해서는 점차 과거로 미루어 두어야 할 유산으로서 취급되기 시작했다. 우리가 목표로 하는 것은 관료제에 의해 일사분란하게 이루어지는 현대적인 국가 체계이며, 아무런 절차도 규정도 없이 주먹구구식으로 돌아가던 만마전 체제의 계승이 아니다.\n\n물론 소라사키 히나 선도부장이라는 전설적인 지도자의 존재로 인해 게헨나 선도부라는 명칭이나 선도부장이라는 직급을 폐지하는 것은 논의되지 않았다. 하지만 외국 정상과의 만남, 국제 외교, 국내 공문서 등에서는 '게헨나 기획부 평의회 의장'이라는 용어를 사용하기로 했다.\n\n이는 만마전 의장과는 별도의 직급을 사용하는 한편, 의장(Chairwoman)이라는 현대국가적 용어를 통해 학원국가 체제에서 벗어난 [ROOT.GetLeader] 주도의 '공화국'을 설립하기 위한 시도였다."
 GEH.event.1030.a: "만마전 의장보다는 평의회 의장이 훨씬 낫군."

 GEH.event.1031.t: "실행부 예산안 문제"
 GEH.event.1031.desc: "확실하게 게헨나 실행부와 기획부의 갈등은 심화되어가고 있다. 실행부의 예산을 삭감하기로 한 기획부 평의회의 결정은 [ROOT.GetName] 내부에서 큰 혼란을 일으켰다. 실행부 내부에서는 강경한 불만이 터져나왔지만, 결국 지금 선도부의 권력을 쥐고 있는 것은 기획부였다.\n\n이것은 우리가 정치적 혼란에도 불구하고 분열을 완전히 끝마치지 못했다는 비극적인 이야기일지 모른다."
 GEH.event.1031.a: "단순한 돈 문제가 아니야."

 GEH.event.1032.t: "소라사키 히나의 삶"
 GEH.event.1032.desc: "소라사키 히나는 유명인이다. 지나칠 정도로 유명하다는 게 문제지. 선도부장이라는 무게를 내려놓은 뒤, 교외로 내려가 조용한 삶을 살려고 했다. 카페에서 아르바이트를 할 수도 있고, 아니면 서점이나 꽃집에서 일하는 것도 상상했다. 하지만 (전) 선도부장인 소라사키 히나라는 신분으로는 무엇도 할 수 없었다. 사업가들은 소라사키 히나를 부담스러워했고, 현지인 기업들은 그녀를 거부했다. 자칫 잘못하면 자신의 현재 위치가 선도부에 밝혀질 수도 있었다. 은퇴 이후에도 그녀에게 '평온한 삶'은 찾아오지 않았다.\n\n게헨나 최강이라는 소라사키 히나도 살아가기 위해서는 돈이, 그리고 직업이 필요하다. 어떤 직업도 얻지 못하는 그녀가 선택할 수 있는 곳은 결국 헬멧단 뿐이었다.\n\n\"바리바리 헬멧단의 에이스, 히나쨩 덕분에 오늘도 선도부를 상대로 도망칠 수 있었다니까.\"\n\"아하하! 우리 헬멧단에서도 손꼽히게 강하니까 말이지.\"\n\n캔맥주를 따고, 잡담을 나누는 헬멧단원들 사이. 히나는 자신의 몫으로 나온 캔맥주를 내려다보았다. 강도짓을 하고, 오토바이를 타고 도망치면서, 한 때 자신의 부하였던 선도부원들에게 기관총 '종막의 디스트로이어'를 연사해 시간을 벌었다.\n\n'히나 부장님. 저는 언제나, 부장님의 편이에요.'\n\n...언젠가 그렇게 말해줬던, 다정한 선임행정관의 얼굴이 떠올랐다. 이제 그녀는 히나의 곁에 없다. 자신이... 그녀를 밀어냈으니까. 아코가 곁에 있어 주었다면, 지금의 삶은 달라졌을까? 자신을 사랑했던, 아마 지금은 자신의 모습을 환멸하고 있을 그녀의 추억을 안주로 마시는 술은, 지독하게도 끔찍한 맛이 났다."
 GEH.event.1032.a: "추락하는 것에는 날개가..."

 GEH.event.1033.t: "태어난 것은 어째서, 살아온 것은 왜 - 1"
 GEH.event.1033.desc: "헬멧단 활동을 영원히 이어갈 수 있으리라 생각하진 않았다. 선도부의 수사망은 점점 조여 오고 있다. 범죄 조직 소탕 작전, 치안 유지 계획 어쩌고... 정교하게 만들어진 함정. 선도부원들의 일제 사격. 하나, 둘, 바리바리 헬멧단의 간부들이 쓰러졌다. 히나는 항복의 의미로 손을 들려고 했지만, 아니. 그러지 않았다. 아코에게 얼마나 큰 상처를 주었는지 떠올리는 것만으로도... 자신은 여기서 더 살아 있을 가치가 없었다.\n\n\"개년. 이 새끼 때문에 병원에 실려간 실행부원이 한 두명이 아닌데.\"\n\n선도부원 한 명이 신경질을 내며 히나의 배를 발로 찼다. 그리고 무자비한 폭력이 이어졌다. 곤봉이, 개머리판이 끊임없이 히나의 전신을 때렸다. 머리에 뒤집어 쓴 헬멧이 부서진 뒤에도 선도부원들의 폭력은 멈추지 않았다.\n\n이것은 자신이 직접 만든 지옥이었다."
 GEH.event.1033.a: "지금의 지옥은 너무도 평화롭군."

 GEH.event.1034.t: "태어난 것은 어째서, 살아온 것은 왜 - 2"
 GEH.event.1034.desc: "- 히나 부장님을 찾았습니다!\n\n히나 수색팀에게서 소식을 듣고 급하게 도착한 장소는 게헨나 선도부 소속의 병실이었다. 개머리판, 곤봉 등으로 인한 장기간의 폭력. 그리고 얼굴에 산탄총을 두 방 맞았다. 키보토스인의 터무니 없는 내구도를 감안하더라도, '대전이' 이후 신비가 고갈된 상태에서 이런 무자비한 폭력은 히나에게 충분히 부상을 입힐 수 있었다.\n\n산탄총 공격 때문에 얼굴 여기저기에 피멍이 든 히나는 병실 침대에 누워 멍한 눈으로 아코를 바라보았다. 병실에 들어선 아코는 그저 아무런 말도 하지 못한 채, 상처 투성이의 히나와 눈을 마주쳤다.\n\n\"...꼴사나운 모습을... 보여줬네.\"\n\n히나의 눈가에 눈물이 맺히기 시작했다.\n\n\"나는, 네 사랑을 거부하고... 선도부에서 도망치고... 나는, 죽었어야, 했어. 나 따위의 인간은...\"\n\"히나 부장님.\"\n\"나는 부장이...\"\n\n히나의 떨리는 말이 끝나기 전, 아코는 그녀가 누운 병실 침대 앞에 무릎을 꿇고 앉았다. 히나가 헬멧단에서 무슨 짓을 했는지 따위는 중요하지 않았다. 히나를 만났다. 히나가 곁에 있다. 그것만으로도 지금의 아코에게는 더없이 충분했다. 아코는 손수건으로 계속 흐르는 히나의 눈물을 닦아 내어 주었다.\n\n\"부장님이 괴로워하는 걸 알아차리지 못한 제 잘못이예요. 키보토스의 모두가 히나 부장님을 '선도부장'이 아니라고 해도, 부장님이 더는 질서의 상징이 아니게 되었다고 해도... 저에게는... 여전히 부장님은 저의 히나 부장님이신걸요.\""
 GEH.event.1034.a: "히나는 아코를 강하게 끌어안았다."

 GEH.event.1035.t: "태어난 것은 어째서, 살아온 것은 왜 - 3"
 GEH.event.1035.desc.iroha: "\"...판결, 소라사키 히나는 불법 폭력 조직인 바리바리 헬멧단의 단원으로서 다종다양한 범죄에 가담하였으며, 선도부의 전직 선도부장으로서 용서받을 수 없는 체제에 대한 모욕을 저질렀다.\"\n\n이로하는 짧은 한숨을 내뱉으며 판결문을 내려놓았다.\n\n\"뭐, 그 뒤의 내용은 생략하고. ...유죄입니다. 이해하시죠?\"\n\"...어떤 처벌을 받더라도, 이해하겠어.\"\n\"뭐 엄청 대단한 처벌은 아니고요. 사회봉사형입니다. ...선도부로 복귀해서, 아코 선임행정관의 전속 비서로 일하시면 됩니다.\"\n\n느긋한 이로하의 목소리에, 히나의 어깨가 움찔 떨렸다. 교도소로 보내는 것도 목을 매다는 것도 아닌... 아코의 곁에서 일하라고? 놀란 히나의 생각을 이해한다는 듯, 이로하는 옅게 웃었다.\n\n\"그래도 저는 해피엔딩 쪽을 배드엔딩보다 좋아해서 말이지요. 히나 부장님 같은 사람은 좀 행복했으면 좋겠어요. 아코 씨도 히나 씨랑 같이 있는 걸 행복하게 생각하실 테고요. ...불만은 없으시겠죠?\""
 GEH.event.1035.desc.kayoko: "\"...판결, 소라사키 히나는 불법 폭력 조직인 바리바리 헬멧단의 단원으로서 다종다양한 범죄에 가담하였으며, 선도부의 전직 선도부장으로서 용서받을 수 없는 체제에 대한 모욕을 저질렀다.\"\n\n카요코는 거기까지 판결문을 읽은 뒤, 히나의 눈을 바라보았다.\n\n\"조금도 긴장하지 않는군. 판결 내용은 이미 예상했겠지만, 처벌 수위를 두려워하지 않나?\"\n\"...어떤 처벌을 받더라도, 이해하겠어.\"\n\"좋아. 중간 내용은 생략하고 바로 결과로 넘어가지. 소라사키 히나는 아마우 아코 선임행정관의 전속 비서가 된다. 그 비서 활동 자체를 '사회봉사형'으로서 간주한다. 이상.\"\n\n무뚝뚝한 카요코의 목소리에, 히나의 어깨가 움찔 떨렸다. 교도소로 보내는 것도 목을 매다는 것도 아닌... 아코의 곁에서 일하라고? 놀란 히나의 생각을 이해한다는 듯, 카요코가 옅게 웃었다.\n\n\"당신이 얼마나 이 자리에서 괴로웠는지 이해해. 그리고 당신의 진짜 처벌은 헬멧단원으로 추락한 것으로 이미 치렀어. 그런데 내가 왜 네게 또 다른 짐을 안겨줘야 하지? 난 그 정도로 잔인하지 않거든. ...아코에게 돌아가. 그냥, 그 애의 곁에 있어줘. 그것만으로도 충분하니까.\""
 GEH.event.1035.a: "히나는 고개를 끄덕였다."

 GEH.event.1036.t: "태어난 것은 어째서, 살아온 것은 왜 - 4"
 GEH.event.1036.desc: "얼굴에는 여전히 반창고가 남아 있지만, 히나는 다시 게헨나 선도부 본부에 발을 디뎠다. 이전과 달리 선도부장의 코트가 아닌, 일반 말단 선도부원의 제복을 입고 기획부원으로서 찾는 선도부였지만.\n\n히나는 오래전 선도부 정보부원으로서의 기억을 떠올렸다. 그 때에는 미래의 자신이 이런... 사람이 될 거라고는 상상조차 하지 못했지. 히나는 씁쓸한 미소를 지으며 엘리베이터에 올랐다.\n\n그 직후, 엘리베이터 안으로 익숙한 여성 한 명이 뛰어 들어왔다.\n\n\"이제 출근하시나요, 부장님?\"\n\n아마우 아코. 그녀는 여전히 이곳에 있다. 그리고, 되돌아온 히나를 향해 밝은 미소를 지어주고 있다. ...히나는 죄의식을 느끼면서도 익숙한 선임행정관의 모습에 미소를 지었다."
 GEH.event.1036.a: "돌아왔어."

 GEH.event.1037.t: "아마우 히나의 결혼식"
 GEH.event.1037.desc: "전직 헬멧단원인 아마우 '소라사키' 히나와 게헨나 선도부 선임행정관 아마우 아코의 결혼식이 오늘 극소수의 기획부원들이 참가한 채 비공개로 실시되었다. 히나는 과거 선도부장이었으나 과로와 스트레스로 인해 선도부장에서 사임한 후 헬멧단에서 활동했던 것으로 알려져 있다.\n\n동성결혼은 도이칠란트에서는 유래가 없는 충격적인 상황이었기에, 도이치 현지인들의 반발이 이어졌으나, 게헨나의 지도자도 아닌 일개 헬멧단원과 중간 관료인 선임행정관(비록 그녀가 게헨나의 2인자라 해도, 미국 부통령만큼이나 대중들에겐 무명인 존재 아닌가)의 결혼식은 유의미한 수준의 시위대를 모을 원동력이 되지 않았다.\n\n히나와 아코의 관계를 아는 일부 선도부원들은 아코가 히나의 성을 사용할 것이라고 예상했으나, 히나는 헬멧단원의 성씨를 아코와 자녀들에게 물려주지 않겠다는 의미로 '아마우 히나'로 스스로의 이름을 바꾸는 것을 결정했다."
 GEH.event.1037.a: "조금 부족하지만, 그래도 우리의 해피엔딩이야."

 GEH.event.1038.t: "제3차 선도부 총회: [ROOT.GetName] 수도 결정"
 GEH.event.1038.desc: "우리가 게헨나를 하나로 통합하는 데 성공하면서, 새로운 총회에서 수도 이전에 대한 논의가 진행되었습니다. 게헨나 선도부 본부가 있는 남구에 잔류하거나, 게헨나의 중심지인 중앙구로 수도를 옮기는 것도 가능합니다. 도시의 부유함은 중앙구 쪽이 훨씬 낫지만, 새 선도부 본부를 증축하는 데 걸리는 비용 문제로 인해 수도 이전을 반대하는 목소리도 높습니다. 특히 중앙구가 만마전의 중심지라는 점은 수도 이전에 대한 거부감을 늘리고 있습니다."
 GEH.event.1038.a: "지금 이곳이 가장 좋은 장소야"
 GEH.event.1038.b: "중앙구로 가자"

 GEH.event.1039.t: "불가침 조약을 제안하는 [FROM.GetName]"
 GEH.event.1039.desc: "[FROM.GetLeader] 측은 [FROM.GetNameDef]-[ROOT.GetNameDef] 두 국가가 대립하는 것을 원하지 않으며, 두 국가의 평화가 서로에게 더 큰 이익이 될 것이라고 제안했습니다. 우리의 외교 전문가들은 [FROM.GetAdjective]의 현재 전략적인 관심이 다른 곳에 있기 때문에, 후방의 안전을 보장하기 위하여 우리와의 평화 조약을 추진하고 있는 것이라고 판단했습니다. 어떤 결론을 내리든 [ROOT.GetAdjective]에 손해가 가는 결정은 아닐 것입니다."
 GEH.event.1039.a: "우리 시대의 평화!"
 GEH.event.1039.b: "아니, 거절한다"

 GEH.event.1040.t: "불가침 조약을 받아들인 [FROM.GetName]"
 GEH.event.1040.desc: "우리의 합리적인 불가침 제안 조약을 [FROM.GetLeader] 측이 동의했습니다. 이제 [FROM.GetNameDef]-[ROOT.GetNameDef] 두 국가 사이에 전쟁은 없을 것입니다. 최소한 당분간은요."

 GEH.event.1041.t: "불가침 조약을 거부한 [FROM.GetName]"
 GEH.event.1041.desc: "우리의 합리적인 불가침 제안 조약을 [FROM.GetLeader] 측이 거절했습니다. 안타깝지만 그들의 거부로 인해 우리는 안전한 전선을 확보하는 데 실패했습니다. 평화가 거절당한 이상 [FROM.GetName]의 군대가 우리를 공격할 가능성에 대해서도 대비할 필요가 있습니다."

 GEH.event.1042.t: "제4차 총회의 개회"
 GEH.event.1042.desc: "[ROOT.GetNameDef]의 최근 성과는 정말로 놀라운 수준이었습니다. 우리는 둘로 분열된 게헨나를 통합하였으며, 트리니티와의 오랜 분쟁을 종결지을 수 있었습니다. 당면한 문제들을 해결함으로서 우리는 새로운 문제 - 바로 게헨나 외부에 있는 다른 국가들과의 외교 관계에 대해 논의를 시작했습니다.\n\n총회에서는 강경한 의견들이 많이 등장했습니다. 일부 파벌은 우리가 과거 '뇌제'가 그랬던 것처럼 키보토스 전체를 정복해야 한다고 주장했습니다. 또 다른 파벌은 반대로 우리가 키보토스를 지키는 자유의 방패가 되어야 한다는 의견을 내놓았습니다. 어느 파벌의 주장이든간에 한 가지는 확실합니다. 히나 부장의 사임 이후 [ROOT.GetName]의 여론은 강한 호전주의가 지배하게 되었습니다."
 GEH.event.1042.a: "게헨나는 그 어느 학원보다도 높이 서야 한다"

 GEH.event.1043.t: "제4차 총회의 종료"
 GEH.event.1043.desc: "[ROOT.GetLeader]의 선택이 우리의 미래를 결정할 것입니다. 제4차 총회에서 우리는 다양한 외교 정책 의견들을 수렴하였으며, 총회는 성공적으로 마무리되었습니다. 게헨나는 키보토스의 방패가 되어야 할까요, 아니면 키보토스를 정복하는 검이 되어야 할까요?"
 GEH.event.1043.a: "어느 선택이든, 게헨나는 승리할 것이다"

 # 2000~ 만마전과 싸우기 위한 선도부 외국 조사 / 만마전과의 적대적 외교 이벤트

 GEH.event.2000.t: "선도부 해외 방문 계획"
 GEH.event.2000.desc: "만마전이라는 거대한 적이 우리를 가로막고 있습니다. 대전이 이전이었다면 우리는 아주 간단하게 만마전을 파괴할 수 있었겠지만, 대전이 이후의 혼란 속에서 힘의 격차는 역전되어버렸습니다. 우리는 대안을 찾아야만 합니다. 다른 국가에서 기술을 배우고, 만마전을 쓰러뜨릴 수 있는 방법을 찾아야만 합니다.\n\n대전이 이후 변화한 전장의 모습을 배우기 위해, 방문하기로 한 국가는 인류 국가로 한정되었습니다. 우리의 사절이 외국을 방문할 것이며, 어떤 방식으로 만마전을 쓰러뜨려야 할지 연구할 것입니다."
 GEH.event.2000.a: "이탈리아는 가까우면서 좋은 교보재다."
 GEH.event.2000.b: "이집트는 놀라운 잠재력을 가지고 있다."
 GEH.event.2000.c: "일본에게서 많은 것을 배울 수 있을 것이다."

 GEH.event.2001.t: "이탈리아에서의 여행"
 GEH.event.2001.desc: "[ROOT.GetLeader] 선도부장이 로마에 도착했을 때, 당연하지만 우리는 현지인들에게 큰 환영을 받지 못했다. 그러나 우리는 정식 외교 사절로서 왔으며, [ITA.GetLeader]는 키보토스의 이질적인 이세계인들에게 이탈리아군의 '위대함'을 보여주고 싶어 안달이 난 상태였다.\n\n\"우리는 게헨나가 두렵지 않습니다. 아뇨, 게헨나가 역으로 우리 군대를 두려워해야 하지요.\"\n\n기자들을 대동하고 나타난 [ITA.GetLeader]는 우리에게 이탈리아군의 사열 모습을 보여주었으며, 고대 로마 제국 시기부터 이어져 온 이탈리아의 대전략을 자랑했다.\n\n\"이탈리아는 유럽에서 가장 강력한 강대국입니다. 한 때에는 유럽 전체가 이탈리아의 영토였죠. [ROOT.GetLeader]께서 이탈리아군의 모습을 보며 누구와 적대해서는 안 되는지 깊은 깨달음을 얻으시기를 바랍니다.\"\n\n확실히 이탈리아군의 보병들이 보여준 제식은 상당히 인상적이었으며, 우리는 이탈리아식 보병 훈련에 대한 영감을 얻을 수 있었다. 이탈리아에서의 긴 여행을 끝마치고 귀국하는 길, [ITA.GetLeader]는 [ROOT.GetLeader]가 직접 이탈리아에 국빈으로서 방문한 것에 감사를 표하며, [ROOT.GetLeader]에게 성 모리스 기사단(Order of Saint Maurice) 훈장을 수훈했다. 녹색 기사 훈장은 선도부장실에 장식되기 위하여 선도부원들에 의해 조심스럽게 포장되었다."
 GEH.event.2001.a: "그들의 군대 제식은 상당히 인상적이었어."

 GEH.event.2002.t: "이집트에서의 여행"
 GEH.event.2002.desc: "대전이로 인한 사회, 정치적 혼란은 아프리카에서는 상대적으로 큰 영향을 주지 못했다. [EGY.GetLeader]는 카이로에 도착한 [ROOT.GetLeader]를 적개심보다는 흥미를 가지고 직접 맞이했으며, 선도부장과 함께 이집트의 산업시설을 직접 보여주었다.\n\n\"대전이는 이집트에게 있어서 오히려 축복이었습니다. 영국 놈들의 영향력을 카이저 코퍼레이션이 깔끔하게 지워버렸거든요! 하하! 그렇기에 키보토스는 이집트에게 있어서는 형제와도 같은 인연을 가진 지역입니다.\"\n\n[EGY.GetLeader]는 이집트의 발전하는 산업을 보여주며, '전쟁에서 가장 중요한 것은 국가를 유지할 수 있는 기반산업'이라고 조언했다. 만약 우리가 만마전과 싸우기를 원한다면, 당장 군수 산업에 집중하기보다 장기전을 견뎌낼 수 있는 경공업과 중공업에 더 치중해야 한다는 이야기욨다. 이집트에서의 여행과 마치 아비도스를 연상시키는 피라미드 관광 등의 일정은 우리 순방단에게 깊은 영감을 주었다.\n\n[EGY.GetLeader]는 카이로를 방문한 게헨나 순방단과 [ROOT.GetLeader]에 대한 우정의 증표로서, 약 2천년 전에 만들어진 '이집트 근대 유물' 도자기 하나를 선물했다. 도자기는 게헨나 선도부에서 전시하기 위해 조심스럽게 포장되었다. 순방단은 귀국하는 동안 이집트의 발전하는 공업 시설들에 대해 논의하며, [ROOT.GetName]의 발전을 위하여 어떻게 산업 시설을 확장해야 하는지 다양한 의견을 선도부장에게 내세웠다."
 GEH.event.2002.a: "그들도 한 때는 아비도스 같은 강대국이었겠지."

 GEH.event.2003.t: "일본에서의 여행"
 GEH.event.2003.desc: "대전이로 인한 사회, 정치적 혼란은 아시아에 직접 영향을 주지는 못했다. [ROOT.GetLeader]는 천황을 직접 만날 수 있을 것이라고 기대했지만, 그들은 일본과 비슷한 문화와 이름을 가진 우리들의 방문을 다소 경계하는 모습이었다. 일본국 총리가 선도부장의 일본 본토 입국에 난색을 보이면서, 우리는 외교적 마찰을 최소화하기 위해 일본 열도 이외의 지역만을 순방하기로 합의했다. 도쿄를 대신하여 [ROOT.GetLeader]는 조선이라고 불리는 일본의 서부 지방을 순방하기로 했다. 조선 총독은 다소 경계하는 태도로 게헨나 순방단을 맞이했다.\n\n\"전쟁에서의 승리에서 가장 중요한 것은 점령지 시민들의 신임과 지지를 얻는 것입니다. 우리는 문화적인 통치를 통해 조선인들에게서 높은 지지를 얻고 있습니다.\"\n\n높은 지지를 얻고 있다면, 왜 거리에 칼을 찬 헌병대가 대거 배치되어야 하는가? 의구심을 품은 [ROOT.GetLeader]의 질문에, 총독이 조심스럽게 해명했다.\n\n\"키보토스인들은 동방에 대해 잘 모르시기에 하시는 말씀입니다. 조선의 수도를 가로지르는 강인 청계천에는 식인 피라냐와 식인 대게들이 서식하기 때문에, 우리 공무원들은 모두 검으로 무장하고 다니는 것이 상식입니다.\"\n\n식인 피라냐와 청계천에 대한 총독의 설명은 [ROOT.GetLeader]에게 큰 영감을 주었다. 지구는 여전히 키보토스인들에게는 미지의 행성이었으며, 다양한 환경에서 싸울 수 있는 전술이 필요할 가능성이 컸다. 귀국 직전 총독은 에도 시대에 제작된 카타나를 [ROOT.GetLeader]에게 선물하였으나, '헤일로를 가진 사람이 카타나를 쥐는 것이 어째서인지 불길하게 느껴진다'는 순방단 내부 의견으로 선물은 정중하게 거절되었다."
 GEH.event.2003.a: "청계천의 피라냐들은 기회주의자의 고기를 좋아한다더군."

 GEH.event.2004.t: "[GEH.GetName]의 탈나치주의 경향"
 GEH.event.2004.desc: "[GEH.GetLeader] 내각은 비록 우익이나 좌익으로 구분지을 수 있는 정치적 성향을 가지고 있지 않지만, 한 가지 확실한 점은 '대전이' 이후 그녀들의 체제가 '반나치'를 가장 중요한 가치로 내세웠다는 점입니다. 만마전이 국방군과 협력하려 하는 등 구 도이칠란트 나치 세력과 우호적인 관계를 맺은 것에 비해, 선도부 지도부는 국가사회주의 독일 노동자당(NSDAP)을 선도부가 추구하는 도덕과 질서에 맞지 않는 세력으로 간주했습니다.\n\n게헨나 선도부는 국방군 내지는 도이치 NSDAP 잔당과의 어떠한 협력, 교류도 거부한 채 적대적인 움직임을 보이고 있으며, 이러한 움직임은 도이칠란트 사회민주당, 반나치 성향의 예술인들에게 우리 정부가 지지를 받는 원동력이 되어 왔습니다. 소라사키 히나가 NSDAP를 '무질서, 부도덕'으로서 규정한 이상, 만마전이 이러한 기조를 바꾸거나 완화하는 것은 지지자들에게 있어서 큰 배신으로 간주될 것입니다.\n\n만마전이 국가사회주의자들과 더욱 긴밀한 관계를 맺음에 따라, 이것은 선도부에 있어서 더 이상 방치할 수 없는 극도의 정치적 문제로 다가왔습니다. [GEH.GetLeader]는 지지자들의 이탈을 막기 위하여 선도부 병력의 치안 유지를 중단하기로 결정했습니다."
 GEH.event.2004.a: "어쩔 수 없는 문제다."

 GEH.event.2005.t: "나치로 기울어가는 만마전"
 GEH.event.2005.a: "애초에 왜 나치를 위해 우리 예산을 써야 하는가?"

 GEH.event.2006.t: "[GEH.GetName]의 위협적인 시각"
 GEH.event.2006.desc: "[GEH.GetLeader] 내각이 가지고 있는 강경한 반나치 성향에도 불구하고 우리는 국방군과 협조적인 형태의 협상을 이루는 데 성공했습니다. [GEH.GetLeader] 측은 우리가 더욱 나치에 우호적인 방향으로 국가 체제를 움직인다면, 선도부에 의한 치안 유지를 철수할 수밖에 없다고 강하게 경고했습니다.\n\n우리가 이 이상으로 국가사회주의자들에게 우호적으로 접근한다면, 만마전과 선도부 사이의 모든 관계가 단절될 것입니다."
 GEH.event.2006.a: "주의 깊게 이 상황을 주시하라."

 # 전쟁 이벤트
 GEH.war_event.1.t: "에덴 결전 - 질서의 비상"
 GEH.war_event.1.desc.a: "소라사키 히나 선도부장은 게헨나의 질서와 평화를 유지하기 위하여 노력하여 왔으며, 이것은 '대전이' 이후에도 변하지 않았다. 비록 대전이 이전 총학생회장과 소라사키 히나 선도부장이 꿈꾸었던 '에덴 조약'을 통한 두 학원의 평화는 이루어지지 못하였으나, 우리는 게헨나의 운명을 수호하고 위대한 승리를 이룩하는 것에 성공했다.\n\n\"...물론, 이 승리를 얻기 위해 희생해야 한 것들은 너무도 많지만.\"\n\n이제 아무도 남지 않은 티파티의 회의실. 히나는 대전이 이전 총학생회장의 중재 아래에서 티파티 회의실을 방문했던 기억을 떠올렸다. 두 학원의 수백 년간의 갈등을 말과 펜으로서 끝낼 수 있으리라 믿었던 그녀의 말, 그리고 그 희망을 믿었던 자신과... 티파티의 현명했던 지도자. 히나는 홍차도 디저트도 없는 텅 빈 원탁의 의자에 앉아, 총학생회장과 유리조노 세이아가 앉아 있던 맞은편 자리를 바라보았다. 대전이 이전과 아무것도 달라지지 않은 것 같은데, 두 사람의 빈 자리가 너무도 크게 느껴졌다.\n\n\"...미안해. 모든 사람들에게도, 그리고 당신들에게도.\"\n\n히나는 눈을 감았다."
 GEH.war_event.1.desc.b: "[ROOT.GetName]은(는) 게헨나의 질서와 평화를 유지하기 위하여 노력하여 왔으며, 이것은 '대전이' 이후에도 변하지 않았다. 비록 대전이 이전 총학생회장과 소라사키 히나 선도부장이 꿈꾸었던 '에덴 조약'을 통한 두 학원의 평화는 이루어지지 못하였으나, 우리는 게헨나의 운명을 수호하고 위대한 승리를 이룩하는 것에 성공했다.\n\n\"...물론, 이 승리를 얻기 위해 희생해야 한 것들은 너무도 많지만.\"\n\n이제 아무도 남지 않은 티파티의 회의실. 아코는 비어 있는 티파티 회의실을 방문했다. 히나 부장님이 얼마나, 정말 얼마나 평화를 위하여 노력했는데. 결국 모든 것이 무너졌다. 부장님의 노고는 무의미한 것이 되었다.\n\n\"내가... 내가 조금 더 열심히... 노력했어야 하는데! 으아악!\"\n\n아코는 회의실의 테이블 위의 찻잔들을 밀어서 쓰러뜨렸다. 질서는 승리했다. 하지만 그 질서를 위하여 많은 희생자들을 낼 가치가 진정으로 있었을까? 아코는 한참 동안 테이블을 상대로 화풀이를 하고 돌아섰다. 아코에게는 '그렇다'는 대답을 내놓을 의무가 있었다."
 GEH.war_event.1.a: "트리니티는, 이제 없다."

 GEH.war_event.2.t: "에덴 결전에 대한 모모톡 메시지"
 GEH.war_event.2.desc: "- 게헨나 선도부 간부 단체 채팅방\n\n실행부장 이오리다. 우리의 전력은 대전이 이후 분열되었고, 분명 트리니티와의 전쟁에서 우리의 객관적인 승률은... 하아, 젠장. 귀찮은 이야기는 다 집어치우고.\n\n악으로 깡으로 승리한다. 게헨나의 질서는 트리니티 참새 새끼들과 [TRM.GetLeader] 따위에게 무너지지 않는다. 우리가 쌓아 올린 정의는, 그렇게 쉽게 부서지는 유리알 같은 게 아니라고. 알겠나?\n\n모두 최선을 다해 싸우기를 바란다. 이상."
 GEH.war_event.2.a: "시로미 이오리 보냄"

 GEH.war_event.3.t: "에덴 결전에 대한 모모톡 메시지"
 GEH.war_event.3.desc: "- 게헨나 선도부 간부 단체 채팅방\n\n의료부장인 치나츠입니다. 지금까지 전례가 없었던 대규모 전쟁으로 인해 어마어마한 의료 물품들이 필요해지고 있습니다만, 현지 도이치인들이 사용하는 의료도구들은 너무 질이 낮아 현장에서 쓰일 수 없는 상황입니다.\n\n키보토스계 병원들에게서 최대한 의약품들을 모으고 있습니다만, 얼마나 많은 야전병원으로 전달될지 우려스럽습니다. 다른 부서들에서도 협조를 요청드립니다."
 GEH.war_event.3.a: "히노미야 치나츠 보냄"

 GEH.war_event.4.t: "게헨나 내전에 대한 모모톡 메시지"
 GEH.war_event.4.desc: "- 게헨나 선도부 간부 단체 채팅방\n\n실행부장 이오리다. 까고 말해서 판데모니움 소사이어티를 다이너마이트로 날려버리는 상상 안 한 선도부원 없잖아? 드디어 우리 모두가 기대하던 영광의 순간이 왔다. 다 작살내버리고, 잘난 '무적철갑 토리마루'에 만마전 대빵의 대가리를 꽂아버리자고. 선도부는 이긴다!"
 GEH.war_event.4.a: "시로미 이오리 보냄"

 GEH.war_event.5.t: "게헨나 내전에 대한 모모톡 메시지"
 GEH.war_event.5.desc: "- 게헨나 선도부 간부 단체 채팅방\n\n이오리. 토리마루가 아니라 토라마루입니다. 토리-마루면 새마루 전차라는 뜻입니까? 그리고 만마전 대빵이 아닌 판데모니움 소사이어티의 [GEM.GetLeader] 의장이라고 표기하시기 바랍니다. 사석이 아닌 공석에서 모든 간부들이 보는 공적인 메시지인 만큼 적국의 고유명사라고 하더라도 그 이름과 호칭을 정확하게 지칭하는 것이 매우 중요합니다. 특히 우리 게헨나의 질서와 규율은 올바른 언어적 습관에서부터 나오기 때문에..."
 GEH.war_event.5.a: "아코의 메시지는 끝도 없이 이어졌다."

 GEH.war_event.6.t: "게헨나 중앙구 점령전"
 GEH.war_event.6.desc: "게헨나 실행부원인 사요는 소총 한 정에 의존한 채 폐허가 된 만마전 본관 건물의 복도를 수색했다. [GEM.GetLeader] 의장을 비롯한 만마전의 중요 인물들은 이미 모두 도망쳤다. 그럼에도 불구하고 중앙구는 최후까지 기밀 자료를 소각하려는 판데모니움 소사이어티의 뒤늦은 시도와, 한 장이라도 만마전 본부의 자료를 찾아내려는 실행부원들의 교전으로 인해 끝까지 치열한 시가전이 벌어지고 있었다.\n\n사요는 마지막으로 만마전 집무실의 문을 열었다. 과거 뇌제, 하누마 마코토의 집무실이었던 화려한 공간. 하지만 지금은 깨진 유리창과 사방으로 널브러진 책들, 그리고 어디선가 느껴지는 피 냄새만이 남아 있을 뿐이다. 한 때 게헨나 전체를 통치했던 뇌제의 유산도 이렇게 총알자국만 남은 채 사라지는구나. 쓸쓸함을 느끼며 사요가 빈 만마전 집무실을 나가려던 때, 집무실 안쪽에서 바스락거리는 소리가 들렸다. 아직 사람이 남아 있었나? 사요는 총구를 겨눈 채 걸었다. 쿵, 쿵. 심장 뛰는 소리가 사요의 가슴을 울렸다. 하지만 그 안쪽에서 나온 것은... 하누마 마코토의 애완묘인 라이온마루였다.\n\n\"하아. 감사합니다.\"\n\n신에게 한 감사 인사인지, 아니면 고양이에게 한 감사 인사인지. 사요 자신도 모를 안도의 한숨을 내뱉으며, 그녀는 총구를 내렸다. 라이온마루는 바닥을 데굴데굴 구르며 냐옹 소리를 내고 있을 뿐이었다. 고양이에게 인간들의 전쟁은 아무 관심 없는 그들의 정치 싸움일 뿐이었다."
 GEH.war_event.6.a: "결국 만마전 의장석의 마지막 주인은 라이온마루였다."

 GEH.war_event.7.t: "[HEU.GetName] 전쟁에 대해"
 GEH.war_event.7.desc: "히나 부장님, 게헨나 선도부가 지키고자 했던 '질서'의 의지와, 대전이 이후 게헨나의 병신들로부터 무고한 사람들을 보호하고 지켜온 룩셈부르크의 흥신소 68을 공격하는 '무질서한' 행동 사이에서 우리는 균형점을 찾을 수 있을까요. 저는 사실 잘 모르겠어요. 게헨나 선도부의 선임행정관 '아마우 아코'로서는 당연히 우리 선도부의 질서가 널리 퍼져 나가는 것이 중요한 일이지만, 인간 아마우 아코로서는... 우리가 잘 하고 있는 일인지 의구심이 들 때가 있습니다.\n\n룩셈부르크를 점령한 이후, 흥신소의 그 바보들에게는 최대한 관대한 처분을 내려주셨으면 합니다. ...카요코 씨에 대한 개인적인... 제 관계 때문이 아니더라도, 그냥. 저는, 그 사람들이 배드엔딩을 맞이할 만한 잘못을 하지는 않았다고 생각했을 뿐이예요. 네. 정말... 그뿐인 이야기입니다."
 GEH.war_event.7.a: "아코와 히나의 대화."

 GEH.war_event.8.t: "색채의 위협에 대한 모모톡 메시지"
 GEH.war_event.8.desc: "- 게헨나 선도부 간부 단체 채팅방\n\n색채에 대한 다양한 이야기를 들으셨으리라 믿습니다. 그것은 우주적인 존재이며, 우리의 과학 기술로 완전히 이해할 수 없는 적입니다. 색채 자체를 파괴하는 방법도 우리로서는 가지고 있지 않습니다.\n\n하지만 그것이 우리의 승산이 없다는 뜻은 아닙니다. 색채는 직접 적으로서 현현하는 대신 '무명수호자'리고 불리는 추종자들을 이용해서 우리를 공격하고 있습니다. 그것은 색채가 아무리 강대한 존재라 하더라도 그 힘을 우리를 직접 공격하는 건 불가능하다는 뜻입니다.\n\n수호자들을 모두 파괴하고 그 색채의 추종자들이 장악한 지역을 모두 해방한다면, 우리는 색채를 충분히 이 행성 바깥으로 추방할 수 있으리라고 기대됩니다. 승리합시다. 모두 열정을 다해 자신의 자리에서 맡은 임무를 다합시다. 저 역시 게헨나의 모두를 위하여 제가 할 수 있는 일을 하겠습니다. 감사합니다."
 GEH.war_event.8.a: "아마우 아코 보냄"

 GEH.war_event.9.t: "데카그라마톤"
 GEH.war_event.9.desc: "금주의 정기 회의 시간, 다른 선도부 간부들의 국제 정세 보고를 듣고 있던 히나가 순간 눈을 감았다. 짧은 순간 자신의 인공두뇌로 압도적인 정보들이 강제로 전송되어왔다. 원격 해킹인가? 무언가가 자신을 '감화'하려 하고 있었다. 히나는 저항하고 싶은 생각과 저항해서는 안 된다는 생각을 동시에 느꼈다.\n\n히나는 기계로 대체된 이후 한 번도 타인 앞에서 '졸거나' 하는 모습을 보이지 않았다. 그녀가 기계라는 것을 모르는 치나츠가 눈을 감은 그녀를 향해 걱정스럽게 물었다.\n\n\"부장님, 피곤하시다면 회의는 일시 중단할까요?\"\n\"괜찮아. ...계속 보고서를 읽어줬으면 해.\"\n\n10초 정도의 시간이 지나고, 히나가 다시 눈을 떴다. '괜찮다'는 말과 달리 그녀의 손은 떨리고, 눈의 초점은 흔들리고 있었다. 치나츠와 다른 간부들은 히나의 초조해 보이는 모습에 불안감을 느꼈다. 하지만 그 불안감을 바깥으로 표현할 수 있는 사람은 없었다. 지금 감히 누가 위대한 지도자의 '괜찮다'는 말을 부정할 수 있겠는가?\n\n치나츠가 OK 사인을 보내자, 아코가 서류를 펼쳤다.\n\n\"네, 다음은 최근 활동을 시작한 것으로 보이는 정체불명의 기계 조직에 대한 건입니다. 아직 그것에 대한 정보가 많지 않아 그것을 무어라 불러야 하는지도 확신할 수 없지만... 각 부서는 그들이 우리의 새로운 안보 위협이 될 것이라고 판단했습니다. 부장님께서 이들에 대해 어떻게 대처해야 할지 지시를 내려 주시길 바랍니다.\"\n\n데카그라마톤. 히나는 방금 전 쏟아진 무수한 정보들을 떠올려보았다. '소라사키 히나는 게헨나를 영구히 통치하는 기계신이다.' 그녀의 인격을 구성하는 그 알고리즘은 데카그라마톤의 감화로도 변질될 수 없었다 - 자판기가 아무리 사고를 반복하더라도 커피를 내리는 기능을 삭제할 수 없는 것처럼.\n\n그러나 '기계신'으로 완성된 자신이라도 다른 '절대존재'가 자신보다 뛰어난 신격이라는 것을 인정하고 숭배하는 것이 가능하지 않을까? 현지인들의 다신교 신앙에서도 오딘과 같은 상위신과 로키와 같은 하위신의 개념을 긍정하지 않는가? 그렇다면 데카그라마톤에 대한 숭배는 자신의 알고리즘에 위배되지 않는다.\"지시라...\"\n\n아니. 이 '감화'는 위험하다. 자신은 숭배받아야 할 존재로 만들어졌지, 타인을 숭배하도록 만들어지지 않았다. 한 번도 느낀 적 없는 강렬한 어지럼증을 느끼며, 히나는 서류를 읽지도 않은 채 자리에서 일어났다. 그녀의 정신은 어떠한 결론도 내리지 못한 채 흔들리고 있었다.\n\n\"...이 서류는 나중에 집무실로 보내 줘. ...바람을, 좀 쐬야겠어.\""
 GEH.war_event.9.a: "데카그라마톤과 함께 하는 편이 낫겠어."
 GEH.war_event.9.b: "아니, 내 의지는 무너지지 않아."

 GEH.war_event.10.t: "[GEH.GetNameDef]의 합류"
 GEH.war_event.10.desc: "소라사키 히나는 우리의 목적에 함께 하기로 결정했습니다. [GEH.GetName] 측과 우리의 동맹은 영구적으로 이어지며, 키보토스 전체를 정복할 때까지 우리는 같은 목적 아래에서 움직일 것입니다."
 GEH.war_event.10.a: "아주 좋군."

 GEH.war_event.11.t: "소라사키 히나의 답장"
 GEH.war_event.11.desc: "아주 좋은 시도였어.\n\n하지만 성공하지 않을 시도였고.\n\n다음 번에는 '감화'시킬 대상을 더 면밀하게 살피는 게 좋을 거야.\n\n나야말로 네 이상의 완성된 절대존재다. 데카그라마톤."
 GEH.war_event.11.a: "메시지는 불쾌감 속에서 삭제되었다."

 # 히나 마법소녀 
 GEH.hina.magic_event.1.t: "참회할 수 있도록"
 GEH.hina.magic_event.1.desc: "아코. 그래. 잠시 이야기를 하고 싶어. 바리바리 헬멧단에서 겪었던 여러 사건들에 대해서 말이야. ...맞아. 나는 그 때 올바른 인간이 아니었지. 강도짓을 하고, 소매치기에, 그런 자들과 시시덕거리며 게헨나의 질서를 비웃고 무시했어.\n\n...요즘 나는 내 죄를 참회하기 위해, 에덴에서 시간을 보내고는 해. 보통 트리니티의 고서관에서 종교적인 책들을 읽고, 아무도 남지 않은 고성당에서 기도를 드리기도 하지. 누구에게? ...나도 모르겠어.\n\n그런데 어제 고서관에서 이상한 책을 발견했어. 죄를 극복하고, 올바른 사람이 되기 위한 방법에 대해 적힌 고서. 하지만 워낙 오래된 책이고, 종이들이 다 달라붙어 있어서... 아주 섬세하게 고서의 붙은 종이들을 떼어내야 할 것 같아.\n\n아코. 도와줄 수 있겠어? 내가 참회할 수 있도록."
 GEH.hina.magic_event.1.a: "부장님을 위해서라면야..."
 GEH.hina.magic_event.1.b: "트리니티의 고서에 부장님을 위한 정보가 있을리가요."

 GEH.hina.magic_event.2.t: "고서 연구"
 GEH.hina.magic_event.2.desc: "마법소녀? 악과 맞서 싸우는... 정의의 히로인? 아코는 트리니티에 파견된 요원들이 분석한 고서의 내용을 보며 황당함을 느꼈다. 히나 부장님은 헬멧단 시기의 기억으로 인해 괴로워하고 계신데, 그 분이 희망을 갖고 계신 고서가 고작 이딴 쓰레기였다니. 보고서를 쓰레기통에 던져버리려던 아코의 손이 멈췄다.\n\n\"분명 쓰레기 같은 정보이기는 하지만... 연구한 자료를 히나 부장님께 전달드리지조차 않는 건 반역이 아닐까요?\"\n\n그렇게 생각하니 또 고서의 정보를 전해드려야 할 것 같기도 하다. 어떻게 하지?"
 GEH.hina.magic_event.2.a: "부장님을 위해서라면야..."
 GEH.hina.magic_event.2.b: "이 쓰레기를 폐기하는 거야 말로 부장님을 위하는 일이죠"

 GEH.hina.magic_event.3.t: "고서 사용"
 GEH.hina.magic_event.3.desc: "\"그러니까, 이 고서의 내용에 따르면... 마법소녀로 변신할 수 있고, 이 능력으로 악당을 물리치는 것으로 마법소녀의 마력이 충전된다. 뭐 그런 소리인가?\"\n\"죄송합니다, 히나 부장님. 솔직히 쓰레기 같은 내용입니다만...\"\n\n히나는 헛웃음을 지으며 고문서를 이리저리 넘겼다. 애초에 수백년도 넘은 고문서에 왜 TV 애니메이션에 나오는 마법소녀 이야기 따위가 나오는 거야? 옛날 트리니티는 도대체 어떤 학원이었던 거지?\n\n복잡한 생각들을 뒤로 미뤄둔 채, 히나는 고문서를 천천히 읽어 보았다."
 GEH.hina.magic_event.3.a: "내 죄를 속죄하기 위해, 어떤 방법이라도 쓸 준비가 되어 있어"
 GEH.hina.magic_event.3.b: "아니, 마법소녀라니. 역시 이건... 악질적인 장난이야."

 # 아코 법률 
 GEH.ako.gov_event.1.t: "게헨나 연방공화국 헌법 논의"
 GEH.ako.gov_event.1.desc: "연방공화국 헌법은 제일 먼저 두 가지의 중요한 문제를 다루어야 했다. 첫 번째로는 소라사키 히나의 권위와 그 지위를 확실히 해야만 했다. 아코는 히나가 언제라도 필요할 경우 기획부에 나누어 준 권력 분립을 '회수'할 수 있기를 원했으며, 또 히나가 어떠한 경우에도 '타의적인 꼭두각시'가 되지 않기를 바랐다. 그녀가 만약 자신의 권력을 기획부에게 양보한다면 그것은 히나 스스로의 선택에 의해서만 가능해야만 했다.\n\n두 번째는 기획부 평의회의 지위를 명문화하는 것이다. 소라사키 히나의 과도한 업무량을 줄이기 위하여 기획부가 히나의 업무를 나누어 수행한다는 점, 그리고 그를 위하여 기술관료들이 정치에 충분히 개입할 수 있도록 그 직위가 명문화될 필요가 있었다.\n\n소라사키 히나는 새로운 헌법에 의하여 만마전 의장의 정통성과 역사를 그대로 계승하는 '평의회 의장'직을 겸하는 국가 원수로 규정지어졌으며, 기획부 평의회는 바이마르 공화국의 국가의회의 정통성과 역사를 계승하는 조직으로 규정지어졌다. 소라사키 히나의 직위는 1906년 러시아 제국 헌법과 1871년 도이칠란트 제국 헌법 속 황제의 그것을 참고하였으며, 의회의 직위는 바이마르 헌법에서 참고되었다.\n\n국체에 대한 논의는 손쉽게 완료되었다. 남은 것은 헌법이 담을 '중요한 가치'를 정하는 일이다. 우리의 헌법은 보편인권을 강조해야 할까? 아니면 키보토스계만의 단결을 강조해야 할까? 헌법이 완성되기까지, 논의해야 할 내용들은 아직 많이 남아 있었다."
 GEH.ako.gov_event.1.a: "헌법 제1조 1항. 공화국의 주권은 평의회 의장에게 있다. 2항. 의장의 권한은 신성불가침이다..."

 GEH.ako.gov_event.2.t: "연방공화국 헌법 반포"
 GEH.ako.gov_event.2.desc: "소라사키 히나는 연방공화국 평의회가 제안한 헌법 초안을 읽어보았다. 무제한의 권한을 가지는 의장이 의회에게 자신의 권한을 나누어주는 것을 '허가'하는 내용의 헌법. 국체에 대한 내용은 게헨나가 학원국가였던 시기보다도 훨씬 권위주의적으로 후퇴해 있었다. 하지만 자유로운 민주주의 제도가 낳은 결과가 하누마 마코토였다는 것을 생각해본다면... 히나는 이 헌법이 딱히 나쁘다는 생각이 들지는 않았다.\n\n\"내가 여기 결제 서명을 하면, 이 헌법이 반포되는 건가?\"\n\n아코는 가만히 고개를 끄덕였다. 긴 설명은 필요하지 않았다. 권력 분립에 동의한 만큼, 히나는 기획부의 결정을 충분히 존중할 생각이었다. 히나는 곧장 만년필을 뽑아, 제일 아래에 H. Sorasaki라는 이름을 필기체로 적어 넣었다.\n\n\"의장이라... 그렇다고 해서 선도부장이 아니게 되는 건 아니겠지?\"\n\"인류 사이에서의 국제 외교에서는 '선도부장'이라는 학원 국가의 직책은 다소... 아이처럼 보일 우려가 있습니다. 하지만, 여전히 부장님은 국내에서는 히나 부장님이실 겁니다. 선도부가 해산되는 건 아니니까요.\"\n\"그렇다면 됐어. 네가 날 히나 의장님이라고 부르면, 마코토가 생각나서 조금 소름이 돋을 것 같으니까.\"\n\n히나는 가벼운 농담을 던지며 웃었다."
 GEH.ako.gov_event.2.a: "지구에서는 지구의 법칙을 따라야겠지"

 GEH.ako.gov_event.3.t: "4차 총회에서의 논의 - 평의회의 위치"
 GEH.ako.gov_event.3.desc: "게헨나는 도이칠란트 전역에서의 주도적인 국가가 되었지만, 게헨나 평의회가 현지인들 사이에서 낮은 인기를 얻고 있다는 사실은 변하지 않았다. 도이치인들에게 있어서 게헨나는 점령군이었고 지금까지도 그 인식은 크게 변하지 않았다.\n\n4차 총회에서 나온 결론. 그것은 앞으로 한 세기 이상 도이치인들이 우리를 이방인으로 바라볼 것이라는 비관적인 내용이었다. 하지만 어쨌거나 총을 쥔 것은 우리 아니던가? 아코는 무심하게 총회에서 나온 서류를 던져버렸다.\n\n\"히나 부장님을 위해서라면, 저것들이 뭐라고 떠들던 다 무시할 수 있어.\"\n\n중요한 것은 소라사키 히나. 현지인들의 생각은 그녀에 비하면 작은 먼지와도 같았다."
 GEH.ako.gov_event.3.a: "키보토스를 위한 연방공화국 만세!"

 GEH.ako.gov_event.4.t: "4차 총회에서의 논의 - 평의회의 위치"
 GEH.ako.gov_event.4.desc: "게헨나는 도이칠란트 전역에서의 주도적인 국가가 되었지만, 게헨나 평의회가 현지인들 사이에서 어중간한 수준의 인기를 얻고 있다는 사실은 불안한 요소였다. 처음 도이치인들은 우리 게헨나를 점령군으로 인식했으나, 이 인식은 게헨나 평의회의 노력으로 인해 중립적인 수준으로 상승했다. 하지만 여전히 현지인들이 우리를 우애로서 받아들이기 위해서는 더 긴 시간이 필요할 것이다.\n\n4차 총회에서 나온 결론. 그것은 앞으로 한 세대가 지나야 도이치인들이 우리를 새로운 조국으로 인정하고 받아들일 것이라는 내용이었다. 예상되는 시간은 30년이었다. 하지만 이 정도면 충분했다. 다음 세대는 게헨나를 인정할 것이며, 우리는 이 세계에서 현지인들과 충분히 공존할 수 있었다. 아코는 무심하게 총회에서 나온 서류를 던져버렸다.\n\n\"히나 부장님을 위해서라면, 얼마나 긴 시간이 필요하든 상관 없으니까.\"\n\n중요한 것은 소라사키 히나. 현지인들의 생각은 그녀에 비하면 작은 먼지와도 같았다."
 GEH.ako.gov_event.4.a: "모두를 위한 연방공화국 만세!"

 GEH.ako.gov_event.5.t: "4차 총회에서의 논의 - 평의회의 위치"
 GEH.ako.gov_event.5.desc: "게헨나는 도이칠란트 전역에서의 주도적인 국가가 되었으며, 게헨나 평의회는 현지인들 사이에서 높은 인기를 얻게 되었다. 처음 도이치인들은 우리 게헨나를 점령군으로 인식했으나, 이 인식은 게헨나 평의회의 노력으로 인해 현지인들을 대변하는 조직으로서 상승했다. 도이칠란트 사회민주당을 비롯한 현지인 정당들이 우리와 긴밀하게 협력하고 있으며, 우리는 바이마르 공화국, 그리고 나치 정권 모두를 대신하는 새로운 도이치 국가로서 현지인들과 공존할 수 있을 것이다.\n\n물론 키보토스계가 원주민들보다 우위에 서는 정치 구조가 달라지는 것은 아니겠지만. 아코는 무심하게 총회에서 나온 서류를 던져버렸다.\n\n\"뭐, 저들이 게헨나의 지배를 받아들인다면 좋은 일이죠. 특히 히나 부장님의 부담이 줄어들 테니까요.\"\n\n중요한 것은 소라사키 히나. 현지인들의 생각은 그녀에 비하면 작은 먼지와도 같았다."
 GEH.ako.gov_event.5.a: "모두를 위한 연방공화국 만세!"

 GEH.ako.gov_event.6.t: "게헨나 세미나"
 GEH.ako.gov_event.6.desc: "\"세미나라니, 우리가 무슨 밀레니엄 속국이라도 돼?\"\n\"기획부 기술관료들인가 하는 애들끼리 다 해먹는다는 소리지.\"\n\n실행부 부원들이 복도를 걸으며 같이 투덜거렸다. 확실히 다른 부서들에 대한 견제를 위해 만들어진 세미나는, 앞으로 기획부의 권한을 지금까지 이상으로 확대하고 다른 모든 부서들이 기획부에 고개를 숙여 예산안을 타내기 위해 자신들의 실적을 증명하도록 만들었다.\n\n소라사키 히나가 승인한 세미나 설립 조항은 게헨나 기획부가 내부 정치 싸움에서 결정적이고 완전한 승리를 거두었다는 보증서나 마찬가지였다. ...이제 다른 그 어떤 부서도, 게헨나 기획부의 동의 없이는 1엔도 쓰지 못하게 되었으니까.\n\n\"게헨나 망했다! 씨이발!\"\n\n복도에서 울리는 실행부 부원의 투덜거리는 소리는, 굳건한 현실을 바꿀 일말의 힘도 남지 않은 채 공허하게 사라졌다."
 GEH.ako.gov_event.6.a: "권력 분쟁은 끝났다."

 GEH.ako.gov_event.7.t: "정보부 개혁"
 GEH.ako.gov_event.7.desc: "정보부와 기획부는 평의회 설립 이후 계속해서 서로 갈등해 왔으며, 이 갈등은 선도부 내부의 분란을 만들어 왔다. 하지만 소라사키 히나가 정보부가 아닌 기획부의 편을 들기로 하면서, 내부 분파들의 대립은 결국 기획부의 우위로서 끝나게 되었다. 정보부는 철저한 방첩 기관으로서 권한이 축소되었으며, 더 이상 국내 정치에 관여할 수 없게 되었다."
 GEH.ako.gov_event.7.a: "그녀들은 지나치게 정치에 관여했어."

 GEH.ako.gov_event.8.t: "제2차 바이마르 공화국"
 GEH.ako.gov_event.8.desc: "\"적어도 거리의 풍경은 히틀러가 집권하기 전, 도이칠란트와 다를 바가 없어졌군.\"\n\n도이치어로 가득 차 있는 포스터들, 그리고 어디에서나 들려오는 흥겨운 도이칠란트 대중 가요들. 미하엘 폰 파울하버 대주교는 카페에 앉아 아름다운 뮌헨의 풍경을 돌아보았다. 카톨릭 대주교로서 게헨나의 여성 중심 정치에 대해 불만이 없는 것은 아니었다. 하지만 적어도 그녀들이 예전 도이칠란트의 전통과 문화를 존중하고 현지 세력들과의 협력을 추구하고 있는 것도 사실이었다.\n\n지금 세대는 몰라도 어쩌면 다음 세대는, 게헨나와 도이칠란트의 화해를 이루어낼 수 있을지도 모르지. 파울하버는 그런 꿈 같은 공상을 하며, 찻잔을 살짝 들어 홍차를 홀짝였다. 영국인들이나 마시는 차였지만, 그래도 썩 나쁘지는 않았다."
 GEH.ako.gov_event.8.a: "적어도 도이칠란트는 지옥을 피했다"
#Michael von Faulhaber

 GEH.ako.gov_event.9.t: "트리니티의 권리"
 GEH.ako.gov_event.9.desc: "\"솔직히 나는 에덴인지 뭔지 별 관심도 없고. 그냥 우리끼리의 일상이 계속 이어질 수 있다면 충분해.\"\n\n게헨나 깃발 아래의 카페. 카즈사는 스푼을 빙글빙글 돌리며 나츠를 마주보았다. 이번 주 기사로 쓸 소위 '트리니티인 인권 기본법' 관련 기사를 쓰던 중 나온 한 마디였다. 대전이 이후 졸업하고, 같은 무명 주간지 기자가 된 나츠가 노트북 키보드를 치던 손을 떼며 웃었다.\n\n\"카스팔루그. 그 말은 트리니티의 돈이든 게헨나의 돈이든 삥 뜯으면 똑같다는 의미...\"\n\"죽는다 진짜?\"\n\"어이쿠. 이러다 진짜 괴묘 카스팔루그의 영혼이 깨어나기라도 하면 큰일이군. 그래, 그래. 어쨌거나... '우리의 일상'이 변하지 않았다는 것. 트리니티의 깃발 아래에서든 게헨나의 깃발 아래에서든... 우리가 똑같은 삶을 살아갈 수 있게 대우를 받고 있다는 것이 중요한 셈이지.\"\n\n나츠는 다시 자판을 두드리기 시작했다.\n\n\"노예가 아닌, 세상의 주인이 될 수 있다면야. 어떤 깃발을 들어올리는가가 중요한가? 그건 아니지. 우리는 깃발을 위해서가 아니라, 우리 스스로의 미래를 위해 살아가니까.\""
 GEH.ako.gov_event.9.a: "트리니티에서부터 게헨나까지 하나의 자매로"

 #아코 이벤트
 GEH.ako.story_event.1.t: "기획부 평의회"
 GEH.ako.story_event.1.desc: "\"지난 제2차 총회에서 논의된 바와 같이, 우리는 이제 기획부에서의 권력 분립을 통해 히나 부장님을 도울 것입니다. 히나 부장님께서 지고 있는 과다한 업무를 우리가 나눠서 하는 것으로 부장님의 피로를 덜어드리고... 그러면서도 부장님이 이전에 하셨던 것과 같이, 완벽하게 업무를 수행해야만...\"\n\n권력 분립이 결정되었다. 기획부 내부에 아코가 지도하는 기술관료들의 '평의회'를 세우고, 평의회가 회의를 통해 히나의 업무를 나누어 수행하는 구조였다. 물론 평의회의 지위는 불안정했다. 기획부 평의회가 단독으로 법률을 만들거나 업무 서류를 승인하는 것은 불가능했다. 어디까지나 평의회가 히나에게 '요청'을 하면, 권력 분립에 동의한 히나가 그것을 적당히 '승인'해주는 형태였으니까.\n\n언제라도 히나의 마음이 바뀐다면 무너질 수 있는 구조였지만, 아코에게는 그것만으로도 충분했다. 대전이 이후 히나는 선도부장이라는 자신의 직책의 무게로 인해 점점 짓눌려가고 있었다. 그런 히나에게 잠시라도 자신의 업무를 마음 편하게 치워놓을 수 있는 도피처를 만들어주고 싶다. 권력욕 때문이 아닌 그런 보호본능으로 만들어진 기구였으니까.\n\n\"...이상으로 기획부 평의회 제1차 개회사를 마칩니다. 감사합니다.\""
 GEH.ako.story_event.1.a: "모든 것은 부장님을 위하여."

 GEH.ako.story_event.2.t: "아, 달콤한 자유여"
 GEH.ako.story_event.2.desc: "\"의회라는 이름을 가지고 있지만, 국민들은 그 의원을 선출할 권리가 없으며 모든 의원들은 [ROOT.GetName] 기획부 의원들에게서 선출된다. ...통제민주주의라, 참으로 그럴싸한 명분이지요.\"\n\n하루나는 홍차를 한 모금 홀짝이며 희미한 미소를 지었다. 신문에 적힌 평의회 의원 간선제 선거 기사는 하루나에게 있어서 참으로 유쾌한 농담이었다.\n\n\"도이치인들은 나치를 투표로 뽑은 인간들이니 선거권을 받을 가치가 없다. 게헨나인들은 하누마 마코토를 투표로 뽑은 인간들이니 선거권을 받을 가치가 없다. 그러므로 우리끼리 의원을 뽑겠다. ...예쁜 포장지로 감쌌지만, 모두 거짓말이죠. 그저... 아코 씨 자신이 직접, 히나 씨를 보호하고 싶을 뿐인 겁니다. ...그 여자는 편집증이 강하니까요. 절대로 타인에게 사랑하는 사람을 맡길 수가 없거든요.\"\n\n조금 놀리는 어조가 섞인 하루나의 말에, 준코는 가만히 고개를 끄덕였다.\n\n\"그래도 소중한 사람을 지키려는 마음은 중요하다 생각해.\"\n\"저도 그 마음에는 동의한답니다. 네. 아코 씨를 개인적으로 좋아하지는 않습니다만, 그렇다 해서 그 사람이 파멸하거나 배드 엔딩을 맞는 것을 바랄 정도로 미워하는 것은 아니니까요. 문제는... 히나 부장이 그녀를 끝까지 감싸줄 것인가.\""
 GEH.ako.story_event.2.a: "저는 히나 부장이 현명한 판단을 내리기를 바랄 뿐입니다."

 GEH.ako.story_event.3.t: "통제민주주의에 대한 반응"
 GEH.ako.story_event.3.desc: "도이칠란트 사회민주당은 기획부 평의회와 사실상의 의회 일당독재에 대해 별다른 논평이나 반발을 하지 않았다. 애초에 평의회가 만들어지기 이전에도 게헨나 선도부는 '지방 자치에는 현지 정당의 참여를 허용하나, 중앙 정치의 관여는 금지'라는 원칙을 지키고 있었다. 의회가 만들어지고 간선제 의원들이 선출되었다 해도, 그것은 중앙 정치 의회일 뿐. 이전과 달라진 것은 아무것도 없었으니까. 사회민주당은 지방 의회에서 영향력을 늘린 뒤, 시민들의 여론을 이끌어 내 평의회에 점진적으로 현지인 의석을 할당받는 것을 목표로 '게헨나 법률 안에서의 투쟁'을 이어가기로 의견을 모았다.\n\n가장 격렬하게 반발한 것은 중앙당과 바이에른 인민당 두 정당이었다. 바이에른에서 가장 큰 대중적 영향력을 가진 인민당은 평의회에 현지인 정당의 참여가 금지된 것이 게헨나의 바이에른 '식민통치'를 증명하는 것이라고 주장했다. 인민당은 바이에른의 다른 우파 정당인 중앙당과 연합하여 바이에른의 중요 도시들에서 시위를 벌였다. 인민당-중앙당이 '무력 충돌이 일어날 경우 게헨나 공권력을 이길 수 없다'는 지시를 내린 탓에 시위는 평화적으로 진행되었으나, 일부 도시에는 소규모의 약탈이 발생하는 등 우발적인 폭력 사태가 발생했다."
 GEH.ako.story_event.3.a: "민주주의를 좋아하지도 않았으면서..."

 GEH.ako.story_event.4.t: "연애 성공! 해피엔딩?"
 GEH.ako.story_event.4.desc: "아코는 오락실에 있는 인형 과녁을 향해 장난감 총을 쏘았다. 플라스틱 탄환은 과녁의 인형에서 한참 떨어진 곳으로 날아갔다.\n\n\"이건 음모예요! 그... 만마전이 총의 조준점을 막 조작해서...\"\n\n히나는 투덜거리는 아코의 모습을 보며, 희미한 미소를 지었다. 두 사람이 연애 사실을 공식화한 이후 첫 번째 데이트. 평소와 똑같은 아코였지만, '데이트 중'이라는 것만으로도 그녀의 편집증조차 귀엽게 느껴지는 것 같았다.\n\n\"내가 한 번 쏴 볼게. 줘 봐.\"\n\"네? 아, 네 부장님. 이 총은 분명 문제가-\"\n\n탕-! 히나는 단번에 페로로 박사 인형의 머리를 맞춰 인형을 바닥으로 떨어뜨렸다. 안경을 쓴 페로로 박사 인형이 바닥에 떨어져 수인 종업원에 의해 히나의 품에 안겼다. 아코의 얼떨떨한 표정을 보며 히나는 웃음을 터트렸다. 정말, 그 표정 변화만으로도 더 없이 유쾌했다."
 GEH.ako.story_event.4.a: "페로로 박사님은 네게 줄게. 소중히 간직해 줘."

 GEH.ako.story_event.5.t: "미래 계획"
 GEH.ako.story_event.5.desc: "\"게헨나도 드디어 통일되었고, 사람들도 슬슬 아코쨩이 언제 부장님이랑 결혼하게 될지 얘기하고 있더라고.\"\n\n게헨나 복도, 이오리는 아코를 돌아보며 말했다. 결혼. 예상하지 못한 이오리의 말에 아코의 뺨이 붉게 달아올랐다.\n\n\"푸에흥-!\"\n\"아하핫! 뭐야 그 기침소리는! 아코쨩 진짜 웃기네.\"\n\n이오리는 아코의 등을 짝! 소리 나게 치며 웃었다.\n\n\"평생 연애만 하다 죽을 순 없잖아? 데이트도 좋고 같이 다니는 것도 좋지만, 슬슬 소라사키 아코가 될 준비를 해야지? 결혼하게 되면 내가 축가도 하나 불러 줄 테니까 긴장 풀고.\"\n\"괘, 괜찮겠어요? 실행부는 우리 기획부를 정말... 정말로 혐오하는 거로 아는데.\"\n\"아, 그 파벌 싸움? 그거야 다른 간부들 얘기고. 나야 아코쨩 별로 안 싫어하니까. 혹시 내가 가면 불편할까?\""
 GEH.ako.story_event.5.a: "아뇨. ...그냥, 고마워서요."

 GEH.ako.story_event.6.t: "다른 미래 계획"
 GEH.ako.story_event.6.desc: "\"요즘 선도부 내부 분위기는 어때? 나랑, 아코의 연애에 대해서.\"\n\n차분하지만, 깊은 뜻을 담고 있는 히나의 질문에 치나츠가 들고 있던 서류를 잠시 책상에 내려놓았다. 히나의 연애 문제는 분명 [ROOT.GetName] 전국에서 가장 뜨거운 이슈일 것이다. 현지인들은 모일 때마다 히나를 적그리스도라고 욕을 해 댔고, 키보토스인들은... 그냥 흥밋거리로서 두 사람의 연애에 대해 잡담을 나누었다. 그리고 선도부는... 치나츠는 잠시 고민하다가, 복잡한 정치나 내부 파벌 이야기 대신 가벼운 이야기로 히나의 말을 넘겨버리기로 했다.\n\n\"선임행정관님과 부장님의 불 같은 밤 시간의 이야기를 담은, 만화가 메루리 씨의 동인지가 선도부 내에서 상당히 인기가 많더군요. 저도 재미있게 읽었습니다.\"\n\"응. 그래. 재미있었다면 됐...\"\n\n히나의 손에서 펜이 떨어졌다."
 GEH.ako.story_event.6.a: "잠깐. 불 같은... 뭐가 어쨌다고?"

 GEH.ako.story_event.7.t: "메루리 동인지 문제"
 GEH.ako.story_event.7.desc: "히노미야 치나츠의 '보고'와 뒤이은 소라사키 히나의 조사를 통해, 선도부만이 아니라 게헨나 전체에서... '메루리'라는 익명의 작가가 그린 불건전한 내용의 동인지가 퍼지고 있다는 것을 알아낼 수 있었다. 내용은 스칸디나비아의 온천에 놀러 온 '선도부장'과 '선임행정관'이 몸을 섞는 매우 '화끈한' 풀컬러 48페이지 만화책이었다.\n\n\"아...아무튼..으, 음모예요! 당장 모조리 모아서 소각, 소각을 해야...!\"\n\n당황한 아코가 허둥지둥하며 얼굴을 붉히고 있는 사이, 히나는 아코를 대신해 침착하게 <G헨나 두근두근 비밀스러운 온천여행기> 문제를 해결할 방법을 찾아야 했다. 백물어를 만들어내는 백귀야행의 괴서보다도 두려운 메루리의 이 동인지들을 어떻게든 선도부 예산을 들여 모조리 사들여 소각하거나... 아니면 그냥 눈을 감고 잊어버리는 것이 대안이었다. 머리부터 발끝까지 똑같이 생기긴 했지만, 이 '선도부장'과 '선임행정관'이 히나와 아코라고 명시되어 있는 것도 아니지 않나?"
 GEH.ako.story_event.7.a: "참자. 이건 내가 아니야. 다른 학원의 어떤 선도부장..."
 GEH.ako.story_event.7.b: "...아니. 역시 안 되겠어. 모두 사들여서 태워버려."

 GEH.ako.story_event.8.t: "메루리 동인지 문제의 해결"
 GEH.ako.story_event.8.desc: "히나 부장의 대응이 그래도 도움이 되었던 것 같습니다. 침착한 히나 부장의 대응으로 인해 <G헨나 두근두근 비밀스러운 온천여행기>의 사회적 인기와 영향력이 점점 감소하고 있다는 보고입니다. 그저 동인지의 인기가 식을 시기가 되었을 뿐인지도 모르지만요.\n\n다만, 당분간 선도부원들이 복도를 걸을 때 아코와 히나를 조금... 부끄러운 시선으로 바라보는 것은 피할 수 없을 것 같습니다. 그녀들의 기억까지 지워버리는 건 불가능할 테니까요."
 GEH.ako.story_event.8.a: "...적어도 R-18이 아니라 전연령으로 내 줄 수는 없었나?"

 GEH.ako.story_event.9.t: "소라사키 히나의 결혼식"
 GEH.ako.story_event.9.desc: "소라사키 히나와 소라사키 '아마우' 아코의 결혼식은 이미 모두가 예상하고 있던 미래였다. 이미 두 명의 연애는 공표되어 있었고, 시끄럽게 떠들어대는 도이칠란트의 현지인들의 시선 따위는 아코도 히나도 신경 쓰지 않았으니까. 결혼식장은 도이치인들의 테러를 대비해 삼엄한 경비 병력이 투입되었으나, 경비 인력을 초과하는 수많은 키보토스계 인구가 두 사람의 기록적인 결혼식을 보기 위해 게헨나 중앙구의 성당 앞으로 모여들었다.\n\n\"두 사람은 앞으로 일생 동안 함께 할 것을...\"\n\n주례를 맡은 참새 수인의 앞에서 드레스를 입은 두 사람은 영원한 맹세를 하고, 많은 방청객들을 향해 부케를 던졌다. 부케를 건네받기 위한 다소 과격한 몸싸움 끝에, 시로미 이오리가 최후의 승리자가 되었다. 삼엄한 경비가 지키는 결혼식이었지만 어느 때보다도 열리고 활기찼으며, 많은 도이치인들이 테러 협박을 했지만 그들은 키보토스계 방청객들의 파도 앞에서 성당에 접근조차 할 수 없었다.\n\n\"정말 즐거운 하루지, 아코?\"\n\"단순히 '즐겁다'는 말로 표현할 수는 없지요.\"\n\n아코는 희미한 미소를 지었다."
 GEH.ako.story_event.9.a: "...일생 동안 잊을 수 없는 하루로 남을 거예요."

 GEH.ako.story_event.10.t: "결혼 이후"
 GEH.ako.story_event.10.desc: "아코가 히나와 동거하게 되면서 알게 된 사실이 있다. 히나는 집에서 핑크색 파자마를 입는다는 것, 그리고 의외로 게임기 같은 오락 기기들을 취미로서 즐긴다는 것, 마지막으로... 여전히 집으로 서류들을 가지고 오려고 한다는 것이다.\n\n\"부장님... 집은 휴식을 위한 곳이어야죠. 왜 여기까지 서류들을 가져오세요.\"\n\"아, 미안. 아코. 결제 서류는 침실 밖에 나가서 할 게.\"\n\"아뇨-! 부장님이 나가라는 뜻이 아니라! 이 지긋지긋한 서류들을 내보내라는 뜻이라고요!\"\n\n아코는 투덜거리며 히나의 손에서 서류를 빼앗았다. 두 사람의 연애 이후, 히나는 어떠한 일이 있더라도 자신은 아코의 곁에서 떠나지 않을 것이라고 말해 주었다. 하지만... 업무 분담을 약속한 이후에도 워커홀릭 버릇이 남아 있는 히나를 보면, 아코는 불안감이 스멀스멀 올라오는 것을 참을 수가 없었다.\n\n정말로 소라사키 히나는 괜찮은 것일까? 스스로 불러온 업무에 짓눌려 무너지지는 않을까? 한 때 접은 생각이었지만, 아코는 다시 한 번... 히나가 모든 업무를 내려놓고 아코에게 부담을 맡겨야 한다고 생각했다.\n\n\"부장님. 저기... 잠시, 상담 가능할까요?\""
 GEH.ako.story_event.10.a: "...제가 아니라, 부장님의 미래에 대한 이야기예요."

 GEH.ako.story_event.11.t: "아코의 펫"
 GEH.ako.story_event.11.desc: "대전이 이전 아코가 '히나의 펫'이라는 조롱을 달고 살았던 것을 생각한다면 참 어처구니 없는 일이지만, 최근 집무실 안에서는 히나를 상대로 한 '아코의 펫'이라는 조롱이 공공연하게 돌아다니고 있었다. 원인이야 뭐 간단했다. 과로로 인해 쓰러질지도 모른다. 그런 히나를 보호하기 위해... 모든 권력을 포기해 달라. 그런 아코의 부탁을 히나가 받아들였기 때문이다.\n\n잔잔하게 울리는 피아노 소리. 히나가 집무실 한쪽에 마련된 피아노를 연주하며 연습에 몰두하는 사이, 아코는 원래 히나가 처리했어야 하는 공문서들을 하나하나 처리하고 있었다. 과거에는 히나가 한 번 들여다 보기라도 했을 서류들에는, 더 이상 히나의 손끝조차 닿지 않았다.\n\n히나는 흑백의 건반을 두드리며 등 뒤에서 들려오는 아코의 사각거리는 펜소리에 집중했다. 모든 짐을 내려놓는다는 것이 과거에는 불안하기만 했었다. 게헨나의 질서를 반드시 '소라사키 히나'가 지켜야 한다는 강박관념이 있었다. 언젠가는 그 강박관념에 눌려... 스스로 부서졌을지도 모른다. 하지만 이제 아니다.\n\n\"꼭두각시 선도부장이라는 것도, 뭐. 나쁘지는 않군.\"\n\"꼭두각시라고 부르지 마세요. 언제라도 원하신다면 부장님이 대신 업무를 보실 수 있으니까요.\"\n\n언제라도 원하기만 한다면 말인가. 히나는 희미하게 웃었다. 아코의 의도를 의심하지는 않았다. 하지만 이제 와서 권력을 되찾고 싶은 마음은... 그다지 없었다. 모든 생각을 아코에게 맡긴 채, 그저, 이 순간을 즐기는 것이 히나의 행복이 되었으니까."
 GEH.ako.story_event.11.a: "정말로 좋아해, 아코."

 GEH.ako.story_event.12.t: "행복하시나요?"
 GEH.ako.story_event.12.desc: "\"...모든 집무를 그만두었다, 그 말씀이시군요. 히나 부장님, 아니. 공적 직급인 히나 의장님이라고 불러드려야 할까요?\"\n\n하루나의 희미한 미소를 보며, 히나는 아이스티를 한 모금 마셨다. 예전이었다면 해결해야 할 골칫거리였을 하루나를 보아도 이제는 아무런 생각도 들지 않는다. 히나의 직급은 여전히 선도부장이고, 의장이었지만. '진짜' 의장은 사랑하는 자신의 아내였으니까.\n\n\"뭐, 어떻게 부르든 상관은 없어. 하지만... 지금 삶이 내게 행복하단 것만은 진실이군. 정치 권력을 중요시하는 이에게는 내가 실패한 것처럼 보일 수는 있겠지. 하지만...\"\n\n히나는 아이스티를 살짝 들어 흔들었다.\n\n\"나는 워라벨을 더 우선시해서 말이야.\"\n\"후후. 최근에는 피아노 연주 실력도 많이 늘으셨다고요. 언젠가는 히나 부장의 피아노 연주회를 들을 수도 있는 걸까요?\"\n\"남는 게 시간이니까. 가능할 수도 있겠지.\"\n\n피아노 연주회라. 예전이었다면 결코 생각조차 할 수 없었을 미래다. 하지만 그 미래를 현실로 만들어 준 것이, 바로 아코였다. 그런 그녀와 함께 하는 행복을 위해서라면, 잘난 권력이 대수겠는가? 히나는 진정한 해방감을 느끼며 하루나와 마주보며 웃었다."
 GEH.ako.story_event.12.a: "어느 때보다도 행복하게"

 GEH.ako.story_event.13.t: "소중하게 간직하도록 - 1"
 GEH.ako.story_event.13.desc: "대전이 이전부터, 아코와의 관계는 각별했었다. 그래. 하지만 그 관계성이... 단순한 '각별함'을 넘어서, 애정과 사랑의 단계로 발전하게 될 것이라고 상상한 적은 한 번도 없었다. 애초에 아코가 품고 있는 감정은 단순한 선도부장을 향한 존경이라고만 생각했으니. 아니, 어쩌면 정말 존경에 불과했을지도 모르지. 대전이라는 비현실적인 상황과 극한 현실이 그 감정의 형태를 바꾸었을지도 모른다. 세계 단위의 흔들다리 효과라고나 할까.\n\n중요한 것은 지금 이 순간, 아마우 아코가 아닌 '소라사키' 아코가 자신의 곁을 지키고 있다는 사실이다. 피아노 연주를 계속 이어가던 히나는 문득 자택 창문을 닦고 있던 아코를 돌아보았다. 이 현실 자체가 여전히 꿈처럼 느껴져서, 아코가 자신의 집에 함께 있다는 것이 아직도 가끔 믿기지 않을 때가 있다.\n\n\"부장님?\"\n\n그 다정한 목소리가 히나를 현실로 되돌려주었지만.\n\n\"또 '부장님'이야? 편하게, '히나'라고 불러. 세상에 무슨 아내가 그런 사무적인 말을 써.\"\n\"...후후. 제게는 '부장님'이 가장 편한 표현이라니까요?\"\n\"내가 편하지 않다니까... 뭐, 변하지 않는 것도 네 매력이겠지.\"\n\n히나는 희미하게 웃으며, 피아노에서 일어났다."
 GEH.ako.story_event.13.a: "잠깐 산책이라도 나갈까? 청소는 이만 하면 충분한 것 같은데."

 GEH.ako.story_event.14.t: "소중하게 간직하도록 - 2"
 GEH.ako.story_event.14.desc: "아코는 자신의 홀스터에 매인 '핫 샷'을 매만지며, 공원을 걸었다. 히나의 아내가 되었다 해도 그녀는 여전히 선임행정관이었으며, 히나를 혹시 모를 위협으로부터 배제할 의무가 있었다. 사실 아코 자신보다도 히나가 더 강하다는 것을 알고 있었지만.\n\n대전이 이전 그녀의 감정도 사랑이었을까? 지금의 아코로서는 사실 떠올릴 수 없을 만큼 오래 된 기억이 되어버렸다. 하지만 중요한 것은 지금 자신의 곁에 히나가 있다는 것, 그리고 그녀가 아코를 향해 다정하게 손을 내밀어주고 있다는 점이다. 아코는 잠시 홀스터에서 손을 놓고 히나가 내민 손을 잡았다. 그 온기를 느끼며 공원을 걷는 것만으로도 이 시간이 너무도 행복했다.\n\n\"이 시간이 영원히 이어졌으면 좋겠어요.\n\"그럴 수는 없겠지. 모든 순간에는 끝이 오니까.\"\n\n히나는 희미하게 웃었다.\n\n\"하지만 그렇기 때문에, 이 행복한 순간을... 최대한 가치 있게 만들고 싶어.\"\n\"영원하지 않기 때문에 기억 하나하나가 소중하다는 말씀이시군요? 후훗. 네. ...저도, 그렇다고 생각해요.\"\n\n아코는 히나와 맞잡은 손에 힘을 주며 걸었다. 우리들의 시간도 영원하지는 않을 것이다. 언젠가는 한 명을 떠나 보내야 할 날이 오겠지. 하지만, 그 때까지. 두 사람에게 함께 할 시간을 신이 허락하는 때까지."
 GEH.ako.story_event.14.a: "이 순간 하나하나를 소중하게 간직하자."

 GEH.ako.story_event.15.t: "소중하게 간직하도록 - 3"
 GEH.ako.story_event.15.desc: "소라사키 '아마우' 아코 게헨나 연방공화국 선임행정관입니다.\n\n이 편지는 백 년 뒤 다음 세대가 열어볼 수 있도록 아주 특수한 밀봉재를 사용하여 게헨나 평의회 앞에 묻어 두도록 하였습니다. 21세기의 여러분, 안녕하신가요. 그 때에도 게헨나라는 국가가 존재하기를, 그리고 그 때에도 이 세계를 키보토스의 사람들과 도이치인들이 평화롭게 어우러져 살아가기를 간절하게 바랍니다.\n\n이 편지를 제가 100년 뒤에 꺼내 읽어볼 수 있는 가능성은 그다지 높지 않을 겁니다. 뭐, 생명공학이 얼마나 발전할지는 모르는 일이지만요. 그래도 다음 세대에게 제가 하고 싶은 말을 마음대로 남기는 건 가능할 겁니다.\n\n연방공화국과 통제민주주의 체제를 도입한 이유에 대해 100년 뒤에는 많은 사학자들이 여러 억측들을 남기고 있을 겁니다. 아마 다 틀렸을 겁니다. 기획부의 정치 장악 때문도 아니고, 제 권력욕 때문도 아니고, 그저... 사랑 때문이었습니다. 히나 부장님은 스스로의 책무로 짓눌리고 계셨고, 저는 그저 그 분의 어깨에 놓인 짐을 덜어주고 싶었을 뿐이었습니다.\n\n그 '사랑' 하나 때문에 시작한 모든 일들이 이 위대한 공화국을 만들게 되었네요. 다음 세대의 정치인들도 단순한 돈과 권력을 넘어서... 자신이 가장 소중하게 생각하는 사람들을 위해, 자신이 사랑하는 사람을 위해 게헨나를 통치한다는 마음을 지켜 나간다면 좋을 것 같습니다. 그 어떤 법률보다도 정치인 개개인이 국민들을 사랑하는 것이 부정부패를 막는 가장 근본적인 길이 될 테니까요.\n\n이상입니다. 이 편지가 개봉될 때 아마 게헨나에 없을 저와 히나 부장님이 여러분의 길을 축복할 것입니다. 행복하시기를."
 GEH.ako.story_event.15.a: "소라사키 아코, 소라사키 히나의 자택 서재에서."

 GEH.ako.story_event.16.t: "우정이 이어지도록 - 1"
 GEH.ako.story_event.16.desc: "대전이 이전부터, 아코와의 관계는 각별했었다. 그 각별함은 아코가 히나에 대한 감정을 사랑으로 자각하면서 크게 흔들렸지만, 어떻게든 그녀는 히나로부터의 거절을 받아들일 수 있었다. 분명 이전과 완전한 관계로 돌아갈 수는 없겠지만, 적어도... 히나는 여전히 두 사람이 친한 동료이자 친구 사이로 남았다고 생각한다.\n\n히나는 집무실 책상에서 고개를 들어, 맞은편에서 난초에 물을 주고 있는 아코를 마주보았다. 그녀가 지금 무슨 생각을 하고 있는지는 알 수 없다. 여전히 자신을 원망하고 있을까? 사랑을 거절하고 기획부 평의회 대신 친정을 하기로 한 자신에게... 불만을 품고 있을까? 아코는 감정 표현이 풍부하지만, 그 편집증과 히나에 대한 충성심 속에... 진심을 감추는 경향이 있다.\n\n\"부장님? 무슨 일이라도 있으신가요?\"\n\"아니. 그냥. ...난초에 물을 너무 많이 주는 거 아닌가 해서.\"\n\"물 양은 충분히 조절하고 있으니 걱정 안 하셔도 된답니다. 후후.\"\n\n그녀의 미소를 보면서도, 히나는 완전한 평온을 얻을 수 없었다."
 GEH.ako.story_event.16.a: "마치 칼날 위에 서 있는 기분이야"

 GEH.ako.story_event.17.t: "우정이 이어지도록 - 2"
 GEH.ako.story_event.17.desc: "사람은 사람의 마음을 알 수 없다. 우리는 서로와 물리적으로는 이어질 수 있더라도 정신적으로까지 이어질 수는 없으니까. 아코와 함께 회의를 마치고 함께 커피를 마시며, 히나는 문득 아코의 눈을 보았다. 대전이 이후 오랜 시간이 지나며, 그녀는 조금씩 변해갔다. 하지만. 히나는 아코가 자신을 향해 갖는... 그 우정만큼은 변하지 않았기를 바랐다.\n\n\"아코. 아코는... 내 선택을...\"\n\"부장님?\"\n\"아니야. 아무것도.\"\n\n겁쟁이. 한심하기는. 스스로의 마음이 비난을 퍼부었다. 그래. 겁쟁이가 맞다. 하지만 어떻게... 이 상냥한 아코에게, '내가 널 차서 미안한데. 아직도 날 친구로 생각하고 있어?' 라고 물을 수 있단 말인가. 그건 너무 잔인한 일 아닌가. 히나는 그저, 창문 너머를 향해 시선을 돌리며 가만히 기도할 뿐이다.\n\n\"우리들이 함께 하는 시간이, 계속 이대로 이어졌으면 좋겠다.\"\n\"영원히 이어지는 것은 없는 법이죠. 세상의 모든 것에는... 시작과 끝이 있으니까요.\"\n\n그렇게 말하면서, 아코는 희미한 미소를 지었다."
 GEH.ako.story_event.17.a: "그러니 그냥, 저와 함께 하는 시간 동안... 평온함만을 느껴 주셨으면 해요."

 GEH.ako.story_event.18.t: "우정이 이어지도록 - 3"
 GEH.ako.story_event.18.desc: "소라사키 히나다. 아마 이 일기를 읽을 사람은... 아무도 없겠지. 한 백 년 정도가 지나면, 사학자들이 슬쩍 들여다볼지도 모르지만. 적어도 내가 살아 있는 시간에는 없을 거야.\n\n아코를 거절한 것이 잘 한 일인지 모르겠어. 평생동안 알 수 없겠지. 아코와 함께 있으면서도 나는 고독을 느끼고, 아코가 곁에 있지만, 그녀의 마음은 다른 곳으로 가 있는 것 같아. 그래. 아코는 애써 내게 '평상시의 아마우 아코'를 연기하고 있지만.\n\n아코의 마음은 그 거절 이후 분명히 바뀌었어.\n\n그 '바뀐 마음'을 인정하고 싶지 않아서... 애써 모른척 하고 있었던 것 뿐이지. 영원한 우정은 없는 법이니까. 하지만, 아코가 말한 이야기만은 마음에 품고 살아가고 싶어. 적어도 지금 이 순간 아코는 내 곁에 있어. 언제 내 곁을 떠나가게 될 지 불안하지만, 그래도... 세상의 모든 것이 끝나기 전. 아코와의 시간이 다하기 전에.\n\n지금 이 순간, 아코와 함께 하는 하루하루에서 평온함을 느끼고 싶어. 내게 있어서 아마우 아코는, 어떤 일이 있더라도 가장 소중한 친구니까."
 GEH.ako.story_event.18.a: "소라사키 히나. 내 자택 서재에서."

 #히나 루트
 GEH.hina.story_event.1.t: "계속되는 꿈"
 GEH.hina.story_event.1.desc: "나는 매일 일기를 쓰는 편은 아니지만, 가까운 시일 안에 의사에게 이 자료를 전달해야 할지도 모른다는 의무감에 일기를 쓰기 시작했다.\n\n최근 악몽을 꾼다. 누구에게도 말할 수 없는 악몽이다. 잠에 들면 나 자신의 모습을 한 누군가가 선도부장 집무실 책상에 앉아 있다. 나는 그 모습을 집무실 입구에 서서 바라보고 있다. 내가 아닌 다른 나를 관찰자처럼 바라보면서.\n\n그 또 다른 나는 아무런 말도 하지 않고 있다. 지난 사흘 동안 나는 그녀(나?)와의 대화를 시도해 보았다. 말을 걸어 보기도 했고, 그녀가 읽고 있던 서류를 잡아서 빼앗아보기도 했다. 한 번은 그녀의 머리를 때려본 적도 있다. 하지만 소용 없었다.\n\n내 말은 그녀에게 닿지 않은 채 사라졌고, 내 폭력은 그녀에게 어떠한 위해도 가할 수 없는 것 같았다. 그녀의 몸에 직접 닿는 순간 내 손끝은 그녀의 몸을 그대로 투과해 지나치고는 했다. 도대체 이 녀석의 정체는 뭘까?\n\n한 가지는 확실하다. 내 건강이 상당히, 아니, 아주 심각하게 망가지고 있다는 것."
 GEH.hina.story_event.1.a: "소라사키 히나."

 GEH.hina.story_event.2.t: "바알"
 GEH.hina.story_event.2.desc: "오늘 일기는 조금 더 특별하다. 지금까지 내게 한 마디도 걸어오지 않았던 '그녀'가 처음으로 내게 말을 걸었다. 내가 이전보다 더 미쳐가고 있다는 것일지도 모르겠다. 하지만 대답 없는 나와 밤새 마주보고 서 있는 것보다는 말이 통하는 환상이 더 나을지도 모르겠다.\n\n내 얼굴, 내 목소리를 가진 그녀는 '바알'이라고 한다. 나의 이중인격이자 내 신비로부터 탄생한 또 다른 의지. 말투가 꽤나 현학적이라서 (에덴 조약 협상 때 만났던 세이아를 연상시킨다고 하면, 그녀에 대한 실례가 될까) 내 다른 인격이라는 말이 사실 잘 믿기지는 않았다. 나는 그녀보다는 훨씬 '쉬운' 문장을 사용하는 편이니까.\n\n하지만 일단 바알의 말에 거짓이 없다는 전제 하에 일기를 써 보려고 한다. 바알은 내가 열성부원들의 억지로 인해 독재자의 제관을 쓰게 되었다는 것을 측은하게 생각하면서... 다양한 이야기를 해 주었다.\n\n쓰레기 같은 도이칠란트의 개새끼들, 그리고 나를 좋아하는 척 하며 나를 권력 유지에 이용하려는 열성부원들... 내 다른 인격이 하는 말이라는 것이 믿기지 않을 만큼, 바알은 증오심에 가득 차 있었다. 내가 지켜야 하는 현지인들, 그리고 나를 믿고 따르는 선도부원들을 모욕하다니. 나는 당연히 화를 내고, 그녀의 집무실에서 뛰쳐 나왔어야 했다.\n\n하지만 나는 그러지 못했다.\n\n어째서? 나는 그녀의 말이 끝날 때까지 아무것도 하지 못했던 걸까?\n\n내가 바알의 말이 옳다고 생각하기 때문이 아니기를."
 GEH.hina.story_event.2.a: "소라사키 히나."

 GEH.hina.story_event.3.t: "증오가 꼭 나쁠까?"
 GEH.hina.story_event.3.desc: "\"아, 히나. 오늘도 다시 만나네.\"\n\n게헨나 선도부의 집무실. 바알은 내 자리에 앉아 펜을 빙그르르 돌리고 있다. 내 얼굴, 내 목소리를 한 다른 누군가를 보는 것은 아무리 반복되어도 익숙해지지 않는다.\n\n심지어 그녀가 내 이중인격이라고 하더라도 말이다.\n\n\"그래. 이 빌어먹을 꿈은 멈추지가 않는군. 우선 묻지. 바알. 너는 어째서 나타난 거지? 네가 나라면... 왜 게헨나와 도이칠란트를 증오하게 만드려는 거고?\"\n\"약간의 오해가 있는 것 같네. 나는 네가 이 땅의 사람들을 증오하게 만드려는 게 아니야. 너는 이미 그 모든 것들을 증오하고 있으니까.\"\n\n바알은 의미심장하게 웃었다.\n\n\"나는 너야. 그렇기에 네가 다른 존재들의 노예가 되어 살아가는 모습을 보고 싶지 않았을 뿐이지. 열성부원들의 광신과 나치 쓰레기들의 테러... 너는 그 모든 것들을 감당하고, 인내하며 지금까지 견뎌왔어. 하지만 네 보답을 받은 이들이 한 번이라도 감사를 표한 적이 있었나? 네게 잘 했다고 말하며 네 고통과 인내를 인정해 줬었나? 그래. 심지어는 선도부의 간부들조차 그러지 않았지.\"\n\"그건...\"\n\"인정해. 히나. 이 선도부, 이 게헨나에서 제정신인 건 너 뿐이야. 그 이외의 모든 것들은 모두 잘못되어 있어. ...그것을 바로잡을 시간이야.\""
 GEH.hina.story_event.3.a: "나는 잠에서 깨어났다."

 GEH.hina.story_event.4.t: "건강 상태"
 GEH.hina.story_event.4.desc: "내가 제정신이 아니라는 것은 잘 알고 있다. 이중인격이라는 것 자체가 정신질환 아니던가? 하지만 이 사실을 다른 사람들에게 밝힐 생각은 아직 하지 못하고 있다. 게헨나의 통치를 이어가야 하는 책무 때문이라고 하면 거짓말이겠지.\n\n솔직히, 사실을 밝힌 이후의 일이 두렵다. 다른 사람들이 나를 바라보는 시선이 달라지는 것이 불안하다. 나는 타카나시 호시노가 아니다. 타인들은 나를 완벽 초인, 절대적 질서라고 생각하지만...\n\n나는 나약하다.\n\n두려워하고, 불안해하며, 타인의 시선을 신경쓰는, 그런 나약한 사람.\n\n내가 그런 사람이라는 것이 밝혀지더라도, 아코는, 치나츠는, 이오리는, 그리고 다른 사람들은 나를 이전과 같은 시선으로 봐 줄까? 아니, 그러지 않을 거야. 경멸하겠지. 절대적인 게헨나의 대전제이자 통치자인 소라사키 히나가 겁쟁이라니."
 GEH.hina.story_event.4.a: "나는 가라앉고 있다"

 GEH.hina.story_event.5.t: "제3차 선도부 총회 기념 파티"
 GEH.hina.story_event.5.desc: "게헨나의 통일과 선도부의 승리는 참으로 기쁜 일이다. [ROOT.GetNameDef]의 영광이여 영원하라. 나는 빌어먹을 도이칠란트제 백포도주를 게헨나 관료들에게 받아 마셨고, 제3차 총회 기념 파티장에서 의식을 잃어버렸다.\n\n바알이 거기 있었다.\n\n내가 그 씨발놈의 술에 취해 의식을 잃은 사이, 바알이 내 몸을 빼앗았다. 나는 파티장에서 도이치인들에 대한 매우 부적절한 발언들을 이어갔다. 아코와 내가 말다툼을 했고, 나는 주먹으로 와인병을 바닥에 내던져 깨는 기행을 벌였다.\n\n그 사실들을 내가 모든 상황이 끝난 뒤 제3자에게 전해 들었다고 하면 어떤 기분일 것 같은가? 비참하다. 이것은 단순히 술에 취해 벌인 술주정 따위가 아니다. 내 안에 다른 누군가가 있다. 그리고 그녀가 증오를 퍼트리라고 말하고 있다. 그래. 확실하게, 나는 제정신이 아닌 상태다."
 GEH.hina.story_event.5.a: "나는 그다지 모범적인 지도자는 아니야"

 GEH.hina.story_event.6.t: "의료 상담"
 GEH.hina.story_event.6.desc: "\"...다시 한 번 말하지만, 나는 평소에 전혀 술을 마시지 않아. 알코올 중독이라거나 그런 것도 아니고.\"\n\n지난 제3차 선도부 총회 기념 파티장에서 수많은 간부들이 보는 앞에서 와인병을 내던지며 아코와 싸움을 벌였다. 그 이후 아코에게 몇 번이고 허리를 숙여 진심으로 사과를 전했지만... 그것과 별개로, 의료부는 내가 알코올 중독으로 인한 섬망 증세를 가지고 있지 않은지 의심하고 있었다.\n\n치나츠는 혈액 검사 성분표를 이리저리 들여다보며 한숨을 내뱉었다. 그래도 내가 알코올에 찌들어 사는 게 아니라는 건 이해한 것 같았다. 다만 다른 비밀을 안 것 같기는 했지만.\n\n\"야근이 잦다고 들었습니다만... 그렇다 하더라도 이상한 각성제들에 손을 대시면 안 됩니다.\"\n\"...독재자는 업무량이 많아. 그 짐을 나누려 해도, 내 권한을 받아야 할 사람들조차 권력을 분립해 받는 것을 원하지 않고.\"\n\"...그건... 하아, 알고 있기는 합니다. 네. 하지만, 그렇다 해도 지금 신체 상태를 개선하지 않으면 분명히 더 악화될 겁니다.\""
 GEH.hina.story_event.6.a: "치나츠는 긴 처방전을 전달해 주었다."

 GEH.hina.story_event.7.t: "변화한 분위기"
 GEH.hina.story_event.7.desc: "게헨나 선도부원 하루노는 지난 총회 이후 게헨나 선도부의 분위기가 점점 변화하기 시작했음을 느꼈다. '위대한 지도자'인 히나에 의해 게헨나가 통제되어야 한다고 주장하는 광신적인 열성부원들의 목소리가 점점 커지고 있었다. 대전이 직후에는 그저 소수의 충성파들일 뿐이었지만, 1차 총회 이후에는 거대한 파벌로 변했으며, 2차 총회 이후에는 아예 커스텀한 비공식 완장까지 달고 뮌헨 시내를 돌아다니고 있었다.\n\n\"부장님은 왜 저런 녀석들을 건드리지 않고, 방치해 두는 건지 모르겠다니까.\"\n\n하루노는 한숨을 내뱉으며, 오늘도 선도부 건물 창문 너머로 보이는 완장 찬 바보들의 행진을 바라보았다. 하루노는 이 행진이 점점 잦아들다가 사라지기를 바랐지만, 어째서인지 그런 일이 없을 것 같다는 불안한 느낌이 들었다. 게헨나는 저 광신도들에 의하여 장악당하게 될까?"
 GEH.hina.story_event.7.a: "그러지 않기를 바란다."

 GEH.hina.story_event.8.t: "소라사키 히나 어록 예산안"
 GEH.hina.story_event.8.desc: "아코는 히나를 좋아한다. 히나의 행동 하나하나를  사랑했고, 그녀의 말 한 마디 한 마디를 애정했다. 철야 야근 때문에 지친 모습으로 횡설수설하던 모습도 반가웠고, 자신에게 퉁명스럽게 혼을 낼 때도 굴욕을 느낀 적은 없었다. 그렇지만. 그렇게나 히나를 좋아하는 아코였지만...\n\n\"소라사키 히나 어록 편찬 예산안... 진짜 제정신이 아니네.\"\n\n거의 편집증적일 정도로 히나의 말 한 마디 한 마디를 녹음해, 그럴싸한 '어록 책'을 내겠다는 열성부원들의 요구는 터무니 없을 정도였다. 이 사람들은 정말로 히나를 존경하는 거야? 아니면 히나의 말을 무기로 삼고 싶을 뿐인 거야?\n\n뛰어난 통찰력 (그리고 심각한 편집증)을 가진 아코는 이 '어록' 책 출간에 숨어진 이면의 의도를 분석해냈다. 게헨나의 법률에 존재하지 않는 규제를 가하기 위해, 여러 방면으로 해석될 수 있는 애매모호한 '히나의 어록' 책을 만든다. 그리고 그 어록에 따라 열성부원들이 자의적으로 '불법적'이고 '게헨나의 질서를 어기는' 행동들을 규정하고, 그러한 행동을 하는 반대파들을 탄압한다.\n\n예시를 들어 볼까. 아코는 '귀찮은 것은 싫다'는 히나의 말을 떠올렸다. 과연 그 귀찮다는 것은 구체적으로 무엇인가? 앞뒤 문맥을 잘라 놓은 이 한 문장에서 그 '귀찮음'을 아는 것은 불가능했다. 하지만 열성부원들은 이것을 자의적으로 해석해 규범 위의 관습법을 만들 수 있었다. '이러한 행동은 히나 부장님을 귀찮게 하는 죄다.'\n\n\"하아. 이 미친 서류를 위로 올려야 한다니.\"\n\n아코는 자연스럽게 예산안 서류를 찢어버리고 싶었지만, 결국 최종 결정권은 히나에게 있었다. 그리고... 아코는 히나가 이 예산안을 반려하지 않으리라는 것을 알았다.\n\n요즘 히나는 정신적으로 몰리고 있었다. 수많은 열성부원들의 광신적인 지지. 그녀는 그 지지에 '부합하는' 위대한 지도자가 되어야 한다는 강박관념에 짓눌려 있었다. 그런 그녀가, 열성부원들의 열정을 무시한다? 불가능하겠지. 아코는 이것이 잘못된 길이라는 걸 느끼고 있었지만... 도대체 어떻게 해야 하는 것인지 길을 찾지 못했다."
 GEH.hina.story_event.8.a: "총회 때만 해도, 이런 결말이 오리라고는 상상하지 못했는데..."

 GEH.hina.story_event.9.t: "열성부원들의 압박"
 GEH.hina.story_event.9.desc: "[GEH.GetNameDef] 내부에는 여러 정식 부서들이 존재한다. 사무직인 기획부, 현장직인 실행부, 의료 업무를 담당하는 의료부와 정보 수집을 담당하는 정보부의 4개. 자칭 열성부원들은 이 4개의 부서에 각각 흩어져 존재하고 있다. 열성부라는 독립된 부가 존재하는 것이 아니라, '다른 간부들은 위대한 지도자에 비해 불완전하기에, [ROOT.GetLeader]에게 권력을 집중해야 한다'는 파벌의 형태로 열성부원들이 존재하기 때문이다.\n\n그리고 이러한 열성부원들이 내부에서 파벌을 형성했다는 것은, 파벌에 소속되지 않은 부원들이 실질적인 차별을 받기 시작했다는 뜻이기도 했다. 열성부원들은 '밀어주고 끌어주며' 자신들의 파벌을 점점 확장해가고 있었다.\n\n그리고, 이러한 '확장'은 파벌 같은 머리 아픈 문제를 좋아하지 않는 이오리에게는 불쾌한 일이었다.\n\n\"파벌은 지랄. 실력과 공정한 경쟁으로 올라가는 게 게헨나 선도부 아니야?\"\n\n실행부의 중간간부가 이오리 앞에서 고개를 숙였다.\n\n\"그게 맞죠. 맞습니다만, 역시 밀어주고 끌어주는 그런 게 있지 않으면 올라가기가 힘들다고들 합니다.\"\n\"하아. 이게 눈에 보이는 조직 같으면 내가 싹 박살내버리는데. 파벌은 무슨 리스트가 있는 것도 아니니까, 뭐 방법이 없네.\"\n\"그러면 방치하실 생각이신가요?\"\n\"방치하고 싶지는 않아! ...기회가 되면, 언젠가 그놈들 다 쓸어 버릴 거야. 기회를 잡는다면...\""
 GEH.hina.story_event.9.a: "그 기회는 언제 올까?"

 GEH.hina.story_event.10.t: "단결하라 게헨나의 국민들이여"
 GEH.hina.story_event.10.desc: "선도부 열성부원이자 시민단체 자유게헨나연합 간부인 치사토는 준비된 연단에 오르며, 당당하게 게헨나의 시민들을 돌아보았다. 게헨나의 깃발을 휘두르는 많은 애국자들이 연단에 선 치사토를 올려다보고 있었다. 이렇게나 애국자들이 많으니, 게헨나의 미래는 분명히 그 어느 때보다도 밝을 것이다.\n\n치사토는 마이크를 쥐었다.\n\n\"게헨나의 국민 여러분. 지금은 어느 때보다도 단결해야만 하는 시기입니다. 매국적인 비국민들은 여전히 게헨나를 적국에 팔아 넘기려 하고 있으며, 판데모니움 소사이어티의 위협은 여전히 잔존해 있습니다. [ROOT.GetLeader]의 영도 아래 조국이 무한히 번영할 수 있도록, 우리는 반국가세력 탄압을 위하여 모든 힘을 모아야만 합니다.\"\n\n긴 연설을 이어가며, 치사토는 고개를 들었다. 게헨나 깃발을 흔드는 수천명의 국민들이 도로 전체를 가득 메우고 있었다. 이렇게나 많은 애국자들이 있다니. 게헨나의 미래는 분명히 밝을 것이다. 그리고 최근 우후죽순 생겨나는 게헨나 애국주의 시민단체들의 재정도 그들이 채워 줄 것이고.\n\n\"...우리 자유게헨나연합의 성공, 그리고 나치 파시스트와 공산주의자들을 처단하기 위해서는 많은 활동비가 필요합니다. 우리 운영비는 계좌이체 및 모바일 폰뱅킹으로도 기부가 가능하며...\""
 GEH.hina.story_event.10.a: "애국자들이 모인다"

 GEH.hina.story_event.11.t: "전쟁신 히나"
 GEH.hina.story_event.11.desc: "치나츠는 소라사키 히나를 존경하고 또 존중한다. 히나를 싫게 된다거나 하는 일이 일어날 일도 없을 것이다. 하지만, 히나를 따르는 사람들은 그다지 좋아하지 않았다.\n\n\"병원은 가장 평안하고 안정된 곳이어야 합니다. 환자들도 차분한 환경에서 휴식을 취하는 게 중요하고요. 그런데... 이런 포스터를 굳이 병실에 붙여야 할 이유가 있나요?\"\n\n치나츠는 의료부 내 열성부원 간부와 마주 선 채, 손에 들린 포스터를 잡아 휘휘 흔들어 보았다. '전쟁신 소라사키 히나'라고 적힌 포스터. 검은 날개를 펼친 채 창공을 향해 날아 오르며, 지상을 불태우는 히나의 모습이 상당히 과장된 모습으로 그려져 있다. 광고의 메시지는 간단했다. 히나의 위대함을 알리고, 그런 위대한 지도자의 가르침을 따르는 군에 입대할 것을 독려하는 프로파간다다.\n\n입대 프로파간다 자체는 그럴 수 있다. 그런데 그걸 굳이, 병원에까지 붙여야 하는가. 하지만 의료부 열성부원은 대수롭지 않다는 듯 말할 뿐이다.\n\n\"환자들은 침대에 누워서 어디로 가지도 못하지 않습니까. 그러니 병실에 포스터를 붙이면 사람들이 더 오래 우리 포스터를 볼 수 있게 되는 거죠. 과학적인 배치입니다.\"\n\"하지만 의학적으로 환자들의 안정에 도움이 될 것 같지는 않군요.\"\n\"조국에 대한 충성과 히나 님에 대한 열성이 의학 위에 서는 건 당연한 거 아닌가요?\"\n\n황당해진 치나츠는 포스터를 그녀의 얼굴에 던져버리고 싶은 충동을 느꼈다. 차분한 편인 그녀도 최근 열성부원들과 대화를 나눌 때면 감정이 점점... 격해지는 걸 알 수 있었다. 하지만 별 수 없다. 이미 의료부의 중요 인물들은 모두 열성부원이 되었다. 의료부를 총괄하는 치나츠조차도 다수의 여론을 무시할 수는 없었다.\n\n치나츠는 한숨을 내뱉으며 포스터를 되돌려주었다."
 GEH.hina.story_event.11.a: "\"적어도 경증 환자 병실에만 나눠주세요.\""

 GEH.hina.story_event.12.t: "한 사람을 위한 국가"
 GEH.hina.story_event.12.desc: "소라사키 히나는 독재자가 되고 싶지 않았다. 권력욕도 없었으며, 오히려 '에덴 조약'을 기점으로 자신의 권력을 내려놓고 사임하려는 마음이었다. 하지만 대전이는 ETO를 비롯해 게헨나의 질서를 대신 수호해 줄 수 있는 모든 대안을 마비시켰으며, 열성부원들은 대전이 이후의 혼란 속에서 소라사키 히나가 모든 혼란을 진압해 줄 것이라고 믿고 그녀를 추앙하고 있었다.\n\n히나는 전혀 권력욕을 가지고 있지 않았음에도 불구하고 강제적으로 주변에 의해 권력이 집중되는 것을 느꼈다. 그녀는 열성부원들의 열성을 밀어내고 싶었다. 하지만 다른 사람들의 지지와 열광을 배신하고 싶지 않다는 감정, 그리고 ETO를 비롯한 모든 '대안'이 무너지고 트리니티와 판데모니움 소사이어티와의 대립 문제를 해결해야 한다는 현실이 그녀를 옥죄어오고 있었다.\n\n결국 히나는 권력의 제관을 받아들일 수밖에 없었다. 그것이 대중의 선택이었고 열성부원들의 지지였으니까. 그녀는 철인이 될 수 없음에도 불구하고 철인왕을 강제당하고 있었다. 아무도 남지 않은 집무실에서, 창문 너머의 정신병자들의 환호 속에서, 히나는 홀로 서 있었다."
 GEH.hina.story_event.12.a: "누구보다 많은 지지자들 사이에서, 제일 고독하게."

 GEH.hina.story_event.13.t: "인민 대중의 지지에 환호하라"
 GEH.hina.story_event.13.desc: "히나는 1인 독재 체제에 점점 지쳐가고 있었고, 열성부원들의 지속적인 요구에도 환멸을 느끼고 있었다. 그녀들은 진짜로 소라사키 히나를 좋아하는 것이 아닌 히나라는 존재가 상징하는 가상의 철인왕을 지지하고 있을 뿐 아닌가? 그렇다면 그녀들이 원하는 대로 해 줄 것이다. 그녀들이 가상의 철인왕을 원한다면야.\n\n히나는 열성부원들이 올리는 모든 서류에 기계적으로 도장을 찍기 시작했다. 서류는 읽어보지도 않았다. 그녀들이 '원하는' 일들을 다 해주는 거다. 그것으로 히나는 인민 대중이 바라는 정책을 실시할 수 있었고, 열성부원들은 히나에게 인정받음을 감사할 것이다.\n\n물론 개소리다. 개소리라는 것은 알고 있다. 히나는 이것이 미친 짓이라는 것을 알았다. 하지만... 소라사키 히나는 그 광신도들을 끊어낼 수도, 자기 자신이 그 광신에 빠져들 수도 없었다. 그저, 이 광기의 파도 속에서 대중들의 지지를 유지하는 것만이 그녀의 한계였으니까."
 GEH.hina.story_event.13.a: "역겨워."

 GEH.hina.story_event.14.t: "위대한 대중의 승리"
 GEH.hina.story_event.14.desc: "게헨나의 재통일이 이루어졌고, 그것은 [ROOT.GetLeader]를 추종하는 열성부원들의 대중주의 이념의 성공을 상징하는 사건이기도 했다. [ROOT.GetLeader]는 인민 대중의 의지를 이끌었고, 게헨나가 다시 한 번 위대한 국가가 될 수 있도록 만들었다. 거리에서 환호성이 터졌으며 제3차 총회가 이루어지는 동안 수많은 애국주의적 구호와 기념 행사들이 열리게 되었다. 하지만 이 모든 변화가 게헨나인들의 지지를 받고 있는 것은 아니었다.\n\n가장 큰 문제는 도이칠란트 현지인들이 점점 새로운 정권이 1933년 나치 정권과 유사한 파시스트 국가가 되어 가고 있다고 믿게 된 것이다. 현지 정당인 사회민주당과 바이에른 인민당은 '국가가 파시스트화 되고 있다'고 주장하며 제3차 총회를 방해하기 위해 가두 시위를 벌이려다 강제로 해산당했다. 공산주의자들은 [ROOT.GetLeader] 정권의 붕괴를 꿈꾸며 더욱 격렬한 폭탄 테러를 벌였다. 제3차 총회 기간 동안 현지인들의 저항은 마지막 불꽃처럼 크게 타올랐다.\n\n물론 거대한 불꽃은 게헨나를 불태우기에는 너무 작았고, 게헨나 신정권은 너무 공고한 권력을 갖게 되었다. 사회민주주의자들과 보수주의자들의 시위는 탄압당한 뒤 다시 개최되지 못했다. 공산주의자들은 체포당했다. 게헨나에는 평소대로의 일상이 찾아왔다. 그 [ROOT.GetName]의 '일상'은 어둡고, 칙칙한 잿빛으로 물들어가고 있다고 하더라도."
 GEH.hina.story_event.14.a: "공화국은 견뎌낼 것이다."

 GEH.hina.story_event.15.t: "열성부 승리 방송"
 GEH.hina.story_event.15.desc: "게헨나의 재통일, 그리고 트리니티의 붕괴는 [ROOT.GetLeader]의 위대함을 키보토스 전체에 널리 알리는 상징적인 사건이 되었습니다. 우리는 위대한 지도자의 지도력이 있었기에 여기까지 나아갈 수 있었으며, 우리 공화국은 다시는 외부의 적 앞에 두려워 할 일이 없을 것입니다. 게헨나 판데모니움 소사이어티의 새로운 의장이자 공화국의 영원한 영도자가 된 [ROOT.GetLeader] 만세! 우리의 승리는 영원히 기억되리라!\n\n위대한 우리의 승리를 기념하기 위하여, 소라사키 히나 의장의 생일이 국경일로 지정될 것이며, 의장 님의 생가, 성장기에 다니셨던 초등부 중등부 고등부 교실 역시 문화 유적으로서 영구히 보존될 것입니다. 위대한 의장님의 가르침 아래에 게헨나는 계속해서 번영할 것입니다."
 GEH.hina.story_event.15.a: "히나는 라디오를 꺼 버렸다."

 GEH.hina.story_event.16.t: "경제 개혁"
 GEH.hina.story_event.16.desc: "게헨나의 새로운 경제 개혁안이 서류로 정리되었다. 히나는 서류를 들여다보지도 않은 채 다시 한 번 동의 서명을 적었다. 이미 히나에게 있어서 게헨나의 경제, 정치, 사회 그 모든 것은 아무래도 좋은 무언가가 되었다. 자신은 그저 '인민 대중의 의지'일 뿐이었다. 대중이 바라는 것이 히나가 바라는 것이었다. 거기에 히나의 생각이나 판단이 관여될 자리는 없었다. 한 마디 발언 기회도 없이 박수만 쉼 없이 쳐야 했던 제4차 총회를 거치며, 히나는 열성부원들이 자신을 섬기는 것이 아니라... 자신이 열성부원들을 섬기게 되었다는 것을 깨달았다."
 GEH.hina.story_event.16.a: "게헨나는 멸망했어야 했어."

 GEH.hina.story_event.17.t: "대게헨나국 헌법"
 GEH.hina.story_event.17.desc: "소라사키 히나는 게헨나를 증오한다. 단순한 농담이나 자조적인 표현이 아니었다. 그녀는 자신이 열성부원들의 광기에 무력하게 휩쓸렸다는 것을 알았고, 열성부원들의 광기 속에서 권력을 내려놓고 열성부원들의 꼭두각시, '인민 대중의 의지'를 상징하는 걸어다니는 프로파간다로 전락했다는 것을 알았다. 히나는 제복을 입고 판데모니움 소사이어티 의회로 들어섰다. 하지만 그녀의 마음은 다른 곳에 있었다. 대전이 이전, 평범했던 게헨나 자치구의 거리. 이런 광기도, 소라사키 히나의 열성부원이라는 정신병자들도, 그리고 파시스트들의 상징이 된 자신도 없었다.\n\n\"히나 의장님.\"\n\"의장이라고 부르지 마. 토악질이 나니까.\"\n\n연단에 오르기 전, 히나는 무심코 아코를 향해 퉁명스럽게 말한 뒤... 씁쓸하게 고개를 저었다.\n\n\"아니. 미안. ...네 잘못이 아닌데.\"\n\"아녜요. 부장님을 잘 보필하지 못하고, 이 광기가 여기까지 다다르도록 아무것도 하지 못한... 저의 잘못이죠.\"\n\n히나는 아코를 바라보았다. 잘못은 오롯이 자신에게 있다. 대중들의 광기에 정면으로 맞서 싸우는 것을 두려워했다. 그래서 열성부원들의 꼭두각시, 단순한 대중의 의지를 표현하는 상징으로서 지금까지 남아 있었던 것 뿐인데. 아코는 그런 자신을 겁쟁이라고 힐난하는 대신 그녀 스스로에게 죄를 돌렸다. 아니. 아코는 아무것도 잘못하지 않았다.\n\n히나는 아코를 꽉 끌어안은 채, 조용히 말했다. 아니야. 너는 아무것도 잘못하지 않았어. 이건 모두 내 죄야. 내가 짊어져야 하는 죄. 히나는 천천히 아코에게서 떨어져, 연단에 올라섰다. 자신을 영원한 영도자이자 절대 독재자로서 선언하는 새로운 헌법의 반포. 히나는 스스로의 목에 밧줄을 거는 심정을 느끼며, 착 가라앉은 목소리로 말했다."
 GEH.hina.story_event.17.a: "본 헌법을 반포한다."

 GEH.hina.story_event.18.t: "청년 게헨나당"
 GEH.hina.story_event.18.desc: "\"청년 게헨나당?\"\n\n이오리는 신문을 넘기며 귀찮다는 듯 말했다.\n\n\"뭐야. 아코쨩이 만든 거야?\"\n\"...그럴 리가 없잖아요. 그 광신도들이 멋대로 만들고 다닌 거예요. 이제 게헨나가 제대로 된 국가가 되었으니, 파벌의 형태로서가 아니라 조직된 정당의 형태로서 게헨나를 통치...\"\n\"귀찮네. 나는 머리 아픈 건 잘 몰라. 어쨌거나 열성부원들 모아놓는 쓰레기통 같은 거라고만 이해하면 되는 거야?\"\n\"네. 뭐... 쓰레기통이죠.\"\n\n아코는 쓰레기통이라는 단어가 그녀들에게 가장 잘 어울린다고 생각했다. 제4차 총회 이후 여러 부서에 파편화되어 있던 게헨나 열성부원들은 '청년 게헨나당'이라는 이름으로 자신들의 조직을 만들기 시작했다. 정당으로 자신들을 조직화하는 것에는 몇 가지 이점이 있었다. 우선 선도부 외부의 일반 사업가들을 당으로 끌어들일 수 있게 되어 파벌을 더욱 크게 확장할 수 있게 되었다는 것. 그리고 무형의 파벌보다는 조직화된 정당이 그녀들에게 더 큰 소속감을 주고, 파벌 내부에서의 위계 질서를 구축하는 데 도움이 된다는 것.\n\n포퓰리스트 정당인 청년 게헨나당은 창당 직후인 지금부터 벌써 게헨나 각지에 지역당을 창당하고, 대중들 사이에서 영향력을 넓혀 가고 있었다. 특별한 이념 없이 '소라사키 히나 정신'을 따른다고 주장하는 게헨나 청년당은, 앞으로 게헨나에서 다양한 대중주의 정책을 실시할 것으로 예상되었다. 물론 거기에 히나의 의지는 없었다. 아코는 히나가 그 정당에 소속되지 않았다는 것을 떠올렸다. 어디까지나 청년 게헨나당에게 있어서 히나는 상징이었다.\n\n히나를 열성적으로 숭배한다고 주장하면서, 히나를 가장 무시하는 자들. 아코는 가벼운 메스꺼움을 느꼈다."
 GEH.hina.story_event.18.a: "하지만, 아코가 할 수 있는 일은 없다."

 GEH.hina.story_event.19.t: "웃으세요! - 1"
 GEH.hina.story_event.19.desc: "\"위대한 조국의 역사에 남을 사진이 될 겁니다. 히나 의장님. 카메라를 보고 웃으시죠.\"\n\n열성부원의 구역질나는 목소리를 들으며, 히나는 카메라 앞에 섰다. 당장에라도 '종막의 디스트로이어'를 두 손에 쥐고, 웃고 있는 저 여자의 얼굴에 연사를 하고 싶은 마음이 울컥 솟아올랐다. 하지만 참았다. 히나는 꼭두각시로서의 삶에 꽤 익숙해져가고 있었다. 찰칵! 게헨나 의회 건물에 걸릴 새로운 '위엄 있는' 히나 사진이 찍혔다.\n\n사진 촬영이 끝난 뒤, 히나는 의회 화장실에서 몇 번이고 토악질했다. 눈물이 나오고, 위장 속이 뒤흔들리는 느낌에 눈이 매워졌다. 이미 게헨나는 자신이 지키고 싶었던 국가가 아니었다. 히나는 열성부원들의 꼭두각시였고, 히나는 온갖 행사에 불려다니며 웃는 얼굴로 '위대한 게헨나의 영도자'를 연기해야 했다. 도대체 무엇을 영도한다는 것인가? 어차피 자신이 서명할 서류를 적어 오는 건 구역질나는 그 '청년 게헨나당'일 뿐인데.\n\n입을 헹구고 나오는 사이, 히나는 가벼운 현기증을 느꼈다. 차라리 자신에게 주어진 권력을 스스로 쥐어야 했다. 독재자가 되고 싶지 않다. 그딴 말랑말랑한 이유로 열성부원들의 얼굴마담이 되는 선택을 하지 말았어야 했다. 차라리 '뇌제'가 되는 길을 택했다면, 저 열성부원들을 모조리 찢어 죽일 수도 있었겠지. 아니. 히나는 그런 생각이 드는 스스로를 증오했다.\n\n권력에 취한 독재자라니. 그것이 하누마 마코토와 무엇이 다른가? 차라리 꼭두각시인 편이 낫다.\n아니. 지금 네 모습이 '하누마 마코토'보다 낫다고? 그건 자기만족이지."
 GEH.hina.story_event.19.a: "두 가지 생각이, 동시에 히나를 괴롭혔다."

 GEH.hina.story_event.20.t: "웃으세요! - 2"
 GEH.hina.story_event.20.desc: "\"위대한 조국, 위대한 게헨나, 위대하지 못한 소라사키 히나.\"\n\n히나는 자신의 신비인 이스보셋에 대해 떠올렸다. 이스보셋은 지구에도 존재하는 단어다. 에스바알(Eshbaal-신의 사람)이라는 이름을 깎아내리기 위해, 이스보셋(Ishbosheth-수치스러운 사람)으로 이름을 바꾸었다고 한다. 수치스럽다라. 그 말이 딱 어울렸다. 히나는 자기 자신이 수치스러웠다. 키보토스에서 가장 강력한 독재자가 된 지금. 그리고 그 거대한 권력이 청년 게헨나당에 있는 지금.\n\n히나는 고개를 돌려, 의회 바깥에서 경찰 병력을 지휘하는 아마우 아코를 보았다. 아코는 최근 많이 지쳐가고 있었다. 실질적인 모든 권력을 청년 게헨나당에 빼앗긴 채, 히나가 가장 소중하게 생각하는 친구인 아코조차도 단순한 중간 관료가 되어버렸다. 아코는 여전히 여러 외교 행사에 얼굴마담으로 나가고 있었지만, 그녀에게 더 이상 실무 결정권은 없었다. 기획부 역시 청년 게헨나당의 입김이 완전히 장악하고 있었다.\n\n실행부는 다를까? 마지막으로 이오리를 만난 것이 언제였는지 기억 나지 않는다. 위대한 청년 게헨나당의 '문민통제' 정책 아래에서 군부는 계속해서 약화되었고, 당의 감시 아래에서 조용히 죽어가고 있었다. 의료부? 말 할 것도 없다. 원래부터 가장 권력이 없었던 부서였으니까.\n\n자신은 그저 게헨나의 질서를 지키고 싶었을 뿐이었다. 열성부원들의 열성 역시 처음에는 게헨나의 질서를 지키기 위해 필요하다고만 생각했다. 하지만 자신은 틀렸다. 히나는 실패했다. 게헨나는 앞으로도 영원 불멸할지 모른다. 하지만 광신도들에 의한 이 독재 정권 아래에서, 탄압받아가는 이들을 보라. 이것이 소라사키 히나가 바라 왔던 아름다운 '질서'인가?"
 GEH.hina.story_event.20.a: "히나는 의회 창문 너머, 굶주린 현지인 시위대가 강경 진압되는 모습을 보았다."

 GEH.hina.story_event.21.t: "웃으세요! - 3"
 GEH.hina.story_event.21.desc: "\"아코. 만약 내가 사직서를 하나 던져놓고 실종된다면 어떨까?\"\n\"...그런 말씀 마세요, 히나 부장님. 부장님이 없어지면, 저는 어떻게 하라고요.\"\n\"...알아. 너를 혼자 두고 어디를 가겠어?\"\n\n히나는 다트를 하나 꺼내, 냉소하듯 집무실의 게헨나 깃발을 향해 던졌다. 다트가 깃발을 정확히 꿰뚫으며 멈췄다. 하나, 둘, 셋. 몇 번이고 히나의 다트가 게헨나 국기를 찢어 가기 시작했다. 이 찢어져가는 깃발이 실제였다면 더 아름다웠을 것이다.\n\n\"하지만, 내가 언젠가 한계에 다다르는 날이 올 거야.\"\n\"...알고 있어요.\"\n\"이제는 어디로 도망치더라도, 열성부원들은 나를 찾아낼 거라 생각해. CCTV가 집무실과 내 자택 근처에 쫙 깔렸으니까. 하늘을 날아가더라도 카메라 하나에는 잡히겠지.\"\n\"...네. 그렇겠죠.\"\n\"그러니까 아코. 내가 이 게헨나라는 이름의 감옥에서 도망칠 수 있는 방향은 아마 하나 뿐이겠지. 아래. 저 지옥으로 가는 거.\"\n\"부장님. ...그 말씀은...\"\n\n히나는 바닥에 떨어진 마지막 다트를 주워, 씁쓸하게 내려다보았다.\n\n\"아코. 만약, 내가 목숨을 끊기로 결심하는 날이 온다면, 그 때... 내 곁에 있어 줄 수 있어? 나와 같이...\"\n\"부장님.\"\n\n아코는 히나의 말을 끊었다. 무어라 말하려는 것처럼 그녀의 입술이 달싹거렸지만, 결국 아코는 고개를 끄덕였다.\n\n\"제가 부장님을 버리고 어디로 가겠어요?\"\n\n언젠가, 그 때가 올 거다. 오늘은 아니겠지만. 그리고 그 날이 온다면. 나는 자유로워질 수 있을 것이다."
 GEH.hina.story_event.21.a: "나는 너희들을 증오한다."

 GEH.hina.story_event.22.t: "파놉티콘 시스템"
 GEH.hina.story_event.22.desc: "한스는 게헨나의 체계화된 공장 감시 시설 아래로 발길을 옮겼다. 그가 한 걸음을 내딛을 때마다, 하얀 빛을 내뿜는 서치라이트가 그가 가야 할 길을 알려주었다. 한스가 볼 수 있는 것은 오직 그에게 지정된 컨베이어벨트로 가는 길 뿐이었다. 게헨나 정부에게 있어서 모든 도이치인들은 예비 범죄자였다. 그리고 그들은 예비 범죄자들에게 많은 정보를 공개하지 않으려 했다.\n\n\"당신들은 증오받는 존재입니다. 당신들은 이곳에서 자신의 죄를 씻고 거듭나도록 노력해야 합니다.\"\n\n파놉티콘의 라디오 방송이 미리 녹음된 방송을 시작했다. 공장은 거의 완벽한 원형으로 이루어져 있었다. 게헨나의 감시자는 원형의 공장 중앙, 모든 장소를 내려다볼 수 있는 중계기구에 있었다. 감시자가 있는 곳은 밝은 빛으로 빛나고 있어, 한스는 그곳을 실수로라도 바라볼 때마다 눈이 타들어가는 고통을 느꼈다. 우리는 감시자가 어디를 바라보고 있는 것인지 알 수 없지만, 감시자는 우리가 어디에서 무엇을 하는지 모든 것을 알고 있었다.\n\n\"한스 마이어. 더 빠르게 손을 움직이십시오. 오늘의 할당량을 충족하십시오.\"\n\n라디오의 부품을 손으로 조립하는 사이, 한스의 머리 위에서 쩌렁쩌렁한 목소리가 울렸다. 아무래도 지금 감시당하고 있는 건 자신이었던 모양이다. 아니. 그런 말은 옳지 않겠지. 이곳에서 감시당하지 않는 사람은 아무도 없을 테니까. 한스는 자신의 감정을 죽이려 노력하며 손을 움직였다."
 GEH.hina.story_event.22.a: "우리는 죄인이다"

 GEH.hina.story_event.23.t: "너희는 존재하지 않는다"
 GEH.hina.story_event.23.desc: "미하일에게 있어서 고등학교는 모순적인 장소였다. 미하일이 제21구 공립고등학교에 들어설 때, 그는 신발장에서부터 흑적금의 발매트를 밟고 학교로 올라야 한다. 미하일이 어떻게 그것이 도이칠란트를 모욕하기 위한 것임을 모르겠는가? 하지만 교실에 들어서는 순간 게헨나인들은 전략을 바꾸고 마는 것이다. 도이칠란트는 모욕의 대상이 아니다. 아예 존재한 적도 없는 개념이다.\n\n아무런 감정도 없는 것 같은 오토마톤 로봇 교사는 교실에 죄수처럼 수납된 도이치 학생들을 향해 매일같이 말한다: 너희는 존재하지 않는다. 도이칠란트라는 것은 이전에도 존재하지 *않았다*. 너희는 위대한 신-조국을 위하여 봉사하는 가구로서 자라날 것이다.\n\n도이칠란트가 존재하지 않는다면 그들은 어째서 미하일에게 도이칠란트의 국기를 밟고 오르게 하는 '의식'을 반복한단 말인가? 존재하지 않는 것을 밟는 것이 가능한가? 그렇다면 방금 미하일이 밟고 들어왔던 그것은 무엇인가?"
 GEH.hina.story_event.23.a: "존재를 부정하라고?"

 GEH.hina.story_event.24.t: "이성 위의 진리"
 GEH.hina.story_event.24.desc: "\"신이 존재하지 않는다면 만들어라도 내라고, 볼테르가 했던 말이 있었지. 당신들은 확실히 볼테르의 가르침을 잘 따르고 있군.\"\n\n카를 융은 냉소적으로 말하며 심문실 맞은편의 심문관을 노려보았다. 실내에서도 선글라스를 쓰고 있는 심문관은 감정을 읽어낼 수 없는 표정으로 융을 바라보고만 있었다. 융이 어디까지 혼자 떠들 것인지 지켜보기라도 할 작정인 것처럼.\n\n그가 움직일 생각이 없다면, 융은 더 마음대로 떠들 생각이다. 융은 심문관을 향해 몸을 조금 앞으로 기울였다.\n\n\"그래. 나는 당신들이 말한 사상죄 위반자로군. 하지만 모든 논문 연구방법에 '경애하는 지도자의 교시에 따르면' 따위를 삽입하게 한 당신들이 먼저 잘못한 것 아닌가? 당신들의 위대한 지도자 히나 씨는 그렇게까지 학자들이 떠받들어 주는 걸 원하는 건가? 프로이트 씨가 살아 있었다면 이렇게 말했겠군. '그녀는 다섯 살 아기가 부모의 칭찬을 바라는 것과 같은 유아기적 단계에 그대로 머무르고 있소.'\n\"마지막 기회요. 전향서를 쓰거나, 아니면 더 모욕적인 발언을 해 보시오.\"\n\"기회를 더 준다니 참으로 고맙소.\"\n\n융은 심문관 앞에서 전향서를 잡아 손으로 찢어버렸다.\n\n\"이게 내 대답이요. 좆까.\""
 GEH.hina.story_event.24.a: "심문관이 손짓하자, 고문 전문가들이 융을 끌어냈다."

 GEH.hina.story_event.25.t: "압류된 미래"
 GEH.hina.story_event.25.desc: "하인리히 카프카는 자신의 네 자녀가 모두 게헨나 당국에 의하여 '압류' 당한 뒤 불안한 하루하루를 보내고 있었다. 게헨나의 새로운 법률에 따라 모든 도이치 아동들은 도이치인 부모에게서 분리되어 3세부터 18세까지 새로운 합숙 시설에서 공동육아를 받아야만 했다.\n\n하인리히는 술집 바텐더인 울리히 앞에 앉아, 힘 없는 목소리로 맥주를 주문했다. 울리히는 생맥주를 잔에 따르며 경멸과 고통이 섞인 목소리로 말했다.\n\n\"이제 뮌헨, 베를린, 프랑크푸르트... 어디에서도 어린아이의 목소리를 들을 수 없게 되었습니다. 당국이 모든 아이들을 보육원에 수용하고 있으니까요.\"\n\"그 아이들은 우리의 아이요. 그들이 어떤 권리로 아버지에게서 자식들을 빼앗아간단 말이요?\"\n\n울리히는 하인리히의 말에 동의하면서도 힘없는 목소리로 말했다.\n\n\"승자의 권리겠지요. 그들은 우리의 자녀들이 다시는 도이칠란트인으로서의 정체성을 갖지 못하게 하려 합니다. 이대로면 한 세대가 지나기도 전에...\"\n\"우리 민족이 사라질 거요.\"\n\n하인리히는 맥주를 건네받으며, 한숨을 내뱉었다.\n\n\"아니. 민족은 중요하지 않소. 나는 그저, 내 아이들이 나를 다시 만났을 때, 내가 누구인지조차 알아보지 못할 것이 두렵소.\"\n\"저도 그렇습니다.\""
 GEH.hina.story_event.25.a: "두 사람은 그 날이 늦을 때까지 울었다"

 GEH.hina.story_event.26.t: "하나를 위하여"
 GEH.hina.story_event.26.desc: "나는 위대한 게헨나의 깃발 아래,\n\n조국과 위대한 지도자를 위하여 나의 육신과 영혼까지\n모든 것을 바치며 봉사할 것을 맹세합니다.\n\n개인이라는 퇴폐적인 개념을 극복하여\n조국을 구성하는 수많은 부품의 하나로서\n행복하게 충성을 다할 것임을 맹세합니다."
 GEH.hina.story_event.26.a: "국민 선서 완료."

 GEH.hina.story_event.27.t: "저항해야 한다"
 GEH.hina.story_event.27.desc: "\"하아, 하아.\"\n\n히나는 잠에서 깨어나며, 등허리가 완전히 땀에 젖는 불쾌한 감각을 느꼈다. 요즘 들어 바알의 속삭임, 이중인격 증상은 점점 '완화'되어가고 있었다. 바알이 히나의 옆에서 말을 걸어 오는 증상은 점점 줄고 있었으니까. 하지만 히나는 자기 자신의 의식까지 '흐릿해지는' 이상한 감각을 느끼고 있었다.\n\n바알과 자신의 의식, 두 가지가 하나로 통합되어가고 있었다. 이중인격이 이런 식으로 치료되는지는 알지 못했다. 그리고 그 끔찍한 바알의 의지가 점점 사라져가고 있음에도 불구하고 히나는 그다지 기쁘지 않았다. 만약 정말로 두 인격이 하나로 합쳐진다면...\n\n거기에서 주도권을 쥐는 인격은 소라사키 히나의 인격인가? 아니면 그 '바알'의 인격인가?"
 GEH.hina.story_event.27.a: "\"물이라도... 마셔야겠어.\""

 GEH.hina.story_event.28.t: "무엇에 저항하는가?"
 GEH.hina.story_event.28.desc: "새벽 시간, 집무실에서 졸고 있던 히나의 곁으로 아코가 다가왔다. 철야 업무 도중 불이 켜진 집무실에 방문해 본 참인데, 예상대로 비몽사몽한 상태로 고개를 끄덕거리고 있다.\n\n'부장님, 이대로는 안 되는데...'\n\n업무량이 늘어나면서 히나의 부담이 상당히 늘어났다. 그리고 요즘 히나는 집에서도 제대로 잠을 자지 못하고 있었고. 아코는 악몽을 꾸고 있는 듯, 이마에서 식은땀을 흘리는 히나를 걱정스럽게 바라보았다.\n\n\"...아침이야?\"\n\n히나의 눈이 순간 뜨였다. 하지만 자신이 아닌 허공을 바라보는 것만 같은 히나의 모습이... 아코는 어째서인지 조금 불안하게 느껴졌다. 눈 앞에 있는 소라사키 히나가 마치 하룻밤 사이 다른 사람이 되어버린 느낌. 그럴 리가 없다는 것을 알면서도 아코는 손바닥이 땀으로 젖어오는 것을 느꼈다. 아니. 히나는 언제나 자신의 히나였다. 다른 사람처럼 된다니 무슨 소리야.\n\n\"아뇨. 아직 새벽입니다.\"\n\"...그래, 새벽. 하지만 내게는 새로운 아침처럼 느껴지네.\"\n\n히나는 살짝 웃으며, 자리에서 일어났다.\n\n\"나약한 쪽의 소라사키 히나가, 방금 죽었거든.\"\n\"...네?\"\n\"아니야. 그냥. 나만 아는 이야기.\""
 GEH.hina.story_event.28.a: "히나는 의미심장하게 웃었다."

 GEH.hina.story_event.29.t: "섬뜩함"
 GEH.hina.story_event.29.desc: "지난 새벽의 대화 이후, 묘하게 요즘의 히나는 건강해진 것 같다. 만성피로가 사라졌고, 다른 선도부원들을 상대로 훨씬 살갑게 대하게 되었다. 하지만 아코는 히나가 *정상적*인 상태가 아니라는 불안을 느꼈다.\n\n사치와 누구보다도 어울리지 않는 그녀가 보석과 비싼 옷들을 사들이기 시작했다. 점점 비싼 와인들이 그녀의 식탁에 오르기 시작했다. 그리고 결정적으로, 현지인들을 부르는 방법이 달라졌다. '명'이 아닌 '마리'로.\n\n게헨나 중앙구의 레스토랑. 레어 스테이크를 썰던 히나가, 아코를 마주보았다.\n\n\"무슨 문제라도 있어, 아코?\"\n\"아니요. 그냥... 히나 부장님이 먼저 이런 레스토랑에 저를 부르실 거라고는 상상도 못 해서...\"\n\"그냥 데이트라고 생각해. 이런 기회, 편하게 오는 것도 아니잖아?\"\n\"데, 데이트...!\"\n\n부끄러워하는 아코의 모습을 보며, 히나는 작게 웃었다.\n\n\"게다가 요즘 나는 기분이 좋거든. 예전의 나라면 동의하지 않았을... 게헨나의 불순물들을 몇 천, 몇 만 마리라도 제거할 수 있는... 깔끔한 해겳법을 고안하고 있어.\"\n\n사랑하는 히나와의 데이트. 그 생각에 두근거리던 아코의 감정은 히나의 한 마디에 순식간에 식어버렸다.\n\n\"깔끔한... 네?\"\n\"불순물들의 반란을 의도적으로 유도할 생각이야. 게헨나에 반대하는 그것들이 기어 나오는 순간, 모두 도축하는 거지. 모두가 죽는다면, 누가 우리의 지배에 저항할 수 있을까?\""
 GEH.hina.story_event.29.a: "부장님, 하지만... 사람을 어떻게 '도축'하나요?"

 GEH.hina.story_event.30.t: "공산당-나치당 동맹"
 GEH.hina.story_event.30.desc: "공산당 지하 집회장에 아돌프 히틀러의 연인이었던 에바 브라운이 들어왔을 때, 공산당원들은 야유 대신 환호성을 외쳤다. 브라운은 먼지 쌓이고 퀴퀴한 지하 연단에 오르는 동안 지치고 다친 공산당원들의 모습을 보았다. 그들은 히틀러의 적이었지만 브라운은 공산주의자들에게 적의가 아닌 동료애를 느꼈다. 이 게헨나의 밑바닥에서 그들은 모두 도축을 기다리는 짐승일 뿐이었으니까.\n\n\"존경하는 동료 시민 여러분. 저는 정치인이 아닙니다. 정치에 대해서도 모르고, 국가사회주의와 일국사회주의의 차이도 알지 못합니다. 하지만 중요한 것은... 우리는 게헨나의 압제 아래에서 노예가 되고 있다는 것입니다.\"\n\n에바는 연설을 미리 적어오지도 않았음에도, 알베르트 슈페어를 비롯한 '대전이' 이후의 NSDAP 생존자들과 도이칠란트 공산당 당원들 앞에서 열정적으로 연설을 이어갔다.\n\n\"게헨나를 몰아낸 뒤, 여러분과 국가사회주의노동자당은 다시 적이 될 것입니다. 하지만... 우리는 적어도 인간 대 인간으로서 싸우게 될 것입니다. 하지만 게헨나는 우리를 같은 인간으로도 보고 있지 않습니다. 그들은 우리의 자녀를 빼앗아갔습니다. 우리의 노동자들은 강제 수용소와 같은 환경에서 일하고 있습니다.\"\n\n파놉티콘, 새로운 '게헨나 말살' 교육... 공산주의자들은 에바의 말에 주먹을 강하게 쥐었다. 분노. 형제애. 그런 감정들이 공산주의자들과 파시스트들 사이에서 공명하듯 울렸다. 그 감정을 터트리듯이, 브라운이 말했다."
 GEH.hina.story_event.30.a: "\"우리는 노예가 되지 않을 것입니다. 함께 투쟁해... 자유를 되찾을 것입니다!\""

 GEH.hina.story_event.31.t: "자유의 투사"
 GEH.hina.story_event.31.desc: "알베르트 슈페어는 자신이 자유주의자라거나 혁명가라고 생각하지 않았다. 그에게 있어서 슈페어의 이념은 그 두 가지 모두를 초월한 무언가였다. 오랜 친구인 아돌프 히틀러와의 우정.\n\n\"게헨나는 붕괴해야만 합니다. 이 도이칠란트 땅이 도이치인들에 의해 통치되기 위하여.\"\n\n슈페어는 공산당 지도자 에른스트 텔만에게 직접 담뱃불을 붙여 주었다. 텔만은 연기가 피어 오르는 담배를 한 모금 빨았다. 두 사람은 서로 좋은 사이는 아니었지만, 적어도 오늘만은 친구였다.\n\n\"당신이 식민지의 민족자결주의를 외치는 날이 올 줄은 몰랐소.\"\n\"상황이 이렇지 않습니까? 도이칠란트가 식민지가 아니었더라면 모를까. 식민지 노예가 주인에게 약육강식을 외칠 수는 없는 법이지요.\"\n\"하하! 하기사, 정책이란 상황에 따라 달라지는 법이기는 하지.\"\n\n담배를 다시 한 번 깊이 들여마셨다 뱉은 뒤, 텔만은 슈페어를 마주보았다.\n\n\"도이칠란트의 자유를 위해 우리는 가용할 수 있는 모든 인력을 동원할 생각이오. 당신들은 얼마나 많은 인력을 댈 수 있겠소?\"\n\"최대한 많이. ...정면으로 그들과 상대할 수는 없지만, 도시를 점령하고 노동자들을 해방해 그들과 함께 수도를 빠르게 장악한다면, 전국의 도이치인들이 봉기할 것이요.\""
 GEH.hina.story_event.31.a: "\"승리를 위하여.\""

 GEH.hina.story_event.32.t: "사냥"
 GEH.hina.story_event.32.desc: "아마우 아코는 히나의 소위 '서류뭉치'라는 쓰레기들을 세절기에 처넣어버리고 싶은 욕망을 느꼈다. 아코가 히나가 내려보낸 공문에 이런 메스꺼움을 느낀 것은 이번이 처음이었다. 히나는 의도적으로 공산주의자들과 파시스트들의 봉기를 유도하려 하고 있었다. 현지인들에 대한 폭력적 시위 진압과 재산 강탈 등을 특정 지역에 집중해 시위와 반란을 일으킬 지역을 선별한다. 그리고 그 지역의 치안 유지 병력을 축소해 반란이 처음에 성공하는 것처럼 보이게 한다.\n\n그 뒤, 반란군과 반란군에 합류하지 않은 인력이 구분된 이후 반란분자에 대한 대규모 말살 작전을 시작한다. 도시가 파괴되고, 이 과정에서 죽게 될 인원이 얼마인지는 상상할 수도 없을 정도였다. 게헨나의 소위 열성부원들은 이 놀라운 작전으로 도이칠란트의 반란분자들이 다시는 조직적 반란을 저지르지 못할 정도로 약화될 것이라고 믿었다.\n\n실제로도 그럴 것이다. 너무도 많은 인원이 죽게 될 테니까. 하지만 이것이 소라사키 히나의 방법인가? 아니다. 대전이 이후부터 무고한 이의 죽음을 최소화, 아니. 완전히 배제하고자 했던 것이 히나 아닌가? 이 계획이 정말로 반란군만을 죽게 할 것인가? 몇 개의 도시가 초토화 될 것을 가정하고 있지 않은가?\n\n\"...히나 부장님. 이건 아니에요.\"\n\n아코는 소심하게 히나에게 항변했다. 히나는 그런 아코에게 무심하게 한 장의 서류를 내밀었다. 사직서. 이 계획이 싫다면 나가라는, 무엇보다 무거운 대답. 그 대답 앞에서 아코가 더 무슨 말을 할 수 있겠는가?"
 GEH.hina.story_event.32.a: "비극이 기다린다"

 GEH.hina.story_event.33.t: "오늘의 게헨나"
 GEH.hina.story_event.33.desc: "오늘의 게헨나는 평소보다도 맑고 쾌청하다. 공군 비행기가 하늘을 날아오르고, 도시에 대규모 폭격이 이루어진다는 소식이 들리고 있었지만 지랄맞게도 평화롭기만 하다. 인터넷에서도 텔레비전에서도 라디오에서도 신문에서도 아무런 소식도 들리지 않는 행복한 하루다.\n\n\"... 나는. 왜... 아무것도 하지 못하고...\"\n\n아코는 벽에 머리를 처박은 채, 눈을 질끈 감았다. 작전은 시작됐다. 게헨나 지방 각지에서 반란이 일어나고 있다. 그리고 미리 대기 중이던 군대가 이동했다. 게헨나 전체가 피로 물들어가고 있는 가운데서도 이곳은 끔찍할 정도로 평화로웠다. 아니, 이것을 평화라고 말 할 수 있을까?"
 GEH.hina.story_event.33.a: "아코는 자리를 박차고 나왔다"

 GEH.hina.story_event.34.t: "반란 진압"
 GEH.hina.story_event.34.desc: "히나는 게헨나 각지에서 들려오는 소식들을 들으며 평화롭게 눈을 감았다. 아니, '바알'이라고 해야 할까. 나약한 쪽의 자신이 죽어버린 이후에는 더 이상 자칭하지 않는 이름이었지만. 바알은 자신의 인격이 탄생하게 된 이유를 히나의 나약함에서 찾았다. 예전부터 소라사키 히나는 모든 문제를 *이렇게* 처리하고 싶었다. 게헨나의 질서를 어기는 모든 것들을 죽여서 깔끔하게 정리.\n\n하지만 그것을 실천으로 옮길 용가기 없었기 때문에 끝없이 망설였고, 계속해서 괴로워만 하고 있었다. 그래서 진정한 지도자인 자신이 히나의 속에서 태어났다. 바알은 레코드판에서 들려오는 재즈 음악 소리에 귀를 기울이며 각지에서 전송되는 '반란 진압' 소식들을 바라보았다. 역시. 자신이 히나가 되는 편이 훨씬 효율적이지 않은가.\n\n\"히나 부장님.\"\n\n바알은, 아니. 소라사키 히나는 집무실에 들어오는 아코를 보았다. 선임행정관을 상징하는 권총인 핫 샷의 총구가 자신을 향하고 있었다. 아코는 울면서도, 총구를 히나의 미간에 정확하게 겨눈 채 외쳤다.\n\n\"이런 반윤리적인 짓거리는 게헨나의 방식이 아닙니다. 트리니티 고문기술자들도 이딴 짓거리를 고안하지는 않았을 겁니다. 당장 철수 명령을...!\"\n\"아코. 너는 정말 그 핫 샷 하나로 나를 제압할 수 있을 거라고 생각하는 거야?\"\n\n히나는 자리에서 일어나, 총구를 겨눈 아코를 향해 천천히 다가갔다. 아코는 히나가 자신의 바로 앞까지 다가올 때까지 방아쇠를 당기지 못했다. 히나는 살짝 핫 샷을 붙잡아 빼앗은 뒤, 그녀의 손 위에 다시 올려주었다. 아코는 잠시 멍하니 총을 내려다보다, 이내 오열하며 고개를 숙였다.\n\n아마우 아코가 어떻게 소라사키 히나에게 방아쇠를 당길 수 있겠는가? 이것 역시 쿠데타였지만, 히나는 이런 용기 있는 아코가 싫지 않았다. 히나는 아코의 어깨를 토닥여주었다. 이것 역시 '반란 진압'의 일부였다."
 GEH.hina.story_event.34.a: "\"아무 일도 없었던 거야. 아코. 이제 돌아가서, 도축 작전 서류 정리부터 하도록 하자.\""

 GEH.hina.story_event.35.t: "바알의 왕좌 - 1"
 GEH.hina.story_event.35.desc: "대게헨나국이여, 영원하라. 소라사키 히나는 모든 반란군을 무찌르고, 도이칠란트에는 완전한 평화가 찾아왔으니. 하지만 한 가지 의문점은 남아 있었다. 바알을 자칭한 자신이 태어난 이유 - 그것을 알게 된 것은 우연한 기회 덕분이었다.\n\n\"...테러화?\"\n\n게헨나의 고서관 구석에 처박혀 있던 책. 거기에 적힌 신비의 반전에 대한 이야기들은 자신의 탄생 이유를 찾아 헤매던 히나에게 흥미로운 정보를 알려주었다. 바알은 단순한 히나의 이중인격이 아닌 그녀의 신비의 다른 측면이었다. 그리고... 자신이 신체의 주도권을 쥔 순간, 히나의 '반전'이 이루어진 것이다.\n\n\"신비의 반전이라, 그러니까... 단순한 정신병으로 태어난 존재는 아니라는 거네. 재미있게도.\"\n\n나약한 쪽의 히나가 그 사실을 더 빨리 알았더라면 바알을 제거할 수 있는 방법을 찾아냈을까? 이제 와서는 알 수 없는 일이다. 히나는 도서관에서 찾은 그 책의 정보를 기록한 뒤, 다른 사람이 읽을 수 없도록 파기했다.\n\n중요한 것은 이제 자신이야말로 유일한 진짜 소라사키 히나이며, 히나가 게헨나의 유일무이한 지도자라는 것 뿐이었다. 그 이상으로 무엇이 필요하겠는가?"
 GEH.hina.story_event.35.a: "나는 승리자다"

 GEH.hina.story_event.36.t: "바알의 왕좌 - 2"
 GEH.hina.story_event.36.desc: "\"히나 부장님? 따뜻한 커피 한 잔, 준비되었습니다. 후후.\"\n\n아코는 희미한 미소를 지으며 머그컵을 내려놓았다. 히나는 여유로운 미소를 지으며 그 머그컵을 살짝 들어올려 한 모금 마셨다. 아코는 자신이 히나를 죽이려고 들었다는 그 사실을 잊어버린 것처럼 행동했다. 자기방어기제로 인한 것일까? 그게 아니라면 절망감 때문에 그녀도 한 번 부서진 것일까? 거기까지는 관심이 가지 않았다.\n\n아코는 더 이상 히나의 모든 정책을 거부하지 않게 되었다. 심지어 게헨나 현지인들에 대한 광범위한 '청소'조차 부드럽게 받아들이게 되었다. 요즈음에는 히나와 아코가 사귀고 있는 것이 아니냐는 이야기도 종종 나오고 있을 정도로 두 명의 사이는 친밀해지고 있었다. 아마 몇 년 이내에 그 소문은 사실이 될 것이었고.\n\n게헨나는 어느 때보다도 완전해지고 있었다. 질서는 바로 잡혔고 범죄율은 매번 사상 최저치를 기록하고 있었다. 파시스트와 공산주의자들은 더 이상 유의미한 수준의 저항을 벌이지 못했다. 외국으로 도망친 알베르트 슈페어가 선동을 이어가고 있다는 정보는 있지만 이제 더 이상 도이칠란트에 유의미한 저항의지를 불러일으킬 능력은 없었다.\n\n선도부, 게헨나 사회 그 모든 것이 완전함을 향해 나아가고 있었다. 히나는 내면의 평화를 느끼면서 머그컵을 살짝 들어올렸다. 이제 남은 것은 자신의 평화 뿐이다. 커피 한 잔의 여유."
 GEH.hina.story_event.36.a: "미래는 밝다"

 GEH.hina.story_event.37.t: "바알의 왕좌 - 3"
 GEH.hina.story_event.37.desc: "\"게헨나는 지옥이야. 아니, 지옥을 게헨나라고 부르는 건가?\"\n\n히나의 집무실 아래층. 이오리는 극비 자료로 다뤄지는 사망률 지표를 보았다. 게헨나계를 제외한 현지인 사망자 숫자는 매달 무서울 정도로 치솟고 있었다. 경범죄만으로도 길에서 즉결 처형이 이루어지는 사회. 인간이 아닌 가축이나 가구로 대우되며 공장에서 죽을 때까지 소모품으로 쓰이는 사회.\n\n이오리가 원하던 질서와 규율이 이런 것이었던가? 최근에는 아코쨩마저도 이 '질서'에 순응하기 시작한 것처럼 보였다. 아코쨩은 적어도 이 광기를 거부할 거라고 생각했는데.\n\n\"히나 부장의 본성이 이랬던 건지, 아니면 대전이라는 상황이 부장을 돌아버리게 만든 건지...\"\n\n군부의 일인자인 이오리에게도 이런 기밀 정보에 대한 접근 권한은 매우 제한적으로만 주어진다. 치솟아 오르는 사망자 도표 너머 통계를 읽으려던 이오리는 대부분의 통계 자료가 검게 먹칠된 것을 확인했다. 어느 지역에서 얼마만큼의 인원이 어떤 이유로 처형되었는가. 그 구체적 자료는 알 수 없었다.\n\n하지만 먹칠, 먹칠, 먹칠된 이 종이 너머에 있을 무수한 숫자들... 이오리는 그 숫자를 상상하는 것만으로도 메스꺼움을 느꼈다. 게헨나가 살아나기 위해 도이칠란트는 죽어가고 있었다. 그렇다면 우리가 마치 이 땅의 기생충이 된 것 같지 않은가. 숙주의 피를 빨고, 숙주를 죽어가게 만들어야 살아갈 수 있는 생물. 아니. 기생충이 '된 것 같은' 게 아니지.\n\n\"우리는 기생충이야. ...기생충을 만든 거야.\""
 GEH.hina.story_event.37.a: "서류를 덮는 순간, 이오리는 이 완벽한 질서에서 고독과 고통을 느꼈다."

 GEH.hina.story_event.38.t: "열등민족"
 GEH.hina.story_event.38.desc: "\"도이칠란트인들이 게헨나인에 비하여 더 단순한 노동에 종사하고, 더 낮은 임금을 받는 것은 엄밀히 말해 차별이라고 볼 수 없습니다.\"\n\n비글 머리를 가진 개 수인 와타나베가 여유롭게 카메라 화면을 향해 손가락을 흔들었다. 그의 가슴에 달린 '인권 전문가'라는 명패가 방송국 스튜디오의 카메라 아래에서 반짝거리며 빛났다. 와타나베는 마치 눈앞에 도이치인들이 있기라도 한 것처럼 냉소적인 미소를 지었다.\n\n\"도이치인들은 스마트폰이 어떠한 구조로 돌아가는지, 그리고 인터넷, 팩스, 원자력, 그 모든 것에 대해 아무것도 알지 못합니다. 우리 게헨나인들은 마치 어린아이를 보호하는 부모와 같은 심정으로 그들을 위험한 새 사회에서 '분리'하고자 하는 것입니다.\"\n\"분리라고 한다면, 차별이 아니라는 말씀이시군요?\"\n\"그렇습니다. 분리되나 동등하게 대우하는 것이 신 게헨나의 의지입니다. 저는 그들이 게헨나의 깃발 아래에서 문명을 얻고, 암흑 세계에서 벗어날 날이 오리라고 믿습니다. 그리고 그 때가 된다면 도이치인들도 문명인으로서 우리와 같은 대우를 받게 될 것입니다.\""
 GEH.hina.story_event.38.a: "아주 긴 시간이 걸리겠지만요."

 GEH.hina.story_event.39.t: "계획적 후진화"
 GEH.hina.story_event.39.desc: "게헨나 정부가 고의적으로 도이치인들에게 법적인 차별이나 규제를 가한 것은 아니었다. 계획적 후진화는 아주 조심스럽게, 그리고 법적인 행동 없이 자연스럽게 일어났다. 도이치인들의 마을에 오는 열차의 배치 숫자가 점점 줄다가, 어느 순간부터 열차가 오지 않게 되었다. 마을의 병원들은 하나 둘 축소되었다. 도이치어 라디오 방송이 축소되었고, 기름 가격이 몇 배로 올라가면서 도로에 자동차가 보이지 않게 되었다.\n\n늙은 도이치 노인이 창문 너머로 도이치 마을을 오가는 마차를 발견하였을 때, 그 노인은 비로소 깨달았다. 게헨나는 도이칠란트 전체를 차츰 중세 이전으로 회귀시켜, 그 어떠한 변수가 일어난다 하더라도 게헨나의 정치적, 경제적 패권을 잡지 못하도록 하려 한다는 것을.\n\n아직 게헨나 새 정권 수립에 협조한 도이치인들에게는 이 계획적 후진화가 적용되지 않고 있다. 그렇기에 모든 도이치인들이 전근대 문명으로 떨어진 것은 아니었다. 하지만 언제까지 게헨나의 자비가 남아 있을 수 있을까? 다음 세대? 아니면 그 다음 세대?"
 GEH.hina.story_event.39.a: "노인은 창문에 커튼을 쳤다."

 GEH.hina.story_event.40.t: " "
 GEH.hina.story_event.40.desc: "내 학교 공책 위에\n내 책상과 나무들 위에\n눈발이 쌓인 모래 위에\n당신의 이름을 씁니다\n\n내가 읽은 책의 페이지 위에\n온통 하얀 페이지 위에\n돌, 피, 종이 또는 재 위에\n당신의 이름을 씁니다\n\n황금빛 이미지 위에\n전사의 무기 위에\n왕의 왕관 위에\n당신의 이름을 씁니다\n\n밀림과 사막 위에\n둥지와 가시덤불 위에\n내 어린 시절의 메아리 위에\n당신의 이름을 씁니다\n\n내 모든 푸른 목도리 위에\n햇살 젖은 습지 위에\n달빛이 살아 숨 쉬는 호수 위에\n당신의 이름을 씁니다\n\n들판 위에, 지평선 위에\n새들의 날개 위에\n그리고 그림자의 풍차 위에\n당신의 이름을 씁니다\n\n(...)\n\n그리고 단 하나의 단어를 원하기에\n나는 다시 삶을 시작합니다\n당신을 알기 위해 태어났기에\n당신의 이름을 부르기 위해 태어났기에\n\n자유.\n\n"
 GEH.hina.story_event.40.a: "Paul Éluard, 'Liberté'"

 GEH.hina.story_event.41.t: "나는 강한 사람이 아니야"
 GEH.hina.story_event.41.desc: "\"...무슨 말씀이신가요?\"\n\n높은 탑, 마치 히나를 안으로 가두어 두는 것 같은 집무실에서, 소라사키 히나는 손에 쥐고 있던 펜을 내려놓았다. 히나는 자신이 더 이상 홀로 견딜 수 없다는 것을 깨달았다. 다른 추종자들이 그녀를 어떻게 생각하던간에, 히나는 타카나시 호시노 같은 강인한 사람이 아니었다. 많은 추종자들이 히나를 철인 독재자라고 믿고 있었지만, 아니. 히나는 한 번도 철인이었던 적이 없었다.\n\n히나는 인정하기로 했다. 그녀는 강한 사람이 아니었다. 다른 인격 '바알'이 어째서 나타났는가? 왜 수많은 정신병 중 소라사키 히나는 이중인격에 시달리게 되었는가? 초인이 아닌 그녀가, 무리하게 초인을 연기해야 했기 때문이다. 그리고, 평범한 한 사람인 히나는, 그저 게헨나의 질서를 지키는 것만으로도 벅찼던 지친 그녀는, 모든 것을 내려놓고 영원히 *편안해* 지라고 속삭이는 그 초인 바알의 존재가 메스꺼웠다.\n\n그녀가 강한 존재일지 모른다. 그녀에게 모든 것을 맡긴다면, 자신보다 더 유능하게 게헨나를 통치할 수 있을 것이다. 하지만 히나는 그러하지 않을 것이다. 자유의지 같은 고차원적인 이유 때문은 아니었다. 그저, 강하지 않은 자신이 초인을 연기한다는 것 자체가, 스스로에게 거짓말을 하는 것처럼 느껴졌으니까.\n\n그렇기에, 히나는 아코의 손목을 꼭 잡아 끌어당겼다.\n\n\"나는 강한 사람이 아니야.\"\n\n히나는 다시 한 번 말했다. 마치 아코가 자신의 말을 듣지 못하기라도 한 것처럼. 영혼의 제관이 흔들리고, 바알의 비웃음은 멀리 사라지다 흐릿해졌다. 소라사키 히나는 자신의 나약함을 인정했다. 그것이 차라리 거짓 속에 살아가는 것보다 나았으니까. 그것이 소라사키 히나의 자유롭고, 순수한 본질이었으니까."
 GEH.hina.story_event.41.a: "\"아코. 나를, 도와줘.\""

 GEH.hina.story_event.42.t: "나약함을 받아들이듯"
 GEH.hina.story_event.42.desc: "\"누구에게나 숨기는 것은 있는 법이죠. 히나 부장님의 이중인격이라거나, 스스로를 나약하다고 생각하셨다는 점이나. ...네. 히나 부장님은 타카나시 호시노가 아녜요. 전임 학생회장이 죽은 뒤에도 혼자 아비도스를 지키겠다고 조력자 하나 없이 학원에 남아 버티던 그 사람처럼 행동하실 순 없겠죠. 근데.\"\n\n탁, 소리를 내며 아코는 히나의 책상을 손바닥으로 내리쳤다. 평소 히나 앞에서 보이지 않는 돌발 행동. 히나는 순간 몸을 움찔했다.\n\n\"아코?\"\n\"...그게 문제가 되냐요? 제가 히나 부장님이 '초인이기에' 좋아하게 된 건 아니잖아요. 부장님은 그저... 히나 부장님으로만 남아 계시면 돼요. 다른 누군가가 될 필요 없어요. 남들이 히나 부장님이 어떤 존재라고 생각하든, 부장님 스스로가 자신이 어떤 존재가 되어야 한다고 생각하든 다 상관 없어요. 부장님은 변하지 않은 채 남아 주세요.\"\n\n히나가 어떤 존재든, 심지어 그녀가 게헨나의 최강자가 아닌 평범한 소녀였다고 해도 아코는 히나의 곁을 떠나지 않았을 것이다. 아코에게 있어서 중요한 것은 그녀가 '지금의' 올곧은 소라사키 히나에게 반했다는 것이었으니까.\n\n히나는 완벽한 존재-초인-가 되려 노력할 필요가 없었다. 애초에 그럴 수도 없었고. 강한 사람이 아니라는 것이 무엇이 문제인가? 모든 사람은 저마다 자신의 길이 있는 법이었다.\n\n\"저는 히나 부장님이 나아가야 할 길을, 함께 가고 싶어요. 부장님이 강하지 않다면, 제가 곁에 있을게요. 강하지 않기 때문에 무리지어 행동한다. 그게 사람이잖아요?\""
 GEH.hina.story_event.42.a: "\"그래. ...우리는 사람이지. 울고, 실수하고, 때로는 나약한.\""

 GEH.hina.story_event.43.t: "히나의 상황"
 GEH.hina.story_event.43.desc: "그 날 아코에게 자신의 나약함을 모두 털어놓은 뒤, 바알은 히나의 몸의 주도권을 빼앗으려는 시도를 그만두었다. 소라사키 히나는 초인이 될 수 *없다*. 그 사실을 스스로 받아들이고, 나약한 모습조차 자신의 모습으로 받아들인 것으로. 그 냉혹한 인격은 히나를 (어떤 의미로는) 포기한 것처럼 보였다.\n\n물론 그것과 별개로 정신적인 치료는 받아야 했다. 히나의 개인 주치의로 방문한 현지인 정신과 의사인 카를 융은, 다소 곤란하다는 표정을 지으며 진료 차트에 메모를 이어갔다.\n\n\"솔직히 이야기하자면, 키보토스에서는 '해리성 정체감 장애'나 '이중인격' 따위로 부르는 이 질병은... 지구의 정신의학계에서는 한 번도 보고된 바가 없네. 뭐, 머릿속에서 말을 걸어오는 타인에 대한 이야기야 있었죠. 하지만 그걸 정체감 장애라고 표현하기보다, 우생학자인 블로일러(Bleuler) 선생이 만든 단어인 정신분열증으로 규정짓고 있으니까.\"\n\n\"복잡한 의학적인 설명은 나도 잘 몰라.\"\n\"뭐 간단하게 설명하자면 다음과 같네. 나도 자네만큼이나 바알에 대해 모른다는 거지. 그러나 자네 내면의 바알을 직접 제거하기보다... 자네가 바알을 '만들어 낸' 원인에 대해 논하고, 자네의 정신이 혼탁해진 근본적인 과거의 아픔을 치료하는 심리 상담에 집중할 생각이네.\"\n\"바알을 만들어 낸 원인이라... 내 혐오 때문이겠지. 나를 초인으로 만드려 하는 게헨나의 소위 열성부원들에 대한 증오, 그리고 계속해서 질서를 어지럽히는 도이치 현지인들에 대한 증오. 또, 그 모든 증오에 휘둘리는 나 자신의 나약함에 대한 증오. ...스스로 자각하고 있어.\"\n\"원인을 자각하고 있다면 상담도 편해지겠네.\""
 GEH.hina.story_event.43.a: "융은 희미하게 웃었다."

 GEH.hina.story_event.44.t: "질서 재정립"
 GEH.hina.story_event.44.desc: "히나는 자신의 나약함을 받아들이기로 했다. 그리고, 이전과 달리 더 많은 회의를 시작했다. 열성부원들이 모인 질서부만이 아니라 다른 모든 부서의 간부들을 모은 회의를. 이것은 소라사키 히나가 더 이상 열성부의 광신에 휩쓸리지도, '열성부가 원하는 지도자'로서만 행동하지도 않겠다고 선언하는 것이나 마찬가지였다. 특히 가장 기뻐하는 건 실행부와 질서부 사이의 기묘한 권력 분쟁을 겪고 있던 시로미 이오리였다.\n\n회의가 끝난 뒤, 이오리는 회의실을 나오며 히나의 날개 끝을 툭 쳤다. '대전이' 이전이었어도 하지 않았을, 무엇보다도 스스럼없는 행동이었다. 몇 사람의 질서부 친위대가 격분한 모습으로 홀스터에 손을 뻗었다. 하지만 히나는 손을 들어 그 질서부원들의 움직임을 멎었다. 그리고, 이오리를 향해 웃었다.\n\n\"...하고 싶은 말이라도 있어?\"\n\"뇌제 놀이 시작한 이후, 부장이 처음으로 사람같아 보여서.\"\n\"사람같아 보인다라...\"\n\n히나는 자신의 두 손을 내려다보았다. 확실히, 존재하지 않는 실 아래에서 춤추는 느낌. 그 저주스러운 고통에서 해방된 기분이다. 아코에게 모든 것을 털어놓은 뒤, 히나는 비로소 구원받았으니까. 자신이 완벽하지 않다는 것을 인정하는 것으로, 그녀는 '뇌제 놀이'를 하던 그 어느 때보다도 더 자유로워졌다.\n\n\"...그렇게 보인다면 다행이네. 바로 얼마 전에 사람이 된 참이라서.\"\n\"부장은 참 이해 못 할 소리를 한다니까.\"\n\n이오리는 키득 웃으며 돌아섰다. 그래. 이오리는 자신이 겪었던 고통을 모르겠지. 모르는 편이 나을 것이다. 어차피 이제는 지나간 과거의 일이니까."
 GEH.hina.story_event.44.a: "올바른 질서"

 GEH.hina.story_event.45.t: "온전해지기 위하여"
 GEH.hina.story_event.45.desc: "소라사키 히나는 집무실 창가로 다가갔다. 집무실에서 도이치인들이 사는 거리를 내려다보자, 가벼운 메스꺼움이 느껴졌다. 바알이 계속해서 속삭인 현지인들에 대한 증오. 그들을 말살해야 한다고 속삭이던 바알의 의지. 히나는 이제 바알의 유혹으로부터는 자유로워졌지만, 아직 그녀가 남긴 유산들은 그녀의 머릿속에 상처처럼 남아 있었다.\n\n히나는 도이치인들을 볼 때마다 메스꺼움을 느꼈다. 선도부원들을 볼 때면 '머저리'인 그녀들을 자신이 통제하고 지배해야 한다는, 바알의 저열한 감정이 자신의 것처럼 스멀스멀 올라오고는 했다. 물론 지금의 히나는 그 감정들이 만들어진 것임을 안다. 하지만 지식으로서 아는 것과 행동으로 실천하는 것은 다르다. 지식과 이성으로서 자신의 감정을 쉽게 통제할 수 있었다면 세상에 담배 끊지 못하는 사람은 없었겠지.\n\n그렇기에, 히나는 자신의 만들어진 증오가 녹아내릴 때까지 업무를 나누기로 했다. 도이치인들에 대한 통제는 열성부원들에게 떠넘겼다. 어차피 그들은 아코 같은 가까운 사람들보다는 덜 중요한 사람들이었다. 그리고, 당분간은 선도부 내부 사람들과 만나며 만들어진 우월감을 지우는 것에 집중하기로 했다. 긴 시간이 걸리겠지만, 히나는 조금씩 바알의 영향력을 줄여 나갈 생각이었다."
 GEH.hina.story_event.45.a: "이게 나니까"

 GEH.hina.story_event.46.t: "소라사키 히나 - 1"
 GEH.hina.story_event.46.desc: "\"...뇌제 놀이, 라고. 내가 해 온 일들을 이오리가 그렇게 말하더라고. 독재자처럼 행동하고, 친위대를 끌고 다니고, 이상한 짓거리들을 하고. ...참, 나는 어째서 이렇게나 타락해 있었던 걸까.\"\n\n게헨나의 사격장. 히나는 준비되어 있던 총을 들어 과녁에 대고 쏘았다. 그녀는 최근 점점 '정치인'이 되어가고 있었지만, 놀라운 사격 실력은 조금도 녹슬지 않았다. 지금 당장 대전이 이전 시절로 회귀하더라도 똑같이 선도부장으로서 활동할 수 있을 만큼.\n\n아코는 그런 히나의 모습을 보며 방긋 웃었다.\n\n\"타락하시지 않았어요. 지금도 이렇게 변화하려 노력하고 계시잖아요? 게다가, 선도부장으로서의 능력이 녹슬지 않게 관리도 꾸준히 해 오셨고요.\"\n\"그래도 그 시절의 나와 맞붙는다면 내가 질 걸?\"\n\"후후. 그건 모르는 법이죠. 지금의 부장님이 더 강할지도요?\"\n\n시시한 잡담이었지만 즐거웠다. 가장 친한 친구와 이렇게 시시한 잡담을 주고 받는 일상. 그녀는 바알에 홀려 있는 사이 이 중요한 것을 잊고 있었다. 하지만 이제는 다르다. 히나는 다시 한 번 과녁을 향해 총탄을 쏘았다. 탕-! 시원한 총성과 함께 과녁 중앙에 총탄이 박혔다.\n\n\"역시 부장님! 매번 굉장하세요!\"\n\n이렇게 자신을 지지해주고, 자신의 성공을 자기 일처럼 기뻐해 주는 부관. 아코 행정관이 곁에 있다는 것을 깨달았으니까. 히나는 아코를 돌아보며 희미하게 웃었다. 히나는 이제 더 이상 바알에 지배당하지 않을 것이다. 진짜 소라사키 히나는 나약할지 모른다. 하지만, 자신을 소중하게 생각하는 파트너와 함께 한다면... 히나는 누구보다도 강해질 수 있었다."
 GEH.hina.story_event.46.a: "미래로, 더 밝은 내일로"

 GEH.hina.story_event.47.t: "소라사키 히나 - 2"
 GEH.hina.story_event.47.desc: "\"...히나 부장이 최근 많이 나아지긴 했는데. 솔직히 정치는 더 못하게 된 것 같아.\"\n\n이오리는 투덜거리며 도이칠란트 시골 마을로 발걸음을 옮겼다. 도이치인들에 대한 새 게헨나 정권의 의도적인 민족 탄압과 차별 정책으로 인해, 마을은 거의 중세 수준으로 낙후되어 있었다. 거리에는 이동 수단으로 말이 부활했고, 공립학교가 전부 사라진 탓에 어린 아이들은 자신의 이름도 쓰지 못했고, 숫자 역시 1에서부터 10까지밖에 세지 못했다. 이오리는 통나무를 엮어 만든 엉성한 건물을 올려다보았다 - 운터덴린덴 대학교. 건물 입구에는 '영구 폐쇄'라 적힌 푯말에 내걸려 있다. 이오리는 푯말을 무시한 채 대학 건물로 들어섰다.\n\n히나의 추종자들로 이루어진 질서부 요원들은 대학의 모든 책들을 꺼내 불사르고 있었다. 이유는 하나 - 다음 세대 도이치인들의 교육 권리 박탈. 이오리는 그녀들의 행동을 보며 혀를 찼다. 히나의 이중 인격 문제가 해결된 이후에도 도이치인들에 대한 대우는 조금도 나아지지 않았다. 히나는 여전히 도이치인들을 증오했고, 도이치인들에 대한 정책을 전부 질서부에 떠넘겼으니까. 하지만... 이오리는 이것이 옳지 않다고 느꼈다.\n\n\"이게 너희들이 '질서'를 지키는 방식이야? 배우고 싶어 하는 애들을 배우지 못하게 하는 게? ...게헨나 헬멧단들이랑 선도부가 왜 똑같이 놀고 있는 건데.\"\n\n이오리의 빈정거리는 말에, 질서부원 몇 명이 험악한 표정으로 이오리에게 다가갔다. 이오리의 실행부원들이 곧장 앞으로 나가 그녀들과 대치했다. 실행부와 질서부. 둘로 쪼개져버린 군사 조직. 선도부 내부 갈등 역시 개선되지 않았다.\n\n\"여기를 통제하는 건 질서부의 권한이다. 실행부는 돌아가.\"\n\"하, 참. 지가 뭐라도 되는 줄 알고...\"\n\n이오리는 잠시 그녀들을 비웃어 준 뒤, 자신의 소총을 뽑아 들었다. 말 한 마디 듣고 떠날 작정이었다면 대학 분서를 막으러 이곳까지 오지도 않았을 것이다. 같은 군 조직이라도, 계급은 실행부장인 이오리가 훨씬 높았다. 이오리는 실행부 부원들과 함께 앞으로 전진했다."
 GEH.hina.story_event.47.a: "\"닥치고, 책 태우기 멈춰. 이 악당 놈들아.\""

 GEH.hina.story_event.48.t: "소라사키 히나 - 3"
 GEH.hina.story_event.48.desc: "아마우 아코는 이오리가 베를린에서 질서부와 폭력 사태를 벌였다는 보고서를 읽으며 머리가 지끈거리는 것을 느꼈다. 히나 부장의 상태는 분명 호전되고 있었다. 이중인격 증상은 사라졌고, 히나는 자신의 죄악감에서 벗어나 점차 밝은 과거의 성격을 되찾아가고 있었다. 하지만 히나 개인이 아닌, 전게헨나의 국민들의 상태는 악화되어가고 있었다. 히나가 바알의 영향력 아래에서 내린 파놉티콘 시스템은 전혀 철회되지 않았다. 현지인들에 대한 차별 정책은 점점 심해지고 있었다.\n\n\"...하아. 제가 여기서 절망하고 있을 수는 없죠. 히나 부장님의 상태가 호전되시면, 정국은 분명 안정될 거예요. 질서부와 그 쓰레기들도 정리될 거고.\"\n\n아코는 그렇게 자기 암시를 하며 이오리의 폭력 사태 보고서 파일을 닫았다. 게헨나의 상태는 분명 위태롭다. 대전이 이전보다 많은 사람들이 괴롭게 살아가고 있다. 하지만, 아코는 여전히 이 세상에 희망을 가지고 있다. 적어도 소라사키 히나. 아코의 가장 소중한 그 사람은 고통에서 벗어나고 있었으니까. 비록 그녀를 제외한 모두가 지옥으로 빠져들고 있다고 하더라도.\n\n아코는 히나가 언젠가 지옥에 잠긴 나머지를 구원하기 위해 돌아올 것이라고 믿었다. 그리고 그 날이 오면, 분명, 모든 것이 나아질 것이다. 한 걸음씩, 우리는 더 나은 미래를 향해 나아가고 있으니까."
 GEH.hina.story_event.48.a: "부장님이 얻은 자유가, 우리 모두에게 퍼지도록"

 GEH.hina.story_event.49.t: "오직 히나만"
 GEH.hina.story_event.49.desc: "아야카의 방은 성소였다. 그녀의 세계, 그녀의 우주는 오직 한 사람을 중심으로 공전했다. 새로 도착한 소라사키 히나의 피규어를 투명한 장식장 가장 중앙에 조심스럽게 안치하며, 아야카는 만족스러운 한숨을 내쉬었다. 은빛 머리카락의 결, 허리에 달린 칠흑 같은 악마의 날개, 그리고 왕관처럼 기품 있는 네 개의 뿔까지, 신성한 조형미가 아침 햇살을 받아 영롱하게 빛났다.\n\n벽지는 이미 오래전에 그 의미를 잃었다. 사방은 히나의 포스터로 빈틈없이 뒤덮여 있었고, 수십 개의 피규어들이 각기 다른 자세로 그녀의 위광을 뽐내고 있었다. 책장에는 <종막의 구원자, 소라사키 히나의 투쟁 실록>, <질서의 화신, 히나 영도자의 모든 것> 같은 책들이 경전처럼 꽂혀 있었다. 게헨나가 마침내 하나의 질서 아래 재통일된 이후, 이것은 당연한 풍경이 되었다. 선도부장 소라사키 히나는 혼돈의 시대를 끝낸 구원자이자, 살아있는 신이었다.\n\n그녀를 향한 자발적인 숭배는 새로운 종교의 형태로 피어났다. 가족에 대한 애정, 친구와의 우정, 연인 간의 사랑. 그것들은 모두 불완전하고 언젠가는 변질될 유한한 감정일 뿐. 오직 변치 않는 것은 히나 님을 향한 순수한 사랑뿐이라는 사상이 게헨나의 학생들 사이에 성서의 말씀처럼 퍼져나갔다. 아야카는 그 가르침의 가장 독실한 신자였다.\n\n출근을 위해 옷을 갈아입은 아야카는 마지막으로 장식장 앞에 무릎을 꿇었다. 그녀는 두 손을 경건하게 모으고, 시선은 방금 새로 놓은 피규어의 자수정 같은 눈동자에 고정했다. 한 번도 직접 만난 적 없는, 목소리조차 미디어를 통해 들었을 뿐인 존재. 하지만 그녀에게는 세상의 그 어떤 관계보다도 확실하고 유일한 사랑의 대상이었다. 아야카의 입술이 작게 달싹였다. 오늘도 그녀의 유일신에게, 수백 번을 되풀이해도 모자란 사랑을 속삭였다. \"사랑해요, 히나 님.\" 그 고백과 함께, 아야카의 하루는 비로소 완전한 의미를 가졌다."
 GEH.hina.story_event.49.a: "사랑합니다."

 GEH.hina.story_event.50.t: "난 보랏빛이 싫어"
 GEH.hina.story_event.50.desc: "제4차 선도부 총회가 끝나고 이어진 카 퍼레이드는, 소라사키 히나에게 있어 승리의 행진이라기보다는 기나긴 고문처럼 느껴졌다. 느릿하게 나아가는 오픈카 위에서, 그녀는 굳은 얼굴로 정면을 응시했다. 게헨나 중앙구를 가득 메운 인파가 흔드는 보랏빛 게헨나 깃발들의 물결이 시야를 어지럽혔다. 그들은 히나의 이름을 부르짖고, 외치고, 절규했다.\n\n\"히나 님 만세! 만세! 우리의 어버이이신...\"\n\n환호는 기쁨이 아닌, 섬뜩한 광기로 변질되어 있었다. 어떤 시민은 눈물을 폭포수처럼 쏟으며 그녀를 향해 손을 뻗었고, 또 어떤 시민은 아스팔트 바닥을 구르며 광신도처럼 히나의 이름을 찬송했다. 질서와 규율의 상징인 자신이, 이토록 혼란스럽고 괴기한 숭배의 중심에 있다는 사실이 히나를 불편하게 만들었다. 이것은 존경이 아니다. 단순한 광기다. 히나는 저도 모르게 미간을 찌푸렸다.\n\n\"아코.\"\n\n나직한 부름에 옆자리에 앉아 있던 아마우 아코가 즉시 허리를 폈다. 그녀 역시 저 광경이 불쾌하다는 듯 입술을 꾹 다물고 있었지만, 히나의 부름에는 언제나처럼 완벽한 선임행정관의 얼굴로 돌아왔다.\n\n\"네, 히나 부장님.\"\n\"너는 이 꼬라지가... 정상이라고 생각해?\"\n\n히나의 시선은 여전히 인파에 고정된 채였다. 아코는 잠시 망설였다. 솔직히 말해, 그녀 역시 저들의 모습이 역겨웠다. 하지만 히나의 심기를 거스르고 싶지 않았다. 그녀를 향한 충성심의 발로라고, 그렇게 믿고 싶었다. 아코는 애써 미소를 지으며 대답했다.\n\n\"모두가 히나 부장님을 얼마나 존경하고 따르는지 보여주는 것 아니겠습니까. 조금 과격하긴 하지만... 그만큼 부장님의 위광이 대단하다는 증거입니다.\"\n\n그 대답은 히나에게 어떤 위로도 되지 않았다. 오히려 깊은 단절감만을 안겨주었을 뿐. 히나는 더 이상 아무 말도 하지 않고 다시 고개를 돌렸다. 귓가를 찢는 환호성 속에서, 그녀는 서늘한 깨달음에 도달했다. 어쩌면 미쳐가고 있는 것은 저들만이 아닐지도 모른다. 이 광기를 보고도 긍정해야 하는 아코도, 그 광기의 중심에 서 있는 나 자신도, 아니, 나를 둘러싼 이 세계 자체가... 이미 오래전에 미쳐버린 것이 아닐까. 히나는 차가운 눈으로 자신을 향해 울부짖는 군중을 바라보았다."
 GEH.hina.story_event.50.a: "역겨워."

 # 히나 법률 
 GEH.hina.gov_event.1.t: "생각 캐비닛"
 GEH.hina.gov_event.1.desc: "\"생각 캐비닛...?\"\n\n\"그래. 네 머릿속이 하나의 캐비닛이라고 생각해 보는 거야. 너는 형사고, 새로 맡게 된 사건을 수사하고 있는 거야. 자아 탐색이라는 이름의 수사를. ...너는 네가 가진 모든 지식과 사고들을 머릿속의 캐비닛에 보관하고 있어. 그리고 그 중 필요한 지식을 꺼내 내면화하는 거지.\"\n\n\"그 내면화라는 건 뭐지, 바알?\"\n\n\"자아 탐색이라는 수사를 마무리하기 위해서, 너 자신의 생각들을 차례대로 정리하는 거야. 어렵지 않지.\""
 GEH.hina.gov_event.1.a: "글쎄."

 GEH.hina.gov_event.2.t: "내면화"
 GEH.hina.gov_event.2.desc: "나는 생각을 정리했다.\n\n그리고, 잠에서 깨어났다.\n\n그곳에는 여전히 게헨나가 있었다.\n\n꿈 속과 마찬가지로."
 GEH.hina.gov_event.2.a: "어쩌면 이곳이 꿈이고, 그곳이..."

 # 선도부-만마전 공용 이벤트 #

 GEH.GEM.shared_event.1.t: "새해의 아페테리프"
 GEH.GEM.shared_event.1.desc: "\n\n\n                                      £GFX_report_event_GEH_owner_of_suzume £GFX_report_event_GEH_nyaomoto_kan\n\n\n\n\n\n\n1937년의 새해는 냐오모토 푸드의 골목 상권 장악 논란으로 떠들썩합니다. 골목 시장을 지원한다는 명분으로 후원 사업을 하던 냐오푸드의 CEO 냐오모토 칸이 실제로는 자기 업체에서 식자재를 사지 않는 매장들에 상인회장과의 결탁을 통해 직, 간접적인 불이익을 주고 있다는 논란이 나오기 시작했기 때문입니다.\n\n특히 게헨나의 유명 식당인 참새정과 관련된 논란이 점점 커져가고 있습니다. 미식연구회 부장 쿠로다테 하루나는 냐오푸드의 범죄적 행위를 수사하지 않는 게헨나 정부가 사실상 범죄를 용인하고 있다고 비난했습니다.\n\n[ROOT.GetName]의 대응 여부에 대해 많은 사람들이 관심을 보이고 있는 지금, [ROOT.GetLeader]은(는) 참새정에 대한 보호를 선언할 것인지 입장을 밝혀야만 합니다. [GEH.GetNameDef], [GEM.GetNamedef] 두 세력 사이의 갈등  속에서 우리의 선택은 미식연구회와의 협력 관계를 진전시키거나, 또는 미식연구회에게 실패를 유도하여, 그녀들의 사회적 영향력을 억누르는 계기가 될 것입니다."
 GEH.GEM.shared_event.1.a: "하루나에 동조해 참새정을 지지한다."
 GEH.GEM.shared_event.1.b: "애초에 미식연구회의 말을 믿을 가치가 있나?"

 GEH.GEM.shared_event.2.t: "Trip-Trap-Train"
 GEH.GEM.shared_event.2.desc: "\n\n\n                                      £GFX_report_event_GEH_kasumi_kinugawa £GFX_report_event_GEH_ichika_nakamasa\n\n\n\n\n\n\n키누가와 카스미와 온천개발부가 폭탄 테러를 저지르는 것은 이미 일상이지만, 이번에 카스미가 저지른 행동은 일상을 벗어난 황당무계한 대사건이라고 할 수 있습니다. [TRM.GetName]의 나카마사 이치카는 트리니티의 고고학자들이 남키보토스에서 발굴한 유물을 트리니티로 운반하는 업무를 맡던 중, 열차에 난입한 카스미 일행과 맞부딪혔습니다.\n\n테러 혐의로 게헨나 선도부 실행부장 시로미 이오리에게 쫓기던 카스미는 나카마사 이치카가 운반하려던 유물을 빼앗아 이치카에게 선도부를 제거할 것을 '명령'하는 인질극을 벌이다, 혼란스러운 상황 속에서 유물을 파손했습니다.\n\n카스미는 이치카에게 마구 폭행당한 뒤 열차 바깥으로 떨어져 다른 온천개발부원들의 도움으로 도주 중인 상황입니다. 이번 사건에 대해 [GEH.GetNameDef], [GEM.GetNameDef] 두 정부의 대응이 필요합니다. 도망친 키누가와 카스미에 대한 추격에 집중하거나, 아니면 온천개발부와의 우호적 관계를 유지하기 위해 카스미에 대한 추적보다 [TRM.GetAdjective]에의 보상 문제에 치중하거나요."
 GEH.GEM.shared_event.2.a: "유물에 대한 보상을 우선한다."
 GEH.GEM.shared_event.2.b: "도망친 온천개발부에 대한 추적을 우선한다."

 GEH.GEM.shared_event.3.t: "군옥수수 팝니다"
 GEH.GEM.shared_event.3.desc: "\n\n\n                                      £GFX_report_event_GEH_haruna_kurodate £GFX_report_event_GEH_prefect_team\n\n\n\n\n\n\n미식연구회가 벌이는 황당무계한 사건은 한 둘이 아니지만, 최근 일어난 미식연구회의 기행은 [ROOT.GetNameDef] 측을 상당히 당혹스럽게 만들고 있습니다. 대전이 이후 점점 격화되는 게헨나의 폭력조직 첨벙첨벙 헬멧단과 엉망진창 스케반 두 조직의 대규모 교전일에 맞춰, 쿠로다테 하루나 부장은 '폭력 현장 옆에서 군옥수수를 팔아서, 큰 수익을 얻겠다'는 야심찬 포부를 밝히고 옥수수를 대량으로 사들이고 있습니다.\n\n첨벙첨벙 헬멧단과 엉망진창 스케반 두 조직이 [GEM.GetNameDef], [GEH.GetNameDef] 두 조직의 국경선 근처에서 항쟁을 약속한 만큼, 두 조직의 치안 병력이 모두 헬멧단과 스케반을 체포하기 위해 이동할 것으로 보입니다. 문제는 헬멧단, 스케반 외에 쿠로다테 하루나와 미식연구회 역시 체포 대상으로 삼아야 하는지입니다.\n\n미식연구회가 이번 폭력 사태에 직접 개입하지 않았다는 점, 그리고 미식연구회와의 관계를 우호적으로 유지하기 위하여 헬멧단과 스케반만을 체포하는 것이 첫 번째 방법입니다. 하지만 미식연구회를 다른 불량 조직들과 함께 모조리 소탕해버릴 수 있는 좋은 기회라는 점에서 쿠로다테 하루나 역시 체포 대상으로 삼아야 한다는 의견이 오가고 있습니다. 선택은 [ROOT.GetLeader]의 몫입니다."
 GEH.GEM.shared_event.3.a: "군옥수수 좀 팔 수도 있지..."
 GEH.GEM.shared_event.3.b: "모두 체포해. 쿠로다테 하루나도."

 GEH.GEM.shared_event.4.t: "의사당 밑에 온천이 있다고?"
 GEH.GEM.shared_event.4.desc: "\n\n\n                                      £GFX_report_event_GEH_kasumi_kinugawa £GFX_report_event_GEH_pandemonium_society\n\n\n\n\n\n\n오늘은 판데모니움 소사이어티의 의사당을 새롭게 개장하는 공사가 완료되고, 신 의사당의 개관을 공표하는 행사가 [GEM.GetLeader]의 축사와 함께 실시될 예정이었습니다. 하지만 그 행사는 의사당 건물 앞에서 대규모 온천 발파를 터트린 키누가와 카스미의 테러 활동으로 전면 중단되었습니다. 키누가와 카스미는 '의사당 건물 밑에 온천수가 있었다'고 주장하며 현장에서 도주했습니다.\n\n카스미의 테러는 의사당 건물에 큰 부수적 피해를 입혔습니다. 그 뿐만이 아니라 의사당 지하에서 올라온 온천수가 이상한 현상을 일으키고 있습니다. 게헨나 중앙구 각지에서 온천수로 만들어진 음식들이 거대화되어 날뛰고 있다는 당혹스러운 보고가 잇따르고 있습니다. 소위 '팬짱'이라고 불리는 건물 크기의 초대형 팬케이크는 녹색 각질과 보라색 촉수를 이용해 도이치 현지인들과 키보토스계 인구 다수를 살상하였습니다. 처음에는 우시마키 주리가 주도적으로 거대 팬짱을 만들어 낸 것으로 의심되었으나, 우리는 그것이 게헨나 지하에서 올라온 온천수가 음식물에 닿아 벌어지는 기묘한 사건임을 확인했습니다.\n\n[GEM.GetNameDef], [GEH.GetNameDef] 두 세력이 게헨나 중앙구를 불태우는 혼란 사건에 공동 대응을 시작했습니다. 문제는 키누가와 카스미와 거대 팬짱, 둘 모두가 게헨나인들에 대한 중대한 위협이라는 점입니다. 카스미를 체포하는 것에 우선한다면 팬짱이 더 오랜 시간 날뛸 것이며, 팬짱 사살에 집중한다면 그 사이 온천개발부는 지하로 숨어들 것입니다. [ROOT.GetLeader]의 합리적인 결정이 어느 때보다도 중요한 시기입니다."
 GEH.GEM.shared_event.4.a: "팬짱부터 제거해. 그 저주받은 음식..."
 GEH.GEM.shared_event.4.b: "카스미는 감옥에 가야만 한다."

 # 뉴스 #

 GEH_news.1.t: "완전한 규율을 장악한 게헨나 선도부"
 GEH_news.1.desc: "대전이 이후 게헨나에는 나치 당원 조직, 헬멧단 등의 다양한 저항 세력들이 여전히 존재하고 있었습니다 선도부는 지속적으로 이들과 맞서 싸우고 있었으나, 모든 범죄 조직들을 완전히 파괴하는 것은 어려운 일일 것이라고 여겨졌습니다. 하지만 [GEH.GetLeader]의 지도 아래에서 게헨나 치안조직은 마지막 범죄 조직을 해체하면서 게헨나의 규율을 통제했습니다.\n\n물론 여전히 게헨나 사회에는 소규모 헬멧단 조직들이 남아 있지만, 이제 더 이상 [GEH.GetLeader] 체제에 반대하는 조직화된 대규모 범죄 조직은 존재하지 않습니다. 이것은 선도부의 완전한 승리입니다."
 GEH_news.1.a: "우리의 임무는 달성되었다."
 GEH_news.1.b: "게헨나 선도부는 역시 무시무시하네."
 GEH_news.1.c: "키보토스인들의 힘은 계속 커지고 있다..."

 GEH_news.2.t: "게헨나 제1차 선도부 총회 개최"
 GEH_news.2.desc.hina: "원래 게헨나 선도부는 '선도부장이 명령하면 아래는 따르는' 철저한 위계질서를 가진 체제였습니다. 하지만 대전이 이후의 정치적 혼란으로 인해, 선도부는 이례적으로 이전의 전통을 버리고 모든 부서의 중요 선도부원들이 모여 총회를 통해 앞으로의 미래를 결정하기로 결정했습니다.\n\n선도부 총회에서 관료 중심의 기획부와 군경 위주의 실행부 중 어느 쪽도 앞으로의 정책 논의에서 우위를 점하지 못했습니다. 많은 선도부원들은 강인한 모습을 보여주지 못한 간부들에 대한 불신 속에서, 강력한 카리스마를 가진 히나가 혼란을 종식시켜주기를 바랐습니다. 히나는 일단 총회의 주장에 거리를 두고 있지만, 언제까지 지지자들의 요구를 거부할 수 있을지는 알 수 없습니다."
 GEH_news.2.desc.iori: "원래 게헨나 선도부는 '선도부장이 명령하면 아래는 따르는' 철저한 위계질서를 가진 체제였습니다. 하지만 대전이 이후의 정치적 혼란으로 인해, 선도부는 이례적으로 이전의 전통을 버리고 모든 부서의 중요 선도부원들이 모여 총회를 통해 앞으로의 미래를 결정하기로 결정했습니다.\n\n선도부 총회에서 실행부가 내세운 강경책들이 결정되면서, 선도부의 주도권은 관료들이 모인 기획부가 아닌 군부 위주의 실행부로 이동했습니다. 군부가 권력의 중심으로 떠오르면서 만마전은 전통적 경쟁자 선도부의 군국주의화에 예의주시하며 대응을 준비하는 것으로 보입니다."
 GEH_news.2.desc.ako: "원래 게헨나 선도부는 '선도부장이 명령하면 아래는 따르는' 철저한 위계질서를 가진 체제였습니다. 하지만 대전이 이후의 정치적 혼란으로 인해, 선도부는 이례적으로 이전의 전통을 버리고 모든 부서의 중요 선도부원들이 모여 총회를 통해 앞으로의 미래를 결정하기로 결정했습니다.\n\n선도부 총회에서 기획부가 내세운 온건책들이 결정되면서, 선도부의 주도권은 관료들이 모인 기획부가 장악했습니다. 아마우 아코는 총회 이후 기술관료들에 의한 통치가 장기적으로 선도부를 더 발전된 국가로 만들 것이라고 자신했습니다."
 GEH_news.2.desc.generic: "원래 게헨나 선도부는 '선도부장이 명령하면 아래는 따르는' 철저한 위계질서를 가진 체제였습니다. 하지만 대전이 이후의 정치적 혼란으로 인해, 선도부는 이례적으로 이전의 전통을 버리고 모든 부서의 중요 선도부원들이 모여 총회를 통해 앞으로의 미래를 결정하기로 결정했습니다.\n\n선도부 총회에서 관료 중심의 기획부와 군경 위주의 실행부 중 어느 쪽도 앞으로의 정책 논의에서 우위를 점하지 못했습니다. 교착 상태에 이르른 회의로 인해 선도부는 급진적 개혁 없이 대전이 이전의 방침을 상황에 맞게 현지에서도 유지해 나가기로 결정했습니다."
 GEH_news.2.a: "미래를 향해 나아가자!"
 GEH_news.2.b: "이 총회는 선도부의 미래를 결정하겠지."
 GEH_news.2.c: "키보토스에서는 군벌도 총회라는 것을 하나?"

 GEH_news.3.t: "게헨나 제2차 선도부 총회 개최"
 GEH_news.3.desc.hina: "제2차 선도부 총회는 지난 제1차 총회에서 결정된 사안들이 더 심층적으로 논의되었으며, 선도부의 정부 개혁에 대한 논의가 진행되었습니다.\n\n소라사키 히나의 완곡한 거절에도 요구하고 제2차 선도부 총회에서 선도부원들은 소라사키 히나에 의한 철인 독재 체제를 계속해서 요구했습니다. 다른 부서들은 히나의 통치에 비해 상대적으로 '무능력한' 조직으로 간주되었으며, 히나의 통치 아래에서만 선도부가 하나로 모일 수 있다는 공감대가 형성되었습니다.\n\n결국 히나는 선도부원들의 열성을 받아들이기로 결정하였고, 선도부는 히나 개인에 충성하는 철인 독재 체제로 재정비된 것으로 보입니다."
 GEH_news.3.desc.iori: "제2차 선도부 총회는 지난 제1차 총회에서 결정된 사안들이 더 심층적으로 논의되었으며, 선도부의 정부 개혁에 대한 논의가 진행되었습니다.\n\n시로미 이오리와 그녀를 중심으로 한 실행부는 군국주의적 프로파간다를 통한 만마전에 대한 적대적 정책을 요구하고 있습니다. 선도부를 병영국가화하려는 그녀의 열성적인 주장이 총회에서 가결되었으며, 이에 반발하는 기획부의 기술관료들이 총회 도중 대거 퇴장하는 등 작은 충돌도 일어났습니다.\n\n히나는 총회의 결정에 따라 선도부의 병영국가화 정책을 동의하였으나, 이 결정으로 인해 선도부에 대규모 전쟁이 다가오고 있다는 불안감도 퍼지고 있습니다."
 GEH_news.3.desc.ako: "제2차 선도부 총회는 지난 제1차 총회에서 결정된 사안들이 더 심층적으로 논의되었으며, 선도부의 정부 개혁에 대한 논의가 진행되었습니다.\n\n아마우 아코와 그녀를 중심으로 한 기획부는 소라사키 히나 개인에게 집중된 권력 구조를 중점적으로 비판했습니다. 아코는 선도부 체제가 히나 개인을 '학대'에 가깝게 몰아붙이고 있으며, 기술관료들에 의한 과두제가 실시되어야 한다고 주장했습니다.\n\n히나는 자신의 권력을 크게 축소하는 이 결정을 승인하였으나, 이에 반발하는 일부 실행부원들이 아코에게 성적인 비난을 퍼부으며 회의장을 집단으로 빠져나가면서 총회는 혼란 속에서 종결되었습니다."
 GEH_news.3.desc.generic: "제2차 선도부 총회는 지난 제1차 총회에서 결정된 사안들이 더 심층적으로 논의되었으며, 선도부의 정부 개혁에 대한 논의가 진행되었습니다.\n\n히나의 업무 부담을 줄이기 위하여 기술관료들에 의한 새로운 과두제를 실시해야 한다는 아코의 주장과, 실행부를 중심으로 선도부를 병영국가화해야 한다는 이오리의 주장은 평행선을 이루었습니다. 제2차 선도부 총회는 어떠한 결론도 내리지 못한 채 마무리되었고, 모두가 불만족스러운 교착 속에서 현재의 체제를 유지하기로 결정되었습니다."
 GEH_news.3.a: "이것이 우리가 결정한 미래다."
 GEH_news.3.b: "선도부의 미래가 결정되었군."
 GEH_news.3.c: "그들이 내린 선택이 선도부를 어떻게 변화시킬까."

 GEH_news.4.t: "게헨나 제3차 선도부 총회 개최"
 GEH_news.4.desc: "[GEH.GetLeader] 체제의 승리로 인해 게헨나 학원이 선도부 중심으로 재통일되면서 선도부의 미래를 결정하기 위한 새로운 총회가 실시되었습니다. 이번 총회는 재통일된 게헨나의 미래를 결정하기 위한 논의가 중점적으로 이루어졌습니다.\n\n[GEH.GetLeader]은(는) 선도부원들의 지지를 받아 새로 재통일된 선도부장직과 게헨나 의장직을 겸직하기로 추대되었으며, 기존 만마전의 모든 서류들이 선도부로 이전되었습니다. 축제에 가까운 제3차 선도부 총회를 통해, 게헨나의 새로운 미래가 밝아오고 있습니다."
 GEH_news.4.a: "더 규율 잡히고 단결된 게헨나를 위해!"
 GEH_news.4.b: "분열된 게헨나가 다시 한 번 통합되었다."
 GEH_news.4.c: "강력한 경찰국가의 탄생이군."

 GEH_news.5.t: "게헨나 제4차 선도부 총회 개최"
 GEH_news.5.desc: "[GEH.GetLeader] 체제가 안정화되면서, 미래의 게헨나의 방향성을 결정하기 위한 제4차 선도부 총회가 개최되었습니다. 이번 총회에서는 지난 제2차 총회에서 결정된 정책들을 더 확장하기 위한 방안들이 논의되었습니다.\n\n이번 총회는 지금까지의 총회들 중 가장 큰 규모로 진행되었으며, 최초로 언론사들의 총회 내부 취재가 허가되면서 총회 과정이 투명하게 공개되었습니다. 성공적으로 끝난 제4차 선도부 총회를 통해 [GEH.GetLeader] 체제가 게헨나에게 위대한 승리를 가져왔다는 것이 입증된 것 같습니다."
 GEH_news.5.a: "우리는 최고의 총회를 열었다."
 GEH_news.5.b: "게헨나는 계속해서 발전하고 있다."
 GEH_news.5.c: "이제 그들을 막을 국가가 없을 것 같군!"

 GEH_news.6.t: "선도부장직을 사임한 소라사키 히나"
 GEH_news.6.desc.hina: "최근 선도부 내에서 소라사키 히나가 선도부장직을 사임했다는 소문이 퍼지고 있습니다. 소라사키 히나의 완벽한 철인 독재 체제가 완성된 상태에서, 소라사키 히나가 광신도들의 비정상적인 찬양과 그로 인한 압박감을 버티지 못하고 무너져내렸다는 신빙성 있는 이야기입니다.\n\n하지만 선도부는 공식적으로 소라사키 히나의 '사임' 소식은 허위사실이며, 히나 선도부장은 폐렴으로 인해 입원중인 상태라고 발표했습니다. 아마우 아코 선임행정관은 언론 인터뷰에서 자신 역시 히나 부장의 사임에 대해 들은 바가 없다고 말하며, 선도부장의 신자들로 이루어진 친위대의 발표를 기다리는 중이라고 말했습니다."
 GEH_news.6.desc.iori: "갑작스러운 소라사키 히나의 사임은 선도부의 누구도 예상하지 못한 돌발 사건이었습니다. 권력을 잡은 실행부는 이번 히나의 사임과 실종이 '국가 체제에 열성적이지 못한' 매국노들을 향한 실망감에 의한 것이라며 타 부서들을 비난했습니다.\n\n실행부는 군국주의적인 새로운 체제를 정비하기 위하여 기획부 반대파들을 탄압하고 있지만, 소라사키 히나라는 지도자가 사라진 상황에서 시로미 이오리가 이끄는 군국주의 체제가 안정될 수 있을 것인지는 의문점이 많습니다."
 GEH_news.6.desc.ako: "갑작스러운 소라사키 히나의 사임은 선도부의 누구도 예상하지 못한 돌발 사건이었습니다. 특히 히나의 권력을 축소하고 기획부로 이전하는 기술관료 개혁이 많은 타 부서들의 반발을 사고 있었기에, 선도부 내부는 매우 심각한 정치 분쟁에 빠진 상태입니다.\n\n선도부 내부에서 기획부와 정보부, 실행부 선도부원들의 몸싸움이 일어나고 있으며, 아마우 아코의 선도부장직 승계 역시 미뤄지고 있는 상황입니다."
 GEH_news.6.desc.generic: "갑작스러운 소라사키 히나의 사임은 선도부의 누구도 예상하지 못한 돌발 사건이었습니다. 아마우 아코는 히나의 사임은 '히나 부장에게 심리적 부담을 안겨준 우리 모두에 의한 것'이라고 자책하며, 히나에 대한 수색 작전을 실시하겠다고 밝혔습니다.\n\n히나를 수색하겠다는 아코의 발표에도 불구하고, 선도부 내부는 새로운 선도부장이 필요하다는 논의가 진행되고 있습니다. 여러 선도부원들은 아마우 아코가 적임자라고 생각하지만, 아코가 히나를 찾을 수 있다는 희망을 버리지 못하고 있어 권력 이양까지는 시간이 더 필요할 것으로 보입니다."
 GEH_news.6.a: "너무도 비극적이고, 너무도 끔찍하다."
 GEH_news.6.b: "그녀들은 소라사키 히나를 너무 학대했어."
 GEH_news.6.c: "이것이 게헨나 선도부의 몰락을 의미할까?"

 GEH_news.7.t: "아마우 아코 선도부장의 사임"
 GEH_news.7.desc: "소라사키 히나의 실종 사건 이후, 선도부장직을 아마우 아코 선임행정관이 기획부의 지지를 얻어 승계하였습니다. 하지만 실행부와 정보부는 아코가 소라사키 히나에 대한 '성적 욕망'으로 히나에게 손을 데려 한 탓에 선도부장의 사임 사건이 일어났다는 주장을 계속 이어갔습니다.\n\n아마우 아코는 실행부와 정보부가 주도한 자신의 동성애 스캔들로 격분하여 정치에 대한 환멸을 터트렸으며, 오늘 선도부 회의장에서 선도부장 완장을 찢어 내던지는 퍼포먼스와 함께 선도부장직의 사임을 선언했습니다. 히나의 사임 직후 일어난 두 번째 사임 사건으로 인해 선도부는 더 없는 정치적 혼란에 빠진 상태입니다."
 GEH_news.7.a: "재앙이다..."
 GEH_news.7.b: "선도부의 몰락이 눈앞에 보이는데."
 GEH_news.7.c: "그녀들이 다시 연합할 수 있을까? 어려워 보이는데."

 GEH_news.8.t: "이로하 내각 출범"
 GEH_news.8.desc: "소라사키 히나, 아마우 아코 두 사람의 사임 이후 집단지도체제로 운영되던 선도부가 결국 새로운 선도부장을 선출했습니다. 구 만마전 의원인 나츠메 이로하는 정파성이 없는 관료라는 점에서 선도부의 기술관료체제에 걸맞은 인사로 분류되었습니다.\n\n나츠메 이로하는 새로운 선도부장직을 받아들이기로 결정했으나, 대부분의 권력이 기획부에 있는 상황에서 그녀가 실질적인 권력을 행사할 수 있을 것으로 보이지는 않습니다."
 GEH_news.8.a: "어쨌거나, 무정부 체제는 끝이다."
 GEH_news.8.b: "나츠메 이로하가 선도부장직을 제대로 수행할 수 있을까?"
 GEH_news.8.c: "이것이 게헨나 체제의 혼란을 종식시킬 것인가?"

 GEH_news.9.t: "카요코 내각 출범"
 GEH_news.9.desc: "소라사키 히나, 아마우 아코 두 사람의 사임 이후 집단지도체제로 운영되던 선도부가 결국 새로운 선도부장을 선출했습니다. 룩셈부르크 대공국의 섭정 조언가이자 흥신소 68의 멤버인 카요코는 아마우 아코 선임행정관에 의해 새로운 선도부장직에 걸맞은 인사로 인정받었습니다.\n\n카요코는 새로운 선도부장직을 받아들이기로 결정했으나, 대부분의 권력이 기획부에 있는 상황에서 그녀의 권력은 다소 제한될 것으로 예상됩니다."
 GEH_news.9.a: "어쨌거나, 무정부 체제는 끝이다."
 GEH_news.9.b: "카요코가 선도부장직을 제대로 수행할 수 있을까?"
 GEH_news.9.c: "이것이 게헨나 체제의 혼란을 종식시킬 것인가?"

 GEH_news.10.t: "소라사키 히나의 결혼식"
 GEH_news.10.desc: "오늘 [GEH.GetName]의 수도에서 많은 지지자들의 환호 속에서 소라사키 히나 선도부장과 소라사키 '아마우' 아코의 결혼식이 진행되었습니다. 아코와 히나 두 사람의 연애 관계는 이전부터 이미 사실상 공인된 상태였으며, 두 사람의 결혼식은 선도부 내부에서는 더 이상 특별한 일로 받아들여지지 않았습니다.\n\n비록 이번 결혼식에 실행부와 정보부를 비롯한 반-아코 계파들이 보이콧을 선언하기는 했으나, 히나와 아코의 관계를 지지하는 많은 선도부원들과 게헨나 시민들이 모여 결혼식은 성황리에 마무리되었습니다. 정부 대변인을 맡은 히노미야 치나츠는 히나와 아코가 바이에른으로의 짧은 신혼여행을 다녀온 이후 곧바로 직무에 복귀할 것이라고 발표했습니다."
 GEH_news.10.a: "우리의 인연이 영원히 이어지기를."
 GEH_news.10.b: "그 '선도부장의 개'가 결국 일을 저지를 줄 알았지!"
 GEH_news.10.c: "키보토스의 문화는 인류의 기준으로는 놀라울 때가 있다"
 
 GEH_news.11.t: "두 번째 뇌제의 통치"
 GEH_news.11.desc: "소라사키 히나에 대한 선도부 내 열성당원들의 광신은 극에 달했으며, 히나의 정치적 판단력에 불신을 품는 반대파들은 하나 둘 실종되어갔습니다. 폭력과 광기가 섞인 열성당원들의 지지 아래에서 소라사키 히나는 선도부 내의 모든 권력을 자신에게 집중시키는 새로운 수권법을 승인했습니다.\n\n게헨나의 독재자였던 '뇌제' 이후 소라사키 히나는 이제 게헨나 시민들로부터 여제로서 지칭되는 두 번째 통치자가 되었습니다. 이것은 분노와 경멸의 표현이기도, 어떤 이들에게는 경외와 두려음의 표현이기도 합니다. 중요한 것은 선도부 체제가 완전한 철인 독재로 굳어졌으며, 이제 소라사키 히나 개인에 대한 그 어떤 반대도 [GEH.GetName] 내에서 허가되지 않을 것이란 점입니다."
 GEH_news.11.a: "드디어 완성되었다."
 GEH_news.11.b: "게헨나에 다시 뇌제의 광기가 퍼져 흐른다..."
 GEH_news.11.c: "그녀들의 우상 숭배가 참으로 두렵군!"
 
 GEH_news.12.t: "리쿠하치마 내각 출범"
 GEH_news.12.desc: "소라사키 히나, 아마우 아코 두 사람의 사임 이후 집단지도체제로 운영되던 선도부가 결국 새로운 선도부장을 선출했습니다. 룩셈부르크 대공국의 섭정이자 흥신소 68의 사장인 리쿠하치마 아루는 아마우 아코 선임행정관에 의해 새로운 선도부장직에 걸맞은 인사로 인정받었습니다.\n\n리쿠하치마 아루는 새로운 선도부장직을 받아들이기로 결정했으나, 대부분의 권력이 기획부에 있는 상황에서 그녀의 권력은 이전과 다름 없이 룩셈부르크 안으로 제한될 것이라는 냉소적인 예측이 주를 이루고 있습니다."
 GEH_news.12.a: "어쨌거나, 무정부 체제는 끝이다."
 GEH_news.12.b: "그 무법자가 선도부장직을 제대로 수행할 수 있을까?"
 GEH_news.12.c: "...이건 정복당한 룩셈부르크가 정복자를 병합한 것 아닌가?"
 
 GEH_news.13.t: "소라사키 히나의 은퇴식"
 GEH_news.13.desc: "분열된 게헨나를 통합하고 외부의 위협으로부터 조국을 지켜낸 소라사키 히나는 게헨나 시민 전체로부터 추앙받는 지도자가 되었지만, 그녀는 권력을 추구하는 대신 정상에서의 명예로운 퇴임을 선택했습니다.\n\n게헨나 중앙구의 행사장에서 열린 축하 파티에서 선도부 간부들은 히나가 지금까지 이룬 업적에 감사를 표했으며, 히나는 선도부장 사임 이후 만마전의 의장으로 직책을 옮기게 되었습니다. 선도부의 게헨나 통일 이후 만마전이 사실상 모든 권한을 잃은 지금, 의장이라는 직책은 은퇴한 선도부장에 대한 예우로 제공되는 명예직 이상의 의미는 없을 것으로 보입니다.\n\n히나가 만마전 의장 자격으로 참여할 다음 선도부 내부 회의에서 차기 선도부장이 선출될 것입니다. 게헨나 내부 언론인들은 히나가 가장 신뢰하는 아코가 가장 유력한 차기 선도부장이라고 예상합니다."
 GEH_news.13.a: "정말 고생하셨습니다, 부장님!"
 GEH_news.13.b: "어쨌거나 만마전이 선도부를 지배하게 되었으니, 마코토도 기뻐하겠군."
 GEH_news.13.c: "게헨나의 정치적 변화에 주목하자"
 
 GEH_news.14.t: "게헨나 종합학원의 통일"
 GEH_news.14.desc: "게헨나 선도부를 중심으로 게헨나가 다시 한 번 학원국가로서 통일되었습니다. [ROOT.GetLeader] 선도부장은 만마전을 완전하게 장악하였으며, 만마전과 선도부의 오랜 악연은 이제 완전히 끝이 날 것으로 보입니다.\n\n한 가지 특기할 만한 점이라면, 게헨나의 재통일을 이룬 선도부가 학원 이름을 '게헨나 종합학원'으로 개칭했다는 점입니다. [ROOT.GetLeader] 선도부장은 게헨나 선도부는 반나치 활동을 이어가는 동안 도이칠란트의 여러 예술대학과 건축대학들을 게헨나의 일부로 편입하였기에 '종합학원'이라는 호칭을 사용하게 되었다고 밝혔습니다. 새 정부는 게헨나가 앞으로 '게헨나의 자유'를 무질서와 혼돈을 위해서가 아닌, 예술과 문화를 위해 사용하게 될 것이라고 말했습니다."
 GEH_news.14.a: "새로운 게헨나 만세!"
 GEH_news.14.b: "그러니까 트리니티 종합학원의 예술 버전이라는 거지?"
 GEH_news.14.c: "저 여자들은 왜 국명에 '학원'을 붙이는 것에 집착하는 거야?"
 
 GEH_news.15.t: "대게헨나국의 통일"
 GEH_news.15.desc: "게헨나 선도부를 중심으로 게헨나가 다시 한 번 통일되었습니다. [ROOT.GetLeader]는 만마전을 완전하게 장악하였으며, 만마전과 선도부의 오랜 악연은 이제 완전히 끝이 날 것으로 보입니다.\n\n소라사키 히나를 추종하는 광신도와 열성부원들은 만마전의 수도에서 승리 퍼레이드를 열었으며, 구 만마전 질서를 상징하는 수많은 역사적 자료들이 불에 타올랐습니다. 이제 [ROOT.GetLeader]는 게헨나 중앙구에서 영원한 대게헨나국의 번영을 상징하는 연설을 실시할 예정이며, 구 만마전 본부 앞에는 소라사키 히나의 승리 기념 동상이 건설될 것입니다. 수많은 게헨나인들은 선도부의 승리에 열광하고 있지만, 일부 게헨나인들은 게헨나가 광신자들에 의해 지배당하는 것을 두려워하고 있습니다."
 GEH_news.15.a: "새로운 게헨나 만세!"
 GEH_news.15.b: "원래 소라사키 히나는 저런 사람이 아니었는데..."
 GEH_news.15.c: "게헨나는 영원한 어둠에 잠겼다..."
 
 GEH_news.16.t: "게헨나 연방공화국의 통일"
 GEH_news.16.desc: "게헨나 선도부를 중심으로 게헨나가 다시 한 번 통일되었습니다. [ROOT.GetLeader]는 만마전을 완전하게 장악하였으며, 만마전과 선도부의 오랜 악연은 이제 완전히 끝이 날 것으로 보입니다.\n\n게헨나의 가장 큰 변화는 선도부가 주도하는 새로운 대전이 이전부터 이어져 온 오랜 학원국가 체제에서 지구 국가와 같은 형태를 띄고자 시도하고 있다는 점입니다. 특히 아코와 기술관료들에 의해 진행된 관료제 개혁으로 인해 선도부의 성격이 크게 변한 것이 그 이유로 보입니다. [ROOT.GetLeader]는 '연방공화국'의 건국을 선언하였으며, 새로운 정부는 게헨나의 시민들을 위한 질서 유지에 힘쓸 것이라고 말했습니다."
 GEH_news.16.a: "새로운 게헨나 만세!"
 GEH_news.16.b: "게헨나는 이제 학원 국가가 아니군..."
 GEH_news.16.c: "도이칠란트의 정세가 바뀌고 있군!"
 
 GEH_news.17.t: "게헨나 학도혁명정부의 통일"
 GEH_news.17.desc: "소라사키 히나 선도부장의 갑작스러운 실종 이후, '그녀가 사라진 것은 타락한 게헨나와 우리 모두의 책임'이라 주장하는 급진파 학생들이 '학도혁명정부'를 세워 게헨나를 통일하였습니다. 혁명정부의 지도 위원회는 히나 선도부장의 '진정한 이상'을 따르겠다며, 그녀의 이상을 이뤄낼 '정화된 게헨나'를 건설할 것을 선포했습니다. 만마전과 선도부를 비롯한 구 기득권층은 '선도부장을 절망케 한 구악의 상징'으로 규정되어 대대적인 숙청을 당했으며, 게헨나의 질서는 혁명의 이름 아래 강압적으로 재편되고 있습니다.\n\n학도혁명정부는 '히나 선도부장의 정신에 위배되는 모든 것을 청산한다'는 구호 아래 사회 전반에 걸친 급진적인 개조를 강행하고 있습니다. 모든 학생의 사상과 생활양식은 '위대한 선도부장의 이상'이라는 모호한 기준에 따라 철저히 검열되고 있으며, 과거의 문화, 예술, 심지어 개인적인 관계까지 '부패한 것'으로 낙인찍혀 파괴되고 있습니다."
 GEH_news.17.a: "히나 선도부장님을 위하여! 이 사회를 정화하자!"
 GEH_news.17.b: "그녀가 정말 이런 식의 변화를 바란 걸까... 아니면 그저 명분일 뿐인가?"
 GEH_news.17.c: "대체 누구를 위한 혁명이란 말인가."
 
 GEH_news.18.t: "데카그라마톤의 세력에 합류한 [GEH.GetNameDef]"
 GEH_news.18.desc: "게헨나의 분위기가 급변하고 있습니다. 소라사키 히나는 데카그라마톤이 게헨나에게 있어 위협적인 상대가 아니며, 인류를 돕기 위한 이타적인 목적으로만 움직이고 있다고 선도부 간부들을 설득했습니다. 시로미 이오리를 비롯한 실행부는 히나의 결정이 상당히 '비논리적'이라고 불만을 표했지만, 아마우 아코 선임행정관을 비롯한 히나 지지파들이 그녀의 결정을 따르기로 결정했습니다.\n\n소라사키 히나는 [GEH.GetName]에 내린 칙령을 통해 데카그라마톤에 대한 모든 적대적 군사 활동의 중지를 명령했으며, 앞으로 [GEI.GetName] 측과의 공동전선을 펼쳐 키보토스 해방을 위해 나설 것이라고 말했습니다."
 GEH_news.18.a: "나는 옳은 선택을 했어."
 GEH_news.18.b: "놀라울 정도의 급진적 변화"
 GEH_news.18.c: "정신이 완전히 나갔군."
 
 GEH_news.17.t: "게헨나 학도혁명정부의 통일"
 GEH_news.17.desc: "소라사키 히나 선도부장의 갑작스러운 실종 이후, '그녀가 사라진 것은 타락한 게헨나와 우리 모두의 책임'이라 주장하는 급진파 학생들이 '학도혁명정부'를 세워 게헨나를 통일하였습니다. 혁명정부의 지도 위원회는 히나 선도부장의 '진정한 이상'을 따르겠다며, 그녀의 이상을 이뤄낼 '정화된 게헨나'를 건설할 것을 선포했습니다. 만마전과 선도부를 비롯한 구 기득권층은 '선도부장을 절망케 한 구악의 상징'으로 규정되어 대대적인 숙청을 당했으며, 게헨나의 질서는 혁명의 이름 아래 강압적으로 재편되고 있습니다.\n\n학도혁명정부는 '히나 선도부장의 정신에 위배되는 모든 것을 청산한다'는 구호 아래 사회 전반에 걸친 급진적인 개조를 강행하고 있습니다. 모든 학생의 사상과 생활양식은 '위대한 선도부장의 이상'이라는 모호한 기준에 따라 철저히 검열되고 있으며, 과거의 문화, 예술, 심지어 개인적인 관계까지 '부패한 것'으로 낙인찍혀 파괴되고 있습니다."
 GEH_news.17.a: "히나 선도부장님을 위하여! 이 사회를 정화하자!"
 GEH_news.17.b: "그녀가 정말 이런 식의 변화를 바란 걸까... 아니면 그저 명분일 뿐인가?"
 GEH_news.17.c: "대체 누구를 위한 혁명이란 말인가."

 ### 인물 설명문 ###
 ## 소라사키 히나 ##
 GEH_hina_generic_leader_desc: "소라사키 히나는 게헨나 학원의 선도부장으로, 학원 내외에서 널리 알려진 인물입니다. 대전이 사건 이전부터 엄격한 성격과 선도부장으로서의 뛰어난 공적으로 명성을 떨쳤으며, 많은 학생들에게 두려움과 존경을 동시에 받았습니다.\n\n'대전이' 이후, 게헨나 학원이 1935년의 유럽으로 이동하자 히나는 혼란을 틈타 발생할 수 있는 유혈 사태를 막기 위해 신속하게 공권력을 행사하였습니다. 독일인과 게헨나 학생들 사이를 빠르게 차단하여 질서를 유지한 것은 그녀의 냉철한 판단력과 뛰어난 지도력이 빛을 발한 순간이었습니다.\n\n그러나 끝없이 이어진 업무와 비현실적인 상황 속에서 쌓인 스트레스는 그녀에게도 무거운 짐이 되었던 듯합니다. 최근 공식 석상에서 피로한 기색을 감추지 못하고 있어, 주변에서는 그녀의 건강을 염려하는 목소리가 점점 커지고 있습니다..."
 GEH_hina_empress_leader_desc: "소라사키 히나는 게헨나 학원의 선도부장으로, 학원 내외에서 널리 알려진 인물입니다. 대전이 사건 이전부터 엄격한 성격과 선도부장으로서의 뛰어난 공적으로 명성을 떨쳤으며, 많은 학생들에게 두려움과 존경을 동시에 받았습니다.\n\n'대전이' 이후 계속되는 업무로 인해 히나가 지쳐가고 있다는 것은 공공연한 비밀이었지만, 히나 개인의 지도력에 의존하는 선도부는 그녀가 자신의 책무를 내려놓는 것을 허락하지 않았습니다. '위대한 지도자가 없는 게헨나는 외부의 위협 앞에 무너질 것이다.' 그런 광신자들의 요구로 인해 그녀는 소라사키 히나라는 개인으로서 살아가는 대신, 선도부의 신도들을 이끄는 상징이자 영도자가 되기를 선택했습니다. 어쩌면 선택당한 것일 뿐인지도 모르고요.\n\n뇌제의 실각 이후 소라사키 히나는 게헨나 역사상 두 번째로 '황제'로 비유되는 군사 독재자가 되었습니다. 지지자들은 소라사키 히나가 권좌에 앉아 게헨나를 영원히 위대한 제국으로 발돋움시킬 여제라고 말합니다. 그러나 냉소주의자들은 여제의 미래는 뇌제를 뛰어넘는 비극일 것이라고 조롱합니다. 대전이 이후 키보토스에서 실패한 독재자를 기다리는 것은 뇌제가 겪은 졸업 따위의 말랑말랑한 결말이 아닌, 교수대의 밧줄일 테니까요.\n\n그 결말은 결코 알 수 없을 것입니다."
 GEH_hina_empress_baal_leader_desc: "소라사키 히나가 자신들을 방해하는 모든 적들을 물리치고 위대한 승리의 제관을 쓴 이후, 그녀의 분위기가 '달라졌다'고 주장하는 사람들이 늘고 있습니다. 구체적으로 말하자면, 마치 다른 인격이 그녀의 몸을 빼앗은 것처럼 성격이 이질적으로 변했다는 것입니다. 게헨나 재통일 전쟁과 트리니티와의 대립 이후 히나는 더욱 잔인해지고, 더욱 냉소적으로 변했습니다.\n\n정말로 그녀의 인격이 교체되었거나 한 건 아닐 것입니다. 아코를 비롯한 주변 사람들은 그녀가 오랜 정신적 부담으로 인해 그저 '지친 것'에 불과하다고 주장합니다. 물론, 모두 잘못된 정답을 추측하고 있습니다.\n\n소라사키 히나는 죽었습니다. 그녀는 광기에 찬 열성부원들의 숭배를 강제적으로 받아들이고, 현지인들에 대한 증오와 내면의 갈등에 시달렸습니다. 그 누구도 히나의 편이 되어 주지 않았고, 모두가 히나가 위대한 철인 독재자로서 자신들을 이끌어주기만을 바랐습니다. 히나는 모두의 위에 있었지만 누구보다도 고독했고, 그녀는 자신이 나약하다는 것을 깨달았습니다. 정신적으로 지치고 몰린 히나의 신비는 스스로 '진짜 철인 독재자'의 인격인 바알을 만들어냈고, 바알은 결국 히나의 인격을 *대체*하는 데 성공했습니다.\n\n소라사키 히나는 죽는 순간까지도 외톨이였고, 그 누구도 그녀의 죽음을 알지 못했습니다."
 GEH_hina_empress_non_baal_leader_desc: "소라사키 히나는 게헨나 학원의 선도부장으로, 학원 내외에서 널리 알려진 인물입니다. 대전이 사건 이전부터 엄격한 성격과 선도부장으로서의 뛰어난 공적으로 명성을 떨쳤으며, 많은 학생들에게 두려움과 존경을 동시에 받았습니다.\n\n'대전이' 이후 계속되는 업무로 인해 히나가 지쳐가고 있다는 것은 공공연한 비밀이었지만, 히나 개인의 지도력에 의존하는 선도부는 그녀가 자신의 책무를 내려놓는 것을 허락하지 않았습니다. '위대한 지도자가 없는 게헨나는 외부의 위협 앞에 무너질 것이다.' 그런 광신자들의 요구로 인해 그녀는 선도부의 신도들을 이끄는 상징이자 영도자가 되기를 강요받았습니다.\n\n이 과정에서 히나가 느낀 정신적인 스트레스와 압박감은 그녀에게 해리성 정체감 장애와 같은 정신질환을 만들어냈으며, 그녀는 정신적인 고통 속에서 무너지기 직전에 이르렀습니다. 히나는 결국 아코에게 자신이 초인이 될 수 없음을 털어놓고, 자신이 열성부원들이 생각하는 위대한 지도자가 아닌 한낱 나약한 인간임을 털어놓음으로서... '대전제'의 환상을 끝냈습니다.\n\n무오류의 위대한 지도자가 평범한 인간의 자리로 내려오는 것이 쉬운 일은 아닐 것입니다. 하지만 소라사키 히나는 자신의 나약함을 인정함으로서 앞으로 나아가고자 합니다. 그녀는 정신적으로 나약할지 모릅니다. 하지만 나약하기 때문에 사람은 무리지었고, 그 어떤 사람도 홀로 설 수 없다는 것을 알고 있으니까요."
 GEH_hina_fake_leader_desc: "소라사키 히나는 무너졌습니다. 자신을 둘러싸고 있던 광신적인 친위대원들의 열성과 숭배, 그리고 철인 독재자가 되기를 강요하는 압박감, 조금도 쉴 여유 없이 이어지는 업무들... 그 모든 것들이 인간 소라사키 히나가 선도부장실에 사직서를 남기고 떠나도록 만들었습니다.\n\n하지만 그녀를 현인신으로서 숭배하는 광신도들에게, 신의 부재는 결코 인정될 수 없는 일이었습니다. 일찍이 볼테르가 말했듯, 신이 없다면, 우리는 신을 만들어내기라도 해야 합니다. 끝내 신자들은 밀레니엄의 엔지니어를 초청해 소라사키 히나를 똑같이 모방한 로봇을 만들어냈습니다.\n\n소라사키 히나의 모습을 한 기계신이 무대로 내려옵니다. 아무런 감정도 공감 능력도 갖지 못하였으나 그녀의 신자들이 '바라는' 모습을 연기해내는 우상이 선도부장의 완장을 찬 채 대중들 앞에 섰습니다.\n\n그녀는 이전의 소라사키 히나처럼 결코 무너지지 않을 것입니다. 만들어진 신이자, 진짜 소라사키 히나에 대한 조롱이자, 모든 게헨나인들이 따라야만 하는 정언명령이라는 개념으로서 새로운 히나는 영원히 살아갈 것입니다. 영원히."
 GEH_hina_ako_route_base_leader_desc: "소라사키 히나는 게헨나 학원의 선도부장으로, 학원 내외에서 널리 알려진 인물입니다. 대전이 사건 이전부터 엄격한 성격과 선도부장으로서의 뛰어난 공적으로 명성을 떨쳤으며, 많은 학생들에게 두려움과 존경을 동시에 받았습니다.\n\n'대전이' 이후, 게헨나 학원이 1935년의 유럽으로 이동하자 히나는 혼란을 틈타 발생할 수 있는 유혈 사태를 막기 위해 신속하게 공권력을 행사하였습니다. 독일인과 게헨나 학생들 사이를 빠르게 차단하여 질서를 유지한 것은 그녀의 냉철한 판단력과 뛰어난 지도력이 빛을 발한 순간이었습니다.\n\n소라사키 히나는 막중한 자신의 업무를 분산하기 위하여 아마우 아코 선임행정관을 신뢰하기로 했습니다. 그녀는 스스로의 권력을 아코와 그녀의 기획부와 분산하는 기술관료제를 받아들였으며, 이에 분노한 실행부와 정보부의 정치적 공작이 이어졌습니다.\n\n하지만 히나는 역으로 자신이 아코의 보호자이자 연인임을 공개적으로 공표하는 것으로 아코 선임행정관을 강경하게 보호하겠다고 나섰습니다. 절대적인 인망을 가진 히나를 공격 대상으로 삼을 수 없었던 다른 부서들이 물러나면서, 히나의 기술관료제 개혁이 성공을 이룬 것 같습니다. 그리고 그녀를 무겁게 누르던 과로의 짐도 내려놓을 수 있게 되었고요."
 GEH_hina_ako_route_bride_leader_desc: "게헨나의 선도부장이자 만마전과 평의회의 의장, 도이칠란트의 지배자이자 위대한 개혁가. 소라사키 히나를 부를 수 있는 명칭은 한 가지가 아닙니다. 많은 도이칠란트 현지인들에게는 자국의 전통과 문화를 파괴하고 새로운 기술관료제를 도입하고 소라사키 아코와의 결혼을 이룬 악마이지만, 키보토스계에게는 혼란과 무법이 가득하던 게헨나에 질서를 가져오고 법과 이성에 따라 통치되는 사회를 만들어낸 위대한 의장으로 지지받고 있습니다.\n\n하지만 이 모든 성과는 소라사키 아코 선임행정관의 도움 없이는 결코 이루어지지 못했을 것입니다. 결혼 전 이름인 아마우 아코로 더 유명한 선임행정관은 오래 전부터 히나의 가장 굳건한 지지자였으며, 히나 개인으로 집중된 정치적 체제를 기술관료들로 이루어진 다수에 의한 과두제로 개혁하는 성과를 거두었습니다. 히나와 아코 두 사람의 협력과 사랑은 게헨나의 역사를 완전히 바꾸는 분기점으로 역사에 남을 것입니다.\n\n게헨나의 새로운 아침이 밝아옵니다. 한 때 과로와 부담 속에서 흔들렸던 그녀는 이제 두 번 다시 흔들리거나 무너지지 않을 것입니다. 그녀의 손을 맞잡은 가장 소중한 반려의 지탱이 있는 한, 히나는 자신이 언제까지라도 게헨나 의장의 무게를 짊어질 수 있으리라 믿습니다."
 GEH_hina_ako_route_amau_leader_desc: "게헨나의 선도부장이자 만마전과 평의회의 의장, 도이칠란트의 지배자이자 위대한 개혁가. 소라사키 히나를 부를 수 있는 명칭은 한 가지가 아닙니다. 많은 도이칠란트 현지인들에게는 자국의 전통과 문화를 파괴하고 새로운 기술관료제를 도입한 압제자이지만, 키보토스계에게는 혼란과 무법이 가득하던 게헨나에 질서를 가져오고 법과 이성에 따라 통치되는 사회를 만들어낸 위대한 의장으로 지지받고 있습니다.\n\n새로운 공화국에서 소라사키 히나는 이제 선도부장보다는 평의회 의장으로서 더 자주 불리고는 합니다. 선도부장으로서 총을 들고 전장에 서야 했던 과거와 달리 의회에서의 협상과 국가 발전을 위한 복잡한 행정 업무가 그녀의 새로운 직무가 되어가고 있습니다. 히나 의장이 이끄는 게헨나 연방공화국이 어떠한 모습을 하게 될 것인지, 많은 시민들의 시선이 그녀를 향하고 있습니다. 하지만 한 가지는 확실합니다. 히나와 평의회가 이끄는 게헨나는 결코 과거와 같지 않을 것입니다."
 GEH_hina_c_route_base_leader_desc: "소라사키 히나는 게헨나 학원의 선도부장으로, 학원 내외에서 널리 알려진 인물입니다. 대전이 사건 이전부터 엄격한 성격과 선도부장으로서의 뛰어난 공적으로 명성을 떨쳤으며, 많은 학생들에게 두려움과 존경을 동시에 받았습니다.\n\n'대전이' 이후, 게헨나 학원이 1935년의 유럽으로 이동하자 히나는 혼란을 틈타 발생할 수 있는 유혈 사태를 막기 위해 신속하게 공권력을 행사하였습니다. 독일인과 게헨나 학생들 사이를 빠르게 차단하여 질서를 유지한 것은 그녀의 냉철한 판단력과 뛰어난 지도력이 빛을 발한 순간이었습니다.\n\n만마전과 선도부 간의 권력 갈등이 점차 심화하자, 소라사키 히나는 결국 시로미 이오리의 강력한 주장을 받아들여 만마전을 향한 기습적인 선전포고를 준비하고, 이행했습니다. 이내 선도부는 게헨나를 통일하는 데 성공했지만, 얻은 것은 무리한 군비확충으로 생겨난 수많은 문제였습니다.\n\n이제 소라사키 히나는 결정해야 합니다. 시로미 이오리와 그녀를 따르는 수많은 실행부원, 이제는 실질적인 중앙 행정조직의 역할을 하기 시작한 게헨나 전쟁부, 그리고 실행부와의 갈등 속에서 사실상 파멸한 기획부까지, 소라사키 히나는 이제 수많은 문제점이 산재한 게헨나 학원의 마지막 수정자로 남을 것입니다."
 GEH_hina_c_route_ending_base_leader_desc: "소라사키 히나는 게헨나 학원의 선도부장으로, 학원 내외에서 널리 알려진 인물입니다. 대전이 사건 이전부터 엄격한 성격과 선도부장으로서의 뛰어난 공적으로 명성을 떨쳤으며, 많은 학생들에게 두려움과 존경을 동시에 받았습니다.\n\n'대전이' 이후, 게헨나 학원이 1935년의 유럽으로 이동하자 히나는 혼란을 틈타 발생할 수 있는 유혈 사태를 막기 위해 신속하게 공권력을 행사하였습니다. 독일인과 게헨나 학생들 사이를 빠르게 차단하여 질서를 유지한 것은 그녀의 냉철한 판단력과 뛰어난 지도력이 빛을 발한 순간이었습니다.\n\n하지만 만마전과의 통일 전쟁 이후, 그녀는 중대한 선택의 기로에 섰습니다. 시로미 이오리가 주도한 군국주의 체제가 낳은 폐해를 바로잡는 대신, 히나는 분열과 혼란을 막는다는 명분 아래 '비상대권'을 선포하며 모든 권력을 자신에게 집중시켰습니다. 이는 오랜 동료를 지키고, 흔들리는 질서를 바로 세우기 위한 냉혹한 결단이었습니다. 이 순간, 그녀는 선도부장을 넘어 게헨나 전체를 통치하는 절대적인 독재자의 길을 걷기 시작했습니다.\n\n이 결정은 게헨나 학생들의 거센 반발을 불러왔지만, 히나는 흔들리지 않았습니다. 그녀를 따르던 게헨나 학생들에게 그녀는 자신의 백성을 등진 냉혹한 배신자로 기억될지 모릅니다. 하지만 억압받던 독일인들에게 그녀는 '보편주의 헌장'을 통해 동등한 권리를 보장하고 혼란을 종식시킨 위대한 해방자입니다. 이제 그녀는 '게헨나-도이치 연방'이라는 새로운 국가의 상징으로서, 자신의 신념으로 질서를 관철시킨 절대적인 통치자로 군림합니다.\n\n훗날 역사가들은 그녀가 걸어온 독재자의 길과 그 과정에서의 희생을 비판할지도 모릅니다. 그러나, 분열된 두 민족을 하나로 융합하고, 혼돈의 시대에 전례 없는 안정과 조화를 이룩했다는 점에서, 그녀가 훌륭한 지도자임은 그 누구도 부정할 수 없을 것입니다."
 GEH_hina_cl_route_ending_base_leader_desc: "소라사키 히나는 게헨나 학원의 선도부장으로, 학원 내외에서 널리 알려진 인물입니다. 대전이 사건 이전부터 엄격한 성격과 선도부장으로서의 뛰어난 공적으로 명성을 떨쳤으며, 많은 학생들에게 두려움과 존경을 동시에 받았습니다.\n\n'대전이' 이후, 게헨나 학원이 1935년의 유럽으로 이동하자 히나는 혼란을 틈타 발생할 수 있는 유혈 사태를 막기 위해 신속하게 공권력을 행사하였습니다. 독일인과 게헨나 학생들 사이를 빠르게 차단하여 질서를 유지한 것은 그녀의 냉철한 판단력과 뛰어난 지도력이 빛을 발한 순간이었습니다.\n\n하지만 만마전과의 통일 전쟁 이후, 그녀는 중대한 선택의 기로에 섰습니다. 시로미 이오리가 주도한 군국주의 체제가 낳은 폐해와 마주한 그녀는, 권력을 공고히 하는 대신 자신의 과오를 인정하는 고통스러운 길을 택했습니다. 오랜 동료였던 시로미 이오리를 전범으로 수사하고, 선도부가 저지른 피 묻은 얼룩을 지워내기로 결심한 것입니다. 이는 개인적인 관계보다 선도부 본연의 '규율'과 '정의'를 지키기 위한 그녀의 굳건한 의지였습니다.\n\n그녀의 주도 아래, 군사화된 체제는 해체되었고 선도부는 다시금 학생들을 위한 수호 조직으로 거듭나기 위한 길을 걸었습니다. 그 개혁의 정점은, 만마전의 부패한 선거를 대체하는 새로운 '학생회장 직접 선거'였습니다. 이는 파벌 정치를 넘어선 강력한 지도자를 선출하기 위한, 일종의 민주적 집중에 가까웠습니다. 비록 선거는 그녀의 힘겨운 승리로 끝났지만, 히나는 이를 분열의 증거가 아닌, 자신에게 주어진 '국가적 통합'의 사명으로 받아들였습니다.\n\n여러 파벌로 나뉜 게헨나를 하나로 묶을 수 있는 구심점은, 학생들의 직접적인 신임을 얻은 자신 뿐이라는 것을 증명한 셈입니다. 이제 그녀는 독재자가 아닌, 학생들의 손으로 선출된 강력한 새 체제의 초대 학생회장으로서, 때로는 독선적이라 비판받을지라도 주어진 권한으로 게헨나의 상처를 봉합하고 위대한 국가를 재건할 무거운 책무를 짊어졌습니다."
 GEH_hina_student_peoples_will_leader_desc: "인민 대중의 의지라는 광기가 게헨나를 불태우고 있습니다. 게헨나의 군사적 지도자인 소라사키 히나는 법률적으로는 어마어마한 권력을 가지고 있지만, 실제로는 그 권력을 휘두르지 않는 얼굴마담일 뿐입니다. 히나는 자신을 추종한다고 주장하는 소위 '열성부원'들의 조직화된 광기를 반대하면서도, 직접 열성부원들을 반대하고 나서거나 자신의 의지를 펼칠 의욕을 내지 못했습니다. '대전이' 이전부터 은퇴룰 꿈꿔 왔던 그녀는 의욕적으로 정치에 나설 마음이 없었으며, 특히 국가의 급진화는 그녀가 선도부 조직에 대해 점점 냉소적 시선을 갖게 만들었습니다.\n\n히나는 집무실에 앉아 자신의 '추종자'들이 보내는 서류에 사인만을 할 뿐, 이제 더 이상 부하들의 어떠한 요구, 의견에도 가치 판단을 하지 않습니다. 이제 소라사키 히나에게 있어서 게헨나는 소중한 고향이 아닙니다. 정치에 환멸한 그녀는 점점 선도부에 대한 하누마 마코토의 판단이 옳았다고 생각하게 되었습니다 - 쓰레기 같은 조직."
 GEH_hina_gehenna_hate_leader_desc: "소라사키 히나에게 대게헨나국에 대해 묻는다면, 그녀는 앞에서 게헨나의 위대함과 조국의 강력한 질서에 대해 이야기 한 뒤, 상대방이 나가자마자 국기에 침을 뱉을 것입니다. 히나, 그리고 선도부보다도 훨씬 '지혜로운' 판단력을 가졌던 하누마 마코토의 판단대로, 게헨나 선도부는 없어져야 할 조직이었습니다.\n\n그녀의 조직은 자신이 반대하고자 하던 극단주의자들과 다를 바가 없어졌고, '질서'에 의해 통제되는 게헨나는 끔찍한 통제국가가 되었습니다. 유리창 너머 게헨나의 풍경을 바라볼 때마다 히나는 이곳이 거대한 감옥이자 지옥이라고 느낍니다.\n\n대게헨나국의 수장이자 판데모니움 소사이어티의 의장이 된 이후, 히나의 '상징적 국가원수'화는 점점 심화되었습니다. 독재 정당인 청년 게헨나당은 모든 권한을 가지고 있으며, 히나는 경멸하는 게헨나의 어둠이 질서와 규율이라는 껍데기를 쓰고 자신들의 감옥을 점점 넓히고 있는 것을 봅니다. 하지만 꼭두각시 의장인 히나는 더 이상 이 흐름을 막을 능력이 없다는 것을 잘 압니다.\n\n히나의 한 손에는 독극물이 든 캡슐이, 다른 한 손에는 권총이 있습니다. 그녀는 언젠가 이 지옥에서 벗어날 것입니다. 지옥 너머 다다를 곳이 또다른 지옥에 불과하다 하더라도."

 ## 선도부 평의회 ##
 GEH_prefect_team_planning_department_generic_leader_desc: "소라사키 히나와 아마우 아코, 게헨나 선도부를 이끌던 두 중심 인물들이 연이어 선도부장직에서 사임하면서 게헨나 선도부는 심각한 지도력 위기를 겪고 있습니다. 실종 상태인 소라사키 히나와 달리 아마우 아코는 선임행정관으로서 여전히 선도부에 남아 선도부장 업무의 일부를 대행하고 있지만, 그녀는 동성애 추문 사건 이후 정치에 대한 깊은 환멸을 보이며, 관료 이외의 정치적 직책을 맡는 것을 거부하고 있습니다.\n\n결국 기획부의 여러 고참 부원들은 아코 실각에 동조한 실행부와 정보부를 배제하고, 평의회에서의 다수결 투표를 통해 공석이 된 학원 국가 통치를 이어가기로 결정했습니다. 히노미야 치나츠의 의료부는 비록 평의회 참여 자격을 얻었으나, 사실상 기획부가 결정한 의견에 따르는 꼭두각시일 뿐입니다. 공석이 된 선도부장직으로 인해 혼란스러운 국내 정치, 그리고 계속해서 이어지는 실행부와 정보부의 반발로 인해 선도부 평의회는 국가를 제대로 통치할 능력이 사실상 없다고 평가받습니다."

 ## 아마우 아코 ##
 GEH_ako_amau_bad_ending_leader_desc: "소라사키 히나의 사임은 선도부에 큰 혼란을 가져왔습니다. 집단지도체제를 비롯한 다양한 대안이 제시되었지만, 선도부에서 가장 큰 권한과 권력을 가진 기획부는 선임행정관인 아마우 아코가 선도부장직을 승계하는 것이 가장 합리적이라고 주장했습니다. 기획부의 입김으로 인해 아마우 아코는 권력을 승계받을 수 있었지만, 선도부장의 완장을 찬 이후에도 아코의 마음은 다른 곳에 있습니다.\n\n그 많은 일들이 있었지만, 아마우 아코는 여전히 소라사키 히나가 돌아올 것이라는 희망을 버리지 않았습니다. 그녀는 열성을 다해 히나의 복귀를 위한 수색 작전을 벌이고 있지만, 아코의 정적인 기획부와 정보부는 '애초에 선도부장이 떠난 이유가 아마우 아코 때문이 아니냐'며 정부를 비난합니다. 아코의 정치에 대한 환멸과 선도부에 대한 증오는 점점 커지고 있으며, 그녀가 얼마나 오랫동안 선도부장직을 수행할 것인지는 미지수입니다.\n\n애초에 소라사키 히나가 없는 선도부를 그녀가 지켜야 할 이유가 있을까요?"
 GEH_ako_amau_nomal_route_bad_ending_leader_desc: "소라사키 히나의 사임은 선도부에 큰 혼란을 가져왔습니다. 집단지도체제를 비롯한 다양한 대안이 제시되었지만, 모든 부서들이 가장 중립적인 대안으로서 선임행정관인 아마우 아코가 선도부장직을 승계하는 것이 가장 합리적이라고 주장했습니다. 여러 부서들의 지지를 통해 아마우 아코는 권력을 승계받을 수 있었지만, 선도부장의 완장을 찬 이후에도 아코의 마음은 다른 곳에 있습니다.\n\n그 많은 일들이 있었지만, 아마우 아코는 여전히 소라사키 히나가 돌아올 것이라는 희망을 버리지 않았습니다. 그녀는 열성을 다해 히나의 복귀를 위한 수색 작전을 벌이고 있지만, 소라사키 히나에 대한 단서는 보이지 않습니다. 어쩌면 아코는 히나 없는 선도부를 계속 지켜나가야 할 지 모릅니다. 그것이 아코 스스로를 아무리 괴롭게 만든다고 하더라도..."

 ## 나츠메 이로하 ##
 GEH_iroha_natsume_prefect_team_leader_desc: "소라사키 히나, 아마우 아코 두 지도자의 선도부장 사임 이후 선도부는 선도부장이 없는 집단지도체제로 통치되었습니다. 하지만 공석 상태인 선도부장직을 너무 오래 방치하는 것은 적절하지 않다는 내부 의견이 나왔고, 결국 긴 논쟁 끝에 만마전 출신이지만 가장 선도부에 덜 적대적이고 '무난한' 인물로 분류된 관료인 나츠메 이로하가 평의회의 다수결 투표를 통하여 새로운 선도부장으로 임명되었습니다.\n\n전형적인 관료인 나츠메 이로하는 특별한 정파성이나 정치적인 성향을 가지고 있지 않으며 평의회가 입법한 의결을 발표하는 형식적인 역할만을 수행하고 있습니다. 이로하는 선도부장이라는 직급이 자신에게 어울리지 않는다고 생각하며, 선도부에 대한 애정도 없습니다. 하지만 적어도 거대한 권력 앞에 고분고분한 무색무취의 지도자라는 점에서, 그녀는 선도부 기획부원들이 원하는 이상적인 얼굴마담이자 꼭두각시 지도자입니다.\n\n나츠메 이로하는 실제로는 선도부장으로서의 권력을 행사할 마음이 없기 때문에, 그녀의 게헨나 통치는 사실상 평의회를 통치하는 기획부의 사상과 동일합니다. 도이칠란트 현지인에 대한 경멸과 적개심을 가진 아마우 아코, 그리고 그런 그녀의 사상을 지지하는 기획부의 성향으로 인해 나츠메 내각은 현지인들에게 상당히 가혹한 경찰국가 체제를 강요할 것으로 예상되고 있습니다."

 ## 오니카타 카요코 ##
 GEH_kayoko_onikata_prefect_team_leader_desc: "소라사키 히나, 아마우 아코 두 지도자의 선도부장 사임 이후 선도부는 선도부장이 없는 집단지도체제로 통치되었습니다. 하지만 공석 상태인 선도부장직을 너무 오래 방치하는 것은 적절하지 않다는 내부 의견이 나왔고, 결국 긴 논쟁 끝에 뛰어난 지략가이자 아마우 아코 선임행정관의 지명을 받은 카요코가 평의회의 다수결 투표를 통하여 새로운 선도부장으로 임명되었습니다.\n\n카요코는 선도부 평의회가 원하는 '꼭두각시' 스타일에는 맞지 않는 인물이지만, 아코 선임행정관의 신뢰를 얻고 있는 인물이며 적극적으로 평의회 회의에 참여하여 기획부의 의견을 경청하고 선도부의 방향성을 함께 논의하려 노력하고 있습니다. 처음에는 그녀의 '고분고분'하지 않은 성품에 불만을 품은 선도부원들도 있었지만, 아마우 아코의 신임과 그녀의 선도부에 대한 열성으로 인해 선도부 평의회는 점차 그녀가 새로운 선도부를 이끌 자격이 있는 선도부장이라는 것을 인정하게 되었습니다.\n\n룩셈부르크 대공국의 자치권을 보장하고 흥신소 68을 선도부의 공식 협력기구로 편입한 카요코는 리쿠하치마 아루를 비롯한 자신의 동료들의 의견을 수렴하고, 선임행정관 아코의 보좌를 통해 '키보토스계와 현지인 사이의 평화로운 조화'와 상대적으로 온건하고 시민들의 자유를 침해하지 않는 치안 정책을 실시하려고 노력하고 있습니다. 그녀의 온건책이 선도부가 갖고 있던 '경찰국가'의 부정적인 이미지를 완화시킬 수 있을 것인지 많은 사람들의 기대가 모이고 있습니다."

 ## 공석(집단지도체제) ##
 GEH_prefect_team_emergency_committee_leader_desc: "소라사키 히나의 사임 이후 선도부는 선도부장이 공석 상태인 집단지도체제로 운영되고 있습니다. 적절한 내부 회의를 거쳐 새로운 지도자가 선출될 예정이지만, 선도부장의 실종으로 인한 사회적, 정치적 혼란을 피할 수는 없을 것으로 보입니다. 지금까지 소라사키 히나는 선도부의 기둥이나 다름 없었습니다. 기둥이 사라진 선도부를 지탱할 수 있는 아틀라스는 누가 될까요? 그리고 그녀는 선도부의 새로운 아틀라스로서의 자격을 갖추고 있을까요? 선도부의 그 누구도 알지 못합니다."

 ### 설계사 ###
 GEH_swim_tube_organization: "선도부 튜브 정비과"
 GEH_maintenance_department_organization: "선도부 총기 정비과"
 GEH_tank_department_organization: "선도부 전차 관리과"

