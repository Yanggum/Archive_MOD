 # Description
 HOL_exile_government_desc:0 "We have been defeated in battle against the otherworlders and have fled into exile in Indonesia. Though Java lacks sufficient land, it is rich in resources, and we have chosen it as the seat of our new government. Now, we must conquer Indonesia and reclaim our lost homeland."
 HOL_political_effort_desc:0 "We are merely a government-in-exile driven out of Indonesia. However, we will not give up. We must solidify our position through political effort."
 HOL_suppress_indonesian_independence_desc:0 "The Indonesian independence movement is growing increasingly intense. We must maintain order by ruthlessly suppressing them. Their independence is something we can never tolerate."
 HOL_develop_indonesian_administration_desc:0 "To rule Indonesia, we must develop a local administration and appoint personnel cooperative to our cause. This will strengthen our governing power."
 HOL_supress_communist_activities_desc:0 "Communist activities are rampant. They incite the masses under the guise of independence, but in reality, they only cause anarchy and chaos. They must be strictly cracked down upon."
 HOL_reaffirm_colonial_rule_desc:0 "We must reaffirm that we are the rightful rulers of Indonesia. We will widely publicize the legitimacy of colonial rule and isolate resisting forces. Indonesia will remain Dutch forever."
 HOL_expand_internal_security_desc:0 "In a situation where threats from independence movements and communists persist, we must expand and strengthen internal security. The authority of the police and intelligence agencies must be greatly increased, and surveillance and control must be tightened."
 HOL_integrate_indonesian_conscripts_desc:0 "We must conscript Indonesians into our army. Loyal Indonesian soldiers will be of great help in fighting the independence forces. Furthermore, we can better understand local conditions through them."
 HOL_army_effort_desc:0 "A powerful army is essential to hold our ground in Indonesia. We must maximize our strength by creating new divisions, modernizing equipment, and intensifying training."
 HOL_equipment_effort_desc:0 "We cannot win a fight with poor equipment. We must focus on improving and producing sufficient quantities of firearms, artillery, and armored vehicles."
 HOL_motorization_effort_desc:0 "Securing mobility in the jungle is the key to victory. We must increase motorized units and mass-produce trucks and jeeps to conduct swift operations."
 HOL_doctrine_effort_desc:0 "We must develop military doctrines suited to the unique environment of Indonesia. Doctrines and tactics capable of responding to various situations like jungle, mountain, and urban warfare are required."
 HOL_equipment_effort_2_desc:0 "Signs indicate the war may become prolonged. Additional improvement and expansion of equipment are necessary. Modernization of the logistics sector, especially communication equipment, medical supplies, and provisions, is urgent."
 HOL_mechanization_effort_desc:0 "We need to expand mechanized units. By deploying large numbers of armored vehicles and personnel carriers, we must be able to transport and deploy troops quickly and safely even within the jungle."
 HOL_doctrine_effort_2_desc:0 "As war experience accumulates, we are able to further develop our doctrine. We must complete a doctrine that can flexibly respond to enemy tactics and perform various coordinated operations."
 HOL_equipment_effort_3_desc:0 "The front lines have stagnated, and a war of attrition continues. To lead this war to victory, standardization and mass production of weapons and equipment are essential. We must expand arsenals and streamline production lines."
 HOL_armor_effort_desc:0 "The independence forces are conducting guerrilla warfare by utilizing the advantages of the jungle. To counter this, strengthening the power of armored units is necessary. We must focus on increasing and improving tanks and armored cars."
 HOL_special_forces_desc:0 "We must cultivate special forces. We need commandos capable of operating covertly in the jungle, cutting off enemy supply lines, and striking major strongholds. Additionally, professional units to counter the enemy's special forces must be raised."
 HOL_aviation_effort_desc:0 "Gaining air superiority will determine the outcome of the war. We must significantly increase air power and ensure that various missions such as reconnaissance, bombing, and close air support can be performed."
 HOL_fighter_focus_desc:0 "To defend our airspace and thwart enemy air raids, a powerful fighter force is required. We must focus on introducing cutting-edge fighters and training pilots."
 HOL_bomber_focus_desc:0 "To strike major enemy facilities and troop concentrations, strategic bombers are essential. We must develop and operate large bombers to paralyze the enemy's war-making capabilities."
 HOL_aviation_effort_2_desc:0 "Additional expansion of air power is needed. We must increase aircraft production facilities, expand air bases, and train more skilled pilots and maintenance crews."
 HOL_CAS_effort_desc:0 "Close air support can provide decisive help to ground operations. We must develop and deploy light attack aircraft capable of neutralizing the enemy with precise strikes in jungle engagements."
 HOL_rocket_effort_desc:0 "Rocket weapons can be decisive game-changers in war. We must develop rocket launchers and projectiles to effectively strike enemy positions and armored targets."
 HOL_NAV_effort_desc:0 "To secure both air and sea superiority, naval bombers are required. By developing and deploying aircraft that can attack submarines and battleships, we must overwhelm the enemy's naval power."
 HOL_naval_effort_desc:0 "Indonesia is a country made of islands. We cannot win without seizing control of the sea. We must fully increase naval power and build various ships to secure command of the sea."
 HOL_flexible_navy_desc:0 "Considering Indonesia's complex coastline and many islands, a mobile and flexible navy is needed. We must possess a force that can harmoniously operate destroyers, cruisers, and submarines."
 HOL_large_navy_desc:0 "Ultimately, we must build a blue-water navy to demonstrate overwhelming naval power. By building large ships like battleships, aircraft carriers, and heavy cruisers, and organizing powerful fleets, we must completely seize command of the sea."
 HOL_submarine_effort_desc:0 "Submarines are effective at covertly attacking enemy fleets and cutting off supply lines. We must build large numbers of cutting-edge submarines to prevent enemy control of the sea and block their supplies."
 HOL_cruiser_effort_desc:0 "Cruisers are versatile ships that can perform various roles such as reconnaissance, patrol, escort, and fire support. We must build modern cruisers to increase the flexibility of naval operations."
 HOL_destroyer_effort_desc:0 "Destroyers are specialized in anti-submarine warfare, searching for and sinking submarines. We must build large numbers of cutting-edge destroyers to deal with the threat of enemy submarines and protect our fleet."
 HOL_capital_ships_effort_desc:0 "Battleships and aircraft carriers are the core of naval power. Only by securing and operating these capital ships can we seize true command of the sea. We must focus on building battleships and carriers of the latest design."
 HOL_industrial_effort_desc:0 "There is almost no industrial base in Indonesia. To conduct the war, expanding industrial capacity is urgent. We must build factories and increase production lines to smoothly supply military goods."
 HOL_construction_effort_desc:0 "To supplement the lacking industrial base, we must accelerate construction. By mobilizing as much labor and materials as possible, we must rapidly construct factories, military facilities, and infrastructure."
 HOL_production_effort_desc:0 "An increase in production is necessary. We must maximize the production of military supplies by increasing factory utilization and improving production processes. Efficiently deploying and mobilizing labor is also important."
 HOL_rubber_effort_desc:0 "Indonesia is the world's largest producer of natural rubber. Rubber is an essential strategic resource for war. We must expand rubber plantations and increase production for the war effort."
 HOL_infrastructure_effort_desc:0 "The poor infrastructure in Indonesia is a major obstacle to conducting the war. By extensively building roads, railways, ports, and airports, we must facilitate the transport of military supplies and the deployment of troops."
 HOL_infrastructure_effort_2_desc:0 "We must further expand Indonesia's infrastructure. By increasing military and production facilities and improving the overall infrastructure, we will enhance our war-making capabilities."
 HOL_production_effort_2_desc:0 "As the war drags on, the demand for military supplies is skyrocketing. Additional production expansion is required. We must foster heavy industry and expand production facilities to mass-produce war materials."
 HOL_construction_effort_2_desc:0 "We must further expand wartime construction capabilities. By significantly increasing construction personnel, introducing machinery, and increasing material production, we must be able to proceed with large-scale construction quickly."
 HOL_nuclear_effort_desc:0 "Nuclear weapons are the ultimate weapons of war. Although immediate combat deployment might be difficult, we must start a nuclear development plan to prepare for the future. Recruiting nuclear scientists and building research facilities will be the first step."
 HOL_extra_tech_slot_desc:0 "More investment in technology development is needed. We must increase research personnel and facilities to enhance research capabilities. We need to organize additional research teams dedicated to developing new technologies."
 HOL_secret_weapons_desc:0 "To win this war, we need groundbreaking new weapons. We must secretly embark on the development of secret weapons such as hypersonic vehicles, ICBMs, and biochemical weapons to overwhelm the enemy."
 HOL_political_effort_2_desc:0 "To solidify the wartime system, additional political efforts are necessary. We must accelerate propaganda and mobilization for national unity and a total war system, and strengthen emergency measures to concentrate national power."
 HOL_develop_indonesian_resources_desc:0 "Indonesia is a treasure trove of rich natural resources. We must extensively develop strategic resources like rubber, tin, and oil for the war effort. We must focus investment on resource development and build the necessary infrastructure."
 HOL_reclaim_homeland_desc:0 "Our ultimate goal is to recapture our homeland, the Netherlands. Based on victory in Indonesia, we must prepare for the operation to reclaim the homeland. It is a goal that must be achieved to give hope to the people and raise the morale of the army."
 HOL_indonesian_army_desc:0 "We must establish a local army composed of Indonesians. By selecting and training loyal Indonesians and arming them, we must raise a force capable of standing against the independence fighters."
 HOL_expand_indonesian_industry_desc:0 "To conduct the war, expanding Indonesia's industrial power is essential. Using local resources and labor, we must build military factories and significantly renovate and expand existing facilities."
 HOL_indonesian_military_industry_desc:0 "We must earnestly foster the Indonesian military industry. We must build numerous specialized factories capable of producing high-tech military goods, train skilled workers, and accelerate technology development."
 HOL_indonesian_naval_bases_desc:0 "We must build large-scale naval bases across Indonesia. By placing large port facilities, shipyards, and naval ports capable of handling fleet berthing, supply, and repair in strategic locations, we must strengthen our sea power."
 HOL_indonesian_air_bases_desc:0 "We must build large-scale air bases in various parts of Indonesia. By constructing large bases equipped with runways, hangars, and maintenance depots for the launch and maintenance of fighters and bombers, we must seize air superiority."
 HOL_indonesian_infrastructure_desc:0 "We must establish military infrastructure throughout Indonesia. By building military roads and railways, renovating ports and airports, and deploying supply depots and logistics bases, we must increase our war-making capabilities."
 HOL_indonesian_nuclear_program_desc:0 "We must promote a full-scale nuclear development program using Indonesia as a springboard. We must build a large-scale nuclear complex, secure uranium, and proceed with nuclear weapon design and testing to get our hands on the ultimate weapon."
 HOL_indonesian_rocket_program_desc:0 "We must accelerate rocket development in Indonesia. By building rocket launch sites and focusing on developing related technologies, we should aim to secure long-range rockets and space launch vehicles."
 HOL_seek_soviet_support_desc:0 "To reclaim our homeland, support from a great power is necessary. We must approach the Soviet Union and request all-around support in military, economic, and technical fields. In return, we may have to depart from our anti-communist line and become a socialist ally."
 HOL_soviet_industrial_support_desc:0 "We must actively utilize Soviet industrial support. By introducing Soviet industrial equipment and technology and inviting experts, we must push for the modernization of Indonesian industry."
 HOL_soviet_tank_designs_desc:0 "We must introduce Soviet tank designs. We will pursue the licensed production of excellent Soviet tanks like the T-34 and KV-1 and receive technical support from the Soviets to improve armor, firepower, and mobility."
 HOL_seek_american_support_desc:0 "To reclaim our homeland, support from a great power is necessary. We must approach the United States and request all-around support in military, economic, and technical fields. In return, we must maintain our anti-communist stance and become an ally of the free world."
 HOL_american_landing_craft_desc:0 "We must introduce American landing craft technology. To conduct large-scale amphibious operations, a large number of landing craft is required. We must focus on the licensed production and improvement of the latest American landing craft designs."
 HOL_usa_infnatry_support_desc:0 "We must receive support for infantry equipment. By introducing large quantities of American infantry equipment such as rifles, automatic rifles, and Bazooka anti-tank weapons, we must modernize our infantry strength."
 HOL_soviet_aircraft_designs_desc:0 "We must introduce aircraft designs. We will pursue the licensed production of excellent aircraft such as fighters, attackers, and bombers, and receive foreign technical support for performance improvements."
 HOL_soviet_naval_designs_desc:0 "We must introduce Soviet ship designs. We must acquire construction techniques for powerful Soviet vessels like the Kirov-class cruiser and Gangut-class destroyer, and increase our own building capabilities with Soviet technical support."
 HOL_soviet_research_cooperation_desc:0 "We must strengthen technical cooperation with overseas powers. We should jointly utilize research facilities, actively exchange scientists, and receive Soviet help in developing advanced technologies."
 HOL_american_industrial_support_desc:0 "We must actively utilize American industrial support. By introducing American industrial equipment and technology and inviting experts, we must push for the modernization of Indonesian industry."
 HOL_american_naval_designs_desc:0 "We must introduce American ship designs. We must acquire construction techniques for powerful American vessels like the Fletcher-class destroyer and Atlanta-class light cruiser, and increase our own building capabilities with American technical support."
 HOL_INS_war_idea_desc:0 "We have been driven from our homeland and ended up in a pitiful state, in exile in Indonesia. However, we will never despair. No matter what adversity faces us, we will fight and overcome, and we will surely return home."
 HOL_capital_support_desc:0 "The capitalists of Indonesia support us. They do not want Indonesian independence and wish for the maintenance of a colonial system like the Dutch East Indies Company. We will be able to endure thanks to their support."
 HOL_lack_of_industrial_base_desc:0 "Industrial infrastructure is almost non-existent in Indonesia. Most facilities are concentrated on agriculture and resource extraction. This will be a major hindrance to conducting the war. We must expand industrial capacity urgently."
 HOL_developing_industrial_base_desc:0 "We are putting all our effort into building an industrial base in Indonesia. Factory construction is being accelerated, and military production using local resources is gradually increasing. Soon, we will possess independent industrial capacity."
 HOL_communist_menace_desc:0 "Communist forces are rampant within Indonesia. They are becoming our greatest threat, inciting the masses under the banner of independence. If we do not thoroughly crush the communists' maneuvers, we will lose everything."
 HOL_war_of_retribution_desc:0 "We were driven out of Indonesia, but we have never forgotten. Now is the time to start the war of retribution. We will concentrate all our capabilities to conquer all of Indonesia and bring down the iron hammer on those who insulted us."
 HOL_homeland_liberation_desc:0 "Our ultimate goal is to recapture our homeland, the Netherlands. Based on victory in Indonesia, we must launch an operation to restore the mainland. That is the true reason we fight in this land."
 HOL_indonesian_resource_exploitation_desc:0 "We must maximize the use of Indonesia's rich resources. It is essential to mobilize locals to exploit resources from mines and plantations and use them for the war. Indonesia's resources will become our lifeblood."
 HOL_soviet_military_advisors_desc:0 "Soviet military advisors have arrived in Indonesia. They will guide the training and operations of our army. Even if our ideologies differ, there is much to learn in the military field. We must integrate the advanced military power of the Soviet Union."
 HOL_american_military_advisors_desc:0 "American military advisors have arrived in Indonesia. They will guide the training and operations of our army. The US military is the strongest in the world, and their advice will be invaluable. We must introduce advanced American tactics and equipment."
 HOL_american_resource_trade_desc:0 "We must expand resource trade with overseas partners. By exporting Indonesia's rubber, tin, and other goods, and importing strategic materials like oil and steel, we must support the war economy."
