 KAP_ame: "Ame"
 KAP_AME_DESC: "A mysterious girl who came with the Third Great Shift.\nMost of her daily routine consists of rolling around with a seal plushie and playing games.\nShe loves games, but due to a lack of experience, her skills are disastrous, and she hits rock bottom regardless of the genre.\nHowever, her technical prowess is the real deal; she can handle anything.\nFrom holographic drones to hacking, and even teasing her childhood friend E□□."
