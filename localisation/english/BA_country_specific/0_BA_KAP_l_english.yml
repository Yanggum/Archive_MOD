l_english:
#중점 제목 및 내용
 KAP_strengthen_the_central_secretariat:0 "Assessing the Current Situation"
 KAP_strengthen_the_central_secretariat_desc:0 "In 1936, a phenomenon known as the Great Shift struck the Academy City, causing us to fall into an otherworldly realm called Earth. We must quickly grasp the situation here."
 KAP_marxist_orthodoxy:0 "Agreeing with Koito's Opinion"
 KAP_marxist_orthodoxy_desc:0 "One day, a student from Shinkikan visited the Yunooka Dormitory temporary camp. \nThe student, Ashiharatsumori Koito, the current representative of Shinkikan elected during this Great Shift, argues that we must seek help from the strong powers located nearby, even if it means abandoning our own system for now. \nAgreeing with her logical point, Kohane joins hands with Koito and leaves the decision to the students' consensus."
 KAP_soviet_leadership:0 "Response from Across the Sea"
 KAP_soviet_leadership_desc:0 "It seems Koito was right. \nA reply has arrived from a nation across the sea known as 'Japan.' They wish to join hands with us in preparation for the 'otherworldly forces' that have suddenly appeared. \nThough we do not know their true nature,\nthis alliance will surely allow us to escape the crisis in this world."
 KAP_soviet_economic_aid:0 "Japanese Economic Aid"
 KAP_soviet_economic_aid_desc:0 "The relief supplies we requested from Japan have finally arrived. \nThe students send thunderous cheers to the outsider, Hirohito. With this foundation, \nwe are now prepared to face the threats that will inevitably come."
 KAP_internationalism:0 "Becoming One with Them"
 KAP_internationalism_desc:0 "Contact has arrived from Japan. They expressed their desire for us to fight together within the same faction. Since student support has already risen to an uncontrollable level, the alliance was formed in an instant. We are no longer alone in this world."
 KAP_agrarian_socialism:0 "Kohane's Assertion"
 KAP_agrarian_socialism_desc:0 "The Academy City is currently in great chaos. In this unfortunate situation where everyone is losing their reason, \nKohane—who grew up in the countryside and lived a humble life without even running hot water—quickly regains her composure and encourages the students. \nKohane claimed that unity is the only way to overcome this situation, and the students, desperate for a leader to rely on, follow in her footsteps."
 KAP_rectification_campaign:0 "Student Movement"
 KAP_rectification_campaign_desc:0 "The students have united under a single leader, and everyone has begun to exert their efforts to resolve the situation and tackle problems. For some reason, \nKohane feels a sense of hope that the future will be bright."
 KAP_maoism:0 "The Aspiring Girl, Kohane"
 KAP_maoism_desc:0 "Thanks to the unity of many students, the brilliant moments of the Academy City are gradually being reconstructed. Everyone moves as one, regardless of their background or status. Kohane \nbegins to dream of the city life she once longed for once again."  
 KAP_socialism_with_KAPnese_characteristics:1 "Academy City Unity"
 KAP_socialism_with_KAPnese_characteristics_desc:1 "We no longer distinguish between academies; we live a more bonded life than anyone else as a community moving under one academy and one goal. United under the name of the railway that once connected every place and every student, we take up the sword for the glorious reconstruction of Academy City Kapila. No one can divide us."
 KAP_proclaim_the_peoples_republic:0 "Academy City Kapila"
 KAP_proclaim_the_peoples_republic_desc:0 "Finally, all threats have been removed. Academy City Kapila has risen once more and proudly revealed itself to the world. \nMay the light of the Halo shine forever."
 KAP_socialist_market_economy:0 "Shining Halo\nBrilliant Blade"
 KAP_socialist_market_economy_desc:0 "When the blade emits a brilliant wave in the light of the halo, we shall march forward without fear."
 KAP_social_democracy:0 "Kaoru's Solution"
 KAP_social_democracy_desc:0 "Kaoru of the Manyoshu Dormitory discovers a missing fact amidst the chaotic situation following the Great Shift. The students of 'Uranotsukasa Dormitory' were nowhere to be found. Soon, Kaoru realizes that they had seized power after communicating with outsiders in the neighboring country of China... Having confirmed the facts, Kaoru now intends to persuade Uranotsukasa."
 KAP_coalition_government:0 "Academy Government"
 KAP_coalition_government_desc:0 "Kaoru successfully exchanged dialogue with 'Kuzunoha Rei,' the representative of the Uranotsukasa students. Currently, Uranotsukasa is equally chaotic, and according to locals, they have received information that 'a war may break out soon.' \nWe begin to slowly persuade Uranotsukasa to secure our position in this world and prepare for danger."
 KAP_purge_the_radicals:0 "Preaching to the Students"
 KAP_purge_the_radicals_desc:0 "To gain the support of the students, we have announced our cooperation with the students of Uranotsukasa. As all academies begin to unite, the students gradually cease their confusion and move toward the future."
 KAP_strengthen_the_left_wing_of_the_kmt:0 "Kaoru's Invisible Hand"
 KAP_strengthen_the_left_wing_of_the_kmt_desc:0 "While promoting cooperation with Uranotsukasa, Kaoru begins to move her hands busily yet secretly to gain support within China."
 KAP_remove_KAPang_kai_shek:0 "Rei's Abdication"
 KAP_remove_KAPang_kai_shek_desc:0 "Kuzunoha Rei gradually lost support in China to Kaoru. As Kaoru's support within the Academy Government soared toward the heavens, Rei stepped down from power in China and sought to join the union. Just as Kaoru planned, the moment all academies unite as one is just around the corner."
 KAP_literacy_programs:0 "Resumption of Classes"
 KAP_literacy_programs_desc:0 "Though the situation is unfavorable, the cessation of learning will surely lead to an irreversible path of regression. \nFor the sake of the future, we must pursue learning once again."
 KAP_land_redistribution:0 "Beginning of Reorganization"
 KAP_land_redistribution_desc:0 "Everyone is experiencing confusion due to the sudden situation. \nWe need time to think about what we need right now."
 KAP_KAPna_medical_university:0 "Advanced Education"
 KAP_KAPna_medical_university_desc:0 "Now that we have a surplus of material resources, \nit is time to expand the scope of our studies and crave endless knowledge."
 KAP_form_the_academy_of_sciences:0 "It's All Making Sense Now"
 KAP_form_the_academy_of_sciences_desc:0 "Damn it, Kohane, it's all making sense now." 
 KAP_enforce_the_three_rules:0 "Quelling Anxiety"
 KAP_enforce_the_three_rules_desc:0 "How many people can remain calm in this situation? \nUnless we pacify them, the fire will never be extinguished."
 KAP_permit_opium_trade:0 "Whipping for Persuasion"
 KAP_permit_opium_trade_desc:0 "Sometimes, a somewhat harsh method is necessary."
 KAP_ban_the_opium_trade:0 "Carrots for Unification"
 KAP_ban_the_opium_trade_desc:0 "To become perfectly one, there must be small rewards instead of just logic."
 KAP_abolish_the_land_rent:0 "Our Conclusion"
 KAP_abolish_the_land_rent_desc:0 "Even if our dormitories are different, in the end, we all came from the same Academy City Kapila. \nNo matter what anyone says, we are 'comrades' who crave learning together."
 KAP_the_yanan_base_area:0 "Establishing Infrastructure"
 KAP_the_yanan_base_area_desc:0 "It is a mysterious and unknown land, but we must establish a space to stay and live \nwhile we are here for things to work out."
 KAP_focus_on_KAPna:0 "Listening to the World"
 KAP_focus_on_KAPna_desc:0 "As resources become increasingly scarce, there seems to be no proper source of supply. \nHowever, if we interact with the locals, things might be easier than expected."
 KAP_exploit_the_weak_neighbours:0 "Learning Economic Models"
 KAP_exploit_the_weak_neighbours_desc:0 "The way we spend money and trade is far too outdated and closed off. To achieve better efficiency and more exchange, we need to refer to the methods of this other world."
 KAP_infiltration:0 "Movement According to Trends"
 KAP_infiltration_desc:0 "As a result of continuous interaction and conversation with the people here, it seems this world is currently in a nationwide struggle where each faction stakes its fate. Our students, who would rather die than be out of style, wouldn't pass this up."
 KAP_prepare_for_war_with_japan:0 "Refurbishing the Blades"
 KAP_prepare_for_war_with_japan_desc:0 "We were so focused on understanding the situation that we didn't notice our swords getting dull. \nIt's time to sharpen the blades once again."
 KAP_government_of_national_defense:0 "The Steel Red Hare"
 KAP_government_of_national_defense_desc:0 "It seems the people here also ride around on various vehicles. \nWe can't just walk everywhere forever!"
 KAP_confrontation_with_the_warlords:0 "Senbonzakura Scattering from the Sky"
 KAP_confrontation_with_the_warlords_desc:0 "One day, the shape of a bird never seen before was spotted in the sky. According to information obtained after inquiries, that is a steel bird called an 'airplane.' The people here are said to traverse the skies through it. It would be quite wonderful if we could create that bird too."
 #VK Project Easter Egg
 KAP_central_security_bureau:0 "A Mysterious Attraction"
 KAP_central_security_bureau_desc:0 "You have failed..."
 KAP_revolutionary_military_commission:0 "First Form: Water Surface Slash"
 KAP_revolutionary_military_commission_desc:0 "Whenever we go out to the sea for trade, we witness people and cargo being carried in abundance atop mysterious structures on the water. Is it finally possible \nto enjoy the elegance upon the waves?"
 KAP_central_military_commission:0 "Field Training"
 KAP_central_military_commission_desc:0 "Watching from the sidelines is no longer enough. It is time to \ndirectly learn, master, and utilize the technology of this place."
 KAP_peoples_liberation_army:0 "Individual Assignment"
 KAP_peoples_liberation_army_desc:0 "Though we once followed in their footsteps, it no longer fits our stride."
 KAP_peoples_volunteer_army:0 "Group Project"
 KAP_peoples_volunteer_army_desc:0 "There is so much to see and learn from the people here. \nSince we share quite a few similarities, we might make a good duo."
 KAP_anti_japanese_expedition:0 "A New Weapon"
 KAP_anti_japanese_expedition_desc:0 "To think a person could die with just a flick of a finger... \nWhile 'guns' are cowardly, they are certainly powerful..."
 KAP_provoke_japan:0 "The Great Age of Gunpowder"
 KAP_provoke_japan_desc:0 "Manpower, materials, corporations... The man who once blackmailed everything in this world. The Blackmail King, Park Byeong-rim. \nHis final words before death... drove people worldwide toward Pixiv. \n'My treasure? If you want it, I'll give it to you. \nGo look for it. I left all the futa in this world right there.' \nThe world enters the Great Futa Era."
 KAP_protracted_warfare:0 "Projectile Response Secret Measure"
 KAP_protracted_warfare_desc:0 "If it cannot be avoided, it shall be cut. \nEven bullets cannot deceive our eyes."
 KAP_peoples_war:0 "Human Tank"
 KAP_peoples_war_desc:0 "The saying 'the pen is mightier than the sword' often goes around, \nbut that's only because those who were directly struck by a sword have already left this world, \nso there's no one left to refute it."
 KAP_mobile_warfare:0 "Gunfire Shaking the Earth"
 KAP_mobile_warfare_desc:0 "A new weapon that easily surpasses the power of a gun. \nWith this level of firepower, it will be strong enough that a sword won't be able to block it."
 KAP_100_regiments_campaign:0 "Nayuta 7th Railway Authority"
 KAP_100_regiments_campaign_desc:0 "We have restored the railway authority that once took responsibility for our commute. \nBut now, it will work for our victory."
