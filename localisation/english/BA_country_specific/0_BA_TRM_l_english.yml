 TRN_mika_honor_activate: "§P$TRN_Mika_honor_decision_cat$§!가 활성화 됨"
 TRN_destroy_TVC: "반트리니티 저항 근절"
 TRN_destroy_TVC_cost: "£pol_power §H50§! £infantry_equipment_text_icon §H500§!"
 TRN_destroy_TVC_cost_blocked: "£pol_power §R50§! £infantry_equipment_text_icon §R1000§!"
 TRN_destroy_TVC_cost_tooltip: "결정 선택에 £pol_power §R50§! £infantry_equipment_text_icon §R1000§! 소모"
 TRN_Mika_honor_loop_decision: "무작위 만남"
 TRN_Mika_honor_loop_decision_desc: "당연한 말이지만, 미소노 미카 정권은 기존 호스트의 임기처럼 1년으로 제한되어 있지 않습니다. 그 임기는 신헌법이 보장하는 한도 내에서, 얼마든지 연장될 수 있습니다. 그렇기에 미소노 미카는 앞으로 수많은 만남과 정치적 접촉을 이어가게 될 것입니다."
 TRN_Mika_honor_loop_decision_tt: "§Y미소노 미카§!의 일상적인 사건들이 §Y발생§!합니다."
 TRN_honor_populist_policies: "대중주의 정책 통과"
 TRN_honor_populist_policies_desc: "이상적인 언변만으로는 사람들의 신뢰와 지지를 얻을 수 없습니다. 말보다 행동이 필요합니다. 우리는 가장 도움이 절실한 이들을 위해 실질적인 조치를 취할 것입니다. 가난한 이들에게는 기본 식료품 보조금을, 실업자와 대전이 당시 부상입은 전투병들, 복지 수급자들에게는 겨울철 연료와 식량을 구입할 수 있도록 공공 지원을 제공할 것입니다."
 TRN_honor_social_change: "사회 변혁"
 TRN_honor_social_change_desc: "'트리니티 사회주의'는 노동자와 자본가가 협력하는 계급협조와 협동조합주의를 기반으로 하며, 기독교적 교리에 따라 사회적 연대를 실현하려는 이념입니다. 그러나 이상과는 달리, 현실 속에는 여전히 독일국과 구체제의 잔재들이 곳곳에 남아 우리 앞길을 가로막고 있습니다. 이제 우리는 그 뿌리 깊은 유산들을 철저히 청산해야 할 때입니다."
 TRN_honor_spread_of_militarism: "군국주의 확산"
 TRN_honor_spread_of_militarism_desc: "트리니티의 대의를 실현하기 위해서는 게헨나에 대한 복수를 반드시 완수하고, 나아가 키보토스에서 가장 강력한 군대를 구축해야 합니다. 이를 위해 조기 군사 교육을 통해 차세대 구성원들에게 국가 방위의 중요성과 책임감을 심어주는 체계를 정립할 필요가 있습니다. 트리니티 사회 전반에 걸쳐 안보 의식을 강화하고, 단결된 힘으로 미래의 위협에 대응할 준비를 갖춰야 합니다."
 TRN_honor_technocrat: "기술관료 강화"
 TRN_honor_technocrat_desc: "근본적으로 일반 학생들이 국가를 경영하기란 매우 어렵습니다. 행정과 통치에는 단순한 열정만으로는 부족하며, 체계적인 사고와 검증된 충성이 필수적입니다. 그렇기에 우리는 이념적으로 검증된 충성심 높은 엘리트들을 정부 전반에 등용하여 행정의 전문성과 효율성을 끌어올려야 합니다."
 TRN_honor_new_curriculum_support: "교육과정 확대 지원"
 TRN_honor_new_curriculum_support_desc: "기존의 미션스쿨 중심 교육 방식에서 문화적 소양과 사회적 연대를 강조하는 새로운 교육과정은 많은 학생들에게 여전히 낯설게 다가옵니다. 익숙했던 체계가 바뀌자 일부는 혼란을 느끼기도 합니다. 그러나 이 변화는 단지 낯섦의 문제가 아닙니다. 적절한 교육이 시행된다면, 이러한 새로운 개념들도 학생들에게 자연스럽게 받아들여질 것이며, 결국에는 모교 트리니티의 정체성과 조화를 이루는 데 큰 역할을 하게 될 것입니다"
 TRN_honor_protection_of_the_Jewish_community: "유대인 공동체 보호"
 TRN_honor_protection_of_the_Jewish_community_desc: "유대인들은 독일국의 광기 속에서 오랜 세월 박해받아 온 민족입니다. '배후 증상설'과 같은 조작된 음모론은 유대인 공동체를 붕괴시키는 도구로 사용되었고, 사람들은 유대인이라는 이유만으로 폭력을 저지르고도 제대로 된 처벌조차 받지 않는 일이 비일비재했습니다. 이제는 이들에 대한 보호가야말로 진정한 '정의의 실현'이 될 것입니다."
 TRN_honor_utilize_the_church_authority: "시스터후드 권위 이용"
 TRN_honor_utilize_the_church_authority_desc: "시스터후드는 트리니티의 신앙적 정통성을 자처하며, [TRM.GetNameDef] 지역에서 구빈 활동과 사회봉사를 지속해오고 있습니다. 이들의 헌신적인 모습은 많은 학생들과 시민들의 존경을 받고 있습니다. 그러나 미소노 미카는 이러한 시스터후드의 도덕적 권위를 활용해 학생들 사이에 '트리니티 사회주의'라는 새로운 이념을 은밀히 퍼뜨릴 계획입니다. 물론 이는 정치적 중립을 지키겠다는 시스터후드 내부 규율을 정면으로 위반하는 일이 될 것입니다."
 TRN_honor_sovereign_dictatorship: "주권적 독재"
 TRN_honor_sovereign_dictatorship_desc: "카를 슈미트 선생의 이론에 따르자면, [TRM.GetNameDef]은 기존 질서를 유지하는 것을 넘어 새로운 헌법적 질서를 수립하고 새로운 국가의 형태를 창출하는 것을 목표로 합니다. 기존의 질서를 전복하고  새로운 사회 질서와 법체계를 구축해야 합니다. 공동체의 존재를 보존하겠다는 궁극적인 목적과 결단에 의해 정당화 될 수 있습니다. "
 
 trnhonor.1.t: "무인 병동에서의 도난 사건"
 trnhonor.1.desc: "\"흐아앙, 선배! 또 놓치고 말았어요.\"\n하나에가 울먹이며 말했다. \n\n\"괜, 괜찮아요 하나에 쨩 그래도 다친 사람은 없어서 다행인거 같네요….\"\n하나에의 등을 토닥이며 세리나가 위로하고 있다.\n\n\n\"으응, 그러니까 도난 사건과 관련해서 정의실현부의 도움이 필요하다는 거네?\"\n미카는 천천히 보고서를 읽어가며 혼잣말을 하고 있었다.\n\n미카는 문득 자신이 미네에게 했던 일을 떠올렸다. 미네의 말실수, 그리고 그로 인해 퍼부었던 독설.\n\n그 말을 듣고 있던 미네의 표정은 아직도 머릿속에 생생하게 남아 있었다.\n\n\"으응… 구호기사단 관련 일이면 자꾸 그 표정이 떠오른단 말이지…….\"\n\"으아아–! 정말로! 이럴 때일수록… 나기쨩이라면 어떻게 했을까…….\""
 trnhonor.1.a: "\"아무래도 도와주는 게 맞겠지. 응. 나기쨩이라면 분명 그렇게 했을 거야.\""
 trnhonor.1.b: "\"그래도 미네 쨩이 했던 말은 아직도 용서 못 하겠는걸? 도와줄 수는 없어.\""

 trnhonor.2.t: "정의실현부의 과잉진압 문제"
 trnhonor.2.desc: "\"꺄아악!\"\n\n\"소란 피우지 마! 계속 반항하면 험한 꼴을 보게 될 줄 알아!\"\n\n\"넌 그냥 학원에서 인질 협상금을 지불할 때까지 얌전히 여기 붙잡혀 있으면 되는 거야. 괜히 엉뚱한 생각하지 마!\"\n\n\"네? 트리니티 학원이랑 협상을 했다고요?\"\n\n\"앙? 당연하지! 벌써 연락은 끝났다고.\"\n\n\"아.. 안 돼!! 피해요!! 구석으로!!\"\n\n-콰아앙-!!\n\n\"키힛- 키헤헤헤헤헤-!\"\n\n\"히.. 히익! 다.. 다가오지 마! 크아악-!\"\n\n\"그래서 사람이 그렇게 찌그러졌다고..? 와.. 와오... 응. 진짜 무서운 여자네, 츠루기 쨩...\"\n\n사건 이후에도 트리니티 학생들을 노린 납치 범죄는 좀처럼 줄어들 기세를 보이지 않고 있습니다.\n평소처럼 티파티는 정의실현부의 츠루기를 협상가로 파견했지만, 그녀에겐 항상 과잉진압이라는 언론의 꼬리표가 따라붙고 있습니다.\n특히 이번 사건에서 납치범들의 상태가 언론을 통해 공개되자, 정의실현부는 강도 높은 비난에 직면했습니다.\n범인 중 한 명은 마치 구겨진 캔처럼 처참한 모습이었기 때문입니다.\n\n그나마 다행인 것은 인질 전원이 심각한 부상 없이 구조되었다는 점입니다.\n하지만 그 중 몇몇은 극심한 스트레스로 인해 PTSD를 호소하고 있습니다.\n구호기사단의 진단에 따르면, 최소 3주 이상의 안정이 필요하다고 합니다."
 trnhonor.2.a: "\"츠루기 쨩의 방식도 마음에 들지만, 문제가 발생 한다면 고쳐야 해.\""
 trnhonor.2.b: "\"아무리 그래도 납치범을 상대로 소란을 피우는 건... 딱히 신경 쓰지 않아도 될거 같은데?\""

 TRN_economic_evelopment_department: "학원경제개발부"
 TRN_economic_evelopment_department_desc: "학원경제개발부는 호스트의 명령에 따라 설립된, 학원의 경제를 전문적으로 관리-운영하는 조직입니다. 부장은 학원의 중장기 발전 전략을 수립하고, 다양한 경제 분야를 총괄하는 역할을 맡고 있습니다. 트리니티 종합학원이 넓은 부지를 상실한 상태에서, 학원경제개발부에는 그 어느 때보다 정밀하고 체계적인 계획이 요구되고 있습니다."
 TRN_Industrial_Regions: "[FROM.GetName] 산업지구 조성"
 TRN_ammo_factory_decision: "군수 공장에 투자 확대"
 TRN_air_factory_decision: "트리니티 항공 엔진 및 무기 사업"
 TRN_design_bureau_and_arsenal_expansion: "에덴 설계국 및 조병창 자금 지원"
 TRN_takeover_of_german_tank_factories: "독일 전차 공장 장악"

 
 TRN_economic_plan_cat: "트리니티 산업 계획"
 TRN_economic_plan_cat_desc: "사태 발생 이후 이어진 경제 위기, 축소된 학원 부지, 무너진 사회 질서, 그리고 하락세를 보이는 각종 경제 지표는 티파티 호스트의 보다 적극적인 경제 개입을 요구하고 있습니다. 다가올 위기에 대비하기 위해서는 방대하고 체계적인 산업 개발이 반드시 추진되어야 하며, 이는 모교의 안정과 회복을 위한 핵심 과제가 될 것입니다."
 TRN_industry_deicision_active: "다른 곳에서 산업 계획이 진행되고 있습니다."
 TRN_Infrastructure_Development: "[FROM.GetName] 기반시설 재건설"
 TRN_Infrastructure_Development_desc: "대전이 사태로 기반시설이 붕괴한 가운데, 구시대 독일국이 남긴 낡은 아스팔트 도로는 트리니티의 주요 차량 운용에 적합하지 않습니다. 이에 따라, 노후된 인프라를 전면적으로 교체하는 대규모 토목 사업의 필요성이 제기되었습니다. 새롭게 구축될 고속도로망은 평시에는 민간의 편의를 높이고, 전시에는 군용 차량의 신속한 전국 이동을 가능하게 해 줄 것입니다."
 TRN_Infrastructure_Development_active_flag: "기반시설이 다른 주에서 건설되고 있습니다."
 TRN_Peat_Extraction: "북부 황야 지역 토탄 채굴"
 TRN_Peat_Extraction_desc: "북부 지역에는 수많은 습지, 늪지, 황무지가 있습니다. 이 곳은 원래 사람이 살지 않았지만 개척이 되면서 사람들이 살기 시작했고 이러한 개척을 통해 우리는 이 지역의 경제적 잠재력에 대해 알 수 있습니다.  황무지는 땅에서 파내 지역 산업과 개인 가정에 보조 연료로 사용할 수 있는 석탄이나 목재의 저품질 대체 연료인 토탄의 훌륭한 공급원입니다."
 TRN_Opelwerk_Brandenburg: "오펠부르크 브란덴부르크 인수"
 TRN_Opelwerk_Brandenburg_desc: "독일의 주요 자동차 제조업체였던 오펠부르크 브란덴부르크는 1920~1930년대에 걸쳐 꾸준히 성장했으나, 대전이 사태의 직격탄을 맞으며 심각한 타격을 입었습니다. 그러나 이들이 보유한 자동차 제조 기술은 여전히 혁신적이며, 만약 이를 인수하여 국영 기업으로 전환한다면, 수천 대의 트럭을 생산할 수 있는 기업을 확보할 수 있을 것입니다."
 TRN_Lehnmuhle_Dam: "작센 댐 재건"
 TRN_Lehnmuhle_Dam_desc: "대전이 사태 당시 주요 격전지 중 하나였던 작센에서는 치열한 전투 끝에 댐이 붕괴되어 대규모 침수 사태가 발생했습니다. 트리니티의 티파티 호스트와 각 분파 임원들은 이 지역의 댐 재건을 최우선 과제로 삼았으며, 특히 동부 에르츠산맥 일대에서 끊임없이 발생하는 홍수와 현지 전력 공급원에 대한 수요가 급증하고 있음을 강조했습니다."
 TRN_Basis_Scholar_development: "바시스 스콜라 개발"
 TRN_Basis_Scholar_development_desc: "바시스 스콜라는 구호기사단의 빠른 대응 덕분에 독일군의 공격으로부터 큰 피해를 면할 수 있었습니다. 이들의 집요한 노력은 주민들로 하여금 현 정부에 깊은 신뢰와 우호감을 갖게 만들었고, 이는 지역 안정에 크게 기여하고 있습니다. 이제 이 지역과 연계한 산업 계획을 추진한다면, 보다 빠른 공업화를 실현할 수 있을 것입니다. 특히 오데르 강과의 인접성은 물류와 자원 수송 측면에서 큰 이점으로 작용할 것입니다."
 TRN_Kimigayama_shipbuilding_plant: "키미가야마 조선소"
 TRN_Kimigayama_shipbuilding_plant_desc: "새로운 해양은 트리니티의 조선 산업에 신선한 활력을 불어넣기에 충분하며, 이는 조선소에 대한 대규모 투자를 요구합니다. 그러나 이러한 투자는 결코 헛되지 않을 것입니다. 충분한 자본과 자원이 투입된다면, 이들이 가져올 경제적-전략적 보상은 가늠하기 어려울 만큼 클 것입니다."
 TRN_Stettin_heavy_industry: "[63.GetName] 항공 사업"
 TRN_Stettin_heavy_industry_desc: "[63.GetName] 지역은 북해와 인접해 있어, 북동유럽을 향한 공중 작전과 해상 통제에 탁월한 지리적 이점을 갖고 있습니다. 이에 따라 지역 당국과 협력해 대규모 공항을 건설하고, 본격적인 항공 산업 기반을 다질 계획입니다."
 TRN_dessert_shop_expansion: "디저트 가게 확충"
 TRN_dessert_shop_expansion_desc: "지도자는 늘 끊임없이 사고해야 하고, 사고에는 고열량의 에너지가 필요합니다. 자연스럽게, 인간은 이 모든 조건을 만족시키면서도 달콤하고 잠시나마 근심을 잊게 해주는 무언가를 찾게 됩니다. 바로 디저트입니다."
 TRN_agricultural_support: "[FROM.GetName] 농업 지원"
 TRN_katowice_mining: "[FROM.GetName] 광업 확대"

 TRN_trinity_world_cat: "트리니티와 세계"
 TRN_trinity_world_cat_desc: "트리니티는 현재 세계로부터 고립되어 있으며, 이는 충분히 외교적 노력으로 극복 가능한 문제입니다. 그러나 지정학적 요인은 여전히 우리를 옥죄고 있으며, 이 복합적인 위기는 외교를 시작으로 하나씩 해결해 나가야 합니다. 우리는 결코 좌절하지 않습니다."
 TRN_lend_our_support: "우리의 지원 빌려주기"
 TRN_international_propaganda: "국제 선전"
 TRN_international_propaganda_tt: "획득한 정치력의 양은 공장 수에 따라 결정됩니다."
 TRN_border_fortifications: "국경 요새화"
 TRN_anti_pandemonium_society: "[GEM.GetNameDef] 권위 폄하"
 TRN_create_pro_trinity_group: "[GEM.GetAdjective] 지역 독일인 동요"
 TRN_pandemonium_society_approach_club_Hot_Springs_Department: "온천개발부에 접근"
 TRN_pandemonium_society_approach_club_Gourmet_Research_Society: "미식연구회에 접근"
 TRN_prefect_team_discipline_decline: "[GEH.GetNameDef] 규율 훼손"

 TRN_romania_give_the_oil: "루마니아 유전지대 확보"
 TRN_romania_give_the_oil_desc: "트리니티의 산업, 차량, 그리고 전쟁기계들이 원활하게 가동되기 위해서는 석유가 필요합니다. 루마니아의 유전 지대는 우리의 수요를 충족시킬 수 있는 충분한 공급량을 보유하고 있습니다. 그러나 루마니아 정부는 우리에게 비협조적인 태도를 보이고 있으며, 이러한 상황을 타개하기 위해서는 무력의 사용이 요구됩니다."
