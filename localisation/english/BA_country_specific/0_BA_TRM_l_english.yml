 TRN_Recovering_aftermath_desc: "기업과 협력"
 TRN_Contract_with_Mauser_desc: "독일의 산업 기술은 마치 의도한 것처럼 군수 공장을 대규모로 건설하는 데 특화되어 있었습니다. 이는 트리니티에게 매우 유리한 소식으로, 이 기술을 활용해 군수 공장을 대거 건설할 수 있게 되었습니다."
