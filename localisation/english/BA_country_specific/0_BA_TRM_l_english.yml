 TRM_industrial_region_state_desc: "이 주의 산업은 현재 학원경제개발부에 의해 관리되고 계획되며, 도시 및 농촌 행정은 에덴이 직접 임명하는 단일 지사 아래 중앙집권화되어 있습니다."

 

