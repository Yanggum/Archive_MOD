 TRN_yungu_e_tuja: "도서부 지원"
 TRM_Library_Committee: "도서부 협력 강화"
 TRM_Library_Committee_desc: "도서부 협력 강화"
 TRN_gyungje_hyu_ul_bub: "계획경제"
 TRN_gunsu_sangsan_bub: "군수생산법"
 TRN_jaegun_wanryu: "산업 호황"
 TRN_gwanryuje_jaijungbee_desc: "미소노 미카가 정권을 잡는 과정에서, 수많은 트리니티의 고참 관료들이 해임되었습니다. 이로 인해 현재의 관료 조직은 경험 부족으로 인해 비효율성이 만연하고, 체계적 운영이 어려운 상황에 처해 있습니다. 지금의 관료들은 실무 경험이 부족한 신참들로 채워져 있으며, 그 결과로 행정적 혼란과 운영상의 문제가 발생하고 있습니다. 이러한 비효율을 바로잡고 조직을 재정비하기 위해서는, 체계적이고 심도 있는 관료 조직의 재구성이 필수적입니다."
 TRN_yungu_e_tuja_desc: "도서부 지원"
 TRN_gyungje_hyu_ul_bub_desc: "계획경제의 도입으로 기존의 미숙하고 혼란스러운 관료 조직들이 점차 체계화되고, 더 높은 전문성을 갖추게 되었습니다. 이 과정은 자원의 효율적 배분과 명확한 목표 설정을 통해 조직의 역량을 강화하는 데 중점을 두었습니다. 결국, 각 부처는 점차 자신의 역할에 맞는 전문성을 확보하게 되었고, 조직 전체의 생산성과 일관성이 크게 향상되었습니다"
 TRN_gunsu_sangsan_bub_desc: "군수생산법은 축소된 군수 산업을 회복시키고, 관료 조직과 협력하여 더 실용적이고 효과적인 생산 방안을 모색하는 데 중점을 둘 것입니다. 이를 통해 군수 산업의 재건과 함께 효율성을 높일 수 있는 체제를 구축하고자 합니다. 또한, 기존 독일계 장관들과 협력하여 이 법안의 실행을 위한 효율적인 관리 구조를 마련하고, 보다 안정적이고 지속 가능한 생산 체계를 확립할 것입니다."
 TRN_jaegun_wanryu_desc: "산업 호황"
