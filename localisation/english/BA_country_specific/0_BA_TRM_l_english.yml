 TRM_Trinity_Grande_Armee: "Trinity Grande Armée"
 TRM_Trinity_Grande_Armee_desc: "Through conducting numerous wars, soldiers with rich combat experience have become many in Trinity. This combat experience became an excellent manual, and based on the manual, professional soldiers and officers appeared in Trinity.\n\nWhile Trinity established itself as the final victor and consolidated hegemony over Europe, the Grande Armée did not stop developing. Through constant dispatch and intervention, they are collecting combat experience and various information, and have also equipped facilities for professional education.\n\nThe Grande Armée is the predecessor of Trinity and the group that led Trinity to victory. No matter what anyone says, the Grande Armée's strength and continuous development are facts no one can deny."
