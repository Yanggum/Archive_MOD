 TRN_shalle_protect_in_trinity_desc: "샬레 보호"
 TRN_68_go_back_to_gehenna_desc: "흥신소68은 엄연한 게헨나의 일부이지만, 합중국에 참여하지 않고 독단적인 행동을 나섰습니다. 이를 타파하기 위해 무력으로라도 그들을 제압해야만 합니다."
 TRN_war_with_knight_templar_desc: "기사단"
 TRN_bbul_evils_nomore_desc: "아비도스 고등학교는 최근 큰 위기를 겪어왔으며, 아비도스가 이러한 야생에서 홀로 자립하기란 꽤나 어려운 일일 것입니다. 그렇기에, 우리는 친히 아비도스에 '보호'를 제안할 것입니다."
 TRN_sisterhood_army_desc: "성도회의 후예"
 TRN_relief_knights_army_desc: "전선의 어머니들"
