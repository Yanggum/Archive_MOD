 TRN_idk_polish_getout_desc: "멍청한 폴란드인들은 여전히 우리의 영토를 넘보려 들고 있습니다. 그 오만하고 거만한 자세를 친히 고쳐 주어야 할 필요가 있습니다."
 TRN_communists_getout_desc: "북쪽과 동쪽의 악마들은 거센 바람에 흔들리는 연합의 국기를 갈기갈기 찢어버리고 자신들의 국기를 계양할 생각으로 가득 차 있습니다. 그 위협을 먼저 제거해야 합니다."
 TRN_first_we_need_practice_desc: "게헨나는 이제 우리들의 새로운 친구들입니다. 그 말은, 더 많은 친구들이 생겼고, 더 많은 친구들과 더 많은 놀면서 하루를 보낼 수 있다는 뜻입니다."
 TRN_second_testing_for_united_safety_desc: "트리니티의 자경단과 게헨나의 선도부는 하나로 합쳐져 연합을 수호하기 위해 오늘도 움직입니다. 덕분에 연합은 범죄와 혼돈의 마수로부터 한층 더 안전합니다."
