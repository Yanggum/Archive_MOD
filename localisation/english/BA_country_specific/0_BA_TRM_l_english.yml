 TRN_inefficient_bureaucracy_idea_desc: "대체 인력의 미숙함으로 인해 발생했던 행정 문제가 해결되었습니다. 가장 효율적이고 확실한 해결책인 시간이 우리 인력들의 전문성을 향상시켜주었습니다. 미소노 미카와 그녀의 행정부는 이제 가장 애국적이고 충성심 강하며 전문적인 자들에 의해 작동합니다. 잘 끼워맞춰진 톱니바퀴는 트리니티의 발전을 위해 오늘도 열심히 돌아가고 있습니다."
 TRN_Inefficient_bureaucracy: "행정 처리: §R미숙함§!" 
 TRN_Inefficient_bureaucracy_desc: "이제 트리니티 내부에 미소노 미카와 그녀의 숭고한 대의를 방해할 존재는 남아있지 않습니다. 그녀는 자비롭게도 자신에게 불온한 생각을 가진 자들이 '적절한' 방법을 통해 어머니 자연으로 돌아가는 것을 허락했습니다. 하지만 애석하게도 무능한 반역자들의 빈자리는 우리의 생각보다 많은 문제를 일으켰습니다. 정부의 행정력을 복원하기 위해 그 빈자리를 충성파들로 채우고 있지만, 그들이 숙련되어 이전과 같은 행정력을 보여주기에는 시간이 필요해 보입니다."
