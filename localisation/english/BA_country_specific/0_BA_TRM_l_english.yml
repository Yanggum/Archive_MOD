 TRN_nagisa_gyehek_desc: "키리후지 나기사는 자신의 정치력을 최대한 발휘하여, 티파티와 트리니티가 붕괴하는 걸 막고자 스스로 철과 같은 여인이 되어 철통정치를 이어나갈 것입니다."
