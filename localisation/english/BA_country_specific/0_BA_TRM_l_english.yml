 TRM_Last_Focus_trigger_tt: "§YAll Academies§! are occupied by [ROOT.GetAdjective]"
 TRM_anti_gehenna_focus_1: "Crush the Resistance"
 TRM_anti_gehenna_focus_1_desc: "The organized guerrilla activities of Gehenna students are becoming a major threat to the government. To crush this, the government plans to deploy troops to each region and focus attacks on major strongholds. We will dismantle their organization through precise intelligence gathering and powerful military operations, quickly ending the chaos."
 TRM_anti_gehenna_focus_2: "Wipe Out Gehenna Resistance"
 TRM_anti_gehenna_focus_2_desc: "Viewed positively, Gehenna Academy students are free spirits, but viewed negatively, they are terrorists who threaten the system. Even after their academy's defeat, they do not accept the results and are active as resistance fighters against Trinity. Now we must thoroughly wipe them out, control them, and put effort into stabilizing the system."
 TRM_anti_gehenna_focus_3: "Establish Military Administration"
 TRM_anti_gehenna_focus_3_desc: "Guerrilla activities by Gehenna students still show no sign of stopping. They reject government control and continue resistance in each region. To suppress this, it would be effective to deploy soldiers to each region and implement military rule. If we respond quickly and powerfully through a military government system, we expect to suppress guerrilla activities early. The use of military force will play an important role in minimizing chaos and restoring government authority."
 TRN_gwanryuje_jaijungbee: "Bureaucracy Realignment"
 TRN_yungu_e_tuja: "Support the Library Committee"
 TRM_Library_Committee: "Strengthen Library Committee Cooperation"
 TRM_Library_Committee_desc: "Strengthen Library Committee Cooperation"
 TRN_gyungje_hyu_ul_bub: "Planned Economy"
 TRN_gunsu_sangsan_bub: "Military Production Act"
 TRN_jaegun_wanryu: "Industrial Boom"
 TRN_gwanryuje_jaijungbee_desc: "In the process of Misono Mika seizing power, many senior Trinity bureaucrats were dismissed. As a result, the current bureaucratic organization is rife with inefficiency due to lack of experience, and it is in a situation where systematic operation is difficult. Current bureaucrats are filled with novices lacking practical experience, resulting in administrative confusion and operational problems. To correct this inefficiency and reorganize the organization, a systematic and in-depth restructuring of the bureaucratic organization is essential."
 TRN_yungu_e_tuja_desc: "Support the Library Committee"
 TRN_gyungje_hyu_ul_bub_desc: "With the introduction of the planned economy, existing immature and chaotic bureaucratic organizations have gradually become systematized and have acquired higher expertise. This process focused on strengthening organizational capabilities through efficient resource allocation and clear goal setting. Ultimately, each department gradually secured expertise suitable for its role, and the productivity and consistency of the entire organization have greatly improved."
 TRN_gunsu_sangsan_bub_desc: "The Military Production Act will focus on restoring the downsized defense industry and seeking more practical and effective production methods in cooperation with the bureaucratic organization. Through this, we aim to build a system that can increase efficiency along with the reconstruction of the defense industry. Additionally, we will work with existing German-affiliated ministers to prepare an efficient management structure for the execution of this bill and establish a more stable and sustainable production system."
 TRN_jaegun_wanryu_desc: "Industrial Boom"
 TRN_nagisa_gyehek: "Unprovable Problem"
 TRN_nagisa_gyehek_desc: "Kirifuji Nagisa will exercise her political power to the fullest, becoming an 'Iron Lady' herself to continue an iron-fisted rule to prevent the collapse of the Tea Party and Trinity."
 TRN_Suppressing_mika: "Suppress Mika"
 TRN_please_shut_up: "Crush the Pater"
 TRN_Non_trinity_getout: "Exclude External Threats"
 TRN_Hug_students: "Public Speech"
 TRN_anti_mika_cudeta: "Palace Coup"
 TRN_steel_of_woman: "Iron Lady"
 TRN_united_academy: "Academy of Steel"
 TRN_uber_alles: "Trinity Supremacy"
 TRN_Have_hand_to_gehhenna: "Gehenna Issue"
 TRN_arius_gotta_out: "Obey or Die"
 TRN_Arius_gonna_trinity: "Arius Unification"
 TRN_Arius_gonna_trinity2: "Arius Submission"
 TRN_Arius_perfect_trinity: "Trinitization of Arius"
 TRN_sisterhood_army: "Descendants of the Justina Council"
 TRN_relief_knights_army: "Mothers of the Frontline"
 TRN_have_with_hynjiens: "Contact with Locals"
 TRN_Arius_problem_nagisa: "Confirm Arius Rumors"
 TRN_Arius_problem_nagisa_desc: "An ominous omen has appeared in Trinity. To determine whether this is a simple coincidence or due to someone's intervention, we must begin an investigation."
