 TRN_trinitarian_factionalism_flag: "§Y$TRN_trinitarian_factionalism$§! 중점 완료"
 TRN_trinitarian_factionalism: "트리니티 파벌주의"
 TRN_trinitarian_factionalism_desc: "트리니티의 수 많은 파벌은 우리가 잘 조정함에 따라 장기적으로 더 유용하게 이용할 수 있을 것입니다."
 TRN_return_of_yuriy_seya: "유리조노 세이아의 복귀"
 TRN_return_to_host_position: "호스트 직 복귀"
 TRN_suppressing_anti_trinity_forces: "반트리니티 세력 축출"
 TRN_vision_for_the_future: "미래를 보는 눈"
 TRN_restoration_of_the_sanctus_faction: "상투스 분파 재건"
 TRN_support_for_the_sisterhood: "시스터후드 후원"
 TRN_strengthening_the_filians_faction: "필리우스 분파 강화"
 TRN_support_for_the_johannine_faction: "요한 분파 지원"
 TRN_the_sword_guarding_the_trinity: "트리니티를 지키는 검"
 TRN_the_balance: "파벌 균형"
 TRN_restructuring_of_the_paters: "복원된 파테르 분파"
 TRN_defensive_nationalism: "방어적 국가주의"

 TRN_KRUPP_steel_desc: "크루프는 독일의 철강 및 군수산업으로 유명한 기업이었습니다. 특히 이들의 야포 기술력은 매우 뛰어나, 독일 군대가 사용하던 야포의 대부분이 이 회사에서 제작된 것이었습니다. 따라서 이들에게 보조금을 지원하며 전폭적으로 협력한다면, 그에 상응하는 높은 품질의 제품을 제작할 가능성이 높습니다."
 TRN_Siemens_grant_desc: "대전이의 여파로 많은 도로와 철도가 뒤틀렸습니다. 우리는 이 문제를 해결하기 위해 트리니티의 역량을 동원해 온전한 기반 시설을 복원할 것입니다."
 TRN_Autobahn_desc: "아우토반 건설"
 TRN_KRUPP_ZIP_III_desc: "ZIP"
 TRN_military_industrial_complex_desc: "우리의 군사력을 신속히 강화하기 위해 정부는 방위산업체와의 긴밀한 협력을 통해 보다 효율적이고 빠르게 군사 장비를 생산해야 합니다. 이를 위해 정부는 방위산업체에 대한 지원을 확대하고, 생산 공정의 최적화와 기술 개발에 집중할 것입니다."
 TRN_Recovering_the_aftermath_desc: "여파 회복"
 TRN_yurijono_seia_ser: "조사"
 TRN_yurijono_seia_ser_desc: "유리조노 세이아 피격 사건은 티파티와 트리니티를 뒤흔들기 충분했으며, 역사상 최초로 티파티 임원이 공격을 받는 사건입니다. 이러한 중대한 사건을 가만히 덮고 가기엔 너무나 큰 무리가 오니, 트리니티의 경찰력을 총동원해 범인을 색출 해낼것입니다."
 TRM_TURIJONO_SEIA_TT: "§L우리는 범인을 찾기 위해 수사에 박차를 가할 것입니다.§!\n§Y키리후지 나기사§!(이)가 티파티의 호스트가 아니라면, 티파티의 호스트가 됩니다."
 TRM_JoJo_mika: "하이드리히 제거"
 TRM_JoJo_mika_desc: "트리니티의 정의실현부는 NSDAP와의 접촉 과정에서 전에는 알지 못하는 여러 비밀에 접근할 수 있었습니다. 풀리지 않던 의문이 가득하던 유리조노 세이아 피격 사건의 진상을 찾아낼 수 있었으며, 그 배후에는 우리가 협력자라고 생각하던 라인하르트 하이드리히가 존재했습니다."
 TRN_yurijono_seia: "중대한 문제"
 TRN_yurijono_seia_desc: "큰 일이 벌어졌습니다. 유리조노 세이아가 누군가에게 의하여 피격당하는 사건이 일어났습니다. 유리조노 세이아는 현재 의식불명인 상태이고 현재 병원에 입원 해있습니다."
 TRN_threat_up_of_europa: "유럽 긴장 고조"
 TRN_threat_up_of_europa_desc: "유럽 긴장"
 TRN_trinity_arius_gaebal: "아리우스 통합"
 TRN_trinity_arius_gaebal_desc: "아리우스 통합"
 TRN_totar_war_focus: "총동원령"
 TRN_totar_war_focus_desc: "총동원령"
 TRM_domination: "지배"
 TRM_domination_desc: "지배"
 TRN_justice_task_force_training: "트리니티 군국주의"
 TRN_justice_task_force_training_desc: "트리니티 군국주의"
 TRN_radio_propaganda: "라디오를 통한 세뇌"
 TRN_radio_propaganda_desc: "라디오를 통한 세뇌"
 TRN_kickstart_the_civilian_industry: "중공업"
 TRN_kickstart_the_civilian_industry_desc: "내부 문제를 회복하거나, 외부의 위협에 대비하려면 중공업 설비를 재편하는 것은 필수적입니다."
 TRN_kickstart_the_autoban: "고속도로 건설"
 TRN_kickstart_the_autoban_desc: "잘 정돈된 고속도로는 물자와 군대의 수송, 보급 등에 유용하게 사용됩니다. 관계자들 사이에서 '트리니티아우토반'이라 불린 이 계획은 튀링켄부터 그디니아까지 이어지는 거대한 고속도로 건설 계획입니다."
 TRN_civilian_industry: "산업 투자"
 TRN_civilian_industry_desc: "군대의 질과 양을 올리고 그들이 요구하는 물자를 계속해서 공급하기 위해 우선 산업에 투자하여 이들이 요구하는 물자를 충분히 갖추도록 노력해야합니다."
 TRN_research_slot: "연구실 확장"
 TRN_research_slot_desc: "경제 타격의 여파에서 벗어난지 오랜 시간이 지났습니다. 그간 뒤쳐진 과학기술의 발전을 위해 연구실을 정비하고 확장해야 합니다."
 TRN_railway_focus: "트리니티 철도사업"
 TRN_railway_focus_desc: "대전이의 여파가 남아있는 독일에는 파괴된 철도들이 아직 많이 남아있습니다. 철도사업체를 만들고 지원하여 독일인들의 불만을 잠재우고 관심을 다른 곳으로 돌릴 수 있습니다."
 TRN_sipjagunjeongsinbuhwal: "성전 기사단"
 TRN_sipjagunjeongsinbuhwal_desc: "성전 기사단"
 TRN_gisauihon: "기사의 혼"
 TRN_gisauihon_desc: "기사의 혼"
 TRM_naechi: "내부 문제 처리"
 TRM_naechi_desc: "대전이 이후 크게 심화된 학원 내부의 불안은 미소노 미카와 트리니티 전체에 대한 음모를 꾸미고 있는 단체가 있다는 것을 명백히 보여줬습니다. 우리는 몇 명의 공모자들을 붙잡고 심문하여 단체를 찾아내고 음모가 암처럼 퍼지기 전에 도려내야만 합니다."
 TRM_oetzi: "[TRM.GetAdjective] 외교 정책 재구성"
 TRM_oetzi_desc: "기존의 트리니티 외교 정책은 주변 학원들의 분쟁을 중재하고, 키보토스 학원과의 관계를 안정시키는 데 초점이 맞춰져 있었습니다. 이 타협 체제는 이상적이긴 했지만, 대전이 사태를 계기로 그 한계가 여실히 드러났습니다. 미소노 미카가 집권한 이후, 이 체제는 점점 유명무실해졌고, 더는 효과적인 방안으로 작용하지 못하고 있습니다. 지금이야말로 과감히 나약한 외교 정책을 폐기하거나, 보다 강력하고 현실적인 방향으로 수정해야 할 때입니다."
 TRN_railway_gun_focus: "열차포 동원"
 TRN_railway_gun_focus_desc: "폭격기의 등장으로 많은 열차포들이 적재소에서 먼지만 휘날린 채 남아있습니다. 비록 많은 전문가들이 열차포의 시대는 지났다고 말하지만, 대전이의 타격이 가지 않은 유럽에서 열차포들은 효과적인 파괴 수단이 될 수 있습니다."
 TRN_GO_TO_EAST: "동방 진출"
 TRN_GO_TO_EAST_desc: "우린 소련으로 간다!!"
 TRN_Uranprojekt: "우라늄 계획"
 TRN_Uranprojekt_desc: "핵분열을 처음으로 발견한 화학자 중 한 명인 오토 한은 우란프로옉트의 담당 화학자였습니다. 그를 고용하고 더 많은 예산을 투자해 2차 우란프로옉트를 실행한다면 다른 나라들보다 먼저 핵무기를 완성할 수 있을 것입니다."
 TRN_Fission: "핵분열 관측"
 TRN_Fission_desc: "우리 이전에 존재했던 독일이라는 나라에서는 '우란프로옉트' 라는 이름의 핵무기 개발 프로젝트가 존재하였습니다. 이를 이용한다면 우린 세계를 재패할 기적의 무기를 만들 수 있을 것입니다."
 TRN_Fission_tt: "§Y핵분열§!이 관측됨에 따라 §Y지도부는 결정§!을 내릴 것입니다."
 TRM_OTTO_HAN_EVENT: "§Y핵분열§!이 관측 됨"
 TRN_Uranprojekt_name: "우라늄 계획"
 TRN_Uranprojekt_2: "원자로 건설"
 TRN_Uranprojekt_2_desc: "핵반응에 필요한 우라늄의 임계질량을 측정하려면 원자로의 건설이 필수적입니다. 원활한 실험을 위해 원자로의 건설을 진행해야 합니다."
 TRN_Uranprojekt_3: "눈부신 섬광"
 TRN_Uranprojekt_3_desc: "오토 한 박사와 핵물리학자들의 연구실에서 눈부신 섬광이 관측되었습니다. 이 현상은 이들의 실험이 성공적으로 끝났다는 뜻이며, 곧 있으면 전쟁을 끝낼 새로운 병기가 탄생할 것입니다."
 TRN_Uranprojekt_4: "발사체 연구"
 TRN_Uranprojekt_4_desc: "핵 실험이 성공적으로 진행되고 있는 가운데, 새로운 무기를 쏘아올리기 위한 장치의 개발 또한 대두되고 있습니다."
 TRN_Uranprojekt_5: "트리니티 실험"
 TRN_Otto_han_tt: "§Y오토 한§!(이)가 조언가가 됩니다."
 TRN_Ausgleich: "대타협"
 TRN_Ausgleich_desc: "대타협"
 TRN_united_state_Eden: "에덴 합중국"
 TRN_united_state_Eden_desc: "에덴 합중국"
 TRN_Eden_union: "에덴 연방"
 TRN_Eden_union_desc: "에덴 연방"
 TRN_jachiejeopgeun: "자치에 접근"
 TRN_seondobuwageorae: "선도부와 거래"
 TRN_dongari_tonghap: "동아리 통합"
 TRN_ireumppuni_anin_yeonbang: "이름뿐만이 아닌 연합"
 TRN_oebureulhyanghayeo: "외부를 향하여"
 TRM_Trinity_socialism: "트리니티 사회주의"
 TRM_Trinity_socialism_desc: "사실 트리니티 학생은 사회주의자들의 사악한 무정부주의가 아니라 공동체 의식, 규율, 생산성, 국가를 위해 모든 것을 바치는 자기 희생을 통해 본질적으로 사회주의자입니다. 이를 새 정권의 이념으로 삼아야 합니다. 새로운 트리니티에서는 기업과 노동자 모두가 공동의 이익을 위해 일할 것입니다."
 TRN_Reichland_Solution: "트리니티 해결책"
 TRN_Reichland_Solution_desc: "트리니티의 문제점 중 하나인 동아리들의 정치적 개입을 온전히 차단하고 동이라의 자원을 100% 활용하기 위해서 동아리를 전부 해산하고 전부 티파티 산하의 조직으로 개편할 것입니다."
 
 TRM_Trinity_Supremacy: "트리니티 패권주의"
 TRM_Trinity_Supremacy_desc: "타협 체제의 불확실성은 외교 정책에 대한 의문을 증폭시켰고, 결국 대전이 사태를 기점으로 폭탄처럼 터지고 말았습니다. 이제 우리는 이 낡고 이상주의적이기만 한 타협 체제의 실패를 인정하고, 다시 한 번 트리니티의 패권주의를 재건해야 할 시점에 도달했습니다."
 TRM_war_preparations: "전쟁 준비"
 TRM_war_preparations_desc: "패권을 선언한 것은 주변 국가들의 긴장도를 크게 높히는 짓입니다. 그렇기에 우리는 우리의 군대를 다시 한 번 점검하고 보급 비축량을 증대하는 등 여러가지 노력을 통하여 전쟁을 준비해야합니다. 만약 전쟁의 총소리가 울려 퍼진다면 이러한 노력들은 크게 도움이 될 겁니다."
 TRM_reorganize_secret_services: "트리니티 학원정보원"
 TRM_reorganize_secret_services_desc: ""
 TRM_southern_offensive: "남부 공세"
 TRM_southern_offensive_desc: "트리니티의 아래에는 [ABY.GetAdjective], [HYA.GetAdjective] 등 여러 약소 학원이 존재합니다. 그러나 이들은 언제든 트리니티의 취약점을 공격할 가능성이 있는 시한폭탄과도 같은 존재입니다. 우리는 이를 방치할 수도, 이 지역에 평화로운 변화를 마냥 기다릴 수도 없습니다."
 TRM_SANHAIJING_offensive: "[SHA.GetAdjective] 측과 전쟁"
 TRM_SANHAIJING_offensive_desc: "트리니티는 독일인의 통합이라는 숙명을 짊어졌습니다. 수많은 독일계 오스트리아인들이 트리니티의 개입과 통합을 열망하고 있습니다. 비록 모두가 이를 원하지 않더라도, 우리는 침공을 단행하여 독일인의 통합이라는 위대한 숙명을 완수해야 합니다!"
 TRM_SMO_for_Abydos: "아비도스 침공"
 TRM_SMO_for_Abydos_desc: "솔직히 말하자면, 아비도스는 군소 학원입니다. 5명 밖에 없는 학원에서 도대체 뭘 할려고 합니까. 그렇기에 아비도스의 부지를 점령하기 위해 우리는 이들을 침공할 것입니다."
 TRM_demand_ostrava: "[74.GetName] 요구"
 TRM_demand_ostrava_desc: "[74.GetName]에는 많은 독일계 주민들이 거주하고 있으며, 독일인의 통합이라는 숙명을 짊어진 우리가 결코 외면해서는 안 될 중요한 지역입니다. 그러나 현재 이들은 백귀야행의 탄압 아래 목소리가 억압된 채 하루하루를 힘겹게 버티고 있을 뿐입니다. 따라서 우리는 정당한 방법을 통해 [74.GetName]의 통합을 요구하고자 합니다."
 TRM_form_Shanhaijing_Eden_axis: "산해경-트리니티 조약"
 TRM_form_Shanhaijing_Eden_axis_desc: "산해경은 현재 파시즘을 받아들이고 있는 몇 없는 키보토스 국가입니다.\n이는 트리니티와 전략적 동맹을 맺을수 있다는 의미입니다. "
 TRM_form_Rome_Eden_axis: "[ITA.GetAdjective] 측과 동맹"
 TRM_form_Rome_Eden_axis_desc: "[ITA.GetAdjective]의 [ITA.GetLeader]는 이 행성에서 최초로 파시즘을 창조한, 마치 태초의 신과도 같은 존재로 여겨집니다. 이러한 아버지와 같은 국가와 동맹을 맺는 것은 우리 정권의 정통성을 한층 더 강화할 뿐만 아니라, 국민들에게도 깊은 만족과 자부심을 안겨줄 것입니다."
 TRM_Wehrmacht_absorption: "국방군 흡수"
 TRM_Wehrmacht_absorption_desc: "국방군은 아직 완전히 와해되지 않았으며, 일부 병력은 트리니티에 저항하거나 노숙 생활을 이어가는 등 여전히 우리에게 골칫거리가 되고 있습니다. 그러나 이들을 무조건 배척하기보다는, 트리니티 지상군으로 재편성하여 새로운 기회를 부여하는 것이 더 효과적일 수 있습니다. 이 과정에서 그들의 충성심을 고취시키고, 이를 선전 도구로 활용할 것입니다."
 TRM_bribe_senior_officers: "$GER_bribe_senior_officers$"
 TRM_bribe_senior_officers_desc: "국방군 병사들 중 상당수가 트리니티 지상군에 편입되었지만, 이들을 지휘할 장교 인력이 턱없이 부족한 상황입니다. 이를 해결하기 위한 방안 중 하나는 국방군 출신 장교들을 포섭하는 것입니다. 다행히도, 이들 대부분은 자본주의적 성향을 지니고 있어 금전적인 조건을 제시하면 협력을 이끌어낼 가능성이 높습니다."
 TRM_Anti_Gehenna_Pro_Geramny: "반 게헨나, 친 독일"
 TRM_Anti_Gehenna_Pro_Geramny_desc: "우리의 전쟁 목표를 명확히 해야 합니다. 우리의 적은 게헨나의 뿔쟁이들이지, 결코 독일인들이 아닙니다. 이를 분명히 구분하여 게헨나 내 독일인들의 마음을 흔들고, 그들 사이에 동요를 일으켜야 합니다. 나아가, 우리가 게헨나를 공격할 때 독일인들이 우리를 환영할 수 있도록 준비해야 합니다."
 TRM_invasion_of_devils: "악마들의 침략"
 TRM_invasion_of_devils_desc: "우려하던 일이 벌어지고 말았습니다. 게헨나 학원은 결국 우리를 향해 총칼을 겨누며 진격하기 시작하였습니다. 빠르게 전쟁 태세을 갖춰야합니다"
 TRM_war_with_gehenna: "특별군사작전"
 TRM_war_with_gehenna_desc: "사악한 악마들의 학원인 게헨나 학원은 오래 전부터 트리니티와의 사이가 좋지 못하였고 학원과의 경계에서 우리를 도발하는 등 도저히 참을수 없을 정도입니다. 우리는 특별군사작전 이라는 명목 아래에 게헨나를 선제 타격하고 그들의 정부를 개조할 것입니다."
 TRM_invade_benelux: "[35.GetCapitalVictoryPointName] 통제권 탈환"
 TRM_influence_the_benelux: "새로운 파시즘 친구들"
 TRM_fate_of_slovakia: "슬로바키아의 운명"
 TRM_balkan_seeking_collaborators: "발칸 협력 모색"
 TRM_invade_balkan: "발칸 개입"
 TRM_operation_of_Terra_Recta: "테라렉타 작전"
 # 테라 렉타(Terra Recta)"바른 땅"이라는 뜻으로, 트리니티가 이탈리아를 정화하거나 재정비한다는 뉘앙스를 암시.
 TRM_Invasion_of_Millennium: "청색 상황"
 TRM_war_with_Swiss: "타넨바움 작전"
 TRM_Invasion_of_Poland: "백색 상황"
 TRM_maintain_a_compromise_system: "신 타협 체제"
 TRM_maintain_a_compromise_system_desc: "물론 타협 체제가 완전히 실패했던 것은 아닙니다. 어느 정도 효과를 발휘한 부분도 있었기에, 그 기반을 완전히 버리는 대신, 뒤떨어진 부분을 고치고 허술했던 요소들을 보강해 나간다면, 더 견고하고 현실적인 외교 정책으로 거듭날 가능성도 있습니다. 중요한 것은 실패를 인정하고 앞으로 나아갈 방향을 명확히 정립하는 것입니다."
 TRM_Trinity_Redwinter_Pact: "[RED.GetAdjective] 측과 불가침 조약"
 TRM_Trinity_Redwinter_Pact_desc: "[RED.GetAdjective] 측과의 우호 및 불가침 조약 체결은 트리니티의 현 정책과 다소 상충될 수 있지만, 이를 통해 얻을 수 있는 이익이 더 크다는 점에서 고려할 만합니다. 또한, 게헨나와의 전쟁이 시작될 경우, [RED.GetAdjective] 측과의 전쟁 위협에서 한층 벗어나게 되어 향후 정책에 대한 간섭을 최소화할 수 있을 것입니다."
 TRM_alliance_with_the_redwinter: "사악한 동맹"
 TRM_alliance_with_the_redwinter_desc: "어쩌면 우리는 [RED.GetAdjective] 측과 이념적 차이를 제쳐두고 퇴폐적이고 구시대적인 사상을 가진 키보토스 국가와 전세계를 향한 증오를 공통점으로 강조할 수 있을지도 모릅니다. [RED.GetAdjective] 측을 동맹으로 둔다면, 우리는 필요한 모든 자원에 접근할 수 있게 될 것입니다. 물론, 저들의 군사력까지도 말이죠"


