 TRN_arius_squad_smash_decision_desc: "\n\n£GFX_TRN_decisions_arius_squad\n\n\n\n\n아리우스 스쿼드는 세뇌와 협박 그리고 증오를 주입받아 아무렇지도 않게 테러리스트로 활동하는 아리우스 분교의 정예집단을 일컫습니다. 하지만 그녀들은 분교가 통합을 거부하고 트리니티에게 맞서 싸울때, 혼란을 이용하여 트리니티 전국으로 숨어들었습니다. 한명 한명 사람을 거리낌 없이 죽이는 살인 병기로 키워진 탓에 정부의 빠른 대응이 필요합니다."
