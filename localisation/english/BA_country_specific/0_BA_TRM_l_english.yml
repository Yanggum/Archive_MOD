 TRN_after_war_decisions: "Gehenna Resistance Movement"
 TRN_after_war_decisions_desc: "Resistance by Gehenna students is gradually becoming organized, and the 'Gehenna Student Resistance Union,' centered around remnant forces of the Hot Springs Development Department, Gourmet Research Society, and Prefect Team, is posing a practical threat to Trinity.\n\nThe problem is also internal. Some Trinity students, far from cooperating with the government, are committing discrimination, violence, and even terror acts against Gehenna students, which are clear crimes. Such hostility only deepens resistance and risks amplifying internal conflict rather than securing resources. Special measures will be required for Trinity to stably control Gehenna's resources and achieve integration."
