 TRM_pro_german_propaganda_modifier: "친독주의 프로파간다"
 TRM_pro_german_propaganda_modifier_desc: "미소노 미카 호스트는 이전의 트리니티 지배자들과 달리, 독일계의 환심을 사기 위해 독일인들을 적극적으로 등용하고 활용하는 모습을 보이고 있습니다. 독일인들의 방해가 사라진 트리니티는 현재 정적을 제거하며 변혁을 이끄는 듯 보이지만, 이는 곧 허상에 불과한 선전임이 점차 드러나게 될 것입니다."
 TRM_pro_german_propaganda_modifier_tt: "§Y$TRM_pro_german_propaganda_modifier$§! 변동치:"
 TRM_trinity_social_issues_modifier: "트리니티 사회문제"
 TRM_trinity_social_issues_modifier_desc: "허울뿐인 베일이 드러나고 트리니티를 향한 조직적인 독일인들의 움직임이 저항단체에서 벗어나 독일 민중에게까지 퍼져나갈 때, 우리는 이제 결단을 내려야합니다. 미약한 촛불에 불과한 트리니티를 구원하기 위해."
