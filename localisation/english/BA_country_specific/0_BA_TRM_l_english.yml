 #트리니티 국가중점#
 TRM_focus_tree: "트리니티 기본 중점계통도"
 TRN_nagisa_focus: "철의 여인 중점계통도"
 TRM_newfocus_0: "위기 대응"
 TRM_newfocus_0_desc: "우리 학원은, 어떤 초자연적 현상, 또는 수상한 실험으로 또 다른 세계에 떨어졌습니다. 현재 위치는 특정되지 않으며, 다른 학원과의 연결은 살아있지만, 학원의 정상적인 운영에 필요한 수많은 산업 시설, 철도망은 모두 붕괴한 상태입니다. "
 TRM_newfocus_1: "학생 진정 시키기"
 TRM_newfocus_1_desc: "우리 학원은 알 수 없는 초자연적 현상에 의해 미지의 장소로 이동하게 되었습니다. 그러나 이 초자연적 현상의 여파는 아직 완전히 가라앉지 않았으며, 우리 사회 곳곳에 그 흔적이 남아 혼란을 야기하고 있습니다. 지금이라도 늦지 않았으니, 이 사태의 진상을 사회에 명확히 알리고, 불필요한 혼란을 조장하거나 폭동을 일으키려는 자들을 엄중히 체포하여 질서를 유지해야 합니다. "
 TRM_localization: "트리니티 현지화"
 TRM_localization_desc: "대전이 이후로 여러 의견 충돌로 인해 지지부진한 산업 구조 개편을 지금 단행해야만 합니다. 트리니티 학원은 이 세계에 맞는 모습으로 재단장될 것입니다."
 TRN_economic_adjustment: "산업 계율"
 TRN_economic_adjustment_desc: "트리니티의 산업 개발이 마지막 단계에 도달함에 따라 기초적인 산업 기반 기술 개발을 지원해 트리니티의 산업화를 집중적으로 도달할 수 있도록 만들 것입니다."
 TRN_trade_union: "노동조합 활동 보장"
 TRN_trade_union_desc: "트리니티의 산업 개발이 마지막 단계에 도달함에 따라 기존의 억압적으로 다뤄진 노동자들에게 권리를 보장해야합니다."
 TRM_newfocus_3: "타협점을 찾아서"
 TRM_newfocus_3_desc: "우리는 현지인들과 지속적으로 마찰을 겪어왔습니다. 첫 현상이 발생한 이후, 우리는 생존권을 위해 투쟁했으나 현지인들 역시 저항하며 쉽게 물러서지 않았습니다. 결국 이 투쟁은 우리의 승리로 마무리되었지만, 여전히 현지인들 사이에 불만이 남아 있는 상황입니다. 이제는 이들과 타협할 필요가 있으며, 이를 위해 협상가 켄자키 츠루기를 대표로 세워 협상에 나서야 합니다."
 TRM_newfocus_4: "분석"
 TRM_newfocus_4_desc: "도서부와 다른 동아리들의 협력으로 우리는 지금 있는 이곳이 단순한 망상이나 허상, 창작물이 아닌 완전히 다른 세계임을 확인하게 되었습니다. 이를 당장 발표한다면 수 많은 사람들의 반발이 있을테지만 그래도 아예 모르는 것보단 나을 것입니다. 또한 티파티 비상회의의 일정도 마무리되어 가고 있습니다. 이제 새로운 호스트를 선출할 시간이 다가왔습니다."
 TRN_Request_assistance_from_Sisterhood: "시스터후드 회유"
 TRN_Request_assistance_from_Sisterhood_desc: "파테르 분파와 미소노 미카가 트리니티의 혼란을 주도하고 쿠데타를 시도하였다는 이유로 축출된 이후, [TRM.GetLeader] (은)는 트리니티의 안정을 위해 시스터후드의 도움을 요청하기로 하였습니다."
 TRN_Request_assistance_from_relief_knights: "구호기사단 회유"
 TRN_Request_assistance_from_relief_knights_desc: "파테르 분파와 미소노 미카가 트리니티의 혼란을 주도하고 쿠데타를 시도하였다는 이유로 축출된 이후, [TRM.GetLeader] (은)는 트리니티의 행정 공백을 해결하기 위해 자발적으로 트리니티를 위해 봉사하고 있는 옛 요한 분파의 계승자, 구호기사단에게 접촉할 것입니다."
 TRN_suppress_the_opposition: "파벌 정치 억제"
 TRN_suppress_the_opposition_desc: "트리니티 내부에 존재하는 다른 파벌들을 제압해 필리우스 분파의 영향력을 더욱 확대하고 트리니티의 온전한 안정을 가져올 것입니다."
 TRN_Trinitys_Balance: "트리니티의 균형"
 TRN_Trinitys_Balance_desc: "균형 잡힌 정치를 통해 트리니티 내 안정을 가져올 것이며 파벌간의 상호 감시를 통해 한 파벌의 독재적 행동을 억제할 수도 있을 것입니다."
 TRN_nagisa_coupdetat: "친위 쿠데타"
 TRN_nagisa_coupdetat_desc: "나기사가 감옥에 투옥된 이상, 필리우스 분파는 나기사를 구출할 필요성이 있습니다. 우리는 우리와 협력하는 파벌과 함께 나기사를 구출하고 미소노 미카를 체포할 것입니다."
 TRN_nagisa_lottery: "나기사 복권"
 TRN_nagisa_lottery_desc: "파테르 분파의 모략에 당해 감옥에 투옥당한 나기사를 복권시키고 이후 트리니티를 이끌 학생회장을 결정할 것입니다."
 TRN_new_trinity: "트리니티의 샛별"
 TRN_new_trinity_desc: "트리니티 종합학원에서 벌어진 일련의 혼란상이 끝난 지금, 우리는 새로운 트리니티의 계율을 세워낼 수 있습니다."
 TRN_trinity_reorganization: "트리니티 재구조화"
 TRN_trinity_reorganization_desc: "키리후지 나기사는 티파티와 더 나아가 트리니티를 위협하는 모든 학원의 적을 제거했습니다. 트리니티는 키리후지 나기사와 그 모든 체제의 수호자들로 재편될 것이며 이는 학원의 영속을 보장해 줄 것입니다."
 TRN_stabilization_of_the_system: "체제 안정화"
 TRN_stabilization_of_the_system_desc: "트리니티의 전통적인 체제는 매우 오랫동안 트리니티를 통치해 왔고, 앞으로도 그럴 것입니다. 여러 변경 점이 존재한다고 하더라도, 트리니티의 안정은 지속될 것입니다."
 TRN_decentralization_of_power: "권력 분산"
 TRN_decentralization_of_power_desc: "이전과 같은 상황이 다시 발생하지 않게 만들기 위해서는 티파티에 집중된 권력 구조를 손봐야 합니다. 권력 감시 제도를 마련하는 것을 시작으로 트리니티의 체제가 이어질 수 있게 만들 것입니다."
 TRN_trinity_tank_brigade: "트리니티의 전차여단"
 TRN_trinity_tank_brigade_desc: "트리니티 종합학원에는 전차가 필요합니다. 전차는 언제나 올바르고, 훌륭하기 때문에 모든 학생이 전차를 다룰 수 있도록 만들어야 하며, 전차를 대량으로 생산해야만 합니다."
 TRN_trinity_supremacy_focus: "트리니티 패권"
 TRN_trinity_supremacy_focus_desc: "트리니티 종합학원은 국제 무대에서 강력한 위치를 점유할 이유가 존재합니다. 트리니티 종합학원은 이에 따라 세계 패권을 차지하기 위해 나아가야 합니다."
 TRN_guardian_of_the_academy_focus: "학원의 수호자"
 TRN_guardian_of_the_academy_focus_desc: "키리후지 나기사는 트리니티의 위험 상황에 대비해 학원을 단단히 무장하고 준비할 필요성이 있습니다. 트리니티 종합학원은 이후 벌어질 여러 갈등 상황을 헤쳐 나갈 준비를 해야만 합니다."
 TRN_threat_exclusion: "위협 배제"
 TRN_threat_exclusion_desc: "아리우스 분교의 존재를 우리가 알아차린 이상 우리는 이들을 방치할 수 없습니다. 증오로 점철된 학원의 종말을 우리 손으로 만들어 낼 것입니다."
 TRN_preventive_war: "예방 전쟁"
 TRN_preventive_war_desc: "폴란드는 트리니티 종합학원의 대전이에 의해 상당 부분의 영토를 소실했습니다. 다른 국가와의 전쟁으로 인해 트리니티와 큰 마찰은 벌어지지 않았으나, 이들은 자신들의 영토를 회복할 야욕을 가지고 있기에, 트리니티 종합학원에 큰 위협이 될 수 있습니다."
 TRN_nazi_oppression: "나치 소탕"
 TRN_nazi_oppression_desc: "파테르 분파의 수장인 미카와 손을 잡고 트리니티 전역을 혼란 속에 밀어넣었던 '국가사회주의 독일 노동자당'을 트리니티 내에서 완벽하게 축출해낼 것입니다."
 TRN_Reunion_of_the_Treaty_of_Eden: "에덴 조약의 재결합"
 TRN_Reunion_of_the_Treaty_of_Eden_desc: "대전이 이전부터 추진되던 에덴 조약을 다시금 추진하여 트리니티와 게헨나 양국의 총체적 합의를 도출하고 외부의 위협에 대항할 수 있습니다"
 TRN_Treaty_of_Eden: "에덴 조약 결성"
 TRN_Treaty_of_Eden_desc: "게헨나와 트리니티의 합의가 끝난 지금 우리는 에덴 조약의 성공을 선언하고 거대한 규모의 세력을 구축할 것입니다."
 TRN_establishment_of_the_eden_treaty_organization: "평화와 공존"
 TRN_establishment_of_the_eden_treaty_organization_desc: "게헨나 학원의 대표단들은 우리의 에덴 조약 추진 시도를 긍정적으로 평가하였고, 에덴 조약 결성에 동의하였습니다. 우리는 얼마 지나지 않아 과거의 악연을 끊어내고, 평화와 공존을 향해 나아갈 수 있을 것입니다."
 TRN_joint_economic_development: "협력 산업 개발"
 TRN_joint_economic_development_desc: "에덴 조약에 따라 두 학원은 평화로운 발전을 추구할 의무가 있습니다. 우리는 게헨나와 협력하여 조약국의 산업을 개선할 것이며 이를 통해 에덴 조약기구의 산업 증진을 이뤄낼 것입니다."

 TRN_war_with_Gehenna: "공존할 수 없는 자들"
 TRN_war_with_Gehenna_desc: "게헨나 학원은 오래전부터 우리의 에덴 조약 시도를 폄훼하고 이제는 우리의 대표단을 내쫓기까지 했습니다. 우리는 이제 외교 태도를 전환할 때가 되었습니다. 되먹지도 않은 뿔쟁이들에게 본때를 보여줘야 할 것 같거든요."
 TRN_anti_german_anti_gehenna: "반게헨나, 반독일"
 TRN_trinity_movement: "트리니티주의 운동"
 TRN_the_dignity_of_the_empire: "제국의 위치"
 TRN_pro_trinity_volunteer_corps: "국가 의용군"
 TRN_our_homeland: "우리들의 조국"
 TRN_crusade_against_the_trinity: "전트리니티 성전"

 TRN_deep_hatred: "깊은 증오"
 TRN_deep_hatred_desc: "게헨나와 전쟁이 시작된 이상 트리니티에 뿌리내린 게헨나에 대한 깊은 증오심은 유용하게 사용될 수 있을 것입니다."
 TRN_Confirmation_of_intention_to_treaty: "조약 의사 확인"
 TRN_Confirmation_of_intention_to_treaty_desc: "게헨나 학원은 대전이 이후 여러 혼란상을 겪었습니다. 대전이 이전 게헨나 지도부가 에덴 조약에 긍정적이였다 하더라도, 현 게헨나의 상황은 정 반대일수도 있습니다. 우리는 게헨나에 사절단을 파견해 에덴 조약에 대한 의사를 확인할 것입니다."
 TRN_Gehenna_Trinity_Conference: "대타협"
 TRN_Gehenna_Trinity_Conference_desc: "에덴 조약기구의 설립에 차질이 발생한 이상 우리는 게헨나와 기나긴 회담을 시작해야만 합니다. 트리니티의 외무부는 양 국가의 합의가 성공적으로 완료되길 기원하고 있습니다."
 nagisa_imprisoned_flag: "§R나기사가 투옥당함§!"
 TRM_newfocus_21: "나기사 무력화"
 TRM_newfocus_21_desc: "트리니티의 전권을 쥐기 위해서는 현재 티파티의 호스트를 대행하는 키리후지 나기사를 무력화 하여 감옥에 처 넣을 필요가 존재합니다. 하지만 티파티의 권한을 얻는 걸로는 부족합니다."
 TRN_nagisa_cahin_tt: "§t심판의 시간이 도래했습니다.§!"
 TRN_nagisa_cahin_2_tt: "§Y키리후지 나기사§!는 더이상 티파티의 권한에 접근 할 수 없습니다."
 TRM_newfocus_7: "만남"
 TRM_newfocus_7_desc: "트리니티가 다른 세계로 전이됨에 따라 새로운 중대한 선택지가 생겼습니다. 계획에 따르자면, 본래 아리우스 스쿼드와 접촉하여 쿠데타를 성공 시키는 거였지만, 현재 위치를 특정할 수 없는 아리우스와의 협력은 과감히 포기해야 합니다. 대신, 현지에서 \"티파티\"와 유사한 역할을 하던 NSDAP와 협력하여 트리니티의 미래를 결정하는 것이 바람직할 것입니다."
 TRM_newfocus_26: "법 개정"
 TRM_newfocus_26_desc: "학원의 규칙은 민주적으로, 우리가 권력을 완벽하게 얻기에는 불리하게 작용합니다. 하지만 이제는 다릅니다. 우리가 티파티의 호스트가 되었고 우리에게 반대하는 작자들을 전부 쓸어버렸으니, 우리에게 알맞게 법을 수정 해야합니다."
 TRM_newfocus_28: "정권 강화"
 TRM_newfocus_28_desc: "대숙청을 지나면서 우리의 권력은 생각보다 영향을 행사 할 수 없었습니다. 하지만 우리의 권력을 의심 하는 자들은 전부 없앴고 그 모든 것들의 위에 서있으니 이에 걸맞은 권력을 얻어내야 합니다."
 TRM_newfocus_27: "대천사, 미소노 미카"
 TRM_newfocus_27_desc: "트리니티 종합학원은 여러 분파로 이뤄진 대가족이고, 모든 가정은 우두머리를 필요로 합니다. 미소노 미카 학생회장이 바로 그 우두머리입니다. 많은 분파들이 새로운 사상을 받아들이게 하고 구체제의 퇴폐성을 전부 말살하시며 우리를 밝은 미래로 이끄실 사람입니다."
 TRM_newfocus_33: "§t정적§!"
 TRM_newfocus_33_desc: "[TRN_scripted_loc]"
 TRN_desc_after_localization_key: "미소노 미카 신학생회장님께선, 계속해서 진행되는 티파티의 혼란과 자랑스러운 역사의 트리니티가 점점 파국으로 치닫는 꼴을 가만히 두고볼수 없으시어 구원의 결단을 내리시어 친히 군을 이끄시고 너무나도 무능한 트리니티의 수뇌부를 장악하셨습니다. 미카 학생회장님께서는 이시간부로 친히 트리니티를 위대하게끔 만들 것이며, 지금껏 트리니티를 좀먹어 온 악질적이고 무능한 인원들에 간한 대규모 '처리'를 예고하시며 트리니티를 위해 모든 힘을 쓰실 것을 맹세하셨습니다."
 TRN_desc_before_localization_key: "§t일급기밀§!"
 TRM_tail_chasing: "꼬리 잡기"
 TRM_tail_chasing_desc: "트리니티의 안정을 해치는 배후의 세력을 찾아내었습니다. 우리는 이제 이들을 모두 소탕할 차례입니다."
 TRM_arius_annex: "아리우스 수복"
 TRM_arius_annex_desc: "아리우스는 과거 우리들의 평화로운 통합에 반대하여 결국 지속적인 분쟁으로 몰락하여 폐허로 숨어들었고 생명을 끈질기게 유지하고 있습니다. 하지만 대전이가 되면서 그들의 위치가 들어났으니 그들을 수복하여 위협을 제거해야 할 것입니다."
 TMR_anti_gehenna: "반 게헨나 선전"
 TMR_anti_gehenna_desc: ""
 TMR_support_with_germany: "현지 협력"
 TMR_support_with_germany_desc: "과거 독일국의 국민들 지칭하는 말로, 이들은 독일에 대한 것들을 빠삭하게 알고있습니다. 하지만 우리는 지리는 커녕, 여기가 어디인지 파악조차 오래 걸렸습니다. 우리가 게헨나를 침공할때 공세가 난항이 될 수 있습니다. 그러하니 게헨나의 독일인들을 지원하여 우리는 전략적 우위를 달성할 필요가 존재합니다."
 TRN_german_company_acceptance: "독일 기업 수용"
 TRN_german_company_acceptance_desc: "현지에는 다양한 종류의 기업들이 존재합니다. 이들은 우리에 대한 반감이 분명 존재하긴 하지만, 기업의 본질을 잃지는 않았습니다. 우리가 돈을 쥐여준다면, 모두 우리 편으로 돌아서게 만들 수 있습니다."
 TRN_self_reliance: "학원 산업 개선"
 TRN_self_reliance_desc: "독일의 기업을 이용하면 편리하게 산업 적응이 가능하겠지만 학원의 영향력이 감소할 위협이 있습니다. 독일계 기업들을 배제하고 학원 산업을 중심적으로 성장시켜야 합니다."
 TRN_Trinity_Industrial_Development_Department: "트리니티 산업개발부"
 TRN_Trinity_Industrial_Development_Department_desc: "학원 산업을 집중적으로 개발하기로 한 이상 우리는 그에 특화된 부서가 필요합니다. 트리니티 산업개발부는 트리니티 산업 전반을 담당하며 거대한 규모의 경제 개발을 끌어낼 것입니다."
 TRM_Endsige: "최종 승리"
 TRM_Endsige_desc: "트리니티의 최후의 정복은 적의 심장 깊숙한 곳에 칼을 꽃으며 마무리 되었습니다. 수많은 적들이 트리니티를 위협하고, 우리를 짓밟을려고 하였습니다. 하지만 적들은 뾰족한 창 끝에서 똑같은 운명을 맞이할 뿐이였습니다. 이제 전쟁이 끝났으니 미래를 향해 전진해야합니다."
 TRM_Endsige2: "개인숭배"
 TRM_Endsige2_desc: "미소노 미카님의 탁월한 리더십 아래 트리니티는 마침내 승리를 선언하며 영원한 평화와 번영의 새로운 시대를 약속했습니다. 트리니티가 이 자리에 오기까지 미소노 미카님의 리더십이 결정적이었으며 이는 찬사 받아야합니다."
 TRM_Endsige2_tt: "\n§Y미소노 미카§!의 모든 특성을 잃습니다!"
 TRM_Endsige3: "트리니티의 영도자"
 TRM_Endsige3_desc: "미소노 미카님께서는 트리니티 기사단국의 핵심은 바로 트리니티의 학생들이며, 이들을 중심으로 트리니티를 재편해야 한다고 선언하셨습니다. 미카님은 트리니티의 영도자로서, 현존하는 문제들을 해결하고 학생들의 가치를 반영하여 더욱 완벽하고 충성스러운 트리니티를 만들어 나갈 것을 강조하셨습니다."
 TRM_Endsige7: "구세주"
 TRM_Endsige7_desc: "미소노 미카님께서는 '대전이'라는 거대한 위기 속에서 우리를 구원해 주셨을 뿐만 아니라, 외부의 위협으로부터도 굳건히 지켜주셨습니다. 또한 하나님의 군대를 이끌어 악을 정벌하시는 모습은 마치 \"대천사 미카엘\"을 떠올리게 할 정도입니다. 이렇듯 탁월한 지도력과 헌신을 보여주신 미소노 미카님을 \"구세주\"라 불러도 결코 지나침이 없을 것입니다."
 TRM_Endsige5: "\"주권자\""
 TRM_Endsige5_desc: "현재 평화의 시대가 지속되고 있지만, 여전히 불확실성이 남아 있습니다. 외부에서는 트리니티를 위협하려는 세력이 도사리고 있으며, 내부에서는 반 트리니티 적 테러가 발생하고 있습니다. 따라서 지금은 법규범이 제대로 작동하지 않는 \"예외 상황\"이며, 이러한 예외 상황에서 정책을 결정하는 분이 바로 미소노 미카님, 진정한 \"주권자\"이십니다."
 TRM_Endsige4: "게르만 민족의 종복"
 TRM_Endsige4_desc: "미소노 미카님께서는 트리니티 기사단국의 핵심이 게르만 민족, 즉 독일인들에게 있다고 선언하셨습니다. 또한, 이들을 \"위버멘쉬\"로 규정하며 그 우월성을 본받아야 한다고 강조하시며, 이를 목표로 삼아 노력해야 한다는 규범을 발표하셨습니다. 이러한 선언은 트리니티의 미래를 이끌어갈 기준이자 방향성을 제시하는 중요한 지침이 될 것입니다."
 TRM_Endsige6: "민족혁명 선언"
 TRM_Endsige6_desc: "우리는 비록 느리지만, 확실하게 \"위버멘쉬\"를 향해 나아가고 있습니다. 이상적인 목표에 더 신속히 도달하기 위해 민족 혁명을 선언하고, 이 경주에서 뒤처지는 이들은 과감히 도려내고 결승선에 도달할 책임과 의무를 다해야 합니다. 이 과정에서 비록 많은 희생이 따를지라도, 순수함과 우월성을 결코 잃어서는 안 될 것입니다."
 TRM_Endsige8: "트리니티의 새 여명"
 TRM_Endsige8_desc: "미소노 미카님의 이상향을 따라 도달한 그곳에는 마침내 에덴이 펼쳐져 있었습니다. 모든 인민들은 평등하고 풍요로운 삶을 누리고 있으며, 트리니티라는 장엄한 작품은 오늘도 찬란히 빛나고 있습니다. 모든 균형이 이루어져 완벽한 조화를 이루었으며, 민족, 국가, 그리고 총통이 하나로 결합된 진정한 \"삼위일체\"가 구현되었습니다."
 TRN_ENDSIGE_TT: "§L번영의 광명 속에서 피어나리라, 번성하여라, 트리니티여!§!"
 TRN_kickstart_the_war_industry: "에덴조병창"
 TRN_kickstart_the_war_industry_desc: "에덴조병창은 탄약과 소화기의 수요를 전부 맞추기에는 너무 불충분합니다. 특히 안전한 지역과 가까이, 전국에 더 많은 공장을 세워야합니다."
 TRN_military_training: "군사 훈련"
 TRN_military_training_desc: "군사들은 아직 준비가 되있지 않습니다. 그러니 대규모 군사 훈련을 시작하여 전쟁을 대비할 것입니다."
 TRN_muchabyeol_jingbyeong: "징병제 확대"
 TRN_muchabyeol_jingbyeong_desc: "징병제 확대"
 TRM_after_war: "전후처리"
 TRM_after_war_desc: "트리니티의 자랑스런 군대들이 게헨나의 심장부 깊은 곳에도 당당히 깃발을 꽃았으며 적들이 항복하였습니다. 광활한 게헨나 학원의 영토를 적법한 절차 아래에 처리해야합니다."
 TRM_germany_union: "연합법 선언"
 TRM_germany_union_desc: "솔직히 말해, 게헨나의 영토는 독일 공업의 중심부라 할 수 있습니다. 특히 라인강 산업 지대는 그 전략적 가치가 매우 높아, 충분히 유용하게 활용될 잠재력이 있습니다. 그러나 최근 이어진 트리니티 학생들의 테러로 인해 이들 공장을 안정적으로 이용하기란 거의 불가능에 가깝습니다. 따라서 이러한 문제를 해결하기 위해 연합법을 선언하고 양 학원 간의 감정을 해소하는 것이 중요한 과제가 될 것입니다."
 TRM_arius_attack: "아리우스에게 최후통첩"
 TRM_arius_attack_desc: "아리우스 분교는 트리니티에서 떨어져 나간 미수복지역과도 같습니다. 트리니티의 완전한 통합을 위해서 그들을 분쇄할 이유는 충분합니다."
 TRM_We_need_Denmark_milk: "덴마크 요구"
 TRM_We_need_Denmark_milk_desc: "덴마크는 지리학적으로 북해와 발트해를 연결하는 전략적인 위치에 있습니다. 또한 붉은겨울과 키보토스를 잇는 교두보 역할을 하며, 북대서양으로의 접근에 유리한 위치를 차지하고 있습니다. 이러한 덴마크를 트리니티가 확보할 수 있다면, 북유럽 지역에서의 우리의 영향력을 크게 강화할 수 있을 것입니다. 덴마크의 통제권을 획득함으로써 우리는 붉은 겨울과의 관계에서 유리한 위치를 차지하고, 해상 무역로에 대한 접근성을 높일 수 있습니다."
 
 TRM_redwinter_war_goal: "베저위붕"
 TRM_redwinter_war_goal_desc: "[RED.GetAdjective] 측이 보유한 풍부한 천연자원, 광활한 영토, 그리고 수많은 나무는 우리의 미래 건설을 위한 훌륭한 원자재가 될 잠재력을 지니고 있습니다. 그러나 그들은 이를 우리를 압박하는 수단으로 활용하고 있습니다. 이런 상황을 종식시키기 위해, 우리가 선제적으로 타격해 그들의 오만한 태도를 바로잡아야 할 것입니다.  "
 TRM_We_need_Denmark_milk_flag: "§Y[RED.GetAdjective]§!이(가) §Y[DEN.GetAdjective]§!를 양도"
 TRM_We_need_Denmark_milk_flag_tt: "현재 일수: [?TRM_We_need_Denmark_milk_flag:days|Y0]"
 TRM_We_need_Denmark_milk_flag_tt_NOT: "현재 일수: [?TRM_We_need_Denmark_milk_flag:days|Y0]"
 TRM_war_with_the_ussr: "붉은 황혼"
 TRM_war_with_the_ussr_desc: "[SOV.GetAdjective] 측은 세계에 큰 위협이 되는 존재입니다. 그들은 공산주의를 전 세계에 확산시키는 것을 목표로 삼는 공포의 세력입니다. 따라서 우리의 군대가 이들을 공격해 세계를 공산주의의 마수로부터 구해야 합니다.  "
 TRN_gwanryuje_jaijungbee_flag: "§Y$TRN_gwanryuje_jaijungbee$§! 중점 완료"
 TRN_gwanryuje_jaijungbee_flag_tt: "현재 일수: [?TRN_gwanryuje_jaijungbee_flag:days|Y0]"
 TRN_gunsu_sangsan_bub_flag: "§Y$TRN_gunsu_sangsan_bub$§! 중점 완료"
 TRN_gunsu_sangsan_bub_flag_tt: "현재 일수: [?TRN_gunsu_sangsan_bub_flag:days|Y0]"

 TRM_Iron_Sword_decision_search_up_cost: "£pol_power  §Y15§! £civ_factory  §Y1§!"
 TRM_Iron_Sword_decision_search_up_cost_blocked: "£pol_power  §R15§! £civ_factory  §R1§!"

 TRM_Last_Focus_trigger_tt: "§Y모든 학원§!을 [ROOT.GetAdjective](이)가 점령중임"
 TRM_anti_gehenna_focus_1: "저항군 분쇄"
 TRM_anti_gehenna_focus_1_desc: "게헨나 학생들의 조직적인 게릴라 활동이 정부에 큰 위협이 되고 있습니다. 이를 분쇄하기 위해 정부는 각 지역에 군대를 배치하고, 주요 거점을 집중적으로 공략할 계획입니다. 정밀한 정보 수집과 강력한 군사 작전을 통해 이들의 조직을 무너뜨리고, 혼란을 빠르게 종식시킬 것입니다."
 TRM_anti_gehenna_focus_2: "게헨나 저항군 소탕"
 TRM_anti_gehenna_focus_2_desc: "게헨나 학원의 학생들은 긍정적으로 보자면 자유로운 영혼들이지만, 부정적으로 말하자면 체제에 위협이 되는 테러리스트들입니다. 이들은 자신들의 학원이 패배한 뒤에도 결과를 받아들이지 않고, 트리니티에 저항하는 저항군으로 활동하고 있습니다. 이제 우리는 이들을 철저히 소탕하고 통제하며, 체제를 안정시키기 위한 노력을 기울여야 합니다."
 TRM_anti_gehenna_focus_3: "군민정청 수립"
 TRM_anti_gehenna_focus_3_desc: "게헨나 학생들의 게릴라 활동이 여전히 끊이지 않고 있습니다. 이들은 정부의 통제를 거부하며 지역마다 저항을 이어가고 있습니다. 이를 진압하기 위해서는 각 지역에 군사를 배치하고 군정을 실시하는 것이 효과적일 것입니다. 군정 체제를 통해 빠르고 강력하게 대응한다면, 게릴라 활동도 조기에 진압할 수 있을 것으로 기대됩니다. 군사력의 사용은 혼란을 최소화하고, 정부의 권위를 회복하는 데 중요한 역할을 할 것입니다."
