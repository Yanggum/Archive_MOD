 TRM_Iron_Sword_Operations_Categorie: "Operation Iron Sword"
 TRM_Iron_Sword_Operations_Categorie_desc: "\n\n£GFX_decisison_TRN_idolization_picture\n\n\n\n\nThreats still lurk within Trinity. Mysterious forces are active behind the scenes of Trinity, threatening our stability. We must cooperate with the secret police to identify and destroy the masterminds hidden in our shadows."
 TRM_IRON_SWORD_OPERATION_START: "Implement Operation Iron Sword"
 TRM_iron_sword_decision_find: "With Eyes Open"
 TRM_Iron_Sword_decision_search_up: "Expand Search Scope"
 TRM_Iron_Sword_decision_battle_up: "Reinforce Search Troops"
