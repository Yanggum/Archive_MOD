 TRMDIP.1.t: "[FROM.GetAdjective] Foreign Ministry's Demand for Yugoslavia Territory"
 TRMDIP.1.d: "A document demanding territory cession was just formally delivered to the [ROOT.GetAdjective] ambassador via the Foreign Ministry. A Foreign Ministry spokesperson said, 'Northern Slovenia historically and culturally belongs to the living space of the Germanic people, and [FROM.GetAdjective], which succeeded Germany, has the duty to protect the Germanic people and their territory.' According to government sources, the Yugoslav ambassador to [FROM.GetAdjective] said they would convey this content to their home country. Following the Foreign Ministry announcement, the [FROM.GetAdjective] Defense Ministry stated through a press conference that it would strengthen the guard of the southern border area to prepare for contingencies."
 
 TRMDIP.2.t: "[FROM.GetAdjective] Government Accepts Demand"
 TRMDIP.2.d: "The [FROM.GetAdjective] government has accepted the [ROOT.GetAdjective] Foreign Ministry's demand for territory cession. The [FROM.GetAdjective] government announced that it would complete the withdrawal from the regions [ROOT.GetAdjective] claims sovereignty over within two weeks and showed its intent to respect [ROOT.GetAdjective]'s territorial sovereignty. Regarding the announcement, a government spokesperson stated, 'It is a great victory for the [ROOT.GetAdjective] Foreign Ministry and [ROOT.GetLeader], and the government will continue to do its best to protect [ROOT.GetAdjective]'s rights.' Experts warned that the [FROM.GetAdjective] government's decision on territory cession could show similar cases within the Balkan Peninsula in the future."

 TRMDIP.3.t: "[FROM.GetAdjective] Government Rejects Demand"
 TRMDIP.3.d: "The [FROM.GetAdjective] government has rejected [ROOT.GetAdjective]'s demand for recognition of sovereignty over Northern Slovenia. [FROM.GetLeader] declared that '[FROM.GetAdjective] is the home of the Balkan peoples and can never be divided,' stating they would not succumb to the unreasonable threats of other countries. In response, our government signaled a tough reaction, stating 'We cannot ignore the behavior of [FROM.GetName] which ignores the natural demands of [ROOT.GetAdjective] and wields tyranny.' A Defense Ministry spokesperson stated that the troop redeployment toward the [FROM.GetAdjective] border is a normal measure considering the recent tension."

 TRMDIP.4.t: "[FROM.GetAdjective]'s Proposal to Support Sovereignty Over [45.GetName]"
 TRMDIP.4.d: "The [FROM.GetAdjective] side has made a proposal to support our claim of sovereignty over [45.GetName] in exchange for signing a mutual independence guarantee and cooperation treaty. This seems like a good deal for us, but should we accept it?"
 TRMDIP.4.b: "Why should we trust these aliens?"

 TRMDIP.5.t: "$TRM_Schidsspruch$"
 TRMDIP.5.desc: "At the request of our ally Hungary, a conference to readjust Romania's borders was held today in Eden. Through various discussions, three total conclusions were reached.\n\nFirst is to hand over all of Transylvania to Hungary. This will entirely negate the Treaty of Trianon that separated Transylvania and Hungary, handing it over to the Magyars, who are the rightful rulers. Indeed, since Magyars make up the majority in some areas of Transylvania, it is not impossible.\n\nSecond is to hand over part of Transylvania to Hungary. Even if Magyars are many in Transylvania, they are not distributed evenly throughout the region but only in some mountainous areas. In particular, since they are distributed in Northern Transylvania, handing over only Northern Transylvania could solve the problem between the two nations.\n\nThird is for us not to intervene in Transylvania. The Treaty of Trianon was signed before we experienced the Great Migration incident, and we do not yet fully understand the feelings between the two nations, nor do we know what disadvantages we might suffer from this choice in the future. Problems between the two nations should be solved by the two nations.\n\nThree agendas were conveyed to [TRM.GetLeader] through the office today. Now a choice must be made."
 
 TRM_second_vienna_award: "$TRM_Schidsspruch$"

 TRMDIP.6.t: "[FROM.GetAdjective] Sent Us an Ultimatum"
 TRMDIP.6.d: "[FROM.GetAdjective], which recently allied with Hungary, has decided that the Treaty of Trianon is void and Northern Transylvania must be returned to Hungary. Should we accept this decision?"
 TRMDIP.7.d: "[FROM.GetAdjective], which recently allied with Hungary, has decided that the Treaty of Trianon is void and, absurdly, the entire Transylvania region should return under Hungarian rule. Should we accept this decision?"
 
 TRMDIP.8.t: "[FROM.GetAdjective] Rejected Our Demand"
 TRMDIP.8.d: "The [FROM.GetName] government rejected our demands and did not sign the treaty to cede Transylvania. We will crush [FROM.GetName] together with [HUN.GetAdjective]."
 
 TRMDIP.9.t: "$TRM_Schidsspruch$"
 TRMDIP.9.d: "[ROM.GetName], having accepted the ultimatum of [TRM.GetAdjective], sent content to our government today stating they would cede Transylvania. It is a historic moment."

 TRMDIP.10.t: "[TRM.GetAdjective]'s Mediation Proposal"
 TRMDIP.10.d: "Despite rightful sovereignty, [TRM.GetAdjective] made a decision that Transylvania should be under Romanian rule. They said they wanted to solve Balkan problems, but it seems that only applies when it concerns their own interests."

 TRMDIP.11.t: "$TRM_support_the_croatia_militia$"
 TRMDIP.11.d: "Having obtained [102.GetName], we realized that Yugoslavia does not have the power to reject our demands. [TRM.GetLeader] realized that Croatian independence is semi-essential to weaken Yugoslavia and finally subject them under our sphere of influence.\n\nThe Foreign Ministry has presented two total proposals.\nFirst, to partition Croatia from Yugoslavia by military pressure. There may be resistance in this process, but we can partition Croatia and subject them to our sphere of influence through overwhelming military pressure or mediation by other countries.\n\nSecond, we can induce a rebellion by contacting internal resistance forces in Croatia. This process will incur numerous costs, but if Croatia gains independence, it can deal a huge blow to Yugoslavia."
 TRMDIP.11.a: "The first option."
 TRMDIP.11.b: "The second option."

 TRMDIP.12.t: "[FROM.GetAdjective] Demanded [DEN.GetAdjective]!"
 TRMDIP.12.d: "Yesterday evening, [FROM.GetAdjective] sent a letter to [ROOT.Capital.GetName] demanding [DEN.GetAdjective]. The [DEN.GetAdjective] that [ROOT.GetAdjective] obtained during the Great Migration incident has significant strategic value. However, [FROM.GetAdjective] demanding [DEN.GetAdjective] means they desire war with us."
 TRMDIP.12.a: "Let's grant their demand..."
 TRMDIP.12.b: "Politely refuse their demand."

 TRMDIP.13.t: "[FROM.GetAdjective] Ceded [DEN.GetAdjective]"
 TRMDIP.13.d: "Early this morning, [FROM.GetAdjective] sent content to [ROOT.Capital.GetName] that they would cede [DEN.GetAdjective] within 24 hours. Since the territory of [DEN.GetAdjective] is land of very great strategic value, our diplomacy has won once again."

 TRMDIP.14.t: "[FROM.GetName] Rejected Our Demand!"
 TRMDIP.14.d: "Early this morning, [FROM.GetAdjective] sent a document to [ROOT.Capital.GetName] stating they would not cede [DEN.GetAdjective]. It appears they rejected our demand as the strategic importance of [DEN.GetAdjective] was emphasized within [FROM.GetAdjective]. The clouds of war loom once again."

 TRMDIP.15.t: "Agenda: Heightened Grievances of German Residents"
 TRMDIP.15.d: "TOP SECRET\nREPORT\n\n[ROOT.GetAdjective] [GetDate]\nSubject: Heightened Grievances of German Residents and Potential Crisis Situation\n\nIncident Details\n\n1. Pro-German protests among German residents are rapidly increasing. Protesters are expressing dissatisfaction with the slogan \"Guarantee free passage!\"\n2. The protester side is warning that if their demands are not met, they will \"achieve it through force,\" increasing the seriousness of the situation.\n3. Trends in the Trinity homeland are unusual. Interest in overseas German residents is heightening, and movements suggesting potential intervention in this region are being captured.\n4. If the current situation persists, there are concerns over domestic public order instability and heightened international tensions.\n\nEnd of report."
 TRMDIP.15.a: "Suppress them all!"
 TRMDIP.15.b: "It's unavoidable; we must accept the protesters' demands."

 TRMDIP.16.t: "[ROOT.GetLeader] Began a War of Conquest"
 TRMDIP.16.d: "As our homeland has now begun a war of conquest, existing economic plans and internal stabilization plans can no longer proceed. We don't know if those plans can resume if peace arrives, but for now, we must first end the war of conquest."
 TRMDIP.16.a: "[ROOT.GetAdjective]! Be victorious!"
 TRM_focus_locked_flag_tt: "All §YDomestic Focuses§! will be disabled!"
 TRMDIP.17.t: "Invasion of the Demons!"
 TRMDIP.17.d: "Today, what we feared has happened. The demons of Gehenna have begun attacking us all at once, and casualties have started to occur on the front lines. We must resist until the end."
 
 TRMDIP.18.t: "Trinity-Red Winter Treaty?"
 TRMDIP.18.d: "The Trinity Foreign Ministry has submitted a report to [ROOT.GetLeader] as issues related to Red Winter, which holds a friendship treaty with Gehenna, have come to light. The report warned of the possibility of conflict occurring on the Red Winter border if war with Gehenna breaks out. To prevent such a crisis, the Foreign Ministry concluded the report by strongly emphasizing the necessity of signing a non-aggression pact with Red Winter."
 TRMDIP.18.a: "Let's contact [RED.GetAdjective]."
 TRMDIP.18.b: "Unnecessary concern."

 TRMDIP.19.t: "Non-Aggression Pact Proposal from [FROM.GetAdjective]"

 TRMDIP.20.t: "Anti-Gehenna Academy Terror in [?TRM.TRM_anti_geh_emotion_var.GetName]!"
 TRMDIP.20.d: "Recently, bomb terror acts by students of our academy have been frequently occurring in the Gehenna Academy region. According to current reports, these attacks are being carried out indiscriminately without specific targets, and as a result, enormous damage is occurring to major facilities and residents in the region. The scale of damage is still not accurately identified, but the frequent occurrence of terror has put local areas in a state of extreme chaos. This terror is not just a one-off event but is proceeding systematically and repeatedly. This situation is expected to worsen during the war and is likely to act as a factor hindering long-term strategic goals.\n\nA more serious problem is that a resistance organization is forming within Gehenna Academy due to these attacks. Currently, Gehenna students have started organized responses to protect their own safety and sovereignty, which will be a considerable threat in our future process of occupying Gehenna. There is also a possibility that this resistance organization will not stop at defense but directly interfere with our tactics.\n\nIn particular, due to this terror, the factory area of [?TRM.TRM_anti_geh_emotion_var.GetName] has become a major target of attack, and access to the factory is completely blocked. The factory is a major production and supply base in the region, and due to the aftermath of the attack, logistics and resource procurement are being seriously affected. Consequently, concerns are being raised that economic shocks will spread not only to Gehenna Academy but also to surrounding regions.\n\nThorough strategic adjustment is required so that occupation plans proceed as planned."
 TRMDIP.20.a: "We need another plan..."

 TRMDIP.21.t: "Non-Aggression Pact with [TRM.GetAdjective]"
 TRMDIP.21.d: "The Trinity Foreign Ministry has proposed a non-aggression pact between the two nations. This treaty not only significantly expands mutual trade but also includes a secret protocol recognizing all of Scandinavia as the sphere of Red Winter.\n\nWhile the fascists of Eden may be untrustworthy targets, by signing this agreement, we can secure the justification to legitimize rule over Scandinavia without concern over interference from other countries. Furthermore, if Finland collapses, we can use it as an opportunity to aim for incorporating Finland into our territory."
 TRMDIP.21.a: "Sign the treaty."
 TRMDIP.21.b: "We do not deal with fascists!"
 TRM_RED_pact: "Trinity-Red Winter Non-Aggression Pact"
 refused_TRM_RED_pact: "Non-Aggression Pact Refused"

 TRMDIP.22.t: "[RED.Capital.GetCapitalVictoryPointName] Accepted the Treaty!"
 TRMDIP.22.d: "[RED.GetNameDefCap] has wisely signed our non-aggression pact. This means we can act freely from the risk of Red Winter's intervention."
 TRMDIP.22.a: "A victory for diplomacy."

 TRMDIP.23.t: "[RED.Capital.GetCapitalVictoryPointName] Rejected the Treaty!"
 TRMDIP.23.d: "[RED.GetNameDefCap] has unwisely rejected our treaty. Clearly, a plot against us exists."
 TRMDIP.23.a: "Unpleasant indeed."

 TRMDIP.24.t: "German Riots"
 TRMDIP.24.d: "Numerous Germans have risen against us and started riots. Shouting \"One Homeland,\" they damaged Gehenna symbols or drew graffiti over them, raising their voices of resistance with actions contrary to the system. Their anger exploded throughout the streets, showing a form that directly denied Gehenna's authority.\n\nCurrently, the riots are being suppressed to some extent, but circumstances are being captured where this incident appears not to be a simple spontaneous movement but orchestrated and controlled by someone. In particular, the possibility of Trinity being behind it is being most prominently mentioned."
 TRMDIP.24.a: "This is internal interference."

 TRMDIP.25.t: "Gleiwitz Mediation"
 TRMDIP.25.desc: "The oppression of Germans in Sudeten Silesia is truly a heartbreaking matter for the Germanic people. We have sufficient will to contribute to world peace by upholding the principle of national self-determination agreed upon in 1919. We politely request the other nation through the embassy to correctly re-establish the border lines and ethnic distributions that are currently disrupted and non-congruent in the Czech regions, and we will also lead to the cession of Sudeten Silesia."
 TRMDIP.25.a: "That place is our territory."

 TRMDIP.26.t: "Gleiwitz Mediation"
 TRMDIP.26.desc: "We have been demanded by [TRM.getname] to renounce sovereignty over [74.getname] and [72.getname] and establish new border lines according to the principle of national self-determination."
 TRMDIP.26.a: "Let's accept their intent."
 TRMDIP.26.b: "Absurd talk!"
 
 TRMDIP.27.t: "Refusal"
 TRMDIP.27.desc: "Our mediation was rejected by the concerned nation."
 TRMDIP.27.a: "Let's use the second method."
 TRMDIP.27_tt: "§LThe Germans of Sudetenland respond and rise in revolt.§!"
 TRMDIP.27.b: "Take a step back."
 
 TRMDIP.28.t: "Ultimatum from [TRM.getname]"
 TRMDIP.28.desc: "[TRM.getname] demanded unconditional acceptance of mediation to readjust the territory of [SLO.getname]."
 TRMDIP.28.a: "There's no other way."
 TRMDIP.28.b: "Fight back!"
 
 TRMDIP.29.t: "Proposal from [TRM.getname]"
 TRMDIP.29.desc: "The [TRM.getname] embassy has demanded a military alliance in exchange for guaranteeing administrative rights over the entire Slovakia region."
 TRMDIP.29.a: "Tempting."
 TRMDIP.29.b: "Refuse."
 
 TRMDIP.30.t: "Fate of Slovakia"
 TRMDIP.30.desc: "Slovakia is an inferior Slavic nation, but since a trace of Germanic color remains, it must be reformed by [TRM.getname], which represents the Germanic people. As our ultimatum sent to Slovakia was accepted, we can establish a friendly regime in Slovakia, but we could also hand it over to Hungary for solidarity with them."
 TRMDIP.30.a: "Establish a friendly regime."
 TRMDIP.30.b: "Bind Hungary to us."

 TRMDIP.31.d: "[TRM.getname] sent a faction invitation, emphasizing being fellow fascist nations. Italy is indeed a fascist nation, but it is far from the fascism those aliens claim. If we accept their invitation, a strong alliance will be established, but our citizens do not want an alliance with them."

 TRN_arius_squad_smash_decision: "The Arius Squad Problem"
 TRN_arius_squad_smash_decision_desc: "\n\n£GFX_TRN_decisions_arius_squad\n\n\n\n\nArius Squad refers to the elite group of Arius Branch School who operate as terrorists without hesitation, having been injected with brainwashing, threats, and hatred. However, when the Branch School rejected integration and fought against Trinity, they used the chaos to hide throughout Trinity. Because they were raised as killing machines who kill people without hesitation, rapid government response is necessary."
