 TRM_promote_ideology_rallies_balkan: "$SOV_promote_ideology_rallies_balkan$"
 TRM_pressure_government_cd_tt: "\n우리는 §Y[?TRM_pressure_government_cd]§!일에 한 번만 압박할 수 있습니다."
 TRM_pressure_government_active_flag: "$SOV_pressure_government_active_flag$"

 TRMDIP.1.t: "[FROM.GetAdjective] 외무부의 유고슬라비아 영토 할양 요구"
 TRMDIP.1.d: "방금 전 영토 할양을 요구하는 문서가 외무부를 통해 [ROOT.GetAdjective] 대사에게 정식으로 전달되었습니다. 외무부 대변인은 '북슬로베니아는 역사적, 문화적으로 게르만 민족의 생활권에 속하며, 독일을 승계한 [FROM.GetAdjective]는 게르만 민족과 그 영토를 보호할 의무를 가진다.'라고 말했습니다. 정부 소식통에 의하면 주 [FROM.GetAdjective] 유고슬라비아 대사는 이와 같은 내용을 본국에 전달하겠다고 알렸습니다. 외무부 발표 이후 [FROM.GetAdjective] 국방부는 회견을 통해 남부 국경지대의 경비를 강화해 만약에 사태에 대비하겠다고 밝혔습니다."
 
 TRMDIP.2.t: "[FROM.GetAdjective] 정부의 요구 수용"
 TRMDIP.2.d: "[FROM.GetAdjective] 정부가 [ROOT.GetAdjective] 외무부의 영토 할양 요구를 수용했습니다. [FROM.GetAdjective] 정부는 [ROOT.GetAdjective]가 영유권을 주장하는 지역 내에서의 철수를 2주일 내로 완료하겠다는 발표와 함께 [ROOT.GetAdjective]의 영토 주권을 존중한다는 뜻을 보였습니다. 해당 발표에 대해 정부 대변인은 '[ROOT.GetAdjective] 외무부와 [ROOT.GetLeader]의 위대한 승리이며, 앞으로도 정부는 [ROOT.GetAdjective]의 권리를 지키기 위해 최선을 다할 것이다.'라고 밝혔습니다. 전문가들은 [FROM.GetAdjective] 정부의 영토 할양 결정이 발칸반도 내에서 향후 비슷한 경우를 보여줄 수 있음을 경고했습니다"

 TRMDIP.3.t: "[FROM.GetAdjective] 정부의 요구 거부"
 TRMDIP.3.d: "[FROM.GetAdjective] 정부가 [ROOT.GetAdjective]의 북슬로베니아 영유권 인정 요구를 거부했습니다. [FROM.GetLeader]는 '[FROM.GetAdjective]는 발칸 민족들의 삶의 터전이며 결코 나누어질 수 없다.'라며 타국의 불합리한 협박에 굴복하지 않겠다고 선언했습니다. 이에 대해 정부는 '[ROOT.GetAdjective]의 당연한 요구를 묵살하고 폭정을 휘두르는 [FROM.GetName]의 행태를 무시할 수 없다.'며 강경한 대응을 시사했습니다. 국방부 대변인은 [FROM.GetAdjective] 국경을 향한 병력 재배치에 대해 최근의 긴장 상태를 감안한 정상적인 조치라고 밝혔습니다."

 TRMDIP.4.t: "[FROM.GetAdjective]의 [45.GetName] 영유권 지지 제안"
 TRMDIP.4.d: "[FROM.GetAdjective] 측이 상호 독립 보장과 협력조약을 체결하는 대가로 우리의 [45.GetName] 영유권 주장을 지지하는 제안을 해왔습니다. 이는 우리에게 있어서 좋은 거래인 것 같습니다만, 이를 받아들여야 할까요?"
 TRMDIP.4.b: "우리가 왜 이계인들을 믿어야 하지?"

 TRMDIP.5.t: "$TRM_Schidsspruch$"
 TRMDIP.5.desc: "우리의 동맹인 헝가리의 요구에 따라 루마니아의 국경선을 재조정하는 회의가 오늘 에덴에서 개최되었습니다. 여러 논의를 거쳐 총 3가지의 결론에 도달했습니다.\n\n첫 번째는 트란실바니아 전체를 헝가리에 넘기는 것입니다. 트란실바니아와 헝가리가 분리된 트리아농 조약을 전면 부정하고 정당한 지배자인 미자르 인들에게 넘길 것입니다. 실제로도 트란실바니아의 일부 지역에는 미자르 인들이 다수를 차지하고 있기에 불가능한 것은 아닙니다.\n\n두 번째는 트란실바니아의 일부를 헝가리에 넘기는 것입니다. 트란실바니아는 미자르 인들이 다수라고 할지라도 지역 전체에 골고루 분포된 것이 아닌 산악 지역 일부에만 분포되었습니다. 특히 북트란실바니아 지역에 분포 되어있기에 북트란실바니아만 넘기는 것이 두 양국 간의 문제를 해결할 수 있을 것입니다.\n\n세 번째는 트란실바니아에 대해 우리는 개입 하지 않는 것입니다. 트리아농 조약은 우리가 대전이 사태를 겪기 전에 체결 되었으며 우리는 양국 간의 감정을 아직 완벽히 이해하지 못하였고 향후 이 선택으로 우리가 어떤 불이익을 겪을지 모릅니다. 두 양국 간의 문제는 두 양국이 해결해야 합니다.\n\n세가지의 안건이 오늘 집무실을 통해 [TRM.GetLeader]에게 전해졌습니다. 이제는 선택해야만 합니다."
 
 TRM_second_vienna_award: "$TRM_Schidsspruch$"

 TRMDIP.6.t: "우리에게 최후 통첩을 보낸 [FROM.GetAdjective]"
 TRMDIP.6.d: "최근 헝가리와 동맹을 맺은 [FROM.GetAdjective]는 트리아농 조약을 무효화 하며 트란실바니아 북부가 헝가리에게 반환되어야 한다고 결정하였습니다. 우리가 이 결정을 받아들여야 할까요?"
 TRMDIP.7.d: "최근 헝가리와 동맹을 맺은 [FROM.GetAdjective]는 트리아농 조약을 무효화 하며 터무니없게도 트란실바니아 전역를 헝가리의 통치하로 돌아가야 한다고 결정했습니다. 우리가 이 결정을 받아들여야 할까요?"
 
 TRMDIP.8.t: "우리의 요구를 거부한 [FROM.GetAdjective]"
 TRMDIP.8.d: "[FROM.GetName] 정부는 우리들의 요구를 거부하고 트란실바니아를 양도하는 조약에 서명하지 않았습니다. 우리는 [HUN.GetAdjective]와 함께 [FROM.GetName]를 짓밟을 것입니다."
 
 TRMDIP.9.t: "$TRM_Schidsspruch$"
 TRMDIP.9.d: "[TRM.GetAdjective]의 최후 통첩을 받아들인 [ROM.GetName]은 오늘 트란실바니아를 양도하겠다는 내용을 우리 정부를 향해 보내왔습니다. 역사적인 순간입니다."

 TRMDIP.10.t: "[TRM.GetAdjective]의 중재안"
 TRMDIP.10.d: "정당한 영유권에도 불구하고 [TRM.GetAdjective]는 트란실바니아가 루마니아에 지배하에 있어야 한다는 결정을 내렸습니다. 그들은 발칸 문제를 해결 하고 싶다고 하였지만, 이는 자국에 이익과 관련된 경우에만 해당하는 것 같습니다."

 TRMDIP.11.t: "$TRM_support_the_croatia_militia$"
 TRMDIP.11.d: "[102.GetName]를 얻어내면서 유고슬라비아는 우리의 요구를 거부할 힘이 없다는 것을 파악하였습니다. [TRM.GetLeader]는 유고슬라비아를 약화하고 최종적으로 우리의 영향권 아래에 복속시키기 위해서는 크로아티아의 독립이 반필수적으로 필요하다는 걸 깨달았습니다.\n\n외무부가 제시한 제안은 총 두 가지입니다.\n첫 번째로, 군사로 압박하여 크로아티아를 유고슬라비아에서 분할시키는 것입니다. 이 과정에서 저항이 있을 수 있지만 압도적인 군대로 압박하거나, 타 국가의 중재로 크로아티아를 분할시키고 우리의 영향권 아래로 복속시킬 수 있을 것입니다.\n\n두 번째로, 크로아티아의 내부 저항 세력과 접촉하여 반란을 유도할 수 있습니다. 이 과정에서 수많은 비용이 발생하겠지만, 크로아티아가 독립한다면 유고슬라비아에 큰 타격을 줄 수 있을 것입니다. "
 TRMDIP.11.a: "첫 번째."
 TRMDIP.11.b: "두 번째."

 TRMDIP.12.t: "[DEN.GetAdjective]를 요구한 [FROM.GetAdjective]!"
 TRMDIP.12.d: "어제 저녁, [FROM.GetAdjective]가 [ROOT.Capital.GetName]으로 [DEN.GetAdjective]를 요구한 서신을 보내왔습니다. [ROOT.GetAdjective](이)가 대전이 사태를 겪으면서 얻은 [DEN.GetAdjective]는 중요한 전략적 가치를 가지고 있습니다. 그러나 [FROM.GetAdjective](이)가 중요한 전략적 가치를 가진 [DEN.GetAdjective]를(을) 요구한다는 것은, 곧 우리와의 전쟁을 원한다는 의미이기도 합니다. "
 TRMDIP.12.a: "그들의 요구를 들어주자.."
 TRMDIP.12.b: "그들의 요구를 정중히 거부해라."

 TRMDIP.13.t: "[DEN.GetAdjective]를 양도한 [FROM.GetAdjective]"
 TRMDIP.13.d: "이른 아침, [FROM.GetAdjective](이)가 [ROOT.Capital.GetName]으로 DEN.GetAdjective]를(을) 24시간내로 양도하겠다는 내용을 보내왔습니다. [DEN.GetAdjective]의 영토는 전략적 가치가 매우 큰 땅이기에 우리의 외교가 다시 한 번 승리하였습니다."

 TRMDIP.14.t: "우리의 요구를 거부한 [FROM.GetName]!"
 TRMDIP.14.d: "이른 아침, [FROM.GetAdjective]가 [ROOT.Capital.GetName]으로 [DEN.GetAdjective]를 양도하지 않겠다는 내용의 문서를 보냈습니다. [DEN.GetAdjective]의 전략적인 중요성이 [FROM.GetAdjective]의 내부에서 강조되면서 우리의 요구를 거부한 것으로 보입니다. 전쟁의 먹구름이 다시 한 번 드리웁니다."

 TRMDIP.15.t: "안건: 독일계 주민 불만 고조"
 TRMDIP.15.d: "극비\n보고서 \n\n[ROOT.GetAdjective] [GetDate]\n건명: 독일계 주민 불만 고조 및 잠재적 위기 상황\n\n사건 내용\n\n1. 독일계 주민들의 친독일 시위가 급증하고 있음. 시위대는 \"자유로운 왕래를 보장하라!\" 라는 구호를 외치며 불만을 표출하고 있음.\n2.시위대 측은 요구사항이 받아들여지지 않을 경우 \"무력을 통해 쟁취할 것이다\"라고 경고하고 있어 상황의 심각성이 증대되고 있음.\n3.트리니티 본국의 동향이 심상치 않음. 해외 독일계 주민들에 대한 관심이 고조되고 있으며, 이 지역에 대한 개입 가능성을 시사하는 움직임이 포착됨.\n4.현 상황이 지속될 경우, 국내 치안 불안 및 국제 관계의 긴장 고조가 우려됨.\n\n이상."
 TRMDIP.15.a: "전부 진압해!"
 TRMDIP.15.b: "어쩔수 없지만, 우리는 시위대의 요구를 수용해야한다."

 TRMDIP.16.t: "정복 전쟁을 시작한 [ROOT.GetLeader]"
 TRMDIP.16.d: "현재 조국이 정복 전쟁을 시작하면서 기존의 경제 계획과 내부 안정화 계획이 더이상 진행할 수 없습니다. 평화가 찾아올 경우 다시 그 계획을 재개할 수 있을지 모르겠지만, 지금은 우선 정복 전쟁을 끝내야합니다."
 TRMDIP.16.a: "[ROOT.GetAdjective]여! 승리하라!"
 TRM_focus_locked_flag_tt: "§Y내정 중점§!들이 모두 비활성화 됩니다!"
 TRMDIP.17.t: "악마들의 침략!"
 TRMDIP.17.d: "오늘, 우리가 우려하던 일이 발생했습니다. 게헨나의 악마들은 우리들을 향해 일제히 공격하기 시작하였고 전선에서는 사상자가 발생하기 시작했습니다. 우리들은 끝까지 항전해야합니다."
 
 TRMDIP.18.t: "트리니티-붉은겨울 조약?"
 TRMDIP.18.d: "트리니티 외교부는 게헨나와 친선 조약을 맺고 있는 붉은겨울과 관련된 문제가 부각됨에 따라 [ROOT.GetLeader]에게 보고서를 제출했습니다. 보고서에서는 게헨나와의 전쟁이 발발할 경우, 붉은겨울과의 국경에서 분쟁이 발생할 가능성을 경고했습니다. 이와 같은 위기 상황을 예방하기 위해, 외교부는 붉은겨울과의 불가침 조약 체결의 필요성을 강력히 강조하며 보고를 마무리했습니다."
 TRMDIP.18.a: "[RED.GetAdjective]에게 접촉해보자."
 TRMDIP.18.b: "불필요한 걱정이다."

 TRMDIP.19.t: "[FROM.GetAdjective]의 불가침 조약 제안"

 TRMDIP.20.t: "[?TRM.TRM_anti_geh_emotion_var.GetName]에서 일어난 반 게헨나 학원 테러!"
 TRMDIP.20.d: "최근 게헨나 학원 지역에서 우리 학원의 학생들에 의한 폭탄 테러가 빈번히 발생하고 있습니다. 현재 보고된 바에 따르면, 이들 공격은 특정 목표를 정하지 않고 무차별적으로 이루어지고 있으며, 그 결과로 지역 내 주요 시설과 주민들에게 막대한 피해가 발생하고 있습니다. 피해 규모는 여전히 정확히 파악되지 않았으나, 테러의 잦은 발생으로 인해 현지의 혼란이 극심한 상태입니다. 이번 테러는 단순히 일회성 사건에 그치지 않고 체계적이고 반복적으로 진행되고 있습니다. 이러한 상황은 전쟁이 지속되는 동안 더욱 악화될 것으로 보이며, 장기적인 전략적 목표를 방해할 요소로 작용할 가능성이 큽니다.\n\n더욱 심각한 문제는 이러한 공격으로 인해 게헨나 학원 내부에 저항 조직이 형성되고 있다는 점입니다. 현재 게헨나의 학생들은 스스로의 안전과 자주권을 지키기 위해 조직적인 대응을 시작했으며, 이는 향후 우리 학원의 게헨나 점령 과정에 상당한 위협 요소가 될 것입니다. 이 저항 조직은 단순히 방어에 그치지 않고, 우리 측의 전술에 직접적인 방해를 가할 가능성도 배제할 수 없습니다.\n\n특히 이번 테러로 인해 [?TRM.TRM_anti_geh_emotion_var.GetName] 공장 지역이 주요 공격 대상이 되어, 공장 접근이 완전히 차단된 상태입니다. 해당 공장은 지역 내 주요 생산 및 공급 거점으로, 공격의 여파로 인해 물류와 자원 조달이 심각한 영향을 받고 있습니다. 이로 인해 게헨나 학원뿐만 아니라 주변 지역에도 경제적 충격이 확산될 우려가 제기되고 있습니다.\n\n점령 계획이 계획대로 진행되도록 철저한 전략 조정이 요구됩니다."
 TRMDIP.20.a: "우리는 다른 계획이 필요하다..."

 TRMDIP.21.t: "[TRM.GetAdjective]와의 불가침 조약"
 TRMDIP.21.d: "트리니티 외무부는 양국 간의 불가침 조약을 제안했습니다. 이 조약은 상호 무역을 대폭 확대할 뿐 아니라, 추가된 비밀 의정서에는 스칸디나비아 전역을 붉은겨울의 권역으로 인정한다는 내용이 포함되어 있습니다.\n\n에덴의 파시스트들이 신뢰하기 어려운 대상일 수는 있지만, 이 협정에 서명함으로써 타국의 간섭에 대한 우려 없이 스칸디나비아에 대한 통치권을 정당화할 수 있는 명분을 확보할 수 있습니다. 더 나아가, 만약 핀란드가 붕괴한다면 이를 계기로 핀란드를 우리의 영토로 편입하는 것도 노려볼 수 있을 것입니다."
 TRMDIP.21.a: "조약에 서명한다."
 TRMDIP.21.b: "파시스트와는 거래하지 않는다!"
 TRM_RED_pact: "트-붉 불가침 조약"
 refused_TRM_RED_pact: "불가침 조약 거브"

 TRMDIP.22.t: "[RED.Capital.GetCapitalVictoryPointName]의 조약 수락!"
 TRMDIP.22.d: "[RED.GetNameDefCap]은 현명하게도 우리의 불가침조약에 서명했습니다. 이는 우리가 붉은겨울의 개입 위험으로부터 자유롭게 행동할 수 있음을 뜻합니다."
 TRMDIP.22.a: "외교의 승리군."

 TRMDIP.23.t: "[RED.Capital.GetCapitalVictoryPointName]의 조약 거부!"
 TRMDIP.23.d: "[RED.GetNameDefCap](은)는 현명하지 않게 우리의 조약에 거부하였습니다. 이는 분명 우리를 향한 음모가 존재합니다."
 TRMDIP.23.a: "불쾌하군"

 TRMDIP.24.t: "독일인 소요"
 TRMDIP.24.d: "수많은 독일인들이 우리를 향해 반기를 들며 폭동을 일으켰습니다. 이들은 \"하나된 조국\"을 외치며 게헨나의 상징물을 파손하거나 그 위에 낙서를 하는 등, 체제에 반하는 행동으로 저항의 목소리를 높였습니다. 그들의 분노는 거리 곳곳에서 폭발하며, 게헨나의 권위를 정면으로 부정하는 모습을 보였습니다.\n\n현재 폭동은 어느 정도 진압되어 가고 있으나, 이번 사태가 단순한 자발적 움직임이 아니라 누군가의 사주와 조종에 의한 것처럼 보이는 정황이 포착되고 있습니다. 특히 트리니티가 배후에 있을 가능성이 가장 유력하게 거론되고 있습니다."
 TRMDIP.24.a: "내정 간섭이다."


 TRMDIP.25.t: "글라이비츠 중재"
 TRMDIP.25.desc: "주데텐 실레시아에서의 독일인 탄압은 게르만 민족에게 있어서 정말로 가슴 아픈 일입니다. 우리는 지난 1919년에 합의한 민족자결주의 원칙을 수호함으로써 세계평화에 기여할 의지가 충분합니다. 우리는 작금의 체코 지방에서 교란되어 상호 비조응하는 국경선과 민족분포를 올바르게 재정립할 것을 대사관을 통해 상대국에게 정중하게 요청하고, 또한 주데텐 실레시아의 양도를 이끌어낼 것입니다."
 TRMDIP.25.a: "그곳은 우리 영토다."

 TRMDIP.26.t: "글라이비츠 중재"
 TRMDIP.26.desc: "[TRM.getname](으)로부터 [74.getname]와 [72.getname]에 대한 영유권을 포기하고 민족자결주의의 원칙에 따른 새 국경선을 정립할 것을 요구받았습니다."
 TRMDIP.26.a: "그들의 의향을 받아들이자."
 TRMDIP.26.b: "터무니 없는 소리!"
 
 TRMDIP.27.t: "거절"
 TRMDIP.27.desc: "우리의 중재는 당사국에게 거절당했습니다."
 TRMDIP.27.a: "두 번째 방법을 쓰자."
 TRMDIP.27_tt: "§L주데텐란트의 독일인들이 호응하여 봉기합니다.§!"
 TRMDIP.27.b: "한 발 물러서자."
 
 TRMDIP.28.t: "[TRM.getname]의 최후통첩"
 TRMDIP.28.desc: "[TRM.getname](은)는 [SLO.getname]의 영토를 재조정하기 위한 중재에의 무조건적 수용을 요구하였습니다."
 TRMDIP.28.a: "별 다른 수가 없다."
 TRMDIP.28.b: "맞서 싸우자!"
 
 TRMDIP.29.t: "[TRM.getname]의 제안"
 TRMDIP.29.desc: "[TRM.getname] 대사관에서 우리에게 슬로바키아 전역의 행정권을 보장하는 대신 군사 동맹을 요구하였습니다."
 TRMDIP.29.a: "솔깃하군."
 TRMDIP.29.b: "거절하자."
 
 TRMDIP.30.t: "슬로바키아의 운명"
 TRMDIP.30.desc: "슬로바키아는 열등한 슬라브 국가이나 독일적 색채가 옅게 나마 남아 있기 때문에 게르만 민족을 대변하는 [TRM.getname]에 의해서 계도되어야만 합니다. 슬로바키아에 보낸 우리의 최후통첩이 수용됨에 따라 우리는 슬로바키아에 친선 정권을 세울 수도 있지만, 헝가리와의 결속을 위해 이를 헝가리에게 넘겨줄 수도 있습니다."
 TRMDIP.30.a: "친선 정권을 세우자."
 TRMDIP.30.b: "헝가리를 우리와 결속시키자."

 TRMDIP.31.d: "[TRM.getname](은)는 같은 파시즘 국가임을 강조하며 세력 초대를 보내왔습니다. 이탈리아는 파시즘 국가가 맞지만 저 외계인들이 주장하는 파시즘과는 거리가 멉니다. 우리가 만약 이들의 초대를 받는다면 강력한 동맹이 세워지겠지만, 우리 국민들은 저들과의 동맹을 원하지 않습니다."

#신성통치령 관리 사건과 결정
 TRM_kivotos_core_states_categories: "신성통치령 설립"
 TRM_kivotos_core_states_categories_desc: "우리 제국은 광대한 영토를 정복하는 데 성공하였으나, 이를 효율적으로 통치할 행정 역량이 부족하였습니다. 이에 대한 해결책으로 점령지에 \"신성통치령\"을 수립하기로 결정하였습니다. 신성통치령은 중앙 정부의 직접적인 통제 없이 반자치적 형태로 운영되며, 제국에서 선출한 관료와 현지 관료들에게 상당한 권한을 부여하였습니다. 이를 통해 제국의 행정 부담을 줄이면서도 효과적인 통치 체제를 구축할 수 있었습니다."
 TRN_MOSCOW_HOLY_MANDATE: "모스크바 신성통치령 통합"
 TRN_Holy_Mandate_Trigger_tt: "§Y하이라이트§!로 강조된 모든 주를 [ROOT.GetAdjective], 혹은 [ROOT.GetAdjective]의 괴뢰국이 지배중"
 TRN_KAPKAS_HOLY_MANDATE: "캅카스 신성통치령 수립"
