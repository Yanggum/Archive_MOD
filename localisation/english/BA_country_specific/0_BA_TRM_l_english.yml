#새로운 트리니티 붕괴 체인
 TRN_collapse_event.1.t: "반트리니티 저항 조직 결집"
 TRN_collapse_event.1.desc: "우리의 저항군 소탕 작전은 치명적인 실패로 끝이 났고, 그 결과 민심은 완전히 저항 세력 쪽으로 기울어졌습니다. 이 변곡점은 그들에게 커다란 기회를 제공하였으며, 이제 그들은 '트리니티의 멸망'이라는 구호를 내걸고 점점 더 과감하게 움직이고 있습니다.\n\n저항군은 단순히 무장 세력에 그치지 않고, 도시와 농촌을 막론한 광범위한 시민들의 지지를 얻으며 세력을 확장해 나가고 있습니다. 그들은 군사적 힘뿐만 아니라 민심의 지지를 무기로 삼아, 우리가 장악했던 지역을 하나씩 빼앗고 있습니다.\n\n이제 우리는 단순한 저항군을 상대하는 것이 아니라, 이들과 결속한 대중 전체와 싸워야 하는 상황에 직면했습니다. 민심을 되돌리지 않는 한 이 전쟁은 더욱 길어질 것이며, 우리는 그들에게 도시와 마을을 내줄 수 없습니다. 이 전쟁은 단순한 전투를 넘어, 우리 학원의 존속을 건 필사의 싸움이 될 것입니다."
 TRN_collapse_event.1.a: "당장 대처해야 해."

 TRN_collapse_event.2.t: "저항군 봉기"
 TRN_collapse_event.2.desc: "저항군이 그들의 지휘 조직을 완벽히 수립하는 동안, 우리는 그들을 저지하기 위한 효과적인 조치를 취할 수 없었습니다. 우리의 방심과 혼란 속에서 저들은 철저히 준비를 마쳤고, 이제 그들만의 독자적인 체제를 세워 우리의 지배에 맞서 싸울 준비가 완료되었습니다.\n\n이제 저항군은 그들의 새로운 국가적 정체성을 확립하며, 공식적으로 우리에게 전쟁을 선포했습니다. 그들은 더 이상 숨어서 활동하는 세력이 아닙니다. 오히려 하나의 단일 체제로 우리에게 대항하며, 대중의 지지를 등에 업고 자신들의 목표를 강력히 추진하고 있습니다.\n\n이 상황에서 우리는 결코 물러설 수 없습니다. 저항군의 발호를 저지하지 못한다면, 우리의 체제와 학원은 무너질 위기에 처할 것입니다. 모든 힘을 다해 그들의 전진을 막고, 우리의 존립을 지켜내야만 합니다. 이제 모든 것은 트리니티의 이름 아래, 우리 학원의 존엄을 지키기 위한 총력전이 될 것입니다. 어떤 희생이 따르더라도 우리는 승리해야만 합니다. 트리니티를 위하여!"
 TRN_collapse_event.2.a: "무슨 수를 써서라도 진압해!"
 TRN_collapse_event.2.b: "트리니티를 타도하라!"

 TRN_collapse_event.3.t: "여파"
 TRN_collapse_event.3.desc: "저항군, 아니 이제는 반군이라 불러야 할 저들의 세력이 날이 갈수록 커져가고 있습니다. 그들의 위세는 단순한 무장 활동을 넘어섰고, 이제는 자신들만의 체제를 갖추고, 명확한 강령을 발표하며 대중을 선동하고 있습니다. 그들의 영향력은 급속도로 확산되었고, 이를 본 다른 반란 세력들이 하나둘씩 그들의 방식을 모방하고 있습니다.\n\n각지에서 트리니티에 맞서겠다는 강령이 퍼져 나가며, 우리에게 저항하는 반란 조직들이 점점 더 늘어나고 있습니다. 저들은 저항군의 성공적인 활동을 본보기로 삼아, 자신들의 독립된 세력으로 발전하고 있으며, 이제 그들은 단순한 소규모의 반란이 아닌 체계적인 전쟁을 준비하고 있습니다.\n\n그리고 오늘, 그 반란 조직들 중 하나가 우리에게 공식적으로 선전포고를 감행했습니다. 이로 인해 우리는 더 광범위한 전선에서 싸워야 할 처지에 놓였습니다. 반란은 더 이상 한 지역의 문제가 아닌, 학원 전역에서 발생하고 있는 심각한 위협으로 번지고 있습니다. 우리는 이제 더 큰 규모의 전쟁에 대비해야 하며, 학원의 생존을 위해 모든 자원을 동원해 이 새로운 전선에서 싸워야만 합니다. 우리의 운명이 걸린 이 전쟁에서 후퇴는 없습니다. 트리니티를 수호해야 합니다."
 TRN_collapse_event.3.baddesc: "오늘, 또 하나의 반란 조직이 우리에게 선전포고를 했습니다. 이제 우리는 여러 전선에서 동시에 싸워야 하는 상황에 놓였으며, 이 싸움은 우리의 모든 자원을 요구하고 있습니다. 이제는 학원의 생존을 위한 총력전이 시작되었습니다."
 TRN_collapse_event.3.a: "지금이라도 막아 세워야 해!"

 TRN_collapse_event.4.t: "[FROM.GetName]의 붕괴"
 TRN_collapse_event.4.desc: "우리와 전쟁 중인 [FROM.GetName]의 내부 정치 상황이 악화하며 반트리니티 저항군 조직이 재결집하는 계기가 되었습니다. 반트리니티 저항군은 트리니티를 향한 혁명전쟁을 선포하고 나섰으며, 이제는 지속적인 교전을 벌이고 있는 것으로 알려졌습니다.\n\n우리는 트리니티 저항 조직을 인정할지 아니면 그들을 인정하지 않고 우리의 전쟁을 지속할지 결정해야만 합니다."
 TRN_collapse_event.4.a: "그들은 죄가 없다."
 TRN_collapse_event.4.b: "이는 향후 국제 외교에 차질을 빚을 것이다."

 TRN_collapse_event.5.t: "폴란드와 재통합"
 TRN_collapse_event.5.desc: "폴란드 서부군의 처절한 항쟁 끝에 트리니티 침략자를 물리치고 영토를 되찾는 것에 성공했습니다. 이제 우리는 우리 조국으로 귀환하여 새로운 미래를 펼칠 수 있게 되었습니다. 물론, 이 지역의 영유권을 주장하고 서부 지역의 지배자가 될 수도 있을 것입니다."
 TRN_collapse_event.5.a: "우리는 서쪽으로 간다."
 TRN_collapse_event.5.b: "폴란드 만세!"

 TRN_collapse_event.6.t: "반트리니티 저항 조직"
 TRN_collapse_event.6.desc: "최근 벌어진 우리의 정치적 혼란을 틈타, 그동안 물밑에서 활동하던 저항 조직이 드디어 수면 위로 떠올랐습니다. '반 트리니티'를 외치며 결집하고 있는 저항군은 아직은 세력이 미미하지만, 혼란한 상황 속에서 그들의 영향력은 빠르게 확대되고 있습니다.\n\n지금 이 순간에도 저항군은 지지 세력을 늘려가고 있으며, 이를 방치할 경우 훨씬 더 큰 위협으로 다가올 것입니다. 더 늦기 전에 이들을 철저히 진압해야 합니다."
 TRN_collapse_event.6.a: "즉시 진압하라."

 TRN_collapse_event.7.t: "최후의 발악"
 TRN_collapse_event.7.desc: "우리의 신속한 탄압으로 인해 저항군은 준비가 되지 않은 상태에서 서둘러 우리에게 전쟁을 선포했습니다. 그들은 아직 완벽한 준비가 되어 있지 않으며, 이 혼란을 끝낼 기회가 우리에게 주어졌습니다.\n\n지금이야말로 저항군을 완전히 축출하고, 동요하는 민심을 바로잡을 결정적인 순간입니다. 빠르고 강력하게 대응해 혼란을 종식시켜야 합니다."
 TRN_collapse_event.7.a: "이게 전부인가?"

 TRN_collapse_event.8.t: "진압된 혼란"
 TRN_collapse_event.8.desc: "저항군은 우리의 지속적이고 신속한 진압 작전을 통해 다시 지하 속으로 사라졌고, 그들의 협력자는 전부 수감되었습니다. 저들이 다시 바깥으로 나오기에는 긴 시간이 필요할 것입니다."
 TRN_collapse_event.8.a: "좋아."

