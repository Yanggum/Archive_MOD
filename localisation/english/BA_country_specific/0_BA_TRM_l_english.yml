 TRN_after_war_event.20.t: "Establishment of Military Civil Administration"
 TRN_after_war_event.20.desc: "The Military Civil Administration is an administrative system established by Trinity to place Gehenna academies perfectly under their control, possessing immense authority from judiciary to administration. While this system contributes to maintaining order in the Gehenna region and strengthening Trinity's influence, it simultaneously produces side effects of suppressing students' freedom and autonomy. This is causing strong backlash and dissatisfaction among Gehenna students.\n\nGehenna students are expressing resistance to Trinity's rule in their own diverse ways. Among them are extreme means such as threats targeting officials or terror aimed at administrative institutions. These acts of resistance are widespread among Gehenna students and are appearing as a result of directly revealing antipathy toward the system.\n\nTrinity's Justice Task Force is continuously striving to suppress this situation. The process from detection of terror acts to immediate arrest and detention is proceeding swiftly, but resistance shows no sign of subsiding and is rather taking on an increasingly organized aspect.\n\nCurrently, the Military Civil Administration system aims for stability and control, but if conflict with Gehenna students cannot be resolved, continuous collision seems inevitable."
 TRN_after_war_event.20.a: "Let's try to resolve this as soon as possible."
 TRN_after_war_event.21.t: "Appointment of Military Governor"
 TRN_after_war_event.21.desc: "The Gehenna Military Civil Administration has been established. However, facing unexpected resistance, it was judged difficult to overcome this resistance movement unless the official was particularly competent. Accordingly, a total of two individuals were selected.\n\nThe first person is Hasumi Hanekawa of the Justice Task Force. She holds major public office with a hostile attitude toward Gehenna and excellent administrative processing skills, and is evaluated as a practical-minded person who does not reveal special lust for power. Although hostile to Gehenna, she is recognized as a balanced administrator showing a respectful attitude toward opponents in official settings.\n\nThe second person is Suzumi Morizuki of the Vigilante Crew. Although she is far from administrative work, she was recommended as the right person to suppress the resistance activities of Gehenna students, as she drew attention through practical activities such as patrolling for Trinity's public order. Suzumi was also confirmed to show no special lust for power."
 TRN_after_war_event.21.a: "Hasumi Hanekawa. Her administrative ability is trustworthy."
 TRN_after_war_event.21.b: "Suzumi Morizuki. Her vigilante activities will be of help."
 TRN_after_war_event.22.t: "Satisfied Hasumi"
 TRN_after_war_event.22.desc: "Hasumi Hanekawa seems to feel great satisfaction at being appointed as the Military Governor of the Gehenna Military Civil Administration. She responded very pleasingly to an interview request from a Trinity newspaper reporter, which was featured on the very front page. Government officials congratulated her appointment, but Tsurugi Kenzaki remained silent. Considering her usual attitude of professing political neutrality, it is not a very surprising thing.\n\nHowever, voices of concern are also emerging that the influence of the Justice Task Force has expanded excessively in relation to this."
 TRN_after_war_event.22.a: "Anyway, let's pray she does a good job."
 TRN_after_war_event.23.t: "Dissatisfied Suzumi"
 TRN_after_war_event.23.desc: "Suzumi Morizuki revealed that she felt deep repulsion and unpleasantness regarding her selection as the Military Governor of the Gehenna Military Civil Administration. This was content directly conveyed during an interview with a Trinity newspaper reporter.\n\nSuzumi rejected the interview request twice but responded to the third request, honestly opening up about her inner feelings.\n\nTsurugi Kenzaki of the Justice Task Force delivered a message of regret through the media. The fact that she, who usually kept silent on all incidents, exceptionally stated a position is being regarded as a noteworthy change."
 TRN_after_war_event.24.t: "National Salvation Committee for Peace and Order"
 TRN_after_war_event.24.desc: "While continuing to manage the Gehenna occupied territories, a special group contacted the Trinity central government. The National Salvation Committee for Peace and Order is an organization established to maintain public order and the rule of law in a situation where the Gehenna student council, Pandemonium Society, has effectively disbanded after the war between Trinity and Gehenna ended. The chairperson is Sena Himuro, and considering that most members of the committee are from the Emergency Medicine Department, it is thought that the Emergency Medicine Department has effectively made a decision to cooperate with Trinity."
 TRN_after_war_event.24.a: "Let's work with them"
 TRN_after_war_event.25.t: "Bomb Terror in Gehenna!"
 TRN_after_war_event.25.desc: "An incident occurred where a student belonging to Trinity carried out terror by throwing a bomb at an unspecified number of Gehenna students. The Justice Task Force quickly arrived and succeeded in subduing the student, but the Gehenna students who suffered damage from the terror are strongly reacting and demanding compensation."
 TRN_after_war_event.25.a: "Compensate for the damages minimally."
 TRN_after_war_event.25.b: "Compensate for all damages"
 TRN_after_war_event.26.t: "Battle Occurred in Gehenna Region"
 TRN_after_war_event.26.desc: "A shootout has broken out again in Gehenna. This incident began as guerrilla fighters belonging to the Student Resistance Union ambushed a Trinity military convoy.\n\nThe separatist forces were mostly from the former Gehenna military and attacked the convoy through relatively sophisticated tactics. They succeeded in blocking the path of the convoy consisting of trucks and armored vehicles and seizing a significant number of weapons. However, the Trinity side is strengthening its vigilance, so the same thing will not be repeated next time."
 TRN_after_war_event.26.a: "Cursed indeed"
 TRN_after_war_event.27.t: "Large-Scale Protest in Gehenna"
 TRN_after_war_event.27.desc: "Not all Gehenna students participate in protests, but a significant number hold strong hostility toward Eden. These feelings are further exacerbated by the actions of the Trinity Justice Task Force and ground forces, exploding sporadically in protests and strikes.\n\nAs a recent incident of unjust arrest occurred, a new wave of protests is rising in Gehenna. Protesters have taken to the streets demanding a stop to the police's violent acts and respect for political rights."
 TRN_after_war_event.27.a: "Let's try to avoid the conflict growing"
 TRN_after_war_event.27.b: "Arrest them!"
 TRN_after_war_event.28.t: "Non-Violent Resistance Movement Throughout Gehenna"
 TRN_after_war_event.28.desc: "A large number of Gehenna dissidents have come out to the streets, holding protest signs and blocking roads while raising their voices. They are demanding loose legal revisions, expansion of Gehenna's autonomy, and even the academy's independence."
 TRN_after_war_event.28.a: "Grant some of the demands"
 TRN_after_war_event.28.b: "Disperse them with force"
 TRN_after_war_event.28.c: "Ignore them"
 TRN_after_war_event.29.t: "Socialist Agitation"
 TRN_after_war_event.29.desc: "In a situation where the Comintern exists, it is not a surprising thing for socialist rhetoric to spread in the Gehenna resistance movement.\n\nCurrently, the Comintern is actively urging resistance against the 'Trinity Occupation Forces' to promote a socialist revolution in Gehenna. Weapons smuggled from socialist countries are being provided to Gehenna students, and socialist groups are also gradually revealing themselves. This is approaching as a reality, not just a possibility."
 TRN_after_war_event.29.a: "Cursed communists."
 TRN_after_war_event.30.t: "Military Governor Attacked!"
 TRN_after_war_event.30.desc: "Today, news was delivered that the Military Governor, who was on an inspection in Hanover, was attacked and injured. The culprit of this incident was determined to be a student who acted alone among those joined in the Gehenna Student Resistance Union."
 TRN_after_war_event.30.a: "This is a serious incident."
 TRN_after_war_event.40.t: "[FROM.GetAdjective] Demands Territory Return"
 TRN_after_war_event.40.desc: "[FROM.GetLeader], the leader of [FROM.GetName], has sent an official notice demanding the return of Gehenna territory. As [FROM.GetAdjective] recently claimed territorial integrity over Gehenna territory, this demand also seems highly likely to be related to that."
 TRN_after_war_event.40.a: "Grant their demand."
 TRN_after_war_event.40.b: "This region belongs to [ROOT.GetAdjective]!"
 TRN_after_war_event.41.t: "[FROM.GetAdjective] Returned Gehenna Territory"
 TRN_after_war_event.41.desc: "The [FROM.GetAdjective] side decided to accept our demand and return the Gehenna territory. This seems to be an intention to ease diplomatic tension and improve relations between the two sides."
 TRN_after_war_event.41.a: "A victory for diplomacy!"
 TRN_after_war_event.42.t: "[FROM.GetAdjective] Rejected Our Demand!"
 TRN_after_war_event.42.desc: "The [FROM.GetAdjective] side politely rejected our demand, stating they cannot accept [ROOT.GetAdjective]'s claim based on sovereignty over the Gehenna territory."
 TRN_after_war_event.42.a: "Then there is only war."

