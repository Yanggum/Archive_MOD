 TRM_event.29.a: "선조들이여.."

 TRM_event.30.t: "트리니티의 최후통첩!"
 TRM_event.30.desc: "트리니티가 항복하고 괴뢰국이 된다면 두 사이 양국간의 전쟁은 없으며 영원한 우호 조약을 체결하겠다는 내용"
 TRM_event.30.a: "저리 꺼져!"
 TRM_event.30.b: "항복한다 살려만다오!"

 TRM_event.31.t: "우리의 요구를 거부한 [FIN.Getname]"
 TRM_event.31.desc: ""
 TRM_event.31.a: "우리는 군사적 개입을 고려해야 한다."

 TRM_event.32.t: "우리의 요구를 수락한 [FIN.Getname]"

 TRM_event.34.t: "늦은 밤"
 TRM_event.34.desc: "어두운 밤하늘 아래, 트리니티 군대의 실루엣이 게헨나 국경선을 향해 조용히 접근했다. 국경 초소의 불빛이 희미하게 깜박이는 가운데, 긴장감이 공기 중에 감돌았다.\n\n갑자기 트리니티의 선봉대가 국경선을 넘어섰다. 그 순간, 고요했던 밤공기를 가르며 귀청이 터질 듯한 폭발음이 울려 퍼졌다. 하늘이 불꽃으로 밝아지며 트리니티의 포격이 시작되었다.\n\n게헨나 국경 수비대는 순식간에 혼란에 빠졌다. 예상치 못한 기습 공격에 당황한 병사들은 대응할 새도 없이 후퇴 명령을 받았다. 포탄이 쏟아지는 가운데 게헨나 군은 질서 있게 철수를 시작했다.\n\n국경 초소와 방어 시설들이 하나둘 무너져 내렸다. 트리니티 군의 전차와 보병부대가 파괴된 장벽을 넘어 게헨나 영토로 진격했다. 게헨나 군은 계속해서 후퇴하며 저항했지만, 트리니티의 압도적인 화력에 밀려 더 깊숙이 물러났다.\n\n전쟁의 서막이 올랐다. 트리니티의 기습 공격으로 시작된 이 밤은 양국 모두에게 긴 전쟁의 시작을 알리는 신호탄이 되었다."
 TRM_event.34.a: "돌격!"

 TRM_event.35.t: "게헨나 영토 처리"
 TRM_event.35.desc: "게헨나와의 전쟁에서 승리하면서 전쟁 이후의 판도를 논의하기 시작하였습니다."
 TRM_event.35.a: "위대한 승리다!"

 TRM_event.36.t: "선전물"
 TRM_event.36.desc: "게헨나 국민 여러분!\n\n우리의 조국이 위기에 처했습니다. 트리니티의 불법적인 침략으로 우리의 평화로운 삶이 위협받고 있습니다. 하지만 우리는 결코 굴복하지 않을 것입니다.\n\n게헨나의 역사는 항상 압제을 이겨낸 자유로운 학생들의 이야기였습니다. 지금이야말로 우리가 하나로 뭉쳐야 할 때입니다.\n\n우리의 자유와 주권을 지키기 위해 모든 시민들의 힘이 필요합니다. 군인들은 전선에서, 민간인들은 후방에서 각자의 역할을 다해야 합니다.\n\n트리니티는 우리의 의지를 과소평가했습니다. 우리는 그들에게 게헨나의 진정한 힘을 보여줄 것입니다.\n\n동포 여러분, 우리의 땅과 가족, 그리고 미래를 위해 일어섭시다! 게헨나의 정신으로 뭉쳐 이 위기를 극복합시다!\n\n우리는 반드시 승리할 것입니다. 게헨나여 영원하라!"
 TRM_event.36.a: "게헨나여, 승리하라!"

 TRM_event.38.t: "트리니티 산업개발부 전문화"
 TRM_event.38.desc: "트리니티 산업개발부는 설립 초기, 다양한 실험적 정책을 시행하며 경험을 쌓아갔습니다. 이러한 실험은 성공과 실패를 반복했으며, 특히 실패를 통해 얻은 교훈은 산업개발부의 전문성과 숙련도를 높이는 밑거름이 되었습니다.\n\n현재 산업개발부는 시장경제와 계획경제의 장점을 융합하여 새로운 경제 체제를 모색하고 있습니다. 초기의 시행착오를 통해 정책 수립과 실행 능력이 크게 향상되었으며, 이들의 전문성은 이제 트리니티 경제 발전의 핵심 요소로 자리 잡았습니다. 산업개발부는 시장경제 체제를 기반으로 기업을 경영하고 통제하는 한편, 국영기업을 설립하며 다양한 경제 정책을 실험하고 있습니다. 이러한 시도는 성공적인 성과를 거두며 트리니티의 경제 구조를 한층 더 발전시키고 있습니다."
 TRM_event.38.a: "오늘 만큼은 트리니티를 위해 건배하자!"
 
 TRM_event.39.t: "합창단"
 TRM_event.39.desc: "웅장한 홀에서 미카가 연설을 시작했다. 그녀의 목소리는 독기 어린 열정으로 가득 찼고, 게헨나를 향한 강한 비난으로 시작되었다. 미카는 게헨나의 부패와 무능을 규탄하며 트리니티의 위대함을 강조했다.\n\n\"게헨나는 탐욕과 부패, 약속불이행의 공허하고 한심한 행위들을 토대 삼아 학생들의 고통 위에 세워진 학원입니다!\" 미카의 독설에 청중들은 점점 고조되기 시작했다.\n\n그녀는 계속해서 말을 이어갔다. \"우리는 맞서야 합니다. 게헨나와의 전쟁은 필연적인 것입니다! 저 악마년들의 본성은 사악하기 때문입니다!\" 미카의 말에 청중들은 열광적으로 반응했고, 일부는 손을 들어올려 경례를 하기도 했다.\n\n\"우리는 승리할 것입니다, 우리는 나아갈 것입니다! 영광은 계속될 것입니다!\" 미카의 마지막 외침과 함께 연설이 끝났다.\n\n곧이어 트리니티 찬가가 울려퍼졌다. 처음에는 한 독일인이 일어나 부르기 시작했고, 이어서 정의실현부 소녀, 수녀복을 입은 소녀, 정복을 입은 남자 등이 차례로 일어나 노래를 불렀다.\n\n\"돌격대가 조용하고도 확고한 걸음으로 행진한다\"\n\"게헨나 악마년들과 반동분자들에게 살해당한 동지들도\"\n\"영혼이 되어 우리의 대열 속에서 함께 행진한다\"\n\n순식간에 홀 전체가 합창에 참여했다. 자경단, 정의실현부, 구호기사단, 시스터후드 등 다양한 단체의 구성원들이 모두 일어나 열정적으로 노래를 불렀다.\n\n\"수많은 사람들이 희망차게 위대한 트리니티의 교기를 올려다보니\"\n\"자유와 빵을 위한 날이 다가온다!\"\n\n모든 이의 시선은 미카에게 집중되었다. 그녀를 향한 충성심과 애정이 가득 담긴 눈빛들을 바라보며, 미카는 깊은 미소를 지었다. 그녀의 눈빛에는 승리의 확신과 함께 트리니티의 미래에 대한 강한 의지가 깃들어 있었다."
 TRM_event.39.a: "곧 트리니티의 깃발이 온 거리에 나부끼리라. 트리니티는 영원하리라!"

 TRM_event.40.t: "국방군 잔당 흡수"
 TRM_event.40.desc: ""
 TRM_event.40.a: "나는 하느님께 엄숙히 맹세하오니 미소노 미카에게 무조건적인 복종을 바치며..."

 TRM_event.41.t: "전선 고착화 우려"
 TRM_event.41.desc: "\"비서, 전황을 보고 해줘.\"\n\n\"네. 지금 꽤나 우려스러운 상황이 발생하고 있습니다. 일부 계획은 성공을 거뒀으나, 예상치 못한 저항에 직면하면서 일부 계획이 부분적으로 성공하거나, 실패하고 있습니다.\"\n\"그래..? 그렇다면 이 상황을 타개할 방법이 없을까?\"\n\n\"저로써는 아직 잘 모르겠지만...\"\n\n미소노 미카는 비서의 말을 들으며 생각에 잠겼다. 최근 들어 미소노 미카의 계획이 순탄치 않다는 사실은 이미 알고 있었지만, 직접적으로 보고를 받으니 그 긴장감은 더욱 고조되었다. 비서는 미소노 미카의 신임을 받는 인물이었고, 그만큼 보고가 정확하리라 믿었다. 그러나 비서의 마지막 말은 자신감이 결여된 듯 애매하게 흐려졌고, 미소노 미카는 그 점이 신경 쓰였다.\n\n\"우려스러운 상황이라...\" 미소노 미카는 중얼거리며 방 안을 천천히 걸었다. 실패한 계획이 더 많았을까? 아니면 성공한 계획이 반전의 기회를 제공할 수 있을까? 여러 생각이 머릿속을 지나쳤다.\n\n비서는 긴장한 듯 입술을 깨물었다. 무엇을 숨기고 있는 걸까? 아니면 해결책이 보이지 않아 불안해하는 것일까? 미소노 미카는 비서의 어깨에 손을 얹고 부드럽게 물었다. \n\n\"아직 정확히 무엇이 문제인지 알 수 없는 거지?\"\n\n비서는 고개를 끄덕였지만, 눈빛에는 답답함이 서려 있었다. \"저도 더 많은 정보를 수집하고 있지만, 확실한 대안은 아직 파악되지 않았습니다.\"\n\n미소노 미카는 잠시 침묵했다. 이대로 머물러서는 안 된다는 생각이 들었다. 예상치 못한 저항이 무엇이었든, 이 상황을 해결하기 위한 전략이 필요했다.\n\n\"그럼 더 알아봐 줘. 우리는 실패할 여유가 없어.\""
 TRM_event.41.a: "그래."

 TRM_event.42.t: "게헨나의 끝"
 TRM_event.42.desc: "[GEM.GetLeader] 회장이 무릎꿇고 항복 문서에 서명하며 트리니티 - 게헨나 전쟁이 끝난 일주일 후. 게헨나 중앙구의 거리에는 무거운 그림자가 내려앉아 있었다. 무질서하지만 유쾌하였던 학생들의 일탈과 활기찬 분위기로 장식되었던 활기찼던 중앙구는, 이제 그 분위기는 하나도 찾아볼 수 없이 침체된 채로 서 있었다. 그러나 게헨나의 침울한 분위기와 달리, 승리한 트리니티 학생들의 얼굴에 담겨있는 환희는 완전히 암울한 게헨나의 분위기외 대조되었다.\n\n평소의 유쾌한 표정과는 달리 슬픔으로 얼굴이 새겨진 게헨나의 학생들은 마치 그림자처럼 조용히 도시를 누볐다. 원래 이곳의 주인이였지만, 지금은 그림자처럼 숨어다니는 그녀들과는 다르게 거리를 행진하는 트리니티 방위군 병사들의 모습은 너무나도 밝고도 밝았다..그녀들은 옅은 회색을 가진 제복을 입고 트리니티 파테르 분파의 문양이 새겨진 완장을 차고 있었다. 그녀들은 엄연한 승리자였다. 그녀들은 승리자의 엄연한 권리에 따라 정복의 기쁨을 만끽했고, 그녀들의 환호와 요란한 웃음소리는 게헨나 학생들의 마음속에 모욕감을 안겨주었다.\n\n한때 북적거리던 게헨나의 유명한 디저트 카페의 아름다운 테라스는 이제 몇몇 사람들 미식연구회의 몇몇 일원들이라던가 게헨나가 망한 거에 별 감흥을 느끼지 못하는 현지인들 빼곤 완전히 비어있었다. 그리고 미식연구회에게서는 특히 게헨나 학생들이 느끼고 있을 산산조각 난 꿈과 잃어버린 희망을 자세히 엿볼 수 있었다. 평소라면 미식이 어쩌고 저쩌고 하며 이야기꽃을 늘어놓으며 가게를 폭파시키던 하루나조차 아무 말도 하지 않은 채 앉아만 있었고, 그나마 이즈미가 분위기를 살려보기 위해 여러가지 말을 꺼내곤 했지만 빈번히 실패했다. 낙담한 학생들 사이에서는 낙담한 대화가 오갔고, 그들의 낮고도 낮은 목소리는 군인들의 환호성에 가려 거의 들리지 않았다."
 TRM_event.42_2.desc: "소라사키 히나가 게헨나 최후의 전투에서 산화하고 그녀의 뒤를 이은 아마우 아코 회장이 항복 문서에 서명한지 일주일이 지난 게헨나의 중앙구의 거리에는 무거운 그림자가 내려앉아 있었다. 무질서하지만 유쾌하였던 학생들의 일탈과 활기찬 분위기로 장식되었던 활기찼던 중앙구는, 이제 그 분위기는 하나도 찾아볼 수 없이 침체된 채로 서 있었다. 그러나 게헨나의 침울한 분위기와 달리, 승리한 트리니티 학생들의 얼굴에 담겨있는 환희는 완전히 암울한 게헨나의 분위기외 대조되었다.\n\n평소의 유쾌한 표정과는 달리 슬픔으로 얼굴이 새겨진 게헨나의 학생들은 마치 그림자처럼 조용히 도시를 누볐다. 원래 이곳의 주인이였지만, 지금은 그림자처럼 숨어다니는 그녀들과는 다르게 거리를 행진하는 트리니티 방위군 병사들의 모습은 너무나도 밝고도 밝았다..그녀들은 옅은 회색을 가진 제복을 입고 트리니티 파테르 분파의 문양이 새겨진 완장을 차고 있었다. 그녀들은 엄연한 승리자였다. 그녀들은 승리자의 엄연한 권리에 따라 정복의 기쁨을 만끽했고, 그녀들의 환호와 요란한 웃음소리는 게헨나 학생들의 마음속에 모욕감을 안겨주었다.\n\n한때 북적거리던 게헨나의 유명한 디저트 카페의 아름다운 테라스는 이제 몇몇 사람들 미식연구회의 몇몇 일원들이라던가 게헨나가 망한 거에 별 감흥을 느끼지 못하는 현지인들 빼곤 완전히 비어있었다. 그리고 미식연구회에게서는 특히 게헨나 학생들이 느끼고 있을 산산조각 난 꿈과 잃어버린 희망을 자세히 엿볼 수 있었다. 평소라면 미식이 어쩌고 저쩌고 하며 이야기꽃을 늘어놓으며 가게를 폭파시키던 하루나조차 아무 말도 하지 않은 채 앉아만 있었고, 그나마 이즈미가 분위기를 살려보기 위해 여러가지 말을 꺼내곤 했지만 빈번히 실패했다. 낙담한 학생들 사이에서는 낙담한 대화가 오갔고, 그들의 낮고도 낮은 목소리는 군인들의 환호성에 가려 거의 들리지 않았다."
 TRM_event.42.a: "끝없는 추락."
 TRM_event.42.b: "명예는 지켰군."

 TRM_event.43.t: "경제 장관 임명"
 TRM_event.43.desc: "알마르 샤흐트의 인생은 정말로 곱게 갈수는 없는 모양이었다. 자신이 몸담아 어떻게든 독일 경제를 살려내기 시작했더니, 세상에나, 나라가 통째로 뒤바뀌었다. 그리고 독일이 있던 자리에는 왠 여자아이들의 학원이 자리잡고 있었으니까.\n\n그렇게-샤흐트 자신은 그저 잊혀진 현지인1이 될 것이라고 생각했건만, 트리니티..라 했던가(아무튼 국가라고 해도 좋을 정도니  샤흐트는 그냥 국가라고 지칭하기로 했다)의 지도자가 자신을 불러들일 것이라고는 생각하지도 못했다.\n\n미소노 미카(샤흐트는 일본식 이름을 쓰면서 쓰는 언어는 일본어가 아니라는 데에 흥미를 느꼈다.)를 직접 만난 샤흐트의 소감은, 그녀가 꽤 경제에 대해 빠삭하다는 점이었다, 그나마 훌룡한 점이었다. 히틀러 그 놈은 경제라고는 하나도 몰랐는데.\n\n솔직히 말하자면 샤흐트는 미카의 제안에 혹하지 않을래야 않을 수가 없었다. 그는 경제전문가였고, 트리니티의 각종 새로운 기물들은 그의 호기심을 자극했던 것이다. 여기까지 오는 길, 수도 에덴의 광경을 보며 샤흐트의 머리속에는 '이곳에서는 엔화를 쓰는 것 같은데, 일본과 경제정책이 비슷하려나?''이곳의 물가가 어느 정도인지 감이 오지 않는군, 우리 독일과 비교하면 어떤 식이려나?''전 국민이 학생인것과 다름없는데, 경제활동은 어떻게 하는 거지?'같은 생각이 떠오르고 있었던 것이다.\n\n미소노 미카가 물론 나치당의 사상을 받아들였다는 사실을 알고 있었다. 하지만 그게 대수인가, 샤흐트는 최소한 저 분홍머리 여자가 히틀러보다는 훨씬 나은 인물이라고 지레짐작했다. 우선 자신이 떠벌리는 경제정책을 가만히 아무 반박도 안 하고 들어준다는 점 하나만 꼽아도, 이미 샤흐트의 마음속에서는 미카에 대한 점수가 100점을 훌쩍 넘어섰을지라.\n\n샤흐트가 정신을 차렸을때는 그는 정복을 입고 있었다."
 TRM_event.43.a: "경제장관, 알마르 샤흐트."

 TRM_event.44.t: "위대한 협상" # 선전물 배포
 TRM_event.44.desc: "레니 리펜슈탈 감독이 새롭게 만든 애국영화 [위대한 협상]이 트리니티 시민들 사이에서 열풍을 불러일으키고 있습니다.\n\n[위대한 협상]은 대략 300년 전 트리니티의 파테르, 필리우스, 상투스 세 학원의 분파가 분쟁을 중재하기 위해 연, 트리니티 종합학원의 시초가 된 제 1차 공의회를 배경으로 사악한 다른 두 분파에 맞서 정의를 지키기 위해 싸우는 파테르 분파의 병사 '후코'가 여러 사건을 겪게 되는 내용입니다. 게헨나의 사악함과 파테르 분파의 정의로움을 영상에 어색하지 않게 잘 담아내었다는 높은 평을 받았으며, 마지막 장면, 다른 두 분파의 협잡질로 인하여 협상에서 불리한 지위를 갖게 된 파테르 분파와 절망하는 후코의 모습이 나오는 순간에서는 영화 상영관의 전 관객이 눈물을 흘려 두 분파의 사악함에 치를 떨었습니다.\n\n그러나 그 장면 이후, 미카 여왕님의 취임식 연설이 화면에 상영되자 상영관에 있던 모든 이들이 300년 전의 치욕을 갚아주신 미카님의 은혜에 감복하여 눈물 흘리며 자리에서 일어나 '트리니티의 노래'를 제창하였습니다.\n\n미카 학생회장님께서는 리네 리펜슈탈 감독의 노고를 크게 치하하셨으며, 레니 리펜슈탈 감독에게 '앞으로도 수많을 작품을 만들기를 기원'이라고 당부하셨습니다."
 TRM_event.44.a: "저 여자, 영화를 잘 만들더군!"

 TRM_event.45.t: "트리니티 선전물 112호" # 선전물 배포
 TRM_event.45.desc: "트리니티 300년 역사중 가장 잘 먹고 잘 사는게 하신건 미카 학생회장이시며\n트리니티와 게르만인들을 자랑스럽게 만든 것 역시 미카님이시다.\n- 키보토스 2위 전술BD 수행률을 올해 목표보다 300퍼센트 초과달성한 자랑스런 학원\n- 키보토스에서 2위로 강력한 동아리(정의실현부)를 가진 학원,\n- 키보토스에서 가장 순혈적인 학원\n-트리니티 학우들을 세계 속에서 가장 우뚝 솟게하신 미카 학생회장.\n-[GEM.GetLeader]에 비해서도, 비교 자체가 안될정도로 청렴하게 성실하고 올바르게 트리니티 학원과 총통을 잃어버려 상심하여 있는 우리 게르만인들을 이끌어 주신 미카 학생회장.\n\n위대한 트리니티의 학우들과 게르만인들은 일생을 학원과 게르만의 영광을 위해 투쟁하시는 미카님을 깊히 존경하며, 사악하고 추악한 정치적 탄압은 물론, 더 이상 말할 수 없는 짓들까지 저지르는 게헨나 악마년들에게 본때를 보여줄 것입니다.\n\n일어나라 트리니티의 학우들이여!"
 TRM_event.45.a: "총력전이다!"

 TRM_event.46.t: "위대한 트리니티 방위군" # 선전물 배포
 TRM_event.46.desc: "게헨나 악마년들이 전쟁의 불을 지른다면 [GEM.GetLeader] 회장이 항복문서에 사인할 틈도 없이 무자비하게 게헨나를 초토화해버릴 것이다.\n모두 다 즉시 자랑스러운 트리니티 방위군에 입대하여\n우리의 미카 학생회장님의 영도에 따라, 우리의 집과 가족, 원토를 지키자!\n트리니티와 게르만 전통의 전쟁정신으로 승리를 앞당기기 위해 앞서나가자.\n온 키보토스가 자랑스러운 트리니티의 깃발 아래 하나로 굳게 뭉쳐\n미카님의 위대함을 찬양할 그때까지!\n자랑스러운 방위군에 입대하여, 국가사회 혁명의 전진을 더욱 가속해나가자!"
 TRM_event.46.a: "더 높은 곳을 향하여!"
 
 TRM_event.47.t: "충성스런 게헨나인"
 TRM_event.47.desc: "의로운 마음으로 [GEM.GetLeader] 회장이 아닌 위대하신 미카 학생회장님을 따르기 위해 우리 트리니티로 넘어오는 의로운 게헨나인들에게\n-트리니티 원생의 권리, 자유를 보장함\n-철원훈장, 생활보장금 지급\n-직업, 직장 알선\n-인종 등급 2등급으로 상승\n-차후 있을 '처리'에 예외권 발급\n-생활보장금 1만엔 지급\n\n조건:\n게헨나 선도부, 만마전 등에 대한 활동 기록 없어야 함\n트리니티 방위군의 모든 지시에 응해야 함\n모든 총기 무장은 평생 소지 금지함\n위대하신 미카 학생회장님의 저서를 정독하여 시험에 통과해야 함"
 TRM_event.47.a: "트리니티 방위위원회"

 TRM_event.48.t: "트리니티의 안슐루스 압박"
 TRM_event.48.desc: "시위자들이 산해경과 트리니티의 독일인들과 연합하기를 바라는 그들의 욕구를 표명하면서 각지에서 시민 소요와 폭력 행위가 발생하고 있습니다. 에덴은 산해경의 합병을 강력히 요구하고 있습니다."
 TRM_event.48.a: "우린 트리니티와 하나가 되어야한다!"
 TRM_event.48.b: "아니, 산해경의 운명은 다른 곳에 있다."

 TRM_event.50.t: "병합(anschluss)"
 TRM_event.50.desc: "산해경에서 반복되는 봉기는 그들이 우리나라와 하나되기를 원하고 있음을 확실하게 보여주고 있습니다. 이제는 행동에 나서 그들의 의지가 분명하게 드러나도록 만들 때입니다."
 TRM_event.50.a: "누가 감히 오스트리아가 독일이 아니라고 말할 수 있겠는가!?"

 TRM_event.51.t: "산해경의 합병 거부!"
 TRM_event.51.desc: "산해경 중앙특구의 바보들이 우리 두 나라의 합병을 받아 들이는 것을 거절했습니다! 이것은 오스트리아 국민의 의사를 노골적으로 무시한 것이고, 이는 참을 수 없는 행위입니다! 우리는 군사적인 수단을 동원해서라도 합병을 시행해야 할지도 모릅니다. "
 TRM_event.51.a: "우리는 군사적 개입을 고려해야한다."
 
 TRM_event.52.t: "[From.GetNameDefCap]의 주데텐란트 요구"
 TRM_event.52.desc: "이런 상황 중에, 트리니티는 이 지역의 \"독일 주민들 보호\"라는 명분으로, 우리에게 주데텐란트 영토를 요구하고 있습니다.\n\n이런 상황에서, 어떤 협상이나 외교는 없을 것을 그들은 매우 분명하게 정했습니다. 그들이 주데텐란트를 가지거나, 그러기 위해 전쟁을 할 것입니다."

 TRM_event.49.t: "코제키 우이"
 TRM_event.49.desc: "\"에, 저, 저인가요? 정말로?\"\n\n보라색 머리가 이리저리 헝클어져 있는, 피곤해보이는 눈을 한 소녀, '코제키 우이'가 덜 떨 떨며 감히 미카 앞에서 말을 꺼냈다.\n\n\"그렇다구~~우이짱은 고서관에만 틀어박혀서 다른 아이들이랑 놀지도 않구! 똑똑하잖아! 경제에 대해서 잘 알거라고 생각해!\"\n\n\"저, 저를, 경제,장관에 임명하셔서,⋯ 어떤 걸 시키시려고⋯?\"\n\n\"간단한 거야! 그냥 우이짱이 고서들을 보면서 아는 경제지식으로 보고서를 보며 경제 관리를 적당히 해주면 되!\"\n\n\"너,너무 설명이 대충이에요오오옷.....\"\n\n우이는 아직도 벌벌 떨며 미카의 앞에 앉아 있었다. 당연한 일이었다, 그 누가 모두를 숙청하고 옥좌에 앉은 '밤의 여왕'을 두려워하지 않을 수 있을까.\n\n\"에헤~그럼 내가 우이짱에게 의욕을 줄게! 힘내라! 힘! 힘내라! 히임~~!\"\n\n\"조, 조금은⋯ 의욕이 생기는 것 같기도 하고⋯ 아닌 것 같기도 하고⋯\"\n\n미카가 우스꽝스러운 행동을 했는데도 불구하고 우이가 확답을 하지 않아 미카의 표정이 굳어졌다. 우이가 그런 미카의 표정을 보며 히익하고 벌벌 덜었고, 미카는 굳은 얼굴로 그녀의 치마폭에 걸려 있는 총을 우이의 머리에 겨누었다.\n\n\"히...히이익...미..미카님...사, 살려주세요오오....\"\n\n\"우이짱, 이제 말장난은 그만 하지 않을래? 이 총은 말이지, 개조된 거라 우이짱의 머리를 뚫어버릴 수도 있어, 그러니 더 이상 내 심기를 건드리지 않....\"\n\n\"네에엣...할게요...한다구요....!\"\n\n우이가 드디어 확답하자, 미카의 굳은 표정이 풀리고 소름돋을 정도로 빠르게 평소모습으로 돌아왔다.\n\n\"좋아, 우이짱, 그럼 내일부터 보자구, 우이 장관님~~~!\"\n\n미카가 먼저 방에서 나가자, 우이는 식은땀을 흘리며 주저앉았다.\n\n그녀는 정말로 자신의 안락한 보금자리인 고서관으로 돌아가고 싶었다."
 TRM_event.49.a: "경제학자, 코제키 우이."

 TRM_event.53.t: "트리니티의 덴마크 요구!"
 TRM_event.53.desc: "트리니티가 드디어 맛이 갔군. - [ROOT.GetLeader]"
 TRM_event.53.a: "당연히 거부해야지"

 TRM_event.54.t: "주데텐란트 양도를 거부한 [From.GetNameDefCap]"
 TRM_event.54.desc: "[From.GetAdjective]의 지도자인 [From.GetLeader](이)가 [Root.GetAdjective]의 요구를 전부 거절한 것은 바보 같은 외교 활동이었습니다!\n\n그들은 주데텐란트를 양도하지 않을 것이고 [Root.GetAdjective]의 형제와 자매들을 보호하기 위한 열망을 비웃으며 전쟁을 할 생각까지 있었습니다."
 TRM_event.54.b: "새 예루살렘"

 TRM_event.55.t: "$germany.124.t$"
 TRM_event.55.desc: "$germany.124.d$"
 TRM_event.55.a: "트리니티와 모든 학생들을 위하여!"

 TRM_event.56.t: "맛있는 케이크!"
 TRM_event.56.desc: "방과후 디저트부에서 맛있는 케이크를 찾았어!"
 TRM_event.56.a: "맛있다!"

 TRM_event.57.t: "차가운 아이스크림!"
 TRM_event.57.desc: "방과후 디저트부에서 차가운 아이스크림을 만들었어!"
 TRM_event.57.a: "차가워!"

 TRM_event.58.t: "아리우스 분쇄"
 TRM_event.58.desc: "우리의 맹공격 아래 아리우스 분교는 분쇄되어 우리의 깃발만이 휘날리는 곳이 되었습니다. 하지만 그들의 정예병들인 아리우스 스쿼드는 아직 체포 되었다는 소식이 없습니다. 그렇기에 우리에게는 오직 하나의 선택지가 존재합니다. 그들을 위험 조직으로 선언하고 그들을 분쇄해야합니다."
 TRM_event.58.a: "그 말이 옳다."
 TRM_arius_problem_idea: "아리우스 스쿼드에 대한 공포"
 TRM_arius_problem_idea_desc: "트리니티의 학생들은 아리우스 스쿼드가 단순한 집단이 아닌, 조직적인 테러 조직임을 깨닫게 되었습니다. 그들은 이제 자신들의 안전이 심각하게 위협받고 있다고 느끼고 있으며, 이로 인해 정부에 대한 신뢰 또한 크게 흔들리고 있습니다. 불안감은 점점 커지고, 보호받지 못하고 있다는 생각이 깊어지면서 학생들 사이에서는 정부를 향한 불신이 서서히 퍼져나가고 있습니다."

 TRM_event.59.t: "습격"
 TRM_event.59.desc: "\"정말 여기에 있는 게 맞아?\"\n\n\"예, 그렇습니다. 확인한 정보에 의하면...\"\n\n검은 옷과 복면. 그리고 권총이라 부르기엔 조금 커다란 총을 든 두 남자가 궁전과 같은 집 앞에서 대화를 나누고 있었다. 그들은 유리조노 세이아를 습격을 하기 위해 이 늦은 밤중에 찾아온 것이다.\n\n\"후우... 이 문만 연다면, 그 여자가 있다는 거지?\"\n\n\"예... 그렇습니다. 근데 정말 이 총으로 가능하겠습니까? 아, 전에 봤지 않았습니까? 머리에 헤일로가 달린 년들 전부 총으로 쏴도 딱총 맞은 거처럼 아파만 하던거요.\"\n\n\"에이씨. 나도 몰라. 분명 중개인이 죽는다고 말 했으니 죽기야 하겠지.\"\n\n\"아니, 그래도 너무 위험하지 않습니까..? 생판 처음 보는 중개던데, 그놈이 우리를 죽이려고 보낸걸 수도 있지 않습니까?\"\n\n\"뭐라는 거야. 잔말 말고 빨리 문이나 따.\"\n\n철컥. 철커덕.\n\n남자는 제법 좋은 솜씨로 문의 잠금장치를 빠르게 해제 하였고 조용히 침입하여 온 방을 뒤졌다. 수색을 시작한 지 몇분 지나지 않아 그 둘은 누군가 침대에 곤히 잠들어 있는 걸 보았다. 한 남자는 다른 남자에게 조용히 따라오라는 손짓을 했고, 그들은 직감적으로 그 여자를 찾아내었다는 걸 알 수 있었다.\n\n둘은 그녀에게 무차별적으로 방아쇠를 당기기 시작하였고 한 탄창을 비우자 남자들은 재빨리 도망가기 시작했다.\n\n총 소리가 너무 컸던 탓일까. 잠시 후, 구호기사단이 그곳에 도착하였다. "
 TRM_event.59.a: "..."

 TRM_event.60.t: "현장 조사"
 TRM_event.60.desc: "조사 과정은 순조롭게 진행되었다. 그들이 권총을 버리고 도주하였다는 점. 그들이 강행침입을 하는 과정에서 사용된 물건 또한 현장에 있었다. 시신은 구호기사단이 수습하였다고 보고서를 제출하였지만, 의문인 점이 한 둘이 아니였다.\n\n키리후지 나기사는 생각했다 '과연 범인은 누구일까?' 트리니티에 반대하는 사람들의 테러? 혹은 기회 삼아 티파티 임원을 습격한 학생..? 아니면... 미카..?\n\n\"쾅\"\n\n책상을 세게 쳐도 한 여인의 미소가 키리후지 나기사의 머리속에서 사라지지 않았다."
 TRM_event.60.a: "..."

 TRM_event.61.t: "동선 파악"
 TRM_event.61.desc: "구호기사단이 상황를 수습하고 수사기관이 들어서 현장을 조사하여 그들의 동선을 얼추 파악하기 시작하였다. 그리고 수사관중 하나가 가설을 하나 제시한다.\n\n\"제가 보기엔, 아마 이 벽을 넘었을 확률이 높습니다.\"\n\n\"어째서인가요?\"\n\n\"여길 보시면 약간의 흔적이 존재합니다. 하지만 이 흔적은 자연적으로 생겼다기 보다는 아마 범인들이 다급하게 이 벽을 오를려다가 이러한 자국을 남긴 것으로 추측됩니다.\"\n\n\"그렇다면 이 주변을 수색하면 된다는 건가요?\"\n\n\"아마도 그렇지요... 저도 잘 확신이 서지 않습니다. 생각보다 전문적인 녀석들이에요.\"\n\n\"잘 알겠습니다. 제가 잘 말해보지요.\""
 TRM_event.61.a: "\"그리고 조심하십시오. 시국이 시국인지라.\""

 TRM_event.62.t: "범인 체포"
 TRM_event.62.desc: "어느 한적한 장소에 끌려간 두 남자는 비굴하게 정의실현부의 부원들을 쳐다보며 빌었다.\n\n\"그...저희가 일부러 그런 건 아닙니다. 저희가 어릴 적 부모님을 잃고...궁핍하게 살아와서..!\"\n\n하스미는 이 두 남자를 쳐다보며 한숨을 쉬었다.\n\n하스미는 그런 생각을 멈추고 두 남자에게 질문을 하기 시작했다.\n\n\"누가 시켰나요? 말해주면 좋겠네요.\"\n하스미는 살짝 웃으며 그들을 쳐다보았다.\n\n이후 조금의 시간이 지난 후 남자 두 명의 모습은 처참했다. 거꾸로 매달려 있는 상태로 속옷을 제외한체 걸친 옷은 전부 찢어졌고 온 몸에는 멍이 들어 있었다.\n\n\"사...살려!..켁..살려!..켁!\"\n숨이 넘어가는 걸 보고 하스미는 명령을 내렸다. 정의실현부 부원들은 밧줄을 풀기 시작하였고 하스미의 명령으로 두 남자는 밧줄에서 풀려날 수 있었다. 이후, 그들은 자신이 들은 것들 전부 말하기 시작하였다.\n\n\"..그런가요.\"\n\n얘기가 끝나고 하스미는 잠시 고민했다. 이런 한심한 인간들이 티파티의 일원인 세이아를 살해한 게 맞을까? 자신들이 엉뚱한 범죄자 하나를 잘못 골라잡은 건 아닐까? 고민을 계속하던 도중, 한 남자가 입을 열었다.\n\n\"저..저희는 마..말 다했어요.. 사.. 살려만 주세요!\"\n\n어째서일까, 하스미는 그 말을 들은 순간 자비심이 사라졌다. 그러고서는 책상을 박차고 일어서 총기가 있는 곳으로 향했다. 눈치 빠른 한 남자가 그것을 보고 싹싹 빌기 시작하였지만, 하스미가 총기로 향하는 것은 막을 수 없었다.\n\n\"정보는 감사했습니다...만. 눈치가 없는건 딱 질색이라서요.\"\n\n탕!- "
 TRM_event.62.a: "\"츠루기. 범인 찾았습니다.\""

 TRM_event.63.t: "주동자 체포"
 TRM_event.63.desc: "범인이 말한 장소로 가자 한 남자가 뒷골목에서 담배를 피우고 있었다. 하스미는 직접 그 남자에게 찾아가 말을 꺼내기 시작하였다.\n\n\"그쪽인가요?\"\n대담하게 하스미는 첫 말을 꺼냈다.\n\n\"뭐야 당신. 뭐 하러 온거야?\"\n처음 보는 여자, 그리고 거대한 체구 때문에 남자는 약간 움츠러 들었지만 이내 평정심을 되찾기 위해 노력했다\n\n\"단도직입적으로 묻죠. 이 남자들 알고 있죠?\"\n\n\"쳇 알게 뭐야.\"\n\n"
 TRM_event.63.a: "입을 열게 하는건 간단하다."

 TRM_event.65.t: "막다른 길"
 TRM_event.65.desc: "어둡고 칙칙한 골목의 끝에서 누군가의 고통에 찬 신음 소리가 울려 퍼졌다.\n공포와 분노로부터 도망치기 위해 발버둥 친 사내는 결국 막다른 길에 몰렸고, 검은 날개를 가진 천사의 형태를 한 정의는 그의 앞으로 천천히 다가왔다.\n\n\"젠장...! 도대체 원하는 게 뭐야! 줄 수 있는 건 다 줄 테니까 제발 날 좀 내버려 둬!\"\n\n감히 상투스 분파를 이끄는 자의 습격을 책략 한 중개인은 그녀의 구둣발에 걷어 차여 바닥에 구른 채로 악에 받힌 비명을 부르짖었다.\n하지만 그녀는 그의 절박한 절규에도 그저 그 자리에 서서 사내를 냉소적으로 비웃을 뿐이었다.\n\n\"제가 당신에게 원하는 건 없어요, 하지만 당신을 원하시는 분들이 계시죠.\"\n\n\"도대체 왜 이렇게까지 하는 거지? 너희들의 목적은 대체 뭐야!!\"\n\n사내는 그녀와 정의실현부가 어째서 이렇게나 끈질기게 집착해 오는 건지 알 수 없었다\n수년간 이러한 일을 해왔지만 그 어떤 치안기관도 이렇게까지 끈질기게 추적해오진 않았다.\n\n그가 한 번도 겪어보지 못한 상황 속에서 혼란에 빠졌음에도 불구하고 하스미는 한쪽 구두의 굽으로 남자의 가슴팍을 즈려밟았다.\n고통에 찬 발버둥과 비명이 더욱 크게 펴졌지만 일말의 조금도 동요하지 않은 채, 하스미는 곧 지옥불에 불타버릴 이 불쌍한 사내의 마지막 질문에 대답해 주었다.\n\n\"저희들의 목적 말인가요? 당신이 그걸 안다고 해서 할 수 있는 게 있을까요? 티파티에 대한 불순한 의도를 그 얄팍한 가슴 속에 품었을 때 부터 당신의 최후는 정해졌어요.\"\n\n그리고 개머리판으로 그의 두부를 겨누었고...\n\n\"정의실현부의 원칙은 심플하답니다. 트리니티, 그리고 티파티를 위하여\"\n\n사내는 그 뒤의 말을 들을 수 없었다."
 TRM_event.65.a: "\"눈앞의 불의를 용서하지 않는 거죠.\""

 TRM_event.64.t: "사냥개들"
 TRM_event.64.desc: "한때 중개인이라는 직책으로 불리던 사내의 형태를 알아볼 수 없는 신체 옆에서, 4인의 검은 여학생들이 지도를 펼쳤다.\n강도 높은 고문의 끝에서 그녀들은 중개인의 입을 통해 이번 사건에 관련된 다른 몇 명을 찾아낼 수 있었다.\n은밀하고 신속하게 그들의 신병을 구속한 정의실현부는 모든 화살표가 한 인물을 가리키는 것을 알 수 있었다.\n\n\"라인하르트 하이드리히, 나치 친위대 소속 중장이며 친위대 국가보안본부 제6국, 해외보안국의 초대 국장임다. 트리니티가 현재 위치에 나타나게 된 이후로 가족들과 떨어져 행방불명 상태였슴다.\"\n\"범죄 정권의 충실한 개새끼였군요\"\n\n이치카의 설명을 들으며 하네카와 하스미는 무표정으로 지도를 천천히 만져내렸다.\n지도를 매만지던 손길은 곧 슈바르츠발트의 어떤 깊은 곳을 가리키며 멈췄다.\n\n\"그리고 이 자가 유리조노 세이아 습격사건의 유력한 배후입니다.\"\n\"그러니 반드시 붙잡아서 그 값을 치르게 해야겠죠, 감히 티파티를 공격한 죄는 결코 가볍지 않으니까요\"\n\n그 말을 끝으로 하스미는 자신의 눈앞에 있는 세명을 바라보았다.\n정의실현부의 가장 일선울 감독하는 이치카와 정의를 위해서라면 무엇이든 할 수 있는 행동파 저격수 마시로.\n그리고 정의실현부의 부장이자 명실상부한 트리니티의 전략 병기인 켄자키 츠루기\n이번 작전에서의 인선은 고민할 필요조차 없었다.\n\n\"부원들을 대규모로 움직였다간 상대에게 발각될 염려가 있습니다. 그러니 언제나처럼의 두 명으로 진행하는 게 제일 좋겠죠.\"\n\"알겠슴다.\"\n\"준비해두겠습니다.\"\n\"죽이진 마세요, 죗값은 산 채로 최대한... 천천히 고통스럽게 치르도록 해야 하니까요, 숨만 붙어있어도 상관없으니 명심해 주세요\"\n\"키히히힛.... 케헤헤헤헷!!!!!!\"\n\n이윽고 어두운 방 안을 섬뜩한 광소가 가득 채웠다.\n그리고 그 웃음 속에서 다른 3인 또한 기대에 가득 찬 미소를 지었다.\n4인의 여학생은 기대하고 있었다."
 TRM_event.64.a: "그 남자가 과연 어떻게 비명 지를지를"
 
 TRM_event.66.t: "신들의 황혼"
 TRM_event.66.desc: "검은 숲이 붉게 타올랐다.\n도주를 위해 준비했던 자동차는 단 한발의 총알로 인해 폭발하며 산산조각이 나버렸다.\n이윽고 검붉은 무언가의 돌격 한번으로 몇 안 되는 경호원들과 함께 나무로 지어진 건물의 전면 외벽까지 산산조각이 나버렸다.\n\n한때 대독일을 병들게 하던 쓰레기 같은 오물들을 처리하고 아버지 조국을 정화할 꿈을 가지고 있던 남자는, 눈앞에 상황을 이해할 수 없었다.\n자신의 앞에 있는 것은 검붉은 공포, 살아있는 재난, 타천사의 모습을 한 죽음 등, 어떠한 것으로 불러도 손색이 없는 것이었다.\n갑작스레 벽의 잔해와 인간의 피를 뒤집어쓰고 나타난 그것은 주변의 모든 것을 육편과 먼지로 만들어 버리며 자신에게 다가왔다.\n\n그것은 나에게 다가와 손을 뻗었다.\n징벌의 도구로 쓰던 두 자루의 총을 내려두고 그것은 자신의 양 팔을 붙잡더니, 그대로 거리낌 없이 뽑아버렸다.\n비명을 지를 틈도 없이 그것은 그의 몸을 미친 듯이 웃으며 난타하기 시작했다.\n\n멀어져 가는 의식 속에서 그는 보았다.\n그것은 자신을 별장의 밖으로 끌고 나가고 있었다.\n불타는 집 안에서 마치 자신을 구하러 온 천사처럼, 빛 속으로 자신을 데리고 나갔다.\n그리고 그는 들었다.\n귀를 찢고 정신마저 헤집어놓는 듯한 그것의 흥분에 찬 섬뜩한 광소를"
 TRM_event.66.a: "악마가 죽음의 천사에 의해 쓰러졌다"

 TRN_Nomore_Heydrich_tt: "§Y하이드리히§! 사망?"
 TRM_lets_go_kill_Heydrich: "§L유리조노 세이아 습격사건의 주동자에 대한 계획을 실행 할 수 있게 됩니다.§!"

 TRM_event.67.t: "드러난 어둠"
 TRM_event.67.desc: "\"이제 충분합니다.. 들여보내세요\"\n\n무겁게 내려앉은 공기 속에서 티파티의 키리후지 나기사는 문 밖을 향해 명령했다.\n곧바로 무겁게 닫혀있던 문이 열렸고, 힘없이 총구를 내린 두 경비병의 무력한 뒷모습을 뒤로하고 화사한 모습의 그녀가 방 안으로 들어왔다.\n미소노 미카, 티파티의 임원이자 키리후지 나기사와 유리조노 세이아의 친우, 파테르 분파의 수장이며 트리니티의 최고 무력.\n....동시에 나기사와 세이아를 배신하고 모든 권력을 취하려 찾아온 찬탈자.\n\n그 자리에 있던 모두가 느끼고 있는 절망적인 중압감에도 불구하고 미카는 전혀 아무렇지 않게 나기사의 반대편에 사뿐히 앉았다.\n그리고 마치 그 자리에 있는 누구도 자신의 위협이 되지 않는다는 듯 자신의 총을 탁자에 기울여둔 채 어린아이처럼 천진난만한 모습으로 방 안을 둘러봤다.\n적막을 깬 것은 나기사였다.\n그녀는 자신이 마시던 찻잔을 천천히 내려놓고 먼저 입을 열었다.\n\n\"...무엇을 그렇게 쳐다보는 건가요? 이 방에 처음으로 들어오는 것도 아니면서\"\n\"으음- 눈에 확실하게 익혀두어야겠다 싶어서? 앞으로는 나 혼자서만 쓰게 될 방이니까-\"\n\n분명 적의가 확실한 발언에도 불구하고 미카의 목소리엔 그러한 기색을 찾아볼 수 없었다.\n눈을 지그시 감은 나기사는 그 자리에 앉아 탄식에 가까운 말을 내뱉었다.\n\n\"...당신이 이렇게까지 할 줄은 몰랐는데 말이죠.... 마음 깊은 곳에선 당신을 믿었어요 미카... 당신이 저 문을 열지 않길 바랐는데....\"\n\"에헤이~ 마음에도 없는 말은 하지 말아 줄래? 나기짱은 절대 다른 사람을 믿지 않잖아-\"\n\"...어째서인가요? 왜 당신이 이렇게까지 일을 벌인 거죠?\"\n\"그걸 나한테 묻는 거야? 본인이 가장 잘 알고 있으면서-\"\n\n조롱이 가득한 미카의 발언 속에서 나기사는 눈을 게슴츠레 뜬 채 미카를 올려다봤다.\n\n\"나기짱의 그 나약함이 모든 걸 망친거야-, 모두를 실망시키고 내가 이렇게까지 하게 만든 건 오로지 나기짱 탓이라구, 알고 있지?\"\n\n여전히 친구를 바라보듯 미소를 짓고 있던 미카의 얼굴에서 웃음기가 사라진 건 그때였다.\n미카가 박수 한번에 문 밖에서 대기하던 그녀의 사병들이 들어와 나기사를 붙잡았다.\n문밖에는 마지막까지 나기사에게 충성한 두 명의 경비병이 머리에 구멍이 난 채 싸늘한 선혈을 흘리고 있었다.\n그 모습을 눈에 담은 뒤 나기사는 미카에게 마지막 인사를 남겼다.\n\n\"....지옥의 업화가 당신을 기다리고 있어요 미카\""
 TRM_event.67.a: "\"응... 나도 알고 있어 나기사\""

 TRM_event.68.t: "소비에트의 항복"
 TRM_event.68.desc: "오늘 이른 아침 소비에트 연방의 무조건 항복을 선언하는 이 에덴에 도착하였습니다. 미소노 미카와 그의 지도부들은 누군가의 자작극이거나 소련의 교란 작전 중 하나라고 예상하였지만 모든 전선에서 붉은 군대의 군인들이 백기를 들고 투항하는 등 서신은 사실인 것으로 밝혀졌습니다.\n\n 트리니티 군사전문가들의 예측으로는 계속되는 패배의 끝에 소비에트의 장교들이 쿠데타를 일으킨 것으로 추정하고 있습니다."
 TRM_event.68.a: "위대한 승리다!"
 TRM_event.68.b: "아니? 우리는 총체적인 승리에 만족할 것이다!"

 TRM_event.69.t: "일본어 가능하십니까?(日本語は可能ですか？)"
 TRM_event.69.desc: "はい、私は日本語を話します。(네, 저는 일본어 할 줄 압니다.)\n\n그렇다면, 중국어 가능하신가요?(如果是的話，你會說中文嗎？)\n\n是的，中文也可以。(네, 중국어도 가능합니다.)\n\n그렇다면 마지막으로, 러시아어도 가능하세요?(Итак, наконец, вы говорите по-русски?)\n\nДа, это возможно.(네, 가능합니다.)"
 TRM_event.69.a: "よろしくお願いします!"
 TRM_event_69_tt: "§Y점령지에 신성통치령이 세워집니다.§!"
 TRM_event.69.b: "잘부탁합니다!"

 TRM_event.70.t: "무너진 고향"
 TRM_event.70.desc: "대조국전쟁에서 패배한 우리는 서쪽 영토를 전부 잃고 이제는 제 기능 조차 못하는 변방국가로 밀려나게 되었습니다. 극동의 통제권은 상실한지 오래고 중앙시베리아와 중앙아시아는 겨우 유지하고 있습니다. 위대한 혁명가들의 이상이 무너졌습니다."
 TRM_event.70.a: "..."
 TRM_event_70_tt: "§g강철이 부셔졌지만 조각들은 남아있습니다.§!"

 TRM_event.71.t: "상투스 분파의 와해"
 TRM_event.71_2.t: "사라진 파벌"
 TRM_event.71.desc: "분파의 수장인 유리조노 세이아가 습격당한 이후 서로 반목하던 상투스 분파는 결국 혼란을 수습하지 못하고 와해되었습니다. 이제 상투스 분파는 더이상 티파티에 영향력을 행사할 수 없습니다."
 TRM_event.71_2.desc: "트리니티의 붕괴가 가속화 되면서 파벌들은 와해되거나 어디론가 사라지고 말았습니다."
 TRM_event.71.a: "..."

 TRM_event.72.t: "호스트 선출"
 TRM_event.72.desc: "트리니티는 대전이 사태와 비상회의를 거치며 새로운 국면에 접어들었습니다. 혼란스러운 시간을 지나 수많은 진전이 이루어졌고, 이제 비상회의는 역사 속으로 사라졌습니다. 그 자리를 대신해 상투스 분파의 수장, 유리조노 세이아가 티파티의 호스트로 취임하며 새로운 질서를 세워가고 있습니다.\n\n트리니티 전역은 안도와 환희로 가득 차 있습니다. 광장 곳곳에서 사람들은 음료를 들며 축제를 벌이고, 소란 속에서도 평화와 희망의 기운이 피어오릅니다. 그러나 이 축제의 이면에는 여전히 어두운 그림자가 드리워져 있습니다. 공산당과 나치 친위대들이 권력을 잡기 위해 은밀히 모략을 꾸미고 있지만, 이들의 영향력은 곧 역사의 뒤안길로 사라질 운명입니다.\n\n하늘에서 내려다본 에덴은 마치 신기루처럼 반짝이는 것처럼 보입니다. 펄럭이는 깃발의 수가 너무 많기 때문입니다. 트리니티의 황색 깃발이 각 분파의 깃발 옆에 나부끼고 있습니다 트리니티의 중앙 광장에서 수천명의 소란이 가라앉고, 유리조노 세이아가 단상 위에 올라서자마자 그 자리에 앉았습니다. 유리조노 세이아는 팔꿈치에 모자를 얹고 트리니티의 이상향를 늘어뜨리는데 시간을 낭비하지 않았습니다. 연설의 막바지가 들어서자 유리조노 세이아는 나약했던 구 체제의 종말을 선언하고, 새로운 트리니티가가 구 체제가 실패한 곳에서 성공할 것이라고 선언합니다. 모인 티파티 임원들은 함성을 외치며 환호했고, 잠시 후 군중들도 그 뒤를 따랐습니다. 한 단어가 트리니티 광장, 에덴, 학원 전역에 울려 퍼졌습니다. 바로 세이아였습니다."
 TRM_event.72.a: "모교 만세!"

 TRM_event.73.t: "핵분열"
 TRM_event.73.desc: "트리니티의 영토에 존재하던 독일이라는 나라는 과학적으로 크게 진보한 나라였습니다. 오토 한, 프리츠 슈트라스만, 리제 마이트너를 주축으로 한 물리학 실험중 발견한 핵분열이라는 현상은 과학계에 큰 충격을 가져옴 과 동시에 물리학적으로 큰 공을 세웠습니다. 하지만 다른 과학자들과 트리니티의 핵물리학자 역시 원자력의 잠재력을 파헤쳐 왔으며, 그들 모두 핵을 무기화할 수 있다는 똑같은 결론에 도달했습니다."
 TRM_event.73.a: "트리니티는 이 것을 이용할 것이다."
 OTTOHAN_tt: "§Y핵개발§!을 위한 §Y중점 계통도§!가 나타날 것입니다."
 TRM_event.73.b: "코웃음이 나오는 군"

 TRM_event.74.t: "차기 학생회장"
 TRM_event.74.desc: "트리니티의 모든 혼란이 멈춘 지금, 우리는 트리니티의 혼란한 균형을 바로잡고 트리니티를 이끌어 나아갈 차기 학생회장을 임명해야만 합니다.\n\n나기사의 권력이 복권된 지금, 나기사에게 학생회장직을 되돌려 주거나, 아니면 트리니티 사상 최초로 열렬한 학생들의 지지에 힘입어 선거제도를 도입할 수 있습니다."
 TRM_event.74.a: "티파티는 더이상 학생회가 아니다."
 TRM_event.74.b: "나기사가 아니라면 누가 트리니티를 이끌 것인가"

 TRM_event.75.t: "첫 선거"
 TRM_event.75.desc: "트리니티에서 첫 선거가 열렸습니다. 후보로는 기존 학생회장이자 필리우스 분파의 수장인 키리후지 나기사와 이번 파테르 축출에서 큰 공헌을 한 아지타니 히후미가 후보로 나왔습니다. 트리니티의 차기 학생회장은 누가 될지 치열한 접전이 예상됩니다."
 TRM_event.75.a: "나기사는 트리니티를 이끌 지도력이 있다."
 TRM_event.75.b: "히후미는 자신의 능력을 증명했다."

 TRM_event.76.t: "트리니티의 사절단 방문"
 TRM_event.76.desc: "트리니티에서 키보토스가 이세계로 전이하면서 벌어진 여러 혼란속에 사실상 무효화된 에덴 조약을 복원하자는 내용을 보내왔습니다."
 TRM_event.76.a: "한번 들어보자고."
 TRM_event.76.b: "저 녀석들을 믿을 수 없다."

 TRM_event.77.t: "[FROM.GetName]의 조약 승인"
 TRM_event.77.desc: "여러 논의 끝에 [FROM.GetName]은 에덴 조약을 지지하기로 했습니다."
 TRM_event.77.a: "평화를 위한 첫 걸음"

 TRM_event.78.t: "[FROM.GetName]의 사절단 추방"
 TRM_event.78.desc: "[FROM.GetName]은 우리의 사절단을 추방시켰으며 에덴 조약에 진지하게 임할 자세로 보이지 않습니다."
 TRM_event.78.a: "결국 전쟁인가?"

 TRM_event.79.t: "트리니티-게헨나 회담의 시작"
 TRM_event.79.desc: "게헨나 학원은 처음에는 트리니티의 대타협 제안에 냉담한 반응을 보였습니다. 그러나 트리니티의 지속적인 노력 끝에 마침내 협상이 시작되었습니다.\n\n대타협의 날, 트리니티와 게헨나의 대표단은 두 나라의 국경에 마련된 협상장에 모였습니다. 대표단은 현재 서로 아무 말도 나누지 않은 채, 차가운 분위기 속에서 협상이 시작되었습니다."
 TRM_event.79.a: "양국의 합의를 기원하지"

 TRM_event.80.t: "안건: 게헨나 우위의 세력 구축"
 TRM_event.80.desc: "트리니티의 주도로 만들어지는 에덴 조약은 게헨나 학원에 악영향을 미칠 수 있습니다. 에덴 조약의 주도권은 우리 게헨나 학원이 쥐어야 합니다."
 TRM_event.80.a: "이 안건을 상정하지"
 TRM_event.80.b: "이건 합의에 도움이 되지 않는다."

 TRM_event.81.t: "안건: 경제 일원화"
 TRM_event.81.desc: "트리니티 종합학원은 게헨나 학원이 혼란에 빠진 틈에 빠른 경제 성장을 이뤄냈습니다. 게헨나 학원과 경제를 통합하는 것은 트리니티의 경제 성장에 큰 이익을 가져올 것입니다."

 TRM_event.82.t: "안건: 공동 군사 작전"
 TRM_event.82.desc: "게헨나 학원은 트리니티 학원보다 강력한 군사작전을 펼칠 능력을 가지고 있습니다. 공동 군사 작전 안건이 성공한다면, 게헨나는 큰 군사적 이점을 가져올 수 있을 것입니다."

 TRM_event.83.t: "안건: 동방에 맞서는 방벽"
 TRM_event.83.desc: "트리니티 종합학원은 게헨나 학원에 비해 위협적인 국가와 국경이 맞닿아 있습니다. 트리니티 종합학원은 폴란드와 소비에트 연방을 견제하기 위해서라도 게헨나 학원으로 부터 지원을 받아내야만 합니다."

 TRM_event.84.t: "안건: 게헨나 재건"
 TRM_event.84.desc: "게헨나 학원은 대전이 이후 수많은 혼란에 휩싸였습니다. 게헨나 학원이 재건되지 못한다면 에덴 조약기구는 의미를 잃고 퇴색될 가능성이 높습니다."

 TRM_event.85.t: "안건: 게헨나 우위의 세력 구축"
 TRM_event.85.desc: "게헨나 학원은 트리니티를 중심으로 짜여지는 에덴 조약기구에 대해 반발감을 나타냈습니다. 만약 우리가 이 안건을 수락한다면 세력의 주도권은 게헨나 학원이 쥐게 될 것입니다."
 TRM_event.85.a: "수락한다."
 TRM_event.85.b: "거절한다."

 TRM_event.86.t: "안건: 경제 일원화"
 TRM_event.86.desc: "트리니티 종합학원은 게헨나 학원이 여러 혼란에 휩싸인 이후 뒤떨어진 산업 기반을 빠른 속도로 게헨나 학원과 비슷한 수준으로 끌어올렸습니다. 만약 우리가 이 안건에 찬성한다면 트리니티 종합학원은 상당한 산업 이점을 가져갈 것입니다."

 TRM_event.87.t: "안건: 공동 군사 작전"
 TRM_event.87.desc: "게헨나 학원은 트리니티 종합학원보다 우월한 군사적 역량을 가지고 있습니다. 만약 우리가 이 안건에 찬성한다면 게헨나 학원은 상당한 군사적 이점을 가져갈 것입니다."

 TRM_event.88.t: "안건: 동방에 맞서는 방벽"
 TRM_event.88.desc: "트리니티 종합학원은 자신들의 국경에 인접한 적성국이 많다는 이유로 우리에게 경제-군사적 양보를 요청했습니다. 만약 우리가 이 안건에 찬성한다면 트리니티 종합학원에게 여러 물자를 지원해 주어야 할 것입니다."

 TRM_event.89.t: "안건: 게헨나 재건"
 TRM_event.89.desc: "게헨나 학원은 자신들의 학원에 벌어진 여러 혼란을 극복하기 위해 우리의 지원이 필요하다고 요청했습니다. 만약 우리가 이 안건에 찬성한다면 게헨나 학원은 여러 경제적 지원을 받을 것입니다."

 TRM_event.90.t: "[FROM.GetName]의 안건 수락"
 TRM_event.90.desc: "[FROM.GetName]은 에덴 조약기구를 위해 우리가 상정한 안건을 수락하였습니다. 에덴 조약이 성공적으로 이루어지고 있습니다."
 TRM_event.90.a: "에덴 조약기구로 한발자국 나아갔군"

 TRM_event.91.t: "거부된 안건"
 TRM_event.91.desc: "[FROM.GetName]은 우리가 상정한 안건을 반대했습니다. 에덴 조약에 차질이 늘어나고 있습니다."
 TRM_event.91.a: "이건 합의에 도움이 되지 않아"

 TRM_event.92.t: "에덴 조약의 실패"
 TRM_event.92.desc: "양국의 기나긴 회담에도 불구하고 대타협은 결국 실패로 돌아갔습니다. 트리니티와 게헨나 사이의 쌓인 골은 매우 깊은 것 같으며 에덴 조약기구는 허상 속으로 사라지고 말았습니다."
 TRM_event.92.a: "좋지 않아"

 TRM_event.93.t: "에덴 조약기구의 결성"
 TRM_event.93.desc: "양 국가의 기나긴 합의 끝에 에덴 조약기구가 공식적으로 출범했습니다. 에덴 조약기구는 게 헨 나와 트리니티의 분쟁을 조절하는 걸 넘어 여러 가지 합의점을 도출해 내는 것에 성공한 것으로 보이며 이는 키보토스 학원들에 긍정적인 영향력을 미칠 것으로 추정됩니다."
 TRM_event.93.a: "아름다운 결실이다."

 TRM_event.94.t: "복종, 또는 죽음"
 TRM_event.94.desc: "트리니티 종합학원이 우리 위치를 알아차린 이상 언젠가는 벌어질 일이었습니다. 트리니티 종합학원에서 아리우스 분교에게 복종하라는 내용의 최후 통첩이 도착했습니다."
 TRM_event.94.a: "아리우스 분교는 절대 굴복하지 않는다."
 TRM_event.94.b: "마지막 발악의 끝."

 TRM_event.95.t: "아리우스 분교의 저항"
 TRM_event.95.desc: "아리우스 분교는 트리니티 종합학원이 제시한 복종을 거절했으며 이에 따라 트리니티 종합학원의 자비를 거절한 아리우스 분교에겐 결국 종말만이 존재할 것입니다."
 TRM_event.95.a: "전투 준비."

 TRM_event.96.t: "아리우스 분교의 복종"
 TRM_event.96.desc: "아리우스 분교는 우리의 최후 통첩 요구를 수락했으며 이에 따라 아리우스 분교는 공식적으로 트리니티 산하로 편입되었습니다."
 TRM_event.96.a: "좋아."

 TRM_event.97.t: "선도부와 회담"
 TRM_event.97.desc: "선도부를 설득하기 위해서 어쩌구 저쩌구 우리는 어쨋든 선도부를 통합하기 위해 외교관을 파견했다."
 TRM_event.97.a: "대화는 잘 풀렸고 선도부는 우리와 함께한다"
 TRM_event.97.b: "거래는 실패했고 선도부는 게헨나에 남았다."

 TRM_event.98.t: "방공 협정"
 TRM_event.98.desc: "트리니티는 정부 전복과 폭력을 수반해서라도 세계에 공산주의를 확산시킨다는 코민테른의 목표에 대응하기 위한 조약을 발의하였습니다. 이 조약을 체결함으로써 우리는 공산주의자의 위협에 관한 정보를 공유하고 그러한 위협에 맞선 긴밀한 협력을 하는 데에 동의하게 됩니다."

 TRM_event.104.t: "모스크바의 총독?"
 TRM_event.104.desc: "모스크바 신성통치령이 출범하고 군정이 종료되며 총독이 누가할지에 대한 관심이 크게 쏠렸습니다. 총 두명으로 의견이 좁혀졌으며 그 둘은 키리후지 나기사와 지크프리트 카세입니다.\n\n지크프리트 카셰는 트리니티의 행정 처리를 빠르게 진행하였고 트리니티의 명령을 잘 따르는 종복입니다. 그는 총독의 일을 수행하는데에 적합하다고 판단 되었습니다.\n\n키리후지 나기사는 미소노 미카의 명령으로 특채된 인물입니다. 그녀의 정치력은 꽤나 뛰어난 편입니다. 대전이 이전부터 트리니티의 강점을 내세우며 타학원과의 외교에서 우위를 점했습니다. 이러한 정치력이 그녀가 모스크바의 총독이 될 이유를 설명하고 있으며 특히 미소노 미카의 특채라는 점이 지크프리트의 발목을 잡습니다.\n\n이 둘중 누가 모스크바의 총독이 되는지에 대해서는 열띤 토론이 진행되고 있습니다. 지크프리트 카셰는 트리니티에 충성하지만 그 충성심이 언제까지 이뤄질지는 아무도 모릅니다. 모스크바의 총독으로 임명 된다면 모스크바 신성통치령을 지크프리트를 위한 '왕국' 으로 변화 시킬수 있습니다.\n\n그러나 키리후지 나기사 또한 의심스럽습니다. 미소노 미카의 쿠데타 과정에서는 키리후지 나기사가 앙심을 가질 동기가 충분합니다. 만약 시베리아에 갇힌 붉은 망령들이 트리니티를 향해 올때 배신을 하고 그들과 결탁할 수 있다는 우려를 사고 있습니다."
 TRM_event.104.a: "키리후지 나기사"
 TRM_event.104.b: "지크프리트 카셰"

 TRM_event.3000.t: "명분 소실"
 TRM_event.3000.d: "키보토스의 모든 것을 관리하던 생텀 타워가 전쟁으로 인하여 작동이 비활성화되었고 생텀 타워를 재가동시키려면 총학생회장의 권한이 필요하다는 것을 알게 되었습니다. 결국 생텀 타워를 재가동시키기 위하여 트리니티의 중요 인물 중 한 명을 총학생회장으로 추대하기로 결심하였고 두 명의 학생이 총학생회장의 후보로 뽑히게 되었습니다.\n\n고민 끝에 한 학생을 머릿속에서 정하였고 천천히 그 이름을 적어나갔습니다."
 TRM_event.3000.a: "...아지타니 히후미"
 TRM_event.3000.b: "...우라와 하나코"
 TRM_event.3000.c: "힘이 곧 명분이다"

 TRN_after_war_event.1.t: "자본의 유입"
 TRN_after_war_event.1.desc: "각료 회의는 그 어느 때보다도 밝은 분위기 속에서 진행되었다.\n참여자들은 샴페인 잔을 기울였고, 그들의 지도자 역시 만족스럽게 그 모습을 둘러보고 있었다.\n책상 위에 있는 문서에는 게헨나의 점유지에 있는 다수의 독일 기업들이 공장을 트리니티로 이전 중이라는 내용이 적혀있었다.\n미카와 트리니티 지도부가 행한 투자 및 동화정책이 빛을 발했던 걸까?.\n그래프는 트리니티 경제의 발전을 여실 없이 보여주고 있었고 이는 분명히 그들의 커다란 승리임이 틀림없었다.\n\n\"당연한 일이지~? 그 게헨나의 쓰레기들에게 이런 일을 막을 만한 지능마저도 없을 테니까 ★\"\n\n누가 보더라도 이는 분명히 순풍이었다."
 TRN_after_war_event.1.a: "Quid pro quo(모든 것에는 대가가 따르기 마련이다)"

 TRN_after_war_event.2.t: "자본의 유출"
 TRN_after_war_event.2.desc: "무겁게 내려앉은 어둠 속에서 경제부의 대표는 떨리는 목소리로 발표를 이어갔다.\n독일의 기업들이 공장을 트리니티로 이전했다.\n그저 공장 몇 개라고 넘어갈 수도 있겠지만 이는 분명히 독일이라는 정체성이 트리니티에게로 넘어가고 있다는 신호탄이었다.\n무엇보다도 중요한 사실은 게헨나의 지도부가 이러한 움직임을 전혀 막아내지 못했다는 것이었다.\n\n\"일단... 남아있는 기업들의 자본 유출을 막을 방안을 빠르게 마련하도록 하죠.\"\n경직된 분위기의 회의실 속에서 한 인물이 말했다.\n사단이 이미 일어나 버렸음에도 그들은 포기할 수 없었다.\n절망에 빠져 모든 것을 내려놓기엔 이미 너무 멀리 와버렸기에."
 TRN_after_war_event.2.a: "소는 잃었어도 마구간은 고쳐야지."

 TRN_after_war_event.16.t: "산업 호황"
 TRN_after_war_event.16.desc: "이제 모든 재건이 끝났다. 요하네스의 임무도 끝났다, 트리니티 재건 공사의 공식적인 모든 임무가 끝났으므로, 요하네스와 그의 팀도 해체될 것이었다.\n\n많은 일이 있었다. 요하네스와 그의 팀원들은 온 원토를 돌아디며 공사를 해대었고, 많은 일을 겪는 건 당연했다.\n\n요하네스가 처음 의지가 풍만한 채로 버려진 공장지대에 도착했을 때가 생각났다. 그때는 절말 자신감리 하늘을 찔렀지.\n버려진 군수공장을 민간공장으로 바꾸려고 온갖 노력을 하기도 했었고, 공사가 끝난 이후 집에 간다 생각했더니 갑자기 전기선 연결 임무를 부여받은 적도 있었다. 전력 공사를 끝내자 마자 완전히 쌩 반대편에 있는 지뢰천지인 도로공사를 하러 간 적도 있었고, 선전 문구 대회에 나가 상을 타와서 그 문구가 포스터에 적힌 채로 온 원토를 떠돌아다니는 것을 보며 창피함에 얼굴이 빨개진 적도 있었으며, 감히 미카님께 직언을 올린 적도 있었다.\n\n요하네스는 이제와서 추억이 된 일들을 아련히 생각했다. 그는 이제 유니폼과 헬멧이 아닌, 정장을 입고 있었다.\n\n요하네스는 곧이어 기차의 경적 소리를 듣고는, 열린 기차의 문 안으로 걸어들어갔다. 이제 정말 모든 일이 끝났고, 드디어 집에 돌아간다는 기쁨과 함께 수많은 감정들을 안고.\n\n동프로이센에 위치한 거대한 공장지대의 멋들어진 건물에 앉아있는 브리안도 비슷한 생각을 하고 있었다. 독일 제국 시절 부터 농부인 자신에게 벌어진 무자비한 수탈들, 무자비한 세금, 돈이 없어서 잡초를 뜯어먹다가 온 가족이 모여 함께 엉엉 운 적도 있었지...\n\n하지만 지금 브리안은 빼빼 마른 몸이 아닌 꽤 관리된 통통한 몸을 갖고 있었고, 다 해진 농부의 옷이 아닌 멋들여진 고급 정장을 입고 있었다. 그리고 농부로서 밭에 괭이질 하는 것이 아닌, 사장실에서 서류들을 바라보고 있었다. 브리안은 문득 창문을 바라보았다. 그리고 끝없이 연기내며 움직이고 있는 자신의 공장을 지켜보고 미소지었다.\n\n광대하고도 광할한 트리니티의 수도, 에덴의 집무실에서도 날개를 가진 분홍머리 소녀가 창밖을 바라보고 있었다. 그녀는 연기가 솟아오르고 활기차게 움직이고 있는 에덴의 광경을 내려다보았다. 그녀의 눈에 웃고 있는 남녀와 그들의 손을 잡고 걸아가는 남자아이가 보였다, 미소노 미카는 그 모습을 보며 옅게 미소지었다. 자신이 비록 꼭두각시이지만, 그리하여도 트리니티를 이렇게 발전시켰구나 하는 자부심을 가졌다.\n\n그녀는 애써 저멀리 유대인 수용소에서 하얀 연기가 펄펄 솟아오르는 광경을 외면하며, 마치 청순한 소녀처럼 아름다운 수도의 광경을 지켜보는 것에 빠졌다."
 TRN_after_war_event.16.a: "영광은 영원히 이어지리"


 #아리우스 스쿼드 문제
 TRN_opposition.1.t: "중앙정보국 보고서: 조마에 사오리"
 TRN_opposition.1.d: "\n서류번호: ABS-001050213\n대상자: 조마에 사오리\n생년월일: 불명\n출신지: 아리우스 분교 자치구로 추정\n경력: 아리우스 스쿼드 리더(현)\n소재: 불명\n\n-서론\n조마에 사오리는 아리우스의 독립적 소수 무력 집단인 아리우스 스쿼드의 리더로 아리우스와 관련된 여러 고위험 현장에서 지속적으로 관찰되어 왔다.\n\n-본론\n중앙정보국 치안과의 판단에 따라 현재 급변한 정세에도 불구하고 조마에 사오리는 트리니티에 중대한 위협을 가할 수 있는 인물로 평가된다.\n반년 전 충돌 현장에서 목격된 이후 그 소재가 불분명한 상황이며 트리니티의 모든 치안기관이 행적을 추적하고 있으나 아직 성과는 부족한...(생략)"
 TRN_opposition.1.a: "내가 사망의 음침한 골짜기로 다닐지라도..."

 TRN_opposition.2.t: "중앙정보국 보고서: 하카리 아츠코"
 TRN_opposition.2.d: "생년월일: 불명\n출신지: 아리우스 분교 자치구로 추정\n경력: 아리우스 분교의 실질적 상속자(구)\n         아리우스 스쿼드 일원(현)\n소재: 불명\n\n-서론\n하카리 아츠코는 아리우스 스쿼드의 일원으로 조사 결과 아리우스 분교의 학생회장인 계율 수호자의 혈통을 가진 실질적 상속 예정자였으나 모종의 이유로 실각하여 그 이후 스쿼드에 소속된 것으로 보인다.\n\n-본론\n현재 그녀의 소재는 불분명하며 트리니티 내부 결속에 확실한 위협이 될 수 있는 인물로 정보국은 판단하고 있다.\n아리우스 분교의 잔재를 통합할 수 있는 확실한 인물이며 그렇기에 당국은...(생략)"

 TRN_opposition.3.t: "중앙정보국 보고서: 이마시노 미사키"
 TRN_opposition.3.d: "서류번호: ABS-001050232\n대상자: 이마시노 미사키\n생년월일: 불명\n출신지: 아리우스 분교 자치구로 추정\n경력: 아리우스 스쿼드 일원(현)\n소재: 불명\n\n-서론\n이마시노 미사키는 아리우스 스쿼드의 일원이다.\n조사 결과, 수집된 여러 증언과 그 외견으로 보았을 때 정신적인 문제를 가지고 있는 것으로 보이며 일부 시각 자료에선 자의에 의한 상흔을 확인할 수 있다.\n\n-본론\n사실상 스쿼드의 행동대장으로서 활동하고 있으며 스쿼드의 일원들 중 유일하게 중화기를 사용하기 때문에 이전의 충돌에서 트리니티 당국에 가장 많은 피해를 입혀왔다.\n아리우스 스쿼드 중에선 가장 마지막으로 소재가 확인되었으며, 2주 전 드레스덴에서 군경의 추격을 받았으나 엘베강을 통해 도주하면서 현재로서는 정확한 위치를...(생략)"

 TRN_opposition.4.t: "중앙정보국 보고서: 츠치나가 히요리"
 TRN_opposition.4.d: "서류번호: ABS-001050242\n대상자: 츠치나가 히요리\n생년월일: 불명\n출신지: 아리우스 분교 자치구로 추정\n경력: 아리우스 스쿼드 일원(현)\n소재: 불명\n\n-서론\n츠치나가 히요리는 아리우스 스쿼드의 일원이다.\n뛰어난 저격 실력을 보유하고 있으며, 동료인 이마시노 미사키와 함께 스쿼드의 가장 중요한 전술적 자산으로 평가받는다.\n다만 증언에 의하면 사회성에 지대한 문제가 있으며 대인관계 또한 좋지 못한 것으로 보인다.\n\n-본론\n현재 추적 중인 아리우스 스쿼드의 일원들 중 가장 위험한 대상이라고 평가되고 있다.\n마지막 목격 당시 그녀를 추적하던 군사경찰의 기동차량 3대를 각 1발로 무력화 시켰으며 이로 인해 다수의 사상자가...(생략)"

 TRN_opposition.200.t: "진압 종료"
 TRN_opposition.200.d: "우리 정부의 안정에 위협이 되는 핵심 목표들에 대한 수색이 마침내 끝이 났습니다. 보안부은 해당 건에서 물러나 다른 긴급한 문제에 주력하고 있습니다.\n\n그들의 작전이 헛되지 않았기를, 우리 젊은 행정부의 안정성이 보장되기를 바랍니다."
 TRN_opposition.200.a: "할만큼 했다."

 TRN_opposition.100.t: "새로운 교전 수칙"
 TRN_opposition.100.d: "우리 보안부는 여전히 상대방을 수색하느라 열심히 노력하고 있으며, 우리의 지시를 기다리고 있습니다. 필요하다고 판단될 경우, 수색 전술을 변경하도록 명령을 내릴 수 있습니다.\n\n첫번째, 우리는 목표물을 온전하게 사로잡아 감옥에 집어넣을 수 있습니다. 우리가 상시 감시할 수 있는 곳에 그들을 잡아둔다면, 그들은 더 이상 위협이 되지 않을 것입니다.\n\n두번째, 보안부에게 발견하는 반대파를 사살하도록 명령할 수 있습니다. 간단하고 결정적인 해결책입니다.\n\n어떻게 하시겠습니까?"
 TRN_opposition.100.a: "완전히 없애버려라. 그들도 우리에게 똑같이 했을 것이다."
 TRN_opposition.100.b: "아마도 감옥이 그들의 야망을 끝낼 것이다."
 TRN_opposition.100.c: "그들은 우리 국경 내에 필요없다."

 #조마에 사오리
 TRN_opposition.11.t: "탈출" #탈출
 TRN_opposition.11.d: "수많은 불안을 떨쳐버리며 사오리는 강을 건넜다.\n늦은 밤, 마지막 관문인 도나우 강의 천천히 흐르는\n강물 속에서 사오리는 자신에게 다가올 미래를 꿈꿨다.\n\n분명 강 건너 어딘가에서 자신의 소중한 사람들이 자신을 기다리고 있을 것이다.\n더 이상 어둠 속에 숨어 살지 않아도 되고, 폭력과 부조리에 겁먹지 않아도 된다.\n이젠 어두운 사망의 골짜기에서 나와 당당하게 살아갈 수 있게 될 것이다.\n\n이윽고 그녀는 건너편 강가에 도착해 뒤를 돌아봤다.\n평생 그녀를 괴롭혔던 과거가, 아리우스와 트리니티가, 그 모든 분노와 절망들이 이제는 강 건너편에 있었다.\n\n하지만 다시 돌아본 그녀의 눈앞에 있는 것은 평범한 자갈밭이었다.\n누구도 그녀를 기다리고있지 않았고 빛나는 미래 또한 보이지 않았다.\n멀리 보이는 것은 그저 깊게 잠들은 고요한 마을과 평화로운 숲뿐이었다.\n방금 전까지만 해도 희망과 격정에 물들어있던 그녀의 가슴속에 어느 때보다도 강렬한 허무함이 밀려들어왔다.\n\n그녀는 실없이 웃었다.\n그제야 사오리는 자신이 항상 읊조렸던 한 선지자가 남긴 금언의 진정한 뜻을 알아챌 수 있었다.\n세상은 헛되기에 아름답고 소중했다."
 TRN_opposition.11.a: "이에 내가 희락을 칭찬하노니 이는 사람이 먹고 마시고 즐거워하는 것보다 해 아래서 나은 것이 없음이라"
 TRN_opposition.112.t: "부러진 포크"
 TRN_opposition.112.d: "\"....이게 뭔데?\"\n\n전보의 내용을 확인한 미카는 영문을 모르겠다는 듯 미소 지으며 비서를 바라봤다.\n\n\"지금 그 많은 인원에 중장비들까지 동원해놓고... 겨우 한 명을 못 잡았단 거야?\"\n\n그녀가 쥐고 있던 포크가 말 그대로 쪼그라들었다.\n그 모습을 보고 있던 비서는 곧바로 고개를 숙였다.\n\n\"정말 죄송합니다 학생회장님... 책임자들의 명단을 작성할 수 있도록 조치를...\"\n\"...됐어, 어차피 걔 한 명으로는 아무것도 할 수 없을 테니까.. 대신 나머지 세명은 확실하게 잡을 수 있겠지?\"\n\n아무렇지 않다는 표정으로 미카는 턱을 괴었다.\n그 모습을 보고서 그녀의 비서는 다시 한번 고개를 숙인 뒤 빠르게 그곳을 빠져나갔다.\n미카는 손을 펴서 구부러지다 못해 아예 늘어나버린 포크를 보다가 그것을 비서가 나간 문으로 던져버렸다.\n빠르게 날아가 문에 깊숙이 박힌 포크를 보며 그녀는 불만족스러운 표정으로 잠시 동안 그 문을 조용히 바라보았다."
 TRN_opposition.112.a: "...맘에 안 들어"

 TRN_opposition.21.t: "선지자는 말한다" #사살
 TRN_opposition.21.d: "그녀의 모든 행동과 의지는 오직 자신의 가장 소중한 사람들을 지키기 위한 것이었다.\n살의와 증오로 이루어진 현실에 굴복하면서도, 이 셋만큼은 내어주지 않겠다는 결연한 결심이었다.\n\n그랬던 그녀에게도 결국 끝이 찾아왔다.\n오직 그녀들을 지키기 위해선 어쩔 수 없다며 굴복하고 타협해가며 쌓아온 과거의 인과가 이젠 자신을 포함한 스쿼드 모두에게 총구를 겨누고 있었다.\n\n마지막 탄피가 약실에서 빠져나왔을 때, 그녀를 향해 악의와 원한으로 이루어진 수많은 붉은 선들이 마치 그녀를 옳아매듯 겨누어졌다.\n결국 그녀의 모든 저항은 부질없었다.\n다가오는 운명 앞에서, 조마에 사오리는 눈을 감았다."
 TRN_opposition.21.a: "모든 것은 헛되고 또 헛되나니"
 TRN_opposition.212.t: "쓸모없는 최후"
 TRN_opposition.212.d: "미카의 아침은 다른 학생들과 비교해서 언제나 조금 늦는 편이다.\n그녀는 주로 9시에나 일어나 시중들의 도움을 받아서 몸을 치장했다.\n자신의 날개나 옷을 화려하게 꾸미는 걸 좋아했기에 그녀의 수납장엔 언제나 그녀가 직접 고른 장식품들이 준비되어 있었다.\n타인의 도움을 받아 완벽하게 단장을 마친 미카는 11시엔 아침 겸 점심을 먹었다.\n\n하지만 그날 아침의 느긋한 시간은 불청객에 의해 방해받았다.\n적어도 오전 시간엔 자유를 만끽하고 싶어 하던 미카였기에 그녀는 불편한 심기를 살짝 드러내는 미소로 비서를 바라보았다.\n\n\"좋은 아침 비서 씨-☆, 아침부터 웬일이야? 당연히 중요한 보고가 생긴 거겠지?\"\n\"...갑작스럽게 아침 식사를 방해 드려서 죄송합니다 미카님..\"\n\n급한 걸음으로 다가온 비서는 잠시 숨을 돌린 뒤 미카에게 전보를 건넸다.\n\n\n\n그 내용을 천천히 읽어본 미카는 만족스러운 듯 한 쪽 입꼬리를 올려 보였다.\n아리우스에서 가장 위험했던 여자, 조마에 사오리가 죽었다.\n위기의 순간에 보인 마지막 발악이었는지 아리우스 스쿼드의 남은 3인방은 여전히 행방이 묘연했지만 확실한 건 구심점이 사라진 그들이 다시는 트리니티에 이빨을 드러내지 못하리란 것이었다.\n\n\"...그래도 마지막까지 리더 흉내는 멈추지 않았네? 남은 것들은 사진 한 장만 남기고 찢어서 바다에 던져버려~☆\"\n\n그렇게 방을 나서는 비서를 뒤로하고 미카는 포크로 작은 산딸기를 찔렀다.\n오늘 하루는 정말 좋은 하루가 될 수 있을 것 같았다."
 TRN_opposition.212.a: "상쾌한 하루의 시작"

 TRN_opposition.31.t: "긍지" #체포
 TRN_opposition.31.d: "조마에 사오리는 평생에 걸쳐 저항했다.\n하지만 동시에 지키기 위해서 굴복했다.\n그녀는 언제나 모순적이면서도 인간적인 존재였다.\n\n하지만 그녀는 믿었다.\n세상의 모든 것이 헛되기 때문에 언젠가 어른도, 학원도, 분노도, 원한도 전부 먼지로 전락할 것이다.\n\n그렇기에 그녀는 포기하지 않았다.\n스쿼드가 모두 흩어지고, 자신은 어두운 카타콤을 달리고 있었지만 항상 모든 것이 헛됨을 강조했던 것과는 달리 마음속에 희망을 품었다.\n아리우스는 무너졌다.\n지금의 상황이 나에게 주어진 마지막 시련일 것이다.\n이 시련의 끝에 분명 그녀가 원하던 자유가 있을 것이다.\n\n하지만 어둠의 끝은 구원이 아니었다.\n그녀의 모든 나약하면서도 잔인했던 인생을 비추듯이, 수많은 빛이 그녀의 눈을 멀게 했다.\n그녀는 잠시 뒤 자신을 붙잡아 다시 어둠 속으로 끌고 들어가는 수많은 손길들을 느꼈다.\n해방은 영원히 그녀에게서 멀어져 갔다."
 TRN_opposition.31.a: "...그러므로 나는 산 자보다 죽은 자를 복되다 하였으며"
 TRN_opposition.312.t: "비루한 인생"
 TRN_opposition.312.d: "그 내용을 읽던 미카는 배를 잡고선 경망스럽게 웃음을 터트렸다.\n\n\"아하하하! 그 유명한 조마에 사오리가 스스로 죽지도 못하고 붙잡힌 거야? 리더라면서 잘난 척이랑 잘난 척은 다 했으면서?? 진짜 웃겨-\"\n\n그렇게 한동안 실컷 웃은 미카는 그녀를 지켜보고 서있던 비서에게 사오리에 대한 처분을 덧붙였다.\n\n\"일단은 거칠게 대하지 말고 귀빈 다루듯이 잘 대해줘- 그 편이 걔한테는 더 비참할 거니까~\"\n\"네, 전달하겠습니다.\"\n\n공손히 인사를 마치고 비서가 방 밖으로 나가자 미카는 작은 소시지 하나를 입안에 넣었다.\n그리고 그것을 우물우물 씹으면서 수용소에 갇혀있는 사오리의 초라한 모습을 상상했다.\n어린아이처럼 즐겁게 키득거리는 웃음소리가 주변을 채웠다." 
 TRN_opposition.312.a: "어떻게 가지고 놀까나"


 # 이마시노 미사키
 TRN_opposition.12.t: "선한 사마리아인" #탈출
 TRN_opposition.12.d: "미사키는 오수가 가득한 하수구의 바닥에 정신을 잃고 쓰러졌다.\n한 브로커에게 의뢰해서 국경을 넘은 것 까진 좋았다.\n하지만 국경을 넘어서자마자 그는 그녀를 팔아넘겼다.\n결국 미사키는 총탄을 피해서 죽을힘을 다해 미로 같은 골목길을 달려나가야 했다.\n\n모든 여비를 브로커에게 넘긴 탓에 며칠간 식음도 제대로 취하지 못하여 쇠약해져버린 미사키는 쓰러진 채 조금도 움직이지 못했다.\n그제야 자신이 그토록 소망해왔던 해방이 찾아왔다고 생각한 미사키는 저항 없이 눈을 감았다.\n\n하지만 미사키는 그녀가 바랬던 영면에 들지 못했다.\n며칠 만에 눈을 뜬 미사키의 앞에는 한무리의 고아들이 있었다.\n그들은 미사키를 발견해서 씻기고, 치료하고, 정신이 없던 그녀에게 자신들에게도 부족한 식량을 조금씩 나누어주고 있었다.\n그녀는 처음 느끼는 이상한 감정으로 인해 제대로 인사조차 하지도 못한 채 그곳을 급히 빠져나왔다.\n\n이윽고 도시를 빠져나와 들판에 난 길을 걸어가던 미사키는 자신이 느끼고 있는 혼란들을 잠시 접어두었다.\n그리고 모두와 합류하기 위해 발걸음을 재촉하던 그녀는 자신이 믿어온 오랜 금언에 작은 의문을 더했다.\n'세상의 모든 것은 헛되다, 하지만 살아갈 가치가 있을지도 모른다.'"
 TRN_opposition.12.a: "사람이 자기 일에 즐거워하는 것보다 나은 것이 없나니 이는 그의 분복이라"
 TRN_opposition.122.t: "연좌제"
 TRN_opposition.122.d: "오늘도 미카의 집무실에는 수많은 서류들이 도착해있었다.\n작게 하품을 하며 그녀는 편하게 앉아 서류들을 빠르게 훑어봤다.\n대부분은 그녀에게 큰 관심이 없는 것들이었다.\n유대인이나 소수민족들을 '청소'하는 것은 그녀를 이 자리에 올려둔 저 광신도들의 관심사였다.\n얼마 전 완전히 붕괴한 아리우스 자치구에서의 소각작업이나 게헨나에 대한 침공 준비 현황 등 그녀의 이목을 끌 만한 것들도 있었지만 그 역시 자신은 그저 도장만 찍어도 무방한 것들이었다.\n그렇게 학교 숙제로 인해 지루함에 빠진 일반 학생들처럼 시큰둥하게 서류들을 훑어보던 그녀 앞에 한 파일이 올려졌다.\n\n\"...으응? 이건 뭐야??\"\n\"아리우스 스쿼드의 일원 중 한 명이던 이마시노 미사키 추적 결과에 관한 내용입니다.\"\n\"흐응...\"\n\n그 이야기를 듣고 호기심이 생긴 미카는 약간의 기대를 품고 파일을 펼쳐보았다.\n\n\n\n그리고 파일을 읽던 미카는 잠시 뒤 싸늘한 얼굴로 읽고 있던 파일을 비서의 앞에 집어던졌다.\n\n\"....리더도 아니고.. 그냥 별 볼일 없는 년 하나를 못 잡은 데다, 사망자만 수십 명??\"\n\n그녀가 뿜어내는 위압감에 비서는 아무 말도 하지 못하고 그 자리에서 가만히 서있었다.\n섬뜩한 느낌이 등골을 타고 식은땀과 함께 흘러내렸다.\n\n\"거기에 검문소까지 뚫렸어...? 하... 이년이 통과한 검문소 책임자들, 가족까지 포함해서 전부 다 잡아들여\"\n\n혼자서 실소하다가 미쳐버린 듯한 눈으로 처다보는 미카의 시선에 비서는 그 자리에서 바로 허리를 숙여 보인 뒤 도망쳐나갔다.\n그저 자신에게까지 그 분노가 닿지 않은 것에 감사하면서."
 TRN_opposition.122.a: "자식들은 그 아버지로 말미암아 죽임을 당하리니"

 TRN_opposition.22.t: "외로운 추락" #사살
 TRN_opposition.22.d: "세상의 모든 것들이 헛되었다는 가르침에 미사키는 누구보다도 공감했다.\n그렇기에 그녀는 허무하고 헛된 세상에서 평생을 고통받기보다는 모든 것을 내려놓고 편해지기를 언제나 원해왔다.\n\n하지만 그녀가 세상에게서 도망치려 할 때마다 그녀를 붙잡고 놓아주지 않는 사람들이 있었다.\n그녀들이 있었기에, 미사키는 내려놓는 것을 잠시 유보해야 했다.\n\n그러나 그 모든 노력에도 불구하고, 세상은 우리들을 내버려 두지 않았다.\n마지막 미사일을 하늘로 쏘아보낸 뒤, 그녀는 발사기를 내팽개치고 절벽 끝으로 올랐다.\n그녀를 추격해오던 수많은 사냥개들이 그녀를 향해 소리치고 있었다.\n\n그녀는 홀로 서서 외로움을 느꼈다.\n지금 그녀는 혼자였다.\n그녀를 붙잡아주던 소중한 이들은 지금 그녀 곁에 없었다.\n그렇기에 미사키는 망설임 없이 뒤로 천천히 쓰러지듯 몸을 내던졌다.\n자신을 향해 몰아치는 돌풍 속에서 미사키는 그제야 진정으로 편안함을 느꼈다."
 TRN_opposition.22.a: "홀로 있어 넘어지고 붙들어 일으킬 자가 없는 자에게는 화가 있으리라"
 TRN_opposition.222.t: "부수적 피해"
 TRN_opposition.222.d: "오늘도 미카의 집무실에는 수많은 서류들이 도착해있었다.\n작게 하품을 하며 그녀는 편하게 앉아 서류들을 빠르게 훑어봤다.\n대부분은 그녀에게 큰 관심이 없는 것들이었다.\n유대인이나 소수민족들을 '청소'하는 것은 그녀를 이 자리에 올려둔 저 광신도들의 관심사였다.\n얼마 전 완전히 붕괴한 아리우스 자치구에서의 소각작업이나 게헨나에 대한 침공 준비 현황 등 그녀의 이목을 끌 만한 것들도 있었지만 그 역시 자신은 그저 도장만 찍어도 무방한 것들이었다.\n그렇게 학교 숙제로 인해 지루함에 빠진 일반 학생들처럼 시큰둥하게 서류들을 훑어보던 그녀 앞에 한 파일이 올려졌다.\n\n\"...으응? 이건 뭐야??\"\n\"아리우스 스쿼드의 일원 중 한 명이던 이마시노 미사키 추적 결과에 관한 내용입니다.\"\n\"흐응...\"\n\n그 이야기를 듣고 호기심이 생긴 미카는 약간의 기대를 품고 파일을 펼쳐보았다.\n\n\n\n\"...죽어버렸네? 그것도 스스로?\"\n\"드릴 말씀이 없습니다. 죄송합니다.\"\n\"거기에 우리 애들은 왜 이렇게 많이 죽었는데?, 아니 뭐 비서짱이 사과할 필요는 없는데말야-\"\n\n탁자를 검지로 톡톡 두드리던 미카는 이윽고 묵직한 툭 소리와 함께 입을 열었다.\n\n\"책임져야 할 애들은 한 명도 놓치지 말고... 잘 알지?\"\n\n미카는 비서를 향해 방긋 웃어 보였다.\n그녀의 웃음으로 수많은 사람의 마지막이 정해졌다는 걸 비서는 누구보다도 잘 알고 있었다."
 TRN_opposition.222.a: "칭찬이라도 해줄 거라고 생각했어?"

 TRN_opposition.32.t: "헛된 후회" #체포
 TRN_opposition.32.d: "마지막으로 날아간 미사일이 섬광을 일으키며 하늘을 향해 날아올랐다.\n이윽고 폭발과 함께 분리된 자탄이 그녀를 쫓아오던 추격자들의 사이로 쏟아졌다.\n무미건조하게 찢겨 죽은 그들의 말로를 잠시 지켜보던 이마시노 미사키는 발사기를 내려놓고 숲을 향해 도망쳤다.\n\n잡목 사이를 헤쳐나가며 미사키는 자신에게 주어진 상황을 복기했다.\n스쿼드의 모두는 현재 각지에 흩어져서 남쪽 국경으로 향하고 있었다.\n그녀는 어떻게든 국경을 넘고 모두와 합류해야 했다.\n\n하지만 그녀는 회의감을 느꼈다.\n모두가 육로로 무사히 트리니티를 빠져나갈 수 있는 확률은 너무나 적었다.\n만약 붙잡히기라도 하는 날엔 그녀는 마음대로 숨을 쉴 권리조차 박탈당하게 될 것이다.\n차라리 그럴 바에는 이 헛되고 공허한 세상을 스스로 끝내는 게 낫지 않을까?\n\n그러나 이미 때는 늦어버린 후였다.\n그녀가 눈치챘을 땐 이미 매복해있던 추격자들이 수목 사이에서 나타나 그녀를 둘러싸고 있었다.\n마지막 발악으로 그녀는 권총을 꺼내 자신의 머리에 겨누려고 했다.\n세상은 그것을 비웃듯이 탄을 불발시켜버렸다.\n\n모든 것이 헛되다.\n이 세상도, 저항도, 행복도, 슬픔도 전부 다 헛되다.\n그리고 스스로의 나약함으로 결국 결단하지 못한 자신마저도 헛되고 우매하다.\n결국 미사키는 그녀가 그렇게나 증오하고 두려워했던 세상의 어둠 속으로 끌려들어 갔다."
 TRN_opposition.32.a: "일평생에 근심하며 수고하는 것이 슬픔뿐이라 그 마음이 밤에도 쉬지 못하나니 이것도 헛되도다"
 TRN_opposition.322.t: "자의에 의한 타살"
 TRN_opposition.322.d: "오늘도 미카의 집무실에는 수많은 서류들이 도착해있었다.\n작게 하품을 하며 그녀는 편하게 앉아 서류들을 빠르게 훑어봤다.\n대부분은 그녀에게 큰 관심이 없는 것들이었다.\n유대인이나 소수민족들을 '청소'하는 것은 그녀를 이 자리에 올려둔 저 광신도들의 관심사였다.\n얼마 전 완전히 붕괴한 아리우스 자치구에서의 소각작업이나 게헨나에 대한 침공 준비 현황 등 그녀의 이목을 끌 만한 것들도 있었지만 그 역시 자신은 그저 도장만 찍어도 무방한 것들이었다.\n그렇게 학교 숙제로 인해 지루함에 빠진 일반 학생들처럼 시큰둥하게 서류들을 훑어보던 그녀 앞에 한 파일이 올려졌다.\n\n\"...으응? 이건 뭐야??\"\n\"아리우스 스쿼드의 일원 중 한 명이던 이마시노 미사키 추적 결과에 관한 내용입니다.\"\n\"흐응...\"\n\n그 이야기를 듣고 호기심이 생긴 미카는 약간의 기대를 품고 파일을 펼쳐보았다.\n\n\n\n\"웃겨- 어차피 붙잡힐 거면서 뭘 이렇게 화려하게 벌여놓은 거야? 많이도 잡았네-\"\n\"죄송합니다 미카님...\"\n\n살짝 기분이 나빠 보이면서도 비웃듯이 웃으며 파일을 살펴보던 미카는 그 안에 첨부된 미사키의 모습을 빤히 바라보았다.\n그녀의 팔과 목에는 수많은 흉터가 나있었다.\n무언가 재밌는 게 생각난 듯 입꼬리를 올려 보인 미카는 비서에게 지시했다.\n\n\"일반 수용소 말고, 발트해 연안에 있는 취향이 독특한 수용소 알지? 걔들한테 보내-\"\n\"...알겠습니다.\"\n\n사진으로만 봤음에도 미카는 그 흔적들이 자해로 인한 흉터임을 눈치챘다.\n그렇기에 그녀는 이 멍청한 얼굴을 한 여자가 어느 정도의 폭력 속에서 마음이 꺾여버릴지 궁금해졌다.\n스스로를 상처 입힌 이유가 무엇인지, 미카는 그 이유를 알 수 없었지만 확실한 건 이제 그 여자는 평생을 고통과 후유증 속에서 살아야 만 할 것이다.\n미카는 상상만으로도 웃음이 터져 나왔다."
 TRN_opposition.322.a: "메멘토 모리"
 

 #하카리 아츠코
 TRN_opposition.13.t: "온전한 새벽" #탈출
 TRN_opposition.13.d: "동이 트기 전의 새벽녘, 모든 것들이 잠들은 시간.\n아츠코는 마지막 힘을 다해서 가파른 산길을 올랐다.\n이미 지치고 먼지투성이가 된 그녀였지만, 그래도 멈추지 않았다.\n\n그렇게 정상에 오르자 주변의 모습이 눈에 들어왔다.\n탁 트인 들판과 함께 저 멀리 드문드문 민가가 보였다.\n어떤 집에선 아침을 시작하는 불빛이 새어 나왔고 곳곳엔 적백청의 깃발이 흩날렸다.\n\n아츠코는 자신이 해냈다는 걸 깨달았다.\n그녀는 멍하니 산 아래를 내려다보며 천천히 숨을 내쉬었다.\n새벽녘의 차갑고 맑은 공기가 그녀의 정신을 맑게 해주었고, 그렇게나 두려워했던 깊은 밤의 어둠마저 이제는 기품 있고 상냥하게 느껴졌다.\n마치 춤을 추듯이 풀숲을 마음껏 뛰어다니며 그녀는 앞으로 나아갔다.\n\n잠시 뒤 아츠코는 산을 내려와 들판에 자란 한 나무 기둥에 등을 기대고 몸을 뉘었다.\n어느새 동이 떠오르고 있었다.\n마지막으로 안심하고 해를 바라보았던 게 도대체 언제였을까?\n세상이 바뀐 것이 아님에도 그녀의 눈에 비치는 모든 것이 새롭고 아름다웠다.\n하카리 아츠코는 천천히 그녀의 모든 속박을 내려놓았다."
 TRN_opposition.13.a: "보라 이것이 새것이라 할 것이 있으랴 오래전 세대에도 이미 있었느니라"
 TRN_opposition.132.t: "당신이 심연을 들여다 볼때"
 TRN_opposition.132.d: "나기사만큼은 아니지만 그녀 또한 미카의 가장 소중한 친구 중 한 명이었다.\n가끔은 이해하지 못할 장황한 말들로 자신의 화를 돋우기는 했지만, 그럼에도 그녀는 정말 사랑스러웠다.\n\n그렇기에 미카는 그녀가 그렇게 되기를 바라지 않았다.\n그건 그녀의 뜻이 아니었다.\n그런데도, 그런데도 불구하고... 꿈속에서 그녀는 언제나 피로 이루어진 수면의 안쪽에서 공허한 눈으로 미카를 직시했다.\n그녀뿐만이 아니었다.\n미카가 자신의 앞에서 치워버린 수많은 사람들도 그녀의 곁에서 미카를 직시하고 있었다.\n\n다행히 오늘 밤 미카의 잠을 깨운 것은 끔찍한 악몽이 아닌 한 통의 전화였다.\n눈을 뜬 미카는 잠시 멍하니 앉아있다가 수화기를 들어 올렸다.\n\n\n그리고 전화를 받은 지 얼마 가지 않아 맨손으로 수화기를 부숴버린 미카는 그대로 침실을 나섰다.\n\n잠시 후에 소식을 달려듣고 나타난 그녀의 비서가 미카를 본 곳은 그녀의 집무실이었다.\n바닥에는 잡기나 가구의 잔해들과 함께 이번 작전의 책임자들이 쓰러져있었고 미카는 붉은색으로 물들어있었다.\n\n그녀의 비서가 사태를 수습하기 위해 어딘가로 향한 사이, 미카는 초점 없는 눈으로 자신의 탁자 위에 올려진 한 사진을 보았다.\n국경을 넘은 하카리 아츠코가 부드럽게 미소를 지으며, 달빛 아래 마치 춤을 추듯이 들판을 거닐고 있는 사진이었다.\n\n이윽고 미카는 주변을 돌아보다가 깨진 거울 속에 비친 자신의 모습을 보았다.\n피와 먼지로 뒤덮인 채 더러워진 그녀의 모습은 초라하면서도 섬뜩했다.\n\n\"....내가.. 뭘 하고 있는 거지...?\"\n\n건조하게 내뱉은 그 말은 너무나도 공허하게 울려 퍼졌다.\n그리고 누구도 미카의 질문에 대답해 주지 않았다."
 TRN_opposition.132.a: "심연 또한 당신을 보고있다."

 TRN_opposition.23.t: "두 번 다시 만나지 말자" #사살
 TRN_opposition.23.d: "계율을 수호하는 아리우스 학생회장들의 고귀한 피를 이어받은 그녀는 아리우스의 새로운 학생회장이 될 운명이었다.\n\n하지만 갑작스러운 변화 속에서 그녀는 그저 아리우스의 영광을 위한 제물로 전락하고 말았다.\n그녀의 정당한 왕좌는 한 어른에 의해 강탈당했고, 그녀의 앞날은 잿빛으로 물들었다.\n\n하지만 하카리 아츠코는 무너지지 않았다.\n그녀를 지켜주는 가족과도 같은 친구들과 함께, 그녀는 언젠가 찾아올 해방을 작게나마 소망했다.\n그 작은 소망이 아츠코가 자신을 잃지 않게 해주는 기반이었다.\n\n그러나 동시에 아츠코는 더 이상 소중한 사람들이 상처받는 것을 보고 싶지 않았다.\n그녀는 추격자들의 이목을 자신에게 돌리기 위해 스스로를 화목 제물로 택했다.\n자신의 모든 것을 품어주듯이 붉게 타오르는 아지랑이의 안에서 그녀는 비로소 해방을 느꼈다.\n\n마지막으로 그녀의 눈에 비친 것은 가장 소중한 세 사람의 얼굴이었다.\n다시는 보지 못할, 자신이 가장 사랑하는 사람들.\n아츠코는 그녀들에게 홀로 조용히 작별을 건넸다."
 TRN_opposition.23.a: "...그리고 마침내 행복하기를."
 TRN_opposition.232.t: "가장 숭고한 행위"
 TRN_opposition.232.d: "나기사만큼은 아니지만 그녀 또한 미카의 가장 소중한 친구 중 한 명이었다.\n가끔은 이해하지 못할 장황한 말들로 자신의 화를 돋우기는 했지만, 그럼에도 그녀는 정말 사랑스러웠다.\n\n그렇기에 미카는 그녀가 그렇게 되기를 바라지 않았다.\n그건 그녀의 뜻이 아니었다.\n그런데도, 그런데도 불구하고... 꿈속에서 그녀는 언제나 피로 이루어진 수면의 안쪽에서 공허한 눈으로 미카를 직시했다.\n그녀뿐만이 아니었다.\n미카가 자신의 앞에서 치워버린 수많은 사람들도 그녀의 곁에서 미카를 직시하고 있었다.\n\n다행히 오늘 밤 미카의 잠을 깨운 것은 끔찍한 악몽이 아닌 한 통의 전화였다.\n눈을 뜬 미카는 잠시 멍하니 앉아있다가 수화기를 들어 올렸다.\n\n\n그리고 잠시 뒤 수화기를 내려놓은 미카는 조용히 그 자리에서 상념에 잠겼다.\n\n하카리 아츠코, 아리우스의 정당한 후계자이자 고귀한 피를 물려받은 그녀의 최후는 스스로를 제물로 불속에 뛰어드는 것이었다.\n결코 그런 운명이 아니었음에도 그녀는 하찮은 것들을 위해 스스로를 희생했다.\n그 결정이 실제로 의미가 있었는지는 지금으로썬 중요하지 않았다.\n\n알 수 없는 복잡한 생각과 부자연스러운 감정들이 뜻하는 바를 미카는 알 수 없었다.\n그저 그녀는 다시 수화기를 들어 올려 그녀의 비서에게 전화를 걸었다.\n\n\"...하카리 아츠코를 여기로 데려와, 망가지지 않도록 주의해서\"\n\n그저 하카리 아츠코가 맞이한 최후의 실체를 직접 두 눈으로 보고 싶었다.\n그렇게 해야지만 다시 한동안은 편안한 밤을 되찾을 수 있을 될 것만 같았다.\n머릿속을 흔드는 생각들을 외면하고 억지로 눈을 감으며, 미카는 천천히 침대 속으로 빠져들었다."
 TRN_opposition.232.a: "촛불은 그 자신을 밝히기 위해 존재하지 않는다."

 TRN_opposition.33.t: "귀환" #체포
 TRN_opposition.33.d: "사람에게는 각자의 운명이 있다.\n경중을 떠나서 수많은 운명이 사람의 수만큼 존재한다는 것을 우리는 알고 있다.\n그리고 아츠코의 운명이 보여주는 것은 휘황찬란하면서도 외롭고 쓸쓸한 왕좌였다.\n\n하지만 그녀는 자의로도 타의로도 그 운명에 저항했다.\n그녀는 그저 평범하고 싶었다.\n공주도 제물도 아닌 그저 한 명의 학생으로서, 그녀가 사랑하는 사람들과 함께 나란히 걷고 싶었다.\n\n하지만 운명은 빼앗길 때처럼 돌아올 때조차 갑작스러웠다.\n숨어있던 한 허름한 방으로 자신을 찾아온 트리니티의 사냥개들을 보며 아츠코는 자신이 결국 운명으로부터 도망치지 못했다는 걸 깨달았다.\n\n그렇게 그녀는, 다시 쓸쓸한 어둠 속으로 사라져갔다.\n공주는 자신이 있어야 할 곳으로 되돌아갔다.\n차갑고 외로운 자신의 옥좌로"
 TRN_opposition.33.a: "햇빛을 보지 못하고 알지 못하나 이가 저보다 평안함이라"
 TRN_opposition.332.t: "어두운 밤"
 TRN_opposition.332.d: "나기사만큼은 아니지만 그녀 또한 미카의 가장 소중한 친구 중 한 명이었다.\n가끔은 이해하지 못할 장황한 말들로 자신의 화를 돋우기는 했지만, 그럼에도 그녀는 정말 사랑스러웠다.\n\n그렇기에 미카는 그녀가 그렇게 되기를 바라지 않았다.\n그건 그녀의 뜻이 아니었다.\n그런데도, 그런데도 불구하고... 꿈속에서 그녀는 언제나 피로 이루어진 수면의 안쪽에서 공허한 눈으로 미카를 직시했다.\n그녀뿐만이 아니었다.\n미카가 자신의 앞에서 치워버린 수많은 사람들도 그녀의 곁에서 미카를 직시하고 있었다.\n\n다행히 오늘 밤 미카의 잠을 깨운 것은 끔찍한 악몽이 아닌 한 통의 전화였다.\n눈을 뜬 미카는 잠시 멍하니 앉아있다가 수화기를 들어 올렸다.\n\n\n잠시 뒤 전화를 끝낸 후 미카는 싱글벙글 미소를 지으며 침대에 걸터앉은 채 양발을 흔들었다\n\n하카리 아츠코를 붙잡았다.\n그것도 아무런 손실이나 교전 없이 조용하게.\n지능이 모자란 군부 놈들과는 달리 적어도 비밀경찰 친구들은 훨씬 효율적인 모습을 보여줬다.\n \n아츠코를 붙잡았으니 이제 아리우스는 전혀 위협이 되지 못했다.\n오랜만에 모든 게 제대로 돌아가고 있다는 느낌을 받은 미카는 그대로 침대에 누워 창밖을 바라보았다.\n\n모든 일이 끝난 뒤에는 자신도 저 별들처럼 찬란하게 빛날 수 있을 것이다.\n그녀는 그렇게 믿으며 천천히 잠들었다."
 TRN_opposition.332.a: "어둠이 있어야만 별을 볼 수 있다."

 # 츠치나가 히요리
 TRN_opposition.14.t: "이건 몰랐지?" #탈출
 TRN_opposition.14.d: "솔직히 정말 아무도 몰랐을 것이다.\n도대체 누가 수배자가, 그것도 대낮에 기차표를 뽑아서 국경을 넘을 줄 알았겠는가?\n\n그녀는 대담하게도 성당에 잠입하여 수녀복을 찾아 입은 뒤 모든 짐을 열차의 가축 운송칸에 밀어 넣었다.\n그러고선 그대로 기차의 가장 구석진 좌석에 올라타서 기도를 올리듯이 경건한 자세를 취하고 깊이 잠들어버렸다.\n\n국경에서 검문원들이 들어오기도 했지만 잠들어있었기에 헤일로가 보이지 않기도 했고 무엇보다 너무나 존재감이 없어서 그녀가 수배된 아리우스 스쿼드의 일원이라는 것을 의심조차 하지 못했다.\n\n헌병들이 그녀가 츠치나가 히요리였단 걸 알아챘을 땐 이미 그녀가 부다페스트 중앙역에 도착한 뒤였다.\n기차에서 내려 역 앞 들판에 앉은 그녀는 따스한 햇살을 맞으며 기지개를 폈다.\n그리고 오랜만에 느긋이 푸른 하늘을 올려다보며 해맑게 활짝 웃었다"
 TRN_opposition.14.a: "헤헤- 살았당-"

 TRN_opposition.144.t: "어두운 현실 앞에서"
 TRN_opposition.144.d: "키리후지 나기사와 미소노 미카는 오랫동안 알고 지낸 친구였다.\n하지만 작금의 상황에서 둘을 더 이상 친구라고 부를 순 없었다.\n나기사는 쿠데타로 인해 자유를 잃은 패배자였고, 미카는 그녀를 끌어내린 장본인이었다.\n\n눈앞에는 고급스러운 차와 티세트가 차려져 있었지만, 창문은 철창이 쳐져 있고 문밖에는 총을 든 경비들이 서있는 삭막한 환경.\n그 안에서 미카는 언제나와 같이 경쾌한 목소리로 쓸모없는 이야기를 재잘거렸다.\n나기사는 어떠한 감정도 내보이지 않으며 조용히 찻잔을 기울였다.\n시중드는 사람도 없고 햇빛을 보지 못한 지 오래되었는데도 그녀의 겉모습에는 여전히 품위가 느껴졌다.\n\n\"그래서 말이야- 그 강아지가 글쎄-\"\n\"미카님, 전보가 도착했습니다.\"\n\n미카의 시답지 않은 이야기를 끊은 건 그녀의 비서였다.\n그녀는 찻잔을 들고 여전히 미소를 유지한 채 조용히 비서가 보여주는 전보를 읽었다.\n\n\n\n\"....하?\"\n\n순식간에 표정을 일그러뜨리는 미카를 보며 모두 잠시 동안 시간이 멈춘 것처럼 느껴졌다.\n\n\"빠져나가..? 기차를 타고.....지금 나랑 장난하는 거야?\"\n\"지금 관련 부처에서 조사 중이라는 보고를...\"\n\n비서가 입을 연 순간 미카가 던진 찻잔이 그녀의 머리에 적중하며 깨져버렸다.\n휘청하며 뒤로 주춤한 비서의 이마에선 붉은 선혈이 흘러내렸다.\n\n\"너희들 다 멍청이야..? 겨우 이런 허접한 방식으로 도망치는 멍청한 꼬맹이 하나를 붙잡지 못했다는 게 말이나 돼?!! 쓸모없고 멍청한 것도 정도껏 해야지...!!!\"\n\"....푸흣..\"\n\n폭발적으로 쏟아져 나오는 미카의 분노를 멈춘 것은 나기사의 웃음이었다.\n산산조각이 나서 차갑게 식어버린 찻잔만큼이나 핏기 없는 섬뜩한 얼굴로 미카는 나기사를 돌아봤다.\n\n\"나쁜 버릇이 더욱 심해졌네요, 미카. 당신은 예전에도 일이 마음대로 풀리지 않으면 젖먹이처럼 보기 흉하게 칭얼댔었죠.\"\n\n그 이야기에 얼굴이 붉게 물들은 미카는 그대로 문쪽으로 성큼성큼 걸어갔다.\n고성 소리에 달려들어온 두 경비병은 난장판이 된 주변 모습에 잠시 멈칫했다.\n미카는 마치 화풀이를 하듯이 그 둘의 정수리에 총알을 박아버린 뒤 밖으로 사라졌다.\n\n혼자 남은 나기사는 살짝 의미심장하게 옅은 미소를 지으며 차를 마셨다.\n모든 것이 망가져가고 있었지만 그녀는 지금만큼은 웃고 있었다."
 TRN_opposition.144.a: "내게 남은 거라곤 웃음뿐이었다."


 TRN_opposition.24.t: "마지막 사죄"
 TRN_opposition.24.d: "거리 전체에 울리는 굉음과 함께 날아간 총알이 한 불운한 사람의 미간에 명중했다.\n흩어져 엄폐하는 추격자들을 보며 츠치나가 히요리는 노리쇠를 당겼다.\n\n그녀의 일생은 언제나 불행했다.\n수많은 부조리와 억압 속에서 그녀는 고립되고 위축되어갔다.\n하지만 그녀는 살기를 원했다.\n폭력과 힐난 속에서 그녀는 살기 위해 누구보다도 악착스럽게 행동했다.\n그렇기에 지금도 그녀는 거리낌 없이 방아쇠를 당기고 있었다.\n\n하지만 저항은 오래가지 못했다.\n그녀가 다음 탄약을 약실에 밀어 넣을 때 누군가가 닫힌 문을 걷어차며 안으로 돌아왔다.\n히요리는 바로 총을 들어 올려 추격자의 어깨를 날려버렸다.\n그러나 또 한 명의 추격자가 바로 달려들어와 조준도 없이 발사한 총격에 히요리는 자신의 무기를 놓치고 벽에 등을 부딪히며 주저앉았다.\n\n멀어져 가는 의식 속에서 히요리는 자신을 쏜 추격자를 보았다.\n그녀는 점점 식어가는, 먼저 방 안으로 들어왔던 동료의 시신을 품에 끌어안은 채 오열하고 있었다.\n\n\".....죄송..해요....죄...송...\"\n\n멀어져 가는 의식 속에서 히요리는 그녀들에게 작게나마 사죄를 남겼다.\n그녀가 처음으로 타인에게 전하는 진실한 마음이었다.\"
 TRN_opposition.24.a: "우매한 자가 당한 것을 나도 당하리니 내가 심중에 이르기를 이것 또한 헛되도다."

 TRN_opposition.244.t: "너희는 세상의 소금이니"
 TRN_opposition.244.d: "키리후지 나기사와 미소노 미카는 오랫동안 알고 지낸 친구였다.\n하지만 작금의 상황에서 둘을 더 이상 친구라고 부를 순 없었다.\n나기사는 쿠데타로 인해 자유를 잃은 패배자였고, 미카는 그녀를 끌어내린 장본인이었다.\n\n눈앞에는 고급스러운 차와 티세트가 차려져 있었지만, 창문은 철창이 쳐져 있고 문밖에는 총을 든 경비들이 서있는 삭막한 환경.\n그 안에서 미카는 언제나와 같이 경쾌한 목소리로 쓸모없는 이야기를 재잘거렸다.\n나기사는 어떠한 감정도 내보이지 않으며 조용히 찻잔을 기울였다.\n시중드는 사람도 없고 햇빛을 보지 못한 지 오래되었는데도 그녀의 겉모습에는 여전히 품위가 느껴졌다.\n\n\"그래서 말이야- 그 강아지가 글쎄-\"\n\"미카님, 전보가 도착했습니다.\"\n\n미카의 시답지 않은 이야기를 끊은 건 그녀의 비서였다.\n그녀는 찻잔을 들고 여전히 미소를 유지한 채 조용히 비서가 보여주는 전보를 읽었다.\n\n\n\"음- 그래서? 어떻게 하라고?\"\n\n그리고 미카가 보인 반응은 의문이었다.\n두 눈을 동그랗게 뜬 채로 반문하는 미카에게 비서는 당황한 채 아무 말도 하지 못했다.\n\n\"겨우 테러리스트들 중 한 명이 죽었다는 보고를 지금처럼 좋을 때에 굳이 들어야 해?\"\n\"죄송합니다.. 제가 생각이 짧았습니다...\"\n\n나기사는 조용히 차를 내려놓으며 그 모습을 지켜보았다.\n예전에도 제멋대로인 미카였지만 지금의 미카는 그러한 일면을 숨기려는 생각조차 없어 보였다.\n이윽고 그녀는 고개를 들려 암막이 처진 창가를 바라보았다.\n자신의 무력함을 느끼며 마신 차에서는 어떠한 향기도 느낄 수 없었다."
 TRN_opposition.244.a: "소금이 그 맛을 잃으면 무엇으로 대체 하리오"

 TRN_opposition.34.t: "무거운 발걸음"
 TRN_opposition.34.d: "츠치나가 히요리는 아리우스에서 가장 뛰어난 저격수였다.\n사격실력은 말할 필요조차 없었고, 전략적인 위치 선정이나 은 엄폐에도 부족한 점이 없었다.\n\n하지만 세상 모든 저격수들이 그렇듯 그녀 역시 만능은 아니었다.\n특히 자신의 존재를 수십에서 수백 명이 쫓아오는 상황에서 히요리가 할 수 있는 것이라곤 자신의 존재를 숨기는 것뿐이었다.\n작은 마을에 들이닥친 트리니티의 추격자들이 주민들을 소개하고 주변을 완전히 포위했을 때 그녀는 한 2층 집의 세면대 아래에 몸을 숨겼다.\n\n하지만 더 이상 숨어만 있을 순 없었다.\n추격자들은 집을 하나하나 수색하지 않고 화염방사기로 전부 불태우고 있었다.\n어둑해진 창밖에 솟아오르는 불길들을 보며 히요리는 자신이 차고 있던 권총을 꺼내 만지작거렸다.\n\n그러나 이윽고 히요리는 고개를 저으며 모든 무기를 내려놓았다.\n세상의 모든 것들은 전부 헛되고 의미 없지만, 그럼에도 그녀는 살고 싶었다.\n그러기 위해서 그녀는 수많은 위험들을 계속 뛰어넘어왔다.\n이번 위기 또한 그러한 시련 중 하나일 뿐이라고 히요리는 생각했다.\n\n그녀는 두 손을 머리 양옆으로 들어 올린 채 밖으로 나아갔다.\n발걸음 하나하나가 무겁고 찐득했지만 그녀는 이것이 유일하게 남은 선택지란 걸 알았다.\n그렇게 히요리는 자신의 마지막 저항을 멈추고 기약 없는 미래로 걸어나갔다.\n"
 TRN_opposition.34.a: "지나치게 악인이 되지 말며 우매자도 되지 말라 어찌하여 기한 전에 죽으려느냐"

 TRN_opposition.344.t: "온유한 자는 복이 있나니"
 TRN_opposition.344.d: "키리후지 나기사와 미소노 미카는 오랫동안 알고 지낸 친구였다.\n하지만 작금의 상황에서 둘을 더 이상 친구라고 부를 순 없었다.\n나기사는 쿠데타로 인해 자유를 잃은 패배자였고, 미카는 그녀를 끌어내린 장본인이었다.\n\n눈앞에는 고급스러운 차와 티세트가 차려져 있었지만, 창문은 철창이 쳐져 있고 문밖에는 총을 든 경비들이 서있는 삭막한 환경.\n그 안에서 미카는 언제나와 같이 경쾌한 목소리로 쓸모없는 이야기를 재잘거렸다.\n나기사는 어떠한 감정도 내보이지 않으며 조용히 찻잔을 기울였다.\n시중드는 사람도 없고 햇빛을 보지 못한 지 오래되었는데도 그녀의 겉모습에는 여전히 품위가 느껴졌다.\n\n\"그래서 말이야- 그 강아지가 글쎄-\"\n\"미카님, 전보가 도착했습니다.\"\n\n미카의 시답지 않은 이야기를 끊은 건 그녀의 비서였다.\n그녀는 찻잔을 들고 여전히 미소를 유지한 채 조용히 비서가 보여주는 전보를 읽었다.\n\n\n\"우와 그렇구나아- 붙잡았구나? 대단하네-, 이렇게 말해줬으면 했어?\"\n\n밝게 웃는 표정에 어울리지 않게 쏘아붙이자 비서는 바로 고개를 숙였다.\n그럼에도 미카는 그녀에게 향하는 독언을 멈추지 않았다.\n\n\"마을 하나를 전부 불태워가면서 붙잡은 게 그렇게 대단한 거야? 심지어 본인이 스스로 투항한 거라며? 내가 이런 보고를 들으면서 기뻐할 거라고 생각했어?\"\n\n쉬지 않고 자신의 비서를 질타하는 미카의 모습을 보며 나기사는 눈을 감았다.\n분명 저런 아이가 아니었다.\n조금은 어리고 모자란 모습을 많이 보이기는 했어도 항상 주변에 상냥하고 심성이 곧은 아이였다.\n\n그녀는 누구도 듣지 못하게 나지막하게 한숨을 내뱉었다.\n그날따라 그녀가 그렇게나 좋아하던 차가 더욱 씁쓸하게 느껴졌다."
 TRN_opposition.344.a: "저희가 땅을 기업으로 받을 것임이요"
 
 ##나기사
 TRM_event.363.t: "집으로 돌아가다"
 TRM_event.363.desc: "급하게 꾸린 이삿짐의 마지막 상자를 닫고, 요한은 허리가 뻐근했던 탓에 쭈욱, 하고 허리를 펴면서 숨을 돌렸습니다. 하지만 잠시라도 숨을 돌리려고 하면 밖의 여자들이 압박을 해왔기 때문에, 그는 다시 짐을 꾸렸습니다. 짐을 다 꾸리고 자신의 차에 실은 뒤에, 집 열쇠를 정의실현부원 중 한명에게 건네주고서는 길을 나섰습니다. 그는 자동차의 창문으로 정겨웠던 브레슬라우의 거리를 마지막으로 한번 바라본 뒤에, 엔진에 시동을 걸고 나섰습니다.\n\n'철의 여인'이 최근 지시한 허가받지 않은 외국인들에 대한 추방 명령이 오늘 트리니티 전국에서 시행되었습니다. 메클렌부르크와 작센, 실레시아와 폴란드 회랑 인근에 집중적으로 시행된 이 정책은 많은 사람들을 정겨운 고향을 떠나고 차갑고 외로운 타지로 나아가게 만들었습니다. 그 와중에 일어난 사소한 저항은 정의실현부에 의해 모조리 분쇄되었으며, 모든 희망과 가능성을 잃은 사람들은 짐을 꾸려 눈물의 행진을 떠나야만 했습니다.\n\n그 중에서도, 요한의 젋었던 시절을 매일같이 함께해 주었던 정겨운 오래된 도로 위에서, 자신이 매일같이 들렸던 그 지겨운 프레젤을 파는, 지금은 문 앞에 큰 글씨로 퇴거라고 적힌 빵집의 유리문을 지나, 브레슬라우의 표지판을 지나 폴란드로 향했습니다. 그는 어째서인지 주체할 수 없는 눈물을 흘렸습니다. 아마, 자신의 모든 것이 그곳에 있었기 때문이었을지도 모릅니다.\n\n그는 손수건으로 멈추지 않는 눈물을 닦으면서, 다시는 보고 싶지 않던 자신의 아버지가 살고 있는 크라쿠프로 향했습니다.\n\n그가 어렸을 적에, 그는 매일을 술에 취한 아버지의 손아귀에서 고통받아야 했습니다. 그 고통을 참지 못한 그가 맨몸으로 크라쿠프에서 나왔을 때, 그는 강인한 마음, 그것 단 하나로 브레슬라우로 향했습니다. 브레슬라우에서 간단한 청소부 잡일부터 공사장에서까지 닥치는 대로 일했던 그는 마침내 아버지의 손아귀에서 벗어나 홀로 자립할 수 있게 되었습니다. 그리고 그것을 함께하고 바라봐준 도시는, 브레슬라우였습니다. 하지만 그는 브레슬라우에서 나와 크라쿠프로 다시 돌아갔습니다.\n\n오랜 가출이 이제서야 끝난 것입니다."
 TRM_event.363.a: "그리고 요한은, 다시 흘러내리는 눈물을 닦았습니다."
 TRM_event.364.t: "공개연설"
 TRM_event.364.desc: "작성중"
 TRM_event.364.a: "그리고 나기사는 천천히 연단에서 내려왔다."
 TRM_event.365.t: "크루프에서의 손님"
 TRM_event.365.desc: "슈테틴에서의 크루프의 임시 본사에서, 구스타프 크루프는 창문 밖을 바라보며 자신의 깊은 고뇌에 빠져 있었습니다.\n\n대전이 이후 독일은 둘로 갈라졌으며, 독일 전역에 뻗어 있던 크루프 또한 반으로 나뉘어 그전까지 벌어두었던 돈으로 산소호흡기를 차고 있는 신세일 뿐입니다. 손가락에 끼워 둔 담배를 몇번이고 의자에 문지르며, 그는 크루프의 미래- 그리고 자신의 결정에 두려워하며 단 하루라도 제대로 잠에 들지 못할 크루프의 노동자들을 위해서라도 그는 끊임없는 고뇌에 빠져야만 했습니다.\n\n어떻게 해야 할까? 게헨나라는 곳에 남아 있는 크루프는 어떻게 해야 하지? 중공업에서 철수해야 하나? 빌어먹을 에덴 그룹과는 어떻게 경쟁해야 하지?\n\n고뇌할수록 더욱이 깊은 고뇌 속으로 끌려들어가며, 구스타프 크루프는 오늘도 크루프의 미래를 위해 홀로 싸우고 있습니다.\n\n그때, 복도에서 급히 뛰어오는 발소리와 함께 그의 비서가 말했습니다.\n\n\" 사장님, 에덴에서의 손님이십니다. \"\n\n그가 비서의 말로 잠시동안 끝없는 고뇌에서 빠져나왔을 때, 곧이어 비서가 문을 열고 손님을 들여보냈습니다.\n\n그 손님은 트리니티의- 키리후지 나기사였습니다.\n\n예상치 못한 손님에 당황했던 그는, 곧이어 미소지으며 나기사를 앉혔습니다.\n\n\" 크루프는, 오늘도 평안하신지요? \"\n\n빈 방의 정적을 깨는 건 나기사였습니다. 이번에도 예상치 못한 질문에 당황했던 그는 당혹감을 감추지 못하며 말을 이었습니다.\n\n\" 하하, 여기서 제가 맞다고 이야기한다면, 저는 초면부터 거짓말을 하게 되겠지요. \"\n\" 네, 크루프의 상태는 지금 좋지 않습니다. \"\n\n나기사의 말에 크루프가 한치의 거짓도 없이 대답했습니다. 말을 끝마친 크루프는 나기사가 입을 떼길 기다리며 초조하게 앉아 있었습니다.\n\n\" 안타까운 일이네요. \"\n\" 그러면 티파티에서 제안을 하나 드리도록 하죠. \"\n\" 트리니티 밑에서, 크루프가 일하는 것은 어떤가요? \"\n\n나기사가 홍차를 마시면서 말하자, 강철과도 같이 차가웠던 구스타프 크루프의 심장에 온기가 돌고 곧이어 재빠르게 뛰기 시작했습니다.\n\n이것은 크루프에게 주어진 유일한 마지막 희망의 밧줄일까, 아니면 악마의 교활한 찢어진 밧줄일까?\n\n구스타프 크루프는 그 말을 듣고서 몇십분 동안 대답하지 못했지만, 그 정적을 깬 것 또한 나기사였습니다.\n\n\" 에덴에서, 긍정적인 화답 기다리겠습니다. \"\n\" 오늘도 평안하시길. \"\n\n나기사는 이 말을 마지막으로, 의자에서 일어나 밖으로 나섰습니다."
 TRM_event.365.a: "그리고 문이 닫히자, 파이프 담배가 타들어갔습니다."
 TRM_event.366.t: "버려진 신앙"
 TRM_event.366.desc: "증오의 역사는 어찌보면 사회가 태동했을 때부터 시작되었을지도 모릅니다. 자신의 안위를 위해서거나, 질투에서 비롯되었거나, 본의 아니게 피해를 주었거나, 그 원인은 매우 다양합니다. 증오는 수많은 희생자들, 지워지지 않을 상처, 그리고 역설적이게도 많은 발전과 진보를 남겼습니다. 상대를 철저히 짓밟기 위해서, 상대를 없애기 위해서. 그리고 굴복시키기 위해서.\n\n트리니티와 게헨나 사이의 험악한 관계가 대전이 이후에도 변한 것이 없는건 이상한 일이 아닐 것입니다. 위기가 찾아와도 서로를 증오하는 것을 멈추지 않았던 것은 키보토스 역시 다르지 않았습니다. 인류와 키보토스가 서로 공유하는 유일한 공통점은, 자신들과 다른 이들을 향한 무한한 증오뿐이었습니다.\n\n시스터후드에 소속되어있던 소녀의 얼굴엔 절망만이 가득했습니다. 눈물, 핏자국, 그리고 괴로움 뿐이었습니다. 트리니티가 게헨나를 \"대화가 불가능한 족속\"들로 취급했을 때, 그녀는 받아들일 수 없었습니다. 주님께선 모두를 사랑하십니다. 그게 설사 게헨나라 할지라도. 주님의 사랑은 모두에게 베풀어져야만 했습니다.\n\n하지만 증오가 이들의 마음을 갉아먹는 지금, 거룩하신 주님의 목소리는 학생들에겐 그저 잡음에 불과했습니다.\n\n소녀는 낙담했습니다. 분노와 증오는 대중을 열광시키는 가장 강력한 힘이라고 했던가요. 진실을 깨달은 순수하고 청순한 소녀의 심장에 비수가 날아와 꽂혔습니다. 다시 한번 눈앞에 피비린내 나는 싸움이 시작되었습니다. 이들을 말려야 했습니다. 시스터후드로서, 하나의 사람으로서 주님의 딸들인 이들을 말려야만 했습니다\n\n그들의 폭력은 멈추지 않았습니다. 오히려 게헨나와 트리니티 학생들 사이의 주먹다짐과 총격은 여전히, 더욱 격렬히 벌어지고 있었습니다. 검은 수녀복을 입은 소녀는 무력한 자신을 원망하며, 그리고 이 모든 것을 방관한 주님을 원망하며, 작은 몸을 웅크리며 흐느꼈습니다."
 TRM_event.366.a: "불타는 화로, 눈물 흘리는 하늘"
 TRM_event.367.t: "모든 것은 끝이 나는 법"
 TRM_event.367.desc: "트리니티 정의실현부 소속 학생인 토시로 아이는 이 모든게 그저 혼란스럽기만 했다. \"트리니티와 게헨나 사이의 적대적인 행동은 절대 없을 것.\" 이 간결한 한 문장은 아이의 머릿속을 헤집어 놓았다. 티파티의 미카를 추종하던 아이에게, 그런 결정은 더욱이 이해할 수 없는 일이었다.\n\n규율도 없고, 불량배들이 가득하고, 싸움만 할줄 아는 이 얼간이들이랑 대화가 통하겠는가? 미카가 있었다면 모든 것을 제자리로 되돌릴수 있을 터였다. 화풀이 상대를 찾다 눈에 들어온 것은 게헨나 학원의 선도부, 그 역겨운 모습을 본 아이는 일부로 그녀의 어깨를 강하게 부딪혔다.\n\n선도부는 아파하며 무언가를 아깝다는 듯 바라보고 있었다. 아이는 역겨운 마음을 숨기려고 하지 않은채 그녀를 바라보았다. 게헨나는 철저히 짓밟아야 한다. 하지만 정의를 행하기 위해 주먹을 내지르려던 그녀의 손을, 선도부원의 옆에 떨어진 제 형체를 잃어버린 생크림이 섞인 무언가가 멈춰세웠다.\n\n옛날부터 자주 들렀던 제과점의 케이크였다. 아이는 할말을 잃어버렸다. 세상이 끝나도 정의를 행하겠다는 아이의 마음에 무언가가 다시 돌아온 느낌이었다. 얼굴을 찡그리던 아이는, 손을 내밀며 선도부 부원을 일으켜 세웠다.\n\n\" ...아까전엔 내가 미안했어. 내가 다시 돌아가서 사줄게. \"\n\" 응...? 으응, 고마워. \"\n\n제과점에 가는 길에도, 트리니티와 게헨나 학생간의 어색하면서도 불쾌한 공기는 계속 느껴졌다. 어느샌가 제과점에 도착한 아이는 사비로 케이크를 다시 구매해 그녀에게 주었다. 선도부의 그녀는 만족한 표정으로 그녀를 바라보았다.\n\n\" 돈 좀 썼네? 그냥 무시하고 지나갈수도 있었을 텐데. 난 선도부의 히카리라고 해, 너는? \"\n\n그녀가 전화번호를 교환하고 싶다는 듯 휴대전화를 꺼내들어 눈앞에 흔들었다. 아이는 한숨을 푹 쉬더니, 그녀의 휴대폰을 받아 자신의 번호를 저장했다."
 TRM_event.367.a: "\" ...토시로 아이. \""
 TRM_event.368.t: "방과후 디저트부와 미식연구회"
 TRM_event.368.desc: "최근 트리니티와 게헨나 간에서의 화해의 일환으로, 몇몇 동아리들은 미리 선정된 상대 동아리와 하루를 보내기로 했습니다. 에르푸르트에서 '미식연구회'와 만나기로 한 방과후 디저트부 부원들은 미식연구회에 대한 기대와 환상이 뒤섞인 가진 채로, 에르푸르트의 한 카페에서 미식연구회를 기다리고 있었습니다.\n\n하지만 곧이어, 바깥에서는 거대한 폭발음이 들려왔습니다. 폭발음은 근처의 소세지 트럭에서 일어난 것으로, 한 독일인이 소세지 트럭을 버리고 소리지르며 도망치고 있는 것이 카페의 통유리로 보였습니다. 본디 미식연구회의 '악명'에 대해서는 익히 들어온 터라, 이 또한 소세지에 대한 기본이 되어있지 않다는 이유로- 미식연구회가 그 트럭을 폭발시켜 버린 것이 틀림없어 보였습니다.\n\n곧이어 미식연구회 부원들이 방금 전의 상황과는 다르게, 굉장히 태연한 모습으로 카페의 문을 열고 들어왔습니다. 태연하게 문을 열고 들어오는 미식연구회 부원들을 보자, 카페의 바리스타는 공포에 질려 주방 안으로 들어갔고, 잔뜩 긴장한 얼굴의 직원이 미식연구회 부원들을 방과후 디저트부의 테이블로 안내했습니다. 이렇게 그녀들간의 첫 정식 만남이 성사된 것입니다.\n\n\" 후훗... 만나서 반갑습니다, 방과후 디저트부. \"\n\"그 귀여운 아이는 부장? \"\n\n미식연구회의 쿠로다테 하루나가 자리에 앉자마자 활기를 띄며 이바라기 요시미에게 인사했습니다.\n\n\" 귀, 귀여운 아이라니! \"\n\" 어린애 취급은 싫단 말야... \"\n\n갑작스럽게 어린애 취급을 받은 요시미는 얼굴을 붉히며 대답했습니다.\n\n그녀들이 잠시동안 서로에 대해 천천히 대화를 나눌 때, 곧이어 귀여운 토끼 모양의 케이크가 나왔습니다. 서로서로 케이크를 나누어서 맛을 보자, 곧이어 치즈와 생크림 케이크의 조화가 입을 간지럽혔습니다. 까다로운 입맛으로 유명한 미식연구회 부원들도 오랜만에 제대로 된 음식을 먹었음에 만족하는 듯 했습니다.\n\n\" 오오오~! 엄~청 맛있는걸! \"\n\" 특히 이 치즈 부분이 마음에 들어! \"\n\n\" 니힛, 나도 그래! \"\n\n그녀들이 화기애애한 분위기 속에서 케이크를 칭찬하고 있을 때, 하루나가 갑자기 주머니에서 폭탄들을 꺼내들며 말했습니다.\n\n\" 치즈와 생크림 케이크, 이건 미식에 대한 금기! \"\n\" 이런 음식은 지금 당장 사라져야 합니다! \"\n\n\" 하루나, 잠ㄲ- \"\n\n\" 콰아앙-! \"\n\n그녀를 말릴 새도 없이, 하루나는 곧바로 폭탄을 터트리며 카페를 폭파시켰습니다.\n\n곧이어 미식연구회는 자욱한 연기 속에서 사라졌고, 이렇게 그녀들의 첫 만남은 이렇게 끝이 났습니다."
 TRM_event.368.a: "음, 그래도 맛있었어!"
 TRM_event.369.t: "트리니티에서의 제안"
 TRM_event.369.d: "에덴에서 보내져온 서신에 따르면, 트리니티는 우리의 내부 상황을 잘 알고 있으며, 자신들이 아비도스의 모든 문제들을 처리해 주는 대신 트리니티에 합병되라고 적혀 있었습니다.\n\n지긋지긋한 우리의 문제들을 단번에 해결할 수 있다는 것은 꽤나 혹할 만한 제안이지만, 사실상 이것은 자신들이 아비도스를 합병하기 위한 계략임은 틀리없어 보입니다."
 TRM_event.369.a: "거절해라."
 TRM_event.369.b: "우리는 할 수 있는게 없다..."
 TRM_event.370.t: "아비도스의 수락"
 TRM_event.370.d: "아비도스 고등학교는 우리의 제안을 수락했고, 지금부터 트리니티와 아비도스는 하나가 되었습니다."
 TRM_event.370.a: "좋아!"
 TRM_event.371.t: "아비도스의 저항"
 TRM_event.371.d: "안타깝게도 자신들의 미래를 내다보지 못한 듯 보이는 아비도스 측은 우리의 제안을 거부했고, '뻔뻔한 합병의 계략'에 넘어가지 않는다고 단언하고서는 전쟁을 준비하는 것으로 파악되었습니다."
 TRM_event.371.a: "말로 되지 않는다면 총으로 해라."
 
 ## 나기사 - 대타협 
 TRM_event.358.t: "서막"
 TRM_event.358.desc: "따뜻한 햇빛이 내려쬐고 시원한 바람이 불던 날, 트리니티와 게헨나의 티파티와 만마전은 서로간의 오랜 불화를 지금에서나마 종식시키기 위해 고성당에 모였습니다.\n\n고성당은 과거 통합의 공의회가 열렸던 곳으로, '에덴 조약'이라는 역사적인 사건을 진행하기에는 가장 적절한 장소일 것입니다.\n\n티파티의 키리후지 나기사와 만마전의 하누마 마코토가 이례적으로 서로를 향해 미소지어보이며 악수한 뒤, 각자의 자리에 앉았습니다. 그 장면을 크로노스 스쿨의 수많은 카메라들이 숨죽이며 주목하고, 키보토스의 수많은 학생들이 그 광경을 바라보는 가운데, 티파티의 키리후지 나기사가 먼저 말을 꺼냈습니다.\n\n\" 오시는 데에는 평안하셨는지요. \"\n\n\" 아아- 게헨나의 유능한 지도자, 이 하누마 마코토 님에게 딱 알맞게 정돈해 놨더군! \"\n\" 키킷, 잡담은 그만두고, 본론으로 들어가는게 어때? \"\n\n서로간의 화기애애한 분위기에서, 그들의 하인들이 각자의 테이블에 고급 종이에 멋들어지게\n\n' 에덴 조약을 위한 트리니티 종합학원과 게헨나 학원 간 대타협 '\n\n이라고 적힌 서류들을 나누어 주었습니다.\n\n역사에 남아 후손과 후손들의 입을 거쳐 오랫동안 전해질, 에덴 조약과 대타협이 막 시작되는 참이었습니다."
 TRM_event.358.a: "\" 첫번째 장 보시겠습니다. \""
 TRM_event.359.t: "첫번째 장"
 TRM_event.359.desc: "티파티와 만마전이 서류를 넘기는 소리가 울리고, 티파티의 하인이 말을 이었습니다.\n\n\" 첫번째 조인은 상호 '영원의 우정 조약' 체결입니다. \"\n\" 쉽게 말해서, 상호간의 모든 적대적 행위 중단이지요.  \"\n\n\" 흐음? 그런 시시한 건 이미 합의할 때 조인한 걸로 알고 있는데. \"\n\" 혹여나- 이 판데모니움 소사이어티를 믿지 못한다, 그런 거라도 되는 건가? \"\n\n 예상치 못한 조인에 마코토가 모자를 벗고는 굉장한 불쾌심을 드러내며 말했습니다. 게헨나 테이블 또한 티파티에게 해명을 요구하듯이 자리를 고쳐 앉고 티파티를 바라볼 뿐이었습니다.\n\n\" 이 조인은 그런 뜻이 아닙니다, 하누마 마코토 님. \"\n\" 그저, 상호 간 불신을 해소하기 위한 조인일 뿐이지요. \"\n\n만마전의 냉담한 반응 또한 예상하지 못한 나기사는 당혹스러움을 감추고 만마전에게 미소지어보이며 화답할 뿐이었습니다.\n\n\" 확실히 해 두는게 좋지 않겠습니까? \"\n\n\" 푸하핫! \"\n\"... 실로 흥미로워. \"\n\" 벌써부터 우리와 영향력 싸움을 하려고 하다니 말이야. \"\n\n만마전의 하누마 마코토가 웃음을 터트리며 꽤나 그녀답지 않은 표정으로 나기사에게 화답했습니다.\n\n방금 전까지의 화기애애한 분위기는 한순간에 얼어붙었고, 티파티와 만마전이 서류에 서명하는 펜촉 소리만이 들려올 뿐이었습니다.\"
 TRM_event.359.a: "첫번째 조인 - 통과."
 TRM_event.360.t: "두번째 장"
 TRM_event.360.desc: "이번에는, 만마전의 하인이 얼음장같은 분위기를 깨고 말했습니다.\n\n\" 두번째 조인은 동아리 통폐합 건입니다. \"\n\" 트리니티와 게헨나가 하나된다면, 동아리 수는 기존 수의 두 배로 늘어날 것이며, 통합된 학생회에게 큰 부담이 될 것입니다. \"\n\n이번 조인은 서로의 동아리의 통폐합과 관련된 것이었습니다. 키보토스의 두 거대 학원이 하나로 흡수된다면 서로간 그 많은 동아리들이 새로운 학생회가 처리하기에 부담이 될 것이니, 미리 그것을 결정하자는 뜻이었습니다. 하지만 이번에는 티파티와 만마전 또한 쉽게 서명해주지 않았습니다.\n\n\" ... 온천개발부 폐부는 판데모니움 소사이어티가 반대한다. \"\n\" 온천개발부도 엄연한 게헨나의 동아리로써, 게헨나는 게헨나의 동아리들을 내평겨치지 않는다. 아아, 그렇고말고. \"\n\n\" 어라? 마코토 님, 그 동아리의 악명을 정녕 모르고 있으십니까? \"\n\" 멀쩡한 길에 구멍을 내질 않나, 다른 학원에서까지 들어가서는 멋대로 온천을 개발한다고 하질 않나. \"\n\" 그 동아리는 연합, 더 나아가 키보토스를 위해서라도 폐부되어야만 합니다. \"\n\n\" 킥... 키킥... 캬하하하하! \"\n\" 그렇게 따지자면, 보충수업부 또한 폐부해버려야지! \"\n\" 세번 연속으로 낙제, 수영복 차림으로 배회, 무장 난동까지! \"\n\" 키킷, 정말로 쓸모 있는 동아리인 게야! \"\n\n마코토가 나기사의 말에 정면으로 반박하며 나섰습니다. 나기사는 한숨을 쉬며 그저 알겠다고 하며 말을 이어나갔습니다.\n\n\" 그렇다면 비슷한 동아리들은 통합시키는 데에는 의견이 없으신 걸로 알겠습니다. \"\n\n나기사의 이 짧은 한마디 뒤로, 마코토는 모자를 눌러쓰고 꽤나 만족스러운듯한 미소를 지으며 조인에 서명했습니다.\n\n아마 다 잘 되리라, 그 광경을 바라보는 모두가 그렇게 빌었습니다." 
 TRM_event.360.a: "두번째 조인 - 통과."
 TRM_event.361.t: "세번째 장"
 TRM_event.361.desc: "서로가 두번째 조인에 서명하자, 곧이어 세번째 장이 낭독되었습니다.\n\n\" 세번째 조인은 통합된 학생회 건입니다. \"\n\" 티파티와 만마전의 임원들 중에서 몇몇을 뽑아 새로 구성할지, 아니면 전원이 참여해 구성할지 결정해야 합니다. \"\n\n얇지만서도 무거운 서류의 뒷부분답게, 이번 조인은 통합 학생회 건이었습니다.\n\n티파티와 만마전을 그대로 통합할 지, 아니면 몇몇을 뽑아 통합할 지 결정해야만 하는 것이었습니다.\n\n\" 키킥, 이 마코토 님만 있으면, 모든 게 다 잘 돌아갈 게야! \"\n\" 이로하, 그렇지 않나? \"\n\n마코토가 조인을 읽자마자 자신있는 얼굴로 제 옆에 앉아 있는 이로하에게 물었습니다.\n\n\" 하아, 그 말 진심이십니까. \"\n\" 제가 하던 모든 업무들을 하셔야 할 겁니다. \"\n\n이로하는 귀찮다는 듯이 마코토에게 대답했습니다. 마코토는 의미심장한 얼굴로 이로하를 바라보았습니다.\n\n\" 저는 모든 분께서 함께하시는 것이, 좋다고 생각합니다. \"\n\" 업무를 더 나눌 수 있다면, 그것만큼 좋은 것은 없으니까요. \"\n\n나기사가 이로하를 바라보며 대답했습니다. 갑작스러운 나기사의 말에, 이로하는 당혹스러움을 감추지 못했습니다.\n\n마코토는 약간 실망한 듯한 얼굴이긴 했지만, 이번에는 지난번과는 달리 꽤나 빠르게 조인되었습니다.\n\n통합된 학생회에는 티파티와 만마전의 모든 임원이 참석하게 될 것입니다."
 TRM_event.361.a: "세번째 조인 - 통과."
 #TRM_event.362.t: "마지막 장"
 #TRM_event.362.desc: "드디어 대타협의 마지막 시간이 도래했습니다. 티파티와 만마전의 임원들이 마지막 장을 펼치자, 그곳에는 큰 글씨로 쓰인, 단 두개의 선택지만이 주어졌습니다.\n\n" 에덴 합중국 "\n\n" 에덴 연방 "\n\n으로 말입니다.\n\n이번에는 티파티와 만마전 역시 쉽사리 결정을 내리지 못했습니다. 앞으로 트리니티와 게헨나는 서로의 발을 묶고 앞으로 나아가야만 했고, 그것을 도울 마지막 도구를 선택하는 것이었으니 말입니다.\n\n에덴 합중국은 쉽게 말해 같은 깃발 아래에서 트리니티와 게헨나가 동등한 권리를 보장받는 것으로, 통합된 학생회 아래에 각각 서로의 학생회가 존재하며, 학원의 미래를 결정할 때는 트리니티와 게헨나가 동등한 권리의 거부권 또한 행사할 수 있으며, 현재로써는 가장 이상적인 형태의 연합입니다.\n\n그와 반대로, 에덴 연방은 서로의 모든 것을 하나로 통합시키고 완전히 새로운 학원으로 거듭나는 것으로써, 지속적인 연합 존속과 안정을 위해서라면 이 방법이 가장 이상적이지만, 현재는 서로간의 악연이 모두 뿌리뽑히지 않은 만큼, 지금 당장 이것을 실현하는 것에는 무리가 있습니다.\n\n티파티와 만마전의 임원들이 몇시간이고 고민한 끝에, 결정을 내렸습니다. 그들은..."
 #TRM_event.362.a: "... 에덴 합중국에 서명했습니다."
 #TRM_event.362.b: "... 에덴 연방에 서명했습니다."
 TRM_event.362.t: "마지막 장"
 TRM_event.362.desc: "드디어 대타협의 마지막 시간이 도래했습니다. 티파티와 만마전의 임원들이 마지막 장을 펼치자, 그곳에는 큰 글씨로 쓰인, 단 하나의 단어만이 존재했습니다.\n\n\" 에덴 합중국 \"\n\n이번에는 티파티와 만마전 역시 쉽사리 결정을 내리지 못했습니다. 앞으로 트리니티와 게헨나는 서로의 발을 묶고 앞으로 나아가야만 했고, 그것을 도울 마지막 도구를 결정하는 것이었으니 말입니다.\n\n에덴 합중국은 쉽게 말해 같은 깃발 아래에서 트리니티와 게헨나가 동등한 권리를 보장받는 것으로, 통합된 학생회 아래에 각각 서로의 학생회가 존재하며, 학원의 미래를 결정할 때는 트리니티와 게헨나가 동등한 권리의 거부권 또한 행사할 수 있으며, 현재로써는 가장 이상적인 형태의 연합입니다.\n\n지속적인 연합 존속과 안정을 위해서라면 이 방법이 가장 이상적이지만, 현재는 서로간의 악연이 모두 뿌리뽑히지 않은 만큼, 지금 당장 이것을 실현하는 것에는 무리가 있습니다.\n\n티파티와 만마전의 임원들이 수 시간에 걸친 기나 긴 논쟁 끝에, 결정을 내렸습니다. 그들은, 결국 결정을 내리지 못했습니다.\"
 TRM_event.362.a: "마지막 장 - 보류."

 TRM_event.372.t: "병상에서 깨어난 유리조노 세이아"
 TRM_event.372.desc: "지난 트리니티 혼란의 시작을 알리며 병원으로 긴급 이송되었던 유리조노 세이아가 의식을 되찾고 키리후지 나기사를 급히 찾고 있습니다.\n\n유리조노 세이아가 상투스 분파의 수장으로 다시금 활동을 시작할 수 있게 된 지금, 혼란 속 산산히 조각난 상투스 분파는 다시 한번 결집하고 있습니다."
 TRM_event.372.a: "..."

 TRM_event.373.t: "정치화된 티파티"
 TRM_event.373.desc: "파테르 분파의 쿠데타 시도를 저지하는 과정에서 시행된 티파티의 '임시 조치'들은 정치적 이해관계가 얽히며 결국 해지되지 못한 채 남아있습니다.\n\n그 결과 티파티 내의 권력 구조는 급격히 재편되었고, 와해된 상투스 분파와 우리의 손으로 해체된 파테르 분파를 뒤로한 채, 키리후지 나기사가 이끄는 필리우스 분파만이 유일한 주도 세력으로 남게 되었습니다."
 TRM_event.373.a: "...이런 걸 원하지는 않았어."

 TRM_event.374.t: "몇 가지 조항의 수정"
 TRM_event.374.desc: "필리우스 분파가 유일한 트리니티의 지도 세력으로 부상한 지금, 우리는 이 통치를 더욱 원활하게 유지하고 제2의 쿠데타가 발생하지 않도록 할 필요가 있습니다.\n\n이에 따라 키리후지 나기사는 트리니티의 유일한 지도자로 남을 것입니다. 물론, 나기사 본인은 이러한 역할을 원하지 않지만, 트리니티의 혼란을 방치할 수 없다는 사실 또한 잘 알고 있습니다."
 TRM_event.374.a: "...잠깐만이야."

 TRM_event.375.t: "보충수업부의 창설"
 TRM_event.375.desc: "키리후지 나기사는 이제 더 이상 미소노 미카의 주도로 벌어지는 위험한 행위들을 좌시하지 않기로 결심했다. 그리고 마침내, 그녀가 기다리던 인물이 방에 들어섰다.\n\"히후미 씨, 당신에게 중요한 임무가 있습니다. 새롭게 창설될 '보충수업부'에 가입해 트리니티의 위협을 찾아내 주세요. 이 일은 매우 중요한 사안입니다.\"\n\n얼마 후, 키리후지 나기사의 직속 명령으로, 트리니티의 문제아들을 계도한다는 명분 아래 '보충수업부'가 창설되었다."
 TRM_event.375.a: "더 이상은 두고 볼 수 없어요."

 TRM_event.376.t: "미소노 미카의 하루"
 TRM_event.376.desc: "\"응? 지난 주까지만 해도 내 옆에서 일하던 보좌관은 대체 어디로 사라진 거야?\"\n미소노 미카는 의아한 표정으로 새롭게 자신을 보좌하게 된 학생에게 물었다. 그 학생은 잠시 멈칫하더니 차분한 목소리로 대답했다.\n\n\"며칠 전에 일이 너무 힘들다고 그만두셨습니다. 아마 스트레스를 많이 받으셨던 것 같아요.\"\n미카는 고개를 갸웃거리며 다시 생각했다.\n\"그거 참 이상하네. 내가 보기엔 꽤 즐기는 것처럼 보였는데 말이야. 특히 지난번 회의 때는 열정적으로 나섰던 것 같았거든.\"\n\n학생은 조용히 웃으며 고개를 끄덕였다.\n\"그러게 말입니다. 정말 이상한 일이죠.\"\n하지만 그의 표정은 그 말과는 전혀 다르게, 미동조차 없었다. 무표정한 얼굴로 서 있는 모습은 마치 그가 이미 모든 것을 알고 있다는 듯했다.\n\n미카는 잠시 그 학생을 응시했지만, 더 이상 묻지 않았다. 뭔가 미묘한 긴장감이 흐르는 가운데, 그 대화는 자연스럽게 끝이 났다. 그러나 그 학생의 차가운 표정은 쉽게 지워지지 않았다."
 TRM_event.376.a: "미카 씨는 제 새장 속에 얌전히 있어주세요."

 TRM_event.401.t: "[FROM.GetName]의 항복 요구"
 TRM_event.401.desc: "[FROM.GetName]이 게헨나와의 전쟁에 있어 우리의 협력을 요구했습니다. 독일 통합의 명분 아래 게헨나 학원에게서 독일 민족을 해방하는 것을 명분으로, 거절한다면 즉시 민족의 반역자로 취급하고 침공하겠다는 입장을 밝혔습니다."
 TRM_event.401.a: "날개 달린 독일이라니, 웃기는 소리."
 TRM_event.401.b: "받아들일 수 밖에 없다."

 TRM_event.402.t: "[FROM.GetName]의 거절"
 TRM_event.402.desc: "우리 국가가 민족해방전쟁을 위한 협력을 요구했으나. [FROM.GetName]측은 우리를 가짜 독일이라 비하하며 차라리 싸우다 죽겠다는 입장을 밝혀왔습니다."
 TRM_event.402.a: "반역은 죽음 뿐이다."

 TRM_event.403.t: "군부 합류"
 TRM_event.403.desc: "[FROM.GetName]은 우리의 전쟁에 협력하기로 결정하고 이내 우리 군에 통합되는 것을 선택하였습니다."
 TRM_event.403.a: "충성스러운 독일인들을 환영한다."

 TRM_event.404.t: "정부 신뢰 감소"
 TRM_event.404.desc: "우리가 추진하던 치안 유지 정책이 전쟁으로 취소되고 국민들은 우리의 지도력을 의심하고 있습니다."
 TRM_event.404.a: "이런."

 TRM_event.405.t: "베저강에서의 훈련"
 TRM_event.405.desc: "우리 군부는 일찍부터 스칸디나비아 반도로의 군사작전에 관한 계획을 여럿 세워놓은 상태였습니다. 이 중 '베저강에서의 훈련' 작전은 여태까지의 계획 중 가장 최신의 것입니다."
 TRM_event.405.a: "공세를 퍼붓자!"

# 세 자리 수로 구성된 파벌 이벤트
# 1(충성도 분류 1-4) 1(지지도 분류 1-3) 1(순서)

 TRN_faction_event.111.t: "[TRN_faction_event_2_name_text] 파벌의 시위"
 TRN_faction_event.111.desc: "[TRN_faction_event_2_name_text] 파벌은 우리가 벌이는 행동을 비판하며 거리 행진에 나섰습니다. [TRN_faction_event_2_name_text] 측은 우리가 자신들의 요구사항을 들어주기 전까지는 멈출 생각이 없다며, 대로변을 점거하고 소요 사태를 만들어내고 있습니다."
 TRN_faction_event.111.a: "이런."

 TRN_faction_event.112.t: "[TRN_faction_event_2_name_text] 파벌의 반전 시위"
 TRN_faction_event.112.desc: "[TRN_faction_event_2_name_text] 파벌은 우리가 벌이는 전쟁에 대한 비판을 화두로 거리 시위에 나섰습니다. [TRN_faction_event_2_name_text] 측은 우리가 벌이는 전쟁은 서민의 삶을 심각하게 피폐하게 만들고 있다고 말하며 대로변을 점거하고 소요 사태를 만들어내고 있습니다."
 TRN_faction_event.112.a: "좋지 않아."

 TRN_faction_event.121.t: "[TRN_faction_event_2_name_text] 파벌의 주 정부 점거"
 TRN_faction_event.121.desc: "[TRN_faction_event_2_name_text] 측은 우리를 무너뜨리고 새 체제를 수립하겠다는 명분으로 [TRN_faction_event_121_target.GetName] 주 정부를 강제 점거하고 혁명을 선포했습니다.\n\n다행히 대중 동요는 크지 않은 것 같으며, 진압하고자 하면 즉시 진압할 수 있으나, 우리가 진짜로 행동에 나서면 저들의 지지율이 큰 폭으로 상승할 수 있습니다."
 TRN_faction_event.121.a: "유화적으로 접근해라."
 TRN_faction_event.121.b: "즉시 진압해라!"

 TRN_faction_event.122.t: "[TRN_faction_event_2_name_text] 파벌의 경제 동원 중단 시위"
 TRN_faction_event.122.desc: "[TRN_faction_event_2_name_text] 측은 우리의 경제 동원령의 규모를 비난하며 즉시 동원을 해제하라는 내용의 공문을 대로변 전체에 붙이고 있습니다.\n\n[TRN_faction_event_2_name_text]의 요구는 점차 대중의 지지를 받고 있으며, 우리가 이들의 요구를 무시한다면 이들의 지지율이 큰 폭으로 상승할 수 있습니다."
 TRN_faction_event.122.a: "..."

 TRN_faction_event.123.t: "[TRN_faction_event_2_name_text] 파벌의 강제 징병 중단 시위"
 TRN_faction_event.123.desc: "[TRN_faction_event_2_name_text] 측은 우리의 징병 정책이 과도하다며 즉시 강제 징병을 중단하고 강제로 끌려간 병사들을 집으로 귀환시키라며 요구하고 있습니다.\n\n[TRN_faction_event_2_name_text]의 요구는 점차 대중의 지지를 받고 있으며, 우리가 이들의 요구를 무시한다면 이들의 지지율이 큰 폭으로 상승할 수 있습니다."
 TRN_faction_event.123.a: "..."

 TRN_faction_event.131.t: "[TRN_faction_event_2_name_text] 파벌의 파업"
 TRN_faction_event.131.desc: "[TRN_faction_event_2_name_text] 측은 자신들이 통제하는 노동조합을 이용해 대규모 파업을 시작했습니다.\n\nTRN_faction_event_2_name_text] 측은 우리들이 자신들의 요구를 들어줄 때까지 제한 없는 파업을 선언하였으며, 이는 우리의 산업 계획에 심각한 타격을 불러올 것입니다."
 TRN_faction_event.131.a: "협상을 시작하자."

 TRN_faction_event.132.t: "[TRN_faction_event_2_name_text] 파벌의 장관 해임"
 TRN_faction_event.132.desc: "[TRN_faction_event_2_name_text] 측은 자신들의 정부 영향력을 이용하여 우리의 핵심 인물을 하나 해임했습니다.\n\n[TRN_faction_event_2_name_text] 측은 자신들을 지속적으로 정부에서 소외시킨다면 더 큰 대가가 있을 것이라며 우리에게 엄중하게 경고하고 있습니다."
 TRN_faction_event.132.a: "이런."

 TRN_faction_event_132_tt: "§Y[THIS.GetName]§!의 §Y조언가§! 해임"
 TRM_forced_dismissal_flag: "§Y최근에 해임됨§!"

 ##############

 TRN_faction_event.211.t: "[TRN_faction_event_2_name_text] 파벌의 집회"
 TRN_faction_event.211.desc: "우리의 반대파중 하나인 [TRN_faction_event_2_name_text] 파벌이 소규모 모임을 가졌습니다.\n\n해당 모임에서는 [ROOT.GetLeader]의 정책을 비판하는 내용으로 시작되었으며, [TRN_faction_event_2_name_text] 파벌의 방향성을 결정하고 지지자를 모으기 위한 계획이 주로 논의되었습니다."
 TRN_faction_event.211.a: "그래도 문제는 없다."

 TRN_faction_event.212.t: "행정부 가담을 요청하는 [TRN_faction_event_2_name_text]"
 TRN_faction_event.212.desc: "[TRN_faction_event_2_name_text] 측이 우리 행정부에 참여하고 싶다는 의사를 밝혀왔습니다. [TRN_faction_event_2_name_text] 측은 대체로 우리와 관계가 좋지 않았으나, 이번을 계기로 우리와 관계를 개선하면서 영향력 증가를 도모하는 것 같습니다."
 TRN_faction_event.212.a: "좋은 일이군."
 TRN_faction_event.212.b: "속내를 믿을 수 없다."

 TRN_faction_event.221.t: "[TRN_faction_event_2_name_text] 파벌의 [TRN_development_of_specific_state_event_target.GetName] 주 개발 요구"
 TRN_faction_event.221.desc: "[TRN_faction_event_2_name_text] 측은 [TRN_development_of_specific_state_event_target.GetName] 주가 경제적으로 손해를 보고 있다는 주장을 필두로 [TRN_development_of_specific_state_event_target.GetName] 주에 산업을 유치하라는 내용의 입장을 밝혔습니다."
 TRN_faction_event.221.a: "일단 알겠다."

 TRN_faction_event.222.t: "[TRN_faction_event_2_name_text] 파벌의 정부 로비"
 TRN_faction_event.222.desc: "[TRN_faction_event_2_name_text] 파벌이 우리 정부 인사들에게 정치적 지원을 통해 영향력을 확보하였다는 소식이 들려왔습니다.\n\n해당 로비로 인해 우리의 인사중 몇몇이 저들에게 회유된것으로 보이며, 저들의 영향력이 증가하는 것을 두고 볼 수 밖에 없었습니다."
 TRN_faction_event.222.a: "..."

 TRN_faction_event.223.t: "우리를 비판한 [TRN_faction_event_2_name_text]"
 TRN_faction_event.223.desc: "최근 벌어진 행정부의 인사 몇몇이 엮인 비리에서 [TRN_faction_event_2_name_text] 측이 우리가 해당 사건의 주축이라며 거센 비판을 가해왔습니다.\n\n이번 공개 비판으로 저들은 학생들의 지지를 끌어냈으며 우리의 영향력을 약화시키고 있습니다."
 TRN_faction_event.223.a: "이런."

 TRN_faction_event.231.t: "경제 계획을 주도하는 [TRN_faction_event_2_name_text]"
 TRN_faction_event.231.desc: "[TRN_faction_event_2_name_text] 측은 자신들의 정부 영향력을 이용하여 이번 경제 정책 수립에 큰 영향을 발휘했고, 우리는 해당 경제 정책에 따라 건설을 진행해야 합니다."
 TRN_faction_event.231.a: "간섭이 많군."

 TRN_faction_event.232.t: "[TRN_faction_event_3_name_text] 파벌을 공격하는 [TRN_faction_event_2_name_text]"
 TRN_faction_event.232.desc: "[TRN_faction_event_2_name_text] 측은 우리의 주된 협력자중 하나인 [TRN_faction_event_3_name_text] 파벌에 대한 정치적 공세를 시작했습니다. [TRN_faction_event_3_name_text] 측은 우리에게 도움을 요청하였으나, 이미 해당 파벌의 이미지가 크게 실추되었습니다."
 TRN_faction_event.232.a: "어쩔 수 없군."
 TRN_faction_event.232.b: "지지 성명을 내라."

 TRM_government_plan_good: "산업 계획에 포함됨"
 TRM_government_plan_bad: "산업 계획에 포함되지 않음"

 ##################

 TRN_faction_event.311.t: "경제 동원에 우려를 표하는 [TRN_faction_event_2_name_text] 파벌"
 TRN_faction_event.311.desc: "[TRN_faction_event_2_name_text] 파벌이 우리의 경제 동원 정책이 가져올 경제적 문제에 대한 깊은 우려를 표했습니다.\n\n해당 파벌은 [ROOT.GetLeader] 우리와 친선 관계를 유지하는 파벌이나, 최근 동원령에 의해 친선 관계에 문제가 발생한 것으로 보입니다."
 TRN_faction_event.311.a: "이런."

 TRN_faction_event.312.t: "대규모 징병에 우려를 표하는 [TRN_faction_event_2_name_text] 파벌"
 TRN_faction_event.312.desc: "[TRN_faction_event_2_name_text] 파벌이 우리의 징병 정책에 대한 깊이 있는 토론을 벌였습니다.\n\n해당 파벌은 [ROOT.GetLeader] 우리와 친선 관계를 유지하는 파벌이나, 최근 징병에 의해 친선 관계에 문제가 발생한 것으로 보입니다."
 TRN_faction_event.312.a: "어쩔 수 없다."

 TRN_faction_event.313.t: "[TRN_faction_event_2_name_text] 파벌의 집회"
 TRN_faction_event.313.desc: "[TRN_faction_event_2_name_text] 파벌이 우리와의 정치적 협력 관계를 이용해 영향력을 확대하기 위한 회의를 진행했습니다\n\n해당 파벌은 [ROOT.GetLeader] 우리와의 친선 관계를 자신들의 정치 영향력 확보에 사용하기로 하였으며, 집회가 벌어진 지 며칠이 지나지 않아 선전물을 부착하고 있습니다."
 TRN_faction_event.313.a: "나쁘지 않군."

 TRN_faction_event.321.t: "[TRN_faction_event_2_name_text] 파벌의 대중화"
 TRN_faction_event.321.desc: "[TRN_faction_event_2_name_text] 파벌이 트리니티 내 온건파의 위치를 확보한 것으로 보입니다.\n\n해당 파벌의 급진적이거나 반정부적 활동을 벌이지 않는 모습이 대중에게 친근하게 다가온 것으로 보입니다.\n\n그러나 파벌이 확대됨에 따라, 우리 정부의 주된 야당중 하나로 부상하였고, 이는 우리에게 좋은 영향력이 있지는 않을 것 같습니다."
 TRN_faction_event.321.a: "흠..."

 TRN_faction_event.322.t: "[TRN_faction_event_2_name_text] 파벌의 급진화"
 TRN_faction_event.322.desc: "[TRN_faction_event_2_name_text] 파벌이 최근 대두된 정치적 지도자로 결집하며 위협적인 국내 정세에 맞춰 급진주의가 파벌의 주류를 차지한 것으로 보입니다.\n\n이전까진 우리의 정치적 동맹이었던 [TRN_faction_event_2_name_text] 파벌의 행보는 이제 알 수 없는 방향으로 빠져들었습니다."
 TRN_faction_event.322.a: "조금 더 지켜볼 필요가 있어."

 TRN_faction_event.323.t: "전쟁에 반대하는 [TRN_faction_event_2_name_text] 파벌"
 TRN_faction_event.323.desc: "[TRN_faction_event_2_name_text] 파벌이 우리 국가가 벌이는 전쟁에 대한 반대 입장을 조심스럽게 밝혔습니다.\n\n[TRN_faction_event_2_name_text] 측은 우리의 전쟁으로 무너진 시장 질서, 부족한 농작물 등을 소개하며 전쟁을 조속히 중단할 것을 요청하고 있습니다."
 TRN_faction_event.323.a: "..."

 TRN_faction_event.331.t: "정치 스캔들에 휩싸인 [TRN_faction_event_2_name_text]"
 TRN_faction_event.331.desc: "[TRN_faction_event_2_name_text] 파벌이 최근 벌어진 정치적 스캔들의 대상으로 지목되면서 파벌의 지지율이 큰 폭으로 깎여나갔습니다.\n\n우리가 해당 파벌과 비슷한 정치적 입장을 가지고 있기에 부분적으로 피해를 보았으나 [TRN_faction_event_2_name_text] 측의 피해에 비하면 매우 적은 수준에 불과하긴 합니다."
 TRN_faction_event.331.a: "빠르게 발을 빼라."

 TRN_faction_event.411.t: "전쟁을 지지하는 [TRN_faction_event_2_name_text] 파벌"
 TRN_faction_event.411.desc: "[TRN_faction_event_2_name_text] 측은 우리의 군사 작전에 대한 옹호와 우리의 정치적 선전에 가담하며 전쟁 수행을 보조하고 나섰습니다.\n\n해당 파벌은 우리의 전쟁은 정당하며 반전론자들에 대한 정치적 공세를 가했습니다."
 TRN_faction_event.411.a: "우리의 전쟁은 국가 생존의 문제다."

 TRN_faction_event.412.t: "충성의 대가를 바라는 [TRN_faction_event_2_name_text] 파벌"
 TRN_faction_event.412.desc: "[TRN_faction_event_2_name_text] 측은 자신들의 긴 정부 지지를 이유로 자신들을 이번 정책 구성에 있어서 중요한 임무를 맡게 해줄 것을 기대합니다.\n\n[TRN_faction_event_2_name_text] 파벌의 요구를 들어주지 않을 경우 해당 파벌의 충성도가 크게 손상될 것입니다."
 TRN_faction_event.412.a: "그들에게도 약간의 보상이 필요하겠지."
 TRN_faction_event.412.b: "우리 국가서 줄 자리는 없다."

 TRN_faction_event.421.t: "[TRN_faction_event_2_name_text] 파벌의 대중 폭동 조직"
 TRN_faction_event.421.desc: "[TRN_faction_event_2_name_text] 파벌이 우리에 대한 과도한 충성심에서 비롯된 대규모 집단 폭동이 벌어졌습니다.\n\n해당 파벌이 벌인 폭동에서는 우리의 정적을 향한 무차별적 폭행이 이어졌고, 이는 해당 파벌과 우리의 정치적 이미지에 심각한 타격이 입혀졌습니다."
 TRN_faction_event.421.a: "아, 젠장."

 TRN_faction_event.422.t: "[TRN_faction_event_2_name_text] 파벌의 지원"
 TRN_faction_event.422.desc: "[TRN_faction_event_2_name_text] 파벌이 우리 정부의 주된 지지자로써의 활동으로 우리 정부에 대한 효과적인 선전을 벌였습니다.\n\n이번 선전으로 우리의 정치적 자원 확보가 원활해졌으며, 우리를 중심으로 새로운 정책을 꾸릴 힘이 마련되었습니다."
 TRN_faction_event.422.a: "좋아."

 TRN_faction_event.431.t: "[TRN_faction_event_2_name_text] 파벌의 자원 입대"
 TRN_faction_event.431.desc: "[TRN_faction_event_2_name_text] 파벌의 구성원들이 우리에게 힘을 실어주고자 애국주의적인 정신으로 우리의 군에 입대했습니다."
 TRN_faction_event.431.a: "훌륭하군."

 TRN_faction_event.432.t: "[TRN_faction_event_2_name_text] 파벌의 투자"
 TRN_faction_event.432.desc: "[TRN_faction_event_2_name_text] 파벌이 우리가 진행중인 경제 프로젝트에 큰 규모의 자금 투자를 벌였습니다.\n\n[TRN_faction_event_2_name_text] 측은 우리에게 투자하며 우리에 대한 지지를 표현했으며, 이번 투자로 인해 산업 건설에 추진력을 얻게 되었습니다."
 TRN_faction_event.432.a: "지지해준 보람이 있군."

