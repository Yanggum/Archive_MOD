 TRM_event.1.t: "Tea Party Emergency Meeting"
 TRM_event.1.desc: "\"Mmm-hmm? Nagi-chan, it's the first time you've called me out at such a late hour...? What's going on?\"\n\"Mika... the situation is dangerous now.\"\n\"Seia is right, Mika-san.\"\n\"Nagi-chan...\"\n\nNagisa, unable to watch any longer, sided with Seia and cut off Mika's idle chatter. Once Mika became somewhat quiet, Nagisa began to explain the situation.\n\n\"Our academy—no, our Kivotos—has fallen into a place no one knows, possibly due to someone's prank or a supernatural phenomenon. People who look like us but have no halos threatened the academy with unknown languages and weapons, though we ultimately defended it. And through fighting these otherworldly people, we've learned that we too are under threat of death.\"\n\n\"Because of that, we have convened this emergency meeting.\"\n\"Do you have anything to say about this? Mika-san? Seia-san?\"\n\n\"Umm...\"\n\"Nothing in particular.\"\nA brief silence followed, but in the end, nothing was said. Mika tried to open her lips to say something to escape the situation, but the words wouldn't come out easily.\n\nUltimately, the 1st Tea Party Emergency Meeting came to an end."
 TRM_event.1.a: "..."

 TRM_event.2.t: "Emergency"
 TRM_event.2.desc: "News of the General Student Council President spread quickly throughout Kivotos. The news that she, who had solved every problem perfectly, had stepped down and vanished was enough to cause shock, and this shock reached Trinity as well."
 TRM_event.2.a: "And one woman smiled."

 TRM_event.3.t: "2nd Meeting"
 TRM_event.3.desc: "\"With this, the 2nd meeting is conclud—\" \n\"Is the meeting over? Then, I'm going!\"\n\"Mika..!\"\n\nWhen did this suspicion begin? Misono Mika disappears quickly somewhere as soon as the meeting ends, without even participating in the post-meeting tea party. To say she dislikes tea parties... Mika was usually a chatty and bright girl, so missing a tea party was unimaginable.\n\nWhat exactly has contacted her? Carrying only her suspicions, Kirifuji Nagisa prepared for the next meeting."
 TRM_event.3.a: "..."
 NAGISA_NOT_TRUST_MIKA: "\n§LKirifuji Nagisa suspected her fellow Tea Party member, Misono Mika.§!"
 NAGISA_TRUST_MIKA: "§LShe trusted her childhood friend Misono Mika, thinking she would never do such a thing.§!"

 TRM_event.4.t: "Evidence"
 TRM_event.4.desc: "\"Nagisa-sama...! I've found decisive evidence. It's not too late yet....\"\n\nOne of the Tea Party executives shouted as she rushed into the room.\nBut her cry was soon buried by the sharp sound of something breaking.\nIn the heavy silence that suddenly arrived, Kirifuji Nagisa, one of the three leaders moving Trinity and head of the Filius faction, spoke.\n\n\"...It is no longer a situation that can be stopped by flimsy evidence.\"\n\nHer dignified, noble, and alert appearance, which always moved coldly behind a kind smile, was nowhere to be found.\nThe hand holding the teacup was trembling, and her voice was laced with exhaustion.\nInstead of the look she would usually show an executive who visited her, she looked at her with a cold, despairing, expressionless face.\n\n\"Nagisa-sama... This is a matter of Trinity's future. We still have a chance...\"\n\"...No.. there are no chances left for us... The Triumvirate is already over.\"\n\nAfter finishing her sentence, Nagisa hid her trembling hands and looked out the window.\nUnder the overcast sky, Trinity was enveloped in a gray silence, having lost its vitality.\nThe executive who had visited Nagisa could say nothing more and quietly turned to leave.\n\n\"....Mika.. what exactly is it that you want..\""
 TRM_event.4.a: "The die is cast."

 TRM_event.5.t: "Union Law"
 TRM_event.5.desc: "Gehenna territory is currently difficult to access due to the activities of anti-Trinity resistance forces and the threat of terrorism by Trinity students. In particular, the Rhineland, the western region of Gehenna, is a core industrial zone for both Trinity and Germany. If we cannot utilize these factories and resources, the blood we spilled and our sacrifices will be in vain. Therefore, we must revive these factories and thoroughly investigate potential natural resources.\n\nMeanwhile, concerns are growing among internal bureaucrats. Warnings that this decision could shake the fundamental values of Trinity are also continuing. But the era of running a country based only on justification ended long ago. Misono Mika always puts practical interests first and makes every decision for the benefit of Trinity. Of course, some Trinity students may rebel against this, but we have no time to stop. Reclaiming Gehenna's resources and industry is an essential choice for Trinity's future."
 TRM_event.5.a: "This is all for Trinity..."
 
 TRM_event.6.t: "In the Darkness"
 TRM_event.6.desc: "A suburban area far from central Trinity. The night deepened, and the faint light of the villa was like an island floating alone in the darkness. Leaders of the National Socialists and the Pater faction stood in silence, sparing their words. In the deep darkness, they instinctively felt what this meeting meant.\n\nWhen the door opened, Misono Mika appeared. She stood before them without a word. She wore a bright smile, but it was like a frozen expression. Her footsteps were quiet, yet they seemed to silently oppress the very air in the room. No one dared to speak first. Everyone knew why they were gathered here now.\n\nMika sat before them and exchanged glances. She didn't need words. Everyone in the room already knew. In this moment, it seemed like a choice was given, but in reality, it wasn't.\n\nSilence continued for a while. The air in the room was heavy and stifling. Time flowed slowly, and no one spoke first. They scanned each other's faces, trying to read Mika's intentions, but they couldn't grasp what was hidden behind that smile.\n\nA key figure at the center of the meeting closed his eyes, suppressing the strange anxiety felt in his chest. He began to recount the options given to him.\n\n'Do we have no other choice?'\n\nWhen he opened his eyes again, the cold atmosphere flowing in the room was digging deeper. His thoughts were confused. The disappeared leader, the collapsed order, and now the unfamiliar collaborator before him. He repeated to himself countless times. Is this really the only way? That question continued to eat away at him.\n\nBut reality was harsh. The enemy's voice was growing louder, and the thought that this was the only way they could survive from Trinity didn't leave his head. He realized it. Mika was waiting for that very moment. For them to lose their way in this moment of despair and confusion, and eventually hold her hand.\n\n'If we are to survive from Trinity... this is our only choice.'\n\nHis internal resolve hardened at that moment. There was no other path. He slowly nodded. Finally, the silence was broken.\n\n\"I will accept the cooperation.\" His voice was firm, but the fear hidden within it couldn't be erased."
 TRM_event.6.a: "They can't help it, can they-?"
 
 TRM_event.7.t: "The First Approval"
 TRM_event.7.desc: "After two weeks of preparation, all the key figures and people gathered for the first time in the office, which had been changed to Mika's taste.\nIn the office, so crowded it made the past quietness feel like a lie, Mika sat in the center with a slightly dissatisfied face.\nShe belongs to the type that likes others, but even so, it's bound to be uncomfortable when strangers she hasn't even built a proper friendship with swarm in like this.\n\nIn the midst of that awkward time that felt suffocating to Mika, the moment everyone gathered there was waiting for arrived as the door opened.\nIt was her first approval document, prepared with a high-quality quill on a brass tray, as she had ascended as the sole ruler of Trinity.\nWith the temporarily determined heads of each department standing around, Mika sat and began her performance.\nWith a smile that looked gentle like her predecessor but felt more cheerful, she officially signed her first document.\nCamera lenses moved busily, and those around her applauded her.\n\nMika didn't find the current situation too bad.\nEven though the contents of the document she signed were sending someone to hell, no one cared about such things."
 TRM_event.7.a: "Not a bad start"
 
 TRM_event.8.t: "With a Single Pen..."
 TRM_event.8.desc: "Misono Mika was sending high-ranking figures within the Pater faction far away from Eden. Departing from here to the farthest place possible, even if it was a foreign country, she didn't care what kind of treatment they received there. Since she had already vowed to do anything for the benefit of Trinity, she didn't have the slightest interest in their well-being."
 TRM_event.8.a: "I express my regrets."
 
 TRM_event.9.t: "The Report"
 TRM_event.9.desc: "Misono Mika, wearing glasses, looked down at a document listing names. It was a list of those suspected of cooperating with the Jews. Mika looked up. The room was filled with books and decaying old newspapers. In a shadowed corner, an old gramophone sat rusting under layers of dust. The sight brought a sly smile to Mika's face.\nThe doorbell rang, pulling Matkovski from his reverie. Two rough men in National Socialist Party uniforms entered. One leaned in. Blond hair visible under his cap fluttered. He even looked barbaric. The two saluted, stamping their feet loudly on the wooden floor. The other had a sturdy build, and anyone could see his belly was protruding.\nA brief, awkward silence followed. Finally, Mika looked at the two and said, \"What brings you..?\" In strong voices, the two informed her of the names of those purged today. Mika forced a smile, using formal language she wasn't used to.\n\"Thank you. You may go.\"\n\nBut they did not leave.\n\nMika asked them:\n\n\"Why are you not leaving?\"\n\nThey replied, fiddling with their uniforms, especially the eagle on the chest:\n\n\"It has been revealed that Kirifuji Nagisa is cooperating with the Jews.\"\n\nMika couldn't say anything. Soon after, Mika spoke again.\n\n\"That... still...\"\n\nAs Mika spoke in a trembling voice, their faces soured. The man with the sturdy build stepped toward Mika. Mika flinched and trembled instinctively.\n\nThe sturdy man spoke to Mika in a quiet but firm voice.\n\n\"We will take care of everything. So President, just say one word: 'Process them.' Do you understand?\"\n\n...As the sound of the door latch closing was heard, she slumped as if the tension had been released."
 TRM_event.9.a: "How peaceful."
 
 TRM_event.10.t: "Radio Silence"
 TRM_event.10.desc: "22:00. Silence flows from the radio. Normally, a broadcast announcing the end of regular programming should be transmitted, but today, only silence flows and envelops the room. As if to say there is something."
 TRM_event.10.a: "One child had a nightmare."
 
 TRM_event.11.t: "O Great Success" # 선전물 배포 USE
 TRM_event.11.desc: "When the shadows of Judeo-Bolshevism and Gehenna loomed and darkness fell thick last year,\nI dared to dream of the burning threads of Trinity.\nIn a world where fear ruled and hope seemed to have vanished,\nI wanted to reclaim the price paid by the cruel ones.\n\nUsing ink as a weapon, I wove words of power,\nA poet's rebellion and a whispering fight.\nEach line was a cry for justice, words that were fierce and true,\nPiercing the hearts of those who sought to conquer Trinity, with its great history.\n\nI wrote verses of bold and daring resistance,\nI wrote a symphony of defiance, but my story was unknown\nOn ink-stained pages, I carved my petition,\nFor a future where all can be free.\n\nMy writing dances like a firefly, lighting the way,\nI must navigate the perilous night where courage falters.\nI whispered the soft grace of harmony and love,\nAnd I whispered the national strength and steadfast embrace.\n\nAnd I faced the great Queen Mika\nA blazing flame, a beacon so bright, the one who guides us even in the darkest night.\n\nI will become one with Trinity and challenge the oppressors who oppress us.\n\nDangers abound and there are risks we must face, but we, Trinity, will unite as one and exercise strong embrace. The spirit of Pater cannot be suppressed, it will remain forever in the hearts of the oppressed.\n\nSo, O Great Leader\nLet these words resound like a resolute drum,\nLet them echo in the hearts of the weary and the silent.\nLet them find comfort and strength in every line,\nLet our voices intertwine and become one.\nOur success is a testament to the strength within Trinity students and Germans.\nWe will stand united against the reign of tyranny\nOur dreams shall not be in vain."
 TRM_event.11.a: "-Leni Riefenstahl, 'Glorious Days'-" 
 
 TRM_event.12.t: "The Conductor's Eulogy" # 선전물 배포 USE
 TRM_event.12.desc: "Before the appearance of Student Council President Misono Mika, we were misled by the words of hollow orators. But President Misono Mika was different. Her charismatic speeches reminded us of Trinity's glorious past and ignited our pride.\nWe are prepared to make any sacrifice for the vision of President Misono Mika. Under her leadership, Trinity will become great, and other academies must be sacrificed for this.\nSCHALE, Red Winter, Shanhaijing, Gehenna—these are all merely obstacles blocking Trinity's glory. Especially those who have oppressed us must be executed.\nWe who follow President Misono Mika will remain in history. Under her leadership, we will become stronger and greater.\nOur loyalty lies only with President Misono Mika and Trinity. All else is secondary.\nLong live Great President Mika!"
 TRM_event.12.a: "-From 'The Conductor's Eulogy'-"
 
 TRM_event.13.t: "Theory of Trinity Leadership" # 선전물 배포 USE
 TRM_event.13.desc: "Student Council President Misono Mika appeared with a commanding presence in a splendid room. Her eyes held determination and a sense of duty, and she was surrounded by faithful advisors.\nPresident Misono Mika's speech began by emphasizing Trinity's long history and tradition. She called herself the 'Guardian of the Nation' and declared she would take responsibility for leading Trinity.\nThe author—that is, I—was deeply impressed by Mika's leadership and showed an attitude of fully supporting her vision. Under the belief that 'the end justifies the means,' I argued that any means can be justified for the prosperity of Trinity.\nI expressed the opinion that sacrifice is necessary for Trinity's 'Manifest Destiny' and believe that national prosperity can be achieved through common devotion and effort.\nAs the author, I regard Mika as the only leader to lead Trinity's future, showing an attitude of strong loyalty and worship toward her."
 TRM_event.13.a: "-Otto Strasser, from Theory of Trinity Leadership, Chapter 2-"
 
 TRM_event.14.t: "Solving the Problem Children"
 TRM_event.14.desc: "Failing due to poor grades, wandering the school in a swimsuit, arrested after an armed riot, failing three times in a row. The Make-Up Work Club is truly a place with many problem children.\nHowever, the inside story is that it's a place where those suspected of being Trinity's traitors are gathered in one basket. We must deal with them quickly."
 TRM_event.14.a: "Expel them."
 TRM_event.14.b: "Return them to daily life."
 
 TRM_event.15.t: "Victory in the Decisive Battle of Eden - Ending Centuries of Conflict" 
 TRM_event.15.desc: "After a harsh war, our army has returned after subduing all enemies of Gehenna and finally achieving victory. Although Gehenna students are foolishly continuing resistance movements, they will not pose a real threat to our rule.\n\nConflict between Trinity and Gehenna has continued for hundreds of years. Recently, the conflict seemed to have quieted down somewhat, but deep hatred for each other remained beneath the surface. This hatred ultimately exploded into war, but fortunately, we were victorious, and we will now strive to eradicate this hatred.\n\nNow is the time for our hegemony to begin! The prelude to a true Pax Trinitica will resound and echo across the entire continent. The Trinity army will occupy all regions, and peace and prosperity will come under our merciful rule. Countries across Europe will come to respect our influence as time passes. Whether they want to or not.\n\nOf course, our struggle will not end here. We must go beyond the continent and into the world, establishing our hegemony everywhere. We will challenge the remaining great powers through our cultural influence and military strength to establish ourselves as a true hegemonic nation."
 TRM_event.15.a: "A crown of victory for you!"

 TRM_event.16.t: "The Darkest Hour"
 TRM_event.16.desc: "The Queen ascended the podium, but no one could send her enthusiastic cheers.\nFilius, Sanctus, and even the Pater faction felt fear looking at her.\nIt was the same for the natives invited to this speech.\nPeople who had heard about the time written in blood over the past few weeks only applauded cautiously, except for a very few.\n\nMisono Mika, having looked around at the gathered audience with satisfaction after ascending the podium, gave them her first greeting.\n\n\"Hello everyone☆\"\n\nEveryone's gaze was concentrated on the podium at the unexpectedly cheerful greeting. It was not a sight to be expected from the person responsible for the sudden disappearance of numerous students from the Tea Party and Trinity.\nIn confusion and fear, people continued to watch her.\n\n\"Ehe- is everyone scared of me? I'm not going to eat you, so you don't have to worry~?\"\n\nNevertheless, she didn't care at all, discarding the speech and continuing to talk casually while waving her hand.\n\n\"The reason I gathered you today is... for a kind of declaration, I guess? I felt I should at least let you know what I've been doing and why for the past few weeks-, weren't you surprised that faces you knew suddenly disappeared from around you? That's because they're all parasites-\"\n\"Para... sites..?\"\n\"Yeah, parasites. For the people living here, I guess they're like the Jews?\"\n\nThe Germans who heard that began to stir a bit.\nFor a brief moment, they saw in her the image of a figure Germany had lost.\n\n\"Of course- because they betrayed Trinity and gave opportunities to that Gehenna trash, didn't they?? Just for their own well-being. Nagi-chan is a friend I really like, but she was like the head of those parasites-\"\n\nMika struck the lectern.\n\n\"So I cut them out, all the stupid and useless things~, from now on I'm going to make the Tea Party work only for Trinity.\"\n\nAt the sound of the slam, the attention of the hall was concentrated once again. Mika smiled broadly at the people who were either breaking out in a cold sweat or swallowing dryly.\n\n\"So- I look forward to working with everyone?☆\""
 TRM_event.16.a: "Nothing exists against the State.\n- Benito Mussolini"
 
 TRM_event.17.t: "The Judgment" 
 TRM_event.17.desc: "Malice was visible.\nA hearing for just one person, to remove just one person from the stage.\nThe students and council members in the gallery poured that malice unsparingly onto Kirifuji Nagisa in the center of the hall.\n\n\"The reason current Trinity is in this situation is because of Kirifuji Nagisa's weakness!\"\n\"We resolutely reject a humiliating peace!\"\n\nThe entity pouring criticism onto Nagisa was the Pater faction.\nThe Filius and Sanctus factions also held their places according to precedent, but they no longer had any strength left.\nThe other two pillars of Trinity had lost their heads and were being mangled by Misono Mika.\n\nBut Nagisa was resolute.\nShe knew better than anyone that all results had already been decided before she even entered this place.\nTherefore, she opened her lips to end this boring play with her usual attitude.\n\n\"I'm sorry, but I think it's best to end the hearing here\"\n\"Witness, do you not see that the floor is currently being held?\"\n\"But isn't the ending already decided?\"\n\nShe stood up from her seat, turned around, and looked at the end of the long hallway.\nBright light was streaming through the stained glass above the door.\nIt was now time for the actor to exit.\n\n\"I think I should leave first, as I have to look over the new room I'll be staying in. I wish you all peace.\"\n\nShe slowly headed for the door with a much lighter smile. It was warm sunlight and a slight breeze, not people, that saw Nagisa off."
 TRM_event.17.a: "An angel has fallen."
 
 TRM_event.18.t: "The Fall" 
 TRM_event.18.desc: "Something was clearly wrong.\nAt least the party involved in this situation thought so.\nA half-day ago, she was imagining herself rising high under Trinity's new sun.\nBut now she was being taken somewhere, her arms held by the Tea Party's private soldiers.\n\nIn the darkness where not even a single moonlight shone, she busily worked her mind. Did Kirifuji Nagisa regain power in just one day? Or was it a coup by the Filius or Sanctus factions?\nThat couldn't be.\nHadn't they and the two factions been smashed to pieces by Mika-sama and our Pater?\n\nAnd the reality of the whole situation revealed itself a short while later.\nBecause the person sitting in the basement of the building she was taken to was Misono Mika herself, whom she served.\nOverwhelmed by embarrassment, she opened her lips toward Mika while being forced to her knees.\n\n\"Mi... Mika-sama...? There must be some mistake! Why am I, a member of Pater, here...\"\n\"Hmm? Who was it again~? Everyone's faces look so similar that I don't know-\"\n\nWith those words, hope disappeared from the face of the woman who had slumped down. To her, whose mind had collapsed from a situation that felt like a lie, falling to the very bottom in an instant, Misono Mika delivered the sentence.\n\n\"Hmm- She's a trivial, mold-like child~ Send her to the mines in the frontier-\"\n\nWith a single word from Mika, the woman who was once a key figure in the Pater faction disappeared into the cold, dark basement.\nThe new Student Council President turned the next page of the file she held in her hand.\nThere were still countless names there waiting for their turn."
 TRM_event.18.a: "The most trusted person is the one who should be suspected first. - Joseph Stalin"
 
 TRM_event.19.t: "The Empty Residence" 
 TRM_event.19.desc: "The man began to head toward the residence to report the atrocities of the Sturmabteilung, which have been becoming serious recently, and to check on the contacts that were not reaching him.\nThe man thought of the terrible atrocities of the Sturmabteilung, which have gone too far lately. They were following whatever National Socialist Party did, no matter what crazy things they did, just like dogs, because the party gave cool uniforms and power to those who hadn't received a shred of attention before.\nOn the streets, random bullets were being lodged in the heads of students who seemed related to Jews, and bloodstains were rampant, yet the Justice Task Force, which should have stopped this, was standing idly by.\n\nEveryone should know that this madness must be ended somehow. To do that, one must cope with it somehow.\n\nThe man finally arrived at the residence and opened the door.\n\nIn the residence, there were only rooms with papers fluttering on the floor and signs of resistance, broken and collapsed."
 TRM_event.19.a: "Where did they go?"
 
 TRM_event.20.t: "Hunting the Opposition"
 TRM_event.20.desc: "With Kirifuji Nagisa's authority completely stripped in Trinity, the Filius faction faced the risk of disintegration. They elected another representative to survive and also carried out operations to access Tea Party authority, but the Pater faction always neutralized their attempts.\n\nThe Filius faction finally decided to move by attacking them as a last resort and finished preparations after discussing the plan. On the day of the attack, the Filius faction began to march to attack the Pater faction.\n\nNot long after they began their march, they felt a sense of 'incongruity.' It was a street they always walked on, but today of all days, an ominous feeling haunted us. Ultimately unable to overcome the anxiety, an order to stop everyone was given. The feeling of being watched from deep within that forest path didn't go away, and I slowly headed toward that place.\n\nWas the anxiety reality? As I headed there, dozens of people ambushed us along with a whistle. The situation ended quickly, and we were subdued. Dozens of figures had known our plan beforehand and predicted where we would go. Feeling that fate had arrived, I threw my body into destiny."
 TRM_event.20.a: "Was it a mistake to let the information leak?"

 TRM_event.21.t: "Shifting Blame"
 TRM_event.21.desc: "She couldn't understand.\nMisono Mika, who put down her pen as if throwing it and stood up from the comfortable chair, couldn't understand it at all.\nOn the desk remained the speech manuscript that hadn't even properly started.\nWhy on earth did she have to be doing such a boring task?\n\nOver the past few days, the number of people she had cleared away was so large she couldn't even remember the exact count.\nThanks to that, there was no longer any organization left in Trinity to oppose her.\nIf she had to pick one, there would be the Sisterhood, but those religious people wouldn't even care about politics because of their old-fashioned traditions.\n\nSo this speech isn't needed either.\nBecause there wouldn't be anyone left to have complaints about the words she says and the things she does.\nIf anyone possessed even a bit of such a profane heart, that friend would instantly be dragged away to a place where they would never see sunlight again.\nBut nevertheless, the humans assisting her said a speech was necessary.\n\nIn a stifling mood, Mika came out of the office and walked through the old hallway.\nWhile thinking about whether she should throw the people who told her to write this speech deep into somewhere as well, she locked eyes with something at the end of the hallway.\n\nA frame containing the seemingly gentle, false smile of the other leader of Trinity, which hadn't been cleared away yet.\nLooking at that frame slightly unpleasantly, Mika soon thought of something and smiled."
 TRM_event.21.a: "Ah— That would work-"
 
 TRM_event.22.t: "Bloodstains"
 TRM_event.22.desc: "The activities of Trinity's Justice Task Force had taken good care of Trinity until now, but now they had no authority.\nThat is, even if they see students in black uniforms wandering around and taking away locals called Jews, the Justice Task Force could do nothing. It was the same for her, a regular member of the Justice Task Force.\nTo think they couldn't even stop those 'Sturmabteilung'—students who had been bullied or had no relationships with anyone in Trinity, now swaggering around in black uniforms—shooting bullets in the street.\n\n-Bang!\n\nAnother gunshot was heard near her.\n\nShe looked around.\n\nCorpses pierced by bullets and bloodstains were scattered on the street, and cleaning them up was all the task of the Justice Task Force members.\n\nShe slowly walked toward the corpse to clean it up, listening to the yelling of the Sturmabteilung."
 TRM_event.22.a: "Do they not know how to clean up?"

 TRM_event.23.t: "Suspicious Signs"
 TRM_event.23.desc: "-Bang!\n\nA gunshot rang out on the street. \n\n-Aie, it all splattered on my clothes.\n\nThe woman, holding a gun in one hand and making a disgusted face, kicked the corpse beneath her feet.\n\nWhat kind of wicked deed did that corpse do to die?\nThe answer was simple.\n\nIt was because the corpse was a Jew. In fact, this corpse hadn't done anything wicked to her.\n\n... Perhaps the crime was just wandering around without wearing a star.\n\nShe looked around again, searching for her next victim.\nThe woman then began to laugh.\nShe was happy.\nFor a student who had failed to build relationships with anyone and was bullied and excluded in Trinity, this power was truly sweet. \n\n-Clack clack clack!\n\nAt that moment, she sensed someone's presence behind her.\n\nShe quickly turned around, but no one was there."
 TRM_event.23.a: "Something definitely moved.."

 TRM_event.24.t: "Expansion of Authority"
 TRM_event.24.desc: "The issue of the authority of the Justice Task Force, which has the nominal names of Trinity's autonomous police and volunteer organization but in reality serves as a military organ and Trinity's Prefect Team, has been raised. What should be done?"
 TRM_event.24.c: "Giving them power may become an obstacle later."
 TRM_event.24.b: "Let's establish a new direct personal guard."

 TRM_event.25.t: "Agitation"
 TRM_event.25.desc: "Trinity's sole power, Misono Mika, stood on the prepared podium.\nContrary to the audience's expectation, who were looking at her with eyes mixed with anxiety, she appeared smiling like a child as always, playfully tapped the microphone placed in the center, and opened her lips in a cheerful and light tone.\n\n\"Ahaha— why does everyone have those expressions? It's like you all collectively ate something weird~☆, I understand~ You're flustered because Nagisa suddenly disappeared, right? But do you know I have a reason for everything too?\"\n\nWatching Mika giggle and swing one foot back and forth like a prankster, the audience showed various reactions.\nThe public's embarrassment caused by her unexpected appearance had naturally vanished.\n\n\"I mean, Trinity and even the whole of Kivotos have been swept into a crisis, haven't they? Because we got caught up in this nonsensical thing~☆, teleporting as a whole academy.. I've never even heard of such a weird story in manga~?\"\n\nIn a somewhat relaxed atmosphere, some people even showed a slight smile.\nBut the story that soon came from her lips stiffened everyone.\n\n\"But regarding the Student Councils that should control this situation.. honestly, aren't they stupid? Ah! Including our Trinity's Student Council, of course~, hostile people with looks we've never seen before... and the chaos caused by the changed situation around us.. But what did each academy's Student Council do?\"\n\"They only cared for themselves!\"\n\nAt her question, some in the audience shouted as if they had been waiting.\n\n\"Exactly— they did nothing and only looked after their own power and well-being, no one even thought of Kivotos or ordinary students. Some disgusting horned trash even went so far as to have a civil war? Throwing away their founding purpose of maintaining order just for some trivial pride-\"\n\"Dirty and useless devil bastards...!\"\n\"Disgusting Gehenna scum!!\"\n\nThe atmosphere of the hall began to overheat more and more.\nNo, the whole of Trinity listening to this broadcast over the radio began to be swept up in excitement.\n\n\"The General Student Council is the same, despite having received various considerations for the sake of Kivotos, they're just sucking their fingers doing nothing in this situation, aren't they? Isn't it super funny?\"\n\"Incompetent General Student Council!!\"\n\"We must dissolve the General Student Council!\"\n\nIt wasn't just Trinity.\nThe whole of Kivotos listening to this broadcast learned that the goal of Trinity's new single Student Council President was the whole of Kivotos.\n\n\"So I stand here on behalf of Trinity and all ordinary students of Kivotos, in the name of the Father, the Son, and the Holy Spirit... because only we, Trinity, can quell the current chaos\"\n\nWith those words, the broadcast ended amidst a scream of madness like a death rattle.\nEveryone in Kivotos felt it.\nThe wind of blood that would soon blow toward them."
 TRM_event.25.a: "Anger and hatred are the most powerful forces that electrify the masses."

 TRM_event.26.t: "End of Act I"
 TRM_event.26.desc: "The man who was once respected as one of the politicians no longer existed.\nHe witnessed from the closest position as unknown beings, claiming the Trinity as their identity, joined hands with the remaining dregs of National Socialism and swept across all of Germany.\nBanners advertising the tyrant's achievements and electronic displays, difficult to even imitate with original technology, covered Germany's long history and tradition, and the melodies of violins heard in cafes and theaters were buried and vanished by the trumpet sounds of propaganda broadcasts flowing from speakers that sprouted throughout the city.\nTherefore, he tightly locked the windows, drew the blackouts, and closed his ears.\nTo escape even slightly from the tragedy that would soon spread beyond Germany to the whole of Europe.\n\nBut today, noise of a different scale than usual invaded his dark and dust-covered space.\nCuriosity, which appeared between the fear and humiliation in his heart, commanded him to pull back the blackouts and open the windows, and he faithfully carried out the command.\nOn the street, people cheered at the march of the army crossing the city, displaying the new leader's portrait and the national flag.\nEveryone there sang of victory in one voice.\nThe sordid nightmare finally swallowed the whole of Europe.\n\nThe shabby old man, who had turned pale and backed away from the window, fell backward.\nHe didn't even feel the pain that his aged flesh screamed like a cry, covered by the despair and disgust flowing sharply through his nerves.\nThough he was an old man who felt relief for a very brief moment thinking that everything was finally over, as one who had dipped his feet deeply into the rough waves called politics, he knew better than anyone.\nThat a machine moving with hatred and anger does not stop until it destroys everything to exist for itself, and in the end, it will destroy itself while embracing everything.\n\"....It's not over yet.. It's not over yet...!\"\nThe long sigh of the old era quietly disappeared into the darkness."
 TRM_event.26.a: "Beginning of Act II"
 TRN_endsieg_event_tt: "§tKivotos has united as one under a powerful rule. While we don't know how long the reign of the Queen of Night will last, an endless darkness falls over everyone.§!"

 TRM_event.27.t: "Gehenna Degradation Movement"
 TRM_event.27.desc: "After Trinity won the war against Gehenna, according to Misono Mika's orders, Gehenna-style buildings were quickly blown up or reborn in Trinity's architectural style. In particular, the brilliant industry Gehenna had built up, overseen by Prefect Sora-saki Hina, was all stripped away and redeployed to Trinity.\n\nAdministrator Amau Ako could only watch this happen with her eyes open. Since they lost the war, there was nothing she could do. With Sora-saki Hina having fallen in the battle of central Gehenna, even her only hobby had disappeared. She hated Trinity. The invaders who invaded Gehenna, the ones who snatched happiness from her, but she had no power. Not a strong power like Prefect Sora-saki Hina.\n\n-KABOOM!\n\n\"Wahahaha! We blew it up refreshing!\"\n\nThe sound of laughter was heard along with a large explosion. The one who laughed probably laughed just because they were happy, but to her, it sounded like a sneer. The administrator eventually gave up. The hand that was holding onto hope.\n\nThe administrator, who had once led the brilliant development of Gehenna by leading a coup with righteous intent and had watched over the Prefect by her side, vanished into deep emptiness."
 TRM_event.27.a: "Leave no trace."

 TRM_event.28.t: "Anti-Soviet Pact"
 TRM_event.28.desc: "Through the Anti-Comintern Pact, [From.GetNameDef] has established a stable diplomatic background to cope with the threat of Red Winter. However, this pact did not include a military alliance and no clear obligations for the signatory countries were prescribed. [From.GetLeader] is seeking to expand the treaty into an anti-Red Winter coalition, agreeing that if any one signatory country enters a war with Red Winter, all will participate.\n\nThis is more dangerous and any diplomacy maintained with Red Winter so far will be severed, but it is also a good opportunity to secure powerful allies on our side in preparation for war."
 TRM_event.28.a: "We will stand against Red Winter together with Trinity and its allies."

 TRM_event.29.t: "The Collapse of Trinity"
 TRM_event.29.desc: "Oh, how the mighty have fallen! The tea is cold, the cake is stale, and the halos are flickering. It seems our grand experiment has met a rather... unfortunate end."
 TRM_event.29.a: "O Ancestors.."

 TRM_event.30.t: "Trinity's Ultimatum!"
 TRM_event.30.desc: "The content that if Trinity surrenders and becomes a puppet state, there will be no war between the two sides and a perpetual friendship treaty will be signed."
 TRM_event.30.a: "Get lost!"
 TRM_event.30.b: "I surrender, just let me live!"

 TRM_event.31.t: "[FIN.Getname] Rejected Our Demands"
 TRM_event.31.desc: "Those stubborn people in the north think they can just say 'no' to us? How rude! They clearly need a lesson in Trinity etiquette... and by etiquette, I mean superior firepower."
 TRM_event.31.a: "We must consider military intervention."

 TRM_event.32.t: "[FIN.Getname] Accepted Our Demands"

 TRM_event.34.t: "Late Night"
 TRM_event.34.desc: "Under the dark night sky, the silhouettes of Trinity's army quietly approached the Gehenna border. While the lights of the border post flickered faintly, tension hung in the air.\n\nSuddenly, Trinity's vanguard crossed the border. At that moment, a deafening explosion resounded, tearing through the quiet night air. As the sky brightened with sparks, Trinity's shelling began.\n\nThe Gehenna border guard instantly fell into chaos. Soldiers flustered by the unexpected surprise attack were ordered to retreat before they could respond. Gehenna forces began an orderly withdrawal amidst the pouring shells.\n\nBorder posts and defense facilities collapsed one by one. Trinity's tanks and infantry units advanced into Gehenna territory beyond the destroyed barriers. Gehenna forces continued to retreat and resist, but were pushed back deeper by Trinity's overwhelming firepower.\n\nThe prelude to war has begun. This night, which began with Trinity's surprise attack, became the signal for the start of a long war for both countries."
 TRM_event.34.a: "Charge!"

 TRM_event.35.t: "Processing Gehenna Territory"
 TRM_event.35.desc: "Winning the war with Gehenna, we began to discuss the post-war landscape."
 TRM_event.35.a: "A great victory!"

 TRM_event.36.t: "Propaganda Leaflet"
 TRM_event.36.desc: "Citizens of Gehenna!\n\nOur homeland is in crisis. Our peaceful lives are threatened by Trinity's illegal invasion. But we will never yield.\n\nThe history of Gehenna has always been a story of free students who overcame oppression. Now is the time for us to unite as one.\n\nThe strength of all citizens is needed to protect our freedom and sovereignty. Soldiers on the front line and civilians in the rear must fulfill their respective roles.\n\nTrinity underestimated our will. We will show them the true strength of Gehenna.\n\nFellow countrymen, let us rise for our land, families, and future! Let's overcome this crisis by uniting with the spirit of Gehenna!\n\nWe will surely be victorious. Long live Gehenna!"
 TRM_event.36.a: "Gehenna, be victorious!"

 TRM_event.38.t: "Specialization of the Trinity Industrial Development Department"
 TRM_event.38.desc: "The Trinity Industrial Development Department gained experience by implementing various experimental policies in its early days. These experiments repeated success and failure, and the lessons learned especially through failures became the foundation for increasing the expertise and proficiency of the Industrial Development Department.\n\nCurrently, the Industrial Development Department is seeking a new economic system by fusing the advantages of market economy and planned economy. The policy establishment and execution capabilities have greatly improved through early trial and error, and their expertise has now established itself as a core element of Trinity's economic development. The Industrial Development Department operates and controls companies based on a market economy system while establishing state-owned enterprises and experimenting with various economic policies. These attempts are achieving successful results and further developing Trinity's economic structure."
 TRM_event.38.a: "For today at least, let's toast for Trinity!"
 
 TRM_event.39.t: "The Choir"
 TRM_event.39.desc: "Mika began her speech in the magnificent hall. Her voice was filled with poisonous passion, starting with strong criticism toward Gehenna. Mika denounced Gehenna's corruption and incompetence while emphasizing Trinity's greatness.\n\n\"Gehenna is an academy built upon the suffering of students, using empty and pathetic acts of greed, corruption, and breach of promise as its foundation!\" At Mika's vitriol, the audience began to escalate.\n\nShe continued her words. \"We must stand against them. War with Gehenna is inevitable! Because the nature of those devil girls is evil!\" The audience reacted enthusiastically to Mika's words, and some even raised their hands in salute.\n\n\"We will be victorious, we will advance! The glory will continue!\" With Mika's final shout, the speech ended.\n\nSoon after, the Trinity Anthem resounded. First, a German stood up and began to sing, followed by a Justice Task Force girl, a girl in a nun's habit, and a man in uniform, who stood up one by one to sing.\n\n\"The Sturmabteilung marches with quiet but firm steps\"\n\"Comrades murdered by Gehenna devil girls and reactionaries\"\n\"Become souls and march together within our ranks\"\n\nIn an instant, the entire hall participated in the choir. Members of various organizations such as the Vigilante Corps, Justice Task Force, Relief Knights, and Sisterhood all stood up and sang passionately.\n\n\"Countless people look up at the great Trinity school flag with hope\"\n\"The day for freedom and bread approaches!\"\n\nEveryone's gaze was concentrated on Mika. Looking at the eyes filled with loyalty and affection toward her, Mika gave a deep smile. Her eyes held the conviction of victory along with strong will for Trinity's future."
 TRM_event.39.a: "Soon Trinity's flag will flutter on every street. Trinity will be eternal!"

 TRM_event.40.t: "Absorb Wehrmacht Remnants"
 TRM_event.40.desc: "A group of former Wehrmacht soldiers has approached us, offering their services in exchange for... well, not being homeless. They seem quite disciplined, though their choice of fashion is a bit dated."
 TRM_event.40.a: "I solemnly swear to God that I will render unconditional obedience to Misono Mika..."

 TRM_event.41.t: "Concerns about Frontline Stalemate"
 TRM_event.41.desc: "\"Secretary, report the war situation.\"\n\n\"Yes. A rather concerning situation is occurring now. Some plans have achieved success, but facing unexpected resistance, some plans are only partially successful or failing.\"\n\"Is that so..? If so, isn't there a way to break through this situation?\"\n\n\"I'm not sure yet...\"\n\nMisono Mika fell into thought as she listened to the secretary's words. She already knew that her plans weren't going smoothly recently, but receiving a direct report made the tension escalate further. The secretary was someone trusted by Misono Mika, and she believed the report would be accurate accordingly. However, the secretary's final words trailed off vaguely as if lacking confidence, and Misono Mika was bothered by that point.\n\n\"A concerning situation...\" Misono Mika muttered as she slowly walked around the room. Were there more failed plans? Or could the successful plans provide an opportunity for a turnaround? Various thoughts passed through her head.\n\nThe secretary bit her lip as if nervous. What was she hiding? Or was she anxious because she couldn't see a solution? Misono Mika put her hand on the secretary's shoulder and asked gently. \n\n\"You just don't know exactly what the problem is yet, right?\"\n\nThe secretary nodded, but there was frustration in her eyes. \"I am gathering more information, but a clear alternative hasn't been identified yet.\"\n\nMisono Mika was silent for a moment. She felt she shouldn't stay like this. Whatever the unexpected resistance was, a strategy to resolve this situation was needed.\n\n\"Then find out more. We don't have the luxury of failing.\""
 TRM_event.41.a: "Understood."

 TRM_event.42.t: "The End of Gehenna"
 TRM_event.42.desc: "One week after President [GEM.GetLeader] knelt and signed the surrender document, ending the Trinity-Gehenna War. A heavy shadow hung over the streets of central Gehenna. The vibrant central district, which had been decorated with the disorderly but pleasant deviations of students and a lively atmosphere, now stood stagnant with none of that atmosphere to be found. However, unlike Gehenna's gloomy atmosphere, the joy on the faces of the victorious Trinity students contrasted completely with Gehenna's bleak atmosphere.\n\nGehenna students, their faces etched with sadness unlike their usual cheerful expressions, navigated the city quietly like shadows. Unlike them, who were the original owners of this place but were now hiding like shadows, the sight of Trinity Defense Force soldiers marching through the streets was so, so bright.. They wore light gray uniforms and armbands with the symbol of Trinity's Pater faction. They were the undeniable victors. They enjoyed the joy of conquest according to the victor's undeniable right, and their cheers and loud laughter brought a sense of insult to the hearts of Gehenna students.\n\nThe beautiful terrace of Gehenna's famous dessert cafe, which was once bustling, was now completely empty except for a few members of the Gourmet Research Society or locals who didn't feel much about Gehenna's downfall. And among the Gourmet Research Society, one could especially catch a glimpse of the shattered dreams and lost hope that Gehenna students must be feeling. Even Haruna, who would usually talk on and on about gourmet this and that while blowing up the store, just sat there without saying a word, and Izumi tried to bring up various words to liven the mood but failed frequently. Discouraged conversations took place among the discouraged students, and their low, low voices were almost unheard, drowned out by the cheers of the soldiers."
 TRM_event.42_2.desc: "One week after Sora-saki Hina fell in the final battle of Gehenna and Administrator Amau Ako, who succeeded her, signed the surrender document, a heavy shadow hung over the streets of central Gehenna. The vibrant central district, which had been decorated with the disorderly but pleasant deviations of students and a lively atmosphere, now stood stagnant with none of that atmosphere to be found. However, unlike Gehenna's gloomy atmosphere, the joy on the faces of the victorious Trinity students contrasted completely with Gehenna's bleak atmosphere.\n\nGehenna students, their faces etched with sadness unlike their usual cheerful expressions, navigated the city quietly like shadows. Unlike them, who were the original owners of this place but were now hiding like shadows, the sight of Trinity Defense Force soldiers marching through the streets was so, so bright.. They wore light gray uniforms and armbands with the symbol of Trinity's Pater faction. They were the undeniable victors. They enjoyed the joy of conquest according to the victor's undeniable right, and their cheers and loud laughter brought a sense of insult to the hearts of Gehenna students.\n\nThe beautiful terrace of Gehenna's famous dessert cafe, which was once bustling, was now completely empty except for a few members of the Gourmet Research Society or locals who didn't feel much about Gehenna's downfall. And among the Gourmet Research Society, one could especially catch a glimpse of the shattered dreams and lost hope that Gehenna students must be feeling. Even Haruna, who would usually talk on and on about gourmet this and that while blowing up the store, just sat there without saying a word, and Izumi tried to bring up various words to liven the mood but failed frequently. Discouraged conversations took place among the discouraged students, and their low, low voices were almost unheard, drowned out by the cheers of the soldiers."
 TRM_event.42.a: "Endless fall."
 TRM_event.42.b: "Honor was kept."

 TRM_event.43.t: "Appointment of Minister of Economy"
 TRM_event.43.desc: "It seemed that Hjalmar Schacht's life could not really go smoothly. Just as he had devoted himself to somehow reviving the German economy, heavens, the whole country had been turned upside down. And in the place where Germany had been, an academy for girls was situated.\n\nThinking that he would just become forgotten local #1, Schacht didn't even imagine that the leader of Trinity (he decided to just call it a country since it was enough to be called one) would call him in.\n\nSchacht's impression of directly meeting Misono Mika (Schacht found it interesting that she used a Japanese name but the language she used wasn't Japanese) was that she was quite well-versed in economy, which was a good point. That fellow Hitler didn't know a thing about economy.\n\nTo be honest, Schacht couldn't help but be enticed by Mika's offer. He was an economic expert, and various new devices of Trinity had piqued his curiosity. On the way here, seeing the sight of the capital Eden, thoughts like 'It seems they use Yen here, so is the economic policy similar to Japan?' 'I have no sense of the price level here, how would it be compared to our Germany?' 'Everyone is practically a student, so how do they conduct economic activities?' had been occurring in Schacht's mind.\n\nHe knew that Misono Mika had, of course, accepted the Nazi Party's ideology. But did that matter? Schacht guessed that the pink-haired girl was a much better person than Hitler. If only for the single fact that she listened to the economic policies he prattled on about without any rebuttal, Mika's score in Schacht's heart had already easily exceeded 100 points.\n\nWhen Schacht regained his senses, he was wearing a uniform."
 TRM_event.43.a: "Minister of Economy, Hjalmar Schacht."

 TRM_event.44.t: "The Great Negotiation" # 선전물 배포
 TRM_event.44.desc: "The patriotic film [The Great Negotiation], newly made by director Leni Riefenstahl, is causing a craze among Trinity citizens.\n\n[The Great Negotiation] is set roughly 300 years ago during the 1st Council that became the origin of Trinity Comprehensive Academy, held by the Pater, Filius, and Sanctus factions to mediate disputes. It tells the story of 'Fuko,' a soldier of the Pater faction who fights to protect justice against the other two evil factions and goes through various events. It received high praise for naturally capturing the evil of Gehenna and the righteousness of the Pater faction on film, and in the final scene, when the Pater faction is placed in an unfavorable position in negotiations due to the trickery of the other two factions and the despairing appearance of Fuko appears, the entire audience in the cinema shed tears and trembled at the evil of the two factions.\n\nHowever, after that scene, when President Mika's inauguration speech was screened on the screen, everyone in the hall was moved by Mika-sama's grace in avenging the humiliation of 300 years ago, shedding tears and standing up to sing 'The Song of Trinity.'\n\nPresident Mika highly praised director Leni Riefenstahl's hard work and requested her to 'continue creating many works in the future.'"
 TRM_event.44.a: "That woman makes good movies!"

 TRM_event.45.t: "Trinity Propaganda Leaflet No. 112" # 선전물 배포
 TRM_event.45.desc: "It is President Mika who has made us live the best in the 300-year history of Trinity,\nand it is also Mika-sama who has made Trinity and the Germans proud.\n- A proud academy that exceeded this year's target for Kivotos' 2nd highest tactical BD performance rate by 300 percent.\n- An academy with the 2nd strongest club (Justice Task Force) in Kivotos.\n- The most pure-blooded academy in Kivotos.\n- President Mika who made Trinity students stand the tallest in the world.\n- Compared to [GEM.GetLeader], she is incomparably clean, diligent, and upright, leading us Germans who are heartbroken over the loss of Trinity Academy and the Führer.\n\nGreat Trinity students and Germans deeply respect Mika-sama, who struggles all her life for the glory of the academy and the Germans, and will show a lesson to the Gehenna devil girls who commit political oppression and even things that can no longer be spoken of.\n\nRise, students of Trinity!"
 TRM_event.45.a: "It's Total War!"

 TRM_event.46.t: "Great Trinity Defense Force" # 선전물 배포
 TRN_event.46.desc: "If the Gehenna devil girls light the fire of war, we will mercilessly devastate Gehenna before President [GEM.GetLeader] even has time to sign the surrender document.\nEveryone, immediately enlist in the proud Trinity Defense Force,\nand protect our homes, families, and territory under the leadership of our President Mika!\nLet's step forward to hasten victory with the traditional war spirit of Trinity and Germany.\nUntil the day the whole of Kivotos firmly unites under the proud flag of Trinity\nand praises the greatness of Mika-sama!\nEnlist in the proud Defense Force and further accelerate the advance of the National Socialist revolution!"
 TRM_event.46.a: "Toward higher places!"
 
 TRM_event.47.t: "Loyal Gehennans"
 TRM_event.47.desc: "To the righteous Gehennans who cross over to our Trinity with a righteous heart to follow Great President Mika instead of President [GEM.GetLeader]\n- Guaranteeing rights and freedom of a Trinity student\n- Granting the Iron Cross and livelihood allowance\n- Arranging jobs and workplaces\n- Raising racial grade to Grade 2\n- Issuing exception rights for future 'processing'\n- Granting 10,000 yen livelihood allowance\n\nConditions:\nMust have no records of activity in Gehenna Prefect Team, Pandemonium, etc.\nMust respond to all instructions from the Trinity Defense Force\nPossession of all firearms is prohibited for life\nMust pass an exam after carefully reading the writings of Great President Mika"
 TRM_event.47.a: "Trinity Defense Committee"

 TRM_event.48.t: "Trinity's Pressure for Anschluss"
 TRM_event.48.desc: "Civil unrest and acts of violence are occurring in various places as protesters express their desire to unite with the Germans of Shanhaijing and Trinity. Eden is strongly demanding the annexation of Shanhaijing."
 TRM_event.48.a: "We must become one with Trinity!"
 TRM_event.48.b: "No, Shanhaijing's fate lies elsewhere."

 TRM_event.50.t: "Annexation (Anschluss)"
 TRM_event.50.desc: "The repeated uprisings in Shanhaijing clearly show that they want to be one with our country. Now is the time to act and make their will clearly revealed."
 TRM_event.50.a: "Who dares to say Austria is not Germany!?"

 TRM_event.51.t: "Shanhaijing Refused Annexation!"
 TRM_event.51.desc: "The fools in the Shanhaijing Central Special District have refused to accept the merger of our two countries! This is a blatant disregard for the will of the Austrian people and is an intolerable act! We may have to implement annexation even by mobilizing military means."
 TRM_event.51.a: "We must consider military intervention."
 
 TRM_event.52.t: "[From.GetNameDefCap] Demands Sudetenland"
 TRM_event.52.desc: "In this situation, Trinity is demanding the Sudetenland territory from us under the pretext of \"protecting the German residents\" in this region.\n\nThey have determined very clearly that in this situation, there will be no negotiation or diplomacy. They will either have the Sudetenland or go to war for it."

 TRM_event.49.t: "Kozeki Ui"
 TRM_event.49.desc: "\"Eh, m-me? Really?\"\n\nA girl with tired-looking eyes and messy purple hair, 'Kozeki Ui,' spoke up tremblingly before Mika.\n\n\"That's right~~ Ui-chan is always shut up in the Library and doesn't play with other kids! You're smart! I think you'll know a lot about economics!\"\n\n\"Why, why would you, appoint me as the Minister of Economy, and... what do you want me to do...?\"\n\n\"It's simple! Just manage the economy appropriately by looking at reports with the economic knowledge you know from looking at old books!\"\n\n\"The, the explanation is too vagueeeee....\"\n\nUi was still sitting trembling before Mika. It was natural; who could not fear the 'Queen of Night' who purged everyone and sat on the throne?\n\n\"Ehe~ then I'll give Ui-chan some motivation! Do your best! Fight! Do your best! Fi-ight~~!\"\n\n\"I, I feel a little bit... like I'm getting motivated... or maybe not...\"\n\nEven though Mika acted absurdly, Ui didn't give a definitive answer, causing Mika's expression to stiffen. Seeing Mika's expression, Ui gasped and trembled, and Mika, with a stiff face, pointed the gun hidden in her skirt at Ui's head.\n\n\"Hi... hiiiieee... Mi-Mika-sama... p-please, save meeeee....\"\n\n\"Ui-chan, shall we stop the wordplay now? This gun, you see, is modified, so it could blow a hole in Ui-chan's head. So don't provoke me any further....\"\n\n\"Ye-ees... I'll do it... I'll do it....!\"\n\nWhen Ui finally gave a definitive answer, Mika's stiff expression softened and returned to her usual self with chilling speed.\n\n\"Good, Ui-chan, then I'll see you tomorrow, Minister Ui~~~!\"\n\nMika left the room first, and Ui slumped down, breaking into a cold sweat.\n\nShe really wanted to go back to the Library, her comfortable home."
 TRM_event.49.a: "Economist, Kozeki Ui."

 TRM_event.53.t: "Trinity Demands Denmark!"
 TRM_event.53.desc: "Trinity has finally gone mad. - [ROOT.GetLeader]"
 TRM_event.53.a: "Of course we must refuse."

 TRM_event.54.t: "[From.GetNameDefCap] Refused to Cede Sudetenland"
 TRM_event.54.desc: "The refusal of [From.GetLeader], the leader of [From.GetAdjective], to all of [Root.GetAdjective]'s demands was a foolish diplomatic activity!\n\nThey will not cede the Sudetenland and were even thinking of going to war, mocking the desire to protect [Root.GetAdjective]'s brothers and sisters."
 TRM_event.54.b: "New Jerusalem"

 TRM_event.55.t: "$germany.124.t$"
 TRM_event.55.desc: "$germany.124.d$"
 TRM_event.55.a: "For Trinity and all the students!"

 TRM_event.56.t: "Delicious Cake!"
 TRM_event.56.desc: "The After-School Dessert Club found a delicious cake!"
 TRM_event.56.a: "It's delicious!"

 TRM_event.57.t: "Cold Ice Cream!"
 TRM_event.57.desc: "The After-School Dessert Club made cold ice cream!"
 TRM_event.57.a: "It's cold!"

 TRM_event.58.t: "Crush Arius"
 TRM_event.58.desc: "Under our fierce attack, the Arius Satellite School has been crushed and become a place where only our flags flutter. But news that their elite, the Arius Squad, have been arrested has not yet arrived. Therefore, only one choice exists for us. We must declare them a dangerous organization and crush them."
 TRM_event.58.a: "Those words are correct."
 TRM_arius_problem_idea: "Fear of the Arius Squad"
 TRM_arius_problem_idea_desc: "Trinity students have realized that the Arius Squad is not just a group, but an organized terrorist organization. They now feel their safety is seriously threatened, and due to this, trust in the government is also significantly shaken. Anxiety is gradually growing, and as the thought of not being protected deepens, distrust toward the government is slowly spreading among students."

 TRM_event.59.t: "The Raid"
 TRM_event.59.desc: "\"Are you sure it's here?\"\n\n\"Yes, that's right. According to the information I've confirmed...\"\n\nTwo men wearing black clothes and masks, and holding guns a bit large to be called pistols, were having a conversation in front of a palace-like house. They came in the middle of this late night to attack Yurizono Seia.\n\n\"Phew... If we just open this door, that woman is there?\"\n\n\"Yes... that's right. But is it really possible with this gun? Ah, didn't we see it before? Those girls with halos on their heads, even if you shoot them with a gun, it just hurts like being hit by a pea shooter.\"\n\n\"Aie, I don't know either. The broker clearly said they die, so they'll probably die.\"\n\n\"No, still, isn't it too dangerous..? It's a broker I've never seen before, he could have sent us to kill us.\"\n\n\"What are you talking about? Stop complaining and just pick the lock quickly.\"\n\nClick. Click-clack.\n\nThe man quickly unlocked the door with fairly good skill, quietly entered, and searched the whole room. Not many minutes after starting the search, the two saw someone sleeping soundly in bed. One man signaled the other to follow quietly, and they could instinctively tell they had found the woman.\n\nThe two began to pull their triggers indiscriminately at her, and as soon as they emptied a magazine, the men quickly began to flee.\n\nWas it because the gunshots were too loud? A short while later, the Relief Knights arrived at the scene."
 TRM_event.59.a: "..."

 TRM_event.60.t: "Field Investigation"
 TRM_event.60.desc: "The investigation process proceeded smoothly. The fact that they threw away their pistols and fled. Items used in the process of forceful intrusion were also at the scene. The Relief Knights submitted a report that they had recovered the body, but there were many questionable points.\n\nKirifuji Nagisa thought. 'Who is the culprit?' Terrorism by people opposing Trinity? Or a student who attacked a Tea Party executive taking advantage of the opportunity..? Or... Mika..?\n\n\"Bang\"\n\nEven striking the desk hard, the smile of a woman did not disappear from Kirifuji Nagisa's mind."
 TRM_event.60.a: "..."

 TRM_event.61.t: "Tracking the Path"
 TRM_event.61.desc: "The Relief Knights settled the situation and the investigation agency entered and investigated the scene to roughly understand their movements. And one of the investigators proposed a hypothesis.\n\n\"In my view, they likely climbed over this wall.\"\n\n\"Why is that?\"\n\n\"If you look here, there's a slight trace. But this trace didn't occur naturally, it's presumed that the culprits left these marks while frantically trying to climb this wall.\"\n\n\"So you mean we just need to search this area?\"\n\n\"Probably... I'm not fully certain either. They're more professional than I thought.\"\n\n\"Well understood. I'll report it well.\""
 TRM_event.61.a: "\"And be careful. Given the state of affairs.\""

 TRM_event.62.t: "Arresting the Culprits"
 TRM_event.62.desc: "The two men, taken to a secluded location, looked servilely at the members of the Justice Task Force and begged.\n\n\"That... we didn't do it on purpose. We lost our parents when we were young... and have lived in poverty..!\"\n\nHasumi sighed while looking at these two men.\n\nHasumi stopped those thoughts and began to question the two men.\n\n\"Who ordered it? I'd like you to tell me.\"\nHasumi smiled slightly while looking at them.\n\nAfter a bit of time passed, the appearance of the two men was wretched. Hanging upside down, their clothes were all torn except for their underwear, and their whole bodies were covered in bruises.\n\n\"Save!.. kek.. save!.. kek!\"\nSeeing that their breath was failing, Hasumi gave an order. Justice Task Force members began to untie the ropes, and by Hasumi's order, the two men were released from the ropes. Afterward, they began to tell everything they had heard.\n\n\"..Is that so.\"\n\nAfter the talk ended, Hasumi pondered for a moment. Could such pathetic humans have really killed Seia, a member of the Tea Party? Had they picked the wrong criminal? While continuing to ponder, one man opened his lips.\n\n\"W-we... s-said everything.. P-please, just let us live!\"\n\nFor some reason, the moment Hasumi heard those words, her mercy vanished. She then kicked back the desk and stood up, heading toward where the firearms were. A quick-witted man saw that and began to beg profusely, but he couldn't stop Hasumi from heading to the firearms.\n\n\"Thank you for the information... but. I really hate those who have no sense.\"\n\nBang!- "
 TRM_event.62.a: "\"Tsurugi. I've found the culprits.\""

 TRM_event.63.t: "Arresting the Mastermind"
 TRM_event.63.desc: "When they went to the place mentioned by the culprits, a man was smoking a cigarette in a back alley. Hasumi directly went to the man and started speaking.\n\n\"Is it you?\"\nHasumi boldly spoke her first words.\n\n\"What's with you. What are you here for?\"\nThe man flinched a bit due to the woman he'd never seen before and her large build, but soon tried to regain his composure.\n\n\"I'll ask bluntly. You know these men, don't you?\"\n\n\"Tch, how would I know.\"\n\n"
 TRM_event.63.a: "Making him open his mouth is simple."

 TRM_event.65.t: "Dead End"
 TRM_event.65.desc: "At the end of a dark and gloomy alley, someone's groan of pain echoed.\nThe man who struggled to flee from fear and anger was eventually cornered, and Justice in the form of an angel with black wings slowly approached him.\n\n\"Damn it...! What do you want! I'll give you everything I can, so please just leave me alone!\"\n\nThe broker who plotted the attack on the one who leads the Sanctus faction shrieked in a voice filled with spite as he rolled on the floor after being kicked by her boot.\nBut she just stood there and sneered at the man despite his desperate cries.\n\n\"I want nothing from you, but there are those who want you.\"\n\n\"Why on earth are you doing this much? What's your purpose!!\"\n\nThe man couldn't understand why she and the Justice Task Force were so persistently obsessed.\nHe had done this kind of work for years, but no law enforcement agency had ever tracked him so persistently.\n\nDespite his confusion from a situation he had never experienced, Hasumi stepped on the man's chest with the heel of one boot.\nPainful struggling and screams spread louder, but without being swayed in the slightest, Hasumi answered the final question of this poor man who would soon be burned by hellfire.\n\n\"Our purpose? Would knowing that change anything for you? Your end was decided from the moment you harbored impure intentions toward the Tea Party in that shallow chest of yours.\"\n\nAnd then she aimed at his head with the butt of her gun...\n\n\"The principles of the Justice Task Force are simple. For Trinity, and for the Tea Party.\"\n\nThe man could not hear the words after that."
 TRM_event.65.a: "\"We do not forgive the injustice before our eyes.\""

 TRM_event.64.t: "The Hounds"
 TRM_event.64.desc: "Beside the unrecognizable body of the man who once went by the title of broker, four black-clad female students spread out a map.\nAt the end of intense torture, they were able to find several others involved in this case through the broker's mouth.\nHaving captured them secretly and swiftly, the Justice Task Force learned that all arrows pointed to one person.\n\n\"Reinhard Heydrich, a Lieutenant General in the SS and the first head of the SD-Ausland, Amt VI of the RSHA. He's been missing with his family since Trinity appeared in its current location.\"\n\"He was a faithful dog of a criminal regime.\"\n\nWhile listening to Ichika's explanation, Hanekawa Hasumi slowly ran her hand over the map with an expressionless face.\nThe hand stroking the map soon stopped, pointing to a deep place in the Schwarzwald.\n\n\"And this person is the likely mastermind of the Yurizono Seia shooting incident.\"\n\"So we must catch him and make him pay the price, as the crime of attacking the Tea Party is by no means light\"\n\nWith those words, Hasumi looked at the three people before her.\nIchika, who oversees the very front line of the Justice Task Force, and Mashiro, an action-oriented sniper who would do anything for justice.\nAnd Kenzaki Tsurugi, the president of the Justice Task Force and Trinity's undisputed strategic weapon.\nThere was no need to worry about the personnel for this operation.\n\n\"Moving members on a large scale might lead to being discovered by the opponent. So it's best to proceed with the usual two.\"\n\"Understood.\"\n\"I'll have it ready.\"\n\"Don't kill him, we have to make him pay the price for his sins while alive... slowly and painfully, even if he's barely breathing, so keep that in mind\"\n\"Kihihihit.... Kehehehehet!!!!!!\"\n\nA chilling laughter filled the dark room shortly after.\nAnd within that laughter, the other three also showed smiles full of expectation.\nThe four female students were looking forward to it."
 TRM_event.64.a: "To hear how that man will scream"
 
 TRM_event.66.t: "Götterdämmerung"
 TRM_event.66.desc: "The Black Forest burned red.\nThe car prepared for the escape was shattered by a single bullet. \nSoon after, even the front exterior wall of the wooden building was shattered by a single charge from some dark red entity.\n\nThe man, who once dreamed of purifying the Fatherland and dealing with the filth that sickened Great Germany, could not understand the situation before him.\nWhat was before him was a dark red horror, a living disaster, a death in the form of a fallen angel—anything would fit.\nThe entity that suddenly appeared, covered in the debris of the wall and human blood, approached him while turning everything around into flesh and dust.\n\nIt approached me and reached out its hand.\nSetting down the two guns used as tools of punishment, it grabbed both my arms and pulled them off without hesitation.\nWithout even time to scream, it began to pummel his body while laughing madly.\n\nIn his fading consciousness, he saw.\nIt was dragging him out of the villa.\nLike an angel who came to save him from the burning house, it took him into the light.\nAnd he heard.\nIts island-like, thrillingly ecstatic laughter that seemed to tear his ears and even his mind."
 TRM_event.66.a: "The demon was struck down by the Angel of Death"

 TRN_Nomore_Heydrich_tt: "§YHeydrich§! Deceased?"
 TRM_lets_go_kill_Heydrich: "§LUnlocks the plan against the mastermind behind the Yurizono Seia shooting incident.§!"

 TRM_event.67.t: "Revealed Darkness"
 TRM_event.67.desc: "\"That's enough.. Let her in.\"\n\nIn the heavy air, Kirifuji Nagisa of the Tea Party ordered toward the door.\nImmediately, the heavily closed door opened, and behind the powerless backs of the two guards who had lowered their muzzles, she entered in a bright appearance.\nMisono Mika, an executive of the Tea Party and friend of Kirifuji Nagisa and Yurizono Seia, head of the Pater faction, and Trinity's highest military power.\n....At the same time, the usurper who came to betray Nagisa and Seia and take all power.\n\nDespite the desperate pressure everyone there was feeling, Mika sat lightly opposite Nagisa as if nothing were wrong.\nAnd as if no one in the room were a threat to her, she leaned her gun on the table and looked around the room like an innocent child.\nNagisa was the one who broke the silence.\nShe slowly set down the teacup she was drinking from and spoke first.\n\n\"...What are you looking at so much? It's not the first time you've entered this room\"\n\"Umm- I wanted to make sure it was well-ingrained in my eyes? Since it's a room only I will use from now on-\"\n\nDespite the clearly hostile remark, no such sign could be found in Mika's voice.\nNagisa, her eyes closed tightly, sat there and uttered words close to a sigh.\n\n\"...I didn't know you would go this far.... Deep in my heart, I trusted you Mika... I hoped you wouldn't open that door....\"\n\"Ehe- Shall we stop saying things we don't mean? Nagi-chan never trusts anyone else-\"\n\"...Why? Why did you cause all this?\"\n\"You're asking me that? When you know best yourself-\"\n\nIn Mika's mockery-filled remark, Nagisa looked up at Mika with her eyes half-open.\n\n\"Nagi-chan's weakness ruined everything-, it's solely Nagi-chan's fault that everyone was disappointed and I had to go this far, you know that right?\"\n\nIt was then that the smile disappeared from the face of Mika, who was still smiling as if looking at a friend.\nAt Mika's single clap, her private soldiers who had been waiting outside entered and grabbed Nagisa.\nOutside the door, the two guards who had remained loyal to Nagisa until the end were bleeding cold blood with holes in their heads.\nAfter taking that sight in, Nagisa left a final greeting to Mika.\n\n\"....The fires of hell are waiting for you, Mika\""
 TRM_event.67.a: "\"Yeah... I know too, Nagisa\""

 TRM_event.68.t: "Surrender of the Soviet Union"
 TRM_event.68.desc: "Early this morning, a declaration of unconditional surrender from the Soviet Union arrived here in Eden. Misono Mika and her leadership expected it to be someone's fabricated play or one of the Soviet's diversionary tactics, but the letter was found to be true as soldiers of the Red Army hoisted white flags and surrendered on all fronts.\n\nAccording to the predictions of Trinity military experts, it's presumed that Soviet officers led a coup at the end of continuous defeats."
 TRM_event.68.a: "A great victory!"
 TRM_event.68.b: "No? We will be satisfied with a total victory!"

 TRM_event.69.t: "Do you speak Japanese? (日本語は可能ですか？)"
 TRM_event.69.desc: "はい、私は日本語を話します。(Yes, I speak Japanese.)\n\nIf so, do you speak Chinese? (如果是的話，你會說中文嗎？)\n\n是的，中文也可以。(Yes, Chinese is also possible.)\n\nIf so, finally, do you speak Russian? (Итак, наконец, вы говорите по-русски?)\n\nДа, это возможно.(Yes, it is possible.)"
 TRM_event.69.a: "よろしくお願いします! (Nice to meet you!)"
 TRM_event_69_tt: "§YA Holy Mandate is established in occupied territories.§!"
 TRM_event.69.b: "Nice to meet you!"

 TRM_event.70.t: "The Ruined Home"
 TRM_event.70.desc: "Having lost the Great Patriotic War, we have lost all western territory and have been pushed into a frontier nation that cannot even function properly. Control of the Far East was lost long ago, and we are barely maintaining Central Siberia and Central Asia. The ideals of the great revolutionaries have collapsed."
 TRM_event.70.a: "..."
 TRM_event_70_tt: "§gThe steel has broken, but the fragments remain.§!"

 TRM_event.71.t: "Disintegration of the Sanctus Faction"
 TRM_event.71_2.t: "Vanished Faction"
 TRM_event.71.desc: "After the head of the faction, Yurizono Seia, was attacked, the Sanctus faction, which was fighting amongst itself, eventually failed to settle the chaos and disintegrated. Now the Sanctus faction can no longer exercise influence on the Tea Party."
 TRM_event.71_2.desc: "As the collapse of Trinity accelerated, the factions disintegrated or vanished somewhere."
 TRM_event.71.a: "..."

 TRM_event.72.t: "Election of the Host"
 TRM_event.72.desc: "Trinity has entered a new phase after going through the Great Migration and the emergency meeting. Much progress was made through the chaotic times, and now the emergency meeting has vanished into history. In its place, the head of the Sanctus faction, Yurizono Seia, has been inaugurated as the Host of the Tea Party, establishing a new order.\n\nAll of Trinity is filled with relief and joy. In squares everywhere, people are having festivals with drinks, and a sense of peace and hope blooms amidst the noise. However, behind this festival, dark shadows still linger. Communists and SS members are secretly plotting to seize power, but their influence is destined to soon vanish into the annals of history.\n\nLooking down from the sky, Eden looks as if it's sparkling like a mirage. It's because there are too many flags fluttering. Trinity's yellow flag is fluttering beside the flags of each faction. In the central square of Trinity, as the noise of thousands subsided, Yurizono Seia sat down as soon as she ascended the podium. Yurizono Seia did not waste time in placing her hat on her elbow and laying out Trinity's utopia. As the speech reached its end, Yurizono Seia declared the end of the weak old regime and declared that a new Trinity will succeed where the old regime failed. The gathered Tea Party executives cheered with shouts, and after a moment, the crowd followed. One word echoed through Trinity Square, Eden, and throughout the academy. It was Seia."
 TRM_event.72.a: "Long live the Mother Academy!"

 TRM_event.73.t: "Nuclear Fission"
 TRM_event.73.desc: "The country called Germany that existed in Trinity's territory was a country that had made great scientific progress. The phenomenon called nuclear fission, discovered during physics experiments led by Otto Hahn, Fritz Strassmann, and Lise Meitner, brought a great shock to the scientific world and at the same time achieved a great feat in physics. However, other scientists and Trinity's nuclear physicists have also been digging into the potential of nuclear power, and they all reached the same conclusion that nuclear power can be weaponized."
 TRM_event.73.a: "Trinity will utilize this."
 OTTOHAN_tt: "A §YNuclear Development§! focus tree will appear."
 TRM_event.73.b: "How laughable."

 TRM_event.74.t: "Next Student Council President"
 TRM_event.74.desc: "Now that all of Trinity's chaos has stopped, we must rectify Trinity's chaotic balance and appoint the next Student Council President to lead Trinity.\n\nNow that Nagisa's power has been restored, we can return the Student Council President position to Nagisa, or we can introduce an election system for the first time in Trinity's history, powered by the enthusiastic support of students."
 TRM_event.74.a: "The Tea Party is no longer the Student Council."
 TRM_event.74.b: "If not Nagisa, who will lead Trinity?"

 TRM_event.75.t: "The First Election"
 TRM_event.75.desc: "The first election has been held in Trinity. As candidates, the existing Student Council President and head of the Filius faction, Kirifuji Nagisa, and Ajitani Hifumi, who made a great contribution in this Pater expulsion, have come forward. A close race is expected as to who will become the next Student Council President of Trinity."
 TRM_event.75.a: "Nagisa has the leadership to lead Trinity."
 TRM_event.75.b: "Hifumi has proven her ability."

 TRM_event.76.t: "Visit of the Trinity Delegation"
 TRM_event.76.desc: "A message has been sent from Trinity to restore the Eden Treaty, which was effectively invalidated amidst the various chaos that occurred as Kivotos transitioned to another world."
 TRM_event.76.a: "Let's hear them out."
 TRM_event.76.b: "We cannot trust those fellows."

 TRM_event.77.t: "[FROM.GetName] Approved the Treaty"
 TRM_event.77.desc: "After various discussions, [FROM.GetName] has decided to support the Eden Treaty."
 TRM_event.77.a: "A first step toward peace"

 TRM_event.78.t: "[FROM.GetName] Expelled the Delegation"
 TRM_event.78.desc: "[FROM.GetName] has expelled our delegation and does not seem to have an attitude to engage in the Eden Treaty seriously."
 TRM_event.78.a: "Is it war in the end?"

 TRM_event.79.t: "Start of Trinity-Gehenna Talks"
 TRM_event.79.desc: "Gehenna Academy initially reacted coldly to Trinity's proposal for a grand compromise. However, after Trinity's continuous efforts, negotiations have finally begun.\n\nOn the day of the grand compromise, delegations from Trinity and Gehenna gathered at a negotiation site prepared on the border of the two countries. The delegations have now begun negotiations in a cold atmosphere, without sharing a single word."
 TRM_event.79.a: "I pray for an agreement between the two nations"

 TRM_event.80.t: "Agenda: Building a Gehenna-Dominant Power"
 TRM_event.80.desc: "The Eden Treaty made under Trinity's leadership may adversely affect Gehenna Academy. The initiative for the Eden Treaty must be held by our Gehenna Academy."
 TRM_event.80.a: "Submit this agenda"
 TRM_event.80.b: "This does not help the agreement."

 TRM_event.81.t: "Agenda: Economic Unification"
 TRM_event.81.desc: "Trinity Comprehensive Academy achieved rapid economic growth while Gehenna Academy was in chaos. Integrating the economy with Gehenna Academy will bring great benefit to Trinity's economic growth."

 TRM_event.82.t: "Agenda: Joint Military Operations"
 TRM_event.82.desc: "Gehenna Academy has the capability to conduct more powerful military operations than Trinity Academy. If the joint military operation agenda succeeds, Gehenna can bring great military advantage."

 TRM_event.83.t: "Agenda: Barrier against the East"
 TRM_event.83.desc: "Trinity Comprehensive Academy shares a border with threatening countries compared to Gehenna Academy. Trinity Comprehensive Academy must obtain support from Gehenna Academy even just to keep Poland and the Soviet Union in check."

 TRM_event.84.t: "Agenda: Rebuilding Gehenna"
 TRM_event.84.desc: "Gehenna Academy was swept into much chaos after the Great Migration. If Gehenna Academy cannot be rebuilt, the Eden Treaty Organization is likely to lose its meaning and fade away."

 TRM_event.85.t: "Agenda: Building a Gehenna-Dominant Power"
 TRM_event.85.desc: "Gehenna Academy has expressed antipathy toward the Eden Treaty Organization being framed around Trinity. If we accept this agenda, the initiative of the power bloc will be held by Gehenna Academy."
 TRM_event.85.a: "Accept."
 TRM_event.85.b: "Refuse."

 TRM_event.86.t: "Agenda: Economic Unification"
 TRM_event.86.desc: "Trinity Comprehensive Academy rapidly raised its lagging industrial base to a level similar to Gehenna Academy after various chaos occurred in Gehenna Academy. If we agree to this agenda, Trinity Comprehensive Academy will take a significant industrial advantage."

 TRM_event.87.t: "Agenda: Joint Military Operations"
 TRM_event.87.desc: "Gehenna Academy has superior military capabilities compared to Trinity Comprehensive Academy. If we agree to this agenda, Gehenna Academy will take a significant military advantage."

 TRM_event.88.t: "Agenda: Barrier against the East"
 TRM_event.88.desc: "Trinity Comprehensive Academy requested economic-military concessions from us on the grounds that there are many hostile countries adjacent to their border. If we agree to this agenda, we will have to support Trinity Comprehensive Academy with various goods."

 TRM_event.89.t: "Agenda: Rebuilding Gehenna"
 TRM_event.89.desc: "Gehenna Academy requested our support to overcome the various chaos that occurred in their academy. If we agree to this agenda, Gehenna Academy will receive various economic support."

 TRM_event.90.t: "[FROM.GetName] Accepted the Agenda"
 TRM_event.90.desc: "[FROM.GetName] has accepted the agenda we submitted for the Eden Treaty Organization. The Eden Treaty is being achieved successfully."
 TRM_event.90.a: "We've moved a step toward the Eden Treaty Organization"

 TRM_event.91.t: "Rejected Agenda"
 TRM_event.91.desc: "[FROM.GetName] opposed the agenda we submitted. Obstacles to the Eden Treaty are increasing."
 TRM_event.91.a: "This does not help the agreement"

 TRM_event.92.t: "Failure of the Eden Treaty"
 TRM_event.92.desc: "Despite long talks between the two countries, the grand compromise eventually ended in failure. The rift accumulated between Trinity and Gehenna seems very deep, and the Eden Treaty Organization has vanished into illusion."
 TRM_event.92.a: "Not good"

 TRM_event.93.t: "Formation of the Eden Treaty Organization"
 TRM_event.93.desc: "After long agreements between the two countries, the Eden Treaty Organization has officially launched. The Eden Treaty Organization seems to have succeeded in deriving various points of agreement beyond just adjusting disputes between Gehenna and Trinity, which is presumed to have a positive influence on Kivotos academies."
 TRM_event.93.a: "A beautiful fruit."

 TRM_event.94.t: "Submission, or Death"
 TRM_event.94.desc: "It was something that was bound to happen eventually now that Trinity Comprehensive Academy has learned our location. An ultimatum has arrived from Trinity Comprehensive Academy for the Arius Satellite School to submit."
 TRM_event.94.a: "The Arius Satellite School never submits."
 TRM_event.94.b: "The end of the final struggle."

 TRM_event.95.t: "Resistance of the Arius Satellite School"
 TRM_event.95.desc: "The Arius Satellite School refused the submission proposed by Trinity Comprehensive Academy, and accordingly, only an end will exist for the Arius Satellite School which refused Trinity Comprehensive Academy's mercy."
 TRM_event.95.a: "Prepare for battle."

 TRM_event.96.t: "Submission of the Arius Satellite School"
 TRM_event.96.desc: "The Arius Satellite School accepted our ultimatum demand, and accordingly, the Arius Satellite School has been officially incorporated under Trinity."
 TRM_event.96.a: "Good."

 TRM_event.97.t: "Meeting with the Prefect Team"
 TRM_event.97.desc: "Something about persuading the Prefect Team, and anyway, we dispatched a diplomat to integrate the Prefect Team."
 TRM_event.97.a: "The talk went well and the Prefect Team is with us"
 TRM_event.97.b: "The deal failed and the Prefect Team remained in Gehenna."

 TRM_event.98.t: "Anti-Comintern Pact"
 TRM_event.98.desc: "Trinity has proposed a treaty to respond to the Comintern's goal of spreading communism in the world even by entailing government subversion and violence. By signing this treaty, we agree to share information regarding the threat of communists and conduct close cooperation against such threats."

 TRM_event.104.t: "Reichskommissar of Moscow?"
 TRM_event.104.desc: "As the Holy Mandate of Moscow launched and military rule ended, great interest gathered on who would be the Reichskommissar. Opinions were narrowed down to two, and those two are Kirifuji Nagisa and Siegfried Kasche.\n\nSiegfried Kasche quickly processed Trinity's administrative tasks and is a servant who follows Trinity's orders well. He was judged suitable for performing the duties of Reichskommissar.\n\nKirifuji Nagisa is a person specially recruited by Misono Mika's order. Her political power is quite outstanding. Since before the Great Migration, she has taken the lead in diplomacy with other academies by highlighting Trinity's strengths. This political power explains why she should be the Reichskommissar of Moscow, and especially the fact that she was specially recruited by Misono Mika hinders Siegfried.\n\nA heated discussion is underway on which of these two will become the Reichskommissar of Moscow. Siegfried Kasche is loyal to Trinity, but no one knows how long that loyalty will last. If appointed as Reichskommissar of Moscow, he could transform the Moscow Holy Mandate into a 'kingdom' for Siegfried.\n\nHowever, Kirifuji Nagisa is also suspicious. There is sufficient motive for Kirifuji Nagisa to harbor a grudge during Misono Mika's coup process. There is a concern that if the red ghosts trapped in Siberia come toward Trinity, she could betray us and collude with them."
 TRM_event.104.a: "Kirifuji Nagisa"
 TRM_event.104.b: "Siegfried Kasche"

 TRM_event.3000.t: "Loss of Justification"
 TRM_event.3000.d: "It was learned that the Sanctum Tower, which managed everything in Kivotos, was deactivated due to the war, and the authority of the General Student Council President is needed to reactivate the Sanctum Tower. Eventually, it was decided to appoint one of Trinity's key figures as the General Student Council President to reactivate the Sanctum Tower, and two students were picked as candidates for the General Student Council President.\n\nAfter agonizing, one student was determined in the mind, and the name was slowly written down."
 TRM_event.3000.a: "...Ajitani Hifumi"
 TRM_event.3000.b: "...Urawa Hanako"
 TRM_event.3000.c: "Might is the justification"

 TRN_after_war_event.1.t: "Inflow of Capital"
 TRN_after_war_event.1.desc: "The cabinet meeting proceeded in a brighter atmosphere than ever before.\nParticipants tilted champagne glasses, and their leader also looked around at that sight with satisfaction.\nThe document on the desk stated that many German companies in occupied Gehenna territory are relocating their factories to Trinity.\nWas it because the investment and assimilation policies conducted by Mika and the Trinity leadership bore fruit?\nThe graph showed the development of Trinity's economy without fail, and this was surely their grand victory.\n\n\"It's only natural, isn't it~? Those Gehenna trash wouldn't even have the intelligence to stop such a thing ★\"\n\nNo matter who saw it, it was clearly a fair wind."
 TRN_after_war_event.1.a: "Quid pro quo (Everything has its price)"

 TRN_after_war_event.2.t: "Outflow of Capital"
 TRN_after_war_event.2.desc: "In the heavily falling darkness, the representative of the Ministry of Economy continued the presentation in a trembling voice.\nGerman companies have relocated their factories to Trinity.\nOne could dismiss it as just a few factories, but this was clearly a signal flare that the identity called Germany is passing over to Trinity.\nMost importantly, the Gehenna leadership completely failed to block such a movement.\n\n\"First... let's quickly prepare measures to block the capital outflow of the remaining companies.\"\nOne person said in the meeting room with a stiffened atmosphere.\nEven though the incident had already happened, they couldn't give up.\nThey had already come too far to fall into despair and put everything down."
 TRN_after_war_event.2.a: "It's late to lock the stable door after the horse is stolen, but we must try."

 TRN_after_war_event.16.t: "Industrial Boom"
 TRN_after_war_event.16.desc: "Now all reconstruction is finished. Johannes' mission is also over. Since all official missions of the Trinity reconstruction project are finished, Johannes and his team will also be disbanded.\n\nMany things happened. Johannes and his team members traveled all over the original territory doing construction work, and experiencing many things was natural.\n\nI remember when Johannes first arrived at the abandoned factory district with full will. Back then, his confidence really pierced the sky.\nThere were times they put in all kinds of effort to turn abandoned military factories into civilian factories, and when they thought they were going home after construction finished, they were suddenly given the mission to connect power lines. Right after finishing power construction, there was a time they went to do road construction in a minefield on the completely opposite side, and there was a time they entered a propaganda slogan contest and won a prize, and seeing that slogan written on posters wandering around the whole original territory made their face turn red with embarrassment, and there was even a time they dared to offer a direct advice to Mika-sama.\n\nJohannes thought fondly of the things that had now become memories. He was now wearing a suit, not a uniform and helmet.\n\nJohannes soon heard the train's whistle and walked inside the open train door. Now all work is truly finished, and with the joy of finally going home, he embraced numerous emotions.\n\nBrian, sitting in a stylish building in a giant factory district located in East Prussia, was having similar thoughts. The ruthless expropriation from him as a farmer since the days of the German Empire, the ruthless taxes, the time the whole family gathered and wailed together because they had no money and were picking weeds to eat...\n\nBut now Brian didn't have a thin body but a fairly well-managed chubby body, and he didn't have worn-out farmer's clothes but was wearing a stylish high-quality suit. And instead of hoeing the field as a farmer, he was looking at documents in the president's office. Brian suddenly looked out the window. And he watched his factory moving while emitting smoke endlessly and smiled.\n\nIn the office of the vast and wide capital of Trinity, Eden, a pink-haired girl with wings was also looking out the window. She looked down at the sight of Eden where smoke was rising and moving lively. In her eyes, a man and a woman smiling and a boy walking while holding their hands were seen. Misono Mika smiled faintly seeing that appearance. Although she is a puppet, even so, she felt pride that she had developed Trinity like this.\n\nShe tried to ignore the sight of white smoke puffing out from the Jewish concentration camp far away, and fell into watching the sight of the beautiful capital like an innocent girl."
 TRN_after_war_event.16.a: "Glory shall continue forever"


 # Arius Squad Problem
 TRN_opposition.1.t: "CIA Report: Joumae Saori"
 TRN_opposition.1.d: "\nDocument No: ABS-001050213\nSubject: Joumae Saori\nDate of Birth: Unknown\nPlace of Origin: Presumed to be Arius Satellite School district\nCareer: Arius Squad Leader (Current)\nLocation: Unknown\n\n- Introduction\nJoumae Saori is the leader of the Arius Squad, an independent minor military group of Arius, and has been continuously observed at several high-risk scenes related to Arius.\n\n- Main Body\nAccording to the judgment of the CIA Public Security Department, despite the rapidly changed situation, Joumae Saori is evaluated as a person who can pose a significant threat to Trinity.\nSince being witnessed at a collision scene half a year ago, her location is unclear, and all of Trinity's public security agencies are tracking her tracks, but the achievements are still lacking... (Omitted)"
 TRN_opposition.1.a: "Even though I walk through the valley of the shadow of death..."

 TRN_opposition.2.t: "CIA Report: Hakari Atsuko"
 TRN_opposition.2.d: "Date of Birth: Unknown\nPlace of Origin: Presumed to be Arius Satellite School district\nCareer: Substantial successor of the Arius Satellite School (Former)\n         Arius Squad member (Current)\nLocation: Unknown\n\n- Introduction\nHakari Atsuko is a member of the Arius Squad, and investigation results show she was the substantial successor with the bloodline of the Precept Guardian, the Student Council President of the Arius Satellite School, but seems to have been ousted for some reason and belonged to the Squad thereafter.\n\n- Main Body\nCurrently, her location is unclear, and the Intelligence Service judges her to be a person who can be a clear threat to Trinity's internal unity.\nShe is a person who can surely integrate the remnants of the Arius Satellite School, and accordingly, the authorities... (Omitted)"

 TRN_opposition.3.t: "CIA Report: Imashino Misaki"
 TRN_opposition.3.d: "Document No: ABS-001050232\nSubject: Imashino Misaki\nDate of Birth: Unknown\nPlace of Origin: Presumed to be Arius Satellite School district\nCareer: Arius Squad member (Current)\nLocation: Unknown\n\n- Introduction\nImashino Misaki is a member of the Arius Squad.\nAccording to several gathered testimonies and her appearance, she seems to have mental problems, and self-inflicted scars can be confirmed in some visual materials.\n\n- Main Body\nShe is actually active as the squad's action leader, and since she is the only one among the squad members to use heavy weapons, she has inflicted the most damage to Trinity authorities in previous collisions.\nAmong the Arius Squad, her location was most recently confirmed, and she was chased by military police in Dresden two weeks ago, but she fled through the Elbe River, so as of now, the exact location... (Omitted)"

 TRN_opposition.4.t: "CIA Report: Tsuchinaga Hiyori"
 TRN_opposition.4.d: "Document No: ABS-001050242\nSubject: Tsuchinaga Hiyori\nDate of Birth: Unknown\nPlace of Origin: Presumed to be Arius Satellite School district\nCareer: Arius Squad member (Current)\nLocation: Unknown\n\n- Introduction\nTsuchinaga Hiyori is a member of the Arius Squad.\nShe possesses outstanding sniping skills and is evaluated as the most important tactical asset of the squad along with her colleague Imashino Misaki.\nHowever, according to testimonies, there are significant problems in her sociability and her interpersonal relationships also seem poor.\n\n- Main Body\nCurrently, she is evaluated as the most dangerous target among the Arius Squad members being tracked.\nAt the time of her last sighting, she neutralized 3 military police vehicles chasing her with 1 shot each, resulting in numerous casualties... (Omitted)"

 TRN_opposition.200.t: "Suppression Terminated"
 TRN_opposition.200.d: "The search for key targets that pose a threat to our government's stability has finally ended. The Security Department has withdrawn from the case and is focusing on other urgent problems.\n\nWe hope their operations were not in vain and that the stability of our young administration is guaranteed."
 TRN_opposition.200.a: "I've done as much as I could."

 TRN_opposition.100.t: "New Rules of Engagement"
 TRN_opposition.100.d: "Our Security Department is still working hard to search for the opponent and is waiting for our instructions. If deemed necessary, we can order to change search tactics.\n\nFirst, we can capture targets intact and throw them into prison. If we keep them where we can constantly monitor them, they will no longer be a threat.\n\nSecond, we can order the Security Department to kill any opposition found. It's a simple and decisive solution.\n\nWhat would you like to do?"
 TRN_opposition.100.a: "Eradicate them completely. They would have done the same to us."
 TRN_opposition.100.b: "Perhaps prison will end their ambitions."
 TRN_opposition.100.c: "They are not needed within our borders."

 # Joumae Saori
 TRN_opposition.11.t: "Escape" # 탈출
 TRN_opposition.11.d: "Shaking off numerous anxieties, Saori crossed the river.\nIn the late night, amidst the slowly flowing water of the Danube River, the final gateway,\nSaori dreamed of the future that would come to her.\n\nSurely somewhere across the river, her precious people will be waiting for her.\nShe won't have to hide in the darkness anymore, and won't have to be afraid of violence and absurdity.\nShe will now be able to come out from the dark valley of death and live proudly.\n\nSoon she arrived at the riverbank on the opposite side and looked back.\nThe past that tormented her all her life, Arius and Trinity, and all those angers and despairs were now across the river.\n\nBut what was before her eyes as she looked back was just a plain gravel field.\nNo one was waiting for her, and a shining future was not seen either.\nWhat was seen in the distance was just a deeply sleeping quiet village and a peaceful forest.\nInto her chest, which until a moment ago had been stained with hope and passion, a more intense emptiness than ever before rushed in.\n\nShe laughed hollowly.\nOnly then could Saori realize the true meaning of a maxim left by a prophet she had always recited.\nThe world was beautiful and precious because it was vain."
 TRN_opposition.11.a: "So I commend the enjoyment of life, because there is nothing better for a person under the sun than to eat and drink and be glad"
 TRN_opposition.112.t: "Broken Fork"
 TRN_opposition.112.d: "\"....What is this?\"\n\nChecking the content of the telegram, Mika looked at the secretary with a smile as if she didn't understand the reason.\n\n\"After mobilizing so many people and even heavy equipment... you couldn't catch just one person?\"\n\nThe fork she was holding literally crumpled.\nSeeing that appearance, the secretary immediately bowed her head.\n\n\"I am truly sorry, President... I'll take measures so that a list of those responsible can be written...\"\n\"...Forget it, she alone won't be able to do anything anyway.. Instead, you can surely catch the remaining three, right?\"\n\nMika rested her chin on her hand with an expression as if nothing were wrong.\nSeeing that appearance, her secretary bowed once again and quickly escaped the place.\nMika looked at the fork that had not only bent but had stretched entirely, and threw it at the door the secretary had left through.\nWatching the fork fly quickly and lodge deeply into the door, she quietly watched that door with a dissatisfied expression for a moment."
 TRN_opposition.112.a: "...I don't like it"

 TRN_opposition.21.t: "The Prophet Says" # 사살
 TRN_opposition.21.d: "All her actions and will were only for protecting her most precious people.\nIt was a resolute determination that she would not give up these three even while yielding to the reality composed of killing intent and hatred.\n\nEven for her, the end eventually arrived.\nThe causality of the past, built up by yielding and compromising saying it couldn't be helped to protect only them, was now pointing muzzles at everyone in the squad, including herself.\n\nWhen the last casing was ejected from the chamber, numerous red lines composed of malice and resentment were aimed as if to bind her.\nUltimately, all her resistance was in vain.\nBefore the approaching fate, Joumae Saori closed her eyes."
 TRN_opposition.21.a: "Everything is vanity and vanity of vanities"
 TRN_opposition.212.t: "Useless End"
 TRN_opposition.212.d: "Mika's morning is always a bit later compared to other students.\nShe usually gets up at 9 and grooms herself with the help of attendants.\nSince she liked to decorate her wings or clothes splendidly, her closet always had ornaments she picked herself ready.\nMika, who finished grooming perfectly with the help of others, had breakfast and lunch at 11.\n\nBut that morning's leisurely time was interrupted by an uninvited guest.\nSince it was Mika who wanted to enjoy freedom at least in the morning, she looked at the secretary with a smile that slightly revealed her uncomfortable mood.\n\n\"Good morning, Secretary-san-☆, what's with this so early? There must be an important report, of course?\"\n\"...I am sorry for suddenly interrupting your breakfast, Mika-sama..\"\n\nThe secretary, who approached with a fast pace, handed the telegram to Mika after taking a moment to catch her breath.\n\n\nReading the content slowly, Mika showed one side of her mouth raised as if satisfied.\nThe most dangerous woman from Arius, Joumae Saori, has died.\nWhether it was the last struggle shown in a moment of crisis, the remaining trio of the Arius Squad were still missing, but what was certain was that they, who had lost their focal point, would never show their teeth to Trinity again.\n\n\"...But she didn't stop acting like a leader until the very end? Take only one picture of what's left, tear the rest up and throw it in the sea~☆\"\n\nLeaving the secretary who was leaving the room behind, Mika pricked a small raspberry with a fork.\nIt seemed today could be a really good day."
 TRN_opposition.212.a: "Beginning of a refreshing day"

 TRN_opposition.31.t: "Pride" # 체포
 TRN_opposition.31.d: "Joumae Saori resisted throughout her life.\nBut at the same time, she yielded to protect.\nShe was an existence that was always contradictory yet human.\n\nBut she believed.\nBecause everything in the world is vain, adults, academies, anger, and resentment will all eventually turn to dust.\n\nTherefore, she did not give up.\nThe squad all scattered, and she was running in the dark catacombs, but unlike always emphasizing that everything is vain, she harbored hope in her heart.\nArius has collapsed.\nThe current situation will be the last ordeal given to me.\nAt the end of this ordeal, there will surely be the freedom she wanted.\n\nBut the end of the darkness was not salvation.\nAs if reflecting all her weak yet cruel life, numerous lights blinded her.\nA moment later, she felt numerous hands grabbing her and dragging her back into the darkness.\nLiberation moved away from her forever."
 TRN_opposition.31.a: "...Wherefore I praised the dead which are already dead more than the living"
 TRN_opposition.312.t: "Wretched Life"
 TRN_opposition.312.d: "Reading the content, Mika burst out laughing in an unladylike manner while holding her stomach.\n\n\"Ahahahaha! That famous Joumae Saori couldn't even die herself and got caught? While acting all high and mighty as a leader?? It's really funny-\"\n\nAfter laughing heartily for a while like that, Mika added the treatment for Saori to the secretary who was watching her.\n\n\"First, don't treat her roughly, treat her well as if she's a distinguished guest—that'll be more miserable for her~\"\n\"Yes, I will deliver the message.\"\n\nAs the secretary bowed and left the room, Mika put a small sausage into her mouth.\nAnd while chewing it mmm-mmm, she imagined Saori's shabby appearance imprisoned in a camp.\nA giggle like a child filled the surroundings." 
 TRN_opposition.312.a: "How should I play with her"


 # Imashino Misaki
 TRN_opposition.12.t: "The Good Samaritan" # 탈출
 TRN_opposition.12.d: "Misaki lost consciousness and collapsed on the floor of a sewer filled with waste.\nCrossing the border by requesting a broker was good.\nBut as soon as they crossed the border, he sold her out.\nIn the end, Misaki had to run through maze-like alleys with all her might to avoid bullets.\n\nBecause she handed all her travel expenses to the broker, Misaki, who had become weakened from not even properly eating or drinking for days, could not move at all while collapsed.\nOnly then, thinking that the liberation she had so much desired had arrived, Misaki closed her eyes without resistance.\n\nBut Misaki did not enter the eternal sleep she wanted.\nWhen she opened her eyes after days, a group of orphans was before her.\nThey had found Misaki, washed her, treated her, and were sharing the little food they lacked even for themselves with her, who had been out of her senses.\nShe hurriedly left the place without even being able to say a proper goodbye due to strange feelings she was experiencing for the first time.\n\nSoon, walking on a field path after leaving the city, Misaki set aside the confusion she was feeling for a while.\nAnd as she hurried her steps to join everyone, she added a small question to the long-held maxim she had believed in.\n'Everything in the world is vain, but it might be worth living.'"
 TRN_opposition.12.a: "There is nothing better than that a man should rejoice in his own works, for that is his portion"
 TRN_opposition.122.t: "Collective Punishment"
 TRN_opposition.122.d: "Today too, numerous documents had arrived at Mika's office.\nWith a small yawn, she sat comfortably and quickly scanned the documents.\nMost of them were things of no great interest to her.\n'Cleaning' Jews or minorities was the interest of those fanatics who put her in this position.\nThere were also things that could catch her eye such as incineration work in the completely collapsed Arius district or the status of invasion preparations for Gehenna, but those were also things she could just sign without concern.\nWhile scanning the documents indifferently like a general student bored with school homework, a file was placed before her.\n\n\"...Mmm? What's this??\"\n\"It's regarding the tracking results for Imashino Misaki, who was one of the Arius Squad members.\"\n\"Hmm...\"\n\nHearing that, Mika, with a bit of expectation, opened the file.\n\n\nAnd reading the file, Mika shortly after threw the file she was reading at the secretary with a cold face.\n\n\"....It's not even the leader.. but you couldn't catch just one insignificant girl, and dozens of casualties??\"\n\nAt the pressure she was emitting, the secretary could not say anything and just stood there in place.\nA chilling feeling flowed down with a cold sweat along her spine.\n\n\"And even a checkpoint was breached...? Ha... Arrest the ones responsible for the checkpoint this girl passed, including their families\"\n\nAt Mika's gaze looking as if she had gone mad while chuckling alone, the secretary immediately bowed and fled.\nJust thankful that the anger hadn't reached her."
 TRN_opposition.122.a: "The children shall be put to death for their fathers"

 TRN_opposition.22.t: "Lonely Fall" # 사살
 TRN_opposition.22.d: "Misaki sympathized more than anyone with the teaching that everything in the world was vain.\nTherefore, she had always wanted to lay everything down and be at peace rather than suffer all her life in a vain and empty world.\n\nBut whenever she tried to flee from the world, there were people who caught her and wouldn't let go.\nBecause they were there, Misaki had to temporarily postpone laying things down.\n\nHowever, despite all those efforts, the world did not leave us alone.\nAfter sending the last missile into the sky, she threw away the launcher and climbed to the edge of a cliff.\nNumerous hounds chasing her were shouting at her.\n\nShe felt lonely standing alone.\nShe was alone now.\nThe precious people who held her were not by her side now.\nTherefore, Misaki threw her body backward without hesitation as if slowly falling.\nIn the gale blowing toward her, only then did Misaki feel true comfort."
 TRN_opposition.22.a: "Woe to him that is alone when he falleth, for he hath not another to help him up"
 TRN_opposition.222.t: "Collateral Damage"
 TRN_opposition.222.d: "Today too, numerous documents had arrived at Mika's office.\nWith a small yawn, she sat comfortably and quickly scanned the documents.\nMost of them were things of no great interest to her.\n'Cleaning' Jews or minorities was the interest of those fanatics who put her in this position.\nThere were also things that could catch her eye such as incineration work in the completely collapsed Arius district or the status of invasion preparations for Gehenna, but those were also things she could just sign without concern.\nWhile scanning the documents indifferently like a general student bored with school homework, a file was placed before her.\n\n\"...Mmm? What's this??\"\n\"It's regarding the tracking results for Imashino Misaki, who was one of the Arius Squad members.\"\n\"Hmm...\"\n\nHearing that, Mika, with a bit of expectation, opened the file.\n\n\n\"...She died? By her own hand?\"\n\"I have nothing to say. I am sorry.\"\n\"And why did so many of our kids die?, I mean, Secretary-chan doesn't need to apologize-\"\n\nMika, who was tapping the table with her index finger, soon opened her lips with a heavy thump.\n\n\"Don't miss a single one of the people who should take responsibility... you know that, right?\"\n\nMika smiled brightly at the secretary.\nThe secretary knew better than anyone that the end of numerous people was determined by her smile."
 TRN_opposition.222.a: "Did you think I'd give you a compliment?"

 TRN_opposition.32.t: "Vain Regret" # 체포
 TRN_opposition.32.d: "The last missile flown resounded with a flash and flew into the sky.\nSoon, the submunitions separated along with an explosion poured among the pursuers chasing her.\nAfter watching their end, dryly torn to death, for a moment, Imashino Misaki put down the launcher and fled toward the forest.\n\nHacking through the brush, Misaki reviewed the situation given to her.\nEveryone in the squad was currently scattered in various places and heading toward the southern border.\nShe had to cross the border somehow and join everyone.\n\nBut she felt a sense of skepticism.\nThe probability that everyone could safely escape Trinity by land was too low.\nIf she were to be caught, even the right to breathe as she pleased would be stripped from her.\nRather than that, wouldn't it be better to end this vain and empty world herself?\n\nHowever, it was already too late.\nWhen she noticed, pursuers who had been lying in wait appeared from among the trees and surrounded her.\nAs a last struggle, she tried to take out a pistol and point it at her head.\nThe world mocked it by making the bullet misfire.\n\nEverything is vain.\nThis world, resistance, happiness, sadness, all of it is vain.\nAnd even herself, who eventually couldn't decide due to her own weakness, is vain and foolish.\nUltimately, Misaki was dragged into the darkness of the world she had so much hated and feared."
 TRN_opposition.32.a: "For all his days are sorrows, and his travail grief; yea, his heart taketh not rest in the night. This is also vanity"
 TRN_opposition.322.t: "Self-Inflicted Homicide"
 TRN_opposition.322.d: "Today too, numerous documents had arrived at Mika's office.\nWith a small yawn, she sat comfortably and quickly scanned the documents.\nMost of them were things of no great interest to her.\n'Cleaning' Jews or minorities was the interest of those fanatics who put her in this position.\nThere were also things that could catch her eye such as incineration work in the completely collapsed Arius district or the status of invasion preparations for Gehenna, but those were also things she could just sign without concern.\nWhile scanning the documents indifferently like a general student bored with school homework, a file was placed before her.\n\n\"...Mmm? What's this??\"\n\"It's regarding the tracking results for Imashino Misaki, who was one of the Arius Squad members.\"\n\"Hmm...\"\n\nHearing that, Mika, with a bit of expectation, opened the file.\n\n\n\"Funny- why did she make such a scene when she was going to get caught anyway? Caught a lot of them-\"\n\"I am sorry, Mika-sama...\"\n\nMika, who was looking through the file with a sneering laugh while appearing slightly in a bad mood, stared intently at the image of Misaki attached within.\nNumerous scars were on her arms and neck.\nShowing a raised mouth as something interesting came to mind, Mika instructed the secretary.\n\n\"Not the general camp, you know the camp with unique tastes on the Baltic coast? Send her to them-\"\n\"...Understood.\"\n\nEven though she only saw her in photos, Mika noticed those marks were scars from self-harm.\nTherefore, she wondered to what extent of violence this stupid-faced woman's heart would break.\nMika didn't know why she had hurt herself, but what was certain was that now that woman will have to live all her life in pain and aftereffects.\nMika burst out laughing just at the imagination."
 TRN_opposition.322.a: "Memento Mori"
 

 # Hakari Atsuko
 TRN_opposition.13.t: "Complete Dawn" # 탈출
 TRN_opposition.13.d: "At dawn before the sun rises, when everything is asleep.\nAtsuko climbed the steep mountain path with all her last strength.\nThough she was already exhausted and covered in dust, she didn't stop.\n\nAs she reached the summit, the surroundings came into view.\nA wide field along with houses scattered far in the distance were seen.\nIn some houses, light from starting the morning seeped out, and red, white, and blue flags fluttered in places.\n\nAtsuko realized she had made it.\nShe blankly looked down the mountain and slowly exhaled.\nThe cold and clear air of dawn made her mind clear, and even the darkness of the deep night she had so feared now felt dignified and kind.\nShe advanced forward while running through the grass as if dancing.\n\nShortly after, Atsuko came down the mountain and leaned her back against a tree trunk in the field and lay down.\nThe sun was rising before she knew it.\nWhen exactly was the last time she looked at the sun with relief?\nThough the world hadn't changed, everything reflected in her eyes was new and beautiful.\nHakari Atsuko slowly laid down all her bonds."
 TRN_opposition.13.a: "Is there any thing whereof it may be said, See, this is new? it hath been already of old time, which was before us"
 TRN_opposition.132.t: "When You Gaze into the Abyss"
 TRN_opposition.132.d: "Not as much as Nagisa, but she too was one of Mika's most precious friends.\nThough she sometimes provoked her anger with long, incomprehensible words, nevertheless, she was truly lovely.\n\nTherefore, Mika didn't want her to become like that.\nIt wasn't her intention.\nNevertheless, nevertheless... in her dreams, she always stared directly at Mika with hollow eyes from the inside of a water surface made of blood.\nIt wasn't just her.\nNumerous people Mika had cleared away from before her also stared at Mika by her side.\n\nFortunately, what woke Mika up tonight was not a terrible nightmare but a single phone call.\nWhen Mika opened her eyes, she sat blankly for a moment and then picked up the receiver.\n\n\nAnd after receiving the call for a short while, Mika, who crushed the receiver with her bare hands, left the bedroom.\n\nWhen her secretary, who heard the news and appeared a short while later, saw Mika, it was in her office.\nOn the floor, along with fragments of sundries or furniture, those responsible for this operation were collapsed and Mika was stained with red.\n\nWhile her secretary went somewhere to settle the situation, Mika looked at a photo placed on her desk with unfocused eyes.\nIt was a photo of Hakari Atsuko, who had crossed the border, softly smiling and walking through a field under the moonlight as if dancing.\n\nShortly after, Mika looked around and saw her appearance reflected in a broken mirror.\nCovered in blood and dust, her dirty appearance was shabby yet chilling.\n\n\"....What.. am I doing...?\"\n\nThose words dryly uttered echoed so emptily.\nAnd no one answered Mika's question."
 TRN_opposition.132.a: "The abyss also gazes into you."

 TRN_opposition.23.t: "Let's Never Meet Again" # 사살
 TRN_opposition.23.d: "Inheriting the noble blood of the Arius student council presidents who protected the precepts, she was destined to become the new Student Council President of Arius.\n\nBut amidst the sudden change, she merely fell into a sacrifice for the glory of Arius.\nHer rightful throne was usurped by an adult, and her future was stained gray.\n\nBut Hakari Atsuko did not collapse.\nAlong with her family-like friends who protected her, she cherished a small hope for the liberation that would someday arrive.\nThat small hope was the foundation that kept Atsuko from losing herself.\n\nBut at the same time, Atsuko did not want to see her precious people being hurt any more.\nShe chose herself as a burnt offering to turn the pursuers' attention to herself.\nWithin the red burning haze that embraced all of her, she finally felt liberation.\n\nThe last things reflected in her eyes were the faces of the three most precious people.\nWhom she will never see again, the people she loves most.\nAtsuko quietly sent a farewell to them alone."
 TRN_opposition.23.a: "...And finally, be happy."
 TRN_opposition.232.t: "The Most Noble Act"
 TRN_opposition.232.d: "Not as much as Nagisa, but she too was one of Mika's most precious friends.\nThough she sometimes provoked her anger with long, incomprehensible words, nevertheless, she was truly lovely.\n\nTherefore, Mika didn't want her to become like that.\nIt wasn't her intention.\nNevertheless, nevertheless... in her dreams, she always stared directly at Mika with hollow eyes from the inside of a water surface made of blood.\nIt wasn't just her.\nNumerous people Mika had cleared away from before her also stared at Mika by her side.\n\nFortunately, what woke Mika up tonight was not a terrible nightmare but a single phone call.\nWhen Mika opened her eyes, she sat blankly for a moment and then picked up the receiver.\n\n\nAnd after setting down the receiver a short while later, Mika quietly fell into thought in place.\n\nHakari Atsuko, the rightful successor of Arius and who inherited noble blood, her end was jumping into the fire as a sacrifice herself.\nThough it was by no means such a fate, she sacrificed herself for trivial things.\nWhether that decision actually had meaning was not important for now.\n\nMika did not know what the unknown complex thoughts and unnatural feelings meant.\nShe just picked up the receiver again and called her secretary.\n\n\"...Bring Hakari Atsuko here, careful so she doesn't break\"\n\nShe just wanted to directly see the reality of the end Hakari Atsuko met with her own eyes.\nOnly by doing so did it feel like she would be able to regain a comfortable night for a while.\nIgnoring the thoughts shaking her head and forcing her eyes closed, Mika slowly sank into the bed."
 TRN_opposition.232.a: "A candle does not exist to light itself."

 TRN_opposition.33.t: "The Return" # 체포
 TRN_opposition.33.d: "Everyone has their own fate.\nWe know that numerous fates as many as the number of people exist, regardless of weight.\nAnd what Atsuko's fate shows was a splendid yet lonely and empty throne.\n\nBut she resisted that fate both voluntarily and involuntarily.\nShe just wanted to be ordinary.\nNot a princess or a sacrifice, but just as a single student, she wanted to walk side by side with the people she loves.\n\nBut fate was sudden when it returned, just like when it was taken away.\nSeeing the Trinity hounds who visited her in a shabby room where she was hiding, Atsuko realized she eventually didn't escape from fate.\n\nThus she vanished back into the lonely darkness.\nThe princess returned to where she should be.\nTo her cold and lonely throne"
 TRN_opposition.33.a: "He hath not seen the sun, nor known any thing: this hath more rest than the other"
 TRN_opposition.332.t: "Dark Night"
 TRN_opposition.332.d: "Not as much as Nagisa, but she too was one of Mika's most precious friends.\nThough she sometimes provoked her anger with long, incomprehensible words, nevertheless, she was truly lovely.\n\nTherefore, Mika didn't want her to become like that.\nIt wasn't her intention.\nNevertheless, nevertheless... in her dreams, she always stared directly at Mika with hollow eyes from the inside of a water surface made of blood.\nIt wasn't just her.\nNumerous people Mika had cleared away from before her also stared at Mika by her side.\n\nFortunately, what woke Mika up tonight was not a terrible nightmare but a single phone call.\nWhen Mika opened her eyes, she sat blankly for a moment and then picked up the receiver.\n\n\nAfter finishing the call a short while later, Mika sat on the bed beaming and swung both feet\n\nHakari Atsuko has been caught.\nAnd quietly without any loss or engagement.\nUnlike the military guys who lacked intelligence, at least the secret police friends showed a much more efficient appearance.\n \nSince Atsuko was caught, Arius now couldn't be a threat at all.\nFeeling for the first time in a while that everything was going correctly, Mika lay on the bed and looked out the window.\n\nAfter everything is finished, she too will be able to shine brilliantly like those stars.\nShe believed so and slowly fell asleep."
 TRN_opposition.332.a: "Only with darkness can one see the stars."

 # Tsuchinaga Hiyori
 TRN_opposition.14.t: "Didn't Know This, Did You?" # 탈출
 TRN_opposition.14.d: "Honestly, really no one would have known.\nWho would have thought a fugitive would buy a train ticket and cross the border in broad daylight?\n\nShe boldly infiltrated a cathedral, found and put on a nun's habit, and pushed all her luggage into the livestock transport section of the train.\nThen she got on the very corner seat of the train and took a pious posture as if offering a prayer and fell into a deep sleep.\n\nInspectors entered at the border but since she was asleep, her halo wasn't seen, and above all, she had so little presence that they didn't even suspect she was a member of the tracked Arius Squad.\n\nWhen the gendarmerie realized she was Tsuchinaga Hiyori, it was already after she arrived at Budapest Central Station.\nGetting off the train and sitting in a field in front of the station, she stretched while basking in the warm sunlight.\nAnd looking up at the blue sky after a long time, she smiled brightly and happily"
 TRN_opposition.14.a: "Hehe- I survived-"

 TRN_opposition.144.t: "Before the Dark Reality"
 TRN_opposition.144.d: "Kirifuji Nagisa and Misono Mika were friends who had known each other for a long time.\nBut in the current situation, the two could no longer be called friends.\nNagisa was a loser who lost freedom due to a coup, and Mika was the one who pulled her down.\n\nBefore her eyes were high-quality tea and a tea set, but in a desolate environment where the window had bars and guards with guns were standing outside the door.\nIn there, Mika chattered useless stories in a cheerful voice as usual.\nNagisa quietly tilted her teacup without showing any emotion.\nThough there was no one to attend to her and she hadn't seen sunlight for a long time, her outer appearance still felt dignified.\n\n\"So you see- that dog went and-\"\n\"Mika-sama, a telegram has arrived.\"\n\nIt was her secretary who interrupted Mika's trivial story.\nShe held her teacup and quietly read the telegram the secretary showed while still maintaining her smile.\n\n\n\n\"....Huh?\"\n\nWatching Mika instantly distort her expression, it felt like time had stopped for a moment for everyone.\n\n\"Escaped..? Taking a train..... are you joking with me now?\"\n\"A report that the relevant departments are currently investigating...\"\n\nThe moment the secretary opened her lips, the teacup Mika threw hit her head and broke.\nThe secretary, who stumbled back, had red blood flowing from her forehead.\n\n\"Are you all stupid..? Does it make sense that you couldn't catch one stupid brat escaping in such a lame way?!! There's a limit to being useless and stupid...!!!\"\n\"....Pfft..\"\n\nIt was Nagisa's laughter that stopped Mika's explosively pouring anger.\nWith an ashen, chilling face as cold as the teacup that had shattered and cooled, Mika looked back at Nagisa.\n\n\"Your bad habit has worsened, Mika. Even before, you used to whimper unsightly like a suckling babe when things didn't go your way.\"\n\nAt that story, Mika, whose face turned red, walked toward the door with large strides.\nThe two guards who rushed in at the sound of shouting flinched for a moment at the mess around them.\nMika, as if taking out her anger, planted bullets in the crowns of their heads and disappeared outside.\n\nLeft alone, Nagisa smiled slightly and meaningfully and drank her tea.\nEverything was breaking down, but she was smiling for now."
 TRN_opposition.144.a: "Laughter was all I had left."


 TRN_opposition.24.t: "Final Apology"
 TRN_opposition.24.d: "A bullet flown with a roar echoing throughout the street struck an unfortunate person's glabella.\nWatching the pursuers scatter and take cover, Tsuchinaga Hiyori pulled the bolt.\n\nHer life was always unfortunate.\nAmidst numerous absurdities and oppression, she became isolated and withered.\nBut she wanted to live.\nAmidst violence and vilification, she acted more tenaciously than anyone to live.\nTherefore, even now, she was pulling the trigger without hesitation.\n\nBut the resistance did not last long.\nWhen she was pushing the next ammunition into the chamber, someone kicked the closed door and returned inside.\nHiyori immediately raised her gun and blew off the pursuer's shoulder.\nBut another pursuer rushed in right after and with a gunshot fired without aiming, Hiyori lost her weapon and slumped down with her back against the wall.\n\nIn her fading consciousness, Hiyori saw the pursuer who shot her.\nShe was wailing while embracing the body of her colleague, who had entered the room first and was gradually cooling.\n\n\".....I'm... sorry....I'm... so... rry...\"\n\nIn her fading consciousness, Hiyori left a small apology to them.\nIt was a sincere heart she was conveying to others for the first time."
 TRN_opposition.24.a: "As it happeneth to the fool, so it happeneth even to me; and why was I then more wise? Then I said in my heart, that this also is vanity."

 TRN_opposition.244.t: "Ye Are the Salt of the Earth"
 TRN_opposition.244.d: "Kirifuji Nagisa and Misono Mika were friends who had known each other for a long time.\nBut in the current situation, the two could no longer be called friends.\nNagisa was a loser who lost freedom due to a coup, and Mika was the one who pulled her down.\n\nBefore her eyes were high-quality tea and a tea set, but in a desolate environment where the window had bars and guards with guns were standing outside the door.\nIn there, Mika chattered useless stories in a cheerful voice as usual.\nNagisa quietly tilted her teacup without showing any emotion.\nThough there was no one to attend to her and she hadn't seen sunlight for a long time, her outer appearance still felt dignified.\n\n\"So you see- that dog went and-\"\n\"Mika-sama, a telegram has arrived.\"\n\nIt was her secretary who interrupted Mika's trivial story.\nShe held her teacup and quietly read the telegram the secretary showed while still maintaining her smile.\n\n\n\"Hmm- so? What do you want me to do?\"\n\nAnd the reaction Mika showed was a question.\nTo Mika who asked back with her eyes wide open, the secretary was flustered and couldn't say anything.\n\n\"Do I really have to hear a report that one of the terrorists died at such a good time?\"\n\"I am sorry.. My thinking was short...\"\n\nNagisa set down her tea and watched that sight.\nMika was willful before too, but current Mika seemed to have no thought of even hiding such an aspect.\nShortly after, she looked at the blackout-covered window while raising her head.\nIn the tea she drank while feeling her own helplessness, no scent could be felt."
 TRN_opposition.244.a: "If the salt have lost his savour, wherewith shall it be salted?"

 TRN_opposition.34.t: "Heavy Steps"
 TRN_opposition.34.d: "Tsuchinaga Hiyori was the most outstanding sniper in Arius.\nHer shooting skill was beyond words, and she was not lacking in strategic position selection or concealment.\n\nBut as all snipers in the world are, she too was not versatile.\nEspecially in a situation where dozens to hundreds of people were chasing her existence, what Hiyori could do was only to hide her existence.\nWhen Trinity's pursuers who swarmed into the small village introduced residents and completely surrounded the area, she hid herself under a sink in a 2-story house.\n\nBut she couldn't just hide anymore.\nThe pursuers weren't searching houses one by one but were burning them all with flamethrowers.\nWatching the flames rising outside the darkened window, Hiyori took out and fiddled with the pistol she was carrying.\n\nBut shortly after, Hiyori shook her head and put down all weapons.\nEverything in the world is vain and meaningless, but nevertheless, she wanted to live.\nTo do so, she had continued to jump over numerous dangers.\nThis crisis too would be just one of those ordeals, Hiyori thought.\n\nShe walked outside while raising both hands to the sides of her head.\nEach step was heavy and sticky, but she knew this was the only remaining choice.\nThus Hiyori stopped her last resistance and walked out into an uncertain future.\n"
 TRN_opposition.34.a: "Be not over much wicked, neither be thou foolish: why shouldest thou die before thy time?"

 TRN_opposition.344.t: "Blessed Are the Meek"
 TRN_opposition.344.d: "Kirifuji Nagisa and Misono Mika were friends who had known each other for a long time.\nBut in the current situation, the two could no longer be called friends.\nNagisa was a loser who lost freedom due to a coup, and Mika was the one who pulled her down.\n\nBefore her eyes were high-quality tea and a tea set, but in a desolate environment where the window had bars and guards with guns were standing outside the door.\nIn there, Mika chattered useless stories in a cheerful voice as usual.\nNagisa quietly tilted her teacup without showing any emotion.\nThough there was no one to attend to her and she hadn't seen sunlight for a long time, her outer appearance still felt dignified.\n\n\"So you see- that dog went and-\"\n\"Mika-sama, a telegram has arrived.\"\n\nIt was her secretary who interrupted Mika's trivial story.\nShe held her teacup and quietly read the telegram the secretary showed while still maintaining her smile.\n\n\n\"Wow, I see- you caught her? Amazing-, did you want me to say it like this?\"\n\nWhen she shot back in an unbefittingly bright smiling face, the secretary immediately bowed her head.\nNevertheless, Mika did not stop the verbal abuse toward her.\n\n\"Is it so amazing that you caught her while burning down a whole village? And she surrendered herself? Did you think I'd be happy hearing such a report?\"\n\nWatching Mika incessantly criticize her secretary, Nagisa closed her eyes.\nShe was surely not such a child.\nThough she showed many slightly childish and lacking aspects, she was always a child with a kind and upright heart toward those around her.\n\nShe let out a sigh so that no one could hear.\nOn that day, the tea she so liked felt even more bitter."
 TRN_opposition.344.a: "For they shall inherit the earth"
 
 ## Nagisa
 TRM_event.363.t: "Returning Home"
 TRM_event.363.desc: "Closing the last box of the hastily packed moving luggage, Johann stretched while feeling a dull ache in his waist, sighing in relief. But whenever he tried to take a breath, the girls outside pressured him, so he packed his bags again. After packing all his luggage and loading it into his car, he handed over his house key to one of the Justice Task Force members and set out. He looked back at the familiar streets of Breslau one last time through the car window before starting the engine and heading off.\n\nThe expulsion order for unauthorized foreigners recently issued by the 'Iron Lady' was executed across Trinity today. This policy, concentrated near Mecklenburg, Saxony, Silesia, and the Polish Corridor, forced many people to leave their familiar homes and head for cold and lonely foreign lands. Minor resistance that occurred in the process was all crushed by the Justice Task Force, and people who had lost all hope and possibility had to pack their bags and depart on a march of tears.\n\nAmong them, on the familiar old road that Johann had spent his young days on every day, he passed the glass door of the bakery that sold those boring pretzels he had stopped at every day, which now had 'Eviction' written in large letters in front of the door, passed the sign for Breslau, and headed for Poland. For some reason, he shed uncontrollable tears. Perhaps it was because all of his everything was in that place.\n\nWhile wiping the non-stopping tears with a handkerchief, he headed for Krakow where his father, whom he never wanted to see again, lived.\n\nWhen he was young, he had to suffer every day under the hands of his drunken father. When he couldn't stand the pain and left Krakow empty-handed, he headed for Breslau with only a strong heart. Working at everything from simple janitorial jobs to construction sites in Breslau, he was finally able to escape from his father's grasp and become self-reliant. And the city that shared and watched that was Breslau. But he left Breslau and returned to Krakow again.\n\nThe long runaway had finally ended."
 TRM_event.363.a: "And Johann wiped the tears flowing again."
 TRM_event.364.t: "Public Speech"
 TRM_event.364.desc: "Under the brilliant stained glass of the cathedral, Nagisa stood before the microphone. Her voice, amplified through the speakers, carried a weight that seemed to press down on the very air of the plaza. She spoke of unity, of the necessity of iron discipline, and of the glorious future that awaited Trinity once the 'impurities' were purged.\n\nThe crowd listened in a terrifyingly quiet state. There were no cheers, only the heavy sound of breathing and the distant metallic clatter of armor. As she spoke, the sun dipped below the horizon, casting long, sharp shadows that made the scene look like an old, monochromatic photograph. The students of Trinity, once known for their lighthearted banter and tea parties, now stood like statues of cold steel."
 TRM_event.364.a: "And Nagisa slowly descended from the podium."
 TRM_event.365.t: "A Guest from Krupp"
 TRM_event.365.desc: "In the temporary headquarters of Krupp in Stettin, Gustav Krupp was in his deep agony while looking out the window.\n\nSince the Great Migration, Germany has been split in two, and Krupp, which had spread throughout Germany, was also split in half and was merely in a state of wearing a ventilator with the money earned until then. Rubbing the cigarette he had placed in his fingers several times against the chair, he had to fall into constant agony for the future of Krupp—and for the Krupp workers who would not be able to sleep properly for even a single day, fearing his decision.\n\nWhat should be done? What should be done with Krupp remaining in a place called Gehenna? Should they withdraw from heavy industry? How to compete with the damn Eden Group?\n\nThe more he agonized, the deeper he was dragged into agony, and Gustav Krupp is still fighting alone today for the future of Krupp.\n\nAt that moment, along with the sound of rapid footsteps running in the hallway, his secretary said:\n\n\" Boss, it's a guest from Eden. \"\n\nWhen he stepped out of his endless agony for a moment at the secretary's words, the secretary soon opened the door and let the guest in.\n\nThat guest was Trinity's—Kirifuji Nagisa.\n\nTo him, flustered by the unexpected guest, he soon smiled and seated Nagisa.\n\n\" Is Krupp at peace today as well? \"\n\nNagisa was the one who broke the silence of the empty room. To him, flustered once again by the unexpected question, he continued his words while being unable to hide his embarrassment.\n\n\" Haha, if I say yes here, I would be lying from the first meeting. \"\n\" Yes, Krupp's condition is not good now. \"\n\nKrupp answered Nagisa's words without a single lie. Having finished his words, Krupp sat anxiously waiting for Nagisa to speak.\n\n\" That's unfortunate. \"\n\" Then let me offer a proposal from the Tea Party. \"\n\" How about Krupp working under Trinity? \"\n\nWhen Nagisa spoke while drinking tea, warmth circulated in Gustav Krupp's heart, which was as cold as steel, and it soon began to beat rapidly.\n\nIs this the only last rope of hope given to Krupp, or is it a cunning torn rope of a demon?\n\nGustav Krupp couldn't answer for several tens of minutes after hearing those words, but Nagisa was also the one who broke that silence.\n\n\" I'll wait for a positive response in Eden. \"\n\" I wish you peace today. \"\n\nNagisa set out after saying these words as the last."
 TRM_event.365.a: "And when the door closed, the pipe tobacco burned out."
 TRM_event.366.t: "Discarded Faith"
 TRM_event.366.desc: "Perhaps the history of hatred began from the moment society was born. Whether for one's well-being, from jealousy, or unintentionally causing harm, the causes are very diverse. Hatred left numerous victims, unerasable scars, and paradoxically, much development and progress. To thoroughly trample the opponent, to eliminate the opponent. And to make them submit.\n\nIt wouldn't be strange that the hostile relationship between Trinity and Gehenna hasn't changed even after the Great Migration. It was no different for Kivotos that they didn't stop hating each other even when a crisis arrived. The only common point shared by humanity and Kivotos was infinite hatred toward those different from themselves.\n\nThe face of the girl belonging to the Sisterhood was filled only with despair. Only tears, bloodstains, and distress. When Trinity treated Gehenna as \"a lot with whom conversation is impossible,\" she couldn't accept it. The Lord loves everyone. Even if it's Gehenna. The Lord's love had to be bestowed upon everyone.\n\nBut now that hatred was eating away at their hearts, the voice of the holy Lord was merely noise to the students.\n\nThe girl was discouraged. Did they say anger and hatred are the most powerful forces that electrify the masses. A dagger flew and pierced the heart of the pure and noble girl who realized the truth. Once again a bloody fight began before her eyes. They had to be stopped. As the Sisterhood, as a single human, she had to stop these daughters of the Lord\n\nTheir violence did not stop. Rather, fisticuffs and gunfights between Gehenna and Trinity students were still occurring, even more fiercely. The girl in the black habit 원 원 cursed her helpless self, and cursed the Lord who stood by through all this, sobbing as she huddled her small body."
 TRM_event.366.a: "Burning brazier, weeping sky"
 TRM_event.367.t: "Everything Comes to an End"
 TRM_event.367.desc: "Toshiro Ai, a student belonging to Trinity's Justice Task Force, was just confused by all this. \"There shall be absolutely no hostile actions between Trinity and Gehenna.\" This simple sentence messed with Ai's head. To Ai, who followed Mika of the Tea Party, such a decision was even more incomprehensible.\n\nNo discipline, full of delinquents, could conversation work with these idiots who only know how to fight? If Mika were here, everything could be returned to its place. Finding a target for her anger, what caught her eye was the Gehenna Academy Prefect Team, and seeing that disgusting appearance, Ai intentionally bumped her shoulder hard.\n\nThe Prefect girl was in pain and looking at something as if it were a waste. Ai looked at her without hiding her disgusted heart. Gehenna must be thoroughly trampled. But something stopped her hand, which was about to throw a punch to perform justice, something that had lost its shape and was mixed with whipped cream, fallen beside the Prefect girl.\n\nIt was a cake from a bakery she had often stopped at since long ago. Ai lost her words. It was a feeling as if something had returned to Ai's heart, which vowed to perform justice even if the world ended. Ai, who was frowning, reached out her hand and helped the Prefect girl up.\n\n\" ...I was sorry for before. I'll go back and buy it for you again. \"\n\" Eh...? Uh-huh, thanks. \"\n\nOn the way to the bakery too, the awkward yet unpleasant air between Trinity and Gehenna students was still felt. Arriving at the bakery before she knew it, Ai bought the cake again with her own money and gave it to her. The Prefect girl looked at her with a satisfied expression.\n\n\" You spent quite a bit? You could have just ignored me and passed by. I'm Hikari of the Prefect Team, and you? \"\n\nShe took out her cell phone as if she wanted to exchange phone numbers and shook it before her eyes. Ai let out a deep sigh and took her phone to save her number."
 TRM_event.367.a: "\" ...Toshiro Ai. \""
 TRM_event.368.t: "After-School Dessert Club and Gourmet Research Society"
 TRM_event.368.desc: "As part of recent reconciliation between Trinity and Gehenna, some clubs were to spend a day with a pre-selected partner club. Members of the After-School Dessert Club, who were to meet the 'Gourmet Research Society' in Erfurt, were waiting for the Gourmet Research Society at a cafe in Erfurt with a mixture of expectation and fantasy about the Gourmet Research Society.\n\nBut shortly after, a giant explosion resounded from outside. The explosion occurred at a nearby sausage truck, and a German was seen through the cafe's plate glass abandoning the sausage truck and fleeing while screaming. Since they had heard about the 'notoriety' of the Gourmet Research Society, it seemed certain that the Gourmet Research Society had blown up that truck on the grounds that the basics of sausage were not prepared.\n\nShortly after, Gourmet Research Society members entered the cafe door with a very calm appearance, unlike the situation just before. Seeing the Gourmet Research Society members entering the door calmly, the cafe's barista went into the kitchen in terror, and a staff member with a tense face guided the Gourmet Research Society members to the After-School Dessert Club's table. Thus their first official meeting was accomplished.\n\n\" Ho-ho... Nice to meet you, After-School Dessert Club. \"\n\"Is that cute child the president? \"\n\nKurodate Haruna of the Gourmet Research Society greeted Ibaragi Yoshimi with vitality as soon as she sat down.\n\n\" C-cute child! \"\n\" I hate being treated like a kid... \"\n\nYoshimi, who was suddenly treated like a child, answered with a red face.\n\nWhile they were sharing a conversation slowly for a moment, a cute rabbit-shaped cake soon came out. When they tasted the cake together, the harmony of cheese and fresh cream cake soon tickled their mouths. Even the Gourmet Research Society members, famous for their fastidious taste, seemed satisfied that they had eaten a proper meal after a long time.\n\n\" Ohh~! It's so~ tasty! \"\n\" I especially like this cheese part! \"\n\n\" Ni-hee, me too! \"\n\nWhile they were praising the cake in a friendly atmosphere, Haruna suddenly took out bombs from her pocket and said:\n\n\" Cheese and fresh cream cake, this is a taboo for gourmet! \"\n\" Such food must disappear right now! \"\n\n\" Haruna, wait- \"\n\n\" KABOOM-! \"\n\nBefore they could even stop her, Haruna immediately blew up the cafe by detonating the bomb.\n\nSoon the Gourmet Research Society disappeared into the thick smoke, and thus their first meeting ended like this."
 TRM_event.368.a: "Hmm, it was delicious though!"
 TRM_event.369.t: "Proposal from Trinity"
 TRM_event.369.d: "According to a letter sent from Eden, Trinity knows our internal situation well, and it was written that in exchange for them handling all of Abydos' problems, we should be annexed into Trinity.\n\nIt's a quite enticing proposal that our tiresome problems could be solved at once, but in fact, it clearly seems like a scheme for them to annex Abydos."
 TRM_event.369.a: "Refuse."
 TRM_event.369.b: "There is nothing we can do..."
 TRM_event.370.t: "Abydos Accepted"
 TRM_event.370.d: "Abydos High School accepted our proposal, and from now on Trinity and Abydos have become one."
 TRM_event.370.a: "Good!"
 TRM_event.371.t: "Abydos Resistance"
 TRM_event.371.d: "Unfortunately, the Abydos side, who seemed unable to look into their future, refused our proposal and was identified as preparing for war after asserting they wouldn't fall for a 'shameless annexation scheme.'"
 TRM_event.371.a: "If it doesn't work with words, do it with guns."
 
 ## Nagisa - Grand Compromise 
 TRM_event.358.t: "Prelude"
 TRM_event.358.desc: "On a day when warm sunlight poured down and a cool breeze blew, the Tea Party and Pandemonium of Trinity and Gehenna gathered at the High Cathedral to end their long discord even now.\n\nThe High Cathedral is the place where the Council of Unification was held in the past, and it will be the most appropriate place for conducting a historical event called the 'Eden Treaty.'\n\nKirifuji Nagisa of the Tea Party and Hanuma Makoto of Pandemonium shook hands while exceptionally smiling at each other and then sat in their respective seats. While numerous cameras from Kronos School watched that scene with bated breath and numerous students of Kivotos watched the sight, Kirifuji Nagisa of the Tea Party spoke first.\n\n\" Did you have a peaceful journey coming here? \"\n\n\" Aah- You've tidied it up just right for this Hanuma Makoto-sama, the competent leader of Gehenna! \"\n\" Ki-kit, shall we stop the small talk and get to the main point? \"\n\nIn a friendly atmosphere between each other, their servants placed documents on each table, written beautifully on high-quality paper:\n\n' Grand Compromise between Trinity Comprehensive Academy and Gehenna Academy for the Eden Treaty '\n\nThe Eden Treaty and Grand Compromise, which would remain in history and be passed down through the mouths of descendants and their descendants for a long time, were just beginning."
 TRM_event.358.a: "\" Let's look at the first page. \""
 TRM_event.359.t: "The First Chapter"
 TRM_event.359.desc: "The sound of the Tea Party and Pandemonium Society flipping through documents echoed, and the Tea Party's attendant continued speaking.\n\n\"The first signing is for the mutual 'Treaty of Eternal Friendship.'\"\n\"In simpler terms, it is the cessation of all mutual hostile actions.\"\n\n\"Hmm? I thought such trivialities were already signed during the initial agreement.\"\n\"Could it be—that you don't trust this Pandemonium Society, or something to that effect?\"\n\nAt the unexpected signing, Makoto removed her hat and spoke with great displeasure. The Gehenna table also adjusted their seats and stared at the Tea Party as if demanding an explanation.\n\n\"This signing does not carry such a meaning, Hanuma Makoto-sama.\"\n\"It is merely a signing to resolve mutual distrust.\"\n\nNagisa, who also hadn't expected Pandemonium's cold reaction, hid her embarrassment and responded with a smile toward them.\n\n\"Wouldn't it be better to make it certain?\"\n\n\"Puhahat!\"\n\"...Quite interesting indeed.\"\n\"Trying to engage in a power struggle with us already.\"\n\nPandemonium's Hanuma Makoto burst into laughter and responded to Nagisa with an expression quite unlike her usual self.\n\nThe amicable atmosphere from just a moment ago froze in an instant, and only the sound of pen nibs scratching as the Tea Party and Pandemonium signed the documents could be heard."
 TRM_event.359.a: "First Signing - Passed."
 TRM_event.360.t: "The Second Chapter"
 TRM_event.360.desc: "This time, Pandemonium's attendant broke the icy atmosphere and spoke.\n\n\"The second signing concerns the consolidation and abolition of clubs.\"\n\"If Trinity and Gehenna become one, the number of clubs will double, which will be a great burden on the unified Student Council.\"\n\nThis signing was related to the consolidation and abolition of each other's clubs. It meant that if the two giant academies of Kivotos were absorbed into one, the sheer number of clubs would be a burden for the new Student Council to handle, so it should be decided in advance. However, this time, neither the Tea Party nor Pandemonium signed easily.\n\n\"...Pandemonium Society opposes the abolition of the Hot Springs Development Department.\"\n\"The Hot Springs Development Department is strictly a Gehenna club, and Gehenna does not abandon its own. Ah, indeed it does not.\"\n\n\"Oh? Makoto-sama, are you truly unaware of that club's notoriety?\"\n\"They blast holes in perfectly good roads and barge into other academies to develop hot springs at will.\"\n\"That club must be abolished for the sake of the union, and furthermore, for the sake of Kivotos.\"\n\n\"Kik... kikik... Kyahahahahaha!\"\n\"If you're going to put it that way, then the Make-Up Work Club should be abolished too!\"\n\"Failing three times in a row, wandering around in swimsuits, and even armed riots!\"\n\"Kikit, what a truly useful club!\"\n\nMakoto stepped forward, directly refuting Nagisa's words. Nagisa sighed and simply said she understood, continuing the conversation.\n\n\"Then I shall take it that there are no objections to merging similar clubs.\"\n\nAfter Nagisa's short remark, Makoto pulled down her hat and signed the agreement with a quite satisfied smile.\n\nEveryone watching the scene prayed that everything would turn out well." 
 TRM_event.360.a: "Second Signing - Passed."
 TRM_event.361.t: "The Third Chapter"
 TRM_event.361.desc: "Once both had signed the second chapter, the third chapter was read aloud shortly after.\n\n\"The third signing concerns the unified Student Council.\"\n\"We must decide whether to form a new council by selecting a few members from the Tea Party and Pandemonium executives, or to have everyone participate.\"\n\nFitting for the latter part of the thin but heavy documents, this signing was about the unified Student Council.\n\nIt was a matter of deciding whether to merge the Tea Party and Pandemonium as they were, or to pick a select few to form the union.\n\n\"Kikik, with me, Makoto-sama, everything will run perfectly!\"\n\"Iroha, isn't that right?\"\n\nAs soon as Makoto read the signing, she asked Iroha, who was sitting next to her, with a confident face.\n\n\"Sigh, are you serious?\"\n\"You'll have to do all the work I've been doing.\"\n\nIroha replied to Makoto as if it were a nuisance. Makoto looked at Iroha with a meaningful face.\n\n\"I believe it would be best for everyone to be involved together.\"\n\"If we can share the workload, there is nothing better than that.\"\n\nNagisa replied while looking at Iroha. At Nagisa's sudden words, Iroha could not hide her bewilderment.\n\nMakoto looked a bit disappointed, but unlike last time, the signing happened quite quickly.\n\nThe unified Student Council will include all executives from both the Tea Party and Pandemonium."
 TRM_event.361.a: "Third Signing - Passed."
 TRM_event.362.t: "The Final Chapter"
 TRM_event.362.desc: "The final moment of the Grand Compromise has finally arrived. As the executives of the Tea Party and Pandemonium opened the last page, only a single phrase was written there in large letters.\n\n\"The United States of Eden\"\n\nThis time, neither the Tea Party nor Pandemonium could easily make a decision. From now on, Trinity and Gehenna would have to move forward with their fates intertwined, and they were choosing the final tool to aid that.\n\nThe United States of Eden, in simple terms, means Trinity and Gehenna are guaranteed equal rights under the same flag. Each academy's student council exists under the unified student council, and both Trinity and Gehenna can exercise an equal right of veto when deciding the future of the academies. It is currently the most ideal form of union.\n\nWhile this method is ideal for the continuous existence and stability of the union, since the ill-will between the two has not been completely uprooted yet, there are difficulties in realizing it right now.\n\nAfter a long debate spanning several hours, the executives of the Tea Party and Pandemonium reached a decision. In the end, they failed to reach a decision."
 TRM_event.362.a: "Final Chapter - Deferred."

 TRM_event.372.t: "Seia Yurizono Awakens from Her Sickbed"
 TRM_event.372.desc: "Seia Yurizono, who had been rushed to the hospital marking the beginning of the recent chaos in Trinity, has regained consciousness and is urgently seeking Nagisa Kirifuji.\n\nNow that Seia Yurizono can resume her activities as the head of the Sanctus branch, the Sanctus branch, which was shattered into pieces during the chaos, is rallying once again."
 TRM_event.372.a: "..."

 TRM_event.373.t: "The Politicized Tea Party"
 TRM_event.373.desc: "The 'temporary measures' implemented by the Tea Party during the process of thwarting the Pater branch's coup attempt have remained in place, entangled in political interests.\n\nAs a result, the power structure within the Tea Party has been rapidly reorganized. With the Sanctus branch collapsed and the Pater branch dismantled by our own hands, only the Filius branch led by Nagisa Kirifuji remains as the sole dominant force."
 TRM_event.373.a: "...I didn't want it to be like this."

 TRM_event.374.t: "Revision of Several Clauses"
 TRM_event.374.desc: "Now that the Filius branch has emerged as the sole leadership force of Trinity, we need to ensure this rule is maintained smoothly and to prevent a second coup from occurring.\n\nAccordingly, Nagisa Kirifuji will remain the sole leader of Trinity. Of course, Nagisa herself does not want this role, but she knows all too well that the chaos in Trinity cannot be left unattended."
 TRM_event.374.a: "...Just for a little while."

 TRM_event.375.t: "Creation of the Make-Up Work Club"
 TRM_event.375.desc: "Nagisa Kirifuji has finally decided she can no longer overlook the dangerous actions taking place under Mika Misono's lead. And finally, the person she was waiting for entered the room.\n\"Hifumi-san, I have an important mission for you. Please join the newly created 'Make-Up Work Club' and find the threats to Trinity. This is a very important matter.\"\n\nSometime later, by Nagisa Kirifuji's direct order, the 'Make-Up Work Club' was created under the pretext of reforming Trinity's problem students."
 TRM_event.375.a: "I can't just let this continue anymore."

 TRM_event.376.t: "Mika Misono's Day"
 TRM_event.376.desc: "\"Hmm? Where did the aide who was working by my side until last week disappear to?\"\nMika Misono asked the student who had newly been assigned to assist her with a puzzled expression. The student hesitated for a moment before replying in a calm voice.\n\n\"They quit a few days ago saying the work was too hard. They seem to have been under a lot of stress.\"\nMika tilted her head and thought again.\n\"That's very strange. They seemed to be enjoying it quite a bit from what I saw. Especially during the last meeting, they seemed so passionate.\"\n\nThe student smiled quietly and nodded.\n\"Is that so. It is indeed a strange thing.\"\nHowever, her expression was completely different from her words, showing not even a slight tremor. Standing with an expressionless face, it was as if she already knew everything.\n\nMika stared at the student for a moment but asked no further. Amidst a subtle tension, the conversation ended naturally. However, that student's cold expression did not easily fade away."
 TRM_event.376.a: "Mika-san, please stay quietly inside my cage."

 TRM_event.401.t: "Surrender Demand from [FROM.GetName]"
 TRM_event.401.desc: "[FROM.GetName] has demanded our cooperation in the war against Gehenna. Under the pretext of German unification, they claim to be liberating the German people from Gehenna Academy, stating that if we refuse, we will be treated as traitors to the nation and invaded immediately."
 TRM_event.401.a: "A Germany with wings? What a joke."
 TRM_event.401.b: "We have no choice but to accept."

 TRM_event.402.t: "Refusal from [FROM.GetName]"
 TRM_event.402.desc: "Our nation demanded cooperation for the national liberation war, but [FROM.GetName] has sent word that they would rather fight and die, insulting us as a fake Germany."
 TRM_event.402.a: "There is only death for treason."

 TRM_event.403.t: "Joining the Military"
 TRM_event.403.desc: "[FROM.GetName] has decided to cooperate in our war and has chosen to be integrated into our military."
 TRM_event.403.a: "Welcome, loyal Germans."

 TRM_event.404.t: "Decrease in Government Trust"
 TRM_event.404.desc: "The public order maintenance policy we were pursuing has been cancelled due to the war, and the citizens are doubting our leadership."
 TRM_event.404.a: "Oh dear."

 TRM_event.405.t: "Exercise on the Weser"
 TRM_event.405.desc: "Our military has long established various plans for military operations into the Scandinavian Peninsula. Among them, the 'Exercise on the Weser' operation is the most recent of all plans."
 TRM_event.405.a: "Launch the offensive!"

 TRN_faction_event.111.t: "Protest by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.111.desc: "The [TRN_faction_event_2_name_text] faction has taken to the streets to march, criticizing our actions. The [TRN_faction_event_2_name_text] side stated they have no intention of stopping until we meet their demands, occupying the main roads and causing unrest."
 TRN_faction_event.111.a: "Oh dear."

 TRN_faction_event.112.t: "Anti-War Protest by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.112.desc: "The [TRN_faction_event_2_name_text] faction has taken to street protests with criticism of the war we are waging as their main topic. The [TRN_faction_event_2_name_text] side claims the war we are fighting is severely impoverishing the lives of commoners, occupying the main roads and causing unrest."
 TRN_faction_event.112.a: "This isn't good."

 TRN_faction_event.121.t: "State Government Occupation by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.121.desc: "The [TRN_faction_event_2_name_text] side has forcibly occupied the state government of [TRN_faction_event_121_target.GetName] and proclaimed a revolution under the pretext of overthrowing us and establishing a new system.\n\nFortunately, public agitation does not seem large, and we can suppress them immediately if we wish, but if we truly take action, their approval rating may rise significantly."
 TRN_faction_event.121.a: "Approach them conciliatorily."
 TRN_faction_event.121.b: "Suppress them immediately!"

 TRN_faction_event.122.t: "Protest to Stop Economic Mobilization by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.122.desc: "The [TRN_faction_event_2_name_text] side is criticizing the scale of our economic mobilization and is pasting official notices all over the main roads demanding the immediate lifting of mobilization.\n\nThe demands of [TRN_faction_event_2_name_text] are gradually gaining public support, and if we ignore their demands, their approval rating may rise significantly."
 TRN_faction_event.122.a: "..."

 TRN_faction_event.123.t: "Protest to Stop Forced Conscription by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.123.desc: "The [TRN_faction_event_2_name_text] side claims our conscription policy is excessive, demanding the immediate cessation of forced conscription and the return of forcibly taken soldiers to their homes.\n\nThe demands of [TRN_faction_event_2_name_text] are gradually gaining public support, and if we ignore their demands, their approval rating may rise significantly."
 TRN_faction_event.123.a: "..."

 TRN_faction_event.131.t: "Strike by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.131.desc: "The [TRN_faction_event_2_name_text] side has started a large-scale strike using the labor unions they control.\n\nThe [TRN_faction_event_2_name_text] side has declared an indefinite strike until we meet their demands, which will deal a serious blow to our industrial plans."
 TRN_faction_event.131.a: "Let us begin negotiations."

 TRN_faction_event.132.t: "Dismissal of Minister by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.132.desc: "The [TRN_faction_event_2_name_text] side has used their influence in the government to dismiss one of our key figures.\n\nThe [TRN_faction_event_2_name_text] side is sternly warning us that if we continue to marginalize them in the government, there will be a greater price to pay."
 TRN_faction_event.132.a: "Oh dear."

 TRN_faction_event_132_tt: "Dismissal of §Y[THIS.GetName]'s§! §YAdvisor§!"
 TRM_forced_dismissal_flag: "§YRecently Dismissed§!"

 TRN_faction_event.211.t: "Assembly of the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.211.desc: "One of our opposing groups, the [TRN_faction_event_2_name_text] faction, held a small meeting.\n\nThe meeting began with criticism of [ROOT.GetLeader]'s policies and mainly discussed plans to determine the direction of the [TRN_faction_event_2_name_text] faction and gather supporters."
 TRN_faction_event.211.a: "Still, there's no problem."

 TRN_faction_event.212.t: "[TRN_faction_event_2_name_text] Requesting to Join the Administration"
 TRN_faction_event.212.desc: "The [TRN_faction_event_2_name_text] side has expressed their desire to participate in our administration. The [TRN_faction_event_2_name_text] side generally had a poor relationship with us, but it seems they are trying to improve relations while seeking increased influence through this opportunity."
 TRN_faction_event.212.a: "This is a good thing."
 TRN_faction_event.212.b: "I cannot trust their intentions."

 TRN_faction_event.221.t: "[TRN_faction_event_2_name_text] Faction Demands Development of [TRN_development_of_specific_state_event_target.GetName]"
 TRN_faction_event.221.desc: "The [TRN_faction_event_2_name_text] side has stated a position to attract industry to [TRN_development_of_specific_state_event_target.GetName], led by the claim that the state is suffering economically."
 TRN_faction_event.221.a: "Understood for now."

 TRN_faction_event.222.t: "Government Lobbying by the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.222.desc: "News has arrived that the [TRN_faction_event_2_name_text] faction has secured influence through political support of our government figures.\n\nIt appears that several of our personnel have been won over by them due to this lobbying, and we have no choice but to watch their influence increase."
 TRN_faction_event.222.a: "..."

 TRN_faction_event.223.t: "[TRN_faction_event_2_name_text] Criticizes Us"
 TRN_faction_event.223.desc: "In a recent corruption scandal involving several administration personnel, the [TRN_faction_event_2_name_text] side has launched harsh criticism, claiming we are the center of the incident.\n\nThrough this public criticism, they have drawn support from the students and are weakening our influence."
 TRN_faction_event.223.a: "Oh dear."

 TRN_faction_event.231.t: "[TRN_faction_event_2_name_text] Leading Economic Plans"
 TRN_faction_event.231.desc: "The [TRN_faction_event_2_name_text] side used their government influence to exert great power in establishing this economic policy, and we must proceed with construction according to said economic policy."
 TRN_faction_event.231.a: "Too much interference."

 TRN_faction_event.232.t: "[TRN_faction_event_2_name_text] Attacks the [TRN_faction_event_3_name_text] Faction"
 TRN_faction_event.232.desc: "The [TRN_faction_event_2_name_text] side has begun a political offensive against the [TRN_faction_event_3_name_text] faction, one of our main allies. The [TRN_faction_event_3_name_text] side requested help from us, but the image of that faction has already been significantly tarnished."
 TRN_faction_event.232.a: "It can't be helped."
 TRN_faction_event.232.b: "Issue a statement of support."

 TRM_government_plan_good: "Included in industrial plan"
 TRM_government_plan_bad: "Not included in industrial plan"

 TRN_faction_event.311.t: "[TRN_faction_event_2_name_text] Faction Expresses Concern Over Economic Mobilization"
 TRN_faction_event.311.desc: "The [TRN_faction_event_2_name_text] faction has expressed deep concern regarding the economic problems that our economic mobilization policy might bring.\n\nThat faction is one that maintains a friendly relationship with [ROOT.GetLeader], but it seems problems have arisen in the friendship due to the recent mobilization order."
 TRN_faction_event.311.a: "Oh dear."

 TRN_faction_event.312.t: "[TRN_faction_event_2_name_text] Faction Expresses Concern Over Large-Scale Conscription"
 TRN_faction_event.312.desc: "The [TRN_faction_event_2_name_text] faction has engaged in an in-depth discussion regarding our conscription policy.\n\nThat faction is one that maintains a friendly relationship with [ROOT.GetLeader], but it seems problems have arisen in the friendship due to the recent conscription."
 TRN_faction_event.312.a: "It can't be helped."

 TRN_faction_event.313.t: "Assembly of the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.313.desc: "The [TRN_faction_event_2_name_text] faction held a meeting to expand their influence by using their political cooperation with us.\n\nThe faction decided to use their friendly relationship with [ROOT.GetLeader] to secure political influence, and just a few days after the assembly, they are putting up propaganda materials."
 TRN_faction_event.313.a: "Not bad."

 TRN_faction_event.321.t: "Popularization of the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.321.desc: "It appears the [TRN_faction_event_2_name_text] faction has secured a position as the moderate force within Trinity.\n\nIt seems their appearance of not engaging in radical or anti-government activities has appealed friendly to the public.\n\nHowever, as the faction expands, it has emerged as one of the main opposition parties to our government, and this does not seem like it will have a good impact on us."
 TRN_faction_event.321.a: "Hmm..."

 TRN_faction_event.322.t: "Radicalization of the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.322.desc: "The [TRN_faction_event_2_name_text] faction seems to have rallied around recently emerged political leaders, with radicalism taking over the mainstream of the faction in line with the threatening domestic situation.\n\nThe trajectory of the [TRN_faction_event_2_name_text] faction, which was previously our political ally, has now fallen into an unknown direction."
 TRN_faction_event.322.a: "We need to watch a little longer."

 TRN_faction_event.323.t: "[TRN_faction_event_2_name_text] Faction Opposes War"
 TRN_faction_event.323.desc: "The [TRN_faction_event_2_name_text] faction has cautiously stated their opposition to the war our nation is waging.\n\nThe [TRN_faction_event_2_name_text] side is highlighting the collapsed market order and lack of crops caused by our war, requesting that the war be stopped promptly."
 TRN_faction_event.323.a: "..."

 TRN_faction_event.331.t: "[TRN_faction_event_2_name_text] Entangled in Political Scandal"
 TRN_faction_event.331.desc: "As the [TRN_faction_event_2_name_text] faction was named as the target of a recent political scandal, the faction's approval rating has been cut by a large margin.\n\nSince we hold similar political positions with the said faction, we suffered partial damage, but it is at a very low level compared to the damage the [TRN_faction_event_2_name_text] side took."
 TRN_faction_event.331.a: "Withdraw quickly."

 TRN_faction_event.411.t: "[TRN_faction_event_2_name_text] Faction Supports War"
 TRN_faction_event.411.desc: "The [TRN_faction_event_2_name_text] side has stepped up to assist in the conduct of the war by advocating for our military operations and participating in our political propaganda.\n\nThe said faction claims our war is justified and has launched political offensives against anti-war activists."
 TRN_faction_event.411.a: "Our war is a matter of national survival."

 TRN_faction_event.412.t: "[TRN_faction_event_2_name_text] Faction Expects Price for Loyalty"
 TRN_faction_event.412.desc: "The [TRN_faction_event_2_name_text] side expects to be entrusted with an important mission in organizing this policy, citing their long-standing government support.\n\nIf we do not meet the demands of the [TRN_faction_event_2_name_text] faction, their loyalty will be significantly damaged."
 TRN_faction_event.412.a: "They will need a little reward as well."
 TRN_faction_event.412.b: "There is no place for them in our nation."

 TRN_faction_event.421.t: "[TRN_faction_event_2_name_text] Faction Organizes Mass Riot"
 TRN_faction_event.421.desc: "A large-scale mass riot has broken out, stemming from the excessive loyalty of the [TRN_faction_event_2_name_text] faction toward us.\n\nIn the riot carried out by the faction, indiscriminate assaults against our political enemies continued, which dealt a serious blow to the political image of both the faction and ourselves."
 TRN_faction_event.421.a: "Ah, damn it."

 TRN_faction_event.422.t: "Support from the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.422.desc: "The [TRN_faction_event_2_name_text] faction has carried out effective propaganda for our government as its main supporter.\n\nThrough this propaganda, our securing of political resources has become smooth, and the power to form new policies centered on us has been established."
 TRN_faction_event.422.a: "Good."

 TRN_faction_event.431.t: "Voluntary Enlistment from the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.431.desc: "Members of the [TRN_faction_event_2_name_text] faction have enlisted in our military with a patriotic spirit to lend us strength."
 TRN_faction_event.431.a: "Excellent."

 TRN_faction_event.432.t: "Investment from the [TRN_faction_event_2_name_text] Faction"
 TRN_faction_event.432.desc: "The [TRN_faction_event_2_name_text] faction has made a large-scale financial investment into the economic projects we are conducting.\n\nThe [TRN_faction_event_2_name_text] side expressed their support for us by investing, and through this investment, momentum has been gained for industrial construction."
 TRN_faction_event.432.a: "It was worth supporting them."

