 trnfla.0.t: "기초적인 임플란트 1/2"
 trnfla.0.desc: "\"정말 여기에 있는 게 맞아?\"\n\n\"예, 그렇습니다. 확인한 정보에 의하면...\"\n\n검은 옷과 복면. 그리고 권총이라 부르기엔 조금 커다란 총을 든 두 남자가 궁전과 같은 집 앞에서 대화를 나누고 있었다. 그들은 유리조노 세이아를 습격을 하기 위해 이 늦은 밤중에 찾아온 것이다.\n\n\"후우... 이 문만 연다면, 그 여자가 있다는 거지?\"\n\n\"예... 그렇습니다. 근데 정말 이 총으로 가능하겠습니까? 아, 전에 봤지 않았습니까? 머리에 헤일로가 달린 년들 전부 총으로 쏴도 딱총 맞은 거처럼 아파만 하던거요.\"\n\n\"에이씨. 나도 몰라. 분명 중개인이 죽는다고 말 했으니 죽기야 하겠지.\"\n\n\"아니, 그래도 너무 위험하지 않습니까..? 생판 처음 보는 중개던데, 그놈이 우리를 죽이려고 보낸걸 수도 있지 않습니까?\"\n\n\"뭐라는 거야. 잔말 말고 빨리 문이나 따.\"\n\n철컥. 철커덕.\n\n남자는 제법 좋은 솜씨로 문의 잠금장치를 빠르게 해제 하였고 조용히 침입하여 온 방을 뒤졌다. 수색을 시작한 지 몇분 지나지 않아 그 둘은 누군가 침대에 곤히 잠들어 있는 걸 보았다. 한 남자는 다른 남자에게 조용히 따라오라는 손짓을 했고, 그들은 직감적으로 그 여자를 찾아내었다는 걸 알 수 있었다.\n\n둘은 그녀에게 무차별적으로 방아쇠를 당기기 시작하였다. "
 trnfla.0.a: "$GEH_event.40.a$"
 trnfla.1.t: "기초적인 임플란트 2/2"
 trnfla.1.desc: "두 남자는 침대에 잠들어 있는 여성을 확인하자 잠시 눈빛을 교환했다. 그들은 이 여자가 그들이 찾고 있던 유리조노 세이아라는 것을 직감했다. 한 남자가 다른 남자에게 손짓을 하며 조용히 다가가 방아쇠를 당기기 시작했다.\n\n총성은 밤의 고요를 깨며 울려 퍼졌다. 그러나 그들의 기대와는 달리 여성은 총알을 맞고도 그대로 일어났다. 마치 총알이 전혀 통하지 않는 듯, 그녀의 동작은 전혀 느려지지 않았다.\n\n\"뭐야, 왜 안 죽어?\" 첫 번째 남자가 황급히 다시 방아쇠를 당겼지만, 그 순간 여성은 믿을 수 없는 속도로 움직이기 시작했다. 중추신경계 반사 부스터가 발동된 그녀는 순식간에 그들에게 다가가, 그들이 반응할 틈도 없이 한 남자의 손에서 총을 빼앗아 바닥에 던져버렸다.\n\n\"젠장, 이건... 괴물이잖아!\" 두 번째 남자는 비명을 지르며 도망치려 했지만, 이미 그의 발은 땅에서 떨어지지 않았다. 여성이 그의 목덜미를 잡아들고 그를 벽에 밀쳤기 때문이다.\n\n여성은 차가운 눈빛으로 그를 내려다보며 나지막히 말했다. \"누가 너희를 고용했지?\"\n\n첫 번째 남자는 비틀거리며 뒷걸음질을 쳤지만, 이미 그를 도망칠 곳은 없었다. \"크윽, 난 몰라! 제발... 살려줘!\"\n\n여성은 그에게서 시선을 돌려, 두 번째 남자를 노려보았다. 그의 눈빛은 패닉에 휩싸여 있었다. \"젠장, 젠장! 우린 그냥 돈 받고 온 거야! 중개인이 보내서... 그 놈이 우리한테 이런 총을 주고, 널 죽이면 큰돈을 준다고 했어!\"\n\n\"중개인?\" 여성의 목소리는 여전히 침착했지만, 날카롭게 그들의 말을 받아쳤다. 그녀의 손길이 더 강해지자 남자는 헐떡이며 고개를 끄덕였다.\n\n\"그래, 중개인이 말했어... 널 죽이라고. 그 놈의 말이 진짜인 줄 알았다고!\"\n\n여성은 잠시 침묵을 지켰다. 그들의 대답이 끝나자마자 그녀는 남자들의 목을 동시에 틀어버렸다. 두 남자의 몸은 그 자리에 힘없이 쓰러졌고, 방은 다시 고요에 휩싸였다.\n\n유리조노 세이아는 아무런 감정도 없는 눈으로 쓰러진 그들을 바라보다, 그들의 시체를 무심히 넘겨다보았다. \"중개인이라...\" 그녀는 그 단어를 중얼거리며 방을 떠났다."
 trnfla.1.a: "\"중개인이라...\""
 trnfla.2.t: "\"협상가\""
 trnfla.2.desc: "\"이 쪽이 저희의 요구입니다.\"\n남자의 목소리는 차분했지만 그 속에 담긴 긴장감이 느껴졌다. 한 장의 서류가 여자의 앞에 놓였다. 서류 안에는 독일 시민들이 트리니티 종합학원에 제시한 열 가지의 요구가 적혀 있었다.\n\n여자는 서류를 바라보며 조용히 생각에 잠겼다. 요구들은 겉으로 보기에는 그다지 무리한 것이 아니었다. 오히려 당연한 권리처럼 보였다. 그러나 그녀의 내면은 그리 간단하지 않았다. 수뇌부들로부터 받은 명령이 머릿속을 맴돌았다. 절대 양보하지 말 것. 하지만 그녀는 그들이 왜 그렇게까지 완고해야 하는지 이해할 수 없었다. 당연히 들어줄 수 있는 요구조차 거부해야 한다는 그들의 냉혹함이 그녀를 질리게 했다.\n\n\"....\"\n침묵이 길어졌다. 그녀의 손가락이 서류 위를 천천히 훑었다. 한숨을 참으며 결정을 내렸다.\n\n\"좋습니다. 이 요구를 받아들이겠습니다.\"\n결국 그녀는 말했다. 그 순간 자신의 선택이 수뇌부들의 분노를 살 것이 분명하다는 사실을 직감했다. 그러나 그들의 기대에 부응하지 못하는 자신에 대한 후회는 없었다. 이 선택이 옳았다고 믿었다.\n\n남자는 미소를 지었다. \"감사합니다. 외모와는 다르게 꽤나 친절하신 분이었군요.\"\n그 말에 여자는 잠시 미묘한 감정을 느꼈다. 친절. 그 단어는 그녀의 마음에 오랜만에 울림을 주었다. 그러나 그것이 진정 친절에서 비롯된 행동이었는지는 자신도 확신할 수 없었다. 분명한 건, 그 순간 그녀는 옳은 일을 했다는 믿음 하나만으로 움직였다는 것이다."
 trnfla.2.a: "\"친절한 말은 짧고 간단하지만, 그 울림은 끝이 없다.\"-랄프 왈도 에머슨 "
 trnfla.3.t: "협상가, 그 뒤에서"
 trnfla.3.desc: "트리니티 종합학원의 회의실은 무거운 침묵 속에 가라앉아 있었다. 수뇌부의 시선은 한 곳으로 집중되어 있었다. 켄자키 츠루기. 그녀의 선택에 대한 논의는 격앙된 분위기로 흘렀고, 이제는 그녀를 정의실현부장 자리에서 경질할 것인지에 대한 결정이 눈앞에 놓여 있었다.\n\n\"이건 있을 수 없는 일입니다,\" 한 수뇌부가 목소리를 높였다. \"우리는 명령을 내려야 했고, 그녀는 그것을 따르지 않았습니다. 우리 체제의 위반입니다. 더 이상 이 자리에 둘 수 없습니다!\"\n\n켄자키 츠루기는 그 자리에 묵묵히 서 있었다. 그녀는 자신이 곧 내려질 처벌을 이미 받아들인 듯했다. 수뇌부들의 비난과 비판이 날카롭게 그녀를 겨누고 있었지만, 그들의 말에는 흔들리지 않았다. 스스로의 결정이 옳았다는 신념이 그녀를 지탱하고 있었다.\n\n그때 문이 조용히 열렸다. 회의실 안에 차가운 긴장이 감도는 와중, 키리후지 나기사가 부드럽게 들어왔다. 그녀의 표정은 여느 때와 다름없이 온화했다. 가볍게 허리를 숙이며 인사한 후, 그녀는 조용히 입을 열었다.\n\n\"평안하신가요. 여러분의 논의를 들으며 생각이 조금 정리되었답니다.\"\n\n수뇌부들은 잠시 말을 멈추고 나기사를 주목했다. 그녀의 특유의 차분한 말투는 모두의 귀를 끌었다.\n\n\"켄자키 부장의 결정을 재고할 필요가 있을 것 같습니다,\" 나기사는 천천히 말을 이어갔다. \"그녀가 내린 결정은 단지 명령을 어긴 것이 아닌, 상황을 깊이 이해하고 책임을 진 행위였습니다.\"\n\n\"키리후지 님, 그녀는 우리 명령을 어겼습니다,\" 또 다른 수뇌부가 반박했다. \"그건 단순한 불복종입니다.\"\n\n나기사는 미소를 머금고 고개를 살짝 기울였다. \"물론, 그것이 그렇게 보일 수 있겠지요. 하지만 가끔은 체제 그 자체보다 중요한 것이 있답니다. 사람의 마음과 정의 말입니다. 켄자키 부장은 그 점을 고려하여 시민들의 요구를 받아들인 것이겠지요. 단순한 반항이 아니었다는 것을 이해해 주셨으면 합니다.\n\n수뇌부들은 더 이상 아무런 말도 하지 못했고, 켄자키 츠루기는 고개를 살짝 숙여 나기사에게 고마움을 표했다. 그 순간, 그녀의 마음속에 있던 무거운 짐이 조금은 가벼워지는 듯했다."
 trnfla.3.a: "\"가난하여도 지혜로운 젊은이가 늙고 어리석은 왕보다 나으니.\"-전도서 4장 13절"
 trnfla.4.desc: "툭.\n맑은 소리와 함께 찻잔이 테이블 위에 내려졌다. 그 소리만이 조용한 집무실 안을 채웠다. 키리후지 나기사는 부드러운 미소를 지은 채, 깊은 생각에 빠져 있었다. 찻잔에서 피어오르는 은은한 향이 그녀를 감싸고 있었지만, 머릿속에는 수많은 의문이 떠다니고 있었다.\n\n'도대체 트리니티의 배신자는 누구일까?'\n'무슨 의도로 이런 행동을 하는 걸까?'\n\n그녀는 손에 들린 보고서를 내려다보며, 다시 한 번 정리된 이름들을 음미하듯 읽었다. 여러 차례 추론하고, 또 추론했지만 명확한 답이 나오지 않았다. 트리니티 종합학원을 위협하는 배신자의 정체를 찾아내는 것이 그녀의 임무였고, 그녀는 그 임무를 완벽히 수행해야 했다.\n\n\"...아지타니 히후미, 우라와 하나코, 시라스 아즈사, 그리고 시모에 코하루...\"\n차례로 이름을 읊조리며 나기사는 잠시 동안 그들의 배경을 떠올렸다.\n히후미는 페로로 게릴라 공연에 참석했다는 이유로 시험에 불참해 성적이 떨어졌다고 하지만, 실상은 '블랙 마켓'과 연관이 있는 불법적인 행위의 흔적이 있었다.\n하나코는 의도적인 성적 하락과 풍기 문란한 행동들로 주목을 받았다. 천재적인 성과를 보여주던 과거를 생각하면, 그녀의 현재 모습은 매우 수상했다.\n아즈사는 폭력적인 과거와 무장난동으로 이미 경계 대상이었고, 코하루는 성적 부진이 명확한 문제였지만, 그녀 역시 의심의 대상이었다.\n\n나기사는 깊이 생각을 정리하고 결단을 내렸다. 그녀의 눈빛이 잠시 차가워졌다.\n\n\"이들을 보충수업부로 편입시키세요. 쓰레기들은 한 바구니에 모아 두는 것이 더 효율적이거든요.\"\n\n부드러운 목소리로 명령을 내렸지만, 그 속에는 단호함이 배어 있었다. 그녀의 곁에 서 있던 티파티의 임원은 고개를 숙이며 대답했다.\n\n\"네, 알겠습니다. 나기사님.\"\n임원은 곧 집무실 문을 닫고 나갔다. 그 순간, 다시 고요한 시간이 흐르기 시작했다.\n\n나기사는 다시 찻잔을 들어올려 살짝 입을 적셨다. 차의 따스함이 그녀의 혀끝을 감쌌고, 온화한 미소가 다시 얼굴에 번졌다."
 trnfla.4.a: "아우우..."
 trnfla.5.t: "트리니티의 새로운 사업계획"
 trnfla.5.desc: "트리니티의 신규 사업설명회가 오늘 에덴에서 개최되었다. 이곳은 트리니티의 유명 사업가들이 한자리에 모인 귀중한 장소였다. 참석자들이 사교적으로 어울리는 와중에 사회자가 마이크를 가볍게 두드리며 입을 열었다.\n\"먼저, 오늘 당사의 사업설명회에 참석해 주신 사장님들께 감사드립니다. 이런 귀중한 기회를 얻으신 여러분은 선택받은 것이나 다름없습니다. 긴 설명은 생략하고, 곧바로 본론으로 들어가겠습니다. 제가 오늘 자신 있게 소개할 사업 아이템은 바로 '에코 프라이드 캐시미어 배터리'입니다! 이는 단순한 배터리가 아닙니다! 이 배터리로 말하자면..\"\n\n\n그러나 몇 분 후, 불법 사업설명회 신고를 받고 출동한 정의실현부에 의해 행사는 조기 종료되었으며, 관련자들은 체포되었다."
 trnfla.5.a: "에코..뭐..?"
 trnfla.6.t: "슈테틴 페리 사건"
 trnfla.6.desc: "늦은 밤, 평화로워야 할 슈테틴에서 중대한 사건이 발생했습니다. 평소처럼 연회가 열리고, 합법적인 도박이 성행하며 수억이 오가는 슈테틴의 페리호는 사람들로 붐비고 있었습니다. 누군가는 잃고, 누군가는 얻으며 평화로운 혼잡 속에 있던 그 순간, 갑작스러운 총성이 페리호를 뒤흔들었습니다.\n\n그 총성과 함께 약 6명의 복면을 쓴 무장 강도들이 모습을 드러냈습니다. 그들은 총기로 승객들을 위협하며 차분하지만 단호한 목소리로 외쳤습니다.\n\"여러분, 강도질 좀 하겠습니다. 다들 얌전히 계시면 아무도 다치지 않을 것입니다.\"\n\n놀란 승객들은 공포에 휩싸인 채 몸을 움츠렸고, 강도들은 계획대로 금품과 귀중품을 수거하기 시작했습니다. 한편, 페리호 경비원들이 상황을 파악하고 무장 강도들과 대치에 나섰습니다. 그러나 강도들은 이미 치밀하게 준비된 탈출 경로를 가지고 있었고, 약탈한 물품을 챙기며 혼란 속에서 빠져나가려 했습니다.\n\n이때 정의실현부가 현장에 급습했습니다. 강도들과 짧은 교전이 벌어졌고, 이 과정에서 무장 강도 중 두 명이 총상을 입었으나 나머지 강도들과 함께 도주하는 데 성공했습니다. 정의실현부는 끝내 이들을 체포하는 데 실패하며 사건은 미제로 남게 되었습니다."
 trnfla.6.a: "20세기에 무법자라니?"
 trnfla.7.t: "어여쁜 마을에서의 산보"
 trnfla.7.desc: "쾨니히스베르크, 현 트리니티에는 서로를 향해 깊은 악감정을 품고 있는 두 가문이 존재했습니다. 이 두 가문은 오랜 경쟁과 갈등 속에서 대립을 이어왔지만, 혜성처럼 등장한 무법자 집단이 이들 사이의 긴장감을 교묘히 이용하기 시작했습니다. 무법자들은 경찰관을 사칭하며 두 가문을 속이고, 그들의 대립을 자신들의 금전적 이익을 위한 도구로 삼으려 했습니다.\n\n그러나 두 가문 모두 이 무법자 집단의 존재를 꺼려했고, 결국 한쪽이 먼저 이들을 제거하기로 결심했습니다. 철저히 계획을 세운 가문은 무법자들을 함정으로 유인하기 위해 트리니티 시 중앙에 인력을 배치했습니다. 무법자들은 이들의 계획을 알지 못한 채 중앙으로 모습을 드러냈고, 긴장감이 감도는 순간, 가문의 경찰 중 한 명이 방아쇠를 당기며 전투가 시작되었습니다.\n\n격렬한 교전은 빠르게 진행되었습니다. 무법자들은 강력한 화력으로 저항하며 가문 측 경찰들을 모두 사살하는 데 성공했지만, 경찰들도 완전히 무력하게 당하지는 않았습니다. 경찰들은 전투 중 무법자 한 명을 사살하는 데 성공했고, 무법자 집단이 트리니티 시를 떠나도록 압박하며 작전을 마무리 지었습니다.\n\n정의실현부가 도착하였을 때는 이미 무법자들은 도시를 떠난지 오래였습니다."
 trnfla.7.a: "그들의 사격 솜씨 하난 인정 해야겠군."
 trnfla.8.t: "예나 지금이나 가문 싸움"
 trnfla.8.desc: "브러진 시체들은 이미 오래전에 총격으로 생명을 잃은 상태였습니다. 그곳에 남겨진 것은 폐허와 충격적인 잔혹함뿐이었습니다.\n\n이 끔찍한 사건의 발단은 오직 무법자들만이 알고 있을 것입니다. 그들은 자신들이 트리니티 시에서 겪었던 사건에 대한 복수였는지, 혹은 전혀 다른 이유에서였는지는 알 수 없지만, 그 어떤 범죄보다 잔혹하게 이들을 살해하고 불태웠습니다. 문자 그대로 가문을 파괴하며 무자비한 복수극을 펼쳤습니다.\n\n가문 일원들 중 생존자는 현재까지 단 한 명도 확인되지 않았습니다. 만약 이 비극이 사실이라면, 무법자 집단은 복수심에 사로잡혀 하나의 가문을 멸족시킬 정도로 극단적인 행보를 보였다는 것을 의미합니다.\n\n상황은 사건 발생 후 한참이 지나서야 정의실현부가 출동하면서 정리되었습니다. 희생자들의 시신은 모두 수습되었습니다."
 trnfla.8.a: "그렇게 교양 없이 나오시겠다."
 trnfla.9.t: "가장 우리다운 우리"
 trnfla.9.desc: "수많은 사람들을 충격에 빠뜨린 소식이 있습니다. 바로 트리니티 제2의 도시, 바시스 스콜라에서 발생한 대담한 강도 사건입니다. 트리니티 사회에 끊임없이 문제를 일으키던 악명 높은 무법자 갱단이 이번에는 군인들의 봉급을 실은 열차를 습격했습니다.\n\n열차는 바시스 스콜라를 지나던 중 갱단의 기습을 받았습니다. 이 소식을 듣고 바시스 스콜라 경찰과 정의실현부가 즉각 출동했으나, 결국 열차를 추격하는 데 실패했습니다. 열차에 타고 있던 보안관들은 갱단의 압도적인 화력에 전부 사망한 것으로 추정되며, 이들을 추격하던 과정에서 발생한 사상자들까지 포함하면 사상자 수는 두 배 이상으로 증가할 가능성이 높습니다.\n\n갱단은 열차가 정차한 틈을 타 재빠르게 올라타 열차를 가로챘습니다. 이후 기관총을 동원하여 추격하는 경찰과 정의실현부를 따돌리는 데 성공했습니다. 열차가 다시 정차했을 때, 갱단은 이미 도주한 상태였으며 열차에 실려 있던 군인들의 봉급은 온데간데없이 사라졌습니다.\n\n이 사건이 속보로 전해지자 시민들은 큰 충격에 빠졌습니다. 일부는 갱단의 대담함에 열광하기도 했지만, 대다수는 이 사건을 개탄하며 분노를 표출했습니다. 분명한 것은, 이들 무법자들의 대담한 범행이 아무리 주목을 받는다 해도, 그 끝은 결코 순탄하지 않을 것이라는 점입니다."
 trnfla.9.a: "피,"
 trnfla.10.t: "피, 죽음, 구원"
 trnfla.10.desc: "정의실현부의 끈질긴 노력 끝에, 우리는 갱단의 은신처를 찾아내는 데 성공했습니다. 그러나 그곳에서 마주한 광경은 예상 밖이었습니다. 갱단 내부에 심각한 분열의 조짐이 보였고, 우리가 도착했을 때 그들은 이미 서로에게 총부리를 겨누며 대치하고 있었습니다.\n\n상황이 악화되자 정의실현부는 신속히 사살 작전을 개시했습니다. 갱단은 순식간에 와해되었고, 두 개의 세력으로 갈라져 혼란 속에서 도망치기 시작했습니다.\n\n추격전이 이어지는 가운데, 갱단의 주요 세력 중 하나였던 '집행자' 세력은 내부 분열로 종말을 맞이했습니다. 그들은 인근 돌산으로 도망쳐 마지막 저항을 시도했지만, 내부에서 배신이 발생했습니다. 한 갱단원이 집행자에게 반기를 들었고, 그들 간의 격렬한 몸싸움 끝에 배신자가 집행자를 무력화하고 결국 죽음으로 몰아넣었습니다. 남은 갱단원들은 더 이상 저항할 힘을 잃고 투항하여 정의실현부에 체포되었습니다.\n\n다른 한 세력은 여전히 도주 중이지만, 정의실현부의 포위망을 벗어날 가능성은 희박합니다. 이들 또한 머지않아 체포되거나, 저항 끝에 사살될 운명을 피하지 못할 것입니다."
 trnfla.10.a: "죽음,"
 trnfla.11.t: "인생의 굴레"
 trnfla.11.desc: "정의실현부의 끈질긴 노력에도 불구하고, 일부 갱단원들은 포위망을 뚫고 도주하는 데 성공했습니다. 그러나 정의실현부의 자체적인 논의 결과, 이들의 잔여 세력이 더는 사회에 중대한 위협이 되지 않는다고 판단되었고, 그들은 공식적으로 수배 명단에 내리는 걸 끝으로 공식적인 추적을 중단 하였습니다.\n\n갱단의 최후를 돌아보면, 그들은 결국 자유를 갈망하던 이상주의자들의 집단에 불과했습니다. 자신들만의 이상을 쫓아 결성된 갱단은 현실과의 충돌 속에서 그 이상이 산산이 부서졌습니다. 현실과의 타협은 그들에게 분열과 타락을 가져왔고, 끝내 남은 것은 죽음과 무너진 꿈, 그리고 몇몇에게 주어진 구원의 기회뿐이었습니다.\n\n그들의 이름은 한때 수많은 사람들에게 알려졌고, 트리니티 전역에서도 회자되었습니다. 그러나 그러한 명성은 오래가지 못할 것이며, 역사의 한 페이지에도 불과한 기록으로 남을 뿐입니다.\n\n갱단원들의 이후 행적은 자세히 조사되거나 추적되지 않았습니다. 하지만 시간이 지나면서 그들 중 일부는 가족을 이루며 조용히 살아갈 것이고, 나머지는 결국 죽음을 통해 죗값을 치르게 될 것입니다."
 trnfla.11.a: "구원."
 trnfla.12.t: "유리조노 세이아 음모론"
 trnfla.12.desc: "오늘 트리니티에서 큰 논란을 일으킨 음모론이 등장했습니다. 유리조노 세이아가 사실 사망하지 않았으며, 구호기사단과 공모해 사건을 은폐했다는 내용이 핵심입니다.\n\n1년 전, 미소노 미카가 트리니티의 정권을 잡는 데 결정적 계기가 된 사건 중 하나는 유리조노 세이아 암살 사건이었습니다. 당시 이 사건은 트리니티 사회에 엄청난 파장을 일으켰습니다. 이후 유리조노 세이아는 구호기사단에 의해 수습되었고, 구호기사단 측은 그녀가 치료를 받기 전 사망 하였다고 발표하며 공식적으로 죽음을 확인했습니다.\n\n그러나 이번 음모론에 따르면, 구호기사단장 아오모리 미네와 유리조노 세이아 사이에 어떤 거래가 있었으며, 이 거래의 일환으로 유리조노 세이아의 사망 소식이 거짓 발표되었다는 주장이 제기되었습니다. 거래의 실체와 발표의 배경은 아오모리 미네와 유리조노 세이아만이 알고 있을 것으로 보입니다.\n\n구호기사단 측은 이러한 음모론을 강력히 부정하며 내용을 전면 반박했지만, 논란은 쉽게 가라앉지 않을 조짐을 보이고 있습니다."
 trnfla.12.a: "세이아 쨩..  지금이라도 괜찮으니까..."
 trnfla.13.t: "'나치즘'"
 trnfla.13.desc: "에덴의 지식인들 사이에서 나치즘과 국가사회주의독일노동자당(NSDAP)에 대한 연구가 활발히 진행되고 있습니다. 트리니티가 동부 독일을 지배하기 이전, 이들은 독일을 지배했던 이념과 정당으로, 1933년부터 1935년까지 독일의 정권을 장악한 바 있습니다.\n\n나치즘의 주요 이념은 무엇이었을까요? 이들은 권위주의적 전체주의 국가를 지향했으며, 1933년 통과된 '수권법'을 근거로 다른 정당들을 탄압하고 일당 독재 체제를 구축하였습니다. 또한, 반유대주의를 바탕으로 '유대인'을 비롯한 특정 집단을 차별하고 박해하였으며, 독일 민족주의를 내세워 독일 민족의 우월성을 강조하고 독일인의 생활권 확보라는 비정상적인 목표를 주장하였습니다.\n\n경제적으로는 대규모 공공사업을 통해 경제 회복을 추진하였으며, 독일 국방군의 재건에도 힘을 기울였습니다. 많은 연구자들은 \"대전이 사태가 존재하지 않았다면, 독일이라는 국가는 결국 전쟁을 벌였을 것\"이라 주장하고 있으며, 이는 학계에서도 폭넓은 동의를 받고 있는 견해입니다.\n\n이들의 집권 과정은 마치 야수가 먹잇감의 약점을 간파하여 공략하는 것과 같았습니다. 그 결과, 수권법을 통해 절대 권력을 거머쥐었으며, 경제 회복을 위한 공공사업을 통해 독일 국민들의 지지를 얻는 데 성공하였습니다. 어쩌면 우리는 이들에게서 무엇인가를 배울 수 있을지도 모릅니다."
 trnfla.13.a: "영감이 하나 떠오르는 군"
 trnfla.14.t: "총학생회장의 행방?"
 trnfla.14.desc: "총학생회의 공식 발표를 통해, 총학생회장이 현재 실종 상태에 놓여 있다는 사실이 확인되었습니다. 그간 수면 아래에서 제기되어 왔던 각종 추측과 음모론이 현실이 된 순간이었으며, 총학생회가 이를 공식 인정한 것은 극히 이례적인 일입니다.\n\n실종 사실이 발표되자, 총학생회는 즉시 다수의 전문 요원들로 구성된 수사팀을 조직해 그녀의 행방을 추적하고 있으며, 키보토스 전역의 정보망을 총동원해 실종 당시의 정황을 분석 중입니다. 그러나 그녀의 행적은 철저히 베일에 가려져 있고, 외부 개입부터 내부 배신에 이르기까지 다양한 가능성이 조심스럽게 거론되고 있습니다.\n\n총학생회장은 키보토스의 질서와 균형을 상징하는 핵심 인물이자, 각 학원 간 갈등을 조율할 수 있는 유일한 정당성을 가진 존재입니다. 그녀의 부재는 단지 한 인물의 실종이 아닌, 키보토스 전체의 정치적 공백을 의미하며, 학원 간 힘의 균형마저 뒤흔들 수 있는 중대한 위기로 작용하고 있습니다.\n\n이미 일부 학원에서는 이 혼란을 기회 삼아 세력 확장이나 독자 노선을 모색하려는 움직임이 감지되고 있으며, 이러한 조짐은 자칫 키보토스 전역의 분열과 충돌로 번질 가능성도 내포하고 있습니다.\n\n트리니티를 비롯한 주요 학원들은 상황을 예의주시하고 있으며, 총학생회의 권위와 존속 자체가 흔들릴 수도 있는 중대한 기로에 놓여 있습니다. 지도자를 잃은 키보토스는 지금, 혼돈의 소용돌이 속에서 새로운 선택을 강요받고 있습니다."
 trnfla.14.a: "충격적인 소식이다."
 trnfla.15.t: "동행인"
 trnfla.15.desc: "유리조노 세이아 암살 사건을 기점으로 시작된 미소노 미카와 파테르 분파의 정권 찬탈은 보수주의자들이 그들과 거리를 두게 만드는 계기가 되었습니다. 그러나 대중들은 오히려 파테르 분파와 미소노 미카에게 더욱 몰려들었으며, 미소노 미카는 자신의 지배를 헌법적으로 보장받기 위해 헌법 개정안을 통과시키는 등 정권의 정당성을 강화하는 데 힘썼습니다.\n\n트리니티의 중도 분파들은 암살 사건 이후 급격히 무너졌고, 이에 따라 보수적 성향이 강하거나 엘리트주의적 인사들이 승승장구하는 파테르 분파에 합류하기 시작했습니다. 이들은 파테르 분파 내에서 일종의 '온건파'를 형성하게 되었습니다.\n\n그러나 '온건파'라는 단어가 이들을 완벽하게 설명하는 것은 아닙니다. 그들은 대체로 정치적 폭력이나 절대적 독재 체제, 혹은 고참 파테르 분파 임원들의 극단적인 주장에 동조하지 않지만, 다른 선택지가 없을 때는 미소노 미카를 지지하는 쪽으로 기울어질 것입니다. 애초에 이러한 혼란 속에서 트리니티를 이끌 수 있는 인물은 그녀밖에 없습니다.\n\n다른 분파들, 특히 키리후지 나기사는 게헨나와의 평화 조약을 주장할 것입니다. 그러나 과연 지금, 이런 시국에서 평화 조약이 현실적인 해결책이 될 수 있을까요? 분명한 것은 기존의 티파티 삼두정 체제는 실패했다는 사실입니다. 지금 트리니티에 필요한 것은 혼란을 극복할 수 있는 강력한 지도력과, 국가를 위해 헌신할 애국자들입니다.\n\n현재 '온건파'의 주요 인사로는 타나카 미호, 사토 유카와 같은 전 상투스 분파 임원들, 그리고 나가요시 스바루, 야마모토 나나와 같은 전 필리우스 분파 임원들이 있습니다. 이들은 점차 파테르 분파의 현 체제에 순응해가며, 새로운 트리니티 질서에 적응하고 있습니다."
 trnfla.15.a: "더 많은 이가 그녀의 뒤를 따르겠지!"
 trnfla.16.t: "부작용"
 trnfla.16.desc: "트리니티는 재산업화 정책을 통해 줄어든 부지를 최대한 효율적으로 활용하고자 다방면의 노력을 기울였습니다. 그 결과, 일부 영역에서는 실질적인 효과가 나타났고, 새로운 공업지대와 주거단지들이 빠르게 조성되기 시작했습니다. 그러나 문제는 전혀 없지 않았습니다. 확장된 개발 범위 안에서 트리니티가 일부 부지를 강제로 매입하면서, 원래 그 땅에 살던 주민들과의 분쟁이 발생한 것입니다.\n\n전문가들은 이러한 충돌 가능성을 사전에 예측했지만, 준비된 보상안은 실질적인 피해와 상실감을 해소하기에는 지나치게 부족했습니다. 일부 주민들은 당초 제시된 조건에 강하게 반발하며, 더 많은 보상과 권리를 요구하는 대규모 시위에 나섰습니다. 이들은 개발계획의 중단 또는 전면 재조정을 요구하며, 저항의 수위를 점점 높여가고 있습니다."
 trnfla.16.a: "\"미, 미안! 최대한 빨리 도와줄게!\""
 trnfla.16.b: "\"그렇지만.. 응. 재정의 안정성이 먼저라서..\""
 trnfla.16.c: "\"원래 이들 땅이였으니 보상하는게 맞지 않아?\""
 trnfla.16.d: "\"아하핫! 그래서 뭐? \""
 trnfla.17.t: "침울한 하늘 아래에서"
 trnfla.17.desc: "오늘따라 날이 어둡고 무거웠다. 회색 구름이 낮게 깔려 있었고, 바람은 묵묵히 폐허 같은 거리를 스쳐 지나갔다. 모리즈키 스즈미는 아직도 자신이 이곳으로 발령받았다는 사실이 믿기지 않았다. 트리니티 호스트의 명령은 가차 없었고, 그는 순리에 따라 움직일 수밖에 없었다.\n\n그녀는 평소처럼 순찰을 돌고 있었다. 정의실현부와 테러리스트들 사이의 산발적인 교전이 끊이지 않는 고위험 지역. 거리는 텅 비어 있었고, 창문은 굳게 닫혀 있었다. 시민들은 집 밖으로 나올 생각조차 하지 않았다. 아니, 어쩌면 이곳에는 애초부터 사람이 존재하지 않았던 것일지도 모른다.\n\n삭막한 거리의 끝자락, 그의 임시 거처가 있었다. 낡고 바랜 문을 밀고 들어가자 오래된 공기가 피부에 달라붙었다. 그는 무겁게 한숨을 내쉬고, 손에 묻은 먼지를 씻어내듯 간단히 씻은 뒤 책상에 앉았다. 보고서를 작성해야 했다. 순찰 지역의 동향, 보이지 않는 적들의 흔적, 그리고 그 모든 것 사이에서 어딘가로 흘러가고 있는 자신의 그림자.\n\n보고서를 정의실현부로 이관하는 순간, 머릿속을 수많은 생각들이 지나갔다. 의무감. 처음 이 일을 시작했을 때, 그것은 확고한 것이었다. 신념이었고, 명예였고, 모든 것을 지탱하는 기둥이었다. 그러나 지금, 그는 자신의 신념이 천천히 무너지고 있음을 느꼈다.\n\n무엇을 위해, 어디를 향해 이 길을 걷고 있는가."
 trnfla.17.a: "그녀는 알지 못했다."
 trnfla.18.t: "갑작스러운 제안"
 trnfla.18.desc: "사다리 위에서 마지막 고서를 밀어 넣은 순간, 코제키 우이는 안도의 숨을 내쉬었다. 문제는 그게 끝이 아니었다. 사다리는 삐걱거렸고, 다리는 이미 떨리고 있었다.\n\n\"우, 우와아아...\"\n\n조심스럽게 발을 내딛으려는 찰나-\n\n\"우이쨩!\"\n\n\"꺄아아아악!!\"\n\n깜짝 놀란 우이는 중심을 잃고 사다리에서 떨어졌다. 바닥에 철퍼덕, 고통보다 더 먼저 찾아온 건 창피함이었다. 날개를 퍼덕이며 내려온 미카가 얼굴을 들이밀었다.\n\n\"아핫☆ 진짜 그렇게 놀랄 줄은 몰랐지? 미안~!\"\n\n\"미, 미카 님... 제 손가락만은...\"\n\n무언가 잘못 들킬 뻔했지만, 다행히 미카는 딴 얘기를 꺼냈다.\n\n\"우이쨩, 너 고서 정리 같은 거 잘하잖아? 경제도 좀 알지?\"\n\n\"...전 고문자 해독은 좀 하지만, 경제는...\"\n\n\"그럼 됐어! 사실 나, 새로운 동아리 하나 만들었거든~ 이름하여 '학원경제개발부'! 귀엽지 않아?\"\n\n\"...제 의견은...?\"\n\n\"응? 당연히 우이쨩이 도서부를 그만두고, 경제개발부 부장이 되는 거지. 재미있을 것 같지 않아~?\"\n\n\"저, 그건 좀... 저는 그다지 그런 쪽에 소질이...\"\n\n그 순간, 미카의 표정이 살짝 바뀌었다. 웃고는 있었지만, 그 눈빛은 조금도 웃고 있지 않았다.\n미카는 천천히 뭔가를 꺼냈고, 차가운 금속의 감촉이 우이의 이마에 닿았다.\n\n\"우이쨩, 지금 나랑 장난치는 거야? 진심이야?\"\n\n심장이 쿵, 하고 내려앉았다. 우이는 숨도 쉬지 못한 채, 고개를 위 아래로 흔들었다.\n그러자 미카는 다시 천진한 얼굴로 돌아왔다.\n\n\"좋아~ 이제 우이쨩은 경제개발부 소속이야! 앞으로 잘 부탁해, 부장님!\""
 trnfla.18.a: "\"어, 어째서 이렇게...\""
 trnfla.19.t: "얄마르 샤흐트"
 trnfla.19.desc: "얄마르 샤흐트는 대전이 사태가 자신의 인생을 송두리째 뒤흔들 것이라곤 상상하지 못했다. 어느 날, 그는 조국이 두 동강 나고, 그 상처 입은 땅 위로 독수리가 내려앉아 찢긴 사체를 쪼아먹는 광경을 목도했다. 그리고 그 피멍든 자리에, 국가인지, 아니면 그 흉내를 낸 무언가가 세워졌다.\n\n그가 몸담았던 라이히스방크가 불타는 모습을 지켜보며, 샤흐트는 무언가가 내부에서 산산이 부서지는 감각을 느꼈다. 그리하여 그는 고향으로 물러나 근신하며 조용한 삶을 보내기로 결심했다. 다행히도 그의 고향만은 전란에서 비껴가 있었고, 그는 그곳에서 조용히 여생을 마무리하리라 믿었다.\n\n하지만 운명은 그런 평온을 허락하지 않았다. 트리니티의 지도부에 대대적인 변화가 일었고, 예상치 못한 곳에서 다시 그의 이름이 불렸다. 학원경제개발부의 부장직. 처음에는 완강히 거절할 생각이었다. 이제는 시대에 뒤처졌다고, 자신이 맡기에는 벅차다고 느꼈기 때문이다. 하지만 정부 요원들은 집요했고, 설득은 집안의 문턱을 넘고도 한참을 이어졌다.\n\n결국 그는 제안을 받아들였고, 재건된 라이히스방크의 문을 다시 열었다. 무너진 것들 위에서, 또 한 번 경제를 일으켜 세울 준비가 되어 있었다."
 trnfla.19.a: " 인생은 오르막과 내리막으로 가득하다"
 trnfla.20.t: "트리니티 수영장 차 사건"
 trnfla.20.desc: "\"애들아 날려라!\"\n\"에라이!\"\n\n -풍덩-!\n\n참으로 충격적인 사건이 벌어졌습니다. 트리니티의 동아리 중 하나인 '다도부'가 오늘, 무력시위에 가까운 사건을 일으킨 것입니다. 사태의 발단은 단순했습니다. 동아리 예산이 삭감되자 이에 반발해 다도부는 자신들의 차 세트를 전부 수영장에 투척하는 극단적인 행동을 감행했습니다.\n\n특히 문제의 수영장이 에덴에서 멀지 않은 곳에 위치해 있었기에 사건은 빠르게 퍼졌고, 학원 내부에서 큰 파장을 일으켰습니다. 이들의 돌발 행동은 결국 정의실현부의 개입으로 진압되었으나, 수영장은 사실상 복구 불가능한 상태에 이르렀습니다. 해당 시설의 처리는 학원 예산을 통해 진행될 예정입니다"
 trnfla.20.a: "그렇다고 해도, 저 수영장의 홍차를 마실 생각은 하지 마.."
 trnfla.21.t: "디저트 약탈자"
 trnfla.21.desc: "\"미치겠다.. 진짜 다 문 닫았대.\"\n이바라기 요시미는 책상에 턱을 괴고 어두운 표정을 짓고 있었다. 시간은 어느덧 정오를 넘기고 있었다.\n\n\"그러게, 어제 너희들도 봤을거 아니야? 가게들이 전부 엉망진창이었잖아.\"\n카즈사는 당연하다는 듯이 휴대폰을 보며 말했다.\n\n\"후훗... 달콤한 세상은 그렇게 한순간에 무너지는 것이다, 라...\"\n창가에 서서 창밖을 바라보며 툭 한 마디 던진 건 유토리 나츠였다. 오늘따라 말투는 더욱 이상했고 눈빛은 허공을 헤매고 있었다.\n\n책상 위에는 지금까지 리뷰했던 디저트 가게들의 정문을 찍은 사진들이 널브러져 있었고 그 위에는 빨간 싸인펜으로 X자가 쳐져 있었다.\n\n\"여기 있는 가게들이 전부 문을 닫았다니, 말이 돼? 세상이 갑자기 달라졌어... 우리한테 대체 무슨 일이 벌어진 건지 아직도 모르겠다고!\"\n요시미는 화를 내며 말했다.\n\n\"...요시미, 요시미, 요시미. 아직도 깨닫지 못했나? 바로.. <전설의 디저트가 있는 곳> 말이야.\"\n\n\"그만 좀 해, 나츠. 진지하게 말해봐. 너 또 뭔 이상한 데 알아봤지?\"\n카즈사는 나츠가 못미더운 듯이 말했다.\n\n\"당연히 있지...\"\n나츠는 천천히 고개를 돌리며 슬쩍 웃음을 지었다.\n\"중앙구 동쪽에.. 새로운 디저트 가게가..!!\"\n\n그러자 다들 나츠를 바라보았다. 나츠는 손을 내밀며 이들에게 말했다."
 trnfla.21.a: "\"아아.. 함께 떠나겠나? '디저트'의 길로.\""
 trnfla_21_tt: "§g요시미는 말없이 그 손을 바라보다가 툴툴거리며 자리에서 일어났다.\n\"...진짜, 네가 또 이상한 데 데려가면... 아이스크림값 받아낼 거야.\"\n\n카즈사는 결국 한숨을 쉬며 말했다.\n\"말도 안 되지만, 일단 가보자.\"§!"
 trnfla.22.t: "인터넷 개통"
 trnfla.22.desc: "\"하아... 오늘도 이렇구나.\"\n미나미노 하나는 트리니티 중앙구에서 꽤나 멀리 떨어진 시골에 사는, 트리니티 종합학원 2학년이다. 동아리에는 들지 않았다. 아니, 들 수 없었다. 통학 시간이 꽤 길기 때문이다. 심지어 게다가 드물게 운행되는 노선이라, 밤 8시가 넘어서야 겨우 집에 도착한다. 그래서 하나는 집에서 인터넷을 통해 사람들과 교류하며 지내왔다.\n\n그러나 세상이 뒤바뀌고, 하나는 그 인터넷 마저 단절 되었다. 인터넷이 없는 동안, 하나는 자신이 할 수 있는걸 다해보았다. 인터넷을 연결해보겠다고 검색 엔진에 이것저것 쳐보기도 했다. (물론, 인터넷이 안 되니 아무 반응도 없었지만.) 자신의 몇 안되는 친구들과 전화 통화를 하며 지내거나 시간을 내어 중앙구로 가 카페에 들려 인터넷만 하루종일 하다가 귀가하는 등 온갖 귀찮음이 따라붙는 삶을 살았다.\n\n그러던 어느 날이었다.\n\n\"연결됐다...\"\n하나는 숨을 멈췄다. 모니터 오른쪽 아래, 그 익숙한 와이파이 아이콘에 드디어 하얀 선이 꽉 찼다. 장난처럼 깜빡이던 회색의 'X'표시가 사라진 것이다\n\n\"......하, 진짜네.\"\n믿을 수 없다는 듯 키보드를 몇 번 두드렸다. 검색창에 아무 단어나 입력했다. \"인터넷 복구됨\" \"살았다\" \"트리니티\" \"고독\" 손에 걸리는 대로. 그리고 화면이 움직이기 시작했다. 링크가 열리고, 이미지가 뜨고, 광고가 튀어나왔다. 그야말로 문이 열린 것이었다. 자신만 홀로 남겨졌던 세계에, 드디어 다시 길이 열린 것이다.\n\n\"됐다... 이거야...\"\n하나는 쿡쿡 웃었다. 거실에 울린 웃음소리는 작았지만, 정말 오랜만에 터져 나온 진짜 목소리였다."
 trnfla.22.a: "좋은 이야기군"
 trnfla.23.t: "트리니티 토지 문제"
 trnfla.23.desc: "대전이 사태 이후, 새로운 땅에 대한 조사가 완료되었습니다. 그러나 조사 결과 확보된 약 27만 제곱킬로미터의 부지는 과거 트리니티가 보유했던 거대한 영토에 비하면 턱없이 부족한 수준입니다. 특히 농업에 종사하던 이들은 농경지의 부족으로 인해 파산 위기에 직면하고 있으며, 트리니티의 과거 위상을 떠올리기에는 현 상황이 너무나 초라합니다.\n\n설상가상으로 이 땅조차 100% 활용할 수 있는 상황이 아닙니다. 독일의 보수 귀족 집단인 '융커'가 토지 반환을 거부하며 무력 시위를 벌이고 있기 때문입니다. 일부 지역에서는 용병까지 고용하여 토지를 방어하려는 움직임도 포착되고 있으며, 특히 에덴의 동쪽 오데르 강을 넘는 지역에서는 이러한 저항이 빈번하게 발생하고 있습니다.\n\n대농장이 파괴되고 경작지가 줄어들면서 농산물 가격이 급등하기 시작했으며, 그 중에서도 쌀값은 폭등하고 품귀 현상까지 빚어지고 있습니다. 대규모 농지를 운영하던 농업 종사자들은 생산 불능 상태에 빠져 파산 상태에 있으며, 이로 인한 경제적 충격은 트리니티 전체에 점차 확산되고 있습니다.\n\n이 위기는 단순한 농업 문제를 넘어 트리니티의 생존과 안정을 위협하는 중대한 사안으로 커지고 있으며, 하루빨리 해결책을 마련하지 않으면 상황은 걷잡을 수 없이 악화될 것입니다."
 trnfla.23.a: "위대한 트리니티의 대농장은 이제 과거의 유물이다..."
 trnfla.24.t: "우주에서 온"
 trnfla.24.desc: "\"비서쨩? 그래서 오늘 할 일이 뭐라고 했지?\"\n\n\"오늘은 없습니다. 게다가 어제 늦게까지 업무를 처리하셨잖습니까.\"\n\n\"...그럼 오늘만큼은 여유를 즐겨야겠네~!\"\n\n가벼운 농담처럼 던진 말에 잠깐의 웃음이 오갔다. 분위기는 한결 부드러워졌고, 미카는 다시 찻잔을 들어 올렸다. 천천히 향을 음미하며 차를 한 모금 마셨다. 익숙한 티파티 장소, 익숙한 풍경. 하지만 미소노 미카는 어딘가 허전함을 느꼈다. 차의 향이 어째서인지 평소보다 밋밋하게 느껴졌다.\n\n\"아악!\"\n\n갑작스러운 비명의 울림에 미카는 깜짝 놀라 찻잔을 내려놓고 자리에서 벌떡 일어났다.\n\n\"비서쨩?!\"\n\n놀란 표정으로 달려가자, 비서는 이마를 짚은 채 숨을 거칠게 몰아쉬고 있었다.\n\n\"허억... 허억... 괜찮습니다... 그냥, 순간적으로 머리가 깨질 듯이...\"\n\n얼굴은 창백했고, 고통의 여운은 아직 가시지 않은 듯했다. 미카는 그녀를 구호기사단에 다녀오도록 권했고, 비서는 고개를 끄덕이며 자리를 떴다. 미카는 그녀를 조용히 배웅한 뒤 다시 티 테이블로 돌아왔다.\n\n자리에 앉아 남은 차를 한 잔 더 따랐다. 오늘은 업무도 없고, 잠시 후 다시 집중하면 되겠지. 그렇게 생각하며 찻잔을 들어 올리는 순간 미카 역시 강렬한 통증을 느꼈다.\n\n쾅.\n\n머릿속이 마치 두개골 안에서 터지는 듯했다. 시야가 일그러지고, 중심을 잡기 어려웠다. 비서가 겪었던 증상과 정확히 같았다. 미카는 직감했다 이건 단순한 편두통이 아니라고.\n\n고통이 잠시 가라앉고, 미카는 책 속에 묻혀 살던 시절, 과거 역사 수업 중 배운 어떤 이야기를 떠올렸다."
 trnfla.24.a: "그것은 우주에서 온 색채다."
 trnfla.25.t: "신세계로부터"
 trnfla.25.a: "\"이 길에도 꽃이 많이 피어 있으면 좋겠네.\""
 trnfla.27.t: "백화요란 - 정의실현부 연합훈련 - 1일차"
 trnfla.27.desc: "\"우, 우와아앗! 자, 자자자, 잠깐만! 옷이 너무 예쁜데?! 오늘 연합 훈련이라 맞춰 입은 거야?\"\n\n\"네...? 이 옷들은 전부 정의실현부 제복입니다.\"\n\n\"그, 그렇다고 해도 정말 멋지다구! 뭐랄까... 책에서만 보던 교복을 실제로 보는 느낌이랄까...\"\n\n\"후후, 그렇게 말씀해 주시니 기쁘네요. 원하신다면 맞춤 제작도 가능합니다.\"\n\n\"저, 정말로...? 아, 아냐! 이렇게 막 받아도 되는 거야...?\"\n\n...\n\n\"으아아-! 정말 모르겠어! 갑자기 급성 청추니움 알레르기 쇼크가 온 것 같아! 머리가... 생각이 안 나...!\"\n\n\"죄송하지만...! 다음 훈련은 잠시 미뤄도 괜찮을까? 갑자기 어지러워서...\"\n\n\"네. 그럼 훈련은 잠시 중단하고... 저희는 그동안 백귀야행을 둘러보고 와도 괜찮을까요?\"\n\n\"...?\"\n\n\"잠깐 눈 돌린 사이에... 어디론가 가버리셨네요.\"\n\n그렇게 하스미와 정의실현부 부원들은 백귀야행을 둘러보며 1일차를 조용히 마무리했다."
 trnfla.27.a: "\"역시 받아야 할까..? 그렇지만 초면인데 덥석 받아도 되는걸까? 으으. 정말로 모르겠어~.\""
 trnfla.29.t: "본연으로"
 trnfla.29.desc: "\"오리. 오리. 응답 요망. 나는 펭귄이다.\"\n\n\"하아... 왜 아무런 답이 없는 거지? 무전기는 분명 정상인데...\"\n\n그날 이후, 모든 것이 변했다. 트리니티는 물론 키보토스 전체가 하루 종일 사태에 대한 보도로 들끓었다.\n\n계획도 산산이 흩어졌다. 그날 이후... 오리, 그러니까 미소노 미카는 단 한 번도 무전에 응답하지 않았다.\n\n돌아가야 한다. 오로지 그 생각만이 시라스 아즈사의 머릿속을 지배하고 있었다.\n\n\"...통신 종료. 이상. 펭귄이.\""
 trnfla.29.a: "Et Omnia Vanitas(모든 것이 허무로다.)"
 trnfla.30.t: "시라스 아즈사의 복귀"
 trnfla.30.desc: ""
 trnfla.30.a: "돌아온 걸 환영한다."
 trnfla.31.t: "트리니티적 사회를 향해"
 trnfla.31.desc: "중앙구에서 대규모 시위가 발생하고, 촉발된 트리니티 - 독일계 사회 문제가 해결 된지 약 두 달이 지났습니다. 당시 많은 해외 전문가들은 트리니티가 내부의 모순으로 인해 결국 붕괴할 것이라 예측했고, 자극적인 제목과 선정적인 사진들로 위기를 과장한 기사들이 쏟아졌습니다. 그러나 그러한 관측과는 달리, 트리니티는 서서히 내부 안정을 되찾고 있으며, 대전이 사태가 만든 사회적  모순들도 조금씩 해소되어가고 있습니다.\n\n미소노 미카의 정치 강령은 표면적으로는 사회 개혁, 계급 협조, 단방제를 내세우며 일견 우파적인 면모를 보이지만, 그녀의 사상적 색채는 단순히 이념의 좌우로 구분되기 어려울 만큼 복합적이고 다면적입니다. 특히 대전이 사태 이후 급격히 변화한 트리니티 학생들은 점차 미카에게 더 급진적이고 과격한 정책을 요구하고 있습니다.\n\n이러한 상황 속에서, 미소노 미카는 트리니티 고유의 강점을 지키기 위해 키보토스 총학생회와의 협력을 축소하고 있습니다. 총학생회가 추진했던 '에덴 조약'과 같은 접근 방식은 본질적인 문제 해결이 아닌, 일시적인 봉합에 불과하다는 것이 그녀의 판단입니다. 미카는 트리니티의 정체성과 이상을 외부에 의존해 타협하는 것이 아니라, 스스로의 방식으로 회복하고자 합니다. 그녀가 지키고자 하는 것은 단지 체제나 권위가 아닙니다. 그것은 트리니티 학생들의 영혼, 사랑, 그리고 청춘 그 자체입니다."
 trnfla.31.a: "모교에 영광이 있으라!"
 trnfla.32.t: "포스트모템"
 trnfla.32.desc: "\"와아~! 나기쨩! 좀 어때? 불편한 건 없어?\"\n\n\"...불편하긴 합니다. 그래도, 지하 감옥보단 낫군요.\"\n\n잠시 정적이 흘렀다. 두 사람 사이엔 묘한 긴장감이 감돌고 있었다. 각자의 자리에서 서로 다른 불편함을 느끼고 있었다.\n\n\"직접 찾아오신 거라면... 뭔가 더 남은 이야기가 있으신 건가요?\"\n\n\"...이젠 다시 못 볼 줄 알았거든.\"\n\n\"...\"\n\n나기사는 더 이상 말을 잇지 못했다. 미카는 그런 나기사의 눈빛을 잘 알고 있었다. 오랜 소꿉친구였으니까.\n\n나기사는 눈을 지그시 감고, 마치 한숨 섞인 듯한 말투로 중얼거렸다.\n\n\"당신이 이렇게까지 할 줄은 몰랐는데요... 미카 씨라면 분명 이런 때일수록\"\n\n\"왜? 어째서? 이번 사건 때문인가요? 원인불명의 대규모 사태... 혹시 그걸 기회 삼아 게헨나를 짓밟으려고? 그래서 10년 넘게 알고 지낸 소꿉친구인 저까지...?\"\n\n\"...설마 세이아 씨 일까지, 미카 씨가 관련되어 있었던 건가요?\"\n\n\"그만해, 나기쨩.\"\n\n\"이건 복잡한 얘기가 아니야. 난 게헨나를 증오해서, 사람들을 이용하고, 감금하고... 필요하면 없애버리기도 했어. 그뿐이야.\"\n\n\"...뭔가, 착오나 오해가 있었던 건 아닐까요? 사실은 전혀 다른 진실이 있는 거라든가\"\n\n\"아하하하. 다른 진실?\"\n\"그래서 내가 나기쨩을 좋아하는 거야. 순진해서. 정말로.\"\n\"나기쨩은 내가 어떤 사람인지, 전혀 몰랐던 거야.\"\n\n\"어째서... 저는...\"\n\n나기사는 다리에 힘이 풀린 듯 그 자리에 주저앉았다.\n\n\"그렇게 오래 함께했는데도 몰랐냐고? 그 대답은, 나보다 나기쨩이 더 잘 알지 않아? 우리는 결국 타인이잖아. 서로를 완전히 알 수 있을 리가 없지.\"\n\n\"...난 이제 가볼게. 할 일이 많아서.\"\n\n\"...네. 조심히 돌아가세요, 미카 씨. 배웅은... 못 해드리지만.\""
 trnfla.32.a: "나기사는 마음 속으로 마지막 인사를 남겼다."
 trnfla.33.t: "(일반)  ' 미 소 노 미 카 ' 드디어 다 깟네요                         \nKans19 | [GetDate]                                                   "
 trnfla.33.desc: "ㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡ\n\n(고양이 사진)\n\n점심 추천 해줘\n\n                                                  3 추천 | 비추천 103\n\n전체 댓글 §t51§!개 \n\n익명(123.45)       야 장난하냐?\n\nTrinity0808         아...\n\n익명(78.9)           간절한 사람 놀리는게 재밌냐?\n\nPerorolover         아하하...\n\nShimoeNoR18      사형!!!\n\nUZqueen             (\"얼탱\" 글자가 적힌 이모지)\n\n프리츠부흐로감독님사랑해(12.340)       어디가서 미소노 미카님 좋아한다고 하지 마라\n                                                          빡대가리새끼야. 유명한 트리니티 해변에서 \n                                                          몇개월만 기다리면 볼 수 있는건데 시도는 해보고 \n                                                          어그로 끌어라.\n\n...."
 trnfla.33.a: "하?"

 trnfla.1000.t: "내면의 고뇌"
 trnfla.1000.desc: "오늘은 이오치 마리에게 누구보다도 특별한 날이었다. 아이돌 무대라는 낯선 무대 위에서, 몇 가지 사소한 문제가 있었지만 그녀는 끝내 빛나는 퍼포먼스로 공연을 마무리해냈다. 화려한 조명 아래에서 반짝이던 그녀의 모습은 트리니티의 학생들에게 깊은 인상을 남겼고, 이젠 모두가 '아이돌 이오치 마리'를 기대하고 있었다. 언젠가 다시 무대에 설 그녀를 기다리며, 팬들은 열렬한 환호와 함께 공연장을 떠나갔다.\n\n그러나 무대가 끝난 그 순간부터, 마리는 혼자만의 조용한 싸움을 시작하고 있었다. 수녀로서의 삶은 그녀에게 있어 신념이자, 존재의 이유와도 같았다. 엄격한 규율 속에서 살아온 지난 시간들은 결코 가볍지 않았고, 마리 역시 그 길이 자신에게 주어진 운명이라 믿고 있었다. 하지만 무대 위에서의 짧은 순간-- 조명, 환호, 그리고 무대 아래에서 자신을 향해 손을 뻗는 수많은 시선 속에서--\n\n\"이건... 정말 괜찮은 건가요...?\"\n무대 뒤, 조용한 대기실에서 마리는 거울 속 자신의 모습을 바라보며 중얼거렸다. 반짝이는 의상과 아직 식지 않은 숨결, 손끝에 남은 박수 소리의 여운. 분명히 이건 신께서 원하신 길과는 다를지도 모른다. 하지만 그럼에도 불구하고, 마음 어딘가 깊숙한 곳에서는 계속해서 그 무대를 그리워하고 있었다.\n\n며칠간의 고민은 결코 쉽지 않았다. 기도 중에도, 고요한 성당에서도, 마리는 스스로에게 질문을 던지고 또 던졌다. 수녀로서 살아온 삶과, 무대 위에서의 '자유로운 나'. 둘 중 어느 쪽이 진짜 ‘이오치 마리’일까?\n\n그리고 마침내, 그녀는 조용히 결심을 내렸다."
 trnfla.1000.a: "나, 아이돌 선언!"
 trnfla.1000.b: "수녀로서의 각오를 다시 한 번 마음속에 새겨야겠어요!"
 trn_idol_portrait_tt: "§L이오치 마리의 초상화가 아이돌 옷으로 교체 됩니다.§!"
 trnfla.1001.t: "수도복을 벗어던지고"
 trnfla.1001.desc: "조용한 성당의 안뜰, 은은한 햇살이 스테인드글라스를 타고 떨어지는 오후였다.\n이오치 마리는 떨리는 손으로 수도복의 단추를 하나하나 풀기 시작했다. 묵주가 살짝 흔들리며 소리를 냈다. 마주 선 우타즈미 사쿠라코는 그 모습을 말없이 지켜보고 있었다.\n\n\"사쿠라코 님... 전, 더 이상 이 복장을 입고 설 수 없을 것 같아요.\"\n마리는 시선을 피하지 않은 채 말을 이었다. \"전... 아이돌의 길을 가겠습니다. 그것이 저에게 주어진 또 다른 사명이라고 믿어요.\"\n\n순간, 사쿠라코의 눈이 약간 흔들렸다. 그녀의 차분한 얼굴에 짧은 침묵이 드리웠다. 하지만 곧, 그녀는 두 손을 모으고 깊이 숨을 들이쉰 뒤, 부드럽게 고개를 끄덕였다.\n\n\"...그래요, 자매님. 당신의 결심이 신의 뜻에서 벗어나지 않기를, 저는 그저 기도할 뿐입니다.\"\n그녀는 미소 지으며 한 발 다가왔다. \"그리고 무엇보다... 당신이 자신답게 빛나는 길이라면, 저는 언제든 지지할 겁니다.\""
 trnfla.1001.a: "좋아해 줘! 좀 더! 나를 봐 줘! 좀 더!"
 trnfla_1001_tt: "§L\"...마리 자매님에게도 저런 면이 있었군요. 그나저나... 아이돌이라 하면 저나 미네 단장님 정도밖에 없었을 텐데 ...도대체 누구와 아이돌을 하시겠다는 건지, 그게 조금 걱정이네요.\"§!"

 trnfla.1002.t: "자신이 바라는 것"
 trnfla.1002.desc: "이오치 마리는 고요한 성당의 의자에 앉아, 오랫동안 흔들리는 마음을 붙잡고 있었다. 무대의 찬란함과 박수갈채, 그 속에서 피어난 감정은 너무나 강렬했고, 때로는 수도복보다 더 자신답게 느껴지기도 했다. 그러나 마리는 결국 한 가지 결론에 이르렀다.\n\n-나는, 수녀로서의 길을 계속 걷겠습니다.\n\n결심했음에도, 마음은 여전히 완전히 맑아지지 않았다. 무언가가 가슴 어딘가에 걸린 듯한 느낌. 그 답을 찾기 위해, 그녀는 늘 자신이 찾던 조용한 장소, 사격장으로 향했다. 평소와 다름없이 정돈된 공간, 고요한 바람. 그곳은 세상의 소음과도, 마음의 소란과도 거리를 둔 곳이었다.\n\n마리는 무릎을 꿇고, 조용히 기도했다. 기도는 속삭임이 되어 공기 속으로 퍼졌고, 마리는 그 속에서 자신의 깊은 속마음을 조용히 토로했다. 그리고 잠시 후- 갑작스럽게, 머릿속이 환하게 밝아지는 듯한 느낌이 들었다. 마치 아주 오랫동안 묵혀둔 생각이 스르륵 열리는 듯한 감각. 누군가가 말없이 등을 가볍게 밀어준 듯한 따스한 울림.\n\n그녀는 문득 깨달았다. 무대에서 생긴 고뇌, 자신에 대한 의심과 혼란은 결코 잘못된 것이 아니었다. 그것은 신앙을 벗어난 것이 아니라, 오히려 신앙 속에서 자신을 돌아보게 해준 기회였다. 타인의 고민을 들어주고 위로하는 삶을 살아온 자신도- 가끔은 자신의 마음을 돌보고, 하고 싶은 것을 향해 걸어갈 필요가 있다는 것을."
 trnfla.1002.a: "그 깨달음은 고요했고, 그러나 분명했다."
 trnfla_1002_tt: "§L요즘 들어, 이오치 마리를 바라보는 사쿠라코의 눈빛에는 어딘가 안도와 기쁨이 담겨 있었다. 조용히 묵주를 감싸쥔 그녀는, 창가에 앉은 마리의 활기찬 모습을 멀리서 바라보다가 부드럽게 중얼거렸다.\n\n\"최근의 마리 자매님... 참, 활기차셨어요. 보기 좋아요.\"§!"

 trinity.10000.t: "트리니티 리워크"
 trinity.10000.desc: ""
 trinity.10000.a: "2025년 1월 25일부터 시작"
 Trinity_focus: "트리니티 종합학원 중점계통도"
 # 군사 중점 
 TRN_research_rifle: "독일군 교리 분석"
 TRN_research_rifle_desc: "독일군의 전투 방식은 트리니티에게 낯설면서도 인상 깊은 것이었습니다. 기동력을 바탕으로 한 전격적인 돌파 전술은 트리니티 지휘부에 강한 충격과 함께 깊은 영감을 안겨주었고, 이는 곧 우리의 방식으로 재해석되어, 트리니티만의 독자적인 교리로 다시 태어날 것입니다."
 TRM_add_to_heer_ideas: "다음을 부여하는 §Y트리니티 지상군§! 추가:\n"

 TRM_Centralised_Command: "중앙화된 사령부"
 TRM_Centralised_Command_desc: "중앙화된 사령부는 군의 전투에 있어서 필수적입니다. 대참사를 불러오게 되는 모든 다른 방법은 우리가 무슨 수를 써서라도 피해야 할 필요가 있습니다. 장군들이 자신감 있고도 빠르게 승리로 이끌 수 있는, 잘 돌아가는 기계가 되어야만 군은 성공할 수 있습니다. 그러므로, 우리는 결합된 군사 지휘 체계를 만드는 것을 목표로 해야만 합니다."
 TRM_encourage_radio_use: "통신기 사용 장려"
 TRM_encourage_radio_use_desc: "과거의 전쟁에서 주요 혁신 기술로 무전기가 도입되었고, 이로 인해 군사 통신의 범위가 크게 확장되면서 전장에서의 지휘 및 통제 능력도 크게 향상되었습니다. 트리니티에서는 무전기의 사용이 아직 초기 단계에 머물러 있지만, 조금만 노력하면 이 새로운 기술을 우리 병력에 빠르게 적용시켜 적의 취약 지점을 대상으로 조직적이고 집중적인 타격을 가할 수 있습니다."
 TRM_Streamline_Intelligence_Gathering: "신속한 정보 수집"
 TRM_Streamline_Intelligence_Gathering_desc: "이해하지 못하는 적과 싸우는 것은 어렵습니다. 군대의 중앙집권화는 참모진에게 아군에 대한 지식을 제공했지만, 반대편에 있는 적군을 이해하는 것도 그에 못지않게 중요합니다. 이러한 정보를 수집하는 모든 수단은 군 구조에 통합되어야 합니다."
 TRM_Empower_the_Generals: "장군들에게 권한 부여"
 TRM_Empower_the_Generals_desc: "수백 년부터 내전을 겪으며 트리니티의 장군들은 모든 상황을 유연하게 대처할 수 있는 풍부한 경험을 쌓았습니다. 그들에게 필요한 것은 군대를 제대로 지휘할 수 있는 권한을 부여하고, 그 밑에 있는 사람들이 주의를 기울일 줄 아는 것뿐입니다."
 TRM_Protectors_of_the_Motherland: "모교의 수호자들"
 TRM_Protectors_of_the_Motherland_desc: "다른 군대는 황금, 명예, 신이 없는 이념을 위해 싸우지만 트리니티군은 학원과 십자가를 위해 싸웁니다. 트리니티는 많은 외국인에게 비밀이 많고 고고한 아가씨들의 학원이지만 트리니티 학생에게는 비밀이 없는 고향과도 같은 곳입니다. 트리니티 학생은 이 땅에서 위대하고 아름다운 일을 해왔고 앞으로도 할 것이며, 이 땅을 정복할 수 있다고 생각하는 학원은 큰 충격을 받을 것입니다."
 
 TRM_Asymmetric_Tactics: "임무형 전술"
 TRM_Asymmetric_Tactics_desc: "예로부터 불투명하고 느린 지휘 체계는 어려움을 불러왔고 전술적 패배를 앞당기는 체계입니다. 수백 년 전의 내전 당시에는, 의사결정권을 하급 부대에 분산시켜 현장 상황에 따라 하급 장교들이 상관의 명령을 수동적으로 기다리지 않고 전술적 판단을 스스로 내리도록 장려하는 문화를 조성하여 문제를 해결했습니다."
 TRM_Decentralised_Structure: "분권화된 구조"
 TRM_Decentralised_Structure_desc: "정통 군사 사상은 체스판의 말처럼 군대를 지휘하는 최고 장군의 우월성을 숭배하는 경향이 있습니다. 하지만 전쟁의 현실은 지저분하고 복잡합니다. 지나치게 중앙집권적인 지휘 구조는 현대 전쟁의 빠른 속도 속에서 경직되고 유연하지 못할 위험이 있습니다. 보다 분권된 구조는 이러한 함정을 피할 수 있습니다."
 TRM_Trinity_Field_Artillery: "트리니티 야전 포"
 TRM_Trinity_Field_Artillery_desc: "트리니티의 야포는 다른 학원에서도 명성이 자자합니다. 높은 정확도와 엄청난 파괴력으로 인해 폭격 지점은 말 그대로 평탄화됩니다. 이제 에덴 설계국과의 협업을 통해 트리니티만의 야포 성능을 더욱 향상시키고, 더 강력한 파괴력을 확보해야 합니다."
 TRM_Officer_Initiative: "장군 자율성"
 TRM_Officer_Initiative_desc: "현대 전쟁은 혼돈 그 자체입니다. 최고 사령부의 시각과 실제 전장 상황은 크게 다를 수 있으며, 상황은 순식간에 변할 수 있습니다. 따라서 현장 장교들에게 목표 설정과 중요 결정의 권한을 부여하는 것이 필요합니다. 이를 통해 우리 군은 압박 상황에서도 빠르게 적응하고 효과적으로 대응할 수 있습니다. 이는 분권화된 지휘 체계의 중요성을 강조하는 것으로, 현대 전장의 불확실성에 대처하는 효과적인 전략입니다."
 TRM_unity_of_doctrine: "교리 통일"
 TRM_unity_of_doctrine_desc: "트리니티 장교단은 경험이 풍부하고 뛰어난 실력을 갖추고 있으나, 군사 교리에 대한 접근은 천차만별입니다. 지상군 개혁은 주로 조직 문제에만 치중했고, 장군들은 각자 원하는 방식대로 전쟁을 수행할 수 있었습니다. 그러나 장교들마다 작전 수행 방식은 판이하며, 이는 일관된 군사적 성공을 거두는 데 걸림돌이 될 수밖에 없습니다."
 TRM_Reorganise_Armament_Production: "군수 생산 재편성"
 TRM_Reorganise_Armament_Production_desc: "현재의 무기 생산 현황은 한마디로 재앙과도 같습니다. 대전이의 여파가 아직도 남아있습니다. 생산 체인은 종종 단절되거나 구식이거나 둘 다인 경우가 많으며, 현대 군대가 싸울 수 있는 조건이 아닙니다. 이 시스템을 철저히 재편해야만 병사들이 트리니티의 적과 싸울 수 있는 총을 확보할 수 있습니다."
 TRM_Expand_the_Logistics_Corps: "보급부대 확장"
 TRM_Expand_the_Logistics_Corps_desc: "트리니티 내전 당시의 가장 큰 교훈 중 하나는 현대 군대에게 물류가 무엇보다도 중요하다는 것입니다. 군사 장비, 연료와 같은 특수 자원, 간단한 생활 필수품이 모두 적시에 제공되지 않으면 군대는 존재할 수 없습니다. 따라서 군대의 확장은 반드시 군수단의 확장과 함께 이루어져야 합니다."
 TRM_Local_Workshops: "지방 작업장"
 TRM_Local_Workshops_desc: "산업 전쟁 시대에는 군사 생산을 늘리기 위해 모든 수단을 강구해야 합니다. 전국의 지역 작업장 시스템을 통해 지역 상황을 고려한 방식으로 생산을 조직하고, 산업이 가능한 가장 작은 정착지까지 생산을 확대할 수 있습니다."
 TRM_Terrestrial_Dreadnoughts: "에덴 전차 설계부 확대"
 TRM_Terrestrial_Dreadnoughts_desc: "에덴 전차 설계부는 트리니티 내에서도 손꼽히는 기술력을 자랑하는 조직으로, 고품질 전차의 연구·설계·양산을 전문적으로 담당하고 있습니다. 이들은 전차 기술에 대한 깊은 이해와 수년간 축적된 노하우를 바탕으로, 키보토스 전체에서도 그 우수성을 인정받고 있습니다. 만약 이러한 시설과 인력을 더욱 확충하고, 설계부에 대한 지원을 강화한다면 트리니티는 향후 전차전에서 뚜렷한 전략적 우위를 점할 수 있을 것입니다."
 TRM_superb_training: "최고의 훈련"
 TRM_superb_training_desc: "군대의 강함은 병사 개개인의 전투력에 달려있습니다. 전쟁에서 새로운 기술과 혁명에 대한 모든 소음이 들리더라도 이를 활용하려면 필연적으로 군인이 있어야 하며, 무기 사용법을 훈련받지 않은 군인은 총을 든 농부에 불과합니다. 트리니티 군대는 세계 최고가 되어야 하며, 따라서 우리 군인들도 세계 최고가 되도록 훈련받아야 합니다."
 TRM_Expand_The_High_Command: "최고사령부 확장"
 TRM_Expand_The_High_Command_desc: "군의 최고 지휘부는 과거의 트리니티 내전 때처럼 높으신 분들의 사교 클럽이 될 수 없습니다. 군의 효율성을 저해하는 배타성과 파벌은 용납될 수 없으며 용납되지도 않을 것입니다. 대신 최고로 뛰어난 지휘관들이 모두 포함되도록 참모진을 확대할 것입니다. 최고 중의 최고만이 세계 최강의 군대를 이끌 수 있습니다."
 TRM_Officer_Training_Academies: "육군사관학교"
 TRM_Officer_Training_Academies_desc: "내전 당시의 기록으로 수많은 인재가 양성이 될 교본이 되었지만, 낡은 사관학교 구조는 이러한 지혜를 군대에 전파하는 데 적합하지 않은 경우가 많았습니다. 장군뿐만 아니라 하급 장교들에게도 현대 전쟁 기술을 제대로 가르칠 수 있도록 사관학교를 개편해야 합니다."
 TRM_Combined_Arms: "제병합동"
 TRM_Combined_Arms_desc: "복합 무기 이론은 군사 기술 발전의 논리적 결론으로 제시됩니다. 보병, 기갑, 공군, 해군의 조합을 동시에 활용하여 방어가 불가능한 공격을 만들어내는 전투 무기의 완벽한 조화를 구상합니다. 매력적인 비전입니다." 
 TRM_Mass_Breakthroughs: "대규모 돌파"
 TRM_Mass_Breakthroughs_desc: "기갑은 미래입니다. 기술의 발전으로 요새는 전차로만 움직이는 보병의 지원을 받아 불가능하다고 여겨졌던 속도로 움직일 수 있게 되었습니다. 기록적인 속도로 적 사단을 포위하고 파괴할 수 있는 진정한 현대식 기갑 부대를 만들려면 새로운 전차 개발을 지원해야 합니다."
 TRM_Land_Air_Integration: "육-공군 통합 전술"
 TRM_Land_Air_Integration_desc: "항공 전력에 대한 모든 잡음에도 불구하고 항공 전력은 궁극적으로 상호 보완적인 힘입니다. 그 구조와 용도에 관계없이 군 항공에 관한 논의는 필연적으로 지상군을 어떻게 지원할 것인가로 돌아갈 수밖에 없습니다. 이 철학에 충실할 때 필요한 곳에 필요한 시기에 지원을 제공함으로써 군의 효율성을 배가하는 공군을 고안할 수 있습니다."
 
 TRN_Luftwaffe: "트리니티 공군 재편성"
 TRN_Luftwaffe_desc: "사태 당시, 트리니티 공군은 기대만큼의 활약을 보이지 못했고, 그 한계는 여실히 드러났습니다. 그러나 우리는 그 전장에서 마주했던 독일 공군의 용맹함과 전투 방식을 높이 평가하며, 그들의 정신과 전술을 트리니티 공군에 이식할 것입니다."
 TRN_Standardise_Pilot_Training: "조종사 훈련 표준화"
 TRN_Standardise_Pilot_Training_desc: "군사 항공은 여전히 신흥 기술의 많은 특징을 지니고 있으며, 그 중 하나는 지식이 공유되는 매우 즉흥적인 방식입니다. 통일된 훈련 체계가 없어, 대신 경험 많은 조종사들이 자신만의 방식으로 기술을 가르쳐야 한다고 여겨집니다. 이로 인해 우리 조종사들 사이에 놀랍도록 일관성 없는 지식 체계가 형성되었습니다. 이제 우리는 이 과정을 표준화할 때가 되었습니다."
 TRN_Promote_Amateur_Flying: "아마추어 비행 장려"
 TRN_Promote_Amateur_Flying_desc: "아마추어 조종사는 성장하는 현상이 되었습니다 - 최근 몇 년간 많은 민간인들이 비행을 취미로 삼기 시작했으며, 일부는 대서양 횡단과 같은 인상적인 업적을 달성하여 큰 명성을 얻었습니다. 우리가 이러한 대중적 이미지를 육성하고 방향을 설정한다면, 우리 공군을 위한 경험 많은 인력 풀을 키울 수 있을 것입니다."
 TRN_Night_Witches: "밤의 마녀들"
 TRN_Night_Witches_desc: "유명한 여성 비행가가 트리니티 공군에 충격적인 아이디어를 제안했습니다: 여성으로만 구성된 항공 연대입니다. 모든 통념과는 달리, 실제로 그녀의 계획을 지지하는 일부 장교들이 있습니다. 그들은 이 계획이 엄청난 선전 가치가 있으며, 다른 조종사들에게 트리니티를 위해 대담한 새로운 높이에 도달하도록 영감을 줄 수 있다고 주장합니다."
 TRN_Aviation_Bureaus: "항공국"
 TRN_Aviation_Bureaus_desc: " 항공은 섬세한 기술입니다. 겉보기에 작은 결함도 하늘에서는 재앙을 초래할 수 있으며, 전투의 혹독한 환경을 견딜 수 있는 항공기를 설계하려면 완벽함이 요구됩니다. 많은 공중전은 실제로 비행기가 이륙하기도 전에 이미 결정되었습니다. 전국에 항공국을 설립함으로써, 우리는 선제적으로 더 효과적인 항공기를 설계하고 시험할 수 있습니다."
 TRN_Long_Range_Bombing: "장거리 폭격"
 TRN_Long_Range_Bombing_desc: "항공 기술의 한계가 확장됨에 따라, 군사 이론가들은 이 기술의 급진적인 사용법을 구상해냈습니다: 적국의 산업 지역에서 운용되며, 공장들을 평지로 만들 수 있는 충분한 화력을 갖춘 거대한 장거리 폭격기입니다. 이 '전략적 파괴' 교리는 지상군 한 명의 발자국도 없이 적의 전쟁 수행 능력을 완전히 파괴할 것을 약속합니다."
 TRN_Transpolar_Flights: "트리니티 횡단 비행"
 TRN_Transpolar_Flights_desc: "북극과의 근접성은 우리 항공 산업에 예상치 못한 이점을 제공합니다: 항공기를 철저히 시험해볼 수 있는 곳으로는 세계에서 이보다 더 좋은 곳이 몇 없습니다. 시험 목적으로 장거리 극지 횡단 비행을 적극적으로 조직함으로써, 우리는 다른 어떤 비행기보다 더 멀리, 더 높이, 더 빠르게 날 수 있는 비행기를 설계할 수 있습니다."
 TRN_Expand_The_Aircraft_Industry: "항공 산업 확대"
 TRN_Expand_The_Aircraft_Industry_desc: "우리는 매우 현대적인 항공기 산업을 가지고 있지만, 대부분은 여전히 민간 소유입니다. 현대적이고 강력한 공군을 건설하려면 이 항공기 산업을 국유화하고, 국가 기관에 통합시키며, 상당히 확장해야 할 것입니다."
 TRN_Airspace_Defence: "영공 방어"
 TRN_Airspace_Defence_desc: "적들이 우리의 하늘을 정복하고 지상군을 공포에 빠뜨리기 위해 항공기를 모든 가능한 방법으로 활용하려 할 것이기 때문에, 영공 방어보다 더 중요한 것은 없습니다. 더 이상 육지를 방어하는 것만으로는 충분하지 않습니다. 우리가 승리하려면 조국의 하늘이 지상만큼이나 난공불락이어야 합니다."
 TRN_Specialise_in_Ground_Support: "지상 지원 전문화"
 TRN_Specialise_in_Ground_Support_desc: "새로운 기술들은 새로운 폭격기 개발에 매혹적인 가능성을 열어주고 있습니다. 이제 항공기는 고도로 기동성 있는 포병으로 기능할 수 있게 되어, 적 진지를 정확하고 파괴적인 공격으로 타격할 수 있으며, 기존의 지원보다 훨씬 빠르게 전선 어디에나 배치될 수 있습니다. 이는 분명 군사 항공의 미래를 대표합니다."
 TRN_Maintain_Tactical_Flexibility: "전술적 유연성 유지"
 TRN_Maintain_Tactical_Flexibility_desc: "항공 기술의 발전은 더 민첩한 항공기뿐만 아니라 더 견고한 항공기를 위한 길도 열어줍니다. 일부 이론 학파들은 새로운 '전술' 폭격기를 옹호하기 시작했습니다 - 이는 '근접' 지원기보다 더 넓은 작전 반경과 생존성을 가진 지상 지원 항공기입니다. 이러한 종류의 폭격기는 기지에서 더 멀리, 더 불리한 조건에서도 임무를 수행할 수 있으며, 적의 구조물도 파괴할 수 있습니다."
 TRN_Jet_Engine_Experiments: "제트 엔진 실험"
 TRN_Jet_Engine_Experiments_desc: "항공 역사상 지금까지 프로펠러를 통해서만 공기보다 무거운 물체의 비행이 가능했습니다. 그러나 최첨단 비행 기술은 새로운 동력 비행 방식이 가능할 수 있음을 시사합니다. 이론상으로는, 엔진이 공기를 압축하고 연료와 결합한 다음 이 혼합물을 사용하여 추진력을 생성할 수 있습니다 이는 프로펠러에 내재된 문제들을 우회하는 방식입니다. 명백히 미친 아이디어로 보이지만, 상식적인 아이디어로는 좀처럼 획기적인 돌파구를 만들어내지 못합니다."
 TRN_Death_From_Above: "하늘에서 죽음이"
 TRN_Death_From_Above_desc: "우리가 아는 바와 같이, 전쟁의 3차원은 군사 기술을 혁명적으로 변화시킬 준비가 되어 있습니다 그것의 거대한 전술적, 전략적 응용 사이에서, 하늘의 통제권은 다음 대전쟁뿐만 아니라 이후의 모든 전쟁에서 결정적인 역할을 할 것이 확실합니다. 트리니티 군대는 미래를 받아들일 것입니다 조국의 아들들은 더 이상 지상에서 비참하게 시들어가지 않고, 구름 속에서 영광을 얻을 것입니다."
 TRN_Create_The_Airborne_Force: "공수부대 창설"
 TRN_Create_The_Airborne_Force_desc: "우리 최고 사령부의 일부 실험적인 구성원들은 군대의 기계화가 단지 첫 번째 단계일 뿐이라고 제안합니다. 다음 단계는 보병을 배나 트럭이 아닌 비행기로 이동시키는 것입니다! 이른바 낙하산 부대를 적진 후방에 투하함으로써 우리는 적 부대를 고립시키고 보급 지점을 타격할 수 있습니다. 이 새로운 공수부대 는 창의 첨병이 될 것입니다."
 TRN_We_Need_Helicopter: "헬리콥터 개발"
 TRN_We_Need_Helicopter_desc: "회전익을 사용하는 항공기로서 특히 주 로터를 통해 양력과 추력을 모두 얻는 항공기다. 일반적인 비행기는 주익이 고정되어 있거나(고정익기) 약간의 움직임만 가능하고(가변익기) 별도의 프로펠러나 엔진의 힘으로 추진되는 반면, 헬리콥터(흔히 헬기라고도 함)는 엔진의 힘으로 날개 자체를 회전시켜 비행을 한다. 때문에 이 날개는 로터 블레이드, 또는 로터리 윙이라고 불린다."
 TRN_Naval_Bomber_Development: "뇌격기 개발"
 TRN_Naval_Bomber_Development_desc: ""
 TRN_Carrier_Development: "항공모함 개발"
 TRN_Carrier_Development_desc: ""

 TRN_Take_To_The_Seas: "바다를 향해"
 TRN_Take_To_The_Seas_desc: "우리가 다시 키보토스의 위대한 학원들 사이에서 당당히 서려면, 유럽과 세계의 강대국들에 도전할 수 있는 새롭고 현대적인 해군을 건설해야 한다. 이제 러시아가 다시 한번 해군 강국이 될 때이다."
 TRN_Floating_Fortresses: "떠다니는 요새"
 TRN_Floating_Fortresses_desc: "구시대 학파의 많은 장교들은 트리니티 내전에서의 경험을 바탕으로 규율의 힘과 위엄 있는 드레드노트급 전함의 힘을 믿습니다. 그들은 이러한 거대한 군함들이 다른 강대국들의 함대와 마찬가지로 우리 해군의 중추로 남아야 한다고 주장합니다."
 TRN_Naval_Air_Coordination: "해군-공군 협력"
 TRN_Naval_Air_Coordination_desc: "우리 해군 참모들 중 일부가 트리니티 항공의 어머니에게 찾아뵙고, 이는 그들로 하여금 해전의 미래가 항공모함에 있다고 믿게 만들었습니다. 이러한 함선들은 비싸지만, 이 장교들은 전쟁이 발발 한다면 해전이 드레드노트급 전함에 의해 지배되었지만, 곧 거대한 항공모함과 해군 폭격기의 강력한 화력에 의해 그늘에 가려질 것이라고 주장합니다."
 TRN_War_Under_The_Sea: "수중 전투"
 TRN_War_Under_The_Sea_desc: "항공모함과 전함이 미래일 수 있지만, [TRM.GetNameDef]에는 이러한 거대한 함선들에 집중하는 것은 현실적이지 않을 수 있습니다. 대규모 해군을 건설하는 것은 비용이 많이 들고, [TRM.GetNameDef]은 그러한 규모의 함대를 생산할 조선소나 자원이 없습니다. 대신, 우리는 적의 해상 보급로를 괴롭힐 수 있는 더 저렴하지만 똑같이 치명적인 잠수함에 집중해야 합니다."
 TRN_The_Invisible_Navy: "보이지 않는 해군"
 TRN_A_Destroyer_Armada: "구축함 대함대"
 TRN_Fleet_Protectors: "함대의 수호자"
 TRN_Fleet_Vanguards: "선봉 함대"
 TRN_Naval_Infantry: "해군 보병"
 TRN_New_Tactics_For_New_Ships: "새로운 함선을 위한 새로운 전술"
 TRN_Commerce_Raiders: "통상파괴함"
 TRN_Coastal_Defences: "연안 방어"
 # 중점
 TRN_bring_in_vigilantes: "자경단 투입"
 TRN_bring_in_vigilantes_desc: "정의실현부의 끊임없는 노력에도 불구하고, [61.GetName]와 [66.GetName]의 조직적인 저항이 좀처럼 사그라들지 않고 있습니다. 테러리스트들이 트리니티의 안정을 위협하고 있습니다. 이에 따라 호스트의 명령이 내려졌습니다. 자경단은 테러리스트를 철저히 제압하고 트리니티의 질서를 수호하기 위해 더욱 강경하게 나설 것입니다."
 TRN_reconstruction_of_collapsed_industry: "무너진 산업 복구"
 TRN_reconstruction_of_collapsed_industry_desc: "저항이 끝난 뒤 [61.GetName]와 [66.GetName]은 파괴되고 상처 입었습니다. 보조금 지원을 통해 무너진 산업들을 복구 시키고 [61.GetName]와 [66.GetName] 지역 주민들에게서 구원자라는 이미지를 심어야 합니다."
 TRN_Reconnect_network_and_power: "통신망 확대"
 TRN_Reconnect_network_and_power_desc: "대전이 사태의 여파로, 트리니티 통신망은 주요 거점에서 멀어질수록 정보 접근성이 현저히 떨어졌습니다. 그러나 통신망을 확장한다면 이러한 문제는 충분히 해결 가능하며, 보다 많은 지역에서 신속하고 정확한 정보 전달이 가능해질 것입니다."
 TRN_railway_improvement: "철도망 개선"
 TRN_railway_improvement_desc: "현지 철도의 궤간은 키보토스에서 사용되는 표준과 일치하지 않아, 결국 물자를 차량으로 수송해야 하는 비효율적인 상황에까지 이르렀습니다. 이 문제를 해결하기 위해서는 철도망을 개선하고, 보다 효율적인 수송 체계를 마련해야 할 것입니다."
 TRN_KWG_open: "카이저 빌헬름 협회 재개장"
 TRN_KWG_open_desc: "대전이 사태 동안 카이저 빌헬름 협회 건물은 화재로 소실되었습니다. 연구 자료들은 가까스로 보존해냈지만, 일부 손실은 피할 수 없었습니다. 트리니티의 수많은 학자들은 이를 안타까워하며, 협회의 복원과 재개장을 강하게 요구하고 있습니다."
 TRN_fight_with_junker: "토지를 위한 투쟁"
 TRN_fight_with_junker_desc: "가장 넓고 위대했던 트리니티의 부지는 대전이라는 참화를 겪으며 대부분 소실되었고, 남은 좁은 영토마저 '융커’라 불리는 토지 귀족들이 소유권을 주장하며, 심지어 용병을 고용해 지키는 등 학원에 비협조적인 태도를 보이고 있습니다. 이러한 분쟁이 장기화될 경우, 우리는 식량 문제라는 또 다른 위기에 직면할 수밖에 없습니다."
 TRN_confiscation_distribution_collectivization: "몰수, 분배, 집산화"
 TRN_confiscation_distribution_collectivization_desc: "융커들의 토지는 무상으로 몰수되어, 분배 이후 학원이 관리하는 국영 농장으로 재편될 것입니다. 이 과정에서 충돌은 불가피하겠지만, 그것이 현실입니다. 융커들은 자신들의 기득권을 지키기 위해 저항할 것이고, 우리는 그 기득권을 몰수하기 위해 나설 뿐입니다."
 TRN_cooperation_with_junker: "융커와 협력"
 TRN_cooperation_with_junker_desc: "융커들은 이 지역을 가장 잘 이해하는 '이해자’이며, 우리에게는 그들의 협력이 절실합니다. 수많은 농지를 학원 소유로 환원시키기 위해서는 융커들과의 협력과 협상이 필요할 것입니다."
 TRN_revitalization_of_heavy_industry: "서부 공업화"
 TRN_revitalization_of_heavy_industry_desc: "토지 문제의 일부가 해결되면서, 이제 서부 지역의 광활한 대지를 본격적으로 활용할 수 있게 되었습니다. 덕분에 부족했던 공장 수를 채우기 위한 공업화 계획도 본격적으로 추진할 수 있습니다. 여기에 오데르 강을 통한 물자 수송 능력까지 더해진다면, 우리의 공업화는 한층 더 빠르게 가속될 것입니다."
 
 TRN_control_tea_party: "티파티 통제"
 TRN_control_tea_party_desc: "상투스 분파가 무너지며 키리후지 나기사 휘하의 필리우스 분파는 여전히 미소노 미카에 맞서는 몇 안되는 제도적 기둥 중 하나로 남았습니다. 운 좋게도 호스트 선출에서 파테르 분파의 미소노 미카가 당선 되면서 호스트 자리에 오르게 되었습니다. 키리후지 나기사에 대한 정치적 음모를 펼치는 것이 가능해졌습니다. 파테르 분파와 호스트의 권한이라면 키리후지 나기사는 굴복할 수 밖에 없을 것입니다."
 TRN_Mika_basic_law: "미소노 미카 법"
 TRN_Mika_basic_law_desc: "현행 트리니티 헌법은 수백 년 전 제왕적인 호스트의 권력을 견제하고, 티파티와 호스트 간의 상호 견제를 바탕으로 하는 이상주의적 체제를 근간으로 하고 있습니다. 그러나 운명이 내린 축복 아래, 트리니티 대법원은 단순히 법적 체계를 유지하는 것에 그치지 않고, 파테르 분파와 미소노 미카의 지배가 트리니티 헌법이 인정하는 합법적인 체제임을 합리화해야합니다."
 TRN_sect_control: "타 분파의 정치 개입 차단"
 TRN_sect_control_desc: "구호기사단과 시스터후드는 오래전부터 티파티의 정치에 관여하지 않는 관행을 유지해왔지만, 이는 어디까지나 법적 구속이 아닌, 각 분파가 자발적으로 권리를 내려놓은 데에서 비롯된 것이었습니다. 그러나 정치적 지형이 급변한 지금, 그들이 앞으로도 계속 정치에 개입하지 않을 것이라는 보장은 어디에도 없습니다."
 TRN_necessary_revenge: "천사들의 날개"
 TRN_necessary_revenge_desc: "신헌법이 미소노 미카의 우위를 확고히 보장하는 만큼, 이제 다른 분파들을 방관해서는 안 됩니다. 상투스 분파와 필리우스 분파는 이미 무력화되었지만, 시간이 지나면 다시 힘을 회복할 가능성이 있습니다. 그렇기에 우리는 그들의 날개가 다시 움직이지 못하도록 확실한 조치를 취해야 합니다."
 TRN_necessary_revenge_tt: "이 중점은 §Y비파시즘§! 이념의 지지도를 낮출 일련의 §Y사건들§!을 촉발시킬 것입니다."
 TRN_second_trintiy: "두 번째 트리니티"
 TRN_second_trintiy_desc: "트리니티는 한때 위대한 제1차 공의회의 유산을 계승하였으나, 내분과 변절 속에서 그 유산을 스스로 훼손하였고, 결국 대전이 사태로 인해 붕괴되었습니다. 점차 파테르 분파만이 트리니티를 통합하고 부활시킬 수 있다는 사실이 분명해지고 있습니다. 학생들을 하나로 묶고, 무적의 의지와 파괴적인 힘으로 어떤 위협이든 꺾을 수 있도록 만드는 것. 그것이 곧 우리의 목표이자, 음모이며, 반드시 완수해야 할 사명입니다."
 TRN_Justice_Task_Force_on_leash: "정의실현부 목줄 채우기"
 TRN_Justice_Task_Force_on_leash_desc: "정의실현부는 티파티 산하의 치안 조직이지만, 독자적인 무력을 보유하고 있으며 그 규모는 티파티에 필적합니다. 겉으로는 정치적 중립과 불간섭을 표방하고 있으나, 실질적으로 호스트에게 맞설 수 있는 유일한 세력이기도 합니다. 그런 잠재적 후환을 미리 제거하는 것은 나쁜 건만은 아닙니다..."
 TRN_intelligence_agency: "학원정보원 재편"
 TRN_intelligence_agency_desc: "끔찍했던 유리조노 세이아 암살 사건은 학원정보원이 제 역할을 다하지 못했다는 사실을 여실히 드러냅니다. 정보원장의 무능과 대응력 저하는 이미 명백히 입증되었습니다. 새로운 질서가 형성되는 이 세계에서 정보에서 뒤쳐진다는 것은 곧 죽음을 의미합니다."
 TRN_The_nature_of_the_united_front: "국민연합의 성질"
 TRN_The_nature_of_the_united_front_desc: "파테르 국민연합은 파테르 분파가 무분별한 가입을 허용할 수 없다는 규정 때문에 설립된 사회 운동들의 연합체입니다. 하지만 그 정체성과 목적은 여전히 불분명합니다. 국민연합이 무엇을 위해 결집했는지, 누구에게 충성을 바치는지, 그리고 누구를 위해 존재하는지 분명히 규정해야 합니다. 이를 통해 트리니티 사회에 실질적인 변혁을 불러일으켜야 합니다."
 TRN_cult_of_Mika: "대천사 숭배"
 TRN_cult_of_Mika_desc: "트리니티는 지난 세월 동안 불안정한 민주주의 속에서 방황해왔습니다. 수많은 철인들이 등장하여 트리니티를 이끌었으나, 불안정한 체제는 결국 그들의 한계를 드러내며 붕괴를 맞이했습니다. 그 붕괴의 여파는 트리니티에 재앙으로 닥쳤지만, 쓰라린 상처를 극복하고 트리니티를 부흥시킬 힘을 지닌 유일한 인물은 오직 미소노 미카뿐입니다."
 TRN_cult_of_Mika_tt: "§P사건은 미소노 미카가 대중에게 스스로를 어떻게 묘사할지 그리고 그에 따르는 보너스를 선택할 수 있는 기회를 제공할 것입니다.§!"
 TRN_new_trinity_culture: "새로운 트리니티 문화"
 TRN_new_trinity_culture_desc: "트리니티의 문화는 본래 독자적인 전통을 지니고 있었으나, 대전이라는 특수한 사건을 계기로 독일 문화가 대거 유입되었습니다. 우리의 이상은 양 문화가 자연스럽게 융합하여 조화를 이루는 것이었으나, 현실은 그렇지 않았습니다. 문화적 차이로 인해 갈등이 빈번히 발생하고 있으며, 이를 방관할 수는 없습니다. 빠르고 단호한 개입을 통해 문화적 충돌을 해소하고 통합을 이루어야 합니다."
 TRN_new_trinity_culture_tt: "§Y결과는 중점 중에 발생한 사건에 따라 달라질 것입니다.§!"
 TRM_invite_dignitary: "독일 사상가 등용"
 TRM_invite_dignitary_desc: "트리니티 지역에는 여전히 독일 출신의 사상가들이 존재하며, 이들은 민족사회주의와 일정한 연관성을 지니고 있습니다. 특히 일부 인물들은 민족사회주의에 대한 깊은 이해를 바탕으로, 새로운 혁명의 기수가 될 잠재력을 지니고 있습니다. 그들의 사상은 트리니티의 영원한 정신과 신앙을 보다 역동적이고 민족주의적으로 해석하는 방식으로 나타나고 있습니다."
 TRN_alliance_of_faith: "신앙과 동맹"
 TRN_alliance_of_faith_desc: "트리니티 가톨릭이 트리니티 문명의 핵심적인 부분이라는 점은 부정할 수 없습니다. 국민연합은 모든 종교의 신도들을 포용하고자 하지만 가톨릭과의 편리한 동맹은 평범한 트리니티 학생들과 독일인들의 마음속 깊이 자리 잡은 강력한 동맹이 될 것입니다."
 TRN_Has_Active_TRN_Mika_social_problem_When_Complete_This_Focus_tt: "만약 당신이 $TRN_Mika_social_problem$를 선택하기 이전에 중점을 완료하면 $TRN_Mika_social_problem$에서 더 큰 효과를 얻을 수 있습니다."
 TRN_Fourth_Reich: "기사단국 선언"
 TRN_Fourth_Reich_desc: "기사단국의 선포는 어쩌면 스스로의 모순일 수도 있습니다. 그러나 트리니티는 그 모순을 외면하거나 두려워하지 않습니다. 트리니티의 특수성과 외부 정세의 급변이 맞물리며 탄생한 기사단국은, 강력한 동맹이자 정신적 기반으로서 트리니티 고유의 뿌리를 기꺼이 받아들이고 있습니다."
 TRN_Fourth_Reich_tt: "§g'$TRN_new_culture_militarism_ns$' 국민정신의 효과가 두배로 늘어납니다.§!"
 TRN_student_solidarity: "학생연대 강화"
 TRN_student_solidarity_desc: "트리니티의 근간이자 뿌리인 '학생 연대'는 기독교적 교리와 가치를 바탕으로 점차 확대되어 왔습니다. 이 사회는 전능한 폭군에 대한 맹목적인 복종이 아닌, 정의와 연대, 자유와 법치를 통해 이루어지는 학생들의 자율적 조직 위에 번영을 이룹니다. 트리니티의 학생들은 언제나 그러한 사회를 꿈꿔왔습니다. 그것은 특정 계급이나 분파가 아닌, 기독교적 사랑이라는 원칙 위에 세워진 공동체입니다"
 TRN_student_solidarity_tt: "§g'$TRN_new_culture_culture_technology_ns$' 국민정신의 효과가 두배로 늘어납니다.§!"
 TRN_improving_academy_industry: "트리니티 재산업화"
 TRN_improving_academy_industry_desc: "트리니티의 총체적인 문제를 해결하기 위해서는 호스트가 주도하는 재개발이 필요합니다. 또한, 다가올 외부적인 위협에 대비하기 위해서는 군수 생산 공장을 대규모로 확장 해야 할 것입니다. 많은 사람들이 이 정책에 반대할 것이지만 모교이 위협에 닥쳤을때 사람들은 우리에게 고마워할 것입니다."
 TRN_ministry_of_industrial_development: "학원경제개발부 설립"
 TRN_ministry_of_industrial_development_desc: "트리니티의 경제는 하나의 오케스트라이며, 학원경제개발부는 그 지휘자입니다. 기존에 티파티에 소속되어 있던 경제 전문가들은 독립된 단체로서 학원과 학생들의 이해관계 사이에서 균형을 유지하며, 합리적인 투자와 규제 완화를 통해 양측이 더욱 부유하고 번영할 수 있도록 합니다."
 TRN_expanded_corporatism: "협동조합주의적 대표성을 향하여"
 TRN_expanded_corporatism_desc: "트리니티의 경제 방향이 소수 엘리트들에 의해 지나치게 좌우되는 것에 대해 우려하던 학생들은 학원경제개발부에 의문을 제기하기 시작했습니다. 이에 호스트는 노동자와 기술자 등 각계 전문 인력들이 자신의 분야에서 목소리를 낼 수 있도록 소통의 창구를 마련하기로 결정했습니다."
 TRN_planned_economy: "학원경제개발부 권한 강화"
 TRN_planned_economy_desc: "복잡한 경제 구조는 일반 학생들이 이해하기 어려우며, 이를 위한 역량이나 의지도 부족한 경우가 많습니다. 따라서 경제에 대한 전문성을 갖춘 학원경제개발부가 이 역할을 주도적으로 맡게 됩니다. 이들은 공공 부문 전반에 걸쳐 계획 수립 권한을 점차 확대해 나갈 것입니다."
 TRN_exploit_of_puppet_economies: "괴뢰국 경제 착취"
 TRN_exploit_of_puppet_economies_desc: ""
 TRN_exploit_of_puppet_economies_not_available: "팩션 개선 업데이트 나오고 만듬 ㅈㅅ;"
 TRN_cause_of_trinity: "트리니티의 대의"
 TRN_cause_of_trinity_desc: "많은 이들은 미소노 미카의 독재적 체제에 반감을 품고, 회의적인 시선으로 지켜보았습니다. 그러나 눈에 띄는 성과들이 나타나고, 트리니티가 실제로 위협에 처해 있음이 드러나며 타 학원들의 음모와 구 체제의 마지막 발악까지 더해지자 점차 '트리니티 사회주의'에 대한 여론도 호의적으로 바뀌기 시작했습니다. 트리니티는 이제 칠흑 같은 어둠을 지나, 새로운 항로를 향해 나아갈 것입니다."
 TRN_Integrity_of_Trinity: "트리니티의 무결성"
 TRN_Integrity_of_Trinity_desc: "수백 년 전의 적을 꺾고 탄생한 미소노 미카의 ‘두 번째 트리니티’는, 모든 일반 학생들이 하나로 뭉쳐 이루어낸 유기체와도 같은 존재입니다. 이 새로운 트리니티는 과거의 영광에 얽매이지 않고, 현재의 필요를 직시하며, 위대하고 메시아적인 미래를 향해 나아갈 것입니다. 세계가 정신적 계몽의 새로운 시대로 나아가도록 이끄는 것 그것이 바로 트리니티의 사명입니다."
 TRN_savior_of_kivotos: "키보토스의 구세주"
 TRN_savior_of_kivotos_desc: "트리니티의 사명은 단지 스스로를 구하는 데 그치지 않습니다. 그것은 키보토스 전체를 구원하기 위한 것입니다. 증오로 가득 찬 지구 현지인들과, 역병처럼 퍼진 온갖 이념들은 제쳐두고 우리는 이 모든 증오를 뿌리 뽑아야 하는 도덕적 사명을 지니고 있습니다. 이제 다음, 그리고 마지막 전쟁을 위한 준비가 시작될 것입니다. 영웅이 쓰러지고, 어둠이 걷힌 그 끝자락 스러져가는 여명의 빛 속에서 우리는 또 하나의 아름다운 신세계를 건설해야 합니다."
 TRN_savior_of_kivotos_2: "키보토스의 구세주"
 TRN_savior_of_kivotos_2_desc: "트리니티의 사명은 스스로를 구하는 데 그치지 않습니다. 그것은 키보토스 전체를 구원하기 위한 것입니다. 증으로 가득 찬 지구 현지인들과, 역병처럼 퍼진 온갖 이념들은 제쳐두고 우리는 이 모든 증오를 뿌리 뽑아야 하는 도덕적 사명을 지니고 있습니다. 이제 다음, 우리가 양떼를 몰지어니, 증오로 가득 찬 지구 현지인들에게서 키보토스만의 고유한 가치들을 보호해야 합니다."
 TRN_codification_of_regime: "정권 성문화"
 TRN_codification_of_regime_desc: "파테르 분파와 국민연합은 학원이라는 수레를 끄는 두 마리의 말이며, 미소노 미카는 그 수레의 기수입니다. 이제 더 이상 불안정한 의사결정도, 갈피를 잡지 못한 방황도 없을 것입니다. 두 공동체와의 협력은 유례없는 수준으로 공고해졌고, 우리는 이를 바탕으로 학생들과 국민 모두에게 보다 안정적이고 풍요로운 삶을 제공할 사명을 띠고 있습니다. 이것은 선택이 아니라, 우리 모두에게 주어진 시대적 사명입니다."
 TRN_supreme_leader: "최고지도자"
 TRN_supreme_leader_desc: "파테르 분파와 국민연합은 더 이상 우리의 길에 도움이 되지 않는다는 사실이 명백해졌습니다. 그들은 이제 결정의 흐름을 방해하는 오래된 그림자일 뿐이며, 더는 좌시할 이유조차 없습니다. 그 존재의 명분은 스스로 무너졌고, 미소노 미카는 마침내 '지도자'라는 허울을 벗은 채, 새로운 차원의 존재로, 그리고 숙명처럼 도래한 폭군으로 다시 태어날 것입니다."
 TRN_michael_and_warriors: "대천사의 전사들"
 TRN_michael_and_warriors_desc: "대천사 미소노 미카의 전사들은 언제나 부름에 응답할 준비가 되어 있으며, 결코 싸움을 피하지 않습니다. 그들은 오직 전투를 위해 존재하며, 미소노 미카는 그들을 이끄는 목자입니다. 사자의 발 아래에서 길러진 이 전사들은 반드시 승리를 가져올 것입니다."
 TRN_horseman_of_the_apocalypse: "묵시록의 기수"
 TRN_horseman_of_the_apocalypse_desc: "트리니티는 더 이상 단순한 학원이 아닙니다. 그것은 살아 숨 쉬는 유기체이며, 종말을 몰고 오는 말과도 같은 존재입니다. 그리고 그 위에 올라탄 기수, 바로 대천사 미소노 미카께서는 정복자이자 황제, 전쟁의 상징이십니다. 트리니티는 죽음이며, 미카는 그 죽음을 인도하는 영광의 기수입니다."
 TRN_project_trinity: "'성부' 계획"
 TRN_project_trinity_desc: "성부(Pater) 계획은 트리니티 종합학원에서 추진 중인 가장 비밀스럽고 강력한 프로젝트입니다. 이 계획의 핵심은 기존에 보유하던 미사일 기술을 역설계하여 새롭게 개발된 중거리 탄도미사일에 있습니다. 이 미사일은 총 6개의 탄두를 탑재하고 있으며, 낙하 시 각 탄두가 독립적으로 목표를 타격하도록 설계되어 있습니다."
 TRN_destiny_of_trinity: "트리니티의 운명"
 TRN_destiny_of_trinity_desc: "수백 년 전, 트리니티는 분열되어 서로에게 칼을 겨누는 비극을 겪었습니다. 그러나 이제는 다릅니다. 선지자들이 나타나 흩어진 트리니티를 다시 하나로 묶었고, 그 통합은 오늘날 모든 학원이 본받아야 할 모범이 되었습니다. 우리는 그 역사 속 선지자들처럼, 여전히 서로에게 등을 돌리고 있는 학원들을 하나로 묶을 운명을 지니고 있습니다."
 TRN_legacy_of_the_prophets: "선지자들의 유산"
 TRN_legacy_of_the_prophets_desc: "선지자들이 우리에게 남긴 것은 칼과 불이 아닙니다. 그들이 전한 것은 진정한 평화, 사랑, 그리고 굳건한 유대였습니다. 트리니티는 피와 철로 이루어진 학원이 아니라, 연대와 이해, 그리고 신앙 위에 세워진 이상입니다. 우리는 선지자들의 뜻을 계승해야 합니다 그 유산은 전쟁이 아니라 평화이며, 정복이 아니라 공존입니다. "
 TRN_sheep_and_shepherd: "양떼와 목자"
 TRN_sheep_and_shepherd_desc: "양떼와 목자는 서로에게 없어서는 안 될 존재입니다. 유목의 길에는 언제나 양떼가 필요하고, 양떼는 늘 목자의 보호를 필요로 합니다. 대천사 미소노 미카는 자신의 양떼를 위해 기꺼이 목숨을 내놓을 각오가 되어 있으며, 그들에게 사랑과 헌신으로 보살핌을 아끼지 않습니다. 양떼는 목자의 인도 아래에서 안식과 평화를 얻고, 행복한 삶을 영위하게 될 것입니다. 이는 믿음과 책임으로 맺어진 성스러운 유대입니다."

 TRN_kivotos_dip: "키보토스 외교"
 TRN_kivotos_dip_desc: "트리니티 내부의 정치적 위기가 어느 정도 수습되면서, 이제 시선은 학원 내부가 아닌 외부로 향하고 있습니다. 더 이상 내부 문제에만 몰두할 수 없는 시점이 온 것입니다. 특히 최근 벌어진 일련의 사건들은 트리니티에 새로운 기회가 될 수도, 혹은 치명적인 위협이 될 수도 있습니다. 이제 우리는 선택하고 행동해야 합니다. 방관할 여유는 없습니다."
 TRN_eden_accord: "에덴 협정 형성"
 TRN_eden_accord_desc: "대전이 사태는 트리니티의 이상주의적 세계관을 철저히 무너뜨렸고, 그 여파로 트리니티는 점차 급진적인 노선을 걷게 되었습니다. 그러나 혼란 속에서 등장한 미소노 미카는 무너진 신념의 폐허 위에 다시금 ‘트리니티적 세계'를 약속했습니다. 총학생회의 키보토스 연합과는 다른, 오직 트리니티만의 고유한 세계관을."
 TRN_creation_of_faction: "에덴 협정 형성"
 TRN_divine_mandate: "신성통치령 계획"
 TRN_divine_mandate_desc: "‘신성통치령’이라는 개념은 본래 트리니티 종합학원이 각지의 부지를 효율적으로 관리하기 위해 설립한 총독부 체제에서 유래하였습니다. 이 개념은 트리니티가 정복한 영토들을 효율적으로 관리하기 위해서 일부 수정을 거친 뒤 실행 될 것입니다."
 
 TRN_impossible_to_coexist: "공존할 수 없는 자들"
 TRN_impossible_to_coexist_desc: "게헨나와의 전쟁은 트리니티에게 있어 피할 수 없는 숙명입니다. 이는 과거 선조들이 입었던 상처에 대한 복수이자, 전 트리니티를 위한 성전에 해당합니다. 그러나 그러한 숙명적인 전쟁조차도 철저한 준비 없이는 성공할 수 없습니다. 현재 ‘성 미카엘’이라는 암호명 아래 추진 중인 서부를 향한 대공세는, 키보토스 역사상 유례없는 규모의 작전으로 계획되고 있으며, 정밀한 전략과 작전 구상이 그 어느 때보다 요구되고 있습니다."
 TRN_spiritual_warfare: "영적 전쟁"
 TRN_spiritual_warfare_desc: "드디어 트리니티의 굴욕을 되갚아줄 때가 되었습니다. 게헨나의 만마전과 선도부는 이 곳 이계에서 무너질 것이고, 우리는 게헨나의 부지 전체에 우리의 깃발이 휘날릴 때까지 쉬지 않을 것입니다. 위대한 [TRM.GetName]이여, 최후의 투쟁을 위해 일어나라!"
 TRN_alliance_with_devil: "...악마와 동맹?"
 TRN_alliance_with_devil_desc: "흥신소는 최근 만마전을 불법 정부로 규정하고, 스스로를 ‘최후의 게르만 국가’라 칭하며 게헨나는 물론, 모교인 트리니티까지 영유권을 주장하고 나섰습니다. 겉보기에는 분명 우리의 적처럼 보일 수 있지만, 현실은 조금 더 복잡합니다. 그들이 만마전이라는 장애물을 넘기 전까지는, 우리와의 이해관계가 일시적으로 일치할 수 있습니다. 그런 점에서, 이들과의 한시적인 동맹은 충분히 고려할 만합니다."
 TRN_union_with_gehenna: "우리만의 '에덴 조약'"
 TRN_union_with_gehenna_desc: "총학생회장이 추진했던 트리니티와 게헨나 간의 평화 협정, 이른바 '에덴 조약'은 이미 오래전에 그 의미를 잃었습니다. 그러나 이제 상황은 완전히 달라졌습니다. 트리니티가 게헨나를 점령한 지금, 다시금 '에덴 조약'이라는 이름이 역사 속에서 호출될 순간이 다가오고 있습니다. 이번에는 더 이상 허울뿐인 평화가 아닙니다. '트리니티 방식'의 에덴 조약—그것은 굴복과 통합, 그리고 완전한 지배를 의미할 것입니다."
 # 붉은겨울 외교
 TRN_northern_kivotos_diplomacy: "북방 외교"
 TRN_northern_kivotos_diplomacy_desc: ""
 TRN_denmark_or_war: "덴마크 요구"
 TRN_denmark_or_war_desc: ""
 TRN_use_of_nordic_association: "노르드 협회 이용"
 TRN_use_of_nordic_association_desc: ""
 TRN_winter_warfare: "겨울 준비"
 TRN_winter_warfare_desc: "[RED.GetNameDef] 측의 지형은 트리니티에게 낯설고 가혹한 환경입니다. 숲이 울창하고 기온은 극도로 낮으며, 기존의 전술이 통하지 않을 위험이 있습니다. 이러한 악조건 속에서는 작은 실수 하나가 큰 손실로 이어질 수 있습니다. 우리는 방한복을 대량 제작하고, 혹독한 겨울에 대비해 철저한 준비를 갖춰야 합니다."
 TRN_finland_focus: "[FIN.GetNameDef] 측과 협력"
 TRN_finland_focus_desc: "[FIN.GetNameDef] 측은 [RED.GetNameDef]과 긴 국경을 맞대고 있습니다. 만약 우리가 이 국경 지대에 접근할 수만 있다면, 북쪽에서 밀려오는 붉은 위협을 효과적으로 일소할 수 있을 것입니다. 이는 미래에 우리가 [RED.GetAdjective] 측과 전쟁에 돌입하게 될 경우, 전략적 거점 확보라는 점에서 매우 중요한 의미를 가집니다."
 # 남키보토스 주력
 TRN_southern_kivotos_dip: "남방 외교"
 TRN_southern_kivotos_dip_desc: "소위 ‘남키보토스’라 불리는 지역은 산해경과 백귀야행을 중심으로 형성되어 있으며, 키보토스 변방에 위치한 탓에 외부 세계와의 교류가 거의 단절된 상태입니다. 그 결과, 이들은 점차 독자적인 문화권을 형성해 나가고 있습니다. 만약 우리가 이들과 접촉에 성공한다면, 예상치 못한 이익과 전략적 우위를 확보할 수도 있을 것입니다."
 TRN_support_HYA: "백귀야행과 협력 확대"
 TRN_support_HYA_desc: "백귀야행과 트리니티 간의 협력은 대전이 사태 이전부터 이어져 온 관계로, 정권 교체 이후에도 그 유대는 지속되고 있습니다. 특히 다양한 분야에서 백귀야행과의 협력을 더욱 확대한다면, 남키보토스 지역에서 전략적으로 중요한 동맹을 확보할 수 있을 것입니다."
 TRN_fate_of_abydos: "아비도스의 운명"
 TRN_fate_of_abydos_desc: "아비도스는 강대국들 사이에 끼어 있어, 스스로의 의지를 펼치지 못한 채 국가 존립의 위기에 직면해 있습니다. 그러나 트리니티는 그러한 비극적인 운명이 반복되기를 바라지 않습니다. 그렇기에 우리는 '자비'를 베풀어, 아비도스를 트리니티의 영향권 아래에서 보호할 것입니다."
 TRN_secure_hungary: "[HUN.GetNameDef] 기세 꺾기"
 TRN_secure_hungary_desc: "대전이 사태로 구세계 질서가 붕괴하자, [HUN.GetNameDef] 측은 자국의 영유권을 주장하며 주변 국가들을 침략하기 시작했습니다. 심지어 산해경을 포함한 키보토스에 대한 영유권까지 주장하며, 전쟁도 불사하겠다는 태도를 보이고 있습니다. 이러한 행위는 결코 좌시할 수 없으며, 그들에게 반드시 대가가 따른다는 사실을 분명히 인식시켜야 합니다."
 TRN_Breaking_Sanhaijing_treaty: "[SHA.GetNameDef] 위협 분쇄"
 TRN_Breaking_Sanhaijing_treaty_desc: "남쪽의 산해경은 기존의 고립주의를 폐기하고, 남 키보토스 지역에서 패권을 장악하기 위해 군사력을 빠르게 확장하고 있습니다. 이러한 움직임은 모교의 우방인 [HYA.GetNameDef]에게 심각한 위협이 될 수 있으며, 남 키보토스에 형성된 질서가 무너질 우려마저 존재합니다."
 # 폴란드 및 발트
 TRN_poland_problem: "바시스 스콜라 보호"
 TRN_poland_problem_desc: "[POL.GetNameDef]인들은 바시스스콜라와 키미가야마로 이어지는 전략적 요충지인 '단치히'에 대해 영유권을 주장하며, 트리니티를 향한 노골적인 군사 도발을 감행하고 있습니다. 바시스스콜라는 트리니티의 3대 도시 중 하나이자, 요한부파의 정신적 뿌리가 자리한 곳입니다. 이 도시를 잃는다는 것은 단순한 영토 상실을 넘어, 정권의 권위에 씻을 수 없는 치욕을 남기는 일이 될 것입니다."
 TRN_influence_the_baltics: "발트에 영향력 행사"
 TRN_influence_the_baltics_desc: "[TRM.GetAdjective]와 [SOV.GetAdjective] 사이에 위치한 발트 국가들은 지리적으로 매우 불안정한 위치에 놓여 있습니다. 약간의 외교적 압박과 설득만으로도, 이들을 [TRM.GetAdjective]의 영향권으로 끌어들일 수 있을지도 모릅니다."
 TRN_invasion_baltics: "발트해 장악"
 TRN_invasion_baltics_desc: "아리우스 분교가 위치한 단치히는 발트해의 전략적 요충지로, 이 지역을 통해 발트해 전체의 해상 패권을 장악할 수 있습니다. 그러나 아직까지 트리니티는 이 해역에서 완전한 지배력을 확보하지 못한 상황입니다. 이러한 공백은 주변 발트 국가들을 트리니티의 영향권 아래에 두는 방식으로 극복할 수 있을 것입니다."
 # 아리우스
 TRN_catch_tail: "꼬리 잡기"
 TRN_catch_tail_desc: "학원방위대의 끈질긴 노력 끝에, 트리니티 종합학원에 숨어 있던 반역 분자들이 드러났습니다. 이들은 조용히 우리 학원을 갉아먹으며, 기회만 되면 등 뒤에 칼을 꽂을 준비를 하고 있었습니다. 그러나 그들의 계획은 여기서 끝입니다. 정의실현부와 학원방위대는 단호한 조치로 이들을 뿌리까지 박멸할 것입니다."
 TRN_annex_the_bandit_states: "도적 국가 동화"
 TRN_annex_the_bandit_states_desc: "아리우스를 비롯한 나치 잔당들은 도적 무리처럼 흩어져 다니며 트리니티에 크고 작은 피해를 주고 있습니다. 그러나 이들의 저항은 체계적인 조직력이나 명확한 목표 없이 산발적으로 이루어지고 있으며, 이는 곧 우리가 이들을 충분히 통제하고 동화시킬 수 있다는 가능성을 보여줍니다."
 TRN_religious_conversion: "'개종'"
 TRN_religious_conversion_desc: "아리우스 출신 인물 중 특히 하카리 아츠코는 트리니티와의 화평을 적극적으로 주장해 온 인물로, 이는 그녀가 속한 스쿼드 내에서의 갈등으로도 드러났습니다. 트리니티는 그녀의 '전향'을 긍정적으로 평가하며, 이를 계기로 아리우스와의 수백 년에 걸친 원한을 마침내 씻어낼 준비가 되어 있습니다."
 TRN_defiance_of_COU: "총학생회 권위에 대한 도전"
 TRN_defiance_of_COU_desc: "총학생회는 새로운 세계에서 그 무능함을 여실히 드러냈으며, 총학생회장의 실종과 그 이후 연이어 발생한 사건들은 학생회에 대한 신뢰를 뿌리째 흔들어 놓았습니다. 더 이상 이러한 권위는 트리니티 위에 군림할 수 없습니다. 우리는 이에 맞서, 그들에 대한 저항으로서 역성혁명을 일으킬 것입니다."
 TRN_extinguish_the_flame: "불꽃 끄기"
 TRN_extinguish_the_flame_desc: "밀레니엄은 여전히 모교에 중대한 위협이 되고 있으며, 그들의 기술력은 마치 우리의 턱 밑에 칼날을 들이대는 형국입니다. 이와 같은 기술 패권은 더 이상 묵과할 수 없으며, 반드시 제어되어야 합니다."
 TRN_curtain_across_kivotos: "키보토스에 펼쳐진 장막"
 TRN_curtain_across_kivotos_desc: "트리니티 정권의 목표가 달성된 이상, 키보토스에서의 전쟁은 더 이상 의미를 갖지 않습니다. 우리는 전쟁을 통해 막대한 피해를 입었으며, 이제는 그 상처를 복구하고 재건하여 다시 한 번 위대한 평화의 시기로 나아가야 할 때입니다."
 TRN_cooperation_with_KAI: "[KAI.GetNameDef] 측과 협력"
 TRN_cooperation_with_KAI_desc: "[KAI.GetNameDef] 측이 소유한 섬은 전략적으로 바다로 진출하기에 매우 유리한 위치에 자리하고 있습니다. 특히 이 섬은 마치 침몰하지 않는 거대한 함선처럼 활용할 수 있어, 다가오는 적을 조기에 감지하고 대응할 수 있는 전초기지로 기능할 수 있습니다."
 tooltip_KAI_maintaining_the_system: "카이저 코퍼레이션 체제가 유지중"
 tooltip_KAI_maintaining_the_system_NOT: "해당하지 않음: 카이저 코퍼레이션 체제가 유지중"
