 TRN_inefficient_bureaucracy_idea_desc: "Administrative problems caused by the immaturity of replacement personnel have been resolved. Time, the most efficient and certain solution, has improved the expertise of our personnel. Mika Misono and her administration are now operated by the most patriotic, loyal, and professional individuals. The well-fitted gears are turning hard today as well for the development of Trinity."
 TRN_Inefficient_bureaucracy: "Administrative Processing: §RImmature§!" 
 TRN_Inefficient_bureaucracy_desc: "Now no existence remains within Trinity to hinder Mika Misono and her noble cause. She has mercifully allowed those with rebellious thoughts to return to Mother Nature through 'appropriate' methods. However, regrettably, the vacancies of the incompetent traitors have caused more problems than we thought. To restore the government's administrative power, we are filling those vacancies with loyalists, but time seems needed for them to become proficient and show administrative power like before."
