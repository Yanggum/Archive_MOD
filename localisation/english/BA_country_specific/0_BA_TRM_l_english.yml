 TRN_Misono_Mika_DESC_2: "Misono Mika was a member of the Tea Party with an innocent and bright smile. But who could have known that such appearances were all her calculated performance?\n\nMika has hated Gehenna for a long time. She couldn't understand how anyone could trust those horned bastards, and she had many conflicts with Kirifuji Nagisa, who sought peace with Gehenna.\nHowever, even with many conflicts, she did not seize power through force. This was because Kirifuji Nagisa was her precious childhood friend and her only friend.\n\nFor her, the 'Great Migration' event was a life-altering turning point. The fact that all of Kivotos was dropped onto a continent called Europe was, perhaps, an opportunity for her. An opportunity to seize all the authority of the Tea Party and drive out the demons of Gehenna.\n\nBut no matter how cunning she was, at her core, she was still just a young girl. Even though she joined hands with the National Socialists, she found their actions and methods too radical; she wanted to control them but couldn't because of her fragile heart.\n\nOnly when the 'Exile' order was issued, a few days after Nagisa was imprisoned following Mika's coup, did Mika realize what she was doing.\n\nHer tracks are stained red, and her voice is hollow.\nCountless people vanished under her name, and the people's fear and anger turned toward her.\nDespite numerous opportunities, she did not stop, and now the madness has escaped her hands and begun to stain everything on its own.\n\nUnder the name of National Socialism, Trinity did not stop.\nThe first to disappear were the Jews and minorities.\nBecause dirty blood cannot be tolerated in the sacred Trinity.\nNext were those who resisted her.\nWeakness was not needed for Trinity's glorious future.\nLastly, there were the remnants left in the lands Trinity occupied.\nThey all vanished into the darkness within the barriers built by her command.\n\nUltimately, the Four Horsemen of the Apocalypse she summoned swept away everything in Kivotos.\nUnder her reign, the night will continue forever.\nWaiting for a dawn that will never come, the survivors only pray that this unstoppable flame does not burn everything to the ground.\n\nLord, have mercy. (Kyrie, eleison)"
 # Trinity National Focus #
 TRM_focus_tree: "Trinity Basic Focus Tree"
 TRN_nagisa_focus: "Iron Lady Focus Tree"
 TRM_newfocus_0: "Crisis Response"
 TRM_newfocus_0_desc: "Our academy has fallen into another world due to some supernatural phenomenon or suspicious experiment. Our current location is unidentified, and while connections with other academies remain, the numerous industrial facilities and railway networks necessary for the normal operation of the academy have all collapsed."
 TRM_newfocus_1: "Calming the Students"
 TRM_newfocus_1_desc: "Our academy has been moved to an unknown location by an mysterious supernatural phenomenon. However, the aftermath of this phenomenon has not yet completely subsided, leaving traces throughout our society and causing chaos. It is not too late; we must clearly inform society of the truth behind this incident and strictly arrest those who seek to incite unnecessary confusion or start riots to maintain order."
 TRM_localization: "Trinity Localization"
 TRM_localization_desc: "We must now carry out the industrial restructuring that has been stagnant due to various conflicts of opinion since the Great Migration. Trinity Comprehensive Academy will be remodeled into a form suitable for this world."
 TRN_economic_adjustment: "Industrial Precepts"
 TRN_economic_adjustment_desc: "As Trinity's industrial development reaches its final stage, we will support the development of basic industrial infrastructure technology to focus on achieving Trinity's industrialization."
 TRN_trade_union: "Guaranteeing Labor Union Activities"
 TRN_trade_union_desc: "As Trinity's industrial development reaches its final stage, we must guarantee rights to the workers who have been treated oppressively."
 TRM_newfocus_3: "Seeking Compromise"
 TRM_newfocus_3_desc: "We have had continuous friction with the locals. Since the first phenomenon occurred, we fought for our right to survive, but the locals also resisted and did not back down easily. Ultimately, this struggle ended in our victory, but dissatisfaction still remains among the locals. Now is the time to compromise with them, and for this purpose, we must appoint Kenzaki Tsurugi as our representative negotiator."
 TRM_newfocus_4: "Analysis"
 TRM_newfocus_4_desc: "Through the cooperation of the Library Committee and other clubs, we have confirmed that this place is not a mere delusion, illusion, or fiction, but a completely different world. Announcing this immediately will cause a lot of backlash, but it is better than knowing nothing at all. Also, the schedule for the Tea Party emergency meeting is nearing its end. It is time to elect a new Host."
 TRN_Request_assistance_from_Sisterhood: "Conciliate the Sisterhood"
 TRN_Request_assistance_from_Sisterhood_desc: "After the Pater faction and Misono Mika were ousted for leading the chaos in Trinity and attempting a coup, [TRM.GetLeader] has decided to request help from the Sisterhood for the stability of Trinity."
 TRN_Request_assistance_from_relief_knights: "Conciliate the Relief Knights"
 TRN_Request_assistance_from_relief_knights_desc: "After the Pater faction and Misono Mika were ousted for leading the chaos in Trinity and attempting a coup, [TRM.GetLeader] will contact the Relief Knights, the successors of the old Johannine faction who are voluntarily serving Trinity, to resolve the administrative vacuum."
 TRN_suppress_the_opposition: "Suppress Factional Politics"
 TRN_suppress_the_opposition_desc: "We will suppress other factions within Trinity to further expand the influence of the Filius faction and bring complete stability to Trinity."
 TRN_Trinitys_Balance: "Trinity's Balance"
 TRN_Trinitys_Balance_desc: "We will bring stability within Trinity through balanced politics, and through mutual surveillance between factions, we can also suppress the dictatorial behavior of any single faction."
 TRN_nagisa_coupdetat: "Palace Coup"
 TRN_nagisa_coupdetat_desc: "Now that Nagisa is imprisoned, the Filius faction needs to rescue her. We will rescue Nagisa with the help of cooperating factions and arrest Misono Mika."
 TRN_nagisa_lottery: "Rehabilitate Nagisa"
 TRN_nagisa_lottery_desc: "We will rehabilitate Nagisa, who was imprisoned after falling for the Pater faction's schemes, and then determine the Student Council President who will lead Trinity."
 TRN_new_trinity: "Morning Star of Trinity"
 TRN_new_trinity_desc: "Now that the series of chaos at Trinity Comprehensive Academy has ended, we can establish new precepts for Trinity."
 TRN_trinity_reorganization: "Trinity Restructuring"
 TRN_trinity_reorganization_desc: "Kirifuji Nagisa has removed all enemies of the academy that threatened the Tea Party and, by extension, Trinity. Trinity will be reorganized around Kirifuji Nagisa and the defenders of that entire system, ensuring the academy's longevity."
 TRN_stabilization_of_the_system: "System Stabilization"
 TRN_stabilization_of_the_system_desc: "Trinity's traditional system has governed Trinity for a very long time, and it will continue to do so. Even if various changes exist, Trinity's stability will persist."
 TRN_decentralization_of_power: "Decentralization of Power"
 TRN_decentralization_of_power_desc: "To prevent a similar situation from occurring again, we must reform the power structure concentrated in the Tea Party. We will ensure the continuity of Trinity's system by establishing a power monitoring mechanism."
 TRN_trinity_tank_brigade: "Trinity Tank Brigade"
 TRN_trinity_tank_brigade_desc: "Trinity Comprehensive Academy needs tanks. Tanks are always right and wonderful, so we must ensure every student can operate a tank and produce them in mass quantities."
 TRN_trinity_supremacy_focus: "Trinity Supremacy"
 TRN_trinity_supremacy_focus_desc: "There is a reason for Trinity Comprehensive Academy to occupy a powerful position on the international stage. Accordingly, Trinity must move forward to seize world hegemony."
 TRN_guardian_of_the_academy_focus: "Guardian of the Academy"
 TRN_guardian_of_the_academy_focus_desc: "Kirifuji Nagisa needs to firmly arm and prepare the academy for dangerous situations. Trinity Comprehensive Academy must prepare to navigate the various conflicts that will follow."
 TRN_threat_exclusion: "Exclusion of Threats"
 TRN_threat_exclusion_desc: "Now that we are aware of the Arius Satellite School's existence, we cannot leave them be. We will bring about the end of the academy filled with hatred by our own hands."
 TRN_preventive_war: "Preventive War"
 TRN_preventive_war_desc: "Poland lost a significant portion of its territory due to Trinity Comprehensive Academy's Great Migration. Although there was no major friction with Trinity due to wars with other nations, they harbor ambitions to recover their territory, which could pose a major threat to us."
 TRN_nazi_oppression: "Purge the Nazis"
 TRN_nazi_oppression_desc: "We will completely expel the 'National Socialist German Workers' Party' from Trinity, which had joined hands with Mika, the head of the Pater faction, to throw all of Trinity into chaos."
 TRN_Reunion_of_the_Treaty_of_Eden: "Reunion of the Eden Treaty"
 TRN_Reunion_of_the_Treaty_of_Eden_desc: "By resuming the Eden Treaty, which had been pursued since before the Great Migration, we can reach a comprehensive agreement between Trinity and Gehenna and oppose external threats."
 TRN_Treaty_of_Eden: "Establish the Eden Treaty"
 TRN_Treaty_of_Eden_desc: "Now that the agreement between Gehenna and Trinity is finalized, we will declare the success of the Eden Treaty and build a massive power bloc."
 TRN_establishment_of_the_eden_treaty_organization: "Peace and Coexistence"
 TRN_establishment_of_the_eden_treaty_organization_desc: "The Gehenna Academy delegation evaluated our efforts to push for the Eden Treaty positively and agreed to its formation. Before long, we will be able to sever the ill fates of the past and move toward peace and coexistence."
 TRN_joint_economic_development: "Cooperative Industrial Development"
 TRN_joint_economic_development_desc: "Under the Eden Treaty, both academies have an obligation to pursue peaceful development. We will cooperate with Gehenna to improve the industries of the treaty nations, thereby achieving industrial growth for the Eden Treaty Organization."

 TRN_war_with_Gehenna: "Those Who Cannot Coexist"
 TRN_war_with_Gehenna_desc: "Gehenna Academy has long disparaged our attempts at the Eden Treaty and has now even kicked out our delegation. It is time to change our diplomatic stance. We need to show those ungrateful horned-heads a lesson."
 TRN_anti_german_anti_gehenna: "Anti-Gehenna, Anti-German"
 TRN_trinity_movement: "Trinitarian Movement"
 TRN_the_dignity_of_the_empire: "Dignity of the Empire"
 TRN_pro_trinity_volunteer_corps: "National Volunteer Corps"
 TRN_our_homeland: "Our Homeland"
 TRN_crusade_against_the_trinity: "Pan-Trinity Crusade"

 TRN_deep_hatred: "Deep Hatred"
 TRN_deep_hatred_desc: "Now that war with Gehenna has begun, the deep-seated hatred for Gehenna rooted in Trinity can be used effectively."
 TRN_Confirmation_of_intention_to_treaty: "Confirm Treaty Intent"
 TRN_Confirmation_of_intention_to_treaty_desc: "Gehenna Academy has faced much chaos since the Great Migration. Even if the Gehenna leadership was positive about the Eden Treaty before the migration, the current situation might be the opposite. We will dispatch an envoy to Gehenna to confirm their intent regarding the Eden Treaty."
 TRN_Gehenna_Trinity_Conference: "The Grand Compromise"
 TRN_Gehenna_Trinity_Conference_desc: "Since the establishment of the Eden Treaty Organization has hit a snag, we must begin long-term talks with Gehenna. Trinity's Ministry of Foreign Affairs hopes for a successful agreement between the two nations."
 nagisa_imprisoned_flag: "§RNagisa has been Imprisoned§!"
 TRM_newfocus_21: "Neutralize Nagisa"
 TRM_newfocus_21_desc: "To seize full power over Trinity, it is necessary to neutralize Kirifuji Nagisa, the acting Host of the Tea Party, and throw her into prison. However, simply gaining the authority of the Tea Party is not enough."
 TRN_nagisa_cahin_tt: "§tThe hour of judgment has arrived.§!"
 TRN_nagisa_cahin_2_tt: "§YKirifuji Nagisa§! can no longer access the authority of the Tea Party."
 TRM_newfocus_7: "The Meeting"
 TRM_newfocus_7_desc: "As Trinity transitioned to another world, a significant new choice has emerged. Originally, the plan was to contact the Arius Squad to succeed in the coup, but since we cannot identify Arius's current location, we must boldly abandon that cooperation. Instead, it would be advisable to decide Trinity's future by cooperating with the NSDAP, which played a similar role to the \"Tea Party\" locally."
 TRM_newfocus_26: "Legal Revision"
 TRM_newfocus_26_desc: "The academy's rules are democratic, which works against us gaining absolute power. But it's different now. Since we have become the Host of the Tea Party and swept away all those who opposed us, we must modify the laws to suit us."
 TRM_newfocus_28: "Strengthen the Regime"
 TRM_newfocus_28_desc: "During the Great Purge, our power could not exercise as much influence as thought. But now that we have eliminated everyone who doubted our authority and stand above them all, we must obtain the power that befits this position."
 TRM_newfocus_27: "Archangel, Misono Mika"
 TRM_newfocus_27_desc: "Trinity Comprehensive Academy is a large family made of various factions, and every family needs a head. Student Council President Misono Mika is that head. She is the person who will lead the various factions to accept new ideologies, eradicate all the decadence of the old regime, and lead us toward a bright future."
 TRM_newfocus_33: "§tPolitical Rival§!"
 TRM_newfocus_33_desc: "[TRN_scripted_loc]"
 TRN_desc_after_localization_key: "New Student Council President Misono Mika, unable to stand by while the Tea Party remained in chaos and the proud history of Trinity spiraled toward catastrophe, made the decision for salvation. She personally led the military to seize control of the incompetent Trinity leadership. President Mika will personally make Trinity great from this moment on, announcing a large-scale 'processing' of the malicious and incompetent personnel who have been eating away at Trinity, and vowing to use all her strength for Trinity."
 TRN_desc_before_localization_key: "§tTop Secret§!"
 TRM_tail_chasing: "Catching the Tail"
 TRM_tail_chasing_desc: "We have identified the forces behind the scenes that are undermining Trinity's stability. It is now time to wipe them all out."
 TRM_arius_annex: "Reclaim Arius"
 TRM_arius_annex_desc: "Arius opposed our peaceful unification in the past, eventually collapsing through continuous conflict and hiding in the ruins to stubbornly survive. However, as their location was revealed following the Great Migration, we must reclaim them to eliminate the threat."
 TMR_anti_gehenna: "Anti-Gehenna Propaganda"
 TMR_anti_gehenna_desc: "They have horns! They are chaotic! They probably don't even like tea! How can we coexist with such creatures? Let the students know the 'truth' about the devils across the border."
 TRM_invite_dignitary: "Appoint German Thinkers"
 TRM_invite_dignitary_desc: "There are still thinkers of German origin in the Trinity region, and they have certain connections with ideologues. In particular, some figures have the potential to become the vanguard of a new revolution based on a deep understanding of Trinity's unique ideology. Their ideas manifest in a way that interprets Trinity's eternal spirit and faith in a more dynamic and nationalistic manner."
 TMR_support_with_germany: "Local Cooperation"
 TMR_support_with_germany_desc: "These people, who refer to themselves as citizens of the former German Reich, know everything about Germany. However, far from knowing the geography, it took us a long time just to figure out where we are. Our offensive could face difficulties when we invade Gehenna. Therefore, we need to achieve a strategic advantage by supporting the Germans within Gehenna."
 TRN_german_company_acceptance: "Accept German Companies"
 TRN_german_company_acceptance_desc: "Various types of companies exist locally. Although they clearly have some antipathy toward us, they haven't lost the essence of being a corporation. If we put money in their hands, we can turn them all to our side."
 TRN_self_reliance: "Improve Academy Industry"
 TRN_self_reliance_desc: "Using German companies would allow for easy industrial adaptation, but there is a threat of decreasing the academy's influence. We should exclude German-affiliated companies and grow the academy industry as the core."
 TRN_Trinity_Industrial_Development_Department: "Trinity Industrial Development Department"
 TRN_Trinity_Industrial_Development_Department_desc: "Since we've decided to focus on developing the academy industry, we need a specialized department. The Trinity Industrial Development Department will oversee all Trinity industry and drive large-scale economic development."
 TRM_Endsige: "Final Victory"
 TRM_Endsige_desc: "Trinity's final conquest has concluded with a blade driven deep into the heart of the enemy. Numerous enemies threatened Trinity and tried to trample us. But the enemies only met the same fate at the tip of a sharp spear. Now that the war is over, we must advance toward the future."
 TRM_Endsige2: "Personality Cult"
 TRM_Endsige2_desc: "Under Misono Mika's superb leadership, Trinity finally declared victory and promised a new era of eternal peace and prosperity. Mika's leadership was decisive in Trinity reaching this point, and this must be praised."
 TRM_Endsige2_tt: "\n§YMisono Mika§! loses all traits!"
 TRM_Endsige3: "Leader of Trinity"
 TRM_Endsige3_desc: "Misono Mika declared that the core of the Trinity Knight-State is the students of Trinity, and Trinity must be reorganized around them. As the Leader of Trinity, Mika emphasized resolving existing problems and reflecting the values of the students to create a more perfect and loyal Trinity."
 TRM_Endsige7: "The Savior"
 TRM_Endsige7_desc: "Misono Mika not only saved us during the massive crisis of the 'Great Migration' but also stood firm in protecting us from external threats. Furthermore, the sight of her leading God's army to conquer evil is enough to remind one of \"Archangel Michael.\" It would not be an exaggeration to call Misono Mika, who has shown such superb leadership and dedication, our \"Savior.\""
 TRM_Endsige5: "The \"Sovereign\""
 TRM_Endsige5_desc: "An era of peace currently persists, but uncertainties remain. Externally, forces seeking to threaten Trinity are lurking, and internally, anti-Trinity terrorism is occurring. Therefore, this is an \"exceptional situation\" where legal norms do not function properly, and the one who makes policies in such an exceptional situation is Misono Mika, the true \"Sovereign.\""
 TRM_Endsige4: "Servants of the Germanic Race"
 TRM_Endsige4_desc: "Misono Mika declared that the core of the Trinity Knight-State lies with the Germanic race—the Germans. Furthermore, she defined them as \"Übermensch,\" emphasized that we should emulate their superiority, and published guidelines stating that we must strive toward this goal. This declaration will serve as an important guideline, presenting the standards and direction that will lead Trinity's future."
 TRM_Endsige6: "National Revolution Declaration"
 TRM_Endsige6_desc: "Though slow, we are surely moving toward becoming the \"Übermensch.\" To reach our ideal goals more swiftly, we must declare a National Revolution and fulfill our responsibility and duty to boldly cut away those who fall behind in this race and reach the finish line. Even if many sacrifices occur in this process, we must never lose our purity and superiority."
 TRM_Endsige8: "Trinity's New Dawn"
 TRM_Endsige8_desc: "Following Misono Mika's ideal, Eden has finally unfolded at the destination. All people enjoy equal and abundant lives, and the magnificent work of art that is Trinity shines brightly today. All balance has been achieved, resulting in perfect harmony, and a true \"Trinity\" where the race, the state, and the Führer are combined into one has been realized."
 TRN_ENDSIGE_TT: "§LBloom in the light of prosperity, flourish, O Trinity!§!"
 TRN_kickstart_the_war_industry: "Eden Arsenal"
 TRN_kickstart_the_war_industry_desc: "The Eden Arsenal is insufficient to meet all the demand for ammunition and small arms. We must build more factories across the nation, especially near safe regions."
 TRN_military_training: "Military Training"
 TRN_military_training_desc: "The soldiers are not yet ready. Therefore, we will begin large-scale military training to prepare for war."
 TRN_muchabyeol_jingbyeong: "Expand Conscription"
 TRN_muchabyeol_jingbyeong_desc: "Expand Conscription"
 TRM_after_war: "Post-War Processing"
 TRM_after_war_desc: "Trinity's proud army has gallantly planted its flag deep in the heart of Gehenna, and the enemy has surrendered. We must process the vast territory of Gehenna Academy under legitimate procedures."
 TRM_germany_union: "Union Law Declaration"
 TRM_germany_union_desc: "To be honest, Gehenna's territory can be considered the heart of German industry. Especially the Rhineland industrial zone, which has very high strategic value and potential to be used effectively. However, due to recent terrorist attacks by Trinity students, it is nearly impossible to utilize these factories stably. Therefore, declaring a Union Law to resolve these issues and dissipate the emotions between both academies will be an important task."
 TRM_arius_attack: "Ultimatum to Arius"
 TRM_arius_attack_desc: "The Arius Satellite School is like an unrecovered territory that broke away from Trinity. There is plenty of reason to crush them for the complete unification of Trinity."
 TRM_We_need_Denmark_milk: "Demand Denmark"
 TRM_We_need_Denmark_milk_desc: "Denmark is in a strategic position geographically connecting the North Sea and the Baltic Sea. It also serves as a bridgehead connecting Red Winter and Kivotos, occupying a favorable position for access to the North Atlantic. If Trinity can secure Denmark, it will greatly strengthen our influence in the Nordic region. By acquiring control over Denmark, we can hold a favorable position in relations with Red Winter and increase accessibility to maritime trade routes."
 
 TRM_redwinter_war_goal: "Weserübung"
 TRM_redwinter_war_goal_desc: "The abundant natural resources, vast territory, and numerous trees held by [RED.GetAdjective] have the potential to be excellent raw materials for our future construction. However, they are using these as a means to pressure us. To end this situation, we should strike preemptively to correct their arrogant attitude."
 TRM_We_need_Denmark_milk_flag: "§Y[RED.GetAdjective]§! yields §Y[DEN.GetAdjective]§!"
 TRM_We_need_Denmark_milk_flag_tt: "Current Days: [?TRM_We_need_Denmark_milk_flag:days|Y0]"
 TRM_We_need_Denmark_milk_flag_tt_NOT: "Current Days: [?TRM_We_need_Denmark_milk_flag:days|Y0]"
 TRM_war_with_the_ussr: "Red Twilight"
 TRM_war_with_the_ussr_desc: "[SOV.GetAdjective] is an existence that poses a great threat to the world. They are a force of terror that aims to spread communism throughout the world. Therefore, our army must attack them to save the world from the clutches of communism."
 TRN_gwanryuje_jaijungbee_flag: "§Y$TRN_gwanryuje_jaijungbee$§! Focus Completed"
 TRN_gwanryuje_jaijungbee_flag_tt: "Current Days: [?TRN_gwanryuje_jaijungbee_flag:days|Y0]"
