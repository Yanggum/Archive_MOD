 TRN_collapse_event.1.t: "Anti-Trinity Resistance Organizations Rally"
 TRN_collapse_event.1.desc: "Our operation to sweep the resistance forces has ended in a fatal failure, and as a result, public sentiment has completely tilted toward the resistance. This turning point provided them with a huge opportunity, and now they are moving more and more boldly under the slogan 'Destruction of Trinity.'\n\nThe resistance is not merely an armed force; it is expanding its power by gaining broad support from citizens, regardless of whether they are in cities or rural areas. Using not only military force but also public support as a weapon, they are taking back the areas we controlled one by one.\n\nNow we are faced with a situation where we are not just dealing with a simple resistance force, but must fight the entire populace united with them. Unless we turn public sentiment back, this war will grow longer, and we cannot give them our cities and towns. This war will go beyond a simple battle and become a desperate struggle for the survival of our academy."
 TRN_collapse_event.1.a: "We must deal with this immediately."

 TRN_collapse_event.2.t: "Resistance Uprising"
 TRN_collapse_event.2.desc: "While the resistance was perfectly establishing their command structure, we were unable to take effective measures to stop them. In our carelessness and confusion, they have completed thorough preparations and are now ready to fight our rule by establishing their own independent system.\n\nNow, the resistance has established their new national identity and officially declared war on us. They are no longer a force operating in hiding. Rather, they are confronting us as a single unified system, strongly pushing their goals with public support behind them.\n\nIn this situation, we can never back down. If we fail to stop the rise of the resistance, our system and academy will be in danger of collapsing. We must use all our strength to block their advance and protect our existence. From now on, everything will be an all-out war under the name of Trinity, to protect the dignity of our academy. No matter what sacrifices are required, we must be victorious. For Trinity!"
 TRN_collapse_event.2.a: "Suppress them by any means necessary!"
 TRN_collapse_event.2.b: "Overthrow Trinity!"

 TRN_collapse_event.3.t: "Aftermath"
 TRN_collapse_event.3.desc: "The power of those we should now call rebels, rather than resistance, is growing day by day. Their might has surpassed simple armed activity; they now possess their own system, are announcing clear platforms, and are agitating the masses. Their influence has spread rapidly, and other rebel forces are imitating their methods one by one after seeing this.\n\nAs platforms to oppose Trinity spread in various places, the number of rebel organizations resisting us is increasing. Using the successful activities of the resistance as an example, they are developing into their own independent forces, and they are now preparing for a systematic war rather than a simple small-scale rebellion.\n\nAnd today, one of those rebel organizations has officially declared war on us. Because of this, we are placed in a position where we must fight on more extensive fronts. Rebellion is no longer a problem of one region but has spread as a serious threat occurring throughout the academy. We must now prepare for a larger-scale war and mobilize all resources for the survival of the academy to fight on this new front. There is no retreat in this war where our fate is at stake. We must defend Trinity."
 TRN_collapse_event.3.baddesc: "Today, another rebel organization has declared war on us. We are now in a situation where we must fight on several fronts simultaneously, and this fight is demanding all of our resources. The all-out war for the survival of the academy has begun."
 TRN_collapse_event.3.a: "We must stop them even now!"

 TRN_collapse_event.4.t: "Collapse of [FROM.GetName]"
 TRN_collapse_event.4.desc: "As the internal political situation of [FROM.GetName], who is at war with us, deteriorated, it became an opportunity for anti-Trinity resistance organizations to regroup. The anti-Trinity resistance has declared a revolutionary war against Trinity and is reportedly engaged in continuous skirmishes.\n\nWe must decide whether to recognize the Trinity resistance organizations or to continue our war without recognizing them."
 TRN_collapse_event.4.a: "They are innocent."
 TRN_collapse_event.4.b: "This will cause setbacks in future international diplomacy."

 TRN_collapse_event.5.t: "Reunification with Poland"
 TRN_collapse_event.5.desc: "After the desperate struggle of the Polish Western Army, they have succeeded in defeating the Trinity invaders and reclaiming their territory. Now we can return to our homeland and unfold a new future. Of course, we could also claim sovereignty over this region and become the ruler of the western areas."
 TRN_collapse_event.5.a: "We go West."
 TRN_collapse_event.5.b: "Long live Poland!"

 TRN_collapse_event.6.t: "Anti-Trinity Resistance Organization"
 TRN_collapse_event.6.desc: "Taking advantage of our recent political chaos, the resistance organizations that had been operating underground have finally surfaced. The resistance, rallying under the cry of 'Anti-Trinity,' is still small in power, but their influence is rapidly expanding amidst the chaotic situation.\n\nEven at this moment, the resistance is increasing its supporting forces, and if left unattended, they will approach as a much greater threat. We must suppress them thoroughly before it is too late."
 TRN_collapse_event.6.a: "Suppress immediately."

 TRN_collapse_event.7.t: "Final Struggle"
 TRN_collapse_event.7.desc: "Due to our swift suppression, the resistance has hurriedly declared war on us in an unprepared state. They are not yet perfectly prepared, and an opportunity to end this chaos has been given to us.\n\nNow is the decisive moment to completely expel the resistance and straighten out the wavering public sentiment. We must respond quickly and powerfully to end the chaos."
 TRN_collapse_event.7.a: "Is this all?"

 TRN_collapse_event.8.t: "Suppressed Chaos"
 TRN_collapse_event.8.desc: "Through our continuous and swift suppression operations, the resistance has disappeared back underground, and all of their collaborators have been imprisoned. It will take a long time for them to come back out."
 TRN_collapse_event.8.a: "Good."

