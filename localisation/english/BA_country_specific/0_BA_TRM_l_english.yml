 TRM_Secure_Royal_Blood_decision_search_tt: "§YOperation Iron Sword§! begins to apprehend §Yterrorists§!."
 TRM_Secure_Royal_Blood_decision_search_run_tt: "Identify the masterminds behind the §Yterrorists§!."
 TRM_Secure_Royal_Blood_decision_search_run_desc_tt: "§YOperation Iron Sword§! to apprehend §Yterrorists§! concludes."

 TRM_ironsword_event.1.t: "Operation Iron Sword"
 TRM_ironsword_event.1.d: "Anti-government terror acts carrying out operations in Trinity's shadows are being discovered everywhere. Accordingly, Mika Misono has begun 'Operation Iron Sword' to root them out. Operation Iron Sword is a joint operation cooperating with the intelligence department and elite personnel of the Justice Task Force to identify the masterminds of the terror. As terror activities threatening Trinity's stability increase, their cooperation will be vital."
 TRM_ironsword_event.1.a: "We do not negotiate with terrorists."

 TRM_ironsword_event.2.t: "Revealed Reality"
 TRM_ironsword_event.2.d: "After a long investigation, we have apprehended the agent who was active behind the scenes of Trinity. After harsh torture, the agent began to speak the truth, stating that the Arius Branch School is behind them. Currently, the agent has been imprisoned after treatment."

 TRM_ironsword_event.3.t: "Progress in Investigation"
 TRM_ironsword_event.3.d: "We have located the terrorists' base. We conducted an operation and raided it, apprehending the terrorists, but failed to identify their masterminds. However, by arresting the terrorists, Operation Iron Sword has proven its effectiveness."

 TRM_ironsword_event.4.t: "Investigation Concluded"
 TRM_ironsword_event.4.d: "Through a large-scale joint operation by [KSP.GetName], the Justice Task Force, and the Intelligence Department, we successfully found and apprehended the masterminds of the terror. As Operation Iron Sword ends in success, the threat of terror has disappeared from Trinity. The Justice Task Force members and Intelligence agents who participated in the operation will gain honor and wealth. Of course, so will the investigators of [KSP.GetName]."
 TRM_ironsword_event.4.d_2: "Through a joint investigation by the Justice Task Force and the Intelligence Department, we successfully found and apprehended the masterminds of the terror. As Operation Iron Sword ends in success, the threat of terror has disappeared from Trinity. In particular, the Justice Task Force members and Intelligence agents who participated in the operation will gain honor and wealth."

 TRM_ironsword_event.10.t: "Joint Investigation Proposal from [FROM.GetName]"
 TRM_ironsword_event.10.d: "Shortly after [FROM.GetName] declared war on terror, they requested help from [ROOT.GetName]. They stated that [ROOT.GetName]'s experience would be a great help in the terrorist apprehension operation called 'Operation Iron Sword.' Should we intervene in their operation?"

 TRM_ironsword_event.11.d: "[FROM.GetName] rejected our demand, citing various reasons. While the investigation itself won't suffer setbacks, it will take longer to apprehend the culprits."
 TRM_ironsword_event.12.d: "[FROM.GetName] has expressed their intention to cooperate with us! Their help will be a great aid in apprehending the culprits."

 TRM_Nagisa_Iron_sword_op_cat: "Arius Rooting Out Operation"
 TRM_Nagisa_Iron_sword_op_cat_desc: "The series of disturbing signs in Trinity show that someone is deeply intervening in the academy. We must definitely reveal the organization carrying out these acts. Around the same time, a hideout with symbols suspected to be from the Arius Branch School was found near Gedania...\n\nCurrent Search Rate: §Y[?TRM_Nagi_IronSword_Var]%§!"
 TRM_Nagi_IronSword_Var_plus: "Search rate increases by $RIGHT|+=%%1$."
 TRM_Nagi_IronSword_Danzig_Search: "Search Danzig"
 TRM_Nagi_IronSword_Danzig_Search_desc: "In the process of contacting locals, we discovered a hideout in the Danzig region that appears related to Arius. Searching this area may lead to important clues."
 TRM_Nagi_IronSword_intelligence_agency: "Request Intelligence Bureau Investigation"
 TRM_Nagi_IronSword_justice_task_force: "Mobilize Justice Task Force"
