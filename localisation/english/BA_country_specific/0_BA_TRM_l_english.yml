 TRN_research_rifle: "Analyze German Doctrine"
 TRN_research_rifle_desc: "The German way of fighting was unfamiliar yet impressive to Trinity. Their blitzing breakthrough tactics based on mobility gave a strong shock and deep inspiration to the Trinity command, which will soon be reinterpreted in our own way and reborn as Trinity's unique doctrine."
 TRM_Centralised_Command: "Centralized Command"
 TRM_Centralised_Command_desc: "A centralized command is essential for military combat. We must avoid at all costs any other methods that would lead to catastrophe. The military can only succeed if the generals become a well-oiled machine that can lead to victory confidently and quickly. Therefore, we should aim to create a combined military command structure."
 TRM_encourage_radio_use: "Encourage Radio Use"
 TRM_encourage_radio_use_desc: "In past wars, radios were introduced as a major innovative technology, greatly expanding the range of military communication and enhancing command and control capabilities on the battlefield. While radio use in Trinity is still in its early stages, with a little effort, we can quickly apply this new technology to our forces to deliver organized and concentrated strikes against enemy vulnerabilities."
 TRM_Streamline_Intelligence_Gathering: "Streamline Intelligence Gathering"
 TRM_Streamline_Intelligence_Gathering_desc: "It is difficult to fight an enemy you do not understand. While the centralization of the military provided the staff with knowledge about our own forces, understanding the enemy on the other side is just as important. All means of gathering such information must be integrated into the military structure."
 TRM_Empower_the_Generals: "Empower the Generals"
 TRM_Empower_the_Generals_desc: "Having experienced civil wars for centuries, Trinity's generals have accumulated rich experience to flexibly handle all situations. What they need is to be granted the authority to properly command the military, and for those below them to know how to pay attention."
 TRM_Protectors_of_the_Motherland: "Protectors of the Motherland"
 TRM_Protectors_of_the_Motherland_desc: "Other armies fight for gold, honor, or godless ideologies, but the Trinity army fights for the academy and the cross. To many foreigners, Trinity is an academy of secretive and noble ladies, but to Trinity students, it is like a home with no secrets. Trinity students have done great and beautiful things in this land and will continue to do so, and any academy that thinks they can conquer this land will be in for a shock."
 TRM_Asymmetric_Tactics: "Mission-Type Tactics"
 TRM_Asymmetric_Tactics_desc: "Historically, opaque and slow command structures have brought difficulties and are systems that hasten tactical defeat. During the civil war centuries ago, we solved the problem by decentralizing decision-making power to lower-level units and fostering a culture that encouraged lower-level officers to make tactical judgments themselves based on field conditions rather than passively waiting for orders from superiors."
 TRM_Decentralised_Structure: "Decentralized Structure"
 TRM_Decentralised_Structure_desc: "Orthodox military thought tends to worship the superiority of a supreme general who commands the military like pieces on a chessboard. However, the reality of war is messy and complex. An overly centralized command structure risks becoming rigid and inflexible in the fast pace of modern warfare. A more decentralized structure can avoid these traps."
 TRM_Trinity_Field_Artillery: "Trinity Field Artillery"
 TRM_Trinity_Field_Artillery_desc: "Trinity's field artillery is famous even in other academies. Due to high accuracy and immense destructive power, bombing points are literally flattened. Now, through collaboration with the Eden Design Bureau, we must further improve the performance of Trinity's unique field artillery and secure even more powerful destructive power."
 TRM_Officer_Initiative: "Officer Initiative"
 TRM_Officer_Initiative_desc: "Modern warfare is chaos itself. The perspective of the supreme command and the actual battlefield situation can differ greatly, and situations can change in an instant. Therefore, it is necessary to grant authority for goal setting and important decisions to field officers. This allows our military to adapt quickly and respond effectively even in high-pressure situations. This emphasizes the importance of a decentralized command structure, an effective strategy for dealing with the uncertainty of the modern battlefield."
 TRM_unity_of_doctrine: "Unity of Doctrine"
 TRM_unity_of_doctrine_desc: "The Trinity officer corps is experienced and highly skilled, but their approach to military doctrine varies wildly. Ground force reforms mainly focused only on organizational issues, and generals were able to conduct war in whatever way they wanted. However, the operational methods differ for each officer, which inevitably becomes a hindrance to achieving consistent military success."
 TRM_Reorganise_Armament_Production: "Reorganize Armament Production"
 TRM_Reorganise_Armament_Production_desc: "The current state of weapon production is, in a word, a disaster. The aftermath of the Great Migration still remains. Production chains are often severed, obsolete, or both, and these are not conditions under which a modern military can fight. We must thoroughly reorganize this system to ensure soldiers can secure the guns to fight Trinity's enemies."
 TRM_Expand_the_Logistics_Corps: "Expand Logistics Corps"
 TRM_Expand_the_Logistics_Corps_desc: "One of the greatest lessons from the Trinity Civil War is that logistics are more important than anything for a modern military. Without the timely provision of military equipment, special resources like fuel, and simple daily necessities, an army cannot exist. Therefore, the expansion of the military must necessarily occur alongside the expansion of the logistics corps."
 TRM_Local_Workshops: "Local Workshops"
 TRM_Local_Workshops_desc: "In the era of industrial warfare, we must seek all means to increase military production. Through a system of local workshops across the country, we can organize production in a way that considers regional conditions and expand production to the smallest possible settlements where industry is feasible."
 TRM_Terrestrial_Dreadnoughts: "Expand Eden Tank Design Department"
 TRM_Terrestrial_Dreadnoughts_desc: "The Eden Tank Design Department is an organization that boasts some of the best technical skills within Trinity, specializing in the research, design, and mass production of high-quality tanks. Based on a deep understanding of tank technology and years of accumulated know-how, their excellence is recognized throughout Kivotos. If we further expand these facilities and personnel and strengthen support for the design department, Trinity will be able to occupy a distinct strategic advantage in future tank warfare."
 TRM_superb_training: "Superb Training"
 TRM_superb_training_desc: "The strength of an army depends on the combat power of individual soldiers. Even with all the noise about new technologies and revolutions in war, soldiers are inevitably needed to utilize them, and a soldier untrained in weapon use is merely a farmer with a gun. The Trinity army must be the best in the world, and therefore our soldiers must be trained to be the best in the world."
 TRM_Expand_The_High_Command: "Expand the High Command"
 TRM_Expand_The_High_Command_desc: "The supreme command of the military cannot be a social club for high-ranking individuals like during the past Trinity Civil War. Exclusivity and factionalism that hinder military efficiency will not be tolerated and cannot be accepted. Instead, we will expand the staff to include all the most outstanding commanders. Only the best of the best can lead the world's strongest military."
 TRM_Officer_Training_Academies: "Military Academies"
 TRM_Officer_Training_Academies_desc: "While records from the civil war became textbooks for training numerous talents, the old military academy structure was often unsuitable for disseminating this wisdom to the military. We must reform the academies to properly teach modern warfare techniques not only to generals but also to lower-level officers."
 TRM_Combined_Arms: "Combined Arms"
 TRM_Combined_Arms_desc: "Combined arms theory is presented as the logical conclusion of military technology development. It envisions a perfect harmony of combat weapons that creates an indefensible attack by utilizing a combination of infantry, armor, air force, and navy simultaneously. It is an attractive vision." 
 TRM_Mass_Breakthroughs: "Mass Breakthrough"
 TRM_Mass_Breakthroughs_desc: "Armor is the future. With the development of technology, fortresses can now move at speeds previously thought impossible with the support of infantry moving only by tank. To create true modern armored units that can encircle and destroy enemy divisions at record speeds, we must support the development of new tanks."
 TRM_Land_Air_Integration: "Land-Air Integrated Tactics"
 TRM_Land_Air_Integration_desc: "Despite all the noise about air power, it is ultimately a complementary force. Regardless of its structure and use, discussions on military aviation inevitably return to how to support ground forces. By staying true to this philosophy, we can devise an air force that doubles military efficiency by providing support where and when it is needed."
 
 TRN_Luftwaffe: "Reorganize Trinity Air Force"
 TRN_Luftwaffe_desc: "During the incident, the Trinity Air Force did not perform as well as expected, and its limits were clearly revealed. However, we highly value the bravery and combat methods of the German Air Force we encountered on that battlefield and will transplant their spirit and tactics into the Trinity Air Force."
 TRN_Standardise_Pilot_Training: "Standardize Pilot Training"
 TRN_Standardise_Pilot_Training_desc: "Military aviation still bears many characteristics of an emerging technology, one of which is the very impromptu way in which knowledge is shared. There is no unified training system; instead, it's believed that experienced pilots should teach techniques in their own way. This has resulted in a remarkably inconsistent knowledge base among our pilots. It is now time to standardize this process."
 TRN_Promote_Amateur_Flying: "Promote Amateur Flying"
 TRN_Promote_Amateur_Flying_desc: "Amateur piloting has become a growing phenomenon—in recent years, many civilians have taken up flying as a hobby, and some have achieved great fame by accomplishing impressive feats like transatlantic crossings. If we nurture and direct this public image, we can cultivate an experienced manpower pool for our air force."
 TRN_Night_Witches: "Night Witches"
 TRN_Night_Witches_desc: "A famous female aviator has proposed a shocking idea to the Trinity Air Force: an air regiment composed entirely of women. Contrary to all conventional wisdom, there are actually some officers who support her plan. They argue that this plan has immense propaganda value and can inspire other pilots to reach bold new heights for Trinity."
 TRN_Aviation_Bureaus: "Aviation Bureaus"
 TRN_Aviation_Bureaus_desc: "Aviation is a delicate technology. Even a seemingly small defect can cause disaster in the sky, and designing an aircraft that can withstand the rigors of combat requires perfection. Many dogfights are actually decided before the plane even takes off. By establishing aviation bureaus across the country, we can preemptively design and test more effective aircraft."
 TRN_Long_Range_Bombing: "Long Range Bombing"
 TRN_Long_Range_Bombing_desc: "As the limits of aviation technology expand, military theorists have envisioned radical uses for this technology: giant long-range bombers operating from the enemy's industrial areas with enough firepower to level factories. This 'strategic destruction' doctrine promises to completely destroy the enemy's war-making capability without a single ground soldier's footprint."
 TRN_Transpolar_Flights: "Trans-Trinity Flights"
 TRN_Transpolar_Flights_desc: "Proximity to the North Pole offers an unexpected advantage to our aviation industry: there are few better places in the world to thoroughly test aircraft. By actively organizing long-range polar crossing flights for testing purposes, we can design planes that fly further, higher, and faster than any others."
 TRN_Expand_The_Aircraft_Industry: "Expand Aircraft Industry"
 TRN_Expand_The_Aircraft_Industry_desc: "We have a very modern aircraft industry, but most of it is still privately owned. To build a modern and powerful air force, we will need to nationalize this aircraft industry, integrate it into state institutions, and expand it significantly."
 TRN_Airspace_Defence: "Airspace Defense"
 TRN_Airspace_Defence_desc: "Nothing is more important than airspace defense, as enemies will try to use aircraft in every possible way to conquer our skies and terrify ground forces. Defending only the land is no longer enough. For us to be victorious, our homeland's skies must be as impregnable as the ground."
 TRN_Specialise_in_Ground_Support: "Specialize in Ground Support"
 TRN_Specialise_in_Ground_Support_desc: "New technologies are opening up fascinating possibilities for developing new bombers. Now aircraft can function as highly mobile artillery, striking enemy positions with precise and destructive attacks, and can be deployed anywhere on the frontline much faster than traditional support. This clearly represents the future of military aviation."
 TRN_Maintain_Tactical_Flexibility: "Maintain Tactical Flexibility"
 TRN_Maintain_Tactical_Flexibility_desc: "Advancements in aviation technology pave the way not only for more agile aircraft but also for more robust ones. Some schools of theory have begun to advocate for new 'tactical' bombers—ground support aircraft with a wider operational radius and survivability than 'close' support planes. These kinds of bombers can perform missions further from the base and in more unfavorable conditions, and can also destroy enemy structures."
 TRN_Jet_Engine_Experiments: "Jet Engine Experiments"
 TRN_Jet_Engine_Experiments_desc: "In aviation history so far, flight of objects heavier than air has only been possible through propellers. However, cutting-edge flight technology suggests that a new method of powered flight may be possible. Theoretically, an engine could compress air, combine it with fuel, and then use this mixture to generate thrust—bypassing the inherent problems of propellers. It seems like an obviously crazy idea, but common-sense ideas rarely create revolutionary breakthroughs."
 TRN_Death_From_Above: "Death From Above"
 TRN_Death_From_Above_desc: "As we know, the third dimension of war is poised to revolutionary change military technology. Between its vast tactical and strategic applications, control of the skies is certain to play a decisive role not only in the next great war but in all wars thereafter. The Trinity army will embrace the future. The sons of the motherland will no longer wither miserably on the ground, but will find glory in the clouds."
 TRN_Create_The_Airborne_Force: "Create Airborne Force"
 TRN_Create_The_Airborne_Force_desc: "Some experimental members of our supreme command suggest that the mechanization of the army is only the first step. The next step is moving infantry by plane, not ship or truck! By dropping so-called paratroopers behind enemy lines, we can isolate enemy units and strike supply points. This new airborne force will be the tip of the spear."
 TRN_We_Need_Helicopter: "Develop Helicopters"
 TRN_We_Need_Helicopter_desc: "An aircraft that uses rotating wings to obtain both lift and thrust, specifically through the main rotor. While common planes have wings that are fixed (fixed-wing) or capable of only slight movement (variable-sweep wing) and are propelled by the power of a separate propeller or engine, a helicopter (often called a heli) flies by rotating the wings themselves with the power of the engine. Because of this, these wings are called rotor blades or rotary wings."
 TRN_Naval_Bomber_Development: "Develop Torpedo Bombers"
 TRN_Naval_Bomber_Development_desc: "Wait, do we even have a sea? Well, we have a pool, and that's close enough! We need planes that can drop spicy metal fish onto those big floating tubs."
 TRN_Carrier_Development: "Develop Aircraft Carriers"
 TRN_Carrier_Development_desc: "A floating runway! It's like a tiny piece of Trinity that can sail right up to the enemy's face and launch an air show they'll never forget."

 TRN_Take_To_The_Seas: "To the Seas"
 TRN_Take_To_The_Seas_desc: "If we are to stand tall once again among the great academies of Kivotos, we must build a new, modern navy capable of challenging the powers of Europe and the world. It is time for Russia to become a naval power once again."
 TRN_Floating_Fortresses: "Floating Fortresses"
 TRN_Floating_Fortresses_desc: "Many officers of the old school believe in the power of discipline and the power of dignified Dreadnought-class battleships based on experience in the Trinity Civil War. They argue that these massive warships should remain the backbone of our navy, just like the fleets of other major powers."
 TRN_Naval_Air_Coordination: "Navy-Air Cooperation"
 TRN_Naval_Air_Coordination_desc: "Some of our naval staff visited the Mother of Trinity Aviation, which led them to believe that the future of naval warfare lies in aircraft carriers. These ships are expensive, but these officers argue that while naval warfare will be dominated by Dreadnought-class battleships if war breaks out, they will soon be overshadowed by the powerful firepower of massive aircraft carriers and naval bombers."
 TRN_War_Under_The_Sea: "Submarine Warfare"
 TRN_War_Under_The_Sea_desc: "Aircraft carriers and battleships may be the future, but focusing on such massive ships may not be realistic for [TRM.GetNameDef]. Building a large-scale navy is expensive, and [TRM.GetNameDef] does not have the shipyards or resources to produce a fleet of that scale. Instead, we should focus on cheaper but equally lethal submarines that can harass the enemy's maritime supply lines."
