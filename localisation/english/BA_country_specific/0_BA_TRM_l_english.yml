 TRN_Kyrie_eleison: "Kýrie, eléison (자비송)"
 TRN_Kyrie_eleison_desc: "주님 우리에게 자비를 베푸소서. "


 TRN_breaking_concept_of_incomprehensibility: "불가해의 관념 혁파"
 TRN_breaking_concept_of_incomprehensibility_desc: "과거 우리가 관측했던 ‘불가해의 관념’이 다시 한 번 이곳에 출현했습니다. 그 경위는 여전히 불명확하지만, 과거 시스터후드의 자료에 따르면 이 존재는 다차원적 해석 능력을 기반으로 한 공격 양상을 보이며, 이는 모교는 물론 전 키보토스를 넘어 전 지구적 위협이 될 수 있습니다."
 TRN_war_with_GEI_tt: "§Y[ROOT.GetNameDef]§!(이)가 $GEI_The_Colour_party$ 측과 전쟁 중일때"
 # 결정
 TRN_Mika_honor_decision_cat: "미소노 미카의 명예"
 TRN_Mika_honor_decision_cat_desc: "§P미소노 미카§!에게 있어 §H'명예'§!란 단순히 타인의 평가나 평판에 그치지 않습니다. 그것은 §H그녀의 신념§!이자 내면의 중심이며, 스스로에게 부여된 하나의 §H사명§!이기도 합니다. 그리고 그 명예에 따라, 미소노 미카의 운명이 결정됩니다.\n\n§P미소노 미카 정권§!이 유지되는 동안, 그녀는 수많은 선택과 정책을 실행하는 과정에서 스스로의 명예를 평가하게 됩니다. 미카는 자신의 명예를 높다고 여기거나, 반대로 낮게 판단할 수도 있으며, 이러한 자기 인식은 정권의 방향성을 결정짓는 중요한 기준이 됩니다. 특정 성향이 뚜렷해질수록, 점차 더 극단적인 선택지들이 그녀 앞에 모습을 드러내게 될 것입니다.\n\n"
