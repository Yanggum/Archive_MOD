 TRM_story_event.1.t: "맨 나중에 멸망 받을 원수는 사망이니라"
 TRM_story_event.1.desc: "\n\n£GFX_texticon_BA_story_archive_trinity_picture_1\n\n\n\n\n트리니티 외곽의 한적한 시골 마을.\n클라우스 뮐러는 키보토스 출신의 한 여성에게 마음을 빼앗겼고, 지속적인 구애 끝에 마침내 결혼식을 올렸다. 결혼 몇 달 후, 부부는 아들 미하일 뮐러를 낳았고, 그렇게 평화로운 삶이 이어질 줄만 알았다.\n\n\"미하일, 도와줄까?\"\n\"아, 아빠. 아니에요. 혼자서 할 수 있어요.\"\n\"그래? 제법인데.\"\n\"고마워요, 아빠.\"\n\n클라우스는 웃으며 말했다.\n\n\"넌 언젠가 이곳을 아주 멋진 곳으로 바꿀 거야. 나랑 엄마는 이제 맡은 일을 다 했단다. 앞으로는 네 차례가 올 거야.\"\n\"...여기가 나라에서 제일 멋진 농장이 될 수도 있겠네요.\"\n\n클라우스는 담배에 불을 붙이며 대꾸했다.\n\n\"그럴지도 모르지.\"\n\n\"클라우스...? 클라우스! 이리 좀 와봐요!\"\n그의 아내, 스즈키 유이는 트리니티 학원의 3학년이었고, 졸업 후에는 간단한 아르바이트를 전전하다 클라우스를 만나게 되었다. 처음에는 당황했지만, 그의 진심 어린 구애에 마음이 움직였고, 결국 사귀기 시작해 속도 위반 끝에 결혼에 골인했다. 그녀는 그저 평범하고 조용한 삶을 꿈꿨고, 클라우스는 아버지에게 배운 농사일을 하며 그녀에게 안정된 삶을 약속하고 싶었다.\n\n그날도 평소처럼 마을 울타리 너머의 풍경을 바라보던 유이는, 갑작스럽게 다가오는 검은 제복의 여성들을 보았다. 직감적으로 '정의실현부'임을 알아챘다. 학창시절, 특히 1학년 시절의 사고뭉치였던 그녀는 그들과 여러 번 엮였기에 그 제복을 단번에 알아볼 수 있었다. 하지만 지금은 달랐다. 2학년이 되면서 학업에 전념했고, 누구나 인정하는 모범생이 되었다. 그런 그녀의 집을 정의실현부가 찾아오는 것은 낯설고 불길한 일이었다.\n\n클라우스는 무언가 잘못되었음을 직감했다. 그는 곧장 아내와 아들을 데리고 헛간으로 향했다. 정의실현부는 곧장 농장을 에워쌌고, 조심스럽게 수색을 시작했다.\n\n\"들어, 미하일. 유이. 이 말에 타. 어서 여길 떠나. 숨어야 해.\"\n클라우스는 말에 아내와 아들을 태우며 속삭이듯 말했다.\n\"아빠도 같이 가요!\"\n미하일은 울먹이며 아버지를 바라보았다.\n\"나도 따라갈게. 말만 타고, 절대 뒤돌아보지 마. 내 걱정은 하지 말고.\"\n\"어서 가...\"\n\n\"무사히 돌아와요, 클라우스...\"\n유이는 떨리는 목소리로 말했다.\n\n\"그럴 순 없을지도 몰라, 유이.\"\n클라우스는 유이의 손을 꼭 쥐며 말을 이었다. 그녀는 말없이 그의 입술에 입을 맞췄다.\n\n\"사랑해.\"\n\"사랑해요.\"\n\n\"이제 가! 이랴!\"\n\n말의 엉덩이를 치자, 말은 울음을 내지르며 곧장 달리기 시작했다.\n\n헛간의 틈 사이로 보이는 바깥. 정의실현부 요원들이 총을 들고 헛간을 포위하고 있었고, 그 중심엔 수사관으로 보이는 인물이 있었다.\n\n클라우스는 헛간 문을 열고 천천히 걸어나갔다. 총구들이 그를 향했지만, 수사관은 발포하지 않았다. 대신, 조용히 입을 열었다.\n\n\"클라우스 뮐러. 자네가 맞나?\"\n\n그는 대답 대신 품 안에 권총을 조심스레 쥐었다. 수사관은 잠시 클라우스를 바라보다 말을 이었다.\n\n\"맞나 보군. 자네, 18년 전에 무슨 짓을 했는지 잊은 건가? 이 외진 시골에서 농사나 지으며 사는 걸 보니 참.\"\n\n클라우스는 침묵했고, 수사관은 냉소적인 웃음을 지으며 말을 이었다.\n\n\"그래. 너, SS 출신이더군. 기록이 아주 화려해. 살해 12건에 폭행까지. 이런 정도면 사형감이지.\"\n\n그러자 클라우스가 조용히 입을 열었다.\n\n\"그건... 너희들 때문이었잖아. 너희들이 우리 고향을 불태웠고, 아버지는 그 일 이후로 반쯤 미쳐 실종됐어... 아직도 찾지 못했어.\"\n\n수사관은 고개를 저으며, 마치 별 관심 없다는 듯한 표정으로 대꾸했다.\n\n\"안타깝군, 정말. 그렇다고 네 살인이 정당화 되는건 아니야. 피해자들의 유족은 생각 해봤어?\"\n그녀의 말투는 마치 오래된 서류를 다시 들춰보는 관료처럼 건조했다. 감정은 없었다. 공감도 없었다. 오직 '처리'만이 존재했다.\n\n클라우스는 더 이상 말이 없었다. 대신 품속의 권총을 꺼냈다. 움직임은 조심스럽고도 결연했다. 총구가 수사관을 향했다.\n\n\"그만 둬!\" 정의실현부 쪽에서 누군가 외쳤지만 이미 늦었다.\n\n탕.\n\n순간, 정적을 찢고 격렬한 총성이 울렸다. 곧이어 무수한 탄환이 클라우스를 향해 쏟아졌다. 정의실현부는 일사불란하게 대응했다. 수사관은 한 발도 맞지 않았다.\n\n클라우스 뮐러의 몸은 총알을 맞고 무너졌다. 그는 한 번 더 아내의 얼굴을 떠올렸고, 아들의 목소리를 생각했다. 그렇게 그는 침묵 속에 누웠다. 총구는 아직도 따뜻했다.\n\n수사관은 아무렇지 않은 듯 피가 번진 헛간 앞 문, 클라우스의 시신 앞에 섰다. 그는 주머니에서 담배를 꺼내 입에 물고, 불을 붙였다. 담배 연기가 그의 무표정한 얼굴 위로 천천히 흘렀다.\n\n곧이어 뒤돌아 걸어가며 부하가 물었다.\n\n\"그의 아내와 아들은 어떻게 할까요?\"\n\n수사관은 뒷자리에 올라타며 창밖을 봤다. 그 어조는 차갑고 무심했다.\n\n\"냅둬. 알아서 하겠지.\"\n\n차량은 천천히 시골길을 벗어나며 흙먼지를 일으켰고, 다시 고요한 평화가 무너진 그곳엔 침묵만이 남았다."

 TRM_story_event.2.t: "내 가족을 기억해주오."
 TRM_story_event.2.desc: "미하일 뮐러의 끝장나게 멋있는 복수극"


