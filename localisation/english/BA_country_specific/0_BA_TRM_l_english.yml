 TRN_KRUPP_steel_desc: "Krupp was a famous company for the German steel and defense industry. Their field artillery technology in particular was very superior, and most of the field guns used by the German army were produced by this company. Therefore, if we support them with subsidies and cooperate fully, they are likely to produce high-quality products in return."
 TRN_Siemens_grant_desc: "Many roads and railways were warped due to the aftermath of the Great Migration. We will mobilize Trinity's capabilities to restore complete infrastructure to solve this problem."
 TRN_Autobahn_desc: "Autobahn Construction"
 TRN_KRUPP_ZIP_III_desc: "ZIP"
 TRN_military_industrial_complex_desc: "To rapidly strengthen our military power, the government must produce military equipment more efficiently and quickly through close cooperation with defense companies. To this end, the government will expand support for defense companies and focus on optimizing production processes and technology development."
 TRN_Recovering_the_aftermath_desc: "Aftermath Recovery"
 TRN_yurijono_seia_ser: "Investigation"
 TRN_yurijono_seia_ser_desc: "The shooting incident of Yurizono Seia was enough to shake the Tea Party and Trinity; it was the first incident in history where a Tea Party executive was attacked. It is too much of a burden to just cover up such a major incident, so we will mobilize all of Trinity's police force to find the culprit."
 TRM_TURIJONO_SEIA_TT: "§LWe will step up the investigation to find the culprit.§!\nIf §YKirifuji Nagisa§! is not the Host of the Tea Party, she becomes the Host."
 TRM_JoJo_mika: "Eliminate Heydrich"
 TRM_JoJo_mika_desc: "Trinity's Justice Task Force was able to access various secrets previously unknown during the process of contacting the NSDAP. They were able to find the truth behind the shooting incident of Yurizono Seia, which had been full of unresolved questions, and the mastermind was Reinhard Heydrich, whom we thought was a collaborator."
 TRN_yurijono_seia: "Grave Matter"
 TRN_yurijono_seia_desc: "A major incident has occurred. Yurizono Seia was shot by someone. Yurizono Seia is currently unconscious and hospitalized."
 TRN_threat_up_of_europa: "Rising Tension in Europe"
 TRN_threat_up_of_europa_desc: "European Tension"
 TRN_trinity_arius_gaebal: "Arius Unification"
 TRN_trinity_arius_gaebal_desc: "Arius Unification"
 TRN_totar_war_focus: "Total Mobilization"
 TRN_totar_war_focus_desc: "Total Mobilization"
 TRM_domination: "Domination"
 TRM_domination_desc: "Domination"
 TRN_justice_task_force_training: "Trinity Militarism"
 TRN_justice_task_force_training_desc: "Trinity Militarism"
 TRN_radio_propaganda: "Brainwashing via Radio"
 TRN_radio_propaganda_desc: "Brainwashing via Radio"
 TRN_kickstart_the_civilian_industry: "Heavy Industry"
 TRN_kickstart_the_civilian_industry_desc: "Reorganizing heavy industry facilities is essential whether it's to recover from internal problems or prepare for external threats."
 TRN_kickstart_the_autoban: "High-speed Road Construction"
 TRN_kickstart_the_autoban_desc: "Well-arranged high-speed roads are useful for the transport and supply of goods and military. This plan, called 'Trinity Autobahn' among those involved, is a giant high-speed road construction plan connecting Thuringia to Gdynia."
 TRN_civilian_industry: "Industrial Investment"
 TRN_civilian_industry_desc: "To increase the quality and quantity of the military and continuously supply the goods they demand, we must first invest in industry to strive to fully equip the goods they require."
 TRN_research_slot: "Expand Laboratories"
 TRN_research_slot_desc: "A long time has passed since escaping the aftermath of the economic hit. We must reorganize and expand laboratories for the development of scientific technology that has lagged behind in the meantime."
 TRN_railway_focus: "Trinity Railway Project"
 TRN_railway_focus_desc: "In Germany, where the aftermath of the Great Migration remains, many destroyed railways are still left. By creating and supporting railway companies, we can quell the dissatisfaction of the Germans and turn their attention elsewhere."
 TRN_sipjagunjeongsinbuhwal: "Knights of the Crusade"
 TRN_sipjagunjeongsinbuhwal_desc: "Knights of the Crusade"
 TRN_gisauihon: "Spirit of the Knight"
 TRN_gisauihon_desc: "Spirit of the Knight"
 TRM_naechi: "Internal Affairs Processing"
 TRM_naechi_desc: "The internal instability of the academy, which significantly worsened after the Great Migration, clearly showed that there is an organization plotting a conspiracy against Misono Mika and Trinity as a whole. We must capture and interrogate several co-conspirators to find the organization and cut out the conspiracy before it spreads like cancer."
 TRM_oetzi: "Reconfigure [TRM.GetAdjective] Foreign Policy"
 TRM_oetzi_desc: "The existing Trinity foreign policy focused on mediating disputes between surrounding academies and stabilizing relations with Kivotos academies. While this compromise system was ideal, its limits were clearly revealed by the Great Migration event. Since Misono Mika came to power, this system has become increasingly meaningless and is no longer functioning as an effective measure. Now is the time to boldly discard the weak foreign policy or modify it in a more powerful and realistic direction."
 TRN_railway_gun_focus: "Mobilize Railway Guns"
 TRN_railway_gun_focus_desc: "With the appearance of bombers, many railway guns remain in storage with only dust flying. Although many experts say the era of railway guns has passed, in a Europe untouched by the impact of the Great Migration, railway guns can be an effective means of destruction."
 TRN_GO_TO_EAST: "Advance to the East"
 TRN_GO_TO_EAST_desc: "We're going to the Soviet Union!!"
 TRN_Uranprojekt: "Uranium Project"
 TRN_Uranprojekt_desc: "Otto Hahn, one of the chemists who first discovered nuclear fission, was the chemist in charge of the Uranprojekt. By hiring him and investing more budget to execute the 2nd Uranprojekt, we will be able to complete nuclear weapons before other countries."
 TRM_OTTO_HAN_EVENT: "§YNuclear Fission§! Observed"
 TRN_Uranprojekt_name: "Uranium Project"
 TRN_Uranprojekt_2: "Reactor Construction"
 TRN_Uranprojekt_2_desc: "Construction of a reactor is essential to measure the critical mass of uranium required for nuclear reaction. We must proceed with the construction of the reactor for smooth experiments."
 TRN_Uranprojekt_3: "Blinding Flash"
 TRN_Uranprojekt_3_desc: "A blinding flash was observed in the laboratory of Dr. Otto Hahn and nuclear physicists. This phenomenon means their experiment ended successfully, and a new weapon to end the war will be born shortly."
 TRN_Uranprojekt_4: "Projectile Research"
 TRN_Uranprojekt_4_desc: "While nuclear experiments are proceeding successfully, the development of devices to launch new weapons is also emerging."
 TRN_Uranprojekt_5: "Trinity Test"
 TRN_Otto_han_tt: "§YOtto Hahn§! becomes an advisor."
 TRN_Ausgleich: "Grand Compromise"
 TRN_Ausgleich_desc: "Grand Compromise"
 TRN_united_state_Eden: "United States of Eden"
 TRN_united_state_Eden_desc: "United States of Eden"
 TRN_Eden_union: "Eden Federation"
 TRN_Eden_union_desc: "Eden Federation"
 TRN_jachiejeopgeun: "Approach Autonomy"
 TRN_seondobuwageorae: "Trade with the Prefect Team"
 TRN_dongari_tonghap: "Club Integration"
 TRN_ireumppuni_anin_yeonbang: "A Union in More Than Name"
 TRN_oebureulhyanghayeo: "Toward the Outside"
 TRM_Trinity_socialism: "Trinity Socialism"
 TRM_Trinity_socialism_desc: "In fact, Trinity students are inherently socialists through community spirit, discipline, productivity, and self-sacrifice for the state, rather than the evil anarchism of socialists. This must be adopted as the ideology of the new regime. In the new Trinity, both companies and workers will work for the common interest."
 TRN_Reichland_Solution: "Trinity Solution"
 TRN_Reichland_Solution_desc: "To completely block the political intervention of clubs, which is one of Trinity's problems, and utilize club resources 100%, we will dissolve all clubs and reorganize them all into organizations under the Tea Party."
 
 TRM_Trinity_Supremacy: "Trinity Supremacism"
 TRM_Trinity_Supremacy_desc: "The uncertainty of the compromise system amplified questions about foreign policy, and eventually exploded like a bomb at the point of the Great Migration. Now we must admit the failure of this old and idealistic compromise system and rebuild Trinity's supremacism once again."
 TRM_war_preparations: "War Preparations"
 TRM_war_preparations_desc: "Declaring supremacy is an act that greatly increases the tension of surrounding nations. Therefore, we must prepare for war through various efforts such as re-checking our army and increasing supply stockpiles. If the sound of war's gunfire resounds, these efforts will be of great help."
 TRM_reorganize_secret_services: "Trinity Academy Intelligence Service"
 TRM_reorganize_secret_services_desc: "Shh! Don't let the other academies know what we're up to. We're watching everyone, even that suspicious-looking student with the weird bag."
 TRM_southern_offensive: "Southern Offensive"
 TRM_southern_offensive_desc: "Below Trinity, several minor academies such as [ABY.GetAdjective] and [HYA.GetAdjective] exist. However, they are like time bombs that could attack Trinity's vulnerabilities at any time. We can neither neglect them nor just wait for peaceful changes in this region."
 TRM_SANHAIJING_offensive: "War with [SHA.GetAdjective]"
 TRM_SANHAIJING_offensive_desc: "Trinity has shouldered the destiny of German unification. Numerous German Austrians are yearning for Trinity's intervention and integration. Even if not everyone wants it, we must carry out the invasion to fulfill the great destiny of German unification!"
 TRM_SMO_for_Abydos: "Invasion of Abydos"
 TRM_SMO_for_Abydos_desc: "To be honest, Abydos is a minor academy. What are they going to do with an academy that only has 5 people? Therefore, we will invade them to occupy the site of Abydos."
 TRM_demand_ostrava: "Demand [74.GetName]"
 TRM_demand_ostrava_desc: "[74.GetName] is home to many German residents and is an important region that we, who shoulder the destiny of German unification, must never ignore. However, they are currently merely holding out day by day with their voices suppressed under Hyakkiyako's oppression. Therefore, we intend to demand the unification of [74.GetName] through legitimate means."
 TRM_form_Shanhaijing_Eden_axis: "Shanhaijing-Trinity Treaty"
 TRM_form_Shanhaijing_Eden_axis_desc: "Shanhaijing is currently one of the few Kivotos nations accepting fascism.\nThis means a strategic alliance can be formed with Trinity."
 TRM_form_Rome_Eden_axis: "Alliance with [ITA.GetAdjective]"
 TRM_form_Rome_Eden_axis_desc: "The [ITA.GetLeader] of [ITA.GetAdjective] is regarded like a primordial god who first created fascism on this planet. Forming an alliance with such a father-like nation will not only further strengthen our regime's legitimacy but also provide deep satisfaction and pride to the citizens."
 TRM_Wehrmacht_absorption: "Absorb the Wehrmacht"
 TRM_Wehrmacht_absorption_desc: "The Wehrmacht has not yet completely disbanded, and some troops are still a headache for us, continuing to resist Trinity or living as homeless. However, rather than unconditionally rejecting them, it may be more effective to reorganize them into the Trinity Ground Force and grant them new opportunities. In this process, we will inspire their loyalty and use them as a propaganda tool."
 TRM_bribe_senior_officers: "$GER_bribe_senior_officers$"
 TRM_bribe_senior_officers_desc: "While a significant number of Wehrmacht soldiers have been incorporated into the Trinity Ground Force, officer personnel to lead them are significantly lacking. One way to solve this is to win over former Wehrmacht officers. Fortunately, most of them have capitalistic tendencies, so if we offer financial terms, there's a high chance we can draw out cooperation."
 TRM_Anti_Gehenna_Pro_Geramny: "Anti-Gehenna, Pro-Germany"
 TRM_Anti_Gehenna_Pro_Geramny_desc: "We must make our war goals clear. Our enemy is the horned-bastards of Gehenna, not the Germans. We must clearly distinguish this to shake the hearts of the Germans within Gehenna and cause wavering among them. Furthermore, we must prepare so that the Germans can welcome us when we attack Gehenna."
 TRM_invasion_of_devils: "Invasion of the Devils"
 TRM_invasion_of_devils_desc: "The thing we feared has happened. Gehenna Academy has eventually begun to advance toward us, pointing their spears and swords. We must quickly establish a war posture."
 TRM_war_with_gehenna: "Special Military Operation"
 TRM_war_with_gehenna_desc: "Gehenna Academy, an academy of evil demons, has long had poor relations with Trinity, provoking us at the academy border to an unbearable degree. We will preemptively strike Gehenna and remodel their government under the pretext of a Special Military Operation."
 TRM_invade_benelux: "Reclaim Control of [35.GetCapitalVictoryPointName]"
 TRM_influence_the_benelux: "New Fascist Friends"
 TRM_fate_of_slovakia: "Fate of Slovakia"
 TRM_balkan_seeking_collaborators: "Seeking Balkan Collaborators"
 TRM_invade_balkan: "Balkan Intervention"
 TRM_operation_of_Terra_Recta: "Operation Terra Recta"
 # Terra Recta means "Right Land," implying Trinity's purification or reorganization of Italy.
 TRM_Invasion_of_Millennium: "Case Blue"
 TRM_war_with_Swiss: "Operation Tannenbaum"
 TRM_Invasion_of_Poland: "Case White"
 TRM_maintain_a_compromise_system: "New Compromise System"
 TRM_maintain_a_compromise_system_desc: "Of course, the compromise system was not a complete failure. Since there were parts that were somewhat effective, rather than completely discarding that foundation, there is a possibility that it could be reborn as a more robust and realistic foreign policy by fixing the lagging parts and reinforcing the loose elements. What's important is to acknowledge failure and clearly establish the direction to move forward."
 TRM_Trinity_Redwinter_Pact: "Non-Aggression Pact with [RED.GetAdjective]"
 TRM_Trinity_Redwinter_Pact_desc: "While signing a friendship and non-aggression pact with [RED.GetAdjective] may conflict somewhat with Trinity's current policy, it is worth considering in that the benefits gained through this are greater. Also, if war with Gehenna begins, we will be further escaped from the threat of war with [RED.GetAdjective], allowing us to minimize interference in future policies."
 TRM_alliance_with_the_redwinter: "Evil Alliance"
 TRM_alliance_with_the_redwinter_desc: "Perhaps we can emphasize hatred toward the world and Kivotos nations with decadent and old-fashioned ideas as a common point, setting aside ideological differences with [RED.GetAdjective]. If we have [RED.GetAdjective] as an ally, we will be able to access all necessary resources. Of course, including their military power too."


