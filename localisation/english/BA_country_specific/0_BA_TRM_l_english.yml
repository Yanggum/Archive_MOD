 TRM_develop_the_heer_modifier: "트리니티 지상군"
 TRM_develop_the_heer_modifier_desc: "수백 년 전, 트리니티의 지상 병력은 서로 간의 '내전'을 통해 군사적 역량을 가속적으로 발전시켜 왔고, 이러한 실전 경험은 교리의 이론적-전술적 성장으로 이어졌습니다. 이후 트리니티가 하나의 신념과 가치 아래 통합되면서, 비록 그 격동의 시기를 잊었을지언정, 그로부터 얻은 교훈만은 끝내 잊지 않았습니다."
 TRM_heer_modifier_change: "§Y$TRM_develop_the_heer_modifier$§! 변동치"
 TRM_VVS: "트리니티 공군"
 TRM_VVS_desc: "트리니티 공군의 시초, 항공의 어머니가 하늘에 새로운 지평을 열었을 때, 우리는 단순한 비행을 넘어선 군사적 패러다임의 전환을 맞이했습니다. 오늘날까지도 트리니티 공군은 하늘에서의 승리가 지상에서의 승리를 이끈다는 신념 아래 날아오르고 있습니다."
 TRM_navy: "트리니티 해군"
 TRM_navy_desc: "트리니티에게 '해군'이라는 개념은 다소 낯설 수 있지만, 결코 타 학원에 뒤처지지 않습니다. 우리는 많은 이들에게 바다의 중요성을 일깨웠고, 오늘도 승리에 대한 굳은 믿음 아래 당당히 출항합니다."
 
 
 
 TRM_event.1.t: "티파티 비상회의"
 TRM_event.1.desc: "\"응응? 나기 쨩 이런 늦은 시간에 불러내는건 처음인데..? 무슨 일이야?\"\n\"미카.. 지금은 위험한 상황입니다.\"\n\"세이아의 말이 맞아요 미카 씨.\"\n\"나기 쨩..\"\n\n보다 못한 나기사가 세이아의 편을 들어주며 미카의 잡담을 끊어내었다. 미카가 어느 정도 조용해지자, 나기사는 상황 설명을 시작하였다.\n\n\"우리 학원은, 아니 우리 키보토스는 누군가의 장난 일수도, 혹은 초자연적인 현상으로. 아무도 알지 못하는 곳에 떨어지게 되었습니다. 그러자 떨어진 곳에는 우리의 외모랑 닮았지만, 헤일로가 없는 사람들이 알 수 없는 언어와 무기로 학원을 위협하였으나, 결국은 우리가 지켜내었죠. 그리고 이계의 사람들과 싸우면서 얻은 정보는 우리도 죽음의 위협에 놓여 있다는겁니다.\n\n\"그렇게 되어서 우리는 비상회의를 개최하게 되었습니다.\"\n\"이에 대해서 할 말이 있으신가요? 미카 씨? 세이아 씨?\"\n\n\"으응...\"\n\"딱히 할 말은 없군.\"\n약간의 정적이 흐르고 흘렀지만, 결국 아무 말도 없었다. 이러한 상황을 벗어나고자 미카가 두 입술을 열어 말을 하려고 했지만, 좀처럼 말이 잘 나오지 않았다.\n\n결국 제 1회 티파티 비상회의는 종료되었다."
 TRM_event.1.a: "..."

 TRM_event.2.t: "비상"
 TRM_event.2.desc: "총학생회의 소식은 전 키보토스로 빠르게 나아갔다. 모든 문제를 완벽하게 해결하던 그녀가 총학생회의 자리를 내려두고 실종되었다는 소식은 충격을 주기에 충분하였고 이 충격은 트리니티에도 닥쳐왔다."
 TRM_event.2.a: "그리고 한 여인은 웃음을 지었다."

 TRM_event.3.t: "2차 회의"
 TRM_event.3.desc: "\"이것으로 2차 회의를 종료...\" \n\"회의 끝났어? 그럼, 간다!\"\n\"미카..!\"\n\n이 의심은 언제 부터 였을까? 미소노 미카는 회의가 끝나면 회의 이후 다과회 조차 참여하지 않고 어디론가 빠르게 사라진다. 다과회가 싫어서... 라기엔 미소노 미카는 평소에 수다 많고 밝은 아이였기에 다과회를 빠진다는건 상상도 못할 일이였다.\n\n도대체 무엇이 그녀에게 접촉 한 것일까. 의심만을 가진채 키리후지 나기사는 다음 회의를 준비 했다."
 TRM_event.3.a: "..."
 NAGISA_NOT_TRUST_MIKA: "\n§L키리후지 나기사는 같은 티파티 임원인 미소노 미카를 의심했다.§!"
 NAGISA_TRUST_MIKA: "§L소꿉친구인 미소노 미카가 그럴 일이 없다며, 그녀를 믿었다.§!"

 TRM_event.4.t: "증거"
 TRM_event.4.desc: "\"나기사님...! 결정적인 증거를 찾았습니다. 아직 늦지 않았....\"\n\n티파티의 임원 중 한 명이 다급하게 방 안으로 들어오며 소리쳤다.\n하지만 그녀의 외침은 이내 무언가가 깨지는 날카로운 소리에 묻혔다.\n갑작스럽게 찾아온 무거운 적막 속에서 트리니티를 움직이는 세 지도자 중 한 명이자 필리우스 분파의 수장인 키리후지 나기사가 입을 열었다.\n\n\"...이미 빈약한 증거 따위로 멈출 수 있는 상황이 아닙니다.\"\n\n언제나 자상한 미소 뒤에서 냉철하게 움직이던 그녀의 품위 있고 고상하며 기민한 모습은 찾아볼 수 없었다.\n찻잔을 들고 있던 손은 떨리고 있었고, 목소리는 고단함이 묻어 나온다.\n평소라면 자신을 찾아온 임원에게 보였을 모습 대신 그녀는 차갑고 절망에 빠진 무표정한 얼굴로 임원을 바라보았다.\n\n\"나기사님... 트리니티의 앞날이 걸린 문제입니다. 아직 저희에게도 기회가...\"\n\"...아뇨.. 저희에게 남은 기회라곤 없습니다... 삼두정은 이미 끝났어요.\"\n\n말을 마치고 나기사는 떨리는 손을 숨기며 창밖을 바라보았다.\n흐린 하늘 아래에서 트리니티는 활기를 잃은 채 잿빛 적막에 휩싸여있었다.\n나기사를 찾아왔던 임원은 더이상 아무 말도 하지 못하고 조용히 등을 돌려 그 안을 빠져나갔다.\n\n\"....미카.. 당신은 도대체 뭘 원하는 건가요..\""
 TRM_event.4.a: "주사위는 굴려졌다."

 TRM_event.5.t: "연합법"
 TRM_event.5.desc: "게헨나 영토는 현재 반 트리니티 저항 세력의 활동과 트리니티 학생들에 의한 테러 위협으로 인해 접근이 어려운 상태입니다. 특히, 게헨나 서부 지역인 라인란트는 트리니티와 독일 모두의 핵심 공업지대입니다. 이 공장들과 자원을 활용하지 못한다면, 우리가 흘린 피와 희생이 헛되이 될 것입니다. 따라서, 우리는 반드시 이 공장들을 되살리고, 잠재적인 천연자원까지도 철저히 조사해야 합니다.\n\n한편, 내부 관료들 사이에서는 우려의 목소리가 커지고 있습니다. 이러한 결단이 트리니티의 근본적 가치를 흔들 수 있다는 경고도 이어지고 있습니다. 하지만 명분만으로 나라를 운영하던 시대는 이미 오래전에 끝났습니다. 미소노 미카는 언제나 실리를 최우선으로 삼으며, 모든 결정을 트리니티의 이익을 위해 내렸습니다. 물론 일부 트리니티 학생들은 이에 반발할 수 있겠지만, 우리에게는 멈출 시간이 없습니다. 게헨나의 자원과 산업을 되찾는 것은 트리니티의 미래를 위한 필수적인 선택입니다."
 TRM_event.5.a: "이건 전부 트리니티를 위해서니깐..."
 
 TRM_event.6.t: "어둠 속에서"
 TRM_event.6.desc: "트리니티 중앙에서 멀리 떨어진 외곽. 밤은 깊어가고, 별장의 희미한 불빛은 마치 어둠 속에서 홀로 떠 있는 섬 같았다. 국가사회주의자와 파테르 분파의 지도자들은 서로 말을 아끼며 침묵 속에 서 있었다. 짙은 어둠 속에서, 그들은 이 만남이 무엇을 의미하는지 본능적으로 느끼고 있었다.\n\n문이 열리자, 미소노 미카가 모습을 드러냈다. 그녀는 아무 말 없이 그들 앞에 섰다. 밝은 미소를 띠고 있었지만, 그 미소는 차갑게 얼어붙은 표정과 같았다. 그녀의 발걸음은 고요했으나, 마치 그 방 안의 공기마저 조용히 짓누르는 듯했다. 누구도 선뜻 입을 떼지 않았다. 그들이 왜 여기에 모였는지, 이제는 모든 이가 알고 있었다.\n\n미카는 그들 앞에 앉아 눈빛을 주고받았다. 그녀는 말이 필요 없었다. 이미 이 자리에 있는 모두가 알고 있었다. 지금 이 순간, 선택이 주어진 것처럼 보였으나, 실은 그렇지 않다는 것을.\n\n한동안 침묵이 이어졌다. 방 안의 공기는 무겁고 답답했다. 시간은 느리게 흘렀고, 누구도 먼저 말하지 않았다. 그들은 서로의 얼굴을 살피며 미카의 의도를 읽으려 했지만, 그 미소 뒤에 숨겨진 무엇인가를 끝내 파악할 수 없었다.\n\n회의의 중심에 서 있던 주요 인사는 가슴 속에서 느껴지는 묘한 불안을 억누르며 눈을 감았다. 자신에게 주어진 선택지를 되새기기 시작했다.\n\n'우리에게는 다른 선택지는 없나?'\n\n다시 눈을 떴을 때, 방 안에 흐르는 냉랭한 분위기는 더 깊이 파고들고 있었다. 그의 생각은 혼란스러웠다. 사라진 지도자, 무너진 질서, 그리고 이제 눈앞에 놓인 낯선 협력자. 그는 마음속으로 수없이 되뇌었다. 정말 이 길밖에 없을까? 그 의문이 계속해서 그를 갉아먹었다.\n\n하지만, 현실은 냉혹했다. 적의 목소리는 점점 커져가고 있었고, 그들이 트리니티에게서 살아남을 수 있는 방법은 이 선택지밖에 없다는 생각이 머릿속을 떠나지 않았다. 그는 깨달았다. 미카는 바로 그 순간을 기다리고 있었다. 그들이 이 순간의 절망과 혼란 속에서 길을 잃기를, 그리고 결국 그녀의 손을 잡기를.\n\n'우리가 트리니티에게서 살아남으려면... 이 선택지밖에 없다.'\n\n그의 마음속 결심은 그 순간 굳어졌다. 더 이상 다른 길은 없었다. 그는 천천히 고개를 끄덕였다. 마침내, 침묵이 깨졌다.\n\n\"협력을 받아들이겠습니다.\" 그의 목소리는 확고했으나, 그 안에 숨겨진 두려움은 지울 수 없었다."
 TRM_event.6.a: "걔네들은 어쩔수 없잖아-?"
 
 TRM_event.7.t: "첫 결재"
 TRM_event.7.desc: "2주간의 준비가 끝난 뒤 미카의 취향대로 바뀐 집무실에 처음으로 모든 요인들과 사람들이 모였다.\n그간의 한산함이 거짓말로 느껴질 정도로 북적거리는 집무실에서 미카는 조금은 불만스러운 얼굴로 그 가운데에 앉아있다.\n타인을 좋아하는 편에 속하지만 그렇다 해도 제대로 친분도 없는 타인이 이렇게까지 몰려있으면 거북할 수밖에 없다.\n\n미카에게만큼은 숨 막히듯 느껴지는 그런 어색한 시간이 흘러가던 와중에, 이 자리에 모인 이들이 기다리던 순간이 문을 열고 도착했다.\n황동으로 된 쟁반 위에 고급스러운 깃펜과 함께 준비된, 트리니티의 유일한 지배자로 등극한 그녀의 첫 번째 결재 서류였다.\n임시로 결정된 각 부 요인들이 둘러싸고 서있는 상황에서 미카는 자리에 앉아 연기를 시작했다.\n전임자처럼 온화해 보이면서도 좀 더 활달한 느낌의 미소를 띤 채 그녀는 공식적으로 첫 서명을 작성했다.\n카메라들의 렌즈가 바쁘게 움직이고 주변에서는 그녀를 향해 박수를 보냈다.\n\n미카는 지금의 상황이 썩 나쁘지 않게 느껴졌다.\n그녀가 서명한 서류의 내용이 누군가를 지옥으로 보내는 내용이었음에도 누구도 그런 건 신경 쓰지 않았다."
 TRM_event.7.a: "나쁘지 않은 시작"
 
 TRM_event.8.t: "펜 하나로..."
 TRM_event.8.desc: "미소노 미카는 파테르 분파 내에 있는 거물급 인사들을 에덴과 멀리 떨어진 곳으로 보내고 있었다. 이곳에서 출발하여 최대한 먼 곳으로, 그곳이 외국이라고 할 지라도 그들이 그곳에서 어떤 대우를 받는지는 상관하지 않았다. 어차피 트리니티의 이익을 위해서라면 이미 뭐든 하리라 다짐하였기 때문에 그들의 안위 따위는 관심조차 생기지 않았다."
 TRM_event.8.a: "유감을 표하지."
 
 TRM_event.9.t: "보고서"
 TRM_event.9.desc: "미소노 미카는 안경을 낀 채 이름이 줄지어 늘여선 서류 한 장을 내려다보았다. 유대인과 협력한다고 의심되는 자들의 목록이었다. 미카는 고개를 들었다. 방은 책들과 삭아가는 옛날 신문들로 가득 차 있었다. 그늘진 구석에는 낡은 축음기가 먼지 쌓인채 녹슬어 가고 있었다. 그 광경은 미카의 얼굴에 능글맞은 미소가 떠오르게 했다.\n초인종이 울려 마트콥스키를 몽상에서 끌어냈다. 국가사회주의당 제복을 입은 거친 남자 두 명이 들어왔다. 한 명이 몸을 기울였다. 모자 밑으로 살짝 보이는 금발 머리가 휘날렸다. 심지어 야만적으로 보이기까지 했다. 둘은 경례하며 나무 바닥에 발을 크게 굴렀다. 다른 한 명은 다부진 몸을 갖고 있었는데, 배가 튀어나왔다는 건 누구라도 알 수 있었다.\n잠시 동안 어색한 침묵이 흘렀다. 마침내 미카가 둘을 보며 말했다. \"무슨 일로..?\" 둘은 강인한 목소리로 오늘 숙청된 이들의 이름을 알려줬다. 미카는 억지로 미소를 지으며, 익숙하지 않게 어색한 존댓말을 사용했다.\n\" 고맙네. 가도 좋아.\"\n\n그러나 그들은 나가지 않았다.\n\n미카는 그들에게 물었다.\n\n\" 왜 나가지 않는 건가요?\"\n\n그들은 특유의 정복 특히 가슴팍의 독수리를 만지작거리며 말했다.\n\n\"키리후지 나기사가 유대 놈들과 협력하고 있다는 사실이 밝혀졌습니다.\"\n\n미카는 아무 말도 하지 못했다. 곧이어 미카가 다시금 말하였다.\n\n\"그건... 그래도...\"\n\n미카가 떨리는 목소리로 말하자, 그들의 얼굴이 썩어들어갔다. 그들 중 다부진 몸을 가진 남자가 미카의 앞으로 뚜벅거리며 다가왔다. 미카는 자신도 모르게 몸을 흠칫, 하고는 떨었다.\n\n다부진 몸을 가진 남자는 조용한 목소리로, 그러나 단호한 목소리로 미카에게 말하였다.\n\n\" 전부 우리가 알아서 하겠습니다. 그러니 학생회장께서는 '처리하라'한 마디만 하십시오. 알겠습니까?\"\n\n...문 걸쇠가 닫히는 소리가 나자, 그녀는 긴장이 풀린 듯 주저앉았다."
 TRM_event.9.a: "평화롭네."
 
 TRM_event.10.t: "라디오의 침묵"
 TRM_event.10.desc: "22시. 라디오에서 침묵이 흘러나온다. 원래 같으면 정규 방송들이 끝났음을 알리는 방송이 송출되어야 하지만, 오늘은 뭔가 다르게 침묵만이 흘러나와 방을 감싼다. 마치 뭔가 있다고 말하는 것처럼."
 TRM_event.10.a: "한 아이는 악몽을 꿨다."
 
 TRM_event.11.t: "위대하여라 성공이여" # 선전물 배포 USE
 TRM_event.11.desc: "유대-볼셰비키, 게헨나의 그림자가 드리우고 어둠이 짙게 깔리던 지난해,\n나는 감히 트리니티의 불타는 실을 꿈꿨다네.\n두려움이 지배하고 희망이 사라진 것 같았던 세상에서,\n잔인한 자들이 치른 대가를 되찾고 싶었다네.\n\n먹물을 무기로 힘의 말을 엮어냈네,\n시인의 반란이자 속삭이는 싸움이었지.\n한 줄 한 줄이 정의에 대한 외침이었고, 치열하고 진실하였던 말이었지,\n위대한 역사를 지닌, 트리니티를 정복하려는 자들의 심장을 찔렀다네\n\n나는 뻔뻔하고 대담한 저항의 구절을 썼지,\n저항의 교향곡을 썼지만 내 이야기는 알려지지 않았다네\n먹물로 얼룩진 페이지에 제 탄원을 새겼다네,\n모두가 자유로울 수 있는 미래를 위해.\n\n내 글은 반딧불처럼 춤을 추며 길을 밝히고 있네,\n용기가 흔들리는 위험한 밤을 헤쳐 나가야 하네.\n나는 화합과 사랑의 부드러운 은총을 속삭였으며,\n그리고 민족의 힘과 굳건한 포옹을 속삭였다네.\n\n그리고 나는 위대하신 미카 여왕님을 마주하였다네\n타오르는 불꽃, 너무나 밝은 등대, 가장 어두운 밤에도 우리를 인도하시는 분.\n\n나는 트리니티와 하나가 되어 우리를 억압하는 억압자에게 도전할 것이라네.\n\n위험은 넘쳐나고 우리는 직면해야 할 위험이 있지만, 우리 트리니티는 하나로 뭉쳐 강인한 포용력을 발휘할 것이라네. 파테르의 정신은 억누를 수 없으니까, 억압받는 자들의 마음속에 영원히 남아있을 것이라네.\n\n그러니 위대하신 지도자시여\n이 말이 단호한 북소리처럼 울려 퍼지게 하소서,\n지친 자들과 침묵하는 자들의 가슴에 울려 퍼지게 하소서.\n그들이 모든 행에서 위로와 힘을 얻게 하소서,\n우리의 목소리가 서로 얽히고 얽혀 하나가 되게 하소서.\n우리의 성공은 트리니티 원생들과 독일인들의 안에 있는 힘에 대한 증거이니.\n우리는 폭정의 통치에 맞서 단결하여 일어서리라\n우리의 꿈은 헛되지 않으리라"
 TRM_event.11.a: "-레니 리펜슈탈, '영광스러운 나날'-" 
 
 TRM_event.12.t: "지휘자의 애찬" # 선전물 배포 USE
 TRM_event.12.desc: "미소노 미카 학생회장님의 등장 전, 우리는 공허한 웅변가들의 말에 현혹되어 있었다. 하지만 미소노 미카 학생회장님은 달랐다. 그녀의 카리스마 넘치는 연설은 트리니티의 영광스러운 과거를 상기시키며 우리의 자긍심을 불태웠다.\n우리는 미소노 미카 학생회장님의 비전을 위해 어떤 희생도 감수할 준비가 되어 있다. 그녀의 지도 아래 트리니티는 위대해질 것이며, 이를 위해 다른 학원들은 희생되어야 한다.\n샬레, 붉은겨울, 산해경, 게헨나 - 이들은 모두 트리니티의 영광을 가로막는 장애물일 뿐이다. 특히 우리를 억압해온 자들은 반드시 처단되어야 한다.\n미소노 미카 학생회장님을 따르는 우리는 역사에 남을 것이다. 그녀의 지도 아래 우리는 더 강해지고, 더 위대해질 것이다.\n우리의 충성심은 오직 미소노 미카 학생회장님과 트리니티에 있다. 다른 모든 것은 부차적이다.\n위대하신 미카 학생회장님 만세!"
 TRM_event.12.a: "'지휘자의 애찬'중-"
 
 TRM_event.13.t: "트리니티 지도론" # 선전물 배포 USE
 TRM_event.13.desc: "미소노 미카 학생회장은 화려한 방에서 권위 있는 모습으로 등장했다. 그녀의 눈빛에는 결단력과 의무감이 깃들어 있었고, 주변에는 충실한 참모들이 둘러싸고 있었다.\n미소노 미카 학생회장의 연설은 트리니티의 오랜 역사와 전통을 강조하며 시작되었다. 그녀는 자신을 '국가의 수호자'로 칭하며, 트리니티를 이끌어갈 책임을 맡겠다고 선언했다.\n글쓴이, 즉 나는 미카의 리더십에 깊은 감명을 받았고, 그녀의 비전을 전적으로 지지한다는 태도를 보인다. '목적이 수단을 정당화한다'는 믿음 아래, 트리니티의 번영을 위해서라면 어떤 수단도 정당화될 수 있다고 주장한다.\n트리니티의 '명백한 운명'을 위해 희생이 필요하다는 의견을 피력하며, 공동의 헌신과 노력을 통해 국가의 번영을 이룰 수 있다고 믿는다.\n글쓴이이자 나는 미카를 트리니티의 미래를 이끌어갈 유일한 지도자로 여기며, 그녀에 대한 강한 충성심과 숭배의 태도를 보인다."
 TRM_event.13.a: "-오토 슈트라서, 트리니티 지도론 2장 중-"
 
 TRM_event.14.t: "문제아 해결"
 TRM_event.14.desc: "성적 부진으로 낙제, 학교 수영복 차림으로 교내를 배회, 무장 난동 끝에 체포, 세 번 연속으로 낙제. 등등 여러 가지 문제점을 떠 앉은 보충수업부는 정말 문제아가 많은 곳입니다.\n하지만, 그 내막은 트리니티의 배신자를 찾는다는 이유로 의심이 가는 이들을 한 바구니에 담아둔 곳입니다. 그들을 빨리 처리해야 합니다."
 TRM_event.14.a: "퇴학 시켜라."
 TRM_event.14.b: "일상으로 복귀 시켜."
 
 TRM_event.15.t: "에덴 결전에서의 승리 - 수백 년 갈등의 종식" 
 TRM_event.15.desc: "혹독한 전쟁 끝에, 우리 군대는 게헨나의 모든 적을 굴복시키고 마침내 승리를 거두며 돌아왔습니다. 비록 게헨나의 학생들이 어리석게도 저항 운동을 계속하고 있지만, 우리의 지배에 실질적인 위협이 되지는 않을 것입니다.\n\n트리니티와 게헨나 간의 갈등은 수백 년 전부터 이어져 왔습니다. 최근 들어 갈등이 다소 잠잠해진 듯 보였지만, 그 이면에는 서로를 향한 깊은 증오가 남아 있었습니다. 이 증오는 결국 전쟁으로 폭발했지만, 다행히도 우리는 승리했고, 이제 이 증오를 근절하고자 노력할 것입니다.\n\n지금이야말로 우리의 패권이 시작될 때입니다! 진정한 팍스 트리니카의 서막이 울리며 전 대륙을 향해 울려 퍼질 것입니다. 트리니티 군대는 모든 지역을 점령하고, 우리의 자비로운 통치 아래 평화와 번영이 찾아올 것입니다. 유럽 전역의 국가들은 시간이 흐를수록 우리의 영향력을 존중하게 될 것입니다. 그들이 이를 원하든 원치 않든 간에 말이죠.\n\n물론, 우리의 투쟁은 여기서 끝나지 않을 것입니다. 우리는 대륙을 넘어 전 세계로 나가야 하며, 모든 곳에서 우리의 패권을 확립할 것입니다. 우리의 문화적 영향력과 군사적 힘을 통해 남은 강대국들에 도전하며 진정한 패권 국가로 자리매김할 것입니다."
 TRM_event.15.a: "그대에게 승리의 제관을!"

 TRM_event.16.t: "가장 어두운 시간"
 TRM_event.16.desc: "여왕이 단상에 올랐지만 누구도 그녀에게 열렬한 환호를 보내지 못했다.\n필리우스와 상투스, 심지어 파테르 분파마저 그녀를 보고 공포를 느꼈다.\n그것은 이번 연설에 초대된 이 곳의 원주민들 역시 마찬가지였다.\n지난 몇 주간의 피로 쓴 시간들을 들은 사람들은 극소수를 제외하면 그저 조심스럽게 박수를 보낼 뿐이었다.\n\n그렇게 단상에 올라 모인 청중들을 만족스럽게 한번 돌아본 미소노 미카는 그들에게 첫 인사를 선보였다.\n\n\"다들 안녕☆\"\n\n예상외의 발랄한 인사에 모든 시선이 단상으로 집중됐다.\n티파티와 트리니티의 수많은 학생들을 갑작스레 사라지게 만든 장본인이 보여줄 만한 모습은 아니었으니 당연한 일이었다.\n혼란과 공포감 속에서 사람들은 계속 그녀를 지켜봤다.\n\n\"에헤이- 다들 내가 무섭기라도 한 거야? 안 잡아먹으니까 걱정 안 해도 되는걸~?\"\n\n그럼에도 그녀는 전혀 신경 쓰지 않고, 연설문은 버려둔 채 시답잖게 손을 내저으며 말을 이어나갔다.\n\n\"오늘 모이게 한 건... 일종의 선포를 위해서려나? 내가 몇 주 동안 어째서 무엇을 했는지 정도는 알려줘야 할 것 같아서-, 갑자기 알던 얼굴들이 주변에서 사라져서 놀랐지? 그건 걔들이 전부 기생충이라 그런거야-\"\n\"기생... 충..?\"\n\"그래 기생충. 여기 살던 애들한테는 유대인 같은 존재려나?\"\n\n그 얘기를 들은 독일인들이 조금 술렁거리기 시작했다.\n그들은 잠깐이나마 그녀의 모습에서 독일이 잃어버린 한 인물의 모습을 보았다.\n\n\"그도 그럴게- 트리니티를 배신하고 저 게헨나의 쓰레기들한테 기회를 준 거잖아?? 자기들의 안위만을 위해서. 나기사쨩은 정말 좋아하는 친구지만 그런 기생충들의 머리 같은 존재였으니까-\"\n\n미카는 연설대를 내리쳤다.\n\n\"그래서 잘라냈어, 멍청하고 쓸모없는 것들을 전부~, 이제 티파티는 오직 트리니티를 위해서 일하게 만들 거야.\"\n\n쾅 하고 내려치는 소리에 다시 한번 회장의 이목이 집중되었다.\n저마다 식은땀을 흘리거나 마른침을 삼키는 사람들을 향해 미카는 활짝 웃어보았다.\n\n\"그러니까- 다들 잘 부탁해?☆\""
 TRM_event.16.a: "국가에 반대하는 어떤 것도 존재하지 않는다.\n- 베니토 무솔리니"
 
 TRM_event.17.t: "심판" 
 TRM_event.17.desc: "악의가 눈에 보였다.\n단 한 사람을 위해, 단 한 사람을 무대에서 퇴장시키기 위한 청문회.\n방청석의 학생들과 의원들은 회장의 중앙에 있던 키리후지 나기사에게 아낌없이 그 악의를 쏟아냈다.\n\n\"작금의 트리니티가 이러한 상황에 처한 이유는 키리후지 나기사의 나약함 때문이다!\"\n\"굴욕적인 평화를 우리는 단호히 거절한다!\"\n\n나기사에게 비난을 쏟아내는 주체는 파테르 분파였다.\n필리우스와 상투스 분파 역시 전례에 따라 자리를 지키고 있었으나, 그들에겐 더이상 여력이 남아있지 않았다.\n트리니티의 또 다른 두 개의 축은 머리를 잃고 미소노 미카에 의해 난도질당한 채였다.\n\n하지만 나기사는 의연했다.\n그녀는 이곳에 들어서기 전부터 이미 모든 결과가 결정되어 있음을 누구보다도 잘 알고 있었다.\n그렇기에 그녀는 평소와 다름없는 태도로 이 지루한 연극을 끝내기 위해 입을 열었다.\n\n\"죄송하지만 청문회는 이쯤에서 끝내는 게 좋을 것 같네요\"\n\"지금 발언을 진행 중인 게 보이지 않으십니까 증인?\"\n\"하지만 이미 결말은 정해져있지 않나요?\"\n\n그녀는 자신의 자리에서 일어나 뒤돌아서서 긴 복도의 끝을 바라보았다.\n문 위의 스테인글라스를 통과한 밝은 빛이 드리우져있었다.\n이제는 배우가 퇴장할 때였다.\n\n\"저는 먼저 자리를 떠야 할 것 같네요, 새로 지내야 할 방을 살펴봐야 해서요, 다들 평안하시길.\"\n\n그녀는 한결 가벼워 보이는 미소를 지은 채 천천히 문으로 향했다.\n나기사의 퇴장을 배웅한 것은 사람이 아닌 따스한 햇살과 약간의 산들바람이었다."
 TRM_event.17.a: "천사가 추락했다."
 
 TRM_event.18.t: "추락" 
 TRM_event.18.desc: "무언가가 잘못된 것이 분명했다.\n적어도 이 모든 상황의 당사자만큼은 그렇게 생각했다\n한나절 전만 해도 트리니티의 새로운 태양 아래에서 높이 솟아오를 자신을 상상하고 있었다.\n하지만 지금 그녀는 티파티의 사병에게 양 팔을 붙잡힌 채 어딘가로 향하고 있었다.\n\n달빛 하나 비추지 않은 어둠 속에서 그녀는 바쁘게 머리를 굴렸다.\n혹시 키리후지 나기사가 단 하루만에 권력을 되찾은건가? 아니면 필리우스나 상투스 분파의 쿠데타인가?\n그럴리 없다.\n분명 그녀들과 두 분파는 미카님과 우리 파테르에 의해 산산조각 나지 않았던가?\n\n그리고 이 모든 상황의 실체는 잠시 뒤에 모습을 드러냈다.\n연행되어 끌려간 어떤 건물의 지하에 앉아있던 것은 그녀가 섬기던 미소노 미카 본인이었으니까.\n당혹감에 휩싸인 그녀는 무릎이 꿇려진 채 미카를 향해 입을 열었다.\n\n\"미... 미카님...? 무언가 착오가 있던 게 분명합니다! 어째서 파테르의 일원인 제가 이곳에...\"\n\"흐응? 누구더라~? 얼굴이 다 비슷비슷하게 생겨서 모르겠는데-\"\n\n그 말을 끝으로 주저앉은 그녀의 얼굴에서 희망은 사라졌다.\n순식간에 가장 밑바닥으로 떨어져 버린 거짓말 같은 상황에 정신이 붕괴해버린 그녀에게 미소노 미카는 선고를 내렸다.\n\n\"음- 별 볼일 없는 곰팡이 같은 아이네~ 변경의 광산에라도 보내버려-\"\n\n미카의 한마디에 한때 파테르 분파의 중역이었던 그녀는 차갑고 어두운 지하 속으로 사라졌다.\n새로운 학생회장은 손에 쥐고 있던 서류철의 다음 장을 넘겼다.\n아직도 그곳엔 수많은 이름들이 차례를 기다리고 있었다."
 TRM_event.18.a: "가장 믿음이 가는 사람이 가장 먼저 의심받아야 할 사람이다. - 이오시프 스탈린"
 
 TRM_event.19.t: "비어있는 관저" 
 TRM_event.19.desc: "남자는 관저로 향하기 시작했다.최근 심각해지고 있는 돌격대의 만행을 알리기 위해. 그리고 닿지 않는 연락을 확인 하기 위해.\n남자는 최근 도가 지나친 돌격대의 끔찍한 만행들을 생각했다. 그들은 국가사회주의당이 이제껏 관심 하나 받지 못하는 이들에게 멋진 정복과 권력을 주니 마치 개처럼 뭔 개짓거리를 하든지 전부 따르고 있었으니까.\n길거리에서는 유대인과 관계가 있어 보이는 학생들의 머리에 마구잡이 총탄이 박혀 혈흔이 낭자하였고, 이를 막아야 하는 정의실현부는 손을 놓고 아무런 행동을 못 하는 상황.\n\n이 개짓거리를 어떻게든 끝내야 한다는 건 모두가 알고 있을 터. 그러기 위해서는 어떻게든 대처해야 한다.\n\n남자는 관저에 드디어 도착하여 문을 열었다.\n\n관저에는 땅바닥에 휘날리는 종이와 쓰러지고 부서진, 저항의 흔적이 보이는 방들밖에 없었다."
 TRM_event.19.a: "그들이 어디로 갔나?"
 
 TRM_event.20.t: "반대파 사냥"
 TRM_event.20.desc: "트리니티에서 필리우스 분파의 수장인 키리후지 나기사의 권한이 완전히 박탈되며 필리우스 분파또한 와해될 위기를 맞이하였다. 그들은 자신들이 살기 위하여 다른 대표를 선출하였고 티파티의 권한에 접근하기 위한 공작 또한 펼쳤지만, 파테르 분파는 그들의 시도를 항상 무력화했다.\n\n필리우스 분파는 결국 최후의 방법으로 그들을 습격하기로 하여 움직이기로 결심하였고 그 계획을 논의하며 준비를 끝맞췄다. 습격 당일 필리우스 분파는 파테르 분파를 습격하기 위해 진군하기 시작하였다.\n\n진군한지 얼마 지나지 않아 그들은 뭔가 '위화감'을 느꼈다. 항상 걸어오던 거리였지만 오늘따라 무언가 불길한 느낌이 우리를 엄습했다. 결국 자신의 불안감을 이기지 못하였고 전원 중지 명령을 내렸다. 저 숲길 깊은 곳에서 우리를 바라보는 느낌은 가시지 않았고 나는 천천히 그 곳으로 향하였다.\n\n불안감은 현실이였던가? 그 곳으로 향하자 휘슬 소리와 함께 수십명이 우리를 덥쳤다. 상황은 빠르게 종료되었고 우리는 제압당했다. 수십명의 인물들이 우리의 계획을 먼저 알아차리고 우리가 갈 곳을 예측 했다. 운명 다가왔음을 느꼈고 내 몸을 운명에 던졌다."
 TRM_event.20.a: "정보를 흘린건 실수였나?"

 TRM_event.21.t: "전가"
 TRM_event.21.desc: "그녀는 이해할 수 없었다.\n내던지듯 펜을 내려놓고 안락한 의자에서 일어난 미소노 미카는 도저히 이해할 수 없었다.\n탁상 위엔 아직 제대로 시작조차 못한 연설 원고가 남아있었다.\n도대체 왜 자신이 이런 지루한 작업을 하고 있어야 하는가?\n\n근 며칠간 그녀가 치워버린 수많은 사람들은 그 정확한 수가 생각조차 나지 않을 정도로 많았다.\n덕분에 트리니티에서 자신에게 대항할 조직 같은 건 더 이상 남아있지 않았다.\n하나 뽑아보자면 시스터후드 정도가 있겠지만 그 종교쟁이들은 고리타분한 전통 때문에 정치에 신경조차 쓰지 않고 있으니까.\n\n그러니 이 연설문도 필요 없다.\n그녀가 하는 말과 행하는 일에 불만을 가질 사람이 남아있을리 없기에.\n만약 그런 불경한 마음을 조금이라도 지녔다면 그 친구는 순식간에 다시는 햇빛을 보지 못할 곳으로 끌려가고 말 것이다.\n하지만 그럼에도 자신을 보좌하는 인간들은 연설문이 필요한다고 얘기했다.\n\n답답한 마음에 미카는 집무실 밖으로 나와 오래된 복도를 거닐었다.\n차라리 이 연설문을 쓰라고 한 애들도 어딘가에 깊숙이 처박아버릴까 하는 생각을 하던 도중 그녀는 복도의 끝에서 무언가와 눈이 마주쳤다.\n\n아직 치워지지 않은, 트리니티의 또 다른 지도자였던 그녀의 온화해 보이는 거짓된 미소가 담긴 액자.\n살짝 못마땅하게 그 액자를 보고 있던 미카는 이윽고 무언가를 생각해 내곤 싱긋 웃음을 지었다."
 TRM_event.21.a: "아- 그러면 되겠네-"
 
 TRM_event.22.t: "혈흔"
 TRM_event.22.desc: "트리니티의 정의실현부의 활동은 지금껏 트리니티를 잘 챙겨왔으나, 지금은 아무런 권한도 없었다.\n그러니까 검은 정복을 입은 학생들이 이리저리 돌아다니며 유대인이라 불리는 현지인들을 잡아가는 꼴을 봐도 정의실현부는 아무 행동도 할 수 없었다는 것이다. 정의실현부 일반부원인 그녀도 당연했다.\n저 '돌격대'라는-트리니티에서 괴롭힘을 당하거나 누구와도 관계를 맺지 못한 학생들이 검은 정복 입고 떵떵거리며 다니는-것들이 거리에서 총알을 쏴대고 다니는데 아무 제지도 할 수 없다니.\n\n-탕!\n\n또 그녀의 근처에서 총소리가 들렸다.\n\n그녀는 주변을 둘러보았다.\n\n총알에 꿰뚫린 시체와 혈흔들이 거리에 널브러져 있었고, 그걸 치우는 건 전부 정의실현부 부원들의 몫,\n\n그녀는 천천히, 돌격대의 빽빽거리는 소리를 들으며 시체를 치우기 위해 걸어갔다."
 TRM_event.22.a: "그들은 정리라는 걸 모르는가?"

 TRM_event.23.t: "수상한 낌새"
 TRM_event.23.desc: "-탕!\n\n총소리가 길거리에서 울려 퍼졌다. \n\n-에이, 옷에 다 튀었네.\n\n여자는 한 손에 총을 든 채로 역겨운 얼굴을 하며 발로 그녀의 다리 아래에 있는 시체를 걷어찼다.\n\n저 시체는 무슨 악독한 짓을 했기에 죽은 걸까?\n답은 간단했다.\n\n시체는 유대인이었기 때문이다. 사실 이 시체가 그녀에게 뭔가 악독한 짓을 하거나 그러지는 않았다.\n\n... 그저 별을 달지 않고 돌아다닌 게 죄라면 죄겠지.\n\n그녀는 다시금 주위를 둘러보며 자신의 희생양을 찾았다.\n여자는 그러다가, 웃기 시작했다.\n기뻤다,\n트리니티에서 그 누구와도 관계를 쌓지 못하고, 괴롭힘당하고 배척당하던 학생에게는 이 권력은 참으로 달콤한 것이었다. \n\n-탁탁탁!\n\n그때, 여자의 뒤에서 누군가의 기척이 느껴졌다.\n\n그녀는 황급히 뒤를 돌아보았지만 뒤에는 아무도 없었다."
 TRM_event.23.a: "분명 뭐가 움직였는데.."

 TRM_event.24.t: "권한 확대"
 TRM_event.24.desc: "트리니티의 자치경찰,봉사단체 라는 명목상의 이름을 가지고 실상은 무력기관이자 트리니티의 선도부 역할을 맡는 정의실현부의 권한에 대한 문제가 거론 되었습니다. 이를 어떻게 할까요?"
 TRM_event.24.c: "권력을 주면 나중에 방해가 될 수 있다."
 TRM_event.24.b: "직속 친위대로 새로 창설하자."

 TRM_event.25.t: "선동"
 TRM_event.25.desc: "트리니티의 유일한 권력자, 미소노 미카가 준비된 단상에 섰다.\n불안감이 섞인 시선으로 그녀를 보고 있던 대중들의 예상과는 다르게, 언제나처럼 아이와도 같이 헤실 거리며 나타난 그녀는 중앙에 배치된 마이크를 장난스럽게 톡톡 치면서 발랄하고 가벼운 어조로 그녀는 입을 열었다.\n\n\"아하하- 다들 표정이 왜 그래? 단체로 이상한 거라도 먹은 것 같아~☆, 이해해~ 갑작스럽게 나기사가 사라져서 당황 한거지? 하지만 나한테도 다 이유가 있다는 거 알아?\"\n\n키득거리며 장난꾸러기처럼 한쪽 발을 앞뒤로 흔드는 미카와 다양한 반응을 보이는 청중들.\n예상치 못한 모습으로 인한 대중의 당혹감은 자연스레 사라져있었다.\n\n\"그도 그럴게 트리니티에 키보토스 전체까지 위기에 휩싸여 버렸잖아? 이런 말도 안 되는 일에 휘말려 버린 덕분에~☆, 학원째로 순간 이동이라니.. 나 그런 이상한 이야기는 만화에서도 들어본 적 없는걸~?\"\n\n어느 정도 풀어진 분위기 속에서 몇몇 사람들은 살짝 웃음을 보이기도 했다.\n하지만 곧 그녀의 입에서 나온 이야기는 모든 이를 경직시켰다.\n\n\"그런데 이 상황을 통제해야 할 학생회들 말인데.. 솔직히 멍청하지 않아? 아! 물론 우리 트리니티의 학생회를 포함해서~, 처음 보는 생김새를 가진 적대적인 사람들... 그리고 변해버린 주변 상황으로 인한 혼돈.. 그런데 각 학원의 학생회들은 뭘 했을까?\"\n\"자신들만을 위했다!\"\n\n그녀의 질문에 청중들 중 몇몇이 마치 기다렸다는 듯 소리쳤다.\n\n\"맞아- 아무것도 안 하고 자기들의 권력과 안녕만을 챙겼지, 누구도 키보토스와 평범한 학생들을 생각조차 안했어. 심지어 어떤 혐오스러운 뿔 달린 쓰레기들은 아예 내전까지 해버렸더라? 그것도 시답지 않은 호승심 때문에 자신들의 설립 목적인 치안 유지까지 집어던져가면서-\"\n\"더럽고 쓸모없는 악마 새끼들...!\"\n\"혐오스러운 게헨나놈들!!\"\n\n점점 더 회장의 분위기는 과열되기 시작했다.\n아니, 라디오를 통해 이 방송을 듣고 있는 트리니티 전체가 흥분에 휩싸이기 시작했다.\n\n\"총학생회도 마찬가지야, 키보토스를 위해서 여러모로 배려를 해 줬음에도 불구하고 이런 상황에 아무것도 하지 않은 채 손가락만 빨고 있잖아? 엄청 웃기지 않아?\"\n\"무능한 총학생회!!\"\n\"총학생회를 해체시켜야 해!\"\n\n트리니티뿐만이 아니었다.\n이 방송을 듣고 있던 키보토스 전체가 트리니티의 새로운 단일 학생회장의 목적이 키보토스 전체라는 걸 알게 되었다.\n\n\"그래서 내가 트리니티 그리고 키보토스의 모든 평범한 학생을 대표해서 이 자리에 선 거야, 성부와 성자와 성령의 이름으로... 지금의 혼란을 잠재울 수 있는 건 우리 트리니티뿐이니까\"\n\n그 말을 끝으로 단말마와도 같은 광기의 함성 속에서 방송은 종료됐다.\n키보토스의 모든 이들은 느꼈다.\n자신들을 향해 곧 불어올 피의 바람을."
 TRM_event.25.a: "분노와 증오는 대중을 열광시키는 가장 강력한 힘이다."

 TRM_event.26.t: "제1막의 종말"
 TRM_event.26.desc: "한때 정치인 중 한 명으로 존경을 받던 그는 이젠 존재하지 않았다.\n그는 삼위일체를 자신들의 정체성으로 내건 알 수 없는 존재들이 국가사회주의의 남은 찌꺼기와 손잡고서 독일 전역을 휩쓸어버리는 것을 가장 가까운 자리에서 목격했다.\n폭군의 위업을 선전하는 배너와 본래의 기술로는 모방조차 어려운 전광판들이 독일인들의 오랜 역사와 전통을 가리고, 카페와 극장에서 들려오던 바이올린의 선율은 도시 전역에 솟아난 스피커에서 흘러나오는 선전방송의 트럼펫 소리에 묻혀 사라져 버렸다.\n그렇기에 그는 창문을 굳게 잠그고, 암막을 치고, 귀를 닫았다.\n독일을 넘어 이윽고 유럽 전체로 퍼져나갈 참상에서 조금이나마 벗어나기 위해서.\n\n하지만 오늘, 평소와는 다른 규모의 소음이 그의 어둡고 먼지로 뒤덮인 공간까지 침범해 왔다.\n그의 가슴속의 두려움과 모멸감 사이로 나타난 호기심은 그가 암막을 걷고 창문을 열어보도록 명령했고 그는 명령을 충실히 이행했다.\n거리에선 사람들이 새로운 지도자의 존안과 국기를 내걸고 도시를 가로지르는 군대의 행렬에 환호했다.\n그곳에 있는 모든 이들이 한목소리로 승리를 노래했다.\n추잡한 악몽이 결국 유럽 전역을 집어삼켰다.\n\n사색이 되어 창가에서 물러나던 추레한 노인은 뒤로 넘어졌다.\n늙어버린 육신이 비명처럼 지르는 고통조차 그의 신경을 타고 날카롭게 흐르는 절망과 역겨움에 가려져 느끼지 못했다.\n아주 잠깐 그래도 드디어 모든 것이 끝났다는 생각에 안도를 느낀 노인이었으나, 정치라는 거친 물결에 깊숙이 발을 담갔던 그는 누구보다도 잘 알고 있었다.\n증오와 분노로 움직이는 기계는 스스로 존재하기 위해 모든 것을 파괴할 때까지 멈추지 않는다는 것을, 그리고 마지막에는 모든 것을 끌어안은 채 스스로 자멸하리란 것 또한.\"....아직 끝난 게 아니다.. 아직 끝난 게 아니야...!\"구시대의 기나긴 탄식은 어둠 속으로 조용히 사라져갔다."
 TRM_event.26.a: "제2막의 시작"
 TRN_endsieg_event_tt: "§t키보토스는 강력한 지배 아래에 하나로 뭉쳤습니다. 그러나 밤의 여왕의 지배가 얼마나 갈지는 모르지만, 모두에게 끝 없는 어둠이 드리웁니다.§!"

 TRM_event.27.t: "게헨나 격하운동"
 TRM_event.27.desc: "트리니티가 게헨나의 전쟁에서 승리하고 미소노 미카의 명령에 따라 게헨나 특색의 건축물들은 빠르게 폭파 되거나 트리니티의 건축 양식으로 재탄생 하게 되었다. 특히 선도부장 소라사키 히나가 쌓아올렸던 게헨나의 찬란했던 산업은 전부 뜯겨 트리니티로 재배치 되었다.\n\n아마우 아코 행정관은 이 일을 두눈 뜨고 지켜볼 수 밖에 없었다. 전쟁에서 진 이상 그녀가 할 일은 없기 때문이다. 소라사키 히나가 게헨나 중앙구 전투에서 산화함으로 그녀에게는 유일한 취미 조차 사라졌다. 그녀는 트리니티가 증오스러웠다. 게헨나를 침략한 침략자들이, 자신에게서 행복을 앗아간 녀석들이, 하지만 그녀에게는 힘이 없었다. 선도부장 소라사키 히나처럼 강인한 힘이.\n\n-콰아앙!\n\n\"와하하! 시원하게 날렸습니다!\"\n\n큰 폭팔음과 함께 웃는 소리가 들렸다. 웃었던 자는 그저 기뻐서 웃었겠지만 그녀에게는 비웃음으로 들렸다. 행정관은 손을 놓고 말았다. 희망을 붙잡던 손을\n\n한때 정의로운 의미로 쿠데타를 일으키고 게헨나의 찬란힌 발전을 이끌던 선도부장을 옆에서 지켜왔던 행정관은 깊은 공허속으로 사라지고 말았다."
 TRM_event.27.a: "흔적을 남기지마라."

 TRM_event.28.t: "반소비에트 협정"
 TRM_event.28.desc: "방공 협정으로, [From.GetNameDef](은)는 붉은겨울의 위협에 대처할 수 있는 안정적인 외교적 배경을 마련하게 되었습니다. 그러나 이 협정은 군사동맹은 포함하지 않았고 서명국에 대한 명확한 의무가 규정되어 있지 않습니다. [From.GetLeader](은)는 어느 한 서명국이 붉은겨울과의 전쟁에 돌입하면 모두 참전하는 것에 동의한 반붉은겨울 연합으로 조약을 확대하는 것을 꾀하고 있습니다.\n\n이것은 더욱 위험하고, 지금까지 유지해온 붉은겨울과의 어떠한 외교도 단절되겠지만, 이것은 또한 전쟁을 대비해 우리 측에 강력한 동맹을 확보할 좋은 기회이기도 합니다."
 TRM_event.28.a: "우리는 트리니티와 그 동맹국과 함께 붉은겨울에 대항할 것이다."

