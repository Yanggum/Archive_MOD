l_english:
 RE4_GATHERING_STORM_DESC: "The biting winds of the north are shifting. As the 227th Special Class takes their first steps into the Finnish wilderness, the echoes of revolution and exile mingle with the scent of gunpowder. This is not just a war for territory; it is a struggle for the right to exist in the eyes of Red Winter." 
 RE1_GATHERING_STORM_DESC: "Norway stands at a crossroads, under the watchful—and perhaps overly bureaucratic—eye of the Red Winter military administration. Will the local spirit be crushed by the weight of endless reports, or will a new synthesis of ideology and Nordic grit emerge?" 
 RE2_GATHERING_STORM_DESC: "Denmark, the gateway to the Baltic, finds itself under 'protection.' Amidst the discipline of the guards and the quiet defiance of the students, the gears of the military government turn toward an uncertain sunrise." 
 RE3_GATHERING_STORM_DESC: "Sweden remains a bastion of industrial potential, now repurposed for the glory of the Secretariat. But in the shadow of the factories, whispers of 'Ivan Kupala' grow louder, and the balance of power begins to tilt." 


