 RE4_nodoka_desc: "Nodoka was originally an exile of the 227th Special Class. However, after the Great Transfer, while Red Winter was engaged in wars with the Nordic countries, she was dispatched to the Finnish front. Whether it was to spearhead the Eastern Offensive or to simply extend her exile due to setbacks in the region, the Secretariat's Public Security Committee struck a deal: if the 227th Special Class could secure victory and complete the offensive in Finland, their exile would finally be lifted."
 
