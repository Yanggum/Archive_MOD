 redpuppet.1.t: "[RE4.GetName]'s Request for Weapons"
 redpuppet.1.d: "When the voluntarily risen student militia began their offensive toward Finland, the Red Winter leadership expected a swift victory. However, contrary to expectations, the war with the [FIN.GetAdjective] has turned into a long-term conflict, making the depletion of the Defense Commission's supplies an unavoidable reality. Considering the maintenance of the front and the morale of the troops, it is difficult to even maintain the current situation without additional supplies. Accordingly, they have requested support from the stockpiles held by the homeland."
 redpuppet.1.a: "Of course!"
 redpuppet.1.b: "We're a bit short ourselves..."
 redpuppet.2.t: "[FROM.GetName] Denied the Request"
 redpuppet.2.desc: "Despite our earnest request, [FROM.GetName] has flatly refused. The reason was utterly absurd: a shortage of weapons. As the war drags on, resources and logistics are reaching their limits, but we can no longer expect outside help. In the end, we must overcome this hardship ourselves. No matter what obstacles arise, we must blaze our own trail with our own strength."
 redpuppet.2.a: "The wind is exceptionally biting today."
 redpuppet.3.t: "[FROM.GetName] Accepted the Request"
 redpuppet.3.desc: "Our earnest request has finally been accepted. [FROM.GetName] approved it immediately, and stockpiled supplies have begun to rush in endlessly by train. Thanks to this, our army can maintain a plentiful supply for the time being, and a drop in morale can be effectively prevented."
 redpuppet.3.a: "Attack, it's an offensive!"
 redpuppet.4.t: "[RE4.GetName] Requests Military Advisors"
 redpuppet.4.desc: "[RE4.GetName] is a student militia that rose voluntarily, excelling in surprise operations and possessing the potential to end the war quickly. However, as the war with the [FIN.GetAdjective] lasted longer than expected, their limits began to show. Exhausted by continuous combat and lack of supplies, they have earnestly requested that we dispatch military advisors."
 redpuppet.4.a: "Is there any reason not to?"
 redpuppet.5.t: "[FROM.GetName] Dispatched Military Advisors"
 redpuppet.5.desc: "After our earnest requests, [FROM.GetName] has decided to dispatch military advisors to us! With the support of the military advisors, the war with the [FIN.GetAdjective] side is expected to end soon."
 redpuppet.5.a: "That's welcome news!"
 redpuppet.6.t: "[FROM.GetName] Refused to Dispatch Military Advisors"
 redpuppet.6.desc: "They refused this?"
 redpuppet.6.a: "LOL"
 redpuppet.7.t: "[RE4.GetName] Requests Dispatch of Officers"
 redpuppet.7.desc: "[RE4.GetName] is composed of militias and lacks even the minimum of discipline. As a result, they lack organizational power and their offensive capabilities are greatly limited. To solve this problem, we have decided to accept their demand and select a total of two generals to take command.\n\nHowever, it is not strictly necessary to accept their request. If desired, it can be refused and other measures can be sought."
 redpuppet.7.a: "$RED_marina$. Her offensive capabilities are reliable."
 redpuppet.7.b: "$RED_Tomoe$. Her planning is near perfection."
 redpuppet.7.c: "Let them handle it themselves."
 RE4_she_is_leader_tt: "\nThe following person will become the §YChairman of the Defense Commission§! of §Y@RE4[RE4.GetName]§!"
 redpuppet.8.t: "[FROM.GetName] Accepted Officer Dispatch"
 redpuppet.8.desc: "The title says it all."
 redpuppet.8.a: "That's welcome news!"
 redpuppet.9.t: "[FROM.GetName] Refused Officer Dispatch"
 redpuppet.9.desc: "[FROM.GetName] flatly refused the request for officer dispatch, telling [RE4.GetName] to solve their problems on their own. Fortunately, thanks to [ROOT.GetLeader]'s efforts, some degree of discipline is being established, but there is still a long way to go."
 redpuppet.10.t: "The Winter War"
 redpuppet.10.desc: "The fate of Northern Europe has knelt before the steel of Red Winter. Norway, Denmark, and Sweden—these three nations fell after the fierce offensive of Red Winter, and military administrations directly governed by Red Winter were established on their lands. However, Red Winter's advance did not stop there.\n\nIn the northern Finnish city of Kemi, students 'voluntarily rose up,' and the Red Winter Defense Commission was immediately established. They did not stop at occupying the Lapland region but showed their ambition to seize all of Finland by advancing south. However, the offensive was gradually delayed as they encountered the stubborn resistance of the Finnish army.\n\nNevertheless, the Defense Commission is rallying the militia and preparing once again to advance south. Now, the moment is approaching when the Finnish army, trying to protect their home, and the Red Winter army, pushing down from the north, will clash."
 redpuppet.10.a: "To the south!"
 redpuppet.10.b: "Let us protect our motherland!"
 redpuppet.11.t: "Winter War - Victory for [RE4.GetName]"
 redpuppet.11.desc: "After [RE4.GetName]'s persistent and meticulous offensive, the Finnish army's defensive line finally collapsed, and $VICTORY_POINTS_11105$ fell. Amidst the silence that settled over the blood-stained battlefield, as the troops of [RE4.GetName] marched through the streets of $VICTORY_POINTS_11105$, those left behind could only watch expressionlessly."
 redpuppet.11.a: "A great victory!"
 redpuppet.12.t: "Winter War - Defeat for [RE4.GetName]"
 redpuppet.12.desc: "Amidst the stubborn defense and persistent resistance of the Finnish army, [RE4.GetName] exhausted its offensive capabilities and eventually retreated repeatedly before disintegrating. Currently, the Defense Commission has fled to [925.GetName], but even this is expected to be disbanded soon.\n\nMeanwhile, the Finnish army is celebrating its victory, claiming to have protected the motherland from invaders from another world. Cheers rang out in liberated Kemi, and festivals were held to commemorate the victory, with fireworks celebrating Finland's freedom lighting up the night sky."
 redpuppet.13.t: "[RED.GetName] Decides to Invest in Us"
 redpuppet.13.desc: "[RED.GetName] passed a resolution today to invest resources for the industrial development of [RE4.GetAdjective] and has begun construction of industrial facilities in [925.GetName]."
 redpuppet.13.a: "A great benefit."
 redpuppet.14.t: "Establishment of the Finnish Autonomous Committee"
 redpuppet.14.desc: "The brave student soldiers of Red Winter initiated their own uprising, occupying $VICTORY_POINTS_11164$, and in a short time advanced to $VICTORY_POINTS_11105$, finally toppling the Finnish government. As a result, a new Autonomous Committee was established under the leadership of Red Winter, and the news quickly spread throughout Red Winter.\n\nHowever, contrary to expectations, the Autonomous Committee is refusing our direct intervention. Finland possesses abundant resources and is an important region that can serve as a site for various policy experiments alongside tourism. Nevertheless, the Autonomous Committee is asserting independent rights over Finland, highlighting that they rose up 'voluntarily.' It seems that setting the future relationship will not be easy."
 redpuppet.14.a: "The Chairman of the Public Security Committee will handle it well."
 redpuppet.15.t: "Supervision and Management Committee"
 redpuppet.15.desc: "As the Finnish Autonomous Committee was discussed, the Red Winter side felt a great need to manage and supervise us, and established the Supervision and Management Committee to be sent to Finland. They will not intervene in everything, but to pass laws for important policies or economic restructuring, we will have to persuade them or find other ways..."
 redpuppet.16.t: "Dispatch of Public Security Chairman $RED_marina$"
 redpuppet.16.desc: "Regarding the heroic victory of our 227th student soldiers, the motherland, Red Winter, seems to be deeply wary. By decision of the Red Winter Secretariat, Public Security Chairman $RED_marina$ has been appointed as our chairperson, and they seem to be attempting to control our achievements."
 redpuppet.16.a: "Figures."
 redpuppet.17.t: "$RED_marina$'s Ivan Kupala"
 redpuppet.17.desc: "Unfortunately, $RED_marina$ was unable to participate in this Red Winter festival, Ivan Kupala. Public Security Chairman $RED_marina$, who visited here for the Eastern Offensive and the stabilization of Finland, is scheduled to spend time here due to an increase in report writing and ongoing local conflict issues.\n\nToday, on Ivan Kupala, $RED_marina$ will likely spend the night in the hot springs created by the leadership from the 227th Special Class."
 redpuppet.17.a: "Might as well enjoy it like this."
 redpuppet.18.t: "Ivan Kupala Scandal!"
 redpuppet.18.desc: "While spending time in the hot springs, Public Security Chairman $RED_marina$ heard the sound of someone photographing her and the members of the 227th Special Class resting together! If this photo is published, or if it ever reaches Cherino, it is certain that Public Security Chairman $RED_marina$ will become $RED_marina$ of the 227th Special Class.\n\n\"N-No way!!!\""
 redpuppet.18.a: "..."
 redpuppet.19.t: "Red Winter Eastern Offensive Success!"
 redpuppet.19.desc: "From the public 'place of exile' where the members of the 227th Special Class, known as the Red Winter Defense Commission, were sent, a surprising report of victory against Finland has just arrived. The Defense Commission seems to have overcome the harsh conditions of abandonment by the homeland and accepted Finland's surrender just moments ago.\n\nWith the Defense Commission's victory, the Finnish Nordic exile organization has been disbanded, which could be seen as resolving the local rebellion issue of the military administration. However, since the commanders of the Defense Commission are exiles from the 227th Special Class, it is highly likely to develop into a different problem."
 redpuppet.19.a: "A remarkable achievement."
 redpuppet.19.b: "Dispatch Marina immediately."
 redpuppet.20.t: "Red Winter's Eastern Offensive Success!"
 redpuppet.20.desc: "The fact that those called the Red Winter Defense Commission had just won a victory against Finland was discussed at the Soviet Congress. The Defense Commission seems to have overcome the harsh conditions of abandonment by the homeland and accepted Finland's surrender just moments ago.\n\nHowever, our informants have obtained the fact that the Defense Commission is actually a public 'place of exile' for members of the 227th Special Class, who are known as internal dissenters within the Red Winter Federal Academy. this could serve as a means to check Leon Trotsky, who currently exists in the Red Winter Federal Academy."
 redpuppet.20.a: "Perhaps they could become our new allies."
 redpuppet.21.t: "$RED_marina$'s Public Security Committee Relocation"
 redpuppet.21.desc: "Public Security Chairman $RED_marina$ just submitted a report stating that she has relocated the headquarters of the Public Security Committee to the [RE4.GetName] side for the reason of stabilizing the Finnish region, and will be working there from now on.\n\n$RED_marina$'s report, which was close to a unilateral notification, is creating a new sense of unease within Red Winter. The sight of Public Security Chairman $RED_marina$ contacting officers of the military administration, and above all, the recently reported Ivan Kupala scandal involving $RED_marina$ and the 227th Special Class, served as a catalyst for [RED.GetLeader] to verify the loyalty of the military administration."
 redpuppet.21.a: "Oh boy."
 redpuppet.22.t: "Public Security Chairman $RED_marina$ and the 227th Incident"
 redpuppet.22.desc: "Less than two weeks after the Eastern Offensive ended in success, a photo of Public Security Chairman $RED_marina$ spending personal leisure time in Finland with members of the 227th Special Class during the Eastern Offensive was just reported to [RED.GetLeader]. [RED.GetLeader] seemed quite enraged upon learning the fact but was calmed down by the persuasion of those around her.\n\nDue to this scandal involving Public Security Chairman $RED_marina$, she can no longer avoid the suspicion of the homeland, and we must find out what they are doing in Finland."
 redpuppet.22.a: "Contact the military administration."
 redpuppet_go_to_marina_flag: "Marina relocated the Public Security Committee to Finland"
 redpuppet_go_to_marina_tt: "§Y$RED_marina$§! can no longer be employed by the state."
