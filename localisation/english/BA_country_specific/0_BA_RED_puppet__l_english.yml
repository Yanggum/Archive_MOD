 RE4_redwinter_military_advisors: "붉은겨울 군사고문단"
 RE4_redwinter_military_advisors_desc: "본국에서 군사고문단을 파견하면서 우리는 보다 정교한 작전을 수립할 수 있게 되었습니다. 이는 곧, 더욱 적극적인 공세를 펼칠 수 있는 기반이 마련되었음을 의미합니다. 전장의 흐름을 주도하고, 주저 없이 앞으로 나아갈 때입니다."
 RE4_redwinter_military_advisors_remove_tt: "\n조건 충족시 제거: §Y@FIN[FIN.GetAdjective]§! 측과 평화 중"
 RED_redwinter_military_advisors: "$RE4_redwinter_military_advisors$"
 RED_redwinter_military_advisors_desc: "핀란드를 향한 모험은 예상보다 거센 저항에 부딪히며 차질을 빚고 있습니다. 이 상황을 타개하기 위해, 우리는 군사고문단을 파견하여 방위위원회를 지원하고 보다 적극적인 공세를 유도해야 합니다. 물론 전투 자료 확보하는 것 또한 중요합니다."
 RE4_capture_of_supplies_ns: "$RE4_capture_of_supplies$"
 RED_redwinter_military_advisors_remove_tt: "\n조건 충족시 제거: §Y[RE4.GetName]§!: §Y@FIN[FIN.GetAdjective]§! 측과 평화 중"
