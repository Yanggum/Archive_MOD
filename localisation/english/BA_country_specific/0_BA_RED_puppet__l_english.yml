 redpuppet.1.t: "[RE4.GetName]의 무기 요청"
 redpuppet.1.d: "자발적으로 봉기한 생도민병대가 핀란드를 향한 공세를 시작하자 붉은겨울 수뇌부는 빠른 승리를 예상하였습니다. 그러나 예상과 달리, [FIN.GetAdjective]와의 전쟁은 장기전으로 접어들었고, 그로 인해 방위위원회의 물자 고갈은 피할 수 없는 현실이 되었습니다. 전선의 유지와 병력의 사기를 고려할 때, 추가적인 보급 없이는 전황을 유지하기조차 어려운 상황입니다. 이에 따라 본국에 비축된 물자의 지원을 요청하였습니다."
 redpuppet.1.a: "당연하지!"
 redpuppet.1.b: "우리도 조금 부족해서 말이야.."
 redpuppet.2.t: "요청을 거부한 [FROM.GetName]"
 redpuppet.2.desc: "우리의 간절한 요청에도 불구하고, [FROM.GetName](은)는 이를 단호히 거부하였습니다. 그 이유는 황당하기 그지없었습니다. 다름 아닌 무기 부족 때문이었습니다. 전쟁이 길어지면서 자원과 병참이 점점 한계에 다다르고 있지만, 이제 더 이상 외부의 도움을 기대할 수 없습니다. 결국, 우리는 우리 스스로 이 어려움을 극복해야 합니다. 어떠한 난관이 닥치더라도, 우리의 힘으로 길을 개척해 나가야 합니다."
 redpuppet.2.a: "오늘따라 유난히 바람이 매섭군"
 redpuppet.3.t: "요청을 수락한 [FROM.GetName]"
 redpuppet.3.desc: "우리의 간절한 요청이 마침내 받아들여졌습니다. [FROM.GetName]는 이를 즉시 승인하였고, 비축된 물자들이 열차를 타고 끝없이 달려오기 시작했습니다. 덕분에 우리의 군대는 당분간 풍족한 보급을 유지할 수 있게 되었으며, 사기 저하 또한 효과적으로 방지할 수 있을 것입니다."
 redpuppet.3.a: "공격, 공격전이다!"
 redpuppet.4.t: "군사고문단 파견을 요청한 [RE4.GetName]"
 redpuppet.4.desc: "[RE4.GetName]는 자발적으로 봉기한 생도민병대로, 기습 작전에 뛰어나며 전쟁을 단기전으로 끝낼 가능성을 지닌 전력입니다. 그러나 [FIN.GetAdjective]와의 전쟁이 예상보다 길어지면서, 이들의 한계가 점차 드러나기 시작했습니다. 지속적인 전투와 보급 부족 속에서 점점 지쳐가는 이들은 결국 우리에게 군사고문단을 파견해줄 것을 간절히 요청해왔습니다."
 redpuppet.4.a: "안 해줄 이유가 어디에 있나?"
 redpuppet.5.t: "군사고문단을 파견한 [FROM.GetName]"
 redpuppet.5.desc: "우리들의 간절한 요청 끝에 [FROM.GetName](은)는 우리에게 군사고문단을 파견하기로 결정하였습니다! 군사고문단의 지원이라면 [FIN.GetAdjective]측과의 전쟁도 곧 끝날 것으로 예상 됩니다."
 redpuppet.5.a: "반가운 소식이군!"
 redpuppet.6.t: "군사고문단 파견을 거부한 [FROM.GetName]"
 redpuppet.6.desc: "이걸 거부해?"
 redpuppet.6.a: "ㄹㅇㅋㅋ"
 redpuppet.7.t: "장교 파견을 요청한 [RE4.GetName]"
 redpuppet.7.desc: "[RE4.GetName]는 민병대로 구성되어 있으며, 최소한의 규율조차 갖추지 못한 상태입니다. 이로 인해 조직력이 부족하고, 공세 능력 또한 크게 제한됩니다. 이러한 문제를 해결하기 위해 우리는 이들의 요구를 받아들여 총 2명의 장군을 선발하여 지휘를 맡기기로 결정했습니다.\n\n하지만, 반드시 그들의 요청을 수락할 필요는 없습니다. 원한다면 이를 거부하고 다른 방안을 모색할 수도 있습니다."
 redpuppet.7.a: "$RED_marina$. 그녀의 공세 능력은 믿을만 하다."
 redpuppet.7.b: "$RED_Tomoe$. 그녀의 계획은 완벽에 가깝다."
 redpuppet.7.c: "알아서 하라지"
 RE4_she_is_leader_tt: "\n다음의 인물은 §Y@RE4[RE4.GetName]§!의 §Y방위위원장§!이 됩니다"
 redpuppet.8.t: "장교 파병을 수락한 [FROM.GetName]"
 redpuppet.8.desc: "제목이 곧 내용"
 redpuppet.8.a: "반가운 소식이군!"
 redpuppet.9.t: "장교 파견을 거부한 [FROM.GetName]"
 redpuppet.9.desc: "[FROM.GetName] 측은 [RE4.GetName]의 문제를 스스로 해결하라며 장교 파견 요청을 단호히 거부하였습니다. 다행히 [ROOT.GetLeader]의 노력 덕분에 어느 정도 규율이 잡혀가고 있지만, 아직 갈 길은 멀어 보입니다."
 redpuppet.10.t: "겨울 전쟁"
 redpuppet.10.desc: "북유럽의 운명이 붉은겨울의 강철 앞에 무릎을 꿇었습니다. 노르웨이, 덴마크, 스웨덴 이 세 나라는 붉은겨울의 거센 공세 끝에 패배하였고, 그 땅 위에는 붉은겨울이 직접 통치하는 군정청이 세워졌습니다. 그러나 붉은겨울의 진격은 여기서 멈추지 않았습니다.\n\n핀란드 북부의 도시 케미에서 학생들이 '자발적으로 봉기'하며 곧바로 붉은겨울 방위위원회가 수립되었습니다. 이들은 라피 지역을 점령하는 데 그치지 않고, 남부로 진격하며 핀란드 전역을 장악하려는 야심을 드러냈습니다. 하지만 핀란드군의 완강한 저항에 부딪히며 공세는 점차 지연되었습니다.\n\n그럼에도 불구하고 방위위원회는 민병대를 규합하며 다시 한 번 남부로의 진격을 준비하고 있습니다. 이제, 자신의 고향을 지키려는 핀란드군과 북쪽에서 밀려오는 붉은겨울의 군대가 맞붙을 시점이 다가오고 있습니다."
 redpuppet.10.a: "가자 남부로!"
 redpuppet.10.b: "우리의 조국을 지켜내자!"
 redpuppet.11.t: "겨울 전쟁 - [RE4.GetName]의 승리"
 redpuppet.11.desc: "[RE4.GetName]의 끈질기고도 치밀한 공세 끝에 마침내 핀란드군의 방어선이 무너졌고, $VICTORY_POINTS_11105$가 함락되었습니다. 피로 얼룩진 전장이 침묵에 잠긴 가운데, [RE4.GetName]의 군대가 $VICTORY_POINTS_11105$ 시가지를 가로질러 행군하자, 남겨진 이들은 그 모습을 무표정하게 바라볼 수밖에 없었습니다."
 redpuppet.11.a: "위대한 승리다!"
 redpuppet.12.t: "겨울 전쟁 - [RE4.GetName]의 패배"
 redpuppet.12.desc: "핀란드군의 완강한 방어와 끈질긴 저항 속에서 [RE4.GetName]은 공세 역량을 소진하고 결국 후퇴를 거듭하다가 와해되고 말았습니다. 현재 방위위원회는 [925.GetName]으로 피신한 상태지만, 이마저도 오래가지 못하고 곧 해체될 것으로 보입니다.\n\n한편, 핀란드군은 이계의 침략자들로부터 조국을 지켜냈다며 승리를 자축하고 있습니다. 해방된 케미에서는 환호성이 울려 퍼졌고, 승리를 기념하는 축제가 열리며 핀란드의 자유를 기념하는 불꽃이 밤하늘을 수놓았습니다."
 redpuppet.13.t: "우리에게 투자하기로 결정한 [RED.GetName]"
 redpuppet.13.desc: "[RED.GetName](은)는 오늘 [RE4.GetAdjective]의 산업 개발을 위한 자원을 투입하는 안건을 통과 시켰고 [925.GetName]에서 산업 시설 건설을 시작하였습니다."
 redpuppet.13.a: "큰 혜택이군."
 redpuppet.14.t: "핀란드 자치위원회 설립"
 redpuppet.14.desc: "붉은겨울의 용맹한 학도병들이 자체적인 봉기를 일으켜 $VICTORY_POINTS_11164$를 점령하고, 단기간에 $VICTORY_POINTS_11105$까지 진격하며 마침내 핀란드 정부를 무너뜨렸습니다. 그 결과, 붉은겨울의 지도 아래 새로운 자치위원회가 수립되었으며, 이 소식은 곧 붉은겨울 전역에 퍼졌습니다.\n\n그러나 예상과 달리, 자치위원회는 우리의 직접적인 개입을 거부하고 있습니다. 핀란드는 풍부한 자원을 보유하고 있으며, 관광업과 함께 다양한 정책 실험의 장이 될 수 있는 중요한 지역입니다. 그럼에도 불구하고, 자치위원회는 자신들이 '자발적'으로 봉기했음을 내세우며 핀란드에 대한 독립적인 권리를 주장하고 있습니다. 앞으로의 관계 설정이 쉽지 않을 것으로 보입니다."
 redpuppet.14.a: "보안위원장이 잘 해주겠지."
 redpuppet.15.t: "관리감독위원회"
 redpuppet.15.desc: "핀란드 자치위원회가 거론되면서 붉은겨울 측은 우리를 관리, 감독할 필요성을 크게 느끼게 되었고 관리감독위원회를 설립하여 핀란드로 보내왔습니다. 모든 일에는 개입하지 않겠지만 중요한 정책이나 경제 체제 재구성을 위한 법률을 통과 시키기 위해서는 이들을 설득하거나 혹은 다른 방법을 통해야 할 것입니다.."
 redpuppet.16.t: "$RED_marina$ 보안위원장 파견"
 redpuppet.16.desc: "우리 227호 학도병들의 영웅적인 승리에 대해, 모국인 붉은겨울은 심히 경계하고 있는 것 같습니다. 붉은겨울 사무국의 결정으로 $RED_marina$ 보안위원장이 우리의 위원장으로 임명되었으며 그들은 우리의 성과를 통제하려 시도하는 것 같습니다."
 redpuppet.16.a: "그럼 그렇지."
 redpuppet.17.t: "$RED_marina$의 이반 쿠팔라"
 redpuppet.17.desc: "안타깝게도, 이번 붉은겨울 축제인 이반 쿠팔라에 $RED_marina$는 참여하지 못했습니다. 동방 공세와 핀란드 안정화를 이유로 이곳에 방문한 $RED_marina$ 보안위원장은 늘어난 보고서 작성과 현지 충돌 문제의 지속으로 이곳에서 시간을 보내게 될 예정입니다.\n\n$RED_marina$는 오늘, 이반 쿠팔라를 맞이해 227호 특별반 출신 지도부가 만든 온천에서 하룻밤을 보내게 될 것 같습니다."
 redpuppet.17.a: "이렇게라도 즐겨야지."
 redpuppet.18.t: "이반 쿠팔라 스캔들!"
 redpuppet.18.desc: "$RED_marina$ 보안위원장은 온천에서 시간을 보내던 순간, 누군가가 자신과 227호 특별반 인원이 함께 휴식하는 모습을 촬영하는 소리를 들었습니다! 이 사진이 보도되거나, 혹여나 체리노에게 들어가는 순간 $RED_marina$ 보안위원장은 $RED_marina$ 227호 특별반이 되어 버리고 말 것이 분명합니다.\n\n\"아, 안돼!!!\""
 redpuppet.18.a: "..."
 redpuppet.19.t: "붉은겨울 동방 공세 성공!"
 redpuppet.19.desc: "붉은겨울 방위위원회라고 불리는 227호 특별반 인원들이 보내진 공공연한 '유배지' 에서, 조금 전 핀란드를 상대로 승전했다는 놀라운 보고서가 보내졌습니다. 방위위원회는 본국의 방치라는 열악한 상황을 극복하고 조금 전, 핀란드의 항복을 받아낸 것으로 보입니다.\n\n방위위원회의 승전으로 핀란드의 북유럽 망명 기구가 해체되어 군정청의 현지 반란 문제는 해결되었다고 볼 수 있으나, 방위위원회의 사령관이 227호 특별반 출신의 유배자들인 만큼 다른 문제로 발달할 가능성이 높습니다."
 redpuppet.19.a: "놀라운 성과다."
 redpuppet.19.b: "즉시 마리나를 파견해라."
 redpuppet.20.t: "붉은겨울의 동방 공세 성공!"
 redpuppet.20.desc: "붉은겨울 방위위원회라고 불리는 이들이 조금 전 핀란드를 상대로 승전했다는 사실이 소비에트 당대회에서 논의되었습니다. 방위위원회는 본국의 방치라는 열악한 상황을 극복하고 조금 전, 핀란드의 항복을 받아낸 것으로 보입니다.\n\n그러나 방위위원회는 붉은겨울 연방학원이라는 국가 내부의 반대파로 불리는 227호 특별반 인원들이 보내진 공공연한 '유배지'라는 사실을 우리의 정보원들이 입수했으며, 이는 현재 붉은겨울 연방학원에 존재하는 레프 트로츠키를 견제할 수단으로 작용할 수 있습니다."
 redpuppet.20.a: "어쩌면 그들은 우리의 새로운 동맹이 될 수 있을것이다."
 redpuppet.21.t: "$RED_marina$의 보안위원회 이전"
 redpuppet.21.desc: "$RED_marina$ 보안위원장은 조금 전 핀란드 지역의 안정화를 사유로 [RE4.GetName] 측으로 보안위원회의 본부를 이전했으며, 앞으로 그곳에서 근무할 것이라는 보고서를 제출했습니다.\n\n$RED_marina$ 보안위원장의 일방적인 통보에 가까운 보고는 붉은겨울 내 새로운 위화감을 조성하고 있으며, $RED_marina$ 보안위원장이 군정청의 장교들과 접촉하는 모습, 그리고 무엇보다 최근에 보도된 $RED_marina$와 227호 특별반의 이반 쿠팔라 스캔들은 [RED.GetLeader]가 군정청의 충성을 확인하는 계기가 되었습니다."
 redpuppet.21.a: "이런."
 redpuppet.22.t: "$RED_marina$ 보안위원장과 227호 사건"
 redpuppet.22.desc: "동방 공세가 성공으로 끝난 지 2주도 채 안된 현재, 방금 전 $RED_marina$ 보안위원장이 동방 공세 당시 핀란드에서 227호 특별반 인원들과 개인적으로 여가를 보낸 사진이 [RED.GetLeader]에게 보고되었습니다. [RED.GetLeader]는 해당 사실을 알고 꽤 격분한 듯 보였으나, 주변 이들의 만류로 진정하였습니다.\n\n$RED_marina$ 보안위원장의 해당 추문으로 인하여 $RED_marina$ 보안위원장은 본국의 의심을 피할 수 없게 되었으며, 그들이 핀란드에서 무엇을 하는지 우리가 파악해야 합니다."
 redpuppet.22.a: "군정청과 접촉해."
