 # Second Great Northern War - Finland Red Winter War

 RED_second_great_northern_war: "Second Great Northern War"
 RED_second_great_northern_war_desc: "The §Ymilitary administrations§! established on the territories of §YDenmark§!, §YNorway§!, and §YSweden§! are generally considered part of the Red Winter Federal Academy. However, now that Finland has organized a broad Nordic Exile Committee and is calling for the §YSecond Great Northern War§!, attempts to §Gseize§! the military administrations are being led by §SRed Winter§! and §CFinland§! in various regions.\n\nIn terms of influence, the §Ymilitary administration§! generally remains neutral in the §YSecond Great Northern War§!, but if §SRed Winter§! and §CFinland§! seize all influence ranges, the §RNordic Civil War§! will break out and various decisions to support the civil war will be unlocked."

