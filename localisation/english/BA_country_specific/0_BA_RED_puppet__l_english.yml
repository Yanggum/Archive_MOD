 RED_second_great_northern_war: "2차 대북방전쟁"
 RED_second_great_northern_war_desc: "§Y덴마크§!, §Y노르웨이§!, §Y스웨덴§!의 영토 위에 설립된 §Y군정청§!은 일반적으로 붉은겨울 연방학원의 일부로 여겨지나, 핀란드가 광범위한 북유럽 망명위원회를 조직하고 §Y2차 대북방전쟁§!을 부르짖는 지금 각지에서 군정청을 §G장악§! 하기 위한 시도가 §S붉은겨울§!과 §C핀란드§!에 의해 주도되고 있습니다.\n\n영향력의 경우 §Y2차 대북방전쟁§!에서 §Y군정청§!은 일반적으로 중립을 지키나, §S붉은겨울§!과 §C핀란드§!가 모든 영향력 범위를 장악할 시 §R북유럽 내전§!이 발발하고 내전을 지원하기 위한 여러 결정이 해금됩니다."

