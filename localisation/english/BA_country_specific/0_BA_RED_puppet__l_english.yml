 RE4_nodoka_desc: "노도카는 본래 227호 특별반의 유배자였습니다. 그러나 대전이 이후, 붉은겨울이 대전이 이후 북유럽 국가들과의 전쟁을 치르는 과정에서 핀란드 동방 공세를 담당하기 위해 -또는 핀란드 방면에서의 패배를 이유로 유배를 연장하기 위해- 핀란드와의 전쟁에서 승리하고 동방 공세를 완결짓는다면 유배를 풀어준다는 보안 위원장의 거래와 함께, 227호 특별반 전원은 핀란드 방면으로 파견되었습니다."
 
