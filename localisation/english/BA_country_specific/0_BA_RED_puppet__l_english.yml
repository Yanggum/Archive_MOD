 RED_northern_sovereignty_war: "Northern Sovereignty War"
 RED_northern_sovereignty_war_desc: "The §Ymilitary administrations§! established on the territories of §YDenmark§!, §YNorway§!, and §YSweden§! are generally considered part of the Red Winter Federal Academy. However, with the §YNorthern Sovereignty War§! being prepared, attempts to §Gco-opt§! the military administrations are being led by [RENSW_RED_leader_ADJ] and [RENSW_RE4_leader_ADJ]. If the influence competition is lost, the §Ymilitary administration§! will participate in the §YNorthern Sovereignty War§! on the §Ropposing side§!.\n\nIn terms of influence, the §Ymilitary administration§! follows §g[RENSW_RE4_leader_ADJ]§!'s side in the §YNorthern Sovereignty War§!, but if §S[RENSW_RED_leader_ADJ]§!'s influence reaches 100, the relevant §Ymilitary administration§! will participate on §S[RENSW_RED_leader_ADJ]§!'s side."


 redpuppet.1000.t: "Northern Sovereignty War!"
 redpuppet.1000.desc: "The Red Winter civil war has begun. After years of political infighting amidst threats of numerous coups, revolutions, and repeated ousters, the Red Winter Secretariat has finally split, and these two groups are now fighting each other in the streets to control the country.\n\n[RE4.GetLeader] has declared herself the leader of the Red Winter Federal Academy and is leading a civil war against [RED.Getleader] from [RE4.GetLeader.GetHerHis] provisional capital in [RE4.Capital.GetName]."
 redpuppet.1000.a: "Prepare for battle!"

