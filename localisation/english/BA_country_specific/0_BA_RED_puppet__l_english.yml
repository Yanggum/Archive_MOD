 redpuppet.2000.t: "Victory in the direction of [FROM.GetAdjective]"
 redpuppet.2000.desc: "Suomi's persistent support and the dedicated struggle of the Nordic Exile Committee have finally borne fruit. As of today, the forces of the Red Winter military administration that were operating in [FROM.GetAdjective] have been completely expelled, and the civil war for freedom has ended in our victory.\n\nIn the capital, where the smoke of war has cleared, a new government with the same goals as ours has been established. The new government expressed its deep gratitude for Finland's help in liberating their country from the brutal rule of Red Winter, and vowed to defend Nordic freedom and stability together under our leadership.\n\nThis is a great milestone achieved against Red Winter's expansionism, and will serve as a shield to further solidify our northern borders."
 redpuppet.2000.a: "An excellent victory!"
 redpuppet.2001.t: "Frustration in the direction of [FROM.GetAdjective]"
 redpuppet.2001.desc: "Heartbreaking news has arrived from the military administration. Due to the persistent offensive of Finnish puppets and the agitation of internal rebel forces, our military administration stationed in [FROM.GetAdjective] has finally collapsed.\n\nReactionaries backed by Finnish support have seized the capital and established a new puppet government, and our surviving soldiers are struggling to retreat across the border. This defeat has dealt a great blow to the prestige of the Red Winter Federal Academy and caused a serious vacuum in our influence in Northern Europe.\n\nWe will never forget this defeat and will surely pay back this debt one day."
 redpuppet.2001.a: "Damn it!"

 redpuppet.2100.t: "Frustration in the direction of [FROM.GetAdjective]"
 redpuppet.2100.desc: "Desperate news has been delivered from the military administration. The Nordic Exile Committee, which was fighting for the freedom of [FROM.GetAdjective], and our support forces helping them have finally collapsed before the overwhelming offensive of the Red Winter military administration.\n\nThe capital has fallen, and the freedom fighters who resisted have been executed or taken to camps. This defeat is not just a military setback, but a tragedy in which our hopes for Nordic freedom have been crushed. Red Winter's steel boots have now come right up to our borders. We must prepare for even harsher trials."
 redpuppet.2100.a: "Damn it!"
 redpuppet.2101.t: "Frustration in the direction of [FROM.GetAdjective]"
 redpuppet.2101.desc: "Glorious news of victory has arrived from the military administration! We have successfully suppressed the rebel forces in [FROM.GetAdjective] instigated by Finnish reactionaries, and made our red flag fly over the capital again.\n\nBy mopping up internal enemies and repelling the puppets across the border, the revolutionary government of [FROM.GetAdjective] has become even more solid. This victory has once again proven the strength of the Red Winter Federal Academy, giving fear to our enemies and hope to our comrades.\n\nThe stability of the north has been secured, and we can now focus our efforts on the liberation of other places."
 redpuppet.2101.a: "An excellent victory!"

