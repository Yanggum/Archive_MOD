 GEM_focus_ended_tooltip_C: "§g우리는 현재 게헨나 학원의 국체를 유지하고 있기에, '게헨나를 위한 독일 민족' 루트들이 해금됩니다!§!"
 GEM_focus_ended_tooltip_C1: "§g우리는 현재 $GEH_akzhxh$의 길을 따르고 있기에, 대게헨나국을 선포하게 될 것입니다.§!"
 GEM_focus_ended_tooltip_C2: "§g우리는 현재 $GEH_satsuki$의 길을 따르고 있기에, 대중계몽부를 설립하고 독일계를 향한 세뇌 절차에 돌입할 것입니다.§!"
 GEM_focus_ended_tooltip_C3: "§g우리는 현재 $GEH_dlfhgk$의 길을 따르고 있기에, 게헨나 합중국 내 독일계 시민들의 개혁이 시작될 것입니다.§!"
 GEM_focus_ended_tooltip_C4: "§g우리는 현재 $GEH_motomiya_chiaki$의 길을 따르고 있기에, 민족 갈등을 종식시키기 위해 게헨나 민족이 선포될 것입니다.§!"

 GEM_focus_ended_tooltip_B: "§g우리는 현재 독일과의 연방제를 설립했기에, '두 민족의 국가' 루트들이 해금됩니다!§!"
 GEM_focus_ended_tooltip_BO: "§g우리는 현재 아무런 정치적 방향을 결정하지 않았기에, 두 민족의 국가가 정치적 방향성이 될 것입니다.§!"
 GEM_focus_ended_tooltip_B1_B: "§g우리는 현재 $GEH_akzhxh$의 길을 따르고 있기에, 더 넓은 레벤스라움을 선포할 수 있게 됩니다.§!"
 GEM_focus_ended_tooltip_B2_B: "§g우리는 현재 $GEH_satsuki$의 길을 따르고 있기에, 대중게몽부를 설립하고 독일계 파벌에 대한 세뇌 절차에 돌입할 것입니다.§!"
 GEM_focus_ended_tooltip_B3_B: "§g우리는 현재 $GEH_dlfhgk$의 길을 따르고 있기에, 게헨나-독일 연방합중국의 개혁이 시작됩니다.§!"
 GEM_focus_ended_tooltip_B4_B: "§g우리는 현재 $GEH_motomiya_chiaki$의 길을 따르고 있기에, 민족 갈등을 종식시키기 위해 게헨나 민족이 선포될 것입니다.§!"

 GEM_focus_ended_tooltip_1O: "§g우리는 현재 아무런 정치적 방향을 결정하지 않았기에, $GEH_akzhxh$의 길을 따르게 될 것입니다.§!"
 GEM_focus_ended_tooltip_2O: "§g우리는 현재 아무런 정치적 방향을 결정하지 않았기에, $GEH_satsuki$의 길을 따르게 될 것입니다.§!"
 GEM_focus_ended_tooltip_3O: "§g우리는 현재 아무런 정치적 방향을 결정하지 않았기에, $GEH_dlfhgk$의 길을 따르게 될 것입니다.§!"
 GEM_focus_ended_tooltip_4O: "§g우리는 현재 아무런 정치적 방향을 결정하지 않았기에, $GEH_motomiya_chiaki$의 길을 따르게 될 것입니다.§!"

 GEM_focus_ended_tooltip_tip: "§OTIP: 이 정치적 중점은 어떤 중점을 선행하는지에 따라 후속 중점도가 분화됩니다!§!"

 GEM_focus_ended_tooltip_B1_1: "§g우리는 현재 두 민족의 국가가 선포되었기에, $GEH_akzhxh$는 가장 강력한 두 민족의 국가를 건설하려 할 것입니다.§!"
 GEM_focus_ended_tooltip_B2_2: "§g우리는 현재 두 민족의 국가가 선포되었기에, $GEH_satsuki$는 최면술을 통해 민족갈등을 완화하려 시도할 것입니다.§!"
 GEM_focus_ended_tooltip_B3_3: "§g우리는 현재 두 민족의 국가가 선포되었기에, $GEH_dlfhgk$는 두 민족의 연방제를 결속시킬 것입니다.§!"
 GEM_focus_ended_tooltip_B4_4: "§g우리는 현재 두 민족의 국가가 선포되었기에, $GEH_motomiya_chiaki$는 상생하는 제국을 향해 도약할 것입니다.§!"

 GEM_focus_ended_tooltip_A1_1: "§g우리는 현재 독일국이 선포되었기에, $GEH_akzhxh$는 대게르만국을 설립하고 국가의 총통이 되려 할 것입니다.§!"
 GEM_focus_ended_tooltip_A2_2: "§g우리는 현재 독일국이 선포되었기에, $GEH_satsuki$는 독일 민족의 정신적 이데아를 건설할 것입니다§!"
 GEM_focus_ended_tooltip_A3_3: "§g우리는 현재 독일국이 선포되었기에, $GEH_dlfhgk$는 합중국 제도를 독일에 맞게 보강할 것입니다.§!"
 GEM_focus_ended_tooltip_A4_4: "§g우리는 현재 독일국이 선포되었기에, $GEH_motomiya_chiaki$는 국가의 총통이 되어 작은 게헨나 학원을 보호하려 할 것입니다.§!"

 GEM_focus_ended_tooltip_AO: "§g우리는 현재 아무런 정치적 방향을 결정하지 않았기에, 독일국이 정치적 방향성이 될 것입니다.§!"
 GEM_focus_ended_tooltip_A1_A: "§g우리는 현재 $GEH_akzhxh$의 길을 따르고 있기에, 독일 헤게모니를 찬탈하고 더 넓은 레벤스라움을 창설할 수 있게 됩니다.§!"
 GEM_focus_ended_tooltip_A2_A: "§g우리는 현재 $GEH_satsuki$의 길을 따르고 있기에, 대중게몽부를 설립하고 게헨나와 독일을 가리지 않고 세뇌 절차에 돌입할 것입니다.§!"
 GEM_focus_ended_tooltip_A3_A: "§g우리는 현재 $GEH_dlfhgk$의 길을 따르고 있기에, 점진적으로 1848년의 독일 연방이 복원될 것입니다.§!"
 GEM_focus_ended_tooltip_A4_A: "§g우리는 현재 $GEH_motomiya_chiaki$의 길을 따르고 있기에, 모든 정당을 통합할 일당제가 선포될 것입니다.§!"


