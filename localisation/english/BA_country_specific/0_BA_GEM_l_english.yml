 GEM_gehenna_unification_promotion:0 "전게헨나의 통일 추진"
 GEM_war_preparations: "전쟁 준비"
 GEM_war_preparations_desc: "다가오는 전쟁에 완전히 대비하려면 만마전만이 아닌 게헨나 전체의 산업과 기반시설에서도 준비가 이루어져야 합니다."
 GEM_prepare_for_the_next_blockade_ww: "전국가적 고립 대비"
 GEM_prepare_for_the_next_blockade_ww_desc: "우리 국가가 다른 국가와의 전쟁에 돌입한다면 수 많은 외교관계가 변화하고, 단절될 것입니다. 독일의 영토 위에서 벌일 결전을 철저하게 준비한다면, 외교적 고립은 우리에게 거의 영향을 끼치지 못할 것입니다."
 GEM_peaceful_unification_discussion: "평화 통일 논의"
 GEM_retaliation_situation: "보복 상황"
 GEM_ori_unified_gehenna: "통일 게헨나"
 GEM_central_party_alliance: "중앙당과 연대"
 GEM_central_party_alliance_tt: "§Y안정도§!가 §R낮을수록§! 더 큰 §G이익§!을 얻습니다. (§Y15%§! 미만, §Y45%§! 미만, 그 외)"
 GEM_central_party_alliance_3_tt: "안정도가 15%보다 낮아 아래의 효과를 얻음:"
