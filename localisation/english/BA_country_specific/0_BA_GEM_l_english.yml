 GEH_german_nationalism_issue: "Nation of the Germans"
 GEH_german_nationalism_issue_desc: "Even though a significant number of students moved to the German region through the Great Migration, our numbers are still a minority. While we are repelling the attacks of Germans with students' physical abilities and continuing academy life without problems, if they start to possess organized resistance capabilities, they could become a serious threat.\n\nTo gain the support of the Germans, we must emphasize our cultural homogeneity, respect their cultural customs, and furthermore, make continuous efforts for the two culture zones to truly become one, and finally, be recognized by all Germans that we can become the state representing Germany."
 
