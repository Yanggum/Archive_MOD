 ###### Normal
 GEM_focus_ended_1O_endfocus: "World's Top Academy"
 GEM_focus_ended_1O_endfocus_desc: "The World's Top Academy"
 GEM_the_great_usurper: "The Great Usurper"
 GEM_the_great_usurper_desc: "The Chairman of our academy deserves to be the ruler of all academies. Amidst the giant war, we will usurp the position of student council president for everyone!"
 GEM_war_materiel_system: "War Materiel System"
 GEM_war_materiel_system_desc: "For a world-class war, we must have a world-class system. We will build an eternal wartime state, plundering and annexing all surrounding nations. What questions could possibly be needed? We did it because we could. And we will be able to do even more."
 GEM_prefect_hegemony_raid: "Prefect Hegemony Raid"
 GEM_prefect_hegemony_raid_desc: "Gehenna's unification has been achieved, and the Disciplinary Committee has finally knelt before our blade.\n\nThe true unification of Gehenna is not over yet!"
 GEM_legacy_of_luxembourg: "Legacy of Luxembourg"
 GEM_legacy_of_luxembourg_desc: "The political experiment of Luxembourg has ended, and its incorporation into the Outer Gehenna State has been completed.\n\nNow we will absorb everything they have."
 GEM_secure_trinity_host: "Secure Trinity Host"
 GEM_secure_trinity_host_desc: "The conflict between Trinity and Pandemonium has been completely ended. To end future conflicts as well, [ROOT.GetLeader] must rise to the position of Host of Trinity.\n\nOur own Eden Treaty has been completed!"
 GEM_declare_student_council_president: "Declare Student Council President"
 GEM_declare_student_council_president_desc: "The leaves have fallen and the General Student Council has come into our hands. Naturally, shouldn't our dignified Gehenna Student Council replace their incompetent leadership and annex all of Kivotos's legitimacy?\n\nLong live General Student Council President [ROOT.GetLeader]!"
 GEM_secure_millennium_president: "Secure Millennium President"
 GEM_secure_millennium_president_desc: "Millennium, another of the Big Three academies, has also fallen before our sword. Naturally, we will annex everything of theirs, and their technology will be used for war.\n\nWe are the ones holding the Seminar now!"
 GEM_king_of_kings: "King of Kings"
 GEM_king_of_kings_desc: "The Chairman of Pandemonium and the rightful unifier of Gehenna, the Ruler of Luxembourg, the Host of Trinity, the President of Millennium, the General Student Council President of Kivotos, the Student Council President of all students, and the Ruler of all Europe, [ROOT.GetLeader]."
 GEM_king_of_kings_tt1: "Effect upon completion of §Y$GEH_guardian_of_entire_gehenna$§! focus:"
 GEM_king_of_kings_tt2: "Effect upon completion of §Y$GEH_german_cultural_hegemony_struggle$§! focus:"
