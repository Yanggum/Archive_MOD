 GEM_prepare_for_the_next_blockade_ww: "전국가적 고립 대비"
 GEM_prepare_for_the_next_blockade_ww_desc: "우리 국가가 다른 국가와의 전쟁에 돌입한다면 수 많은 외교관계가 변화하고, 단절될 것입니다. 독일의 영토 위에서 벌일 결전을 철저하게 준비한다면, 외교적 고립은 우리에게 거의 영향을 끼치지 못할 것입니다."
