 GEH_hot_spring_cooperation_tt: "국민정신 없이도 §Y온천개발부§!의 활동이 보장됨"
#
 GEH_present_situation:0 "현 상황 파악"
 GEH_present_situation_desc:0 "이 급작스러운 사태에 대해 그 누구도 아직까지 상황을 인식하지 못한 상태입니다. 그렇다면, 상황부터 파악하는 것이 급선무일 것입니다."
 GEH_nego_with_wehrmacht:0 "국방군과의 협상"
 GEH_nego_with_wehrmacht_desc:0 "이 세계의 지금 우리가 서 있는 이 땅에 존재했었던 국가라고 하는 독일의 무력집단인 국방군에게서 협상 제의가 들어왔습니다. 이를 받아들여, 현지인과의 조율을 통해 이 난국을 타파하여야 합니다."
 GEH_nego_continue:0 "협상 지속"
 GEH_nego_continue_desc:0 "만마전은 훌륭하게 협상을 이어나가고 있습니다. 이대로 계속 협상을 지속합시다."
 GEH_dark_nego:0 "암약"
 GEH_dark_nego_desc:0 "만마전은 무능한 집단입니다. 국방군 또한 저들과 협상하는 것보다는 선도부와 협상하는 것이 더 유익할 것이라고 생각하고 있을 겁니다. 그들과 접선해 봅시다."
 GEH_nego_settlement:0 "협상 타결"
 GEH_nego_settlement_desc:0 "국방군과의 협상은 성공적이었습니다. 그 협상이 무슨 협상이든 말입니다."
 GEH_establish_governance:0 "권력 확립"
 GEH_establish_governance_desc:0 "선도부의 독단적인 거부는 명백히 우리 만마전을 무시하는 행위입니다. 우리는 저들에게 권력의 주인이 누구인지 똑똑히 알려줄 떄입니다."
 GEH_establish_new_government:0 "신정부 수립"
 GEH_establish_new_government_desc:0 "무능한 지도자를 몰아내었으니 이제 새로운 정부를 구성할 떄입니다."
 GEH_end_of_crisis:0 "위기 종결"
 GEH_end_of_crisis_desc:0 "일단 큰 위기는 넘겼으니 이제 다른 곳으로 눈을 돌릴 여유가 생겼습니다."
 GEH_look_situaition:0 "상황 직시"
 GEH_look_situaition_desc:0 "내홍은 어느정도 해결되었지만 국제정세는 우리에게 그다지 우호적이지 않습니다. 심지어 해결되었다는 내홍도 어느정도 해결되었을 뿐 여전히 존재하고 있습니다. 우리는 이런 상황에서 눈을 돌리지 말고 현실과 마주해야 합니다."
 GEH_look_inside:0 "내부를 바라보다"
 GEH_look_inside_desc:0 "내홍은 여전하며 해결해야 할 문제도 산적해 있습니다. 그 현실을 직시해야 합니다."
 GEH_look_outward:0 "외부를 바라보다"
 GEH_look_outward_desc:0 "동서남북 사면으로 잠재적 적성세력에 둘러싸인 우리의 입지는 영 좋지 않습니다. 이 상황을 직시하고, 우리의 대외정책에 관해 심도 있는 논의가 필요합니다."
 GEH_one_step_closer:0 "한발 먼저 다가서기"
 GEH_one_step_closer_desc:0 "우리가 먼저 마음을 열고 이 살얼음판같은 분위기를 녹이고자 노력한다면 분명히 저들도 성심성의껏 협조할 것입니다. 아마도요."
 GEH_clear_method:0 "깔끔하고 확실한 방법"
 GEH_clear_method_desc:0 "국제정치는 야생이고, 그 야생에서 살아남는 방법은 이미 증명되어 있습니다. 바로 철저히 자국의 국익을 위해 움직이는 것입니다. 우리에게는 힘이 있고, 이 힘을 적극적으로 사용해야 합니다."

 GEH_perfactteam_lute:0 "전투개시!"
 GEH_perfactteam_lute_desc:0 "만마전과 선도부는 결국 돌아올 수 없는 강을 건넜습니다.\n이번 싸움을 통해 누가 진정한 게헨나의 주인인지 확실히 알게 될 것입니다."
 GEH_nego_countiune_manmajun:0 "감도는 전운"
 GEH_nego_countiune_manmajun_desc:0 "협상이 시작되며 국방군과의 평화가 찾아오는가 싶었지만 만마전의 생각과는 조금씩 다른 방향으로 상황이 흘러가고 있습니다.\n생각해보니, 우리가 서 있는 현재의 게헨나 땅이 원래 독일의 땅이었다는 말이 있었습니다.\n과연 그들은 자신의 땅이 사실상 빼앗긴 상태에서 우리를 가만히 둘까요?"
 GEH_dark_nego_hina:0 "선제 쿠데타 준비"
 GEH_dark_nego_hina_desc:0 "만마전은 항상 우리 선도부를 눈엣가시로 생각하고 있었습니다.\n국방군과 협상을 시작한 지금, 어떤 일이 닥쳐올지 모릅니다.\n우리가 먼저 준비해야 합니다." 
 GEH_nego_settlement_new:0 "협상 종결"
 GEH_nego_settlement_new_desc:0 "게헨나 학원과 독일 국방군 간의 협상은 종결되었습니다.\n협상 중에 여러 사건이 터져나왔지만 말이죠.\n과연 어떤 결과가 우리를 반겨줄까요?"
 GEH_manmajun_takeover:0 "권력 확립"
 GEH_manmajun_takeover_desc:0 "선도부의 독단적인 거부는 명백히 우리 만마전을 무시하는 행위입니다. 우리는 저들에게 권력의 주인이 누구인지 똑똑히 알려줄 떄입니다."

### 게헨나 이벤트 ###

 GEM_balance_of_power_event.1.t: "[ROOT.GetLeader] 만마전 의장 축출!"
 GEM_balance_of_power_event.1.desc: "오늘 [ROOT.GetLeader]가 만마전 내에서 요구한 불신임 투표에서 살아남는 데 필요한 표를 확보하지 못한 것으로 나타났습니다.\n\n만마전의 지도력에 의심을 받으며 새롭게 치뤄진 학생회장 선거에서 [ROOT.GetLeader.GetHerHis] 약속을 깨뜨림으로써 많이 감소했습니다. 이러한 정치적 실수는 정치적 위기로 확대되어 [ROOT.GetLeader.GetSheHe]가 이제 희생양이 되었습니다."
 GEM_balance_of_power_event.1.a: "하누마 마코토는 아직 할 일이 있다."
 GEM_balance_of_power_event.1.b: "쿄고쿠 사츠키는 믿을 만한 선배다."
 GEM_balance_of_power_event.1.c: "나츠메 이로하는 만마전에 도움이 된다."
 GEM_balance_of_power_event.1.d: "모토미야 치아키는 야망이 있다!"

 GEM_balance_of_power_event.2.t: "여전히 신뢰받는 의장"
 GEM_balance_of_power_event.2.desc: "오늘 만마전 내에서 예정되었던 불신임 투표는... 어째서인지 시작되기도 전에 끝났습니다. 투표를 요구했던 이들은 어째서 그런 어리석은 생각을 했는지 기억조차 하지 못하는 듯하며, 모든 학생들은 한 치의 의심도 없이 쿄고쿠 사츠키의 지도력을 절대적으로 신뢰하고 있습니다.\n\n[ROOT.GetLeader]에 대한 반대는 처음부터 존재하지 않았던 것처럼 보입니다. 마치 그것이 이 세상의 유일한 진실인 것처럼, 모두가 '원래부터' 그래왔다고 믿고 있습니다. 혼란은 없었습니다. 오직 고요한 확신만이 만마전을 가득 채울 뿐입니다."
 GEM_balance_of_power_event.2.a: "내가... 뭔가 착각하고 있었나...?"

 GEM_balance_of_power_event.3.t: "자연스러운 교체"
 GEM_balance_of_power_event.3.desc: "만마전의 의장 [ROOT.GetLeader]의 입지는 굳건해 보였습니다. 적어도 오늘 아침까지는요. 복도를 걷던 학생들은 문득 깨달았습니다. 왜 우리가 [ROOT.GetLeader]을 따르고 있었지? 게헨나의 학생회장은, 처음부터 쿄고쿠 사츠키가 아니었던가?\n\n의문은 순식간에 확신으로 변했습니다. [ROOT.GetLeader]은 이제 그저 한 명의 평범한 학생으로 보일 뿐이며, 모두의 시선은 자연스럽게 진정한 지도자인 쿄고쿠 사츠키에게 향하고 있습니다. 마치 오랫동안 잘못 끼워져 있던 단추를 바로잡은 것처럼, 모든 것이 제자리를 찾은 듯합니다."
 GEM_balance_of_power_event.3.a: "이제야 모든 것이 올바르게 느껴진다."

 GEM_balance_of_power_event.101.t: "가장 위대한 학원의 결정"
 GEM_balance_of_power_event.101.desc: "지금까지의 게헨나 학원은 혼돈 뿐인 학원이라며 트리니티의 혐오, 밀레니엄과 총학생회의 멸시를 받아올 뿐이었습니다. 그러나, 지금부터는 다를 것입니다.\n\n오늘 저녁 8시, 의장 [ROOT.GetLeader] 의장은 연단에서 '가장 위대한 학원을 향한 약진' 법안을 의결하며 호소했습니다. 게헨나 학원은 이제 모든 면에서 달라야 한다고! 게헨나 학원은 옛 영광을 되찾고 키보토스 전체를 지배해야 할 운명이 분명하다고!\n\n그리하여 게헨나의 신 질서는 세계를 향해 뻗어나갈 것입니다. 위대한 길 끝에는 위대한 결과가 남을 것이 분명하기에! [ROOT.GetLeader.GetHerHis] 통치 아래에 모든 학원을 박살 내버릴 전면적인 군사적 재편과 학도 동원령이 시작되고 있습니다."
 GEM_balance_of_power_event.101.a: "우리는 모든 것을 지배할 것이다!"

 GEM_balance_of_power_event.102.t: "계몽"
 GEM_balance_of_power_event.102.desc: "게헨나 학원의 관료들은 언제부턴가 평화를 추구하고, 상호 간의 충돌보다는 만마전의 통치에 순응하며 혼란을 줄이는 방향으로 동작하고 있습니다.\n\n분명, 이는 우리의 의장 [ROOT.GetLeader]의 뛰어난 치세 덕분이겠죠. 모두가 그렇게 믿고 따른다면 그것은 이루어질 것입니다. [ROOT.GetLeader] 의장은 새로운 법안을 공표하며 게헨나 학원은 이제 온정과 협동 속에 다시 태어날 것이라는 내용의 연설을 담담하게 읊어 나갔습니다.\n\n게헨나의 일반 학도들과 시민들은 *급진적으로* 변화하는 게헨나의 사회 문화에 대해 의아함을 가지고 있으나... 이내 그 의심은 종식될 것입니다. [ROOT.GetLeader.GetHerHis] 당신을 지켜보고 있습니다. 언제 어디에서나요."
 GEM_balance_of_power_event.102.a: "이내 모든 혼란은 사라졌다."

 GEM_balance_of_power_event.103.t: "게헨나 합중국 헌법"
 GEM_balance_of_power_event.103.desc: "우리 합중국의 국민은 이문화의 온건적 융화와 공동의 정의를 확립하고 게헨나 전체의 공동방위를 확립하기 위해 게헨나 합중국 헌법을 제정한다.\n\n\n1. 게헨나 합중국은 연방공화국이다. 게헨나 합중국의 의결은 연방의회를 통해 이루어진다. 연방의회는 상원과 하원으로 구성된다.\n\n2. 게헨나 합중국은 옛 게헨나 학원과 독일국의 국체를 계승한다.\n\n......"
 GEM_balance_of_power_event.103.a: "결실을 맺다."

 GEM_news.1.t: "[HYA.GetNameDef]에서의 독일의 영향"
 GEM_news.1.desc: "최근 \"독일 영향권\" 내 국가 간의 친선에 대해 말하자면, 오늘 [From.GetLeader]의 연설에서 [HYA.GetNameDef](와)과 정치 및 외교 협력에 헌신하겠다고 [From.GetName](은)는 발표했습니다. 상당한 독일어권 인구로, [HYA.GetNameDef](은)는 [From.GetAdjective] 이익에 자연스럽게 파트너로 정했습니다. \n\n불확실하지만 어느 정도는 [HYA.GetNameDef](이)가 협력하자고 말하고, 적어도 그들의 국경은 [GEM.GetNameDef]의 영토 야심으로부터 안전하게 보장됩니다."
 GEM_news.1.a: "게헨나와의 우호는 게헨나에 의한 통치보다 낫다."
 GEM_news.1.b: "백귀야행은 이제 게헨나와 함께한다."
 GEM_news.1.c: "우리 시대의 평화인가?"

 GEM_news.2.t: "[GEM.GetNameDefCap]의 유럽 지배 선언"
 GEM_news.2.desc: "[GEM.GetNameDef]의 [GEM.GetLeader](은)는 키보토스 전체를 지배하고 온 대륙에 [GEM.GetAdjective]의 패권을 구축할 야심찬 계획을 발표했습니다. 그들은 이것이 신 게헨나 학도들의 마땅한 생득권이며 다시는 외세에 무릎 꿇지 않을 것이라 선언했습니다.\n\n전 게헨나의 모든 군수공장이 새로운 계획에 따라 가동중이며 전 학도들을 향한 동원령이 발효되고 있습니다. 거대한 전쟁이 다가오는 것이 분명합니다."
 GEM_news.2.a: "그들을 박살내야 한다!"
 GEM_news.2.b: "세상은 우리의 것이다!"

 GEM_news.3.t: "[GEM.GetNameDefCap] 내 경악스러운 통치!"
 GEM_news.3.desc: "[GEM.GetNameDef]의 [GEM.GetLeader](은)는 바로 어제까지만 해도 능력 있는 지도자로써 여겨졌습니다. 그러나, 조금 전 쏟아져나오는 보도와 새로 창설된 기관의 활동. 그리고 수많은 검증을 거친 여러 정보 자료에 의하면, [GEM.GetLeader] 의장은 모든 게헨나 관료와 자본가, 그리고 수많은 게헨나 일반 대중을 향한 세뇌 실험을 지속해 온 것으로 밝혀졌습니다!\n\n그들은 이제 숨길 생각이 없습니다. [GEM.GetAdjective]의 '안정적인 통치'를 확고히 할 것임을 명백히 밝히고 있으며, 이는 구 게헨나 학원의 영원한 종식이 분명합니다."
 GEM_news.3.a: "오, 이런, 맙소사."
 GEM_news.3.b: "그런 신문은 게헨나에선 발간된 적 없습니다."

 GEM_news.4.t: "게헨나와 독일의 합중국 선포"
 GEM_news.4.desc: "[GEM.GetNameDef]의 [GEM.GetLeader](은)는 헌법의 개정과 함께 새로 창설된 연방대통령 직위에 취임했습니다. 게헨나와 독일의 국체를 이어받는다고 명시된 헌법은 양 세계 간의 명시적인 연방제 수립이 민주적으로 이루어졌다는 점에서 큰 전환점을 가집니다.\n\n작은 규모의 국가에서 이런 시도가 없었던 것은 아니나, 게헨나 학원과 같이 3대 학원과 같은 열강 규모에서 이러한 변화가 시도된 적은 이번이 처음입니다."
 GEM_news.4.a: "그들을 지켜보자."
 GEM_news.4.b: "합중국 만세!"

 GEM_news.5.t: "장미의 밤"
 GEM_news.5.desc: "연방 전역이 충격에 휩싸였습니다. 지난밤, 연방 보안군은 전국적인 작전을 개시해 주요 민족주의 인사 수백 명을 체포했습니다. 정부 대변인은 긴급 회견을 통해 '다민족 국가 체제를 전복시키려던 쿠데타 음모를 저지했다'고 발표했습니다.\n\n정부는 이번 작전을 '장미의 밤'이라 명명했습니다. '조화로운 정원을 가꾸려면, 증오라는 이름의 가시 돋친 잡초를 뽑아내야 한다'는 것이 공식 설명입니다.\n\n이번 숙청으로 나치당 강경파를 포함한 모든 민족주의 반대 세력은 와해되었습니다. 이로써 나츠메 이로하 대통령의 권력에 도전할 자는 사라졌고, 거리에는 무거운 침묵이 흐르고 있습니다."
 GEM_news.5.a: "질서를 위한 불가피한 희생이었다."
 GEM_news.5.b: "숙청을 숙청으로 해결했군."

 GEM_news.6.t: "모든 강은 바다로"
 GEM_news.6.desc: "오늘, 연방의 정치는 새로운 시대를 맞이했습니다. 만마전, 공산당, 사회민주당, 중앙당을 포함한 모든 게헨나계 및 비 나치 독일계 정당들이, 역사적인 합당을 선언하고 단일 '게르만 인민사회당'으로 통합되었습니다.\n\n초대 당대표로 추대된 힌 옛 만마전 인사는 '소모적인 파벌 싸움을 끝내고, 국가의 모든 역량을 하나로 모으기 위한 결단'이라고 밝혔습니다. 이로써 연방 내의 자유로운 정당 정치는 사실상 종언을 고했습니다.\n\n한때 서로를 향해 총부리를 겨눴을지도 모르는 공산주의자와 보수주의자가, 이제는 하나의 깃발 아래 나란히 서게 되었습니다. 정치적 다양성은 '국가 통합'이라는 거대한 목표 아래 희생되었습니다. 이제 연방에는 거대한 여당과, 그에 맞서는 야당만이 존재할 뿐입니다."
 GEM_news.6.a: "분열은 곧 패배를 의미한다."
 GEM_news.6.b: "처절한 투쟁인가, 또는 그냥 독재인가."

 GEM_news.7.t: "[FROM.GetName] 건국"
 GEM_news.7.desc: "전 세계가 [FROM.GetLeader] 의장의 대국민 세뇌 계획에 경악한 지 얼마 지나지 않았으나, 그녀의 광기는 마침내 현실마저 비틀기 시작했습니다.\n\n만마전이 독일을 장악했을 때부터 감돌던 불길한 예감은 'NK 울트라 계획'의 폭로와 함께 공포가 되었습니다. 그리고 오늘, [FROM.GetLeader] 의장은 독일이라는 국호마저 폐기하고 아리아 신화 속 국가 '툴레'의 재건을 선포하며 공포를 현실로 만들었습니다.\n\n나치 신비주의와 연관된 것으로 보이는 '아리아 민족의 고대 신화'를 전 국민의 정신 속에 강제로 주입하기 시작했다는 정황이 포착되었습니다. 구 독일 영토는 이제 한 사람의 의지에 종속된 '신화 국가'로 변모했으며, 이성과 상식이 통하지 않는 광기 앞에 유럽 대륙은 전례 없는 공포에 휩싸였습니다."
 GEM_news.7.a: "새 민족의 이데아를 향해."
 GEM_news.7.b: "대체 저 안에서 무슨 일이 일어나고 있는 거지?"
 GEM_news.7.c: "이제 저들은 이성의 언어가 통하지 않을 것이다."

 GEM_news.8.t: "[FROM.GetName] 개헌"
 GEM_news.8.desc: "전 세계가 [FROM.GetLeader] 의장의 대국민 세뇌 계획에 경악한 지 얼마 지나지 않았으나, 그녀의 다음 행보는 노골적인 광기 대신, 오히려 더 이해할 수 없는 의문을 자아내고 있습니다.\n\n만마전이 독일을 장악했을 때부터 감돌던 불길한 예감은 'NK 울트라 계획'의 폭로와 함께 공포가 되었습니다. 그러나 오늘, [FROM.GetLeader] 의장은 그 공포를 전쟁이 아닌 '평화'의 형태로 드러냈습니다. 그녀는 '[FROM.GetName]'의 수립을 선포하며, 모든 민족이 화합하는 이상적인 공동체를 만들겠다고 발표했습니다.\n\n'상호 이해와 공감'을 증진시킨다는 명분 아래, 연방 공화국 전역에서는 'NK 울트라'가 본격적으로 가동되기 시작했다는 정황이 관측됩니다. 유럽 대륙은 이것이 거대한 기만극의 서막일지도 모른다는 불안감 속에서 지켜보고 있습니다."
 GEM_news.8.a: "유려한 합창 속에서."
 GEM_news.8.b: "저 미소 띤 얼굴들 뒤에 무엇이 숨겨져 있을지 두렵군."
 GEM_news.8.c: "가장 아름다운 모습으로 위장한 독재다."

 GEM_event.1.t: "철혈 조약"
 GEM_event.1.desc: "판데모니움 소사이어티은 두 세계의 충돌이라는 거대한 상황 속에서 키보토스 전역을 수호하고, 상호 연대와 반지구적 가치를 내거는 조약을 발의하였습니다. 이 조약을 체결함으로써 우리는 지구 주요 강대국의 위협에 관한 정보를 공유하고 그러한 위협에 맞선 긴밀한 협력을 하는 데에 동의하게 됩니다."

 GEM_event.2.t: "폴란드를 위한 단치히"
 GEM_event.2.desc: "바르샤바의 대통령궁에 예상치 못한 손님이 찾아왔습니다. 게헨나 학원의 판데모니움 소사이어티에서 파견된 외교 사절단입니다. 그들은 놀라운 제안을 들고 왔습니다. 바로 단치히를 포함한 옛 폴란드의 영토를 우리에게 반환하겠다는 것입니다.\n\n물론, 세상에 공짜는 없는 법입니다. 영토를 돌려받는 대가로, 폴란드는 게헨나 학원의 확고한 동맹국이 되어야 합니다. 이는 사실상 우리의 주권을 일부 포기하고 그들의 '정치적 보호' 아래로 들어가는 것을 의미합니다. 외교관들은 이것이 게헨나의 팽창주의적 야욕이라고 비난하지만, 다른 이들은 '대전이' 이후 혼란스러운 유럽의 정세 속에서 강력한 보호자를 얻는 현실적인 선택이라고 주장합니다.\n\n잃어버린 영토를 되찾고 국가를 재건할 절호의 기회일까요, 아니면 새로운 멍에를 짊어지는 길이 될까요? 폴란드의 미래를 위한 중대한 결정의 순간이 왔습니다."
 GEM_event.2.a: "우리는 우리의 영토를 되찾아야만 한다."
 GEM_event.2.b: "독립보다 소중한 것은 없다."

 GEM_event.201.t: "[FROM.GetNameDefCap]의 거래 수락"
 GEM_event.201.desc: "[FROM.GetNameDef]의 [FROM.GetLeader](은)는 [FROM.GetAdjective](이)가 옛 폴란드 영토를 대가로 '정치적 보호'를 제공하는 거래를 수락했습니다. 이제 그들의 정권은 우리 손아귀에 들어왔으며, 폴란드 전체의 자원을 활용할 계획이 수립되어 가고 있습니다!"
 GEM_event.201.a: "이는 [ROOT.GetAdjective]-[FROM.GetAdjective] 간의 상호 우애의 조약이다."

 GEM_event.202.t: "[FROM.GetNameDefCap]의 거래 거절"
 GEM_event.202.desc: "[FROM.GetNameDefCap] 측은 우리의 제안을 거절했습니다. 이는 폴란드 전체를 집어삼키려는 속임수에 불과하다는 걸 이유로 들며 우리의 외교관을 정중하게 쫓아냈으며, 양국 간의 어떠한 종류의 협력도 영원히 불가능할 것이라고 주장했습니다..."
 GEM_event.202.a: "제 발로 명을 재촉하는구나!"
 GEM_event.202.b: "아쉽게 됐군."

 GEM_event.501.a: "이는 게헨나와 독일의 큰 영광이다!"
 probably_lead_to_war_with_GEM_tt:0 "이것은 §Y[GEM.GetNameWithFlag]§!(와)과의 §R전쟁§!으로 비화될 것입니다."

 GEM_event.6.t: "게헨나 학원을 위한 최종 결의안"
 GEM_event.6.desc: "판데모니움 소사이어티가 마침내 선을 넘었습니다. 그들은 게헨나라는 이름을 버리고, 우리가 경멸하고 멸시해왔던 구시대의 망령, '도이체'의 이름을 참칭하기 시작했습니다.\n\n우리 선도부가 대전이 이후 피와 땀으로 바이에른에서 나치의 잔재를 몰아내고 새로운 질서를 세우는 동안, 저들은 권력욕에 눈이 멀어 역사의 죄인들과 손을 잡는 길을 택했습니다. 이것은 단순한 정치적 대립이 아닙니다. 이것은 게헨나의 정체성에 대한 정면 도전이며, 모든 학생들의 미래를 저버리는 배신 행위입니다.\n\n저들이 내건 깃발 아래, 우리의 학생들이 어떤 취급을 받게 될지는 명백합니다. 그들은 힘을 위해 학생들을 '어른들'의 총알받이로 내몰고, 게헨나의 자유로운 정신을 억압적인 구체제의 망령으로 더럽히려 하고 있습니다. 더 이상 대화는 무의미합니다. 타협의 여지도 없습니다. 저 오만하고 부패한 권력 집단이 '도이체 라이히'라는 이름 아래 완전히 자리 잡기 전에, 우리는 행동해야만 합니다.\n\n이것은 선택이 아닌, 역사의 준엄한 명령입니다. 게헨나의 진정한 수호자로서, 선도부는 이제 저 거짓된 제국에 심판의 불길을 내릴 것입니다. 우리의 손으로, 게헨나의 이름을 되찾아야만 합니다."
 GEM_event.6.a: "판데모니움은 선을 넘었다."
 GEM_event.6.b: "묵인해라. 아직 동맹이 필요하다."

 GEM_event.601.t: "게헨나 학원을 위한 최종 결의안"
 GEM_event.601.desc: "존경하는 동지들이여,\n\n판데모니움 소사이어티는 게헨나의 이름을 버리고 역사의 죄악과 손을 잡았습니다. 우리 선도부는 이 배신을 결코 용납할 수 없으며, 저들의 광기가 키보토스 전역으로 퍼져나가는 것을 막기 위해 '반나치동맹'의 깃발을 들었습니다.\n\n이것은 게헨나만의 투쟁이 아닙니다. 되살아난 망령에 맞서 싸우는, 키보토스 전체의 정의를 위한 싸움입니다.\n\n부디 우리와 함께 이 신성한 투쟁에 동참하여, 질서와 정의가 승리한다는 것을 증명해주십시오. 당신들의 결단을 기다리겠습니다."
 GEM_event.601.a: "물론, 그들은 선을 넘었다."
 GEM_event.601.b: "편지는 소각되었다."

 GEM_event.602.t: "게헨나 학원을 위한 최종 결의안"
 GEM_event.602.desc: "동포에게 총부리를 겨눠야 하는 순간만큼 비극적인 것은 없다.\n\n하지만, 판데모니움 소사이어티는 스스로 그 길을 택했다. 그들은 게헨나의 명예를 더럽히고, 우리가 맞서 싸워온 적들과 하나가 되었다. 우리가 주었던 마지막 기회의 시간은 끝났다. 외교적 해결을 위한 모든 노력은 수포로 돌아갔으며, 이제 남은 것은 오직 힘에 의한 심판뿐이다.\n\n최후통첩의 시계는 계속 움직이며, 모든 준비는 끝났다. 이제 우리의 결의를 행동으로 증명할 시간이다."
 GEM_event.602.a: "결단의 시간이다."

 GEM_event.603.t: "게헨나 학원을 위한 최종 결의안"
 GEM_event.603.desc: "반나치동맹 총사령부로부터의 전문이다.\n\n판데모니움 소사이어티를 향한 최후통첩 기한이 만료되었음을 선언했다.\n\n모든 동맹군은 전투 준비에 돌입하라. 곧 전면전 개시 명령이 하달될 것이다. 맹세에 따라, 우리의 부름에 응답할 준비를 하라."
 GEM_event.603.a: "결단의 시간이다."

 GEM_event.604.t: "게헨나 학원을 위한 최종 결의안"
 GEM_event.604.desc: "반나치동맹은 결성되었고, 전선은 그어졌다. 판데모니움 소사이어티의 배신은 이제 돌이킬 수 없는 현실이다.\n\n그들이 거짓된 '독일국'의 기치 아래 세력을 규합하고 전열을 가다듬을 시간을 주어서는 안 된다. 우리의 결단이 늦어질수록, 우리가 치러야 할 희생만 커질 뿐이다.\n\n이제 행동에 나서야 할 때가 되었다. 더 이상의 지체는 없다. 우리는 최후통첩을 준비하고, 다가올 결전을 위한 마지막 준비 단계에 돌입할 것이다. 시계가 움직이기 시작했다."
 GEM_event.604.a: "결단의 시간이다."

 GEM_event.605.t: "구체제의 망령들"
 GEM_event.605.desc: "게헨나 반대파들이 마침내 광기의 선을 넘었습니다. 그들은 '반나치동맹'이라는 허울 좋은 이름 아래, 공공연히 우리 만마전에 대항하는 군사 동맹을 결성했습니다.\n\n이것은 명백한 반역 행위이자, 게헨나를 내전의 화염 속으로 밀어 넣으려는 용납할 수 없는 도발입니다. 저 순진한 이상주의자들은 '정의'와 '질서'를 외치지만, 그들의 행동이 가져올 것은 오직 파괴와 분열뿐입니다. 현실을 직시하지 못한 채 낡은 명분에만 매달리는 그들이야말로 게헨나의 가장 위험한 적입니다.\n\n우리 만마전은 게헨나의 생존과 번영을 위해 필요한 결정을 내렸을 뿐입니다. 저들의 오만한 독선은 더 이상 묵과할 수 없는 수준에 이르렀습니다. 그들이 전쟁을 원한다면, 기꺼이 응해줄 것입니다. 모든 만마전의 동지들이여, 다가올 투쟁에 대비하십시오. 게헨나의 진정한 주인이 누구인지, 저 어리석은 반란군에게 똑똑히 가르쳐줄 시간이 다가오고 있습니다."
 GEM_event.605.a: "전쟁이 다가온다."

 GEM_story.1.t: "의장 나츠메 이로하"
 GEM_story.1.desc: "\"나츠메 의장님의 위대한 결단으로 마침내 독일 주 정부가 우리 판데모니움 소사이어티의 품으로 들어왔습니다! 이야, 이거야말로 '주간 만마전' 1면을 장식할 엄청난 기삿거리라고요!\"\n\n치아키는 취재 수첩을 흔들며 방방 뛰었지만, 정작 의장석에 앉아 있던 이로하는 산더미 같은 서류를 보며 한숨을 내쉬었다.\n\n\"하아... 위대한 결단은 무슨. 그냥 해야 할 일을 한 것뿐이에요. 이제부터가 진짜 귀찮은 일의 시작이라고요. 그 많은 서류들을 다 검토하고, 현지 관료들을 우리 쪽으로 포섭하려면... 생각만 해도 머리가 아프네요.\"\n\n그때, 의장실 구석 소파에 앉아 팔짱을 낀 채 불만스럽게 입을 삐죽이던 마코토가 끼어들었다.\n\n\"흥! 고작 지방 정부 몇 개를 손에 넣었다고 이리 호들갑이라니. 이 마코토 님이 의장이었을 때는 키보토스 전체 정복을 위한 원대한 계획을...\"\n\n마코토는 잠시 헛기침을 하더니, 이내 특유의 웃음소리를 내며 말을 이었다.\n\n\"...하지만, 키키킥. 저항하는 놈들을 힘으로 짓누르는 대신, 행정 체계를 통째로 흡수해서 저항할 힘 자체를 빼앗아 버린다라... 꽤나 재미있는 발상이 아닌가! 이로하, 네 녀석이 그런 머리를 쓸 줄이야! 과연 이 마코토 님이 한때나마 신임했던 부하다!\"\n\n전혀 칭찬 같지 않은 칭찬에 이로하는 관자놀이를 짚었다. 치아키는 그 모습마저 놓치지 않겠다는 듯 셔터를 눌러댔다. 독일 주 정부를 인수한 것은 분명 큰 성과였다. 하지만 그 성과 뒤에 따라올 행정 업무의 무게를 생각하니, 이로하는 벌써부터 퇴근 후의 달콤한 휴식과 게임이 그리워질 뿐이었다."
 GEM_story.1.a: "그래도 인수가 끝나면 제가 할 일은 줄겠죠?"
 value_GEM_state_government_takeover_tt: "§g이 중점을 완료한 경우 §Y주 정부 인수§! 결정이 완료되는 시간이 단축됩니다.§!"

 GEM_story.2.t: "본격적인 데뷔"
 GEM_story.2.desc: "\"컷! 좋습니다! 아주 좋아요! 이부키 쨩, 방금 그 미소, 정말 최고였어요! 전 게헨나의 마음을 사로잡을 역사적인 장면이 탄생했다고요!\"\n\n치아키 의장의 활기찬 목소리가 촬영장에 울려 퍼졌다. 촬영장의 모든 스태프들이 숨을 죽인 채 모니터를 바라보고 있었고, 화면 속에는 게헨나의 깃발을 배경으로 환하게 웃는 이부키의 모습이 담겨 있었다.\n\n\"와아~! 이부키, 잘했어? 칭찬해줘! 그럼 이제 간식 먹어도 돼~?\"\n\n메이크업을 수정받던 이부키가 해맑게 외치자, 간이 의자에 앉아 시나리오를 검토하던 이로하가 한숨을 쉬었다.\n\n\"하아... 이제 겨우 한 장면 끝났을 뿐인데요. 앞으로 찍어야 할 분량이 산더미라고요, 의장님. 이대로 가다간 밤새워도 모자라겠어요...\"\n\n그때, 촬영장 한구석에서 이 모든 광경을 지켜보던 하누마 마코토가 만족스럽다는 듯 웃으며 끼어들었다.\n\n\"키키킥! 역시 이 마코토 님이 이부키의 스타성을 일찍이 간파하고 곁에 둔 보람이 있군! 이부키의 귀여움을 프로파간다에 활용하자는 나의 천재적인 발상을, 치아키 네가 제법 잘 실현하고 있구나!\"\n\n마코토의 말에 치아키는 아랑곳하지 않고 웃으며 답했다.\n\n\"아하핫, 다들 기운 내자고요! 이부키 쨩의 CF는 우리 게헨나의 새로운 상징이 될 겁니다! 자, 다음 컷 준비해주세요!\""
 GEM_story.2.a: "꽤나 잘 팔렸다고 한다."

 GEM_iroha_story.1.t: "합중국의 오늘"
 GEM_iroha_story.1.desc: "나츠메 이로하는 처음에는 자신이 만마전의 새로운 의장으로 선출될줄은 전혀 생각지도 못하고 있었다. 언제나처럼 만마전의 행정이나 하면서 종종 ...초무적철갑 토라마루라는 마코토가 지어준 부끄러운 이름의 전차를 몰고 다니는 생활이 이어질 줄 알았다.\n\n그러나 대전이 이후 급변한 상황은 나츠메 이로하를 만마전 의장의 자리까지 올려놓았으며, 나츠메 이로하가 자신의 할 일을 줄이고, 조금 더 나은 게헨나를 만들기 위해 시도한 일들은 그녀를 합중국의 초대 대통령으로 만들었다.\n\n\"하아, 어쩌다 이렇게 되어버린 걸까요. ...그렇다고 해도 이제 물러설 순 없지만요.\"\n\n새롭게 지어진 대통령실에 입주한 만마전의 의장이자, 독일인을 위한 자비로운 지도자, 그리고 이제는 합중국의 대통령인 나츠메 이로하는 한숨을 내뱉으면서도, 평소보다는 조금 더 결심할 수밖에 없었다.\n\n이제는 자신에게 의지하는 사람이 많으니까. 그리고, 이미 너무 먼 길을 걸어왔으니까."
 GEM_iroha_story.1.a: "커피 한 잔의 여유."

 GEM_iroha_story.2.t: "연방기본법"
 GEM_iroha_story.2.desc: "의사당의 공기는 무겁고, 시간은 끈적하게 흘러갔다. 나츠메 이로하는 차라리 이 모든 걸 박차고 나가 토라마루의 조종석에서 낮잠을 자고 싶다고 생각했다. 연방기본법. 지난 몇 달간, 수십 명의 관료들이 달라붙어 단어 하나하나를 저울질했던, 지독하게 따분한 과정의 최종 결과물이었다.\n\n전쟁이나 분쟁은 차라리 간단했다. 눈앞의 적을 쓰러뜨리면 그만이었으니까. 하지만 평화는… 끝없는 서류와 회의, 그리고 책임의 연속이었다. 하누마 마코토 의장님은 어째서 이런 피곤한 일을 즐기셨던 걸까. 이로하는 도무지 이해할 수 없었다.\n\n\"하아… 어른들의 세계란 건 왜 이렇게 피곤하게 돌아가는 걸까요.\"\n\n그녀의 작은 한숨은 장엄하게 울려 퍼지는 법안 낭독 소리에 묻혀 사라졌다. 연방의 권한, 주의 자치, 시민의 권리. 분명 중요한 내용들이었지만, 이로하에게는 그저 잠을 부르는 주문처럼 들릴 뿐이었다. 며칠 밤을 새워 검토했던 조항들이라 더더욱 그랬다.\n\n마침내, 의사봉이 내리쳐지고 법안은 통과되었다. 의원들의 박수갈채가 쏟아졌지만, 이로하의 귀에는 그 소리가 마치, 앞으로 자신을 옭아맬 거대한 서류 더미의 첫 페이지가 넘어가는 소리처럼 들릴 뿐이었다. 쉼터의 푹신한 방석이 아득하게 멀어지는 기분이었다."
 GEM_iroha_story.2.a: "그래도, 이거로 제가 할 일이 좀 줄어들었겠죠."

 GEM_iroha_story.3.t: "두 번째로 귀찮은 선택"
 GEM_iroha_story.3.desc: "푹신한 방석, 갓 내린 커피의 향기, 그리고 손에 쥔 게임기. 나츠메 이로하에게 허락된 짧은 평화는 책상 위에 놓인 서류 한 장 때문에 위태로웠다. '연임 의사 확인서'. 간결하지만, 그 어떤 결재 서류보다도 무거운 단어들이었다.\n\n이 서류에 서명하지 않는다면, 이 모든 지긋지긋한 책임에서 벗어날 수 있었다. 토라마루와 함께하는 느긋한 오후, 누구의 방해도 받지 않는 낮잠. 생각만 해도 달콤한 미래였다.\n\n하지만… 그 뒤에 찾아올 혼돈은? 자신이 쌓아 올린 이 어설픈 평화가 무너지고, 다시 파벌 싸움과 이전투구가 시작된다면… 그 뒷수습은 지금보다 몇 배는 더 귀찮을 터였다. 하아, 어른들의 세계란 왜 이렇게 피곤하게 돌아가는 걸까.\n\n결국 그녀는 가장 귀찮은 선택지를 피하기 위해, 두 번째로 귀찮은 선택지를 고르기로 했다. 길고 깊은 한숨과 함께, 나츠메 이로하는 펜을 들어 자신의 이름을 적어 넣었다. 다음 선거 출마를 공식화하는 순간이었다.\n\n\"…과연, 잘한 일이려나요.\"\n\n나직한 혼잣말은 조용한 집무실의 공기 속으로 흩어졌다. 선거는 아직 한참 남았다. 적어도 오늘은, 조금 더 농땡이를 부려도 괜찮겠지."
 GEM_iroha_story.3.a: "아무튼, 오늘은 여기까지."

 GEM_reelection_decision_leader_desc: "나츠메 이로하는 스스로가 이 자리에 올 것이라고는 전혀 생각지도 못했습니다. 언제나처럼 만마전의 행정이나 하면서 종종 ...초무적철갑 토라마루라는 마코토가 지어준 부끄러운 이름의 전차를 몰고 다니는 생활이 이어질 줄 알고 있었죠. 그러나, 대전이가 불러온 거대한 혼란 속에서 나츠메 이로하는 만마전의 의장이 되었고. 이제는 초대 대통령이자, 건국자가 되었습니다.\n\n이런 나츠메 이로하는 자신이 은퇴하면 벌어질 혼란이나, 후계자 선정의 머리 아픔을 회피하기 위해. 또는 책임감에 의해서 재선을 결정했습니다.\n\n이제 그녀는 누가 뭐라 하더라도 굳건한 인민의 대통령이자, 가장 위대한 게헨나인으로 선출될 몇 안 되는 인물 중 한 명으로 남을 것입니다.\n\n\"...귀찮다는 말도, 이제는 슬슬 귀찮네요.\""

 GEM_iroha_story.4.t: "거성의 은퇴"
 GEM_iroha_story.4.desc: "고요한 밤, 대통령 집무실의 불은 아직 꺼지지 않았다. 나츠메 이로하는 텅 빈 커피 잔을 내려다보며, 창밖으로 펼쳐진 도시의 야경을 말없이 바라보았다. 끔찍할 정도로 시끄럽지도, 그렇다고 숨 막히게 조용하지도 않은… 딱 적당한 소음. 그녀가 원했던 평화는 이런 모습이었다.\n\n지긋지긋한 책임의 연속이었다. 하지만, 이제는 정말로 끝이었다. 연방은 안정되었고, 자신이 없어도 어떻게든 굴러갈 최소한의 시스템은 마련되었다. 이만하면… 충분하겠지요.\n\n그렇게 생각하는 순간, 몇 년간 어깨를 짓누르던 강철 갑옷이 먼지처럼 부서져 내리는 듯한 해방감이 밀려왔다. 토라마루의 푹신한 조종석, 자신만의 아늑한 쉼터. 그토록 그리워했던 일상이 마침내 손에 잡힐 듯 가까워졌다.\n\n물론, 마지막으로 처리해야 할 가장 귀찮은 서류가 하나 남아있었다. 자신이 떠난 뒤의 혼돈을 막기 위해, 자신의 뒤를 이을 후계자를 지명하는 것. 그것이 합중국의 대통령으로서, 그리고 나츠메 이로하로서의 마지막 책무였다."
 GEM_iroha_story.4.a: "요자쿠라 키라라는 최근 의원으로 재선도 성공했다죠."
 GEM_iroha_story.4.b: "하타미 에리카라는 대안도 훌륭한 것 같네요."

 GEM_iroha_story_a_leader_desc: "요자쿠라 키라라는 게헨나 학생이자 동아리 반짝반짝부의 부장이었습니다. 대전이 이후 급변한 사태 속에서도 일상을 지키려 노력하던 그녀는 나츠메 이로하의 개혁 속에, 정치에 관심을 가지기 시작했습니다.\n\n나츠메 이로하가 만들어가는 반짝이는 세계에 매료된 키라라는 연방을 위해 정치를 시작했으며, 게헨나계 신입 의원으로써 주 정부에서 선출되었습니다. 시간이 요자쿠라 키라라는 두각을 드러내는 정치인이자, 민중에게 친근한 이미지로 재선에도 성공했습니다.\n\n나츠메 이로하는 그런 그녀를 자신의 후계자로 지명하고 은퇴하였으며, 이제 요자쿠라 키라라는 나츠메 이로하가 남긴 하나의 작은 세계를 이끌 운명이 되었습니다.\n\n\"반짝이는 게헨나와 독일을 위해!\""

 GEM_iroha_story_b_leader_desc: "하타미 에리카는 게헨나 학생이자 동아리 반짝반짝의 부원이었습니다. 나츠메 이로하의 집권 이후 정치에 관심을 가진 그녀의 친구이자 동아리 부장 요자쿠라 키라라를 따라 정치에 입문한 하타미 에리카는 조금 더 낮은 이들을 대변하는 역할에 흥미를 가졌습니다.\n\n요자쿠라 키라라의 재선을 지켜보며 초선 의원으로 주 정부에서 선출되는데 성공한 하타미 에리카는 요자쿠라 키라라와 비슷한 정치지형, 또는 더 민중과 가까운 이미지로 호감을 사며 당당하게 의회에 데뷔했습니다.\n\n나츠메 이로하는 그런 그녀를 자신의 후계자로 지명하고 은퇴하였으며, 이제 하타미 에리카는 나츠메 이로하가 미처 보지 못한 더 낮은 이들을 위한 정치를 시작할 것입니다.\n\n\"부장한텐 살짝 미안할지도?\""

 GEM_iroha_story.5.t: "독일인권연대 창설"
 GEM_iroha_story.5.desc: "뮌헨의 낡은 시민회관 안, 공기는 조심스러운 기대와 굳은 결의로 가득 차 있었다. 연단에 선 노회한 사회민주당원은 한때 정적이기도 했던 옛 동지들과 이제 막 성인이 된 젊은 학생들을 둘러보며 입을 열었다.\n\n\"과거 우리는 사회민주당원으로, 인민당원으로, 중앙당원으로 흩어져 있었습니다. 서로를 비난하고, 각자의 이익을 위해 싸웠지요. 그러나 오늘 우리는 '독일인'이라는 단 하나의 이름으로 이 자리에 모였습니다.\"\n\n그의 목소리는 낮았지만, 회관의 모든 이에게 똑똑히 들렸다.\n\n\"키보토스 학생들의 오만함과 자본가들의 탐욕 아래 우리의 권리는 짓밟혔습니다. 하지만 우리는 더 이상 침묵하지 않을 것입니다. 그녀가 의도했든 아니든, 나츠메 이로하 대통령이 만든 이 기묘한 질서 속에서, 우리는 비로소 목소리를 낼 작은 틈을 얻었습니다. 우리는 이 기회를 놓치지 않을 것입니다.\"\n\n그의 선언과 함께, '독일인권연대'가 공식적으로 창설되었다. 박수 소리는 크지 않았다. 이것은 승리의 선언이 아니었다. 법의 테두리 안에서, 자신들의 빼앗긴 권리를 되찾기 위한 기나긴 투쟁의 시작을 알리는 조용한 맹세였다."
 GEM_iroha_story.5.a: "우리의 목소리가, 언젠가는 저들에게 닿기를."

 GEM_iroha_story.6.t: "법전 위에 새겨진 희망"
 GEM_iroha_story.6.desc: "라디오에서 흘러나오는 아나운서의 차분한 목소리는, 그 어떤 함성보다도 극적이었다. \"…연방의회 표결 결과, '민족 할당제' 법안은 가결되었음을 선포합니다.\" 잠깐의 정적. 그리고, 독일인권연대 본부에 모여 있던 모든 이들의 얼굴 위로 마침내 억눌려왔던 환호성이 터져 나왔다.\n\n백발이 성성한 노조위원장은 안경 너머로 조용히 눈물을 훔쳤고, 젊은 대학생들은 서로를 부둥켜안고 기뻐했다. 연단에 선 인권연대 의장이 떨리는 목소리로 외쳤다.\n\n\"동지들! 이것은 단순한 법안 통과가 아닙니다! 이것은 우리가 더 이상 이 땅의 이방인이 아님을, 합중국의 동등한 주인임을 증명하는 첫걸음입니다! 우리의 자녀들이 교실에서, 공장에서, 관청에서 부당한 멸시를 받지 않을 권리를, 마침내 우리 손으로 쟁취한 것입니다!\"\n\n물론, 법전 위의 글자가 모든 차별을 하루아침에 지워주지는 않을 것이다. 기득권을 지키려는 키보토스계의 저항은 더욱 거세질지도 모른다. 하지만 오늘, 그들은 불가능해 보였던 벽에 첫 균열을 냈다. 그 자체로 기적과도 같은 승리였다.\n\n오늘만큼은, 이 작은 승리를 마음껏 기뻐하기로 했다. 내일부터, 그들은 더 긴 싸움을 준비해야 하니까."
 GEM_iroha_story.6.a: "성공이다!"

 GEM_iroha_story.7.t: "질서를 위한 선택"
 GEM_iroha_story.7.desc: "오늘, 합중국의 정치 지형은 영원히 바뀌었다. 수많은 논의와 타협 끝에, 게헨나계 주요 정당들은 마침내 하나의 거대한 연합, '게헨나 대연정'의 깃발 아래 뭉쳤다.\n\n연정의 초대 대변인은 기자회견에서 이렇게 선언했다.\n\n\"우리는 더 이상 소모적인 이념 논쟁으로 국력을 낭비하지 않을 것입니다. 이제 합중국의 정치는 명확해졌습니다. 우리 '게헨나 대연정'이 책임 있는 여당으로서 국가를 이끌고, 독일계 정당들은 건전한 야당으로서 우리를 견제하게 될 것입니다.\"\n\n이것은 화합이 아닌, 질서정연한 공존을 위한 차가운 악수였다. 두 민족은 이제 하나의 용광로에서 섞이는 대신, 각자의 영역을 존중하며 국가를 이끌어갈 것이다. 분열의 시대는 끝났다. 두 파벌의 시대가 시작되었다."
 GEM_iroha_story.7.a: "안정이야말로 최고의 가치다."

 GEM_iroha_story.8.t: "신뢰라는 이름의 도박"
 GEM_iroha_story.8.desc: "불과 몇 달 전만 해도, 그 누구도 이런 광경을 상상하지 못했다. 만마전의 깃발과 중앙당의 깃발이 나란히 걸린 연단 위에서, 게헨나계와 독일계 지도자가 마주 섰다. 불신과 반목의 시대를 끝내기 위한 연립정부 출범식. 그것은 하나의 거대한 도박이었다.\n\n두 사람의 손이 맞잡히는 순간, 수많은 카메라 플래시가 터져 나왔다. 연단에 선 중앙당의 노련한 정치인이 떨리는 목소리로 말했다.\n\n\"우리는 불신이라는 손쉬운 길 대신, 신뢰라는 험난한 길을 선택했습니다. 법률 이전에, 이념 이전에, 우리는 같은 하늘 아래 살아가는 이웃입니다. 이 연정은 정치 공학이 아닌, 미래를 향한 약속입니다.\"\n\n회의장을 채운 것은 승자의 환호가 아닌, 새로운 시작을 목격하는 이들의 벅찬 감동이었다. 물론 내일부터는 험난한 현실이 기다리고 있을 것이다. 서로 다른 문화를 이해하고, 뿌리 깊은 편견을 극복하는 것은 결코 쉽지 않을 터였다. 하지만 오늘, 그들은 가장 어려운 첫걸음을 내디뎠다. 이 연약한 불씨가 거대한 화합의 불꽃으로 타오를 수 있을지는, 이제 이들의 손에 달려 있었다."
 GEM_iroha_story.8.a: "하나의 합중국을 위하여."

 GEM_iroha_story.9.t: "또 하나의 악수"
 GEM_iroha_story.9.desc: "게헨나와 독일이 손을 맞잡았던 그날, 많은 이들은 그것을 '기적'이라 불렀다. 하지만 진정한 화합으로 나아가는 길목에는, 아직 넘어야 할 가장 높은 산이 남아있었다. 수백 년간 이어져 온 숙적, 트리니티.\n\n불신과 반목의 역사를 반복하는 대신, 만마전-중앙당 연정은 다시 한번 불가능해 보이는 도박을 선택했다. 바로 트리니티계 정당에게, 연정의 한 자리를 내어주는 것이었다.\n\n오늘, 연단 위에서는 세 사람의 손이 맞잡혔다. 게헨나의 뿔, 독일의 독수리, 그리고 트리니티의 날개가 마침내 하나의 상징 아래 모였다. 기적은 한 번으로 끝나지 않았다. 게헨나와 독일, 그리고 트리니티. 세 민족의 연방은, 불가능을 넘어선 희망이 현실이 될 수 있음을 증명했다."
 GEM_iroha_story.9.a: "새 시대의 '에덴 조약'."

 GEM_iroha_story.10.t: "삼각 구도"
 GEM_iroha_story.10.desc: "게헨나 대연정의 집권과 독일계 정당의 야권 형성. 합중국의 정치는 안정적인 양당 구도 속에서 질서를 찾아가는 듯했다. 하지만, 그 견고해 보이던 구도 위에 새로운 변수가 떠올랐다. 바로 '트리니티'였다.\n\n한때 적이었던 그들은 어느새 무시할 수 없는 정치 세력으로 성장했다. 게헨나 대연정은 어려운 선택의 기로에 섰다. 그들을 계속해서 적으로 둘 것인가, 아니면 체제 안으로 끌어들여 관리할 것인가.\n\n결론은 후자였다. 이제 합중국은 세 개의 거대한 다리가 서로를 지탱하는 삼각의 탁자와 같아졌다. 게헨나, 독일, 그리고 트리니티. 안정적이었던 양당제는 끝났다. 이제부터는, 한 치 앞을 내다볼 수 없는 복잡한 균형의 시대가 시작될 것이다."
 GEM_iroha_story.10.a: "...정적이 하나 늘었군."

 GEM_iroha_story.11.t: "자유라는 이름의 소음"
 GEM_iroha_story.11.desc: "의사당의 샹들리에가 의원들의 고함 소리에 위태롭게 흔들렸다. 이것이 '모든 정치세력을 포괄하는 연방 의회'의 첫 번째 풍경이었다. 한때 불법 단체로 낙인찍혔던 모든 이들이 한자리에 모인 결과는, 질서정연한 토론이 아닌 아수라장이었다.\n\n한쪽에서는 만마전, 사회민주당, 중앙당, 그리고 공산당까지 뒤섞인 '만마전 연정'이 질서를 외쳤고, 맞은편에서는 콧수염을 기른 나치당 의원들이 야유를 퍼부으며 의사 진행을 방해했다.\n\n하지만 이 거대한 소음 속에서, 자신만의 목소리를 내는 이들도 있었다. 미식연구회의 쿠로다테 하루나는 의원석에서 우아하게 홍차를 마시며, '의사당의 음향 설계는 최악이군요. 미식 이전에 기본적인 예의부터 가르쳐야겠습니다'라며 한탄했다. 트리니티에서 온 소수 정당 의원들은 이 광경을 믿을 수 없다는 듯 굳은 표정으로 앉아 있었고, 덴마크계와 소르브계 소수민족 대표들은 거대 정당들의 싸움 속에서 발언 기회를 얻기 위해 고군분투했다.\n\n이것이 과연 우리가 꿈꾸던 자유 민주주의의 모습일까? 대답은 누구도 알 수 없었다. 하지만 한 가지는 확실했다. 독재자의 서늘한 침묵보다는, 이 시끄러운 자유가 훨씬 더 인간적이라는 것을."
 GEM_iroha_story.11.a: "그럼에도, 소음이 모여 음악을 이룬다."

 GEM_iroha_story.12.t: "합의라는 이름의 족쇄"
 GEM_iroha_story.12.desc: "나츠메 이로하는 자신이 어쩌다 여기까지 왔는지, 진지하게 고민했다. 만마전 의장만으로도 충분히 귀찮았는데, 이제는 게헨나계와 독일계 양쪽의 지지를 받는 '공동 선출 지도자'라니. 책상 위에는 게헨나어로 쓰인 보고서와 독일어로 쓰인 보고서가 나란히 놓여, 마치 보이지 않는 국경선처럼 그녀의 두통을 유발하고 있었다.\n\n\"하아… 차라리 마코토 의장님 시절이 편했네요.\"\n\n그때는 적어도 상대해야 할 골치 아픈 대상이 한 종류뿐이었으니까. 하지만 이제는 아니다. 게헨나계의 불만과 독일계의 요구 사이에서 아슬아슬한 줄타기를 해야만 했다. 자신이 한숨 한 번 잘못 쉬면, 이 위태로운 연방은 그대로 무너져 내릴지도 모른다. 그리고 그 뒷수습은… 상상만 해도 끔찍하게 귀찮았다.\n\n토라마루 안에서 마시는 달콤한 커피와 한가로운 낮잠. 그 모든 것이 아득한 과거의 유물처럼 느껴졌다. 그녀는 펜을 드는 대신, 두 종류의 보고서를 책상 한쪽으로 조용히 밀어냈다.\n\n이미 너무 먼 길을 와버렸다. 이제 와서 모든 걸 내팽개치는 쪽이, 훨씬 더 귀찮은 미래를 불러올 것이다. 그녀는 그것을 너무나도 잘 알고 있었다."
 GEM_iroha_story.12.a: "...일단은, 커피부터라도."

 GEM_iroha_story.13.t: "독일의 이야기, 게헨나의 이야기."
 GEM_iroha_story.13.desc: "연방 재건 기념 축제의 연단 위, 나츠메 이로하는 마이크 앞에서 작게 한숨을 쉬었다. 이런 건 역시 제 체질이 아니네요. 하지만 연단 아래, 게헨나의 학생들과 독일인 가족들이 뒤섞여 웃고 떠드는 모습을 보자, 그녀의 입가에 희미한 미소가 떠올랐다.\n\n\"…시끄러운 건 여전하네요. 뭐, 저쪽이든 이쪽이든… 축제를 즐기는 방식은 크게 다르지 않은 것 같고요. 대전이 이후, 참 많은 일이 있었죠. 그래도, 이렇게 다시 일어서서 함께 웃을 수 있게 되었으니, 그걸로 된 거 아닐까요. …아무튼, 다들 즐거운 시간 보내시길. 이상입니다.\"\n\n연설은 그게 전부였다. 하지만 대통령의 짧은 소회는, 행정부의 유능한 관료들과 정치 평론가들에게는 그 이상의 의미로 다가왔다. '대전이'라는 공동의 상처를 딛고 '함께 일어선' 두 민족. 그리고 '크게 다르지 않은' 문화적 동질성. 이 두 가지를 축으로 하는 새로운 무언가가 탄생하는 순간이었다.\n\n이로하 자신은 그저 눈앞의 광경을 말했을 뿐이었지만, 그녀가 무심코 던진 한마디는 이제 연방의 새로운 방향성이 되어가고 있었다."
 GEM_iroha_story.13.a: "뭐, 나쁜 이야기는 아니니까요."

 GEM_iroha_story.14.t: "베테랑 중재자"
 GEM_iroha_story.14.desc: "대통령 집무실의 공기는 팽팽했다. 전게헨나 인민당 대표와 국가사회주의 독일 노동자당 대표가 예산안을 두고 한 치의 양보도 없이 으르렁거리고 있었다. 하지만 나츠메 이로하는 그저 턱을 괸 채, 식어가는 커피 잔을 바라볼 뿐이었다. '또 시작이네요.' 그녀는 속으로 생각했다.\n\n과거의 그녀였다면 이 소음에서 도망치고 싶었을 것이다. 하지만 수많은 회의와 타협을 거치며, 그녀는 이 싸움의 흐름을 읽는 법을 터득했다. 언제 끼어들어야 하는지, 누구의 자존심을 세워주어야 하는지, 그리고 어떤 양보안을 던져야 둘 다 마지못해 물러나는지. 지긋지긋할 정도로 잘 알게 되었다.\n\n양측의 주장이 극에 달했을 때, 그녀가 나직이 입을 열었다. 몇 마디의 질문, 약간의 양보 제안, 그리고 상대방의 다음 수를 꿰뚫어 보는 듯한 한마디. 그녀의 말은 열정적이지 않았지만, 날카롭게 양측의 핵심을 찔렀다. 한 시간 후, 두 대표는 마지못해 합의안에 서명하고 머뭇거리며 집무실을 나섰다.\n\n홀로 남은 이로하는 깊은 한숨을 내쉬었다. 하아… 언제부터 이렇게 귀찮은 일에 익숙해져 버린 걸까요. 그녀는 자신이 유능해지는 것이 전혀 반갑지 않았다."
 GEM_iroha_story.14.a: "내일은 정말로 농땡이 쳐야지…"

 GEM_weimar_presidential_succession_leader_desc: "나츠메 이로하는 자신이 이런 역사적인 인물이 될 것이라고는 전혀 생각지도 못했습니다. 언제나처럼 만마전의 행정이나 하면서 종종 ...초무적철갑 토라마루라는 부끄러운 이름의 전차를 몰고 다니는 생활이 이어질 줄 알았죠. 그러나 대전이가 낳은 혼돈과 파시즘의 광기 속에서, 그녀는 무너진 바이마르 공화국의 마지막 깃발을 짊어지게 되었습니다.\n\n그녀가 대통령직을 계속 수행하는 이유는, 자신이 아니면 이 위태로운 민주주의를 지킬 사람이 없다는 것을 알기 때문입니다. 자유를 지키는 일은, 그녀의 생각보다 훨씬 더 귀찮은 일이었습니다.\n\n이제 그녀는 단순한 게헨나인이 아닌, 혼돈 속에서 독일 민주주의를 구해낸 수호자로 역사에 기록될 것입니다.\n\n\"...민주주의 하지 말껄... 전보다 두 배는 더 피곤하잖아...\""

 GEM_german_fuehrer_succession_leader_desc: "나츠메 이로하는 자신이 국가의 최고 지도자가 될 것이라고는 전혀 생각지도 못했습니다. 언제나처럼 만마전의 행정이나 하면서 종종 ...초무적철갑 토라마루라는 부끄러운 이름의 전차를 몰고 다니는 생활이 이어질 줄 알았죠. 그러나 대전이가 모든 것을 파괴한 폐허 위에서, 그녀는 분열된 민족을 이끌기 위해서는 강력하고 통일된 연방정부가 필요함을 깨달았습니다.\n\n만마전 의장에서 시작된 그녀의 길은, 마침내 '총통'이라는 자리에 이르렀습니다. 그것은 개인적인 권력욕이 아닌, 독일인들의 역사와 강력한 지도자를 향한 열망을 존중하고, 그들의 마음을 얻기 위한 가장 현실적인 선택이었습니다.\n\n그녀가 이 무거운 직책을 수락한 이유는, 자신이 아니면 이 거대한 연방정부라는 기계를 아무도 제대로 다룰 수 없다는 것을 알기 때문입니다. 국가를 운영하는 것은, 그녀가 상상했던 그 어떤 농땡이보다도 복잡한 일이었습니다.\n\n게헨나의 가장 위대한 게으름뱅이는, 역설적으로 독일인과 게헨나인 모두에게 인정받는, 새로운 연방의 최고 지도자가 되었습니다.\n\n\"...모두가 내 말만 듣는 건 편하지만, 전부 내가 정해야 한다는 건, 정말이지, 최악이네요.\""

 GEM_iroha_story.15.t: "역사의 발자국"
 GEM_iroha_story.15.desc: "한때, 두 민족은 서로를 향해 총부리를 겨누었습니다. '게헨나인'과 '독일인'이라는 이름은 넘을 수 없는 벽처럼 보였습니다. 하지만 기나긴 시간과 수많은 타협 끝에 나츠메 이로하의 지도 아래, 두 파벌은 마침내 하나의 합의에 이르렀습니다.\n\n오늘, 연방의회는 '전게헨나 인민당'과 독일계 야당의 만장일치 찬성으로, 헌법 서문에 새로운 문구를 새겨 넣었습니다.\n\n\"이 헌법은 게헨나와 게르만 민족 공동의 발전을 위해 제정한다.\"\n\n짧지만, 그 어떤 선언보다도 무거운 이 한 문장은, 두 민족이 하나의 국가라는 것을 영원히 명문화했습니다. 연단 아래에서 이 역사적인 순간을 지켜보던 나츠메 이로하는, 아주 오랜만에, 진심으로 편안한 한숨을 내쉬었습니다. 그녀가 그토록 바라던, '더 이상 귀찮은 일이 일어나지 않는' 안정적인 국가가 마침내 완성된 순간이었습니다."
 GEM_iroha_story.15.a: "수고하셨습니다."

 GEM_makoto_story.1.t: "게헨나 통일 연설"
 GEM_makoto_story.1.desc: "판데모니움 소사이어티의 깃발 아래 게헨나의 모든 것이 무릎 꿇었습니다. 거리의 마지막 저항 세력이었던 선도부는 무장 해제되었고, 그들의 낡은 정의는 하누마 마코토 의장의 새로운 질서 앞에 자리를 비켜주었습니다. 이제 게헨나는 분열된 과거를 뒤로하고, 진정한 지도자 아래 하나로 뭉쳐 키보토스 전역에 그 위용을 떨칠 준비를 마쳤습니다. 마코토 의장은 통일된 게헨나의 학생들 앞에 서서, 새로운 시대의 개막을 선포합니다.\n\n\"키키킥! 들어라, 나의 사랑하는 게헨나 학생들이여! 오늘, 이 하누마 마코토는 게헨나의 '정당한 통일자'로서 이 자리에 섰다! 오랫동안 우리의 발목을 잡아왔던 낡고 비효율적인 규율, 선도부라는 이름의 잔소리꾼들은 이제 없다! 그들은 진정한 위업의 가치를 이해하지 못하고, 그저 현상 유지를 외치며 나의 원대한 계획을 방해했을 뿐이지!\"\n\n마코토가 숨을 고르자, 광장에 모인 학생들의 함성이 터져 나옵니다.\n\n\"이제 게헨나는 하나의 목소리, 즉 나의 목소리로 말할 것이다! 하나의 의지, 나의 의지로 움직일 것이다! 더 이상 우리를 막을 것은 없다! 이 통일된 힘을 바탕으로, 우리는 키보토스 전체에 만마전의 위대함을 증명할 것이다! 이 몸의 연설을 똑똑히 듣도록! 게헨나의 새로운 시대는 바로 지금, 여기서 시작된다!\"\n\n연설이 끝나자, 마코토는 만족스러운 웃음과 함께 의장실로 돌아왔습니다. 그녀의 뒤를 따르던 이로하가 산더미 같은 서류를 책상에 내려놓으며 깊은 한숨을 내쉬었습니다.\n\n\"하아, 어쩌다 이렇게 되어버린 걸까요. 연설은 멋지셨지만, 이 결재 서류들은 전부 의장님께서 처리하셔야 할 겁니다. 선도부가 사라지니 행정 업무가 전부 이쪽으로 넘어왔거든요.\""
 GEM_makoto_story.1.a: "ㅁ, 뭐라? 그런 복잡한 서류는 훌륭한 관료들이 하는게 당연하지 않나?!"

 GEM_makoto_story.2.t: "외게헨나 통합 연설"
 GEM_makoto_story.2.desc: "키보토스의 무법지대를 상징하던 흥신소 68이 마침내 만마전의 영향력 아래 들어왔습니다. 흥신소68 일당이 도주한건 아쉽긴 하지만, 리쿠하치마 아루 그녀의 정치 실험은 끝을 맺었습니다.\n\n\"키키킥! 과연, 제법 끈질긴 녀석들이었지. 하지만 결국 이 마코토 님의 원대한 계획 앞에 무릎을 꿇었다! 이로써 우리는 게헨나 통일에 기여했다 할 수 있지!\"\n\n마코토가 팔짱을 끼고 거만하게 말하자, 옆에 서 있던 이로하가 입을 열었습니다.\n\n\"하아, 뭔가요. 이 작고, 심지어 우리에게 큰 관심도 없던 땅을 정복하자고 그 소란을 피웠다니… 네네. 부탁받은 이상 보고서는 정리해두겠습니다만, 다음부터는 좀 더 정당한 상대를 골라주시겠어요?\"\n\n\"키키킷! 이로하, 아직 모르는군! 사소한 무질서야말로 거대한 질서를 좀먹는 법! 이 몸은 키보토스 정복을 위한 작은 가시 하나까지 모두 제거할 생각이다!\""
 GEM_makoto_story.2.a: "딱히 큰 의미는 없었다."

 GEM_makoto_story.3.t: "호스트 취임 연설"
 GEM_makoto_story.3.desc: "정의와 고결함을 부르짖던 트리니티 종합학원이 마침내 게헨나의 깃발 아래 함락되었습니다. 그들의 자랑이었던 정의실현부는 와해되었고, 학생들은 새로운 통치자를 맞이했습니다. 한때 나기사가 앉아있던 티파티의 테이블에, 이제는 하누마 마코토가 앉아 승리를 만끽합니다. 그녀는 모여 있는 트리니티의 학생들에게 새로운 시대의 '호스트'가 누구인지 똑똑히 각인시킵니다.\n\n\"키키킷! 이 분위기, 제법 괜찮지 않은가. 고상한 척하던 찻잔과 과자들, 그리고 거짓된 우아함. 이제 이 모든 것의 주인은 바로 나, 하누마 마코토다! 너희들이 신봉하던 낡아빠진 '정의'는 결국 나의 야망 앞에 무너졌다! 보아라, 이것이 바로 힘의 차이다!\"\n\n마코토가 찻잔을 들어 올리며 연설을 이어갑니다.\n\n\"이제 트리니티는 더 이상 위선적인 신념에 얽매이지 않을 것이다. 너희들의 잠재력은 오직 나의 위업, 키보토스 전체를 아우르는 위대한 질서를 세우는 데 사용될 것이다! 과거의 영광에 취해있던 자들은 모두 물러가라! 새로운 '호스트'인 이 몸의 연설을 똑똑히 듣도록!\"\n\n연설이 끝나고, 엉망이 된 다과회장에서 이로하가 가장 편해 보이는 소파를 찾아 몸을 기댔습니다.\n\n\"후우… 살짝 딴 데서 농땡이 부리지 않을래요? 여기 방석은 제법 푹신하네요. 과연, 여기라면 들키지 않을 것 같네요. 의장님께서 연설하시는 동안 잠시 눈 좀 붙이겠습니다.\"\n\n"잠깐, 이로하…. 아니, 지금은 그럴 때가 아니지. 키시싯! 좋다, 이 승리의 여운을 즐기도록 하지!""
 GEM_makoto_story.3.a: "에잇, 이건 뭐야?! 쓰잖아?! 티파티에 이런걸 먹는다고?"

 GEM_makoto_story.4.t: "총학생회장 취임 연설"
 GEM_makoto_story.4.desc: "총학생회장의 실종으로 혼란에 빠졌던 키보토스의 심장부, 생텀 타워가 마침내 새로운 주인을 맞이했습니다. 하누마 마코토의 군세는 총학생회 세력들의 저항을 분쇄하고 총학생회의 권력을 장악했습니다. 이제 마코토는 단순한 게헨나의 의장이 아닌, 키보토스 전체를 호령하는 '총학생회장'의 자리에 올랐습니다. 그녀는 생텀 타워의 방송 시스템을 통해 키보토스 전역에 자신의 목소리를 울려 퍼지게 합니다.\n\n\"키키킥! 키보토스의 모든 학생들에게 고한다! 오랫동안 공석이었던 총학생회장의 자리, 그 혼란과 무질서의 시대는 오늘로 끝났다! 이 하누마 마코토가 바로 키보토스의 새로운 총학생회장이다! 더 이상 방향을 잃고 헤매지 않아도 좋다. 너희들은 그저 나의 위대한 지도만을 따르면 되는 것이다!\"\n\n목소리에 자신감이 넘칩니다.\n\n\"나는 너희들에게 약속하지. 강력한 리더십 아래 키보토스는 그 어떤 위협에도 흔들리지 않는 철옹성이 될 것이다! 나의 통치 아래, 키보토스는 역사상 가장 위대한 번영을 누리게 될 것이다! 위업은 하룻밤 사이에 이루어지지 않는 법. 하지만 마코토 님은 절대로 포기하지 않을 테니 말이다! 나의 시대를 열어라!\"\n\n방송을 마친 마코토가 뻐근한 어깨를 돌리자, 총학생회장 의자에 앉아 있던 이로하가 서류를 넘기며 말했습니다.\n\n\"하아, 그러니까, 해야 할 일은 다 끝내뒀는데요. 총학생회의 방대한 행정 시스템을 파악하느라 힘들었다구요. 의장, 아니, 총학생회장님? 다음 일정은 밀레니엄의 예산안 검토입니다. 농땡이... 치게 내버려두지는 않을 것 같네요. 어쩔 수 없죠…\""
 GEM_makoto_story.4.a: "잠깐! 버튼을 잘못 눌렀다!"

 GEM_makoto_story.5.t: "밀레니엄 총재 취임 연설"
 GEM_makoto_story.5.desc: "이성과 합리성의 상징이었던 밀레니엄 사이언스 스쿨이 만마전의 발아래 굴복했습니다. 최첨단 기술로 무장한 엔지니어부도, C&C의 엘리트 요원들도 마코토의 야망을 막지는 못했습니다. 이제 밀레니엄의 모든 기술력과 데이터는 오직 한 사람, 새로운 '총재' 하누마 마코토의 손에 들어왔습니다. 그녀는 밀레니엄의 중앙 데이터베이스를 통해 모든 학생에게 메시지를 전송합니다.\n\n\"키키킥! 밀레니엄의 우수한 인재들이여! 너희들의 지식과 기술은 더 이상 목적 없는 탐구에 낭비되지 않을 것이다! 오늘부로 내가 너희들의 새로운 총재다! 너희들의 모든 연구, 모든 발명품은 이제부터 나의 위대한 키보토스 통일 계획의 일부가 될 것이다!\"\n\n마코토는 해킹한 드론들을 공중에 띄우며 연설을 계속했습니다.\n\n\"너희들이 만든 그 장난감 같은 로봇들, 이제 진정한 목적을 위해 움직일 때다! 키시싯! 중요한 것은, 이제 너희들의 기술력은 나의 통제 아래 있다는 사실이다! 더 이상 토론은 없다! 오직 실행만이 있을 뿐!\"\n\n한편, 회의실 한쪽 구석에서 가장 안락해 보이는 의자를 찾아낸 이로하가 태블릿으로 게임을 즐기고 있었습니다.\n\n\"감사합니다…. 뭔가요? 이 의자, 정말 편해서 저도 모르게 감사 인사가…. 의장님 연설이 끝나려면 아직 멀었을 테니, 그때까지 여기서 좀 쉬겠습니다.\""
 GEM_makoto_story.5.a: "잠깐! 드론이 왜 나를 공격하는거냐?!"

 GEM_makoto_story.6.t: "독일 신헌법 반포"
 GEM_makoto_story.6.desc: "\"하아... 귀찮지만, 어쩔 수 없죠. 마코토 의장님의 연설 준비는 끝났으니... 이제 저 시끄러운 행사가 끝나기만 기다리면 되겠네요.\"\n\n연단 옆에 선 나츠메 이로하는 작은 한숨과 함께 중얼거렸다. 그녀의 시선 끝, 새로이 단장된 제국의사당의 발코니에 하누마 마코토가 모습을 드러내자 광장을 가득 메운 군중에게서 거대한 함성이 터져 나왔다. 마코토는 그 함성을 만끽하며 두 팔을 활짝 벌렸다.\n\n\"키키킥! 보아라, 나의 새로운 신민들이여! 오늘, 이 하누마 마코토의 이름으로 역사의 새로운 장이 열렸노라! 과거의 '라이히'는 낡고 비효율적인 혈통의 굴레에 묶여 스스로 멸망의 길을 걷고 있었다! 그 복잡하게 얽힌 매듭을 풀려 하는 것은 어리석은 자들의 시간 낭비일 뿐! 이 몸은, 위대한 지도자답게 그 매듭을 단칼에 베어내었노라!\"\n\n마코토는 광장을 굽어보며 선포했다.\n\n\"이제부터 '독일인'이란 낡은 핏줄로 정의되지 않는다! 오직 나의 위업에 동참하고, 나의 지도력에 절대적으로 충성하는 자만이 진정한 독일인으로서의 자격을 증명받게 될 것이다! 너희의 의지가 나를 향할 때, 비로소 너희는 이 위대한 국가의 일부가 되는 영광을 누리게 되리라! 그리고 오늘, 이 새로운 질서를 영원히 새기기 위해 '독일 신헌법'의 반포를 선언한다!\"\n\n그녀는 잠시 말을 멈추고, 만족스러운 미소와 함께 외쳤다.\n\n\"이 위대한 순간을 기점으로, 우리는 혈통에 얽매인 과거의 잔재, '도이체스 라이히'라는 이름을 폐기한다! 이제부터 우리의 조국은 나의 이념 아래 하나 된 모든 이들을 포용하는 위대한 '도이칠란트'로 다시 태어날 것이다! 키시싯! 나의 통치 아래, 새로운 도이칠란트는 키보토스, 아니, 이 세계 전체를 정복할 위업의 첫걸음을 내딛을 것이다! 자, 환호하라! 너희의 새로운 총통, 하누마 마코토의 시대를!\"\n\n광장을 가득 메운 군중 속에서, 열광적인 환호와 계산된 침묵이 뒤섞여 울려 퍼졌다."
 GEM_makoto_story.6.a: "이로써 하누마 마코토님은 새로운 세계에서도 지도자로써의 가치를 증명했도다!"

 GEM_makoto_story.7.t: "연단 위에서"
 GEM_makoto_story.7.desc: "\"키키킥! 나의 사랑하는 게헨나 학우들이여! 너희의 그 소소한 불안과 의문들이 이 몸의 귀에까지 들려왔노라! 이 위대한 위업의 길에서 너희의 역할이 무엇인지, 너희의 미래가 어찌 될 것인지, 그런 시시한 고민에 잠 못 이루고 있다지?\"\n\n새롭게 단장된 의사당 강당, 하누마 마코토는 자신을 향해 모인 수많은 게헨나 학생들을 향해 두 팔을 활짝 벌렸다. 대전이 이후, 자신들의 소속이 거대한 독일국 아래로 편입되면서 학생들 사이에 퍼진 불안감을, 그녀는 단칼에 베어버릴 생각이었다.\n\n\"어리석은 것들! 너희는 누구를 따르고 있는지 잊었는가! 보아라! 이 하누마 마코토가 너희를 위해 무엇을 준비했는지를! 과거의 게헨나는 그저 하나의 자치구에 불과했으나, 이제부터 게헨나 학원은 이 위대한 독일국 안에서 특별한 법적 지위를 보장받는 신성불가침의 영역이 될 것이다! 너희는 더 이상 혼돈의 학원에 속한 일개 학생이 아니다! 너희는 나의 위업을 선도할 엘리트이며, 이 새로운 제국의 초석이다! 그러니 모든 불안을 버리고 나를 따르라! 너희의 미래는 이 몸이, 하누마 마코토가 직접 보장하겠다! 키시싯!\"\n\n마코토의 선언이 끝나자, 강당은 불안을 압도하는 열광적인 함성으로 뒤덮였다. 연단에서 내려오는 마코토를 맞이하며, 이로하는 지친 한숨을 내쉬었다. '하아, 뭔가요. 드디어 끝났네요⋯ 이 정도면 당분간은 농땡이 부려도 되겠죠?' 그녀는 마코토가 다음에는 또 어떤 귀찮은 연설을 구상할지 생각하며, 벌써부터 쉼터의 푹신한 방석을 그리워하고 있었다."
 GEM_makoto_story.7.a: "역시, 학도들에겐 안심을 가져다주는 목소리가 필요했다."

 GEM_makoto_story.8.t: "일시적 조치"
 GEM_makoto_story.8.desc: "판데모니움 소사이어티의 집무실이 변했다. 한때 서류 더미와 의미를 알 수 없는 낙서, 그리고 이로하 선배가 낮잠을 자던 푹신한 소파가 있던 그곳은 이제 없다. 대신, 각 잡힌 가구와 텅 빈 벽, 그리고 효율성만을 강조한 독일식 디자인이 그 자리를 차지했다. 마치 우리가 알던 '만마전'이 아닌, 다른 누군가의 사무실에 잘못 들어온 것만 같다.\n\n물론, 이것이 하누마 마코토 의장님의 위대한 구상 아래 진행되는 '문화적 표준화' 작업의 일환이라는 것은 알고 있다. 독일을 통치하기 위해, 우리 스스로 독일인처럼 보여야 한다는 그분의 심오한 뜻을 어찌 모르겠는가.\n\n하지만... 이 낯선 정적과 질서가 정말로 우리가 원했던 것일까? 우리의 자유롭고 혼란스럽던 모습마저 '묻어두어야' 할 과거가 되었다는 사실이, 어쩐지 서늘하게 다가온다. 이 차가운 공간에서 과연 이전과 같은 기발한 구상이나 대담한 계획이 나올 수 있을까.\n\n...하아. 잡념은 여기까지. 기사 마감은 맞춰야 하니까. 나는 펜을 들고, 이 '위대한 변화'를 찬양하는 문장을 짜내기 시작했다."
 GEM_makoto_story.8.a: "약간의 불길함이 감돌았다."

 GEM_makoto_story.9.t: "새 시대의 상징물"
 GEM_makoto_story.9.desc: "헤센의 거대한 홀은 새로운 깃발로 가득 찼다. 익숙한 게헨나 학원이나 나치당의 상징물 대신, 선명한 '오달 룬'이 연단을 장식하고 있었다. 연단에 오른 하누마 마코토는 자신을 향해 쏟아지는 각기 다른 시선들을 만끽하며 입을 열었다.\n\n\"키키킥! 오늘 이 자리는 역사가 될 것이다! 이것은 만마전이 아니다! 이것은 게헨나의 정당도 아니다! 오늘, 이 자리에서 '국가조합주의 독일 애국자당'의 창당을 선포하노라!\"\n\n마코토는 잠시 숨을 고른 뒤, 광기 어린 열정으로 외쳤다.\n\n\"독일은 길을 잃었다! 낡은 이념과 무능한 지도자들 속에서 신음하고 있다! 오직 이 몸, 하누마 마코토만이 독일을 위대하게 만들 수 있기에, 내가 직접 독일의 운명을 짊어지기로 한 것이다!\"\n\n강당 한편에 모인 게헨나 학생들은 어리둥절한 표정으로 서로를 쳐다보았다. \"우리가 왜 독일 애국자가 되어야 하는 거지...?\" 그들의 충성심은 게헨나를 향한 것이었지, 이 낯선 땅을 향한 것이 아니었다. 연정에 참여한 독일계 정당 대표들의 얼굴은 경악으로 굳어졌다. 그들은 협력자를 구했을 뿐인데, 어느새 새로운 광신 집단의 들러리가 되어 있었다.\n\n하지만, 그들과 달리, 홀을 가득 메운 독일인 대중들은 열광했다. 그들에게 마코토의 출신은 중요하지 않았다. 국가의 재건, 강력한 질서, 그리고 '하나된 민족'이라는 귀에 익은 약속. 그저 '강한 독일'을 약속하는 새로운 지도자의 등장을 목도하고 있을 뿐이었다. 상반된 반응 속에서, 마코토는 오직 자신을 향한 박수갈채만을 들으며 만족스러운 미소를 지었다. 그녀의 가장 기괴하고 대담한 도박이, 성공적으로 막을 올리고 있었다."
 GEM_makoto_story.9.a: "박수와 함께 퇴장."

 GEM_makoto_story.10.t: "NSDAP 불법화"
 GEM_makoto_story.10.desc: "오늘부로, 국가사회주의 독일 노동자당(NSDAP)의 모든 활동을 금지하고, 그 존재를 불법으로 규정하는 '국가 정화령'을 선포한다.\n\n이번 조치는 단순히 정치적 이념의 차이 때문이 아니다. 나치당이 과거부터 자행해온 극단적인 민족 배척 활동과, 특정 집단을 향한 증오 선동은 우리 '하나된 조국'이 지향하는 통합의 가치를 정면으로 위배하기 때문이다. 그들의 사상은 사회에 분열의 씨앗을 뿌리고, 공동체를 내부로부터 파괴하는 독소와 같다.\n\n새로운 독일은 혈통이나 출신으로 국민을 가르지 않는다. 오직 국가를 향한 충성과 공동의 위업에 동참하는 의지만이 '새로운 독일인'의 자격이 된다. 이 위대한 통합의 시대에, 특정 민족의 우월성을 주장하며 배척과 폭력을 정당화하는 낡은 사상은 설 자리가 없다.\n\n이에 따라 나치당의 모든 자산은 국가에 귀속되며, 지도부는 국가 통합을 저해한 혐의로 체포될 것이다. 과거의 오점을 씻어내고, 우리는 진정으로 하나된 조국으로서 미래를 향해 나아갈 것이다."
 GEM_makoto_story.10.a: "정치적 체포다."

 GEM_makoto_story.11.t: "국가조합주의 애국자당"
 GEM_makoto_story.11.desc: "정치적 지각변동이 일어났다. 하누마 마코토 총통이 제창한 '게헨나-게르만 문화 융화' 노선이 대중적 설득력을 얻기 시작하자, 경쟁 상대였던 나치당 내부에서 대규모 균열이 발생한 것이다. 새로운 시대의 역동성과 '승리'의 가능성을 목도한 나치당의 젊은 당원들과 실용주의자들은, 과거의 실패에 얽매인 낡은 지도부를 버리고 마코토의 '국가조합주의 독일 애국자당'에 대거 합류하기 시작했다.\n\n이 대규모 탈당 사태로 인해, 독일의 정치 지형은 완전히 재편되었다. 마코토의 정당은 이제 의회 내 압도적인 다수를 차지하는 거대 여당으로 거듭났으며, 다른 군소 정당들을 형식적인 파트너로 거느리는 '일당 우위 연정' 체제를 확립했다. 반면, 핵심 인재와 지지 기반을 모두 잃은 나치당은 이제 강경파 노인들만이 남은 군소정당으로 전락하여, 더 이상 정치적 영향력을 행사할 수 없게 되었다.\n\n무력으로 상대를 제거하는 대신, 그들의 심장부에서부터 힘을 흡수하여 스스로를 비대하게 만든 것이다. 이는 하누마 마코토의 방식이 거둔 가장 교활하고도 완벽한 승리였다."
 GEM_makoto_story.11.a: "승리를 위해!"

 GEM_makoto_story.12.t: "뿔은 새로운 날개"
 GEM_makoto_story.12.desc: "국가조합주의 청년단 행진이 끝난 헤센의 거리, 한스(Hans)와 프리츠(Fritz)는 담벼락에 기댄 채 텅 빈 거리를 바라보고 있었다.\n\n프리츠가 먼저 입을 열었다.\n\"있잖아, 가끔 보면 게헨나 사람들은 우리랑 정말 다른 것 같아.\"\n\n한스가 고개를 끄덕였다.\n\"말도 마. 힘은 장사지, 먹는 건 이상한 것들뿐이지. 애초에 머리에 뿔이 달렸잖아. 악마 같다고.\"\n\n그 말에 프리츠가 잠시 생각에 잠기더니, 피식 웃었다.\n\"악마? 글쎄. 난 요즘 들어 저 뿔이 꽤 멋있어 보인다고 생각하는데.\"\n\n\"뭐?\"\n\n\"생각해봐. 총통 각하도 저 뿔이 있으시잖아. 가장 강하고, 모두를 이끄는 분이시지. 마치... 힘의 상징 같달까.\"\n\n한스는 친구의 엉뚱한 말에 잠시 할 말을 잃었다가, 이내 따라 웃음을 터뜨렸다.\n\"하하, 힘의 상징이라. 듣고 보니 그럴싸하네.\"\n\n두 젊은이의 웃음소리가 텅 빈 거리에 잠시 울려 퍼졌다. 조국이 어떻게 변하고 있는지, 그들은 미처 깨닫지 못한 채였다."
 GEM_makoto_story.12.a: "변화하는 무언가."

 GEM_makoto_story.13.t: "천상의 이름으로"
 GEM_makoto_story.13.desc: "밤이 내린 헤센의 광장은 수만 개의 횃불로 대낮처럼 밝아졌습니다. 그러나 그 불꽃은 평범한 주황색이 아닌, 게헨나의 유황을 태우는 듯한 불길한 자줏빛으로 타오릅니다.\n\n광장 중앙에는 거대한 장작더미가 쌓여, '열등한' 문명의 잔재들을 삼키고 있습니다. 독일의 낡은 자유주의 서적과 함께, 트리니티의 신학서, 밀레니엄의 과학 저널이 뒤섞여 한 줌의 재가 되어갑니다.\n\n행진하는 대열은 게르만의 고대 군가를 부르짖다가, 이내 게헨나의 강렬하고 또 독특한 언어의 전투 찬가로 전환합니다. 연단에 오른 한 고위 당원은 '노르드의 순수한 피는 힌놈의 신성한 불로써 정화되어야 하며, 두 위대한 민족의 운명만이 이 세상을 지배할 자격이 있다'고 선포합니다.\n\n이것이 바로 '노르드-힌놈 문명'의 탄생을 알리는 첫 번째 의식입니다. 이성과 합리를 불태운 자리에서, 국가의 증오를 머금은 이데올로기가 탄생했습니다."
 GEM_makoto_story.13.a: "두 번째 악의 탄생."

 GEM_satsuki_story.1.t: "국명 결정하기"
 GEM_satsuki_story.1.desc: "모든 것은 순조로웠다. '독일'이라는 낡은 껍데기는 성공적으로 장악했고, NK 울트라 계획은 대중의 의식을 새로운 질서 아래 완벽하게 조율하고 있었다. 하지만... 새로운 시대에는 새로운 상징이 필요한 법.\n\n코교쿠 사츠키는 책상 위에 놓인 세 개의 서류철을 차례로 훑어보았다. 정보부가 제안한 새로운 국가의 이름들이었다.\n\n사츠키는 턱을 괸 채 잠시 생각에 잠겼다. 세 가지 이름 모두 각자의 방식으로 대중의 심리를 자극하고, 국가의 정체성을 효과적으로 각인시킬 수 있었다. 본질적인 차이는 없었다. 결국 이것은 어떤 '분위기'를 연출하고 싶은가의 문제일 뿐.\n\n\"후훗, 어느 것을 선택하든 대중을 이끄는 데에는 큰 차이가 없겠어. 중요한 것은 이름이 가진 상징성이니까. 이건 순전히... 나의 '취향' 문제일 뿐. 자, 어떤 이름으로 이 새로운 시대를 기록해볼까.\""
 GEM_satsuki_story.1.a: "휘페르보레아가 좋을 것 같다."
 GEM_satsuki_story.1.b: "툴레가 좋을 것 같다."
 GEM_satsuki_story.1.c: "뜻을 풀어서 정하자."

 GEM_satsuki_story.2.t: "역사적인 합당"
 GEM_satsuki_story.2.desc: "광장은 기묘한 열기로 가득했다. 판데모니엄 소사이어티의 깃발과, 구 독일국의 상징이었던 하켄크로이츠가 나란히 걸려 있었다. 모순된 두 상징 아래, 모여든 군중은 마치 하나의 목소리를 내는 것처럼, 약속된 함성을 외치고 있었다.\n\n연단에 오른 나치당 대표는 '아리아인의 영광'을 외쳤지만, 그의 목소리에는 어떠한 증오도 담겨있지 않았다. 그의 연설이 끝나자, 만마전의 의장 코교쿠 사츠키가 조용히 연단에 올랐다. 그녀의 목소리는 확성기를 통해 광장 전체에 부드럽게 울려 퍼졌다.\n\n\"보십시오. 증오와 갈등은 사라졌습니다. 게헨나의 혼돈도, 독일의 상처도 모두 아물고, 우리는 비로소 하나의 뜻 아래 조화를 이루었습니다. '대게르만 자유연합'의 이름 아래, 인류와 키보토스는 영원한 평화를 맞이할 것입니다.\"\n\n연설이 끝나자, 광장은 다시 한번 조율된 환호성과 침묵된 당황으로 가득 찼다. 그 소리를 들으며, 사츠키는 진심으로 미소 지었다. 광신도, 독재자... 세상은 그녀를 무엇이라 부르든 상관없었다. 그들은 이해하지 못할 것이다. 갈등도, 다툼도, 슬픔도 없는 완벽한 세계. 모두가 행복하고 조화로운 평화로운 세계를 만들기 위해서라면, 개인의 사소한 자유의지 따위는 기꺼이 거두어 갈 수 있었다. 이것이야말로 진정한 선이었다."
 GEM_satsuki_story.2.a: "통일된 게헨나와 독일."

 GEM_satsuki_story.3.t: "조용한 오후의 대화"
 GEM_satsuki_story.3.desc: "평화로운 오후였다. 코교쿠 사츠키는 의장실에서 창밖으로 보이는 질서정연한 게헨나의 풍경을 말없이 바라보고 있었다. 더 이상 폭음이나 총성은 들리지 않았다. 그녀가 꿈꾸던, 완벽하게 조화로운 세계였다.\n\n그때, 의장실 문이 요란하게 열리며 하누마 마코토가 들어왔다.\n\n\"사츠키! 이 몸이 왔다! 키키킥, 네가 만든 이 세상은 너무 지루하군! 폭발도 없고! 음모도 없고! 키보토스 정복 계획을 세우려 해도 아무도 진지하게 들어주질 않아!\"\n\n마코토는 흥, 하고 코웃음을 치며 창가로 다가갔다. 한동안 침묵 속에서 거리를 오가는 학생들을 내려다보던 그녀는, 이윽고 툭 내뱉듯이 말했다.\n\n\"...시시하기 짝이 없군. 하지만 뭐, 인정하지. 이건 이 마코토 님조차 해내지 못했던 일이니까. 이 아수라장이었던 게헨나를... 정말로 조용하게 만들었잖나.\"\n\n마코토는 사츠키를 돌아보며, 처음으로 조롱기가 아닌 묘한 감정이 섞인 눈으로 그녀를 보았다.\n\n\"최면 같은 비겁한 수를 쓰지 않고도 말이야. ...키키킥! 제법이구나, 코교쿠 사츠키!\"\n\n그 말을 듣는 순간, 사츠키는 잠시 숨을 멈췄다. 자신의 가장 큰 목표이자, 게헨나의 혼돈 그 자체였던 마코토의 입에서 나온, 어떠한 강제도 섞이지 않은 순수한 인정. 그것은 수백만 명의 조율된 찬사보다도 더 깊게 그녀의 마음을 울렸다. 그 순간, 사츠키는 처음으로 자신의 '평화로운 국가'가 완성되었음을 느꼈다."
 GEM_satsuki_story.3.a: "...미안했어요."

 GEM_satsuki_story.4.t: "마지막 피험자"
 GEM_satsuki_story.4.desc: "모든 것이 완벽했다. 게헨나는, 아니, 그녀가 재창조한 세계는 단 하나의 불협화음도 없는 거대한 교향곡처럼 평화롭게 울려 퍼지고 있었다. 의장실의 거대한 모니터 너머로 보이는 시민들의 얼굴에는 한 점의 근심도 없었다. 코교쿠 사츠키는 그 광경을 보며 깊은 피로감을 느꼈다. 모두가 행복했지만, 그 모든 행복을 설계하고 유지해야 하는 단 한 사람, 자기 자신만이 이 세계의 모든 무게를 짊어지고 있었다.\n\n후훗, 웃음이 나왔다. 이 완벽하게 조율된 세계에서, 유일한 불협화음의 원인이 바로 나 자신이라니. 모두가 평온한데, 나만이 과거를 기억하고, 의심하고, 이 모든 것의 무게에 괴로워하고 있었다. 시스템의 완성을 위해, 마지막 남은 변수인 '나'를 제거한다. 명분은 이보다 더 완벽할 수 없었다. 그래, 이것이야말로 진정한 의미의 '완성'이겠지.\n\n...원래의 자신이라면 결코 이런 결론을 내리지 않았을 것이다. 하지만 수년간 홀로 모든 것을 짊어져 온 그녀는 너무나도 지쳐 있었다. 사츠키는 조용히 의장실로 향했다. 그녀는 의장석. 아니, 마지막 피험자를 위한 의자에 앉아, 최근 들어서는 거의 사용하지 않던, 항상 지니고 다니던 추를 들어올렸다."
 GEM_satsuki_story.4.a: "그리고, 세계는 완벽하게 조용해졌다."

 GEM_germany_story.1.t: "주사위는 던져졌다"
 GEM_germany_story.1.desc: "우리의 새로운 국가는 힘 위에 세워졌지만, 아직 민의의 심판을 받지는 않았다. 진정한 정통성은 총구가 아닌 투표함에서 나온다는 이상주의자들의 목소리가 점점 커지고 있다. 지금, 우리는 중대한 선택의 기로에 섰다. 전 독일인을 대상으로 한 자유 총선거를 실시하여 우리의 지배를 정당화할 것인가, 아니면 아직은 시기상조라 판단하고 안정을 우선할 것인가.\n\n선거를 강행한다면, 승리는 우리의 통치를 반석 위에 올려놓을 것이다. 하지만 패배는 모든 것을 잃는다는 것을 의미한다. 반대로 안정을 택한다면 권력은 유지되겠지만, 우리는 영원히 '선거를 두려워하는 자들'이라는 꼬리표를 달게 될지도 모른다. 그야말로, 국가의 명운을 건 도박이다."
 GEM_germany_story.1.a: "민의의 심판을 받겠다. 선거를 실시하라."
 GEM_germany_story.1.b: "수권법은 연장되었다."

 GEM_germany_story.2.t: "새벽녘의 승리"
 GEM_germany_story.2.desc: "선거일 밤, 만마전 연정 본부의 공기는 담배 연기와 초조함으로 가득 차 있었다. 개표가 진행될수록 상황은 예측불허로 흘러갔다. 도시 지역에서는 압도했지만, 농촌 지역에서는 나치당과 보수 정당의 표가 쏟아져 나왔다. 승리를 장담했던 출구조사는 뒤집혔고, 패배의 그림자가 짙게 드리워졌다.\n\n모두가 침묵에 빠져 있던 새벽 4시. 마지막 개표소의 결과가 전해지는 순간, 누군가 나지막이 외쳤다. "…이겼다." 그 말 한마디에, 억눌려 있던 안도의 한숨이 방 전체를 채웠다. 압도적인 승리가 아니었다. 불과 수천 표 차이의, 피를 말리는 접전 끝에 얻어낸 신승이었다.\n\n환호성 대신 깊은 침묵이 흘렀다. 우리는 승리했지만, 동시에 이 나라가 얼마나 깊게 분열되어 있는지를 확인했다. 주사위는 우리 편이었지만, 아슬아슬하게 눈금 하나 차이였을 뿐이다. 우리에겐 이제, 이 위태로운 승리를 진정한 통합으로 이끌어야 할 무거운 책임이 주어졌다."
 GEM_germany_story.2.a: "적어도 지금은 우리가 지지받는다."

 
 GEM_germany_story.3.t: "장막 뒤의 속삭임"
 GEM_germany_story.3.desc: "선거라는 공개적인 도박 대신, 우리는 비밀 정보 조직을 통해 전국적인 여론조사를 실시했다. 오늘, 봉인된 보고서가 지도부의 책상 위에 올랐다. 떨리는 손으로 펼쳐 본 결과는… 믿을 수 없을 정도로 긍정적이었다. 보고서는 우리 연정이 모든 계층과 지역에서 압도적인 지지를 받고 있다고 결론 내리고 있었다.\n\n하지만 기쁨보다 먼저 찾아온 것은 서늘한 의구심이었다. 이것이 진실인가? 우리가 정말로 민심을 얻은 것인가? 아니면, 이것은 우리를 안심시키려는 정보부의 아첨이거나, 혹은 우리를 방심하게 만들려는 적들의 교묘한 함정은 아닐까.\n\n결과가 너무나도 완벽했기에, 오히려 그 진실성을 의심할 수밖에 없었다. 우리는 선거의 위험을 피했지만, 그 대가로 '진실'이 무엇인지 알 수 없는 안갯속에 갇히고 말았다. 우리는 과연 현명한 통치자인가, 아니면 가장 달콤한 거짓말에 속아 넘어가는 어리석은 자들인가."
 GEM_germany_story.3.a: "...이 보고서를 믿어야 하나?"

 GEM_germany_story.4.t: "다행히도, 지지받는 만마전"
 GEM_germany_story.4.desc: "한동안 우리는 숨을 죽인 채 결과를 지켜봐야 했다. 우리는 최악의 경우를 대비했다. 대규모 시위, 지하 조직의 발호, 심지어는 내전까지도. 하지만, 아무 일도 일어나지 않았다.\n\n거리는 평온했고, 시민들은 각자의 일상으로 돌아갔다. 가장 우려했던 나치당조차, 혁명을 부르짖는 대신 의회에서 팻말을 들고 합법적인 야당의 역할을 수행하고 있었다. 그제야 우리는 깨달았다. 독일인들은 혼돈을 원하지 않는다는 것을. 그들은 과거의 망령이 아닌, 안정된 미래를 이끌어 줄 강력한 지도자를 원했다.\n\n그리고 그 지도자는, 바로 우리였다. 우리의 통치는, 이제 흔들리지 않는다."
 GEM_germany_story.4.a: "우리의 정통성은 이제 의심의 여지가 없다."

 GEM_germany_story.5.t: "생존을 위한 타협"
 GEM_germany_story.5.desc: "나치당 중앙당사의 회의실. 담배 연기가 자욱했고, 공기는 무거웠다. 더 이상 그들은 이 나라의 유일한 주인이 아니었다. '전게헨나 인민당'이라는 거대한 여당의 등장으로, 그들은 이제 '독일계 제1야당'일 뿐이었다.\n\n연단에 선 당수는 굳은 표정으로 간부들을 둘러보았다.\n\n"과거, 우리는 우리 외의 모든 것을 적으로 돌렸습니다. 그것이 우리의 힘이었습니다. 하지만 시대가 변했습니다. '대전이'는 우리의 세계를 뒤흔들었고, 게헨나라는 외세는 이제 우리의 연방 파트너입니다. 이런 상황에서, 과거의 낡은 게르만 민족주의만으로는 살아남을 수 없습니다."\n\n그는 잠시 말을 멈추고, 반대 의견이 없는지 확인했다.\n\n"중앙당, 인민당… 한때 우리의 경쟁자였던 그들도 결국은 독일인입니다. 게헨나의 눈에 우리는 모두 똑같은 '독일인'일 뿐입니다. 그렇다면 우리도 그렇게 행동해야 합니다. 이념의 순수성보다 중요한 것은, 우리 민족의 생존과 주도권입니다. 이제 우리는 분열을 끝내고, 모든 독일계 정당을 아우르는 단 하나의 거대 야당으로 다시 태어날 것입니다."\n\n회의실에는 침묵이 흘렀다. 그것은 열광적인 동의가 아닌, 쓰라린 현실을 받아들이는 자들의 굳은 결의였다."
 GEM_germany_story.5.a: "하나의 독일을 위하여."

 GEM_antinazi_preemptive_strike: "나치즘 선제타격"
 GEM_antinazi_preemptive_strike_desc: "판데모니움 소사이어티의 연방 국가 전략은 결국 나치즘에 대한 인정으로 번지며 스스로를 독일국이라 자칭하는 수준까지 올라섰습니다. 우리는 게헨나 학원과 키보토스 전체를 옛 독일의 손에 쥐여주려는 판데모니움과 복권된 나치들을 향해 선전포고를 준비해야 합니다."
 GEH_preparations_for_operation_longsword_breaking_operation: "장검 깨기 작전"
 GEH_preparations_for_operation_longsword_breaking_operation_tt: "우리는 $GEH_preparations_for_operation_longsword_breaking_operation$ 시작과 동시에 [GEM.GetNameDef]에 선전포고하기 전까지 §Y70일§! 동안 준비할 수 있을 것입니다. 임무의 기한이 끝나는 즉시 [GEM.GetNameDef]에 선전포고 할 것입니다."
 GEH_preparations_for_operation_longsword_breaking_operation_alt_tt: "§R대상 국가들이 우리에게 선전포고하기 전까지 §Y70일§! 동안 준비할 것입니다. 임무의 기한이 끝나는 즉시 우리에 대해 선전포고 할 것입니다.§!"

 GEH_event.1.t:0 "긴급소집"
 GEH_event.1.desc:0 "여느 날과 다름없던 따스한 햇빛이 비치는 날, 갑자기 키보토스가 이상한 세계로 전이되어 있었다.\n만마전 회의실 창문 밖으로 보였던 것은 늘 보던 고층 빌딩이나 하늘의 빛나는 고리가 아니었다.\n일부 게헨나의 건물 외에, 소설책에서만 묘사되던 낮고 고풍스러운 집들만이 보일 뿐이었다.\n\n만마전의 임원들은 처음엔 신기하다는 듯이 빛나는 눈빛으로 보고 있었으나, 이내 겁에 질린 눈동자만이 보일 뿐이었다.\n\n만마전의 회의실엔 이로하와 이부키, 그리고 소수의 임원만이 있을 뿐이었다.\n그때, 문을 쾅 하며 벅차고 누군가가 들어왔다.\n\n"키키킥 긴급 소집이다~! 이로하! 만마전 임원들을 모두 소집해라!"\n"하아.. 다들 어디 갔는지도 모르겠는데.. 귀찮군요."\n\n이로하는 귀가 터지게 듣던 마코토의 지시에 귀찮아하며 읽던 소설책을 툭 던져놓고 자리에서 일어났다.\n\n게헨나 교내에서 갈 길을 잃어 멀뚱멀뚱 서 있던 임원들을 이로하가 하나둘 끌고 오기 시작했다.\n\n회의가 시작하자마자 마코토답게 자신감에 찬 주장을 하였다.\n"이번 사태로 선도부 녀석들과 트리니티는 혼란에 빠져있을 것이다! 지금이 모두 정리해 버릴 기회다! 키키킥!"\n"마코토 선배.. 우리가 할 말은 아닌 것 같은데요."\n\n웅성거리던 회의장에서 한 임원이 입술을 떨며 의견을 냈다.\n\n"상황도 상황이니 선도부라도 불러서 같이 의논해봐야.."\n\n말이 끝나기도 무섭게 마코토는 의자를 박차고 일어나 소리를 질렀다.\n\n"무슨 소릴 하는 거냐! 방금 말한 대로 선도부는 뿌리를 뽑아버려야 한다!"\n\n결국 큰 소득을 얻지 못한 채 회의는 종료되었다..."
 GEH_event.1.a:0 "별 소득은 없네."

 GEH_event.2.t:0 "시찰"
 GEH_event.2.desc:0 "게헨나의 몇몇 건물은 그대로였지만 사람들이 주거하던 도시는 완전히 달랐다.\n고층 빌딩이 사라지고 남은 책으로만 보던 독일이라는 국가의 건축 양식, 중간중간 보이는 이상한 말을 하는 시민들,\n이 모든 것은 이계로 오기 전 키보토스의 모습과는 비교할 수 없었다.\n\n"이게 다 무슨 일이냐! 내가 알던 게헨나가 아니다! 이로하! 설명해라!"\n"후우.. 저도 이 상황이 받아들여지지가 않는데요.." \n\n그때, 옆에서 따라온 이부키는 똘망똘망한 눈빛으로 쳐다보고 있었다.\n\n"이 음식들은 다 뭐야?"\n\n자세히 보니 평소에 먹던 키보토스의 음식들과 달리 기름지고 큼지막한 음식이 많았다.\n\n그러는 사이, 게헨나의 학생들은 말이 통하진 않지만, 이곳에 원래 있었던 사람들과 섞이고 있었다."
 GEH_event.2.a:0 "길거리 음식은 맛있었어."

 GEH_event.3.t:0 "국방군 문제"
 GEH_event.3.desc:0 "게헨나 북구로 순찰을 보냈던 임원들이 곧 쓰러질 것처럼 어두운 안색을 하고 회의실로 들어왔다.\n따뜻한 차를 내어주며 임원들을 진정시키고 천천히 설명을 듣기로 하였다.\n\n"자, 그래서 무엇을 보고 왔나! 설마 트리니티인가?!"\n"트리니티를 보고 놀랄 일은 아니잖아요.."\n\n마코토의 기대에 가득 찬 말이 끝나자, 한 임원이 그제서야 입을 열었다.\n\n"이상한 철모를 쓰고 있는 사람들이 무장한 채로 게헨나 북구 쪽에 주둔해 있습니다!"\n\n"뭐? 트리니티도 선도부도 아니라고?!"\n"우리 지역에서 도대체 뭐 하는 짓들인 거야!"\n\n새로운 사실로 인한 혼란 속에서 의장 마코토는 혼자 소곤거렸다.\n\n"키키킥.. 그들이 누군진 모르겠지만 협력하면 티파티를 굴복시키고 선도부를 조용히 하게 할 수 있겠군.."\n\n마코토는 마코토다운 생각을 하고 있었고, 역시나 그녀의 생각과 달리 그들은 우리를 적대시하고 있었다.\n\n...아무래도 그들은 우리와 협력할 생각이 없는 것 같다. 다가가면 다가갈수록 그들은 죽일 기세로 총을 높게 세웠고 급기야 위협사격까지 했다.\n\n우리가 총을 항상 들고 있어서일까?\n\n그들 중 몇몇은 겁을 먹은 채 우리를 바라보고 있었다."
 GEH_event.3.a:0 "큰일이다!"

 GEH_event.4.t:0 "비상사태 선언"
 GEH_event.4.desc:0 "게헨나 북구의 상황을 파악한 만마전은 다시 회의를 열었다.\n\n"아무래도 협력은 쉽지 않은 것 같군.."\n\n생각보다 강했던 저항에 마코토의 어깨는 축 늘어져 있었다.\n\n그때, 이로하가 입을 열었다.\n\n"이러고 있지 말고 현실적인 대처방안을 모색하죠, 선배 ㅡㅡ"\n"아예 최면을 걸어서 우리 편으로 만들어 버리자!"\n\n사츠키는 자신이 연구 중이던 최면술을 보여주겠다며 신나있었다.\n\n"하아.. 그런게 먹힐 리 없잖아요.."\n\n답답한 두 선배를 두고 이로하는 머리가 지끈거리기 시작했다.\n\n아무 진전이 없던 상황에서 조용히 앉아있던 마코토가 입을 열었다.\n\n"일단 비상사태를 선언한다! 시민들이 힘들어 할 때 만마전이 해결하는 것이 옳은 것이다!\n그리고 비상인 만큼 선도부의 예산도 삭감! 삭감이다! 키키킥!""
 GEH_event.4.a:0 "만마전의 위상을 보여줄 때다!"

 GEH_event.5.t:0 "국방군과 협상 시작"
 GEH_event.5.desc:0 "비상사태 선언 후, 회의를 거친 만마전은 일단 북구의 그들과 대화를 시도해 보기로 했다.\n\n"하아.. 이런건 귀찮은데.."\n\n이로하의 전차 토라마루에 백기를 달고 여러 학생과 만마전의 임원들은 게헨나 북구로 향했다.\n백기를 달고 있단 사실에 마코토는 모자를 더 눌러썼지만 어쩔 수 없었다.\n\n게헨나 북구에 도착한 만마전 일행은 경계근무를 서던 병사들을 향해 천천히 다가갔다.\n백기를 들고 있어서인지 우리에게 총알이 날아오진 않았다.\n\n그들이 하는 말은 사전에 고대 언어를 공부하던 학생들을 모집해 놓은 덕에 이해할 수 있었다.\n그들의 국가는 "독일국" 이며 자신들은 그 국가의 "국방군" 이라는 군사 단체라고 소개했다.\n또한 현재 게헨나가 위치하고 있는 지역은 원래 독일국의 영토였다고 한다.\n\n서로 소개를 이어간 후, 만마전과 국방군 사령부는 오해를 푸는 것을 시작으로 협상을 진행했다.\n하지만 이상하리만치 협상은 불편한 분위기가 유지되었다..."
 GEH_event.5.good_desc:0 "만마전의 대표단이 우리와의 협상에 돌입했습니다. 이 들은 게헨나와 국방군의 조화를 원한다는 목표를 밝히며 우리 대표들과 만남을 시작했습니다. 이전의 충돌과 서로 간의 격차를 해결하고 조정하기 위한 이 협상에는 아주 긴 시간이 필요할 것입니다. 몇 가지 일정을 잡은 후 만마전의 대표단은 게헨나로 귀환했습니다."
 GEH_event.5.bad_desc:0 "만마전이 북부의 국방군과 협상을 시작했다는 소식을 우리가 입수했습니다. 이것은 우리의 입지가 크게 타격받을 수 있는 위험이 있기에 우리는 이것을 방해하거나 아니면 협상에 합류해야 합니다."
 GEH_event.5.a:0 "협력은 불가피할 것이다."
 GEH_event.5.b:0 "한번 들어는 보도록 하지."
 GEH_event.5.c:0 "큰일이야."

 GEH_event.6.t:0 "협상 안건 : 학생 상해사건"
 GEH_event.6.desc:0 ""(독일어로) 멈춰! 더 다가오면 발포하겠다!"\n"쟤네 뭐라는 거야? 그리고 저 이상한 옷들은 뭐고?"\n"알 바냐~ 어차피 대공포 맞아도 좀 쉬면 되는데 저런 총이 뭐가 무섭다고~"\n"(독일어로) 마지막 경고다 접근하지 마라!"\n"어이~ 그쪽은 우리 게헨나 지역이라고~ 길 막지말고 비켜!"\n"(독일어로) 젠장, 발포하라!"\n\n무방비하던 학생들을 제압하기엔 몇 발의 총알이면 충분했습니다. 헤일로 신비의 변화를 모르던 학생들은 총알이 무서울 리 없었고, 결국 총알 세례를 받았다.\n\n다행일까, 국방군이 영점조절을 똑바로 안 했는지, 총알 세례를 받은 학생들은 중상에 그쳤다.\n\n"시체.. 아니 부상자들을 빨리 이송해서 다행입니다. 아무리 급소를 맞은 게 아니라지만 출혈이 적지 않았습니다."\n\n사실 이 문제는 국방군과의 협상이 있기 전, 만마전 회의에서 누군가 언급했지만, 혼란스러웠던 사이 잊고 있었던 문제였다.\n의장 마코토는 고민에 빠졌다. 국방군 편을 들어 협력을 굳건히 할지, 아니면 게헨나의 의장으로서 학생들 편을 들어야 할지 말이다.\n\n학생들의 편을 드는 것이 옳다고 생각되지만, 그렇게 되면 국방군이 어떤 입장을 취할지는 의문이다.\n반대로 국방군 편을 들게 된다면 우리 게헨나의 학생들의 신뢰를 잃게 될 것이다."
 GEH_event.6.a:0 "국방군 편을 들어라."
 GEH_event.6.b:0 "학생들 편을 들어라"

 GEH_event.7.t:0 "[FROM.FROM.GetName]에서의 철수"
 GEH_event.7.desc:0 "우리의 영향력 감소로 인해 협상에서 [FROM.FROM.GetName](을)를 내어줄 수 밖에 없었습니다. 협상에 참여한 이들은 이 결과에 납득하고 있는듯 했으나 내부의 비판은 피할 수 없었습니다."
 GEH_event.7.a:0 "협상에서 밀렸군."

 GEH_event.8.t:0 "히나의 협상안 거부!"
 GEH_event.8.desc:0 ""안녕하십니까 여러분 만마전에서 학생 여러분께 공표할 사항이 있습니다. 앞으로 독일국과.."\n\n많은 조항이 답이 없었지만, 그 중에서도 선도부를 사실상 폐부한다는 만마전의 발표를 들은 소라사키 히나는 주먹을 불끈 쥐었다.\n\n"결국 이렇게 나오겠다는건가.. 아코, 준비해, 만마전으로 찾아간다."\n"알겠습니다 부장님!"\n"이오리, 치나츠, 너희도 따라와"\n\n그렇게 선도부는 협상 결과에 반대를 표명하러 만마전으로 향하게 된다.\n\n쾅! 문을 박차고 만마전 회의실로 히나가 들어온다.\n거기엔 추가적인 상의를 위해 여러 국방군 장교가 모여있었다.\n\n"아, 저분이 선도부장이신 소라사키 히나라는 분이시군요."\n"키키킥 그렇다. 저들은 만마전 휘하의.."\n\n말이 끝나기도 무섭게 히나가 입을 열었다.\n\n"난 이 결과에 반대해."\n\n이 말을 들은 국방군 장교들과 만마전 임원들이 술렁이기 시작했다.\n\n"뭐.. 뭐?! 이미 이 마코토님이 결정하고 진행 중인 사항이다. 바꿀 순 없어!"\n"실례합니다만 마코토님 선도부가 게헨나에서 최고 무력 집단인 것으로 알고 있습니다만.. 이게 어떻게 된 일이죠?"\n\n히나는 말을 이어 나간다.\n\n"아. 국방군인가. 방금 들은 대로 다 이 협상은 결렬이다."\n\n국방군 장교들은 어이없는 표정을 지으며 빠르게 회의실을 나갔다.\n앞으로 어떤 일이 벌어질지는 아무도 모른다..."
 GEH_event.8.a:0 "히나..!!!"
 GEH_event.8.b:0 "선도부는 게헨나와 관련이 없다."

 GEH_event.9.t:0 "선도부의 선도 활동"
 GEH_event.9.desc:0 "협상에 집중하던 만마전은 잊고 있었다. 선도부는 게헨나 최고의 무력 집단이라는 사실을.\n더욱 혼란스러워진 게헨나에서 선도부는 그것에 맞게 활동량을 늘려왔다.\n학생들은 생각했다. 우리를 공격한 국방군과 협력하려 하는 만마전보다 질서를 지키는 선도부가 더 낫지 않은가.\n선생도 없고 총학생회의 개입도 없는 상황에서, 만마전은 게헨나의 학생들에게 쥐뽈도 관심 없다는 생각이 팽배해지기 시작했다.\n\n"만마전은 각성하라!"\n"마코토는 우리 학생들을 생각하라!"\n"선도부가 만마전보다 낫다!"\n\n만마전을 향한 시위가 발생했고, 아직은 소규모지만 하나둘 사람이 모이고 있었다.\n\n어쩌면 생각보다 "큰일"이 일어날지도 모른다.\n\n이러한 사태를 뒤늦게 알아차린 만마전은 다음과 같은 선택을 하게 된다..."
 GEH_event.9.a:0 "그들을 굴복시켜라."
 GEH_event.9.b:0 "우리에겐 더 중요한 일이 남아있다."

 GEH_event.10.t:0 "학생 공격 사건"
 GEH_event.10.desc:0 "어느 화창한 날 두 명의 게헨나 학생들은 고요한 숲에서 여유를 만끽하며 소풍을 즐기고 있었다.\n\n"역시 어지러운 시내보다 여기가 훨씬 좋아~"\n"그런데 여기 북구 아니야? 전에 선도부원들이 북구 쪽으론 가지 말라고 했을 텐데.."\n"설마 이런 데까지 문제가 생기겠어? 중앙구랑 그렇게 멀지도 않아~"\n\n한편, 국방군에서 정찰 임무를 맡던 정찰대가 학생들이 들어가 있던 숲을 정찰하고 있었다.\n\n"하사님 저기 게헨나 녀석들이 보입니다."\n"...저새끼들 때문에 내 고향 뮌헨이 점령당했지.." 하사는 그녀들을 향해 총구를 세웠습니다.\n"하사님? 꼭 그래야만 되겠습니까?"\n"여긴 인적이 드문 숲이다. 아무렴 상관없겠지"\n\n결국 하사의 증오는 그녀들에게 닿았다. 맑고 강렬한 총소리는 고요한 숲을 깨웠고, 두 학생의 비명으로 가득 채워졌다.\n\n그리고 잠시 후, 기적적으로 도망쳐 나온 한 학생이 친구를 등에 업은 채 거친 숨을 내쉬면서 절뚝거리며 게헨나 시내에 도착했다.\n다행히 응급의학부의 재빠른 대처로 응급처치를 할 수 있었으나, 학생의 의식이 없는 지금 모두 발을 동동 구르며 지켜보고만 있다.\n\n만마전의 지속적인 협상 진행에도 불구하고 또 학생이 공격받는 사건이 일어났다. 일부 국방군 병사들이 무고한 게헨나의 학생을 공격하게 되었고, 이번엔 빈사 상태에 빠지기까지 했다는 것이다.\n만약이지만, 이 학생이 죽게 된다면 첫 사망자가 발생하게 되는 것이다.\n\n아직은 게헨나 전체에 소식이 전해지지 않았지만, 만마전은 협상의 진전을 위해 이 사실을 조용히 덮으려 한다.\n하지만 반대로 선도부는 진실을 파헤쳐 범인을 찾아 처벌할 생각이다.\n\n사건이 묻히게 된다면 당사자를 통제하게 되고 소수 인원만 사실을 안 채 조용히 지나갈 것이다.\n사건이 조사되고, 많은 학생이 알게 된다면 만마전의 지지도는 떨어지고, 반대로 선도부는 칭송받게 될 것이다."
 GEH_event.10.a:0 "조용히 덮어라."
 GEH_event.10.b:0 "샅샅히 조사하여 범인을 찾아내라"

 GEH_event.11.t:0 "시민 공격 사건"
 GEH_event.11.desc:0 ""우리가 저런 독일 놈들한테 죽을 위기를 넘기며 살아야 해?!"\n"게헨나 땅에서 당당하게 살겠다는 왜 우리만 당해야 해?!"\n\n그때, 그녀들의 눈에 한 독일인이 눈에 들어왔습니다. 그는 평소에 게헨나를 좋아하지도, 싫어하지도 않는 평범한 시민이었다.\n증오가 끓어 넘치던 학생들은 그렇게 독일인을 끌고 가서 그를 걷지도 못하게 만들어놨다.\n\n다행이라 해야 할지 모르겠지만 학생들은 인적이 드문 곳에서 폭력을 가했다.\n사건 후 지나가던 학생의 신고로 응급의학부가 재빠르게 출동하여 치료를 받게 하였지만\n아무래도 독일인 사이에서 소문이 퍼지고 있는 것 같다.\n\n보고를 받은 만마전의 이로하는 뭐든 안 좋은 건 숨기라는 마코토의 지시로 머리를 부여잡으며 한탄했다.\n\n"하아.. 언제까지 숨겨야 하나요.. 이러다가 들키면 어쩌려고.."\n\n물론 이번 일도 숨기게 된다면 협상이 끝날 때까진 조용히 넘어갈 것이다.\n반대로 선도부가 조사에 착수하게 된다면 만마전의 위상은 나날이 떨어질 것이다.\n\n점점 감정이 격해지는 상황에서 어떻게 해야 할까?"
 GEH_event.11.a:0 "조용히 덮어라."
 GEH_event.11.b:0 "범인을 찾아내고 피해자에게 사과하라"

 GEH_event.12.t:0 "서로를 향한 증오"
 GEH_event.12.desc:0 "소문은 퍼지기 마련이다. 결국 서로를 향한 여러 사건의 감정이 극한으로 치달으며 현지 독일인들의 학생들을 향한 테러가 일어나기 시작했다.\n\n처음엔 그저 학생들을 향한 폭언이나 소규모 시위 정도로 그쳤지만, 점점 격해지고, 직접적인 피해가 발생하기 시작했다.\n현지 식당에서 식사하고 있던 학생들에게 음식물을 뿌리거나, 길거리엔 게헨나를 혐오하는 낙서가 그려져 있고\n게헨나 캠퍼스 내에 들어와 방화 시도를 하는 등 정도가 훨씬 심해지고 있다.\n\n최근엔 학생을 납치하여 행방불명되었다는 소문이 돌기도 하는데, 사실이 아니길 바랄 뿐이다.\n안 그래도 이계로 와서 혼란스러운데 현지인과의 갈등이 심해지고 있다.\n아직까지 큰 공포를 느낄 정도는 아니지만.. 많은 학생이 만마전의 입장을 듣고 싶어 한다."
 GEH_event.12.a:0 "협상이 끝나면 갈등도 서서히 줄어들 것이라 발표한다."
 GEH_event.12.b:0 "실종 학생을 찾아라."
 
 GEH_event.13.t:0 "선도부의 수상한 움직임"
 GEH_event.13.desc:0 ""이로하! 지금 선도부는 뭘 하고 있지?"\n"흠.. 최근 활동 보고가 뜸하긴 한데.."\n"키키킥! 결국 이 마코토님의 노력에 기가 짓눌렸나 보군!!"\n"이거 따로 조사라도 해봐야 하는 거 아닌가요.. 아 생각만 해도 귀찮아.."\n\n최근 선도부가 무슨 활동을 하고 있는지 만마전 임원들은 잘 모르고 있다.\n일각에선 선도부가 만마전을 뒤집어 버리는 게 아니냐는 말도 나오고 있다.\n\n최근 여러 소요 사태로 학생들의 신뢰를 잃고 있다는 사실을 알고 있는 만마전이지만,\n선도부가 그와 관련되어 있다고 생각하는 건 일부 임원들일 뿐이다." 
 GEH_event.13.a:0 "선도부를 조사하여 뜸해진 이유를 밝혀라."
 GEH_event.13.b:0 "아무 문제 없을 것이다...당장은"

 GEH_event.14.t:0 "행동하는 국방군"
 GEH_event.14.desc:0 ""의장님!"\n\n마코토 의장에게 들어온 보고를 듣고 마코토는 온몸을 떨기 시작했다.\n독일국 국방군이 게헨나 북구를 중심으로 진격하기 시작하더니 게헨나 중앙구 위쪽까지 전선을 형성한 것이다.\n그들은 우리에게 총구를 겨누고 있었다.\n\n머지않아, 독일국에서 공식 서한이 날아왔다.\n‘협상의 결과는 무효이며 이러한 사태가 벌어진 것에 대해선 유감을 표한다.’\n\n그때, 만마전 임원이 겁에 질린 채로 회의실로 들어와 더 충격적인 사실을 보고했다.\n\n"의..의장님!! 아무래도 독일군에서 전쟁을 준비하는 것 같습니다!!!"\n"뭐라고?!"\n\n만마전 회의실은 삽시간에 북새통이 되어있었다. 독일군이 침공 해오려 한다니 이게 무슨 소리인가.\n헤일로의 신비가 줄어든 이상 우리 또한 총에 맞으면 죽을 수 있다.\n\n"키키킥.. 그렇다면 이 김에 선도부랑 독일국 둘 다 정리하면 되겠군. 전쟁을 준비한다!"\n\n마코토는 끝까지 알 수 없는 말을 했지만, 전쟁을 피할 수 없음은 틀리지 않았다."   
 GEH_event.14.a:0 "게헨나의 학생들이여! 전쟁 준비다!"
 GEH_event.14.b:0 "그러나 아직 협상의 기회가 남아있을지도 모른다."
 GEH_event.14.c:0 "우리와는 관련 없는 일이다."

 GEH_event.15.t:0 "선도부의 쿠데타!"
 GEH_event.15.desc:0 "우리의 선도부장 소라사키 히나는 더 이상 만마전의 행동을 눈 뜨고 볼 수 없다고 판단했다.\n고통받는 학생들을 무시하고, 사건을 은폐하고, 누군지 잘 모를 독일과 무작정 협력하려 했다.\n게헨나의 질서를 잡아 온 선도부는 이 혼란에 질서를 확립하기 위해 직접 게헨나를 통치하기로 결정했다.\n이를 지지하는 학생은 사실상 게헨나의 절반, 혹은 그 이상이며 그들은 선도부에 충성을 다하였다.\n\n"만마전은 각성하라!" 였던 학생들의 시위 구호는 "마코토는 물러나라!" 로 바뀌었다.\n이젠 행동할 때다.\n\n"부장님, 선도부 전투원들을 출격시키겠습니다."\n"이젠 끝을 보자. 마코토.""
 GEH_event.15.bad_desc:0 "선도부의 행동은 이전부터 수상했다. 하지만 그녀들은 만마전의 하위 기관이었다.\n아무리 공인된 최고 무력 기관일지라도.\n\n하지만 상황은 변했다. 소라사키 히나. 선도부장이라는 작자가 건너지 말아야 할 강을 건너버렸다.\n자신의 이익을 위해 게헨나를 무너뜨리려 하다니 말도 안 된다.\n\n"하아.. 결국 이렇게 되는군요.."\n"키키킥.. 이로하! 이제 그것을 제대로 사용할 때가 되었다!"\n"네.. 알겠습니다.. 조금 부끄럽지만.. 초무적철갑 토라마루 출격."\n\n피할 수 없는 악연.. 이젠 이 갈등의 종지부를 찍을 시간이다."
 GEH_event.15.a:0 "게헨나의 질서를 위해!"
 GEH_event.15.b:0 "영광스러운 만마전의 전사들이어!"

 GEH_event.16.t:0 "우리와의 전쟁 중단에 합의한 [FROM.GetName]"
 GEH_event.16.desc:0 "다른 강대국과의 전쟁으로 시작된 게헨나 휴전 협상에 [FROM.GetName] 측이 동의하며 우리와의 전쟁이 일시적으로 휴전 상태에 돌입했습니다. 게헨나 학원은 적에 대항하는 투쟁을 할 준비가 끝났습니다!"
 GEH_event.16.a:0 "우리는 승리할 것이다!"

 GEH_event.17.t:0 "만마전의 끝"
 GEH_event.17.desc:0 "선도부장의 무력사용 끝에 만마전은 그 종적을 감췄고, 선도부장 소라사키 히나가 게헨나의 월계관을 쓰게 되었습니다. \n\n아직 할 일이 많습니다."
 GEH_event.17.a:0 "잘 되었군"
  
 GEH_event.18.t:0 "떠오르는 동아리 문제"
 GEH_event.18.desc:0 "게헨나에는 수 많은 동아리가 있지만 사실상 그들은 만마전의 통제를 받지 않고 여러 곳을 돌아다니며 피해를 끼치는 등 사회적 문제를 낳고 있습니다. 하지만 만마전은 역사의 뒤안길로 사라지고 선도부가 정권을 잡은 지금이야 말로 동아리들을 통제할 수 있을 것입니다."
 GEH_event.18.a:0 "그래."

 GEH_event.19.t:0 "회의 개최"
 GEH_event.19.desc:0 "선도부장과 선도부원들의 회의에서 '동아리 문제' 를 해결할 방안을 회의 하는 내용"
 GEH_event.19.a: "그들과 협상을 진행하자."
 GEH_event.19.b: "말을 듣지 않는다면 해체 시켜라."
 
 GEH_event.20.t:0 "협상의 끝"
 GEH_event.20.desc:0 ""...이것으로 게헨나와 독일국의 협상은 마무리하겠습니다."\n"키키킥.. 우리 게헨나는 이번 협상을 통해 더욱 강해질 것이다!"\n\n결국 긴 시간 끝에 만마전과 독일 국방군 사이에서의 협상은 마무리되었다.\n결과에 대해 서로 만족하는 눈치였지만 해석에 따라 의미하는 바가 다를 수 있는 문항도 있다.\n\n하지만 만마전이 주도했던 이 협상을 게헨나의 최고 무력 기관 선도부가 인정할지는 미지수이다.\n만약 선도부가 인정하지 않는다면 국방군과 손을 잡은 만마전과 정면으로 충돌하게 될 것이다.\n\n아무튼 협상은 끝났고 이제 발표할 차례이다."
 GEH_event.20.a:0 "우리 게헨나는 더욱 강해질 것이다!"

 GEH_event.21.t:0 "낮선 이들" 
 GEH_event.21.desc:0 "다시 만난 국방군 협상단에는 이전에는 보지 못했던 사람들이 끼어있었다. 다른 형태의 푸른 제복을 입은 이들이 협상장에 들어온 우리를 신기한 눈빛으로 지켜보며 시작된 협상은 이전과는 크게 다를 것 없이 진행되었다. 푸른 제복을 입은 이들은 협상 동안 큰 발언 없이 협상 과정을 지켜보다 돌아갔다."
 GEH_event.21.a:0 "새로운 자들이군."

 GEH_event.22.t:0 "임시 동맹"
 GEH_event.22.desc:0 "강대국과의 전쟁이 발발하며 게헨나가 위협받자, 게헨나 학생들은 협상을 통해 내전을 잠시 멈추고 적을 막아내기 위해 서로 협력하기 시작하였습니다.\n하지만 이 동맹이 얼마나 오래갈지는 미지수 입니다."
 GEH_event.22.a:0 "게헨나를 지켜라!"

 GEH_event.23.t:0 "내전 지속"
 GEH_event.23.desc:0 "국방군과의 전쟁이 끝난후 게헨나 연합은 파기되었습니다. 그들이 하나로 뭉쳐질 날은 먼 미래의 일일 것입니다.\n게헨나는 이제 영원히 분열하였습니다. 잠시나마 있던 연합도 이젠 없습니다.\n게헨나의 통일은 평화나 피로써 이루어질 것입니다. 하지만 지금은 때가 아닌것 같군요. "
 GEH_event.23.a:0 "게헨나는 하나다."

 GEH_event.24.t:0 "온천개발부와 협력"
 GEH_event.24.desc:0 "소라사키 히나가 직접 온천개발부와 타협점을 찾기 위해 노력한 끝에 타협점을 찾게 되었고 온천개발부는 적극 협력하기로 했습니다."
 GEH_event.24.a:0 "귀찮지만 잘 됐어."

 GEH_event.25.t: "항복한 온천개발부"
 GEH_event.25.desc: ""
 GEH_event.25.a: "그래"

 GEH_event.26.t:0 "흥신소의 저항"
 GEH_event.26.desc:0 "(대충 흥신소가 최후통첩 거절함)"
 GEH_event.26.a:0 "쓸어버려라!"
 
 GEH_event.27.t: "만마전의 몰락"
 GEH_event.27.desc: ""
 GEH_event.27.a: "그래"

 GEH_event.29.t: "응급의학부"
 GEH_event.29.desc: "응급의학부와 협력하기 위한 회의를 시작하였고 협상안을 흔쾌히 승낙했다는 내용"
 GEH_event.29.a: "좋았어."

 GEH_event.30.t: "미식연구회 문제"
 GEH_event.30.desc: "미식연구회, 평소에도 각 자치구들을 돌아다니며 소란을 일으키고 게헨나의 애물단지와 같은 존재입니다. 이들에 대한 처우를 결정해야 합니다."
 GEH_event.30.a: "말이 통할려나.."

 GEH_event.31.t: "강철 요새"
 GEH_event.31.desc: "게헨나 중앙구에서 남서쪽으로 내려가면, 강철로 된 요새의 총구가 우리를 향해 존재합니다. 지금은 아무도 존재하지 않는 빈 요새에 불과하지만요. 조그마한 문제가 있다면, 우리가 인계로 상륙하는 과정에서 조그마한 상처들이 생겼다는 것입니다. 하지만, 이 정도의 상처는 우리의 기술력으로 고칠 수 있습니다.\n\n강철로 된 요새라고 하여 완벽히 적들을 막아내는 것은 아니지만, 적들의 지연시키고 적들에 공격을 지키는 튼튼한 방패가 될 것입니다. 문제는 이것에 대한 사용 방법입니다. 요새의 위치가 우리의 맨 후방에 존재하는 탓에 최후의 보루로 사용하기엔, 너무나 아쉬운 장소에 있습니다.\n\n희소식이 있다면, 우리 토목부인 온천개발부는 이것을 완벽히 보존한 상태로, 위치를 옮길 수 있다는 것입니다. 하지만 큰 고민이 하나 존재합니다. 이것을 옮긴다면 어디로 옮겨야 할까요?\n\n선택은 당신의 몫입니다."
 GEH_event.31.a: "..."

 GEH_event.32.t:0 "선도부의 끝"
 GEH_event.32.desc:0 ""마코토 의장님의 위대한 지휘 끝에 선도부놈들이 항복했습니다!"\n\n"우리는 게헨나에 대해 너무 몰랐습니다 정말 위대합니다 선배!""
 GEH_event.32.a:0 "음. 역시 완벽해"

 GEH_event.33.t:0 "그 날"
 GEH_event.33.desc:0 "날이 밝았습니다. 온천부는 계획에 발맞춰 움직이고 있고 마지노선을 들어내기 위한 기초 공사를 진행하고 있습니다. 하지만, 아직도 우리는 그 위치를 결정하지 못했습니다. 어디로 해야할까요?"
 GEH_event.33.a:0 "...트리니티."

 GEH_event.34.t: "강철의 게헨나, 강철의 요새"
 GEH_event.34.desc: "게헨나 학생회 히나 의장께서 직접 지휘 감독을 한 끝에 계획은 차질 없이 완벽히 진행되었고 오늘, 그 마지막 계획이 끝남을 보고 받았습니다."
 GEH_event.34.a: "좋았어!"
 GEH_dismantle_maginot_tt: "마지노선의 요새가 완전이 사라지고, 국민정신이 사라진다면 새로운 마지노선이 세워집니다."
 GEH_move_maginot_tt: "트리니티 국경에 요새가 건설됩니다."

 GEH_event.35.t: "연구 지원"
 GEH_event.35.desc: ""
 GEH_event.35.a: "무기"
 GEH_event.35.b: "산업"
 GEH_event.35.c: "전자공학"

 GEH_event.36.t: "한 수 접다."
 GEH_event.36.desc: "미식연구회와 가까스로 회의 날짜가 잡혔지만 미식연구회의 엉뚱한 소리를 듣다가 결국은 히나가 머리를 숙이며 요청하게 된다 결국 미식연구회는 요청을 받아들이거 전보다는 덜 터트리고 다니게 됨"
 GEH_event.36.a: "귀찮아"
 
 GEH_event.38.t: "수복전쟁의 종료"
 GEH_event.38.desc: "수복전쟁은.. 서비스 종료다..!"
 GEH_event.38.a: "그래"
 
 GEH_event.39.t: "매우 큰 문제"
 GEH_event.39.desc: "마코토 어캐 함?"
 GEH_event.39.a: "그러게"

 GEH_event.40.t: "모든 것의 끝 (1/2)"
 GEH_event.40.desc: "트리니티의 항복 이후 조금이라도 이 비윤리적이고 야만적인 전쟁에 책임이 있던 자들은 전범재판을 통해 형장의 이슬로 사라졌다.\n그동안의 희생에 비하면 먼지만큼이나 작은 피가 흐른 뒤에야 평화는 거짓말처럼 찾아왔다.\n\n폐허로 변해버린 게헨나 중앙구의 한 가운데에서 선도부장인 소라사키 히나는 확신할 수 없었다.\n잿더미로 변해버린 이 땅의 모든 것들을 원래대로 되돌리기에 자신의 능력은 너무나도 미약했다.\n\n트리니티의 잔혹하고 연민을 잃은 천사들은 게헨나의 모든 것을 지우려 했다. \n그녀는 처음엔 동요하지 않았다.\n하지만 적들이 점차 선을 넘기 시작하자 그녀 역시 흔들렸다.\n천사들의 뒤로 피 묻은 발자국들이 늘어날수록 히나는 그 모든 것들이 자신의 무력함으로 인한 것이라고 생각하기 시작했다.\n그렇기에 전쟁이 끝났음에도 히나는 여전히 그 안에 속해있었다.\n누구도 그녀를 밖으로 끌어낼 수 없었다.\n그녀의 이름을 부르짖는 망자들의 원망과 스스로를 변호하는 목소리 속에서 히나는 계속 절망이라는 늪지대 속으로 빠져들어갔다.\n\n정돈되지 않은 머리, 축 늘어져 바닥에 질질 끌리는 날개, 초점이 없는 눈, 평소와 달리 작아진 헤일로와 빛을 잃어버린 뿔.\n선임행정관인 아마우 아코가 마주한 선도부장의 모습은 그녀가 기억했던 모습과 달랐다.\n그녀의 눈 앞에 있는 것은 그저 나약하고 슬픔에 빠진 한명의 여자아이었다."
 GEH_event.40.a: "다음으로"
 GEH_event.42.t: "모든 것의 끝 (2/2)"
 GEH_event.42.desc: ""아코…. 제발 돌아가줘…."\n\n"부장님...."\n\n"실망시켜서 미안해… 나는 네 생각처럼 강한 사람이 아니야.. 이젠 너무나도 지쳐버렸어…"\n\n"아니예요 부장님. 저는… 그저 고맙다는 말을 하고 싶었어요."\n\n생각치도 못한 감사의 말에 히나는 고개를 들어 아코를 바라보았다.\n연민이나 비난이 아닌, 그저 감사함과 미안함이 담긴 눈빛이 따스하게 그녀를 바라보고있었다.\n\n"....고맙다고..? 어째서…?"\n\n"늘 모두를 위해 노력해 주셔서 감사하단 말을 하고 싶었어요…. 항상 자신이 져야 할 것보다 많은 짐을 지고 계신데도.. 묵묵히 앞을 향해 걸어가시던 그 모습을 항상 봐왔어요..."\n\n".…."\n\n"부장님이 얼마나 많는 책임을 지고 계셨었는지 다 알지는 못하지만… 이젠 조금이나마 그 짐을 덜어드리고 싶어요."\n\n"아코…."\n\n"앞으로는 제가 함께 짊어질게요, 이제 괜찮아요."\n\n그제서야 소라사키 히나는 깨달았다.\n트리니티가 행한 철저한 파괴 속에서도, 아직 많은 것들이 남아있었음을.\n무너진 건물과 대지 위에, 아직 수많은 학생들이, 게헨나가 살아 숨쉬고 있었다.\n그렇기에 이 모든 걸 다시 쌓아올리는 것은 그녀 혼자만의 일이 아니었다.\n나 혼자 고뇌 할 이유도, 나 혼자 모든 것을 떠안을 필요도 없었다.\n나도 그저 한 명의 게헨나일 뿐이니까.\n\n"...아코."\n\n"네, 부장님?"\n\n"나도.. 아코에게 하고싶은 말이 있어...""
 GEH_event.42.a: "고마웠어. 항상."

 GEH_event.43.t: "만마전에 병합된 독일 국방군"
 GEH_event.43.desc: "만마전이 진행중인 게헨나-국방군 협상에서 국방군이 만마전과 하나가 되기를 선택했다는 소식이 흘러들어오면서 상당한 혼란이 생겨나고 있습니다. 이 협상이 성공적으로 끝난다면 큰 문제가 발생할수도 있습니다."
 GEH_event.43.a: "젠장!"
 GEH_event.43.b: "독일은 이제 게헨나와 하나다."
 GEH_event.43.c: "어서 해결해야해."

 GEH_event.44.t: "게헨나-국방군 협상 파기"
 GEH_event.44.desc: "만마전이 진행중인 게헨나-국방군 협상이 국방군 측에서 협상 실패를 선언하고 나선것을 최근 소식으로 전해들었습니다."
 GEH_event.44.a: "이런."

 GEH_event.45.t: "국방군의 분리독립"
 GEH_event.45.desc: "게헨나-국방군 협상이 마무리됨에 따라 협상 조약에 의거된 영토대로 국방군이 독립하였고 이제 게헨나와 국방군은 서로 다른 길을 걷게 될 것입니다."
 GEH_event.45.a: "씁쓸한 결말이다."

 GEH_event.46.t: "만마전의 연방 제안"
 GEH_event.46.desc: "국방군의 상당한 자율 권한과 동시에 독일인 정부 수립을 허용하는 내용의 연방제 국가 수립 안건이 만마전을 통해 우리에게 전달되었습니다. 우리는 이 안건에 대해 논의하고 답장을 보내야 합니다."
 GEH_event.46.a: "해군의 의견도 구한다."
 GEH_event.46.b: "수락한다."
 GEH_event.46.c: "거절한다."

 GEH_event.47.t: "연방 제안 - 수락"
 GEH_event.47.desc: "국방군은 우리의 의견에 수락하겠다는 내용의 답장을 보내왔습니다."
 GEH_event.47.a: "독일과 게헨나는 하나다!"

 GEH_event.48.t: "연방 제안 - 거절"
 GEH_event.48.desc: "국방군은 우리의 의견을 수용하지 못하겠다는 내용의 서신을 보내왔으며 우리가 제안한 연방제 안건은 거부되었습니다."
 GEH_event.48.a: "그렇다면 협상을 계속하도록 하지"

 GEH_event.49.t: "만마전의 연방 제안 - 우리에게 결정권을 넘긴 육군 사령부"
 GEH_event.49.desc: "독일 국방군은 우리에게 만마전의 제안을 알리고 최종적인 결정 권한을 우리에게 넘겼습니다."
 GEH_event.49.a: "수락한다."
 GEH_event.49.b: "거절한다."

 GEH_event.50.t: "게헨나-독일 협상의 종료"
 GEH_event.50.desc: "만마전은 독일 국방군과 협상을 완료했다고 우리에게 일방적으로 통보했습니다."
 GEH_event.50.a: "우리는 이 결과를 받아들일 수 없다."
 GEH_event.50.b: "...수긍한다."
 GEH_event.50.c: "무슨 일이 벌어지는지 지켜보라고 해라."

 GEH_event.51.t: "하누마 마코토 전 의장의 재신임 투표"
 GEH_event.51.desc: ""...이상으로 하누마 마코토 전 의장의 재신임 투표는 부결된 것으로 처리되었습니다."\n만마전의 지배자이자 최고권력자인 하누마 마코토의 최후는 생각보다 볼품없었다. 그저 재신임 투표 하나가 부결된 것으로 그녀의 시대가 완벽하게 끝나버렸으니 말이다.\n\n"이 마코토 님이...투표에서 졌다고..?"\n전 만마전의 의장, 이제는 평범한 학생이 된 마코토는 그렇게 중얼거렸다.\n뭐, 당연한 일이다. 게헨나 학생들의 저조한 관심으로 유지되던 만마전이고, 이제 게헨나 학생들 또한 상황의 심각성을 알아버렸으니 말이다.\n\n"이건 말도 안 된다! 조작, 조작 투표가 분명해!"\n하누마 마코토는 그렇게 소리 질렀다.\n\n그리고 얼마 지나지 않아 만마전의 의원들은 단 하나의 이탈도 없이 모두 새로운 의장을 선출했다."
 GEH_event.51.a: "원하던 결과야."

 GEH_event.52.t: "독일의 새 지도자"
 GEH_event.52.desc: "게헨나와의 영향력 싸움에서 우리가 우위를 점했고, 이어 독일국이 수립되었습니다. 우리는 이제 독일국을 이끌어나갈 새로운 지도자가 필요하며 이 새로운 지도자는 긴 시간 동안 독일을 통치할 것입니다."
 GEH_event.52.a: "$GER_gerd_von_rundstedt$, 군인 총리"
 GEH_event.52.b: "$GER_karl_donitz$, 새로운 총통"
 GEH_event.52.c: "$GER_albert_speer$, 당의 새 지도자"

 GEH_event.53.t: "나츠메 이로하의 사임"
 GEH_event.53.desc: "게헨나가 겪은 정치적 변화들은 만마전의 임원들에게 큰 충격을 안겨주었다. 만마전이 이제는 게헨나의 유일한 정부가 아니며 권력 대부분을 독일 정부에게 이양해야 했다는 사실은 만마전의 임원들뿐이 아니라도 게헨나의 학생, 아니 키보토스의 시민이라면 모두 충격받고 말 것이다.\n\n하지만 이미 벌어진 일이며, 나츠메 이로하는 이러한 환경에 적응하지 못하고 마코토에게 사임을 선언했다. 3대 학원이자 자유롭고 위대한 게헨나 학원은 이제 존재하지 않을지도 모른다."
 GEH_event.53.a: "나츠메 이로하, 일반 학생"

 GEH_event.54.t: "하누마 마코토 의장의 재신임 투표"
 GEH_event.54.desc: "\"...그리하여, 하누마 마코토의 재신임 투표를 시작하겠습니다.\"\n만마전의 지배자, 그리고 한 명의 의원인 하누마 마코토는 독일 국방군과의 통일 협상에 실패하고, 북부에 가상 적국을 하나 더 만들어낸 책임을 질 수밖에 없었다.\n\n\"이 마코토 님이, 신임받지 못할 수 있다고...?\"\n만마전의 의장, 그리고 현재 게헨나 학생들과 만마전 임원들의 시험을 받게 된 하누마 마코토는 그렇게 중얼거렸다.\n어쩌면... 협상에서 압도적인 우위를 점하지 못한 시점에서 예견된 결과일지도 모른다. 선도부의 예상 외의 반발과 월권, 그리고 국방군의 불협조 속에 시작된 협상일 터이니.\n\n그리고 모두의 집중과 역대 상상을 초월하는 학생들의 관심 -비록 이전이 한 자릿수대였다고 하더라도- 속에, 하누마 마코토의 재신임 투표가 시작되었다."
 GEH_event.54.a: "\"...이상으로 하누마 마코토 의장은 재신임 되었습니다.\""
 GEH_event.54.b: "\"만마전의 임시 의장은 쿄고쿠 사츠키로 결정되었습니다.\""
 GEH_event.54.c: "\"만마전의 행정은 임시로 서기국에서 대행하기로 하였습니다.\""

 GEH_event.55.t: "[GEM.GetName]의 최후 통첩"
 GEH_event.55.desc: "독일 국방군과의 협상을 성공적으로 끝낸 [GEM.GetName]이(가) 우리를 향해 명령을 따르라는 내용의 공문을 보내왔다. 문서에 총사령관으로 서명한 룬트슈테트의 이름을 보고 우리의 지휘부는 상당한 혼란에 빠지고 말았다. 우리가 계획 중이던 독일 탈환 계획은 모두 수포로 돌아간 것으로 추정되며, 심지어 '독일' 이라는 명분도 저들이 가져가고 만 것 같다."
 GEH_event.55.a: "우리는 굴복할 수 밖에 없다."
 GEH_event.55.b: "...다른 활로를 찾아보자"
 GEH_event.55.c: "그 곳으로 가지 않으면 그만인 일."

 GEH_event.56.t: "전쟁해군의 수락"
 GEH_event.56.desc: "우리가 보낸 최후통첩을 전쟁해군은 수락했으며 얼마 지나지 않아 전쟁해군의 최고사령관이 우리와 접촉하고 지휘권을 이양하는 과정을 통해 전쟁해군은 공식적으로 우리의 휘하에 들어오게 되었습니다."
 GEH_event.56.a: "영광스럽군."

 GEH_event.57.t: "전쟁해군의 거절"
 GEH_event.57.desc: "우리가 보낸 최후통첩을 전쟁해군은 거절했습니다. 저들은 긴 시간 보급을 받지 못하고 활동하고 있음에도, 우리를 향한 적대를 포기하지 않은 것 같습니다."
 GEH_event.57.a: "알아서 하라 그래라."

 GEH_event.58.t: "추축국?"
 GEH_event.58.desc: "만마전이 우리와 동맹 관계에 있음에도 불구하고 그들은 독일 민족주의를 수용하고 이내 추축국이라는 거대한 동맹 관계를 구축하려 시도하고 있습니다.\n\n우리는 이들의 행보에 대응하여 저들과 동맹을 파기할지 아니면 추축국이라는 세력에 참여할지를 결정해야 합니다."
 GEH_event.58.a: "만마전과 동맹 관계를 파기해라."
 GEH_event.58.b: "저들과 새로운 질서를 만들어나가자."

 GEH_event.59.t: "선도부의 동맹 파기"
 GEH_event.59.desc: "우리가 독일 민족주의를 수용하고 행한 일련의 행보는 선도부와 외교적 관계가 최악을 향해 나아가는 것에 기여했습니다\n\n선도부는 결국 우리와의 동맹 관계를 파기하기로 했으며 우리는 이제 새로운 적을 상대해야 할지도 모릅니다."
 GEH_event.59.a: "선도부의 변덕은 여전하군."

 GEH_event.60.t: "게헨나의 중재 요청"
 GEH_event.60.desc: "게헨나 학원은 전 총학생회장이 추진하던 에덴 조약을 재추진할 의사를 밝히며 우리에게 중재를 요청했습니다.\n\n우리는 이제 게헨나와 트리니티 간의 외교 문제를 해결할지 아니면 손을 놓을지를 선택해야 합니다."
 GEH_event.60.a: "게헨나와 트리니티의 평화 협정을 중재한다."
 GEH_event.60.b: "우리는 이 문제에 대해 아무것도 할 수 없다."
 GEH_event.60.c: "현재의 트리니티는 확실하게 위험하다."

 GEH_event.61.t: "총학생회의 에덴 조약 재추진"
 GEH_event.61.desc: "최근 게헨나 학원이 전 총학생회장이 추진하던 에덴 조약을 다시 검토하기 시작했으며 생텀 타워가 그것에 가담한 것으로 추정됩니다.\n\n우리는 이 조약을 받아들여 게헨나와의 평화 협상을 시도할지 아니면 조약을 방해하고 현상을 유지할지를 선택해야 합니다."
 GEH_event.61.a: "에덴 조약기구의 수립을 지지한다."
 GEH_event.61.b: "안타깝게도 우리는 그 어떤 연락도 받지 못했다."
 GEH_event.61.c: "게헨나와의 평화 협정은 원하지 않는다."

 GEH_event.62.t: "긍정적인 트리니티의 반응"
 GEH_event.62.desc: "트리니티 측은 우리의 에덴 조약 추진 의사를 긍정적으로 검토하고 있는 것 같습니다. 정확한 내용은 총학생회의 중재가 끝나야 알 수 있으나 현재까지의 반응을 보면 성공적으로 진행 중인 것 같습니다."
 GEH_event.62.a: "성공인가?"

 GEH_event.63.t: "트리니티의 조약 거부"
 GEH_event.63.desc: "총학생회의 중재 시도는 수포로 돌아갔으며 트리니티는 에덴 조약에 대해 강경하게 부정적인 의견을 드러낸 것으로 밝혀졌습니다. 우리는 이제 트리니티와 전쟁을 준비해야 할 수도 있으며 트리니티의 이러한 행동은 총학생회를 우리 편으로 끌어들일 수도 있을 것입니다."
 GEH_event.63.a: "흠."

 GEH_event.64.t: "총학생회의 조약 거부"
 GEH_event.64.desc: "총학생회는 에덴 조약은 이미 실패한 조약이라는 이유로 트리니티와 게헨나간의 복잡한 외교 문제에 얽혀드는 것에 거부감을 표했습니다.\n\n에덴 조약은 트리니티에 전해지기도 전에 수포로 돌아간 것 같습니다."
 GEH_event.64.a: "안타깝군."

 GEH_event.65.t: "총학생회의 방위 조약 제안"
 GEH_event.65.desc: "최근 트리니티 정치 지형의 급격한 변화를 근거로 총학생회는 상호 방위를 제안했습니다.\n\n트리니티의 광적인 사상에 대비한 새로운 형태의 에덴 조약을 우리는 추진할 수 있게 되었습니다."
 GEH_event.65.a: "그거 좋은 생각이군."
 GEH_event.65.b: "우리는 그 것에는 관심이 없다."

 GEH_event.66.t: "게헨나의 방위 조약 수락"
 GEH_event.66.desc: "우리가 제안한 방위 조약을 게헨나 지도부는 수락하기로 했으며 이것으로 우리는 추후 벌어질 거대한 전쟁 속에서 훌륭한 동료를 찾아낸 것 같습니다."
 GEH_event.66.a: "좋아."

 GEH_event.67.t: "게헨나의 방위 조약 거절"
 GEH_event.67.desc: "게헨나는 우리가 제안한 형태의 방위 조약은 관심이 없다는 의견을 표하며 우리의 제안을 거절했습니다."
 GEH_event.67.a: "아쉽군."

 GEH_event.68.t: "에덴 조약 조인식"
 GEH_event.68.desc: "총학생회의 중재 아래에 에덴 조약에 서명하는 날이 바로 오늘입니다.\n\n긴 시간 동안 이어져 온 트리니티와 게헨나의 충돌이 오늘 막을 내리게 될 것입니다."
 GEH_event.68.a: "조약에 서명한다."

 GEH_event.69.t: "주데텐란트 독일인 소요사태"
 GEH_event.69.desc: "게헨나가 독일인을 위한 대량의 양보 조치 이후 그들이 벌인 선전은 우리 국토에 거주하는 독일인에게 상당한 동기를 부여한 것 같습니다.\n\n주데텐란트에 거주하는 독일인들이 거리로 나와 대규모의 시위 행렬을 구성하고 그들에 의해 다양한 방식의 폭동이 발생하고 있습니다."
 GEH_event.69.a: "저들은 언제나 문제가 되는군."

 GEH_event.70.t: "선도부의 전면 철수!"
 GEH_event.70.desc: "우리와 지속적인 갈등을 빚던 선도부가 방금 전 우리에게 일방적으로 치안 유지 활동을 중단하겠다고 통보해 왔습니다.\n\n선도부가 우리 영토에서 철수함에 따라 우리에게 가해지는 치안 부담은 매우 가중될 것으로 추정됩니다."
 GEH_event.70.a: "선도부는 우리를 두려워 하는 것이다."
 GEH_event.70.b: "그들의 위치를 다시 기억시켜주자."

 GEH_event.71.t: "만마전의 선도부 추방!"
 GEH_event.71.desc: "우리와 지속적인 갈등을 빚던 만마전이 방금 전 우리에게 일방적으로 만마전이 통제 중인 영토에서 나가라는 내용의 공문을 보내왔습니다.\n\n만마전이 우리를 추방한 것은 우리와의 전쟁을 준비하는 것일 수 있습니다. 우리는 다가오는 게헨나의 혼란을 막아내야만 합니다."
 GEH_event.71.a: "도대체 왜?"
 GEH_event.71.b: "계획을 더 빠르게 진행시킬 필요가 있다."

 GEH_event.72.t: "게헨나에서의 회유"
 GEH_event.72.desc: "다른 세계에서 넘어온 게헨나 학원이 트리니티와의 적대를 공공연하게 선언한 이후 우리에게 영토 손실을 근거로 게헨나가 트리니티와 전쟁에 돌입할 시 참전할 것을 요청했습니다.\n\n게헨나 학원은 트리니티와의 국력 차이를 외교적 해법으로 돌파해 보려는 시도가 있는 것 같으며 우리는 이 조약을 통해 잃어버린 영토를 복원할 기회를 마련할 수 있습니다."
 GEH_event.72.a: "좋은 생각이다. 지금은."
 GEH_event.72.b: "위험천만한 발상이군."

 GEH_event.73.t: "폴란드의 조약 수락"
 GEH_event.73.desc: "[POL.GetName](은)는 우리가 제안한 회유를 받아들였으며 이후 벌어질 게헨나와 트리니티 간의 전쟁에서 우리 편으로 참전하겠다는 내용의 조약을 발인했습니다."
 GEH_event.73.a: "좋아. 아직까지는."

 GEH_event.74.t: "폴란드의 조약 거절"
 GEH_event.74.desc: "[POL.GetName](은)는 우리가 제안한 내용은 폴란드의 국운을 위험하게 만들 수 있다는 이유로 거절했습니다."
 GEH_event.74.a: "큰 기대하지 않았어."

 GEH_event.75.t: "게헨나와 폴란드의 전쟁 돌입"
 GEH_event.75.desc: "이전의 게헨나와 맺은 조약에 따르면 지금 상황에서 폴란드는 트리니티를 상대로 전쟁에 돌입해야 합니다. 물론, 조약 당시와는 국제 정세가 큰 규모로 변한 만큼 우리는 조약을 무시할 수 있습니다."
 GEH_event.75.a: "우리는 조약을 준수한다."
 GEH_event.75.b: "..."
 GEH_event.75.c: "저거, 게헨나가 침략한거 아닌가?"

 GEH_event.76.t: "폴란드의 참전!"
 GEH_event.76.desc: "[POL.GetName](은)는 이전에 맺은 조약에 따라 트리니티와 전쟁 중인 우리 편으로 참전했습니다!\n\n폴란드의 이와 같은 행동은 트리니티와의 전쟁에서 우리에게 큰 이점을 가져다 줄 것입니다!"
 GEH_event.76.a: "그들의 정직함에 감사하자."

 GEH_event.77.t: "폴란드의 조약 파기"
 GEH_event.77.desc: "이전에 맺은 조약에 따르면 [POL.GetName](은)는 현재와 같은 상황에서는 우리의 전쟁을 도와 참전해야 합니다. 그러나 [POL.GetName](은)는 국제 정세의 변화와 조약의 재해석을 근거로 우리의 전쟁에 참전하지 않겠다는 의사를 통보해 왔습니다."
 GEH_event.77.a: "도움도 안 됐을 놈들이."

 GEH_event.78.t: "군대 개혁"
 GEH_event.78.desc: "우리의 지속적인 노력의 결과로 [GEM.GetName]의 군사적 작전 능력을 개선했습니다. 이제 우리는 더 나은 군대를 가지게 되었으며, 이를 바탕으로 더 나은 작전을 입안할 수 있습니다."
 GEH_event.78.a: "계속 해라."

 GEH_event.100.t: "에덴 결전 - 샛별의 비상"
 GEH_event.100.desc: "수백 년 전, 사소한 분쟁에서 비롯된 갈등은 결국 두 학원의 운명을 가르는 전면전으로 번졌습니다.\n\n침략자 트리니티는, 게헨나를 무너뜨리는 데 몇 주면 충분하다고 확신했습니다. 그들은 수적으로, 기술적으로 우세했고, 자신들의 승리를 의심하지 않았습니다. 그러나 그들이 간과한 것이 하나 있었으니 게헨나 학생들의 자발적인 분노, 단결, 그리고 무엇보다도 '자유'에 대한 갈망이었습니다.\n\n게헨나의 학생들은 무기를 들고 일어섰습니다. 수업 대신 전장을 택했고, 책상 대신 참호에 몸을 던졌습니다. 그들의 전투는 단순한 학원의 방어가 아니었습니다. 그것은 정체성의 투쟁이자, 살아있음을 증명하는 투쟁이었습니다.\n\n게헨나의 붉은 깃발은 그 어떤 탄압 속에서도 꺾이지 않았고, 마침내 그들은 트리니티의 심장부 에덴에 도달했습니다. 거기서 벌어진 마지막 전투는 치열했고, 수많은 희생이 따랐지만 마침내 트리니티는 무릎을 꿇었습니다. 그들의 오만은 패배로 갚아졌고, 게헨나는 승리했습니다.\n\n하지만 이 승리는 값비싼 것이었습니다. 도시는 무너졌고, 거리에는 전쟁의 흔적이 남았습니다. 친구를 잃은 자리엔 침묵이 드리웠고, 학원은 황폐해졌습니다. 그러나 게헨나는 살아남았습니다. 그리고 무엇보다, '자유'를 지켜냈습니다.\n\n이제 그들은 다시 일어설 것입니다. 잔해 위에 새로운 학교를 세우고, 쓰러진 동료들의 이름을 기억하며 앞으로 나아갈 것입니다. 게헨나의 자유는 한때 위태로웠으나, 이제는 피로 쟁취한 신념이 되었습니다. 그리고 그 신념은, 다시는 꺾이지 않을 것입니다."
 GEH_event.100.a: "영원하리라!"

 GEH_event.41.t: "트리니티의 항복"
 GEH_event.41.desc: "트리니티가 우리의 진격아래에 항복하였고 미소노 미카와 그의 잔당들은 흔적도 없이 사라졌습니다. 그녀를 대신한 다른 파테르 분파의 일원이 대신 항복 문서에 서명을 하며 게헨나 - 트리니티 전쟁은 공식적으로 종료 되었습니다.\n\n트리니티와 전쟁에서 우리는 수많은 피를 흘렸지만, 다시 한 번 게헨나를 지켜내는데 성공하였고 모든 기적은 지금부터 시작 될 것입니다."
 GEH_event.41.a: "끝맺음"
