 GEM_security_militia_desc: "The Pandemonium Legion is a loyal private military organization operated by the Pandemonium Society. We will expand this organization to secure insufficient military strength and minimize threats behind the front lines."
 GEM_coerced_loyalty: "Coerced Loyalty"
 GEM_coerced_loyalty_desc: "The soldiers of the Pandemonium Legion must be more loyal to Pandemonium and Gehenna than any other organization and must be able to burn themselves for their great mission. We will make them so."
 GEM_honor_and_glory: "Honor and Glory"
 GEM_honor_and_glory_desc: "Every soldier in the Legion will have a more honorable and glorious fate than any other soldier in Gehenna. Street leaflets and Pandemonium broadcasts will continuously praise them."
 GEM_great_duty: "Great Duty"
 GEM_great_duty_desc: "Every Gehenna student carries a great duty. As the strongest academy and the toughest students, we will remain loyal to Gehenna forever."
