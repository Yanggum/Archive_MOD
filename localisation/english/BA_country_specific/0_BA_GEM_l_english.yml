 GEM_gehenna_unification_promotion:0 "Promotion of Pan-Gehenna Unification"
 GEM_war_preparations: "War Preparations"
 GEM_war_preparations_desc: "To fully prepare for the coming war, preparations must be made not only in Pandemonium but also in the industry and infrastructure of all of Gehenna."
 GEM_prepare_for_the_next_blockade_ww: "Prepare for National Isolation"
 GEM_prepare_for_the_next_blockade_ww_desc: "If our nation enters into a war with other nations, many diplomatic relations will change and be severed. If we thoroughly prepare for a decisive battle on German territory, diplomatic isolation will have little effect on us."
