 GEH_state_stress_category: "게헨나 국정 운영"
 GEM_motion_of_no_confidence_against_leader: "[ROOT.GetLeader] 의장 불신임 결의"
 GEM_motion_of_no_confidence_against_leader_desc: "[ROOT.GetLeader](은) 우리 국가가 직면한 문제를 해결하기 위해 충분한 노력을 하지 않았으며, 이 사실이 변하지 않을 것이라는 점은 명백합니다. 이 무능한 지도자를 축출하기 위해 불신임 투표를 해야 할 때입니다."
 GEM_balance_of_power_event_chairman_ouster_tt: "§Y만마전 의장 교체§!를 위한 §G사건§!이 발생할 것입니다."
 GEM_organize_the_opposition: "반대파 조직"
 GEM_organize_the_opposition_desc: "정부는 자신의 약속을 이행하지 못했고 그에 따라 처리되어야 합니다. 반대파를 단일화해 지지를 모으고 [ROOT.GetLeader](을)를 비난할 때입니다."
 GEM_appeal_to_the_geh_spirit: "게헨나 정신 자극"
 GEM_appeal_to_the_geh_spirit_desc: "우리는 역경에 맞서는 게헨나 학생의 특별한 결단력, 회복력과 강인함에 호소해야 합니다. 게헨나 자치구의 모든 국민은 모든 역경을 극복하기 위해 함께 노력해야 합니다. 우리의 자유-게헨나 공동체는 우리를 강하게 만듭니다!"
 GEM_entice_the_masses: "대중 선동"
 GEM_entice_the_masses_desc: "대중은 쉽게 흔들립니다. 가슴에 와닿는 작은 문제를 해결하겠다고 약속함으로써 우리 정부는 쉽게 일반 게헨나 사람에게 더욱 매력적으로 다가오고 호감을 살 수 있습니다."
 GEM_organize_the_opposition_cost_increase_tt: "\n§Y$GEM_organize_the_opposition$§!의 결정 비용이 §Y[?GEM_bop_decision_cost_multiplier]§!만큼 §R곱해질§! 것입니다.\n"
 GEM_appeal_to_the_geh_spirit_cost_increase_tt: "\n§Y$GEM_appeal_to_the_geh_spirit$§!의 결정 비용이 §Y[?GEM_bop_decision_cost_multiplier]§!만큼 §R곱해질§! 것입니다.\n"
 GEM_entice_the_masses_cost_increase_tt: "\n§Y$GEM_entice_the_masses$§!의 결정 비용이 §Y[?GEM_bop_decision_cost_multiplier]§!만큼 §R곱해질§! 것입니다.\n"
 GEM_motion_of_no_confidence_cost_tt: "§Y$GEM_motion_of_no_confidence_against_leader$§! 결정 비용: £pol_power $RIGHT|0Y$."
 GEM_motion_of_no_confidence_cost_unavailable_tt: "§Y$GEM_motion_of_no_confidence_against_leader$§! 결정을 사용할 수 없게 됩니다."

 GEH_GEM_armistice:0 "게헨나 휴전 협상"
 GEH_GEM_armistice_desc:0 "게헨나 학원이 강대한 전쟁에 돌입함에 따라 우리는 내전을 중지하고 적에 대항하는 연합 전선을 구축해야 합니다."
 GEH_GEM_armistice_tt:0 "§Y$GEH_GEM_armistice$§! 결정을 완료한 학원은 서로 즉시 §Y전쟁§!을 중단합니다."
 
 GEH_GEM__war_with_TRM:0 "트리니티 대항 전쟁 선포"
 GEH_GEM__war_with_TRM_desc:0 "트리니티 종합학원이 우리 학원의 일부인 국가를 침공했습니다. 우리는 게헨나를 수호하기 위해 트리니티 종합학원에 대한 선전포고를 감행해야 합니다."

 GEM_surrender:0 "영토 포기 합의"

 GEM_gehenna_national_reconquest: "게헨나 국가 재수복"
 GEM_gehenna_national_reconquest_desc: "큰 실패 이후 우리는 게헨나 학원의 영토를 일부 소실했으며, 독일 통일이라는 거대한 이데올로기를 소유한 국가를 북방의 위협으로 만들어냈습니다. 이 위협적인 상황에서 벗어나고 국가를 안정화하기 위해서는 우리는 이들을 강제적으로라도 제압하고 게헨나 학원과 독일 영지 전체의 헤게모니를 통일해야 합니다."
 GEM_gehenna_national_reconquest_decision: "독일 헤게모니 찬탈"

 GEM_gehenna_national_reconquest_orign: "[ROOT.GetAdjective] 국가 재수복"
 GEM_gehenna_national_reconquest_orign_desc: "[ROOT.GetAdjective] 전체의 미수복 영토를 병합하기 위한 거대한 투쟁을 이어가야 합니다. 모든 [ROOT.GetAdjective] 영지가 우리의 손에 들어올 때 까지, 우리는 행동할 것입니다."
