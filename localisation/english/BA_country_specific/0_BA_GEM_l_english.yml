#Focuses
 GEH_warning_wuiongwuiong:0 "Pandemonium Emergency Convocation"
 GEH_warning_wuiongwuiong_desc:0 "As Kivotos was transferred to another world, the students of Gehenna fell into chaos.\nA daily life different from the past, the weakened mystery of the Halos... Chairman Makoto has decided to urgently convene Pandemonium, Gehenna's student council."
 GEH_hyungzipa_ak:0 "On-site Investigation"
 GEH_hyungzipa_ak_desc:0 "As a result of the emergency meeting, which was pure chaos, Pandemonium decided to go out for an on-site investigation.\nMakoto, believing that it is the Chairman's duty to directly inspect and look after the voters, leaves the building with the Pandemonium executives."
 GEH_gukbanggun_problem:0 "The Wehrmacht Problem"
 GEH_gukbanggun_problem_desc:0 "While Pandemonium executives were assessing the situation, several executives who had gone north from the Central District came running back in a hurry, starting to explain about an armed force they had never seen before.\nWho on earth could they be?"
 GEH_warning_sunjun:0 "Declaration of Emergency"
 GEH_warning_sunjun_desc:0 "The new environment was not kind to us. Terrorism occurring everywhere and the fall of the Northern Campus. Makoto, as the Chairman of Gehenna, has made a decision.\nToo much has changed since coming to this other world.\nTo calm this chaos and return to daily life, this is an unavoidable decision."
 GEH_nego_whit_wehrmacht_new:0 "Negotiations with the Wehrmacht"
 GEH_nego_whit_wehrmacht_new_desc:0 "Contact with them is an inescapable fate.\nIn that case, Pandemonium has judged that cooperating is more suitable for the current situation than fighting.\nChairman Makoto began looking for students within Gehenna who had studied archaic languages,\nand decided to proceed with negotiations with their help."
 GEH_subjugation:0 "Attack the Remnants"
 GEH_subjugation_desc:0 "The Wehrmacht in the north has been unable to secure major supplies for a long time since the German government disappeared. Unlike at first, they have weakened significantly; by attacking them, we can move a step closer to maintaining order in Gehenna."
 GEM_Neutralize_Makoto:0 "Neutralize Makoto"
 GEM_Neutralize_Makoto_desc:0 "Chairman Makoto of Pandemonium was not a reliable figure even before the Great Transfer, but after the transfer, she continues to make remarks and actions that pose a significant threat to Pandemonium and Gehenna Academy. We will separate Chairman Makoto from official duties and take temporary measures."
 GEM_maintaining_dictatorship:0 "The Chairman's Rule and Unitary Governance"
 GEM_maintaining_dictatorship_desc:0 "\"With the great leadership and resolve of I, Makoto-sama, the chaos of Gehenna will be perfectly overcome!\"\n- From Chairman Makoto's speech\n\nThe joint governance system of Pandemonium, the legitimate leadership body of Gehenna Academy, will now operate!"
 GEM_gehenna_academy:0 "Gehenna First"
 GEM_gehenna_academy_desc:0 "Collusion with other external forces clearly harms the identity of Gehenna Academy. Pandemonium will prioritize Gehenna Academy and strive to handle all external threats."
 GEM_perfect_team_disbanded:0 "Dissolution of the Prefect Team"
 GEM_perfect_team_disbanded_desc:0 "Now is the chance to finish off the Prefect Team once and for all. We will remove the Prefect Team that stands in the way of Pandemonium and Chairman Makoto this very moment, and achieve a unified Gehenna Academy."
 GEM_working_with_the_perfect_team:0 "One Gehenna"
 GEM_working_with_the_perfect_team_desc:0 "In order for Gehenna Academy to respond to external threats, close cooperation between the Prefect Team and Pandemonium is essential."
 GEM_ultimatum_to_the_war_navy:0 "Ultimatum to the Kriegsmarine"
 GEM_ultimatum_to_the_war_navy_desc:0 "Now that the Wehrmacht has integrated with us following the Gehenna-Wehrmacht negotiations, we will propose to the Kriegsmarine, who fled to Gotland, that they join us."
 GEM_food_supply_network:0 "Food Supply Network"
 GEM_food_supply_network_desc:0 "Since Gehenna Academy has dropped into a new place, we need to create a new food supply network. This should also resolve the disturbances caused by the Gourmet Research Society to some extent."
 GEM_digging_new_hot_springs:0 "Developing New Hot Springs"
 GEM_digging_new_hot_springs_desc:0 "The Hot Springs Development Department is pressuring Pandemonium to invest in a new hot spring development project. We can stop their destructive activities by approving their actions and adding a bit of financial support."
 GEM_stable_food:0 "Stable Food Supply"
 GEM_stable_food_desc:0 "\"If the school lunch tastes bad, it's a rebellion waiting to happen! We must ensure a steady flow of high-quality ingredients to keep the students—and the Gourmet Research Society—satisfied.\""
 GEM_upscale_strategy:0 "Upscaling Strategy"
 GEM_upscale_strategy_desc:0 "To satisfy the demanding palates of the Gourmet Research Society, the School Lunch Club will produce several types of high-end school meals."
 GEM_hot_spring_tourism:0 "Hot Spring Tourism"
 GEM_hot_spring_tourism_desc:0 "By letting the Hot Springs Development Department operate a hot spring tourism business, we can divert their explosive energy elsewhere."
 GEM_club_of_gehenna:0 "Clubs of Gehenna!"
 GEM_club_of_gehenna_desc:0 "Despite various incidents, all Gehenna clubs are operating without issue. The club system of Gehenna will remain steadfast in the future."
 GEM_union_state:0 "Federal State"
 GEM_union_state_desc:0 "The agenda discussed in the Gehenna-Wehrmacht negotiations, the German-Gehenna Federation, has been successfully finalized and established. Now, Germany and Gehenna will operate as a single federal state and possess equal rights."
 GEM_german_wehrmacht:0 "German Wehrmacht"
 GEM_german_wehrmacht_desc:0 "In the previous negotiations, the Wehrmacht agreed to join Gehenna Academy in exchange for gaining substantial autonomous authority. We must think of ways to utilize the newly joined Wehrmacht."
 GEM_luftwaffe:0 "Luftwaffe Integration"
 GEM_luftwaffe_desc:0 "The German Air Force, whose chain of command has been completely broken, can be integrated into Gehenna Academy using the connection with the Wehrmacht. Although not everyone will follow us, joining even a part of the Luftwaffe will help solve our aerial gaps."
 GEM_general_staff:0 "General Staff"
 GEM_general_staff_desc:0 "Starting with the revival of the German staff organization, we will restore the systems previously held by the German Wehrmacht."
 GEM_systematic_training_system:0 "Wehrmacht Training System"
 GEM_systematic_training_system_desc:0 "We will train Gehenna students by modeling the training system of the German Wehrmacht, which showed great performance in combat against us despite lacking Halos."
 GEM_german_officer_corps:0 "German Officer Corps"
 GEM_german_officer_corps_desc:0 "While it is true that many Wehrmacht generals defected in protest of the integration with Gehenna, we were able to absorb a significant number of the Wehrmacht general staff."
 GEM_creation_of_the_gehenna_wehrmacht:0 "Creation of the Gehenna Wehrmacht"
 GEM_creation_of_the_gehenna_wehrmacht_desc:0 "We will create Gehenna's army based on the Wehrmacht system, which will significantly improve the combat capabilities of Gehenna students."
 GEM_joint_staff:0 "Joint Chiefs of Staff"
 GEM_joint_staff_desc:0 "A system where the German and Gehenna armies coexist will significantly reduce wartime operational capabilities. To solve this problem, we will establish the Joint Chiefs of Staff to greatly improve Gehenna Academy's operational capabilities."
 GEM_gehenna_militarism:0 "Gehenna Militarism"
 GEM_gehenna_militarism_desc:0 "To respond to foreign threats, we will expand the military on a large scale and induce unity between Gehenna students and Germans within the military through various propaganda and education."
 GEM_solitary_force:0 "Barrier Troops"
 GEM_solitary_force_desc:0 "Regrettably, we must admit that the disposition of Gehenna students does not fit the military. To improve the combat capabilities of Gehenna students, we will deploy barrier troops, and desertion will be strictly punished."
 GEM_reorganization_of_the_private_army:0 "Private Army System Reorganization"
 GEM_reorganization_of_the_private_army_desc:0 "We will expand the existing private army system of Pandemonium on a large scale and reorganize it into an army that protects all of Gehenna. Through this process, we can restore Gehenna's military capabilities to normal."
 GEM_crazy_heroism:0 "Fanatical Heroism"
 GEM_crazy_heroism_desc:0 "Through propaganda, we will cultivate Pandemonium warriors who charge fearlessly on the front lines. Our war heroes will be praised endlessly, and their glory will be passed down for generations."
 GEM_pandemonium_assault_unit:0 "Pandemonium Assault Unit"
 GEM_pandemonium_assault_unit_desc:0 "We will improve Gehenna Academy's military capabilities by fostering paramilitary organizations that cooperate with our military."
 GEM_inhumane_tactics:0 "Human Wave Offensive"
 GEM_inhumane_tactics_desc:0 "A Halo is not destroyed by ordinary attacks. Deploying more students rather than tedious training will improve Gehenna's combat power more quickly and strongly."
 GEM_superiority_of_will:0 "Superiority of Will"
 GEM_superiority_of_will_desc:0 "Heroes are born on the battlefield. We can perfectly carry out the ideological education of the Gehenna student army through various propaganda and repetitive training."
 GEM_war_with_trinity:0 "War with Trinity"
 GEM_war_with_trinity_desc:0 "Weak responses cannot break the ill-fated relationship with Trinity. The endless clashes and deep emotional rift between Gehenna and Trinity will now come to a complete end."
 GEM_help_perfect_team:0 "Cooperate with the Prefect Team"
 GEM_help_perfect_team_desc:0 "Now that Trinity is marching toward our heart, we must accept all the help we can get. Even if the target is the hostile Prefect Team."
 GEM_ethnic_hatred:0 "Utilize Hatred"
 GEM_ethnic_hatred_desc:0 "The deep emotional rift between the two academies over a long period is a great help to our war. The students of Gehenna are furious at Trinity's atrocities and are actively cooperating in our war."
 GEM_march_of_the_demons:0 "March of the Demons"
 GEM_march_of_the_demons_desc:0 "It is time to cut off Trinity's breath. We must prepare a full-scale counter-offensive and march toward that treacherous Trinity."
 GEM_unlimited_conscription:0 "Remove Conscription Restrictions"
 GEM_unlimited_conscription_desc:0 "Pandemonium has just resolved a bill that allows for the unlimited mobilization of not only Gehenna students but also local Germans into our war."
 GEM_defend_gehenna:0 "Defend Gehenna"
 GEM_defend_gehenna_desc:0 "We must respond to Trinity's surprise attack. We must buy time for our army to reorganize and block the invasion of those winged lunatics."
 GEM_sorting_out_the_maginot:0 "Mopping Up the Maginot Garrison"
 GEM_sorting_out_the_maginot_desc:0 "It is time to thoroughly mop up and destroy the French forces of the Maginot Line, who are holed up in their fortresses."
 GEM_natsume_iroha:0 "The Reformist of Pandemonium!"
 GEM_natsume_iroha_desc:0 "The person suitable as the leader of the new Pandemonium would be Gehenna's promising tank commander, Natsume Iroha."
 GEM_motomiya_chiaki_focus:0 "Expansion of the Secretariat"
 GEM_motomiya_chiaki_focus_desc:0 "The Secretary of Pandemonium, Motomiya Chiaki, will lead the new leadership."
 GEM_manmajeon_secretariat_founding: "Establishment of the Pandemonium Secretariat"
 GEM_press_agencies_integration: "Integration of Various Press Agencies"
 GEM_weekly_manmajeon_expansion: "Expansion of Weekly Pandemonium"
 GEM_publicity_director_chiaki: "Publicity Director Chiaki"
 GEM_public_opinion_censorship: "Public Opinion Censorship"
 GEM_ibuki_cf: "Ibuki's CF Filming"
 GEM_dignified_nation: "Dignified Nation"
 GEM_group_leadership_system:0 "Pandemonium's Decision"
 GEM_group_leadership_system_desc:0 "Pandemonium has agreed to oust Makoto. Pandemonium will now prepare to elect a new Chairman."
 GEM_pandemonium_reform:0 "Pandemonium Reform"
 GEM_pandemonium_reform_desc:0 "The new leadership of Pandemonium will correct the existing lax administration and reduce wasted budget."
 GEM_pandemonium_expansion:0 "Expansion of Pandemonium Executives"
 GEM_pandemonium_expansion_desc:0 "Iroha began organizing new Pandemonium executives on a large scale to share her workload."
 GEM_local_government_takeover:0 "Takeover of State Governments"
 GEM_local_government_takeover_desc:0 "By taking over the German state governments, we can weaken Pandemonium's administrative burden and easily secure control over local governments."
 GEM_local_autonomy:0 "Local Autonomy"
 GEM_local_autonomy_desc:0 "For Pandemonium to establish control over all of Gehenna requires a significant administrative burden. We will actively support a local autonomy system to seek peaceful coexistence between Gehenna and Germany."
 GEM_social_reorganization:0 "Protecting German Identity"
 GEM_social_reorganization_desc:0 "Natsume Iroha will respect German identity and use it to transform Gehenna into a new academy."
 GEM_united_states_of_gehenna:0 "United States of Gehenna"
 GEM_united_states_of_gehenna_desc:0 "The new system of Gehenna, composed of state governments and Pandemonium, will be known as the United States of Gehenna. The democratically elected German parliament and Pandemonium will build a healthy academy through mutual cooperation and checks and balances."
 GEM_ruler_of_gehenna:0 "Ruler of Gehenna"
 GEM_ruler_of_gehenna_desc:0 "\"The great ruler of Gehenna is none other than I, Hanuma Makoto. Everyone, follow my lead.\"\n- From Chairman Makoto's second speech"
 GEM_cultural_dominance:0 "Dominance over Popular Culture"
 GEM_cultural_dominance_desc:0 "Chairman Makoto has informed us that only by dominating Gehenna's popular culture can one truly rule Gehenna. The members of Pandemonium will take over cultural dominance of Gehenna according to Chairman Makoto's will."
 GEM_bodyguard:0 "Creation of the Pandemonium Guard"
 GEM_bodyguard_desc:0 "Due to the enormous power held by the Chairman, if the Chairman were to be attacked and unable to perform duties, Pandemonium's administrative processing would become extremely complex and chaotic. We have decided to organize a guard department following Chairman [GEM.GetLeader] to prevent such a situation."
 GEM_suppression_of_german:0 "Suppression of Resistance"
 GEM_suppression_of_german_desc:0 "Resistances opposing our academy are active in various places. We will eliminate them to create temporary public security stabilization."
 GEM_policing:0 "Exercise of Policing Power"
 GEM_policing_desc:0 "Some Gehenna clubs are lowering Pandemonium's administrative processing capabilities through radical actions. We will suppress their activities to improve Pandemonium's dominance."
 GEM_dissolution_of_state_government:0 "Forced Dissolution of State Governments"
 GEM_dissolution_of_state_government_desc:0 "Pandemonium will now forcibly dissolve state governments and directly begin control over local regions. The new administrative reorganization will be accompanied by some confusion, but the gains will surpass all of that."
 GEM_gehenna_identity:0 "Unitary Regime"
 GEM_gehenna_identity_desc:0 "The bizarre system where the German state governments and the Pandemonium academy government coexisted is now over. The dual government will collapse, and Pandemonium will act as the sole unitary regime in the Gehenna region."
 GEM_take_control_of_pandemonium:0 "Seize Control of Pandemonium"
 GEM_take_control_of_pandemonium_desc:0 "Hanuma Makoto has recently been separated from various practical affairs, but her influence on Pandemonium and all of Gehenna remains enormous. We have succeeded in neutralizing Makoto's various powers, and now it is time to officially drag Hanuma Makoto from the seat of Pandemonium Chairman and set Gehenna's politics right."
 GEM_budget_reorganization:0 "Budget Reorganization"
 GEM_budget_reorganization_desc:0 "The start of the work to restore Pandemonium's administrative work is to re-examine all allocated budgets. It is time to save the budget being wasted in all directions by Hanuma Makoto's orders."
 GEM_tanga_ibuki:0 "...Ibuki?"
 GEM_tanga_ibuki_desc:0 "Um, Tanga Ibuki says she wants to try being the Chairman of Pandemonium."
