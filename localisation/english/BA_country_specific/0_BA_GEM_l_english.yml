 GEH_individualism_german:0 "독일 국방군"
 GEM_ethnic_hatred_idea:0 "트리니티에 대한 증오심"
 GEM_attack_order_idea:0 "마코토의 공격 명령"
 GEM_ethnic_hatred_idea_2:0 "증오 활용"
 GEM_ethnic_hatred_idea_3:0 "악마들의 행진"
 GEH_Manmajun_bodyguard:0 "만마전 보위부"
 GEH_Manmajun_bodyguard_desc: "만마전 보위부는 [GEM.GetLeader]를 향한 여러 테러 공작을 방어하기 위해 존재하는 직속 첩보 부대입니다."
 GEH_shadow_of_makoto:0 "마코토의 그림자"
 GEH_state_government_remove_idea:0 "주 정부 해체"
 GEH_schutzstaffel_idea:0 "친위대 (Schutzstaffel)"
 GEH_local_autonomy_idea:0 "자치 권리 보장"
 GEH_local_autonomy_idea_desc:0 "만마전의 새로운 의장인 나츠메 이로하는 독일의 지방에서 이루어지는 여러 가지 자치 행정 활동을 법제화시켜 보호했습니다."
 GEH_united_states_of_gehenna_idea:0 "합중국 (United States)"
 GEH_united_states_of_gehenna_idea_desc:0 "나츠메 이로하의 지도하에 게헨나는 여러 주의 연합 형태인 게헨나 합중국으로 재탄생되었습니다. 주 정부의 지도자는 각 주에서 선거를 통해 선출하고 선출된 주지사는 독일 의회에 의석을 얻고 만마전과 상호 견제와 협력을 통해 게헨나를 이끌어 나갈 것입니다."
 GEH_unstable_integration_idea:0 "불안정한 통합"
 GEH_unstable_integration_idea_desc:0 "게헨나와 국방군의 통합은 긴 협상 끝에 맺어졌으나, 학생과 시민의 깊은 갈등의 골은 여전히 메워지지 않았습니다. 우리는 두 집단의 균형을 적절하게 유지해야 할 것입니다."
 GEH_prussian_idea:0 "프로이센 군인"
 GEH_individualism_2: "군대 개혁"
 GEH_individualism_2_7: "게헨나 육군"
 GEH_individualism_2_7_desc: "게헨나의 육군은 사병 조직을 기반으로 한 특이한 형태로 구성되어 있습니다. 물론, 그에 따른 대가로 중앙 병력의 약화를 불러왔으나, 강력한 군사력을 보유한 것은 분명합니다."
 GEH_political_turmoil:0 "정치적 혼란"
 GEH_political_turmoil_desc:0 "현재 게헨나 학원은 마코토를 둘러싼 정치적 갈등에 놓여있습니다. 이로하를 주축으로 한 개혁파는 마코토의 축출과 게헨나의 재건을, 사츠키와 치아키를 비롯한 보수파는 마코토의 의장직을 수호하기를 원합니다.\n\n이러한 게헨나의 갈등 상황은 혼란스러운 게헨나를 더 혼란스럽게 만들 뿐이며 심각한 위협을 초래할 수 있습니다."
 GEH_sudetenland_disturbances:0 "주데텐란트 소요사태"
 GEH_sudetenland_disturbances_hard:0 "극심한 주데텐란트 소요사태"
 GEH_nazism_4_idea:0 "제4제국"
 GEH_nazism_4_idea_desc:0 "잿더미를 파헤치고 추방당한 군대가 다시 한번 조국의 영토를 밟았습니다. 모든 것이 무너진 폐허 위에서 독일인의 국가를 선언하고 이 땅에 독일이 돌아왔음을 선언했습니다.\n\n그리고 독일의 완전한 통일을 이뤄낼 그날까지 국방군은 전진하고 다시 전진할 것입니다."
 GEH_nazism_alt_idea:0 "두 파벌의 정치"
 GEH_nazism_alt_idea_desc:0 "마침내, 두 세계에서 하나의 국가로 마주친 두 파벌이 당당하게 서로를 마주 보는 정치가 시작되었습니다. 상생, 협치, 양보.... 좋은 말이지만 지금은 중요하지 않습니다. 두 파벌은 공동의 목표를 향해 손을 잡고 있고. 목표가 끝난다면 이제 두 파벌은 떨어질 수 없을 것입니다.\n\n그리하여, 모든 이들의 이상을 담아 생겨난 가장 추악한 국가는 계속해서 전진할 것입니다. 이상과 이상의 교차점이 항상 아름답진 않으니까요."
 GEH_separation_law_1:0 "독일인 분리 법안"

