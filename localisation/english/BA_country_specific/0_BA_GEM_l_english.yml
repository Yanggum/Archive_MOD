 GEM_club_problem_decision_desc:0 "Among the §YGehenna Academy§! §GClubs§!, two have been a headache for all of §YGehenna Academy§! since before the Great Migration. The §3Hot Spring Development Department§! causes widespread destruction in the name of developing hot springs, and the §pGourmet Research Society§!, which has grown rapidly since the migration, carries out terrorism against locals under the support of anti-German hardliners in Gehenna, nitpicking German street food.\n\nThe clubs' terrorist acts are causing major setbacks in the management of §YGehenna Academy§!, but later we will be able to reap various benefits through §GCooperation§! or §RSuppression§! with these clubs, and the stabilization of §YGehenna Academy§! will be achieved by our hands."

