 gem_club_problem_hot_spring_department_progress_point_1_tt: "§Y호의§! 단계 (§Y환심§! §G25§! 이상):\n - 호의 단계에 도달하면 선택 지역의 건설 속도를 증가시키는 §Y온천 개발 유도§! 결정이 해금됩니다.\n\n도달 시 효과:\n£decision_icon_small §Y결정 해금§!: 헤센 지역 온천 개발 유도"

 gem_club_problem_gourmet_research_society_progress_point_2_tt: "§Y협조§! 단계 (§Y환심§! §G55§! 이상):\n - 협조 단계에 도달하면 §Y미식연구회 부장§!을 정치고문으로 등용할 수 있게 됩니다.\n\n도달 시 효과:\n§Y정치 고문§!으로 §G사용 가능§!:\n'§Y쿠로다테 하루나§!' 효과:\n - 매일 정치력 획득 §G+0.15§!\n - 전쟁 지지도: §G+10.00%§!\n - 합병 비용: §G-15.0%§!\n - 전쟁 명분 정당화 시간: §G-15.0%§!\n - 저항군 목표 §G-10%§!"

 gem_club_problem_hot_spring_department_progress_point_2_tt: "§Y협조§! 단계 (§Y환심§! §G55§! 이상):\n - 협조 단계에 도달하면 §Y온천개발부 부장§!을 정치고문으로 등용할 수 있게 됩니다.\n\n도달 시 효과:\n§Y정치 고문§!으로 §G사용 가능§!:\n'§Y키누가와 카스미§!' 효과:\n - §Y기반시설§! 건설 속도 §G+25.00%§!\n - §Y군수공장§! 건설 속도 §G+5.00%§!\n - §Y민간공장§! 건설 속도 §G+5.00%§!\n - §Y조선소§! 건설 속도 §G+5.00%§!"

 gem_club_problem_gourmet_research_society_progress_point_3_tt: "§Y통일§! 단계 (§Y환심§! §G100§! 이상):\n - 통일 단계에 도달하면 §Y미식연구회§! 전체를 국가에 병합하고, 경쟁 국가가 더 이상 §Y미식연구회§!를 사용할 수 없게 됩니다.\n\n도달 시 효과:\n§Y미식연구회§!: [ROOT.GetNameWithFlag]에 통합\n영구적인 §Y미식연구회§! 효과 전환:\n - 안정도: §G+2.00%§!\n - 징병 가능 인구 변동치: §G10%§!"

 gem_club_problem_hot_spring_department_progress_point_3_tt: "§Y통일§! 단계 (§Y환심§! §G100§! 이상):\n - 통일 단계에 도달하면 §Y온천개발부§! 전체를 국가에 병합하고, 경쟁 국가가 더 이상 §Y온천개발부§!를 사용할 수 없게 됩니다.\n\n도달 시 효과:\n§Y온천개발부§!: [ROOT.GetNameWithFlag]에 통합\n영구적인 §Y온천개발부§! 효과 전환:\n - 안정도: §G+2.00%§!\n - 건설 속도: §G10.00%§!"

