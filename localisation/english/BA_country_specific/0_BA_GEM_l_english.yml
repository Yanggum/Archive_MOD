 GEH_pandemonium_militia: "Pandemonium Legion"
 GEH_pandemonium_militia_desc: "The Pandemonium Legion is [GEM.GetLeader]'s loyal private army, united under the slogan of doing whatever it takes for Gehenna."
 GEH_great_horn:0 "Great Chaos"
 GEH_great_horn_desc:0 "Gehenna is in a state of extreme confusion due to unexpected events. If you were to ask what we can do now, while we are still struggling to grasp the situation, the confident answer would be \"nothing\". Grasping the situation as quickly as possible is our top priority."
 GEH_great_horn_1:0 "Situational Awareness"
 GEH_great_horn_1_desc:0 "We have succeeded in recognizing the situation, but that hasn't changed anything dramatically. Gehenna still seems to have very few options available."
 GEH_great_horn_2:0 "Progressing Situation"
 GEH_great_horn_2_desc:0 "To some extent—truly just a small extent—the situation has definitely improved. Gehenna is recovering, and we now have the leeway to consider various options."
