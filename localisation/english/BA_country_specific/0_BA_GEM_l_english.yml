 GEM_ibuki_system_decision: "Awakening"
 GEM_ibuki_system_decision_desc: "This will be the first and only time that §YIbuki Tanga§! has risen to the position of leader solely through her own strength. Now, she must move beyond the help of the Pandemonium executives and act to become the §Y'Leader of the Academy and the State'§! herself.\n\nIbuki Tanga's §GAwakening§! is divided into §Ytwo quarters§!. In each §Yquarter§!, various buffs can be obtained, and the §Ycolor§! that grows the highest will §Gpaint§! and bloom in that §Yquarter§!.\n\nEach §Ycolor§! is divided into four: §tAmbition§!, §ODignity§!, §1Efficiency§!, and §CIdealism§!. The §Gpainting§! of the §Yfirst quarter§! unlocks base stats, while the §Gpainting§! of the §Ysecond quarter§! unlocks §YIbuki Tanga§!'s §Yunique focus tree§!."

