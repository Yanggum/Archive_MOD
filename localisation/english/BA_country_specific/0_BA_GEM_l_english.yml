 GEM_win_global_flag:0 "내전에서 §O만마전§!이 승리함."


 
 # # # # 게헨나 학원 디시전 # # # #
 GEH_nege_end_tooltip:0 "§Y협상§!이 종료됩니다."
 GEH_NEGO_DANGER:0 "§t협상이 방해됨.§!"
 GEH_nego_wehrmacht_decisions:0 "국방군과 협상"
 GEH_nego_wehrmacht_decisions_desc:0 "국방군은 독일이라 불리우던 집단의 무력 수단입니다. 우리가 독일 땅에 상륙하자 그들은 우리와 대립하여 적대감을 들어내기 시작했고 우리 학생들에게 상해를 입히는 등 여러 문제를 일으키기도 하였습니다. 하지만, 국방군과 잘 협상하여 우리와 공통점을 찾아낸다면 우리는 공생관계가 될 수 있습니다."
 GEH_State_government_dismantlement_work_category: "게헨나 학원의 독일 주 정부"
 GEH_State_government_dismantlement_work_category_desc: "약간의 무력으로 독일의 주 정부를 합병하여 선도부의 행정 부담을 약화시키고 지방 정부에 대한 통제력을 손쉽게 확보할 수 있을 것입니다."
 GEH_state_government_dismantlement_work: "주 정부 병합"
 GEH_war_defence_category: "작전계획"
 GEH_war_defence_category_desc: "\n\n£GFX_GEH_eden_war_decision\n\n\n\n\n과거에서 현재에 이르기까지 게헨나와 트리니티의 악연은 끊이지 않았고 보다못한 총학생회장의 주도 아래에 에덴 조약이 체결 될 예정이였으나, 이차원에 도착하게 되며 그 계획은 무기한 연기가 되었습니다. 최근에 벌어진 총학생회장 실종 사건은 에덴 조약은 없던 것이 되었고, 트리니티에서 벌어진 쿠데타로 인해서 게헨나와 트리니티의 사이의 절벽의 골은 깊어졌습니다.\n\n작은 불씨가 모든 것을 불태울 것입니다."
