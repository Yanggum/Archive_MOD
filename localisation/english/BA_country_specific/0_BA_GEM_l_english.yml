 GEM_satsuki_department_expansion_tt: "§g쿄고쿠 사츠키의 중점도는 강력한 성능을 제공하나 완료할수록 지도자를 교체하기 어려워질 것입니다.§!"
 GEM_what_are_you_talking_about_i_was_always_the_student_council_president: "무슨 소리에요, 게헨나의 학생회장은 언제나 저였잖아요?"
 GEM_what_are_you_talking_about_i_was_always_the_student_council_president_tt: "§Y만마전 의장 축출!§! 사건이 대신 §Y쿄고쿠 사츠키§!가 확정 선출되는 사건으로 대체될 §R확률§!이 생깁니다. §R(25%)§!"
