 ###### 독일국
 GEM_focus_ended_1_A_endfocus: "총통 취임"
 GEM_focus_ended_1_A_endfocus_desc: "독일국의 혼란이 종식되고, 모든 권력은 이제 단 한 사람에게 집중됩니다. 하누마 마코토 의장은 야당 지도자가 참칭하던 '총통'의 지위를 공식적으로 계승합니다. 이는 단순한 직위 쟁탈을 넘어, 누가 독일 민족의 의지를 진정으로 대변하는가에 대한 논쟁에 종지부를 찍는 선언입니다. 그녀의 지도 아래, 낡은 나치즘은 대체되고 독일은 새로운 시대를 맞이합니다."
 GEM_national_corporatism_proposal: "국가조합주의 제창"
 GEM_national_corporatism_proposal_desc: "기존 나치즘의 낡은 이념으로는 새로운 시대를 이끌 수 없습니다. 이에 '국가조합주의'가 현 체제를 이끌 핵심 이념으로 제창됩니다. 이 체제는 사회의 모든 계층을 국가의 통제 아래 '조합'으로 편제하여 모든 역량을 '위업' 달성에 집중시킵니다. '국가조합주의 독일 애국자당'은 이 새로운 이념을 통해 기존 나치당의 지지층을 흡수하고, 유일한 대안 세력으로서의 입지를 굳힐 것입니다."
 GEM_rune_script_adoption: "룬 문자 채택"
 GEM_rune_script_adoption_desc: "야당이 사용하는 실패의 상징, 갈고리십자는 폐기되어야 마땅합니다. 우리는 그 대신, 고대 게르만의 유산과 혈통, 대지를 상징하는 '오달 룬'을 새로운 국가의 징표로 채택합니다. 이는 단순한 상징 교체가 아닙니다. 이는 현존하는 나치당의 정통성을 부정하고, 우리가 바로 이 땅의 진정한 계승자임을 선포하는 상징 전쟁의 시작입니다."
 GEM_bury_gehenna_culture: "게헨나 문화 묻어두기"
 GEM_bury_gehenna_culture_desc: "독일의 완전한 지배자가 되기 위해서는, 통치자 스스로가 '이방인'이라는 인식을 지워내야 합니다. 특히나 민족주의를 내세우는 야당이 존재하는 상황에서, 우리의 게헨나 출신 배경은 정치적 약점으로 공격받을 수 있습니다. 이에 따라, 게헨나 고유의 문화적 특성은 공적인 영역에서 의도적으로 억제될 것입니다. 이는 통치의 정당성을 확보하고 정적들의 공격 빌미를 차단하기 위한 냉철한 정치적 결단입니다."
 GEM_gehenna_german_cultural_integration: "게헨나-게르만 문화 융화"
 GEM_gehenna_german_cultural_integration_desc: "게르만의 전통과 게헨나의 정신을 하나의 용광로에 녹여, 더 우월하고 강력한 새로운 문화를 창조하려는 시도가 시작됩니다. 이는 단순한 문화 교류가 아닌, 게헨나의 역동성과 투쟁 정신을 핵심으로 독일 문화를 재편성하는 과정입니다. 새로이 탄생할 '게헨나-게르만' 문화는 신체제의 정당성을 공고히 하고, 국가의 영원한 힘의 원천으로 기능하게 될 것입니다."
 GEM_leader_of_germans: "독일인의 지도자"
 GEM_leader_of_germans_desc: "총통은 이제 외부의 정복자가 아닌, 새롭게 정의된 '게헨나-게르만 민족'의 의지가 체화된 존재로 격상됩니다. 그녀의 목소리는 곧 민족 전체의 목소리가 되며, 그녀의 결정은 의심의 여지가 없는 민족의 운명으로 받아들여질 것입니다. 이를 통해 총통 개인에 대한 숭배를 국가적 차원으로 끌어올려, 그 어떤 도전도 불가능한 절대적 지도 체제를 완성합니다."
 GEM_expel_leftists_from_coalition: "연정에서 좌익 축출"
 GEM_expel_leftists_from_coalition_desc: "하나의 국가, 하나의 민족, 하나의 의지라는 기치 아래, 이념적 순수성을 저해하는 모든 요소는 제거되어야 합니다. 한때 정권 안정을 위해 필요했던 좌익 연정 세력은 이제 목적을 다한 도구로 간주되어 숙청됩니다. 이는 단순한 권력 투쟁을 넘어, 국가의 모든 에너지를 하나의 방향으로 통일하기 위한 '위대한 정화' 작업의 일환으로 선전될 것입니다."
 GEM_denazification_movement: "탈나치운동"
 GEM_denazification_movement_desc: "새로운 질서가 과거의 망령을 완전히 대체하기 위해서는, 구체제와의 선명한 단절이 필요합니다. 이에 따라, 정권을 위협하는 야당인 나치당과 그 상징에 대한 대대적인 '탈나치운동'이 전개됩니다. 이는 진정한 이념적 청산이라기보다는, 자신들만이 유일한 대안임을 선포하고 가장 강력한 경쟁 정당을 불법화하여 제거함으로써 권력 기반을 확립하기 위한 정치적 선택입니다."
 GEM_national_president_and_tricolor_flag: "국가대통령과 삼색기"
 GEM_national_president_and_tricolor_flag_desc: "가장 강력한 경쟁자였던 나치당을 제거한 지금, 정권은 굳이 극단적인 상징을 고집할 필요가 없습니다. '총통'이라는 칭호 대신 보다 온건한 '국가대통령' 직을 채택하고, 바이마르 공화국의 삼색기를 부활시켜 국제 사회와 국내 온건파에 유화적인 제스처를 취합니다. 이는 권위주의적 본질을 '합법적'인 국가라는 외피로 포장하여, 지지 기반을 넓히려는 실용주의적 선택입니다."
 GEM_slightly_more_progressive: "살짝 더 진보"
 GEM_slightly_more_progressive_desc: "주요 정치적 경쟁자를 모두 제거한 지금, 대중의 지지를 확보하여 체제의 안정성을 높일 때입니다. 몇 가지 제한적인 사회 개혁안이 도입됩니다. 노동 환경 개선이나 여성 권익에 대한 상징적인 조치들은, 정권이 단순한 억압 기구가 아님을 보여주는 선전 도구로 활용됩니다. 이러한 '진보'의 환상은 대중의 불만을 완화시키고, 핵심적인 권력 구조는 온전히 유지한 채 통치를 이어나가는 효과적인 수단이 됩니다."
 GEM_under_one_united_fatherland: "하나된 조국 아래에"
 GEM_under_one_united_fatherland_desc: "분열의 시대는 끝났다. 낡은 이념의 망령들은 청산되었고, 내부의 모든 정적들은 침묵했다. 더 이상 게헨나인과 독일인이라는 구분은 무의미하다. 피와 출신을 넘어, 오직 '하나된 조국'을 향한 충성만이 유일한 가치가 되었다. [ROOT.GetLeader]의 절대적 영도 아래, 모든 민족은 각자의 자리를 존중받는 동시에 하나의 거대한 의지로 통합되었다. 이제 조국은 모든 내적 갈등을 극복하고, 마침내 외부를 향해 그 힘을 투사할 준비를 마쳤다. 위대한 위업을 향한 행진이, 지금 시작된다!"
 ###### 연방
 GEM_focus_ended_1_B_endfocus: "신들의 연합"
 GEM_focus_ended_1_B_endfocus_desc: "단 하나의 우월한 민족이라는 낡은 사상은 편협하고 비효율적입니다. 진정한 힘은, 가장 강력한 두 혈통이 손을 잡고 세상을 지배할 때 비로소 완성됩니다. '대전이'는 운명이었습니다. 그것은 노르드의 후예인 게르만 민족과, 힌놈의 계승자인 게헨나 민족, 이 두 '신들의 민족'이 만나 하나의 위대한 운명을 개척하라는 계시였습니다. 이제 우리는 연방의 기치 아래 하나가 되어, 열등한 자들을 발밑에 두고 새로운 시대의 신화를 써 내려갈 것입니다."
 GEM_1_B_germany_first: "독일 우선"
 GEM_1_B_germany_first_desc: "두 위대한 민족의 연합을 공고히 하기 위해서는, 이미 이 땅에 뿌리내린 강력한 상징과 질서를 활용해야 합니다. 우리는 독일 민족주의의 전통과 미학을 연방의 전면에 내세울 것입니다. 이는 다수인 독일인들의 지지를 확보하고, 기존 국가 시스템을 효과적으로 장악하기 위한 가장 현실적인 선택입니다. 게헨나의 힘은 내부에 감춰진 비수로서, 게르만의 갑옷 아래에서 더욱 날카롭게 벼려질 것입니다."
 GEM_two_nations_pure_blood_law: "두 민족 순혈법"
 GEM_two_nations_pure_blood_law_desc: "두 민족의 연합은 혼혈을 통한 융합이 아닌, 각자의 순수성을 유지한 채 이뤄지는 '맹약'이어야 합니다. 게르만의 강인함과 게헨나의 신비는 각자의 혈통 속에서 가장 순수하게 발현되는 법입니다. '두 민족 순혈법'은 게헨나인과 독일인 간의 통혼을 엄격히 금지하고, 두 지배 민족의 고유한 특성을 보존하여 연방의 힘을 영원히 유지하기 위한 신성한 법령입니다."
 GEM_fuhrer_successor: "총통의 후계자"
 GEM_fuhrer_successor_desc: "총통의 직위는 더 이상 특정 민족의 전유물이 아닙니다. 그것은 두 신들의 민족을 이끄는 '가장 우월한 자'의 자리입니다. 하누마 마코토는 게헨나인이지만, 그녀의 압도적인 지도력과 비전이야말로 총통의 자격 그 자체임을 증명합니다. 그녀가 이 칭호를 계승함으로써, 연방은 혈통을 초월한 새로운 차원의 지도 원리를 확립하고, 모든 의심을 잠재울 절대적인 구심점을 얻게 될 것입니다."
 GEM_1_B_gehenna_first: "게헨나 우선"
 GEM_1_B_gehenna_first_desc: "독일 민족주의는 강력하지만, 그것은 과거의 유산일 뿐입니다. 진정한 미래는 새롭게 도래한 우리, 게헨나의 방식에서 시작되어야 합니다. 우리는 연방의 중심에 게헨나의 상징과 투쟁의 역사를 세울 것입니다. 독일인들은 그들의 낡은 전통을 버리고, 보다 우월하고 역동적인 게헨나의 질서 아래 복속함으로써 진정한 영광을 깨닫게 될 것입니다. 지배자는 우리이며, 방식 또한 우리의 것이어야 합니다."
 GEM_legacy_reactivation: "유산 재가동"
 GEM_legacy_reactivation_desc: "게헨나의 역사에는 단순한 혼돈만이 아닌, 절대적인 힘으로 모든 것을 굴복시켰던 '뇌제'의 시대가 있었습니다. 우리는 이 잊혀진 유산을 재발굴하고, 그의 통치 방식과 상징들을 부활시켜 새로운 연방의 통치 이념으로 삼을 것입니다. 이는 게헨나 민족의 자긍심을 고취시키고, 독일인들에게 누가 진정한 지배의 역사를 가졌는지 똑똑히 각인시키는 과정입니다."
 GEM_successor_of_thunder_god_myth: "뇌제 신화의 계승자"
 GEM_successor_of_thunder_god_myth_desc: "게헨나에게 있어 '뇌제'는 시대를 초월하는 힘의 신화 그 자체입니다. 하누마 마코토는 스스로를 뇌제의 정당한 계승자로 선포합니다. 그녀는 과거의 폭군을 재현하는 것이 아니라, 그의 신화를 흡수하여 자신을 살아있는 전설로 만들 것입니다. 이제 연방의 지도자는 단순한 통치자가 아닌, 천둥과 함께 강림한 신화적 존재로서 군림하게 될 것입니다."
 GEM_nord_hinnom_civilization: "노르드-힌놈 문명"
 GEM_nord_hinnom_civilization_desc: "두 위대한 민족의 정신은 하나의 이름 아래 결합되어야 합니다. 북방의 신화에서 비롯된 '노르드'와, 게헨나의 근원인 '힌놈'의 이름을 합쳐, 우리는 새로운 지배 문명 '노르드-힌놈'을 창조합니다. 이 새로운 문화는 오직 두 지배 민족만이 향유하는 특권이자, 그들을 열등한 타 민족과 구분 짓는 고귀한 상징이 될 것입니다. 예술, 철학, 의례 모든 것이 이 새로운 이름 아래 재편될 것입니다."
 GEM_cow_dies_and_kindred_die: "부는 죽고, 친족도 죽지만"
 GEM_cow_dies_and_kindred_die_desc: "'노르드-힌놈' 문명의 내적 통합은 완성되었습니다. 이제 그 우월성을 외부 세계에 증명해야만 합니다. 우리의 첫 번째 목표는 분열된 채 각자의 길을 걷고 있는 키보토스의 다른 강대국들입니다. 그들은 비록 우리의 '친족'이라 할 수 있으나, 동시에 우리의 위업을 가로막는 경쟁자이기도 합니다. 그들을 모두 흡수하여 하나의 거대한 제국을 이룩함으로써, 우리는 불멸의 영광에 다가설 것입니다."
 GEM_honor_of_the_name_never_dies: "이름을 남긴 자의 명예는 결코 죽지 않는다."
 GEM_honor_of_the_name_never_dies_desc: "키보토스는 마침내 하나의 의지 아래 통일되었습니다. 이제 우리의 시선은 이 세계의 원주민들이 사는 광활한 유럽 대륙을 향합니다. 이베리아에서 우랄 산맥에 이르는 모든 영토는 '노르드-힌놈' 문명의 생활권으로 편입되어야 합니다. 이 거대한 제국의 건설이야말로 모든 희생을 정당화하고, 제국의 모든 영광을 새길 마지막 위업이 될 것입니다."
 #### 사츠키 휘하 중점
 ###### 노말
 GEM_focus_ended_2O_endfocus: "가장 평화로운 학원이야."
 GEM_focus_ended_2O_endfocus_desc: "자유와 혼돈의 학원, 게헨나. 하지만 정말 이게 최선일까요? 미식연구회는 폭파를 일삼고, 선도부와 만마전은 끝없이 반목하며, 학생들은 사소한 이유로 총격전을 벌입니다. 이 모든 혼란은 결국 '고통'일 뿐이에요. 후훗, 저는 모두가 다툼 없이, 서로를 이해하며 평화롭게 지내는 학원을 만들고 싶을 뿐이랍니다. 갈등이라는 병을 치료하고, 가장 이상적인 형태의 '학원'을 건설하는 것. 그것이 저의 유일한 목표입니다."
 GEM_intelligence_expansion_of_manmajeon: "만마전 정보부 확장"
 GEM_intelligence_expansion_of_manmajeon_desc: "평화로운 학원을 건설하기 위한 저의 원대한 계획을 위해서는, 학원의 모든 정보를 손바닥 위에 올려두고 관찰할 필요가 있습니다. 정보부의 인력과 장비를 확충하고, 감시망을 학원 구석구석까지 넓혀야만 해요. 모든 혼란의 징조를 사전에 파악하고, 모든 갈등의 원인을 분석하기 위한 첫걸음입니다."
 GEM_secret_reformation: "비밀스러운 개혁"
 GEM_secret_reformation_desc: "진정한 개혁은 연설이나 토론으로 이루어지지 않습니다. 그것은 물이 스며들듯 조용하고, 누구도 눈치채지 못하는 사이에 완성되어야 하죠. 다른 이들이 시끄러운 정치 놀음에 몰두하는 동안, 저는 정보부의 가장 깊은 곳에서 게헨나를 '치료'할 완벽한 시스템, 'NK 울트라'의 설계를 완성할 것입니다. 이것이야말로 진정한 의미의 개혁입니다."
 GEM_academy_nation_construction: "학원 국가 건설"
 GEM_academy_nation_construction_desc: "낡고 비효율적인 구조로는 진정한 평화를 이룰 수 없습니다. 이제 'NK 울트라'라는 완벽한 설계도를 손에 넣었으니, 새로운 학원을 건설할 시간입니다. 불필요한 파벌 다툼, 비효율적인 행정 절차를 모두 제거하고, 모든 학생과 조직이 '학원의 평화'라는 단 하나의 목표를 위해 완벽하게 조율되어 움직이는 이상적인 국가. 제가 직접 설계하고 건설할, 새로운 게헨나의 모습입니다."
 GEM_veil_politics: "장막 정치"
 GEM_veil_politics_desc: "전면에 나서는 통치자는 언제나 반발과 증오의 대상이 되기 마련입니다. 하지만 장막 뒤에 숨어 보이지 않는 손으로 모든 것을 조율한다면 어떨까요? 후훗, 저는 의장이라는 자리에는 서겠지만, 실질적인 통치는 보이지 않는 곳에서 이루어질 겁니다. 사람들은 스스로의 의지로 평화를 선택했다고 믿겠지만, 그들의 의지마저 저의 계획의 일부일 뿐이죠. 가장 안정적인 정치는, 누구도 그것이 '정치'임을 인지하지 못하게 하는 것입니다."
 GEM_maybe_hypnosis_was_never_needed: "음... 어쩌면, 최면 같은건 필요 없었을지도 몰라."
 GEM_maybe_hypnosis_was_never_needed_desc: "모든 것이 조용해졌습니다. 제가 원하던 대로, 학원에는 완벽한 평화가 찾아왔어요. 그런데... 이따금 생각합니다. 제가 너무 과했던 것은 아닐까 하고. 어쩌면 이 아이들은, 제가 강제로 마음을 바꾸지 않았더라도, 스스로 서로를 이해하고 평화를 선택할 수 있었을지도 모릅니다. 네, 저는 이제 사람들을 믿어보기로 했습니다. 'NK 울트라'는 이제 강제적인 통제 수단이 아닌, 모두가 올바른 길을 찾도록 돕는 '안내자'가 될 겁니다."
 GEM_but_now_it_is_too_late_to_turn_back: "그렇지만. 이미 처음으로 되돌아가기엔 너무 늦었어."
 GEM_but_now_it_is_too_late_to_turn_back_desc: "모든 것이 조용해졌습니다. 제가 원하던 대로, 학원에는 완벽한 평화가 찾아왔어요. 하지만... 이따금 불안감이 저를 스쳐 지나갑니다. 이 평화는 너무나도 연약해서, 제가 잠시라도 통제의 고삐를 놓는 순간, 과거의 끔찍한 혼돈으로 되돌아가 버릴지도 모릅니다. 한순간의 의심은 모든 것을 무너뜨릴 수 있습니다. 아니요, 저는 흔들리지 않겠습니다. 이 평화를 영원히 지키기 위해서라면, 저의 방식은 절대 변하지 않을 겁니다. 이미 되돌아가기엔 너무 늦었으니까요." 
 GEM_peaceful_nation_endfocus: "평화로운 국가"
 GEM_peaceful_nation_endfocus_desc: "마침내, 저의 오랜 꿈이 이루어졌습니다. 증오와 갈등으로 얼룩졌던 게헨나는 이제 없습니다. 물론, 이 완벽한 평화를 이루는 과정에서 수많은 고민이 있었습니다. 제가 선택한 방식이 정말로 최선이었는지, 더 나은 길은 없었는지... 한때는 그런 의심이 저를 흔들기도 했죠. 하지만 이제 망설이지 않습니다. 저는 저의 길을 선택했고, 그 선택이 옳았다고 믿어야만 합니다. 이 평화를 지키고, 제가 꿈꾸던 '가장 평화로운 국가'를 완성하기 위해. 후훗, 저는 앞으로도 계속 나아갈 뿐입니다."
 GEM_peaceful_nation_endfocus_tt1: "\n왼쪽 선택을 했을 경우:"
 GEM_peaceful_nation_endfocus_tt2: "\n오른쪽 선택을 했을 경우:"
 ###### 독일국
 GEM_focus_ended_2_A_endfocus: "정신 너머의 세계에 대해 어떻게 생각해?"
 GEM_focus_ended_2_A_endfocus_desc: "국가사회주의 독일 노동자당의 역사를 보면 과정에 신비주의자들의 연합인 툴레 협회가 있었으며, 게르만족 민족주의에는 언제나 신화적 배경이 깔려있습니다. 이들을 존중하고, 또 그들의 이상향을 이루어주는 게 독일인들이 원하는 것 아닐까요?"
 GEM_occult_reconstruction: "신비학 재건"
 GEM_occult_reconstruction_desc: "그들이 믿는 신화와 신비주의를 완벽하게 이해하고, 분석하고, 체계화합니다. 비합리적인 믿음이야말로 가장 강력한 통제 수단이 될 수 있으니까요. 우리는 그들의 신화를 부정하는 대신, 오히려 가장 완벽한 형태로 재건하여 그들의 정신세계에 돌려줄 것입니다. 그들이 스스로 낙원으로 걸어 들어오게 만들기 위해서요."
 GEM_secret_propaganda: "비밀스러운 선전"
 GEM_secret_propaganda_desc: "눈에 보이는 통제는 저항을 낳을 뿐이죠. 진정한 조화는 사람들이 스스로 평화를 원한다고 '믿게' 만들 때 완성됩니다. 우리는 미디어, 예술, 심지어는 거리의 소음에 이르기까지 사회의 모든 무의식적인 영역에 우리의 메시지를 심어둘 것입니다. 사람들은 자신도 모르는 사이에 갈등을 혐오하고, 질서를 갈망하게 될 겁니다. 이것이야말로 보이지 않는 손으로 빚어내는 가장 완벽한 선전입니다."
 GEM_nk_ultra_procedure_mandate: "NK 울트라 의무화"
 GEM_nk_ultra_procedure_mandate_desc: "모든 국민의 정신적 안정은 국가가 책임져야 할 가장 중요한 의무입니다. 'NK 울트라'는 갈등과 증오라는 사회적 질병을 예방하고 치료하기 위한 선진적인 공중 보건 정책으로 의무화될 것입니다. 정기적인 '정신 검진'과 '심리 안정화 시술'을 통해, 우리는 모든 국민이 평화로운 마음을 유지할 수 있도록 도울 것입니다. 물론, 이 '치료'를 거부할 권리는 누구에게도 없습니다. 모두의 행복을 위해서니까요."
 GEM_nazi_party_manmajeon_merger: "나치당-만마전 합당"
 GEM_nazi_party_manmajeon_merger_desc: "서로를 견제하던 두 집단이 손을 잡았습니다. 기적처럼 보이나요? 아뇨, 이건 기적이 아니라 '이해'의 결과입니다. 제가 그들이 서로를 이해하고, 공동의 '평화'라는 목표를 향해 나아갈 수 있도록 조금 도와주었을 뿐이에요. 이제 게헨나와 독일은 더 이상 적이 아닙니다. 하나의 위대한 이상을 향해 나아가는 동지가 된 것이죠."
 GEM_thule_radiance: "툴레의 광림"
 GEM_thule_radiance_desc: "독일인들은 그들의 잊혀진 신화, '툴레'의 재림을 갈망했습니다. 그렇다면 그 꿈을 이루어주면 되는 겁니다. 우리는 게르만 민족을 '툴레'라는 하나의 신화 아래 통합할 것입니다. 이제 인종과 출신으로 인한 갈등은 영원히 사라지고, 모두가 위대한 아리아의 후예로서 조화를 이루게 될 겁니다."
 GEM_provable_issue: "증명 가능한 문제"
 GEM_provable_issue_desc: "신화가 통하지 않는 이들도 있겠죠. 우리는 혼란스러운 현실 대신, 논리로 증명 가능한 완벽한 사회 모델, '낙원'의 존재를 증명해 보일 것입니다. 모든 변수가 통제되고, 모두의 행복이 보장되는 사회. 이 합리적인 비전 앞에서 누가 감히 저항할 수 있을지 증명할 것입니다."
 GEM_hehe_everyone_i_wish_were_a_bit_more_peaceful: "후훗, 모두가 조금 더 평화로웠으면 좋겠어."
 GEM_hehe_everyone_i_wish_were_a_bit_more_peaceful_desc: "마침내, 모든 것이 조용해졌습니다. 거리에는 다툼이 없고, 마음에는 증오가 없으며, 모두의 얼굴에는 온화한 미소가 깃들어 있습니다. 제가 꿈꾸던 세계가 바로 여기에 있어요. 물론, 그 과정에서 몇몇 불필요한 것들-이를테면 고통스러운 자유의지 같은-을 조금 덜어내야 했지만요. 하지만 이 완벽한 평화를 위해서라면, 그 정도는 사소한 대가 아닐까요?"
 GEM_aryan_spirit: "아리아인의 혼"
 GEM_aryan_spirit_desc: "보십시오. 더 이상 게헨나인도, 독일인도 없습니다. 오직 순수하고 고결한 '아리아인의 혼'을 공유하는 하나의 민족만이 존재할 뿐입니다. 우리의 통치 아래, 그들은 마침내 모든 갈등을 극복하고 영적인 통합을 이루었습니다. 이 얼마나 평화로운 광경인지, 한 번 바라봅시다."
 GEM_choir: "합창단"
 GEM_choir_desc: "모든 목소리가 하나의 화음을 이루는 합창단처럼, 우리의 사회는 완벽한 조화를 이루었습니다. 각자는 자신의 자리에서 가장 효율적인 선율을 연주하고, 그 모든 것이 모여 '낙원'이라는 위대한 교향곡을 완성합니다. 더 이상의 불협화음은 존재하지 않습니다. 이보다 더 아름다운 음악은 없을 것입니다."
 ###### 연방
 GEM_focus_ended_2_B_endfocus: "좋아, 멋진 연방을 건설해보자구. 후훗."

 #### 이로하 휘하 중점
 ###### 노말
 GEM_focus_ended_3O_endfocus: "합중국 대통령이지만 일하기는 싫어."
 GEM_federal_basic_law_enactment: "연방기본법 제정"
 GEM_federal_basic_law_enactment_flag: "§Y$GEM_federal_basic_law_enactment$§! 중점 완료"
 GEM_corporatist_economy: "조합주의 경제"
 GEM_state_level_economic_plan: "주 단위 경제 계획"
 GEM_over_flashy_reforms: "화려한 계획보다는..."
 GEM_over_flashy_reforms_flag: "§Y$GEM_over_flashy_reforms$§! 중점 완료"
 GEM_practical_results: "실속 있는 결과를!"
 GEM_practical_results_flag: "§Y$GEM_practical_results$§! 중점 완료"
 GEM_retirement_of_a_giant: "거성의 은퇴"
 GEM_retirement_of_a_giant_tt: "사건으로 선택된 인물은 나츠메 이로하가 얻은 특성을 일부 계승할 것입니다!"
 GEM_reelection_decision: "연임 결정"
 ###### 독일국
 GEM_focus_ended_3_A_endfocus: "연방정부 강화"
 GEM_focus_ended_3_A_endfocus_desc: "연방의 출범은 시작에 불과합니다. 나츠메 이로하 스스로가 부여했던 각 주에 흩어진 권한과 복잡한 행정 체계는 이로하가 온전히 집권한 이상 다시 축소되어야 합니다. 이제 모든 권력을 연방정부로 집중시켜, 국가를 일사불란하게 움직일 시간입니다."
 GEM_union_of_parties: "당들의 결합"
 GEM_union_of_parties_desc: "강력한 야권인 나치당은 여전히 지배력의 분열을 조장하는 위협입니다. 그들을 고립시키고 힘을 약화시키기 위해, 다른 모든 온건 독일계 정당과 게헨나계 정당을 하나의 거대한 '연방여당'으로 통합시켜, 반대할 수 없는 정치적 힘을 구축합니다."
 GEM_night_of_roses: "장미의 밤"
 GEM_night_of_roses_desc: "다민족 국가의 조화를 위협하는 민족주의의 가시들은 뽑아내야만 합니다. 하룻밤 사이, 연방에 반대하는 모든 민족주의 지도자들을 일거에 숙청할 것입니다. 피가 아닌 장미로 장식될 이 밤을 통해, 국가는 비로소 순수해질 것입니다."
 GEM_german_federal_president: "독일 연방대통령"
 GEM_german_federal_president_desc: "이 새로운 국가에는 분열을 잠재우고 모두를 아우를 단 하나의 구심점이 필요합니다. '독일 연방대통령' 직위를 신설하고, 나츠메 이로하를 그 자리에 추대하여, 그녀에게 국가의 미래를 결정할 절대적인 권한을 부여합니다."
 GEM_the_glorious_plan: "그 화려한 계획"
 GEM_the_glorious_plan_desc: "나츠메 이로하는 여러 위협적인 정적들 사이에서 안정적으로 정권을 유지하고 지지율을 끌어모으기 위해 눈에 보이고 화려한 개혁들을 통과시킬 것입니다. 이는 그녀의 스타일이 아니지만, 정치적 상황은 선택을 강요합니다."
 GEM_reelection_law: "연임법"
 GEM_reelection_law_desc: "위대한 과업은 한순간에 이루어지지 않습니다. 국가의 안정을 보장하고 수 많은 정치적 개혁을 완수하기 위해, 연방대통령의 임기 제한을 철폐합니다. 나츠메 이로하는 국가가 그녀를 필요로 하는 한, 영원히 우리를 이끌 것입니다."
 GEM_Natsume_Iroha_A_desc: "나츠메 이로하는 스스로가 이 자리에 올 것이라고는 전혀 생각지도 못했습니다. 언제나처럼 만마전의 행정이나 하면서 종종 ...초무적철갑 토라마루라는 마코토가 지어준 부끄러운 이름의 전차를 몰고 다니는 생활이 이어질 줄 알고 있었죠. 그러나, 대전이가 불러온 거대한 혼란 속에서 나츠메 이로하는 만마전의 의장이 되었고. 이제는 초대 대통령이자, 한 명의 독재자가 되었습니다.\n\n물론 그녀를 진짜 독재자라고 부르는 이들은 생각만큼 많지 않습니다. 연임법의 통과 이후 그 비율이 늘어나긴 했으나, 전통적인 권위주의 독재자라기엔 너무나도 유연하고 민주적입니다.\n\n그러나, 나츠메 이로하는 스스로를 독재자라고 평가합니다. 게헨나 학원의 작은 자유와 혼돈을 지키기 위해...라는 말도 이제는 옛말이 되었습니다. 독일 연방의 위대한 지도자가 된 나츠메 이로하는, 오늘도 독일인들의 고삐를 틀어쥐는 기수입니다.\n\n\"...여기까지만 쓰죠.\""
 GEM_leader_of_the_oak: "떡갈나무의 지도자"
 GEM_leader_of_the_oak_desc: "독일 민족의 상징인 떡갈나무처럼, 나츠메 이로하는 이제 '새로운 독일인'의 흔들리지 않는 중심입니다. 그녀를 '떡갈나무의 지도자'로 추대하여, 그녀의 존재 자체가 곧 새로운 독일 민족의 정체성이자 구심점임을 선포합니다."
 GEM_hasrant: "헤르츠란트"
 GEM_hasrant_desc: "과거의 수도들은 낡은 증오와 분열의 기억에 얽매여 있습니다. 우리는 백지 위에 새로운 수도, 세계의 심장이 될 '헤르츠란트'를 건설할 것입니다. 이 위대한 도시는 우리 다민족 연방의 영원한 영광을 상징할 것입니다."
 herzland: "헤르츠란트"
 GEM_hasrant_idea_deff: "헤르츠란트 기반 작업"
 GEM_hasrant_idea_deff_tt: "이 국민정신은 '§Y$GEM_hasrant$§!' 중점 완료 시 제거됩니다."
 GEM_pioneer: "선각자"
 GEM_pioneer_desc: "우리는 두 세계의 파편을 녹여 새로운 민족을 창조해낸 위대한 선각자들입니다. 하나의 정체성, 하나의 지도자 아래 통합된 우리의 국가는, 다른 모든 이들이 따라야 할 새로운 시대의 이정표가 될 것입니다."
 GEM_architect_of_the_new_world: "신세계의 건축가"
 GEM_architect_of_the_new_world_desc: "혼돈 속에서 질서를 창조하고, 낡은 세계의 폐허 위에 새로운 이상향을 세운 나츠메 이로하 대통령. 그녀는 이제 단순한 지도자가 아닌, '신세계의 건축가'입니다. 그녀의 설계 아래, 우리의 문명은 새로운 역사를 써 내려갈 것입니다."
 ###### 연방
 GEM_focus_ended_3_B_endfocus: "양당 공동 선출 지도자"
 GEM_focus_ended_3_B_endfocus_desc: "국가를 이끄는 두 파벌이 역사적인 타협을 통해 우리의 지도자를 공동으로 인정하고 선출했습니다. 이제 [ROOT.GetLeader] 국가 대통령은 우리 국가의 역사적인 타협을 이끌어 나아갈 것입니다."
 GEM_neutral_presidency: "중립적인 대통령"
 GEM_neutral_presidency_desc: "양당의 지지로 선출된 대통령은 어느 한쪽의 편을 들 수 없습니다. 우리는 대통령직을 파벌 정치의 위에 서는 중립적이고 초월적인 기관으로 확립할 것입니다. 대통령은 선수가 아닌 심판으로서, 연방의 규칙이 공정하게 지켜지도록 감독할 것입니다."
 GEM_finding_ideology_in_cooperation: "협력 속 이데올로기 찾기"
 GEM_finding_ideology_in_cooperation_desc: "우리의 이념은 책상에서 탄생하지 않습니다. 게헨나와 독일, 두 민족이 함께 국가를 운영하는 과정 속에서, 공동의 가치를 발견하고 새로운 사상을 만들어나갈 것입니다. 협력이라는 실천 속에서, 우리만의 새 이데올로기가 모습을 드러낼 것입니다."
 GEM_expansion_of_state_authority: "주 권한 확장"
 GEM_expansion_of_state_authority_desc: "강력한 연방은 강력하고 자율적인 주들 위에 세워집니다. 중앙 정부의 과도한 개입을 막고, 각 지역의 고유한 전통과 목소리를 존중하기 위해, 우리는 더 많은 권한을 각 주 정부에 이양할 것입니다."
 GEM_expansion_of_federal_government_authority: "연방정부 권한 확장"
 GEM_expansion_of_federal_government_authority_desc: "두 개의 심장을 가진 국가는 분열될 수밖에 없습니다. 비효율적인 지역주의를 극복하고 통일된 국가 의지를 관철하기 위해, 우리는 연방 정부의 권한을 대폭 강화하여 중앙 집권적 통치 체제를 확립할 것입니다."
 GEM_corporatist_economy_b: "조합주의 경제"
 GEM_corporatist_economy_b_desc: "자유 시장의 혼돈도, 국가 통제의 경직성도 아닌 제3의 길을 모색합니다. 노동계, 산업계, 그리고 정부가 각 민족을 대표하는 조합을 통해 함께 경제를 계획하고 이끌어가는 조합주의 경제를 도입하여, 갈등을 협력으로 대체할 것입니다."
 GEM_weimar_presidential_succession: "바이마르 대통령 계승"
 GEM_weimar_presidential_succession_desc: "우리의 정통성을 공고히 하고, 독일의 민주적 유산과 연결되기 위해, 연방대통령직이 바이마르 공화국 대통령직의 정통성을 계승함을 선포합니다. 우리의 지도자는 새로운 지배자가 아닌, 끊어진 민주주의의 전통을 복원한 계승자입니다."
 GEM_german_fuehrer_succession: "독일 총통 계승"
 GEM_german_fuehrer_succession_desc: "국민적 통합과 강력한 리더십을 위해, 우리는 독일의 역사적 상징을 외면하지 않을 것입니다. 연방대통령직이 '총통'의 권위를 계승함을 선언하여, 분열을 용납하지 않는 강력한 중앙 권력의 상징으로 자리매김할 것입니다."
 GEM_coordinator: "조율자"
 GEM_coordinator_desc: "마침내 대통령의 역할이 정립되었습니다. 그녀는 여당의 대표도, 야당의 적도 아닙니다. 양대 파벌의 이해관계를 조율하고, 국가라는 거대한 기계가 멈추지 않도록 관리하는 '조율자'입니다. 그녀의 조용한 리더십이야말로 이 연방을 지탱하는 진정한 힘입니다."

