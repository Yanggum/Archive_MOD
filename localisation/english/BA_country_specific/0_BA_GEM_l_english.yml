 GEM_pandemonium_modifier: "Pandemonium Society"
 GEM_pandemonium_modifier_tt: "§Y$GEM_pandemonium_modifier$§! modifier"
 GEH_gastronomy_research_group_arrested_tt: "Guarantees the activities of the §YGourmet Research Society§! even without national spirit."
 GEH_hot_spring_cooperation_tt: "Guarantees the activities of the §YHot Springs Development Department§! even without national spirit."

 GEH_present_situation:0 "Grasping the Present Situation"
 GEH_present_situation_desc:0 "No one has yet grasped the situation regarding this sudden occurrence. Therefore, identifying the status quo must be our first priority."
 GEH_nego_with_wehrmacht:0 "Negotiations with the Wehrmacht"
 GEH_nego_with_wehrmacht_desc:0 "An offer for negotiation has arrived from the Wehrmacht, the military group of Germany, which was the nation that existed on this land where we now stand in this world. We must accept this and overcome this crisis through coordination with the locals."
 GEH_nego_continue:0 "Continued Negotiations"
 GEH_nego_continue_desc:0 "The Pandemonium Society is brilliantly continuing the negotiations. Let us keep going as we are."
 GEH_dark_nego:0 "Clandestine Maneuvers"
 GEH_dark_nego_desc:0 "The Pandemonium Society is an incompetent group. The Wehrmacht must also be thinking that negotiating with the Prefect Team would be more beneficial than negotiating with them. Let us make contact with them."
 GEH_nego_settlement:0 "Settlement of Negotiations"
 GEH_nego_settlement_desc:0 "The negotiations with the Wehrmacht were successful. Whatever those negotiations may have been."
 GEH_establish_governance:0 "Establishment of Power"
 GEH_establish_governance_desc:0 "The Prefect Team's arbitrary refusal is an explicit act of ignoring our Pandemonium Society. It is time we clearly show them who the master of power is."
 GEH_establish_new_government:0 "Establishment of a New Government"
 GEH_establish_new_government_desc:0 "Now that we have driven out the incompetent leaders, it is time to form a new government."
 GEH_end_of_crisis:0 "End of the Crisis"
 GEH_end_of_crisis_desc:0 "Now that the major crisis has passed, we have the breathing room to turn our attention elsewhere."
 GEH_look_situaition:0 "Facing Reality"
 GEH_look_situaition_desc:0 "Internal strife has been somewhat resolved, but the international situation is not very favorable to us. Even the resolved internal strife still exists to some extent. We must not look away from this situation and face reality."
 GEH_look_inside:0 "Looking Inward"
 GEH_look_inside_desc:0 "Internal strife persists, and problems to be solved are piling up. We must face that reality."
 GEH_look_outward:0 "Looking Outward"
 GEH_look_outward_desc:0 "Surrounded by potential hostile forces on all sides—east, west, south, and north—our position is not good. We must face this situation and have in-depth discussions regarding our foreign policy."
 GEH_one_step_closer:0 "Taking One Step Closer"
 GEH_one_step_closer_desc:0 "If we open our hearts first and strive to melt this ice-thin atmosphere, they will surely cooperate with all sincerity. Probably."
 GEH_clear_method:0 "A Clean and Sure Method"
 GEH_clear_method_desc:0 "International politics is a wilderness, and the method for survival in that wilderness has already been proven. It is to move thoroughly for the national interest. We have power, and we must actively use this power."

 GEH_perfactteam_lute:0 "Commence Battle!"
 GEH_perfactteam_lute_desc:0 "The Pandemonium Society and the Prefect Team have finally crossed the point of no return.\nThrough this fight, it will be clearly known who the true master of Gehenna is."
 GEH_nego_countiune_manmajun:0 "The Looming Clouds of War"
 GEH_nego_countiune_manmajun_desc:0 "As negotiations began, it seemed peace with the Wehrmacht was approaching, but the situation is gradually flowing in a direction slightly different from what the Pandemonium Society thought.\nCome to think of it, there were rumors that the current land of Gehenna where we stand was originally German land.\nWill they really leave us alone while their land is practically stolen?"
 GEH_dark_nego_hina:0 "Preparation for Preemptive Coup"
 GEH_dark_nego_hina_desc:0 "The Pandemonium Society has always considered our Prefect Team an eyesore.\nNow that they have begun negotiations with the Wehrmacht, we don't know what might happen.\nWe must prepare first." 
 GEH_nego_settlement_new:0 "Conclusion of Negotiations"
 GEH_nego_settlement_new_desc:0 "The negotiations between Gehenna Academy and the German Wehrmacht have concluded.\nAlthough many incidents broke out during the negotiations.\nWhat kind of result will welcome us?"
 GEH_manmajun_takeover:0 "Establishment of Power"
 GEH_manmajun_takeover_desc:0 "The Prefect Team's arbitrary refusal is an explicit act of ignoring our Pandemonium Society. It is time we clearly show them who the master of power is."

### Gehenna Events ###

 GEM_balance_of_power_event.1.t: "Chairman of Pandemonium [ROOT.GetLeader] Ousted!"
 GEM_balance_of_power_event.1.desc: "Today, it appears that [ROOT.GetLeader] failed to secure the necessary votes to survive a no-confidence motion requested within the Pandemonium Society.\n\nSupport greatly diminished as [ROOT.GetLeader.GetSheHe] broke [ROOT.GetLeader.GetHerHis] promises in the newly held student council president election following doubts about the leadership of the Pandemonium Society. This political mistake escalated into a political crisis, making [ROOT.GetLeader.GetSheHe] a scapegoat."
 GEM_balance_of_power_event.1.a: "Hanuma Makoto still has work to do."
 GEM_balance_of_power_event.1.b: "Kyogoku Satsuki is a reliable senior."
 GEM_balance_of_power_event.1.c: "Natsume Iroha is helpful to Pandemonium."
 GEM_balance_of_power_event.1.d: "Motomiya Chiaki has ambition!"

 GEM_balance_of_power_event.2.t: "Still a Trusted Chairman"
 GEM_balance_of_power_event.2.desc: "The no-confidence motion scheduled within the Pandemonium Society today... somehow ended before it even began. Those who had demanded the vote seem to not even remember why they had such a foolish thought, and all students absolutely trust Kyogoku Satsuki's leadership without a hint of doubt.\n\nOpposition to [ROOT.GetLeader] seems to have never existed from the start. As if it were the only truth in this world, everyone believes that it has 'always' been this way. There was no confusion. Only a silent conviction fills the Pandemonium Society."
 GEM_balance_of_power_event.2.a: "Was I... mistaken about something...?"

 GEM_balance_of_power_event.3.t: "A Natural Replacement"
 GEM_balance_of_power_event.3.desc: "The position of [ROOT.GetLeader], Chairman of the Pandemonium Society, seemed solid. At least until this morning. Students walking the hallways suddenly realized: why were we following [ROOT.GetLeader]? Wasn't the Gehenna student council president Kyogoku Satsuki from the beginning?\n\nThe question instantly turned into conviction. [ROOT.GetLeader] now appears to be just an ordinary student, and everyone's gaze naturally turns toward the true leader, Kyogoku Satsuki. As if correcting a button that had been misaligned for a long time, everything seems to have found its proper place."
 GEM_balance_of_power_event.3.a: "Now everything finally feels right."

 GEM_balance_of_power_event.101.t: "The Decision of the Greatest Academy"
 GEM_balance_of_power_event.101.desc: "Until now, Gehenna Academy has only received hatred from Trinity and contempt from Millennium and the General Student Council, being called an academy of nothing but chaos. However, from now on, things will be different.\n\nAt 8 PM today, Chairman [ROOT.GetLeader] appealed from the podium while passing the 'Great Leap Toward the Greatest Academy' bill. That Gehenna Academy must be different in every way from now on! That Gehenna Academy is clearly destined to reclaim its old glory and rule over all of Kivotos!\n\nThus, the New Order of Gehenna will spread toward the world. Because it is certain that a great result remains at the end of a great path! Under [ROOT.GetLeader.GetHerHis] rule, a full-scale military reorganization and student mobilization to crush all other academies are beginning."
 GEM_balance_of_power_event.101.a: "We shall rule everything!"

 GEM_balance_of_power_event.102.t: "Enlightenment"
 GEM_balance_of_power_event.102.desc: "At some point, the bureaucrats of Gehenna Academy have begun to pursue peace and operate in a direction that reduces confusion by conforming to the rule of the Pandemonium Society rather than clashing with one another.\n\nSurely, this is thanks to the brilliant reign of our Chairman, [ROOT.GetLeader]. If everyone believes and follows, it will be achieved. Chairman [ROOT.GetLeader] announced a new bill and calmly delivered a speech stating that Gehenna Academy will now be reborn amidst warmth and cooperation.\n\nThe general students and citizens of Gehenna have doubts about the *radically* changing social culture of Gehenna... but soon those doubts will be terminated. [ROOT.GetLeader.GetSheHe] is watching you. Anytime, anywhere."
 GEM_balance_of_power_event.102.a: "Soon, all chaos vanished."

 GEM_balance_of_power_event.103.t: "Constitution of the United States of Gehenna"
 GEM_balance_of_power_event.103.desc: "We, the people of the United States, in order to establish the moderate fusion of different cultures and common justice, and to establish the common defense of all Gehenna, do ordain and establish this Constitution for the United States of Gehenna.\n\n\n1. The United States of Gehenna is a federal republic. Decisions of the United States of Gehenna are made through the Federal Parliament. The Federal Parliament consists of the Senate and the House of Representatives.\n\n2. The United States of Gehenna inherits the national forms of the old Gehenna Academy and the German Reich.\n\n......"
 GEM_balance_of_power_event.103.a: "Bearing fruit."

 GEM_balance_of_power_event.104.t: "Proclamation of the New System"
 GEM_balance_of_power_event.104.desc: "New school rules for Gehenna have been proclaimed. The Secretariat will now concurrently serve with the Chairman and perform the role of the center of the existing administration. Although many have doubts about the new changes at Gehenna Academy, we will cover those doubts with numerous media outlets and broadcasts.\n\nThe New Administration of Gehenna Academy has been established and is now beginning to move. The reign of General Secretary [ROOT.GetLeader] has begun."
 GEM_balance_of_power_event.104.a: "Long live the Secretariat!"

 GEM_news.1.t: "German Influence in [HYA.GetNameDef]"
 GEM_news.1.desc: "Regarding the recent goodwill among nations within the 'German Sphere of Influence', [From.GetName] announced today in a speech by [From.GetLeader] that it would dedicate itself to political and diplomatic cooperation with [HYA.GetNameDef]. With a significant German-speaking population, [HYA.GetNameDef] has naturally been set as a partner for [From.GetAdjective] interests.\n\nThough uncertain, to some extent [HYA.GetNameDef] says let's cooperate, and at least their borders are securely guaranteed against any territorial ambitions from [GEM.GetNameDef]."
 GEM_news.1.a: "Friendship with Gehenna is better than rule by Gehenna."
 GEM_news.1.b: "Hyakkiyako is now with Gehenna."
 GEM_news.1.c: "Peace in our time?"

 GEM_news.2.t: "[GEM.GetNameDefCap] Declares Hegemony Over Europe"
 GEM_news.2.desc: "[GEM.GetLeader] of [GEM.GetNameDef] has announced an ambitious plan to rule over all of Kivotos and establish [GEM.GetAdjective] hegemony across the entire continent. They declared that this is the rightful birthright of the New Gehenna students and that they will never again kneel before foreign powers.\n\nEvery munitions factory in all of Gehenna is operating according to the new plan, and a mobilization order for all students is in effect. It is certain that a massive war is approaching."
 GEM_news.2.a: "They must be crushed!"
 GEM_news.2.b: "The world is ours!"

 GEM_news.3.t: "Shocking Governance within [GEM.GetNameDefCap]!"
 GEM_news.3.desc: "Until just yesterday, [GEM.GetLeader] of [GEM.GetNameDef] was regarded as a capable leader. However, according to reports pouring out just a moment ago, the activities of newly created agencies, and various information materials that have undergone numerous verifications, it has been revealed that Chairman [GEM.GetLeader] has been continuing brainwashing experiments on all Gehenna bureaucrats, capitalists, and a vast number of the Gehenna general public!\n\nThey no longer intend to hide it. They are explicitly stating that they will solidify the 'stable governance' of [GEM.GetAdjective], which clearly signifies the eternal end of the old Gehenna Academy."
 GEM_news.3.a: "Oh, dear lord."
 GEM_news.3.b: "Such a newspaper has never been published in Gehenna."

 GEM_news.4.t: "Proclamation of the United States of Gehenna and Germany"
 GEM_news.4.desc: "[GEM.GetLeader] of [GEM.GetNameDef] has taken office as the newly created Federal President along with the revision of the constitution. The constitution, which specifies that it inherits the national forms of Gehenna and Germany, marks a major turning point in that the establishment of an explicit federal system between the two worlds was achieved democratically.\n\nWhile such attempts have not been absent in small-scale nations, this is the first time such a change has been attempted at a Great Power scale like Gehenna Academy, one of the three major academies."
 GEM_news.4.a: "Let us watch them."
 GEM_news.4.b: "Long live the United States!"

 GEM_news.5.t: "Night of the Roses"
 GEM_news.5.desc: "The entire Federation is in shock. Last night, Federal Security Forces launched a nationwide operation and arrested hundreds of key nationalist figures. A government spokesperson announced in an emergency press conference that they had 'thwarted a coup plot intended to subvert the multi-ethnic state system.'\n\nThe government has named this operation the 'Night of the Roses'. The official explanation is that 'to cultivate a harmonious garden, one must pull out the thorny weeds named hatred.'\n\nWith this purge, all nationalist opposition forces, including hardliners of the Nazi Party, have been dismantled. With this, no one remains to challenge the power of President Natsume Iroha, and a heavy silence flows through the streets."
 GEM_news.5.a: "It was an inevitable sacrifice for order."
 GEM_news.5.b: "Solving a purge with another purge, I see."

 GEM_news.6.t: "All Rivers Flow to the Sea"
 GEM_news.6.desc: "Today, the politics of the Federation have entered a new era. All Gehenna-affiliated and non-Nazi German political parties, including the Pandemonium Society, the Communist Party, the Social Democratic Party, and the Centre Party, have declared a historic merger and unified into a single 'Germanic People's Socialist Party'.\n\nA former Pandemonium official elected as the first party leader stated it was 'a decision to end wasteful factional infighting and gather all the nation's capabilities as one.' With this, free party politics within the Federation has practically come to an end.\n\nCommunists and conservatives, who might have once pointed guns at each other, now stand side-by-side under a single banner. Political diversity has been sacrificed under the grand goal of 'National Integration'. Now, only a massive ruling party and the opposition facing it exist in the Federation."
 GEM_news.6.a: "Division means defeat."
 GEM_news.6.b: "A desperate struggle, or just a plain dictatorship."

 GEM_news.7.t: "Founding of [FROM.GetName]"
 GEM_news.7.desc: "Not long after the world was shocked by Chairman [FROM.GetLeader]'s national brainwashing plan, her madness has finally begun to warp reality itself.\n\nThe ominous premonition that had been looming since the Pandemonium Society took over Germany became a reality with the disclosure of the 'NK Ultra Project'. And today, Chairman [FROM.GetLeader] discarded even the national name of Germany and proclaimed the reconstruction of 'Thule', a state from Aryan mythology, turning fear into reality.\n\nCircumstances have been captured indicating that 'ancient myths of the Aryan race', apparently related to Nazi occultism, are being forcibly injected into the minds of all citizens. Former German territory has now transformed into a 'Mythological State' subordinate to the will of one person, and the European continent is engulfed in unprecedented fear before a madness where reason and common sense do not apply."
 GEM_news.7.a: "Toward the Idea of a new race."
 GEM_news.7.b: "What on earth is happening in there?"
 GEM_news.7.c: "The language of reason will no longer reach them."

 GEM_news.8.t: "Constitutional Revision of [FROM.GetName]"
 GEM_news.8.desc: "Not long after the world was shocked by Chairman [FROM.GetLeader]'s national brainwashing plan, her next move is raising even more incomprehensible questions instead of blatant madness.\n\nThe ominous premonition that had been looming since the Pandemonium Society took over Germany became a reality with the disclosure of the 'NK Ultra Project'. However, today, Chairman [FROM.GetLeader] revealed that fear in the form of 'peace' rather than war. She proclaimed the establishment of '[FROM.GetName]' and announced that she would create an ideal community where all ethnicities harmonize.\n\nUnder the pretext of promoting 'mutual understanding and empathy', observations indicate that 'NK Ultra' has begun operating in earnest across the Federal Republic. The European continent is watching with anxiety that this might be the prelude to a massive deceptive play."
 GEM_news.8.a: "Within a flowing chorus."
 GEM_news.8.b: "I fear what might be hidden behind those smiling faces."
 GEM_news.8.c: "It is a dictatorship disguised in the most beautiful form."

 GEM_news.9.t: "Revolution of the Gehenna Secretariat"
 GEM_news.9.desc: "[GEM.GetLeader] of [GEM.GetNameDef] has just abolished previous leadership principles and enacted school rules containing new powers for the Secretariat. It now appears that the practical leadership of Gehenna Academy has been seized by the Pandemonium Society Secretariat, which seems to be a major inflection point for the Pandemonium Society.\n\n[GEM.GetLeader], who has emerged as the new leader of the Pandemonium Society, has proclaimed a new administration and is continuously broadcasting newspapers and TV reports stating that great reforms are underway."
 GEM_news.9.a: "Let us watch them."
 GEM_news.9.b: "Long live the revolution!"

 GEM_news.10.t: "The Chiaki Purge"
 GEM_news.10.desc: "Last night, the capital of the Federation was engulfed in a tense silence. Under the direct command of Secretary Motomiya Chiaki, a lightning purge operation against radical factions within the coalition ruling party, the 'All-Federal Union Party', known as the 'Chiaki Purge', was carried out. Those on the arrest list were Germanic blood-purists from the old Nazi Party and Gehenna supremacists who loathed the locals.\n\nImmediately after the ruthless overnight 'correction work' ended, the political parties belonging to the All-Federal Union Party took down all existing party signs and resolved to merge into a single party, the 'All-Federal People's Socialist Party', with Secretary Chiaki's ideology as its sole platform.\n\nNow, the noisy debates within the parliament have vanished. The seeds of division hidden under the name of diversity have been removed, and nationalists within the Federation have experienced a major political downfall."
 GEM_news.10.a: "Articles written in blood are not easily erased."
 GEM_news.10.b: "A perfect and clean edit."
 GEM_news.10.c: "Yes! That's how you handle political rivals!"

 GEM_event.1.t: "The Iron and Blood Treaty"
 GEM_event.1.desc: "The Pandemonium Society, amidst the massive situation of the clash of two worlds, has proposed a treaty to protect all of Kivotos and put forward mutual solidarity and anti-earthly values. By signing this treaty, we agree to share information regarding threats from major global powers and to cooperate closely against such threats."

 GEM_event.2.t: "Danzig for Poland"
 GEM_event.2.desc: "An unexpected guest has arrived at the Presidential Palace in Warsaw. It is a diplomatic mission dispatched from the Pandemonium Society of Gehenna Academy. They have brought a surprising proposal: they will return the territories of former Poland, including Danzig, to us.\n\nOf course, nothing in the world is free. In exchange for receiving the territory back, Poland must become a steadfast ally of Gehenna Academy. This effectively means giving up some of our sovereignty and entering under their 'political protection'. While diplomats denounce this as Gehenna's expansionist ambition, others argue it is a realistic choice to gain a powerful protector in the chaotic European situation after the 'Great Transition'.\n\nIs this a golden opportunity to reclaim lost territory and rebuild the nation, or will it be a path to shouldering a new yoke? The moment for a grave decision for the future of Poland has come."
 GEM_event.2.a: "We must reclaim our territory."
 GEM_event.2.b: "Nothing is more precious than independence."

 GEM_event.201.t: "[FROM.GetNameDefCap] Accepts the Deal"
 GEM_event.201.desc: "[FROM.GetLeader] of [FROM.GetNameDef] has accepted the deal where [FROM.GetAdjective] provides 'political protection' in exchange for former Polish territories. Now their regime is in our hands, and plans to utilize the resources of all Poland are being established!"
 GEM_event.201.a: "This is a treaty of mutual friendship between [ROOT.GetAdjective] and [FROM.GetAdjective]."

 GEM_event.202.t: "[FROM.GetNameDefCap] Rejects the Deal"
 GEM_event.202.desc: "The [FROM.GetNameDefCap] side has rejected our proposal. Citing that this is nothing more than a trick to swallow all of Poland, they politely chased away our diplomats and claimed that any kind of cooperation between the two countries will be impossible forever..."
 GEM_event.202.a: "They hasten their own end!"
 GEM_event.202.b: "A shame, that."

 GEM_event.501.a: "This is a great glory for Gehenna and Germany!"
 probably_lead_to_war_with_GEM_tt:0 "This will escalate into §RWar§! with §Y[GEM.GetNameWithFlag]§!."

 GEM_event.6.t: "Final Resolution for Gehenna Academy"
 GEM_event.6.desc: "The Pandemonium Society has finally crossed the line. They have discarded the name of Gehenna and begun to claim the name of the ghost of a bygone era that we despised and loathed: 'Deutsche'.\n\nWhile our Prefect Team shed blood and sweat to drive out the remnants of the Nazis from Bavaria after the Great Transition and establish a new order, they have chosen the path of joining hands with the criminals of history, blinded by a lust for power. This is not a simple political confrontation. This is a direct challenge to the identity of Gehenna and a betrayal that abandons the future of all students.\n\nIt is clear how our students will be treated under the banner they have raised. For power, they will drive students to become cannon fodder for 'adults' and defile the free spirit of Gehenna with the ghosts of an oppressive old system. Dialogue is no longer meaningful. There is no room for compromise. Before that arrogant and corrupt power group completely settles under the name of 'Deutsche Reich', we must act.\n\nThis is not a choice, but a solemn command of history. As the true protectors of Gehenna, the Prefect Team will now bring down the flames of judgment upon that false empire. With our own hands, we must reclaim the name of Gehenna."
 GEM_event.6.a: "Pandemonium has crossed the line."
 GEM_event.6.b: "Condone it. We still need an ally."

 GEM_event.601.t: "Final Resolution for Gehenna Academy"
 GEM_event.601.desc: "Honored Comrades,\n\nThe Pandemonium Society has discarded the name of Gehenna and joined hands with the sins of history. Our Prefect Team can never tolerate this betrayal, and we have raised the banner of the 'Anti-Nazi Alliance' to prevent their madness from spreading throughout all of Kivotos.\n\nThis is not a struggle for Gehenna alone. It is a fight for the justice of all Kivotos, fighting against a revived specter.\n\nPlease join us in this sacred struggle and prove that order and justice prevail. We await your decision."
 GEM_event.601.a: "Of course, they have crossed the line."
 GEM_event.601.b: "The letter was incinerated."

 GEM_event.602.t: "Final Resolution for Gehenna Academy"
 GEM_event.602.desc: "There is nothing as tragic as the moment when one must point a gun at a fellow countryman.\n\nHowever, the Pandemonium Society chose that path themselves. They defiled the honor of Gehenna and became one with the enemies we have fought against. The time of the last chance we gave is over. All efforts for a diplomatic solution have come to naught, and now only judgment by force remains.\n\nThe clock of the ultimatum continues to tick, and all preparations are finished. Now is the time to prove our resolve with action."
 GEM_event.602.a: "It is time for a decision."

 GEM_event.603.t: "Final Resolution for Gehenna Academy"
 GEM_event.603.desc: "This is a dispatch from the Anti-Nazi Alliance General Headquarters.\n\nIt has been declared that the deadline for the ultimatum toward the Pandemonium Society has expired.\n\nAll allied forces, enter combat readiness. An order to commence total war will soon be issued. In accordance with your oath, be ready to answer our call."
 GEM_event.603.a: "It is time for a decision."

 GEM_event.604.t: "Final Resolution for Gehenna Academy"
 GEM_event.604.desc: "The Anti-Nazi Alliance has been formed, and the front lines have been drawn. The betrayal of the Pandemonium Society is now an irreversible reality.\n\nWe must not give them time to rally their forces and straighten their ranks under the banner of a false 'German Reich'. The later our decision, the greater the sacrifice we must pay.\n\nNow is the time to take action. There is no more delay. We will prepare the ultimatum and enter the final stage of preparation for the coming decisive battle. The clock has started moving."
 GEM_event.604.a: "It is time for a decision."

 GEM_event.605.t: "Ghosts of the Old System"
 GEM_event.605.desc: "The Gehenna opposition has finally crossed the line of madness. Under the high-sounding name of the 'Anti-Nazi Alliance', they have openly formed a military alliance against our Pandemonium Society.\n\nThis is an explicit act of treason and an unacceptable provocation intended to plunge Gehenna into the flames of civil war. Those naive idealists cry out for 'justice' and 'order', but their actions will only bring destruction and division. They, who cling to old justifications without facing reality, are the most dangerous enemies of Gehenna.\n\nOur Pandemonium Society has merely made the decisions necessary for the survival and prosperity of Gehenna. Their arrogant self-righteousness has reached a level that can no longer be overlooked. If they want war, we will gladly give it to them. All comrades of the Pandemonium Society, prepare for the coming struggle. The time is approaching to clearly teach those foolish rebels who the true master of Gehenna is."
 GEM_event.605.a: "War is approaching."

 GEM_story.1.t: "Chairman Natsume Iroha"
 GEM_story.1.desc: "\"With Chairman Natsume's great decision, the German state government has finally come into the embrace of our Pandemonium Society! Wow, this is truly a massive scoop that will decorate the front page of 'Weekly Pandemonium'!\"\n\nChiaki jumped up and down while waving her coverage notebook, but Iroha, sitting in the Chairman's seat, let out a sigh as she looked at the mountain of documents.\n\n\"*Sigh*... 'Great decision', my foot. I just did what had to be done. From now on is the start of the truly troublesome work. Reviewing all those documents, and recruiting local bureaucrats to our side... Just thinking about it gives me a headache.\"\n\nAt that moment, Makoto, who was sitting on the sofa in the corner of the office with her arms crossed and her mouth pouted in dissatisfaction, chimed in.\n\n\"Hmph! To think you're making such a fuss over getting your hands on a few provincial governments. When this Makoto-sama was Chairman, I had a grand plan for the conquest of all of Kivotos...\"\n\nMakoto cleared her throat for a moment, then continued with her characteristic laughter.\n\n\"...However, kikikik. Instead of crushing those who resist with force, absorbing the entire administrative system to strip away their power to resist itself... What a quite interesting idea! To think you, Iroha, would use your head like that! As expected of the subordinate I once trusted!\"\n\nIroha pressed her temples at the compliment that didn't sound like a compliment at all. Chiaki kept clicking her shutter as if not to miss even that sight. Taking over the German state government was certainly a great achievement. But thinking of the weight of administrative work that would follow that achievement, Iroha only found herself missing the sweet rest and games after work."
 GEM_story.1.a: "Still, my workload will decrease once the takeover is finished, right?"
 value_GEM_state_government_takeover_tt: "§gIf this focus is completed, the time for the §YState Government Takeover§! decision to complete is shortened.§!"

 GEM_story.2.t: "A Proper Debut"
 GEM_story.2.desc: "\"Cut! Good! Very good! Ibuki-chan, that smile just now was truly the best! A historic scene that will capture the hearts of all Gehenna has been born!\"\n\nChairman Chiaki's energetic voice echoed through the filming set. All the staff on set held their breath while looking at the monitor, and on the screen was Ibuki, smiling brightly against the backdrop of the Gehenna flag.\n\n\"Waa~! Ibuki did well? Praise me! Then can I eat snacks now~?\"\n\nAs Ibuki, who was getting her makeup touched up, shouted brightly, Iroha, who was sitting on a folding chair reviewing the script, let out a sigh.\n\n\"*Sigh*... We've only finished one scene. There's a mountain of footage left to shoot, Chairman. At this rate, even staying up all night won't be enough...\"\n\nJust then, Hanuma Makoto, who had been watching all this from a corner of the set, chimed in with a satisfied laugh.\n\n\"Kikikik! As expected, it was worth this Makoto-sama spotting Ibuki's star power early on and keeping her by my side! Chiaki, you are realizing my genius idea of utilizing Ibuki's cuteness for propaganda quite well!\"\n\nTo Makoto's words, Chiaki replied with a laugh, undeterred.\n\n\"Ahahat, everyone cheer up! Ibuki-chan's CF will become a new symbol of our Gehenna! Now, please prepare for the next cut!\""
 GEM_story.2.a: "It is said it sold quite well."

 GEM_iroha_story.1.t: "The United States Today"
 GEM_iroha_story.1.desc: "Natsume Iroha at first never thought she would be elected as the new Chairman of the Pandemonium Society. She expected to continue her life handling the administration of the Pandemonium Society and occasionally driving the tank with the embarrassing name Makoto gave it... the Super Invincible Ironclad Toramaru.\n\nHowever, the rapidly changing situation after the Great Transition pushed Natsume Iroha to the seat of Pandemonium Chairman, and the things Iroha attempted to reduce her own workload and create a slightly better Gehenna made her the inaugural President of the United States.\n\n\"*Sigh*, how did it even come to this. ...Even so, I can't back down now.\"\n\nEntering the newly built Presidential Office, Natsume Iroha—Chairman of the Pandemonium Society, benevolent leader for the Germans, and now President of the United States—let out a sigh, yet couldn't help but be a bit more determined than usual.\n\nBecause there are now so many people relying on her. And, because she has already walked too far."
 GEM_iroha_story.1.a: "The leisure of a cup of coffee."

 GEM_iroha_story.2.t: "Basic Law for the Federation"
 GEM_iroha_story.2.desc: "The air in the parliament was heavy, and time flowed stickily. Natsume Iroha thought she would rather just kick everything aside and take a nap in the cockpit of Toramaru. The Basic Law for the Federation. It was the final result of a tedious process that dozens of bureaucrats had clung to for the past few months, weighing every single word.\n\nWar or conflict was rather simple. You just had to take down the enemy in front of you. But peace was... a continuation of endless paperwork, meetings, and responsibility. Why did Chairman Hanuma Makoto enjoy such tiring work? Iroha couldn't understand it at all.\n\n\"*Sigh*... Why does the world of adults turn in such a tiring way.\"\n\nHer small sigh was buried in the sound of the bill being read out grandiosely. Federal authority, state autonomy, civil rights. They were certainly important contents, but to Iroha, they sounded like a spell that induces sleep. Especially since they were clauses she had stayed up several nights reviewing.\n\nFinally, the gavel was struck, and the bill was passed. Applaus poured out from the members, but in Iroha's ears, that sound only felt like the sound of the first page of a massive pile of documents that would bind her from now on being turned. The fluffy cushions of her shelter felt distantly far away."
 GEM_iroha_story.2.a: "Still, my workload should decrease a bit because of this."

 GEM_iroha_story.3.t: "The Second Most Troublesome Choice"
 GEM_iroha_story.3.desc: "Fluffy cushions, the aroma of freshly brewed coffee, and the game console in her hand. The short peace allowed to Natsume Iroha was precarious because of a single document sitting on her desk. 'Confirmation of Intent to Run for Reelection'. They were simple, but words heavier than any other approval document.\n\nIf she didn't sign this document, she could escape from all this tedious responsibility. A lazy afternoon with Toramaru, a nap without anyone's interruption. It was a sweet future just thinking about it.\n\nBut... the chaos that would follow? If the clumsy peace she had built collapsed and factional infighting and mudslinging began again... the cleanup would be several times more troublesome than now. *Sigh*, why does the world of adults turn in such a tiring way?\n\nIn the end, she decided to choose the second most troublesome option to avoid the most troublesome option. With a long, deep sigh, Natsume Iroha picked up her pen and wrote her name. It was the moment she formalized her candidacy for the next election.\n\n\"...I wonder, was this the right thing to do.\"\n\nHer low monologue scattered into the quiet air of the office. The election is still a long way off. At least for today, it should be fine to slack off a bit more."
 GEM_iroha_story.3.a: "Anyway, that's all for today."

 GEM_iroha_story.4.t: "Retirement of a Giant Star"
 GEM_iroha_story.4.desc: "A quiet night, the light in the Presidential Office had not yet gone out. Natsume Iroha looked down at her empty coffee cup and silently gazed at the night view of the city spreading outside the window. Not terribly noisy, but not breathtakingly quiet either... just the right amount of noise. The peace she wanted looked like this.\n\nIt was a continuation of dreadful responsibility. However, now it was truly the end. The Federation was stabilized, and a minimum system was in place to keep it running even without her. This much... should be enough.\n\nThe moment she thought so, a sense of liberation washed over her, as if the steel armor that had weighed down her shoulders for years was crumbling like dust. The fluffy cockpit of Toramaru, her own cozy shelter. The daily life she had missed so much was finally within reach.\n\nOf course, one last most troublesome document remained to be handled. To prevent chaos after she left, designating a successor to follow her. That was her final duty as the President of the United States and as Natsume Iroha."
 GEM_iroha_story.4.a: "I heard Yozakura Kirara recently succeeded in her reelection as a legislator."
 GEM_iroha_story.4.b: "Hatami Erika seems like a wonderful alternative as well."
 GEM_iroha_story.5.t: "Founding of the German Human Rights Solidarity"
 GEM_iroha_story.5.desc: "Inside Munich's weathered community center, the air was thick with cautious anticipation and firm resolve. Standing at the podium, an aged Social Democrat opened his mouth, looking out at young students who had just reached adulthood and old comrades who were once political rivals.\n\n\"In the past, we were scattered as Social Democrats, People's Party members, and Center Party members. We blamed each other and fought for our own interests. But today, we gather here under a single name: 'Germans.'\"\n\nHis voice was low, but it reached everyone in the hall clearly.\n\n\"Under the arrogance of the Kivotos students and the greed of the capitalists, our rights have been trampled. But we will no longer remain silent. Whether she intended it or not, within this strange order created by President Natsume Iroha, we have finally gained a small crack to make our voices heard. We will not miss this opportunity.\"\n\nWith his declaration, the 'German Human Rights Solidarity' was officially founded. The applause was not loud. This was not a declaration of victory. It was a quiet vow, signaling the start of a long struggle within the framework of the law to reclaim their stolen rights."
 GEM_iroha_story.5.a: "May our voices reach them one day."

 GEM_iroha_story.6.t: "Hope Inscribed Upon the Code of Law"
 GEM_iroha_story.6.desc: "The calm voice of the announcer flowing from the radio was more dramatic than any shout. \"…As a result of the federal parliamentary vote, I declare the 'Ethnic Quota' bill passed.\" A brief silence. Then, from everyone gathered at the German Human Rights Solidarity headquarters, long-suppressed cheers finally erupted.\n\nAn old union leader with white hair quietly wiped away tears behind his glasses, and young college students embraced each other in joy. The chairman of the Solidarity stood at the podium and shouted with a trembling voice:\n\n\"Comrades! This is not just the passage of a bill! This is the first step in proving that we are no longer strangers in this land, but equal masters of the Federation! We have finally won, with our own hands, the right for our children to not face unjust contempt in classrooms, factories, and offices!\"\n\nOf course, words in a legal code would not erase all discrimination overnight. Resistance from Kivotos-affiliated groups seeking to protect their vested interests might grow even fiercer. But today, they made the first crack in a wall that seemed impossible. It was a victory akin to a miracle in itself.\n\nFor today, they decided to rejoice in this small victory. For starting tomorrow, they would have to prepare for an even longer fight."
 GEM_iroha_story.6.a: "Success!"

 GEM_iroha_story.7.t: "A Choice for Order"
 GEM_iroha_story.7.desc: "Today, the political landscape of the Federation has changed forever. After countless discussions and compromises, the major Gehenna-affiliated parties have finally united under the banner of a massive coalition: the 'Gehenna Grand Coalition.'\n\nThe coalition's first spokesperson declared at a press conference:\n\n\"We will no longer waste national power on exhaustive ideological debates. Now, the politics of the Federation have become clear. Our 'Gehenna Grand Coalition' will lead the nation as the responsible ruling party, and the German parties will check us as a healthy opposition.\"\n\nThis was not a reconciliation, but a cold handshake for an orderly coexistence. Instead of mixing in a single melting pot, the two peoples will now lead the country while respecting each other's spheres. The era of division is over. The era of the two factions has begun."
 GEM_iroha_story.7.a: "Stability is the highest value."

 GEM_iroha_story.8.t: "A Gamble Called Trust"
 GEM_iroha_story.8.desc: "Just a few months ago, no one could have imagined such a sight. On a podium where the flags of Pandemonium and the Center Party hung side by side, the leaders of Gehenna and Germany faced each other. An inauguration ceremony for a coalition government to end the era of distrust and animosity. It was a massive gamble.\n\nThe moment their hands met, countless camera flashes went off. A veteran politician from the Center Party spoke at the podium with a trembling voice:\n\n\"Instead of the easy path of distrust, we have chosen the arduous path of trust. Before laws, before ideologies, we are neighbors living under the same sky. This coalition is not political engineering, but a promise for the future.\"\n\nThe meeting hall was filled not with the cheers of a victor, but with the overwhelming emotion of those witnessing a new beginning. Of course, a harsh reality awaits starting tomorrow. Understanding different cultures and overcoming deep-seated prejudices will be far from easy. But today, they took the most difficult first step. Whether this fragile spark can burn into a great flame of harmony now rests in their hands."
 GEM_iroha_story.8.a: "For a unified Federation."

 GEM_iroha_story.9.t: "Another Handshake"
 GEM_iroha_story.9.desc: "The day Gehenna and Germany shook hands, many called it a 'miracle.' However, on the path toward true harmony, the highest mountain yet to be crossed remained. The arch-enemy of centuries: Trinity.\n\nInstead of repeating the history of distrust and animosity, the Pandemonium-Center Party coalition once again chose an impossible-looking gamble. It was to give a seat in the coalition to Trinity-affiliated parties.\n\nToday, three hands were joined on the podium. The horns of Gehenna, the eagle of Germany, and the wings of Trinity finally gathered under one symbol. The miracle did not end once. Gehenna, Germany, and Trinity. The federation of three peoples proved that hope beyond the impossible can become reality."
 GEM_iroha_story.9.a: "An 'Eden Treaty' for a new era."

 GEM_iroha_story.10.t: "Triangular Formation"
 GEM_iroha_story.10.desc: "With the Gehenna Grand Coalition taking power and German parties forming the opposition, the politics of the Federation seemed to find order within a stable two-party system. However, a new variable emerged upon that seemingly solid structure. It was 'Trinity.'\n\nOnce enemies, they had grown into a political force that could no longer be ignored. The Gehenna Grand Coalition stood at a difficult crossroads. Should they keep them as enemies, or bring them into the system to manage them?\n\nThe conclusion was the latter. Now, the Federation has become like a triangular table supported by three massive legs. Gehenna, Germany, and Trinity. The stable two-party system is over. From now on, an era of complex balance where one cannot see an inch ahead begins."
 GEM_iroha_story.10.a: "...Another political rival has been added."

 GEM_iroha_story.11.t: "The Noise Called Liberty"
 GEM_iroha_story.11.desc: "The chandeliers of the parliament building shook precariously at the shouts of the members. This was the first scene of the 'Federal Parliament encompassing all political forces.' The result of everyone, once branded as illegal organizations, gathering in one place was not an orderly debate, but total chaos.\n\nOn one side, the 'Pandemonium Coalition'—a mix of Pandemonium, Social Democrats, the Center Party, and even the Communist Party—shouted for order, while across from them, members of the Nazi Party with their mustaches hurled jeers and disrupted proceedings.\n\nYet, even in this massive noise, there were those making their own voices heard. Kurodate Haruna of the Gourmet Research Society sipped tea elegantly in her seat, lamenting, 'The acoustic design of this parliament is the worst. We must teach basic etiquette before gourmet.' Minority party members from Trinity sat with frozen expressions as if they couldn't believe the sight, and representatives of the Danish and Sorbian minorities struggled to get a chance to speak amidst the brawling of the giant parties.\n\nIs this truly the image of the liberal democracy we dreamed of? No one could answer. But one thing was certain. This noisy freedom was far more human than the chilling silence of a dictator."
 GEM_iroha_story.11.a: "Still, the noise comes together to form music."

 GEM_12.iroha_story.12.t: "Shackles Named Consensus"
 GEM_iroha_story.12.desc: "Natsume Iroha seriously pondered how she ended up here. Being the head of Pandemonium was troublesome enough, but now she was a 'Jointly Elected Leader' supported by both the Gehenna and German sides. On her desk lay reports written in Gehenna-go and reports written in German side-by-side, causing her a headache like an invisible border line.\n\n\"Haah… it was actually easier during Chairwoman Makoto's time.\"\n\nAt least back then, there was only one kind of troublesome target to deal with. But not anymore. She had to walk a tightrope between Gehenna's dissatisfaction and Germany's demands. If she let out even one wrong sigh, this precarious federation might collapse. And the cleanup for that… just imagining it was horribly troublesome.\n\nSweet coffee inside the Toramaru and a leisurely nap. All of that felt like relics of a distant past. Instead of picking up her pen, she quietly pushed the two types of reports to one side of the desk.\n\nShe had already come too far. Abandoning everything now would only bring about an even more troublesome future. She knew that all too well."
 GEM_iroha_story.12.a: "...For now, I'll start with coffee."

 GEM_iroha_story.13.t: "A Tale of Germany, A Tale of Gehenna."
 GEM_iroha_story.13.desc: "On the podium of the Federation Reconstruction Anniversary Festival, Natsume Iroha let out a small sigh in front of the microphone. This really isn't my style. But as she watched Gehenna students and German families mixing, laughing, and chatting below the podium, a faint smile appeared on her lips.\n\n\"…It's as noisy as ever. Well, whether it's that side or this side… the way they enjoy festivals doesn't seem much different. A lot has happened since the Great Transfer. Still, we've managed to stand up again and laugh together, so isn't that enough? …Anyway, I hope everyone has a good time. That is all.\"\n\nThe speech was just that. However, the President's brief sentiment held more meaning to the competent bureaucrats of the administration and political commentators. Two peoples who stood up together after overcoming the shared wound of the 'Great Transfer.' And a cultural homogeneity that was 'not much different.' It was the moment something new, centered on these two axes, was being born.\n\nIroha herself was merely describing the scene before her, but the words she absentmindedly tossed out were now becoming the new direction of the Federation."
 GEM_iroha_story.13.a: "Well, it's not a bad story."

 GEM_iroha_story.14.t: "The Veteran Mediator"
 GEM_iroha_story.14.desc: "The air in the President's office was tense. The representative of the former Gehenna People's Party and the representative of the National Socialist German Workers' Party were growling at each other over the budget proposal without giving an inch. But Natsume Iroha just rested her chin on her hand, looking at her cooling cup of coffee. 'Here we go again,' she thought to herself.\n\nIf it were the old her, she would have wanted to run away from this noise. But through countless meetings and compromises, she had learned how to read the flow of these fights. She knew exactly when to intervene, whose pride to stroke, and what compromise to toss out so that both sides would reluctantly back down. She knew it disgustingly well.\n\nWhen the arguments reached their peak, she spoke softly. A few questions, a slight suggestion for concession, and a word that seemed to see through the opponent's next move. Her words weren't passionate, but they sharply pierced the core of both parties. An hour later, the two representatives reluctantly signed the agreement and left the office hesitantly.\n\nLeft alone, Iroha let out a deep sigh. Haah… since when did I get so used to such troublesome work? She didn't find it pleasant at all that she was becoming competent."
 GEM_iroha_story.14.a: "Tomorrow, I'm definitely going to slack off…"

 GEM_iroha_story.15.t: "Footsteps of History"
 GEM_iroha_story.15.desc: "Once, two peoples pointed guns at each other. The names 'Gehenna' and 'German' seemed like impassable walls. But after long years and countless compromises under the leadership of Natsume Iroha, the two factions have finally reached an agreement.\n\nToday, the Federal Parliament, with the unanimous support of the 'All-Gehenna People's Party' and the German opposition, inscribed a new phrase into the preamble of the constitution.\n\n\"This Constitution is established for the common development of the Gehenna and Germanic peoples.\"\n\nThis short sentence, heavier than any declaration, has eternally codified that the two peoples are one nation. Natsume Iroha, watching this historical moment from below the podium, let out a truly comfortable sigh for the first time in a long while. It was the moment the stable nation she had desired—where 'no more troublesome things happen'—was finally completed."
 GEM_iroha_story.15.a: "Good work everyone."

 GEM_makoto_story.1.t: "Gehenna Unification Speech"
 GEM_makoto_story.1.desc: "Everything in Gehenna has knelt under the banner of the Pandemonium Society. The Prefect Team, the last resistance force in the streets, has been disarmed, and their old justice has made way for Chairman Hanuma Makoto's new order. Now, Gehenna has left its divided past behind and is ready to unite under a true leader to show its majesty to all of Kivotos. Chairman Makoto stands before the students of a unified Gehenna to declare the opening of a new era.\n\n\"Kikiki! Listen, my beloved Gehenna students! Today, I, Hanuma Makoto, stand here as the 'Rightful Unifier' of Gehenna! The old, inefficient regulations that held us back for so long, and those nags called the Prefect Team, are no more! They did not understand the value of true greatness and only hindered my grand plan by shouting for the maintenance of the status quo!\"\n\nAs Makoto pauses for breath, cheers erupt from the students gathered in the square.\n\n\"Now, Gehenna will speak with one voice—my voice! It will move with one will—my will! Nothing can stop us anymore! Based on this unified power, we will prove the greatness of Pandemonium to all of Kivotos! Listen closely to my speech! The new era of Gehenna begins right here, right now!\"\n\nAfter the speech, Makoto returned to the Chairman's office with a satisfied laugh. Iroha, following behind her, dropped a mountain of documents on the desk with a deep sigh.\n\n\"Haah, how did it end up like this? Your speech was grand, but you'll have to handle all these approval documents yourself. Since the Prefect Team is gone, all administrative duties have been dumped on us.\""
 GEM_makoto_story.1.a: "W-what? Such complex paperwork is obviously for the brilliant bureaucrats to do!"
 GEM_makoto_story.1.b: "Y-yes, I'll... I'll manage somehow."

 GEM_makoto_story.2.t: "Outer Gehenna Integration Speech"
 GEM_makoto_story.2.desc: "Handyman 68, the symbol of Kivotos' lawless zone, has finally come under the influence of Pandemonium. It's a shame the Handyman 68 gang escaped, but Rikuhachima Aru's political experiment has come to an end.\n\n\"Kikiki! As expected, they were quite persistent. But in the end, they knelt before my, the great Makoto's, grand plan! With this, we can say we've contributed to the unification of Gehenna!\"\n\nAs Makoto spoke arrogantly with her arms crossed, Iroha, standing next to her, spoke up.\n\n\"Haah, what is this? Making such a fuss just to conquer this small patch of land that wasn't even interested in us… Fine, fine. Since I was asked, I'll organize the report, but next time, could you please choose a more legitimate opponent?\"\n\n\"Kikikit! Iroha, you still don't get it! Minor disorder is what eats away at a great order! I intend to remove every small thorn for the sake of conquering Kivotos!\""
 GEM_makoto_story.2.a: "It didn't really mean much."
 GEM_makoto_story.2.b: "What we need right now is a justification!"

 GEM_makoto_story.3.t: "Host Inauguration Speech"
 GEM_makoto_story.3.desc: "Trinity General School, which cried out for justice and nobility, has finally fallen under the banner of Gehenna. Their pride, the Justice Task Force, has been disbanded, and the students have met a new ruler. In the seat where Nagisa once sat at the Tea Party table, Hanuma Makoto now sits, savoring her victory. She makes sure the gathered Trinity students know exactly who the new 'Host' of this era is.\n\n\"Kikikit! This atmosphere is quite nice, isn't it? The high-and-mighty teacups and snacks, and that fake elegance. Now, the owner of all this is me, Hanuma Makoto! The worn-out 'justice' you worshipped has finally crumbled before my ambition! Look, this is the difference in power!\"\n\nMakoto lifts a teacup as she continues her speech.\n\n\"Now, Trinity will no longer be bound by hypocritical beliefs. Your potential will only be used for my great achievement—establishing a magnificent order that encompasses all of Kivotos! All those who were intoxicated by the glory of the past, step aside! Listen closely to the speech of the new 'Host', me!\"\n\nAfter the speech, in the messy tea party room, Iroha found the most comfortable-looking sofa and leaned back.\n\n\"Fuwaah… want to go slack off somewhere else? The cushions here are quite soft. As expected, it seems like a good place to not get caught. I'll take a quick nap while the Chairwoman is giving her speech.\"\n\n\"Wait, Iroha…. No, now is not the time for that. Kishishi! Fine, let's enjoy the afterglow of this victory!\""
 GEM_makoto_story.3.a: "Ack, what is this?! It's bitter?! They eat stuff like this at the Tea Party?"
 GEM_makoto_story.3.b: "To completely conquer Trinity, I should learn a bit about the Way of Tea."

 GEM_makoto_story.4.t: "General Student Council President Inauguration Speech"
 GEM_makoto_story.4.desc: "The heart of Kivotos, the Sanctum Tower, which had fallen into chaos due to the disappearance of the General Student Council President, has finally met a new master. Hanuma Makoto's forces crushed the resistance of the General Student Council factions and seized power. Now, Makoto has risen to the position of 'General Student Council President,' commanding all of Kivotos rather than just being the Chairwoman of Gehenna. She makes her voice echo throughout Kivotos via the Sanctum Tower's broadcast system.\n\n\"Kikiki! To all students of Kivotos! The position of General Student Council President, which had been vacant for so long, and that era of chaos and disorder, ends today! I, Hanuma Makoto, am the new General Student Council President of Kivotos! You no longer have to wander lost. You only need to follow my magnificent guidance!\"\n\nHer voice is brimming with confidence.\n\n\"I promise you. Under strong leadership, Kivotos will become an iron fortress unshaken by any threat! Under my rule, Kivotos will enjoy the greatest prosperity in history! Great achievements aren't made overnight. But I, Makoto-sama, will never give up! Open the doors to my era!\"\n\nAs Makoto finished the broadcast and rolled her stiff shoulders, Iroha, sitting in the General Student Council President's chair flipping through documents, spoke.\n\n\"Haah, well, I've finished everything that needed to be done. It was exhausting figuring out the General Student Council's vast administrative system. Chairwoman—no, Madam President? The next schedule is the Millennium budget review. It doesn't look like they'll let me… slack off. I guess it can't be helped…\""
 GEM_makoto_story.4.a: "Wait! I pressed the wrong button!"
 GEM_makoto_story.4.b: "A great leader isn't shaken by things like this."

 GEM_makoto_story.5.t: "Millennium Chancellor Inauguration Speech"
 GEM_makoto_story.5.desc: "Millennium Science School, the symbol of reason and rationality, has succumbed to the feet of Pandemonium. Neither the Engineering Department armed with cutting-edge technology nor the elite agents of C&C could stop Makoto's ambition. Now, all of Millennium's technological prowess and data are in the hands of one person: the new 'Chancellor,' Hanuma Makoto. She sends a message to all students through Millennium's central database.\n\n\"Kikiki! Talented individuals of Millennium! Your knowledge and skills will no longer be wasted on aimless inquiry! As of today, I am your new Chancellor! All your research, all your inventions, will now be part of my grand plan to unify Kivotos!\"\n\nMakoto continues her speech while floating hacked drones in the air.\n\n\"Those toy-like robots you made, it's time for them to move for a true purpose! Kishishi! The important thing is, your technology is now under my control! No more discussion! Only execution!\"\n\nMeanwhile, in a corner of the meeting room, Iroha had found the most comfortable-looking chair and was enjoying a game on her tablet.\n\n\"Thank you…. Wait, what? This chair is so comfortable I accidentally said thanks…. Chairwoman's speech won't be over for a while, so I'll just rest here until then.\""
 GEM_makoto_story.5.a: "Wait! Why is the drone attacking me?!"
 GEM_makoto_story.5.b: "I shall order new research!"

 GEM_makoto_story.6.t: "Promulgation of the New German Constitution"
 GEM_makoto_story.6.desc: "\"Haah... it's a pain, but I have no choice. The preparations for Chairwoman Makoto's speech are done... now I just have to wait for that noisy event to end.\"\n\nStanding beside the podium, Natsume Iroha muttered with a small sigh. At the end of her gaze, as Hanuma Makoto appeared on the balcony of the newly renovated Reichstag, a massive cheer erupted from the crowd filling the square. Makoto soaked in the cheers, spreading her arms wide.\n\n\"Kikiki! Behold, my new subjects! Today, in the name of Hanuma Makoto, a new chapter of history has opened! The 'Reich' of the past was bound by the shackles of an old and inefficient bloodline, walking its own path to ruin! Trying to untie those complicated knots is just a waste of time for fools! I, as a great leader should, have cut that knot in a single stroke!\"\n\nMakoto declared, looking down at the square.\n\n\"From now on, 'German' is not defined by an old bloodline! Only those who join my great achievement and show absolute loyalty to my leadership will be proven worthy as true Germans! When your will is directed toward me, only then will you enjoy the glory of becoming part of this great nation! And today, to eternally carve this new order, I declare the promulgation of the 'New German Constitution'!\"\n\nShe paused for a moment and shouted with a satisfied smile.\n\n\"Starting from this great moment, we discard the name 'Deutsches Reich,' a remnant of the past bound to bloodlines! From now on, our fatherland will be reborn as the great 'Deutschland,' embracing all those united under my ideology! Kishishi! Under my rule, the new Deutschland will take its first step in the great feat of conquering Kivotos—no, the entire world! Now, cheer! For the era of your new Führer, Hanuma Makoto!\"\n\nIn the crowd filling the square, enthusiastic cheers and calculated silences mixed and echoed."
 GEM_makoto_story.6.a: "With this, Hanuma Makoto-sama has proven her value as a leader even in a new world!"

 GEM_makoto_story.7.t: "Upon the Podium"
 GEM_makoto_story.7.desc: "\"Kikiki! My beloved Gehenna schoolmates! Your petty anxieties and questions have reached even my ears! What your role is in this great undertaking, what your future will be—you're losing sleep over such trivial worries, aren't you?\"\n\nIn the newly renovated parliament hall, Hanuma Makoto spread her arms wide toward the many Gehenna students gathered before her. Since the Great Transfer, as their affiliation was incorporated under the massive German state, she intended to cut down the anxiety spreading among the students in a single stroke.\n\n\"Fools! Have you forgotten whom you follow! Behold! See what I, Hanuma Makoto, have prepared for you! The Gehenna of the past was merely a single autonomous district, but from now on, Gehenna Academy will be a sacrosanct territory within this great German state, guaranteed a special legal status! You are no longer mere students of a chaotic academy! You are the elites who will lead my great undertaking, the cornerstone of this new empire! So cast away all anxiety and follow me! Your future will be guaranteed by me, Hanuma Makoto, personally! Kishishi!\"\n\nAs Makoto's declaration ended, the hall was covered in enthusiastic cheers that overwhelmed the anxiety. Welcoming Makoto as she stepped down from the podium, Iroha let out an exhausted sigh. 'Haah, what a chore. It's finally over… I can probably slack off for a while now, right?' She was already missing the soft cushions of the rest area, wondering what kind of troublesome speech Makoto would dream up next."
 GEM_makoto_story.7.a: "As expected, the students needed a voice that brings reassurance."

 GEM_makoto_story.8.t: "Temporary Measure"
 GEM_makoto_story.8.desc: "The office of the Pandemonium Society has changed. The place that once had piles of documents, meaningless doodles, and the soft sofa where Iroha-senpai used to nap is gone. Instead, angular furniture, empty walls, and a German design emphasizing only efficiency have taken its place. It's as if I've walked into someone else's office by mistake, not the 'Pandemonium' we knew.\n\nOf course, I know this is part of the 'cultural standardization' work being carried out under Chairman Hanuma Makoto's grand vision. How could I not know her profound intention that we must look like Germans ourselves to rule Germany?\n\nBut... is this unfamiliar silence and order really what we wanted? The fact that even our free and chaotic selves have become part of a past to be 'buried' feels somewhat chilling. I wonder if the same brilliant ideas or bold plans as before can come out of this cold space.\n\n...Haah. Enough idle thoughts. I have to meet the article deadline. I picked up my pen and began to squeeze out sentences praising this 'great change.'"
 GEM_makoto_story.8.a: "A slight sense of foreboding lingered."

 GEM_makoto_story.9.t: "Symbol of a New Era"
 GEM_makoto_story.9.desc: "The massive hall in Hessen was filled with new flags. Instead of the familiar Gehenna Academy or Nazi Party symbols, a vivid 'Odal Rune' decorated the podium. Taking the stage, Hanuma Makoto opened her mouth while savoring the various gazes fixed upon her.\n\n\"Kikiki! This place today will become history! This is not Pandemonium! This is not Gehenna's party! Today, in this place, I declare the founding of the 'National Syndicalist German Patriot Party'!\"\n\nAfter a brief pause, Makoto shouted with manic passion.\n\n\"Germany has lost its way! It is groaning amidst old ideologies and incompetent leaders! Only I, Hanuma Makoto, can make Germany great, so I have decided to shoulder Germany's fate myself!\"\n\nThe Gehenna students gathered on one side of the hall looked at each other with puzzled expressions. \"Why do we have to be German patriots...?\" Their loyalty was toward Gehenna, not this unfamiliar land. The faces of the German party representatives participating in the coalition were frozen in shock. They had only sought a collaborator, but suddenly they had become extras for a new fanatical group.\n\nHowever, unlike them, the German masses filling the hall were enthusiastic. To them, Makoto's origins didn't matter. The reconstruction of the nation, strong order, and the familiar promise of a 'unified people.' They were simply witnessing the emergence of a new leader promising a 'strong Germany.' Amidst the conflicting reactions, Makoto smiled with satisfaction, hearing only the applause directed at her. Her most bizarre and daring gamble was successfully beginning."
 GEM_makoto_story.9.a: "Exiting with applause."

 GEM_makoto_story.10.t: "Outlawing the NSDAP"
 GEM_makoto_story.10.desc: "As of today, I proclaim the 'National Purification Decree,' banning all activities of the National Socialist German Workers' Party (NSDAP) and defining its existence as illegal.\n\nThis measure is not simply due to differences in political ideology. It is because the Nazi Party's history of extremist ethnic exclusion and incitement of hatred toward specific groups directly contradicts the value of integration that our 'Unified Fatherland' pursues. Their ideology is like a toxin that sows seeds of division in society and destroys the community from within.\n\nThe new Germany does not divide citizens by bloodline or origin. Only loyalty to the nation and the will to participate in the common undertaking serve as the qualifications for a 'New German.' In this great era of integration, there is no place for old ideologies that assert the superiority of a specific race and justify exclusion and violence.\n\nAccordingly, all assets of the Nazi Party will be nationalized, and the leadership will be arrested on charges of undermining national integration. Washing away the stains of the past, we will move toward the future as a truly unified fatherland."
 GEM_makoto_story.10.a: "It's a political arrest."

 GEM_makoto_story.11.t: "National Syndicalist Patriot Party"
 GEM_makoto_story.11.desc: "A political upheaval has occurred. As the 'Gehenna-Germanic Cultural Fusion' line proposed by Führer Hanuma Makoto began to gain public persuasiveness, a massive fracture appeared within the rival Nazi Party. Witnessing the dynamism of the new era and the possibility of 'victory,' young members and pragmatists of the Nazi Party abandoned the old leadership tied to past failures and began to join Makoto's 'National Syndicalist German Patriot Party' in droves.\n\nDue to this mass defection, the political landscape of Germany has been completely reorganized. Makoto's party has now been reborn as a massive ruling party occupying an overwhelming majority in parliament, establishing a 'one-party dominant coalition' system with other minor parties as formal partners. Conversely, the Nazi Party, having lost all its key talent and support base, has dwindled into a minor party consisting only of hardline elders, no longer able to exercise political influence.\n\nInstead of eliminating opponents by force, she absorbed strength from their very heart, making herself bloated. This was the most cunning and perfect victory achieved by Hanuma Makoto's methods."
 GEM_makoto_story.11.a: "For victory!"

 GEM_makoto_story.12.t: "Horns are New Wings"
 GEM_makoto_story.12.desc: "In the streets of Hessen after the National Syndicalist Youth march, Hans and Fritz were leaning against a wall, looking at the empty street.\n\nFritz spoke first.\n\"You know, sometimes the Gehenna people seem really different from us.\"\n\nHans nodded.\n\"Don't even get me started. They're as strong as oxen, and they only eat weird things. I mean, they have horns on their heads. Like demons.\"\n\nAt those words, Fritz fell into thought for a moment, then chuckled.\n\"Demons? I don't know. Lately, I've been thinking those horns look pretty cool.\"\n\n\"What?\"\n\n\"Think about it. The Führer has those horns too. She's the strongest and leads everyone. It's like... a symbol of power.\"\n\nHans was speechless at his friend's odd remark for a moment, then laughed along.\n\"Haha, a symbol of power. It sounds plausible when you put it like that.\"\n\nThe laughter of the two young men echoed briefly in the empty street. They had not yet realized how the fatherland was changing."
 GEM_makoto_story.12.a: "Something is changing."

 GEM_makoto_story.13.t: "In the Name of the Heavens"
 GEM_makoto_story.13.desc: "The square in Hessen at night was lit as bright as day by tens of thousands of torches. However, that flame was not an ordinary orange, but burned with an ominous purple light, as if burning Gehenna's sulfur.\n\nIn the center of the square, a massive bonfire was piled up, swallowing the remnants of 'inferior' civilizations. Alongside old German liberal books, Trinity theological texts and Millennium science journals were mixed together, turning into a handful of ash.\n\nMoving ranks shouted ancient Germanic war songs, then soon transitioned into the intense and unique battle chants of Gehenna. A high-ranking party member on the podium proclaimed that 'the pure blood of the Nordics must be purified by the sacred fire of Hinnom, and only the destiny of the two great peoples is worthy of ruling this world.'\n\nThis is the first ritual announcing the birth of the 'Nordic-Hinnom Civilization.' In the place where reason and rationality were burned, an ideology steeped in national hatred was born."
 GEM_makoto_story.13.a: "The birth of the second evil."

 GEM_makoto_story.14.t: "Behind the Podium"
 GEM_makoto_story.14.desc: "The speech was surprisingly short and concise. Hanuma Makoto made a formal announcement that she would 'respect the 1933 system for the stability and maintenance of order of the German state,' then hurriedly stepped down from the platform. German bureaucrats were puzzled by the unexpected 'status quo' declaration, but the Pandemonium executives scattered as if they were used to it.\n\nMotomiya Chiaki followed Makoto to the lounge. There, Tanka Ibuki was already waiting for her with crayons in hand.\n\n\"Makoto! You're late! I was supposed to draw pictures with Ibuki!\"\n\n\"Kikiki! I kept you waiting, Ibuki! It's time to show my great artistic soul... Ack! The crayons don't go this way!\"\n\nChiaki chuckled softly watching Makoto fluster and Ibuki laugh brightly. A sight more engrossed in playing with Ibuki than the grand undertaking of 'Managing the German State.' She thought as she pressed the shutter, 'Ahaha, that's our Chairwoman for you.'"
 GEM_makoto_story.14.a: "This side is much more of a 'scoop'!"

 GEM_makoto_story.15.t: "As a New Sun Rises"
 GEM_makoto_story.15.desc: "\"Kikiki! My beloved schoolmates, and... you Germans who will become my new subjects! Did you think I would be satisfied with Germany's old order! How foolish!\"\n\nStanding on the balcony of the Reichstag, Hanuma Makoto shouted toward the square where Gehenna students and nervous-looking German bureaucrats were mixed.\n\n\"You Germans were trapped in the prison of boring 'order'! But I, Hanuma Makoto, shall personally liberate you from those worn-out shackles! We aren't locking Gehenna into that narrow academy! We will make this entire Germany our great Gehenna!\"\n\nCheers erupted from one side of the square. Students from the Gourmet Research Society noted something in their notebooks, calling it the 'new horizon of gourmet,' while members of the Hot Springs Development Department were already measuring the ground near the parliament building.\n\n\"From now on, you shall learn true 'freedom'! Explosions! Betrayals! And endless struggle! Is that not the true driving force of progress! Your old culture is being reborn under our great chaos! Kishishi!\"\n\nWhen the speech ended, the square was starkly divided between the enthusiastic cheers of Gehenna students and the shocked silence of the Germans. Welcoming Makoto as she stepped down from the podium, Iroha held her temples.\n\n\"Haah... what is this, Chairwoman. Making all of Germany into Gehenna is hundreds of times more troublesome than just building one academy... now we have to handle the aftermath of explosions all over Germany...\""
 GEM_makoto_story.15.a: "I believe it's the right choice."

 GEM_makoto_story.16.t: "The Position of the New Gehenna"
 GEM_makoto_story.16.desc: "In the Reichstag office, Führer Hanuma Makoto, as the embodiment of the 'Gehenna-Germanic' people's will, reviewed documents with satisfaction. Although she seized all of Germany, she did not forget the power of Gehenna, her foundation.\n\n\"Kikiki! I've secured the loyalty of the Germans, but my true blade is still the schoolmates of Gehenna! Iroha!\"\n\n\"Haah... did you call, Führer. What troublesome matter is it this time...\"\n\nAs Iroha entered with a file, Makoto pointed to a giant map of Germany with her finger.\n\n\"I will appoint our Gehenna students in mass to key administrative positions and military commands across Germany! To run this great empire, I need not just old German bureaucrats, but 'real deals' who will be my hands and feet!\"\n\n\"What? But that would cause backlash from the Germans...\"\n\n\"Backlash? Kishishi! Who would dare to protest my decision now! They will soon realize. Gehenna's way is the most efficient and powerful force to lead this empire! Prepare the administrative procedures immediately!\"\n\nIroha let out a deep sigh, sensing the mountain of work that would increase, but Makoto's eyes were already burning toward the next great feat."
 GEM_makoto_story.16.a: "This empire will be completed by the power of both peoples!"

 GEM_makoto_story.17.t: "Party Business"
 GEM_makoto_story.17.desc: "In the Reichstag office, Führer Hanuma Makoto, the leader of the newly defined 'Gehenna-Germanic people,' was reviewing documents but yawned, looking bored. The process of seizing Germany was quite fun, but once at the top, the repetitive administrative work was nothing but dull.\n\n\"Kikiki... Do they think I, Hanuma Makoto, became Führer just to do these petty approvals! Iroha!\"\n\n\"Haah... did you call, Führer. What is it today...\"\n\n\"Delegate all these troublesome practical matters to the collective leadership of the 'National Syndicalist German Patriot Party'! Those guys got their titles, so they should do some work!\"\n\nIroha looked at Makoto with surprised eyes.\n\n\"Pardon? But delegating the Führer's authority to the party...\"\n\n\"Quiet! A great leader must focus on the greater 'undertaking,' not daily chores! I will now focus on more important things. For example... yes, I need to increase the time I spend playing with Ibuki! Kishishi!\"\n\nMakoto stood up abruptly and left the office, leaving Iroha behind to look back and forth between the 'Ibuki-exclusive playroom budget increase' that the Führer just approved and the mountain of unread practical documents, letting out a deep sigh."
 GEM_makoto_story.17.a: "Haah... how did it end up like this."

 GEM_makoto_story.18.t: "Reich President Hanuma Makoto"
 GEM_makoto_story.18.desc: "The Black-Red-Gold tricolor was once again hoisted alongside others at the Reichstag. It was the day of the inauguration speech for Hanuma Makoto, who had discarded the title of 'Führer' and accepted the position of 'Reich President.'\n\n\"Kikiki! My great subjects! The old symbols have been purged! But the achievement of a true leader is not hidden by such symbols! Whether it's 'Führer' or 'President,' what does the name matter!\"\n\nMakoto shouted from the balcony toward the square. Her voice was full of confidence.\n\n\"Only one thing matters! The fact that the one standing here is me, Hanuma Makoto! You may believe you've found stability under this tricolor, but do not forget. The heart of this nation is still in my grasp! Kishishi! My great undertaking begins now!\"\n\nBelow the podium, Chiaki was busy pressing the shutter. \"Ahaha! 'Moderate leader proclaims a new Germany!' This is a perfect headline!\"\n\nNext to her, Iroha held her throbbing head. \"Haah... what changes just by changing the name. In the end, that personality is the same... only more troublesome work will increase.\""
 GEM_makoto_story.18.a: "Great achievements are not made overnight!"

 GEM_makoto_story.19.t: "Parliamentary Politics"
 GEM_makoto_story.19.desc: "\"Dammit! This isn't it! I thought the position of 'Reich President' would be greater and cooler!\"\n\nHanuma Makoto irritably pushed away the coalition negotiation plans and parliamentary minutes piled on her desk. Getting rid of the Nazi Party and becoming a 'moderate' president went as planned. But was her great undertaking insufficient? Instead of being an absolute ruler, she found herself held back by annoying 'parliamentary politics.'\n\n\"Kikiki... they dare demand a budget revision from me, Makoto? This guy and that guy, they all need to be purged...\"\n\n\"Haah... Madam President. We don't have a majority with just the 'National Syndicalist German Patriot Party,' so it can't be helped. Look, the coalition partner members are waiting...\"\n\nIroha spoke from the doorway with a look of annoyance.\n\n\"Quiet! I was just coming up with a groundbreaking plan for the conquest of Kivotos! Meetings with such trivial people are—!\"\n\n\"You shouldn't call them 'trivial people,' Madam President!\" Chiaki suddenly cut in, firing off a camera flash. \"'President Hanuma Makoto directly criticizes coalition partners! Is political catastrophe coming?' Ahaha, this is quite a scoop!\"\n\n\"Ugh... uwaaah! Get that camera out of here right now!\"\n\nMakoto vented her frustration at the reality that her great undertaking was held back by mere parliamentary play." 
 GEM_makoto_story.19.a: "My... my great undertaking...!"

 GEM_makoto_story.20.t: "Suspension of Authority"
 GEM_makoto_story.20.desc: "At dawn today, in an unpredicted move, the Gehenna Executive Committee mobilized parts of the military and armed forces to suspend the authority of Consul Hanuma Makoto.\n\nHanuma Makoto's 'Union of Gods' has finally met its end. The Federal Council, newly composed of Germanic nobles and Gehenna conservatives, judged that her manic 'undertakings' were leading the entire nation to ruin.\n\nNow we must elect a new leader to reconstruct order upon these ruins. Who will be the rational voice to replace her madness?"
 GEM_makoto_story.20.a: "Yozakura Kirara is receiving enthusiastic support from the citizens."
 GEM_makoto_story.20.b: "Now the Oberkommando der Wehrmacht steps in!"
 GEM_makoto_story.20.c: "...Natsume Iroha will handle this situation."

 GEM_puppet_events.1.t: "The Fate of [GEM_puppet_target.GetName]"
 GEM_puppet_events.1.desc: "A Reichskommissariat has been established in the region of [GEM_puppet_target.GetName], and we must appoint someone to control this area. [ROOT.GetLeader]'s side wishes to put a hardline figure in charge, but perhaps appointing a conciliatory figure or a local might be the answer."
 GEM_puppet_events.1.a: "We need a trustworthy Gehenna student."
 GEM_puppet_events.1.b: "Let's form a locally-friendly government."

 GEM_satsuki_story.1.t: "Deciding the National Name"
 GEM_satsuki_story.1.desc: "Everything was going smoothly. The old shell of 'Germany' was successfully seized, and the NK Ultra Project was perfectly tuning the public consciousness under the new order. However... a new era requires a new symbol.\n\nKogyoku Satsuki scanned three files on her desk one by one. They were suggestions from the Intelligence Department for the new name of the nation.\n\nSatsuki rested her chin on her hand and fell into thought for a moment. All three names could stimulate the public psyche in their own ways and effectively engrave the national identity. There was no fundamental difference. Ultimately, it was just a matter of what kind of 'vibe' she wanted to create.\n\n\"Fufu, whichever I choose, there won't be much difference in leading the masses. What's important is the symbolism the name holds. This is purely... a matter of my 'taste.' Now, what name shall I use to record this new era?\""
 GEM_satsuki_story.1.a: "Hyperborea sounds good."
 GEM_satsuki_story.1.b: "Thule sounds good."
 GEM_satsuki_story.1.c: "Let's decide by the meaning of the words."

 GEM_satsuki_story.2.t: "Historical Merger"
 GEM_satsuki_story.2.desc: "The square was filled with a strange heat. The flags of the Pandemonium Society and the Swastika, the symbol of the old German Reich, hung side by side. Under the two contradictory symbols, the gathered crowd was shouting promised cheers as if with one voice.\n\nThe Nazi Party representative on the podium shouted for 'Aryan glory,' but his voice contained no hatred. When his speech ended, Kogyoku Satsuki, Chairwoman of Pandemonium, quietly took the stage. Her voice echoed softly throughout the square via the loudspeakers.\n\n\"Look. Hatred and conflict have vanished. The chaos of Gehenna and the wounds of Germany have all healed, and we have finally achieved harmony under one will. In the name of the 'Greater Germanic Freedom Union,' humanity and Kivotos will welcome eternal peace.\"\n\nAfter the speech, the square was once again filled with tuned cheers and silenced bewilderment. Listening to those sounds, Satsuki smiled sincerely. Fanatic, dictator... it didn't matter what the world called her. They wouldn't understand. A perfect world without conflict, strife, or sadness. To create a happy and harmonious peaceful world, she was willing to take away individual's trivial free will. This was true goodness."
 GEM_satsuki_story.2.a: "Unified Gehenna and Germany."

 GEM_satsuki_story.3.t: "Quiet Afternoon Conversation"
 GEM_satsuki_story.3.desc: "It was a peaceful afternoon. Kogyoku Satsuki was silently watching the orderly scenery of Gehenna from the Chairwoman's office window. No more sounds of explosions or gunfire could be heard. It was the perfectly harmonious world she had dreamed of.\n\nJust then, the office door opened noisily and Hanuma Makoto walked in.\n\n\"Satsuki! I am here! Kikiki, this world you've made is too boring! No explosions! No plots! Even when I try to make a Kivotos conquest plan, no one takes it seriously!\"\n\nMakoto snorted and approached the window. After looking down at the students passing by in silence for a while, she eventually spoke as if tossing out the words.\n\n\"...Boring as hell. But well, I'll admit it. This is something even I, Makoto-sama, couldn't pull off. Making this Gehenna, which was a complete mess... actually quiet.\"\n\nMakoto turned back to Satsuki, looking at her with eyes that held a strange emotion for the first time, rather than mockery.\n\n\"Even without using cowardly tricks like hypnosis. ...Kikiki! Not bad, Kogyoku Satsuki!\"\n\nIn that moment, Satsuki stopped breathing for a second. Recognition without any coercion, coming from the mouth of Makoto herself—her greatest goal and the embodiment of Gehenna's chaos. It resonated deeper in her heart than the tuned praise of millions. At that moment, Satsuki felt for the first time that her 'peaceful nation' was complete."
 GEM_satsuki_story.3.a: "...I'm sorry."

 GEM_satsuki_story.4.t: "The Final Subject"
 GEM_satsuki_story.4.desc: "Everything was perfect. Gehenna—no, the world she recreated—was echoing peacefully like a massive symphony without a single dissonance. Beyond the giant monitor in the office, the faces of the citizens showed not a speck of worry. Kogyoku Satsuki felt a deep sense of fatigue. Everyone was happy, but the one person who designed and maintained all that happiness, herself, was bearing all the weight of this world.\n\nFufu, she laughed. To think that in this perfectly tuned world, the only cause of dissonance was herself. Everyone was at peace, yet she alone remembered the past, doubted, and suffered under the weight of it all. To complete the system, she would remove the last remaining variable: 'herself.' The justification couldn't be more perfect. Yes, this would be the true meaning of 'completion.'\n\n...Her original self would never have reached such a conclusion. But having shouldered everything alone for years, she was too exhausted. Satsuki quietly headed to the office chair. She sat in the Chairwoman's seat—no, the seat for the final subject—and lifted the pendulum she always carried, which she had rarely used lately."
 GEM_satsuki_story.4.a: "And, the world became perfectly silent."

 GEM_satsuki_story.5.t: "Heavy Atoner"
 GEM_satsuki_story.5.desc: "The podium was heavily silent. All the key figures of Gehenna and the opposition representatives once defined as enemies gathered in one place. Chairwoman Kogyoku Satsuki grabbed the microphone with trembling hands instead of a prepared speech. She looked down at the floor, unable to meet the audience's eyes.\n\n\"I stand here today... to apologize for my mistakes. Under the guise of peace, I trampled your free will with the 'NK Ultra Project.' It is an unforgivable sin. But... if we stop this system in an instant, we will only return to the horrific chaos of the past that we barely managed to suture. Therefore... as of this moment, mental interference for all members present here is stopped immediately and permanently. For the general public, I promise to gradually scale down the project for social stability and replace it with true communication.\"\n\nAfter her words of apology, Satsuki couldn't say anything more and just bit her lip.\n\nSitting in the audience, Iroha felt her head spin for a moment. 'Haah... I wondered why things were going so suspiciously well.' The vague sense of dissonance she had felt, the abnormal harmony where everyone moved as one. Realizing it wasn't because of her laziness but a faint remnant of brainwashing, she gave a bitter smile.\n\nIt was Hanuma Makoto who broke the heavy silence.\n\n\"Kikiki! What's the use of an apology now! What's important is from now on! Now, try to lead Gehenna fairly with me, without those cowardly tricks!\"\n\nHer clear shout stirred the hall. Eyes turned to Anton Drexler, the leader of the Nazi Party. Everyone expected his anger, but he stood up slowly, leaning on his cane.\n\n\"...Our party has decided to accept the Chairwoman's proposal. Members, follow suit.\"\n\nIt was a one-sided declaration. The members behind him were filled with shock and dissatisfaction, but they didn't dare protest Drexler's firm gaze. He knew. If it wasn't for this strange integration, everyone would have perished. Asking about the past was the same as giving up the future.\n\nSatsuki finally raised her head. Her eyes were filled with tears, but also with a new determination."
 GEM_satsuki_story.5.a: "All changes are not immediate, but they are certain."

 GEM_satsuki_story.6.t: "Welcome to Gehenna Psychology Academy!"
 GEM_satsuki_story.6.desc: "The lecture hall was filled with the excitement and anticipation of the freshmen. Standing on the stage was the student council president and academy chairwoman, Kogyoku Satsuki. She grabbed the mic with a soft smile.\n\n\"Freshmen, I sincerely congratulate you on your admission. You might have heard scary rumors about the 'Old Gehenna.' About an era of chaos where gunshots rang out every day and clubs never stopped fighting each other.\"\n\nThere was a brief tension in the room, but Satsuki continued with a gentle voice.\n\n\"But look. Our academy is different now. Here at 'Gehenna Psychology Academy,' we first learn how to understand ourselves and the hearts of others. Conflicts stem from misunderstandings, and misunderstandings stem from ignorance. Fufu, if you know the cause, the solution is simple.\"\n\nHer words had a strange persuasiveness. The freshmen nodded their heads without realizing it.\n\n\"In the future, you will have amazing experiences. Anxiety and worries in your heart will melt away, you'll naturally get along with anyone, and everyone will come together with one heart to create a joyful school life... such ideal days. This is the first step of the 'Ordered Unconscious' that our academy promises. Now, please enjoy your shining youth to your heart's content! Your story has just begun!\"\n\nWhen the speech ended, the hall was filled with perfectly unified, enthusiastic applause. As if everyone was confirming a single promise."
 GEM_satsuki_story.6.a: "The moment you looked into her eyes, you felt certain that your school life would be perfect."

 GEM_satsuki_story.7.t: "Prelude to Order"
 GEM_satsuki_story.7.desc: "The world was submerged in a cold grey fog, and the merciless tyrant called reality wounded everyone with its sharp edges. Every melody was a howl of discord, and every dance was but a struggle to claw at one another.\n\nThen, a single tuner appeared.\n\nShe cut through the dissonance with the sword of order and touched every string of every soul, retuning them to the quietest and most beautiful timbre. She did not crush the harsh reality with a hammer. Instead, she planted the seeds of perfect order in every heart, letting those sharp edges wear themselves away.\n\nBehold. The fog has lifted and the tyrant has lost the throne. Every voice that once howled at will has become one great chorus, and the wounding struggles have become a massive, elaborately choreographed military dance.\n\nThus the legend sings. That against the great evil of callousness and reality, there was a hero of the age who saved the world not with a sword, but with a whisper, not through destruction, but through harmony. This silent world she crafted is an eternal symphony played by her."
 GEM_satsuki_story.7.a: "End of a chapter."

 GEM_chiaki_story.1.t: "A Red Flag with a Blue Hue"
 GEM_chiaki_story.1.desc: "The morning air in Berlin was still cold, but the atmosphere permeating the streets was markedly different from yesterday. This was because the red swastika flags, which had hung there like a habit for years since the Great Transfer, had all vanished overnight.\n\nIn their place, banners with strange symbols were hoisted. A shape with two legs extending from a diamond base. It was the Odal rune, a heritage of ancient Germania signifying 'inherited land' and 'noble blood.' It was puzzling to see a rune character, once used only by small groups like the SS, appear on public flags.\n\n\"What on earth does that mean? Are the Nazis up to some new trick again?\"\n\nA factory worker on his way to work whispered with wary eyes. But the answer did not come from brown-shirted stormtroopers, but from strange girls in school uniforms with horns. They were climbing ladders and stamping 'Correction' in red ink over propaganda posters.\n\n\"This is the official symbol of the new era led by Führer Motomiya Chiaki! Forget those tacky hooked crosses!\"\n\nThe youthful voice coming from the loudspeakers created a strange sense of dissonance. Citizens looked up at the unfamiliar symbol, unable to tell if this was the end of Nazism or the beginning of an even more incomprehensible madness. Only one thing was clear: on the massive manuscript paper of Berlin, our history was being forcibly rewritten by someone's pen."
 GEM_chiaki_story.1.a: "A new dictator?"

 GEM_chiaki_story.2.t: "Doubtful Tricolor"
 GEM_chiaki_story.2.desc: "Between the tree-lined paths of Unter den Linden, a flag both familiar and strange began to flutter. The red-backed swastika, which had hung there like a habit for years since the Great Transfer, was pulled down, and in its place, the Black-Red-Gold (Schwarz-Rot-Gold) tricolor—the symbol of the Weimar Republic—was hoisted.\n\nThe citizens gathered in the square murmured with expressions of disbelief. Just a few days ago, that flag had been insulted and burned as the 'flag of traitors,' and now it had returned as the official symbol of the state.\n\n\"Has democracy returned? Is the Republic resurrected?\"\n\"No, look over there. Only the flag has changed.\"\n\nSomeone in the crowd pointed toward the platform. There stood not the politicians of Weimar, but a schoolgirl wearing a Pandemonium armband in an arrogant posture. She was reading out Führer Chiaki's orders.\n\n\"We are not barbaric conquerors! Chairwoman Motomiya Chiaki has inherited the legitimate spirit of Weimar and has come to correct the misprinted pages of this nation! Black, red, gold! Is this not the true color of civilized Germany!\"\n\nThe citizens were confused. The flag had returned to that of the era that symbolized freedom, but the power wielding it was still overwhelming and authoritarian. Was this a true return of the Republic, or a massive stage play directed by the bizarre girl called 'Führer' to win public favor? Under the fluttering tricolor, Berlin fell into a strange silence mixed with relief and suspicion."
 GEM_chiaki_story.2.a: "A new dictator?"

 GEM_chiaki_story.3.t: "Launch of the People's Alliance System"
 GEM_chiaki_story.3.desc: "\"This is... different from the promise! Bringing the Communists into the institutional sphere to check the Nazis was strictly a 'temporary' coalition! What we agreed upon was a mutual trust-based...\"\n\n\"Trust? Von Papen, do you realize how hollow that word sounds in this situation?\"\n\nIn the meeting room of the German Center Party (Zentrum), high voices were exchanged amidst thick cigarette smoke. The faces of the veteran politicians, called the living witnesses of Weimar, were pale. They thought they were the players moving the pieces on the chessboard, but they realized too late that they were merely 'clutter' to be cleared away by the massive hand of Chiaki.\n\nOn the table lay a single letter sealed with red wax sent by Pandemonium. The sender was 'Führer' Motomiya Chiaki. The content was concise and cruel.\n\n- We are organizing unnecessary paragraphs that hinder the readability of the manuscript. All 'progressive' forces, including the SPD, KPD, and your party, will be integrated into a single chapter called the 'German People's Alliance (Deutsche Volksallianz)' as of today. -\n\n\"Wels of the SPD has already agreed. Not to mention the Communist Party, whose strength was destroyed fighting the Trinity... that horned child is pointing guns at us through the mouths of communists!\"\n\nThe party leader adjusted his glasses with trembling hands. Outside, the shouts of torchlight processions yelling 'Long live the People's Alliance' and 'Long live Führer Chiaki' could already be heard. The place where the Nazis were driven out was filled with the red wave they believed they could control.\n\n\"What if we refuse?\"\n\"Then we'll be treated the same and disappear as footnotes of history alongside the Nazis. Do you still not know what it means to be 'edited'?\"\n\nThe silence was long, but the conclusion was set. Maintain pride and be purged, or become part of the massive alliance and survive. The party leader picked up his pen with a deep sigh. It was the moment traditional party politics in Germany came to an end and the massive 'People's Alliance System' designed by Chiaki began."
 GEM_chiaki_story.3.a: "\"...I will sign. Dear God, what kind of monster have we raised?\""

 GEM_chiaki_story.4.t: "Conclusion of Denazification"
 GEM_chiaki_story.4.desc: "The expressions of those gathered around the round table in the grand meeting hall of the central district—once used by Pandemonium, now by the parliament—were relieved yet tinged with a strange tension. The massive storm of 'Denazification' had passed, the debris was cleared, and the criminals were punished. Now, all that remained was the matter of where the disparate roommates, who had linked arms to endure the storm, would go.\n\nThe first to rise was the representative of the German Communist Party. Tightening his lips, he gave a short nod toward Chiaki sitting at the head of the table.\n\n\"To catch the monster of Fascism, we even shook hands with the devil. But the hunt is over. Revolution does not compromise, and we can no longer tolerate another master sitting in the place the wolf left, acting like a king. The 'Grand Coalition' is dissolved as of today.\"\n\nIt was not a declaration of war, but a cold notice of separation. The members of the SPD and Center Party let out sighs of relief. They, too, had inwardly hoped for an end to the uncomfortable cohabitation with the radical Communist Party. The KPD declared its withdrawal from the coalition, and there was no hesitation in their steps as they left the parliament building.\n\nChiaki rested her chin on her hand, spinning a pen, and muttered lowly toward their backs as they departed.\n\n\"Wise decision. To be honest, your bright red ink really didn't fit my 'editorial direction.' It was exactly the kind of provocative material that makes readers feel fatigued. Now the manuscript will finally be clean.\"\n\nThe door closed, leaving only Pandemonium, the SPD, and the Center Party in the meeting room. A 'normal' coalition without radical revolutionary slogans or manic Nazi agitation. It was the beginning of the most mundane and boring chapter for the 'stable serialization' Chiaki envisioned. Though the fact that the standard for 'normalcy' was tuned to Gehenna's common sense was the only remaining element of anxiety."
 GEM_chiaki_story.4.a: "\"...I will bring a concrete plan for the dissolution of the coalition.\""

 GEM_chiaki_story.5.t: "The End of History"
 GEM_chiaki_story.5.desc: "\"This is a betrayal of history! Bringing the Nazi murderers back in through the back door, have you lost your minds?!\"\n\nThe scream of the Social Democratic Party leader echoed through the dome of the Reichstag. But his voice was already a hollow cry without an echo. The left side of the grand meeting room, where the KPD and SPD members once sat, was empty. They claimed the 'parliamentary boycott' as a justification, but in reality, they had fled to survive.\n\nAcross from them sat a bizarre hybrid. Catholic conservatives from the Center Party in tidy suits, and mixed among them, fierce-looking former Nazi SS members. Lured by the sweet bait of power into the embrace of Pandemonium, they gathered under the new banner of the 'German National Defense Party (Deutsche Nationale Verteidigungspartei).'\n\nChiaki, standing at the podium, looked at the empty left-wing seats with a cold smile. On her desk lay the 'Special Administrative Order on National Protection and the Isolation of Impure Elements.'\n\n\"Now that the noisy discord is gone, I finally feel like writing. Readers don't want to read the whining lines of defeated losers. That's... 'no fun.'\"\n\nChiaki filled the signature line with red ink without hesitation. The sharp sound of the pen nib scratching the paper was the signal for the start of mass arrests and purges that would soon occur across Germany.\n\n\"Now, ladies and gentlemen of the Center Party. And our 'recycled' friends. Now that the unnecessary pages have been torn out, shall we begin our own new chapter? Of course, I will personally handle the manuscript inspection.\"\n\nOutside the Reichstag, the vehicles of the Pandemonium Legion... no, the 'National Defense Party Security Bureau,' were already racing toward the hideouts of left-wing figures with loud sirens. The night will be long, and once it passes, only one voice will remain in Germany."
 GEM_chiaki_story.5.a: "\"...\""

 GEM_chiaki_story.6.t: "The Rule of Law State"
 GEM_chiaki_story.6.desc: "The sky over Berlin was clear without a single cloud. In the square in front of the Reichstag, citizens stood in an orderly fashion, holding neatly printed guidebooks instead of torches or Molotov cocktails.\n\nA new national flag was hoisted above the platform. A flag symbolizing the union of 'reason' and 'mystery,' featuring the German black-red-gold tricolor with the German coat of arms and stars representing the two peoples embroidered in the center.\n\nMotomiya Chiaki, inaugurated as the first Federal President, took the oath with her hand on the constitution.\n\n\"A nation is like a well-ordered sentence. Only when the subject, the people, and the predicate, the government, correspond within correct grammar—that is, the 'rule of law'—is it complete. As the first editor-in-chief and President of this country, I swear. I will not tolerate the typos of chaos and disorder, and I will write a new, rational and logical chapter for Germany!\"\n\nWith her declaration, a salute was fired. it was the signal for the birth of a modern republic that ended the era of madness and successfully incorporated Gehenna's free-spiritedness into the framework of a constitution."
 GEM_chiaki_story.6.a: "The Constitution is in our hands!"

 GEM_chiaki_story.7.t: "Three Pillars, One Roof"
 GEM_chiaki_story.7.desc: "Under the massive dome, a stifling silence hung. On the left of the hall stood Gehenna bureaucrats with sharp horns; on the right, German generals in heavy uniforms; and in the center, the priests of Trinity who had now folded their wings and joined the Federation.\n\nAmidst the tension emitted by the three disparate groups, Federal Secretary Motomiya Chiaki stood at the center of the podium. Behind her shone a massive federal emblem where eagle wings, demon horns, and a radiant trinity were bizarrely intertwined.\n\n\"A thin sheet of manuscript paper called a single ethnicity cannot contain our greatness. We are different. Therefore, we are strong. Gehenna's creative destruction, Germany's steel-like discipline, Trinity's noble dignity... these three inks will mix to finally illustrate the masterpiece called the 'Empire.'\"\n\nThe moment Chiaki signed the integration charter, the three groups saluted in their own ways. They were no longer enemies. They were standardized components turning the massive gears called the 'Federal Secretariat.' It was the moment a super-sized multi-ethnic bureaucratic state, unprecedented in history, started its engine."
 GEM_chiaki_story.7.a: "Long live Secretary Chiaki!"

 GEM_germany_story.1.t: "The Die is Cast"
 GEM_germany_story.1.desc: "Our new nation was built upon force, but it has yet to receive the judgment of the people's will. The voices of idealists claiming that true legitimacy comes from the ballot box, not the gun barrel, are growing louder. Now, we stand at a critical crossroads. Shall we justify our rule by conducting a free general election for all Germans, or shall we judge that it is too early and prioritize stability?\n\nIf we push through with the election, victory will place our rule on a solid foundation. But defeat means losing everything. Conversely, if we choose stability, power will be maintained, but we might eternally carry the label of 'those who fear elections.' It is truly a gamble risking the fate of the nation."
 GEM_germany_story.1.a: "I will receive the judgment of the people. Conduct the election."
 GEM_germany_story.1.b: "The Enabling Act has been extended."

 GEM_germany_story.2.t: "Victory at Dawn"
 GEM_germany_story.2.desc: "On election night, the air at the Pandemonium Coalition headquarters was thick with cigarette smoke and anxiety. As the counting progressed, the situation became unpredictable. We dominated in urban areas, but votes for the Nazi Party and conservative parties poured out from rural areas. The exit polls that had guaranteed victory were overturned, and the shadow of defeat loomed large.\n\nAt 4 AM, when everyone was in silence, the result of the last polling station arrived. Someone whispered, \"…We won.\" With those words, suppressed sighs of relief filled the room. It was not an overwhelming victory. It was a narrow win achieved after a blood-drying close race, by a difference of only a few thousand votes.\n\nDeep silence followed instead of cheers. We won, but at the same time, we confirmed how deeply this country is divided. The die was on our side, but it was only by a single mark. We now bear the heavy responsibility of leading this precarious victory toward true integration."
 GEM_germany_story.2.a: "At least for now, we have support."

 GEM_germany_story.3.t: "Whispers Behind the Curtain"
 GEM_germany_story.3.desc: "Instead of the public gamble of an election, we conducted a nationwide opinion poll through secret intelligence organizations. Today, the sealed report reached the leadership's desk. The result revealed by trembling hands was... unbelievably positive. The report concluded that our coalition receives overwhelming support from all classes and regions.\n\nHowever, a chilling doubt arrived before joy. Is this the truth? Have we truly won the hearts of the people? Or is this flattery from the intelligence department to reassure us, or a cunning trap from enemies to make us let our guard down?\n\nBecause the result was too perfect, we couldn't help but doubt its truthfulness. We avoided the risk of an election, but in return, we became trapped in a fog where the 'truth' is unknown. Are we wise rulers, or fools being fooled by the sweetest lies?"
 GEM_germany_story.3.a: "...Should I believe this report?"

 GEM_germany_story.4.t: "Fortunately, Pandemonium is Supported"
 GEM_germany_story.4.desc: "For a while, we had to hold our breath and watch the results. We prepared for the worst-case scenario: mass protests, the rise of underground organizations, and even civil war. But, nothing happened.\n\nThe streets were peaceful, and citizens returned to their daily lives. Even the Nazi Party, which we feared most, was playing the role of a legal opposition in parliament holding signs instead of calling for revolution. Only then did we realize. Germans do not want chaos. They wanted a strong leader to lead them toward a stable future, not a ghost of the past.\n\nAnd that leader was us. Our rule is now unshakable."
 GEM_germany_story.4.a: "Our legitimacy is now beyond doubt."

 GEM_germany_story.5.t: "Compromise for Survival"
 GEM_germany_story.5.desc: "The meeting room of the Nazi Party headquarters. Cigarette smoke was thick, and the air was heavy. They were no longer the sole masters of this country. With the emergence of the massive ruling party called the 'All-Gehenna People's Party,' they were now merely the 'German-affiliated primary opposition.'\n\nThe leader stood at the podium and looked around at the executives with a firm expression.\n\n\"In the past, we turned everything but ourselves into enemies. That was our strength. But times have changed. The 'Great Transfer' has shaken our world, and the foreign power called Gehenna is now our federal partner. In this situation, we cannot survive with just the old Germanic nationalism of the past.\"\n\nHe paused for a moment to check if there were any dissenting opinions.\n\n\"The Center Party, the People's Party… those who were once our rivals are also Germans in the end. In the eyes of Gehenna, we are all just the same 'Germans.' If so, we must act that way. What is more important than ideological purity is the survival and initiative of our people. Now, we will end the division and be reborn as a single, massive opposition party encompassing all German parties.\"\n\nSilence flowed in the meeting room. it was not enthusiastic agreement, but the firm resolve of those accepting a bitter reality."
 GEM_germany_story.5.a: "For a single Germany."

 GEM_antinazi_preemptive_strike: "Preemptive Strike on Nazism"
 GEM_antinazi_preemptive_strike_desc: "The Pandemonium Society's federal state strategy eventually spread to the recognition of Nazism, reaching the level of calling themselves the German Reich. We must prepare a declaration of war against Pandemonium and the restored Nazis who intend to put Gehenna Academy and all of Kivotos into the hands of the old Germany."
 GEH_preparations_for_operation_longsword_breaking_operation: "Operation Longsword Breaker"
 GEH_preparations_for_operation_longsword_breaking_operation_tt: "We will be able to prepare for §Y70 days§! before declaring war on [GEM.GetNameDef] upon the start of $GEH_preparations_for_operation_longsword_breaking_operation$. We will declare war on [GEM.GetNameDef] as soon as the mission deadline ends."
 GEH_preparations_for_operation_longsword_breaking_operation_alt_tt: "§RWe will prepare for §Y70 days§! until the target countries declare war on us. They will declare war on us as soon as the mission deadline ends.§!"

 GEH_event.1.t: "Emergency Convocation"
 GEH_event.1.desc: "On a day when the warm sunlight shone as usual, Kivotos was suddenly transferred to a strange world.\nWhat was visible outside the Pandemonium meeting room window was not the usual skyscrapers or the shining halo in the sky.\nAside from some Gehenna buildings, only low, old-fashioned houses described only in novels were visible.\n\nThe executives of Pandemonium initially looked with sparkling eyes, finding it interesting, but soon only terrified eyes were seen.\n\nIn the Pandemonium meeting room, there were only Iroha, Ibuki, and a few executives.\nJust then, someone burst through the door with a bang.\n\n\"Kikiki, emergency convocation~! Iroha! Summon all Pandemonium executives!\"\n\"Haah.. I don't even know where they all went.. how troublesome.\"\n\nIroha, annoyed by the direction of Makoto she had heard until her ears bled, tossed the novel she was reading aside and stood up.\n\nIroha began to drag back the executives one by one, who had lost their way within Gehenna and were standing blankly.\n\nAs soon as the meeting started, Makoto made a claim full of confidence, as expected of her.\n\"Due to this incident, those Prefect Team pests and Trinity will be in chaos! Now is the chance to clean them all up! Kikiki!\"\n\"Makoto-senpai.. I don't think we're in any position to say that.\"\n\nAmidst the murmuring meeting hall, one executive offered an opinion with trembling lips.\n\n\"Given the situation, maybe we should call the Prefect Team and discuss...\"\n\nBefore the words could even finish, Makoto kicked back her chair and stood up, shouting.\n\n\"What are you saying! As I just said, the Prefect Team must be uprooted!\"\n\nIn the end, the meeting ended without any major gain..."
 GEH_event.1.a: "Not much came of that."

 GEH_event.2.t: "Inspection"
 GEH_event.2.desc: "Some Gehenna buildings remained as they were, but the city where people resided was completely different.\nSkyscrapers had disappeared, and what remained was the architectural style of a country called Germany seen only in books, along with citizens speaking a strange language here and there.\nAll of this was incomparable to the image of Kivotos before coming to this other world.\n\n\"What is all this! This isn't the Gehenna I know! Iroha! Explain!\"\n\"Fuuh.. I can't even process this situation myself..\"\n\nJust then, Ibuki, who had followed along, was looking on with wide, curious eyes.\n\n\"What is all this food?\"\n\nLooking closely, unlike the Kivotos food they usually ate, there were many greasy and large-sized foods.\n\nIn the meantime, the students of Gehenna, though they couldn't communicate, were mixing with the people who were originally in this place."
 GEH_event.2.a: "The street food was delicious."

 GEH_event.3.t: "The Wehrmacht Issue"
 GEH_event.3.desc: "The executives who had been sent to patrol Northern Gehenna entered the meeting room with dark complexions, looking like they were about to collapse.\nWe decided to serve them warm tea to calm them down and listen to their explanation slowly.\n\n\"Now, so what did you see! Was it Trinity?!\"\n\"It's not like Trinity is something to be surprised by anymore...\"\n\nAs Makoto's words, full of expectation, finished, one executive finally spoke up.\n\n\"People wearing strange steel helmets are stationed in Northern Gehenna, fully armed!\"\n\n\"What? It's not Trinity or the Prefect Team?!\"\n\"What do they think they're doing in our territory!\"\n\nAmaut amidst the confusion caused by the new facts, Chairman Makoto whispered to herself.\n\n\"Kikiki.. I don't know who they are, but if we cooperate, we can make the Tea Party kneel and keep the Prefect Team quiet..\"\n\nMakoto was having Makoto-like thoughts, and as expected, contrary to her thoughts, they were hostile toward us.\n\n...It seems they have no intention of cooperating with us. The closer we got, the more they raised their guns as if to kill, and finally even fired warning shots.\n\nIs it because we're always carrying guns?\n\nSome of them were looking at us with fear."
 GEH_event.3.a: "This is bad!"

 GEH_event.4.t: "Declaration of Emergency"
 GEH_event.4.desc: "Having assessed the situation in Northern Gehenna, Pandemonium held another meeting.\n\n\"It seems cooperation won't be easy..\"\n\nMakoto's shoulders slumped at the stronger-than-expected resistance.\n\nJust then, Iroha spoke up.\n\n\"Instead of moping like this, let's seek a realistic countermeasure, senpai --\"\n\"Let's just hypnotize them all and make them our allies!\"\n\nSatsuki was excited, saying she would show the hypnosis she was researching.\n\n\"Haah.. there's no way that would work..\"\n\nLeaving the two frustrating senpais behind, Iroha's head began to throb.\n\nIn a situation with no progress, Makoto, who had been sitting quietly, spoke up.\n\n\"First, I declare a state of emergency! It is right for Pandemonium to resolve things when the citizens are suffering!\nAnd since it's an emergency, the Prefect Team's budget is also cut! Cut, I say! Kikiki!\""
 GEH_event.4.a: "It's time to show the prestige of Pandemonium!"

 GEH_event.5.t: "Negotiations Begin with the Wehrmacht"
 GEH_event.5.desc: "After the declaration of emergency and following a meeting, Pandemonium decided to first try and talk with them in the North.\n\n\"Haah.. this is such a pain..\"\n\nWith a white flag attached to Iroha's tank, the Toramaru, several students and Pandemonium executives headed toward Northern Gehenna.\nMakoto pulled her hat down further, embarrassed by the fact they were carrying a white flag, but there was no choice.\n\nArriving in Northern Gehenna, the Pandemonium party slowly approached the soldiers on sentry duty.\nPerhaps because they were holding a white flag, no bullets flew toward them.\n\nThanks to recruiting students who had been studying ancient languages in advance, we were able to understand what they were saying.\nThey introduced their country as the \"German Reich\" and themselves as a military organization called the \"Wehrmacht.\"\nThey also stated that the region where Gehenna is currently located was originally territory of the German Reich.\n\nAfter continuing their introductions, the Pandemonium and Wehrmacht commands proceeded with negotiations, starting with clearing up misunderstandings.\nHowever, the negotiations maintained an unusually uncomfortable atmosphere..."
 GEH_event.5.good_desc: "A delegation from Pandemonium has entered into negotiations with us. They began their meeting with our representatives, stating their goal was harmony between Gehenna and the Wehrmacht. These negotiations, aimed at resolving and adjusting for previous conflicts and the gaps between us, will require a very long time. After setting some schedules, the Pandemonium delegation returned to Gehenna."
 GEH_event.5.bad_desc: "We have received news that Pandemonium has begun negotiations with the Wehrmacht in the north. This poses a danger as our position could be significantly undermined, so we must either obstruct this or join the negotiations."
 GEH_event.5.a: "Cooperation will be inevitable."
 GEH_event.5.b: "I'll at least hear them out."
 GEH_event.5.c: "This is a big problem."

 GEH_event.6.t: "Negotiation Agenda: Student Injury Incident"
 GEH_event.6.desc: "\"(In German) Halt! Any further approach and we fire!\"\n\"What are they saying? And what's with those weird clothes?\"\n\"Who cares~ Even if we get hit by an anti-aircraft gun, we just need a little rest. Why would those little guns be scary~\"\n\"(In German) Final warning! Do not approach!\"\n\"Hey~ This side is our Gehenna territory~ Don't block the way and move!\"\n\"(In German) Dammit, fire!\"\n\nTo suppress defenseless students, a few bullets were enough. The students, who didn't know about the changes to the Halo's mystery, had no reason to fear bullets, and eventually were showered with them.\n\nWas it luck? Perhaps the Wehrmacht hadn't zeroed their sights properly, but the students showered with bullets ended up with heavy injuries rather than death.\n\n\"It's a relief we moved the... corpses—I mean, the injured—quickly. No matter if they weren't hit in vital spots, the bleeding was not small.\"\n\nActually, someone had mentioned this issue in a Pandemonium meeting before negotiations with the Wehrmacht, but it had been forgotten in the chaos.\nChairman Makoto fell into deep thought. Whether to side with the Wehrmacht to solidify cooperation, or side with the students as the Chairman of Gehenna.\n\nIt seems right to side with the students, but if she does, it's questionable what position the Wehrmacht will take.\nConversely, if she sides with the Wehrmacht, she will lose the trust of the students of Gehenna."
 GEH_event.6.a: "Side with the Wehrmacht."
 GEH_event.6.b: "Side with the students."

 GEH_event.7.t: "Withdrawal from [FROM.FROM.GetName]"
 GEH_event.7.desc: "Due to our decreasing influence, we had no choice but to give up [FROM.FROM.GetName] in the negotiations. Those who participated in the negotiations seemed to accept this result, but internal criticism was unavoidable."
 GEH_event.7.a: "We were pushed back in the negotiations."

 GEH_event.8.t: "Hina Rejects the Negotiation Proposal!"
 GEH_event.8.desc: "\"Hello everyone. There is an announcement from Pandemonium for all students. From now on, with the German Reich...\"\n\nThere were many unacceptable clauses, but Sora-saki Hina clenched her fist when she heard the announcement from Pandemonium that the Prefect Team would effectively be abolished.\n\n\"So this is how it's going to be.. Ako, get ready. We're going to Pandemonium.\"\n\"Understood, Sora-saki-sama!\"\n\"Iori, Chinatsu, you two follow as well.\"\n\nAnd so the Prefect Team headed to Pandemonium to express their opposition to the negotiation results.\n\nBang! Hina burst through the door and entered the Pandemonium meeting room.\nSeveral Wehrmacht officers were gathered there for further consultation.\n\n\"Ah, so this is the Prefect Team Leader, Sora-saki Hina.\"\n\"Kikiki, that's right. They are under Pandemonium...\"\n\nBefore the words could finish, Hina spoke up.\n\n\"I oppose this result.\"\n\nThe Wehrmacht officers and Pandemonium executives began to murmur.\n\n\"W-what?! This is a matter I, Makoto-sama, have already decided and am proceeding with. It cannot be changed!\"\n\"Excuse me, Makoto-sama, but I understood the Prefect Team was the supreme armed organization in Gehenna... how did this happen?\"\n\nHina continued speaking.\n\n\"Ah. Wehrmacht, is it? As you just heard, these negotiations are dead.\"\n\nThe Wehrmacht officers left the meeting room quickly with absurd expressions.\nNo one knows what will happen next..."
 GEH_event.8.a: "Hina...!!!"
 GEH_event.8.b: "The Prefect Team has nothing to do with Gehenna."

 GEH_event.9.t: "Prefect Team's Disciplinary Activities"
 GEH_event.9.desc: "Pandemonium, focused on negotiations, had forgotten. The fact that the Prefect Team is the supreme armed organization in Gehenna.\nIn an even more chaotic Gehenna, the Prefect Team had increased its activity level accordingly.\nThe students thought: Isn't the Prefect Team, which maintains order, better than Pandemonium, which tries to cooperate with the Wehrmacht that attacked us?\nWith no Sensei and no intervention from the General Student Council, the idea that Pandemonium has zero interest in Gehenna's students began to become rampant.\n\n\"Pandemonium, wake up!\"\n\"Makoto, think of us students!\"\n\"The Prefect Team is better than Pandemonium!\"\n\nProtests against Pandemonium broke out, and though small for now, people were gathering one by one.\n\nPerhaps something \"big\" is about to happen.\n\nPandemonium, realizing this situation too late, makes the following choice..."
 GEH_event.9.a: "Make them submit."
 GEH_event.9.b: "We have more important matters remaining."

 GEH_event.10.t: "Student Attack Incident"
 GEH_event.10.desc: "On a bright day, two Gehenna students were enjoying a picnic in a quiet forest.\n\n\"As expected, it's much better here than the dizzying city~\"\n\"But isn't this the North? Didn't the Prefect Team members say not to go to the North before..\"\n\"Could something really happen even in a place like this? It's not even that far from the central district~\"\n\nMeanwhile, a reconnaissance team from the Wehrmacht was patrolling the forest where the students were.\n\n\"Sergeant, I see those Gehenna people over there.\"\n\"...Because of those bastards, my hometown Munich was occupied..\" The sergeant raised his gun toward them.\n\"Sergeant? Do you really have to do this?\"\n\"This is a secluded forest. It doesn't matter.\"\n\nIn the end, the sergeant's hatred reached them. The clear and intense sound of gunshots broke the quiet forest, filled with the screams of the two students.\n\nAnd a short time later, miraculously, one student who escaped arrived in the Gehenna city area, gasping for breath and limping with her friend on her back.\nFortunately, the Medical Emergency Department's quick action allowed for first aid, but with the student unconscious, everyone is just watching and stamping their feet in anxiety.\n\nDespite Pandemonium's ongoing negotiations, another incident of a student being attacked occurred. Some Wehrmacht soldiers attacked innocent Gehenna students, and this time, they even fell into a critical state.\nIf—just if—this student dies, it would be the first fatality.\n\nNews hasn't spread to all of Gehenna yet, but Pandemonium intends to quietly cover this up for the progress of the negotiations.\nBut conversely, the Prefect Team intends to uncover the truth and find the culprit to punish them.\n\nIf the incident is buried, the parties involved will be controlled and it will pass quietly with only a few knowing the facts.\nIf the incident is investigated and many students find out, Pandemonium's approval will fall, and conversely, the Prefect Team will be praised."
 GEH_event.10.a: "Cover it up quietly."
 GEH_event.10.b: "Investigate thoroughly and find the culprit."

 GEH_event.11.t: "Citizen Attack Incident"
 GEH_event.11.desc: "\"Why do we have to live on the verge of death because of those Germans?!\"\n\"Why should we be the only ones suffering when we're trying to live proudly in Gehenna land?!\"\n\nJust then, a German caught their eye. He was an ordinary citizen who neither liked nor disliked Gehenna.\nThe students, boiling with hatred, dragged the German away and beat him until he couldn't walk.\n\nIt might be considered a relief, but the students committed the violence in a secluded area.\nAfter the incident, a passing student reported it, and the Medical Emergency Department responded quickly to provide treatment.\nHowever, it seems rumors are spreading among the Germans.\n\nIroha of Pandemonium, upon receiving the report, held her head and lamented at Makoto's instruction to hide anything bad.\n\n\"Haah.. how long do we have to hide things.. what if we get caught..\"\n\nOf course, if this matter is also hidden, it will pass quietly until the negotiations are over.\nConversely, if the Prefect Team starts an investigation, the prestige of Pandemonium will fall day by day.\n\nIn a situation where emotions are escalating, what should be done?"
 GEH_event.11.a: "Cover it up quietly."
 GEH_event.11.b: "Find the culprit and apologize to the victim."

 GEH_event.12.t: "Hatred Toward One Another"
 GEH_event.12.desc: "Rumors are bound to spread. Eventually, the feelings from various incidents toward one another reached an extreme, and local Germans began carrying out terror attacks against students.\n\nInitially, it stopped at mere verbal abuse or small-scale protests against students, but it gradually became more intense, and direct damage began to occur.\nPouring food on students eating at local restaurants, graffiti hating Gehenna drawn on the streets, and arson attempts inside the Gehenna campus—the degree is becoming much more severe.\n\nRecently, there are rumors that a student was kidnapped and went missing, but I only hope it's not true.\nIt's already confusing enough coming to another world, and conflict with the locals is deepening.\nIt's not yet to the level of feeling great terror.. but many students want to hear Pandemonium's position."
 GEH_event.12.a: "Announce that conflict will gradually decrease once negotiations are over."
 GEH_event.12.b: "Find the missing student."
 
 GEH_event.13.t: "Suspicious Movements of the Prefect Team"
 GEH_event.13.desc: "\"Iroha! What is the Prefect Team doing right now?\"\n\"Hmm.. recent activity reports have been sparse..\"\n\"Kikiki! Finally, their spirit has been crushed by my, Makoto-sama's, efforts!!\"\n\"Shouldn't we investigate this separately.. Ah, just thinking about it is a pain..\"\n\nPandemonium executives don't really know what activities the Prefect Team has been up to lately.\nSome quarters are even saying that the Prefect Team might overturn Pandemonium.\n\nPandemonium knows that it's losing the trust of the students due to various recent disturbances,\nbut only some executives think that the Prefect Team is related to that." 
 GEH_event.13.a: "Investigate the Prefect Team to uncover the reason for their decreased activity."
 GEH_event.13.b: "There won't be any problem... for now."

 GEH_event.14.t: "The Wehrmacht in Action"
 GEH_event.14.desc: "\"Chairwoman!\"\n\nHearing the report brought to Chairman Makoto, she began to tremble all over.\nThe German Wehrmacht started advancing from Northern Gehenna and has formed a front line all the way to the upper part of Gehenna Central District.\nThey were pointing their guns at us.\n\nBefore long, an official letter arrived from the German state.\n‘The results of the negotiations are null and void, and we express regret that this situation has occurred.’\n\nJust then, a Pandemonium executive entered the meeting room in terror and reported an even more shocking fact.\n\n\"Ch-Chairwoman!! It seems the German army is preparing for war!!!\"\n\"What?!\"\n\nThe Pandemonium meeting room was instantly turned into a chaotic mess. The German army is about to invade? What does this mean?\nNow that the mystery of the Halo has decreased, we too can die if hit by a gun.\n\n\"Kikiki.. If that's the case, then I'll just clean up both the Prefect Team and the German state at this chance. Prepare for war!\"\n\nMakoto spoke nonsense to the end, but she wasn't wrong that war was unavoidable."   
 GEH_event.14.a: "Students of Gehenna! Prepare for war!"
 GEH_event.14.b: "But there might still be a chance for negotiation."
 GEH_event.14.c: "It has nothing to do with us."

 GEH_event.15.t: "Prefect Team Coup!"
 GEH_event.15.desc: "Our Prefect Team Leader, Sora-saki Hina, judged that she could no longer watch Pandemonium's actions with her eyes open.\nThey ignored the suffering students, concealed incidents, and tried to recklessly cooperate with a Germany they didn't know well.\nThe Prefect Team, which has maintained order in Gehenna, decided to rule Gehenna directly to establish order in this chaos.\nThe students supporting this are effectively half of Gehenna, or more, and they have shown absolute loyalty to the Prefect Team.\n\nThe students' protest slogan, which was \"Pandemonium, wake up!\", has changed to \"Makoto, step down!\"\nNow is the time to act.\n\n\"Leader, I will deploy the Prefect Team combatants.\"\n\"Let's end this now. Makoto.\""
 GEH_event.15.bad_desc: "The actions of the Prefect Team were suspicious from before. But they were a subordinate organization of Pandemonium.\nNo matter if they were the officially recognized supreme armed organization.\n\nBut the situation has changed. Sora-saki Hina. The Prefect Team Leader has crossed a line that shouldn't be crossed.\nTo try and destroy Gehenna for her own interests is nonsensical.\n\n\"Haah.. so it ends up like this..\"\n\"Kikiki.. Iroha! Now is the time to use that properly!\"\n\"Yes.. understood.. it's a bit embarrassing, but.. Invincible Armored Toramaru, deploying.\"\n\nAn unavoidable ill-fate.. it's time to put an end to this conflict."
 GEH_event.15.a: "For the order of Gehenna!"
 GEH_event.15.b: "Glorious warriors of Pandemonium!"

 GEH_event.16.t: "[FROM.GetName] Agrees to Ceasefire"
 GEH_event.16.desc: "As the Gehenna truce negotiations started due to war with another great power, the [FROM.GetName] side has agreed, and we have entered into a temporary state of ceasefire. Gehenna Academy is ready to fight against the enemy!"
 GEH_event.16.a: "We will be victorious!"

 GEH_event.17.t: "The End of Pandemonium"
 GEH_event.17.desc: "At the end of the Prefect Team Leader's use of force, Pandemonium has vanished, and Prefect Team Leader Sora-saki Hina has taken the laurel wreath of Gehenna.\n\nThere is still much work to be done."
 GEH_event.17.a: "It turned out well."
  
 GEH_event.18.t: "Emerging Club Issues"
 GEH_event.18.desc: "There are numerous clubs in Gehenna, but in reality, they are not under the control of Pandemonium and are causing social problems by moving around and causing damage. But now that Pandemonium has disappeared into history and the Prefect Team has seized power, we will be able to control the clubs."
 GEH_event.18.a: "Right."

 GEH_event.19.t: "Holding a Meeting"
 GEH_event.19.desc: "Content of a meeting between the Prefect Team Leader and members regarding the resolution of 'club issues.'"
 GEH_event.19.a: "Let's proceed with negotiations with them."
 GEH_event.19.b: "If they don't listen, disband them."
 
 GEH_event.20.t: "End of Negotiations"
 GEH_event.20.desc: "\"...With this, we conclude the negotiations between Gehenna and the German Reich.\"\n\"Kikiki.. Our Gehenna will become even stronger through these negotiations!\"\n\nFinally, after a long time, the negotiations between Pandemonium and the German Wehrmacht have concluded.\nBoth sides seemed satisfied with the results, but there are clauses that can be interpreted differently depending on the perspective.\n\nHowever, it remains to be seen if the Prefect Team, the supreme armed organization of Gehenna, will recognize these negotiations led by Pandemonium.\nIf the Prefect Team does not recognize them, they will come into direct conflict with Pandemonium, which has joined hands with the Wehrmacht.\n\nAt any rate, the negotiations are over and it's time to announce them."
 GEH_event.20.a: "Our Gehenna will become even stronger!"

 GE_event.21.t: "Strangers" 
 GEH_event.21.desc: "In the Wehrmacht negotiation team we met again, there were people we hadn't seen before. Others in different types of blue uniforms entered the negotiation room and watched us with curious eyes as the negotiations proceeded much the same as before. Those in blue uniforms watched the negotiation process without much comment before returning."
 GEH_event.21.a: "They're new faces."

 GEH_event.22.t: "Provisional Alliance"
 GEH_event.22.desc: "As Gehenna was threatened by the outbreak of war with a great power, the Gehenna students cooperated through negotiations to temporarily halt the civil war and block the enemy.\nHowever, it is unknown how long this alliance will last."
 GEH_event.22.a: "Protect Gehenna!"

 GEH_event.23.t: "Continuation of Civil War"
 GEH_event.23.desc: "After the war with the Wehrmacht ended, the Gehenna Union was dissolved. The day they become one will be a matter for the distant future.\nGehenna is now eternally divided. Even the brief union is gone.\nThe unification of Gehenna will be achieved through peace or blood. But it seems now is not the time."
 GEH_event.23.a: "Gehenna is one."

 GEH_event.24.t: "Cooperation with the Hot Springs Development Department"
 GEH_event.24.desc: "After Sora-saki Hina personally put in effort to find common ground with the Hot Springs Development Department, a compromise was found, and they have agreed to cooperate actively."
 GEH_event.24.a: "It's a pain, but it turned out well."

 GEH_event.25.t: "Surrendered Hot Springs Development Department"
 GEH_event.25.desc: "They finally realized that blowing up the school wasn't the best way to get a new spa. 'Fine, fine! We'll stop... for now. But you better help us find a real golden spring!' Kasumi grumbled while putting away her detonators."
 GEH_event.25.a: "Sure."

 GEH_event.26.t: "Resistance of the Handyman"
 GEH_event.26.desc: "Aru looked at the ultimatum with trembling hands, then suddenly struck a hard-boiled pose. 'A true hard-boiled outlaw never bows to authority! Handyman 68, engage!' ...Actually, she's just terrified of being lectured by Hina again."
 GEH_event.26.a: "Wipe them out!"
 
 GEH_event.27.t: "The Fall of Pandemonium"
 GEH_event.27.desc: "The once-mighty office of the Chairwoman is now filled with nothing but dust and Makoto's abandoned, half-eaten snacks. Without a leader, the remaining members have either fled or surrendered. The era of chaotic 'grand plans' has come to a silent end."
 GEH_event.27.a: "I see."

 GEH_event.29.t: "Medical Emergency Department"
 GEH_event.29.desc: "A meeting was held to cooperate with the Medical Emergency Department, and they have readily accepted the negotiation proposal."
 GEH_event.29.a: "Great."

 GEH_event.30.t: "The Gourmet Research Society Issue"
 GEH_event.30.desc: "The Gourmet Research Society—they wander around various autonomous districts causing disturbances and are like the black sheep of Gehenna. We must decide how to deal with them."
 GEH_event.30.a: "I wonder if words will even work on them.."

 GEH_event.31.t: "Steel Fortress"
 GEH_event.31.desc: "Going southwest from the Gehenna Central District, the muzzles of a steel fortress point toward us. For now, it's just an empty fortress with no one inside. There's a small problem: some small damage occurred during our landing in this world. However, this level of damage can be fixed with our technology.\n\nCalling it a steel fortress doesn't mean it will perfectly block all enemies, but it will be a sturdy shield to delay and defend against enemy attacks. The problem is how to use it. Because of its current location at our very rear, it's in a position too regrettable to be used as a last bastion.\n\nThe good news is that our civil engineering department, the Hot Springs Development Department, can move its location while preserving it perfectly. But there's one big concern. If we move it, where should we move it to?\n\nThe choice is yours."
 GEH_event.31.a: "..."

 GEH_event.32.t: "The End of the Prefect Team"
 GEH_event.32.desc: "\"Under the great command of Chairman Makoto, those Prefect Team pests have surrendered!\"\n\n\"We knew nothing about Gehenna. You are truly great, senpai!\""
 GEH_event.32.a: "Hmm. As expected, perfect."

 GEH_event.33.t: "That Day"
 GEH_event.33.desc: "Day has dawned. The Hot Springs department is moving according to plan and is conducting basic construction to remove the Maginot Line. However, we still haven't decided on its location. Where should it be?"
 GEH_event.33.a: "...Trinity."

 GEH_event.34.t: "Gehenna of Steel, Fortress of Steel"
 GEH_event.34.desc: "Under the direct supervision and command of Hina, the head of the Gehenna student council, the plan proceeded perfectly without a hitch, and today, it was reported that the final plan has concluded."
 GEH_event.34.a: "Excellent!"
 GEH_dismantle_maginot_tt: "If the Maginot Line fortress completely disappears and the national spirit vanishes, a new Maginot Line will be established."
 GEH_move_maginot_tt: "A fortress will be constructed on the Trinity border."

 GEH_event.35.t: "Research Support"
 GEH_event.35.desc: "Hina sat down with the logistics and technical teams. 'We need to focus our resources if we're going to survive this world. What should be our priority?'"
 GEH_event.35.a: "Weapons"
 GEH_event.35.b: "Industry"
 GEH_event.35.c: "Electronics"

 GEH_event.36.t: "A Step Back."
 GEH_event.36.desc: "A meeting date with the Gourmet Research Society was barely set, but after listening to their nonsense, Hina eventually ended up bowing her head and making a request. In the end, the Gourmet Research Society accepted the request and decided to blow things up a bit less than before."
 GEH_event.36.a: "How troublesome."
 
 GEH_event.38.t: "End of the Reconquest War"
 GEH_event.38.desc: "The Reconquest War... has ended service...!"
 GEH_event.38.a: "I see."
 
 GEH_event.39.t: "A Very Big Problem"
 GEH_event.39.desc: "What do we do about Makoto?"
 GEH_event.39.a: "Indeed."

 GEH_event.40.t: "The End of Everything (1/2)"
 GEH_event.40.desc: "After Trinity's surrender, those who bore even a shred of responsibility for this unethical and barbaric war vanished as dew on the execution grounds via war crimes trials.\nOnly after a flow of blood that was but a speck compared to the sacrifices thus far did peace arrive like a lie.\n\nIn the middle of Gehenna Central District, which had turned into ruins, Prefect Team Leader Sora-saki Hina could not be certain.\nHer own ability was too meager to restore everything in this land that had turned to ash.\n\nThe cruel and pitiless angels of Trinity had tried to erase everything of Gehenna. \nInitially, she was not shaken.\nBut as the enemies began to cross the line, she too wavered.\nAs the blood-stained footprints behind the angels increased, Hina began to think that all of it was due to her own helplessness.\nTherefore, even though the war was over, Hina was still within it.\nNo one could pull her out.\nAmidst the resentment of the dead calling her name and the voices defending themselves, Hina continued to sink into the swamp called despair.\n\nUntidy hair, wings drooping and dragging on the floor, eyes without focus, a Halo smaller than usual, and horns that had lost their luster.\nThe image of the Prefect Team Leader that Senior Administrator Amau Ako faced was different from the image she remembered.\nWhat was before her eyes was just a weak and sorrowful young girl."
 GEH_event.40.a: "Next"
 GEH_event.42.t: "The End of Everything (2/2)"
 GEH_event.42.desc: "\"Ako…. Please, go back….\"\n\n\"Leader....\"\n\n\"I'm sorry for disappointing you… I'm not the strong person you think I am.. I'm just too exhausted now…\"\n\n\"No, Leader. I… just wanted to say thank you.\"\n\nAt the unexpected words of thanks, Hina raised her head and looked at Ako.\nA gaze that held not pity or blame, but only gratitude and apology, looked at her warmly.\n\n\"....Thank you..? Why…?\"\n\n\"I wanted to say thank you for always working so hard for everyone…. Even though you carry a burden much heavier than what you should bear.. I always saw you silently walking forward...\"\n\n\".….\"\n\n\"I don't know all the responsibilities you were shouldering… but I want to lighten that load even a little bit now.\"\n\n\"Ako….\"\n\n\"From now on, I will shoulder it with you. It's okay now.\"\n\nOnly then did Sora-saki Hina realize.\nThat even within the thorough destruction wrought by Trinity, many things still remained.\nAbove the collapsed buildings and earth, many students—Gehenna—were still alive and breathing.\nTherefore, rebuilding all of this was not her job alone.\nThere was no reason to agonize alone, no need to take it all on herself.\nBecause I, too, am just one member of Gehenna.\n\n\"...Ako.\"\n\n\"Yes, Leader?\"\n\n\"I... I have something I want to say to you too...\""
 GEH_event.42.a: "Thank you. Always."

 GEH_event.43.t: "Wehrmacht Merged into Pandemonium"
 GEH_event.43.desc: "As news flows in that the Wehrmacht has chosen to become one with Pandemonium in the ongoing Gehenna-Wehrmacht negotiations, significant confusion is arising. If these negotiations end successfully, a major problem could occur."
 GEH_event.43.a: "Dammit!"
 GEH_event.43.b: "Germany is now one with Gehenna."
 GEH_event.43.c: "We must resolve this quickly."

 GEH_event.44.t: "Gehenna-Wehrmacht Negotiations Collapsed"
 GEH_event.44.desc: "We have recently received news that the ongoing negotiations between Pandemonium and the Wehrmacht have failed, with the Wehrmacht declaring the talks dead."
 GEH_event.44.a: "Oh dear."

 GEH_event.45.t: "Independence of the Wehrmacht"
 GEH_event.45.desc: "Following the conclusion of the Gehenna-Wehrmacht negotiations, the Wehrmacht has declared independence according to the territorial terms of the treaty. Gehenna and the Wehrmacht will now walk separate paths."
 GEH_event.45.a: "A bitter ending."

 GEH_event.46.t: "Pandemonium's Federation Proposal"
 GEH_event.46.desc: "A proposal for a federal state has been delivered to us from Pandemonium, allowing for significant autonomy for the Wehrmacht while permitting the establishment of a German government. We must discuss this matter and send our response."
 GEH_event.46.a: "Seek the Navy's opinion as well."
 GEH_event.46.b: "Accept."
 GEH_event.46.c: "Reject."

 GEH_event.47.t: "Federation Proposal - Accepted"
 GEH_event.47.desc: "The Wehrmacht has sent a reply stating they accept our proposal."
 GEH_event.47.a: "Germany and Gehenna are one!"

 GEH_event.48.t: "Federation Proposal - Rejected"
 GEH_event.48.desc: "The Wehrmacht has sent a letter stating they cannot accept our terms; the federal proposal has been rejected."
 GEH_event.48.a: "Then we shall continue the negotiations."

 GEH_event.49.t: "Pandemonium's Federation Proposal - Army Command Cedes Decision"
 GEH_event.49.desc: "The German Wehrmacht has informed us of Pandemonium's proposal and handed the final decision-making authority over to us."
 GEH_event.49.a: "Accept."
 GEH_event.49.b: "Reject."

 GEH_event.50.t: "End of Gehenna-Germany Negotiations"
 GEH_event.50.desc: "Pandemonium has unilaterally informed us that negotiations with the German Wehrmacht have been completed."
 GEH_event.50.a: "We cannot accept this result."
 GEH_event.50.b: "...I suppose we must comply."
 GEH_event.50.c: "Tell them to watch what happens next."

 GEH_event.51.t: "Confidence Vote for Former President Hanuma Makoto"
 GEH_event.51.desc: "\"...With that, the vote of confidence for former President Hanuma Makoto has been processed as rejected.\"\nThe end of Hanuma Makoto, the ruler and supreme power of Pandemonium, was more pathetic than expected. Her era ended completely with the failure of a single confidence vote.\n\n\"Me... Makoto-sama... lost a vote..?\"\nThe former President of Pandemonium, now just an ordinary student, muttered to herself.\nWell, it was bound to happen. Pandemonium was maintained only by the low interest of Gehenna students, but now even they have realized the severity of the situation.\n\n\"This is nonsense! Rigged! This was definitely a rigged vote!\"\nHanuma Makoto screamed.\n\nShortly after, the members of Pandemonium elected a new President without a single defection."
 GEH_event.51.a: "The result I wanted."

 GEH_event.52.t: "The New Leader of Germany"
 GEH_event.52.desc: "We have gained the upper hand in the power struggle with Gehenna, and the German State has been established. We now need a new leader to guide the German State, someone who will rule Germany for a long time."
 GEH_event.52.a: "$GER_gerd_von_rundstedt$, the Soldier-Chancellor"
 GEH_event.52.b: "$GER_karl_donitz$, the New Führer"
 GEH_event.52.c: "$GER_albert_speer$, the New Party Leader"

 GEH_event.53.t: "Resignation of Natsume Iroha"
 GEH_event.53.desc: "The political changes Gehenna has undergone have dealt a great shock to the officers of Pandemonium. The fact that Pandemonium is no longer the sole government of Gehenna and has had to cede most of its power to the German government would shock not just the officers, but any student of Gehenna—no, any citizen of Kivotos.\n\nHowever, it has already happened. Natsume Iroha, unable to adapt to this new environment, declared her resignation to Makoto. The free and great Gehenna Academy, one of the Big Three, may no longer exist."
 GEH_event.53.a: "Natsume Iroha, Ordinary Student"

 GEH_event.54.t: "Confidence Vote for President Hanuma Makoto"
 GEH_event.54.desc: "\"...Therefore, we shall begin the confidence vote for Hanuma Makoto.\"\nHanuma Makoto, ruler of Pandemonium and a member of the council, had no choice but to take responsibility for the failure of the unification negotiations with the Wehrmacht and for creating another hypothetical enemy state in the north.\n\n\"Me, Makoto-sama, might not be trusted...?\"\nHanuma Makoto, President of Pandemonium and now under the scrutiny of Gehenna students and Pandemonium officers, muttered.\nPerhaps... it was a predicted outcome from the moment she failed to secure an overwhelming advantage in the negotiations. They began amidst the Prefect Team's unexpected backlash and the Wehrmacht's lack of cooperation, after all.\n\nAnd amidst everyone's focus and the unprecedented interest of the students—even if it was only in the single digits before—the confidence vote for Hanuma Makoto began."
 GEH_event.54.a: "\"...With that, President Hanuma Makoto has been reaffirmed.\""
 GEH_event.54.b: "\"Kyogoku Satsuki has been appointed as the interim President of Pandemonium.\""
 GEH_event.54.c: "\"The administration of Pandemonium will be temporarily handled by the Secretariat.\""

 GEH_event.55.t: "Ultimatum from [GEM.GetName]"
 GEH_event.55.desc: "Having successfully concluded negotiations with the German Wehrmacht, [GEM.GetName] has sent an official document ordering us to follow their lead. Seeing Rundstedt's name signed as Commander-in-Chief has thrown our leadership into significant confusion. Our planned 'Germany Reclamation Project' seems to have fallen through, and it appears they have even seized the very legitimacy of 'Germany'."
 GEH_event.55.a: "We have no choice but to submit."
 GEH_event.55.b: "...Let's look for another way."
 GEH_event.55.c: "We simply won't go there."

 GEH_event.56.t: "Kriegsmarine Accepts"
 GEH_event.56.desc: "The Kriegsmarine has accepted our ultimatum. Shortly after, their Commander-in-Chief contacted us to begin the transfer of command, officially bringing the Kriegsmarine under our authority."
 GEH_event.56.a: "Glorious."

 GEH_event.57.t: "Kriegsmarine Rejects"
 GEH_event.57.desc: "The Kriegsmarine has rejected our ultimatum. Despite having operated without supplies for a long time, it seems they have not abandoned their hostility toward us."
 GEH_event.57.a: "Let them do as they wish."

 GEH_event.58.t: "The Axis?"
 GEH_event.58.desc: "Despite being in an alliance with us, Pandemonium is embracing German Nationalism and attempting to build a massive alliance known as the 'Axis'.\n\nIn response to their actions, we must decide whether to break our alliance with them or join this 'Axis' power."
 GEH_event.58.a: "Break the alliance with Pandemonium."
 GEH_event.58.b: "Let us build a new order with them."

 GEH_event.59.t: "Prefect Team Breaks Alliance"
 GEH_event.59.desc: "Our series of actions following the acceptance of German Nationalism has contributed to our diplomatic relations with the Prefect Team reaching an all-time low.\n\nThe Prefect Team has finally decided to break their alliance with us, and we may now have to face a new enemy."
 GEH_event.59.a: "The Prefect Team's whims are as constant as ever."

 GEH_event.60.t: "Gehenna's Request for Mediation"
 GEH_event.60.desc: "Gehenna Academy has expressed its intent to restart the Eden Treaty, originally proposed by the former General Student Council President, and has requested our mediation.\n\nWe must now choose whether to resolve the diplomatic issues between Gehenna and Trinity or to wash our hands of the matter."
 GEH_event.60.a: "Mediate the peace treaty between Gehenna and Trinity."
 GEH_event.60.b: "There is nothing we can do about this matter."
 GEH_event.60.c: "The current Trinity is definitely dangerous."

 GEH_event.61.t: "GSC Restarts Eden Treaty"
 GEH_event.61.desc: "Recently, Gehenna Academy has begun re-examining the Eden Treaty proposed by the former General Student Council President, and it is presumed that the Sanctum Tower is involved.\n\nWe must choose whether to accept this treaty and attempt peace negotiations with Gehenna, or to sabotage the treaty and maintain the status quo."
 GEH_event.61.a: "Support the establishment of the Eden Treaty Organization."
 GEH_event.61.b: "Unfortunately, we haven't received any contact."
 GEH_event.61.c: "We do not want a peace treaty with Gehenna."

 GEH_event.62.t: "Positive Response from Trinity"
 GEH_event.62.desc: "Trinity seems to be positively reviewing our intent to push for the Eden Treaty. While the exact details won't be known until the GSC's mediation is finished, the response so far suggests things are progressing successfully."
 GEH_event.62.a: "Is it a success?"

 GEH_event.63.t: "Trinity Rejects Treaty"
 GEH_event.63.desc: "The GSC's mediation attempt has fallen through, and it has been revealed that Trinity has expressed a strongly negative opinion regarding the Eden Treaty. We may now need to prepare for war with Trinity, and their actions might even draw the GSC to our side."
 GEH_event.63.a: "Hmm."

 GEH_event.64.t: "GSC Rejects Treaty"
 GEH_event.64.desc: "The General Student Council has expressed reluctance to get involved in the complex diplomatic issues between Trinity and Gehenna, citing that the Eden Treaty is already a failed agreement.\n\nIt seems the Eden Treaty has failed before it even reached Trinity."
 GEH_event.64.a: "Unfortunate."

 GEH_event.65.t: "GSC Proposes Defense Pact"
 GEH_event.65.desc: "Citing the recent rapid changes in Trinity's political landscape, the General Student Council has proposed a mutual defense pact.\n\nWe are now able to push for a new form of the Eden Treaty to counter Trinity's fanatical ideologies."
 GEH_event.65.a: "That's a good idea."
 GEH_event.65.b: "We have no interest in that."

 GEH_event.66.t: "Gehenna Accepts Defense Pact"
 GEH_event.66.desc: "The Gehenna leadership has decided to accept the defense pact we proposed. With this, it seems we have found an excellent ally for the great war to come."
 GEH_event.66.a: "Good."

 GEH_event.67.t: "Gehenna Rejects Defense Pact"
 GEH_event.67.desc: "Gehenna has expressed that they have no interest in the type of defense pact we proposed and has rejected our offer."
 GEH_event.67.a: "A pity."

 GEH_event.68.t: "Eden Treaty Signing Ceremony"
 GEH_event.68.desc: "Today is the day we sign the Eden Treaty under the mediation of the General Student Council.\n\nThe long-standing conflict between Trinity and Gehenna shall come to an end today."
 GEH_event.68.a: "Sign the treaty."

 GEH_event.69.t: "Sudetenland German Unrest"
 GEH_event.69.desc: "The propaganda Gehenna spread after making massive concessions for the Germans seems to have significantly motivated the Germans living in our territory.\n\nGermans residing in the Sudetenland have taken to the streets in large protest processions, and various forms of rioting are breaking out."
 GEH_event.69.a: "They are always a problem."

 GEH_event.70.t: "Prefect Team Total Withdrawal!"
 GEH_event.70.desc: "The Prefect Team, which has been in constant conflict with us, has just unilaterally notified us that they are ceasing all peacekeeping activities.\n\nAs the Prefect Team withdraws from our territory, it is estimated that our public security burden will increase immensely."
 GEH_event.70.a: "The Prefect Team is afraid of us."
 GEH_event.70.b: "Let's remind them of their place."

 GEH_event.71.t: "Pandemonium Expels the Prefect Team!"
 GEH_event.71.desc: "Pandemonium, which has been in constant conflict with us, has just sent an official document unilaterally ordering us to leave the territory they control.\n\nPandemonium expelling us could mean they are preparing for war. We must prevent the coming chaos in Gehenna."
 GEH_event.71.a: "Why on earth?"
 GEH_event.71.b: "We need to accelerate our plans."

 GEH_event.72.t: "Overtures from Gehenna"
 GEH_event.72.desc: "After Gehenna Academy—which arrived from another world—publicly declared hostility toward Trinity, they requested that we join them if they go to war with Trinity, citing territorial losses.\n\nGehenna Academy seems to be trying to overcome the power gap with Trinity through diplomatic solutions, and we can use this treaty as an opportunity to restore lost territory."
 GEH_event.72.a: "A good idea. For now."
 GEH_event.72.b: "That is a dangerous notion."

 GEH_event.73.t: "Poland Accepts Treaty"
 GEH_event.73.desc: "[POL.GetName] has accepted our overtures and has drafted a treaty to join our side in the upcoming war between Gehenna and Trinity."
 GEH_event.73.a: "Good. At least for now."

 GEH_event.74.t: "Poland Rejects Treaty"
 GEH_event.74.desc: "[POL.GetName] has rejected our proposal, stating that it could jeopardize Poland's national fate."
 GEH_event.74.a: "I didn't expect much."

 GEH_event.75.t: "Gehenna and Poland Enter War"
 GEH_event.75.desc: "According to the previous treaty with Gehenna, Poland must now enter the war against Trinity. Of course, since the international situation has changed significantly since the signing, we could choose to ignore the treaty."
 GEH_event.75.a: "We abide by the treaty."
 GEH_event.75.b: "..."
 GEH_event.75.c: "Wait, didn't Gehenna just invade?"

 GEH_event.76.t: "Poland Joins the War!"
 GEH_event.76.desc: "According to the treaty signed previously, [POL.GetName] has joined our side in the war against Trinity!\n\nPoland's action will bring us a massive advantage in the war against Trinity!"
 GEH_event.76.a: "Let us be grateful for their honesty."

 GEH_event.77.t: "Poland Breaks Treaty"
 GEH_event.77.desc: "According to the treaty signed previously, [POL.GetName] should have joined our war in this situation. However, [POL.GetName] has informed us of their intent not to participate, citing changes in the international situation and a reinterpretation of the treaty."
 GEH_event.77.a: "They wouldn't have been much help anyway."

 GEH_event.78.t: "Army Reform"
 GEH_event.78.desc: "As a result of our continuous efforts, we have improved the military operational capabilities of [GEM.GetName]. We now possess a better army and can formulate superior operational plans."
 GEH_event.78.a: "Keep at it."

 GEH_event.100.t: "Eden's Decisive Battle - Rising of the Morning Star"
 GEH_event.100.desc: "A conflict that began centuries ago from a minor dispute has finally escalated into a total war that will decide the fate of two academies.\n\nThe invader, Trinity, was confident that a few weeks would be enough to crush Gehenna. They were superior in numbers and technology, never doubting their victory. But there was one thing they overlooked: the Gehenna students' spontaneous rage, unity, and above all, their longing for 'Freedom'.\n\nThe students of Gehenna rose up with weapons. They chose the battlefield over classrooms and threw themselves into trenches instead of desks. Their battle was not merely the defense of an academy; it was a struggle for identity, a struggle to prove they were alive.\n\nGehenna's red flag did not break under any oppression, and finally, they reached Eden, the heart of Trinity. The final battle there was fierce, with many sacrifices, but Trinity eventually fell to its knees. Their arrogance was repaid with defeat, and Gehenna was victorious.\n\nHowever, this victory was costly. The city was ruined, and the scars of war remained on the streets. Silence fell where friends were lost, and the academy was devastated. But Gehenna survived. And above all, it protected its 'Freedom'.\n\nNow they will rise again. They will build a new school upon the ruins, remembering the names of fallen comrades as they move forward. Gehenna's freedom was once precarious, but it has now become a conviction won through blood. And that conviction shall never be broken again."
 GEH_event.100.a: "May it last forever!"

 GEH_event.41.t: "Trinity's Surrender"
 GEH_event.41.desc: "Trinity has surrendered under our advance, and Misono Mika and her remnants have vanished without a trace. A member of another Pater faction signed the surrender documents in her stead, officially ending the Gehenna-Trinity War.\n\nWe spilled much blood in the war with Trinity, but once again, we have succeeded in defending Gehenna, and all miracles begin from this moment."
 GEH_event.41.a: "The Conclusion"
