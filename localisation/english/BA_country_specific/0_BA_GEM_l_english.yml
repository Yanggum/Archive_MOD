 GEH_nego_whit_wehrmacht_new_tt:0 "$GEH_prefect_team_angry$\n중점을 선택하는 동안 @GEA §Y독일 국방군§!과 협상이 시작될 것입니다.\n§g협상에는 정치력이 매우 많이 필요합니다. 만마전의 패널티가 해결되지 않은 상태로 협상에 돌입한다면 협상은 대부분 실패할 것입니다.§!\n"
