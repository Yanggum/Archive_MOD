 GEM_GATHERING_STORM_DESC:0 "Everything is running in a haphazard manner, and the rampages of the clubs have reached a point where they can no longer be stopped. The conflict between Pandemonium and the Prefect Team is famous enough for other academies to know. In Gehenna, the sound of bombs exploding and gunfire is a constant, filling the air with chaos.\n\nWhen the Great Cataclysm occurred, this lawless zone was thrown into further turmoil.\nThe new people revealed their hostility and tried to drive us out, but we held firm. However, as long as Gehenna's Hina Sorasaki keeps her eyes open, a bloodbath will surely follow."

 GEH_GATHERING_STORM_DESC:0 "Amidst the chaos of the Great Cataclysm, Hina Sorasaki's Prefect Team has somehow managed to prevent the Kivotos population from committing crimes against the locals, maintaining order centered around the Bavaria region for 50 days. However, Hina is growing exhausted due to the skyrocketing workload since the event, and Gehenna students have begun criticizing the Prefect Team government, believing that the Team has become 'warlord-ized' now that they are free from Pandemonium's control.\n\nAs the Prefect Team becomes increasingly isolated by enemies both internal and external, what will be the future of Gehenna's Prefect Team? Can they replace Pandemonium as the heart of Gehenna? And can they protect Gehenna from the threat of Trinity approaching from the east?"
 
