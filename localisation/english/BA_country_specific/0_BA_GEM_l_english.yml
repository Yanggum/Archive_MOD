 GEM_security_militia: "민병대 보호"
 GEM_security_militia_desc: "만마전 군단은 판데모니움 소사이어티가 운영하는 충성스러운 사병 조직입니다. 우리는 이 조직을 확대하여 부족한 군사력을 확보하고 전선 후방의 위협을 최소화 할 것입니다."
 GEM_coerced_loyalty: "충성 강요"
 GEM_coerced_loyalty_desc: "만마전 군단은 그 어떤 조직보다 만마전과 게헨나에 충성하고 위대한 사명을 위해 자기 자신을 불사를 수 있어야만 합니다. 우리는 그렇게 만들 것입니다."
 GEM_honor_and_glory: "명예와 영광"
 GEM_honor_and_glory_desc: "군단의 병사들은 그 모두가 게헨나의 어떤 군인보다 명예롭고 영광스러운 운명을 가지게 될 것입니다. 거리의 전단지와 만마전의 방송에서는 이들을 지속해서 찬양할 것입니다."
 GEM_great_duty: "위대한 의무"
 GEM_great_duty_desc: "게헨나의 학생은 모두가 위대한 의무를 짊어지고 있습니다. 가장 강력한 학원이자 가장 강인한 학생으로서 우리는 게헨나를 위해 영원토록 충성할 것입니다."
 GEH_towards_the_greatest_academy: "가장 위대한 학원을 향해"
 GEH_guardian_of_entire_gehenna: "전게헨나의 보호자"
 GEH_german_cultural_hegemony_struggle: "독일 헤게모니 장악"
 GEH_gehenna_national_defense_department: "게헨나 국가방위부"
 GEH_intelligence_department_expansion: "정보부 확장"
 GEH_government_of_all_demons: "모든 악마들의 정부"
 GEH_new_world_order_hegemony: "신세계 패권"
 GEH_secret_police_imitation: "비밀경찰 모방"
 GEM_satsuki_department_expansion: "NK-울트라 부서 확장"
 GEM_satsuki_department_expansion_tt: "§g쿄고쿠 사츠키의 중점도는 강력한 성능을 제공하나 완료할수록 지도자를 교체하기 어려워질 것입니다.§!"
 GEM_what_are_you_talking_about_i_was_always_the_student_council_president: "무슨 소리에요, 게헨나의 학생회장은 언제나 저였잖아요?"
 GEM_what_are_you_talking_about_i_was_always_the_student_council_president_tt: "§Y만마전 의장 축출!§! 사건이 대신 §Y쿄고쿠 사츠키§!가 확정 선출되는 사건으로 대체될 §R확률§!이 생깁니다. §R(25%)§!"
 GEM_starting_today_a_special_department_just_for_me_should_be_created: "오늘부터 나만을 위한 '특별한' 부서가 필요할꺼 같은데, 도와줄래?"
 GEM_starting_today_a_special_department_just_for_me_should_be_created_tt: "§Y만마전 의장 축출!§! 사건이 대신 §Y쿄고쿠 사츠키§!가 확정 선출되는 사건으로 대체될 §R확률§!이 대폭 증가합니다. §R(66%)§!"

 GEM_demonstration_of_military_achievements: "군사적 업적의 시연"
 GEM_demonstration_of_military_achievements_desc: "우리의 역사는 위대한 군사적 업적으로 가득합니다. 우리 군대가 현재 일궈낸 것을 또 다른 위대한 군사적 업적으로 인정함으로써 우리는 이들의 사기를 고조시키고 그들의 충성심을 더욱 증가시킬 수 있을 것입니다."
 GEM_demonstration_of_military_achievements_trigger: "다음 중 하나가 참이어야 함:\n   종속국 §Y2§!개 초과\n   §Y유럽§! 내 점령한 주 §Y19§!개 초과"
 GEM_country_leader_change_blocks_progress_demonstration_military_achievement_tt: "§R§Y$GER_demonstration_of_military_achievements$§! 중점을 완료한 후 국가 지도자를 변경할 경우 §Y$GER_an_invincible_army$§!과 §Y$GER_the_supreme_leader$§! 중점을 완료할 수 없게 됩니다§!"
 GEM_an_invincible_army: "무적의 게헨나 군대"
 GEM_an_invincible_army_desc: "많은 성과와 승리를 통해 우리 군대는 전장에서 많은 것을 배웠으며, 우리는 적 선동가들이 뭐라고 말하던 간에, [ROOT.GetAdjective]군이 실로 무적이라는 것을 증명했습니다!"
 GEM_an_invincible_army_trigger: "다음 중 하나가 참이어야 함:\n   종속국 §Y5§!개 초과\n   §Y유럽§! 내 점령한 주 §Y49§!개 초과"
 GEM_the_supreme_leader_trigger: "[ROOT.GetNameDefCap]은 §Y주요국 2개§! 이상을 §Y항복§!시킴"
 GEM_the_supreme_leader: "최고 지도자"
 GEM_the_supreme_leader_desc: "지시된 개혁 및 재건 프로그램을 통해 [ROOT.GetLeader]와 그의 대의에 대한 전 게헨나 학생들의 충성심은 새로운 차원에 도달했습니다. 우리 지도자와 학원에 대한 이러한 전폭적인 지지 추세는 계속되어야 합니다."

 #### 독일국 휘하 중점
 ############# 독일국 먼저찍기
 GEM_focus_ended_AO: "부활한 독일 민족의 국가"
 GEM_focus_ended_AO_desc: "게헨나 학원은 이제 없습니다. 게헨나 학생들과 국민이 새 시대에 온전히 살아가기 위해서는, 독일국을 수립하고 대전이 이전 질서의 제도 내로 우리가 들어가는 것이 현명했습니다.\n\n§O잿더미 위로 독수리가 날아오른다!§!"
 GEM_peace_achievement: "평정 달성"
 GEM_peace_achievement_desc: "옛 독일의 영지를 모두 통합했으며, 이제 중앙유럽의 패자 독일이 돌아왔습니다. 우리는 다시 한번 도약하여 민족과 국민의 미래를 향해 나아갈 것입니다!"
 GEM_union_of_affection: "연정 결속. 어떻게든."
 GEM_union_of_affection_desc: "신뢰는 하루아침에 쌓이지 않습니다. 지금 우리에게 필요한 것은 이상적인 화합이 아닌, 현실적인 공존입니다. 정치적 합의와 공동의 목표를 통해, 서로를 증오하는 두 파벌이 어쩔 수 없이 협력하게 만드는 강제적인 연대를 구축할 것입니다."
 GEM_to_not_lose_initiative: "주도권을 놓치지 않기 위해"
 GEM_to_not_lose_initiative_desc: "우리가 그들의 이름을 받아들였다고 해서, 이 국가를 세운 주도권까지 넘겨줄 수는 없습니다. 새로운 연방 체제 속에서 구심점 역할을 할 핵심 세력은 여전히 우리여야만 합니다. 독일계 정치인들의 도전을 제압하고 통치력을 유지할 방안을 강구해야 합니다."
 GEM_fierce_political_propaganda: "살벌한 정치 선전"
 GEM_fierce_political_propaganda_desc: "두 민족을 하나의 국민으로 만들기 위해서는, 법률 이상의 것이 필요합니다. 모든 신문, 라디오, 포스터를 동원한 대대적인 선전 활동을 통해 '새로운 독일인'이라는 공유된 정체성을 모두의 마음속에 새겨 넣을 것입니다."
 GEM_two_nations_one_state: "두 민족, 하나의 국가"
 GEM_two_nations_one_state_desc: "게헨나인과 독일인. 역사도, 문화도, 심지어 신체 구조마저 다른 두 민족입니다. 이 차이를 인정하면서도 하나의 국가에 대한 공동의 충성을 요구하는 것. 이것이 우리 합중국이 마주한 가장 큰 난제이자 위대한 도전입니다."
 GEM_rolling_the_dice: "주사위 굴리기"
 GEM_rolling_the_dice_desc: "점진적인 통합은 안전하지만 너무나도 더딥니다. 때로는 역사를 앞으로 나아가게 하기 위한 대담한 도박이 필요합니다. 성공한다면 진정한 통일을 앞당길 것이나, 실패한다면 이 위태로운 평화는 산산조각 날 것입니다."
 GEM_leader_of_us: "'우리들'의 지도자"
 GEM_leader_of_us_desc: "이제야 비로소 확신이 차는 것 같습니다. 우리들의 지도자는 이런 모습을 지녀 마땅합니다. 모든 정치적 풍파를 헤쳐 나아간 [ROOT.GetLeader]의 지도를 따라. 앞으로 나아갑시다! 미래를 향해, 게헨나를 위해...그리고, 독일을 위해!"
 GEM_redefinition_of_german_nation: "독일 민족 재정의"
 GEM_redefinition_of_german_nation_desc: "'독일 민족'이란 무엇입니까? 우리는 혈통이라는 낡은 족쇄를 끊어버릴 것입니다. 이 땅의 미래를 함께 만들어가기로 맹세한 모든 이들을 포괄하는, 새로운 시민적 정체성으로 다시 태어날 것입니다. 게헨나인과 독일인이라는 구분은 사라지고, 오직 '새로운 독일인'만이 존재하게 될 것입니다."
 GEM_multiethnic_state: "다민족 국가"
 GEM_multiethnic_state_desc: "하나의 민족만이 위대하다는 낡은 시대의 망상이야말로, 이 땅에 비극을 불러왔습니다. 우리는 하나의 정체성을 강요하는 대신, 모든 민족이 각자의 고유한 문화와 전통을 존중받는 길을 선택합니다. 게헨나인은 게헨나인으로서, 독일인은 독일인으로서, 동등한 시민이 되어 다양성 속에서 더 강력한 조화를 이룰 것입니다."
 ############# 마코토
 GEM_focus_ended_1_A: "독일 헤게모니 찬탈"
 GEM_focus_ended_1_A_desc: "독일의 강력한 헤게모니는 그 자체로 훌륭한 도구이지만, 주인을 잘못 만났습니다. 우리는 비효율적인 기존 지배세력을 몰아내고, 그들이 닦아놓은 강력한 국가 시스템을 찬탈하여 우리의 위업을 위한 발판으로 삼을 것입니다. 이제부터 독일의 힘은 가장 유능한 지도자, 즉 우리의 손에 의해 휘둘러질 것입니다."
 GEM_new_knot: "새로운 질문"
 GEM_new_knot_desc: "우리는 이제 독일의 지배자이지만, 독일인은 아닙니다. 이 명백한 모순은 국가의 근간을 뒤흔들 수 있는 불안요소입니다. 그렇다면 질문을 던져야 합니다. '독일인'이란 무엇입니까? 혈통입니까, 문화입니까? 아니면 이 땅을 실질적으로 지배하는 강자의 의지입니까? 이 새로운 질문에 대한 답을 찾아야만 합니다."
 GEM_provable_problem: "증명 가능한 문제"
 GEM_provable_problem_desc: "'독일인이란 무엇인가'라는 질문은 더 이상 철학의 영역이 아닙니다. 이것은 우리가 답을 정의하고 증명할 수 있는 문제입니다. 우리는 국가에 대한 충성, 우리의 이념에 대한 동조, 그리고 위업에 대한 기여도를 기준으로 새로운 '독일인'의 자격을 증명하는 체계를 수립할 것입니다."
 GEM_gordian: "고르디우스의 매듭"
 GEM_gordian_desc: "복잡하게 얽힌 혈통과 역사의 논쟁을 풀려고 시도하는 것은 어리석은 일입니다. 위대한 지도자는 매듭을 푸는 대신 잘라냅니다. 우리는 선언할 것입니다. 이 땅을 통치하고 미래를 개척하는 우리가 바로 독일의 새로운 정의이며, 우리의 방식이 곧 독일의 방식이라고 말입니다. 논쟁은 이제 끝났습니다."
 GEM_successor_of_fuehrer_station: "총통 역의 계승자"
 GEM_successor_of_fuehrer_station_desc: "총통의 자리는 단순히 독일의 최고 권력자를 의미하는 것이 아닙니다. 그것은 독일 헤게모니 그 자체를 상징하는 자리입니다. 하누마 마코토 의장이 공식적으로 총통의 지위를 계승함으로써, 우리는 외부의 찬탈자가 아닌 독일의 정당한 지배자로서의 정통성을 확보하고 모든 권력을 의장에게 집중시킬 것입니다."
 GEM_mini_gehenna_academy: "소 게헨나 학원"
 GEM_mini_gehenna_academy_desc: "독일의 헤게모니를 장악했지만, 우리의 고향인 게헨나 학원의 지위는 여전히 모호합니다. 우리는 독일국 내에서 게헨나 학원의 법적 지위를 명문화하고, 그 역할을 재설계할 것입니다. 학생회장은 이제 독일 내 게헨나 공동체의 이익을 대변하는 공식적인 대표단 역할을 겸직하게 됩니다. 이는 우리의 새로운 질서 안에서 그들을 효과적으로 통치하고 관리하기 위한 첫걸음입니다."
 GEM_broader_german: "더 넓은 독일인"
 GEM_broader_german_desc: "이제 '독일인'의 정의는 혈통의 굴레에서 벗어납니다. 우리의 새로운 기준과 교육을 받아들여, 총통에게 충성을 맹세하고 위업에 동참하는 모든 이들은 '더 넓은 의미의 독일인'으로서 동등한 자격을 얻게 될 것입니다. 이는 국가의 내적 결속을 다지고 잠재적인 저항 세력을 흡수하는 효과적인 방법입니다."
 GEM_hanuma_makoto_constitution: "하누마 마코토 헌법"
 GEM_hanuma_makoto_constitution_desc: "모든 논쟁을 종식시키고 새로운 질서를 영원히 확립하기 위해, 우리는 '하누마 마코토 헌법'을 제정합니다. 이 헌법은 총통의 절대적 권위, 새로운 독일인의 정의, 그리고 국가의 위대한 목표를 불변의 법으로 규정할 것입니다. 이는 우리가 재창조한 독일, 새로운 제국의 영원한 기틀이 될 것입니다."
 ############# 사츠키
 GEM_focus_ended_2_A: "대중계몽부 설립"
 ############# 이로하
 GEM_focus_ended_3_A: "독일 연방 헌법"
 GEM_focus_ended_3_A_desc: "제국의 폭정과 키보토스의 혼돈을 모두 거부합니다. 우리는 1848년, 실패했지만 위대했던 선조들의 꿈 위에 새로운 국가를 건설할 것입니다. 모든 독일인을 위한 통일되고, 자유로운 공화국을 향한 첫걸음입니다."
 GEM_restore_german_federal_territories: "독일 연방 영지 회수"
 GEM_restore_german_federal_territories_desc: "프랑크푸르트 국민의회가 구상했던 독일 연방의 정당한 국경은 아직 회복되지 않았습니다. 우리의 역사적 사명은 흩어진 모든 독일계 영토를 되찾고, 하나의 위대한 연방 아래 통일하는 것입니다."
 GEM_new_federalist_constitution_of_freedom: "신연방주의 자유 헌법"
 GEM_new_federalist_constitution_of_freedom_desc: "우리의 새로운 헌법은 자유의 기념비가 될 것입니다. 과거의 독재가 다시는 이 땅에 발붙이지 못하도록, 국민의 기본권을 보장하고 권력분립을 명문화하여 흔들리지 않는 민주주의의 초석을 다집니다."
 GEM_respect_rights_of_states: "주 권리의 존중"
 GEM_respect_rights_of_states_desc: "통일이 곧 중앙집권화를 의미해서는 안 됩니다. 바이에른에서부터 슐레스비히홀슈타인에 이르기까지, 각 주의 고유한 전통과 자치권을 존중하는 진정한 연방제를 통해 다양성 속의 통일을 이룩할 것입니다."
 GEM_master_of_central_europe: "중앙유럽의 지배자"
 GEM_master_of_central_europe_desc: "자유롭고 통일된 독일은 더 큰 사명을 가집니다. 우리는 단순히 존재하는 것을 넘어, 중앙유럽의 질서를 주도하는 지도국이 되어야 합니다. 우리의 힘과 이상을 통해 이 지역의 패권을 장악할 것입니다."
 GEM_introduce_socialist_economy: "사회주의 경제 도입"
 GEM_introduce_socialist_economy_desc: "정치적 자유는 경제적 평등 없이는 공허한 구호에 불과합니다. 1848년의 혁명 정신을 이어받아, 노동자를 보호하고 부를 재분배하는 사회주의 경제 정책을 도입하여 모든 이에게 공정한 기회를 제공할 것입니다."
 GEM_most_advanced_german_federation: "최대한으로 진보된 독일 연방"
 GEM_most_advanced_german_federation_desc: "우리의 연방은 세계의 모범이 될 것입니다. 민주적 자유와 사회주의적 평등을 결합하여, 역사상 가장 진보하고 정의로운 사회를 건설하고 전 세계 피억압 인민들을 위한 희망의 등대가 될 것입니다."
 GEM_greater_german_federation: "대독일 연방"
 GEM_greater_german_federation_desc: "마침내 1848년의 꿈이 현실이 되었습니다. 모든 독일인이 하나의 깃발 아래 자유를 누리며, 분열되었던 조국은 온전한 모습으로 다시 태어났습니다. 이것이야말로 우리 선조들이 피 흘려 쟁취하고자 했던 대독일 연방입니다."
 GEM_fortress_of_progress: "진보의 성채"
 GEM_fortress_of_progress_desc: "우리의 진보적인 이상은 주변의 낡은 세력들에게 위협이 됩니다. 혁명의 성과를 지키기 위해, 연방은 그 어떤 외부의 압력에도 굴하지 않는 견고한 '진보의 성채'가 되어야만 합니다."
 GEM_federal_parliament_including_all_political_forces: "모든 정치세력을 포괄하는 연방 의회"
 GEM_federal_parliament_including_all_political_forces_desc: "우리는 과거의 독재자들처럼 반대 의견을 두려워하지 않습니다. 보수부터 진보까지, 모든 민주적 정치세력이 동등하게 참여하는 연방 의회를 구성하여, 토론과 타협을 통해 국가의 미래를 만들어나갈 것입니다."
 ############# 치아키
 GEM_focus_ended_4_A: "정당통일법 발효"
 #### 독일 게헨나 연방 휘하 중점
 GEM_focus_ended_BO: "파벌 정치 강화"
 GEM_focus_ended_BO_desc: "하나의 국가, 두 개의 심장. 연방의 불안정한 평화를 유지하기 위해, 우리는 이상적인 통합 대신 현실적인 공존을 택했습니다. 각자의 정체성을 대표하는 강력한 파벌을 인정하고, 그들의 경쟁을 통해 국가를 운영하는 새로운 시대를 열 것입니다."
 GEM_new_people_of_new_regime: "신체제의 신인민"
 GEM_new_people_of_new_regime_desc: "게헨나인도, 구 독일인도 아닌. 연방의 법 아래 동등한 권리와 의무를 지는 새로운 '연방 인민'의 개념을 정립합니다. 이것은 낡은 정체성을 대체하는 것이 아닌, 그 위에 새로운 국가적 충성심을 덧씌우는 작업입니다."
 GEM_gehenna_ruling_party_formation: "게헨나 여당 형성"
 GEM_gehenna_ruling_party_formation_desc: "수많은 동아리와 이익 집단의 집합체였던 구 만마전 체제는 현대 국가를 이끌기엔 너무나도 무질서합니다. 모든 게헨나계 세력을 규합하여, 강력하고 규율 잡힌 단일 지도 정당 '전게헨나 인민당'을 창설할 것입니다."
 GEM_push_reform_beyond: "개혁을 저 너머로 밀어붙여라!"
 GEM_push_reform_beyond_desc: "새로운 여당의 힘은 변화를 위해 사용되어야 합니다. 우리는 연방 전체에 키보토스식 행정 효율성과 사회 개혁의 물결을 일으켜, 낡은 독일의 관습을 타파하고 국가를 다음 시대로 이끌 것입니다."
 GEM_anton_drexler_rehabilitation: "안톤 드렉슬러 복권"
 GEM_anton_drexler_rehabilitation_desc: "새로운 시대의 독일계 정당은 과거의 망령에서 벗어나야 합니다. 히틀러라는 상징 대신, 당의 창립자인 안톤 드렉슬러의 보수적 국가주의를 재조명하여, 우리의 이념적 뿌리를 재정립하고 더 온건한 지지층을 끌어안을 것입니다."
 GEM_in_the_name_of_the_fuehrer: "총통의 이름으로"
 GEM_in_the_name_of_the_fuehrer_desc: "총통. 그 이름은 영광이자 동시에 상처입니다. 우리는 과거의 광기에 얽매이지 않을 것입니다. 대신, 그가 남긴 강력한 국가주의와 반공주의의 유산을 재조명하여, 혼란스러운 현시대에 독일 민족을 단결시킬 강력한 이념적 무기로 삼을 것입니다."
 GEM_in_the_name_of_all_germany: "모든 독일의 이름으로"
 GEM_in_the_name_of_all_germany_desc: "숙적 트리니티는 무릎 꿇었습니다. 이 위대한 승리로서, 우리는 마침내 분열을 극복하고 진정으로 하나된 독일을 이룩했습니다. 이제 우리의 대의는 더 이상 특정 지도자나 과거의 유산에 국한되지 않습니다. 그것은 승리한 '모든 독일'의 이름 그 자체이며, 우리는 이 영광을 바탕으로 통일된 민족의 힘을 세계에 떨칠 것입니다."
 GEM_the_more_things_change: "모든 것이 변해도,"
 GEM_the_more_things_change_desc: "새로운 헌법, 새로운 정당, 새로운 인민. 국가의 모든 것이 변했습니다. 우리는 더 이상 단순한 점령군과 피점령 민족이 아닌, 하나의 시스템 안에서 경쟁하는 동등한 정치적 파트너가 되었습니다."
 GEM_the_more_they_stay_the_same: "더 많은 것이 남는다."
 GEM_the_more_they_stay_the_same_desc: "하지만 모든 것이 변했음에도, 변하지 않는 것이 있습니다. 게헨나 학생들의 소소한 일탈과, 독일인들의 문화는 여전합니다. 그러기에 우리는 여전히 독일이며, 게헨나입니다. 그러나 이제는 하나의 국가 아래에서요. 모든 갈등은 의회 안으로 봉합될 것입니다."
 GEM_two_party_state: "두 당의 국가"
 GEM_two_party_state_desc: "마침내 새로운 질서가 완성되었습니다. 게헨나 여당과 독일 야당. 두 거대한 세력이 서로를 견제하고 경쟁하며 국가를 이끌어가는 양당제. 이것은 불안정하지만, 역동적인 우리 연방의 최종적인 모습입니다."
 ############# 마코토
 GEM_focus_ended_1_B: "독일 헤게모니 합치"
 GEM_focus_ended_1_B_desc: "게헨나인과 독일인이 충돌하지 않고 살아가는 방법은 단 한가지, 독일인과 게헨나인의 생활권 확보해야만 합니다. 위대한 연립 정부의 이름 아래에 레벤스라움을 위한 계획이 진행될 것입니다!"
 GEM_germania_grand_coalition: "게르마니아 대연정"
 GEM_germania_grand_coalition_desc: "이질적인 두 민족을 하나의 국가로 묶는 것은 결코 쉬운 일이 아닙니다. 독일의 정치 세력과 게헨나의 만마전이 참여하는 대연정 체제를 구축하여, 연방의 정치적 안정을 확보하고 통일된 행정 체계를 수립해야 합니다. 이는 새로운 게르마니아의 시작입니다."
 GEM_silent_state: "침묵하는 국가"
 GEM_silent_state_desc: "새로운 연방의 탄생에 반대하는 내외부의 목소리가 존재합니다. 국가의 안정을 위협하는 모든 불순분자를 색출하고, 강력한 정보기관을 통해 반대파를 침묵시켜야 합니다. 연방의 위업은 한 치의 흔들림도 없이 진행되어야 하며, 이를 위해 완전한 내부 통제가 선행되어야 합니다."
 GEM_lebensraum_of_two_nations: "두 민족의 레벤스라움"
 GEM_lebensraum_of_two_nations_desc: "우리 연방의 무한한 잠재력을 실현하기에는 현재의 영토가 너무나도 비좁습니다. 독일 민족에게는 산업과 농지를, 게헨나 민족에게는 새로운 활동 영역과 자원을 제공할 추가적인 공간이 필요합니다. 이제 연방의 생존과 미래 번영을 위해 우리의 정당한 생활권을 확장할 때입니다."
 GEM_trinity_colonization: "트리니티 식민화"
 GEM_trinity_colonization_desc: "우리의 이념과 대척점에 서 있는 트리니티는 연방의 팽창에 있어 가장 큰 장애물이자, 가장 탐스러운 과실입니다. 그들의 영토를 우리의 식민지로 편입하여 풍부한 자원을 확보하고, 연방의 우월한 체제를 이식하여 게헨나 민족을 위한 새로운 보금자리로 개척할 것입니다."
 GEM_south_germany_unification: "남독일 통합"
 GEM_south_germany_unification_desc: "같은 피와 언어를 공유하는 오스트리아의 동포들이 연방의 울타리 밖에 남아있습니다. 더 이상 분열된 역사를 방관할 수 없습니다. 모든 게르만 민족을 하나의 깃발 아래 통합하는 것은 우리의 역사적 과업이며, 연방의 힘을 한층 더 강력하게 만들 것입니다."
 GEM_outer_gehenna_unification: "외게헨나 통합"
 GEM_outer_gehenna_unification_desc: "연방의 통제에서 벗어난 룩셈부르크 지역은 게헨나계가 정착하고, 또 게헨나계 학생이 지도자이니 당연히 연방에 편입되어야 합니다."
 GEM_achievement_of_two_nations_utopia: "두 민족의 이상향 달성"
 GEM_achievement_of_two_nations_utopia_desc: "마침내 우리의 위업이 달성되었습니다. 연방은 내외부의 모든 위협을 극복하고, 두 민족이 각자의 생활권 안에서 조화롭게 공존하며 영원한 번영을 누릴 이상향을 건설했습니다. 게르마니아-게헨나 연방의 이름은 역사에 길이 빛날 것이며, 새로운 시대가 시작되었습니다."
 ############# 사츠키
 GEM_focus_ended_2_B: "대중계몽부 설립"
 ############# 이로하
 GEM_focus_ended_3_B: "독일-게헨나 연방합중국 헌법"
 GEM_focus_ended_3_B_desc: "두 국가의 연방과 수 많은 주의 합중국. 우리는 위태로움 위에 새로운 희망을 건설했습니다. 그러기에 아직 멈춰서는 안됩니다. 연방합중국은 더 많은 개혁을 요하며, 게헨나와 독일 두 민족을 융화시킬 유일한 키카드가 될 것입니다."
 GEM_rise_of_gehenna_party: "게헨나계 정당의 발흥"
 GEM_rise_of_gehenna_party_desc: "연방 체제 아래에서, 구 만마전과 선도부의 낡은 정치 구조는 더 이상 유효하지 않습니다. 독일계 정당과 동등한 위치에서 협상하고 경쟁하기 위해, 게헨나계의 정치적 의지를 대변할 새로운 정당들을 창설해야 합니다."
 GEM_two_factions_one_system: "두 파벌 하나의 제도"
 GEM_two_factions_one_system_desc: "독일계와 게헨나계. 너무도 다른 두 민족이 하나의 깃발 아래 섰습니다. 연방이 내전으로 무너지지 않기 위해서는, 양측의 정당이 서로를 인정하고 공존할 수 있는 안정적인 정치적 틀을 마련해야만 합니다."
 GEM_activate_coalition: "연정 활성화"
 GEM_activate_coalition_desc: "정치적 틀을 마련하는 것만으로는 부족합니다. 이제는 실질적인 협력이 필요합니다. 각 주의회와 연방의회에서 독일계 정당과 게헨나계 정당이 함께 정부를 구성하는 연립정권을 활성화하여, 통합의 첫걸음을 내디딜 것입니다."
 GEM_equal_conscription_law: "동등징병법"
 GEM_equal_conscription_law_desc: "국방의 의무는 특정 민족에게만 지워져서는 안 됩니다. 독일계와 게헨나계 모두에게 동등한 징병 의무를 부과함으로써, 피를 통해 진정한 의미의 '연방합중국 국민'이라는 정체성을 공유하게 될 것입니다."
 GEM_establish_bereaved_family_compensation_system: "유족 보상제도 확립"
 GEM_establish_bereaved_family_compensation_system_desc: "대전이 당시, 그리고 지금까지 이어지는 혼란 속에 희생당한 이들의 유족은 민족에 따라 차별받아서는 안 됩니다. 징병법 개정과 더불어, 독일계와 게헨나계를 아우르는 통일된 유족 보상 시스템을 확립하여 국가가 모든 국민의 생명을 동등하게 여기고 있음을 증명해야 합니다."
 GEM_gehenna_grand_coalition: "게헨나 대연정"
 GEM_gehenna_grand_coalition_desc: "이상주의만으로는 국가를 운영할 수 없습니다. 게헨나계와 독일계 사이의 깊은 불신의 골은 아직 메워지지 않았습니다. 서로에게 손을 내미는 도박 대신, 우리는 가장 현실적이고 안정적인 길을 선택합니다. 이것은 화합이 아닌 영원한 분단일수도 있습니다. 하지만 이 견고한 정치적 연합이야말로, 합중국을 분열시키려는 내외부의 위협에 맞설 가장 강력한 방파제가 될 것입니다."
 GEM_reaching_out_to_each_other: "서로에게 내미는 손길"
 GEM_reaching_out_to_each_other_desc: "법률과 제도는 차가운 뼈대를 세웠지만, 그 안을 채울 따뜻한 피는 아직 돌지 않고 있습니다. 게헨나계와 독일계는 여전히 서로를 '우리'가 아닌 '그들'로 여기고 있습니다. 안전한 대연정의 길을 가는 대신, 우리는 이상주의적인 도박을 시작합니다. 이 도박이 성공한다면, 우리는 수십 년의 시간을 뛰어넘어 진정한 화합을 이룰 것입니다. 실패한다면... 불신은 걷잡을 수 없이 깊어지겠지요."
 GEM_we_are_back: "우리는 돌아왔다!"
 GEM_we_are_back_desc: "기나긴 혼돈과 분열의 시대는 끝났습니다. 독일과 게헨나는 마침내 하나의 국가, 하나의 국민으로 거듭났습니다. 이제 연방합중국은 분열의 상처를 극복한 강력하고 통일된 국가로서, 세계 무대에 다시 한번 그 존재감을 드러낼 것입니다."
 GEM_trinity_oppression: "트리니티계 억압..."
 GEM_trinity_oppression_desc: "독일계와의 융화에 성공했지만, 우리 안에는 새롭게 생겨난 또 다른 '이방인'이 남아있습니다. 게헨나의 오랜 숙적인 트리니티계. 그들의 문화를 억압하고 영향력을 통제하여, 합중국의 동질성을 더욱 공고히 할 것입니다."
 GEM_federation_of_three_nations: "...세 민족의 연방?"
 GEM_federation_of_three_nations_desc: "독일계를 포용했던 것처럼, 트리니티계 또한 우리의 일부로 받아들일 수 있지 않을까요? 게헨나, 독일, 그리고 트리니티. 세 민족의 고유성을 존중하는 더 크고 위대한 연방으로 나아갈 가능성을 모색합니다."
 GEM_federation_of_three_nations1_tt: "$GEM_reaching_out_to_each_other$ 중점 완료 시:"
 GEM_federation_of_three_nations2_tt: "$GEM_gehenna_grand_coalition$ 중점 완료 시:"
 ############# 치아키
 GEM_focus_ended_4_B: "'게헨나 민족' 선언"
 #### 두 민족의 국가
 ############# 마코토
 GEM_focus_ended_1_C: "대게헨나국 선포"
 GEM_focus_ended_1_C_desc: "분열되어 있던 게헨나의 모든 세력은 이제 하나의 깃발 아래 통합되었습니다. 우리는 과거의 낡은 질서를 폐기하고, 만마전을 중심으로 하는 강력하고 위대한 국가, '대게헨나국'의 탄생을 키보토스 전역에 선포합니다. 이는 우리의 위업을 향한 첫 번째 이정표가 될 것입니다."
 GEM_ruler_in_the_sky: "하늘 위의 지배자"
 GEM_ruler_in_the_sky_desc: "진정한 지배자는 지상의 사사로운 일들에 얽매이지 않고, 모두가 우러러보는 높은 곳에서 국가의 나아갈 길을 제시합니다. 의장의 존재를 신격화하고 범접할 수 없는 권위를 확립하여, 모든 이들이 의심 없이 그 뜻을 따르도록 만들어야 합니다. 그녀의 통치는 이해가 아닌, 경외의 대상이 될 것입니다."
 GEM_ten_thousand_demon_dictatorship: "만마 독재"
 GEM_ten_thousand_demon_dictatorship_desc: "효율적인 국정 운영과 신속한 의사 결정을 위해서는 단 하나의 강력한 구심점이 필요합니다. 만마전 내부에 존재할지 모를 불협화음을 제거하고, 모든 권력을 의장에게 집중시켜 국가의 모든 역량을 하나의 목표로 결집시킬 때입니다. 이는 거침없는 위업 달성을 위한 필수적인 과정입니다."
 GEM_heir_of_thunder_emperor: "뇌제 역의 계승자"
 GEM_heir_of_thunder_emperor_desc: "의장의 권위는 이제 인간의 범주를 넘어섰으며, 마치 옛 '뇌제'와 같이 경외의 대상이 되었습니다. 절대적인 카리스마를 바탕으로 국가의 한계를 뛰어넘는 총력전을 준비하고, 의장의 이름 아래 모든 것을 정복할 준비를 마칠 것입니다. 그녀의 의지가 곧 국가의 법입니다."
 GEM_supreme_ruler_walking_the_earth: "지상을 거니는 최고 지배자"
 GEM_supreme_ruler_walking_the_earth_desc: "위대한 지도자는 단상 위에만 머무르지 않고, 직접 민중 속으로 걸어 들어가 그들의 열광적인 지지를 이끌어냅니다. 대규모 집회와 현장 시찰을 통해 의장과 국민의 유대를 강화하고, 지도자를 국가의 구심점이자 자신들의 의지를 실현하는 존재로 여기게 만들어야 합니다. 강력한 카리스마는 그 어떤 물리적인 힘보다 견고한 통치 기반이 될 것입니다."
 GEM_ten_thousand_demon_council: "만마 평의회"
 GEM_ten_thousand_demon_council_desc: "위대한 지도자에게는 그 뜻을 받들고 국정을 보좌할 유능한 인재들이 필요합니다. 만마전의 핵심 인물들로 구성된 '만마 평의회'를 설립하여, 국정의 안정성을 확보하고 보다 체계적인 통치 시스템의 초석을 다질 것입니다. 이는 독단이 아닌, 합리적인 지배의 시작입니다."
 GEM_ten_thousand_demon_council_tt: "§Y[Root.Capital.GetName]§!에서 육로로 접근할 수 있는 §Y세력 회원국의 수도§!까지 §Y1단계§! 철도를 건설합니다."
 GEM_designer_of_all_demons: "모든 악마의 설계자"
 GEM_designer_of_all_demons_desc: "국가란 하나의 거대한 기계와도 같습니다. 우리는 국가의 산업, 군사, 행정 시스템 전반을 가장 효율적인 형태로 재설계할 것입니다. 지도자는 단순히 군림하는 것을 넘어, 국가라는 기계를 완벽하게 설계하고 운영하는 위대한 설계자로서 그 역량을 증명해야 합니다."
 GEM_unification_of_all_gehenna_states: "모든 게헨나 주 통합"
 GEM_unification_of_all_gehenna_states_desc: "게헨나의 여러 자치구들은 아직도 낡은 관습과 행정체계를 유지하고 있습니다. 중앙 정부의 권위를 확립하고 국토를 효율적으로 관리하기 위해, 모든 지역의 행정 시스템을 일원화하고 통합된 인프라를 구축하여 진정한 통일을 완성해야 합니다."
 GEM_one_party_one_nation: "일당 일국"
 GEM_one_party_one_nation_desc: "국가의 모든 목소리는 하나로 통일되어야만 합니다. 만마전 이외의 모든 정치 세력을 배제하고, 오직 당의 의지가 국가의 의지가 되는 일당제를 확립하여 이데올로기적 통일성을 확보합니다. 반대 의견은 더 이상 용납되지 않으며, 오직 하나의 목표를 향해 나아갈 뿐입니다."
 GEM_what_it_means_to_be_sovereign: "국가의 지배자란"
 GEM_what_it_means_to_be_sovereign_desc: "진정한 주권은 단순히 힘으로 상대를 억누르는 것에서 나오지 않습니다. 우리는 국가의 통치 이념을 확립하고, 법치에 기반한 통치 시스템을 구축하여 우리의 지배에 정당성을 부여할 것입니다. 이는 일시적인 정복자가 아닌, 영원한 지배자로 인정받기 위한 과정입니다."
 ############# 사츠키
 GEM_focus_ended_2_C: "대중계몽부 설립"
 ############# 이로하
 GEM_focus_ended_3_C: "부러져도 이상주의를 향한 투쟁"
 GEM_focus_ended_3_C_desc: "나츠메 이로하 합중국 초대 대통령이 만들어낸 합중국 체제 위에 놓인 독일계 시민들의 위치는 불안정합니다. 불법화되었으나 여전히 이루어지는 키보토스계 자본가들에 의한 강제노동과 학생들의 멸시 등... 우리는 이 모든 걸 해결하기 위해 투쟁할 것입니다."
 GEM_file_human_rights_commission: "인권위원회 제소"
 GEM_file_human_rights_commission_desc: "'회색지대'는 키보토스계 기업이 작은 정부를 추구하는 연방정부의 눈을 피해 시장의 뒤에서 벌이는 노동착취의 장입니다. 지금까지는 아무도 제지하지 못했으나, 우리는 이를 폭로할 것입니다."
 GEM_demolish_gray_zone: "회색지대 철거"
 GEM_demolish_gray_zone_desc: "모든 노동착취는 끝나야합니다. 나츠메 이로하 초대 대통령도 이를 원하지 않을것이며, 폭로 이후로 생각보다 많은 게헨나계 시민들과 학생들의 동정표를 얻게 되었기에, 이 모든 노동착취는 종식될 것입니다."
 GEM_demolish_gray_zone_flag: "§Y$GEM_demolish_gray_zone$§! 중점 완료"
 GEM_under_natsume_iroha_arrangement: "나츠메 이로하의 안배 위에서"
 GEM_under_natsume_iroha_arrangement_desc: "나츠메 이로하. 참 복잡한 인물입니다. 어떤 이들은 게헨나 학원의 자유를 훼손시킨 독재자라 하며, 어떤 이들은 독일인들에게 자유를 돌려준 선구자, 또 어떤 이들은 작은 정부를 추진하는 자유방임주의자라고 부릅니다. 그러나. 현재 독일인들이 내일의 햇살을 기대하며 살아남을 수 있는 이유는 그녀의 안배 덕분입니다."
 GEM_enact_equal_labor_law: "평등 노동법"
 GEM_enact_equal_labor_law_desc: "게헨나계와 독일계 뿐만 아니라 다양한 합중국 내 소수민족에 대한 평등한 고용은 여전히 이루어지지 않고 있습니다. 독일계 정치단체들의 힘을 모아 주 정부 단위에서부터 평등한 노동권을 도입시킬 것입니다."
 GEM_enact_equal_labor_law_flag: "§Y$GEM_enact_equal_labor_law$§! 중점 완료"
 GEM_pass_ethnic_quota_system: "민족 할당제 통과"
 GEM_pass_ethnic_quota_system_desc: "모든 게헨나 내 다민족의 평등한 고용을 보장하기 위해 사회의 여러 분야에 할당제가 시행되어야 합니다. 모든 독일계 시민단체들은 법안 통과를 위해 총력을 기울일 것입니다."
 GEM_federal_republic_of_all_germans: "모든 독일인의 합중국"
 GEM_federal_republic_of_all_germans_desc: "독일, 독일 그 무엇보다도, 세상 그 무엇보다도!\n방어와 수호를 할 때에도 항상 형제처럼 함께 서 있다면\n마스에서 메멜까지, 에치에서 벨트까지!\n\n-독일인의 노래 1절 (중)"
 GEM_build_all_german_memorial: "전독일 추모비 건설"
 GEM_build_all_german_memorial_desc: "수 많은 민간단체들의 협력과 각종 계층의 후원으로부터, 제노포비아에 희생당한 모든 독일인들의 이름이 새겨진 추모비를 건설할 것입니다."
 GEM_build_all_german_memorial_idea: "전독일 추모비 건설"
 GEM_build_all_german_memorial_idea_tt: "이 국민정신은 '§Y$GEM_build_all_german_memorial$§!' 중점 완료 시 제거됩니다."
 GEM_build_all_german_memorial_buff_idea: "전독일 추모비"
 GEM_build_all_german_memorial_buff_idea_desc: "기억하라,\n그대들이 우리의 약함을 말할 때,\n그대들이 벗어난\n그 암울했던 시대를 함께.\n-베르톨트 브레히트, <후손들에게>"

 ############# 치아키
