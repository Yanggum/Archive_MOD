 GEM_gehenna_hegemony_claim_intermarium: "브레스트-리토프스크 조약 경계 주시"
 GEM_gehenna_hegemony_anti_bolshevism_declaration: "반볼셰비키 협정"
 GEM_friendship_with_japan: "일본과의 친선"
 GEM_friendship_with_china: "중국과의 친선"
 GEM_gehenna_hegemony_attack_soviet: "소련 해체"
 GEM_danzig_for_poland: "폴란드를 위한 단치히"
 GEM_ostdeutsches_kolonialreich: "동방 독일 식민지"
 GEM_hyakkiyagyo_invasion: "백귀야행 공격"
 GEM_influence_the_hyakkiyagyo: "백귀야행 내 독일계 선동"
 GEM_expand_claims_in_baltic: "발트 영유권 주장 확대"
 GEM_expand_claims_in_baltic_desc: "역사적으로 발트해에는 상당한 수의 독일계 이주민이 살고 있습니다. 게헨나가 독일 헤게모니를 장악하고, 대다수의 독일계의 대표 국가로 활약하는 지금, 이들을 독일의 고향으로 데려오는 것이 우리와 마찬가지로 그들에게도 최선의 이익이 될 것입니다!"
 GEM_invade_italy: "이탈리아 침략"
