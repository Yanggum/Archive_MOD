 GEH_state_government_remove_idea:0 "Dissolution of State Government"
 GEH_schutzstaffel_idea:0 "Schutzstaffel (SS)"
 GEH_local_autonomy_idea:0 "Guarantee of Local Autonomy"
 GEH_local_autonomy_idea_desc:0 "Iroha Natsume, the new Chairwoman of Pandemonium, has legalized and protected various local administrative activities in the German regions."
 GEH_united_states_of_gehenna_idea:0 "United States of Gehenna"
 GEH_united_states_of_gehenna_idea_desc:0 "Under the leadership of Iroha Natsume, Gehenna has been reborn as the United States of Gehenna, a union of several states. State leaders are elected through elections in each state, and the elected governors gain seats in the German Parliament, leading Gehenna through mutual checks and cooperation with Pandemonium."
 GEH_unstable_integration_idea:0 "Unstable Integration"
 GEH_unstable_integration_idea_desc:0 "The integration of Gehenna and the Wehrmacht was achieved after long negotiations, but the deep rift between students and citizens remains unhealed. We must maintain a proper balance between the two groups."
 GEH_prussian_idea:0 "Prussian Soldier"
 GEH_individualism_2: "Military Reform"
 GEH_individualism_2_7: "Gehenna Army"
 GEH_individualism_2_7_desc: "Gehenna's army is organized in a unique form based on private organizations. Of course, this has led to the weakening of central forces as a trade-off, but it is clear that they possess formidable military power."
 GEH_political_turmoil:0 "Political Turmoil"
 GEH_political_turmoil_desc:0 "Currently, Gehenna Academy is caught in a political conflict surrounding Makoto. The reformists, led by Iroha, want the ousting of Makoto and the reconstruction of Gehenna, while the conservatives, including Satsuki and Chiaki, want to defend Makoto's chairmanship.\n\nThis conflict within Gehenna only makes the already chaotic academy more confused and could pose a serious threat."
 GEH_sudetenland_disturbances:0 "Sudetenland Disturbances"
 GEH_sudetenland_disturbances_hard:0 "Severe Sudetenland Disturbances"
 GEH_nazism_4_idea:0 "The Fourth Reich"
 GEH_nazism_4_idea_desc:0 "Digging through the ashes, the exiled army has once again set foot on the territory of the fatherland. Upon the ruins where everything collapsed, they declared a nation for Germans and announced that Germany has returned to this land.\n\nAnd until the day of complete German unification is achieved, the Wehrmacht will advance and advance again."
 GEH_nazism_5_idea: "The Fourth Reich: Multi-ethnic State"
 GEH_nazism_5_idea_desc: "Digging through the ashes, the exiled army has once again set foot on the territory of the fatherland. Upon the ruins where everything collapsed, they declared a nation for Germans and announced that Germany has returned to this land.\n\nHowever, the Germany that returned is not the Germany of the past. The existence of otherworldly strangers, the Kivotosians, has taught us a new path to power. Our Fourth Reich will not be a nation of a single ethnicity, but a multi-ethnic empire united under the German Eagle. Gehennans as Gehennans, Germans as Germans. Each will defend the fatherland in their own place, and this diversity, controlled by iron discipline, will be our new strength."
 GEH_nazism_6_idea: "The Fourth Reich: New German People"
 GEH_nazism_6_idea_desc: "Digging through the ashes, the exiled army has once again set foot on the territory of the fatherland. Upon the ruins where everything collapsed, they declared a nation for Germans and announced that Germany has returned to this land.\n\nBut the 'German people' we speak of are not the people of the past. The existence of otherworldly strangers, the Kivotosians, has made us redefine ourselves. The new German is defined not by bloodline, but by an iron will and absolute loyalty to the fatherland. Gehennans and Germans will melt into one in the furnace of a new era, reborn as a single, more resilient 'German People'."
 GEH_nazism_A41_idea: "World Germany"
 GEH_nazism_A41_idea_desc: "Extinguishing the flames in the ashes and rebuilding the ruins, a new dawn has broken. All German peoples have been integrated into one nation, and we are now a proud 'Germanic' state. Under the name of World Germany, our newly forged engine is roaring toward the world.\n\nWhile the 'German' identity was attempted in various states like the Baltic-Prussian state and Southern Austria in the past, we define it through iron will and loyalty to the fatherland. Gehennans and Germans will melt into one in the furnace of a new era, reborn as a single, more resilient 'German People'."
 GEH_nazism_A42_idea: "The Fourth Reich"
 GEH_nazism_A42_idea_desc: "Digging through the ashes, the exiled army has once again set foot on the territory of the fatherland. Upon the ruins where everything collapsed, they declared a nation for Germans and announced that Germany has returned to this land.\n\nWe will integrate all German peoples—Gehenna, Germanic, Frankish, Bavarian, South German, Austrian, and Luxembourger alike—into one, defined by the name 'Greater Germania'. A nation is leaping forward to scatter the whole world into ashes and paint anew upon them."
 GEM_two_nations_one_state_idea_deff: "Drafting Two Nations Act"
 GEM_two_nations_one_state_idea_deff_tt: "This national spirit is removed upon completion of the '§Y$GEM_two_nations_one_state$§!' focus."
 GEM_rolling_the_dice_idea_deff: "The Die is Cast."
 GEM_rolling_the_dice_idea_deff_tt: "This national spirit will be naturally removed through the resulting chain of events."
 GEM_two_nations_one_state_idea: "Horizontal Social Coalition"
 GEM_two_nations_one_state_idea_desc: "Children of the new generation will be educated and grow up in the same classrooms, naturally learning harmony, and cultural differences will gradually be resolved."
 GEH_nazism_alt_idea:0 "Politics of Two Factions"
 GEH_nazism_alt_idea_desc:0 "Finally, the politics of two factions facing each other proudly as one nation from two worlds has begun. Coexistence, cooperation, concession... good words, but they are not important right now. The two factions are holding hands toward a common goal. Once that goal is reached, the two factions will become inseparable.\n\nThus, the most hideous nation, born from the ideals of all, will continue to advance. For the intersection of ideals is not always beautiful."
 GEH_nazism_alt_1_B_1_idea:0 "Intersection of Two Worlds"
 GEH_nazism_alt_1_B_1_idea_desc:0 "Coexistence, cooperation, concession... those words that once sounded hollow have now found a strange place amidst the noise of the assembly. The faction centered around the old Pandemonium and the faction representing the voices of all Germanics. These two giant currents have now become institutionalized 'political parties' under the name of the state.\n\nTheir confrontation is no longer a destructive chaos. It is like two perfectly tuned pistons driving the massive machine of the state. Within this predictable struggle, the nation advances stably. The intersection of ideals was not beautiful, but in the end, the most stable form of a 'state' remained."
 GEH_nazism_alt_1_B_2_idea:0 "Factional Coalition"
 GEH_nazism_alt_1_B_2_idea_desc:0 "The great confrontation between the two factions is now a story of the past. Sharp voices have faded, and fierce struggle has been replaced by quiet cooperation. On the surface, it looks like an ideal coalition government, but behind it, an unseen hand is merely pressing down on the shoulders of the two giants side-by-side.\n\nThey no longer snarl at each other. Instead, they simply nod quietly toward the same direction. In this strange harmony, the nation no longer beats with two hearts. It merely advances to a single, inaudible pulse."
 GEH_nazism_alt_2_B_2_idea:0 "Nation of Two Worlds"
 GEH_nazism_alt_2_B_2_idea_desc:0 "The muzzles once aimed at each other now point in the same direction. This may be the result of a strange symbiosis for survival, or the product of noble ideals. Gehenna's chaos and Germany's order no longer negate each other but fill each other's gaps in a peculiar way.\n\nHere, there are no longer pure Gehennans nor whole Germans. There are only new citizens who have lost their past selves under the name of the 'Nation of Two Worlds'."
 GEH_nazism_alt_3_idea: "State of Two Worlds and Two Parties"
 GEH_nazism_alt_3_idea_desc: "Coexistence, cooperation, concession... those words that once sounded hollow have now taken a strange form amidst the noise of the assembly. The 'All-Gehenna People's Party' centered around the old Pandemonium and the 'National Socialist German Workers' Party' representing the voices of all Germanics. The confrontation between these two giant parties has now become the new heart driving this nation.\n\nThe intersection of ideals was not beautiful, but it gave birth to orderly struggle instead of hideous chaos. Upon this precarious balance, the nation of two peoples will continue to advance."
 GEH_nazism_alt_3B41_idea: "One Nation, Two Parties"
 GEH_nazism_alt_3B41_idea_desc: "Powerful ruling and opposition parties extensively integrate society, each weaving a grand narrative of their respective people's ambitions to create a nation that is incomplete yet powerful.\n\nOpposition is absorbed into both parties, and ethnic conflicts that would lead to civil war are sutured in parliament. These two parties for two worlds are not beautiful, but they are more passionate and fervent than anything else."
 GEH_nazism_alt_3B42_idea: "Neubolk Ethnic Coexistence"
 GEH_nazism_alt_3B42_idea_desc: "The coexistence and cooperation between the ruling coalition, including the All-Gehenna People's Party, and the opposition, including the German National People's Party, as well as a strong bond toward anti-fascism, are binding our people together.\n\nThe cultural affinity between Gehenna and Germania, the desire for a massive 'German-speaking' integration, and a brilliant vision for the future are the foundations that support everything from the lowest levels, making our entire society one."

