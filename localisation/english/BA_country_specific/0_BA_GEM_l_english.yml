l_english:

# # 이건 만마전의 의장 하누마 마코토의 대사 예시입니다.
# 드디어 강림하였도다! 키키킥, 판데모니움 소사이어티의 하누마 마코토 님이 직접 찾아와 주신 것이다. 극진히 환대하도록.
# 키키킥. 뭐, 좋아. 그럼 마코토 님의 위업 이야기를 시작하지.
# 늦었지 않나. 마침 키보토스 정복을 위한 획기적인 구상이 떠오른 참이다.
# 위업은 하룻밤 사이에 이루어지지 않는 법. 마코토 님은 절대로 포기하지 않을 테니 말이다.
# 이 몸의 연설을 똑똑히 듣도록!
# 키키킷! 쏴라! ...응? 거, 거꾸로라고!?
# 과연, 지도자의 극치에 이른 나에게도, 아직 성장의 여지가 있었다니. 키시싯!
# 이 분위기, 제법 괜찮지 않은가.
# 이로하 녀석을, 확실히 포획하려면……
# 게헨나 파티를 기념해, 특별히 개점한 상점이다. 맘껏 둘러보도록. 키킷.
#
#
# # 이건 만마전의 의원 겸 전차장 (그리고 실질 역할은 마코토 뒷바라지 및 비서)인 나츠메 이로하의 대사 예시입니다
# 하아, 어쩌다 이렇게 되어버린 걸까요. 뭐, 이렇게 된 이상, 해야 할 일은 하겠지만요.
# 하아, 뭔가요. 당번이라니⋯ 네네. 부탁받은 이상 열심히 하겠습니다.
# 후우⋯ 살짝 딴 데서 농땡이 부리지 않을래요?
# ⋯열심히 하고 있다구요?
# 귀찮지만⋯ 하아, 어쩔 수 없죠.
# 뭔가요. 해야 할 일은 다 끝내뒀는데요.
# 어쩐 일이신가요? 뭔가 부탁할 거라도?
# 하아, 그러니까, 초무적철갑 토라마루⋯ 출격합니다~
# 농땡이⋯⋯ 치게 내버려두지는 않을 것 같네요. 어쩔 수 없죠⋯
# 감사합니다⋯⋯ 뭔가요? 평범하게 감사인사 정도는 한다구요.
# 과연, 여기라면 들키지 않을 것 같네요.
# 이 푹신푹신한 방석, 가지런히 놓인 여러 간식들. 거기다 책과 게임까지 잔뜩.
# 후후, 제법 나쁘지 않은 곳이지요?
# 저만의, 제가 자랑하는 쉼터라구요. 어떠신가요?
# 그럼 공범도 있겠다. 늘 그랬듯이 오늘도 땡땡이 쳐볼까요?
# 슬슬 정리되는 느낌이지만⋯⋯ 부디 마지막까지 방심하지 마시길. 귀찮은 일은 질색인지라.
#
#
# # 이건 만마전의 마스코트 겸 최중요인물 탄가 이부키의 대사 예시입니다.
# 이부키, 얌전히 기다렸어! 칭찬해줘 칭찬!
# 이부키, 도와주러 왔어! 뭐하면 돼~? 그전에, 간식타임을 갖자고…? 응! 이부키도 그게 좋아!
# 사업비 집행 정산 내역서…… …라니, 무슨 의미……?
# 에헤헤, 이부키한테 할 말이 있어~?
# 응! 이부키도 도와줄게!
# 와아~ 이부키랑 놀아주는 거야~?
# 이부키가 지나간다~!
# 앗! 나쁜 사람이다!
# 다 같이 그림 그리자!
# 
# 
# # 이건 만마전의 정보부장 코교쿠 사츠키의 대사 예시입니다.
# 자아~ 기다렸지? 만마전의 정보부장, 쿄고쿠 사츠키야. 후후훗, 잘 부탁해.
# 쿄고쿠 사츠키, 만마전의 정보부장이야. 알고 있겠지만. 후훗.
# NK 울트라 계획에 흥미 있어?
# 자아, 나를 위해 힘내주렴.
# 어때? 강해진 것 같지?
# 만마전, 총공격이야!
# 으흥~ 이런 느낌? 나쁘지 않네.
# 헤에~ 내 생일도 기억해준 거야?
# 
# 
# # 이건 만마전의 서기 (겸 주간 만마전 기자) 모토미야 치아키의 대사 예시입니다.
# 호외요, 호외! 만마전의 서기, 모토미야 치아키가 찾아왔습니다~!
# 준비~! 땅!
# 취재 시작입니다!
# 기삿거리의 냄새가……. 아핫! 들켜버렸네요!
# 여기다가 <주간 만마전> 스탠드를 놓는다면…….
# 아, 이건 이부키 쨩이 좋아할 것 같네요~!
# 아하핫! 셔터 찬스, 잡았습니다!
# 후후! 서기의 행동력을 얕보면 안 되거든요!
# 앗, 제 생일이네요? 편집하느라 깜빡했습니다~! 아하하! 알려 주셔서 감사합니다!
# 다음 호에 쓸만한 사진, 건져볼까요~!
# 

 #게헨나
 GEM_country_intro_header: "자유와 혼돈의 학원"
 GEM_country_intro_content: "자유와 혼돈, 그리고 선도부와 만마전의 갈등, 제대로된 교칙 하나 없어 학생들의 등교 시간은 제멋대로고 학원은 별것도 아닌 것으로 폭탄테러를 일으키거나 동아리들 끼리 갈등을 일으키는 등 혼돈과 자유만이 가득할 뿐입니다.\n\n만마전과 선도부의 갈등은 언제부터였을까요? 어느새 그 갈등의 골은 깊어져 이제는 서로 돌아올 수 없는 길을 건너고 말았습니다. 만마전은 선도부의 예산을 깎기 위하여 여러 말도 안되는 걸 트집 잡아 예산을 깎아내리며, 선도부는 이러한 만마전을 끔찍하게도 싫어합니다. 이 갈등의 골은 언제쯤 매워질까요?\n\n키보토스가 이계로 오면서 게헨나에는 더욱 크나큰 혼돈이 찾아오기 시작하였습니다. 게헨나는 더욱 혼돈스럽습니다. 만마전은 모든 문제를 해결하기 위해 노력하고 있습니다. 하지만 북쪽에 국방군이라는 현지 무력집단이 존재하는 한 언제든지 우리는 삶의 위협을 받을수 있습니다.\n\n그러나 당신의 선택으로 위대한 게헨나의 위상을 다시 한번 일으킬 수 있을 것입니다.\n\n§Y개발 : SKSKle§!"
 GEM_guide: "£white_dot 비상 사태를 선언하고 동아리의 혼란을 해결하십시오.\n£white_dot 다가오는 폭풍에 대비하십시오.\n\n하누마 마코토의 독재\n\n£white_dot 국방군과의 협상을 성공적으로 마무리 지으십시오.\n£white_dot 선도부와의 내전에서 승리하십시오.\n\n만마전 개혁\n\n£white_dot 하누마 마코토를 실무에서 쫒아내십시오.\n£white_dot 만마전의 의견을 하나로 모으십시오.\n£white_dot 국방군의 저항을 끝내고 선도부와 관계를 복원하십시오.\n\n§R피로써 그 모든 것의 마침표를 지으십시오.§!"

