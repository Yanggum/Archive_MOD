 GEM_ibuki_system_action_1_icon_tt: "§t야망§!\n탄가 이부키의 야망입니다. 더 큰 꿈과 더 높은 목표 그리고 전쟁을 통한 과업 달성을 지향하는 정도이며, 자신의 원대한 계획을 따르도록 주위를 유도하는 선동가의 능력입니다.\n\n§g - 이 아이콘은 '리그 오브 레전드'에서 가져왔습니다.§!"
 GEM_ibuki_system_action_2_icon_tt: "§O위엄§!\n탄가 이부키의 위엄입니다. 권위와 권력 그리고 사람들에게 떠받들어지는 것을 지향하는 정도이며, 사람을 다루는 모략가의 능력입니다.\n\n§g - 이 아이콘은 '리그 오브 레전드'에서 가져왔습니다.§!"
 GEM_ibuki_system_action_3_icon_tt: "§1효율§!\n탄가 이부키의 효율입니다. 정리정돈과 효율적인 행정 그리고 목표 달성을 위한 냉철함을 지향하는 정도이며, 체제를 관리하는 행정가의 능력입니다.\n\n§g - 이 아이콘은 '리그 오브 레전드'에서 가져왔습니다.§!"
 GEM_ibuki_system_action_4_icon_tt: "§C이상§!\n탄가 이부키의 이상입니다. 내면의 꿈과 동화에 나오는 이상주의 그리고 갈등을 중재하고 화합을 유도하는 정도이며, 자신의 꿈을 따르도록 주위를 동화하는 몽상가의 능력입니다.\n\n§g - 이 아이콘은 '리그 오브 레전드'에서 가져왔습니다.§!"

