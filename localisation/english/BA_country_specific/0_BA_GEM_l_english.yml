 GEM_manifest_destiny: "Manifest Destiny"
 GEM_pax_gehenica: "Pax Gehennica"
 GEM_cross_the_strait: "Cross the Strait!"
 GEM_crossing_the_atlantic: "Across the Atlantic"
 GEM_crossing_the_atlantic_desc: "Having completely defeated all rivals on the continent and placed them under our rule, we must now once again focus on production for the birth of a massive navy, in order to crush the threats across the Atlantic and enforce our peace upon the entire world."
