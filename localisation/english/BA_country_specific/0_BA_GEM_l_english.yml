 gem_club_problem_gourmet_research_society_progress_point_1_tt: "§YGoodwill§! Level (§YFavor§! §G25§! or more):\n - Reaching the Goodwill level unlocks the §YInduce Praise for Gehenna Cuisine§! decision, which increases national stability.\n\nEffect upon reaching:\n£decision_icon_small §YUnlock Decision§!: Induce Praise for Gehenna Cuisine"

 gem_club_problem_hot_spring_department_progress_point_1_tt: "§YGoodwill§! Level (§YFavor§! §G25§! or more):\n - Reaching the Goodwill level unlocks the §YInduce Hot Spring Development§! decision, which increases construction speed in selected regions.\n\nEffect upon reaching:\n£decision_icon_small §YUnlock Decision§!: Induce Hot Spring Development in Hessen"

 gem_club_problem_gourmet_research_society_progress_point_2_tt: "§YCooperation§! Level (§YFavor§! §G55§! or more):\n - Reaching the Cooperation level allows the recruitment of the §YGourmet Research Society President§! as a political advisor.\n\nEffect upon reaching:\nAvailable as §YPolitical Advisor§!:\n'§YHaruna Kurodate§!' Effects:\n - Daily Political Power Gain §G+0.15§!\n - War Support: §G+10.00%§!\n - Annexation Cost: §G-15.0%§!\n - Justify War Goal Time: §G-15.0%§!\n - Resistance Target §G-10%§!"

 gem_club_problem_hot_spring_department_progress_point_2_tt: "§YCooperation§! Level (§YFavor§! §G55§! or more):\n - Reaching the Cooperation level allows the recruitment of the §YHot Spring Development Department President§! as a political advisor.\n\nEffect upon reaching:\nAvailable as §YPolitical Advisor§!:\n'§YKasumi Kinugawa§!' Effects:\n - §YInfrastructure§! Construction Speed §G+25.00%§!\n - §YMilitary Factory§! Construction Speed §G+5.00%§!\n - §YCivilian Factory§! Construction Speed §G+5.00%§!\n - §YDockyard§! Construction Speed §G+5.00%§!"

 gem_club_problem_gourmet_research_society_progress_point_3_tt: "§YUnification§! Level (§YFavor§! §G100§! or more):\n - Reaching the Unification level integrates the entire §YGourmet Research Society§! into the nation, and competing nations can no longer use the §YGourmet Research Society§!.\n\nEffect upon reaching:\n§YGourmet Research Society§!: Integrated into [ROOT.GetNameWithFlag]\nPermanent §YGourmet Research Society§! Effect Conversion:\n - Stability: §G+2.00%§!\n - Mobilizable Population Modifier: §G10%§!"

 gem_club_problem_hot_spring_department_progress_point_3_tt: "§YUnification§! Level (§YFavor§! §G100§! or more):\n - Reaching the Unification level integrates the entire §YHot Spring Development Department§! into the nation, and competing nations can no longer use the §YHot Spring Development Department§!.\n\nEffect upon reaching:\n§YHot Spring Development Department§!: Integrated into [ROOT.GetNameWithFlag]\nPermanent §YHot Spring Development Department§! Effect Conversion:\n - Stability: §G+2.00%§!\n - Construction Speed: §G10.00%§!"

