 GEM_focus_ended_1_B: "독일 헤게모니 합치"
 GEM_focus_ended_1_B_desc: "게헨나인과 독일인이 충돌하지 않고 살아가는 방법은 단 한가지, 독일인과 게헨나인의 생활권 확보해야만 합니다. 위대한 연립 정부의 이름 아래에 레벤스라움을 위한 계획이 진행될 것입니다!"
