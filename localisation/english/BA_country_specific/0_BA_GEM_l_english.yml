 GEM_an_invincible_army: "Invincible Gehenna Army"
 GEM_an_invincible_army_desc: "Through many accomplishments and victories, our army has learned much on the battlefield, and we have proven that the [ROOT.GetAdjective] army is indeed invincible, no matter what enemy agitators say!"
 GEM_an_invincible_army_trigger: "One of the following must be true:\n   Number of subjects greater than §Y5§!\n   Occupied states in §YEurope§! greater than §Y49§!"
 GEM_the_supreme_leader_trigger: "[ROOT.GetNameDefCap] has forced §Yat least 2 major countries§! to §Ysurrender§!"
 GEM_the_supreme_leader: "Supreme Leader"
 GEM_the_supreme_leader_desc: "Through directed reform and reconstruction programs, the loyalty of all Gehenna students to [ROOT.GetLeader] and his cause has reached a new level. This trend of full support for our leader and academy must continue."

 #### Focuses under the German Reich
 ############# Re-establishing the German Reich first
 GEM_focus_ended_AO: "State of the Reborn German People"
 GEM_focus_ended_AO_desc: "Gehenna Academy is no more. In order for Gehenna students and citizens to live fully in the new era, it was wise to establish the German Reich and enter into the institutional order of the pre-Great Transfer world.\n\n§OThe Eagle soars over the ashes!§!"
 GEM_peace_achievement: "Achievement of Pacification"
 GEM_peace_achievement_desc: "All former German territories have been integrated, and now Germany, the hegemon of Central Europe, has returned. We will leap forward once more toward the future of our people and nation!"
 GEM_union_of_affection: "Coalition of Affection. Somehow."
 GEM_union_of_affection_desc: "Trust is not built overnight. What we need now is not ideal harmony, but realistic coexistence. Through political agreements and shared goals, we will build a forced alliance that makes two factions that hate each other inevitably cooperate."
 GEM_to_not_lose_initiative: "To Not Lose the Initiative"
 GEM_to_not_lose_initiative_desc: "Just because we accepted their name doesn't mean we can hand over the initiative of founding this country. The core force playing the pivotal role in the new federal system must still be us. We must devise ways to suppress the challenges from German politicians and maintain governing power."
 GEM_fierce_political_propaganda: "Fierce Political Propaganda"
 GEM_fierce_political_propaganda_desc: "To make two peoples into one nation requires more than laws. Through massive propaganda activities mobilizing all newspapers, radios, and posters, we will carve a shared identity as 'New Germans' into everyone's hearts."
 GEM_two_nations_one_state: "Two Nations, One State"
 GEM_two_nations_one_state_desc: "Gehenna people and German people. Two peoples with different histories, cultures, and even physical structures. To demand common loyalty to one state while acknowledging these differences—this is the greatest difficulty and grand challenge facing our United States."
 GEM_rolling_the_dice: "Rolling the Dice"
 GEM_rolling_the_dice_desc: "Gradual integration is safe, but too slow. Sometimes a bold gamble is needed to move history forward. If successful, it will hasten true unification, but if it fails, this precarious peace will be shattered into pieces."
 GEM_leader_of_us: "The Leader of 'Us'"
 GEM_leader_of_us_desc: "Now, finally, I feel certain. This is what our leader should look like. Following the leadership of [ROOT.GetLeader], who has navigated all political storms. Let us move forward! Toward the future, for Gehenna... and for Germany!"
 GEM_redefinition_of_german_nation: "Redefinition of the German Nation"
 GEM_redefinition_of_german_nation_desc: "What is the 'German Nation'? We will break the old shackles of bloodline. We will be reborn as a new civic identity that encompasses all who swear to create the future of this land together. The distinction between Gehenna and German will disappear, and only 'New Germans' will exist."
 GEM_multiethnic_state: "Multi-ethnic State"
 GEM_multiethnic_state_desc: "The old-era delusion that only one ethnicity is great has brought tragedy to this land. Instead of forcing a single identity, we choose the path of respecting the unique culture and traditions of all ethnicities. Gehenna people as Gehenna people, Germans as Germans, will become equal citizens and achieve stronger harmony through diversity."
 ############# Makoto
 GEM_focus_ended_1_A: "Usurping German Hegemony"
 GEM_focus_ended_1_A_desc: "Germany's powerful hegemony is a great tool in itself, but it met the wrong master. We will drive out the inefficient existing ruling forces, usurp the powerful state system they built, and use it as a stepping stone for our great cause. From now on, Germany's power will be wielded by the most capable leader—namely, us."
 GEM_new_knot: "A New Question"
 GEM_new_knot_desc: "We are now the rulers of Germany, but we are not Germans. This clear contradiction is an instability that could shake the very foundations of the state. Then we must ask: What is a 'German'? Is it bloodline, or culture? Or is it the will of the strong who practically rule this land? We must find the answer to this new question."
 GEM_provable_problem: "A Provable Problem"
 GEM_provable_problem_desc: "The question 'What is a German' is no longer in the realm of philosophy. This is a problem we can define and prove. We will establish a system to prove the qualifications of 'New Germans' based on loyalty to the state, sympathy with our ideology, and contribution to the great cause."
 GEM_gordian: "The Gordian Knot"
 GEM_gordian_desc: "It is foolish to attempt to untangle the complexly intertwined debates of bloodline and history. A great leader cuts the knot instead of untying it. We will declare: We, who rule this land and pioneer the future, are the new definition of Germany, and our way is the German way. The debate is now over."
 GEM_successor_of_fuehrer_station: "Successor to the Führer's Post"
 GEM_successor_of_fuehrer_station_desc: "The position of Führer does not simply mean the supreme ruler of Germany. It is a position that symbolizes German hegemony itself. By Chairman Hanuma Makoto officially succeeding to the status of Führer, we will secure legitimacy as the rightful rulers of Germany, not as external usurpers, and concentrate all power in the Chairman."
 GEM_mini_gehenna_academy: "Little Gehenna Academy"
 GEM_mini_gehenna_academy_desc: "We have seized German hegemony, but the status of our home, Gehenna Academy, remains ambiguous. We will codify the legal status of Gehenna Academy within the German Reich and redesign its role. The Student Council President will now hold the concurrent post of the official representative delegation for the Gehenna community within Germany. This is the first step toward effectively governing and managing them within our new order."
 GEM_broader_german: "Broader Germans"
 GEM_broader_german_desc: "Now, the definition of 'German' breaks free from the yoke of bloodline. All who accept our new standards and education, swear loyalty to the Führer, and join the great cause will obtain equal status as 'Germans in a broader sense.' This is an effective way to strengthen the internal cohesion of the state and absorb potential resistance forces."
 GEM_gehenna_liberalism_forced_implantation: "Forced Implantation of Gehenna Culture"
 GEM_gehenna_liberalism_forced_implantation_desc: "Establishing something like 'Little Gehenna Academy' within Germany is merely a passive compromise. We will go further and make the whole of Germany a giant Gehenna. We will dismantle the old culture of this land and forcibly implant our way under the name of 'Gehenna's Freedom.' Now Germans will find their new identity not in their order, but in our great chaos."
 GEM_cultural_hegemony_rule: "Order of Cultural Hegemony"
 GEM_cultural_hegemony_rule_desc: "A new bill is being prepared to completely redefine the definition of 'German.' We will completely seize the cultural hegemony of this land and enforce our order. The old legal system of Germany will be discarded, and only our governing ideology and pluralistic thoughts will be implanted. All culture and thought will now serve as tools to solidify our rule."
 GEM_hanuma_makoto_constitution: "Hanuma Makoto Constitution"
 GEM_hanuma_makoto_constitution_desc: "To end all debates and eternally establish a new order, we enact the 'Hanuma Makoto Constitution.' This constitution will define the Führer's absolute authority, the definition of New Germans, and the great goals of the state as immutable laws. This will be the eternal foundation of the Germany we have recreated, the new Empire."
 GEM_back_to_1933: "Back to 1933"
 GEM_back_to_1933_desc: "Remodeling German hegemony has proven to be an all-consuming task. Hanuma Makoto will now put her grand ambitions on hold for a moment; instead, we will choose stability by silencing their complaints through restoring the 'old order' from before 1933. A great leader sometimes knows how to take a step back. Now our interest will return to more essential matters, such as restoring relationships with estranged Pandemonium executives, rather than complex state management."
 ############# Satsuki
 GEM_focus_ended_2_A: "Establishment of the Ministry of Public Enlightenment"
 GEM_focus_ended_2_A_desc: "We have brought peace to Gehenna in our way, but this is only the beginning. Now there remains the vast German territory and its people under our influence. We must establish an organ to solidify the order of the new era. The 'Ministry of Public Enlightenment' will take on the mission of spreading our ideals throughout Germany and unifying the divided hearts of the people. By controlling all media, reforming education, and instilling unified values, we will lay the foundation for a truly stable and harmonious nation."
 GEM_populism_flow_framework: "Framing the Flow of Populism"
 GEM_populism_flow_framework_desc: "The emotions of the masses, namely populism, are like a giant river. If you try to block it, the dam will burst and sweep everything away, but if you open a watercourse and guide its direction, you can create fertile land. Internal discontent will be directed toward external imaginary enemies, and scattered loyalties will head toward a single symbol: the State. The masses will feel like the protagonists of the era themselves, but even the slogans they shout and their enthusiasm are nothing more than gears moving within our sophisticated blueprint."
 GEM_germany_gehenna_hegemony_integration: "German-Gehenna Hegemony Integration"
 GEM_germany_gehenna_hegemony_integration_desc: "Two peoples, one state. The sense of heterogeneity between those from Kivotos and the German natives is the most fundamental crack threatening our system. Simple control alone cannot bridge this gap; we must melt the identities of both groups into a single furnace. We will make the old distinction between 'Gehenna' and 'Germany' meaningless. When everyone finally considers themselves citizens of a new nation, our hegemony will be set on a rock."
 GEM_sovereign_of_the_people: "Sovereign of the People"
 GEM_sovereign_of_the_people_desc: "The state is no longer a governing body separate from the people. It is the perfect manifestation of the collective will of the people, and I am the single vertex that coordinates and leads that will. Having integrated Gehenna and Germany and seized even the ideological flow of the masses, I have become the true sovereign by becoming not a bloodline or authority, but the 'Order' and 'Peace' that everyone craves. To monitor internal and external impure movements threatening this new harmony, our eyes and ears must reach wider and deeper."
 GEM_secret_leadership_and_popular_suffrage: "Secret Leadership and Popular Suffrage"
 GEM_secret_leadership_and_popular_suffrage_desc: "Perhaps complete control is not the only answer. Granting the people the freedom of choice, but controlling the results of those choices—that is the most stable and sophisticated way of ruling. We will introduce an electoral system where the people directly elect representatives. They will freely debate, vote, and believe their will is reflected in politics. But their freedom will only be allowed within the most beautiful birdcage we have designed."
 idea_GEM_secret_leadership_and_popular_suffrage: "Curtain Politics"
 idea_GEM_secret_leadership_and_popular_suffrage_desc: "In order to democratize and operate the NK-Ultra procedures, a secret council of leaders elected through freedom of thought must be organized. Thus, this state encourages power struggles between various institutions to organize and check the brainwashing departments, and operates secret procedures.\n\nThe general public will never know this fact. Ever."
 idea_GEM_anti_state_activist_arrest: "Mopping Up Anti-State Terrorists"
 GEM_state_religion_nation: "State Religion Nation"
 GEM_state_religion_nation_desc: "Political systems change with the times, but faith lasts forever. To make the peace we have achieved into a thousand-year empire, we must elevate our ideology to the level of religion. As a 'Goddess' who brought order from chaos, I will now be not a simple leader, but the High Priestess of a new era. The principles of 'NK-Ultra' will become our doctrine, and state institutions will become temples. Those who go against our path will no longer be judged as political prisoners, but as heretics who commit sacrilege."
 GEM_emperor_of_all_germany: "Emperor of All Germany"
 GEM_emperor_of_all_germany_desc: "To effectively rule all Germans and expand the NK-Ultra system, I will now be crowned as the 'Kaiserin' of a new German Empire, rather than a mere leader. My will is law, and my belief is history. All German political forces will be integrated, and opposition to NK-Ultra will be eliminated. Soon, only my rule will remain."
 GEM_reconciliation_of_all_peoples: "Reconciliation of All Peoples"
 GEM_reconciliation_of_all_peoples_desc: "Our system is established, but we have not yet fully won the hearts of all people. Now we will begin a massive project to heal old wounds and achieve true national harmony. We will demolish monuments symbolizing past divisions and erect new symbols of unity. Through social programs where everyone, regardless of class or background, gets equal opportunities, we will make everyone in this land feel they are proud members of the nation."
 GEM_internationalism_nk_ultra: "Internationalist NK-Ultra"
 GEM_internationalism_nk_ultra_desc: "The virus of chaos and conflict that once sickened Gehenna still rages in the world beyond the borders. As long as the surrounding world is on fire, our peace can never be complete. The principles of 'NK-Ultra' are not a prescription for a single nation. They are a gospel of salvation for all of humanity. Now it is time for us to export our 'Peace.' We will begin a quiet and secret crusade by dispatching secret agents and spreading our ideology, until the day the whole world becomes one under our order."
 GEM_closed_curve_parliament: "Closed Curve Parliament"
 GEM_closed_curve_parliament_desc: "Finally, our governing system has taken its final form. It is the 'Closed Curve Parliament,' a perfect self-contained system unshaken by external variables. All decisions are made within a predictable range, and all actions serve the harmony of the whole. Guided by an invisible hand, the giant machine of the state will now operate without a single error. The designer of peace has completed her masterpiece and solidified her role as the eternal guardian of its structure."
 ############# Iroha
 GEM_focus_ended_3_A: "German Federal Constitution"
 GEM_focus_ended_3_A_desc: "We reject both the tyranny of the Empire and the chaos of Kivotos. We will build a new nation upon the dream of our ancestors from 1848, which was failed but great. It is the first step toward a unified, free republic for all Germans."
 GEM_restore_german_federal_territories: "Recover German Federal Territories"
 GEM_restore_german_federal_territories_desc: "The rightful borders of the German Federation envisioned by the Frankfurt Parliament have not yet been restored. Our historical mission is to reclaim all scattered German-speaking territories and unify them under one great Federation."
 GEM_new_federalist_constitution_of_freedom: "New Federalist Constitution of Freedom"
 GEM_new_federalist_constitution_of_freedom_desc: "Our new constitution will be a monument to freedom. To ensure that past dictatorships never set foot in this land again, we guarantee the basic rights of the people and codify the separation of powers to lay the foundation for an unshakable democracy."
 GEM_respect_rights_of_states: "Respect for State Rights"
 GEM_respect_rights_of_states_desc: "Unification should not mean centralization. From Bavaria to Schleswig-Holstein, we will achieve unity in diversity through a true federal system that respects the unique traditions and autonomy of each state."
 GEM_master_of_central_europe: "Master of Central Europe"
 GEM_master_of_central_europe_desc: "A free and unified Germany has a greater mission. We must go beyond simply existing and become the leading nation that drives the order of Central Europe. We will seize hegemony in this region through our strength and ideals."
 GEM_introduce_socialist_economy: "Introduce Socialist Economy"
 GEM_introduce_socialist_economy_desc: "Political freedom is an empty slogan without economic equality. Inheriting the revolutionary spirit of 1848, we will introduce socialist economic policies that protect workers and redistribute wealth to provide fair opportunities to everyone."
 GEM_most_advanced_german_federation: "Maximally Advanced German Federation"
 GEM_most_advanced_german_federation_desc: "Our Federation will be a model for the world. By combining democratic freedom and socialist equality, we will build the most advanced and just society in history and become a beacon of hope for oppressed people all over the world."
 GEM_greater_german_federation: "Greater German Federation"
 GEM_greater_german_federation_desc: "The dream of 1848 has finally become a reality. All Germans enjoy freedom under a single flag, and the divided fatherland has been reborn in its complete form. This is the Greater German Federation our ancestors shed blood to achieve."
 GEM_fortress_of_progress: "Fortress of Progress"
 GEM_fortress_of_progress_desc: "Our progressive ideals pose a threat to the old powers surrounding us. To protect the achievements of the revolution, the Federation must become a solid 'Fortress of Progress' that does not yield to any external pressure."
 GEM_federal_parliament_including_all_political_forces: "Federal Parliament Including All Political Forces"
 GEM_federal_parliament_including_all_political_forces_desc: "We do not fear opposing views like the dictators of the past. By forming a Federal Parliament where all democratic political forces, from conservatives to progressives, participate equally, we will shape the future of the nation through debate and compromise."
 ############# Chiaki
 GEM_focus_ended_4_A: "Party Unification Act Enacted"
 GEM_focus_ended_4_A_desc: "The proliferation of political parties is merely noise hindering efficient national operation. Secretary Motomiya Chiaki has enacted the 'Party Unification Act' to unify the editorial direction of the vast page that is the nation. This is not a dictatorship, but an essential 'edit' to deliver the grand vision with the utmost clarity. Now, the noise will vanish, and only disciplined execution will remain."

 GEM_german_nation: "Declaration of the 'German Nation'"
 GEM_german_nation_desc: "Defining Germans by bloodline and custom is far too archaic. Secretary Chiaki has prepared a historic declaration to 'redefine' the concept of the nation amidst a chaotic political climate. Now, the 'German Nation' signifies not blood, but all those who conform to the new order of this land and work hard under Secretary Chiaki's direction. This will not be the abandonment of old nationalism, but a scoop that will shake the era."

 GEM_german_unification_inheriting_the_will: "German Unification Inheriting the Will"
 GEM_german_unification_inheriting_the_will_desc: "The vast history and potential of Germany are assets too precious to be discarded carelessly. Secretary Chiaki has chosen 'succession'—layering Gehenna's leadership over German tradition instead of tearing it down. We will respect the pride of the Germans while Gehenna holds the steering wheel, refining the bestseller manuscript that is Germany into something even more perfect."

 GEM_german_and_germanic_separation: "Separation of German and Germanic"
 GEM_german_and_germanic_separation_desc: "The biological shackles of 'Germanic' are hindering the development of the nation. Secretary Chiaki has undertaken a bold experiment to separate 'biological Germanic' from 'political German citizens.' Now, what proves a citizen's qualification is not the blood of ancestors, but loyalty to the constitution. This radical edit will turn countless outsiders into our most ardent supporters."

 GEM_academy_state_boundary_adjustment: "Academy-State Boundary Adjustment"
 GEM_academy_state_boundary_adjustment_desc: "The mixture of academy autonomy and state sovereignty causes administrative inefficiency. With her characteristic decisiveness, Secretary Chiaki has begun 'layout organization' to clearly redefine the boundaries between academies and the state. Academies will focus on education and autonomy, while the state functions as the higher governing body, allowing us to secure both free-spiritedness and systematic administration simultaneously."

 GEM_anti_state_activist_arrest: "Arrest of Anti-State Activists"
 GEM_anti_state_activist_arrest_desc: "Now that the nation's grand direction has been decided, agitators who leave the ranks over minor grievances can no longer be tolerated. Secretary Chiaki has ordered an extensive 'correction work' against anti-state elements who disrupt social stability. Like erasing a typo that irritates a reader's eyes, we will swiftly and accurately remove the discord throughout society."

 GEM_chiaki_constitution: "Chiaki Constitution"
 GEM_chiaki_constitution_desc: "The supreme law of the nation should not be a copy of old customary laws or foreign models. Secretary Motomiya Chiaki has unveiled the draft of the 'Chiaki Constitution,' which synthesizes her governing philosophy. Prioritizing efficiency, prosperity, and the happiness of the masses, this constitution is the perfect guideline for the future of Gehenna-Germany, simplifying complex procedures and guaranteeing the leader's decisiveness."

 GEM_small_gehenna_academy: "Small Gehenna Academy"
 GEM_small_gehenna_academy_desc: "If Gehenna Academy grows too large, our identity will instead be diluted. Secretary Chiaki has decided to keep Gehenna as a small elite group, a 'Small Gehenna.' This dual structure, where Germany's vast population and industrial power serve as the body and Gehenna serves as the brain directing them, is the most efficient governance model."

 GEM_better_integration: "Better Integration"
 GEM_better_integration_desc: "True integration is completed when boundaries are broken and people blend as one. Secretary Chiaki has launched the 'Great Integration Project,' where Gehenna students, German citizens, and various ethnic minorities fuse in all aspects of life. The unpredictable synergy created by those from different backgrounds will be the most powerful weapon that differentiates our nation from the stagnant states of the old era."

 GEM_greater_german_reich: "Greater German Reich"
 GEM_greater_german_reich_desc: "Finally, the 'Greater German Reich (Großdeutsches Reich),' a massive feat that will grace the pages of history, has been proclaimed. This new empire, combining Gehenna's rational elitism with Germany's potential, is more efficient and powerful than any state in the past. Under the direction of 'Small Gehenna,' this giant industrial nation, moving in perfect order, will demonstrate our overwhelming status to the entire world."

 GEM_german_social_republic: "Social Republic Plan"
 GEM_german_social_republic_desc: "The destination reached by Secretary Chiaki's governing philosophy was not cold dictatorship, but a warm community where everyone can smile. The establishment of the 'German Social Republic' is the strongest promise that the state will take responsibility for the lives of its people. Chiaki's unique, unconventional distribution policies and flexible compromises will heal the conflicts between classes and ethnicities, creating the most stable and happy 'happy ending.'"

 GEM_german_peoples_republic: "German People's Republic"
 GEM_german_peoples_republic_desc: "We have abolished old authority and blood-based logic to build an equal society under the name of the 'People.' The 'German People's Republic' is the culmination of Secretary Chiaki's radical egalitarianism and sensational reforms. The dismantling of the establishment, unconventional mass mobilization, and continuous national events will turn this country into a furnace of unceasing revolution."

 GEM_manmajeon_chairmanship_separation: "Separation of Pandemonium Chairmanship"
 GEM_manmajeon_chairmanship_separation_desc: "As her duties as head of state have become significant, Motomiya Chiaki can no longer be bound by the title of 'Gehenna Student Council President.' Consequently, she has decided to boldly separate the Pandemonium Chairmanship from the national leadership, sprinting toward the grand scoop of 'National Management' on a wider stage. Starting from the position of Secretary and rising to the pinnacle of the nation, her journey now enters a new phase."

 GEM_german_A4_right: "A Unified Tomorrow"
 GEM_german_A4_left: "The People's Choice"
 GEM_german_A4_tooltip: "The focus tree will change depending on whether you completed §g§Y$GEM_greater_german_reich$§!, §Y$GEM_german_social_republic$§!, or §Y$GEM_german_peoples_republic$§!.§!"
 GEM_german_A4_tt: "This focus will change to a complete focus tree upon the completion of one of the following: §Y$GEM_greater_german_reich$§!, §Y$GEM_german_social_republic$§!, or §Y$GEM_german_peoples_republic$§!."

 GEM_german_A41_right: "Reactivate the German Labor Front"
 GEM_german_A41_left: "German Homeland Defense Battalion"

 GEM_german_A42_right: "Giant Corporations and Mega Banks"
 GEM_german_A42_left: "Cooperative Social Coalition"

 GEM_german_A43_right: "Corporate Participation in Government"
 GEM_german_A43_left: "Nationalization of All German Enterprises"

 GEH_germany_gehennea_militia_1: "German Homeland Defense Battalion"
 GEH_germany_gehennea_militia_1_desc: "Consisting of industrial service corps and anti-capitalist militias, the Homeland Defense Battalion stands by the people to protect the nation and assist at industrial sites."
 #### Focus under the Gehenna-German Federation
 GEM_focus_ended_BO: "Strengthening Factional Politics"
 GEM_focus_ended_BO_desc: "One nation, two hearts. To maintain the precarious peace of the Federation, we have chosen realistic coexistence instead of ideal integration. We will recognize powerful factions representing their respective identities and open a new era of national operation through their competition."
 GEM_new_people_of_new_regime: "New People of the New Regime"
 GEM_new_people_of_new_regime_desc: "Neither Gehennan nor old German. We define the concept of the new 'Federal People' who hold equal rights and duties under the laws of the Federation. This is not about replacing old identities, but about layering a new national loyalty over them."
 GEM_gehenna_ruling_party_formation: "Formation of the Gehenna Ruling Party"
 GEM_gehenna_ruling_party_formation_desc: "The old Pandemonium system, which was a collection of numerous clubs and interest groups, is too disorderly to lead a modern state. We will consolidate all Gehenna-affiliated forces to create a powerful, disciplined, single ruling party: the 'All-Gehenna People's Party'."
 GEM_push_reform_beyond: "Push Reform Beyond!"
 GEM_push_reform_beyond_desc: "The power of the new ruling party must be used for change. We will trigger a wave of Kivotos-style administrative efficiency and social reform across the Federation, breaking old German customs and leading the nation into the next era."
 GEM_anton_drexler_rehabilitation: "Rehabilitation of Anton Drexler"
 GEM_anton_drexler_rehabilitation_desc: "The German party of the new era must escape the ghosts of the past. Instead of the symbol of Hitler, we will re-examine the conservative nationalism of the party's founder, Anton Drexler, to redefine our ideological roots and embrace a more moderate support base."
 GEM_in_the_name_of_the_fuehrer: "In the Name of the Führer"
 GEM_in_the_name_of_the_fuehrer_desc: "Führer. That name is both glory and a scar. We will not be bound by the madness of the past. Instead, we will re-examine the legacy of strong nationalism and anti-communism he left behind, using it as a powerful ideological weapon to unite the German people in these chaotic times."
 GEM_in_the_name_of_all_germany: "In the Name of All Germany"
 GEM_in_the_name_of_all_germany_desc: "Our nemesis Trinity has been brought to its knees. Through this great victory, we have finally overcome division and achieved a truly united Germany. Now, our cause is no longer limited to a specific leader or the legacy of the past. It is the name of 'All Germany' itself that has triumphed, and we will use this glory to shake the world with the power of a unified nation."
 GEM_the_more_things_change: "The More Things Change,"
 GEM_the_more_things_change_desc: "A new constitution, a new party, a new people. Everything about the nation has changed. We are no longer simply occupying forces and an occupied nation, but equal political partners competing within a single system."
 GEM_the_more_they_stay_the_same: "The More They Stay the Same."
 GEM_the_more_they_stay_the_same_desc: "But even though everything has changed, some things remain the same. The minor delinquencies of Gehenna students and the culture of the Germans persist. Thus, we are still Germany, and we are still Gehenna. But now, we are so under one nation. All conflicts will be contained within the parliament."
 GEM_two_party_state: "A State of Two Parties"
 GEM_two_party_state_desc: "The new order has finally been completed. A Gehenna ruling party and a German opposition party. A two-party system where two massive forces check and compete with each other to lead the nation. This is the final form of our unstable yet dynamic Federation."
 ############# Makoto
 GEM_focus_ended_1_B: "Merging German Hegemony"
 GEM_focus_ended_1_B_desc: "There is only one way for Gehennans and Germans to live without conflict: we must secure Lebensraum for both. Under the name of a grand coalition government, plans for Lebensraum will proceed!"
 GEM_germania_grand_coalition: "Germania Grand Coalition"
 GEM_germania_grand_coalition_desc: "Binding two disparate peoples into one nation is no easy task. We must establish a grand coalition system involving German political forces and Gehenna's Pandemonium to secure the political stability of the Federation and establish a unified administrative system. This is the beginning of a new Germania."
 GEM_nazi_party_dissolution: "Expulsion of the Nazi Party"
 GEM_nazi_party_dissolution_desc: "To complete the state of two worlds, hardline nationalist forces must be destroyed. They helped us greatly in forming our federal government, and they might have continued to do so, but not anymore. We will gather small German political forces to form a coalition government, arrest hardline nationalists en masse, dissolve the NSDAP, and absorb them ourselves."
 GEM_german_nationalism_reformation: "Reformation of German Nationalism"
 GEM_german_nationalism_reformation_desc: "We must restructure the category of German to include a broader range of federal citizens. In this process, ethnic minorities who were marginalized in the past, individuals from other countries, or those from Trinity will be encouraged to participate in politics on a large scale."
 GEM_silent_state: "The Silent State"
 GEM_silent_state_desc: "There are internal and external voices opposing the birth of the new Federation. We must root out all subversive elements threatening the stability of the state and silence the opposition through a powerful intelligence agency. The Federation's great undertaking must proceed without a single tremor, and for that, complete internal control must come first."
 GEM_lebensraum_of_two_nations: "Lebensraum of Two Nations"
 GEM_lebensraum_of_two_nations_desc: "Our current territory is far too narrow to realize the infinite potential of our Federation. We need additional space to provide industry and farmland for the German people and new areas of activity and resources for the Gehenna people. Now is the time to expand our rightful Lebensraum for the survival and future prosperity of the Federation."
 GEM_trinity_colonization: "Colonization of Trinity"
 GEM_trinity_colonization_desc: "Trinity, which stands at the opposite end of our ideology, is both the biggest obstacle to the Federation's expansion and its most tempting fruit. We will incorporate their territory as our colony to secure abundant resources and transplant the Federation's superior system to pioneer a new home for the Gehenna people."
 GEM_south_germany_unification: "South German Unification"
 GEM_south_germany_unification_desc: "Austrian compatriots who share the same blood and language remain outside the Federation's fence. We can no longer stand by and watch a divided history. Unifying all Germanic peoples under one flag is our historical task, and it will make the Federation's power even more formidable."
 GEM_outer_gehenna_unification: "Outer Gehenna Unification"
 GEM_outer_gehenna_unification_desc: "The Luxembourg region, which has escaped the Federation's control, is settled by Gehennans and led by a Gehennan student, so it should naturally be incorporated into the Federation."
 GEM_achievement_of_two_nations_utopia: "Achieving the Two Nations' Utopia"
 GEM_achievement_of_two_nations_utopia_desc: "Finally, our great work has been achieved. The Federation has overcome all internal and external threats and built a utopia where two nations coexist harmoniously within their respective living spheres and enjoy eternal prosperity. The name of the Germania-Gehenna Federation will shine long in history; a new era has begun."
 GEM_gehenna_federation_establishment: "Establishment of the Greater Gehenna Federation"
 GEM_gehenna_federation_establishment_desc: "Hanuma Makoto's final plan finally comes to a close. The Federation has crushed all internal and external threats and built a new order where numerous ethnicities coexist harmoniously, each with their own rights. The name of the Greater Gehenna Federation will shine long in history; a new era has begun."
 ############# Satsuki
 GEM_focus_ended_2_B: "Establishment of the Ministry of Truth"
 GEM_focus_ended_2_B_desc: "The truth has been revealed. But neglected truth is just another name for chaos. To prevent past wounds from dividing us again, we now need to 'manage' the truth. The 'Ministry of Truth' does not conceal facts. Fufu, it simply guides all citizens to 'understand' the past correctly and move toward better harmony. It is the most honest first step toward rebuilding trust."
 GEM_realistic_cooperativism: "Realistic Cooperativism" 
 GEM_realistic_cooperativism_desc: "Gehennans and Germans. Trying to force two nations with different histories and identities into one is inefficient and will only cause backlash. The realistic path begins with acknowledging their differences. We will design a perfect system where the two factions must respect, check, and coexist with each other. Cooperation will not be an option, but the only way to survive."
 GEM_suppression_of_radical_parties: "Suppression of Radical Parties" 
 GEM_suppression_of_radical_parties_desc: "The ones threatening the delicate balance we've designed are not outsiders, but the extremists within. Neither Gehennan purists nor Aryan fanatics have a place in our harmonious society. In the name of peace, we will quietly and thoroughly remove these seeds of conflict. It is merely inevitable pruning for the stability of society."
 GEM_establishment_of_two_party_system: "Establishment of a Two-Party Structure" 
 GEM_establishment_of_two_party_system_desc: "Suppressing all voices is a foolish thing to do. Instead, we can just create a safe waterway for those voices to flow through. We will establish two official parties representing the interests of Gehenna and Germany respectively. They will compete healthily within set rules and serve as a vent for public dissatisfaction. Of course, I am the one who sets those rules. Fufu."
 GEM_gradual_abolition_of_nk_ultra: "Gradual Abolition of NK-Ultra" 
 GEM_gradual_abolition_of_nk_ultra_desc: "The system has stabilized. People have begun to learn how to maintain harmony on their own. If so, there's no need for me to hold their hands and lead them forever. I will gradually remove the support device called 'NK-Ultra,' giving them a chance to prove they have chosen peace of their own will. This is the final 'faith' I send to them."
 GEM_leader_standing_on_two_feet: "A Leader Standing on Two Feet" 
 GEM_leader_standing_on_two_feet_desc: "The guide behind the curtain is no longer needed. Now that the system has started to work on its own, I too will step out from the shadows and stand before the people as a 'leader.' No longer manipulating with an invisible hand, but leading the nation based on their trust. That is the final step in proving the peace I have achieved is true."
 GEM_opposition_control_and_great_leader: "Opposition Control and the Great Leader" 
 GEM_opposition_control_and_great_leader_desc: "Democracy is the most efficient stabilization device. That is, only when it is perfectly controlled. Instead of oppressing the opposition, we will 'guide' its leadership. They will always seem to oppose fiercely, but in the end, they will always choose a 'wise compromise' for the sake of the nation's cause. Watching that process, the people will come to trust me as a great leader who overcomes crises."
 GEM_your_fatherland: "Your Fatherland" 
 GEM_your_fatherland_desc: "They may believe they are fighting for their respective parties, but in fact, they are just part of this massive play, strengthening their sense of belonging to the nation. This country is no longer mine alone. Only when Gehennans and Germans alike believe it is 'their fatherland' and try to protect it, will my rule finally be complete."
 GEM_leap_toward_the_ideal_of_unification: "Leap Toward the Ideal of Unification" 
 GEM_leap_toward_the_ideal_of_unification_desc: "As long as two factions coexist, the sparks of conflict will never truly go out. For true peace, we must break down the old boundaries of Gehennan and German themselves. We will fuse only the strengths of the two nations to create a new integrated nation, 'Germanic-Gehennan,' which is not bound by the past. This is not simple harmony, but a leap toward a new humanity."
 GEM_pioneers_of_the_fatherland: "Pioneers of the Fatherland" 
 GEM_pioneers_of_the_fatherland_desc: "A new nation needs new heroes. Figures from the past are merely symbols of division. We will rediscover figures who realized the values of 'unification' and 'pioneering' in the histories of Gehenna and Germany, elevating them to 'Pioneers of the Fatherland' to serve as the core of a new national identity. The future depends on how we edit the past."
 GEM_breaking_down_boundaries: "Breaking Down Boundaries" 
 GEM_breaking_down_boundaries_desc: "Language, culture, lifestyle... We systematically remove all barriers dividing the two nations. We will mandate integrated education, encourage new festivals where the two cultures naturally blend, and even rearrange residential areas. Over time, they will even forget the fact that they were once different peoples."
 GEM_one_party_collective_leadership_system: "One-Party Collective Leadership System" 
 GEM_one_party_collective_leadership_system_desc: "Only one party is needed for a single unified nation. Within this one party, various factions exist and can freely express their opinions. However, once a decision is made, the party moves with one will. NK-Ultra technology is now merely used as an auxiliary tool to help this collective leadership always reach the 'most harmonious' conclusion."
 GEM_diversified_ideology_and_unified_rule: "Diversified Ideology and Unified Rule" 
 GEM_diversified_ideology_and_unified_rule_desc: "Look. Within the party, countless ideologies are being discussed freely. However, the state is always governed consistently and stably. we have found the most ideal balance point of guaranteeing individual ideological freedom while maintaining the unity of the entire nation. This is truly an advanced democracy in its true sense."
 GEM_one_leader: "One Leader" 
 GEM_one_leader_desc: "In one system, one nation, there must be only one leader. All thoughts and all wills must originate from me. The people will think through me, feel through me, and become one through me. I am no longer a ruler. I am the nation itself."
 GEM_unification_of_state_departments: "Unification of State Departments" 
 GEM_unification_of_state_departments_desc: "Fufu, existing department names are too complex and... old. 'Intelligence Department,' 'Disciplinary Committee'... they are all just remnants of the past. I will elevate the Ministry of Truth to the 'Ministry of Verity' and leave only four departments necessary for the nation. The 'Ministry of Peace' to maintain peace through war, the 'Ministry of Love' to manage thoughts and affection, and the 'Ministry of Plenty' to distribute controlled abundance. These four pillars will be the most perfect form of the state, executing my will without error and ensuring eternal stability."
 GEM_national_renovation: "National Renovation" 
 GEM_national_renovation_desc: "Gehenna and Trinity. All remnants of the old era have been cleared. Now our new integrated nation no longer needs to be bound by the names of the past. We renovate the nation under the name of the 'Greater Gehenna Federation,' a great federation encompassing Gehenna, Germany, and all conquered territories. This is a proclamation announcing the true beginning of a new era."
 GEM_yet_the_dawn_rises: "Yet the Dawn Rises" 
 GEM_yet_the_dawn_rises_desc: "The darkness of the past was deep. But look. Two suns are coexisting, shining on each other. Though not perfect, we have finally found harmony within conflict. On top of this precarious peace, we will build tomorrow. Yes, despite many mistakes... still, the dawn rises."
 GEM_nation_seeking_future: "A Nation Seeking the Future" 
 GEM_nation_seeking_future_desc: "All boundaries of the past have vanished. We now move toward one future as one nation. Passing through a long, dark tunnel, we have finally found the light. No one knows what kind of future this new nation will face, but one thing is certain. We will no longer be bound by the past, looking only toward the future."
 ############# Iroha
 GEM_focus_ended_3_B: "Constitution of the United Federation of Germany-Gehenna"
 GEM_focus_ended_3_B_desc: "A federation of two nations and a union of numerous states. We have built a new hope upon instability. Therefore, we must not stop yet. The United Federation requires more reform and will be the only key card to fuse the two nations of Gehenna and Germany."
 GEM_rise_of_gehenna_party: "Rise of Gehenna-Affiliated Parties"
 GEM_rise_of_gehenna_party_desc: "Under the federal system, the old political structures of Pandemonium and the Disciplinary Committee are no longer valid. To negotiate and compete on equal footing with German-affiliated parties, new parties representing the political will of Gehennans must be created."
 GEM_two_factions_one_system: "Two Factions, One System"
 GEM_two_factions_one_system_desc: "Germans and Gehennans. Two very different peoples have stood under one flag. To prevent the Federation from collapsing into civil war, an unstable political framework where parties from both sides recognize and coexist with each other must be established."
 GEM_activate_coalition: "Activate Coalition"
 GEM_activate_coalition_desc: "Establishing a political framework alone is not enough. Now, practical cooperation is needed. We will take the first step toward integration by activating coalition governments where German and Gehenna parties form a government together in each state legislature and the federal parliament."
 GEM_equal_conscription_law: "Equal Conscription Law"
 GEM_equal_conscription_law_desc: "The duty of national defense must not be placed on only one specific ethnic group. By imposing equal conscription duties on both Germans and Gehennans, we will share the identity of 'United Federation Citizens' through blood in a true sense."
 GEM_establish_bereaved_family_compensation_system: "Establish Bereaved Family Compensation System"
 GEM_establish_bereaved_family_compensation_system_desc: "During the great war and the chaos that continues to this day, the bereaved families of those who sacrificed themselves should not be discriminated against based on ethnicity. Along with the revision of the conscription law, we must establish a unified compensation system for bereaved families across both Germans and Gehennans to prove that the state values the lives of all citizens equally."
 GEM_gehenna_grand_coalition: "Gehenna Grand Coalition"
 GEM_gehenna_grand_coalition_desc: "Idealism alone cannot run a nation. The deep rift of distrust between Gehennans and Germans has not yet been filled. Instead of a gamble reaching out to each other, we choose the most realistic and stable path. This might be an eternal division rather than harmony. However, this solid political alliance will be the strongest breakwater against internal and external threats trying to divide the Federation."
 GEM_reaching_out_to_each_other: "Reaching Out to Each Other"
 GEM_reaching_out_to_each_other_desc: "Laws and systems have built a cold skeleton, but the warm blood to fill it is not yet circulating. Gehennans and Germans still view each other as 'them' rather than 'us.' Instead of taking the safe path of a grand coalition, we start an idealistic gamble. If this gamble succeeds, we will achieve true harmony, jumping across decades. If it fails... distrust will deepen uncontrollably."
 GEM_we_are_back: "We Are Back!"
 GEM_we_are_back_desc: "The long era of chaos and division is over. Germany and Gehenna have finally been reborn as one nation, one people. Now the United Federation will once again reveal its presence on the world stage as a powerful and unified nation that has overcome the scars of division."
 GEM_trinity_oppression: "Oppression of Trinity-Affiliated..."
 GEM_trinity_oppression_desc: "While we succeeded in fusing with the Germans, another 'stranger' newly created remains within us. Our long-time nemesis, the Trinity-affiliated. We will suppress their culture and control their influence to further solidify the homogeneity of the United Federation."
 GEM_federation_of_three_nations: "...Federation of Three Nations?"
 GEM_federation_of_three_nations_desc: "Just as we embraced the Germans, could we not also accept the Trinity-affiliated as part of us? We explore the possibility of moving toward a larger and greater federation that respects the uniqueness of three nations: Gehenna, Germany, and Trinity."
 GEM_federation_of_three_nations1_tt: "Upon completion of §Y$GEM_reaching_out_to_each_other$§!:"
 GEM_federation_of_three_nations2_tt: "Upon completion of §Y$GEM_gehenna_grand_coalition$§!:"
 ############# Chiaki
 GEM_focus_ended_4_B: "Declaration of the 'Gehenna Nation'"
 GEM_focus_ended_4_B_desc: "The chaos of this land occurred because we defined each other as 'others.' Secretary Chiaki discards old blood-based logic and declares the new higher concept of the 'Gehenna Nation' that transcends race and origin.\n\nNow, Germans, Gehenna students, citizens of autonomous districts, and numerous other races are all brothers within the fence of one giant 'Gehenna Nation.' This is not a simple physical union, but a great chemical fusion aiming for 'unity in diversity.' We had different roots, but from now on, we will be recorded as the same community of destiny in one history book edited by Chiaki."

 GEM_manmajeon_chairmanship_separation_B: "Separation of Pandemonium Chairmanship"
 GEM_manmajeon_chairmanship_separation_B_desc: "As her duties as head of state have become significant, Motomiya Chiaki can no longer be bound by the title of 'Gehenna Student Council President.' Consequently, she has decided to boldly separate the Pandemonium Chairmanship from the national leadership, sprinting toward the grand scoop of 'National Management' on a wider stage. Starting from the position of Secretary and rising to the pinnacle of the nation, her journey now enters a new phase."

 GEM_national_schizophrenia_expulsion: "Expulsion of National Schizophrenia"
 GEM_national_schizophrenia_expulsion_desc: "The wasteful question, 'Am I German or Gehennan?' is now forbidden. To cure this national schizophrenia, Secretary Chiaki has defined the act of insisting on lower identities as a social pathological phenomenon. We will have only one healthy spirit as 'Federal Citizens.' This is not a forced oblivion. It is an essential healing process to integrate a divided self and be reborn as a healthier and stronger 'single spirit'."

 GEM_anti_federal_nationalist_group: "Anti-Federal Nationalist Groups"
 GEM_anti_federal_nationalist_group_desc: "The greatest enemy hindering our grand integration is not outside, but inside. German nationalists who insist on blood purity and Gehenna supremacists are 'reactionary paranoids' who cannot read the flow of the times. Secretary Chiaki has defined them as 'anti-federal factionalists' and proclaimed them as cancerous existences hindering social integration. For the sake of the grand scoop of great integration, these relics of the old era, who obsess over the logic of blood and stain the pages, will be deleted without mercy."

 GEM_minor_party_cooptation_induction: "Inducing Small Party Co-optation"
 GEM_minor_party_cooptation_induction_desc: "A giant river does not reject small tributaries but embraces them. To broaden the support base of the Federation, Secretary Chiaki uses a flexible strategy of co-opting small parties without a clear color under the flag of the Federation. They will be given small roles and a voice within the federal parliament. This 'strategic co-optation' will grant democratic legitimacy to our rule and be the most efficient political engineering to isolate the opposition."

 GEM_chiaki_reform: "Chiaki Reform"
 GEM_chiaki_reform_desc: "Just as new wine should be put into new bottles, a new nation needs a new system. 'Chiaki Reform' is a large-scale social remodeling project that injects the identity of the 'Gehenna Nation' across administration, education, and culture. Complex and inefficient laws of the old era are boldly discarded, and practical systems to accelerate the Federation's integration fill their place. This is not just a change of system. It is a creative editorial job of cutting and pasting two manuscripts, Germanic and Gehennan, to create a completely new masterpiece."

 GEM_enthusiastic_public_opinion_leadership: "Enthusiastic Public Opinion Leadership"
 GEM_enthusiastic_public_opinion_leadership_desc: "Before reason can be convinced, emotion must be made to react first. With a genius sense, Secretary Chiaki directs the mass media, converting public support for the Federation into an enthusiastic fandom. The streets overflow with hopeful slogans, and the radio rings with hymns singing of the future of integration. Charmed by the brilliant vision Chiaki presents, the public will believe they have become the protagonists of a great history."

 GEM_decadence_of_old_culture: "Decadence of Old Culture"
 GEM_decadence_of_old_culture_desc: "To make a new culture bloom, old roots must be cut out. Secretary Chiaki has defined traditional cultures that reject integration as 'decadent customs hindering development' and started sophisticated cultural operations to push them out of the public's interest. \"Unfashionable, boring, and inefficient.\" By overlaying such images on the legacies of the past, we make the younger generation naturally distance themselves from old traditions and long for the Federation's new and sophisticated culture."

 GEM_left_wing_opposition_acceptance: "Acceptance of Left-Wing Opposition"
 GEM_left_wing_opposition_acceptance_desc: "If it's to drive out the ghost of nationalism, we can even join hands with yesterday's enemy. Secretary Chiaki has grasped that the internationalist tendency of left-wing forces, who oppose ethnic division, aligns with our 'Gehenna Nation' integration theory. We will accept them into the institutional sphere and use them as hounds to check right-wing nationalists. Even if their ideology doesn't perfectly match ours, they will be useful fellow passengers while running toward the same destination of a 'unified federation'."

 GEM_clandestine_communist_group: "Clandestine Communist Groups"
 GEM_clandestine_communist_group_desc: "They shout equality on the outside, but on the inside, they are underlings trying to offer the nation we built to Moscow. Secretary Chiaki has grasped the fact that communists are trying to use the Federation's integration as a tool for their own revolution. These red point-organizations lurking in the darkness try to contaminate our nation as a field for class struggle. We will define them as enemies of the Federation and thoroughly monitor and block them in unseen places."

 GEM_new_system_and_new_state_construction: "Construction of New System and New State"
 GEM_new_system_and_new_state_construction_desc: "Finally, a new world that no one could have imagined has been completed. The 'Gehenna-German Federation,' born by breaking the prison of bloodlines, is a multi-ethnic fusion nation unprecedented in human history, and the chaotic manuscript of the past has been discarded. Now we turn the first page of an eternally remembered bestseller called the perfectly edited new state."

 GEM_german_B4_tt: "This focus will change to a complete focus tree upon completion of the §Y$GEM_new_system_and_new_state_construction$§! focus."
 GEM_german_B4_tooltip: "The focus tree for §g§Y$GEM_left_wing_opposition_acceptance$§! and §Y$GEM_clandestine_communist_group$§! will also change depending on whether §Y$GEM_populist_leader$§! or §Y$GEM_corporate_tax_deduction$§! is completed.§!"
 GEM_german_B4: "The Final Edit"
 GEM_german_B4_1: "5-Year Economic Democratization Plan"
 GEM_german_B4_1_desc: "Who said it's impossible to catch both rabbits: corporate growth and workers' rights? Secretary Chiaki has designed a groundbreaking circulation structure that directs the capital secured by corporations through investment into workers' wages, a demand of the 'left-wing opposition.' This economic system, where the fruits of growth go straight into the pockets of citizens, will be the scenario for the most ideal 'happy ending' in history, where capital and labor are in perfect harmony."

 GEM_german_B4_2: "Establishment of Military-Industrial Complex"
 GEM_german_B4_2_desc: "To protect our nation from enemies lurking in the darkness, powerful strength is needed. Secretary Chiaki has launched a giant 'Military-Industrial Complex' by combining corporate capital and national security. Now corporations produce the nation's shield, and the state thoroughly monitors regime-overthrowing forces with that power. This is the strongest and most efficient 'Iron Alliance' forged between capital and public authority."

 GEM_german_B4_3: "Socialist Constitution"
 GEM_german_B4_3_desc: "The root of the nation is not the elite, but the 'People' who are the protagonists of the story. This new constitution, which accepted the enthusiastic support of the masses and the ideology of left-wing forces, will be reborn as the Gehenna Federation as a complete welfare state. This law book, directly supervised by Secretary Chiaki, is the script for the most warm and touching 'human drama' in human history, guaranteeing the happiness of all citizens from the cradle to the grave."
 GEM_chiaki_system_decision_GEM_german_B4_3_1: "National Leftward Shift"
 GEM_chiaki_system_decision_GEM_german_B4_3_2: "New System Propaganda: Socialist Movement"
 GEM_chiaki_system_decision_GEM_german_B4_3_3: "New System Propaganda: Socialist Movement"

 GEM_german_B4_4: "New Era Gehenna-Style Democracy"
 GEM_german_B4_4_desc: "True democracy is not a wasteful class struggle, but a 'direct communion' between the leader and the people. Secretary Chiaki has blocked the divisive maneuvers of the communists and proclaimed 'New Era Gehenna-Style Democracy' where the nation and people unite as one. This system, which 'edits' the aspirations of the masses fastest and most accurately to implement them as policies, is the most efficient governing model to break through chaotic times."
 idea_GEM_german_B4_4: "New Era Gehenna-Style Democracy"
 idea_GEM_german_B4_4_desc: "Why must left-wing reform necessarily include socialism? We will push for reforms 'for our nation' and keep our distance from their internationalism."
 #### The Nation of Two Peoples
 ############# Makoto
 GEM_focus_ended_1_C: "Proclamation of the Greater Gehenna State"
 GEM_focus_ended_1_C_desc: "All factions of Gehenna that were divided are now integrated under one flag. We discard the old order of the past and proclaim the birth of the 'Greater Gehenna State,' a powerful and great nation centered around Pandemonium, to all of Kivotos. This will be the first milestone toward our great work."
 GEM_ruler_in_the_sky: "Ruler in the Sky"
 GEM_ruler_in_the_sky_desc: "A true ruler does not get tied down by trivial matters on the ground, but presents the path for the nation to take from a high place where everyone looks up. We must deify the existence of the Chairman and establish an untouchable authority, making everyone follow her will without doubt. Her rule will be an object of awe, not understanding."
 GEM_ten_thousand_demon_dictatorship: "Pandemonium Dictatorship"
 GEM_ten_thousand_demon_dictatorship_desc: "For efficient national operation and rapid decision-making, a single powerful focal point is needed. It is time to remove any discord that might exist within Pandemonium and concentrate all power in the Chairman to unite all national capabilities toward a single goal. This is an essential process for achieving the great work without hesitation."
 GEM_heir_of_thunder_emperor: "Successor to the Thunder Emperor's Role"
 GEM_heir_of_thunder_emperor_desc: "The Chairman's authority has now transcended the human realm and become an object of awe, much like the 'Thunder Emperor' of old. Based on absolute charisma, we will prepare for a total war that transcends the nation's limits and get ready to conquer everything under the Chairman's name. Her will is the law of the nation."
 GEM_supreme_ruler_walking_the_earth: "Supreme Ruler Walking the Earth"
 GEM_supreme_ruler_walking_the_earth_desc: "A great leader doesn't just stay on the podium; she walks directly into the masses to draw out their enthusiastic support. Through large-scale rallies and site inspections, we must strengthen the bond between the Chairman and the people, making them view the leader as the focal point of the nation and the existence that realizes their will. Powerful charisma will be a more solid governing foundation than any physical force."
 GEM_ten_thousand_demon_council: "Pandemonium Council"
 GEM_ten_thousand_demon_council_desc: "A great leader needs competent individuals to uphold her will and assist in national administration. By establishing the 'Pandemonium Council' composed of key figures of Pandemonium, we will secure the stability of national administration and lay the cornerstone for a more systematic governing system. This is the beginning of rational rule, not dogma."
 GEM_ten_thousand_demon_council_tt: "Constructs §YLevel 1§! railways from §Y[Root.Capital.GetName]§! to the capitals of §Yfaction members§! reachable by land."
 GEM_designer_of_all_demons: "Designer of All Demons"
 GEM_designer_of_all_demons_desc: "A nation is like one giant machine. We will redesign the nation's industrial, military, and administrative systems as a whole into the most efficient form. A leader must prove her capability as a great designer who perfectly designs and operates the machine called the nation, going beyond simply reigning."
 GEM_unification_of_all_gehenna_states: "Unification of All Gehenna States"
 GEM_unification_of_all_gehenna_states_desc: "Several autonomous districts of Gehenna still maintain old customs and administrative systems. To establish the central government's authority and manage the national territory efficiently, we must unify the administrative systems of all regions and build an integrated infrastructure to complete true unification."
 GEM_one_party_one_nation: "One Party, One Nation"
 GEM_one_party_one_nation_desc: "All voices of the nation must be unified into one. By excluding all political forces other than Pandemonium and establishing a one-party system where the party's will becomes the nation's will, we secure ideological unity. Opposing opinions will no longer be tolerated; we only move toward one goal."
 GEM_what_it_means_to_be_sovereign: "What it Means to be Sovereign"
 GEM_what_it_means_to_be_sovereign_desc: "True sovereignty does not come simply from pressing down on the opponent with force. We will establish the nation's governing ideology and build a governing system based on the rule of law to grant legitimacy to our rule. This is a process to be recognized as an eternal ruler, not a temporary conqueror."
 ############# Satsuki
 GEM_focus_ended_2_C: "The Future of Gehenna Academy"
 GEM_focus_ended_2_C_desc: "The initial chaos has been calmed. But if my method brought only temporary stability, all these efforts would be meaningless. True peace must be maintained eternally as a system itself, not by external control. Now we must move to the next step to decide Gehenna's future. It is time to find the answer to how to make this peace permanent."
 GEM_psychology_department_foundation: "Founding the Psychology Department"
 GEM_psychology_department_foundation_desc: "Forced mental control only leads to resistance in the end. A more fundamental solution lies in education. By founding the 'Psychology Department,' we will let all students learn the causes of conflict and the principles of harmony as an academic discipline. They will understand their own minds and realize how to coexist with others."
 GEM_satsuki_school_rules: "Satsuki School Rules"
 GEM_satsuki_school_rules_desc: "The human mind is so fickle. What they need is not a complex ideology, but clear and simple rules. The 'Satsuki School Rules' stipulate the most ideal behavior pattern for all students to follow. Just by following these rules, they can become members of a harmonious society without worry."
 GEM_advanced_nk_ultra_solution: "Advanced NK-Ultra Solution"
 GEM_advanced_nk_ultra_solution_desc: "Past technology was crude. Now we can tune the subconscious of society in a more sophisticated way, so soft that no one will perceive it. Whether through education or technology, our solution will permeate society as a whole and create a giant flow that no one can resist."
 GEM_gehenna_psychology_institute: "Gehenna Psychology Institute"
 GEM_gehenna_psychology_institute_desc: "The Psychology Department is now reborn as the 'Gehenna Psychology Institute,' standing at the pinnacle of all academic disciplines in Gehenna. The curriculum here aims beyond simple knowledge transfer to letting students realize the essence of the psychological structure that composes society and finally 'awakening' themselves. Only those who perfectly understand themselves through this process will earn the qualification to lead this peaceful academy."
 GEM_modern_solution: "A 'Modern' Solution"
 GEM_modern_solution_desc: "School rules alone cannot completely control the impulses deep inside humans. A more certain and permanent solution is needed. By introducing the latest neuro-engineering technology, we develop neural implants that stabilize the regions of the brain that cause conflict. This is not violence against the spirit. It is merely the most modern 'vaccine' to prevent the disease called chaos."
 GEM_diligent_gehenna_citizen: "Diligent Gehennan"
 GEM_diligent_gehenna_citizen_desc: "Look. The students of the past who wasted time with conflict and wandering are no more. Everyone is satisfied with their role in their respective places and works diligently for the development of the community. Those whose inner agony has vanished are the most happy, productive, and ideal 'Gehennans'."
 GEM_ordered_unconscious: "Ordered Unconscious"
 GEM_ordered_unconscious_desc: "Our goal goes beyond the control of conscious behavior. It is to engrave the concepts of 'harmony' and 'order' deep within the unconscious of all society members. When they can't even imagine conflict in their dreams, our society will finally gain perfect stability that won't be shaken by any external shock."
 GEM_inner_integrity: "Inner Integrity"
 GEM_inner_integrity_desc: "Finally, we have reached the stage where individual desires and community goals match perfectly. Students are no longer 'following' rules. All their thoughts and actions naturally contribute to the harmony of society. The state where agony over good and evil, right and wrong itself has disappeared; this is the perfect 'Inner Integrity'."
 GEM_ark_nation: "Ark Nation"
 GEM_ark_nation_desc: "We have completed the only 'Ark' floating in the middle of a sea of chaos. While the outside world still suffers from hatred and war, only perfect peace and order exist within our nation. Now our mission is to firmly guard this ark and someday spread this light of salvation to the outside world."
 GEM_preparation_for_future_war: "Preparing for Future War"
 GEM_preparation_for_future_war_desc: "Our peace will only further stimulate the external chaos. Barbarians who do not understand order will someday try to destroy our ark. Therefore, preparing for war to protect our peace is the most sacred duty. This war will not be conquest, but a crusade to safeguard harmony."
 GEM_academy_secret_corps: "Academy Secret Corps"
 GEM_academy_secret_corps_desc: "To protect our ideals, a most pure blade that will not be tainted by those ideals is needed. The 'Academy Secret Corps' is composed only of personnel who have perfectly achieved inner integrity. Without emotion or doubt, they move only to remove all factors threatening the stability of the nation, as the most efficient and ruthless guardians."
 GEM_manifestation_of_unconscious: "Manifestation of Unconscious"
 GEM_manifestation_of_unconscious_desc: "Neural implant technology doesn't just stop at maintaining internal stability. Now we can tie all connected spirits into one giant network and project that unified unconscious as a direct 'force' to the outside world. This is not simple psychological warfare. Our perfect inner order is the preparation for a war toward the chaotic external reality."
 GEM_ordered_unconscious_tt: "Completed both §Y$GEM_diligent_gehenna_citizen_1$§! and §Y$GEM_diligent_gehenna_citizen_2$§! decisions."
 ############# Iroha
 GEM_focus_ended_3_C: "Struggle Toward Idealism Even if Broken"
 GEM_focus_ended_3_C_desc: "The position of German citizens placed upon the federation system created by Natsume Iroha, the first president of the United Federation, is unstable. Forced labor by Kivotos capitalists that still occurs although illegal, and the contempt from students... We will struggle to solve all of this."
 GEM_file_human_rights_commission: "Filing with the Human Rights Commission"
 GEM_file_human_rights_commission_desc: "The 'Gray Zone' is a field of labor exploitation carried out behind the market by Kivotos corporations, escaping the eyes of the federal government that pursues a small government. No one has been able to stop it until now, but we will expose it."
 GEM_demolish_gray_zone: "Demolish Gray Zone"
 GEM_demolish_gray_zone_desc: "All labor exploitation must end. First President Natsume Iroha wouldn't have wanted this either, and since we gained more sympathy votes from Gehenna citizens and students than expected after the exposure, all this labor exploitation will be terminated."
 GEM_demolish_gray_zone_flag: "Completed §Y$GEM_demolish_gray_zone$§! focus."
 GEM_under_natsume_iroha_arrangement: "Under Natsume Iroha's Arrangement"
 GEM_under_natsume_iroha_arrangement_desc: "Natsume Iroha. She is a complicated person. Some call her a dictator who damaged the freedom of Gehenna Academy, some call her a pioneer who returned freedom to the Germans, and others call her a laissez-faireist who promotes small government. However, the reason Germans can survive today, expecting tomorrow's sun, is thanks to her arrangement."
 GEM_enact_equal_labor_law: "Equal Labor Law"
 GEM_enact_equal_labor_law_desc: "Equal employment for not only Gehennans and Germans but also various ethnic minorities within the United Federation is still not being achieved. By gathering the power of German-affiliated political groups, we will introduce equal labor rights starting from the state government level."
 GEM_enact_equal_labor_law_flag: "Completed §Y$GEM_enact_equal_labor_law$§! focus."
 GEM_pass_ethnic_quota_system: "Pass Ethnic Quota System"
 GEM_pass_ethnic_quota_system_desc: "To guarantee equal employment for all multi-ethnic groups within Gehenna, quota systems must be implemented in various sectors of society. All German civil groups will exert their full effort for the passage of the bill."
 GEM_federal_republic_of_all_germans: "United Federation of All Germans"
 GEM_federal_republic_of_all_germans_desc: "Germany, Germany above all, above everything in the world!\nWhen for defense and protection, it always stands together like brothers,\nFrom the Maas to the Memel, from the Etsch to the Belt!\n\n- From the 1st verse of Deutschlandlied"
 GEM_build_all_german_memorial: "Build All-German Memorial"
 GEM_build_all_german_memorial_desc: "With cooperation from numerous private organizations and support from various classes, we will build a memorial engraved with the names of all Germans who fell victim to xenophobia."
 GEM_build_all_german_memorial_idea: "Build All-German Memorial"
 GEM_build_all_german_memorial_idea_tt: "This national spirit is removed upon completion of the '§Y$GEM_build_all_german_memorial$§!' focus."
 GEM_build_all_german_memorial_buff_idea: "All-German Memorial"
 GEM_build_all_german_memorial_buff_idea_desc: "Remember,\nWhen you speak of our weakness,\nAlso that dark time\nFrom which you have escaped.\n- Bertolt Brecht, <To Those Born Later>"

 ############# Chiaki
 GEM_focus_ended_4_C: "The Era of Chiaki"
 GEM_focus_ended_4_C_desc: "The chaos of the transition period has ended. Secretary Motomiya Chiaki now begins her journey as a full-scale national leader, not a helper behind the scenes. Under her direction, the nation will operate dynamically like an unceasing rotary press, and only the vision she approves will be the country's sole direction. Verily, the Era of Chiaki has begun."

 GEM_journalism_department_expansion: "Gehenna Journalism Department Expansion"
 GEM_journalism_department_expansion_desc: "In modern warfare, information is a resource as important as bullets. Secretary Chiaki has decided to elevate Gehenna's Journalism Department to a national-level intelligence agency, building a giant state-run media network rather than a simple school newspaper. Now all administrative organizations of the state will move nimbly like an editorial department that collects and processes information, securing accurate information control."

 GEM_cultural_consensus: "Cultural Consensus"
 GEM_cultural_consensus_desc: "To solve the heterogeneous clash between Gehenna's free-spiritedness and Germany's strictness, the state attempts 'cultural editing' through the media. Secretary Chiaki is inducing a natural consensus throughout society by emphasizing the common denominators of the two cultures and excluding conflict factors from the public's view. This is a sophisticated cultural fusion formed through high-level staging, not forced unification."

 GEM_world_in_the_shutter: "World in the Shutter"
 GEM_world_in_the_shutter_desc: "Secretary Chiaki believes that dominating perception is true rule, rather than physical conquest. She chose the method of presenting 'edited reality' reinterpreted through a lens to the public, rather than governing the world as it is. Chaotic reality is organized within the frame, and only the images approved by the state will be accepted as truth by the public. The world will be recorded as it appears in the viewfinder."

 GEM_propaganda_war: "Propaganda War"
 GEM_propaganda_war_desc: "Media is not just a means of recording, but a weapon that strikes the enemy. Secretary Chiaki has started a large-scale psychological war that attacks the enemy's thoughts and inspires the will of her own side by mobilizing all available media capabilities. The boundaries of truth become blurred, and only winning messages survive. Our propaganda will cross borders and be the most powerful bombardment that engraves the superiority of our system."

 GEM_put_down_the_camera: "Putting Down the Camera"
 GEM_put_down_the_camera_desc: "A nation cannot be led from an observer's perspective alone. Secretary Chiaki has made the decision to step out from behind the viewfinder and intervene directly in the flow of history. No longer a recorder but a ruler, she will change reality through direct administrative orders and policy execution. Substantial leadership beyond staged images leads the nation."

 GEM_chiaki_reform_C: "Chiaki Reform"
 GEM_chiaki_reform_C_desc: "A high-intensity reform of the entire national system begins. Secretary Chiaki has abolished the inefficient bureaucracy and introduced a new administrative system that moves nimbly as if competing for breaking news. Complex approval procedures are boldly omitted, and only performance and speed become the criteria for an organization's survival. This reform will transform the nation into the fastest and most efficient organization."

 GEM_manmajeon_chairmanship_separation_C: "Separation of Pandemonium Chairmanship"
 GEM_manmajeon_chairmanship_separation_C_desc: "As her duties as head of state have become significant, Motomiya Chiaki can no longer be bound by the title of 'Gehenna Student Council President.' Consequently, she has decided to boldly separate the Pandemonium Chairmanship from the national leadership, sprinting toward the grand scoop of 'National Management' on a wider stage. Starting from the position of Secretary and rising to the pinnacle of the nation, her journey now enters a new phase."

 GEM_establishment_of_gehenna_republic: "Establishment of the Gehenna Republic"
 GEM_establishment_of_gehenna_republic_desc: "Finally, the establishment of the Gehenna Republic has been proclaimed. This new nation was built not on old authority or closed groups, but on information, communication, and Secretary Chiaki's vision. Citizens are defined not as passive subjects, but as ardent subscribers and participants of the medium called the nation. This free and vibrant republic will present a new national model to the entire world."

 GEM_national_editor_chiaki: "National Editor Chiaki"
 GEM_national_editor_chiaki_desc: "Motomiya Chiaki has now risen as the sole 'National Editor' who decides the fate of the nation, beyond being a simple leader. According to her decisions, the nation's policies, the lives of citizens, and the flow of history are edited and corrected. Reality is her manuscript paper, and the world will flow as she intends. This is the final proofreading work to create the most perfect world."


 GEM_national_editor_C4_tt: "This focus will change to a complete focus tree upon completion of the §Y$GEM_national_editor_chiaki$§! focus."
 GEM_national_editor_C4_tooltip: "The focus tree for §g§Y$GEM_world_in_the_shutter$§! and §Y$GEM_put_down_the_camera$§! will also change depending on whether §Y$GEM_populist_leader$§! or §Y$GEM_corporate_tax_deduction$§! is completed.§!"
 GEM_national_editor_C4: "The Masterpiece"

 GEM_national_editor_C4_1: "'The Populist'"
 GEM_national_editor_C4_1_desc: "General Secretary Chiaki has set the nation as a giant stage and the citizens as the audience. She pushes complex and gloomy problems of reality out of the media's frame and emphasizes only brilliant and provocative images that the masses will go wild for. Within the radiant illusions poured out by the media, citizens will forget the pain of reality and send blind support to the leader."

 GEM_national_editor_C4_2: "Administrative Reformer"
 GEM_national_editor_C4_2_desc: "General Secretary Chiaki put down her pen and jumped into the field. She breaks the walls of the frustrating bureaucracy and pushes for radical reforms that reflect the voices of the masses by going directly into their lives. Her impromptu and unconventional directions shake the existing order, but the masses will send absolute trust to the leader who acts and reacts immediately to their problems."

 GEM_national_editor_C4_3: "Corporate Participation in Government"
 GEM_national_editor_C4_3_desc: "To package the nation as a sophisticated and wealthy 'Gehenna Dream,' General Secretary Chiaki has invited giant corporations as partners in state administration. In this perfect landscape where skyscrapers form forests and capital overflows, entrepreneurs and elites efficiently manage the nation under Chiaki's direction. Stories of the shaded places are edited out, but the prosperity of the nation seen on the outside will shine more brilliantly than ever."

 GEM_national_editor_C4_4: "Corporate Social Responsibility"
 GEM_national_editor_C4_4_desc: "General Secretary Chiaki faces reality with a cold gaze. She encourages corporate growth but exercises powerful control so that the profits they earn flow into society as a whole. Corporations are given heavy social responsibility as core components of the giant project called the nation. This is a rational and calculated form of national model trying to control the greed of capital and realize efficient distribution."

