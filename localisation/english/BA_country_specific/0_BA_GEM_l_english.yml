 GEH_anarchist_society_desc:0 "The Hot Springs Development Department is Gehenna's civil engineering club and effectively its combat engineers. They are a club that causes frequent trouble, like drilling holes everywhere in their obsessive madness for hot springs, or in extreme cases, blowing up water pipes and claiming they've found a 'spring'."
 GEH_anarchist_society_8_desc:0 "The Hot Springs Development Department was directly disbanded and reorganized into a new club by the Prefect Team, and they no longer cause trouble."
 GEH_Gourmet_Research_Society_idea:0 "Gourmet Research Society"
 GEH_Gourmet_Research_Society_idea_desc:0 "The Gourmet Research Society. Based on the name alone, they sound like a club that researches fine dining, but in reality, they are known to go anywhere to eat anything they find delicious. It doesn't matter if it's Trinity or Millennium. They are a club that causes social chaos, even going as far as ruthlessly bombing a restaurant if the food tastes bad."
