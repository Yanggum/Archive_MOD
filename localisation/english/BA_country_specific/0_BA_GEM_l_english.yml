 ###### 노말
 GEM_focus_ended_1O_endfocus: "세계 최정상의 학원"
 GEM_focus_ended_1O_endfocus_desc: "세계 최정상의 학원"
 GEM_the_great_usurper: "위대한 찬탈자"
 GEM_the_great_usurper_desc: "우리 학원의 의장은 모든 학원의 지배자가 되어야 마땅합니다. 거대한 전쟁 속에서 모든 이들의 학생회장을 강탈할 것입니다!"
 GEM_war_materiel_system: "전쟁군수체계"
 GEM_war_materiel_system_desc: "세계적인 전쟁을 위해서 우리는 세계적인 체계를 갖춰야 합니다. 영원히 움직이는 전시 국가를 건설하고 주위 국가를 모조리 약탈하고 병합할 것입니다. 그에 어떠한 의문이 필요하겠습니까? 할 수 있으니 했으며. 우리는 더 많은 것을 할 수 있게 될 것입니다."
 GEM_prefect_hegemony_raid: "선도부 헤게모니 강탈"
 GEM_prefect_hegemony_raid_desc: "게헨나의 통일은 이뤄졌으며 선도부는 결국 우리의 칼 아래에 무릎 꿇었습니다.\n\n게헨나의 진정한 통합은 아직 끝나지 않았다!"
 GEM_legacy_of_luxembourg: "룩셈부르크의 유산"
 GEM_legacy_of_luxembourg_desc: "룩셈부르크의 정치 실험은 끝났으며 외게헨나 주로의 편입이 완료되었습니다.\n\n이제 우리가 그들의 모든 것을 흡수할 것입니다."
 GEM_secure_trinity_host: "트리니티 호스트 확보"
 GEM_secure_trinity_host_desc: "트리니티와 만마전의 갈등은 완전히 끝장났으며, 향후 갈등마저 종식시키기 위해서는 [ROOT.GetLeader]가 트리니티의 호스트직에 올라야 합니다.\n\n우리만의 에덴 조약이 완성되었다!"
 GEM_declare_student_council_president: "총학생회장 선포"
 GEM_declare_student_council_president_desc: "잎은 떨어지고 총학생회는 우리 손에 들어왔습니다. 당연히 무능한 그들의 지도부와 다른 당당한 게헨나의 학생회가 총학생회를 대체하고 모든 키보토스의 명분을 병합해야 마땅하지 않습니까?\n\n총학생회장 [ROOT.GetLeader] 만세!"
 GEM_secure_millennium_president: "밀레니엄 총재 확보"
 GEM_secure_millennium_president_desc: "같은 3대 학원인 밀레니엄 또한 우리의 검 앞에 스러졌습니다. 당연히, 우리는 그들의 모든 걸 병합하고 그들의 기술은 전쟁에 이용될 것입니다.\n\n세미나는 이제 우리가 개최한다!"
 GEM_king_of_kings: "왕중왕"
 GEM_king_of_kings_desc: "만마전의 의장이자 게헨나의 정당한 통일자, 룩셈부르크의 지배자, 트리니티의 호스트, 밀레니엄의 총재, 키보토스의 총학생회장, 모든 학도들의 학생회장이자 모든 유럽의 지배자 [ROOT.GetLeader]."
