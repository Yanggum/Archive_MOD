 ###### German Reich
 GEM_focus_ended_1_A_endfocus: "Inauguration of the Führer"
 GEM_focus_ended_1_A_endfocus_desc: "The chaos of the German Reich has ended, and all power is now concentrated in a single person. Chairman Hanuma Makoto officially succeeds to the title of 'Führer,' which the opposition leader had falsely claimed. This declaration goes beyond a mere struggle for position; it is the final word on who truly represents the will of the German people. Under her leadership, the old Nazism is replaced, and Germany welcomes a new era."
 GEM_national_corporatism_proposal: "Advocacy of National Corporatism"
 GEM_national_corporatism_proposal_desc: "The stale ideology of existing Nazism cannot lead the new era. Accordingly, 'National Corporatism' is proposed as the core ideology to lead the current system. This system organizes all strata of society into 'corporations' under state control, concentrating all capabilities on achieving the 'Great Feat.' The 'National Corporatist German Patriot Party' will use this new ideology to absorb the support base of the existing Nazi Party and solidify its position as the sole alternative power."
 GEM_rune_script_adoption: "Adoption of Rune Script"
 GEM_rune_script_adoption_desc: "The Swastika, used by the opposition as a symbol of failure, must be discarded. In its place, we adopt the 'Odal Rune'—symbolizing ancient Germanic heritage, bloodline, and the earth—as the new national emblem. This is not a mere change of symbols. It is the beginning of a symbolic war to deny the legitimacy of the current Nazi Party and proclaim that we are the true inheritors of this land."
 GEM_bury_gehenna_culture: "Burying Gehenna Culture"
 GEM_bury_gehenna_culture_desc: "To become the absolute ruler of Germany, the ruler must erase the perception of being an 'outsider.' Especially in a situation where the opposition party advocates nationalism, our Gehenna background could be attacked as a political weakness. Consequently, Gehenna's unique cultural characteristics will be intentionally suppressed in the public sphere. This is a cold political decision to secure the legitimacy of governance and block any pretexts for attack from political enemies."
 GEM_gehenna_german_cultural_integration: "Gehenna-Germanic Cultural Integration"
 GEM_gehenna_german_cultural_integration_desc: "An attempt begins to melt Germanic tradition and Gehenna's spirit into one crucible, creating a superior and more powerful new culture. This is not a simple cultural exchange, but a process of reorganizing German culture with Gehenna's dynamism and fighting spirit at its core. The newly born 'Gehenna-Germanic' culture will solidify the legitimacy of the new system and function as the eternal source of national strength."
 GEM_leader_of_germans: "Leader of the Germans"
 GEM_leader_of_germans_desc: "The Führer is now elevated from an external conqueror to an entity that embodies the will of the newly defined 'Gehenna-Germanic People.' Her voice becomes the voice of the entire nation, and her decisions will be accepted as the unquestionable fate of the people. Through this, the cult of the individual Führer is raised to a national level, completing an absolute leadership system where no challenge is possible."
 GEM_expel_leftists_from_coalition: "Expelling Leftists from the Coalition"
 GEM_expel_leftists_from_coalition_desc: "Under the banner of One Nation, One People, One Will, any element that compromises ideological purity must be removed. The leftist coalition forces, once necessary for regime stability, are now regarded as spent tools and purged. This will be propagandized not as a mere power struggle, but as part of a 'Great Cleansing' to unify all national energy in a single direction."
 GEM_denazification_movement: "Denazification Movement"
 GEM_denazification_movement_desc: "For the new order to completely replace the specters of the past, a clear break from the old regime is required. Accordingly, a massive 'Denazification Movement' is launched against the threatening Nazi Party and its symbols. Rather than a true ideological liquidation, this is a political choice to establish a power base by declaring themselves the only alternative and outlawing the most powerful rival party."
 GEM_national_president_and_tricolor_flag: "National President and Tricolor Flag"
 GEM_national_president_and_tricolor_flag_desc: "Having removed the most powerful competitor, the Nazi Party, the regime no longer needs to insist on extreme symbols. Adopting the more moderate title of 'National President' instead of 'Führer' and reviving the tricolor flag of the Weimar Republic is a conciliatory gesture toward the international community and domestic moderates. This is a pragmatic choice to broaden the support base by cloaking authoritarian essence in the 'legal' shell of the state."
 GEM_slightly_more_progressive: "Slightly More Progressive"
 GEM_slightly_more_progressive_desc: "Now that all major political rivals have been eliminated, it is time to secure public support and increase the stability of the system. A few limited social reform measures are introduced. Symbolic actions regarding improvements in the working environment or women's rights are used as propaganda tools to show that the regime is not a mere apparatus of oppression. This illusion of 'progress' serves as an effective means to alleviate public dissatisfaction while maintaining the core power structure intact."
 GEM_under_one_united_fatherland: "Under One United Fatherland"
 GEM_under_one_united_fatherland_desc: "The era of division is over. The specters of old ideologies have been liquidated, and all internal political enemies have been silenced. The distinction between Gehennans and Germans is no longer meaningful. Beyond blood and origin, loyalty to the 'One United Fatherland' has become the sole value. Under the absolute leadership of [ROOT.GetLeader], all peoples have their respective places respected while being integrated into one giant will. Now the fatherland, having overcome all internal conflicts, is finally ready to project its power outward. The march toward the Great Feat begins now!"
 ###### Federation
 GEM_focus_ended_1_B_endfocus: "Union of Gods"
 GEM_focus_ended_1_B_endfocus_desc: "The old idea of a single superior race is narrow and inefficient. True power is only perfected when the two most powerful bloodlines join hands to rule the world. The 'Great Migration' was destiny. It was a revelation for the Germanic people, descendants of the North, and the Gehenna people, successors of Hinnom, these two 'Peoples of the Gods' to meet and forge one great destiny. Now we shall become one under the banner of the Federation, leaving the inferior beneath our feet as we write the myths of a new era."
 GEM_1_B_germany_first: "Germany First"
 GEM_1_B_germany_first_desc: "To solidify the union of the two great peoples, we must utilize the powerful symbols and order already rooted in this land. We will place the traditions and aesthetics of German nationalism at the forefront of the Federation. This is the most realistic choice to secure the support of the German majority and effectively seize the existing state system. Gehenna's power will be a dagger hidden within, honed even sharper beneath the Germanic armor."
 GEM_two_nations_pure_blood_law: "Two Nations Pure Blood Law"
 GEM_two_nations_pure_blood_law_desc: "The union of two peoples must be a 'covenant' achieved not through integration by intermixing, but while maintaining each other's purity. Germanic strength and Gehennan mystery are most purely manifested within their respective bloodlines. The 'Two Nations Pure Blood Law' is a sacred decree to strictly prohibit intermarriage between Gehennans and Germans, preserving the unique characteristics of the two ruling peoples to maintain the Federation's power forever."
 GEM_fuhrer_successor: "Successor to the Führer"
 GEM_fuhrer_successor_desc: "The position of Führer is no longer the exclusive property of a specific race. It is the seat of the 'Most Superior One' who leads the two Peoples of the Gods. Though Hanuma Makoto is Gehennan, her overwhelming leadership and vision prove her very qualification for the title of Führer. By her succession to this title, the Federation will establish a new level of leadership principles transcending bloodlines and gain an absolute focal point to silence all doubt."
 GEM_1_B_gehenna_first: "Gehenna First"
 GEM_1_B_gehenna_first_desc: "German nationalism is powerful, but it is merely a legacy of the past. The true future must begin with the ways of us, Gehenna, who have newly arrived. We will establish Gehenna's symbols and history of struggle at the center of the Federation. The Germans will realize true glory by discarding their old traditions and submitting to the superior and more dynamic order of Gehenna. We are the rulers, and the way must also be ours."
 GEM_legacy_reactivation: "Legacy Reactivation"
 GEM_legacy_reactivation_desc: "In Gehenna's history, there was an era of the 'Thunder Emperor' who subjugated all with absolute power, not just simple chaos. We will rediscover this forgotten legacy and revive his governing methods and symbols as the governing ideology of the new Federation. This is a process of inspiring pride in the Gehenna people and making the Germans realize exactly who possesses the true history of dominion."
 GEM_successor_of_thunder_god_myth: "Successor to the Thunder God Myth"
 GEM_successor_of_thunder_god_myth_desc: "To Gehenna, the 'Thunder Emperor' is the very myth of power that transcends eras. Hanuma Makoto proclaims herself the legitimate successor of the Thunder Emperor. She will not merely recreate the tyrant of the past, but absorb his myth to make herself a living legend. Now, the leader of the Federation will reign not as a mere ruler, but as a mythical being descended with thunder."
 GEM_nord_hinnom_civilization: "Nord-Hinnom Civilization"
 GEM_nord_hinnom_civilization_desc: "The spirits of the two great peoples must be combined under a single name. Combining 'Nord,' derived from northern mythology, and 'Hinnom,' the source of Gehenna, we create a new ruling civilization: 'Nord-Hinnom.' This new culture will be a privilege enjoyed only by the two ruling peoples and a noble symbol distinguishing them from other inferior races. Art, philosophy, and rituals will all be reorganized under this new name."
 GEM_nord_hinnom_civilization_flag: "Completed §Y$GEM_nord_hinnom_civilization$§! focus"
 GEM_cow_dies_and_kindred_die: "Wealth Dies, and Kindred Die"
 GEM_cow_dies_and_kindred_die_desc: "The internal integration of the 'Nord-Hinnom' civilization is complete. Now, that superiority must be proven to the outside world. Our first target is the other great powers of Kivotos, who walk their own paths while divided. Though they could be called our 'kindred,' they are simultaneously rivals blocking our Great Feat. By absorbing them all to establish one giant empire, we shall approach immortal glory."
 GEM_honor_of_the_name_never_dies: "The Honor of One Who Leaves a Name Never Dies"
 GEM_honor_of_the_name_never_dies_desc: "Kivotos has finally been unified under a single will. Now, our gaze turns toward the vast European continent where the natives of this world live. All territory from Iberia to the Ural Mountains must be incorporated into the living space of the 'Nord-Hinnom' civilization. The construction of this massive empire will justify all sacrifices and become the final feat to engrave all the empire's glory."
 GEM_omnipotence: "Sense of Omnipotence"
 GEM_omnipotence_desc: "Everything has succumbed to the leader's Great Feat. Now that Gehenna's myth and Germanic power have merged into one, 'impossible' does not exist in this regime's dictionary. This sense of omnipotence is the natural right given to the leader who guides the Peoples of the Gods. Now, based on this great power, an eternal epic to decorate the final chapter of history will be prepared."
 GEM_eternal_epic: "An Eternal Epic"
 GEM_eternal_epic_desc: "Even if the storms of history sweep away all narratives, the name of a leader who leaves their mark does not die. The flag of 'Nord-Hinnom' civilization must flutter beyond Europe and across the entire world. This feat will be recorded as the sole myth until the day human history ends. For the completion of this 'Eternal Epic,' the final war of conquest begins."
 GEM_the_tower: "The Tower"
 GEM_the_tower_desc: "The leader's great vision is being hindered by unexpected resistance. The feat of the 'Union of Gods' is creaking, and far from the integration of the two peoples, it is filled only with discord. Despite the leader's genius planning, this giant tower we have built is shaking from its roots."
 GEM_day_of_decision: "Day of Decision"
 GEM_day_of_decision_desc: "In the end, the old forces did not understand the new. The leader's feat was so great that ordinary people could not bear its weight and turned away in terror. The old Germanic nobility and Gehenna's conservatives have united to brand her a 'failure' and attempt to drag her from this seat. The day of decision has come. Rather than abandon the Great Feat, we shall simply burn everything."
 GEM_old_dream: "Old Dream"
 GEM_old_dream_desc: "The leader's great vision is wavering. However, instead of facing a catastrophic 'Day of Decision,' she has brought out her old dream. Now, under the new banner of 'Super-World National Liberalism,' she proclaims she will lead this Federation in a more moderate and democratic way, allowing free elections rather than oppression. This is an admission that her Great Feat has hit a wall, and simultaneously a new beginning to overcome the crisis in the most Gehennan way possible."
 #### Under Satsuki's Leadership
 ###### Normal
 GEM_focus_ended_2O_endfocus: "It's the most peaceful academy."
 GEM_focus_ended_2O_endfocus_desc: "Gehenna, the academy of freedom and chaos. But is this really for the best? The Gourmet Research Society carries out bombings, the Prefect Team and Pandemonium are in endless conflict, and students engage in gunfights for trivial reasons. All this chaos is ultimately just 'pain.' Hehe, I simply want to create an academy where everyone gets along peacefully, without conflict, understanding one another. Curing the disease called conflict and building the most ideal form of an 'Academy.' That is my only goal."
 GEM_intelligence_expansion_of_manmajeon: "Pandemonium Intelligence Expansion"
 GEM_intelligence_expansion_of_manmajeon_desc: "For my grand plan to build a peaceful academy, it is necessary to place all information about the academy in the palm of my hand. We must expand the personnel and equipment of the Intelligence Department and broaden the surveillance network to every corner of the academy. This is the first step to grasp all signs of chaos in advance and analyze all causes of conflict."
 GEM_secret_reformation: "Secret Reformation"
 GEM_secret_reformation_desc: "True reform is not achieved through speeches or debates. It must be completed quietly, like water seeping in, while no one notices. While others are immersed in noisy political games, I will complete the design of 'NK Ultra' in the deepest depths of the Intelligence Department—the perfect system to 'cure' Gehenna. This is reform in its truest sense."
 GEM_academy_nation_construction: "Academy Nation Construction"
 GEM_academy_nation_construction_desc: "True peace cannot be achieved with an old and inefficient structure. Now that I have the perfect blueprint called 'NK Ultra' in hand, it is time to build a new academy. A state where unnecessary factional fighting and inefficient administrative procedures are all removed, and every student and organization is perfectly tuned to move toward the single goal of 'Academy Peace.' This is the appearance of the new Gehenna that I will personally design and build."
 GEM_veil_politics: "Veil Politics"
 GEM_veil_politics_desc: "A ruler who stands at the front is bound to become an object of backlash and hatred. But what if one hides behind a veil and tunes everything with an invisible hand? Hehe, I will stand in the position of Chairman, but actual governance will take place in the shadows. People will believe they chose peace of their own free will, but even that will is just part of my plan. The most stable politics is making it so no one realizes it is 'politics.'"
 GEM_maybe_hypnosis_was_never_needed: "Hmm... maybe hypnosis was never needed after all."
 GEM_maybe_hypnosis_was_never_needed_desc: "Everything has become quiet. Just as I wanted, perfect peace has come to the academy. But... occasionally I think. Perhaps I was too excessive. Maybe these children could have understood each other and chosen peace themselves, even if I hadn't forcibly changed their hearts. Yes, I have decided to trust people now. 'NK Ultra' will no longer be a means of forced control, but a 'guide' to help everyone find the right path."
 GEM_but_now_it_is_too_late_to_turn_back: "But. It's already too late to turn back."
 GEM_but_now_it_is_too_late_to_turn_back_desc: "Everything has become quiet. Just as I wanted, perfect peace has come to the academy. However... occasionally a sense of anxiety brushes past me. This peace is so fragile that the moment I let go of the reins of control even for a bit, it might return to the terrible chaos of the past. A single moment of doubt can bring everything down. No, I will not waver. If it is to protect this peace forever, my methods will never change. Because it's already too late to turn back." 
 GEM_peaceful_nation_endfocus: "Peaceful Nation"
 GEM_peaceful_nation_endfocus_desc: "Finally, my long-held dream has come true. The Gehenna that was stained with hatred and conflict is no more. Of course, there were many agonies in the process of achieving this perfect peace. Whether the method I chose was truly the best, whether there was no better way... At one time, such doubts shook me. But now I do not hesitate. I chose my path, and I must believe that choice was right. To protect this peace and complete the 'Most Peaceful Nation' I dreamed of. Hehe, I will simply keep moving forward."
 GEM_peaceful_nation_endfocus_tt1: "\nIf the left choice was made:"
 GEM_peaceful_nation_endfocus_tt2: "\nIf the right choice was made:"
 ###### German Reich
 GEM_focus_ended_2_A_endfocus: "What do you think about the world beyond the mind?"
 GEM_focus_ended_2_A_endfocus_desc: "Looking at the history of the National Socialist German Workers' Party, there was the Thule Society, a union of occultists, in the process, and there is always a mythical background to Germanic nationalism. Isn't respecting them and realizing their utopia what Germans want?"
 GEM_occult_reconstruction: "Occult Reconstruction"
 GEM_occult_reconstruction_desc: "We will perfectly understand, analyze, and systematize the myths and occultism they believe in. Because irrational beliefs can be the most powerful means of control. Instead of denying their myths, we will rebuild them in the most perfect form and return them to their spiritual world. So that they may walk into paradise of their own accord."
 GEM_secret_propaganda: "Secret Propaganda"
 GEM_secret_propaganda_desc: "Visible control only breeds resistance. True harmony is perfected when people are made to 'believe' they want peace themselves. We will plant our messages in every unconscious area of society, from media and art to even the noise of the streets. People will come to loathe conflict and crave order without even knowing it themselves. This is the most perfect propaganda, fashioned by an invisible hand."
 GEM_nk_ultra_procedure_mandate: "Mandatory NK Ultra"
 GEM_nk_ultra_procedure_mandate_desc: "The spiritual stability of every citizen is the most important duty the state must take responsibility for. 'NK Ultra' will be mandated as an advanced public health policy to prevent and treat the social diseases of conflict and hatred. Through regular 'mental checkups' and 'psychological stabilization procedures,' we will help all citizens maintain a peaceful mind. Of course, no one has the right to refuse this 'treatment.' It's for everyone's happiness, after all."
 GEM_nazi_party_manmajeon_merger: "Nazi Party-Pandemonium Merger"
 GEM_nazi_party_manmajeon_merger_desc: "The two groups that used to check each other have joined hands. Does it look like a miracle? No, this is the result of 'understanding,' not a miracle. I simply helped them understand each other and move toward the common goal of 'peace.' Now Gehenna and Germany are no longer enemies. They have become comrades moving toward one great ideal."
 GEM_thule_radiance: "Radiance of Thule"
 GEM_thule_radiance_desc: "The Germans yearned for the return of their forgotten myth, 'Thule.' In that case, we just have to fulfill that dream. We will unify the Germanic people under the single myth of 'Thule.' Now, conflict due to race and origin will disappear forever, and everyone will achieve harmony as descendants of the Great Aryans."
 GEM_provable_issue: "Provable Issue"
 GEM_provable_issue_desc: "There will be those for whom myths do not work. Instead of a confusing reality, we will prove the existence of 'Paradise,' a perfect social model provable through logic. A society where all variables are controlled and everyone's happiness is guaranteed. We will prove who can dare to resist in the face of this rational vision."
 GEM_hehe_everyone_i_wish_were_a_bit_more_peaceful: "Hehe, I wish everyone were a bit more peaceful."
 GEM_hehe_everyone_i_wish_were_a_bit_more_peaceful_desc: "Finally, everything has become quiet. There is no quarreling in the streets, no hatred in the hearts, and a gentle smile is on everyone's face. The world I dreamed of is right here. Of course, in the process, I had to prune away a few unnecessary things—like painful free will, for instance. But for this perfect peace, isn't that a trivial price?"
 GEM_aryan_spirit: "Aryan Spirit"
 GEM_aryan_spirit_desc: "Look. There are no more Gehennans, no more Germans. Only a single people sharing the pure and noble 'Aryan Spirit' exists. Under our rule, they have finally overcome all conflicts and achieved spiritual unity. Let us look upon what a peaceful sight this is."
 GEM_choir: "Choir"
 GEM_choir_desc: "Like a choir where all voices form a single harmony, our society has achieved perfect accord. Each plays the most efficient melody in their place, and all of those gather to complete the great symphony called 'Paradise.' Discord no longer exists. There could be no music more beautiful than this."
 ###### Federation
 GEM_focus_ended_2_B_endfocus: "Alright, let's build a wonderful Federation. Hehe."
 GEM_focus_ended_2_B_endfocus_desc: "Hehe, Gehenna and Germany. Noisy children are gathering to create even more noise. But it's okay. This new stage called the Federation is a very good environment to realize my ideals. A wonderful Federation where everyone holds hands and smiles happily. I'll personally make it and show you."
 GEM_bipartisan_control: "Bipartisan Control"
 GEM_bipartisan_control_desc: "Directly suppressing the political confrontation between the Gehenna faction and the German faction, the two largest factions in the Federation, is inefficient. Instead, we secretly intervene in the leadership and agendas of both parties to induce their competition within a controllable range. Through this, while maintaining surface-level political activity, we fundamentally prevent radical clashes that could shake the foundation of the state."
 GEM_node_control: "Node Dominance"
 GEM_node_control_desc: "Identify the core nodes of politics, economy, media, and military that constitute the state, and mobilize the resources of the Intelligence Department to secure control over those points. By seizing the major arteries of the state, we will be able to lead the entire Federation in the desired direction with minimal resistance."
 GEM_secret_approach: "Secret Approach"
 GEM_secret_approach_desc: "Radical reform always brings about public backlash. Therefore, all changes must be carried out in a way that naturally permeates the social system while the public does not perceive it. The secret approach aims to minimize the possibility of resistance and redesign the state in the most stable manner."
 GEM_establish_national_intelligence_agency: "Establish National Intelligence Agency"
 GEM_establish_national_intelligence_agency_desc: "The existing Pandemonium Intelligence Department alone has limits in managing the entire Federation. We will establish a new 'National Intelligence Agency' encompassing both Gehenna and Germany to unify information gathering and secret operations, maximizing efficiency. This institution will be the invisible shield protecting the stability of the Federation."
 GEM_leader_behind_the_curtain: "Ruler Behind the Curtain"
 GEM_leader_behind_the_curtain_desc: "Public attention is always concentrated on the individual leader. To avoid such burdens and risks, we put forward a figure with high public recognition as 'President' to serve as the official face of the Federation. Actual state operation takes place behind the curtain, maintaining stable and consistent governance through this."
 GEM_president_makoto: "President Makoto" #Choice 1
 GEM_president_makoto_desc: "Putting Hanuma Makoto forward as President is effective for drawing public attention, but it comes with calculated risks. Satsuki only applied weak mental interference to her out of personal feelings, and as a result, Makoto's impossible behavior and unyielding arrogance still lie dormant. She is the most flamboyant puppet, and simultaneously the most dangerous variable that could shake this perfect system."
 GEM_president_chiaki: "President Chiaki" #Choice 1
 GEM_president_chiaki_desc: "Motomiya Chiaki's positive energy and media mastery are advantageous for renewing the state's image and securing public support. She will become an ideal symbol representing the bright future of the Federation."
 GEM_president_iroha: "President Iroha" #Choice 1
 GEM_president_iroha_desc: "Natsume Iroha has a disinterest in politics and a tendency toward maintaining the status quo, making her the most compliant leader for backroom control. Her existence will give the impression that the state is being maintained stably without radical changes."
 GEM_extraordinary_genius: "Extraordinary Genius" #Focus under President Hanuma Makoto
 GEM_extraordinary_genius_desc: "When everyone moves with the same will, only she will be able to resist. Her bouncy ideas and most arrogant habits will be the core key for Hanuma Makoto herself to realize that something has gone wrong. Regardless of whether she is satisfied with the given leadership position or is dissatisfied and overturns everything, such actions will add a splash of color to the monochromatic state."
 GEM_ruler_propaganda: "Leader Propaganda" #Common for Chiaki / Makoto
 GEM_ruler_propaganda_desc: "Launch a massive propaganda campaign to elevate the newly elected President into a symbol of national unity. Establish a national identity through the President's image and concentrate public attention on symbols rather than the essence of politics."
 GEM_economic_collectivization: "Economic Collectivization" #Common for Chiaki / Iroha
 GEM_economic_collectivization_desc: "Promote economic collectivization that places major industries and capital within the Federation under state control. Under the pretext of 'common prosperity,' eliminate economic instability factors and build a system where the state perfectly manages the flow of all resources."
 GEM_national_harmony_association: "National Harmony Association" #Common for all Presidents
 GEM_national_harmony_association_desc: "Establish a 'National Harmony Association' that all citizens are mandatory to join. This organization will foster a sense of community through social exchange and volunteer activities, while functioning as a core means to spread the state's governing ideology and manage social public opinion."
 GEM_B_peaceful_country: "Peaceful Federation" #After National Harmony Association
 GEM_B_peaceful_country_desc: "Finally, all plans are complete. Conflict has vanished, the economy is stable, and the citizens feel satisfaction within the harmonious order presented by the state. Superficially, the most ideal form of a peaceful Federation has been completed."
 GEM_forced_cancellation_of_nk_ultra: "Forced Cancellation of NK Ultra" #Focus under President Hanuma Makoto
 GEM_forced_cancellation_of_nk_ultra_desc: "\"...Something is strange. It's definitely strange. The great Hanuma Makoto would never have acted like this. This great ruler feeling a sense of being ruled by someone? Seriously, this is.\"\n\n§O\"Finally, it feels like I've returned to being the ruler.\"§!"
 GEM_ruler_behind_the_curtain_modifed: "Ruler Behind the Curtain"
 GEM_president_makoto_flag: "Completed §Y$GEM_president_makoto$§! focus"
 #### Under Iroha's Leadership
 ###### Normal
 GEM_focus_ended_3O_endfocus: "I'm the Federation President, but I don't want to work."
 GEM_federal_basic_law_enactment: "Enactment of Federal Basic Law"
 GEM_federal_basic_law_enactment_flag: "Completed §Y$GEM_federal_basic_law_enactment$§! focus"
 GEM_corporatist_economy: "Corporatist Economy"
 GEM_state_level_economic_plan: "State-Level Economic Plan"
 GEM_over_flashy_reforms: "Rather than flashy plans..."
 GEM_over_flashy_reforms_flag: "Completed §Y$GEM_over_flashy_reforms$§! focus"
 GEM_practical_results: "Substantial results!"
 GEM_practical_results_flag: "Completed §Y$GEM_practical_results$§! focus"
 GEM_retirement_of_a_giant: "Retirement of a Giant"
 GEM_retirement_of_a_giant_tt: "The character selected by the event will inherit some of the traits obtained by Natsume Iroha!"
 GEM_reelection_decision: "Reelection Decision"
 ###### German Reich
 GEM_focus_ended_3_A_endfocus: "Strengthening the Federal Government"
 GEM_focus_ended_3_A_endfocus_desc: "The launch of the Federation is only the beginning. The powers scattered among the states and the complex administrative systems that Natsume Iroha herself had granted must be reduced now that Iroha has taken full power. Now is the time to concentrate all power in the Federal Government and move the state with clockwork precision."
 GEM_union_of_parties: "Union of Parties"
 GEM_union_of_parties_desc: "The Nazi Party, a powerful opposition force, remains a threat that encourages division of dominance. To isolate them and weaken their power, we will integrate all other moderate German parties and Gehenna parties into one giant 'Federal Ruling Party,' building an unassailable political force."
 GEM_night_of_roses: "Night of Roses"
 GEM_night_of_roses_desc: "The thorns of nationalism that threaten the harmony of a multi-ethnic state must be pulled out. Overnight, all nationalist leaders opposing the Federation will be purged at once. Through this night, which will be decorated with roses rather than blood, the state will finally become pure."
 GEM_german_federal_president: "German Federal President"
 GEM_german_federal_president_desc: "This new state needs a single focal point to silence division and encompass everyone. We will create the position of 'German Federal President' and nominate Natsume Iroha for it, granting her absolute authority to determine the future of the nation."
 GEM_the_glorious_plan: "That Glorious Plan"
 GEM_the_glorious_plan_desc: "To stably maintain the regime and attract approval ratings among various threatening political rivals, Natsume Iroha will pass visible and flashy reforms. This is not her style, but the political situation forces her hand."
 GEM_reelection_law: "Reelection Law"
 GEM_reelection_law_desc: "A great task is not achieved in a moment. To guarantee the stability of the state and complete numerous political reforms, we abolish the term limits for the Federal President. Natsume Iroha will lead us forever, as long as the state needs her."
 GEM_leader_of_the_oak: "Leader of the Oak"
 GEM_leader_of_the_oak_desc: "Like the oak tree, a symbol of the German people, Natsume Iroha is now the unwavering center of the 'New Germans.' By nominating her as the 'Leader of the Oak,' we proclaim that her very existence is the identity and focal point of the new German people."
 GEM_hasrant: "Herzland"
 GEM_hasrant_desc: "Past capitals are bound by memories of old hatred and division. We will build a new capital on a blank slate, 'Herzland,' which will become the heart of the world. This great city will symbolize the eternal glory of our multi-ethnic Federation."
 herzland: "Herzland"
 GEM_hasrant_idea_deff: "Herzland Infrastructure Work"
 GEM_hasrant_idea_deff_tt: "This national spirit is removed upon completing the '§Y$GEM_hasrant$§!' focus."
 GEM_germania_idea_deff: "Germania Infrastructure Work"
 GEM_germania_idea_deff_tt: "This national spirit is removed upon completing the '§Y$GEM_approval_of_germania_project$§!' focus."
 GEM_pioneer: "Pioneer"
 GEM_pioneer_desc: "We are the great pioneers who melted the fragments of two worlds to create a new people. Our state, unified under one identity and one leader, will be the milestone of a new era that all others must follow."
 GEM_architect_of_the_new_world: "Architect of the New World"
 GEM_architect_of_the_new_world_desc: "President Natsume Iroha, who created order out of chaos and built a new utopia upon the ruins of the old world. She is now not just a leader, but the 'Architect of the New World.' Under her design, our civilization will write a new history."
 ###### Federation
 GEM_focus_ended_3_B_endfocus: "Jointly Elected Leader"
 GEM_focus_ended_3_B_endfocus_desc: "The two factions leading the state have jointly recognized and elected our leader through a historic compromise. Now, the [ROOT.GetLeader] National President will lead our state's historic compromise forward."
 GEM_neutral_presidency: "Neutral Presidency"
 GEM_neutral_presidency_desc: "A President elected with the support of both parties cannot take a side. We will establish the presidency as a neutral and transcendent institution standing above factional politics. The President will oversee as a referee rather than a player, ensuring the rules of the Federation are fairly observed."
 GEM_finding_ideology_in_cooperation: "Finding Ideology in Cooperation"
 GEM_finding_ideology_in_cooperation_desc: "Our ideology is not born at a desk. Through the process of the two peoples, Gehenna and Germany, operating the state together, we will discover common values and create new thoughts. Within the practice of cooperation, our own new ideology will reveal itself."
 GEM_expansion_of_state_authority: "Expansion of State Authority"
 GEM_expansion_of_state_authority_desc: "A strong Federation is built upon strong and autonomous states. To prevent excessive intervention by the central government and respect the unique traditions and voices of each region, we will transfer more authority to each state government."
 GEM_expansion_of_federal_government_authority: "Expansion of Federal Government Authority"
 GEM_expansion_of_federal_government_authority_desc: "A state with two hearts is bound to be divided. To overcome inefficient regionalism and carry out a unified national will, we will significantly strengthen the authority of the Federal Government to establish a centralized governing system."
 GEM_corporatist_economy_b: "Corporatist Economy"
 GEM_corporatist_economy_b_desc: "We seek a third way that is neither the chaos of the free market nor the rigidity of state control. By introducing a corporatist economy where labor, industry, and the government plan and lead the economy together through corporations representing each people, we will replace conflict with cooperation."
 GEM_weimar_presidential_succession: "Weimar Presidential Succession"
 GEM_weimar_presidential_succession_desc: "To solidify our legitimacy and connect with Germany's democratic heritage, we proclaim that the Federal Presidency inherits the legitimacy of the Weimar Republic's presidency. Our leader is not a new ruler, but a successor who restored the broken tradition of democracy."
 GEM_german_fuehrer_succession: "German Führer Succession"
 GEM_german_fuehrer_succession_desc: "For national unity and strong leadership, we will not ignore Germany's historical symbols. By declaring that the Federal Presidency inherits the authority of the 'Führer,' it will establish itself as a symbol of powerful central power that does not tolerate division."
 GEM_coordinator: "Coordinator"
 GEM_coordinator_desc: "The role of the President has finally been defined. She is neither the representative of the ruling party nor the enemy of the opposition. She is the 'Coordinator' who tunes the interests of the two major factions and manages the great machine called the state so it does not stop. Her quiet leadership is the true strength sustaining this Federation."

 #### Under Chiaki's Leadership
 ###### Normal
 GEM_focus_ended_4O_endfocus: "Publicity and Propaganda"
 GEM_focus_ended_4O_endfocus_desc: "Politics is not a record of facts, but the editing of perception. Motomiya Chiaki defined the first step of state operation as the 'Seizure of the Message.' We will pull out strong headlines that capture the public's eye and define this chaotic era through heart-pounding agitation rather than boring truths. Because the pen is stronger than the sword, and the microphone reaches further than the gun."

 GEM_practical_technocratic_network: "Practical Technocratic Network"
 GEM_practical_technocratic_network_desc: "Bureaucrats who only engage in armchair theories are no different from old magazines that should have ceased publication. Only practitioners who run on the ground can support the secretary's drive. Chiaki gathers capable talents who can produce results immediately while ignoring complex procedures to build an independent administrative network. Now the state will run without rest, like a non-stop printing press."

 GEM_pioneer_of_innovation: "Pioneer of Innovation"
 GEM_pioneer_of_innovation_desc: "Being bound by old customs is not the way of a 'genius.' We must become pioneers of innovation who boldly smash the existing framework. We will boldly edit the inefficient systems spread throughout society with 'the power of the desk' and fill those empty spaces with brilliant and new ideas. To us, today being the same as yesterday is a dereliction of duty."

 GEM_propaganda_propaganda_propaganda: "Propaganda, Propaganda, Propaganda!"
 GEM_propaganda_propaganda_propaganda_desc: "Did someone say important things should be said three times? No, they must be repeated until the public believes them! From street posters to radio waves and the front page of the morning newspaper, we will pour out our vision through every possible medium. There is no place Chiaki's voice does not reach. This is not simple promotion, but a massive wave of information that penetrates even the national unconscious."

 GEM_gehenna_everywhere: "Gehenna Everywhere"
 GEM_gehenna_everywhere_desc: "Gehenna is not just an academy. It is a free and dynamic 'style.' We will transplant Gehenna's uniquely vibrant culture throughout society, refreshing the stiff atmosphere of this land. The spirit of Gehenna, having penetrated into daily life, will become the most natural adhesive binding the two heterogeneous groups together."

 GEM_trend_leading: "Trend Leading"
 GEM_trend_leading_desc: "Those who follow can never decorate the front page. We must go beyond reading the flow of the era and become 'Trend Setters' who create the trend itself. By throwing out the most advanced agendas and preempting issues in politics, economy, and culture, we will make the public follow behind us of their own accord. Standing at the center of the issue—that is power."

 GEM_international_brand_marketing: "International Brand Marketing"
 GEM_international_brand_marketing_desc: "A state is also a product. No matter how excellent the inside is, it won't sell if the packaging is a mess. Chiaki planned to sophisticatedly rebrand the national image with her unique sense and sell it to the international community. An attractive national brand will be the best asset to break diplomatic isolation and attract potential investors and allies."

 GEM_corporate_tax_deduction: "Corporate Tax Deduction"
 GEM_corporate_tax_deduction_desc: "To create a scoop, coverage funds are necessary. We grant bold tax benefits so that corporations can operate freely and create national wealth. This is not a special favor. It is a rational incentive to make capital invest in the giant project called the state. Because kindness comes from a full storehouse, and great politics comes from a generous budget."

 GEM_populist_leader: "Populist Leader"
 GEM_populist_leader_desc: "Complex theories or old-fashioned morals cannot move the hearts of the public. Chiaki communicates directly with the people without going through intermediate steps and represents their desires. Her language, sometimes provocative and sometimes touching, makes the public enthusiastic. The ability to pinpoint exactly what the public wants—that is the most powerful weapon in the democratic era."

 GEM_philosopher_king: "Philosopher King"
 GEM_philosopher_king_desc: "Ancient philosophers said that a country should be ruled by wisdom. In modern times, isn't Chiaki, who sees through all information and flows of the world and finds the perfect 'edit point,' the leader who best fits that ideal? Her genius intuition and insight are the compass presenting the only correct answer for the state to move forward in the confusing situation."

 GEM_leader_of_the_people: "Leader of the People"
 GEM_leader_of_the_people_desc: "Now Motomiya Chiaki has gone beyond being a mere secretary or politician. She is an icon of the era and the very 'star' the people yearned for. Public opinion dances at her word, and the state moves at her gesture. Beyond the ideologies of left and right, the state finally unites through her as the focal point, preparing for the next stage's giant leap."

 GEM_propaganda_propaganda_propaganda_flag: "Completed §Y$GEM_propaganda_propaganda_propaganda$§! focus"
 GEM_trend_leading_flag: "Completed §Y$GEM_trend_leading$§! focus"
 ###### German Reich
 GEM_focus_ended_4_A_endfocus: "Inauguration of the Führer"
 GEM_focus_ended_4_A_endfocus_desc: "The power vacuum in the German Reich has ended. To inherit the legacy of former Chairman Hanuma Makoto and settle the national chaos, Secretary Motomiya Chiaki officially inaugurates as the 'Führer.' This is not a mere succession of position, but a declaration of the birth of a single leader holding the editing rights of the state. Under her pen, the history of Germany will be newly corrected."

 GEM_rune_script_adoption_4A: "Adoption of Rune Script"
 GEM_rune_script_adoption_4A_desc: "The Swastika, symbolizing past failures, must be discarded. We adopt the 'Odal Rune,' symbolizing the heritage and mystery of ancient Germans, as the new national symbol. This is a high-level symbolic manipulation to differentiate from the Nazi Party while securing the justification of inheriting the origins of the Germanic people, strengthening the occult authority of the regime."

 GEM_weimar_lottery: "Weimar Restoration"
 GEM_weimar_lottery_desc: "Stable legitimacy is needed more than radical symbols at this point. Führer Chiaki revived the Black-Red-Gold tricolor flag, the legacy of the Weimar Republic, proclaiming that the current regime is the legitimate successor of Germany rather than a barbaric conqueror. Such conciliatory measures will be the most realistic way to lead international recognition and silence the backlash from internal moderates."

 GEM_motomiya_socialism: "Motomiya Socialism"
 GEM_motomiya_socialism_desc: "Existing left-right ideologies alone cannot break through the complex current situation. 'Motomiya Socialism' is a unique third way combining powerful state-led controlled economy and unconventional welfare policies for the public. This system, putting intuitive benefits and propaganda ahead of complex theories, will be a populist governing model seizing state affairs based on overwhelming public support."

 GEM_left_wing_grand_coalition: "Grand Coalition of the Left Wing"
 GEM_left_wing_grand_coalition_desc: "To overcome the limits of solo governance, Führer Chiaki promotes a grand coalition with left-wing forces including the Communist Party of Germany and the Social Democratic Party of Germany. This is a strategic alliance to absorb dispersed political forces into the institutional sphere to secure momentum for state operation rather than ideological compromise. Diverse voices will be controlled and tuned through one giant megaphone."

 GEM_denazification_movement_4A: "Denazification"
 GEM_denazification_movement_4A_desc: "To secure the legitimacy of the new system, a massive purge begins against the remnants of the old era, the Nazi Party and its followers. 'Denazification' goes beyond simple settlement of the past; it is an essential task to remove the regime's only alternative force and wipe the political landscape clean. Now their existence will be permanently deleted from the pages of the nation."

 GEM_clandestine_communist_group_4A: "Clandestine Communist Group"
 GEM_clandestine_communist_group_4A_desc: "Remnants of Nazism are merely manageable old evils, but the Marxist-Leninists working underground are fatal toxins shaking the foundation of the state. Führer Chiaki judged that their 'scientific socialism' is the biggest threat hindering our efficient state editing. We will concentrate all counterintelligence capabilities on permanently isolating and exterminating these red revolutionaries from society, even if it means deferring the disposal of Nazi remnants or using them."

 GEM_small_gehenna_academy_protection: "Little Gehenna Academy Protection"
 GEM_small_gehenna_academy_protection_desc: "Gehenna Academy's identity must not be damaged even in the expansion of the state. Chiaki designated the Academy Autonomous District as a special protection zone that state power cannot carelessly invade. This is a safety device to preserve our fundamental roots even in a confusing situation and leave a spiritual refuge to return to at any time."

 GEM_gehenna_student_council_representative: "Gehenna Student Council Representative"
 GEM_gehenna_student_council_representative_desc: "A system is needed to efficiently connect the dual status of head of state and academy student council president. By elevating the Gehenna Student Council to an institution representing the state's highest decision-making body, we establish a hotline where students' opinions can be directly reflected in state affairs. This is an innovative governance structure converting the academy's dynamism into state governing energy."

 GEM_whatisthis_4O_tt: "This focus will be changed to a complete focus tree upon completing the §Y$GEM_new_system_and_new_state_construction$§! focus."
 GEM_whatisthis_4O_tooltip: "§gThe focus tree will change depending on which focus you completed among §Y$GEM_rune_script_adoption_4A$§!, §Y$GEM_weimar_lottery$§! and §Y$GEM_left_wing_grand_coalition$§!, §Y$GEM_denazification_movement_4A$§!, §Y$GEM_clandestine_communist_group_4A$§!.§!"
 GEM_whatisthis_4O: "???"

 GEM_national_editor_4O_1: "Establishment of the German Social Republic"
 GEM_national_editor_4O_1_desc: "The authority of the state and the inclusiveness of the left-wing grand coalition have combined to establish the 'German Social Republic.' This state pursues national pride and social equality simultaneously, aiming for a powerful welfare community where the state takes responsibility for the lives of the citizens. This is the result of Secretary Chiaki materializing Chairman Makoto's ideals into realistic policies."

 GEM_national_editor_4O_2: "National President Chiaki"
 GEM_national_editor_4O_2_desc: "Motomiya Chiaki, who removed political enemies through denazification and completely collapsed the status of the Nazi Party, inaugurates as the 'National President.' Grasping constitutional authority and extra-constitutional authority simultaneously, she reorganized the confusing Germany into a powerful centralized system. This is an attempt to restore order through legal dictatorship."

 GEM_national_editor_4O_3: "Advocacy of National Corporatism"
 GEM_national_editor_4O_3_desc: "To crush the destructive delusion of 'class struggle' shouted by communists, we present a powerful alternative: 'National Corporatism.' This system organizes all strata of society into 'corporations' under state control to concentrate all capabilities on motherland mobilization. The 'National Corporatist German Patriot Party' will completely absorb the support base of the existing Nazi Party through this new ideology and solidify its position as the sole alternative force."

 GEM_national_editor_4O_4: "Establishment of the German People's Republic"
 GEM_national_editor_4O_4_desc: "The legacy of Weimar and the revolutionism of the left have combined to proclaim the 'German People's Republic,' where the people are masters. Führer Chiaki denies the authority of the old system, communicates directly with the public, and seeks to resolve social inequality through unconventional distribution policies. This is an experiment of populist democracy that breaks old customs and makes the public's aspirations the center of state affairs."

 GEM_national_editor_4O_5: "Chiaki Constitution"
 GEM_national_editor_4O_5_desc: "The government, having completed political purges and inheriting Weimar's legality, promulgated the 'Chiaki Constitution,' which compiled Führer Chiaki's governing philosophy. This constitution grants the leader full power to operate the state extraordinarily in times of crisis, institutionally guaranteeing efficient administration and strong leadership. This is a legal authoritarian system completed through democratic procedures."

 GEM_national_editor_4O_6: "Black-Red-Gold Coalition"
 GEM_national_editor_4O_6_desc: "The failure of the Weimar Republic stemmed from the tolerance that allowed freedom even to those who sought to overthrow the system. National President Chiaki formed a 'Black-Red-Gold Coalition' with conservatives and centrists, proclaiming 'Defensive Democracy' to legally eradicate far-left forces threatening liberal democracy. This massive red cleanup operation, mobilizing all legal authority of the parliament, will be democracy's cold decision to protect order."

 ###### Federation
 GEM_focus_ended_4_B_endfocus: "Toward a World Empire"
 GEM_focus_ended_4_B_endfocus_desc: "The stage called Europe is now too narrow to contain our Federation's narrative. The ink is sufficient, the nib is sharply honed, and the people's aspirations desire the next page. Now we will go beyond the boundaries of the continent and exercise our 'editing rights' over the giant manuscript called the entire world."

 GEM_push_for_nazi_party_closure: "Promote Nazi Party Closure"
 GEM_push_for_nazi_party_closure_desc: "The lifespan of the Nazi remnants parasitizing within the 'German Opposition' under the pretext of a two-party system ends here. Their old and trite racism repertoire now only gives readers a sense of fatigue. Secretary-General Chiaki invokes the authority of the Office for the Protection of the Constitution to order a 'Final Correction Work' to forcibly dissolve the anti-democratic and anachronistic Nazi Party and return its assets to the national treasury."

 GEM_domestic_antifa_formation: "Formation of Domestic Antifa"
 GEM_domestic_antifa_formation_desc: "There is a need to physically clean the remnants of fascism from the streets. We organize a government-controlled 'Antifascist Action (Antifa)' by rallying Pandemonium's action members and Germany's leftist youth. They will 'actively critique' the specters of the old era with clubs and Molotov cocktails under the tacit approval of the Gehenna Prefect Team... no, the public security authorities."

 GEM_denazification_4B: "Denazification"
 GEM_denazification_4B_desc: "Completely erase the stains of the Swastika embedded throughout society. Hunt out Nazi collaborators in public office, education, the judiciary, and the military, and sentence them to damnatio memoriae. This is not a simple purge, but a thorough editing process to leave not even a trace of the villains in our new national narrative."

 GEM_neubolk_declaration: "'Neubolk' Declaration"
 GEM_neubolk_declaration_desc: "We declare: through the combination of Gehenna's free spirit and Germany's steel-like discipline, the 'Neubolk'—the New People—has been born! Bloodline or background do not matter. Only those who are loyal under the flag of the Federation and enjoy our culture earn the qualification to become true protagonists of this new era."

 GEM_autobahn_expansion_in_trinity: "Expansion of Autobahn in Trinity"
 GEM_autobahn_expansion_in_trinity_desc: "Time to push over the antique but inefficient gardens and alleys of the occupied Trinity. Construct an 8-lane round-trip Autobahn across their elegant tea party venues. The Federation's armored vehicles and logistics trucks racing with a roar will be the most certain visual propaganda overwriting their 'culture' with our 'efficiency.'"

 GEM_minority_law: "Minority Law"
 GEM_minority_law_desc: "As the Federation's territory widens, people with diverse backgrounds have entered our fence. We enact the 'Minority Law' to guarantee legal protection and citizenship to all those who wish to join the Neubolk. Provided, of course, that they conform to our 'corrected' order."

 GEM_entrenchment_of_two_party_system: "Institutionalization of the Two-Party System"
 GEM_entrenchment_of_two_party_system_desc: "Is there really a need to get rid of the Nazi Party? A good story always needs a rival that creates tension. We recognize the Nazi-leaning German opposition as a partner within the institutional sphere and sublimate the constant political confrontation with them into a 'show.' The people will forget their dissatisfaction with the system while being enthusiastic about this intense drama unfolding in the parliament."

 GEM_imitation_of_german_national_community: "Imitation of German National Community"
 GEM_imitation_of_german_national_community_desc: "Let's satisfy the illusion of the 'People's Community (Volksgemeinschaft)' that old Germans miss so much. Except, at its center will be the Secretary-General, not the Führer. Through massive crowd rallies emphasizing labor, leisure, and unity, we must artificially create a sense of bond between the two groups. Even if the appearance is an imitation of Nazism, the content will strictly serve Gehenna's interests."

 GEM_strong_populist_politics: "Strong Populist Government"
 GEM_strong_populist_politics_desc: "The public wants immediate bread, circuses, and chocolate rather than complex ideologies. Expand public welfare by investing massive budgets and capture the eyes and ears of the people with flashy festivals and propaganda. If approval ratings can be bought with money, there is no cheaper governing cost than that."

 GEM_global_struggle: "Global Struggle"
 GEM_global_struggle_desc: "The best way to cover internal contradictions is to create an external enemy. We divide the world into 'us' and 'them' and incite constant struggle. Only the sense of crisis from a never-ending war will be the most powerful adhesive keeping this heterogeneous Federation together."

 GEM_revival_of_lebensraum: "Repromotion of Lebensraum"
 GEM_revival_of_lebensraum_desc: "Cramped territory is insufficient to contain our greatness. By modernly reinterpreting the past 'Living Space' theory, we justify new territorial expansion to accommodate the Federation's resources and personnel. This is not a simple invasion. It is a strictly literary and inevitable 'space acquisition' to secure the paper to record our narrative."
 GEM_codified_ethnic_distinction: "Codification of Ethnic Distinction"
 GEM_codified_ethnic_distinction_desc: "Recognizing differences is the beginning of order. Those with horns and those without, those with mystery and those without. We clearly distinguish the roles and duties of each group through legislation. This is not discrimination. It is a directing technique to reduce chaos on the stage of society by assigning roles that fit each 'character.'"

 GEM_nord_hinnom_civilization_4B: "Nord-Hinnom Civilization"
 GEM_nord_hinnom_civilization_4B_desc: "The spirits of the two great peoples must be combined under a single name. Combining 'Nord,' derived from northern mythology, and 'Hinnom,' the source of Gehenna, we create a new ruling civilization: 'Nord-Hinnom.' This new culture will be a privilege enjoyed only by the two ruling peoples and a noble symbol distinguishing them from other inferior races. Art, philosophy, and rituals will all be reorganized under this new name."

 GEM_deutsche_federation_declaration: "Deutsche Federation"
 GEM_deutsche_federation_declaration_desc: "We aim for a rational and modern constitutional state where the Germany of the past and the Gehenna of the present are fused. With the proclamation of the 'Deutsche Federation,' Motomiya Chiaki steps down from the title of Secretary-General and inaugurates as the first 'President' of the Federation. This is the launch of the most powerful and advanced republic in history, born of the combination of Kivotos's mystery and Europe's reason."

 GEM_federation_of_three_peoples: "Federation of Three Peoples"
 GEM_federation_of_three_peoples_desc: "Gehenna's freedom, Germany's discipline, and the culture of the defeated Trinity. These three elements mesh like one giant gear. We break the framework of the nation-state and proclaim the 'Federation of Three Peoples.' Now Chiaki's Secretariat will go beyond being a mere head of state and command an unprecedented super-bureaucratic empire as the 'Federal General Manager' tuning these three giant peoples."

 GEM_intercultural_integration: "Intercultural Integration"
 GEM_intercultural_integration_desc: "Northern runes and Gehenna's demonology combine, and Wagner's operas are rearranged into heavy metal. Do not fear the collision of two different cultures. Because from that noise, our own unique and overwhelming 'Imperial Culture' that no one can imitate will be born."
 GEM_approval_of_germania_project: "Promote Germania Project"
 GEM_approval_of_germania_project_desc: "Bring the World Capital Germania plan that Albert Speer had conceived. Of course, we won't use it as is. Mocking Trinity's Eden Treaty, we rebuild Berlin into a grand city of mystery covered with domes, marble, and magic. This will be the manifestation of Pandemonium descended to earth."
 GEM_approval_of_herzland_project: "Promote Herzland Project"
 GEM_approval_of_herzland_project_desc: "Is there really a need to obsess over old Berlin? We develop the Hessen region, which had been operated as Gehenna's heart since before the Great Migration, as the state's new central district, 'Herzland.' This place, where state-of-the-art administrative facilities, magic laboratories, and a massive academy city will be established, will pulsate as the new heart and brain of the Federation."
 GEM_world_capital: "World Capital"
 GEM_world_capital_desc: "Did they say all roads lead to Rome? Now all roads lead to our capital. The place where the world's politics, economy, and culture converge. This is not just a city. It is the center of the world where all history of the planet Earth is edited and published, and where Chiaki's office is located."
 GEM_advance_federation: "Advance, Federation!"
 GEM_advance_federation_desc: "Internal organization is over. Now is the time to turn our gaze outward. Those beyond the borders are beings full of 'typos' who have not yet received our great correction. All troops, advance! Where the flag of the Federation is planted will soon become the front line of civilization."
 GEM_advance_federation_flag: "Completed §Y$GEM_advance_federation$§! focus"
 GEM_horn_is_the_new_wing: "Horn is the New Wing"
 GEM_horn_is_the_new_wing_desc: "For a long time, the pride of the German people resided in the forcefully spread wings of the eagle. But now we face another symbol of pride. The leader's horns rising firmly through the wind and rain. They are no longer objects of heterogeneous fear. People now see in those solid horns the steel-like will protecting us and the indomitable strength that does not yield to any hardship."
 GEM_comprehensive_anti_discrimination_law: "Comprehensive Anti-Discrimination Law"
 GEM_comprehensive_anti_discrimination_law_desc: "The General Manager's desk is piled with numerous petitions. Beastmen, robots, and countless conquered people with different skin colors and languages. Tolerance is essential to maintain a giant Federation. We prohibit discrimination against all intelligent life forms. If you pay taxes to the Federation and swear loyalty, everyone—whether dog, robot, or human—is an equal 'subject of management.' This is the essence of Kivotos-style bureaucracy."

