 GEH_Manmajun_Bupae_desc: "The corruption of Pandemonium is famous enough for every academy to know.\nStarting with the conflict between the Prefect Team and Pandemonium, Pandemonium's corruption has become an open secret. There are many issues, particularly cutting the Prefect Team's budget or imposing ridiculous taxes, but because students are indifferent to politics or simply don't pay taxes, the illicit funds are all covered by the Prefect Team's slashed budget."
