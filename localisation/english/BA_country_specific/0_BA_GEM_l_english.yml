 GEM_demonstration_of_military_achievements: "Demonstration of Military Achievements"
 GEM_demonstration_of_military_achievements_desc: "Our history is full of great military achievements. By recognizing what our army has currently achieved as another great military achievement, we can boost their morale and further increase their loyalty."
 GEM_demonstration_of_military_achievements_trigger: "One of the following must be true:\n   Number of subjects greater than §Y2§!\n   Occupied states in §YEurope§! greater than §Y19§!"
