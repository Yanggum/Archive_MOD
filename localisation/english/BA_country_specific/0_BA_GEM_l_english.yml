 GEM_ibuki_system_action_1_icon_tt: "§tAmbition§!\nTanga Ibuki's ambition. Represents the drive toward grander dreams, higher goals, and achieving feats through war; it is the ability of an agitator to lead others to follow their grand designs.\n\n§g - This icon was sourced from 'League of Legends'.§!"
 GEM_ibuki_system_action_2_icon_tt: "§ODignity§!\nTanga Ibuki's dignity. Represents the pursuit of authority, power, and being revered by others; it is the ability of a schemer to manipulate and manage people.\n\n§g - This icon was sourced from 'League of Legends'.§!"
 GEM_ibuki_system_action_3_icon_tt: "§1Efficiency§!\nTanga Ibuki's efficiency. Represents the pursuit of organization, efficient administration, and cold-headedness in achieving goals; it is the ability of an administrator to manage the system.\n\n§g - This icon was sourced from 'League of Legends'.§!"
 GEM_ibuki_system_action_4_icon_tt: "§CIdeal§!\nTanga Ibuki's ideals. Represents inner dreams, fairy-tale idealism, and the degree of mediating conflict and inducing harmony; it is the ability of a dreamer to assimilate those around them to follow their vision.\n\n§g - This icon was sourced from 'League of Legends'.§!"

