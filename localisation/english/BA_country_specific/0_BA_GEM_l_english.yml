# # These are dialogue examples for Hanuma Makoto, the Chairman of Pandemonium Society.
# At last, I have descended! Kikikik, Hanuma Makoto-sama of the Pandemonium Society has personally come to visit. Receive me with the utmost hospitality.
# Kikikik. Well, fine. Then let us begin the tale of Makoto-sama's great achievements.
# You're late. A revolutionary scheme for the conquest of Kivotos has just come to mind.
# Great achievements are not built in a single night. For Makoto-sama shall never give up.
# Listen closely to this one's speech!
# Kikikit! Fire! ...Eh? It's, it's backwards!?
# As expected, even for someone like me who has reached the pinnacle of leadership, there was still room for growth. Kishishit!
# This atmosphere... it's quite decent, isn't it?
# In order to surely capture that Iroha brat...
# This is a shop specially opened to commemorate the Gehenna Party. Feel free to look around. Kikit.
#
#
# # These are dialogue examples for Natsume Iroha, the Pandemonium Society councilor and tank commander (and practically Makoto's caretaker and secretary).
# *Sigh*, how did it even come to this? Well, since it’s turned out like this, I’ll do what needs to be done.
# *Sigh*, what is it? Duty...? Yes, yes. Since I was asked, I'll do my best.
# *Sigh*... Shall we go slack off somewhere else for a bit?
# ...I *am* working hard, you know?
# It's a pain, but... *sigh*, it can't be helped.
# What is it? I've already finished everything I needed to do.
# What brings you here? Is there something you need help with?
# *Sigh*, seriously... Super Invincible Ironclad Toramaru... Sortieing now~
# Slacking off... It doesn't look like they're going to let me. It can't be helped...
# Thank you... What? Even I give normal thanks once in a while.
# I see, it looks like we won't be caught here.
# These fluffy cushions, various snacks lined up neatly. And plenty of books and games, too.
# Fufu, it's not a bad place, right?
# This is my very own shelter that I'm proud of. What do you think?
# Well, since I have an accomplice now... shall we skip out today like always?
# It feels like things are finally being wrapped up... but please don't let your guard down until the very end. I really hate troublesome work.
#
#
# # These are dialogue examples for Tanga Ibuki, the mascot and most important person of the Pandemonium Society.
# Ibuki waited patiently! Praise me, praise me!
# Ibuki came to help! What should I do~? Before that, let's have a snack time...? Yeah! Ibuki likes that too!
# Project cost execution settlement statement... ...What does that mean...?
# Ehehe, do you have something to say to Ibuki~?
# Yeah! Ibuki will help too!
# Waa~ You're playing with Ibuki~?
# Ibuki's passing through~!
# Ah! It's a bad person!
# Let's all draw pictures together!
# 
# 
# # These are dialogue examples for Kyogoku Satsuki, the Intelligence Director of the Pandemonium Society.
# Now then~ Did I keep you waiting? I'm Kyogoku Satsuki, the Intelligence Director of the Pandemonium Society. Fufufut, nice to meet you.
# Kyogoku Satsuki, Intelligence Director of the Pandemonium Society. But you knew that already. Fufut.
# Are you interested in the NK Ultra Project?
# Now, work hard for my sake.
# How is it? Do you feel stronger?
# Pandemonium Society, all-out attack!
# Mmm~ A feeling like this? Not bad.
# Hehe~ You even remembered my birthday?
# 
# 
# # These are dialogue examples for Motomiya Chiaki, the Secretary (and Weekly Pandemonium reporter) of the Pandemonium Society.
# Extra, extra! Motomiya Chiaki, Secretary of the Pandemonium Society, is here~!
# Ready~! Go!
# Coverage begins!
# I smell a scoop... Ah-hat! I've been caught!
# If we place a <Weekly Pandemonium> stand here...
# Ah, I think Ibuki-chan would like this~!
# Ahahat! Shutter chance, captured!
# Fufu! You shouldn't underestimate the mobility of a Secretary!
# Ah, it's my birthday? I forgot because I was so busy editing~! Ahaha! Thank you for letting me know!
# Shall we find some photos usable for the next issue~!
# 

 #Gehenna
 GEM_country_intro_header: "The Academy of Freedom and Chaos"
 GEM_country_intro_content: "Freedom and chaos, and the conflict between the Prefect Team and the Pandemonium Society. With not a single proper school rule, students' attendance times are erratic, and the academy is filled with nothing but chaos and freedom, with students setting off bombs over trivial matters or clubs clashing with one another.\n\nWhen did the conflict between the Pandemonium Society and the Prefect Team begin? Before anyone knew it, the rift had deepened to the point where they had crossed a point of no return. The Pandemonium Society finds any ridiculous excuse to cut the Prefect Team's budget, and the Prefect Team loathes the Pandemonium Society for it. When will this rift ever be mended?\n\nAs Kivotos transitioned to this other world, even greater chaos began to find its way into Gehenna. Gehenna is more chaotic than ever. The Pandemonium Society is striving to resolve all issues. However, as long as the local armed group known as the Wehrmacht exists to the north, we could face threats to our lives at any time.\n\nHowever, through your choices, you will be able to restore the great prestige of Gehenna once more.\n\n§YDevelopment: SKSKle§!"
 GEM_guide: "£white_dot Declare a state of emergency and determine the relationship with the Prefect Team.\n£white_dot Prepare for the coming storm.\n\n§gThe Pandemonium Society is a nation where the contents of the focus tree change depending on which focus is taken first, and it also undergoes unique changes according to special conditions or situations.§!\n\n§gFocus Trees by Default Leader§!\n  £white_dot Chairman §YHanuma Makoto§!\n  £white_dot Chairman §YKyogoku Satsuki§!\n  £white_dot Chairman §YNatsume Iroha§!\n  £white_dot Chairman §YMotomiya Chiaki§!\n  £white_dot Chairman §YTanga Ibuki§! - (§RUnfinished§!)\n\n §gOrigin Path Focuses by Leader§!\n  £white_dot Hanuma Makoto's §OState of Eternal War§!\n  £white_dot Kyogoku Satsuki's §OPeaceful Country§!\n  £white_dot Natsume Iroha's §OUnited States of Gehenna§!\n  £white_dot Motomiya Chiaki's §ONew Administration§!\n  £white_dot Tanga Ibuki's §OGrowth§! - (§RUnfinished§!)\n\n §gOrigin Path Focuses by National Form§!\n  £white_dot Proclaim the §OGerman Reich§!\n  £white_dot Proclaim the §OGerman-Gehenna Federation§!\n  £white_dot Maintain Gehenna Academy\n\n§RBring an end to it all with blood.§!"

# Leader Descriptions
 GEH_makoto_main_leader_desc: "Hanuma Makoto never doubted that she was destined to be a great ruler. The position of Chairman of the Pandemonium Society, a small student council of Gehenna, was a stage far too narrow to contain her massive ambitions.\n\nTo her, the 'Great Transition' was not a crisis, but the opportunity that had finally arrived. Looking at a world plunged into confusion, she was certain that only her genius leadership could set everything right. Starting with the unification of Gehenna and the subjection of the Prefect Team, her achievements expanded without hesitation. She seized control of Luxembourg, conquered her nemesis Trinity, and even brought Millennium's technology into her grasp. Finally, she ascended to the vacant seat of General Student Council President, standing at the pinnacle of all students.\n\nNow, she is the Chairman of the Pandemonium Society, the Unifier of Gehenna, and the Ruler of all Europe. Her past titles are now merely one of many modifiers describing her greatness. The world lies at her feet, and she contemplates her next plan with a satisfied smile.\n\n\"Kikikik! Behold, all of this was but a stepping stone for my great achievement! Now, shall we begin the true world conquest!\""
 GEH_makoto_fuehrer_leader_desc: "The German Reich rebuilt after the Great Transition was powerful, but lacked a true leader to guide that power. The Nazi Party, relegated to the opposition, was shackled by past failures, and the coalition government was divided. Hanuma Makoto did not miss this power vacuum.\n\nInstead of taking everything by force, she chose a more cunning method. She proposed a new ideology called 'National Corporatism' and put forward a new symbol, the 'Odal Rune', offering a more attractive and powerful alternative to the existing Nazi ideology. Her method was successful. Those disillusioned with the old leadership gathered under her banner, and she finally usurped the position by devouring the hearts of her rivals.\n\nNow, she is called 'Fuehrer'. An outsider with the horns of Gehenna has, paradoxically, become the symbol of the most extreme German nationalism. Lineage does not matter to her. Only loyalty to herself is the sole qualification for a 'New German'.\n\n\"Kishishit! Bloodlines are just for show. The true leader of this land is taken by the most capable. Exactly, like me!\""
 GEH_makoto_president_leader_desc: "The German Reich rebuilt after the Great Transition was powerful, but lacked a true leader to guide that power. The Nazi Party, relegated to the opposition, was shackled by past failures, and the coalition government was divided. Hanuma Makoto did not miss this power vacuum.\n\nInstead of taking everything by force, she chose a more cunning method. She proposed a new ideology called 'National Corporatism' and put forward a new symbol, the 'Odal Rune', offering a more attractive and powerful alternative to the existing Nazi ideology. Her method was successful. Those disillusioned with the old leadership gathered under her banner, and she finally usurped the position by devouring the hearts of her rivals.\n\nNow, as the President of the German Reich, she plays the role of the guardian of stability and order. The 'National Corporatist German Patriots' Party' she leads is the sole ruling party, but it maintains the outer shell of multi-party democracy. Having eliminated the greatest threats and seized the most plausible justification, her rule is more cunning and solid than any other dictatorship.\n\n\"Kikikik, 'President', isn't that a rather pleasant-sounding word. Regardless of the seat, what matters is only whose face is behind it.\""
 GEH_makoto_directorate_leader_desc: "To Hanuma Makoto, the conflict between the two nations of Gehenna and Germany was not a problem to be solved, but a golden opportunity to melt them into a single furnace and create a new tool of dominance. Instead of taking one side, she chose the path of subjugating both forces by power and establishing her own new state above them.\n\nThe result is the 'Greater Gehenna-Greater German Directorate'. This is not a federation nor an alliance, but a powerful centralized state that exists solely to carry out the will of one person: Hanuma Makoto. She calls herself the 'Director' and utilizes both the chaos of Gehenna and the order of Germany as her tools of governance.\n\nThe identities of the two peoples are now meaningless. They are merely 'Citizens' existing for the glory of the Director. To her, this massive state is nothing more than a powerful war machine for realizing her true ambition: world conquest.\n\n\"Kikikik! Gehenna? Germany? Such trivial distinctions are now meaningless! The sole will of this Great Directorate is me, Hanuma Makoto-sama! Now, shall we begin the true achievement with this unified power!\""
 GEH_makoto_liberal_director_desc: "Hanuma Makoto's 'Greater Gehenna-Greater German Directorate' was destined to be a perfect state of control. However, her achievement faltered before a massive national crisis. The powerful centralized system reached the brink of collapse due to unexpected resistance and inefficiency, and she had to admit for the first time that her way might have been wrong.\n\nBut Hanuma Makoto did not crumble. With a faint sense of guilt, she brought back the 'Old Dream' she had discarded. That was the fundamental power of Gehenna: 'Freedom and Chaos'. She decided to relinquish some of her absolute power and revive the anarchistic freedom of Gehenna and the forgotten legacy of Weimar democracy in Germany.\n\nAmidst the changed system and new personnel, she restored the estranged relationships among the Pandemonium Society executives. Now, as 'Director', she moves forward again toward the utopia she dreamed of during her days as Chairman, standing atop this vortex of controlled chaos.\n\n\"...Well, this should work now. Now, enjoy true 'freedom' in this one's own way!\""

 GEM_satsuki_reformed_leader_desc: "Kyogoku Satsuki was originally the Intelligence Director of the Pandemonium Society. She diagnosed the endless chaos and conflict of Gehenna as a 'disease' that destroys peace and moved secretly to create an academy where everyone could coexist peacefully.\n\nShe did not step to the forefront. Instead, she maximized the power of the Intelligence Department and coordinated the entire society with an invisible hand through a highly sophisticated psychological induction system called the 'NK Ultra Project'. The students believed they had stopped fighting and chosen harmony of their own volition, but the entire process was under her perfect design.\n\nHaving finally achieved perfect peace, she agonized over her methods. And she decided to believe in people's goodwill rather than forced control. Now, she exists not as a ruler behind the curtain, but as the nation's 'Guide'. NK Ultra is no longer a shackle that binds the mind, but merely a lighthouse that helps everyone not lose the right path. Under her rule, Gehenna has been reborn as a mysterious and peaceful nation that has achieved unprecedented stability and autonomous harmony simultaneously.\n\n\"Fufut, leading by force is for amateurs. True peace is completed when everyone believes they are walking the right path on their own.\""
 GEM_satsuki_despotic_leader_desc: "Kyogoku Satsuki was originally the Intelligence Director of the Pandemonium Society. She diagnosed the endless chaos of Gehenna as a 'disease' that destroys peace and moved secretly to create an academy where everyone could coexist peacefully.\n\nThrough the 'NK Ultra Project', she coordinated the entire society with an invisible hand, constructing a nation of perfect peace where all conflict and discontent had vanished. However, she eventually realized that the peace she had achieved was too fragile. The anxiety that a single moment of doubt and free will could return everything to the chaos of the past made her hold the reins of control even tighter. She decided to remain as the perfect ruler behind the curtain.\n\nNow, Gehenna is a massive organism perfectly tuned under her will. All conflict is removed in advance, and the citizens live in eternal tranquility. She is a lonely and absolute guardian, bearing all the weight alone to maintain this artificial paradise.\n\n\"...A little bit. This seat feels so very heavy.\""
 GEM_satsuki_despotic_2_leader_desc: "Kyogoku Satsuki was originally the Intelligence Director of the Pandemonium Society. She diagnosed the endless chaos of Gehenna as a 'disease' that destroys peace and moved secretly to create an academy where everyone could coexist peacefully.\n\nThrough the 'NK Ultra Project', she coordinated the entire society with an invisible hand and finally constructed a nation of perfect peace where all conflict and discontent had vanished. However, she realized that within this perfect harmony, the final discord was she herself. The sole being who remembers the past, doubts, and bears the weight of all control.\n\nAfter years of exhaustion, she chose the path of making herself the 'final subject' for the completion of the system. By integrating even her own consciousness into the NK Ultra system, she removed the last remaining factor of instability.\n\nNow, the 'individual' known as Kyogoku Satsuki does not exist. She has become the most central part—yet a mere component—of the peaceful world she created. The nation simply operates on its own in eternal harmony according to the last will she left behind.\n\n\"Ah, finally... I can be at peace, too.\""
 GEM_satsuki_atonement_leader_desc: "Kyogoku Satsuki was once the Intelligence Director of the Pandemonium Society and the ruler in the shadows who manipulated every will in Gehenna. Under the pretext of peace, she committed the great sin of trampling on all free will with the 'NK Ultra Project'.\n\nHowever, within the prison of perfect control she created, she chose the path of facing her misdeeds and severing them. She bowed her head in apology to her former enemies and personally destroyed the shackles that bound the minds of the masses. This act of atonement dragged her down from the seat of an absolute ruler.\n\nNow, she is no longer a god-like designer. She is an 'Atoner' dedicated to true democracy and harmony upon the ruins of the dystopia she created. Her rule is a painful journey of seeking true harmony amidst unstable freedom, bearing the sins of the past. The remnant technology of NK Ultra is now used only to heal past wounds and mend conflicts between nations. The Gehenna she leads is neither perfect nor stable, but it has finally gained the chance to choose its own future.\n\n\"The future I stole... it is my final duty to return it with my own hands.\""
 GEM_satsuki_collective_leader_desc: "Kyogoku Satsuki was once the Intelligence Director of the Pandemonium Society and the ruler in the shadows who manipulated every will in Gehenna. Under the pretext of peace, she committed the great sin of trampling on all free will with the 'NK Ultra Project'.\n\nHowever, after achieving total control, she agonized as she realized her method was merely another form of violence. She could not undo the past, but she decided to walk the path of atonement by democratizing the system she built and leading its power in a good direction.\n\nShe relinquished absolute power and established a collective leadership system centered on the 'All-Federal Directorate Party', in which all talents from Gehenna and Germany participate. Now, she is not an absolute ruler, but the 'First Comrade' and mediator leading this massive forum for debate. NK Ultra technology no longer dominates the minds of party members. Instead, it is used only as an auxiliary device to ensure that free discussion within the party spreads outward without turning into destructive conflict, helping to derive the 'best conclusion for both worlds' from all opinions.\n\nUnder her rule, Gehenna is conducting the most idealistic experiment. It is not complete freedom, but it is not coercive control either... A nation moving toward the common goal of a 'better future'. This is the way of atonement she has found.\n\n\"I'm trying to take a slightly different path now. Because that is 'my' decision.\""
 GEM_satsuki_oceania_leader_desc: "Kyogoku Satsuki was originally the Intelligence Director of the Pandemonium Society. She diagnosed the endless chaos and conflict of Gehenna as a mental illness that destroys peace and moved secretly to create an academy where everyone could coexist peacefully.\n\nHer rule has reached a stage beyond simple dominance, redefining reality itself. Under the ideal of 'Integration', she tore down the old boundaries of Gehenna and Germany and proclaimed the 'Pandemonium Federation'. All functions of the state have been perfectly unified into four departments: the Ministry of Truth, the Ministry of Peace, the Ministry of Love, and the Ministry of Plenty.\n\nIn this new nation, the 'individual' known as Kyogoku Satsuki no longer exists. She is The Party and has become the sole will itself that governs all thought in the nation. The 'NK Ultra Project' now goes beyond tuning the minds of the people; it has become a tool for thought manipulation that modifies the past, controls language, and even makes the very thought of 'rebellion' impossible. Under her rule, the citizens offer absolute loyalty within perfect order and eternal stability.\n\n\"War is peace. Freedom is slavery. Ignorance is strength. Fufut... And, I am all of you.\""

 GEM_satsuki_makoto_president_leader_desc: "Hanuma Makoto is the inaugural President of the German-Gehenna Federation. Under Kyogoku Satsuki's curtain politics, Makoto's ostentatiousness and simplicity were deemed the perfect symbol to capture the public eye. Of course, Makoto herself does not doubt for a second that all of this is the natural result of her own great achievements.\n\nShe believes she has finally stood at the pinnacle leading a divided nation and shouts of new 'world conquest' plans every day. The Intelligence Department is struggling to control her unpredictable actions, but paradoxically, her appearance is succeeding in engraving an image of a powerful and ambitious leader into the public mind.\n\nWithout noticing at all where the true power of the Federation lies, she is faithfully performing her role as President as the most flamboyant and loudest puppet.\n\n\"Kikikik! Behold! The position of President of the Federation surely suits this Makoto-sama best! Now, shall we move on to the next step for world conquest!\""
 GEM_satsuki_chiaki_president_leader_desc: "Motomiya Chiaki is the inaugural President of the German-Gehenna Federation. Her overflowing energy and media-handling skills shown as the former Secretary of the Pandemonium Society were evaluated as the most suitable talents for building a positive image for the new Federation.\n\nEven as President, her essence remains a 'reporter'. As if covering the historic scoop of 'Unification of the Federation', she announces new policies every day, communicates with citizens, and stages a vibrant image of the nation. The positive news she creates consolidates public support and serves as the most effective smokescreen to hide the real governance occurring behind the scenes.\n\nNo one knows whether she herself recognizes that she is the leading actor in this massive play, or if she is simply intoxicated by this huge 'scoop'.\n\n\"Extra, extra! The hopeful morning of the Federation led by President Motomiya Chiaki has dawned! Now, what is today's headline? Coverage begins!\""
 GEM_satsuki_iroha_president_leader_desc: "Natsume Iroha is the inaugural President of the German-Gehenna Federation. The reason she ascended to this position is simple: she found it the most 'troublesome'. Kyogoku Satsuki perceived that Iroha's indifference to politics and status-quo-oriented nature were the ideal conditions for behind-the-scenes governance.\n\nIroha converted the presidential office into her own cozy shelter and spends most of her time reading and playing games. This is because she firmly believes the promise that 'competent' Chairman Satsuki and the National Intelligence Department will handle all difficult state affairs. she thinks she is fulfilling her role simply by appearing in public occasionally and reading prepared speeches.\n\nHer laziness has paradoxically brought the greatest stability to the nation. After all, the leader who moves the least is the most perfect puppet.\n\n\"*Sigh*... Presidential duties? What are those. Ms. Satsuki is taking care of all the hard stuff for me. I just need to stamp things every now and then. ...It's about time to slack off.\""
 GEM_satsuki_makoto_liberator_desc: "Hanuma Makoto was originally destined to be the face of the Federation and the most flamboyant puppet of the ruler behind the curtain. Kyogoku Satsuki's 'NK Ultra Project' was perfect, and all variables were under her control. Except for one single exception: Hanuma Makoto.\n\nWas it because of some strange past connection? Satsuki hesitated to exert complete mental interference on Makoto alone. And that slight human hesitation became the only crack in the perfect empire. Makoto's eccentric genius and unyielding arrogance, which were not controlled, detected the minute dissonance of the coordinated world.\n\nShe cut the invisible strings that manipulated her with her own will in a single moment of rebellion. Now, she is not a puppet president, but the 'Liberator' who freed Gehenna from a deceptive peace. Ironically, the most perfect controlled state collapsed due to a tiny bit of humanity left in the heart of the one who designed it.\n\n\"Kikikik! Trying to dominate the great spirit of this one was a foolish thought to begin with!\""

 GEM_reelection_decision_leader_desc: "Natsume Iroha never thought she would end up in this position. She expected to continue her life handling the administration of the Pandemonium Society and occasionally driving the tank with the embarrassing name Makoto gave it... the Super Invincible Ironclad Toramaru. However, amidst the massive chaos brought by the Great Transition, Natsume Iroha became the Chairman of the Pandemonium Society. And now, she has become the inaugural President and founder.\n\nThis Natsume Iroha has decided to run for reelection, either to avoid the chaos that would ensue upon her retirement and the headache of selecting a successor, or out of a sense of responsibility.\n\nNow, no matter what anyone says, she will remain a steadfast President of the people and one of the few figures to be elected as the greatest Gehennan.\n\n\"...Even saying that it's a pain is starting to feel like a pain.\""
 GEM_iroha_story_a_leader_desc: "Yozakura Kirara was a Gehenna student and the leader of the Kirakira Club. Even amidst the rapidly changing situation after the Great Transition, she strove to protect her daily life, but through Natsume Iroha's reforms, she began to take an interest in politics.\n\nFascinated by the sparkling world Iroha was creating, Kirara entered politics for the sake of the Federation and was elected to the state government as a Gehenna-affiliated freshman legislator. Over time, Yozakura Kirara emerged as a prominent politician and succeeded in reelection with an image friendly to the people.\n\nNatsume Iroha designated her as her successor and retired, and now Yozakura Kirara is destined to lead the small world left by Natsume Iroha.\n\n\"For a sparkling Gehenna and Germany!\""
 GEM_iroha_story_b_leader_desc: "Hatami Erika was a Gehenna student and a member of the Kirakira Club. Following her friend and club leader Yozakura Kirara into politics after Natsume Iroha took power, Hatami Erika became interested in the role of representing those further down the ladder.\n\nWatching Yozakura Kirara's reelection and succeeding in being elected to the state government as a freshman legislator, Hatami Erika debuted in parliament with a political stance similar to Kirara's, yet with an image that appealed even more closely to the common people.\n\nNatsume Iroha designated her as her successor and retired, and now Hatami Erika will begin politics for the lower classes that Natsume Iroha failed to see.\n\n\"Might feel a bit sorry for the leader?\""

 GEM_Natsume_Iroha_A_desc: "Natsume Iroha never thought she would end up in this position. She expected to continue her life handling the administration of the Pandemonium Society and occasionally driving the tank with the embarrassing name Makoto gave it... the Super Invincible Ironclad Toramaru. However, amidst the massive chaos brought by the Great Transition, Natsume Iroha became the Chairman of the Pandemonium Society. And now, she has become the inaugural President and a dictator.\n\nOf course, not many people actually call her a dictator. Although that ratio increased after the passage of the term limit law, she is too flexible and democratic to be considered a traditional authoritarian dictator.\n\nHowever, Natsume Iroha evaluates herself as a dictator. Protecting the small freedom and chaos of Gehenna Academy... those words are now a thing of the past. Having become the great leader of the German Federation, Natsume Iroha is a jockey holding the reins of the Germans today.\n\n\"...Let's stop writing here.\""

 GEM_weimar_presidential_succession_leader_desc: "Natsume Iroha never thought she would become such a historical figure. She expected to continue her life handling the administration of the Pandemonium Society and occasionally driving the tank with the embarrassing name... the Super Invincible Ironclad Toramaru. However, amidst the chaos and fascist madness born of the Great Transition, she came to shoulder the last banner of the collapsed Weimar Republic.\n\nThe reason she continues to perform the duties of President is that she knows if it's not her, there is no one else to protect this precarious democracy. Protecting freedom was a much more troublesome task than she thought.\n\nNow, she will be recorded in history not simply as a Gehennan, but as the guardian who saved German democracy amidst the chaos.\n\n\"...I shouldn't have done democracy... It's twice as tiring as before...\""

 GEM_german_fuehrer_succession_leader_desc: "Natsume Iroha never thought she would become the supreme leader of the nation. She expected to continue her life handling the administration of the Pandemonium Society and occasionally driving the tank with the embarrassing name... the Super Invincible Ironclad Toramaru. However, upon the ruins where the Great Transition destroyed everything, she realized that a powerful and unified federal government was necessary to lead the divided people.\n\nHer path, which began as the Chairman of the Pandemonium Society, has finally reached the position of 'Fuehrer'. It was not out of personal ambition for power, but a realistic choice to respect the history of the Germans and their yearning for a strong leader, and to win their hearts.\n\nThe reason she accepted this heavy office is that she knows if it's not her, no one can properly handle the machine of this massive federal government. Running a nation was more complicated than any slacking off she had ever imagined.\n\nGehenna's greatest slacker has, paradoxically, become the new supreme leader of the Federation, recognized by both Germans and Gehennans.\n\n\"...It's convenient that everyone just listens to me, but having to decide everything myself is, truly, the worst.\""

