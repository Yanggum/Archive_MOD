 GEM_GATHERING_STORM_DESC:0 "모든 것이 주먹구구식으로 돌아가며, 동아리들의 폭주는 도저히 막을 수 없을 지경까지 이르렀고 만마전과 선도부의 갈등은 다른 학원에서 알 정도로 유명합니다. 언제나 게헨나에서는 폭탄이 터지는 소리와 총기난사가 일어나는 등 혼란이 가득합니다.\n\n대전이 사건이 일어나자 무법지대는 혼란을 맞이하였습니다.\n새로운 사람들은 우리에게 적대감을 드러내며 우리를 내쫓을려고 하였지만 굳굳하게 버텨내었습니다. 하지만 선도부의 소라사키 히나가 두눈을 뜨고 있는 이상 게헨나에는 피바람이 불 것입니다."

 GEH_GATHERING_STORM_DESC:0 "대전이의 혼란 속에서 소라사키 히나의 선도부는 어떻게든 키보토스계 인구가 현지인들에게 범죄를 일으키는 것을 막고, 50일 동안 바이에른 지역을 중심으로 치안을 유지해 오고 있습니다. 하지만 대전이 이후 급증한 업무량으로 인해 히나는 지쳐가고 있으며, 게헨나 학생들은 만마전의 통제에서 벗어난 선도부가 '군벌화'되었다고 생각하며 선도부 정부를 비난합니다.\n\n내부와 외부의 적들로 인해 선도부가 고립되어가는 지금, 게헨나 선도부의 미래는 어떻게 될까요? 선도부는 만마전을 대체하는 게헨나의 중심이 될 수 있을까요? 그리고 동쪽에서 다가오는 트리니티의 위협으로부터 게헨나를 지켜낼 수 있을까요?"

 GEH_makoto_main_leader_desc: "하누마 마코토는 언제나 자신이 위대한 지배자가 될 운명임을 의심치 않았습니다. 게헨나의 작은 학생회, 판데모니움 소사이어티의 의장이라는 직책은 그녀의 거대한 야망을 담기에는 너무나도 비좁은 무대였습니다.\n\n'대전이'는 그녀에게 위기가 아닌, 드디어 도래한 기회였습니다. 혼란에 빠진 세계를 보며, 그녀는 오직 자신의 천재적인 지도력만이 이 모든 것을 바로잡을 수 있다고 확신했습니다. 게헨나를 통일하고 선도부를 굴복시킨 것을 시작으로, 그녀의 위업은 거침없이 뻗어 나갔습니다. 룩셈부르크를 장악하고, 숙적 트리니티를 제패했으며, 밀레니엄의 기술력마저 손아귀에 넣었습니다. 마침내 그녀는 공석이었던 총학생회장의 자리에 올라, 모든 학도들의 정점에 섰습니다.\n\n이제 그녀는 만마전의 의장이자, 게헨나의 통일자, 모든 유럽의 지배자입니다. 과거의 직책들은 이제 그녀의 위대함을 설명하는 수많은 수식어 중 하나에 불과합니다. 세계는 그녀의 발아래 놓였고, 그녀는 만족스러운 미소와 함께 다음 계획을 구상합니다.\n\n\"키키킥! 보아라, 이 모든 것이 나의 위업을 위한 발판이었을 뿐이다! 이제 진정한 세계 정복을 시작해볼까!\""
 GEH_makoto_fuehrer_leader_desc: "대전이 이후 재건된 독일국은 강력했으나, 그 힘을 이끌 진정한 지도자가 없었습니다. 야당으로 전락한 나치당은 과거의 실패에 얽매여 있었고, 연립정부는 분열되어 있었습니다. 하누마 마코토는 이 권력의 공백을 놓치지 않았습니다.\n\n그녀는 무력으로 모든 것을 빼앗는 대신, 더 교활한 방법을 선택했습니다. '국가조합주의'라는 새로운 이념을 제창하고, '오달 룬'이라는 새로운 상징을 내세워, 기존 나치당의 이념보다 더 매력적이고 강력한 대안을 제시한 것입니다. 그녀의 방식은 성공적이었습니다. 낡은 지도부에 환멸을 느낀 이들이 그녀의 깃발 아래로 모여들었고, 마침내 그녀는 경쟁자의 심장을 파먹고 그 자리를 찬탈했습니다.\n\n이제 그녀는 '총통'이라 불립니다. 게헨나의 뿔을 가진 이방인이, 역설적으로 가장 극단적인 독일 민족주의의 상징이 된 것입니다. 그녀에게 혈통은 중요하지 않습니다. 오직 자신을 향한 충성만이 '새로운 독일인'의 유일한 자격일 뿐입니다.\n\n\"키시싯! 혈통 따위는 장식일 뿐. 이 땅의 진정한 지도자는 가장 유능한 자가 차지하는 법이다. 바로, 나처럼 말이다!\""
 GEH_makoto_president_leader_desc: "대전이 이후 재건된 독일국은 강력했으나, 그 힘을 이끌 진정한 지도자가 없었습니다. 야당으로 전락한 나치당은 과거의 실패에 얽매여 있었고, 연립정부는 분열되어 있었습니다. 하누마 마코토는 이 권력의 공백을 놓치지 않았습니다.\n\n그녀는 무력으로 모든 것을 빼앗는 대신, 더 교활한 방법을 선택했습니다. '국가조합주의'라는 새로운 이념을 제창하고, '오달 룬'이라는 새로운 상징을 내세워, 기존 나치당의 이념보다 더 매력적이고 강력한 대안을 제시한 것입니다. 그녀의 방식은 성공적이었습니다. 낡은 지도부에 환멸을 느낀 이들이 그녀의 깃발 아래로 모여들었고, 마침내 그녀는 경쟁자의 심장을 파먹고 그 자리를 찬탈했습니다.\n\n이제 그녀는 독일국의 국가대통령으로서, 안정과 질서의 수호자를 연기합니다. 그녀가 이끄는 '국가조합주의 독일 애국자당'은 유일한 지배 정당이지만, 겉으로는 다당제 민주주의의 외피를 유지하고 있습니다. 가장 큰 위협을 제거하고, 가장 그럴싸한 명분을 손에 쥔 그녀의 통치는 그 어떤 독재보다도 교활하고 견고합니다.\n\n\"키키킥, '대통령'이라니, 제법 듣기 좋은 말이 아닌가. 자리가 어떠하든, 그 뒤의 얼굴이 누구인지만이 중요할 뿐이지.\""
 
