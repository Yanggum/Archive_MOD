 GEM_security_militia: "민병대 보호"
 GEM_security_militia_desc: "만마전 군단은 판데모니움 소사이어티가 운영하는 충성스러운 사병 조직입니다. 우리는 이 조직을 확대하여 부족한 군사력을 확보하고 전선 후방의 위협을 최소화 할 것입니다."
 GEM_coerced_loyalty: "충성 강요"
 GEM_coerced_loyalty_desc: "만마전 군단은 그 어떤 조직보다 만마전과 게헨나에 충성하고 위대한 사명을 위해 자기 자신을 불사를 수 있어야만 합니다. 우리는 그렇게 만들 것입니다."
 GEM_honor_and_glory: "명예와 영광"
 GEM_honor_and_glory_desc: "군단의 병사들은 그 모두가 게헨나의 어떤 군인보다 명예롭고 영광스러운 운명을 가지게 될 것입니다. 거리의 전단지와 만마전의 방송에서는 이들을 지속해서 찬양할 것입니다."
 GEM_great_duty: "위대한 의무"
 GEM_great_duty_desc: "게헨나의 학생은 모두가 위대한 의무를 짊어지고 있습니다. 가장 강력한 학원이자 가장 강인한 학생으로서 우리는 게헨나를 위해 영원토록 충성할 것입니다."
