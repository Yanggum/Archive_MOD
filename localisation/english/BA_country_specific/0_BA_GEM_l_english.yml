 GEM_ibuki_system_action_center_tt: "§YIbuki Tanga§!'s current §Ycolors§! are as follows.\n1st Quarter:\n - §tAmbition§!: [?GEM_ibuki_system_one_array_value^0|.0H] §g(Level [?GEM_ibuki_system_one_array_lv^0|.0g])§!\n - §ODignity§!: [?GEM_ibuki_system_one_array_value^1|.0H] §g(Level [?GEM_ibuki_system_one_array_lv^1|.0g])§!\n - §1Efficiency§!: [?GEM_ibuki_system_one_array_value^2|.0H] §g(Level [?GEM_ibuki_system_one_array_lv^2|.0g])§!\n - §CIdealism§!: [?GEM_ibuki_system_one_array_value^3|.0H] §g(Level [?GEM_ibuki_system_one_array_lv^3|.0g])§!\n\n2nd Quarter:\n - §tAmbition§!: [?GEM_ibuki_system_two_array_value^0|.0H] §g(Level [?GEM_ibuki_system_two_array_lv^0|.0g])§!\n - §ODignity§!: [?GEM_ibuki_system_two_array_value^1|.0H] §g(Level [?GEM_ibuki_system_two_array_lv^1|.0g])§!\n - §1Efficiency§!: [?GEM_ibuki_system_two_array_value^2|.0H] §g(Level [?GEM_ibuki_system_two_array_lv^2|.0g])§!\n - §CIdealism§!: [?GEM_ibuki_system_two_array_value^3|.0H] §g(Level [?GEM_ibuki_system_two_array_lv^3|.0g])§!"
