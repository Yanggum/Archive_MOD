 GEM_ibuki_system_decision: "개화"
 GEM_ibuki_system_decision_desc: "§Y탄가 이부키§!가 오로지 자신의 힘으로 지도자의 자리에 오른 것은 이번이 유일한 일이자, 처음일 것입니다. 이제 그녀는 만마전 임원들의 도움에서 벗어나, 스스로 §Y'학원과 국가의 지도자'§!가 되기 위해 움직여야 합니다.\n\n탄가 이부키의 §G개화§!는 총 §Y두 개의 분기§!로 구분됩니다. 각 §Y분기§!에서 다양한 버프를 얻을 수 있고, 가장 높게 성장한 §Y색§!이 해당 §Y분기§!를 §G칠§!하여 피어납니다.\n\n각 §Y색§!은 §t야망§!, §O위엄§!, §1효율§!, §C이상§! 네 가지로 구분되며, §Y첫 번째 분기§!의 §G색칠§!은 기반 능력치를, §Y두 번째 분기§!의 §G색칠§!은 §Y탄가 이부키§!의 §Y고유 중점도§!를 해금합니다."

