 GEM_chiaki_system_decision_1_desc: "Appropriate glory must be given to all national citizens, workers, farmers, and students who nurture and dedicate themselves to the nation!"
 GEM_chiaki_system_decision_2_desc: "Reduce waste and turn national resources entirely into national power!"
 GEM_chiaki_system_decision_3_desc: "To ensure the smooth administration of the nation, we must encourage the administrative participation of all citizens."
 GEM_chiaki_system_decision_4_desc: "Serve the Fatherland by purchasing Defense Bonds!"
 GEM_chiaki_system_decision_5_desc: "Dedicate yourself to the Fatherland; a historical crisis is upon us!"
 GEM_chiaki_system_decision_6_desc: "Proper recycling saves resources and protects the environment."
 GEM_chiaki_system_decision_7_desc: "With so many races living together now, we must resolve various forms of discrimination."
 GEM_chiaki_system_decision_8_desc: "Glory to the diligent worker!"
 GEM_chiaki_system_decision_9_desc: "The nation needs you!"
 GEM_chiaki_system_decision_10_desc: "Now, citizens, rise and face the storm!"
 GEM_chiaki_system_decision_11_desc: "The task of harmonizing and promoting our culture and this land."
 GEM_chiaki_system_decision_12_desc: "If we reduce areas of mutual conflict, we can build a better nation."
 GEM_chiaki_system_decision_13_desc: "Fighting within society only advertises our society's weaknesses to others."

 GEAC_you_will_lose_the_bonus_tt: "§RDeclaring war on another Gehenna Academy greatly undermines the values of cooperation and coexistence. As a result, we will be expelled from the Gehenna Cooperation Solidarity and permanently lose access to the shared focus tree.§!"
 GEAC_event.1.t: "[FROM.PREV.GetNameDefCap] has broken Gehenna cooperation by declaring war on [FROM.PREV.FROM.GetNameDefCap]!"
 GEAC_if_join_tt: "Accepting this agreement establishes a §YNon-Aggression Pact§! and unlocks the §YShared Focus Tree§! for industrial development among Gehenna Academies."
 GEAC_event.1.desc: "Shocking news has arrived that [FROM.PREV.GetNameDefCap] has declared war on another member state, breaking the value of mutual cooperation within the Gehenna-Germanic sphere. Consequently, [FROM.PREV.GetNonIdeologyName] has been excluded from the ongoing industrial cooperation plans across Gehenna. It remains to be seen how this will affect the treaty. While the solidarity of other Gehenna powers may strengthen, it could also trigger a chain reaction leading to the end of Gehenna unity..."
 GEAC_event.1.a: "I only hope this does not lead to the total collapse of Gehenna..."

 GEAC_event.2.t: "Gehenna Industrial Cooperation Plan"
 GEAC_event.2.desc: "[GEAC_leader.GetLeader] has approached [ROOT.GetLeader], proposing a mutual non-aggression pact to keep the possibility of more sustained cooperation open in the future. Diplomats from [event_target:GEAC_leader.GetAdjective] have analyzed the shared history and interests between our two nations in detail, sincerely wishing for peace between brotherly nations and working hard in their respective positions. Negotiations have proceeded smoothly so far, but whether we sign or not ultimately depends on us."
 GEAC_event.2.a: "Even if we dislike each other, we must do what needs to be done."
 GEAC_event.2.b: "We aren't that close, [GEAC_leader.GetLeader]."

 GEAC_event.3.t: "[FROM.GetName] Accepts Gehenna Industrial Cooperation"
 GEAC_event.3.desc: "[FROM.GetLeader] reacted very favorably to our proposed coexistence treaty and non-aggression pact, stating there was no need to delay any further and signing the treaty immediately. With their acceptance, we have moved one step closer to the peace of our Fatherland and the world!"
 GEAC_event.3.a: "Even if we dislike each other, we must do what needs to be done."

 GEAC_event.4.t: "[FROM.GetName] Rejects Gehenna Industrial Cooperation!"
 GEAC_event.4.desc: "[FROM.GetLeader] has written a lengthy letter informing [ROOT.GetLeader] that proposing a non-aggression pact is merely a waste of paper and ink. Furthermore, [FROM.GetLeader] wrote that formalizing an alliance between [FROM.GetNameDef] and [FROM.GetNameDef] is a waste of time, and they will not participate in any of [ROOT.GetAdjective]'s future plans."
 GEAC_event.4.a: "...They could have just said 'no'."

 GEH_tank_designer: "Gehenna Heavy Industries"
 GEH_tank_designer_tooltip: "§Y$GEH_tank_designer$§! Modifiers:"

 GEAC_unified_but_divided_gehenna_academy: "Pan-Gehenna Industrial Development"
 GEAC_unified_but_divided_gehenna_academy_desc: "Gehenna, Germania, and the West German regions of Luxembourg-Pandemonium-Disciplinary Committee share many cultures and maintain active border openings. Even if relations are poor, the work of collective Academy development must be done."
 GEAC_basic_available_trigger_tt: "Not at war with Gehenna Academy factions"
 GEAC_unified_but_divided_gehenna_academy_flag: "We are in mutual solidarity with Gehenna Academy,"
 GEAC_academy_railroad_opening: "Gehenna Academy Railway Opening"
 GEAC_academy_railroad_opening_desc: "The project to rebuild and connect the collapsed railways nationwide must start based on cooperation across Gehenna, rather than the arbitrary decision of a single faction."
 GEAC_organic_industry_strengthening: "Organic Industrial Concept"
 GEAC_organic_industry_strengthening_desc: "We must ensure that a giant industrial body overseeing the industries of all Gehenna is firmly established, requiring cooperation across the Gehenna Academy in broad construction and production."
 GEAC_organic_industry_strengthening_tt: "$GEH_tank_designer_tooltip$\n Industry Research Speed: §G+10%§!\n Construction Speed: §G+5.00%§!\n §YInfantry Equipment§!: £GFX_production_cost  Production Cost: §G-5.00%§!\n"
 GEAC_germanic_cultural_sphere_induction: "Germanic Cultural Sphere Induction"
 GEAC_germanic_cultural_sphere_induction_desc: "The culture of Gehenna Academy shares many similarities with the culture of current German territories, though there are also many differences. However, as we compete with Trinity for leadership over all of Germany, we must emphasize the homogeneity between the German culture and our own."
 GEAC_air_defense_conception: "Air Defense Conception"
 GEAC_air_defense_conception_desc: "We must install numerous anti-aircraft guns to prepare for bombings following enemy air superiority. This will make the skies of Gehenna safe."
 GEAC_makoto_line: "Makoto Line"
 GEAC_makoto_line_desc: "The 'Makoto Line' proposed by Hanuma Makoto in December 1935 is a fortification line designed on the principle that not a single inch of land can be surrendered to Trinity. We will follow this value."
 GEAC_hina_line: "Hina Line"
 GEAC_hina_line_desc: "The 'Hina Line' proposed by Sorasaki Hina in January 1936 is a metropolitan fortification plan designed to protect major industrial facilities against attacks from various directions and to assume the worst-case scenario. We will execute this plan."
 GEAC_makoto_line_tt: "Add §G4§! §YForts§! to the border of states adjacent to §YTrinity§!:"
 GEAC_hina_line_tt: "Add §G4§! §YForts§! to §YMajor Cities§! throughout Gehenna:"
 GEAC_air_defense_conception_tt: "If we control the state, §YAnti-Air§! will be added to its maximum in §YHanover§!, §YHesse§!, §YOst-Rhineland§!, §YOberbayern§!, and §YLuxembourg§!."
 GEAC_gehenna_artillery: "Luxembourg Artillery"
 GEAC_gehenna_artillery_desc: "Based on the highly skilled workers of Luxembourg before the Great Transfer and systematic industrial planning, the artillery of Luxembourg-Handyman 68 is demonstrating outstanding performance throughout Gehenna. We will integrate this secret into our industries."
 GEAC_gehenna_artillery_tt: "$GEH_tank_designer_tooltip$\n £GFX_prod_eff_cap Production Efficiency Cap: §G+5.00%§!\n §YInfantry Equipment§!: £GFX_production_cost  Production Cost: §G-5.00%§!\n §YArtillery§!: £GFX_production_cost  Production Cost: §G-5.00%§!\n §YAnti-Air§!: £GFX_production_cost  Production Cost: §G-5.00%§!\n §YAnti-Tank§!: £GFX_production_cost  Production Cost: §G-5.00%§!\n"
 GEAC_steel_industry_development: "Bavarian Steel Industry"
 GEAC_steel_industry_development_desc: "The Gehenna Disciplinary Committee has continuously invested in the steel industry of the Bavarian region since the Great Transfer. By developing the steel industry now, we can concentrate Gehenna's resources into Bavaria!"
 GEAC_hot_spring_industry_expansion: "Gehenna Hot Spring Bubbly Operation"
 GEAC_hot_spring_industry_expansion_desc: "Did you know that some of the hot spring water from the Hinnom Mountains, which transferred during the Great Transfer, continues beneath the underground of Gehenna? The Hot Springs Development Department knows very well! With a little bit of... explosive power and boldness, we can declare the success of this grand 'Hot Spring Bubbly Operation'."
 GEAC_hot_spring_industry_expansion_tt: "$GEH_tank_designer_tooltip$\n §YInfrastructure§! Construction Speed: §G+10.00%§!\n §YCivilian Factory§! Construction Speed: §G+10.00%§!"
 GEAC_steel_industry_development_tt: "Import resources from other Gehenna nations to add £GFX_resources_strip|4 §Y5§!, £GFX_resources_strip|2 §Y6§!, and £GFX_resources_strip|5 §Y6§! to the §YCapital§!."
 GEAC_steel_industry_development_tt2: "Add £GFX_resources_strip|5 §Y6§! to the §YCapital§!."
