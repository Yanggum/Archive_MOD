 GEAC_you_will_lose_the_bonus_tt: "§R다른 게헨나 학원을 상대로 전쟁을 선포하는 것은 협력과 상생의 가치를 크게 훼손시키며, 이로 인해 우리는 게헨나의 협력 연대 속에서 추방되어 공유 중점계통도에 대한 접근을 영구적으로 상실할 것입니다.§!"
 GEAC_event.1.t: "[FROM.PREV.FROM.GetNameDefCap]에 전쟁을 선포하여 게헨나 협력을 깨뜨린 [FROM.PREV.GetNameDefCap]!"
 GEAC_if_join_tt: "이 협정을 수락할 경우 §Y불가침조약§!이 수립되고 게헨나 학원 간의 산업 개발을 위한 §Y공용 중점 계통도§!를 해금합니다."
 GEAC_event.1.desc: "[FROM.PREV.GetNameDefCap]에서 다른 회원국에 전쟁을 선포하고 게헨나-게르만권의 세력 간 상호 협력의 가치를 꺾어버렸다는 놀라운 소식이 들려왔습니다. 이로 인해, [FROM.PREV.GetNonIdeologyName] 측은 게헨나 전역에서 진행중인 산업 협력 계획에서 배제되었습니다. 이것이 조약에게 어떤 영향을 끼칠지는 미지수입니다. 다른 게헨나권 세력들의 결속이 강화될 수도 있지만, 연쇄적으로 게헨나 단결의 종말을 불러올 수도 있을 것입니다..."
 GEAC_event.1.a: "이것이 게헨나의 총체적 붕괴로 이어지지 않기를 바랄 뿐이다..."

 GEAC_event.2.t: "게헨나의 산업 협력 계획"
 GEAC_event.2.desc: "[GEAC_leader.GetLeader](은)는 미래에 더욱 지속적인 협력의 가능성을 열어두기 위해 상호간의 불가침조약을 제안하며 [ROOT.GetLeader]에게 다가오고 있었습니다. [event_target:GEAC_leader.GetAdjective]의 외교관들은 두 국가 사이의 공동의 역사와 관심사에 대해 상세히 분석하고, 형제 국가들 간의 평화를 진심으로 바라며 그들 각자의 위치에서 열심히 노력하였습니다. 현재까지 협상은 순조롭게 진행되고 있지만, 우리가 서명하느냐 마느냐의 문제는 결국 우리에게 달려있습니다."
 GEAC_event.2.a: "서로가 싫다 해도 할 건 해야지."
 GEAC_event.2.b: "우리는 가까운 사이가 아니야, [GEAC_leader.GetLeader]."

 GEAC_event.3.t: "[FROM.GetName]의 게헨나 간 산업 협력 수락"
 GEAC_event.3.desc: "[FROM.GetLeader](은)는 우리가 제시한 상생조약과 불가침조약에 매우 호의적인 반응을 보였고, 더 이상 시간을 지체할 필요가 없다고 말하며 곧바로 조약에 서명하였습니다. 그들의 협정 수락으로 우리는 조국과 세계의 평화에 한 걸음 더 다가섰습니다!"
 GEAC_event.3.a: "서로가 싫다 해도 할 건 해야지."

 GEAC_event.4.t: "[FROM.GetName]의 게헨나 간 산업 협력 거부!"
 GEAC_event.4.desc: "[FROM.GetLeader]께서는 [ROOT.GetLeader]에게 불가침조약을 맺자고 제안한 것은 그저 종이와 잉크 낭비일 뿐이라고 알리는 장문의 편지를 썼습니다. 또한 [FROM.GetLeader]께서는 [FROM.GetNameDef]측과 [FROM.GetNameDef] 간 동맹을 공식화하는 것은 시간 낭비일 뿐이며, 앞으로 어떠한 [ROOT.GetAdjective]의 계획에서도 불참할 것이라고 썼습니다."
 GEAC_event.4.a: "...그냥 '아니'라고만 말할 수도 있었잖나."

 GEH_tank_designer: "게헨나 중공업"
 GEH_tank_designer_tooltip: "§Y$GEH_tank_designer$§! 변동치:"

 GEAC_unified_but_divided_gehenna_academy: "전게헨나 산업 개발"
 GEAC_unified_but_divided_gehenna_academy_desc: "게헨나와 게르만, 그리고 서독 지방의 룩셈부르크-만마전-선도부는 여러 문화를 공유하고 활발한 국경 개방이 이루어지고 있습니다. 비록 서로 간 사이가 나쁘다고 하더라도, 공동의 학원 개발이라는 할 일은 해야 하는 법입니다."
 GEAC_basic_available_trigger_tt: "게헨나 학원의 세력과 전쟁 중이 아님"
 GEAC_unified_but_divided_gehenna_academy_flag: "게헨나 학원과 우리는 상호 연대 중에 있습니다,"
 GEAC_academy_railroad_opening: "게헨나 학원철도 개통"
GEAC_academy_railroad_opening_desc: "무너진 철도를 전국적으로 재건하고 연결하는 산업은 한 세력의 독단이 아닌, 게헨나 전역의 협력을 기초로 시작해야 합니다."
 GEAC_organic_industry_strengthening: "유기적 산업체 구상"
 GEAC_organic_industry_strengthening_desc: "게헨나 전역의 산업을 총괄하는 거대 산업체를 확실하게 자리 잡도록 만들고, 광범위한 건설-생산간 게헨나 학원 전역의 협력이 필요합니다."
 GEAC_organic_industry_strengthening_tt: "$GEH_tank_designer_tooltip$\n 산업 연구 속도: §G+10%§!\n 건설 속도: §G+5.00%§!\n §Y보병 장비§!: £GFX_production_cost  생산 비용: §G-5.00%§!\n"
 GEAC_germanic_cultural_sphere_induction: "게르만 문화권 유도"
 GEAC_germanic_cultural_sphere_induction_desc: "게헨나 학원의 문화는 현 독일 영토의 문화와 유사점이 많으나, 차이점도 많습니다. 하지만 우리가 독일 전역의 주도권을 두고 트리니티와 경쟁하는 지금, 우리는 독일인의 문화와 우리의 문화 간 동질성을 강조해야 합니다."
 GEAC_air_defense_conception: "영공 방위 구상"
 GEAC_air_defense_conception_desc: "적의 항공 우위에서 이어지는 폭격에 대비해 수 많은 대공포를 설치해야 합니다. 이로써 게헨나의 하늘은 안전해질 것입니다."
 GEAC_makoto_line: "마코토 라인"
 GEAC_makoto_line_desc: "1935년 12월 당시 제안된 하누마 마코토의 '마코토 라인'은 트리니티에게 한 뼘의 땅도 내어줄 수 없다는 가치를 기초로 설계된 요새 선입니다. 우리는 이 가치를 따를 것입니다."
 GEAC_hina_line: "히나 라인"
 GEAC_hina_line_desc: "1936년 1월 당시 제안된 소라사키 히나의 '히나 라인'은 다양한 방면에서의 공격에 대비해 주요 산업시설을 지키고, 최악의 상황을 가정하기 위해 설계된 대도시 요새화 계획입니다. 우리는 이 계획을 실행할 것입니다."
 GEAC_makoto_line_tt: "§Y트리니티§!와 인접한 주의 국경에 §G4§!개의 §Y요새§! 추가:"
 GEAC_hina_line_tt: "게헨나 전역의 §Y주요 도시§!에 §G4§!개의 §Y요새§! 추가:"
 GEAC_air_defense_conception_tt: "우리가 해당 주를 지배한 경우 §Y대공포§!가 §Y하노버§!, §Y헤센§!, §Y오스트라인란트§!, §Y오버바이에른§!, 그리고 §Y룩셈부르크§! 지역에 최대로 추가됩니다"
 GEAC_gehenna_artillery: "룩셈부르크 야포"
 GEAC_gehenna_artillery_desc: "대전이 이전 룩셈부르크의 고숙련 노동자들과, 체계적인 산업 계획을 바탕으로 룩셈부르크-흥신소의 야포는 게헨나 전역에서 뛰어난 성능을 발휘하고 있습니다. 이 비결을 산업체에 통합할 것입니다."
 GEAC_gehenna_artillery_tt: "$GEH_tank_designer_tooltip$\n £GFX_prod_eff_cap 생산 효율 한도: §G+5.00%§!\n §Y보병 장비§!: £GFX_production_cost  생산 비용: §G-5.00%§!\n §Y야포§!: £GFX_production_cost  생산 비용: §G-5.00%§!\n §Y대공포§!: £GFX_production_cost  생산 비용: §G-5.00%§!\n §Y대전차포§!: £GFX_production_cost  생산 비용: §G-5.00%§!\n"
 GEAC_steel_industry_development: "바이에른 철강 산업"
 GEAC_steel_industry_development_desc: "게헨나 선도부는 대전이 이후부터 지속적으로 바이에른 지역의 철강 산업에 투자해 왔습니다. 이내 철강 산업을 발전시킨다면 게헨나 전역의 자원을 바이에른으로 집중시킬 수 있을 것입니다!"
 GEAC_hot_spring_industry_expansion: "게헨나 온천 부글부글 대작전"
 GEAC_hot_spring_industry_expansion_desc: "대전이 당시 일부 함께 전이된 힌놈 산맥의 온천수가 게헨나의 지하를 따라 이어지고 있다는 사실을 알고 있나요? 온천개발부는 아주 잘 알고 있습니다! 약간의... 폭발력과 과감함만 있다면, 우리는 이 원대한 '온천 부글부글 대작전'의 성공을 선언할 수 있을 것입니다."
 GEAC_hot_spring_industry_expansion_tt: "$GEH_tank_designer_tooltip$\n §Y기반시설§! 건설 속도: §G+10.00%§!\n §Y민간공장§! 건설 속도: §G+10.00%§!"
 GEAC_steel_industry_development_tt: "다른 게헨나 국가에서 자원을 수입해 와, §Y수도§!에 £GFX_resources_strip|4 §Y5§!개, £GFX_resources_strip|2 §Y6§!개, £GFX_resources_strip|5 §Y6§!개를 추가합니다."
 GEAC_steel_industry_development_tt2: "§Y수도§!에 £GFX_resources_strip|5 §Y6§!개를 추가합니다."
