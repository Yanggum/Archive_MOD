 GEH_anarchist_society:0 "온천개발부"
 GEH_anarchist_society_desc:0 "온천개발부는 게헨나의 토목 동아리이자 사실상 공병대입니다. 그들은 온천에 대한 광기어린 집착으로 온갖 땅에 구멍을 뚫어두거나 심한 경우에는 배수관 까지 터트리며 온천이라 주장하는 등 문제를 자주 일으키는 동아리입니다."
 GEH_anarchist_society_8_desc:0 "온천개발부는 선도부가 직접 폐지후 새로운 동아리로 개편하면서 이제는 더 이상 문제를 일으키지 않게 되었습니다. "
 GEH_Gourmet_Research_Society_idea:0 "미식연구회"
 GEH_Gourmet_Research_Society_idea_desc:0 "미식연구회. 이름만 들어서는 미식을 찾기 위해 연구하는 동아리 같지만, 실상은 맛있는 거라면 어디든 찾아가 무조건 먹는다고 알려졌습니다. 그곳이 트리니티거나 밀레니엄 가리지 않고 말이죠. 심지어 음식이 맛이 없다면 가차 없이 음식점을 폭파하는 등 사회적 혼란을 야기하는 동아리입니다."
 GEH_dongari_problem:0 "동아리 문제"
 GEH_pandemonium_militia: "만마전 군단"
 GEH_pandemonium_militia_desc: "만마전 군단은 [GEM.GetLeader]에게 충성하고 게헨나를 위해서라는 구호 아래 하나로 단결한 충성스러운 만마전의 사병입니다."
 GEH_great_horn:0 "대혼돈"
 GEH_great_horn_desc:0 "예상하지 못한 사태로 인해 게헨나는 매우 혼란스러운 상태입니다. 상황 파악마저도 미완의 상태인 지금, 우리가 할 수 있는 것을 묻는다면 자신있게 "없다"고 할 수 있을 겁니다. 최대한 빠르게 이 상황에 대해 파악하는 것이 급선무입니다."
 GEH_great_horn_1:0 "상황 인식"
 GEH_great_horn_1_desc:0 "상황을 인식하는 데에는 성공하였습니다만 그렇다고 극적으로 달라진 것은 없습니다. 여전히 게헨나가 선택 가능한 옵션은 몇 없는 상태로 보입니다."
 GEH_great_horn_2:0 "진전된 상황"
 GEH_great_horn_2_desc:0 "어느정도, 정말 어느 정도일 뿐이지만 상황은 확실히 개선되었습니다. 게헨나는 다시 회복하고 있고, 우리에게는 여러 선택지를 고려할 여유도 생겼습니다."
 GEH_Emergency:0 "비상사태 발령"
 GEH_economic_democracy_idea: "경제민주주의"
 GEH_Janghakgeum_idea: "장학금 지원"
 GEH_Greater_War: "대전쟁"
 GEH_Manmajun_Bupae: "걷잡을 수 없는 부패"
 GEH_Manmajun_Bupae_desc: "만마전의 부패는 모든 학원이 알 정도로 유명합니다.\n선도부와 만마전의 갈등을 시작으로 만마전이 부패함은 공공연한 비밀이기도 합니다. 특히 선도부의 예산을 깎아내리거나 말도 안되는 세금을 내게 하는 등 여러 문제가 있지만 학생들은 정치에 무관심하거나 세금을 내지 않기 때문에 부정한 돈은 전부 선도부의 깎인 예산으로 충당됩니다."
