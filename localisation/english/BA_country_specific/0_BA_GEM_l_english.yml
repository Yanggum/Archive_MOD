 GEM_makoto_system_decision: "Hanuma Makoto's Great Feats"
 GEM_makoto_system_tt: "§tHanuma Makoto's Great Feats§! are currently in a [GEM_makoto_system_loc] state."
 GEM_makoto_system_0_text: "§WIncompetent§!"
 GEM_makoto_system_1_text: "§CTrivial§!"
 GEM_makoto_system_2_text: "§GInadequate§!"
 GEM_makoto_system_3_text: "§gFaint§!"
 GEM_makoto_system_4_text: "§LRegrettable§!"
 GEM_makoto_system_5_text: "§YOrdinary§!"
 GEM_makoto_system_6_text: "§OExemplary§!"
 GEM_makoto_system_7_text: "§pSplendid§!"
 GEM_makoto_system_8_text: "§tGreat§!"
 GEM_makoto_system_9_text: "§SMajestic§!"
 GEM_makoto_system_up: "The level of §YHanuma Makoto's Great Feats§! §Sincreases§!.\n- Next Level: [GEM_makoto_system_oneup_loc]"
 GEM_makoto_system_temp_trigger_upper: "§YHanuma Makoto's Great Feats§! level is higher than or equal to [GEM_makoto_system_temp_loc]"
 GEM_makoto_system_temp_trigger_lower: "§YHanuma Makoto's Great Feats§! level is lower than [GEM_makoto_system_temp_loc]"
 GEM_makoto_system_desc_ONE: "§tHanuma Makoto§! is arrogant. She is a radical leader whom anyone would describe as reckless. Yes, that is an undeniable fact. However, because of that, there are many things in this world that only she, who stands at the very front, can accomplish.\n\n§tHanuma Makoto§!'s §YFeats§! reflect this tendency. As she achieves more accomplishments, her §YFeats§! will increase, and as her §YFeats§! grow higher, her grand ideas will gradually begin to manifest in reality. However, as she achieves §SGreat Feats§!, she may gradually drift away from the trivial matters."
 GEM_makoto_system_desc_RIGHT: "Hanuma Makoto may be a villain, but a person cannot be judged by a single dimension. The way she takes care of those around her, her concern for Gehenna, and the fact that she is a confidently elected official highlight her duality.\n\nTherefore, the lower Hanuma Makoto's Feats are, the more she can walk her own path without being shaken by her own arrogance."
 GEM_makoto_system_decision_1: "German Sexual Culture"
 GEM_makoto_system_decision_2: "Integration of Two Worlds"
 GEM_makoto_system_decision_3: "New Order"
 GEM_makoto_system_decision_4: "Gehenna Nationalism Theory"
 GEM_makoto_system_decision_4_desc: "Praise the freedom of Gehenna! What situation do we find ourselves in? It is none other than the crisis of the Academy's extinction! For Gehenna Academy to survive, we must establish 'Gehenna-like' behavior and cultivate a nationalism that is ours, for us, and by us!"
 GEM_makoto_system_decision_5: "Free Gehenna Theory"
 GEM_makoto_system_decision_5_desc: "What is Gehenna's freedom? Even amidst disorder, we build our own community and live freely under the rule of an elected leader. This can be established as the most Gehenna-like ideology: Liberalism!"
 GEM_makoto_system_decision_6: "The Most Disciplinary Committee-like Position"
 GEM_makoto_system_decision_6_desc: "The Gehenna Disciplinary Committee just needs to exist below us as always. Their order is the greatest threat to Gehenna's freedom, and they have proven those suspicions themselves by engaging in warlord activities after the Great Transfer!"

