# 포르모사 공화국

#인물
 TWN_mahung_mona: "Mona Mahung"
 TWN_lin_hsien_tang: "Lin Hsien-tang"
 TWN_chen_yi: "Chen Yi"

#국민정신
 TWN_right_of_resistance_idea: "Will of the Seediq"
 TWN_right_of_resistance_idea_desc: "Even after the island of Taiwan became a Japanese colony, the indigenous Seediq people refused to submit. The Musha Incident of 1930 was a defining event demonstrating the Seediq's spirit of resistance. Led by the Seediq chief Mona Rudao, independence forces conducted guerrilla operations utilizing Taiwan's mountainous terrain until they were eventually suppressed by the Office of the Governor-General of Taiwan.\n\nWhile the 1930 struggle was crushed and Mona Rudao chose to take his own life rather than be captured, the tactical expertise in guerrilla warfare they left behind and the unyielding spirit to protect the island of Taiwan remain unforgotten."
