 IMP_if_day: "$CAN_if_day$"
 IMP_if_day_desc: "Canadians do not feel the threat of foreign occupation keenly enough. We must arrange for [KAI.GetName] to stage an invasion of Winnipeg. This will drive war bond sales and rally the public to our cause."
 CAN_control_canada_parliament: "$ENG_no_further_appeasement$"
