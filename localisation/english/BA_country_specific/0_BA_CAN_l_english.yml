 CAN_kings_speech: "The King's Speech"
 CAN_kings_speech_desc: "With Canadian politics thrown into a state of emergency, Edward, Prince of Wales, has ascended to the throne. The entire Empire now awaits His Majesty's radio address, in which the King is expected to announce the future direction of the Canadian government."
 CAN_check_the_economy: "Assess the Economic Situation"
 CAN_check_the_economy_desc: "The ledgers don't lie, Sensei. And right now, they're telling us something very worrying."
 IMP_crown_corporations: "Crown Corporations"
 IMP_crown_corporations_desc: "To provide essential services and facilitate reasonably predictable economic and industrial growth, Britain must cultivate emerging Crown Corporations. These must be government- and Crown-led ventures, free from private interference."
 IMP_national_research_facility: "National Research Facility"
 IMP_national_research_facility_desc: "Knowledge is the greatest weapon we possess. If we are to reclaim what was lost, our researchers must have the tools to lead us forward."
 CAN_government_unity: "The Fate of Parliament"
 CAN_government_unity_desc: "A house divided cannot stand. We must decide what kind of government we wish to be before circumstance decides for us."
 IMP_collapse_of_imperial_hegemony: "Collapse of Imperial Hegemony"
 CAN_Quebec_problem: "The Quebec Problem"
 CAN_Quebec_problem_desc: "Quebec's patience is not unlimited. If we continue to ignore their grievances, the consequences will be far worse than any external threat."
 CAN_depression_recovery: "Overcoming the Great Depression"
 CAN_depression_recovery_desc: "Recovery does not happen on its own. It takes will, resources, and the courage to act when others hesitate."
 CAN_upper_class_persuasion: "Appeasing the Upper Class"
 CAN_vaccination: "Curing the British Disease"
 CAN_vaccination_desc: "\"The Great Exile\" brought with it a plague that has since infected every corner of our society."
 CAN_create_CBC: "Establish the CBC"
 CAN_create_CBC_desc: "A proposal has been put forward to expand the Canadian Radio Broadcasting Commission into a full national broadcasting network, the CBC. This would help unify a divided nation and limit the reach of potentially subversive foreign broadcasts."
 CAN_supply_the_impire: "Supplying the Empire"

 CAN_canada_neutrality: "The First World"
 CAN_canada_neutrality_desc: "Canada can no longer follow a foreign policy of dependency on Kivotos nations or established great powers like [SOV.GetAdjective]. We must forge a distinct diplomatic course of our own. The answer lies in the First World."
