 mackenzie_king_is_leader_falg: "Entering the §YMackenzie King§! path."
 CAN_Canada_new_deal: "Canadian Public Works Programme"
 CAN_Canada_new_deal_desc: "The Mackenzie King government is actively pursuing a policy of large-scale public works to generate employment. These programmes aim to alleviate unemployment through major infrastructure projects such as roads, bridges, and dams, while revitalising the broader economy."
 CAN_infrastructure_effort: "Expand Canadian National Railways"
 CAN_infrastructure_effort_desc: "The railway network is the lifeblood of Canada, inseparable from the Canadian National Railways. Expanding it will strengthen the nation, and when the day comes that we must move wartime supplies and troops across the country, it will prove its worth beyond any doubt."
 CAN_create_national_employment_commission: "National Employment Commission"
 CAN_create_national_employment_commission_desc: "Established in 1936, the National Employment Commission was founded to address the severe unemployment crisis gripping Canada. The Commission is conducting a thorough nationwide investigation into unemployment conditions and presenting recommendations to help the government introduce effective job creation programmes. Its guidance is expected to play a vital role in providing work for the unemployed through public works and supporting economic recovery."
 CAN_Federal_Provincial_Cooperative_Programs: "Federal-Provincial Cooperative Programmes"
 CAN_Federal_Provincial_Cooperative_Programs_desc: "The Mackenzie King government is reinforcing cooperation between the federal and provincial governments to combat the Great Depression. Through these cooperative programmes, the federal government is working closely with the provinces across areas such as unemployment relief, housing construction, and agricultural support."
 CAN_social_security_system: "Social Security System"
 CAN_social_security_system_desc: "The government is progressively introducing a social security system, manifesting in the form of unemployment insurance and similar measures. These are expected to provide Canadians with a sense of stability and help ease economic anxiety. Such systems will form an important foundation for Canada's future welfare state."
 CAN_banking_reform: "Banking Reform"
 CAN_banking_reform_desc: "The Mackenzie King government is reforming Canada's banking system in pursuit of financial stability. In particular, the Bank of Canada, established in 1935, plays a central role in stabilising financial markets and managing monetary policy. This will equip the government to respond more effectively to economic crises."
 # 매켄지 킹 끝
 CAN_Strengthen_cohesion: "Strengthen Commonwealth Unity"
 CAN_Strengthen_cohesion_desc: "Strengthen Commonwealth Unity"
 CAN_public_works: "Establish Federal Relief Camps"
 CAN_public_works_desc: "The shadow of the Great Depression has not yet lifted. Across our nation, countless unemployed men still languish in poverty or are driven toward crime. The best we can do is gather them into Federal Relief Camps, where they will receive wages and food, and be put to work wherever the country needs them."
 IMP_canada_wheat_board: "Canadian Wheat Board"
 IMP_national_housing_act: "National Housing Act"
 IMP_national_housing_act_desc: "Housing is both a fundamental necessity and a primary source of economic activity. By introducing incentives for the construction and purchase of housing, we can generate demand for key industries and promote broader expansion of the industrial economy."
 IMP_industrial_country: "Arsenal of the Nation"
