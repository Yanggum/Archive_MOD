#이벤트
 
 IMP_event.1.t: "The Exile of the Royal Navy and Army"
 IMP_event.1.d: "Soldiers who fought fiercely on Britain's side have gone into exile."
 IMP_event.1.a: "Ah, you've arrived."

 IMP_event.2.t: "Canada's Resistance"
 IMP_event.2.d: "Canada expels the British!"
 IMP_event.2.a: "Let us show them what we are made of."

 IMP_event.3.t: "Occupation of Suriname"
 IMP_event.3.d: "Taking advantage of the collapse of the Dutch government, British forces have agreed to temporarily administer Suriname in their stead."
 IMP_event.3.a: "For the sake of order, and nothing more!"

 IMP_event.4.t: "The West Indies"
 IMP_event.4.d: "The Caribbean colonies have been consolidated to form the West Indies."
 IMP_event.4.a: "A temporary measure, nothing more."

 IMP_event.5.t: "Egypt Attempts to Nationalise the Suez Canal"
 IMP_event.5.d: "Egypt is attempting to nationalise the Suez Canal. We must negotiate with them swiftly to minimise the crisis."
 IMP_event.5.b: "Show them the full weight of the British Empire!"
 IMP_event.5.a: "Accept their nationalisation in exchange for guaranteed transit rights"
 IMP_event.5.c: "We are powerless right now."

 IMP_event.6.t: "Britain's Acceptance"
 IMP_event.6.d: "Britain has recognised our nationalisation."
 IMP_event.6.a: "Excellent!"

 IMP_event.7.t: "Britain Demands Transit Rights"
 IMP_event.7.d: "In exchange for recognising our nationalisation, Britain has demanded transit rights."
 IMP_event.7.a: "A fair trade."
 IMP_event.7.b: "Out of the question."

 IMP_event.8.t: "Egypt Guarantees Transit Rights"
 IMP_event.8.d: "Egypt has recognised our transit rights."
 IMP_event.8.a: "A relief."

 IMP_event.9.t: "Egypt's Refusal"
 IMP_event.9.d: "Egypt has rejected our proposal."
 IMP_event.9.a: "How unfortunate!"

 IMP_event.10.t: "Britain's Rejection"
 IMP_event.10.d: "Britain has refused to recognise our nationalisation."
 IMP_event.10.a: "Regardless, that land is ours!"

 IMP_event.11.t: "The Middle Eastern War"
 IMP_event.11.d: "Egypt and the British government, at odds over the nationalisation of the Suez Canal, have failed in days of negotiations and entered a state of war.\n\nEgypt has condemned the British invasion as 'a war without justification' over a decision made regarding their own territory. The British government has yet to issue an official statement.\n\nIn response to Britain's aggression, the nations of the Middle East have formed an alliance to aid Egypt and delivered a formal declaration of war to the British government."
 IMP_event.11.a: "Show them the might of the British Empire!"
 IMP_event.11.b: "Drive out the oppressors!"
 IMP_event.11.c: "Most intriguing."

 IMP_event.12.t: "A Cold Dominion"
 IMP_event.12.d: "Despite the desperate resistance of civilians, it was not enough to hold back the enemies who came from another realm. However, the British military ensured that the Royal Family, key government officials, parliamentarians, capitalists and engineers were able to flee to Canada before the chaos on the homeland grew too severe — a card that now makes rapid reconstruction possible."
 IMP_event.12.a: "But not everyone welcomed their arrival."

 IMP_event.15.t: "Colonial Intervention"
 IMP_event.15.d: "It is too early to despair. The British Empire is not yet finished, and the colonies remain within our control!"
 IMP_event.15.a: "Let us crush our enemies!"

 IMP_event.17.t: "Stanley Baldwin's Resignation"
 IMP_event.17.d: "Today, British Prime Minister Stanley Baldwin has resigned, citing health concerns. If the reconstruction that has barely begun is not to be derailed, we must elect a new Prime Minister for the British provisional government."
 IMP_event.17.a: "$ENG_winston_churchill$ of the Conservative Party."
 IMP_event.17.b: "Clement Attlee of the Labour Party."
 IMP_event.17.c: "$CAN_mackenzie_king$, Prime Minister of the Canadian Dominion."
 
 IMP_event.18.t: "Britain Summons the Commonwealth"
 IMP_event.18.d: "Now that the administrative disorder has been resolved, Britain has once again called upon its Dominions."
 IMP_event.18.a: "Let us go."
 
 IMP_event.19.t: "Britain Demands Submission"
 IMP_event.19.d: "Under the pretext of securing a foothold for an advance on the homeland, Britain has demanded that we surrender our sovereignty."
 IMP_event.19.a: "Are they out of their minds!"
 IMP_event.19.b: "...We would consider joining the Commonwealth. If Northern Ireland is transferred to us."
 IMP_event.19.c: "Give us Northern Ireland in return."
 
 IMP_event.20.t: "Ireland's Partial Acceptance"
 IMP_event.20.d: "Ireland has responded, stating they will join the Commonwealth on the condition that Northern Ireland is transferred to them — a partial acceptance of our demands."
 IMP_event.20.a: "Accept the terms."
 IMP_event.20.b: "We cannot relinquish legitimate British territory."
 
 IMP_event.21.t: "Ireland's Acceptance"
 IMP_event.21.d: "Ireland has accepted our demands."
 IMP_event.21.a: "Splendid!"
 
 IMP_event.22.t: "Britain Invites Us Into the Commonwealth"
 IMP_event.22.d: "Britain has invited us to join its sphere."
 IMP_event.22.a: "Accept."
 IMP_event.22.b: "Decline."
 
 IMP_event.24.t: "A Promise to the People"
 IMP_event.24.d: "To raise our Communist Party's support, we will make a promise to the people. What shall that promise be?"
 IMP_event.24.a: "Promise to build military factories."
 IMP_event.24.b: "Promise to build civilian factories."
 IMP_event.24.n: "Promise the highest standard of living."
 IMP_event.24.m: "Promise gender equality."
 
 IMP_event.28.t: "[FROM.GetName] Demands the Return of Territory"
 IMP_event.28.d: "Britain is making a fuss, demanding their land back."
 IMP_event.28.a: "Very well."
