 IMP.0.t: "Coronation of Edward VIII"
 IMP.0.desc: "His Majesty King Edward VIII becomes the first British monarch to hold his coronation outside Westminster Abbey. Royal planners have instead arranged an elaborate ceremony at Christ Church Cathedral, Ottawa's largest Anglican cathedral. The Archbishop of Canterbury, himself an exile from Britain, conducted the rites in accordance with tradition, with the eyes of the press watching closely. Immediately after the coronation, His Majesty appeared not on the balcony of Buckingham Palace, but on the balcony of Rideau Hall, the current official royal residence, where he was met with an outpouring of enthusiasm from the Canadian people."
 IMP.0.a: "A legitimate coronation, all things considered!"
 ENG_coronation_of_edwards: "$ENG_king_edward$ — Coronation Complete"
 IMP.1.t: "The King's Speech"
 IMP.1.desc: "The moment approaches for King Edward to deliver his first radio address to the Empire. His Majesty must carefully consider what message to convey. The British exiles wish him to declare a firm and resolute commitment to reclaiming the homeland, while the Canadian Parliament and its citizens prefer a more moderate approach. They believe that by supporting the Canadian Prime Minister or a conciliatory leader, the unity of our Dominion can be preserved and stability maintained.\n\nThe hour of the address is nearly upon us. A decision must be made swiftly."
 IMP.1.a: "Support the Conservatives"
 IMP.1.b: "Support the Liberals"
 you_can_see_ENG_gui: "You may now access the Exile Government GUI."
 IMP.2.war.t: "King Edward Pledges to Reclaim the Homeland!"
 IMP.2.neu.t: "King Edward Delivers a Measured and Broad Address!"
 IMP.2.gov.t: "King Edward Endorses the Liberal Party"
 IMP.2.d.war: "King Edward's radio address reached every corner of Canada — from Vancouver to St. John's, from Toronto to the Arctic. His Majesty delivered a fierce condemnation of the Kaiser Corporation, and proclaimed with resolute conviction his intention to finish the war his father began and reclaim Britain at last.\n\nThe address, emphasising strong leadership, rallied the British exile community and lent great encouragement to resistance forces within Britain. At the same time, however, it has generated unease and heightened tension among Canada and the other Dominions."
 IMP.2.d.gov: "King Edward's radio address reached every corner of Canada — from Vancouver to St. John's, from Toronto to the Arctic. Canadians were deeply moved by a measured and dignified speech that emphasised cooperation and solidarity among the Dominions, and stressed the importance of stability above all else.\n\nThe address offered Canada and the other Dominions an opportunity to preserve unity and cohesion. Among the British exile community, however, it fell short of expectations."
 IMP.2.d.neu: "King Edward's radio address delivered an important message to the people and the nation. From Vancouver to St. John's, from Toronto to the Arctic, Canadians responded warmly to a dignified and stirring speech that expressed the resolve to reclaim the homeland while emphasising the stability and unity of the Dominions.\n\nThe address drew a positive response from both the exiles and the Dominions alike, though it left no particularly strong impression on either side. This risks casting doubt upon the King's capacity for decisive leadership."
 IMP.2.a: "Long live the King!"
 IMP.3.t: "Aftermath of the Address"
 IMP.3.desc: "Edward VIII's speech could not satisfy everyone. As a result, certain figures have begun deliberately exaggerating specific portions of the address and spreading their interpretations throughout society..."
 IMP.3.a: "Oh dear.."
 CAN_anger_change_tt_1: "A speech endorsing the Liberals benefits the Liberal Party."
 CAN_anger_change_tt_2: "A speech endorsing the Liberals is detrimental to the Conservative Party."
 CAN_anger_change_tt_3: "Pledging to reclaim the homeland is detrimental to the Liberal Party."
 CAN_anger_change_tt_4: "Pledging to reclaim the homeland is detrimental to the Canadian public."
 CAN_anger_change_tt_5: "Pledging to reclaim the homeland benefits the Conservative Party."
 CAN_imp_3b_people_tt: "The people remember every promise made from that podium. They are watching."
 IMP.4.t: "$ENG_stanley_baldwin$ Requests Retirement"
 IMP.4.desc: "Today, Sir Stanley Baldwin has made the decision to resign as Prime Minister. In recent days, Europe has crumbled beneath relentless turmoil. The collapse of Germany and France sent shockwaves across the world, and Britain could not escape this terrible crisis. The British homeland, struck without warning by forces from another realm, was left with no choice but to surrender, and so the government of the British Empire was compelled to seek refuge in Canada.\n\nPrime Minister Baldwin led Britain through this moment of crisis and gave his utmost. Yet the accumulated fatigue and strain of unrelenting crisis ultimately took a heavy toll on his health, bringing him to the decision to relinquish the office.\n\nHis leadership and dedication will never be forgotten. He will be remembered for his service and devotion to his country. Even as a new leader steps forward to guide the nation through these difficult times, the achievements of Sir Stanley Baldwin will endure forever in the history of the British Empire."
 IMP.4.a: "You have served well, Earl $ENG_stanley_baldwin$."
 IMP.5.t: "Appointment of the Prime Minister"
 IMP.5.mackenzie: "Today, King Edward has appointed Canada's William Lyon $CAN_mackenzie_king$ as the new Prime Minister of the British Empire. The recent collapse of the Western world and the sudden fall of the British homeland left the Empire with no choice but to seek refuge in Canada. Through this crisis, the King's personal rule has been maintained, but the demands of the Canadian Parliament and the Dominion governments have made the appointment of a new leader unavoidable.\n\nKing Edward has chosen $CAN_mackenzie_king$ as the figure who, as Canada's own Prime Minister, best embodies the unity of the Dominions. $CAN_mackenzie_king$ has built a long political career in Canada, and his moderate, measured leadership has played a vital role in preserving stability and cooperation among the Dominions. He commands the full confidence of the Canadian government, and it is hoped that this appointment will strengthen the cohesion of the entire Commonwealth.\n\nThe appointment of $CAN_mackenzie_king$ will reinforce solidarity within the Dominions and play a pivotal role in helping the British Empire construct a more resilient defence against the threats of another realm. He is regarded as the right person to see the Empire through this crisis and lead its reconstruction.\n\nIn appointing $CAN_mackenzie_king$, King Edward emphasised: \"In these trying times, cooperation and unity among the Dominions are paramount. Prime Minister $CAN_mackenzie_king$ is the right man to answer this moment's demands.\"\n\n$CAN_mackenzie_king$ will make the stability of the British Empire and cooperation among the Dominions his foremost priorities, and will dedicate every effort to raising the Empire from the ashes of this crisis."
 IMP_5public: "60th Prime Minister of the United Kingdom."
 IMP.5.a: "$IMP_5public$ $ENG_winston_churchill$."
 IMP.5.b: "$IMP_5public$ $CAN_mackenzie_king$."
 IMP.6.t: "Statement of the Canadian Parliament: An Appeal to His Majesty $ENG_king_edward$"
 IMP.6.desc: "Your Most Gracious Majesty $ENG_king_edward$,\n\nWe find ourselves in a situation of profound uncertainty, amidst the collapse of the Western world and the crisis gripping the British Empire. Since the British homeland fell to sudden attack and surrendered, the centre of the Empire has moved to Canada. The peoples and Dominions of the British Empire have rallied beneath Your Majesty's leadership, and we are deeply grateful for the guidance Your Majesty has provided through this crisis under personal rule.\n\nYet even in these difficult times, we believe that the normalisation of government is essential to restoring the stability and continuity of the state. The Dominions and peoples of the British Empire look to the Canadian government to exercise strong leadership and see this crisis through. It is only when the leadership of the Canadian Prime Minister is once again fully exercised that the unity of the British Empire can be maintained, and the challenges brought about by the transformation of the Western world effectively met.\n\nAccordingly, the Canadian Parliament respectfully implores Your Majesty: we earnestly beseech Your Majesty to bring the state of emergency to a close and entrust the full authority of government once more to the Canadian Prime Minister, so that stability and hope may be restored to the people. Only with such measures in place can we face the future with a united heart and overcome this crisis.\n\nYour Majesty, the time has come for an important decision to be made.\n"
 IMP.6.a: "Accept the demands of the Canadian Parliament."
 IMP.6.b: "Reject the demands of the Canadian Parliament."
 IMP.7.t: "The Liberals and the Conservatives"
 IMP.7.desc: "The British Parliament has, through the course of the 'Great Exile', found a foothold in the Canadian political arena. Senior figures from Britain's Conservative Party have joined the Canadian Conservative Party, and the Conservatives — who suffered a devastating defeat in the 1935 general election — are now becoming a formidable threat to the Liberals.\n\nNevertheless, they will not be in a position to engage in immediate political action. The failure of Prime Minister Bennett's policies must be acknowledged, and the party must undergo a process of reorganisation. As internal reforms are pursued, the Conservatives will strive to transform themselves. This process of change and reorganisation will take time, but there is every reason to believe they are moving with long-term plans in mind.\n\nShould the opportunity arise, however, the Conservatives may criticise our government's failings, demand accountability, and shake the foundations of power. When they are fully prepared politically, the landscape of Canadian politics could shift dramatically. To guard against this eventuality, our government must practise careful prioritisation in domestic and foreign affairs, and respond with thorough consideration of our larger strategic objectives. We must manage the present crisis while making prudent policy decisions in preparation for the challenges ahead."
 IMP.7.a: "Quite the headache."
 IMP.8.t: "Sorting Out Parliament"
 IMP.8.desc: "With senior figures from the British Conservative Party joining the Canadian Conservatives, confusion in Parliament has deepened considerably. Several MPs opposed to admitting British politicians are making their voices heard, while Canadian Conservative members dismiss their objections as constitutionally guaranteed rights. In these circumstances, the importance of Prime Minister Mackenzie King has come into ever sharper relief."
 IMP.8.a: "\"I'm not sure I'm ready to give that speech...\""
 IMP.9.t: "Curing the British Disease"
 IMP.9.desc: "The 'British Disease' that plagued Canada for so long is now nothing more than a shadow of the past. Thanks to the tireless efforts of dedicated medical personnel, the majority of patients have received treatment, and those not yet reached will soon find their way to recovery. The healing has begun, and we are once again moving toward a healthy future."
 IMP.9.a: "Good news at last!"


