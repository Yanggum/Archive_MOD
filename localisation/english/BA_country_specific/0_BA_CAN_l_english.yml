 ENG_country_intro_header: "Rule, Britannia!"
 ENG_country_intro_header_1: "The Great War and Peace"
 ENG_country_intro_header_2: "Britons never, never, never shall be slaves."
 ENG_country_intro_content: "Victory in the Napoleonic Wars became the turning point that elevated the British Empire into a global hegemon. The defeat of France by the Coalition forces weakened French influence across Europe, and Britain, commanding a relatively powerful navy and a worldwide trading network, came to dominate the international order. The era of 'Pax Britannica' that followed — a period in which the British Empire mediated the world's major conflicts and preserved the peace — is remembered as the Empire's most glorious chapter.\n\nThe golden age of the Victorian era, which followed the Napoleonic Wars, allowed the British Empire to enjoy its finest hour. Yet the near-absence of war during that period left the British people, in a sense, pickled in peace. The British Empire basked in its glory. Hong Kong, Australia, New Zealand, Canada, and above all India — that great jewel in the Imperial crown — proclaimed the Empire's staggering prestige to the entire world.\n\nWith each passing year, the British Empire, having in practice divided the world with its rival France, earned the epithet — following in the footsteps of Spain — of 'the Empire on which the sun never sets.' It seemed as though the Empire's prestige would endure forever."
 ENG_country_intro_content_1: "But all things must end. The might of the British Empire too began to waver. Britain, which had crushed Napoleon and dominated Europe, now found itself facing the challenge of rising new great powers. In particular, Prussia, having achieved unification and formed the German Empire, rapidly expanded its national strength and pressed hard on the heels of the British Empire. The 'Weltpolitik' pursued by Kaiser Wilhelm II of the German Empire revealed imperialist ambitions and sought to reshape the order of Europe and the world. Germany's rise was threatening enough to drive Britain to join hands with its old rival, France.\n\nThis conflict gradually intensified and ultimately led to the catastrophic tragedy of the First World War — the Great War. That war swept across Europe and the globe, claiming countless lives and inflicting enormous damage on Britain and the other great powers. The British Empire too lost vast numbers of soldiers in the conflict, and the war brought with it a spiralling financial and economic burden. This shook the Empire's standing profoundly, placing it in a position where maintaining its former overwhelming dominance was no longer so straightforward.\n\nNevertheless, the British Empire endured. Thanks to its vast colonial possessions spread across the globe and its still-solid economic foundations, it was able to maintain a relatively stable footing even through the Great Depression that followed the Great War. But the scars of war left deep shocks in British society and its economy. The immense resources and manpower consumed during the conflict, and the resulting fiscal burden, gradually sapped Britain's strength. As a result, the British Empire began to adopt an increasingly reluctant attitude toward war, and its leadership on the world stage slowly weakened."
 ENG_country_intro_content_2: "What plunged the knife into the back of the British Empire — its flags flying across the whole world — was none other than strangers who appeared without warning. They threw Europe into chaos, and Britain was no exception. As Kaiser Corporation aliens seized London and European nations crumbled one by one, the people of the British Empire — politicians and ordinary citizens alike — found themselves standing against them.\n\nYet the fate of the British Empire is like a candle flame in the wind. The colonies that once symbolised Imperial prestige, seeing their master Britain begin to falter, are biding their time and watching keenly for any opportunity to slip free of their shackles. The disparity in strength between the Kaiser Corporation and the British military has sown the seeds of despair among the British people.\n\nFor the first time since the Norman Conquest, the British Isles are being thrown into turmoil by foreign assault. There appears to be no hope in sight for them right now — but beneath the name of Britannia, soldiers take up their rifles and will fight on against the aliens to the very last."
