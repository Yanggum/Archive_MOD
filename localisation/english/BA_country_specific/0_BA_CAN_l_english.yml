 ENG_emergency_laws_uk_ns_tt: "A debate on the Imperial Emergency Powers Act begins in Parliament."

#중점
 CAN_focus_0: "Establish a Provisional Government"
 CAN_focus_0_desc: "The situation is unprecedented. We must act quickly to establish a foundation of authority before the chaos consumes us."
 CAN_focus_1: "Consolidate the Canadian Government"
 CAN_focus_1_desc: "A government in exile is still a government. Let us prove it."
 CAN_focus_2: "Normalise the Government"
 CAN_focus_2_desc: "Stability is not given — it must be built, brick by brick, until it can hold the weight of an empire."
 CAN_focus_2_1: "The British Bulldog"
 CAN_focus_2_1_desc: "Some embers refuse to die. Churchill is one of them."
 CAN_focus_2_1_1: "No Further Appeasement"
 CAN_focus_2_1_1_desc: "Appeasement has bought us nothing but time. That time is now up."
 CAN_focus_2_1_2: "Reignite the Flames"
 CAN_focus_2_1_2_desc: "The spirit of resistance is not dead. It merely needs someone bold enough to fan it."
 CAN_focus_2_1_3: "Remember the War Against the Kaiser"
 CAN_focus_2_1_3_desc: "We have faced impossible odds before. We faced the Kaiser and we endured. We shall endure again."
 CAN_focus_2_1_4: "Flames Toward the Homeland"
 CAN_focus_2_1_4_desc: "Every resource, every effort, every sacrifice — directed toward one goal. We are going home."
 CAN_focus_2_1_4_1: "Civilian Budget Allocation"
 CAN_focus_2_1_4_1_desc: "Even in wartime, the people must eat. A balanced budget keeps the home front intact."
 CAN_focus_2_1_5: "Rally the British Exiles"
 CAN_focus_2_1_5_desc: "They came with nothing but their lives and their loyalty. Now we give them a purpose."
 CAN_focus_2_1_6: "Pressure on Iraq"
 CAN_focus_2_1_6_desc: "The Empire's reach extends far. Let us remind certain parties of that fact."
 CAN_focus_2_1_7: "Organise the Patriot Corps"
 CAN_focus_2_1_7_desc: "Patriots are not born in comfort. They are forged in adversity — and we have adversity in abundance."
 CAN_focus_2_1_8: "Assert Pax Britannica"
 CAN_focus_2_1_8_desc: "The world was once ordered by Britain's hand. It can be again."
 CAN_focus_2_2: "Clement Attlee"
 CAN_focus_2_2_desc: "A quiet man with firm convictions. Do not mistake his composure for weakness."
 CAN_focus_2_2_1: "Focus on Domestic Affairs"
 CAN_focus_2_2_1_desc: "Victory abroad begins with strength at home. Let us not forget that."
 CAN_focus_2_2_2: "Nationalise Industry"
 CAN_focus_2_2_2_desc: "The market has had its chance. It is time for the state to take the wheel."
 CAN_focus_2_2_3: "Balance of Military and Civilian Industry"
 CAN_focus_2_2_3_desc: "Guns and butter. We need both, and we cannot afford to lose sight of either."
 CAN_focus_2_2_4: "Implement Welfare Policies"
 CAN_focus_2_2_4_desc: "A nation that does not care for its people cannot ask those people to sacrifice for it."
 CAN_focus_2_2_5: "Unemployment Labour Camps"
 CAN_focus_2_2_5_desc: "Idle hands are no use to anyone. Let us put them to work rebuilding what we've lost."
 CAN_focus_2_2_6: "Establish the NHS"
 CAN_focus_2_2_6_desc: "Every man, woman and child deserves to be healthy. That is not a privilege. It is a right."
 CAN_focus_2_2_7: "Root Out Communism Within the Party"
 CAN_focus_2_2_7_desc: "We believe in the people. That is not the same as believing in those who would use the people as a weapon."
 CAN_focus_2_2_8: "Public Housing Supply Plan"
 CAN_focus_2_2_8_desc: "A people without homes cannot be a people with hope. We build houses; we build futures."
 CAN_focus_2_2_9: "Expand State Enterprises"
 CAN_focus_2_2_9_desc: "Certain industries are too important to be left to chance. The state will ensure they serve the nation."
 CAN_focus_2_3: "A Prime Minister for Canadians"
 CAN_focus_2_3_desc: "Canada has carried the weight of this empire long enough. It is time a Canadian led it."
 CAN_focus_3: "Royal Political Intervention"
 CAN_focus_3_desc: "A king who watches from the sidelines is no king at all. The throne must act."
 CAN_focus_3_1: "Sanction the Blackshirts"
 CAN_focus_3_1_desc: "Unconventional times call for unconventional measures. The King has made his choice."
 CAN_focus_3_2: "The King's Party"
 CAN_focus_3_2_desc: "Loyalty to the Crown, above all faction and all party. That is the foundation of what we build here."
 CAN_focus_4: "Rebuild the Commonwealth"
 CAN_focus_4_desc: "The Empire is not dead. It is scattered. It is our task to gather it once more."
 CAN_focus_4_1: "Mobilise Colonial Elites"
 CAN_focus_4_1_desc: "Those who prospered under the Empire must now invest in its survival."
 CAN_focus_4_2: "Commonwealth Solidarity"
 CAN_focus_4_2_desc: "Divided, we are exiles. United, we are still an empire."
 CAN_focus_4_3: "Develop Australia"
 CAN_focus_4_3_desc: "Australia's potential has barely been scratched. Let us change that."
 CAN_focus_4_4: "Develop New Zealand"
 CAN_focus_4_4_desc: "A quiet corner of the Empire — but no less vital for it."
 CAN_focus_4_5: "Develop the Canadian Heartland"
 CAN_focus_4_5_desc: "Canada is not merely a refuge. It is the foundation from which we rebuild."
 CAN_focus_4_6: "Develop South Africa"
 CAN_focus_4_6_desc: "The resources of South Africa could prove decisive. We must not squander them."
 CAN_focus_4_7: "Convene the Imperial Conference"
 CAN_focus_4_7_desc: "The Dominions must speak with one voice. It begins with getting them in the same room."
 CAN_focus_4_8: "Imperial Federation"
 CAN_focus_4_8_desc: "One empire, one government, one purpose. The dream has always been this. Now it is a necessity."
 CAN_focus_4_9: "Commonwealth Air Training Plan"
 CAN_focus_4_9_desc: "Air superiority will be decisive in the wars to come. We train together, or we fall apart."
 CAN_focus_4_10: "Focus on Homeland Defence"
 CAN_focus_4_10_desc: "Before we can reclaim what was lost, we must ensure we do not lose what remains."
 CAN_Immunizations: "Immunisation Programme"
 CAN_Immunizations_desc: "A healthy population is a resilient one. We vaccinate not just bodies, but hope."
 
 CAN_focus_d_1: "Abandon Balanced Budget"
 CAN_focus_d_1_desc: "In times of crisis, austerity is not virtue — it is surrender. We spend what must be spent."
 CAN_focus_d_1_5: "Subsidies for Private Enterprise"
 CAN_focus_d_1_5_desc: "Industry will not recover on goodwill alone. We provide the fuel; they provide the engine."
 CAN_focus_d_2: "Expand Government Expenditure"
 CAN_focus_d_2_desc: "The Depression will not wait for balanced ledgers. Neither shall we."
 CAN_focus_d_3: "Controlled Inflation"
 CAN_focus_d_3_desc: "Carefully managed, inflation is a tool. Poorly managed, it is a catastrophe. We intend the former."
 CAN_focus_d_4: "Canada's Highway System"
 CAN_focus_d_4_desc: "Roads connect people, industry and armies. A nation without roads is not truly one nation."
 CAN_focus_d_5: "Trade with the United States"
 CAN_focus_d_5_desc: "Our neighbour to the south has resources we need. Commerce is the language we share."
 
 CAN_focus_a_1: "Transfer of British Exile Assets"
 CAN_focus_a_1_desc: "Those who brought their wealth here must now share in the burden of rebuilding."
 
 CAN_focus_2_i: "Exile Industrial Reorganisation Committee"
 CAN_focus_2_i_desc: "Industry does not rebuild itself. Someone must coordinate the effort — and it must be us."
 CAN_focus_2_i_1: "Ontario Hydroelectric Power"
 CAN_focus_2_i_1_desc: "Water and gravity do not care about the state of the world. Let us put them to work."
 
 CAN_focus_l_1: "Review the Draft Imperial Emergency Powers Act"
 CAN_focus_l_1_desc: "The law must keep pace with the crisis. What was unthinkable yesterday may be necessary today."

