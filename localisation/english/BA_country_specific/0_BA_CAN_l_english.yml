 impindia.4.t: "Expanding the Stresa Front?"
 impindia.4.d: "Today, a proposal from [ENG.GetLeader] was formally delivered to [ROOT.Capital.GetCapitalVictoryPointName]. The proposal calls for the expansion of the Stresa Front, which has been rendered effectively toothless. Should we accept this expansion, we would assume a central role in the anti-Kivotos coalition and become the linchpin of solidarity among the nations of this world. We would also be positioned to broaden our military and economic alliances and elevate pan-European values."
 impindia.4.a: "Accept the proposal"
 agree_of_stresa_front_tt: "If §Ythe proposal is accepted§!, we will join the §YStresa Front§! led by the [ENG.GetAdjective] side within a few days."
 impindia.4.b: "We have our own path to walk. The Stresa Front is not ours to join."

 impindia.5.t: "[FROM.GetName] Endorses the Expansion of the Stresa Front!"
 impindia.5.d: "Wonderful news! The [FROM.GetAdjective] side has agreed to our proposal and put the Stresa Front to a vote. We have now formally confirmed our military and economic alliance."
 impindia.5.a: "Splendid news!"

 impindia.6.t: "[FROM.GetAdjective] Rejects the Stresa Front Expansion"
 impindia.6.d: "Unfortunately, [FROM.GetCapitalVictoryPointName] has declined our proposal."
 impindia.6.a: "Well, their loss."

 impquebec.1.t: "Quebec in Flames"
 impquebec.1.d: "The grievances of Quebec, slowly suppressed since the Great Depression, have erupted into a full-blown social crisis, ignited by the war and a sweeping epidemic. In particular, discriminatory acts carried out by British exiles within Quebec have set the anger of its citizens alight, triggering mass protests. Quebecers have poured into the streets; Rue Sainte-Catherine in Montreal is packed with furious crowds. They are chanting strident slogans against not only the Prime Minister, but the King himself.\n\nThis recalls the conscription crisis of 1917, but this time, the patience of French Canadians seems to have reached its absolute limit. 'Must we once again shed French blood for the English!' the Lieutenant-Governor of Quebec cried before the crowds gathered in Quebec City. 'We say no. But they say we must! So long as Quebec remains a pet of British politicians, we can never be free of their tyranny!'"
 impquebec.1.a: "We should have seen this coming."
 
 impblack.0.t: "Canada's Economic Situation"
 impblack.0.d: "Canada's economy is currently mired in a severe crisis. The lingering aftermath of the Great Depression continues to delay economic recovery, while high unemployment and rising prices are making life increasingly difficult for ordinary Canadians. Compounding this, the collapse of the British homeland has brought a flood of exiles into Canada, placing ever greater strain on the nation's finances. The government is struggling to allocate limited resources, and uncertainty pervades every sector of the economy.\n\nCanada now faces the dual challenge of resolving the problems wrought by the Great Depression while alleviating the additional fiscal burden imposed by the exiles."
 impblack.0.a: "What a mess."

 impblack.1.t: "$CAN_create_national_employment_commission$"
 impblack.1.desc: "When Mr. Phillips unfolded the morning newspaper, he skimmed the headlines with a heart already heavy with disappointment. Unemployment brought on by the Great Depression was a word he knew all too well, and yet he had not managed to find a way out. The factory where he had worked for so many years had shut its doors years ago, and since then, each attempt to find new work had ended in failure. But that morning, a small article tucked away in the corner of the paper caught his eye.\n\n\"National Employment Commission — A First Step Toward Solving Unemployment Nationwide.\"\n\nHe read the article slowly. It described a commission tasked with investigating unemployment and advising the government on how to create jobs at a national level. Something about it stirred a cautious hope in Mr. Phillips. The article emphasised that the commission was developing plans for public works programmes through which the government would provide employment.\n\nA few days later, he resolved to visit the National Employment Commission in person. He was still anxious, but at least it was worth trying. The commission's office was far larger and more organised than he had expected. When he walked through the door, the staff greeted him warmly and asked, in a calm and unhurried manner, what kind of help he needed. Their kindness put him at ease in a way he hadn't expected.\n\nA counsellor at the commission listened attentively to Trevor's background and circumstances, then recommended a public works programme suited to him — bridge repairs, road widening, the building of community infrastructure. It was physical work, but Mr. Phillips could see how much it mattered. These jobs meant more than just a wage; they meant a chance to contribute to society again.\n\nWeeks later, Mr. Phillips began his new job. It was unfamiliar and exhausting at first, but as he made his way to the worksite each morning, he could feel something returning — a vitality he thought he'd lost. Sweating alongside his fellow workers, widening roads and raising bridges, was hard labour, but within it he found a sense of accomplishment he hadn't felt in a very long time.\n\nOne afternoon, during a break, he sat with a cup of coffee and talked with his colleagues."
 impblack.1.a: "\"It's the National Employment Commission that brought us all here together.\""

 impblack.2.t: "$CAN_social_security_system$"
 impblack.2.desc: "After suffering a serious injury in an industrial accident, Mr. Michael felt as though everything had fallen apart. The accident at the workplace where he had laboured for years did not merely wound his body — it stripped away his livelihood and the last of his hope for the future. Medical bills continued to mount, and his inability to work felt like a tunnel with no end in sight. His view of the world grew darker by the day, and he felt trapped in a fear and anxiety from which he might never escape.\n\nBut one day, he heard news of a newly introduced social security system. The programme would provide temporary financial support to the unemployed and those rendered unable to work by accident. At first, he wasn't sure how much of a difference it would make to his life, but as time passed, he began to understand its meaning.\n\nThanks to the social security system, he no longer had to worry about making ends meet day to day. The modest but steady support gradually brought a measure of stability to his life, and he found a peace of mind he had not known in a long while. Mr. Michael began to nurture the hope that this programme could help him get back on his feet. He decided then that he would not give up on himself.\n\nHe began looking for work again. His body had not fully recovered, but he was filled with the conviction that he had to try for a better future. He stepped forward with the hope that he could once again take his place as a member of society.\n\nMr. Michael now stood on the threshold of a new challenge. A brightness had returned to his eyes, and he was ready to face whatever lay ahead."
 impblack.2.a: "\"Mr. Michael. We'd like you to start tomorrow.\""

 impblack.3.t: "$CAN_banking_reform$ - 1"
 impblack.3.desc: "As the Canadian Depression deepened, despair spread in every direction. Many people lost everything they had entrusted to the banks, and farmers found themselves cut off from credit, growing more desperate by the day. Relying on worn-out farm equipment, they scraped by a meagre existence, sinking into ever greater frustration as time wore on. Anxiety settled over the countryside and across Canada as a whole, and their hopes grew ever dimmer.\n\nIn the face of this, Prime Minister Mackenzie King could no longer stand idle. He resolved to begin banking reform — to rescue the banks on the brink of collapse and restore the confidence of the people. Measures to right the financial system and stabilise the economy were essential. With the fear that the collapse of the banks would shake the entire economy, King made his decision.\n\nThe reforms had only just begun, but small changes were already being felt. Some banks reopened their doors, and farmers could at last get their hands on the funds they so badly needed. The realisation that they no longer had to depend entirely on worn-out equipment put a cautious, quiet hope in the farmers' hearts. They looked at one another and raised a modest glass."
 impblack.3.a: "To think they didn't even have the money to buy farm tools!"

 impblack.4.t: "$CAN_banking_reform$ - 2"
 impblack.4.desc: "Mr. Frankland had been trying to get through to the bank for days. With the small business he had built now in serious trouble, he believed a bank loan was his last hope. But that day, the answer was no different.\n\n\"Why won't you help us?\" Mr. Frankland asked, desperation clear in his voice. He had tried many times, and the reply was always the same.\n\nThe bank clerk responded carefully. \"I'm very sorry, but we are doing our best. However... lending is not possible at this time.\"\n\nAt those words, Mr. Frankland could no longer speak. As he set down the receiver, the thought that his company might go bankrupt swept through him, and a deep despair followed close behind. The fear that the company he had spent so long building could collapse in an instant had become all too real. The faces of his employees, and the promises made to countless partners, flashed through his mind. He had nothing left to do but sit in helplessness as the hours passed.\n\nThen, a few days later, the fateful day arrived. On the very day he thought there was nowhere left to turn, the telephone rang. Mr. Frankland slowly picked up the receiver.\n\n\"Good day, is this Mr. Frankland?\" came the voice of a bank employee. \"Your loan application has been approved.\"\n\nFor a moment, Mr. Frankland said nothing, as though he couldn't quite believe it. The news he had waited so long for had come to him at the darkest possible moment. He could not yet allow himself to fully relax, but the deep relief of knowing his company had been pulled back from the brink of ruin was overwhelming."
 impblack.4.a: "Thank heavens for that!"

 impblack.5.t: "$CAN_banking_reform$ - 3"
 impblack.5.desc: "The Canadian government significantly strengthened financial regulation following the Great Depression, making the banking system far safer. These measures instilled in investors and depositors the belief that their money was securely protected. Specifically, the tightened regulations reduced excessive risk-taking by banks and curbed reckless lending, thereby improving the stability of the financial system overall. As a result, financial institutions adopted more prudent investment and lending policies, which had a broadly positive effect on financial markets.\n\nThese changes provided a safer financial environment not only for individuals, but for businesses as well. Companies were able to manage their finances more predictably thanks to a stable financial system, and this contributed to the growth of the wider economy.\n\nOrdinary people, too, no longer felt anxious about depositing their money or making investments — they had far greater confidence in the banks."
 impblack.5.a: "\"To know our money is safe — what a relief!\""

 impblack.6.t: "The Depression Resolved"
 impblack.6.desc: "The Depression is no more. Through the persevering efforts of our government, the key economic indicators have returned to their proper course, and the people have at last recovered the stability and daily life they knew before the Great Depression. No external threat can shake us any longer. We endured. We prevailed."
 impblack.6.a: "Tonight, at least, we celebrate."

 impblack.15.t: "The Plight of the Farmers"
 impblack.15.desc: "Canada has been struck by a triple calamity: drought, falling grain prices, and the Great Depression. As consumption plummeted, farmers found themselves crushed beneath debts they had been carrying even before the Depression, which soon made it impossible to produce a proper harvest. Bankruptcy is becoming an inescapable reality. Falling incomes from poor harvests could ultimately mean losing their land altogether."
 impblack.15.a: "No one has it easy right now."
 impblack.15.b: "Let us begin with debt relief."

 impblack.10.t: "The Debate"
 impblack.10.d: "The Federal-Provincial Cooperative Programmes are a collaborative structure in which the federal government coordinates and guides provincial policy toward better outcomes. Yet these programmes are a double-edged sword. Should problems or incidents arise, the federal government will find it difficult to avoid responsibility for provincial failures, which could foster distrust toward Ottawa. Conversely, if the federal government does not involve itself in provincial policy, there is every risk of provincial corruption or negligence in carrying out their duties.\n\nFor this reason, some experts recommend that cooperative programmes be managed and overseen with great care. On one hand, there are those who argue that all provincial policies must be rigorously supervised and corrected; on the other, ministers who favour free market principles contend that government intervention should be minimised and the provinces left to function autonomously."
 impblack.10.a: "Dispatch an inspector."
 impblack.10.b: "Oversee and manage matters directly."

 impblack.11.t: "Setting the Direction of Policy"
 impblack.11.d: "As we cooperate with the provincial governments, we find ourselves uncertain about how to set the direction of policy. We must now decide where and how our programmes will be carried out."
 impblack.11.a: "Focus on addressing bureaucratic issues."
 impblack.11.b: "Invest in regional industrial development."
 impblack.11.c: "Invest in regional research facilities."
 

 completed_CAN_from_federal_proincial_coop_tt: "The results of the Federal-Provincial Cooperative Programmes are taking shape in this region, and their benefits are beginning to be felt."
 impblack.12.t.hospital: "Expansion of the Healthcare System"
 impblack.12.d.hospital: "Today, the hospital opened its doors. The fruits of federal support and provincial cooperation are now laid out before us. A dream long cherished by the community has become reality, and the newly built hospital will play an important role in preventing public health issues in the region. This is not merely the opening of a facility — it is the first step toward making the lives of residents safer and more prosperous. The quality of life has improved considerably, and this change will only continue."
 impblack.12.t.school: "A New School Opens Its Doors"
 impblack.12.d.school: "Today, the school opened its doors. The fruits of federal support and provincial cooperation are now laid out before us. A dream long cherished by the community has become reality, and the newly built school will play an important role in addressing educational challenges in the region. This is not merely the opening of an educational facility — it is the first step toward a brighter and more prosperous future for residents. The quality of education has improved considerably, and this change will only continue."
 impblack.12.t.housing: "Housing Supply Programme"
 impblack.12.d.housing: "The housing supply project initiated by the local provincial government is bringing visible change. The number of homeless people in the region has decreased markedly, and with stable housing now in place, residents' quality of life has improved greatly. Slowly, anxiety and hardship are fading from their daily lives, replaced by a new sense of hope and relief. A home is not merely a roof over one's head — it is the foundation upon which a life can be rebuilt. As a result, residents' patriotism has deepened, and their sense of responsibility toward the community has grown stronger."
 impblack.12.t.gun: "Defence Industry Expansion"
 impblack.12.d.gun: "In accordance with the provincial government's plans, a factory producing military materiel has been established in the region. The founding of this factory is more than the construction of a facility — it has given renewed hope to the many who had lost their jobs and were adrift. Unemployment has been visibly relieved, and the regional economy has begun to find its vitality again. The factory has become both a means of livelihood and a symbol of new possibility for the community."
 impblack.12.t.min: "Industrial Expansion"
 impblack.12.d.min: "Several cities have achieved such remarkable industrialisation that they may rightly be called the centres of a local industrial revolution. A solid industrial base, an abundant pool of skilled workers, and the decisive vision of forward-looking leadership have driven the continuous development of these regions. Thousands of people labour among factory machines; the goods produced by their hands pour endlessly off the production lines. What flows here is not merely capital and product — it is the powerful force driving the growth and transformation of an entire society. The smoke rising from factory chimneys has become a symbol of prosperity, and all of this is living proof that the economic policies we have pursued have taken firm root."
 impblack.12.t.failure_1: "Provincial Policy Failure!"
 impblack.12.d.failure_1: "Provincial policy has veered in an unexpected direction, leaving deep wounds across the community. The federal government could no longer stand by and watch, and was compelled to intervene with emergency relief measures. The situation had already reached a critical point, and swift action was needed to set things right."
 impblack.12.t.failure_2: "Provincial Government Caught in Embezzlement Scandal!"
 impblack.12.d.failure_2: "The laissez-faire approach to economic development has brought notable results, but shadows are gathering behind the scenes. Under loose regulation, a considerable portion of the wealth being generated has found its way — unintentionally, one might say — into the hands of swindlers. Recently, several wealthy merchants exploited their vast assets to purchase local power, and in the process, provincial funds drained away to places unseen. Before the law could catch up with them, they had carried out a massive embezzlement scheme, succeeding in undermining the pillars of the regional economy. But this is merely the tip of the iceberg. The time has come for us to confront this corruption and break free from its dark influence."


