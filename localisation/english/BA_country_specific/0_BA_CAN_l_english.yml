 ENG_king_edward_name: "His Most Gracious Majesty $ENG_king_edward$"
 ENG_king_george_v_name: "His Most Gracious Majesty $george_v$"
 BA_king_name_tt: "[BA_King_name]"
 BA_king_desc_tt: "[BA_king_desc]"
 BA_King_Edward_name: "By the Grace of God, King of §tGreat Britain§!, §GIreland§! and the §RBritish Dominions beyond the Seas§!, §YDefender of the Faith§!, §gEmperor of India§!, §YHis Majesty King $ENG_king_edward$§!"
 BA_King_Edward_desc: "§L$ENG_king_edward$ was born in the late nineteenth century into a respected royal family. From birth, he was entrusted with an important role as a member of the Royal House, and from a young age travelled widely, encountering diverse cultures across many nations. These experiences would go on to greatly broaden his perspective as a future leader.\n\nFrom an early age, $ENG_king_edward$ was deeply aware of the responsibilities and duties of an heir to the throne. He took particular interest in social affairs and international relations, preparing himself accordingly for the role of a future leader. Through his military service, he personally demonstrated his loyalty and dedication to the nation, earning the deep trust of the people.\n\nAs time passed, $ENG_king_edward$ came to feel ever more keenly the weight of his succession to the throne, and lived a life of dedicated service to his country and people. Throughout this period, he was active across many fields, remaining close to the people as a member of the Royal House and making every effort on their behalf.\n\n$ENG_king_edward$'s devoted work left a deep impression on the public, earning him great respect from the people. Grounded in his sense of responsibility as a leader and his profound affection for his people, $ENG_king_edward$ shall prepare his kingdom for the future and make the decisions that matter most.§!"
 BA_King_George_name: "By the Grace of God, King of §tGreat Britain§!, §GIreland§! and the §RBritish Dominions beyond the Seas§!, §YDefender of the Faith§!, §gEmperor of India§!, §YHis Majesty $george_v$§!"
 BA_King_George_desc: "§L$george_v$ was born into a respected royal family and from an early age learned deeply the traditions and responsibilities of the Royal House. Through a variety of experiences as a member of the Royal House, he naturally cultivated the qualities of a leader. In particular, his service in the Royal Navy in his youth was a personal embodiment of dedication and loyalty to the nation.\n\n$george_v$ took his duties as heir to the throne with great seriousness. He wished to be a leader who stayed close to the people and listened to their voices, and worked ceaselessly toward that end. By meeting people from every walk of life, he came to understand the pressing concerns of the kingdom and sought their resolution, establishing himself as a leader trusted by the people.\n\nFollowing his accession to the throne, $george_v$ devoted himself to stabilising the nation and advancing policies for his people. He also played an important role diplomatically, raising the kingdom's standing in the international community. $george_v$ placed the prosperity of the kingdom and the wellbeing of the people above all else, and gave every effort toward those ends.\n\nThus $george_v$ earned the deep respect and affection of the people, and fulfilled his responsibilities as a leader. His dedication and efforts contributed greatly to the stability and development of the kingdom, and his achievements will be remembered by generations to come.§!"


