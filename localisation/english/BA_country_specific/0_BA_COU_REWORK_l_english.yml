 ##Kivotos Alliance 
 COU_kivotos_alliance.1.t:0 "Treaty Organization Leader's Decision to Dispatch Expeditionary Forces"
 COU_kivotos_alliance.1.desc:0 "One of the Kivotos Cooperation Organization member nations has been attacked by a non-member nation, and the leader nation of the treaty organization has decided to dispatch expeditionary forces to protect said member nation.\n\nWe must decide whether to join said expeditionary force dispatch."
 COU_kivotos_alliance.1.a:0 "Protect Kivotos!"
 COU_kivotos_alliance.1.b:0 "Now is not the time to increase enemies."

 COU_kivotos_alliance.2.t:0 "Kivotos Treaty Organization's Non-Aggression Pact"
 COU_kivotos_alliance.2.desc:0 "The chair nation of the Kivotos Treaty Organization has proposed a treaty prohibiting warfare among member states of the Kivotos Cooperation Organization. It appears the chair nation intends to push this treaty forward aggressively, and we must now determine our official stance—and whether to withdraw from the treaty organization altogether."
 COU_kivotos_alliance.2.a:0 "Sign the treaty."
 COU_kivotos_alliance.2.b:0 "This is internal interference."

 COU_kivotos_alliance.3.t:0 "[FROM.GetName]'s Withdrawal from the Peace Treaty"
 COU_kivotos_alliance.3.desc:0 "Following the recent regime change in [FROM.GetName], their administration has declared its intention to withdraw from the peace treaty with us."
 COU_kivotos_alliance.3.a:0 "Expel them in accordance with the treaty."
 COU_kivotos_alliance.3.b:0 "Now is not the time to multiply our enemies."

 COU_kivotos_alliance.4.t:0 "Restoration of Police Academy Status"
 COU_kivotos_alliance.4.desc:0 "After the transfer of administrative authority over the Sanctum Tower, the status of the Police Academy was temporarily frozen. However, we awaited the new General Student Council, and our authority has since been restored.\n\nWe may now resume our duties as the official Police Academy of Kivotos."
 COU_kivotos_alliance.4.a:0 "Well, is this a good thing?"

 COU_kivotos_alliance.5.t:0 "The Kivotos Alliance"
 COU_kivotos_alliance.5.desc:0 "The Kivotos Alliance is a union designed to bind every academy in Kivotos into a single entity. Established to ensure the stability of Kivotos, it calls upon students from all schools to unite and strive for collective security.\n\nWe must now decide whether to join the Kivotos Alliance or remain independent in our efforts to stabilize the region."
 COU_kivotos_alliance.5.a:0 "Join the Alliance."
 COU_kivotos_alliance.5.b:0 "We are sufficient on our own."

 COU_kivotos_alliance.6.t:0 "[FROM.GetName] Joins the Alliance"
 COU_kivotos_alliance.6.desc:0 "[FROM.GetName] has officially joined the Kivotos Alliance."
 COU_kivotos_alliance.6.a:0 "We shall strive for the stability of Kivotos."

 COU_kivotos_alliance.7.t:0 "[FROM.GetName] Rejects the Alliance"
 COU_kivotos_alliance.7.desc:0 "[FROM.GetName] has formally expressed their refusal."
 COU_kivotos_alliance.7.a:0 "Understood."

 COU_kivotos_alliance.8.t:0 "[FROM.GetName]'s Request to Join the KCO"
 COU_kivotos_alliance.8.desc:0 "[FROM.GetName] has signaled its intent to join the Kivotos Cooperation Organization.\n\nWhile [FROM.GetName] was previously not a member state, the shifting international landscape seems to have prompted their desire for alignment with us."
 COU_kivotos_alliance.8.a:0 "The more allies we have, the better."
 COU_kivotos_alliance.8.b:0 "They are a nation that cannot be trusted."

 COU_kivotos_alliance.9.t:0 "Admission to the KCO Successful"
 COU_kivotos_alliance.9.desc:0 "Our government's efforts to join the Kivotos Cooperation Organization have come to fruition, as [FROM.GetName] has formally approved our membership."
 COU_kivotos_alliance.9.a:0 "The desired outcome."

 COU_kivotos_alliance.10.t:0 "Admission to the KCO Failed"
 COU_kivotos_alliance.10.desc:0 "Despite our government's diplomatic efforts to join the Kivotos Cooperation Organization, the chair nation has rejected our application for membership."
 COU_kivotos_alliance.10.a:0 "Let's see how well they fare without us."

 COU_cooperative_treaty_ratification: "Ratification of the Kivotos Peace Treaty"
 COU_cooperative_treaty_ratification_TT: "§RYour nation is currently ratifying the peace treaty.§!"
 COU_cooperative_treaty_ratification_TT_FROM: "§RThis nation is currently ratifying the peace treaty.§!"
 COU_cooperative_treaty_ratification_TT_JOIN: "§RAs your nation is ratifying the peace treaty, you cannot intervene in wars against nations currently at war with KCO members.§!"
