 ##Kaya 
 COU_focus_black_coffee:0 "The Unchanging"
 COU_focus_black_coffee_desc:0 "Shiranui Kaya's month-long suspension gave her conviction, not pain. The conviction that the current sluggishness can never quell the chaos of the General Student Council. There are things in this world that do not change even with the passage of time. It is the craving for perfect order built upon control, and the principle of the 'Superhuman' who can establish that order."
 COU_focus_questions_about_the_handover_procedure:0 "Raising Questions About Handover Procedures"
 COU_focus_questions_about_the_handover_procedure_desc:0 "What Nanagami Rin is overlooking is the GSC President's diary we found after her disappearance. We accidentally obtained the diary—which originally should have been kept somewhere in the basement of Schale—and Kaya has been personally managing it. If it is an essential process to impeach Rin, we could create flaws in the Nanagami Rin acting regime itself by 'slightly manipulating' its contents."
 COU_focus_without_rin_royalists:0 "Excluding the General Administration Office"
 COU_focus_without_rin_royalists_desc:0 "The political influence of the General Administration Office is currently immense, so we cannot touch them recklessly. However, now that it is common knowledge that the General Administration Office is a hotbed of corruption and the activities of the opposition are flourishing, their influence will take a major hit if things move in a direction that intentionally 'excludes' the General Administration Office in cooperation with each department head."
 COU_focus_talk_with_aoi:0 "Meeting with Aoi"
 COU_focus_talk_with_aoi_desc:0 "Finance Director Oki Aoi has steadily expanded her influence since questions were raised about Acting President Rin's trust. As the Finance Director can exert significant influence over various departments, the recruitment of the Finance Office and Oki Aoi must be a top priority."
 COU_focus_intentional_manipulation:0 "Intentional Manipulation"
 COU_focus_intentional_manipulation_desc:0 "The things the executives of the GSC Administrative Committee hate more than anything in the world are lies, corruption, and manipulation. An effective way to deal a blow to Acting President Nanagami Rin's political life is to destroy trust in her through intentional document manipulation."
 COU_focus_rin_getout_please:0 "Impeachment Resolution"
 COU_focus_rin_getout_please_desc:0 "The time has come. The trust in Acting President Nanagami Rin, who has plenty of ego but little substance, has hit rock bottom. Now that Kaya is designated as the legitimate new acting president, it is time to pull Rin from the throne."
 COU_stab_percent_ten_minus:0 "§YActing President's Trust§! is below §Y10%§!."
 COU_focus_contact_with_verdinaso:0 "Pardon of the Verdinaso Leadership"
 COU_focus_contact_with_verdinaso_desc:0 "Joris van Severen and the Verdinaso organization were those who prepared a corporatist state following the ideals of Burgundian Netherlands, and they initially tried to resist us. However, now that Kaya's benevolent rule has become common knowledge, they can be used as excellent allies."
 COU_focus_upgrade_power_of_collabs:0 "Strengthening Collaborator Authority"
 COU_focus_upgrade_power_of_collabs_desc:0 "The authority of collaborators has always been in an ambiguous position. Whenever they tried to perform public duties, they were hampered by dozens of things to worry about and constraints that prioritized citizens. However, such inefficiency can no longer be tolerated! A stable nation comes from stable public authority."
 COU_focus_executive_order_3511:0 "Revocation of Executive Order 3511"
 COU_focus_executive_order_3511_desc:0 "When Shiranui Kaya first recruited collaborators, the Administrative Committee installed a sort of speed bump to prevent them from running wild: Executive Order 3511, which terribly restricted the free pursuit of interests by collaborators according to regulations. Collaborators periodically asked for additional budgets, but by revoking 3511, we can ignore their annoying yet justifiable demands."
 COU_focus_recontrol_valkyrie:0 "Regaining Control of Valkyrie"
 COU_focus_recontrol_valkyrie_desc:0 "Valkyrie Police Academy are traitors! Maintaining public order is an essential element that no academy can do without, yet those people made the terrible choice to betray us and flee. Their incredibly selfish decision—or ignorance—will be repaid in blood."
 COU_focus_control_kronos_news:0 "Seizing Kronos School"
 COU_focus_control_kronos_news_desc:0 "There are several ways for a regime to become stable, but seizing the media, which serves as the eyes and ears of the citizens, is naturally the first step. We will dispatch our own 'inspectors' through collaborators to Kronos School."
 COU_focus_digital_hallucination:0 "Digital Phantasm"
 COU_focus_digital_hallucination_desc:0 "We have smoothly seized the broadcasting stations, but we cannot stop here. The next step is to infiltrate the SNS that students frequently use. Through this, the 'brainwashed' students will voluntarily bring us benefits!"
 COU_recruit_purge_our_antifans:0 "Reign of Terror"
 COU_recruit_purge_our_antifans_desc:0 "The mistake of the GSC President and Rin was simply leaving the opposition alone while they slandered and belittled them. But Kaya is different from those foolish people. She won't be easily taken down by the backstabbing of the opposition like before. If they won't think to respect power, we'll make them. While deceiving the foolish citizens, of course."
 COU_recruit_fox_srt:0 "Mobilizing FOX Squad"
 COU_recruit_fox_srt_desc:0 "The members of FOX Squad were imprisoned after suffering an unfair incident during the Great Transfer. Since Kaya knows their grievances better than anyone, if she makes a slight suggestion, a win-win structure can be created where Kaya gets the fear she needs and the FOX Squad members get their due."
 SRT_FOX_REAVAILABLE:0 "§YFOX Squad members§! become available."
 COU_focus_death_for_rin_friends:0 "Tracing the Remnants of the Pro-Rin Faction"
 COU_focus_death_for_rin_friends_desc:0 "Momoka of the Transportation Office and Ayumu of the Settlement Office are among the few representative pro-Rin figures left in the GSC who disappeared somewhere after the reign of terror began. Unless their exact location is revealed, Kaya's political influence will continue to be threatened. Mobilizing FOX Squad members to find and intern them is an excellent alternative."
 COU_focus_forced_oath_of_allegiance:0 "Forced Allegiance"
 COU_focus_forced_oath_of_allegiance_desc:0 "The reason the opposition didn't attempt armed resistance was because of the trust in armed neutrality they blindly believed in until the end. Correct, Kaya cannot simply mobilize the Defense Office to seize the GSC at will. But what those people missed is that the collaborators are practically Kaya's private army."
 COU_focus_gonna_gsc_leader:0 "Inauguration as GSC President"
 COU_focus_gonna_gsc_leader_desc:0 "Buoyed by the petitions of sufficient supporting forces, Kaya has finally entered the final stage of the power struggle. It is the inauguration of herself to the highest level of power she craved since her terrible suspension: the position of GSC President. Since there is no longer anyone to stop her, this must be carried out promptly."
 COU_tooltip_gonna_gsc_leader:0 "§RCrossing the point of no return!§!"
 COU_focus_get_some_break_bro:0 "Taking Regular Breaks"
 COU_focus_get_some_break_bro_desc:0 "Kaya's stress cannot be completely ignored, but her condition can improve with just short, regular breaks. Come on, sit here and have a glass of lemonade."
 COU_focus_shutthefuckof_this_fucking_communists:0 "Taking the Microphone"
 COU_focus_shutthefuckof_this_fucking_communists_desc:0 "Sometimes, nothing is more useful than shouting when you're angry and annoyed. It wouldn't be bad to try it just this once."
 COU_destress_focus:0 "Completed §Y$COU_focus_get_some_break_bro$§! focus"
 COU_destress_focus_completed_tt:0 "Current Days: [?COU_destress_focus:days|Y0]"
 COU_focus_three_years_plan:0 "The 4-Year Plan"
 COU_focus_three_years_plan_desc:0 "While Kaya might not be called an economic expert, she can at least prepare a grand plan. Kaya's new 4-Year Plan will prepare the GSC's industrial capacity and function as a major preparation for the reunification of Kivotos."
 COU_focus_ready_for_reunification:0 "National Defense Academy"
 COU_focus_ready_for_reunification_desc:0 "The reunification of Kivotos requires military preparation. For that, the academies and the GSC must be fully prepared militarily, and the National Defense Academy system, which concentrates academy capacity into military power, will support this as a means."
 COU_focus_remove_democratic_system:0 "Bureaucratic Dictatorship"
 COU_focus_remove_democratic_system_desc:0 "Since the GSC has ruled in the name of bureaucracy and grand cause for many years, her long-term political survival cannot be guaranteed if she tries to unilaterally reorganize or abolish it. A bureaucratic dictatorship, stemming from the need to respect form and procedure, will be a solid foundation for Kaya's superhuman dictatorship."
 COU_kaya_change_ideology:0 "Changes §YShiranui Kaya§!'s sub-ideology to §YSuperhuman Dictatorship§!."
 COU_focus_rework_of_gsc_system:0 "Efficient Administrative Processing"
 COU_focus_rework_of_gsc_system_desc:0 "Let's admit what needs to be admitted. GSC President Kaya cannot fully handle the same massive workload as her predecessors. However, by mobilizing various workarounds she naturally learned while enduring all sorts of hardships since her inauguration to technologize the administrative processing itself, this flaw can be supplemented."
 COU_focus_corperate_with_catholic:0 "Expansion of Kivotos Diocese"
 COU_focus_corperate_with_catholic_desc:0 "Catholicism, which protected European traditions and values, was often suppressed by Kivotos religions and drowned in the Kivotos-style wave of progress after the Great Transfer. However, if we see through that point and contact the clergy, cooperate with the European Catholic Church, and expand the Kivotos Diocese, the combination of Kivotos and local religions will become a useful tool for governance."
 COU_focus_kivotos_apartheid:0 "Segregation"
 COU_focus_kivotos_apartheid_desc:0 "The relationship between Kivotos students and the locals cannot improve. While minimal cooperation might be possible, these groups are fundamentally different and can never be merged, like oil and water—and oil and water should be filled in different containers. Now we will live in different residential areas and use different shops. This is not a racist measure, but a realistic one."
 COU_focus_special_martial_law:0 "Special Administrative Measures"
 COU_focus_special_martial_law_desc:0 "Kivotos is currently in a state of emergency. Academies are acting as they please, bringing on a great storm. The GSC, as the guardian and adjuster of balance for the academies, must naturally prepare for the coming storm. Therefore, intensive power focused on an individual will allow us to prepare for the storm resolutely and without shaking."
 COU_focus_conservative_revolution:0 "New World Order"
 COU_focus_conservative_revolution_desc:0 "The GSC is now fully prepared. Domestic affairs have been completely reorganized into a political system led by GSC President Kaya, and now it is time to look at external affairs. The academies of Kivotos must once again fall under GSC control and the order from before the Great Transfer must be restored, so that they may never again underestimate the GSC's authority!"
 COU_focus_our_saint_michael:0 "Prayer to Saint Michael the Archangel"
 COU_focus_our_saint_michael_desc:0 "We humbly pray, Saint Michael the Archangel,\ndefend us in this world's battle against the wickedness and snares of the devil.\nMay God rebuke him, we humbly pray; and do thou, O Prince of the heavenly host,\nby the power of God, cast into hell Satan and all the evil spirits\nwho prowl about the world seeking the ruin of souls. Amen."
 COU_focus_liberate_womans:0 "Women's Liberation"
 COU_focus_liberate_womans_desc:0 "Non-Kivotos women who have long suffered in Europe's male-centric and authoritarian households are our primary target. If we contact feminist revolutionaries advocating for women's liberation and promise the liberation of local women as the center of a Kivotos centered on women, the local women will comply with our rule."
 COU_focus_free_woman_corps:0 "Free Women's Corps"
 COU_focus_free_woman_corps_desc:0 "To emphasize women's independence, a Free Women's Corps composed of local women will be deployed. They will receive help from Halo Infantry on the front lines, develop combat capabilities, and eventually perform brilliantly on the front lines just like any other men."
 COU_tooltip_recruit_woman_divisions:0 "Deploy §Y3 Divisions§! of the Free Women's Corps consisting of §Y9 Infantry§!, §YAssault§!, and §YArtillery Support Battalions§!."
 COU_focus_daughters_of_jesus:0 "Daughters of God"
 COU_focus_daughters_of_jesus_desc:0 "There are plenty of women in Europe who faithfully follow their faith. Our archbishop will gather the women and ask them to participate in the holy war for women's liberation, and the women armed with the spirit of faith will perform wonderfully on the front lines."
 COU_focus_kivotos_nationalism:0 "Kivotos Nationalism"
 COU_focus_kivotos_nationalism_desc:0 "The concept of Kivotos nationalism could not have existed before the Great Transfer. The international community was the GSC, and the autonomy of each academy could be seen as a kind of academy nationalism. However, having been dropped into a new world today, Kivotos must unite and establish a single academy system."
 COU_focus_christian_army:0 "Thy Will Be Done on Earth"
 COU_focus_christian_army_desc:0 "The GSC has been given a mission: to reunify and protect Kivotos and return people to the happy lives they once had. This is no different from the will of God the Father and will be a great help in justifying the cause of war."
 COU_focus_destroy_luxemburg:0 "Destroying the Remnants of the House of Nassau"
 COU_focus_destroy_luxemburg_desc:0 "The 'Grand Duchy of Luxembourg' that survived under the leadership of Problem Solver 68 is close to an open insult to Kivotos. Kivotos students acting as heads of state for a local government? The terrible remnants of the House of Nassau must be destroyed."
 COU_focus_destroy_abydos:0 "Crushing the Dual-World Idealists"
 COU_focus_destroy_abydos_desc:0 "The indecisive fools of Abydos, shouting about harmony with the locals, were the first to send a clear declaration of war against Kivotos' order and authority. We must respond to their nonsensical fantasies!"
 COU_focus_eastern_offensive:0 "Enforcing the Eden Treaty"
 COU_focus_eastern_offensive_desc:0 "The Gehenna morons and Trinity skeptics fight each other all day long without gaining any benefit. Their conflict must be sealed as quickly as possible, and the entity that seals that conflict must be us."
 COU_focus_northern_offensive:0 "Ending the Communist Play"
 COU_focus_northern_offensive_desc:0 "The Red Winter academy leadership, led by [RED.GetLeader], is being swayed by half-baked ideologues who flocked there after hearing rumors of a quasi-communist state, without even knowing what proper communism is, and are being forced into a communist play. This tragedy must be stopped immediately."
 COU_focus_southern_offensive:0 "The Contradiction of Technocracy"
 COU_focus_southern_offensive_desc:0 "Millennium 'Science School' are selfish bastards who use technology only for themselves, cutting ties with other academies after the Great Transfer. Technology for Kivotos must be returned to everyone!"
 COU_focus_restore_our_rules:0 "Restoring Our Order"
 COU_focus_restore_our_rules_desc:0 "The order of the GSC that ruled over each academy is not that old. It's just that the flags planted there will change to ours. The GSC will reclaim governance, and while high-level autonomy will be withdrawn, a certain degree of autonomy will be granted so they comply with our rule."
 COU_focus_seek_alliance_with_kaiser:0 "An Excellent Example"
 COU_focus_seek_alliance_with_kaiser_desc:0 "Kaiser Corporation is the easiest entity for us to discuss interests with as a corporation. Especially the huge fleet they bought during the Great Transfer is an essential existence for us, and an alliance with Kaiser is an alliance for Kivotos."
 COU_tooltip_when_we_peace_percent_up:0 "The possibility of an alliance increases when we are §Yat peace§!."
 COU_focus_reunification_of_kivotos:0 "Reunification of Kivotos"
 COU_focus_reunification_of_kivotos_desc:0 "The dream we've been weeping for since the disastrous Great Transfer has finally come true.\n§GIn the end, everything turned out well.§!"
 COU_tooltip_kaya_real_end:0 "§YEpilogue§! and §GEnding§! unlocked."
 COU_focus_rok_controls_core_state_tooltip:0 "The specified academies do not exist and we control all §YCapital States§!:\n  [TRM.GetNameWithFlag]: §Y$STATE_64$§!\n  [GEM.GetNameWithFlag]: §Y$STATE_55$§!\n  [GEH.GetNameWithFlag]: §Y$STATE_52$§!\n  [MIL.GetNameWithFlag]: §Y$STATE_16$§!\n  [HEU.GetNameWithFlag]: §Y$STATE_8$§!\n  [RED.GetNameWithFlag]: §Y$STATE_141$§!\n  [ARI.GetNameWithFlag]: §Y$STATE_85$§!\n  [ABY.GetNameWithFlag]: §Y$STATE_69$§!\n  [SHA.GetNameWithFlag]: §Y$STATE_4$§!\n  [HYA.GetNameWithFlag]: §Y$STATE_9$§!\n  [WHY.GetNameWithFlag]: §Y$STATE_1082$§!"
 

 

 ##Rin 
 COU_focus_confidence_and_supply:0 "Confidence and Supply"
 COU_focus_confidence_and_supply_desc:0 "The Rin acting regime must continue. The legitimacy of the Rin acting regime is an undeniable foundation, and what is needed now is not a wasteful political battle, but practical cooperation to correct chaos upon the new foundation she will lay. And the core procedure for this is the execution of confidence and supply for Acting President Rin."
 COU_focus_emergency_rin:0 "Emergency Response Committee"
 COU_focus_emergency_rin_desc:0 "Nanagami Rin was conscious of the wavering public opinion in Kivotos after the GSC President's disappearance and proposed the launch of an Emergency Response Committee to have the heads of each academy gather and discuss appropriate countermeasures. Ill-intentioned counterarguments will erupt, but does that really matter?"
 COU_tooltip_send_treaty_for_kivotos_countries:0 "Sends the §YEmergency Response Committee Participation Proposal§!.\nIf they can even receive it..."
 COU_focus_Linda_Linda:0 "Linda, Linda"
 COU_focus_Linda_Linda_desc:0 "I want to become beautiful like a gutter rat, because there is a beauty that cannot be captured in a photo.\n\n\"Because I have exactly one—strong power that never loses...\"\n\nMore kindly than anyone, like a gutter rat; warmer than anything, like a gutter rat."
 COU_focus_collaborate_with_pro_rin_facton:0 "Administrative Committee Leftists"
 COU_focus_collaborate_with_pro_rin_facton_desc:0 "Yuragi Momoka of the Transportation Office, who represents the face of the locals within the Administrative Committee, and the reliable Settlement Director, Iwabitsu Ayumu, are forces referred to as a set of leftists, with their main characteristic being their personal friendship and relationship with Nanagami Rin. Cooperation with them can be a great help in stabilizing the power of the General Administration Office."
 COU_focus_remove_antihumans_order:0 "Apology for the November Tragedy"
 COU_focus_remove_antihumans_order_desc:0 "The large-scale tragedy that occurred out of ignorance after the November 1935 Great Transfer was an agenda the Administrative Committee was busy avoiding, but it can no longer be ignored. The Administrative Committee must take clear responsibility and apologize for this officially committed massacre."
 COU_focus_gsc_prorin_block:0 "Administrative Committee Solidarity Block"
 COU_focus_gsc_prorin_block_desc:0 "United we stand, divided we fall. This block will ensure Rin's policies are enacted."
 COU_focus_collaborate_with_anti_rin_faction:0 "Administrative Committee Rightists"
 COU_focus_collaborate_with_anti_rin_faction_desc:0 "Although they've been through many hardships since the Great Transfer, the Defense Office and the Finance Office have always functioned as core axes within the Administrative Committee. While these forces, referred to as a set of rightists, say impure things regarding Acting President Nanagami Rin, cooperation with them will stabilize Rin's rule and be a great help personally."
 COU_focus_collaborate_with_aoi:0 "Voting on the Mutual Agreement"
 COU_focus_collaborate_with_aoi_desc:0 "Oki Aoi proposed a kind of agreement that simplifies the budget voting process in exchange for increasing some of the Finance Office's authority to flexibly deal with the source and utilization of budgets changed after the Great Transfer. This is clearly a valid proposal and can be accepted."
 COU_focus_collaborate_with_kaya:0 "Promise to the Defense Office"
 COU_focus_collaborate_with_kaya_desc:0 "The Defense Office's harboring of greater ambitions and impure intentions is a kind of defense mechanism stemming from the anxiety that their power will be taken away and discarded in an instant. If we promise not to do so, the Defense Office and collaborators can turn from a headache into decent friends."
 #COU_focus_invite_here_kivotos:0 "[COU_focus_invite_here_kivotos_name_text]"
 #COU_focus_invite_here_kivotos_desc:0 "[COU_focus_invite_here_kivotos_desc_text]"
 RIN_DREAM_ARONA:0 "§YNanagami Rin has made a decision.§!"
 COU_focus_invite_here_kivotos_true:0 "Executive Order 3604"
 COU_focus_invite_here_kivotos_true_desc:0 "It is time to start a gamble that stakes both Nanagami Rin's political skill and life. Having gained a clear motive, she will not weigh internal mediation and stability forever. And as the first button, we will push through the full incorporation of the Low Countries into Kivotos. Executive Order 3604 must be passed by any means necessary!"
 COU_focus_invite_here_kivotos_fake:0 "Stop it now!"
 COU_focus_invite_here_kivotos_fake_desc:0 "That's enough now. Let's just stop here."
 COU_focus_i_love_arona:0 "Permanent Acting President"
 COU_focus_i_love_arona_desc:0 "There's no going back. The GSC will lead Kivotos into a new era under Rin's permanent guidance."
 COU_focus_i_hate_arona:0 "Losses and Gains"
 COU_focus_i_hate_arona_desc:0 "Every choice has a cost. We must weigh what we've lost against what we hope to achieve."



 ##Aoi-Momoka 
 COU_focus_dual_leader_system:0 "Collective Leadership System"
 COU_focus_dual_leader_system_desc:0 "A new system has taken over. After Acting President Nanagami Rin's resignation, the one who seized power was clearly Oki Aoi alone. However, Aoi's lack of local support forced a bizarre cooperative relationship with the local figurehead, Yuragi Momoka, and a new collective leadership system has begun operation."
 
 
 
 
 
 
 #Lowland War 
 COU_focus_against_the_protocol:0 "Resisting the Protocol"
 COU_focus_against_the_protocol_desc:0 "We will not be bound by ancient rules in a new world."
 COU_focus_focus_on_illegal_occupy:0 "Emphasizing Illegal Rule"
 COU_focus_focus_on_illegal_occupy_desc:0 "Propaganda can be as effective as a bullet. We will highlight the illegitimacy of their occupation."
 COU_focus_avoid_splatting_collaboraters:0 "Reinforcing Local Defense Brigades"
 COU_focus_avoid_splatting_collaboraters_desc:0 "Strengthening our allies on the ground to ensure stability."
 COU_focus_fix_ai_problem:0 "Lending a Hand"
 COU_focus_fix_ai_problem_desc:0 "Sometimes even a machine needs a human touch to function properly."
 
 
 
