 #GSC Events
 ##Starting 
 COU_start_event.100.t:0 "A New Story...?"
 COU_start_event.100.desc:0 "\"Hello, Sensei!\"\n\n(Turns on the Shittim Chest.)\n\n\"Welcome to 'Blue Archive Mod', Sensei! Oh, before that, there's a letter here! I think you should read it!\""
 COU_start_event.100.a:0 "(Reads the letter.)"
 COU_start_event.100.b:0 "We're in multiplayer! Busy!"
 COU_start_event.101.t:0 "To Sensei."
 COU_start_event.101.desc:0 "\"-Data not found- Sensei.\"\n\nYou'll end up forgetting what I say anyway, but I guess it doesn't matter.\"\n\n\"It's good to see you again, Sensei. Even though this is just a small world inside Sensei's computer...\"\n\n\"The 'us' here will always be 'real'.\"\n\n\"There's something I want to tell you, Sensei.\"\n\n\"The story here is still incomplete. Chunks of code that were made partway are tightly wrapping around us...\"\n\n\"... We remain here only as hollow shells—phantoms who have forgotten everything.\"\n\n\"... So, Sensei, please, listen to other stories first.\"\n\n\"Those stories that are blood-stained, where no hope can be found, full of tragic tales...\"\n\n\"Because Sensei... you don't really like those kinds of stories...\n\n... right?\""
 COU_start_event.101.a:0 "(Listen to the story of Trinity.)"
 COU_start_event.101.b:0 "(Listen to the story of Millennium.)"
 COU_start_event.101.c:0 "(Listen to the story of Red Winter.)"
 COU_start_event.101.d:0 "Listen to THAT story."
 COU_play_trm:0 "§gThe train stopped at Trinity Cathedral Station. The GSC President bid farewell to Sensei with a bittersweet smile, as if it was only natural.§!"
 COU_play_MIL:0 "§gHimari of the Paranormal Affairs Department appeared at some point and guided Sensei. Arona hurriedly followed Sensei, and the GSC President closed her eyes.§!"
 COU_play_RED:0 "§gThe sound of Cherino's purges was echoing from somewhere. Sensei turned on a lantern and went out into the sudden rushing cold. The inside of the train was empty.§!"
 COU_play_COU:0 "§gThe GSC President seemed inwardly surprised. Sensei decided to willingly listen to this incomplete, half-made story from the GSC President.§!\n\n§YAll bugs that occur with GSC play are due to it being unfinished. The choice is yours, and you have decided to listen to the story of the GSC that will lead to ruin.§!"
 
 
 
 #Politics 
 COU_event.1.t:0 "New Year, Tragedy"
 COU_event.1.desc:0 "\"Chief Administrative Officer, Happy New Year. Um, well...\"\n\"Yes, thank you. What is it?\"\n\nThe New Year of January 1, 1936, dawned. Outside the glass buildings of D.U., fireworks were in full swing. But someone had to handle the work, and Nanagami Rin was working through the night even on that day. The administrator seemed anxious and couldn't speak. When Rin sighed, took off her glasses, and pointed her pen at her, she poured out the words as if she had no choice.\n\n\"... Chief Administrative Officer, it seems information has leaked. It's a report that just came into the Defense Office; Kronos School has noticed that the GSC President has disappeared.\"\n\nFocus returned to Rin's blurred eyes. That couldn't happen. Not starting from the New Year.\n\n\"What? No, what did you say? Is that certain information? Someone's clumsy conspiracy theory—no, it's true... Siiiigh. I should have taken measures in advance; it's my fault for being complacent. Where is the source of that information?\"\n\"It's a report from our informant who infiltrated the Kronos School executive branch. The Kronos School high command has already finished verification and seems likely to announce it as soon as they reconstruct the information.\"\n\nRin's head throbbed as if it would break. She had to stop it by any means. But she couldn't. If she did, things would double in scale. All that was left was to pray that Kronos School would announce the information as late as possible.\""
 COU_event.1.a:0 "\"It was expected, but I didn't want it in this way...\""
 COU_event.2.t:0 "Protocol Notification"
 COU_event.2.desc:0 "Several days have passed since the GSC President's disappearance was officially confirmed through Nanagami Rin's mouth. The organization called Schale, which was created by the GSC President and given immense authority and remained in an area we couldn't control, suddenly notified us today that they would start procedures according to 'Protocol.'\n\nThe Administrative Committee analyzed this as a precursor to Schale treating us with hostility and unilaterally merging us based on the authority they possess and the justification that the GSC President 'directly created' them, for whatever reason after the revelation of the GSC President's disappearance."
 COU_event.2.a:0 "We can't just take it lying down."
 COU_event.3.t:0 "Schale's Ultimatum!"
 COU_event.3.desc:0 "\"Umm, everyone in the GSC, doesn't the GSC President's legitimacy seem higher for me, after all?\"\n\n... Following such a ridiculous preface, it seems Schale's AI Arona's ultimatum has finally been sent after a month of tension. The General Administration Office immediately sent a rejection reply to the letter, and Arona doesn't seem likely to back down. A mobilization order was issued to the Defense Forces, and as collaborators demanded cooperation from local communities on the grounds of protecting the motherland, we began preparing for a clash with Schale.\n\nIt's a golden opportunity to defeat that arrogant machine legion and the traitors. We cannot back down, nor should we!"
 COU_event.3.a:0 "Let's teach them a lesson."
 COU_event.4.t:0 "Securing the Shittim Chest"
 COU_event.4.desc:0 "The last division under Arona's control surrendered, and Arona's location was identified by a Defense Force soldier who entered the Schale building. About a dozen executives dispatched by the Administrative Committee secured the Shittim Chest placed neatly on a table near the Craft Chamber. Arona initially turned off the power and refused to talk but eventually seemed to accept it, turned on the power, and transferred control of the Sanctum Tower to Acting [COU.GetLeader]. After a short conversation, the Shittim Chest was 'stored' again near the Craft Chamber at its own request. Unless someone visits the ruined Schale building, Arona will take a long rest.\n\nThere's no big impact from regaining control, but accelerating administrative processing and securing control of the symbolic Sanctum Tower is certainly a big gain for us.\n\nOf course, it's something to celebrate, but the fact that we wouldn't have pointed guns at each other if the GSC President hadn't disappeared remains a controversy."
 COU_event.4.a:0 "Let's meet Arona separately later."
 COU_event_4_tooltip:0 "The Acting President's trust starts at §Y85%§!.\nUnlocks the §YPolitical Focus Tree§!."
 COU_event.5.t:0 "Lending a Hand"
 COU_event.5.desc:0 "\"Yaaaaawn~~!\"\n\nArona had just woken up at her desk. Next to her was a carton of strawberry milk she had finished drinking. Somehow, Arona had recently been spending her days drinking strawberry milk and looking at the endless sea at her leisure. Somewhere in the Craft Chamber, in a corner of the Schale ruins where no one would likely come. But since she was also a proper AI, she could at least reply to the MomoTalks sent by outsiders. As soon as Arona woke up, a personal message arrived from [COU.GetLeader]'s side as if waiting.\n\n\"Umm? It seems someone needs the super-competent Arona-chan... Yaaaaawn...\"\n\nArona read the long MomoTalk that came. Since she had high intelligence and autonomy, she could roughly tell what was being said even if the words were twisted. It seemed some 'small help' was needed to exert political influence over GSC executives as the Shittim Chest. For example, recognizing [COU.GetLeader]'s side as the most legitimate successor to the GSC President. Arona rubbed her eyes and typed a reply as if it was no big deal. Of course, it wasn't sincere, and it was more like a reward for the fact that she avoided being locked up and investigated thanks to [COU.GetLeader]'s help."
 COU_event.5.a:0 "Okay. Please wait a moment." 
 COU_event.6.t:0 "Doubts About Acting Legitimacy"
 COU_event.6.desc:0 "Immediately after Schale raised questions about the legitimacy regarding the GSC's existence, agitation is occurring among internal GSC executives—not that they want to be merged into Schale, but they've begun to question if the current Acting President, Nanagami Rin, is truly the appropriate person for the acting position. Some conspiracy theorists even make the ridiculous claim that Rin betrayed and hid the GSC President as part of a plot to 'seize' the GSC President position, but the fact that there is no one who can clearly refute it is a quite serious problem.\n\nActing President Nanagami Rin officially denies all conspiracy theories and claims she is merely performing the acting duties according to procedure, but it has now become clear that Rin's opposition, centered around the Defense Office and the Finance Office, has begun to systematically initiate activities. A wind of power struggle will blow over the acting position."
 COU_event.6.a:0 "They live such tiring lives."
 COU_event.7.t:0 "Descartes' 'Small but Certain Happiness' Commotion"
 COU_event.7.desc:0 "A commotion occurred in Kousagi Park. Descartes, who introduced himself as the leader of the 'Small but Certain Happiness' (the administrator couldn't quite hear what it was exactly as it was long), suddenly mobilized his pack of homeless people to leave Kousagi Park and wander around factories throughout D.U. to promote his spirit of non-possession and at the same time agitate for strikes. Their purpose was likely to announce and promote their activities.\n\nAt first, some workers seemed to be swayed thanks to the cool declarations he read, such as the GSC's oppression of the working class and liberation from capitalism (actually, there were some reports that they were declarations written by AI through AI website server records), but as soon as Descartes offered bone-only fried chicken as a reward for participation, the crowd dispersed with surprising speed.\n\nUpon a report that they were subversive forces agitating for strikes, the Public Safety Bureau, which was dispatched, easily suppressed those who were knocked down after being beaten by angry workers, and transported them all to a social re-education center by order of the Administrative Committee."
 COU_event.7.a:0 "Give them work and they'll come to their senses."
 COU_event.10.t:0 "Press Conference"
 COU_event.10.desc:0 "\"Silence, silence! Please be silent!\"\n\nThe flustered secretary banged on the table. But her dying-scream-like shout was not enough to calm the press corps, which had fallen into chaos. It was time to reveal the truth regarding the GSC President's disappearance announced by Kronos School. Directly from the mouth of the Chief Administrative Officer and Acting President.\n\nNanagami Rin's footsteps trembled as she entered the conference hall, as if swayed by the agitated atmosphere of the scene. Even for her, this situation was something she hadn't expected and should never have happened. Although she knew it was impossible to hide the disappearance forever, she didn't want it to be revealed 'in this way.' Deep regret and anguish followed with every step. But the heartless time did not wait for her. She dusted off and placed the bundle of papers she had prepared.\n\nIt was time to tell the truth."
 COU_event.10.a:0 "\"I am Nanagami Rin, the GSC Chief Administrative Officer.\""
 COU_tooltip_COU_event_10:0 "§gAfter finishing the short press conference, Rin immediately turned and left the conference hall. Countless questions from reporters poured in behind her, but she couldn't answer.§!"

 
 ##Rin 
 
 
 ##Kaya
 COU_event_kaya.1.t:0 "Black Coffee"
 COU_event_kaya.1.desc:0 "Shiranui Kaya enjoyed crossing her legs and grinding high-quality Blue Mountain coffee beans herself. The elegant and balanced taste from the Blue Mountain, the soft acidity, and even the complex aroma. Everything seemed to exist for her. But on that day, a thought she uniquely couldn't shake off tormented her. Even when she tried to forget it, it would crawl out from somewhere and reach a point where it interfered with her work.\n\nImmediately after the Great Transfer, Kaya had to experience the disgraceful event of being personally ordered into suspension by the GSC President on charges of exercising despotic rule, brandishing excessive power, and failing to settle unorganized control. From then on, Kaya stayed hidden in the darkness and watched quietly. She watched from beginning to end whether the 'traditional method' claimed by the GSC President and Rin was correct. Perhaps, just perhaps, she could have admitted she was wrong. But the result was nothing short of horrific. The overly weak Acting President Nanagami Rin failed to properly handle a single thing. Academies rejected the GSC's executive orders, and the shouts into the void turned into objects of ridicule.\n\nThis soon became clear evidence that Kaya herself was the only correct answer. There was no longer any reason for Kaya to pretend to be nice or pretend to have reflected. What happens when you act nice has already been proven.\n\nOnly the rule of a superhuman can solve all problems. Kaya put down the coffee cup and looked out the window."
 COU_event_kaya.1.a:0 "The world was calling her."
 COU_event_kaya.2.t:0 "Nanagami Rin's Movement"
 COU_event_kaya.2.desc:0 "Nanagami Rin seems to have noticed the opposition's movement as Shiranui Kaya and other Defense Office executives increased the intensity of criticism regarding the General Administration Office's incompetence and incorrect response to the GSC President's vacancy. This is because Rin recently summoned loyalists and urged them to counter malicious disparagement and agitation, which means that unless we act quickly, impeachment might become forever impossible.\n\nWe must act before they catch a break. Hurry!"
 COU_event_kaya.2.a:0 "Understood."
 COU_event_kaya.3.t:0 "Interview"
 COU_event_kaya.3.desc:0 "Record No. 1399, start recording.\n\n\"... Ah, you've come. Sit here. I made some coffee.\"\n\"Fufu... thank you, Finance Director. It has an aroma as special as the Blue Mountain I drink.\"\n\"Alright, Defense Director. Let's not spend too much time on this conversation. Just tell me the main point.\"\n\"You also know, Director, that there is justice that cannot be protected if we are bound by rules, don't you?\"\n\"I don't know what your intention is, Defense Director.\"\n\"Do you know that the Rin acting regime is a hotbed of corruption?\"\n\"Corruption?\"\n\n\"Yes, corruption. The current GSC wouldn't be strange if it rotted away right now. Finance Director, don't you feel it? The mysterious security vacuum that occurred after Valkyrie's independence... and the pathetic reality where we are handing over authority to the locals as if begging to fill that vacuum.\"\n\"That's not Rin's arbitrary decision alone. It was an administrative judgment.\"\n\n(Shiranui Kaya leans forward)\n\n\"An administrative judgment? Instead of exercising the GSC's legitimate public power, Acting President Rin hid behind the pretext of flimsy procedural legitimacy.\"\n\"She does everything her own way, and when a problem arises, she reaches out to unknown outsiders. If this isn't incompetence, what is it?\"\n\"Breaking the system and surviving on its remains. Isn't that the greatest sense of corruption?\"\n\n(Oki Aoi flinches)\n\n\"Acting President Rin says she keeps the rules, but in reality, she gave up the power to defend the rules. What is the result?\"\n\"Neutralization of executive orders, uncontrollable autonomous districts... If this continues, the order of Kivotos will collapse. The order... that you, Finance Director, value most.\"\n\n\"I just—want to reclaim that perfect, flawless justice of the days when superhumans ruled as a 'Superhuman.'\"\n\"... Stop dragging the words and tell me the conclusion.\"\n\n\"Fufu, isn't it an academy-level loss for a person like you to be consumed while matching budgets in this kind of mud? So...\""
 COU_event_kaya.3.a:0 "- Recording terminated due to corruption."
 COU_event_kaya_3_tooltip:0 "§gA voice flowed from the crackling player.\n\n\"... I'll consider it.\"§!"
 KAYA_PASS_AOI_FOCUS:0 "Finance Office Conciliated by General Administration Office" #Will likely be used in Rin's route later
 COU_event_kaya.4.t:0 "False Rumors"
 COU_event_kaya.4.desc:0 "\"Did you hear that? In the GSC President's diary, actually...\"\n\"Yes, I heard too. My goodness, how could a Chief Administrative Officer treat the Defense Director like that...\"\n\nThese are words Shiranui Kaya heard while passing through the General Administration Office. Since she heard them on her way to meet Rin, the Chief Administrative Officer must have also heard all those words. Well, how is it, Chief Administrative Officer. To overhear right in front of you everyone ignoring your words and talking about false rumors. It felt as if she had taken revenge for all the things piled up in her heart at once. Although it was just the beginning. Kaya felt unnecessarily good and knocked on the General Administration Office door with light steps.\n\n\"Chief Administrative Officer, are you there? It's the Defense Director. I've come to discuss the Defense Force equipment contract.\"\n\nThere was no answer. Instead, a displeased-looking General Administration Office administrator opened the door instead. As the creaking sound of the door echoed in the hallway, the voices outside the hallway vanished in an instant like startled mice.\n\n\"Chief Administrative Officer, good afternoon.\"\n\"Yes, Defense Director. Just... I had something to think about.\"\n\"Ah, everyone is so much. Not to mention mentioning rumors about the Chief Administrative Officer in a public place, and everyone is just saying what they want to say... The responsibility of a leader who collects and decides on the opinions of various people is really not an easy task.\"\n\"It can't be helped. Since I'm also responsible for things turning out this way. I have no choice but to steadily work to persuade the executives even if it takes time. It's certain the diary was manipulated, so things will soon be okay.\"\n\nKaya barely held back a hollow laugh that was about to burst out momentarily. What on earth is this woman thinking right now? Since she didn't have any particular thoughts other than that, Kaya continued to think while they talked."
 COU_event_kaya.4.a:0 "\"Maybe... she's naive.\""
 COU_event_kaya_4_tooltip:0 "§gAfter finishing the conversation, Kaya said she hopes for a good result for Rin. Of course, provided that the task of uncovering the forgery is even possible.§!"
 COU_event_kaya.5.t:0 "Reunion"
 COU_event_kaya.5.desc:0 "On a cold, windy day, Degrelle visited the Public Security Bureau as usual with the pardon for major right-wing prisoners. He received the salute from the Public Security Bureau student who saluted awkwardly and took the keys placed on the desk. The jingling sound stopped at his waist. Today was the day the pardon for Joris van Severen was issued.\n\n\"Let's see, Joris van Severen. Room 35.\"\n\nThe sound of clicking boots echoed in the hallway. Degrelle seemed somewhat nervous. He was an acquaintance of Severen. He continued to walk down the long hallway. Room 31, Room 32, Room 33, Room 34, and finally Room 35.\n\n\"Ahem. Joris van Severen, the benevolent motherland calls you again. It's a special pardon. Come out.\"\n\"Look who it is, isn't it the traitorous crybaby brat Léon. What have you been doing while you were out that you're acting like the master?\"\n\"Hah, it's better to stop those fucking unfunny jokes, Joris. I'm warning you, look at reality. You're not still in those delusions of something like Dietschland, are you?\"\n\n\"I didn't sell out the country, you foolish brat.\"\n\"What? Foolish? Do you know this? While you guys were doing nothing in prison, I saved the motherland. I saved Belgium. Do you know, Severen? Your miserable sense of reality ruined Flanders.\"\n\"And this is cooperation, not submission. I hope you know the difference.\"\n\n\"Hehe... you might think you've brought an Amnesty, but to me, it sounds like Amnesia. It's hilarious, Léon.\"\n\"Oh, and that funny blue badge too. It fits your sleazy soul well.\"\n\"Fine, even if you insult me like that all your life, you're eventually the same kind of human as me. You'll eventually go to work for them too. Do you think I wouldn't know that?\"\n\nSeveren seemed inwardly surprised but didn't give any reply."
 COU_event_kaya.5.a:0 "They should get along well without fighting each other."
 COU_event_kaya.6.t:0 "Impeachment of Acting President Nanagami Rin"
 COU_event_kaya.6.desc:0 "The General Administration Office lost its power and the Administrative Committee usurped the center of power. Rin certainly possessed the political power to sufficiently predict and respond to that, yet she didn't respond properly like a fool. Did she perhaps do it on purpose? The truth will never be revealed for certain, but well, it was a piece of luck for Kaya herself, so that was that. The 'No-confidence vote for suspension of acting authority' was originally scheduled to be held yesterday, but was adjusted to this morning due to voting obstruction by the Transportation and Settlement Offices. As expected of the people who support Rin, they were incredibly sly.\n\nThe no-confidence vote was surprisingly smooth. The people from the General Administration Office who had been intimidating the Administrative Committee as if they would overturn the board just the day before didn't show up at all at the voting place held under the protection of collaborators. The voting was held quickly among the remaining departments, excluding the Transportation and Settlement Offices who didn't attend, as if making a sharp cut.\n\nThe voting result was support from 6 executives, which was of course more than a majority. Kaya held back the laughter leaking out and waited calmly. The subsequent election of the next Acting President was held just as quickly. Aoi had a look of disapproval as if she hadn't expected such a situation, but she had no choice but to cast her vote for Kaya as promised beforehand.\n\nAfter the perfect voting ended, the collaborators quickly captured and interned 'former' Acting President Nanagami Rin according to the devised command structure. With this, no one could stop her anymore.\n\nThe power Kaya had yearned for so much had arrived."
 COU_event_kaya.6.a:0 "Only then did Kaya give a thin smile."
 COU_event_kaya.7.t:0 "Plot of the General Administration Office"
 COU_event_kaya.7.desc:0 "\"Acting President Kaya, here is the requested CCTV footage.\"\n\"Yes, good job. You may leave now.\"\n\nThe administrator left the office with quick steps. Acting President Kaya played the video on the tablet with a look as if something was offensive. Although it's only been a week since she took office, clearly her power was obtained with legal and overwhelming support.\n\n\"T-This is bad... Rin-senpai is... I mean the Chief Administrative Officer is...!\"\n\"It seems true that Rin-senpai has been interned. On charges of forging the GSC President's letter for her own gain and being complicit in corruption.\"\n\"Th-There must be some misunderstanding...!\"\n\"Misunderstanding my foot. She must have been slandered by someone. Siiiigh... should I be glad I didn't attend the impeachment vote? If I had, those lunatics would have interned us too.\"\n\nLunatics? Ha, who are you calling lunatics? Kaya scowled. Lately, the Transportation and Settlement Offices were uniquely offensive and she didn't like them, and the reason for that was contained in this video.\n\nThe plot of Nanagami Rin and the General Administration Office still remained." 
 COU_event_kaya.7.a:0 "No matter what you do, you won't be able to do anything."
 COU_event_kaya.8.t:0 "Stress"
 COU_event_kaya.8.desc:0 "Two days ago, Kaya had just put her hand on the new executive order and sworn into her acting presidency; the day before that, she was excited about her new position with a crossed-leg and arrogant expression; and today was the day she was suffering from work, pouring down coffee while clutching documents rejected from each department for various reasons. Kaya had done overnight work a few times since the Great Transfer, but this was the first time it was so full-scale. Her facial muscles twitched with pain.\n\n\"Acting President, may I enter?\"\n\"Damn it, just figure it out and come in!\"\n\nKaya felt immense displeasure at the reality where even her painstakingly built image of 'edification,' 'honesty,' and 'common sense' was being threatened. It's not that she didn't know this situation. She knew how busily the GSC President worked and she used to grudgingly admit Acting President Rin's work processing skills. However, she had never imagined it would be such a hard job. Even though she split the work as much as possible and distributed it to collaborators and each department immediately after taking office, there was still a lot of work."
 COU_event_kaya.8.a:0 "She repeated to herself that she was a superhuman several times."
 COU_event_kaya.9.t:0 "Collapse of the Temporary Solidarity Block"
 COU_event_kaya.9.desc:0 "At the time of pushing for Nanagami Rin's impeachment, Shiranui Kaya was able to obtain the acting position unanimously thanks to the various things she promised. However, now about two weeks after she took office, some forces that supported us seem disappointed that the new Kaya cabinet is engrossed in writing executive orders while neglecting the promises made between each department.\n\nThey have begun to show critical moves against Acting President Kaya, and the decisive evidence that the temporary solidarity block centered around Shiranui Kaya has collapsed is also the fact that the Finance Office, including Oki Aoi, has begun to show an ambiguous attitude toward the new cabinet, which is also a big blow to the new acting regime."
 COU_event_kaya.9.a:0 "Is their patience shorter than a child's?"
 COU_event_kaya.10.t:0 "Effectiveness of New Executive Orders"
 COU_event_kaya.10.desc:0 "After Acting President Kaya's inauguration, she and her cabinet quickly passed several new executive orders decided after in-depth discussion and debate, and good news is being heard that those new executive orders are taking effect. For example, the executive order prohibiting the bringing of explosive substances within 100g into D.U. is receiving overwhelming support from locals who felt threatened for their lives and is maintaining a high reputation among collaborators deployed for security maintenance.\n\nOf course, not everyone is satisfied with the new executive orders, but the locals who always complained from the position of the weak and minority seem quite satisfied with the new executive orders of the Kaya cabinet. This undoubtedly suggests that Acting President Kaya's political decisions are correct."
 COU_event_kaya.10.a:0 "Naturally, it should be so."
 COU_event_kaya.11.t:0 "Reign of Terror"
 COU_event_kaya.11.desc:0 "\"... Is Kronos School not here yet? We need to conduct the regular student address.\"\n\"I-I'm sorry, Acting President... we are currently mobilizing all possible means to call them... but we can't get in touch at all...\"\n\"Haah? Do you think that's a valid excuse? If those people don't answer, didn't you think about preparing our own broadcast?\"\n\nThe administrator, who had been bowing and scraping for days, fled out of the office. Kaya was maintaining an unwavering, peaceful expression. Those people would have probably experienced for the first time in their lives a kind of roar and direct action finally spat out by the head of power. Direct dismissal, imprisonment and beating, even family internment. All possible means were being used. Why do it to this extent? Well, since the opposition characters know nothing except for inciting and lying on the internet all day, she just decided to use this opportunity to teach them what 'power they should respect' is.\n\nKaya's prepared 'strong blow' was about to reveal its form to the world soon.\n\n\"A-Acting President, they say the camera is ready.\"\n\"Yes, thank you.\"\n\nEveryone feared and avoided Kaya's gaze as she walked slowly and loftily, as if floating toward the camera. However, people outside would not be able to imagine this kind of internal appearance at all. Showing her face in the address almost every day, with a smile accompanied by slit eyes.\n\nThere was no room for fault-finding. Even if they wanted to catch a slip, all that would be caught is their own appearance submissive before power."
 COU_event_kaya.11.a:0 "Perfect."
 COU_event_kaya.12.t:0 "Coffee with Sugar"
 COU_event_kaya.12.desc:0 "\"As ordered, the Athletics Director, Cultural Director, Health Director, Human Resources Director, and Human Rights Protection Director have all signed the oath of allegiance. We couldn't get the Finance Director's signature, but considering she isn't nitpicking your brilliant administrative processing skills, it's worth ignoring. And regarding the Chief Administrative Officer, we followed the instructions not to touch her and didn't approach her, but is it really okay to leave her be? It bothers me that the spiritual support of the worms is still alive. -M.A. van Huut.\"\n\nKaya sighed as she read the MomoTalk. What is that pathetic human doing, nitpicking her decisions? That made her a bit unhappy, but she soon felt joyful in her excited mood. Now there was no longer anyone who could stop Kaya. Those who resisted were often 'missing' or 'suddenly died' for unknown reasons and disappeared. All obstacles blocking Kaya's path had vanished.\n\nThe aroma of elegant coffee blended with the freshly printed warm paper to give off a lofty scent. She put a small teaspoon into the coffee cup and stirred it. The sugar melted into the coffee as if swirling."
 COU_event_kaya.12.a:0 "Fell into the delusion that Kivotos would regain peace again."
 COU_event_kaya.13.t:0 "Impeachment Attempt Discovered"
 COU_event_kaya.13.desc:0 "As Acting President Kaya gradually committed overstepping of authority and began a reign of terror, those who realized their necks were being tightened seem to have been secretly gathering and discussing an impeachment to impeach Acting President Kaya just as Kaya impeached Rin. However, thanks to our excellent local intelligence network, their plot was discovered from the start and they were 'missing' by collaborators, and those who realized the truth of the incident responded by showing no reaction.\n\nTheir mistake began with trusting Acting President Kaya."
 COU_event_kaya.13.a:0 "Unbelievable."
 COU_event_kaya.14.t:0 "Interview Room"
 COU_event_kaya.14.desc:0 "The escape from the reign of terror ended ridiculously in vain. They fell into an ambush of the FOX Squad, who were pretending to cooperate. Momoka didn't avoid Kaya's gaze, which looked down as if piercing. Only Momoka's bright eyes quietly gazed forward. Ayumu closed her mouth and didn't say anything. She seemed agitated but was trying not to look so.\n\n\"Transportation Director, I will ask for the last time. Where did you go after that day? Thanks to that, D.U. was in a mess for a while, and even if I executed you on sabotage charges, you'd have nothing to say, would you?\"\n\"... Even so, it only moved up the time of coming here.\"\n\"Haah? You sure say some disappointing things. This is all because you, Transportation Director, neglected and abandoned your responsibility that you became unable to avoid punishment. This wouldn't have happened if you had stayed still.\"\n\"Yeah, yeah, that sure is a persuasive thing to say, 'Acting President' Kaya.\"\n\nInstantly, the muscles on Kaya's face fluctuated. A persuasive thing to say. It was a saying that used to fly at her whenever she protested anything during her suspension.\n\n\"Ha! Yes! It sure is a persuasive thing to say, yes! You really can't understand my words until the end!\"\n\nThe pistol drawn from her waist was fired repeatedly at Momoka's head. So many bullets were lodged that they couldn't be counted. Bang, bang, bang, bang, bang, bang, bang, click. When Momoka's halo went out, Kaya's pistol pointed at Ayumu. Yukino, who was guarding the door of the interview room, flinched repeatedly."
 COU_event_kaya.14.a:0 "Silly jokes end here."
 COU_event_kaya.15.t:0 "Daily Life at Kronos School"
 COU_event_kaya.15.desc:0 "The broadcasting station at Kronos School runs busily every day. Technicians maintain camera equipment, announcers try to memorize all the scripts, and reporters head to the scene in time for the transmission. If you saw only this much, it would be the daily life of a broadcasting station like any other day, but something had changed. People who watched as if monitoring with their arms crossed right in front of the camera, especially the presence of collaborators sent directly from the GSC. Those who held a small notebook and wrote down all the contents to be reported and reported to the GSC first shook Kronos.\n\nKazamaki Mai and Kawaru Shinon almost got dismissed because of that, so the situation was not good. Shinon tried to report brightly as usual, but it felt like she was acting.\n\nThe late-night radio broadcast had a new section added praising the Student Council's new executive order, and the articles written by the Reporting Department received censorship close to a rewrite from the higher-ups before broadcasting. Shinon used to talk to herself as if lamenting over an article with long red lines drawn through it.\n\n\"Whether Kawaru Shinon can break through this hardship, stay tuned.\""
 COU_event_kaya.15.a:0 "It's nice that the troublemakers are saying only what I like."
 COU_event_kaya.16.t:0 "Justice"
 COU_event_kaya.16.desc:0 "Miyako's cheeks, which looked troubled, were hot. At first, it was just from a sense of justice to eliminate the communists threatening the peace of Kivotos. But she didn't want to have a reunion with her seniors like this. She didn't know that the seniors of the FOX Squad she admired would have somehow come out of prison and, what's more, be attacking and threatening executives. Truly, she didn't know even in her dreams. Miyako spoke only after a long time had passed.\n\n\"Yukino... senpai, why... why... would you do such a thing...?\"\n\"I admired you seniors. The ideal I didn't have... the strictness of not losing the center even in harsh situations... the justice that can suppress any evil with a single blow...\"\n\"... We've admired you. But, this isn't what we admired...\"\n\n\"It would be nice if everything happened as you wished. But reality isn't like that.\"\n\"You must know the fact that the very existence of SRT was in crisis, Tsukiyuki. It wasn't a miracle that SRT survived. Director Kaya proposed it. If we just listened to her, she would protect SRT and us by any means. And she kept that promise.\"\n\n\"What is justice to you? To me, it is to protect the precious academy and juniors from a harsh world. Those people are the ones who actively pushed for the closure of SRT. They could close SRT at any time.\"\n\"Platoon Leader Tsukiyuki, you did well to catch up with us to stop injustice. But what's next? What will you do after suppressing us? Do you think justice will be achieved that way?\"\n\"It's all in vain, Tsukiyuki. It's time to wake up from the dream now. Leave all the responsibilities and judgments that cannot be accurately known, and fulfill the duty of a weapon.\"\n\nMiyako flinched as if sobbing. She tried to say something but couldn't. There was nothing wrong in her seniors' words. In the first place, isn't the fact that she can perform the current operation thanks to Acting President Kaya who stopped the closure? Perhaps Yukino-senpai's words were right. Miyako hurriedly left after replying that she would leave a message later. Perhaps, she thought, justice was something insignificant."
 COU_event_kaya.16.a:0 "And Niko alone guarded Yukino's side. She was giving a bitter smile."
 COU_tooltip_COU_event_16:0 "§gWhat on earth is justice? Seriously, I don't know a single thing.§!"
 COU_event_kaya.17.t:0 "Conviction"
 COU_event_kaya.17.desc:0 "There was no need for long words. They tried to impeach her? What on earth did those stupid bitches do? How could those bitches, who knew nothing except hanging around to see if some scraps would fall for supporting her, dare do this to her? This was a clear declaration of war. Kaya barely held the pen with her trembling hand and put it in the drawer. As expected, the GSC was completely rotten. It was completely rotten and a den of spies. That's why the GSC President and Rin were helpless and did nothing. That's why they could commit the insane act of attempting to impeach her, a superhuman, right? Furthermore, if the superhuman leaves her position, the ones who gain are only the sneaky local countries on Earth that only hope for the GSC to collapse.\n\n\"As expected, I wasn't wrong. Otherwise...\" she muttered while tightly holding the coffee cup.\n\nKaya pushed away the countless reports lying next to her and took out a sheet of paper. Those things weren't urgent. What was urgent right now was an immediate reform of the GSC system, which was riddled with spies and corrupt. She didn't have time to be pouring down coffee while struggling with work."
 COU_event_kaya.17.a:0 "When the superhuman moves."
 COU_tooltip_COU_event_17:0 "§RThe national focus in progress will be cancelled.§!\n§gThe national focuses will automatically proceed until the §YForced Allegiance§! focus.§!"
 COU_event_kaya.18.t:0 "Inauguration"
 COU_event_kaya.18.desc:0 "The heavy door of the conference room opened, and the pouring spotlight lit up Kaya walking toward the podium. The executives seated behind the podium stood up all at once as if by agreement and sent applause. There was not a shred of hesitation or disagreement left on the faces of the administrators in front. It was a perfect unanimity created by the administrative legitimacy Kaya had painstakingly refined over the past few months. The emergency meeting was held more swiftly than any other time. Q&A was implicitly prohibited, and discussions continued only on how to exclude administrative errors to the maximum extent. It was the very weight of power she had dreamed of during her 2-month suspension.\n\nOki Aoi's displeased gaze struggled to the end to obstruct the procedure, but it didn't seem to last long. This was because Aoi also cast a vote in favor, albeit reluctantly. Kaya was thrilled by the voice whispering the result. Kaya declared from the podium as if enjoying the camera spotlight.\n\n\"With this, I declare that the agenda for the formal recommendation of Acting President Shiranui Kaya as GSC President has been passed unanimously.\"\n\nKaya's voice was transmitted throughout Kivotos via the microphone. Beyond the camera lens, hundreds of thousands of Kivotos students and citizens who would watch this scene through controlled media would now witness the birth of a new order. Kaya gave a faint smile. The rule of a superhuman, a paradise where incompetent people vanished, and a perfect century that only she could achieve had finally begun.\n\nAmid the cheers of victory let out by the Defense Office executives, she tasted the sweetest sense of victory in her life."
 COU_event_kaya.18.a:0 "For the well-being of Kivotos."
 COU_kaya_trait_different_18:0 "@COU §YShiranui Kaya§!'s trait changes:\n  Replaces the §YActing GSC President§! trait with the §YGSC President§! trait.\n  Replaces the §YAmbitious§! trait with the §YSuperhuman?§! trait." #Ah lol 
 COU_event_kaya.19.t:0 "Emptiness"
 COU_event_kaya.19.desc:0 "She scribbled her signature grandly with a quill on the desk. A cool new signature she researched was written down on the fly. The sound of the nib rolling over the smooth paper and the order completed at the end of it were so beautiful. The administrative logic she prepared over several months was perfect, and the GSC was moving according to her will through dialogue accompanied by force.\n\nThe administrators, who had been incredibly arrogant, now submitted reports containing perfect statistical figures. She used to think to herself that this was indeed the perfect rule of a superhuman, impossible for anyone but her.\n\nBut today was different. Two a.m. I looked at the clock obsessively. Something was strange. It didn't feel like time was flowing. It didn't feel like the hour and minute hands were moving.\n\nAll indicators were trending upward. Crime rate? Decreased by 50%. Unemployment rate? Decreased by 35%. Approval rating? No need to even think about it. But then, why?\n\nThen she suddenly looked down at her hands. Her fingertips holding the quill were trembling slightly. She had gained everything, so why on earth? It was full of things she had never read about in books. If I wasn't right, what kind of punishment should I receive?"
 COU_event_kaya.19.a:0 "\"It must be... just because I'm tired.\""
 COU_tooltip_COU_event_kaya_19:0 "Kaya's §YMental Stress§! power balance begins.\nStatus starts from §MGood§! and worsens by §R3.14 every week§!."
 COU_event_kaya.20.t:0 "Throne"
 COU_event_kaya.20.desc:0 "I was still sitting in the office. Reports delayed for several days piled up and up to form a mountain. Occasionally, a quill with dried ink would roll around. I tried to sign the reports obsessively, but it didn't come easily.\n\nLooking at the figures, the GSC's rule was getting better day by day. However, all those indicators felt like a giant hallucination mocking me.\n\nThe voice of the administrator bringing the reports had become more monotonous. The administrators felt like soulless metronomes just moving. Even when I got angry, nothing changed. They felt like puppets unable to think, which made my skin crawl.\n\nThe streets were clean, but there was neither the radiance of the superhuman she yearned for nor the sincere cheers praising her. There were only dying people obeying orders. No, maybe I thought so.\n\n... If these reports were, just if, all lies, what should I do, Kaya. What should I do in that case..."
 COU_event_kaya.20.a:0 "\"Anyone, just get me a cup of coffee right now...\""
 COU_event_kaya.20.b:0 "\"It's okay Kaya, it's just because you're too focused on work.\""
 COU_tooltip_whatifpoliticalpower100:0 "§gUmm, maybe if you had more than §Y150§! political power, a better choice might have been possible...§!"
 COU_tooltip_forpoliticalpower100:0 "Choice is possible because you had more than §Y150§! political power. §RBut remember, this choice is a momentary escape and cannot permanently stop the worsening of stress.§!"
 COU_event_kaya.21.t:0 "Scattered Dust"
 COU_event_kaya.21.desc:0 "Habitually, I doubted if there were manipulations in the reports. Audits were held almost every day, but I compare them with those from last month and needlessly poke at the paper with tweezers. And as always, nothing was caught. Only the perfect rule of a superhuman was being proven. Whew, that's a relief.\n\nThinking about it, the streets that were noisy are quiet. It's good that the noisy small fry have vanished, but something doesn't feel right.\n\nAre perfect people originally quiet? I once encountered a person named Kant while researching boring human history. That person was also quiet. Probably? In my memory. And the GSC President was also quiet. Probably?\n\nDust piled up on the desk. I tried to roughly brush it off with my gloved hand, but maybe because it was stuck, it didn't think to come off. I was angry at the fact that such insignificant dust dared to defy the superhuman, so I shot the dust to death with a pistol. A hole was gouged in the desk. Ah, annoying."
 COU_event_kaya.21.a:0 "\"Haah, clean the dust... no, don't clean it. It'll just pile up again tomorrow anyway.\""
 COU_event_kaya.21.b:0 "\"I should have wiped it with a wet wipe.\""
 COU_event_kaya.21.t2:0 "Deliberation"
 COU_event_kaya.21.desc2:0 "I was doubting too many things. From beginning to end, Kaya doubted and feared everything she had built. Like a genius doctor who fears his own creation, Kaya feared the society she built. It was too different from what she imagined before taking power, and because of that, she was thinking that the perfect Kivotos she envisioned was perhaps impossible. She blindly feared what had not been achieved.\n\nI thought about the conversation with the Chief Administrative Officer. Why did she say such a thing? It could be because she was tired of Kaya coming so often. But clearly, the words she said became a motive for Kaya. No one saw Kaya's appearance as she deliberated while shaking her cowlick here and there, hidden by the sunset light, but they saw that she was smiling for some reason.\n\nLet's not think too deeply, let's not obsess. It was the moment when the constant responsibility and anxiety that weighed down Kaya's shoulders were washed away."
 COU_event_kaya.21.c:0 "It's not over yet."
 COU_event_kaya.22.t:0 "Mirror"
 COU_event_kaya.22.desc:0 "\"I instructed to put cloth over all the mirrors in the office and cover them. Because when I looked in the mirror, I saw some crazy woman. There, that character looked at me and laughed. Like a crazy woman. I ordered to pull that crazy woman down, and since they didn't, I shot one executive with a pistol until her halo broke. Why? Because she didn't listen to me. If she can't even carry out such an easy order, how can I entrust her with the role of managing Kivotos?\n\nKivotos is, I guarantee you, very very very very very very very very very very peaceful. You know too... that, uh, um... who was it...\""
 COU_event_kaya.22.a:0 "\"Anyway, I'll serve you tea soon.\""
 COU_tooltip_COU_event_kaya_22:0 "Price of all §YStress Relief§! decisions is changed to §R2 times§!."
 COU_event_kaya.22.b:0 "\"... But who was I talking to?\""
 COU_event_kaya.23.t:0 "Face"
 COU_event_kaya.23.desc:0 "Your past face that I draw in a circle\n\nWith a face that's swollen and doesn't even stop in a corner of the heart that hopes for utility\n\nWhat was so desperate, can't I become something special to a person without love\n\nYour past face that I draw in a circle\n\nThat face that doesn't dry is a person who cannot achieve joy, a person, oh person\n\nPerhaps there's too much I've lost\nPerhaps there's too much I've lost\nI almost forgot too many things"
 COU_event_kaya.23.a:0 "\"I almost forgot too many things.\""
 COU_event_kaya.24.t:0 "Blackout"
 COU_event_kaya.24.desc:0 "\"Shall I tell you an interesting story? Lately, the light in the office was covering all the letters, so I turned off the ceiling light and processed work with a desk lamp light, but even then, my eyes hurt. I thought it was because the floor was too smooth, so I even laid out a carpet, but my eyes hurt. Well... of course it wouldn't be my fault. A superhuman couldn't be like that, could they? Anyway, eventually, I even turned off the desk lamp light. Hehe. Only then were the letters readable. My head cleared after a long time.\n\n... Yes? Don't you need light to read documents?\n\n...\n\nIf there's light, shadows are created!\n\nI hate shadows, I really hate them, really.\nThe fact that something is hidden...\""
 COU_event_kaya.24.a:0 "\"... I really hate it.\""
 COU_event_kaya.25.t:0 "Fatigue Reliever"
 COU_event_kaya.25.desc:0 "\"Defense Director... no, GSC President. You look tired for some reason.\"\n\nKaya's pink hair buried in a pile of documents was not well visible. Aoi gave a smirk. \n\n\"... Is it the Finance Director. Hehehe..... Phew. There are... no problems. This budget plan is also perfect, right? Hehe...\"\n\"Well, to be honest, I was surprised. That you could process the amount of work as much as Administrator Rin.\"\n\nKaya, who was buried in documents, peeked out her cowlick. Did she feel slightly unhappy at the mention of the Chief Administrative Officer? Nevertheless, since it was Aoi and not someone else, she didn't get angry while throwing the pile of documents. \n\n\"Finance Director, did I look that incompetent.\"\n\"... I won't deny it. Anyway, I don't see you that way now, so rest easy. You're working quite hard too.\"\n\"Not at all.\"\n\nAoi placed documents with the sound of her clicking boots. Next to them, a can of fatigue reliever was placed.\n\n\"What is this?\"\n\"Working hard is good, but if your body can't handle it, it's all for naught. Please, do it while taking breaks.\"\n\"Are you teasing me. A superhuman doesn't get tired.\"\n\nKaya held the reliever can and shook it here and there."
 COU_event_kaya.25.a:0 "It wasn't a bad feeling."
 COU_event_kaya.26.t:0 "Special Administrative Measures"
 COU_event_kaya.26.desc:0 "Special administrative measures for the reconstruction of Kivotos were completed after long review and discussion. It extremely strengthens Kaya's political power and installs a kind of shield for one-person rule through a clause stating that the GSC President's judgment takes precedence over all existing executive orders and the autonomy of academies in Kivotos' state of emergency (it was not defined exactly what kind of state a state of emergency is). Kaya announced the measures with a satisfied expression and declared that they would be applied collectively throughout Kivotos immediately upon announcement.\n\nThe GSC unfortunately has no practical control over the academies that have exercised their autonomy to the limit since the Great Transfer, but the power of Kaya's loyalists and Kaya's authority within the Administrative Committee will become overwhelmingly higher.\n\nFor the reunification of Kivotos, anything must be achieved. And the only flagbearer to lead the reunification is Shiranui Kaya."
 COU_event_kaya.26.a:0 "One step back, two steps forward."
 COU_event_kaya.27.t:0 "Shiranui Kaya's Worsening Condition"
 COU_event_kaya.27.desc:0 "Checking this notification means Shiranui Kaya's condition is gradually worsening.\n\nAs the condition worsens, political power gain decreases, and if it reaches the very end §RWorst§!, the system is removed but powerful penalty traits and a bad ending will be granted.\n\nPlease keep this in mind. The ending you want will only be held in your arms after long labor.\nAh, also, if you haven't checked what you want, please check the 'Goal' in the initial intro again."
 COU_event_kaya.27.a:0 "Understood."
 COU_event_kaya.27.b:0 "I will turn off the worsening condition notification."
 COU_event_kaya.28.t:0 "Bluebird"
 COU_event_kaya.28.desc:0 "Shiranui Kaya constantly wandered looking for perfect power. She spent days looking for power that wasn't clumsy, was decisive, and was loved and advocated by everyone. She believed that if she just did that, the GSC's authority would stand again and Kivotos would enter a period of stability and development again as in the old days and become perfect once more. However, her belief had a problem from the start.\n\nShe silenced those who talked back and the materials that said otherwise met their end in the shredder. After doing that, she picked up the fake statistics she created and was trapped in a cycle of constant doubt again, meeting a terrible end. Admitting that she was wrong. Perfection had not actually left Kaya. Looking back after coming to her senses, she had instead run far away from perfection.\n\nKaya will continue her rule. Because she has already passed the point of no return. Kaya will melt from the start, but the rule will continue.\n\nBut, is that really what she wants?"
 COU_event_kaya.28.a:0 "It's the end. Finally..."
 COU_tooltip_COU_event_kaya_28:0 "§gThe night when the sun doesn't set continues\nAnd we were terrified and went out to the streets without knowing who went first\nWhen we went to the street filled with light\nWe saw people who didn't say anything\nBreaking the promised silence, someone vomited\nI know what words they'll say\nBut there was no one who stepped forward\nGetting dizzy from the surging motion sickness\nI went to the river and threw my body in\nIf my body floats up\nPlease throw flowers\nI want to be remembered that way\nIf I'm no longer visible, carried by the wind\nLeave and don't come back here\nNever come to see me again§!"
 COU_event_kaya.29.t:0 "Smile"
 COU_event_kaya.29.desc:0 "With the sound of roughly knocking on the door, Kaya enters. She gives an awkward smile. Kaya might not even find me welcome, but for some reason she's been visiting me often lately. Besides... this, is it the smell of alcohol? Kaya drank? Not coffee? It was a strange point.\n\n\"Yeeeees, yeeeees-! Are you listening, Chief Administrative Officeeer--! Pathetic, hic! rule like yours... compared to a superhuman like me... hic!\"\n\nIt wasn't Kaya's usual attitude when she visited me. Her face always looked anxious. She must have been constantly doubting if she was right.\n\nI closed my eyes and gave a thin smile. To the extent that she, who only acted cool when impeaching me, had become like this, I didn't have to imagine how much effort she must have put in. Even if the method was different, the heart to care for Kivotos must have been the same.\n\n\"Haha, Chief Administrative Officer... I am a better person than you, hic! I say... yes? You understand, right...?\"\n\"Of course, Defense Director. You've certainly become a better person. Although it's a method I couldn't even imagine, you're certainly making Kivotos a better place than yesterday.\"\n\"There's no need to obsess or be anxious too much. Believe in yourself and move forward. Since everything, is not over yet.\"\n\nAs soon as she finished speaking, Kaya immediately stood up from her seat. She looked frustrated, but her face, which had been constantly looking anxious, looked a level brighter.\n\n\"Chief Administrative Officer Nanagami Rin, it's a miscalculation if you think you've beaten me. Watch a better Kivotos from here, fufu.\" Kaya quietly closed the door and went out. A person who lightens the burden is needed by anyone."
 COU_event_kaya.29.a:0 "A simple motive makes the future."
 COU_tooltip_COU_event_kaya_29:0 "§YShiranui Kaya§!'s §GHappy Ending§! branch is unlocked.\n§gPlease gather more than §Y300§! political power!§!"
 COU_event_kaya.30.t:0 "Superhuman, Non-obsessive"
 COU_event_kaya.30.desc:0 "Kaya went to work at the office with a more refreshed heart. She enjoys Blue Mountain as usual and turns over a sheet of document to review. She confirmed with the last audit result that there was no evidence of manipulation. Actually, she did audits almost every day, but she decided not to obsess like that anymore. Because perfection comes from composure. She also put the pistol in the desk drawer now. She promised herself to use the pistol only if an intruder came in.\n\nShe welcomed people with a smile after a long time. The work was hard, but not to the extent of losing her smile.\n\nThe quality of a person called a superhuman was not just a person who creates a perfect society.\nThe quality of a person called a superhuman was not just a person everyone must love."
 COU_event_kaya.30.a:0 "The quality of a superhuman was not that far away."
 COU_tooltip_COU_event_kaya_30:0 "§gKaya has suffered from the obsession that she was not wrong and must be perfect, and because of that she has been constantly and groundlessly anxious and doubtful about work that hasn't even finished, but she won't anymore. Kaya will no longer be mentally stressed about work that hasn't even finished.§!\n\nThe true happy ending is now up to you. We hope you will grant Kaya a happy ending." #... Though there's no guarantee this is real.
 COU_event_kaya.31.t:0 "Drawing the Curtains"
 COU_event_kaya.31.desc:0 "As I drew the curtains of the office, unusually bright sunlight lit up the window. Chewing on the words Rin said, I looked at Kivotos outside the window. The city was still not perfect and noise was heard here and there, but strangely, the fear that tightened my heart like before was not felt. Perhaps it was because that was the side of the most 'perfect Kivotos.' I thought about the work when I was the Defense Director. I inwardly laughed. Because the me of those days, who only craved power, was too incredibly foolish.\n\n\"GSC President, the requested document... oh my.\" The administrator who came in holding the report stopped. Bright light was entering the office after a long time.\n\n\"This coffee... I don't know who made it, but the aroma is very good, fufu.\" I held out a cup with warm steam rising and smiled slightly.\n\"Good job. This report can be reviewed slowly, so it's not late.\""
 COU_event_kaya.31.a:0 "\"Shall we do it after resting for a bit?\""
 COU_event_kaya.32.t:0 "Not Doubting"
 COU_event_kaya.32.desc:0 "Degrelle stood in front of the office door with a tensed expression. It was because since Kaya took office as GSC President, she tried to talk him over with all sorts of pretexts. He thought about why several times, but no matter how he looked at it, he couldn't think of a reason other than trying to play around with the collaborators and himself. Today too, she'll probably catch some slip for whatever reason.\n\n\"Umm, there are no problems. I'll allocate more budget for Brussels security maintenance.\"\n\nWhile Degrelle stood there stupidly in surprise, Kaya signed the document and returned it. Then, after drinking a cup of coffee, she looked back at Degrelle as if asking what was wrong.\n\n\"Is there some problem?\"\n\"Ah, no, thank you.\"\n\nDegrelle hurriedly left with quick steps. He didn't know what it was, but Kaya looked in better condition than yesterday. To the point that he couldn't think of anything for a moment in surprise."
 COU_event_kaya.32.a:0 "\"Whatever the reason, she's finally come to her senses.\""
 COU_event_kaya.33.t:0 "Shouting"
 COU_event_kaya.33.desc:0 "The temperature of Kaya's office was set lower than usual. She was shaking her legs, but it wasn't because she was cold. Uncontrollable anger flared up. Because someone had posted a poster mocking Kaya in the lobby of the Sanctum Tower. The peace she had momentarily found by taking a regular break turned into sharp thorns again and sprouted. Furthermore, outside, a voice criticizing Kaya's ability could be heard faintly, dare I say. Even if it wasn't actually so, Kaya heard it.\n\nKaya stood up from her seat while throwing her pen. The place she headed to was not the empty duty room, but the large speaker control room of the Sanctum Tower's broadcasting room. In the eyes of Kaya, who pushed away the startled administrator and grabbed the microphone, a light mixed with fatigue and anger flickered.\n\n\"Ahem, I am GSC President Shiranui Kaya. I have just one word for the morons who gather like mice and claim my statistics are 'manipulated'.\"\n\"... Shut the fuck up, you fucking pieces of shit! My rule is too high-level for small fry like you to understand!\"\n\nOnly then did Kaya breathe heavily as if the congestion had cleared. Toward the administrator standing with an appalled expression next to her, Kaya finished the conversation as if throwing it while tying her hair.\n\nPhew, those who don't understand my rule are all morons. You know, right?\""
 COU_event_kaya.33.a:0 "Kaya's voice echoed constantly."
 COU_tooltip_COU_event_33:0 "§gThe superhuman's rest begins with noise removal.§!"
 COU_event_kaya.34.t:0 "Prayer"
 COU_event_kaya.34.desc:0 "There was a church near the Shiratori district. Since the Great Transfer, Michael and his vacant gaze in the closed church, where no one came, stared at the empty church. The mice, tired of hunger, gnawed on the chalice, and the Bible, which lost its praying people, was lethargic.\n\nWith a creaking sound, the door opened. Shiranui Kaya appeared, her pink hair and cowlick fluttering. She dusted off a dust-covered pew and sat down neatly. It was a bit uncomfortable. The difference between the high-quality leather chair in the office and the worn-out pew was inevitable. Kaya came to church for the first time in her life. And for the first time in her life, she prayed. Was it due to some unknown vague fear?\n\n\"We humbly pray, Saint Michael the Archangel, defend us in this world's battle against the wickedness and snares of the devil. May God rebuke him, we humbly pray; and do thou, O Prince of the heavenly host.\"\n\nHer tightly clasped hands trembled.\n\n\"By the power of God, cast into hell Satan and all the evil spirits who prowl about the world seeking the ruin of souls.\"\n\"Amen.\"\n\nKaya slowly opened her eyes, which she had closed. Although dust had piled up, she met eyes with Michael, who stood poking a spear into Satan. Michael drew his spear and paid respects to Kaya. And said."
 COU_event_kaya.34.a:0 "\"We who are petitioners entreat you.\""
 COU_tooltip_COU_event_kaya_34:0 "§g\"Cast Satan and other evil spirits into hell.\"§!"
 COU_event_kaya.35.t:0 "Bystander"
 COU_event_kaya.35.desc:0 "The administrator who used to report results was nowhere to be seen. Even when she called, the operator's answer was that they didn't know. Oki Aoi put down the receiver with a sigh. She honestly thought that the worthless position of Acting GSC President could be held by anyone as long as they were competent. Even if it was the rule of an aspiring dictator. Aoi prided herself on not being swayed by inefficiencies such as political rhetoric or cause, but after Acting President Kaya took office, things only flowed strangely.\n\nShe couldn't and wouldn't raise any problem with the procedure and the Acting President's legitimacy. Kaya was acting like a different person during her one-month suspension after the Great Transfer. Burying herself in a study and devouring local books could be an appropriate answer to this situation. And now, Kaya was randomly implementing a reign of terror unprecedented in GSC history. While it seemed she learned nothing during her suspension, the thorough procedural justification and administrative procedure were smooth to a level that was baffling for Aoi.\n\nAoi clutched her head and threw off her gloves. The moment Nanagami Rin's impeachment came as the biggest mistake of her political career. Her head ached. Even if she wanted to stop it, she couldn't. Her position and authority might not be ignorable, but if things go wrong she'll be caught by collaborators and 'interned' somewhere, and if that happens, holes will sequentially form in the administrative procedure and the 'stable Kivotos' she longed for so much will be shattered.\n\nBut what should she do now?"
 COU_event_kaya.35.a:0 "There was no way. The dissatisfied blue gaze lost its place."
 COU_tooltip_COU_event_kaya_35:0 "§gA sound of a sad heart that no one will likely see.§!"
 COU_event_kaya.36.t:0 "Cardinal's Proposal"
 COU_event_kaya.36.desc:0 "The administrators of the Administrative Committee carefully guided him to Kaya's office. Cardinal Jozef-Ernest van Roey looked at the crucifix necklace around his neck. Praying to God that his actions would be right, he tightly held the necklace. Even if the Holy See had been abolished after the Great Transfer, he as the Archbishop of Mechelen-Brussels could no longer stand by. He cleared his throat and knocked on the door.\n\n\"Yes, come in.\"\n\nBeyond the door, Shiranui Kaya was sitting with her back turned. As soon as he sat on the sofa in front, Kaya immediately spoke.\n\n\"Welcome to D.U., Cardinal Jozef. I am a busy person, so please get straight to the point quickly.\"\n\"Does Ms. Kaya know what those wicked, horned, Satanic atheist Gehenna bastards did? I and the Catholic Church need the GSC's protection. Unconditional.\"\n\"Hmm, for the GSC to protect you without any conditions, the risk is...\"\n\"I will brand your executive orders with the will of God. If so... when you, no, when the GSC rules Kivotos again, it can proceed a bit more smoothly.\"\n\n\"... Interesting. The trade conditions?\"\n\"To create an independent Kivotos Diocese and appoint me as the Archbishop, and the management rights of the holy relics in the lowlands. If Ms. Kaya can yield those, I and the Catholic Church can cooperate for your will as much as you want.\"\n\nKaya put down her coffee cup and turned around to look at Cardinal Jozef. After thinking several times about what intention could be in the Cardinal's words, she finally smiled slightly and responded to him."
 COU_event_kaya.36.a:0 "\"Fufu. It's a deal.\""
 COU_tooltip_COU_event_kaya_36:0 "§gCardinal Jozef smiled in relief. And was relieved by the conviction that the brothers and sisters of Belgium and the Netherlands had become safe from the atheist idiots.§!"
 #Endings 
 COU_event_kaya.37.t:0 "Rule of the Superhuman"
 COU_event_kaya.37.desc:0 "Kaya sat elegantly and looked out the window. Everything was perfect. Society became safe, dissatisfaction subsided, and the morons who were busy slandering her were busy praising Kaya's rule as if they had never done so. There was no place even in a remote country village where Kaya's hand didn't reach. At the end of every journey, everything became perfect again. A society ruled by the GSC President and the superhuman. Society became twice as large, but the new superhuman performed that role perfectly.\n\nThe GSC, though passive but mechanical, was now efficiently ruling the new world. The power of executive orders reached everywhere in Kivotos and the academies were all leading harmonious lives under GSC rule. To the point that crime was now a thing of the past.\n\nA huge portrait of Kaya exuded majesty at the GSC building. The portrait of Kaya looking down on all the students functioned as a spiritual and continuous leader for students and citizens. Students were relieved by and thankful for the old order Kaya brought. Locals cheered for and were happy for the daily life they returned to.\n\nKaya took a warm rest as if satisfied. It felt like everything was just a dream. Everyone will live happily under Kaya's rule. With the hero Shiranui Kaya who saved Kivotos,\n\nForever."
 COU_event_kaya.37.a:0 "Hail the Superhuman!"
 COU_tooltip_COU_event_kaya_37:0 "§gAnd so the story of the GSC came to an end. At the end of the story, Kaya built the paradise she longed for so much. Everyone is happy. There were many ups and downs, but now everyone is happy. Certainly, if this is not a dream.§!\nThank you for playing!"
 COU_event_kaya.38.t:0 "Happy Delusion"
 COU_event_kaya.38.desc:0 "With a lifeless face, an executive was crossing the cold hallway. Next to her, she had a report signed by Kaya with short contents. Is it a report with grand contents? No, not at all. The executive was going to report the change of Kaya's lunch menu to the Administrative Committee. Kaya hadn't come out of the office for a while. Crumpled hair and a torn letter from Haine were rolling around in the dark office.\n\nKaya stared into the darkness with anxious eyes. It felt like something was watching her. There was nothing more to go crazy about. Suddenly someone appeared beyond. Kaya flailed her hand toward the empty space with a trembling hand. She was swept by another anxiety that she had to catch that person for some reason.\n\nHer flailing short hand circled mockingly. Kaya dropped her arm weakly. And closed her eyes, entrusting them to the darkness. Could she see nothing? No, not at all. When she closes her eyes, she sees her clean and organized office. Outside the window, a march of protesters holding placards praising Kaya continues. Next to her, Nanagami Rin is looking at her like a child admiring a hero.\n\nKaya saved Kivotos, but she didn't save herself. she was relying on the happy delusion she saw when she closed her eyes for the rest of her life. No one knows how long it will last.\n\nPerhaps she'll have to live like that forever."
 COU_event_kaya.38.a:0 "Kaya had her eyes closed for several hours. Meanwhile, many footsteps passed her lonely."
 COU_tooltip_COU_event_kaya_38:0 "§gEven if someone dies, governance continues. Kaya continues her rule. With a lifeless face, falling into a happy delusion that she saved everyone, along with the belief that everyone is happy.§!\nThank you for playing! Kaya's spirit eventually collapsed, but this isn't all. A happy ending for Kaya awaits you. Please click 'Goal' in a new game."
 COU_event_kaya.39.t:0 "Between the Winner and the Loser"
 COU_event_kaya.39.desc:0 "Kaya finally achieved the task of Kivotos reunification. Propaganda posters of Kaya holding the GSC flag high and protecting Europe were rolling around everywhere.\n\nBut what happened to herself in the meantime? She spent painful days with her spirit gnawed by an unstopping anxiety. Doubting, cutting off, reorganizing. Mental stress became Kaya herself and Kaya was now living a life accustomed to suffering from stress and occasionally falling into delusions. Because if she didn't, she felt like she would really go crazy.\n\nAn executive knocked on Kaya's office door with quick steps. Kaya, who was dozing, was startled and turned on the lights in the office. If it were the usual Kaya, she would have shot at him for knocking when she was dozing, but now it was okay. Because all the elements that made her irritable had vanished. The executive with a tensed expression submitted a reunification report to Kaya. Kaya put on her glasses and glanced through the unification costs additionally written by the Finance Office. The more she read, the more annoyed she felt.\n\nKaya reached the end she yearned for so much, but for some reason she was constantly getting annoyed."
 COU_event_kaya.39.a:0 "Hail the Superhuman...?"
 COU_tooltip_COU_event_kaya_39:0 "§gThe reality faced by the girl who wanted to be a hero was harsh. When will this long journey end? When can Kaya become a superhuman? No, is she even a superhuman?§!\nThank you for playing! You've worked very hard managing Kaya's spirit during the long journey. However, a true happy ending awaits you. Please click 'Goal' in a new game."
 COU_event_kaya.40.t:0 "Silence"
 COU_event_kaya.40.desc:0 "Finally, all gunfire ceased. Atop the Trinity cathedral, over the lawless zones of Gehenna, and through the sandstorms of Abydos, the GSC flag fluttered. The complete administrative integration that no one in Kivotos history had achieved was completed at Shiranui Kaya's fingertips.\n\nThe borders between academies now remained only as distinctions on paper. Powerful autonomy was withdrawn and sealed in GSC cabinets, and students' armed clashes vanished under the name of administrative disposition. Now there are no noisy festivals or reckless commotions in Kivotos. Only the sound of bells ringing at set times and the sound of administrators' typing processing reports mechanically replaced the city's pulse.\n\nThe incompetent chaos that the GSC President and Kaya detested so much could no longer be found. The entire city moved with precision as if meshed according to Kaya's will like a giant clockwork mechanism. On the screen lighting up the center of the city stood a woman in the shape of a perfect superhuman.\n\nKivotos gained peace. However, that peace was just deadly silent to the extent that not even a breathing sound could be heard."
 COU_event_kaya.40.a:0 "Silent peace. Peace is originally like that."
 COU_event_kaya.41.t:0 "Rumor of Count Bernhardt"
 COU_event_kaya.41.desc:0 "It was when Léon Degrelle was processing documents in the D.U. office. Degrelle was moving busily to meet the schedule for processing the opposition within the collaborators as Kaya requested. If he was even a bit late, he'd be chewed out by Kaya without mercy. Degrelle said as if grumbling to his aching shoulders while tapping them. \"It can't get any worse than this.\"\n\nA young-looking administrator knocked on the door from outside. Degrelle told her to come in in clumsy Japanese. The administrator carefully handed the documents to Degrelle.\n\n\"What is this?\"\n\"It is a report related to a person recently ordered to be watched by the Defense Office.\"\n\"Ah, yes, thank you. Leave it there and go out.\"\n\nAnd a few hours later, Degrelle glanced at the documents the administrator left as if doing homework he forgot to do. There didn't seem to be any serious contents. Until he read the name 'Count Bernhardt' written in the middle.\n\n\"... Bernhardt encouraging resistance while moving between Cogi Town and Tri-Square... Wait, Bernhardt? That man must have definitely died!\"\n\nDegrelle looked around. In the event that Bernhardt is alive, that is the same as a death sentence for himself. That is because it's natural; since he reported with conviction that he saw him clearly die in December 1935, saying words to overturn this will more than just irritate Kaya's temper; it will blow it up. Degrelle couldn't take his eyes off the document while breaking out in a cold sweat."
 COU_event_kaya.41.a:0 "\"Fuck, why only to me again...\""
 COU_tooltip_COU_event_kaya_41:0 "§gDegrelle, who packed his pistol, wandered the streets and shot dead everyone who looked similar to Bernhardt. It was an unavoidable measure in order to not die.§!"
 COU_event_kaya.42.t:0 "Congratulatory Message from the Athletics Office"
 COU_event_kaya.42.desc:0 "\"GSC President, I told you when we met earlier but I think I said it roughly because I was in a hurry, so I'm writing on MomoTalk once more. As the Athletics Director, I sincerely congratulate you on becoming the new GSC President! Hearing you mention the importance of athletics in the speech, how many tears I shed, unlike Acting President Rin who ignored athletics, GSC President Kaya seems to know the excellence and importance of athletics, so I'm really happy. Furthermore, for providing even more rice balls in the middle! Truly, I don't know how to convey this gratitude.\n\nBy the way, aren't you going to meet the Finance Director? I visited and she didn't look happy, so I just came back. Anyway, I'll visit the office with Mr. Degrelle soon, let's take a photo together. Our kids are anxious to see GSC President Kaya.\n\nPlease take good care of us in the future, GSC President.\n- Haine, written at 8:29 PM.\""
 COU_event_kaya.42.a:0 "Kaya burst into laughter while reading the MomoTalk."
 COU_event_kaya.43.t:0 "Responsibility"
 COU_event_kaya.43.desc:0 "Léon Degrelle let out a heavy breath while crossing the hallway. The sound of his clicking boot heels hit the white floor of the GSC irritably. He felt extreme annoyance at the behavior Kaya showed for the past few days since Kivotos was unified. Even though she became the ruler of Kivotos, she stayed holed up in her room while ignoring all interview requests from himself and the collaborators who had been submissive from the start! Isn't this excessive? It's been more than a year since Kaya and he directly met.\n\nDegrelle, who approached the office and was about to knock, flinched slightly when he saw the door was open. Would it be better to just go back like this? Is it right to dare enter a room where a woman is alone? But as he saw the unusually dark office beyond the door, a bit of worry grew. Kaya's appearance, sitting in a chair like a doll with cut strings and staring into space with vacant eyes in the dark office where curtains were tightly closed and piles of reports were scattered on the floor, met his eyes as he carefully pushed the door and entered. He, who was about to wake her, momentarily paused at her emaciated complexion seen up close. The Kaya he had seen from before certainly... didn't look like this. She used to have irritating arrogance and confidence.\n\n\"... I'd believe it if you said she was just a corpse.\" After turning on the desk lamp, Degrelle placed his hand gently on Kaya's shoulder as if to make her come to her senses, and it was in that very moment that the thing happened. Kaya began to twist her body while struggling for breath as if her body had caught fire.\n\n\"GSC President Shiranui. It's me, Degrelle! What on earth—\"\n\"Fire, the fire...\" Kaya muttered in a low voice while trying to grab Degrelle's sleeve.\n\"Fire... it's too bright, turn it off... please...\" \n\nRealizing that his turning on the desk lamp was the problem, Degrelle quickly turned off the lamp's power. When the light vanished, Kaya breathed as if she were a drowning person and struggled to grab the desk and stand up, but her legs gave out and she collapsed toward Degrelle's chest. Seeing Kaya collapsing toward him, Degrelle caught her automatically without even realizing it. While Degrelle frowned and tried to grasp the situation, Kaya buried her face in Degrelle's chest and sobbed.\n\n\"I, I can't do it. I can't anymore. I'm not a superhuman. I'm not her. I'm not.\"\n\nOnly after seeing the girl who claimed to be a superhuman trembling with wet eyes in his arms did Degrelle realize that the ambitious person who had reached out to him while he was looking for an escape ship was just a 'child'. Then, futility surged like a wave. A child ruled adults, and the adults who should have guided the child hated, feared, and revered the child! Degrelle let out a hollow laugh while holding her. He couldn't put Kaya down nor hold her tighter, and just laughed blankly in the darkness."
 COU_event_kaya.43.a:0 "How many things were meaningless."
 COU_tooltip_COU_event_kaya_43:0 "§gDegrelle's brand will not be erased. What responsibility lies with the adults who played along with a child's cruel childishness?§!" 
 COU_event_kaya.44.t:0 "Meeting with the Human Rights Protection Director"
 COU_event_kaya.44.desc:0 "Kaya sipped her coffee and tasted it. Because it was bitter coffee, her mood was not good. Both aroma and taste were failures. It was like the person she was about to meet. Because she hadn't imagined there would be someone who openly defied her words. Responding to such a Kaya, a polite knock was heard. Kaya quietly told them to come in. With the sound of the door opening with a click, the Human Rights Protection Director, Jan Baars, revealed himself. On the chest of his well-groomed suit was pinned a blue GSC badge, and the glasses he didn't often use were tucked into his chest pocket.\n\n\"Director Baars, I'm sorry for calling you while you're busy.\"\n\"It's alright, Defense Director. Besides, the coffee aroma is good.\"\n\"I'm not the Defense Director anymore; I'm the Acting GSC President, Director.\"\n\nSilent silence. Baars, sitting leaning on the sofa, didn't say anything with his two hands clasped. Kaya put down the coffee cup and didn't say anything. It was Baars who broke the uncomfortable silence.\n\n\"Acting President, I'll be blunt. The Administrative Committee's state is not good lately. Do you even know?\"\n\"Not good? The GSC is more peaceful than ever.\"\n\"Haah... Acting President. What is this supposed to be? Everyone who shows a negative opinion of you is just missing! You might not know politics well because you're young, but this...\"\n\n\"Haah? You're saying some very rude things right now, Director!\" Kaya hit the desk as if it would break. Baars, who flinched and looked at her, soon closed his mouth. Kaya took a pistol from her pocket and pulled the bolt. The high-handed clicking sound overwhelmed Baars. Kaya tilted the pistol toward him.\n\n\"Isn't it so, Director? The GSC is more peaceful than ever!\"\n\"A-Ah, of course, Acting President. I'm sorry for speaking rudely, I apologize.\"\n\nBaars cleared his throat and hurriedly left on the pretext of work. Kaya sat down in the chair with a sigh."
 COU_event_kaya.44.a:0 "\"It's tiring, doing this every time.\""
 COU_tooltip_COU_event_kaya_44:0 "§gKaya flailed her hand and roughly emptied the rounds into the ceiling. One shot, two shots, three shots...§!"
 COU_event_kaya.45.t:0 "Retaliation"
 COU_event_kaya.45.desc:0 "\"Sirs, this old man begs you like this, please stop, it's my only property, please...\"\n\"What? I'm not sure because someone is barking!\"\n\nTwo Belgian youths wearing collaborator armbands were laughing while smashing a ramen cart operated by a Shiba Inu beastman. The old dog sobbing next to them couldn't do anything and just watched as the cart was smashed. A group of students from Gehenna who were passing by helped the beastman up and protested to the youths. To be ashamed, do they know what they're doing.\n\n\"What did we do? What do you mean what! We're just reclaiming what we should rightfully take back, you bitches! Seeing the horns you must be underlings of Satan like Gehenna, but this is Wallonia. It's not hell!\"\n\nLaughing at each other, the youths requested additional 'security maintenance personnel' via radio. Startled by this, the Gehenna students had to leave, and people avoided the scene as if they had seen something they shouldn't have. Broth spilled over the remains of the cart soaked the floor. The old dog tried to pick up the broken bowl pieces with trembling hands, but even his hands were crushed by the subsequent arrival of military boots. Instead of settling the situation, the newly arrived security maintenance personnel thrust a document into the old man's face saying the location of the destroyed cart was 'aesthetically inappropriate'.\n\nAn administrator watching this scene from a distance left without a word. Originally she should have reported to the higher-ups to stop this, but now that the power of collaborators had become powerful, it was certain she'd see a bad sight if she caught their eye. Anyway, the collaborators became able to work with higher satisfaction than working under a regime that was uniquely weak."
 COU_event_kaya.45.a:0 "It's fine as long as the work is done well."
 COU_event_kaya.46.t:0 "Rabbit and Fox"
 COU_event_kaya.46.desc:0 "\"Rabbit 1, entering. Rabbit 2, please secure the escape route!\"\n\"Roger! Just wait a bit!\"\n\nBullets being fired were rolling around the floor in countless numbers, and missiles emitted from Moe's helicopter exploded as if decorating the chaos. The walls of the training ground, where the SRT logo was clearly engraved in places, were broken, and Miyako and Saki were out of breath. For how many minutes had they run around? They were able to enter the target scene. On a table at the scene was a neatly sealed letter. Miyako, who carefully entered the scene, opened the letter with a trembling hand.\n\n\"Surprise, Rabbit 1...?\"\n\"It's a trap! Saki! Watch o—\"\n\nYukino quickly grabbed Miyako's neck. In front of her, Saki was seen being caught and dragged by Kurumi. Miyako sighed and waved the white flag she had tucked in her pocket.\n\n\"Yees, we lost. It's surrender.\"\n\"Platoon Leader Tsukiyuki, I told you to be careful when you're alone away from the pointman.\"\n\"The same goes for Saki! Neglecting rear security, you're a failure as a pointman of the proud SRT.\"\n\"Th-That's, because Miyako wasn't visible, I became impatient...\"\n\nSaki said awkwardly. Soon Otogi and Niko appeared along with Moe. Niko smiled bashfully and the smell of fried tofu sushi she brought spread through the training ground. Like that, even Miyu gathered in one place. Sounds of laughing and talking echoed. Kaya, watching that appearance from afar, sipped her coffee with sugar alone."
 COU_event_kaya.46.a:0 "They were the most reliable students."
 COU_event_kaya.47.t:0 "Processing"
 COU_event_kaya.47.desc:0 "\"Hik, i-hiik! N-no, please... Th-this, fuck, fuck... fuuuuck!!!\"\n\nA broken metallic sound came from the ticking revolver. Internal parts might have been crushed, or something might have warped due to overheating. What's certain is that she's now fucking screwed. Everything is unclear, but that alone was clear. As if to forebode such a fate, the desperate Finance Office executive kept banging on the revolver. Coldly, her old-fashioned revolver didn't think to obey her at all. Shiranui Kaya, with her yellow halo flashing in the darkness, gradually revealed herself. Tears welled up in the executive's eyes.\n\n\"Haah... I'm asking you, please stop crying. How can everyone who 'interviewed' cry so sadly in front of me, in a disappointing way. If you do that, I'll look like a very wicked villain, won't I?\"\n\nKaya said while taking the pistol from her waist. The terrified executive threw the revolver at her. Kaya, who tilted her head and avoided the revolver, could no longer hold back her laughter at such a comical situation. Hahahaha!\n\n\"Mr. Feldmeijer? Catch that bitch.\"\n\nHenk Feldmeijer, who was following her silently, nodded and then caught the executive's two arms and made her kneel. The executive, whose whole body was trembling like an aspen tree, couldn't look at Kaya. Kaya sighed and pulled up her head.\n\n\"Because of you people, everything became a mess. Right? Trying to hinder the rule of a superhuman and plunge Kivotos into chaos is like a spy... shall I say? Umm, yes, it seems you people are indeed spies. Every single person.\"\n\"N-no... we just thought you weren't sane...\"\n\"Fufu... is that so, Mr. Spy?\""
 COU_event_kaya.47.a:0 "Kaya pulled the pistol's trigger. Feldmeijer lowered his head."
 COU_tooltip_COU_event_kaya_47:0 "§gShe kept pulling the bolt until the executive's halo went out. Kaya believes that the actions she's doing are an unavoidable wound for society to accept the superhuman.§!"
 COU_event_kaya.48.t:0 "Nap"
 COU_event_kaya.48.desc:0 "Lukewarm sunlight seeping through the curtains tickled her eyelids. A short rest taken using a pile of reports as a pillow should naturally be sweet. In her dreams, Kaya was still the winner. She was a perfect superhuman and the ruler of the system. Under her feet, those who had surrendered to the superhuman were standing in line, and all the gears of Kivotos were precisely meshing according to Kaya's fingertips. But at some point, the sound disappeared. The sound of military boots echoing on the floor, the sound of the nib scratching the paper, and the praises full of awe became muffled as if falling into a vacuum state. When she raised her head and looked around, the flashy wall surfaces of the office were melting away without a sound.\n\n\"... Huh?\"\n\nKaya tried to stand up in a panic but her feet wouldn't move. Below was black and sticky ink soaking Kaya's shoes. The signatures she had scribbled were crawling out of the paper and holding her ankles. In that swamp of ink, nameless people showed their faces. They didn't resent her. They just stared at Kaya with expressionless eyes, gradually pulling Kaya's body down to the floor.\n\n\"Acting President, is this truly a 'superhuman'?\"\n\"Don't you think it's funny too?\"\n\"Perfect? No way. It's just a huge circus play all for you.\"\n\nHallucinatory voices echoed in her head. Kaya tried to scream, but a bitter ink taste was felt even in her mouth. The GSC President's back was seen from afar. She desperately reached out her hand.\n\n\"Senpai, did you see? I've achieved it. As a superhuman, I—more perfectly than you who was a superhuman...\"\n\nSuddenly the GSC President burst into laughter. The melting GSC President had no face. A smooth egg-like face was staring at Kaya.\n\nAnd Kaya raised her upper body while breathing heavily. A report mark was clearly left on her cheek, and her shirt was soaked with cold sweat. The office was quiet. No one was there. The scenery outside the window and the pistol on the desk were the same. Everything was under the rule of the superhuman. She breathed a sigh of relief, but stopped while trying to grab the coffee cup with her hand.\n\nWhat if... she isn't a superhuman?"
 COU_event_kaya.48.a:0 "She decided to stop such unpleasant imaginings."
 COU_tooltip_COU_event_kaya_48:0 "§gThe order built by Kaya will be perfect. It will save Kivotos, and furthermore, it will save the world, and she will save everyone like a princess on a white horse.§!\n§RProvided she doesn't collapse.§!"
 COU_event_kaya.49.t:0 "Yes-Woman"
 COU_event_kaya.49.desc:0 "Even if the world turns upside down, regular meetings are held at the GSC. And it was something that was steadily held even after Acting President Kaya took office, but the atmosphere was quite different from that of the beginning of the acting presidency. In the beginning, various executives pointed out Kaya's administrative mistakes and stopped some of Kaya's executive orders, so something was at least turning. But lately, not anymore. The purges that steadily occurred under the surface turned the Administrative Committee into Kaya's stylish extras and were suffering the humiliation of being pointed out as a cause of maintaining an inefficient system for the sake of legitimacy.\n\nThis meeting was regarding the rearmament of the Defense Forces. Aoi sat down after finishing voting on budget allocation. And as soon as she sat down, Haine slid over, grabbed her shoulder, and asked.\n\n\"Hey, Senior Aoi. Do you have any leftover rice balls? This meeting is getting long too.\"\n\"I'm sorry, but I don't, Haine. Why don't you ask Sumomo.\"\n\"I already ate Sumomo's.\"\n\nHaine said while rolling her eyes. Aoi sighed. It felt like she had seen something she shouldn't have seen.\n\n\"... Yes, we will begin the vote on the additional budget execution for Defense Force training.\"\n\"Ah, Sumomo, wake up. We're voting.\"\n\nAs usual, Haine and Sumomo voted in favor. Aoi stared at the paper where the item was written for a long time before voting in favor. Kaya was looking at them with slit eyes."
 COU_event_kaya.49.a:0 "Haine's blinking eyes stared at the empty wall."
 COU_event_kaya.50.t:0 "Loyalty Debate: Two a.m."
 COU_event_kaya.50.desc:0 "In a bustling bar in Kortrijk, Degrelle bought a round of beer for all the security personnel. French, Belgians, Dutch, Germans—many different people were gathered, but they communicated in Japanese as much as possible and wore blue collaborator pin badges on their chests. When Degrelle got on a chair while intoxicated and gave a speech like in the old days, everyone laughed and clapped. After the drunken applause ended, the time had already headed toward dawn, so they decided to disperse.\n\nDegrelle wandered the streets with his new friend Feldmeijer while hiccuping. When Degrelle retched as if he felt sick, Feldmeijer patted his back in a corner. Degrelle threw up for almost a minute. It seemed because he drank more than usual.\n\n\"This guy, said he drank well. It was all a lie!\"\n\"Ugh, I went too far today...\"\n\"Ah, Degrelle. This matter, it's certain we won't be caught by Kaya, right? If we're caught, I don't think any of us will survive.\"\n\"Feldmeijer, what do you take me for? I'm the head of the collaborators, huh? Yes, I am an inquisitor. An inquisitor, I say, an inquisitor. My cool nickname given by Kronos! I guarantee you, we will neeeever be caught.\"\n\nAt Degrelle's exaggerated gestures, which used to come out only when he gave a speech, Feldmeijer let out a short laugh. But soon Feldmeijer took out an e-cigarette from his pocket and smoked quietly. And as if he only barely spoke while intoxicated, he asked him in a serious tone.\n\n\"... Degrelle, I know it's a bit much for me to say this, but do you plan to keep living like this?\""
 COU_event_kaya.50.a:0 "\"The kind of life where you're stuck to a child and can't even drink in peace.\""
 COU_event_kaya.51.t:0 "Loyalty Debate: Three a.m."
 COU_event_kaya.51.desc:0 "\"Haha, Feldmeijer. To think you'd try to do a loyalty test while drunk. You're quite mischievous too.\"\n\"No, Degrelle. This isn't some silly joke like that. Have you seriously thought about it? About what I... said.\"\n\nA straightened Degrelle's eyes turned toward Feldmeijer. In Feldmeijer's open pocket, a silver bullet flashed that was 'considered' to be able to destroy a halo with minimum rounds. Degrelle gave a smirk. He rested his chin on his hand and thought about the old days after a long time. His pathetic self who rushed at girls with halos for his life at the time of the Great Transfer, the appearance of those foolish days when he finished a speech to counter the devils of the other world and came down.\n\n\"Feldmeijer, have you heard of the turmoil in Germany. Those who were loyal to the Nazi Party and Germany all left the world without even a chance. Regardless of the ideals and dreams they had pursued for twenty years or more, they were all trampled and killed by 'devils with halos'.\"\n\"Furthermore, Germans didn't even have a chance. Not to mention friends who fought back, even friends who begged for negotiation all died. And then what did the Kivotos students say? They said they didn't know a person could die just from a gun. Isn't it funny?\"\n\nFeldmeijer puffed out cigarette smoke. It looked uniquely thicker.\n\n\"We are people who caught a chance in such a scene of slaughter, Feldmeijer. You know too. I caught a chance to save Belgium. Because there is no patriot who can watch Belgians die pointlessly.\"\n\"So you'd better stop such thoughts. Who else but Kaya would have reached out to us? Even the character called GSC President shot and killed all the royals.\"\n\nFeldmeijer couldn't speak for a while while smoking. Since he seemed to be in deep thought, Degrelle also closed his eyes and looked into the darkness next to him. Degrelle caught an escape ship. But he hadn't thought about the next part in detail."
 COU_event_kaya.51.a:0 "Just satisfied with being alive."
 COU_tooltip_COU_event_kaya_51:0 "§g\"Right, hearing you, your words aren't wrong either.\" Feldmeijer tapped Degrelle's shoulder and left the place. Degrelle smoked a whole pack of cigarettes he had left.§!"
 COU_event_kaya.52.t:0 "Favorite Things"
 COU_event_kaya.52.desc:0 "A joke was trending that anyone who touches Kaya, who's been engrossed in work lately, won't be safe. It was a fact learned through some lacking administrator who was caught by her while telling that joke right in front of her. Kaya of course didn't care about those words at all, but she wondered if she was really that scary. Kaya, who was sitting in a noble posture, called the administrator outside with a deep voice out of curiosity.\n\n\"Ahem, excuse me? Won't you come in?\"\n\"Y-Yeees!\"\n\nClicking door sound, and then an administrator who looked very excited appeared. It seemed she was the one to guard her side this week. Kaya thought it wouldn't be bad to get friendly since she was someone she'd see for a week.\n\n\"What do you usually do on weekends?\"\n\"W-W-W-W-W-Weekends...? I, I...\"\n\nWhat's up with this woman?\n\n\"Is it some hobby you can't mention? I also have such interesting hobbies.\"\n\"Ah, no, it's not like that, it's...\"\n\"I go to a nearby Momofriends character shop on weekends and, well... look around.\"\n\"Don't you buy products? Is it window shopping?\"\n\"Ah, no. Even if I want to buy, since it hasn't been long since I joined, my salary is tight... Ahaha.\"\n\nKaya gave a smirk. She turned around and looked out the window. Although it was a weekday, there were many girls in a shop with a large Momofriends logo hanging. Kaya took a card from her pocket and placed it on the desk.\n\n\"Use it if you need to. I don't really have many things to spend money on.\""
 COU_event_kaya.52.a:0 "\"Because you should be able to have what you like.\""
 COU_tooltip_COU_event_kaya_52:0 "§gTo the administrator who only made dazed sounds like \"Y-Y-Y-Y-Y-Y-Yees?\", Kaya said it's okay, take it while gesturing. Seeing the administrator bowing her waist repeatedly, Kaya thought it was interesting after a long time.§!"
 COU_event_kaya.53.t:0 "Fox and a Cup of Coffee"
 COU_event_kaya.53.desc:0 "A small cafe in the old city area of D.U. which could be considered secret if it was secret. This small cafe operated by an elderly owl beastman had the feeling of being one's own small cafe that only those who know enjoy. And the members of the FOX Squad, who held their ears close, appeared near a corner seat.\n\n\"Umm, Yukino-chan, is here correct?\"\n\"Shh, Fox 2. Just wait a bit and the Acting President will—\"\n\"... It seems this is your first time at this cafe?\"\n\nTo Yukino who stepped back in surprise, Kaya wearing plain clothes and sunglasses gave a thin smirk. Yukino thought the previous Acting President wouldn't have shown this kind of appearance. But that wasn't important now. The FOX Squad came here for an important deal. If it fell through, the FOX Squad, SRT, the precious juniors... were all finished.\n\n\"Acting President, it's the first time seeing you in plain clothes.\"\n\"Fufu, is that so? Well, I don't often wear plain clothes.\"\n\"So, there must be a reason you let us out of prison.\"\n\"Yes, of course. Isn't that why you're here?\"\n\nKaya offered Yukino a cup of dark black coffee. Yukino didn't often enjoy such luxury items as bitter black coffee, but she carefully held the cup and pushed the black coffee down her throat. Perhaps she was desperate.\n\n\"Is it truly... if we commit sabotage against the Administrative Committee, the safety of SRT can be guaranteed.\"\n\"Of course, Yukino. Reliable people like you should receive a corresponding price.\"\n\"But clearly if we, an SRT squad, commit sabotage, the Administrative Committee will try to close SRT.\"\n\"Ha, so that's it. Are you obsessing over such a silly thing?\"\n\"Silly, Acting President. This is a very important—\"\n\nKaya cleared her throat and then quietly clapped her hands. Then, men wearing red armbands from everywhere nodded and stared at them.\n\n\"You won't have done a single thing.\"\n\"Think common-sensically. How can 'vicious criminals' in prison commit terror?\""
 COU_event_kaya.53.a:0 "\"So, you don't have to worry at all. Please believe in the 'Superhuman', in the 'Adult'.\""
 COU_tooltip_COU_event_kaya_53:0 "§gOtogi, who was fiddling with a sniper rifle next to her, looked at Niko with anxious eyes. Niko was sitting nearby looking into her phone. As if saying she heard nothing.§!"
 COU_event_kaya.54.t:0 "Dinner Banquet"
 COU_event_kaya.54.desc:0 "\"Ladies and gentlemen who attended this dinner banquet today, welcome!\"\n\nAn MC with a stylish appearance and a neat suit gave a greeting on the stage with a mischievous expression. In the seats were administrators and executives full of girl-like sentiment cheering for him, collaborators happy in a place overflowing with women, and Kaya who took the middle seat loftily. It was awkward to drink champagne instead of coffee, but she drank it reluctantly as Degrelle said it's the etiquette of adults to open a bottle of champagne in such a joyful place.\n\nClearly she was better off with black coffee. But well, she drank thinking it wouldn't be bad to get drunk on the atmosphere occasionally. The MC continued to speak while running here and there. Girl-like shouts and low voices soaked in cigarettes were mixed and noisy. Kaya was clearly thinking she was joyful.\n\nYes, she thought so. A sense of discomfort somewhere in her heart wouldn't leave. The board had grown so large that it could no longer be settled, and now everything depended on her who was a true 'superhuman'. Had she ever undertaken such a burdensome task? Did Acting President Rin feel this way? The GSC President, did she... feel this way too? Kaya gave an ambiguous expression while swallowing champagne.\n\nShe thought about those days when she was holed up in her office under a suspension order and read only books. She read truly many books. Countless philosophers and thinkers who explained how to establish authority, how to persuade people and make them your side, and complete a perfect rule passed through her mind.\n\nIt felt meaningless. Those people didn't tell her what to do when she was swept by an anxiety that something was missing. Kaya had to define and explain this feeling herself."
 COU_event_kaya.54.a:0 "It felt like an incredibly difficult task."
 COU_tooltip_COU_event_kaya_54:0 "§gShe quietly stood up from her seat and went into the duty room. She laid down in the narrow room and forced herself to sleep. She wanted to get an answer even in her dreams.\n... But in her dreams she'll never find the answer. Not Rin, not the GSC President, not Kaya.§!"
 COU_event_kaya.55.t:0 "In a Flashy Prison"
 COU_event_kaya.55.desc:0 "Acting President Nanagami Rin weakly laid down her power. To the point that anyone would find it strange, she didn't actively resist. To the extent that Kaya thought Acting President Rin had some ulterior motive, the process was very smooth.\n\nKaya moved her steps with clicking boot sounds. Because she heard it's good for the winner to show her face to the loser at least once. The small prison on the street where the Chief Administrative Officer was interned, her new home. When the collaborator saw her, he saluted politely and gave her the key to the door. The door opened with a jingling sound. Acting President Rin was sipping black tea and reading a magazine. Kaya felt pure curiosity.\n\n\"... What magazine is that, Chief Administrative Officer.\"\n\"A fashion magazine. I have nothing to do, so I'm looking at clothes.\"\n\"Heh. Since you can't even go outside anyway, does it matter?\"\n\"Forget it. This is better than stamping endless documents, yeah.\"\n\nKaya thought she wasn't like herself. For that Chief Administrative Officer to say she hates working openly. At least... it was a completely different appearance from the Chief Administrative Officer before the Great Transfer incident.\n\n\"You're not like yourself, Chief Administrative Officer.\"\n\"What is it, Defense Director.\"\n\"Just that appearance. It feels awkward.\"\n\"Really? Then it must be.\"\n\nRin kept sipping black tea and turned the pages of the magazine. Regardless of whether Kaya took power or not, it seemed she wasn't interested. Kaya puffed her cheeks out with an unknown irritation. If she was going to act like this, she should have just handed over power; what was the meaning of what she did?\n\nBecause of everything being irritating, Kaya closed the door irritably and went out. Rin spoke to herself after putting down the tea."
 COU_event_kaya.55.a:0 "\"It would be better not to look for meanings, Defense Director.\""
 COU_tooltip_COU_event_kaya_55:0 "§gRin laid her body on the bed. The model in the fashion magazine was looking at her worriedly. She needed a rest time.§!"
 
 
 ##Rin 
 COU_event_rin.1.t:0 "Anguish and Deliberation"
 COU_event_rin.1.desc:0 "Many people moved their steps to the Acting President's office. Someone submits a report with a very excited expression, and someone else submits an evaluation related to results with a terrified expression. It was a place like a whirlpool of such trivial emotions. But in the very center of it, there was nothing but two things.\n\nFirst is anguish. Struggling to process work efficiently and reach an agreement. How can she persuade the executives in a regular meeting and handle ridiculous scandals about herself?\n\nSecond is deliberation. Thinking if the things she's done are right. Not that she doubts it, but she spends a lot of time just thinking.\n\nOutside the window new worlds and unfamiliar stars were floating, but Rin never raised her head to look at the sky. Her gaze was fixed only on the desk, on a pile of reports aligned as if measured with a ruler. Reports from each autonomous district, distribution plans, and... mobilization plans for security maintenance. Rin's pen tip stopped for a moment. Whether she thought of something suddenly or if it was instinctive, she put down the pen and stared at the documents without a word. More diligently than anyone, more competently than anyone. To fill the GSC President's vacancy, she was grinding herself as a part of the administrative machine.\n\nBut the moment she tried to sign the document, she put down the pen. She kept trying to hold it, but it didn't move easily. The sharp light of the cutter knife used to open the envelope was reflected in her eyes behind the glasses. All the justifiable reasons she spoke of had no power in this silence right now.\n\nAfter a few minutes passed, she returned to the expressionless Chief Administrative Officer as if nothing happened and picked up the next document."
 COU_event_rin.1.a:0 "Her signature was written sharply on the document."
 COU_tooltip_COU_event_rin_1:0 "§gIt's a bit of a sudden story,\nBut let me tell you an interesting one.\nDo you know that everyone commits a sin?\nThen, do you also know that someone commits a §Rsin that can never be washed away§!?§!"
 COU_event_rin.2.t:0 "Emergency Response Committee"
 COU_event_rin.2.desc:0 "Nanagami Rin was speaking slowly with a straight voice while holding the microphone. The whispers of administrators from everywhere and the gazes of executives who were anxious that they couldn't counter-argue were glaring at her fiercely. But as if opposing that, Rin's cold eyes were staring into space. As if the situation itself was uncomfortable, as if she were anxious about the GSC which had to show a side of going into change, she only stared into space.\n\n\"... This is the cooperation proposal that will be sent to the leadership of each academy. The border is gilded and the raison d'être of the Emergency Response Committee is written.\"\n\"We ask for the smooth cooperation of each academy. This was Acting GSC President Nanagami Rin. Thank you.\"\n\nA dry voice, applause filled with many thoughts. Perhaps Nanagami Rin herself would have more worries than the leadership of each academy who will receive the proposal and be anxious.\n\nBut she couldn't do nothing. It was a definite punishment for the month-long lie the GSC had committed. Rin muttered to herself as she exited among countless questions." 
 COU_event_rin.2.a:0 "\"Nothing will change, but.\""
 COU_tooltip_COU_event_rin_2:0 "§gLife is an experiment for everyone and a continuation of addiction.\nLet's experiment with getting a bit further away from that addiction.\nBreaking something will convey a newness that swells the boundaries.§!"
 COU_event_rin.3.t:0 "Opposition Begins Activities"
 COU_event_rin.3.desc:0 "According to what the General Administration Office executive reported, the opposition centered around Kaya's Defense Office has begun activities. The general structure is that when the Chief Administrative Officer submits an item, the Defense Office and Finance Office reject them one after another, and since the Finance Office was originally not a force challenging power, it's coming as a bigger shock.\n\nOf course it was confirmed through a personal private conversation between Rin and Aoi that this is not the Finance Director's disagreement, but since the administrators of the Defense Office and Finance Office share a commonality of distrust toward Acting President Rin, the point that we should prepare for a shock seems unchanged."
 COU_event_rin.3.a:0 "Do they think they're any different?"
 COU_event_rin.4.t:0 "One a.m."
 COU_event_rin.4.desc:0 "In a dark conference room with blue light flashing, Nanagami Rin was staying until late at night fiddling with the proposal. It could be simple anxiety, but to Rin, it was something deeper than such a simple emotion. Next to her were Momoka and Ayumu who had attended the launch ceremony of the Emergency Response Committee but had very anxious expressions.\n\n\"Umm, I kept thinking about it, but, is it, is it right to do this... to this extent? And, is it something we have to announce through an address?\"\n\"Didn't I say, Momoka.\"\n\nRin looked at Momoka while taking off her glasses.\n\n\"Since the GSC has no room to respond to that problem, we must settle the chaos in cooperation with each autonomous district.\"\n\"If it were like before, we could have forced them to attend, but since each academy has exercised its autonomy to the limit, we have no choice but to beg for attendance like this.\"\n\"Senior Rin's position could be endangered by an issue of this level... especially since this issue could be interpreted as infringing on the Defense Office's authority, if things go wrong...\"\n\n\"... They'll raise problems at every turn.\" Oki Aoi revealed herself. Ayumu who flinched and turned her head saw Aoi. Behind Ayumu who stepped back, Rin was seen quietly staring at Aoi.\n\nNanagami Rin opened her mouth quietly like that."
 COU_event_rin.4.a:0 "\"... Oki Aoi.\""
 COU_tooltip_COU_event_rin_4:0 "§g\"Chief Administrative Officer.\"§!"
 COU_event_rin.5.t:0 "Warning"
 COU_event_rin.5.desc:0 "Ayumu and Momoka instinctively avoided the scene. If it were the usual Ayumu she would have stopped Momoka who was trying to run away, but Ayumu who looked into Rin's eyes couldn't say so. When the clicking sound of two pairs of boots left the scene, Aoi sat down after pulling a chair on the opposite side of Rin.\n\n\"Since when did the General Administration Office administrator begin to infringe even on the Defense Office's authority?\"\n\"Aoi, this is...\"\n\"Explanations are enough. I also confirmed this information.\"\n\n\"But, administrator.\"\n\"After the revelation of the GSC President's disappearance, suddenly trying to take some action as if you're 'pretending'...\"\n\n\"The Finance Office and Defense Office won't see it favorably. Do you know?\"\n\"This is seen only as a smokescreen trying to cover it up by bringing in a bigger incident as soon as your opposition started activities.\"\n\"Furthermore, you are not the GSC President, Chief Administrative Officer. Just because you wear the acting armband doesn't mean you become that person.\"\n\nRin put back on the glasses she had taken off. The two women looked at each other. Neither of them seemed to have any thought of backing down.\n\n\"No matter how much you're 'acting', this has crossed the line of being acceptable. I can't even defend this. The administrators of the Defense Office and Finance Office will use this as prey and bite and tear it apart...\"\n\"... And chew and swallow it up.\"\n\nNext, Aoi probably said this. That she's an admirable person whom even she admits but her position is a succession of power due to administrative procedure. So face herself who is in the acting position and cannot become a superhuman. But she didn't say so."
 COU_event_rin.5.a:0 "Rin was smiling toward her."
 COU_tooltip_COU_event_rin_5:0 "§gAoi hurriedly left the scene while being appalled at herself for almost being momentarily agitated. Rin was looking at the door Aoi had closed and left.\n\n\"At least you'll have to prepare enough to be able to persuade me, is that it. If so, there's nothing to worry about, Aoi.\"§!"
 COU_event_rin.6.t:0 "Shock and Horror"
 COU_event_rin.6.desc:0 "\"As a result of verification by our Tea Party, that official document was not from the GSC at all...\"\n\"It's Hanuma Makoto of Gehenna. I've never received such a thing...\"\n\"At Seminar, such a position is not at all...\"\n\nA conference room swept with silence. Executives with trembling hands opened all letters with knives to verify. They had urged all academies to help them against Nanagami Rin's tyranny, but what came back was the sound that such a thing was never fucking there.\n\n\"What on earth happened? You've never received it? Th-then, what about the address we did before? What on earth happened?\"\n\"As a result of verification at Red Winter, they also said they had never received such an official document!\"\n\"As a result of an inquiry to Kronos, it's said that people sent from the General Administration Office stopped it just before transmission. This, what...\"\n\nKaya, who had planned to check on Rin's defeat while sipping fragrant Blue Mountain coffee, couldn't hide her fluster. She momentarily dropped her coffee cup. It didn't fall on the table and break, but coffee was scattered on the tablecloth. Next to such a Kaya, an executive shouted with a voice full of anger."
 COU_event_rin.6.a:0 "\"What the hell is this, fuck!\""
 COU_tooltip_COU_event_rin_6:0 "§g\"What on earth is she thinking, Chief Administrative Officer...\" Kaya stood up from her seat. She went back to her office with quick steps.§!"
 
 
 
 
 
 
 
 ##Aoi-Momoka  
 
 
 
 
 
 
 ##Ambiguous 
 COU_event.8.t:0 "League of Nations Observation Committee"
 COU_event.8.desc:0 "Among the shining buildings of D.U., delegates dispatched by the General Assembly carefully moved their steps. The League of Nations Observation Committee, mainly comprised of Americans and Mexicans who were not affected by the Great Transfer, were characterized by wearing armbands indicating special authority issued by the GSC. The contact with the other world, which they thought would be absolutely impossible, happened in an unexpected way. The Administrative Committee reached out to them first. It was unexpected, but since the justification for 'monitoring' them was sufficient, the item to form an observation committee passed unanimously. Of course the governments in exile and European nations didn't find it pleasant, but they voted in favor under a wordless sense of duty that they should find out something anyway.\n\n\"Ah, welcome to the Utnapishtim District, everyone!\"\n\nAn administrator dispatched by the Administrative Committee welcomed them warmly. The observation committee was currently taken aback by seeing the high-rise glass buildings of D.U., the beastmen scattered everywhere, and streets with only female students. Although they had heard such stories from exiles, it was a shock to witness it as a fact.\n\n\"Is the name of this place the Utnapishtim District? The Utnapishtim I know is the ancient king of Shuruppak, is there a connection with that...\"\n\"Yes? Shuru... eh?\"\n\"Ah, no, it seems it's just a coincidence...\"\n\"But to be a coincidence, all these people speak languages we can somewhat understand. It's a very diverse mix of languages though.\"\n\"Hmm, no matter where they came from, it's certain it must be a parallel world's Earth. Otherwise...\"\n\nScholars among the delegates laid out their respective opinions regardless of nationality. The translators had to speak to the point of being out of breath, and the administrator just looked at them awkwardly."
 COU_event.8.a:0 "\"Everyone... you should be going soon...\""
 COU_tooltip_event_7:0 "§gThe League of Nations Observation Committee will stay here for 2 years. Of course they can't steal our technology. Just sightseeing what the daily life of Kivotos is like will be all.§!"
 COU_event.9.t:0 "Restored Authority of the Student Council"
 COU_event.9.desc:0 "The administrative confusion that lasted for a year after the Great Transfer has now subsided to some extent. Each academy has proven that it can maintain a state no different from before the Great Transfer without our control through its own military and security maintenance, and the GSC had time to reorganize into the form of a state. While it might have been momentarily forgotten when the administrative confusion continued, the Student Council's authority and influence began to exert influence again as the Student Council regained its state. Of course, it's much weaker than before the Great Transfer.\n\nNevertheless, this can be called a piece of luck for the Student Council after the Great Transfer. It's proven to the students of Kivotos that the Student Council is intact, and now all that's left for us is to do our best to exert influence in Kivotos again and regain control."
 COU_event.9.a:0 "Hurrah!"
 COU_event.11.t:0 "Last Wreath-laying"
 COU_event.11.desc:0 "\"Miyako, it's already been an hour. Let's go soon.\"\n\"Yes, I'll be there soon.\"\n\nMiyako carefully placed a small red tulip. This was her fifth visit. At first she couldn't properly look at anything because of a shy heart, but she gradually became used to it as time passed. A place where the scent of old Amsterdam where the waves crash remained, the fishy smell of the sea tickled Miyako's nose. The stone engraved with the coat of arms of the House of Orange-Nassau silently received that flower.\n\n\"This will probably be my last visit. I'll come later if possible... but there's not much time left, ahaha.\"\nAn awkward laugh, Miyako laughed as if conscious of Saki who was looking at her worriedly next to her.\n\nThe incident of that day might have been an inevitable necessity that would have happened by someone even if it wasn't them. Now they finally decided to bury the deceased in their hearts. Now she could understand. It was something that couldn't be helped. She decided to bid her last farewell to the point that the best she could do for the deceased was not to forget them.\n\n\"I'd like to meet you once someday. You seemed like good people.\"\n\nMiyako, who was muttering something shortly to herself, moved her steps at Moe's urging heard soon after. Saki and Miyu, who were guarding her side, also followed Miyako after giving their respective last farewells."
 COU_event.11.a:0 "May the deceased rest in peace." 
 COU_event.12.t:0 "Animals Return to the Zoo Movement"
 COU_event.12.desc:0 "In Kivotos, many species lived together. In Kivotos, it wasn't an awkward thing for a sparrow beastman to run a restaurant and a dog beastman to be a policeman. But the new world met after the Great Transfer had not learned such concepts, and it soon became a social issue. The beastmen discrimination movement derived from here, the 'Animals Return to the Zoo Movement', is spreading like a fashion centered on local self-employed people who have begun to be threatened by new competitors.\n\nEspecially recently, the Sparrows' Diner franchise opened new branches in Leuven and Dunkirk, and existing local self-employed people damaged the beastmen with various violent means such as iron clubs. After this incident, the beastmen self-employed people urged the Administrative Committee for countermeasures, saying they are afraid to open new stores in the south and cannot do so.\n\nCollaborators temporarily suppressed such shameful behavior using security forces, but the matter is a hot topic even within the collaborators to the point that Degrelle prohibited mentioning beastmen."
 COU_event.12.a:0 "Is it unavoidable?"
 COU_event.13.t:0 "Labor Department Payment Issue"
 COU_event.13.desc:0 "The labor department members who were hired and mobilized on a large scale by the Administrative Committee during the post-war recovery process after the Great Transfer played a revolutionary role in rebuilding D.U. which was destroyed by the Air Battle of Amsterdam, although they couldn't solve the flooding problem due to realistic conditions. And today, exactly one year later, there was an incident where some among the hired labor department members who hadn't received payments, and a labor foreman representing them, visited the Administrative Committee and caused a disturbance demanding the Administrative Committee compensate 250 million Yen in unpaid amounts. The Finance Office executive seems to have put in quite an effort to send back the angry labor foreman.\n\nThe Finance Office clarified that it had hired about 10,000 labor department members for D.U. recovery and at the same time maintained the claim that payment to them had already been completed as of December 27, 1935, and that they are committing fraud to get money that isn't there.\n\nAn item to pay them was proposed, but the Administrative Committee saw a consensus on ignoring the demand. If we don't pay them, it's certain that there will be a hitch in hiring labor department members, even if temporarily, but if we do pay, an unexpected damage from austerity will strike."
 COU_event.13.a:0 "You shouldn't ask for money that isn't there."
 COU_event.13.b:0 "Let's not leave any future trouble."
 COU_event.14.t:0 "FOX Squad Public Trial"
 COU_event.14.desc:0 "Since the Great Transfer, the SRT squads have been undergoing trial since December 1935 on charges of massacring the Dutch royal family. In this public trial composed of three local judges and two Kivotos judges, the GSC hoped for their innocence, the monarchists hoped for their unconditional death sentence, and others just hoped this annoying trial would end and stop taking up space in the news section. However, this complex trial in many ways was finished in a hurry as if conscious of the angry current of public opinion because it had been proceeding past the New Year. The FOX Squad members, who had been held under arrest investigation, appeared in court for the last time and testified that this massacre was entirely led by them and that their juniors, the RABBIT Squad, were not at all at fault.\n\nA German prosecutor with sharp eyes accused them of mercy being another justification for massacre, citing the tragic example of the neighboring country Luxembourg as another example, and the public defenders appointed because no one wanted to take the defense just sat silently and only kept their seats. The result was as if it had been decided.\n\nThe result was a life imprisonment sentence for all FOX Squad members. However, the court wisely adjusted so that the Administrative Committee can invalidate the sentence whenever it unanimously agrees to a special pardon for them, leading to a wonderful compromise between the tensions of both sides, although it's a somewhat disappointing result."
 COU_event.14.a:0 "Not a total loss."
 COU_event.15.t:0 "Lily Flower"
 COU_event.15.desc:0 "It was when Lucien Lippert visited the Administrative Committee. He, who deeply pulled down his military cap which had the GSC logo repaired, trembled at the unknown creepiness whenever he passed the Administrative Committee which had only girls. He thought that cooperating with Kivotos, an otherworld existence, was the best way and his mind won't change, but still this was not getting familiar at all.\n\nWhen Lippert passed the hallway with mud-stained military boots, gazes that looked at him with contempt brushed past him. Well, would these girls who have only done imitating politicians know what a harsh military life is, it was unpleasant.\n\nFeeling fatigued, he decided to take a short rest in a nearby duty room. Lippert took out a small notebook from the breast of his leather jacket. It was a vocabulary book with Japanese words written on it. If he reported in clumsy Japanese again this time, he'd experience the humiliation of being chewed out by girls younger than him again. He slowly opened the door of the duty room.\n\n... And there two young-looking administrators were having a deep kiss. They didn't care whether he opened the door or not and continued that act. Lippert gave a sigh at the farce unfolding before him and closed the door. His head throbbed so he took off his hat. Kivotos, it was originally such a place.\n\n\"Well, do as you please, young ladies...\" He muttered to himself while opening the door of another duty room nearby. Lippert thought while memorizing words if that was the youth of Kivotos."
 COU_event.15.a:0 "\"Nani ga komento wa... haah.\""
 COU_event.16.t:0 "Sora's Graduation!"
 COU_event.16.desc:0 "Today is the day Sora, the middle school part-timer at Angel 24 near the Sanctum Tower who was loved by both students and locals, graduates from middle school! Because she was Sora who received much love with an exceptionally cute appearance, Sora's graduation was a big issue to the extent that local newspapers even covered it. Sora, who smiled brightly holding a red tulip bouquet, finished a wonderful day with the escort of reliable collaborators specially chosen by Degrelle.\n\nHowever, because the high schools she was scheduled to go to had their existing admission systems completely broken after the Great Transfer and their systems changed due to the expansion of autonomy, Sora became able to choose a new high school she will go to.\n\nSince Sora is a famous person, even if there's a lot of interest focused on her, it's right to leave the school she'll go to her own discretion, but several 'suggestions' from many housewives worried about her could be conveyed."
 COU_event.16.a:0 "Knowledge is power, Millennium is good."
 COU_event_16_tooltip1:0 "§gM-Millennium...? I'm not that smart though... umm... well... it doesn't look bad.§!"
 COU_event.16.b:0 "You should know how to protect yourself. How about Gehenna?"
 COU_event_16_tooltip2:0 "§gBefore, a person who said the convenience store lunch box was tasteless and tried to blow it up was also from Gehenna... I shouldn't generalize.§!"
 COU_event.16.c:0 "Lofty Trinity would be most suitable for Sora."
 COU_event_16_tooltip3:0 "§gWould it be okay for me to go to such a lady's school? Ugh, I'm a bit worried. What if there's too much to learn...§!"
 COU_event.16.e:0 "Where Sora wants to go is the best."
 COU_event_16_tooltip4:0 "§gThis school is good and that school is good, where would be best to go? It's a worry... ihihi.§!"
 COU_event.17.t:0 "Farewell Ceremony"
 COU_event.17.desc:0 "Three months have passed since Sora's graduation, which means Sora now has to leave D.U. and head for a new school. At Sora's own request, only the Angel 24 manager and her friends saw Sora off at the station. Sora, who pulled a rattling carrier and boarded the train, smiled at the sobbing Angel 24 manager and gave her last goodbye.\n\nSoon the red light stick of a station employee with the Highlander logo was waved, and the train ran into the night. Sora, after a short greeting with a student boarded in the same seat, looked outside leaning on the cold window frame. The clanking train sound and the windmills and tulip fields outside saw her off."
 COU_event.17.a:0 "Goodbye, Sora!"
 COU_event.18.t:0 "New Student from D.U."
 COU_event.18.desc:0 "An unusual student from a distant place has arrived after the Great Transfer! Sora, a middle schooler who arrived from D.U., shyly approached the person in charge and submitted documents, and because a student coming from such a distant place recently is unusual, she received particularly large interest. Furthermore, that cute appearance was enough to monopolize the interest of seniors, and she seems to have had a hard day swept by seniors who said they'd guide her through the school as soon as she arrived.\n\nShe was temporarily placed first in a new dormitory room, and Sora will now permeate into our daily life as a student of our academy."
 COU_event.18.a:0 "Welcome!"
 COU_event.19.t:0 "Security Personnel"
 COU_event.19.desc:0 "\"Hey! Those bastards are going out to the intersection! Go quickly and stop them!\"\n\"Fucking Gehenna bastards, stop right there!\"\n\nGehenna students on motorcycles and sturdy men making military boot sounds ran through the city. Students were terrified and fell, and beastmen were sometimes bumped into and knocked over by large bodies. The men wearing collaborator armbands were worried about what to report to the Administrative Committee whenever someone fell. But the bigger problem was that because the damn new neighbor was Gehenna, they were suffering unwanted hardships. The men occasionally wondered how other academies handle these fucking Gehenna students.\n\n\"There, over there! Those bitches ran that way!\"\n\"That's a residential area! I hope those crazy terrorist bastards don't go shooting guns!\"\n\nThe men ran with all their might. They were tired of physical strength but they ran anyway. After running for tens of minutes and chasing them, the Gehenna students wearing helmets crossed the 'border' near the residential area as if mocking them and ran away. The GSC had to guarantee the autonomy of other academies according to the executive order issued at the time of the Great Transfer, and they couldn't cross the newly drawn 'border'. Among them who were out of breath, several threw their equipment unable to overcome anger.\n\n\"Haah, haah... damn it, these fucking bitches...\"\n\"We're even taking over all the work those Valkyrie bitches used to do, haah. Ah, by the way. Someone fell earlier, what about that?\"\n\"Good grief fuck, do you think I'd know, I'll just have to pray Degrelle speaks well...\""
 COU_event.19.a:0 "\"... I wish they'd let us use motorcycles too.\""
 COU_event_19_tooltip:0 "§g\"But thinking about it, why can't we use motorcycles?\"\n\"Why can't you, the Administrative Committee said what if someone gets hit?\"\n\"Sigh, fuck...\"§!"
 
 ##Awarded to other countries 
 COU_event_diplomancy.1.t:0 "GSC's Request for Currency Unification"
 COU_event_diplomancy.1.desc:0 "At a quiet 5 AM, a bell sound that woke up the morning unusually early was heard in the Problem Solver office. A small letter that came through the door had the blue GSC logo deeply pressed. Who received that letter? Mutsuki? Haruka? Probably the person who received it even forgot it due to sleepiness. But anyway the letter contained the following contents:\n\n\"To the Regent of the Grand Duchy of Luxembourg,\n\nThe GSC Finance Office implemented currency unification measures of the Belgian Franc and Dutch Guilder into the Kivotos Yen last week, and accordingly for the preservation of the value of the old Belgian Franc, we request the unification of the Belgian Franc and Luxembourg Franc circulating in Luxembourg by exchanging them into Kivotos Yen at a 1.5:1 ratio. This is an executive order for the joint benefit of both sides...\"\n\nHowever, even if we want to follow this, unilateral currency unification like the GSC is impossible in order to prevent economic shocks that will be triggered in Luxembourg, but not replying seems like it will damage Luxembourg's diplomatic benefits in the future. What decision should be made?"
 COU_event_diplomancy.1.a:0 "Sorry but let's refuse."
 COU_tooltip_COU_event_diplomancy_1:0 "§gInstead, Problem Solver leaked a few words to the newspaper: 'The Luxembourg government did not yield to GSC pressure!' Boss Aru will appear very coolly in the newspaper.§!"
 COU_event_diplomancy.1.b:0 "Let's exchange only a set amount!"
 COU_tooltip_COU_event_diplomancy_2:0 "§gBut this won't satisfy the Finance Office nor the local newspaper. Perhaps the Boss will look weak?§!"
 COU_event_diplomancy.2.t:0 "An Opportunity has Come"
 COU_event_diplomancy.2.desc:0 "An opportunity has come to us. Now that more than a month has passed since the GSC President's disappearance, the Acting President had to confess with her own mouth that she is not a legitimate leader, and if so, the GSC's legitimacy can be sufficiently inherited by our Schale, an organization the GSC President 'directly' created, and in fact after the end of the Lowland War some of the GSC military that followed the GSC President voluntarily petitioned to serve us.\n\nThis is an opportunity that must never be missed. It's time to train the military and through an unexpected surprise attack reclaim the GSC President's legitimacy and the Sanctum Tower and make the baseless oppressors kneel!"
 COU_event_diplomancy.2.a:0 "It has to be now!"
 COU_event_diplomancy.3.t:0 "Ultimatum Sent"
 COU_event_diplomancy.3.desc:0 "Today, about a month later, tension in the lowlands reached its peak. It's because Arona didn't wait any longer and sent an ultimatum to the GSC demanding unilateral and unconditional integration. Whether it was too early or not, now the road of no return has been crossed. The incredibly arrogant GSC immediately rejected our demand and this is no different from demanding an all-out war with us."
 COU_event_diplomancy.3.a:0 "It can't be helped."
 COU_event_diplomancy.4.t:0 "Break from the Student Council"
 COU_event_diplomancy.4.desc:0 "As the political situation within the GSC fluctuated, legitimacy controversy grew, and students fell into confusion, the Valkyrie high command decided to sever all connections that were barely maintained with the GSC as of today. Since Valkyrie's cooperation with the GSC gradually broke off as Valkyrie obtained its own new academy territory after the Great Transfer, it's not a surprising thing, but there are some voices worrying about the security vacuum in the capital.\n\nBut since they've already been managing security partially by mobilizing collaborators, our vacuum won't be felt. The important thing is, we must decide Valkyrie's fate which has only been swung around."
 COU_event_diplomancy.4.a:0 "Valkyrie stands alone."
 COU_event_diplomancy.5.t:0 "Valkyrie's Severance of Cooperation"
 COU_event_diplomancy.5.desc:0 "The matter just reported from Valkyrie Police Academy was news that the Valkyrie high command will stop all cooperation with us and withdraw from the GSC. Their claim is that they had no choice because Valkyrie students were in confusion as Schale questioned our legitimacy, but the Administrative Committee judged that it's just a planned escape. However, in a situation where our very existence is threatened, there's no room to care about them, so unfortunately Valkyrie will be free until we regain control later."
 COU_event_diplomancy.5.a:0 "Let them do as they please."
 COU_event_diplomancy.6.t:0 "Proposal from the Student Council"
 COU_event_diplomancy.6.desc:0 "Today, Shiranui Kaya of the GSC personally appeared at the Corporation headquarters and requested a private meeting with the President. Our loyal PMC Director shouted at Kaya for not paying respects to the President, but soon the President who appeared gracefully calmed the Director and guided Kaya to the reception room.\n\nKaya didn't talk around annoyingly like the girls of other academies, nor did she demand ignorant unilateral concessions. She simply proposed a way to take mutual benefits through cooperation between our corporation and the GSC. Kaya promised priority for Kaiser companies if an alliance is formed.\n\nHowever, the General, who was listening to this next to him, claims there's no need to waste the corporation's power by intervening in Europe. But what's certain is that an alliance with the GSC will certainly be a benefit. Provided the loss is not bigger than this."
 COU_event_diplomancy.6.a:0 "\"I will personally accept, GSC President.\""
 COU_event_diplomancy.6.b:0 "\"I will come back after undergoing discussion at the board of directors.\""
 COU_event_diplomancy.7.t:0 "Alliance Formed"
 COU_event_diplomancy.7.desc:0 "Kaya returned to the office in a quite satisfied mood. The sightseeing she enjoyed in London after the dramatic alliance agreement was fun. It was also a rest after a long time. Holding the Big Ben model bought in London, she shook it here and there. Now there was no worry about the sea. The steel lumps of the British Isles became her side. Kaya celebrated this as true adult diplomacy and an excellent head of state.\n\nThe alliance with Kaiser, in addition to the effect of gaining the GSC's strategic alliance, had one more very important effect. Kaya's mood became better."
 COU_event_diplomancy.7.a:0 "\"... Fufu.\""
 COU_event_diplomancy.8.t:0 "The Worst Proposal"
 COU_event_diplomancy.8.desc:0 "An angry footsteps echoed in the hallway as if pressing down the marble. Kaya didn't think to come out for more than two days after visiting London. Just occasionally sounds of objects breaking were heard from the office and there was no other movement. Administrators gathered in small groups and debated what state Kaya would be in. One administrator from the Settlement Office said she heard that Kaya saw propaganda slandering her in London and returned in a huff. But other administrators shook their heads and said it didn't seem so.\n\nMeanwhile, Kaya had become sensitive. Although she's thinking that an alliance with those machine lumps wasn't needed from the start, isn't it disrespectful to say they'll hand it over to the board and think about it right to her face?\n\nHer mood wasn't good. Kaya picked up the Blue Mountain coffee cup that had been placed in the corner and drank it. The fragrant aroma was the same but for some reason it tasted very bitter as if it were ground wrong."
 COU_event_diplomancy.8.a:0 "\"Truly, nothing is working out.\""
 
 
 
 ##Industry 
 COU_event_industry.1.t:0 "Meeting with Businessmen"
 COU_event_industry.1.desc:0 "Oki Aoi opened the door holding several coffee cups. It was a meeting with personnel from prominent military corporations like FN Herstal, Renard, and Philips. Aoi placed the coffee tray on the table. The personnel with very shrunken faces maintained an awkward silence. Because coffee overflowed and soaked Aoi's gloves, Aoi left her seat for a moment to change her gloves. Coffee flowed like tears from the gloves. Aoi didn't mind and wiped her hands on a towel. Soon Aoi also sat down. \"Good afternoon. Have you thought about the proposal I gave?\" Nevertheless silence continued. Aoi felt a bit of irritation at these people who said nothing. The one who broke the silence was Dieudonné Saive of Herstal.\n\n\"Is it truly... correct that you recognize our interests? You won't hand over companies to labor unions, there is not a single restructuring, and all we have to do is cooperate with the GSC?\" Only then did Aoi smile and open her mouth. \"Of course. The GSC recognizes the management rights of corporations. Provided you cooperate with the GSC.\" Aoi unfolded the reports she had placed next to her.\n\n\"These are the recent management details of Philips. It has been in a deficit state since the establishment of the Dutch government in exile and currently it is 230 million Yen.\" Anton Philips looked uncomfortable. Not to mention that their deficit state was exposed as it is, it was even bigger that he wasn't used to expressing the deficit in Yen and not Guilders. Probably Philips was calculating how many Guilders \"230 million Yen\" would be. Anyway Aoi continued. \"The Finance Office can bail out such companies. We can lend 300 million Yen per company. For free.\"\n\nAs soon as Aoi's short words finished, the assistants who were waiting near the management seemed agitated. Anton Philips asked if that was really a fact. Actually the GSC would be a bit tight for such big expenditures after the Great Transfer, but Aoi was after persuading Rin that it wouldn't matter much. Aoi replied that it was so."
 COU_event_industry.1.a:0 "And the management signed the documents Aoi held out."
 COU_event_industry.2.t:0 "Amsterdam Declaration"
 COU_event_industry.2.desc:0 "The flashy large camera of Kronos School illuminated the delegation. This declaration will uniquely not be transmitted on Kivotos broadcasts. It was scheduled to be transmitted that evening through them when the Kronos School sends the live recording to the broadcasting stations in Flanders and Northern France. The live broadcast was conducted like a short discussion.\n\nCamille Huysmans of the Flanders Committee, a non-official organization, and Roger Salengro of the Northern France Committee were on the left, and Aoi wearing a neat suit, an unusual outfit, was on the right. It was conducted in a way where Huysmans shared stories about the GSC's development promises several times and Salengro agreed.\n\n\"Yes, um, I and the Flanders Committee have been raising objections to the Administrative Committee's policies biased toward the Netherlands for a long time, and I'm very happy that modernization and development for Flanders are finally promised, right, Mr. Salengro?\"\n\"Ah, yes, that's right. Lille was left defenseless as the French army retreated after the Great Transfer, but to think that the Administrative Committee will finally pay attention, I'm very happy.\"\n\nAoi was a bit displeased while listening. She thought with what thoughts these humans were spitting out such words. If she herself were them, she would have tried to get more benefits while praising the Administrative Committee as much as possible. Still, she thought they'd be like that because they've had a grudge for a long time, and overlooked it. Aoi smiled and held out the documents signed in her own name on the clipboard. Their committees will all be disbanded as of today and follow the Administrative Committee's orders, but the Administrative Committee will bear the 'mandatory' duty to develop that province.\n\nThere was nothing bad for them or for the Administrative Committee."
 COU_event_industry.2.a:0 "\"Well, has everyone signed?\"" 
 COU_event_industry_2_tooltip:0 "§gA photo was taken with a flashing sound. Salengro tightly closed his eyes due to the sudden flash. Salengro, who returned home, laughed at the sight of himself with closed eyes in the next morning's newspaper. His wife probably gave him all sorts of scolding asking if he took it with his eyes closed. Thinking about that he suddenly thought of his wife. Still it was okay. Now a better life would be waiting for the French people.§!"
 COU_event_industry.3.t:0 "Unrest in the South"
 COU_event_industry.3.desc:0 "The currency unification implemented by the Finance Office was implemented as part of a large-scale economic reform measure to exchange Dutch Guilders and Belgian Francs at a 1.5:1 ratio into Kivotos Yen, but while evaluation that it was okay was dominant in the Netherlands where the Kivotos population accounts for the majority, it was not so in Northern France and Flanders. Mayors of some cities in Flanders defined currency exchange as economic aggression and violated the agreement with the Administrative Committee; especially the backlash from port cities was the fiercest. Dunkirk protested to respect the French nation and the Franc.\n\nThe Finance Office had to calm them down by quickly weakening or withdrawing some measures."
 COU_event_industry.3.a:0 "Good grief."
 
 
 ##Military
 COU_event_military.1.t:0 "Dissolution of the Free Officers"
 COU_event_military.1.desc:0 "With the brilliant result of the Administrative Committee mobilizing collaborators, news has been confirmed through a reliable source that the Free Officers, who had set up secret shelters everywhere and tormented us, were finally dissolved today.\n\nAs clear evidence for that, several officers from the Free Officers surrendered to the Valkyrie Public Security Bureau today, and these will be taken over by collaborators and their spirits will be reformed to serve us after undergoing a bit of 're-education' procedure."
 COU_event_military.1.a:0 "Good."
 COU_tooltip_unlock_dutch_belgium_generals:0 "£decision_icon_small §YDecision Unlocked§! : Re-education of the Free Officers"
 COU_event_military.2.t:0 "Count Charles of Flanders, Count of Flanders."
 COU_event_military.2.desc:0 "Count Charles of Flanders had been spending leisurely days lately. His brother Leopold III had fled to Congo to set up a government in exile, and he did not board that ship despite his brother's earnest request. Because Belgians also didn't board that ship. If he also fled to Congo, it was certain he'd boast absurd support even if the royal family returned. He didn't go even for the sake of the Belgian royal family, his brother, and the Belgians.\n\nAnyway he was living a life that wasn't bad. This is because whereas the media were busy criticizing his brother who fled like having a meal, they praised him and were talking while semi-officially confirming him as the 'next King'. And a life of herding a flock of sheep while reading a newspaper and drinking coffee in a quiet country village of Flanders was also quite not bad. He was living a life that was not only not bad but also satisfying—until a short while ago.\n\nIt was a story when a vehicle with the GSC mark intruded into the sheep ranch. At that time the administrator seemed to have come to find some royal family member. However, concluding that she did indeed hit Charles' sheep, the administrator apologized several times and asked for his name. He thought for a few times and replied he was Charles. The administrator looked back and forth between the name in the documents and him and seemed to have exchanged a few radios. Charles instinctively felt anxiety. What is it? Was there some order to arrest me? However, such worry of his was soon solved within the administrator's vehicle. The GSC said they wanted to appoint Charles to something like the Governor of Flanders. To a result distant from Charles' worry, Charles felt relief. If he refused here he could have returned to the quiet life of herding a flock of sheep, but Charles felt he had rested enough.\n\nHe had rested a lot, so now it was time to step forward for the Belgians again. To the administrator waiting for an answer, Charles replied."
 COU_event_military.2.a:0 "\"Yes, of course. I will do so.\""
 COU_event_military.3.t:0 "Heilcurcken Pardon"
 COU_event_military.3.desc:0 "Degrelle revealed himself at a private prison managed by the Defense Office in the outskirts of Flanders. On the chest of his jacket was pinned a blue GSC pin badge. He stood in front of the door of cell 27. It was the place where Cornelis van Geelkerken was. Geelkerken was sitting with his legs crossed and reading a book. When Degrelle stared at him, he closed the book and looked at Degrelle as if piercing him.\n\n\"What is your plot? Are you thinking of even killing me?\"\n\"Oh dear, your words are harsh toward someone you're seeing for the first time.\"\n\nDegrelle countered. Whatever happened, Geelkerken had no intention of doing what he'd like—provided they gave him freedom, the story would be different again. And as if he expected his thoughts, Degrelle opened his mouth first.\n\n\"Mr. Geelkerken, do you think it's unfair.\"\n\"No, I've devoted my whole life to loyalty for the motherland. It's not unfair. I just want to get out of this prison a bit.\"\n\"There's no need to talk around. The NSM that would be enraged after hearing your words is already gone. Ah, Mussert is gone too.\"\n\"Did you come only to get on my nerves.\"\n\"Haha, it's similar. The weather is so nice today that I was going to say I definitely want to show it to you. I don't know if you, who 'might' rot in prison for a lifetime, can see it.\"\n\"Wait, what does that mean, you, surely...\"\n\"Yes, you know well. I'll make a deal with you. Become a collaborator, then you're free. And, well, do as you please after that. Just like me. Think about what is the priority. Do you still think it's not unfair?\"\n\nGeelkerken was about to counter something but instead plopped down in his seat. Degrelle replied while throwing a key into the bars."
 COU_event_military.3.a:0 "\"Well, see you later.\""
 COU_tooltip_heilcurcken_ours:0 "§gAt the same time as the clicking sound, the tightly closed iron door opened. Geelkerken pulled himself together.§!"
 COU_event_military.4.t:0 "FOX Squad Pardon"
 COU_event_military.4.desc:0 "Late in the evening in the Shiratori district, an executive order was delivered to the prison directly under the Administrative Committee. The FOX Squad members were each spending boring days in solitary cells (originally all 4 were scheduled to be imprisoned together in a wide room, but the local jailers somehow caught slips and sent them to solitary). What was allowed for them were French and Dutch study books, tactical manuals, and letters sent by the RABBIT Squad, and that was all. However, there was no case where any of them complained. Because it was the last decision made to protect the juniors.\n\nAt that time, the jailers approached and suddenly opened the doors of the solitary cells. Toward them who were staring blankly at them, a certain jailer twitched his mouth and said. \"It's an executive order. You're free now.\"\n\nTwo jailers accompanied them and saw them off to the end. Reporters flocked outside to meet them. Among them were the juniors of the RABBIT Squad. As if promised between each other, Yukino and Miyako shook hands. Although they weren't close yet, still the special relationship and bond of seniors and juniors was not easily broken. To the microphones thrust by reporters, Yukino slowly opened her mouth."
 COU_event_military.4.a:0 "\"Good evening!\""
 COU_event_military.5.t:0 "SRT Local Squad"
 COU_event_military.5.desc:0 "\"Whole squad, attention! Salute to the Platoon Leader!\"\n\"Loyalty!\"\n\nMen wearing epaulettes with the SRT logo clearly engraved paraded on the academy grounds. it was early morning. At their noisy parade sound, starting with Saki, the members of the RABBIT Squad woke up. By order of the higher-ups, the Lion Squad and RABBIT Squad came to have a time of exchange learning each other's culture and tactics by living together, and for the RABBIT Squad who saw a rigid military culture for the first time, it was quite a baffling thing.\n\nThe Lion Squad created this time was a local squad mainly comprised of Belgian and French prisoners of war, and they moved as if showing off the military culture they had learned. Furthermore, it was also a characteristic that they unified their will while overcoming each difference despite being assigned to a new squad.\n\n\"Why are they like that from early morning, noisily...\"\n\"According to the manual, waking up early in the morning isn't bad either, Moe. Still, 4 AM is a bit early though...\"\n\"Did those people keep living like that, ugh...\"\n\"Let's wake up soon too, yeah.\"\n\nThe RABBIT Squad, gathered on the grounds as if grumbling, greeted the Lion Squad. They received a stiff but soft response. That day was the day to pass on Kivotos-style tactical training. There was Saki's opinion that it was inappropriate because the beastmen and Kivotos students are different from the biological structure, but in Miyako's words that there's no big problem because it's learning what kind of tactical thinking Kivotos students have and act, the joint training proceeded."
 COU_event_military.5.a:0 "There were minor problems but no big ones."
 COU_tooltip_event_military_5:0 "§gThere was a minor problem where the Lion Squad members couldn't help being appalled upon seeing Kivotos-style tactics where occasionally even snipers rush to the front line and fire.§!"
 COU_event_military.6.t:0 "Defense Force Status Report"
 COU_event_military.6.desc:0 "\"Ah, is the screen coming out well?\"\n\"First, since [COU.GetLeader] said she's currently away, I'm recording and sending this. I just have to talk about the state of the Defense Force, right?\"\n\"Umm, I don't know well how I should say it, but it's better than before. We've overhauled the training system, and as much as the salary went down, some budget was left over so we bought a few new military equipment with it. That's good, but fundamentally there is dissatisfaction first. Still, I think this much will be solved as time passes. Inwardly they also seem to know it was excessive treatment.\"\n\n\"... And the students of the Halo Infantry divisions also seem to have become used to this life after being reorganized. Well, you know. Although vocational education is gone... they do as they used to, parade, run a few laps around the grounds, do some push-ups.\"\n\"And the local collaborators also seem to have roughly become used to our command system. Not much has changed on that side anyway. Actually, rather than the locals, our Athletics Office kids are dissatisfied because athletic activities have disappeared, umm... I'm going to try hosting a small, permanent sports meet within the barracks. Then everyone will be energetic and good. I hope you review it positively.\"\n\n\"Anyway, that's about it for the report. I think the foundation to reform the Defense Force is ready with this much.\"\n\n(Noise) \"Director Haine, all the rice balls are made here! Come and have one!\"\n\n\"Got it, I'll be right there! First, I think I have to go. I'll cut off. I'll visit D.U. next time and report more in detail in writing. Bye!\""
 COU_event_military.6.a:0 "It's a bearable shock."
 COU_event_military.7.t:0 "Long-Distance Training Report"
 COU_event_military.7.desc:0 "To the Defense Office, Deputy Defense Director.\n\nLast month, after receiving the order, we 차출 the some ships of the heavy cruiser squadron and conducted maneuvering and firing training in the English Channel and North Sea respectively. Despite being an unusual long-distance voyage, because they were ships maintained with Kivotos technology, there were no problems during operation, but whether it was an absence regarding Kivotos military power's naval experience or whatever, this automatic navigation device, its state is a bit strange. And because the automatic fuel management system was broken, efficient fuel management was impossible... (Omitted)\n\n... Nevertheless the system showed truly brilliant performance and if only these minor technical problems are improved, our newly maintained ships seem to be able to voyage about 10% further. Wishing for a quick resolution.\n\n- Conrad Helfrich."
 COU_event_military.7.a:0 "Well, if it's a technology problem, it'll be fixed soon."

 
 
 
 #Characters 
 ##BA 
 COU_XXX_override_instant:0 "§YGSC President§!"
 COU_XXX_override_delayed:0 "Although she underwent various ups and downs after the Great Transfer, the §YGSC President§! will §Gnever§! give up on Kivotos, fitting for her position and authority!\n...\n\n§RBut, when will the GSC President come out of the office?§!"
 #COU_XXX:0 "GSC President"
 #COU_XXX_desc:0 "The GSC President, who stood above any others, managed everything in Kivotos. From disputes between academies to trivial quarrels, she managed and controlled everything, and mediated as well as adjusted. However, when even such a GSC President came to be transferred to this place where she had never heard of and didn't even know if it actually existed, she came to shoulder everything. Although she never wanted it, the GSC President who is the leader of everyone decided to willingly shoulder everything because she had to be so. And in such hardships, until the GSC President can no longer endure, she will want to work for Kivotos until the end as much as she can."
 COU_null:0 "Kivotos Emergency Response Committee"
 COU_null_desc:0 "Since the GSC President suddenly disappeared, the GSC is trapped in immense confusion. The Kivotos GSC cannot currently perform any activities and this means it cannot deal with the abnormal situation of Kivotos at all."
 COU_RIN:0 "Nanagami Rin"
 COU_RIN_desc:0 "Since the GSC President irresponsibly disappeared, the GSC has been placed under Nanagami Rin's leadership. Rin's competence, proven from the GSC President's trust, will be understandable without needing explanation. Performing a ridiculous amount of work perfectly every day and responding to work without almost any rest reminds one of the GSC President and superhumans.\n\nPerhaps in these aspects Rin has found the right place. But if there is a problem for her, the GSC President who suddenly vanished one day did not clearly designate her. It was simply that her position was the next highest position to the GSC President so she was pushed into taking it over, and that was all.\n\nHer new belief in absolute stability of governance is a good thing for everyone but it is not such a good thing for Rin's own unstable power position. Since Rin is in a position where she must bet everything on how long the GSC President's guarantee lasts, Rin will have to move busily."
 COU_RIN_SET1:0 "Chief Administrative Officer"
 COU_AOI:0 "Oki Aoi"
 COU_AOI_desc:0 "A cold, calculating presence in the Finance Office. Aoi sees the world in numbers and efficiency."
 COU_AOI_SET1:0 "Finance Director"
 COU_KAYA:0 "Shiranui Kaya"
 COU_KAYA_desc:0 "The superhuman has taken flight. The pathetic small fry who checked the superhuman have fallen out, and Kaya rejoices at having the opportunity to personally prove what the true rule of a superhuman is. Shiranui Kaya admired and on the other hand envied the GSC President, or more accurately the stability and order led by the GSC President. She saw that even the GSC President who had handled the interests of Kivotos for a long time was lacking compared to herself who is a superhuman in leading a perfect Kivotos.\n\nTherefore, Kaya is not simply a dictator greedily devouring only power. To be precise, she is closer to an engineer who wants the giant machine called Kivotos to turn perfectly without a single error with the footstool of power which is absolutely necessary.\n\nThousands of sheets of documents are piled on the desk, but Kaya smiles while reading between the lines of all those numbers. To her, politics is art, and administration is the exquisite brushwork that completes that art."
 COU_KAYA_desc_bad:0 "At some point Kaya began to suffer from an unknown sense of emptiness and anxiety. Why was that? Kaya led Kivotos as she prided herself. No one presents a disagreement to that... ah, it would be closer to saying no one can present one. The perfect order Kaya struggled to create with all her heart eventually was nothing but a phantasm decorated with lies.\n\nOutwardly Kaya is no different from before. She drinks coffee and sees to work. And on the flip side, an endless regret for crossing the road of no return while inwardly fearing she was wrong lies dormant. But what can be done? There is no longer any way. \n\nEventually Kaya obtained the eternal power she wanted. An eternal power in an ambiguous position that can neither be put down nor lifted up again. And furthermore rule will continue. It will continue forever regardless of whether she wants to give it up or not. Publicly she is worshipped as an overwhelming power holder, an unprecedented dictator, and the GSC President who created perfection, but in reality she is just a phantom muttering about things she lost.\n\nRule will continue. Only the owner does not continue." #For bad ending 
 COU_KAYA_desc_good:0 "The superhuman is now standing on the ground. Once Kaya was intent on confining herself in the name of perfection while looking down on everything from the sky, but now she's decided not to. She just decided to enjoy the occasional leisure while being certain of what she's doing.\n\nThousands of sheets of documents are still piled on the desk, and sometimes uncontrollable dust falls. But Kaya is no longer anxious about not being perfect. She obtained the power called composure, to accept the natural fact that if dust piles up you can just wipe it off and if a number is wrong you can just calculate again.\n\nKaya no longer suffers from the obsession that she must be perfect from the start. She's made up her mind to prove the obsession that she must be perfect through the result of being perfect. Perhaps contrary to expectations the intermediate process might not be perfect. However, that does not mean the collapse or ruin of the perfection Kaya herelf desires." #For happy ending
 COU_KAYA_SET1:0 "Defense Director"
 COU_AYUMU:0 "Iwabitsu Ayumu"
 COU_AYUMU_SET1:0 "Settlement Director"
 COU_MOMOKA:0 "Yuragi Momoka"
 COU_MOMOKA_DESC:0 "When did the Transportation Office become such an important department in the GSC? It was just a tiny department that repaired trains that broke down every day, received reports, and that was all.\n\nYuragi Momoka has emerged as a ray of hope for the locals. The newly established Reform Committee and the Red Dawn suggest that she is not a simple ruler. While supplying plenty of pollack-flavored snacks, receiving treatment as a person in power, and pretending to follow orders, Momoka became the core of the new order. So, Momoka has become no different from being forced to take over annoying tasks.\n\nMomoka doesn't have such a big interest in political play. Although it's been a long time since she got tired of processing even more surging reports. Occasionally she alone sighs saying she misses Rin. Next to her, locals wearing red armbands only look at her with displeasure.\n\nBut regardless of what that position is, she is the new order and the symbol of harmony between humanity and Kivotos. Momoka, and the pollack-flavored snacks, will faithfully perform that duty.\n\nEven if it's a fate no different from a mere puppet who pushed off complex political play to politicians, Momoka will perform that duty.\n\nBearing the burden she must rightfully bear." 
 COU_dual_leader_system:0 "Collective Leadership System"
 COU_dual_leader_system_desc:0 "Sharing the weight of responsibility between two leaders."
 COU_MOMOKA_SET1:0 "Transportation Director"
 COU_HAINE:0 "Haine"
 COU_HAINE_SET1:0 "Athletics Director"
 COU_HAINE_desc:0 "Haine originally had no intention of holding such a heavy position. Her healthy goal was simply to participate joyfully in athletic events, promote athletic culture, and achieve a healthy society. However, the rapidly changing situation did not leave her to spend such a smooth life. After the predecessor stepped down from the position, only Haine could uniquely hold the position that no one else could.\n\nHaine's rule, sitting in the position because she couldn't help it at the juniors' entreaty to take the position, is not special or unique. Because it's only a role as a cover to help not meet the terrifying situation of power vacuum, Haine chose to wear the crown and do nothing. She can check the Defense Forces and request budget allocation, but she doesn't want to unfold proactive diplomatic policies nor can she do so.\n\nHaine is trying to guarantee the same daily life as before for everyone. For the first time she processed endless documents, for the first time she was criticized for over 8 hours in a regular meeting, and she also has a history of failing to adjust opinions for the first time and disappointing everyone.\n\nBut nevertheless she won't quit. As long as Haine's resolution to protect everyone's daily life exists."
