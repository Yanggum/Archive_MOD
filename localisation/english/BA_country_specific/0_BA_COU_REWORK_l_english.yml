 landmark_COU_tower:0 "Sanctum Tower"
 landmark_COU_tower_desc:0 "The Sanctum Tower is a monumental structure located in the heart of Kivotos. It serves as the central hub where all academies and students gather to deliberate and make administrative decisions. As a symbolic landmark of Kivotos, every decision made within its walls carries profound weight for the future of the city."
 
 
 
 #Opening
 COU_country_intro_header: "The Order of Kivotos"
 COU_country_intro_content: "How should one briefly explain the General Student Council to humans hearing of it for the first time? Perhaps the United Nations or the Federal Government of the United States would serve as appropriate comparisons. Centered in the capital of D.U., the Kivotos General Student Council was the singular, massive order and protector of the realm. Controlling all central administrative facilities and mediating political disputes between academies, the GSC wielded immense influence before the Grand Shift. The Administrative Committee, composed of the General Secretariat and 11 specialized divisions, carried out governance in harmonious synchrony.\n\nHowever, like all organizations, the GSC was far from perfect. Chronic administrative shortages and the 'civil servant mindset'—contrasted against a skyrocketing volume of civil complaints—were long-standing topics that eroded the GSC's reputation. For instance, there is a popular, if slightly exaggerated, joke that requesting road repairs results in half a job being finished six months later.\n\nFurthermore, the exceptionally high degree of autonomy granted to each academy contributed significantly to the slowing of administrative processing. A major structural flaw was that any administrative order could simply be ignored by an academy invoking its autonomous rights if the order was deemed non-essential."
 COU_country_intro_header_1: "The Grand Shift and the Low Countries War"
 COU_country_intro_content_1: "Around 1:00 PM on an ordinary afternoon—here in November 1935—Earth and Kivotos faced a massive upheaval. In this event, which would forever be known as the 'Grand Shift,' academies and, in some cases, entire cities were suddenly transposed into this otherworldly realm.\n\nTo some, it appeared as if they had been replaced; to others, it seemed they had vanished forever. While various academies engaged in armed skirmishes with local forces, the GSC, acting as the arbiter of Kivotos, sought to resolve issues as peacefully as possible. The President of the GSC met with the Prime Minister of the Netherlands and held summits with the King of the Belgians. Yet, fate did not follow the intended path. Prolonged peace negotiations and escalating clashes between military organizations grew beyond control, eventually forcing the President to propose a military solution to the Council. This was the moment the Low Countries War broke out.\n\nTo stabilize the situation as quickly as possible, the President authorized indiscriminate fire with the intent of capturing the leadership of the Netherlands and Belgium. This led to a catastrophe fueled by a lack of intelligence: SRT Special Academy squads accidentally massacred the House of Orange-Nassau as they attempted to flee into exile. It was a situation no one in the GSC had anticipated. Indeed, it was at this moment the GSC first realized that, here, people could actually die from bullets.\n\nThe consequences of this recklessness and lack of information were devastating. Upon hearing of the royal family's massacre, the Dutch forces began a desperate resistance, even resorting to suicide attacks. The Belgian government cut off all diplomatic possibilities, and the King, the primary objective, escaped to the Congo. In the end, none of the President's objectives were achieved.\n\nTransformed into an unintended mass murderer, the President of the GSC abruptly vanished a month later in December 1935. This fact remained a closely guarded secret until New Year's Day 1936, but no one knows how long this thin veil of lies will hold. Procedurally, Chief Administrator Nanagami Rin has been appointed as Acting President, though some critics point out that she may be overstepping her authority."
 COU_country_intro_header_2: "A Mandated Duty"
 COU_country_intro_content_2: "Immediately following the Grand Shift, internet systems collapsed, portions of Kivotos' technology were permanently lost, and the rampant exercise of autonomy by various academies reached a point where the GSC could exert almost no influence. Realizing that Kivotos had been cast from an era of stability into the wild, the GSC underwent a period of organizational restructuring. The General Secretariat transformed into something akin to a Presidential Office, the Administrative Committee became the executive body, and the GSC was reborn—shifting from a massive overarching order into an academy-style system, or in some respects, a sovereign state. In truth, this was equivalent to abandoning pan-Kivotos control, but it was undoubtedly a necessary reform for survival.\n\nThe General Student Council now stands at a crossroads: to remain complacent here in the Low Countries, doing nothing while other academies run wild, or to struggle by any means necessary to regain control over Kivotos. Some fear that the GSC has turned barbaric, blinded by its former glory. Yet, as the primary order and constituent of Kivotos, the GSC is mandated with the duty to control a city-state fallen into chaos.\n\nIf the GSC hesitates, neither they nor anyone else will be able to stop the final dissolution of order.\n\n§YLead Developer: Imika§!\n§LFormer Developers: SKSKIe, YurizonoSeia§!"
 
 COU_guide: "Objectives\n\n§YRule of the Superhuman§! \n£white_dot. Prove that the rule of a superhuman is correct. Through iron and blood.\n    £white_dot. Oust Chief Administrator Nanagami Rin.\n    £white_dot. Reunify Kivotos.\n    £white_dot. And... §RManage Kaya's mental state carefully.§!\n\n§YRestoration of GSC Order§! \n£white_dot. Under Development.\n\n§YThe Archon§! \n£white_dot. Under Development.\n\n§YSpecial Path§! Access Requirements\n§RWarning: May contain spoilers. Do not scroll down if you wish to remain spoiled.§! \n\n\n\n\n\n\n\n\nKaya's True Ending:\n £white_dot. You must accumulate over 200 Political Power before the 'Scattered Dust' event triggers.\n £white_dot. While in an 'Annoyed' or 'Anxious' state, you must perform the Balance of Power decision 'Meeting with the Chief Administrator' at least 3 times."
 
 
 #Selection Screen 
 COU_GATHERING_STORM_DESC: "The Kivotos General Student Council, located in the central district of the massive academy city where thousands of schools form a federation, is the institution that controls all central administrative facilities and coordinates disputes and politics between the academies. In the not-so-distant past, Kivotos operated according to the 'Order of the General Student Council.' Every academy followed our commands and complied.\n\nUnfortunately, that trivial order led by the Council was plunged into an uncontrollable state due to the disaster known as the Grand Shift. It seems today is not the day that order shall be restored."
