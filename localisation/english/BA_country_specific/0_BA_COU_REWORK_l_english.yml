 COU_restore_our_fucked_lands:0 "Phase 1: Rebuilding the Zuiderzee Dam"
 COU_restore_our_fucked_lands_desc:0 "To restore the completely submerged ground, huge temporary walls will be erected around the site to be rebuilt, and then water will be pumped out using water pumps to finally turn the Zuiderzee back into IJsselmeer. Of course, some facilities may be 'destroyed' in the process..."
 COU_restore_our_lost_factories:0 "Phase 2: Emergency Repairs for Flooded Factories"
 COU_construct_sea_dam:0 "Phase 3: Dike Dam Construction"
 COU_extra_lands:0 "Complete Review of Urban Planning"
 COU_restore_flevoland_province:0 "Re-establishing Flevoland Province"
 COU_restore_flevoland_province_desc:0 "Flevoland Province completely disappeared after being flooded when the Zuiderzee dam was smashed during the Great Transfer. Now that we have rebuilt the dam, Flevoland Province has once again appeared above sea level, and we must rightfully re-establish it."
 COU_use_dam_for_energy:0 "Maximizing Energy Production"
 COU_use_dam_for_energy_desc:0 "The Zuiderzee, which had turned back into a sea after flooding in 1916, currently boasts such overwhelming majesty that it could become a sea again if the rebuilt dam were to collapse. We will utilize this point to maximize energy production using the dam constructed alongside the dike in Phase 3."
