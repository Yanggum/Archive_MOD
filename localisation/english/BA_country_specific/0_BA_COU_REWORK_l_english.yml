 COU_tooltip_end_perfidus_system:0 "£decision_icon_small §YRegular Demands for Privileges§! has been removed from the game."
 COU_decision_cat_perfidus:0 "Perfidus"
 COU_decision_cat_perfidus_desc:0 "\"My honor may be buried under these walls today, but if the children in this fortress can wake up tomorrow morning, I will gladly bear the brand of a traitor.\"\n\nIt might have been a destiny set by God that the GSC and the capital of Kivotos were transferred to the lowlands. While the local governments were busy fleeing in terror, there were also those who wisely weighed reality and profit within that chaos. They are those officially called collaborators, and commonly by the derogatory term Perfidus. Our relationship with them will play a very important role in our local assimilation."
