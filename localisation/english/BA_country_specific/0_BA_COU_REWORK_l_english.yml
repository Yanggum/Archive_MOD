 ##Kivotos Nationalism 
 COU_kivotos_nationalism_decision:0 "Kivotos Nationalism"
 COU_kivotos_nationalism_decision_desc:0 "While the concept of Kivotos nationalism might be unfamiliar to students, Kivotos has consistently required unity and cooperation since the day it transferred to this new world. Nationalism in the new Kivotos will aim for the unity of Kivotos students and the revival of the old system based on Kivotos superiority."
 COU_deepening_nationalist_sentiment:0 "Deepening Nationalist Sentiment"
 COU_deepening_nationalist_sentiment_desc:0 "Propaganda regarding Kivotos nationalism through various media will stimulate the students' suppressed new sense of patriotism."
 COU_expansion_of_racial_segregation:0 "Accelerating Segregation"
 COU_expansion_of_racial_segregation_desc:0 "\"Remember, the local residential area is on the right, and the Kivotos residential area is on the left.\""
 COU_our_sacred_war:0 "Holy War"
 COU_our_sacred_war_desc:0 "Our war must end with our victory. And these processes are a holy war to reunify Kivotos under the belief of faith, and no one can stop us no matter what hardships arise!"
 COU_change_southern_cities_names:0 "Kivotosization of Northern France-Flanders"
 COU_change_southern_cities_names_desc:0 "The Northern France and Flanders regions, which were 'absorbed' after the Great Transfer, responded most leniently to our rule and showed a submissive side, and many Kivotos students moved south to start new lives. This place is practically a member of the new Kivotos and needs to be given new names."
