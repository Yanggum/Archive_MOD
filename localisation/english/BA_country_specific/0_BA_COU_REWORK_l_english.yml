 COU_decision_the_student_council:0 "Missions"
 #COU_decision_the_student_council_desc:0 "£GFX_COU_decision_gsc\n\n\n\n\n\n§YThe GSC§! ruled all of Kivotos centered around the §YSanctum Tower§!. Such a GSC is composed of the §YAdministrative Committee§!, which §gexternally§! has §Y11 departments§! to ensure smooth management and tighten GSC control by distributing power. Several §gtemporary departments§! created additionally after the §YGreat Transfer§! are §Rnot officially§! counted.\n\nItems in the GSC are usually submitted by §YFinance, Transportation, Settlement, Defense, and Athletics§!, these §g5§! departments, and they compete to submit their items first. To activate an item, §YSchedule Tickets§! £schedule_ticket_texticon are required. §YSchedule Tickets§! £schedule_ticket_texticon are replenished §gone§! every 3 months. No more than §gsix§! can be replenished.\n\nCurrently, the number of §YSchedule Tickets§! £schedule_ticket_texticon is [?global.cou_schedule_point|+0]/6.\n"
 COU_decision_the_student_council_desc:0 "£GFX_action_point_texticon §7Action Points§! are a kind of trading tool for persuading and conciliating GSC executives, and can be obtained by handling several §grequirements§!, also known as §YMissions§!, regularly submitted to the Administrative Committee.\n\nWith £GFX_action_point_texticon §7AP§!, you can conciliate the Administrative Committee to set desired policies or national focuses.\n\nCurrently, the number of £GFX_action_point_texticon §7AP§! is [?global.cou_apcost|+0].\n"
 COU_check_the_missions_1:0 "Passage of Time"
 COU_check_the_missions_1_desc:0 "Completing missions within the given time will grant AP."
 COU_check_the_missions_2:0 "Passage of Time"
 COU_check_the_missions_2_desc:0 "Executives will be satisfied only when the presented work is completed within the given time."
 COU_check_the_missions_3:0 "Passage of Time"
 COU_check_the_missions_3_desc:0 "It is not mandatory to keep the time, but it would be better to do so."
 
 
