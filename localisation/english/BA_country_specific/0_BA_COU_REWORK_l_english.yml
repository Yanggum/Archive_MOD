 PERFIDUS_LEON_tooltip:0 "Perfidus Leader: 'The Inquisitor' §YLéon Degrelle§!"
 COU_perfidus_gui_txt1:0 "Current effects from Perfidus:"
 COU_perfidus_gui_txt2:0 "Mobilization Speed [?COU_Perfidus_ms|%+1]\nDivision Organization [?COU_Perfidus_aof|%+1]\nRecruitable Population Modifier [?COU_Perfidus_cf|%+1]\nStability [?COU_Perfidus_sta|%+1]\nProduction Efficiency Cap [?COU_Perfidus_fmef|%+1]\nCompliance Growth [?COU_Perfidus_cg|%+1]\nTraining Time [?COU_Perfidus_ttf|%+1]"
 COU_perfidus_happy_yay:0 "Perfidus are §GSatisfied§!."
 
 COU_collaboraters_wants_political_money:0 "Regular Demands for Privileges"
 COU_collaboraters_wants_political_money_desc:0 "Perfidus collaborate with us, but they don't intend to work for free. Since almost all of them are opportunists, that's one reason, but also because missions such as 'security dispatch' on behalf of the Defense Office and Valkyrie, which they handle, clearly require sacrifice. Therefore, they regularly demand privileges, i.e., funds or political support, from us. If their demands are met in time, there will be no problems, but if not, they will work 'less diligently' for us."
