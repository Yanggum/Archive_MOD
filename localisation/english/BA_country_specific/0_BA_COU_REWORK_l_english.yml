 #Focus 
 COU_shortcut_industry: "Economy"
 COU_shortcut_military: "Military"
 COU_shortcut_political_kaya: "Politics: Kaya"
 COU_shortcut_political_RIN: "Politics: Rin"
 COU_shortcut_political_others: "Politics: Collective Leadership System"
 
 
 COU_tooltip_tech_rework_add: "Waiting for the Tech Rework."
 COU_cut_tower_down_effect_tt: "The effects of the §Y$COU_cut_tower$§! National Spirit are reduced."
 COU_NOT_ARREST: "§Y[COU.ROOT.GetName]§! is not detained"
 
 
 ##Economy
 COU_focus_after_two_months: "After the Great Transfer"
 COU_focus_after_two_months_desc: "Since the Great Transfer in November 1935, the General Student Council has been reorganized into a form similar to a sovereign state with its own voting rights. As a result, the industrial infrastructure—which was previously managed through passive leadership and mere paperwork—is now being actively and directly constructed and planned."
 COU_focus_look_the_our_economy_fucked: "Analysis of Recovery Failure"
 COU_focus_look_the_our_economy_fucked_desc: "The Administrative Committee was unaware that the Netherlands' economy was incredibly dependent on trade and exports. But was that the only thing they missed? There are, of course, justifiable reasons for our failure."
 COU_economy_focus_0: "Resumption of the Zuiderzee Works"
 COU_economy_focus_0_desc: "The Zuiderzee Works refers to the dam construction project completed in 1932. However, the sudden transfer of the D.U. and the Sanctum Tower following the 1935 Great Transfer resulted in the disastrous re-flooding of the polders. The starting point for economic recovery will be the new Zuiderzee Works."
 COU_establishment_of_federal_industrial_committee: "Corporate Buyouts"
 COU_establishment_of_federal_industrial_committee_desc: "Corporations move strictly by the logic of money. There is no such thing as a 'patriotic' company; if we slip them a little cash for the sake of our economic stability, they will do anything for us."
 COU_tooltip_unlock_dutch_belgium_cons:0 "All §Ylocked designers§! will now be §Gavailable§!."
 COU_focus_order_highlander: "Highlander Buyouts"
 COU_focus_order_highlander_desc: "Money makes the trains run on time, and it makes the Highlanders run for us. It's a simple exchange of currency for loyalty."
 COU_focus_mineral_prospecting: "Restarting the Limburg Mining District"
 COU_focus_mineral_prospecting_desc: "Mines like Maurits and Winterslag in Limburg went completely bankrupt during the social chaos of the Great Transfer due to their strong external dependence in the early 1930s. However, these useful mines, which once produced 500 million tons of coal annually, can no longer be left neglected. All existing state-owned mines will be acquired and put back into operation!"
 COU_focus_project_delta: "Delta Project"
 COU_focus_project_delta_desc: "Taming the tides is a prerequisite for a stable Kivotos. We shall build a barrier that not even the ocean's fury can breach."
 COU_focus_on_industrial_complex: "Civilian Industrial Reconstruction"
 COU_focus_on_industrial_complex_desc: "The smokestacks must rise again. A nation that does not produce is a nation that does not exist."
 COU_focus_restore_cable_internet: "Restoration of the Cable Network"
 COU_focus_restore_cable_internet_desc: "Information is the lifeblood of the GSC. We must reconnect the severed lines to ensure the flow of data remains uninterrupted."
 COU_focus_apprenticeship_jordaanoproer: "Settling the Jordaanoproer"
 COU_focus_apprenticeship_jordaanoproer_desc: "The Jordaanoproer was a riot sparked by the unemployed in July 1934, leaving deep scars on Dutch society. As the successors responsible for managing the economy of the Low Countries, it is our duty to properly settle this unrest."
 COU_focus_have_with_galopin: "Adopting the Galopin Doctrine"
 COU_focus_have_with_galopin_desc: "The 'patriotic'—or rather, disloyal—Belgians have been a major headache, using the Galopin Doctrine led by Alexandre Galopin as a form of desperate resistance to preserve their industrial and economic structures. However, if we catch them off guard by adopting this principle and actively cooperating with them, we can absorb their potential capabilities without significant losses." 
 COU_focus_absorption_belgian_assets: "Absorption of Belgian Assets"
 COU_focus_absorption_belgian_assets_desc: "What was once theirs is now ours. Their wealth will be the fuel for our new order."
 COU_focus_plan_de_man: "Plan du Man"
 COU_focus_plan_de_man_desc: "Devised by Henri de Man in 1933, this labor plan represented the pinnacle of planist doctrine, aiming to create a nationalized sector encompassing credit organizations and major industries that were already substantially monopolized to build a mixed economic system. Although left-wing activists, especially Trotsky, denounced it as everything from a 'plan to deceive workers' to a 'reformed tool of bourgeois democratic conservatism,' Henri de Man's efficient and effective plan has now found its proper time and must be executed."
 COU_focus_have_with_hirschfeld: "Appointing Hirschfeld"
 COU_focus_have_with_hirschfeld_desc: "If the locals are organizing crude committees for economic resistance, we simply need to organize a more sophisticated committee to counter them. Hans Hirschfeld, the young director of the Ministry of Labor, Trade, and Industry who advocated for protectionism at a time when free trade ideology was dominant, is a promising economist among GSC collaborators. We will officially appoint him to build our own economy."
 COU_focus_expansion_of_protectionism: "Expansion of Protectionism"
 COU_focus_expansion_of_protectionism_desc: "As a strong supporter of protectionism, Hirschfeld requested the expansion of tariffs, which were previously limited to local states, and the extension of import quotas and subsidy deadlines to protect paralyzed industries and foster new ones."
 COU_focus_plan_de_vos_tinbergen: "Plan de Vos-Tinbergen"
 COU_focus_plan_de_vos_tinbergen_desc: "Devised in 1935 but never seeing the light of day, this plan was co-authored by Hein de Vos and Jan Tinbergen. Newly drafted with the participation of the Finance Office, this plan aims to invest 200 million Yen into public works through a General Economic Committee that can coordinate corporations, workers, and the Administrative Committee. It plans to hire 200,000 people and utilize the multiplier effect to increase the purchasing power of the working class and revitalize the economy."
 COU_focus_currency_unification: "Currency Unification"
 COU_focus_currency_unification_desc: "Multiple currencies only lead to confusion. The Yen shall be the only law of the market."
 COU_focus_abandon_the_gold_standard: "Partial Reintroduction of the Gold Standard"
 COU_focus_abandon_the_gold_standard_desc: "Stability requires a physical anchor. We will return to the gold standard to secure the value of our currency."
 #COU_focus_modernizing_agriculture: "Modernizing Agriculture"
 #COU_focus_modernizing_agriculture_desc: "[Discarded Focus]"
 COU_focus_eco_rework_the_dead_lands: "Mandatory Pump Installation in the Lowlands"
 COU_focus_eco_rework_the_dead_lands_desc: "Although the Zuiderzee dam has been rebuilt, the low-lying geographical characteristics of the region still result in soft soil and incomplete foundations. To overcome this and fully finalize the flood damage repairs, pump installation must be made mandatory."
 COU_focus_rework_our_roads: "Securing Highlander Train Stockpiles"
 COU_focus_rework_our_roads_desc: "A train that doesn't move is just a heap of scrap metal. We must secure enough rolling stock to keep the logistics flowing."
 COU_focus_attack_northern_france: "Integration of Northern France"
 COU_focus_attack_northern_france_desc: "The borders of the past are irrelevant. Northern France must be brought under our direct administration for the sake of efficiency."
 COU_focus_restore_grebee_peelram_line: "Reinforcing the Grebbe-Peel-Raam Line"
 COU_focus_restore_grebee_peelram_line_desc: "Our defenses must be impregnable. We will modernize the old lines to withstand the new threats of this world."
 COU_tooltip_construct_bunker_shalle: "If we control the §YD.U. Schale District§!:"
 COU_focus_reestablish_amsterdam_univ: "Reestablishing the University of Amsterdam"
 COU_focus_reestablish_amsterdam_univ_desc: "Education is the foundation of a controlled society. We will rebuild the university to produce the elite the GSC requires."
 COU_focus_hapsung_research: "Synthetic Chemistry"
 COU_focus_hapsung_research_desc: "If nature does not provide the resources we need, we will create them in the laboratory."
 #COU_focus_reestablish_tourism: "Rebuilding the Tourism Industry"
 #COU_focus_reestablish_tourism_desc: "[Discarded Focus]"
 COU_focus_lock_the_kronous: "Controlling Kronos"
 COU_focus_lock_the_kronous_desc: "Information is too dangerous to be left in the hands of amateur journalists. Kronos will report what we tell them to report."
 COU_focus_establish_humans_rights: "Elevation of the Human Rights Protection Office"
 COU_focus_establish_humans_rights_desc: "The Human Rights Protection Office was established as a temporary department after the 1935 Great Transfer. Under the leadership of Jan Baars, a fascist who defected to our side, it has grown its influence within the Administrative Committee to a level where it can stand equal to the existing 11 departments. Therefore, elevating the Human Rights Protection Office to a status nearly equal to the 11 departments is undoubtedly necessary for our governance."
 COU_focus_stop_our_deals: "Termination of Transactions"
 COU_focus_stop_our_deals_desc: "The time for compromise is over. We will no longer bargain with those who do not recognize our authority."
 #COU_focus_take_their_money: "Seizure of Funds"
 COU_focus_treay_of_amsterdam: "Amsterdam Declaration"
 COU_focus_treay_of_amsterdam_desc: "The locals in Flanders and Northern France, who were overshadowed by the prominence of the Kronos and Highlander autonomous districts, have long protested against the lowland-centric policies of the Administrative Committee. We must accept their reasonable opinions and take on the duty of developing these regions."
 COU_shaking_royalty: "Shaking Loyalties"
 COU_shaking_royalty_desc: "Self-proclaimed 'patriots' throughout the General Student Council still view us as invaders. But how long can that flimsy loyalty last? If we throw those opportunistic hypocrites a juicy piece of meat, they'll be on our side in no time."
 COU_give_power_to_degrelle: "Promoting Degrelle"
 COU_give_power_to_degrelle_desc: "The best way to show that the tables have turned is to make a visible 'example.' By using the loyal Léon Degrelle as an example and providing him with more power and benefits, we can increase the number of collaborators and focus on harmonizing with the locals."
 COU_keep_our_deals: "Maintenance of Transactions"
 COU_keep_our_deals_desc: "Stability is often bought. We will honor our agreements to ensure the continued cooperation of those we rely on."
 COU_focus_buy_their_weapon: "Illegal Firearm Trafficking"
 COU_focus_buy_their_weapon_desc: "If we cannot manufacture enough, we will procure from the shadows. Every gun in our hands is one less in the hands of the resistance."
 COU_reduction_of_administrative_committee_authority: "Neutralizing the Free Officers"
 COU_reduction_of_administrative_committee_authority_desc: "Following the Lowland War, officers from enemy nations who remained on the mainland formed an organization called the Free Officers, causing us significant damage. We can no longer tolerate this. We must drive a wedge between them and destroy them to achieve complete neutralization."
 
 ###Bureau of Strategic Services (OSS) 
 COU_establish_oss:0 "Kivotos Bureau of Strategic Services"
 COU_establish_oss_desc:0 "To protect the future, we need eyes and ears in every corner. The OSS will be our shadow."
 COU_focus_battle_for_lost_technology:0 "Partial Redesign of Technology"
 COU_focus_battle_for_lost_technology_desc:0 "The laws of physics have changed. Our technology must adapt or become obsolete."
 COU_focus_electronics_innovation:0 "Revival of Kivotos Electronics"
 COU_focus_electronics_innovation_desc:0 "Modern warfare is won in the circuits. We will bring Kivotos' electronic superiority back to life."
 COU_focus_wonderweapons:0 "Resumption of Project A.N.T.I.O.C.H."
 COU_focus_wonderweapons_desc:0 "The thermobaric warheads for ballistic missiles, a legacy of Project A.N.T.I.O.C.H. recovered by Shichido Yukino, were initially decommissioned to prevent the immense chaos they could cause in this new world after the Great Transfer. However, as it is clear that the situation will gradually turn against us, we will resume Project A.N.T.I.O.C.H. using a more 'moderate approach.'"
 COU_establish_spa:0 "Pardon of FOX Squad"
 COU_establish_spa_desc:0 "They were only doing their duty. It is time to bring these elite soldiers back into the fold."
 COU_tooltip_establish_spa:0 "§YFOX Squad§! released."
 COU_establish_dietsland_srt:0 "Local SRT Squad"
 COU_establish_dietsland_srt_desc:0 "If they want to fight for their land, let them do it under our banner. We will train the locals to the standards of the SRT."
 COU_focus_ask_to_join_lon:0 "Allowing League of Nations Observation"
 COU_focus_ask_to_join_lon_desc:0 "Let the world see what we want them to see. Transparency is a useful tool for legitimacy."
 COU_focus_burden_of_gsc:0 "The Burden of the GSC"
 COU_focus_burden_of_gsc_desc:0 "Heavy is the head that wears the crown. We must bear the weight of leadership for the sake of all students."
 COU_focus_on_europe:0 "Utilizing the Student Council's Authority"
 COU_focus_on_europe_desc:0 "Our name carries weight even in these strange lands. We shall use it to bend Europe to our will."
 COU_focus_eastern_emergency:0 "Eastern Emergency"
 COU_focus_eastern_emergency_desc:0 "The situation in the East is spiraling out of control. We must intervene before it reaches our borders."
 COU_focus_the_colour_emergency:0 "The Color Out of Space"
 COU_focus_the_colour_emergency_desc:0 "An otherworldly threat looms over our skies. We must study it, or be consumed by it."
 COU_focus_the_decagramaton_emergency:0 "Responding to the Machine Legion"
 COU_focus_the_decagramaton_emergency_desc:0 "The machines are rising. We will meet their cold logic with the fire of our resolve."
 
 
 
 ##Military
 COU_reorganizing_the_defense_office:0 "Reorganization of the Defense Forces"
 COU_reorganizing_the_defense_office_desc:0 "The Defense Forces, created after the Great Transfer due to the emerging need for an armed force, showed exceptional training levels and performance through high wages and vocational training programs. However, tragic examples from other academies imply that such a grandiose military system cannot last long. Even if complaints erupt among the personnel, reorganization into a regular military force is unavoidable."
 COU_focus_introduction_of_defendu:0 "Introduction of Fairbairn-Sykes (Defendu)"
 COU_focus_introduction_of_defendu_desc:0 "The close-quarters combat system known as Defendu was a mixed tactic developed in the 1920s by William E. Fairbairn and Eric A. Sykes, originally created to train the Shanghai Municipal Police. By introducing this useful tactic—which functions as a sort of simplified CQB—we can increase survival chances and guarantee victory for local troops against armies with archaic tactical thinking and equipment."
 COU_focus_invite_collaboraters_to_high_command:0 "Appointing Collaborators to High Command"
 COU_focus_invite_collaboraters_to_high_command_desc:0 "Knowledge of the terrain is vital. Local generals will provide the insight our students lack."
 COU_focus_annex_small_armies:0 "Taking Over the Command Structure of Small Academies"
 COU_focus_annex_small_armies_desc:0 "Some of the very small or minor academies that exist throughout Kivotos—whose existence is sometimes forgotten—were brought under control during the Great Transfer, either along with the D.U. or by falling within the GSC's administrative reach. Although they possess military and security systems with autonomy as proper academies, their clumsy systems are unreliable. Thus, it is more useful for both them and us if we take over their command structure on their behalf."
 COU_focus_unification_ammunition_process:0 "Unification of Ammunition Manufacturing"
 COU_focus_unification_ammunition_process_desc:0 "Since the General Student Council pacified the munitions factories in the lowlands, it has been difficult to utilize the factories efficiently due to differences in ammunition types or manufacturing processes between Kivotos-style munitions and others. To produce ammunition efficiently, unification of the manufacturing process is necessary."
 COU_focus_order_to_fn_herstal:0 "Inspection of the Defense Arsenal"
 COU_focus_order_to_fn_herstal_desc:0 "The legendary forges of Herstal must serve the GSC. We will ensure they are operating at peak capacity."
 COU_focus_assumption_of_hemberg_military_factory:0 "Restarting the Hemberg Arsenal"
 COU_focus_assumption_of_hemberg_military_factory_desc:0 "Another gear in our war machine. Hemberg will churn out the tools of our victory."
 
 ###Army 
 COU_focus_build_military_culture:0 "Strengthening Discipline"
 COU_focus_build_military_culture_desc:0 "The Land Defense Force has shown 'truly remarkable' discipline and norms since its creation in 1935. There were major issues such as frequent skipping of training, evading combat, and embezzling costs. For the Land Defense Force to function as a proper military, strengthening its lax discipline is the first priority."
 COU_focus_defensive2:0 "Acknowledging Unique Circumstances"
 COU_focus_defensive2_desc:0 "The majority of the Halo Infantry army consists of young high school students or even younger girls. To them, harsh military discipline and strict hierarchies are too cruel! It may be the right approach to acknowledge these unique circumstances and refrain from excessively harsh treatment."
 COU_focus_ready_for_tank_assembly:0 "Preparation for Mass Tank Production"
 COU_focus_ready_for_tank_assembly_desc:0 "Steel monsters for a steel resolve. We will flood the battlefield with armor."
 COU_focus_more_tank_production_line:0 "Expansion of Production Lines"
 COU_focus_more_tank_production_line_desc:0 "More factories, more tanks. The math is simple, and the results will be devastating."
 COU_focus_replan_vastion_holland:0 "Resuming Vesting Holland"
 COU_focus_replan_vastion_holland_desc:0 "Vesting Holland was the core of the Dutch military's national defense strategy in the 1930s, utilizing natural terrain and fortifications from the current Shiratori district to the Haruhabara area. Our primary strategy should consist of defense followed by counterattack."
 COU_focus_great_operation_system:0 "Thorough Operational System"
 COU_focus_great_operation_system_desc:0 "A plan is only as good as its execution. We will leave nothing to chance."
 COU_focus_central_military_reserach:0 "Mechanized Army"
 COU_focus_central_military_reserach_desc:0 "The era of the marching soldier is over. We will move on wheels and treads."
 COU_focus_tank_assembly:0 "Assembly Line Process"
 COU_focus_tank_assembly_desc:0 "Efficiency is the key to victory. We will refine our assembly methods to maximize output."
 COU_focus_tactical_advantage:0 "Tactical Superiority"
 COU_focus_tactical_advantage_desc:0 "We don't just fight; we fight smarter. Our students will be masters of the battlefield."
 COU_focus_offensive:0 "Mental Reform"
 COU_focus_offensive_desc:0 "A weak spirit in the military means death. The humans here will be trained endlessly on how to kill Kivotos students, and a weak discipline or mental state will lead to death and defeat. Such a thing must not happen. Mental reform must be implemented immediately."
 COU_focus_spirit_of_chasseurs_ardennais:0 "Spirit of the Chasseurs Ardennais"
 COU_focus_spirit_of_chasseurs_ardennais_desc:0 "The Chasseurs Ardennais were an elite Belgian unit sporting the wild boar emblem. Despite being at an extreme disadvantage during the Great Transfer, they 'resisted and bit' like wild boars, causing us significant damage. Their noble spirit is worth emulating."
 COU_focus_shock_infantry_battalion:0 "Shock Infantry"
 COU_focus_shock_infantry_battalion_desc:0 "Breaking the enemy's line is our specialty. These battalions will be the tip of our spear."
 COU_focus_rework_artillery:0 "Artillery Reform"
 COU_focus_rework_artillery_desc:0 "Quantity has a quality of its own. We will rain fire upon our enemies from miles away."
 COU_focus_antitank_artillery:0 "Anti-Tank Batteries"
 COU_focus_antitank_artillery_desc:0 "No armor is impenetrable. We will prove it with every shot."
 COU_focus_kyrie_for_brave_guys:0 "Kyrie for the Brave"
 COU_focus_kyrie_for_brave_guys_desc:0 "A requiem for the fallen, and a battle cry for the living."
 COU_tooltip_unlock_tactic_shock:0 "\nTactic Available: §YShock§!"
 COU_focus_rework_kivotos_doctrines:0 "Kivotos Doctrine Reform"
 COU_focus_rework_kivotos_doctrines_desc:0 "The old ways are gone. We will write the new book on Kivotos warfare."
 COU_focus_3levels_training:0 "3-Level Training"
 COU_focus_3levels_training_desc:0 "From basics to mastery. Our soldiers will be the most well-trained in the world."
 COU_focus_the_defense_budget:0 "Allocation of Defense Budget"
 COU_focus_the_defense_budget_desc:0 "War is expensive. We will ensure every yen is spent on securing our future."
 COU_focus_army_labortary:0 "Land Defense Research Institute"
 COU_focus_army_labortary_desc:0 "Where science meets the sword. We will develop the weapons of tomorrow, today."
 #COU_focus_digital_hallucination:0 "Digital Hallucination"
 #COU_focus_digital_hallucination_desc:0 "What is the most important thing in modern warfare? To create public opinion that supports our war, we must spread AI-synthesized videos or planned fake news favorable to us on SNS to create a friendly atmosphere. The amount of fake news we distribute will be overwhelming, and by subtly mixing it with the truth, we can efficiently manage students' support for the war." [Moved to Kaya route]
 COU_focus_road_of_survive:0 "Road of Survival"
 COU_focus_road_of_survive_desc:0 "In a world this harsh, survival is the only victory that matters."
 COU_focus_military_radio_first:0 "Priority on Military Communication"
 COU_focus_military_radio_first_desc:0 "Chaos thrives on silence. We will ensure our orders are always heard."
 COU_focus_guarantee_support_weapons:0 "Stockpiling Support Supplies"
 COU_focus_guarantee_support_weapons_desc:0 "Even if a nation's military possesses soldiers with superior combat power and spirit, if those soldiers are hungry, combat becomes meaningless. A military that provides warm clothes in winter, ensures an ample supply of ammunition, and feeds its troops well is a truly superior and advanced military."
 COU_focus_moving_railway_gun:0 "Mobile Artillery Batteries"
 COU_focus_moving_railway_gun_desc:0 "If the enemy won't come to our guns, we'll take our guns to the enemy—on rails."
 COU_tooltip_jurun:0 "The original effect of this was to immediately research railway guns and deploy 2 units, but since you do not own No Step Back, the following effect is provided instead:"
 COU_focus_rocketry_weapon:0 "Rocket Weaponry"
 COU_focus_rocketry_weapon_desc:0 "The sky will be filled with our fire. No one is safe from our rockets."
 
 ##Air Force
 COU_focus_expand_air_experience:0 "Expanding Air Training Plans"
 COU_focus_expand_air_experience_desc:0 "Dust has settled on our airframes! Despite having plenty of fuel, the Air Force—which hasn't been able to conduct proper training or engage in actual combat for 'various reasons'—cannot support the battlefield or dominate the skies. Even if we have to ask for some understanding from the engineers, we must expand and execute our air training plans."
 COU_focus_encouragement_of_flying:0 "Encouraging Civilian Aviation"
 COU_focus_encouragement_of_flying_desc:0 "Every pilot counts. We will foster a culture of flight to ensure a steady stream of recruits."
 COU_focus_focus_on_light_aircraft:0 "Operational Integrity"
 COU_focus_focus_on_light_aircraft_desc:0 "Our fighters will be the masters of the dogfight. Nimble, deadly, and everywhere."
 COU_focus_the_air_winner:0 "Struggle for Air Supremacy"
 COU_focus_the_air_winner_desc:0 "The sky belongs to the GSC. We will sweep our enemies from the heavens."
 COU_focus_focus_on_heavy_aircraft:0 "Strategic Destruction"
 COU_focus_focus_on_heavy_aircraft_desc:0 "Their factories will burn. Our bombers will bring the war to their doorstep."
 COU_focus_generic_armored_air_support:0 "Fortress in the Sky"
 COU_focus_generic_armored_air_support_desc:0 "Heavily armored and heavily armed. These planes will be the ultimate support for our troops."
 COU_focus_anti_air_weapons:0 "Deployment of Anti-Air Weapons"
 COU_focus_anti_air_weapons_desc:0 "Our skies are closed to our enemies. We will fill the air with lead."
 COU_focus_radio_com_security:0 "Communication Security"
 COU_focus_radio_com_security_desc:0 "Silence is safety. We will encrypt our signals to keep the enemy in the dark."
 COU_focus_air_doctrine:0 "Air Doctrine Reorganization"
 COU_focus_air_doctrine_desc:0 "The old tactics won't work here. We will innovate or perish."
 COU_focus_communicate_with_land_defence_force:0 "Supporting the Land Defense Force"
 COU_focus_communicate_with_land_defence_force_desc:0 "Army and Air Force, working as one. A combined arms nightmare for our foes."
 COU_focus_kivotos_drone:0 "Military Drone Development"
 COU_focus_kivotos_drone_desc:0 "War without risk. Our drones will do the dangerous work for us."
 COU_focus_kivotos_helicopter:0 "Helicopter Redevelopment"
 COU_focus_kivotos_helicopter_desc:0 "Versatile and vital. Helicopters will give us the mobility we need."
 COU_focus_rereserarch_kivotos_jet:0 "Jet Aircraft Research"
 COU_focus_rereserarch_kivotos_jet_desc:0 "Speed is life. We will break the sound barrier and our enemies' resolve."
 COU_focus_pilot_teacher:0 "Pilot Instructors"
 COU_focus_pilot_teacher_desc:0 "Experience is the best teacher. Our veterans will pass on their skills to the next generation."
 COU_focus_flying_is_maybe_sports:0 "Flying as a Sport"
 COU_focus_flying_is_maybe_sports_desc:0 "Turn training into a game, and our pilots will become the best in the world."
 COU_focus_paratroopers:0 "Creation of Paratrooper Units"
 COU_focus_paratroopers_desc:0 "Death from above. Our paratroopers will strike where the enemy least expects it."
 COU_focus_establish_air_labortary:0 "Establishment of the Specialized Aviation Research Institute"
 COU_focus_establish_air_labortary_desc:0 "The future of flight starts here. We will push the limits of what is possible."
 COU_focus_plane_for_naval:0 "Naval Aircraft"
 COU_focus_plane_for_naval_desc:0 "Our wings will extend over the ocean. No ship is safe from our reach."
 COU_focus_air_command_coppens:0 "Supporting Coppens"
 COU_focus_air_command_coppens_desc:0 "Willy Coppens, who surrendered to us during the Siege of Leeuwarden during the Lowland War, recalled that when he personally piloted Kivotos' advanced aircraft, he felt immense awe—or more accurately, terror—as a human who longed for the skies. Since then, he has walked as a pillar and giant of the Air Defense Force, and Coppens advocates for technical superiority." 
 COU_focus_test_kivotos_new_plane:0 "Analysis and Research"
 COU_focus_test_kivotos_new_plane_desc:0 "There are several Kivotos aircraft that have not yet been discovered throughout the region since the Great Transfer. We will deploy research institute staff to dismantle and investigate every aircraft without exception to ensure progress in our aviation research."
 COU_focus_air_command_donnet:0 "Supporting Donnet"
 COU_focus_air_command_donnet_desc:0 "Mike Donnet, who was captured after being shot down during the Air Battle of Den Haag during the Lowland War, subsequently pledged his cooperation to us. Although the aircraft used by humans are early models, he realized during the Air Battle of Den Haag that they could gain an advantage in aerial warfare if mass-produced. Thus, he advocates for the mass production of suitable aircraft."
 COU_focus_air_plane_produciton_line:0 "Specialized Production Lines"
 COU_focus_air_plane_produciton_line_desc:0 "A steady stream of aircraft for our pilots. We will out-produce any rival."
 COU_focus_invest_air_force:0 "Investment in the Aerospace Defense Industry"
 COU_focus_invest_air_force_desc:0 "The best planes require the best resources. We will invest heavily in our aerospace industry."
 
 
 ##Navy
 COU_focus_petition_45:0 "Accepting the Petition of the 45"
 COU_focus_petition_45_desc:0 "Recently, as the General Student Council took measures to downsize the Navy, drastically cut the naval budget, and canceled or scaled back all new ship construction plans, fleets comprised of locals and naval generals have expressed their dissatisfaction. These 45 individuals gathered and submitted a joint petition to the Administrative Committee. Interest in the Navy must continue, and their petition will be accepted."
 COU_focus_dutch_naval_succession:0 "Succession of the Dutch Navy"
 COU_focus_dutch_naval_succession_desc:0 "We inherit the traditions of the Dutch fleet. Our navy will be a force to be reckoned with."
 COU_focus_goal_generic_navy_submarine:0 "Investment in Asymmetric Warfare"
 COU_focus_goal_generic_navy_submarine_desc:0 "Silent and deadly. Our submarines will strike from the depths."
 COU_focus_undersea_wars:0 "Undersea Warfare"
 COU_focus_undersea_wars_desc:0 "The ocean floor is our domain. We will dominate the world beneath the waves."
 COU_focus_outersea_wars:0 "Surface Warfare"
 COU_focus_outersea_wars_desc:0 "Our ships will rule the surface. No one will challenge our naval might."
 COU_focus_guarantee_win:0 "Long-Distance Training for Coastal Fleets"
 COU_focus_guarantee_win_desc:0 "Our ships will go where they are needed, no matter how far. Distance is no barrier to the GSC."
 COU_focus_wolfs_of_undersea:0 "Focus on Submarine Fleets"
 COU_focus_wolfs_of_undersea_desc:0 "Like a pack of wolves, our submarines will hunt down and destroy enemy shipping."
 COU_focus_establish_marines:0 "Creation of Marine Corps"
 COU_focus_establish_marines_desc:0 "From sea to land. Our marines will be the ultimate amphibious force."
 COU_focus_fleet_escort_force:0 "Focus on Escort Fleets"
 COU_focus_fleet_escort_force_desc:0 "Protection for our convoys, and a shield for our main fleet."
 COU_focus_research_air_carrier:0 "Deployment of Aircraft Carriers"
 COU_focus_research_air_carrier_desc:0 "Projecting power across the globe. Our carriers will be the ultimate symbols of our might."
 COU_focus_scraping_the_blueprint:0 "Precise Design"
 COU_focus_scraping_the_blueprint_desc:0 "Every bolt, every plate, every gun. Our ships will be masterpieces of engineering."
 COU_focus_restore_dockyards:0 "Restoration of Dockyard Facilities"
 COU_focus_restore_dockyards_desc:0 "The shipyards must be humming with activity. We will build a fleet worthy of our name."
 COU_focus_pressure_cockerill:0 "Pressuring Cockerill"
 COU_focus_pressure_cockerill_desc:0 "Cockerill will build for us, or they will not build at all. We will ensure their compliance."
 COU_focus_focus_generic_naval_discipline:0 "Reopening the Royal Netherlands Naval College"
 COU_focus_focus_generic_naval_discipline_desc:0 "The next generation of naval officers starts here. We will train them to lead our fleet to victory."
 COU_focus_complete_naval_doctrine:0 "Completion of Naval Doctrine"
 COU_focus_complete_naval_doctrine_desc:0 "The definitive guide to naval warfare. Our fleet will follow the book to victory."
 COU_focus_fleet_worthy_of_its_dignity:0 "A Fleet Worthy of Its Dignity"
 COU_focus_fleet_worthy_of_its_dignity_desc:0 "Our navy will be a symbol of our power and prestige. A fleet that commands respect."
 COU_focus_new_naval_tradition:0 "New Naval Traditions"
 COU_focus_new_naval_tradition_desc:0 "A new era for a new navy. We will forge our own traditions in the fires of combat."
 COU_focus_i_dream_jollacun_fleet:0 "I Dream of a Grand Fleet"
 COU_focus_i_dream_jollacun_fleet_desc:0 "A vision of naval supremacy. We will make it a reality."
 COU_focus_on_heavy_nav_gun:0 "Emphasis on Heavy Naval Guns"
 COU_focus_on_heavy_nav_gun_desc:0 "Bigger is better. Our guns will shatter any ship that dares to oppose us."
 
 
 
 
