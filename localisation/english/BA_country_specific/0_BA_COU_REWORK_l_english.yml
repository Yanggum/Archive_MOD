 ##Zuiderzee Works Resumption
 COU_restart_the_zuiderzee_works:0 "Zuiderzee Works"
 COU_restart_the_zuiderzee_works_desc:0 "This marvelous civil engineering project completed by the old Dutch government in 1932 must be continued by whoever is in charge. Given the nature of the Low Countries, more ground and sites are essential, and the resumption of this project will be on a larger scale."
