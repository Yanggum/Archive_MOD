 SRT_sword_of_srt_hero:0 "The Sword of Kivotos"
 SRT_sword_of_srt_hero_desc:0 "Long ago, the Justina Council served as the sword of Trinity General School. They cut down Trinity's enemies, suppressed them, and erased them. Some students believe that perhaps their purpose was not so different from SRT Special Academy. Just as they were Trinity's knights, we are the knights of the General Student Council. We are the sword of Kivotos. We will raise a burning blade before them—and strike."

 SRT_we_are_srt:0 "We Are SRT"
 SRT_we_are_srt_desc:0 "No matter the battlefield, no matter the mission, we remain SRT."

 SRT_memories:0 "Memories"
 SRT_memories_desc:0 "Even elite operatives remember the quiet days at the academy."

 SRT_together:0 "Together"
 SRT_together_desc:0 "FOX and RABBIT—different squads, same academy."

 SRT_srt_justice:0 "SRT Justice"
 SRT_srt_justice_desc:0 "Justice, as defined by SRT."

 #이벤트
 SRT_event.1.t:0 "Assessing the Situation"
 SRT_event.1.d:0 "It appears that we have fallen into another world. Our connection with the General Student Council has been severed, and we must decide how to survive here. Even if we face the threat of academy closure, we must endure."
 SRT_event.1.a:0 "Understood."

 SRT_event.2.t:0 "Decision"
 SRT_event.2.d:0 "We have discovered that aside from the General Student Council, there exists an extra-legal organization here called the Federal Investigation Club Schale. We must decide whether to bow our heads to Schale—or refuse to submit."
 SRT_event.2.a:0 "SRT will never bow its head."
 SRT_event.2.b:0 "We have no choice..."

