l_english:
 SRT_country_intro_header: "§CThe Karbannog on the Brink of Closure§!"
 SRT_country_intro_content: "\nSRT Special Academy is a special institution under the General Student Council created to train special forces capable of rapidly resolving major criminal incidents occurring across the academies. Normally, public order in Kivotos is handled autonomously by each academy within their own districts, while areas outside academy districts are maintained by the Valkyrie Police Academy. However, Valkyrie could not intervene in other academies due to autonomy issues. Therefore, the General Student Council President granted special immunity under her authority and established SRT to train special operatives capable of armed intervention across academies. However, the creation of SRT was seen as an act that disregarded the autonomy of each academy. Naturally, dissatisfaction arose within the academies, but due to the President's charisma and popularity, there was no serious opposition to SRT's establishment. \n\nAfter the Great War broke out, SRT—separated from the General Student Council amidst the chaos—found itself settling in Brittany, France, far from the Council. Unlike Millennium, where conflict between students and locals escalated into full-scale warfare, SRT quickly suppressed local riots and stabilized the situation. However, with communication with the General Student Council now severed, confusion has begun to spread within SRT. A growing divide is emerging between those who insist SRT must return to the Council and fulfill its duty, and those who believe SRT should administer justice on its own.\n\nYour choice will determine the direction of SRT. Bring SRT's justice to the entire world!\n\n§YDeveloper - Mako§!\n§YAssistant Developers - KR_appleman, mintcoon, Lolenheim, 월하§!"

 SRT_guide: "Objectives\n\n£white_dot. Escape the crisis of academy closure.\n£white_dot. Reestablish contact with the General Student Council or break free from its control.\n£white_dot. Struggle to be recognized as a legitimate academy."


