 SRT_maintaining_military_economy_desc:0 "All available resources must support SRT's operational readiness."
 SRT_forced_mobilization:0 "Forced Mobilization"
 SRT_forced_mobilization_desc:0 "When survival is at stake, everyone must contribute."
 SRT_creation_of_private_industry:0 "Creation of Civilian Industry"
 SRT_creation_of_private_industry_desc:0 "Even a special forces academy needs a stable economic base."
 SRT_military_industry_inspection:0 "Military Industry Inspection"
 SRT_military_industry_inspection_desc:0 "Efficiency inspections ensure every weapon serves its purpose."
 SRT_strengthening_power:0 "Strengthen Authority"
 SRT_strengthening_power_desc:0 "Order must be maintained—especially in uncertain times."
 SRT_focus_weapon_research:0 "Weapons Research"
 SRT_focus_weapon_research_desc:0 "Better weapons mean better survival odds."
 SRT_focus_weapon_research_2:0 "Weapons Research II"
 SRT_focus_weapon_research_2_desc:0 "Further refinement of SRT's combat technology."
 SRT_retirement_old_equipment:0 "Fix the Problems"
 SRT_retirement_old_equipment_desc:0 "Outdated gear is a liability on the battlefield."
 SRT_labor_productivity_propaganda:0 "Labor Propaganda"
 SRT_labor_productivity_propaganda_desc:0 "Even students can be motivated by a good speech—or a stern order."
 SRT_songunism:0 "Military-First Doctrine"
 SRT_songunism_desc:0 "The academy survives only if the military survives."
 SRT_market_liberation:0 "Market Liberalization"
 SRT_market_liberation_desc:0 "Perhaps economic freedom can solve problems discipline cannot."

 SRT_focus_1:0 "Assess the Situation"
 SRT_focus_1_desc:0 "Damn it, what exactly happened? All communications with the General Student Council have been cut. Outside the academy, a forest that never existed before now surrounds us. The roads leading out are blocked, and the academy warehouse is running low on supplies. If we don't escape this situation soon, everyone might starve. Everything is in chaos—where on earth is she? We have to find her. Bring her here immediately!"
 SRT_focus_1_1:0 "Decision"
 SRT_focus_1_1_desc:0 "An emergency meeting has been convened, centered around Yukino Shichido of the FOX Platoon. With each passing day, the stockpile of supplies dwindles, and outside the SRT main campus, students gather demanding answers. Communications with the General Student Council are unstable, and it may be that we must choose our own path. Yukino must make a decision."
 SRT_focus_2:0 "Refusal to Submit"
 SRT_focus_2_desc:0 "Many support the legal interpretation that without the General Student Council President, the Council cannot command SRT. Some radical students have already begun drafting a declaration. Seeing Yukino allow it to continue, it seems her heart has already leaned in that direction. In this situation, all that remains is to elevate the students' declaration into the official proclamation of the emergency council."
 SRT_focus_2_1:0 "Submission"
 SRT_focus_2_1_desc:0 "Even a toothless tiger is still the General Student Council—and according to academy law, it still stands above us. We may not have the same freedom we currently enjoy, but haven't we lived under their authority for a very long time? Compared to the security and living standards they provide our academy, this is hardly any price at all. Now then—let's go and pledge our loyalty."

