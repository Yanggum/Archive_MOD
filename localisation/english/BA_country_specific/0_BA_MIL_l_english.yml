# News Events
 MIL_news.1.t: "$fldh$ Victors in the Power Struggle"
 MIL_news.1.desc: "The war between Millennium and France following the Great War event has concluded with Millennium's victory. The French government went into exile, but the French citizens could not. At the Millennium Countermeasures Meeting, a fierce debate broke out over the solution to the French citizen problem, and ultimately $fldh$ emerged victorious in the debate.\n\nFurthermore, she was elected as the President of $MIL_seminar_character$, having her leadership recognized in the debate. The news that $fldh$, who pursues strong control, has taken full power over $MIL_seminar_character$ will surely not be welcomed by the French Resistance."
 MIL_news.1.a: "This is the most rational way."
 MIL_news.1.b: "Can she lead Millennium well?"
 MIL_news.1.c: "I'm interested."
 MIL_news.2.t: "$MIL_Himari$ Victors in the Power Struggle"
 MIL_news.2.desc: "The war between Millennium and France following the Great War event has concluded with Millennium's victory. The French government went into exile, but the French citizens could not. At the Millennium Countermeasures Meeting, a fierce debate broke out over the solution to the French citizen problem, and contrary to everyone's expectations, $MIL_Himari$ emerged victorious in the debate.\n\nUnlike $fldh$, who advocated for strong control, $MIL_Himari$ is known to have proposed a conciliatory approach toward French citizens. Accordingly, $MIL_seminar_character$ recognized Akeboshi Himari's leadership and elected her as the President of $MIL_seminar_character$."
 MIL_news.2.a: "It's time for the Super Genius Sickly Beautiful Girl Hacker to shine!"
 MIL_news.3.t: "$fldh$ Ousted"
 MIL_news.3.desc: "As $fldh$'s arbitrary and dangerous plans continued, she eventually lost the trust of $MIL_seminar_character$ and her support base collapsed. Consequently, a vote of no confidence was proposed in $MIL_seminar_character$ and passed with overwhelming support, ousting $fldh$ from the presidency.\n\nThe presidency is currently vacant, and $MIL_seminar_character$ is expected to act as the interim president for the time being. However, discussions surrounding a new leadership are still ongoing, and it is uncertain how the internal balance of power will be adjusted."
 MIL_news.3.a: "\"I... I was just trying to do my best...\""
 MIL_news.3.b: "In a way, it was an expected result."
 MIL_news.3.c: "Does parliamentarianism apply to them as well?"
 MIL_news.4.t: "Hatsune Miku's Special Live"
 MIL_news.4.desc: "As Hatsune Miku's concert approached in two weeks, a suitable humanoid android device was manufactured using [MIL.GetName]'s technology. However, the process of adapting to the new body was not smooth, and with unstable speech and singing, possibilities were raised that the Special Live might be postponed. But after overcoming these issues through steady training, the Special Live was held as scheduled.\n\nThe songs to be performed at the concert were already decided, but an unexpected song flowed out at the last moment. It was a song composed by Hatsune Miku herself for her fans. The song ended amidst the fans' passionate cheers, and the shouting didn't stop for about a minute. Finally, as Hatsune Miku delivered her greetings, the concert ended in a touching atmosphere."
 MIL_news.4.a: "Because I am \"Hatsune Miku,\" who delivers songs to listeners with a sincere heart!"
 MIL_news.4.b: "I like this!"
