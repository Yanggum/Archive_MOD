# Events

 MIL_minister_appointment_event.1.t:0 "Head of Experimental Economy"
 MIL_minister_appointment_event.1.d:0 "The experimental introduction of a command economy has been decided for Millennium Science School's future policy. We will now appoint a head to manage this system and drive the new program during this leadership's tenure."
 MIL_minister_appointment_event.1.remove:0 "Following a change in leadership, we must select a person to inherit and push forward the command economy program initiated by the previous administration."

 MIL_minister_appointment_event.2.t:0 "Head of Economic Development Dept."
 MIL_minister_appointment_event.2.t2:0 "Director of Investment Planning Bureau"
 MIL_minister_appointment_event.2.d:0 "As a market economy is introduced and various industries are privatized, a new department is needed. We will establish the Department of Economic Development to oversee and review policy and select its head."
 MIL_minister_appointment_event.2.remove:0 "Following a change in leadership, we must appoint a new head for the Department of Economic Development. We need to select someone to oversee all economic development within the academy."
 MIL_minister_appointment_event.2.d2:0 "Following a change in leadership, we must appoint a new director for the Investment Planning Bureau. We need to select someone to oversee all financial investment within the academy."

 MIL_minister_appointment_event_semina_a:0 "Hayase Yuuka; her calculations will be perfect."
 MIL_minister_appointment_event_semina_b:0 "Ushio Noa; her genius memory is trustworthy."
 MIL_minister_appointment_event_semina_c:0 "Kurosaki Koyuki; let's put our faith in her mind."
 MIL_minister_appointment_event_veritas_a:0 "Kagami Chihiro; her meticulousness makes her a fit."
 MIL_minister_appointment_event_veritas_b:0 "Otose Kotama; do not hesitate to use any means for the goal."
 MIL_minister_appointment_event_veritas_c:0 "Omagari Hare; her diverse knowledge makes her suitable."
 MIL_minister_appointment_event_veritas_d:0 "Konuri Maki; her problem-solving skills are excellent."

 MIL_minister_appointment_event_semina_exit:0 "Wait, we already have someone in this role."

 MIL_event.1.t:0 "Summon Seminar"
 MIL_event.1.d:0 "Following victory in the war with France, the first countermeasure meeting was held to address student dissatisfaction rising from persistent French resistance terror.\n\nUnlike the urgent emergency meetings during the war, this meeting, formed for domestic affairs, will devise various plans to solve Millennium's future problems."
 MIL_event.1.a:0 "Move quickly!"
 MIL_event.2.t:0 "French Resistance"
 MIL_event.2.d:0 "Seminar members support Rio's hardline stance, demanding a large-scale student mobilization to eliminate the resistance. However, Veritas, on the opposition side, is torn between anger at the resistance and Himari's moderate approach.\n\nWhile the meeting generally supports Rio's 'total sweep operation,' general students demand focus on recovery via a 'soft policy with the resistance' to heal from the war."
 MIL_event.2.a:0 "Rio's opinion was adopted."
 MIL_event.2.b:0 "Himari dramatically flipped public opinion."
 MIL_event.3.t:0 "Loss of Rio's Authority"
 MIL_event.3.d:0 "The failures of the current administration have become too large to ignore. The students are calling for accountability, and the President's seat looks increasingly precarious."
 MIL_event.3.a:0 "Tsukatsuki Rio must take responsibility for this situation."
 MIL_event.4.t:0 "Destruction of the French Market"
 MIL_event.4.d:0 "'Destruction is the mother of creation.'\n\nTo absorb the French market and run our familiar computerized command system, we must first dismantle the existing French market.\n\nC&C will lead extensive economic investigations, the temporary suspension of the Franc, and the detention of numerous capitalists.\n\nAs prolonged chaos could hurt the market structure and Millennium's rule, we must complete the restructuring soon."
 MIL_event.4.a:0 "We will create a better system."
 MIL_event.5.t:0 "The Ruins Problem"
 MIL_event.5.d:0 "Mysterious ruins were found near Millennium after the Shift to France. Rumors say they were moved during the Shift and their secrets could decide Millennium's fate. They could be a forbidden library or an uncontrollable, dangerous weapon. How should we respond?"
 MIL_event.5.a:0 "Blow it all away!"
 MIL_event.5.b:0 "Moderately restrict access."
 MIL_event.5.c:0 "Explore it directly."
 MIL_event.6.t:0 "Counter-Battery Fire"
 MIL_event.6.d:0 "A sharp voice echoed through the radio.\n\n'Fire!'\n\nFlames erupted from cannons on Millennium's outskirts. Shells cut through the dark. A student commander watched the ruins through binoculars, her eyes full of tension.\n\n'Did it hit?'\n\nA student checking a monitor replied. 'First shell hit! But... what is this?'\n\nA strange light was captured rising from the ruins.\n\n'Abnormal energy detected! Prepare second volley!'\n\n'Execute.'\n\nThe second blast lit up the night. The shells' trajectories were clear. 'Look over there!'\n\nA massive energy pillar rose from the ruins. As shells hit it, a blinding light engulfed the area."
 MIL_event.6.a:0 "What is happening?"
 MIL_event.7.t:0 "AL-1S"
 MIL_event.7.d:0 "As the shockwave hit the ruins, a girl's eyes snapped open in a deep basement. Her name was AL-1S, Princess of the Nameless Gods.\n\nChamber glass shattered, venting steam. AL-1S rose slowly, looking around with confusion, fear, and a searching longing. 'Where... am I?' her voice trembled.\n\nAnother explosion sounded. AL-1S's eyes glowed red as something inside her woke up. 'Dangerous...' she muttered. 'Must protect myself.'\n\nIntense light erupted from her, a pulse of energy covering the ruins and blocking Millennium's shells. AL-1S slowly climbed to the surface, her eyes now set with firm will.\n\n'Who... am I?' she asked the night sky. 'And where is this...?'\n\nA flash of light then burst from the smoke of the ruins."
 MIL_event.7.a:0 "AL-1S: Enemy destruction complete."
 MIL_event.8.t:0 "Princess of the Nameless"
 MIL_event.8.d:0 "The Princess of the Nameless Gods has finally awakened. Her eyes were full of confusion and fear, but also strong will. Standing alone in the ruins, her presence was beautiful and overwhelming.\n\nAris stepped forward. Each step made the ground tremble, her suppressed power palpable. She didn't know who she was or why she was there, but she instinctively realized her power and mission. Forgotten memories were slowly returning.\n\nAris looked up at the ruined Millennium. Her eyes changed. No longer a confused girl, she radiated the dignity of a powerful Princess. Her path is now set."
 MIL_event.8.a:0 "Hail!"
 MIL_event.9.t:0 "Sword of Light"
 MIL_event.9.d:0 "Following AL-1S's return, autonomous machines sought ways to use her power. Seeking more power by weaponizing her divinity, they started 'Project Supernova' to create a light sword from her energy.\n\nAfter many trials, they succeeded in stabilizing and condensing her power, completing the sword 'Supernova.' It wasn't just a sword, but a holy relic imbued with her power.\n\nHowever, this success had a cost. AL-1S suffered greatly, and part of her power was permanently sealed in the weapon. A great achievement for Millennium, but also a tragic moment recorded in its history."
 MIL_event.9.a:0 "It was an unavoidable choice."
 MIL_event.10.t:0 "Restart"
 MIL_event.10.d:0 "Millennium's growth is based on high-tech progress. We optimized production to achieve breakthroughs and showed new possibilities in robotics through automation and military use.\n\nBut this innovation had a flaw: extreme dependence on power. We faced unprecedented power shortages after the Shift. However, through creativity and logic, we escaped national disaster.\n\nThe time has come. The solemn fires of labor will burn in factories, and robots will greet us everywhere."
 MIL_event.10.a:0 "Commence Startup"
 MIL_event.11.t:0 "Queen's Day"
 MIL_event.11.d:0 "Queen's Day has arrived. As AL-1S woke, the French sky turned a strange light. Electronics malfunctioned, and robots stopped as if bowing. Students watched in fear as world leaders called emergency meetings.\n\nThe Queen's return was a world-shaking upheaval. Her power distorted everything, and reality twisted at her will. French streets filled with bizarre phenomena as people struggled to survive the chaos.\n\nThe world slowly sank into darkness. As AL-1S grew stronger, reality warped further. Once bustling France became a kingdom ruled by her will. International efforts were powerless against her. A new era, the Queen's Era, has begun."
 MIL_event.11.a:0 "The world belongs to the Queen"
 MIL_event.12.t:0 "The Sword's Destination"
 MIL_event.12.d:0 "AL-1S stood alone before the General Student Council building with a massive particle cannon, glowing like a star. Students watched in tension as Valkyrie units prepared for battle.\n\n'Resistance is meaningless,' AL-1S's voice echoed. She raised Supernova, and a sky-tearing flash erupted. Valkyrie bullets evaporated, and the Council's shields tore like paper.\n\nAL-1S swung Supernova. An energy wave struck the building, collapsing half of it. Council students fled in fear, and Valkyrie was helpless. The Belgian sky now belongs to AL-1S; none can resist her power."
 MIL_event.12.a:0 "Hostile entity: Commence destruction."
 MIL_event.13.t:0 "Control Faction Dominance in Seminar!"
 MIL_event.13.d:0 "Political shifts were rapid after Seminar adopted Marxist economics. Those calling themselves the 'Control Faction' gained significant dominance. It is now time for [ROOT.GetLeader] to decide which faction to support."
 MIL_event.13.a:0 "Follow the Control Faction."
 MIL_event.13.b:0 "They are dangerous and adventurist."
 MIL_event.14.t:0 "Cleanup of [FROM.FROM.GetName] Complete"
 MIL_event.14.d:0 "No anomalous elements remain in [FROM.FROM.GetName]. The Queen's loyal forces have replaced the locals, forming a society more advanced than before."
 MIL_event.14.a:0 "Achieved."
 MIL_event.15.t:0 "Crushing"
 MIL_event.15.d:0 "-To my dear husband Léon.\n\nHi, it's me, Emma.\nI was so relieved to hear you arrived safely in Algeria.\nIsn't it very hot there?\n\nThings here are the same as usual.\n\nPeople protesting.\nStrange objects suppressing them.\nAnd the resulting bloodshed.\n\nOf course, I stayed far away, so don't worry.\nI'm pregnant, so I can't let our baby get hurt.\n\nBut the suppression has gotten stronger lately.\nThey say even those not protesting are being seized.\n\nI'm writing this to you from a basement.\nWhen can we meet again?\n\nOh, think of names before you come! One for a boy, one for a girl.\n\nI miss you so much. Both you and our baby.\nI hope our country is liberated soon. I love you.\n\n-Your loving wife, Emma."
 MIL_event.15.a:0 "The letter was never delivered."
 MIL_event.16.t:0 "The Ark"
 MIL_event.16.d:0 "Following AL-1S's return, machines sought new ways to use her power. After much research, they started the 'Ark of Atrahasis' project—an ambitious attempt to create a space separate from reality using her divine power.\n\nBuilding the Ark consumed all of Millennium's resources. Machines developed devices to stabilize her energy, while construction units designed structures to house it. Thousands of machines worked day and night, and finally, a massive Ark appeared outside Paris.\n\nThe Ark was a miracle. Reality's laws didn't apply; only AL-1S's will was truth. It wasn't just a building, but her divine domain and the starting point of a new world. Millennium's greatest achievement."
 MIL_event.16.a:0 "Incredible."
 MIL_event.17.t:0 "French Resistance"
 MIL_event.17.d:0 "The French resistance in Millennium territory has risen, offering cooperation in the current war.\n\nActive since Millennium's occupation, they are a group advocating for total resistance by all French people."
 MIL_event.17.a:0 "They will surely help our war effort."
 MIL_event.18.t:0 "GDD's Unauthorized Intrusion into Ruins"
 MIL_event.18.d:0 "Records show the Game Development Department entered the restricted ruins. An unidentified girl has since been seen with them. We will send Hayase Yuuka to their clubroom for a surprise investigation.\n\nWe must immediately determine if she is an enemy of Millennium and handle it."
 MIL_event.18.a:0 "Leave them for now."
 MIL_event.19.t:0 "Abandoned Factory"
 MIL_event.19.d:0 "We found a suspicious factory that likely had high security, but the Shift cut the power, leaving its iron doors as mere scrap.\n\nOur team must investigate to identify and handle any potential threats inside."
 MIL_event.19.a:0 "We can get in."
 MIL_event.20.t:0 "A Girl"
 MIL_event.20.d:0 "Deep in the old factory, we found a naked girl sleeping on a chair under a skylight. Reported to have grey hair and blue eyes, she woke up during transfer by the investigation team.\n\nAfter a short Q&A, the team found her name is AL-1S. Analysis shows she is a highly advanced humanoid."
 MIL_event.20.a:0 "Take her to Seminar."
 MIL_event.21.t:0 "AL-1S Problem"
 MIL_event.21.d1:0 "After GDD's unauthorized entry into the ruins, Hayase Yuuka reported 'Tendo Aris' as a new member. However, Aris is clearly not a normal student, but a combat humanoid.\n\nWe have separated her from the GDD. We must now decide her fate: return her to the GDD she befriended, or keep her in Millennium under strict surveillance."
 MIL_event.21.d2:0 "We must decide the fate of AL-1S found in the ruins. Analysis shows she's a combat unit but has significant command ability.\n\nWe can enroll her in Seminar to utilize her, or keep her in Millennium under strict surveillance."
 MIL_event.21.a:0 "'Tendo Aris,' huh..."
 MIL_event.21.b:0 "Enroll her in Seminar."
 MIL_event.21.d:0 "C&C seems interested."
 MIL_event.21.c:0 "Accept her as a student under surveillance."
 MIL_event.22.t:0 "Arrow Toward the Sky"
 MIL_event.22.d:0 "The countdown has begun. The culmination of our propulsion research is sitting on the pad, ready to pierce the veil of the atmosphere."
 MIL_event.22.a:0 "3... 2... 1..."
 MIL_event.23.t:0 "Signal Received"
 MIL_event.23.d:0 "The first transmission from our satellite has been confirmed. The data is clear, and the orbit is stable."
 MIL_event.23.a:0 "We succeeded despite all odds."
 MIL_event.24.t:0 "Fate of C&C"
 MIL_event.24.d:0 "C&C's hero myth is supported by students, which we must address. Their fame can hurt our authority, but formally employing them would greatly expand our military capability."
 MIL_event.24.a:0 "Join hands."
 MIL_event.24.b:0 "Separate them from the public; they will be forgotten."
 MIL_event.25.t:0 "Dawn of the Second Countermeasure Meeting"
 MIL_event.25.d:0 "The second meeting began without Veritas. Starting with doubts about Rio's leadership, it will essentially decide the direction of Seminar's leadership."
 MIL_event.25.a:0 "The meeting began under Rio's lead."
 MIL_event.25.b:0 "The meeting began in confusion."
 MIL_event.26.t:0 "Agenda: French Resistance"
 MIL_event.26.d:0 "The French resistance, a key issue in the first meeting, is back. We must decide how to respond to their continued disruptions."
 MIL_event.26.a:0 "Deploy C&C."
 MIL_event.26.b:0 "Maintaining the status quo seems best."
 MIL_event.26.c:0 "Use my direct bodyguards."
 MIL_event.27.t:0 "Agenda: Club Restructuring"
 MIL_event.27.d:0 "With Seminar's leadership restored, an agenda was raised to return clubs to its control. Given their semi-autonomous state since the Shift, this restructuring is expected to face significant pushback."
 MIL_event.27.a:0 "We need an efficient club structure."
 MIL_event.27.b:0 "Seminar respects club autonomy."
 MIL_event.28.t:0 "Agenda: Campus Redevelopment"
 MIL_event.28.d:0 "The central campus, expanded with various functions after occupying France, looks messy. We must push for redevelopment.\n\nRio argues for a planned Seminar-led restructuring, while others suggest a student-led event to redesign the campus."
 MIL_event.28.a:0 "I'll take charge."
 MIL_event.28.b:0 "Let the students redesign it autonomously."
 MIL_event.29.t:0 "End of the Second Countermeasure Meeting"
 MIL_event.29.d:0 "The meeting just ended. Discussing issues like the resistance and campus redevelopment, it also signaled Rio's declining leadership.\n\nPost-meeting, Seminar discussions are taking priority over Rio's solo decisions, clearly damaging her authority."
 MIL_event.29.a:0 "At least it ended safely."
 MIL_event.30.t:0 "C&C's Seizure of Millennium Tower"
 MIL_event.30.d:0 "Himari's post-revolution restructuring seems to have failed to create a stable structure. Amidst rising anxiety, Neru has seized Millennium Tower, demanding Himari let C&C end the chaos.\n\nAccepting would solve the chaos temporarily but cause future issues. Even if rejected, a forced coup by C&C is unlikely.\n\nHimari must decide: let C&C suppress the chaos, or reject them and continue restructuring amidst the instability."
 MIL_event.30.a:0 "...Approved."
 MIL_event.30.b:0 "This coup cannot be permitted."
 MIL_event.31.t:0 "Millennium-Soviet Tech Treaty"
 MIL_event.31.d:0 "Millennium, known for its technology, has revealed it's building a labor-first economy and has proposed a tech treaty to us, the leaders of the socialist camp."
 MIL_event.31.a:0 "A strange fraternal republic."
 MIL_event.31.b:0 "Reject it."
 MIL_event.32.t:0 "Millennium-Soviet Tech Treaty: Accepted"
 MIL_event.32.d:0 "The Soviets, attracted by our technology, approved the treaty. We can exchange our tech for their experience in socialist collectivization, benefiting both."
 MIL_event.32.a:0 "Interesting progress."
 MIL_event.33.t:0 "Millennium-Soviet Tech Treaty: Rejected"
 MIL_event.33.d:0 "The Soviets remain cautious about Kivotos and declined the treaty. However, they accepted basic ties like establishing embassies."
 MIL_event.33.a:0 "..."
 MIL_event.34.t:0 "Millennium's Proposal"
 MIL_event.34.d:0 "Per its French isolation strategy, Millennium proposes trade and tech exchange programs if we distance ourselves from France."
 MIL_event.34.a:0 "Interesting idea."
 MIL_event.34.b:0 "Not worth considering."
 MIL_event.35.t:0 "[FROM.GetName]'s Proposal Accepted"
 MIL_event.35.d:0 "[FROM.GetName] accepted our proposal and is scaling back its ties with France."
 MIL_event.35.a:0 "Our enemy has turned away."
 MIL_event.36.t:0 "[FROM.GetName]'s Proposal Rejected"
 MIL_event.36.d:0 "[FROM.GetName] rejected our isolation strategy and will likely expand ties with France."
 MIL_event.36.a:0 "Regrettable."
 MIL_event.37.t:0 "Millennium-USA Trade Treaty"
 MIL_event.37.d:0 "Millennium has proposed a trade treaty as part of its outreach to Earth nations. We would receive their high-tech goods, like chips, while they import our cheap steel."
 MIL_event.37.a:0 "This is a worthwhile project."
 MIL_event.37.b:0 "Untrustworthy."
 MIL_event.38.t:0 "Millennium-USA Trade Treaty: Accepted"
 MIL_event.38.d:0 "The treaty between the two powers was approved. Representatives praise it as harmony between worlds. Various industries are expected to thrive."
 MIL_event.38.a:0 "Good."
 MIL_event.39.t:0 "Millennium-USA Trade Treaty: Rejected"
 MIL_event.39.d:0 "The USA rejected the treaty, distrusting our motives. They did accept opening embassies, leaving a channel for communication."
 MIL_event.39.a:0 "What?"
 MIL_event.40.t:0 "Millennium's British Isles Reclamation Proposal"
 MIL_event.40.d:0 "A daring plan to assist the British in retaking their home islands. Our technology would be the decisive factor."
 MIL_event.40.a:0 "This is the last chance."
 MIL_event.40.b:0 "Not the right time."
 MIL_event.41.t:0 "British Acceptance"
 MIL_event.41.d:0 "The British government in exile has accepted our offer. The operation is a go."
 MIL_event.41.a:0 "The end of Kaiser Corp!"
 MIL_event.42.t:0 "British Rejection"
 MIL_event.42.d:0 "They are not yet ready to commit to such a massive undertaking. The proposal has been shelved."
 MIL_event.42.a:0 "Ah, well."
 MIL_event.43.t:0 "Academy Division"
 MIL_event.43.d:0 "After the emergency orders ended, students are calling for an end to authoritarian measures. While the orders solved immediate problems, they clearly increased unrest.\n\nWith distrust of leadership now public, we face many problems."
 MIL_event.43.a:0 "A long-term challenge has emerged."
 MIL_event.44.t:0 "Rio's Treatment"
 MIL_event.44.d:0 "The former President's fate must be decided. The student body is divided between justice and mercy."
 MIL_event.44.a:0 "Refer her to a public trial."
 MIL_event.44.b:0 "Force her resignation."
 MIL_event.45.t:0 "Public Trial: Failure"
 MIL_event.45.d:0 "The prosecution could not provide sufficient evidence to overcome her defense. She remains in her position, though weakened."
 MIL_event.45.a:0 "Her eloquence was a major variable."
 MIL_event.46.t:0 "Tsukatsuki Rio's Resignation"
 MIL_event.46.d:0 "She has agreed to step down quietly to avoid further unrest. The era of the Big Sister ends here."
 MIL_event.46.a:0 "It's the easy path."
 MIL_event.47.t:0 "Public Trial: Success"
 MIL_event.47.d:0 "The evidence was overwhelming. Justice has been served, and the President has been removed."
 MIL_event.47.a:0 "We won."
 MIL_event.48.t:0 "Koyuki's Coup!"
 MIL_event.48.d:0 "In a shocking turn of events, Koyuki has seized control of the meeting. Is this a joke, or a new reality?"
 MIL_event.48.a:0 "Seminar unanimously recognized Koyuki's leadership."
 MIL_event.48.b:0 "Koyuki was arrested on the spot."
 MIL_event.49.t:0 "Eridu's Purpose"
 MIL_event.49.d:0 "With Eridu repaired, we must choose: use it for its original purpose—supporting Abi-Eshuh—or repurpose it."
 MIL_event.49.a:0 "Use it for Abi-Eshuh's calculations."
 MIL_event.49.b:0 "We need new military doctrine research."
 MIL_event.50.t:0 "Extra Funds for Eridu"
 MIL_event.50.d:0 "The department rebuilding Eridu requested extra funds, claiming construction will take too long without them."
 MIL_event.50.a:0 "Allocate extra budget."
 MIL_event.50.b:0 "No."
 MIL_event.51.t:0 "Engineering Dept.'s Suggestion"
 MIL_event.51.d:0 "The Engineering Department suggested small changes to the rebuilding process that could increase speed."
 MIL_event.51.a:0 "Modify the process."
 MIL_event.51.b:0 "That's impossible."
 MIL_event.52.t:0 "Extra Funds for Eridu"
 MIL_event.52.d:0 "The Eridu construction department submitted a report requesting more funds."
 MIL_event.53.t:0 "Embezzlement Discovered"
 MIL_event.53.d:0 "We found significant corruption while tracking suspicious activity in the construction department."
 MIL_event.53.a:0 "Root out all corruption."
 MIL_event.53.b:0 "Wait, this could be useful."
 MIL_event.54.t:0 "Construction Expertise"
 MIL_event.54.d:0 "Experience from rebuilding Eridu has allowed us to shorten the process."
 MIL_event.54.a:0 "Carry on."
 MIL_event.55.t:0 "Applications for Eridu Construction"
 MIL_event.55.d:0 "We've gained significant expertise in fortress construction from Eridu."
 MIL_event.55.a:0 "Excellent."
 MIL_event.56.t:0 "Explosion Accident"
 MIL_event.56.d:0 "An algorithm error caused construction robots to drop flammable materials, leading to a large explosion."
 MIL_event.56.a:0 "Damn it!"
 MIL_event.56.b:0 "Provide recovery funds."
 MIL_event.57.t:0 "Construction Proceeding Well"
 MIL_event.57.d:0 "A report states Eridu construction is proceeding without issues."
 MIL_event.58.t:0 "French Liberation Army"
 MIL_event.58.d:0 "The French resistance has been restructured into the French Liberation Army under our command.\n\nThey will continue to operate even after France is liberated."
 MIL_event.58.a:0 "Let them go."
 MIL_event.59.t:0 "Resistance Request for Regular Army Integration"
 MIL_event.59.d:0 "The resistance that rose to help us wants to join the regular army.\n\nWe have a command structure for them, so they can be formally integrated."
 MIL_event.59.a:0 "Disband and merge into the regular army."
 MIL_event.59.b:0 "We still need them."
 MIL_event.60.t:0 "War with France"
 MIL_event.60.d:0 "The war with France has begun! \n\nDuring the war with France, the Resistance level will continuously rise, so you must consistently complete focuses to suppress them and lower the Resistance level. However, as the Resistance level rises repeatedly, the interval between increases will grow longer, meaning it won't haunt the player forever.\n\nAdditionally, [FRA.GetName] possesses various buffs and special abilities aimed at reclaiming Millennium."
 MIL_event.60.a:0 "Then I wish you good luck!"
 MIL_event.60_tt:0 "\nHowever, France has currently lost its mainland. If we can endure for a few years, they will likely collapse on their own due to colonial rebels!"
 MIL_event.61.t:0 "Void"
 MIL_event.61.d:0 "Content regarding Millennium becoming completely silent."
 MIL_event.61.a:0 "..."
 MIL_event.61_tt:0 "The laughter and footsteps of people, the noisy car engines, and the sound of passing trains are gone now. \n What remains now?"
 MIL_event.62.t:0 "The Queen Left Alone"
 MIL_event.62.d:0 "Content stating that only the Queen and machines remain."
 MIL_event.62.a:0 "My Queen...?"
 MIL_event.62_tt:0 "Only the Queen remains here now. The students and citizens have long since vanished."

 MIL_event.63.t:0 "[FROM.GetName]'s Demand for the Maginot Line"
 MIL_event.63.d:0 "[FROM.GetName] has demanded the transfer of the Maginot Line, citing their territorial rights and future defense rights for the eastern region. Our leadership seems quite outraged by this demand, but international circumstances may force us to make an unavoidable choice."
 MIL_event.63.a:0 "We have no other choice."
 MIL_event.63.b:0 "Don't make me laugh."

 MIL_event.64.t:0 "[FROM.GetName]'s Refusal to Cede the Maginot Line"
 MIL_event.64.d:0 "[FROM.GetName] has refused to cede the Maginot Line, which we claim and view as the pivot for future eastern diplomacy."
 MIL_event.64.a:0 "Then it is war."
 MIL_event.64.b:0 "Now is not the time."

 MIL_event.65.t:0 "[FROM.GetName]'s Proposal for Independent Statehood"
 MIL_event.65.d:0 "[FROM.GetName] has expressed concern over our proposal for the Federation of Kivotos and sent an official letter stating they wish to maintain their academy as an independent state. We must now send a response to this proposal."
 MIL_event.65.a:0 "Their capabilities make them suitable as our allies."
 MIL_event.65.b:0 "There are no exceptions."

 MIL_event.66.t:0 "[FROM.GetName]'s Recognition of Independence"
 MIL_event.66.d:0 "Shortly after we informed them that we would not participate in the Federation of Kivotos, [FROM.GetName] approved the maintenance of our autonomous status. Even if the Federation of Kivotos is established later, we will be able to maintain an equal relationship with autonomous status."
 MIL_event.66.a:0 "It was a good deal."

 MIL_event.67.t:0 "[FROM.GetName]'s Refusal of Academy Independence"
 MIL_event.67.d:0 "Shortly after we informed them that we would not participate in the Federation of Kivotos, [FROM.GetName] sent a refusal of our proposal."
 MIL_event.67.a:0 "Then we cannot maintain our alliance."

 MIL_event.68.t:0 "Suppression of the French Resistance Uprising"
 MIL_event.68.d:0 "We have successfully preemptively blocked the French Resistance's plan to prepare a large-scale uprising following a massive bomb attack on our Millennium Tower.\n\nAs a result of the investigation conducted by the Millennium Countermeasures Meeting, the resistance's uprising was discovered in advance, and their plans were thwarted after C&C's surprise attack led to the arrest of their central figures."
 MIL_event.68.a:0 "We have uprooted a resistance."



 MIL_conflict_event.2.t:0 "Severed Electricity"
 MIL_conflict_event.2.d:0 "Opposing factions within Millennium Science School have cut the power to Millennium Tower in protest against Seminar.\n\nThe Millennium Tower, now shrouded in darkness, gives the feeling that such incidents will continue to occur in the future."
 MIL_conflict_event.2.a:0 "Those damn bastards..."
 MIL_conflict_event.2.b:0 "Start restoration immediately."

 MIL_conflict_event.3.t:0 "Heated Debate"
 MIL_conflict_event.3.d:0 "A debate involving aggressive shouting broke out in a club room at Millennium Tower, eventually escalating to a shooting. Fortunately, there were no casualties, but it could deal a significant blow to our authority."
 MIL_conflict_event.3.a:0 "Please, stop."
 MIL_conflict_event.3.b:0 "Punish those involved."

 MIL_conflict_event.4.t:0 "Trusted Seminar"
 MIL_conflict_event.4.d:0 "Despite Veritas's various underhanded schemes, our Seminar has emerged victorious this time. Veritas has faced difficulties in their activities due to this incident and will now be helpful to our operations."
 MIL_conflict_event.4.a:0 "Good."
 MIL_conflict_event.4.b:0 "Attempt to solve the problem in the meantime."

 MIL_conflict_event.5.t:0 "Attacked Seminar Authority"
 MIL_conflict_event.5.d:0 "The student petition movement, which began with anonymous internet accusations, has ended in success. The opposition forces, which have grown rapidly in scale, are criticizing Seminar's high authority, and we must begin responding to this situation."
 MIL_conflict_event.5.a:0 "Oh boy."
 MIL_conflict_event.5.b:0 "Lead the opposition opinion."

 MIL_conflict_event.6.t:0 "Student Protest"
 MIL_conflict_event.6.d:0 "Students have organized protests in response to recent arbitrary policies led by Seminar. They are marching through the Millennium campus, publicizing various abuses within Millennium Science School, and the scale of the protest is growing."
 MIL_conflict_event.6.a:0 "Oh no."
 MIL_conflict_event.6.b:0 "Negotiate with the protesters."

 MIL_conflict_event.7.t:0 "Quantum Mechanics Debate"
 MIL_conflict_event.7.d:0 "Among Seminar's various research projects, many have recently begun to harbor doubts regarding research related to quantum mechanics. They argue that quantum mechanics is unintuitive and that the incompleteness of the world is a contradiction, taking a skeptical stance on the research. This atmosphere soon spread to petitions demanding budget cuts for quantum mechanics research.\n\nSeminar has reorganized the research team to respond to this public opinion and has begun to counter by presenting evidence for quantum mechanics."
 MIL_conflict_event.7.a:0 "Yet light possesses the properties of both waves and particles."

 MIL_conflict_event.8.t:0 "Impossibility Theorem"
 MIL_conflict_event.8.d:0 "A sociology research group published a lengthy sociological paper titled 'The Impossibility Theorem,' causing chaos throughout Millennium. According to their paper, starting with the premise that a desirable and democratic preference system for properly evaluating social welfare levels cannot exist, it includes a long-scale proof.\n\nVarious protesters have cited this paper as a basis to criticize Seminar's administrative system, and it is estimated that chaos will sweep across Millennium as an aftermath of this incident."
 MIL_conflict_event.8.a:0 "It's hard to believe, but it's the truth."
 MIL_conflict_event.8.b:0 "Publish an additional paper on rational dictatorship."

 MIL_mechanical_event.1.t:0 "Bio-Conscription Refusal Protest"
 MIL_mechanical_event.1.desc.a:0 "Recently, several seditious movements have been occurring in the city, accompanied by long manifestos asking why we must die instead of robots. These protesters have begun to demand an expansion of automaton production and refuse the deployment of sentient beings to the front lines. Before long, our soldiers are also being observed moving to join their declaration.\n\nAlthough the protesters are currently few in number, considering the public opinion, it will spread like wildfire if we do not accept their views."
 MIL_mechanical_event.1.desc.b:0 "A large-scale crowd is carrying out a conscription refusal movement against us. These protesters have taken a fierce stand against the deployment of sentient beings to the front lines while demanding an expansion of automaton production. It seems a significant number of our soldiers are also sympathizing with their declaration.\n\nProtesters are already securing their own armaments, and soldiers have been observed marching alongside them."
 MIL_mechanical_event.1.desc.c:0 "The conscription refusal movement that emerged shortly after we stopped automaton production seems to have grown to a significant scale. They are promoting propaganda that we are deploying ordinary citizens to the front lines despite having the technological capability. \n\nIf we leave them be, our own army will eventually turn their eyes against us."
 MIL_mechanical_event.1.a:0 "We will guarantee additional robot production."
 MIL_mechanical_event.1.b:0 "If you hate war that much, let it be as they say."
 MIL_mechanical_event.1.c:0 "Restore the production process."
 MIL_mechanical_event.1.d:0 "We do not negotiate with protesters!"

 MIL_resistance_control.1.t:0 "Loss of Northern Territory!"
 MIL_resistance_control.1.d:0 "Since the last war, we have lost control of Millennium's Northern Territory, the symbol of our technology and our heart. Consequently, all Millennium technologies centered around the Millennium Tower have taken a serious blow."
 MIL_resistance_control.1.a:0 "Our heart has been stolen."

 MIL_resistance_control.2.t:0 "Loss of Eastern Territory!"
 MIL_resistance_control.2.d:0 "Since the last war, we have lost control of Millennium's Eastern Territory."
 MIL_resistance_control.2.a:0 "Oh boy."

 MIL_resistance_control.3.t:0 "Loss of Western Territory!"
 MIL_resistance_control.3.d:0 "Since the last war, we have lost control of Millennium's Western Territory."
 MIL_resistance_control.3.a:0 "Oh boy."

 MIL_resistance_control.4.t:0 "Loss of Southeastern Territory!"
 MIL_resistance_control.4.d:0 "Since the last war, we have lost control of Millennium's Southeastern Territory."
 MIL_resistance_control.4.a:0 "Oh boy."

 MIL_resistance_control.5.t:0 "Loss of Southern Territory!"
 MIL_resistance_control.5.d:0 "Since the last war, we have lost control of Millennium's Southern Territory."
 MIL_resistance_control.5.a:0 "Oh boy."

 MIL_resistance_control.6.t:0 "Reclamation of Northern Territory!"
 MIL_resistance_control.6.d:0 "We have regained control of Millennium's Northern Territory."
 MIL_resistance_control.6.a:0 "It has returned once again."

 MIL_resistance_control.7.t:0 "Reclamation of Eastern Territory!"
 MIL_resistance_control.7.d:0 "We have regained control of Millennium's Eastern Territory."
 MIL_resistance_control.7.a:0 "It has returned once again."

 MIL_resistance_control.8.t:0 "Reclamation of Western Territory!"
 MIL_resistance_control.8.d:0 "We have regained control of Millennium's Western Territory."
 MIL_resistance_control.8.a:0 "It has returned once again."

 MIL_resistance_control.9.t:0 "Reclamation of Southeastern Territory!"
 MIL_resistance_control.9.d:0 "We have regained control of Millennium's Southeastern Territory."
 MIL_resistance_control.9.a:0 "It has returned once again."

 MIL_resistance_control.10.t:0 "Reclamation of Southern Territory!"
 MIL_resistance_control.10.d:0 "We have regained control of Millennium's Southern Territory."
 MIL_resistance_control.10.a:0 "It has returned once again."

 MIL_fucking_nuke_drop.1.t:0 "Nuke Dropped on [FROM.FROM.GetName]"
 MIL_fucking_nuke_drop.1.d:0 "X"
 MIL_fucking_nuke_drop.1.a:0 "..."
 MIL_fucking_nuke_drop.1.b:0 "I don't want to see nuclear weapon drop events."

