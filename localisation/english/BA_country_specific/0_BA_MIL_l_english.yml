## Aris Route
 MIL_broken_cog:0 "The Broken Gear"
 MIL_broken_cog_desc:0 "Every machine has a flaw. This one was simply more... significant than others."
 MIL_come_back_queen:0 "Princess of the Nameless"
 MIL_come_back_queen_desc:0 "Codename <AL_1S> remained in the ruins as the <Princess> of the <Nameless Ones>. However, due to Millennium's mistake, the <Princess> has awakened, and they have paid the price. From now on, Millennium will obey only the <Princess> of the Nameless."
 MIL_lightsword_supernova:0 "Sword of Light, Supernova"
 MIL_lightsword_supernova_desc:0 "The Sword of Light, Supernova, is AL_1S's signature weapon and a masterpiece of the Engineering Department. AL_1S has decided to take the main cannon that once consumed 70% of their budget."
 MIL_restart:0 "Restart"
 MIL_restart_desc:0 "Immediately after President Rio's death, many systems and factories stopped, but it is now time to restart them."
 MIL_queens_day:0 "Queen's Day"
 MIL_queens_day_desc:0 "<Princess of the Nameless Gods> codename <AL_1S> has now been reborn as the true Queen of the Nameless Priests. She will no longer be called <Princess>, but <Queen>. The Princess has transformed into the Queen."
 MIL_use_lightsword:0 "Utilize Light Sword"
 MIL_use_lightsword_desc:0 "It is time to use the Sword of Light against the strong enemies of Kivotos. They won't be easy, but the power of the light sword will be enough to crush them."
 MIL_unique_system:0 "Independent System"
 MIL_unique_system_desc:0 "We will build our own unique system to expand our influence in Kivotos and rule the world in our own way."
 MIL_upgrade_AL_1S:0 "Upgrade AL-1S"
 MIL_upgrade_AL_1S_desc:0 "Optimizing the Queen's chassis. Every circuit, every joint, perfected for the task ahead."
 MIL_make_robots:0 "Produce Robots"
 MIL_make_robots_desc:0 "Building the loyal subjects of the new era. Metal and silicon in service to the throne."
 MIL_use_robots:0 "Utilize Robots"
 MIL_use_robots_desc:0 "Deploying our mechanical host to enforce the Queen's will across the land."
 MIL_only_queen_party:0 "A Party Only for the Queen"
 MIL_only_queen_party_desc:0 "A celebration of our new order. All students shall rejoice, for the Queen is merciful."
 MIL_how_use_lightsword:0 "§RHostility§!"
 MIL_how_use_lightsword_desc:0 "The sword is not just a tool; it is a statement of our intent toward those who would oppose us."
 MIL_use_peaceful:0 "Peaceful Use"
 MIL_use_peaceful_desc:0 "Harnessing the power of the supernova to provide energy and prosperity to all—under the Queen's guidance."
 MIL_use_inwar:0 "Utilize in War"
 MIL_use_inwar_desc:0 "Unleashing the full, terrible power of the light sword upon the battlefields of the world."
