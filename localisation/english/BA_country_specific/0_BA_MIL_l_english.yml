#Intro
 MIL_country_intro_header: "Academy of Logic and Reason"
 MIL_country_intro_content: "Along with Trinity and Gehenna, it is one of the three major academies of Kivotos, valuing logic and technology above all others. Though it has a shorter history compared to Trinity and Gehenna, its influence spans all of Kivotos as a highly advanced academy. Particularly, if new technology or innovation emerges in Kivotos, it almost always begins at Millennium, an academy specialized in science and research.\n\nMillennium's student council, Seminar, began as a research club to solve the Seven Unsolved Challenges. The specialized research fields and organizations established during the verification and experimentation phases became the predecessors of Millennium's current clubs. Seminar can be considered the origin of all other clubs in Millennium and the academy itself.\n\nWhen the academy landed in a new world after experiencing a supernatural phenomenon, the first things they saw were strangers with Molotov cocktails in their hands. From their perspective, the academy was merely an extra-dimensional invader, and they resisted in their own way. However, they could not overcome the overwhelming technological gap and were swept away.\nSoldiers who refused to surrender hid among civilians and continued terror attacks against the academy, and the area became a restricted access zone.\n\n§YDev: SKSKle§!"
 MIL_guide: "\nPresident of Seminar\n£white_dot Emerge victorious in the Millennium Power Struggle\n£white_dot Sweep the French Resistance.\n£white_dot Handle the Ruins problem\n£white_dot Be reborn as the Big Sister\n\n\nDirector of Veritas\n£white_dot Emerge victorious in the Millennium Power Struggle\n£white_dot Resolve the French Resistance problem\n£white_dot Handle the Ruins problem\n£white_dot Fulfill your duties as the Super Genius Sickly Beautiful Girl\n\n\n§RRough waves are approaching Millennium.§!"
 # Country Description
 MIL_GATHERING_STORM_DESC:0 "Under the leadership of the Big Sister, Rio, Millennium Science School is faced with a situation where they must occupy French territory due to the unexpected Great War phenomenon. In the chaos, Millennium swiftly occupied France, and the French government along with some citizens fled to Algeria.\n\nFollowing the occupation, Millennium has faced constant internal rebellion and external threats due to persistent struggle. Resistance within French territory continues, and Algeria is looking for any opportunity to counterattack."
 MIL_GATHERING_STORM_DESC: "Under the leadership of the Big Sister, Rio, Millennium Science School is faced with a situation where they must occupy French territory due to the unexpected Great War phenomenon. In the chaos, Millennium swiftly occupied France, and the French government along with some citizens fled to Algeria.\n\nFollowing the occupation, Millennium has faced constant internal rebellion and external threats due to persistent struggle. Resistance within French territory continues, and Algeria is looking for any opportunity to counterattack."

