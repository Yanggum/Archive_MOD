 MIL_decentralization_of_power:0 "Decentralize Seminar Power"
 MIL_decentralization_of_power_desc:0 "Spreading the authority to prevent the rise of another 'Big Sister'."
 MIL_power_surveillance:0 "Power Surveillance System"
 MIL_power_surveillance_desc:0 "A system of checks and balances to ensure that power is never abused."
 MIL_conflict_with_veritas:0 "Conflict with Veritas"
 MIL_conflict_with_veritas_desc:0 "Addressing the friction between the central authority and the seekers of truth."
 MIL_union:0 "Harmonization"
 MIL_union_desc:0 "Bringing the disparate elements of our society together into a single, cohesive whole."
 MIL_absorption:0 "Absorption"
 MIL_absorption_desc:0 "Integrating external territories and populations fully into the Millennium grid."
 MIL_structure_organization:0 "Systematize Structure"
 MIL_structure_organization_desc:0 "Applying scientific management principles to the entire state hierarchy."
 MIL_millennium_general_engineering_academy:0 "Millennium General Engineering Academy"
 MIL_millennium_general_engineering_academy_desc:0 "A new institution to bring our engineering expertise to the masses."
 MIL_maginot_line_demand:0 "Demand Maginot Line"
 MIL_maginot_line_demand_desc:0 "Formally claiming the ultimate defensive line for our own protection."
 MIL_french_territorial_claim:0 "Claim French Territory"
 MIL_french_territorial_claim_desc:0 "Asserting our right to rule the lands that have become our new home."
 MIL_french_workers:0 "French Workers"
 MIL_french_workers_desc:0 "Integrating the local labor force into our industrial machine."
 MIL_factory_of_europe:0 "Factory of Europe"
