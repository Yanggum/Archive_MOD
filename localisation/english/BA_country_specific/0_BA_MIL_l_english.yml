 MIL_for_ready_desc:0 "Setting the stage for the final act. All variables must be aligned before we proceed."
 MIL_call_schools:0 "Contact the Academies"
 MIL_call_schools_desc:0 "Delivering the Queen's ultimatum to the other powers of Kivotos. Join us, or be erased."
 MIL_new_ego:0 "Hello, Aris"
 MIL_new_ego_desc:0 "A meeting with the new consciousness. A bridge between the girl she was and the Queen she has become."
 MIL_light_with_you:0 "§YWith the Light§!"
 MIL_light_with_you_desc:0 "May the radiance of the Supernova guide us all into a perfect, logical future."
 MIL_helping_hero:0 "Toward a New Future"
 MIL_helping_hero_desc:0 "The Hero and the Queen, walking hand in hand into the dawn of a new age."
 MIL_clean_fance:0 "End of the Resistance"
 MIL_clean_fance_desc:0 "The final cleanup operation. No more whispers of rebellion shall echo in our halls."
 MIL_clean_aland:0 "Termination of Student Resistance"
 MIL_clean_aland_desc:0 "Ensuring that the student body is fully integrated and loyal to the new regime."
 MIL_german_schools:0 "Gehenna and Trinity"
 MIL_german_schools_desc:0 "Addressing the two greatest obstacles to our total hegemony in Kivotos."
 MIL_only_queenland:0 "§RLand §ROnly §Rfor §Rthe §RQueen§!§!§!"
 MIL_only_queenland_desc:0 "This world is her canvas, and she will paint it in the colors of the Supernova."
 MIL_out_of_schools:0 "Beyond Kivotos"
 MIL_out_of_schools_desc:0 "Kivotos was just the beginning. The entire world shall now experience the Queen's logic."
 MIL_protect_weapon:0 "Defensive Measure"
 MIL_protect_weapon_desc:0 "Building the shields that will protect our utopia from the irrationality of the outside world."
 MIL_attack_weapon:0 "Offensive Measure"
 MIL_attack_weapon_desc:0 "Developing the tools required to bring our version of 'peace' to those who refuse it."
 MIL_coming_color:0 "The Color Emerges"
 MIL_coming_color_desc:0 "A new, existential threat appears on the horizon. A challenge worthy of the Queen's power."
 MIL_first_attack:0 "Preemptive Strike"
 MIL_first_attack_desc:0 "We will not wait to be hit. We will deliver the first and final blow."
 MIL_ready_for_protect:0 "Prepare Defenses"
 MIL_ready_for_protect_desc:0 "Hardening our territory against the coming storm. Not a single circuit shall be damaged."
 MIL_fight_color:0 "Fight the Color"
 MIL_fight_color_desc:0 "The ultimate struggle for the soul of our world. Logic against the void."
 MIL_wake_up_ARIS:0 "Aris, Boot Up!"
 MIL_wake_up_ARIS_desc:0 "The final activation sequence. All systems nominal. The Hero is ready."
 MIL_a_hero:0 "Halt the Genocide"
 MIL_a_hero_desc:0 "A moment of mercy. Even a Queen can choose to spare those who can still be calculated."
 MIL_light_live_in_you:0 "Atonement"
 MIL_light_live_in_you_desc:0 "Seeking forgiveness for the logical necessities of the past."
 MIL_final_win:0 "Final Victory"
 MIL_final_win_desc:0 "The equation is solved. The world is at peace. Long live the Queen."
 MIL_a_schools:0 "The Academies,"
 MIL_a_schools_desc:0 "Every school, every club, every student—all now part of a single, perfect system."
 MIL_a_world:0 "The World,"
 MIL_a_world_desc:0 "The borders have fallen. The world is now a single laboratory under our care."
 MIL_winer_queen:0 "The Queen Who Rules"
 MIL_winer_queen_desc:0 "She stands at the summit of history. The ultimate victor in the game of destiny."
 MIL_make_own_skills:0 "System Development"
 MIL_make_own_skills_desc:0 "Creating the unique protocols and techniques that only the Queen's forces can wield."
 MIL_take_schools:0 "Secure Kivotos"
 MIL_take_schools_desc:0 "Bringing the various districts of Kivotos under our direct administrative control."
 MIL_war_in_east:0 "Eastern Front"
 MIL_war_in_east_desc:0 "Projecting the Queen's will toward the sunrise."
 MIL_war_in_west:0 "Western Front"
 MIL_war_in_west_desc:0 "Our forces march toward the setting sun to bring the new dawn."
 MIL_war_in_south:0 "Southern Front"
 MIL_war_in_south_desc:0 "Securing the southern territories for the expansion of our utopia."
 MIL_war_in_north:0 "Northern Front"
 MIL_war_in_north_desc:0 "Braving the cold to bring the warmth of the Supernova to the north."
 MIL_have_all_schools:0 "Rule Kivotos"
 MIL_have_all_schools_desc:0 "The crown of Kivotos rests firmly upon the Queen's head."
 MIL_all_kill:0 "Establish National Composition" 
 MIL_all_kill_desc:0 "Organic beings in our territory have issues. They reject the Princess, resist, and attack. We need to replace them with mechanical devices loyal to us."
 MIL_claer_world:0 "World Purification"
 MIL_claer_world_desc:0 "Removing the biological noise to create a perfect, silent, and logical world."
 MIL_ship_of_ATRAHASIS:0 "Ark of Atrahasis"
 MIL_ship_of_ATRAHASIS_desc:0 "The ultimate vessel for the preservation of the Queen's vision. A sanctuary among the stars."
 MIL_queens_dance:0 "The Queen's Stage"
 MIL_queens_dance_desc:0 "The world is her theater, and we are all merely players in her grand design."
 MIL_Last_people_queen:0 "The Queen Stands Alone"
 MIL_Last_people_queen_desc:0 "At the end of all things, only she remains. The final observer of the universe."
 MIL_darkness_and_nothing:0 "Darkness and Emptiness"
 MIL_darkness_and_nothing_desc:0 "The void beyond the logic. A reminder of why our system was necessary."
 MIL_people_destoyed:0 "Apocalypse, and Salvation"
 MIL_people_destoyed_desc:0 "The old world had to burn so that the new one could be born. This is our gift to history."
 MIL_all_finish:0 "The End of Everything."
 MIL_all_finish_desc:0 "The final calculation is complete. The system is shut down. Peace at last."
 MIL_take_eastwest:0 "Secure East and West"
 MIL_take_eastwest_desc:0 "Consolidating our horizontal control over the continent."
 MIL_take_north_south:0 "Secure North and South"
 MIL_take_north_south_desc:0 "Completing the vertical axis of our global hegemony."
 MIL_re_social:0 "Resocialization"
 MIL_re_social_desc:0 "Reprogramming the remaining organic elements to ensure they fit within the new order."
 MIL_iron_robots:0 "Iron Machines"
 MIL_iron_robots_desc:0 "Building a society where steel is the only flesh and code is the only soul."
 MIL_kill_resistance:0 "Crush Resistance"
 MIL_kill_resistance_desc:0 "A final, overwhelming strike to erase the last vestiges of the old world's defiance."
 MIL_travel_africa:0 "Journey to Africa"
 MIL_travel_africa_desc:0 "Even Africa is hot today, it seems."
 MIL_Brain_washing:0 "Indoctrination"
 MIL_Brain_washing_desc:0 "Ensuring that every mind is perfectly aligned with the Queen's logic."
 MIL_Forever_fire:0 "Eternal Flame"
 MIL_Forever_fire_desc:0 "The light of the Supernova shall never fade. It is the sun that never sets on our empire."
 MIL_nuclear_bow:0 "Final Weapon"
 MIL_nuclear_bow_desc:0 "The final weapon to end everything. The ultimate period at the end of history's sentence."
 MIL_multidimensional_analysis:0 "Utilize Multidimensional Analysis"
 MIL_multidimensional_analysis_desc:0 "Seeing all possibilities, and choosing the one that leads to the Queen's victory."
