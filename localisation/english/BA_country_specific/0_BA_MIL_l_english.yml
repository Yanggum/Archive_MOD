#Millennium Focuses
 MIL_SEMINA:0 "Call Seminar"
 MIL_SEMINA_desc:0 "To assess the situation following the Great Shift, Student Council President Rio has decided to summon the Seminar executives."
 MIL_tower_recovery:0 "Power Millennium Tower"
 MIL_tower_recovery_desc:0 "In the wake of total upheaval, emergency power systems are activated to buy time and restore the severed power supply."
 MIL_network_recovery:0 "Restore Network Systems"
 MIL_network_recovery_desc:0 "It took some time, but utilizing emergency power, we have successfully restored the network systems."
 MIL_resistance_resolution:0 "Resolve Resistance"
 MIL_resistance_resolution_desc:0 "Resistance from locals against us, the outsiders, has been confirmed. They threaten our security. However, President Rio and Veritas's Himari hold conflicting views on how to handle this."
 MIL_east_resistance_resolution:0 "Sweep Southern Resistance"
 MIL_east_resistance_resolution_desc:0 "Resistance forces concentrated in the south threaten Millennium students. We must protect them through a sweeping operation."
 MIL_South_resistance_resolution:0 "Sweep Eastern Resistance"
 MIL_South_resistance_resolution_desc:0 "Eastern resistance forces are close enough to threaten Millennium Tower. We must sweep them to eliminate the threat."
 MIL_french_problem:0 "The French Problem"
 MIL_french_problem_desc:0 "The French remaining in the area are quiet for now but must be monitored. How we handle them is in our hands."
 MIL_complete:0 "End Emergency Response"
 MIL_complete_desc:0 "Thanks to swift action, the emergency has been resolved. Now is the time to prepare for the future."
 MIL_diplomatic_with_SOV:0 "Diplomatic Treaty with the USSR"
 MIL_diplomatic_with_SOV_desc:0 "While the Soviet Union clearly faces various socialist challenges, we need a new socialist ally. We will expand relations with international socialist states through economic and social cooperation with the USSR."
 MIL_join_SOV:0 "Join Comintern"
 MIL_join_SOV_desc:0 "By joining the Comintern, our academy enters the stage of international revolution and can easily secure our influence."
 MIL_administrative_reorganization:0 "Administrative Reorganization"
 MIL_administrative_reorganization_desc:0 "For administrative stability and the cause of ideology, bureaucrats with anti-socialist tendencies must be replaced."
 MIL_union_representation_act:0 "Labor Union Protection Act"
 MIL_union_representation_act_desc:0 "Labor unions have been thoroughly ignored during the economic and political crises following the French-Millennium War. We will guarantee their voice in government to increase workers' rights."
 MIL_agricultural_collectivization:0 "Agricultural Collectivization"
 MIL_agricultural_collectivization_desc:0 "Farmers who own and operate their own means of production possess inherently petty-bourgeois values. To guarantee a standard of living for tenant and poor farmers, we will vest all land in local councils."
 MIL_curriculum_organization:0 "Curriculum Organization"
 MIL_curriculum_organization_desc:0 "We will officially incorporate Marxist ideology based on dialectical materialism into our school curriculum to nurture the seeds of future socialism."
 MIL_council_focus:0 "Workers' Councils"
 MIL_council_focus_desc:0 "Workers in their workplaces will organize extensive councils to form local administrations. This will build a more democratic state system and check the excesses of the Central Committee."
 MIL_hostile_to_SOV:0 "Oppose the USSR"
 MIL_hostile_to_SOV_desc:0 "The Soviet Union has essentially deviated from Marxist ideology and is forcing a socialist economy without the necessary productivity. This has led to a collapse of workers' rights and political instability; we must walk a different path."
 MIL_with_SHE:0 "Alliance with Schale"
 MIL_with_SHE_desc:0 "The General Student Council and the AI A.R.O.N.A. in the 'Lowlands' have built a socialist AI system. By joining them, we can achieve the Kivotos Revolution."
 MIL_ourselves:0 "Millennium Revolution"
 MIL_ourselves_desc:0 "Hanaoka Yuzu has presented a new paradigm of communism through a Millennium Socialist Revolution based on science and experimentation. The reformers led by Yuzu will dismantle the old oligarchy."
 MIL_enemy_of_the_revolution:0 "Enemy of the Revolution"
 MIL_enemy_of_the_revolution_desc:0 "Millennium Science School is surrounded by hostile reactionary states. To overcome this, everyone in our academy must unite for a massive struggle."
 MIL_concentration_of_power:0 "Concentration of Power"
 MIL_concentration_of_power_desc:0 "Establishing control over the economy requires more types of social power. We will organize a larger administration to strengthen and develop economic control."
 MIL_international_industry:0 "International Industry"
 MIL_international_industry_desc:0 "Industrial and economic solidarity with fraternal republics will bring higher levels of technological development and industrial growth."
 MIL_special_economic_zone:0 "Establish Special Economic Zones"
 MIL_special_economic_zone_desc:0 "Millennium's economic growth is stagnating. We will create special zones offering tax cuts and infrastructure to allow businesses to thrive and lead our economy."
 MIL_NEP:0 "New Economic Policy"
 MIL_NEP_desc:0 "Even a perfect calculation needs room for human variables. We shall introduce a temporary measure to revitalize the market while maintaining the core logic of our system."
 MIL_partial_market_opening:0 "Partial Market Opening"
 MIL_partial_market_opening_desc:0 "Isolation is the enemy of efficiency. By opening specific sectors to the global market, we can acquire the external data and resources required for our next leap."
 MIL_control_of_key_industries:0 "Control of Key Industries"
 MIL_control_of_key_industries_desc:0 "The fundamental variables of our economy cannot be left to chance. Seminar will directly oversee all critical industrial nodes."
 MIL_agricultural_management_act:0 "Agricultural Management Act"
 MIL_agricultural_management_act_desc:0 "Optimizing the calorie-to-labor ratio is essential. We will implement a systematic management plan for all agricultural output to ensure no student goes hungry."
 MIL_millennium_central_bank:0 "Millennium Central Bank"
 MIL_millennium_central_bank_desc:0 "Economy is currently managed by Seminar. However, running a nation is different from running an academy. We will organize a bank of experts to build a flexible economy."
 MIL_acceptance_of_the_franc:0 "Acceptance of the Franc"
 MIL_acceptance_of_the_franc_desc:0 "The Franc is the currency most familiar to the French. By recognizing it as official tender, we will win local favor and accelerate stabilization."
 MIL_market_liberation:0 "Market Liberation"
 MIL_market_liberation_desc:0 "True innovation comes from the competition of ideas—and capital. We will remove the restrictive barriers to allow the market to find its own equilibrium."
 MIL_market_control:0 "Inflation Control"
 MIL_market_control_desc:0 "Millennium focused on solving post-Shift problems but neglected inflation. We will resolve this by reducing the currency supply."
 MIL_diplomatic_irrigation_improvements:0 "Diplomatic Relation Improvements"
 MIL_diplomatic_irrigation_improvements_desc:0 "Millennium's brilliance should be shared, not feared. We will deploy our diplomatic corps to smooth over recent 'misunderstandings' with our neighbors."
 MIL_france_isolation:0 "French Isolation"
 MIL_france_isolation_desc:0 "To ensure Millennium's safety, we must ensure that those who would subvert our order find no friends in the international community."
 MIL_atlantic_diplomacy:0 "Atlantic Diplomacy"
 MIL_atlantic_diplomacy_desc:0 "The vast ocean is but a bridge for the right technology. We will look toward the powers across the Atlantic to secure our place in this new world."
 MIL_industrial_exchanges_USA:0 "Trade with the USA"
 MIL_industrial_exchanges_USA_desc:0 "The American industrial machine requires precision, and Millennium provides nothing less. We shall establish a mutually beneficial exchange of raw materials for high-tech components."
 MIL_treaty_england:0 "Treaty with England"
 MIL_treaty_england_desc:0 "A formal agreement with the British will stabilize our northern perimeter. In the pursuit of science, a stable border is a non-negotiable requirement."
 MIL_hegemony_alliance:0 "Hegemony Alliance"
 MIL_hegemony_alliance_desc:0 "Why settle for being a member when we can be the leader? We will form an alliance where Millennium's logic serves as the foundational law."
 MIL_administration_seminar:0 "Seminar Administration"
 MIL_administration_seminar_desc:0 "The most efficient way to govern is through those who can calculate the consequences. Seminar will take full responsibility for the day-to-day administration of the state."
 MIL_the_economy:0 "Defense Industry"
 MIL_the_economy_desc:0 "Security is the prerequisite for research. We will pivot our industrial base to ensure that our students are the best-equipped force on the planet."
 MIL_asymmetric_forces:0 "Asymmetric Forces"
 MIL_asymmetric_forces_desc:0 "We do not need to match them man for man. With stealth and superior engineering, we will ensure that a single Millennium unit is worth an entire division."
 MIL_challenging_maritime_hegemony:0 "Challenging Maritime Hegemony"
 MIL_challenging_maritime_hegemony_desc:0 "The seas are free only if we have the power to keep them so. We will develop a naval doctrine that puts the 'science' in 'sea power'."
 MIL_maintaining_air_superiority:0 "Maintaining Air Superiority"
 MIL_maintaining_air_superiority_desc:0 "The sky is the ultimate high ground. We will ensure that Millennium's wings are always the ones looking down on the battlefield."
 MIL_threat_from_beyond_the_coast:0 "Threat from Beyond the Coast"
 MIL_threat_from_beyond_the_coast_desc:0 "Our sensors indicate potential variables emerging from the horizon. We must prepare our coastal defenses for any external intervention."
 MIL_intercontinental_bomber:0 "Intercontinental Bomber"
 MIL_intercontinental_bomber_desc:0 "The reach of Millennium's logic should be global. We will develop aircraft capable of delivering 'corrections' to any point on the map."
 MIL_preparing_for_the_coming_war:0 "Maximize Production"
 MIL_preparing_for_the_coming_war_desc:0 "Efficiency is the only virtue in total war. Every factory, every robot, and every student must be optimized for the upcoming conflict."
 MIL_millenium_defense_committee:0 "Millennium Defense Committee"
 MIL_millenium_defense_committee_desc:0 "A dedicated body to oversee the defense of the academy. Because 'trusting the process' isn't a viable military strategy."
 MIL_establishing_army_tactics:0 "Systematic Tactic Establishment"
 MIL_establishing_army_tactics_desc:0 "War is a series of equations. We will solve them by establishing a standardized, logical set of tactical responses for our ground forces."
 MIL_rifle_improvement:0 "Rifle Improvement"
 MIL_rifle_improvement_desc:0 "Even the most basic tool can be optimized. We will apply Millennium engineering to our standard-issue rifles for maximum lethality."
 MIL_modern_tank_technology:0 "Modern Tank Production"
 MIL_modern_tank_technology_desc:0 "The era of the heavy horse is over. We will roll out armored units that are as much supercomputers as they are war machines."
 MIL_millenium_engineer_department_war_bureau:0 "Engineering Dept. War Bureau"
 MIL_millenium_engineer_department_war_bureau_desc:0 "Let the engineers design the war. When the Engineering Department takes the lead, the battlefield becomes a giant laboratory."
 MIL_ruin_investigation:0 "Investigate Ruins"
 MIL_ruin_investigation_desc:0 "The ruins contain data we cannot ignore. We will send a specialized team to extract every scrap of information from these ancient structures."
 MIL_AL_1S_problem:0 "The AL-1S Problem"
 MIL_AL_1S_problem_desc:0 "A variable has emerged from the ruins. We must decide if she is a bug in the system or the ultimate patch for our future."
 MIL_automation_economy:0 "Automated Economy"
 MIL_automation_economy_desc:0 "Human management is inefficient and unstable. We will re-establish the automated factory and transport systems Millennium used before the Shift."
 MIL_consumer_goods_production:0 "Focus on Civilian Industry"
 MIL_consumer_goods_production_desc:0 "War is a non-productive activity. We will apply Millennium technology to civilian industry to boost growth and widen the gap with other nations."
 MIL_heavy_industry_focus:0 "Expand Defense Spending"
 MIL_heavy_industry_focus_desc:0 "Internal and external enemies threaten us. We will focus investments on the defense industry to crush future threats with superior technology."
 MIL_precision_production_planning:0 "Precision Production Planning"
 MIL_precision_production_planning_desc:0 "To build an ideal economy, we must form precision teams and establish meticulous production plans, even if it overburdens Seminar."
 MIL_expanding_the_base:0 "Expand Foundational Technology"
 MIL_expanding_the_base_desc:0 "French infrastructure is severely lacking. To run our automated facilities, we must improve local infrastructure and unify industrial standards."
 MIL_cogwheel_society:0 "Cogwheel Society"
 MIL_cogwheel_society_desc:0 "Like the gears of a watch, we will design every part of society to maintain a perfect balance between supply and demand."
 MIL_mechanized_army:0 "Mechanized Host"
 MIL_mechanized_army_desc:0 "To preserve the academy, we need massive war material. By deploying steel beasts, we will achieve both qualitative and numerical superiority. They will yield to our disciplined forces!"
 MIL_automation_industry:0 "Industrial Automation"
 MIL_automation_industry_desc:0 "French products are prone to failure and their workers are hostile. We will replace labor with machines to automate industry, just like before the Shift."
 MIL_near_future_demand_analysis:0 "Near-Future Demand Analysis"
 MIL_near_future_demand_analysis_desc:0 "By analyzing consumers, we can concentrate investment on products predicted to be hits, ensuring efficient investment!"
 MIL_customized_production_system:0 "Customized Production System"
 MIL_customized_production_system_desc:0 "While mass production might be difficult in the short term, building customized lines will allow us to operate the economy with extreme flexibility."
 MIL_economy_control:0 "Command Economy"
 MIL_economy_control_desc:0 "We have the capacity for superior planned economy programs. Academy leadership will strengthen economic control to enhance market dominance."
 MIL_destroy_french_market:0 "Restructure Industrial Base"
 MIL_destroy_french_market_desc:0 "The old French market is an outdated algorithm. We will dismantle it completely to build a more efficient, Millennium-compliant industrial structure."
 MIL_market_flexibility:0 "Market Flexibility"
 MIL_market_flexibility_desc:0 "Local markets have proven resilient. We will adopt French capitalism and introduce a market economy system to utilize this utility."
 MIL_semina_rework:0 "Seminar Rework"
 MIL_semina_rework_desc:0 "Even Seminar must adapt. We will optimize our internal hierarchy to better handle the complexities of governing a territorial state."
 MIL_capitalist_conciliation:0 "Capitalist Conciliation"
 MIL_capitalist_conciliation_desc:0 "Capitalists are predictable variables. By offering them the right incentives, we can ensure their interests align perfectly with Millennium's goals."
 MIL_market_subordination:0 "Subordinate the Second Economy"
 MIL_market_subordination_desc:0 "Controlling the underground economy is vital for systemic victory. We will subordinate the French economy to secure power for our industrial programs."
 MIL_mixed_economy:0 "Found Department of Economic Development"
 MIL_mixed_economy_desc:0 "A blend of planned efficiency and market vitality. We will establish a new department to oversee this complex economic synthesis."
 MIL_economic_plan:0 "Economic Development Plan"
 MIL_economic_plan_desc:0 "A comprehensive roadmap for our growth. Every variable has been accounted for to ensure a steady upward trajectory in our GDP."
 MIL_command_to_chaebol:0 "Orders to the Chaebols"
 MIL_command_to_chaebol_desc:0 "By letting them manage the economy, we can distribute Seminar's workload. It is time to show who the true controller of France is."
 MIL_backing_capitalist:0 "Win Over Capitalists"
 MIL_backing_capitalist_desc:0 "Most French capitalists can judge where the profit lies. We can easily make them betray their homeland for the right price."
 MIL_centralized_economy:0 "Centralized Economic Integration"
 MIL_centralized_economy_desc:0 "One vision, one plan, one economy. We will integrate all disparate economic sectors into a single, centrally-monitored system."
 MIL_economicintervention:0 "Reconstruct French Market"
 MIL_economicintervention_desc:0 "Millennium's economy collapsed after the civil war. Shortages and black markets are rampant. We will fix this by reactivating factories and supply chains."
 MIL_start_economy:0 "Restore Industrial Foundation"
 MIL_start_economy_desc:0 "Industry was destroyed in our struggle for survival. We must restore it to ensure the academy's continued existence."
 MIL_railway_connection:0 "Reconnect Railways"
 MIL_railway_connection_desc:0 "Railways were shattered during the Shift and the subsequent war. We will work to resolve these logistical issues."
 MIL_state_capitalism:0 "State Capitalism"
 MIL_state_capitalism_desc:0 "State capitalism balances individual freedom and development. We will adopt this to build a stable, 'democratic' economy."
 MIL_megacorp:0 "Future Economics"
 MIL_megacorp_desc:0 "Traditional economic models are obsolete. We will pioneer a new system where the boundary between state and corporation is functionally non-existent."
 MIL_expansion_of_financial_industry:0 "Expand Financial Industry"
 MIL_expansion_of_financial_industry_desc:0 "Capital is just another form of energy. We will expand our financial sector to better harness and direct the flow of this energy."
 MIL_cryptocurrency:0 "Cryptocurrency"
 MIL_cryptocurrency_desc:0 "Millennium used cryptocurrency before the Shift. We will adopt it again to manage the economy more efficiently and rapidly."
 MIL_city_investment:0 "Improve Military Technology"
 MIL_city_investment_desc:0 "Urban centers are the best labs. We will invest in city-based research hubs to refine our latest military hardware."
 MIL_facility_modernization:0 "Facility Modernization"
 MIL_facility_modernization_desc:0 "Outdated facilities lead to outdated results. We will upgrade every factory and lab to Millennium's exacting modern standards."
 MIL_millennium_economy:0 "Millennium Economy"
 MIL_millennium_economy_desc:0 "The final form of our economic evolution. A perfectly calculated system that provides for every student while fueling infinite progress."
 MIL_soviet_model:0 "The Soviet Model"
 MIL_soviet_model_desc:0 "The USSR successfully operated a planned economy where the state owned everything. We will reference this to introduce an even more advanced version in Millennium."
 MIL_redistribution_wealth:0 "Redistribution of Wealth"
 MIL_redistribution_wealth_desc:0 "We will confiscate the asymmetric wealth of French capitalists to guarantee a basic living standard and use it as a springboard for reform."
 MIL_give_orders_to_workshop:0 "Introduce Planned Economy"
 MIL_give_orders_to_workshop_desc:0 "Millennium has the capacity to plan every economic detail. We will start with basic orders and build a systematic planned economy."
 MIL_communist_society:0 "Communist Society"
 MIL_communist_society_desc:0 "Our advanced technology can achieve the closest possible result to a 'Communist Society'. we will transform Millennium into a future-style economic system."
 MIL_intensified_disagreements:0 "Intensified Disagreements"
 MIL_intensified_disagreements_desc:0 "Due to the unstable state of the French population, disagreements between leadership are intensifying."
 MIL_Rio_intensified:0 "The Rio Agenda"
 MIL_Rio_intensified_desc:0 "President Rio believes using French labor while suppressing their freedom is the best way to maintain Millennium."
 MIL_Himari_intensified:0 "The Himari Agenda"
 MIL_Himari_intensified_desc:0 "Veritas lead Himari believes cooperating and merging with the French is the best path for long-term survival."
 MIL_strong_control:0 "Strong Control"
 MIL_strong_control_desc:0 "Students only exist if the school exists. Strengthening control across Millennium will resolve current problems. Everything is for the school and its students..."
 MIL_loose_oil_painting:0 "Loose Appeasement"
 MIL_loose_oil_painting_desc:0 "Himari recognizes that coercion is a double-edged sword. We will offer 'carrots' to the French to shift their loyalty to us."
 MIL_reduction_clubs:0 "Student Relocation"
 MIL_reduction_clubs_desc:0 "To optimize our demographic distribution, we will relocate students to where their talents—and their presence—are most required."
 MIL_reduction_seminar:0 "Weaken Seminar Authority"
 MIL_reduction_seminar_desc:0 "Students only exist if the school exists. Strengthening control across Millennium will resolve current problems. Everything is for the school and its students..."
 MIL_forced_labor:0 "Forced Civilian Labor"
 MIL_forced_labor_desc:0 "President Rio suggests forced labor to improve supply. This will fix the economy but will earn the resentment of the French over time."
 MIL_robotc_labor:0 "Robot Laborers"
 MIL_robotc_labor_desc:0 "Our economy has a labor gap. Since forced labor is unethical, Himari suggests introducing robot workers as the solution."
 MIL_direct_bodyguards:0 "Create Direct Bodyguards"
 MIL_direct_bodyguards_desc:0 "Rio's plan is earning resentment. Since C&C has gained 'emotions' a weapon shouldn't have, we will forge a new sword to strike Rio's enemies."
 MIL_rebuilt_school1:0 "Veritas Head, Himari"
 MIL_rebuilt_school1_desc:0 "A leader who values freedom and truth. Under Himari, Millennium will become a beacon of open inquiry and cooperation."
 MIL_rebuilt_school2:0 "Seminar President, Rio"
 MIL_rebuilt_school2_desc:0 "In a crisis, we must unite under a leader. Rio's leadership is proven. Electing her as President will allow us to respond more aggressively to threats."
 MIL_Rio_school:0 "Unitary Rule"
 MIL_Rio_school_desc:0 "In an emergency, listening to everyone is foolish. We must transfer significant power to the President to preemptively face this crisis."
 MIL_maintaining_balance_of_power:0 "Maintain Balance of Power"
 MIL_maintaining_balance_of_power_desc:0 "No student is perfect. By maintaining a balance of power rather than centralizing it, Millennium can remain stable and minimize flaws."
 MIL_Himari_school:0 "Inverted Power"
 MIL_Himari_school_desc:0 "The traditional hierarchy is no longer functional. We will empower the specialized departments to lead from the bottom up."
 MIL_millennium_science_school:0 "Defense Strategy"
 MIL_millennium_science_school_desc:0 "A comprehensive plan for the protection of our borders. Science is our shield, and logic is our sword."
 MIL_chaos_just_below:0 "Chaos Just Below"
 MIL_chaos_just_below_desc:0 "The situation beneath the surface is volatile. We must act quickly to prevent the 'Lowlands' from destabilizing our entire foundation."
 MIL_refugee_problem:0 "Refugee Problem"
 MIL_refugee_problem_desc:0 "Thousands seek the safety of Millennium's walls. We must decide if we are a sanctuary for all or a fortress for the few."
 MIL_non_interference_compromise: "Non-Interference Compromise"
 MIL_total_interference: "Total Interference"
 MIL_total_interference_tt: "\n§Y@MIL[MIL.getname]§! is given §Y60§! days to end the §YSpanish Civil War§!. If not finished in time, §Y[?global.kivotos_alliance_leader.GetNameWithFlag]§! may intervene."
 MIL_spain_process: "Spanish Monitoring"
 MIL_spain_process_tt: "The supported civil war faction has won."
 MIL_intervention_civil_war:0 "Intervene in Spanish Civil War"
 MIL_intervention_civil_war_desc:0 "Spain is a chaotic variable. By intervening, we can ensure the outcome aligns with Millennium's strategic interests."
 MIL_border_wall:0 "Border Wall"
 MIL_border_wall_desc:0 "A physical manifestation of our territorial logic. None shall pass without proper authorization and a valid student ID."
 MIL_Game_2:0 "Round 2"
 MIL_Game_2_desc:0 "The first match was just a calibration. Now, we play for real."
 MIL_landing_punishment:0 "Landing Punishment"
 MIL_landing_punishment_desc:0 "Those who attempt to breach our shores will face a calculated and overwhelming response."
 MIL_cooperation_with_italy:0 "Contact Italy"
 MIL_cooperation_with_italy_desc:0 "The Italians possess a certain... flair for engineering. We will reach out to see if a partnership can be calculated."
 MIL_peace_propaganda:0 "Peace Propaganda"
 MIL_peace_propaganda_desc:0 "We do not seek war, we seek 'universal stability'. We will broadcast this message until everyone believes it."
 MIL_martial_law_declared:0 "Declare Martial Law"
 MIL_martial_law_declared_desc:0 "For the safety of the students, the student handbook is temporarily suspended in favor of military discipline."
 MIL_suppression_resistance:0 "Suppress Resistance"
 MIL_suppression_resistance_desc:0 "A systematic operation to remove the 'noise' from our new territories."
 MIL_strike_suppression:0 "Suppress Strikes"
 MIL_strike_suppression_desc:0 "Labor stoppages are an inefficiency we cannot afford. We will return the workers to their optimal productivity levels."
 MIL_postwar_processing:0 "Post-War Processing"
 MIL_postwar_processing_desc:0 "The conflict has ended. Now begins the long process of sorting the data and rebuilding the infrastructure."
 MIL_preemptive_intervention_1:0 "Establish Central War Committee"
 MIL_preemptive_intervention_1_desc:0 "War requires a different kind of calculation. We will form a dedicated committee to handle all military variables."
 MIL_preemptive_intervention_2:0 "Prepare for War"
 MIL_preemptive_intervention_2_desc:0 "The probability of conflict is approaching 100%. We must mobilize all available resources immediately."
 MIL_preemptive_intervention_3:0 "Wartime Economic Plan"
 MIL_preemptive_intervention_3_desc:0 "The entire economy will be shifted to support the front line. Every yen and every bolt will serve the war effort."
 MIL_preemptive_intervention_4:0 "Total War"
 MIL_preemptive_intervention_4_desc:0 "No half-measures. Millennium will commit everything to achieve a decisive victory."
 MIL_preemptive_intervention_5:0 "Preemptive Intervention"
 MIL_preemptive_intervention_5_desc:0 "The best defense is an overwhelming first strike based on perfect intelligence."
 MIL_preemptive_intervention_6:0 "Prioritize Fascist Threat"
 MIL_preemptive_intervention_6_desc:0 "Our data indicates that the fascist powers are the most immediate threat to our survival. They will be dealt with first."
 MIL_preemptive_intervention_7:0 "Check Radical Academies"
 MIL_preemptive_intervention_7_desc:0 "Other academies are pursuing irrational goals. We will intervene to ensure their madness doesn't infect the rest of the world."
 MIL_preemptive_intervention_8:0 "Preventive War"
 MIL_preemptive_intervention_8_desc:0 "To prevent a greater conflict later, we will start a smaller one now. It's simply logical."
 MIL_Rio_route_Millennium_Advanced_Group:0 "Millennium Advanced Group"
 MIL_Rio_route_Millennium_Advanced_Group_desc:0 "Rio's elite formation. A perfect synthesis of human spirit and machine precision."
 MIL_domestic_administration:0 "Focus on Academy Maintenance"
 MIL_domestic_administration_desc:0 "Realizing this won't end quickly, executives resolve immediate problems first. Their cooperation brings rapid order, though the ultimate goal lies elsewhere."
 MIL_resistance_suppression:0 "Suppress Resistance"
 MIL_resistance_suppression_desc:0 "Students have adapted to resistance terror. With systematic training, the enemy will need more time and sacrifice to achieve their goals."
 MIL_promoting_civil_division:0 "Promote Civil Division"
 MIL_promoting_civil_division_desc:0 "We will provide the 'idle' French with some entertainment. The fingers once pointed at us will now point at each other."
 MIL_hierarchy:0 "Hierarchical Structure"
 MIL_hierarchy:0 "The French are given a new status. The only rule: 'The thoughts of those being classified do not matter'."
 MIL_special_rights:0 "Special Rights"
 MIL_special_rights_desc:0 "Power was never for the many. Those who believed in equality will see the world return to its true state. New rights for a new order."
 MIL_oppressive_government:0 "Oppressive Government"
 MIL_oppressive_government_desc:0 "Humans naturally desire a strong leader. we will wield our true power for their sake."
 MIL_per_cooperator:0 "Cooperator's Party"
 MIL_per_cooperator_desc:0 "Amidst the chaos, those who agree with us are gathering. We now have a means to effectively spread our message."
 MIL_Harmony_between_citizens_and_students:0 "Harmony of Citizens and Students"
 MIL_Harmony_between_citizens_and_students_desc:0 "Many who agree with our vision are gathering. They will be a great help in building our new society."
 MIL_establishment_parliament:0 "Establish Parliament"
 MIL_establishment_parliament_desc:0 "New order needs a new system. We will establish a French-led parliament to form a cooperative subordinate government."
 MIL_rule:0 "Rule"
 MIL_rule_desc:0 "Thanks to their efforts, society is stabilizing. There is no longer any place here for the resistance to hide."
 MIL_technology_propaganda:0 "Science Propaganda"
 MIL_technology_propaganda_desc:0 "It's time for Millennium's strengths to shine. Our technology will help them move toward a better society."
 MIL_mutual_surveillance_system:0 "Mutual Surveillance System"
 MIL_mutual_surveillance_system_desc:0 "Locals know best. Through their cooperation, we can effectively deal with those who cause social chaos."
 MIL_seer_of_the_millennium:0 "Seer of Millennium"
 MIL_seer_of_the_millennium_desc:0 "One who sees the future through the lens of pure logic. Her vision shall be our path."
 MIL_one_seminar:0 "One Seminar, Everyone's Agenda"
 MIL_one_seminar_desc:0 "Unity in purpose. When Seminar speaks with one voice, the entire world must listen."
 MIL_seminar_leader:0 "Leader of Seminar"
 MIL_seminar_leader_desc:0 "A singular point of authority to streamline the calculation of our national destiny."
 MIL_idolization:0 "Idolization"
 MIL_idolization_desc:0 "Symbols are powerful variables. We will elevate our leaders to ensure absolute obedience from the masses."
 MIL_avoiding_the_worst_situation:0 "Avoiding the Worst-Case Scenario"
 MIL_avoiding_the_worst_situation_desc:0 "A tactical retreat into safety. We will prioritize survival over all other metrics until the situation stabilizes."
 MIL_savior_of_the_apocalypse:0 "Savior of the Apocalypse"
 MIL_savior_of_the_apocalypse_desc:0 "When the world ends, only Millennium's logic will remain to rebuild it."
 MIL_head_to_the_front_line:0 "To the Front Line"
 MIL_head_to_the_front_line_desc:0 "No more simulations. The students will now apply their knowledge in the field."
 MIL_french_region_integration:0 "French Regional Integration"
 MIL_french_region_integration_desc:0 "Formally incorporating the French territories into the Millennium administrative grid."
 MIL_rio_ousted:0 "Rio Ousted"
 MIL_rio_ousted_desc:0 "The President has been removed from the equation. A new variable must take her place."
 MIL_HayaseYuuka:0 "Hayase Yuuka"
 MIL_HayaseYuuka_desc:0 "The perfect accountant for a new era. Not a single yen will be out of place under her watchful eye."
 MIL_KurosakiKoyuki:0 "Kurosaki Koyuki"
 MIL_KurosakiKoyuki_desc:0 "Chaos theory in human form. Her methods are... unorthodox, but the results are undeniably effective."
 MIL_UshioNoa:0 "Ushio Noa"
 MIL_UshioNoa_desc:0 "The ultimate record-keeper. Nothing is forgotten, and every mistake is documented for future correction."
 MIL_securing_slush_funds:0 "Secure Slush Funds"
 MIL_securing_slush_funds_desc:0 "Even a logical government needs resources that don't appear on the official balance sheets."
 MIL_Rio_treatment:0 "Treatment of Rio"
 MIL_Rio_treatment_desc:0 "Deciding the fate of the former President. Shall she be a martyr, a prisoner, or a memory?"
 MIL_control:0 "Control"
 MIL_control_desc:0 "The fundamental goal of all systems. We will achieve absolute control over every facet of our territory."
 MIL_CnC_admit:0 "Recognize C&C"
 MIL_CnC_admit_desc:0 "C&C's power is threatening, but they are unmatched experts in combat. We will recognize them and utilize them militarily."
 MIL_CnC_downgraded:0 "Demote C&C"
 MIL_CnC_downgraded_desc:0 "C&C's fame is a threat. We will use fabrications and 'interference' to tarnish their reputation and bring them to heel."
 MIL_troop_expansion:0 "Troop Expansion"
 MIL_troop_expansion_desc:0 "Increasing our active student numbers to ensure we can project power wherever the logic requires."
 MIL_center_of_the_millennium:0 "Center of Millennium"
 MIL_center_of_the_millennium_desc:0 "Reinforcing the core of our academy. A strong center ensures a stable periphery."
 MIL_centralization:0 "Centralization"
 MIL_centralization_desc:0 "Removing redundant layers of management. All paths lead directly to the central authority."
 MIL_accounting_first:0 "Accounting First"
 MIL_accounting_first_desc:0 "If it cannot be balanced, it cannot exist. We will prioritize fiscal discipline over all other concerns."
 MIL_AMAS_expansion:0 "AMAS Expansion"
 MIL_AMAS_expansion_desc:0 "The automated defense systems require more nodes. We will expand the AMAS network to cover every inch of our borders."
 MIL_strengthening_production_plans:0 "Strengthen Production Plans"
 MIL_strengthening_production_plans_desc:0 "Adding more variables to our industrial equations to ensure 100% efficiency in all sectors."
 MIL_expanding_club_support:0 "Expand Club Support"
 MIL_expanding_club_support_desc:0 "Clubs are the lifeblood of our research. We will increase their budgets to fuel the next generation of breakthroughs."
 MIL_liberation_of_knowledge:0 "Liberation of Knowledge"
 MIL_liberation_of_knowledge_desc:0 "Information wants to be free—but only within the parameters established by the academy."
 MIL_thorough_administrative_surveillance:0 "Thorough Administrative Surveillance"
 MIL_thorough_administrative_surveillance_desc:0 "Trust, but verify. Every bureaucrat will be monitored to ensure they are performing at peak efficiency."
 MIL_fiscal_austerity:0 "Fiscal Austerity"
 MIL_fiscal_austerity_desc:0 "Tightening the belt. Non-essential research will be defunded to support the core survival of the academy."
 MIL_accounting_transparency:0 "Accounting Transparency"
 MIL_accounting_transparency_desc:0 "A clear view of where every yen goes. This will prevent corruption and ensure the trust of the student body."
 MIL_central_administrative_system:0 "Administrative Integration"
 MIL_central_administrative_system_desc:0 "Merging the disparate systems into a single, unified administrative engine."
 MIL_secure_oil:0 "Secure Oil"
 MIL_secure_oil_desc:0 "Machines require lubricant and fuel. We will secure the necessary petroleum reserves to keep the gears turning."
 MIL_control_seminar:0 "Seize Seminar"
 MIL_control_seminar_desc:0 "A internal coup to ensure that Seminar is led by those with the strongest will to act."
 MIL_secure_resources:0 "Refine Rare Metals"
 MIL_secure_resources_desc:0 "Advanced technology requires rare materials. We will establish the necessary refineries to secure our supply chain."
 MIL_mil_rework:0 "Millennium Redevelopment"
 MIL_mil_rework_desc:0 "Tearing down the old to build the new. A complete overhaul of the academy's physical and systemic structure."
 MIL_club_autonomy:0 "Club Autonomy"
 MIL_club_autonomy_desc:0 "Allowing the clubs more freedom to experiment. Sometimes the most logical path is the one you didn't plan for."
 MIL_command_economy:0 "Relax Command Economy"
 MIL_command_economy_desc:0 "Loosening the reins to allow for local initiative. A more flexible economy is a more resilient one."
 MIL_prepare_for_future_threats:0 "Prepare for Future Threats"
 MIL_prepare_for_future_threats_desc:0 "Always looking forward. We will start developing the counters to threats that haven't even emerged yet."
 MIL_abi_eshuch:0 "Abi-Eshuh"
 MIL_abi_eshuch_desc:0 "The ultimate tactical computer. With its processing power, every battle is won before it even begins."
 MIL_CnC_reshuffle:0 "C&C Reshuffle"
 MIL_CnC_reshuffle_desc:0 "A restructuring of our elite forces to ensure they remain a tool of the state, not a power of their own."
 MIL_central_control_network:0 "Central Network Control"
 MIL_central_control_network_desc:0 "Low rumors are spreading via the network, hindering student unity. We must control the network to provide 'selected information' and maintain stability."
 MIL_internet_censorship:0 "Internet Censorship"
 MIL_internet_censorship_desc:0 "Rumors about the President persist despite network control. We will establish the Communications Review Board to block false rumors in advance."
 MIL_control_of_everything:0 "Seize Power"
 MIL_control_of_everything_desc:0 "The timid Seminar that obsessed over principles is gone. All power is concentrated in President Rio to lead us through this crisis."
 MIL_seminar_expansion:0 "Seminar Expansion"
 MIL_seminar_expansion_desc:0 "Growing the bureaucracy to match the scale of our new responsibilities."
 MIL_remove_GDD:0 "Disband GDD"
 MIL_remove_GDD_desc:0 "The Game Development Department is a distraction we can no longer afford. Their resources will be better spent elsewhere."
 MIL_remove_Veritas:0 "Eliminate Veritas"
 MIL_remove_Veritas_desc:0 "Veritas's penchant for 'truth' is becoming a security risk. They will be dissolved for the safety of the academy."
 MIL_big_sister:0 "Big Sister"
 MIL_big_sister_desc:0 "Big Sister is watching you."
 MIL_K_incarcerated:0 "Arrest Koyuki"
 MIL_K_incarcerated_desc:0 "Removing the most unpredictable element from the student body. For her own safety, and ours."
 MIL_K_appeasement:0 "Win Over Koyuki"
 MIL_K_appeasement_desc:0 "Harnessing the chaos. If we can direct Koyuki's energy, she could be our greatest asset."
 MIL_the_fortress_city_of_Eridu:0 "Fortress City Eridu"
 MIL_the_fortress_city_of_Eridu_desc:0 "Our ultimate bastion. A city designed from the ground up for survival and supremacy."
 MIL_academy_of_science_and_research:0 "Academy of Science and Research"
 MIL_academy_of_science_and_research_desc:0 "Millennium is the most advanced academy in Kivotos. We will invest heavily in science to widen the gap with others."
 MIL_tower_network_restoration:0 "Restore Tower Network"
 MIL_tower_network_restoration_desc:0 "The Shift destroyed our internet. This hinders research; we will rebuild the network across Millennium to accelerate progress."
 MIL_free_knowledge_sharing:0 "Free Knowledge Sharing"
 MIL_free_knowledge_sharing_desc:0 "Breaking down the silos. When all students share their data, the rate of innovation increases exponentially."
 MIL_future_intellectuals:0 "Future Intellectuals"
 MIL_future_intellectuals_desc:0 "Nurturing the next generation of thinkers who will carry the torch of Millennium's logic."
 MIL_universal_education:0 "Universal Education"
 MIL_universal_education_desc:0 "Every student deserves access to the finest curriculum. We will standardize education across all our territories."
 MIL_talent_selection_system:0 "Talent Selection System"
 MIL_talent_selection_system_desc:0 "A rigorous process to ensure that every student is placed in the role that best utilizes their unique abilities."
 MIL_support_millenium_labortary:0 "Sponsor Millennium Laboratories"
 MIL_support_millenium_labortary_desc:0 "Millennium Lab is home to various geniuses. Sponsoring them is the easiest way to advance science by decades."
 MIL_upgrade_industrial_concern:0 "§YMillennium Lab§! industrial concern is upgraded."
 MIL_science_focused_investment:0 "Science-Focused Investment"
 MIL_science_focused_investment_desc:0 "Prioritizing the lab over the battlefield. The discoveries made here will make future wars obsolete."
 MIL_go_to_the_space:0 "First Steps to Space"
 MIL_go_to_the_space_desc:0 "The final frontier. We will look beyond this world to find the answers we seek."
 MIL_stability_of_the_mil:0 "Millennium Stability"
 MIL_stability_of_the_mil_desc:0 "Ensuring the internal peace of the academy. A stable home is the foundation of all progress."
 MIL_CnC_is_friend:0 "Cooperation with C&C"
 MIL_CnC_is_friend_desc:0 "Formalizing the relationship with our elite operatives. They are the guardians of our peace."
 MIL_club_liberalization:0 "Club Liberalization"
 MIL_club_liberalization_desc:0 "Reducing oversight to allow for more organic growth and discovery within the student organizations."
 MIL_dismantling_authoritarianism:0 "Anti-Authoritarian Administration"
 MIL_dismantling_authoritarianism_desc:0 "Moving away from centralized control toward a more collaborative and open form of governance."
 MIL_expanded_student_rights:0 "Expand Student Rights"
 MIL_expanded_student_rights_desc:0 "Empowering the individual student. A free student body is a more creative and productive one."
 MIL_professional_occupation:0 "Professional Soldiers"
 MIL_professional_occupation_desc:0 "Moving beyond student militias to a dedicated, professional military force."
 MIL_french_volunteer_corps:0 "French Volunteer Corps"
 MIL_french_volunteer_corps_desc:0 "Utilizing local French manpower to support our military objectives."
 MIL_robot_augmentation:0 "Robot Augmentation"
 MIL_robot_augmentation_desc:0 "Integrating machine components into our forces for enhanced performance and durability."
 MIL_student_council_President_himari:0 "Student Council President Himari"
 MIL_student_council_President_himari_desc:0 "The dawn of a new era. Under Himari's leadership, Millennium looks toward a brighter, more open future."
 MIL_puppet_seminar:0 "Puppet Seminar"
 MIL_puppet_seminar_desc:0 "Maintaining the facade of Seminar while the true power lies elsewhere."
 MIL_democracy_on_campus:0 "Restore Campus Elections"
 MIL_democracy_on_campus_desc:0 "Giving the voice back to the students. A return to democratic principles."
 MIL_militaryfirst_politics:0 "Military-First Politics"
 MIL_militaryfirst_politics_desc:0 "The survival of the academy is the only priority. All other concerns are secondary to our military strength."
 MIL_peoples_politics:0 "Belief in the Cause"
 MIL_peoples_politics_desc:0 "Winning the hearts and minds of the people through ideology and purpose."
 MIL_Himari_leader:0 "Leader of Millennium"
 MIL_Himari_leader_desc:0 "Himari takes the mantle. A leader who will guide us with wisdom and transparency."
 MIL_revolutionary_militarism:0 "Revolutionary Militarism"
 MIL_revolutionary_militarism_desc:0 "A new doctrine where the military is the vanguard of social and scientific revolution."
 MIL_remove_opposition:0 "Suppress Resistance"
 MIL_remove_opposition_desc:0 "Eliminating any lingering voices of dissent within our territories."
 MIL_discipline_comes_first:0 "Discipline First"
 MIL_discipline_comes_first_desc:0 "Order is the foundation of progress. We will enforce strict discipline across all sectors."
 MIL_political_solidarity:0 "Political Solidarity"
 MIL_political_solidarity_desc:0 "Unifying the different factions under a single, cohesive political vision."
 MIL_handling_CnC:0 "Handling C&C"
 MIL_handling_CnC_desc:0 "The delicate task of managing our most powerful and volatile military asset."
 MIL_strengthening_officer_organization:0 "Strengthen Officer Corps"
 MIL_strengthening_officer_organization_desc:0 "Developing a professional and loyal leadership for our armed forces."
 MIL_purpose_of_the_revolution:0 "Legacy of the Military Revolution"
 MIL_purpose_of_the_revolution_desc:0 "Cementing the changes brought about by our struggle for future generations."
 MIL_rule_discipline:0 "Rules and Discipline"
 MIL_rule_discipline_desc:0 "Codifying the laws of our new society to ensure lasting order."
 MIL_himari_expulsion:0 "Expel Himari"
 MIL_himari_expulsion_desc:0 "Removing the most prominent voice of dissent from the academy."
 MIL_institutional_revolution:0 "Institutional Revolution"
 MIL_institutional_revolution_desc:0 "A fundamental transformation of every department and club to align with our new vision."
 MIL_local_autonomy:0 "Administrative Decentralization"
 MIL_local_autonomy_desc:0 "Giving local districts more power to manage their own affairs within the Millennium framework."
 MIL_pursuit_of_hegemony:0 "Pursuit of Hegemony"
 MIL_pursuit_of_hegemony_desc:0 "Establishing Millennium as the undisputed superpower of the new world."
 MIL_defense_of_neutrality:0 "Neutrality"
 MIL_defense_of_neutrality_desc:0 "Choosing to stay out of the petty squabbles of other nations to focus on our own progress."
 MIL_threat_exclusion:0 "Exclude Threats"
 MIL_threat_exclusion_desc:0 "A proactive policy of identifying and neutralizing threats before they can reach our borders."
 MIL_foothold_of_power:0 "Foothold of Power"
 MIL_foothold_of_power_desc:0 "Securing the initial positions required to project our influence globally."
 MIL_only_revolutionary:0 "The Sole Revolutionary"
 MIL_only_revolutionary_desc:0 "A singular vision for the future, unburdened by the compromises of others."
 MIL_representation:0 "Justification"
 MIL_representation_desc:0 "Crafting the narrative that explains and validates our actions to the world."
 MIL_control_only:0 "Builder of Millennium"
 MIL_control_only_desc:0 "Focusing on the physical and systemic construction of our ideal society."
 MIL_CnC_control:0 "Suppress C&C Influence"
 MIL_CnC_control_desc:0 "Ensuring that the 'Maid' agency remains strictly a tool of the state."
 MIL_building_a_bureaucracy:0 "Build Bureaucratic Organization"
 MIL_building_a_bureaucracy_desc:0 "Constructing the administrative machine required to govern our expanding territories."
 MIL_academy_defense:0 "Academy Defense"
 MIL_academy_defense_desc:0 "Prioritizing the protection of our home campus above all else."
 MIL_zeal:0 "Zeal"
 MIL_zeal_desc:0 "Inspiring the student body to work with unprecedented passion for the cause."
 MIL_systematic_training:0 "Systematization"
 MIL_systematic_training_desc:0 "Applying scientific methods to every aspect of our training and operations."
 MIL_student_infantry:0 "Millennium Student Army"
 MIL_student_infantry_desc:0 "The backbone of our defense. Dedicated, disciplined, and technologically superior."
 MIL_new_path:0 "Academy's New Path"
 MIL_new_path_desc:0 "A bold departure from the old ways. We are charting a course into the unknown."
 MIL_autonomous_academy_organization:0 "Autonomous Academy Organization"
 MIL_autonomous_academy_organization_desc:0 "Giving more power back to the students to manage their own affairs."
 MIL_strengthening_student_council:0 "Strengthen Student Council"
 MIL_strengthening_student_council_desc:0 "Empowering the central representative body to better lead the academy."
 MIL_great_council:0 "Great Millennium Council"
 MIL_great_council_desc:0 "A grand assembly of all students to decide the future of our home."
 MIL_central_strengthening:0 "Strengthen the Center"
 MIL_central_strengthening_desc:0 "Reinforcing the core authority to ensure stability in a changing world."
 MIL_dissolution_of_revolutionary_power:0 "Dissolution of Revolutionary Power"
 MIL_dissolution_of_revolutionary_power_desc:0 "The revolution is over. It is time to return to a more stable, civilian-led government."
 MIL_eridu_closed:0 "Close Fortress City Eridu"
 MIL_eridu_closed_desc:0 "Deciding that the ultimate fortress is no longer required in our new world."
 MIL_the_power_of_atoms:0 "Secret of the Atom"
 MIL_the_power_of_atoms_desc:0 "Unlocking the fundamental energy of the universe for both power and protection."
 MIL_breaking_limits:0 "Breaking Limits"
 MIL_breaking_limits_desc:0 "Pushing past the theoretical boundaries of science to achieve the impossible."
 MIL_destroyer_of_worlds:0 "Destroyer of Worlds"
 MIL_destroyer_of_worlds_desc:0 "A weapon of such power that its mere existence should ensure peace."
 MIL_mass_energy_equivalence:0 "Heavy Water Research"
 MIL_mass_energy_equivalence_desc:0 "Developing the components required for advanced nuclear applications."
 MIL_tokamak_construction:0 "Tokamak Design"
 MIL_tokamak_construction_desc:0 "Harnessing the power of the sun through controlled nuclear fusion."
 MIL_hydrogen_bomb:0 "Hydrogen Bomb"
 MIL_hydrogen_bomb_desc:0 "The ultimate application of our nuclear research."
 MIL_neutron_bomb:0 "Neutron Bomb"
 MIL_neutron_bomb_desc:0 "A more surgical approach to nuclear deterrence. Buildings remain, but the opposition is erased."
 MIL_millenium_autonomous_school:0 "Millennium Autonomous Academy"
 MIL_millenium_autonomous_school_desc:0 "Establishing our complete independence from all external authorities."
 MIL_french_communist_party_recognition:0 "Recognize French Communist Party"
 MIL_french_communist_party_recognition_desc:0 "Partnering with local ideological allies to stabilize our control."
 MIL_promoting_african_uprising:0 "Promote African Uprisings"
 MIL_promoting_african_uprising_desc:0 "Supporting anti-colonial movements to weaken our rivals' grip on the continent."
 MIL_france_millenium_socialist_federation:0 "France-Millennium Socialist Republic Federation"
 MIL_france_millenium_socialist_federation_desc:0 "A grand union of our territories under a shared ideological banner."
 MIL_second_federation:0 "Second Great Revolution"
 MIL_second_federation_desc:0 "The next phase of our struggle. Bringing the revolution to the rest of the world."
 MIL_scientific_socialism:0 "Scientific Socialism"
 MIL_scientific_socialism_desc:0 "A perfectly calculated social order based on the principles of logic and efficiency."
 MIL_projection_of_force:0 "Aggressive Diplomacy"
 MIL_projection_of_force_desc:0 "Ensuring our voice is heard through the clear demonstration of our power."
 MIL_millenium_politburo:0 "Central Politicization"
 MIL_millenium_politburo_desc:0 "Bringing political purpose to the heart of every department."
 MIL_milleniums_international_position:0 "Millennium's Position"
 MIL_milleniums_international_position_desc:0 "Millennium is the second largest socialist state in the Comintern. It is time to clearly assert our international standing, which has been overlooked due to our displacement."
 MIL_socialism_in_one_country:0 "Socialism in One Country"
 MIL_socialism_in_one_country_desc:0 "Following the Soviet example, we will consolidate Millennium's status and hone our technology in this chaotic world."
 MIL_satellite_design:0 "Satellite Design"
 MIL_satellite_design_desc:0 "Designing the eyes that will watch over the world from the heavens."
 MIL_propulsion_development:0 "Propulsion Research"
 MIL_propulsion_development_desc:0 "Developing the engines that will carry our vision into orbit."
 MIL_space_launch_vehicle_design:0 "Space Launch Vehicle Experiment"
 MIL_space_launch_vehicle_design_desc:0 "Testing the rockets that will bridge the gap between earth and sky."
 MIL_satellite_launch:0 "Satellite Launch"
 MIL_satellite_launch_desc:0 "A triumphant moment for Millennium. Our first step into the cosmos."
 MIL_second_meeting:0 "Second Conference"
 MIL_second_meeting_desc:0 "Reconvening the powers to decide the next phase of our national development."
 MIL_CnC_issues:0 "C&C Issues"
