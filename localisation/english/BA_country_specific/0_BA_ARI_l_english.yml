#Arius Ideas

 BA_ARI_bitter_revanchism_3: "Arius Branch"
 BA_ARI_bitter_revanchism_3_desc: "The Arius Branch was like a machine built solely for revenge against Trinity and Gehenna. And now, that machine has achieved its goal.\n\nExpelled by the old Council, the Arius Branch has proudly risen again by tearing down the Trinity General Academy—the very fruit of that Council's labor. Having rewritten past defeat into future victory, the Arius Branch will never hide in the shadows again."

 BA_ARI_bitter_revanchism_GER: "German National Revanchism"
 BA_ARI_bitter_revanchism_GER_desc: "From a land covered in ash and dust, the eagle has taken flight once more. The great fatherland has returned to shine brilliantly upon the ruins of the German ideal.\n\nThe ideal of the new German nation, resurrected from the rubble, will shout to the world: Germany has returned.\n\nSieg Heil!"

 BA_ARI_tragedy: "Overture of Tragedy"
 BA_ARI_tragedy_desc: "When the adult who led Arius vanished, only chaos remained. Countless civil wars and clashes erupted to fill the power vacuum, and even the Arius Squad was no exception. Though they initially seized power through a coup to prevent Arius's collapse, internal conflict became unavoidable once they tasted the sweet fruit of authority.\n\nWhen did this tragedy truly begin? It was after the Great Shift, as the disagreement between Hakari Atsuko and Jomae Saori intensified. Atsuko argued for opening the borders and improving relations with Trinity for the future of Arius. Saori, meanwhile, demanded that the blood debts and hatred of the past century be repaid in full.\n\nThe two positions were too different to coexist within one organization, and this rift threatens to swallow all of Arius. Can this fracture ever be mended? Or is the only conclusion another total collapse?"

 ARI_manpower: "Arius Squad"
 ARI_make_collapse: "Devastated Leadership"
 ARI_make_collapse_desc: "To put it kindly, they survived; to put it bluntly, they barely escaped with their lives. The current Tea Party leadership is in no state to command Trinity, and it will take a significant amount of time to restore functional control."
