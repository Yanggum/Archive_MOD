 ARI_nazi_party: "National Socialist German Workers' Party"
 ARI_nazi_party_desc: "The NSDAP was the party that ruled the mighty German Reich before the Great Shift. However, following that event, Germany was destroyed by Kivotos under the lead of Trinity and Gehenna. After the Führer and Germany's elite vanished along with Berlin, the survivors retreated deep underground.\n\nIn the ruins of the Arius Branch, they have re-emerged, joined by a shared hatred of Trinity and Gehenna. Now, the Nazi Party and the Arius Branch stand together, preparing for a grand struggle against their mutual enemies."

 ARI_german_reconstruction_government: "Reconstruction Government"
 ARI_german_reconstruction_government_desc: "The German Reconstruction Government is tasked with rebuilding a land devastated by war against Trinity, Gehenna, and various otherworldly entities."

