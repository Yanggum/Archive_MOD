# Ideas
 BA_ARI_bitter_revanchism: "Bitter Revanchism"
 BA_ARI_bitter_revanchism_desc: "The Arius Branch is like a machine moving for revenge against Trinity and Gehenna. Long ago, Arius provided legitimate reasons to oppose the unification of Trinity. The response was not a fair debate, but a retaliatory invasion. Unable to match the power of a unified Trinity, we became recluses in the deep darkness.\n\nThen one day, an adult appeared. We believed he would save us. He unified the fractured Arius and became the student council president with our support. But that belief was betrayed. The adult treated students as tools, not people, and many were sacrificed. Hatred for Trinity was injected into their hearts, and one by one, they were raised as killing machines."
 BA_ARI_bitter_revanchism_ns_1: "The Edge of Revenge"
 BA_ARI_bitter_revanchism_ns_1_desc: "The Arius Branch is like a machine moving for revenge. We finally struck the heart of Trinity and reclaimed our rightful place. In that moment, our revenge lost its direction. Hatred for Gehenna? How can we hate those we've never seen? While many dislike them, our primary drive ended the moment we occupied Eden and raised our flag.\n\nIf we are to follow the ghost of revenge to the destruction of Gehenna, we must find a path beyond mere hatred."
 ARI_undisturbed_wareconomy: "Complete Isolation"
 ARI_wareconomy: "Isolation"
 ARI_pyeho_hakwon: "Ruined Academy"
 ARI_pyeho_hakwon_desc: "The price of fleeing Trinity's pursuit was cold ruins and only a few remaining students."
 ARI_pyeho_hakwon_remove_tt: "\nRemoved if conditions met: More than §Y30§! factories.\n"
 ARI_pyeho_hakwon_1: "Lantern in the Ruins"
 ARI_pyeho_hakwon_1_desc: "We did not despair in the ruins. Arius students turned generators and produced ammunition under the lamplight, determined to have their revenge."
 ARI_german_defectors_1: "German Freikorps"
 ARI_german_defectors_2: "Anti-Trinity Exiles"
 ARI_acceptance_of_exiles_tt: "Gains the §YGerman Freikorps§! national spirit. §Y6 Infantry§! battalions with §YEngineer§!, §YRecon§!, and §YArtillery§! support will be created periodically.\n"
 ARI_german_defectors_1_tt: "§Y6 Infantry§! battalions with §YEngineer§!, §YRecon§!, and §YArtillery§! support will be created periodically.\n"
 ARI_final_offensive: "Total Decisive Battle"
 ARI_final_offensive_desc: "It is time to bring down Trinity with lightning speed!"
 ARI_lantern_of_the_germanic: "Lantern of the Germanic"
 ARI_lantern_of_the_germanic_desc: "Burn Trinity. That single premise was enough to gather Germans blinded by revenge, regardless of their poor circumstances.\n\nIf God exists, He is not in Trinity. We shall give them what they deserve."
 ARI_lantern_of_the_germanic_tt: "Removed if conditions met: Control §Y4§! or more states."
 ARI_economic_corruption: "Economic Corruption"
 ARI_economic_corruption_tt: "Removed by completing §Y$ARI_economic_structure_reform$§!."
 ARI_economic_structure_reform_tt: "Prevents future economic problems."
 idea_ARI_wartime_workshop_opening: "Wartime Workshops"
 idea_ARI_wartime_workshop_opening_desc: "Whether through plunder, post-war retaliation, SS orders, or nationalist mobilization—every household and organization is forced to manufacture firearms."
 idea_ARI_wartime_workshop_opening_tt: "Removed upon end of war: At peace with §Y[TRM.GetNameWithFlag]§!."
 ARI_student_resistance: "Resistance of the Angels"
 ARI_student_resistance_desc: "The day Eden was taken, Trinity students resolved to resist Arius."

# Focus
 ARI_justina_council_transfer: "Transfer of the Justina Council"
 ARI_justina_council_transfer_desc: "We can receive the Justina Council, left without a purpose after the Great Shift, from Gematria and Madame. By analyzing their combat methods and mimicking them, we can take the first step in reorganizing our military."
 ARI_our_own_method: "Our Own Method"
 ARI_our_own_method_desc: "Focusing on Arius's ancient combat methods and pre-Shift halo infantry operations is not just about preserving identity, but about doing what we do best."
 ARI_danzig_advisor_recruitment: "Recruit Danzig Military Advisors"
 ARI_danzig_advisor_recruitment_desc: "The situation has changed since the shift. We may have new allies who also target Trinity. We will contact former German military officers in Danzig to build our doctrine."
 ARI_ancient_combat_analysis: "Ancient Combat Analysis"
 ARI_ancient_combat_analysis_desc: "We dig up the faded records of Arius. The tactics buried in forgotten manuscripts will prove their lethality on the modern battlefield. It is time to remember who we are and how we survived."
 ARI_fear_and_terror: "Fear and Terror"
 ARI_fear_and_terror_desc: "The most efficient deterrent is not overwhelming fire, but bone-chilling fear. Psychological pressure and indiscriminate terror will be Arius's strongest weapons."
 ARI_council_acquisition: "Council Acquisition"
 ARI_council_acquisition_desc: "The Justina Council is no mere force. It is the sharpest dagger prepared by Arius to usurp Trinity's legitimacy. These dolls will now crush our enemies at our command."
 ARI_frontline_fire_brigade: "Frontline Fire Brigade"
 ARI_frontline_fire_brigade_desc: "Gaps in the line appear without warning. We will operate elite mobile units to reverse the situation in extreme conditions. Wherever the fire spreads, the Fire Brigade will extinguish it in the name of Arius."
 ARI_ss_tactics_imitation: "Imitation of SS Tactics"
 ARI_ss_tactics_imitation_desc: "The history of this world gives us strange inspiration. The urban combat tactics of the German SS are partially suited to our guerrilla war against Trinity. We must accept any doctrine for victory."
 ARI_danzig_militia_recruitment: "Recruit Danzig Militia"
 ARI_danzig_militia_recruitment_desc: "We are not alone. In the narrow alleys and abandoned factories of Danzig, there are locals with the same look in their eyes. Give them guns and Arius's hatred, and they will become the expendable tools of our revenge."
 ARI_production_facility_expansion: "Expand Production Facilities"
 ARI_production_facility_expansion_desc: "War is a clash of iron and fire. We must rebuild Danzig's old factories to Arius specifications and churn out bullets and medicine. Our revenge must never stop for lack of supplies."
 ARI_arius_militarism: "Arius Militarism"
 ARI_arius_militarism_desc: "Every student a warrior, every day a preparation. 'Compromise' and 'Peace' do not exist in Arius. Only discipline, obedience, and the destruction of Trinity."
 ARI_chemical_warfare_preparation: "Chemical Warfare Preparation"
 ARI_chemical_warfare_preparation_desc: "Bullets destroy the body, but chemical gas gnaws at the soul. Gases developed in Danzig's facilities will be a mist of death for the enemy. Only the victors get to call it 'cowardly'."
 ARI_vulnerability_analysis: "Vulnerability Analysis"
 ARI_vulnerability_analysis_desc: "There are gaps even in Trinity's stout defenses. Intelligence will analyze their supply lines, command, and psychological weaknesses. Stabbing the most painful spot at the most cruel moment is the essence of war."
 ARI_chemical_facility_expansion: "Expand Chemical Facilities"
 ARI_chemical_facility_expansion_desc: "Laboratory-scale production is not enough. We must build massive chemical complexes outside Danzig to stockpile poison gas. When the scent of death fills the air, our revenge will be complete."
 ARI_asymmetric_warfare: "Asymmetric Warfare"
 ARI_asymmetric_warfare_desc: "If the enemy wants a fair fight, we must betray that expectation. Terror, sabotage, ambush. Paralyze their heart with means a regular army cannot imagine."
 ARI_conventional_warfare: "Conventional Warfare"
 ARI_conventional_warfare_desc: "Special tactics alone cannot hold territory. We will build a systematic military with the advice of German officers. Adding German organization to Arius's hatred will make us unstoppable."
 ARI_indirect_fire_support: "Indirect Fire Support"
 ARI_indirect_fire_support_desc: "We can annihilate the enemy without dirtying our hands. Artillery rain from beyond the horizon will feel like divine punishment. The roar of falling shells is the funeral song Arius sends to Trinity."
 ARI_next_phase_preparation: "Prepare for the Next Phase"
 ARI_next_phase_preparation_desc: "Our military is ready. Now we must form armored corps for a new era and accept modern tactics. An elite armored legion for the world of Arius!"

 ARI_danzig_militia_recruitment_tt: "Danzig Militia"
 ARI_mental_armament_tt: "Frontline Assault Penal Unit"

 effect_recruit_character_marshal: "$CHARACTER|H$ becomes a Field Marshal."
