 ARI_arius_infiltration_unit_system_modifier_swap_arius_army_modifier_tt: "Effect changes when swapping §Y$ARI_arius_infiltration_unit_system_modifier$§! to §Y$ARI_arius_army_modifier$§!:"
 

 ARI_beatrice_influence: "Beatrice's Influence"
 ARI_beatrice_influence_desc: "Madame can no longer bind us directly. She is no longer our absolute master, but a collaborator for mutual interest. We use her twisted influence while keeping enough distance to ensure her hand doesn't grip our throats again."
 ARI_integration_of_work_classroom_into_production: "Integrate Work Classrooms into Production"
 ARI_integration_of_work_classroom_into_production_desc: "The fragmented 'work groups' of individual classrooms are too inefficient for national war. Integrate them into a centralized 'Production Department'."
 ARI_adherence_to_existing_method: "Adhere to Existing Methods"
 ARI_adherence_to_existing_method_desc: "We already know how to handle Mystic powers from the Kivotos days. Invest in our own 'Mystic Looms' rather than relying on strange technologies."
 ARI_firearm_production_priority: "Firearm Production Priority"
 ARI_firearm_production_priority_desc: "Mystics and miracles are rare; steel and gunpowder are honest. We need reliable rifles for every student's hand to complete our revenge."
 ARI_advanced_equipment: "Advanced Equipment"
 ARI_advanced_equipment_desc: "Simple rifles cannot break enemy lines. Invest in heavy weapons with precision sights and powerful barrels to teach the enemy true emptiness."
 ARI_meeting_with_gematria: "Meeting with Gematria"
 ARI_meeting_with_gematria_desc: "Gematria's knowledge is still valuable. Contact them for advice on world affairs and technology. Even if they view us as subjects, their information is essential for survival."
 ARI_national_development: "National Development"
 ARI_national_development_desc: "Danzig is no longer a temporary shelter. It must become Arius's new sanctuary and armory. Organize infrastructure and administration."
 ARI_danzig_industrial_reactivation: "Reactivate Danzig Industry"
 ARI_danzig_industrial_reactivation_desc: "Let smoke rise from Danzig's chimneys once more. Turn the idle machines into the industrial heart of Arius. Production is power."
 ARI_baltic_sea_trade_contact: "Baltic Sea Trade Contact"
 ARI_baltic_sea_trade_contact_desc: "Danzig's true value is the sea. Rebuild the ports and secure trade routes to supplement our resources and expand our reach."
 ARI_secret_meeting_with_kriegsmarine: "Secret Meeting with the Kriegsmarine"
 ARI_secret_meeting_with_kriegsmarine_desc: "Begin secret talks with Kriegsmarine exiles. This dangerous alliance will provide maritime support and new breakthroughs for Arius."


 ARI_distancing_from_nazi_ss: "Distancing from the SS"
 ARI_distancing_from_nazi_ss_desc: "The black-uniformed crowd in Danzig offers tempting cooperation, but we know the misery of being a puppet. Do not let their madness swallow Arius's identity. Cooperation is fine, but the initiative must remain ours."
 ARI_no_more_retreat: "No More Retreat"
 ARI_no_more_retreat_desc: "We cannot lose Danzig, our final wall. If we step back once more, only true annihilation awaits. Die here, or win."
 ARI_mental_armament: "Mental Armament"
 ARI_mental_armament_desc: "Spread Arius's teachings even to Danzig's citizens. Life is pain, and struggle is its proof. Turn their fear into hatred."
 ARI_opening_porta_fasis: "Opening Porta Phasis"
 ARI_opening_porta_fasis_desc: "Open the heart of Arius where forbidden knowledge sleeps. We will pay any price for the ancient arts that can bring down Trinity."
 ARI_trumpet_blowing_angels: "Trumpet-Blowing Angels"
 ARI_trumpet_blowing_angels_desc: "Under a red sky, the trumpets signal the end. The Justina Council's essence and the messengers of the apocalypse descend. Let the cruel banquet begin."
 ARI_trumpet_blowing_angels_tt: "Three §YAngels of the Apocalypse§! will become Generals."
 ARI_apocalypse: "Apocalypse"
 ARI_apocalypse_desc: "All is vanity; only destruction is fair. Return their pain a thousandfold. When Trinity's garden is ash, our revenge is complete. Declare the true Apocalypse."
 ARI_no_change: "No Change"
 ARI_no_change_desc: "We do not need uncertain reform. We have already mastered the most efficient way to hate. Maintain the old order of Arius."
 ARI_no_change_tt: "A §Rlarge benefit§! will be given to the faction representing §YConservatives§!."
 ARI_no_change_0_tt: "§gCurrently has no effect.§!"
 ARI_danzig_conference: "Danzig Conference"
 ARI_danzig_conference_desc: "Hold a formal meeting with the SS officers in Danzig. They, like us, resist the grand order of Trinity. With a common enemy, there is no reason not to join hands."
 ARI_channel_for_ss_activities: "Channel for SS Activities"
 ARI_channel_for_ss_activities_desc: "Provide administrative and military convenience for the SS in Danzig. Their organization will supplement our rule in exchange for their knowledge of urban warfare."
 ARI_acceptance_of_german_exiles: "Acceptance of German Exiles"
 ARI_acceptance_of_german_exiles_desc: "German exiles are flocking to Danzig. We will not treat them as mere refugees, but as the 'German Freikorps'—our foreign legion on the front."
 ARI_acceptance_of_german_exiles_tt: "German Freikorps"
 ARI_second_exile: "The Second Exile"
 ARI_second_exile_desc: "Now that the SS has collapsed, we must accept Reinhard Heydrich and his elite members. We will give them Arius badges and officer ranks."
 ARI_wfss_tt: "Waffen-SS"
 ARI_how_to_hate: "How to Hate"
 ARI_how_to_hate_desc: "Imitate old German propaganda to elevate hatred for Trinity into a sophisticated ideology. Make our soldiers berserkers who do not fear death."
 ARI_second_arius: "The Second Arius"
 ARI_second_arius_desc: "The union of Danzig and Arius is complete. We are one entity now. 'The Second Arius' signals a new order to the world."
 ARI_holy_war: "Holy War"
 ARI_holy_war_desc: "This is no mere border dispute. It is a war to wash away Trinity's hypocrisy. Gather the German exiles for the Great Holy War."

