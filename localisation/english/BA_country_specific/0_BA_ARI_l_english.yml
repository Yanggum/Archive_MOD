 ARI_story_event.8.t: "Propaganda Shows Results"
 ARI_story_event.8.d: "The constant propaganda campaigns conducted by our Arius Branch since the Great Shift have finally sowed chaos within Trinity. Furthermore, our prepared guerrilla units are striking Trinity's supply lines from within, and the Angels of Arius, born from Porta Phasis, are active on the front lines aiding our cause.\n\nAlthough this invasion forced us to postpone our original grand war plan against Trinity, the fact that the enemy has compromised their own legitimacy means we can keep them mired in confusion for a much longer period."

 ARI_story_event.9.t: "United Trinity Student Union for Solidarity with Arius"
 ARI_story_event.9.d: "The expected has happened. From the moment rumors circulated that we were preparing a declaration of war against the Arius Branch, a pacifist movement began to coalesce among Trinity students and Germans alike. As soon as actual military operations commenced, numerous groups, including frontline Trinity students, began sabotaging our war effort in the name of pacifism.\n\nFurthermore, the 'Angels' interfering with combat operations accompanied by the sound of trumpets have become a serious issue, and Arius guerrillas—who had been hiding among us for who knows how long—have begun plundering our supply lines in earnest.\n\nTrinity's worst war has begun. It is not a matter of the enemy being strong or the masses supporting them; it is the manifestation of the chaos born from the close yet distant relationship between Arius and Trinity."


