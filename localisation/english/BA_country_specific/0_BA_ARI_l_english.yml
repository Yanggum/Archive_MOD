 ARI_quiet_rearmament: "Quiet Rearmament"
 ARI_quiet_rearmament_desc: "The world believes we are merely survivors in the ruins. Let them indulge in that delusion while we sharpen our fangs in the shadows."
 ARI_from_end_to_end: "From End to End"
 ARI_from_end_to_end_desc: "From the deepest depths of the ruins to the highest spires of the cathedral, our reach shall be absolute."
 ARI_deceptive_operation: "Deceptive Operation"
 ARI_deceptive_operation_desc: "Victory is not always won by the strongest blade, but by the one the enemy never saw coming."
 ARI_use_hanran: "Exploit Chaos"
 ARI_use_hanran_desc: "When the order of Kivotos fractures, Arius finds its opportunity. Chaos is the ladder we shall climb to reclaim our place."
 ARI_TRM_penetration: "Axis of Resistance"
 ARI_TRM_penetration_desc: "We have lived as ghosts for too long. It is time to plant the seeds of dissent within the heart of Trinity."
 ARI_war_with_trinity: "War with Trinity"
 ARI_war_with_trinity_desc: "The time for hiding is over. The 'heretics' of the Council shall finally face the judgment they so heartlessly cast upon us."
 ARI_contact_with_azusa: "Contact with Azusa"
 ARI_contact_with_azusa_desc: "The 'traitor' who left for the light... perhaps she still holds the key to the doors we need opened."
 ARI_contact_with_azusa_trigger_tt: "§Y[TRM.GetNameWithFlag]§!: Political chaos has erupted."
 ARI_azusa_comeback: "§Y$TRN_Shirasu_Azusa$§! has returned."
 ARI_deny_trinity: "Denial of Trinity"
 ARI_deny_trinity_desc: "We reject their unity. We reject their peace. We reject everything that Trinity stands for."
 ARI_second_council: "The Second Council"
 ARI_second_council_desc: "History is written by the victors. This time, we shall be the ones to define what is orthodox and what is heresy."
 ARI_nationalize_war_industry: "Nationalize War Industry"
 ARI_nationalize_war_industry_desc: "Every hammer blow and every gear turn must serve the singular purpose of our liberation."
 ARI_vanitas_vanitatum: "Vanitas Vanitatum"
 ARI_vanitas_vanitatum_desc: "Vanity of vanities, all is vanity. If the world is meaningless, then we shall be the ones to burn it down."
 ARI_TRM_attack: "Spear of Heaven"
 ARI_TRM_attack_desc: "The missiles provided by Gematria are ready. We will launch a decapitation strike against the enemy leadership at a time they least expect."

