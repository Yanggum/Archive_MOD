# Situation Events
## Close Range
 ARI_duel_env.close_range: "A distance reachable with a single leap. A sharp bloodlust flows between the two like a tautly pulled string. Long-range marksmanship is meaningless here, where one can hear Saori's heavy breathing. Only instinctive reflexes and the resolve to break the other's bones will decide life and death."

## Medium Range
 ARI_duel_env.medium_range: "Across the office, the two confront each other, maintaining their most familiar firing range. This distance, neither too far nor too close, is the most familiar standoff zone for the Arius Squad. Who will pull the trigger first, or who will read the other's gap first? Only cold calculations pass in the silence."

## Saori in Cover
 ARI_duel_env.saori_cover: "Jomae Saori has already taken cover behind office furniture. She perfectly controls Azusa's movement from an invisible position. Like a beast stalking prey, her pressure radiating from behind the cover extremely limits Azusa's freedom. A careless move will lead to being suppressed by a bullet from a blind spot."

## Azusa in Cover
 ARI_duel_env.azusa_cover: "Shirasu Azusa has used her small stature to tuck herself behind office cover. It is an attempt to overcome disadvantageous physical conditions with the terrain. She catches her breath behind the cover, calculating the 'death lines' painted on the paths Saori might take to approach."

# Saori's Actions
## Close Combat (Close Range)
 ARI_duel_env.knife_fighting: "A distance where the blade is faster than the barrel. Saori instantly pulls a tactical knife in a reverse grip and launches a relentless series of strikes at Azusa's vitals."

## Suppressive Fire (Not at Close Range)
 ARI_duel_env.suppressive_fire: "Saori pulls the trigger without hesitation. *Bang, bang, bang!* Threatening fire follows in regular intervals, grazing Azusa's feet and ears."

## Sniping (Impossible if Azusa is in cover, not at Close Range)
 ARI_duel_env.sniping: "Saori's halo shines coldly. She stops her breathing and momentarily concentrates her Mystic to aim at Azusa's opening. She is preparing a lethal, precision strike."

## Kicking the Table (Not at Close Range)
 ARI_duel_env.throwing_object: "Saori kicks the surrounding furniture. A heavy table flies like a weapon, and papers from the desk scatter, obscuring vision."

## Gaining Distance (Close Range)
 ARI_duel_env.gaining_distance: "Sensing the danger of close combat, Saori shoves Azusa's shoulder hard and takes a step back. She doesn't miss that split second of an opening and aims her barrel again, trying to gain the range advantage."

## Closing Distance (Medium Range)
 ARI_duel_env.closing_distance: "Saori lunges forward with fierce momentum. A bold maneuver that breaks the standoff of the gunfight and closes into Azusa's embrace. She intends to drag the fight into a brawl without giving a chance to shoot."

## Ambush from Cover (If Saori is in cover)
 ARI_duel_env.surprise_attack: "The moment the silence behind the cover breaks, Saori leaps off the desk. An unexpected angle, an unexpected timing of an aerial assault. She tries to suppress Azusa from above, using her body weight."

# Terrain Objects
## Table (Cover)
 ARI_duel_env.table: "\n\nA thick oak wood table is nearby. It looks sufficient to hide behind or kick over as an improvised shield."

## Wooden Stick (Variable)
 ARI_duel_env.stick: "\n\nSharp wooden fragments from furniture broken during the struggle roll on the floor. They can be crude but lethal stabbing weapons."

## Chandelier (Variable, 1-use)
 ARI_duel_env.chandelier: "\n\nA luxurious chandelier hanging from the ceiling is swaying precariously from the vibration of the gunfire."

## Cabinet (Cover)
 ARI_duel_env.cabinet: "\n\nA massive steel cabinet lies nearby, tilted after the impact of combat. It's a structure that can block vision and be used for flanking or inducing ricochets."

