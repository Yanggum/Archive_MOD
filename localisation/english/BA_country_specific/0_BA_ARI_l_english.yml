 ARI_event.23.t: "Escaping the Pursuit"
 ARI_event.23.d: "Reinhard Heydrich, former security chief of Germany, led the resistance after the shift. But after Trinity linked him to the attack on Seia, he had to flee their pursuit. He has now arrived at the Arius Branch with a few SS members, abandoning plans for America. He is ready to plan anew for the end of Trinity and the rebirth of Germany."
 ARI_event.23.a: "They must think I'm dead."

 ARI_event.70.t: "Creation of German Exile Divisions"
 ARI_event.70.d: "If provided with equipment, many German exiles will organize into a full army to fight on our behalf."

 ARI_event.71.t: "Germans Rallying to [FROM.GetName]"
 ARI_event.71.d: "Arius has declared intent to restore a German state. This has caused a nationalist surge among Germans in Trinity-held areas, and the German Freikorps is forming. This movement will be hard to crush unless the war ends decisively."
 ARI_event.71.a: "Remember the First Council!"
 ARI_event.71.b: "Traitors, all of you!"

 ARI_story_event.1.t: "Secret Meeting with the Kriegsmarine"
 ARI_story_event.1.d: "In the shadow of moldy containers at Danzig's abandoned Pier 3, Jomae Saori stood like a ghost. Opposite her, a man in a stripped-down uniform held a briefcase—an envoy from Admiral Erich Raeder. Their interests aligned: Arius needed sea lanes and supplies, while the Kriegsmarine needed a way to safely regroup German forces stranded within Trinity. Saori marked a line from Danzig to Gotland on a map; the envoy nodded. A dangerous deal between girls chasing vanity and soldiers who have become ghosts was sealed in the cold sea wind."
 ARI_story_event.1.a: "The enemy of my enemy is but a tool."

 ARI_story_event.2.t: "Report on Arius Branch Activities"
 ARI_story_event.2.d: "\nRef: ABS-000950202\nReporter: Vice-President Hanekawa Hasumi\nTo: Trinity Host [TRM.GetLeader]\nCC: Trinity Ground Forces\n\nRecent reports indicate abnormal movements around the Arius Autonomous Zone. While they claim to be victims of the Shift, intelligence suggests a deception. Their intake of gunpowder and machinery far exceeds their food consumption. Unknown units have been spotted on the border. They are preparing to strike. We cannot strike first due to public opinion, but we must prepare our defenses now."
 ARI_story_event.2.a: "Received."

 ARI_story_event.4.t: "Winds of Change"
 ARI_story_event.4.d: "The cold air of Prussia couldn't clear the smell of dust from the paperwork on the desk. Victory over Trinity brought the heavy swamp of 'administration.' Saori, used to triggers, struggled with food ration charts. Misaki sighed from the sofa, noting the irony of former ruins-dwellers holding administrative power. Hiyori presented complaints from new administrators calling their methods 'archaic.' Arius must decide: stick to the old ways of hatred, or adopt the ways of the world to survive."
 ARI_story_event.4.a: "It's not yet time to change."
 ARI_story_event.4.b: "...Do you have something to say, Azusa?"

 ARI_story_event.5.t: "Rotting Logistics"
 ARI_story_event.5.d: "Hiyori brought a ledger from a Danzig warehouse. Supplies are vanishing; Arius-marked medicine is being sold on the black market. The discipline of Arius is cracking as soldiers and clerks grow weary of the long war. Misaki noted that hatred doesn't fill stomachs, and their teaching of 'survival' has led to this greed. Saori realized that iron-fisted rule works for guerrillas, but not for a nation. To fix this, the entire economic system might need to change."
 ARI_story_event.5.a: "...Throw them all in solitary for now."

 ARI_story_event.6.t: "Night of Shattering Glass"
 ARI_story_event.6.d: "The sound of glass breaking signaled the start. Shops run with Trinity capital—tea sets and Peroro dolls—were smashed by SS agitators, jobless Germans, and vengeful Arius students. Saori watched as shops were looted and merchants dragged out. Misaki noted that they weren't just hitting shopkeepers, but hitting the phantom of Trinity that once imprisoned them. This hatred is a deep rift that cannot be easily closed. Saori can either encourage it or stop it."
 ARI_story_event.6.a: "I permit their hatred. Erase every trace of Trinity."
 ARI_story_event.6.b: "Issue an official executive order to ban looting."

 ARI_story_event.7.t: "Dissonance"
 ARI_story_event.7.d: "The heavy door slammed, leaving Saori alone with a draft of a speech slashed with red ink. Azusa had looked at her with contempt, no longer seeing a 'leader' but a 'relic' of a past era. After a sharp argument, Azusa walked out. The nation is split: those who want to finish their revenge, and those who want to build a new home on the ruins. Today's rift feels permanent."
 ARI_story_event.7.a: "Adopt the conservative speech."
 ARI_story_event.7.b: "...Let's try to edit the speech a little."
 ARI_story_event_7_tt: "§gAzusa will now act as the leader of the Reformists.§!"

 ARI_news.1.t: "Proclamation of the Arius Council"
 ARI_news.1.d: "In a ruined cathedral within Trinity territory, Arius announced a shocking statement. Branded as heretics decades ago, they have now declared every other Trinity faction to be the true heretics. Arius leader [FROM.GetLeader] proclaimed that only their faith, forged in pain, is authentic. This is a declaration of total spiritual war against Trinity's legitimacy."
 ARI_news.1.a: "Vanitas vanitatum, et omnia vanitas."
 ARI_news.1.b: "This is unbelievable blasphemy!"
 ARI_news.1.c: "Can they really succeed?"

 ARI_news.2.t: "The Fall of Trinity"
 ARI_news.2.d: "The black flag of Arius now flies over the Trinity Cathedral. [FROM.GetLeader] has declared the 'Complete End of Trinity' and 'Unification by Arius.' The doctrines of Trinity are being burned as heresy. What the world once dismissed as a delusion of exiles has become reality. Arius has swallowed the light."
 ARI_news.2.a: "God is dead. Today, for certain."
 ARI_news.2.b: "The order of Kivotos has changed forever."

 # CASE 1: Azusa Loses
 ARI_news.5.t: "Terror at the Arius Office!"
 ARI_news.5.d: "A violent clash within the Arius leadership has left the government office in ruins. Shirasu Azusa was found collapsed at the scene. While Reformists suspect an assassination attempt by Conservatives, Azusa claimed it was merely a 'personal matter.' Saori is missing, and the public is uneasy about the leadership vacuum."
 ARI_news.5.a: "It's just a personal matter."
 ARI_news.5.b: "...What? They blew up the office over a minor spat?"

 # CASE 2: Azusa Wins
 ARI_news.6.t: "Terror at the Arius Office!"
 ARI_news.6.d: "A clash within the leadership left the office devastated. Saori was found unconscious, and Azusa, though injured, called for help. Both remain silent on the cause, but Saori has stated she will remain to fulfill her duty to the state. Rumors of a split have been quelled for now."
 ARI_news.6.a: "It's just a personal matter."
 ARI_news.6.b: "...What? They blew up the office over a minor spat?"

 # Arius Constituent Assembly
 ARI_news.7.t: "Opening of the Arius Constituent Assembly"
 ARI_news.7.d: "The Arius Constituent Assembly has opened, led by Shirasu Azusa. It aims to transform Arius from a vengeful faction into a 'Republic.' Representatives from Trinity, Germany, and Poland have gathered to discuss the new constitution. This marks the end of Saori's military rule, but challenges remain."
 ARI_news.7.a: "May the cycle of hatred finally be broken."
 ARI_news.7.b: "A sandcastle built with words is easily toppled."

 # Saori Resigns CASE 1: Low Relations
 ARI_news.8.t: "Resignation of Jomae Saori"
 ARI_news.8.d: "Jomae Saori has abruptly resigned and vanished following the passage of the new constitution. While the government calls it a 'planned transition,' rumors suggest she was ousted by Azusa. Without her control, the conservative military and hardliners are showing signs of unrest."
 ARI_news.8.a: "It's a new era."
 ARI_news.8.b: "Is it not just another power struggle?"

 # CASE 2: High Relations
 ARI_news.9.t: "Resignation of Jomae Saori"
 ARI_news.9.d: "With the new constitution proclaimed, Jomae Saori has resigned from all public posts. She stated her mission to stabilize the nation is complete. Even Trinity-affiliated citizens are showing complex emotions at the departure of the woman who was both their tyrant and savior."
 ARI_news.9.a: "It's a new era."
 ARI_news.9.b: "Is it not just another power struggle?"

 # CASE 1: Bad Relations
 ARI_news.10.t: "Arius Constituent Assembly Closes"
 ARI_news.10.d: "The assembly closed after finalizing the constitution, but the air was thick with factional shouting. Saori faced heavy criticism throughout the session. Though the legal framework of the state is set, Saori is expected to make an inglorious exit soon."
 ARI_news.10.a: "The sparks of conflict remain."

 # CASE 2: Neutral Relations
 ARI_news.11.t: "Arius Constituent Assembly Closes"
 ARI_news.11.d: "The assembly has fulfilled its goal of establishing a legal foundation for a civilian government. Saori remained silent during the closing ceremony. Media suggests her role is naturally coming to a close now that the constitution is written."
 ARI_news.11.a: "An era is coming to an end."

 # CASE 3: Max Relations
 ARI_news.12.t: "Arius Constituent Assembly Closes"
 ARI_news.12.d: "Despite diverse representatives, the assembly was orderly due to Azusa's politics and Saori's administration. Saori remained by Azusa's side until the end, suggesting the new government will not exclude the old center of power but will move forward together."
 ARI_news.12.a: "An unexpected turn of events."

 # CASE 1: National Synthesis (Saori Retirement)
 ARI_news.13.t: "Proclamation of the Arius Constitution"
 ARI_news.13.d: "The new constitution establishes a Republic based on 'National Synthesis.' Territory will be managed by autonomous councils for Trinity, Germans, and Poles. However, these councils' refusal to cede power has blocked the introduction of universal suffrage. Without Saori, the center struggles to control the regions."
 ARI_news.13.a: "It is the result of an unstable compromise."
 ARI_news.13.b: "At least there will be no more blood."

 # CASE 2: Universal Republic (Saori Stays)
 ARI_news.14.t: "Proclamation of the Arius Constitution"
 ARI_news.14.d: "The government has declared a 'Universal Republic' that transcends ethnicity. This is a compromise between Azusa's reform and Saori's 'Unified Arius' thesis. All citizens owe loyalty to the Arius State, not to a tribe. Backed by the military, the government can suppress separatism and prepare for universal elections."
 ARI_news.14.a: "One nation, diverse citizens."
 ARI_news.14.b: "It is far too idealistic."

# Dynamic Modifiers

 ARI_two_cities: "Two Cities"
 ARI_two_cities_desc: "This city, divided between Danzig and the Arius Branch by the river, has not yet been unified."

 ARI_gottglaubig: "Gottgläubig"
 ARI_gottglaubig_desc: "The Arius faith, once forged by hatred for Trinity, has transformed. Rejecting Christianity and the Council alike, the Gottgläubig believe only in the God who created this world. It is the unique religion of Arius and the NSDAP."

 ARI_arian_faith: "Arius Faith"
 ARI_arian_faith_desc: "Branded as heretics, Arius was meant to wait in the shadows for revenge. But after the Great Shift, they were forced into the world to prevent total collapse. Their ideology is rooted in a fundamental hatred for Trinity."
 ARI_lighthouse_of_democracy: "The Lantern"
 ARI_lighthouse_of_democracy_desc: "Once an outcast heretic, the Arius Republic has decided not to return the persecution it received. Under the lantern of equality for Trinity, Germans, and minorities, it moves toward a glorious purpose."
 ARI_soft_autonomy_ideology: "Loose Federation"
 ARI_soft_autonomy_ideology_desc: "Arius is now a federation of equal nations—Trinity, Germany, Gehenna, and Poland. While not a powerful union, the citizens are satisfied with the current state and oppose its collapse."

