 # Azusa Victory
 ARI_duel_result.knife_fighting_success: "*Clang!* Sparks flew with the sharp metallic sound. Saori's knife lunged at Azusa's throat, but Azusa parried the blade by a hair's breadth and closed into Saori's space. Saori staggers from the dull impact. She is superior in strength, but Azusa was faster."
 
 # Azusa Defeat
 ARI_duel_result.knife_fighting_failure: "Azusa's knife tried to break Saori's defense, but it was a trap set by the seasoned leader. Saori snatched Azusa's wrist, twisted it, and slammed her into the floor. \"Light.\" with Saori's cold remark, Azusa had to lunge to retrieve the knife she dropped."
 
 # Stick Usage Victory
 ARI_duel_result.knife_fighting_stick: "The moment Saori lunged with her knife, Azusa picked up a sharp wooden piece from the floor and stabbed Saori's hand. \"Urgh?!\" Saori momentarily dropped her knife in surprise at the unexpected weapon. She hurriedly pulled another, but Azusa mixed in a gunshot during that gap."
 
 # Disadvantageous Knife Fighting (Saori Surprise Attack)
 ARI_duel_result.disadvantageous_knife_fighting: "Reaction was too slow! Azusa was pushed back without even resisting against Saori's sudden suppression from behind cover. Azusa groans in pain after taking a hard kick to the abdomen before she could pull her knife."

 # Azusa Gaining Distance Success
 ARI_duel_result.gaining_distance: "Azusa narrowly dodged Saori's attack and leaped back. She lunges between obstacles to secure a firing angle. The threatening close combat situation has returned to a gunfight."
 
 # Azusa Gaining Distance (Took Damage)
 ARI_duel_result.gaining_distance_damage: "She succeeded in widening the distance, but the price was high. Saori's knife grazed Azusa's shoulder as she retreated. Her uniform is torn and red blood seeps out."
 
 # Azusa Closing Distance Success
 ARI_duel_result.close_distance: "Amidst Saori's hail of fire, Azusa boldly advanced through the barrage. Seizing the moment while a flustered Saori tried to reload, Azusa has reached point-blank range. Now is the time for fists and knives rather than guns."
 
 # Suppressive Fire Success
 ARI_duel_result.suppressive_fire: "Azusa's accurate suppressive fire pinned Saori down. Under the hail of bullets, Saori had to click her tongue and duck her head behind cover. Azusa has seized the initiative for a moment."
 
 # Suppressive Fire Ineffective
 ARI_duel_result.suppressive_fire_no_effect: "Azusa pulled the trigger, but it didn't reach Saori, who was hiding behind thick cover. The sound of bullets hitting the desk echoes hollowly. Conversely, the bullets Saori fired all hit Azusa, causing one-sided damage."

 # Critical Failure
 ARI_duel_result.critical_failure: "A mistake in judgment! Taking advantage of Azusa's tangled movements, Saori's heavy blow struck a vital spot. Her breath catches and her vision flickers. If she doesn't create a chance to overturn this, she will lose like this because of one mistake!"
 
 # Sniped by Saori
 ARI_duel_result.sniped_saori: "The moment Azusa exposed her body, Saori's halo flashed. *Bang!* An unavoidable trajectory. Azusa's ballistic plate shattered and she was thrown back by the heavy impact. Bone-aching pain dominates her body."
 
 # Azusa Mystic Sniper Success
 ARI_duel_result.azusa_sniping: "Azusa held her breath and staked everything on a split second. A single strike that accurately pierced Saori's opening as she emerged from cover. Blood spatters from Saori's shoulder and her posture crumbles."
 
 # Clumsy Evasion
 ARI_duel_result.clumsy_evasion: "Azusa dodged the attack by rolling ungracefully on the floor. Her clothes are a mess and covered in dust, but she avoided a fatal wound. Appearance doesn't matter; the survivor is the strong one. However, she consumed some stamina with that forced evasion."

 # Chandelier Fall
 ARI_duel_result.chandelier: "Azusa's bullet severed the ceiling connection. The massive chandelier crashes onto Saori's head with a roar! Saori hurriedly pulled up her Mystic to shoot it down, but she couldn't avoid the rain of glass shards! Saori is heavily wounded and panting heavily."

 # Chandelier Self-Destruction
 ARI_duel_result.chandelier_self_destruction: "The chandelier fell, but the distance was too close! Not only Saori, but Azusa as well couldn't avoid the rain of glass shards. Both are wounded, bleeding, and panting heavily."
 
 # Throwing the Stick
 ARI_duel_result.throwing_stick: "The wooden piece Azusa threw with a desperate strike... flew barely a step and fell to the ground. Saori looks dumbfounded, but for now, it seems her intention to perform another action has vanished. She has successfully seized the attention of the battlefield! ...But Azusa is very embarrassed."
 
 # Successful Cover
 ARI_duel_result.cover: "Azusa quickly threw herself behind cover. Saori's bullets swept over the place where Azusa had been. Having secured a safe position, Azusa assesses the situation again."
 
 # Successful Catch Breath
 ARI_duel_result.catching_breath: "Amidst the fierce exchange, Azusa took a moment to compose her breathing. She corrects her posture and checks her magazine. Her eyes, having regained their coolness, shine sharply again."
 
