 ARI_news.3.t: "Trinity in Chaos"
 ARI_news.3.d: "Massive simultaneous explosions rocked Trinity today. Arius's long-prepared strike paralyzed the Justice Task Force's command and supply lines. Trinity forces are in a panic as Arius units occupy key points like ghosts. The long day has begun."
 ARI_news.3.a: "Teach them what fear is!"
 ARI_news.3.b: "Declare an immediate state of emergency!"
 ARI_news.3.c: "This is unbelievable."

 ARI_news.4.t: "Arius Terror Strike"
 ARI_news.4.d: "Arius attempted a decisive strike, but it was largely intercepted by the Justice Task Force. While there is damage, the command structure remains intact. Arius's 'trump card' caused damage but failed to paralyze us. Now, they must face Trinity's wrath."
 ARI_news.4.a: "...Was it not enough?"
 ARI_news.4.b: "Launch an immediate counter-offensive!"
 ARI_news.4.c: "A horrific act of terror."

 ARI_end_of_pacifism: "End of Pacifism"
 ARI_end_of_pacifism_desc: "Since we launched a preemptive strike on Arius, Trinity students—swayed by Sisterhood's atonement or Arius propaganda—are no longer cooperative with the war. \n\n§YEnd of Pacifism§! has begun. Every §425§! War Support points removes §Rone penalty§!. \n\nOur Points: ([?global.ARI_trinity_pacifism_var|G.0] pts)"
