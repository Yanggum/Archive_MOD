# Diplomacy Events
 ARI_diplomatic_event.1.t: "A Secret Meeting"
 ARI_diplomatic_event.1.d: "Arius has offered us vital intelligence if we invade Trinity, and informed us that they themselves plan to attack soon.\n\nWe can either accept the info and prepare for invasion, or ignore them."
 ARI_diplomatic_event.1.a: "Good. Prepare the invasion."
 ARI_diplomatic_event.1.a.tt: "Directly completing §Y$GEM_war_with_trinity$§! gains a temporary §YNational Spirit§!, §YStability§!, and §YWar Support§!. Also greatly eases focus requirements."
 ARI_diplomatic_event_1_a_tt: "\nArius's Assistance:"
 ARI_diplomatic_event.1.b: "Why should we trust you?"
 ARI_diplomatic_event_1_a_idea: "Acquired Trinity's Operational Maps"
 ARI_diplomatic_event.11.t: "Pandemonium Society Approves"
 ARI_diplomatic_event.11.d: "Pandemonium Society has signed the secret pact and received our maps. They will soon prepare for the invasion."
 ARI_diplomatic_event.11.a: "We should prepare as well."
 ARI_diplomatic_event.12.t: "Pandemonium Society Refuses"
 ARI_diplomatic_event.12.d: "Pandemonium Society refused our offer, stating they will not participate in such a gamble. We must wait or act alone."
 ARI_diplomatic_event.12.a: "Typical of those horned devils."

