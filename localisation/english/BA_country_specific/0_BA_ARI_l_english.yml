#Events
 ARI_event.1.t: "The Capital Relocation Issue"
 ARI_event.1.d: "We must decide whether to move our capital."
 ARI_event.1.a: "To Eden."
 ARI_event.1.b: "Stay as we are."

 ARI_event.2.t: "The Second Council"
 ARI_event.2.d: "As a result of the 'fair' Second Council, held to rectify the illegitimate First Council, Trinitarianism has been denounced. All factions other than the Arians have been designated as heretics."
 ARI_event.2.a: "Perfect."

 ARI_event.3.t: "Defection of Arius Students"
 ARI_event.3.d: "While the Arius Squad was briefly away, a significant number of personnel vanished from the Basilica. It appears to be the work of Beatrice, our vanished former leader."
 ARI_event.3.a: "Madame, so you were there."

 ARI_event.4.t: "Squad Under Attack"
 ARI_event.4.d: "An unknown group, appearing to be Arius students themselves, ambushed the Squad upon their return from breaking Beatrice's siege. They are clearly linked to Beatrice and seem to be targeting Hakari Atsuko. Their goal is undoubtedly the acquisition of the Royal Blood.\n\nFurthermore, it is estimated that many within Arius are still following Beatrice's orders.\n\nIt is impossible to tell how deep Beatrice's reach extends within the school."
 ARI_event.4.d_2: "The Arius Squad has been fleeing Beatrice's pursuers for a long time. Though many students support us after Beatrice's atrocities were exposed, the constant chaos and internal strife she sows has exhausted everyone.\n\nNo one in Arius can trust each other anymore. Beatrice's influence is weakening, but at this rate, the school will fall before she is completely gone..."
 ARI_event.4.d_3: "Arius will not be able to withstand this internal strife any longer... Food, supplies, everything is scarce. Even students who didn't follow Beatrice are turning their backs on us. Everything is collapsing.\n\nIn Arius, we continue to distrust and bite at one another. To prevent the academy's destruction, we may have to acknowledge Beatrice's victory..."
 ARI_event.4.a: "This isn't what I wanted."
 ARI_event.4.b: "..."

 ARI_event.5.t: "The End, and a New Beginning"
 ARI_event.5.d: "Arius Branch. A place where only hatred, anger, contempt, and loathing are mixed.\nBefore Trinity became a General Academy, Arius was a branch like any other, only differing slightly in scriptural interpretation. However, they were branded as heretics for opposing the unification into a single academy at the First Council.\nDeprived of their chapels, they fled to a place unknown even to the GSC President and endured long civil wars. Then, Beatrice arrived. She ruled them through lies and deception, exploiting the students' negative emotions. Her reign continued even after the wars ended.\nThe 'Adult' ruled and exploited the 'Children,' feasting upon them.\n\nAnd then, Arius experienced the Great Shift like all other academies.\nBeatrice returned to Gematria immediately after the shift, leaving the students in the dark. Eventually, they realized she was gone. The Squad noticed it faster than anyone.\n\nBut without Madame, what are we supposed to do?"
 ARI_event.5.a: "We are lost."

 ARI_event.6.t: "Noisy Roadside"
 ARI_event.6.d: "Shortly after beginning the exploration of this place called 'Danzig,' the girl and her companions, dressed in period-appropriate civilian clothes, approached a noisy crowd. A man with a long beard, seemingly the leader, looked at her with a 'What are you doing here?' expression.\n\n'What is happening? Why are you all gathered here in anger?'\n'Can't you see? We're on general strike! We aren't being paid what we're owed!'\n\nThe girl stared at the man expressionlessly. To not be paid for one's work... according to what she read in the library, these must be a 'Labor Union.' A group demanding rights and rewards. She looked at him with hollow eyes.\n\n'Is what you want... to live like a human being?'\n'Yeah, they've been withholding wages ever since that national emergency was declared!'\n\n'Now move aside, kid.'\nThe man said, pushing her with one hand.\n\nVanity of vanities... to want to live like a human. It was quite laughable. Normally, she wouldn't have stepped back, but orders were to avoid provoking the locals. She did nothing. She had the next mission to perform."
 ARI_event.6.a: "I still... don't quite know."

 ARI_event.7.t: "Man in a Suit"
 ARI_event.7.d: "During the exploration of 'Danzig,' Arius students saw a man in a suit giving a speech in the town square. He was shouting, almost screaming.\n\nWhen he finished, the students approached him with questions.\n\n'What are you giving a speech for?'\n'Hmm, looking at your clothes, did you come from that place called Trinity?'\nTrinity. Hearing that cursed name from a local's mouth threw the students into confusion.\n\n'Your reaction says no. Fine. I'll tell you. I'm gathering Germans to build a German homeland.'\n'A German... homeland?'\n'Yeah, I was happy when those damn Poles disappeared, but then Germany was destroyed by some weirdos called Trinity! Damn it!'\nThe man vented his anger into the air for a moment. The Arius students watched him, falling into deep thought."
 ARI_event.7.a: "Are they... like us?"

 ARI_event.8.t: "Surrender of Hakari Atsuko"
 ARI_event.8.d: "At 2:00 AM today, Hakari Atsuko decided to surrender to Beatrice, stating that further resistance was meaningless.\n\nImmediately after her surrender, the students following Beatrice withdrew. The Arius Squad was able to return to the top floor of the school to resume their duties... all except for one."
 ARI_event.8.a: "..."

 ARI_event.9.t: "Beatrice's Demand for Submission"
 ARI_event.9.d: "Madame has demanded our absolute obedience once again."
 ARI_event.9.a: "We will not follow you anymore!"
 ARI_event.9.b: "Welcome back, Madame."

 ARI_event.10.t: "Flight of the Arius Squad"
 ARI_event.10.d: "Under an assault orchestrated by Beatrice, the Arius Squad suffered heavy damage and was forced to retreat, leaving Atsuko behind.\n\nThe students following Beatrice's orders have left the academy to join Madame's main forces, allowing the remaining Squad members to re-occupy the top floor."
 ARI_event.10.a: "...!"

 ARI_event.11.t: "Explosion in Eden's City Center"
 ARI_event.11.d: "A massive explosion, presumed to be a chemical transport failure, has rocked Eden, the heart of Trinity."
 ARI_event.11.a: "It's not a good omen."

 ARI_event.12.t: "Missing Citizens"
 ARI_event.12.d: "The Justice Task Force has discovered that the number of citizens in Trinity territory has decreased noticeably."
 ARI_event.12.a: "They've slipped out of our academy."

 ARI_event.13.t: "Escalating Resistance"
 ARI_event.13.d: "Reports have reached the Tea Party suggesting suspicious movements among the citizenry."
 ARI_event.13.a: "It's dangerous."

 ARI_event.14.t: "Espionage Operation Discovered"
 ARI_event.14.d: "It appears Trinity has found the tail of our agents performing infiltration operations. If we continue, Trinity will undoubtedly launch an immediate invasion. We must halt operations for a while."
 ARI_event.14.a: "We must keep a low profile for now."

 ARI_event.15.t: "Espionage by the Arius Branch"
 ARI_event.15.d: "An unbelievable report reached the Tea Party today: the espionage operations targeting Trinity began from the Arius Branch, which had previously fled from us. According to the report, Arius has been planning revenge since before the Great Shift and has been exploiting our post-shift instability to sow chaos."
 ARI_event.15.a: "'Today, Trinity was attacked.'"

 ARI_event.16.t: "Treatment of the Arius Branch"
 ARI_event.16.d: "After the Long Night, all Arius influence in Germany has been removed. We must now decide the fate of the Arius students. Since they aided in the recovery of Germany, we can either grant them an autonomous zone or eliminate them for the sake of German history."
 ARI_event.16.a: "Reorganize Danzig as the Arius Autonomous Zone."
 ARI_event.16.b: "Eliminate the Arius Squad."

 ARI_event.17.t: "Relocation of the Capital"
 ARI_event.17.d: "We have risen from long-standing persecution to crush the loathsome Trinity and declare the Arius General Academy. As we reorganize, many suggest moving the capital."
 ARI_event.17.a: "Eden."
 ARI_event.17.b: "Is there a need to move?"

 ARI_event.18.t: "Berlin Military Tribunal: Tea Party"
 ARI_event.18.d: "After accepting Trinity's surrender, the military trials began in their capital, Eden, now renamed Berlin. First to be tried are the Tea Party, Trinity's leadership, who were our constant enemies throughout the war."
 ARI_event.18.a: "Hang them!"
 ARI_event.18.b: "Sentence them to life imprisonment."

 ARI_event.19.t: "Berlin Military Tribunal: Clubs"
 ARI_event.19.d: "The second trial concerns the clubs that made up Trinity. Most actively cooperated with the regime and assisted in Trinity's war effort."
 ARI_event.19.a: "Execute those in charge and arrest everyone else."
 ARI_event.19.b: "Arrest the leaders and re-educate the members."

 ARI_event.20.t: "Berlin Military Tribunal: Students"
 ARI_event.20.d: "The third trial is for the general student body of Trinity. While mostly neutral, they are responsible for upholding the regime and condoning the war."
 ARI_event.20.a: "Execute or imprison all collaborators."
 ARI_event.20.b: "Actively encourage whistleblowing."
 ARI_event.20.c: "Sign the Final Solution."

 ARI_event.21.t: "Berlin Military Tribunal: German Citizens"
 ARI_event.21.d: "The fourth trial is an uncomfortable one: the German citizens. While most resented Trinity, many were incited by the fake National Socialism promoted by Misono Mika's regime and supported Trinity."
 ARI_event.21.a: "...Arrest all the traitors."
 ARI_event.21.b: "...Act as if it never happened."

 ARI_event.22.t: "End of the Military Tribunal"
 ARI_event.22.d: "After the last major trials, only a few minor cases remain. The tribunal will continue to function for a while, but the number of defendants has plummeted."

 ARI_event.24.t: "Finding $ARI_hakari_atsuko$"
 ARI_event.24.d: "$ARI_hakari_atsuko$ has returned to Arius, having been found collapsed in a nearby city by patrolling students.\n\nAfter waking up, she claimed she was used in Madame's experiments. She awoke in a ruined cathedral and collapsed while trying to flee back to Arius."
 ARI_event.24.a: "Beatrice...!"

 ARI_event.25.t: "Signs of Trinity Invasion"
 ARI_event.25.d: "Our political maneuvering against Trinity has been exposed. Trinity General Academy has begun deploying troops to our borders and will soon launch an invasion.\n\nEvery student of Arius is ready for the Holy War against Trinity."
 ARI_event.25.a: "Prepare for battle!"

 ARI_event.26.t: "The Final Verdict"
 ARI_event.26.d: "The massive public trials held after Arius's victory over Trinity have concluded with the execution of the entire Trinity leadership and the eternal service of all Trinity students.\n\nTrinity's long oppression of Arius is finally over, and we will ensure they never rise again."
 ARI_event.26.a: "A grand victory."

 ARI_event.27.t: "Contact from Another World"
 ARI_event.27.d: "Groups calling themselves the Arius Branch have reached out, offering to provide information and join our side if war breaks out between us and Trinity.\n\nThey claim Arius has infiltrated Trinity deeply and speak repeatedly of a grand struggle against them."
 ARI_event.27.a: "Fine, let's try it."
 ARI_event.27.b: "We cannot jump into such a dangerous scheme."

 ARI_event.28.t: "Poland Accepts"
 ARI_event.28.d: "The Polish government has accepted the secret agreement. Poland will now join the war on our side if it breaks out."
 ARI_event.28.a: "Good."

 ARI_event.29.t: "Poland Refuses"
 ARI_event.29.d: "The Polish government has refused the treaty, citing the danger and their lack of knowledge about Arius."
 ARI_event.29.a: "I see."

 ARI_event.30.t: "Arius Enters War Against Trinity"
 ARI_event.30.d: "Arius, our treaty partner, has entered war with Trinity. We are now ready to support Arius and launch our offensive."
 ARI_event.30.a: "To war!"

 ARI_event.31.t: "Poland Honors the Treaty"
 ARI_event.31.d: "Poland has decided to honor our treaty and join the Holy War against Trinity. The final war to crush Trinity has begun!"
 ARI_event.31.a: "To war!"

 ARI_event.32.t: "Poland's Territorial Demands"
 ARI_event.32.d: "After the war, during the Second Council, Poland demanded the return of its former territories as the price for its participation."
 ARI_event.32.a: "This is a fair price."
 ARI_event.32.b: "Offer southern territories instead, excluding Danzig."
 ARI_event.32.c: "No."

 ARI_event.33.t: "Arius Returns Territory"
 ARI_event.33.d: "Our government demanded pre-Shift Polish territories from Arius. The Arius government has accepted and will cede the rightful lands."
 ARI_event.33.a: "This is a fair price."

 ARI_event.34.t: "Silesia Instead of Danzig"
 ARI_event.34.d: "Our government demanded pre-Shift territory, but Arius argued that Danzig contains too many regions vital to Arius and offered Silesia instead."
 ARI_event.34.a: "Not bad."
 ARI_event.34.b: "We will not give up our access to the sea."

 ARI_event.35.t: "Polish Government Accepts"
 ARI_event.35.d: "The Polish government has responded positively to our Silesia proposal. A document signed by the head of state has arrived.\n\nA new border between Arius and Poland has been established."
 ARI_event.35.a: "Not bad."

 ARI_event.36.t: "Polish Government Refuses"
 ARI_event.36.d: "The Polish government refused the Silesia proposal, stating they will not abandon the coastal access rights guaranteed since WWI.\n\nWar with Poland seems imminent."
 ARI_event.36.a: "Oh dear."

 ARI_event.37.t: "Arius Refuses Territorial Partition"
 ARI_event.37.d: "Arius has refused our demand for pre-Shift territory, taking a hardline stance that all Trinity lands belong to Arius."
 ARI_event.37.a: "We will not give up our rightful territory."
 ARI_event.37.b: "We must avoid a new conflict."

 ARI_event.38.t: "[FROM.GetName]'s Trinity Collaboration Government"
 ARI_event.38.d: "After our victory, [FROM.GetName] has decided to establish local collaboration governments to manage occupied zones.\n\nNow that the government is set up, [FROM.GetName] is requesting that we return Trinity territory to them."
 ARI_event.38.a: "A good idea."
 ARI_event.38.b: "No, we will keep everything we occupied."

 ARI_event.39.t: "[FROM.GetName] Approves Territorial Return"
 ARI_event.39.d: "We requested the return of territory to the autonomous government we established, and [FROM.GetName] has accepted and returned the land."
 ARI_event.39.a: "Good."

 ARI_event.40.t: "[FROM.GetName] Refuses Territorial Return"
 ARI_event.40.d: "We requested the return of territory to the autonomous government, but [FROM.GetName] seems to have other plans."
 ARI_event.40.a: "Unfortunate, but it can't be helped."

 ARI_event.41.t: "Reinstatement of Hakari Atsuko"
 ARI_event.41.d: "After Arius made contact with the citizens of Danzig, significant changes began to take place. Students are now discussing 'justified resistance' rather than indiscriminate revenge, and the violent Arius education system is being abolished.\n\nIn this atmosphere, the arguments of Hakari Atsuko—who had long advocated for reform and contact with Trinity—are gaining new attention."
 ARI_event.41.a: "I acknowledge you, Atsuko."

 ARI_event.42.t: "The First Election"
 ARI_event.42.d: "Shortly after the federation was established under Arius and Danzig, the first election was held. Trinity students and many Germans were restricted, while Arius and Danzig students formed the electorate.\n\nJomae Saori was elected. She gave her inaugural speech before the wary Germans, the silent Danzigers, and the cheering Arius students."
 ARI_event.42.a: "The end of Trinity."
 ARI_event_42_tt: "§G60%§! of §YNon-Aligned§! party popularity will be added to §YDemocratic§! party popularity."

 ARI_event.69.t: "Creation of Police Brigade"
 ARI_event.69.d: "By reclaiming Old German territory and issuing executive orders to the police organizations, we have organized a police brigade. They will serve as a full military force to be sent to the front on our behalf."
 
# Arius Description
 ARI_Trinity_core_states_catagories: "Integration of Trinity"
 ARI_Trinity_core_states_catagories_desc: "\n\n£GFX_ARI_trm_add_core\n\n\n\n\nTrinity General Academy was formed peacefully long ago at the First Council, but Arius thought the terms were unfair and protested. In response, they used violence to seize our lands and take our students. We fled to the wilderness to survive. But things have changed. Trinity has surrendered, and it is time to integrate the territory."
 ARI_trinity_core_tt: "§YFully control§! all of Trinity's core states."
 ARI_Trinity_core_states_decisions: "Territorial Integration"

 ARI_GATHERING_STORM_DESC: "Originally, Arius was meant to be integrated into Trinity, but it became a pariah school after protesting the inequality of the proposed terms. Branded as heretics, they were forced to flee.\n\nArius could not escape the Great Shift, and their hiding places have vanished. Fortunately, Trinity seems too preoccupied with its own chaos to notice us. \nPerhaps this is another opportunity for Arius."

 ARI_country_intro_header: "Between Dreams and Mirages"
 ARI_country_intro_content: "The dream of happiness that felt so close has vanished like a mirage. Seasons change, the world changes, but the Squad's misfortune remains the same.\n\nThe wealthy children of Trinity keep their smiles even in this chaos, while the Squad is once again made wanderers.\nTrinity pushes them into the wilderness even today, and no one in the world knows.\n\nBut the Squad knows. They know who pushed this pain onto them. They know who is smiling.\n\nNow, it is time to flee from a pain that was never meant for the Squad.\nIt is also time to return that pain to its owner.\n\"Lord, have mercy upon us.\" (Kyrie Eleison)\n\n§YDev - SKSKIe§!\n§YAssistant Dev - subikgm, bang0709§!\n§LFormer Dev - subikgm, slovakiamodding, pencildude, scpfoundationo5_01§!\n§L(Note: The legacy of these former developers has been liquidated!)§!"
 ARI_guide: "£white_dot Set relations with the Nazi Party in Danzig and rebuild the academy.\n\nRule of the Squad\n£white_dot Plunder resources from Trinity and build up the military.\n£white_dot §R...Prepare for a massive raid.§!\n£white_dot Now, crush Trinity.\n£white_dot Integrate and rebuild Trinity territory.\n\n£white_dot §LFortress Arius§!\n   £white_dot §WSuppress the movements of the Reformists.§!\n   £white_dot §LArius Conservatives will find their own path.§!\n\n£white_dot §4Our Manifesto§!\n   £white_dot §WBreak through Conservative obstruction and win the Third Council.§!\n   £white_dot §4...Azusa will persuade Saori.§!\n\n£white_dot §REmergency Government§!\n   £white_dot §pNeither Reformists nor Conservatives could gain the upper hand.§!\n   £white_dot §R...Then, we shall find an alternative.§!\n   £white_dot §SNow, rebuild the nation, restore the people's livelihood, and reach out to the losers once more!§!\n\nAnd... if you crush Gehenna and unify Central Europe...\n\n\n\n§CThe glory of Arius shall descend once more.§!"

 ARI_focus_can_only_game_started_tt: "This focus will start automatically when the game begins."



