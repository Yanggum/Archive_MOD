 ARI_conservative_event_chain.1.t: "After the Rain, Clear Skies"
 ARI_conservative_event_chain.1.d: "In the late afternoon in the city center after a rain shower passed, the meeting hall of the barely regrouped Reformists was submerged in a silent and damp atmosphere like a camp of defeated soldiers. There were no more shouts cutting through the air, nor agitators screaming for revolution with bloodshot eyes. Only the heavy breathing of those standing on the cold concrete floor of reality hung like a mist.\n\nShirasu Azusa, taking the podium, slowly scanned the audience like a commander looking down on an old battlefield. Her uniform was neat, but on her shoulders, the lonely shadow of one who failed to realize her ideals hung like an epaulet.\n\n'...The direction of the wind has changed. We tried to become the storm, but we must admit we were merely scattered dust.'\n\nAzusa's voice was dry, but it pierced through the painful truth. She clenched her fist, then slowly opened it. It was a signal of surrender and a ritual of letting go of the hollow stubbornness she had been holding onto.\n\n'The walls built by the old order were sturdy, and the hammer we used to try and break them is broken. ...But if the wall doesn't collapse, I think we must learn to live within it. Now, we will no longer be enemies pointing spears, but will pursue cooperation and moderate change.'\n\nIt was a declaration of defeat and a change of course, choosing to remain a checking force within the system instead of radical destruction. Among the listening crowd, instead of groans, a sigh of relief spread quietly like a beach where rough waves have subsided and only ripples remain. The citizens knew. No more blood would be shed, and the steering wheel of Arius was now firmly in the hands of Saori and the Conservatives.\n\nToward the massive government building visible outside the window, Azusa gave a short and disciplined salute. It was a courtesy to the victors and a mark of respect for the reality of the nation."
 ARI_conservative_event_chain.1.a: "The storm has passed."

 ARI_conservative_event_chain.2.t: "Sign Here"
 ARI_conservative_event_chain.2.d: "When Utazumi Sakurako and other Sisterhood leaders stood in the underground court of Trinity Cathedral, the eyes of the Arius hardliners filling the gallery were gleaming with bloodlust. They wanted the harshest punishment for the 'Basilica Witches.' No one wanted to judge them, but everyone wanted them to bleed.\n\nBut Jomae Saori, sitting in the center of the judge's bench, thought differently. Of course, the Sisterhood also pointed guns at us on the front, and it is true they participated in the war more actively than at other times due to the chemical weapons we used. But what if we define them as 'war criminals' now and execute or imprison them? Then we would have to throw every Trinity student who pulled a trigger under the Tea Party's orders into prison. That wouldn't be governance; it would mean an eternal massacre.\n\n'...The Tea Party and Justice Task Force have fallen. I take into account that unlike them, you did not lead an \"active war.\"'\n\nAs Saori's dry verdict was read, the room grew restless. However, Saori was unmoved and pronounced the next sentence.\n\n'However, you are not without guilt. Therefore, the \"succession rights to the Justina Council,\" the old war-criminal group you claimed to follow, are permanently revoked. You are no longer the descendants of the Council. Furthermore, as of today, the study of Arius philosophy is mandatory in every nunnery's curriculum.'\n\nSakurako bit her lip but eventually bowed her head to accept the verdict. It was a major retreat for the Sisterhood's cause and might lead to its eventual disappearance... but to the nuns who had expected something more horrific, it allowed them to exhale a sigh of relief. Fortunately, instead of seeing blood, Saori chose to put their 'faith' on the operating table."
 ARI_conservative_event_chain.2.a: "The Sisterhood has... nothing to do with the Justina Council."

 ARI_conservative_event_chain.3.t: "After-School Sweets Club"
 ARI_conservative_event_chain.3.d: "'U-Uwa... Um, so... according to Arius's new public order law, unauthorized private club activities of 3 or more people are... Ugh?!'\n\nTsuchinaga Hiyori, who opened the door to the After-School Sweets Club room, couldn't finish her sentence. What Natsu and Kazusa pushed toward her was a 'Trinity Limited Edition Special Mont Blanc' and steaming hot black tea.\n\n'Now, now. We can talk about the stiff stuff after eating this, right? Guest from Arius.'\n'Hiyori-chan, was it? This is really hard to find, but we're giving it to you specially.'\n\nHiyori's pupils shook violently. The 'Forced Dissolution Order for Separatist Groups' in her hand became lighter than a piece of scrap paper in front of the sweet smell of butter. She intended to take just one bite, just one, and then be strict, but when she came to her senses, the plate was already clean.\n\n'...U-Um... so... I'll permit the club's continuation. I-In exchange... since you have to be under Arius surveillance...'\n'Surveillance needs a budget, right? If you support our ingredient costs, you're welcome to come and \"monitor (taste)\" anytime.'\n\nIn the end, what Hiyori brought to Saori wasn't a dissolution order, but a <Proposal for Full Support of After-School Sweets Club Activities and Special Snack Budget>. The justification was 'soothing the dissatisfaction of remaining Trinity forces,' but the papers smelled strongly of powdered sugar. Arius treasurers clutched their necks at this massive expenditure item but couldn't bring themselves to reject it after seeing Hiyori's happy face."
 ARI_conservative_event_chain.3.a: "This is clearly a waste of budget!"

 ARI_conservative_event_chain.4.t: "Library Committee"
 ARI_conservative_event_chain.4.d: "The heavy door of the library opened, and Iwashino Misaki walked in with steady steps. The space, reeking of mold and old paper, was a strangely comfortable place for Misaki, who hated light.\n\nKozeki Ui, who was hiding behind a bookshelf and trembling, was about to scream when she saw Misaki, but shut her mouth when she met Misaki's dry and hollow eyes. She smelled the scent of a 'kindred spirit' in the intruder—the desire to be disconnected from the world.\n\n'...We need cooperation. We'll protect you so those noisy people outside won't bother you. In exchange, Arius takes ownership of the ancient books here.'\n'...Protection? Really... will you really stop those noisy idiots? So I can just read books in this darkness... without sunlight or noise?'\n'Yeah. We hate noise too.'\n\nMisaki sat down on the floor and fiddled with her wrist, and Ui quietly sat opposite her. A dark and heavy silence that communicated without words flowed between them. It was a bizarre resonance, as if an abyss and an abyss were looking into each other.\n\n'Ugh... Excuse me, the air here is so heavy I can't breathe... I, I'll be going now!'\n\nThe librarian Shimiko, unable to bear the atmosphere, screamed and fled the library. Control of the library was transferred with surprising peace and gloom."
 ARI_conservative_event_chain.4.a: "...Reading this document alone makes me feel gloomy."

 ARI_conservative_event_chain.5.t: "Above All Names"
 ARI_conservative_event_chain.5.d: "The Arius flag hoisted atop the old Trinity Cathedral no longer fluttered as if about to be torn by the wind. It simply sat there heavily and quietly, as if it had always been there, ruling the skies of Central Europe.\n\nJomae Saori stood on the terrace once used by the Tea Party hosts, looking down at the empire spread before her feet. The Trinity campus that was once an object of hatred, and beyond that, the red territory of a kneeling Gehenna. Everything in sight was now controlled under the name of Arius.\n\n'...It's laughable.'\n\nIwashino Misaki, perched on the railing, muttered with hollow eyes.\n\n'We made such a fuss because we hated Azusa joining hands with those Trinity folks. But look. Half the bureaucrats working under us are from Trinity, and the factory workers are from Gehenna. Revenge? Who are we getting revenge on now? Everyone we pass on the street bows to us.'\n\nMisaki was right. Victory was not the completion of a sweet revenge, but the disappearance of the object of revenge. The moment they crushed every enemy in the world, Arius paradoxically became the 'great ruler' they so despised. In the place where the fuel of hatred had burnt out, all that remained was a massive administrative machine, a powerful military, and the heavy responsibility of 'governance.'\n\n'...Still, we don't have to run away anymore. We don't have to eat moldy bread, and we don't have to tremble at night wondering if someone will break in...'\n\nTsuchinaga Hiyori said as if relieved, wrapping both hands around a luxurious teacup. It was the most primal, yet most certain proof of victory.\n\nSaori slowly raised her head and stared at the horizon. Ghosts of the ruins, shadows of the academy city, the forgotten. All those slurs have now vanished into the history books. They will never hide in the darkness again.\n\n'Vanitas Vanitatum.'\n\nThe doctrine flowing from Saori's mouth appeared not as the usual self-ridicule or despair, but paradoxically as it regained its original meaning."
 ARI_conservative_event_chain.5.a: "'Yet, we stand at the apex of that vain world. That is enough.'"
 ARI_conservative_ending_tt: "§gThe story of the Squad that came to lead the Arius Branch ends here. Complete integration may still be far off, and Jomae Saori, who prioritizes the stability of the branch, may not be able to accept further changes. However, the students of Arius who wandered through the ruins have now found their rightful place in the world and stand as the proud victors of Central Europe. Whatever Jomae Saori felt at the end of the road, she will be remembered as a hero in Arius.§!\n\n§LThe Conservative content for the Arius Branch is now complete. Thank you for playing!§! §H- SKSKIe§!"

