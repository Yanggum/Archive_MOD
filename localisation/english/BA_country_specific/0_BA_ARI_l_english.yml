 #########################################
 # Reformist Story Events: Final Duty - Outcome Branches
 #########################################

 # CASE 1: Azusa Defeat
 ARI_reformist_event_chain.28.t: "The Final Duty - Extinguished Light"
 ARI_reformist_event_chain.28.d: "The office was miserably shattered, as if hit by a bombardment. At the end of the long exchange, it was Shirasu Azusa who reached her limit first and collapsed.\n\n'Haa... haa...!'\n\nAzusa's breathing, as she barely leaned against a broken table, had a metallic rasp, and the halo above her head flickered precariously as if about to go out. Jomae Saori was also in no better state, bleeding and panting heavily, but she remained standing on her two feet.\n\n'...Unfortunate. If you had been just a bit more persistent, I would have been the one to fall.'\n\nSaori tossed her empty pistol onto the floor and turned away casually. Her voice was dry as usual, but it was trembling slightly.\n\n'This should prove it. My role truly ends now. The rest of the work... you can handle well on your own, Azusa.'\n\n*Thud, thud.* The sound of Saori's footsteps walking toward the door began to fade. Azusa tried to reach out with a hand as heavy as lead, but it only cut through the air.\n\n'...I'm sorry...'\n\nWith that squeezed-out sentence toward the retreating back, Azusa's halo completely lost its light. Leaving the unconscious Azusa behind, Saori disappeared into the darkness without looking back."
 ARI_reformist_event_chain.28.a: "It was a hand that could not be grasped."

 # CASE 2: Azusa Victory
 ARI_reformist_event_chain.29.t: "The Final Duty - The Surpassed Mountain"
 ARI_reformist_event_chain.29.d: "On the office floor where the thick gunpowder smoke had cleared, Jomae Saori, who had seemed like a mountain that could never be surpassed, lay fallen. Her uniform was miserably torn, and she was panting heavily on her back.\n\nThe barrel of Shirasu Azusa's gun, looking down at her, was trembling slightly. Azusa was also at her limit and staggering as if about to collapse at any moment, but it was she who remained standing and aiming the gun.\n\n'Haa... hu. ...Pathetic.'\n\nSaori let out a self-deprecating chuckle while looking at the ceiling. A strange sense of relief, rather than the humiliation of defeat, passed across her face.\n\n'I lost, Azusa. It ends like this after all.'\n\nAzusa slowly lowered her gun. Then, staggering closer, she knelt by Saori's side and slumped down. Contrary to Saori's expectation that she would be held by a 'command to the loser,' what came from Azusa's mouth was a tearful plea.\n\n'It's not a command... it's a request. Stay by my side, Saori.'\n\nAt the earnest voice pleading not to be abandoned, Saori's eyes widened momentarily, then she chuckled and turned her head. \n\n'Rules are rules... since I lost, I suppose I have no choice.'\n\nHer face was peaceful, as if she had finally put down a heavy burden. Amidst the surging fatigue and long-awaited relief, Saori quietly closed her eyes and fell into a deep sleep."
 ARI_reformist_event_chain.29.a: "Our story does not end here."

 #########################################
 # Reformist Story Events: Saori's Resignation (End of Constituent Assembly)
 #########################################
 # CASE 1: Low Relations
 ARI_reformist_event_chain.30.t: "The End of the Sandcastle"
 ARI_reformist_event_chain.30.d: "The morning after the new 'Arius Republican Constitution' passed the parliament amidst cheers, what Shirasu Azusa faced was the firmly closed door of the first office.\n\nJomae Saori was already gone. On the wide desk lay a blank space with no personal items left, and a single resignation letter printed in dry characters. She didn't even leave a farewell. No, there was no bond left between them to share a proper goodbye anyway.\n\nIn the name of reform, the two had clashed too often and grew disappointed in each other's ways. To Saori, Azusa was a 'dreamer who didn't know reality,' and to Azusa, Saori had long since become the 'old order that couldn't be reasoned with.'\n\nAzusa stood in the middle of the cold office, blankly staring at the empty chair. She had ousted the tyrant and established a democratic republic, but what remained was a deep sense of disconnect and a piercing loneliness from having to sustain this massive sandcastle alone. A piece of paper called a constitution could not fill the vacancy of her lost comrade."
 ARI_reformist_event_chain.30.a: "The bridge back is already burned."

 # CASE 2: High Relations
 ARI_reformist_event_chain.31.t: "The Period"
 ARI_reformist_event_chain.31.d: "On the evening the final gavel of the Constituent Assembly rang out, Jomae Saori was walking out of the headquarters' back door with a light duffel bag on her shoulder. And in that path stood Shirasu Azusa.\n\n'...I thought I said a send-off wasn't necessary.'\n\nSaori spoke calmly, but there was a faint warmth in her voice. Azusa bit her lip. Whether she tried to hold on by force or spent many nights trying to persuade her, she ultimately couldn't break Saori's stubbornness.\n\n'Do you... really have to go?'\n'Yes. If shadow mixes where light touches, it only leaves a stain. There's no place for \"Dictator Jomae Saori\" in the republic you've built. That's only right.'\n\nSaori approached and lightly stroked Azusa's head. It was the same blunt touch of encouragement she used to give during their trainee days.\n\n'Don't get hurt, Azusa. And... don't look back. This is the path you chose.'\n\nWith those words, Saori walked into the night mist. Azusa didn't hold her back anymore. She knew that protecting this peace and the nation Saori had left her was the only way to repay the one who was leaving."
 ARI_reformist_event_chain.31.a: "Goodbye, Saori."

 ARI_reformist_event_chain.32.t: "The Face of the Nation"
 ARI_reformist_event_chain.32.d: "As the constitution of the Universal Republic was enacted, Arius's power structure solidified into a firm dual executive system. In the setting, Jomae Saori serves as the steadfast head of state and the chief of the military, sustaining the nation's foundation, while Shirasu Azusa leads the overall state affairs as the Prime Minister overseeing government operations.\n\nHowever, which person should represent the government externally? Even if the clear representative under the constitution is Jomae Saori, the substantial leader recognized by the public is Shirasu Azusa. Therefore, this delicate balance must be resolved, and it must be decided who internally represents the government's practical work."
 ARI_reformist_event_chain.32.a: "Put forward Shirasu Azusa."
 ARI_reformist_event_chain.32.b: "Put forward Jomae Saori."

 ARI_reformist_event_chain.33.t: "Prayers in the Heart"
 ARI_reformist_event_chain.33.d: "'The amnesty decree applies equally to the Sisterhood. However...'\n\nShirasu Azusa looked calmly at the Sisterhood leadership sitting tensely across the table. Utazumi Sakurako sat with her hands together, waiting for Azusa's next words, while Wakaba Hinata next to her was fidgeting nervously.\n\n'Religious political activities based on Trinity's doctrine can no longer be permitted. Instead, if the Sisterhood operates as a pure public organization dedicated only to relief and service, Arius will guarantee your survival. Caring for the wounded and clearing ruins wouldn't conflict with your doctrine, right?'\n\nSakurako let out a light sigh of relief. Compared to the harsh retaliatory suppression or heresy trials expected from the Arius Branch, this was an act close to mercy.\n\n'...I understand. The essence of our Sisterhood is to bestow peace and grace upon our neighbors. We accept those conditions.'\n'That's good. Everything is vain, but finding the meaning of living nonetheless is the current Arius. If your service helps someone, that is enough.'\n\nJust then, Iochi Mari, who had been silently praying, looked up with sparkling eyes.\n\n'Finding the meaning of living despite everything being vain... Arius's doctrine may, in the end, be touching the peace we desire. ...Ah?'\n'Ma-Mari-nun?! Th-That's heresy... Ack, no, I didn't mean that...! Ugh, I made another big slip of the tongue... I'm sorry!'\n\nHinata, who out of habit almost called it heresy in front of that very heretic, waved her hands frantically with a pale face, and Sakurako also cleared her throat, unable to hide her embarrassment.\n\n'Mari, please calm yourself. Azusa-san, that remark is by no means the official position of the Sisterhood...'\n'It doesn't matter. We don't force anything. ...This side is settled. I'll be in your care from now on.'\n\nThe shackles of past sins and heresy were removed. Even if they could not openly express their doctrine, they could once again offer prayers for peace under the new sky of Arius."
 ARI_reformist_event_chain.33.a: "Goodwill is sometimes harder to deal with than bullets."

 ARI_reformist_event_chain.34.t: "Relief where Relief is Needed"
 ARI_reformist_event_chain.34.d: "In a worn-out, drab temporary clinic in the Arius Autonomous Zone, rather than a luxurious ward in Eden, Shirasu Azusa quietly opened the door. There, the old leader of the Remedial Knights, Aomori Mine, was carefully bandaging the injured arm of an Arius student. It was a peaceful scene, unbelievable for those who once aimed gun barrels at each other.\n\n'Trinity has been completely annexed. We were your enemies, and the ones who tore down everything you tried to protect.'\n\nAt Azusa's cautious but pointed question, Mine only slowly turned around after she finished the bandage. There was neither the cringing of a defeated general nor resentment toward an enemy nation on her face. She was just the same steadfast and neat self as always.\n\n'It is natural for the Remedial Knights to go wherever relief is needed.'\n\nMine's answer was very concise.\n\n'It doesn't matter if we were enemies in the past or which academy someone is from. If there is a wounded person suffering before my eyes, I reach out. That is the essence of \"relief\" as I have defined it.'\n\nMeeting Mine's unwavering eyes, Azusa let out a small sigh and a thin smile. Her ideal of building a new Arius and Mine's vow to treat anyone wounded were ultimately touching.\n\n'I see. I won't control or doubt your activities.'\n\nAzusa took an administrative order out of her pocket and set it on the table.\n\n'Instead, I'll take measures so that the Remedial Knights are exempt from military police inspections and have top priority for transit within the Arius zone. The government will also support the medical supply line. ...I'll continue to rely on you for the wounded.'\n'Thank you. May grace be with everyone.'"
 ARI_reformist_event_chain.34.a: "She was a trustworthy person."

 #########################################
 # Reformist Story Events: Creation of the Arius Prefect Team
 #########################################

 # CASE 1: Saori Resigned Amidst Criticism (Low Relations)
 ARI_reformist_event_chain.35.t: "The New Prefect Leader"
 ARI_reformist_event_chain.35.d: "Kakehashi Subaru's gaze, looking down at the 'Arius Prefect Leader Appointment' Shirasu Azusa presented, was cold.\n\n'After sending Saori away like that, now you're reaching out to me? Honestly, it's a bit funny.'\n\nAt Subaru's piercing question, Azusa remained silent, unable to make any excuse. Without the cooperation of Subaru, who had become the new center of the Conservatives, she couldn't fully organize a Prefect Team to handle security in the empty Arius.\n\n'Well, still... at least in this mess, there doesn't seem to be anyone else to take this job but me.'\n\nSubaru picked up the appointment with a short sigh.\n\n'Fine. I'll accept being Prefect Leader. If any security issues arise, I'll help as much as I can. Well, in the \"Arius way,\" that is.'"
 ARI_reformist_event_chain.35.a: "At least the security vacuum is filled."

 # CASE 2: Saori Retired Peacefully (Mid Relations)
 ARI_reformist_event_chain.36.t: "The New Prefect Leader"
 ARI_reformist_event_chain.36.d: "'Such a heavy position... Jomae Saori-san would have suited it much better.'\n\nSubaru let out a small sigh at the appointment. A bitterness passed over Azusa's face. The vacancy Saori left behind was still large, and to fill that gap, Azusa had to seek cooperation from Subaru, who led the Conservatives.\n\n'Haa.... There's no use complaining about the past. The President must have had her reasons for leaving.'\n\nSubaru carefully tucked the appointment away. Her expression showed a mix of regret and responsibility.\n\n'I understand. It's about protecting Arius, not anyone else. If someone has to do it, I'll prepare. I'll do everything I can so the Arius children don't have to tremble in fear like the old days...'"
 ARI_reformist_event_chain.36.a: "Slowly filling the vacancy."

 # CASE 3: Saori Stayed (High Relations)
 ARI_reformist_event_chain.37.t: "The New Prefect Leader"
 ARI_reformist_event_chain.37.d: "'A new Arius Prefect Team... Honestly, it hasn't sunk in yet.'\n\nSubaru made a strange face while fiddling with the appointment Azusa handed her. In the massive flow of change called the Republic, all this was still unfamiliar to her, having come to lead the Conservatives.\n\n'I'm a bit reluctant that everything is changing so much, but... well, the current view doesn't feel so bad. Everyone is moving forward, so I should work hard too.'\n\nSubaru looked as if she was about to smile slightly, then quickly cleared her throat and changed the subject.\n\n'It's not for you, but simply... because it's for Arius that I'm accepting this.'\n\nIn Subaru's voice as she added this somewhat bluntly, a vitality for a new tomorrow was slightly mixed in, replacing the heavy fear of the past."
 ARI_reformist_event_chain.37.a: "I've gained a dependable junior."

 #########################################
 # Reformist Story Events: Azusa and Saori Ending (Unified Republic of Central Europe)
 #########################################

 # Ending 1: Azusa Alone (Low Relations, Saori Outsted)
 ARI_reformist_event_chain.38.t: "The Weight of the Crown"
 ARI_reformist_event_chain.38.d: "The massive map of Central Europe hanging on the office wall was now unified in a single color. At the end of division, civil war, and long reform, Arius had finally found stability. After finishing numerous document approvals, Shirasu Azusa set down her pen and looked around the room where a deep silence had settled.\n\nAzusa's gaze rested on the empty space by the window where Jomae Saori used to always stand with arms crossed.\n\n'......'\n\nOnly now, having achieved every goal, did Azusa feel an emotion similar to regret. What if I had been a little more flexible back then? What if I had tried just one more time to understand the weight of reality she was carrying before forcing my ideals? \n\nBut time cannot be reversed, and spilt milk cannot be gathered. Saori left, and this massive nation she left behind became a permanent burden that Azusa must carry entirely alone. Azusa tasted a bitter aftertaste and bowed her head again to open the next approval document. That was the only duty left for the person remaining in this cold office."
 ARI_reformist_event_chain.38.a: "Everything is vain. However..."

 # Ending 2: Saori Visits (Mid Relations, Saori Retired)
 ARI_reformist_event_chain.39.t: "Black Tea on a Clear Afternoon"
 ARI_reformist_event_chain.39.d: "The day after announcing the Central European unification, Azusa canceled all official schedules and headed to a quiet private house in the suburbs. In the yard, which was old but neatly kept, Jomae Saori in civilian clothes was watering the flowerbeds.\n\n'...A Prime Minister of a nation coming to such a fringe without even a guard, you've grown bold.'\n'It's a holiday today. Besides, isn't this the safest place in Kivotos?'\n\nAt Azusa's light joke, Saori chuckled and set down her watering can. The two sat across from each other at an old wooden table. What Saori brought out wasn't high-quality black tea, but the blunt and astringent tea-bag tea they often brewed back in their ruins days.\n\n'It's all over, Saori. The parliament, the borders, everything is stabilized. Now no one has to eat moldy bread anymore.'\n'I know. The news blares about it until I'm sick of it.'\n\nSaori fiddled with her teacup while looking out the window at the peaceful street. Her eyes held neither the sharp bloodlust of the past nor the heavy sense of responsibility.\n\n'You worked hard, Azusa. You were right.'\n\nAt that short and calm word of recognition, Azusa felt the burden on her shoulders, which had been pressed down for so long, completely wash away. The warm scent of tea softly filled the air between the two."
 ARI_reformist_event_chain.39.a: "Our war is truly over."

 # Ending 3: Everyday Conversation (High Relations, Saori Stays)
 ARI_reformist_event_chain.40.t: "Tedious yet Precious"
 ARI_reformist_event_chain.40.d: "'This is rejected. The health budget is too large. Replacing Ministry of Defense equipment comes first.'\n'Saori, we already agreed on that last week! It's the change of seasons now, and the number of flu patients is increasing!'\n\nIn the office, the heart of the Republic, the petty yet fierce bickering of the two leaders was taking place today as well. Jomae Saori furrowed her brow and tapped the approval folder, while Shirasu Azusa stared back as if she couldn't back down.\n\n'The war is over, why equipment replacement! We should be cutting the budget instead!'\n'You have to sharpen your sword when it's peaceful. You're too soft.'\n\nWhile the uncompromising bickering continued, their eyes suddenly met. Two people who once would have aimed guns at each other over the direction of survival were now red-faced over 'flu medicine budget' and 'boot replacement timing.'\n\nBefore anyone else, a laugh escaped from Azusa's lips, and Saori also chuckled as if it were absurd and shook her head.\n\n'...Honestly, there's no end to this. If I knew politics was this exhausting, I might have preferred to keep rolling in the ruins.'\n'Give it up. You'll have to help me with paperwork for the rest of your life.'\n\nSaori sighed, but eventually scribbled her signature on the health budget Azusa presented."
 ARI_reformist_event_chain.40.a: "Even if everything is vain, it's not today."

 ARI_reformist_event_chain_38_tt: "§gThe story of the Squad that came to lead the Arius Branch ends here. Complete integration may still be far off, and to Shirasu Azusa, who thinks of the stability and future of the republic, Saori's absence may feel large. However, the students of Arius who wandered through the ruins have now found their rightful place in the world and stand as the proud victors of Central Europe. Whatever Shirasu Azusa felt at the end of the road, she will be remembered as the greatest founder and activist who worked for reform in the Arius Republic. ...Though she may have regrets that she should have treated Jomae Saori a little better.§!\n\n§LThe Reformist content for the Arius Branch is now complete. Thank you for playing!§! §H- SKSKIe§!"
 ARI_reformist_event_chain_39_tt: "§gThe story of the Squad that came to lead the Arius Branch ends here. Complete integration may still be far off, and to Shirasu Azusa, who thinks of the stability and future of the republic, Saori's absence may feel large. However, the students of Arius who wandered through the ruins have now found their rightful place in the world and stand as the proud victors of Central Europe. Whatever Shirasu Azusa felt at the end of the road, she will be remembered as the greatest founder and activist who worked for reform in the Arius Republic. Oh, and Azusa may occasionally visit Jomae Saori to seek advice.§!\n\n§LThe Reformist content for the Arius Branch is now complete. Thank you for playing!§! §H- SKSKIe§!"
 ARI_reformist_event_chain_40_tt: "§gThe story of the Squad that came to lead the Arius Branch ends here. Complete integration may still be far off, but Azusa managed to hold onto Jomae Saori, and they will now lead the republic together! Furthermore, the students of Arius who wandered through the ruins have now found their rightful place in the world and stand as the proud victors of Central Europe. Whatever Shirasu Azusa and Jomae Saori felt at the end of the road, she will be remembered as the greatest founder and activist who worked for reform in the Arius Republic.§!\n\n§LThe Reformist content for the Arius Branch is now complete. Thank you for playing!§! §H- SKSKIe§!"

