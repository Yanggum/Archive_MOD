# # Events
 ARI_3rd_council.1.t: "The Third Council: Opening"
 ARI_3rd_council.1.d: "The grand hall of the Danzig Council was filled not with heat or cheering, but with a chillingly perfect, controlled silence.\n\nThe proceedings of the Third Council were hauntingly smooth. Agenda setting, debate, and voting—every process meshed together without error, like a pre-tuned set of gears. There was no evidence of electoral fraud. The ballot boxes were transparent, the counting process was conducted in the presence of all observers, and the numbers did not lie. Yet it was precisely that 'excessive transparency' that was driving the Reformist delegates mad.\n\n'This is a deception! It can't be... it can't be this quiet! How is it possible there isn't a single objection? This is no different from a dead parliament!'\n\nThe Reformist spokesperson, tie loosened and veins bulging in his neck, screamed at the crowd. Their arguments appealed to 'emotional rejection' rather than 'procedural legitimacy.' They demanded 'free debate' by jeering from the back or banging on desks, but the alternatives they presented were disorganized and stained by internal power struggles.\n\nFrom high upon the dais, Jomae Saori looked down at the chaotic commotion with impassive eyes. The SS guards by her side did not move a muscle. When Saori raised her gavel, the Reformist noise slammed into a wall of silence and withered away helplessly."
 ARI_3rd_council.1.a: "Opposition has been silenced."

 ARI_3rd_council.2.t: "The Third Council: Disorganized Exit"
 ARI_3rd_council.2.d: "'This election is void! I cannot accept this!'\n\nA shout erupted from below the dais. A hardline Reformist delegate waved a legal document for election nullification in the air with trembling hands, but Saori didn't even blink. When she struck the gavel to declare the motion 'Dismissed,' a pre-arranged slogan should have burst from the Reformist delegates. But reality was less a coordinated struggle and more a farce.\n\n'Let's go! We refuse this filthy den of dictatorship!'\n\nA few hardliners jumped up, but less than half followed them. Leaving the Council at the point where a Conservative victory was already certain meant the end of one's political life. Some stood up hesitantly while checking for reactions only to sit back down, while others made a scene by grabbing the clothes of departing colleagues to stop them. Their 'organization' was already collapsing from within.\n\nIn that messy procession toward the exit, Shirasu Azusa remained silent, firmly seated in her place.\n\n'Shirasu Azusa! What are you doing? You have to come with us!'\n'......'\n\nDespite her colleague's urging, Azusa shook her head. She refused to be a fleeing loser. Even if she disagreed with Saori's methods, she knew that the moment she stepped out of the Council hall, she would be unable to change anything. Or perhaps it was simply a sense of contempt—she didn't want to be mixed in with that pathetic crowd.\n\nSaori stared for a moment at the empty left-side seats and at Azusa, who remained like an island among them. Then she turned on her microphone.\n\n'I will not stop those who wish to leave. Open the doors.'\n\nAs the SS flung the doors wide, the retreating backs of the fleeing Reformists looked miserably pathetic. All that remained in the hall was Saori, the 'perfect victor,' Azusa, who faced her defeat head-on, and a heavy silence."
 ARI_3rd_council.2.a: "Are they burning themselves down?"

 ARI_3rd_council.3.t: "Conclusion of the Third Council"
 ARI_3rd_council.3.d: "Immediately after the results of the Third Council were announced, an emergency meeting of the Reformists was called at party headquarters. The name was grand, but in reality, it was nothing more than a chaotic mess of losers shifting blame and shouting.\n\nSome hardline delegates presented a 'Declaration of Election Nullity,' written arbitrarily without leadership consensus. They claimed Saori's victory was driven by 'invisible fear' and urged immediate civil disobedience and a general strike. However, even as the declaration was being read, the room failed to unite.\n\n'Are you out of your mind? You're telling us all to go and die!'\n\nModerate delegates reacted violently, grabbing the hardliners by the collar. They knew there was no justification for overturning an election that was legally perfect. In this meeting, which even Azusa did not attend, the 'struggle' shouted by those who only knew how to push pens was hollow. Some slipped out the back door, while others began writing petitions to submit to Saori.\n\nUltimately, their 'Declaration of Defiance' released after midnight caused no ripples in the political landscape of Kivotos. Citizens merely viewed it as the final tantrum of those who lost an election, and Arius bureaucrats didn't even bother to snort. The declaration was not a flare signaling a Reformist gathering; it was a suicide note ending what little political life they had left.\n\nJomae Saori gave no instructions even after being reported on this news. There was no need to strike an enemy that was collapsing on its own."
 ARI_3rd_council.3.a: "The end."

 ARI_3rd_council.4.t: "The Third Council: Opening"
 ARI_3rd_council.4.d: "The windows of the Danzig Council hall rattled from the massive shouts coming from outside. The Third Arius Council felt less like a solemn meeting and more like an uncontrollable marketplace.\n\nThe Reformist delegates, claiming the 'reflection of the people's will,' had surrounded the Council hall with supporters and protesters. Every time a Conservative delegate took the podium, jeers and trumpet blasts from amplifiers poured in from outside, while inside, Reformist delegates banged on desks to interrupt. But the real problem wasn't just the noise.\n\n'There are unqualified people in the hall. MPs, remove them at once.'\n\nJomae Saori, sitting in the chairman's seat, gave the cold instruction. The gallery and voting queues were filled not with Arius students, but with Trinity-born residents and collaborators clumsily wearing Arius armbands. But before the military police could move, the Reformist representative snatched the microphone and shouted.\n\n'Everyone living on this land is Arius! The chairman shall not restrict the sacred right to vote with outdated blood-logic!'\n\nIt was a blatant absurdity. They were interpreting the definition of an 'Arius member' at will, transporting outsiders by the truckload to cast votes for them. The defeated Trinity-affiliated factions had entered the Council hall proudly under the protection of the Reformists, taking advantage of the chaos.\n\nSaori struck her gavel to restore order, but her restraint was helplessly buried under the shouts of thousands and the agitation for 'freedom.' The ballot boxes were overflowing with unverified votes, and Saori's eyes were filled with disgust as she watched. This was not a Council; it was violence through numbers."
 ARI_3rd_council.4.a: "At least, that is how it appeared to her."

 ARI_3rd_council.5.t: "The Third Council: Order"
 ARI_3rd_council.5.d: "The Council hall was like a pressure cooker about to explode. Shouts and trumpet blasts from Reformist supporters echoed from all directions, and the Conservative delegates were isolated, surrounded by the noise.\n\nJomae Saori slowly looked around the hall from the chairman's seat. Where her gaze rested, there was no longer an 'iron-like army.' The Conservative delegates seemed to sense inevitable defeat, either closing their eyes calmly or clenching their fists in suppressed anger. Their organization had already crumbled; if she threw down the gavel and overturned the proceedings now, all that would remain would be Arius's second civil war and the blood of students.\n\nSaori picked up the microphone. Her voice was low, but it rang out with eerie clarity even through the noise.\n\n'...The results have been verified. I concede defeat.'\n\nCheers were about to erupt from the Reformist camp, but Saori continued.\n\n'However, at the very least, behave with order. We are not beasts.'\n\nIt was not the cringing plea of a loser, but the final warning of a leader who loathed chaos. Just as some of the excited Reformist crowd were about to jeer at Saori...\n\n'Everyone, silence.'\n\nBelow the dais, Shirasu Azusa, sitting in the front row, stood up and raised her hand high. When she turned to glare at the noisy delegates and protesters of her own faction, the boiling noise subsided as if doused with cold water. Instead of the intoxication of victory, Azusa looked up at Saori with eyes full of heavy responsibility and bowed her head."
 ARI_3rd_council.5.a: "The commotion died down."

 ARI_3rd_council.6.t: "Conclusion of the Third Council"
 ARI_3rd_council.6.d: "In the office where the storm-like noise of the Council had receded like the tide, only a heavy silence and the long shadows of the evening sun remained. The silence was so deep that every floating dust particle was visible, and it was broken only by the rhythmic sound of military boots.\n\nKnock, knock. There was a sound at the door, but it opened without waiting for an answer. It was Shirasu Azusa.\n\nJomae Saori sat deep in her chair, staring at her old comrade standing in the doorway. When was the last time the two of them had stood facing each other with eyes, not gun barrels? The memory of sharing a piece of moldy bread and watching each other's backs was now faint, obscured by a massive desk and mountains of paperwork. On Azusa's shoulders rested not an old rifle, but the heavy burden of being the 'spiritual pillar of the Reformists.'\n\nAzusa slowly approached the desk. In her hand was the 'Council Manifesto' with ink that hadn't yet dried. Her lips parted. She was likely about to pour out the logic she had practiced dozens of times to persuade Saori—why this was necessary, why they had to change.\n\nBut before Azusa could utter the first word, Saori reached out her hand.\n\n'Give it to me.'\n\nA short, dry sentence. Azusa's eyes widened momentarily, but Saori took the document without hesitation and signed her pen across the line. Only the scratching of the nib echoed across the vast silence between them. Saori already knew. The times had changed, and if one cannot stop the wave, one must open the dam.\n\nThe approved document slid back toward Azusa. Saori stood up. She gave Azusa neither encouragement nor blame. She sensed that any words exchanged now would only breed 'misunderstanding' rather than 'understanding.' Saori brushed past the frozen Azusa and added shortly:\n\n'Go. You must have much to do.'"
 ARI_3rd_council.6.a: "Can the emotional rift be healed?"

 ARI_3rd_council.7.t: "A Crown upon a Sandcastle"
 ARI_3rd_council.7.d: "Leaning against the office window, Shirasu Azusa suddenly looked at the approval documents sitting on a corner of the desk. It was the manifesto from that day, bearing Jomae Saori's signature.\n\nLooking back now, the emotion Azusa felt that day was not the joy of victory. It was a fear closer to emptiness. She had prepared countless arguments, justifications, and 'power' to bring Saori down. But Saori had surrendered all that authority too easily, before a sword could even be drawn. As if she had been waiting. In that brief moment the nib scratched the paper, Azusa felt not the sound of a great wall collapsing, but the sense of loss that her only opponent, who had sustained her, had vanished.\n\nShe thought of the crowd she had led—those gathered under the sweet banner of 'Reform.' How many of them truly cared about the future of Arius? The staff who whispered about manipulating voting rights through legal loopholes, the agitators who incited violence in the square, and the opportunists who salivated at the prospect of power as soon as Saori stepped down.\n\nAzusa had reached this position by taking their greedy hands. It was a lesser evil chosen because she was certain Saori's way led to 'death' and believed she had to open a path to 'life' even if it meant being covered in mud. But sitting in that chair, she felt the weight of the silence Saori had endured.\n\nThe void Saori left behind as she brushed past was not empty. It was now filled with the chaos and contradictions of a world where order had collapsed—a weight Azusa now had to bear. She traced the signature on the document with her finger, a mix of relief, guilt, and indescribable pressure."
 ARI_3rd_council.7.a: "Wearing the crown meant carrying not a brilliant light, but such a terrible shadow."

 ARI_3rd_council.8.t: "The Third Council: Opening"
 ARI_3rd_council.8.d: "The air in the Danzig Parliament was suffocatingly tense. It was neither the silence of the Conservatives nor the noise of the Reformists. It was closer to the bloodlust of beasts about to tear each other's throats out.\n\nThe left and right were perfectly divided by the central aisle. Conservative delegates sat with arms crossed, glaring at their opponents as if they were insects, while Reformist delegates clutched bundles of documents like weapons, shouting and provoking their rivals. To them, this Council was not a place for 'compromise' or 'discussion.' It was nothing more than a execution ground disguised as legality, where they could brand the other side as heretics and monopolize all power.\n\nJomae Saori in the chairman's seat and Shirasu Azusa, attending as the representative of the Reformists, desperately tried to maintain order.\n\n'Silence! I will not permit personal attacks!'\n'Sit down! You have not been given the floor yet!'\n\nThe two leaders tried to maintain at least a minimum 'line' in this bedlam. But tragically, Saori was the symbol of the Conservatives and Azusa was the banner of the Reformists. No matter how much they appealed to reason, the greedy wolves filling the parliament were only using them as proxies to represent their own interests.\n\nIn that disgusting scramble, Saori suddenly made eye contact with Iwashino Misaki, who was sitting in a corner.\n\nMisaki was neither fighting nor shouting. She was simply resting her chin on her hand, staring at the entire hall with hollow eyes. But that look was different from her usual lethargy. She wasn't looking at the spitting Reformists, nor the authoritative Conservatives.\n\nShe was looking down at 'everything' in this space, including Saori and Azusa on the dais, with a look of extreme loathing and contempt. In the moment she met that chilling gaze—like one looking at a swarm of flies on rotten meat—Saori felt a shiver run down her spine."
 ARI_3rd_council.8.a: "The gavel rang out once more, but she had a premonition it wouldn't mean much this time."

 ARI_3rd_council.9.t: "The Third Council: Breakdown"
 ARI_3rd_council.9.d: "Insults and shouts intertwined, turning the parliament into an uncontrollable bedlam. A nameplate thrown by a Conservative delegate cut a Reformist's forehead, and the scuffling was about to escalate into a mass brawl.\n\n'U-Uwa... Please, please stop! We, we shouldn't be doing this to each other...!'\n\nTsuchinaga Hiyori stood up tearfully and shouted. She waved her hands desperately to stop both sides, but in the massive vortex of hatred, her voice was smaller than a mosquito's. Someone pushed Hiyori roughly, and she tumbled to the floor.\n\n**BANG—!!**\n\nA sharp gunshot rang out, as if piercing the high ceiling of the parliament. Silence fell instantly, as if cold water had been poured over the room. All eyes turned toward the source: Iwashino Misaki, holding a gun.\n\nMisaki helped Hiyori up and brushed off the dust. Then, she lowered the still-smoking barrel and looked at Saori, Azusa, and the stunned delegates with eyes that were terrifyingly dry.\n\n'I can't stand to watch this anymore because it's so noisy.'\n\nHer voice was low, but it struck clearly into every corner of the parliament.\n\n'While you all choke each other over who is right and who is wrong... Arius is rotting again. Look. Is this a parliament? Or is it the same \"ruin\" we wanted to escape so badly?'\n\nMisaki didn't wait for an answer. She simply muttered, 'Let's go, Hiyori. I can't breathe here,' and walked toward the exit.\n\nJust then, there was the sound of a chair dragging. A centrist delegate who had been pushed to the corner stood up silently and followed Misaki. Then two, then three... those fed up with the pathetic display of the extremes, regardless of faction, stood up one by one. That procession soon became a great flow."
 ARI_3rd_council.9.a: "While Saori and Azusa watched blankly, half of the parliament emptied out."

 ARI_3rd_council.10.t: "Two Falling Wings"
 ARI_3rd_council.10.d: "The night sky over Arius city center was burning red. It wasn't the sunset, but the flames of Molotov cocktails thrown by the angry mob led by the Reformists.\n\n'Down with the dictatorship! Give Arius to the citizens!'\n\nHardline Reformist delegates incited Trinity residents to pour into the streets. They occupied government offices and declared a 'Citizens' Revolution,' but the reality was closer to uncontrolled looting and arson.\n\nMeanwhile, the response of the Conservative military, who tried to counter this, became the worst possible move. Without even Saori's approval, they mobilized troops to blockade the parliament and tried to declare martial law—'Operation: Fortress.' However, this pro-coup plan was exposed by an internal whistleblower right before execution.\n\nWhen the fact that they 'tried to turn guns on the people' became known, the military police refused orders and the angry mob stormed the residences of the coup leaders. A hellscape unfolded as generals were dragged out with torn uniforms while Reformist leaders, intoxicated by madness, broadcasted it live. The two wings that sustained Arius were breaking and falling simultaneously.\n\nTsuchinaga Hiyori, watching all this from the gap in a safehouse window, bit her lip.\n\n'...This can't go on. Not Saori-oneesan, nor Azusa-chan... nothing can stop this anymore. If we stay like this, Arius will truly disappear.'\n\nIn Hiyori's eyes, which usually would have been filled with tearful fear, there was a poisonous resolve for the first time. Iwashino Misaki exhaled a long sigh and nodded. Her eyes were already cold.\n\nMisaki spread out a map of Arius on the desk. Marked upon it were the locations of numerous military units and administrative organizations that didn't belong to either faction but had remained silent.\n\n'Hiyori, get ready. We're going to Saori.'\n'...Yes.'"
 ARI_3rd_council.10.a: "Leaving the decaying city behind, the two began to move to deliver a final ultimatum."

 ARI_3rd_council.11.t: "Emergency Proclamation No. 1"
 ARI_3rd_council.11.d: "A strange silence hung over Danzig Square at dawn. In the place where barricades had been cleared, troops of the 'Emergency Government' in black uniforms were deployed, and the dry voice of Iwashino Misaki began to broadcast over radios and loudspeakers amidst crackling static.\n\nJomae Saori moved to the annex of the residence after signing the emergency measure approval, and Shirasu Azusa, despite having foreseen this through intelligence, did not resist and quietly complied with her detention. The vacuum of power left by the two giants was filled by girls who were previously thought to have no power at all.\n\nThey didn't promise grand ideologies or futures. A proclamation was read containing only the chilling survival instinct of 'surviving today.'\n\n'To all students and citizens of Arius. We will no longer shed blood under hollow banners. Therefore, the newly established \"Emergency Government\" declares the following:'\n\n1. Permanent rejection of civil war. We will not tolerate the repetition of the old Arius tragedy where brothers pointed guns at brothers' chests. Any act inducing civil war will be summarily dealt with.\n\n2. Dissolution of factions and accountability. Both the \"Conservatives\" and \"Reformists,\" who focused only on power struggles while ignoring the people's livelihood and drove the nation into a stalemate, are defined as the culprits of this situation. As of this moment, all political factions are forcibly dissolved.\n\n3. Nullification of previous Councils. The previous meetings, stained with violence, agitation, and mass desertion, are declared null and void from the start due to lack of a quorum. The \"will of Arius\" was not there.\n\n4. We declare that our Emergency Government is the only legal government entrusted with the right to survival of the scattered members, and the \"Third Arius Council\" in the true sense.\n\n5. Survival-first priority. Ideological debates are over. From now on, all our administrative power will be focused solely on securing food, maintaining public order, and excluding external threats.\n\nAfter the broadcast ended, Misaki turned off the microphone and let out a deep sigh. Hiyori, standing next to her, was tightly clutching the declaration with trembling hands."
 ARI_3rd_council.11.a: "...There's much work to be done."


