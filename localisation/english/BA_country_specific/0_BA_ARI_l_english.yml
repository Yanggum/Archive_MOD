## Events
 ARI_reformist_event_chain.1.t: "Where the Classrooms Vanished"
 ARI_reformist_event_chain.1.d: "In the 1st National Arsenal, where acrid smoke and the noise of grinding metal filled the air, Jomae Saori followed behind Shirasu Azusa with a furrowed brow.\n\nSaori had not understood Azusa's methods until now. Under the guise of 'economic restructuring,' the small firearm workshops that sustained the back alleys of Arius went bankrupt, and the pro-Arius German capitalists fled in screaming. In Saori's eyes, it appeared not as reform, but as self-harm, cutting off the few remaining lifelines.\n\nBut as the massive iron doors opened and the scene before her unfolded, Saori stopped in her tracks.\n\n'...This is.'\n\nThe sight of students manually stamping ammunition in damp basements, formerly known as 'Work Classrooms,' was nowhere to be found. Standardized rifles poured incessantly off massive conveyor belts, and in another section, furnaces breathed red as they cast artillery barrels. It was no longer a 'guerrilla workshop.' It was clearly a 'national factory.'\n\n'...The old cottage industry method had its limits.'\n\nAzusa raised her voice over the noise. Her expression was calm, but her eyes were full of conviction.\n\n'It's a pity that small things are broken... but it couldn't be helped to protect something bigger. This is the answer I found.'\n\nSaori picked up a newly produced rifle. It was heavy, cold, and most importantly... not crude. She pulled the bolt. A clear metallic *clack* rang out.\n\n'...Not bad.'\n\nSaori added shortly as she set the gun down. It was the greatest affirmation she could show. The days of picking through scrap in the ruins were over. Azusa had not engaged in hollow destruction."
 ARI_reformist_event_chain.1.a: "'It turned out better than I thought.'"

 ARI_reformist_event_chain.2.t: "Orchestra"
 # CASE 1: Low Relations
 ARI_reformist_event_chain.2.da: "In the hall of a repurposed old cathedral, the discord of Arius's first orchestra tuning filled the space. Shirasu Azusa nervously glanced at Jomae Saori beside her.\n\nSaori sat with arms crossed, glaring at the students on stage as if judging them. To her, violins and cellos likely seemed heavier and more inefficient than firearms.\n\n'...Is this the \"Arius culture\" you spoke of?'\n\nAzusa nodded slightly at Saori's dry question.\n\n'It's more than just culture... it's healing.'\n\nThe baton cut through the air, and the first note burst forth. A clumsy but desperate melody. It was not a disciplined military song or a slogan incitng hatred. It was just a pure wave of sound. Saori was about to click her tongue but stopped. In the expression of the student playing the violin, she saw an 'immersion' she had never seen during target practice.\n\nAs the performance neared its end, Saori let out a small sigh and adjusted her posture.\n\n'...Tactical value is zero. However...'\n\nShe spoke bluntly without looking at Azusa.\n\n'Occasionally, hearing this instead of gunshots isn't bad. I'll humor you this once.'"
 # CASE 2: High Relations
 ARI_reformist_event_chain.2.db: "As the second movement of the concert began, the atmosphere in the VIP section was peaceful to the point of lethargy. Instead of fiddling with the program, Azusa simply closed her eyes and listened to the music. Beside her, Saori also relaxed her usual sharp vigilance and sat deep in her chair.\n\n'It's strange.'\n\nSaori muttered in a low voice.\n\n'All we learned was that everything is vain. But those kids practiced for months, staying up all night just to create that vain sound.'\n'Yes. ...Maybe it's beautiful precisely because it's vain.'\n\nSaori chuckled at Azusa's reply. Formerly it would have been a sneer, but now it was a clear laugh of agreement. Both of their hands were calloused and smelled of gunpowder, but in this moment, those hands held peace instead of guns.\n\n'Azusa.'\n'Yes?'\n'...It's not bad. The Arius you've built.'\n\nAmidst the orchestral melody racing toward its climax, Saori, for just a moment, wore the face of an ordinary listener rather than a commander."
 # CASE 3: Saori Retired (Civilian)
 ARI_reformist_event_chain.2.dc: "Just before the performance began, the door to the VIP section opened. But the person who entered was Jomae Saori in ordinary civilian clothes—a common jacket and jeans. \n\n'...You look surprised for someone who invited me, Prime Minister.'\n\nSaori sat next to Azusa, pulling her hat down awkwardly. She was no longer the head of the military, but to Azusa, she was still the most difficult senior and the wall she had to overcome.\n\n'Thanks for coming, Saori.'\n'I have plenty of time as an unemployed person. Besides... I have to monitor what kind of mess my successor is making.'\n\nAs the performance began, Saori's eyes followed the children on stage. Children looking at sheet music instead of drill practice, and drawing bows instead of bayonets. It was a scene she could never have imagined during her leadership—no, a scene she hadn't even allowed herself to imagine.\n\nWhen the piece ended and thunderous applause erupted, Saori stood up quietly instead of clapping.\n\n'...I couldn't have done it.'\n\nShe patted Azusa on the shoulder as she passed. The departing Saori didn't look as massive as she once did. But she looked lighter than ever."
 ARI_reformist_event_chain.2.a: "Her mood seems to have improved."

 ARI_reformist_event_chain.3.t: "Dissolution of Auxiliary Labor Corps"
 ARI_reformist_event_chain.3.d: "The ink on the dissolution order had not even dried yet. Jomae Saori leaned against the office window, looking down at the procession of trucks carrying the dissolved labor corps back to their homes.\n\n'...Honestly, I'm surprised.'\n\nSaori spoke without turning her gaze.\n\n'The Auxiliary Labor Corps is inhumane, but it was the most efficient gear for Arius right now. Even the Reformists in your faction suggested \"keeping it at least until reconstruction is finished.\" I didn't think you'd ignore all those objections and push through this order.'\n\n'A country built on someone's sacrifice will only end up breeding more hatred.'\n\nAzusa's answer was without hesitation. Only then did Saori turn her head to look at Azusa. Despite being in the mud of power, her eyes were as clear as a child who knew no compromise."
 ARI_reformist_event_chain.3.a: "'I'm glad... you haven't lost that foolish ideal yet. Azusa.'"

 ARI_reformist_event_chain.4.t: "The Unavoidable"
 ARI_reformist_event_chain.4.d: "The red warning lights of the headquarters were spinning. Urgent reports from the front flowed over the radio, but Shirasu Azusa was just blankly staring at the tactical map.\n\n'...I wanted to stop it.'\n\nAzusa's voice was trembling.\n\n'I did my best. I tried to persuade the Trinity students, settle the past, and prove that we aren't \"monsters\" anymore. But... it was no use. Gehenna still calls us terrorists, and our students are either terrified by their voices or angry.'\n\nShe clenched her hand on the map.\n\n'Was it bound to happen in the end? Can we... never live without fighting someone?'\n\nJust then, Jomae Saori, who was standing beside her, stepped up and placed a hand on Azusa's shoulder. It was a heavy, firm touch.\n\n'Azusa. Look up.'\n\nSaori stared straight into Azusa's wavering eyes.\n\n'Your efforts to avoid fighting were not in vain. Thanks to them, we can now take up arms for \"survival,\" not \"madness.\" That's enough.'\n\nSaori checked the pistol at her waist and added softly:\n\n'Don't feel guilty. Bleeding is my role. You... just make sure the place we return to doesn't break.'"
 ARI_reformist_event_chain.4.a: "The trigger has been pulled."

 ARI_reformist_event_chain.5.t: "No More Stepping Back"
 ARI_reformist_event_chain.5.d: "Late at night, the sound of footsteps pacing in front of Saori's private quarters stopped. After a long silence, Azusa, instead of finding the courage to knock, spoke like a monologue in a voice barely audible through the door.\n\n'...I'm sorry.'\n\nIt was an apology. A confession for the rude remarks made in the name of reform, the outrages of her supporters she couldn't control, and the guilt of feeling as if she had dumped all the burden on Saori and fled.\n\n'There were suggestions to oust you. Of course... I blocked them. But that won't make my guilt disappear. I wanted to change things. I started this because I wanted to feed them warm food instead of moldy bread... but for some reason, the further I move forward, the more I feel like I'm sinking into a swamp.'\n\nThere was no answer from the other side of the door. Azusa looked down with a bitter expression. Was it too late after all? She leaned her forehead against the wall, then turned as if resigned. Yes, how could she expect comfort now?\n\n*Thump, thump.* She had only taken a few steps away.\n\n*Creak—.*\n\nWith the sound of the door opening behind her, a rough hand grabbed Azusa's arm. Turning in surprise, Azusa saw Saori in her pajamas with disheveled hair.\n\n'...It was so noisy I couldn't sleep.'\n\nSaori spoke bluntly, but she didn't let go of the arm she held.\n\n'Come in. I'll make some tea.'\n\nThat blunt touch carried the same warmth Azusa remembered from before. That night, the voices of the two continued from behind the closed door for a very long time. It was a careful yet earnest conversation, like piecing together shards of a broken glass."
 ARI_reformist_event_chain.5.a: "It was a long night."

 ARI_reformist_event_chain.6.t: "Combat Instruction - 1"
 ARI_reformist_event_chain.6.d: "The call, coming after they had grown distant again following their last meeting, was sudden. At 2:00 AM, the sender on her personal terminal was 'Jomae Saori', and the message was a single line:\n\n'To Training Ground 3. Armed.'\n\nShirasu Azusa rubbed her heavy eyelids as she headed to the training ground. Her mind was filled with the budget proposal due tomorrow, negotiation cards to appease the Conservatives, and news of Trinity student protests. Her boots echoed through the empty hallway with every step, but only political noise rang in her ears.\n\nWhen she arrived at the training ground, it was shrouded in pitch darkness.\n\n'Saori? I'm here. What's going on? If it's an urgent report...'\n\n*BANG—!!*\n\nInstead of an answer, an unannounced live-fire shot tore through the darkness."
 ARI_reformist_event_chain.6.a: "'What on earth...?'"

 ARI_reformist_event_chain.7.t: "Combat Instruction - 2"
 ARI_reformist_event_chain.7.d: "*Thud, thud.* Saori walked out of the darkness, aiming a training rifle.\n\n'Your reaction is slow. Has your head stiffened from too much useless worrying?'\n\nSaori kicked another training rifle on the floor toward Azusa.\n\n'Pick it up. It's live combat training.'\n\nAzusa bit her lip and picked up the gun, and in that moment, both of their barrels spat fire simultaneously. A fierce exchange followed, but Azusa's body wasn't like it used to be. Even as she pulled the trigger, stray thoughts like tomorrow's schedule held her back.\n\n'...Too many distractions.'\n\nEventually, the distance closed, and Saori parried the rifle and closed in. With a dull thud, Azusa's vision flipped. When she came to, she was pinned to the cold floor and Saori's barrel was aimed precisely between her eyes. It was a complete defeat.\n\n'Haa... haa...'\n\nLooking down at the panting Azusa, Saori lowered her gun.\n\n'You've become even weaker than before.'\n\nInstead of offering a hand to the fallen Azusa, Saori lashed out coldly.\n\n'You can't even beat me, and yet you tried to carry the whole world's burden alone? Know your place, Azusa.'\n\nIt could have sounded like a reproach, but to Azusa, it felt different. It was her own blunt yet certain vow that if you are weak, I will protect you. Clutching her throbbing shoulder, Azusa paradoxically felt her mental burden lightening."
 ARI_reformist_event_chain.7.a: "'One more time... please.'"

 ARI_reformist_event_chain.8.t: "Just Once - 1"
 ARI_reformist_event_chain.8.d: "In the office at 3:00 AM, Jomae Saori tossed Shirasu Azusa's '4th Budget Revision' onto the table.\n\n'Rejected. Cutting military supplies to move them to the education budget? Are you sane? Explain logically how this helps with survival.'\n\nSaori's wall was immovable. Azusa opened her mouth then closed it again. Rational persuasion had already failed for three hours, and her opponent wasn't someone who could be moved by threats or bribery. Every tactic in Azusa's mind was judged a 'failure.' Only one card remained.\n\nAzusa, breaking into a cold sweat, recalled a passage from a romance novel she had borrowed from Trinity and a 'secret technique' Urawa Hanako had playfully taught her. A warning light flashed saying 'using this could lead to social death,' but there was nowhere to retreat.\n\n'......'\n\nAzusa stood up and approached Saori's side. Then, with a trembling hand, she lightly grabbed the edge of Saori's uniform sleeve."
 ARI_reformist_event_chain.8.a: "..."

 ARI_reformist_event_chain.9.t: "Just Once - 2"
 ARI_reformist_event_chain.9.d: "'...Saori... oneesan?'\n\nHer voice was small, and her voice was shaking severely due to a near-lethal dose of embarrassment. Azusa tried to look up at Saori as she had read in books, but her gaze wandered into the air, unable to overcome her shame.\n\n'Could... could you just do it this once...? ...Please?'\n\nSilence. A silence more perfect than a ruin after a bombardment followed.\n\nSaori froze with her hand hovering over the approval documents, as if encountering an unknown life form. her eyes wandered between Azusa's trembling fingers, her reddened ears, and the bizarre honorific she just heard.\n\n'...Azusa.'\n'......'\n'...Are you sick? Should I call a medic?'\n'No... I'm, I'm asking you...'\n\nAs Azusa bowed her head deeply, wishing she could find a hole to hide in, Saori let out a long, deep sigh as she rubbed her face. she felt that this moment was more difficult to deal with than any crisis she had faced on the battlefield.\n\n'...Haa. Fine. I get it.'\n\nSaori roughly picked up a pen and signed the document. It was a pure 'surrender' without even reviewing the content.\n\n'Take it. And never, ever do that... bizarre thing in front of me again. It's bad for my heart.'\n\nAzusa snatched the document and fled the office as if running away. Even after the door closed, Saori stared blankly at the end of her sleeve for a long while."
 ARI_reformist_event_chain.9.a: "A lethal blow. To Azusa."

 ARI_reformist_event_chain.10.t: "The Approaching Storm"
 ARI_reformist_event_chain.10.d: "In the streets where Arius's iron-fisted rule was lifted, an unbearable 'noise' arrived instead of peace. The 'freedom' promised by Shirasu Azusa's government removed the muzzles of the oppressed, but what burst from their mouths was a flood of demands rather than thanks. Students in old Trinity uniforms gathered at the ruined Cathedral Square, holding sit-ins demanding the 'restoration of the Tea Party administrative system' and the 'return of the confiscated tea gardens.' Behind them, former Tea Party bureaucrats with megaphones denounced the government's incompetence and sought a political comeback.\n\nThe confusion is not limited to within the academy. In the industrial zones of Poznan, Polish workers march waving flags for better treatment, and in Silesia, Germans distribute leaflets demanding autonomy while criticizing Arius's 'occupation behavior.'\n\nMolotov cocktails haven't flown and gunshots haven't rung out yet. However, the decibels of the square—where different languages, slogans, and desires are intertwined—are rising day by day. Because they know very well that the government will not be able to suppress them, they are knocking on the doors of the headquarters even more boldly."
 ARI_reformist_event_chain.10.a: "We must resolve the situation somehow!"

 ARI_reformist_event_chain.11.t: "Preemptive Measures"
 ARI_reformist_event_chain.11.d: "When Shirasu Azusa arrived at work, the content of the 'Daily Security Report' on her desk was eerily peaceful. It reported that the large-scale protests predicted for Berlin, Poznan, and the old Trinity autonomous district had been miraculously canceled or scaled down.\n\n'...What happened?'\n\nIt was Jomae Saori, sitting on the sofa cleaning her boots, who answered Azusa's monologue.\n\n'I did some cleaning.'\n\nSaori's explanation was concise and dry. Last night, she mobilized the Arius military reserves loyal to her. After giving them improvised armbands labeled 'Security Maintenance Force,' she raided the hideouts of the agitators and Trinity hardliners leading the protests and detained them all.\n\n'You deployed military forces? That's basically martial law!'\n'It's not the army. It's the \"Security Maintenance Force.\" On paper, there's no problem.'\n\nSaori replied casually as she set down the boot she was cleaning.\n\n'They weren't just preparing megaphones. They had Molotov cocktails and homemade explosives. If we had followed the \"legal procedures\" you speak of, this morning's news would have been a live broadcast of a fire. ...I'll take the blame, so you just take the results.'\n\nAzusa bit her lip. Saori's arbitrary action was a clear danger, but it was also true that it saved Azusa's regime from crisis. Now she must choose: condone this 'dirty peace' or establish principles even at the risk of danger."
 ARI_reformist_event_chain.11.a: "'Good job. ...It was necessary.'"
 ARI_reformist_event_chain.11.b: "'Release the detainees and withdraw the forces.'"

 ARI_reformist_event_chain.12.t: "Friction of the Gears"
 ARI_reformist_event_chain.12.d: "The gunfire has stopped, but the noise of the factories has also subsided. From Berlin's industrial complexes to the ports of East Prussia, a bizarre form of 'silence' is encroaching upon Arius territory.\n\nGerman workers haven't declared a strike. They arrive on time and take their places. However, if a tool is dropped, it takes 30 minutes to pick it up, and if a machine breaks, they stand blankly all day claiming there are no parts. Shop owners shake their heads at customers with Trinity accents, saying items are sold out, while handing bread and milk to German-speaking neighbors through the back door.\n\nThis is not by organized order, but a collective rejection by Germans toward the Azusa government's 'pro-Trinity reforms.' They feel their jobs are threatened by Trinity students and are resisting the government's policy of accepting their former oppressors as neighbors before the wounds of the Great Shift have even healed.\n\nThis massive sabotage is slowly clogging the nation's blood vessels. Production has plummeted, and administrative orders are being ignored at the lower levels. We must resolve this friction somehow."
 ARI_reformist_event_chain.12.a: "Appeasing the Germans' anger is the priority."
 ARI_reformist_event_chain.12.b: "Take this opportunity to abolish discrimination against Trinity students in employment."

 ARI_reformist_event_chain.13.t: "Pro-Government Protesters"
 ARI_reformist_event_chain.13.d: "Across from the shouts of the separatists who occupied Eden Square and the front of Trinity Cathedral, a new wave has begun to stir. Instead of ethnic symbols or religious slogans, the flags they carry bear only the simple 'Harmony and Reconstruction' slogan of the Azusa government. The composition of these 'pro-government protesters' is strangely diverse: German factory owners tired of sabotage and wanting to return to work, ordinary Trinity students disgusted by the authoritarian culture of the old Tea Party, and citizens supporting the changes in Arius.\n\nThey are shouting for 'realistic alternatives' and 'rule of law' against the hate speech of extremists. These are people who recognized that Azusa's moderate pragmatism is the only breakwater against catastrophe, rather than a 'lukewarm compromise.'\n\n'We want today's bread, not the ghosts of the past!'\n\nThis spontaneous support base is an unexpected ally for the government. Now we must decide: whether to fund and organize them as a vanguard for reform, or keep a distance to preserve their purity."
 ARI_reformist_event_chain.13.a: "We must not miss this flow. Organize them!"
 ARI_reformist_event_chain.13.b: "Do not intervene."

 ARI_reformist_event_chain.14.t: "Moving the Desk"
 ARI_reformist_event_chain.14.d: "When Shirasu Azusa walked into the Student Council President's office, Jomae Saori asked dryly without taking her eyes off the papers.\n\n'This is your third visit today alone. Doesn't the Reformist headquarters have a telephone?'\n\nAzusa caught her breath and set a thick approval folder on the desk. It was a 15-minute walk from the Reformist headquarters to the Student Council office, including the hassle of passing through two security checkpoints.\n\n'It's inefficient.'\n\nAzusa said firmly.\n\n'The manpower, time, and the risk of eavesdropping or theft involved in moving documents... tactically, the current dual-office structure is a failure. So Saori-oneesan... no, President. I have a proposal.'\n\nOnly then did Saori look up at Azusa.\n\n'Let's merge the offices. I'll use the empty war room on the second floor of this building as my office.'\n\nIt wasn't just a room assignment. It was a declaration of political union—the leader of the Reformists moving into Saori's space, the symbol of the Conservatives. After a moment of silence, Saori spun her pen and replied casually.\n\n'...Do as you wish. Just don't let my office become noisy.'\n\n'Don't worry. The walls are thick.'\n\nAzusa's expression didn't change, but her steps as she walked out seemed a lot lighter than when she arrived."
 ARI_reformist_event_chain.14.a: "Now I don't have to walk 15 minutes to get approval."

 ARI_reformist_event_chain.15.t: "Duel 2"
 ARI_reformist_event_chain.15.d: "*BANG! CLANG!*\n\nSharp metallic sounds and heavy breathing tore through the silence of the training ground. Shirasu Azusa didn't hesitate like before. She closed in on Saori's blind spot, holding a training knife in a reverse grip and lunging. Her movements were clean, mixed with the unorthodox tactics she learned at Trinity.\n\n'Got you.'\n\nJust as Azusa tried to land a decisive blow while Saori's center of gravity wavered...\n\n'...Monotonous.'\n\nSaori's voice whispered in her ear. Instead of dodging Azusa's attack, Saori lunged inside it and struck Azusa's solar plexus with her shoulder. With a breath-taking impact, Azusa's body lifted into the air and was slammed onto the cold floor in the next moment.\n\n'Urgh... haa... haa...'\n\nHer vision blurred. When she came to, Saori's barrel was aimed precisely at Azusa's heart. Another complete defeat.\n\nBut Saori lowered her gun and reached out to Azusa.\n\n'Better than before. At least this time... you made me sweat.'\n\nThe beads of sweat on Saori's forehead were a silent badge of recognition that Azusa had grown from the 'child to be protected' of the past into a 'warrior to be wary of.'\n\n'Get up, Azusa. Let's do it once more. That unorthodox technique of yours... is quite interesting.'"
 ARI_reformist_event_chain.15.a: "The wall was high, but it wasn't an unreachable distance."

 ARI_reformist_event_chain.16.t: "Magic Time"
 ARI_reformist_event_chain.16.d: "'Don't move, Leader. I'll poke your eye.'\n'...Ugh. Is this really necessary?'\n\nJomae Saori sat tense like a child in a dentist's chair, eyes squeezed shut. Before her stood Shirasu Azusa, holding various pastel palettes and brushes with a grim resolve.\n\n'The makeup you wear while being President is too \"combative.\" It's more like camouflage cream than makeup.'\n\nRecalling the techniques passed down from Hanako and Hifumi, Azusa applied a subtle coral blush to Saori's cheeks. Vitality began to return to Saori's cold, pale face. Smooth foundation covered the rough skin.\n\n'...It's done. Open your eyes.'\n\nSaori looked cautiously in the mirror. In the mirror, there was no 'Arius dictator' or 'killing machine' she always saw. Just an ordinary girl of her age, looking back a bit shyly and awkwardly.\n\n'This is... unfamiliar.'\n'It's cute. Hifumi said so. Cuteness saves the world.'\n\nSaori cleared her throat while looking at herself in the mirror. The redness at the tips of her ears wasn't just from the blush. She whispered very softly:\n\n'...It's not bad. Occasionally.'"
 ARI_reformist_event_chain.16.a: "Still, she didn't think she'd accept it a second time."

 ARI_reformist_event_chain.17.t: "Final Verdict for Tea Party Collaborators"
 ARI_reformist_event_chain.17.d: "In the back row of the newly established Arius High Court gallery, Jomae Saori sat with arms crossed, watching the trial. In the defendant's dock sat former Trinity bureaucrats who had collaborated with the Tea Party and led the war against Arius during the occupation of Trinity.\n\nSaori was initially skeptical of Azusa's 'judicial independence' plan. Why are complex legal principles and evidence needed to execute an enemy? Summary execution is much more efficient and economical. That was the way she had learned all her life.\n\n'I sentence all defendants to 20 years in prison and forced labor.'\n\nAs the judge's solemn sentence was passed, the courtroom fell silent for a moment. Saori reached for her sidearm, expecting a riot. But... what burst from the mouths of the Trinity citizens filling the gallery was not a scream or a jeer.\n\n'At least it's better.'\n'...It's a verdict from Arius, after all.'\n\nIt was 'acceptance.' It wasn't because they were afraid of Arius's guns, but because they were submitting to the 'fairness' of paying the price according to appropriate procedures for their crimes. Punishment by the social system, rather than a blade wielded arbitrarily by Arius, was planting a sense of relief instead of resentment."
 ARI_reformist_event_chain.17.a: "'...I'll admit it. Your way is more efficient.'"

 ARI_reformist_event_chain.18.t: "A Sweet Peace Treaty"
 ARI_reformist_event_chain.18.d: "When Shirasu Azusa knocked on the door of the After-School Sweets Club room, a disciplined voice answered from inside. Entering, Azusa was met not with alarm or suspicion, but with a neatly prepared tea table.\n\n'Welcome, leader of Arius. Thanks to the amnesty decree you announced, I can brew tea with peace of mind today.'\n\nNatsu handed her a steaming teacup, and Kazusa offered her the best seat, though she pretended to be blunt. The murderous battlefield atmosphere was nowhere to be found. They recognized Azusa not as an enemy with a gun, but as a 'visitor' to be treated with etiquette.\n\n'...We no longer exercise meaningless control, so I hope your free activities will also help the students of the academy.'\n\nAs Azusa explained the cooperation plan stiffly but with sincerity, Kazusa chuckled and pushed a piece of luxurious cake toward her.\n\n'You're too stiff. Here, this is our answer. It's rare even in Trinity... it's a gift for peace, so don't refuse.'\n'Is this... a bribe?'\n\nAzusa stared at the cake for a moment, then carefully took a bite. The sweetness filling her mouth resembled the taste of the peace she had tried so hard to protect. Instead of official stamps on stiff documents or complex arguments and negotiations, the sound of clinking teacups proved the solidarity of the two factions."
 ARI_reformist_event_chain.18.a: "A sweet bite."

 ARI_reformist_event_chain.19.t: "Opening the Doors of Wisdom"
 ARI_reformist_event_chain.19.d: "When the massive doors of the library opened, it was filled with tension-filled curiosity rather than fear. Shirasu Azusa entered, muffling her footsteps, and bowed her head as if showing respect to the dusty bookshelves.\n\n'Welcome, Azusa-san! As you said, I've categorized the books in advance.'\n\nThe librarian Shimiko greeted Azusa with a bright expression. Unlike the past where they had to hide from Arius's pressure, the Reformist government had designated the library as a 'sanctuary to learn the wisdom of the past' and promised active protection.\n\nKozeki Ui, appearing from behind a bookshelf, was also no longer trembling as before. She adjusted her glasses and carefully examined the 'Curriculum Reform Plan' Azusa presented.\n\n'...You want to teach humanities instead of military science? Hmm... Trinity classics for Arius students... it'll be a difficult task, but if you're \"intellectuals\" who don't burn books like those others... I can cooperate.'\n\nUi nodded slightly at Azusa's polite request. It was the moment when the knowledge trapped in darkness began to be passed on to the students in the ruins through the channel called Azusa."
 ARI_reformist_event_chain.19.a: "The pen is mightier than the sword."

 ARI_reformist_event_chain.20.t: "Holding the Constituent Assembly"
 ARI_reformist_event_chain.20.d: "Under the grand arches of the Arius Parliament, hundreds of breaths were intertwining to create a heavy mist. Gathered there were not soldiers with guns, but intellectuals with pens, scholars with old law codes, and architects called student-citizens who survived in the ruins.\n\nShirasu Azusa, standing at the podium, closed and opened her eyes. At the edge of her vision, beyond the wave of the crowd, familiar gold and pink silhouettes sparkled like lighthouses. Hifumi and Hanako. Once they were residents of an unreachable paradise, but now they had become witnesses to this rough construction site. Their presence was like an anchor for Azusa, reminding her that what we were building was a 'home,' not a prison.\n\nAzusa's hand wrapped around the gavel. Its touch was colder and simultaneously heavier than the butt of a familiar rifle. For the next two months, we must cross the swamp of tedious and dry debates—how much to limit Saori's authority, where to place the academy's autonomy. But Azusa knew. That boredom was the other name for the 'peace' we craved so much.\n\nIn the past, we sang of vanity (Vanitas) and tore everything down. But today, we try to build a wall of ink and paper. It looks as thin as if it would be torn by wind and rain, but it will be sturdier than any fortress in the world.\n\n'......I declare the opening.'\n\nThe sound of the gavel striking was not as sharp as a gunshot. It was closer to the dull and heavy heartbeat of the first brick of a massive building being placed upon the earth. On a blank page that would become the epitaph of an old era, the first sentence of a new republic was being carved."
 ARI_reformist_event_chain.20.a: "The ink will not dry."

 ARI_reformist_event_chain.21.t: "Constitution: The First Axiom"
 ARI_reformist_event_chain.21.d: "On the podium of the Constituent Assembly, Shirasu Azusa stared at the open blank page for a long time. The silence was so heavy it seemed to burn all the oxygen in the room. She picked up a pen and drew an invisible line in the air. It wasn't a tactical map. it was the first line designing the soul of the nation to be built.\n\n'What does this wall of a \"Republic\" we are building exist to protect? A rotting flag, or the lives breathing beneath it?'\n\nShe asked the audience—no, the future of Arius. This wasn't simply a matter of legal clauses. It was a fundamental question of how we grow from 'tools' into 'human beings.'\n\n'The Arius Republic...'"
 ARI_reformist_event_chain.21.a: "Exists to protect human dignity."
 ARI_reformist_event_chain.21.b: "Exists to realize the values of the community."

 ARI_reformist_event_chain.22.t: "Constitution: Sweat and Blood"
 ARI_reformist_event_chain.22.d: "The sound of the gavel rang out once more. Now the discussion was about the foundation supporting the pillars of the nation.\n\nAzusa looked around at the students filling the meeting hall. Someone's hands were rough from constant labor in the cold ruins, and someone else was trembling before an invisible wall of discrimination simply because their origin was different.\n\nTo rebuild the broken world, where must we place the first cornerstone of justice? Is it the sanctity of shed sweat, or the eraser of hatred that divided us?"
 ARI_reformist_event_chain.22.a: "Make the value of labor the top priority."
 ARI_reformist_event_chain.22.b: "Make equality between ethnicities the top priority."

 ARI_reformist_event_chain.23.t: "Constitution: The Center of Gravity of Power"
 ARI_reformist_event_chain.23.d: "Now the air in the parliament was pulled tight over the destination of power. In the past, we were gears that moved efficiently under one absolute leader, but we didn't know how to stop when that master pointed in the wrong direction.\n\nAzusa asks from the podium: Should the new Arius be an agile blade led by one strong head, or a fine net where regional councils support each other?"
 ARI_reformist_event_chain.23.a: "Focus on strengthening the authority of the Prime Minister."
 ARI_reformist_event_chain.23.b: "Focus on rebuilding regional councils."

 ARI_reformist_event_chain.24.t: "The Final Duty"
 ARI_reformist_event_chain.24.d: "Nights of the Constituent Assembly where the lights never went out passed, and before long, the smell of ink announcing the completion of the draft constitution was mixing with the dawn air of Danzig. But in that historical moment, Jomae Saori was packing her gear in her old office, not the parliament.\n\n'...The constitution drafting is almost finished. You worked hard, Azusa.'\n\nSaori didn't even turn to look at Azusa as she entered, laying out her dog tags, pistol, and the nameplate stamped 'Head of the Provisional Government' side-by-side on the desk. It wasn't just a cleanup. It was a clear 'discharge.'\n\n'I am resigning. I plan to settle my affairs before the official constitutional proclamation ceremony.'\n\nAzusa's breath caught. It wasn't unexpected. Within the Reformists and among the Trinity-born citizens on the streets, voices demanding 'Dictator Saori's' resignation never ceased. But hearing it directly from Saori's mouth was a completely different weight.\n\n'My role ends here. I'm a part better suited to the era of ruins and war. Blood-stained gears don't mesh with the new machine of a \"Republic\" you're trying to build.'\n\nSaori pointed calmly out the window. There, the lights of the rebuilt city were twinkling like stars.\n\n'Look at them. People want \"peace,\" but whenever they see my face, they think of \"fear.\" As long as I'm in power, the \"harmony\" you speak of will always be only half-baked. ...A bullet is meant to disappear after it's fired, leaving only the shell. That's the rule.'\n\nSaori smiled faintly for the first time. It was the lightheartedness of one who had put down a burden, and the final consideration of a teacher trying to clear a path for her student. She looked at Azusa one last time, ready to turn away.\n\n'So... bury me along with the past.'\n\nIn that moment, tens of thousands of tactics and logic in Azusa's head intertwined and then shattered. This was not a problem that could be solved by a politician's calculation. Azusa opened her trembling lips and took a step toward Saori's sad smile."
 ARI_reformist_event_chain.24.a: "\"...I understand.\""
 ARI_reformist_event_chain.24.b: "§6\"I challenge you to a duel for the position of Squad Leader.\"§!"

 ARI_reformist_event_chain.25.t: "The Final Duty - Truth"
 ARI_reformist_event_chain.25.d: "*BANG—!!*\n\nThe 'resignation' and nameplate Saori had set down were kicked by Azusa's boot and scattered into the air. Saori's eyes shook greatly for the first time. Before she could even speak, Azusa grabbed Saori's collar and pushed her roughly against the desk.\n\n'Did you forget the Squad's rule? The weak obey the strong. The position of leader isn't handed over; it's earned!'\n\nIn Azusa's eyes, where tearful moisture had been brushed away, there was a poisonous resolve. She pulled a training pistol from her waist and aimed it between Saori's eyes.\n\n'If I win, you obey my command. My command is... \"Don't leave.\" Got it?!'\n\n'...Ha.'\n\nSaori let out a dry laugh. It wasn't a political compromise or persuasion; it was the most primal and Arius-like way. This girl was declaring that she would surpass Saori just to keep her here.\n\nSaori's gaze turned cold in an instant. She brushed Azusa's hand away and quickly widened the distance. The narrow office was no longer an office. It was a cage where two beasts were trapped.\n\n'...Fine. I accept.'\n\nSaori also drew a gun from her person. She had no intention of holding back. Only if she won could Azusa discard her without lingering regret. For Azusa's sake, she had to win this duel and leave.\n\n'Come at me with everything you've got, Azusa. My \"final duty\"... is to teach you the feeling of defeat.'\n\nThe barrels of the two spat fire toward each other."
 ARI_reformist_event_chain.25.a: "Decide this!"

