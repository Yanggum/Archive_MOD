 AASRU_progressbar_tt_delayed: "§L§YTrust in Reform§! is required to complete certain focuses and requires continuous management through §Ydecisions§! and §Yevents§!.§!"
 AASRU_desc: "§YJomae Saori§! gained §Ydictatorial authority§! while leading the Arius Branch, and this persists even if she §taccepted§! the §4Reformist§! manifesto to avoid civil war. Since §YShirasu Azusa§! has insisted on §tpreventing§! the immediate removal of §YJomae Saori§!, §YAzusa§! must §tpersuade§! §YSaori§! regarding the §4reforms§! demanded by the §4Reformists§!."
 AASRU_end1_desc: "As the §4National Constitution§! was completed, §YJomae Saori§! §Rresigned§! from all public offices. Under the constitution, the authority of the existing §YStudent Council President§! and the new §YPrime Minister§! clashed unclearly, and the §4Reformists§! used this as a pretext for heavy pressure to resign. Ultimately, unable to mend the political rift, Saori made a bitter exit from the Arius leadership."
 AASRU_end2_desc: "Immediately after the §4National Constitution§! was completed, §YJomae Saori§! made a surprise §Rresignation§!, contrary to §YShirasu Azusa's§! expectations. Azusa wanted her to remain as a symbol of the new government by offering an honorary position, but Saori flatly §trefused§!. Judging her role was over with the transition, she faded away from power, leaving the rest to Azusa."
 AASRU_end3_desc: "Through the §4National Constitution§!, §YJomae Saori§! and §YShirasu Azusa§! completed a perfect §GDual Executive system§!. According to the §YAcademy-State system§! constitution written by §YAzusa§!, Saori will serve in a position equivalent to §YPresident§!, balancing and checking the §YParliament§! and the §YPrime Minister§! who oversees administration. The firm trust between the two has become the new pillar of Arius."
