# {{ Focuses Start
 WHY_extend_emergency_measures:0 "Extend Emergency Measures"
 WHY_extend_emergency_measures_desc:0 "The situation remains volatile. To ensure the safety of the academy and its students, we must maintain our heightened state of alert. Discipline is the foundation of peace."
 WHY_assign_dorm_supervisors:0 "Assign Dormitory Supervisors"
 WHY_assign_dorm_supervisors_desc:0 "Order begins in the halls where we sleep. By deploying the Supervisor Squad, we ensure that every student adheres to the regulations, even after hours."
 WHY_strengthen_arts_council:0 "Strengthen Arts Council Authority"
 WHY_strengthen_arts_council_desc:0 "True art requires a guiding hand. By empowering the Council, we can harmonize the diverse voices of the academy into a single, beautiful masterpiece of governance."
 WHY_grant_student_command:0 "Grant Student Command"
 WHY_grant_student_command_desc:0 "Trust in our peers is paramount. By delegating tactical command to student leaders, we foster the growth of future generals and visionaries."
 WHY_conscript_locals:0 "Conscript Locals"
 WHY_conscript_locals_desc:0 "Even those outside the academy walls must contribute to our shared vision. Their labor will serve as the canvas upon which we build our defense."
 WHY_mobilize_student_defense_forces:0 "Mobilize Student Defense Forces"
 WHY_mobilize_student_defense_forces_desc:0 "The time has come to exchange our brushes for rifles. The Student Defense Force stands ready to protect our sanctuary from any who would defile it."
 WHY_expand_dorm_supervisors:0 "Expand Dormitory Supervisor Squad"
 WHY_expand_dorm_supervisors_desc:0 "A few eyes are not enough to watch over a masterpiece. We shall recruit more dedicated souls to ensure absolute adherence to the academy's code."
 WHY_wildejagt:0 "Wildejagt"
 WHY_wildejagt_desc:0 "The Wild Hunt begins. Let the echoes of our march strike fear into the hearts of the unrefined and the lawless."
 WHY_reintegrate_art_academy:0 "Reintegrate Art Academy"
 WHY_reintegrate_art_academy_desc:0 "A house divided cannot create. We shall bring the fractured departments back into the fold, restoring the unity of our artistic soul."
 WHY_a_living_hell:0 "A Living Hell"
 WHY_a_living_hell_desc:0 "War is the ultimate performance, and the stage is currently engulfed in flames. Only those with the strongest will can survive this descent."
 WHY_take_away_the_cup:0 "Take Away the Cup"
 WHY_take_away_the_cup_desc:0 "Let this bitter trial pass from us. We seek an end to the suffering, through victory or through absolute sacrifice."
 WHY_the_artistry_of_war:0 "The Artistry of War"
 WHY_the_artistry_of_war_desc:0 "There is a rhythmic beauty in the exchange of fire, a composition found in the movement of platoons. We shall master the most dangerous of all arts."
 WHY_holy_war:0 "Holy War"
 WHY_holy_war_desc:0 "This is not merely a conflict of borders, but a crusade for our ideals. We fight with the conviction of the righteous."
 WHY_unleash_artistic_originality:0 "Unleash Artistic Originality"
 WHY_unleash_artistic_originality_desc:0 "Break the old molds. In the chaos of conflict, let every student find their unique way to contribute to our victory."
 WHY_the_rules_and_discipline_of_art:0 "The Rules and Discipline of Art"
 WHY_the_rules_and_discipline_of_art_desc:0 "Without structure, art is merely a mess. Without discipline, an army is merely a mob. We shall enforce the rules of engagement with surgical precision."
 WHY_the_nobility_of_life:0 "The Nobility of Life"
 WHY_the_nobility_of_life_desc:0 "Every heartbeat is a precious note in the grand symphony. We must protect the lives of our students with the utmost reverence."
 WHY_new_experiences_in_art:0 "New Experiences in Art"
 WHY_new_experiences_in_art_desc:0 "The battlefield provides perspectives no classroom ever could. Let us learn from the smoke and the steel."
 WHY_chase_the_deserters:0 "Chase the Deserters"
 WHY_chase_the_deserters_desc:0 "There is no room for those who turn their backs on their comrades. We shall hunt down those who fled the stage before the final curtain."
 WHY_secure_war_funds:0 "Secure War Funds"
 WHY_secure_war_funds_desc:0 "Paint and canvas cost money, but ammunition costs more. We must ensure our treasury is as full as our magazines."
 WHY_purchase_war_supplies:0 "Purchase War Supplies"
 WHY_purchase_war_supplies_desc:0 "Logistics is the skeletal structure of our campaign. We must acquire the tools necessary to keep our forces functional and focused."
 WHY_sell_old_artworks:0 "Sell Old Artworks"
 WHY_sell_old_artworks_desc:0 "The past must fund the future. These relics of a bygone era will provide the resources we need to create a new world."
 WHY_import_mechanical_corps:0 "Import Mechanical Corps"
 WHY_import_mechanical_corps_desc:0 "Automated precision to augment human spirit. We shall integrate mechanical legions to bolster our front lines."
 WHY_scattering_like_flower_petals:0 "Scattering Like Flower Petals"
 WHY_scattering_like_flower_petals_desc:0 "A beautiful, transient end. Like cherry blossoms in the wind, our efforts shall leave a lasting memory even as they fade."
 WHY_sweet_death_for_the_homeland:0 "Sweet Death for the Homeland"
 WHY_sweet_death_for_the_homeland_desc:0 "Dulce et decorum est. To give everything for the academy is the ultimate expression of loyalty."
 WHY_from_hamburger_hill:0 "From Hamburger Hill"
 WHY_from_hamburger_hill_desc:0 "A brutal climb, a bloody peak. We remember the sacrifices made on the slopes that tested our resolve to the breaking point."
 WHY_we_are_freemen:0 "We are Freemen"
 WHY_we_are_freemen_desc:0 "Our spirits cannot be shackled. We fight to maintain the liberty that allows our creativity to flourish."
 WHY_death_in_art:0 "Death in Art"
 WHY_death_in_art_desc:0 "In the final moment of life, there is a profound truth. We capture that truth in the heat of battle."
 WHY_the_peoples_wish:0 "The People's Wish"
 WHY_the_peoples_wish_desc:0 "We are the instruments of the students' collective will. Their hopes and dreams guide our every move."
 WHY_homage_to_catalonia:0 "Homage to Catalonia"
 WHY_homage_to_catalonia_desc:0 "A tribute to the struggle for freedom against overwhelming odds. We find inspiration in the revolutionaries of the past."
 WHY_carnation_delivery:0 "Carnation Delivery"
 WHY_carnation_delivery_desc:0 "A symbol of love and distinction. We deliver these honors to those who have shown exceptional bravery on the field."
 WHY_the_faithful:0 "The Faithful"
 WHY_the_faithful_desc:0 "To those who never doubted, even when the shadows grew long. Their loyalty is the bedrock of our institution."
 WHY_the_awakened:0 "The Awakened"
 WHY_the_awakened_desc:0 "The scales have fallen from our eyes. We see the world as it truly is, and we have the power to change it."
 WHY_for_whom_the_bell_tolls:0 "For Whom the Bell Tolls"
 WHY_for_whom_the_bell_tolls_desc:0 "Do not ask for whom the bell tolls; it tolls for us. Every loss is a loss to the whole academy."
 WHY_the_play_is_over:0 "The Play is Over"
 WHY_the_play_is_over_desc:0 "The curtains fall on the old world. It is time to step out of the theater and into the reality we have created."
 WHY_new_artistic_values:0 "New Artistic Values"
 WHY_new_artistic_values_desc:0 "We redefine what is beautiful and what is meaningful in this new era of iron and fire."
 WHY_emphasis_on_traditional_values:0 "Emphasis on Traditional Values"
 WHY_emphasis_on_traditional_values_desc:0 "Returning to our roots. The ancient disciplines and virtues shall guide us through the modern storm."
 WHY_dont_answer_a_fool:0 "Do Not Answer a Fool"
 WHY_dont_answer_a_fool_desc:0 "Wisdom lies in knowing when to remain silent. We shall not waste our breath on those who refuse to understand our vision."
 WHY_you_will_become_the_same:0 "You Will Become the Same"
 WHY_you_will_become_the_same_desc:0 "Gaze too long into the abyss, and the abyss gazes into you. We must be careful not to become the monsters we fight."
 WHY_of_the_foolish:0 "Of the Foolish"
 WHY_of_the_foolish_desc:0 "The mistakes of the ignorant serve as our warnings. We shall rise above the pettiness that led others to ruin."
 WHY_it_was_beautiful_as_my_collection:0 "It was as beautiful as my collection."
 WHY_it_was_beautiful_as_my_collection_desc:0 "Every victory, every captured banner, every fallen foe... they are all pieces of a grand gallery I am building for the academy."
 WHY_because_discipline_is_also_important:0 "Because discipline is also important."
 WHY_because_discipline_is_also_important_desc:0 "Freedom without restraint is merely chaos. We embrace the rules because they give our lives—and our art—meaning."
 WHY_i_have_been_watching_you:0 "I have been watching you."
 WHY_i_have_been_watching_you_desc:0 "From the shadows of the staff room to the heat of the front lines, my eyes have never left you. I know your potential better than you do."
 WHY_at_the_end_of_our_land:0 "At the End of Our Land"
 WHY_at_the_end_of_our_land_desc:0 "We have reached the horizon. Beyond this point, we forge a path into the unknown, carrying the torch of our academy."
 WHY_respect:0 "Respect"
 WHY_respect_desc:0 "In the end, even an enemy can earn our admiration. We honor the strength and conviction of those who stood against us."
# }} Focuses End
