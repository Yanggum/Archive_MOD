 l_english: 
 under_fra:0 "프랑스의 지배 아래"
 under_fra_desc:0 "1936년, 프랑스 식민 통치 아래 놓인 캄보디아의 왕실과 지식인들은 깊은 고민에 잠겼습니다. 식민 지배의 굴레 속에서 그들은 미약하나마 스스로의 운명을 개척할 수 있을지, 아니면 거대한 제국의 그림자 아래 순응해야 할지 선택의 기로에 놓여 있습니다. 조용하고 고요했던 메콩강처럼 흘러가는 시간은 이제 격변하는 국제 정세 속에서 거친 물살을 예고합니다. 캄보디아는 그 흐름 속에서 어떤 방향으로 나아가야 할지, 과연 자신들의 정체성과 미래를 지켜낼 수 있을지 고심합니다.."
 keep_under_fra:0 "지배 수용"
 keep_under_fra_idea:0 "프랑스의 지배"
 keep_under_fra_desc:0 "우리는 프랑스의 새장 속에서 안락한 삶과 먹이를 보장받기로 했습니다. 이 길이 곧 우리의 정체성과 독립을 없앨 지라도 말이죠."
 return_khmer_empire:0 "과거의 영광"
 return_khmer_empire_desc:0 "오랜 식민 지배의 그림자를 걷어내고, 앙코르의 장엄한 유산 속에서 잠들었던 크메르 제국의 위대한 정신은 다시금 깨어날 준비가 필요합니다. 잊혀진 황금기의 영광을 되찾기 위한 첫걸음을 위해 우리는 나아갈 것입니다!"
 rise_facism:0 "국가를 위한 행진"
 return_khmer_empire_idea:0 "노로돔 왕실 강화"