 #Cambodia Intro
CAM_country_intro_header: "Under French Rule"
CAM_country_intro_content: "\nThe sun of Khmer no longer shines with its former brilliance. In the heart of French Indochina, our Kingdom of Cambodia survives as a protectorate under a formal monarchy.\n\nWhile the golden roofs of the Royal Palace still glitter, the royalty and administration beneath them exist in the shadow of the colonial government in Saigon. The fatherland has been reduced to a vast plantation yielding rice and rubber, with our resources strengthening a distant French hegemony. Following the sudden Great War that erupted in Europe in 1935, the world is filled with uncertainty. Nations affected by the Great War are once again enveloped in the atmosphere of conflict, and in Asia, the Empire of Japan is emerging as a new power, showing signs of colonial ambition. In this era of upheaval, we stand at a critical crossroads. Shall we remain a loyal protectorate of France, ensuring peace from potential threats under the umbrella of a giant? Or shall we, like other Asian nations, ignite the spark of nationalism to break the French shackles and rebuild the glory of the Great Khmer Empire? The ruins of Angkor whisper of past splendor, and the desire for independence burns in the hearts of our quiet people. Is our future loyalty or liberation? The moment of choice approaches.\n\n§YDevelopment - UnineVesiKass, SKSKIe§!"
