 CAM_event.t:0 "크메르 제국의 코친차이나 식민지 양도 요구"
 CAM_event.d:0 "그들은 우리에게 마지막으로 남은 인도차이나 식민지를 요구했습니다.."
 khmer_krom_integration_requirements_yes:0 "베트남 공산당 놈들에게 줄바에는 저들에게 주자."
 khmer_krom_integration_requirements_events_no:0 "절대 안된다!"
 CAM_event.2.t:0 "크메르 제국의 독립 선언!"
 CAM_event.2.d:0 "그들은 자신들의 옛 제국을 복원하겠다며, 갑작스러운 독립 선언과 함께 프랑스에게 독립을 인정하지 않을 경우 전쟁도 불사하겠다고 나섰습니다."
 CAM_event.2.a:0 "당장 진압하라!"
 CAM_event.2.b:0 "그냥 묵인하라. 저 땅에 무슨 가치가 있나?"
