 ### 지도자 로컬
 LPX_gehenna_school_committee_leader_desc: "게헨나 민정위원회는 게헨나의 질서와 통치 체제를 이 땅에 이식하기 위한 임시 민정청입니다. 제대로 된 민정 지도자가 임명될 때까지는 집단지도체제로 운영됩니다."
 LPX_local_committee_leader_desc: "민정위원회는 룩셈부르크의 질서와 통치 체제를 이 땅에 이식하기 위한 임시 민정청입니다. 제대로 된 민정 지도자가 임명될 때까지는 집단지도체제로 운영됩니다."
 ### 룩셈부르크 현지인 지도자 로컬
 # LP1 (프랑스-밀레니엄)
 LPX_napoleon_leader_desc: "프랑스 군주제의 부활이 룩셈부르크 주도로 이루어지면서, 보나파르트가 프랑스 황제로 복귀할 것이라는 것은 사실상 기정사실화 되었습니다. 전문가들은 리쿠하치마 가문의 그 툭수성으로 인하여 군주제의 부활에도 불구하고 부르봉 가문이 프랑스에 집권하는 것이 불가능할 것이라 예상했고, 그것은 사실이었습니다. 리쿠하치마 가문 이전 룩셈부르크의 대공가였던 나사우의 마지막 부군은 부르봉 왕가 출신이었고, 이에 근거하여 일부 반-리쿠하치마 세력은 '대공가 멸족 이후엔 부르봉이 룩셈부르크의 계승권을 가진다'고 주장하고 있습니다. 나폴레옹 3세 몰락 이후 프랑스에서 영향력을 상실한 보나파르트를 억지로 영입한 이유는 이런 정치적 원인이 섞여 있는 것으로 보입니다.\n\n이유가 무엇이든, 나폴레옹 6세는 밀레니엄-프랑스 연방의 황제로서 두 민족의 영도자가 될 권한을 얻었습니다. 나폴레옹은 노트르담 대성당에서 제관식을 열고, 키보토스와 유럽 두 문명의 통합을 이루어내고, 프랑스가 국제연맹의 통치 관리를 빨리 벗어나 자주국이 될 수 있도록 최대한의 역량을 펼치겠다고 발표했습니다."
 # LP2 (폴란드)
 LPX_karl_albrecht_leader_desc: "카를 알브레히트 폰 합스부르크는 룩셈부르크 정부의 선택으로 인해 폴란드 국제연맹 위임통치령의 지도자를 맡게 되었습니다. 국제연맹 위임통치령의 통치는 약 20년에서 30년 사이로 예상되며, 그는 자신이 죽을 때까지 폴란드의 독립을 볼 수 있으리라고 기대하지는 않습니다. 그러나 중요한 것은 폴란드는 나치에 과감하게 반대하는 용감한 '군인 왕'을 국제연맹 위임통치령의 지도자로 얻었으며, 그가 위임통치가 이루어지는 동안 폴란드 시민들의 국익과 자유를 위해 투쟁할 것이라는 점입니다."
 # LP4 (우크라이나)
 LPX_vasyl_vyshyvanyi_leader_desc: "바실 비시바니, 또는 오스트리아의 빌헬름 프란츠 폰 합스부르크는 오스트리아계이면서 우크라이나의 독립을 위해 싸워 온 왕족으로서, 국제연맹 위임통치령 지배 아래에서 제한적인 자유를 얻은 우크라이나의 군주로서 즉위하였습니다. 키이우에서의 대관식 이후 우크라이나에 거주하게 된 그는 우크라이나의 첫 합스부르크 왕조를 개칭했습니다. 그가 이끌어 갈 우크라이나가 얼마나 오랜 시간 존속할 수 있을지는 아직 알 수 없으나, 우크라이나인들은 바실의 통치를 기대감과 우려를 동시에 품은 채 바라보고 있습니다."
 # LP5 (모스크바)
 LPX_vladimir_kirillovich_leader_desc: "블라디미르 키릴로비치는 민정청에 의하여 '전러시아의 차르'로 복위하는 것이 거부되고, '모스크바 공국의 공작'으로서의 작위만을 인정받았습니다. 이는 러시아를 여러 조각으로 분할하고, 영구히 하나로 통합되지 못하게 하기 위한 정책이었습니다. 그럼에도 불구하고 블라디미르는 사석에서 자신을 차르라고 자칭하고 있으며, 민정청에게 굽신거리기보다는 당당한 러시아인들의 상징으로서 행동하고자 합니다."
 # LP6 (캅카스)
 LPX_george_bagration_leader_desc: "바그라티온 왕가는 오래 전 권력을 잃어버렸으나, 이제 민정청 통치 아래에서 새로운 지도력을 얻었습니다. 바그라티온의 새로운 군주는 캅카스 전역을 관리하는 국제연맹 위임통치령의 지배 아래에서 새로운 질서를 만들어 나가고자 합니다."
 # LP7 (발트)
 LPX_karl_gero_leader_desc: "카를 게로 뷔르템베르크 백작은 1935년 도이칠란트 국방군 장교로 입대하였으나, 그의 군사적인 경험은 대전이로 인해 짧게 끝났습니다. 국제연맹 위임통치령이 발트 전역을 관리하게 되면서 민정청은 발트에 군주를 세우기로 하였으며, 그는 발트 위임통치령의 지도자로서 이제 민정청의 협조 아래에서 통치권을 얻었습니다."
 
 # 이벤트
 LPX.leader_event.ARU.t: "민정청 지도자 임명"
 LPX.leader_event.ARU.desc: "[ROOT.GetLeader]는 위임통치령의 지배적 국가이며, 국제연맹 위임통치령의 민정 지도자를 선출할 수 있는 권한을 가지고 있습니다. 물론 형식적인 국제연맹의 동의가 필요하기는 하지만, 그들은 우리의 선택을 제지할 수 있는 권한도 그럴 의지도 없습니다. [ROOT.GetLeader]의 결단에 따라 민정청 지도자가 결정될 것입니다.\n\n첫 번째 선택은 가장 합리적인 대안인 키보토스계 관료의 파견입니다. 그것은 현재 존재하는 민정청을 그대로 유지하는 가운데, 민정청 총독을 키보토스계로 교체하는 것입니다. [ROOT.GetLeader]가 키보토스계이기 때문에 이 선택은 정계에서도 합리적으로 받아들여 질 것입니다.\n\n하지만 룩셈부르크 내부 현지인 파벌들의 주장도 무시할 수는 없습니다. 특히, 대전이 이후 리쿠하치마 아루를 열렬하게 지지하는 군주주의자들은 민정청을 '리쿠하치마의 영도에 따라, 세계에 자유주의적 군주제를 전파할 수 있는' 기회라고 생각하고 있습니다. 현지인을 민정청 지도자로 파견하자고 주장하는 유일한 세력이 왕당파들이기에, 민정청 지도자를 현지인으로 선정하는 것은 곧 점령지에 공작, 왕, 황제를 앉히자는 것과 다름이 없습니다.\n\n어느 쪽이든, 선택권은 [ROOT.GetLeader]에게 있습니다."
 LPX.leader_event.ARU.a: "당연히, 키보토스계가 계속 관리한다."
 LPX.leader_event.ARU.b: "왕당파가 군주제를 원하는가? 그러면 그리 해야지!" 

 LPX.leader_event.HINA.t: "민정청 지도자 임명"
 LPX.leader_event.HINA.desc: "[ROOT.GetLeader]는 점령지의 지배적 국가이며, 그들의 민정 지도자를 선출할 수 있는 권한을 가지고 있습니다. 중요한 것은 이 점령지에 어떤 사람을 민정장관으로 앉힐지 여부입니다. 선도부는 단 한 번도 현지인들의 정치 참여를 긍정적으로 바라본 적이 없었기에, 키보토스계 관료가 파견되는 것이 확실시됩니다.\n\n중요한 것은 선도부 내부 인사를 파견해 사실상 군정에 가까운 형태로 점령지를 관리할 것인가, 아니면 키보토스의 민간 관료를 파견해 상대적으로 온건하게 그 지역을 관리할 것인지의 문제입니다. 어느 쪽이 되었든 그들은 우리의 선택을 거부할 수 없을 것입니다."
 LPX.leader_event.HINA.a: "당연히, 선도부가 그곳에 가야지."
 LPX.leader_event.HINA.b: "관료를 보내라. 현지인들과 충돌하지 않을 것이다." 