 ### 국민정신
 LPX_parliament: "[ROOT.GetName] 의회"
 LPX_parliament_desc: "국제연맹의 승인 아래에서 제한된 권한을 가지는 의회입니다. 수십 년 후의 독립을 위하여 현지인들의 자치권을 보장하기 위한 목적에서 수립되었습니다. 국방, 외교에 대한 권한은 존재하지 않습니다."
 LPX_gehenna_culture: "게헨나화"
 LPX_gehenna_culture_desc: "현지 문화는 조금씩 게헨나 문화에 동화되어 갈 것입니다. 이 영토는 영구적인 게헨나의 개척지가 되도록 올바르게 '수정'되어 갈 것입니다."
 LPX_pseudo_science: "유사과학부"
 LPX_pseudo_science_desc: "유사과학부가 밀레니엄의 새 주도권을 잡았습니다. 밀레니엄 과학 기술 발전을 아주 크게 늦출 것입니다."
 LPX_derussianization: "탈러시아화"
 LPX_derussianization_desc: "선도부는 모스크바에 세워진 새로운 군민정청을 '볼가'라고 이름지었습니다. 이는 고의적으로 러시아 정체성을 지우고자 벌인 '탈러시아화' 시도입니다. 궁극적으로 이 땅은 게헨나화되고, 슬라브 민족주의는 소멸해야만 합니다.\n\n물론, 그들이 쉽게 굴복하지는 않을 것입니다."
 LPX_establishment_of_government_idea: "신정부 수립"
 LPX_establishment_of_government_idea_desc: "새로운 정부는 [ROOT.GetName] 국민들에게 새로운 지배자의 가치관을 주입할 것입니다. 이것을 해방이라기보다 또 하나의 억압으로 볼 수도 있겠지만, 그것이 승자의 권리니까요."
 LPX_post_war_reconstruction_idea: "재건위원회"
 LPX_post_war_reconstruction_idea_desc: "우리 [ROOT.GetName] 정부 수립 이후, 전쟁으로 파괴된 조국을 재건하기 위해 만들어진 위원회입니다."
 LPX_promotion_of_suburban_development_idea: "교외 개발"
 LPX_promotion_of_suburban_development_idea_desc: "키보토스의 선진화된 트랙터 기술은 교외 농업 지역의 생산성을 확대하였으며, 스마트팜이 부분적으로 도입되고 있습니다."
 LPX_assimilation_work: "문화 정치적 동화"
 LPX_assimilation_work_desc: "본국과의 정치적, 문화적 동질감이 강해지고 있습니다."

