 ### National Spirits
 LPX_parliament: "[ROOT.GetName] Parliament"
 LPX_parliament_desc: "A parliament with limited powers under the approval of the League of Nations. It was established for the purpose of guaranteeing the autonomy of the locals for independence in a few decades. No authority exists regarding national defense or foreign affairs."
 LPX_gehenna_culture: "Gehennaization"
 LPX_gehenna_culture_desc: "The local culture will gradually be assimilated into Gehenna culture. This territory will be correctly 'modified' to become a permanent colony of Gehenna."
 LPX_pseudo_science: "Department of Pseudoscience"
 LPX_pseudo_science_desc: "The Department of Pseudoscience has taken new leadership of Millennium. It will significantly slow down Millennium's scientific and technological development."
 LPX_derussianization: "Derussianization"
 LPX_derussianization_desc: "The Prefect Team has named the new military-civil administration established in Moscow as 'Volga.' This is a deliberate attempt at 'Derussianization' to erase Russian identity. Ultimately, this land must be Gehennaized, and Slavic nationalism must be extinguished.\n\nOf course, they will not surrender easily."
 LPX_establishment_of_government_idea: "Establishment of a New Government"
 LPX_establishment_of_government_idea_desc: "The new government will instill the values of the new rulers into the people of [ROOT.GetName]. This might be seen as another form of oppression rather than liberation, but such is the right of the victor."
 LPX_post_war_reconstruction_idea: "Reconstruction Committee"
 LPX_post_war_reconstruction_idea_desc: "A committee created to rebuild our war-torn homeland following the establishment of the [ROOT.GetName] government."
 LPX_promotion_of_suburban_development_idea: "Suburban Development"
 LPX_promotion_of_suburban_development_idea_desc: "Kivotos' advanced tractor technology has expanded the productivity of suburban agricultural areas, and smart farms are being partially introduced."
 LPX_assimilation_work: "Cultural-Political Assimilation"
 LPX_assimilation_work_desc: "Political and cultural homogeneity with the home country is strengthening."

