 ### Leader Local
 LPX_gehenna_school_committee_leader_desc: "The Gehenna Civil Affairs Committee is a temporary civil administration intended to transplant Gehenna's order and governance system to this land. It will be operated under a collective leadership system until a proper civil leader is appointed."
 LPX_local_committee_leader_desc: "The Civil Affairs Committee is a temporary civil administration intended to transplant Luxembourg's order and governance system to this land. It will be operated under a collective leadership system until a proper civil leader is appointed."
 ### Luxembourg Local Leader Local
 # LP1 (France-Millennium)
 LPX_napoleon_leader_desc: "As the restoration of the French monarchy took place under Luxembourg's leadership, it became a foregone conclusion that a Bonaparte would return as the Emperor of the French. Experts predicted that due to the uniqueness of the Rikuhachima family, it would be impossible for the House of Bourbon to take power in France despite the monarchist revival, and they were correct. The last consort of the Grand Ducal House of Nassau before the Rikuhachimas was from the House of Bourbon, and based on this, some anti-Rikuhachima factions claim that 'after the extinction of the Grand Ducal House, the Bourbons hold the right of succession to Luxembourg.' The reason for forcibly recruiting the Bonapartes, who had lost influence in France since the fall of Napoleon III, seems to involve these political motives.\n\nWhatever the reason, Napoleon VI has gained the authority to lead both nations as the Emperor of the Millennium-French Union. Napoleon held a coronation at Notre-Dame Cathedral, announcing that he would achieve the integration of the two civilizations of Kivotos and Europe, and exert his maximum efforts to ensure France can quickly exit the League of Nations' mandate and become a sovereign nation."
 # LP2 (Poland)
 LPX_karl_albrecht_leader_desc: "Karl Albrecht von Habsburg was chosen by the Luxembourg government to lead the League of Nations Mandate of Poland. The mandate's rule is expected to last between 20 to 30 years, and he does not expect to see Polish independence within his lifetime. However, what matters is that Poland has gained a brave 'Soldier King' who boldly opposes the Nazis as the leader of the mandate, and he will struggle for the national interest and freedom of Polish citizens throughout the administration."
 # LP4 (Ukraine)
 LPX_vasyl_vyshyvanyi_leader_desc: "Vasyl Vyshyvanyi, or Archduke Wilhelm Franz of Austria, is a royal of Austrian descent who has fought for Ukrainian independence. He has now ascended the throne as the monarch of Ukraine, which has gained limited freedom under the League of Nations Mandate. Residing in Kyiv after his coronation, he renamed the first Habsburg dynasty of Ukraine. It is yet unknown how long the Ukraine he leads can endure, but Ukrainians look upon Vasyl's rule with a mixture of expectation and concern."
 # LP5 (Moscow)
 LPX_vladimir_kirillovich_leader_desc: "Vladimir Kirillovich was denied restoration as the 'Tsar of all the Russias' by the Civil Administration and was only recognized with the title of 'Duke of the Duchy of Moscow.' This was a policy intended to divide Russia into several pieces and prevent it from ever being unified as one. Nevertheless, Vladimir refers to himself as Tsar in private and seeks to act as a dignified symbol for the Russian people rather than bowing to the Civil Administration."
 # LP6 (Caucasus)
 LPX_george_bagration_leader_desc: "The Bagrationi dynasty lost power long ago, but has now gained new leadership under the rule of the Civil Administration. The new monarch of Bagrationi intends to create a new order under the governance of the League of Nations Mandate overseeing the entire Caucasus region."
 # LP7 (Baltic)
 LPX_karl_gero_leader_desc: "Count Karl Gero of Württemberg enlisted as an officer in the Wehrmacht in 1935, but his military experience was cut short by the Great War. As the League of Nations Mandate took over management of the Baltic region, the Civil Administration decided to establish a monarch in the Baltics, and he has now gained governing power as the leader of the Baltic Mandate with the cooperation of the Civil Administration."
 
 # Events
 LPX.leader_event.ARU.t: "Appointment of Civil Administration Leader"
 LPX.leader_event.ARU.desc: "[ROOT.GetLeader] is the dominant power of the mandate and holds the authority to select the civil leader of the League of Nations Mandate. Of course, formal consent from the League of Nations is required, but they have neither the authority nor the will to block our choice. The civil administration leader will be decided according to [ROOT.GetLeader]'s decision.\n\nThe first option is the most rational alternative: the dispatch of a Kivotos-affiliated official. This involves replacing the Governor-General of the Civil Administration with one from Kivotos while maintaining the existing administration. Since [ROOT.GetLeader] is from Kivotos, this choice will be accepted reasonably within political circles.\n\nHowever, the claims of local factions within Luxembourg cannot be ignored. In particular, the monarchists who have fervently supported Aru Rikuhachima since the Great War see the Civil Administration as an opportunity to 'spread liberal monarchy to the world under Rikuhachima's leadership.' Since the Royalists are the only faction advocating for local leaders to be sent to the Civil Administration, selecting a local as the leader is equivalent to placing a Duke, King, or Emperor in the occupied territory.\n\nEither way, the choice lies with [ROOT.GetLeader]."
 LPX.leader_event.ARU.a: "Naturally, Kivotos personnel will continue to manage it."
 LPX.leader_event.ARU.b: "Do the Royalists want a monarchy? Then so be it!" 

 LPX.leader_event.HINA.t: "Appointment of Civil Administration Leader"
 LPX.leader_event.HINA.desc: "[ROOT.GetLeader] is the dominant power of the occupied territory and holds the authority to select their civil leader. The important question is what kind of person to seat as the Civil Minister in this territory. Since the Prefect Team has never viewed local political participation positively, the dispatch of a Kivotos-affiliated official is certain.\n\nThe core issue is whether to dispatch an internal Prefect Team member to manage the occupied territory in a form close to military rule, or to dispatch a civilian official from Kivotos to manage the region relatively moderately. Whichever it is, they will not be able to refuse our choice."
 LPX.leader_event.HINA.a: "Naturally, the Prefect Team must go there."
 LPX.leader_event.HINA.b: "Send a bureaucrat. There will be no conflict with the locals."
