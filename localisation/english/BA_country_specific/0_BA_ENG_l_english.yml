 ENG_stop_exile_1_tt: "§RThis decision will cause a major setback to the exile plans.§!"
 ENG_tooltip_bonto_banger: "A §YFort§! for defense will be added."
 go_to_can_tt: "§RThe exile plan will be executed, and we will depart for Canada.§!"

 #Focuses
 ENG_focus_fire_at_the_britain: "The Last Stand"
 ENG_focus_fire_at_the_britain_desc: "The corporate state of machines known as Kaiser Corporation struck us without even a hint of negotiation. The enemy was as relentless and swift as a sea lion; London and other major cities fell in rapid succession. However, through the desperate resistance of our forces, we have survived and fought them for over two months. This is no mere war; it is Britannia's final struggle for survival. We must win at all costs, or Britannia must survive even if it means fleeing."
 ENG_protect_liverpool: "Defense of Liverpool"
 ENG_protect_liverpool_desc: "Liverpool is now emerging as a vital strategic stronghold for Britain. It is our last hope and the potential springboard for a counteroffensive. If a miraculous turning point occurs in Liverpool, we may seize the chance to reverse the stagnant tide of war and execute a powerful counterattack plan."
 ENG_the_defense_of_liverfool_tt_1: "§Y$VICTORY_POINTS_6384$§!:\n"
 ENG_the_defense_of_liverfool_tt_2: "§Y$VICTORY_POINTS_6318$§!:\n"
 ENG_AirForceUtilization: "Air Force Utilization"
 ENG_AirForceUtilization_desc: "Fortunately, it appears the enemy is not actively utilizing their air power. This situation may be our last shred of hope. As the saying goes, \"He who rules the sky rules the battlefield.\" Now is the time for our air force to play a decisive role. If we secure air superiority, a chance to turn the tide of war still remains."
 ENG_Assault_Troops: "Establishment of Assault Troops"
 ENG_Assault_Troops_desc: "The creation of the Assault Troops is imminent. Their mission is to raid the enemy's vulnerable rear and strike at weak points to shatter their defensive lines. Through swift and precise strikes, they will induce chaos and play a critical role in reversing the situation. If they cooperate organically with the air force, we can slow the enemy's momentum and buy time for a counteroffensive. Though the situation remains unfavorable, the first crack created by the Assault Troops might be our final opportunity."
 ENG_building_a_position: "Fortifying Positions"
 ENG_building_a_position_desc: "Everyone is desperately gathering rubble and stacking crude sandbags. Time is not on our side. An air of anxiety hangs like a fog, fearing the enemy's ruthless assault could arrive at any moment. Without a moment's breath, we must carry and stack. We must defend this place before the barriers crumble and the enemy sets foot here."
 ENG_mercenary_recruitment: "Mercenary Recruitment"
 ENG_mercenary_recruitment_desc: "The number of foreigners wishing to join our war for various reasons is increasing. Most of them are from overseas Dominions, possessing valuable experience gained during the Great War. Their combat experience is desperately needed now. We must swiftly deploy them to the front lines to contribute to rescuing Britain from the enemy's clutches. With time running out, their participation will be a major turning point for us."
 ENG_focus_colonies_one: "Rally the Commonwealth"
 ENG_focus_colonies_one_desc: "The war on the British mainland is already in full swing. As the enemy's offensive intensifies, we must concentrate the resources of the external Dominions onto the British Isles to halt this attack. By strengthening the bond between Dominions and uniting the power of the Commonwealth, we can effectively block the enemy's invasion. This is not just Britain's fight. The entire Commonwealth must unite as one to avoid the worst-case scenario."
 ENG_Rule_the_Sky: "Rule the Sky"
 ENG_Rule_the_Sky_desc: "All enemy air assets must be crushed. Their technology is advancing rapidly; it won't be long before they catch up to our air force. Time is scarce. We must mobilize every aircraft to seize complete control of the sky and cut off the enemy's offensive. If we cannot protect our skies, the battlefield will soon belong to them. Now is the moment we must rule the sky."
 ENG_focus_militas_more: "Call up the Militia"
 ENG_focus_militas_more_desc: "After the Great War, Britain rushed into disarmament under the illusion that peace would be eternal. It seemed all wars had ended. However, the surprise attack of 1935 dragged us back into the whirlpool of war, and we are paying a terrible price. Across the country, countless militias are voluntarily taking up arms to protect their homes and families. If we mobilize them and complete their combat preparations, we can replenish our depleted forces and rebuild our collapsing defensive lines."
 ENG_Accelerate_exile_planning: "Accelerate Exile Planning"
 ENG_Accelerate_exile_planning_desc: "Our defeat has now become an irreversible reality. Every day, only news of defeat arrives from the front, and our forces continue to retreat endlessly. We have no strength left to endure, and no hope. The damage is already uncontrollable, and to prevent further sacrifice, we must hasten the exile plan. In all this chaos, the only thing we can do now is minimize remaining losses and find the final exit."
 ENG_lessons_of_kaiser_war: "Lessons of the Kaiser War"
 ENG_lessons_of_kaiser_war_desc: "The enemy has taught us a painful lesson. They utilized the advantage of surprise and swift mobility to capture our strongholds one by one, attempting to conquer us completely with superior technology. At first, we were filled with despair and defeat. Eventually, we perceived their weaknesses and, based on this, rapidly developed our technology to succeed in blocking the enemy's offensive. Now, it is time to rise again based on the lessons this war has taught us."
 ENG_Industrial_facility_Relocation: "Industrial Facility Relocation"
 ENG_Industrial_facility_Relocation_desc: "Most of our territory has fallen, but all is not yet lost. We must swiftly relocate the industrial facilities remaining on the mainland to Canada and other overseas Dominions. Time is of the essence. We must move all resources before it is too late."
 ENG_underground_workshop: "Underground Workshops"
 ENG_underground_workshop_desc: "We must immediately establish secret workshops to produce military supplies underground in the Scottish regions not yet engulfed by the flames of war. Even if they are makeshift facilities, they will secure sufficient production. There isn't much time."
 ENG_London_Industrial_Relocation: "London Industrial Relocation"
 ENG_London_Industrial_Relocation_desc: "We cannot allow London's industries and cultural treasures to fall into enemy hands. There is no time. Before our strongholds collapse, we must move all of this to a safe place. If we do not act before it is too late, we will lose these precious assets forever."
 ENG_WeWillWin: "We Shall Overcome!"
 ENG_WeWillWin_desc: "The enemy's retreat now seems certain! We are rapidly breaking through their defensive lines and have their core base in our sights. Little time remains. Move quickly to capture that base and finally fly the Union Jack there! Victory is within reach, and the end of this war is finally beginning to show!"
 ENG_we_will_win: "$ENG_WeWillWin$"

 #Additional
 ENG_Victory_Mainland: "Victory on the Mainland"
 ENG_Victory_Mainland_desc: "We have emerged victorious in the struggle for the mainland."
 ENG_Government_Return: "Return of the Government-in-Exile"
 ENG_Government_Return_desc: "The Return of the Government-in-Exile"

 #Decisions
 britian_war: "The War for Britain"
 britian_war_desc: "The battle that has persisted for three months since the extra-dimensional army known as Kaiser Corporation raided the British Isles is turning increasingly against us. We have formulated an exile plan to escape this war; the longer the British forces resist in the War for Britain, the more supplies we can transport to Canada."
 give_can_fac: "Preparations for Exile to Canada"
 go_to_can: "Execute Exile Plan"
 ENG_stop_exile_1: "Formulate Counteroffensive Plan"
 ENG_stop_exile_2: "Abolish Exile Plan"

 ENG_request_for_protection: "Request for Protection"
 ENG_request_for_protection_flag: "Already proceeded with §YRequest for Protection§!"
 ENG_end_of_protection_flag: "§YRequest for Protection§! Suzerain"
 ENG_end_of_protection: "End of Protection"


 #Characters
 ENG_british_army: "British Army Integrated Command"
 ENG_british_army_DESC: "Even as they engaged in combat with the mysterious army during the Great War, London trusted in the wisdom of the Baldwin Cabinet over the military. Those days of optimism—believing democracy's wisdom and the lessons of the Great War would resolve the crisis—were shattered repeatedly. Amidst the intensifying war, George V bypassed the Baldwin Cabinet, delegating full authority to the British Army Integrated Command and ordering them to resist to the end for the United Kingdom.\n\n...Because this wasn't simply about defeating the enemy, but ensuring a successful withdrawal from the British Isles. After lengthy debate, Parliament reached the desperate conclusion that victory over the enemy was impossible. Therefore, to preserve the British Empire and plan for the future, time had to be bought. Following George V, Parliament fled to Canada in succession, leaving only the Integrated Command, centered around Bernard Montgomery, in a deserted Downing Street.\n\nThough the King and Parliament are gone, the British people and the British Army remain. Their primary duty is to send as many assets as possible to Canada and buy time for as many British citizens as possible to board ships bound for the same destination.\n\nUntil the day of victory, God save the King and the United Kingdom."
 ENG_edward_VIII: "Edward VIII"
 ENG_george_VI: "George VI"
 ENG_elizabeth_II: "Elizabeth II"
 IMP_kingsley_wood: "Kingsley Wood"
 ENG_Health_minister: "Minister of Health"

 #Traits
 ENG_Last_Resistance: "Stalling for Time\n§gThe entirety of Britain burns alive. It screams in agony, yet no one comes to help.§!"
 

 #Ideas
 ENG_defence: "The Last Stand"
 ENG_identify_weaknesses: "Identifying Weaknesses"
 CAN_arab: "Middle East War"
 ENG_idea_yung_yunbang_one: "Rally the Commonwealth"
 ENG_operation_exile: "Exile Plan"
 ENG_under_surprise_attack: "Under Surprise Attack"
 ENG_save_the_liverpool: "The Miracle of Liverpool"
 ENG_operation_exile_week: "Exile Plan Relaxed"
 CAN_british_disease: "British Disease"
 CAN_british_disease_desc: "Let's be honest; no matter how much you dress it up as a 'Great Exile,' there's no way you can pack citizens like old slaves and ship them over without disease following along, right?"
 ENG_low_admin_Strength: "Weakened Administrative Power"
 ENG_low_admin_Strength_desc: "Due to weakened administrative power, crime is rampant, and colonial garrisons are falling prey to ambushing guerrillas."
 ENG_homless_n_health_1: "Refugee Problem - Severe"
 ENG_homless_n_health_1_desc: "Those who lost their homes to bombardment after the war began gathering in places that could block the wind and rain, such as under bridges, ruined buildings, and abandoned houses. The health and hygiene of the displaced are appalling."
 ENG_homless_n_health_2: "Refugee Problem - Caution"
 ENG_homless_n_health_2_desc: "Thanks to military tents and hospitals, the displaced have found living spaces. However, proper water, sewage, and waste collection facilities are lacking, leaving hygiene in a disastrous state."
 ENG_disassembled_parliment: "Dissolved Parliament"
 ENG_disassembled_parliment_desc: "In October 1935, the British Prime Minister dissolved Parliament for the upcoming elections. However..."
 ENG_dissolving_commonwealth: "Sunset of the Commonwealth"
 ENG_dissolving_commonwealth_desc: "The war with Kaiser Corporation has sapped the strength of the United Kingdom. Currently, the colonies follow us, but they will seek to escape our influence."
 ENG_great_depression_01: "Post-War Great Depression"

 ENG_postwar_devastation: "Post-War Devastation"


 #Events
 ENG_lose_global_flag: " §YBritain§! defeated by §YKaiser Corporation§!"
 ENG_win_global_flag: "§YBritain§! victorious over §YKaiser Corporation§!"
 ENG_ba.1.t: "Declaration of Emergency"
 ENG_ba.1.desc: "Strangers who suddenly appeared in the skies above London, England, have indiscriminately attacked citizens, causing Southern England to fall into enemy hands in an instant. We will officially declare a state of emergency to oppose them."
 ENG_ba.1.a: "Oppose the violence!"

 ENG_ba.2.t: "Solution"
 ENG_ba.2.desc: "I can't see a solution~"
 ENG_ba.2.a: "This is trouble."

 ENG_ba.3.t: "Request for Aid"
 ENG_ba.3.desc: "Receive manpower."
 ENG_ba.3.a: "Better than nothing..."
 
 ENG_ba.4.t: "Identifying Weaknesses"
 ENG_ba.4.desc: "Content regarding finding a weakness."
 ENG_ba.4.a: "Yes! This is it!"

 ENG_ba.5.t: "The Gematria Issue"
 ENG_ba.5.desc: "Gematria, which has illegally occupied northern Scotland, has ignored our demands for return several times!"
 ENG_ba.5.a: "We shall pacify them with violence alone."

 ENG_ba.6.t: "Gematria Retreats!"
 ENG_ba.6.desc: "Upon Britain's victory in the massive war against Kaiser Corporation in the British Isles, Gematria hastily retreated, taking all facilities in Scotland with them."
 ENG_ba.6.a: "Unbelievable."

 ENG_ba.7.t: "Collapse of Overseas Colonies"
 ENG_ba.7.desc: "News arrives that former imperial colonies are collapsing in the aftermath of the United Kingdom's defeat by extra-dimensional beings and its exile to Canada. King Edward VIII, who fled to Canada, seems significantly shocked by this news and has released no official statement."
 ENG_ba.7.a: "Oh, no."

 ENG_ba.23.t: "Egyptian Independence"
 ENG_ba.23.d: "Amidst the peak of imperial chaos, Egypt, which had remained subordinate to us, has officially declared the expulsion of our influence from within its borders. As Egypt, which has existed under the British Empire's sphere of influence for years, chooses the path of independence, we realize the Empire can no longer maintain its former dignity.\n\nEgypt's declaration of independence is expected to cause significant political ripples across the Middle East and North Africa, dealing a severe blow to the authority of our Empire. There is a growing possibility that more colonies will follow suit, and we cannot help but fear the disintegration of the British Empire's unity."
 ENG_ba.23.a: "The British Empire is crumbling."
 
 ENG_ba.24.t: "Withdrawal from East Africa"
 ENG_ba.24.d: "As imperial chaos intensifies, we have repatriated all colonial officials to the mainland to ensure the safety of Britons in East African colonies and prevent the loss of colonial capital.\n\nWe expect this measure to curb losses that would occur if our resources fell into the anarchy of East Africa."
 ENG_ba.24.a: "The worst was avoided."

 ENG_ba.25.t: "West African Dominion"
 ENG_ba.25.d: "Following the ongoing collapse of former imperial colonies, we have elevated the West African colony to Dominion status to prevent the total collapse of British West Africa. Consequently, the former West African colony now holds the same status as Canada and Australia."
 ENG_ba.25.a: "At least that's better."

 ENG_ba.8.t: "Strengthened Independence Movement in India"
 ENG_ba.8.desc: "Following the recent defeat by extra-dimensional beings, Indian colonial authorities have sent a somewhat chilling report to the leadership. According to the report, the independence movement throughout India is unfolding even more radically, with public anger being expressed in much more organized and violent forms than before. Particularly, communist forces are rapidly expanding their influence, declaring various forms of struggle against British rule. They are taking to the streets, organizing in factories and villages, and shouting anti-imperialist slogans."
 ENG_ba.8.a: "The Jewel of the Empire is falling away."
 
 ENG_ba.9.t: "Partition of India"
 ENG_ba.9.desc: "In a chaotic Indian Empire, communists have staged a rebellion."
 ENG_ba.9.a: "Oh, no."

 ENG_ba.10.t: "Partition"
 ENG_ba.10.d: "India was partitioned due to Britain's sudden defeat, and we must make a decision."
 ENG_ba.10.a: "We shall grasp victory in every realm where His Majesty's reign reaches!"
 ENG_ba.10.b: "Struggle for people's liberation and democracy!"
 ENG_ba.10.c: "Long live independent Pakistan!"

 ENG_ba.11.t: "Indian Revolution"
 ENG_ba.11.d: "The unrest turned into riots, and the riots turned into a revolution. We will urgently form a council to lead the revolution."
 ENG_ba.11.a: "Break the chains!"

 ENG_ba.12.t: "Massive Public Rally"
 ENG_ba.12.d: "Though we have imprisoned thousands of Indian political movement leaders, the colonists' will to resist remains unbowed, burning higher and brighter. What began as non-violent street marches has deepened into shop closures by merchants, general strikes by workers, and rural resistance by peasants, creating a vortex within the colony.\n\nThe government has ordered Governor-General [RAJ.GetLeader] to take measures to quiet them down."
 ENG_ba.12.a: "Disperse them immediately!"

 ENG_ba.13.t: "Red Army Uprising"
 ENG_ba.13.d: "In the northeastern provinces, those incited by leftist propaganda have finally launched a large-scale riot."
 ENG_ba.13.a: "Confront them!"

 ENG_ba.14.t: "Defeat"
 ENG_ba.14.d: "The revolutionary forces were stronger than expected, and the colonial authorities are struggling to even maintain current troops due to drastically reduced support from the mainland. Our Governor-General's office in Delhi has fallen, and we were able to obtain a temporary truce by negotiating with the revolutionary forces."
 ENG_ba.14.a: "We have lost a significant part of our control."

 ENG_ba.15.t: "The Convened Council" 
 ENG_ba.15.d: "A crowd of tens of thousands, encompassing anti-colonialists, communists, democrats, religious figures, intellectuals, and workers from all over India, has gathered. We stand at a critical crossroads determining the present and future of India—Bharata."
 ENG_ba.15.a: "Long live Bharata!"
 
 ENG_ba.16.t: "Industry of Bharata"
 ENG_ba.16.d: "After two days of preparation, the General Assembly has split into four factions. This division appears to be based on ideology, with Nehru, Bose, Pillai, and Gandhi serving as the heads of each faction. Furthermore, each faction is discussing and reviewing various policies to win over the neutral centrists who do not support any specific faction. One week after the council convened, a debate arose regarding the structure of the industrial economy."
 ENG_ba.16.a: "Organize the economy based on cooperatives!"
 ENG_ba.16.b: "Nationalize the entire economy to overthrow the capitalist class!"
 ENG_ba.16.c: "Promote economic growth through a free market and moderately regulated enterprises!"
 ENG_ba.16.e: "Agriculture is the foundation of every nation. Establish a physiocratic economy!"

 ENG_ba.17.t: "Defense of Bharata"
 ENG_ba.17.d: "As the debate over industry subsided, a new agenda emerged: defense. Each faction is in total conflict over the military doctrine Bharata should adopt moving forward."
 ENG_ba.17.a: "Implement mobile warfare centered around students who studied in Germany."
 ENG_ba.17.b: "Research large-scale troop operations with support from the Soviet Union."
 ENG_ba.17.c: "Research artillery technology independently to achieve self-reliant defense."
 ENG_ba.17.e: "Adapt and use traditional trench warfare."

 ENG_ba.18.t: "Religion in Bharata"
 ENG_ba.18.d: "As another issue was slowly settled, the council enjoyed a brief moment of peace. However, this did not last long, as a debate erupted over the status of religion. The factions of Nehru and Pillai advocated for the complete exclusion of religion from government, while the factions of Gandhi and Bose favored religious involvement."
 ENG_ba.18.a: "The masses need faith."
 ENG_ba.18.b: "Religion must not interfere in politics."

 ENG_ba.19.t: "Diplomacy of Bharata"
 ENG_ba.19.d: "As the council session approached its final days, each faction presented its finalized diplomatic platforms. Pillai and the Communist Party of Bharata faction set forth socialist internationalism as their manifesto, while Gandhi's faction emphasized permanent neutrality and the banner of pacifism. Meanwhile, the factions of Nehru and Bose advocated for expansionist policies based on Bharata nationalism."
 ENG_ba.19.a: "What India needs is stability."
 ENG_ba.19.b: "We must liberate other oppressed peoples in the world."
 ENG_ba.19.c: "For the revival of the Bharata nation!"

 ENG_ba.20.t: "Dissolution"
 ENG_ba.20.d: "The council session has concluded, and the final election for the head of state has been conducted."
 ENG_ba.20.a: "Long live the first Chairman, Chandra Bose!"
 ENG_ba.20.b: "Comrade Krishna Pillai leads Bharata!"
 ENG_ba.20.c: "Jawaharlal Nehru has been proudly elected President!"
 ENG_ba.20.e: "Under the guidance of Mahatma Gandhi, we shall prosper!"
 ENG_ba.22.t: "Another Uprising"
 ENG_ba.22.d: "In the Madras region, workers, peasants, and students have risen up against existing discrimination and oppression."
 ENG_ba.22.a: "We must plan for them to join us."

 ENG_ba.26.t: "Liverpool Preserved"
 ENG_ba.26.d: "Through the total effort of British citizens and the military, we have succeeded in defending Liverpool. We can use this as a starting point to launch a counteroffensive or accelerate the exile plan."
 ENG_ba.26.a: "A great victory."

 ENG_ba.100.t: "Britain Preserved"
 ENG_ba.100.d: "As a result of the all-out struggle of British citizens and soldiers, we have succeeded in defending the British mainland. Now, we must rebuild our devastated nation."
 ENG_ba.100.a: "We've passed the crisis."

 ENG_ba.101.t: "Post-War Devastation"
 ENG_ba.101.d: "Though Britain was successfully defended, the fierce combat on the mainland has severely scarred our beautiful country. Britain's survival depends on the success of reconstruction."
 ENG_ba.101.a: "'A rose thrown in the trash.'"

 ENG_ba.102.t: "Baldwin's Dilemma"
 ENG_ba.102.d: "The British government returned to the mainland, but a larger problem awaited. Parliament, which was dissolved in October 1935 for periodic elections, had its elections postponed due to the war with Kaiser Corporation—continued."
 ENG_ba.102.a: "'First, I must at least gather a cabinet.'"

