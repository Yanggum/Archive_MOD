 BEL_Leopold_III: "Leopold III"
 BEL_exile_shock: "Exile Shock"
 BEL_collapsed_army: "Collapsed Army"
 BEL_resistance_problem: "Resistance Issue"

 COG_event.1.t: "Britain Collapses!"
 COG_event.1.desc: "Britain has collapsed to the extra-dimensionals. With no resources reaching us, the colony is teeming with rebels, and internal chaos is spiraling out of control. Whatever happens, Belgium's fate is dark."
 COG_event.1.a: "Ah, dammit."

 COG_event.2.t: "Civil Unrest Occurs"
 COG_event.2.desc: "The natives of Congo have questioned our rule, and with Britain's fall, this has manifested as rage. The master of Congo may change. We must act quickly."
 COG_event.2.a: "Suppress them all, quickly!"

 COG_event.3.t: "Unrest Escalates into Civil War!"
 COG_event.3.desc: "Opposing the government's attempt at forceful suppression of nationwide unrest, the natives of Congo have launched a rebellion."
 COG_event.3.a: "May God help us."
