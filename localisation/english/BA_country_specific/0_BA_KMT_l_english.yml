l_english:

CHI_hunjeong: "Continue Political Tutelage"
CHI_hunjeong_desc: "Before we can fully realize the Three Principles of the People, our nation remains unprepared. It will not be too late to proclaim the Three Principles once the foreign threats have been repelled."
KMT_chogong_jakzun: "Encirclement Campaign"
KMT_preparation: "Transportation Strategy"
KMT_preparation_desc: "Those who escaped destruction during the Long March have been discovered in Shaanxi. Though we wish to crush them immediately, the path to Shaanxi is treacherous. We must construct supply lines and organize transportation to reach their stronghold."
KMT_SHX_offer: "The Shanxi Proposal"
KMT_SHX_offer_desc: "Yan Xishan is currently blocking our forces from entering his territory. If we can bring him to heel, we will be able to encircle the Communists and ensure their total eradication."
KMT_prep_tt: "Add 1 §YInfrastructure§! to all states bordering [PRC.Getname]."
KMT_strike_PRC: "Suppression of the Communists"
KMT_strike_PRC_desc: "The Communists have not yet recovered from the trauma of the Long March. We must strike before they regain their strength and bring an end to their movement once and for all."
KMT_national_def_propaganda: "National Defense Propaganda"
KMT_national_def_propaganda_desc: "To protect ourselves from the Japanese threat, the people of China must be unified. Even if we despise the Communist bandits and the local warlords, every man, woman, and child must be prepared to fight and die for the defense of China."
KMT_propaganda: "National Defense Propaganda"
KMT_propaganda_desc: "With Japan threatening our very existence, all members of the Chinese nation must stand united against them."
KMT_fortify_land: "Construct Defense Lines"
KMT_fortify_land_desc: "As Japan's ambitions for the invasion of China become clear, the survival of the Republic has become uncertain. We must fortify our territory so they dare not look upon our Republic with greed."
KMT_lure_them_in_strategy: "Lure the Tiger from the Mountain"
KMT_lure_them_in_strategy_desc: "Thanks to our nation's vast territory and rugged terrain, we can draw the invaders into a battlefield of our choosing through strategic retreats. Let them chase us if they wish! They will be greeted by ambush teams at every corner and booby traps at every step!"
KMT_cbis_idea: "Central Bureau of Investigation and Statistics"
KMT_cbis: "Establish the Central Bureau of Investigation and Statistics"
KMT_cbis_desc: "The Investigation and Statistics Bureau of the Central Executive Committee is the KMT's intelligence agency. We have recently reorganized it, and we must expand it further to protect the regime from subversive elements within China."
KMT_strengthen_the_kmt: "Integrate Party Central into the CBIS"
KMT_strengthen_the_kmt_desc: "Eyes in every hallway, ears in every classroom. To protect our ideals, we must ensure that no whisper of rebellion goes unheard. Discipline starts with surveillance."
KMT_cement_control_on_the_economy: "Controlled Economy"
KMT_cement_control_on_the_economy_desc: "Though we oppose the Communists, that does not mean we have knelt before the capitalists. We must ensure that business leaders and the economy remain loyal to the government and the KMT, focusing heavily on state-owned enterprises."
KMT_cement_control_on_the_economy_idea: "Controlled Economy"
KMT_bureaucracy_reorganization: "Purge Corrupt Officials"
KMT_bureaucracy_reorganization_desc: "A clean administration is a strong administration. We are clearing out the dead weight to ensure every resource reaches the front lines."
KMT_centralizing_power: "Rule of the Party over the State"
KMT_centralizing_power_desc: "A single vision requires a single voice. By unifying the Academy's administration with the Party's will, we eliminate the inefficiency of dissent."
KMT_walking_the_tiger: "Awakened Tiger"
KMT_walking_the_tiger_desc: "The slumbering giant of the East finally opens its eyes. When we strike, the earth itself will tremble beneath our resolve."
KMT_inheritor_of_the_mantle_of_SunWen: "Successor to Sun Yat-sen"
KMT_inheritor_of_the_mantle_of_SunWen_desc: "To carry the weight of a founder's dream is no simple task. We are the stewards of his legacy, guiding the Republic toward the dawn he envisioned."
KMT_New_koumintang: "Strengthen the Blue Shirts Society"
KMT_New_koumintang_desc: "Loyalty, vigor, and absolute dedication. The Blue Shirts will be the vanguard of our renewed spirit, ensuring the Academy remains pure and resolute."
KMT_political_indoctrination: "Establish Party Member Investigation Network"
KMT_political_indoctrination_desc: "True strength comes from conviction. We will monitor the hearts of our members to ensure that the flame of our ideology never flickers."
KMT_reinforce_new_life_movement: "Promote the New Life Movement"
KMT_reinforce_new_life_movement_desc: "The New Life Movement is a campaign led by the Kuomintang. Its purpose is to enlighten the Chinese people while eradicating decadent culture and maintaining discipline, morality, order, and cleanliness."
KMT_new_life: "New Life Movement"
KMT_huisaengdojeo_hangjeondojeo: "Sacrifice to the End, Resist to the End"
KMT_huisaengdojeo_hangjeondojeo_desc: "Victory is not found in comfort, but in the willingness to lose everything for the cause. We shall stand our ground until the very last student, the very last blade."
KMT_declare_martial_law_focus: "Proclaim Martial Law"
KMT_declare_martial_law_focus_desc: "Extraordinary times demand extraordinary measures. For the safety of the Academy, individual freedoms must temporarily give way to absolute order."
KMT_authoritarianism: "Martial Law"
KMT_authoritarianism_desc: "The gates are locked, the patrols are doubled. Order is not a suggestion—it is a requirement for our survival."
KMT_assume_intra_party_leadership: "Secure Party Leadership"
KMT_assume_intra_party_leadership_desc: "A ship cannot have two captains. I will take the helm and steer us through this storm, regardless of who objects."
KMT_father_of_nations: "Leader of the Kuomintang"
KMT_father_of_nations_desc: "Standing at the pinnacle of the Republic. The weight of millions rests upon these shoulders, and the path forward is mine to decide."
KMT_RCA: "KMT Reorganization Comrades Association"
KMT_RCA_desc: "Following Chiang Kai-shek's ousting, the Chiang-Wang cooperation has collapsed. The Reorganization Comrades Association, once thought disbanded, has emerged to argue that it is not too late to transition to a collective leadership system following Sun Yat-sen's ideals."
KMT_Right: "KMT Right-Wing"
KMT_Right_desc: "Preserving tradition and stability is the only way to save the Republic. We must return to the core values that defined our movement from the beginning."
KMT_hunt_of_tiger: "Hunting the Tiger"
KMT_hunt_of_tiger_desc: "Even the fiercest beast can be trapped if you know where to place the cage. The hunt has begun, and there is nowhere left to hide."
KMT_peace_agreement_japan: "Submission to Japan"
KMT_peace_agreement_japan_desc: "A bitter compromise for the sake of survival. We lower our heads today so that we might live to see another morning... however hollow it may feel."
KMT_broken_Chiang_Wang_Cooperation: "The Ousting of Chiang Kai-shek"
KMT_broken_Chiang_Wang_Cooperation_desc: "Chiang Kai-shek has toyed with the values of the KMT and the people of the Republic. He has deceived China and placed it in peril. It is time to bring down the dictator."

