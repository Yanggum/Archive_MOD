 #Focuses
 IRE_change_the_world: "Declaration of Irish Independence"
 IRE_change_the_world_desc: "Now, with Britain engulfed in terrible chaos, is the chance to declare true Irish independence. We will issue the Proclamation of the Republic and focus on constitutional reform."
 IRE_attack_N_ire: "Advance Toward Northern Ireland"
 IRE_attack_N_ire_desc: "The Irish Republican Army, which was shattered after the Irish Civil War, has risen again, taking advantage of the chaos in Britain and Europe. We will forcibly occupy Northern Ireland while British security is withdrawn, proving that the IRA has been reborn."
 IRE_fascism_focus: "Rally the National Corporate Party"
 IRE_fascism_focus_desc: "In times of chaos, strong leadership is required. The National Corporate Party, which inherits the Irish national and republican spirit, will be the best fit for this role."
 IRE_new_government: "Toward a New Government"
 IRE_new_government_desc: "It is time to overthrow the Irish Free State, built on the betrayal of comrades, and establish a true Irish Republic. The IRA will rise from the rubble and prepare for war against the Free State."
 IRE_republican_reunion: "Reunification of the Republican Congress"
 IRE_republican_reunion_desc: "The Republican Congress was originally part of the IRA but was founded as a separate Communist party due to disagreements. Currently, the Congress is in severe financial trouble and suffers from internal discord, but the common goal of Irish independence remains. Cooperating with them will allow us to achieve independence more quickly."
 IRE_IRA_leftist_movement: "Leftward Shift of the IRA"
 IRE_IRA_leftist_movement_desc: "Since the Republican Congress has rejoined the IRA, we can achieve the leftward shift of the IRA that the Congress originally intended."
 IRE_IRA: "Second Irish Civil War"
 IRE_IRA_desc: "Having completed all preparations, we will overthrow the government, starting with a declaration of war against the Free State. There must not be a third civil war; every preparation must be perfect. Men of the IRA, take up arms! The hour of national salvation has arrived!"
 IRE_expulsion_of_colonial_culture: "Expulsion of Colonial Culture"
 IRE_expulsion_of_colonial_culture_desc: "We must uproot the culture of British colonial rule and revive a culture more true to ourselves. True independence for Ireland lies here."
 IRE_vanguard: "Red Guards"
 IRE_vanguard_desc: "The power struggle following the civil war is threatening the power of the Republican Congress. We need an organization dedicated to suppressing and uprooting the opposition forces that deny the Irish workers' revolution."
 IRE_last_gamble: "The Great Accord"
 IRE_last_gamble_desc: "Old hardline republicans are rallying once again under the banner of Irish liberation."
 IRE_republic_of_people: "The Irish Republic"
 IRE_republic_of_people_desc: "We will announce our victory and proclaim that an Ireland for the Irish has been established."
 IRE_left_wing_expulsion: "Left-Wing Purge"
 IRE_left_wing_expulsion_desc: "Now that the civil war is over, we will uproot the far-left factions within the IRA and preserve its true identity."
 IRE_fine_gale_focus: "Fine Gael"
 IRE_fine_gale_focus_desc: "United for the stability of the Free State."
 IRE_democracy_focus: "Fianna Fáil"
 IRE_democracy_focus_desc: "The Soldiers of Destiny shall lead the nation."
 IRE_democracy_focus_2: "Resolving the Northern Ireland Issue"
 IRE_democracy_focus_2_desc: "Taking decisive steps to solve the partition of our island."
 IRE_new_constitution: "Enacting a New Constitution"
 IRE_new_constitution_desc: "Establishing the legal framework for a sovereign nation."
 IRE_cheoldogeonseol: "Progressing Railway Projects" 
 IRE_cheoldogeonseol_desc: "Expanding the iron veins of the country."
 IRE_nodongnyeokjipjung: "Concentrating Labor in [113.GETNAME]"
 IRE_nodongnyeokjipjung_desc: "Focusing human resources on strategic development."
 IRE_daehakgyoseollip: "Establishment of Universities"
 IRE_daehakgyoseollip_desc: "Educating the next generation of Irish leaders."
 IRE_gisulgongyu: "Technology Sharing"
 IRE_gisulgongyu_desc: "Exchanging knowledge for the modernization of the state."
 IRE_gukgamujang: "Arm the Nation"
 IRE_gukgamujang_desc: "Preparing every citizen for the defense of our land."
 IRE_gukbangwiwonhoeseollip: "Establishment of National Defense Committee"
 IRE_gukbangwiwonhoeseollip_desc: "Centralizing military command and strategy."
 IRE_saneopwalseonghwa: "Infrastructure Construction"
 IRE_saneopwalseonghwa_desc: "Building the roads and bridges of tomorrow."
 IRE_saneopyeondaehwa: "Industrial Modernization"
 IRE_saneopyeondaehwa_desc: "Upgrading our production capabilities to modern standards."
 IRE_guksansohwagihoesa: "Domestic Small Arms Company"
 IRE_guksansohwagihoesa_desc: "Producing Irish-made weapons for Irish soldiers."
 IRE_aillaendeuhanggonghakgyo: "Irish Aviation School"
 IRE_aillaendeuhanggonghakgyo_desc: "Training the pilots of the new Republic."
 IRE_HANGGONGHAKGYU: "Irish Aviation School"
 IRE_dokjaseolgye: "Independent Design"
 IRE_dokjaseolgye_desc: "Developing our own engineering solutions."
 IRE_arms_industry: "Armed and Ready"
 IRE_arms_industry_desc: "Finalizing the mobilization of our industrial might."

