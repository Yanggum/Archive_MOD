 ## EVENTS ##
 IRE_event.1.t: "The Second Great Crisis"
 IRE_event.1.d: "The British Empire, which sustained our economy through agricultural exports, has been crushed by otherworldly entities. We shouldn't rejoice just because we escaped the immediate carnage. Our economy has collapsed, and it may now be irreversible..."
 IRE_event.1.a: "Damn it."
 IRE_event.2.t: "Escalating Inflation"
 IRE_event.2.d: "Inflation is worsening throughout the country."
 IRE_event.2.a: "There is no other way."
 IRE_event.2.b: "The government steps in to resolve it."
 IRE_event.3.t: "[GetYear] Irish Election"
 IRE_event.3.d: "[GetYear] Irish Election"
 IRE_event.3.a: "The results are in..."
 IRE_event.4.t: "Election: Ruling Party Victory"
 IRE_event.4.d: "The ruling party has secured a victory."
 IRE_event.4.a: "Naturally."
 IRE_event.5.t: "Election: Labour Party Victory"
 IRE_event.5.d: "The Labour Party has secured a victory."
 IRE_event.5.a: "Hmm.."
 IRE_event.6.t: "Election: Fianna Fáil Victory"
 IRE_event.6.d: "Fianna Fáil has secured a victory."
 IRE_event.6.a: "Hmm.."
 IRE_event.7.t: "Election: Fine Gael Victory"
 IRE_event.7.d: "Fine Gael has secured a victory."
 IRE_event.7.a: "Hmm.."
 IRE_event.8.t: "Large-Scale Right-Wing Protest"
 IRE_event.8.d: "Right-wing forces have organized a massive demonstration."
 IRE_event.8.a: "Let them shout."
 IRE_event.8.b: "Deploy the police to suppress them."
 IRE_event.9.t: "Irish Delegation Arrives in Moscow"
 IRE_event.9.d: "The Irish delegation has arrived in Moscow."
 IRE_event.9.a: "Grant large-scale aid to Ireland."
 IRE_event.9.b: "Grant small-scale aid to Ireland."
 IRE_event.9.c: "We have no interest in minor border nations."
 IRE_event.10.t: "Trade Agreement with Ireland Concluded"
 IRE_event.10.d: "An envoy from the Irish government has arrived and discussed several matters with our officials. We will take Ireland's surplus production, and in return, provide them with equipment that is no longer useful to us."
 IRE_event.10.a: "Our Irish compatriots are helping us."
 IRE_event.11.t: "Election: Ruling Party Becomes Minority"
 IRE_event.11.d: "In this election, the ruling Fianna Fáil failed to reach the plurality. However, amidst the internal and external crises, public distrust in a cabinet change boiled over, and de Valera was elected Taoiseach with opposition rebel votes."
 IRE_event.11.a: "Stability, for now."
 IRE_event.12.t: "Election Fraud Attempt Discovered!"
 IRE_event.12.d: "Reports of government interference in the electoral process have surfaced. 'This is quite the predicament,' as a certain GSC president might say."
 IRE_event.12.a: "No, we didn't do it!"
 IRE_event.13.t: "Nationwide Protests"
 IRE_event.13.d: "Anger is boiling over in the streets. If this were Kivotos, there'd be tanks and helicopters by now."
 IRE_event.13.a: "Traitors!"
 IRE_event.14.t: "Civil Revolution"
 IRE_event.14.d: "The people have taken up arms. The 'Corrective' action has begun."
 IRE_event.14.a: "I will crush them all!"
 IRE_event.9001.t: "Soviet Union Decides on Large-Scale Aid"
 IRE_event.9001.d: "Aid from the East."
 IRE_event.9001.a: "Excellent."
 IRE_event.9002.t: "Soviet Union Decides on Small-Scale Aid"
 IRE_event.9002.d: "Minor assistance."
 IRE_event.9002.a: "Excellent."
 IRE_event.9003.t: "Soviet Union Refuses Aid"
 IRE_event.9003.d: "The East turns its back."
 IRE_event.9003.a: "As expected."
 IRE_event.9010.t: "Irish Oath of Loyalty"
 IRE_event.9010.d: "The prodigal son returns."
 IRE_event.9010.a: "Our Ireland has returned."
 IRE_event.9010.b: "What help can they provide us?"
 IRE_event.9011.t: "A Different Path"
 IRE_event.9011.d: "They chose independence over the crown."
 IRE_event.9011.a: "We walk our own path."
 IRE_event.8001.t: "Scandal Involving Ruling Party Member"
 IRE_event.8001.d: "A scandal has broken out."
 IRE_event.8001.a: "Cover it up appropriately."
 IRE_event.8001.b: "Expel them from the party."

 ## DECISIONS ##
 IRE_dail_eireann: "Dáil Éireann"
 IRE_dail_eireann_desc: "Dáil Éireann, the lower house of the Irish parliament, traces its origins to the 1919 Irish Republic and established its current structure through the New Constitution. As a symbol of Irish democracy, it must function longer than anything else.\n\n§YCurrent Party Support§!:\n  §RLabour Party§!: [?IRE.IRE_LP_sup|%%0..1]\n  §GFianna Fáil§!: [?IRE.IRE_FF_sup|%%0..1]\n  §CFine Gael§!: [?IRE.IRE_FG_sup|%%0..1]"
