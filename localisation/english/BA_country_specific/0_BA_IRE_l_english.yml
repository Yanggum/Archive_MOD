 IRE_internal_factions_decision: "Faction Management"
 IRE_internal_factions_decision_desc: "The domestic political situation in Ireland has become increasingly divided since the Transition. Our government must balance these forces and steer the ship of state in the right direction.\n"
 IRE_IFA_name_text: "Irish Farmers' Association"
 IRE_IFA_TT_text: "The £GFX_faction_IRE_IFA_icon §YIrish Farmers' Association§! is an organization formed by farmers across the country in late 1935 to overcome the agricultural crisis, including the decline in exports to the UK.\n\n£GFX_faction_IRE_IFA_icon §YScaling Bonuses:§! Consumer Goods Factor, Recruitable Population Factor, Weekly Stability"
 IRE_CAT_name_text: "Catholic Church"
 IRE_CAT_TT_text: "The £GFX_faction_IRE_CAT_icon §YCatholic Church§! is Ireland's largest religious organization, historically counting the vast majority of the Irish population as its members.\n\n£GFX_faction_IRE_CAT_icon §YScaling Bonuses:§! Political Power Gain, Stability, War Support"
 IRE_IRA_name_text: "Irish Republican Army"
 IRE_IRA_TT_text: "The £GFX_faction_IRE_IRA_icon §YIrish Republican Army§! is commonly known as the 'IRA'. Following the 1916 Easter Rising, they fought against Britain to achieve Irish independence. After several splits, they are now advocating for the recovery of Ulster, seizing on the fall of Britain.\n\n£GFX_faction_IRE_IRA_icon §YScaling Bonuses:§! Division Attack, Division Defense, Training Time"
 IRE_SOC_name_text: "Comprehensive Socialists"
 IRE_SOC_TT_text: "The £GFX_faction_IRE_SOC_icon §YComprehensive Socialists§! are left-wing forces including trade unions. They pursue social democracy and are the absolute support base of the Labour Party.\n\n£GFX_faction_IRE_SOC_icon §YScaling Bonuses:§! Factory Output, Dockyard Output, Construction Speed"
