 IRE_new_constitution_idea_desc: "In October 1935, the sudden appearance of otherworldly entities threw many nations into chaos, and Britain was no exception. Eamon de Valera and other Irishmen drafted a constitution to break free from Britain. With the bill's approval, Ireland gained independence as a republic rather than a 'Dominion' Free State.\n\nThe constitution emphasizes Irish republicanism, including the Easter Rising, and the Irish language orthography was formalized. The new constitution, which inspires the spirit of the Irish people, will have a profound impact for some time."
