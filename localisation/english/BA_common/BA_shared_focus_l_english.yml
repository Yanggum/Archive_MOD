l_english: 
 #Shared National Focus#
 BA_factoriesof_new_world:0 "The World's Factory"
 BA_factoriesof_new_world_desc:0 "Upon arriving in this unknown world, what we encountered were countless factories. Although they are significantly more antiquated than the ones we were accustomed to, they are extremely numerous and are operating very actively."
 BA_a_lot_of_people:0 "Countless People"
 BA_a_lot_of_people_desc:0 "Countless people, the likes of which could not be seen in Kivotos, exist here. We will be able to utilize them to respond to the chaos of this anomalous situation."
 BA_new_world_technology:0 "Technology of the New World"
 BA_new_world_technology_desc:0 "The technology developed by the people here is fundamentally more antiquated than ours, but in some respects, it is more advanced than what we possess. This will certainly be something for us to observe and learn from."
 BA_new_world_technology_army:0 "Locals"
 BA_new_world_technology_army_desc:0 "Unlike the people of Kivotos, the people here do not possess halos and can perish from only one or two bullets. Consequently, their military operations are conducted very systematically and utilize a massive amount of manpower."
 BA_new_world_technology_new:0 "Technological Countermeasures"
 BA_new_world_technology_new_desc:0 "While halos are strong against physical impact, they are extremely vulnerable to attacks such as biochemical warfare. We will prepare countermeasures against this and augment the defense of halo infantry."
 BA_new_world_technology_army1:0 "Military Doctrine"
 BA_new_world_technology_army1_desc:0 "This world possesses excellent doctrines developed through massive world wars and numerous small-scale military conflicts. We will attempt to research these and introduce them into our own military doctrine system."
 BA_new_world_technology_army2:0 "Large-scale Military Operations"
 BA_new_world_technology_army2_desc:0 "By emulating their massive military operations, we can reorganize our military system into a more advanced form."
 BA_new_world_technology_halo:0 "Specialized Utilization of Halos"
 BA_new_world_technology_halo_desc:0 "Continuous research has revealed that our halos can be utilized in very diverse ways, which will lead to an increase in the organizational capacity of military units using halos."
 BA_new_world_technology_halo_heavy:0 "Multipurpose Halo Research"
 BA_new_world_technology_halo_heavy_desc:0 "Halo infantry possess immense potential. We will further explore Mystery technology to maximize the potential of halo infantry."
 BA_horror_of_war:0 "The Horrors of War"
 BA_horror_of_war_desc:0 "We will mobilize all available means to utilize our military efficiently and will not hesitate to conduct large-scale military operations.\n\n§tWe have finally adapted to the new world.§!"

 #Custom Tooltips#
 BA_factoriesof_new_world_tt:0 "Allows for the removal of the §YIsolated§! trade law."
 BA_add_division_template_s_tt:0 "§YWe§! will receive a §Ytemplate§! consisting of §G4§! §YInfantry§! battalions."
 BA_add_division_template_m_tt:0 "§YWe§! will receive a §Ytemplate§! consisting of §G10§! §YInfantry§! and §G1§! §YArtillery Support Company§!."
