l_english:
 BA_sensei_guidance: "Sensei's Guidance"
 BA_sensei_guidance_desc: "The experience of leading the students of Kivotos has now become a valuable asset in leading a nation. The students' pure trust and expectations grant us a heavy sense of responsibility along with the courage to overcome any difficulty."
 BA_sensei_millennium_collab: "Technical Cooperation with Millennium"
 BA_sensei_millennium_collab_desc: "Cooperation with Millennium Science School has elevated the nation's technological prowess to the next level. By sharing cutting-edge technology and big data, we are leading innovation toward the future."
 BA_sensei_srt_security: "SRT Security Advisory"
 BA_sensei_srt_security_desc: "The practical experience of SRT Special Academy has breathed new life into the national security system. Thanks to their professional advice, our military is being reborn as a more efficient and resilient organization."
 BA_sensei_trinity_seminar: "Tactical Seminar with Trinity"
 BA_sensei_trinity_seminar_desc: "Exchange with Trinity General School goes beyond simple military training, providing deep insights into strategy and tactics. Seminars held over tea are offering new inspiration to our commanders."
 BA_sensei_redwinter_admin: "Red Winter Administrative Support"
 BA_sensei_redwinter_admin_desc: "The passionate students of Red Winter Federal Academy have brought revolutionary changes to the administrative system. While their bold methods occasionally cause chaos, they contribute to national development with surprising efficiency."
 BA_sensei_gehenna_discipline: "Gehenna's Steel Discipline"
 BA_sensei_gehenna_discipline_desc: "The rigorous training of the Gehenna Academy Prefect Team has rectified military discipline and maximized combat power. Under steel-like discipline, our military has been reborn as an elite force that fears no enemy."
 BA_sensei_hyakkiyako_order: "Hyakkiyako's Street Order"
 BA_sensei_hyakkiyako_order_desc: "The students of Hyakkiyako Allied Academy have brought vitality and order to the streets in their own unique way. Their activities, blending festivals and tradition, capture the hearts of the people and stabilize society."
 BA_sensei_shanhaijing_project: "Joint Project with Shanhaijing"
 BA_sensei_shanhaijing_project_desc: "Cooperation with Shanhaijing Senior Secondary School has strengthened the nation's industrial base. Their technological skill and work ethic have raised our productivity to the next level, serving as a new engine for economic growth."
 BA_sensei_abydos_bonds: "Abydos's Hope Bonds"
 BA_sensei_abydos_bonds_desc: "An idea that started from the desperation of Abydos High School students has now become a symbol of hope sustaining national finances. Under the slogan 'With Sensei,' citizens are willingly participating in investments for the future."
 BA_sensei_gourmet_diplomacy: "Gourmet Diplomacy"
 BA_sensei_gourmet_diplomacy_desc: "The dishes of Gehenna's School Lunch Club and the Gourmet Research Society have become powerful diplomatic weapons beyond mere food. Their fantastic cuisine melts the hearts of even the most difficult diplomats and raises the nation's prestige."
 BA_sensei_cheerleader_training: "C&C's Explosive Cheering"
 BA_sensei_cheerleader_training_desc: "Cheering from Millennium's C&C is not simple encouragement. Their firepower support using cutting-edge equipment raises soldier morale to the sky and becomes a force that changes the flow of the battlefield."
 BA_sensei_valkyrie_training: "Valkyrie Joint Training"
 BA_sensei_valkyrie_training_desc: "Joint training with Valkyrie Police Academy has raised our law enforcement capabilities to a new dimension. Through training as realistic as actual combat, our police and military have gained the ability to respond calmly in any crisis."
 BA_sensei_pandemonium_support: "Pandemonium's 'Support'"
 BA_sensei_pandemonium_support_desc: "Support from the Gehenna Pandemonium Society is occasionally radical, but it is the surest way to achieve goals. Their bold action carries out the nation's will and contributes to raising our voice in the international community."
 BA_sensei_festival_management: "Festival Management Committee"
 BA_sensei_festival_management_desc: "With the joining of the Hyakkiyako Festival Management Committee, every national festival has now become a work of art. Their perfect planning unites the citizens and breathes vitality into society."
 BA_sensei_redwinter_guidance: "Red Winter's People's Guidance"
 BA_sensei_redwinter_guidance_desc: "Students of Red Winter Federal Academy have sparked the flame of revolution in the hearts of the people. Their passionate guidance arouses a desire for social justice and leads to dedication for the nation."
 BA_sensei_arius_governance: "Arius-style Governance"
 BA_sensei_arius_governance_desc: "The methods of the Arius Squad are dangerous, but their efficiency cannot be denied. Their approach of using any means for an end sometimes becomes the fastest way to resolve problems."
 BA_sensei_game_project: "National Game Project"
 BA_sensei_game_project_desc: "The 'Sensei Simulator' project with the Millennium Game Development Department has become an important venture strengthening the nation's soft power beyond simple game development. This game will be the best promotional tool to announce our greatness to the world."
 BA_sensei_abydos_prospecting: "Abydos-style Resource Prospecting"
 BA_sensei_abydos_prospecting_desc: "The intuition and persistence of Abydos students have become the most powerful weapon for finding the nation's hidden resources. Their seemingly reckless explorations often lead to miraculous discoveries."
 BA_sensei_justice_task_force: "Support from the Justice Task Force"
 BA_sensei_justice_task_force_desc: "With the joining of the Trinity Justice Task Force, justice in our society has become even more solid. Their uncompromising sense of justice roots out corruption and contributes to creating a society where all citizens are equal before the law."
 BA_sensei_veritas_analysis: "Veritas Data Analysis"
 BA_sensei_veritas_analysis_desc: "The data analysis capabilities of Millennium's Veritas have now become a core part of national operation. Their accurate predictions and insights help us always make the best decisions."
 BA_sensei_gsc_audit: "General Student Council Audit"
 BA_sensei_gsc_audit_desc: "The General Student Council's regular audit is painful, but it serves as an opportunity to advance the national system. Efforts to pass their strict standards contribute to increasing the transparency and efficiency of our administrative system."
 BA_sensei_millennium_deep_collab: "Deepened Cooperation with Millennium"
 BA_sensei_millennium_deep_collab_desc: "Cooperation with Millennium has now entered a new stage. The introduction of quantum computing and AI technology is innovating all national industries and science, and we are moving toward a technological singularity."
 BA_sensei_srt_distrust: "SRT's Distrust"
 BA_sensei_srt_distrust_desc: "Our cautious attitude has brought distrust to SRT Special Academy. They are concerned about our lack of decisiveness, and as a result, subtle cracks have begun to form in our security cooperation."
 BA_sensei_hyakkiyako_overreach: "Hyakkiyako's Overreach"
 BA_sensei_hyakkiyako_overreach_desc: "Hyakkiyako's festivals are now going overboard. Excessive festival budgets and wasted administrative power are putting a burden on national finances, and fatigue is building up among the citizens."
 BA_sensei_gehenna_integration: "Complete Integration with Gehenna"
 BA_sensei_gehenna_integration_desc: "Complete integration with Gehenna Academy has brought immense power to the nation. Their executive ability and combat power are now entirely ours, and we fear no threat."
 BA_sensei_abydos_desperation: "Abydos's Desperation"
 BA_sensei_abydos_desperation_desc: "The price of ignoring the desperate situation of Abydos students has been severe. As their hope breaks, the morale of the citizens and trust in the state are crumbling together."
