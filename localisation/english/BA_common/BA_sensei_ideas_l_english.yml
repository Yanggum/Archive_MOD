l_english:
 BA_sensei_guidance: "선생님의 지도"
 BA_sensei_guidance_desc: "키보토스의 학생들을 이끌었던 경험은, 이제 한 국가를 이끄는 데에도 귀중한 자산이 되고 있습니다. 학생들의 순수한 신뢰와 기대는 우리에게 무거운 책임감과 함께, 어떤 어려움도 극복할 수 있다는 용기를 줍니다."
 BA_sensei_millennium_collab: "밀레니엄과의 기술 협력"
 BA_sensei_millennium_collab_desc: "밀레니엄 사이언스 스쿨과의 협력은 국가의 기술력을 한 단계 끌어올렸습니다. 최첨단 기술과 빅데이터를 공유하며, 우리는 미래를 향한 혁신을 이끌고 있습니다."
 BA_sensei_srt_security: "SRT의 안보 자문"
 BA_sensei_srt_security_desc: "SRT 특수학원의 실전 경험은 국가 안보 시스템에 새로운 활력을 불어넣었습니다. 그들의 전문적인 조언 덕분에, 우리의 군대는 더욱 효율적이고 강인한 조직으로 거듭나고 있습니다."
 BA_sensei_trinity_seminar: "트리니티와의 전술 세미나"
 BA_sensei_trinity_seminar_desc: "트리니티 종합학원과의 교류는 단순한 군사 훈련을 넘어, 전략과 전술에 대한 깊이 있는 통찰을 제공합니다. 홍차와 함께하는 세미나는 우리의 지휘관들에게 새로운 영감을 주고 있습니다."
 BA_sensei_redwinter_admin: "붉은겨울의 행정 지원"
 BA_sensei_redwinter_admin_desc: "붉은겨울 연방학원의 열정적인 학생들은 행정 시스템에 혁명적인 변화를 가져왔습니다. 그들의 과감한 방식은 때로 혼란을 야기하지만, 놀라운 효율성으로 국가 발전에 기여하고 있습니다."
 BA_sensei_gehenna_discipline: "게헨나의 강철 규율"
 BA_sensei_gehenna_discipline_desc: "게헨나 학원 선도부의 혹독한 훈련은 군의 기강을 바로잡고 전투력을 극대화시켰습니다. 강철 같은 규율 아래, 우리의 군대는 그 어떤 적도 두려워하지 않는 정예 병력으로 다시 태어났습니다."
 BA_sensei_hyakkiyako_order: "백귀야행의 거리 질서"
 BA_sensei_hyakkiyako_order_desc: "백귀야행 연합학원의 학생들은 자신들만의 독특한 방식으로 거리에 활기와 질서를 동시에 가져왔습니다. 축제와 전통이 어우러진 그들의 활동은 국민들의 마음을 사로잡고 사회를 안정시키고 있습니다."
 BA_sensei_shanhaijing_project: "산해경과의 공동 공정"
 BA_sensei_shanhaijing_project_desc: "산해경 고급중학교와의 협력은 국가의 산업 기반을 강화시켰습니다. 그들의 기술력과 노동 윤리는 우리의 생산력을 한 단계 끌어올렸으며, 경제 성장의 새로운 동력이 되고 있습니다."
 BA_sensei_abydos_bonds: "아비도스의 희망 채권"
 BA_sensei_abydos_bonds_desc: "아비도스 고등학교 학생들의 절박함에서 시작된 아이디어는, 이제 국가 재정을 지탱하는 희망의 상징이 되었습니다. '선생님과 함께라면'이라는 구호 아래, 국민들은 기꺼이 미래를 위한 투자에 동참하고 있습니다."
 BA_sensei_gourmet_diplomacy: "미식 외교"
 BA_sensei_gourmet_diplomacy_desc: "게헨나 급양부와 미식연구회의 요리는 단순한 음식을 넘어, 강력한 외교 무기가 되었습니다. 그들의 환상적인 요리는 까다로운 외교관들의 마음을 녹이고, 국가의 위상을 높이고 있습니다."
 BA_sensei_cheerleader_training: "C&C의 화끈한 응원"
 BA_sensei_cheerleader_training_desc: "밀레니엄 C&C의 응원은 단순한 격려가 아닙니다. 최첨단 장비를 동원한 그들의 화력 지원은 병사들의 사기를 하늘 끝까지 끌어올리고, 전장의 흐름을 바꾸는 힘이 되고 있습니다."
 BA_sensei_valkyrie_training: "발키리의 합동 훈련"
 BA_sensei_valkyrie_training_desc: "발키리 경찰학교와의 합동 훈련은 우리의 법 집행 능력을 한 차원 높였습니다. 실전을 방불케 하는 훈련을 통해, 우리의 경찰과 군대는 어떤 위기 상황에서도 침착하게 대응할 수 있는 능력을 갖추게 되었습니다."
 BA_sensei_pandemonium_support: "만마전의 '지원'"
 BA_sensei_pandemonium_support_desc: "게헨나 만마전의 지원은 때로 과격하지만, 목표를 달성하는 데에는 가장 확실한 방법입니다. 그들의 거침없는 행동력은 국가의 의지를 관철시키고, 국제 사회에서 우리의 목소리를 높이는 데 기여하고 있습니다."
 BA_sensei_festival_management: "축제 관리 위원회"
 BA_sensei_festival_management_desc: "백귀야행 마츠리 위원회의 합류로, 국가의 모든 축제는 이제 하나의 예술 작품이 되었습니다. 그들의 완벽한 기획력은 국민들을 하나로 묶고, 사회에 활력을 불어넣고 있습니다."
 BA_sensei_redwinter_guidance: "붉은겨울의 인민 지도"
 BA_sensei_redwinter_guidance_desc: "붉은겨울 연방학원의 학생들은 국민들의 마음속에 혁명의 불씨를 지폈습니다. 그들의 열정적인 지도는 사회 정의에 대한 열망을 불러일으키고, 국가를 위한 헌신을 이끌어내고 있습니다."
 BA_sensei_arius_governance: "아리우스식 통치"
 BA_sensei_arius_governance_desc: "아리우스 스쿼드의 방식은 위험하지만, 그 효율성만큼은 부정할 수 없습니다. 목적을 위해서라면 수단을 가리지 않는 그들의 방식은, 때로는 가장 빠른 문제 해결 방법이 되기도 합니다."
 BA_sensei_game_project: "국가적 게임 프로젝트"
 BA_sensei_game_project_desc: "밀레니엄 게임개발부와 함께하는 '선생님 시뮬레이터' 프로젝트는 단순한 게임 개발을 넘어, 국가의 소프트파워를 강화하는 중요한 사업이 되었습니다. 이 게임은 전 세계에 우리의 위대함을 알리는 최고의 홍보 수단이 될 것입니다."
 BA_sensei_abydos_prospecting: "아비도스식 자원 탐사"
 BA_sensei_abydos_prospecting_desc: "아비도스 학생들의 직감과 끈기는, 이제 국가의 숨겨진 자원을 찾아내는 가장 강력한 무기가 되었습니다. 그들의 무모해 보이는 탐사는, 종종 기적과 같은 발견으로 이어지고 있습니다."
 BA_sensei_justice_task_force: "정의실현부의 지원"
 BA_sensei_justice_task_force_desc: "트리니티 정의실현부의 합류로, 우리 사회의 정의는 한층 더 굳건해졌습니다. 그들의 타협 없는 정의감은 부정부패를 뿌리 뽑고, 모든 국민이 법 앞에서 평등한 사회를 만드는 데 기여하고 있습니다."
 BA_sensei_veritas_analysis: "베리타스의 데이터 분석"
 BA_sensei_veritas_analysis_desc: "밀레니엄 베리타스의 데이터 분석 능력은, 이제 국가 운영의 핵심적인 부분이 되었습니다. 그들의 정확한 예측과 통찰력은, 우리가 항상 최선의 결정을 내릴 수 있도록 돕고 있습니다."
 BA_sensei_gsc_audit: "총학생회 감사"
 BA_sensei_gsc_audit_desc: "총학생회의 정기 감사는 고통스럽지만, 국가 시스템을 한 단계 발전시키는 계기가 됩니다. 그들의 엄격한 기준을 통과하기 위한 노력은, 우리 행정 시스템의 투명성과 효율성을 높이는 데 기여하고 있습니다."
 BA_sensei_millennium_deep_collab: "밀레니엄과의 심화 협력"
 BA_sensei_millennium_deep_collab_desc: "밀레니엄과의 협력은 이제 새로운 단계로 접어들었습니다. 양자 컴퓨터와 AI 기술의 도입은 국가의 모든 산업과 과학 기술을 혁신하고 있으며, 우리는 기술적 특이점을 향해 나아가고 있습니다."
 BA_sensei_srt_distrust: "SRT의 불신"
 BA_sensei_srt_distrust_desc: "우리의 신중한 태도는 SRT 특수학원에게 불신을 안겨주었습니다. 그들은 우리의 결단력 부족을 우려하고 있으며, 이로 인해 안보 협력에 미묘한 균열이 생기기 시작했습니다."
 BA_sensei_hyakkiyako_overreach: "백귀야행의 과욕"
 BA_sensei_hyakkiyako_overreach_desc: "백귀야행의 축제는 이제 도를 넘어서고 있습니다. 과도한 축제 예산과 행정력 낭비는 국가 재정에 부담을 주고 있으며, 국민들 사이에서도 피로감이 쌓여가고 있습니다."
 BA_sensei_gehenna_integration: "게헨나와의 완전 통합"
 BA_sensei_gehenna_integration_desc: "게헨나 학원과의 완전 통합은 국가에 엄청난 힘을 가져다주었습니다. 그들의 실행력과 전투력은 이제 온전히 우리의 것이 되었으며, 그 어떤 위협도 두렵지 않습니다."
 BA_sensei_abydos_desperation: "아비도스의 절박함"
 BA_sensei_abydos_desperation_desc: "아비도스 학생들의 절박한 상황을 외면한 대가는 혹독했습니다. 그들의 희망이 꺾이면서, 국민들의 사기와 국가에 대한 신뢰도 함께 무너져 내리고 있습니다."