l_english:

# News Events #
 BA_news.1.t:0 "GSC President's Disappearance Exposed"
 BA_news.1.desc:0 "Approximately one month ago, the President of the General Student Council vanished. The exposure of her disappearance during a Kronos School afternoon bulletin has sent shockwaves through the public, especially as it was revealed the Council had been systematically covering it up for over a month.\n\nImmediately following the broadcast, Chief Executive Rin Nanagami held a press conference confirming the President's missing status and announcing that she would assume the role of Acting President. Experts predict this will completely neutralize the President's ongoing efforts to exert control over the various academies since the Great Transfer."
 BA_news.1.a:0 "It was inevitable."
 BA_news.1.b:0 "Orders confirmed."
 BA_news.1.c:0 "Wait, what?"
 BA_news.1.d:0 "That place seems to be in chaos."
 
 BA_news.2.t:0 "SCHALE Merges with the General Student Council!"
 BA_news.2.desc:0 "Shocking news arrived today: 'SCHALE,' the Federal Investigation Club created by order of the Student Council President, has merged with the General Student Council. An advanced AI within the Shittim Chest known as 'Arona' became active for unknown reasons and began taking control of SCHALE. Ultimately, unable to withstand the threats of internal strife and division, the General Student Council decided to merge with the Arona-led SCHALE. At the ceremony, Arona conducted proceedings via voice only, and Rin Nanagami announced that 'from this moment on, SCHALE shall speak for the General Student Council.'"
 BA_news.2.a:0 "Mission accomplished!"
 BA_news.2.b:0 "Threatening indeed."
 BA_news.2.c:0 "A confusing situation."
 BA_news.2.d:0 "Sanctum... what?"
 
 BA_news.3.t:0 "Trinity Stained in Darkness"
 BA_news.3.desc:0 "Shocking news has arrived today. Misono Mika has effectively seized control of Trinity by granting the Paternus faction exclusive authority over the Tea Party. This news has sent shockwaves throughout Kivotos, raising fears of Trinity's downfall. Following the Great Transfer, the machinations of the 'National Socialists' and the 'Paternus Faction' to install Mika as the Tea Party Host have finally succeeded.\n\nTrinity Student Council President Misono Mika has shown a clear intent to radicalize the academy, frequently using hostile rhetoric against Gehenna. While something is clearly happening within Trinity, entry and hospitalization are strictly controlled, leaving the internal situation a mystery."
 BA_news.3.a:0 "A new dawn for Trinity rises."
 BA_news.3.b:0 "Darkness falls upon us."
 BA_news.3.c:0 "We must be prepared."
 BA_news.3.d:0 "The veil has been lifted."

 BA_news.4.t:0 "Trinity Commences War"
 BA_news.4.desc:0 "The endless tension between the two academies has finally exploded. A full-scale war has broken out on the border—a region long called the 'Powderkeg of Kivotos' due to frequent military skirmishes—following a surprise attack by Trinity. While Gehenna forces are currently retreating from the ambush, they are leading troops to the border to reorganize and deploy defensive strategies.\n\nAs the powderkeg ignites, all of Kivotos watches Gehenna and Trinity with bated breath."
 BA_news.4.a:0 "All forces, charge!"
 BA_news.4.b:0 "Resistance!"
 BA_news.4.c:0 "Confirmed."

 BA_news.5.t:0 "Trinity Victory Parade"
 BA_news.5.desc:0 "Yesterday, just days after the surrender of Gehenna Academy, the Trinity army held a massive victory parade in Gehenna's Central District. The event was designed to commemorate Trinity's decisive victory and flaunt their military prowess. A large array of Trinity's latest military hardware was on display, alongside weapons captured from Gehenna to demonstrate the scale of the triumph.\n\nMisono Mika declared this a 'Great Victory,' though some observers expressed concern over how such a provocative display might affect regional stability. With all eyes on Trinity's next move and the reaction of Gehenna's remnants, the future remains uncertain."
 BA_news.5.a:0 "Hail Trinity!"
 BA_news.5.b:0 "The end of a long ill-fated history."

 BA_news.6.t:0 "British Government Flees to Canada"
 BA_news.6.desc:0 "Defeated after the war with [KAI.GetName], the British government has decided to flee to Canada. Huge aircraft carrying British politicians and the King headed for Canada this evening.\n\nLondon fell to the strangers who appeared out of nowhere, leading to a swift collapse, but thanks to a rapid retreat, the Royal Family and some portion of the military were preserved. Scientists worldwide are analyzing why this phenomenon occurred."
 BA_news.6.a:0 "We shall return."
 BA_news.6.b:0 "A great victory."
 BA_news.6.c:0 "Shocking."
 BA_news.6.e:0 "Ominous news."

 BA_news.7.t:0 "Declaration of the Union Act"
 BA_news.7.desc:0 "This morning, breaking the silence of dawn, [TRM.GetLeader] made a shocking announcement. In an official speech, she revealed a plan to assimilate Gehenna Academy into Trinity, aiming for a total unification of the two academies. This news came as a great shock to Trinity students, many of whom took to the streets immediately to express their discontent through protests.\n\nWhile the protests were temporarily quelled by the Justice Task Force, resentment regarding the announcement remains. Experts predict the assimilation policy will face extreme difficulties due to the recent war between the two schools."
 BA_news.7.a:0 "There is no more 'Gehenna.'"
 BA_news.7.b:0 "They want to mix oil and water."

 BA_news.8.t:0 "Trinity-Soviet War"
 BA_news.8.desc:0 "If one were to speak of a turning point in world history, it would be today. News that the Trinity Expeditionary Force is advancing toward the Soviet Union is being broadcast worldwide, prompting intelligence agencies across the globe to move in unison. In Soviet cities, youth are volunteering for enlistment, and the Red Army has completed preparations to meet the Trinity invaders.\n\nMilitary experts find it difficult to predict the outcome of this clash between giants. Regardless, this war will be a monumental turning point in human history."
 BA_news.8.a:0 "All forces, charge!"
 BA_news.8.b:0 "With patience and diligence, all obstacles can be overcome."
 BA_news.8.c:0 "The clash of two giants."

 BA_news.9.t:0 "One Kivotos"
 BA_news.9.desc:0 "Today, the Trinity Tea Party officially declared that Kivotos has been unified under Trinity, led by Mika, and that a United Kivotos will be established. In the streets of Eden, millions of people gathered in front of the Trinity main building, saluting or waving Trinity flags and shouting for joy.\n\nMisono Mika was officially appointed as the President of the Kivotos General Student Council today. In her inaugural address, she emphasized the alliance between Trinity and the other academies. However, the most enthusiastic response came when President Mika declared 'Trinity's total and final victory.'"
 BA_news.9.a:0 "At least for today, we should raise a toast."
 BA_news.9.b:0 "Confirmed"
 
 BA_news.10.t:0 "Declaration of the Kivotos Federation"
 BA_news.10.desc:0 "Today will be the most symbolic day in Kivotos history. The revolutionary ideals of [FROM.GetAdjective] have been declared to the world. [FROM.GetLeader], leader of the Kivotos 'Federation,' declared communist ideals and merged the great academies after winning the General Student Council civil war. Standing atop the ruins of the collapsed schools, the vision for the Kivotos Federation was clearly drawn.\n\nCurrently, the people of the Kivotos Federation bow their heads solemnly toward the capital of [FROM.GetAdjective]. In their eyes, one can read a firm belief that the Kivotos Federation is marching toward our ideals at the forefront of the revolution. From now on, the people of the Federation will cherish the ideals of the Kivotos revolution forever."
 BA_news.10.a:0 "Forward toward the revolution!"
 BA_news.10.b:0 "Oh."
 BA_news.10.c:0 "Interesting."

 BA_news.11.t:0 "Italian Entry into the Mediterranean Pearl"
 BA_news.11.desc:0 "A few days after Britain surrendered to Kaiser Corporation, Italian forces moved into Malta and Cyprus. They claimed the occupation was a move to protect human territory from the strangers, but in reality, it appears to be an action to seize the Mediterranean hegemony left behind by the collapsed British Empire.\n\nBritain has strongly condemned this undeclared territorial incursion as an act against the international community and a choice driven by pure irredentism rather than humanity."
 BA_news.11.a:0 "A great victory!"
 BA_news.11.b:0 "Britain has no other choice."
 BA_news.11.c:0 "We will not back down!"

 BA_news.12.t:0 "Yurizono Seia Attacked"
 BA_news.12.desc:0 "News has broken that Yurizono Seia, the 'Reformer' elected by the Tea Party, was attacked at her home. An emergency meeting has been convened by the Tea Party, and it is expected to take a long time for the Sanctus, Filius, and Paternus factions to elect the next Host.\n\nWhen the Remedial Knights arrived at the scene, the culprit had already fled. It was officially announced that Yurizono Seia is currently unconscious and undergoing hospital treatment. The Justice Task Force has declared they will never let the assailant who attacked the Host go unpunished."
 BA_news.12.a:0 "Find the culprit!"
 BA_news.12.c:0 "They will be in chaos."

 BA_news.13.t:0 "Confusion in Millennium"
 BA_news.13.desc:0 "Shocking news from Millennium is echoing across Kivotos. In an attempt to deal with the Ruins—one of Millennium's greatest headaches—Seminar conducted an artillery bombardment, but in doing so, an indescribable terror has been awakened from its deep slumber.\n\nAL-1S quickly assessed the situation and initiated an artillery duel with Seminar. It is reported that one of the Seminar executives went missing during the process. Along with this, another darkness has descended upon Kivotos."
 BA_news.13.a:0 "The Princess."

 BA_news.14.t:0 "Japan Reveals Ambitions"
 BA_news.14.desc:0 "As the mysterious forces known as Kivotos landed in Europe, setting the continent ablaze, the Empire of Japan took the opportunity to conquer Pacific islands and seize the settlements and leased territories held by Western powers. The Empire of Japan is heavily propagandizing this as a victory for the Greater East Asia Co-Prosperity Sphere over the West.\n\nThe Republic of China government has filed a major protest, and the United States has also issued a stern warning through the Japanese ambassador."
 BA_news.14.a:0 "Tenno Heika Banzai!"
 BA_news.14.b:0 "They ignore the warnings!"
 BA_news.14.c:0 "Confirmed."

 BA_news.15.t:0 "The Falling Dominoes"
 BA_news.15.desc:0 "At 11:00 AM today, everyone reported suffering from a mysterious headache. While the world was in chaos over this unknown phenomenon, the color of the sky darkened briefly, and reports poured in from the Northern Hemisphere of mysterious pillars of light being observed.\n\nExperts worldwide suspect this situation is similar to the landing of the mysterious 'Kivotos' group in Europe a year ago. A person claiming to be a US intelligence agent is sparking controversy by asserting, 'This situation is a conspiracy of extraterrestrial forces.'"
 BA_news.15.a:0 "Let there be light."

 BA_news.16.t:0 "Civil War Breaks Out in Gehenna"
 BA_news.16.desc:0 "Today, news of a large-scale military clash between the Prefect Team and Pandemonium Society in Gehenna has shocked all of Kivotos. The Prefect Team seeks to oust the Wehrmacht and Pandemonium Society to restore order and safety, while Pandemonium Society claims the Prefect Team committed treasonous acts toward Trinity. The Gehenna Civil War has begun as both sides fight for their own justifications.\n\nThe clash between Pandemonium Society and the Prefect Team has already started, and the winner is impossible to predict. Whoever wins, only ruins will remain."
 BA_news.16.a:0 "Hail Prefect Hina!"
 BA_news.16.b:0 "Soldiers of Pandemonium Society!"
 BA_news.16.c:0 "Our enemies are divided." 
 BA_news.16.d:0 "A civil war?"

 BA_news.17.t:0 "Collapse of Trinity"
 BA_news.17.desc:0 "Official news has reached the public that Trinity, boasting hundreds of years of history, has collapsed, causing a massive shock."
 BA_news.17.a:0 "O Ancestors..."
 BA_news.17.b:0 "Good riddance."
 BA_news.17.c:0 "I express my regrets."
 BA_news.17.d:0 "The threat has diminished."

 BA_news.18.t:0 "Light of the Chroma"
 BA_news.18.desc:0 "In an instant, every living creature on the planet let out a horrific scream, filling everyone with intense dread. The psychic wave that caused this phenomenon vanished after a few seconds, but we all remember that moment.\n\nAfter the wave passed, everyone turned to look north in unison. It is reminiscent of the pillars of light seen in the Northern Hemisphere weeks ago. Governments worldwide are struggling with an explosion of emergency calls, and a new religion worshipping the light has even been founded."
 BA_news.18.a:0 "The eye watching the planet."

 BA_news.19.t:0 "Indian Revolution"
 BA_news.19.d:0 "The revolution and war for independence have begun in earnest in India as socialists of [429.GetName] declared the 'Council of Bharat.' Countless people have taken to the streets armed to stand against the rule of colonial authorities. They are fighting for their lives to break free from long-standing oppression, and the wave of resistance is growing stronger across India.\n\nMeanwhile, the British government has yet to release an official statement. Still reeling from the war with [KAI.GetName] and the loss of the mainland, the revolution in India has plunged Britain further into chaos. The news of the revolution is a heavy burden for Britain, and how the situation will unfold remains uncertain."
 BA_news.19.a:0 "The Indians seem to desperately desire independence."

 BA_news.20.t:0 "Liechtenstein Occupied"
 BA_news.20.d:0 "The Principality of Liechtenstein was a nation that survived even the catastrophe of the Great Transfer, but as of last night, it no longer exists following a military operation by the [FROM.GetName] government.\n\nAside from minor skirmishes with the stationed Swiss forces, the occupation was relatively peaceful. Switzerland issued a statement condemning the event as an infringement on the independence of Bern and Liechtenstein, but it seems to have had little effect."
 BA_news.20.a:0 "Another form of hegemonism."
 BA_news.20.b:0 "All actions are based on strategic necessity."

 BA_news.21.t:0 "French War of Reclamation"
 BA_news.21.d:0 "Early this morning, the French Navy opened fire, plunging France and Millennium into a state of war. Years ago, France was defeated in battle against Millennium and was forced into exile in Africa. However, the government-in-exile did not give up and sharpened their blades for revenge in Africa.\n\nBeginning with the naval bombardment, France's reclamation operation has commenced, and French citizens everywhere are rising up against Millennium's rule. Whether France can successfully deliver its revenge remains to be seen."
 BA_news.21.a:0 "Advance, French Army!"
 BA_news.21.b:0 "Can the French really reclaim their home?"

 BA_news.22.t:0 "Massacre Committed in [FROM.FROM.GetName]"
 BA_news.22.desc:0 "Breaking news: Shortly after a group calling themselves [FROM.GetName] occupied the former Millennium Science School, a catastrophic massacre has taken place in [FROM.FROM.GetName]. Reports indicate they are killing all humans or subjecting them to a 'resocialization' process, filling the void with metallic machinery.\n\nIn response to this, the world is preparing for war against [FROM.GetName], and world leaders are calling for war, declaring they cannot be defeated by mad machines."
 BA_news.22.a:0 "Order complete"
 BA_news.22.b:0 "Truly... horrific."

 BA_news.23.t:0 "Coup in Canada"
 BA_news.23.desc:0 "Exiles who arrived in Canada have ousted the Canadian government and staged a coup to establish a new government centered around Edward."
 BA_news.23.b:0 "The influence of the Great Transfer has reached even the Americas."
 BA_news.23.a:0 "The situation in Canada is bleak."
 
 BA_news.24.t:0 "Ark of Atrahasis"
 BA_news.24.desc:0 "A mysterious structure has been identified at Atrahasis, the former Millennium Academy. It appears to be related to AL-1S, the one responsible for the collapse of Millennium Science School, and the purpose of this building remains unknown."
 BA_news.24.a:0 "The Ark."
 
 BA_news.25.t:0 "Collapse of Millennium Science School"
 BA_news.25.desc:0 "The unthinkable has happened. While all communication lines with Millennium Science School had been cut for days, with very little information leaking out, a messenger claiming to have been sent by C&C leader Mikamo Neru has reached us. The message states that Millennium Science School has collapsed due to a mechanical legion commanded by a mysterious individual named AL-1S, and C&C is putting up only minor resistance.\n\nThe Millennium Science School we knew no longer exists. In its place stands the faction calling themselves 'Atrahasis.'"
 BA_news.25.a:0 "Information has leaked."
 BA_news.25.b:0 "Something impossible has happened."

 BA_news.26.t:0 "Success of the Indian Revolution"
 BA_news.26.d:0 "The British Empire, having lost the British Isles, was nothing more than a toothless tiger. The Indian Independence War, which broke out in the southwest in opposition to British rule, has ended in victory for the revolutionary forces with the capture of Delhi following a rapid advance.\n\nWith the victory of the revolutionary forces, the British Empire has lost its influence over India, and the revolutionary government has announced it will convene a council in the near future to determine the fate of Bharat."
 BA_news.26.a:0 "A great victory against imperialism!"
 BA_news.26.b:0 "The British Empire has lost its power."
 BA_news.26.c:0 "We are powerless."

 BA_news.27.t:0 "Millennium Science School Launches Satellite"
 BA_news.27.d:0 "Shocking news was announced from Millennium Science School. According to them, after several attempts, they have successfully launched a satellite into space, and plans for additional satellite launches have already been established.\n\nWorld leaders quickly held press conferences to announce their stance on the satellite launched by Millennium, and sightings of something ascending into the sky have been reported in countries surrounding the academy."
 BA_news.27.a:0 "Mission complete"
 BA_news.27.b:0 "Their technology far exceeds our own."

 BA_news.28.t:0 "Collapse of the Stresa Front"
 BA_news.28.d:0 "The Stresa Front security treaty, established with the aim of opposing Kivotos, has collapsed as one nation withdrew from the front.\n\nThe Italian Foreign Minister expressed regret over the situation, and the collapse of the Stresa Front appears imminent."
 BA_news.28.a:0 "Regrettable."
 BA_news.28.b:0 "Is Europe finally falling?"

 BA_news.29.t:0 "Suspension of the French Parliament"
 BA_news.29.d:0 "Following the reclamation of the French mainland, Pétain, who had styled himself the leader of the war cabinet, announced the suspension of the French Parliament today. With no official statement from Pétain since the announcement, the decision was implemented immediately.\n\nMembers of Parliament attempted to enter the building in protest but were immediately stopped by the Gendarmerie. As Pétain's authoritarian measures are implemented nationwide, many experts say democracy has effectively been given a death sentence.\n\nWith the collapse of French democracy at hand, it does not seem likely that the French people will easily comply with Pétain's authoritarian rule..."
 BA_news.29.a:0 "The Marshal leads us."
 BA_news.29.b:0 "The greed of an old Marshal."

 BA_news.30.t:0 "The Fourth International"
 BA_news.30.d_1:0 "Many envoys from communist organizations around the world gathered in Cherinograd today for a conference. With Renka and Cherino, supporters of Trotskyist theory, leading the way, the foundations of the Fourth International have been laid.\n\nHowever, it remains unclear what impact this effort will have on the international political stage, and the news has fueled Stalin's jealousy. He suspects many in the upper echelons of the party and military of supporting Trotsky and has noted that most of them are still alive. His paranoia is back in full force, and Stalin has secluded himself in his home. His distrust and instability could cause a crisis for the Soviet regime, potentially throwing the USSR into civil war."
 BA_news.30.a:0 "Just how many Internationals are there?"
 BA_news.30.b:0 "Applause for our new comrades!"
 BA_news.30.c:0 "Trotskyists..."
 BA_news.30.d:0 "A new future for communism?"

 BA_news.31.t:0 "Kaiser Corporation Plunged into Civil War"
 BA_news.31.d:0 "A sudden coup led by key figures on the Board of Directors has plunged Kaiser Corporation into civil war this morning. The President's faction, those hired by the Board, and company employees have all begun to take up arms against their former compatriots, and the military has withdrawn from the borders to guard against the internal crisis.\n\nThe President has stated that he would rather destroy the entire company than see it fall into the hands of 'traitors.'"
 BA_news.31.a:0 "There is no turning back now."
 BA_news.31.b:0 "A civil war in a company?"

 BA_news.32.t: "Restoration of the Habsburgs"
 BA_news.32.desc: "Truly, no one could have predicted this. Otto von Habsburg's efforts to regain the Austrian throne have finally succeeded, and he has begun to officially align with Abydos, while rumors spread of restoring the Austro-Hungarian Dual Monarchy. Amid enthusiastic cheers from the crowd, he was acclaimed as King at the Hofburg in Vienna.\n\nDuring his coronation speech, he repeatedly expressed his gratitude for Abydos's dedication and courtesy. He declared his intent to reunify the Habsburg lands and swore never to turn a blind eye to Abydos."
 BA_news.32.a: "Banzai!"
 BA_news.32.b: "Completely insane"
 BA_news.32.c: "Is the Empire rising again?"

 BA_news.33.t: "Return of the Mongol Empire"
 BA_news.33.desc: "Terror has returned once more. Descendants of the Great Mongol Empire, which once ruled the Eurasian continent, have appeared. Mongolia's aggressive expansionist policy has succeeded. They have secured territories from neighboring countries and, through negotiations with the Soviet Union, acquired Buryatia, Chita, and Bodaibo."
 BA_news.33.a: "Banzai!"
 BA_news.33.b: "Terror has returned"

 BA_news.34.t: "Discovery of Nuclear Fission"
 BA_news.34.d: "Uranium experiments conducted by Otto Hahn and Fritz Strassmann at the Trinity Chemistry Research Institute are astonishing the scientific community. In an experiment where neutrons were collided with uranium, the creation of barium—a lighter element—was confirmed, contrary to expectations.\n\nThis discovery was a phenomenon that could not be explained by existing scientific theories, and the two scientists proposed the hypothesis that the nucleus splits. While the experimental results were chemically precise, the physical explanation remains unclear.\n\nThis experiment, which raised the possibility of nuclear fission, is receiving intense attention from the scientific community. The released energy and its potential applications are expected to have scientific and social ripple effects."
 BA_news.34.a: "A marvelous discovery!"
 BA_news.34.b: "This will cause great waves."

 BA_news.35.t:0 "$FRA_prov_event.71.t$"
 BA_news.35.d:0 "$FRA_prov_event.71.d$"
 FRA_prov_event.38.t:0 "The Return of France"
 FRA_prov_event.38.d:0 "France has returned; the impossible has been realized. The final war and reclamation of the mainland advocated by [FRA.getLeader] in Algeria have finally been achieved, and French citizens are cheering at their final victory. Having triumphed in a fight against much more advanced war machines and halo-wearing superhumans, France is restoring its administrative system and preparing for reconstruction and recovery."
 FRA_prov_event.38.a:0 "Vive la France!"
 FRA_prov_event.38.b:0 "The old order has returned."
 FRA_prov_event.39.t:0 "Liberation of Marseille"
 FRA_prov_event.39.d:0 "From the port of Marseille to the city center, Millennium forces resisted, but finally, the Tricolour was hoisted over city hall, signaling the liberation of the city overlooking the Atlantic.\n\nMany Frenchmen joined the Resistance upon hearing that Marseille had been liberated, and it remains to be seen if Millennium can control this resistance movement."
 FRA_prov_event.39.a:0 "This is just the beginning."
 FRA_prov_event.39.b:0 "The situation is becoming serious."
 FRA_prov_event.40.t:0 "Liberation of Bordeaux"
 FRA_prov_event.40.d:0 "From the port of Bordeaux to the city center, Millennium forces resisted, but finally, the Tricolour was hoisted over city hall, signaling the liberation of the city overlooking the Atlantic.\n\nMany Frenchmen joined the Resistance upon hearing that Bordeaux had been liberated, and it remains to be seen if Millennium can control this resistance movement."
 FRA_prov_event.41.t:0 "Liberation of Orléans"
 FRA_prov_event.41.d:0 "The French government reported that Orléans, a central French city, was liberated around 5 PM today. Since Orléans and Paris are only about 100km apart, many are predicting a French victory in the war."
 FRA_prov_event.41.a:0 "The end is in sight!"
 FRA_prov_event.41.b:0 "Defend Millennium Tower!"
 FRA_prov_event.44.t: "North African General Strike"
 FRA_prov_event.44.d: " Although not widely known due to media censorship, small-scale tenant and labor disputes have been ongoing in North Africa since the early 30s. These various disputes ignited fiercely after the shooting at the Constantine Metallurgical Plant.\n The incident began when 400 workers occupied and protested at the factory to demand three months of unpaid wages. French colonial authorities mobilized the Gendarmerie to violently suppress them and besieged the factory. Workers modified tools in the factory into weapons to face the Gendarmerie, and the government's firing to end the standoff resulted in 21 deaths.\n The largest general strike in African history, organized by the 'North African People's Party' and the 'Algerian Branch of the General Confederation of Labour,' is intensifying into an anti-imperialist political struggle. Currently, all industrial facilities in [FRA.getname] are in a state of near paralysis."
 FRA_prov_event.44.a: "Damn it!"
 FRA_prov_event.44.b: "The true face of colonial exploitation."
 FRA_prov_event.46.t: "Indochina in the Vortex"
 FRA_prov_event.46.d: "An uprising has occurred in French Indochina, led by [FROM.getrulingparty] under [FROM.getleader]. The insurgents of [FROM.getname] captured the [FROM.capital.GetCapitalVictoryPointName] city hall within a day, lighting the torch of revolution, and as surrounding areas join the uprising, the situation is becoming increasingly grave. In response, the [FRA.getname] government is attempting military intervention across all of French Indochina."
 FRA_prov_event.46.a: "How long can they hold out?"
 FRA_prov_event.46.b: "French imperialism is crumbling."

 FRA_prov_event.71.t:0 "Halifax Conference"
 FRA_prov_event.71.d:0 "After the British leadership went into exile in Canada, French representatives visited the Canadian city of Halifax for several days of meetings. They confirmed that both nations hold the reclamation of their home territories as a common goal and discussed various large and small cooperative efforts."
 FRA_prov_event.71.a:0 "It's the first step to going home."
 FRA_prov_event.71.b:0 "We are in similar positions."
 FRA_prov_event.76.t:0 "Collapse of France"
 FRA_prov_event.76.d:0 "The oppressors who were biding their time in West Africa have been toppled by revolution. Just as they once overthrew their own monarchy, the arrow has returned to strike them.\n\nCurrently, Africa has fallen into anarchy with numerous warlords rampant, and public order has collapsed as Frenchmen in the streets are being mobbed by colonial subjects. Regardless, the French Colonial Empire will be the first empire to be destroyed by its own subjects."
 FRA_prov_event.76.a:0 "Oh, dear."

 BA_news.36.t: "Tea Party Devastated"
 BA_news.36.d: "Today, a hypersonic missile targeted and struck the Trinity leadership. Trinity's command structure was instantly jeopardized. The Tea Party leadership barely survived and is struggling to manage the situation.\n\nTrinity leader [TRM.GetLeader], who was severely injured in the air raid, appeared in a precarious state and declared a firm retaliation against the heretics of Arius Satellite School."
 BA_news.36.a: "Good heavens."

 BA_news.37.t:0 "Third Soviet-Polish War"
 BA_news.37.d:0 "The long-standing conflict between the two nations has manifested as war once again in this new era. In an unexpected development, the Third Polish-Soviet War broke out this morning when a final declaration of war from Warsaw was sent to Moscow. The Polish ambassador firmly stated that this war would be their final conflict with [SOV.GetName], and as long as Poland's allies stand together, there is no room for doubt regarding victory. Sporadic skirmishes have already broken out in Lwów and Białystok, and the future of Eastern Europe is uncertain."
 BA_news.37.a:0 "Can Russia win this time too?"
 BA_news.37.b:0 "Let's sweep away the evil empire!"
 BA_news.37.c:0 "Make them remember 1921."

 BA_news.38.t:0 "Resignation of Tsukatsuki Rio"
 BA_news.38.d:0 "Former Student Council President Tsukatsuki Rio, who stepped down as Seminar President due to recent political changes in [MIL.GetName], has announced she will withdraw from all political power. It is presumed that pressure from Seminar played a major role, and Rio's whereabouts could not be determined thereafter.\n\nAs this political shift occurred in Millennium, the hegemonic power of Kivotos, it is receiving worldwide attention, and people are waiting for follow-up announcements from the new President."
 BA_news.38.a:0 "The result I wanted."
 BA_news.38.b:0 "A quite complex political structure."

 BA_news.39.t:0 "Trial of Tsukatsuki Rio"
 BA_news.39.d:0 "The trial of Tsukatsuki Rio, former Millennium Student Council President and Seminar President, was broadcast today by Millennium Center. Even when unfavorable testimony was presented during the trial, Tsukatsuki Rio did not say a single word, and the trial ended without major incident.\n\nThis trial appears to be a process to strengthen the power of the new Seminar President [MIL.GetLeader], and this objective seems to have been successfully achieved."
 BA_news.39.df:0 "The trial of Tsukatsuki Rio, former Millennium Student Council President and Seminar President, was broadcast today by Millennium Center. Despite the trial being biased, Tsukatsuki Rio succeeded in turning the situation around with her considerable eloquence, causing the trial to end abruptly.\n\nThis trial appears to be a process to strengthen the power of the new Seminar President [MIL.GetLeader], but it is estimated to have been unsuccessful. Since the trial was being broadcast to all of Millennium, it is expected that she will face significant political difficulties."
 BA_news.39.a:0 "She is now a criminal."
 BA_news.39.b:0 "She really is extraordinary."
 BA_news.39.c:0 "Interesting."

 BA_news.40.t: "Britain's Declaration of Isolation for the British Isles"
 BA_news.40.d: "Shocking news has arrived from Britain. The British government has officially admitted that its forces were completely defeated by unknown aliens. King George V reportedly remained in Britain until the end to command the army but was ultimately killed in action.\nIn response, the British Royal Family officially announced the 'British Isles Isolation Policy.' While there has been much debate over this policy, the consensus is that they have no other viable options following the defeat of their military."
 BA_news.40.a:0 "We will surely take it back."
 BA_news.40.b:0 "Our citizens must still be there!"
 BA_news.40.c:0 "The losers are struggling."

 BA_news.41.t: "Defeat of Trinity"
 BA_news.41.d: "Under the offensive of [SOV.Getname], Eden has been captured and Trinity has surrendered. Misono Mika and her followers have vanished. Utazumi Sakurako of the Sisterhood and Hanekawa Hasumi of the Justice Task Force, representing pillars of the government, personally signed the instrument of surrender, officially ending the war.\n\nThe Red Army hoisted the flag of [SOV.Getname] over the Eden Parliament building, signaling the complete downfall of Trinity."
 BA_news.41.a:0 "Glory to the people!"
 BA_news.41.b:0 "The evil empire has fallen."
 BA_news.41.c:0 "..."

 BA_news.42.t:0 "Fortress City Eridu Reactivated"
 BA_news.42.d:0 "News has arrived that the Fortress City Eridu, which displayed powerful majesty during the previous Franco-Millennium War before finally falling to the last French general offensive, has begun reactivation.\n\nWhile there has been no official announcement from Millennium Science School, various circumstances suggest the fortress city has been fully repaired. However, due to the gap in local technology, it is not expected to be as powerful as before."
 BA_news.42.a:0 "The world's strongest fortress begins operation again."

 BA_news.43.t:0 "Dissolution of the Allies"
 BA_news.43.d:0 "Today, Britain officially announced the dissolution of the Allies. The British government stated the reason for the dissolution as: \"The Allies were fundamentally created to oppose the Axis; now that the Axis is gone, the Allies are no longer necessary for us.\" Existing member states are expressing negative views on Britain's move, but Britain remains silent."
 BA_news.43.a:0 "What about the aliens?"

 BA_news.44.t:0 "Political Violence Escalates into Civil War"
 BA_news.44.d:0 "Violence between the Blackshirts, communists, and anti-socialist protesters has worsened recently following marches. However, this violence was not contained. Like a spark, it ignited the increasingly tense situation in our nation over the past few months.\n\nMilitias have begun clashing across the country, seizing cities, towns, and regions, forcing the military to choose its loyalty. While the federal dominions and the navy still fully support what they call the 'rightful' democratic government, the military's situation is less clear, and many units have joined our cause.\n\nAs frontlines begin to form, Oswald Mosley announced the establishment of a Provisional Crisis Government under his leadership. This government will handle essentials until the civil war ends."
 BA_news.44.a:0 "The future of the motherland is at stake!"

 BA_news.45.t:0 "End of the British Civil War"
 BA_news.45.d:0 "A lack of public support has led the democratic regime to recognize our victory and seek peace rather than continue a hopeless civil war in the colonies. Following this decision, the Royal Navy has once again come under our control.\n\nHowever, the dominions have clearly expressed they have no intention of following a non-democratic government and instead intend to continue existing as independent members of the Commonwealth."
 BA_news.45.a:0 "Let us begin reconstruction."
 
 BA_news.46.t:0 "Second Council of Eden"
 BA_news.46.d:0 "Immediately following the total victory in the previous war by Arius Satellite School—which had been in conflict with Trinity Comprehensive Academy since before the Great Transfer—the Second Council of Eden began. All constituent factions of Trinity Comprehensive Academy, except for the Arius faction, have been banned.\n\nKivotos experts believe this is an act of revenge for the expulsion of the Arius faction during the previous Council."
 BA_news.46.a:0 "Revenge for that day"
 BA_news.46.b:0 "Good grief"
 BA_news.46.c:0 "Understood"

 BA_news.47.t:0 "Pétain Ousted"
 BA_news.47.d:0 "The general strike of colonial subjects lasting tens of days and the growing scale of rallies brought the French government-in-exile to the brink of paralysis. Pétain, who had secured leadership of the government-in-exile through a 1935 coup, was forced to admit his policy failures. Consequently, Philippe Pétain has lost all influence over the government-in-exile. Members of Parliament, including Pierre Laval, and anti-military forces succeeded in ousting Pétain from Algiers by removing him from his rank as Marshal."
 BA_news.47.a:0 "Forward to a democratic government!"
 BA_news.47.b:0 "France still seems unable to manage its crisis."

 BA_news.48.t:0 "Rise of the East African Federation"
 BA_news.48.d:0 "With the United Kingdom's withdrawal from Britain by the 'Others' in '36, the hegemony maintained by Britain—the 'Pax Britannica'—is being torn apart and burned. As a result of this historical tide, Kenya, Uganda, and Tanzania could not ignore the 'East African Federation' theory, which is widely supported by their intellectual class. These newly independent East African nations felt the need to prepare for re-invasion by imperialist powers, and having watched Ethiopia stand alone against Italy without outside help to the north, this political theory quickly gained public support. After long consultations, the three nations have finally decided to realize the Federation."
 BA_news.48.a:0 "The era of imperialism is ending."
 EAC_leader_name: "East African Federation Council"

 BA_news.49.t:0 "Rise of the Socialist Unity Party of Germany"
 BA_news.49.d:0 "Following the collapse of Trinity, the socialist-leaning German partisans announced the merger of the Communist Party of Germany and the Social Democratic Party of Germany at their first party congress. The Socialist Unity Party of Germany announced it would function as the sole socialist mass party, but it appears more like a unilateral merger by the Communist Party.\n\nMost Social Democratic Party members with right-wing leanings have been ousted from public office, and [KPD.GetName] will now be clearly regarded as a socialist state."
 BA_news.49.a:0 "Toward the victory of communism!"
 BA_news.49.b:0 "The international situation will become unstable."

 BA_news.50.t:0 "Berlin Pact Organization"
 BA_news.50.d:0 "The Union of Soviet Socialist Republics and [ROOT.GetName] have announced the creation of the Berlin Pact Organization as part of close military cooperation. Established under the pretext of responding to the unstable situation in Europe and global chaos, the Berlin Pact Organization will open a new era of close civilian, military, and intelligence cooperation."
 BA_news.50.a:0 "We shall be victorious!"
 BA_news.50.b:0 "An international threat."

 BA_news.51.t:0 "Hyakkiyako Civil War"
 BA_news.51.d:0 "News has arrived that a group calling themselves [FROM.GetName] has declared war on the academy government at Hyakkiyako Alliance Academy, escalating into a large-scale civil war. [FROM.GetName] claims that the system of Hyakkiyako Alliance Academy is flawed and that only [FROM.GetName] represents the true justice of Hyakkiyako.\n\nInternational media outlets are analyzing that Hyakkiyako's political structure has been unstable for some time, and such a system seems to have brought about the current chaos."
 BA_news.51.a:0 "Manage the chaos!"
 BA_news.51.b:0 "An interesting situation."

 BA_news.52.t:0 "Shiromi Iori Attacked!"
 BA_news.52.d:0 "UnforgivableUnforgivableUnforgivableUnforgivableUnforgivable...\n - Igusa Haruka\n\nShiromi Iori, a second-year specialist from the Gehenna Academy Prefect Team dispatched near the Abydos autonomous district, was severely injured in an attack involving a shotgun and a rifle butt.\n\nShiromi Iori was brutally ambushed by Igusa Haruka, a first-year from Problem Solver 68. Medical staff stated that Shiromi Iori suffered severe injuries and requires several months of rest.\n\nWith the Prefect Team specialist injured, a blow to the Prefect Team is expected."
 BA_news.52.a:0 "Confirmed."
 
 BA_news.53.t:0 "Problem Solver Seizes Power in Gehenna"
 BA_news.53.d:0 "The Pandemonium Society of Gehenna Academy has transferred power to Problem Solver 68.\n\nProblem Solver, having recently gained support from Gehenna students, threatened the Pandemonium Society's regime. Problem Solver CEO Rikuhachima Aru sent a telegram demanding the transfer of power, and shockingly, the Gehenna Student Council accepted it.\n\nThe Pandemonium Society regime, which reigned over Kivotos as one of the Big Three academies, has collapsed, and now Problem Solver will rise as a new star."
 BA_news.53.a:0 "Confirmed."
 
 BA_news.54.t:0 "Problem Solver Bombards Trinity"
 BA_news.54.d:0 "It has been confirmed that Problem Solver launched an intensive artillery bombardment on Trinity. Last night, amid sudden shouts, cannons located near the Trinity border fired in unison toward Trinity. The shells flew and burned several Trinity villages and towns, and it has been identified that quite a few casualties occurred.\n\nThis is identified as a clear provocation by Problem Solver and may lead to war.."
 BA_news.54.a:0 "Confirmed."
 
 BA_news.55.t:0 "Shibaseki Ramen Blown Up"
 BA_news.55.d:0 "It was announced that Abydos's famous Shibaseki Ramen was blown up by a Claymore mine. The cause is unclear, but Abydos stated it appears a first-year female student from Gehenna Academy planted the Claymore and detonated it by pressing something.\n\nAn explosion was detected about 10km from the Abydos campus, and Abydos seems to have noticed it. Shibaseki Ramen has vanished without a trace. Completely."
 BA_news.55.a:0 "Confirmed."
 
 BA_news.56.t:0 "Rikuhachima Aru Elected Gehenna Student Council President"
 BA_news.56.d:0 "Problem Solver has pacified Gehenna, and now Rikuhachima Aru can rightfully be called the Student Council President of Gehenna. The Student Council President of Gehenna is Rikuhachima Aru.\n\nThe Student Council President of Gehenna Academy, Rikuhachima Aru!"
 BA_news.56.a:0 "Confirmed."

 BA_news.57.t: "Coup in [RED.GetNameDef]"
 BA_news.57.desc: ""
 BA_news.57.a: "Oust Cherino!"
 BA_news.57.b: "Everything is going according to plan..."
 BA_news.57.c: "They finally did it."

 BA_news.58.t:0 "Establishment of the Czech Provisional Government"
 BA_news.58.d:0 "Today, a Czech Provisional Government was established in the Sudetenland. They declared they would reclaim all of Czechia in cooperation with a small academy called \"Abydos High School\" and strongly condemned Hyakkiyako Alliance Academy's oppression of Czechs. In response, Hyakkiyako Alliance Academy issued a statement criticizing the propaganda regarding territories they rightfully obtained.\nNations worldwide are focusing on this first cooperation between the two worlds, and seeing their attitude of accepting both locals and strangers, some experts predict this will be the starting signal for peace between the two worlds."
 BA_news.58.a:0 "What results will their cooperation bring?"

 BA_news.59.t:0 "Impossibility Theorem"
 BA_news.59.d:0 "A paper recently published in [MIL.GetName] has sent shockwaves through the world. Titled the 'Impossibility Theorem,' this paper is a long proof based on the premise that 'there can be no desirable and democratic preference system that can adequately evaluate the welfare level of a society.'\n\nIf the contents of the paper are accepted as truth, it means that the efficient, democratic, and rational social systems we vaguely thought of are impossible to exist, which will serve as a counterargument to significant ideologies.\n\nEconomists worldwide are engaged in heated debate over the paper, and in countries with dictatorial tendencies, protests have even begun using this paper as a justification."
 BA_news.59.a:0 "Paradise does not exist."
 BA_news.59.b:0 "Shocking."

 BA_news.60.t:0 "Tanga Ibuki Ascends the Throne"
 BA_news.60.d:0 "[FROM.GetLeader], who took power after a series of power struggles in Pandemonium Society, has ascended the throne amid enthusiastic support from Pandemonium executives and immediately proclaimed [FROM.GetName].\n\nAccording to them, [FROM.GetLeader] is now being accepted as the protector of all Gehenna and the leader of all Gehenna students. No one knows yet how this geopolitical change in Gehenna Academy will affect the international situation."
 BA_news.60.a:0 "For our Empress Majesty!"
 BA_news.60.b:0 "They are weird as expected."

 BA_news.61.t:0 "Public Safety Bureau Coup"
 BA_news.61.d:0 "A spokesperson for Valkyrie Police Academy announced in an emergency statement this morning that an interim meeting of the Public Safety Bureau decided to dismiss Public Safety Bureau Chief Ogata Kanna and transfer the powers of the Student Council to the Life Safety Bureau. The Public Safety Bureau flag was lowered from the Bureau Chief's residence, and the spokesperson also announced that the Public Safety Bureau Chief is currently under house arrest.\n\nMost political scientists have confirmed that the Administrative Committee has effectively lost control of Valkyrie and agree that the primary goal of this coup was to seize power over the Public Safety Bureau. At the same time, they are considering the possibility that the Belgians supported the relatively moderate Life Safety Bureau.\n\nThe General Student Council Administrative Committee has confirmed the Life Safety Bureau's coup but stated they respect Valkyrie's right to self-determination."
 BA_news.61.a:0 "I'm curious about Valkyrie's future!"

 BA_news.62.t:0 "Constantine Agreement"
 BA_news.62.d:0 "As international pressure mounted alongside continued demands for Algerian independence, French leadership finally held talks with Algerian leadership in Constantine. After days of talks, France, which obtained various large and small concessions from Algeria on the premise of Algerian independence, was able to reach a relatively successful agreement backed by public support. By this agreement, Algeria will remain socio-economically dependent on France for about 10 years, but will be fully independent thereafter."
 BA_news.62.a:0 "It's a win for both."
 BA_news.62.b:0 "France didn't use violence?"

 BA_news.63.t:0 "Algerian War of Independence"
 BA_news.63.d:0 "The situation in North Africa took a serious turn as crowds protesting against oppressive measures toward Muslims occupied Algiers City Hall. Minutes later, the Algerian flag hoisted at Algiers City Hall signaled the start of the war of independence, and various large and small Algerian political groups are rallying paramilitaries and youth to attack French military bases in Algeria. The French government soon announced the 'North African Order Maintenance Operation,' signaling a harsh crackdown."
 BA_news.63.a:0 "A unified France is threatened by Muslims!"
 BA_news.63.b:0 "The colonial empire is falling."

 BA_news.64.t:0 "Communist Party of Czechoslovakia Takes Power"
 BA_news.64.d:0 "Today, the Communist Party of Czechoslovakia announced they won the internal power struggle during the political chaos following Abydos Comprehensive Academy's reclamation of Czechia, and that the state will now be run under the leadership of the Communist Party.\n\nAbydos Comprehensive Academy has repeatedly made hostile remarks regarding this seizure of power, but no further response seems to be coming."
 BA_news.64.a:0 "Good heavens."

 BA_news.65.t:0 "Zaolzie Conference"
 BA_news.65.d:0 "A joint defense pact between [POL.GetName] and [ABY.GetName] was discussed in Zaolzie amid the chaotic international situation.\n\nBoth nations stated that discussions are underway to maintain permanent peace in Central Europe through this treaty, and neighboring countries appear to be watching the changes in the international situation at Zaolzie."
 BA_news.65.a:0 "Keep an eye on them."

 BA_news.66.t: "Coup d'état in France!"
 BA_news.66.desc: "In [GetMonth] [Getyear], the military, led by Philippe Pétain, staged a general uprising to overthrow the existing Radical Party regime, which had lost public trust due to weakness and incompetence. They judged that France's future could no longer be left to the corrupt and incompetent current regime, so they rose up, occupied Parliament, and took actual power. Numerous French soldiers are marching in Algiers, and citizens are welcoming them with open arms.\n\nPétain announced several pledges in a speech, aiming to overcome the national crisis and reclaim the mainland as national policy. Frenchmen are sending massive support, expecting that he will not tolerate indecisiveness."
 BA_news.66.a: "Marshal, we are here!"
 BA_news.66.b:0 "The second reenactment of the 18th Brumaire."

 BA_news.67.t: "Valkyrie's Independence of Investigative Rights"
 BA_news.67.d: "Nemugaki Fubuki, Chief of Valkyrie Police Academy, declared today that they have reclaimed investigative rights from SCHALE. SCHALE was supposed to solve students' problems as a Federal Investigation Club, but it failed to perform that role properly. SCHALE could be defined by one phrase: 'nominal only.'\n\nChief Nemugaki Fubuki also declared that Valkyrie Police Academy will perform its role as an independent institution and a public safety maintenance organization that functions properly as a correctional institution. While opposition from academies is expected regarding Valkyrie's intervention in public safety, Chief Fubuki is showing no stance other than saying she will explain in detail later. Regardless, the name SCHALE will no longer be seen in Valkyrie's administrative documents.\n\n"
 BA_news.67.a: "The heroine has broken the shackles."
 BA_news.67.b: "Now, let's begin!"
 BA_news.67.c: "They dare!"

 BA_news.68.t: "Yurizono Seia Elected Tea Party Host"
 BA_news.68.desc:0 "After the Tea Party emergency meeting ended and issues were resolved, the Tea Party elected Yurizono Seia as the next Host. In her appointment speech, Yurizono Seia said that now that a new threat has struck Trinity, its problems must not be ignored but solved.\n\nTrinity will undergo numerous changes during Yurizono Seia's term. Kivotos reporters focused on this, and only she knows in what way she will change Trinity thereafter."
 BA_news.68.a:0 "I'm not particularly interested."
 BA_news.68.b:0 "Well, let's hope she manages well."
 BA_news.68.c:0 "An interesting choice."

 BA_news.69.t: "French Rebellion in Millennium"
 BA_news.69.desc:0 "A massive rebellion has broken out in Millennium Science School. It appears Millennium Science School failed to properly solve various problems arising from the continued resistance of the Maquis after the Franco-Millennium War, which is presumed to be why the Maquis were able to unite on a large scale to organize a massive rebellion.\n\nThe French government-in-exile in Africa is keeping silent on the matter, but traces of supplies and troops secretly moving to France have been discovered."
 BA_news.69.a:0 "They don't seem likely to succeed."
 BA_news.69.b:0 "[MIL.GetLeader], take responsibility."
 BA_news.69.c:0 "They're... at war again?"

 BA_news.70.t:1 "Assassination of Leon Trotsky"
 BA_news.70.d:2 "Leon Trotsky, once Vladimir Ilyich Lenin's top lieutenant and one of the candidates for his successor, died today in a Norwegian hospital. He was attacked with an ice axe at his home by a Spanish assailant who appeared to be hired by the NKVD.\n\nTrotsky, who lost the power struggle within the Soviet Communist Party to $SOV_iosif_stalin$ and his allies, spent his 30s in exile through Turkey and France to Norway. Afterward, Trotsky, swept by a great wave of dimensional shift, had been living a new life as a political advisor to the 'Red Winter Federal Academy' that appeared in the former Scandinavia region."
 BA_news.70.a:0 "How barbaric."
 BA_news.70.b:0 "Mission accomplished."
 BA_news.70.c:0 "A fitting end for a demagogue."
 BA_news.70.q:0 "Today, our star has fallen."
 
 BA_news.71.t: "Revolution in Japan!"
 BA_news.71.d: "See title"
 BA_news.71.2.t: "Minshu Ikki"
 BA_news.71.2.d: "A democratic revolution has broken out in Japan! People and democratic figures seeking to overthrow the militarist regime in Tokyo have declared a massive protest, and a significant portion of the Japanese public is responding.\n\n These democratic forces are rapidly expanding their influence across Japan, including major cities and industrial areas. The Japanese military and right-wing forces remaining under the militarist regime have declared they will resist this revolution until the end.\n\nCivil war has begun in Japan."

 BA_news.72.t:1 "The [FROM.GetAdjective] Spring"
 BA_news.72.d:2 "Foreign media branches remaining in the military administration of the [FROM.GetAdjective] region simultaneously reported on the 'Independence Movement' across the military administration at the top of the hour.\n\nThe [FROM.GetAdjective] Provisional Government, which claims to be the underground government of the old kingdom while controlling protests throughout the military administration, read a declaration of independence over the radio, and some military administration commanders are also reported to have joined.\n\nIn response, the [USA.GetName] Congress passed an unusual support resolution, which was supported by [ENG.GetName], [FRA.GetName], [ITA.GetName], etc."
 BA_news.72.a:0 "It is a struggle for freedom."
 BA_news.72.b:0 "Prepare countermeasures immediately!"

 BA_news.73.t: "Annexation of Shanhaijing"
 BA_news.73.d: "After the Nazi Party in [SHA.Capital.GetCapitalVictoryPointName] succeeded in a coup, Trinity forces succeeded in seizing Shanhaijing by crossing the border.\n\nWithout reports of combat, Trinity soldiers were welcomed and cheered by crowds in the city center.\n\nIn front of a massive crowd at Heden Square in [SHA.Capital.GetCapitalVictoryPointName], Misono Mika declared the annexation of Shanhaijing, its merger into Trinity.\n\n\"The historic Eastern region will now become Trinity's new fortress!\""
 
 BA_news.74.t: "Britain Repels Invasion!"
 BA_news.74.d: "The British army achieved a dramatic victory against the unexpected offensive of Kaiser Corporation. Initially facing a crisis due to successive retreats and the fall of London, the British army established a final defensive line at Liverpool and succeeded in a miraculous counterattack.\n\nThis battle, which began with Kaiser Corporation's large-scale forces launching a surprise attack on the British coast, initially developed unfavorably for the British army. However, upon reaching Liverpool, the British army fought a desperate battle with support from citizens, which became the decisive turning point to reverse the situation.\n\nThis dramatic victory is expected to be remembered in British history for a long time."
 BA_news.74.a: "Rule, Britannia!"

 BA_news.75.t:0 "[TRM.GetName] Officializes Anti-Red Winter Pact"
 BA_news.75.d_soviet: "[TRM.GetLeader] has opposed communism since before taking power, and there was no doubt that [TRM.GetNameDef] considers itself an enemy of [RED.GetNameDef].\n\nToday, that attitude was announced to the world as the \"Anti-Red Winter Pact\" previously formed between [TRM.GetNameDef] and several other nations has now been formalized into a treaty, and if one of our nations clashes with Red Winter, the others will fight alongside."
 BA_news.75.d_not_soviet: "[TRM.GetNameDefCap] has long condemned all forms of communism and has shown diplomatic movements demanding other countries also oppose it.\n\nNow [TRM.GetName] has given nations \"immediately threatened by communism\" the opportunity to sign a treaty against [RED.GetName]. Now any country that joins this treaty will be committed to war with [RED.GetName] should a member nation be attacked."

 BA_news.76.t:0 "Escape of the Seven Prisoners"
 BA_news.76.desc:0 "Due to the security instability revealed by the disappearance of the Student Council President along with recent unexplained events, seven prisoners including Kosaka Wakamo, Kiyosumi Akira, and Shintani Kai, who were held in the Valkyrie Correctional Bureau, have escaped.\n\nWith the neutralization of the Valkyrie Correctional Bureau, it has been proven that nothing is safe in post-Great Transfer Kivotos. While numerous academies are trembling in fear, the General Student Council and the Valkyrie Correctional Bureau have made no mention of this incident.\n\nThe sun of evil rises once again in Kivotos."
 BA_news.76.a:0 "Shocking news."
 BA_news.76.b:0 "What was coming has arrived."

 BA_news.77.t:0 "Opening of the White Night Cherry Blossom Festival"
 BA_news.77.desc:0 "Cherry blossoms in the center of the Hyakkiyako district are in full bloom. Hyakkiyako's largest festival, the Hyakkiyako White Night Cherry Blossom Festival, opened today.\n\nCherry blossoms in full bloom, fluttering pink petals, soft lanterns, and brilliant fireworks illuminate the beautiful night of Hyakkiyako.\n\nHeld more grandly than ever, the Hyakkiyako White Night Cherry Blossom Festival showed the development of the Hyakkiyako Alliance Academy, which grew alongside peace."
 BA_news.77.a:0 "Eternal be our academy."
 BA_news.77.b:0 "It's beautiful."

 BA_news.78.t:0 "South Kivotos War"
 BA_news.78.desc:0 "The border dispute that occurred during the Great Transfer when the academy territories of [HYA.GetNameDef] and [SHA.GetNameDef] overlapped has escalated into war between the two academies. This war has moved beyond a simple dispute between academies and is developing into a serious crisis enveloping all of Kivotos.\n\nWith both sides caught in a vortex of war and suffering increasing damage, concerns are growing over whether peace can be maintained in Kivotos. Amid heightened tensions, the possibility of this conflict spreading to other academies is being raised, making Kivotos's future even more uncertain."
 BA_news.78.a:0 "Drive out the invaders!"
 BA_news.78.b:0 "Let's reclaim our academy!"
 BA_news.78.c:0 "Shocking news"

 BA_news.79.t:0 "Red Winter Civil War"
 BA_news.79.desc:0 "As Red Winter fell into chaos due to the February general strike following the Great Transfer, Yasumori Minori, the leader of the Labor Service Club who joined the strike, along with the Labor Service Club and citizens following her, saw this as an opportunity to oust the Secretariat and began a revolution. As citizens participating in strikes in various places respond to Minori's revolutionary army, the situation in Red Winter is expected to become even more chaotic.\n\nThe Red Winter Foreign Ministry stated this is a common occurrence in Red Winter and that the Secretariat can quell the chaos, but international experts do not believe the Secretariat will win."
 BA_news.79.a:0 "For the people, toward the revolution!"
 BA_news.79.b:0 "Repel the subversive elements!"
 BA_news.79.c:0 "It was predictable."

 BA_news.80.t:0 "Massacre Committed in Millennium"
 BA_news.80.desc:0 "As the French Maquis continued to interfere during the war, Millennium Science School decided to oust all French Maquis from its territory at once. By this decision, not only the Maquis but also student political groups like ordinary citizens were all arrested or immediately executed, and most Maquis activities are reported to have shrunk.\n\nThe international community is fiercely condemning Millennium Science School, calling this action insane."
 BA_news.80.a:0 "Do you think we wanted to do this?"
 BA_news.80.b:0 "Good lord..."

 BA_news.81.t:0 "[ROM.GetName] Cedes Transylvania"
 BA_news.81.desc:0 "Under German mediation, a treaty was signed in Vienna to return Northern Transylvania to Hungary.\n\nThis region was ceded to [ROM.GetNameDef] after the Great War, leading to intense debate.\n\nNow that a new order seems to be established in Europe, will this be the first of many borders that must be adjusted?"

 BA_news.81-2.desc:0 "Under German mediation, a treaty was signed in Vienna to return all of Transylvania to Hungary.\n\nThis region was ceded to [ROM.GetNameDef] after the Great War, leading to intense debate.\n\nNow that a new order seems to be established in Europe, will this be the first of many borders that must be adjusted?"

 BA_news.82.t:0 "Elisabeth Accepts the Hungarian Throne"
 BA_news.82.desc:0 "The Kingdom of Hungary's efforts to acclaim a suitable king led to a polite request to Elisabeth to become the successor of the Habsburgs as the people's choice for economic hardship. Elisabeth, the only paternal granddaughter of Franz Joseph I and Empress Elisabeth, decided to become a Habsburg once again. Just today, amid enthusiastic cheers from the crowd, she entered the Buda Castle and was acclaimed as the King of Hungary.\n\nDuring her coronation speech, she promised to improve the treatment of Hungarian workers. She declared she would never again abandon the poor and swore never to turn a blind eye to Hungary."
 BA_news.82.a:0 "Toward the People's Kingdom!"
 BA_news.82.b:0 "Wait, a socialist Habsburg?"

 BA_news.83.t:0 "Restoration of Austria-Hungary"
 BA_news.83.desc:0 "After the Hungarian army liberated the Austrian region, the Hungarian government notified international media in Budapest with an official letter announcing that Austria-Hungary had been completely restored.\n\nQueen Elisabeth, having obtained the rightful title of Empress of Austria, swore once again that while shadows of the past still linger over the empire, she would save the oppressed people and would not rest until no one goes hungry. It is expected that various neighboring countries will not look kindly upon the current situation unfolding in Budapest."
 BA_news.83.a:0 "We do not forget the hard work of laborers and farmers."
 BA_news.83.b:0 "Is it a Red Empire this time?"
 BA_news.83.c:0 "The borders might be in danger."

 BA_news.84.t:0 "Leftward Shift of [FROM.GetName]"
 BA_news.84.desc:0 "The political change that occurred in [FROM.GetName] was more rapid than expected. $COU_MOMOKA$, who won the power struggle following the disappearance of the Kivotos Student Council President, reportedly resigned from the position of Task Force Chairperson shortly after proposing several bills and passed the position to the local people.\n\nIt is predicted that radical reforms by socialists who seized the position after $COU_MOMOKA$ resigned will hit [FROM.GetName]."
 BA_news.84.a:0 "Long live the revolution!"
 BA_news.84.b:0 "They seem further left than us?"
 BA_news.84.c:0 "That's threatening."

 BA_news.85.t:0 "$COU_MOMOKA$ Remains as Honorary Student Council President"
 BA_news.85.desc:0 "$COU_MOMOKA$, who won the power struggle following the disappearance of the Student Council President of [FROM.GetName], reportedly resigned from the position of Task Force Chairperson shortly after proposing several bills and passed the position to the local people.\n\nThe Reform Committee, which began administrative work after $COU_MOMOKA$ resigned, offered $COU_MOMOKA$ the position of Honorary Student Council President, and it appears $COU_MOMOKA$ accepted it."
 BA_news.85.a:0 "Let's move toward reform."
 BA_news.85.b:0 "A new comrade?"
 BA_news.85.c:0 "Yes."

 BA_news.86.t:0 "$COU_MOMOKA$'s Victory in the Power Struggle"
 BA_news.86.desc:0 "After the Student Council President of [FROM.GetName] vanished, $COU_RIN$ established a Task Force and tried to respond to the chaos. However, others in [FROM.GetName] did not recognize $COU_RIN$'s authority and engaged in a power struggle to become the chairperson who would lead the real Task Force.\n\nWhen the power struggle ended, the person sitting as the Task Force Chairperson was $COU_MOMOKA$, whom no one expected. $COU_MOMOKA$ originally intended not to participate in the power struggle, but became the leader of the so-called 'left-wing' forces based on her statement to accept all of the protesters' demands. And while $COU_MOMOKA$ may not have wanted it, it is clear that she won the power struggle."
 BA_news.86.a:0 "For the new Task Force Chairperson."
 BA_news.86.b:0 "Interesting."

 BA_news.87.t:0 "Withdrawal of [FROM.GetName] from the Kivotos Cooperation Organization"
 BA_news.87.desc:0 "[FROM.GetName] declared its withdrawal from the organization, stating that cooperation between Kivotos nations is of little help to the country.\n\nThe Kivotos Cooperation Organization was established under the leadership of the Student Council President after the Great Transfer, but this incident seems to prove that its authority has been continuously declining since the President vanished."
 BA_news.87.a:0 "Regrettable."
 BA_news.87.b:0 "Is Kivotos's unity crumbling like this?."

 BA_news.88.t:0 "End of the Kivotos Cooperation Organization"
 BA_news.88.desc:0 "[FROM.GetName] declared that cooperation between Kivotos nations has now become meaningless and proved it by being the first to withdraw from the Kivotos Cooperation Organization. The Kivotos Cooperation Organization has now lost its leading nation and has become meaningless.\n\nEveryone knew that the authority of the Kivotos Cooperation Organization had been continuously declining since the Student Council President vanished, but no one could have predicted that the organization would collapse in this manner."
 BA_news.88.a:0 "Welcome the new era!"
 BA_news.88.b:0 "The era of Kivotos is over."

 BA_news.89.t:0 "Kivotos Cooperation Organization Invokes Resolution 47"
 BA_news.89.desc:0 "As the [FROM.GetName], the chair nation of the Kivotos Cooperation Organization, invoked the resolution, nations waging war against fellow member states had their membership suspended immediately. The expelled former members expressed regret over the expulsion, claiming the organization's interference in internal affairs was excessive, and soon seemed to focus on their own wars.\n\nNo one knows whether this will bring about the unity of the Kivotos Cooperation Organization or accelerate its dissolution."
 BA_news.89.a:0 "Is this fortunate for us?"
 BA_news.89.b:0 "What a joke."

 BA_news.90.t:0 "Kivotos Cooperation Organization Expels [FROM.GetName]"
 BA_news.90.desc1:0 "The chair nation of the Kivotos Cooperation Organization suspended the membership of [FROM.GetName] on the grounds of treaty ratification. This treaty was created under the pretext of prohibiting war between members of the organization and for stronger solidarity, and this is the first time membership has been suspended based on it.\n\nWe must watch to see if the unity of the Kivotos Pact Organization will grow stronger or fall."
 BA_news.90.desc2:0 "The chair nation of the Kivotos Cooperation Organization suspended the membership of [FROM.GetName] on the grounds of treaty ratification. Cooperation between treaty nations is shaking, as if to prove that the authority of the organization has been continuously declining since the expulsion of previous treaty ratifying nations."
 BA_news.90.a:0 "Is this fortunate for us?"
 BA_news.90.b:0 "What a joke."

 BA_news.91.t:0 "Victory of Shanhaijing"
 BA_news.91.desc:0 "The South Kivotos War, which began with a massive military clash between [SHA.GetName] and [HYA.GetName], has ended in victory for [SHA.GetName]. At the victory commemoration ceremony held in the Shanhaijing Central Special District's Central Square, [SHA.getLeader] declared it a military, strategic, and political victory for Shanhaijing.\n\nIn the capital of [SHA.GetAdjective], the Shanhaijing Central Special District, a parade commemorating Shanhaijing's victory began and [SHA.getLeader]'s speech started. The main content of the speech included Shanhaijing's victory and encouragement for the soldiers, as well as the proclamation of becoming the hegemonic power over South Kivotos."

BA_news.91.2.desc:0 "The South Kivotos War, which began with a massive military clash between [SHA.GetName] and [HYA.GetName], has ended in an overwhelming victory for [SHA.GetName]. At the victory commemoration ceremony held in the Shanhaijing Central Special District's Central Square, [SHA.getLeader] declared, \"We will build a 'New Order' centered around our capital.\"\n\nShanhaijing Central Special District has now become a place symbolizing [SHA.getLeader]'s ideology and serves as the headquarters for the 'Lebensraum' acquisition plan. International concern is deepening over rumors of an 'Impurities Purge' operation, and many nations are increasing their vigilance against the expansion of the new order."

BA_news.91.3.desc:0 "The South Kivotos War began with a massive military clash between [SHA.GetName] and [HYA.GetName] and ultimately ended in victory for [SHA.GetName]. At the victory commemoration ceremony held in the Shanhaijing Central Special District's Central Square, Urushibara Kaguya declared in her speech, \"The Shanhaijing Conservative Revolution has entered a new phase with the victory in this war.\"\n\nAs the speech ended, countless citizens cheered while waving Shanhaijing flags, and Urushibara Kaguya stepped down from the podium amidst fervent applause.\n\nOnly Urushibara Kaguya knows what conclusion the conservative revolution will face."

BA_news.92.t:0 "Victory of Hyakkiyako"
BA_news.92.desc:0 "The South Kivotos War has concluded with a victory for [HYA.GetName]. [HYA.GetName] announced it secured strategic superiority through efficient night operations and systematic occupation policies.\n\n[HYA.GetName]'s special forces quickly seized key strategic points, and strict control policies were implemented in the occupied territories.\n\nAt a press conference in Hyakkiyako, [HYA.GetLeader] stated, \"The military security of [HYA.GetName] has been greatly strengthened.\" [HYA.GetName] is establishing management and reconstruction plans for the occupied territories, but some foreign reporters are expressing concern over the occupation policies."

BA_news.93.t:0 "Victory of Abydos"
BA_news.93.desc:0 "The most surprising result of the South Kivotos War is the victory of [ABY.GetName]. This small academy consisting of only 5 students achieved an seemingly impossible victory in the Sudetenland region.\n\n[ABY.GetName] gained the full support of Czechs and Austrians, succeeding in building a relationship of trust with local residents. This led to a wide information network and the formation of guerrilla reinforcements.\n\n[ABY.GetLeader] declared, \"Our victory is the victory of the people of the Sudetenland.\" [ABY.GetName]'s inclusive policies and reconstruction programs are receiving attention from the international community."

BA_news.91.a:0 "A great victory!"
BA_news.91.b:0 "Witness the ascension of the Dragon."
BA_news.91.c:0 "This might become a problem as time passes..."
BA_news.91.d:0 "A dark shadow stretches out from Shanhaijing Central Special District."
BA_news.91.e:0 "I admit defeat."
BA_news.91.f:0 "How cautious."

BA_news.92.a:0 "A reorganization of the post-war order is expected."
BA_news.92.b:0 "We must watch the results of the victory."
BA_news.92.c:0 "I cannot look upon this with both eyes."

BA_news.93.a:0 "Peace has been restored."
BA_news.93.b:0 "Something unbelievable has happened."

 BA_news.94.t:0 "Worsening Health of $KSP_Ogata_Kanna$"
 BA_news.94.desc:0 "Shocking news has arrived from [KSP.GetName]. It is reported that $KSP_Ogata_Kanna$, the leader of [KSP.GetName], has collapsed from overwork. It seems $KSP_Ogata_Kanna$ has taken on countless tasks to solve various problems that occurred at the police academy since the Great Transfer, and she has paid the price.\n\nAs $KSP_Ogata_Kanna$ collapsed, Valkyrie Police Academy seems to have fallen into temporary administrative paralysis, hinting that the balance of power in Valkyrie Police Academy will change significantly before long."
 BA_news.94.a:0 "This is not good news."
 BA_news.94.b:0 "Understood."

 BA_news.95.t:0 "Resignation of $KSP_Ogata_Kanna$"
 BA_news.95.desc:0 "News has just arrived that $KSP_Ogata_Kanna$, the leader of [KSP.GetName], has stepped down from the position of [KSP.GetName] Student Council President and resigned. $KSP_Ogata_Kanna$ made a great contribution to getting the school through its crisis after the Great Transfer, but it appears she has stepped down from the Chief position herself after being pushed out in recent power struggles within [KSP.GetName] and her worsening health.\n\nThe balance of power in [KSP.GetName] is expected to fluctuate greatly due to this incident."
 BA_news.95.a:0 "..."
 BA_news.95.b:0 "So it finally turned out that way?"

 BA_news.96.t:0 "Rebirth of the League of Nations"
 BA_news.96.desc:0 "Since the strangers landed in Europe, the wars occurring everywhere made the League of Nations nominal. But now, now that everyone is one, that history shall never be repeated."
 BA_news.96.a:0 "This time, it shall never fall."
 BA_news.96.b:0 "A giant has awakened."
 BA_news.96.c:0 "Blessings upon them, no, upon us."

 BA_news.97.t:0 "US Joins the New Order"
 BA_news.97.desc:0 "The world fell into shock and confusion after the United States officially declared a friendly cooperative relationship with Kivotos. Immediately after the declaration was announced, leaders of many European nations, including Britain and France, poured out intense criticism, calling the US a \"betrayer of humanity.\" Conversely, Kivotos nations welcomed the US declaration, evaluating it as a \"historic first step toward integration between strangers and locals.\" Amid these contrasting reactions, the world is now focusing its attention on the US's next move. Debates are expected to intensify over whether the US will open new possibilities for humanity through cooperation with Kivotos, or result in deepening division and conflict in the international community."
 BA_news.97.a:0 "Time to prove one's convictions"
 BA_news.97.b:0 "They know where they should follow."
 BA_news.97.c:0 "Humanity is finished now!"

 BA_news.98.t:0 "Rise of the Intermarium Federation"
 BA_news.98.desc:0 "Today, a historic moment has been met. Poland and Eastern European nations have officially formed the Intermarium Federation. This is being evaluated as the largest political change in Eastern European history. Eastern European nations, which built deep ties through the [SOV.GetAdjective]-[POL.GetOldAdjective] war, eventually began pushing for a single federation and it was formed with overwhelming approval following a referendum.\n\nWhile a new powerhouse has appeared in Eastern Europe, neighboring countries have made no official announcements but will likely not welcome their rise."
 
 BA_news.99.t:0 "Showa Democracy"
 BA_news.99.desc:0 "Today, the Japanese People's Liberation Committee and Emperor Hirohito issued a joint statement announcing the end of the Japanese Civil War, alongside a new democratic constitution. They promised a more substantial transition to a constitutional monarchy by transferring much of the Emperor's power to a civilian government and declared they would change the national title from the Empire of Japan to the State of Japan.\n\nEmperor Hirohito, who had been silent and had not taken a single step out of the Imperial Palace since the start of the Japanese Civil War, appeared publicly to the masses for the first time, comforting and encouraging the citizens of Tokyo, which was left in ruins by the damage of the civil war.\n\nDiplomatic circles worldwide are watching with bated breath to see what impact these political changes in Japan will have on the situation in Asia."
 BA_news.99.a:0 "Tenno Heika Banzai! Long live the democratic government!"
 BA_news.99.b:0 "Let's hope their new government is cooperative with us."
 BA_news.99.c:0 "Ha! A constitutional monarchy? I'll be watching."

 BA_news.100.t:0 "Bengal Famine"
 BA_news.100.desc:0 "To effectively win the war in India, Churchill's cabinet in [ENG.getname] carried out excessive naval blockades for several months. This blockade stopped logistics for Bengal residents and ruined food supply, ultimately causing numerous people to starve to death. In response to this atrocity, which borders on genocide, nations around the world are pouring out intense criticism against Britain."
 BA_news.100.a:0 "Damn it."
 BA_news.100.b:0 "They have crossed the line."
 BA_news.100.c:0 "We must drive them out of India by any means necessary."

 BA_news.101.t:0 "Advent of the Second Great Depression"
 BA_news.101.desc:0 "Along with the collapse of the US economy, the New York Stock Exchange has effectively closed and Wall Street is in crisis. This is having a huge ripple effect across Europe. The world's financial markets are heavily influenced by investment from the United States, and fears of bankruptcy and financial collapse are spreading.\n\nBanks in several remaining countries, including Canada, Italy, and Spain, are closing, and thousands of citizens are facing sudden unemployment and poverty. This catastrophe is shaking the global economic structure, and concerns are growing that it will be the prelude to a new Great Depression."
 BA_news.101.a:0 "Everyone should have predicted this situation."
 BA_news.101.b:0 "We wanted them to fail, but not like this."
 BA_news.101.c:0 "New policies are needed."
 BA_news.101.d:0 "Wait, is this because of us?"
 BA_news.101.e:0 "Our banks will have to go through a difficult time for a few months."

 BA_news.102.t:0 "Coronation of Edward VIII"
 BA_news.102.desc:0 "George V, the last King to directly rule the mainland of the United Kingdom of Great Britain and Ireland, died just before going into exile in Canada. His reign as the first King of the House of Windsor will be remembered as a time of sorrow and pain, as Britain was defeated in the British Isles and lost its homeland. The throne has now been inherited by Edward, Prince of Wales, who is now called Edward VIII.\n\nKing Edward is a figure burning with revenge and great ambition, and does not maintain a very good relationship with the Canadian Parliament. Since he accepted the throne with the goal of avenging his father and reclaiming the mainland, he is particularly popular among British exiles in Canada."
 BA_news.102.a:0 "God Save the King!"

 BA_news.103.t:0 "Binah Repelled!"
 BA_news.103.desc: "A powerful enemy that appeared in Egypt, 'Binah,' has finally been repelled. Because of this, Egypt has regained peace, and the morale of the people is rising. Binah's identity remains a mystery, but the whole world is celebrating and paying attention to this victory. Facing new challenges, Egypt is focusing on its future response."
 BA_news.103.a: "Finally!"
 BA_news.103.b: "Amazing!"

 BA_news.104.t:0 "Proclamation of [From.GetNameDef]"
 BA_news.104.desc:0 "Following several 'Wars of Liberation' that broke out immediately after [From.GetOldAdjective]'s Pan-Europeanism declaration, the idea of the birth of a Pan-European state under the massive ideology of Human Fascism has finally been planted in all of European humanity. The Pan-European state now declares a holy war against the opposing Kivotos nations, and Italians have gained pride in being the powerful center of Europe.\n\nFurthermore, reconstruction work for Europe has already begun in places considered \"Land of the Liberated European People,\" and now that the Italian government has declared the unification of all of Europe, their country will be renamed to [From.GetNameDef]."
 BA_news.104.a:0 "United Europe!"
 BA_news.104.b:0 "Can they achieve that vast dream?"
 BA_news.104.c:0 "I should prepare for war."

 BA_news.105.t:0 "Red Winter Great Famine"
 BA_news.105.desc:0 "The leadership of Red Winter, having failed to establish food measures for the millions of students who crossed over during the Great Transfer, ultimately had no choice but to watch as Red Winter faced a severe famine. Corpses have formed hills in the cities, and citizens with nothing to eat do not even shy away from cannibalism. Those who still possess reason are escaping to other countries, and protesters demanding food rations and the military stopping them are creating endless sounds of gunfire."
 BA_news.105.a:0 "A horrific tragedy."

 BA_news.106.t:0 "End of the Black Market"
 BA_news.106.desc:0 "The Black Market, Europe's worst crime zone formed along with the Great Transfer of Kivotos, was just completely purged by a military operation of the [FROM.FROM.GetName] side.\n\nThe Black Market was a force that caused instability in Kivotos and European nations by smuggling various illegal military equipment, and with this purge, the Black Market will never be formed again."
 BA_news.106.a:0 "It's a bit of a shame"
 BA_news.106.b:0 "Europe's worst criminal market has closed."
 BA_news.106.c:0 "Mafia activities will become quiet."

 BA_news.107.t:0 "Appearance of Decagrammaton"
 BA_news.107.d:0 "A new type of combat weapon, unprecedented in form, has appeared on the battlefield. These beings called Decagrammaton seem to perfectly embody the power of the Chroma."
 BA_news.107.a:0 "Our perfect evolution"
 BA_news.107.b:0 "A horrific existence"

 BA_news.108.t:0 "Brutal Suppression in Brittany"
 BA_news.108.d:0 "After the Great Transfer of Kivotos, a criminal organization inheriting the previous Kivotos Black Market was established in the Brittany region.\n\nWhile proper information could not be obtained because they did not allow entry until recently, news has recently arrived that they have started a brutal war against Brittany's nationalist independence organizations."
 BA_news.108.a:0 "Fear is an excellent means of rule."
 BA_news.108.b:0 "Truly horrific."

 BA_news.109.t:0 "Millennium Dispatches Volunteers"
 BA_news.109.d:0 "It has been confirmed by local dispatched reporters that a Millennium volunteer corps is dispatched to the center of the Spanish Civil War, which is swirling toward its worst. They stated they 'voluntarily' applied for the volunteer corps to hold the causing forces accountable 'for the resolution of the refugee problem,' and no one knows what diplomatic impact such a military operation by a Kivotos-based nation will have on the world."
 BA_news.109.a:0 "Let's show the academy's potential!"
 BA_news.109.b:0 "Millennium's hegemonism must be stopped."

 BA_news.110.t:0 "Total Millennium Intervention"
 BA_news.110.d:0 "While several suspicious movements in the Pyrenees were reported, Millennium forces crossed the Pyrenees all at once in accordance with a signal flare fired in the middle of the night. Total Millennium intervention in the Spanish Civil War was something no one expected, and was a clear challenge to the Intervention Committee and the Cooperation Organization. Kivotos nations are condemning such hegemonism by Millennium, while the Millennium Student Council explained it as the execution of a special military operation, not war."
 BA_news.110.a:0 "It's not an invasion, but a 'Special Military Operation.'"
 BA_news.110.b:0 "We must stop the runaway hegemonism!"

 BA_news.111.t:0 "Otherworldly Culture Craze in the US!"
 BA_news.111.d:0 "Right now, the US is deeply infatuated with otherworldly culture. Among them, the most popular is Shanhaijing's national exercise, 'Vigorous Gymnastics.' Come morning, it has become a daily sight for them to stretch their hands and legs out."
 BA_news.111.a:0 "That fellow Kisaki, seems to know a thing or two!"
 BA_news.111.b:0 "An extremely confusing situation."
 BA_news.111.c:0 "Completely insane."

 BA_news.112.t:0 "US Declaration of Guarantee of Independence for Millennium"
 BA_news.112.a:0 "A wise choice." 
 BA_news.112.b:0 "Do you intend to form a science club or something?"
 
 BA_news.113.t:0 "US Declaration of Guarantee of Independence for the Eden Treaty"
 BA_news.113.a:0 "A wise choice." 
 BA_news.113.b:0 "A very heterogeneous alliance."

 BA_news.114.t:0 "US Declaration of Guarantee of Independence for the General Student Council"
 BA_news.114.a:0 "A wise choice."
 BA_news.114.b:0 "Those things betrayed us!"
 
 BA_news.115.t:0 "The US Follows Gehenna"
 BA_news.115.a:0 "They know how to fight."
 BA_news.115.b:0 "... Does that mean we can terrorize the Statue of Liberty?"
 BA_news.115.c:0 "Terrorist activities in the US will increase."

 BA_news.116.t:0 "The US Follows Trinity"
 BA_news.116.a:0 "Become an apostle of the angels."
 BA_news.116.b:0 "Glad they're on our side."
 BA_news.116.c:0 "This is a disaster!"

 BA_news.117.t:0 "The US Follows Red Winter"
 BA_news.117.a:0 "I hope this path is right..."
 BA_news.117.b:0 "I didn't expect it, but let's just let good things pass."
 BA_news.117.c:0 "An unthinkable declaration."

 BA_news.118.t:0 "[WCH.Getleader]'s Proclamation of a Rightful Government"
 BA_news.118.d:0 "This morning, the Wang Jingwei regime announced the official end of the Sino-Japanese War and that it is the rightful government of China. Japan and the Wang Jingwei regime issued a joint statement through a large-scale peace treaty signing ceremony held in Nanjing, announcing the beginning of a New Order in Asia.\n\nThe war is over, but tensions within the East Asian region remain high. Controversy over the legitimacy of the Wang Jingwei government and internal opposition are expected to remain major challenges for stable state management in the future."
 BA_news.118.a:0 "The first step for East Asian liberation!"
 BA_news.118.b:0 "Unpleasant news..."

 BA_news.119.t: "[FRA.getname] Withdraws from Indochina"
 BA_news.119.d: "The [FRA.getname] authorities understood that they themselves could no longer continue colonial activities in Indochina. Through negotiations with the leader of [VIN.getname], the Governor-General of French Indochina withdrew while securing all of their assets and capital, and Indochina met its independence."
 BA_news.119.a: "It was the next best thing."
 BA_news.119.b: "French colonialism is setting."
 BA_news.119.c:0 "A victory on the anti-imperialist struggle front!"

 BA_news.120.t: "[USA.getname] Joins the Communist International!"
 BA_news.120.d: "Today, shocking news reached the world. That is, the United States, where the Labor Party took power, has finally joined the Communist International! \n\nThis news was extremely shocking regardless of ideology, nation, race, or even being from another world."
 BA_news.120.a:0 "There are no eternal enemies"
 BA_news.120.b:0 "Welcome, comrade!"
 BA_news.120.c:0 "Just what on earth is happening?"

 BA_news.121.t: "[USA.getname]'s Communist Manifesto!"
 BA_news.121.d: "A new diplomatic turning point for [USA.getname] was announced in Washington.\n\nUnexpectedly, they delivered a speech with intense criticism of the Soviet Union as an 'authoritarian oligarchic dictatorship,' while declaring that [USA.getname] is a country of new progress and workers, the true lamp of socialism.\n\nMoscow has not yet released any statement regarding the criticism from the confident new communist nation, but a clash between both sides seems inevitable."
 BA_news.121.a:0 "Workers of the world, unite!"
 BA_news.121.b:0 "Quite confident."
 BA_news.121.c:0 "Another red plague has been created?!"

 BA_news.125.t: "Trotsky Endures"
 BA_news.125.d: "After his exile to Norway, Trotsky was able to approach the center of [RED.getname] and, with the help of the Guard Bureau, survived assassination attempts from the Soviet Union and stands firm.\n\n\"I do not fear death. Revolution is sustained by the power of ideas, not individuals, and Stalin's oppression is merely proof that he fears justice.\"\n\nWhen Trotsky spoke as such at Red Winter's All-People's Convention, the subsequent announcement of the arrest of dozens of locals whose connection with the Soviet Union was detected by the Guard Bureau implies that Trotsky has henceforth fully escaped from almost all threats from the Soviet Union."
 BA_news.125.a:0 "The anti-Stalinist ranks are firm!"
 BA_news.125.b:0 "An anti-revolutionary element is running rampant."
 BA_news.125.c:0 "Is splitting up a hobby for communists?"
 
 BA_news.126.t:0 "Autonomy Ultimatum"
 BA_news.126.d:0 "A statement by Student Council President Shiranui Kaya, broadcast live by airship across Kivotos, was reported. In the report, the Student Council prefaced that it would no longer tolerate the excessive exercise of autonomy by various academies, which had been tacitly allowed since the Great Transfer of 1935, and requested they 'return' it to the Student Council on their own as soon as possible.\n\nExperts stated the possibility of academies following the order is near zero, but the possibility of the Student Council invading all of Kivotos using this as a justification following the dissolution of the Kivotos Cooperation Organization is being discussed."
 BA_news.126.a:0 "We have left them alone for too long."
 BA_news.126.b:0 "What a crazy warmonger!"

 BA_news.127.t:0 "Phantom Signals Received Across Kivotos"
 BA_news.127.d:0 "Faint signals, estimated to be transmitted from the north of the British Isles, are being continuously captured across Kivotos. Since these signals were captured, abnormal phenomena have been detected in robot units and guarding automatons across Kivotos. In particular, incidents where large groups of robots vanish overnight are being reported everywhere. \n\n At Millennium Science School, a group of robots was even suppressed while trying to cross the Dover Strait after seizing a warship. The detained robots ceased operation entirely shortly after, and no significant information could be obtained from interrogation. \n\n The interrogation officer reported that before stopping, the robots muttered things like 'He is coming,' 'Jericho is approaching us,' acting as if deeply possessed by something."
 BA_news.127.a:0 "We are going.."
 BA_news.127.b:0 "Just what on earth happened to them?"

 BA_news.128.t: "Collapse of Międzymorze"
 BA_news.128.d: "Despite fierce fighting, [POL.getname] and its allies have all knelt before the powerful offensive of [SOV.getname]. Remaining allies are considering a separate peace with the Soviet Union, and only Poland is preparing for a final desperate resistance."
 BA_news.128.a:0 "They were a motley crew."
 
 BA_news.129.t:0 "SRT Enters School Closure Process"
 BA_news.129.d:0 "SRT Special Academy entered the closure process today. SRT, indicted for the massacre of the House of Orange-Nassau during the Great Transfer, entered the closure process with the consent of the heads of the Administrative Committee, and most students were incorporated into Valkyrie without conditions. However, SRT's FOX Squad and RABBIT Squad rebelled by refusing the administrative order of the Administrative Committee, but they were suppressed before long.\n\nChronos School reported that they are currently arrested and imprisoned in the Valkyrie Correctional Bureau on charges of refusing the trial results and violating the administrative order of the Administrative Committee, and the exact situation is unknown."
 BA_news.129.a:0 "The end of the fox and the rabbit."

 BA_news.130.t:0 "Kivotos Radio Interference Incident"
 BA_news.130.desc:0 "Radio interference from phantom signals occurred early this morning. Because of this, communication devices across Kivotos were simultaneously hacked, and Decagrammaton, claiming to be an absolute existence, declared a 'Final Testament' to humanity and the students. \n\n On the radio, Decagrammaton argued that the war between humanity and other races will never end until one race is exterminated, and that suffering and hatred will repeat, so this world can never be peaceful. Decagrammaton claimed it will break this vicious cycle and create a world of true peace. Therefore, it claimed everyone should disband their armies immediately and accept it. \n\n Immediately after Decagrammaton's testament, protests by automatons and robots across Kivotos became violent all at once, which seems to be related, and experts judge it was an invasion planned long ago.  "
 BA_news.130.a:0 "The time has come.."
 BA_news.130.b:0 "Something is approaching"
 
 BA_news.131.t:0 "SCHALE-Student Council Breakup"
 BA_news.131.d:0 "Not long after the Student Council President vanished, the Federal Investigation Club SCHALE, created by the President's direct order, demanded a unilateral merger of the Student Council based on the legitimacy of the Student Council President. The Administrative Committee defined SCHALE's unilateral merger demand as a simple machine error and took action, but the Federal Investigation Club SCHALE unilaterally blocked all communication means with the Student Council, so both organizations seem to have completely split.\n\nThis is expected to escalate into a full-scale war between both sides, and it seems like a major crisis for the survival of the strange system called the Student Council state, as many troops inspired by SCHALE's propaganda are being reported."
 BA_news.131.a:0 "Bring it on!"
 BA_news.131.b:0 "Machine error? What a joke."
 BA_news.132.t:0 "Impeachment of Acting President Rin"
 BA_news.132.d:0 "A political anomaly occurred in the Student Council. In the recent power struggle, an impeachment motion was passed against Chief Executive Rin and the cabinet, holding them responsible for the instability of the Student Council, and Acting President Rin is currently detained at home. Shiranui Kaya, Chief of Defense and the new Acting Student Council President, declared in a speech that day that she would seek stability and execute all external threats. However, this Kaya cabinet does not seem to easily gain recognition for its acting position from surrounding academies.\n\nMillennium Science School criticized Acting President Kaya for illegally challenging Administrative Committee democracy, and Valkyrie Police Academy also looks upon Acting President Kaya unfavorably."
 BA_news.132.a:0 "A toast to Acting President Kaya!"
 BA_news.132.b:0 "A black wave."
 BA_news.133.t:0 "Kaya's Inauguration as Student Council President"
 BA_news.133.d:0 "As Shiranui Kaya was unanimously acclaimed as the Student Council President in an emergency meeting of the Administrative Committee, shock is spreading through the academies. Shiranui Kaya officially took office as the new Student Council President following the previous President and vowed stability for Kivotos at the inauguration ceremony.\n\nHowever, news that a reign of terror became the main focus and iron-fisted rule under the excuse of authority and discipline became the core of Kivotos did not draw positive reactions from each academy, and in severe cases, instances of not recognizing the new Student Council President are occurring frequently. The fate of Kivotos seems likely to be decided in the near future."
 BA_news.133.a:0 "Progress for order."
 BA_news.133.b:0 "I cannot recognize this."
 BA_news.134.t:0 "The Non-Possession Struggle!"
 BA_news.134.d:0 "New nuisances are rising near the Sanctum Tower. Diogenes, leader of the \"Group finding certain happiness without possessing anything,\" shortened to SOK-HWA-HAENG, resolved for a non-possession struggle, refusing the social re-education administrative order recently announced by the Administrative Committee. Having cooperated with some workers in the Netherlands and Flanders, they have escaped Valkyrie's control and are waging a nationwide 'non-possession struggle,' encouraging the encouragement of pan-Kivotos-European non-possession struggle and the participation of SOK-HWA-HAENG.\n\nMeanwhile, contrary to some workers looking upon SOK-HWA-HAENG positively, the popularity of SOK-HWA-HAENG does not seem very high due to scandals regarding Diogenes's personal behavior that spread on the internet."
 BA_news.134.a:0 "At least say something that makes sense!"
 BA_news.134.b:0 "Interesting."
 BA_news.135.t: "End of the Ideological War"
 BA_news.135.d: "The sound of gunfire has faded on the vast Russian land. As the fog of the battlefield clears, it is revealed that [RED.getname] is controlling the [SOV.GetAdjective] territory, and Stalinists are attempting to go into exile abroad. What is certain is that Stalin's era has set."
 BA_news.135.a:0 "A dark era for communism."
 BA_news.135.b:0 "A true victory of history."
 BA_news.135.c:0 "Communism, once divided into two, has merged back into one."
 BA_news.136.t:0 "Release of the I-Phone"
 BA_news.136.d:0 "\"...And so, today we proudly announce. The progress of humanity, the I-Phone!\"\n\nPhilips made a surprising announcement today that shocked all of Kivotos. Since the Great Transfer, it had been predicted several times that humanity would never be able to catch up to Kivotos's overwhelmingly superior technology, but with the full support of the Student Council, humanity has succeeded in a great technological advance, keeping pace with Kivotos technology. Introduced personally by Anton Philips, the I-Phone, while inferior to Kivotos-made ones, is gaining great popularity due to its low price and excellent cost-effectiveness.\n\nGovernments of various nations are rushing to introduce the I-Phone, and as a related business, Philips is expanding the installation of communication networks and power grids."
 BA_news.136.a:0 "Quite amazing."
 BA_news.137.t:0 "Shiranui Kaya's Coronation as Queen"
 BA_news.137.d:0 "Dark times have come for the Dutch people. After SRT Special Academy killed Queen Wilhelmina during the Great Transfer, the Kingdom of the Netherlands did not officially perish, but while the position of Queen was empty, a coronation ceremony was held today, presumably intended to strengthen Shiranui Kaya's power.\n\nAt the grand coronation ceremony, the Queen's coronation proceeded under the congratulatory speeches of Alfred Haighton and Léon Degrelle. Invitations were delivered to Leopold III and [HEU.GetLeader], but they are presumed to have not attended."
 BA_news.137.a:0 "The Netherlands will not die just because of a show like that."
 BA_news.137.b:0 "Queen Kaya, that sounds a bit awkward."
 BA_news.137.c:0 "To kill the Netherlands twice!"
 BA_news.138.t: "Vienot Treaty"
 BA_news.138.d: "The Syrian general strike that had been ongoing since last December has expanded into an anti-imperialist resistance movement across the French Middle East. Even after exile to Africa, the indecisive French Parliament refused to compromise with Syria, but France's powerful leader Pétain, to focus on the immediate reclamation of the mainland, signed an agreement to end the standoff with Syria. Syria and Lebanon are no longer under French colonial rule, and French troops stationed in the Middle East are expected to withdraw over two months."
 BA_news.138.a:0 "The sun of colonialism is setting."

 BA_news.139.t:0 "Formation of the Kivotos Robot Liberation Front"
 BA_news.139.desc:0 "Today, a Liberation Front creation convention was held in Calvados. The rebel army, formed by a mixture of machines, beastmen, students, and humans, advocated that they \"rose up to overthrow Millennium and the Kivotos Academy State, which brutally suppress the anti-war movement, and break the endless cycle of hatred that began with the Great Transfer,\" claiming they will become the vanguard of the struggle for all peace-loving intelligences. \n\n The Liberation Front presented a resistance plan with the goal of \"overthrowing all Kivotos academies that are betraying the people and turning into minority dictatorships, and establishing a united government.\" \n\n Currently, the force behind this Liberation Front is estimated to be Decagrammaton, which brought down Kaiser Corporation and seized the British Isles, and military movements toward Millennium and Kivotos are expected in the near future."
 BA_news.139.a:0 "Take up arms for peace"
 BA_news.139.b:0 "Deploy troops to the northern Millennium front"
 BA_news.139.c:0 "Strengthen the state of alert"
 BA_news.139.d:0 "What a mess"

 BA_news.140.t:0 "Approval of the Stresa Front"
 BA_news.140.desc:0 "As the otherworldly threat becomes more serious by the day, the [ENG.GetAdjective] side officially announced the re-approval of the 'Stresa Front,' which can perform the role of an anti-Kivotos common front.\n\nIn this process, the [ENG.GetAdjective] government is moving to revive the once-nominal Stresa Front by re-summoning past treaty nations.\n\nHowever, the survival of the Stresa Front is not guaranteed. If even one country among the treaty nations refuses formal approval or withdraws cooperation, this front will face the crisis of collapse once again."
 BA_news.140.a:0 "What an amazing development!"
 BA_news.140.b:0 "This isn't good either way.."
 BA_news.140.c:0 "The first step toward reclaiming the mainland!"
 BA_news.140.d:0 "Maybe we'll gain a reliable ally?"
 BA_news.140.e:0 "I'll give it a review."

 BA_news.141.t:0 "Eerie Rumors from the British Isles"
 BA_news.141.desc:0 "Eerie rumors are circulating from anti-government forces claiming to have escaped from the British Isles. According to the rumors, the AI currently ruling the British Isles arrests those who oppose it, extracts their mental data from their brains, and stores it in a virtual world, using some personalities for ‘permanent isolation’ and some for information extraction. \n\n It claimed that said virtual world reconstructs and shows the user the point when they were happiest based on memories extracted from the brain, slowly brainwashing the spirit within the comfort of the virtual world. \n\n In response, the academy's ethical organizations demanded a “Declaration of Digital Human Rights Without Borders” and urged an investigation at the academy and Student Council level."
 BA_news.141.a:0 "It was a necessary measure"
 BA_news.141.b:0 "If this is true... it's truly horrific"

 BA_news.142.t:0 "Simultaneous Terror Attacks Across Kivotos!"
 BA_news.142.desc:0 "Organized simultaneous terror attacks targeting administrative agencies and military command systems occurred across Kivotos. In Millennium, successive explosions and shootings occurred near the campus, and similar attacks were reported in Trinity, Gehenna, and Shanhaijing. \n\n It is presumed that special bombs that destroy halos were used in this terror attack, and the currently tallied civilian casualties in each academy reach thousands. Since many of them are in critical condition, the number of deaths is also estimated to be extreme. Each academy defined this attack as an unprecedented organized attack and declared a full investigation.\n\n Experts estimate the organized simultaneous terror attacks are the work of the recently formed ‘Liberation Front,’ and in particular, judge that the attempt to neutralize military command systems means an invasion is imminent, declaring an immediate state of emergency."
 BA_news.142.a:0 "It begins now."
 BA_news.142.b:0 "Dispatch C&C"
 BA_news.142.c:0 "The thousand-year capital Eden will not fall like this."
 BA_news.142.d:0 "Ibuki.. is Ibuki safe?"
 BA_news.142.e:0 "Mobilize the Prefect Team!"
 BA_news.142.f:0 "A blizzard is blowing.."
 BA_news.142.g:0 "This isn't hard-boiled at all.."
 BA_news.142.h:0 "Terrorism cannot be tolerated for any reason."

 BA_news.143.t:0 "Machines Declare Reconstruction Support"
 BA_news.143.desc:0 "The AI that recently ousted Gematria and newly took power in the northern British Isles sent an official telegram to each academy across Kivotos. This AI expressed deep concern over the infrastructure devastated after the Great Transfer and the extreme chaos caused by it, and stated its intention for humanitarian support by dispatching a reconstruction support unit consisting of automated machines and automatons. \n The latest automation technology and high productivity possessed by the reconstruction support unit are expected to be a powerful means to quickly overcome the crisis faced by each academy state, particularly expected to achieve excellent results in construction, material production, and infrastructure restoration.\n However, on one side, there are concerns that the ‘extremist ideology toward peace’ advocated by this AI could become the seed of another conflict. "
 BA_news.143.a:0 "..."
 BA_news.143.b:0 "Machines providing support?"

 BA_news.144.t:0 "[GEM.GetName]'s Gehenna Reunification"
 BA_news.144.desc:0 "Gehenna, which had been divided, was reunited today by [GEM.GetLeader]. Until now, Gehenna was divided into two military forces: the Pandemonium Society and the Prefect Team, but Gehenna's division ended due to [GEM.GetLeader]'s leadership. However, seeds of division still remain. Former Prefect Team personnel are not loyal to the new government, and it is expected to take time to restore national power destroyed by the war.\n\nHowever, [GEM.GetName]'s reunification of Gehenna is certainly a historic event, and after the reconstruction of the ruins, Gehenna seems likely to emerge as a powerful academy once again."
 BA_news.144.a:0 "For the glory!"
 BA_news.144.b:0 "Gehenna has gathered as one again"
 BA_news.144.c:0 "The situation in Kivotos is changing greatly"

 BA_news.145.t:0 "Invasion of Millennium!"
 BA_news.145.desc:0 "A full-scale invasion of the machine forces began in northern Millennium this morning. Millennium seems to be fighting well against the 'Liberation Army,' but according to the Intelligence Department, it has been confirmed that numerous transport ships are moving through the Dover Strait to support the Liberation Army. With reports of giant weapons called 'Prophets' being observed in part of the front line, Millennium's war situation is expected to worsen.\n\n Seminar immediately declared a desperate resistance and Millennium established a defensive line centered around Eridu, but it seems it will be difficult for Millennium to stop the increasing machine offensive alone."
 BA_news.145.a:0 "For a bright future"
 BA_news.145.b:0 "Defend Eridu at all costs!"
 BA_news.145.c:0 "The start of another slaughter"

 BA_news.146.t:0 "Ibuki"
 BA_news.146.desc:0 "Until now, two weeks after indiscriminate terror attacks across Kivotos using drones occurred, many have expressed concern as the life of Tanga Ibuki, the mascot of Pandemonium Society, was not confirmed. On one side, the possibility was raised that Ibuki already became a victim of that tragedy during the drone attack two weeks ago. \n\n Consequently, Pandemonium Society officially announced through an official statement today that Tanga Ibuki unfortunately died during the indiscriminate and inhumane attack of the Decagrammaton forces at the time. Pandemonium Society also strongly condemned the Decagrammaton forces that perpetrated this attack and declared that there will be \"resolute retaliation and thorough punishment for the extremist machine forces that brutally took a young life.\""
 BA_news.146.a:0 "It couldn't be helped.."
 BA_news.146.b:0 "Ibuki..."
 BA_news.146.c:0 "A young life has been sacrificed"

 BA_news.147.t:0 "What Impact Did Mysticity Have on Humanity?"
 BA_news.147.desc:0 "There were speculations that the small amount of Mysticity spread across the globe after the Great Transfer would have affected humanity in some way. The possibility that this is actual truth increased through a paper published by an anonymous group.\n\nAccording to the paper, those deeply affected by Mysticity were confirmed to show a very great prominence in communicating with others and empathizing and interacting with emotions. They even confirmed that deep understanding of each other is possible by sensing and interacting with the other party's emotional state or intention even without language or visual information. \n\n However, the anonymous group showed a negative perception of the future in the paper's suggestion, saying \"This ability to understand others is only used in war. Perhaps they are a sad variant born of war. The collapse of civilization will be faster than the time to understand each other.\""
 BA_news.147.a:0 "Our research results justify our actions"
 BA_news.147.b:0 "Poor people..."
 BA_news.147.c:0 "If we could communicate with others without misunderstanding.. would peace come?"

 BA_news.148.t:0 "The Silver Reaper of Iceland"
 BA_news.148.desc:0 "Elite units of the international coalition dispatched to search for Iceland survivors have all gone missing. The only clue found at the scene, where only horrific traces of combat remained, was a single girl called the 'Silver Reaper.' Along with this shocking tragedy, omens of the 'Chroma' trying to swallow the world are being observed simultaneously in various places, and the world is falling into huge chaos."
 BA_news.148.a:0 "I feel sorry for them"
 BA_news.148.b:0 "That girl is an Abydos student?"
 BA_news.148.c:0 "A monster of a girl... I should prepare thoroughly"

 BA_news.149.t:0 "Brittany Peace Operation Commenced"
 BA_news.149.desc:0 "Brittany became an anarchic zone after criminal organizations effectively seized all administration after the Great Transfer. Each academy had considered intervention in Brittany, but it was forgotten from memory along with the disappearance of the Student Council President and the rising clouds of war in Kivotos.\n\n However, news has arrived today that machine forces have begun military-police operations to restore order in Brittany. It was stated that this operation will aim for the stability and maintenance of Brittany citizens and strict execution toward criminal groups. \n\nWhile most academy states are reluctant to express opinions on this operation, some have doubts about whether the machine forces showing a fanatical obsession toward peace will end with the Brittany Peace Operation, and there is a view that interprets the invasion itself as a message toward all of Kivotos."
 BA_news.149.a:0 "For the peace"
 BA_news.149.b:0 "It's concerning"
 BA_news.149.c:0 "One anarchic zone will vanish"

 BA_news.150.t:0 "Final War"
 BA_news.150.desc:0 "The machine force 'Decagrammaton' has entered into a full-scale military action against the remaining Kivotos forces by mobilizing all machine legions under its command. In this attack, which was carried out simultaneously at each front, large-scale armored units and air wings trying to seize air supremacy were mobilized, and in particular, multiple special individuals named 'Prophets' were reported to be breaking through defensive lines in the vanguard. This attack is analyzed as a systematic invasion aiming for the subjugation of all organisms, beyond simple local warfare.\n\n Leaders of major academy states officially defined it as the 'Final War' on which the survival of civilization beyond academies depends and immediately declared a total mobilization order. A Gehenna spokesperson stated \"This is a war for extermination, not negotiation,\" adding \"It will be the last resistance of all intelligent life.\""
 BA_news.150.a:0 "For the peace"
 BA_news.150.b:0 "Fight until the end"

 BA_news.151.t:0 "The End of SCHALE"
 BA_news.151.desc:0 "Early this morning, all communication with the autonomous district 'SCHALE,' which was considered the hope of Kivotos even after the Student Council vanished, was cut off. According to sources that approached the scene, it was confirmed that SCHALE was completely occupied by Decagrammaton's machine legion, and there was no internal resistance.\n\n Most tragically, the 'Shittim Chest,' which was the core system of SCHALE, has finally fallen silent. The signal from the management AI 'Arona' has completely vanished, and currently the system appears to be under Decagrammaton's control.\n\n Simultaneously, a terrifying change was observed in the Sanctum Tower, which was the symbol of Kivotos. Overnight, the tower was covered in unknown metal and golden starlight, transforming into a giant mechanical spire whose original form cannot be recognized."
 BA_news.151.a:0 "We shall advance"
 BA_news.151.b:0 "..."

 BA_news.153.t:0 "Second American Civil War"
 BA_news.153.desc:0 "The last legacy of the Great Transfer has finally reached America. The second Great Depression and the resulting political and social conflicts became the opportunity for the North and South of America to oppose each other in less than 100 years. The administration and delegation of CSA President [CSA.GetLeader] officially declared withdrawal from the Union, mimicking Jefferson Davis's speech.\n\nThe federal government declared this treason and entered into immediate response procedures, while the Rust Belt states, feeling terror at the second civil war, seem to have formed a voluntary neutral zone with General Omar Bradley acclaimed as commander."
 BA_news.153.a:0 "Hang the traitors!"
 BA_news.153.b:0 "The house is divided."

 BA_news.154.t:0 "Nominal Balkan Entente"
 BA_news.154.desc:0 "The 'Balkan Pact' signed in Athens in 1934 by [GRE.getadjective], [ROM.getadjective], [TUR.getadjective], and [YUG.getadjective] to establish a united front against Bulgaria's territorial expansion plans aimed for geopolitical status quo in the region after the end of the Great War. However, as the geopolitical composition changed after the Great Transfer, the parties of the Balkan Entente are each seeking their own path. The treaty signers will no longer guarantee each other's independence, which will cause [ITA.GetAdjective] influence in the Balkans to deepen."
 BA_news.154.a:0 "The fire is lit in the powderkeg."

 BA_news.155.t:0 "[SOV.GetAdjective] Declaration of European Liberation"
 BA_news.155.desc:0 "To commemorate the recent victory of [SOV.GetAdjective] against Kivotos academy states, a large-scale military parade was held in [SOV.GetCapitalVictoryPointName] starting this morning. [SOV.GetLeader] of [SOV.GetAdjective] delivered a speech celebrating the great victory. In the speech, [SOV.GetLeader] stated \"We achieved a victory that never existed before. The source of this great victory lies in the unity of the [SOV.GetAdjective] people, the massive power of the army, and the bravery and labor of the [SOV.GetAdjective] people!\""
 BA_news.155.a:0 "Eternal glory to the heroes who fought for the motherland!"
 BA_news.155.b:0 "A liberator of Europe? Or a new ruler?"

 BA_news.156.t:0 "Lwów Resolution of [Getyear]"
 BA_news.156.desc:0 "Ambassadors of [POL.getfactionname] member states met with leaders of [RSA.getname] in Lwów. They recognized that the activities and support of [RSA.getname] are essential for the end of the [SOV.getname] system and resolved for [RSA.getname] to form a close military cooperation system with [POL.getfactionname] to solidify an alliance toward achieving their goals."
 BA_news.156.a: "[SOV.getname] Bring an end to the system!"
 BA_news.156.b: "Traitors!"
 BA_news.156.c: "Clever."

 BA_news.157.t:0 "Collapse of [GEM.GetName]"
 BA_news.157.desc.makoto:0 "Now that the Pandemonium Society Parliament building has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, Hanuma Makoto, the charisma and leader of Pandemonium Society since before the Great Transfer, had no choice but to admit the total defeat of [GEM.GetName].\n\nMakoto calmly surrendered to the [ROOT.GetAdjective] army instead of fleeing, but while she personally contacted the victor's army for a surrender declaration, she bought time for her aides and the guards to go into exile abroad. Even the [ROOT.GetLeader] side was greatly surprised by the Noblesse Oblige shown by Makoto beyond expectations."
 BA_news.157.desc.ibuki:0 "Now that the Pandemonium Society Parliament building has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, Tanga Ibuki, the symbol of Pandemonium Society and noblewoman of Gehenna, had no choice but to admit the total defeat of [GEM.GetName].\n\nIbuki left a personal thank you message to her most precious Pandemonium colleagues just before defeat and surrendered to the [ROOT.GetAdjective] side. The surrender of [ROOT.GetName] appears to mean the end of Pandemonium Society history."
 BA_news.157.desc.satsuki:0 "Now that the Pandemonium Society Parliament building has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, it seems that no scientific technology, including NK Ultra, can change the defeat of Pandemonium Society.\n\nSatsuki left a personal thank you message to her most precious Pandemonium colleagues just before defeat and surrendered to the [ROOT.GetAdjective] side. The surrender of [ROOT.GetName] appears to mean the end of Pandemonium Society history."
 BA_news.157.desc.chiaki:0 "Now that the Pandemonium Society Parliament building has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, it seems no pen tip of Chiaki, the most capable journalist of Pandemonium Society, can change the war situation.\n\nChiaki left a personal thank you message to her most precious Pandemonium colleagues just before defeat and surrendered to the [ROOT.GetAdjective] side. The surrender of [ROOT.GetName] appears to mean the end of Pandemonium Society history."
 BA_news.157.desc.iroha:0 "Now that the Pandemonium Society Parliament building has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, even Iroha, the strategist of Pandemonium Society, can no longer speak of a 'Pandemonium victory.'\n\nWhile commanding the last division and personally boarding the Toramaru to engage the [ROOT.GetAdjective] army, Iroha was heroically taken prisoner. Although defeated, Iroha's resistance gave a great shock to many citizens."
 BA_news.157.desc.generic:0 "Now that the Parliament building in Gehenna's Central District has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, the history of the Pandemonium Society leading from the Gehenna Student Council seems to have come to an end. Officials are already writing surrender documents and entering into late negotiations."
 BA_news.157.a:0 "Does this mean the end of [GEM.GetName]?"
 BA_news.157.b:0 "Major things are happening in Kivotos!"

 BA_news.158.t:0 "Collapse of [GEH.GetName]"
 BA_news.158.desc.ako.generic:0 "Now that the Prefect Team headquarters has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, it seems even the legendary military leader of Gehenna, Sorasaki Hina, has no ability left to change the war situation.\n\nHina, who was psychologically dependent on Amau Ako due to emotional instability after the Great Transfer, was so shrunken that she could not even write a surrender statement or anything else, and fled abroad in Ako's car without even changing out of her pink pajamas."
 BA_news.158.desc.ako.nagisa:0 "Now that the Prefect Team headquarters has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, it seems even the legendary military leader of Gehenna, Sorasaki Hina, has no ability left to change the war situation.\n\nHina, who was psychologically dependent on Amau Ako due to emotional instability after the Great Transfer, was so shrunken that she could not even write a surrender statement or anything else, and seems to have lived in seclusion at home, giving up everything, until she received a guarantee of safety from Nagisa and came to the surrender table."
 BA_news.158.desc.hina:0 "Now that the Prefect Team headquarters has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, it seems even the legendary military leader of Gehenna, Sorasaki Hina, has no ability left to change the war situation.\n\nWhile engaging the [ROOT.GetAdjective] army at the last front, Sorasaki Hina was heroically taken prisoner. Although defeated, Hina's resistance gave a great shock to many citizens."
 BA_news.158.desc.iori:0 "Now that the Prefect Team headquarters has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, it seems even the legendary military leader of Gehenna, Sorasaki Hina, has no ability left to change the war situation.\n\nAfter handing over all authority to Shiromi Iori, Sorasaki Hina was taken prisoner while helping refugees go into exile abroad at the border. Hina's capture appears to mean the total collapse of the Gehenna Prefect Team."
 BA_news.158.desc.generic:0 "Now that the Prefect Team headquarters has been occupied due to attacks from the [ROOT.GetNameDef] side and the [ROOT.GetAdjective] flag is flying in key cities, the history of the Gehenna Prefect Team seems to have come to an end today. Planning department officials delivered surrender documents to the [ROOT.GetAdjective] occupation army, and now the influence of the Prefect Team remains only at the level of local guerrillas."
 BA_news.158.a:0 "Does this mean the end of [GEH.GetName]?"
 BA_news.158.b:0 "Major things are happening in Kivotos!"
 
 BA_news.159.t:0 "Collapse of [TRM.GetName]"
 BA_news.159.desc.generic:0 "In the Gehenna-Trinity War, [TRM.GetNameDef] seems to have entered its final stage.\n\nMost of its territory has already been swallowed by Gehenna's troops, and all that remains are the remnants suffering from greatly lowered morale and large-scale desertion. Nevertheless, they hope for a miracle to save them and continue resisting even though almost all hope has vanished.\n\nSome [TRM.GetAdjective] leaders are already meeting with opposing generals to negotiate terms for the unavoidable total surrender."
 BA_news.159.a:0 "Does this mean the end of [TRM.GetName]?"
 BA_news.159.b:0 "Major things are happening in Kivotos!"

 BA_news.160.t: "Granada Declaration"
 BA_news.160.d: "The [SPR.getname] government and the [FRA.getname] government joined hands to overcome the territorial loss caused by the Great Transfer. This treaty, which condemns [WHY.getname] and [MIL.getname], the two axes of otherworldly-Bolshevism, and mutually supports the Second Reconquista and mainland reclamation battle while maintaining future diplomatic-military cooperation, was declared in Granada, the place where [SPR.getadjective] completed the Reconquista in past history, showing their strong will toward their goals."
 BA_news.160.a:0 "Long live the anti-Kivotos ranks!"
 BA_news.160.b:0 "Otherworldly-Bolshevism?"
 
 BA_news.161.t: "Inauguration of Acting President Kaya"
 BA_news.161.d: "The power struggle over the acting position of the Student Council seems to have ended with the end of the Acting President Rin regime. According to what was revealed at a press conference this morning, the no-confidence vote for the suspension of acting authority passed easily with the majority votes of the Student Council executives, so Acting President Rin Nanagami was impeached.\n\nThe next acting authority vote that took place immediately afterward elected Shiranui Kaya of the Defense Bureau unanimously, and while the Transportation and Adjustment Bureaus do not recognize the new Acting President, the trend of power seems to have already leaned toward the Defense Bureau."
 BA_news.161.a:0 "Let's wish the new Acting President luck."
 BA_news.161.b:0 "Ominous."
 
 BA_news.162.t: "Valkyrie's Withdrawal from the Kivotos Federation"
 BA_news.162.d:0 "While many academies established their own academy systems by leaving the Kivotos Federation while exercising strong autonomy after the Great Transfer, Valkyrie Police Academy, which had deep ties with the Student Council, remained in the Kivotos Federation until now. However, as the Student Council's authority fell after a series of events, the Valkyrie leadership moved beyond the gradual exercise of autonomy and broke ties with the Student Council by withdrawing from the Kivotos Federation itself.\n\nThe Student Council did not express any position, but according to an anonymous administrator, the Administrative Committee is reportedly extremely angry at Valkyrie's decision."
 BA_news.162.a:0 "Let's become the masters of our destiny."
 BA_news.162.b:0 "Traitors!"
 BA_news.162.c:0 "Then who will maintain public safety there?"
 
 

# Atomic Bomb Drop Events #
 BA_nuke.0.t:0 "Arona Struck by Nuclear Attack"
 BA_nuke.0.d:0 "Arona, the general AI of [SHE.GetName], was struck by a direct nuclear attack from a hostile nation around 2 AM today. Although a powerful anti-air defense system existed because [SHE.GetName]'s capital, where Arona's AI base exists, was expected to be a target of strategic bombing at any time, Arona was significantly destroyed by the direct nuclear strike.\n\nWhile [SHE.GetName]'s destructive war seems to have met its end, it seems the complete destruction of Arona was not achieved by this nuclear attack, and since Arona also has various measures prepared for nuclear attack, recovery is expected to finish faster than expected."
 BA_nuke.0.a:0 "Is [SHE.GetName] finally falling?"
 BA_nuke.0.b:0 "Ah."

# Fall Events #
 fallnews.1.t:0 "Fall of Eden"
 fallnews.1.d:0 "\"The sun trembles, and the earth sighs. The city has fallen! The city has fallen!\" After a brutal battle, the Gehenna flag finally hung over the clock tower, the symbol of Trinity. It became clear that Eden is now in the hands of Gehenna. Trinity students tried to stop the advance by blowing up bridges to protect the city until the end, and fierce resistance continued, but ultimately it was not enough to stop the march of demons.\n\nDespite the persistent resistance of Trinity soldiers, Gehenna forces also seized the Cathedral of Commiseration. Now, the Gehenna flag is fluttering in the wind over the cathedral. With this, the battle in Eden has ended."
 fallnews.1.a:0 "Eden has fallen?"
 fallnews.1.b:0 "Yes, it's not the thousand-year capital anymore."
 fallnews.1.c:0 "Holy Mother, be silent and do not wail, for we shall return to you."

 fallnews.2.d:0 "Trinity's thousand-year capital, Eden, has finally fallen after the resolute and persistent offensive of the [SOV.GetAdjective] side. Sporadic resistance continued, but the [SOV.GetAdjective] side officially declared the surrender of Trinity military power, announcing the end of the Battle of Eden. There were attempts to resist until the end, but ultimately it was not enough to change the war situation.\n\nTrinity engineers tried to stop the advance by blowing up bridges, but [SOV.GetAdjective] forces neutralized them and succeeded in crossing the river. Subsequently, they occupied the Cathedral of Commiseration and completed a symbolic victory by hoisting the flag of [SOV.GetAdjective] on it. With this, the battle in Eden has ended."
 fallnews.2.b:0 "The flame of revolution burns forever!"

 fallnews.3.t:0 "Liberation of Paris"
 fallnews.3.d:0 "It was confirmed that the French capital Paris was liberated from the occupation of [MIL.GetNameDef]. The French army entered Paris, and Paris citizens are cheering the marching 'Liberation Army.'\n\n[MIL.GetNameDef] leadership fled, and it seems not much time is left for [MIL.GetNameDef]'s fate. Now, the Tricolour of the 'Motherland' France, not the flag of the 'Oppressor' Millennium, is flying on Millennium Tower."
 fallnews.3.a:0 "Vive la France!"

 fallnews.4.t:0 "Fall of Hyakkiyako"
 fallnews.4.d:0 "It was confirmed that Hyakkiyako, the capital of [HYA.GetNameDef], was occupied by the Shanhaijing army. Beautiful cherry blossom trees and wooden buildings of Hyakkiyako were burned down due to the offensive and defensive battle over the city, and now it might take hundreds of years to reconstruct the pink city like before.\n\nSince Hyakkiyako, a major city of Hyakkiyako, has fallen, the future of Hyakkiyako is not bright."
 fallnews.4.a:0 "The day spring flowers fall."

 fallnews.5.t:0 "Fall of Shanhaijing Central Special District"
 fallnews.5.d:0 "It was confirmed that the Shanhaijing Central Special District, the capital of Shanhaijing with a long history, fell to the Hyakkiyako army last night. The Hyakkiyako army crossed the Danube River and is judged to have occupied the heart of the Shanhaijing Central Special District. In the Shanhaijing Central Special District, which has become like a ruin, the engagement between the Shanhaijing garrison and the Hyakkiyako army is still continuing in the outskirts.\n\nHowever, the Shanhaijing leadership has moved the capital, and now it is judged that long-standing traditions will be hard to continue."
 fallnews.5.a:0 "The end of Shanhaijing Central Special District."

 fallnews.6.t:0 "Fall of Warsaw"
 fallnews.6.d:0 "Trinity forces succeeded in occupying Warsaw, the capital of [POL.GetNameDef], after a fierce battle.\n\nSporadic fighting by militias in Warsaw has continued until now, but organized resistance seems to have stopped. The center of Warsaw has fallen into Trinity's hands, and Poland, having lost its capital, suffered a major blow to its war effort.\n\nThe first button of Trinity's ambition for eastward advance has been fastened, and Eastern European nations, including Russia, can't help but feel the threat of war clearly."
 fallnews.6.a:0 "Poland had no hope."
 fallnews.6.b:0 "Hail Trinity!"

 fallnews.7.t:0 "Fall of Gehenna Central District"
 fallnews.7.d:0 "It was confirmed that the Gehenna Central District was occupied by Trinity forces. After Trinity's fierce offensive, the Gehenna side decided to withdraw from the Central District, which will be of great benefit to Trinity's war effort.\n\nThe Central District, the heart of Gehenna and the city of evil, was occupied by a more evil evil, and Gehenna's future is not bright."
 fallnews.7.a:0 "Gehenna's fate isn't much longer either."
 fallnews.7.b:0 "Drive out Gehenna!"

 fallnews.8.t:0 "Fall of Gehenna South District"
 fallnews.8.d:0 "It was confirmed that the Gehenna South District was occupied by Trinity forces. Trinity occupied the South District, a strategic point in southern Gehenna, and gained control of the Bavarian region. This is expected to further worsen Gehenna's war effort capacity, and Gehenna's future has darkened."

 fallnews.9.t:0 "Fall of Liverpool"
 fallnews.9.d:0 "The fall of Liverpool was confirmed as Chronos School reported the Kaiser PMC's complete seizure of the city in Liverpool, which was the last resistance site of the British army. Britain had waged a long struggle against Kaiser Corporation, which possessed overwhelmingly superior forces, for over two months after the Great Transfer, but ultimately could not stop Kaiser PMC's overwhelming military power from entering Liverpool.\n\nThe British army blew up the Royal Albert Dock bridge of the River Mersey as a last resistance, but this ended in meaningless effort and Kaiser Corporation soon seized the city center.\n\nWith the fall of Liverpool, British resistance has effectively come to an end. As the last human resistance in the British Isles ends tragically, the last remnants of the Great Transfer are vanishing."
 fallnews.10.d: "When the last resistance point of the Kaiser army was suppressed, the battle in London ended. All sirens were lifted and immediately joyful crowds poured into the streets, praising their liberator, the British army, and church bells rang out in the streets.\n\nThe occupation and oppression by the Kaiser army have finally ended, and all of Britain is swept in the enthusiasm of liberation. While regions still under Kaiser Corporation rule will eventually be suppressed, it was reported that spontaneous uprisings are also occurring. Can Britain finally reclaim its freedom?"

 # Super Events #
 BA_Super_Event_asd:0 "Mika's Rise to Power"
 sp_event_asd_QUOTE:0 "Students have their own circumstances, and even if I can't know a student's true heart, I can understand them, and I have no choice but to believe in them until the end. That is what I, as a teacher and an adult, can do.\n...Mika is not a witch."
 sp_event_asd_QUOTE_NAME:0 "- Sensei"
 sp_event_asd_REMARK:0 "The balance is broken"

 sup_aby_cze_union:0 "Trinity-Soviet War"
 sup_aby_cze_union_QUOTE:0 "Our cause is just,\nthe enemy will be defeated,\nvictory will be ours!"
 sup_aby_cze_union_QUOTE_NAME:0 "- Yuri Levitan"
 sup_aby_cze_union_REMARK:0 "The Last War"

 sup_untiy_germay:0 "Implementation of the Union Act"
 sup_untiy_germay_QUOTE:0 "One Trinity, eternal!"
 sup_untiy_germay_QUOTE_NAME:0 "- Misono Mika"
 sup_untiy_germay_REMARK:0 "Trinity does not scatter."

 sup_invasion_another_dimension:0 "Invasion of the Chroma"
 sup_invasion_another_dimension_QUOTE:0 "The oldest and strongest emotion of mankind is fear, and the oldest and strongest kind of fear is fear of the unknown."
 sup_invasion_another_dimension_QUOTE_NAME:0 "- H.P. Lovecraft"
 sup_invasion_another_dimension_REMARK:0 "It is the color out of space."

 sup_trinity_gehenna_war:0 "Gehenna-Trinity War"
 sup_trinity_gehenna_war_QUOTE:0 "If an injury has to be done to a man, it should be so severe that\nhis vengeance need not be feared."
 sup_trinity_gehenna_war_QUOTE_NAME:0 "- Niccolò Machiavelli"
 sup_trinity_gehenna_war_REMARK:0 "The end of a long ill-fated history"

 sup_Kivotos:0 "One Kivotos"
 sup_Kivotos_QUOTE:0 "When a flash of the subconscious tells you what to do, cast aside doubtful thoughts and take action immediately. The thought of waiting for the right time only leads to failure."
 sup_Kivotos_QUOTE_NAME:0 "- Author Unknown"
 sup_Kivotos_REMARK:0 "Banzai!"

 sup_france:0 "The Return of France"
 sup_france_QUOTE:0 "In days of glory, I was with you. In difficult days, I remain by your side."
 sup_france_QUOTE_NAME:0 "- Philippe Pétain"
 sup_france_REMARK:0 "Vive la France!"

 sup_britain:0 "The United Kingdom Reclaims Britain"
 sup_britain_QUOTE:0 "We shall not flag or fail. We shall go on to the end. We shall fight on the seas and oceans. We shall fight with growing confidence and growing strength in the air."
 sup_britain_QUOTE_NAME:0 "- Winston Churchill"
 sup_britain_REMARK:0 "Rule the Britain!"

 sup_GER_mil:0 "The Wehrmacht Unifies Germany"
 sup_GER_mil_QUOTE:0 "When the situation is unclear, attack."
 sup_GER_mil_QUOTE_NAME:0 "- Heinz Guderian"
 sup_GER_mil_REMARK:0 "The Eagle revives"
 BA_Munich:0 "Munich"
 BA_Frankfurt:0 "Frankfurt"
 BA_Essen:0 "Essen"
 BA_Hamburg: "Hamburg"
 
 sup_HUN_BALKAN:0 "Balkan Unification"
 sup_HUN_BALKAN_QUOTE:0 "Hear the cry of the last decisive struggle,\nO people, let's stand under the banner of liberation!\nFor the victory of the true master of history!"
 sup_HUN_BALKAN_QUOTE_NAME:0 "From 'The Internationale'.."
 sup_HUN_BALKAN_REMARK:0 "Forward, and forward, under the International banner!"

 sup_BA_superevent_Middle_Asia_war: "Middle East War"
 sup_BA_superevent_Middle_Asia_war_QUOTE: "The evil that we have so faithfully and so constantly tried to prevent has fallen upon us."
 sup_BA_superevent_Middle_Asia_war_NAME: "- George VI"
 sup_BA_superevent_Middle_Asia_war_REMARK: "What can I say?"

 sup_mil_key: "The Princess of the Nameless Gods"
 sup_mil_key_QUOTE:  "Confirming that the attacks obstructing us have stopped. From now on, correcting errors and guiding the <Princess> to the throne where she rightfully belongs."
 sup_mil_key_QUOTE_NAME: "- Key"
 sup_mil_key_REMARK: "The door opens."

 sup_mil_atrahasis: "Ark of Atrahasis"
 sup_mil_atrahasis_QUOTE: "The Princess has the key in hand, and the Ark is prepared. By the request of the Nameless Priests, a new sanctuary is established on this land."
 sup_mil_atrahasis_QUOTE_NAME: "- Key"
 sup_mil_atrahasis_REMARK: "The New Ark."

 sup_China_Japan_War: "Sino-Japanese War"
 sup_China_Japan_War_QUOTE: "Others are the knives and the plates. \nWe are the meat and the fish."
 sup_China_Japan_War_QUOTE_NAME: "- Sun Yat-sen"
 sup_China_Japan_War_REMARK: "The War Commences."

 sup_launch_vehicle: "Satellite"
 sup_launch_vehicle_QUOTE: "Now, somehow, in some way, the sky looked very strange. Because I never imagined another country would take technical superiority over our great country."
 sup_launch_vehicle_QUOTE_NAME: "- Lyndon B. Johnson"
 sup_launch_vehicle_REMARK: "The Earth is blue."

 sup_teaparty_nuked: "March of the Dead"
 sup_teaparty_nuked_QUOTE: "Although a soldier by profession,\nI have never felt any sort of fondness for war."
 sup_teaparty_nuked_QUOTE_NAME: "- Ulysses S. Grant"
 sup_teaparty_nuked_REMARK: "Death approaches."

 sup_sov_pol_war: "War on the Eastern European Plain"
 sup_sov_pol_war_QUOTE: "Rush to the west! Beyond the corpses of the White Poles\n lies the path stretching to the whole world! \nAdvance to Vilnius, Minsk, Warsaw!"
 sup_sov_pol_war_QUOTE_NAME: "- Mikhail Tukhachevsky"
 sup_sov_pol_war_REMARK: "The fuse has burnt out."

 sup_Soviet_Win: "Victory Day"
 sup_Soviet_Win_QUOTE: "I wanted to shout to those who are sleeping eternally\nin the land we passed through. Comrades, we did it!"
 sup_Soviet_Win_QUOTE_NAME: "- Vasily Grossman"
 sup_Soviet_Win_REMARK: "The Will of the People"

 sup_redwinter_civilwar: "Red Winter Civil War"
 sup_redwinter_civilwar_QUOTE: "We are firmly convinced that liberty without socialism is privilege and injustice; and that socialism without liberty is slavery and brutality."
 sup_redwinter_civilwar_QUOTE_NAME: "- Mikhail Bakunin"
 sup_redwinter_civilwar_REMARK: "It is not a right if you did not earn it."
 
 sup_HYA_SHA_war: "South Kivotos War"
 sup_HYA_SHA_war_QUOTE: "Royal ethos discarded in the creeping forest,\nSudetenland covered in thorns of the warring states era,\nAs if dragons and tigers devour each other,\nThe war ends in madness and reaches this country."
 sup_HYA_SHA_war_QUOTE_NAME: "- Li Bai, Gufeng"
 sup_HYA_SHA_war_REMARK: "War of the Dragon and Tiger"

 sup_united_nations: "Rebirth of the League of Nations"
 sup_united_nations_QUOTE: "The sun will surely meet the morning,\nthe river must surely flow to the sea,\na new day for all mankind breaks,\nand our children shall live freely!"
 sup_united_nations_QUOTE_NAME: "From 'United Nations on the March'..."
 sup_united_nations_REMARK: "And the Allies are marching!"
 
 sup_68_revolutions: "Completion of the '68 Revolution"
 sup_68_revolutions_QUOTE:  "Be realistic, demand the impossible."
 #Soyez réalistes, demandez l'impossible.
 sup_68_revolutions_NAME: "- Slogan of the French '68 Revolution"
 sup_68_revolutions_REMARK: "Forbid the forbidding!"
  
 sup_com_aru_german_reunification: "Implementation of the Union Act"
 sup_com_aru_german_reunification_QUOTE: "Operations haven't even started yet,\nand you're already worrying about failure?"
 sup_com_aru_german_reunification_QUOTE_NAME: "- Rikuhachima Aru"
 sup_com_aru_german_reunification_REMARK: "So, was the result a success?"

 sup_GEI_DEC: "Contingency"
 sup_GEI_DEC_QUOTE: "Come unto me, all ye that labour and are heavy laden, and I will give you rest."
 sup_GEI_DEC_QUOTE_NAME: "Matthew 11:28"
 sup_GEI_DEC_REMARK: "Is a false paradise still a paradise?"
 
 sup_COU_KAYA_LETSGo: "Kaya's Inauguration as Student Council President"
 sup_COU_KAYA_LETSGo_QUOTE: "...Methods like that, like ochlocracy,\ncan solve nothing.\nKivotos must be commanded by a superhuman."
 sup_COU_KAYA_LETSGo_QUOTE_NAME: "- Shiranui Kaya"
 sup_COU_KAYA_LETSGo_REMARK: "Raising the head in the darkness"
 
 sup_gehenna_reunification_benriya: "Reunification of Gehenna"
 sup_gehenna_reunification_benriya_QUOTE: "It's good that there's nothing to be tied to or hurt by,\nbut still, being alone is lonely."
 sup_gehenna_reunification_benriya_QUOTE_NAME: "- Onikata Kayoko"
 sup_gehenna_reunification_benriya_REMARK: "It's more fun together"
 
 sup_gehenna_reunification_prefect_team: "Reunification of Gehenna"
 sup_gehenna_reunification_prefect_team_QUOTE: "...Whatever happens, the Prefect Team's duty remains unchanged.\nIt's business as usual."
 sup_gehenna_reunification_prefect_team_QUOTE_NAME: "- Sorasaki Hina"
 sup_gehenna_reunification_prefect_team_REMARK: "For the Order"
 
 sup_gehenna_reunification_pandemonium_society: "Reunification of Gehenna"
 sup_gehenna_reunification_pandemonium_society_QUOTE: "If the world becomes peaceful... agonizing things will vanish.\nThat won't happen if we can control people, right?"
 sup_gehenna_reunification_pandemonium_society_QUOTE_NAME: "- Kyogoku Satsuki"
 sup_gehenna_reunification_pandemonium_society_REMARK: "Conquest for Peace"

 # Arius Events #
 ARI_all_blood.t:0 "'All Blood is Equal' Speech"
 ARI_all_blood.desc:0 "Students! Let us look back at our past. Let us remember a time even further back than when we were under Beatrice's oppression. If the Student Council President at that time truly possessed 'noble' blood, would we have fallen into that oppression? Would we have groaned under that tyranny? Also, is there any record of the possessors of noble blood resisting Beatrice's rule? They were also Beatrice's collaborators, and even before that, they showed no will to quell the chaos of the satellite school. Therefore, today. As the right of noble blood is granted to all students, I hope everyone remembers that all blood is noble."
 ARI_all_blood.a:0 "It was a good speech."
 ARI_to_vitory_at_last.t:0 "'For the Final Victory' Speech"
 ARI_to_vitory_at_last.desc:0 "All students of Arius! All people of Arius Satellite School! All the people! Several months, several years have already passed since we arrived on this land. Living here, we learned the words, thoughts, and ideas of this place. As such, we accepted dedicating ourselves to the propertyless masses of the world as the mission bestowed upon us by the Lord. However, accepting it like that alone is not enough. We must act, and for the results following those actions, everyone Arius can reach, all the people, the entire school must be mobilized. For the final victory, everyone must act."
 ARI_to_vitory_at_last.a:0 "As the body without the spirit is dead, so faith without deeds is dead."
 ARI_soviet_diplomacy.t:0 "Contact with the Soviet"
 ARI_soviet_diplomacy.desc:0 "\"Comrade General Secretary. I have come because there is something to report.\" \"Ah, Comrade Molotov. What is it?\" \"A girl calling herself the ambassador of 'Arius Satellite School' requested to establish diplomatic relations.\" \"That can't be right, can it? I've never heard of such a country. It must be the nonsense of a madman.\" \"Simply to conclude as such, where she was found is concerning.\" \"Where was she found?\" \"In the middle of the Baltic Sea, she was found by the Federal Navy. No signs of wreckage were confirmed. As a result of interrogation, she said she came here by swimming.\" \"In the middle of the Baltic Sea. Questions are compounding. Then for now, you handle it. If it's a matter important enough to swim across the Baltic Sea...\" \"Understood. Comrade General Secretary.\""
 ARI_soviet_diplomacy.a:0 "As such, contact with the Soviet ended."

 KAP_event.1.t:0 "Declaration of the Academy City Kapila"
 KAP_event.1.desc:0 "Finally, the long fight has ended. \nAll enemies were cut in half by Kohane's sword, \nand the land and resources gained with victory are \nsufficient to rebuild the Academy City. \nNow it's time to return to the daily life we missed."
 KAP_event.1.a:0 "It's a day I can be proud of before my Master."
 KAP_event.1.b:0 "We need to keep an eye on them"
 KAP_event.1.d:0 "We need to keep an eye on them"

 KAP_event.2.t:0 "Third Great Transfer"
 KAP_event.2.desc:0 "In search of the lost star.\nStory of those trying to rebuild, following traces.\nStory of those winning true freedom, facing destiny.\nStory of those chasing the stars.\n...\nAn imaginary story that a star shines."
 KAP_event.2.a:0 "We must find the star."
 KAP_event.2.b:0 "Does the Great Transfer keep repeating."
 KAP_event.2.d:0 "Does the Great Transfer keep repeating."
