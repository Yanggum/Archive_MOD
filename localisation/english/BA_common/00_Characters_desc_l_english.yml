 # Trinity General Academy
 TRN_Airi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LA cheerful member of Trinity's After-School Sweets Club. Possessing a relaxed and easygoing nature, she treasures the time spent chatting and eating desserts with her friends above all else. Her favorite treat is sweet ice cream, and lately, she has been completely obsessed with the flavor of mint chocolate.§!"
 TRN_Yoshimi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LA small and cute frame, sparkling eyes, and... even a bit of a temper. She is often referred to by her friends as a 'small animal.' While she secretly harbors a complex about her short stature, she desires to become more mature than anyone else. Because of this, she always keeps her shoulders back at school or in front of her friends, trying her best to appear a bit more composed and grown-up. However, those serious resolutions are quickly exposed by the expressions that reveal themselves so plainly on her face.\n\nThere is a specific time when she shines the brightest: when she tours her favorite dessert cafes to taste seasonal limited-edition treats. Although she usually keeps her lips tightly pressed to look adult-like, all her worries vanish before a dessert, and a bright smile blooms unconsciously. That expression—looking as if a small animal full of anticipation has found its favorite food—is lovely enough to make everyone around her happy.§!"
 TRN_Natsu_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LA member of Trinity's After-School Sweets Club, the lead troublemaker, and a self-proclaimed romanticist. She has a habit of saying strangely philosophical things or using dessert metaphors to describe everything. She often puts those around her in difficult spots with her eccentricities, but it all stems from a pure heart that wants to share 'romance' with everyone. Since her definition of 'romance' is constantly changing, one cannot deny the impression that everyone is being 'swept along' by Natsu's pace.§!"
 TRN_Kazusa_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LA member of the After-School Sweets Club with a laid-back and quiet personality. She tends not to express herself much and usually follows the lead of the other members. While she often suffers from being caught up in the antics of those around her, she secretly treasures those moments as well.§!"
 TRN_Mika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§LOne of the members of the Tea Party, she is a childhood friend of Nagisa, another head of the Tea Party. However, as they stand in positions of political opposition, they maintain a clear distinction between public and private affairs. Though she is a girl who usually shows a bright and cheerful side, always smiling as if enjoying herself, she hides worries on the inside that she cannot easily tell others, making her true depths difficult to read.§!"
 TRN_Nagisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§LOne of the members of the Tea Party. While she has a gentle and kind manner of speech, she does not easily reveal her true intentions, making it difficult for those around her to approach or feel comfortable with her. Her hobby is preparing tea leaves and snacks for the tea parties, and many students at Trinity admire the tea parties she hosts.§!"
 TRN_Seia_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§LSeen by those around her as pedantic and elusive, she possesses an almost selfish, aristocratic demeanor. Since the incident, she is often seen approaching matters with more stubbornness and seriousness than before.§!"
 TRN_Sakurako_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§LA devout student and sister of the Trinity Sisterhood. She is serious in all matters and enjoys deep trust from many people. While she always approaches her duties with a pious heart, her stiff nature sometimes makes her feel out of touch with trends or common sense.§!"
 TRN_Wakaba_Hinata_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§LA sincere and kindhearted girl belonging to the Sisterhood. As the person in charge of the heavy responsibility of maintaining the Trinity Cathedral, she completes her assigned tasks diligently and is kind to everyone. However, due to her clumsy nature, she frequent makes mistakes and tends to lack self-confidence. The bag she always carries contains a massive, deployable grenade machine gun, but she has never once shown a sign of it being heavy.§!"
 TRN_Mari_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§LA devout and benevolent girl of the Sisterhood. She always greets Trinity students with a kind and gentle smile. Despite her cute appearance, her calm and comforting aura draws many students to her for counseling. Because she always feels she is lacking, she dreams of becoming a wonderful sister like her seniors.§!"
 TRN_Kozeki_Ui_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n§LThe head of the Trinity Library Committee. A girl who loves books so much she says she prefers them over people, she especially likes old books where one can feel the passage of time. She usually spends her time holed up in the Old Library, which no one visits, reading or managing ancient texts.§!"
 TRN_Shimiko_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n§LA librarian belonging to the Trinity Library Committee. A bookworm girl who truly loves books, she is one of the few students who has read through the vast collection of the Trinity Library. She loves recommending books as much as she loves reading them, and tries to suggest books that fit the tastes of anyone she meets.§!"
 TRN_tsurugi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LThe head of the Trinity Justice Task Force and Trinity's official strategic weapon. Possessing a belligerent and violent personality, she tends to destroy anything she doesn't like on sight. Thanks to the competence of Vice-head Hasumi, the Justice Task Force is barely managed. While Tsurugi is like an uncontrollable mad dog, she also shows a girly side that cannot hide its embarrassment in front of certain individuals.§!"
 TRN_Hasumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LThe second-in-command of the Trinity Justice Task Force. She also serves as the tactical commander of the Justice Task Force in place of the icon of madness, Head Tsurugi. Because of this, she may appear like a calm and intellectual Trinity student, but she too is a member of the Justice Task Force. She can perform reckless actions with more composure than anyone else.§!"
 TRN_Ichika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LA member of the Justice Task Force who always maintains a relaxed expression. Even within the diverse group of the Justice Task Force, she is skilled at handling flexibility and coordination. She maintains good relations with other academies as well. Known for her gentle expression and kindness, these are actually results of her efforts rather than her natural disposition.§!"
 TRN_Mashiro_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LA sincere member of the Trinity Justice Task Force. She carries an anti-materiel sniper rifle that doesn't seem to fit her height and silently performs fire support missions. Although she is a girl of few words, she isn't necessarily shy or poor at interpersonal relationships; in fact, she becomes quite talkative when topics related to justice are mentioned.§!"
 TRN_Koharu_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LA member of the Trinity Justice Task Force. She considers herself an elite, but in reality, she is an idiot who can't even keep up with school lessons. She has a hobby of collecting lewd magazines, and even minor things can trigger lewd delusions that leave her red-faced with shame.§!"
 TRN_Ajitani_Hifumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_NONE$\n\n§LNeither her appearance nor her grades are particularly exceptional, but she is very popular thanks to her amiable and kind personality. She is a good listener for the worries and stories of those around her, but because of that, she sometimes gets swept up in the atmosphere and causes trouble unintentionally.§!"
 TRN_Hanako_advisor_desc: "$FROM_Trinity_Academy$$FROM_NONE$\n\n§LA kindhearted young lady. While she appears to be a very demure and elegant lady on the surface, she is a troublemaker who pours out all sorts of erotic talk once she opens her mouth. Students who know Hanako's true self become nervous and check their surroundings every time she starts to speak.§!"
 TRN_Mine_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§LA warrior in white who is upright and resolute, but also possesses a radical side. Her reputation(?) for 'Mine breaks it and the Knights heal it' is already famous throughout Trinity. When she has free time, she maintains her equipment or prepares tea to invite acquaintances and soothe their hearts. It is said that her expertise in black tea is by no means inferior even when compared to Hasumi of the Justice Task Force.§!"
 TRN_Serina_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§LA kind girl belonging to the Trinity Remedial Knights. A person of benevolent character who enjoys volunteer activities, she worries excessively about health, often earning her the reputation of being like a mother among her fellow students. While she is a soft-hearted girl who dislikes conflict and strife, she is always ready to stand firm and fight against enemies who threaten peace.§!"
 TRN_Hanae_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§LA bright and cheerful freshman of the Trinity Remedial Knights. Possessing a positive and energetic personality in all matters, she often causes a scene when seeing a patient, sometimes making the situation worse. Though she is an eccentric girl in many ways, it is said that patients who receive her cheers are mysteriously healed of any illness in no time.§!"
 TRN_Suzumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Trinity_Vigilante_Crew$\n\n§LA member of the Vigilante Crew responsible for the safety of Trinity students. As incidents of Trinity students being attacked by other academies became frequent, she volunteered to start street patrols to prevent them. Due to her burning sense of justice, she is often misunderstood as having a cool and cold personality, but in truth, she also has a kind side.§!"
 TRN_Reisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Trinity_Vigilante_Crew$§LA Vigilante Crew member who suddenly appears in various places around Trinity. Due to her loud and noisy atmosphere, she is sometimes mistaken for a prankster, but she is actually more serious about her vigilante activities than anyone else. She always introduces herself, but her intro line changes slightly every time.§!"

 TRK_yurijono_seia_desc: "$FROM_Trinity_Academy$§LMember of the Sanctus Faction\n\nSeen by those around her as pedantic and elusive, she has an almost selfish, aristocratic demeanor. Since her health returned, she is often seen showing a more stubborn and playful, childlike side.§!"
 TRK_kirifuji_Nagisa_desc: "$FROM_Trinity_Academy$§LMember of the Filius Faction§!\n\n§LWhile she has a gentle and kind manner of speech, she does not easily reveal her true intentions, making it difficult for those around her to approach or feel comfortable with her. Her hobby is preparing tea leaves and snacks for tea parties, and many Trinity students admire the tea parties she hosts.§!"

 TRN_Ninomae_Mirai_joke_leader_desc: "$FROM_Trinity_Academy$§LMember of the Pater Faction§!\n\n§LThe moment you think of the name Ninomae Mirai, the thought first occurs that there's no need to distinguish who that name refers to, or doesn't refer to. Honestly, the fact that such a thought even occurred isn't very important, but regardless, it makes one feel more at ease to say in advance that a single name is just placed here. I want to emphasize—really, truly emphasize—that the Ninomae Mirai appearing in this text is a character from a fan-fiction novel, and since only the name was borrowed, arguments like \"That's not how it is\" simply don't apply. Ninomae Mirai looks like she's doing something but is actually doing nothing, and looks like she's doing nothing but even that isn't certain. The place she stands is definitely 'somewhere,' but if one tries to explain where that somewhere is, the sentences just get unnecessarily long, and long sentences call forth other sentences while the story about the place quietly slips away. In this way, the story keeps heading into side paths, and upon those paths, unnecessarily sparkling words are laid out so that every time you step on them, it only feels like they make meaningless sounds. The name Ninomae Mirai contains 'Future' (Mirai), but that doesn't mean she intends to talk about the future, nor does she intend to talk about the past, and she doesn't particularly have anything to say about the present either. Nevertheless, the sentences continue to pretend to say something, and thanks to that pretending attitude, the reader looks at the next sentence with a glimmer of hope, but the next sentence also flows in a similar direction and forgets the concept of direction itself. Ultimately, this text appears to be related to Ninomae Mirai, but in reality, it is merely circling around the name, spilling flowery language, avoiding the subject, and replacing content with the volume of words. And to say it once more, this is strictly a fan-fiction novel and only the name was borrowed; the moment you try to find meaning or argue about settings, you are already far from the flow of this text. It will be perfectly fine to just leave the fact that rambling sentences like these are flowing by, and even that fact doesn't need to be held onto.§!"

 # Abydos High School
 ABY_Hoshino_advisor_desc: "$FROM_Abydos_Academy$\n\nTakanashi Hoshino, the only third-year student of Abydos High School and the spiritual pillar of the Foreclosure Task Force, appears at first glance to be just a cute lazybones who loves to sleep. Looking at her relaxed behavior, she feels more like a cute junior than a dignified senior. However, if Abydos High School—which she loves beyond measure—or her juniors fall into danger, her previous cute and gentle appearance vanishes, and she reveals a strong, resolute, and powerful side. Although she has a tendency to be swayed by emotions, her exceptional combat prowess renders even that recklessness moot, allowing her to crush and advance through anything in her way. Even she, who looks so strong, sometimes shows a clumsy or strange side. Even if her juniors ask about it, she ends up avoiding the answer. What is the untold story she keeps tucked away in her heart?"
 ABY_Shiroko_advisor_desc: "$FROM_Abydos_Academy$\n\nYou might fall in love with Sunaookami Shiroko, a second-year student of the Foreclosure Task Force, the moment you first meet her. Her beautiful, cute, and elegant appearance along with her calm, whispering, gentle voice might tickle your ears and pull you in, but she will quickly betray your expectations. With an active nature and stamina that no one can keep up with, the absurd opinions that pop out of her mouth—feeling as if they are tens of millions of years away from common sense—often baffle even the Foreclosure Task Force members who have known her for a long time. However, these aspects often become the catalyst that makes one feel her charm. Though a second-year, her unstoppable drive for action is reminiscent of a fresh first-year, yet her seasoned combat ability feels like a veteran third-year who has been through it all. Perhaps because of this, she is treated as a cute junior by Hoshino and Nonomi, while being respected as a strong senior by Serika and Ayane."
 ABY_Nonomi_advisor_desc: "$FROM_Abydos_Academy$\n\nIzayoi Nonomi, a second-year at Abydos High School, is the student who possesses the most senior-like demeanor. Her positive and bright manner of speech and behavior in all matters can sometimes exhaust the Foreclosure Task Force, but she always brightens the atmosphere of the group. Furthermore, she shows a motherly side by embracing everyone in the task force, gathering opinions, and preventing fights. Also serving as the task force's snack manager, she plays the role of always boosting everyone's morale. On the other hand, she occasionally pulls out something called a 'Golden Card.' It is said to be a card with no limit that can buy anything, but why hasn't she used it to pay off Abydos High School's debt? Questions arise sometimes, but the task force members do not dig deep. Perhaps Hoshino might know."
 ABY_Serika_advisor_desc: "$FROM_Abydos_Academy$\n\nKuromi Serika, the youngest of Abydos High School and a cute klutz, is often deceived. Instances where she is easily tricked and loses the money she worked hard to save are frequent, but at the same time, she can be called the most diligent student, playing the largest role in paying off Abydos High School's debt. Possessing a special affection for Abydos High School, she was cared for by everyone else who suggested using only money earned from working together to pay the debt rather than individual part-time job earnings—yet she is secretly spending her own part-time pay to settle the school's debt. While Serika can be forceful against the seniors' absurd claims—mainly Shiroko's—and speaks harshly at times, she is a girl who loves the Foreclosure Task Force more than anyone else in her heart."
 ABY_Ayane_advisor_desc: "$FROM_Abydos_Academy$\n\nOkusora Ayane, the secretary of the Foreclosure Task Force, is the youngest but shows the most adult-like appearance among the highly individualistic seniors. To put it another way, one might think she is boring and lacks personality, but among her eccentric seniors, she makes the personality of 'ordinariness' stand out. She faithfully fulfills her role as the common-sense member of the task force, frequently being swept along by her seniors or shooting down their outlandish ideas. At this point, one might feel that Ayane has no characteristics other than being ordinary, but that is not the case. It is just hard to see because she is overshadowed by those around her; Ayane is actually on the very intelligent side. The skill to manage all of the task force's money, the resourcefulness to generate higher income than others with the same materials, and the ability to manage all of Abydos High School's facilities are not things an average person can imitate. Furthermore, though not often revealed due to the overwhelming abilities of her seniors, she is a girl who possesses everything, including top-tier stamina."

 # Red Winter Federal Academy
 RED_trotsky_desc: "$FROM_RedWinter_Academy$§LLev Trotsky was a politician, revolutionary, and Marxist theorist of the Bolshevik faction in the Russian Empire and the Soviet Union, and the figure who established Trotskyism as an ideology. In terms of his career, he was a key figure of the October Revolution and established great achievements in the construction of the USSR as the founder and leader of the Red Army. He was even mentioned as a successor to Vladimir Lenin, but he lost the power struggle with Joseph Stalin, was expelled from the Soviet Communist Party, and was banished from the country he helped build. Since his exile, he has moved between places of asylum, criticizing the Stalinist regime.§!\n\n§YLife§! : §LBorn in Yanovka, a small village in the Elisavetgrad district of the Kherson Governorate of the Russian Empire. His father, David Leontyevich Bronstein, was a Jewish Ukrainian from Poltava, and his household used Surzhyk, a pidgin mix of Ukrainian and Russian. Trotsky's father was a wealthy farmer. When Trotsky turned 9, his father sent him to Odessa to study at a German Lutheran school. Since Odessa was an international city where many races lived, Trotsky's eyes were opened to internationalism. This is a point of contrast with Joseph Stalin, who thoroughly emphasized Russian nationalism despite being Georgian. Trotsky's academic performance was excellent enough for him to graduate at the top of his class, and he was fluent in German, as well as English and French. Trotsky claimed in his autobiography that his linguistic abilities were average and that he could not speak English freely, but in fact, looking at Trotsky's English speeches, his pronunciation is just awkward; he seems to have little trouble constructing sentences.\n At the time, the Russian Empire was under the autocracy of the Tsar, and revolutionary forces with various ideological backgrounds were springing up like mushrooms in Russia, with almost anyone awake to the world being stained by revolutionary thought. Trotsky, who was majoring in mathematics, was initially a Populist (Narodnik) wanting to achieve a socialist revolution through traditional Russian thought, but he was later influenced by Marxism. Trotsky's process of ideological change—from Conservative to Populist and back to Marxist—was very fast.\n He jumped into the revolutionary movement as a student and played a leading role in organizing the workers of Mykolaiv in southern Ukraine. His organizational skills began to stand out from this time. Furthermore, his oratory skills were exceptional; after the February Revolution, when counter-revolutionary General Lavr Kornilov's coup troops entered the capital, Trotsky stood in their way and gave a grand speech. Just by listening to his speech, the coup troops voluntarily disbanded, and Kornilov's coup failed. His writing skills were also so outstanding that Lenin later said, \"His writing is brilliant, but the style is too ornate.\" Robert John Service, a famous British historian and Soviet researcher, even commented that even if Trotsky had not become a revolutionary, he would have left his name in history as a writer or critic.§!" # Why is this squeezed into Trinity?

 # 
 GER_dietrich_bonhoeffer_desc: "§YBirth:§! §LFebruary 4, 1906, Breslau, German Empire§!\n§YCareer:§! §LBorn in Breslau, Germany, in 1906, Dietrich Bonhoeffer grew up in a family with deep Lutheran traditions. His grandfather was a court chaplain, and his mother was a person of faith and culture who taught her children the Bible, poetry, and songs. However, his father was indifferent to faith, and his siblings were likewise cynical toward religion. When Bonhoeffer declared he would become a theologian, his family opposed it, but he did not bend his will, saying, \"Then I will change it.\" Eventually, the family respected his decision.\n\nHaving studied theology in Tübingen and Berlin, he gained recognition in academia with a thesis on the 'Communion of Saints,' and expanded his critical view of Catholic liturgy and doctrine through study in Rome. Seeing the Nazi rise to power, Bonhoeffer was more critical than anyone else, and in 1933, he argued through a radio lecture that the leader's power must be limited. Afterwards, he traveled between London and Germany, leading the way in condemning Hitler's suppression of the church and urging church resistance.\n\nHowever, with the outbreak of the Great Migration in 1935, Germany's political landscape changed rapidly. When Mika Misono took power, people were relieved by her pro-German appearance, but it was soon revealed to be an illusion, and nationwide church suppression began under the name of the 'Church Struggle' (Kirchenkampf).\n\nBonhoeffer already knew what he had to do. Although he knew that it would ultimately lead to a tragic end, his choice did not waver.§!"
 
 
 # Kivotos General Student Council 
 COU_leon_degrelle_desc: "§YBirth:§! §LJune 15, 1906, Bouillon, Kingdom of Belgium§!\n§YCareer:§! §LA handsome young man with eyes that seem to be dreaming yet searching for something, Degrelle is surrounded by people who consider him a simple fascist opportunist. However, if one looks into the inner workings, he can be seen as a figure difficult to define so simply.\n\nHe was first elected as a member of the provincial council of Belgian Luxembourg in 1904, and as a member of the Catholic Party, he built a career as a respected conservative politician. Especially as a devout Catholic, Degrelle exerted immense influence as an outstanding orator in the radical clerical faction. After his discord with the Catholic Party deepened, he founded his own Rex Party, imitating Italian Fascism, and was preparing to run in the elections to be held in 1936.\n\nHowever, the Great Migration of November 1935 changed Degrelle's life itself. Initially, he defined the otherworldly invaders as Satans and encouraged resistance centered on veterans, but he fell into deep skepticism upon seeing girls who did not die even when hit by bullets. Vain resistance drove Belgians to their deaths, and evil communists waited only for the moment the Belgian government would collapse.\n\nOn November 30, 1935, Degrelle carried out a sort of party purge called the Kortrijk Coup. Having expelled all resistance forces from the Rex Party and surrendered to the Administrative Committee, he became the head of a collaborator group within the General Student Council, doing his best for the Belgian people and state by driving out communist demons from Belgium and the rest of Europe.§!"
 COU_cornelis_van_geelkerken_desc: "§YBirth:§! §LMarch 19, 1901, Molenbeek-Saint-Jean, Kingdom of Belgium§!\n§YCareer:§! §LUnlike the strict party leader Mussert, van Geelkerken was a cheerful man who easily captured people's hearts and enjoyed great popularity. He has unreservedly displayed his side as an agitator who sets fire to the hearts of the simple populace.\n\nWorking as a civil servant in the Utrecht Provincial Water Authority, van Geelkerken founded the National Socialist Movement in the Netherlands (NSB) with Mussert in 1931 and was assigned member number 2. Possessing convictions strong enough to throw away his position without hesitation when civil servants were banned from joining the NSB, he led the Dutch Youth and engraved the slogan 'Houzee (Hurrah)!' into the minds of future generations.\n\nAnd the Great Migration of November 1935 and the subsequent social upheaval shook the order he believed in to its very roots. Having resisted to the end amidst the appearance of supernatural beings and the helplessness of existing state systems, he was captured by the Valkyrie Public Security Bureau while trying to organize an exiled resistance force through Belgium. He was transported to the Shiratori District and sentenced to life imprisonment through trial.\n\nIn that process, having witnessed the tragic death of Mussert and the collapse of the Dutch government, he lost the will to resist. Having submitted to the new rulers, van Geelkerken now spends his days surrounded by fancy cars and women. However, even so, it remains true that he is the same gentle 'Prince of Terror' as before.§!"
