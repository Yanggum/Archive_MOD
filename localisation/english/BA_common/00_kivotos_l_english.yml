 ####
 BA_generic_event.1.t: "Mandate over [269.getname]"
 BA_generic_event.1.desc: "As the British government has finally been defeated in the battle for the mainland, they have lost almost all control over their colonies. To smoother the conduct of the current war against [ETH.getname], we must utilize their colony, [269.getname]. Since the British government will have no choice but to accept our troops entering the region, we will be delegated governing authority to allow our divisions to operate there."
 BA_generic_event.1.a: "It's easier to ask for forgiveness than permission."
 BA_generic_event.1.b: "No reason to poke the lion's nose."

 BA_generic_event.2.t: "The Issue of Chinese Concessions"
 BA_generic_event.2.desc: "With the fall of Britain, the concessions in China have become lawless zones. We will seize the concessions under the pretext of 'protecting' Japanese nationals within them."
 BA_generic_event.2.a: "A good idea."
 BA_generic_event.2.b: "We cannot sell the future."

 BA_generic_event.3.t: "London Bridge is Falling Down"
 BA_generic_event.3.desc: "As the flag of the British Empire, which once dominated the Pacific, is lowered, our rivals in the Pacific have vanished. We can seize this opportunity to grasp hegemony over the Pacific."
 BA_generic_event.3.a: "Occupy them!"
 BA_generic_event.3.b: "We cannot sell the future."

 BA_generic_event.4.t: "Italy's Invasion of Millennium" 
 BA_generic_event.4.desc: "Italy has requested a declaration of war, stating that now is the time to attack Millennium." 
 BA_generic_event.4.a: "Now is the perfect time."
 BA_generic_event.4.b: "It's impossible right now."

 BA_generic_event.5.t: "Chinese Peace Proposal"
 BA_generic_event.5.desc: "The Republic of China could not withstand the Imperial Japanese offensive and has proposed peace to us today."
 BA_generic_event.5.a: "Oh, I like it."

 BA_generic_event.6.t: "Japan Accepts"
 BA_generic_event.6.desc: "Japan has accepted our peace treaty."
 BA_generic_event.6.a: "How miserable."

 BA_generic_event.7.t: "Abydos's Demand for a Plebiscite"
 BA_generic_event.7.desc: "In a speech in [4.GetName], Otto von Habsburg appealed for the subjects of Hungary to return under his rule. However, as a gesture of reconciliation, he publicly stated that the people of Austria must choose for themselves."
 BA_generic_event.7.a: "Let the people speak."
 BA_generic_event.7.b: "That matter should be left to the experts."

 BA_generic_event.8.t: "Plebiscite Approved"
 BA_generic_event.8.desc: "The results of the plebiscite are in, and preliminary counts indicate that the union with Abydos holds the majority."
 BA_generic_event.8.a: "It is the will of the people."
 
 BA_generic_event.9.t: "Plebiscite Fails"
 BA_generic_event.9.desc: "Despite perfect preparation by pro-Abydos factions and monarchists, preliminary results show the status quo maintaining a narrow lead."
 BA_generic_event.9.a: "Then there is only one way."
 
 BA_generic_event.10.t: "Plebiscite Rejected"
 BA_generic_event.10.desc: "The leader of Hungary, [HUN.Getleader], has rejected our demand for a plebiscite." 

 BA_generic_event.11.t: "Anarchy in Northern Ireland"
 BA_generic_event.11.d: "As the British Empire fell to beings from another dimension, they were forced into exile. With their departure from the British Isles, all British troops in Northern Ireland have withdrawn, resulting in a security vacuum.\nNow that Britain is gone, Northern Ireland's fate is singular."
 BA_generic_event.11.a: "Occupy Northern Ireland!"
 ENG_to_IRE_Betray: "Traitors"
 BA_generic_event.11.b: "Help Britain moderately just to maintain order."
 ENG_to_IRE_HAPPYCAT: "Providing Assistance"

 BA_generic_event.12.t: "The Forgotten Glory of Outlaws"
 BA_generic_event.12.d: "While surveying Tahiti, we discovered numerous graves. Investigation revealed they belonged to a gang of outlaws. Curiously, they possessed an immense amount of gold bars; tracing the origin revealed they were stolen from a bank in Saint Denis—formerly New Orleans. The 1899 New Orleans bank robbery, which remained a cold case, sent shockwaves through American history as the perpetrators vanished without a trace immediately after. They were never caught, and it was thought they would fade from memory. However, American society was stunned by the news that they were found unexpectedly in Tahiti. Theories for their presence in Tahiti are split: did they encounter a storm while fleeing America and drift there, or did they deliberately set off for Tahiti with their gold? While scholars argue, many American citizens believe they made it to Tahiti. Regardless, their deaths serve as the signal that the era of outlaws has truly ended."
 BA_generic_event.12.a: "Red Dead Redemption"

 BA_generic_event.13.t: "Discovery of Nuclear Fission"
 BA_generic_event.13.d: "Otto Hahn and Fritz Strassmann performed experiments colliding neutrons with uranium. The goal was to create radioactive isotopes and chemically analyze them to identify new elements. However, the resulting substance was identified as an element far lighter than uranium. Strassmann confirmed through precise analysis that this substance was barium—a result inexplicable by existing theories. The two hypothesized that the nucleus had split in the reaction between uranium and neutrons. While chemically persuasive, they were uncertain of the physical explanation. Hahn shared the results with Lise Meitner. Meitner and Otto Frisch interpreted this theoretically, concluding that the uranium nucleus splits into two lighter elements upon neutron impact. A massive amount of energy was released in this process, which they named 'nuclear fission.' This discovery sent shockwaves through the scientific community. Specifically, it opened the possibility that the enormous energy released during fission could lead to the development of atomic bombs."
 BA_generic_event.13.a: "Truly a magnificent discovery!"

 BA_generic_event.16.t: "§tProject KV Detected!§!"
 BA_generic_event.16.d: "Not long after we fell into this strange world through the Great Transfer, news has arrived that a new faction has emerged in the far east through another Transfer! This is truly an amazing discovery; we must depart for that place immediately! Right now, quickly!"
 BA_generic_event.16.a: "What a splendid idea!"
 BA_generic_event.16.b: "No, have you gone mad?"

 BA_generic_event.17.t: "[USA.getname] Seeks to Join the Communist International"
 BA_generic_event.17.d: "[USA.getname] has expressed a desire to join the Communist International."
 BA_generic_event.17.a: "That's wonderful news!"
 BA_generic_event.17.b: "We have no need for them in our faction."

 BA_generic_event.18.t: "Rejection by [USA.getname]"
 BA_generic_event.18.d: "[USA.getname] has flatly rejected our intent to join."
 BA_generic_event.18.a: "Let's see how well they do without us."

 BA_generic_event.19.t: "A Dream in the Office"
 BA_generic_event.19.d: "......It was my mistake.\n\nMy decisions. And every situation they brought about.\nTo think I would only realize you were right after reaching this outcome.......\n\n......So, I have an impertinent favor to ask.\n\nSensei. [ROOT.GetLeader]\nYou will eventually forget my words anyway, but I suppose that doesn't matter.\nEven if you remember nothing, you would likely make the same choices in the same situation.......\n\nThat is why...... what matters is likely not experience, but choice.\nChoices that only you can make.\n\nI once spoke to you about the person who takes responsibility.\nBack then, I did not know....... but now, I can understand.\n\nAn adult. Responsibility and duty, and the choice you make beyond them.\n\nEven what that truly signifies.\n\n.......\nSo, Sensei.\nOnly you, the adult I can believe in,\nCan find a result other than this twisted and distorted destination......\n\nFind the path...... that leads elsewhere.\n\nSo, Sensei.\nPlease......."
 BA_generic_event.19.a: "Sen... what?"

 BA_generic_event.20.t: "A New Golden Age for Mongolia"
 BA_generic_event.20.d: "In the year [GetYear], a new chapter of history was written on the Mongolian steppes. The spark of the nation, which never flickered out despite centuries of foreign rule and oppression, has finally erupted into a great flame. The descendants of Genghis Khan have once again become the protagonists of history in the land of their ancestors."
 BA_generic_event.20.a: "Bayarla!"

 BA_generic_event.401.t: "A New Year Dawns Again"
 BA_generic_event.401.d: "It was a noisy and chaotic year with our new neighbors, but the New Year has arrived without fail.\nThough some harbor hatred and shed tears, the majority have taken to the streets to welcome an awkward yet vibrant New Year. Even those who doubted and guarded against each other until yesterday walked together today, sharing awkward smiles.\nStudents and locals may look different on the outside, but most are imagining and hoping for a peaceful and hopeful future this year.\n\nAt least for now."
 BA_generic_event.401.a: "This year will be better."

 # Sensei Mode Events (13XX+)
 BA_generic_event.1301.t: "Contact from the General Student Council"
 BA_generic_event.1301.d: "To the Honorable Sensei.\n\nI am Rin Nanagami, Acting President of the General Student Council, which oversees the administration of the Kivotos districts.\n\nI have contacted you upon hearing the news that you, the leader of this nation, have become the new 'Sensei.'\nI look forward to you establishing a friendly relationship with our Kivotos and guiding our students onto the right path. I look forward to working with you."
 BA_generic_event.1301.a: "I look forward to working with you, Rin."
 BA_generic_event.1301.b: "Wait, 'Sensei'? What is that supposed to mean?"
 BA_generic_event.1302.t: "The General Student Council's Response"
 BA_generic_event.1302.d: "Ah, my apologies. I have committed a discourtesy. The title 'Sensei' is a term granted to the most respected leader and advisor in our Kivotos. We addressed you as such because we judged you to be fully qualified, but if the title is not to your liking, I shall correct it."
 BA_generic_event.1302.a: "No, calling me 'Sensei' is fine."
 BA_generic_event.1302.b: "That title is too much of a burden."
 BA_generic_event.1303.t: "Urgent Proposal from the General Student Council"
 BA_generic_event.1303.d: "Sensei, I am contacting you once again. In truth, our General Student Council's administrative functions are nearly paralyzed due to the absence of the GSC President. To ensure Kivotos regains stability under your leadership, we wish to temporarily delegate our administrative authority to you. Please, consider our proposal."
 BA_generic_event.1303.a: "I accept the proposal. I will protect your world as well."
 BA_generic_event.1303.b: "Give me some time to think."
 BA_generic_event.1303.c: "I'm sorry, but I cannot do that."
 BA_generic_event.1304.t: "Ultimatum from the General Student Council"
 BA_generic_event.1304.d: "Sensei, it is regrettable that you have rejected our proposal. However, we cannot simply back down. If you will not become our leader, we will make you ours even by force. This is our resolve—the resolve of the General Student Council."
 BA_generic_event.1304.a: "......!"
