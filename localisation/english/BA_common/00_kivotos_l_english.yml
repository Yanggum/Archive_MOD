 kim_yong_ha_name: "Kim Yong-ha"
 kim_yong_ha_desc: "I have come to the Cheonggyecheon to strengthen my resolve."

 SUBDOCTRINE_KIVOTOS_MILITIA_TACTICS: "Kivotos Militia Tactics"
 SUBDOCTRINE_KIVOTOS_MILITIA_TACTICS_DESC: "Aren't the students of Kivotos excellent personnel, skilled in handling firearms and capable of being immediately deployed for complex high-intensity military operations utilizing their physical prowess?"
 BA_kivotos_militia_tactics_mission_oriented_field_command: "Mission-Oriented Field Command"
 BA_kivotos_militia_tactics_independent_battlefield_organization: "Independent Battlefield Organization"
 BA_kivotos_militia_tactics_urban_support_acquisition: "Urban Support Acquisition"
 BA_kivotos_militia_tactics_story_of_youth: "A Story of Youth"

 #Global
 BA_HISTORICAL_CHOICE_TT: "§gThis is a historical choice.§!"
 BA_kivotos_school_country_category: "The Academies of Kivotos"
 BA_kivotos_school_country_category_desc: "Originally an academy in a place called Kivotos, this nation preserves a cross-dimensional culture from before the Great Transfer. Furthermore, the halos above their heads serve as a major distinction from regular humans, forming a sort of Kivotos nationalism. They yearn for their original Kivotos while protecting its past culture."
 BA_decisions_give_me_the_COU: "Ascension of [ROOT.GetLeader] as GSC President"
 BA_decisions_me_is_COU: "Reorganize Nation into the Kivotos General Student Council"
 BA_all_country_category: "Kivotos Alliance"
 BA_all_country_category_desc: "Schale began as an extra-legal club under the General Student Council, but its purpose was completely transformed by the GSC President's orders. Moving towards the grand goal of unifying Kivotos, Schale eventually merged with the paralyzed GSC and established the Kivotos Alliance. Recently, Schale has reorganized the alliance into the 'Euro-Kivotos Alliance' to suit current realities, and we can choose our role within this union."
 BA_join_the_kibotos_alliance: "Join the Kivotos Alliance"
 BA_participation_in_economic_cooperation: "Euro-Kivotos Economic Cooperation"
 BA_remove_dead_lands: "Address the Flooded Districts of D.U."
 BA_remove_dead_lands_desc: "While the General Student Council and Schale were locked in conflict, the flooding issue in the D.U. district was left entirely unresolved. The task of restoring these long-neglected flooded areas has now perplexingly been handed over to us."

 BA_from_southern_kivotos: "Unification of Southern Kivotos"
 BA_from_southern_kivotos_desc: "The southern outskirts of Kivotos, typically represented by Hyakkiyako and Shanhaijing, have a stronger tendency toward isolation compared to other regions. Despite various changes since the Great Transfer, the unique culture of Southern Kivotos remains distinctly different. Since we rule all areas corresponding to Southern Kivotos, it is possible to emphasize that shared culture."
 southern_kivoto_decision: "Unify Southern Kivotos"

 form_southern_kivotos_nation_flag: "Unified §YSouthern Kivotos§!."

 #Global Ideas
 BA_isolation: "Isolation"
 BA_isolation_desc: "Our foreign affairs and trade systems have been placed in a state of temporary paralysis due to the urgent situation.\n\n"
 BA_can_remove_isolation_flag: "Met the conditions to remove §YIsolation§!."
 Aftermath_of_the_Second_Soviet_Polish_War: "Aftermath of the Second Soviet-Polish War"
 Aftermath_of_the_Second_Soviet_Polish_War_desc: "Amidst the catastrophic chaos following the landing in Europe of strange individuals calling themselves 'Kivotos,' minor skirmishes broke out on the Soviet-Polish border. These clashes soon escalated into an unwanted Second Soviet-Polish War for both nations. Having entered a war they were completely unprepared for, both countries suffered massive casualties before the conflict ended with no gains for either side."
 BA_soviet_puppet_idea: "Soviet Republic"
 BA_three_major_academies: "The Three Major Academies"
 BA_three_major_academies_desc: "In Kivotos, there are three massive institutions known as the Three Major Academies. These academies possess a larger student population and more substantial standing armies than others."
 BA_three_major_academies_tt: "£GFX_unit_halo_infantry_icon_small §CHalo Infantry§! §YDivision Limit§!: §G+6§!"
 BA_railway_gauge_issue: "Problematic Railways"
 BA_railway_gauge_issue_desc: "The railway network of this new world was significantly different from ours. Numerous problems, such as disconnected rail lines due to the dimensional shift and differing track gauges, are substantially delaying our construction efforts."
 BA_exiles_of_the_future: "Exiles of the Future"
 BA_exiles_of_the_future_desc: "Confronted with an unknown world, various backward technologies, and unfamiliar scientific theories, we have fallen into confusion. It may take a considerable amount of time to adapt to this world's science and technology, let alone develop it further."
 MIL_laboratory: "Millennium Laboratory"
 NC_airship_department: "Kronos School"
 koki_electricity: "Koki Electric"
 BA_veronica: "Veronica"
 BA_kaiser_construction: "Kaiser Construction"


 BA_kiovotos_spain_event.1.t: "Chaos Right Below"
 BA_kiovotos_spain_event.1.d: "Chaos has erupted in the territory directly beneath us. According to Veritas intelligence, the [SPR.getname] military has launched a coup, but the government and citizens have organized a resistance to oppose them. Meanwhile, numerous refugees are flocking to our territory to escape the civil war. We need to address this."
 BA_kiovotos_spain_event.1.a: "Damn it."
 BA_kiovotos_spain_event.2.t: "The Refugee Problem"
 BA_kiovotos_spain_event.2.d: "We cannot simply ignore the growing number of refugees. Southern citizens are urgently demanding their deportation. Meanwhile, some student groups argue that such measures are inhumane."
 BA_kiovotos_spain_event.2.a: "Deport them all."
 BA_kiovotos_spain_event.2.b: "It is clear that the Spanish military bears all responsibility for this situation."
 BA_kiovotos_spain_event.2.c: "We must directly overthrow the incompetence of the Spanish government."
 BA_kiovotos_spain_event.3.t: "Discussion on Establishing an Intervention Committee"
 BA_kiovotos_spain_event.3.d: "Following Millennium's dispatch of volunteers to the Spanish Civil War, other Kivotos nations are also attempting to intervene without restriction. To prevent ideological and interest-based conflicts among Kivotos nations and maintain cooperation, we could establish and operate an Intervention Committee to coordinate and limit these efforts."
 BA_kiovotos_spain_event.3.a: "Establish the Intervention Committee."
 BA_kiovotos_spain_event.3.b: "Is there a need to control them?"
 BA_kiovotos_spain_event.3_tt: "£GFX_pol_power Political Power cost for Kivotos Cooperation Organization members to §YLeave the Kivotos Cooperation Organization§! reduced by 20."
 BA_kiovotos_spain_event.4.t: "Installation of the Intervention Committee"
 BA_kiovotos_spain_event.4.d: "By order of the General Student Council, an Intervention Committee has been established under the Kivotos Cooperation Organization. The Intervention Committee serves to prevent members from recklessly intervening in the Spanish Civil War and has the authority to inspect volunteer forces. However, as long as the committee's measures are properly implemented, we will be able to engage in free military activities within specified bounds."
 BA_kiovotos_spain_event.4.a: "A shackle has been placed on our ankles."
 BA_kiovotos_spain_event.5.t: "The Millennium Proposal"
 BA_kiovotos_spain_event.5.d: "Amid deepening intervention in the civil war, Millennium has proposed a non-intervention compromise. This proposal—to reduce the resources spent on the Intervention Committee by revising its regulations while operating volunteer forces at a minimum scale—is becoming a subject of intense debate among many member nations."
 BA_kiovotos_spain_event.5.a: "Accept it."
 BA_kiovotos_spain_event.5.b: "Sovereignty still belongs to us."
 BA_kiovotos_spain_event.6.t: "Stop Millennium"
 BA_kiovotos_spain_event.6.d: "Millennium's foolish decisions have only worsened the situation without ending the civil war! We hesitated to retaliate militarily due to Millennium's vast military power, but that changes now. We will strike the northern plains of France swiftly to crush their counter-offensive capabilities and halt Millennium's misguided hegemonism!"
 BA_kiovotos_spain_event.6.a: "Advance!"
 BA_kiovotos_spain_event.6.b: "No, it's too reckless."
 
 BA_interference_committee: "Intervention Committee"

 ABY_abydos_sandstorm: "Abydos Sandstorm"
 ABY_abydos_sandstorm_desc: "\n\n\n£GFX_ABY_abydos_sandstorm_picture \n\n\n\n\nAbydos was once an academy possessing a vast desert. However, during the Great Transfer to Europe, only a very small portion of the academy and its districts followed. Nevertheless, that small district appears to have been enough to bring desertification to parts of Europe. Sandstorms will blow through this region until the ecosystem has had enough time to recover."
 
 generic_research_advances: "Research Advances"
 generic_research_advances_desc: "Research and development are progressing rapidly, bolstered by recent active investment from our government."

