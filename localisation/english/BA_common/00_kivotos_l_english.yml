 BA_generic_event.1.t: "영국 식민지 문제"
 BA_generic_event.1.desc: "영국이 항복해서 지중해에 있는 식민지들의 군대가 전부 철수해서 무주공산이 되었다는 내용"
 BA_generic_event.1.a: "점령해라!"
 BA_generic_event.1.b: "사자의 코털을 건들 이유는 없지."

 BA_generic_event.2.t: "중국 조차지 문제"
 BA_generic_event.2.desc: "영국이 무너지면서 중국의 조계지들은 무법지대가 되었습니다. 조계지내에 일본인들을 '보호'한다는 명목으로 우리는 조계지를 강탈 할 것입니다."
 BA_generic_event.2.a: "좋은 생각이군."
 BA_generic_event.2.b: "미래를 팔 수는 없지."

 BA_generic_event.3.t: "런던 브릿지가 무너지다"
 BA_generic_event.3.desc: "태평양을 주름잡던 대영제국의 깃발이 내려가면서 태평양에서 우리의 적수는 사라졌습니다. 이 기회를 노려 태평양 패권을 잡을 수 있을 것입니다."
 BA_generic_event.3.a: "점령하라!"
 BA_generic_event.3.b: "미래를 팔 수는 없지."

 BA_generic_event.4.t: "이탈리아의 밀레니엄 침공작전" 
 BA_generic_event.4.desc: "이탈리아는 지금이야말로 밀레니엄을 공격할 시간이라 하며 선전포고를 요청했습니다." 
 BA_generic_event.4.a: "지금이 바로 적기이다"
 BA_generic_event.4.b: "지금은 무리다."

 BA_generic_event.5.t: "중국의 평화 제안"
 BA_generic_event.5.desc: "중화민국은 일본 제국의 공세를 버티지 못하였고 오늘 우리에게 평화를 제안하였습니다."
 BA_generic_event.5.a: "아이 좋아요"

 BA_generic_event.6.t: "수락한 일본"
 BA_generic_event.6.desc: "일본은 우리의 평화 협정을 받아들였습니다."
 BA_generic_event.6.a: "비참하군"

 BA_generic_event.7.t: "아비도스의 국민투표 요구"
 BA_generic_event.7.desc: "[4.GetName]에서의 오토 폰 합스부르크의 연설에서 헝가리의 신민들이 자신의 지배하에 다시 돌아오게 해달라고 호소하였습니다. 그러나 화해의 의미로 그는 오스트리아의 국민이 그들 주체적으로 선택 하여야 한다고 공개적으로 언급했습니다."
 BA_generic_event.7.a: "사람들이 말하도록 두자."
 BA_generic_event.7.b: "그 일은 전문가에게 맡겨야지."

 BA_generic_event.8.t: "국민투표가 승인됨"
 BA_generic_event.8.desc: "국민투표 결과가 나왔고 예비 개포 결과 아비도스와 연합이 과반수를 차지하고 있는 것으로 나타냈습니다."
 BA_generic_event.8.a: "민중의 뜻이다."
 
 BA_generic_event.9.t: "국민투표 실패"
 BA_generic_event.9.desc: "친아비도스파와 군주주의자들의 완벽한 준비에도 예비 결과는 근소한 차이로 현상 유지인것으로 보입니다."
 BA_generic_event.9.a: "그렇다면 방법은 하나다."
 
 BA_generic_event.10.t: "국민투표 거부"
 BA_generic_event.10.desc: "헝가리의 지도자인 [HUN.Getleader]는 우리의 국민투표 요구를 거부하였습니다." 

 BA_generic_event.11.t: "북아일랜드의 무정부사태"
 BA_generic_event.11.d: "대영제국이 이차원의 존재들에게 함락당하고 그들은 망명 길에 오르게 되었습니다. 그들이 브리튼 제도를 떠나면서 북아일랜드에 있는 모든 영국군이 철수하게 되면서 북아일랜드는 치안공백 사태가 벌어지게 되었습니다.\n영국이 떠난 지금이 북아일랜드의 운명은 하나입니다."
 BA_generic_event.11.a: "북아일랜드를 점령하라!"
 ENG_to_IRE_Betray: "배신자들"
 BA_generic_event.11.b: "적당히 영국을 도와서 치안만 지켜라."
 ENG_to_IRE_HAPPYCAT: "도움을 줌"

 BA_generic_event.12.t: "잊혀졌던 무법자들의 영광"
 BA_generic_event.12.d: "우리가 타히티섬을 조사하면서 수많은 무덤을 찾게 되었습니다. 무덤들을 전부 조사해 본 결과 한 무법자 무리의 무덤인 것으로 밝혀졌습니다. 특이한 점으로는 이들이 가진 금괴는 너무나도 많았고 금괴의 출처를 알기 위해 조사한 결과, 생드니. 즉 과거 뉴올리언스의 은행에서 도난을 당한 금괴인 것으로 판명되었습니다.\n\n1899 년 영구 미제 사건으로 남았던 뉴올리언스 은행 강도 사건은 미국 역사에 큰 전율을 준 사건으로 은행 강도 직후, 그들은 흔적도 없이 사라졌습니다.\n끝내 사건을 일으킨 무법자들은 찾아내지 못하였으며 영구 미제 사건으로 남았고 사람들의 기억 속에서 잊힐 줄 알았습니다. 하지만 그들이 생뚱맞게 타히티에서 발견되었다는 소식에 미국 사회는 놀라움을 감출 수 없었습니다.\n\n이들이 타히티에서 발견된 이유는 크게 두 가지로 갈립니다. 배를 타고 미국을 떠나다가 폭풍우를 만나 타히티에 표류한 것인지, 아니라면 수많은 금괴를 들고 타히티로 떠난 것인지 학자들은 팽팽한 대립을 하고 있지만 수많은 미국 시민은 타히티로 떠난 것이라고 받아들여지고 있습니다.\n\n어찌 되었든 이들의 죽음은 무법자들의 시대가 진정으로 끝났음을 알리는 신호탄이 될 것입니다."
 BA_generic_event.12.a: "피 죽음 구원(Red Dead Redemption)"

 BA_generic_event.13.t: "핵분열 발견"
 BA_generic_event.13.d: "오토 한과 슈트라스만은 중성자를 우라늄에 충돌시키는 실험을 수행했습니다. 이 실험은 방사성 동위원소를 생성하고 이를 화학적으로 분석해 새로운 원소를 확인하는 것이 목적이었습니다.\n\n그러나 실험 결과 생성된 물질은 우라늄보다 훨씬 가벼운 원소로 밝혀졌습니다. 슈트라스만은 정밀한 분석을 통해 이 물질이 바륨이라는 사실을 확인했습니다. 이는 기존 이론으로는 설명할 수 없는 결과였습니다.\n\n두 사람은 우라늄과 중성자 간의 반응에서 핵이 분열되었다는 가설을 세웠습니다. 이 실험은 화학적으로 매우 설득력 있었지만, 물리적 설명에 대해서는 확신하지 못했습니다.\n\n한은 동료인 리제 마이트너에게 실험 결과를 공유했습니다. 마이트너와 오토 프리슈는 이를 이론적으로 해석하며, 우라늄 핵이 중성자 충격으로 인해 분열하면서 두 개의 가벼운 원소가 형성된다는 결론을 도출했습니다. 이 과정에서 막대한 에너지가 방출되었고, 이를 \"핵분열\"이라고 명명했습니다.\n\n이 발견은 과학계에 큰 반향을 일으켰습니다. 특히 핵분열 과정에서 방출되는 엄청난 에너지가 원자폭탄 개발로 이어질 가능성을 열어주었습니다."
 BA_generic_event.13.a: "정말 대단한 발견이야!"

 BA_generic_event.16.t: "§t프로젝트 KV 감지됨!§!"
 BA_generic_event.16.d: "우리가 대전이로 이 이상한 세계로 떨어진지 얼마 지나지 않아, 저 먼 동방에서 새로운 세력이 대전이로 등장했다는 소식이 전해져 왔습니다!\n\n이는 정말 놀라운 발견이기에, 즉시 우리는 그곳으로 떠나야만 합니다! 지금 당장, 빨리요!"
 BA_generic_event.16.a: "아주 훌륭한 생각이군!"
 BA_generic_event.16.b: "아니, 자네 미쳤나?"

 BA_generic_event.17.t: "[USA.getname]의 공산주의 인터내셔널 가입 모색"
 BA_generic_event.17.d: "[USA.getname]이 공산주의 인터내셔널에 가입하고 싶다는 의사를 밝혔습니다."
 BA_generic_event.17.a: "그것 참 좋은 소식이군!"
 BA_generic_event.17.b: "우리 세력에 그들은 필요 없어."

 BA_generic_event.18.t: "[USA.getname]의 거절"
 BA_generic_event.18.d: "우리의 가입 의사에 [USA.getname]는 단호하게 거절 의사를 밝혔습니다."
 BA_generic_event.18.a: "우리 없이 잘들 지내나 보자고."

 BA_generic_event.19.t: "집무실에서의 꿈"
 BA_generic_event.19.d: "......내 실수였어요.\n\n내 결정들. 그리고 그로 인해 초래된 모든 상황들.\n결국 이 결과에 도달하고서야 당신이 옳았다는 걸 깨닫다니.......\n\n......그러니 염치없지만 부탁드리겠습니다.\n\n선생님. [ROOT.GetLeader]\n어차피 제 말은 잊어버리게 될 테지만, 그래도 상관없겠죠.\n아무것도 기억나지 않아도, 당신은 아마 같은 상황에서 똑같은 선택을 하실 테니.......\n\n그러기에 아마...... 중요한 것은 경험이 아니라, 선택.\n당신만이 가능한 선택들.\n\n책임을 지는 사람에 대해 얘기한 적이 있었지요.\n그때의 저는 알지 못했지만....... 지금은 이해할 수 있습니다.\n\n어른. 책임과 의무, 그리고 그 너머에 있는 당신의 선택.\n\n그것이 의미하는 바까지도.\n\n.......\n그러니까, 선생님.\n내가 믿을 수 있는 어른인 당신만이,\n이 뒤틀리고 일그러진 종착지가 아닌 다른 결과를......\n\n그곳으로 이어지는 선택지를...... 찾을 수 있을 겁니다.\n\n그러니까, 선생님.\n부디......."
 BA_generic_event.19.a: "선생... 뭐?"

 BA_generic_event.402.t: "붉은 피"
 BA_generic_event.402.d: "붉은 군대의 역량은 핀란드 군대가 막아내리라는 불가능에 가까웠습니다. 그들의 군대는 질서정연하며 유능하고 실전경험이 다수 풍부하였고 계획 조차 완벽하였습니다. 하지만 우리의 군대는 어땠을까요?\n\n수년간의 평화는 핀란드 군대를 나약하게 만들었고 우리의 국민들은 붉은 역병에 대해서 크게 생각하지 않았습니다. 하지만 그들이 파도처럼 몰려온다 하여도 콧웃음이나 치며 다른 얘기를 하기 바빴습니다.\n\n붉은 역병이 우리를 침략했을때 그들은 침묵하였습니다. 핀란드의 구호인 시수 조차 공포로 다가오는 역병들을 상대하기에는 부족하였고 방어선은 무참히 깨졌고 우리들의 수도는 며칠만에 함락당하여 그 빛을 잃었습니다.\n\n우리들의 상황은 어둡기만 합니다 우리의 수도, 헬싱키에는 붉은깃발과 환희에 가득찬 붉은군대가 거리에 진군하고 있고 핀란드의 저항군들은 기세가 꺾여 활동조차 어려운 상황입니다. 분명 다시한다면 핀란드에게 다시 한 번 기회가 주어진다면, 그때는 정말 붉은 역병으로 부터 조국을 지켜낼 수 있을까요?"
 BA_generic_event.402.a: "하지만 기회는 한 번 뿐이다."
 BA_generic_event_402_TT: "이렇게 하여 §Y핀란드의 새벽§!은 §R붉게§! 물들었습니다. 핀란드에게 §C기회§!가 있었어도 결과는 §t똑같았을 것§!입니다.\n\n핀란드를 플레이 해주셔서 감사합니다!\n아, 다음 번에는 학원 국가를 플레이 해주세요."

 BA_generic_event.401.t: "다시 밝아온 새해"
 BA_generic_event.401.d: "새로운 이웃과 시끄럽고 혼란스러운 일 년이었지만 어김없이 신년이 찾아왔습니다.\n비록 누군가는 증오하고 눈물을 흘리지만, 대다수는 어색하지만 활기찬 새해를 맞이하기 위해 거리로 나아갔습니다. 어제까지 서로를 의심하고 경계했던 사람들도 오늘만큼은 서로에게 어색한 웃음을 보이며 함께 걸어갔습니다.\n학생과 현지인은 겉모습은 다를지라도 대부분은 이번 연도엔 평화롭고 희망찬 미래를 상상하고 바라고 있습니다.\n\n아직까지는요."
 BA_generic_event.401.a: "올해는 좀 더 나아지겠지."

 # 센세모드 이벤트 13XX부터
 BA_generic_event.1301.t: "총학생회의 접촉"
 BA_generic_event.1301.d: "존경하는 선생님께.\n\n저는 키보토스 자치구의 행정을 총괄하는 총학생회의 의장 대리 나나가미 린입니다.\n\n국가의 지도자인 당신이 새로운 선생님이 되셨다는 소식을 접하고 이렇게 연락드렸습니다.\n선생님께서 저희 키보토스와 우호적인 관계를 맺고, 저희 학생들을 올바른 길로 이끌어주시길 기대하고 있습니다. 앞으로 잘 부탁드립니다."
 BA_generic_event.1301.a: "앞으로 잘 부탁한다, 린."
 BA_generic_event.1301.b: "아니 잠깐, 선생이라니 그게 무슨 소리야?"
 BA_generic_event.1302.t: "총학생회의 답변"
 BA_generic_event.1302.d: "아, 실례했습니다. 제가 무례를 범했군요. '선생님'이라는 호칭은 저희 키보토스에서 가장 존경받는 지도자이자 조언자에게 부여하는 칭호입니다. 저희는 당신께서 그 자격이 충분하다고 판단하여 그렇게 불렀습니다만, 호칭이 마음에 들지 않으셨다면 정정하겠습니다."
 BA_generic_event.1302.a: "아니, '선생'으로 불러도 좋다."
 BA_generic_event.1302.b: "그 호칭은 너무 부담스럽다."
 BA_generic_event.1303.t: "총학생회의 긴급 제안"
 BA_generic_event.1303.d: "선생님, 다시 한번 연락드립니다. 사실 저희 총학생회는 총학생회장의 부재로 인해 행정 기능이 거의 마비된 상태입니다. 선생님의 지도력 아래 저희 키보토스가 안정을 되찾을 수 있도록, 한시적으로 저희 총학생회의 행정권을 선생님께 위임하고 싶습니다. 부디 저희의 제안을 고려해주십시오."
 BA_generic_event.1303.a: "그 제안을 받아들이겠다. 너희의 세계 또한 내가 지키겠다."
 BA_generic_event.1303.b: "생각할 시간을 좀 달라."
 BA_generic_event.1303.c: "미안하지만, 그럴 수는 없다."
 BA_generic_event.1304.t: "총학생회의 최후통첩"
 BA_generic_event.1304.d: "선생님, 저희의 제안을 거절하신 것은 유감입니다. 하지만 저희는 이대로 물러설 수 없습니다. 선생님께서 저희의 지도자가 되지 않으신다면, 저희는 힘으로라도 선생님을 저희의 편으로 만들겠습니다. 이것이 저희, 총학생회의 각오입니다."
 BA_generic_event.1304.a: "......!"