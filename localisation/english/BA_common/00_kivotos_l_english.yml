 #공용
 GAEBALJUNG: "§Y미완성입니다!§!"
 BA_HISTORICAL_CHOICE_TT: "§g이것은 역사적인 선택입니다.§!"
 BA_kivotos_school_country_category: "키보토스의 학원"
 BA_kivotos_school_country_category_desc: "본래 키보토스라는 곳의 학원이었던 이 국가는 대전이 이전 이차원의 문화를 간직하고 있습니다. 또한 이들의 머리 위에 달린 헤일로는 기존 인간들과 큰 구분 점이 되며 일종의 키보토스 민족주의를 형성하고 있습니다. 이들은 본래 키보토스를 그리워하기도 하며 과거 키보토스의 문화를 지키고 있습니다."
 BA_decisions_give_me_the_COU: "[ROOT.GetLeader]의 총학생회장 등극"
 BA_decisions_me_is_COU: "국가를 키보토스 총학생회로 바꾸기"
 BA_all_country_category: "키보토스 연합"
 BA_all_country_category_desc: "샬레는 총학생회의 초법적 동아리로 시작하였으나, 총학생회장의 명령으로 그 목적이 완전히 뒤바뀌었습니다. 키보토스 통합이라는 거대한 목적을 향해 움직이기 시작한 샬레는 곧이어 마비된 총학생회를 병합하고 키보토스 연합을 수립하였습니다. 최근 샬레가 키보토스 연합을 현실 사정에 맞춰 '유로-키보토스 연합'으로 재편하였으며, 우리가 이 연합에서 할 일을 선택할 수 있습니다."
 BA_join_the_kibotos_alliance: "키보토스 연합 가담"
 BA_participation_in_economic_cooperation: "유로-키보토스 경제 협력"
 BA_remove_dead_lands: "D.U. 침수 지역 해결"
 BA_remove_dead_lands_desc: "총학생회와 샬레 두 세력은 자신들끼리 분쟁을 거듭하는 동안 D.U. 지구의 침수 문제를 전혀 해결하지 않았습니다. 장기간 방치되어 있던 침수 지역을 복원하는 공사는 당혹스럽게도 이제 우리들의 몫으로 넘겨지게 되었습니다."

 BA_from_southern_kivotos: "남부 키보토스의 통일"
 BA_from_southern_kivotos_desc: "흔히 백귀야행과 산해경으로 대표되는 키보토스의 남부 외곽 지역은 다른 지역에 비해 폐쇄적인 성향이 강한 곳입니다. 대전이 이후 여러 변화가 있었음에도, 남부 키보토스만의 독특한 문화는 다른 지역과는 분명히 다른 차별점이 남아있습니다. 우리가 남부 키보토스에 해당하는 모든 지역을 지배하기에, 그 공통된 문화를 강조하는 것이 가능합니다."
 southern_kivoto_decision: "남부 키보토스 통일"

 form_southern_kivotos_nation_flag: "§Y남부 키보토스§!를 통일함."
 
 tooltip_immediate_effect_upon_focus_start: "§Y중점 시작 시 즉각적인 효과:§!\n"
 tooltip_effect_upon_focus_completion: "\n§G중점 완료 시 효과:§!\n"
 tooltip_white_line: "   \n"
 unlock_focuses: "§G이 중점은 자동으로 통과되어 다른 중점을 해금합니다.§!"
 unlock_industrial_concern_tooltip: "§Y산업 업체§!로 §G사용 가능§!:"

 #공용 아이디어#
 BA_isolation: "고립"
 BA_isolation_desc: "우리의 외무 및 통상 체계는 급박한 상황으로 인해 일시적인 마비 상태에 놓였습니다.\n\n"
 BA_can_remove_isolation_flag: "§Y고립§!을 제거할 수 있는 조건을 충족함."
 Aftermath_of_the_Second_Soviet_Polish_War: "2차 소비에트-폴란드 전쟁의 여파"
 Aftermath_of_the_Second_Soviet_Polish_War_desc: "자신들을 키보토스라고 칭하는 괴상한 이들이 유럽에 상륙하고 발생하는 처참한 혼란 속에서 소비에트와 폴란드 국경에서는 작은 충돌이 일어났고, 이 충돌이 곧 양국 모두에게 원치 않던 2차 소비에트-폴란드 전쟁으로 이어졌습니다. 이 두 나라는 전혀 준비되지 않은 전쟁에 돌입한 결과로 대량의 인명 피해를 초래하며 전쟁을 치르다가 아무런 이득 없이 전쟁이 종결되었습니다."
 BA_soviet_puppet_idea: "소비에트 공화국"
 BA_soviet_puppet_idea_desc: "이 사람들은 내가 이 국민정신에 장난을 쳐도 모르겠지"
 BA_three_major_academies: "3대 학원"
 BA_three_major_academies_desc: "키보토스에는 3대 학원이라 불리는 세 거대 학원이 존재합니다. 이 학원들은 다른 학원들보다 더 많은 양의 학생 수와 큰 규모의 상비군을 보유하고 있습니다."
 BA_three_major_academies_tt: "£GFX_unit_halo_infantry_icon_small §C헤일로 보병§!의 §Y편제 제한§!: §G+6§!"
 BA_railway_gauge_issue: "문제 있는 철도"
 BA_railway_gauge_issue_desc: "새로운 세계의 철도망은 우리 세계와 상당히 달랐습니다. 차원 이동의 여파로 끊어져버린 수많은 철도망과 궤간이 다른 철로 등 여러 문제점은 우리의 건설을 상당히 지연시키고 있습니다."
 BA_exiles_of_the_future: "미래의 망명자"
 BA_exiles_of_the_future_desc: "알 수 없는 세계, 여러 낙후된 기술들, 그리고 처음 보는 여러 과학 이론을 보며 우리는 혼란 속에 빠져들었습니다. 이 세계의 과학 기술에 적응하고 더 나아가 과학 기술을 발전시키기 위해선 조금 더 긴 시간이 필요할지도 모릅니다."
 MIL_laboratory: "밀레니엄 연구소"
 GEH_tank_designer: "게헨나 중공업"
 NC_airship_department: "크로노스 스쿨"
 BA_train_school: "하이랜더 철도학원"
 BA_highlander_academy_generic: "하이랜더 철도학원"
 BA_highlander_academy_generic_desc: "학원 전역의 교통망은 하이랜더 철도학원에 의해 운영되고 있으며, 우리의 통제 하에 놓여있지 않습니다. 우리는 하이랜더 철도학원과 그들의 최대투자자에게 교통비를 지불해야하며, 혹은 여러 다른 조치들을 고려해 볼 수 있을 것입니다."
 BA_nationalized_highlander: "하이랜더의 §Y국내 선로§!에 대한 지분을 몰수했습니다."
 BA_highlander: "하이랜더 철도학원"
 BA_highlander_desc: " 하이랜더 철도학원은 키보토스 전역을 가로지르며 방대하게 펼쳐진 선로들을 운영하고 있습니다. 그러나 대전이 이후 하이랜더와 총학생회의 행정 역량은 예전과 같지 못하며, 학원들은 전이된 지역에 존재하는 철도들을 점유하게 되며 하이랜더 철도학원의 지위는 불안정합니다.\n\n 현재 상황에서 우리는 하이랜더가 보유한 선로들의 지분을 몰수하여 교통에 있어서의 자주를 이뤄내거나, 하이랜더 철도학원에 많은 자본을 투자하여 그들을 우리의 지배 하에 놓을 수 있습니다. 또한 철도학원은 투자할 때마다 교통에 관련해서 우리를 다양하게 지원할 것입니다.\n\n    [BA_highlander_best_invester]\n    @[this.gettag] §Y[THIS.getname]§!의 투자 : §Y[?THIS.BA_highlander_invest]§!\n    £GFX_HTA_FLAG   §Y하이랜더 이용 학원 목록§!\n[BA_highlander_use_list]\n"
 BA_nationalize_highlander: "국내 선로 지분 몰수"
 BA_nationalize_highlander_tt: "\n투자 §Y10§!마다 §Y민간 공장§!을 §G1§!씩 최대 §Y5§! 받습니다:\n\n"
 BA_press_highlander: "하이랜더 철도학원 압박"
 BA_press_highlander_desc: "하이랜더 철도학원의 본사가 우리의 통제에 놓여있습니다. 우리는 이들에게 적절한 압력을 가할 수 있을 것입니다."
 BA_highlander_hide_list: "하이랜더 이용 학원 목록 숨기기"
 BA_highlander_show_list: "하이랜더 이용 학원 목록 보이기"
 BA_invest_highlander: "하이랜더에 투자"
 Highlander.1.t: "하이랜더에 투자"
 Highlander.1.d: "하이랜더에 투자함으로써 우리는 하이랜더에 대한 우리의 영향력을 늘릴 수 있습니다."
 Highlander.1.b: "소규모 투자를 진행하자."
 Highlander.1.f: "대규모의 투자를 하자."
 Highlander.3.t: "선로 증축"
 Highlander.3.d: "하이랜더 철도학원에서 우리 학원 내의 선로를 증축하기로 하였습니다."
 Highlander.3.a: "투자한 보람이 있군."
 Highlander.4.t: "열차 추가 배치"
 Highlander.4.d: "하이랜더 철도학원에서 우리 학원 내의 선로를 오가는 열차를 추가적으로 배치하기로 하였습니다."
 Highlander.4_tt: "\n(£GFX_HTA_FLAG  §Y하이랜더 철도학원§!) @[THIS.gettag] §Y[THIS.getname]§!의 투자가 §G10§! 이상임에 따라 발동됩니다."
 Highlander.5.t: "산업-철도 연계"
 Highlander.5.d: "철도 산업이 발전하면서 학원의 산업 또한 성장하고 있습니다."
 Highlander.5_tt: "\n(£GFX_HTA_FLAG  §Y하이랜더 철도학원§!) @[THIS.gettag] §Y[THIS.getname]§!의 투자가 §G15§! 이상임에 따라 발동됩니다."
 Highlander.6.t: "철도학원 간부 파견"
 Highlander.6.d: "하이랜더 철도학원에서 학원 내 선로를 관리할 간부를 파견하였습니다."
 Highlander.6_tt: "\n(£GFX_HTA_FLAG  §Y하이랜더 철도학원§!) @[THIS.gettag] §Y[THIS.getname]§!의 투자가 §G20§! 이상임에 따라 발동됩니다."
 Highlander.7_tt: "\n(£GFX_HTA_FLAG  §Y하이랜더 철도학원§!) @[THIS.gettag] §Y[THIS.getname]§!의 투자가 §G25§! 이상임에 따라 발동됩니다."
 Highlander.7.5_tt: "\n(£GFX_HTA_FLAG  §Y하이랜더 철도학원§!) @[THIS.gettag] §Y[THIS.getname]§!의 투자가 §G30§! 이상임에 따라 발동됩니다."
 Highlander.8.t: "하이랜더 최대투자국 변경"
 Highlander.8.d: "하이랜더 최대투자국이 변경되었습니다."
 Highlander.8.a: "그렇군."
 Highlander.9.t: "철도망 개선"
 Highlander.9.d: "하이랜더 철도학원이 우리의 철도망을 개선했습니다."
 Highlander.10.t: "주식 매각"
 Highlander.10.d: "하이랜더 철도학원의 주가가 지속적으로 떨어짐에 따라 우리 학원의 일부 소액 투자자들이 주식을 매각했습니다."
 Highlander.10.a: "알겠다."
 Highlander.11.t: "지분 매각"
 Highlander.11.d: "안정적인 재정을 확보하기 위해서 정부의 관료들이 하이랜더 지분을 일부 매각했습니다."
 Highlander.12.t: "철도 불황"
 Highlander.12.d: "철도 산업이 정체되어 가고 있습니다. 우리 학원의 많은 투자자들이 관련 투자를 중단하고 있습니다."
 Highlander.12.a: "젠장."
 Highlander.13.t: "가격 완화"
 Highlander.13.d: "하이랜더 철도에의 투자 비용이 감소했습니다."
 Highlander.13.a: "좋군."
 Highlander.13_tt: "§Y대규모 투자§!에 드는 §Y소비재 공장 변동치§! 감소"
 Highlander.15.t: "궤간 문제"
 Highlander.15.d: "지속적인 노력 끝에 철도 문제는 어느 정도 해소되었고, 이제 우리는 하나의 표준 궤간을 정하여 전국 철도망을 통합, 개편할 계획을 세우고 있습니다. 그러나 여기서 새로운 고민이 생겼습니다. 수많은 궤간 중 어떤 것을 표준으로 채택할 것인가 하는 문제입니다. 각 궤간은 서로 다른 장단점을 지니고 있으며, 선택에 따라 다양한 이익을 얻을 수 있습니다."
 Highlander.15.a: "표준궤로 통일하자."
 Highlander.15.b: "표준궤에 협궤를 섞어 쓰자."
 Highlander.15.c: "이베리아 궤간을 쓰자."
 Highlander.15.e: "광궤를 쓰자."
 Highlander.15.b_tt: "\n§g협궤는 하이랜더 철도의 주류 규격입니다:§!\n"
 
