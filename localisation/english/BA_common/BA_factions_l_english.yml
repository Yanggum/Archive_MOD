 # Faction manifests below

 pax_trinica_goal_name: "Pax Trinica"
 pax_trinica_goal_desc: "The Great Transfer revealed the utter incompetence of the General Student Council. Under the leadership of Misono Mika, the great and just Second Trinity stands as the only academy capable of uniting all of Kivotos."
 gehenna_supremacy_goal_name: "Gehenna Supremacy"
 gehenna_supremacy_goal_desc: "Spreading the order of Gehenna throughout Kivotos and uniting the world under the banner of Gehenna is the paramount objective of the Gehenna Union."
 protection_of_the_old_trinity_order_goal_name: "Protectors of Tradition and Order"
 protection_of_the_old_trinity_order_goal_desc: "Trinity and its allies argue for the preservation of long-standing traditions passed down from before the Great Transfer, refusing to succumb to the order of human nations while maintaining the culture and ideology of Kivotos based on sisterhood."
 pan_arabism_goal_name: "Pan-Arabism"
 pan_arabism_goal_desc: "The Arab people have been divided by foreign powers. Now is the time to gather and unite them as one!"
 gsc_supremacy_goal_name: "Kivotos Control"
 gsc_supremacy_goal_desc: "The General Student Council must bear the responsibilities and duties befitting its name, and the destiny of Kivotos to fall under its control remains unchanged—even in the face of the absurd premise known as the Great Transfer."
 FRA_BA_buffer_zone_security_goal_name: "Securing Buffer Zones"
 FRA_BA_buffer_zone_security_goal_desc: "France is directly exposed to threats. We will annex surrounding states to secure buffer zones for French national security and leap forward as the strongest hegemon in Europe."
 BA_liberation_of_all_europe_name: "Liberation of All Europe"
 BA_liberation_of_all_europe_desc: "We must eradicate the pan-European anti-democratic, bourgeois, and imperialist exploitation that has emerged since the Great Transfer and rightfully proclaim a liberated Europe."

 # Goals
 ## Initial Goals
 one_trinity_goal_name: "One Trinity"
 one_trinity_goal_desc: "To sever the legacy of the incomplete First Council, the annexation of the Arius Branch School is now necessary. This shall represent the true unification of Trinity and a glorious day for its students."

 ## Mid-term Goals
 goal_TRN_defeat_gehenna_name: "Seizing Gehenna Cities"
 goal_TRN_defeat_gehenna_desc: "To diminish Gehenna's war-making capabilities, we must occupy the enemy's core cities. Seizing major strongholds, particularly the Central and South Districts, will break the enemy's will to fight."
 goal_gehenna_defeat_trinity_name: "Seizing Trinity Strongholds"
 goal_gehenna_defeat_trinity_desc: "Trinity's vital strongholds are the most appropriate strategic targets for the Gehenna Union. While the primary objective is Eden, the defeat of Trinity will only be certain once all major cities surrounding Eden have fallen."
 goal_GEH_TRM_defeat_gehenna_name: "Crushing Pandemonium's Ambitions"
 goal_GEH_TRM_defeat_gehenna_desc: "Seizing the Gehenna Central District—the heart of the Pandemonium Society—and its surrounding strongholds is the most critical objective of our military operations. Let us ensure the banner of the Pandemonium Society never flies over these vital regions again."
 goal_LUX_defeat_gehenna_name: "Seizing Gehenna Cities"
 goal_LUX_defeat_gehenna_desc: "For the establishment of a Luxembourg-led Germanic United Duchy and to permanently resolve the security concerns of our allies, Gehenna's major cities must be occupied. Though the primary target is the Gehenna Central District, victory will only be assured when all surrounding key cities are captured."
 faction_goal_FRA_BA_restoration_of_france_treaty_of_paris_name: "Restoration of Borders to the Treaty of Paris"
 faction_goal_FRA_BA_restoration_of_france_treaty_of_paris_desc: "It is the mission of the New France and a right we must rightfully enjoy to reclaim French territories trampled by otherworldly beings."
 COLLECTION_STATES_TO_1930_FRA: "French Territories from the Treaty of Paris Not Under Control"
 COLLECTION_FACTION_all_states_to_1930_france: "French Territories from the Treaty of Paris"
 COLLECTION_FACTION_CONTROLLED_all_states_to_1930_france: "French Territories from the Treaty of Paris"

 ## Late-term Goals
 faction_goal_no_trinity_in_gehenna_name: "Integrity of Gehenna Territory"
 faction_goal_no_trinity_in_gehenna_desc: "Now that Gehenna stands against Trinity's war machine, we must recover our lost territories from Trinity's violent tides. The lands of Gehenna shall be united, never to fall before Trinity's expansionist ambitions again."
 COLLECTION_NO_TRINITY_IN_GEHENNA: "States in Gehenna Mainland Controlled by Trinity and its Allies"
 faction_goal_true_eden_treaty_name: "Unity Against Pandemonium's Ambitions"
 faction_goal_true_eden_treaty_desc: "Amidst the war between Gehenna and Trinity, the Tea Party Host is coordinating a grand strategy with the Disciplinary Committee to geographically isolate the Pandemonium Society and target the Gehenna Central District from both the South and East."


 faction_goal_FRA_restoration_of_natural_borders: "Annexation of the West Bank of the Rhine"
 faction_goal_FRA_restoration_of_natural_borders_desc: "France's next objective is rightfully the annexation of the West Bank of the Rhine, establishing a grand French hegemony to resurrect the old system where all of Europe moves in the name of France."
 COLLECTION_FRA_IN_NATURAL_BORDERS: "States of the Rhine West Bank Natural Border Not Controlled by France"
