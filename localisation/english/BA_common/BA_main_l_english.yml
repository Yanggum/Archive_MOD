 ## TAB 3 #
 KR_welcome_splash_tab_3_content: "§YPlease keep the following in mind:§!\n£white_dot\n\n\n£white_dot\n\n\n£white_dot\n\n£white_dot\n\n\n\n\n§YReport an Issue:§!\nThis mod is still in development, so bugs and crashes may occur. If an issue arises, please report it on our §YBlue Archive Mod Discord§! so we can fix it quickly. The link can be found on the Steam page."
 KR_welcome_splash_tab_3_content_0: "The Blue Archive mod does not restrict player choices such as §RNation Liberation§!, §RFast War§!, or §RCheat Usage§!, but we recommend avoiding them for the best experience. \nDuring §YPeace Agreements§!, you should aim to annex all possible nations. Otherwise, conditions for §YEvents or Decisions§! may become §Rtangled or ineffective§! later on. \nYou can adjust various options in the §YCustom Game Rules§! menu, such as §tEnabling Trinity Collapse§! or §0The Descent of the Chroma§!. \nThis mod is intended to be played with §YAll DLCs owned§! to function as the §Ydevelopers intended§!. \nPlease verify on the Steam page that you own §Yall DLCs§!."
#
 ## TAB 4 ## 
 KR_welcome_splash_tab_4_upper_header: "§YWelcome to Blue Archive BETA $BA_CURRENT_VERSION$"
 KR_welcome_splash_tab_4_lower_header: "Created with love by the Blue Archive Team:§!"
 KR_welcome_splash_tab_4_content: "SKSKle   Kangseul2702   AfterImage   jindoi  Sonetto  mintcoon  Imika\nJamm   Sihyun   Skoober   mako0922   goddess6431  _yurizono.seia_  UnineVesiKass  subikgm  16729kei\n\n§gSpecial thanks to dawn, Rikka, victorious09, execution_2525, coy-0001, lusaviet, anpleur, crossesyes, neunal, 16729, kaichou09, Fraise, Borikkori, pencildude, bang0709, the_master_pigeon for their support. §!\n\nAnd thanks to the creators of £GFX_tx_logo_road_to_56 The Road to 56, £GFX_tx_logo_kr Kaiserreich, £GFX_tx_logo_dh Darkest Hour, £GFX_tx_logo_pb Pax Britannica, £GFX_tx_logo_tno The New Order\n £GFX_tx_logo_ssw The Sun Shining on the World mods!"
 KR_welcome_splash_tab_4_content_0: "Our team has worked tirelessly—hitting many a pity pull along the way—to provide the best experience in the Blue Archive mod. It is an honor just to have you play our mod.\nWe hope you enjoy playing Blue Archive as much as we enjoyed creating it!"

