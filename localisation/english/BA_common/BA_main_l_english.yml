 BA_form_iberia_category: "Iberian Federation"
 BA_form_iberia_category_desc: "The glorious days of old have passed, and we now stand upon faded fantasies. Though over 300 years have passed since 1640, the people of Madrid and Lisbon still dream the same dream. For three centuries, they have worked tirelessly within that recurring dream to reclaim the fantasy. Even if the Iberian Peninsula fell into deep darkness between the cracks of eternity, the dream and fantasy we all shared was never a lie."
