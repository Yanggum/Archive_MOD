  #Bookmark
 BA_scenario_name: "50 Days in a New World"
 BA_scenario_desc: "Is it a supernatural phenomenon? Or perhaps a prank played by God? A thousand years wouldn't be enough to explain this. However, the anticipation for this new world was short-lived, shattered into pieces. The people there defined us as invaders and attacked without hesitation. Due to the overwhelming difference in power, they were easily dispersed and broken, but the wounds they left are etched deep within us. It will likely take a long time for these scars to heal."
 
 Debug_BA_gathering_storm_desc: "If you see me, please write a bug report."
 highlight_major_1_tt: "@RED §YRed Winter Federal Academy§! Path: "
 highlight_major_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_RED_path_texticon\n\n\n\n\n\n\n§YOur Great Leader Cherino§! - §RRenkawa Cherino§!\n  £white_dot §gCherino's Regime Revolution§!\n  £white_dot §gTrotsky's World Revolution§!\n§g========================================§!\n§YNotice§!: Red Winter is a vanilla-style nation without specific storytelling events or endings. Recommended for those who want free sandbox play."

 highlight_major_2_tt: "@MIL §YMillennium Science School§! Path: "
 highlight_major_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_MIL_path_texticon\n\n\n\n\n\n\n§tAll paths incomplete§!\n\n§YSeminar-led Technocracy§! - §CTsukatsuki Rio§!\n  £white_dot §gRio's Power Maintenance§!\n  £white_dot §gHayase Yuuka's Ascension§!\n  £white_dot §gUshio Noa's Ascension§!\n\n§YVeritas-led Technocracy§! - §GAkeboshi Himari§!\n§g========================================§!\n§YNotice§!: Millennium is a vanilla-style nation without specific storytelling events or endings. Difficulty is easy; recommended for sandbox play or those seeking a relaxed game."

 highlight_major_3_tt: "@TRM §YTrinity General School§! Path:"
 highlight_major_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_TRM_path_texticon\n\n\n\n\n\n\n§tAll paths incomplete§!\n\n§YBirth of the Second Trinity§! - §MMisono Mika§!\n  £white_dot §gConstruction of a Just Trinity§!\n    £white_dot §Y2§! Endings available.\n\n §YNoble Obligation§! - §LKirifuji Nagisa§!\n  £white_dot §gTrinity's New Millennium§!\n    £white_dot §Y2§! Endings available.\n\n §YTrue Student Democracy§! - §YAjitani Hifumi§!\n  £white_dot §gKirifuji Nagisa's Restoration§!\n    £white_dot §Y2§! Endings available.\n  £white_dot §gUtazumi Sakurako's Ascension§!\n    £white_dot §Y1§! Ending. Urawa Hanako branch exists.\n  £white_dot §gAomori Mine's Ascension§!\n    £white_dot §Y1§! Ending.\n  £white_dot §gStudent Council President Ajitani Hifumi§!\n    £white_dot §Y1§! Ending.\n§g========================================§!\n§YNotice§!: Trinity follows a Kaiserreich-style simple narrative focused on the students' daily lives. Recommended for beginners."

 highlight_major_4_tt: "@COU §YGeneral Student Council§! Path: "
 highlight_major_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_COU_path_texticon\n\n\n\n\n\n\n§YRule of the Superman§! - §PShiranui Kaya§!\n  £white_dot §Y3§! Endings available.\n\n§YRestoration of GSC Order§!: §RIncomplete§! - §2Nanagami Rin§!\n   £white_dot §Y2§! Endings available.\n\n§YConsul§!: §RIncomplete§! - §5Oki Aoi§! and §pYuragi Momoka§!\n   £white_dot §Y2§! Endings available.\n§g========================================§!\n§YNotice§!: GSC mixes Kaiserreich style with storytelling narratives. It presents a §Ychallenging§! difficulty due to threats from Schale early on."

 highlight_major_5_tt: "@GEM §YPandemonium Society§! Path: "
 highlight_major_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEM_path_texticon\n\n\n\n\n\n\n §gPandemonium Society is a nation where the focus tree changes based on which focuses are prioritized, and it encounters unique shifts based on specific conditions.§!\n\n§gFocuses by Leader§!\n  £white_dot Chairman §YHanuma Makoto§!\n  £white_dot Chairman §YKogyoku Satsuki§!\n  £white_dot Chairman §YNatsume Iroha§!\n  £white_dot Chairman §YMotomiya Chiaki§!\n  £white_dot Chairman §YTanga Ibuki§! - (§RIncomplete§!)\n\n §gEstablishment Paths by Leader§!\n  £white_dot Hanuma Makoto's §OEndless War State§!\n  £white_dot Kogyoku Satsuki's §OPeaceful Nation§!\n  £white_dot Natsume Iroha's §OUnited States of Gehenna§!\n  £white_dot Motomiya Chiaki's §ONew Administration§!\n  £white_dot Tanga Ibuki's §OGrowth§! - (§RIncomplete§!)\n\n §gNational Form Focuses§!\n  £white_dot Proclaim §OGerman State§!\n  £white_dot Proclaim §OGerman-Gehenna Federation§!\n  £white_dot Maintain §OGehenna§!\n\n§g========================================§!\n§YNotice§!: Pandemonium Society is a vanilla-style nation with complex systems and branching paths. Difficulty is §Ohigh§! due to scheduled wars with Disciplinary Committee and Trinity. Recommended for advanced players."

 highlight_major_6_tt: "@HYA §YHyakkiyako Allied Academy§! Path: \n\n\n\n\n\n   £GFX_HYA_path_texticon\n\n\n\n\n\n\nThe Strongest Horned Lion\n\n§g========================================§!\n§YNotice§!: Hyakkiyako has §YNormal§! difficulty, combining vanilla style with narrative elements. Recommended for those wanting freedom in play."
 highlight_major_7_tt: "@SHA §YShanhaijing Senior Secondary School§! Path: \n\n\n\n\n\n   £GFX_SHA_path_texticon\n\n\n\n\n\n\nMaster Kisaki also uses Xiaomi\n §GLegacy of Red Vienna§!\n    £white_dot Austro-Marxism Revival\n    £white_dot Socialism with Shanhaijing Characteristics\n\n§g========================================§!\n§YNotice§!: Shanhaijing has §YNormal§! difficulty, combining vanilla style with narrative elements. Recommended for those wanting freedom in play."

 highlight_minor_1_tt: "@LUX §YGrand Duchy of Luxembourg§! §g(Problem Solver 68)§! Path: "
 highlight_minor_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_HEU_path_texticon\n\n\n\n\n\n\n §gPro-Gehenna Government§!\n  £white_dot Luxembourg 68 Revolution - §G(Default)§!\n\n §gAnti-Gehenna Government§!\n  £white_dot Passing the §YCivil Rights Act§!\n  £white_dot Rejecting the §YCivil Rights Act§!\n\n§g========================================§!\n§YNotice§!: Luxembourg is §Rvery challenging§! and story-heavy. Recommended for those seeking new experiences or interested in the otherworldly story of §YProblem Solver 68§!."

 highlight_minor_2_tt: "@GEH §YGehenna Disciplinary Committee§! Path: "
 highlight_minor_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEH_path_texticon\n\n\n\n\n\n\n §gSorasaki Hina's Government§!\n  £white_dot Shiromi Iori's Militaristic Government\n  £white_dot Sorasaki Hina Dictatorship by Zealots\n  £white_dot Amau Ako and Planning Division Technocracy\n  £white_dot Status Quo\n\n §gResignation of Sorasaki Hina§!\n  £white_dot Shiromi Iori as Head of Disciplinary Committee\n  £white_dot Zealot Collective Leadership System\n  £white_dot Rule of Robot Sorasaki Hina\n  £white_dot Planning Division Collective Leadership System\n  £white_dot Status Quo\n§g========================================§!\n§YNotice§!: Gehenna Disciplinary Committee is a §Rchallenging§! Kaiserreich-style nation. Hina resigns if Gehenna and Trinity aren't conquered within a time limit, leading to entirely different stories. Recommended for hardcore players."

 highlight_minor_3_tt: "@ABY §YAbydos High School§! Path:"
 highlight_minor_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ABY_path_texticon\n\n\n\n\n\n\n §4Restoring Masaryk's Legacy§!\n  £white_dot §gMasters of this Land§! - §YLocal Government§!\n    £white_dot §Y1§! Ending available. - (§RIncomplete§!)\n  £white_dot §gNation of Two Worlds§! - §tOkusora Ayane§!\n    £white_dot §Y1§! Ending available. - (§RIncomplete§!)\n\n§4Democracy, a Candle in the Wind§!\n  £white_dot §gThe Rattling Key§! - §CSunaookami Shiroko§!\n    £white_dot §Y2§! Endings available.\n  £white_dot §gTrue People's Democracy§! - §PTakanashi Hoshino§!\n    £white_dot §Y1§! Ending available.\n\n§4War of the Madmen§!\n  £white_dot §gRevenge for the Dead.§! - §0Kuromi Serika§!\n    £white_dot §Y2§! Endings available. - (§RIncomplete§!)\n  £white_dot §gEnlighten All Kivotos.§! - §LAsagiri Suou§!\n    £white_dot §Y1§! Ending available. - (§RIncomplete§!)\n  £white_dot §gLeader Who Lost Strength.§! - §8Izayoi Nonomi§!\n    £white_dot §Y1§! Ending available. - (§RIncomplete§!)\n§g========================================§!\n§YNotice§!: Abydos is a §Rchallenging§! narrative-driven nation. Most paths focus on cooperation with locals and democratic completion. A historical figure plays the 'Sensei' role. Recommended for players who enjoy interactions between Kivotos and the local world.§!"
 
 highlight_minor_4_tt: "@FRA §YFrench Republic§! Path:"
 highlight_minor_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_FRA_path_texticon\n\n\n\n\n\n\n §YThe Road Home§!\n  £white_dot §g'The Lion of Verdun'§! - §4Philippe Pétain§!\n  £white_dot §g'Embers of the Republic'§! - §tMaurice Gamelin§!\n  £white_dot §g'Cross of Lorraine'§! - §YCharles de Gaulle§!\n§g========================================§!\n§YNotice§!: French Republic is a vanilla-style nation without specific storytelling events or endings. Recommended for sandbox play."
 
 highlight_minor_5_tt: "@ARI §YArius Branch School§! Path:"
 highlight_minor_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ARI_path_texticon\n\n\n\n\n\n\n §gArius Branch School features a unique structure where the path broadens as the nation expands.§!\n\n§gAscension of the Squad§!\n  £white_dot Victory of the Conservatives\n  £white_dot Victory of the Reformists - (§CReleased!§!)\n  £white_dot Draw - (§RIncomplete§!)\n\n§g========================================§!\n§YNotice§!: Arius balances storytelling and vanilla HOI4 gameplay. Difficulty is §Rvery high§! due to the war with Trinity. Recommended for expert players."

 HYA_GATHERING_STORM_DESC: "An academy of culture and festivals, boasting a long history and tradition. Hyakkiyako continues its busy days under the lights of cultural celebrations, both before and after the Great Transfer.\n\nHowever, it is time to face reality. The unprecedented Great Transfer has shaken the roots of Kivotos, and as a branch of the tree, Hyakkiyako must also embrace change.\n\nThe Yin-Yang Club, which traditionally replaced the student council, the Hyakkayouran which rose after the Transfer, and countless others struggle to find their opportunity."
 
 #Valkyrie Police Academy
 KSP_GATHERING_STORM_DESC: "Valkyrie Police Academy suffered the most damage among all academies due to the Great Transfer. Students spread across Kivotos lost all contact instantly and remain unreachable. Furthermore, with the collapse of the Valkyrie Correctional Bureau, Kivotos' most dangerous individuals are seeking escape.\n\nAmidst these crises, Kanna is somehow leading the academy, but one wonders how much longer she can endure..."
 #SRT
 SRT_GATHERING_STORM_DESC: "Known for rigorous training and harsh selection, SRT Special Academy was established by the GSC President to flexibly respond to major crimes in each academy. While its existence was controversial for infringing on academy autonomy, the President's reputation prevented open revolt.\n\nDue to the chaos of the Great Transfer, SRT found itself isolated from the GSC. If the President's safety is compromised, SRT's very existence will become uncertain..."
 OTHER_THE_GATHERING_STORM_DESC: "\"Wherever students are in trouble, Schale will be there.\" - Sensei"

