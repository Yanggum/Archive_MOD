 BA_kivotos_student_recruitment: "Kivotos Student Recruitment"
 BA_kivotos_student_recruitment_desc: "The students of Kivotos, divided into numerous factions and subject to various interest groups and economic polarization, can often be recruited with a modest sum of money and a guarantee of status."
 kivotos_artificial_halo_replica_tech:0 "Mystic Weaver Replication"
 kivotos_artificial_halo_replica_tech_desc:0 "We have managed to partially replicate the Mystic Weavers used in Kivotos."
 kivotos_halo_special_purpose: "Halo Special Purpose"
 kivotos_halo_special_purpose_desc: "On open plains, Halo infantry exposed to concentrated enemy fire may not achieve meaningful objectives. However, if we shift the battlefield, what if these Halo infantry are trained for specialized terrain?"
 kivotos_halo_mountaineers: "Halo Mountain Warfare"
 kivotos_halo_mountaineers_desc: "By training Halo divisions specialized in mountain combat, we can improve their fighting capabilities in high-altitude terrain and minimize risks by providing specialized equipment and training."
 kivotos_halo_marine: "Halo Amphibious Warfare"
 kivotos_halo_marine_desc: "The need for specialized units for amphibious landings applies to Halo infantry as well. Supported by landing craft and specialized training, Halo infantry will bolster combat capabilities in aquatic operations."
 kivotos_halo_paratrooper: "Halo Airborne Warfare"
 kivotos_halo_paratrooper_desc: "Dropping Halo infantry into the heart of enemy territory will unlock numerous strategic options, such as capturing vital points, sabotaging supply lines, or conducting urban sieges."
 kivotos_halo_ranger: "Halo Jungle Warfare"
 kivotos_halo_ranger_desc: "Halo infantry adapted to the terrain and vegetation of the jungle can ensure operational capability in deep jungles that were previously difficult to access."
 kivotos_halo_special_urban_infantry_1: "Halo Urban Warfare I"
 kivotos_halo_special_urban_infantry_1_desc: "Infantry units possessing Halos can withstand enemy fire and, unlike armored units, are agile and flexible, allowing them to easily overcome the dangers of urban warfare."
 kivotos_halo_special_urban_infantry_2: "Halo Urban Warfare II"
 kivotos_halo_special_urban_infantry_2_desc: "Unlike traditional small-scale special operations forces, the urban combat capabilities of Halo infantry are exceptionally proficient. By scaling up small-unit tactics to large-scale operations, we can assault multiple enemy cities simultaneously."
 kivotos_halo_special_urban_infantry_3: "Halo Urban Warfare III"
 kivotos_halo_special_urban_infantry_3_desc: "By flexibly adjusting urban assaults based on city types and utilizing support from artillery and air power, we can mitigate risks and conduct safer urban operations."
 kivotos_halo_recon:0 "Halo Recon Company"
 kivotos_halo_recon_desc:0 "A reconnaissance company composed of Halo infantry. They can scout through significant rugged terrain without much difficulty."
 kivotos_halo_engineer:0 "Halo Engineer Company"
 kivotos_halo_engineer_desc:0 "An engineer company composed of Halo infantry. They can perform full-scale engineering roles even under heavy fire, maximizing the utility of Halo infantry."
 kivotos_infantry_weapons:0 "Mystic Weaver"
 kivotos_infantry_weapons_short:0 "Mystic Weaver"
 kivotos_infantry_weapons_desc: "Based on the theories of Utaha Shiraishi and Saya Yakushi, this equipment artificially weaves 'Mystic' using Pyroxene. Through various iterations, it now achieves its full performance."
 kivotos_halo_upgrade:0 "Halo Infantry Upgrade"
 kivotos_halo_upgrade_desc:0 "Conduct combat manual and standard equipment training for Halo infantry to enhance their combat effectiveness."
 kivotos_halo_max_upgrade:0 "Halo Division Expansion I"
 kivotos_halo_max_upgrade_desc:0 "Organize more students into combat personnel."
 kivotos_halo_max_upgrade_1:0 "Halo Division Expansion II"
 kivotos_halo_max_upgrade_1_desc:0 "Massively expand combat training programs."
 kivotos_halo_special_forces:0 "Halo Special Forces"
 kivotos_halo_special_forces_desc:0 "Train elite Halo Special Forces to respond to diverse tactical situations."
 kivotos_halo_light_infantry:0 "Halo Light Infantry Training Program"
 kivotos_halo_light_infantry_desc:0 "Organize divisions to be lighter and more flexible."
 kivotos_halo_heavy_infantry:0 "Heavy-Armed Halo Infantry"
 kivotos_halo_heavy_infantry_desc:0 "Halo infantry units armed with heavy weaponry."
 kivotos_halo_upgrade_1:0 "Halo Combined Combat"
 kivotos_halo_upgrade_1_desc:0 "Refine combat training programs to better utilize their defensive capabilities. The combat power of Halo infantry has been further enhanced."
