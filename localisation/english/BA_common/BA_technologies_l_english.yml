 # Miscellaneous
 group_mystic_title: "Mystic Battalion"

 # Reworked Engineering
 BA_mystic_engineering_tech: "Arch-Engineering Technology"
 BA_mystic_engineering_tech_desc: "Future technological blueprints realized through Kivotos Pyroxene are difficult to mass-produce, but they can be highly effective if Pyroxene resources are available for development."

 BA_pyroxene_material_semiconductor_engineering: "Pyroxene Materials - Semiconductor Engineering"
 BA_pyroxene_material_semiconductor_engineering_desc: "By utilizing Pyroxene, we can commercialize semiconductor technology previously considered science fiction and develop lighter, more powerful materials."
 kivotos_dron_tech: "Brushless Motor"
 kivotos_dron_tech_desc: "By producing solid-state rectification technology with Pyroxene-based semiconductors, we can introduce brushless motors decades ahead of their time for military use."
 kivotos_pyroxene_main_gun_stabilization_device: "Pyroxene Main Gun Stabilizer"
 kivotos_pyroxene_main_gun_stabilization_device_desc: "Electric main gun stabilizers using high-performance semiconductors and motors can be implemented a century early through the use of Pyroxene."

 BA_pyroxene_aerodynamics: "Pyroxene Aerodynamics"
 BA_pyroxene_aerodynamics_desc: "By utilizing Pyroxene and new materials for lighter airframes combined with semiconductor technology, we can manufacture unmanned aircraft that fly at high altitudes without the need for a pilot."

 BA_UCAV_aircraft: "$UCAV_equipment_1$"
 BA_UCAV_aircraft_desc: "$UCAV_equipment_1_desc$"

 BA_mystic_engine_technology: "Mystic Engine Technology"
 train_equipment_4: "Kivotos-style Train"
 train_equipment_4_desc: "An armored train operated in Kivotos, manufactured using Pyroxene. It is characterized by its incredible speed and massive armament. It is specialized in protecting cargo from enemy attacks and possesses heavy anti-air weaponry."

 BA_heavy_artillery_battery: "Heavy Artillery Battery"
 BA_heavy_artillery_battery_desc: "We will establish the foundation for applying massive fire projection technologies to this world, inspired by the standard defensive power levels of the Kivotos world."

 BA_pyroxene_capacitor: "Pyroxene Capacitor"
 BA_pyroxene_capacitor_desc: "By developing a device that stores the formidable power required for a railgun using Pyroxene, we can significantly enhance the railgun's lethality."
 BA_lorentz_maximized_rail: "Lorentz Maximized Rail"
 BA_lorentz_maximized_rail_desc: "Through deep exploration of the interaction between Pyroxene and the Lorentz force, we can sublimate engineering designs to maximize the velocity of railgun projectiles."
 BA_railgun_cs_projectile: "Railgun Fragmentation Projectile"
 BA_railgun_cs_projectile_desc: "Developing fragmentation projectiles with wide-area suppression capabilities similar to high-explosive shells significantly boosts the anti-personnel stopping power of railguns and allows for more complex ammunition types."

 BA_in_depth_mystic_analysis: "In-depth Mystic Analysis"
 BA_in_depth_mystic_analysis_desc: "In-depth analysis of 'Mystic' is necessary for the smooth operation of Kivotos students or Mystic Engineering divisions, as well as for long-term exploration of the unknown."
 BA_artificial_mystic_1: "Artificial Mystic I"
 BA_artificial_mystic_1_desc: "Perhaps we can synthesize Mystic artificially through more diverse methods. It might be called inhumane, but we must master the technologies of Mysticism."
 BA_advanced_mystic_weaver: "Advanced Mystic Weaver"
 BA_advanced_mystic_weaver_desc: "An extremely advanced Mystic Weaver that utilizes more Pyroxene to implement Mystics beyond those of Kivotos, providing the sensation of being supported by someone through the power of Pyroxene."
 BA_artificial_mystic_2: "Artificial Mystic II"
 BA_artificial_mystic_2_desc: "Through deeper research, we can develop integrated Mystic management technologies and uncover truths amidst numerous mysteries."
 BA_otherworld_equipment_analysis: "Otherworldly Equipment Analysis"
 BA_otherworld_equipment_analysis_desc: "Materials from Kivotos are generally made with highly advanced technology, making them difficult to replicate or analyze. Nevertheless, if we succeed in gaining insight, we will acquire superior technology."
 BA_otherworld_reinforced_body_armor: "Reinforced Body Armor"
 BA_otherworld_reinforced_body_armor_desc: "Using synthetic materials or trace amounts of Pyroxene dust, we can research Kivotos-style body armor that offers superior ballistic protection."
 BA_juggernaut_pioneer: "Juggernaut Special Support Group"
 BA_juggernaut_pioneer_desc: "The Juggernaut Special Support Group is a concentrated company established to effectively integrate Mystic-infused exoskeleton suits into existing operational systems and handle high-end equipment that is difficult to maintain. They are dispatched to various operational battalions to perform missions using exoskeleton suits."
 BA_juggernaut_1: "Juggernaut I"
 BA_juggernaut_1_desc: "Arming powerful special-purpose divisions focused on Mystic-infused exoskeletons—commonly known as Juggernauts—will enable the breakthrough of frontlines and the operation of shock divisions in rugged terrain."
 BA_juggernaut_2: "Juggernaut II"
 BA_juggernaut_2_desc: "Beyond simple shock divisions, we can enhance advanced training to fill gaps in the frontline and perform flexible operations in complex battlefields through the versatile use of Juggernauts."
 BA_juggernaut_3: "Juggernaut III"
 BA_juggernaut_3_desc: "Juggernaut divisions are now becoming a necessity in our order of battle. By reinterpreting Mystic weaving mechanisms, we can develop better output and effectively upgrade the operation of Juggernaut battalions through closer integration with each branch of service."

 pyroxene_stabilization_1: "Pyroxene Stabilization I"
 pyroxene_stabilization_1_desc: "By partially elucidating the mechanisms of unstable Pyroxene, we can secure the stability necessary for operating various Mystics."
 pyroxene_stabilization_2: "Pyroxene Stabilization II"
 pyroxene_stabilization_2_desc: "By interpreting most of the Pyroxene mechanisms, we will secure greater stability and augment our ability to utilize Pyroxene flexibly."

 BA_plasma_condensation_battery: "Plasma Condensation Battery"
 BA_plasma_condensation_battery_desc: "Using Pyroxene, we can overcome mechanical instabilities and develop massive batteries using high-temperature plasma, creating mobile artillery batteries that operate on continuous Pyroxene consumption."

 # SPECIALIZATION NAMES
 mystic_engineering_facility: "Arch-Engineering Mystic Laboratory"
 mystic_engineering_facility_plural: "Mystic Laboratories"
 mystic_engineering_facility_desc: "By securing an Arch-Engineering Mystic Laboratory, we can research temporary technological transcendence utilizing otherworldly tech and Pyroxene."

 specialization_mystic_engineering: "Mystic Engineering"
 specialization_mystic_engineering_short: "Mysticism"

 # SCIENTIST XP REWARDS
 sp_mystic_generic_reward_scientist_xp_1: "Subtle Resonance of Pyroxene"
 sp_mystic_generic_reward_scientist_xp_1_desc: "[Character.GetName] observed a phenomenon where Pyroxene fragments vibrate subtly at specific frequencies. While not a complete interpretation, it provides an important clue regarding the potential of this mineral."
 sp_mystic_generic_reward_scientist_xp_2: "Progress in OOPArts Interpretation"
 sp_mystic_generic_reward_scientist_xp_2_desc: "In the process of combining excavated ancient artifacts (OOPArts) with modern engineering, [Character.GetName] has come to understand energy flows that cannot be explained by conventional physics."
 sp_mystic_generic_reward_scientist_xp_3: "Surreal Insight"
 sp_mystic_generic_reward_scientist_xp_3_desc: "[Character.GetName] has formulated a core theory for dimensional interference technology mediated by Pyroxene, as if inspired at the boundary between dreams and reality. This is a realm beyond simple science."
 
 sp_mystic_generic_reward_option_scientist_xp: "The future is in our hands."

 # PROGRESS REWARDS
 sp_mystic_generic_reward_major_progress_1: "Stable Energy Output"
 sp_mystic_generic_reward_major_progress_1_desc: "The prototype reacted successfully with the Pyroxene catalyst, showing a much more stable output than expected. This will significantly shorten the initial experimental phase."
 sp_mystic_generic_reward_major_progress_2: "Successful Material Synthesis"
 sp_mystic_generic_reward_major_progress_2_desc: "The research team combined rare Pyroxene powder with synthetic materials to create a new material with drastically increased durability and conductivity. Prototype production speed has increased."
 sp_mystic_generic_reward_major_progress_3: "Miraculous Calculation"
 sp_mystic_generic_reward_major_progress_3_desc: "As if the prototype itself possesses a will of its own, it has optimized complex calculation processes to reach completion. Researchers are calling this a 'Miracle'."

 sp_mystic_generic_reward_option_major_breakthrough: "An amazing achievement."

 # FAILURE REWARDS
 sp_mystic_generic_reward_test_failure_1: "Wavelength Mismatch"
 sp_mystic_generic_reward_test_failure_1_desc: "The prototype stopped functioning because the Pyroxene's wavelength and the control device's frequency did not match. Fortunately, there is no damage, but the tedious task of recalibrating the frequency is required."
 sp_mystic_generic_reward_test_failure_2: "Energy Overload"
 sp_mystic_generic_reward_test_failure_2_desc: "Attempting to forcibly inject otherworldly energy caused the circuits to burn out. [Character.GetName] admits to underestimating the instability of Pyroxene and is modifying the design."
 sp_mystic_generic_reward_test_failure_3: "Pyroxene Wavelength Interference"
 sp_mystic_generic_reward_test_failure_3_desc: "An unknown signal mixed into the research data, throwing the numbers into chaos. It will take time to remove this 'noise' and recover the data."

 sp_mystic_generic_reward_option_test_failure: "It's merely trial and error."

 sp_mystic_generic_reward_critical_failure: "Pyroxene Collapse Phenomenon"
 sp_mystic_generic_reward_critical_failure_desc: "During the experiment, the Pyroxene exceeded its critical point and collapsed, causing a localized dimensional distortion. Parts of the facility vanished as if riddled with holes by an awl, and [Character.GetName] was injured after being caught in the swirling energy storm."
 
 sp_mystic_generic_reward_option_critical_failure: "This is a fatal mistake..."

 # THEME: MYSTIC ENGINEERING
 sp_mystic_generic_reward_engineering_tech_1: "High-Efficiency Battery Technology"
 sp_mystic_generic_reward_engineering_tech_1_desc: "As a byproduct of Mystic Engineering research, ultra-high-efficiency battery technology usable in general industry and electronic devices has been discovered."
 sp_mystic_generic_reward_engineering_tech_2: "Automated Production AI"
 sp_mystic_generic_reward_engineering_tech_2_desc: "By applying the calculation logic of ancient technology, we have developed a basic AI algorithm that maximizes factory operation efficiency."
 sp_mystic_generic_reward_engineering_tech_3: "Matter Reconstruction Protocol"
 sp_mystic_generic_reward_engineering_tech_3_desc: "We have approached a technological singularity where limited resources can be rearranged at the atomic level into necessary components. This is a revolution for national industrial capacity."

 sp_mystic_generic_reward_mystic_engineering_tech_1: "Visionary Blueprint Interpretation"
 sp_mystic_generic_reward_mystic_engineering_tech_1_desc: "We have succeeded in decoding part of an ancient ruin's blueprint that was previously uninterpretable. Our understanding of Mystic Engineering has deepened."
 sp_mystic_generic_reward_mystic_engineering_tech_2: "Refined Pyroxene Fuel"
 sp_mystic_generic_reward_mystic_engineering_tech_2_desc: "We have optimized the process for extracting high-concentration liquefied Pyroxene fuel, which is essential for operating Mystic Engineering equipment."
 sp_mystic_generic_reward_mystic_engineering_tech_3: "Arch-Engineering Focus"
 sp_mystic_generic_reward_mystic_engineering_tech_3_desc: "Through the ardent efforts and enthusiasm of our scientists, we have discovered remarkable insights into Arch-Engineering technology."

 sp_mystic_generic_reward_option_engineering_tech: "This is the progress of technology."
 sp_mystic_generic_reward_option_engineering_tech_bonus_name: "Mystic Engineering Industrial Research"


