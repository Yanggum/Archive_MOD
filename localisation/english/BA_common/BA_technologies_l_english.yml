 BA_basic_labor_automaton: "Basic Labor Automaton"
 BA_basic_labor_automaton_desc: "While these automata, capable only of repetitive tasks, may fall short of those from the Kivotos era, we can implement otherworldly technology here once again using Pyroxene engineering."
 BA_military_automaton: "Military Automaton"
 BA_military_automaton_desc: "Through complex hydraulic joints and responsive algorithms that adapt to various terrains, automata can be deployed even in the most complex battlefield conditions."
 BA_general_purpose_automaton: "General Purpose Automaton"
 BA_general_purpose_automaton_desc: "By expanding the use of general-purpose automata, we can delegate a significant portion of life's tasks to them, making the governance of the masses more efficient."
 BA_awakened_one: "The Awakened One"
 BA_awakened_one_desc: "The Heavenly Will is solemn and inviolable; it is only to be revered and extolled."

