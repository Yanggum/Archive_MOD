 stabilizer_2: "Pyroxene Main Gun Stabilizer"
 stabilizer_2_desc: "A mechanical device that ensures the gun barrel maintains the same direction while the tank is moving. Advanced main gun stabilizers manufactured using Pyroxene-based semiconductors and electronic motors make it very easy to fire while on the move."
