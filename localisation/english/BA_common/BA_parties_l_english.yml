 The_Colour_neutrality_desc:0 "§0A massive force is attacking the planet.§!\n\n§1This unknown, mysterious power erodes the world, possessing the strength to twist those it touches into beings different from what they once were. The end of the world seems near.§!"
 technocracy:0 "Technocracy"
 technocracy_desc:0 "Technocracy is a system where technocrats with scientific knowledge and expertise manage society. Governance is generally carried out through an oligarchy that organizes committees composed of technocrats."
 technocracy_communism:0 "Technocratic Communism"
 technocracy_communism_desc:0 "A variant of technocracy, Technocratic Communism is a system where technocrats with scientific expertise operate a socialist economy."
 technocracy_fascism:0 "Technocratic Order Politics"
 technocracy_fascism_desc:0 "To coordinate the relationship between Kivotos students and locals and to implement the 'Order before the Great Transfer,' 'Public Power Governance' by a strong, authoritarian, and closed group is required. To this end, we will expand the secretization of the government and strengthen extensive judicial power."
 artnocracy:0 "Artnocracy"
 artnocracy_desc:0 "Artnocracy is a variant similar in system to technocracy but pursuing different values, where artnocrats with artistic expertise manage society. Governance is generally conducted through an oligarchy of committees composed of artnocrats."
 artnocracy_fascism:0 "Artnocratic Order Politics"
 artnocracy_fascism_desc:0 "To coordinate the relationship between Kivotos students and locals and to implement the 'Order before the Great Transfer,' 'Public Power Governance' by a strong, authoritarian, and closed group is required. To this end, we will expand the secretization of the government and strengthen extensive judicial power."
 fascism_hitler:0 "National Socialist German Workers' Party"
 fascism_hitler_desc:0 "§RHe has returned!§!\n\nFor some unknown reason, the vanished Fuhrer, Adolf Hitler, has been discovered in Ireland. It is a mystery how the disappeared Hitler could return, but now is the time to follow him.\n\nHeil Hitler!"
 tea_party_ideology:0 "Trinity Triumvirate"
 tea_party_ideology_desc:0 "This unique governing system of Trinity, which appears as an oligarchy by consensus, is achieved through struggle and the acquisition of political power. The exercise of governing power is carried out by the Tea Party, where the heads of the three factions—§gPater§!, §HFilius§!, and §GSanctus§!—alternate as hosts. This system is specialized in distorting the opinions of students and the public while spreading factionalist thinking."
 hardboiled_noir:0 "Rikuhachima-ism"
 hardboiled_noir_desc:0 "Rikuhachima-ism is a Kivotos pan-nationalist ideology asserting that as long as local culture remains, coexistence between locals and Kivotos students is impossible. It claims that for the harmony of the Kivotos race and locals, the complete eradication of human local culture, strong state atheism, and the unity of Kivotos students are necessary.\n\nUnlike other regions such as Germany, France, and Northern Europe where the existing system collapsed during the 'Great Transfer,' Luxembourg preserved its territory while maintaining the political parties, culture, and religious systems of the locals. Therefore, Luxembourg remained a rare country that attempted coexistence with Kivotos students while maintaining the social status of locals.\n\nHowever, the local right-wing party in Luxembourg at the time looked down on Kivotos academies composed of women as 'inferior,' and local Nazi sympathizers and Catholic forces also excluded Kivotos students. Aru's ideal of promoting equal coexistence was trampled and exploited by local political forces. Having abandoned all hope for humanity, Aru came to believe that only the complete dismantling of local culture could protect Kivotos students.\n\nApart from the pan-nationalist ideology of Rikuhachima-ism, the power structure of Problem Solver 68 consists of a personal dictatorship centered on Rikuhachima Aru."
 monarchist_socialism:0 "Monarchist Socialism"
 monarchist_socialism_desc:0 "Socialist states and monarchies are generally not combined, but historically, as a result of various compromises, the coexistence of socialism and monarchy has been discussed or even realized. The first case is when communists, who are relatively weak compared to monarchists, tolerate the monarchy even after communization as a compromise. A representative example is Bogd Khan maintaining power until 1924 after the communization of Mongolia in 1921.\n\nConversely, Monarchist Socialism can also be a compromise offered by monarchists to communists to restore a monarchy under a strong communist system. The Mladorossi, a monarchist movement in the Soviet Union, proposed an alternative where the communist system of the USSR is maintained, but the Tsar becomes the symbol of the Union.\n\nLastly, there are cases where Marxism itself becomes moderate enough to tolerate monarchy during repeated reforms. The Nordic Social Democratic model, created through a compromise between capitalists and socialists after the Saltsjöbaden Agreement, is a representative example."
 monarchist_socialism_democratic:0 "Monarchist Socialism"
 monarchist_socialism_democratic_desc:0 "Socialist states and monarchies are generally not combined, but historically, as a result of various compromises, the coexistence of socialism and monarchy has been discussed or even realized. The first case is when communists, who are relatively weak compared to monarchists, tolerate the monarchy even after communization as a compromise. A representative example is Bogd Khan maintaining power until 1924 after the communization of Mongolia in 1921.\n\nConversely, Monarchist Socialism can also be a compromise offered by monarchists to communists to restore a monarchy under a strong communist system. The Mladorossi, a monarchist movement in the Soviet Union, proposed an alternative where the communist system of the USSR is maintained, but the Tsar becomes the symbol of the Union.\n\nLastly, there are cases where Marxism itself becomes moderate enough to tolerate monarchy during repeated reforms. The Nordic Social Democratic model, created through a compromise between capitalists and socialists after the Saltsjöbaden Agreement, is a representative example."
 plutocracy_ideology:0 "Plutocracy"
 plutocracy_ideology_desc:0 "Plutocracy is a political system ruled by the economic power of a wealthy class or stratum."
 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "Syndicalism demands autonomous management by labor unions and advocates for direct action by workers to achieve this. Primarily composed of frontline workers, they are one of the most active socialist-leaning forces."
 war_communism:0 "War Communism / Left-wing Military Government"
 war_communism_desc:0 "War Communism and Left-wing Military Governments are systems where the state exercises control over politics, industry, and sometimes public life in general under authoritarian mobilization.\n\nWar Communism is an economic-political system adopted by a government or organization professing communism to smoothly conduct a war. A representative case is the Bolshevik government during the Russian Civil War from 1918 to 1921, which specifically implemented violent nationalization, the exclusion of a market economy, food requisitioning, and the rationing of daily necessities.\n\nA Left-wing Military Government refers to a system where a military force with communist tendencies seizes governing power through a coup, or manages occupied territories through a communist military administration. They generally possess a strong military character distinct from civilian socialist governments."
 scandinavian_social_democracy:0 "Social Democracy"
 scandinavian_social_democracy_desc:0 "Scandinavian Social Democracy refers to the ideological shift or process where social democratic parties in Sweden, Norway, and Denmark—unlike other interwar social democratic parties—gradually but boldly move leftward by narrowing the gap between public demand and revisionist Marxism after a transformative and radical subversion of the system."
 Cohabitism:0 "Cohabitism"
 Cohabitism_desc:0 "Cohabitism is a democratic ideology that integrates Kivotos students and Europeans into a single political community, defining species identity as the primary axis and national identity as the secondary axis. Its core principle is to guarantee equal legal and social opportunities to all members. The political system aims for centralized democracy but adopts a structure where mutual checks and balances are possible by placing the powers of the president and parliament at a similar level. While it shares similarities with Civic Nationalism's emphasis on public equality, it is distinguished by taking the substantive division of 'coexistence of two species' as its starting point rather than 'common citizenship.'\n\nThe state ultimately aims to mitigate ethnic distinctions and emphasize a common identity at the species level, arguing that social stability and national identity are maintained only when different species coexist. To this end, the central government uses strong governing tools such as integrated education, official language policies, and the integration of public institutions. On the other hand, side effects such as the dilution of culture and language, the loss of minority traditions, and unbalanced regional development may occur. To compensate for this, institutional devices such as federalist power distribution and a multi-capital system are operated in parallel to ensure regional representation and balanced development.\n\nPractical mechanisms include forming a common political space through universal welfare, public education, and language policies, species exchange and mutual recognition programs, limited regional autonomy, and the concentration of security and diplomatic authority at the center. In short, Cohabitism is 'a democratic ideology designed to ensure that different groups continuously coexist within one state through equal opportunity and strong central integration while recognizing the species as the basic unit.'"
 Civil_nationalism:0 "Civic Nationalism"
 Civil_nationalism_desc:0 "Civic Nationalism (Civil Nationalism) is an ideology that places the unity of the people not in bloodline, language, or cultural homogeneity, but in citizenship as a political community, the constitution, equality before the law, and shared political procedures. The sense of belonging for members of the state is seen as coming not from blood but from the 'will to live together' and loyalty to public institutions, with the state understood as an autonomous union of sovereign citizens.\n\nThe ideological roots of this concept lie in the Enlightenment and the political discourse of the American and French Revolutions. Specifically, Ernest Renan presented the will of the people as the core of unity with the expression, 'A nation is a daily plebiscite (or a daily consent).' Thus, Civic Nationalism seeks to form and maintain national identity through legal and political procedures and civic virtues (civic education, public debate, universal suffrage, etc.).\n\nIn the context of the 19th century, Civic Nationalism was contrasted with Romantic/Organic Nationalism (e.g., blood and culture-centered discourse of the Herder school). The latter viewed the nation as a natural and historical continuum, but the civic perspective emphasizes political choice and the acceptance of norms through nationality and citizenship. Practically, it had a strong character of trying to bind diverse groups into one political community through the constitution, the rule of law, and inclusive policies (expansion of citizenship, public education, etc.)."
 culturlic_Integralism:0 "Democratic Socialism"
 culturlic_Integralism_desc:0 "Democratic Socialism is a political and ideological trend formed by the combination of late 19th-century Utopian Socialism, the Chartist tradition, and gradualist/parliamentary socialist movements. This ideology seeks to realize social and economic equality through democratic procedures and public institutions, aiming for the social management of the means of production, the expansion of public character, and extensive welfare policies. It does not strictly follow the immediate, revolutionary subversion line of traditional Marxism, but takes a gradual path of mitigating and transforming the contradictions of capitalism through elections, parliament, labor unions, and legislative reform.\n\nAn ideological core includes the influence of Revisionism (Eduard Bernstein), which believed that socialist goals could be approached through reform via labor unions and political parties. The British Fabians emphasized the method of slowly remodeling society through institutions and policies. On the other hand, the revolutionary left, such as Rosa Luxemburg, strongly criticized gradualism, leading to fierce debates within and between factions.\n\nIn terms of political and economic practice, while assuming political democracy such as universal suffrage and a multi-party system, it emphasizes the expansion of the public sector, the strengthening of workers' rights, and the social control and democratic management of the economy (e.g., cooperative operation). It is characterized by a tendency to organize the economy democratically through regulation, social ownership, and solidarity management models rather than making full nationalization of industry and finance the only essential condition."
 culturlic_Integralism_com:0 "Democratic Socialism"
 culturlic_Integralism_com_desc:0 "Democratic Socialism is a political and ideological trend formed by the combination of late 19th-century Utopian Socialism, the Chartist tradition, and gradualist/parliamentary socialist movements. This ideology seeks to realize social and economic equality through democratic procedures and public institutions, aiming for the social management of the means of production, the expansion of public character, and extensive welfare policies. It does not strictly follow the immediate, revolutionary subversion line of traditional Marxism, but takes a gradual path of mitigating and transforming the contradictions of capitalism through elections, parliament, labor unions, and legislative reform.\n\nAn ideological core includes the influence of Revisionism (Eduard Bernstein), which believed that socialist goals could be approached through reform via labor unions and political parties. The British Fabians emphasized the method of slowly remodeling society through institutions and policies. On the other hand, the revolutionary left, such as Rosa Luxemburg, strongly criticized gradualism, leading to fierce debates within and between factions.\n\nIn terms of political and economic practice, while assuming political democracy such as universal suffrage and a multi-party system, it emphasizes the expansion of the public sector, the strengthening of workers' rights, and the social control and democratic management of the economy (e.g., cooperative operation). It is characterized by a tendency to organize the economy democratically through regulation, social ownership, and solidarity management models rather than making full nationalization of industry and finance the only essential condition."
 ABYDOS_democracy:0 "Abydos Democratic Centralism"
 ABYDOS_democracy_desc:0 "Abydos Democratic Centralism is a form of democratic centralism traditionally passed down in Abydos, a system that seeks to combine free internal discussion (democracy) with unified execution according to the results of the discussion (centralism). It was established by emphasizing the unity of discussion and action within the General Student Council and the high school, and was later adopted as a core organizational principle for Schemata and various Abydos regimes.\n\nSpecifically, active discussion and criticism are permitted within the Student Council, but once a decision is made, all students must follow it and act with a single policy externally. Subordinate organizations have an obligation to implement the decisions of superior organizations, and minority opinions may be expressed within the school but must not obstruct the decided course of action.\n\nDue to the particularities of Abydos, broad local autonomy is permitted outside the center, but central power is primarily concentrated in one person. The modified Abydos Democratic Centralism defines the school as the state and the Student Council as the parliament, where locals other than students can also have a meaningful voice. However, it harbors a high possibility of developing into a de facto one-person dictatorship if the suppression of minorities and the exclusion of factions persist."
 Self_Reliance:0 "State Enlightenment"
 Self_Reliance_desc:0 "State Enlightenment is an ideology based on Kivotos nationalism, asserting that superior Kivotos students have an obligation to 'Kivotos-ize' Europe. This ideology views Kivotos students as inherently superior to locals and believes they must spread their culture and achieve a unified society. At the core of State Enlightenment stands a leader who is a 'Vanguard,' 'Prophet,' and 'Enlightener.' This leader is regarded as the being who will lead Kivotos to glory in a crisis and demands a fanatical following akin to religious faith.\n\nThis ideology strongly advocates for the unification of Kivotos and claims that the 'Great Transfer' was a divine revelation—a message from God that they must rule over the locals and advance as the masters of a new world. In this sense, State Enlightenment simultaneously possesses socialist elements emphasizing the complete equality of Kivotos students and imperialist aspects treating locals as subjects of rule. Furthermore, it adopts a one-person dictatorship system where all authority is concentrated in the leader, aiming to strongly control the entire nation through centralized governance.\n\nConsequently, State Enlightenment appears as a mixture of various ideas. The duty of unification and expansion based on the superiority of the Kivotos race, and the aspect of demanding absolute trust and loyalty toward the leader in that process, possess the character of a simple slogan that can easily reach the masses. Thus, State Enlightenment, with its blend of diverse ideological elements, goes beyond a single ideological system to deliver broad political and social messages, tending to spread as powerfully as a religion once it begins to diffuse."
 Government_Federalism:0 "Governmental Federalism"
 Government_Federalism_desc:0 "Governmental Federalism is, simply put, a form where two or more governments with exactly the same government system are integrated into one within the same nation.\nWhile it might seem like a mere system, this ideology is not a rigid doctrine applied in all situations, but rather a flexible one that changes according to the situation to find the most optimal form.\n\nEach government moves and cooperates like a faction within a single government.\nThis system may show aspects similar to party politics or a federal state system, but in this system, political parties under each government can exist, and it functions strictly as a single unitary state rather than in the form of autonomous districts, national federations, or alliances.\nHowever, in the case of the head of state representing the government or nation, they are selected from each government to form a single general assembly.\nThe administrative differences of the regions where each government is located and the existing ethnic and cultural differences are not distinguished by law, and the maximum command form for defining differences is prescribed by rules.\nFurthermore, autonomous districts and locations are not distinguished by administrative districts.\n\nAs a political ideology, it has many empty parts and is overall experimental, but one certain fact is that it is only effective in countries with very small territories."
 satsukiism:0 "Satsuki Governance"
 satsukiism_desc:0 "Satsuki Governance refers to a high-level psychological engineering governance system led personally by Satsuki Kogyoku, the head of the Pandemonium Society's Intelligence Department, rather than a traditional ideology or mass movement. The 'NK Ultra Project,' which forms the basis of this system, goes beyond simple propaganda, utilizing all the nation's information networks and media to intervene in the public's thinking process and induce specific conclusions as if they were 'natural' consensus.\n\nBecause of this, society under Satsuki's rule takes on a strange duality. In the sense that all major national affairs are decided by Satsuki's personal will, it is close to a perfect absolute monarchy, yet the citizens do not feel oppression or coercion and believe they are participating in social harmony through their own judgment. Discussion and conflict are regarded as unnecessary inefficiencies and vanish, and society moves stably and harmoniously like a single giant organism.\n\nTherefore, in 'Satsuki Governance,' there are no enthusiastic supporters or ideological comrades. There are only 'citizens' performing their given roles within a quiet and stable order. Consequently, this realizes an unprecedentedly stable but perfectly controlled dystopian society where individual free will is completely subordinate to a designed order."
 satsukiism_B_1_1:0 "Kyowa Democracy"
 satsukiism_B_1_1_desc:0 "Kyowa (Harmonious) Democracy is a unique political ideology where Satsuki Kogyoku's unilateral mental governance system was reborn through self-negation. The turning point of this system was the moment Chairman Satsuki herself acknowledged the inhumanity of the NK Ultra Project, officially apologized to former hostile forces, and declared the termination of the project.\n\nSurprisingly, even the former opposition forces overlooked that dark legacy. This was because a common perception was formed that, without the forced integration, catastrophic civil war and ethnic conflict could not have been avoided. Under this strange social consensus, the propaganda and psychological induction technologies left by NK Ultra were given a new purpose instead of being discarded.\n\nNow, instead of carrying out the will of a single leader, these technologies are used limitedly as tools of 'tuning' to bridge ethnic conflicts and induce social consensus. The state no longer controls individual thought, but gently guides the entire society from behind the scenes toward the common goal of 'Kyowa.'\n\nConsequently, while Kyowa Democracy ostensibly respects pluralism and democratic procedures, it is a unique system where a strong will to fundamentally prevent radical social conflict operates beneath the surface. This is a new form of democracy that seeks peace within 'managed harmony' rather than complete freedom."
 satsukiism_B_1_2:0 "Democracy with Satsuki Characteristics"
 satsukiism_B_1_2_desc:0 "Satsuki Governance refers to a high-level psychological engineering governance system led personally by Satsuki Kogyoku, the head of the Pandemonium Society's Intelligence Department, rather than a traditional ideology or mass movement.\n\nThe current form of Democracy with Satsuki Characteristics is a dictatorship wearing the mask of a high-level democracy, completed by even more subtly utilizing the psychology of the masses. On the surface, it appears to respect healthy political competition and democratic procedures through a two-party system representing Gehenna and Germany respectively.\n\nHowever, behind the scenes, there exists a shadow politics that perfectly controls even the leadership and core agenda of the opposition party through the reinforced 'NK Ultra Project.' Violent debates in parliament and confrontations between parties are merely a massive political play directed under Chairman Satsuki's script.\n\nThe citizens believe they are participating in politics of their own free will, and they come to revere Satsuki as a 'Great Leader' who 'resolves' these artificially directed conflicts and unifies the nation. This process instills a strong sense of belonging to the state and political efficacy in the citizens, but all choices ultimately move only within Satsuki's intentions.\n\nAs a result, this is the most stable and perfected form of dystopia, using even conflict as a tool for perfect control. Citizens believe they support the leader and love their country of their own volition, but their options were limited to only one from the beginning."
 satsukiism_B_2_1:0 "Veil Oligarchy"
 satsukiism_B_2_1_desc:0 "Veil Oligarchy is a form where Satsuki Kogyoku's governing philosophy has evolved beyond individual rule into the system itself. Under this system, the state is operated by a secretive single organization that knows the truth of NK Ultra, and Satsuki herself steps back from being an absolute ruler to act as the symbolic pivot of a collective leadership system.\n\nOn the surface, various factions exist within the organization, and policies are decided through democratic discussion and consensus. However, outside this entire process, there exists a 'Veil.' The 'NK Ultra' technology that once controlled individual minds has now been reborn under the party's name as a massive tuning device to induce the coexistence of the entire society.\n\nThis technology does not force specific opinions. Instead, it gently dilutes radical ideas that cause conflict and merely guides all discussions to culminate in the grand cause of social integration. Citizens believe they are reaching the most ideal conclusions within complete freedom of thought and feel satisfaction in the perfect social consensus that arises in the process.\n\nConsequently, Veil Oligarchy realizes the most ideal form of an integrated state. A society where everyone voluntarily harmonizes under a hidden 'Good Will' rather than coercion or dictatorship. This is the most peaceful, yet simultaneously the most elaborately designed utopia."
 satsukiism_B_2_2:0 "The Ideology"
 satsukiism_B_2_2_desc:0 "This is the final stage and the most perfected form of Satsuki Governance. The state is no longer a collection of various individuals, but merely an extended ego of the 'One Leader,' Satsuki Kogyoku. Her will is law and truth, and her thoughts are the sole ideology of the entire nation.\n\nAll functions of society are perfectly controlled by four departments with paradoxical names: the Ministry of Truth, the Ministry of Peace, the Ministry of Love, and the Ministry of Plenty. The Ministry of Truth tailors the past, the Ministry of Peace manages internal and external enemies for eternal stability, the Ministry of Love instills absolute loyalty, and the Ministry of Plenty distributes all resources most 'efficiently.'\n\nUnder this system, the 'NK Ultra Project' is no longer a simple brainwashing technique. It is a reality-manipulating tool that reconstructs the consciousness of the citizens and even eradicates the concepts of words like 'freedom' or 'rebellion.' The individual has vanished, leaving only components that exist for the party and the leader. Here, there is no conflict, no doubt, and no pain. Only perfect order and obedience, and the hollow peace derived therefrom, will continue forever."
 satsukiism_C_1:0 "Hypnotic Student Council Governance"
 satsukiism_C_1_desc:0 "Hypnotic Student Council Governance is a unique sociopolitical system that makes 'Gehenna Psychological Academy' the most ideal academy. To most students, the academy is like a world in a light novel. Without serious conflict or fighting, a happy-ending daily life continues where everyone moves toward their dreams and enjoys their school days.\n\nThe secret of this ideal harmony lies in the basic psychological induction techniques that all students learn. Through this, they care for and understand each other, and destructive conflicts are naturally resolved.\n\nHowever, the true core of this system lies in 'Growth and Awakening.' Through advanced courses, outstanding students come to see through the essence of the psychological structure maintaining this society, and finally become able to 'graduate' themselves from mental constraints. Only a few elites who perfectly understand themselves and reach the truth of the system earn the qualification to enter the 'Student Council,' the nation's supreme decision-making body.\n\nConsequently, this is an ideal academy where the majority spends happy school days, and a world where a few awakened individuals strive to protect that happiness. The Student Council does not oppress the masses. They simply, gently 'protect' those who have not yet awakened within peace."
 pandemonium:0 "Gehenna Pandemonium Society"
 pandemonium_desc:0 "The politics of the Pandemonium Society are very peculiar. The political system, stemming from the students' low political participation, makes it difficult to even distinguish whether they are a real Student Council or just a group calling themselves one. The only thing proving their authority is the certificate issued by the Kivotos General Student Council."
 neopandemonium:0 "Reformed Pandemonium Society"
 neopandemonium_desc:0 "This is Gehenna's Student Council functioning normally after reforming the previous Pandemonium political system that stemmed from the students' low political participation. They are a political ideology operated by characteristic physical features such as horns—the 'Gehenna Student'—and various nationalist sentiments derived therefrom."
 makotoism_A1:0 "National Corporatism"
 makotoism_A1_desc:0 "National Corporatism is a totalitarian ideology based on extreme statism. This ideology aims to end all internal conflicts by organizing all members of society—workers, capitalists, peasants, etc.—into their respective 'corporations' controlled by the state. By removing 'anti-state' elements such as class struggle or political confrontation, it is a system that fully mobilizes all national capabilities to achieve the 'Great Achievement' presented by the absolute leader called the 'Fuhrer.'\n\nNational Corporatism shows similarities with existing National Socialism in many ways, but it has a decisive difference. It places the criterion of the nation not on 'bloodline' but on 'absolute loyalty to the Fuhrer and the state.' Through this, the current regime secures the justification for integrating the heterogeneous element of Gehenna origin into the system while eroding and absorbing the support base of the former Nazi Party. In other words, it professes to be a 'new and capable' alternative replacing the old and failed Nazism.\n\nThis system is maintained through powerful propaganda activities that strengthen the personality cult of the leader and the ruthless suppression of all opposition forces. Ultimately, what National Corporatism aims for is 'aggressive expansionism' beyond internal integration. The final goal of this ideology is to conquer the world by mobilizing all resources of a unified nation."
 makotoism_B:0 "Trans-World Hegemonic Nationalism"
 makotoism_B_desc:0 "Trans-World Hegemonic Nationalism is a radical ultranationalist ideology based on a sacred pact between the Germanic people and Gehenners, who are called the two 'Chosen Peoples.'\n\nFollowers of this ideology interpret the 'Great Transfer' not as a mere coincidence, but as a divine revelation for the 'Nordic people,' who continue the myths of the North, and the 'Gehenna people,' originating from the Valley of Hinnom, to meet and rule the world. They believe these two 'Peoples of the Gods' are inherently destined to rule all other inferior races.\n\nPolitically, this appears as a coalition governing system of the two ruling peoples, and the leader secures the legitimacy of rule beyond bloodline by simultaneously inheriting the Nordic myths of Germany and the Hinnom myths of Gehenna.\n\nUltimately, under the banner of a new ruling civilization called 'Nord-Hinnom,' this ideology takes as its final goal the unification of a divided Kivotos first, and then infinite expansion to take all of Europe as their living space."
 makotoism_B1:0 "Trans-World Pan-Corporatism"
 makotoism_B1_desc:0 "Trans-World Pan-Corporatism is a practical authoritarian ideology that re-established the existing myth of the 'Alliance of Gods' as the basis for state control after the unpredictable one-person rule of Makoto Hanuma was ousted.\n\nThis ideology utilizes the 'Sacred Pact' between the Germanic people and Gehenners no longer as a tool for the leader's erratic achievements, but as a source of permanent legitimacy sustaining the state.\n\nUnder the banner of 'Pan-Corporatism,' the two peoples are organized into corporations according to their 'roles' and 'contributions' to the state rather than bloodline or ideology. Political parties, businesses, and labor organizations are all organized to serve the single goal of 'national stability' under the unified leadership of the state.\n\nOstensibly, democratic reforms through parliament are underway, but this is merely a thoroughly controlled 'managed democracy.' True power is absolutely concentrated in a new Executive Committee, and they suppress all opposition forces under the pretext of 'preventing the recurrence of chaos.'\n\nUltimately, this ideology avoids Makoto's insane expansionism and aims for a stable state that strengthens internal solidarity based on strong central power. The myth of the 'Peoples of the Gods' now merely functions as a powerful social adhesive to create citizens who conform to this massive state machine."
 makotoism_B2:0 "Trans-World National Liberalism"
 makotoism_B2_desc:0 "Trans-World National Liberalism, a stable ideology that appeared after the madness of early Trans-World Hegemonic Nationalism dissipated, is a radical ultra-liberal ideology based on the sacred pact between the Germanic people and Gehenners, called the two 'Chosen Peoples.'\n\nFollowers of this ideology interpret the 'Great Transfer' not as a mere coincidence, but as a divine revelation for the 'Nordic people' and 'Gehenna people' to meet and rule the world. These two 'Peoples of the Gods' are predicted to be destined to establish the most peaceful nation.\n\nPolitically, this appears as a coalition governing system of the two ruling peoples, where the leader secures legitimacy beyond bloodline by inheriting the myths of both. Ultimately, under the banner of the 'Nord-Hinnom' civilization, this ideology overcomes old expansionism and works to care for the homeland damaged by radical belligerence."
 satsukiism_makoto_B: "Gehenna Restorationism"
 satsukiism_makoto_B_desc: "Gehenna Restorationism is an ideology advocating a return to the fundamental spirit of Gehenna, proclaimed by the 'Liberator' Makoto Hanuma after forcibly ending Satsuki Kogyoku's deceptive mental governance.\n\nThe core of this ideology lies in defining the artificial harmony and silence created by Satsuki as a 'false peace' and 'mental death.' Restorationists argue that the Gourmet Research Society's bombings, the Hot Springs Development Department's rampages, and the constant confrontation with the Prefect Team are 'living proof' of Gehenna's free soul and unquenchable vitality.\n\nThus, Gehenna Restorationism does not present complex systems or platforms. Instead, it takes as its priority the abolition of all oppressive controls and the return of complete autonomy to every organization in the academy and every individual student. Order exists in its minimal form, and they believe the state will find its own balance and move forward amidst various conflicts and chaos.\n\nConsequently, this means a perfect return to the 'Original Gehenna,' which is unpredictable, noisy, and constantly prone to problems. To them, a controlled paradise is the most terrible hell, and free chaos is the only heaven Gehenna deserves to enjoy."
 police_nationalism:0 "Kivotos Orderism"
 police_nationalism_desc:0 "A statement representing Valkyrie's position, advocated by Kanna Ogata since the Great Transfer to the present, which is an ideology that strongly defends and supports the order of the Kivotos General Student Council."
 police_neutralism:0 "Kivotos Reformism"
 police_neutralism_desc:0 "The reformist faction, gathered around the opposition within Valkyrie, is an ideology that criticizes the weakness of the existing Valkyrie system and claims that politics for stronger Kivotos students is necessary."
 police_communism:0 "New Orderism"
 police_communism_desc:0 "New Orderism is an ideology originating from a series of conflict incidents with locals that occurred after the Great Transfer. Sympathy toward the locals is the core, and the main content of the ideology is that Kivotos students should first reach out to the people of Earth."
 police_democratic:0 "New Orderism"
 police_democratic_desc:0 "New Orderism is an ideology originating from a series of conflict incidents with locals that occurred after the Great Transfer. Sympathy toward the locals is the core, and the main content of the ideology is that Kivotos students should first reach out to the people of Earth."
 
 cou_kaya_dictatorship:0 "Overman Dictatorship"
 cou_kaya_dictatorship_desc:0 "Overman Dictatorship refers to the one-person dictatorship of Kaya Shiranui. Kaya Shiranui identifies herself as an 'Overman' (Ubermensch) and functions as the nation's primary commander-in-chief and dictator. Although Kaya is a person far from being an 'Overman'."
 cou_ideology:0 "General Secretariat"
 cou_ideology_desc:0 "The General Secretariat of the General Student Council is the department that oversees and coordinates the General Student Council, serving as a sort of Presidential Office. Under the leadership of the Chief Executive, it cooperates and sometimes conflicts with the Administrative Committee to oversee and manage all of Kivotos, both formally and practically."
 cou_ideology_the_elevens_fascism:0 "Administrative Committee"
 cou_ideology_the_elevens_fascism_desc:0 "The Administrative Committee of the General Student Council officially consists of 11 departments. Under the harmonious rule of the 11 heads, the Administrative Committee oversees and manages all of Kivotos, both formally and practically."
 cou_ideology_the_elevens_neutrality:0 "Administrative Committee"
 cou_ideology_the_elevens_neutrality_desc:0 "The Administrative Committee of the General Student Council officially consists of 11 departments. Under the harmonious rule of the 11 heads, the Administrative Committee oversees and manages all of Kivotos, both formally and practically."
 cou_ideology_the_elevens_communism:0 "Administrative Committee"
 cou_ideology_the_elevens_communism_desc:0 "The Administrative Committee of the General Student Council officially consists of 11 departments. Under the harmonious rule of the 11 heads, the Administrative Committee oversees and manages all of Kivotos, both formally and practically."

 srt_nationalism:0 "SRT Control Faction"
 srt_nationalism_desc:0 "The SRT Control Faction is an ideology that advocates for the control of SRT. Under SRT control, all national policies are determined by the autonomous judgment and logic of SRT."
 srt_democratic:0 "SRT Representative Faction"
 srt_democratic_desc:0 "The SRT Representative Faction is an ideology that advocates for the external activities of SRT. It claims that SRT's external activities should be determined by SRT's autonomous judgment and logic."
 srt_communism:0 "SRT Reform Faction"
 srt_communism_desc:0 "The SRT Reform Faction is an ideology that advocates for the reform of SRT. It claims that the reform of SRT should be determined by SRT's autonomous judgment and logic."
 srt_neutralism:0 "SRT Principle Faction"
 srt_neutralism_desc:0 "The SRT Principle Faction is an ideology that advocates for the principles of SRT. It claims that the principles of SRT should be determined by SRT's autonomous judgment and logic."
 corporate_state_workplace_democracy:0 "Corporate State - Workplace Democracy"
 corporate_state_workplace_democracy_desc:0 "Workplace Democracy, a unique ideology formed in a corporate state, democratically distributes the rights to operate the company to its workers. Their system can sometimes be more radical than that of communists, which is likely a unique characteristic appearing in a corporate state that is a massive collection of financial capital."
 corporate_state_corporatism:0 "Corporate State - Capitalism"
 corporate_state_corporatism_desc:0 "This state is a massive corporation that pursues profit just like a regular company. Ownership of the corporation is distributed among several major shareholders, and it generally has a political system similar to an oligarchy."
 corporate_state_private_enterprise:0 "Corporate State - Private Enterprise"
 corporate_state_private_enterprise_desc:0 "This state is a massive corporation operated by a single leader represented by the Chairman. Most rights within the company are concentrated in a single person, and it generally has a political system similar to a dictatorship."
 corporate_state_nephtys:0 "Corporate State"
 corporate_state_nephtys_desc:0 "This state is a massive corporation that pursues profit just like a regular company. Ownership of the corporation is distributed among the Board of Directors, including several chairmen, and it generally has a political system similar to an oligarchy."

 left_council_communism:0 "Council Communism"
 left_council_communism_desc:0 "Council Communism, located on the left of the socialist movement, advocates for organizing workers' councils and operating society as a whole through council democracy. They tend to criticize the vanguard party system of the Soviet Union as state capitalism rather than socialism, and also criticize labor unions as being capitalist interest groups."

 criminal_enterprise:0 "Capital Supremacism"
 criminal_enterprise_desc:0 "This alliance of criminals worships capital and will stop at nothing for money. From drug exports, assassinations of key figures, and robbery to war, they will do everything for profit."
 crime_vanguard:0 "Red Terrorists"
 crime_vanguard_desc:0 "This criminal alliance, which began as part of a left-wing revolutionary organization, will commit terrible crimes without hesitation to achieve their ideological goals."
 criminal_state:0 "Outlaw State"
 criminal_state_desc:0 "Starting from a criminal organization, this state moves toward grand goals under the name of a strong authoritarian leader. To them, the gaze of the international community is not important."
 crime_syndicate:0 "Crime Syndicate"
 crime_syndicate_desc:0 "An alliance of criminals, the crime syndicate is a system that operates on the coincidence of interests and is now like a state since it has become massive. They will try to keep their own order and do not like change very much."

 Social_Liberalism:0 "Social Liberalism" 
 Social_Liberalism_desc:0 "Social Liberalism is a branch of liberalism that combines an emphasis on individual freedom and rights with a concern for social justice. It argues that for all individuals to enjoy equal freedom, the state must intervene to resolve unequal social structures and economic gaps. While firmly defending basic rights and civil liberties, it calls for the expansion of a social safety net to ensure fair opportunities. This includes universal medical services, the strengthening of the public education system, and welfare policies to protect citizens from unemployment and poverty."
 National_conservatism:0 "National Conservatism"
 National_conservatism_desc:0 "National Conservatism is a branch of conservatism that combines conservatism with nationalism—an ideology that emphasizes national groups based on specific homogeneity and historical ties, or ethnic communities based on bloodline. National Conservatism advocates for the promotion of the interests of the community to which one belongs, protects the community from invasive movements of foreign powers, and further calls for social movements to promote communal autonomy."
 
 pure_socialism:0 "Pure Socialism"
 pure_socialism_desc:0 "Pure Socialism is a type of 'Right-wing Socialism' established by Ikki Kita in the early 20th century. The head of state in a Pure Socialist nation becomes a 'Living God' (Arahitogami) acting as a 'symbol' that gathers all the will of the people. As the protector of the people, they play a role in implementing a state-led controlled economy and adjusting it so that wealth is not concentrated in a wealthy capitalist class. The combination of a controlled economic system by a benevolent Living God and religious fanaticism had a strong ideological influence on the Imperial Way Faction, an influential faction of the Japanese military."
 
 transitioning_democracy:0 "Transitioning Democracy"
 transitioning_democracy_desc:0 "Strictly speaking, a transitioning democratic state is somewhere between a democratic and a non-democratic state. Just because a country overthrows a dictatorial system does not mean the citizens can immediately become completely free. This is because bureaucrats who were loyal to the previous government still support authoritarian policies in their positions, and the public power that was loyal to the dictatorial government also takes control of the security organizations without being replaced. Transitioning democracy is merely a phenomenon seen in the process of converting to a democratic state after a dictatorial state collapses, and it does not mean the ideology pursued by the government itself."

 harmonism: "National Harmonism"
 harmonism_desc: "National Harmonism is an ideology created for Hina Sorasaki to integrate the chaotic Prefect Team and effectively utilize her authority. On the foundation of coexistence between the local and the extra-dimensional, various modifiers are attached: the power of state institutions, the historical legitimacy of the Prefect Team, the distribution of power between Gehenna students and local citizens, and mutual compensation and class cooperation regarding the Great Transfer. This serves as the driving force for Hina Sorasaki to implement strong dictatorial politics, remaining as one of the ideologies that flourished in the 20th century and as a result of the Prefect Team navigating the chaotic interwar period."

 irohasm_A: "New Germany Movement"
 irohasm_A_desc: "The New Germany Movement is a pragmatic national remodeling ideology under the rule of Iroha Natsume that seeks to dismantle and reconstruct traditional German nationalism. This movement rejects both the failed democracy of Weimar and the destructive madness of Nazism, aiming to boldly transform and edit the identity of 'Germany' itself to fit the current federal state.\n\nThe core of this ideology is not ideological purity, but only national stability and control. Iroha Natsume considers herself a 'Rider' who must tame the wild horse of the German people and lead them in a new direction. To this end, symbols, laws, and cultures of the past are maintained if they are useful to the state, but are ruthlessly discarded or replaced by new methods if they become an obstacle.\n\nThe New Germany Movement does not wear the mask of a coercive dictatorship. Instead, it guides society in the desired direction through administrative procedures and gradual reform, making citizens believe they are becoming part of a new Germany of their own accord. Consequently, this is the most flexible and pragmatic form of authoritarianism, disconnected from any past ideology and creating a 'New Germany' defined only by the current leader."

 irohasm_B: "Gehenna-Germanism"
 irohasm_B_desc: "Gehenna-Germanism did not start from a clear theoretical foundation but is an integrated ideology formed naturally within the special political and social reality of the German-Gehenna Federation formed after the Great Transfer. Initially, it stayed at the level of emphasizing peaceful coexistence between the two peoples, but it was later systemized as it developed into the governing logic of Federal President Iroha Natsume, who received joint support from both parties.\n\nThis ideology pays attention to the experience of overcoming the common trauma of the 'Great Transfer' and the unexpected cultural similarities, such as emphasizing order and discipline while also enjoying festivals. Through this, it takes loyalty and contribution to the new community called the 'Federation' as the primary virtue of the citizens rather than bloodline or world of origin.\n\nPolitically, it maintains a two-party system of Gehenners and Germans, but places a 'Jointly Elected Leader' above them as a symbol of transcendental integration. This leader arbitrates extreme confrontations between factions, performs a symbolic role for national integration, and pursues realistic stability and prosperity as the top priority rather than ideological purity. This is a unique pragmatic coexistence model distinguished from assimilationism, where one side absorbs the other, or multiculturalism, which assumes the separation of each."

 chiakism: "Motomiya-ism"
 chiakism_desc: "Motomiya-ism is closer to a massive and noisy 'Political Entertainment Show' led by Chiaki Motomiya rather than a fixed political philosophy.\n\nIn this system, the state runs like a single giant weekly magazine editorial office. For Chiaki, a consistent ideology or policy is not important. What matters is, \"What kind of blockbuster article should we break this week to surprise the public?\" One day she might attack conglomerates like a leftist, shouting \"Scoop on Rooting Out Corruption!\", and the next day she might join hands with large corporations like a right-winger, featuring \"A Miracle Growth Myth!\" in large print.\n\nThe public is bewildered by her unpredictable moves but cannot take their eyes off the pouring provocative and flashy political shows. This is merely the 'Editorial Meeting' stage where she tests various things and expands the field before finding the real scoop to prove her leadership."

 chiakism_left: "Chiaki-style Welfare Sensationalism"
 chiakism_left_desc: "Chiaki-style Welfare Sensationalism is a left-wing populist system led by Chiaki Motomiya, where every day is like a festival. For Chiaki, gloomy and boring poverty is 'old news that should be discontinued,' and everyone smiling is the 'great scoop' that will decorate the front-page top.\n\nWith her slogan, \"Ready~! Go!\", the state flings open the vaults. Welfare is not a boring administrative procedure but pours down on citizens like a surprise gift or a prize event. She regards the public's joy as the 'best shutter chance' and does not hesitate to open the storehouses of the establishment for this.\n\nAs a result, this system moves on expectations for enthusiastic propaganda rather than complex theories. Although it is somewhat unplanned and carries financial risks, the public goes wild for Chiaki's 'extra-edition-like politics' delivered every morning and sends overwhelming support."

 chiakism_right: "Chiaki-style Growth-First-ism"
 chiakism_right_desc: "Chiaki-style Growth-First-ism is a high-speed growth system born from the combination of Chiaki Motomiya's characteristic 'action' and right-wing technocratic efficiency. In this system, the state becomes a massive editorial office, and large corporations become capable news sources that create scoops.\n\nChiaki boldly edits out complex regulations or frustrating procedures as \"boring stories that don't make for an article.\" Instead, she attracts large capital to build skyscrapers, run factories, and features the daily-breaking economic growth rate as \"Aha-ha! A blockbuster event!\" Incompetence and stagnation have no place here. Only 'achievement' and 'speed' are praised.\n\nThis system is not cold elitism. Chiaki shouts to the public, \"You shouldn't underestimate my action!\" and displays the fruits of flashy growth as a visual spectacle. Even if the speed is so fast it causes dizziness, under Chiaki's flashy flashbulbs, the nation races toward prosperity like an unstoppable runaway train."

 chiakism_A_1: "Chiaki-style Solidarist Sensationalism"
 chiakism_A_1_desc: "Chiaki-style Solidarist Sensationalism is the largest and noisiest integrated system in history, where 'Welfare Sensationalism' has expanded beyond national boundaries. Chiaki has boldly deleted old classifications such as Germanic or Gehenner from the editorial desk, calling them \"clichéd settings that decrease the readers' interest.\"\n\n\"Now, look here! Click!\" Inside her camera lens, she argues that all beings treading this land—Gehenna students, former Germanic people, Weimar citizens, and even the descendants of the Franks scattered in history—must merge into one massive community called the 'New German People (Neues Volk).' She flings open the national treasury for the 'epic story of emotion' this diverse casting will create, pushing out discriminators who interfere with harmony as 'extras who can't read the room.'\n\nThis system operates under the simple and powerful headline: \"From today, we are all friends!\" regardless of bloodline or history. Although the process may be somewhat impromptu and noisy, the public willingly projects themselves into and goes wild for this warm and heart-pounding 'Drama of Harmony' produced by Chiaki."

 chiakism_A_2: "Chiaki-style Utilitarian Development-Prioritizing-ism"
 chiakism_A_2_desc: "Chiaki-style Utilitarian Development-Prioritizing-ism is the ultimate rational conclusion reached by 'Growth-First-ism.' For Chiaki, ethnic conflict is merely \"the worst inefficiency that doesn't make for an article,\" gnawing at the productivity of the massive enterprise known as the state. She declared that she would create unprecedented synergy by binding Gehenna's military power, Germany's industrial power, and the potential of numerous minority ethnic groups into one.\n\n\"It's a scoop! I've finally landed a blockbuster item called 'Grand Integration'!\" Chiaki boldly discarded old-fashioned bloodline-ism and reorganized Gehenna, Germany, and all heterogeneous groups into a super-massive project team named 'Germany.' Now, the definition of 'German' is determined not by blood, but by how much one contributes to this runaway growth graph.\n\nThis system is not a cold assimilation policy. Chiaki features the explosive chemical reactions created by different ethnicities as \"the best shutter chance to surprise the world.\" Even if traditions are ignored and everything melts in the furnace of efficiency in the process, under the flashy flashbulbs Chiaki fired, the nation races toward a single goal: 'Overwhelming Prosperity.'"

 chiakism_A_3: "Chiaki-style Humanist Socialism"
 chiakism_A_3_desc: "Chiaki-style Humanist Socialism is a warm and stable system born from 'Welfare Sensationalism' compromising with Germanic tradition. Chiaki realized that radical reform fatigues the citizens and decided to create a nation like a 'long-beloved quality newspaper.'\n\n\"Scoop! Gehenna is not your ruler, but your kindest neighbor!\" She downsized Gehenna Academy to 'Small Gehenna,' reorganizing it into an elite negotiation organization, and significantly guaranteed the unique traditions and rights of the German people. Now, Gehenners are positioned not as a privileged class, but as 'beautiful supporting actors' who slowly melt into and dedicate themselves to German society.\n\nInstead of provocative revolution, this system takes the warm soup and stable pensions delivered every day as the 'heartwarming headline.' Although the speed of change is slow, within this 'drama of coexistence that cannot be seen without tears' produced by Chiaki, Germans accept Gehenna's leadership without repulsion and send solid support."

 chiakism_A_4: "Chiaki-style Statism"
 chiakism_A_4_desc: "Chiaki-style Statism is the most efficient elite governing model reached by 'Growth-First-ism' through realistic compromise. Chiaki judged that forcibly rewriting the massive and excellent 'manuscript' called the German nation was inefficient. Instead, she chose the path of leaving Gehenna as a small elite group to complete the bestseller called Germany.\n\n\"Now, to your positions! Germany produces, and Gehenna commands! A perfect division of roles, right?\" In this system, Germany's tradition and industrial base are thoroughly protected and respected, as they are the source of national competitiveness. The Gehenna faction does not mix with Germans but functions as a group of capable managers existing above them, proceeding with integration by accepting only proven individuals very slowly.\n\nThis is not cold rule. Chiaki flashily advertises the overwhelming national power this perfect division system creates as \"A success story the world is watching!\" Germans recognize Gehenna's leadership that protects their identity, and Gehenna enjoys prosperity on the sturdy foundation of Germany—a thoroughly calculated scoop of symbiosis begins."

 chiakism_B1: "Chiaki-style Menshevism"
 chiakism_B1_desc: "Chiaki-style Menshevism is the most rational and gradual socialist model that induces the state to convert the massive capital power of corporations into public welfare. Secretary Chiaki chose a pragmatic line of improving workers' lives through a 'strategic alliance' with capitalists rather than a radical Bolshevik-style revolution.\n\nDiplomatically, Chiaki defines and rejects both the 'lazy parliamentary democracy' of the West and the 'rigid Marxism-Leninism' of the East as failed projects. Instead, she seeks a 'Third Way' alliance with fascist nations that aim to break the old dichotomy of liberalism and communism. Although ideological roots may differ, we will willingly join hands with them under the common ground that the state holds strong leadership and efficiently 'edits' society.\n\n\"Negotiation over struggle, and distribution over destruction, is a bigger scoop!\" This system is the most controversial yet prosperous compromise 'edited' by Chiaki's unique sense of balance between capitalist efficiency, socialist ideals, and the reality of harsh international politics."

 chiakism_B2: "National Conservatism"
 chiakism_B2_desc: "National Conservatism is a powerful right-wing populist ideology that takes national security and economic prosperity as its top priorities. To protect 'Our Motherland' from external threats, it has built a wall of steel through a total war of all social communities.\n\nIn this system, freedom exists under order, and the individual functions as part of a grand national epic. The government provides the public with the best reward—'pride'—through strong defense and overwhelming economic growth. This is the most realistic and solid patriotism that rejects weak idealism and wins survival and prosperity through strength and skill."

 chiakism_B3: "Pandemonium Communism"
 chiakism_B3_desc: "Pandemonium Communism is the most radical and unconventional form of socialism led by Chiaki Motomiya. She rejected the existing drab communism and created a new system that takes the unique free-spiritedness and chaos of the Gehenna Pandemonium Society as the engine of revolution.\n\n\"A boring revolution is guilty! If it's not fun, it's not communism!\" In this society, all people not only share bread equally but also have the right to enjoy festivals and express desires equally. Massive events and unconventional welfare led by the state create a fever like a daily revolution anniversary.\n\nOf course, the biggest characteristic of this society is 'freedom.' Chiaki's thought emphasizes individual creativity and joy over strict class structures or forced mobilization. This creates a revolutionary yet chaotic society, but simultaneously implements a unique socialist system where Gehenna's characteristic free-spiritedness and chaos are at the core of the revolution."

 chiakism_B4: "Revolutionary Ordoliberalism"
 chiakism_B4_desc: "Revolutionary Ordoliberalism is a distorted authoritarian system built upon the ruins of a radical socialist experiment after it crashed against the wall of 'reality.' Secretary Chiaki overthrew the capitalists, but instead of returning that wealth fully to the people, she chose to lock it in the massive safe called the state.\n\nIn this system, 'markets' exist, but they are not free. A thorough 'state-led populism' dominates, where Chiaki and a few elites she chose hold and shake every vein of the economy.\n\nThis is neither the ideal of the left nor the freedom of the right. It is merely a cold dictatorship that fuels the anger of the masses with anti-capitalist incitement and buys loyalty with merciful rations thrown by the state. The revolution ended incompletely, leaving only the heavy shackles called 'Order.'"

 chiakism_B5: "New Era Gehenna Characteristics Democracy"
 chiakism_B5_desc: "New Era Gehenna Characteristics Democracy is an independent governing system proclaimed by Secretary Chiaki Motomiya, centered on strong executive power and the leader's decisions. This ideology defines and rejects exhausting party politics and parliamentary factional fights as 'national waste,' making it an ideal for the leader and the people to communicate directly to break through national crises.\n\nChiaki defines herself not as a dictator, but as the 'Editor-in-Chief of the Nation' who protects true freedom from disorderly license. She emphasizes that \"the most perfect freedom is possible only on top of strong order,\" justifying the leader's exercise of extra-legal authority for efficiency and stability.\n\nIn this system, intermediaries are excluded, and the masses send absolute trust to the leader through national referendums or direct public opinion collection. While formally following democratic procedures, this is practically the most sophisticated and powerful form of authoritarianism carried out in the name of 'freedom,' where all power is concentrated in the individual leader."

 chiakism_C1: "Motomiya Theory"
 chiakism_C1_desc: "Motomiya Theory is Secretary Chiaki Motomiya's unique governing ideology, systemizing the empirical success of early 'Welfare Sensationalism' into a political philosophy. She creatively reinterpreted Antonio Gramsci's hegemony theory, concluding that the seizure of the superstructure—culture and perception—is the true key to national remodeling.\n\nThe core of this theory is the strategic utilization of directed reality. Chiaki believes that public support does not necessarily have to stem from objective truth. Flashy festivals, unconventional welfare, and the leader's image elaborately processed by the media may be 'manufactured illusions,' but if they excite the masses and create overwhelming approval ratings, they soon become real power.\n\nTherefore, populism is a means, not an end. Motomiya Theory is high-level political engineering that perfectly seizes cultural hegemony by providing the masses with the fantasies they crave, and uses that absolute support as 'political fuel' to crush the resistance of the establishment and carry out radical reforms designed by the leader in a top-down manner. This goes beyond simple demagoguery to the completion of 'State Editing Science' that manipulates perception to reconstruct even the material base."

 chiakism_C2: "Motomiya Theory"
 chiakism_C2_desc: "Motomiya Theory is Secretary Chiaki Motomiya's unique governing ideology, systemizing the empirical success of early 'Welfare Sensationalism' into a political philosophy. She creatively reinterpreted Antonio Gramsci's hegemony theory, concluding that the seizure of the superstructure—culture and perception—is the true key to national remodeling.\n\nHowever, Chiaki goes one step further, emphasizing that permanent hegemony is completed not by directed illusions but on 'reforms felt by the skin.' This theory takes a practical 'Third Position' that rejects both the coldness of capitalism and the rigidity of communism. She breaks down inefficient bureaucracy and exhausting class conflict, binding workers and capitalists, Gehenners and Germans into one organic national community through strong central leadership.\n\nThus, in Motomiya Theory, populism is not simple popularity-seeking. It is the engine of reform where the leader directly gathers the demands of the people to implement them as immediate policies, neutralizing the establishment through the results of that overwhelming reality. This is the most realistic and dynamic national remodeling theory opening a new era for Gehenna through substantive prosperity rather than illusions."

 chiakism_C3: "State Capitalism"
 chiakism_C3_desc: "State Capitalism is a unique governing system where political power and massive financial capital are perfectly fused under the slogan, 'The state for the company, the company for the state.' Secretary Chiaki defined the uncertainty of the free market as 'inefficient noise' and chose the path where the state directly participates in the boards of large corporations to 'edit' the economy from the center.\n\nThis system began by pursuing thorough right-wing efficiency, but paradoxically, its completed structure resembles a Soviet-style financial oligarchy where the boundaries between state and capital have vanished. In this system, which thoroughly theorizes the 'Power Elite' model found in Western capital societies like the USA, the revolving door between government bureaucrats and large corporate executives has disappeared. Because from the start, those two were one.\n\nNow, the state has become a massive joint-stock company, the citizens have become shareholders, and Chiaki directs the flow of capital as the permanent CEO of this giant complex. Here, politics is replaced by the 'Board of Directors.' Under the goal of overwhelming efficiency and profit creation, capital and power become one to run the machine of the state without a single gap."

 chiakism_AA1: "Gehenna-German Liberalism"
 chiakism_AA1_desc: "Gehenna-German Liberalism is Chiaki's 'defensive pluralism' ideology born from the bitter reflection that Weimar's powerless tolerance birthed the monster called Nazism. This ideology redefines freedom not as a natural right to laissez-faire, but as a 'responsible right' permitted only within the scope that does not hinder social integration and national stability.\n\nPresident Chiaki Motomiya permanently deleted the 'freedom to destroy' enjoyed by Nazism, which trampled on the dignity of others, and extremism, which threatened the system, in the name of the constitution. Instead, within the fence of 'integration' set by the state, all members regardless of bloodline and origin are guaranteed equal and complete freedom as 'New German Citizens.'\n\nThus, this system is not blind laissez-faire. This is the most powerful and realistic form of controlled liberalism that seeks to protect true coexistence and freedom in a multi-ethnic society by not allowing freedom to the enemies of freedom."

 chiakism_AA2: "Social Dictatorship"
 chiakism_AA2_desc: "Social Dictatorship is a unique one-party-dominant system established upon the desperate sense of crisis that 'division is mutual destruction.' To prevent the ethnic catastrophe that unlimited political struggle would bring, President Chiaki melted all major left-wing forces of Germany and Gehenna into a single 'Grand Coalition'—an unstable but massive alliance.\n\nWhile maintaining formal democratic procedures, this system is similar to a one-party state in that it structurally excludes the possibility of a practical change of government. However, this is not a result of coercion. The citizens of both nations voluntarily chose the stability, welfare, and permanent peace provided by the 'Consensus Dictatorship' designed by Chiaki instead of a bloody civil war.\n\nTherefore, in this society, a true opposition party cannot exist. The state is efficiently managed by a massive single ruling party, and all political conflicts are resolved through 'quiet and precise editing' within the party rather than struggle. This is the product of a massive compromise that is most stable and peaceful, but has castrated political dynamism for survival."

 chiakism_AA3: "Comprehensive National Union"
 chiakism_AA3_desc: "The Comprehensive National Union is a centrist big-tent system that broke away from the authoritarian past of 'Deutsches Reich' and was written on the new pages of 'Deutschland.' President Chiaki combined the defensive constitutionalism of 'Gehenna-German Liberalism' and the stability of 'Social Dictatorship' to create a massive political black hole encompassing both left and right.\n\nUnder this system, national chaos such as Nazism or radical communism is thoroughly excluded in the name of the constitution. Instead, all forces from moderate conservatives to social democrats who comply with the constitution are absorbed into the single ruling party called the 'National Union.' A change of government does not occur, but diverse public opinions are accepted through the fierce and dynamic factional adjustment process within the party.\n\nIn other words, this moved politics from struggle on the streets to discussion in the party meeting room. The masses are satisfied with the sense of stability of the 'Eternal Ruling Party' directed by Chiaki, and Chiaki, as the permanent manager of this giant tent, internally edits and coordinates all national conflicts. This is the completed form of the most free, yet paradoxically most changeless, perfectly controlled democracy."

 traditionalism_with_trinity_characteristics:0 "Trinity Characteristics Traditionalism"
 traditionalism_with_trinity_characteristics_desc:0 "Trinity Characteristics Traditionalism is an ideology that pursues gradual change within the system while protecting the noble aristocratic oligarchy tradition. Established by Nagisa Kirifuji and promoted by the Filius Faction, Trinity Traditionalism was created as a reaction to the militarism claimed by the Pater Faction. Based on a disdain for populism, Filius emphasizes an Enlightenment ideology centered on a small number of intellectuals and upper classes to guide the masses, the preservation of Trinity's central values of faith and nobility, and the matriarchal role of the host leading Trinity's lost children with benevolent love.\n\nHowever, despite the rejection of radical change, religious characteristics, and the aristocratic oligarchy system, Trinity Traditionalism is clearly distinguished from the Catholic traditionalism of local humans. This is because the 'conservative' values that Trinity seeks to protect are actually 'progressive' values from a century in the future, lying outside the understanding of local humans."
 traditionalism_with_trinity_characteristics_neutrality:0 "Trinity Characteristics Traditionalism"
 traditionalism_with_trinity_characteristics_neutrality_desc:0 "Trinity Characteristics Traditionalism is an ideology that pursues gradual change within the system while protecting the noble aristocratic oligarchy tradition. Established by Nagisa Kirifuji and promoted by the Filius Faction, Trinity Traditionalism was created as a reaction to the militarism claimed by the Pater Faction. Based on a disdain for populism, Filius emphasizes an Enlightenment ideology centered on a small number of intellectuals and upper classes to guide the masses, the preservation of Trinity's central values of faith and nobility, and the matriarchal role of the host leading Trinity's lost children with benevolent love.\n\nHowever, despite the rejection of radical change, religious characteristics, and the aristocratic oligarchy system, Trinity Traditionalism is clearly distinguished from the Catholic traditionalism of local humans. This is because the 'conservative' values that Trinity seeks to protect are actually 'progressive' values from a century in the future, lying outside the understanding of local humans."

 arius_nihilism: "Arius Nihilism"
 arius_nihilism_desc: "Arius Nihilism is a form of blind nihilism, the most isolated and militarized in Kivotos, taking the extreme and pessimistic interpretation of the scripture 'Vanity of vanities, all is vanity (Vanitas vanitatum, et omnia vanitas)' as its governing principle.\n\nIn the early days of the Trinity Union's birth, the Arius Branch, which hid in underground catacombs to escape persecution, transformed into a deformed barracks society for the sole purpose of 'revenge' amidst disconnection from the outside. Under this ideology, 'education' is replaced by the honing of killing techniques to eradicate emotions and efficiently destroy others rather than for the students' self-realization. All peace, friendship, and hope in the world are defined as 'false hypocrisy,' and students are brainwashed into believing that only hatred and pain are the sole truths of the world.\n\nPolitically, this system is maintained by the continuation of the thorough brainwashing ideology once planted by Beatrice. Members do not unite to overcome nihilism, but join a contradictory 'Cult of Death' to destroy others' lives to prove their own lives are worthless.\n\nUltimately, Arius Nihilism puts forward the justification of destroying the 'false peace' of Trinity, but in reality, it means the saddest and most destructive dystopia in Kivotos history, where they burn themselves out as consumables while possessed by old grudges."

 academy_state_system_democratic: "Academy-State System"
 academy_state_system_democratic_desc: "The Academy-State System, established after the Great Transfer, is a system that appeared as the academy system of Kivotos from before the Great Transfer took over extensive general administrative duties, including autonomous districts. The Student Council President doubles as the head of state, the Student Council performs the role of the parliament, and the executive and legislative branches are not clearly distinguished."

 academy_state_system_neutrality: "Academy-State System"
 academy_state_system_neutrality_desc: "The Academy-State System, established after the Great Transfer, is a system that appeared as the academy system of Kivotos from before the Great Transfer took over extensive general administrative duties, including autonomous districts. The Student Council President doubles as the head of state, the Student Council performs the role of the parliament, and the executive and legislative branches are not clearly distinguished."
 rikuhachima_socialism:0 "$hardboiled_noir$"
 rikuhachima_socialism_desc:0 "$hardboiled_noir_desc$"

 KR_social_liberal: "$Social_Liberalism$"
 KR_social_liberal_desc: "Social Liberalism is a system rooted in the progressive liberal tradition, promoting the reconstruction of the social contract to meet the changing demands of the times. Its ultimate purpose is to firmly protect and expand the substantive freedom of citizens through structural reforms in politics and the economy."
 
 theocracy_neutrality: "Theocracy"
 theocracy_neutrality_desc: "A theocracy, or hierocracy, is a form of state where the representative of God rules the nation. Theocratic states also elect national leaders through elections like a Pope, but the leader of a theocratic state differs from an elected leader of a democratic republic following popular sovereignty in that they are a religious representative entrusted with power by God."

 IRE_ideology_fianna_fail: "Fianna Fail"
 IRE_ideology_fianna_fail_desc: "Fianna Fail views independence not as a matter of 'declaration' but of 'completion,' and seeks to simultaneously remove external influences and internal divisions blocking national sovereignty. They justify breaking through crises through strong government and mass mobilization, prioritizing the unity of the national community over class struggle. If necessary, they tend to boldly reorganize laws and institutions to fix the direction of the state."
 IRE_ideology_fine_gael: "Fine Gael"
 IRE_ideology_fine_gael_desc: "Fine Gael seeks the legitimacy of the state not in revolutionary passion but in institutions, the rule of law, and financial stability, guarding against rapid change. They take order and trust as the top priorities to suppress social conflict to a manageable level, arguing that the economy must be recovered through gradual reform and responsible finance. Realism is strong, believing the survival of the state depends on 'sustainability' rather than 'boldness.'"

 KR_social_democrat: "$scandinavian_social_democracy$"
 KR_social_democrat_desc: "Social Democracy refers to various governments ruled by the reformist left. They argue that violent class struggle is unnecessary for achieving their goals and occasionally clash with more radical comrades because of it. Most seek change through voting, but it is not unprecedented for them to also seek revolution if the situation becomes extreme."

 KR_social_conservative: "Social Conservatism"
 KR_social_conservative_desc: "Social Conservatism encompasses many democratic governments seeking to maintain, protect, and strengthen the traditional values of the people in changing situations. Social conservatives are not inflexible reactionaries and generally support the rule of law and democracy, willing to pursue gradual and predictable changes within the current political system if they align with their spirit."
 KR_social_conservative_neutrality: "$KR_social_conservative$"
 KR_social_conservative_neutrality_desc: "$KR_social_conservative_desc$"

