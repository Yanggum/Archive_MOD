 SHA_democratic_party:0 "현무상회 중앙파"
 SHA_democratic_party_long:0 "현무상회 중앙파\n§g현무상회는 키보토스 전역의 식자재가 모이는 중심지이자 강력한 영향력을 가진 상인 연합체입니다. 키보토스 전역과 활발하게 무역을 이어가면서 자연스럽게 개방적인 성격을 띠게 되었으며, 이러한 이유로 인해 현룡문의 지속적인 견제를 받고 있습니다.\n\n그중에서도 중앙파는 급진파와 달리 폭력적 수단을 배제하며, 자유민주주의와 시장경제 체제를 유지한 상태에서 점진적인 개혁을 통해 진보적 이상을 실현하는 방향을 추구하고 있습니다.§!\n"
 SHA_neutrality_party:0 "현룡문"
 SHA_neutrality_party_long:0 "현룡문 중앙파"
 SHA_communism_party:0 "현무상회 좌파"
 SHA_communism_party_long:0 "현무상회 좌파\n§g현무상회는 키보토스 전역의 식자재가 모이는 중심지이자 강력한 영향력을 가진 상인 연합체입니다. 키보토스 전역과 활발하게 무역을 이어가면서 자연스럽게 개방적인 성격을 띠게 되었으며, 이러한 이유로 인해 현룡문의 지속적인 견제를 받고 있습니다.\n\n현무상회 좌파는 현룡문의 지속적인 견제와 제재에 지친 이들이 결집하면서 탄생하였습니다. 이들은 현룡문이 더 이상 개혁 의지를 가지고 있지 않다고 판단하며, 점진적인 변화로는 한계가 있다고 주장합니다. 따라서 현 체제를 완전히 뒤엎어야 한다는 입장을 고수하고 있습니다.\n§!"
 SHA_communism_party_1: "현무상회"
 SHA_communism_party_1_long: "현무상회\n§g현무상회는 키보토스 전역의 식자재가 모이는 중심지이자 강력한 영향력을 가진 상인 연합체입니다. 키보토스 전역과 활발하게 무역을 이어가면서 자연스럽게 개방적인 성격을 띠게 되었으며, 이러한 이유로 인해 현룡문의 지속적인 견제를 받고 있습니다. 이들은 현룡문이 더 이상 개혁 의지를 가지고 있지 않다고 판단하며, 점진적인 변화로는 한계가 있다고 주장합니다. 따라서 현 체제를 완전히 뒤엎어야 한다는 입장을 고수하고 있습니다.\n§!"
 SHA_communism_party_BfG: "자유조합연대"
 SHA_communism_party_BfG_long: "자유조합연대\n§g현무상회 내 급진좌익 계열은 오스트로 맑시즘의 수용 이후 현무상회를 해소하고 오스트리아의 자유노조연맹 잔당과 협력하여 이 땅에 변혁을 불러오고자 하고 있습니다. 현룡문이 더 이상 개혁 의지를 가지고 있지 않다고 판단하며, 사회주의를 향한 급진적인 변화로 현 체제를 완전히 뒤엎어야 한다는 입장을 고수하고 있습니다.\n§!"

 SHA_fascism_party:0 "경극부"
 SHA_fascism_party_long:0 "경극부"

 SHA_peking_opera_blackdragon_cop:0 "현룡문"
 SHA_peking_opera_blackdragon_cop_long:0 "현룡문\n§g산해경의 명목상 전권은 류우게 키사키에게 있지만, 실질적인 권력의 중심은 다릅니다. 현재 경극부장이자 현룡문의 비선 실세인 우루시바라 카구야야말로 산해경 권력의 실체라 할 수 있습니다.\n\n모두가 류우게 키사키를 찬양하지만, 그녀는 이제 우루시바라 카구야의 명령을 수행하는 얼굴마담에 불과합니다. 산해경을 이끄는 진정한 힘은 보이지 않는 곳에서 조용히, 그러나 확고하게 움직이고 있습니다.§!\n"
 SHA_Peking_Opera_Club:0 "경극부-현룡문"
 SHA_Peking_Opera_Club_long:0 "경극부-현룡문\n§g현재 경극부는 혁명을 통하여 류우게 키사키의 권력을 전부 이양받았습니다. 또한 행정 공백이 생기는 것을 막기 위하여 현룡문의 부원들을 전부 흡수한 결과 경극부와 현룡문의 기이한 협력 체제가 탄생 하였습니다.§!\n"
 SHA_Radical_party:0 "산해경 급진파"
 SHA_Radical_party_long:0 "연단방-산해경 급진파\n§g연단방의 숨어있는 신타니 카이의 추종자들이 일부 현룡문의 급진파들과 손을 잡았다는 소문이 퍼지고 있었고 지난 경극부의 혁명으로 이는 사실로 들어났습니다. 이들은 주로 신타니 카이와 협력하여 산해경에 새로운 사상을 주입하기 위해 노력하고 있습니다.§!\n"
 SHA_Shintani_KAI_party:0 "신 연단방"
 SHA_Shintani_KAI_party_long:0 "신 연단방 - 신타니주의\n§g신타니주의는 새로운 산해경의 지배 이념으로, 그 이름에서 알 수 있듯이 신타니 카이가 직접 주창한 사상입니다. 신타니 카이와 함께 연구를 진행했던 소규모 단체와 현룡문과 반대되는 새로운 지배 이념을 모색하기 시작하였고, 지속적인 연구 끝에 신타니주의가 탄생하였습니다.\n\n이 이념은 전통을 거부하는 진보적인 운동인 동시에, 극단적인 엘리트주의를 기반으로 국가적 통제를 강화하는 기술가속주의를 주장합니다. 신타니주의는 혁신과 기술 발전을 국가 운영의 핵심 원칙으로 삼으며, 기존 질서를 완전히 재편하는 것을 목표로 하고 있습니다.§!\n"
 
