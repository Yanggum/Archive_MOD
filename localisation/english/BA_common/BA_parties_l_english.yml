 # This party name is utilized if Trinity keeps a Trinity student as leader.
 BAUKR_fascism_party_long:0 "Organization of Ukrainian Nationalists (Melnyk Faction)\n§gThe Organization of Ukrainian Nationalists, known as OUN, was founded in Vienna and was active primarily in the Galicia region. Early OUN expanded its power by cooperating with various minor right-wing groups. When war broke out between Trinity and Russia, a state for Ukrainians was established through Andriy Melnyk's proactive cooperative efforts, although it was a Trinity puppet. However, the OUN-B forces centered on Bandera realized that Trinity also had no true interest in Ukrainian independence and carried out terror attacks. But after suppression by the Justice Task Force, the OUN-B forces eventually vanished into the mists of history.§!\n"
 BAUKR_fascism_party:0 "OUN-M"
 BABLR_fascism_party:0"Byelorussian Central Council"
 BABLR_fascism_party_long:0 "Byelorussian Central Council\n§gThe Director of Academy Intelligence made a proposal to effectively rule the vast Belarus region, and the resulting Byelorussian Central Council was established with the purpose of managing that area. Centered on local collaborator Radasłaŭ Astroŭski, this body dreams of full Belarusian independence, but its future is dark...§!\n"
 BASOV_fascism_party_russian:0 "$SOV_fascism_party_russian$\n§gKonstantin Rodzaevsky, leader of the All-Russian Fascist Party, was an ambitious young politician. From the start of his activities, he expanded his influence by contacting White Russian intellectuals and conducting anti-government terror in the USSR. In Trinity's process of conquering the USSR and looking for suitable local collaborators, the All-Russian Fascist Party naturally stood out. After contact with Trinity, Rodzaevsky was selected as the leader of the Eastern Sacred Mandate and finally came to lead his motherland, Russia. However, behind the scenes, he did not know that Trinity was manipulating them and making Mother Russia sick.§!\n"
 BATR2_fascism_party:0 "FGCDNI"
 BATR2_fascism_party_long:0 "French Government Committee for the Defense of National Interest\n§gThe French Government Committee for the Defense of National Interest is a body created when politicians wanting to restore France gathered relying on Trinity as Trinity invaded Millennium. They are active for various national interests such as protecting French citizens and assets under Trinity's support, but in reality, they are treated as a semi-puppet government unable to disobey Trinity's orders. Furthermore, since Trinity directly manages the Northern France region, the Committee's actual influence is limited to the South.§!\n"



