 ABY_neutrality_party_2:0 "Free Republican Party"
 ABY_democratic_party_2_long:0 "National Social Democratic Party\n§gThe National Social Democratic Party is a Pan-Centrist big-tent party formed primarily by the Czech National Socialist Party and the Austrian Social Democratic Party, led by Edvard Beneš, one of the disciples and successors of Tomáš Masaryk. However, inconsistent with its democratic big-tent propaganda, it is pushing for ties with fascist parties like the Fatherland Front, causing various problems such as some left-wing parties leaving and the public becoming suspicious.§!"
 ABY_communism_party_2_long:0 "Federal Unification Party\n§gThe Federal Unification Party is a party created by Hoshino Takanashi, the Kivotos representative of the coalition government triumvirate, after the success of the liberation operation by gathering Kivotos and local left-wing parties. It enjoys great support from the lower class with extensive welfare systems and pro-worker/peasant policies. However, it seems difficult to gain support from intellectuals as it advocates the unique ideology of Monarchist Socialism.§!"
 ABY_fascism_party_2_long:0 "Enlightenment Society\n§gConspiracy theories about the Enlightenment Society, a secret military organization, have existed for a long time, and its existence was revealed during Konrad Henlein's process of purging Nazi elements within the party. However, due to deleted information, what they want, who their leader is, and none of that has been revealed. But it's clear that the Enlightenment Society seeks to overthrow this government. The Civil-Military Intelligence Department is focusing on searching for them and revealing their reality, striving to eliminate their plots in advance.§!"
 ABY_neutrality_party_2_long:0 "Free Republican Party\n§gThe Free Republican Party is a democratic party supporting laissez-faire, enjoying great popularity among the upper class through broad pro-business policies and property tax cuts. There are many speculations about how a party without a base or root entered parliament, but many politicians speculate that the influence of the Big 3 (Nephthys, Skoda, Rothschild) was involved.§!"
 ABY_democratic_party_3:0 "National Social Liberal Party"
 ABY_communism_party_3:0 "Abydos Socialist Union"
 ABY_fascism_party_3:0 "Federal Democratic Republican Party"
 ABY_neutrality_party_3:0 "Military"
 ABY_democratic_party_3_long:0 "National Social Liberal Party\n§gThe National Social Liberal Party is a big-tent party created by reuniting the National Social Democratic Party after it collapsed following party leader Edvard Beneš's attempted self-coup. Leader Ayane Okusora speaks of love over hate and inclusion over exclusion, accepting the constituent parties of the National Social Democratic Party that were treated as traitors, strictly opposing fascism, and striving to preserve the democratic values left by Masaryk.§!"
 ABY_communism_party_3_long:0 "Abydos Socialist Union\n§gA left-wing big-tent party founded by Hoshino Takanashi. Although it carries the 'Socialist Union' sign, it is actually a massive political alliance encompassing moderate reformists of the center-right to far-left communists. Internal debate is fierce as diverse ideologies coexist, but under Hoshino's leadership and the cause of 'Welfare and Equality for All,' it reigns as the largest political force in the federation.§!"
 ABY_fascism_party_3_long:0 "Federal Democratic Republican Party\n§gFounded by Shiroko Sunaookami after leading loyalist soldiers and citizen militias to suppress Suou's coup. By seizing the absolute majority of seats centered on Shiroko, the hero of national defense, they have established a de facto one-party dictatorship. However, their iron-fisted rule is based on the enthusiastic support and trust of the citizens rather than fear, and they are managing the chaos and leading the federation with strong drive.§!"
 ABY_neutrality_party_3_long:0 "Military\n§gA professional military faction that remained silent during Suou's coup, joining neither the rebels nor the resistance. They strictly exclude political intervention of the military and focus only on the soldier's inherent duties of national defense and carrying out orders. Regardless of the regime's tendency, they swear absolute loyalty to the currently established legal government and are an unshakable pillar supporting the federal army even in times of political upheaval.§!"
 ABY_democratic_party_4:0 "Sekhmet Corps"
 ABY_communism_party_4:0 "§RDISSOLVED§!"
 ABY_fascism_party_4:0 "Truth of Kivotos - For Enlightenment"
 ABY_neutrality_party_4:0 "Nephthys Board of Directors"
 ABY_democratic_party_4_long:0 "Sekhmet Corps\n§gA party starting from the resistance organization formed by Serika Kuromi, the only Foreclosure Task Force member who escaped arrest during Suou Asagiri's coup. Those who fought for democratic defense and the rescue of comrades without yielding in desperate situations have now been reborn as a political force symbolizing the freedom and justice of the federation. Based on past fighting spirit, they are wary of authoritarianism and take citizens' freedom as the top priority.§!"
 ABY_fascism_party_4_long:0 "Truth of Kivotos - For Enlightenment\n§gTruth of Kivotos - For Enlightenment is a Pan-Kivotos nationalist movement organized by Suou Asagiri. Factions of this party, organized in most Kivotos academies centered on this movement, are shaking society and constantly triggering Pan-Kivotosist movements. This movement has a totalitarian character, swearing loyalty to the leader of the Kivotos nation and possesses a far-right populist character claiming they must advance for the development and paradise of the Kivotos nation. Locals associate slogans like 'Kivotos Living Space' with the National Socialism of fallen Germany and are afraid.§!"
 ABY_communism_party_4_long:0 "§RDISSOLVED§!"
 ABY_neutrality_party_4_long:0 "Nephthys Board of Directors\n§gThe Nephthys Board of Directors are the substantive decision-makers of the Nephthys Group. After the Chairman went missing with the Great Transfer, Nonomi, who took over as next Chairman, is nominally the supreme decision-maker, but real power has passed to the Board. Nonetheless, as the Chairman's influence cannot be ignored, they balance things through compromise with her.§!"

