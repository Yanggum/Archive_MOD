 HEU_democratic_party:0 "Right-wing Party - Reform Faction"
 HEU_democratic_party_long:0 "Right-wing Party - Reform Faction\n§gThe Reform Faction within the Right-wing Party, unlike the Conservatives, does not deny modern democratic systems including universal suffrage, and seeks to realize Christian Democratic politics based on Catholic ideals. The Right-wing Party was Luxembourg's traditional agrarian, Catholic-based right-wing party.§!"
 HEU_communism_party:0 "Communist Party of Luxembourg"
 HEU_communism_party_long:0 "Communist Party of Luxembourg\n§gThe Communist Party of Luxembourg is a Stalinist far-left party that declared independence in 1921 after a policy conflict with the left-wing Luxembourg Socialist Workers' Party. It enjoys high popularity among steel and mining workers in southern Luxembourg, but until the 1934 election, they were prohibited from entering parliament (through MP expulsion procedures) even if elected by the ruling Right-wing Party.§!"
 HEU_fascism_party:0 "GEDELIT"
 HEU_fascism_party_long:0 "Society for German Literature and Art\n§gGEDELIT, led by Luxembourgish Greek teacher Damian Kratzenberg, went beyond the concept of a simple 'literary society' to preach cultural homogeneity between Luxembourg and Germany, and Pan-German nationalist views that Luxembourg should be incorporated as part of Germany. GEDELIT grew significantly in size after absorbing the Independent National Party, a right-wing populist party, in 1931, becoming the center of Luxembourg's far-right movement in the 1930s.§!"
 HEU_neutrality_party:0 "Rikuhachima House"
 HEU_neutrality_party_long:0 "Problem Solver 68 / Right-wing Party Coalition Government\n§gAfter the Great Transfer, Luxembourg became the only nation among those invaded by Kivotos students in Central Europe to preserve its sovereignty and territory. Luxembourg Regent Rikuhachima Aru advocates for a somewhat idealistic integration of the Gehenna and Luxembourg populations, while the Right-wing Party cautiously supports Regent Rikuhachima but views her integrationist movement as uncomfortable, as it lowers the party's approval rating.§!"

 HEU_benriya_party:0 "Problem Solver 68"
 HEU_rechtspartei_party:0 "Right-wing Party"
 HEU_PRL_party:0 "Radical Liberal Party"
 HEU_PRL_party_long:0 "Radical Liberal Party\n§gThe Radical Liberal Party is neither particularly radical nor liberal, but it is an attractive alternative for middle-class city dwellers who mistake themselves for progressives to vote for instead of the rural-scented Right-wing Party. Born in 1904, this party was originally named the Liberal League (Liberale Liga), but changed its name as Luxembourg's minor liberals repeatedly merged and split. After 30 years of political life, the RLP realized it could survive in Luxembourg's right-leaning political scene by signaling left while turning right, and until the Great Transfer, it cast votes in favor of the Right-wing Party's policies as a small coalition partner to spread its Luxembourgish radical liberal ideals.§!"
 HEU_LSAP_party:0 "Luxembourg Workers' Party"
 HEU_LSAP_party_long:0 "Luxembourg Workers' Party\n§gLuxembourg's socialist party, the Luxembourg Workers' Party, was founded in 1902, but practically gained political influence after the introduction of universal suffrage in 1919. Unlike the Communist Party of Luxembourg, which split due to different views on the USSR, the Luxembourg Workers' Party opposed the Soviet Union and Stalinism, advocating for the 'separation and autonomy of labor unions and the party.'§!"
 HEU_grand_coalition_party:0 "National Unity Cabinet"
 HEU_grand_coalition_party_long_1:0 "PS68 / Right Party / Radical Liberal / Communist Party Grand Coalition"
 HEU_grand_coalition_party_long_2:0 "PS68 / Federal Student Union / Radical Liberal / Communist Party Grand Coalition"
 HEU_volksdeutsche_party:0 "German Ethnic Movement"
 HEU_volksdeutsche_party_long:0 "German Ethnic Movement\n§gThe German Ethnic Movement, led by Luxembourgish Greek teacher Damian Kratzenberg, is a Nazi political force succeeding Luxembourg's National Socialist movement, GEDELIT, in the early 1930s. Damian Kratzenberg supported the ideal that Luxembourgers were of the same ethnicity as Germans, but this German Ethnic Movement was opposed by Luxembourg's traditional right-wing forces.§!"
 HEU_pro_kayoko_party:0 "Luxembourg Army"
 HEU_pro_kayoko_party_long:0 "Luxembourg Army\n§gAfter the coup incident, the Luxembourg Army split. Royalist forces supporting Rikuhachima Aru declared Onikata Kayoko as the new Prime Minister of Luxembourg, labeled the Mutsuki Cabinet illegal, and began guerrilla warfare. While it's clear they are loyal royalists and supporters of Aru, it does not mean they are democratic or liberal.§!"
 HEU_pro_mutsuki_party:0 "Emergency Government"
 HEU_pro_mutsuki_party_long:0 "Mutsuki Cabinet"
 HEU_pro_mutsuki_party_trinity:0 "Tea Party"
 HEU_pro_mutsuki_party_trinity_long:0 "Tea Party\n§gMutsuki Asagi is an unpredictable figure, much like her nickname 'Little Imp.' Since electronic records were lost in the chaos after the Great Transfer, no one can deny her claim of being 'from an intelligence source sent by Trinity, not Gehenna,' and her antics of claiming to be the 'Luxembourg Host' through rational evidence or data. The Tea Party is operated through post-ideological populist policies catering to Mutsuki Asagi's whims and the Luxembourg public rather than moving by a special ideology.§!"
 HEU_pro_mutsuki_party_gehenna:0 "Gehenna Provisional Revolutionary Government"
 HEU_pro_mutsuki_party_gehenna_long:0 "Gehenna Provisional Revolutionary Government\n§gMutsuki Asagi is an unpredictable figure, much like her nickname 'Little Imp.' Since electronic records were lost in the chaos after the Great Transfer, no one can deny her claim of being 'the Thunder Emperor returned from the chaos of the Great Transfer' through rational evidence or data. The Gehenna Provisional Revolutionary Government is operated through post-ideological populist policies catering to Mutsuki Asagi's whims and the Luxembourg public rather than moving by a special ideology.§!"

 HEU_mutsuki_path_ending_neutrality_party_long:0 "Rikuhachima House\n§gAfter the Great Transfer, Luxembourg became the only nation among those invaded by Kivotos students in Central Europe to preserve its sovereignty and territory. Even after the Asagi Cabinet coup incident, the Royalists became firmer, and the mainstream of the Radical Liberal Party, a liberal party, has become an enthusiastic supporter of Rikuhachima Aru.§!"
 HEU_mutsuki_path_ending_generic:0 "Three-Nation Joint Conference"
 HEU_mutsuki_path_ending_generic_long:0 "Luxembourg-Gehenna-Trinity Joint Conference\n§gAn oligarchy composed of representatives from the three nations—Luxembourg, Gehenna, and Trinity Academy—dispatched representatives according to the Union Law to elect a Prime Minister. Until a new Prime Minister is elected according to democratic procedures, the Joint Conference is the virtually only legitimate political force in the United Principality of Germania.§!"
 HEU_mutsuki_path_ending_gehenna:0 "Rainbow Coalition"
 HEU_mutsuki_path_ending_gehenna_long:0 "Luxembourg Communist-German Ethnic Movement-Radical Liberal-Gehenna Independence Party\n§gThe left-right grand coalition called the Rainbow Coalition has diverse parties ranging from the far-left Communist Party to the far-right German Ethnic Movement. Relationships within the coalition are not very good because they clash over ideological differences and the interests of the three ethnicities: Luxembourgers, Germans, and Gehenners. The only identity binding them as one is the symbolic leader Rikuhachima Aru.§!"
 HEU_mutsuki_path_ending_haruka_long:0 "Luxembourg Communist-German Ethnic Movement-Radical Liberal-Gehenna Independence Party\n§gThe left-right grand coalition called the Rainbow Coalition has diverse parties ranging from the far-left Communist Party to the far-right German Ethnic Movement. Relationships within the coalition are not very good because they clash over ideological differences and the interests of the three ethnicities. Particularly, due to Haruka's Gehenna-phobia issue, the existence of Rikuhachima Aru—the precarious identity binding them—is keeping the coalition unstable.§!"
 HEU_mutsuki_path_ending_trinity:0 "Black-and-White Coalition"
 HEU_mutsuki_path_ending_trinity_long:0 "Christian Social People's Party-Pandemonium Society-Knight Hospitaller\n§gThe Black-and-White Coalition, composed of a firm alliance between Trinity and Gehenna academies and the Christian Democratic-oriented Christian Social People's Party, is bound by deep friendship despite being a union of two hostile academies. Since the Pandemonium Society merely wants to gain their private interests without political ideology, practical national politics is led by political forces close to Catholic conservative tendencies. Along with a royalist stance toward Rikuhachima Aru, the Black-and-White Coalition seeks to realize Social Conservative ideology that denies rapid changes in society.§!"

 HEU_permanent_mandates_commission:0 "PMC"
 HEU_permanent_mandates_commission_long:0 "Permanent Mandates Commission of the League of Nations\n§gThe Permanent Mandates Commission, founded in 1920, manages League of Nations Mandate territories until they achieve independence. Although evaluations from colonized nations regarding the PMC are quite negative, and it's a matter of debate whether the Mandate actually intends to grant independence to former colonies, the PMC would be the most fair alternative force to take power in this region.§!"
 gehenna_local_neutrality_puppet_party:0 "Local Nationalists"
 gehenna_local_democratic_puppet_party:0 "Local Autonomous Government"

 SHA_democratic_party:0 "Genbu Commerce Central Faction"
 SHA_democratic_party_long:0 "Genbu Commerce Central Faction\n§gGenbu Commerce is a merchant alliance with strong influence and the center where food ingredients from all over Kivotos gather. As it continued active trade throughout Kivotos, it naturally took on an open character, which has led to constant checking from the Genryumon.\n\nAmong them, the Central Faction excludes violent means, unlike the radicals, and pursues the realization of progressive ideals through gradual reform while maintaining a liberal democratic and market economic system.§!\n"
 SHA_neutrality_party:0 "Genryumon"
 SHA_neutrality_party_long:0 "Genryumon Central Faction"
 SHA_communism_party:0 "Genbu Commerce Left Faction"
 SHA_communism_party_long:0 "Genbu Commerce Left Faction\n§gGenbu Commerce is a merchant alliance with strong influence and the center where food ingredients gather. It naturally took on an open character, leading to constant checking from the Genryumon.\n\nThe Genbu Commerce Left Faction was born as those tired of the Genryumon's constant checking and sanctions gathered. They judge that Genryumon no longer has a will for reform and argue that gradual change has limits. Therefore, they maintain the position that the current system must be completely overturned.§!\n"
 SHA_communism_party_1: "Genbu Commerce"
 SHA_communism_party_1_long: "Genbu Commerce\n§gGenbu Commerce is the center where ingredients from all over Kivotos gather and a merchant alliance with strong influence. It took on an open character, leading to constant checking from Genryumon. Judging that Genryumon no longer has reformist will, they maintain that the current system must be completely overturned through radical change toward socialism.§!\n"
 SHA_communism_party_BfG: "Free Trade Union Solidarity"
 SHA_communism_party_BfG_long: "Free Trade Union Solidarity\n§gThe radical left-wing faction within Genbu Commerce, following the acceptance of Austro-Marxism, aims to dissolve Genbu Commerce and cooperate with the remnants of the Austrian Free Trade Union Federation to bring transformation to this land. Judging that Genryumon lacks reformist will, they hold that the current system must be completely overturned.§!\n"

 SHA_fascism_party:0 "Peking Opera Club"
 SHA_fascism_party_long:0 "Peking Opera Club"

 SHA_peking_opera_blackdragon_cop:0 "Genryumon"
 SHA_peking_opera_blackdragon_cop_long:0 "Genryumon\n§gWhile Shanhaijing's nominal full power lies with Kisaki Ryuuge, the substantive center of power is different. Kaguya Urushibara, the current head of the Peking Opera Club and the shadow power of Genryumon, can be said to be the reality of Shanhaijing's power.\n\nEveryone praises Kisaki Ryuuge, but she is now merely a figurehead carrying out Kaguya Urushibara's orders. The true power leading Shanhaijing is moving quietly but firmly in an unseen place.§!\n"
 SHA_Peking_Opera_Club:0 "Peking Opera Club-Genryumon"
 SHA_Peking_Opera_Club_long:0 "Peking Opera Club-Genryumon\n§gCurrently, the Peking Opera Club has received all of Kisaki Ryuuge's power through revolution. Furthermore, to prevent an administrative vacuum, they absorbed all members of Genryumon, resulting in the birth of a strange cooperative system between the Peking Opera Club and Genryumon.§!\n"
 SHA_Radical_party:0 "Shanhaijing Radicals"
 SHA_Radical_party_long:0 "Alchemist Society-Shanhaijing Radicals\n§gRumors were spreading that hidden followers of Kai Shintani from the Alchemist Society had joined hands with some Genryumon radicals, which was proven true by the recent Peking Opera Club revolution. They are primarily working to inject new thoughts into Shanhaijing in cooperation with Kai Shintani.§!\n"
 SHA_Shintani_KAI_party:0 "Neo-Alchemist Society"
 SHA_Shintani_KAI_party_long:0 "Neo-Alchemist Society - Shintani-ism\n§gShintani-ism is the new ruling ideology of Shanhaijing, advocated directly by Kai Shintani. A small group that conducted research with Kai Shintani and began searching for a new ruling ideology opposed to Genryumon eventually gave birth to Shintani-ism.\n\nThis ideology is a progressive movement that rejects tradition while simultaneously advocating for Techno-Accelerationism that strengthens national control based on extreme elitism. Shintani-ism takes innovation and technological development as core principles of national operation and aims to completely restructure the existing order.§!\n"
 
