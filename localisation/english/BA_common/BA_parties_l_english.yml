 MIL_fascism_party_long:0 "Cleaning & Clearing\n§g밀레니엄 사이언스 스쿨의 미화부이자 특작부대인 클리닝 앤 클리어링은 대전이 이후 밀레니엄-프랑스 전쟁에서 큰 역할을 맡았습니다. 이들의 특징은 메이드 동아리로 위장하여, 소속된 인원들이 전부 메이드복을 입고 전투에 임한다는 점입니다. 비록 흑색 작전을 진행하는 특작부대라는 임무를 갖고 있지만, 이들의 정체는 사실상 모두가 알고 있는 공공연한 비밀이며, 많은 이들에게 귀감이 되고 있습니다.§!\n"
