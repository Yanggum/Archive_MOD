 ABY_democratic_party_2_long:0 "국민사회민주당\n§g국민사회민주당은 체코 국민사회당과 오스트리아 사회민주당을 주축으로 결성된 범중도 빅텐트 정당이며, 토마시 마사리크의 제자이자 후계자 중 하나인 에드바르트 베네시가 이끌고 있습니다. 하지만 민주주의 빅텐트라는 선전과 알맞지 않게 조국전선 등 파시스트 정당과의 연계를 추진하고 있어 일부 좌익 정당이 이탈하고 국민의 의심을 사는 등 여러 문제가 발생하고 있습니다.§!"
 ABY_communism_party_2_long:0 "연방통합당\n§g연방통합당은 연립정부 삼두정의 키보토스계 대표였던 타카나시 호시노가 해방작전의 성공 이후 키보토스와 현지의 좌익 정당을 규합해 만든 정당이며, 폭넓은 복지제도와 친 노동자-농민 정책으로 하류층의 큰 지지를 받고 있습니다. 다만, 군주제 사회주의라는 특이한 사상을 내세우고 있어 지식인들의 지지를 받는 것은 쉽지 않아 보입니다.§!"
 ABY_fascism_party_2_long:0 "조국전선\n§g조국전선은 1933년 5월 20일, 오스트리아에서 엥겔베르트 돌푸스에 의해 창설되었습니다. 오스트로파시즘, 기업국가주의, 보수주의를 주장한 이 정당은 1934년, 정권을 잡고 오스트리아 공화국의 국명을 오스트리아 연방국으로 갈음했습니다. 독일에서 나치당의 집권 이후 나치즘에 반대했던 조국전선은 점차 나치들에게 인기도를 빼앗겼으나, 대전이와 함께 나치즘이 몰락하며 그들은 오스트리아에서 다시금 현지인들에게 가장 큰 영향력을 가진 정당이 되었습니다.§!"
 ABY_neutrality_party_2_long:0 "자유공화당\n§g자유공화당은 자유방임주의를 지지하는 민주주의 정당으로, 폭넓은 친 기업 정책과 재산세 감축 등으로 상류층에게 큰 인기를 끌고 있습니다. 기반도, 근본도 없는 정당이 원내로 입성하게 된 데에는 많은 추측이 있으나, 많은 정치인들은 3대 기업(네프티스, 슈코다, 로스차일드)의 입김이 들어간 것으로 추측하고 있습니다.§!"
 ABY_democratic_party_3:0 "국민사회자유당"
 ABY_communism_party_3:0 "합스부르크-로트링겐 가문"
 ABY_fascism_party_3:0 "연방민주공화당 - 유신파"
 ABY_neutrality_party_3:0 "연방민주공화당 - 헌정파"
 ABY_democratic_party_3_long:0 "국민사회자유당\n§g국민사회자유당은 국민사회민주당의 당수 에드바르트 베네시의 친위 쿠데타 시도 이후 와해된 국민사회민주당을 다시 규합하여 만들어진 빅텐트 정당입니다. 당수 오쿠소라 아야네는 혐오보다 사랑, 배척보다 포용을 말하며 내란범으로 취급되던 국민사회민주당의 구성 정당들을 받아들였으며, 파시즘에 대해 엄격히 반대하며 마사리크가 남긴 민주주의적 가치를 보존하기 위해 노력하고 있습니다.§!"
 ABY_communism_party_3_long:0 "합스부르크-로트링겐 가문\n§g합스부르크-로트링겐 가문은 대공위시대를 거치며 그 두각을 드러냈습니다. 대공위시대 막바지, 프르셰미슬 왕조의 오타카르 2세가 강한 황제 후보로 떠오르자 슬라브인 황제를 받아들이고 싶지 않았던 독일 귀족들은 한미한 합스부르크 가문을 지원해 오타카르 2세의 야망을 꺾고 황제로 즉위시켰습니다. 이후 합스부르크 가문은 신성 로마 제국의 여러 왕가들과 혼인 동맹을 맺으며 그들 가문이 단절됨에 따라 막대한 영지를 획득했습니다. 그러나 그 합스부르크 가문조차 카를 6세 시절 아들을 낳지 못해 가문이 단절될 위기에 처하자, 로트링겐 가문과 혼인하며 합스부르크-로트링겐 가문이 출범합니다. 카를 6세의 사망 이후, 오스트리아 왕위 계승 전쟁, 7년 전쟁, 폴란드 분할 등이 진행되며 합스부르크-로트링겐 가문은 많은 영토를 얻었으나 영향력은 약해져 갔습니다. 이후 나폴레옹 전쟁, 보오전쟁에서의 연이은 패배로 가문은 몰락의 길을 걸었고, 대전쟁에서의 패배로 합스부르크-로트링겐 가문은 모든 영토를 잃고 조국 오스트리아에게마저 입국금지를 당하게 됩니다. 하지만 지금, 연방통합당이 정권을 잡고 '붉은 여대공' 엘리자베트 마리를 황제로 선출하며 가문에 다시 한 번 기회가 주어졌습니다. 졸지에 세계에서 가장 붉은 왕가가 된 합스부르크-로트링겐이 다시 제2의 부흥을 이끌어낼 수 있을지 지켜보아야 할 것입니다.§!"
 ABY_fascism_party_3_long:0 "연방민주공화당 - 유신파\n§g연방민주공화당 - 유신파는 주로 군 장교로 구성된 연방민주공화당 내의 파벌입니다. 이들은 군이 주도하는 질서를 꿈꾸며, 자신들의 지위를 위한 많은 전쟁과 군대를 필요로 합니다.§!"
 ABY_neutrality_party_3_long:0 "연방민주공화당 - 헌정파\n§g연방민주공화당 - 헌정파는 주로 젊은 장교와 정치계 인사로 구성된 연방민주공화당 내의 파벌입니다. 이들은 보수적이지만, 적어도 군국주의에는 반대하며 민주주의적 헌정질서를 다시 안착시키기를 바라고 있습니다.§!"
 ABY_democratic_party_4:0 "벨벳 운동"
 ABY_communism_party_4:0 "노동자-농민 인터내셔널"
 ABY_fascism_party_4:0 "진리의 키보토스 - 계몽을 위하여"
 ABY_neutrality_party_4:0 "네프티스 이사회"
 ABY_democratic_party_4_long:0 "벨벳 운동\n§g네프티스 이사회" ABY_democratic_party_4_long:0 "벨벳 운동은 연방민주공화당의 독재에 저항하는 시민들의 민주주의 회복 운동입니다. 군사정부의 반전 시위 무력 진압을 계기로 전국으로 퍼진 이 운동은 원래 무장투쟁운동으로 계획되었으나 대책위원회의 합류로 바뀌었습니다. 대책위원회는 철저한 비폭력 운동을 주장했고, 이에 시위대는 꽃 한 송이씩을 들고 대로를 행진하기 시작했고, 이것이 이 운동이 벨벳 운동으로 불리는 계기가 되었습니다. 아직은 군사정부의 철권 독재 속에 꽃을 피우지 못했지만, 벨벳 운동을 상징하는 또 하나의 요소, 딸랑거리는 열쇠가 의미하는 바 처럼 굳게 잠긴 문을 열 힘이 될 것입니다.§!"
 ABY_fascism_party_4_long:0 "진리의 키보토스 - 계몽을 위하여\n§g진리의 키보토스 - 계몽을 위하여는 아사기리 스오우가 조직한 범키보토스 민족주의 운동입니다. 진리의 키보토스-계몽을 위하여를 중심으로 키보토스 대부분의 학원들에 조직된 이 정당의 분파는 사회를 뒤흔들며 지속적으로 범키보토스주의 운동을 촉발하고 있습니다. 이 운동은 전체주의적 성격을 띄며 키보토스 민족의 영도자께 충성을 다하고 키보토스 민족의 발전과 낙원을 위해 나아가야 한다는 극우 포퓰리즘적 성격 역시 가지고 있습니다. 현지인들은 '키보토스인의 생활권' 등의 표어를 보며 몰락한 독일의 국가사회주의를 연상하고 두려워하고 있습니다.§!"
 ABY_communism_party_4_long:0 "노동자-농민 인터내셔널\n§g노동자-농민 인터내셔널은 연방통합당의 후신으로, 공산주의 인터내셔널에 대항하는 새 인터내셔널의 창설과 정당, 국가 조직의 해체와 노동자-농민 협동조합 질서를 목표하고 있습니다. 최고 평의회는 존재하지만, 기본적으로 모든 국가 질서를 해체하고 주 단위의 협동조합 연합체로 연방을 구성할 계획을 세우고 있습니다. §!"
 ABY_neutrality_party_4_long:0 "네프티스 이사회\n§g네프티스 이사회는 네프티스 그룹의 실질적 결정권자로, 대전이와 함께 회장이 실종된 이후 표면상으로는 다음 회장을 맡은 노노미가 최고 결정권자이나, 실권은 이사회에 넘어가 있습니다. 그럼에도 회장의 영향력은 무시할 수준이 아니기에, 회장과의 타협으로 균형을 맞추고 있습니다.§!"

