 manyoshu_long:0 "Manyoshu"
 manyoshu_desc:0 "A library-style dormitory located deep inside an alley lined with old bookstores. Since the dormitory itself is a giant library, it seems countless old books containing poems, songs, and stories are stacked inside the building. Furthermore, there is a giant old bookstore inside the dormitory. It's easy to misunderstand by its flashy appearance, but the students of this dormitory are just people with free hearts who enjoy poetry and elegance."
 singican:0 "Shingikan"
 singican_noun:0 "Shingikan"
 singican_desc:0 "One of the largest dormitories in Kapila. As there are many students, hierarchies and discipline are relatively strict. However, there are as many troublemakers as its size."
