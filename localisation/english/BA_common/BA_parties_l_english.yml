 MIKA_FASCISM_SHORT:0 "Tea Party"
 MIKA_FASCISM_LONG:0 "Tea Party - Pater Faction\n§gAfter the First Council, the Pater Faction's militaristic character vanished, and it degenerated into a group of conservatives, elitists, and authoritarians that remained only in appearance. However, as the Great Transfer and Trinity's historical particularity intertwined, the Pater Faction returned to its form before the First Council. This change is not a mere coincidence but an extension of the will of the first Pater faction head. Current head Mika Misono has also inherited this flow, harboring a firm will to build a great and fair Trinity. 'Trinity will save itself.'§!\n"
