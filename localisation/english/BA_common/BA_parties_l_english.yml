 TRM_mika_unconfirmed_party_long:0 "[Unauthorized Organization]\n§gWhen Mika Misono usurped power and a new constitution was passed under her leadership, other factions dissolved themselves or were forcibly dissolved under the systematic oppression of the Pater Faction. Although some still operate underground to pull down the Pater Faction, even this is merely an expression of aimless anger toward reality.§!\n"

 TRM_nagi_nagi_democratic_party:0 "Tea Party - Filius Faction"
 TRM_nagi_nagi_democratic_party_long:0 "Tea Party - Filius Faction\n§gThe anti-populist, aristocratic aspects of the Filius Faction gradually intensified after the political conflict with the Pater Faction following the Great Transfer. The protection of tradition, the preservation of the noble Trinity faith, and Pan-Kivotosism—inheriting the torch of the Eden Treaty from before the Great Transfer—are the three pillars symbolizing the Filius Faction.§!"
 TRM_nagi_nagi_neutrality_party:0 "Tea Party - Filius Faction"
 TRM_nagi_nagi_neutrality_party_long:0 "Tea Party - Filius Faction\n§gThe anti-populist, aristocratic aspects of the Filius Faction gradually intensified after the political conflict with the Pater Faction following the Great Transfer. Some hardliners possess an even more elitist tendency compared to moderate forces.§!"
 TRM_nagi_nagi_fascism_party:0 "Tea Party - Pater Faction"
 TRM_nagi_nagi_fascism_party_long:0 "Tea Party - Pater Faction\n§gThe Pater Faction, as Trinity's populist opposition, exerts influence as the largest opposition party even after losing the host election in 1936. Their Trinity Socialism—a claim for a second Trinity that is changed, reformed, and serves the masses—remains the greatest threat to Trinity elitism.§!"
