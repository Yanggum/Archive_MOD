l_english:
 #Ideology#
 aicontrol:0 "AI Control"
 aicontrol_desc:0 "A highly advanced Artificial Intelligence is controlling the entire nation. All national policies are determined by the AI's autonomous judgment and logic."
 fascism_aicontrol:0 "AI Control"
 fascism_aicontrol_desc:0 "A highly advanced Artificial Intelligence is controlling the entire nation. All national policies are determined by the AI's autonomous judgment and logic."
 tea_party_fascism_ideology:0 "Pater Faction"
 tea_party_fascism_ideology_desc:0 "The militaristic nature and absolute loyalty to the head of the Pater Faction originated from conflicts within Trinity thousands of years ago, much like the birth of Fascism on Earth. After the First Council, when the factions of Trinity were integrated through 'Consensus' and the conflicts subsided, the Pater Faction's light gradually faded, becoming unified under the cross."
 pater_nazism:0 "Trinity Socialism"
 pater_nazism_desc:0 "Trinity Socialism is a unique ideology born within Trinity amidst a changing world. It possesses right-wing ultranationalist characteristics and often seeks to mobilize the power of the masses for radical goals. Holding a disdain for traditional democracy and exploiting public contempt for the old order, they frequently rely on eclectic inspiration to solve major societal issues."
 tea_party_neutrality_ideology:0 "Filius Faction"
 tea_party_neutrality_ideology_desc:0 "The Filius Faction is the force that has traditionally led Trinity by holding leadership within the Tea Party. While they primarily pursue peaceful methods, they are those who would not hesitate to take radical actions for the sake of Trinity, having induced various violent acts during the process of unifying Trinity in the past."
 emergency_military_government:0 "Emergency Military Government"
 emergency_military_government_desc:0 "The military is directly intervening in the government to overcome a total state of emergency."
 The_Colour_democratic:0 "§0The Colour§! - §1Extra-dimensional Invaders§!"
 The_Colour_democratic_desc:0 "§0A massive force is attacking the planet.§!\n\n§1This unknown, mysterious power erodes the world, possessing the strength to twist those it touches into beings different from what they once were. The end of the world seems near.§!"
 The_Colour_communism:0 "§0The Colour§! - §1Extra-dimensional Invaders§!"
 The_Colour_communism_desc:0 "§0A massive force is attacking the planet.§!\n\n§1This unknown, mysterious power erodes the world, possessing the strength to twist those it touches into beings different from what they once were. The end of the world seems near.§!"
