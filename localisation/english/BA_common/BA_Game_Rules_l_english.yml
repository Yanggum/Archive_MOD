 RULE_OPTION_HISTORICAL_GEI_DESC: "게마트리아 AI는 무작위로 자신들의 길을 선택합니다."
 RULE_OPTION_COLOUR_PATH_COULOUR: "색채"
 RULE_OPTION_COLOUR_PATH_COULOUR_DESC: "\n\n§R요구사항:§!\n색채가 비활성화되지 않음."
