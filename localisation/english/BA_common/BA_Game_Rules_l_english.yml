 RULE_OPTION_COLOUR_PATH_DEECAGRAMMATON_DESC: ""

 GEH_AI_BEHAVIOR:0 "@GEH 게헨나 선도부"
 RULE_OPTION_HISTORICAL_GEH_DESC:0 "게헨나 선도부 AI는 무작위로 자신들의 길을 선택합니다."
 RULE_OPTION_GEH_AKO:0 "선도부 총회 - §C아코§!의 승리"
 RULE_OPTION_GEH_HINA:0 "선도부 총회 - §R열성부원들§!의 승리"
 RULE_OPTION_GEH_IORI:0 "선도부 총회 - §O이오리§!의 승리"
 RULE_OPTION_GEH_GENERIC:0 "선도부 총회 - §Y경합§!"
 RULE_OPTION_GEH_AKO_DESC:0 "선도부 AI는 §C아마우 아코§!와 기획부가 정권을 획득한 이후, 선도부를 관료제 국가로 개혁하는 것과 관련 있는 중점 계통도를 따라 내려갈 것입니다."
 RULE_OPTION_GEH_HINA_DESC:0 "선도부 AI는 §R소라사키 히나§!를 찬양하는 광신도들로 정부가 장악되어, 히나에게 철인 독재를 강요하는 것과 관련 있는 중점 계통도를 따라 내려갈 것입니다."
 RULE_OPTION_GEH_IORI_DESC:0 "선도부 AI는 §O시로미 이오리§!와 실행부가 정권을 획득한 이후, 선도부를 군국주의 국가로 변화시키는 것과 관련 있는 중점 계통도를 따라 내려갈 것입니다."
 RULE_OPTION_GEH_GENERIC_DESC:0 "선도부 AI는 여러 파벌들의 논쟁이 §Y경합§!을 일으켜, 어떠한 개혁도 이루지 못하는 §Y현상유지§!를 실시하는 것과 관련 있는 중점 계통도를 따라 내려갈 것입니다."

 GEH_HINA_AI_BEHAVIOR:0 "@GEH 선도부 열성부원들의 승리"
 RULE_OPTION_HISTORICAL_GEH_HINA_DESC:0 "게헨나 선도부 AI는 무작위로 자신들의 길을 선택합니다.\n§R경고: 열성부원들이 정권을 장악해야만 합니다.§!"
 RULE_OPTION_GEH_HINA_PUPPET: "$GEH_student_peoples_will$"
 RULE_OPTION_GEH_HINA_TERRIBLE: "$GEH_gehenna_leader$"
 RULE_OPTION_GEH_HINA_PUPPET_DESC:0 "소라사키 히나는 열성부원들의 꼭두각시이자 상징적 지도자로 남게 될 것입니다.\n§R경고: 열성부원들이 정권을 장악해야만 합니다.§!"
 RULE_OPTION_GEH_HINA_TERRIBLE_DESC:0 "소라사키 히나는 사실상의 전제군주로서 절대 권력을 받아들일 것입니다.\n§R경고: 열성부원들이 정권을 장악해야만 합니다.§!"

 HEU_AI_BEHAVIOR:0 "@LUX 룩셈부르크 대공국 §g(흥신소 68)§!"
 RULE_OPTION_HISTORICAL_HEU_DESC:0 "룩셈부르크 AI는 친게헨나 혁명 정부를 수립하고, 스스로를 키보토스의 새 총학생회장으로 자칭하는 것과 관련 있는 중점 계통도를 따라 내려갈 것입니다."
 RULE_OPTION_PRO_GEH_FASCISM:0 "£GFX_BA_game_rule_flag_HEU  68혁명 흥신소 68"
 RULE_OPTION_ANTI_GEH_FASCISM:0 "@LUX 자립 68혁명 룩셈부르크"
 RULE_OPTION_ANTI_GEH_FASCISM_DESC:0 "룩셈부르크 AI는 자신만의 길을 걸은 뒤, 우파당과 결별하고 68혁명의 지도자로 도이칠란트를 통일하려는 것과 관련 있는 중점 계통도를 따라 내려갈 것입니다."
 RULE_OPTION_ANTI_GEH_COMMUNISM:0 "@LUX 자립 민주사회주의 룩셈부르크"
 RULE_OPTION_ANTI_GEH_COMMUNISM_DESC:0 "룩셈부르크 AI는 자신만의 길을 걸은 뒤, 공산당과 협력해 도이칠란트를 통일하려는 것과 관련 있는 중점 계통도를 따라 내려갈 것입니다."

 HEU_EYES_AI_BEHAVIOR:0 "@LUX 리쿠하치마 아루의 시각 장애"
 RULE_OPTION_ARU_EYES_RANDOM_DESC:0 "리쿠하치마 아루가 나치당원들에게 집단 폭행을 당하고 한쪽 눈이 먼 뒤, 룩셈부르크 의사들은 밀레니엄에 첨단 의안의 제작을 의뢰할 것입니다. 밀레니엄이 이 요구를 받아들일 것인지는 완전한 무작위로 결정됩니다.\n§R경고: 룩셈부르크가 반게헨나 자립을 선택해야만 합니다.§!"
 RULE_OPTION_ARU_EYES_GOOD: "밀레니엄의 승인"
 RULE_OPTION_ARU_EYES_GOOD_DESC:0 "리쿠하치마 아루가 나치당원들에게 집단 폭행을 당하고 한쪽 눈이 먼 뒤, 룩셈부르크 의사들은 밀레니엄에 첨단 의안의 제작을 의뢰할 것입니다. 밀레니엄은 반드시 룩셈부르크 정부에 의안을 제공하며, 아루는 눈이 멀었다는 것을 타인에게 들키지 않을 수 있습니다.\n§R경고: 룩셈부르크가 반게헨나 자립을 선택해야만 합니다.§!"
 RULE_OPTION_ARU_EYES_BAD: "밀레니엄의 거부"
 RULE_OPTION_ARU_EYES_BAD_DESC:0 "리쿠하치마 아루가 나치당원들에게 집단 폭행을 당하고 한쪽 눈이 먼 뒤, 룩셈부르크 의사들은 밀레니엄에 첨단 의안의 제작을 의뢰할 것입니다. 밀레니엄은 반드시 룩셈부르크 정부에 의안 제공을 거부합니다. 아루는 1930년대 기술로 만들어진 조잡한 의안을 사용하게 되며, 아루의 초상화가 영구적으로 변화합니다.\n§R경고: 룩셈부르크가 반게헨나 자립을 선택해야만 합니다.§!"

 EDEN_WAR_AI_BEHAVIOR:0 "@LUX @GEH @GEM @TRM 에덴 결전의 결과" 
 RULE_OPTION_HISTORICAL_EDEN_DESC:0 "에덴 결전의 승리자는 실제 전쟁이 일어나기 전까지는 누구도 알 수 없습니다."
 RULE_OPTION_EDEN_VICTORY_GEHENNA:0 "@LUX @GEH @GEM 게헨나의 승리"
 RULE_OPTION_EDEN_VICTORY_GEHENNA_DESC:0 "에덴 결전에서 반드시 게헨나가 승리합니다.\n§R경고: AI끼리의 대결에만 작동합니다.§!"
 RULE_OPTION_EDEN_VICTORY_TRINITY:0 "@TRM 트리니티의 승리"
 RULE_OPTION_EDEN_VICTORY_TRINITY_DESC:0 "에덴 결전에서 반드시 트리니티가 승리합니다.\n§R경고: AI끼리의 대결에만 작동합니다.§!"

