# National Paths
 GEI_AI_BEHAVIOR: "@GEI Gematria"
 RULE_OPTION_HISTORICAL_GEI_DESC: "Gematria AI will choose their path randomly."
 RULE_OPTION_COLOUR_PATH_COULOUR: "The Chroma"
 RULE_OPTION_COLOUR_PATH_COULOUR_DESC: "\n\n§RRequirements:§!\nThe Chroma must not be disabled."
 RULE_OPTION_COLOUR_PATH_DEECAGRAMMATON: "Decagrammaton"
 RULE_OPTION_COLOUR_PATH_DEECAGRAMMATON_DESC: "\"I shall prove the existence of God through the logic of machines.\" - Binah"

 GEH_AI_BEHAVIOR:0 "@GEH Gehenna Disciplinary Committee"
 RULE_OPTION_HISTORICAL_GEH_DESC:0 "Gehenna Disciplinary Committee AI will choose their path randomly."
 RULE_OPTION_GEH_AKO:0 "Committee Plenum - §CVictory for Ako§!"
 RULE_OPTION_GEH_HINA:0 "Committee Plenum - §RVictory for the Zealots§!"
 RULE_OPTION_GEH_IORI:0 "Committee Plenum - §OVictory for Iori§!"
 RULE_OPTION_GEH_GENERIC:0 "Committee Plenum - §YContested§!"
 RULE_OPTION_GEH_AKO_DESC:0 "The Committee AI will follow the focus tree branch related to reforming the Committee into a bureaucratic state after §CAmau Ako§! and the Planning Division seize power."
 RULE_OPTION_GEH_HINA_DESC:0 "The Committee AI will follow the focus tree branch where the government is seized by fanatics praising §RSorasaki Hina§!, forcing her into an enlightened autocracy."
 RULE_OPTION_GEH_IORI_DESC:0 "The Committee AI will follow the focus tree branch related to transforming the Committee into a militaristic state after §CShiromi Iori§! and the Executive Division seize power."
 RULE_OPTION_GEH_GENERIC_DESC:0 "The Committee AI will maintain the §YStatus Quo§!, unable to achieve any reforms due to the §YContention§! between various factions."

 GEH_HINA_AI_BEHAVIOR:0 "@GEH Victory for the Committee Zealots"
 RULE_OPTION_HISTORICAL_GEH_HINA_DESC:0 "Gehenna Disciplinary Committee AI will choose their path randomly.\n§RWarning: The Zealots must have seized power.§!"
 RULE_OPTION_GEH_HINA_PUPPET: "$GEH_student_peoples_will$"
 RULE_OPTION_GEH_HINA_TERRIBLE: "$GEH_gehenna_leader$"
 RULE_OPTION_GEH_HINA_PUPPET_DESC:0 "Sorasaki Hina will remain a symbolic leader and a puppet of the Zealots.\n§RWarning: The Zealots must have seized power.§!"
 RULE_OPTION_GEH_HINA_TERRIBLE_DESC:0 "Sorasaki Hina will accept absolute power as a de facto autocrat.\n§RWarning: The Zealots must have seized power.§!"

 HEU_AI_BEHAVIOR:0 "@LUX Grand Duchy of Luxembourg §g(Problem Solver 68)§!"
 RULE_OPTION_HISTORICAL_HEU_DESC:0 "The Luxembourg AI will follow the focus tree related to establishing a pro-Gehenna revolutionary government and declaring themselves the new GSC President."
 RULE_OPTION_PRO_GEH_FASCISM:0 "£GFX_BA_game_rule_flag_HEU  The 68 Revolution - Problem Solver 68"
 RULE_OPTION_ANTI_GEH_FASCISM:0 "@LUX Independent 68 Revolution - Luxembourg"
 RULE_OPTION_ANTI_GEH_FASCISM_DESC:0 "The Luxembourg AI will walk its own path, breaking with the Right-wing Party and attempting to unify Deutschland as the leader of the 68 Revolution."
 RULE_OPTION_ANTI_GEH_COMMUNISM:0 "@LUX Independent Democratic Socialist Luxembourg"
 RULE_OPTION_ANTI_GEH_COMMUNISM_DESC:0 "The Luxembourg AI will walk its own path, cooperating with the Communist Party to unify Deutschland."

 HEU_EYES_AI_BEHAVIOR:0 "@LUX Rikuhachima Aru's Visual Impairment"
 RULE_OPTION_ARU_EYES_RANDOM_DESC:0 "After Rikuhachima Aru is assaulted by Nazi party members and blinded in one eye, Luxembourgish doctors will request Millennium to craft an advanced ocular prosthesis. Whether Millennium accepts this request is determined randomly.\n§RWarning: Luxembourg must choose Anti-Gehenna Independence.§!"
 RULE_OPTION_ARU_EYES_GOOD: "Millennium's Approval"
 RULE_OPTION_ARU_EYES_GOOD_DESC:0 "Following the assault and loss of her eye, Millennium will grant the request for a prosthesis. Aru will receive a high-tech artificial eye, allowing her to hide her blindness from others.\n§RWarning: Luxembourg must choose Anti-Gehenna Independence.§!"
 RULE_OPTION_ARU_EYES_BAD: "Millennium's Rejection"
 RULE_OPTION_ARU_EYES_BAD_DESC:0 "Following the assault and loss of her eye, Millennium will reject the request. Aru will have to use a crude 1930s-era glass eye, permanently changing her portrait.\n§RWarning: Luxembourg must choose Anti-Gehenna Independence.§!"

 EDEN_WAR_AI_BEHAVIOR:0 "@LUX @GEH @GEM @TRM Outcome of the Decisive Battle of Eden" 
 RULE_OPTION_HISTORICAL_EDEN_DESC:0 "The winner of the Battle of Eden remains unknown until the actual war breaks out."
 RULE_OPTION_EDEN_VICTORY_GEHENNA:0 "@LUX @GEH @GEM Gehenna Victory"
 RULE_OPTION_EDEN_VICTORY_GEHENNA_DESC:0 "Gehenna will always emerge victorious in the Battle of Eden.\n§RWarning: Only works for AI vs AI battles.§!"
 RULE_OPTION_EDEN_VICTORY_TRINITY:0 "@TRM Trinity Victory"
 RULE_OPTION_EDEN_VICTORY_TRINITY_DESC:0 "Trinity will always emerge victorious in the Battle of Eden.\n§RWarning: Only works for AI vs AI battles.§!"

 TRN_PATH: "@TRM Helmsman of the Motherland"
 RULE_OPTION_TRN_PATH_RANDOM: "Default"
 RULE_OPTION_TRN_PATH_RANDOM_DESC: "Trinity's fate follows the accordion played by God. When the melody changes, we have no choice but to move with it, and that choice will rewrite the history of Kivotos."
 RULE_OPTION_TRN_PATH_PATER_SECT: "@TRM Misono Mika"
 RULE_OPTION_TRN_PATH_PATER_SECT_DESC: "In the Tea Party nomination election following the Yurizono Seia incident, Misono Mika secured the Host position with overwhelming support. Now, she will move along the path ordained by fate. A new era for Trinity begins in her hands."
 RULE_OPTION_TRN_PATH_PATER_SECT_HIGH_HONOR: "@TRM Misono Mika (High Honor)"
 RULE_OPTION_TRN_PATH_PATER_SECT_HIGH_HONOR_DESC: "After securing the Host position, Mika begins to feel a deep disillusionment with the path of the Pater Faction. Wavering between ideals and reality, she eventually finds her own answer—to no longer work solely for a faction, but to dedicate herself to all students as a true leader."
 RULE_OPTION_TRN_PATH_PATER_SECT_LOW_HONOR: "@TRM Misono Mika (Low Honor)"
 RULE_OPTION_TRN_PATH_PATER_SECT_LOW_HONOR_DESC: "After securing the Host position, the gap between ideals and reality begins to erode Mika's heart. Eventually, she transforms into the tyrant she was destined to become, seeking to destroy the Pater Faction and everything else in her wake."
 RULE_OPTION_TRN_PATH_FILIUS_SECT: "@TRM Kirifuji Nagisa"
 RULE_OPTION_TRN_PATH_FILIUS_SECT_DESC: "\"The garden of Trinity must be pruned with a steady hand.\" Nagisa stands at the crossroads of survival, determined to preserve the Filius Faction's legacy through cold diplomacy and internal stability, even if it means sacrificing the warmth of her own heart for the sake of the school's future."
 
 COU_PATH: "@COU General Student Council"
 RULE_OPTION_COU_PATH_DEFAULT_DESC: "The GSC AI will choose a random path."
 RULE_OPTION_COU_PATH_KAYA: "Rule of the Superman"
 RULE_OPTION_COU_PATH_KAYA_DESC: "Such 'mob rule' methods solve nothing. Kivotos must be commanded by a Superman."

