l_english:
 #Infantry#
 category_halo: "All Halo Formations"
 category_halo_battalion: "All Halo Battalions"
 category_halo_special_forces: "All Halo Special Forces"
 halo_infantry: "Halo Infantry"
 halo_infantry_desc: "Infantry protected by halos."
 halo_paratrooper: "Halo Paratroopers"
 halo_paratrooper_desc: "Incorporating halo-protected airborne troops into the army allows forced entry into areas that were previously inaccessible and enables the rapid deployment of key units, creating new tactical opportunities."
 halo_marine: "Halo Marines"
 halo_marine_desc: "Units specialized in amphibious warfare are becoming increasingly indispensable. With halo-protected marines receiving the support of landing ships and specialized training, the days of improvised operations and makeshift equipment are long past."
 halo_mountaineers: "Halo Mountaineers"
 halo_mountaineers_desc: "Combat in mountainous terrain exposes units to significant danger, yet it cannot always be avoided. By providing specialized equipment and training to halo-protected soldiers, these risks can be minimized."
 halo_ranger: "Halo Rangers"
 halo_ranger_desc: "Halo-protected rangers are the foremost experts in combat within densely vegetated terrain."
 halo_militia: "Halo Militia"
 halo_militia_desc: "Militia protected by halos."
 halo_special_forces: "Halo Special Forces"
 halo_special_forces_desc: "Elite halo-protected special forces."
 low_halo_infantry: "Artificial Halo Infantry"
 low_halo_infantry_desc: "Halo infantry created through artificial means."
 juggernaut: "Juggernaut"
 juggernaut_desc: "Infantry equipped with exoskeleton suits infused with mystic power."
 juggernaut_pioneer: "Juggernaut Special Support Unit"
 juggernaut_pioneer_desc: "A specialized company established to integrate mystic-infused exoskeleton suits into a cohesive operational framework."
 category_juggernaut: "All Juggernauts"
 category_mythic: "All Mystic Formations"
 category_mythic_special: "All Mystic Special Forces"
 umamusume: "Umamusume Infantry"
 umamusume_desc: "Umamusume infantry capable of running at speeds of 70 km/h."
 tokiwadai_infantry: "Esper Unit"
 tokiwadai_infantry_desc: "A military unit composed of espers."
 color_infantry: "Chromatic Infantry"
 color_infantry_desc: "Infantry composed of chromatic entities."
 decagrammaton_infantry: "Decagrammaton Infantry"
 decagrammaton_infantry_desc: "Infantry produced in the military factories of Decagrammaton."
 gei_otomaton: "Automaton"
 gei_otomaton_desc: "Automaton mechanized units produced in the military factories of Decagrammaton."
 #Support Companies#
 halo_recon: "Halo Recon Company"
 halo_recon_desc: "Reconnaissance company protected by halos."
 halo_engineer: "Halo Engineer Company"
 halo_engineer_desc: "Halo-protected engineer companies can remove obstacles under enemy fire that ordinary engineer units cannot handle. Deploying halo engineers on the battlefield can significantly enhance the combat effectiveness of standard halo infantry during trench and urban warfare."
 kivotos_dron: "Kivotos Drone"
 kivotos_dron_desc: "Drones operated by Kivotos."
 repeater_battalion: "Signal Relay Company"
 repeater_battalion_desc: "A signal relay company equipped with extensive computing devices and signal repeaters. It operates massive antennas designed to receive broadband communication signals from the Central Frame."
 #Armored Division#
 decagrammaton_armor: "Prophet of Decagrammaton"
 decagrammaton_armordesc: "A colossal automated mechanical construct."
 #Equipment#
 kivotos_infantry_equipment: "Mystic Weaver"
 kivotos_infantry_equipment_short: "Mystic Weaver"
 kivotos_infantry_equipment_0:0 "Incomplete Mystic Weaver"
 kivotos_infantry_equipment_0_short:0 "Incomplete Mystic Weaver"
 kivotos_infantry_equipment_1:0 "Mystic Weaver"
 kivotos_infantry_equipment_1_short:0 "Mystic Weaver"
 kivotos_infantry_equipment_2:0 "Advanced Mystic Weaver"
 kivotos_infantry_equipment_2_short:0 "Advanced Mystic Weaver"
 kivotos_infantry_equipment_desc: "A completed Mystic Weaver developed to compensate for the severe shortage of mystic energy after Kivotos was transferred to another world by the Great Transference phenomenon."
 kivotos_infantry_equipment_0_desc: "A prototype Mystic Weaver. While its performance falls short of theoretical expectations, it possesses the capability to generate mystic energy."
 kivotos_infantry_equipment_1_desc: "A completed Mystic Weaver developed to address the severe lack of mystic energy after Kivotos was transferred to another world by the Great Transference phenomenon. It was primarily developed under the leadership of Shirai​shi Utaha of Millennium and Yakushi Saya of Shan Hai Jing, and is also known as the equipment that saved Kivotos during the crisis of defeat."
 kivotos_infantry_equipment_2_desc: "A highly advanced Mystic Weaver that utilizes greater quantities of Pyroxenes to manifest mystic power surpassing that of Kivotos itself, granting the user the uncanny sensation of receiving assistance from an unseen ally."
 decagrammaton_equipment: "Prophet Components"
 decagrammaton_equipment_0: "Prophet Components"
 decagrammaton_equipment_desc: "Components used in the massive mechanical constructs operated by Decagrammaton. These colossal machines, known as 'Prophets,' possess an extremely unusual operational system."
 kivotos_dron_equipment: "Kivotos Drone Equipment"
 kivotos_dron_equipment_0: "Drone Equipment"
 kivotos_dron_equipment_desc: "Equipment used by drones operated in Kivotos."
 kivotos_dron_equipment_1: "Enhanced Drone Equipment"
 kivotos_dron_equipment_1_desc: "Equipment used by drones operated in Kivotos. By improving remote control range and incorporating various infantry cooperation interfaces, they can now conduct more proactive and flexible operations."
 modern_infantry_equipment:0 "Near-Future Infantry Equipment"
 modern_infantry_equipment_desc:0 "Infantry equipment modeled after Kivotos's futuristic gear, recreated using Pyroxenes to replicate advanced materials such as plastics and synthetic resins."
 juggernaut_equipment:0 "Juggernaut Equipment"
 juggernaut_equipment_0:0 "Juggernaut Equipment"
 juggernaut_equipment_desc:0 "Some nations rejected the inhumane measures required by artificial halo technology, such as the conscription of student soldiers or forced five-year life limits. Instead, they pursued a more ethical mystic infantry program, resulting in the creation of the Juggernaut suit—an exoskeleton ballistic suit infused with mystic energy. While it rapidly consumes the user's calories and is influenced by the operator's physical ability, it has been confirmed to cause no health problems and is therefore widely adopted. Overall it offers combat performance comparable to artificial halo infantry, though its production cost is roughly three times higher, making large-scale deployment difficult."

 syemmata_railway_gun: "Syemmata-Class Railway Gun"
 syemmata_railway_gun_equipment: "Syemmata-Class Railway Gun"
 syemmata_railway_gun_equipment_short: "Syemmata-Class Railway Gun"
 syemmata_railway_gun_equipment_desc: "This enormous weapon, a testament to the cooperation between Gehenna and Abydos, possesses unparalleled destructive force and exceptional precision within a 500 km strike radius—an ideal asymmetric strategic weapon that will grant our nation overwhelming dominance."
 syemmata_railway_gun_equipment_1: "Syemmata-Class Railway Gun"
 syemmata_railway_gun_equipment_1_short: "Syemmata-Class Railway Gun"
 syemmata_railway_gun_equipment_1_desc: "This enormous weapon, a testament to the cooperation between Gehenna and Abydos, possesses unparalleled destructive force and exceptional precision within a 500 km strike radius—an ideal asymmetric strategic weapon that will grant our nation overwhelming dominance."
 ABY_syemmata_railway_gun_equipment_1: "Syemmata Railway Gun"

 BA_sp_mystic_syemmata_railway_gun: "Syemmata-Class Railway Gun"
 ABY_BA_sp_mystic_syemmata_railway_gun: "Syemmata Railway Gun"
 BA_sp_mystic_syemmata_railway_gun_desc: "This enormous weapon, a testament to the cooperation between Gehenna and Abydos, possesses unparalleled destructive force and exceptional precision within a 500 km strike radius—an ideal asymmetric strategic weapon that will grant our nation overwhelming dominance."

 UCAV: "Unmanned Aerial Vehicle"
 UCAV_equipment: "Attack UAV"
 UCAV_equipment_desc: "Designed using Pyroxene-based semiconductors and power systems, these high-altitude attack UAVs require no human pilot and can conduct ground strikes from beyond the observable sky."
 UCAV_equipment_0: "UAV"
 UCAV_equipment_0_desc: "Designed using Pyroxene-based semiconductors and power systems, these unmanned aerial vehicles require no human pilot and can conduct ground strikes from beyond the observable sky."
 UCAV_equipment_1: "Attack UAV"
 UCAV_equipment_1_desc: "Designed using Pyroxene-based semiconductors and power systems, these high-altitude attack UAVs require no human pilot and can conduct ground strikes from beyond the observable sky."

 category_railgun: "All Railguns"
 railgun_equipment: "Towed Railgun"
 railgun_equipment_short: "Railgun"
 railgun_equipment_desc: "Railguns have significantly longer reload times and much slower firing readiness compared to traditional field artillery. In exchange, they possess the capability to deliver a single projectile at extreme velocity with perfect accuracy."
 railgun_equipment_1: "Towed Railgun"
 railgun_equipment_1_short: "Railgun"
 railgun_equipment_1_desc: "Railguns have significantly longer reload times and slower sustained fire rates compared to traditional field artillery. In exchange, they possess the capability to deliver a single projectile at extreme velocity with perfect accuracy."
 railgun_equipment_2: "Advanced Railgun"
 railgun_equipment_2_desc: "Dedicated railgun fragmentation munitions have greatly increased anti-personnel firepower. In situations requiring infantry suppression, shells that split into thousands of fragments are employed."
 railgun: "Railgun Support"
 railgun_desc: "“Sensei said this is a strategic support asset… but if we fire it just once, the whole battlefield might disappear!”"
 railgun_brigade: "Railgun"
 railgun_brigade_desc: "A specialized artillery formation built around high-energy electromagnetic railgun systems capable of precision long-range strikes."
 mot_railgun_brigade: "Truck-Towed Railgun"
 mot_railgun_brigade_desc: "A mobile railgun unit transported by heavy trucks, allowing rapid redeployment of high-energy electromagnetic artillery across the battlefield."
