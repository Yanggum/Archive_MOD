l_english:
  
  BA_SL_open_button_tt: "Cities and Landmarks of §Y[THIS.GetSLName]§!"

  SL_customname_Trinity_Heart: "Heart of Trinity"
  state_lore_name.1: "Eden, the Millennial Capital"
  state_lore_desc.1: "\nOn the day the First Council was held, all factions of Trinity were unified into one. To commemorate this, a new city was established: Eden. Named after paradise, this city soon became the center of Trinity, serving as a sanctuary and a bulwark for students throughout the ages. Even today, Eden is respected as the core city of Trinity.[Statelore_Get_trinity_heart_trk_path_desc]\n"
  state_lore_desc.1_TRK: "\n\nEven after Misono Mika, Eden continues to function as the heart of Trinity. Though destroyed, scarred, and collapsed, Eden has risen once again. Its indomitable appearance serves as a pillar of hope and courage for the students of Trinity. The sight of Eden recovering amidst crisis is a symbol that Trinity will never fall."

  state_lore_name.2: "[Statelore_Get_gehenna_centre_name]"
  state_lore_desc.2: "\n[Statelore_Get_gehenna_centre_desc]\n"
  state_lore_name.2_normal: "Heart of Gehenna"
  state_lore_desc.2_normal: "The Gehenna Central District relatively escaped the devastation of the Great Transfer. While various problems often arise due to the free-spirited students, fortunately, most of them occur at a distance from the Central District.\n\nHistorical records of Gehenna are scarce, so it is unknown when the Central District was formed, or whether it was a planned city or one that grew naturally over time. Nevertheless, the buildings in the Central District are quite sophisticated and withstand the commotions caused by Gehenna students without collapsing easily.\n\nThis is where the headquarters of Pandemonium Society and the Prefect Team are located. However, the situation changed significantly due to the conflict between the two sides that flared up after the Great Transfer. As the Prefect Team moved its power base toward the Gehenna South District, the Prefect Team headquarters, once located in the Central District, now remains half-abandoned."
  state_lore_name.2_TRN: "The Second Heart of Trinity"
  state_lore_desc.2_TRN: "After the decisive battle at Eden, Gehenna knelt before Trinity, and the banner of victory flew high. Gehenna-style buildings were demolished one by one, and new structures built in Trinity's unique style are taking their place. The once-grand Pandemonium Society headquarters was destroyed and can now only be seen in historical video records.\n\nThere were Gehenna students who tried to continue the resistance. However, their will was repeatedly broken by the Justice Task Force, militias composed of Trinity students, and the Vigilante Crew. Under the name of order, their breath was gradually stifled, and they were eventually forced into submission.\n\nStreets that were once lawless zones saw their security restored, and Trinity students began to settle in the Central District. The former center of Gehenna is gradually being erased from history, and its place is now being painted over with the name of Trinity General High School. This place will soon be called by a new name.\n\nAnd in that moment, the name Gehenna was fading from memory, and the future of the students was sinking deeper into darkness under the authority of Trinity."

  state_lore_name.3: "Millennium Tower"
  state_lore_desc.3: "\nMillennium Tower was constructed under a thorough plan from the beginning. This architectural marvel, concentrating Millennium's technological prowess, and the surrounding city were operated based on full automation, once regarded as the symbol of a cutting-edge city.\n\nHowever, the situation changed after the Great Transfer. The power of the automated city gradually depleted, and Earth's resources were inefficient in supporting Kivotos's technological systems. Eventually, the massive Millennium, composed of giant mechanical devices, faced the risk of coming to a halt.\n\nDuring this period, the war with France came as a great ordeal. Millennium had to resist even while consuming its existing stockpiles of resources, and Millennium's cities suffered heavy damage.\n\nDespite this, Millennium Tower is still in operation. Although it is an unstable situation where it is unknown when it might stop, the massive city still maintains its own system and continues to move.\n"
  
  state_lore_name.4: "Sanctum Tower"
  state_lore_desc.4: "\nBuilt in the capital of Kivotos, it is completely unknown who built the Sanctum Tower or for what purpose. Under the control of the General Student Council, the tower 'used to' automatically manage public facilities, social infrastructure, and academies across Kivotos, just like its name suggests. At least until the General Student Council lost control of the Sanctum Tower.\n\nThe control rights for this mysterious Sanctum Tower are held only by the President of the General Student Council. Although it managed the daily lives of thousands of academies, the secrets of this mysterious tower are unlikely to be revealed as the General Student Council's control became meaningless after the Great Transfer and each academy established its own system.\n\nDespite being located in the center of the Utnapishtim Special District, the area around the Sanctum Tower is quiet with few people passing by, and standing before it, one is even overwhelmed by an inexplicable sense of grandeur.\n"
  
  state_lore_name.5: "Problem Solver Office"
  state_lore_desc.5: "\nThe Problem Solver Office is the headquarters of 'Problem Solver 68,' one of Kivotos's major clubs, and before the Great Transfer, it was located in a modern building. Following the chaos immediately after the Great Transfer and the burning of the old office, the Grand Ducal Palace of the Grand Duchy of Luxembourg has now become the office of Problem Solver.\n\nThe Grand Ducal Palace of Luxembourg was originally built as the city hall of Luxembourg City during the Renaissance, but its purpose was changed to a new palace for the Grand Ducal Family of Luxembourg in 1890.\n\nThe beautiful Gothic-style office of the Grand Ducal Palace has become the Problem Solver office led by Aru. Compared to its time as a Grand Ducal Palace, the exterior has hardly changed, but the interior is filled with secret documents for Problem Solver 68's company business and duties as the regent of the Grand Duchy.\n\nThe 'work' space of the palace was converted into Problem Solver 68's office and reception room, but the private spaces of the palace where the Grand Ducal family lived their daily lives are not being used at all. Immediately after the Great Transfer, Grand Duchess Charlotte, her husband, and their children, who were not even ten years old, were all shot to death in the palace bedroom by Gehenna rioters who came to loot precious metals. Aru keeps the urns of Grand Duchess Charlotte and her family in the old bedroom and instead commutes from a cramped boarding house 15 minutes away from the palace. The private spaces of the Grand Ducal family, such as the bedrooms and dining room, are only cleaned daily by Rikuhaichima Aru's orders and are not used by the employees of Problem Solver 68.\n\nCynics mock Aru, saying she sleeps fitfully on a hard sofa in a boarding house because she fears the ghosts of the dead Grand Ducal family instead of the spacious beds. However, those who know her well say she is simply leaving the space empty out of respect for the murdered Grand Ducal family. The truth of the matter will probably never be revealed.\n"

  state_lore_name.6: "[Statelore_Get_Abydos_highschool_name]"
  state_lore_desc.6: "[Statelore_Get_Abydos_highschool_desc]"
  state_lore_name.6_normal: "Abandoned Ruins"
  state_lore_desc.6_normal: "\nAfter Abydos withdrew due to the invasion of Shanhaijing and Hyakkiyako, the building remained as an empty house without an owner. Lights no longer leaked through the windows, and only the wind brushed past the old walls. However, that did not mean it was completely abandoned. This was because a cleaning company regularly visited to dust and wipe the window frames.\n\nPeople questioned this maintenance. They wondered why anyone would bother keeping an empty house tidy. However, after the Genryumon issued an official notice saying, \"Do not argue about that matter,\" all rumors and curiosity soon vanished.\n\nAs if waiting for a returning owner, the building stands in a corner of the city, silently grooming itself. That silence feels like a premonition of footsteps that will return one day.\n"
  state_lore_name.6_abydos_own_state: "Abydos Main School"
  state_lore_desc.6_abydos_own_state: "\nAfter Abydos reclaimed its old home, they were somewhat surprised. The place was being maintained flawlessly by someone.\nIn fact, since dilapidated facilities had been repaired and water and electricity were connected, the coalition government decided to use this place for a different purpose than originally intended.\n\nAfter Horn was decided as the capital of the coalition government, the alma mater of Abydos High School officially became the Karlovy Vary 2nd Annex, and this, the Abydos High School 1st Annex, was converted into an annex of the Horn government, becoming the center of administration, politics, and integration for the coalition government.\n\nThough in a slightly different direction, the high school building, which has regained its vitality, has regained its harmonious and stable atmosphere, though the cries of those working overtime are occasionally heard.\n\nAnd in fact, since some of the remaining educational areas have become places to care for and educate the children of the resident personnel, it could be said that it hasn't lost its original purpose either.\n"
  state_lore_name.6_nothing: "Horn Downtown"
  state_lore_desc.6_nothing: "\nHorn, where various cultures of South Kivotos coexist, was... no, §R-REDACTED-§!'s center§R-REDACTED-§!.\nAlthough it lost its position as the center, Horn still functions as a major city of South Kivotos.\n"

  state_lore_name.7: "[86.GetCapitalVictoryPointName]"
  state_lore_desc.7: "\nBasis Schola was originally the Polish city of Poznań. It was a place steeped in history and culture from the Middle Ages, but now it has turned into a land where the headquarters of the Remedial Knights is established and the shadow of Trinity is cast.\n"

  state_lore_name.8: "[763.GetCapitalVictoryPointName]"
  state_lore_desc.8: "\nResistance in Königsberg was not fierce. As siege and shelling continued, the city's walls quickly collapsed. As the German army surrendered and the state government raised the white flag, Trinity finally took full possession of this land.\n\nHowever, as a price, Königsberg was left with deep scars. The city, once called the spiritual capital of the Germans, was destroyed, and Trinity is writing a new history upon its ruins. The restoration project aims to revive the ruins while simultaneously erasing the names of the past. Now, this place is no longer called Königsberg. Trinity is opening a new era by overwriting it with its own unique name, Kimigiyama.\n"
  
  state_lore_name.9: "Vice City"
  state_lore_desc.9: "\nThe glory of the 30s, when everything was overflowing, has already passed. However, Vice City is still the capital of pleasure, living off the French sun and revelry. This city embraces French charm, bustle, and the greed hidden within, throwing endless stories to the people.\n\nAt Ocean Beach, hotels decorated in pastel tones show off as if they were art galleries themselves, and the white sandy beach shines as if forcing its brilliance under the sun. In Little Cuba, the savory smell from lively bakeries tempts people, but the inner workings are as sharp as the eyes of a merchant chasing profit.\n\nAt the Tisha Waka Flea Market, knock-off brands greet customers with expressions saying they're 'more real than the real thing,' somehow revealing the true essence of this city. And in the Port of Vice City, called the cruise capital of the world, luxurious ships are lined up, openly displaying the romance of elegant travel on one side and the weight of money on the other.\n\nVice City is still glamorous, still funny, and at the same time, somehow bittersweet. Here, even the sun shines as brilliantly as a tourist's wallet.\n\n§OVice City Baby!§!"

  state_lore_name.10: "[Statelore_Get_Abydos_homeschool_name]"
  state_lore_desc.10: "[Statelore_Get_Abydos_homeschool_desc]"
  state_lore_name.10_normal: "Giant Sand Pile"
  state_lore_desc.10_normal: "\nIt was a historic Hungarian city where the tributaries of the Danube met, but after the Great Transfer, it was placed under the shadow of a giant sand mountain. Despite the catastrophe of the northwestern region being buried in sand, numerous adventurers and corporations flocked here to mine 'Pyroxenes' and ancient artifacts flowing from the mountain, achieving distorted development. The city maintains a precarious balance where the threat of sandstorms and the dream of striking it rich coexist. In the mining sites where government control does not reach, incidents and accidents occur daily, but the temptation of the blue light spat out by the sand mountain is constantly drawing people to this dangerous city."
  state_lore_name.10_abydos_own_state: "Abydos Main Building"
  state_lore_desc.10_abydos_own_state: "\nA cutting-edge future city built where the sand mountain disappeared, and a sacred site for the Abydos Federation. In the new northwestern district developed along with the reconstruction of the main building, skyscrapers and modern infrastructure concentrating Kivotos's overtechnology have been established, and Győr has become a developed city at the highest level of the Federation. With the core functions of politics, economy, and technology concentrated around the Abydos main building, it serves as the practical second capital of the Federation. The place where the sand, once a disaster of the past, was cleared has now become a symbol of hope and prosperity, transformed into a vibrant metropolis where pilgrims wishing to visit the main building and those wishing to learn cutting-edge technology gather."
  state_lore_name.10_nothing: "Győr Plains"
  state_lore_desc.10_nothing: "\nA wide plain spreading to the northwest of Győr.\nA massive industrial district is being constructed on the large site where the sand mountain originally was, and it will become the new heart of East Kivotos.\n...The §R-REDACTED-§! that was inside the sand mountain is being used as §R-REDACTED-§! §R-REDACTED-§! §R-REDACTED-§! material for the new city construction §R-REDACTED-§! §R-REDACTED-§!\n§R...High-quality sand helped in the mass production of silicon.§!"

  state_lore_name.11: "[51.GetCapitalVictoryPointName]"
  state_lore_desc.11: "\nEssen, which was nothing more than a small mining town, grew rapidly along with the Krupp enterprise after the Industrial Revolution. After German unification, it reached its peak as a core military industrial city of the Empire.\n\nHowever, defeat in the Great War greatly weakened Essen. The city's vitality disappeared and its industrial base was shaken. But with the emergence of Hitler, Essen once again walked the path of rapid growth. As the military industry was restarted for war preparations, the city seemed to regain its past glory. It had to be so. At least until the Gehenna Academy appeared.\n\nGehenna Academy conquered Essen by force, and the city was destroyed in the process of fierce combat. Even the Krupp headquarters building, the symbol of Essen, turned to ashes. Gehenna, having achieved victory, named this city obtained as war booty Gehenna West District. The glory of the past disappeared into history, and the name Essen became that of the new conqueror."

  state_lore_name.12: "[52.GetCapitalVictoryPointName]"
  state_lore_desc.12: "\nDue to the influence of the Gehenna Prefect Team, which maintained a strict distance from the locals and sought to maintain social order, the citizens of Munich are living lives almost similar to those before the Great Transfer. Immediately after the Great Transfer, the administrative district name was changed to 'Gehenna South District' on the grounds that a part of the southern region of the Gehenna Central District was fragmented and transferred, but to the citizens, this place was always Munich, and will always be Munich.\n\nMany call Munich a 'city of culture.' After the Great Transfer, as Prefect Team Leader Sorasaki Hina envisioned Gehenna's future as an 'academy of art,' the city's cultural prosperity developed further.\n\nJugendstil, a progressive art movement that had declined due to the Great War of 1914, began to revive in Munich, and literary figures, including the world-renowned playwright Bertolt Brecht, are gathering in Munich. However, it is not yet known whether this city will be able to stand independently as a prosperous center of art in peace, or if its pen will eventually be broken in the whirlwind of war and violence."
