  l_english:
  
  BA_SL_open_button_tt: "§Y[THIS.GetSLName]§!의 도시와 랜드마크"

  SL_customname_Trinity_Heart: "트리니티의 심장"
  state_lore_name.1: "천년수도 에덴"
  state_lore_desc.1: "\n먼 옛날, 제1차 공의회가 열렸던 날, 세상의 모든 분파가 하나로 통합되었습니다. 이 역사적인 순간을 기리기 위해 새로운 도시가 설계되었으니, 그 이름은 바로 에덴. 낙원의 이름을 딴 이 도시는, 마치 천국의 한 조각이 지상에 내려앉은 듯한 모습을 하고 있습니다. 그 후 수세기 동안, 에덴은 트리니티 학생들의 성스러운 안식처이자, 든든한 방패로서의 역할을 해왔습니다.\n\n에덴은 트리니티의 심장부로서, 언제나 그 역할을 묵묵히 수행해 왔습니다. 이곳의 풍경은 마치 고대의 신들이 빚어낸 작품처럼 눈부시며, 도시를 둘러싼 자연의 아름다움은 누구라도 숨을 멎게 만들 만큼 경이롭습니다. 이 경이로움 덕분에 에덴은 많은 이들에게 사랑받는 관광 명소가 되었고, 그 명성은 세월이 흘러도 여전히 빛을 잃지 않았습니다. 에덴은 여전히, 그 자리에서 묵묵히 시간의 흐름을 지켜보고 있습니다.\n"

  state_lore_name.2: "게헨나의 심장"
  state_lore_desc.2: "\n게헨나 중앙구는 타오르는 용암의 붉은빛을 닮은 건물들과 어둠의 심연에서 솟아오른 듯한 검은색 구조물들이 뒤엉킨 곳입니다. 그 뒤에는 언제나 뜨거운 숨결을 내뿜는 활화산이, 도시의 불타오르는 심장을 상징하듯 우뚝 서 있습니다. 가끔씩 들려오는 총성은 이곳의 불안한 숨결을 대변하며, 긴장과 불안을 자아냅니다. 그러나 이 혼란 속에도 선도부의 치안 유지 활동 덕분에, 타구와 비교할 때 비교적 안정을 찾은 모습입니다. 그럼에도 이곳은 여전히 끊임없이 움직이고, 살아 숨 쉬는 생명체처럼 분주합니다.\n\n동아리 간의 갈등은 여전히 이글거리는 불씨처럼 중앙구 곳곳에서 꿈틀거리고, 소란스러운 사건들은 마치 억누르기 힘든 폭풍우처럼 언제든지 터져 나올 기세입니다. 무질서와 혼돈이 이 도시의 뼛속 깊이 박혀 있지만, 그 악명만큼이나 위험한 곳은 아닙니다. 다만, 이곳의 불안한 에너지는 언제나 주변을 감돌며, 이 도시를 지배하는 듯한 느낌을 줍니다.\n\n많은 학생들이 이 불안정한 환경 속에서 학업에 매진하고 있습니다. 특히 2관 교사로 몰려드는 이들은 마치 이글거리는 용광로 속에서 단련되는 강철처럼, 학문의 깊은 심연으로 빠져들며 자신만의 길을 찾기 위해 고군분투하고 있습니다.\n\n해가 서서히 지고, 달이 중앙구 위로 떠오르면, 도시는 또 다른 모습을 드러냅니다. 낮의 소란은 잠잠해지고, 밤하늘의 별들은 마치 고요한 바다의 잔물결처럼 이 도시를 부드럽게 비춥니다. 건물들은 하루 동안의 소란스러움을 뒤로 한 채, 이제는 조용히 속삭이며 각자의 이야기를 나누기 시작합니다. 이 고요한 대화에 주변의 생명체들 역시 은밀하게 동참하며, 어두운 밤 속의 은밀한 삶을 드러냅니다.\n\n밤이 깊어갈수록 어둠은 중앙구를 부드럽게 감싸 안고, 하루의 끝을 고요하게 알립니다. 그러나 이 도시가 완전히 잠들지는 않습니다. 새벽이 오면 다시금 불빛들이 하나둘씩 깨어나고, 중앙구는 또 다른 하루를 맞이할 준비를 합니다. 불안과 도전 속에서도, 게헨나 중앙구는 여전히 게헨나의 심장부로서의 역할을 묵묵히 이어가고 있습니다. 그 영향력은, 마치 활화산의 용암처럼 누구도 부정할 수 없는 강렬함으로 뻗어나가고 있습니다.\n"

  state_lore_name.3: "밀레니엄 타워"
  state_lore_desc.3: "\n밀레니엄 중앙 캠퍼스는 미래의 청사진을 현실로 구현한 곳입니다. 이곳은 단순한 도시가 아닌, 밀레니엄 학생들의 꿈과 희망이 살아 숨쉬는 공간입니다. 밀레니엄 타워를 중심으로 펼쳐진 이 미래 도시는 인류의 무한한 가능성을 상징하며, 기술과 인간의 조화로운 공존을 보여줍니다.\n\n최첨단 기술의 정수가 집약된 이곳에서는 모든 것이 마치 정교한 시계 톱니바퀴처럼 정밀하게 맞물려 돌아갑니다. 거리를 걸을 때마다 느껴지는 미래의 숨결은 방문객들을 미지의 세계로 안내합니다. 특히 환경 문제에 대한 혁신적인 해결책들은 이 도시를 지속 가능한 낙원으로 만들어주고 있습니다.\n\n밤이 되면 밀레니엄은 또 다른 얼굴을 드러냅니다. 하늘의 고리와 어우러진 야경은 마치 별들이 지상에 내려온 듯한 환상적인 광경을 연출합니다. 이 빛의 향연은 보는 이들의 마음에 깊은 감동을 선사하며, 미래에 대한 희망을 품게 합니다.\n\n그러나 밀레니엄의 진정한 아름다움은 첨단 기술과 자연의 조화에서 찾을 수 있습니다. 철저한 계획 속에서도 자연의 숨결을 잃지 않았기 때문입니다. 미개발 지역을 의도적으로 보존하여 학생들이 언제든 자연의 품으로 돌아갈 수 있게 했습니다. 이는 마치 과거와 미래가 한 곳에서 만나는 듯한 독특한 경험을 제공합니다.\n\n히가시알프스는 이러한 밀레니엄의 철학을 가장 잘 보여주는 곳입니다. 이 웅장한 산은 단순한 지형이 아닌, 도전과 극복의 상징으로 서 있습니다. 정상에 오르면 눈 아래로 펼쳐지는 미래 도시의 파노라마는 마치 시간여행을 하는 듯한 착각을 불러일으킵니다. 이는 많은 학생들과 방문객들에게 잊지 못할 감동을 선사합니다.\n\n밀레니엄 사이언스 스쿨은 비록 역사는 짧지만, 그 영향력은 시간을 초월합니다. 이곳은 단순한 학교가 아닌, 미래를 향한 인류의 여정을 상징하는 등대와 같은 존재입니다. 첨단 기술과 자연의 조화, 그리고 끊임없는 혁신을 통해 밀레니엄은 키보토스의 미래를 밝히는 빛이 되어가고 있습니다.\n"
  
  state_lore_name.4: "생텀 타워"
  state_lore_desc.4: "\n키보토스의 정중앙에 세워져 있는 생텀 타워는 누가, 어떤 목적으로 만들었는지 전혀 알려지지 않았습니다. 타워는 총학생회의 통제 하에 그 이름처럼 키보토스 전역의 공공시설, 사회 인프라와 학원들을 자동으로 관리하고있습니다. \n\n비밀스러움이 많은 이 생텀타워의 현재 제어권은 총학생회장이 가지고 있습니다. 총학생회장의 엄청난 행정 능력으로 생텀 타워의 불은 항상 꺼지지 않고 오늘도 키보토스에 사는 주민들의 일상을 책임지고 있습니다.\n\n생텀타워의 근처는 도심지 중앙에 자리잡고 있음에도 그 주변에 드나드는 사람이 적어 한산하며, 그 앞에 선다면 왠지 모를 웅장한 분위기에 압도되기까지 합니다. \n\n타워의 비밀은 총학생회에서도 극소수의 고위급의 간부만이 알고 있으며, 생텀타워의 내부를 들어가 본 사람 또한 거의 없다고 합니다.\n"
  
  state_lore_name.5: "흥신소 사무소"
  state_lore_desc.5: "\n흥신소 사무소는 키보토스의 주요 동아리 중 하나인 '흥신소 68'의 본부로, 대전이 이전에는 현대적 건축물에 자리잡고 있었습니다. 대전이 직후의 혼란 속에서 옛 흥신소 사무소가 전소된 이후, 현재는 룩셈부르크 대공국의 대공궁이 흥신소의 사무실이 되었습니다.\n\n룩셈부르크 대공궁은 르네상스 시기 룩셈부르크 시의 시청으로 건설되었으나, 1890년에 룩셈부르크 대공가를 위한 새 궁전으로 용도가 변경되었습니다.\n\n고딕 스타일의 아름다운 룩셈부르크 대공궁 집무실은 아루가 주도하는 흥신소 사무실이 되었습니다. 대공궁 시절에 비해 외향은 거의 달라지지 않았지만, 내부에는 흥신소 68 회사 업무와 대공국의 섭정으로서의 직무를 위한 비밀스러운 서류들이 가득합니다.\n\n대공궁의 '업무용' 공간은 흥신소 68의 사무실, 응접실 등으로 개조되었지만, 대공가가 일상 생활을 하던 궁전의 개인 공간은 전혀 사용하고 있지 않습니다. 대전이 직후 귀금속을 약탈하러 온 게헨나 폭도들에 의해 샤를로테 여대공과 그녀의 부군, 그리고 열 살도 되지 못한 어린 자녀들은 궁전 침실에서 모두 총살당했습니다. 아루는 샤를로테 여대공과 그녀의 가족들의 유골함을 옛 침실에 보관해 두고, 대신 대공궁에서 15분 거리에 있는 좁은 하숙집에서 출퇴근을 합니다. 침실, 식당 등 대공가의 사적인 공간들은 리쿠하치마 아루의 지시로 매일 청소만 되고 있을 뿐, 흥신소 68 사원들은 사용하지 않습니다.\n\n냉소주의자들은 아루가 죽은 대공가의 귀신을 두려워해 대공가의 넓은 침대 대신 하숙집의 딱딱한 소파에서 새우잠을 잔다며 조롱합니다. 하지만 그녀를 잘 아는 사람들은 아루가 살해당한 대공가에 대한 존중의 의미로 그 공간을 비워두고 있을 뿐이라 말합니다. 진실이 무엇인지는 아마 밝혀지지 않을 것입니다.\n"

  
  state_lore_name.6: "버려진 폐허"
  state_lore_desc.6: "\n산해경과 백귀야행의 침공으로 아비도스가 철수한 이후, 그 건물은 주인 없는 빈집으로 남게 되었습니다. 창문 너머로는 더 이상 불빛이 새어 나오지 않았고, 오래된 벽에는 바람만이 스쳐 지나갔습니다. 그러나 그렇다고 해서 완전히 버려진 것은 아니었습니다. 정기적으로 청소업체가 드나들며 먼지를 털고 창틀을 닦았기 때문입니다.\n\n사람들은 이러한 관리에 의문을 품었습니다. 아무도 살지 않는 집을 굳이 단정히 가꾸는 이유가 무엇인지 궁금해했습니다. 그러나 현룡문에서 \"그 일에 대해 왈가왈부하지 말라\"는 공문을 내린 이후, 모든 소문과 호기심은 곧 사라졌습니다.\n\n그렇게 건물은 다시 찾아올 주인을 기다리는 듯, 묵묵히 몸단장을 하며 도시의 한구석에 서 있습니다. 그 적막은 언젠가 돌아올 발걸음을 예감하는 침묵처럼 느껴집니다.\n"
  state_lore_name.6_abydos_own_state: "아비도스 본교"
  state_lore_desc.6_abydos_own_state: "\n아비도스가 옛 터전을 탈환한 이후, 그들은 다소 놀랐습니다. 그곳은 누군가에 의해 흠 잡을 부분 없이 관리되고 있었습니다. \n오히려 낙후된 시설이 보수되거나 수도관, 전기 등도 연결되어 있었기에 연립정부는 이곳을 당초와는 다른 목적으로 이용하기로 했습니다.\n\n연립정부의 수도가 호른으로 결정된 이후, 공식적으로 아비도스 고등학교의 모교는 카를로비바리 제2분관이 되었으며 이곳, 아비도스 고등학교 제1분관은 호른 정부의 별관으로 개조되어 연립정부의 행정, 정치, 통합의 중심지가 되었습니다.\n\n조금 다른 방향이지만 활기를 되찾은 고등학교 건물은, 가끔 야근하는 이들의 곡소리가 들리기도 하지만 다시 그 화목하고 안정감 있는 분위기를 되찾게 되었습니다.\n\n그리고 사실, 남은 몇몇 교육용 구역은 상주인원들의 자녀들을 돌보고 교육하는 곳이 되었으니 그 본 목적을 잃은 것도 아니라고 하겠습니다.\n"