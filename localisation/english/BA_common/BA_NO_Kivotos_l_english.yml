 # Confederate States
 CSA_eugene_talmadge: "Eugene Talmadge"
 CSA_absolutly_dixie: "Anti-Federal Southern Nationalist"
 CSA_eugene_talmadge_desc: "It has been less than 100 years since the proud South was divided and Richmond fell, only to be occupied by the vile Northern oppressors. America's continuous economic crisis and the oppression of the South have once again reminded Southerners of the spirit of the Confederacy, resulting in the Southern states seceding from the Union and resolving for independence. And like Jefferson Davis, Georgia's Talmadge has been inaugurated as the President of the Confederate States. This was possible entirely because he never forgot Southern values.\n\nBorn in Georgia as the son of a poor farmer, Eugene Talmadge grew up to enter politics after working as a lawyer and for agricultural journals. He captivated farmers and the white lower class with his rough rhetoric and inflammatory speeches, always calling for a true South free from Federal interference. Even amidst the pain of the Great Depression, he fiercely opposed the New Deal, calling it the 'Washington chains that oppress freedom,' and instead advocated for strengthening state government power and protecting Southern farmers. Southern farmers feel that Talmadge is the only spokesperson who represents their interests in the worsening situation.\n\nThe rule of the Talmadge administration is characterized by extreme nationalism and economic populism, while emphasizing Southern traditions and denying Federal authority. Backed by an enthusiastic support base of Southern whites, Talmadge will do his best to ensure that the bitter history of the past is not repeated."

