 # East Africa 
 ENG_eastern_african_unification: "Aspiration for East African Unification"
 ENG_eastern_african_unification_desc: "The concept of a unified East African Community has surfaced. Many intellectuals argue for the necessity of a community for joint cooperation in food, industry, economy, and security in East Africa."
 ENG_EA_economy: "East African Unified Economy"
 
 # Egypt
 EGY_Binah: "Monster of the Desert"
 EGY_Binah_desc: "The invasion of unknown entities was previously thought to be limited to Europe. However, rumors have recently persisted that an unknown monster has appeared in the Egyptian desert. Authorities are controlling access to the desert and searching it to confirm the truth of these rumors."

 # Soviet Union
  # National Spirits
 BA_SOV_toward_warsaw: "Marching Song Toward Warsaw"
 BA_SOV_toward_warsaw_tt: "This §YNational Spirit§! is §Genhanced§! up to §Y3§! times every §Y240 days§!."
 BA_SOV_support_kriegsmarine: "Kriegsmarine Support"
 BA_SOV_supporting_kriegsmarine: "Red Navy Support"
 BA_SOV_massive_isolation: "Great Isolation"
 BA_SOV_massive_isolation_desc: "Europe has been consumed by the great furnace of the Great Transfer, and the air our machines breathe has scattered with the ashes. Across the ocean, the United States has turned us away with a cold silence.\n\nCurrently, the Kivotos forces, represented by the General Student Council, have opened their trade routes to the 'Cordon Sanitaire' of Poland and Romania, tightening their grip on Mother Russia. To the north, the false prophets of Red Winter have summoned the phantom of Trotsky onto the snowy plains of Norway. Only the terrible hybrid of the New Left and Trotskyism remains there, baring its teeth at the motherland.\n\nHowever, the Red Star of the Union burns even redder through trials. To complete the Five-Year Plan, we will break through this brutal economic blockade. Under the banner of the Soviets, with the indomitable will of the people!"
  # Opinion Modifiers
 BASOV_anti_kivotos_policies_good: "Anti-Kivotos Policy"
 BASOV_anti_kivotos_policies_bad: "Anti-Kivotos Policy"
  # Focuses
 SOVEX_armed_protest_on_baltic: "Baltic Armed Demonstration"
 SOVEX_armed_protest_on_baltic_desc: "The people of [LIT.getadjective], [LAT.getname], and [EST.getname] are groaning under authoritarian oligarchy. To crush the capitalistic dictatorships oppressing them and liberate the working masses, we must rehearse liberation operations against them."
 SOVEX_operation_on_black_sea: "Operation in the Black Sea"
 SOVEX_operation_on_black_sea_desc: "Naval forces from [ROM.getadjective] and [TUR.getadjective] are threatening our sea lines of communication in the Black Sea. We must establish our dominance in the Black Sea by launching coastal landings against them."
 BA_SOV_armed_protest_modifier: "Offensive Plan"
 SOVEX_Helsinki_secret_treaty: "Helsinki Secret Pact"
 SOVEX_Helsinki_secret_treaty_desc: "A secret agreement for the sake of the Great Purge—I mean, the Great Cleaning! No one must know what we discussed over snacks. No counter-revolutionaries allowed! — Cherino"
 SOVEX_overthrow_the_Holy_League: "Overthrow the 'Holy Alliance'"
 SOVEX_overthrow_the_Holy_League_desc: "The 'Holy Alliance,' originally formed by monarchs of the old world to stop the French Revolution, is being reconstituted to crush our revolution. We can no longer tolerate such counter-revolutionary actions from Western nations. We must cut off their threat with a preemptive strike!"
 SOVEX_eastern_bloc: "'Eastern Bloc'"
 SOVEX_red_scandinavia: "Northern Offensive"
 SOVEX_day_of_shame: "Day of Shame"
 SOVEX_reduce_authority_of_secretariat: "Reduction of Secretariat Authority"
 SOVEX_red_revenge: "Red Revenge"
 SOVEX_second_western_offensive: "Second Western Offensive"
 SOVEX_second_western_offensive_desc: "With the fall of Warsaw, Poland's defiance has come to an end. As the collapse of Western hegemony accelerates, the fires of revolution are igniting among the peoples of all nations. They now long for the arrival of the Red Army. The great road to the west has opened, and the Red Army is ready to answer the call of history."


 SOVEX_anti_kivotos_policies: "Anti-Kivotos Policy"
 SOVEX_anti_kivotos_policies_desc: "Peaceful coexistence with the Kivotos academies is impossible. We must secure as many allies as possible and prepare for the inevitable clash."
 SOVEX_approach_milenium: "Approach Millennium"
 SOVEX_approach_milenium_desc: "There is no reason we cannot reconcile with Millennium. While we may not coexist peacefully forever, they will not be the first to attack us."
 SOVEX_liberate_oppressed_nations: "Liberation of Oppressed Nations"
 SOVEX_liberate_oppressed_nations_desc: "Western powers have oppressed and exploited countless nations for their imperialist interests. This has only intensified since their home territories vanished after the Great Transfer! We must liberate these oppressed peoples so they may determine their own destinies."
 SOVEX_partnership_with_kriegsmarine: "Pressure the Kriegsmarine"
 SOVEX_partnership_with_kriegsmarine_desc: "Cooperation with [GEK.getadjective] is essential for smooth operations in the Baltic. If we cannot cooperate, we must at least ensure they cannot act."
 SOVEX_partnership_with_kriegsmarine_tt: "\nThe §Y[GEK.getname]§! government will §Gpivot§! toward a cautious, neutral §Ypro-[SOV.getadjective] stance§! rather than establishing a §Ymilitary government§! to reclaim the mainland."
 SOVEX_border_force_expansion: "Border Force Expansion"
 SOVEX_border_force_expansion_desc: "With the collapse of Britain, France, and the ruins of Germany left in silence, there is no longer any reason to hesitate. We will move all forces from the East to the West and launch the Red Army's advance. The weight of history demands this moment. In the place where the old powers fell, we must write a new chapter of history."
 SOVEX_subjugation_of_western_allies: "Subjugation of Western Allies"
 SOVEX_subjugation_of_western_allies_desc: "The collapse of the European market has plunged the Western Allies into a massive economic crisis. While their power is slowly crumbling, we stand unshaken. Now we must exert pressure on them to ensure they are no longer an obstacle while our offensive to the west proceeds."
 SOVEX_italy_strategic_alliance: "Strategic Alliance with [ITA.GetAdjective]"
 SOVEX_italy_strategic_alliance_desc: "[ITA.GetAdjective] is an important ally who shares our will amidst the chaos of Europe. Their strategic location and determination will be a great strength in our advance to the west. We will cooperate with [ITA.GetAdjective] to establish a new order within the collapse of the West."
 SOVEX_operatsiya_operation: "Operation: Red Storm"
 SOVEX_operatsiya_operation_desc: "O plains,\nVast plains,\nHeroes advance along the plains.\nYes, the heroes of the Red Army!\nOur horses are swift and our tanks are fast!\n- Polyushko-polye"

 SOVEX_soviet_federation_declaration_of_national_humanism: "United Humanity Declaration"
 SOVEX_soviet_federation_declaration_of_national_humanism_tt: "This National Spirit will temporarily prevent us from participating in any wars if §Y[SOV.GetNameWithFlag]§! begins the §YSecond Western Offensive§!."
 SOVEX_soviet_federation_declaration_of_national_humanism_2: "European Bystander Policy"
 SOVEX_soviet_federation_declaration_of_national_humanism_2_desc: "Soviet propaganda has had such a profound impact on our citizens that it has become impossible for us to stop the Soviet offensive."
 SOVEX_soviet_proposal: "Soviet Proposal"
 SOVEX_soviet_proposal_tt: "This National Spirit will convert into a war goal against major Kivotos nations if §Y[SOV.GetNameWithFlag]§! begins the §YSecond Western Offensive§!."
  # Events
 BA_sov_event.1.t: "Shift in Foreign Policy"
 BA_sov_event.1.d: "The 'Great Transfer' phenomenon in Western Europe, the second war with Poland, and the fall of the Western capitalist powers have forced us to review and rewrite our entire foreign policy plan. The Communist Party and the People's Commissariat for Foreign Affairs are hurriedly drafting a new thesis for diplomacy, which will be heavily reflected in our future foreign policy."
 BA_sov_event.1.a: "It is an unstable era."
 BA_sov_event.1_tt: "§Y$SOV_anti_fascist_policies$§! focus §Rdisabled§!\n§Y$SOV_approach_germany$§! focus §Rdisabled§!\n§Y$SOV_send_military_advisors_to_spain$§! focus §Rdisabled§!\n\n"
 BA_sov_event.3.t: "[SOV.getadjective]-[MIL.getadjective] Trade Agreement"
 BA_sov_event.3.d: "The [SOV.getadjective] ambassador has contacted our diplomats to propose a trade agreement between our two nations. According to the proposal, [SOV.getname] will send us raw materials such as grain, cotton, oil, metallic ores, and rubber. In exchange, [SOV.getadjective] demands appropriate basic scientific knowledge and engineering technology from us.\nThis agreement will certainly be helpful in the war against hostile nations in Kivotos."
 BA_sov_event.3.b: "We shall not share our technology with them!"
 BA_sov_event.4.t: "[MIL.getname] Signs $BA_sov_event.3.t$"
 BA_sov_event.4.d: "The [FROM.GetAdjective] diplomat has informed us that they will accept our proposal. Our nations have now officially entered a trade agreement, where [SOV.GetNameDef] sends raw materials such as grain, cotton, oil, metallic ores, and rubber to [FROM.GetNameDef]. In exchange, we receive basic scientific knowledge and engineering technology.\nThis agreement will surely aid in the development of our modern military technology."
 BA_sov_event.4.a: "It will benefit the Motherland."
 BA_sov_event.5.t: "Pressure from the Red Navy"
 BA_sov_event.5.d: "The [SOV.getadjective] Red Navy is blockading the eastern coast of Gotland and providing us with supplies. While unwelcome, we can utilize their help."
 BA_sov_event.5.a: "It doesn't matter what color the cat is!"
 BA_sov_event.6.t: "[SOV.getadjective] Armed Demonstration"
 BA_sov_event.6.d: "[SOV.getname] forces have recently been organizing frequent armed demonstrations in the Baltic region. Such actions are raising tensions in the area and increasing the risk of military conflict between [SOV.getadjective] and the Baltic states."
 BA_sov_event.6.a: "Overawe them!"
 BA_sov_event.6.b: "Stand against the threat!"
 BA_sov_event.7.t: "[SOV.getadjective] Naval Exercise"
 BA_sov_event.7.d: "[SOV.getname] forces have recently been organizing frequent naval exercises in the Black Sea. Such actions are raising tensions in the area and increasing the risk of military conflict between [SOV.getadjective] and the Black Sea states."
 BA_sov_event.8.t: "Lessons from the Battlefield"
 BA_sov_event.8.d: "As the war continues, we have been able to successfully develop strategies and tactics against [POL.getfactionname]. We can now improve military training and combat readiness based on these lessons."
 BA_sov_event.8.a: "Focus on maintaining the front line!"
 BA_sov_event.8.b: "Mobile defense is required."
 BA_sov_event.9.a: "Commence Middle East operations."
 BA_sov_event.9.b: "We must suppress the rebels."
 BA_sov_event.10.a: "Crush the Baltics!"
 BA_sov_event.10.b: "Toward the Black Sea!"

 
