 CHI_revange_of_Najing: "War of Resistance"
 CHI_revange_of_Najing_desc: "The Republic is wounded. The Japanese enemies attacked us at high speed from Beijing to Nanjing without a proper declaration of war, and in the process, indiscriminately took away the Republic's important resources and the lives of innocent people. However, these actions of Japan united our people rather than dividing them. The fear they gave us brought out our solidarity, and our people will always resist and resist until right before they die."

