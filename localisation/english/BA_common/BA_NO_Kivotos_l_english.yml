 BA_pol_event.1.t: "Between the Seas Concept"
 BA_pol_event.1.d: "For Poland to withstand the evil Soviet invasion, it naturally needs other comrades with the same interests. We will do our best to ensure that alliances with such nations are formed as quickly as possible."
 BA_pol_event.1.a: "It is a matter of national survival."
 BA_pol_event.2.t: "Legacy of War"
 BA_pol_event.2.d: "We defended the country against Bolshevik imperialism, but more and faster preparation is needed to prevent a second war."
 BA_pol_event.2.a: "This is an era of national crisis."
 BA_pol_event.2_tt: "§gPart of the industry in the western territories has moved to central Poland:§!\n"
 BA_pol_event.2_tt_1: "§g\nWe have broken free from the embargo:§!"
 BA_pol_event.2_tt_2: "§gWar mobilization is underway:§!\n"
 BA_pol_event.3.t: "Gorky Conference"
 BA_pol_event.3.d: "As our major cities fall, the tide of war has rapidly turned in Poland's favor. Currently, our army is facing not only Poland but also the internal resurgence of the feudalist White Guard. Poland is aware of this and has proposed a deal to our government for a quick end to the war. The proposal involves liberating Belarus and Western-Central Ukraine and giving up influence over the Baltic states, which would greatly weaken our power in the western regions and serve as a de facto admission of defeat."
 BA_pol_event.3.a: "Like Lenin once did, let's bide our time for the future."
 BA_pol_event.3.b: "The Soviet people will fight until the end and win!"
 BA_pol_event.3_tt: "\nHowever, we will continue the §Ywar§! with §Y@RSA [RSA.getname]§!."
 BA_pol_event.4.t: "Soviet Acceptance"
 BA_pol_event.4.d: "The Soviet Union has accepted our proposal, and Motherland and the Allies have once again brought peace to Eastern Europe and the world."
 BA_pol_event.4.a: "Long live Poland!"
 POL_win_of_intermarium_tt_1: "\n@POL §Y[POL.getname]§!: §GEastern regions recovered§!"
 POL_win_of_intermarium_tt_2: "\n@ROM §Y[ROM.getname]§!: §GEastern regions expanded§!"
 POL_win_of_intermarium_tt_3: "\n@ROM §Y[ROM.getname]§!: §GBessarabia recovered§!"
 POL_win_of_intermarium_tt_4: "\n@POL §Y[POL.getname]§!: §GMoldova government established§!"
 POL_win_of_intermarium_tt_5: "\n@UKR §Y[UKR.getname]§!: §GWestern and central territories reclaimed§!"
 POL_win_of_intermarium_tt_6: "\n@LIT @LAT @EST §YBaltics§!: §GAll territories reclaimed§!"
 POL_win_of_intermarium_tt_7: "\n@FIN §Y[FIN.getname]§!: §G[SMI.getname] and [KAR.getname] autonomous governments established§!"
 POL_win_of_intermarium_tt_8: "\n@TUR §Y[FIN.getname]§!, @PER §Y[PER.getname]§! : §GTranscaucasia government established§!"
 POL_win_of_intermarium_tt_9: "\n@TUR §Y[FIN.getname]§! : §GGeorgia and Armenia governments established§!"
 POL_win_of_intermarium_tt_10: "\n@PER §Y[PER.getname]§! : §GAzerbaijan government established§!"
 POL_win_of_intermarium_tt_11: "\n@PER §Y[PER.getname]§! : §G[TMS.getname] government established§!"
 POL_win_of_intermarium_tt_12: "\n@ROM §Y[ROM.getname]§!, @TUR §Y[TUR.getname]§! : §G[CRI.getname] liberated and neutralized§!"
 POL_win_of_intermarium_tt_13: "\n@BLR §Y[BLR.getname]§!: §GWestern territories reclaimed§!"
 BA_pol_event.5.t: "Soviet Refusal"
 BA_pol_event.5.d: "Despite the certain tide of war, the Soviet Union has chosen to fight on."
 BA_pol_event.5.a: "How foolish!"
 BA_pol_event.6.t: "Gorky Conference"
 BA_pol_event.6.d: "Now that the punitive offensive against [SOV.getname] is succeeding, there is no longer a reason to maintain an exhaustive war. We can use our strategic superiority to obtain Eastern European territories and other necessities from the Soviet Union, and move on to more important matters."
 BA_pol_event.6.a: "War is also diplomacy."
 BA_pol_event.7.t: "Intermarium Eastern Fortress Plan"
 BA_pol_event.7.d_1: "The [POL.getname] Foreign Ministry has requested our cooperation in building a common eastern fortress against Bolshevik imperialism."
 BA_pol_event.7.d_2: "We will build a common eastern fortress against Bolshevik imperialism."
 BA_pol_event.7.a: "Better safe than sorry."
 BA_pol_event.7.b: "It is unnecessary."
 BA_pol_event.8.t: "End of the Soviet-Polish War"
 BA_pol_event.8.d: "Early this morning, the Polish and Soviet Foreign Ministries issued a joint statement. This included the cessation of hostilities between the two nations, as well as the independence of some federal constituents. This essentially means the Soviet Union has admitted defeat, and Poland has surely received compensation for the past two defeats."
 BA_pol_event.8.a: "Our victory!"
 BA_pol_event.8.b: "Just a small retreat."
 BA_pol_event.8.c: "The Soviet Union is in peril."
 BA_pol_event.9.t: "Situation in Poland"
 BA_pol_event.9.d: " 'What has the war left us?'\n\n The Sanacja movement, which has led the Republic of Poland for the past decade, has been going through a dark period since the death of our leader Piłsudski. Defeats in both the West and East are breeding widespread futility and defeatism throughout society.\n\n However, these are not the only things left to us. Our leader Piłsudski left us a grand foreign policy called 'Intermarium.' Although our past hegemonic and military actions were obstacles that prevented us from forming alliances across the seas, the illegal invasion carried out by the Soviets until recently has become a great threat to all other independent Eastern European nations. Before the solid ranks of united independent nations, we will be able to withstand the Bolshevik offensive!"
 BA_pol_event.9.a: "Poland does not yield!"
 BA_pol_event.9.b: "Let us attempt a meager resistance."
 BA_pol_event.10.t: "[POL.getName]'s Request to Join the Federation"
 BA_pol_event.11.t: "Fortress Constructed"
 BA_pol_event.11.d: "Through cooperation, we have been able to build defensive lines quickly."
 BA_pol_event.11.a: "Good."
 BA_pol_event.11_tt: "Among the allies, §Y[?POL.POL_bunker_var]§! nations participated in the fortress construction, and a level §G[?POL_bunker_num_var]§! §Yfortress§! has been built.\n\n"
 BA_pol_event.11_tt_1: "Among the allies, §Y[?POL.POL_bunker_var]§! nations participated in the fortress construction, and a level §G[?POL_bunker_num_var]§! §Yfortress§! has been built.\n\n"
 BA_pol_event.11_tt_2: "Among the allies, §Y[?POL.POL_bunker_var]§! nations participated in the fortress construction, and a level §G[?POL_bunker_num_var]§! §Yfortress§! has been built.\n\n"
 BA_pol_event.12.t: "Prometheism"
 BA_pol_event.12.d: "The political plan 'Prometheism,' started in 1918 by Józef Piłsudski of the Second Polish Republic, aimed to weaken [SOV.getadjective] by supporting nationalist independence movements among the major non-Russian peoples living within its borders. Now that war with [SOV.getadjective] has broken out, we can use the help of this campaign to conduct the war more efficiently."
 BA_pol_event.12.a: "Overthrow Russia!"
 BA_pol_event.13.t: "Intermarium Winter Training"
 BA_pol_event.13.d: "Under the leadership of our reliable ally, the [FIN.getname] Army, the Intermarium allies have learned how to overcome the cold."
 BA_pol_event.13.a: "May the winter help us."
 BA_pol_event.14.t: "[FROM.getname]'s Investment in [NOR.getadjective] Shipbuilding"
 BA_pol_event.14.d: "The [POL.getadjective] government has invested in our shipbuilding industry to counter the approaching threat."
 BA_pol_event.14.a: "Wise."
 BA_pol_event.15.t: "Swedish Timber Supply"
 BA_pol_event.15.d: "The [SWE.getadjective] government has decided to supply cheap timber to all [POL.getfactionname] allies."
 BA_pol_event.15.a: "Cooperation makes us stronger!"
 BA_pol_event.16.t: "Partnership with VEF"
 BA_pol_event.16.d: "VEF, the electronics industrial company of our reliable ally [LAT.getname], has accepted the request to support the entire alliance with engineering equipment."
 BA_pol_event.16.a: "Thank you."
 BA_pol_event.17.t: "[LIT.getadjective] Textile Industry"
 BA_pol_event.17.d: "[LIT.getadjective] textile companies are producing military uniforms for the alliance at low cost."
 BA_pol_event.17.a: "Good."
 BA_pol_event.18.t: "[FROM.GetAdjective] Support for Shale Oil Extraction"
 BA_pol_event.18.d: "Since shale oil was first produced in the motherland in 1921 and the first electricity made from shale oil was used in 1924, many did not think shale oil was an important resource. However, in stark contrast to the indecisiveness of the skeptics, we succeeded in extracting 1 million tons of oil shale in 1937 alone. Encouraged by this achievement, our ally [FROM.getname] decided to support our shale oil extraction companies with more capital to prepare for war with [SOV.getadjective]."
 BA_pol_event.18.a: "Thank you!"
 BA_pol_event.20.t: "Fate of East Germany"
 BA_pol_event.20.d: "We must decide the fate of East German regions, including Berlin."
 BA_pol_event.20.a: "Return it to the Wehrmacht."
 BA_pol_event.20.b: "Puppet the Pandemonium Society."
 BA_pol_event.20.c: "Poland will annex the East German region!"
 BA_pol_event.20.e: "Restore it to Prussia."
 BA_pol_event.21.t: "Fate of Memel"
 BA_pol_event.21.d: "We must decide the fate of Memel, the easternmost territory of the old German Empire."
 BA_pol_event.21.a: "Return it to Lithuania."
 BA_pol_event.21.b: "Poland will annex it!"
 BA_pol_event.22.t: "Fate of Königsberg"
 BA_pol_event.22.d: "We must decide the future path of Königsberg, the birthplace of Prussia."
 BA_pol_event.22.a: "Send all transferred students and reorganize it as an autonomous province."
 BA_pol_event.22.b: "Return it to the Wehrmacht."
 BA_pol_event.22.c: "Separate East Prussia from Germany and puppet it."
 BA_pol_event.22.g: "Give it to Prussia."
 BA_pol_event.22.f: "Return it to Trinity."
 BA_pol_event.22.e: "Königsberg is ours!"
 BA_pol_event.23.t: "Fate of [5.getName]"
 BA_pol_event.23.d: "We must decide the fate of [5.getName]."
 BA_pol_event.23.a: "Give it to Prussia."
 BA_pol_event.23.b: "Return it to the Wehrmacht."
 BA_pol_event.23.c: "Give it to Trinity."
 BA_pol_event.23.e: "Poland will annex it."
 BA_pol_event.24.t: "Fate of Gdańsk"
 BA_pol_event.24.d: "We have repaid the humiliation of Gdańsk being briefly occupied by the otherworldly force called Arius. We will decide the fate of Gdańsk."
 BA_pol_event.24.a: "Restore the Arius Squad."
 BA_pol_event.24.b: "Cede it to Prussia."
 BA_pol_event.24.c: "Gdańsk is Polish territory!"
 BA_pol_event.25.t: "[63.getname] and [68.getname]"
 BA_pol_event.25.d: "We must decide the fate of [63.getname] and [68.getname]."
 BA_pol_event.25.a: "Give it to East Germany."
 BA_pol_event.25.b: "Polonize the region."
 BA_pol_event.26.t: "Polish-German Borderlands"
 BA_pol_event.26.d: "We will decide the fate of our western territories reclaimed as a result of the Great War."
 BA_pol_event.26.a: "Give it to East Germany."
 BA_pol_event.26.b: "Those places belong to Polish territory!"
 BA_pol_event.27.t: "Fate of [66.getname]"
 BA_pol_event.27.d: "We will decide the fate of [66.getname]."
 BA_pol_event.27.a: "Liberate Silesia."
 BA_pol_event.27.c: "Give it to East Germany."
 BA_pol_event.27.b: "Annex it to Poland."
 BA_pol_event.28.t: "[67.getname]"
 BA_pol_event.28.d: "We must also decide the fate of [67.getname]."
 BA_pol_event.28.a: "Cede it to Silesia."
 BA_pol_event.28.b: "Annex it."
 BA_pol_event.29.t: "Fate of West Germany"
 BA_pol_event.29.d: "We will decide the fate of the region west of the Weser River."
 BA_pol_event.29.a: "Return it to the Wehrmacht."
 BA_pol_event.29.b: "Liberate the Pandemonium Society."
 BA_pol_event.29.c: "Fragment it centered around Prussia."
 BA_pol_event.29.e: "Completely fragment it."
 BA_pol_event.30.t: "Fate of South Germany"
 BA_pol_event.30.d: "Following West Germany, we will decide the fate of South Germany, including Bavaria."
 BA_pol_event.30.a: "Give it to the Wehrmacht."
 BA_pol_event.30.b: "Cede it to the Pandemonium Society."
 BA_pol_event.30.c: "Liberate Bavaria."
 BA_pol_event.30.f: "Liberate the Prefect Team."
 BA_pol_event.31.t: "Fate of Holstein and Schleswig"
 BA_pol_event.31.d: "We must decide the fate of Holstein and Schleswig."
 BA_pol_event.31.a: "Return it to the Wehrmacht."
 BA_pol_event.31.b: "Cede it to Pandemonium Society."
 BA_pol_event.31.c: "Give it to the Northern nations."
 BA_pol_event.31.e: "Give it to Trinity."
 BA_pol_event.31.f: "Liberate Schleswig-Holstein."
 BA_pol_event.31.g: "Let Prussia and the Northern nations divide it."
 BA_pol_event.32.t: "Fate of Weser-Ems"
 BA_pol_event.32.d: "We will finalize the division of Germany by deciding the fate of Weser-Ems."
 BA_pol_event.32.a: "Give it to the West German forces."
 BA_pol_event.32.b: "Give it to the East German forces."
 BA_pol_event.33.t: "Naming of [763.getname]"
 BA_pol_event.33.d: "[763.getname] was a very important region for Germans as the birthplace of Prussia. However, as long as [763.getname] is with us, we will Polonize the place name or change it entirely."
 BA_pol_event.33.a: "Respect the Germans and only change to Polish phonetics."
 BA_pol_event.33.b: "Commemorate the Sanacja leader, Piłsudski."
 BA_pol_event.33.c: "Use the name of His Majesty the King."
 BA_pol_event.34.t: "The Deluge"
 BA_pol_event.34.d: "We already experienced a 'Deluge' in the 17th century. We were defeated then, but now is different. Hundreds of thousands of youths with the courage of Moses to cross the flood are serving in Poland and our allied nations toward victory."
 BA_pol_event.34.a: "Cross the Deluge!"
 
 BA_pol_event.35.t: "Song of Intermarium"
 BA_pol_event.35.d: "Freedom that breathed under the gray sun\nNow rise, in our land\n\nAmbition of hegemonic nations\nBetween them, we have survived\n\nListen to the whispers along the Vistula\nListen to the echo of the Carpathian Mountains\n\"We are one,\" they say\n\nNot a flock of sheep surrounded by wolves\nWe are now one pack, one force\n\nOath of brothers made with bread and salt\nOur dream protected by blood and tears\nBy the name of Intermarium, we stand\n\nWe turn the wheels of history\nNo longer the chessboard of giants\nOur destiny, in our own hands\n\nFrom the Baltic to the Black Sea\nOur song resonates"
 BA_pol_event.35.a: "\"Long live the free and strong Intermarium!\""
 
 BA_pol_event.36.t: "[FROM.GetAdjective] Proposal to Join Intermarium"
 BA_pol_event.36.d: "[FROM.GetAdjective] has declared the Intermarium Federation and proposed federalization to us."
 BA_pol_event.36.a: "Of course! We are one!"
 BA_pol_event.36.b: "Our future lies elsewhere."
 
 BA_pol_event.37.t: "[FROM.GetName] Refusal"
 BA_pol_event.37.d: "[FROM.GetName] has refused our proposal."
 BA_pol_event.37.a: "We understand them."

 BA_pol_event.38.t: "[FROM.getName] Agrees to Federalization!"
 BA_pol_event.38.d: "[FROM.GetName] has decided to join our federation!"
 BA_pol_event.38.a: "Great!"
 BA_pol_event.39.t: "Fate of Rhineland"
 BA_pol_event.39.d: "We must decide the fate of the Rhine region."
 BA_pol_event.39.a: "Give it to West Germany."
 BA_pol_event.39.b: "Liberate it."
 BA_pol_event.40.t: "Fate of Württemberg"
 BA_pol_event.40.d: "We must decide the fate of southwestern Germany."
 BA_pol_event.40.a: "Give it to West Germany."
 BA_pol_event.40.b: "Cede it to South Germany."
 BA_pol_event.40.c: "Liberate it."
 BA_pol_event.40.e: "Constitute South Germany together with Bavaria."
 BA_pol_event.41.t: "Fate of Mecklenburg and Thuringia"
 BA_pol_event.41.d: "We will decide the fate of the remaining German regions."
 BA_pol_event.41.a: "Liberate them."
 BA_pol_event.41.b: "Make them client states of Prussia."
 BA_pol_event.41.c: "Annex them to Prussia."
 
 BA_pol_event.42.t: "Free Polish Volunteer Force"
 BA_pol_event.42.d: "In the eastern regions taken from Poland after the recent Soviet Second Western Offensive, Polish nationalist militias are active. They will rise to help Poland when a Soviet-Polish war breaks out."
 BA_pol_event.42.a: "For Poland!"
 BA_pol_event.42.b: "A hegemonic conspiracy."
 BA_pol_event.43.t: "Belarusian Volunteer Force"
 BA_pol_event.43.d: "In some parts of Belarus, anti-communist underground organizations based on nationalism are scattered. They will rise to help Poland when war between Poland and the Soviets occurs."
 BA_pol_event.43.a: "For our Belarusian comrades!"
 BA_pol_event.43.b: "Dogs of the capitalists."
 BA_generic_event.14.t: "Ukrainian National Army"
 BA_generic_event.14.d: "In western Ukraine, pro-Polish nationalist militias are scattered. They will rise to help Poland when war between Poland and the Soviets occurs."
 BA_generic_event.14.a: "For our Ukrainian comrades!"
 BA_generic_event.14.b: "Anti-socialist behavior."
 BA_pol_event.44.t: "Anti-Soviet Nationalist Militia Uprising"
 BA_pol_event.44.d: "Underground armed organizations supported by the [POL.getname] government have risen in sync with our advance and joined our ranks."
 BA_pol_event.44.a: "Thank you."
 BA_pol_event.46.t: "Lwów Declaration"
 BA_pol_event.46.d: "'We reaffirm that Bolshevism is an anti-liberty ideology that stifles and exploits the people, and we hereby launch the Russian People's Liberation Committee for the de-Bolshevization of the Russian regions. This committee shall not disband until its goals are achieved...'"
 BA_pol_event.46.d_1: "'We reaffirm that the [SOV.getname] government is an anti-liberty government that stifles and exploits the people, and we hereby launch the [RSA.getname] for the liberation of all of Russia. This committee shall not disband until its goals are achieved...'"
 BA_pol_event.46.a: "Let's crush them!"
 BA_pol_event.46.b: "Our occupied territories are precious."

 POL_FPV_modifier: "Free Polish Volunteer Force"
 POL_FPV_modifier_desc: ""
 POL_BVA_modifier: "Belarusian Volunteer Force"
 POL_UNA_modifier: "Ukrainian National Army"

 BA_intermarium_solidarity_event.1.t: "A New Ally"
 BA_intermarium_solidarity_event.1.d: "A new ally [FROM.FROM.getname] has joined [POL.getfactionname]. This is good news, but it also means there is one more opinion to coordinate."
 BA_intermarium_solidarity_event.1.a: "Oh, boy."
 BA_intermarium_solidarity_event.2.t: "Common Military Fund"
 BA_intermarium_solidarity_event.2.d: "Our defense spending has returned to us as a common military fund."
 BA_intermarium_solidarity_event.2.a: "Great!" 
 BA_intermarium_solidarity_event.3.t: "Common Defense Force"
 BA_intermarium_solidarity_event.3.d: "A common defense force trained with stockpiled equipment is deployed."
 BA_intermarium_solidarity_event.3.a: "It was worth it."
 BA_intermarium_solidarity_event.4.t: "[FROM.FROM.getname]'s Separate Peace"
 BA_intermarium_solidarity_event.4.d: "[FROM.FROM.getname] betrayed the alliance and made a separate peace with the Soviet Union."
 BA_intermarium_solidarity_event.4.a: "Dammit."
 BA_intermarium_solidarity_event.5.t: "[FROM.getname]'s Request for Separate Peace"
 BA_intermarium_solidarity_event.5.d: "[FROM.getname] wants to negotiate with us on the condition of withdrawal from Intermarium."
 BA_intermarium_solidarity_event.5.a: "Let them have what they want."
 BA_intermarium_solidarity_event.5.b: "Nonsense."
 BA_intermarium_solidarity_event.6.t: "Collapse of Intermarium"
 BA_intermarium_solidarity_event.6.d: "Solidarity between allies was nothing but a candle in the wind. We have yielded before a massive enemy."
 BA_intermarium_solidarity_event.6.a: "Dammit."

 
