 POL_moving_germans_later: "Aftermath of German Refugee Migration"
 POL_moving_germans_later_desc: "Due to the Polonization policy implemented in the eastern German regions annexed by Poland, numerous Germans lost their homes and migrated to [ROOT.getname]. We have been placed in a position where we must care for them."
