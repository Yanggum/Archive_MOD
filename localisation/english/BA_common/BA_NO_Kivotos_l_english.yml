 POL_no_flood: "Cross the Deluge!"
 POL_no_flood_desc: "We already experienced a 'Deluge' in the 17th century. We were defeated then, but now is different. Hundreds of thousands of youths with the courage of Moses to cross the flood are serving in Poland and our allied nations toward victory."
