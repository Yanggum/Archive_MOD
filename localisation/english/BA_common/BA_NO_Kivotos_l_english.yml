 FRM_event.1.t: "Ghosts of Maginot"
 FRM_event.1.d: "While the shadow of total war covers our motherland and soldiers on the main front bleed every day, an unexpected report has arrived. Mysterious movements have been captured on the Maginot Line, which was once French but was under our control. Communication with the local stationed forces has been cut off, and an urgently dispatched reconnaissance unit witnessed the massive fortress turrets turning toward us.\n\nOn the fortress, the French Tricolour, which was thought to have vanished, was hung again. The remnants of the 'French Second Army' trapped and surviving inside the fortress have completely seized control of the fortress instead of collapsing in hunger and despair. They are no longer helpless survivors, but have emerged as a new hostile force leaning on the iron fortress, calling themselves the 'Maginot Liberation Army.'\n\nAs our war situation worsened, these ghosts of the past seized the opportunity to reveal themselves. At this point when the main front is collapsing, how should we handle this uncontrollable fortress?"
 FRM_event.1.a: "Leave it alone for now. Focus on the main front."
 FRM_event.1.b: "We must resolve the threat from the rear!"

