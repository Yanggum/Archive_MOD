 # Popups 
 POL_country_intro_header: "§9A Nation of Joy and Independence§!"
 POL_country_intro_content: " It has not been a long story that the Polish flag has been proudly flying in Warsaw. Poland is a new nation that spent long years under the boots of other countries and gained independence less than 30 years ago.\n\n Poland, which began appearing in earnest in history in the 10th century, is a country founded by Lech, who moved west among the three brothers Lech, Czech, and Rus according to the Slavic foundation myth. The Kingdom of Poland, which began to appear in medieval history by converting to Catholicism, suffered from wars with the Holy Roman Empire and the invasion of the Mongol Empire despite its revival. However, the Kingdom of Poland was reborn as a major power and reached its peak by reorganizing into the Polish-Lithuanian Commonwealth in the 14th century. But the white-tailed eagle in flight experienced a period of crisis called the 'Deluge' from the 17th century and ultimately suffered the humiliation of being divided into three by Prussia, Russia, and Austria. While the whirlpool of history blew relentlessly in Western Europe thereafter, Poles, split into three pieces, could only watch it happen.\n\n Nevertheless, time was on Poland's side. The Great War, which stained the start of the 20th century with blood, saw Germany liberate Russian-ruled Polish regions as a 'Regency Kingdom,' and after Germany's surrender, the 'Second Polish Republic' appeared, stopping the Soviet's western offensive and growing as a medium-sized Eastern European power by seizing Central Lithuania from Lithuania.\n\n The politics of the new nation Poland were generally unstable. Particularly unlike the West, which could focus on national reconstruction after the Great War, Poland was chaotic with the war with the Soviets, territorial disputes with Eastern European nations, and local warfare with German militias. This instability led to Piłsudski's coup in 1926, which allowed the Sanacja movement, composed of Piłsudski and his subordinates, to seize control of Polish politics and bring it to what it is today.\n\n Around November 1935, Poland had to fight beings that were not earthlings for the first time in history. These entities, called 'Kivotos,' transferred to Earth and attacked Poland's western territories. The Polish army continued to resist but had to retreat due to differences in technology and capacity. Furthermore, in the aftermath of the chaos in the West, small-scale military clashes occurred on the Polish-Soviet border, which soon expanded into war.\n\n In the Second Soviet-Polish War, Poland could not recreate the miracle of 1919. However, with the serious condition of the Red Army being discovered in various places, the Soviet Union could no longer advance into Polish territory. Thus, Poland was able to buy some time with a quickly concluded peace treaty, but it was clear that Poland was surrounded on the east and west.\n\n Between Russia, looking for a third chance, and Trinity, armed with future technology, the destiny of Poland is unfolding.\n\n§YDeveloper: AfterImage§!"
 POL_guide: "\n£white_dot Build up Poland's capabilities.\n£white_dot Reclaim the lost territories in the West and East.\n£white_dot Gather as many allies as possible to stand against the Soviet Union.\n£white_dot Withstand the final war of the otherworldly invaders.\n\n\n§9Poland will rise again!§!"

 SOV_country_intro_header: "Collapse of the Empire"
 SOV_country_intro_header_1: "After the Dust Settled"
 SOV_country_intro_header_2: "Power Struggle"
 SOV_country_intro_header_3: "Second Soviet-Polish War and the Great Purge"
 SOV_country_intro_content: "The shocking defeat in the Russo-Japanese War and the Bloody Sunday incident, where the people turned their backs on the Tsar, signaled the collapse of the vast Eastern empire.\n\nWhen two gunshots rang out in Sarajevo, Bosnia, and the Great War broke out, Russia was able to perform unexpectedly well in the early stages thanks to rapid general mobilization. However, it did not last long. The defeat at Tannenberg exposed the weaknesses of the Russian Empire, and the Brusilov Offensive collapsed the Russian Imperial Army. As the Imperial Army collapsed, German forces quickly occupied the Baltics, Belarus, and Ukraine. Nicholas II took personal command to stop the situation from worsening, but this backfired. \n\nOn March 8, 1917, history began writing a new chapter. The 300-year-old Romanov dynasty fell, and a new republic emerged in its place. However, while the new republic tried to continue the war, it only repeated tedious retreats. Vladimir Lenin and the Bolsheviks did not miss this opportunity and declared the October Revolution."
 SOV_country_intro_content_1: "When the dust of the Red-White Civil War settled, the Union of Soviet Socialist Republics emerged on the land that was once the Russian Empire, along with an undeniable ruler. However, the price paid for the civil war was too horrific. 10 million people died during the civil war, and the situation was disastrous with plummeting steel production, record-breaking drought, and resulting famine. Vladimir Lenin introduced the New Economic Policy (NEP) to restore the economy and focus on post-war reconstruction.\n\nLenin, who was seriously injured in an assassination attempt in 1918, moved away from the center of power as he became unable to conduct normal activities due to the aftereffects of the gunshot wound and accumulated overwork.\n\nWhen Lenin eventually died in 1924 from the aftereffects, chaos began within the Communist Party."
 SOV_country_intro_content_2: "After Lenin's death, a power struggle began within the Communist Party. The power struggle between Stalin and Trotsky was particularly intense. Stalin countered Trotsky, who advocated for Permanent Revolution, by proposing Socialism in One Country. Due to Trotsky's continued absence from the Central Committee and the offensive of the Stalin-Zinoviev-Kamenev alliance, Trotsky was pushed from the center of power and eventually went into exile, and the Troika system was established.\n\nHowever, as everyone expected, the Troika system did not last very long. When relations between Zinoviev-Kamenev and Stalin faltered, they brought up the issue of intra-party democracy that Trotsky had advocated to criticize Stalin, and Bukharin, who had shocked people with his 'Enrich yourselves' remark, also criticized Stalin as someone who underestimated capitalism.\n\nThe Zinoviev-Kamenev alliance, which even pulled in the exiled Trotsky, was again branded as factionalists by the Stalin-Bukharin alliance and kicked out of the party, and Stalin finally succeeded in driving out Bukharin as well, securing his position as the sole leader within the party."
 SOV_country_intro_content_3: "In November 1935, an uneasy tension hung over the east of Europe. After the 'Great Transfer' incident, the border zone between Poland and the Soviet Union was no different from an unstable powderkeg. Small and large local skirmishes between the two nations finally escalated into the Second Soviet-Polish War, which neither side wanted.\n\nThis unexpected war came as a great shock to both sides. The war, which started in an unprepared state, resulted in massive casualties and lasted for about a month, exhausting the military power and resources of both nations. Stalin was particularly shocked as the disastrous reality of the Soviet Army was exposed.\n\nAs a result of the war, Stalin began planning a massive purge of military leadership and government officials. This will soon lead to the Great Purge, the largest in Soviet history.\n\nOn January 1, 1936, the new year has dawned, but the skies over Europe are still dark. Amidst the unhealed scars of the Soviet-Polish War, Stalin's Great Purge is about to begin."
 SOV_guide: "\n[SOV.GetName] | Center Path\n£white_dot Complete the Five-Year Plan to fully emerge as an industrial nation.\n£white_dot Purge the enemies of the Union hiding within.\n£white_dot Liberate Europe and achieve Socialism in One Country.\n\n[SOV.GetName] | Right Opposition Path\n£white_dot Question Stalin's authority and usurp his position.\n£white_dot Complete the New Economic Policy to fully emerge as an industrial nation.\n£white_dot Spread International Revolutionary Marxism widely.\n\n\n§tWorkers of the world, unite!§!"

