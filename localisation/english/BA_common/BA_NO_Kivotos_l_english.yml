 POL_capital_of_the_revolution: "Authoritative Central Government"
 POL_capital_of_the_revolution_desc: "Warsaw, called the capital of the revolution, exerts strong control over each region."
 POL_nationalism_elimination: "Elimination of Nationalism"
 POL_nationalism_elimination_desc: "We will suppress minority separatism, so-called 'nationalism,' and lead the integration of the federation more quickly."
 POL_Ongoing_economic_integration_idea_desc: "Economic integration with member states is essential for the formation of Intermarium. It will be carried out in three stages."
