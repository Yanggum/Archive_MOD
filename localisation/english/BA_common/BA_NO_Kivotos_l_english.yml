 POL_exile_1: "Massive Conscription"
 POL_exile_2: "Massive Conscription"
 POL_exile_desc: "In the aftermath of the nationwide chaos caused by the Great Transfer, Poles are migrating on a large scale to Poland, fleeing the strangers to the west and the Soviets to the east."
