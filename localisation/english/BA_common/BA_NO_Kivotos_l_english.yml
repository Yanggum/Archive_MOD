 # Japanese National Spirits
 JAP_china_hater: "Unstoppable Expansionism"
 JAP_china_hater_desc: "The Great Empire of Japan's resources are meager, but the Republic of China and the continent we share a border with are countries with the potential to threaten us with abundant resources and manpower.\n\nThe people of Japan want war. Although our army is not prepared, the enemy's army can hardly be called an army. If we shock the enemy, crush their army, and end the war with a rapid advance, we will be able to satisfy the continent's abundant resources and the citizens."
