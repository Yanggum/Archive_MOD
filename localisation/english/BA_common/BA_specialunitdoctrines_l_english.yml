l_english:
 CAVALRY_DOCTRINE_LABEL: "Halo"
 CAVALRY_DOCTRINE_DESC: "A select special forces unit of Kivotos students imbued with the power of Mystery. Capable of spearheading operations in the harshest environments of the extraterrestrial theater without hesitation."
 special_forces_cavalry: "Halo Promotion"
 special_forces_cavalry_desc: "Higher clearance, better equipment. This is what it means to be the elite of the elite. We carry the pride of our academy into this new world."
 plain_cavalry: "Urban Firepower"
 plain_cavalry_desc: "The city belongs to those who know its rhythms. We move like ghosts through the alleys, and our fire is as precise as it is sudden."
 desert_cavalry: "Marsh Maneuver"
 desert_cavalry_desc: "Traversing these wetlands is a test of endurance. Keep your boots tight and your eyes sharp; the mission doesn't stop for a little mud."
 military_police_cavalry: "Wide-area Search"
 military_police_cavalry_desc: "The law doesn't stop at the gates of the academy. No matter where you hide on this planet, you won't escape the eyes of the law."
 cavalry_sniper: "Airborne Drop"
 cavalry_sniper_desc: "Visual contact confirmed. Initiating high-altitude deployment. It's a bit different from our usual tactical maneuvers, but the view is quite nice, isn't it?"
 fearless_cavalry: "Amphibious Specialization"
 fearless_cavalry_desc: "Land or sea, it makes no difference to us. We secure the beachhead and we hold it—failure is not an option when Sensei is watching."
 artillery_support_cavalry: "Close Formation"
 artillery_support_cavalry_desc: "Don't break formation! As long as our halos are shining and our lines are tight, no force in this world can break us."
 agressive_cavalry: "Queen of Special Ops"
 agressive_cavalry_desc: "Queen? I'm not that big of a deal... I'm just doing my job so everyone can finish their mission and go home to rest."
 organized_cavalry: "Training Institution Expansion"
 organized_cavalry_desc: "Efficiency isn't just about math, Sensei. By standardizing our protocols, we ensure that every student is ready for the challenges of this world."
