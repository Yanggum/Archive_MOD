 ### Trinity Comprehensive Academy ###
 TRM_infantry_equipment_0:0 "Impalement/Blessing"
 TRM_infantry_equipment_0_short:0 "Impalement"
 TRM_infantry_equipment_0_desc:0 "A new weapon developed to replace outdated firearms upon request from the Justice Realization Department. It boasts excellent accuracy and decent durability, but some evaluations suggest it falls short of completely replacing existing weapons."
 TRM_infantry_equipment_1:0 "Quis ut Deus"
 TRM_infantry_equipment_1_short:0 "Quis ut Deus"
 TRM_infantry_equipment_1_desc:0 "A fairly old-fashioned submachine gun developed by Trinity long ago. It possesses several advantages such as a mass-production structure and high rate of fire, but leaves regrets due to low durability and accuracy."
 TRM_infantry_equipment_2:0 "Sweet Driver"
 TRM_infantry_equipment_2_short:0 "Sweet Driver"
 TRM_infantry_equipment_2_desc:0 "Lightweight and with low recoil among firearms using the same ammunition type. Added with convenience, it's a Trinity-unique rifle that also has durability. However, due to its unique appearance, users have mixed reactions to it."
 TRM_infantry_equipment_3:0 "Library Ruler"
 TRM_infantry_equipment_3_short:0 "Library Ruler"
 TRM_infantry_equipment_3_desc:0 "Corrected the shortcomings of previous standard firearms. Accuracy improved and convenience enhanced. The unique appearance remains unchanged. Features an attached grenade launcher, allowing for reinforcing firepower when needed."

