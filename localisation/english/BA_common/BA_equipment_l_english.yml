 ### Abydos High School ###
 ABY_infantry_equipment_0:0 "Ordinary Means"
 ABY_infantry_equipment_0_short:0 "Ordinary Means"
 ABY_infantry_equipment_0_desc:0 "A pistol used by Okusora Ayane, this standard-issue firearm was temporarily used during the early Great War to supplement insufficient armaments. Despite being a pistol, it has very high firepower and continues to be issued to officers today."
 ABY_infantry_equipment_1:0 "Sincerity"
 ABY_infantry_equipment_1_short:0 "Sincerity"
 ABY_infantry_equipment_1_desc:0 "An assault rifle used by Kuromi Serika, this standard-issue firearm means 'Sincerity' or 'Honesty'. Particularly among soldiers, it's rumored that its performance matches training exactly, making it very popular."
 ABY_infantry_equipment_2:0 "WHITE FANG 465"
 ABY_infantry_equipment_2_short:0 "WHITE FANG 465"
 ABY_infantry_equipment_2_desc:0 "An assault rifle used by Sunaokami Shiroko, this standard-issue firearm ranges from designated sharpshooter rifles to infantry assault rifles. With wide versatility and expandability, it was newly adopted as the standard firearm. Though it has powerful destructive capability, discussions about improvement are ongoing due to problems like high weight and use of dedicated magazines."
 ABY_infantry_equipment_3:0 "BLACK FANG 465"
 ABY_infantry_equipment_3_short:0 "BLACK FANG 465"
 ABY_infantry_equipment_3_desc:0 "An improved version of WHITE FANG 465, maintaining strengths while reducing weight and allowing insertion of existing magazines. With added modular design, easier maintenance, increased hit rate and range, it has made significant improvements. However, as compensation, reliability slightly decreased, causing occasional malfunctions."
 ABY_modern_infantry_equipment:0 "Horus Eye + Beretta 92A1"
 ABY_modern_infantry_equipment_short:0 "Horus Eye + Beretta 92A1"
 ABY_modern_infantry_equipment_desc:0 "A shotgun, auxiliary submachine pistol and bulletproof vest used by Takanashi Hoshino. Primarily issued to frontline breakthrough assault teams to sweep enemy trenches and occupy positions until follow-up infantry arrive. Steel plate bulletproof vests and other quasi-modern equipment besides firearms are also equipped to regular infantry to enhance firepower and defense."
 ABY_juggernaut_equipment_0:0 "Juggernaut Mini No.5"
 ABY_juggernaut_equipment_0_short:0 "Juggernaut Mini No.5"
 ABY_juggernaut_equipment_0_desc:0 "A Nephtys Inc. minigun used by Yoizuka Nonomi and newly developed Juggernaut Suit. The Nephtys Inc. minigun uses new materials for lightweight design, but remains too heavy for regular infantry. It's equipped as armament for Juggernaut units with powered exoskeleton suits. The Juggernaut Suit applies data link technology, allowing tactical efficiency when drones are deployed alongside Juggernauts."
