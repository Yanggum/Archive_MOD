 TRM_popularity_TOOLTIP: "§YInfluence§! represents how much sway a faction currently holds within the Academy.\nAs §YInfluence§! increases, the faction's impact on the Academy grows.\nBefore a faction can be disbanded, its §YInfluence§! must be reduced to 0 through special decisions."
 TRM_LOYALTY_TOOLTIP: "§YLoyalty§! represents how willing a faction is to cooperate with the Academy government.\nHigh §YLoyalty§! grants positive effects to the Academy government, while low loyalty results in negative effects.\nIf §YLoyalty§! drops below §R-50§!, they may launch a large-scale struggle against the Academy government."

