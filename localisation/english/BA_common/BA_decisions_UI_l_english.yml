l_english:
#########################
########## Valkyrie ###########
#########################
KSP_pokemon_archive: "Valkyrie Correctional Bureau"
KSP_pokemon_archive_desc: "The Correctional Bureau is a vital organization within Valkyrie, dedicated to correcting the misguided actions of students and leading them back to the right path. We accept students from diverse backgrounds and issues, supporting them so they can grow into 'wholesome' members of society. This signifies more than mere discipline; it offers them a chance to contribute to Valkyrie's strength, reflecting on their past wrongs and taking the first step toward becoming 'upright' students."
KSP_pokemon_correct_ayumu: "Correcting Iwabitsu Ayumu"
KSP_pokemon_correct_ayumu_desc: "The Chief of the General Student Council's Administrative Committee Adjustment Office was one of the many who worked silently within the Council. Amidst the chaos of the post-Great Transfer Council, she chose to enter the Correctional Bureau's holding cells herself. If we can convince her that we have succeeded the General Student Council, she could serve as a mediator in the strained relationship between the Kingdom of Belgium and Valkyrie Police Academy following the coalition."
KSP_pokemon_correct_ayumu_flag: "Iwabitsu Ayumu Correction Achieved"
KSP_pokemon_correct_nanagami_rin: "Correcting Nanagami Rin"
KSP_pokemon_correct_nanagami_rin_flag: "Nanagami Rin Correction Achieved"
KSP_pokemon_correct_nanagami_rin_desc: "Chief Administrative Officer Nanagami Rin has acted on behalf of the GSC President since her disappearance. Though she is currently stripped of power and held in the Correctional Bureau, bringing her into the Valkyrie Police Academy would provide immense help in navigating the current political turmoil."
KSP_pokemon_correct_aoi: "Correcting Oki Aoi"
KSP_pokemon_correct_aoi_desc: "Finance Director Oki Aoi was a highly capable fundamentalist during the Council's prime, proven by her prevention of the Council's moratorium immediately after the Great Transfer. As Valkyrie Police Academy falters due to overexpansion, recruiting her to manage our finances is an incredibly attractive proposition."
KSP_pokemon_correct_aoi_flag: "Oki Aoi Correction Achieved"
KSP_pokemon_correct_kaya: "Correcting Shiranui Kaya"
KSP_pokemon_correct_kaya_flag: "Shiranui Kaya Correction Achieved"
KSP_pokemon_correct_kaya_desc: "The GSC Defense Office was notorious for various scandals before the Great Transfer, and the responsibility surely lies with Defense Director Shiranui Kaya. However, it is also true that thanks to her, the Council barely managed to maintain public order in D.U. immediately after the Transfer. Now that the Council's authority is ours, why not grant her partial jurisdiction over Valkyrie's security? Of course, some 'correction' will be necessary first."
KSP_pokemon_correct_momoka: "Correcting Yuraki Momoka"
KSP_pokemon_correct_momoka_flag: "Yuraki Momoka Correction Achieved"
KSP_pokemon_correct_momoka_desc: "The Chief of Transport is a 'slacker' famous both inside and outside the Council. She is competent and knows how to apply her high intelligence, but she also tends to 'forget' her own administrative duties. She doesn't seem to care whether we are on the side of good or evil; if we can just convince her of the current situation and our mandate to maintain order, she might at least handle D.U.'s traffic, right?"
KSP_pokemon_correct_srt: "Correcting SRT"
KSP_pokemon_correct_srt_desc: "As a paramilitary organization directly under the GSC President, SRT Special Academy has been involved in numerous 'unsolved cases'—some even we are unaware of. Having been independent of the Council since the President's disappearance, this institution holds several experienced special forces squads. Wouldn't it be wise to give them work? Even if it requires the drastic measure of consolidation."
KSP_pokemon_correct_abydos: "Correcting Abydos"
KSP_pokemon_correct_abydos_desc: "Once the greatest academy in Kivotos, it has fallen to the bottom of the desert. Five students, who fought desperately to protect their school from Kaiser Industries before the Great Transfer, have entered the Correctional Bureau. They have agreed to cooperate with us on the condition that we guarantee the autonomy of the old Abydos region. Along with the industrial facilities of old Bohemia, the members of the Abydos Foreclosure Task Force—though few—will be more helpful than anyone else."
KSP_pokemon_correct_gehenna: "Correcting the Disciplinary Committee"
KSP_pokemon_correct_gehenna_desc: "The Disciplinary Committee, Gehenna Academy's unofficial military group that greatly aided in maintaining order in former German territories, has ended up as prisoners after walking a different path. The Head of the Disciplinary Committee is likely stronger than anyone in Valkyrie, including the Public Security Director. Though their hostility remains, they are students who could become a great asset. They must become one of us; whether conciliatory measures will work is uncertain, but isn't it worth a try?"
KSP_pokemon_correct_pandemonium: "Correcting Pandemonium"
KSP_pokemon_correct_pandemonium_desc: "The Pandemonium Society, or Manma-jeon, served as Gehenna's student council, handling diplomacy, budget, and administration—until we conquered Gehenna. Under the leadership of Hanuma Makoto, who boasts a 3% voter turnout, they seemed to handle Gehenna's vast administration smoothly, but anyone who knows them says their true specialty is political maneuvering. Whether recruiting them will actually help Valkyrie is questionable, but their tank and artillery units are formidable. At the very least, we are quite interested in bringing them over."
KSP_pokemon_correct_millenium: "Correcting Millennium"
KSP_pokemon_correct_millenium_desc: "Millennium Science School was a massive institution. Above numerous students with dreams, a few geniuses controlled administrative power. It wasn't Millennium's technology, but their genius that dictated the academy's direction. Perhaps they could foresee the future, but they likely didn't expect to become inmates of the Correctional Bureau so soon. It would be a waste to let their talent rot. Why not undo the handcuffs and try a more diplomatic approach?"
KSP_pokemon_correct_white_ghost: "Correcting Hyakkiyako"
KSP_pokemon_correct_white_ghost_desc: "Once a battlefield of numerous branch schools, the Hyakkiyako Allied Academy was formed under the mediation of the Hyakkayouran Conflict Resolution Council. Uniting Hyakkiyako, which seemed impossible without force, was a great achievement, proving the capabilities of the Hyakkayouran, Yin-Yang Club, and other clubs. If recruiting them can stabilize the Hyakkiyako region—currently plagued by the Chirp-chirp—it is a very tempting choice for us."
KSP_pokemon_correct_chinese_mountain: "Correcting Shanhaijing"
KSP_pokemon_correct_chinese_mountain_desc: "While Shanhaijing Senior Secondary School isn't exactly peaceful, their loyalty to the Genryumon is strong. Before the Great Transfer, the Genryumon and the Xuanwu Merchant Association seemed on the verge of civil war due to ideological differences, but now they cause no trouble even when sharing a cell. Perhaps they have accepted our rule. Now is the chance to have our superiority recognized, and the cost of conciliation is not that high."
KSP_pokemon_correct_redwinter: "Correcting Red Winter"
KSP_pokemon_correct_redwinter_desc: "Red Winter Federal Academy was the most democratic nation in Kivotos, with a leader changing every week. After the surrender, when it seemed the Public Security Director's eternal rule would continue, the Labor Party launched a massive strike, which is not good for us. Former Student Council President, Beautification Lead, Secretary, Athletic Lead, Cleaning Lead, Disciplinary Lead, and Meal Lead Renkawa Cherino, having been promised two puddings a day in the Correctional Bureau, offered us advice and cooperation. Following her counsel, we have prepared a sufficient amount of undiluted pudding to demand cooperation from the Labor Party and the students of Red Winter."
KSP_pokemon_correct_trinity: "Correcting Trinity"
KSP_pokemon_correct_trinity_desc: "Trinity General School has long been recognized as one of the three major academies and sought to maintain that status even after the Great Transfer. After sparking wars and friction with neighbors, we finally defeated them despite their resistance against Valkyrie. Fortunately, we know how to silence their outcry. Only three people will be needed."
KSP_pokemon_correct_arius: "Correcting Arius"
KSP_pokemon_correct_arius_desc: "It was truly surprising to see the Arius Branch School—expelled during the Council of Nicaea and discarded by war into the pages of history—reappear after the Great Transfer. Though we annexed the elite forces of Arius, who were nurturing their vengeance against Trinity, we still know little about them. Recruiting them may require an unimaginable amount of effort, but the benefits thereafter are certain."

KSP_annex_cou: "Annexation of the General Student Council"
KSP_annex_cou_decesion: "Decision to Annex the GSC"
KSP_annex_cou_decesion_desc: "Incorporate the General Student Council into Valkyrie. This expands Valkyrie's territory and transfers the Council's authority to Valkyrie."

