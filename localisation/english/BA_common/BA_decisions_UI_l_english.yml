 RED_redwinter_leftwing_2_tooltip: "\n\nCurrent Method: §RRed Terror§!\n§RRed Terror§! consumes §tZenkyoutou§! organization to inflict minor §YIndustrial Damage§! and massive §YStability§! and §YWar Support§! damage on §YTarget Nations§!. Successful terror increases §RFrontline§! influence.\n\n"
 RED_redwinter_leftwing_3_tooltip: "\n\nCurrent Method: §SIdeological Learning Struggle§!\n§SIdeological Learning Struggle§! hosts §YSeminars§! in §YTarget Nations§! to increase §YZenkyoutou Influence§! and §YCommunist Support§!. Successful seminars increase §SCentral§! influence.\n\n"
 RED_redwinter_leftwing_4_tooltip: "\n\nCurrent Method: §pUnited Front Tactics§!\n§pUnited Front Tactics§! seeks alliances with major political parties to achieve §tZenkyoutou§! goals. Successful alliances increase §pPeople's§! influence.\n\n"
 RED_redwinter_leftwing_5_tooltip: "\n\nCurrent Method: §YOrganize Mass Protests§!\n§YOrganize Mass Protests§! consumes organization strength to stage protests. Success depends on §YZenkyoutou Influence§! and §YCommunist Support§!, increasing both upon success.\n\n"
 RED_redwinter_leftwing_6_tooltip: "\n\nCurrent Method: §YInduce Strikes§!\n§YInduce Strikes§! consumes influence to organize strikes. Scale depends on §YZenkyoutou Influence§! and §YCommunist Support§!, inflicting §YIndustrial Penalties§! and §YStability§! damage based on scale.\n\n"
 
