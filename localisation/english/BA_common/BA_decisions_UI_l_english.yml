 RED_redwinter_progress_tt: "§tZenkyoutou Council§!\n\n§RFrontline Faction§! ([?RED_redwinter_progress_LEFT_value]%)\n- The §RFrontline Faction§! is an §Yuncompromising labor§! group that pursues its goals primarily through §Ystruggle§! and §Ystrikes§!.\n\n§SCentral Faction§! ([?RED_redwinter_progress_CENTER_value]%)\n- The §SCentral Faction§! emphasizes §Ybroad cooperation§!, balancing §Ymoderate§! and §Yradical struggle§! lines.\n\n§pPeople's Faction§! ([?RED_redwinter_progress_RIGHT_value]%)\n- The §pPeople's Faction§! operates by §Yjoining mass movements§!, focusing on §Ymoderate propaganda§! and §Yreform§!.\n\nBorn from merging Minori's §RRevolutionary Activism§! with Anarcho-Syndicalism's §tuncompromising revolutionary theory§!, this group inherits the Labor Party's §Yactivist-revolutionary stance§!, leading anti-government protests across nations initiated by socialists.\n\nAs Kivotos undergoes the Great Transfer, existing §Ysocial contradictions§! are surfacing. The §tZenkyoutou§! is a semi-autonomous organization composed of revolutionary students from various academies, supported by the §YRed Winter Central Committee§!.\n\nBeyond §Yideological learning struggles§! within academies, they engage in §Yideological seminars§!, participation in §tworker-peasant rallies§!, §tboycotts§!, §RRed Terror§!, and §Runderground expansion§!, exposing the class decadence and social contradictions of Kivotos to the masses."
 RED_redwinter_organizational_tt: "§tZenkyoutou Organization Strength§! (Current: §Y[?RED_redwinter_organizational_value]§!)\n\n§YOrganization Strength§! determines how many actions the §tZenkyoutou§! can take. It can be used for §Crestructuring§! or organizing more §Cstruggles§!.\n\n§tOrganization Strength§! recovers by §Y[?RED_redwinter_organizational_recovery_value]§! each month, up to §Y[?RED_redwinter_organizational_recovery_max_value]§!. Monthly gains depend on §YOrganizational Policy§!, and the cap varies based on §YZenkyoutou Loyalty§!.\n\nRecovery is currently §Rlimited§! to §Y[?RED_redwinter_organizational_recovery_max_value]§! by §YZenkyoutou Loyalty§!. Base recovery cap is §Y[?RED_redwinter_organizational_max_value]§!."
 RED_redwinter_left_wing_tt: "§YStruggle Method§!\n\n§YStruggle Method§! directs the primary tactics of the §tZenkyoutou§!. All §tZenkyoutou§! activities will follow §Your§! command based on this policy.[RED_redwinter_leftwing_tooltip]"
 RED_redwinter_right_wing_tt: "§YOrganizational Policy§!\n\n§YOrganizational Policy§! specifies how the §tZenkyoutou§! is structured. The organization within §Your§! influence will be structured accordingly.[RED_redwinter_rightwing_tooltip]"

