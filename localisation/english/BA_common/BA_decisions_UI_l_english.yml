 RED_redwinter_rightwing_2_tooltip: "\n\nCurrent Policy: §RUnderground Secret Society§!\n§RUnderground Secret Society§! keeps §tZenkyoutou§! activities hidden. §YStruggle§! costs are reduced, but §tInfluence§! growth is very slow. §RFrontline§! influence increases steadily.\n\n"
 RED_redwinter_rightwing_3_tooltip: "\n\nCurrent Policy: §RVanguard Party§!\n§RVanguard Party§! restructures §tZenkyoutou§! as a vanguard led by elite figures. §SCentral§! influence increases steadily.\n\n"
 RED_redwinter_rightwing_4_tooltip: "\n\nCurrent Policy: §pMass Organization§!\n§RMass Organization§! restructures §tZenkyoutou§! as a popular political party. §tInfluence§! grows very rapidly, but §YStruggle§! costs increase. §pPeople's§! influence increases steadily.\n\n"

