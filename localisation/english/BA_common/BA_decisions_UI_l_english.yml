 TRN_internal_factions_categories: "Tea Party"
 TRN_internal_factions_categories_desc: "\n\n£GFX_decision_header_TRN_Teaparty\n\n\n\n\nThe series of events following the Great Transfer were sufficient to shake the very foundations of the Trinity Triumvirate. Each faction is no longer a partner for cooperation, but an interest group acting for its own benefit. Internal trust has crumbled, and mutual suspicion and checks are becoming increasingly blatant. Will you shake hands and compromise with them, or treat their very existence as a threat and eliminate them? The factions move by their own logic and justifications, but in the end, all that remains is a struggle for power and survival.\n"
