 BA_pb_update_tt: "§CRule, Britannia!§!"
 BA_pb_update_tt_delayed: "§L\"In times of health, one must not forget the times of sickness; on quiet days, one must not forget the days of the storm.\"§!\n\nThis British proverb conveys wisdom regarding health. However, this saying is more than just advice on physical well-being; it is a maxim emphasizing the importance of prevention and preparation. It means that during prosperous times, one should prepare for future risks by anticipating the hardships of sickness. It also carries the deep meaning of remembering that current stability is not eternal, and to live with gratitude for the present.\n\nIn Britain up until October 1935, such maxims might not have resonated strongly. However, after the Great Transfer, the Western powers—including France and Germany—suffered defeats at the hands of otherworldly beings. Germany's government collapsed, leaving no room even for exile. France embarked on a path of exile to North Africa, and Britain could not consider itself entirely safe from the threat.\n\nThen, the Kaiser Corporation's attack targeted Britain, which had been like a sleeping lion. Their surprise assault led to the fall of the Port of Dover, followed by the rapid fall of London. Currently, the British Army Integrated Command rules the nation, but the situation on the front remains grim.\n\nGod Save the King.§!"
 BA_sr_update_tt: "§tRedly §YShining§! Pole Star of the Revolution§!"
 BA_sr_update_tt_delayed: "§L\"In the special situation of a Great War, social contradictions caused by uneven combined development strip off their veils and reveal themselves.\"§!\n§t- Leon Trotsky§!\n\nStudents have arrived in a cold place. The students of Red Winter, who fought a confusing war on the Scandinavian Peninsula without knowing why, have been left isolated in a struggle against a world they are seeing for the first time. However, two weapons have been placed in their hands.\n\nTheir first weapon is Ideology. The students of Red Winter are revolutionaries themselves, seeking to realize the most noble of systems. They are ready to fight to create a state of workers and peasants, a world for the people. And perhaps, they may be able to forge alliances with others in this strange world who share similar ideas.\n\nTheir second weapon is Solidarity. Red Winter has experience operating a large-scale administration and can exert full momentum toward a given goal under a unified plan. Once the reconstruction of the administrative organization is fully complete, Red Winter will demonstrate active potential beyond that of any other academy.\n\nNevertheless, many trials still await Red Winter. For instance,\n\nThe Labor Team led by Yasumori Minori and other anti-government groups continue to throw Red Winter into chaos. If Secretary Renka and Executive Chairperson Cherino's Secretariat cannot overcome the greatest economic collapse to hit Red Winter since the Great Transfer, it is obvious that dissatisfaction will turn to anger, and anger into violence.\n\nFurthermore, a massive bureaucratic inefficiency is inherent within this academy. In the unique circumstances of the Great War, this inefficiency in institutions such as the Military, the Editorial Department, the Public Safety Committee, and the Military Government is becoming amplified and widespread. Unless the petty-bourgeois passivity of the bureaucratic group is overcome, a large-scale failure of the administrative organization is inevitable.\n\nFinally, external snakes surround Red Winter. Within Trinity, there are signs of internal factions growing that align with counter-revolutionary fascism, and local governments remain hostile to Red Winter. For us, a steel-like solidarity to overcome them is indispensable.\n\nLike boys and girls entering puberty, Red Winter and its students are wandering. However, as long as they are armed with ideology and solidarity,\nif they find the §tRedly §YShining§! Pole Star of the Revolution and set their course, Red Winter will move forward at full speed, crushing all obstacles and seizing victory in the struggle.§!"
 BA_ger_update_tt: "§4Cloudy Days§! and §OClear§! §YSunlight§!"
 BA_ger_update_tt_delayed: "§L\"But there is no one to weep for us. Winter cannot last forever. One day we shall joyfully say: Fatherland, thou art mine again.\"§!\n- From 'The Peat Bog Soldiers'\n\nLike a march of the poor, homeless followers of Moses, the Germans are walking through an endless wilderness toward a horizon they can never reach. These \"vagabonds,\" abandoned by everyone and left without a leader, nevertheless take steps toward the horizon because they are still alive. No one knows what actually lies beyond that horizon—but they march nonetheless. Toward that distant horizon, toward Germany.\n\nMoses led the people of Israel from a land of suffering, parting the Red Sea to move toward a new land, carrying the burden of faith. But who is the Moses of the Germans? Surely, a Moses for the Germans will respond and answer their suffering. The final question here is—\n\n§YWho will become the Moses of the Germans?§!\n\nAmidst the weather of §4Cloudy Days§! and §OClear§! §YSunlight§!, the Germans will be able to find the answer.§!"
