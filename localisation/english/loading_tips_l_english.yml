 LOADING_TIP_86:0 "Life is disaster.\n- Aoba Utsumi"
 LOADING_TIP_87:0 "There's an autopilot system, but I don't really use it. Because it's no fun, right? Driving should be done with your own hands.\n- Nozomi Tachibana"
 LOADING_TIP_88:0 "Highlander Railroad Academy—Hikari Tachibana, En—tering—\n- Hikari Tachibana"
 LOADING_TIP_89:0 "Don't worry. You will not die. I won't allow it. It shouldn't be the hero who vanishes, but the tool that destroys the world.\n- Kei"
 LOADING_TIP_90:0 "I am a single will created under the banner, a pilgrim of the kingdom that has reached the end of the world. The name I testify for myself is... Malkuth.\n- Malkuth"
