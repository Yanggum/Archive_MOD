l_english:
 LOADING_TIP_0:0 "Welcome, Sensei. I'm counting on you again today.\n- Shiroko Sunaookami"
 LOADING_TIP_1:0 "I wonder where a good place for a nap would be...\n- Hoshino Takanashi"
 LOADING_TIP_2:0 "I'm Serika Kuromi. Just so you know, as long as I'm with you, you'd better do things properly, okay?\n- Serika Kuromi"
 LOADING_TIP_3:0 "Have a great day, Sensei! You can leave everything to me.\n- Nonomi Izayoi"
 LOADING_TIP_4:0 "I will make sure to keep track of the schedule as well.\n- Ayane Okusora"
 LOADING_TIP_5:0 "Well, Sensei? This is what it means to be in a league of one's own.\n- Aru Rikuhachima"
 LOADING_TIP_6:0 "Ta-da! Finally here! Now, let's have some fun, Sensei!\n- Mutsuki Asagi"
 LOADING_TIP_7:0 "It's nice not being tied down or getting hurt, but... being alone is still lonely...\n- Kayoko Onikata"
 LOADING_TIP_8:0 "U-Um, is it really okay for me to be here? If you find me useless, p-please tell me anytime...\n- Haruka Igusa"
 LOADING_TIP_9:0 "H-Happy New Year, Sensei..! To think you'd call for me specifically... I'm so sorry!! ...Ah?! T-Thank you!\n- Haruka Igusa"
 LOADING_TIP_10:0 "U-Um... did you really call for me? You haven't made a mistake, have you?\n- Haruka Igusa"
 LOADING_TIP_11:0 "Head Prefect, Hina. You likely know my name already... I look forward to working with you.\n- Hina Sorasaki"
 LOADING_TIP_12:0 "Ugh... Nngh, haah... You're asking if it hurt? As if a Gehenna Prefect would be bothered by something like this!\n- Iori Shiromi"
 LOADING_TIP_13:0 "Please tell me if things get difficult. Taking care of that is part of my role as well.\n- Ako Amau"
 LOADING_TIP_14:0 "Welcome to the Gourmet Research Society. Shall we embark on an adventure in search of the ultimate flavor?\n- Haruna Kurodate"
 LOADING_TIP_15:0 "What?! W-Wait a minute! This isn't what we agreed on! A w-walk?! Are you serious?! Like this?!\n- Ako Amau"
 LOADING_TIP_16:0 "I'm Fuuka from the School Lunch Club. If there's anything you'd like to eat, please let me know.\n- Fuuka Aikiyo"
 LOADING_TIP_17:0 "Sigh, how did it come to this? Well, since it's already happened, I'll do what needs to be done.\n- Iroha Natsume"
 LOADING_TIP_18:0 "The corpse... No, where is the injured person?\n- Sena Himuro"
 LOADING_TIP_19:0 "Obstacles? Leave them all to me!\n- Megu Shimokura"
 LOADING_TIP_20:0 "Sen~ sei~ Please try a little harder!\n- Yuuka Hayase"
 LOADING_TIP_21:0 "Would you like to journey with me into the world of logic and reason?\n- Noa Ushio"
 LOADING_TIP_22:0 "Making the world more playful!\n- Maki Konuri"
 LOADING_TIP_23:0 "Welcome, Sensei. You arrived approximately 43 seconds earlier than I anticipated.\n- Hare Omagari"
 LOADING_TIP_24:0 "Hehe, I suppose it's time for Millennium's super-genius, delicate, beautiful hacker to take center stage?\n- Himari Akeboshi"
 LOADING_TIP_25:0 "Eimi of the Paranormal Affairs Bureau. On standby.\n- Eimi Izumimoto"
 LOADING_TIP_26:0 "Hah? Are you kidding me?\n- Neru Mikamo"
 LOADING_TIP_27:0 "Hehehe! You really do need me after all!\n- Asuna Ichinose"
 LOADING_TIP_28:0 "My original master is Millennium, but for today... Sensei, you are my Master.\n- Karin Kakudate"
 LOADING_TIP_29:0 "§SLet there be light!§!\n- Aris Tendo"
 LOADING_TIP_30:0 "A super fun story is about to begin!\n- Momoi Saiba"
 LOADING_TIP_31:0 "I'll support Sensei with my best play.\n- Midori Saiba"
 LOADING_TIP_32:0 "I'm Yuzu, the president of the Game Development Department. R-Really... will you take me with you?\n- Yuzu Hanaoka"
 LOADING_TIP_33:0 "I predicted it would be around this time, and I was waiting. For this exact moment... when Sensei calls my name.\n- Hibiki Nekotsuka"
 LOADING_TIP_34:0 "Ahaha... I may be lacking, but... I look forward to working with you.\n- Hifumi Ajitani"
 LOADING_TIP_35:0 "I'm Hanako Urawa. I look forward to our time together in many ways. ...Yes, in 'many' ways.\n- Hanako Urawa"
 LOADING_TIP_36:0 "If everything is in vain, then why are we alive...\n- Azusa Shirasu"
 LOADING_TIP_37:0 "All lewd things are to be incinerated! Incinerated!\n- Koharu Shimoe"
 LOADING_TIP_38:0 "Kyahahaha... \n- Tsurugi Kenzaki"
 LOADING_TIP_39:0 "Hasumi Hanekawa of the Justice Task Force. Awaiting your orders, Sensei.\n- Hasumi Hanekawa"
 LOADING_TIP_40:0 "Have you ever contemplated the nature of shortcake, Sensei?\n- Natsu Yutori"
 LOADING_TIP_41:0 "Don't underestimate me because I'm small! My potential is enormous!\n- Yoshimi Ibaragi"
 LOADING_TIP_42:0 "I hope you have a pious and holy day.\n- Mari Iochi"
 LOADING_TIP_43:0 "Your every move... I am always watching.\n- Sakurako Utazumi"
 LOADING_TIP_44:0 "...Are you well? I bring greetings on behalf of Trinity.\n- Nagisa Kirifuji"
 LOADING_TIP_45:0 "Yep! Did I keep you waiting? It's finally time for me to shine, isn't it? £GFX_BA_star\n- Mika Misono"
 LOADING_TIP_46:0 "Right here, it's like a §PVillain's Entrance§!£GFX_BA_star! Yeah. I'm the mastermind behind all the plans so far.\n-£GFX_BA_mika"
 LOADING_TIP_47:0 "P-Please be a little quieter...\n- Ui Kozeki"
 LOADING_TIP_48:0 "I am Mine Aomori, Captain of the Rescue Knights. Where is the person in need of rescue?\n- Mine Aomori"
 LOADING_TIP_49:0 "Well, what matters is how I feel right now. Because of you, Sensei, Serina is very happy right now!\n- Serina Sumi"
