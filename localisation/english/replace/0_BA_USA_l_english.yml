#Events

 USA_recover_from_2nd_great_depression_tt: "All industrial decisions related to §Y$USA_recover_from_2nd_great_depression_categorie$§! will be deactivated."
 
 usa_chroma_event.2.t: "Economic Reconstruction Obstructed"
 usa_chroma_event.2.d: "In the current situation where our nation is under attack, plans for economic reconstruction can no longer proceed. While those plans might be resumed if peace returns, for now, we must focus primarily on military production."
 usa_chroma_event.2.a: "Let's aim for a wartime economic boom at least."

 usa_event.1.t: "A Single Declaration Brought Before Congress"
 usa_event.1.d: "Otherworldly beings have suddenly invaded the European continent and are oppressing the suffering Europeans. \n\nThe reason we have remained still until now was not because we were afraid of them, but to ensure the liberation of the Europeans—no, all of humanity. \n\nNow, we have been patient and created the optimal situation. The time for liberation has arrived!"
 usa_event.1: "The war to end war (The war to end all wars)"

 usa_event.2.t: "Signs of Additional Economic Crisis"
 usa_event.2.d: "Due to the disappearance of the European market, major American trading companies have begun to take massive hits. With export routes blocked and profits plummeting, small investors are going bankrupt one after another. They are now being driven to the streets one by one, and their anxiety is growing. Signs of economic crisis are being captured everywhere, and general market instability is heightening."
 usa_event.2.a: "This feels ominous..."

 usa_event.3.t: "Omen of Economic Collapse"
 usa_event.3.d: "The collapse of the European market was not a mere temporary shock. As trading companies begin to go under, numerous small investors who relied on them are going bankrupt in a chain reaction. The financial market is gradually shrinking, and the foundations of the American economy have begun to shake. Everything seems fine on the surface, but the anxiety that the economy is slowly collapsing beneath the water is growing."
 usa_event.3.a: "Everything will be okay..."

 usa_event.4.t: "Second Great Depression"
 usa_event.4.d: "As unidentified aliens destroyed the old order and occupied Europe, most of the European assets held by American investors have turned into scrap paper. In this unprecedented event where all financial exchanges in London, Berlin, and Paris exploded together, the New York Stock Exchange has become a ruin through the aftermath alone, and Wall Street has fallen into a moribund state.\n\nFurthermore, as all trade and transactions conducted with each European country have stopped, the United States was instantly ousted from the giant market of Europe. Numerous companies are on the verge of bankruptcy because they cannot receive payments for the goods they produced, and even more factories have already stopped operating.\n\nNow, all citizens of the United States can see. The Second Great Depression has arrived."
 usa_event.4.a: "Is this year 1929?"

 usa_event.5.t: "Streets that no longer shine"
 usa_event.5.d: "The Port of New Jersey in New York, which used to shine every day with lighthouses and numerous lights, can no longer regain its former light. Europe, the main export destination, has vanished, and other markets could not handle the demand for European goods.\n\nIt is only natural that numerous trading companies in the United States have gone bankrupt and, as a result, the port has become emptily hollow.\n\nSince the Port of New Jersey, a major port in New York, has completely collapsed, our construction of a new Atlantic trade route has failed, and the ruined trading companies will never be revived again."
 usa_event.5.a: "Only ruins remain here."

 usa_event.6.t: "City Full of the Unemployed"
 usa_event.6.d: "Washington D.C., the capital of the United States, was once a vibrant city bustling with numerous workers and businessmen. However, it is now engulfed in darkness and has lost that vitality. In the streets, young people who have given up on employment are wandering, and food made from agricultural products that couldn't find a buyer is barely being distributed at rationing centers.\n\nAmerica's heart no longer seems to beat. Numerous freight trains connecting the East to the West have stopped, and the lights of the brilliantly shining buildings have dimmed.\n\nNumerous companies went bankrupt, and numerous workers were driven to the streets. We are hiring the unemployed through the New Deal, but it is not enough to solve the overflowing supply. America's economy is still trapped in a deep recession, and the road to recovery is long."
 usa_event.6.a: "Even more Hoovervilles have appeared!"

 usa_event.7.t: "Ruination of American Agriculture"
 usa_event.7.d: "The vast Corn Belt of the United States, once a golden-shining field that displayed its status by exporting agricultural products to numerous countries including Europe, gradually declined following the arrival of the Dust Bowl and the disappearance of the European market along with the chain bankruptcies of the livestock industry. They have requested help from the federal government, clinging to the last hope.\n\nHowever, we have no way to help them. Originally, the main consumers importing American crops were Europe, the Soviet Union, and the livestock industry. But Europe has vanished due to war and economic collapse, and the Soviet Union no longer needs our grain. Furthermore, with the livestock industry bankrupt and all major consumers gone, there is no market anywhere that will import American agricultural products.\n\nWe are in a position where we must watch the bankruptcy of giant agricultural corporations. Their grain only piles up in warehouses, and there is no longer a means to save them, nor a world that needs their agricultural products."
 usa_event.7.a: "America's breadbasket, the Corn Belt, is no more."

 usa_event.8.t: "Collapse of the Financial Market"
 usa_event.8.d: "Bank runs and large-scale debt defaults occurring openly across the United States clearly reveal that the American financial system has already completely lost its credit. American banks, which failed to recover the market after the Great Depression, stand at a crossroads of survival while carrying even larger debts. Many banks are being merged with others or closing down and fleeing, and every conceivable disaster is becoming a reality.\n\nNow, we can no longer buy time through methods like issuing secret currency or passing off bad bonds that are happening under the Republican Party's connivance."
 usa_event.8.a: "We're doomed, doomed!"

 usa_event.9.t: "Bankruptcy of the Banks"
 usa_event.9.d: "National City Bank, the heart of New York, finally closed its doors today.\n\nThe collapse of the European market and the recession of New York's port played a decisive role in bringing down this bank. The large-scale withdrawal incidents and the surge of bad bonds that continued for the last few weeks could no longer be hidden. The bank management tried to settle the situation until the last moment, but in the end, all efforts came to nothing.\n\nThe crowds filling the front of the headquarters have now realized they cannot reclaim their deposits. The doors are firmly closed, and the bank has fallen into complete silence.\n\nNow, New York's financial system has taken a fatal hit, and the aftermath is spreading rapidly. The bankruptcy of National City Bank will not be a simple incident, but a signal flare announcing the collapse of the American economy."
 usa_event.9.a: "They lasted a long time. Though it wasn't enough."

 usa_event.10.t: "Anti-government Protesters"
 usa_event.10.d: "Ordinary daily life can no longer be found on the streets of New York. The urban surroundings, where shantytowns are lined up, are full of poverty and despair. These shantytowns, formed by people exhausted from unemployment and poverty, have become hotbeds of anger and distrust toward the government. Protesters are occupying the streets every day, shouting anti-government slogans.\n\nThe scale of the protests is growing day by day. As anger over government incompetence and economic collapse overlaps, the city is engulfed in constant unrest and violence.\n\nThe police are responding with force to disperse the protesters, but their efforts are now just a routine procedure. When police armed with tear gas and shields push back the protesters, a new protest starts immediately on another street.\n\nClashes between protesters and police repeat endlessly, and the city is becoming increasingly desolate. The term 'ordinary daily life' no longer exists here.\n\nIn this vicious cycle created by government indifference and economic despair, New York has become a city where tension and anxiety are constant. These streets, where the cries of protesters and the sirens of police echo, seem to have reached a point of no return."
 usa_event.10.a: "Can Roosevelt revive hope this time as well?"

 usa_event.11.t: "Death Sentence"
 usa_event.11.d: "Neither the money printed in secret, the capital obtained by selling bad bonds, nor even the nationalization of large banks carried out as a last attempt could stop the fall of the Federal Reserve. Even if we continue to issue dollars, people no longer trust the currency. Even if we try to raise interest rates now, no one will listen to us.\n\nThe US dollar has completely lost its credit and is destined never to be revived. Radical reforms, laissez-faire, and even the nationalization of banks did not solve America's problems. We must now admit it. The fact is that American capital has no choice but to rely not on ourselves, but on our allies.\n\nNow that the major European countries have all collapsed, the newly established nations no longer need our goods. The future of the Union is darkening, and all that remains seems to be the rampage of the southern states where dissatisfaction has piled up."
 usa_event.11.a: "God save America..."

 usa_event.12.t: "Detroit German Riots"
 usa_event.12.d: "Exiled Germans, who transformed into a powerful political group during the civil war period, and the right-wing militias under their influence are currently occupying Detroit and causing unrest.\n\nIf we forcibly suppress them, a 3rd American Civil War might break out. We must make a decision now."
 usa_event.12.a: "Truly, a headache."

 usa_event.13.t: "German Riots Spread to [USA_rising_exiled_germans_2st.GetName]"
 usa_event.13.d: "The German unrest has now expanded to the state of [USA_rising_exiled_germans_2st.GetName]. The more we neglect them, the more they will degenerate into more severe riots."
 usa_event.13.a: "Huh?"

 usa_event.14.t: "3rd Crisis of American Dissolution"
 usa_event.14.d: "The powerful unrest of the Germans and right-wing militias has expanded to the state of [USA_rising_exiled_germans_2st.GetName], and finally, they are calling themselves the All-American Salvation Brigade and are recruiting far-right citizens who follow them.\n\nWe must attack them immediately, or accept all of their demands! Right now!"
 usa_event.14.a: "Oh boy."

 usa_event.15.t: "[FROM.GetName]'s Demand for the Philippines"
 usa_event.15.d: "Taking advantage of our weakened influence in the Philippines while we responded to the European crisis, [FROM.GetName] has sent a diplomatic document demanding we hand over the Philippines to them.\n\nRegarding the document, we have options to abandon the Philippines and hand it over to them, or to prepare for war, however difficult it may be."
 usa_event.15.a: "Abandon the Philippines."
 usa_event.15.b: "Prepare for war."

 usa_event.16.t: "[FROM.GetName]'s Withdrawal from the Philippines"
 usa_event.16.d: "According to our demand, [FROM.GetName] has withdrawn its forces from the Philippines, and we are now free to dispose of the Philippines as we please."
 usa_event.16.a: "Good."

 usa_event.17.t: "[FROM.GetName]'s Refusal of Return"
 usa_event.17.d: "Despite our merciful diplomatic letter, [FROM.GetName] seems determined to go to war with us."
 usa_event.17.a: "An expected reaction."


 usa_event.19.t: "Iroha's Advice"
 usa_event.19.d: "*Sigh*, what a pain... But, since they need me..."
 usa_event.19.a: "According to her advice!"

 usa_event.20.t: "Ibuki Accepts Party Invitation"
 usa_event.20.d: "Gehenna's mascot, Ibuki, attended the party upon our embassy's invitation. \n\nHow can such a cute creature exist? Naturally, she received heavy protection and spent a pleasant time enjoying our party."
 usa_event.20.a: "Ibuki is just so cute!"

 usa_event.21.t: "Industry Solves Consumer Goods Problem"
 usa_event.21.d: "After the Great Depression ended, we have now largely adjusted the consumer goods industry, which was suffering from overproduction."
 usa_event.21.a: "This is just the beginning."

 usa_event.22.t: "Industry Solves Construction Problem"
 usa_event.22.d: "After the Great Depression ended, we settled the land issues of capitalists that couldn't be dealt with and restarted the construction industry."
 usa_event.22.a: "Progress is starting to show."

 usa_event.23.t: "Industry Solves Production Problem"
 usa_event.23.d: "After the Great Depression ended, we implemented efficient employment policies to solve the problems caused by the forced employment of the unemployed."
 usa_event.23.a: "The end is in sight!"

 usa_event.24.t: "Industry Solves All Problems"
 usa_event.24.d: "All side effects of the radical industrial reforms have been resolved. Now, instead of the unemployed and homeless, happy parents and children are beginning to be seen on the streets."
 usa_event.24.a: "Finally!!!"

 usa_event.25.t: "Implementation of the Food Stockpiling Act"
 usa_event.25.d: "As the bankruptcy of agricultural corporations becomes a reality, we need to release the food stockpiled under the Food Stockpiling Act into the market.\n\nAt the time the Food Stockpiling Act was issued, the citizens of the United States questioned the President's policy, but now they will recognize his foresight."
 usa_event.25.a: "Excellent."




 usa_new_civil_event.1.t: "State Withdraws from the Union!"
 usa_new_civil_event.1.desc: "Some states, having created a pan-national union organization called the Human Liberation Front, have sent an ultimatum stating that they have withdrawn from the federal government and cannot cooperate with our foreign policy!\n\nWe must respond to this immediately! We cannot tolerate the division of the Union!"
 usa_new_civil_event.1.a: "Destroy them!"




