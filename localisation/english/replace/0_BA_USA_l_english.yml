l_english:
#Existing Local Edits
 USA_continue_the_new_deal: "Review the New Deal"
 USA_continue_the_new_deal_desc: "While the New Deal was making steady progress, shocking news arrived that all of Europe has been occupied by entities from another world. We now face a second severe threat and must deal with the ensuing financial crisis."
 USA_reestablish_the_gold_standard: "Acknowledge Government Failure"
 USA_reestablish_the_gold_standard_desc: "Admitting that the Democratic Party's New Deal alone cannot rectify the current situation, we will take broader measures for privatization and expanded autonomy. Through this, we can shift our responsibilities."

 USA_gold_standard: "Privatization Measures"
 USA_send_lindbergh_to_germany: "Form Lindbergh Air Wing"
 USA_send_lindbergh_to_germany_desc: "A famous aviator has expressed his intention to gather Air Force exiles from Germany since the last war to study former German aeronautical techniques. We will support this proposal, which is beneficial to us, to expand our military's aeronautical capabilities."
 USA_work_with_the_bund: "Support of German-Americans"
 USA_work_with_the_bund_desc: "Clear distinction and appropriate support for German exiles will tell German-Americans where we stand. Let's make it clear that we hold them in high regard."
 war_plan_black: "War Plan Black"

 USA_wartime_industry: "Rapid Rearmament"
 USA_wartime_industry_desc: "We managed to save civilian industry, but the defense industry did not fare as well. With anti-Kivotos sentiment running high, now is the time to rapidly grow our wartime industry."



