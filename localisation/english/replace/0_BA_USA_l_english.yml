 USABA_civil_war_idea_tt: "Removed upon the end of the American Civil War:\nCurrently not in a civil war"

 USABA_SOV_enter_american_civilwar: "Request Support from [SOV.GetFactionName]"
 USABA_soviet_equipment_shipments: "Soviet Equipment Shipments"
 USABA_soviet_military_advisors: "Soviet Military Advisors"
 USABA_soviet_recovery_aid: "Soviet Economic Recovery Aid"
 USABA_subvert_soviet_control: "Oust Soviet Control"
 USA_soviet_team: "Union of American Soviet Socialist Republics"

 USABA_so_the_jews_are_the_problem: "So the Jews are the problem!"
 USABA_so_the_jews_are_the_problem_desc: "Germany's defeat in the World War, and even the current decadence of the United States—at the end of every conspiracy, the Jews existed! We must declare them enemies of America!"
 USABA_so_the_jews_are_the_problem_tt: "A §YGerman Nationalist Militia§! will be organized in the capital to aid us."
 USABA_so_the_jews_are_the_problem_red_tt: "\n§RIf the German National Protection Law is not completed quickly after the civil war ends, the right-wing militias and German-Americans will turn into a mob.§!"
 USABA_german_ethnic_union_in_america: "German American Bund"
 USABA_german_ethnic_union_in_america_desc: "Since December 1935, after various German military units and surviving administrative organizations declared the extinction of Germany, many Germans fled the European catastrophe to our United States. We must embrace them and expand the militias to suppress the Boston rebellion."
 USABA_german_ethnic_union_in_america_tt: "§G6§! divisions of the §YGerman Nationalist Militia§! will be created in the capital."
 USABA_german_national_protection_law: "German National Protection Law"
 USABA_german_national_protection_law_desc: "We must draft a protection bill that allows exiled Germans to maintain a 'special' status within the United States until they return to their territory."

 BA_end_USA_congress_tt: "§RThe Congress of the United States is suspended.§!\n§RStability decreases based on the support for Democratic parties.§!"

###### Post Civil War
 USA_soviet_nkvd_in_usa: "Guarantee NKVD Activities in the USA"
 USA_soviet_citi_give_worker: "State Supervision of Workers' Committees"
 USA_soviet_future_soviet_academia: "Future Stalinist Education"
 USA_soviet_stalin_valley: "Stalin Valley"

 #Right-wing
 USA_rising_exiled_germans_state: "German Riots"
 USA_rising_exiled_germans: "German-American Unrest"
 USA_rising_exiled_germans_1st: "Right-wing Consolidation"
 USA_rising_exiled_germans_2st: "Expansion of Riots"
 USA_rising_exiled_germans_3st: "Final Resolution"

 USABA_revolutionaries_of_the_nation: "Revolutionaries of the Nation"
 USABA_strong_propaganda: "Powerful Propaganda"
 USABA_expansion_of_influence_in_america: "Expanding Influence in America"
 USABA_destruction_of_jewish_groups: "Destruction of Jewish Lobby Groups"
 USABA_rise_to_power: "Rise to Power"

 USABA_revolutionaries_of_the_nation_desc: "Two defeats and a flight from Europe. This is clearly a trial for the German nation, and now we must seek a new survival on this distant American continent. We are surely the revolutionaries of the nation, standing on the final frontline for the future of our people."
 USABA_strong_propaganda_desc: "Many media outlets in the United States have degenerated into organs spewing provocative populism since the Great War. It will be easier than expected to make these media outlets move according to our will."
 USABA_expansion_of_influence_in_america_desc: "We must expand our influence beyond the numerous lobby groups in the United States. Whether through propaganda, populism, conspiracy theories, or scandals, we will secure influence in American politics."
 USABA_destruction_of_jewish_groups_desc: "Jewish groups are our most powerful opponents and the arch-enemies of the nation. We will destroy the Jewish lobby groups through continuous attacks using militias and the idolization of militia members."
 USABA_rise_to_power_desc: "Now, it truly begins. This giant United States is being influenced by a few European exiles—the German Committee. We must prepare for a national war to reclaim Europe."

 USABA_joining_hands: "Joining Hands"
 USABA_compromise_plan: "Compromise Plan"
 USABA_controlling_the_far_right: "Checking the Far-Right"
 USABA_attacks_on_conspiracy_theories: "Attacking Conspiracy Theories"
 USABA_limiting_german_militia: "Regulating German Militias"
 USABA_towards_a_new_era_in_america: "America Towards a New Era"

 USABA_joining_hands_desc: "For a powerful evolution of the United States, we must strengthen cooperation with European exiles—especially the Germans."
 USABA_compromise_plan_desc: "While our government cannot pull Germans into our administration, we can help them return to their ancestral lands."
 USABA_controlling_the_far_right_desc: "The German Committee has clearly gone completely insane. Absurd conspiracy theories and the militias that sincerely follow them will surely not be good for the future of the Union."
 USABA_attacks_on_conspiracy_theories_desc: "Their conspiracy theories are weak and full of holes. What do they mean, Hitler fled to the moon? We must exploit the flaws in their logic and dismantle their support groups."
 USABA_limiting_german_militia_desc: "We cannot watch the militias run amok. The US military, police, and National Guard will work together to dismantle the outrages of the right-wing militias."
 USABA_towards_a_new_era_in_america_desc: "Now, at last, a true United States is visible. We must welcome a new era for America and make all the shadows vanish."

 USA_rising_exiled_germans_3st_flag: "3rd American Civil War occurs"
 USA_rising_exiled_germans_3st_flag_NOT: "3rd American Civil War does not occur"
 USABA_german_national_protection_law_tt: "Over time, the §YGerman Representative Committee§! will begin the focuses in its branch."
 USABA_german_ch: "German Representative Committee"
 USABA_revolutionaries_of_the_nation_tt: "§g$GER_leni_riefenstahl$, a prominent film director from Germany's past and now a focal point for German exiles, will be invited to the government.§!"

 USABA_towards_a_new_era_in_america_tt: "The §YGerman Representative Committee§! can no longer complete focuses in its branch."

 USABA_german_ch_idea: "German Representative Committee"
 USABA_german_ch_idea_modifier_tt: "§Y$USABA_german_ch_idea$§! Modifier:"

 USABA_german_government_restored: "Restoration of the German Government"

######################################################
###################### New Focuses ######################
######################################################

 USA_fast_train: "Military Reform"
 USA_fast_train_desc: "Due to excessive disarmament, the military is in a serious situation where both quantity and quality have declined. We will dismiss incompetent commanders and create efficient military programs to raise the level of training."


 USA_army_of_the_united_states_propaganda: "United States Army Military Parade"
 USA_army_of_the_united_states_propaganda_desc: "Praising the overcoming of the Great Depression, we will hold a US Army military parade and begin various lobbying efforts to obtain rearmament costs from Congress."
 





 ##################################
 ########### Communist USA ##############
 #################################
 USABA_forced_wake_up: "Shock Therapy"
 USABA_forced_wake_up_desc: "We will temporarily force the operation of large-scale factories and adjust several industrial sectors. This will cause significant backlash, but it will revitalize the economy for a while."
 
 USABA_force_to_give_job: "Forced Job Creation"
 USABA_force_to_give_job_desc: "With the Great Depression, some factories are overflowing with the unemployed while others suffer from a severe lack of workers. We will use a strategy of forcibly employing the unemployed in factories lacking labor."

 USABA_every_worker_welfare: "Implement Worker Rationing"
 USABA_every_worker_welfare_desc: "Workers are laboring in poor conditions for pittance wages. The current temporary strategy will lead to strikes in the near future. Let's prevent this situation."
 
 USABA_replace_industry: "Industrial Readjustment"
 USABA_replace_industry_desc: "We will massively reorganize various industries to produce scarce food and daily necessities. Although some capitalists will oppose this, it is a necessary measure to overcome the Great Depression."

 USABA_establish_government_industry: "Dispatch Commissars to Enterprises"
 USABA_establish_government_industry_desc: "The Second Great Depression occurred due to the destruction of the European market caused by the Great Transference. To solve the disastrous oversupply, state intervention in corporations is inevitable."

 USA_bad_kivotos_RED: "Follow Red Winter"
 USA_bad_kivotos_RED_desc: "It might seem like a very absurd and stupid choice, but surprisingly, it might be a good one..."

 USA_bad_kivotos_RED_pudding: "Import Red Winter Pudding"
 USA_bad_kivotos_RED_pudding_desc: "We will import and distribute nationwide the Red Winter Federal Academy's pudding, one of its finest trademarks."

 USA_bad_kivotos_RED_more_pudding: "Domestic Pudding Production"
 USA_bad_kivotos_RED_more_pudding_desc: "The Federal Academy pudding is excellent, but transporting it from such a distance results in high costs. We will establish domestic pudding production factories to expand the distribution of Red Winter pudding nationwide."

 USA_be_red: "Communist Party Takes Power"
 USA_be_red_desc: "The Democratic Party failed to handle the Second Great Depression well. Only our Communist Party, which effectively resolved the Second Great Depression, is qualified to lead the government."

 USA_big_industry_plan: "2nd Industrial Readjustment"
 USA_big_industry_plan_desc: "We must efficiently readjust the industrial system created as a temporary measure. While it may cause temporary chaos and problems, it will yield higher efficiency in the near future."
 USA_big_industry_plan_1_tt: "\n90 days after focus completion:"
 USA_big_industry_plan_2_tt: "\n180 days after focus completion:"
 USA_big_industry_plan_3_tt: "\n270 days after focus completion:"
 USA_big_industry_plan_4_tt: "\n360 days after focus completion:"

 USA_final_economic_plan: "3rd Industrial Readjustment"
 USA_final_economic_plan_desc: "We have witnessed the successful achievement of the 2nd Industrial Readjustment. Now, finally, we will reorganize industry with a new economic ideology."
 USA_final_economic_plan_tt: "The National Spirit is improved based on the branch completed after the 2nd Industrial Readjustment."

 USA_the_aggresive_comintern_2: "Anti-Fascist Policy"
 USA_the_aggresive_comintern_2_desc: "In Europe, fascism is on the rise and the persecution of workers continues due to the Great Transference. We must eradicate fascist states that oppress workers."

 USA_the_union_comintern_2: "Support Revolution"
 USA_the_union_comintern_2_desc: "Workers in the majority of countries are living under oppression. We must support them in rising up in revolution against that oppression."

 usa_my_way: "Our Own Path"
 usa_my_way_desc: "Marxism-Leninism has been modified and distorted by dictators. Unlike dictatorial states claiming to be communist, we will become a true utopian state for the workers."

 USA_the_comintern: "Discuss Foreign Policy"
 USA_the_comintern_desc: "While solving our own problems, the international situation has changed drastically, leaving the outlook uncertain. we must look beyond our borders and observe the outside world."

 USA_the_aggresive_comintern: "Aggressive Security Policy"
 USA_the_aggresive_comintern_desc: "An aggressive foreign policy is needed to straighten out the chaotic international situation."

 USA_the_union_comintern: "Appeasement Security Policy"
 USA_the_union_comintern_desc: "Solving a tangled international situation through force only leads to greater problems. We must approach this issue through appeasement."

 USA_modified_capitalism: "Modified Capitalism"
 USA_modified_capitalism_desc: "The state should not just sit by and watch the economy, but interference should also be kept to a minimum. This strategy can alleviate the contradictions of capitalism."

 USA_economic_interventionism: "Fully Planned Economy"
 USA_economic_interventionism_desc: "Now the state must intervene in all industries, not just necessary ones, to match supply and demand. This strategy will prevent worst-case scenarios like the Great Depression by stopping reckless oversupply."

 USA_sov_economy_together: "US-Soviet Joint Industrial Development"
 USA_sov_economy_together_desc: "The Soviet Union successfully led industrialization with the 5-Year Plan, but agriculture was devastated as a result. Joint industrial development by both countries will have only positive effects for both."

 USA_sov_factory_together: "US-Soviet Joint Armament Development"
 USA_sov_factory_together_desc: "We will move beyond civilian industrial development and collaborate with the Soviet Union even on military industries. This will effectively resolve the disarmament that has been ongoing for several years."

 USA_red_team: "An Unexpected Choice"
 USA_red_team_desc: "Neither Europeans, otherworldly beings, nor even we ourselves would have expected this choice. But the only thing we can predict is that they will lose and we will win."




 USA_add_dog: "Invite the Silver Legion"
 USA_add_dog_desc: "We will formally invite fascist movements expanding their influence in the US into the government to secure the power to respond together to the crisis."

 USABA_fireside_chats: "Continuation of Fireside Chats"
 USABA_fireside_chats_desc: "The Fireside Chats were a series of evening radio addresses by President Franklin D. Roosevelt starting in 1933. The radio, which used to speak familiarly to millions of citizens about recovery from the Great Depression and the fear of emergencies, will now speak about overcoming the Second Great Depression."

 USABA_develop_corn_belt: "Emergency Food Stockpiling Act"
 USABA_develop_corn_belt_desc: "As the threat of bankruptcy for large agricultural corporations making up the US Corn Belt becomes real, we must secure food in advance to respond to future food crises in line with the emergency situation."
 USA_2nd_great_depression_4th_end_of_agriculture_endflag: "Bankruptcy of Agricultural Corporations"

 USABA_maintenance_of_isolation_policy: "Maintain Isolationism"
 USABA_maintenance_of_isolation_policy_desc: "The US will distance itself from the chaos and crises of the outside world and focus on its own problems. We will not intervene in international conflicts and will prioritize economic recovery and internal stability. By minimizing external influence, the US seeks to protect itself and achieve economic independence."
 USABA_maintenance_of_isolation_policy_desc_cst: "§gPreparations for the plan for America's economic independence begin.§!"
 
 USABA_massive_bailout: "Massive Bailout"
 USABA_massive_bailout_desc: "To prevent the collapse of the financial system, we will carry out a massive bailout. By rescuing banks and major industries, we will prevent a general economic collapse and restore public trust. This measure will be an essential first step for economic recovery."
 
 USABA_government_propaganda: "Government Propaganda"
 USABA_government_propaganda_desc: "The government will start a powerful propaganda campaign to instill hope and trust in the citizens. We will use all media to promote policies and gain public support to quiet social unrest. We will ensure the people trust and follow the government."
 
 USABA_contact_with_opposition: "Contact the Opposition"
 USABA_contact_with_opposition_desc: "We will achieve bipartisan cooperation through contact with the opposition. Since political stability is necessary in an economic crisis, we will gather the opinions of the opposition and work together to find solutions. Through this, the people will experience unity instead of political division."
 
 USABA_blurring_focus: "Blurring the Focus"
 USABA_blurring_focus_desc: "The government will highlight various issues to distract the public's attention. This will alleviate political pressure and ease public anxiety regarding complex issues. We will prevent the citizens from facing the essence of the crisis directly, thereby reducing social conflict."
 
 USABA_secret_economic_program: "Secret Economic Program"
 USABA_secret_economic_program_desc: "We will implement a secret economic program that has not been officially announced. In secret cooperation with the opposition, we will attempt to secure government finances somehow by issuing bad bonds and printing money. It seems we can buy some time."
 
 USABA_unrestricted_inflation_permitted: "Allow Unrestricted Inflation"
 USABA_unrestricted_inflation_permitted_desc: "To accelerate economic recovery, we will allow unrestricted inflation. Even at the cost of currency value, we will reduce debt burdens and forcibly stimulate economic activity. This is a bold but essential measure."
 USABA_regression_strategy_loweffect_tt: "The number of §YCivilian Factories§! dismantled upon completing the §Y$USABA_regression_strategy$§! focus is reduced."
 
 USABA_expansion_of_state_authority: "Expansion of State Authority"
 USABA_expansion_of_state_authority_desc: "In a situation where the federal government judges problem-solving to be impossible, it will hand over authority to the state governments. The central government will no longer intervene, and each state will solve problems on its own. At least political pressure will decrease."
 
 USABA_regression_strategy: "De-modernization Strategy"
 USABA_regression_strategy_desc: "Leaving behind the complex modern economy, we will return to a self-sufficient economy. We will reorganize resources and industries to ensure the nation's survival and create a simple, stable economic structure. Since our financial industry has already collapsed, this is an essential choice."
 
 USABA_american_reindustrialization: "American Reindustrialization"
 USABA_american_reindustrialization_desc: "To rebuild the American economy, we will pursue a large-scale reindustrialization policy. We will reorganize the economic structure around manufacturing and lead a new economic revival. This is an essential step for America's economic leap forward."
 USABA_american_reindustrialization_desc_cst: "Unlocks a series of decisions for American industrial reconstruction."

 USA_devil_economy: "US-Soviet Economic Cooperation"
 USA_devil_economy_desc: "Stolen from vanilla (Wait, did I just say that? How un-elegant. Let's call it... 'tactical inspiration'.)"

 USA_support_RED: "Aid to Red Winter" 
 USA_support_RED_desc: "Cherino lol (Truly, a leader of... unique stature.)"
 
 USA_support_SOV: "Soviet Support"
 USA_support_SOV_desc: "You can't stop the Soviets when a giant is supporting them."

 USA_old_team_nuclear: "Manhattan Project"
 USA_old_team_nuclear_desc: "We've confirmed that guns and shells have no effect on the otherworldly beings. We need firepower beyond imagination."

#Defending the Old Order
 USA_old_team: "Defend the Old Order"
 USA_old_team_desc: "While otherworldly beings dominate Europe and establish a new order, we in America have been patient. Now is the time to liberate the suffering Europeans—no, all of humanity."

 USA_support_alies: "Support the Allies"
 USA_support_alies_desc: "Britain and France, having lost their home countries and fled to colonies, are burning with resolve to reclaim their lands. We must support them militarily to lay the foundation for the liberation of Europe."

 USA_attack_COU: "Liberate the Benelux"
 USA_attack_COU_desc: "The Low Countries are the only gateway and a strategic point for America to advance easily into an occupied Europe. We must liberate the people of the Low Countries suffering from the invasion and open the gate to Europe."

 USA_support_GEK: "Support Germany"
 USA_support_GEK_desc: "Germany is being divided by two otherworldly powers and massacred as cannon fodder for the Great War. We will support the German refugees and promise the liberation of their homeland."
 
 USA_support_north_europe: "Support Northern Europe"
 USA_support_north_europe_desc: "Norway, Sweden, and Denmark are suffering under otherworldly invasions and radical ideologies. We will secretly support them and look for an opportunity to drive out the Red Plague from Northern Europe."
 
 USA_attack_KAI: "Liberate Britain"
 USA_attack_KAI_desc: "Britain has lost its homeland but still shows a will to fight. Together with them, we will defeat the otherworldly beings and return the ancient lands to the British people."
 
 USA_attack_MIL: "Liberate France"
 USA_attack_MIL_desc: "The French, who once shouted for Liberty, Equality, and Fraternity, have become slaves for emotionless machines. Let's liberate them and show that democracy has not yet set."
 
 USA_attack_TRM: "Liberate East Germany"
 USA_attack_TRM_desc: "The Nazis have finally betrayed humanity and cooperated with the otherworldly beings! Now is the time to prove that justice is alive."

 USA_attack_GEH: "Liberate West Germany"
 USA_attack_GEH_desc: "What the transferred demons did was shoot civilians for no reason. We will liberate the Germans from the demons and drive them out completely."

 USA_support_FIN: "Support Finland"
 USA_support_FIN_desc: "Finland is a country that reclaimed its homeland from the invaders on the Scandinavian Peninsula, but their military capability is not at a level to withstand a re-invasion. We will support Finland and use it as a bridgehead to prepare for the liberation of Scandinavia."

 USA_attack_RED: "Liberate Northern Europe"
 USA_attack_RED_desc: "After a long wait, preparations for the liberation of Scandinavia are complete. It is time to liberate our precious democracy against the otherworldly beings spreading the Red Plague."

 USA_old_team_guardian: "Declaration of Victory"
 USA_old_team_guardian_desc: "Much time has passed since the Great Transference and the total war against the otherworldly beings began. Despite all the enemy's strategies and tactics, our military has won. America has once again triumphed over the oppressors threatening freedom!"

 USA_marshall_plan: "Marshall Plan"
 USA_marshall_plan_desc: "The war is won, but the situation in Europe is not good. At this rate, another war might break out due to further conflict. The 'Marshall Plan' proposed by George Marshall will provide economic support to European nations to restore them to their pre-Transference state."

 USA_attack_abyss: "The Final War"
 USA_attack_abyss_desc: "There was a separate, true enemy. An indescribable horror overwhelms us, but we must do this."

 USA_Pax_Americana: "§CPax§! §tAmericana§!"
 USA_Pax_Americana_desc: "After numerous wars and bloodshed, Europe and the world are overcoming the otherworldly invasion and healing its scars under the leadership of the great United States. The era of the 'American-led New Order' has arrived, breaking away from the old order led by colonial empires.\n§CPax§! §tAmericana!!§!"


 #Joining the New Order
 USA_new_team: "Join the New Order"
 USA_new_team_desc: "The empires of the Europeans, who once gripped the world order with powerful national strength, have collapsed due to the Great Transference. We must establish a new order by forming friendly relations with those who brought down the old order.\n§RWe will give up everything for the greater cause. Will you join us?§R"

 USA_new_team_TV: "Propaganda"
 USA_new_team_TV_desc: "There are still quite a few people who question friendship with the otherworldly beings. Through a bit of propaganda, we can highlight the benefits of friendship and bring them to our side."

 USA_new_team_marry: "Propose Otherworldly Bill"
 USA_new_team_marry_desc: "Some otherworldly beings crossing into America are very ambiguous entities lingering on the edge of local laws. Special legislation for them is needed to protect them legally and prevent future confusion."

 USA_new_team_anime: "Screen Animation"
 USA_new_team_anime_desc: "The video of Kisaki, the Master of Shanhaijing, performing her stretches is gaining sensational popularity regardless of age or gender. To dispel prejudices about otherworldly beings, we must screen this video."

 USA_new_team_civilwar: "Determination"
 USA_new_team_civilwar_desc: "For a better future, we have made difficult decisions so far. Now is the time to take the final step. Everyone points at us and condemns us as traitors who abandoned humanity, but in the end, they will know we were right.\n§RAll preparations are complete. Time to throw the dice!§!"
 USA_new_team_civilwar_tt:0 "§RA civil war breaks out immediately!§!\n"
 
 USA_new_team_threat: "Persuasion and Conciliation"
 USA_new_team_threat_desc: "There are still congressmen who oppose the government's decision. They might be persuaded if we emphasize the better future a US aligned with the New Order can show."

 USA_new_team_help: "Request Volunteers from the New Order"
 USA_new_team_help_desc: "To show our sincerity, we even pointed guns at our own family. Now it's our turn to confirm their sincerity."

 USA_blue_kivotos: "Democratic New Order"
 USA_blue_kivotos_desc: "Among the otherworldly beings, there exist political systems very similar to our own. If we join the New Order with them, there will be no friction regarding ideology."

 USA_bad_kivotos: "National New Order"
 USA_bad_kivotos_desc: "To follow the New Order, we might have to cast off our original ideology and face them. Even if that ideology is one we've shed blood for centuries to preserve."

 USA_blue_kivotos_MIL: "Follow Millennium"
 USA_blue_kivotos_MIL_desc: "If we join Millennium Science School, which possesses overwhelming scientific technology even compared to other otherworldly beings, there will be great progress in America's technological power."

 USA_bad_kivotos_Eden: "Follow the Eden Treaty"
 USA_bad_kivotos_Eden_desc: "Two nations that seemed incapable of peace and coexistence have joined hands. Since no stronger alliance currently exists among the otherworldly nations, we will preserve our national strength by joining the order they lead."

 USA_bad_kivotos_COU: "Follow the General Student Council"
 USA_bad_kivotos_COU_desc: "The General Student Council was the nation with the highest authority among the otherworldly beings. We must help their reconstruction to build a friendly relationship and gain the authority to intervene in other otherworldly nations."

 USA_bad_kivotos_GEM: "Follow Gehenna"
 USA_bad_kivotos_GEM_desc: "Since ancient times, the world has operated on the law of the jungle. We must join Gehenna, which has known this fact for a long time and follows this law."

 USA_bad_kivotos_TRM: "Follow Trinity"
 USA_bad_kivotos_TRM_desc: "They are the models of the New Order, with their kind hearts and elegant angelic appearances. Let's follow them."

 USA_bad_kivotos_support_hina: "Choose Hina"
 USA_bad_kivotos_support_hina_desc: "The more we studied Gehenna, the greater the disappointment grew. However, the Prefect Team is a competent group, unlike Pandemonium Society. Let's follow their leader, Hina."

 USA_bad_kivotos_support_makoto: "Choose Makoto"
 USA_bad_kivotos_support_makoto_desc: "To be honest, Makoto is on the incompetent side. But as someone who holds power over unruly demons and occasionally shows surprising insight, she is someone we can trust and follow."
 
 USA_bad_kivotos_support_mika: "Choose Mika"
 USA_bad_kivotos_support_mika_desc: "Contrary to our thoughts, Mika was as emotional and innocent as a princess from a fairy tale. But a weak heart does not mean weak power. We must follow her."

 USA_bad_kivotos_support_hina_2: "Seek Advice from Prefect Team Members"
 USA_bad_kivotos_support_hina_2_desc: "It's not just Hina who is competent. By inviting the Prefect Team members, we can restore the homeland ruined by civil war."

 USA_bad_kivotos_GEH_halo_infantry: "Prefect Team Combined Arms"
 USA_bad_kivotos_GEH_halo_infantry_desc: "Now the Prefect Team members are well-trained enough to train alongside the US Army. If we conduct joint training, there will be much for both sides to gain."
 
 USA_bad_kivotos_GEM_tank: "Introduce Pandemonium Heavy Tanks"
 USA_bad_kivotos_GEM_tank_desc: "What we should pay attention to is Gehenna's heavy tank battalion. Let's carry out a major military reorganization by designing heavy tanks based on Gehenna's heavy tank, the Toramaru."

 USA_bad_kivotos_GEM_halo_infantry: "Gehenna Combined Arms"
 USA_bad_kivotos_GEM_halo_infantry_desc: "Gehenna only lacks overwhelming superhumans; their troops and military technology themselves are on the superior side. Let's reorganize the US military through cooperation with Gehenna's military technology."

 USA_bad_kivotos_support_iroha: "The Chief Executive of Gehenna"
 USA_bad_kivotos_support_iroha_desc: "Iroha is one of the few sensible people in Pandemonium Society and a competent Chief Executive. If we seek her advice and implement policies, we can easily resolve the aftermath of the civil war."
 
 USA_bad_kivotos_support_ibuki: "The Grand Duchess of Gehenna"
 USA_bad_kivotos_support_ibuki_desc: "Is there any other being in this world as cute as her? Let's invite Ibuki to a party. Her presence will be a great support for the American people."
 
 USA_bad_kivotos_support_GEM_club: "Create Club Lobby Groups"
 USA_bad_kivotos_support_GEM_club_desc: "They are objects of caution within Gehenna—no, in all academies—but individually, they are quite competent. Let's create lobby groups so they can display their talents."

 USA_bad_kivotos_totalwar: "Declaration of Total War"
 USA_bad_kivotos_totalwar_desc: "We must discard the old order and follow the new one. Not just in words, but through action by everyone, young and old."
 
 USA_bad_kivotos_support_TRM_club: "Cooperate with the Library Committee"
 USA_bad_kivotos_support_TRM_club_desc: "The Trinity Library Committee is a very large and strict club. We will sign a formal treaty with Trinity to share their knowledge."

 USA_bad_kivotos_TRM_halo_infantry: "Trinity Combined Arms"
 USA_bad_kivotos_TRM_halo_infantry_desc: "Trinity students are generally gentle, but their military power is at a high level. We will focus especially on their outstanding ability to support allies and conduct combined arms together."

 USA_bad_kivotos_justice: "Cooperate with the Justice Task Force"
 USA_bad_kivotos_justice_desc: "The Justice Task Force is an autonomous police organization with great martial prowess. Cooperating with them will allow us to oust anti-state forces."

 USA_bad_kivotos_justice_sword: "The Sword of Trinity"
 USA_bad_kivotos_justice_sword_desc: "Let's become the Sword of Trinity. We will eliminate all forces threatening Trinity."

 USA_bad_kivotos_halo_infantry_2: "The 'Third Way'"
 USA_bad_kivotos_halo_infantry_2_desc: "Let's organize new regiments applying the technology of the New Order and incorporate the lessons from joint training. We are now walking the path that no one else has taken!"

 USA_bad_kivotos_GEH_hina_learn: "Invite Hina to the Military Academy"
 USA_bad_kivotos_GEH_hina_learn_desc: "The Prefect Team is practically maintained by the martial power of Hina alone. Let's invite her to the military academy to cultivate the abilities of our commanders."

 USA_bad_kivotos_GEH_halo_infantry_support: "Prefect Team Military Instruction"
 USA_bad_kivotos_GEH_halo_infantry_support_desc: "The martial power of the Prefect Team members is much lower than we expected. Let's guide them and provide instruction on basic physical strength and tactics."

 USA_blue_kivotos_MIL2: "US-Millennium Garrison Treaty"
 USA_blue_kivotos_MIL2_desc: "Let's wipe out all those pesky Red resistance fighters, their common nuisance."

 USA_blue_kivotos_MIL3: "US-Millennium Research Agreement"
 USA_blue_kivotos_MIL3_desc: "Their scientific technology is like magic."

 USA_blue_kivotos_MIL3_halo: "Understand the Mystic"
 USA_blue_kivotos_MIL3_halo_desc: "This is an opportunity to uncover the secrets of the otherworldly beings who suddenly appeared."

 USA_blue_kivotos_MIL3_rocket: "Satellite Development"
 USA_blue_kivotos_MIL3_rocket_desc: "Have you ever imagined it? Leaving the traces of humanity in space, which we could only follow with our eyes!"

 USA_bad_kivotos_halo_infantry_division: "Understand Halo Infantry"
 USA_bad_kivotos_halo_infantry_division_desc: "Artillery has become fireworks, and tanks have become scrap metal. In the near future, halo soldiers will lead the war!"

 USA_bad_kivotos_support_Mika: "Support Mika"
 USA_bad_kivotos_support_Mika_desc: "We must become the knights who protect her, who is practically an angel."

 USA_bad_kivotos_Mika_fanclub: "Form Mika's Royal Guard"
 USA_bad_kivotos_Mika_fanclub_desc: "Following her instructions silently without doubt and clearing obstacles. That is our mission."

 USA_support_brazil: "Support South America"
 USA_support_brazil_desc: "With Brazil's alchemy technology, we'll beat the New Order in no time."

 USA_support_spain: "Support the Iberian Peninsula"
 USA_support_spain_desc: "The Iberian Peninsula is an important strategic point. Not only that, but if we win over those showing lukewarm reactions, there will be many more willing to join the League of Nations."

 USA_support_ITA: "Support Italy"
 USA_support_ITA_desc: "The only proper Great Power left in Europe is now Italy. We must join hands with them."

 USA_attack_SHA: "Liberate Central Europe"
 USA_attack_SHA_desc: "There are still otherworldly beings in Central Europe. We have an obligation to liberate even the weakest nations."

