#Gehenna Intervention
 USA_war_plan_GEH: "War Plan Pink"
 USA_war_plan_GEH_desc: "Those with the appearance of demons—or perhaps demons themselves—are beings that must be eliminated as a top priority."

#Trinity Intervention
 USA_war_plan_TRM: "War Plan Black"
 USA_war_plan_TRM_desc: "The actions of the Nazis who joined hands with the otherworldly beings can be described as truly anti-human. We have a great cause to purify the Nazis who betrayed humanity and the fallen angels."

#Support German Navy
 USA_war_plan_GEK: "Operation German Restoration"
 USA_war_plan_GEK_desc: "The German Kriegsmarine has sufficient will to reclaim the homeland, but not enough troops to face the opponent. The liberation of Germany needs our help."

#Red Winter Intervention
 USA_war_plan_WIN: "War Plan Cyan"
 USA_war_plan_WIN_desc: "Communism and otherworldly beings—where else could such terrible entities exist?"

