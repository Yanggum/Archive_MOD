#Events
 usa_chroma_event.1.t: "Establishment of the Provisional Government"
 usa_chroma_event.1.d: "After unknown entities completely blew away Washington, the entire United States fell into chaos. As the center of the government vanished instantly, citizens were engulfed in panic and social order gradually collapsed. However, the United States Army did not give up resistance until the end. They succeeded in barely deterring the threat while responding to the attack of the mysterious enemy, the \"Chroma.\"\n\nIn this process, government heads and major figures were able to flee across the Rocky Mountains to the West and began preparing to raise the nation again. In their place of refuge, they established the Provisional Government of the United States and are preparing for a new war by mobilizing all remaining resources.\n\nWhat remains for us is a long war. The fight against the mysterious enemy will never end in a short time, and many sacrifices and hardships will follow. However, America has solidified its resolve. We survived, and now we will advance."
 usa_chroma_event.1.a: "Stop them, by any means necessary!"
 usa_chroma_event.1.b: "Fortunately, the West is safe."

 usa_chroma_event_1_tt: "§YAll politicians§! will either §Yretire§! or join the §Y[USA.GetFlag] Provisional Government§!.\n§YAll naval commanders§! will either §Yretire§! or join the §Y[USA.GetFlag] Provisional Government§!.\n\n"

 usa_chroma_event.3.t: "Victory of the Chroma"
 usa_chroma_event.3.d: "The United States Army resisted fiercely, but despite the military's desperate struggle, they ultimately failed to deter the attack of the Chroma. Those mysterious entities collapsed our defensive lines one by one, and now their reach has come right before our government-in-exile.\n\nFortunately, those terrible beings do not seem to have the intention to advance beyond the Rocky Mountains. Their invasion stopped before the mountains, and we have been able to use this temporary gap to seek new ways.\n\nNow is the time to unite the few remaining territories and plan for the reconstruction of the United States. Our resources are limited, but we can never surrender. We must find a way to regain freedom and prosperity once again on this land."
 usa_chroma_event.3.a: "Can we really do this?"

 usa_chroma_event.4.t: "Restoration of US Congress and Executive Branch"
 usa_chroma_event.4.d: "Amidst many crises, we have succeeded in repelling the Chroma, the mysterious entities that invaded the United States, from our territory.\n\nThis great day will remain in history, and the territory of the United States has once again found its integrity!"
 usa_chroma_event.4.a: "Perfect!"

 usa_chroma_event.5.t: "Provisional Administration?"
 usa_chroma_event.5.d: "Before the sudden invasion of the mysterious beings, many American politicians might interfere with our military operations out of fear. A proposal has just arrived to send all these 'pacifists' across the Rocky Mountains and establish a provisional administrative state to accommodate politicians and refugees, thereby removing all obstacles to our conduct of the war."
 usa_chroma_event.5.a: "Yes, we will use extreme military strategies."
 usa_chroma_event.5.b: "Even accounting for some confusion, no."
 usa_chroma_event.5.c: "We have the power to deal with this situation resolutely."

