 #Focuses
 YUG_western_focus:0 "The Regency Council"
 YUG_western_focus_desc:0 "While Prince Pavle's pro-German policy ended with Germany's collapse, the regency must not end. Petar II is still young and unfit to rule. Therefore, we will restore the tarnished authority of the regent through a Regency Council."
 YUG_expand_the_university_of_ljubljana:0 "Research Support"
 YUG_expand_the_university_of_ljubljana_desc:0 "We must promote technological advancement by supporting domestic research to protect our nation from invaders."
 YUG_establish_the_banovina_of_croatia_desc:0 "We must establish a semi-autonomous body in Croatia to divide and dismantle the Croatian nationalist forces."
 YUG_evolution:0 "Control"
 YUG_join_axis:0 "Approach Italy"
 YUG_join_axis_desc:0 "Many have watched our traditional ally, France, being disastrously driven from the European continent. Previously, a diplomatic alliance with Italy would have been impossible, but in the current situation, no one can object. This will be the final choice to protect Yugoslavia."

 YUG_united_kingdom_tt:0 "Can add our §YCore States§! to the §YCore States§! of §Y[SER.GetNameWithFlag]§!, §Y[SLV.GetNameWithFlag]§!, §Y[CRO.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[KOS.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§!, §Y[HRZ.GetNameWithFlag]§!, §Y[MAC.GetNameWithFlag]§!, §Y[TRA.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§!, and §Y[BUL.GetNameWithFlag]§!."
 #Events
 YUG_event.1.t:0 "Anti-Fascist Popular Front"
 YUG_event.1.d:0 "We advocated for a Popular Front in principle, and a few organizations actually joined. It will certainly be helpful later."
 YUG_event.1.a:0 "But there are so few of them."
 YUG_event.2.t:0 "Purge the Opposition"
 YUG_event.2.d:0 "Within the party, there are opposition members who have fallen for reactionary appeasement and advocate for reform instead of revolution. We will 'dispatch' them to the Soviet Union along with the Bukharinites."
 YUG_event.2.a:0 "Farewell, comrades... forever..."
 YUG_event.3.t:0 "The End of the Royal Family"
 YUG_event.3.d:0 "The great revolution to end the reactionary feudal monarchy has succeeded, and most of the royal family failed to flee abroad during the sudden uprising. How should we handle them?"
 YUG_event.3.a:0 "Execute the royal family."
 YUG_event.3.b:0 "Exile the royal family."
 YUG_event.3.c:0 "Seize their property and let them live as commoners."
 YUG_event.5.t:0 "Yugoslavia's Offer of Support"
 YUG_event.5.d:0 "Yugoslavia, which has been supporting our revolution, has offered direct intervention. We can achieve the revolution by accepting this proposal."
 YUG_event.5.a:0 "Accept the proposal."
 YUG_event.5.b:0 "We are not puppets."
 YUG_event.6.t:0 "The Price of Revolution"
 YUG_event.6.d:0 "Yugoslavia has sent an official letter praising our peaceful change of government but demanding that we completely uproot the opposition within our nation. We can act according to Yugoslavia's orders or become hostile toward them."
 YUG_event.7.d:0 "The [YUG.GetAdjective] government has sent us a proposal to carry out the unification of the Balkans under central government leadership to promote understanding and cooperation among the various peoples of the peninsula. According to [YUG.GetLeader], this plan is the final grand stage of the Balkan Federation, which will leave past conflicts behind and ensure eternal integration and peace. \n[YUG.GetNameDef] is waiting for the [ROOT.GetAdjective] government's response to proceed with the unification of the Balkan Federation."
 YUG_event.10.d:0 "The [FROM.GetAdjective] government has refused to join the United Balkan Federation while maintaining its alliance with us.\nHowever, [FROM.GetLeader] publicly claimed that the Yugoslav government's reaction to this refusal will show whether the true hidden purpose of the Federation is to expand Yugoslavia's borders beyond imagination, or if Yugoslavia truly seeks a single Balkan Socialist Republic regardless of the conditions for joining. In any case, [FROM.GetNameDef] will never give up its independence or cultural identity."

 YUG_event.11.t:0 "[From.GetNameDefCap] Approaches Fascist Powers"
 YUG_event.11.desc:0 "Today, [From.GetLeader] sent a telegram to [Root.Capital.GetName] expressing interest in signing a non-aggression pact with fascist forces. Fearing [SOV.GetAdjective] aggression and rising nationalism within [From.GetLeader.GetHerHis] nation, [From.GetLeader] seeks to align [From.GetLeader.GetHerselfHimself] with [Root.GetNameDef]. Although this does not mean a formal alliance, it will pull [From.GetNameDef] under our sphere of influence and facilitate [From.GetAdjective]'s entry into the [Root.GetFactionName]."
 YUG_event.111.t:0 "Opposition from [From.GetNameDefCap]!"
 YUG_event.111.tripartite_rejection:0 "[From.GetLeader] stated they have \"other thoughts\" regarding [Root.GetAdjective]'s proposal to sign a non-aggression pact with fascist nations and expressed refusal."
 YUG_event.111.allied_objection:0 "Our decision to approach fascist nations has sparked deep controversy inside and outside our country, delegitimizing [Root.GetLeader]'s role as regent for Petar II. Officers of the Yugoslav army declared that Petar II has come of age and, with [From.GetAdjective] support, marched on Belgrade demanding [Root.GetLeader]'s immediate resignation."
 YUG_event.111.allied_objection_no_best:0 "[From.GetLeader] has expressed serious concerns regarding the foreign policy we are pursuing."
 YUG_event.111.a:0 "We have no choice but to accept."
 YUG_event.111.b:0 "Prepare for battle!"
 YUG_event.111.c:0 "Ignore them."
 YUG_event.112.t:0 "[From.GetNameDefCap] Signs Non-Aggression Pact with Fascists"
 YUG_event.112.desc:0 "The [YUG.GetAdjective] government signed a non-aggression pact with fascist nations today. Although this does not yet mean [YUG.GetNameDef] is joining the [From.GetFactionName], it shows that [YUG.GetLeader]'s fascist sympathies and loyalty to the two nations may grow. Many look forward to [Root.GetAdjective]'s response to this troubling development, but so far, only [Root.GetLeader]'s silence echoes regarding this matter."
 YUG_event.112.a:0 "[YUG.GetLeader], you cowardly bastard!"
 YUG_event.112.b:0 "I don't think we need to worry about it."

 YUG_event.12.t:0 "[From.GetNameDefCap] Pledges Loyalty"
 YUG_event.12.desc:0 "The [YUG.GetAdjective] government has requested protection from us. They have asked for [ROOT.GetAdjective] protection in exchange for allowing large-scale interference in their internal affairs."
 YUG_event.12.a:0 "Welcome, [YUG.GetLeader]."
 YUG_event.12.b:0 "Ignore them."

 YUG_event.121.t:0 "[From.GetAdjective] Acceptance!"
 YUG_event.121.desc:0 "Following a long deliberation, [From.GetAdjective] has confirmed that they will provide protection as per our request."
 YUG_event.121.a:0 "The air in Rome is clear indeed."

 YUG_event.122.t:0 "[From.GetAdjective] Refusal!"
 YUG_event.122.desc:0 "It appears that [From.GetAdjective] has decided to reject our request for protection."
 YUG_event.122.a:0 "Oh dear."

 YUG_event.13.t:0 "The Road to the Republic"
 YUG_event.13.desc:0 "Germany has fallen.\nIn the face of the otherworldly invasion, the nation that once sought European hegemony has collapsed without a trace, and along with it, Prince Pavle's pro-German policy that parasitized its shadow has vanished.\n\nThe military is on high alert, and the majority of the remaining forces have moved to Slovenia to block the otherworldly threat.\n\nThe young King remains silent, and the crown can no longer command anyone.\n\nI cannot help but ask.\nWhen has this monarchy ever protected us?\nWhen has this royal family ever carried the burden of the people's suffering?\n\nThere is no authority in this land now. There is only a void.\nAnd the void belongs to the one who reaches out first.\n\nHistory is watching us now.\nWill we cling to a stale state lingering in the King's name,\nor will we build a Republic upon the ruins of the throne?\n\nHesitation is defeat.\nToday, we must choose."
 YUG_event.13.a:0 "History is the record of the victors."

 YUG_event.14.t:0 "The Popular Front"
 YUG_event.14.desc:0 "They ask.\nWhy do we have different names, why do we carry different flags?\n\nBut the more important question is this:\nWho commands us?\nAnd who lives off our hunger?\n\nIn the factories, the workers; in the barracks, the soldiers;\nin the streets, the unemployed bow their heads in their respective places.\nThey have all been taught that they are different,\nbut they receive the same orders and stand facing the same muzzles.\n\nSomeone says:\nNow is not the time to unite.\nFirst, we must distinguish right from wrong.\n\nBut division always started from above,\nand the price was always paid from below.\n\nToday we must choose.\nWill we be defeated in our own names,\nor will we stand against them under a unified line?"
 YUG_event.14.a:0 "Join the Worker's United Front. For you too are a worker!"

 YUG_event.15.t:0 "Placard"
 YUG_event.15.desc:0 "The King is silent, and the people bleed.\n\nThe Regent rules in the King's name.\nBut no one takes responsibility.\n\nThe Monarchy speaks of order,\nbut we have seen only prisons and censorship.\n\nWho ruined this country?\nThe Royal Family.\nThe Monarchists.\nThe Regent who protected them.\n\nWe are no longer subjects.\nThis land does not belong to the King;\nit belongs to the people.\n\nDown with the Regent!\nAbolish the Monarchy!\nEstablish the Republic!"
 YUG_event.15.a:0 "On behalf of the nameless workers, peasants, soldiers, and the masses."

 YUG_event.16.t:0 "A Day in the Life of a Regent"
 YUG_event.16.desc:0 "The car was moving slowly.\nIt stops briefly at a traffic light.\nI look out the window. Familiar streets, familiar faces.\n\nI thought this level of security was enough.\nNo, to be precise, I hoped it was enough.\n\nThe window is open.\nAir comes in.\nMy thoughts loosen for a moment.\nA short, sharp sound.\nThis is not a simple explosion.\nIt's not a warning.\nIt's a sound with clear intent.\n\nMy chest reacts first.\nThen comes the pain.\nI try to grab onto something, but there is no strength in my hands.\n\nAnother gunshot rings out.\nThe glass cracks.\nThe guard's shout is heard, but it does not break down into words.\n\nThe car moves abruptly.\nBut I can no longer move.\n\nMy vision lowers.\nI see the floor,\nand dark red spots spread across the dropped documents.\n\nSentences written in the King's name.\nUpon those sentences,\nmy blood falls.\n\nI was not a King.\nThat fact alone is clear.\n\nThen, for what was this blood meant to be shed?\n\nThought does not reach the end.\nA silence quieter than a gunshot covers everything."
 YUG_event.16.a:0 "I should have just stayed home and looked at paintings..."

 YUG_event.17.t:0 "Division"
 YUG_event.17.desc:0 "The sound of a chair sliding back is heard.\nSomeone stands up from their seat.\n\n\"The monarchy has collapsed. But why does reform always stop?\"\n\nA murmur arises, but he does not stop.\n\n\"Land reform is postponed, union strikes are crushed, and former royal bureaucrats have survived under the name of 'experience.'\"\n\"Is this a coincidence? Or is it because there are still those in this room who have not let go of the monarchists' hands?\"\n\nSomeone protests, but the voice is buried.\n\n\"Anyone who refuses full reform is, regardless of their intent, ultimately helping the monarchy.\"\n\nHe leans on the table.\n\n\"Decide now. Will you go with the people, or will you vanish with the remains of the crown?\"\n\nOnly silence remains in the meeting room."
 YUG_event.17.a:0 "The right-wing forces have betrayed the Popular Front!"

 YUG_event.18.t:0 "The Italian Invasion"
 YUG_event.18.desc:0 "The radio told only the facts.\nItalian troops have crossed the border.\n\nThe city pauses for a moment.\nMachines are turned off in the factories,\ncalculations are delayed in the shops,\nand people in the streets check the same news repeatedly.\n\nOrders come down in the barracks.\nReasons are not explained.\nYet no one asks.\nBecause everyone knows that when war begins, questions are a luxury.\n\nIn the countryside, few words are spoken.\nWar is nothing new.\nThe only difference is that this time it has come closer.\nThe youth look at each other,\nand the elderly recall wars of the past.\n\nIn government offices, documents move quickly.\nStamps are pressed, and phones ring incessantly.\nSome worry about the nation,\nsome worry about the regime,\nand some simply worry about tomorrow.\n\nSome are angry,\nsome are resigned,\nand some quietly prepare.\n\nThe clear fact is that the Italian invasion will change the daily lives of everyone living in this country."
 YUG_event.18.a:0 "Now that it has begun, we shall fight to the end."

 YUG_event.19.t:0 "Declaration of War on Greater Italy"
 YUG_event.19.desc:0 "The decision did not take long.\nThe meeting was short, and the sentence was shorter.\n\nThe declaration of war against Italy has been approved.\n\nTelegrams are sent immediately, diplomatic documents are sealed, and lines on the map now lose their meaning.\n\nIn the cities, news spreads rapidly.\nSome nod, some look out the window for a long time.\nWar has now begun, but people already knew that war would start someday.\n\nPosture changes in the barracks.\nAlerts turn into orders, and waiting turns into movement.\nSoldiers no longer ask questions.\nBecause war has become reality with the declaration.\n\nIn the countryside, bells and radios ring simultaneously.\nThe fact that war is not far off becomes clear for the first time.\n\nIn government offices, the lights do not go out even at night.\nWar is no longer a matter of diplomacy, but a task requiring all functions of the state.\n\nThis decision was not for the regime, nor for ideology.\n\nIt was the answer to a single fact.\n\nThe borders have collapsed, and no other options remain.\n\nThe clear fact is that the war against Italy will change the daily lives of everyone living in this country."
 YUG_event.19.a:0 "This war shall decide everything."

 YUG_event.20.t:0 "Victory and Beyond"
 YUG_event.20.desc:0 "We have won.\n\nIn the rural areas of Serbia, in the mountains of Bosnia, and in the cities of Croatia and Slovenia, we have driven out the Italian army.\n\nWe have crossed the Alps and the Piave River to occupy Venice, Genoa, Bologna, and Florence.\n\nAnd finally, we have occupied Rome, the capital of Italy and the center of thousands of years of European civilization.\n\nOur flag is flying across Italy, a victory parade is being held in Belgrade, and our young men will return home.\n\nBut this victory was not obtained for free.\n\nThere is no space left in the cemeteries, and the hospitals are full of the wounded.\n\nCities were destroyed by Italian bombing, parents lost children, and children lost parents.\n\nNo one will be able to return to how things were before the war.\n\nWhether that was good or bad."
 YUG_event.20.a:0 "Everything has changed, but nevertheless, we have won."

