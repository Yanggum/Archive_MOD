 #Starting Description
 YUG_country_intro_header:0 "Land of the Chaotic South Slavs"
 YUG_country_intro_content:0 "Since the founding of Yugoslavia, few would say the nation has been peaceful, either externally or internally.\nYugoslavia, a nation established in the name of South Slavic unity, suffered from severe internal issues despite its name. Even beautiful colors turn black when too many are mixed together.\nFrom Croats, Slovenes, Bosnians, Montenegrins, Macedonians, to Serbs—Yugoslavia has had no room to breathe due to ethnic and various other problems.\nConfrontations with Macedonians, rising Slovenian nationalism, and the activities of the Croatian far-right Ustashas; Yugoslavia was burning from within.\nIn 1934, King Alexander I was assassinated, and his brother, Prince Pavle, served as regent in place of the 11-year-old Petar II.\nPrince Pavle attempted to extend the Kingdom's life by approaching Germany, which was eyeing Yugoslavia like a prize. That is, until the otherworldly invaders appeared.\nThese sudden arrivals crushed Germany and France, and even the surviving Britain is preparing for exile in Canada.\nIn the midst of such a cataclysm, Prince Pavle was left bewildered but soon deployed the army to the borders of \"Shanhaijing,\" formerly Austria.\nYugoslavia has once again been thrown into a world where the clouds of war are gathering.\nThe still-unresolved ethnic issues make the Yugoslav people lose the strength to unite against the invaders, and our foreign-dependent economy is collapsing as Britain, France, and Germany are trampled by the otherworldly threat.\nIn this situation, Prince Pavle's authority is crumbling, and political conflict has intensified as refugees pour in from the northern borders.\nThe land of the South Slavs has only two futures: to be torn to pieces while suffering from all sorts of maladies, or to finally overcome the crisis and endure."
 YUG_guide:0 "- Establish a political system to determine the future of Yugoslavia.\n   - Regency Council\n      - Strengthen the Radical Union (Completed) \n      - Oust the Fascist PM - Dissolve Parliament (In Progress, Playable) \n      - Oust the Fascist PM - Constitutional Reform (In Progress, Unplayable) \n   - Build the Republic\n      - Reject Left-wing Extremism (In Progress, Unplayable) \n      - Recognize Communist Party (Completed)\n- Resolve internal ethnic issues.\n- Defend Yugoslavia from foreign powers such as Italy.\n- Coexist peacefully with people from the other world or liberate Europeans from them."

 #New Focuses
 YUG_Establishment_of_the_Republic:0 "Establish the Republic"
 YUG_Establishment_of_the_Republic_desc:0 "Prince Pavle's pro-German policy ended when Germany was destroyed by the otherworldly invaders. In this time of chaos, our path will not be a kingdom led by an incompetent regent and a young, immature king, but a full-scale reform through the establishment of a Republic."
 YUG_end_of_compromism:0 "Refuse Compromise"
 YUG_end_of_compromism_desc:0 "Moderates still believe the royal family can function normally as they did during the Great War. This is despite the fact that after the Great War, the royal family practiced tyranny and caused national division, and there is no way the monarchists would agree to our democratic ideals. There is no more compromise with the royal family and its henchmen. The only end to that path is ruin through betrayal and division."
 YUG_recognize_the_soviet_union:0 "Recognize Communist Parties"
 YUG_recognize_the_soviet_union_desc:0 "The League of Communists of Yugoslavia was seen as a major threat to the post-war government, which forcibly dissolved them. However, they can be allies who sympathize with our republican ideals, and we will recognize them as a legal political party for the construction of the Republic."
 YUG_Creating_anti_monarchy_sentiment:0 "Foster Anti-Monarchy Sentiment"
 YUG_Creating_anti_monarchy_sentiment_desc:0 "The royal dictatorship has hindered Yugoslavia's political development for decades. Under the pretext of unifying a multi-ethnic state, the monarchy suppressed opposition and neutralized parliament. We will systematically spread anti-monarchy sentiment to expose that the monarchy no longer represents the future of the Yugoslav people."
 YUG_popular_front:0 "The Popular Front"
 YUG_popular_front_desc:0 "The League of Communists of Yugoslavia is not just a political party. They possess experience in underground struggle that we lack, along with worker cell organizations rooted deep in factories and mines. By uniting with them through a Popular Front under anti-fascist and anti-monarchy banners, we can share their organizational power and struggle experience to effectively expand the anti-regime movement."
 YUG_underground_organization_integration:0 "Integrate Underground Organizations"
 YUG_underground_organization_integration_desc:0 "The parties and groups that joined our cause each possess their own underground struggle organizations. By integrating them under a single command structure, we can transform scattered resistance into an organized and effective struggle. Unified orders and coordinated action will make long-term resistance against the monarchy and fascist forces possible."
 YUG_Assassination_of_the_Regent:0 "Assassinate the Regent"
 YUG_Assassination_of_the_Regent_desc:0 "Finally, the day has arrived. Our underground resistance organizations are already rooted throughout the country, waiting only for the signal. Disappointment and loathing for the royal family among the Yugoslav people have reached their peak, and the regency no longer maintains its legitimacy to rule. The moment of decision has come. It is time to remove the regent and bring down the stale monarchy through a nationwide uprising. Yugoslavia's future will be decided today, in the streets and factories."
 YUG_Establishment_of_the_Republic_Constitution:0 "Draft Republican Constitution"
 YUG_Establishment_of_the_Republic_Constitution_desc:0 "Following the removal of the regent and a nationwide revolution, the young King Petar II had no choice but to give up further rule. We will now officially abolish the monarchy and draft a Republican Constitution based on equality for all and democratic principles. The Yugoslavia ruled by a king is dead. A new nation where the people exercise sovereignty is being born here, and we will declare the start of a new era through this constitution."
 YUG_anti_rightist_struggle:0 "Anti-Rightist Struggle"
 YUG_anti_rightist_struggle_desc:0 "The Republic has been established, but the forces that supported the monarchy have not completely vanished. They have formed reactionary right-wing groups, colluding with capitalists, clergy, and landowners, and continue to influence other right-wing political factions. We must eliminate their organizations and foundations to protect the fruits of the revolution and ensure the survival of the Republic. While 'innocent sacrifices' may occur in the process, the price of neglecting the revolution will be far greater."
 YUG_Seeking_support_from_the_Soviet_Union:0 "Seek Soviet Support"
 YUG_Seeking_support_from_the_Soviet_Union_desc:0 "The Soviet Union knows well what a revolutionary state needs to survive. By gaining their approval and support, we can secure the practical strength to stand against internal reactionaries and external pressures."
 YUG_Create_People_s_Army:0 "Establish Party Army"
 YUG_Create_People_s_Army_desc:0 "The League of Communists of Yugoslavia won over 1/8 of the seats in the 1920 Constituent Assembly but lost all seats due to forced dissolution by the government. Can we guarantee that such a thing won't happen after the Republic is established? To ensure it never happens again, we will infiltrate underground resistance organizations under a unified command, seize the leadership to strengthen our control, and establish a new Party Army with a separate secret command system."
 
 YUG_form_peasant_councils:0 "Establish Peasant Councils"
 YUG_form_peasant_councils_desc:0 "To build an equal Republic, the power of tenant farmers and small-scale farmers in regional politics must be strengthened. By establishing Peasant Councils, we can secure a support base sympathetic to our republican ideals and guarantee equal land ownership."
 
 YUG_Purge_Reactionist_in_Party:0 "Purge Opposition in the Party"
 YUG_Purge_Reactionist_in_Party_desc:0 "There is currently an opposition within the party that objects to our ideals. These opposition members are linked with Bukharinites to attack the current leadership and promote internal division. We will end this division by dispatching them to Moscow."
 YUG_workers_republic:0 "Worker's Republic"
 YUG_workers_republic_desc:0 "As the political influence of the League of Communists of Yugoslavia expands, public opinion that their seats in parliament have been undervalued is growing. Strikes, protests, and street struggles by workers and peasants are occurring nationwide. The League will use its Partisan army to secure control over the entire country."
 YUG_With_Marshal_Tito:0 "With Marshal Tito"
 YUG_With_Marshal_Tito_desc:0 "Tito has proven his leadership by playing a primary role in our seizure of power as the leader of the party and the Party Army. We will elect him as the President of our Republic."
 YUG_federal_defense_council1:0 "Federal Defense Council"
 YUG_federal_defense_council1_desc:0 "The Republic's military is dominated by Serbian generals. By establishing a Federal Defense Council, we can reduce the authority of the Serbian General Staff and ensure equal promotions and more diverse strategies."
 YUG_Peoples_Army_Reorganization:0 "Reorganize the Party Army"
 YUG_Peoples_Army_Reorganization_desc:0 "While the Party Army was a great help in seizing power, it is loosely stitched together from different underground organizations, making its command structure and organization unsystematic, with many poorly trained members. We must reorganize the Party Army into an efficient, trained, and strong military."
 YUG_Partisan_War_Tactics:0 "Partisan War Tactics"
 YUG_Partisan_War_Tactics_desc:0 "We have accumulated experience in underground struggle since the 1920s, and Yugoslavia's terrain is highly suitable for partisan activities. We must create a doctrine that utilizes our experience and terrain to build a foundation for resistance even if an invader occupies our territory."
 YUG_Last_of_Royal_family:0 "The End of the Royalty"
 YUG_Last_of_Royal_family_desc:0 "Now that we have overthrown the incompetent Karađorđević dynasty and established a Worker's Republic in Yugoslavia, we must decide their fate."
 YUG_Brotherhood_And_Unity:0 "Brotherhood and Unity"
 YUG_Brotherhood_And_Unity_desc:0 "Brotherhood and Unity is the official policy regarding relations among the South Slavic peoples and minorities, treating all ethnicities equally and encouraging similarities and interdependence peacefully to overcome national conflict and hatred."
 YUG_Harmony_in_Religion:0 "Interfaith Harmony"
 YUG_Harmony_in_Religion_desc:0 "The South Slavic peoples were under foreign rule for a long time and adopted the religions of their ruling nations. Religion profoundly impacts each ethnic identity, and attacking it hastily would be a grave threat to our stability. We will promote interfaith dialogue to reduce ethnic conflict rather than attacking them unilaterally."
 YUG_state_atheism:0 "Confiscate Religious Property"
 YUG_state_atheism_desc:0 "Religion is the opium of the people. In Yugoslavia, religion serves no role other than escalating ethnic conflict, so we will begin a policy of state atheism by confiscating religious property."
 YUG_Break_authoritarianism:0 "Breaking from Authoritarianism"
 YUG_Break_authoritarianism_desc:0 "Authoritarianism only brings about corruption and decay within the Party. we will abandon authoritarianism for a better Party."
 YUG_workers_self_management:0 "Worker Self-Management System"
 YUG_workers_self_management_desc:0 "Yugoslavia's worker self-management was organized according to the theories of Tito and Edvard Kardelj. Workers have the right to operate their workplaces, running them autonomously and democratically."
 YUG_Centralized_Economy:0 "Economic Centralization"
 YUG_Centralized_Economy_desc:0 "By centralizing the economy, we can construct an efficient economy and strengthen the Party's economic authority."
 YUG_strengthening_of_the_central_party:0 "Strengthen the Central Party"
 YUG_strengthening_of_the_central_party_desc:0 "By concentrating roles and power in the Central Party, we can promote better administration and stability."
 YUG_yugoslavia_expansion:0 "Greater Yugoslav Federal Republic"
 YUG_yugoslavia_expansion_desc:0 "The 'Greater Yugoslav Federal Republic Proposal' is a plan to incorporate our current allies, the Bulgarian and Albanian republics, into the Yugoslav Federal Republic. While there may be opposition from the leading ethnicities of each republic, it is a plan supported by many and necessary for the defense of the revolution."
 YUG_balkan_federation:0 "Federation of Balkan Socialist Republics"
 YUG_balkan_federation_desc:0 "The concept of a Balkan Federation emerged in the late 19th century, with the core goal of establishing a joint federal republic integrating the Balkan Peninsula based on new political integration: internationalism, socialism, social solidarity, and economic equality. We can realize this plan by inducing revolutions in the Balkan states."
 YUG_balkan_defense_training:0 "Balkan Defense"
 YUG_balkan_defense_training_desc:0 "To defend the Balkan Peninsula, we must cooperate with the militaries of other nations. We will establish a doctrine for this and share it with other countries."
 YUG_internationalism:0 "Internationalism"
 YUG_internationalism_desc:0 "We have been liberated, but there are still many workers in the world suffering under oppressors. According to internationalist principles, we can support their liberation and struggle, sometimes by deploying our military to bring about the unity and struggle of the world's workers."
 YUG_industrial_integration:0 "Integrated Industry"
 YUG_industrial_integration_desc:0 "By integrating the industries of Yugoslavia, Bulgaria, and Albania, we can strengthen the economy more efficiently."
 YUG_eradication_of_nationalism:0 "Destroy 'Nationalism'"
 YUG_eradication_of_nationalism_desc:0 "Nationalism is merely a tool of the oppressors. They used the fictional concept of nationality to divide workers and make them fight each other. We will destroy nationalism to eliminate discrimination between ethnicities."
 YUG_equality_among_ethnic_groups:0 "Equality Among Ethnicities"
 YUG_equality_among_ethnic_groups_desc:0 "With the recent incorporation of Bulgaria and Albania into the Federation, major ethnicities of each republic are protesting. We will emphasize equality among ethnicities to improve their treatment and eliminate backlash."


 
 YUG_yugoslavian_nationalism:0 "Yugoslav Nationalism"

 YUG_multinational_state:0 "Multi-Ethnic State"

 YUG_constitutional_monarchy:0 "Constitutional Monarchy"
 YUG_constitutional_monarchy_desc:0 "To establish the constitutional monarchy formed through revision, we will form a grand coalition involving most domestic centrist parties, with Anton Korošec—a former Prime Minister and the first non-Serbian PM—as Prime Minister."

 YUG_Death_of_the_January_6th_Dictatorship:0 "Death of the January 6th Regime"
 YUG_Death_of_the_January_6th_Dictatorship_desc:0 "The January 6th regime is oppressive and, given the current loss of trust in the royalty, only causes instability. We must clear away its remnants and create a new Yugoslavia."
 YUG_Election_Law_Reform:0 "Election Law Reform"
 YUG_Election_Law_Reform_desc:0 "Current election laws and constituencies are biased toward specific ethnicities. To ensure representation for minorities and ethnic equality, election laws must be reformed."
 YUG_Neutralize_the_Royal_Family:0 "Symbolize the Royalty"
 YUG_Neutralize_the_Royal_Family_desc:0 "With trust in the royal family at an all-time low and Petar II being young, we must make the royalty a symbolic entity and prevent its interference in politics."
 YUG_Establishment_of_an_Independent_Constitutional_Court:0 "Establish Independent Constitutional Court"
 YUG_Establishment_of_an_Independent_Constitutional_Court_desc:0 "Establishing an independent constitutional court is necessary for national stability. We must create a court independent of other political calculations."
 YUG_Depoliticization_of_State_Institutions:0 "Depoliticization of State Institutions"
 YUG_Depoliticization_of_State_Institutions_desc:0 "There are currently civil servants with far-right views appointed by the previous Prime Minister. Also, due to incompetent and anti-democratic officials appointed during the previous absolute monarchy, election fraud occurred in 1935. We must dismiss them and provide depoliticization training to civil servants."
 YUG_Special_Committee_on_Eradication_of_Corruption:0 "Special Committee on Anti-Corruption"
 YUG_Special_Committee_on_Eradication_of_Corruption_desc:0 "To completely drive out the corruption prevalent during the absolute monarchy, we must establish a special committee with full powers to conduct a total inspection."
 YUG_Farm_Support_Policy:0 "Farm Support Policy"
 YUG_Farm_Support_Policy_desc:0 "It is said that farming is the foundation of the nation. Since farms are suffering from the global economic downturn, we must provide subsidies to promote agriculture."
 YUG_Agricultural_Modernization:0 "Agricultural Modernization"
 YUG_Agricultural_Modernization_desc:0 "Agricultural modernization is our destiny. We must increase agricultural productivity by introducing tractors and connecting electricity to rural areas."
 YUG_Industrial_Subsidies:0 "Industrial Subsidies"
 YUG_Industrial_Subsidies_desc:0 "While damage to farms continues, the national economy will stagnate without prior industrialization. We must seek industrial development by granting industrial subsidies."
 YUG_Unemployment_Pension:0 "Unemployment Pension"
 YUG_Unemployment_Pension_desc:0 "The domestic unemployment rate is skyrocketing. To maintain the purchasing power of the people, unemployment pensions must be provided."
 YUG_Partial_Removal_of_Press_Censorship:0 "Partial Halt of Press Censorship"
 YUG_Partial_Removal_of_Press_Censorship_desc:0 "Press censorship should be halted in the long term, but since extremist forces are running wild due to the unstable situation, we will halt it partially while leaving room for the state to intervene."
 YUG_Wipe_Out_Fascist_Influence:0 "Wipe Out Fascist Influence"
 YUG_Wipe_Out_Fascist_Influence_desc:0 "The press censorship we maintain can be used to wipe out the influence of domestic and foreign fascist forces."
 YUG_Complete_Removal_of_Press_Censorship:0 "Complete Halt of Press Censorship"
 YUG_Complete_Removal_of_Press_Censorship_desc:0 "By completely halting press censorship, we can show that we are accepting domestic reformist public opinion."
 YUG_Limited_Allowance_of_Communist_Parties:0 "Limited Allowance of Communist Parties"
 YUG_Limited_Allowance_of_Communist_Parties_desc:0 "Communism is the polar opposite of monarchy, but we must recognize them due to their scale. Let us allow their party activities in a limited capacity within the legal sphere."
 YUG_Guaranteeing_Cultural_Autonomy:0 "Guarantee Cultural Autonomy"
 YUG_Guaranteeing_Cultural_Autonomy_desc:0 "We must guarantee cultural autonomy for the ethnicities within the country. Let us permit schools to teach minority languages alongside Serbo-Croatian and allow radio broadcasts in each ethnic language."
 YUG_Special_Committee_on_Religious_Harmony:0 "Special Committee on Religious Harmony"
 YUG_Special_Committee_on_Religious_Harmony_desc:0 "Many religions exist within the country, and most ethnic problems stem from religion. Let us establish a special committee to handle religious issues."
 YUG_Minority_Language_Coverage:0 "Guarantee Minority Languages"
 YUG_Minority_Language_Coverage_desc:0 "Let us guarantee the rights of minorities by permitting the use of their languages in public offices in areas where they are concentrated."
 YUG_Constitution_Reform:0 "Constitutional Reform"
 YUG_Constitution_Reform_desc:0 "Rules are like schedules—they need updating if we want to reach the goal. A-Arona, is this really necessary?"
 YUG_With_Socialist_Party:0 "Negotiate with the Socialist Party"
 YUG_With_Socialist_Party_desc:0 "Mutual aid is the foundation of any club, isn't it? We should reach out to those who share our vision for the workers."
 YUG_Anti_Extremism:0 "Reject Extremism"
 YUG_Antxi_Extremism_desc:0 "We don't need 'troublemakers' disrupting the peace of the academy or the state. Stability is paramount."
 YUG_With_Independent_Democratic_Party:0 "Negotiate with the Independent Democratic Party"
 YUG_With_Independent_Democratic_Party_desc:0 "Diversity in opinions makes for a more interesting festival. Let's see if we can find common ground with our democratic colleagues."
 YUG_Strengthening_Welfare:0 "Strengthen Welfare"
 YUG_Strengthening_Welfare_desc:0 "No student should go to class on an empty stomach! A balanced lunch is the first step toward a peaceful life."
 YUG_alliance_with_the_uk:0 "Join the Allies"
 YUG_alliance_with_the_uk_desc:0 "Sharing tea and biscuits with our friends across the sea is always a delight. A formal alliance with the UK will secure our future."
 YUG_alliance_with_france:0 "Alliance with France"
 YUG_alliance_with_france_desc:0 "Art, culture, and a shared defense—vive la république! We shall stand by our traditional ally once more."

 YUG_oust_the_fascists:0 "Oust the Fascist Prime Minister"
 YUG_oust_the_fascists_desc:0 "The current Prime Minister of Yugoslavia, Milan Stojadinović, has abused his power to fill the public sector with his supporters. He is also called the leader of his party and leads a party army. As he is a threat to the current monarchy, we will dismiss him and appoint another."
 YUG_Strengthening_Radical_Union:0 "Strengthen the Radical Union"
 YUG_Strengthening_Radical_Union_desc:0 "The Yugoslav Radical Union is the party of our current PM, Milan Stojadinović. By supporting it, we can uphold the Regency Council's authority and improve relations with Italy through the PM's fascist policies."
 YUG_regency_council:0 "Rule of the Regency"
 YUG_regency_council_desc:0 "Prince Pavle has proven his ability to rule Yugoslavia. Leaving the still-young king behind, Pavle and the Regency Council will protect the nation."
 YUG_dissolution_of_parliament:0 "Dissolve Parliament"
 YUG_dissolution_of_parliament_desc:0 "The Yugoslav parliament lost its power when PM and Radical Union leader Milan Stojadinović was ousted. It is time to dissolve the unnecessary parliament and return to absolute monarchy."
 YUG_defender_of_all_yugoslavia:0 "Protector of All Yugoslavia"
 YUG_defender_of_all_yugoslavia_desc:0 "The King is the protector of all Yugoslav people and territory. Naturally, the King holds full powers to protect them."
 YUG_Revial_of_the_January_6th_Dictatorship:0 "Revive the January 6th Regime"
 YUG_Revial_of_the_January_6th_Dictatorship_desc:0 "Reviving the January 6th regime and returning to absolute monarchy will help us overcome the crisis we face."
 YUG_Iron_Fist:0 "Iron Fist"
 YUG_Iron_Fist_desc:0 "Those who oppose the introduction of absolute monarchy will kneel before the King's iron fist."
 YUG_Kings_Chetniks:0 "The King's Chetniks"
 YUG_Kings_Chetniks_desc:0 "The Chetniks have been loyal servants of the state and royalty since the days of the Kingdom of Serbia. We can authorize and integrate them into the state system as the hands and feet of the royalty."
 YUG_strengthening_of_parliamentary_powers:0 "Strengthen Parliamentary Powers"

 YUG_pledge_of_allegiance:0 "Pledge of Allegiance"

 YUG_Kings_Goverment:0 "The King's Government"

 YUG_Rewards_For_Loyalty:0 "Rewards for the Loyal"

 YUG_Economic_Centralization:0 "Economic Centralization"

 YUG_Capitalist_Support:0 "Capitalist Support"

 YUG_Capitalist_Suppression:0 "Capitalist Suppression"

 YUG_Acquire_Deliverables:0 "Acquire Deliverables"

 YUG_Industrial_Management:0 "Industrial Management"

 YUG_State_Capitalism:0 "State Capitalism"

 YUG_Agricultural_Subsidy:0 "Agricultural Subsidies"

 YUG_Mining_Mechanization:0 "Mining Mechanization"

 YUG_duce_of_yugoslavia:0 "Duce of Yugoslavia"
 YUG_duce_of_yugoslavia_desc:0 "Milan Stojadinović is called the 'Leader (Vođa)' in the Radical Union. We believe he will make the new Yugoslavia strong, just like the Duce of Italy."
 YUG_yugoslav_nationalism:0 "The Yugoslav Nation"
 YUG_yugoslav_nationalism_desc:0 "The Yugoslav nation originally referred to all Slavic peoples living in Southern Europe, especially the Balkans, such as Serbs and Croats. Now, 'Yugoslav nation' will become a term meaning the Yugoslav people themselves."
 YUG_serbian_nationalism:0 "The Serbian Nation"
 YUG_serbian_nationalism_desc:0 "The Serbs are the most numerous among the peoples of the Kingdom of Yugoslavia. The ethnicity with the most rights in Yugoslavia should also be the Serbs."
 YUG_support_for_chekhnite:0 "Reorganize the Chetniks"
 YUG_support_for_chekhnite_desc:0 "The Chetniks were a monarchist militia founded during the Kingdom of Serbia, with origins dating back to the resistance against the Ottoman Empire. They also assisted the Serbian army as volunteers during the Great War. We can reorganize and utilize them to fit our ideology."
 YUG_state_cooperativeism:0 "State Corporatism"
 YUG_state_cooperativeism_desc:0 "State corporatism emphasizes cooperation between classes while the state controls the economy. Corporatism is the choice for our economy."
 YUG_ORJUNA_reunion:0 "Re-establish Organization of Yugoslav Nationalists"
 YUG_ORJUNA_reunion_desc:0 "ORJUNA was a Yugoslav nationalist group established in 1921 with proto-fascist and anti-communist ideologies. They supported integral Yugoslav nationalism and effectively suppressed Croatian and Slovenian separatists before being dissolved in 1929. Reviving this organization as a tool for the state and party will effectively suppress separatist forces."
 YUG_border_retreat:0 "Border Retreat"
 YUG_border_retreat_desc:0 "We have found the perfect solution to solve both the nationalist problem in Yugoslavia and Italy's territorial claims at once."

 YUG_evolution2:0 "Evolution"
 YUG_evolution2_desc:0 "We must have a stronger state to respond to foreign threats. It is time to create an evolved Yugoslavia where internal division is resolved."
 YUG_power_strengthening:0 "Strengthen Power"
 YUG_power_strengthening_desc:0 "We will strengthen our power by securing firm control over the military."
 YUG_moschettieri_del_duce:0 "Strengthen Militia"
 YUG_moschettieri_del_duce_desc:0 "We must strengthen the militia fighting for our regime to secure our rule."
 YUG_deposition_of_the_king:0 "Depose the King"
 YUG_deposition_of_the_king_desc:0 "The corrupt royal family has long monopolized power, plundering our nation's wealth and treating the masses like slaves. We will now drag them from their throne and move toward a new Yugoslavia."
 YUG_symbol_of_the_nation:0 "Symbol of the Nation"
 YUG_symbol_of_the_nation_desc:0 "The royal family is the symbol of Yugoslavia, the South Slavs, and our military. Ousting them would cause great backlash and could deny the legitimacy of our regime. We will keep them as our symbol."
 YUG_disintegration_of_yugoslavia:0 "Disintegration of Yugoslavia"
 YUG_disintegration_of_yugoslavia_desc:0 "Yugoslavia is merely an artificial and contradictory collection. We will disintegrate Yugoslavia."
 YUG_greater_serbia:0 "Greater Serbia"
 YUG_greater_serbia_desc:0 "Discarding the hollow dream of Yugoslavia, we need to be re-established as a new nation. Regardless of what anyone says, Yugoslavia is ultimately a state for the Serbian people, and it will remain so."
 YUG_serbian_imperialism:0 "Serbian Imperialism"
 YUG_serbian_imperialism_desc:0 "Serbia must grow larger. A comfortable life for the Serbian people requires more land, more resources, and more sacrifice."
 YUG_greater_serbian_defense_force:0 "Serbian Defense Force"
 YUG_greater_serbian_defense_force_desc:0 "We need a larger and stronger military to protect Serbia. We will create a new military for a new fatherland."
 YUG_seeking_alliance_with_italy:0 "Friendship with Italy"

 YUG_invasion_of_BUL:0 "Invasion of Bulgaria"
 YUG_invasion_of_BUL_desc:0 "Bulgaria is constantly eyeing our territory in Macedonia. Furthermore, Bulgaria has the land and resources we need, so we should preemptively invade to ensure national stability."
 YUG_invasion_of_ALB:0 "Invasion of Albania"
 YUG_invasion_of_ALB_desc:0 "Oil is extracted in Albania. We need oil, and Albania has it, so we must invade Albania."
 YUG_invasion_of_HUN:0 "Invasion of Hungary"
 YUG_invasion_of_HUN_desc:0 "Hungary has granaries where the Danube flows and forests for forestry. Large deposits of bauxite are also known to be there. We will invade them to secure resources."
 YUG_invasion_of_ROM:0 "Invasion of Romania"
 YUG_invasion_of_ROM_desc:0 "Romania's Ploiești oil fields are the largest in Europe. With large farmlands along the Danube, we will secure Romania to ensure the happiness of Serbs."
 YUG_invasion_of_GRE:0 "Invasion of Greece"
 YUG_invasion_of_GRE_desc:0 "Greece has a variety of resources. Furthermore, their islands will serve as a foothold for us to expand into the Mediterranean. We will secure Greece."
 YUG_invasion_of_TUR:0 "Pacify the Middle East"
 YUG_invasion_of_TUR_desc:0 "Turkey is the descendant of the Ottoman Empire that enslaved us, and beyond it lies the Middle East with plenty of oil. We will attack Turkey and Middle Eastern states to avenge our people and secure resources for our lives."
 YUG_oath_of_loyalty:0 "Pledge of Loyalty"
 YUG_oath_of_loyalty_desc:0 "We must properly recognize our position in international politics. To the north are hostile otherworldly invaders, to the east is the Soviet Union eyeing Balkan dominance, and to the west is Italy, which took territory from us. Our old allies are now powerless, so pledging loyalty to a friendly Italy is the best way to have our value assessed."
 YUG_strengthening_of_syndicalist_economy:0 "Develop Corporatist Economy"
 YUG_strengthening_of_syndicalist_economy_desc:0 "The corporatist economy has successfully settled in our country, so it is time to reap the fruits. Let's further develop it to strengthen our economy."
 YUG_strengthening_production_plans:0 "The Balkan Arms Factory"
 YUG_strengthening_production_plans_desc:0 "Our country needs supplies to serve as Italy's spearhead in the Balkans. Let us become the Balkan arms factory and produce supplies for the Italian and Yugoslav militaries."
 YUG_resource_production:0 "Resource Production"
 YUG_resource_production_desc:0 "Quite a few resources are deposited in our country. We must mine those resources and supply them to the market."
 YUG_self_sufficient_economy:0 "International Threat"
 YUG_self_sufficient_economy_desc:0 "To respond to international threats, we need a more efficient economy and more officers. We will create an efficient state."

 YUG_Gauge_Standardization:0 "Gauge Standardization"
 YUG_Gauge_Standardization_desc:0 "A railway network with mixed gauges cannot function properly. We must standardize domestic railway gauges."
 YUG_improve_light_industry:0 "Support Automotive Business"
 YUG_improve_light_industry_desc:0 "By supporting the automotive business, we can improve domestic logistics and secure vehicles for the coming war."
 YUG_Improve_Heavy_Industry:0 "Promote Heavy Industry"
 YUG_Improve_Heavy_Industry_desc:0 "A sufficient amount of weapons is needed to protect the nation. By promoting heavy industry, we can lay the foundation for future military industries."
 YUG_Rural_Electrification:0 "Rural Development"
 YUG_Rural_Electrification_desc:0 "We must secure our food security by developing rural areas everywhere. We can increase agricultural output by electrifying the countryside and paving roads for vehicles like tractors and trucks."
 YUG_Serbian_Urbanization:0 "Serbian Urbanization"
 YUG_Serbian_Urbanization_desc:0 "Due to the long Ottoman rule, urbanization and industrialization in Serbia were somewhat delayed compared to the north. Serbian urbanization must be our priority."
 YUG_Northen_Urbanization:0 "Northern Urbanization"
 YUG_Northen_Urbanization_desc:0 "Slovenia and Croatia achieved some industrialization under Austrian and Hungarian rule, but it is lacking compared to other European cities. We must accelerate northern urbanization to secure industrial workers."
 YUG_Bosnia_Urbanization:0 "Bosnian Urbanization"
 YUG_Bosnia_Urbanization_desc:0 "Urbanization and industrialization are delayed in Bosnia due to its rugged terrain. Since Bosnian urbanization is essential for the national economy, we must invest in Bosnia."
 YUG_Sourthen_Urbanization:0 "Southern Urbanization"
 YUG_Sourthen_Urbanization_desc:0 "Southern regions including Montenegro, Macedonia, and Kosovo have not yet escaped the influence of long Ottoman rule. Industries and cities have been neglected for a long time, and land use is inefficient.\nWe must urbanize the southern regions."
 YUG_Expand_Shipyards:0 "Expand Shipyards"
 YUG_Expand_Shipyards_desc:0 "We are adjacent to the Adriatic Sea, and major powers like Italy are eyeing us. We need shipyards to build warships and transports to resist invasion and break through future naval blockades."
 YUG_Construction_Improvements:0 "Construction Improvements"
 YUG_Construction_Improvements_desc:0 "A person cannot live without a home, and necessary goods cannot be produced without a factory. We must improve our national construction capabilities to survive this crisis."
 YUG_Morava_Ironworks:0 "Morava Ironworks"
 YUG_Morava_Ironworks_desc:0 "There are mines producing various resources in the Morava River basin. To utilize the potential of these mines, we must build an ironworks to refine the resources."
 YUG_Improved_Productivity:0 "Improved Productivity"
 YUG_Improved_Productivity_desc:0 "Our national construction capacity has improved, allowing many factories to be built. \n However, productivity does not even reach the heels of other advanced industrial nations. \n We must improve the productivity of our factories to use them more efficiently."
 
 YUG_War_Against_Italy:0 "War Against Italy"
 YUG_War_Against_Italy_desc:0 "Ultimately, the war against Italy was unavoidable. Now that it has happened, we must fight to the end. There is no compromise or surrender. The end of that road is only slavery."
 YUG_National_Emergency_Declaration:0 "National Emergency Declaration"
 YUG_National_Emergency_Declaration_desc:0 "The war with Italy is a matter of survival for our nation and people. We must immediately declare a national emergency and appeal for the unity of all citizens."
 YUG_Hold_the_Line:0 "Hold the Line!"
 YUG_Hold_the_Line_desc:0 "Italian troops are pushing into our territory even now. We cannot be pushed back forever. Let's remember the spirit of Dragutin Gavrilović and the soldiers who launched a desperate charge against the Austro-Hungarian bridgehead in the Battle of Belgrade during the Great War. We will hold the line until our last breath."
 YUG_urgent_mobilization:0 "Urgent Mobilization"
 YUG_urgent_mobilization_desc:0 "The front line is constantly consuming troops. To replace the dead and wounded and provide minimal rest for exhausted units, we must solve the troop shortage problem. Partial measures are not enough. We must summon all available human resources and deploy maximum force to the front."
 YUG_Short_term_production_increase:0 "Short-term Production Increase"
 YUG_Short_term_production_increase_desc:0 "The war is swallowing vast amounts of supplies instantly. Soldiers at the front cannot fight properly without guns, artillery, radios, bandages, ammunition, and countless other supplies. We will regroup and reorganize the rear front to aim for a short-term production increase."
 YUG_One_Gun_One_Man:0 "One Gun Per Man"
 YUG_One_Gun_One_Man_desc:0 "We were able to replace troops through massive mobilization, but they won't function at the front without guns. We must increase gun production so that at least one gun is supplied per person."
 YUG_Scavenging_the_Legacy_of_the_Great_War:0 "Scavenging Great War Legacies"
 YUG_Scavenging_the_Legacy_of_the_Great_War_desc:0 "Military supplies are always in short supply. We will open warehouses storing surplus supplies from the Great War and use what is serviceable."
 YUG_Coastal_Anti_Air_Base:0 "Coastal Anti-Air Base"
 YUG_Coastal_Anti_Air_Base_desc:0 "The Italian Air Force is ravaging our land. While our weak air power cannot intercept their air force, we can resist to some extent by deploying anti-air bases in coastal zones."
 YUG_Molotov_Cocktail_Supply:0 "Molotov Cocktail Supply"
 YUG_Molotov_Cocktail_Supply_desc:0 "Most Italian armor uses gasoline engines, which are vulnerable to flames. We will supply Molotov cocktails as a makeshift anti-tank measure." 
 YUG_Mountain_Gun:0 "Mountain Gun"
 YUG_Mountain_Gun_desc:0 "The territories of Yugoslavia and Italy consist of numerous mountains. If we design artillery specialized for this, we can gain fire superiority in mountainous areas."
 YUG_Strengthening_Communication_Network:0 "Strengthen Communication Network"
 YUG_Strengthening_Communication_Network_desc:0 "Communication is one of the most important elements in modern warfare. We will connect military communication lines nationwide and train signalmen to ensure communication is not cut."
 YUG_Full_Scale_Counterattack:0 "Full-Scale Counterattack"
 YUG_Full_Scale_Counterattack_desc:0 "The Italian army has exhausted itself attacking us. Their ammunition is depleted, they are overflowing with wounded, and morale is at rock bottom. It is now our turn to drive the Italians out of our borders."
 YUG_Climbing_the_Mountain_Alps:0 "Crossing the Alps" 
 YUG_Climbing_the_Mountain_Alps_desc:0 "We succeeded in driving the Italians out of the borders, but now the Alps are blocking us. We will implement mountain warfare training for the entire army and prepare winter equipment. The Alps can no longer stop us."
 YUG_Crossing_the_Piave_River:0 "Crossing the Piave River"
 YUG_Crossing_the_Piave_River_desc:0 "We crossed the Alps and occupied Venice. Now we must cross the Piave River. Let us prepare engineers and pontoon bridges. Over the mountains and across the river, toward victory."
 YUG_Victory_in_Italy:0 "Victory in Italy"
 YUG_Victory_in_Italy_desc:0 "We have won. Now we will organize the lessons learned in Italy and turn them into doctrine to prepare for future wars."


 

  #Vanilla Event Modifications
 DOD_yugoslavia.20.f:0 "We cannot meet their demands."

