 powerful_sublime:0 "강대한 숭고"
 powerful_sublime_desc: "§L일부 학설에 따르면 키보토스의 학생들은 신격의 아바타이며, 헤일로는 그 존재의 이면에 존재하는 신성성을 드러내는 증표라고도 말합니다. 대부분의 키보토스 학생들은 대전이 이후 지구 환경의 부족한 신비에 의해 보조적인 장치를 이용하고 있으나, 일부 위대한 숭고의 힘을 부여받은 학생들은 메마른 신비의 땅에도 불구하고 그 강대한 신비의 편린을 충분한 보조가 있다면 재현할 수 있습니다.§!"
 legendary_sublime:0 "전설적인 숭고"
 legendary_sublime_desc: "§L일부 학설에 따르면 키보토스의 학생들은 신격의 아바타이며, 헤일로는 그 존재의 이면에 존재하는 신성성을 드러내는 증표라고도 말합니다. 대부분의 키보토스 학생들은 대전이 이후 지구 환경의 부족한 신비에 의해 보조적인 장치를 이용하고 있으나, 일부 위대한 숭고의 힘을 부여받은 학생들은 메마른 신비의 땅에도 불구하고 그 강대한 신비의 편린을 충분한 보조가 있다면 재현할 수 있습니다.§!"

