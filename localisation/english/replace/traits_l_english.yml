 GEH_purist: "Purist"
 GEH_purist_l: "Breakwater of the Fatherland\n§gStudent Committee Chairperson Iori Shiromi is the filter that weeds out numerous 'ethnic cultural pollutions' and the farmer who tends the soil where the nation grows.§!"
 GEH_purist_r: "Rebuilder of Gehenna\n§gController Iori Shiromi is the melting pot that fused Gehenna and Deutsch civilizations, and the rebuilder of civilization who eradicated Gehenna-German degenerate culture and stabilized the fatherland.§!"
 GEH_paranoia_ako: "Paranoid Hinaphile"
 GEH_morning_star_club_ako: "Head of the Starlight Club"
 GEH_paranoia_ako_bad: "Broken Senior Administrator"
 GEH_paranoia_ako_good: "Hina's Eternal Companion"
 GEH_friendly_sociopath: "Friendly Sociopath\n§g'Hina' perfectly mimics even the smallest speech habits and actions of the real Hina Sorasaki, playing the 'perfect Prefect Head' admired by the Senior Administrator and all members within the Prefect Team office. However, to her now, all citizens are merely appropriate parts to be used for the Gehenna Prefect Team, and not a shred of humanity can be felt in her attitude toward those who are not members of the Prefect Team.§!"
 GEH_friendly_sociopath_tooltip: "Friendly Sociopath"
 GEH_successor_of_hina: "Hina's Successor"
 GEH_puppet_of_prefect_team: "Powerless Puppet\n§gIroha Natsume's only authority is to sign off on documents from the Planning Department Council.§!"
 GEH_last_hope_of_prefect_team: "The Prefect Team's Last Hope"
 GEH_puppet_leader_hina: "Puppet Leader\n§gSince Ako will do everything for her, why should she care about things like state affairs?§!"
 GEH_ako_partner_leader_hina: "Ako's Partner\n§gAs long as Ako is by her side, Hina will never collapse.§!"
 GEH_pioneer_of_science: "Pioneer of Science\n§gThe Council system is developing with the goal of catching up to Millennium. Despite any difficulties, we will catch up to Millennium's science and technology.§!"
 GEH_yumeji_no_hana: "Flower on the Dream Path\n§gHina Sorasaki overcame the broad veto against Ako that spread from the Prefect Team Intelligence Department to the Deutschland Central Party, achieving happiness for the two of them.§!"
 GEH_the_terrible: "Thunder Emperor"
 GEH_the_guardian_of_freedom: "Guardian of Freedom"
 GEH_puppet_leader_hina_bad: "Puppet Chairperson\n§gHina Sorasaki does not govern the nation by her own will, but is merely a symbolic chairperson representing the 'will of the masses.'§!"
 GEH_military_chairman_hina: "Failed Military Administrator"
 GEH_iori_trait_c_l: "Gehenna Student Committee Chairperson\n§gFollowing Hina Sorasaki's tragic disappearance, Iori Shiromi stepped forward, calling for the protection of 'Pure Kivotos Culture.' She is no longer just an executive head, but the chairperson leading all Gehenna students. Under her leadership, Gehenna will worship the superiority of Kivotos students with halos and be reborn as a powerful military state that excludes all external influences polluting the fatherland.§!"
 GEH_iori_trait_c_r: "Newly Appointed Controller\n§gThe tragedy of Hina Sorasaki left Gehenna with deep wounds and a need for healing. Iori Shiromi has stepped forward to rebuild this broken fatherland. She intends to wash away all the chaos and pollution that broke Hina and prove that only powerful order can save Gehenna.§!"
 GEH_celestial_revolution_trait: "Cultural Revolution"
 GEH_celestial_revolution_trait_1: "Cultural Revolution"
 GEH_celestial_revolution_trait_2: "Cultural Revolution"
 GEH_celestial_revolution_trait_B: "Desire for Freedom"
 GEH_celestial_revolution_trait_C: "Desire for Order"
 GEH_saint_gehenna_academy_A: "Gehenna Student Council President\n§gErika Hatami is considered one of the most compassionate and balanced individuals in a Gehenna where Hina Sorasaki has vanished. As the new Student Council President, she will erase the scars of madness and chaos to set Saint Gehenna Academy right.§!"
 GEH_saint_gehenna_academy_B: "Gehenna Student Council President\n§gChinatsu Hinomiya was nearly stripped of most of her authority after being branded a rebel amidst the madness of hunting for insurrectionists. However, through steady efforts to improve her image, her sincerity was reached, and she will now remain in Saint Gehenna Academy as one who remembers Hina Sorasaki closely.§!"
 GEH_saint_gehenna_academy_C: "Gehenna Student Council President\n§gFuuka Aikiyo is considered the most unusual figure among the candidates for Gehenna Student Council President. Even amidst the chaos, she simply worked to provide a meal for Gehenna students, and as a result, she gained a large support base within Gehenna. There are rumors that during the election period, she received ardent support from the Gourmet Research Society, and that they handled most of the propaganda for her.§!"
 GEH_eternal_hina_sorasaki: "Our Eternal Prefect Head\n§gHina Sorasaki has disappeared, but we have decided to appoint her as our Eternal Prefect Head. The Hina Sorasaki Committee will guide and protect the nation using her past statements and the established methodology of Sorasakism.§!"
 GEH_morning_star_club_A: "Kind Student Council President\n§gKirara Yozakura is considered one of the most compassionate individuals due to various appearances shown during the election campaign. She gained great popularity with 'Youth Gehenna' propaganda while leading the social club known as the Sparkle-Sparkle Club.§!"
 GEH_morning_star_club_B: "Lunch Manager and Student Council President\n§gFuuka Aikiyo received a high approval rating among the candidates for Gehenna Student Council President. She simply worked to provide a meal for Gehenna students, and as a result, she gained a large support base within Gehenna. There are rumors that during the election period, she received ardent support from the Gourmet Research Society, and that they handled most of the propaganda for her.§!"
