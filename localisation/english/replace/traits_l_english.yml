#Gehenna (Prefect Team)
 GEH_military_chairman: "Military Administrator"
 GEH_military_chairman_2: "Warlord Leader"
 GEH_military_chairman_ako: "Citizen in Uniform\n§gHina Sorasaki is not merely a military leader. She is the Chairperson of the Federal Republic and an ardent supporter of parliamentarianism, delegating significant power to councils and supporting technocrats.§!"
 GEH_military_chairman_amau: "Citizen in Uniform\n§gHina Sorasaki is not merely a military leader. As the Council Chairperson defending the Constitution of the Federal Republic, she has become the symbol of law, order, and steadfast controlled democracy.§!"
 GEH_military_chairman_c: "Chairman of the National Defense Commission\n§gHina Sorasaki has devoted herself to defending Gehenna Academy and protecting the fatherland. As the Chairperson of the National Defense Commission and the restrainer of the executive branch, she is putting in broad efforts to stabilize and protect the Gehenna state.§!"
 GEH_military_chairman_cl: "Gehenna Student Council President\n§gHina Sorasaki is the Student Council President of Gehenna Academy and the Head of the Gehenna Prefect Team. Some criticize Hina Sorasaki as a dictator, while others condemn her for being too weak. However, the indisputable fact is that Gehenna Academy remains in its current form only because of Hina Sorasaki's choices.§!"
 GEM_horns_are_new_wings: "Horns are the New Wings\n§gThere is no law stating one cannot be a leader of the Germanic people just because they have horns. She has become the proud leader of all Germans, and now Makoto Hanuma will be remembered forever as the Führer of Germany.§!"
 GEM_horns_are_new_wings_chiaki: "Horns are the New Wings\n§gThere is no law stating one cannot be a leader of Europe just because they have horns. She has become the proud leader of the Pan-German sphere, including Germany, Bavaria, and the Rhine, and now Chiaki Motomiya will be remembered forever in history.§!"
