 GEH_chairman_of_the_people_1: "Steadfast President of the People\n§gIroha Natsume is the founder of the Federation and its first President. As a brilliant giant star standing firm amidst the tides of the Great Struggle, she will govern the Federation.§!"
 GEH_chairman_of_the_people_b_1: "President of the Populace\n§gIroha Natsume is a historical figure supported by two factions and the President of the United States of the Federation. As a gentle leader who embraces everyone amidst the chaos of factional politics, she will govern the Federation.§!"
 GEH_chairman_of_the_people_b_2: "Führer of the People\n§gIroha Natsume is the symbol of the Federal Government and the leader of the newly restored Führer position. While she may not wield powerful authority like the Führers of old, she will mediate the Federation as the most important sovereign of the two factions.§!"
 GEM_coordinator_trait: "Federal State Coordinator"
 GEH_chairman_of_the_people_a: "Leader of the Oak\n§gIroha Natsume is the new symbol of the Germans and the leader of the new nation. Like a strong oak tree, Germany will be deeply rooted in this land forever.§!"
 GEH_chairman_of_the_people_a2: "City of the Heart\n§gIroha Natsume is the seeker for all people of the German Federation and the builder constructing a comfortable paradise for all nations. The brilliant ranks of all federal nations will be protected.§!"
