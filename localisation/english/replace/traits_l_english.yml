 GEH_principle_trait_C: "Harmonist"
 GEH_ako_trait_Z: "Senior Administrator\n§gCurrently serving as the Acting Prefect Head in place of the retired Hina Sorasaki.§!"
 GEH_ako_trait_Y: "Student Council President of Reason\n§gThis is Ako Amau, who became the Student Council President of Gehenna following the former Prefect Head Hina Sorasaki and former Pandemonium Chairman Makoto Hanuma. She is now striving to look at all of Gehenna, rather than just Hina Sorasaki as an individual.§!"
 GEH_ako_trait_X: "Playful Prefect Head\n§gThis is Ako Amau, who became the Prefect Head of Gehenna following the former Head Hina Sorasaki. She is working to fill Hina Sorasaki's vacancy, and often relieves the stress of her work by issuing unreasonable administrative orders to Iori Shiromi.§!"
