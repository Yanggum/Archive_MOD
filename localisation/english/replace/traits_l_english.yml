 RED_bright_polar_star: "Brilliant Red North Star of the Revolution"
 RED_bright_polar_star_desc: "\n §L\"From what does the progress of civilization and the development of history—that is, the 'transformation of society'—originate? It is when the contradictions of society have accumulated.\"\n\n Cherino Renkawa has finally attained enlightenment. Cherino has become a true revolutionary, standing at the center of the academy and the heart of the students as a 'nucleus of unified solidarity,' shining resolutely. The students and the masses have formed an iron-clad alliance around Cherino!\n\n But this does not mean Cherino is practicing oppression and tyranny as before. The people can overthrow and oust her at any time, but the leadership Cherino has shown does not permit it. Through her repeated ideological struggles and studies, she has newly overlaid herself to break through Red Winter's internal contradictions—such as authoritarian organizational structures, conflicts with locals, the gap between ideology and reality, or industrial-economic contradictions—achieving the dazzling feat of resolving the old society into a new one.\n\n Cherino has been reborn as a guide. The masses, wandering amidst contradictions, have finally found the 'North Star of the Revolution' and gripped it firmly in their hands. Now that the direction is known, it is time to move forward!§!"
