 RED_bright_polar_star: "붉게 빛나는 혁명의 북극성"
 RED_bright_polar_star_desc: "\n §L\"문명의 진보와 역사의 발전, 즉 '사회의 변혁'은 무엇으로부터 비롯되는가? - 그것은 사회의 모순이 누적되었을 때이다.\"\n\n 렌카와 체리노는 마침내 계몽하였습니다. 체리노는 진정으로 혁명가가 되었으며, 학원의 중심, 학생들의 중앙에 선 채 '통일단결의 핵'으로서 단호히 빛나고 있습니다. 학생들을 비롯한 민중들은 체리노를 중심으로 강철같은 연대를 이루고 있습니다!\n\n 하지만 이것은 이전과 같이 체리노가 억압과 압제를 이루고 있다는 것이 아닙니다. 민중은 언제나 그녀를 타도하고 축출할 수 있지만, 체리노가 보여준 지도력은 이를 허락하지 않고 있습니다. 체리노는 스스로 거듭한 사상투쟁과 이념학습으로 새로이 덧대어져 붉은겨울의 내적 모순들, 이를 테면 권위주의적 조직구조나 현지인과의 갈등, 이념과 실재의 괴리 혹은 산업-경제적 제모순을 타파하고 구사회를 신사회로 해소하는 눈부신 업적을 이룩하였습니다.\n\n 체리노는 길잡이로 거듭났습니다. 모순들 가운데서 방황하던 민중들은 마침내 '혁명의 북극성'을 찾았고, 그들의 손에 강하게 쥐었습니다. 방향을 알아냈다면, 이제 나아갈 차례례입니다!§!"
