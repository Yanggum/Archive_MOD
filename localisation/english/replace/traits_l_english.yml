 GEM_fortress_of_progress_trait: "The Leader at the Forefront\n§gThe German Federation must not stop. As the standard-bearers leading the flow of all historical transformations and as the line infantry of civilization, we must shoot down our enemies from the very front!§!"
 GEM_leader_of_us_trait: "State Leader\n§gThe leader of the German state and the hope of Gehenna, bearing the heaviest burden. A proud leader steering us through both the protection of Gehenna and the operation of the German state amidst numerous political turmoils.§!"
 GEM_occult_reconstruction_trait: "Occultist\n§gOur occultist who displays various chaotic steps within her own rules—some days leading a leftist revolution, others a reactionary retreat.§!"
 GEM_gehennaism_trait: "Gehenna-esque\n§gFollowing the declaration of the German State, Makoto Hanuma made choices that overturned the expectations of traditional Germans, injecting Gehenna culture into every facet of society.§!"
 GEM_mini_gehenna_academy_trait: "Concurrent Gehenna Academy President\n§gFollowing the declaration of the German State, the role of the Gehenna Academy President was explicitly codified as a redesigned position, serving as a representative delegation for the Gehenna-descended population.§!"
 GEM_small_gehenna_academy_trait: "Small Gehenna Academy\n§gThe Small Gehenna Academy is a redesigned institution with roles codified after the declaration of the German State. It serves as one of the representative organizations for the Gehenna-descended and is a small-scale community meant to preserve the traditions and culture of Gehenna Academy.§!"
 GEM_better_integration_trait: "State Integrationist\n§gBoth those of Gehenna and German descent ultimately live within one state. Since intentional separation only breeds intentional discrimination, we must pursue better integration. We begin by admitting German students to Gehenna Academy.§!"
