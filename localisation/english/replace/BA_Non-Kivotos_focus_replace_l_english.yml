 indochina_event.1.t:0 "Indochinese Revolution"
 indochina_event.1.d:0 "With support for the Indochinese Communist Party expanding nationwide, the party's leader, Ho Chi Minh, has proclaimed a Communist Vietnam and launched an uprising. We must suppress them."
 indochina_event.1.a:0 "Damn it."
