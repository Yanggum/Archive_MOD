 #China
 CHI_mission_to_germany:0 "Italian Mission"
 CHI_closer_ties_with_germany:0 "Close Ties with Italy"
 CHI_closer_ties_with_germany_desc:0 "Our mission dispatched to Italy has opened up significant possibilities for cooperation, and we may be able to borrow funds for industrial development in the future."
 CHI_give_falkenhausen_citizenship_desc:0 "The German advisory group has made immense contributions to rebuilding and modernizing our military. We must allow those who were left behind after the collapse of Germany to stay here."

 #Replacement Check - Poland
 POL_italian_alliance:0 "Caspian Sea"
 POL_italian_alliance_desc:0 "The anti-Bolshevik front must not be limited to Eastern Europe! Countries beyond Anatolia can be of great help to us."
 POL_protect_yugoslavia:0 "Ukrainian National Army"
 POL_protect_yugoslavia_desc:0 "In 1922, Ukraine's territory was ravaged by the Bolsheviks. We will rally the nationalist forces in Western Ukraine and utilize them as an anti-Bolshevik volunteer army."
 POL_diplomatic_mission_to_YUG:0 "Send Diplomatic Mission to [YUG.getName]"
 POL_the_mediterranean: "Black Sea"
 POL_the_mediterranean_desc: "The nations of the Black Sea share direct borders with [SOV.getadjective]. They will readily take the hand we offer."
 POL_coerce_slovakia: "Free Polish Volunteers"
 POL_coerce_slovakia_desc: "Our homeland lost its northeastern territories due to the illegal invasion by the [SOV.getadjective]. We must organize nationalist militias in the region to stand against them!"
 POL_hungarian_alliance: "Belarusian Volunteer Corps"
 POL_hungarian_alliance_desc: "Weak as it may be, Belarusian nationalism is still valid. We will mobilize young people who share a Belarusian identity."
 POL_invite_greece: "[POL_russian_volunteers]"
