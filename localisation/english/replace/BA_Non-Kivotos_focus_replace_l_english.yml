 #인도차이나
  #이벤트
 indochina_event.1.t:0 "인도차이나 혁명"
 indochina_event.1.d:0 "인도차이나 공산당의 지지가 전국적으로 확대된 상황에서, 공산당의 지도자 호치민은 공산주의 베트남을 선포하고 봉기에 돌입했습니다. 우리는 이들을 진압해야만 합니다."
 indochina_event.1.a:0 "젠장."
  #국민정신
 VIN_upcoming_riot: "다가오는 봉기"
 VIN_upcoming_riot_tt: "\n만료 시: '§Y$indochina_event.1.t$§!' 사건 발생"
 VIN_indochina_war_idea: "인도차이나 유격대"
 VIN_indochina_war_idea_desc: "인도차이나 지역은 더운 기후와 울창한 밀림, 현지인들의 개입과 같은 이유로 적군이 전쟁을 수행하는 데에 있어서 어려움을 줍니다."


 #중국
 CHI_mission_to_germany:0 "이탈리아 사절단"
 CHI_closer_ties_with_germany:0 "이탈리아와의 밀접한 결속"
 CHI_closer_ties_with_germany_desc:0 "이탈리아로 파견된 우리의 사절단은 크나큰 협력의 가능성을 열었고, 추후 산업 개발을 위한 기금을 빌릴 수도 있을 것입니다."
 CHI_give_falkenhausen_citizenship_desc:0 "독일인 고문단은 우리의 군대를 재건하고 현대화하는데 지대한 공을 세웠습니다. 독일이 없어지고 남겨진 그들이 여기에 머물 수 있도록 해야 합니다."

 #리플레이스한번되나보자 - 폴란드
 POL_italian_alliance:0 "카스피해"
 POL_italian_alliance_desc:0 "반볼셰비키 전선이 동유럽에 국한되어서는 안 됩니다! 아나톨리아 너머의 나라들은 우리에게 큰 도움을 줄 수 있습니다."
 POL_protect_yugoslavia:0 "우크라이나 국민군"
 POL_protect_yugoslavia_desc:0 "지난 1922년, 우크라이나는 볼셰비키들에 의해 영토를 유린당했습니다. 서부 우크라이나의 민족주의 세력을 결집시켜 반볼셰비키 의용군으로 활용할 것입니다."
 POL_diplomatic_mission_to_YUG:0 "[YUG.getName]에 외교 사절단 파견"
 POL_the_mediterranean: "흑해"
 POL_the_mediterranean_desc: "흑해의 국가들은 [SOV.getadjective](과)와 직접 국경을 공유하고 있습니다. 이들은 우리가 내민 손을 쉽게 잡을 것입니다."
 POL_scandinavian_anti_communist_front: "스칸디나비아 반공 전선"
 POL_scandinavian_anti_communist_front_desc: "아니근데공산루트가면반공이아니잖아"
 POL_coerce_slovakia: "자유 폴란드 의용군"
 POL_coerce_slovakia_desc: "[SOV.getadjective]의 불법침략으로 조국은 북동부 영토를 상실했습니다. 해당 지역의 민족주의 민병대를 조직해서 그들에 대항해야 합니다!"
 POL_hungarian_alliance: "벨라루스 의용대"
 POL_hungarian_alliance_desc: "미약하지만 벨라루스 민족주의는 여전히 유효합니다. 우리는 벨라루스 정체성을 공유하는 청년들을 동원할 것입니다."
 POL_invite_greece: "[POL_russian_volunteers]"
