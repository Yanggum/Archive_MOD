#USA

 USA_intervention_in_europe:0 "Old Order Intervention"
 USA_intervention_in_europe_desc:0 "A New Order has arrived. We must intervene to ensure the collapsed Old Order does not rise again."
 USA_war_plan_gold_desc:0 "France is eyeing Millennium Science School. If they acquire Millennium's scientific technology, it will pose a very significant threat to us."
 USA_war_plan_silver_desc:0 "Italy's expansionist movements continue. If their imperial desires conflict with our national interests, we must be prepared."
 USA_war_plan_white_desc:0 "While the Old Order lay in ruins, the communist threat has been expanding. There is no greater threat than this to our country and the world at large."
 USA_war_plan_red_desc:0 "The United Kingdom suffered heavy losses from the New Order, but remains a naval power in Europe. This fact makes us uneasy."
 USA_war_plan_black:0 "War Plan Indigo" 
 USA_war_plan_black_desc:0 "They appear to be quiet, but in reality, they are the most dangerous enemies of the world. We must defeat them before a response becomes impossible."

