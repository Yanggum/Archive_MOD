 indochina_event.1.d:0 "인도차이나 공산당의 지지가 전국적으로 확대된 상황에서, 공산당의 지도자 호치민은 공산주의 베트남을 선포하고 봉기에 돌입했습니다. 우리는 이들을 진압해야만 합니다."
 indochina_event.1.a:0 "젠장."
