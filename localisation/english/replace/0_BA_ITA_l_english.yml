l_english:
 #Focuses
 ITA_request_control_of_french_territories:0 "Treaty with France"
 ITA_request_control_of_french_territories_desc:0 "Now that France has declared its intention to reclaim the mainland, we can propose a treaty. In exchange for our support, the French government-in-exile will cede specific territories to us upon their return."
 ITA_italy_first_desc:0 "To realize the grand glory of Italy, powerful military force is essential... Even if Europe has collapsed under the flames of war, Italy's glory remains unshaken."
 ITA_negotiate_italian_claims:0 "Formalizing the Stresa Front"
 ITA_negotiate_italian_claims_desc:0 "We will establish a formal Stresa Front and build a triple alliance between Italy, France, and Britain. Now that a massive threat looms over Europe, it is time to set aside old grudges and join hands."
 ITA_ratify_the_stresa_front:0 "European Security Pact"
 ITA_ratify_the_stresa_front_desc:0 "To oppose the enemies of Europe, a larger scale of military cooperation is required. The military collaboration between Italy, France, and Britain will be expanded, and joint military exercises may be held in the future."
 ITA_guarantee_austrian_independence:0 "The Veil Over Europe"
 ITA_guarantee_austrian_independence_desc:0 "The otherworldly enemies that emerged after Northern Europe's fall clearly threaten Northern Italy. As the de facto leader of the Stresa Front, Italy will draw a firm line against the invaders who conquered Europe and demonstrate our resolve through a hardline response."
 ITA_german_military_cooperation:0 "Accepting German Exiles"
 ITA_german_military_cooperation_desc:0 "With Germany having collapsed so suddenly, we can recruit German scientists and other talents to accelerate the advancement of Italian science and technology."
 ITA_pact_of_steel:0 "Dissolution of the Stresa Front"
 ITA_pact_of_steel_desc:0 "The Stresa Front, a pact hastily formed as Europe fell into chaos, is no longer beneficial to Italy now that Britain and France have collapsed. We will scrap the agreement and look toward expansion into the Balkans."
 ITA_treaty_with_germany:0 "European Technology Treaty"
 ITA_treaty_with_germany_desc:0 "Now that Europe has perished and Britain and France have fallen, we must create a stronger foundation with our new allies."
 ITA_human_fascism:0 "Declaration of Human Fascism"
 ITA_human_fascism_desc:0 "There must be a reason why Italy alone escaped the Great Transfer. We must begin the leap toward the unification of all humanity and a united Europe. It is time to take the first great step for mankind."
 ITA_human_fascism_tt:0 "[ROOT.GetNameWithFlag] is not allied with any Kivotos nation.\n§RThis decision will be permanently locked if [ROOT.GetName] enters into an alliance with a Kivotos nation.§!"
 ITA_rise_of_pan_europeanism:0 "Rise of Pan-Europeanism"
 ITA_rise_of_pan_europeanism_desc:0 "Moving beyond Italian nationalism like 'Greater Italy' or the 'Roman Empire,' Pan-Europeanism—aimed at strongly integrating all of Europe—is currently being actively discussed within Italy."
 ITA_europea_citizens:0 "European Citizenship"
 ITA_europea_citizens_desc:0 "We all live in one Europe. We must break free from the petty ethnic sentiments of the past and achieve a grand European integration."
 ITA_comfort_more_comfort:0 "Higher, Still Higher"
 ITA_comfort_more_comfort_desc:0 "Italy is currently surrounded by Kivotos nations. To realize the ambitions of Pan-Europeanism, we must break out of this prison and advance further north."
 ITA_europea_army:0 "European Army"
 ITA_europea_army_desc:0 "To realize the ambitions of all Europeans, we will create a European Army recruited from across the continent. Our military will become the toughest and strongest in Europe, acting now to realize our great vision."
 ITA_europea_army_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+10.0%§!\n\n"
 ITA_one_europea:0 "One Europe"
 ITA_one_europea_desc:0 "Europe must be unified. Our Pan-European state will declare a crusade for all of Europe, binding all European humanity under one flag and one slogan."
 #Events
 PASTA_event.1.t:0 "Formation of the Stresa Front"
 PASTA_event.1.d:0 "Following the implementation of the Stresa Treaty, [ITA.GetName] has decided to expand the Stresa Front into a full-scale faction. Our nation must decide whether to join [ITA.GetName]."
 PASTA_event.1.a:0 "For the restoration of Europe"
 PASTA_event.1.b:0 "No, we have no intention of joining Italy."

 PASTA_event.2.t:0 "[FROM.GetName] Joins the Stresa Front"
 PASTA_event.2.d:0 "As [FROM.GetName] decides to join our Stresa Front, the solidarity among European nations is growing stronger."
 PASTA_event.2.a:0 "Unite!"

 PASTA_event.3.t:0 "Stresa Front Refused"
 PASTA_event.3.d:0 "The refusal of [FROM.GetName] to sign our treaty has caused a major setback for the Stresa Front plan."
 PASTA_event.3.a:0 "Do they intend to die alone?"

 PASTA_event.4.t:0 "Italy's Offer of Support in the Millennium Resistance"
 PASTA_event.4.d:0 "[ITA.GetName] has expressed a desire to receive parts of Southern French territory in exchange for aiding our resistance against Millennium.\n\nThere is a fierce debate between those who believe we must gain an ally in the war against Millennium at the cost of some land, and those who refuse to give up any French territory."
 PASTA_event.4.a:0 "No, that must be rejected."
 PASTA_event.4.b:0 "It is only a few states."

 PASTA_event.5.t:0 "French Refusal"
 PASTA_event.5.d:0 "[FRA.GetName] has rejected the treaty to cede southern territories in exchange for our intervention in the Millennium War."
 PASTA_event.5.a:0 "Hmm."

 PASTA_event.6.t:0 "French Acceptance"
 PASTA_event.6.d:0 "[FRA.GetName] has approved the treaty to cede southern territories in exchange for our intervention in the Millennium War."
 PASTA_event.6.a:0 "Good."

 PASTA_event.7.t:0 "Stagnant Atmosphere"
 PASTA_event.7.d:0 "After the Ethiopian War, Italian society fell into a deep silence. The unprecedented event of the entire European continent being swept away by strange aliens was enough to drive the Italian people into a state of panic.\n\nNow that the effectiveness of our media control has weakened, Italian citizens are barely hiding their fear of the aliens to the north."
 PASTA_event.7.a:0 "This is a fear we must face."

 PASTA_event.8.t:0 "Italian Fascist Protests!"
 PASTA_event.8.d:0 "Italian fascists, nationalists, and citizens from all walks of life are in shock over [ROOT.GetName]'s declaration of an alliance with the alien nations spawned by the Great Transfer.\n\nSome citizens have organized anti-Kivotos protest groups and are marching in the streets, with strikes beginning to break out across Italy's industrial facilities!"
 PASTA_event.8.a:0 "Do not interfere with my foreign policy!"
 italy.5.t:0 "Italy-Hungary Technical Exchange"
 italy.5.b:0 "We have no intention of joining Italy."
 italy.6.t:0 "Italy-Hungary Technical Exchange - Accepted!"
 italy.6.d:0 "As we expected, Hungary was pleased to sign the series of technical exchanges. With a new threat looming over Europe, Italy must find a new way to survive."
 italy.7.t:0 "Italy-Hungary Technical Exchange - Rejected!"
 italy.7.d:0 "Hungary has rejected our proposed technical exchange."
 #National Spirits
 PASTA_signatories_of_the_stresa_idea:0 "Stresa Front Signatory"
 PASTA_signatories_of_the_stresa_idea_desc:0 "The Stresa Front, hastily formed by Britain, France, and Italy amidst the chaos following Kivotos's landing in Europe, faces dissolution as Britain and France fall into crisis."
 PASTA_ratify_the_stresa_front_idea:0 "Tripartite Security Pact"
 PASTA_shock_to_daejeon:0 "The Great Transfer Shock"
 PASTA_shock_to_daejeon_desc:0 "The fact that all of Europe was swept away by otherworldly beings was a horrific shock to Italy. Despite the media control implemented under the pretext of the Ethiopian War, all Italian citizens are now gripped by latent fear."
 PASTA_shock_to_daejeon_tt: "Changes upon alliance with a Kivotos nation:\nLarge-scale negative effects will occur if allied with a §YKivotos§! nation."
 PASTA_human_fascism_idea: "Human Fascism"
 PASTA_human_fascism_idea_desc: "Italy is the only major power to escape the destruction of Europe and plays a central role in various anti-Kivotos activities. Italy will become a nation with a manifest destiny for all of Europe—indeed, for all of humanity."
 PASTA_human_fascism_idea_tt: "§RCannot ally with Kivotos nations.§!"
 PASTA_pan_europea_FRA_idea: "French-European Integration"
 PASTA_pan_europea_GER_idea: "Dissolution of German Nationalism"
 PASTA_pan_europea_HOL_idea: "Low Countries Reconstruction"
 PASTA_pan_europea_SWE_idea: "Nordic Liberation: Sweden"
 PASTA_pan_europea_NOR_idea: "Nordic Liberation: Norway"
 PASTA_pan_europea_DEN_idea: "Nordic Liberation: Denmark"
