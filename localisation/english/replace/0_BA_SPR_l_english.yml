 ##Characters 
 SPBA_gil_robles: "José María Gil-Robles"
 SPBA_indalecio_prieto: "Indalecio Prieto"

 ##Events
 SPBA_event.1.desc: "The 1936 general election was held under a rigid atmosphere due to the extended state of emergency, but it ultimately concluded with the National Front, led by the CEDA, securing a massive victory. Unlimited campaign funding from capitalists and the anxiety caused by the 'Great Transfer' in the north became decisive political nutrients for the conservatives. The resulting fragmentation of the Popular Front led many voters to choose the right wing, which promised order and stability, over the chaos of the Republic and the perceived irresponsibility of the left.\n\nThe newly inaugurated CEDA, under the leadership of President [Root.GetLeader], justifies its rule as reconstructing the nation based on 'public trust.' However, slogans of 'Otherworldly Bolshevism' are already echoing in the streets, and the entire left-wing spectrum has begun to be branded as traitors.\n\nWhile CEDA's victory was a legal electoral result, political violence and social division show no signs of receding; instead, they appear to have entered a new phase. The government now shows signs of suppressing the opposition entirely rather than appeasing them, using external threats as a pretext to establish a powerful authoritarian regime."
 SPBA_event.1.a: "There is no better alternative!"

 SPBA_event.2.t: "Cortes Ousts the President!"
 SPBA_event.2.desc: "Immediately after CEDA's victory in the general election, the political landscape in Madrid moved at a breathtaking pace.\n\nPresident [Root.GetLeader] sought to defend the constitutional order of the Republic, but the National Front majority in the Cortes branded him an incompetent and anachronistic figure.\n\nUsing the Great Transfer in the north and sporadic leftist resistance as justification, the Cortes proposed an emergency motion and passed a resolution to dismiss the president in a manner akin to a legislative ambush.\n\nThe CEDA leadership, backed by the military and Falangist militias, seized power swiftly as if according to a pre-arranged plan. The new national leadership has promised a powerful authoritarian order centered on the Spanish Army.\n\nDespite the veneer of legal procedures, this event was essentially a parliamentary coup, marking a significant turning point in Spanish political history."
 SPBA_event.2.a: "A strong government is needed for the sake of order."

 SPBA_event.3.t: "The Embers of Republican Officers"
 SPBA_event.3.desc: "\"The corridors of the Ministry of Defense were as silent as death. Yet that silence was not one of peace, but an ominous precursor to a storm. Each time the freshly printed official gazette passed from hand to hand among the officers, only low sighs and curses cut through the air. The propaganda spewed by the government and state media was nothing less than an explicit declaration of a purge.\n\nA councilist general set his documents down weakly. 'I should have known when they ousted the President with a parliamentary coup... Gil-Robles is dismantling the Republic wearing judicial robes instead of a uniform.' No one could answer him. Numerous colleagues had already been arrested or placed under surveillance on charges of 'involvement in Otherworldly Bolshevism.' Now, under the blade of legal statutes, all left-leaning generals within the military were expected to offer up their necks.\n\nVicente Rojo Lluch was the one to break the silence. Without a word, he walked to his office and picked up his favorite fountain pen. His resignation letter contained only a single line: 'I have been loyal to the Republic, but I can no longer serve a Republic that no longer exists.' Along with his signature, he removed his rank insignia and placed them on the desk.\n\nHis resignation was only the beginning. From respected strategists in the General Staff to young officers on the front lines, soldiers who believed in the ideals of the Republic began to lay down their weapons and positions one by one. Hundreds of resignation letters piled up like a mountain on the Defense Minister's desk overnight. The National Front government succeeded in 'purifying' the military without shedding a drop of blood. However, the price was a fractured military that valued honor as much as life, and pouring oil onto the embers of a resistance that had not yet been extinguished. The politics of Madrid were stained with ink instead of blood, but on that day, the Spanish military was split in two.\""
 SPBA_event.3.a: "A part of history fades away."
 
 SPBA_event.4.t:0 "Extension of the State of Emergency"
 SPBA_event.4.desc:0 "The motion to extend the state of emergency was passed unanimously in the Cortes through close cooperation between the National Front and several centrist parties. Immediately upon the vote, the Spanish Army—specifically the elite Army of Africa—was dispatched to major cities across Spain under the pretext of maintaining public order. Moors can be seen patrolling the streets while smoking, and socialists wearing red armbands are being beaten to a pulp amidst the fanatical support of the Spanish populace. The Guardia Civil often provoked fights by targeting 'incidents' caught in the cities, and the Spanish military effectively secured the urban centers amidst the hospitality of priests and nuns.\n\nDespite the fact that the majority of the Popular Front refused to comply with the extension, it has become evident that Spain is drenched in fanatical anti-communism and a desire for vengeance."
 SPBA_event.4.a:0 "Capture and hang the rebellious traitors!"
 
