 ##National Spirits 
 SPR_kivotos_bolshevism:0 "Otherworldly Bolshevism"
 SPR_kivotos_bolshevism_desc:0 "The 'Great Transfer' of 1935 ruined everything in Spain. And as those called from Kivotos were revealed to all be clearly socialists (presumably), the unstable structure of Spanish society, which had been rotting for a long time, transformed into a deformed shape barely avoiding collapse, propped up by a steadfast collective madness called Otherworldly Bolshevism. The day this madness ends will only be the day the Reconquista against Kivotos is concluded."
 SPR_catholic_revolution:0 "Revolución Católica"
 SPR_catholic_revolution_desc:0 "As communist invaders threatened to swallow Spain, the workers decided to believe in the Church and God instead of trade unions and Marx. The series of national Catholic reforms that occurred in the process are collectively known as the Revolución Católica, and the old socialist culture is being replaced by a new Catholic culture."
