l_english:
 SPBA_gil_robles: "호세 마리아 힐로블레스"

 SPBA_event.1.desc: "1936년 총선은 스페인 자치우익연합(CEDA)의 대대적인 선거 운동이 결실을 거두며 끝났습니다. 사회주의자와 공화주의자들의 분열, 그리고 최근 북부에서 발생한 '대전이'로 인한 불안은 보수파에게 결정적인 정치적 자양분이 되었습니다. 많은 유권자들은 공화국의 혼란과 좌익의 무책임한 행동 대신, 질서와 안정을 보장하겠다는 우파의 구호를 선택한 것입니다.\n\n새롭게 집권한 CEDA는 [Root.GetLeader] 대통령의 지도 아래 '국민의 신뢰'를 바탕으로 국가를 재건한다는 명분을 내세우고 있습니다. 그러나 이미 거리에서는 '외계-볼셰비즘'이라는 구호가 울려 퍼지고, 좌익 세력 전체가 반역자로 몰리기 시작했습니다.\n\nCEDA의 승리는 합법적인 선거 결과였으나, 정치적 폭력과 사회적 분열은 가라앉지 않고 오히려 새로운 국면으로 접어든 듯합니다. 이제 정부는 반대파를 달래기보다는 탄압하고, 외부의 위협을 빌미로 강력한 권위주의적 체제를 구축하려는 조짐을 보이고 있습니다."
 SPBA_event.1.a: "이보다 훌륭한 다른 대안이 없다!"

 SPBA_event.2.t: "의회가 대통령을 몰아내다!"
 SPBA_event.2.desc: "1936년 총선에서 자치우익연합(CEDA)이 승리하자마자, 마드리드의 정치권은 숨 가쁘게 움직였습니다.\n\n[Root.GetLeader] 대통령은 여전히 공화국 헌정을 수호하고자 하였으나, 의회 다수파는 그를 무능하고 시대착오적인 인물로 낙인찍었습니다.\n\n북부에서 발생한 대전이와 산발적인 좌익 저항을 빌미로, 의회는 긴급안건을 상정하여 거의 날치기와 같은 방식으로 대통령 해임안을 가결했습니다.\n\n군부와 팔랑헤 민병대의 지원을 등에 업은 CEDA 지도부는 이미 계획된 듯 신속하게 권력을 장악하였으며, 새로운 국가 지도부는 강력한 권위주의적 질서를 약속했습니다.\n\n합법적 절차를 거쳤다는 외피에도 불구하고, 이번 사건은 사실상 의회 쿠데타로서, 스페인 정치사의 중대한 전환점으로 기록될 것입니다."
 SPBA_event.2.a: "질서를 위해 강력한 정부가 필요하다."

 SPBA_national_emergency_extension: "국가 비상사태 연장"
 SPBA_national_emergency_extension_desc: "1935년 11월 2일, 유럽에서의 대혼란과 변화한 국경에서의 지속적인 충돌은 스페인 전역에 국가 비상사태를 선포하고 계엄령이 발효되었습니다. 여전히 키보토스라고 불리는 이계의 국가들과 인접하고, 우리의 영토들이 탈취당한 지금 더 강도 높은 동원이 필요합니다."