 SPBA_event.1.desc: "1936년 총선은 스페인 자치우익연합(CEDA)의 대대적인 선거 운동이 결실을 거두며 끝났습니다. 사회주의자와 공화주의자들의 분열, 그리고 최근 북부에서 발생한 '대전이'로 인한 불안은 보수파에게 결정적인 정치적 자양분이 되었습니다. 많은 유권자들은 공화국의 혼란과 좌익의 무책임한 행동 대신, 질서와 안정을 보장하겠다는 우파의 구호를 선택한 것입니다.\n\n새롭게 집권한 CEDA는 [Root.GetLeader] 대통령의 지도 아래 '국민의 신뢰'를 바탕으로 국가를 재건한다는 명분을 내세우고 있습니다. 그러나 이미 거리에서는 '외계-볼셰비즘'이라는 구호가 울려 퍼지고, 좌익 세력 전체가 반역자로 몰리기 시작했습니다.\n\nCEDA의 승리는 합법적인 선거 결과였으나, 정치적 폭력과 사회적 분열은 가라앉지 않고 오히려 새로운 국면으로 접어든 듯합니다. 이제 정부는 반대파를 달래기보다는 탄압하고, 외부의 위협을 빌미로 강력한 권위주의적 체제를 구축하려는 조짐을 보이고 있습니다."
 SPBA_event.1.a: "이보다 훌륭한 다른 대안이 없다!"

 SPBA_event.2.t: "코르테스가 대통령을 몰아내다!"
 SPBA_event.2.desc: "1936년 총선에서 자치우익연합(CEDA)이 승리하자마자, 마드리드의 정치권은 숨 가쁘게 움직였습니다.\n\n[Root.GetLeader] 대통령은 여전히 공화국 헌정을 수호하고자 하였으나, 코르테스 다수파는 그를 무능하고 시대착오적인 인물로 낙인찍었습니다.\n\n북부에서 발생한 대전이와 산발적인 좌익 저항을 빌미로, 코르테스는 긴급안건을 상정하여 거의 날치기와 같은 방식으로 대통령 해임안을 가결했습니다.\n\n군부와 팔랑헤 민병대의 지원을 등에 업은 CEDA 지도부는 이미 계획된 듯 신속하게 권력을 장악하였으며, 새로운 국가 지도부는 강력한 권위주의적 질서를 약속했습니다.\n\n합법적 절차를 거쳤다는 외피에도 불구하고, 이번 사건은 사실상 코르테스 쿠데타로서, 스페인 정치사의 중대한 전환점으로 기록될 것입니다."
 SPBA_event.2.a: "질서를 위해 강력한 정부가 필요하다."

 SPBA_event.3.t: "공화주의 장교의 잔불"
 SPBA_event.3.desc: "\"국방부 복도는 쥐 죽은 듯 고요했다. 그러나 그 침묵은 평온함이 아닌, 폭풍 전의 불길한 전조와도 같았다. 갓 인쇄된 관보가 장교들의 손에서 손으로 넘어갈 때마다 나지막한 탄식과 욕설만이 조용히 공기를 갈랐다. 정부와 국영 언론이 떠드는 수 많은 프로파간다들은 노골적인 숙청 선언이나 다름없었다.\n\n한 평의회주의자 장성이 힘없이 서류를 내려놓았다. \"의회 쿠데타로 대통령을 내쫓을 때부터 알아봤어야 했는데... 힐-로블레스가 군복 대신 법복을 입고 공화국을 해체하고 있군.\" 그의 말에 아무도 대답하지 못했다. 이미 수많은 동료들이 '이계-볼셰비즘 연루 혐의'로 체포되거나 감시받고 있었다. 이제는 합법적인 법률의 칼날 아래, 군 내의 모든 좌익 성향 장군들이 목을 내놓아야 할 판이었다.\n\n침묵을 깬 것은 비센테 로호 류크였다. 그는 말없이 자신의 집무실로 걸어가, 가장 아끼던 만년필을 들었다. 그의 사직서에는 단 한 줄만이 적혀 있었다. '본관은 공화국에 충성하였으나, 더는 존재하지 않는 공화국을 위해 복무할 수 없음.' 그는 서명과 함께 자신의 계급장을 떼어 책상 위에 올려놓았다.\n\n그의 사임은 시작에 불과했다. 총참모부의 존경받는 전략가부터 일선의 젊은 장교들까지, 공화국의 이상을 믿었던 군인들이 하나둘씩 자신의 무기와 직위를 내려놓기 시작했다. 국방부 장관의 책상 위에는 하루 만에 수백 장의 사직서가 산더미처럼 쌓였다. 정부는 손에 피 한 방울 묻히지 않고 군부를 '정화'하는 데 성공했다. 하지만 그 대가는 명예를 목숨처럼 여기던 군의 분열과, 아직 불씨가 꺼지지 않은 저항의 의지에 기름을 붓는 것이었다. 마드리드의 정치는 피 대신 잉크로 얼룩졌지만, 그날 스페인의 군대는 두 동강이 났다."
 SPBA_event.3.a: "역사의 한 부분이 저물어간다."

