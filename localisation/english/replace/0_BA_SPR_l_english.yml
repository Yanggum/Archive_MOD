 SPBA_national_emergency_extension_desc: "On November 2, 1935, the great chaos in Europe and the continuous clashes at the changed borders led to the declaration of a national state of emergency and the implementation of martial law across Spain. Now that we are adjacent to otherworldly nations known as Kivotos and our territories have been seized, a higher intensity of mobilization is required."
 
