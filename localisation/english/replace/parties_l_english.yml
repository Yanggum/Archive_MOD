 japanese_fascism: "Japanese Military"
 japanese_fascism_desc: "Following the Manchurian Incident, the military emerged as the de facto ruling power of Japan. Leveraging formidable military strength, they have overwhelmed the cabinet and political factions, leading all critical national decisions."

 imperial_rule_assistance_association: "Imperial Rule Assistance Association"
 imperial_rule_assistance_association_desc: "The Imperial Rule Assistance Association is a political organization established by Fumimaro Konoe as part of the New Order Movement. Established to realize Konoe's ideals, the Association now forms a massive political structure as Japan's sole legal party."

 imperial_rule_assistance_association_neutrality: "Imperial Rule Assistance Association"
 imperial_rule_assistance_association_neutrality_desc: "The Imperial Rule Assistance Association was a party created by Fumimaro Konoe in an attempt to escape being a puppet of the military. While the New Order Movement initially seemed to achieve decent results, it failed due to military interference, and it has now devolved into a nominal party that merely endorses and supports military policy."

 decagramaton_neutrality: "Decagramaton Thought"
 decagramaton_neutrality_desc: "Decagramaton is an artificial intelligence system that claims to be a divine seeker. Composed of AIs 'enlightened' by Decagramaton and prophets who follow it, this unique ideology moves toward the goal of the arrival of a new god—proven, analyzed, and reproduced—and focuses on proving its own existence."

