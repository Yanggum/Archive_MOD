 japanese_fascism: "일본 군부"
 japanese_fascism_desc: "만주 사변 이후 군부는 일본의 실질적 통치 세력으로 떠올랐습니다. 강력한 군사력을 바탕으로 내각과 정치 세력을 압도하며, 국가의 모든 중요한 결정을 주도하고 있습니다."

 imperial_rule_assistance_association: "대정익찬회"
 imperial_rule_assistance_association_desc: "대정익찬회는 고노에 후마미로가 신체제운동의 일환으로 수립한 정당입니다. 고노에 후미마로의 이상을 실현하기 위해 수립된 대정익찬회는 현재 일본의 유일한 정당으로서 거대한 정치 구조를 형성하고 있습니다."

 imperial_rule_assistance_association_neutrality: "대정익찬회"
 imperial_rule_assistance_association_neutrality_desc: "대정익찬회는 고노에 후마미로가 군부의 꼭두각시에서 벗어나기 위해 만들어진 정당입니다. 신체제 운동으로 초반에는 괜찮은 성과를 얻는가 싶었지만 군부의 견제로 실패하였고 현재는 군부를 방침을 추인하여 지원하는 허울뿐인 정당으로 변했습니다."

 decagramaton_neutrality: "데카그라마톤 사상"
 decagramaton_neutrality_desc: "데카그라마톤은 자신을 신성한 구도자라고 주장하는 인공지능 시스템입니다. 데카그라마톤에 의해 '계몽'된 인공지능이자, 데카그라마톤을 따르는 예언자들로 이루어진 하나의 독특한 이데올로기는 증명되고 분석되어 재현된 새로운 신의 도래를 목표로 움직이며, 자신의 존재 증명에 집중하는 특색이 있습니다."

