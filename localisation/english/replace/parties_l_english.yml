 trotskyism_desc:0 "A form of government that applies and develops Soviet communist policies, Trotskyism advocates for the necessity of a strong vanguard party to purge counter-revolutionary elements, as well as 'Permanent Revolution'—the overthrow of capitalist states through continuous revolution before the workers' state can be isolated by capitalist embargoes."

