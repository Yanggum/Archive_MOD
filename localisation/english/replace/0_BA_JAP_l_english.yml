 JAP_economic_stimulus_plan: "Economic Stimulus Plan"
 JAP_economic_stimulus_plan_desc: "The disappearance of Europe and the resulting ruin of the American economy have left significant economic scars on our nation. We must devise a plan to escape this dangerous situation."
 
 JAP_nation_of_the_rising_sun: "Nation of the Rising Sun"

 JAP_opposition_to_the_army: "Oppose the Toseiha"

 JAP_purge_the_kodoha_faction: "Control the Civilian Government"
 JAP_purge_the_kodoha_faction_desc: "The military will thoroughly control the civilian government to completely seize the actual power of the state. We plan to limit civilian political influence and lead all national policies under military leadership."

 JAP_support_for_the_manchurian_faction: "Support the Manchurian Faction"
 JAP_support_for_the_manchurian_faction_desc: "The Manchurian Faction, which led the Manchurian Incident, is a force that strongly supports Japan's policy of Greater East Asian integration. They intend to strengthen their influence in Manchuria and realize their ultimate goals through resources and military power."

 JAP_disarmament_for_the_economy: "Disarmament for the Economy"

 JAP_establishment_of_special_economic_recovery_investigative_committee: "Special Investigative Committee for Economic Recovery"
 JAP_establishment_of_special_economic_recovery_investigative_committee_desc: "The Toseiha played a leading role in handling the past Great Depression. We will take issue with this, criticizing the Toseiha's economic blunders and organizing a committee to propose an alternative economic system."

 JAP_purge_of_pro_military_officials: "Purge Pro-Military Officials"

 JAP_formation_of_fumimaro_konoe_cabinet: "Organize a New Cabinet"
 JAP_formation_of_fumimaro_konoe_cabinet_desc: "We will appoint Fumimaro Konoe, who receives support from both the Kodoha and the public, as Prime Minister to suppress the military and stabilize Japanese politics."

 JAP_establishment_of_the_imperial_rule_assistance_association: "New Order Movement"
 JAP_establishment_of_the_imperial_rule_assistance_association_desc: "Fumimaro Konoe's New Order Movement is a broad system reorganization movement to suppress the military's influence and build a massive national total effort system. Fumimaro Konoe will take advantage of the greatly weakened military influence to immensely grow the government's influence."

 JAP_protection_of_the_kodoha: "Weaken Peace Preservation Act"
 JAP_protection_of_the_kodoha_desc: "To resolve the instability of Japanese politics, we intend to protect various anti-Toseiha figures who have been arrested. While guaranteeing their political standing, we will weaken the military's influence and add momentum to subsequent political reforms."

