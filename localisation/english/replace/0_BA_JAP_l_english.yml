 # Japanese Puppet Decisions
 MEN_add_core_of_mongolia: "Integrate Mongolia"
 MEN_add_core_of_mongolia_desc: "We have claimed sovereignty over Mongolia for years, but the illegal government in Ulaanbaatar has rejected our legitimate demands and continued to encroach on our territory. However, our most reliable ally, [JAP.GetAdjective], has ousted the illegal Ulaanbaatar government and returned legitimate control to us. Now we must assert our legitimacy over Mongolia and integrate the Mongolians under a single government."
