l_english:
 JAP_guide: "Subjects of His Imperial Majesty\n\n£white_dot Complete the domination of Manchuria and North China.\n£white_dot Accomplish the liberation of the various peoples of Southeast Asia.\n£white_dot §YAchieve Great Co-Prosperity.§!\n\n§RThe whole world under one roof—how could it not be grand?§!"
 JAP_country_intro_header: "Land of the Rising Sun"
 JAP_country_intro_content: "The Meiji Restoration transformed Japan, which had been clinging only to the legacies of the past. A nation of 30 million has become, in less than 70 years, a household of over 70 million subjects, and the nation's wealth has increased not just twofold, but dozens of times over. Having even defeated Russia, the prestige of the Empire spread across Greater East Asia with the momentum of a rising sun.\n\nThe Restoration reconstructed Japan into something entirely different, but not everything has gone smoothly. The glory of the Empire achieved over the last century is tied to the sacrifices of the peasantry for industrialization, and the wealth built by the state remains at the top of a deformed social structure. The pride of fostering modern industry is, upon closer inspection, merely a crude imitation of Western goods.\n\nExpansionist policies targeting Korea and China have masked these dark sides, but even this cannot last forever. Massive military expenditures and the strengthened position of the army are putting immense pressure on the government. Colonial management, except for Taiwan, is seeing consistent deficits, and the recent Showa Financial Crisis and Great Depression have tangled all the problems of the Empire like a Gordian knot. The Manchurian Incident, seen as an opportunity to break through this, instead worsened the situation by offending Britain and the Netherlands.\n\nThus, the past days of the Showa era have been scattering hints that the Empire, despite boasting the might of the Rising Sun, is heading toward a terrible stagnation."
 JAP_country_intro_header_1: "$JAP_country_intro_header$"
 JAP_country_intro_content_1: "The historical precedent of Tokugawa Ieyasu, who secretly waited for his time to seize power, has repeated itself. A heterogeneous group, resembling humanity yet distinct, has completely overlaid the upper regions of the West, and simultaneously, the pressure exerted on the Empire has subsided.\n\nWhile this is a boon, it should not be viewed simply. The Empire must look toward what comes after establishing an unshakeable status in Greater East Asia. To know oneself and the other is to achieve a hundred victories, yet our knowledge of these 'otherworlders' remains limited. Some have white skin and remind us of those who have disappeared or remain, while others strangely resemble our Empire or China.\n\nAs the 11th year of Showa dawns, we have entered a different phase. Many tasks still remain for the Empire. Even setting aside the new entities, rural poverty persists, and with the disappearance of Europe, the economy is actually regressing more than before. However, unlike before, the Empire has been given choices other than mere stagnation."
 

 JAP_Revolution_democracy: "Japanese Revolutionary Committee"
 JAP_Revolution_democracy_DEF: "Japanese Revolutionary Committee"
 JAP_Revolution_democracy_ADJ: "Japanese Revolutionary"
 JAP_No_More_militarism: "Civilian Control"
 JAP_No_More_militarism_desc: "Through the Great Depression, the military intervened in various incidents. Even after a successful revolution, a military with militaristic tendencies remains. We must control them through democratic means."
 JAP_zaibatsus: "Zaibatsu"
 JAP_zaibatsus_empowered: "Empowered Zaibatsu"
 JAP_zaibatsus_challenged: "Challenged Zaibatsu"
 JAP_challenge_the_zaibatsus: "Challenge the Zaibatsu"
 JAP_guide_the_zaibatsus: "Issue Directives to Zaibatsu"
 JAP_intervene_in_china_communism: "Spread the Revolution"
 JAP_intervene_in_china_communism_desc: "Our revolution must not end in Japan. We must spread the revolution to the world."
 JAP_defeat_American_Imperialism: "Defeat American Imperialism"
 JAP_defeat_American_Imperialism_desc: "America has continued its external propaganda as the home of liberty, but in reality, it is no different from an imperialist state. We must shatter America's Pacific hegemony and achieve co-prosperity together."
 JAP_Remember_Daisho_Demokrashi: "Memories of Taisho Democracy"
 JAP_Remember_Daisho_Demokrashi_desc: "The 1920s were Japan's golden age, both culturally and economically. Let us stimulate the public's nostalgia for Japan's 'good old days' and encourage them to reclaim their rights."
 JAP_Opposition_of_Peace_Preservation_Act: "Opposition to the Peace Preservation Act"
 JAP_Opposition_of_Peace_Preservation_Act_desc: "The Peace Preservation Act, enacted in 1925, became the basis for suppressing everyone from the left to the right in Japan. It is an evil law that suppresses Japan's democratic and liberal movements and accelerates the transformation into a militarist state."
 JAP_purge_the_militarists: "Demote Militarists"
 JAP_remove_of_peace_preservation_act: "Abolition of the Peace Preservation Act"
 JAP_remove_of_peace_preservation_act_desc: "The evil law enacted in 1925 that tormented Japanese society and its people no longer exists. It will remain merely a page in history."
 JAP_Civil_War_Damage_Recovery: "Civil War Damage Recovery"
 JAP_Civil_War_Damage_Recovery_desc: "The civil war that swept across Japan produced hundreds of thousands of victims. We must provide compensation to them and restore destroyed homes and infrastructure."
 JAP_Local_autonomy_expansion: "Expansion of Local Autonomy"
 JAP_Local_autonomy_expansion_desc: "Properly delegating authority is the first step toward efficient governance... even if it means more paperwork for the General Committee. Focus on the results, not the process."
 JAP_remove_of_Ministry_of_Development: "Abolition of the Ministry of Colonial Affairs"
 JAP_remove_of_Ministry_of_Development_desc: "Administrative efficiency is paramount. We shall dissolve the old structures and integrate our territories under a more streamlined, modern bureaucracy."
 JAP_liberate_south_seas_mandate: "Integration of the South Seas Mandate"
 JAP_liberate_south_seas_mandate_desc: "The former German Pacific islands, obtained as compensation for our participation in the last Great War in Europe, are currently governed under a League of Nations mandate. However, a significant level of assimilation of the local inhabitants has already occurred. Therefore, we will officially integrate these territories into our Inner Lands."
 JAP_the_taiwan_question: "The Taiwan Question"
 JAP_the_taiwan_question_desc: "We have ruled Taiwan for some time, but the issue of Taiwan's right to self-determination is becoming increasingly urgent. If we deny the self-determination of our neighbors, can we truly claim to uphold democratic ideals?"
 JAP_crush_chinese_communists: "Eliminate Communists in China"
 JAP_crush_chinese_communists_desc: "Extinguish the flames of radicalism across the mainland to ensure the stability of the new East Asian order."
 JAP_develop_nanyo_gunto: "Develop the South Seas Mandate"
 JAP_develop_nanyo_gunto_desc: "The South Seas Mandate is our bridgehead for southern expansion and our base for reaching into the great ocean. We must invest more in this region."
 JAP_crush_soviet: "Eliminate the Great Threat"
 JAP_crush_soviet_desc: "The [SOV.GetName] claims to be a nation for workers only in words, but in reality, it is a dictatorial state where [SOV.GetLeader] wields power for personal gain. We must save the people suffering under the grip of [SOV.GetLeader]."
 JAP_the_korean_question: "The Korean Question"
 JAP_devlop_korean: "Develop Korea"
 JAP_devlop_korean_desc: "A stable industrial base in the peninsula is essential. We will build factories and railways to bind our economies together in inseparable synergy."
 JAP_develop_taiwan: "Develop [524.GetName]"
 JAP_develop_taiwan_desc: "Promote industrial growth and infrastructure projects in [524.GetName] to maximize its strategic value."
 BA_japan.1.t: "Citizens Demand Abolition of Peace Preservation Act!"
 BA_japan.1.d: "TOP SECRET\nREPORT\nEmpire of Japan, Showa Year 11, [GetMonth]\nSubject: Report on Demonstrations Demanding Abolition of the Peace Preservation Act\n\n1. Large-scale protest movements demanding the abolition of the Peace Preservation Act have occurred in major cities such as Tokyo, Osaka, and Nagoya.\n2. Protesters claim the law should be abolished immediately and continue rallies in city centers.\n3. Military police (Kenpeitai) have been deployed to the scene and are confronting the protesters. Efforts are being made to prevent the situation from worsening while dealing with it strictly.\n4. At this point, there are no large-scale clashes, but there are signs of the protests expanding. Continuous monitoring is required.\n\nEnd of Report"
 BA_japan.1.a: "Disloyal scoundrels! Un-nationals! Fire!"
 BA_japan.1.b: "We must listen to the voices of the people."
 BA_japan.2.t: "Firm Suppression Measures Against Subversive Protests"
 BA_japan.2.d: "1. His Excellency the Prime Minister has ordered the immediate forceful dispersal of the protesters.\n2. Hardline suppression instructions have been issued to the Kenpeitai, and military deployment is being considered if necessary.\n3. Policy of arresting and strictly punishing protest ringleaders."
 BA_japan.2.a: "End of Report"
 BA_japan.3.t: "Legislative Reform Plan Through Public Opinion"
 BA_japan.3.d: "1. His Excellency the Prime Minister has decided to accept the protesters' demands.\n2. Instructions to form a special committee for the abolition of the Peace Preservation Act.\n3. Meeting with protest representatives is scheduled, and negotiations for a peaceful dispersal are underway."
 BA_japan.4.t: "Tatsuji Fuse"
 BA_japan.4.d: "Today, Tatsuji Fuse was arrested at his home by the Tokko (Special Higher Police) on charges of violating the Peace Preservation Act. He is a former prosecutor, human rights lawyer, and has a political career having been elected as a member of the Labor-Farmer Party in the 1928 General Election. Respected by the common people, he is the one who led the recent protests for the abolition of the Peace Preservation Act.\n\nHe pointed out the lack of democratic legitimacy of the current regime and the Peace Preservation Act, claiming he will continue to fight for the abolition of the law and the restoration of democracy.\n\nAfter 12 hours of interrogation, he confessed to all charges. What should we do with him?"
 BA_japan.4.a: "Indict him for violating the Peace Preservation Act and throw him into Osaka Prison!"
 BA_japan.6.t_china: "[609.GetName] Becomes Anarchy"
 BA_japan.6.t_manchu: "[745.GetName] Becomes Anarchy"
 BA_japan.6.d: "A civil war broke out in Japan; should we take this?"
 BA_japan.6.a: "Invasion Go Go"
 BA_japan.7.t: "[FROM.GetAdjective] Who Plundered Our Territory"
 BA_japan.7.d: "The title says it all."
 BA_japan.8.t: "Free Elections in [524.GetName]"
 BA_japan.8.d: "Today, at the [JAP.GetNameDef] Civil Administration building, formerly the [524.GetName] Governor-General's office, a vote was announced to ask about integration with China. The news spread quickly through local media, and the vote is scheduled for tomorrow.\n\nNow we must wait and see if they will choose integration with China or complete integration into the Inner Lands..."
 BA_japan.9.t: "[524.GetName] Chooses Integration into Inner Lands"
 BA_japan.9.d: "Fortunately, in the vote held for the locals in [524.GetName], integration of [524.GetName] island into the Inner Lands received a slightly higher percentage of votes than independence. Officially, [524.GetName] island is now no longer an overseas territory but is considered part of our mainland and the Inner Lands, integrated into the Prefectural administrative system.\n\nFollowing the vote, independence activists in [524.GetName] are shifting toward fighting for increased regional privileges within the [JAP.GetNameDef] Diet."
 BA_japan.9.a: "Excellent."
 BA_japan.10.t: "[524.GetName] Chooses Integration with China"
 BA_japan.10.d: "Unfortunately, in the vote held for the locals in [524.GetName], integration with China received a slightly higher percentage of votes than integration into the Inner Lands. As of midnight tonight, the administration of [524.GetName] has been transferred to the 'Taiwan Provisional Transitional Government' led by locals.\n\nAlthough their government will remain under our strong influence for the time being, the Rising Sun flag at the [524.GetName] Governor-General's office in Taipei has been quietly lowered, and the Blue Sky, White Sun, and a Wholly Red Earth flag of the Chinese government has been hoisted in its place."
 BA_japan.10.a: "Give them our blessings."
 BA_japan.11.t: "[FROM.GetAdjective] Returns [524.GetName]"
 BA_japan.11.d: "The title says it all."
 BA_japan.11.a: "Wansui!"
 BA_japan.12.t: "Generals Arriving from [FROM.GetAdjective]!"
 BA_japan.12.d: "Content regarding Japan demoting militaristic generals to Manchuria.\n\nWould anyone actually play Manchukuo if they set Japan's AI path to Democratic in a Blue Archive mod?"
 BA_japan.12.a: "Oh dear.."
 BA_japan.13.t: "Subject: Report on the Demotion of Militaristic Generals"
 BA_japan.13.d: "TOP SECRET\nREPORT\nEmpire of Japan, Showa Year 11, [GetMonth]\nSubject: Report on the Demotion of Militaristic Generals to Manchuria\n\n1. Recently, generals showing strong militaristic tendencies within the military have been demoted to Manchuria one after another.\n2. The demoted generals are generally figures who advocated for excessive expansionism and war preparation in political and military decisions within Japan.\n3. While performing new duties in Manchuria, signs of dissatisfaction and backlash are being detected. Continuous monitoring and intelligence gathering are required.\n\nEnd of Report"
 BA_japan.14.t: "[FROM.GetAdjective] Proposes Industrialization of [ROOT.GetName]!"
 BA_japan.14.d: "[FROM.GetAdjective] has proposed a Korean Industrialization Plan to us. While this could significantly accelerate [ROOT.GetAdjective]'s industrialization, there are concerns that the overall [ROOT.GetAdjective] economy could become subordinate to [FROM.GetAdjective]."
 BA_japan.14.a: "The lesser of two evils..."
 BA_japan.14.b: "We don't need such things."
 BA_japan.15.t: "[FROM.GetAdjective] Approves Our Industrialization Plan"
 BA_japan.15.d: "[FROM.GetAdjective] has accepted our proposal. Now, skilled workers from [ROOT.GetAdjective] have departed for [FROM.GetAdjective] to teach technology, and the relationship between [FROM.GetAdjective] and [ROOT.GetAdjective] will further develop."
 BA_japan.15.a: "Yosh!!"
 BA_japan.16.t: "[FROM.GetAdjective] Rejects Our Industrialization Plan"
 BA_japan.16.d: "[FROM.GetAdjective] has rejected our proposal..."
 BA_japan.16.a: "Not good.."
 BA_japan.17.t: "[FROM.GetAdjective] Returns Territory to Us!"
 BA_japan.17.d: "Content roughly about returning plundered territory."
 BA_japan.18.t: "Dismissal of Hayashi Senjuro"
 BA_japan.18.d: "His Imperial Majesty has directly dismissed Army Minister Hayashi Senjuro to break the arrogance of the Toseiha (Control Faction). Afterward, His Majesty spoke on stopping the conflict between the Toseiha and Kodoha (Imperial Way Faction); the Toseiha's spirit has been dampened, and the Kodoha seems satisfied."
 BA_japan.18.a: "What has happened?"
 BA_japan.19.t: "Decision"
 BA_japan.19.d: "Activities of the Young Officers' group supporting the Kodoha are becoming rapidly vigorous, and concerns about a coup are growing within the government. They frequently hold secret meetings, and contact with major military figures is becoming more frequent.\n\nHis Majesty the Emperor and the Japanese government are closely watching their movements, but no direct evidence has been captured yet. However, the atmosphere is unusual, and Japan is gripped by a tension as if a significant event is about to occur."
 BA_japan.19.a: "Prepare to suppress them all."
 BA_japan.19.b: "Let us support the Kodoha in secret."
 BA_japan.19.c: "Do not rush things too hastily."
 BA_japan.20.t: "Young Officers' Insurrection Attempt"
 BA_japan.20.d: "The Young Officers attempted to eliminate the cabinet and seize control of Tokyo, but the rebels failed in their primary goals of assassinating the Prime Minister and arresting high-ranking government officials. The armed uprising in Tokyo was suppressed faster than expected.\n\nThe government immediately declared a state of emergency and suppressed the rebels in cooperation with loyalists within the military. The leaders of the coup were arrested or killed on the spot, and the rebellion was completely suppressed.\n\nThe Emperor issued a statement condemning the treason of the Young Officers, and the government successfully concluded the suppression. The coup ended in failure, and the remaining forces of the Kodoha are destined for a thorough purge."
 BA_japan.20.a: "The Kodoha is finished now."
 BA_japan.21.t: "Total Resignation of the Okada Keisuke Cabinet"
 BA_japan.21.d: "After the Young Officers' coup was suppressed, Okada Keisuke's disastrous response led to constant criticism from the military and the subjects. Before long, Okada Keisuke announced the total resignation of the cabinet under pressure from the military.\n\nFollowing the collapse of the Okada cabinet, political attention is focused on who will become the Prime Minister of the newly organized cabinet."
 BA_japan.21.a: "Hirota Koki, the balanced Prime Minister."
 BA_japan.21.b: "Ugaki Kazushige, the military restrainer."
 BA_japan.21.c: "Hayashi Senjuro, the Toseiha."
 BA_japan.22.t: "Resignation of Hirota Koki"
 BA_japan.22.d: "Hirota Koki, who was under pressure from both inside and out due to continuous pressure from the military and low public approval ratings, eventually chose to resign as Prime Minister.\n\nFollowing Hirota Koki's resignation, the Toseiha succeeded in having Hayashi Senjuro appointed as Prime Minister through various political maneuvers."
 BA_japan.22.a: "Oh dear."
 BA_japan.23.t: "Organization of the Fumimaro Konoe Cabinet"
 BA_japan.23.d: "As anti-military sentiment increased and the Toseiha's successive political blunders continued, Japanese political circles felt the need for change. Against this backdrop, Fumimaro Konoe accepted the Emperor's request and organized a new cabinet amidst concentrated political interest. Despite pressure from the military, Konoe emerged as a political center and a leader with national expectations.\n\nImmediately after taking office, Konoe attracted great interest from the Kodoha and the public, and his moderate policy stance is being noted. It is known that Konoe is currently pushing for the relaxation of the National Security Act."
 BA_japan.23.a: "Let us trust him."
 BA_japan_23_tt: "§RIf the national reorganization is not completed by October 1940, Fumimaro Konoe will lose the momentum for political reform.§!"
 BA_japan.24.t: "Hayashi Senjuro's Dissolution of the Diet"
 BA_japan.24.d: "Immediately after taking office, Prime Minister Hayashi Senjuro formalized movements to neutralize the Diet. He hurried to deal with issues unresolved by the previous cabinet and forced the decision to dissolve the Diet. Some political parties protested strongly, but Hayashi ignored them and held a general election by rallying pro-military forces.\n\nHowever, the pro-military parties suffered a crushing defeat in the general election, and the attempt to re-dissolve the Diet to compensate for this failed. Eventually, opposition within the Diet intensified, and with the passage of a vote of no confidence, Hayashi quickly stepped down from the premiership."
 BA_japan.24.a: "Fumimaro Konoe will take the next premiership."
 BA_japan.25.t: "Resignation of Ugaki Kazushige"
 BA_japan.25.d: "Ugaki Kazushige, appointed as Prime Minister after the Kodoha's coup attempt, pushed for disarmament to recover the economy, but junior officers and the Toseiha within the military were dissatisfied with his policies. In particular, the decision to refuse the reinforcement of the garrison in Manchuria caused a major backlash.\n\nThe military criticized his leadership, shaking even national support. After the Army Minister announced his resignation under pressure from the Toseiha, Ugaki eventually judged that he could no longer maintain the cabinet and announced his resignation."
 BA_japan.25.a: "Fumimaro Konoe will take the next premiership."
 BA_japan.27.t: "Establishment of the Imperial Rule Assistance Association"
 BA_japan.27.desc: "The New Order Movement led by Fumimaro Konoe started with the noble goal of newly reforming Japan and escaping the influence of the military. However, as time passed, Konoe's ideals were gradually distorted under strong pressure from the military. The dream of reform grew distant, and his hands seemed tied under the military's powerful influence.\n\nUltimately, the 'Imperial Rule Assistance Association' was officially established today. This organization became crucial in integrating the Japanese people to create a national mobilization system for war and building a centralized political system where the military and government cooperate closely. All political parties were dissolved, and the Association became the sole political organization in Japan."
 BA_japan.27.a: "This will be useful."
 BA_japan.27.b: "He is completely playing into the hands of the military."
 BA_japan.27.c: "This has no effect on our great cause."
 BA_japan.27.d: "The political situation in Japan is about to face a major change."
 BA_japan_27_flag: "The §YImperial Rule Assistance Association§! has fallen into being a puppet of the military."
 BA_japan.28.t: "Establishment of the Imperial Rule Assistance Association"
 BA_japan.28.d: "In the midst of the crisis facing Japan, Fumimaro Konoe led the New Order Movement to newly rebuild the nation and construct a powerful integrated state free from the pressure of the military. With the conviction that the old and incompetent party political system could no longer lead Japan into the future, Konoe sought to build a new order aimed at national innovation and integration.\n\nFinally, under Konoe's leadership, the 'Imperial Rule Assistance Association' was officially established today. Following the Emperor's will, this organization will play a central role in rallying the Japanese people and reorganizing Japan into a modern and efficient nation through political and economic reforms. A new system based on the spirit of the nation and a balance between tradition and modernity has been launched.\n\nAll political parties have been dissolved, and as the sole engine for national reorganization, all citizens will cooperate under the Emperor's name to build a strong Empire. Japan's sun now shines with a new light, and the Empire's forward steps will never stop."
 BA_japan.28.a: "Let us move toward the New Order!"
 BA_japan.29.t: "Installation of Imperial General Headquarters"
 BA_japan.29.d: "As Japan becomes embroiled in war with [FROM.GetName], the 'Imperial General Headquarters' was installed under the leadership of the Toseiha for rapid war command and efficient mobilization of national resources. The Toseiha completely integrated the military and the cabinet to build a powerful military control system to lead the war systematically.\n\nHaving received the Emperor's approval, the Imperial General Headquarters will now function as the core body under the Toseiha's leadership, perfectly controlling Japan's conduct of the war and leading military decisions and national resource management. Japan will enter a full-scale wartime footing and conduct a rapid war."
 BA_japan.29.a: "Understood."
 BA_japan.30.t: "Establishment of the Japanese Revolutionary National System Alliance"
 BA_japan.30.d: "With the failure of Fumimaro Konoe's reforms, Japan's reformers fell into chaos. Under strong political pressure from the Toseiha, Konoe's moderate reforms were eventually frustrated, and in that gap, the radical ideas of Ikki Kita and the Kodoha began to rise once again. Advocating for a state revolution centered on the Emperor and supported by the Kodoha and radical military forces, the 'Revolutionary National System Alliance' was established.\n\nIkki Kita rallied powerful revolutionary forces under the slogan of ending the corrupt political system and the Toseiha's dictatorial rule to create a new Japan centered on the Emperor. He united radical elements within the military, nationalist intellectuals, and leftist social reformers, aiming for a fundamental reorganization of Japan."
 BA_japan.30.a: "We will cut out every single cancer cell of Japan."
 BA_japan.31.t: "Resignation of Fumimaro Konoe"
 BA_japan.31.d: "Prime Minister Fumimaro Konoe announced his resignation today. He stated that his work is finished and appears to have no intention of returning.\n\nUpon his resignation, Konoe recommended His Imperial Highness Prince Higashikuni Naruhiko as the next Prime Minister, but some ministers argue that Hideki Tojo should be appointed as Prime Minister to control the military."
 BA_japan.31.a: "Hideki Tojo—let us trust that he will listen to us."
 BA_japan.31.b: "Prince Naruhiko—with high authority, he should be able to suppress the military."
 BA_japan.32.t: "Hideki Tojo Resigns, Taking Responsibility for the Occupation of [JAP_tojo_hideki_end.GetName]"
 BA_japan.32.d: "While we were preparing for war with [USA.GetName], Prime Minister Hideki Tojo faced various oppositions. And now, in a situation where the war was being conducted under the leadership of the Tojo cabinet, the occupation of our territory by [USA.GetName] has occurred, so Tojo must now step down.\n\nKuniaki Koiso, the former Governor-General of Korea, has been appointed as the successor to Hideki Tojo, who resigned under political pressure."
 BA_japan.32.a: "Can Kuniaki Koiso overcome this situation?"

 BA_japan.40.t: "Wang Jingwei Defects to Japan!"
 BA_japan.40.d: "Shocking news has arrived. It is reported that Wang Jingwei, known as a hero of the revolution and the successor to Sun Yat-sen, escaped Chongqing and arrived in Shanghai, currently occupied by Japan.\n\nThe power conflict with Chiang Kai-shek, which began with the Chiang-Wang cooperation, increasingly isolated him. In particular, when Chiang Kai-shek became the Chairman of the Kuomintang and pushed Wang Jingwei to the position of Vice-Chairman, the relationship between the two completely broke down.\n\nLater, when Wuhan fell, Wang Jingwei judged that resistance was no longer meaningful, made a secret pact with Japan, escaped Chongqing, and went to Hanoi. This action was enough to be suspected as betrayal, and the National Government ordered Wang Jingwei's assassination. However, he luckily escaped the assassination attempt and severed ties with Chiang Kai-shek and the National Government, which used force despite him not having committed an explicit act of treason."
 BA_japan.40.a: "\"Elder brother, take the easy path. Younger brother will take the difficult path.\""
 BA_japan_40_tt: "\"Grieved and pained. I only hope for self-reflection and return.\"\n-Chiang Kai-shek"

 BA_japan.41.t: "Wang Jingwei Joins the Reformed Government"
 BA_japan.41.d: "The Wang Jingwei operation, attempted to end the prolonged Sino-Japanese War and following the failure of the Trautmann mediation, has succeeded! Wang Jingwei arrived in Shanghai and began discussing the National Government of the Republic of China under his leadership with numerous pro-Japanese figures."
 BA_japan.41.a: "The war will end soon!"

 BA_japan.42.t: "The Fate of [MEN.GetName]"
 BA_japan.42.d: "[MEN.GetName] is a rather contradictory government. Established for Mongolians, the territory under its effective control is inhabited by more Chinese and Manchurians than Mongolians. Now we must decide their fate."
 BA_japan.42.a: "Use it as a bridgehead to swallow [MON.GetAdjective]."
 BA_japan.42.b: "It's no longer needed; demote it to an autonomous government of [WCH.GetAdjective]."
 BA_japan.42.c: "Demote it to an autonomous government of [WCH.GetAdjective] and use it as a pretext to claim sovereignty over [MON.GetAdjective]."

 BA_japan.43.t: "Negotiations with [TIB.GetAdjective]"
 BA_japan.43.d: "Tibet is located on the periphery of China, but because it is situated right above British India, it is advantageous for a flank attack. Conversely, this means that if Britain exerts influence over Tibet and incorporates it as a colony, China's flank will be at risk. Therefore, we must firmly lead Tibet into the Greater East Asia Co-Prosperity Sphere."
 BA_japan.43.b: "If we hand over [601.GetName] and [604.GetName], they will join our cause."

 BA_japan.44.t: "Negotiations with [FROM.GetAdjective]?"
 BA_japan.44.d: "Blah blah blah... honestly, who would play as Tibet? I don't think there's anyone like that."
 BA_japan.44.a: "This is exactly what was needed."

 BA_japan.45.t: "[FROM.GetAdjective] Decides to Participate in Our Cause"
 BA_japan.45.d: "[FROM.GetAdjective] has decided to participate in our cause! With this, we are one step closer to Greater East Asian Co-Prosperity."
 BA_japan.43.a: "Banzai!"

