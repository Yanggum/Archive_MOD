 BA_JAP_unstable_political_structure: "Unstable Political Structure"
 BA_JAP_unstable_political_structure_desc: "Japan's current political structure is nothing short of a battlefield where the military and political circles sharply face off. The power struggle will continue until a single faction can properly dominate the regime."
 JAP_fumimaro_konoe: "Fumimaro Konoe"
 JAP_kita_ikki: "Ikki Kita"
 JAP_kita_ikki_trait: "Demon King"
 JAP_kita_ikki_political_advisor_trait: "Japanese Revolutionary"
 JAP_control_of_the_military_fascism: "Revolutionary National System Alliance"
 JAP_revolutionary_national_system_alliance: "Revolutionary National System Alliance Central Committee"
 JAP_revolutionary_national_system_alliance_trait: "Japan Reconstruction Society"
