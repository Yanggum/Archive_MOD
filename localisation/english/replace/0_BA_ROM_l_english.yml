l_english:

 ROM_modify_the_constitution: "Defending the Constitution"
 ROM_modify_the_constitution_desc: "The preservation of our constitutional order is paramount to ensuring the stability of the Kingdom."
 


 #Balkan Dominance
 ROM_big_empire: "Construction of Greater Romania"
 ROM_big_empire_desc: "We have not only secured dominance over the Balkans but have also subjugated the otherworldly entities, rising as a new Great Power."

 ROM_attack_ITA: "Securing the Mediterranean"
 ROM_attack_ITA_desc: "The Mediterranean is a vital maritime theater. While the opposition is formidable, that is no reason to abandon our claims to its waters."

 ROM_secure_the_SHA: "Securing Austria"
 ROM_secure_the_SHA_desc: "Unknown enemies have left Europe in shambles. As the first step of our great crusade, we shall first liberate Austria."
 
 ROM_be_roma: "The True Successor of Rome"
 ROM_be_roma_desc: "Our nation's name identifies us as Romans, and we have always claimed that heritage. Now that Rome itself is within our grasp, who could possibly deny that we are the true heirs to the Roman legacy?!"


 # Fascism
 ROM_appoint_TRM_friendly_government: "Appoint Pro-Pater Government"
 ROM_appoint_TRM_friendly_government_desc: "The future of Romania depends on maintaining favorable relations with the otherworldly powers rising in the West. We must appoint a government that understands this reality."




 #Non-Aligned
 ROM_all_parties_must_continue: "The Party Must Go On"
 ROM_all_parties_must_continue_desc: "To solidify the King's position, the festivities must continue. Regardless of the fiscal strain, we must maintain this political momentum through social engagement."
