 SYR_focus_com_20: "시리아-소련 공동 연구"
 SYR_focus_com_20_desc: "소련과의 협력은 노동자 국제주의의 연장선입니다."
 SYR_focus_com_21: "시리아-소련 산업 협력"
 SYR_focus_com_21_desc: "소련과의 협력은 노동자 국제주의의 연장선입니다."
 SYR_focus_com_22: "레반트 혁명론"
 SYR_focus_com_22_desc: "레반트 지방은 공통된 특성을 지니고 있습니다. 혁명은 레반트 지역 전역에서 진행되어야 합니다!"
 SYR_focus_com_24: "집산주의 선전"
 SYR_focus_com_24_desc: "집단의 힘을 강조해야 합니다."
 SYR_focus_com_26: "주체적인 군사개혁"
 SYR_focus_com_26_desc: "노동자 민병대와 전위조직으로 구성되어 있는 군제를 개편해야 합니다."
 SYR_focus_com_27: "내수 경제 활성화"
 SYR_focus_com_27_desc: "자립없이 반제국주의는 실현될 수 없습니다."
