 SYR_focus_com_17: "중동 사회주의의 보루"
 SYR_focus_com_17_desc: "우리는 중동 사회주의의 보루로 우뚝 서 담담하고 당당하게 사회주의를 외칠 것입니다!"
 SYR_focus_com_18: "마르크스-레닌주의"
 SYR_focus_com_18_desc: "국제 공산주의 운동의 강령과 원칙을 강력히 지켜야 합니다."
 SYR_focus_com_19: "시리아-소련 무역 협정"
