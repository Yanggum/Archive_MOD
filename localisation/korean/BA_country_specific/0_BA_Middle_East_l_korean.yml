 #시리아 이벤트
 SYR_event.1.t: "독립"
 SYR_event.1.d: "우리 시리아 전역에 주둔하고 있던 프랑스군의 대부분이 본토로 복귀하여 이계의 존재와 싸울 때, 시리아인들은 행동했습니다!\n\n 노동자, 농민, 기업가, 종교인, 지식인들이 힘을 합하여 제국주의 압제 세력을 몰아내었고, 많은 희생이 따랐으나 1920년의 독립시도와 3년 간의 드루즈 봉기의 실패를 딛고 33년의 헌법 정지를 넘어선 채, 마지막 프랑스군이 시리아에서 철수하며 최종적인 독립을 이뤄냈습니다. 시리아인들은 환호하고 있으며, 새로운 국가를 구상하기 위해서 시민 사회는 분주합니다!"
 SYR_event.1.a: "해방 시리아 만세!"
 SYR_event.2.t: "[SYR.getname]의 경제 원조 요청"
 SYR_event.2.d: "프랑스의 식민통치에서 갓 벗어난 [SYR.getname] 정부는 해방 직후 경제 성장을 지원받기 위해 반제국주의 운동의 선봉인 우리 소련을 찾았습니다."
 SYR_event.2.a: "그들을 도와주자."
 SYR_event.2.b: "우리도 바쁜걸."
 SYR_event.3.t: "소련으로부터의 경제 원조"
 SYR_event.3.d: "소비에트 연방은 우리의 원조 요청을 수락하기로 하였습니다."
 SYR_event.3.a: "고맙군."
 SYR_event.4.t: "시리아의 산업 지원 요청"
 SYR_event.4.d: "[SYR.getname] 경제부처는 우리에게 경제를 지원해줄 것을 요청했습니다. 그들의 산업을 돕는 대가로 우리는 그들에게서 원하는 것을 얻을 수 있을지도 모릅니다."
 SYR_event.4.a: "솔깃하군."
 SYR_event.4.b: "그들과의 협력은 불필요하다."
 SYR_event.5.t: "[FROM.getname]의 수락"
 SYR_event.5.d: "[FROM.getname] 정부는 우리의 지원 요청에 응했습니다. 다만 우리는 그들이 원하는 대가를 치뤄야만 합니다."
 SYR_event.5.a: "고맙군."
 SYR_event.6.t: "[FROM.getname]의 거절"
 SYR_event.6.d: "[FROM.getname] 정부는 우리의 지원 요청을 거절했습니다."
 SYR_event.6.a: "아쉽군."
 SYR_event.7.t: "토지 개혁"
 SYR_event.7.d: "토지 개혁의 진행에 있어서 온건파와 급진파가 의견이 갈렸습니다. 우리 당의 온건파 세력은 농민들에게 우선 토지를 불하하여 1차 토지 개혁을 완료한 뒤, 훗날 생산력이 충분히 뒷받침됐을 때 농업 집단화를 실시하자고 제안합니다. 다른 한편, 당의 급진파는 이러한 자영농의 등장이 노동대중 전반에 불온한 소부르주아 사상을 촉진시킬 수 있으며, 이것이 반혁명으로 이어질 것에 대한 우려를 표하며 급진적인 농업 집단화를 주문합니다."
 SYR_event.7.b: "토지를 불하하자."
 SYR_event.7.a: "집단농업으로 나아가자!"
 SYR_event.8.t: "자유 선거"
 SYR_event.8.d: " 프랑스로부터 독립한 지 얼마 되지 않은 시리아를 이끌기 위해 200명의 직업과 계층을 불문한 시리아인들이 각 지역구에서 선출되었습니다. 이들은 다양한 배경을 가졌으며 종교인, 교수, 공무원, 지주와 같은 전통적인 엘리트부터 노조원, 학생, 빈민과 같은 하층민으로 여겨지는 이들로 구성되었습니다.\n\n 인민평의회에서 다수를 차지한 세력은 앞으로의 시리아를 정의하고 선언할 수 있으며, 그렇기 때문에 각 정당들은 각자 행동을 준비하고 있었지만, 시리아 독립 조약을 주도하고 지난 파업을 기획했던 국민블록이 높은 지지율로 정권을 가져왔습니다!"
 SYR_event.8.a: "공화 시리아 만세!"
 SYR_event.9.t: "직접 행동"
 SYR_event.9.d: " 시리아의 노동자, 농민, 빈민, 학생, 지식인 대중들이 일제히 파업에 돌입했습니다. 거리는 집회로 북적였으며, 공공시설은 계획된 습격에 의해 일제히 시위세력에 의해 점거되었습니다.\n\n 시리아-레바논 공산당은 민족평의회에서 노동대중의 요구를 적극 수용하며 해방된 사회주의 시리아로 사회를 재조직할 것을 선언했습니다."
 SYR_event.9.a: "혁명이다!"
 SYR_event.10.t: "왕실에 충성을 맹세한 [FROM.getname]!"
 SYR_event.10.d: "[FROM.GetAdjective]은(는) 우리 왕실에게 충성을 맹세했습니다."
 SYR_event.10.a: "고맙군."
 SYR_event.11.t: "영연방 가입 요청"
 SYR_event.11.d: "[FROM.getname](으)로부터 영연방 가입을 요청했습니다."
 SYR_event.11.a: "충성스러운 그들을 받아들이자."
 SYR_event.11.b: "그들은 준비가 되지 않았다."
 SYR_event.12.t: "[FROM.getname]의 거절"
 SYR_event.12.d: "우리의 제안은 거절되었습니다."
 SYR_event.12.a: "아쉽군."
 SYR_event.13.t: "시리아 총파업"
 SYR_event.13.d: " 지난 10여 년 간 진행되었던 시리아-레바논에서의 식민지배는 더 이상 지속될 수 없음이 자명해지고 있습니다. 시리아 총파업으로 거리는 진작에 마비되었고, 시리아 주둔군은 꽤나 큰 피해를 입고 있는 상황입니다. 설상가상으로 시리아 총파업은 주변 아랍 국가들의 동맹파업과 연대집회로 이어지고 있으며, 팔레스타인, 레바논, 요르단 등에서 유의미한 정치적 운동을 형성하고 있습니다.\n\n 원수 각하께서는 이와 같은 대치가 프랑스의 국익에 도움이 되지 않는다는 사실을 잘 알고 계십니다. 프랑스를 위해서라면 그는 말끔히 정장을 차려입은 채, 시리아와 열린 대화를 할 준비가 돼있으십니다."
 SYR_event.13.a: "2보의 전진을 위한 1보의 후퇴다."
 SYR_event.14.t: "[SYR_mehemed_ali_abed.getname]의 사임"
 SYR_event.14.d: "약 4년동안 대통령직을 수행했던 [SYR_mehemed_ali_abed.getname]는 대프랑스 외교에서 너무 유화적이라는 비판을 가끔 받았지만, 그가 우리의 친애하는 독립운동가 중 한 명임은 분명합니다. 그는 독립 이후 신정권의 창출을 돕기 위해서 대통령직에서 사임할 것을 발표했으며, 자유 의회는 시리아 총파업을 기획하고 지시한 [SYR_hashim_al_atassi.getname]를 신임하였기 때문에, 그가 뒤이어 대통령직을 수행하기로 결정되었습니다."
 SYR_event.14.a: "새로운 대통령을 환영하자."
 SYR_event.15.t: "궐기"
 SYR_event.15.d: "나약한 의회민주주의는 더 이상 우리가 고려할 사항이 아닙니다. 용맹하고 깨어있는 장교단은 사회민족당과 손잡고 수도를 급습했습니다. 일부 저항이 있었으나 모두 무력화되었고, 끝내 정권은 탈취되었습니다. 다만, 농촌에서 우리의 이러한 행동을 묵인할지는 여전히 미지수입니다!"
 SYR_event.15.a: "궐기 만세!"
 SYR_event.16.t: "서방과의 우호"
 SYR_event.16.d: "비록 독립하긴 했으나 우리는 여전히 공산주의와 파시즘의 위협에 맞서 민주주의를 수호해야 하는 비탈길 위에 서있습니다. 서방과의 공조는 민족 감정에 앞서 민주정체의 수호를 위한 것입니다!"
 SYR_event.16.a: "사람들이 이걸 이해해줄까?"
 SYR_event.17.t: "키프로스 매입 요청"
 SYR_event.17.d: "[FROM.getname](으)로부터 키프로스를 매입하고자 요청이 왔습니다."
 SYR_event.17.a: "좋은 거래다."
 SYR_event.17.b: "무례하군."
 SYR_event.18.t: "[FROM.getname]의 최후통첩"
 SYR_event.18.d: "[FROM.GetAdjective] 정부는 동남부 영토를 요구하며 최후통첩을 보냈습니다. 이는 대부분 쿠르드족의 영토이지만 확실한 주권침탈입니다!"
 SYR_event.18.a: "평화보다 값진 건 없다."
 SYR_event.18.b: "무례하군!"
 SYR_event.19.t: "쿠데타!"
 SYR_event.19.d: "[SYR.getname]의 사주를 받은 것으로 추정되는 파시스트 장교단이 쿠데타를 일으켰습니다."
 SYR_event.19.a: "신이라크 만세!"
 SYR_event.19.b: "저지해라!"
 SYR_event.20.t: "파괴된 계급 협조"
 SYR_event.20.d: "민주주의의 기치 아래 계급 협조를 유지하며 자유 시리아를 개혁해 나간다는 것은 순진하기 짝이 없는 이상론적 망상이었습니다. 결속은 깨졌고, 연대는 무너져 내렸습니다. 지방에서는 각기 다른 세력들이 봉기하고 있습니다!"
 SYR_event.20.a: "젠장!"
 SYR_event.20_tt_1: "중점 §Y$SYR_focus_dem_9$§!를 완료하여 공산주의로 이어갈 수 있습니다!\n"
 SYR_event.20.b: "계급투쟁이란 말이 괜히 있는 게 아니지."
 SYR_event.21.t: "[FROM.getname]의 무역협정 제안"
 SYR_event.21.d: "[FROM.GetAdjective] 정부는 우리에게 무역협정을 체결할 것을 제안했습니다."
 SYR_event.21.a: "솔깃하군."
 SYR_event.21.b: "우리가 왜?"
 SYR_event.22.t: "[SYR.getname]의 통합 제안"
 SYR_event.22.d: "오랜 시간 식민지배를 함께 견뎌내며 같이 해왔던 시리아 동지들이 우리들과의 통합을 제안했습니다."
 SYR_event.22.a: "우린 형제다!"
 SYR_event.22.b: "이는 팽창주의에 불과하다."
 

 #시리아 중점
  #정치 중점
 SYR_focus_dom_0: "시리아 총파업"
 SYR_focus_dom_0_desc: "우리는 기회를 잡았습니다. 국민블록의 지도 아래 상점들은 문을 걸어잠구고, 노동자들은 손을 비웠습니다. 그 무엇도 생산되고 있지 않고, 정부는 마비에 놓여있습니다!"
 SYR_focus_dom_1: "진화"

 SYR_focus_0: "프랑스와의 회담"
 SYR_focus_0_desc: "우리는 강대강 대치로는 아무것도 해결할 수 없다는 것을 깨달아야 합니다. 프랑스의 급격한 상황 변화는 우리에게 협상에서 유리한 고점을 마련해 줄 것입니다."
 SYR_focus_1: "실용적인 적대 종료"
 SYR_focus_1_desc: "비록 제국주의 정권이라 할지라도 서방과의 협력은 민주주의의 유지에 필수적입니다. 서방 자유주의를 유지하기 위해서 우리는 적대를 일시적으로 중단해야 합니다."
 SYR_focus_2: "재건당국"
 SYR_focus_2_desc: "지난 파업 기간 동안 시리아의 산업은 큰 피해를 입었습니다. 재건당국은 경제 전반에 걸쳐서 효율을 증진시키기 위해 활동할 것입니다."
 SYR_focus_3: "프랑스인 재산 분배"
 SYR_focus_3_desc: "우리를 수탈하던 프랑스인의 재산을 분배해야 합니다."
 SYR_focus_4: "반제국주의 연대"
 SYR_focus_4_desc: "언제 또 다시 침략자들이 들이닥칠지 모릅니다. 소련과의 반제국주의 연대는 우리를 강대국의 침략으로부터 보호할 것입니다."
 SYR_focus_5: "상공업 지원"
 SYR_focus_5_desc: "자본주의의 맹아를 길러내야 합니다."
 SYR_focus_6: "지역방위계획"
 SYR_focus_6_desc: "독립을 거머쥐었지만, 우리의 국경은 너무나 불안합니다. 우리는 일시적으로 급속히 무장할 필요가 있습니다."
 SYR_focus_7: "노동자 무장"
 SYR_focus_7_desc: "노동자들에게 직접 무기를 쥐어줌으로써 더 많은 방위대를 확보할 수 있습니다."
 SYR_focus_8: "장교 통제"
 SYR_focus_8_desc: "유용한 장교들을 배치하여 정규군을 육성해야 합니다."
 SYR_focus_9: "개헌"
 SYR_focus_9_desc: "지난 번에 정지되었던 1933년의 헌법을 다시 제정할 것입니다."
 SYR_focus_10: "표현의 자유"
 SYR_focus_10_desc: "정치적 활동의 자유를 보장함으로써 많은 정파들의 불만들을 누그러트릴 수 있습니다."
 SYR_focus_12: "장교단 포섭"
 SYR_focus_12_desc: "군부에는 사회민족당에 충성하는 젊은 장교들이 많이 있습니다. 우리는 이들을 포섭함으로써 정권 찬탈을 준비할 수 있습니다."

 SYR_focus_dem_0: "계층별 협조"
 SYR_focus_dem_0_desc: "공화주의의 핵심은 공공선을 향한 다원적 협력입니다. 서로 다른 사회계층은 공동체 위에 놓인 하나의 목표를 향해 서로 손을 내밀어야 합니다."
 SYR_focus_dem_1: "상인 우대"
 SYR_focus_dem_1_desc: "중동 지역에서는 전통적으로 상인들이 활발히 활동하고 있습니다. 이들을 단순히 우대하는 것만으로 우리는 자본주의 경제에 더욱 다가갈 수 있습니다."
 SYR_focus_dem_2: "현대적 금융업"
 SYR_focus_dem_2_desc: "금융은 - 또 다른 신입니다. 우리는 크고 작은 돈을 주요한 사업에 집중할 수 있게 해주는 이 제도를 적극적으로 활용해야 합니다."
 SYR_focus_dem_3: "지주와 제휴"
 SYR_focus_dem_3_desc: "전통적으로 프랑스와 협력하여 지역에서 큰 정치적 영향력을 발휘하고 있는 지주들과의 제휴는 우리의 정치적 영향력을 강화할 것입니다."
 SYR_focus_dem_4: "지주보호법"
 SYR_focus_dem_4_desc: "우리가 지주의 이권을 보장하는 만큼, 지주 또한 우리가 그들의 대토지에서 추진할 계획에 대해 간섭하지 않을 것입니다."
 SYR_focus_dem_5: "시리아 공화주의"
 SYR_focus_dem_5_desc: "우리는 독자적인 공화주의 사상을 근동에서 피워낼 것입니다."
 SYR_focus_dem_6: "자유주의 지식인 후원"
 SYR_focus_dem_6_desc: "우리에겐 대중들로부터 근대화를 선도할 계층이 필요합니다."
 SYR_focus_dem_6_tt: "£GFX_syria_intellect_texticon §Y지식인§!: 정부에 참여"
 SYR_focus_dem_7: "여성권리 확대"
 SYR_focus_dem_7_desc: "여성이 산업 현장에 나설수록, 우리의 발전은 더 빠르게 거듭날 것입니다."
 SYR_focus_dem_8: "기업가 지원"
 SYR_focus_dem_8_desc: "기업가들이야 말로 이 시대의 진정한 애국자입니다. 그들의 투자를 촉진함으로써 우리는 산업을 더욱 길러낼 수 있습니다."
 SYR_focus_dem_9: "노동 헌장"
 SYR_focus_dem_9_desc: "18세기 초반의 산업현장이 얼마나 끔찍한지 우리는 이미 알고 있습니다. 시리아를 공산화로부터 지켜내려면 노동자의 요구를 일부 수용할 필요가 있습니다."
 SYR_focus_dem_10: "근대 국가"
 SYR_focus_dem_10_desc: "우리는 더 이상 보수적인 이슬람-식민주의 사회에 머물지 않을 것입니다."
 SYR_focus_dem_11: "능동적 중립"
 SYR_focus_dem_11_desc: "베네치아 연방 무기고에는 '평화의 시기에도 전쟁을 생각하는 도시에는 행복이 있으리니'라고 새겨져 있습니다."
 SYR_focus_dem_12: "국제 협력"
 SYR_focus_dem_12_desc: "국제 사회에 발을 내딛어 주요 강대국과 제휴해야 합니다."
 SYR_focus_dem_13: "지중해 무역 협정"
 SYR_focus_dem_13_desc: "지중해를 통한 대규모 무역은 우리에게 굉장히 매력적인 사안입니다."
 SYR_focus_dem_14: "흑해를 통한 교류"
 SYR_focus_dem_14_desc: "소련의 넘쳐나는 자원을 값싸게 활용하여 산업을 증진해야 합니다."
 SYR_focus_dem_15: "중동 협력"
 SYR_focus_dem_15_desc: "이웃 국가들과의 관계를 조정해야 합니다."
 SYR_focus_dem_16: "레바논과의 통합 논의"
 SYR_focus_dem_16_desc: "프랑스 식민주의에 함께 맞선 동지들을 맞이할 준비가 되어있습니다."
 SYR_focus_dem_17: "근동 민주주의의 횃불"
 SYR_focus_dem_17_desc: "여전히 구태적인 체제에 머물러 있는 중동 국가들을 민주주의의 횃불 아래 해방할 필요가 있습니다."
 SYR_focus_dem_17_tt: "\n§Y중동§!의 모든 §g비민주주의§! 국가:" 


 SYR_focus_fas_0: "시가 행진"
 SYR_focus_fas_0_desc: "우리는 시민들과 함께 수도를 점거할 것입니다."
 SYR_focus_fas_1: "총궐기"
 SYR_focus_fas_1_desc: "야밤에 빠른 습격으로 정부청사를 장악하고 신정부를 선언할 것입니다."
 SYR_focus_fas_2: "일당독재 실시"
 SYR_focus_fas_2_desc: "우리가 중동의 파시즘 운동입니다."
 SYR_focus_fas_3: "민족주의 이데올로기"
 SYR_focus_fas_3_desc: "시리아 민족이라는 관념은 그 어떤 종교나 사상 위에 놓여져야 마땅합니다."
 SYR_focus_fas_4: "국방국가"
 SYR_focus_fas_4_desc: "국가 전반의 군사화는 강한 국가의 초석입니다."
 SYR_focus_fas_5: "전시 산업"
 SYR_focus_fas_5_desc: "우리는 전쟁을 대비해야 합니다."
 SYR_focus_fas_6: "반서방 선전"
 SYR_focus_fas_6_desc: "서방 제국주의자들은 우리에게 많은 것을 앗아갔습니다. 우리는 그보다 더 많이 찾아올 것입니다."
 SYR_focus_fas_7: "해외 파시즘 제휴"
 SYR_focus_fas_7_desc: "우리는 해외의 파시즘 동지들과 연대할 것입니다."
 SYR_focus_fas_7_tt: "유의미한 동맹임"
 SYR_focus_fas_8: "중동 패권"
 SYR_focus_fas_8_desc: "대시리아를 향한 길에 첫 발을 내딛기 위해서는 중동 패권을 두고 주변국들과 경쟁해야 합니다."
 SYR_focus_fas_9: "키프로스 매입"
 SYR_focus_fas_9_desc: "키프로스는 문화적으로 시리아에 속하는 것이 자명합니다. 우리는 평화적으로 이를 요구할 것입니다."
 SYR_focus_fas_10: "터키 분할"
 SYR_focus_fas_10_desc: "터키의 동남부는 자명히도 시리아의 권역에 해당합니다."
 SYR_focus_fas_11: "대시리아 통합 전쟁"
 SYR_focus_fas_11_desc: "레반트 남부의 국가들에 총공세를 가할 것입니다."
 SYR_focus_fas_12: "이라크 쿠데타 지원"
 SYR_focus_fas_12_desc: "이라크의 파시즘 운동을 지원하고 대가로 우리의 영토를 되찾을 것입니다."
 SYR_focus_fas_13: "세계 파시즘 산업 협력"
 SYR_focus_fas_13_desc: "동맹국들과의 산업연계로 상호부조를 이룰 것입니다."
 SYR_focus_fas_14: "단일하고 통합된 시리아!"
 SYR_focus_fas_14_desc: "대시리아가 완성되었습니다. 단일하고 통합된 시리아 아래 조국과 사회민족당이 있고, 시리아 민중들이 있습니다, 대시리아 만세!"

 SYR_revolution_to_lebanon: "[LEB.getadjective] 압박"
 SYR_revolution_to_lebanon_desc: "레바논은 본래 시리아와 행정구역을 같이 합니다. 우리의 이념을 저들에게 강요할 필요가 있습니다."
 SYR_focus_com_0: "혁명 전야"
 SYR_focus_com_0_desc: "무장한 노동자들을 규합해 수탈과 착취의 연장선인 자본주의를 무너트릴 계획을 구상해야 합니다."
 SYR_focus_com_1: "당 병합"
 SYR_focus_com_1_desc: "시리아 공산당과 당을 병합하여 효율적인 행정을 이룩해야 합니다."
 SYR_focus_com_2: "부르주아 탄압"
 SYR_focus_com_2_desc: "부당하게 모은 부를 국가에 귀속해야 합니다."
 SYR_focus_com_3: "전위당의 지도"
 SYR_focus_com_3_desc: "아직 시리아의 대중들은 미숙합니다. 그들은 전위당의 지도 아래 사회주의를 학습하고 해방으로 나아갈 수 있습니다."
 SYR_focus_com_4: "유연한 종교 정책"
 SYR_focus_com_4_desc: "종교의 자유를 억압할 필요는 없을 것 같습니다."
 SYR_focus_com_5: "붉은 근대화"
 SYR_focus_com_5_desc: ""
 SYR_focus_com_6: "관료 조직화"
 SYR_focus_com_6_desc: "근대적 관료제는 행정적 효율을 가져다 줄 것입니다."
 SYR_focus_com_7: "토지 개혁"
 SYR_focus_com_7_desc: ""
 SYR_focus_com_8: "지식계층 양성"
 SYR_focus_com_8_desc: ""
 SYR_focus_com_9: "인민해방전선"
 SYR_focus_com_9_desc: "독립된 군부가 아니라, 사회주의에 복무하는 군대가 필요합니다."
 SYR_focus_com_10: "시리아-소련 군사협력"
 SYR_focus_com_10_desc: "코민테른에의 가입은 식민주의로부터 우리를 보호해줄 것입니다."
 SYR_focus_com_11: "작업장 평의회"
 SYR_focus_com_11_desc: "더 이상 자본가가 노동자들을 감독하게 내버려 둘 수 없습니다. 노동자들은 일시적으로 평의회를 조직해서 공장을 운영할 것입니다."
 SYR_focus_com_12: "노동자 자주경영"
 SYR_focus_com_12_desc: "우리는 노동자들의 공장 운영에 더욱 자율성을 부여할 것입니다."
 SYR_focus_com_13: "민주집중제"
 SYR_focus_com_13_desc: "우리는 하달식 경제체제를 통해 계획경제로 나아갈 것입니다."
 SYR_focus_com_14: "공공사업"
 SYR_focus_com_14_desc: "이윤이 아닌 인민을 위해 사업을 기획할 것입니다."
 SYR_focus_com_15: "혁명 옹위"
 SYR_focus_com_15_desc: "우리가 근동에서 피워낸 붉은 불꽃을 꺼트리려고 하는 반동들이 근처에 도사리고 있습니다!"
 SYR_focus_com_16: "국제주의 옹호"
