 ##키보토스 민족주의 
 COU_kivotos_nationalism_decision:0 "키보토스 민족주의"
 COU_kivotos_nationalism_decision_desc:0 "키보토스 민족주의라는 개념이 학생들에겐 생소한 개념일 수 있지만, 새로운 이계의 세상으로 전이된 그날 이후로부터 키보토스는 꾸준히 단결과 협력을 필요로 했습니다. 새로운 키보토스에서의 민족주의는 키보토스 우월주의를 바탕으로 키보토스인의 단결과 옛 체제의 부활을 목표로 할 것입니다."
 COU_deepening_nationalist_sentiment:0 "민족주의 정서 심화"
 COU_deepening_nationalist_sentiment_desc:0 "각종 매체를 동원해 이루어질 키보토스 민족주의에 대한 선전은 학생들의 억눌려 있던 새로운 애국심을 자극할 것입니다."
 COU_expansion_of_racial_segregation:0 "인종분리 가속화"
 COU_expansion_of_racial_segregation_desc:0 "\"기억하세요, 현지인 거주 구역은 오른쪽, 키보토스인 거주 구역은 왼쪽입니다.""
 COU_our_sacred_war:0 "성전"
 COU_our_sacred_war_desc:0 "우리의 전쟁은 우리의 승리로 끝나야 합니다. 그리고 그 과정들은 신앙의 믿음 아래 키보토스를 재통일하기 위한 신성한 성전이며 어떠한 고난이 닥치더라도 그 누구도 우리를 막을 수 없을 것입니다!"
 COU_change_southern_cities_names:0 "북프랑스-플란데런 키보토스화"
 COU_change_southern_cities_names_desc:0 "대전이 이후 '흡수' 당했던 북프랑스와 플란데런 지역은 우리의 통치에 가장 유화적이게 반응했으며 순응적인 모습 또한 보였고 많은 키보토스인들이 남부로 이주해 새로운 삶을 꾸렸습니다. 이곳은 새로운 키보토스의 일원이나 마찬가지이며 새로운 이름을 부여해 줄 필요가 있습니다."
 COU_tooltip_change_southern_cities_names:0 "도시의 이름들이 다음과 같이 변경됩니다:\n  £white_dot §Y마스트리흐트§! £right_arrow  §Y트라이아§!\n  £white_dot §Y뢰번§! £right_arrow  §Y로바니아§!\n  £white_dot §Y헨트§! £right_arrow  §Y간디아§!\n  £white_dot §Y코르트레이크§! £right_arrow  §Y코르토리아§!\n  £white_dot §Y릴§! £right_arrow  §Y이슬라§!\n  £white_dot §Y됭케르크§! £right_arrow  §Y파눔 아레나§!\n  £white_dot §Y칼레§! £right_arrow  §Y칼레시아§!"
 #도시 어원: Traiectum/Traia, Lovanium/Lovania, Ganda/Gandia, Cortoriacum/Cortoria, L'Isle/Isla, Duinkerke/Fanum Arena, Calesium/Calesia
