 COU_focus_upgrade_power_of_collabs_desc:0 ""
 COU_focus_executive_order_3511:0 "행정명령 3511호 파기"
 COU_focus_executive_order_3511_desc:0 ""
 COU_focus_recontrol_valkyrie:0 "발키리 재통제"
 COU_focus_recontrol_valkyrie_desc:0 ""
 COU_focus_control_kronos_news:0 "크로노스 스쿨 장악"
 COU_focus_control_kronos_news_desc:0 ""
 COU_focus_digital_hallucination:0 "디지털 환상"
 COU_focus_digital_hallucination_desc:0 "
 COU_recruit_purge_our_antifans:0 "공포정치"
 COU_recruit_purge_our_antifans_desc:0 "총학생회장과 린의 실수는 바로 그녀들을 비방하고 깎아내리는 반대파들을 가만히 내버려둔 것입니다. 하지만 카야는 그런 멍청한 사람들과는 다릅니다. 그때처럼 반대파들의 뒷담화에 쉽게 당해주지는 않을 것입니다. 그들이 권력을 존중할 생각을 하지 않는다면, 그렇게 하도록 하면 됩니다. 우매한 시민들은 속이면서 말입니다."
 COU_recruit_fox_srt:0 "폭스 소대 동원"
 COU_recruit_fox_srt_desc:0 ""
 SRT_FOX_REAVAILABLE:0 "§Y폭스 소대원§!들이 사용 가능해집니다."
 COU_focus_death_for_rin_friends:0 "친린파의 잔해 추적"
 COU_focus_death_for_rin_friends_desc:0 "교통실의 모모카, 조정실의 아유무는 몇 남지 않은 대표적인 총학생회 내 친린파로서 공포정치가 시작된 이후 어디론가 모습을 감췄습니다. 이들의 소재가 정확히 밝혀지지 않는다면 카야의 정치적 영향력은 꾸준히 위협받을 수 밖에 없기 때문에, 폭스 소대원들을 동원해 이들을 찾아내 연금시키는 것이 훌륭한 대안일 것입니다."
 COU_focus_forced_oath_of_allegiance:0 "충성 강제"
 COU_focus_forced_oath_of_allegiance_desc:0 "반대파들이 무력 저항을 시도하지 않았던 이유는 반대파들이 끝까지 맹신하던 무력 중립에 관한 신뢰 때문이었습니다. 맞습니다, 카야는 멋대로 방위실을 동원해서 총학생회를 장악할 순 없습니다. 그러나 저자들이 놓친 것은, 협력자들은 사실상 카야의 사병 집단이라는 점입니다."
 COU_focus_gonna_gsc_leader:0 "총학생회장 취임"
 COU_focus_gonna_gsc_leader_desc:0 "충분한 지지 세력의 탄원에 힘입어 카야는 드디어 권력 투쟁의 마지막 단계에 진입했습니다. 끔찍했던 근신 기간에서부터 갈망했던 권력의 최상층, 바로 총학생회장직에 본인이 취임하는 것입니다. 이제 더는 그녀를 막을 사람이 없기 때문에, 이는 속히 이루어져야만 합니다."
 COU_tooltip_gonna_gsc_leader:0 "§R돌아갈 수 없는 길을 건넙니다!§!"
 COU_focus_get_some_break_bro:0 "정기적인 휴식 갖기"
 COU_focus_get_some_break_bro_desc:0 ""
 COU_focus_shutthefuckof_this_fucking_communists:0 "마이크 잡기"
 COU_focus_shutthefuckof_this_fucking_communists_desc:0 "가끔씩 화가 풀리지 않고 짜증날 때는 소리치는 것보다 유용한 것은 없습니다. 내친 김에 한번 해보는 것도 나쁘지 않을 것입니다."
 COU_destress_focus:0 "§Y$COU_focus_get_some_break_bro$§! 중점 완료"
 COU_destress_focus_completed_tt:0 "현재 일수: [?COU_destress_focus:days|Y0]"
 COU_focus_three_years_plan:0 "4개년 계획"
 COU_focus_three_years_plan_desc:0 ""
 COU_focus_ready_for_reunification:0 "국방학원"
 COU_focus_ready_for_reunification_desc:0 ""
 COU_focus_remove_democratic_system:0 "관료주의적 독재"
 COU_focus_remove_democratic_system_desc:0 "총학생회는 오랜 세월동안 관료주의와 대의라는 명분 위에 군림해 왔기 때문에 함부로 이를 일방적으로 재편하거나 폐지하려고 들었다간 카야의 정치적인 생명의 장기화를 보장할 수 없습니다. 형식과 절차를 존중할 필요성에서 비롯될 관료주의적 독재는 카야의 초인독재를 위한 견고한 초석이 될 것입니다."
 COU_kaya_change_ideology:0 "§Y시라누이 카야§!의 세부 이념을 §Y초인독재§!로 변경합니다."
 COU_focus_rework_of_gsc_system:0 "효율적인 행정 처리"
 COU_focus_rework_of_gsc_system_desc:0 "인정할 것은 인정합시다. 카야 총학생회장은 전임자들처럼 막대한 양의 업무를 온전히 처리할 수는 없습니다. 그러나 카야가 취임 이후 온갖 역경을 견디며 자연스레 학습한 여러 차선책들을 동원하여 행정 처리 자체를 효율화한다면 이러한 결점을 보완할 수 있을 것입니다."
 COU_focus_corperate_with_catholic:0 "키보토스 교구 확대"
 COU_focus_corperate_with_catholic_desc:0 "유럽의 전통과 가치를 수호하던 가톨릭은 대전이 이후 키보토스의 종교에 맞물려 탄압당하고 키보토스식 진보의 물결 속에서 수장당하기 일쑤였지만, 우리는 그 점을 궤뚫어 성직자들과 접촉하고 유럽 가톨릭과 협력하며 키보토스 교구를 확대한다면 키보토스의 종교와 현지의 종교가 결합하여 통치에 이용할 유용한 수단이 될 것입니다."
 COU_focus_kivotos_apartheid:0 "인종분리"
 COU_focus_kivotos_apartheid_desc:0 "키보토스계와 현지인들의 관계는 나아질 수 없습니다. 근근한 협력은 가능할 지 몰라도, 태생부터가 다른 이들은 결코 하나로 융합될 수 없는 기름과 물 같은 존재이며 기름과 물은 다른 통에 채워져야 합니다. 이제 우리들은 서로 다른 주거지에서 살게 될 것이며 다른 상점을 이용하게 될 것입니다. 이는 인종차별적인 조치가 아니라 현실적인 조치에 가깝습니다."
 COU_focus_special_martial_law:0 "특별행정조치"
 COU_focus_special_martial_law_desc:0 ""
 COU_focus_conservative_revolution:0 "신세계질서"
 COU_focus_conservative_revolution_desc:0 "총학생회는 이제 만반의 준비를 마쳤습니다. 내치는 카야 총학생회장 주도의 정치 체계로 완전히 재편되었고, 이제 외치를 둘러볼 때입니다. 키보토스의 학원들은 다시 한번 총학생회의 통제를 받아야 하며 대전이 이전의 질서를 회복해야 합니다, 다시는 총학생회의 권위를 얕볼 수 없도록!"
 COU_focus_our_saint_michael:0 "성 미카엘 대천신 기도"
 COU_focus_our_saint_michael_desc:0 "엎디어 구하오니, 성 미카엘 대천신이여,\n이 세상 전장에 우리를 보호하사 마귀의 악함과 흉계를 방비케 하시고,\n또 천주 저 마귀를 억제하여 굴복케 하시며 너는 천국 모든 신을 총령하시는 자라.\n세상에 두루 다니며 영혼을 삼키려는 사탄과,\n다른 악신의 무리를 천주의 힘을 인하여 지옥에로 쫓아 몰으소서, 아멘."
 COU_focus_liberate_womans:0 "여성해방"
 COU_focus_liberate_womans_desc:0 "유럽의 남성중심적이고 권위주의적인 가정에 오랫동안 시달려왔던 비키보토스계 여성들은 우리에게 있어 최고의 목표입니다. 우리는 여성해방을 제창하는 페미니스트 혁명가들과 접촉하여 여성이 중심인 키보토스의 중심으로서 현지 여성들의 해방을 약속한다면 현지 여성들은 우리의 통치에 순응하게 될 것입니다."
 COU_focus_free_woman_corps:0 "자유여성군단"
 COU_focus_free_woman_corps_desc:0 "여성의 독립성을 강조하기 위해 현지인 여성들로 구성된 자유여성군단이 배치될 것입니다. 이들은 전선의 최전선에서 헤일로 보병들의 도움을 받으며 전투 능력을 기르고 결국엔 여타 남성들과 다를 바 없이 전선에서 뛰어난 활약을 펼칠 것입니다."
 COU_tooltip_recruit_woman_divisions:0 "§Y9보병§!, §Y돌격§!, §Y포병 지원 대대§!로 구성된 자유여성군단 §Y3사단§!이 배치됩니다."
 COU_focus_daughters_of_jesus:0 "하나님의 딸들"
 COU_focus_daughters_of_jesus_desc:0 ""
 COU_focus_kivotos_nationalism:0 "키보토스 민족주의"
 COU_focus_kivotos_nationalism_desc:0 ""
 COU_focus_christian_army:0 "아버지의 뜻이 땅에서도 이루어지게 하소서"
 COU_focus_christian_army_desc:0 ""
 COU_focus_destroy_luxemburg:0 "나사우 가문의 잔재 파괴"
 COU_focus_destroy_luxemburg_desc:0 "흥신소 68의 주도 하로 살아남은 '룩셈부르크 대공국'은 공공연한 키보토스에 대한 모욕에 가깝습니다. 키보토스인들이 현지 정부의 국가 수반을 맡다니요? 나사우 가문의 끔찍한 잔재는 파괴되어야 합니다."
 COU_focus_destroy_abydos:0 "양세계 이상론자 분쇄"
 COU_focus_destroy_abydos_desc:0 "아비도스의 우유부단하기 짝이 없는 멍청이들은 현지인들과의 조화를 부르짖으며 키보토스의 질서와 권위에 대한 분명한 선전포고문을 먼저 보냈습니다. 저들의 말도 안되는 환상에 대응해야 합니다!"
 COU_focus_eastern_offensive:0 "에덴 조약 강제"
 COU_focus_eastern_offensive_desc:0 ""
 COU_focus_northern_offensive:0 "공산주의 연극 중단"
 COU_focus_northern_offensive_desc:0 "붉은겨울의 [RED.GetLeader] 학원 수뇌부는 제대로 된 공산주의라는 것은 제대로 알지도 못한 채 유사 공산주의 국가라는 소문을 듣고 몰려온 어중이 떠중이 같은 이념론자들에게 휘둘리고 공산주의 연극을 강제당하고 있습니다. 이 참상을 즉시 중단시켜야 합니다."
 COU_focus_southern_offensive:0 "기술관료정의 모순"
 COU_focus_southern_offensive_desc:0 ""
 COU_focus_restore_our_rules:0 "우리의 질서 재건"
 COU_focus_restore_our_rules_desc:0 ""
 COU_focus_seek_alliance_with_kaiser:0 "훌륭한 모범"
 COU_focus_seek_alliance_with_kaiser_desc:0 ""
 COU_tooltip_when_we_peace_percent_up:0 "우리가 §Y평화 상태§!일 때 동맹이 성사될 가능성이 높아집니다."
 COU_focus_reunification_of_kivotos:0 "키보토스의 재통일"
 COU_focus_reunification_of_kivotos_desc:0 "재앙같던 대전이 이후 훌쩍이며 꾸어 왔던 그 꿈이 마침내 이루어졌습니다.\n§G결국엔 모든 것이 잘 되었습니다.§!"
 COU_tooltip_kaya_real_end:0 "§Y에필로그§!와 §G엔딩§!이 해금됩니다."
 COU_focus_rok_controls_core_state_tooltip:0 "명시된 학원들이 존재하지 않으며 모든 §Y수도 주§! 지배:\n  [TRM.GetNameWithFlag]: §Y$STATE_64$§!\n  [GEM.GetNameWithFlag]: §Y$STATE_55$§!\n  [GEH.GetNameWithFlag]: §Y$STATE_52$§!\n  [MIL.GetNameWithFlag]: §Y$STATE_16$§!\n  [HEU.GetNameWithFlag]: §Y$STATE_8$§!\n  [RED.GetNameWithFlag]: §Y$STATE_141$§!\n  [ARI.GetNameWithFlag]: §Y$STATE_85$§!\n  [ABY.GetNameWithFlag]: §Y$STATE_69$§!\n  [SHA.GetNameWithFlag]: §Y$STATE_4$§!\n  [HYA.GetNameWithFlag]: §Y$STATE_9$§!\n  [WHY.GetNameWithFlag]: §Y$STATE_1047$§!"
 

 

 ##린 
 COU_focus_confidence_and_supply:0 "신임과 보완"
 COU_focus_confidence_and_supply_desc:0 "린 대행 체제는 지속되어야만 합니다. 린 대행 체제의 정통성은 누구도 부정할 수 없는 근간이며 지금 필요한 것은 소모적인 정쟁이 아니라 그녀가 닦아놓을 새 토대 위에서 혼란을 바로잡을 실질적인 협력입니다. 그리고 이를 위한 핵심 절차는 린 대행을 위한 신임과 보완의 실행입니다."
 COU_focus_emergency_rin:0 "비상대책위원회"
 COU_focus_emergency_rin_desc:0 "총학생회는 그동안 총학생회장의 비밀을 숨기기 위해 급급했지만, 그 실체가 탄로난 지금 더 이상 숨기기 위해 애쓸 필요가 없어졌으므로, 실질적인 문제 해결과 대처를 위한 비상대책위원회의 출범은 필수적입니다."
 COU_focus_Linda_Linda:0 "린다, 린다"
 COU_focus_Linda_Linda_desc:0 "시궁쥐처럼 아름다워지고 싶어, 사진에는 찍히지 않는 아름다움이 있으니까.\n\n"절대 지지 않는 강한 힘을- 나는 딱 하나 가지고 있으니까..."\n\n시궁쥐처럼 누구보다도 상냥하게, 시궁쥐처럼 무엇보다도 따뜻하게."
 COU_focus_collaborate_with_pro_rin_facton:0 "행정위원회 좌파"
 COU_focus_collaborate_with_pro_rin_facton_desc:0 "행정위원회 내에서 현지인들의 얼굴마담으로서 대표되는 교통실의 유라기 모모카와 믿음직한 조정실장, 이와비츠 아유무는 일련의 좌파로서 거론되는 세력들이며 주요 특징으로는 나나가미 린과 개인적인 친분과 관계가 존재한다는 점입니다. 이들과의 협력은 통괄실의 권력 안정화에 큰 도움을 줄 수 있을 것입니다."
 COU_focus_remove_antihumans_order:0 "11월 참사 사죄"
 COU_focus_remove_antihumans_order_desc:0 "1935년 11월 대전이 이후 무지에서 이루어진 대규모 참사는 행정위원회에서 회피하기 바쁜 안건이었지만 더는 좌시할 수 없습니다. 행정위원회는 공식적으로 이루어진 이 대학살에 분명한 책임을 지고 사죄해야만 합니다."
 COU_focus_gsc_prorin_block:0 "행정위원회 연대 블록"
 COU_focus_gsc_prorin_block_desc:0 ""
 COU_focus_collaborate_with_anti_rin_faction:0 "행정위원회 우파"
 COU_focus_collaborate_with_anti_rin_faction_desc:0 "대전이 사태 이후 산전수전을 겪긴 했지만 행정위원회 내에서 방위실과 재무실은 언제나 핵심적인 축으로서 기능했습니다. 일련의 우파로서 거론되는 이 세력들은 나나가미 린 대행에 관해 불순한 이야기들을 늘어놓긴 하지만, 이들과의 협력은 린 대행의 통치를 안정시키고 개인적으로도 큰 도움이 될 것입니다."
 COU_focus_collaborate_with_aoi:0 "상호협의안 의결"
 COU_focus_collaborate_with_aoi_desc:0 "오키 아오이는 대전이 이후 변동된 예산의 출처와 활용을 유연히 대처하기 위해 재무실의 권한을 일정 부분 늘리는 대신 재무실 또한 이에 상응하게 예산 의결 과정을 간략화하는 일종의 협의안을 제시했습니다. 이는 분명 타당한 제안이며 수용할 수 있습니다."
 COU_focus_collaborate_with_kaya:0 "방위실에게 약속"
 COU_focus_collaborate_with_kaya_desc:0 "방위실이 더 큰 야망을 품고 불순한 의도를 품은 것은 모두 자신들의 권력이 한순간에 빼앗기고 버려질 것이라는 불안에서 흘러나오는 일종의 방어 기제에 해당합니다. 우리가 그렇게 하지 않을 것을 약속한다면 방위실과 협력자들은 골칫거리에서 괜찮은 친구들이 될 수 있습니다."
 COU_focus_invite_here_kivotos:0 "행정명령 3604호"
 COU_focus_invite_here_kivotos_desc:0 "나나가미 린의 정치적 수완과 생명을 모두 건 도박을 시작할 때입니다. 분명한 계기를 얻은 그녀는 영원히 내부의 조정과 안정을 저울질하지 않을 것입니다. 그리고 그 첫번째 단추로는, 저지대의 키보토스 완전 편입을 강행하는 것입니다. 행정명령 3604호는 무슨 수를 써서라도 통과되어야만 합니다!"
 RIN_DREAM_ARONA:0 "§Y나나가미 린이 결심했습니다.§!"
 COU_focus_i_love_arona:0 "영구대행"
 COU_focus_i_love_arona_desc:0 ""
 COU_focus_i_hate_arona:0 "잃어버린 것과 얻은 것"
 COU_focus_i_hate_arona_desc:0 ""



 ##아오이-모모카 
 COU_focus_dual_leader_system:0 "집단지도체제"
 COU_focus_dual_leader_system_desc:0 "새로운 체제가 들어섰습니다. 나나가미 린 대행의 사임 이후 권좌를 장악했던 것은 분명 오키 아오이, 그녀 혼자였습니다. 그러나 아오이의 부족한 현지 지지는 현지의 얼굴마담, 유라기 모모카와의 기묘한 협력 관계를 강요하면서 새로운 집단지도체제가 가동을 시작했습니다."
 
 
 
 
 
 
