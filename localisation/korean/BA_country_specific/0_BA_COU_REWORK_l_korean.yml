 COU_focus_air_command_coppens_desc:0 "저지대 전쟁 당시 레이우아르던 공방전에서 우리에게 투항했던 빌리 코펀스는 키보토스의 첨단 기체를 직접 조종했을 때 창공을 동경하는 인간으로서 굉장한 경외심, 나쁘게 말하자면 겁에 질렸었다고 회고했습니다. 이후 그는 항공방위군의 주축이자 거물로서 발걸음했고, 코펀스는 기술력의 우위성을 주장합니다." 
 COU_focus_test_kivotos_new_plane:0 "분석과 연구"
 COU_focus_test_kivotos_new_plane_desc:0 "대전이 이후 함께 따라온 키보토스 기체들은 키보토스 전역에 아직 발견되지 못한 기체가 몇 개 있고, 우리는 연구소의 직원들을 투입하여 가능한 한 우리의 항공 연구에 진척이 있도록 기체를 남김없이 분해하고 조사할 것입니다."
 COU_focus_air_command_donnet:0 "도네 지지"
 COU_focus_air_command_donnet_desc:0 "저지대 전쟁 당시 댄 하흐 항공전에서 격추당한 뒤 사로잡힌 마이크 도네는 이후 우리에게 협력을 맹세했고, 비록 인류가 사용하던 항공기들이 초기형이긴 하지만 대량으로 양산한다면 항공전에서 우위를 점할 수 있음을 댄 하흐 항공전에서 실감했던 만큼 그는 적당한 기체의 대량 양산을 주장합니다."
