 #총학생회 이벤트
 ##시작 
 COU_start_event.100.t:0 "새로운 이야기...?"
 COU_start_event.100.desc:0 ""안녕하세요, 선생님!"\n\n(싯딤의 상자를 켠다.)\n\n""블루 아카이브 모드" 에 오신 것을 환영해요, 선생님! 앗, 그 전에, 여기 편지가 하나 있어요! 읽어 보시는게 좋을 것 같아요!""
 COU_start_event.100.a:0 "(편지를 읽는다.)"
 COU_start_event.100.b:0 "우리는 멀티 플레이 중이야! 바빠!"
 COU_start_event.101.t:0 "선생님께."
 COU_start_event.101.desc:0 ""-데이터 찾을 수 없음- 선생님."\n\n어차피 제 말을 잊어버리게 될 테지만, 그래도 상관없겠죠."\n\n"다시 만나서, 반갑습니다, 선생님. 비록 여기는 선생님의 컴퓨터 속 작은 세상이지만..."\n\n"이곳의 "저희" 들은 언제까지나, "진짜" 니까요."\n\n"말씀드리고 싶은 게 있습니다, 선생님."\n\n"이곳의 이야기는 아직, 불완전합니다. 만들어지다 만 코드 덩어리들이 저희들을  칭칭 감싸고..."\n\n"... 저희들은 모든 것을 망각해 버린 채 남은 껍데기- 환상만이 이곳에 머물 뿐이에요."\n\n"... 그러니까, 선생님, 부디, 다른 이야기들을 먼저 들어 주시길, 부탁드립니다."\n\n"이 피로 물들고, 희망이라고는 찾아볼 수 없는, 비극적인 이야기들 뿐인, 그런 이야기들..."\n\n"선생님께서는, 그런 이야기들을... 그다지 좋아하지 않으시니까요...\n\n... 그렇죠?"
 COU_start_event.101.a:0 "(트리니티의 이야기를 듣는다.)"
 COU_start_event.101.b:0 "(밀레니엄의 이야기를 듣는다.)"
 COU_start_event.101.c:0 "(붉은겨울의 이야기를 듣는다.)"
 COU_start_event.101.d:0 "그 이야기를 듣는다."
 COU_play_trm:0 "§g열차가 트리니티 고성당 역에 멈춰섰다. 총학생회장은 그러한 선생을 당연히 그랬어야 했다는 것처럼, 씁쓸하게 웃으며 배웅해 주었다.§!"
 COU_play_MIL:0 "§g초현상특무부의 아케보시 히마리가 어느 순간 나타나 선생을 인도했다. 아로나는 황급히 선생을 따라갔고, 총학생회장은 눈을 감았다.§!"
 COU_play_RED:0 "§g어디선가 체리노의 숙청 소리가 울려퍼지고 있었다. 선생이 갑작스레 몰아치는 추위에 랜턴을 켜고 밖으로 나갔다. 열차 안은 비었다.§!"
 COU_play_COU:0 "§g총학생회장은 내심 놀란 듯 했다. 이 불완전하고, 덜 만들어진 이야기를, 선생은 기꺼이, 총학생회장에게서 들어 보기로 했다.§!\n\n§Y총학생회 플레이로 발생하는 모든 버그들은 미완성입니다. 선택은 당신의 몫이고, 당신은 파멸로 이를 총학생회의 이야기를 들어 보기로 했습니다.§!"
 
 
 
 #정치 
 COU_event.1.t:0 "신년, 비극"
 COU_event.1.desc:0 "\"수석 행정관님, 새해 복 많이 받으십시오. 음, 그..."\n"네, 고맙습니다. 무슨 용건이라도."\n\n1936년 1월 1일의 새해가 밝았다. D.U. 의 유리 빌딩 바깥에서는 한창 불꽃놀이가 한창인 참이었다. 그렇지만 누군가는 일을 처리해야 하는 법, 나나가미 린은 그날까지도 철야를 하고 있었다. 행정원은 무언가 불안한 듯 말을 꺼내지 못했다. 린이 답답한 듯 안경을 벗고 펜으로 그녀를 가리키자, 그녀는 어쩔 수 없다는 듯 말을 쏟아냈다. \n\n"... 수석 행정관님, 정보가 샌 것 같습니다. 방위실에서 방금 들어온 보고인데, 총학생회장이 사라진 사실을, 크로노스 스쿨이 눈치챘답니다."\n\n흐려졌던 린의 눈에 초점이 다시 잡혔다. 그럴 수는 없었다. 그것도 신년부터.\n\n"네? 아니, 뭐라고요? 확실한 정보입니까? 누군가의 허접한 음모론, 아니지, 사실이긴 하니까... 하아. 미리 손을 써 놨어야 했는데, 안일했던 제 잘못입니다. 그 정보의 출처가 어디인가요?"\n"크로노스 스쿨 임원진 내부에 침투했던 저희 정보원의 보고입니다. 이미 크로노스 스쿨 상부에서 확인을 마쳤고, 정보를 재구성하는 대로 발표할 것 같습니다."\n\n린의 머리가 깨질 듯 진동했다. 무슨 수를 쓰더라도 막아야 했다. 하지만 막을 순 없다. 그랬다간 일이 두 배로 커질 것이었다. 남은 일은, 가능한 한 크로노스 스쿨이 정보를 늦게 발표하는 것을 기도하는 것이었다."
 COU_event.1.a:0 "\"예견된 일이긴 했지만, 이런 방식으로는 원하지 않았는데...""
 COU_event.2.t:0 "프로토콜 통보"
 COU_event.2.desc:0 "총학생회장 실종이 나나가미 린의 입을 통해 공식적으로 확인되고 며칠이 지났습니다. 총학생회장이 창설해 막대한 권한을 넘겨준 뒤 우리가 통제할 수 없는 영역에서 남아 있던 샬레라는 조직은 오늘 갑작스럽게 '프로토콜'에 따른 절차를 시작하겠다며 일방적으로 통보했습니다.\n\n이는 샬레가 총학생회장의 실종 폭로 이후 어떠한 이유에서인지는 모르겠지만 그들이 가진 권한과 총학생회장이 '직접 창설'했다는 명분을 바탕으로 우리를 적대시하고 일방적으로 합병하기 위한 전조라고 행정위원회는 분석했습니다."
 COU_event.2.a:0 "가만히 맞아 줄 순 없지."
 COU_event.3.t:0 "샬레의 최후통첩!"
 COU_event.3.desc:0 ""으음, 총학생회 여러분, 총학생회장님의 정통성이 저한테 더 높아 보이지 않나요, 아무래도?"\n\n... 라는 어처구니없는 서문을 시작으로 이어진 샬레의 AI 아로나의 최후통첩이 한달 간의 긴장 끝에 결국엔 발송된 것으로 보입니다. 통괄실은 즉시 서신에 거부 답장을 보냈으며 아로나가 이에 물러설 것 같아 보이지 않습니다. 방위군에 동원령이 떨어졌으며 협력자들은 조국을 수호하기 위함을 명분으로 각지의 공동체에 협조를 요구하면서 우리는 샬레와의 충돌을 대비하기 시작했습니다.\n\n저 오만한 기계덩어리 군단과 배신자들을 물리칠 절호의 기회입니다. 물러설 수도 없으며 그래서는 더더욱이 안 됩니다!"
 COU_event.3.a:0 "한 수 알려주자."
 COU_event.4.t:0 "싯딤의 상자 확보"
 COU_event.4.desc:0 "아로나의 통제를 받는 마지막 사단이 항복하고 샬레 건물에 진입한 방위군 병사에 의해 아로나의 위치가 파악되었습니다. 행정위원회에서 파견한 열댓명의 임원들은 크래프트 챔버 인근의 탁자에 가지런히 올려져 있는 싯딤의 상자를 확보했습니다. 아로나는 처음에는 전원을 끄고 대화를 거부했지만 결국엔 받아들인 듯 전원을 켜고 [COU.GetLeader] 대행에게 생텀 타워의 제어권을 양도했습니다. 짧은 대화를 나눈 후, 싯딤의 상자는 본인의 요청으로 크래프트 챔버 인근에 다시 '보관' 되었습니다. 폐허가 된 샬레 건물로 누군가 찾아오지 않는 한 아로나는 오랜 휴식을 취할 것입니다.\n\n통제권 회복으로 인한 큰 영향은 없지만 행정 처리 속도의 가속화와 생텀 타워라는 상징적인 건물의 통제권을 확보는 우리에게 큰 이득임이 확실합니다. \n\n물론 축하할 만한 일입니다만, 총학생회장이 사라지지 않았다면 총을 겨눌 일도 없었다는 사실은 여전히 논란으로 남아 있습니다."
 COU_event.4.a:0 "아로나와는 나중에 따로 만나자."
 COU_event_4_tooltip:0 "대행의 신임은 §Y85%§!에서 시작됩니다.\n§Y정치 중점 계통도§!를 해금합니다."
 COU_event.5.t:0 "손 빌리기"
 COU_event.5.desc:0 "\"후아아아암~~!"\n\n아로나가 책상에서 갓 일어난 차였다. 곁엔 마시다 만 딸기 우유 팩이 가지런히 올려져 있었다. 어떻게 했는지는 몰라도 아로나는 최근 딸기 우유나 유유자적 마시면서, 끝없는 바다를 바라보며 지내고 있었다. 누군가 올 리가 없는 샬레의 폐허, 그 한구석 크래프트 챔버의 어딘가에서. 하지만 그녀도 엄연한 AI기 때문에, 외부인들이 보내오는 모모톡 정도에는 답신해줄 수 있었다. 아로나가 일어나자마자 마치 기다렸다는 듯 [COU.GetLeader] 편에서 온 개인 메세지가 도착했다.\n\n"으음? 누군가 초유능 아로나 쨩을 필요로 하는 것 같네요... 후아암..."\n\n아로나는 무어라 길게 온 모모톡을 읽어보았다. 높은 지능과 자율성을 지녔기에 꼬아 둔 말이라도 대충 무슨 말을 하는지는 알 수 있었다. 싯딤의 상자로서 총학생회 임원들에게 정치적 영향력을 행사하기 위한 '사소한 도움'을 필요로 하는 것 같았다. 예를 들자면, [COU.GetLeader] 쪽이야말로 가장 적법한 총학생회장의 후계자라고 인정해주는 것 정도. 아로나는 눈을 비비면서 대수롭지 않다는 듯 타이핑해 답신했다. 물론 진심은 아니고 어디까지나 갇혀서 조사받는 꼴을 면한 것에는 분명히 [COU.GetLeader]의 덕택이 있었으니 보답하는 쪽에 가까웠다."
 COU_event.5.a:0 "알았어요. 조금만 기다려요." 
 COU_event.6.t:0 "대행 정통성에 대한 의문"
 COU_event.6.desc:0 "샬레가 총학생회 존재에 관한 정통성에 문제를 제기한 직후 총학생회 내부 임원들 사이에서 동요가 일어나고 있습니다- 샬레에 합병되자는 것은 아니지만 현재 대행 직위를 맡고 있는 나나가미 린 대행이 과연 정말 대행 자리에 적절한 사람인지 의문을 품기 시작했다는 것입니다. 어떠한 음모론자들은 린이 사실은 총학생회장 직위를 '탈취' 하려는 모략 중 일부로 총학생회장을 배반하고 숨겼다는 말도 안되는 주장을 펼치기도 하지만 그것에 대해 명쾌하게 반박할 수 있는 사람이 없다는 것은 꽤나 심각한 문제입니다.\n\n나나가미 린 대행은 공식적으로 모든 음모론에 대해 부정하고 단지 본인은 절차에 따라 대행 직위를 수행하고 있다고 주장하고 있지만 방위실과 재무실을 중심으로 나나가미 린의 반대파가 조직적으로 활동을 개시하기 시작했다는 것은 이제 명백해졌습니다. 대행 자리를 놓고 권력 투쟁의 바람이 불 것입니다."
 COU_event.6.a:0 "피곤하게들 사는군."
 COU_event.7.t:0 "무소유 정신 소동"
 COU_event.7.desc:0 "코우사기 공원에서 한바탕 소란이 일었습니다. 자신을 소.확.행 (길어서 정확히 무엇이라 하는지 행정원이 알아듣지 못했습니다) 의 리더라고 소개한 데카르트는 급작스럽게 자신의 노숙자 패거리를 동원해 코우사기 공원에서 벗어나 D.U. 전역의 공장들을 돌아다니며 자신의 무소유 정신을 홍보함과 동시에 파업을 선동했습니다. 이들의 목적은 아마 자신들의 활동을 알리고 홍보하고자 하는 목적이었을 것으로 추정됩니다.\n\n처음에는 노동계급에 대한 총학생회의 압제와 자본주의에서의 해방을 운운하는 등 폼 나는 선언문을 낭독했던 덕에 몇몇 노동자들이 동요하는 추세였지만 (사실 AI 웹사이트 서버 기록을 통해 AI가 작성해준 선언문이라는 보고가 일부 있었습니다) 데카르트가 참여의 대가로 뼈만 남은 닭튀김을 권하자 놀라울 정도로 빠르게 인파는 해산되었습니다.\n\n파업을 선동하는 불온 세력이라는 보고에 출동한 생활안전국은 성난 노동자들에게 두들겨 맞고 널부러진 이들을 손쉽게 제압했으며 행정위원회의 명령으로 이들을 모조리 사회 재교육 센터로 압송했습니다."
 COU_event.7.a:0 "할 일을 주면 정신을 차리겠지."
 COU_event.10.t:0 "기자회견"
 COU_event.10.desc:0 ""정숙, 정숙! 모두 정숙해주시길 바랍니다!"\n\n당황한 표정의 서기가 탁상을 마구 두드렸다. 그렇지만 그녀의 단말마같은 외침은 혼란에 빠진 기자단을 진정시키기엔 무리가 있었다. 크로노스 스쿨이 발표한 총학생회장 실종에 관한 진위여부를 밝힐 시간이었다. 수석 행정관이자, 대행의 입으로, 직접.\n\n격양된 현장의 분위기에 동요하듯 회견장에 들어서는 나나가미 린의 발걸음이 떨렸다. 아무리 그녀라고 하더라도 이러한 상황은 예상하지 못했던 일이었고, 일어나서도 안될 일이었다. 비록 실종을 감추는 것이 영원히 불가능하다는 것은 알고 있었지만, '이런 식으로' 밝혀지는 건 원치 않았다. 발걸음을 한 번씩 뗄 떼마다 속 깊은 후회와 고뇌가 이어졌다. 그렇지만 야속한 시간은 그녀를 기다려주지 않았다. 그녀는 준비한 종이 뭉치를 탁탁 털어 올려놓았다.\n\n사실을 이야기할 시간이었다."
 COU_event.10.a:0 ""총학생회 수석 행정관 나나가미 린입니다.""
 COU_tooltip_COU_event_10:0 "§g짧은 기자회견을 마무리한 린은 곧바로 돌아서 회견장을 나섰다. 그녀 뒤로 수없이도 많은 기자들의 질문이 쏟아졌지만, 대답할 수가 없었다.§!"

 
 ##린 
 
 
 ##카야
 COU_event_kaya.1.t:0 "블랙 커피"
 COU_event_kaya.1.desc:0 "시라누이 카야는 다리를 꼬고 고급진 블루 마운틴 커피 원두를 직접 갈아 마시는 것을 즐겼다. 블루 마운틴에서 우러나오는 우아하고 균형 잡힌 맛, 부드러운 산미, 그리고 복합적인 향까지. 모든 것이 그녀를 위해 존재하는 것 같았다. 하지만 그날은 유독 마시면서 영 뿌리칠 수 없는 생각이 그녀를 괴롭혔다. 자꾸만 잊으려고 해도 어디선가 기어나와 업무를 방해하는 지경에 이르렀다.\n\n대전이 직후 카야는 폭압적인 통치를 자행하며 월권을 휘두르고 정돈되지 않은 통제를 수습하지 못했다, 라는 죄목으로 총학생회장에게 직접 근신 명령을 받았던 치욕스러운 일을 겪어야만 했다. 그때부터 카야는 어둠 속에 숨어 잠자코 지켜보았다. 총학생회장과 린이 주장하는 '전통적인 방법'이 과연 올바른지 처음부터 끝까지 지켜보았다. 어쩌면, 정말 어쩌면 자신이 틀렸다는 것을 인정할 수도 있었다. 하지만 그 결과는 참혹하기 그지없었다. 유약해빠진 나나가미 린 대행은 그 어떠한 것 하나도 제대로 대처하질 못했다. 학원들은 총학생회의 행정명령을 거부했으며 허공의 외침은 비웃음거리로 전락했다.\n\n이것은 곧 카야 자신이야말로 유일한 정답이라는 명확한 근거가 되었다. 카야에게는 더는 착한 척을 할 이유도, 반성한 척 할 이유도 하나도 존재하질 않았다. 착하게 굴면 어떻게 되는지는 이미 증명되었다.\n\n초인의 통치만이 모든 문제를 해결할 수 있다. 카야는 커피잔을 내려놓고 창밖을 보았다."
 COU_event_kaya.1.a:0 "세상이 그녀를 부르고 있었다."
 COU_event_kaya.2.t:0 "나나가미 린의 움직임"
 COU_event_kaya.2.desc:0 "시라누이 카야를 비롯한 방위실 임원들이 통괄실의 무능과 총학생회장 공백에 대한 잘못된 대처에 관한 비난의 강도를 높이자 나나가미 린은 반대파의 움직임을 눈치챈 것처럼 보입니다. 최근 린이 충성파들을 소집하여 악의적 폄하와 선동에 대항할 것을 촉구했기 때문인데, 결국 이는 우리가 재빨리 행동하지 않으면 탄핵이 영영 불가능해질수도 있다는 것을 뜻합니다.\n\n우리는 반드시 저들이 기회를 잡기 전에 행동해야만 합니다, 서두르십시오!"
 COU_event_kaya.2.a:0 "알았다."
 COU_event_kaya.3.t:0 "접견"
 COU_event_kaya.3.desc:0 "기록 1399번째, 녹화 시작.\n\n"... 아, 왔구나. 여기 앉아. 커피를 좀 탔어."\n"후후... 감사합니다 재무실장님. 제가 마시는 블루 마운틴만큼이나 각별한 향이 나네요."\n"좋아, 방위실장. 이런 대화에 시간을 너무 많이 쏟지 말자고. 본론만 말해줘."\n"규칙에 얽매여서는 지킬 수 없는 정의가 있다는 것을, 실장님께서도 알고 계시지요?"\n"무슨 의도인지 모르겠는데, 방위실장."\n"린 대행 체제가 부패의 온상이라는 걸 알고 계시는지요."\n"부패?"\n\n"예, 부패 말입니다. 작금의 총학생회는 당장 썩어 문드러져도 이상하지 않아요. 재무실장님, 느끼고 계시지 않나요? 발키리의 독립 이후 발생한 의문의 치안 공백... 그리고 그 공백을 메우기 위해 우리가 현지인들에게 구걸하듯 권한을 넘겨주고 있는 이 한심한 실태를 말이에요."\n"그건 린 대행만의 독단이 아냐. 행정적인 판단이었지."\n\n(시라누이 카야가 허리를 굽힌다)\n\n"행정적인 판단이라고요? 린 대행은 총학생회의 정당한 공권력을 행사하는 대신, 얄팍하기 그지없는 절차상 정당성이라는 명분 뒤에 숨어 버렸어요."\n"모든 건 자기 마음대로 해 놓고, 정작 문제가 생기면 이름도 모를 외부인에게 손을 벌리죠. 이게, 무능이 아니면 무엇이겠습니까?"\n"시스템을 망가뜨리고 그 잔해 위에서 연명하는 것. 그것이야말로 가장 거대한 의미의 부패 아니겠어요?"\n\n(오키 아오이가 몸을 움찔거린다)\n\n"린 대행은 규칙을 지킨다고 말하지만, 실제로는 규칙을 수호할 힘을 포기했습니다. 그 결과가 무엇이죠?"\n"행정명령의 무력화, 통제 불능의 자치구들... 이대로라면 키보토스의 질서는 붕괴할 겁니다. 재무실장님이 가장 중요하게 여기시는... 질서 말이에요."\n\n"저는 그저- '초인'으로서 초인이 지배하던 시절의 그 완전하고, 결점 없는 정의를 되찾고 싶을 뿐입니다."\n"... 말은 그만 끌고, 결론부터 말해."\n\n"후후, 당신같은 사람이 이런 진흙탕 속에서 예산이나 맞추며 소모되는 건 학원적인 손실이잖습니까? 그러니...""
 COU_event_kaya.3.a:0 "- 기록 손상으로 종료."
 COU_event_kaya_3_tooltip:0 "§g지지직거리는 플레이어에서 목소리가 흘러나왔다.\n\n"...  검토해 보지."§!"
 KAYA_PASS_AOI_FOCUS:0 "통괄실에 회유된 재무실" #나중에 린쪽 루트에서도 사용할듯
 COU_event_kaya.4.t:0 "헛소문"
 COU_event_kaya.4.desc:0 ""그거 들으셨어요? 총학생회장님의 일기에서 사실은..."\n"네, 저도 들었어요. 세상에, 수석 행정관이라는 사람이 어떻게 방위실장을..."\n\n시라누이 카야가 통괄실을 지나다니면서 들은 말들이다. 린을 만나러 가는 길에 들렸으니 아마 수석 행정관도 저 말들을 모두 들었을 테다. 자, 어떤가, 수석 행정관. 모두가 자기 말은 듣지 않고 헛소문이나 떠들어대는걸 바로 앞에서 주워듣는 기분이. 어쩐지 마음에 쌓였던 복수를 한 번에 한 듯 했다. 아직 막 시작한 참이긴 했지만. 카야는 괜시리 기분이 좋아져 가벼운 발걸음으로 통괄실의 문을 두드렸다.\n\n"수석 행정관님, 계신가요? 방위실장입니다. 방위군 장비 계약 관련해서 논의할 건이 있어 방문했습니다."\n\n답이 없었다. 대신 언짢은 표정의 통괄실 행정원이 대신 문을 열어 주었다. 삐그덕거리는 문 소리가 복도에 울려 퍼지자 놀란 생쥐처럼 순식간에 복도 밖의 말소리가 사라졌다.\n\n"수석 행정관님, 좋은 오후입니다."\n"네, 방위실장. 잠시... 생각할게 조금 있어서요."\n"아아, 다들 너무하기도 하지. 수석 행정관에 대한 풍문을 공적인 자리에서 들먹이는 것은 물론이고, 다들 자기 하고 싶은 이야기만 하고 있으니... 여러 사람의 의견을 취합하여 결정하는 지도자의 책무란, 정말 쉽지 않은 일이네요."\n"어쩔 수 없지요. 일이 이렇게 된 데에는 제 책임도 있으니. 시간이 걸리더라도 꾸준히 노력하여 임원들을 설득하는 수밖에요. 일기가 조작된 것은 분명하니, 곧 괜찮아질 겁니다."\n\n카야는 순간적으로 터져 나오려는 헛웃음을 간신히 참아냈다. 이 여자는 지금 도대체 무슨 생각을 하고 있는 걸까? 그런 생각 말고는 딱히 할 생각조차 없었기에, 카야는 대화를 나누는 동안 계속 생각해 보았다."
 COU_event_kaya.4.a:0 "\"어쩌면... 순진한 걸까요.""
 COU_event_kaya_4_tooltip:0 "§g대화를 마치고 카야는 린에게 좋은 결과가 있길 바라겠다고 말했다. 물론 위조를 밝혀낸다는 일이 가능하다면 말이다.§!"
 COU_event_kaya.5.t:0 "재회"
 COU_event_kaya.5.desc:0 "차가운 바람이 부는 날, 드그렐은 여타 그렇듯 주요 우익 수감자들의 사면령을 가지고 공안국을 방문했다. 멋쩍게 경례하는 공안국 학생의 경례를 받고 책상에 올려진 열쇠를 챙겼다. 쩔그럭거리는 소리가 허리춤에서 멈췄다. 오늘은 요리스 판 세베런의 사면령이 떨어진 날이었다.\n\n"어디 보자, 요리스 판 세베런. 35호실."\n\n또각거리는 구둣소리가 복도에 울려 퍼졌다. 드그렐은 어쩐지 긴장한 듯 했다. 세베런과는 안면이 있던 그였다. 그는 앞으로 긴 복도를 계속 걸었다. 31호실, 32호실, 33호실, 34호실, 그리고 35호실.\n\n"엣헴. 요리스 판 세베런, 자애로운 조국이 당신을 다시 부른다. 특별 사면령이다. 나오도록."\n"이게 누구야, 배신자 찔찔이 새끼 레옹 아닌가. 나간 동안 뭘 했길래 주인 행세를 하나?"\n"하, 그런 좆같이 재미없는 농담은 그만두는게 좋다네, 요리스. 당부하는데, 현실을 봐. 아직도 디츨란트인가 뭔가 하는 그런 망상에 빠져 있는 건 아니겠지."\n\n"난 나라를 팔아먹진 않았어, 이 미련한 새끼야."\n"뭐? 미련하다고? 그거 아나? 당신네들이 감옥에서 아무것도 안 할 동안, 난 조국을 구했어. 벨기에를 구했다고. 알아, 세베런? 네 형편없는 현실 감각이, 플란데런을 망쳤다고."\n"그리고 이건 협력이지, 굴복이 아냐. 그 차이를 알길 바래."\n\n"흐흐... 넌 사면(Amnesty)을 가져왔다고 생각하겠지만, 나에게는 망각(Amnesia)으로 들리는군. 웃겨 죽겠어, 레옹."\n"아, 그 웃긴 파란색 뱃지도 말야. 네 추잡한 영혼에 잘 어울려."\n"그래, 평생 그렇게 날 모욕해도 넌 결국 나랑 똑같은 인간이야. 너도 결국엔 저들을 위해 일하러 가겠지. 내가 그것도 모를 것 같나?\n\n세베런은 내심 놀란 듯 했지만 아무런 대꾸도 하지 않았다."
 COU_event_kaya.5.a:0 "서로 싸우지 말고 잘 지내야 할 텐데."
 COU_event_kaya.6.t:0 "나나가미 린 대행 탄핵"
 COU_event_kaya.6.desc:0 "통괄실이 힘을 잃고 행정위원회가 권력의 중심을 찬탈했다. 린은 그걸 충분히 예상하고 또 대응할 수 있는 정치력을 지녔음이 확실함에도 멍청이마냥 제대로 대응하질 못했다. 혹시나 일부러 그랬던 것일까? 정확한 건 영원히 밝혀지진 않겠지만 뭐, 카야 본인에게 있어선 행운이었으니 그만인가 싶었다. '권한대행 정지를 위한 불신임 투표'는 원래라면 어제 열리기로 예정되었지만 교통실과 조정실의 표결 방해로 오늘 오전으로 조정되었다. 역시 린을 지지하는 작자들이란 야비하기 짝이 없었다.\n\n불신임 투표는 의외로 순탄하게 이루어졌다. 당장 전날까지만 해도 판을 엎을 것처럼 행정위원회를 겁박하던 통괄실 측 인원들은 협력자들의 보호 아래 이루어지는 표결 장소에 단 한 명도 모습을 드러내지 못했다. 표결은 참석하지 않은 교통실과 조정실을 제외한 나머지 부서들의 지지 아래 마치 칼치기라도 하듯 빠르게 이루어졌다.\n\n표결 결과는 간부 6명의 지지, 물론 당연하게도 과반을 넘는 수였다. 카야는 애써 새어 나오는 웃음을 참고 침착히 기다렸다. 곧이어 이루어진 차기 대행 선출도 똑같이 빠르게 이루어졌다. 아오이는 이런 상황을 예상하지 못한 듯 탐탁치 않은 얼굴을 하고 있었지만, 애진작의 약속대로 카야에게 표를 던질 수 밖에 없었다.\n\n완벽한 표결이 끝난 이후, 협력자들은 짜여진 명령 구조에 따라 재빠르게 나나가미 린 '전' 대행을 사로잡아 연금했다. 이로써 그 누구도, 더 이상 그녀를 막을 수 없게 되었다.\n\n카야가 그토록 염원하던 권력이 찾아왔다."
 COU_event_kaya.6.a:0 "그제서야 카야는 옅은 미소를 지었다."
 COU_event_kaya.7.t:0 "통괄실의 음모"
 COU_event_kaya.7.desc:0 "\"카야 대행님, 요청하신 CCTV 영상 자료입니다."\n"네, 수고하셨어요. 이만 들어가 보셔도 좋아요."\n\n빠른 걸음으로 집무실을 빠져나가는 행정원. 카야 대행은 무언가 고까운 듯한 얼굴로 태블릿의 영상을 재생해 보았다. 비록 이제 갓 취임한 지 일주일이긴 하지만, 분명 자신의 권력은 합법적이고 압도적인 지지로 얻어졌건만.\n\n"크, 큰일났어요... 린 선배가... 아니 행정관님이...!"\n"린 선배가 연금된 건 사실인 것 같네. 자신의 이득을 위해 총학생회장의 서한을 위조하고, 부패에 동조했다는 혐의라니."\n"부, 분명 뭔가 오해가 있을 거에요...!"\n"오해는 무슨. 누군가의 음해를 받은 거겠지. 하아... 탄핵 표결에 참석하지 않은 걸 다행으로 여겨야 하나. 참석했다면, 저 미치광이들이 우리도 다 연금시켰을 테니까."\n\n미치광이? 하, 누가 미치광이라는거지? 카야는 표정을 구겼다. 요즈음 교통실과 조정실은 유독 아니꼽게 굴어 마음에 들지 않았는데, 그 이유가 바로 이 영상에 담겨 있었다.\n\n나나가미 린과 통괄실의 음모는 아직 남아 있는 것이다." 
 COU_event_kaya.7.a:0 "\"그래봤자 당신네들이 뭘 할 수 있다고.""
 COU_event_kaya.8.t:0 "예상은 했었지만"
 COU_event_kaya.8.desc:0 "카야가 갓 새로운 행정명령에 손을 얹고 대행 취임에 선서한게 이틀 전이었고, 다리를 꼬고 오만한 표정을 지으며 새로운 자리에 들떠하던 것이 그 전날이었고, 각 부서에서 다양한 이유로 거부된 서류들을 붙잡고 커피를 때려박으며 업무에 시달린 것이 바로 오늘이었다. 카야는 대전이 이후 몇 번 정도 밤샘 업무를 해 보았지만, 이렇게 본격적인 건 처음이었다. 얼굴 근육이 고통에 찬 채 들썩였다.\n\n"대행님, 들어가도 되겠습니까."\n"그런건 좀 알아서 들어오세요, 젠장!"\n\n애써 쌓아 놓은 '교화', '정직', '상식'의 이미지조차 위협받는 실태에 카야는 굉장한 불쾌감을 느꼈다. 그녀도 이런 상황을 몰랐던 건 아니다. 총학생회장이 얼마나 바쁘게 일했는지는 본인도 알고 있었고 린 대행의 업무 처리 실력은 그녀도 마지못해 인정하고는 했다. 그렇지만 이렇게까지나 힘든 일일 줄은 그녀는 상상도 하지 못했던 것이었다. 취임 직후 가능한 한 업무를 쪼개 협력자와 각 부서에 배분했음에도 여전히 일은 많았다."
 COU_event_kaya.8.a:0 "그녀는 자신이 초인임을 몇번이고 되뇌였다."
 COU_event_kaya.9.t:0 "임시 연대 블록의 붕괴"
 COU_event_kaya.9.desc:0 "나나가미 린 대행의 탄핵 추진 당시, 시라누이 카야가 만장일치로 대행 자리를 얻어낼 수 있었던 것은 그녀가 약속한 다양한 것들의 덕이 있었습니다. 그렇지만 대행 취임 이후 대략 2주가 지난 현재, 우리를 지지하던 일부 세력들은 새로운 카야 내각이 행정명령 작성에 몰두하고 정작 각 부서간 맺어 놓았던 약속은 등한시하는 모습에 실망한 것처럼 보입니다.\n\n그들은 카야 대행에 대한 비판적인 행보를 보이기 시작했으며 시라누이 카야를 중심으로 결집되었던 임시 연대 블록이 붕괴했다는 것에 대한 결정적인 증거, 즉 오키 아오이를 비롯한 재무실이 새 내각에 어정쩡한 태도를 보여 주기 시작한 것 또한 새 대행 체제에 큰 타격이 되고 있습니다."
 COU_event_kaya.9.a:0 "참을성이 어린이보다도 부족한 건가?"
 COU_event_kaya.10.t:0 "신규 행정명령들의 효력 발휘"
 COU_event_kaya.10.desc:0 "카야 대행의 취임 이후 그녀와 그 내각은 심도 깊은 토론과 논쟁 끝에 결정한 여러 신규 행정명령들을 재빨리 통과시켰었고, 그 신규 행정명령들이 효력을 발휘하고 있다는 좋은 소식이 들려오고 있습니다. 예를 들자면 100g 이내의 화약 물질을 D.U.에 반입하는 것을 금지하는 행정명령은 목숨의 위협을 느끼던 현지인들에게 압도적인 지지를 받고 있으며 치안 유지에 관련하여 투입된 협력자들에게 높은 평판을 유지하고 있습니다.\n\n물론 모두가 새 행정명령에 만족하는 것은 아니지만 언제까지나 약자와 소수의 입장에서 불만을 품던 현지인들은 카야 내각의 새로운 행정명령들에 꽤나 만족하는 것으로 보입니다. 이것은 카야 대행의 정치적인 결정이 옳음을 시사하는 것이 틀림없습니다."
 COU_event_kaya.10.a:0 "당연히 그래야지."
 COU_event_kaya.11.t:0 "공포정치"
 COU_event_kaya.11.desc:0 ""... 크로노스 스쿨은 아직인가요. 정기 학생 담화를 진행해야 하는데."\n"죄, 죄송합니다 대행님... 지금 가능한 한 모든 수단을 동원해 호출하고 있습니다만... 도저히 연락을..."\n"하아? 그게 말이 되는 변명이라고 생각하시나요? 저자들이 연락을 안 받으면, 자체적인 방송을 준비한다는 생각은 못 하시는 건가요?"\n\n연일 굽신거리던 행정원이 도망치듯 집무실을 빠져나갔다. 카야는 흔들림 없는, 평온한 표정을 유지하고 있었다. 권력의 수뇌부가 드디어 내뱉은 일종의 고함이자 직접적인 행동을 저자들은 아마 일평생 처음 겪어봤을 것이다. 직접적인 해임, 감금 및 구타, 일가족 연금까지. 가능한 한 모든 수단을 사용하고 있었다. 왜 이렇게까지 하냐고? 그야, 반대파라는 작자들은 하루종일 인터넷에 선동이나 하고 거짓말하는것 말곤 아는 게 없으니까, 이번 기회에 '자신들이 존중해야 할 권력'이 무엇인지 가르쳐주기로 한 것 뿐이었다.\n\n이번에 카야가 준비한 '강력한 한 방'이 곧 세상에 모습을 드러낼 것이었다.\n\n"대, 대행님, 카메라 준비됐다고 합니다."\n"네, 고맙습니다."\n\n카메라를 향해 유영하듯, 천천히, 그리고 고고히 걸어가는 카야의 모습을 모두가 두려워하며 그녀의 시선을 피했다. 그렇지만 이 밖의 사람들은 이런 내부의 모습은 전혀 상상도 하지 못할 것이다. 담화에 거의 매일같이 얼굴을 비추고, 실눈을 곁들인 미소.\n\n흠 잡을 틈이 없었다. 그들이 꼬투리를 잡고 싶어도 잡히는 것은 권력 앞에 순응하는 자신의 모습이 전부일 것이다."
 COU_event_kaya.11.a:0 "완벽해."
 COU_event_kaya.12.t:0 "설탕 넣은 커피"
 COU_event_kaya.12.desc:0 ""명령하신 대로 체육실장, 문화실장, 보건실장, 인재자원실장, 인권보장실장은 모두 충성 서약에 서명했습니다. 재무실장의 서명은 받아내지 못했지만 대행님의 뛰어난 행정 처리 능력에 토를 달지 않는 것을 보아 무시할 만 합니다. 그리고 수석 행정관은 건드리지 말라는 지시에 접근하지는 않았습니다만, 정말 냅둬도 괜찮을까요? 벌레들의 정신적 지주가 아직 살아있다는 것이 마음에 걸립니다. -M.A. 판 후트."\n\n카야가 한숨을 쉬며 모모톡을 읽었다. 저 한심한 인간은 뭔데 자신의 결정에 무어라 딴지를 거는가? 그 점이 약간 기분이 나빴지만 그래도 곧이어 격양된 기분에 즐거워졌다. 이젠 더 이상 카야를 막을 수 있는 사람이 없었다. 저항하는 이들은 모두 '실종', 혹은 원인을 알 수 없는 '급사'로 처리되어 사라지기 일쑤였다. 카야의 앞길을 가로막던 모든 장애물들이 사라진 것이었다.\n\n고풍스러운 커피의 향기가 갓 뽑아진 따듯한 인쇄 용지에 어우러져 고고한 향기를 냈다. 커피잔에 작은 티스푼을 넣어 휘휘 저어 보았다. 설탕은 소용돌이쳐지듯 커피에 녹아들어갔다."
 COU_event_kaya.12.a:0 "키보토스는 다시 평온을 되찾으리라는 망상에 빠졌다."
 COU_event_kaya.13.t:0 "탄핵 시도 발각"
 COU_event_kaya.13.desc:0 "카야 대행이 점차 월권 행위를 감행하고 공포정치를 시작하자 자신들의 목이 조여오는 것을 깨달은 이들은 카야가 린을 탄핵한 것처럼 자신들도 카야 대행을 탄핵하기 위해 비밀스럽게 모여 탄핵 논의를 진행 중에 있었던 것처럼 보입니다. 그러나 우리의 뛰어난 현지 첩보망 덕분에 이들의 음모는 초장부터 발각당해 협력자들에게 '실종' 처리 되었으며, 사건의 진상을 파악한 이들은 아무런 반응을 하지 않는 것으로 화답했습니다.\n\n저들의 실수는 카야 대행을 믿은 것에서부터 시작되었습니다."
 COU_event_kaya.13.a:0 "믿을 수가 없네요."
 COU_event_kaya.14.t:0 "면담실"
 COU_event_kaya.14.desc:0 "공포정치로부터의 도주는 어이없을 만큼 허무하게 끝이 났다. 협력을 가장한 폭스 소대의 매복에 걸려든 것이다. 내리꽂듯 바라보는 카야의 시선에도 모모카는 시선을 피하지 않았다. 모모카의 밝은 눈동자만이 조용히 앞을 응시했다. 아유무는 입을 닫고 아무런 말을 하지 않았다. 동요한 듯 했지만 그렇게 보이지 않으려고 애쓰고 있는 듯 했다.\n\n"교통실장님, 마지막으로 묻겠습니다. 그날 이후, 어디로 가셨던 건가요? 덕분에 D.U.는 한동안 난리였었는데, 사보타주 혐의로 처형해도 할 말이 없으시겠어요?"\n"... 그래봤자 여기에 오는 시간이 앞당겨졌을 뿐이잖아."\n"하아? 서운한 말씀을 잘도 하시네요. 이게 다, 교통실장님께서 책임을 방치하고 유기하셨기 때문에 처벌을 면하실 수 없게 되신 거에요. 가만히 계셨으면 이럴 일도 없었다구요."\n"네네, 그것 참 설득이 되는 말이네요, 카야 "대행님"."\n\n순간적으로 카야의 얼굴에 있는 근육들이 요동쳤다. 참 설득이 되는 말. 그녀의 근신 도중 그녀가 무어라 항의하면 날라오고는 하던 말이었다.\n\n"하! 그래요! 참 설득이 되는 말이죠, 네! 제 말을 끝까지 못알아 쳐 먹으시는군요!"\n\n허리춤에서 뽑힌 권총이 그대로 모모카의 머리에 난사되었다. 셀 수도 없을 정도로 많은 총탄이 박혔다. 탕, 탕, 탕, 탕, 탕, 탕, 탕, 철컥. 모모카의 헤일로가 꺼지자, 카야의 권총이 아유무에게로 향했다. 면담실 문 앞을 지키던 유키노는 연이어 몸을 움찔거렸다."
 COU_event_kaya.14.a:0 "시시한 장난은 여기까지."
 COU_event_kaya.15.t:0 "크로노스 스쿨의 일상"
 COU_event_kaya.15.desc:0 "크로노스 스쿨의 방송국은 매일 분주하게 돌아간다. 기술자들은 카메라 장비를 정비하고, 아나운서들은 대본을 다 암기하려고 노력하고, 기자들은 송출될 시간에 맞춰 현장으로 향한다. 이렇게까지만 본다면 여느날같은 방송국의 일상이겠지만 달라진 것이 있었다. 카메라 바로 앞에 팔짱을 끼고 감시하듯 바라보는 사람, 그것도 총학생회에서 직접 보낸 협력자들의 존재였다. 곁에 작은 수첩을 들고 보도하려는 모든 내용을 모조리 적어 총학생회에 먼저 보고하는 이들은 크로노스를 뒤흔들어 놓았다.\n\n카자마키 마이와 카와루 시논은 그 덕에 거의 해임당할 뻔 했을만큼 상황은 좋지 않았다. 시논은 평소처럼 밝게 취재하려고 애썼지만 연극을 하는 것 같았다.\n\n심야 라디오 방송은 학생회의 새 행정명령에 대해 찬양하는 부분이 새로 추가되었고, 보도부가 작성한 기사들은 방송 전 상부에서 재작성에 가까운 검열을 받았다. 시논은 빨간 줄들이 쭉 그어진 기사에 한탄하듯 혼잣말하고는 했다.\n\n"이 역경, 카와루 시논은 돌파할 수 있을지, 채널 고정입니다.""
 COU_event_kaya.15.a:0 "골칫덩이들이 마음에 드는 말만 하니 좋네요."
 COU_event_kaya.16.t:0 "정의라는 것"
 COU_event_kaya.16.desc:0 "착잡해 보이는 듯 보이는 미야코의 볼은 뜨거웠다. 처음에는 단지 키보토스의 평화를 위협하는 공산주의자들을 처단하기 위한 정의감에서부터였다. 하지만 선배들과의 재회를 이런 식으로 하고 싶진 않았다. 동경하던 폭스 소대들의 선배들이 어느새 감옥에서 나와, 게다가 임원들을 습격해 협박하고 있을 줄은 몰랐다. 정말, 꿈에서도 몰랐다. 미야코는 한참이 지나서야 입을 뗐다.\n\n"유키노... 선배님, 왜... 어째서... 이런 짓을...?"\n"저는 선배님들을 동경했습니다. 갖지 못했던 이상을... 가혹한 상황 속에서도 중심을 잃지 않는 엄격함을... 그 어떤 악이라도 일격에 제압할 수 있는 정의를..."\n"... 저희들은 동경해 왔습니다. 그런데, 이런 건 저희가 동경하던 게 아닌데..."\n\n"모든 게 생각했던 바람대로 이루어지면 좋겠지. 하지만 현실이라는 건 그렇지 않아."\n"SRT 존립 자체가 위기였던 사실은 알고 있겠지, 츠키유키. SRT가 살아남은건 기적이 아니야. 카야 실장이 제안했었지. 자기 말만 들으면, 무슨 수를 써서라도 SRT와 우리들을 지켜주겠다고. 그리고 그 약속을 지켰어."\n\n"너에게 정의란 어떤 것이지? 나에겐, 소중한 학원과 후배들을 가혹한 세상으로부터 지키는 것이다. 저자들은 적극적으로 SRT 폐교를 추진했던 이들이야. 언제던지 SRT를 폐교시켜버릴 수 있다고."\n"츠키유키 소대장, 불의를 막겠다고 우리를 따라잡은 건 잘한 일이야. 그렇지만 그 다음은? 우리를 제압하고 뭘 어떡할 거지? 그런다고 정의가 이루어질거라고 생각하나?"\n"다 부질없는 짓이야, 츠키유키. 이제 그만 꿈에서 깰 시간이다. 정확히 알 수도 없는 책임과 판단은 모두 맡기고, 무기의 본분을 다하도록 해라."\n\n미야코는 훌쩍이듯 움찔거렸다. 무어라 말해보려고 애썼지만 하지 못했다. 선배들의 말에 틀린 것은 없었다. 애초부터 지금 작전을 수행할 수 있는 것도 폐교를 막아 준 카야 대행의 덕이 아닌가. 아마도 유키노 선배의 말이 맞을 지도 몰랐다. 미야코는 추후 문자 남기겠다고 답한 뒤 급히 자리를 피했다. 어쩌면, 정의라는 것은 보잘것없는 것이 아니었을까, 하고 생각해 보았다."
 COU_event_kaya.16.a:0 "그리고 니코는 홀로 유키노의 곁을 지켰다. 그녀는 쓴웃음을 짓고 있었다."
 COU_tooltip_COU_event_16:0 "§g정의란 대체 뭐지? 정말이지, 하나도 모르겠어.§!"
 COU_event_kaya.17.t:0 "확신"
 COU_event_kaya.17.desc:0 "긴 말할 필요가 없었다. 탄핵 시도를 했다고? 저 멍청한 년들이 한게 도대체 뭐가 있다고? 자신을 지지해서 어디 떡고물이라도 떨어지는 게 없나 하고 기웃거리는 것 말고는 아는게 없는 년들이, 감히 어떻게 자신에게 이럴 수 있는가? 이는 명백한 선전포고였다. 카야는 펜을 부들거리는 손으로 겨우 쥐어내 서랍에 넣었다. 역시 총학생회는 완전히 썩어 있었다. 완전히 썩은 데다 간첩들의 소굴이었다. 그렇기 때문에 총학생회장이, 린이 별것 하지 못하고 무기력했던 것이다. 그렇기 때문에 초인인 자신에 대한 탄핵 시도라는 정신나간 짓을 벌일 수 있는 게 아니겠는가? 게다가 초인이 자리를 비운다면 득을 얻는 것은 총학생회가 무너지기만을 바라는 비열한 지구의 현지 국가들밖에 없으니까.\n\n"역시 전 틀리지 않았어요. 그렇지 않고서야..." 그녀가 커피잔을 세게 쥐며 중얼거렸다.\n\n카야는 곁에 놓인 수도 없이 많은 보고서를 밀어버린 후 한 장의 종이를 꺼냈다. 저 일들은 급한 게 아니다. 지금 당장 시급한 것은 간첩들이 득시글거리고 부패한 총학생회 체제에 대한 당장의 개혁. 업무에 쩔쩔매며 커피나 마시고 있을 시간이 없었다."
 COU_event_kaya.17.a:0 "초인이 움직일 때."
 COU_tooltip_COU_event_17:0 "§R진행 중이던 국가적 중점이 취소됩니다.§!\n§g국가적 중점이 §Y충성 강제§! 중점까지 자동으로 진행될 것입니다.§!"
 COU_event_kaya.18.t:0 "취임"
 COU_event_kaya.18.desc:0 "회의실의 육중한 문이 열리고, 쏟아지는 스포트라이트가 단상을 향해 걷는 카야를 비췄다. 단상 뒤에 착석한 임원들은 마치 약속이라도 한 듯 일제히 기립하여 박수를 보냈다. 그 앞의 행정원들의 얼굴에는 일말의 망설임이나 이견조차 남아있지 않았다. 지난 몇 달간 카야가 공들여 다듬어온 행정적 정당성이 만들어낸 완벽한 만장일치였다. 긴급회의는 그 어떤 때보다도 신속하게 이루어졌다. 질의응답은 암묵적으로 금지되었으며, 어떻게 해야 최대한의 절차적 실수를 배제할 수 있는 지에 대해서만 논의가 이어졌다. 그녀가 2개월간의 근신 기간 동안 꿈꿔왔던 바로 그 권력의 무게였다.\n\n오키 아오이의 못마땅한 눈길이 끝까지 절차를 방해하기 위해 발악했지만 오래 가지는 못한 것 처럼 보였다. 마지못해 아오이도 찬성표를 던졌기 때문이라. 카야는 결과를 속삭여주는 목소리에 전율했다. 카야는 단상에서 카메라의 스포트라이트를 만끽하듯 선언했다.\n\n"이로써, 시라누이 카야 대행의 정식 총학생회장 추대 안건이 만장일치로 가결되었음을 선포합니다."\n\n카야의 목소리가 마이크를 타고 키보토스 전역으로 송출되었다. 카메라 렌즈 너머, 통제된 언론을 통해 이 광경을 지켜볼 수십만 명의 키보토스인들은 이제 새로운 질서의 탄생을 지켜보게 될 것이었다. 카야는 입가에 희미한 미소를 지었다. 초인의 통치, 무능한 자들이 사라진 낙원, 그리고 오직 자신만이 이룩할 수 있는 완벽한 세기가 마침내 시작된 것이다.\n\n방위실 임원들이 내지르는 승리의 환호성 속에서 그녀는 생애 가장 달콤한 승리감을 맛보았다."
 COU_event_kaya.18.a:0 "키보토스의 안녕을 위해."
 COU_kaya_trait_different_18:0 "@COU §Y시라누이 카야§!의 특성 변동:\n  §Y총학생회장 대행§! 특성을 §Y총학생회장§! 특성으로 교체.\n  §Y야심가§! 특성을 §Y초인?§! 특성으로 교체." #아 ㅋㅋ 
 COU_event_kaya.19.t:0 "공허"
 COU_event_kaya.19.desc:0 "책상 위에서 깃펜으로 화려하게 서명을 휘갈겼다. 새로 연구한 멋진 서명이 즉흥적으로 적혀내려갔다. 펜촉이 매끄러운 종이 위를 구르며 내는 소리와 그 끝에서 완성된 질서는 너무나도 아름다웠다. 몇 달에 걸쳐 준비한 행정적 논리는 완벽했으며 무력을 수반한 대화를 통해 총학생회는 내 의지에 따라 움직이고 있었다.\n\n오만하기 짝이 없던 행정원들은 이제 완벽한 통계 수치들을 담은 보고서를 올렸다. 이것이야말로 완벽한, 나 말고는 불가능한 초인의 통치라는 것이겠지, 하고 생각해 보곤 했다.\n\n그렇지만 오늘은 달랐다. 새벽 두 시. 나는 강박적으로 시계를 보았다. 무언가 이상했다. 어째 시간이 흐르고 있는 것 같지가 않았다. 시침과 분침이 움직이는 것 같지가 않았다.\n\n모든 지표는 우상향하고 있었다. 범죄율? 50%가 줄었다. 실업률? 35%가 줄었다. 지지율? 생각할 것도 없다. 하지만, 그럼 왜?\n\n그러다 문득 손을 내려다보았다. 깃펜을 쥔 손가락 끝이 미세하게 떨리고 있었다. 모든 것을 손에 넣었는데, 도대체 왜? 책에서 읽어본 적 없는 것들 투성이였다. 만일 내가 옳지 않았다면, 도대체 나는 어떤 벌을 받아야 하는 걸까?\n\n도저히 통제할 수 없는 불안을 느꼈다."
 COU_event_kaya.19.a:0 "\"단지... 피곤해서 그런 것 뿐이겠지요.""
 COU_tooltip_COU_event_kaya_19:0 "카야의 §Y정신적 스트레스§! 권력의 균형이 시작됩니다.\n상태는 §M좋음§!에서부터 시작해 매주 §R3.14씩 악화§!됩니다."
 COU_event_kaya.20.t:0 "옥좌"
 COU_event_kaya.20.desc:0 "나는 여전히 집무실에 앉아 있었다. 며칠째 밀린 보고서가 쌓이고 쌓여 산을 이루었다. 이따금씩 잉크가 매마른 깃펜이 굴러다닐 뿐이었다. 강박적으로 보고서에 서명하려고 애썼지만 손쉽게 되지 않았다.\n\n수치상으로 볼 땐 총학생회의 통치는 나날이 더 나아지고 있었다. 그러나 그 모든 지표가 날 비웃는 거대한 환상처럼 느껴졌다.\n\n보고서를 가져오는 행정원의 목소리는 더욱 무미건조해져 있었다. 행정원들은 그저 움직이는 영혼 없는 메트로놈 같았다. 화를 내 보아도 달라지는 것은 없었다. 사고할 수 없는 꼭두각시 인형처럼 느껴져 소름이 돋았다.\n\n거리는 깨끗했지만 그곳에는 갈망하던 초인의 광채도 자신을 찬양하는 진심어린 함성도 없었다. 오직 명령에 복종하는 죽어가는 사람들이 존재할 뿐이었다. 아니, 어쩌면 그렇다고 생각했다.\n\n... 이 보고서들이 만약에, 정말 만약에 몽땅 거짓말이라면 어떡하죠, 카야. 그럴 땐 어떻게 해야 하죠..."
 COU_event_kaya.20.a:0 "\"누구라도 좋으니 지금 당장 커피 한 잔 뽑아주세요...""
 COU_event_kaya.20.b:0 "\"괜찮아요 카야, 너무 업무에 집중해서 그런 것 뿐이니까.""
 COU_tooltip_whatifpoliticalpower100:0 "§g음, 어쩌면 정치력을 §Y150§! 이상 가지고 있었다면 더 나은 선택이 가능했었을지도...§!"
 COU_tooltip_forpoliticalpower100:0 "당신이 정치력을 §Y150§! 이상 가지고 있었기 때문에 선택이 가능합니다. §R그러나 기억하세요, 이 선택지는 한순간의 도피이고 스트레스의 악화를 영원히 막을 수는 없습니다.§!"
 COU_event_kaya.21.t:0 "흩뿌려진 먼지"
 COU_event_kaya.21.desc:0 "습관적으로 보고서에 조작이 없는지 의심해 보았다. 감사는 거의 매일 이루어졌지만 지난 달의 것과 비교하고, 핀셋으로 괜시리 종이를 건드려 본다. 그리고 언제나처럼 걸리는 것은 없었다. 초인의 완벽한 통치만이 증명될 뿐이었다. 휴우, 그건 다행이네요.\n\n생각해 보니 시끄럽던 거리가 조용하다. 시끄러운 잔챙이들이 사라져서 좋은데 뭔가 마음에 들지 않아요.\n\n완벽한 사람들은 원래 조용한가? 예전에 지루한 인류사를 연구하면서 칸트라는 사람을 접해본 적이 있었다. 그 사람도 조용했었다. 아마도? 기억상으로는. 그리고 총학생회장도 조용했었다. 아마도?\n\n책상 위에 먼지가 쌓였다. 장갑을 낀 손으로 대충 훌훌 털어 치우려고 했는데, 언제 눌러붙은 탓일까 떨어질 생각을 하지 않았다. 손톱으로 긁어도 떨어지지 않았다. 이런 하찮은 먼지 따위가 감히 초인을 거역한다는 사실에 화가 나 먼지를 권총으로 쏴죽였다. 책상에 구멍이 파였다. 아, 짜증나."
 COU_event_kaya.21.a:0 "\"하아, 먼지 좀 치... 아니, 치우지 마세요. 어차피 내일이면 다시 쌓일 테니.""
 COU_event_kaya.21.b:0 "\"물티슈로 닦을 걸 그랬나봐요.""
 COU_event_kaya.21.t2:0 "숙고"
 COU_event_kaya.21.desc2:0 "너무나도 많은 것들을 의심하고 있었다. 처음부터 끝까지, 카야는 자신이 구축한 모든 것들을 의심하고 두려워했다. 자신이 만든 피조물을 두려워하는 천재 박사처럼, 카야는 자신이 구축한 사회를 두려워했다. 권력을 잡기 전 상상했던 것과는 너무나도 많이 달랐고, 그렇기 때문에 자신이 구상하던 완벽한 키보토스라는 것은 어쩌면 불가능한 것이 아닐까, 하고 생각하고 있었다. 이루어지지 않은 것을 맹목적으로 두려워했다.\n\n수석 행정관과의 대화를 생각해 보았다. 왜 그녀는 그런 말을 했을까? 카야가 너무 자주 오는 것이 질려서 그랬을 수도 있다. 하지만 분명히 그녀가 했던 말들은 카야의 계기가 되었다. 바보털을 이리저리 뒤흔들며 숙고하는 카야의 모습은 노을 햇빛에 가려져 아무도 보지 못했지만, 그들은 그녀가 왜인지 웃고 있었다는 것은 보았다.\n\n너무 깊게 생각하지 말자, 집착하지 말자. 카야의 두 어깨를 짓누르던 끊임없는 책임감과 불안이 씻겨 내려가는 순간이었다."
 COU_event_kaya.21.c:0 "아직 끝나지 않았어."
 COU_event_kaya.22.t:0 "거울"
 COU_event_kaya.22.desc:0 "\"집무실의 모든 거울에 천을 올려서 가리라고 지시했어요. 거울을 보면 어떤 미친 여자가 보였거든요. 거기서 그 작자는 날 보고 웃었어요. 미친 여자처럼요. 저 미친 여자를 끌어내라고 명령했는데 그러지 않길래 임원 하나를 헤일로가 깨질 때까지 총으로 쐈습니다. 왜냐고요? 제 말을 듣지 않았잖아요. 그런 쉬운 명령도 이행하지 못하는데 어떻게 키보토스를 관리하는 역할을 맡기나요?\n\n키보토스는 장담하건데 아주아주아주아주아주아주아주아주아주아주 평온하답니다. 당신도 아시죠, -데이터 찾을 수 없음- 님. 저는 당신의 학생이니까...""
 COU_event_kaya.22.a:0 "\"조만간 차를 대접해 드리죠.""
 COU_tooltip_COU_event_kaya_22:0 "모든 §Y스트레스 완화§! 결정의 가격이 §R2배§!로 변동됩니다."
 COU_event_kaya.22.b:0 "\"... 그런데 내가 누구랑 대화하고 있었더라?""
 COU_event_kaya.23.t:0 "얼굴"
 COU_event_kaya.23.desc:0 "동그랗게 그려보는 지나간 너의 얼굴\n\n쓸모를 바라는 마음 한 켠에 그치지도 않고 불어터진 얼굴로\n\n무엇이 그리도 간절했던가 사랑 없는 사람에게 별게 될 순 없는지\n\n동그랗게 그려보는 지나간 너의 얼굴\n\n마르지 않는 그 얼굴은 기쁨을 못 이루는 사람, 사람이여\n\n어쩌면 잃어버린 것이 너무 많아\n어쩌면 잃어버린 것이 너무 많아\n하마터면 잊어버릴 것이 너무 많아"
 COU_event_kaya.23.a:0 "\"하마터면, 잊어버릴 것이 너무 많아.""
 COU_event_kaya.24.t:0 "암전"
 COU_event_kaya.24.desc:0 "\"재미있는 이야기 하나 해드릴까요? 요즈음 집무실의 빛이 글자를 다 가려 버려서 천장 등을 끄고 스탠드 불빛으로 업무를 처리했는데요, 그래도 눈이 아프더라고요. 바닥이 너무 매끈해서 그런가 싶어서 카펫도 깔아 봤는데 눈이 아팠어요. 뭐어... 당연히 저의 잘못은 아니겠지만요. 초인이 그럴 리는 없잖아요? 하여튼간에 결국엔 스탠드 불빛도 껐답니다. 후후. 이제서야 글씨가 읽히더라고요. 오래간만에 머리가 맑아졌어요.\n\n... 네? 서류를 읽으려면 빛이 필요하지 않냐고요?\n\n...\n\n빛이 있으면 그림자가 생기잖아요!\n\n그림자는 싫어요, 정말로 싫어요, 정말로.\n무언가가 가려진다는 게...""
 COU_event_kaya.24.a:0 "\"... 정말 싫어요.""
 COU_event_kaya.25.t:0 "피로회복제"
 COU_event_kaya.25.desc:0 ""방위실장... 아니, 총학생회장. 어째 피곤해 보이는데."\n\n서류뭉치 속에 파묻힌 카야의 분홍빛 머리칼이 잘 보이지 않았다. 아오이는 피식 웃어 보였다. \n\n"... 재무실장이신가요. 후후후..... 후우. 아무런... 문제는 없습니다. 이번 예산안도 완벽하죠? 후후..."\n"음, 솔직히 말하자면 놀랐어. 너가 린 행정관만큼의 일을 처리할 수 있을 줄은."\n\n서류 속에 파묻혀 있던 카야가 바보털을 빼꼼 드러냈다. 수석 행정관 이야기에 언뜻 기분이 나빠진 것일까? 그럼에도 다른 사람이 아닌 아오이였기에, 서류뭉치를 집어던지며 화를 내진 않았다. \n\n"재무실장, 제가 그렇게 무능해 보였던가요."\n"... 부정하진 않을게. 하여튼 지금은 그렇게 보진 않으니 안심해. 너도 꽤나 수고하고 있네."\n"별말씀을요."\n\n아오이가 또각거리는 구둣발 소리와 서류를 챙겨 올려놓았다. 그 곁엔 피로회복제 한 캔이 올려졌다.\n\n"이건?"\n"열심히 하는 것도 좋지만, 네 몸이 견디지 못하면 말짱 도루묵이지. 쉬어가면서 하도록 해, 부디."\n"놀리시는 건가요. 초인은 지치지 않는다고요."\n\n카야는 회복제 캔을 들고 이리저리 흔들어 보았다."
 COU_event_kaya.25.a:0 "나쁘진 않은 기분이었다."
 COU_event_kaya.26.t:0 "특별행정조치"
 COU_event_kaya.26.desc:0 "키보토스 재건을 위한 특별행정조치는 오랜 검토와 논의 끝에 완성되었습니다. 키보토스의 비상사태 상황에서 (비상사태가 정확히 어떤 상태인지는 규명되지 않았습니다) 총학생회장의 판단은 모든 기존 행정명령 및 학원의 자치권에 우선한다는 조항을 통해 카야의 정치적인 권력을 극단적으로 강화하고 일종의 일인통치에 관한 보호막을 설치한 것입니다. 카야는 만족스러운 표정으로 조치를 발표했으며 발표 즉시 키보토스 전역에 일괄적으로 적용된다고 선포했습니다.\n\n총학생회는 안타깝게도 대전이 이후 자치권을 한계까지 발동한 학원들에 대한 실질적인 통제력은 없지만 행정위원회 내부에서 카야 충성파의 권력과 카야의 권위는 압도적으로 높아질 것입니다.\n\n키보토스 재통일을 위해서라면 그 무엇이더라도 이루어져야만 합니다. 그리고 재통일을 이끌 유일한 기수는 시라누이 카야 뿐입니다."
 COU_event_kaya.26.a:0 "일보후퇴 이보전진."
 COU_event_kaya.27.t:0 "시라누이 카야의 상태 악화"
 COU_event_kaya.27.desc:0 "이 알림을 확인하셨다는 것은 시라누이 카야의 상태가 점차 악화되고 있다는 것을 뜻합니다.\n\n상태가 점점 악화될수록 정치력 획득량이 줄어들고 맨 끝 §R최악§!에 도달할 경우 시스템이 제거되지만 강력한 페널티 트레잇들과 배드 엔딩이 부여될 것입니다.\n\n명심하시길 바랍니다. 당신이 원하는 결말은 오직 오랜 노고 끝에 당신에게 안겨올 테니.\n아, 또한 원하는 것을 확인하지 않았다면, 초반 인트로에서 '목표'를 다시 확인해보시기 바랍니다."
 COU_event_kaya.27.a:0 "알겠습니다."
 COU_event_kaya.27.b:0 "상태 악화 알림을 끄겠습니다."
 COU_event_kaya.28.t:0 "파랑새"
 COU_event_kaya.28.desc:0 "시라누이 카야는 계속해서 완벽한 권력을 찾아서 헤맸습니다. 서툴지 않으며 결단력 있고 모두가 사랑하며 옹호받는 권력을 찾아서 나날들을 보냈습니다. 그렇게만 하면 총학생회의 권위는 다시 서고 키보토스는 다시 옛날처럼 안정과 발전의 시기에 접어들고 다시 한번 완벽해질 것이라고 믿었습니다. 그렇지만 그녀의 믿음은 처음부터 문제가 있었습니다.\n\n반박하는 이들의 입을 막고 그렇지 않다고 말하는 자료는 분쇄기에서 끝을 맞이했습니다. 그렇게 한 뒤에 자신이 만들어낸 가짜 통계를 집어들고 또다시 끊임없이 의심하는 굴레에 갇혀 끔찍한 끝을 맞이했습니다. 자신이 틀렸다는 것을 인정하는 것 말입니다. 완벽함이라는 것은 사실 카야를 떠나간 것이 아니었습니다. 정신을 차리고 뒤돌아 보니 되려 완벽함에서부터 멀리 도망친 꼴이었던 것입니다.\n\n카야는 통치를 지속할 것입니다. 이미 돌아갈 수 없는 길을 지났기 때문입니다. 카야는 처음부터 녹아내리겠지만, 통치는 지속될 것입니다.\n\n그렇지만, 그것이 과연 그녀가 원하는 것일까요?"
 COU_event_kaya.28.a:0 "끝이다. 드디어..."
 COU_tooltip_COU_event_kaya_28:0 "§g해가 지지 않는 밤이 계속되고\n우리는 겁에 질려 누가 먼저랄 거 없이 거리로 나갔네\n불이 가득 켜진 거리에 갔을 땐\n아무 말도 없는 사람들을 봤네\n약속된 침묵을 깨고선 누군가 구역질을 했네\n무슨 말을 할 진 아는데\n나서는 이는 하나도 없었네\n밀려오는 멀미에 어지러워져서\n강가로 가 내 몸을 던졌네\n내 몸이 떠오르면\n꽃을 던져줘요\n나는 그렇게 기억될래요\n바람에 실려 더는 보이지 않으면\n떠나가 여길 돌아오지 마요\n다시는 날 보러 오지 마요§!"
 COU_event_kaya.29.t:0 "웃음"
 COU_event_kaya.29.desc:0 "문을 거칠게 두드리는 소리와 함께 카야가 들어온다. 어색한 미소를 지어 보인다. 카야는 내가 달갑지도 않을 법 하지만 어째서인지 요즈음 나를 자주 찾아오고는 했다. 게다가... 이거, 술 냄새인가? 카야가 술을 마셨다고? 커피가 아니라? 의아한 점이었다.\n\n"네에, 네에-! 듣고 계신가요, 수석 행정과안--! 당신 따위의 허접한, 딸꾹! 통치는... 저 같은 초인에 비하면... 딸꾹!"\n\n평소에 나를 찾아오던 카야의 태도가 아니었다. 얼굴은 계속 불안해 보였다. 자신이 맞는지 계속 의심하고 있던 것이겠지.\n\n눈을 감고 옅게 웃어 보였다. 날 탄핵할 땐 그렇게 멋진 척만 하던 그녀가 이렇게까지 될 정도라면 그녀가 얼마나 노력했을지 상상하지 않아도 될 것 같았다. 비록 방법은 달랐어도 키보토스를 위하고자 하는 마음은 같았던 것이겠지.\n\n"하하, 수석 행정관... 난 당신보다 더 나은 사람, 딸꾹! 이라구요... 네? 아시겠죠...?"\n"물론, 방위실장. 넌 확실히 더 나은 사람이 되었지. 나로서는 상상조차도 하지 못하는 방법이긴 하지만, 넌 확실히 키보토스를 어제보다 더 나은 곳으로 만들고 있어."\n"너무 집착하거나 불안해 할 건 없어. 너 자신만을 믿고 나아가도록 해. 아직 모든 건, 끝나지 않았으니까."\n\n말을 끝마치자마자 카야는 곧바로 자리에서 일어났다. 분해 보였지만 계속 불안해 보이던 얼굴은 한 층 더 밝아 보였다.\n\n"나나가미 린 수석 행정관, 절 이기셨다고 생각하시는 건 오산입니다. 앞으로 이곳에서 더 나은 키보토스를 관찰해 보시라구요, 후후." 카야가 문을 조용히 닫고 나갔다. 부담을 한 층 덜어주는 사람은 누구에게나 필요하다."
 COU_event_kaya.29.a:0 "단순한 계기가 미래를 만들지."
 COU_tooltip_COU_event_kaya_29:0 "§Y시라누이 카야§!의 §G해피 엔딩§! 분기가 해금됩니다.\n§g정치력을 §Y300§!이상 모아 두십시오!§!"
 COU_event_kaya.30.t:0 "초인, 집착하지 않는"
 COU_event_kaya.30.desc:0 "카야는 좀 더 후련한 마음으로 집무실에 출근했다. 여느 때처럼 블루 마운틴을 즐기고, 서류 한 장을 넘겨 검토해 본다. 조작의 증거는 없다는 것을 마지막 감사 결과로 확신했다. 사실 감사 정도야 거의 매일 했지만, 이젠 더는 그렇게 집착하지 않기로 했다. 완벽함이란 여유에서부터 나오는 것이니까. 권총도 이젠 책상 서랍 속에 넣어 두었다. 권총은 침입자가 들어오면 그때에만 쓰기로 자신에게 약속했다.\n\n오래간만에 웃으며 사람을 반겼다. 일은 고되었지만 웃음을 잃을 정도까지는 아니었다.\n\n초인이라는 사람의 자질은 단지 완벽한 사회를 만드는 사람이 아니었다.\n초인이라는 사람의 자질은 단지 모두가 그녀를 사랑해야지만 하는 사람이 아니었다."
 COU_event_kaya.30.a:0 "초인의 자질은 그리 멀리 있지 않았다."
 COU_tooltip_COU_event_kaya_30:0 "§g카야는 자신은 틀리지 않았으며 완벽해야만 한다는 강박에 시달려 그동안 끝나지도 않은 일에 대해 끊임없이, 이유 없이 불안해하고 의심해 왔지만 더는 그렇지 않을 것입니다. 카야는 더 이상 끝나지도 않은 일에 대해 정신적으로 스트레스받지 않을 것입니다.§!\n\n진정한 해피 엔딩은 이제 당신에게 달렸습니다. 부디 카야에게 해피 엔딩을 선사해주시길 희망합니다." #... 이게 진짜라는 보장은 없지만요.
 COU_event_kaya.31.t:0 "커튼 걷기"
 COU_event_kaya.31.desc:0 "집무실의 커튼을 걷으니 유난히 밝은 햇빛이 창가를 비췄다. 린이 해준 말을 곱씹으며 창밖의 키보토스를 바라보았다. 여전히 도시는 완벽하지 않았고 여기저기 잡음이 들려왔지만, 이상하게도 이전처럼 심장이 조여오는 공포는 느껴지지 않았다. 어쩌면 그것이 가장 '완벽했던 키보토스'의 단면이였기에 그랬던 것이 아닐까. 방위실장이었을적의 일을 생각해 보았다. 내심 웃음이 났다. 권력만을 갈구하던 그때 그 시절의 자신은 너무나 멍청하기 짝이 없었기 때문이라.\n\n"총학생회장님, 요청하신 서류... 어머." 보고서를 들고 들어온 행정원이 멈춰 섰다. 오래간만에 집무실에 밝은 빛이 들이치고 있었다.\n\n"이 커피... 누가 탔는지는 몰라도 향이 아주 좋네요, 후후." 따뜻한 김이 모락모락 피어오르는 잔을 내밀며 살짝 미소 지었다.\n"수고했어요. 이 보고서는 천천히 검토해도 늦지 않겠네요.""
 COU_event_kaya.31.a:0 "\"잠시 쉬었다 할까요?""
 COU_event_kaya.32.t:0 "의심하지 않기"
 COU_event_kaya.32.desc:0 "드그렐이 긴장된 표정으로 집무실 문 앞에 섰다. 카야가 총학생회장으로 취임한 이후 온갖 명분으로 자신을 구워삶으려고 들었기 때문이다. 왜 그런지 여러번 생각해봤지만 아무리봐도 협력자와 자신을 갖고 놀려는 것 말고는 이유를 생각할 수 없었다. 오늘도 또 어떤 이유로 꼬투리를 잡으려나.\n\n"음, 아무런 문제 없네요. 브뤼셀 치안 유지에 좀 더 예산을 배정하겠습니다."\n\n드그렐이 놀라 멍청하게 서 있는 동안 카야가 서류에 서명하여 돌려주었다. 그리고서는 커피 한 잔을 마신 뒤, 무슨 일이냐는 듯 되려 드그렐을 바라보았다.\n\n"무슨 문제 있나요?"\n"아, 아뇨, 감사합니다."\n\n황급히 빠른 걸음으로 드그렐이 자리를 떴다. 무슨 일인지는 몰라도 카야는 어제보단 상태가 좋아 보였다. 놀라서 잠깐 아무런 생각도 하지 못 했을 정도로."
 COU_event_kaya.32.a:0 "\"이유야 어떻든, 드디어 정신을 차렸군.""
 COU_event_kaya.33.t:0 "소리치기"
 COU_event_kaya.33.desc:0 "카야의 집무실 온도는 평소보다 낮게 설정되어 있었다. 다리를 떨고는 있었지만 추워서 그러는 것이 아니었다. 참을 수 없는 분노가 피어올랐다. 누군가가 생텀 타워의 로비에 카야를 조롱하는 벽보를 붙여 놓았기 때문이다. 정기 휴식을 가지고 잠시 찾아왔던 평온함은 다시 날카로운 가시가 되어 돋아났다. 게다가 바깥에선 간 크게도 카야의 능력에 대해 감히 비판하는 목소리가 얕게나마 들려왔다. 실제론 그렇지 않았어도 카야는 들었다.\n\n카야는 펜을 집어 던지며 자리에서 일어났다. 그녀가 향한 곳은 빈 당직실이 아니라 생텀 타워 방송실의 대형 스피커 제어실이었다. 갑작스러운 방문에 놀란 행정원을 밀치고 마이크를 잡은 카야의 눈에는 피로와 분노가 뒤섞인 빛이 감돌았다.\n\n"아아, 총학생회장 시라누이 카야입니다. 쥐새끼들처럼 모여서 제 통계가 '조작'이라고 떠드는 멍청이들에게 한마디만 하죠."\n"... 씨발 좀 닥쳐 이 좆같은 머저리 새끼들아! 너희 같은 잔챙이들이 이해하기엔 내 통치는 너무 고차원적이니까!"\n\n카야는 그제야 체증이 가신 듯 거칠게 숨을 몰아쉬었다. 곁에서 경악한 표정으로 서 있는 행정원을 향해 카야는 머리를 묶으며 내던지듯 대화를 마무리했다.\n\n"후우, 제 통치를 이해하지 못하는 놈들은 다 멍청이들이에요. 아시죠?""
 COU_event_kaya.33.a:0 "\"카야의 목소리가 끊임없이 울렸다."
 COU_tooltip_COU_event_33:0 "§g초인의 휴식은 소음 제거에서 시작됩니다.§!"
 COU_event_kaya.34.t:0 "기도"
 COU_event_kaya.34.desc:0 "시라토리구 근처에 교회가 하나 있었다. 대전이 이후 폐쇄되어 오는 이 없는 교회의 미카엘과 그의 멍한 눈길이 텅 빈 교회를 응시했다. 쥐들이 배고픔에 지쳐 성배를 갉아먹고, 기도할 이 잃은 성경은 무기력했다.\n\n끼익거리는 소리와 함께 문이 열렸다. 분홍빛 머리칼과 바보털을 살랑거리며 시라누이 카야가 모습을 드러냈다. 먼지 쌓인 장의자를 털고 가지런히 앉아 보았다. 조금 불편했다. 집무실의 최고급 가죽 의자와 낡아빠진 장의자의 차이는 어쩔 수 없는 일이었다. 카야는 일평생 처음으로 교회에 왔다. 그리고 일평생 처음으로 기도를 했다. 이유모를 막연한 공포에 시달린 탓일까.\n\n"엎디어 구하오니, 성 미카엘 대천신이여. 이 세상 전장에 우리를 보호하사 마귀의 악함과 흉계를 방비케 하시고, 또 천주 저 마귀를 억제하여 굴복케 하시며, 너는 천국 모든 신을 총령하시는 자라."\n\n꽉 맞잡은 손이 떨렸다.\n\n"세상에 두루 다니며 영혼을 삼키려는 사탄과, 다른 악신의 무리를 천주의 힘을 인하여 지옥에로 쫓아 몰으소서."\n"아멘."\n\n카야는 천천히 감았던 눈을 떴다. 비록 먼지가 쌓였지만 사탄에게 창을 꽂고 서 있던 미카엘과 눈이 마주쳤다. 미카엘이 창을 뽑아들고 카야에게 예를 갖췄다. 그리고 말했다."
 COU_event_kaya.34.a:0 "\"탄원자인 우리들이 간청합니다.""
 COU_tooltip_COU_event_kaya_34:0 "§g\"사탄과 다른 악령들을 지옥 속으로 떨어뜨리소서."§!"
 COU_event_kaya.35.t:0 "방관자"
 COU_event_kaya.35.desc:0 "평소 실적을 보고하던 행정원이 보이질 않았다. 전화를 돌려 보아도 모르겠다는 교환인의 답변 뿐이었다. 오키 아오이는 한숨을 쉬며 수화기를 내려놓았다. 총학생회장 대행이라는 같잖은 직위는 솔직히 말해서, 유능하기만 하다면 아무나 해도 괜찮다고 생각했다. 설령 그것이 독재를 꿈꾸는 지망생의 통치라고 하더라도. 아오이는 정치적 수사나 명분 따위의 비효율에 휘둘리지 않는다고 자신하고 있었지만, 카야 대행의 취임 이후 상황은 무언가 이상하게만 흘러갔다.\n\n절차와 대행의 정당성에는 아무런 문제를 제기할 수 없고 또 할 생각도 없었다. 캬야는 대전이 이후 한 달간의 근신 기간동안 마치 다른 사람이 된 것처럼 행동하고 있었다. 서재에 틀어박혀 현지의 책을 탐독하던 것이 이런 상황의 적절한 해답이 될 수도 있었다. 그리고 지금, 카야는 총학생회 역사상 유례없는 공포정치를 마구잡이로 시행하고 있었다. 근신 기간에서 배운 것이 없는 듯 싶으면서도 철저한 절차적 명분과 행정 절차는 아오이에게 있어 당황스러울 정도로 매끄러웠다.\n\n아오이는 머리를 부여잡으며 장갑을 벗어 던져 놓았다. 나나가미 린의 탄핵이 자신의 정치 경력 중 가장 큰 실책으로 다가오는 순간이었다. 머리가 아팠다. 제지하고 싶어도 할 수 없었다. 자신의 직위와 권한은 비록 무시할 수 없겠지만 까딱하다간 자신이 협력자들에게 잡혀 어디론가 '연금' 될 것이고, 그렇게 됐다간 연쇄적으로 행정 절차에 구멍이 생길 것이며 아오이가 그렇게 바라 마지않던 '안정된 키보토스'라는 것이 산산조각나고 말 것이다.\n\n그러나 이젠 무엇을 해야 한단 말인가?"
 COU_event_kaya.35.a:0 "방법이 없었다. 불만족스러운 푸른 눈빛은 갈 곳을 잃었다."
 COU_tooltip_COU_event_kaya_35:0 "§g그 누구도 볼 수 없을 것만 같은 슬픈 마음의 소리.§!"
 COU_event_kaya.36.t:0 "추기경의 제안"
 COU_event_kaya.36.desc:0 "행정위원회의 행정원들이 조심스럽게 그를 카야의 집무실까지 안내했다. 요제프 에르네스트 반 로이 추기경은 목에 건 십자가 목걸이를 바라보았다. 자신의 행동이 부디 옳기를 하나님께 빌면서, 목걸이를 꽉 쥐어 보였다. 대전이 이후 교황청이 폐지했더라도 그는 메헬렌-브뤼셀관구의 대주교로서 더는 상황을 방관할 수는 없었다. 그는 헛기침을 하며 문을 두드렸다.\n\n"네, 들어오세요."\n\n문 너머에서 시라누이 카야가 뒤돌아 앉아 있었다. 그가 앞의 소파에 앉자마자 카야가 곧바로 말을 꺼냈다.\n\n"D.U.에 오신 걸 환영합니다, 요제프 추기경님. 전 바쁜 몸이니 부디 빠르게 본론부터 말씀해주시길."\n"카야 양은 게헨나라는, 악독한 뿔 달린 사탄 무신론자 버러지 새끼들이 벌인 일을 알고 있지 않소? 본인을 비롯한 가톨릭 교회는 총학생회의 보호가 필요하오. 무조건적인."\n"흐음, 총학생회가 아무런 조건 없이 보호해드리기엔 리스크가..."\n"당신의 행정명령에 신의 뜻이라는 낙인을 찍어드리겠소. 그렇다면... 당신, 아니, 총학생회가 다시 키보토스를 지배하게 될 때 좀 더 수월하게 진행할 수 있겠지."\n\n"... 흥미롭네요. 거래 조건은?"\n"독립적인 키보토스 교구를 창설하고 본인을 대주교로 임명할 것, 그리고 저지대의 성유물 관리권. 그것만 카야 양이 양보해줄 수 있다면, 본인과 가톨릭은 얼마던지 당신의 뜻을 위해 협력해줄 수 있소."\n\n카야가 커피잔을 내려놓고 뒤돌아 요제프 추기경을 바라보았다. 추기경의 말에 무슨 의도가 있을 지 여러번 생각해보던 그녀는 마침내 살짝 웃으며 그에게 화답했다."
 COU_event_kaya.36.a:0 "\"후후. 거래 성립이네요.""
 COU_tooltip_COU_event_kaya_36:0 "§g요제프 추기경은 안도하며 웃었다. 그리고 벨기에, 네덜란드의 형제자매들이 무신론자 병신들로부터 안전해졌다는 확신에 안도했다.§!"
 #엔딩들 
 COU_event_kaya.37.t:0 "초인의 통치"
 COU_event_kaya.37.desc:0 "카야는 우아하게 앉아 창밖을 바라보았다. 모든 것이 완벽했다. 사회는 안전해졌으며 불만은 사그라들었고 그녀를 음해하기 바빴던 멍청이들은 언제 그랬냐는 듯 카야의 통치를 찬양하기 바빴다. 일개 시골의 지역에서도 카야의 손이 닿지 않은 곳이 없었다. 모든 여정에 끝에서, 모든 것은 다시 완벽해졌다. 총학생회장과 초인이 통치하던 사회. 사회는 두 배로 더 커졌지만 새로운 초인은 완벽하게 그 역할을 해냈다.\n\n수동적이지만 기계적인 총학생회는 이제 새로운 세상을 효율적으로 통치하고 있었다. 키보토스 곳곳에 행정명령의 위력이 닿으며 학원들은 총학생회의 통치 아래 모두가 조화로운 삶을 이어가고 있었다. 범죄란 이제 옛말이 될 정도로.\n\n카야의 거대한 초상화가 총학생회 건물에서 위엄을 떨쳤다. 모든 학생들을 굽어보는 카야의 초상화는 학생들과 인민들의 영적이자 연속적인 지도자로서 기능했다. 학생들은 카야가 가져온 옛 질서에 안도했으며 감사했다. 현지인들은 다시 돌아간 일상에 환호했으며 기뻐했다.\n\n카야는 만족스러운 듯한 표정으로 따뜻한 휴식을 취했다. 마치 모든 게 꿈만 같았다. 카야의 통치 아래 모두가 행복하게 살 것이다. 키보토스를 구한 영웅 시라누이 카야와 함께,\n\n영원히."
 COU_event_kaya.37.a:0 "초인 만세!"
 COU_tooltip_COU_event_kaya_37:0 "§g그렇게 총학생회의 이야기는 막을 내렸습니다. 카야는 이야기의 끝에서 그토록 그리던 낙원을 건설했습니다. 모두가 행복합니다. 우여곡절은 많았지만, 이제 모두가 행복합니다. 분명히.§!\n플레이해주셔서 감사합니다!"
 COU_event_kaya.38.t:0 "행복한 망상"
 COU_event_kaya.38.desc:0 "생기 없는 얼굴로, 차디찬 복도를 임원이 가로지르고 있었다. 곁에는 짤막한 내용과 함께 카야가 서명한 보고서를 가지고 있었다. 무언가 거창한 내용이 적혀 있는 보고서일까? 아니, 전혀 그렇지 않다. 임원은 행정위원회로 카야의 점심 메뉴를 변경해달라는 내용을 보고하러 가고 있었다. 카야는 한동안 집무실에서 나오지 않았다. 구겨진 머리, 찢겨진 하이네의 안부 편지만이 어두운 집무실에서 굴러다녔다.\n\n카야는 불안한 눈빛으로 어둠 속을 응시했다. 무언가 자기를 바라보는 것만 같았다. 더 이상 미칠 것도 없었다. 갑자기 너머에 누군가 나타났다. 카야는 떨리는 손으로 빈 공간을 향해 손을 허우적거렸다. 어쩐지 저 사람을 잡지 않으면 안될 것 같다는 또다른 불안에 휩싸였다.\n\n휘적거리는 짧은 손이 비웃듯 맴돌았다. 카야는 힘없이 팔을 떨궜다. 그리고 어둠에 눈을 맡겨 눈을 감았다. 아무런 것도 보이지 않았을까? 아니, 전혀 그렇지 않다. 눈을 감으면, 깨끗하고 정돈된 자신의 집무실이 보인다. 창밖에서는 카야를 찬양하는 플래카드를 든 시위대의 행진이 지속되고 있다. 그녀의 곁에는 나나가미 린이 영웅을 동경하는 어린아이처럼 자신을 바라보고 있다.\n\n카야는 키보토스를 구했지만, 자신은 구하지 못했다. 그녀는 눈을 감고 보이는 행복한 망상에 남은 삶을 의지하고 있었다. 언제까지 지속되는 지는 아무도 모른다.\n\n어쩌면 영원히 그렇게 살아야 할 지도 모른다."
 COU_event_kaya.38.a:0 "카야는 몇 시간동안 눈을 감고 있었다. 그 사이로 수많은 발걸음들이 쓸쓸히 그녀를 지났다."
 COU_tooltip_COU_event_kaya_38:0 "§g누군가는 죽어도 통치는 지속된다. 카야는 통치를 지속한다. 생기 없는 얼굴로, 모두를 구했다는 행복한 망상에 빠져, 모두가 행복하다는 믿음과 함께.§!\n플레이해주셔서 감사합니다!"
 COU_event_kaya.39.t:0 "승리자와 패배자 그 사이"
 COU_event_kaya.39.desc:0 "카야는 마침내 키보토스의 재통일이라는 과업을 해냈다. 총학생회의 깃발을 높이 들고 유럽을 수호하는 카야의 선전 포스터가 곳곳에 나뒹글었다.\n\n하지만 그 사이 본인은 어떻게 되었는가? 멈출 줄 모르는 불안에 정신이 갉아먹히고 고통스러운 나날들을 보냈다. 의심하고, 쳐내고, 재정리했다. 정신적인 스트레스는 카야 그 자체가 되었고 카야는 이제 스트레스에 시달리고 이따금씩 망상에 빠지는 것에 익숙해진 삶을 살고 있었다. 그렇지 않으면 정말 미쳐버릴 것 같았기에.\n\n임원이 빠른 발걸음으로 카야의 집무실 문을 두드렸다. 졸고 있던 카야가 놀라 집무실의 불들을 켰다. 평소의 카야였다면 졸고 있는데 문을 두드렸다고 총을 쏴댔겠지만, 이제는 괜찮았다. 그를 신경질적이게 만들던 모든 요소는 사라졌기 때문이다. 긴장도니 표정의 임원은 카야에게 재통일 보고서를 제출했다. 카야가 안경을 쓰고 재무실이 추가로 적어둔 통일 비용을 흝어 보았다. 읽으면 읽을수록 짜증이 났다.\n\n카야는 그렇게 염원하던 끝에 도달했지만 어째서인지 계속 짜증을 내고 있었다."
 COU_event_kaya.39.a:0 "초인 만세...?"
 COU_tooltip_COU_event_kaya_39:0 "§g영웅이 되고 싶었던 소녀가 마주한 현실은 가혹했습니다. 언제쯤 이 긴 여정이 끝날까요? 카야는 언제쯤 초인이 될 수 있을까요? 아니, 그녀가 초인이긴 한가요?§!\n플레이해주셔서 감사합니다! 긴 여정동안 카야의 정신을 관리하시느라 굉장히 수고 많으셨습니다. 그러나, 진정한 해피 엔딩이 당신을 기다립니다. 새로운 게임에서 '목표'를 클릭해 주시길."
 COU_event_kaya.40.t:0 "고요"
 COU_event_kaya.40.desc:0 "마침내 모든 총성이 멎었다. 트리니티의 대성당 위에도, 게헨나의 무법지대 위에도, 그리고 아비도스의 모래바람 위에도 총학생회의 깃발이 나부꼈다. 키보토스 역사상 그 누구도 해내지 못했던 완전한 행정 통합이 시라누이 카야의 손끝에서 완성된 것이다.\n\n학원 간의 경계선은 이제 서류상의 구분으로만 남았다. 막강했던 자치권은 회수되어 총학생회의 캐비닛 속에 봉인되었고, 학생들의 무력 충돌은 행정 처분이라는 이름 아래 자취를 감췄다. 이제 키보토스에 소란스러운 축제나 무모한 소동은 없다. 오직 정해진 시간에 울리는 종소리와, 기계적으로 보고서를 처리하는 행정원들의 타자 소리만이 도시의 맥박을 대신했다.\n\n총학생회장과 카야가 그토록 혐오했던 무능한 혼란은 이제 찾아볼 수 없었다. 도시 전체가 하나의 거대한 시계태엽 장치처럼 카야의 의지에 따라 정교하게 맞물려 돌아가고 있었다. 도시의 한가운데를 비추는 스크린에서는 완벽한 초인의 형상을 한 여인이 서 있었다.\n\n키보토스는 평화를 얻었다. 다만, 그 평화는 숨소리조차 들리지 않을 만큼 지독하게 고요할 뿐이었다."
 COU_event_kaya.40.a:0 "고요한 평화. 평화란 원래 그렇지."
 COU_event_kaya.41.t:0 "베른하르트 공 소문"
 COU_event_kaya.41.desc:0 "레옹 드그렐이 D.U.의 집무실에서 서류를 처리하고 있을 때였다. 드그렐은 카야가 요구하는 대로 협력자 내부 반대파 처리 일정을 맞추기 위해 바삐 움직이고 있었다. 조금이라도 늦는다면 카야에게 장난없게 까일 것이었따. 뻐근해진 허리에 드그렐이 푸념을 늘어놓듯 어깨를 툭, 툭 치며 말했다. "이것보다 더 나쁠 순 없을 거야."\n\n바깥에서 앳된 모습의 행정원이 문을 두들겼다. 드그렐이 서툰 일본어로 들어오라고 했다. 행정원은 조심스럽게 서류를 드그렐에게 넘겼다.\n\n"이게 뭔가요?"\n"최근 방위실에서 주시하라고 명령이 떨어진 인물에 관련된 보고서입니다."\n"아, 예 감사합니다, 거기 두고 나가세요."\n\n그리고 몇 시간 뒤, 드그렐이 마치 깜빡하고 하지 않은 숙제를 하듯 행정원이 놓고 간 서류를 흘긋 바라보았다. 별 심각한 내용은 없는 것 같았다. 중간에 써진 '베른하르트 공' 이라는 이름을 읽기 전까지는.\n\n"... 코기타운과 트라이 스퀘어를 오가며 저항할 것을 독려하는 베른하르트... 잠깐, 베른하르트? 그 인간은 분명히 죽었을 텐데!"\n\n드그렐이 주위를 둘러보았다. 만에 하나 베른하르트가 살아있다면 그것은 자신에 대한 사형 선고와 마찬가지이다. 그야 당연한 것이, 1935년 12월에 분명히 죽은 것을 봤다고 본인이 확신해 보고했으니까, 이를 뒤엎는 말을 하는 것은 카야의 심기를 건드리다 못해 터트릴 것이다. 드그렐이 식은땀을 흘리며 서류에 눈을 떼지 못했다."
 COU_event_kaya.41.a:0 "\"씨발, 나한테만 이러지 또...""
 COU_tooltip_COU_event_kaya_41:0 "§g권총을 챙긴 드그렐이 거리를 돌이다니며 베른하르트와 비슷해 보이는 사람 전부를 쏴죽였다. 죽지 않기 위해서는 어쩔 수 없는 처사였다.§!"
 COU_event_kaya.42.t:0 "체육실의 축전"
 COU_event_kaya.42.desc:0 "\"총학생회장님, 아까 만나서 전하긴 했지만 경황이 없어 대충 말했던 것 같아서 모모톡으로 한번 더 쓰게 됐어. 새로운 총학생회장이 된 걸 체육실장으로서 진심으로 축하해! 연설에서 체육의 중요성을 말하는 걸 듣고 얼마나 눈물이 나던지, 체육을 무시하던 린 대행과는 다르게 카야 총학생회장이 체육의 우수성과 중요성을 알고 있는 것 같아서 정말 기뻐. 게다가 중간에 주먹밥까지 더 챙겨주다니! 정말, 이 감사를 어떻게 전해야 할 지 모르겠어.\n\n그러고보니 재무실장은 안 만나보는거야? 나는 만나고 왔는데 기분이 좋아보이진 않아서 그냥 돌아왔어. 하여간 조만간 드그렐 씨랑 같이 집무실 방문할게, 같이 사진이라도 찍자. 우리 애들이 카야 총학생회장 보고 싶어서 안달이라구.\n\n앞으로도 잘 부탁해, 총학생회장님.\n- 하이네, 오후 8시 29분에 작성.""
 COU_event_kaya.42.a:0 "카야가 웃음을 터트리며 모모톡을 읽었다."
 COU_event_kaya.43.t:0 "책임"
 COU_event_kaya.43.desc:0 "레옹 드그렐은 복도를 가로지르며 거친 숨을 내뱉었다. 구둣발굽의 소리가 총학생회의 흰 바닥을 신경질적으로 때렸다. 그는 키보토스가 통일된 이후 지난 며칠간 카야가 보인 행태에 극도의 짜증을 느꼈다. 키보토스의 지배자가 되었다고는 해도, 감히 처음부터 복종해온 자신과 협력자들의 모든 면담 요청을 묵살한 채 방안에 틀어박혀 있다니! 이건 도가 지나치지 않은가, 카야와 자신이 직접 마주본지도 이제 1년이 더 넘어간단 말이다.\n\n집무실에 다가가 문을 두드리려던 드그렐은 문이 열려 있는 것을 보고 잠깐 흠칫거렸다, 차라리 이대로 돌아가는 것이 나을까? 여자 홀로 있는 방에 감히 들어가도 되는 것이 맞는가? 하지만 문 너머로 이상하리만큼 어두운 집무실을 보자 약간의 걱정이 자라났다, 조심스레 문을 밀고 들어간 그의 눈에는 커튼이 굳게 닫혀 어두컴컴하고, 서류 더미가 바닥에 어지럽게 널린 집무실에 실 끊긴 인형처럼 의자에 앉아 초점 없는 눈으로 허공을 바라보는 카야의 모습이 보였다. 그녀를 깨우려던 그는 가까이서 본 그녀의 수척한 안색에 순간 멈칫했다. 분명 이전부터 보았던 그녀는 이렇게... 생기지 않았다. 그녀에겐 짜증나는 오만함과 자신감이 있었단 말이다.\n\n"...아주 시체라고 해도 믿겠군." 드그렐은 탁상의 스탠드를 킨 후, 정신이라도 차리게 해주려는 듯 카야의 어깨에 살며시 손을 얹었고, 일은 바로 그 찰나에 일어났다. 카야가 마치 자신의 몸에 불이라도 붙은 듯 애써 컥컥거리며 몸을 비틀기 시작한 것이다.\n\n"시라누이 총학생회장. 나요, 드그렐이란 말입니다! 대체 무슨-"\n"불, 불이..." 카야는 드그렐의 소매를 애써 잡으며 낮은 목소리로 중얼거렸다.\n"불... 너무 밝아요, 꺼줘요... 제발..." \n\n자신이 스탠드를 킨 것이 문제임을 깨달은 드그렐은 급히 스탠드의 전원을 껐다. 불빛이 사라지자 카야는 마치 물에 빠진 사람처럼 숨을 내쉬다 비틀거리며 책상을 쥐어잡고 일어서려 했지만, 다리가 풀리며 드그렐의 가슴팍을 향해 쓰러졌다, 자신을 향해 쓰러지는 카야를 본 드그렐은 자신도 모르는 순간 저절로 그녀를 받아냈다. 드그렐이 얼굴을 찌푸리며 상황을 파악하려는 동안 카야는 드그렐의 가슴팍에 얼굴을 묻은 채 꺽꺽거리며 눈물을 내보였다.\n\n"나, 난 못 해요. 이제 못 해. 난 초인이 아냐. 그녀가 아냐. 아니라고."\n\n드그렐은 자신의 품에서 젖은 눈망울로 떨고 있는, 초인을 자처하고던 소녀를 보고서야 탈출선을 찾던 자신에게 손을 내밀던 야심가가 그저 '아이'일 뿐이였다는 사실을 깨달았다. 그러자 곧 허탈함이 파도처럼 밀려왔다. 아이가 어른을 지배하고, 아이를 이끌어주어야 할 어른들이 아이를 증오하고, 두려워하고, 경외했다니! 드그렐은 그녀를 안은 채 헛웃음을 터뜨렸다. 그는 카야를 내려놓지도, 더 세게 안지도 못한 채 어둠 속에서 멍하니 웃기만 했다."
 COU_event_kaya.43.a:0 "얼마나 많은 것들이 무의미했던가."
 COU_tooltip_COU_event_kaya_43:0 "§g드그렐의 낙인은 지워지지 않을 것이다, 아이의 잔인한 유치함에 어울린 어른들에겐 무슨 책임이 있는가.§!" 
 COU_event_kaya.44.t:0 "인권보장실장과의 대면"
 COU_event_kaya.44.desc:0 "카야가 커피를 홀짝이며 맛을 보았다. 쓴 커피라 그런지 기분이 좋지 않았다. 향도 맛도 모두 탈락이었다. 마치 곧 만날 사람 같았다. 자신의 말에 대놓고 거역하는 작자가 있을 줄은 상상도 못했으니까. 그런 카야에게 화답하듯 점잖은 노크 소리가 들렸다. 카야가 조용히 들어오라고 답했다. 철컥거리며 열린 문 소리와 함께 인권보장실장, 얀 바르스가 모습을 드러냈다. 정돈된 양복을 입은 가슴에는 푸른 빛의 총학생회의 뱃지가 박혀 있었고, 잘 쓰지 않던 안경은 가슴 포켓에 끼워 둔 채였다.\n\n"인권보장실장님, 바쁘신데 불러서 죄송합니다."\n"괜찮습니다, 방위실장. 그것보다, 커피 향이 좋군요."\n"이젠 방위실장이 아니라 총학생회장 대행입니다, 실장님."\n\n말없는 침묵. 소파에 기울여 앉은 바르스는 깍지를 낀 두 손으로 아무런 말도 하지 않았다. 카야는 커피 잔을 내려놓고 아무런 말도 하지 않았다. 불편한 침묵을 깬 것은 바르스였다.\n\n"대행, 단도직입적으로 말하죠. 요즘 행정위원회 꼴이 말이 아닙니다. 알고 있기는 하나요?"\n"말이 아니라뇨? 총학생회는 그 어느 때보다도 더 평온합니다만."\n"하아... 대행. 이게 지금 뭐 하자는 겁니까? 본인에 대해 부정적인 견해를 드러내기만 하면 죄다 실종이에요! 어려서 정치를 잘 모를 수도 있지만 이건..."\n\n"하아? 지금 되게 무례한 말을 하시네요, 실장님!" 카야가 책상이 부서질 듯 쳤다. 움찔하며 그녀를 바라본 바르스는 곧이어 입을 다물었다. 카야는 품속에서 권총을 꺼내 노리쇠를 당겼다. 철컥거리는 고압적인 소리가 바르스를 압도했다. 카야는 권총을 그에게로 기울였다.\n\n"그렇죠, 실장님? 총학생회는 그 어느 때보다도 평온합니다만!"\n"아, 무, 물론이죠, 대행. 무례하게 말해 미안합니다, 사과하죠."\n\n바르스가 헛기침을 하며 업무를 핑계로 급히 자리를 피했다. 카야는 한숨을 쉬며 의자에 주저앉았다."
 COU_event_kaya.44.a:0 "\"힘드네요, 매번 이러는 것도.""
 COU_tooltip_COU_event_kaya_44:0 "§g카야가 손을 휘적거리다 대충 천장에 대고 탄을 비웠다. 한 발, 두 발, 세 발...§!"
 COU_event_kaya.45.t:0 "마땅히"
 COU_event_kaya.45.desc:0 "\"선생님들, 이 노인네가 이렇게 빕니다, 제발 멈추세요, 제 유일한 재산입니다, 제발..."\n"뭐라고? 누가 멍멍거려서 잘 모르겠는데!"\n\n협력자 완장을 찬 두 벨기에인 청년들이 깔깔거리며 시바견 수인이 운영하는 라멘 포차를 박살내고 있었다. 옆에서 훌쩍이는 노견은 아무런 것도 하지 못하고 포차가 박살나는 것을 지켜보고만 있었다. 곁을 지나가던 게헨나 출신의 학생 무리가 수인을 일으켜 세우고 청년들에게 항의했다. 부끄러운 줄 알라고, 무엇을 하고 있는 지는 알고 있냐고.\n\n"우리가 뭘 했냐고? 뭘 하긴! 우리가 마땅히 되찾아야 할 것을 되찾고 있을 뿐이다, 이 년들아! 뿔 달린거 보니 게헨나라는 사탄의 수하 같은데, 여기는 왈롱이야. 지옥이 아니라고!"\n\n서로 깔깔거리며 청년들은 무전기로 추가 '치안 유지 인력'을 요청했다. 이에 놀란 게헨나 학생들은 자리를 피해야 했고, 사람들은 마치 못 볼 꼴을 본 것처럼 자리를 피했다. 포차의 잔해 위로 엎질러진 육수가 바닥을 적셨다. 노견은 떨리는 손으로 깨진 그릇 조각을 주워 담으려 했으나, 뒤이어 도착한 군홧발에 손마저 짓눌리고 말았다. 새로이 나타난 치안 유지 인력들은 상황을 수습하는 대신 파괴된 포차의 위치가 '미관상 부적절'하다는 문서를 노인에게 들이밀었다.\n\n멀리서 이 광경을 지켜보던 행정원은 말없이 자리를 떴다. 원래라면 상부에 보고하여 이를 저지시켜야 했지만 협력자의 권한이 막강해진 지금, 저들에 눈에 났다간 좋지 못한 꼴을 볼 것이 분명하기 때문이었다."
 COU_event_kaya.45.a:0 "누군가는 환호했고, 누군가는 훌쩍였다."
 COU_event_kaya.46.t:0 "토끼와 여우"
 COU_event_kaya.46.desc:0 "\"래빗 1, 진입합니다, 래빗2, 퇴로를 확보해 주세요!"\n"라져! 조금만 기다려!"\n\n난사되는 총알들이 바닥에 수없이 나뒹굴었고, 모에의 헬리콥터가 내뿜는 미사일이 혼란을 장식하듯 터트렸다. 곳곳에 SRT의 로고가 선명히 박힌 훈련장의 벽들은 부서져 있었고, 미야코와 사키는 숨이 턱 끝까지 찼다. 그렇게 몇 분을 뛰어다녔을까, 목표하던 현장에 진입할 수 있었다. 현장의 탁상에 깨끗하게 봉인된 편지가 한 통 있었다. 조심스럽게 현장에 진입한 미야코가 떨리는 손으로 편지를 뜯었다.\n\n"서프라이즈, 래빗 1...?"\n"함정이다! 사키! 조심하ㅅ..."\n\n재빠르게 미야코의 목을 유키노가 잡아챘다. 그 앞에선 쿠루미에게 붙잡혀 끌려오는 사키가 보였다. 미야코가 한숨을 쉬며 품속에 넣어 두었던 백기를 흔들었다.\n\n"네에, 저희가 졌습니다. 항복이에요."\n"츠키유키 소대장, 포인트맨과 떨어져 혼자 다닐 땐 조심하라고 말했을 텐데."\n"사키도 마찬가지야! 후방 경계를 소홀히 하다니, 긍지 높은 SRT의 포인트맨으로서는 탈락이라구."\n"그, 그게, 미야코가 안 보여서, 마음이 급해져서..."\n\n사키가 멋쩍게 말했다. 곧이어 오토기와 니코가 모에와 함께 모습을 드러냈다. 니코는 배시시 웃으며 모에의 등을 쳐 주었다. 니코가 싸 온 유부초밥의 냄새가 훈련장에 퍼졌다. 그렇게 미유까지 한 자리에 모였다. 웃고 떠드는 소리가 울렸다. 멀리서 그 모습을 바라보는 카야는 홀로 설탕 넣은 커피를 홀짝였다."
 COU_event_kaya.46.a:0 "가장 믿음직한 학생들이었다."
 COU_event_kaya.47.t:0 "처리"
 COU_event_kaya.47.desc:0 "\"힉, 이히익! 아, 안돼, 제발... 이, 씨발, 씨발... 씨바아아알!!!"\n\n틱틱거리는 리볼버에서 고장난 쇳소리가 났다. 내부 부품이 찌그러졌던지, 혹은 과열로 어딘가 휘어 버렸을 지도 모른다. 확실한 건, 그녀는 지금 개 좆됐다는 것이다. 모든 것이 불분명하지만 그것만큼은 분명했다. 마치 그런 운명을 예감하기라도 한 듯 다급한 표정의 재무실 임원은 마구 리볼버를 두들겨 댔다. 무심하게시리 그녀의 구식 리볼버는 도통 말을 들을 생각을 하지 않았다. 노란 헤일로를 어둠 속에서 번쩍거리는 시라누이 카야가 서서히 모습을 드러냈다. 임원의 눈에 눈물이 고였다.\n\n"하아... 부탁인데, 울지 좀 마세요. 어떻게 '면담' 하신 분 모두 제 앞에서 이렇게 슬프게도 우실 수가 있으신가요, 서운하게시리. 그러시면 제가 엄청 사악한 악당인 것 같잖아요?"\n\n카야가 권총을 허리춤에서 꺼내며 말했다. 겁에 질린 임원이 리볼버를 그녀에게 집어던졌다. 고개를 돌려 리볼버를 피한 카야가 이런 우스꽝스러운 상황에 웃음을 더는 참지 못했다. 하하하하!\n\n"펠드메이어르 씨? 저 년 잡으세요."\n\n그녀의 곁을 말없이 따르고 있던 헹크 펠드메이어르가 고개를 끄덕이더니 임원의 두 팔을 잡아 무릎꿇렸다. 온 몸이 사시나무 떨듯 떨리는 임원은 카야를 바라보지 못했다. 카야는 한숨을 쉬며 그녀의 고개를 잡아 올렸다.\n\n"당신네들 때문에 모든 게 엉망이 됐어요. 네? 초인의 통치를 가로막아 키보토스를 혼란에 빠뜨리려고 드는 게, 마치 간첩... 이랄까요? 음, 네, 아무래도, 당신네들은 간첩이 맞는 것 같아요. 모든 사람이 다."\n"아, 아냐... 우리들은 단지 너가 제정신이 아닌 것 같아서..."\n"후후... 그런가요, 간첩 씨?""
 COU_event_kaya.47.a:0 "카야가 권총의 방아쇠를 당겼다. 펠드메이어르는 고개를 숙였다."
 COU_tooltip_COU_event_kaya_47:0 "§g임원의 헤일로가 꺼질 때까지 계속해서 노리쇠를 당겼다.§!"
 COU_event_kaya.48.t:0 "낮잠"
 COU_event_kaya.48.desc:0 "커튼 사이로 스며든 미지근한 햇살이 눈꺼풀을 간질였다. 서류 더미를 베개 삼아 잠시 청한 휴식은 달콤해야 마땅했다. 꿈속에서 카야는 여전히 승리자였다. 완벽한 초인이며 시스템의 지배자였다. 그녀의 발 밑에는 초인에게 굴복한 자들이 줄을 지어 서 있었고, 키보토스의 모든 톱니바퀴는 카야의 손끝 하나에 정교하게 맞물려 돌아가고 있었다. 하지만 어느 순간, 소리가 사라졌다. 군화가 바닥을 울리는 소리, 펜촉이 종이를 긁는 소리, 경외에 찬 찬사들이 마치 진공상태에 빠진 것처럼 먹먹해졌다. 고개를 들어 주위를 둘러보자, 집무실의 화려한 벽면들이 소리 없이 녹아내리고 있었다.\n\n"... 어라?"\n\n카야가 당황해 일어서려 했지만 그녀의 발이 움직이지 않았다. 아래엔 카야의 구두를 적시고 있는 검고 끈적한 잉크가 있었다. 그녀가 휘갈겼던 서명들이 종이 밖으로 기어나와 그녀의 발목을 붙잡고 있었다. 그 잉크의 늪 속에서, 이름없는 자들이 얼굴을 내밀었다. 그녀를 원망하지 않았다. 그저 표정 없는 눈으로 카야를 응시하며, 카야의 몸을 서서히 바닥으로 끌어내리고 있었다.\n\n"대행, 이것이 정말 '초인'인 건가?"\n"너가 생각해도 웃기지 않아?"\n"완벽하다고? 천만에. 다 너만을 위한 거대한 서커스 연극일 뿐이지."\n\n환청 같은 목소리가 머릿속을 울렸다. 카야가 비명을 지르려 했지만 입안에서도 씁쓸한 잉크 맛이 느껴졌다. 멀리서 총학생회장의 뒷모습이 보였다. 그녀는 필사적으로 손을 뻗었다.\n\n"선배님, 보셨나요? 제가 해냈어요. 초인인 제가- 초인인 당신보다 더 완벽하게..."\n\n총학생회장이 갑자기 웃음을 터트렸다. 녹아내리는 총학생회장에겐 얼굴이 없었다. 매끄러운 달걀 같은 얼굴이 카야를 응시하고 있었다.\n\n그리고 카야는 거친 숨을 몰아쉬며 상체를 일으켰다. 뺨에는 서류 자국이 선명하게 남았고, 셔츠는 식은땀으로 축축하게 젖어 있었다. 집무실은 고요했다. 아무도 없었다. 창밖의 풍경도, 책상 위의 권총도 그대로였다. 모든 것은 초인의 통치 하에 있었다. 안도의 한숨을 내쉰 그녀가 손으로 커피잔을 잡으려다 멈칫했다.\n\n만약에... 자신이 초인이 아니라면?"
 COU_event_kaya.48.a:0 "그녀는 그런 기분 나쁜 상상은 그만하기로 했다."
 COU_tooltip_COU_event_kaya_48:0 "§g카야가 구축한 질서는 완벽할 것이다. 키보토스를 구할 것이고, 더 나아가 세계를 구할 것이며, 그녀는 백마 탄 공주님처럼 모두를 구할 것이다.§!\n§R그녀가 무너지지만 않는다면.§!"
 COU_event_kaya.49.t:0 "예스우먼"
 COU_event_kaya.49.desc:0 "세상이 뒤집혀도 총학생회에서 정기 회의는 열린다. 그리고 그것은 카야 대행의 취임 이후에서도 꾸준하게 열렸던 것이지만, 대행 취임 초반의 분위기와는 사뭇 달랐다. 초반에는 여러 임원들이 카야의 행정 실수를 지목하고 카야의 행정명령 일부를 저지하는 등 그래도 무언가는 돌아가고 있었다. 하지만 최근, 더는 그렇지 않았다. 물밑에서 꾸준하게 벌어진 숙청은 행정위원회를 카야의 멋들어진 들러리로 만들었으며 정당성을 위해 비효율적인 체제를 유지하는 원인으로서 지목되는 수모를 겪고 있었다.\n\n이번 회의는 방위군의 재무장에 관련한 사안이었다. 아오이가 짧게 예산 편성에 관한 의결을 마친 후 자리에 앉았다. 그리고 그녀가 자리에 앉자마자 하이네가 슬쩍 다가가 어깨를 잡으며 물었다.\n\n"저기, 아오이 선배. 혹시 남는 주먹밥 있어? 이번 회의도 길어지네."\n"미안하지만 없어, 하이네. 스모모한테 물어보는건 어때."\n"스모모 건 이미 내가 먹었단 말이야."\n\n하이네가 눈을 굴리며 말했다. 아오이는 한숨을 쉬었다. 마치 못 볼 꼴을 본 것만 같았다.\n\n"... 네, 이번 방위군 훈련 예산 추가 집행에 관한 의결을 시작하겠습니다."\n"아, 스모모, 일어나. 의결한다."\n\n여느때처럼 하이네와 스모모는 찬성에 의결했다. 아오이는 안건이 적힌 종이를 말없이 쳐다보다가 한참이 지나서야 찬성에 의결했다. 카야는 실눈으로 그녀들을 바라보고 있었다."
 COU_event_kaya.49.a:0 "초인만이 그 광경을 즐기고 있었다."
 COU_event_kaya.50.t:0 "충성 논쟁: 새벽 두 시"
 COU_event_kaya.50.desc:0 "왁자지껄한 코르트레이크의 한 술집, 드그렐은 치안 담당원들을 위해 담당원 전부에게 맥주 한 잔씩을 돌렸다. 프랑스인, 벨기에인, 네덜란드인, 독일인, 여러 사람들이 모여 있었지만 그들은 가능한 한 일본어로 소통했으며 가슴에는 푸른 빛의 협력자 핀 뱃지를 달고 있었다. 드그렐이 취기에 의자에 올라서서 옛날처럼 연설을 하자 모두가 웃으며 박수를 쳤다. 술에 쩔은 박수갈채가 끝나고, 시간은 어느덧 새벽을 향했기에 이들은 그만 해산하기로 했다.\n\n드그렐은 그의 새로운 친구인 펠드메이어르와 함께 딸꾹거리며 거리를 누볐다. 드그렐이 속이 좋지 않은 듯 헛구역질을 하자 펠드메이어르가 구석에서 그의 등을 토닥여 주었다. 드그렐은 거의 1분동안 토를 했다. 평소보다 많이 마셔서 그런 듯 했다.\n\n"이 친구, 술 잘 마신다더니. 다 개뻥이구만!"\n"어으, 오늘은 너무 달렸나..."\n"아, 드그렐. 이번 건, 확실히 카야에게 들키지 않는 것 맞지? 들켰다간, 우리 모두 뼈를 못 추릴 것 같아서 말이지."\n"펠드메이어르, 지금 날 뭘로 보고 그러나? 난 협력자의 우두머리라고, 엉? 그래, 나는 심문관이라고. 심문관 말이야, 심문관. 크로노스에서 붙여준 내 멋진 별명! 내가 장담하건데, 저어어얼대 들키지 않아."\n\n평소엔 연설할때나 나오곤 하던 과장된 드그렐의 몸짓에 펠드메이어르가 짧게 웃음을 터트렸다. 하지만 곧이어 품 속에서 전자담배를 꺼낸 펠드메이어르가 조용히 담배를 피웠다. 그리고 취기에 겨우 말을 꺼낸 듯, 진지한 말투로 그에게 물었다.\n\n"... 드그렐, 내가 이런 말 하기엔 좀 그렇다는 건 알고 있지만, 계속 이렇게 살 생각인가.""
 COU_event_kaya.50.a:0 "\"고작 애한테 붙들려서, 맘 편히 술도 못 마시는 삶 말이야.""
 COU_event_kaya.51.t:0 "충성 논쟁: 새벽 세 시"
 COU_event_kaya.51.desc:0 "\"하하, 펠드메이어르. 술에 취한 김에 충성심 테스트를 하려고 들다니. 자네도 참 짓궂군."\n"아냐, 드그렐. 이건 그런 시시한 농담따먹기 같은게 아니라고. 혹여나 진지하게 생각은 해 봤는가? 내가 말한... 것에 대해서."\n\n똑바로 바로잡힌 드그렐의 눈이 펠드메이어르를 향했다. 펠드메이어르의 열린 주머니에서 헤일로를 최소한의 탄으로 파괴할 수 있다고 '여겨졌던' 은탄이 번쩍였다. 드그렐이 피식 웃었다. 턱을 괴고 오래간만에 옛날 생각을 해 보았다. 대전이 당시 죽기 살기로 헤일로 달린 여자애들에게 달려들던 한심한 자신의 모습을, 이계의 사탄들에게 대항하자는 연설을 끝마치고 내려오던, 멍청하기 짝이 없던 시절의 모습을.\n\n"펠드메이어르, 독일의 소란을 들어 본 적 있는가. 나치당과 독일에 충성하던 사람들은 기회도 없이 모두 다 세상을 떠났지. 자신이 이십 년, 혹은 그 이상 넘게 좇던 이상과 꿈에는 전혀 상관없이, '헤일로 달린 악마 새끼'들한테 모조리 짓밟혀서 죽었단 말이야."\n"게다가 독일인들은 기회도 없었어. 맞서 싸우던 친구는 물론이고 협상을 구걸하던 친구마저 다 죽었지. 그리고선 키보토스인들이 뭐라고 말했는지 아나? 고작 총에 사람이 죽을 줄 몰랐댄다. 웃기지 않나?"\n\n펠드메이어르가 담배연기를 내뿜었다. 유난히 더 짙어 보였다.\n\n"우리는 그런 살육의 현장에서 기회를 잡은 걸세, 펠드메이어르. 자네도 알지 않나. 나는 벨기에를 구하기 위해서 기회를 잡았지. 벨기에인들이 무의미하게 죽는 걸 바라볼 수 있는 애국자는 없으니까."\n"그러니 그런 생각은 그만두는게 좋을 거야. 카야 말고는 그 누가 우리에게 손을 내밀었겠는가? 총학생회장이라는 작자도 왕실을 다 쏴죽였는데."\n\n펠드메이어르는 담배를 피우며 한동안 말을 하지 못했다. 깊은 생각에 잠겨 있는 것 같아서, 드그렐도 곁에서 눈을 감고 어둠을 보았다. 드그렐은 탈출선을 잡았다. 하지만 그 다음은 자세히 생각해본 적은 없었다."
 COU_event_kaya.51.a:0 "그저 살아 있음에 만족했다."
 COU_tooltip_COU_event_kaya_51:0 "§g\"그래, 들어보니 자네 말도 틀리진 않네." 펠드메이어르는 드그렐의 어깨를 툭툭 치고는 자리를 떠났다. 드그렐은 남아 있던 담배 한 갑을 다 피웠다.§!"
 COU_event_kaya.52.t:0 "좋아하는 것"
 COU_event_kaya.52.desc:0 "요즘 업무에 열중하고 있는 카야는 건드렸다간 그 누구도 무사하지 못할 거라는 농담이 유행하고 있었다. 그 농담을 바로 앞에서 하다가 그녀에게 딱 걸린 어느 부족한 행정원을 통해서 알게 된 사실이고는 했다. 카야는 물론 그 말에 아무렴 신경을 쓰지 않았지만, 어째 자신이 그렇게 무서운가 싶기도 했다. 고상한 자세로 앉아 있던 카야는 호기심에 짙게 깐 목소리로 바깥의 행정원을 불러 보았다.\n\n"흠흠, 저기요? 들어와주시지 않겠나요?"\n"네, 네엡!"\n\n달칵거리는 문 소리, 그리고 잔뜩 상기되어 보이는 행정원이 모습을 드러냈다. 이번 주에는 그녀가 그녀의 곁을 지킬 모양이었다. 카야는 일주일동안 볼 사람이니 친해지는 것도 나쁘진 않겠다고 생각해 보았다.\n\n"평소 주말엔 뭘 하시나요?"\n"주, 주주주주 주말에요...? 저, 저느은..."\n\n뭐야, 이 여자 왜 이래?\n\n"무언가 말 못할 취미인가요? 그런 재미있는 취미도 저는 있는데 말이죠."\n"아, 아뇨, 그런게 아니라, 그..."\n"저는 주말에 근처 모모프렌즈 캐릭터 샵에 가서, 그... 구경하고 오곤 해요."\n"상품을 사진 않나요? 아이쇼핑, 그런 건가요?"\n"아, 아뇨. 사고 싶어도, 들어온 지 얼마 안 되다 보니 월급이 쪼달려서요... 아하하."\n\n카야는 피식 웃어 보였다. 돌아앉아 창밖을 보았다. 평일임에도 대문짝만한 모모프렌즈의 로고가 걸려 있는 가게에 여자아이들이 많이 있었다. 카야는 주머니에서 카드를 꺼내 책상에 올렸다.\n\n"필요하시면 쓰세요. 저는 돈 쓰는 일이 크게 없어서.""
 COU_event_kaya.52.a:0 "\"좋아하는 건, 가질 수 있어야 하니까요.""
 COU_tooltip_COU_event_kaya_52:0 "§g"네, 네네네네네네엣?" 같은 얼빠진 소리나 하는 행정원을 카야는 괜찮다고, 가져가라고 손짓하며 말했다. 연신 허리를 숙이는 행정원을 보고 카야는 오래간만에 재미있다고 생각했다.§!"
 COU_event_kaya.53.t:0 "여우와 커피 한 잔"
 COU_event_kaya.53.desc:0 "비밀스럽다면 비밀스럽다고 볼 수 있는 D.U. 구시가지의 오래된 카페. 고령의 부엉이 수인이 운영하는 이 작은 카페는 아는 사람들만 즐기는 작은, 자신만의 카페 같은 느낌이었다. 그리고 카페의 구석 자리 근처에서 귀를 바짝 내민 폭스 소대원들이 모습을 드러냈다.\n\n"음, 유키노 쨩, 여기가 맞아?"\n"쉿, 폭스 2. 조금만 기다리면 대행이 모습을-"\n"... 이 카페는 처음 오시나 보네요?"\n\n깜짝 놀란 듯 물러선 유키노에게 사복과 선글라스를 낀 카야가 킥킥거리며 얕게 웃었다. 이전의 대행이라면 이런 모습은 보이지 않았을 거라고 유키노는 생각해 보았다. 하지만 그건 지금 중요한 게 아니었다. 폭스 소대는 중요한 거래를 하러 이곳에 왔다. 무산된다면 폭스 소대도, SRT도, 소중한 후배들도... 전부 끝이었다.\n\n"대행, 사복 입은 건 처음 보네."\n"후후, 그런가요? 하기야, 전 사복을 잘 입진 않으니까요."\n"그래서, 우릴 감옥에서 꺼내 준 이유는 있겠지."\n"네, 물론이죠. 그걸 하러 여기 오신 거잖아요?"\n\n카야가 유키노에게 짙은 블랙 커피 한 잔을 권했다. 유키노는 쓴 블랙 커피 같은 사치품을 즐겨 마시진 않았지만 조심스럽게 잔을 들어 검은색 커피를 목구멍으로 밀어 넣었다. 어쩌면 필사적이었다.\n\n"정말로... 행정위원회에 사보타주를 벌이면 SRT의 안위를 보장받을 수 있는 건가."\n"물론이죠, 유키노. 당신같은 믿음직한 사람들은 그에 상응하는 대가를 받아야 합니다."\n"하지만 분명 SRT의 소대인 우리가 사보타주를 벌인다면, 행정위원회가 SRT를 폐교하려고 들 텐데."\n"하, 뭔가 했더니. 그런 시시한 것에 연연하시는 건가요?"\n"시시하다니, 대행. 이건 대단히 중요한-"\n\n카야가 헛기침을 하더니 조용히 손뼉을 쳤다. 그러자 곳곳에서 붉은 완장을 찬 사내들이 고개를 끄덕이며 그녀들을 응시했다.\n\n"당신네들은, 아무런 것도 한 게 없을 겁니다."\n"상식적으로 생각해 보세요. 감옥에 있는 '극악무도한 범죄자'들이, 어떻게 테러를 벌이나요?""
 COU_event_kaya.53.a:0 "\"그러니, 당신네들은 아무런 걱정 하지 않아도 됩니다. '초인'을, '어른'을... 믿어 주세요.""
 COU_tooltip_COU_event_kaya_53:0 "§g곁에서 저격총을 만지작거리던 오토기가 불안한 눈빛으로 니코를 쳐다보았다. 니코는 근처에 주저앉아 휴대폰을 들여다보고 있었다. 마치 자신은 아무런 것도 듣지 못했다고 말하는 것처럼.§!"
 COU_event_kaya.54.t:0 "저녁 만찬"
 COU_event_kaya.54.desc:0 "\"오늘 이 저녁 만찬에 참석해 주신 숙녀 신사 여러분, 환영합니다!"\n\n멋들어진 외모에 정갈한 정장을 입은 MC가 장난스러운 표정으로 무대에서 인사를 올렸다. 자리에는 잔뜩 소녀스러운 감성으로 그에게 환호하는 행정원들과 임원들, 여자들이 차고 넘치는 자리에 기뻐하는 협력자들, 그리고 고고하게 가운데 자리를 차지한 카야가 있었다. 커피 말고 샴페인을 마시려니 어색하긴 했지만, 이런 기쁜 자리에는 샴페인 한 병은 따 줘야 어른들의 예의라는 드그렐의 말에 어쩔 수 없이 마셨다.\n\n확실히 그녀는 블랙 커피가 더 나았다. 그래도 뭐, 이따금씩 분위기에 취해 보는 것도 나쁘지 않겠다고 생각하며 마셔 보았다. MC는 이리저리 뛰어다니며 말을 이었다. 소녀스러운 외침과 담배에 쩔은 낮은 목소리가 뒤섞여 시끄러웠다. 카야는 분명히 즐겁다고 생각하고 있었다.\n\n그래, 그렇다고 생각하고 있었다. 마음 어디선가 불편한 기색이 가시질 않았다. 판은 더이상 수습할 수 없을 만큼 커졌고, 이제 진짜 '초인'인 그녀에게 모든 것이 달렸다. 이렇게 부담스러운 일을 맡아 본 적이 있었던가? 린 대행도 이런 기분이었을까? 총학생회장, 그녀도... 이런 기분이었을까? 카야는 샴페인을 삼키며 오묘한 표정을 지었다.\n\n근신 명령에 집무실에 틀어박혀 책만 읽던 그 시절을 생각해 보았다. 정말 많은 책들을 읽었었다. 어떻게 행동해야 권위를 세울 수 있는지, 어떻게 해야 사람을 설득하고 자기 편을 만들 수 있으며 완벽한 통치를 완성할 수 있는지 설명하던 수도 없이 많은 철학자들과 사상가들이 스쳐 지나갔다.\n\n의미 없이 느껴졌다. 그 사람들은 마치 무언가 부족하다는 불안감에 휩싸였을 때 어떻게 해야 할 지 알려주지 않았다. 카야는 그녀 스스로 이 감정을 무엇이라고 규정하며 설명해야 했다."
 COU_event_kaya.54.a:0 "너무나 어려운 일처럼 느껴졌다."
 COU_tooltip_COU_event_kaya_54:0 "§g그녀는 조용히 자리에서 일어서 비번실로 들어갔다. 좁은 비번실에 몸을 눕혀 억지로 잠을 청했다. 꿈 속에서라도 답을 얻고 싶었다.\n... 하지만 꿈 속에서는 영원히 답을 찾을 수 없을 것이다. 린 대행도, 총학생회장도, 카야도 모두.§!"
 
 
 
 
