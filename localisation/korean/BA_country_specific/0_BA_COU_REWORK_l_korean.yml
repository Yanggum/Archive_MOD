 COU_focus_wonderweapons:0 "A.N.T.I.O.C.H. 프로젝트 재추진"
 COU_focus_wonderweapons_desc:0 "시치도 유키노가 회수한 A.N.T.I.O.C.H. 프로젝트의 유산인 탄도미사일용 열압력탄 탄두는 대전이 이후 새로운 세계를 보전하고 유출될 경우 대전이와 중첩되어 불러올 막대한 혼란을 방지하기 위해 폐기 처리되었습니다만, 상황이 우리에게 점차 불리하지 않게 흘러갈 것이 분명하기 때문에 우리는 좀 더 '온건한 방법'으로 A.N.T.I.O.C.H. 프로젝트를 재추진할 것입니다."
 COU_establish_spa:0 "폭스 소대 사면"
