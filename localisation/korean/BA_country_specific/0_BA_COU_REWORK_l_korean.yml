 COU_perfidus_gui_txt1:0 "페르피두스로 인한 현재 효과:"
 COU_perfidus_gui_txt2:0 "동원 속도 [?COU_Perfidus_ms|%+1]\n사단 조직력 [?COU_Perfidus_aof|%+1]\n모병 가능 인구 변동치 [?COU_Perfidus_cf|%+1]\n안정도 [?COU_Perfidus_sta|%+1]\n생산 효율 한도 [?COU_Perfidus_fmef|%+1]\n순응도 증가 속도 [?COU_Perfidus_cg|%+1]\n훈련 시간 [?COU_Perfidus_ttf|%+1]"
 COU_perfidus_happy_yay:0 "페르피두스들이 §G만족§!했습니다."
 
 COU_collaboraters_wants_political_money:0 "정기적인 특혜 요구"
 COU_collaboraters_wants_political_money_desc:0 "페르피두스들은 우리에게 협력하지만 또 공짜로 일할 생각은 없습니다, 물론 그들 거의 전체가 기회주의자들이라 그러한 면도 있지만 그들이 담당하는 방위실과 발키리 대신의 '치안출동'과 같은 임무들에는 분명히 희생이 강요되기 때문입니다. 그렇기에 그들은 정기적으로 우리에게 특혜, 즉 자금 혹은 정치적인 지원을 요구합니다. 그들에게 제때 요구를 충족시켜 준다면 문제가 없겠지만, 그렇지 않는다면 그들은 '덜 열심히' 우리를 위해 일할 것입니다."
