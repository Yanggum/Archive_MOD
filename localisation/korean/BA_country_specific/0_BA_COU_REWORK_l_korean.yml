 COU_focus_lock_the_kronous: "크로노스 통제"
 COU_focus_lock_the_kronous_desc: ""
 COU_focus_establish_humans_rights: "인권보장실 승격"
 COU_focus_establish_humans_rights_desc: "인권보장실은 1935년 대전이 이후 임시 부서로서 설립되었고, 우리에게로 전향한 파시스트 얀 바르스의 주도 아래 기존의 11개의 부서와 대등한 위치에 설 수 있을 정도로 행정위원회 내 세력을 키웠습니다. 그러하므로 인권보장실을 승격하여 11개의 부서와 거의 대등한 위치에 올려놓는 것은 우리의 통치에 필요한 일임이 틀림없습니다."
 COU_focus_stop_our_deals: "거래 중단"
 COU_focus_stop_our_deals_desc: ""
 #COU_focus_take_their_money: "자금 압류"
 COU_focus_treay_of_amsterdam: "암스테르담 선언"
 COU_focus_treay_of_amsterdam_desc: "크로노스 자치구와 하이랜더 자치구만이 부각되어 잊혀졌던 존재인 플란데런과 북프랑스의 현지인들은 저지대 중심적인 행정위원회의 처사에 대해 오랜 시간 투쟁을 이어갔고, 우리는 그들의 합당한 의견을 수용해 이곳을 발전하고 개발할 의무를 져야 할 것입니다."
 COU_shaking_royalty: "충성심 뒤흔들기"
 COU_shaking_royalty_desc: "총학생회 곳곳의 자칭 '애국자'들은 '아직까지도' 우리를 침략자로 여기고 있습니다만, 그 얄량한 충성심이 과연 언제까지고 지속될 수 있을까요? 그들에게 맛좋은 고기 한 덩이만 던져 준다면 그 얄팍하기 그지없는 기회주의자들은 곧 우리 편이 될 것입니다."
 COU_give_power_to_degrelle: "드그렐 진급"
 COU_give_power_to_degrelle_desc: "판이 바뀌었다는 것을 알려주는 가장 좋은 방법은 보기 좋은 '본보기'를 보이는 것입니다. 우리에게 충성적인 레옹 드그렐을 본보기로 삼아 그에게 더 많은 권력과 혜택을 제공함으로서 우리는 협력자의 규모를 늘려 현지인들과의 조화에 신경쓸 수 있을 것입니다."
 COU_keep_our_deals: "거래 지속"
 COU_keep_our_deals_desc: ""
 COU_focus_buy_their_weapon: "불법화기 밀매"
 COU_focus_buy_their_weapon_desc: ""
 COU_reduction_of_administrative_committee_authority: "자유 장교단 무력화"
 COU_reduction_of_administrative_committee_authority_desc: "저지대 전쟁 이후 본토에 잔류한 적국의 장교들은 자유 장교단이라는 조직을 꾸려 우리에게 피해를 주었으나 더 이상 이러한 피해를 감내할 수 없습니다. 이들을 이간질하고 파괴해 완벽히 무력화시켜야만 합니다."
 
