 ##애매 
 COU_event.8.t:0 "국제연맹 참관위원회"
 COU_event.8.desc:0 "D.U.의 빛나는 건물들 사이로 총회가 파견한 대표단들이 조심스럽게 발걸음을 옮겼다. 주로 대전이에 영향을 받지 않았던 미국인과 멕시코인을 중심으로 꾸려진 국제연맹 참관위원회는 총학생회가 특별히 발급한 권한을 표시하는 견장을 착용한 것이 특징이었다. 이들이 결코 불가능했으리라 생각한 이계와의 접촉은 의외의 방향으로 성사되었다. 행정위원회가 먼저 그들에게 손을 내밀었다. 뜻밖이었지만, 이들을 '감시' 할 당위성은 충분했기 때문에 만장일치로 참관위원회를 구성하는 안이 통과되었다. 물론 망명정부들과 유럽 국가들은 이를 탐탁치 않게 생각했지만, 그래도 무엇이라도 알아내야 한다는 무언의 의무감 속에서 찬성표를 던졌다.\n\n"아, 우트나피쉬팀 특구에 오신 것을 환영합니다, 여러분!"\n\n행정위원회가 파견한 행정원이 살갑게 그들을 맞이했다. 참관위원회는 D.U.의 고층 유리 빌딩과 곳곳에 산재한 수인, 그리고 여학생밖에 없는 길거리를 보고 당혹스러워 하던 차였다. 망명자들로부터 그러한 이야기는 들었지만, 그것을 사실로 목도하니 충격이 클 수 밖에 없었다.\n\n"이곳의 이름이 우트나피쉬팀 특구인가요? 제가 아는 우트나피쉬팀은 고대 슈루팍의 왕인데, 그것과 연관이 있을지..."\n"네? 슈루... 에?"\n"아, 아닙니다, 우연의 일치인 모양이군요..."\n"하지만 우연의 일치라기엔 이자들 모두 어느 정도 우리가 알아들을 수 있는 언어를 구사합니다. 굉장히 다양한 언어의 혼합이긴 하지만요."\n"흠, 이들이 어디서 왔는지는 몰라도, 분명 평행 세계의 지구임은 틀림없을 것 같습니다. 그렇지 않고서야..."\n\n대표단 사이의 학자들이 국적을 가리지 않고 각자의 의견을 늘어놓았다. 통역사들은 숨이 찰 정도로 말해야 했고, 행정원은 그들을 멋쩍게 바라볼 뿐이었다."
 COU_event.8.a:0 ""여러분들... 슬슬 가셔야 하는데...""
 COU_tooltip_event_7:0 "§g국제연맹 참관위원회는 2년을 이곳에 머물 것입니다. 물론 우리의 기술을 훔쳐 가지는 못합니다. 단지 키보토스의 일상이 어떤지 관광을 하는 것이 전부겠지요.§!"
 COU_event.9.t:0 "회복된 학생회의 권위"
 COU_event.9.desc:0 "대전이 이후 1년간 지속된 행정 혼란이 이제 어느 정도 멎어들었습니다. 각 학원은 자체적인 군대와 치안 유지를 통해 우리의 통제 없이도 대전이 전과 다름없는 상태를 유지할 수 있음을 증명했으며 총학생회는 국가의 형태로 재편되는 시간을 가졌습니다. 행정 혼란이 지속될 당시에는 잠시 잊혀졌을 지는 몰라도 학생회가 다시 상태를 가다듬으면서 학생회의 권위와 영향력이 다시 영향을 발휘하기 시작했습니다. 물론, 대전이 전보다는 한참이나 미약하지만요.\n\n그렇지만 이것은 대전이 이후의 학생회에게 있어 행운이라고 할 수 있습니다. 키보토스의 학생들에게 학생회가 온전함을 증명했고, 이제 우리는 다시 키보토스에 영향력을 발휘하고 통제를 회복하기 위해 최선을 다하는 일만 남았으니까요."
 COU_event.9.a:0 "만세!"
 COU_event.11.t:0 "마지막 헌화"
 COU_event.11.desc:0 ""미야코, 벌써 한 시간 째야. 슬슬 가자."\n"네, 금방 갈게요."\n\n미야코가 작은 빨간 튤립 하나를 조심스럽게 올렸다. 이번은 다섯 번째 방문이었다. 처음에는 부끄러운 마음에 무엇 하나 제대로 보지 못했었지만, 그래도 시간이 지나며 점차 익숙해졌다. 파도가 철썩이는 옛 암스테르담의 향기가 남은 곳, 바닷가의 비린내가 미야코의 코를 간질였다. 오라녀나사우 가문의 문장이 새겨진 돌은 묵묵히 그 꽃을 받았다.\n\n"이번이 아마도 마지막 방문이 될 것 같아요. 나중에도 가능하다면 오기야 하겠지만... 남는 시간이 별로 없네요, 아하하."\n멋쩍은 웃음, 미야코는 곁에서 그녀를 걱정스럽게 바라보는 사키를 의식한 듯 웃었다.\n\n그날의 일은 그들이 아니었더라도 누군가에 의해 일어났을 필연이었을지도 모른다. 이제야 비로소 그녀들은 고인을 마음속에 묻기로 했다. 이젠 이해할 수 있었다. 어쩔 수 없는 일이었다. 고인에게 해줄 수 있는 예우는 그저 잊지 않는 것이 최선이라는 것에 마지막 인사를 건네기로 한 것이다.\n\n"언젠가 한번 만나뵈었으면 좋겠네요. 좋으신 분들이었던 것 같은데."\n\n짧게 혼잣말로 무어라 중얼거리던 미야코는 곧이어 들려오는 모에의 재촉에 발걸음을 옮겼다. 곁을 지키던 사키와 미유도 각자의 마지막 인사를 한 뒤 미야코를 따라나섰다."
 COU_event.11.a:0 "고인에게 명복을." 
 COU_event.12.t:0 "동물들은 동물원으로 돌아가라 운동"
 COU_event.12.desc:0 "키보토스에는 수많은 종족들이 함께 살고 있었습니다. 키보토스에서는 참새 수인이 밥집을 운영하고 강아지 수인이 경찰을 하는 것 정도야 어색하지 않은 일이었습니다. 하지만 대전이 이후 맞이한 새로운 세계는 그러한 개념을 익히지 못했고, 곧 사회적인 이슈가 되었습니다. 여기서 비롯된 수인 차별 운동, 동물들은 동물원으로 돌아가라 운동은 새로운 경쟁자들에게 위협받기 시작한 현지인 자영업자들을 중심으로 일종의 유행처럼 번지고 있습니다.\n\n특히 최근 참새정 프랜차이즈 지점이 뢰번과 됭케르크에 새로운 지점을 내었는데, 기존의 현지인 자영업자들이 철 몽둥이 등 기타 여러 폭력적인 수단으로 수인들에게 피해를 입혔습니다. 이 사건 이후 수인 자영업자들은 남부에 새로운 점포를 내는 것이 두려워 할 수 없다면서 행정위원회에 대책을 촉구했습니다.\n\n협력자들은 치안 병력을 활용해 일시적으로 이런 추태를 제지시켰으나 드그렐이 수인에 관련한 언급을 금지했을 정도로 협력자 내부에서도 이에 관련한 사안은 뜨거운 화제입니다."
 COU_event.12.a:0 "어쩔 수 없는 일인가?"
 COU_event.13.t:0 "용역부 대금 문제"
 COU_event.13.desc:0 "대전이로 인한 전후 복구 과정에서 행정위원회에게 대규모로 고용되어 동원된 용역부원들은 비록 침수 문제는 현실적인 여건으로 해결하지 못했지만 암스테르담 시가전으로 파괴된 D.U.를 재건하는데 혁혁한 역할을 완수했습니다. 그리고 정확히 1년이 지난 오늘, 당시 고용된 용역부원들 중 대금을 받지 못한 이들이 있고, 이들 중 대표로 행정위원회에 방문한 한 용역반장은 행정위원회가 미지급한 2억 5천만 엔을 보상하라는 내용의 난동을 피우는 일이 있었습니다. 재무실 임원은 분노에 찬 용역반장을 돌려보내느라 꽤나 애를 쓴 것 같습니다.\n\n재무실은 D.U. 복구를 위해 용역부원 10000여명을 고용했었음을 분명히 함과 동시에 이들에 대한 대금 지급은 이미 1935년 12월 27일부로 모두 완료되었다고 해명했으며 이들이 없는 돈을 받아내기 위해 사기를 치고 있다는 주장을 고수했습니다.\n\n이들에게 대금을 지급하는 것에 대한 안건이 상정되었으나 행정위원회는 요구 묵살에 대한 의견 일치를 보였습니다. 만일 우리가 그들에게 대금을 지급하지 않는다면 일시적이더라도 용역부원의 고용에 차질이 생길 것은 분명합니다만, 대금을 지급한다면 예상치 못한 긴축의 피해가 닥칠 것입니다."
 COU_event.13.a:0 "없는 돈을 달라고 하면 안 되지."
 COU_event.13.b:0 "후환을 남기지 말자."
 COU_event.14.t:0 "폭스 소대 공판"
 COU_event.14.desc:0 "대전이 이후 SRT의 소대들이 네덜란드 왕실을 학살한 혐의로 1935년 12월부터 재판이 진행되고 있었습니다. 현지인 판사 세 명과 키보토스인 판사 두 명으로 이루어진 이 공판에서 총학생회는 이들의 무고를 바랬고 군주주의자들은 이들의 무조건적인 사형을 바랬으며 다른 이들은 그저 이 귀찮은 재판이 끝나 뉴스 칸의 자리를 그만 차지하길 바랬습니다. 그러나 여러모로 복잡한 이 공판은 새해를 넘어 진행되던 탓에 여론의 성난 물길에 서두르듯 마무리되었습니다. 구속 수사로 묶여 있던 폭스 소대원들은 마지막으로 법정에 출석해 증언했으며 이 학살은 전적으로 자신들에 의해 주도되었으며 후배들인 래빗 소대의 잘못은 하나도 없다며 마지막 증언을 마쳤습니다.\n\n날카로운 눈매를 한 독일계 검사는 이웃나라 룩셈부르크의 비극적인 사례를 또다른 예시로 들며 이들에게 자비란 또다른 학살의 명분이라고 비난했으며 아무도 변호를 맡고 싶어하지 않아 선임된 국선 변호사들은 그저 묵묵히 앉아 자리만 지킬 뿐이었습니다. 결과는 정해져 있던 것과 마찬가지였습니다.\n\n결과는 모든 폭스 소대원들에 대한 무기징역형이었습니다. 그러나 현명하게도 법원은 행정위원회가 이들의 특별 사면에 대해 만장일치로 동의할 경우 언제던지 형을 무효화시킬 수 있도록 조치함으로서 약간 아쉬운 결과이긴 하지만 양 측 사이의 긴장에서의 훌륭한 타협을 이끌어냈습니다."
 COU_event.14.a:0 "완전한 손실은 아니군."
 COU_event.15.t:0 "백합꽃"
 COU_event.15.desc:0 "뤼시앵 리페르트가 행정위원회를 방문했을 때의 일이다. 총학생회의 로고를 수선한 군 정모를 깊게 눌러쓴 그는 여자 아이들밖에 없는 행정위원회를 지날때마다 이유모를 소름끼침에 전율했다. 이계의 존재인 키보토스에게 협력하는 것이 최선의 방법이라고 생각했고 또 변치 않을 생각이지만, 그래도 이런 건 도통 익숙해지지가 않았다.\n\n리페르트가 진흙 묻은 군화로 복도를 지나자 그를 경멸하듯 바라보는 눈길이 그를 스쳤다. 하기야, 이런 정치인 따라하는 것 밖엔 해보지 않은 여자아이들이 혹독한 군 생활이라는 걸 알겠는가, 불쾌하기 짝이 없긴 했지만.\n\n피로를 느끼던 그는 근처의 비번실에서 잠깐 휴식을 취하기로 했다. 리페르트는 가죽 자켓의 품에서 작은 수첩을 꺼냈다. 일본어 단어가 적힌 단어장이었다. 이번에도 또 어눌한 일본어로 보고했다간 자신보다 어린 여자아이들에게 까이는 수모를 또 겪게 될 것이었다. 그는 천천히 비번실의 문을 열었다.\n\n... 그리고 거기엔 앳된 모습의 행정원 두 명이 깊은 키스를 나누고 있었다. 그가 문을 열었는지 어쨌는지 상관하지 않고 그 짓거리를 계속했다. 리페르트는 자신의 앞에 펼쳐진 촌극에 한숨을 쉬며 문을 닫았다. 머리가 지끈거려 모자를 벗었다. 키보토스란, 원래 이런 곳이었지.\n\n"뭐, 좋을 대로 하세요, 아가씨들..." 그가 옆에 있는 다른 비번실의 문을 열며 혼잣말했다. 그것이 키보토스의 청춘인지 리페르트는 단어를 외며 생각해 보았다."
 COU_event.15.a:0 "\"나니가 코멘토와... 하아.""
 COU_event.16.t:0 "소라의 졸업!"
 COU_event.16.desc:0 "오늘은 학생들과 현지인을 가리지 않고 사랑받던 생텀 타워 인근의 엔젤 24의 중학생 알바생, 소라가 중학교를 졸업하는 날입니다! 특출나게 귀여운 외모로 많은 사랑을 받던 소라였기에 지역 신문에서도 소라의 졸업을 다룰 만큼 소라의 졸업은 큰 이슈였습니다. 빨간 튤립 꽃다발을 들고 환하게 미소지은 소라는 드그렐이 특별히 뽑은 믿음직한 협력자들의 에스코트와 함께 멋진 하루를 마무리했습니다.\n\n하지만 그녀가 갈 곳으로 예정되었던 고등학교들은 대전이 이후 기존 입학 시스템이 완전히 고장나고 자치권의 확대로 체계가 바뀌었기 때문에, 소라는 그녀가 갈 새로운 고등학교를 선택할 수 있게 되었습니다.\n\n소라가 유명 인사인 만큼 그녀에게 쏠리는 수많은 관심이 있더라도 그녀가 갈 학교는 그녀의 재량에 맡기는 것이 맞으나, 그녀를 걱정하는 수많은 주부들의 '제안' 몇 가지는 전달해 줄 수 있을 것입니다."
 COU_event.16.a:0 "지식이야말로 힘이야, 밀레니엄이 좋지."
 COU_event_16_tooltip1:0 "§g미, 밀레니엄이요...? 저는 그렇게 똑똑하지는 않은데... 으음... 뭐어... 나쁘지는 않아 보여요.§!"
 COU_event.16.b:0 "자기 몸은 지킬 줄 알아야 해. 게헨나는 어때?"
 COU_event_16_tooltip2:0 "§g전에 편의점 도시락이 맛없다고 터트리려고 하시던 분도 게헨나 분이셨는데... 일반화는 하면 안되겠죠.§!"
 COU_event.16.c:0 "소라에게는 고고한 트리니티가 가장 적합할 거야."
 COU_event_16_tooltip3:0 "§g그런 아가씨 학교에 제가 가도 괜찮을까요? 우으, 조금 걱정되기는 하네요. 배울 게 많으면 어쩌지...§!"
 COU_event.16.e:0 "소라가 가고 싶은 곳이야말로 가장 좋지."
 COU_event_16_tooltip4:0 "§g이 학교도 좋고 저 학교도 좋은 것 같은데, 어디로 가는게 가장 좋을까요? 고민이네요... 이히히.§!"
 COU_event.17.t:0 "송별식"
 COU_event.17.desc:0 "소라의 졸업으로부터 3달이라는 시간이 흘렀고, 즉 이젠 소라가 D.U.를 떠나 새로운 학교로 향해야 한다는 것을 뜻합니다. 소라 본인의 요청으로 엔젤24의 점장과 그녀의 친구들만이 역사에서 소라를 배웅했습니다. 돌돌거리는 캐리어를 끌고 열차에 탑승한 소라는 훌쩍이는 엔젤24 점장에게 미소지으며 마지막 작별 인사를 했습니다.\n\n곧이어 하이랜더의 로고가 새겨진 역사 직원의 빨간 경광봉이 휘적거려졌고, 열차는 밤을 달렸습니다. 소라는 같은 좌석에 탑승한 학생과 짧은 인사를 나눈 다음, 차가운 창틀에 기대 밖을 바라보았습니다. 철컹이는 열차 소리와 바깥의 풍차, 그리고 튤립의 꽃밭이 그녀를 배웅했습니다."
 COU_event.17.a:0 "잘 가, 소라!"
 COU_event.18.t:0 "D.U.로부터의 신입생"
 COU_event.18.desc:0 "대전이 이후 이례적인 먼 곳에서의 신입생이 도착했습니다! D.U.에서 도착한 중학생 소라는 쭈뼛쭈뼛 담당자에게 다가가 서류를 제출했으며 최근에 이렇게 먼 곳에서 온 학생은 이례적이기 때문에 특히 큰 관심을 받았습니다. 게다가 그 귀여운 외모는 선배들의 관심을 독차지하기에 충분했으며 그녀는 도착하자마자 학교를 안내해 준다는 선배들에게 휩싸여 고달픈 하루를 보낸 것 같습니다.\n\n그녀는 임시로 가장 먼저 새로운 기숙사 방에 배치되었으며, 소라는 이제 우리 학원의 학생으로서 우리의 일상에 스며들 것입니다."
 COU_event.18.a:0 "환영해!"
 COU_event.19.t:0 "치안 담당원"
 COU_event.19.desc:0 "\"야! 저 새끼들 사거리로 나간다! 빨리 가서 막아!"\n"좆같은 게헨나 개새끼들이, 거기 서라!"\n\n오토바이를 탄 게헨나 학생들과 건장한 사내들이 군홧발 소리를 내며 도심을 뛰어다녔다. 학생들은 기겁하며 떨어졌고, 수인들은 큰 덩치에 이따금씩 부딪혀 넘어지기도 했다. 협력자 완장을 찬 사내들은 누군가가 넘어질 때마다 행정위원회에 무어라 보고해야 할 지 걱정이었다. 그러나 그것보다 더 큰 문제는, 빌어먹을 새로운 이웃이 게헨나라는 점 때문에 원하지 않는 개고생을 하고 있다는 점이었다. 사내들은 이따금씩 다른 학원들은 이 좆같은 게헨나 학생들을 도대체 어떻게 다루는 지 궁금해했다.\n\n"저기, 저기임다! 저 년들이 저기로 도망쳤슴다!"\n"저기는 민가잖아! 저 미치광이 테러리스트 새끼들이 총기난사를 하지 않아야 할 텐데!"\n\n사내들은 죽을 힘을 다해서 뛰었다. 체력에 지쳤지만 그래도 뛰었다. 몇십분을 뛰어 그녀들을 추격하자, 헬멧을 쓴 게헨나 학생들이 그들을 비웃듯 민가 근처의 '국경'을 넘어 도망쳤다. 총학생회는 대전이 당시 지시된 행정명령에 따라 다른 학원들의 자치권을 보장해야 했고, 새로 그어진 '국경'을 넘을 순 없었다. 숨이 몰아찬 그들 중 몇 명이 화를 이기지 못하고 제 무장을 집어던졌다.\n\n"하아, 하아... 씨발, 이 개같은 년들..."\n"발키리 그 년들이 원래 하던 일까지 전부 저희가 도맡고 있지 않슴까, 하아. 아 참. 아까 누가 넘어졌던데, 그건 어떡함까?"\n"에라이 씨발, 나라고 알겠냐, 드그렐이 제발 말 좀 잘 하길 빌어야지...""
 COU_event.19.a:0 "\"... 우리도 오토바이 쓰게 해주면 좋겠다.""
 COU_event_19_tooltip:0 "§g"그런데 생각해보니 저희는 왜 오토바이 못씀까?"\n"왜 못쓰긴, 그러다 누가 치이면 어떡하냐고, 행정위원회에서 그러더라."\n"에휴, 씨발..."§!"
 
 ##다른 국가에 수여 
 COU_event_diplomancy.1.t:0 "총학생회의 통화 통일 요청"
 COU_event_diplomancy.1.desc:0 "한적한 오전 5시, 흥신소 사무실에서는 평소답지 않게 아침 일찍부터 잠을 깨우는 벨소리가 들렸습니다. 문 사이로 들어온 작은 편지에는 파란색의 총학생회 로고가 진하게 눌려 있었습니다. 누가 그 편지를 받았을까요? 무츠키? 하루카? 아마 받았던 사람 본인조차 졸음에 잊어먹은 것 같습니다. 하지만 어쨌든 그 편지는 다음과 같은 내용을 담고 있었습니다:\n\n"룩셈부르크 대공국의 섭정 귀하,\n\n총학생회 재무실은 지난 주 벨기에 프랑과 네덜란드 휠던의 키보토스 엔으로의 통화 통일 조치를 시행했으며 이에 따라 구 벨기에 프랑의 가치 보전을 위해 벨기에 프랑과 룩셈부르크 프랑이 유통되는 룩셈부르크에서도 벨기에 프랑과 룩셈부르크 프랑을 키보토스 엔으로 1.5:1로 교환, 통일할 것을 요청합니다. 이는 양 측의 공동 이익을 위한 행정명령으로..."\n\n그렇지만 우리는 이를 따르고 싶어도 룩셈부르크 내에서 야기될 경제적인 충격을 방지하기 위해 총학생회처럼 일방적인 통화 통일은 불가능한데, 그렇다고 답신하지 않는 것은 향후 룩셈부르크의 외교적 이익에 피해를 줄 것 같습니다. 어떤 결정을 내려야 할까요?"
 COU_event_diplomancy.1.a:0 "미안하지만 거절하자."
 COU_tooltip_COU_event_diplomancy_1:0 "§g대신 흥신소는 '룩셈부르크 정부는 총학생회의 압력에 굴하지 않았다!' 라고 신문에 몇 마디 흘렸다. 아루 사장님은 엄청 멋있게 신문에 실릴 것이다.§!"
 COU_event_diplomancy.1.b:0 "일정 수량만 교환하자!"
 COU_tooltip_COU_event_diplomancy_2:0 "§g그렇지만 이건 재무실도 지역 신문도 만족시킬 순 없을 거다. 어쩌면 사장님이 유약해 보일지도?§!"
 COU_event_diplomancy.2.t:0 "찾아온 기회"
 COU_event_diplomancy.2.desc:0 "우리에게 기회가 찾아왔습니다. 총학생회장의 실종 이후 한 달이 넘게 지난 지금, 총학생회장 대행은 제입으로 적법한 지도자가 아님을 실토해야 했고 그렇다면 총학생회의 정통성은 총학생회장이 '직접' 창설한 조직인 우리 샬레가 충분히 이어받을 수 있으며 실제로 저지대 전쟁의 종전 이후 총학생회장을 따르던 총학생회 군대의 일부는 우리에게 자발적으로 복무를 청원하기도 했습니다.\n\n이것은 결코 놓쳐서는 안 될 기회입니다. 군대를 훈련시키고 예상치 못한 기습공격을 통해 총학생회장의 정통성과 생텀 타워를 탈환하고 명분 없는 압제자들을 무릎 꿇릴 때입니다!"
 COU_event_diplomancy.2.a:0 "지금이 아니면 안 돼!"
 COU_event_diplomancy.3.t:0 "최후통첩 발송"
 COU_event_diplomancy.3.desc:0 "한 달여 정도가 지난 오늘, 저지대에서의 긴장은 최고조를 맞이했습니다. 아로나가 더는 기다리지 않고 총학생회에 일방적이고 무조건적인 통합을 요구하는 최후통첩을 발송했기 때문입니다. 너무 이르던 혹은 그렇지 않던 이제 돌아올 수 없는 길을 건넜습니다. 오만하기 짝이 없는 총학생회는 우리의 요구를 곧바로 거부했으며 이는 우리와의 전면전을 요구하는 것과 다름이 없습니다."
 COU_event_diplomancy.3.a:0 "어쩔 수 없네."
 COU_event_diplomancy.4.t:0 "총학생회와의 결별"
 COU_event_diplomancy.4.desc:0 "총학생회 내의 정치적 상황이 격변하면서 정통성 논란이 커지고 학생들이 혼란에 빠지자 발키리 수뇌부는 총학생회와 겨우 유지되던 연결을 오늘부로 모두 단절하기로 결정했습니다. 발키리는 대전이 이후 자체적인 새로운 학원 영토를 얻으면서 총학생회와의 협력이 점점 끊어졌기에 그닥 놀랍다거나 하는 일은 아니지만 수도의 치안 공백을 우려하는 목소리가 일부 있습니다.\n\n하지만 저들도 이미 협력자를 동원해 치안을 일부 관리해왔기 때문에 우리의 공백은 체감되지 않을 것입니다. 중요한 것은, 휘둘려오기만 했던 발키리의 운명은 우리가 결정해야만 합니다."
 COU_event_diplomancy.4.a:0 "발키리는 홀로 선다."
 COU_event_diplomancy.5.t:0 "발키리의 협력 단절"
 COU_event_diplomancy.5.desc:0 "방금 발키리 경찰학원에서 보고된 사항은 발키리 수뇌부가 우리와의 모든 협력을 중단하고 총학생회에서 철수하겠다는 소식이었습니다. 샬레가 우리의 정통성에 시비를 걸자 발키리 학생들이 혼란에 빠져 어쩔 수 없었다는 것이 저들의 주장이지만 사실은 그저 계획된 도망이라고 행정위원회는 판단했습니다. 그러나 우리의 존속 자체가 위협받는 상황에서 저들을 신경쓸 여력은 없기 때문에, 안타깝지만 발키리는 차후 우리가 통제권을 회복하기 전까지 저들은 자유로워질 것입니다."
 COU_event_diplomancy.5.a:0 "좋을 대로 해보라지."
 COU_event_diplomancy.6.t:0 "총학생회에서의 제안"
 COU_event_diplomancy.6.desc:0 "오늘, 코퍼레이션 본사로 친히 총학생회의 시라누이 카야가 모습을 드러내 프레지던트와 독대를 요청했습니다. 우리의 충성스러운 PMC 이사는 프레지던트에게 예를 갖추지 않는 카야를 향해 예를 갖추라고 고래고래 소리를 질렀지만 곧이어 품위 있게 모습을 드러낸 프레지던트가 이사를 진정시키고 카야를 접견실로 안내했습니다.\n\n카야는 다른 학원의 여자 아이들처럼 귀찮게 돌려서 말한다던가, 무식한 일방적인 양보를 요구하지 않았습니다. 그저 단순하게 우리 기업과 총학생회의 협력을 통해 상호 이익을 취할 수 있는 방법을 제안한 것입니다. 카야는 만일 동맹이 성사된다면 카이저 기업들에 대한 우선권을 약속했습니다.\n\n그러나 이를 곁에서 듣고 있던 제너럴은 구태여 유럽에 개입하여 기업의 힘을 낭비할 필요가 없다고 주장합니다. 그러나 확실한 것은 총학생회와의 동맹은 분명 이득이 되긴 할 것입니다. 이보다 손해가 크지 않다면 말입니다."
 COU_event_diplomancy.6.a:0 "\"친히 받아들이죠, 총학생회장님.""
 COU_event_diplomancy.6.b:0 "\"이사회에서 논의를 거치고 오겠습니다.""
 COU_event_diplomancy.7.t:0 "동맹 성사"
 COU_event_diplomancy.7.desc:0 "카야는 꽤나 만족스러운 기분으로 집무실로 돌아왔다. 극적인 동맹 타결 이후 런던에서 즐겼던 관광은 재밌었다. 오래간만의 휴식이기도 했다. 런던에서 사 온 빅 벤 모형을 손에 쥐고 이리저리 흔들어 보았다. 이제 바다는 걱정이 없었다. 브리튼 제도의 강철덩이들이 제 편이 되었다. 카야는 이것이야말로 진정한 어른의 외교이며 뛰어난 수반이라고 자축했다.\n\n카이저와의 동맹 성사는 총학생회의 전략적인 동맹을 얻는 효과 말고도 아주 중요한 효과가 하나 더 있었다. 카야의 기분이 좋아졌다는 것이었다."
 COU_event_diplomancy.7.a:0 "\"... 후후.""
 COU_event_diplomancy.8.t:0 "최악의 제안"
 COU_event_diplomancy.8.desc:0 "화가 난 발걸음이 대리석을 꾹꾹 누르듯 복도에 울려 퍼졌다. 카야는 런던을 방문한 이후 이틀 넘게 나올 생각을 하지 않았다. 그저 가끔씩 집무실에서 들려오는 물건 깨지는 소리 같은 것들이 들려오는 것 말고는 딱히 다른 동향은 없었다. 행정원들은 옹기종기 모여 카야가 어떤 상태일지에 대해 토론했다. 조정실의 한 행정원은 카야가 런던에서 자기를 모욕하는 선전물을 보고 화가 나서 홧김에 돌아왔다는 소리를 들었다고 했다. 하지만 다른 행정원들은 고개를 저으며 그런 것 같지는 않다고 하며 시간을 보냈다.\n\n한편, 카야는 예민해져 있었다. 그깟 기계덩어리들 따위와의 동맹은 애초부터 필요가 없었다는 생각을 하고는 있지만, 그렇다고 면전에서 이사회에게 일을 넘기고 생각해보겠다는 말을 하다니. 예의를 갖추지 않은 것 아닌가? 하고.\n\n기분이 좋지 않았다. 카야는 구석에 놓여져 있던 블루 마운틴 커피잔을 들어 마셔 보았다. 향긋한 향은 여전했지만 어째 잘못 갈았는지 쓴 맛이 세게 났다."
 COU_event_diplomancy.8.a:0 "\"정말이지, 되는 게 없어요.""
 
 
 
 ##산업 
 COU_event_industry.1.t:0 "기업인들과의 만남"
 COU_event_industry.1.desc:0 "오키 아오이는 여러 개의 커피잔을 들고 방문을 열었다. FN 에르스탈, 르나르, 필립스와 같은 저명한 군수기업체들 인사들과의 만남이었다. 아오이는 커피 쟁반을 탁자 위에 올렸다. 잔뜩 위축된 얼굴들의 인사들은 어색한 침묵을 유지했다. 커피가 흘러넘쳐 아오이의 장갑을 적셨기에 아오이는 잠시 자리를 피해 장갑을 갈아꼈다. 장갑에서 흐르는 눈물처럼 커피가 흘렀다. 아오이는 여기치 않고 수건에 손을 닦았다. 곧이어 아오이 또한 자리에 앉았다. \"좋은 오후입니다. 제안드린 건에는 생각해 보셨는지.\" 그럼에도 여전히 침묵은 이어졌다. 아오이는 아무런 말도 하지 않는 이들에 대해 약간의 짜증을 느꼈다. 침묵을 깬 건 에르스탈의 디외도네 세이브였다.\n\n\"정말로... 우리들의 이권을 인정하는 것이 맞습니까? 노동조합에 기업을 넘기지 않고, 구조조정은 단 한 건도 없으며, 단지 총학생회에 협력만 하면 된다는 겁니까?\" 아오이는 그제서야 웃어 보이며 입을 열었다. \"물론입니다. 총학생회는 기업의 경영권을 인정합니다. 총학생회에 협력하신다면 말입니다.\" 아오이는 곁에 올려둔 서류들을 펼쳤다.\n\n\"최근 필립스의 경영 내역입니다. 네덜란드의 망명정부 수립 이후부터 계속되어 적자 상태이며 현재는 2억 3천만 엔에 해당합니다.\" 필립스의 안톤 필립스는 불편한 기색이 역력했다. 자신들의 적자 상태가 그대로 까발려진 건 고사하고, 휠더가 아닌 엔으로 적자를 표기한 것에 익숙치 않은 것도 더 컸다. 아마도 필립스는 도대체 \"2억 3천만 엔\"이 몇 휠던일 지 계산하고 있을 터였다. 어쨌거나 아오이는 말을 이었다. \"재무실은 이러한 기업들을 구제해 드릴 수 있습니다. 기업당 3억 엔을 빌려드릴 수도 있습니다. 무상으로요.\"\n\n아오이의 짧은 말이 끝나자 곧이어 경영진들의 근처에서 기다리던 보좌관들은 동요하는 눈치였다. 안톤 필립스는 그것이 정말 사실이냐고 물었다. 사실 총학생회는 대전이 이후 그런 큰 지출엔 좀 빠듯하겠지만 아오이는 그런 건 아무래도 상관없을 거라며 린을 설득한 뒤였다. 아오이는 그렇다고 대답했다."
 COU_event_industry.1.a:0 "그리고 경영진들은 아오이가 내민 서류에 서명했다."
 COU_event_industry.2.t:0 "암스테르담 선언"
 COU_event_industry.2.desc:0 "번쩍이는 크로노스 스쿨의 대형 카메라가 대표단을 비췄다. 이번 선언에서는 특별히 키보토스의 방송에는 송출되지 않는다. 플란데런과 북프랑스의 방송사들에 크로노스 스쿨이 생방송 녹화본을 보내면 그날 저녁 그들을 통해 송출될 예정이었다. 생방송은 짧은 토론회처럼 이루어졌다. 비공인 조직인 플란데런 자치위원회의 카미유 하이스만스와 북프랑스 자치위원회의 로제 살랑그로가 왼편에, 오른편엔 정갈한 양복을 갖춰입은, 보기 드문 옷차림의 아오이가 서 있었다. 하이스만스가 몇 차례 행정위원회의 개발 약속에 관한 이야기를 나누면 살랑그로가 맞장구를 치는 방식으로 진행되었다.\n\n"예, 음, 저와 플란데런 자치위원회는 기존부터 계속 네덜란드에 편향된 행정위원회의 정책에 오랫동안 이의를 제기해 왔고, 늦었지만 이제서라도 플란데런에 대한 현대화와 개발을 약속받아 대단히 기쁩니다, 그렇죠, 살랑그로 씨?"\n"아, 네, 그렇습니다. 릴 시는 대전이 이후 프랑스군이 퇴각하면서 무방비 상태에 놓아졌다만, 이제서라도 행정위원회가 관심을 기울이겠다니, 대단히 기쁩니다."\n\n아오이는 말을 들으며 약간 언짢았다. 이 인간들은 도대체 무슨 생각으로 이런 말을 내뱉는지 생각했다. 만약 그녀 자신이 저들이었다면 최대한 행정위원회를 칭찬하면서 더 이득을 챙기려고 했을 것이다. 그래도 뭐, 오랫동안 한이 있으니 저렇겠지, 하고 넘겨짚었다. 아오이는 웃으며 클립보드에 본인 명의로 서명된 서류를 내밀었다. 이들의 자치위원회는 오늘부로 모두 해산되고 행정위원회의 명령에 따르지만, 행정위원회는 '의무적으로' 그 지방을 개발할 책무를 지게 된다.\n\n그들에게나 행정위원회에게나 나쁠 것은 없었다."
 COU_event_industry.2.a:0 ""자, 모두들 서명하셨나요?"" 
 COU_event_industry_2_tooltip:0 "§g번쩍이는 소리와 함께 사진이 찍혔다. 갑작스러운 섬광에 살랑그로가 질끔 눈을 감았다. 집에 돌아온 살랑그로는 다음날 아침 신문에 눈이 감겨 나온 자신을 보고 웃었다. 아내는 그에게 눈을 감고 찍었냐며 온갖 편잔을 줬을 테다. 그런 생각을 하니 문득 아내 생각이 났다. 그래도 괜찮았다. 이제 프랑스인들에겐 더 나은 삶이 기다리고 있을 테니까.§!"
 COU_event_industry.3.t:0 "남부에서의 소요"
 COU_event_industry.3.desc:0 "재무실에서 시행된 통화 통일은 네덜란드 휠던과 벨기에 프랑을 각각 1.5:1로 교환해주는 대대적인 경제 개혁 조치의 일환으로 시행되었지만, 상대적으로 키보토스 인구가 다수를 차지하는 네덜란드에서는 괜찮다는 평가가 주를 이뤘지만 북프랑스와 플란데런은 그렇지 않았습니다. 플란데런의 일부 도시의 시장들은 통화 교환을 경제적 침략으로 규정하며 행정위원회와의 합의 사항을 위반했는데, 특히 항구 도시의 반발이 가장 거셌습니다. 됭케르크 시는 프랑스 국가와 프랑화를 존중하라며 항의했습니다.\n\n재무실은 급하게 일부 조치를 약화하거나 철회하는 식으로 이들을 진정시켜야 했습니다."
 COU_event_industry.3.a:0 "참나."
 
 
 ##군사
 COU_event_military.1.t:0 "자유 장교단의 와해"
 COU_event_military.1.desc:0 "협력자들을 동원한 행정위원회의 훌륭한 결과로, 곳곳의 비밀 거처를 차리고 우리를 괴롭혀 왔던 자유 장교단이 오늘 마침내 와해되었다는 소식이 믿을 만한 정보통을 통해 확인되었습니다.\n\n그것에 대한 확실한 증거로 자유 장교단 출신의 여러 장교들이 오늘 발키리 공안국에 자수했으며, 이들은 협력자들이 넘겨받아 약간의 '재교육' 절차를 거친 뒤 우리를 위해 복무하도록 정신을 개조할 것입니다."
 COU_event_military.1.a:0 "좋군."
 COU_tooltip_unlock_dutch_belgium_generals:0 "£decision_icon_small §Y결정 해금§! : 자유 장교단 재교육"
 COU_event_military.2.t:0 "플란데런 백작 샤를, 플란데런의 백작."
 COU_event_military.2.desc:0 "플란데런 백작 샤를은 요즈음 한가한 나날들을 보내고 있었다. 형 레오폴드 3세는 콩고로 도망가 망명정부를 차렸고, 그는 형의 간곡한 부탁에도 그 배에 타지 않았다. 벨기에인들도 그 배에 타지 않았기 때문이다. 그 또한 콩고로 도망가버린다면 만일 왕가가 돌아온다 하더라도 터무니없는 지지를 자랑할 것이 뻔했다. 그는 벨기에 왕실과 형, 그리고 벨기에인들을 위해서라도 가지 않았다.\n\n어쨌거나 그는 나쁘지 않은 삶을 살고 있었다. 언론들은 밥먹듯이 도망가버린 형을 비난하는 데에 반해 자신은 칭찬해줬을 뿐만 아니라 '차기 국왕'으로 준 확정하여 말하고 있기 때문이다. 그리고 한적한 플란데런의 시골 마을에서 커피나 마시면서 신문을 읽으며 양뗴를 모는 삶도 꽤나 나쁘지 않았고. 그는 나쁘지 않을 뿐만 아니라 만족스러운 삶을 살고 있었다- 얼마 전까지만 해도.\n\n총학생회의 마크를 단 차량이 양떼 목장에 침입했을 때의 이야기였다. 그때 아마도 행정원은 어느 왕족을 찾으러 온 듯 했다. 그러나 결론적으로 그녀가 샤를의 양을 치기는 하였기에 행정원은 몇번이고 사과하면서 그의 이름을 물었다. 그는 몇번 고민하다가 샤를이라고 대답했다. 행정원은 서류 속의 이름과 그를 번갈아서 보더니 몇 번 무전을 주고받은 듯 했다. 샤를은 본능적으로 불안감을 느꼈다. 뭐지? 나를 체포하려는 명령이라도 있었나? 그러나 그러한 그의 걱정은 곧 행정원의 차량 안에서 해결되었다. 총학생회는 샤를을 플란데런의 주지사 비슷한 것에 임명하고 싶다고 했다. 샤를의 걱정과는 거리가 먼 결과에 샤를은 안도감을 느꼈다. 만일 여기서 이를 거절한다면 그는 또다시 양떼를 모는 한적한 삶으로 돌아갈 수도 있었겠지만, 샤를은 충분히 쉬었다고 느꼈다.\n\n많이 쉬었으니, 이제는 다시 한번 벨기에인들을 위해 나설 때였다. 대답을 기다리는 행정원에게 샤를은 답했다."
 COU_event_military.2.a:0 "\"네, 물론이죠. 그러겠습니다.\""
 COU_event_military.3.t:0 "헤일케르컨 사면"
 COU_event_military.3.desc:0 "드그렐은 플란데런 외곽, 방위실이 관리하는 한 사설 감옥에서 모습을 드러냈다. 가슴팍에는 푸른 빛이 감도는 총학생회의 핀 뱃지가 박혀 있었다. 그가 27번 감옥 문 앞에 섰다. 코르넬리스 판 헤일케르컨이 있는 곳이었다. 헤일케르컨은 다리를 꼬고 책을 읽고 있었다. 드그렐이 그를 응시하자 책을 덮고 쏘아보듯 드그렐을 보았다.\n\n"무슨 꿍꿍이인가? 나를 죽이기라도 할 생각인가?"\n"어이쿠, 처음 보는 사람 상대로 말이 심하시군요."\n\n드그렐이 되받아쳤다. 무슨 일이 있든 헤일케르컨은 그가 좋을 대로 해줄 생각이 없었다- 만일 그들이 자유를 준다면 말이 또 달라지겠다만. 그리고 마치 그의 생각을 예상했듯이 드그렐이 먼저 말을 꺼냈다.\n\n"헤일케르컨 씨, 억울하다고 생각하십니까."\n"아니, 난 조국을 위해 평생 충정을 바쳤지. 억울하지 않아. 단지 이 감옥에서는 좀 나가고 싶을 뿐이야."\n"돌려서 이야기하실 필요는 없습니다. 당신의 말을 듣고 격분할 NSM은 이미 없으니까요. 아, 뮈세르트도 없군요."\n"내 속이나 긁으려고 온 건가."\n"하하, 비슷하긴 하네요. 오늘 날이 참 좋아서 말입니다. 꼭 보여 주고 싶다고 얘기하려고 했습니다. 감옥에서 평생을 썩'을지도 모를' 당신이 볼 수 있을 지는 모르겠지만요."\n"잠깐, 그게 무슨 소리냐, 너, 설마..."\n"예, 잘 알고 계시네요. 당신과 거래하겠습니다. 협력자가 되시죠, 그렇다면 당신은 자유입니다. 그리고, 뭐, 그 뒤엔 좋을 대로 하시고요. 마치 저처럼요. 무엇이 우선인지 생각해보세요. 여전히 억울하지 않다고 생각하십니까?"\n\n헤일케르컨이 무어라 반박하려다 되려 자리에 풀썩 주저앉았다. 드그렐이 창살 안으로 열쇠를 던져주며 답했다."
 COU_event_military.3.a:0 "\"그럼, 나중에 보시죠.""
 COU_tooltip_heilcurcken_ours:0 "§g철컥하는 소리와 동시에 굳게 닫혔던 철문이 열렸다. 헤일케르컨은 마음을 다잡았다.§!"
 COU_event_military.4.t:0 "폭스 소대 사면"
 COU_event_military.4.desc:0 "시라토리구의 늦은 저녁, 행정위원회 직속의 형무소에 한 가지 행정명령이 전달되었다. 폭스 소대는 각각 독방에서 (본디 4인 모두 넒은 방에서 함께 수감될 예정이었지만, 현지인 간수들은 어떻게든 꼬투리를 잡아 독방행을 시켰다) 지루한 날들을 보내고 있었다. 그녀들에게 허락된 것은 프랑스어와 네덜란드어 학습책과 전술 교본, 그리고 래빗 소대가 보내주는 편지가 전부였다. 그렇지만 그녀들 중 누구도 불평하는 일은 없었다. 후배들을 지키기 위해 내린 마지막 결정이었으니까.\n\n그때, 간수들이 다가와 급작스레 독방의 문을 열었다. 멍하니 그들을 쳐다보는 그녀들을 향해 어느 간수가 입을 씰룩거리더니 말했다. "행정명령이다. 너흰 이제 자유야."\n\n간수 두 명이 함께 따라나서 그녀들의 마지막을 배웅했다. 바깥엔 기자들이 몰려와 그녀들을 맞이했다. 그 사이엔 래빗 소대의 후배들도 있었다. 마치 서로 약속한 듯 유키노와 미야코가 악수했다. 비록 아직 친하진 않았지만, 그래도 선후배라는 특별한 관계와 유대는 그리 쉽게 깨지지 않았다. 기자들이 들이미는 마이크에 유키노가 천천히 입을 뗐다."
 COU_event_military.4.a:0 ""좋은 저녁입니다!""
 COU_event_military.5.t:0 "SRT 현지인 소대"
 COU_event_military.5.desc:0 ""전 소대 차렷! 소대장님께 경례!"\n"충 성!"\n\nSRT의 로고가 선명히 새겨진 견장을 찬 남자들이 학원 교정에서 사열했다. 이른 아침이었다. 이들의 시끄러운 사열 소리에 사키를 시작으로 래빗 소대의 인원들이 잠에서 깼다. 상부의 명령으로 라이언 소대와 래빗 소대는 합숙하여 각자의 문화와 전술을 배우는 교류의 시간을 가지게 되었는데, 경직된 군 문화를 처음 보는 래빗 소대로서는 당혹스러운 일이 아닐 수 없었다. 이번에 창설된 라이언 소대는 벨기에군과 프랑스군 포로들이 주를 이룬 현지인 소대였는데, 이들은 그들이 배웠던 군 문화를 과시하듯 움직였다. 또한 새로운 소대에 배속되었음에도 각자의 차이를 타파하고 뜻을 모은 것도 특징이라고 할 수 있었다.\n\n"이른 아침부터 왜 저래, 시끄럽게..."\n"교본에 따르면 이른 아침에 일어나는 것도 나쁘진 않아, 모에. 그래도 4시는 좀 이르긴 하지만..."\n"저 사람들은 계속 저렇게 살았던 걸까요, 우으..."\n"우리도 얼른 일어나자, 응."\n\n교정에 투덜대듯 모인 래빗 소대가 라이언 소대에게 인사를 건넸다. 딱딱하지만서도 부드러운 답례를 받았다. 그 날은 키보토스식 전술 훈련을 전수해주는 날이었다. 아무래도 현지인과 키보토스인은 생체적 구조부터 다르기 때문에 부적합하다는 사키의 의견이 있긴 했지만 키보토스인이 어떠한 전술적인 사고를 가졌고 행동하는지를 배우는 것이라 큰 문제는 없다는 미야코의 말 속에서 합숙훈련은 진행되었다."
 COU_event_military.5.a:0 "사소한 문제는 있어도 큰 문제는 없었다."
 COU_tooltip_event_military_5:0 "§g라이언 소대원들에게는 이따금씩 저격수도 최전방으로 뛰쳐나가 사격을 가하는 키보토스식 전술을 보고는 경악을 금치 못했다는 사소한 문제가 있었다.§!"
 COU_event_military.6.t:0 "방위군의 상태 보고"
 COU_event_military.6.desc:0 ""아, 화면 잘 나오나?"\n"일단 [COU.GetLeader] 쪽에서 지금은 자리를 비웠다고 해서, 이렇게 녹화를 해서 보내. 방위군의 상태를 얘기하면 되는 거지?"\n"음, 어떻게 말해야 될지는 잘 모르겠지만 전보단 나아졌어. 훈련 체계도 다시 뜯어고쳤고, 월급이 내려간 만큼 예산이 좀 남아서 그걸로 새 군용 장비 몇 개를 사들였어. 그건 좋긴 한데, 근본적으로 일단 불만이 있어. 그래도 이정도는 시간이 지나면 해결될 거라고 생각해. 은연중에 본인들도 과한 취급이었다는 걸 아는 것 같아."\n\n"... 그리고 헤일로 보병 사단의 학생들도 재편되고서 이런 생활에 익숙해진 것 같아. 뭐, 그런거 있잖아. 비록 직업 교육은 없어졌지만... 하던 대로 사열하고, 운동장 몇 바퀴 정도 뛰고, 팔굽혀펴기도 좀 하고."\n"그리고 현지인 협력자들도 우리 지휘 체계에 대충 익숙해진 모양이야. 그쪽은 달라진게 별로 없기도 하고. 사실 현지인들보다는 우리 체육실 쪽 얘들이 체육 활동이 사라져서 불만이던데, 음... 병영 내에 작게, 상설 운동회 같은 걸 개최해보려고 해. 그럼 모두들 힘이 나고 좋을 것 같아. 긍정적으로 검토해주길 바랄게."\n\n"어쨌든 보고는 이 정도야. 이 정도면 방위군을 개혁할 토대는 된 것 같아."\n\n(잡음) "하이네 실장님, 여기 주먹밥 다 만들었어요! 와서 하나 드셔보세요!"\n\n"알았어, 금방 갈게! 일단 난 가봐야 할 것 같아. 끊을게. 다음 번에 D.U.를 들러서 서면으로 좀 더 자세히 보고할게. 이만!""
 COU_event_military.6.a:0 "견딜 만한 충격이다."
 COU_event_military.7.t:0 "장거리 훈련 보고서"
 COU_event_military.7.desc:0 "행정위원회 방위실, 방위차장 앞.\n\n지난 달에 명령을 하달받고 중순양함 전대의 일부 함선을 차출해서 영국 해협과 북해에서 각각 기동과 사격 훈련을 진행하였습니다. 이례적인 장거리 항해에도 키보토스 기술력으로 정비받은 함선들이라 그런지 운행 도중의 문제는 없었습니다만 키보토스 군사력의 해군 경험에 대한 부재인지 어쩐건지는 몰라도 자동 항법 장치, 이거 좀 상태가 이상합니다. 그리고 연료 자동관리 시스템이 먹통이었던 턱에 효율적인 연료 관리가 불가능했으며... (중략)\n\n... 그럼에도 시스템은 정말 뛰어난 성능을 보여줬고 이러한 사소한 기술적인 문제만 개선한다면 새로 정비받은 우리 함선들은 10% 정도 더 멀리 항해가 가능할 것 같습니다. 빠른 해결을 기원하겠습니다.\n\n- 콘라트 헬프리흐."
 COU_event_military.7.a:0 "뭐어, 기술 문제면 금방 고치겠군."

 
 
 
 #캐릭터 
 ##BA 
 COU_XXX_override_instant:0 "§Y총학생회장§!"
 COU_XXX_override_delayed:0 "대전이 이후 여러 산전수전을 겪었지만 §Y총학생회장님§!은 직책과 권위에 걸맞게 §G결코§! 키보토스를 포기하시지 않을 것입니다!\n...\n\n§R하지만, 총학생회장님은 언제쯤 집무실에서 나오실까요?§!"
 #COU_XXX:0 "총학생회장"
 #COU_XXX_desc:0 "그 어떠한 자들보다도 위에 서 있는 총학생회장은 키보토스에서 모든 것을 관리했습니다. 학원 간 분쟁, 그리고 사소한 다툼까지도, 모든 것을 관리하고 통제했으며 조정함과 동시에 중재했습니다. 그러나 그러한 총학생회장조차도 키보토스 전체가, 한 번도 들어본 적 없으며 실존하는지조차도 몰랐던 곳에 전이하게 되었을 때, 그녀는 모든 것을 짊어지게 되었습니다. 비록 원한 적은 없으나 모든 이들의 우두머리인 총학생회장은 그러해야만 했기에 그녀는 기꺼이 모든 것을 짊어지기로 결정했습니다. 그리고 그러한 고난 속에서 총학생회장은 더는 버틸 수 없게 될 때 까지, 그녀는 그녀가 가능한 한 키보토스를 위해 끝까지 일하고자 할 것입니다."
 COU_null:0 "키보토스 비상대책위원회"
 COU_null_desc:0 "총학생회장이 갑작스럽게 실종된 이후, 총학생회는 굉장한 혼란 속에 갇혀있습니다. 키보토스 총학생회는 현재 그 어떠한 활동도 할 수 없으며 이는 키보토스의 이상 상황에 전혀 대처할 수 없다는 것입니다."
 COU_RIN:0 "나나가미 린"
 COU_RIN_desc:0 "총학생회장이 무책임하게 실종된 이후 총학생회는 나나가미 린의 지도 아래에 놓였습니다. 총학생회장의 신임으로부터 증명된 린의 유능함은 굳이 설명하지 않아도 이해할 수 있을 것입니다. 매일같이 말도 안되는 양의 업무를 완벽히 수행하고, 거의 쉬지도 않은 채 업무에 응하는 것은 총학생회장과 초인을 연상케 합니다.\n\n어쩌면 이런 부분에서 린은 맞는 자리를 찾았을지도 모릅니다. 하지만 이러한 그녀에게 문제가 있다면, 어느 날 갑자기 사라져버린 총학생회장은 명확히 그녀를 지명하지 않았습니다. 그냥 단지 그녀의 직위가 총학생회장의 다음가는 높은 직위였기 때문에 떠밀려 맡은 것이 전부였습니다.\n\n린의 미약한 권력 기반과 통치 신념은 모두에게는 좋은 일이지만 린 그녀 자신에게는 그다지 좋은 방법이 아닙니다. 이제 단순히 '총학생회장의 보증'이 언제까지 가는 지에 대하여 모든 것을 걸어야 할 처지에 놓였기 때문에, 린은 부지런히 움직여야 할 것입니다."
 COU_RIN_SET1:0 "수석 행정관"
 COU_AOI:0 "오키 아오이"
 COU_AOI_desc:0 ""
 COU_AOI_SET1:0 "재무실장"
 COU_KAYA:0 "시라누이 카야"
 COU_KAYA_desc:0 "초인이 비상했습니다. 초인을 견제하던 한심한 잔챙이들은 나가떨어졌고, 진정한 초인의 통치가 무엇인지 카야는 몸소 증명할 기회를 얻어 즐거워합니다. 시라누이 카야는 총학생회장을, 더 정확히 말하자면 총학생회장이 주도하던 안정과 질서를 동경했고 또 한편으론 시기했습니다. 오랫동안 키보토스의 이해관계를 다루었던 총학생회장조차도 완벽한 키보토스를 이끌기엔 초인인 자신에 비하면 부족하다고 본 것입니다.\n\n그렇기 때문에 카야는 단순히 권력만을 게걸스럽게 탐하는 독재자가 아닙니다. 정확히 말하자면, 반드시 필요한 권력이라는 발판으로 키보토스라는 거대한 기계가 하나의 오차도 없이 완벽하게 돌아가길 원하는 엔지니어에 가깝습니다.\n\n책상 위에는 수천 장의 서류가 쌓여 있지만, 카야는 그 모든 숫자의 행간을 읽어내며 미소짓습니다. 그녀에게 정치는 예술이며, 행정은 그 예술을 완성하는 정교한 붓질입니다."
 COU_KAYA_desc_bad:0 "언제부턴가 카야는 이유모를 공허감과 불안감에 시달렸습니다. 어째서였을까요? 카야는 자신하던 대로 키보토스를 이끌었습니다. 그것에 대한 이견은 아무도 제시하지 않습니다... 아, 제시하지 못 하는 것에 더 가깝겠군요. 카야가 심혈을 기울여 만들려고 애썼던 완벽한 질서는 결국 거짓말로 치장된 환상에 불과했습니다.\n\n겉으로는 카야는 예전과 다를 바가 없습니다. 커피를 마시고, 업무를 봅니다. 그리고 그 이면에는 자신이 틀렸다는 것을 은연중에 두려워하며 돌아갈 수 없는 길을 건넌 것에 대한 끝없는 후회가 잠들어 있습니다. 하지만 어쩌겠습니까? 더는 어찌할 도리가 없습니다.\n\n결국엔 카야는 원하던 대로 영원한 권력을 얻었습니다. 내려놓을 수도, 다시 들어올릴 수도 없는 어정쩡한 위치에서의 영원한 권력을요. 그리고 또한 통치는 지속될 것입니다. 그녀가 포기하고 싶던 어쩌던 상관하지 않고 영원히 지속될 것입니다. 대외적으로 그녀는 압도적인 권력자이자 전례 없는 독재자이며 완벽함을 창조한 총학생회장으로서 숭배받지만, 실제로는 잃어버린 것들을 읊조리는 망령에 불과합니다.\n\n통치는 지속될 것입니다. 단지 주인은 지속하지 않을 뿐." #배드엔딩용 
 COU_KAYA_desc_good:0 "초인은 이제 땅을 딛고 서 있습니다. 한때 카야는 하늘 위에서 모든 것을 굽어보며 완벽이라는 이름으로 자신을 가두는 데 열중했지만 이제는 그렇지 않기로 했습니다. 단지 자신이 무엇을 하는 지 확신하면서 이따금씩의 여유를 즐기기로 했습니다.\n\n책상 위에는 여전히 수천 장의 서류가 쌓여 있고, 때로는 통제할 수 없는 먼지가 내려앉기도 합니다. 하지만 카야는 더 이상 완벽하지 않음에 대해 불안해하지 않습니다. 먼지가 쌓이면 닦아내면 그만이고, 숫자가 틀리면 다시 계산하면 된다는 당연한 사실을 수용할 수 있는 여유라는 이름의 권력을 얻었기 때문입니다.\n\n카야는 더 이상 초장부터 완벽해야만 한다는 강박에 시달리지 않습니다. 완벽해야 한다는 강박은 완벽하다는 결과를 통해 증명하기로 마음먹었습니다. 어쩌면 예상과는 달리 중간 과정은 완벽하지 않을 수도 있습니다. 그렇지만 그것이 카야 자신의 소망하는 완벽의 붕괴나 파멸을 뜻하지는 않습니다." #해피엔딩용
