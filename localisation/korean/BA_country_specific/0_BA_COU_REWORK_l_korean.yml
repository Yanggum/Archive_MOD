 COU_duty_of_gsc:0 "총학생회의 의무"
 COU_reworked_army:0 "갓 재편된 방위군"
 COU_reworked_army_desc:0 "방위군이 재편된 지 얼마 되지 않았습니다. 새로운 경험엔 쉽게 익숙해지겠지만, 완전히 규율이 잡히진 않았습니다."
 COU_land_defence_force:0 "육상방위군"
 COU_air_defence_force:0 "항공방위군"
 COU_naval_defence_force:0 "해상방위군"
