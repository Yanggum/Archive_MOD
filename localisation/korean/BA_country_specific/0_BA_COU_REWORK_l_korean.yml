 COU_restart_the_zuiderzee_works_desc:0 "옛 네덜란드 정부가 1932년 완성했던 이 경이로운 토목 공사는 누가 진행하던 반드시 이어져야만 합니다. 저지대의 특성상 더 많은 지반과 부지는 필수불가결하며 이 사업의 재추진은 좀 더 큰 규모로 이루어질 것입니다."
 COMPLETED_LEV1:0 "§Y1차 공사§!를 완료함."
 COMPLETED_LEV2:0 "§Y2차 공사§!를 완료함."
 COMPLETED_LEV3:0 "§Y3차 공사§!를 완료함."
 COU_restore_our_fucked_lands:0 "1차 공사: 자위더르 방조제 재건"
 COU_restore_our_fucked_lands_desc:0 "완전히 가라앉은 지반을 복구하기 위해 재건할 곳 주위에 거대한 임시 벽을 세운 다음 물펌프를 이용해 물을 빼내어 최종적으로는 다시 자위더르해를 에이설 호로 만들 것입니다. 물론 약간의 시설들이 '파괴' 될 수도 있지만 말입니다..."
 COU_restore_our_lost_factories:0 "2차 공사: 침수 공장 긴급 보수"
 COU_construct_sea_dam:0 "3차 공사: 제방 댐 공사"
 COU_extra_lands:0 "도시계획 전면 재검토"
 COU_restore_flevoland_province:0 "플레볼란트주 재설치"
 COU_restore_flevoland_province_desc:0 "플레볼란트주는 대전이 당시 자위더르 방조제가 완전히 박살나면서 침수, 완전히 사라졌'었'습니다. 우리가 방조제를 재건한 지금, 다시 한번 플레볼란트주는 해수면 위로 모습을 드러냈고 우리는 이를 마땅히 재설치해야 합니다."
 COU_use_dam_for_energy:0 "에너지 생산 극대화"
 COU_use_dam_for_energy_desc:0 "1916년 범람 이후 바다가 되었던 전적이 있는 자위더르해는 현재도 재건된 방조제가 무너진다면 다시 바다가 될 수 있을 정도로 압도적인 위용을 자랑합니다. 우리는 그 점을 이용해 3차 공사에서 방조제와 함께 건설한 댐을 이용해 에너지 생산을 극대화할 것입니다."
 COU_custom_cost_pol25civ3:0 "£pol_power  §Y25§! £civ_factory  §Y2§!"
 COU_custom_cost_pol25civ3_blocked:0 "£pol_power  §R25§! £civ_factory  §R2§!"
 
 ##플란데런-북프랑스개발
 COU_industry_of_flandern_northern_france:0 "암스테르담 선언"
 COU_industry_of_flandern_northern_france_desc:0 "행정위원회는 공식적으로 플란데런과 북프랑스에 기존보다 더 많은 예산을 집행할 것을 그들에게 약속했습니다. 그들에게 쌓였던 불만은 우리의 지출 몇 번에 모두 사라질 것입니다!"
 
 ##공용 디시전 
 COU_decision_the_student_council:0 "미션"
 #COU_decision_the_student_council_desc:0 "£GFX_COU_decision_gsc\n\n\n\n\n\n§Y총학생회§!는 §Y생텀 타워§!를 중심으로 키보토스 전역을 다스렸습니다. 그러한 총학생회는 §Y행정위원회§!로 구성되어 있는데, §Y행정위원회§!는 §g공식적으로는§! §Y11개의 부서§!를 두어 관리를 원할하게 하고 권력을 분산시키게 하여 총학생회의 통제를 단단히 합니다. §Y대전이§! 이후 추가적으로 창설된 몇 가지의 §g임시 부서§!들은 공식적으론 §R집계되지 않습니다.§!\n\n총학생회에서의 안건은 보통 §Y재무실, 교통실, 조정실, 방위실, 체육실§!, 이 §g5개§!의 부서가 제출하며 서로가 자신의 안건을 우선적으로 제출하기 위해 다툽니다. 안건을 활성화하기 위해서는 §Y스케줄 티켓§! £schedule_ticket_texticon 을 필요로 합니다. §Y스케줄 티켓§! £schedule_ticket_texticon 은 3달마다 §g1개§!씩 보충됩니다. §g6개§! 이상으로는 보충되지 않습니다.\n\n현재 §Y스케줄 티켓§! £schedule_ticket_texticon 의 개수는 [?global.cou_schedule_point|+0]/6 개 입니다.\n"
 COU_decision_the_student_council_desc:0 "£GFX_action_point_texticon §7Action Point§!는 총학생회 임원들을 설득하고 회유하기 위한 일종의 거래 도구로서, 정기적으로 행정위원회에 제출되는 §g요구 사항§!, 일명 §Y미션§! 몇 가지를 처리하면 획득할 수 있습니다.\n\n£GFX_action_point_texticon §7AP§!로 행정위원회를 회유하여 원하는 정책 혹은 국가적 중점을 설정할 수 있습니다.\n\n현재 £GFX_action_point_texticon §7AP§! 의 개수는 [?global.cou_apcost|+0] 개 입니다.\n"
 COU_check_the_missions_1:0 "시간 경과"
 COU_check_the_missions_1_desc:0 "주어진 시간 안에 미션을 완료한다면 AP를 획득할 수 있습니다."
 COU_check_the_missions_2:0 "시간 경과"
 COU_check_the_missions_2_desc:0 "임원들은 주어진 시간 안에 제시된 일을 완료해야 만족할 것입니다."
 COU_check_the_missions_3:0 "시간 경과"
 COU_check_the_missions_3_desc:0 "시간을 꼭 지켜야 하는 것은 아니지만, 지키는 편이 좋을 것입니다."
 
 
