 COU_focus_antitank_artillery_idea:0 "대전차포대"
 COU_focus_focus_on_plane_production:0 "기체 생산에 집중"
 COU_fk_anti_sh:0 "명분 소실"
 COU_plot_of_rin:0 "통괄실의 음모"
 COU_plot_of_rin_desc:0 "예상과는 달리 총학생회 곳곳에 통괄실에 가담한 배신자들이 널렸다는 것이 공공연해지면서 업무 처리에 부담이 과중되고 있습니다."
 COU_ohno_its_so_scary:0 "경직된 사회"
 COU_ohno_its_so_scary_desc:0 "공포정치가 총학생회 사회 전반을 경직시켰습니다. 이는 오래는 가지 못하겠지만 한동안은 우리의 원할한 행정에 큰 도움이 될 것입니다."
 COU_control_media_1:0 "미디어 장악"
 COU_control_media_1_desc:0 "미디어에서부터 세뇌된 학생들은 우리의 정책을 열렬히 지지할 것입니다. 그것이 사실인지 아닌지 구분할 시도조차 하지 않으면서요."
