 COU_HAINE_SET1:0 "체육실장"
 COU_HAINE_desc:0 "하이네는 본디 이런 무거운 자리를 맡을 생각은 없었습니다. 단지 체육 행사에 즐겁게 참여하고, 체육 문화를 증진하며 건강한 사회를 이룩하자는 것이 그녀의 건전한 목표의 전부였습니다. 하지만 급변하는 정세는 그녀가 그렇게 평탄한 일생을 보내도록 두지 않았습니다. 전임자가 자리에서 물러난 이후, 그 누구도 맡을 수 없는 자리를 유일하게 하이네는 맡을 수 있었습니다.\n\n자리를 맡아 달라는 후배들의 간청에 어쩔 수 없이 자리에 앉은 하이네의 통치는 특별하다거나 독특하지 않습니다. 단지 권력 공백이라는 공포스러운 상황을 맞지 않도록 도와주는 가리개 역할이기 뿐이기 때문에, 하이네는 왕관을 쓰고 아무것도 하지 않기를 선택했습니다. 방위군을 점검하고, 예산 편성을 요청할 수는 있어도 주도적인 외교 정책은 펼치고 싶어하지 않으며 또 그러할 수도 없습니다.\n\n하이네는 모두에게 예전과도 같은 일상을 보장하기 위해 노력하고 있습니다. 처음으로 끝도 없는 서류들을 처리했고, 처음으로 정기 회의에서 8시간이 넘도록 비판받았으며 처음으로 의견 조율에 실패해 모두를 실망시킨 적도 있습니다.\n\n그러나 그럼에도 그녀는 그만두지 않을 것입니다. 모두의 일상을 지키겠다는 하이네의 다짐이 존속하는 한."
