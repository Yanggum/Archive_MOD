 ##경제
 COU_focus_after_two_months: "대전이 이후"
 COU_focus_after_two_months_desc: "1935년 11월 대전이 이후 총학생회는 자체적인 의결권을 가진 국가와 유사한 형태로 재편되었고, 그 결과 평소에는 소극적인 주도와 서류에 결재하기만 하던 산업 기반을 보다 적극적이고 직접적으로 건설하고 계획하게 되었습니다."
 COU_focus_look_the_our_economy_fucked: "회생 실패 분석"
 COU_focus_look_the_our_economy_fucked_desc: "행정위원회는 네덜란드의 경제가 엄청나게 무역과 수출에 의존하고 있었다는 사실을 몰랐습니다. 과연 그것만 몰랐을까요? 우리가 실패한 이유에는 당연히 마땅한 이유가 있습니다."
 COU_economy_focus_0: "자위더르해 사업 재추진"
 COU_economy_focus_0_desc: "자위더르해 사업이란 1932년 완공된 방조제 건설 공사를 이르는 말입니다. 그러나 1935년 대전이 이후 급작스러운 D.U.와 생텀 타워의 전이는 간척 지대의 재침수라는 참담한 결과를 낳았고, 경제 회생의 시발점은 바로 새로운 자위더르해 사업이 담당하게 될 것입니다."
 COU_establishment_of_federal_industrial_committee: "기업 매수"
 COU_establishment_of_federal_industrial_committee_desc: "기업이란 철저히 돈의 논리로 움직입니다. 애국적인 기업이란 성립 불가능한 것이며, 우리 경제의 안정화를 위해 그들에게 돈을 좀 쥐여 준다면 그들은 우리를 위해 무엇이던지 할 수 있을 것입니다."
 COU_tooltip_unlock_dutch_belgium_cons:0 "§Y잠겨진 설계사§!들이 모두 §G사용 가능§!해질 것입니다."
 COU_focus_order_highlander: "하이랜더 매수"
 COU_focus_order_highlander_desc: ""
 COU_focus_mineral_prospecting: "림뷔르흐 광산지대 재가동"
 COU_focus_mineral_prospecting_desc: "림뷔르흐의 마우리츠, 빈터슬라흐와 같은 광산들은 1930년대 초 강력한 대외 의존성으로 대전이 당시 사회 혼란 속에서 완전히 파산했지만 연간 5억 톤에 달하는 석탄이 생산되었을 만큼 차고 넘치는 이 유용한 광산을 더는 방치할 수는 없습니다. 기존의 국영 광산은 모두 매입되어 다시 한번 가동될 것입니다!"
 COU_focus_project_delta: "델타 프로젝트"
 COU_focus_project_delta_desc: ""
 COU_focus_on_industrial_complex: "민간산업 재건"
 COU_focus_on_industrial_complex_desc: ""
 COU_focus_restore_cable_internet: "케이블망 재건"
 COU_focus_restore_cable_internet_desc: ""
 COU_focus_apprenticeship_jordaanoproer: "요르다노프로어 수습"
 COU_focus_apprenticeship_jordaanoproer_desc: "요르다노프로어란 1934년 7월 실업자들이 일으킨 폭동으로 네덜란드 사회에 깊은 상처를 남겼습니다. 이를 승계받은 우리는 저지대의 경제를 수습해야 할 당사자로서 마땅히 이를 수습할 의무가 있습니다."
 COU_focus_have_with_galopin: "갈로팽 원칙 수용"
 COU_focus_have_with_galopin_desc: "애국적인- 다르게 말해 불충한 벨기에인들은 자신들의 산업과 경제 구조를 보존하기 위한 필사적인 저항으로, 알렉산드르 갈로팽을 필두로 한 갈로팽 위원회는 갈로팽 원칙을 내세워 우리에게 큰 골칫거리였습니다만, 저들의 허를 찔러 오히려 이 원칙을 수용하고 저들과 적극적으로 협력한다면 우리는 큰 피해를 들이지 않고 이들의 잠재적인 역량을 흡수할 수 있을 것입니다." 
 COU_focus_absorption_belgian_assets: "벨기에 자산 흡수"
 COU_focus_absorption_belgian_assets_desc: ""
 COU_focus_plan_de_man: "플랑 드 만"
 COU_focus_plan_de_man_desc: "1933년 드 만이 고안한 이 노동 계획은 드 만의 계획주의 교리의 대표로서 신용 조직과 이미 실질적으로 독점화된 주요 산업을 포괄하는 국유화된 부문을 만들어 혼합 경제 체제를 구축하는 것을 목표로 했습니다. 비록 좌익 운동가들, 특히 트로츠키는 "노동자를 속이려는 계획"부터 "부르주아 민주주의 보수주의의 개량된 도구" 라고 비난했지만, 앙리 드 만의 이 효율적이고 효과적인 계획은 이제 적절한 때를 찾았으며 실행되어야 합니다."
 COU_focus_have_with_hirschfeld: "히르슈펠트 등용"
 COU_focus_have_with_hirschfeld_desc: "현지인들이 조잡한 위원회 비슷한 것을 꾸려 경제적인 저항을 자행하고 있다면 우리는 더 수준 높은 위원회를 꾸려 이에 맞서면 됩니다. 자유 무역 이념이 지지받던 당시 보호무역주의를 옹호했던 인물, 노동-무역-산업부의 젊은 국장 히르슈펠트는 총학생회 협력자 내에서 유망받는 경제학자로서 우리는 그를 공식적으로 등용하여 우리의 자체적인 경제를 건설할 것입니다."
 COU_focus_expansion_of_protectionism: "보호무역주의 확대"
 COU_focus_expansion_of_protectionism_desc: "히르슈펠트는 강력한 보호무역주의 지지자로서 마비 상태의 산업을 보호하고 새로이 육성하기 위해 현지인 국가로 제한하던 관세의 부과를 확대시키고 수입 할당, 보조금 지급 기한을 연장할 것을 요청했습니다."
 COU_focus_plan_de_vos_tinbergen: "플랑 드 보스-틴베르겐"
 COU_focus_plan_de_vos_tinbergen_desc: "1935년 고안되어 제 빛을 보지 못한 이 계획은 하인 보스와 얀 틴베르겐이 공동으로 작성한 계획으로서, 재무실이 참여하여 새로이 작성될 이 계획은 기업-노동자-행정위원회가 조정할 수 있는 일반경제위원회를 통해 2억 엔을 공공 사업에 투자하여 20만 명을 고용하고 승수 효과를 활용해 노동계급의 구매력을 높이고 경제를 활성화하는 것을 계획합니다."
 COU_focus_currency_unification: "통화 통일"
 COU_focus_currency_unification_desc: ""
 COU_focus_abandon_the_gold_standard: "금본위제 일부 재도입"
 COU_focus_abandon_the_gold_standard_desc: ""
 #COU_focus_modernizing_agriculture: "농업 현대화"
