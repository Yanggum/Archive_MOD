 #총학생회 국민정신
 ##START 
 COU_admin_confusion:0 "행정 혼란"
 COU_admin_confusion_desc:0 "총학생회는 대전이 이후 통제를 상실했으며 이러한 행정 혼란은 한동안 지속될 것으로 보입니다."
 COU_admin_confusion_tooltip:0 "제거 시: '§Y회복된 학생회의 권위§!' 사건 발생."
 COU_chronic_principledism:0 "정립되지 않은 방위군"
 COU_chronic_principledism_desc:0 "방위군은 대전이 이후 생텀 타워를 지키고 키보토스의 수도인 D.U.를 보호하기 위해 행정위원회의 만장일치로 창설된 총학생회의 군 조직입니다. 그러나 총학생회가 처음으로 보유하는 대규모 군사 집단이라는 점에서 군 조직의 정립과 개선이 필요합니다."
 COU_chronic_principledism_tp_army:0 "나태해진 육상방위군"
 COU_chronic_principledism_tp_army1:0 "[COU_CCP_ARMY]"
 COU_chronic_principledism_tp_navy:0 "간소화된 해상방위군"
 COU_chronic_principledism_tp_navy1:0 "[COU_CCP_NAVY]"
 COU_chronic_principledism_tp_air:0 "경험이 부족한 항공방위군" 
 COU_chronic_principledism_tp_air1:0 "[COU_CCP_AIR]"
 COU_chronic_principledism_tt: "[COU_CCP_ARMY][COU_CCP_AIR][COU_CCP_NAVY]"
 COU_CPT_tooltip:0 "§Y$COU_chronic_principledism$§! 변동치"
 COU_Perfidus:0 "페르피두스"
 COU_Perfidus_desc:0 "벨기에의 무조건적인 항복 선언 이후 이루어진 통치 안정화 과정에서, 시라누이 카야를 필두로 한 방위실은 우리에게 협조적인 현지인들을 등용해 통치에 사용할 것을 제안했습니다. 이들은 공식적으로는 협력자라고 지칭되지만 이들은 보통 라틴어로 페르피두스, 배신자로 불립니다."
 COU_Perfidus_tooltip_modf:0 "£decision_icon_small §Y결정 해금§! : 페르피두스"
 COU_Perfidus_tooltip:0 "§Y$COU_Perfidus$§! 변동치"
 COU_industry:0 "행정 주도 경제"
 COU_industry_desc:0 "총학생회라는 거대한 관료 집단의 특성상 이들이 국가로 재편되었음에도 불구하고 과거의 유산은 여전히 남아 있습니다. 총학생회의 경제는 시장에 맡겨진 것이 아니라, 행정위원회의 서류 위에서 움직이니까요."
 #ADD 
 COU_name_of_the_student_council:0 "학생회의 권위"
 COU_name_of_the_student_council_desc:0 "총학생회가 비록 대전이 이후 예전과 같은 통제력을 발휘하지는 못하지만, 총학생회는 모든 학원을 총괄하고 중재하는 '유일한' 이들로서 비록 퇴색되었다고 하더라도 무시할 수 없는 권위와 범학원적 영향력을 끼칩니다." 
 COU_local_lost_techonology:0 "일부 재설계된 키보토스 기술"
 COU_local_future_techonology:0 "재설계된 키보토스 기술"
 COU_service_department_problem:0 "항명하는 용역부"
 COU_service_department_problem_desc:0 "정당한 대금을 지불하지 않았다는 이유로 용역부원들 중 일부는 우리에게 고용되길 꺼리고 총학생회에 고용되는 것은 수치라며 선동합니다."
 COU_service_department_problem_2:0 "용역부 대금 지불"
