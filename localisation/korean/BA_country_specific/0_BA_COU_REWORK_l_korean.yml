 COU_mc_get_some_break:0 "휴식 시간 갖기"
 COU_mc_get_some_break_desc:0 "너무 일에 몰두할 필요는 없습니다. 조금 정도는 쉬었다 해도 괜찮을 것입니다. 왜냐하면 저는 초인이니까요."
