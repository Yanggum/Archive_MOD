 COU_focus_petition_45_desc:0 "최근 총학생회가 해군을 간소화하는 조치를 취하고 해군에 관련한 예산을 대폭 삭감하거나 신규 함정 건조 계획 등을 모조리 취소하거나 축소하면서 현지인으로 이루어진 함대와 해군 장성들은 불만을 드러내왔고, 이러한 45인이 모여 행정위원회로 공동 명의로 탄원서를 제출하였습니다. 해군에 대한 관심은 지속되어야 하며, 이들의 탄원서는 수용될 것입니다."
