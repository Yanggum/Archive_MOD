 COU_focus_offensive:0 "정신 개조"
 COU_focus_offensive_desc:0 "군대에서 나약해빠진 정신이란 곧 죽음을 뜻합니다. 이곳의 인류는 키보토스인을 어떻게 죽일 수 있을 지에 대해 끝도 없이 훈련받을 것이고, 나약한 규율과 정신 상태는 곧 죽음과 패배를 뜻합니다. 그런 일은 발생해서는 안 됩니다. 하루빨리 정신 개조를 시행해야 합니다."
 COU_focus_spirit_of_chasseurs_ardennais:0 "샤쇠르 아르데네의 정신"
 COU_focus_spirit_of_chasseurs_ardennais_desc:0 "샤쇠르 아르데네는 벨기에의 멧돼지 문양을 단 정예부대였습니다. 이들은 대전이 당시 극한의 열세 상태에도 불구하고 마치 멧돼지처럼 '저항하고 물어뜯어' 우리에게 큰 피해를 준 적이 있지만, 이들의 숭고한 정신은 본받을 필요가 있습니다."
