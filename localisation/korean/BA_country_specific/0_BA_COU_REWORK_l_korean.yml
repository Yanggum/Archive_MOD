 ###육군 
 COU_focus_build_military_culture:0 "규율 강화"
 COU_focus_build_military_culture_desc:0 "육상방위군은 1935년 창설 이래로 '정말 놀라운' 규율과 규범을 보였습니다. 훈련을 자주 빼먹는 것은 기본에 전투를 회피하고 비용을 횡령하는 등 큰 문제가 많았습니다. 육상방위군이 군대의 기능을 하기 위해선 흘러빠진 규율의 강화가 우선적입니다."
 COU_focus_defensive2:0 "특이 상황을 인정" #이거 id랑 gfx코드가 같으면 해당 gfx로 출력되는구나;;
 COU_focus_defensive2_desc:0 "헤일로 보병 군대를 구성하는 대다수는 아직 앳된 고등학생 혹은 그 이하일 수도 있습니다. 그러한 그녀들에게 가혹한 군대식 규율과 엄격한 상하 관계는 너무 가혹한 처사입니다! 이러한 특이 상황을 인정해 너무 가혹한 처사는 행하지 않는 것이 옳은 방법일 수 있습니다."
