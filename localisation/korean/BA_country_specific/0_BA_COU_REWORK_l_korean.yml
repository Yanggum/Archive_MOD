 COU_focus_eco_rework_the_dead_lands: "저지대 펌프 설치 의무화"
 COU_focus_eco_rework_the_dead_lands_desc: "자위더르 방조제가 재건되었지만 여전히 낮은 저지대의 지형적 특성으로 인해 땅이 물렁물렁하고 불완전한 기반을 가지고 있습니다. 이를 타파하고 침수의 피해를 온전히 마무리짓기 위해선 펌프 설치를 의무화해야만 합니다."
 COU_focus_rework_our_roads: "하이랜더 열차 비축분 확보"
