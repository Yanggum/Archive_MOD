 ##START 
 COU_admin_confusion:0 "행정 혼란"
 COU_admin_confusion_desc:0 "총학생회는 대전이 이후 통제를 상실했으며 이러한 행정 혼란은 한동안 지속될 것으로 보입니다."
 COU_admin_confusion_tooltip:0 "제거 시: '§Y회복된 학생회의 권위§!' 사건 발생."
 COU_chronic_principledism:0 "방위군"
 COU_chronic_principledism_desc:0 "방위군은 대전이 이후 생텀 타워를 지키고 키보토스의 수도인 D.U.를 보호하기 위해 행정위원회의 만장일치로 창설된 총학생회의 군 조직입니다. 그러나 낮은 모집률을 우려한 과도한 월급과 혜택으로 사단 각각의 질은 높아졌지만 우리가 대규모 전쟁을 치를 능력을 상실하게 했습니다."
 COU_chronic_principledism_tp_army:0 "나태해진 육상방위군"
 COU_chronic_principledism_tp_army1:0 "[COU_CCP_ARMY]"
 COU_chronic_principledism_tp_navy:0 "간소화된 해상방위군"
 COU_chronic_principledism_tp_navy1:0 "[COU_CCP_NAVY]"
 COU_chronic_principledism_tp_air:0 "경험이 부족한 항공방위군" 
