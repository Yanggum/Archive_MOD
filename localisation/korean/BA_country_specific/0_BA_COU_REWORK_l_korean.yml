 COU_focus_black_coffee_desc:0 "시라누이 카야의 한 달간의 근신은 고통이 아닌 확신을 주었습니다. 기존의 지지부진함으로는 총학생회의 혼란을 결코 잠재울 수 없다는 확신 말입니다. 세상에는 시간이 흘러도 변하지 않는 것이 있습니다. 그것은 통제 위에 세워진 완벽한 질서에 대한 갈망, 그리고 그 질서를 세울 수 있는 '초인' 이라는 이치입니다."
 COU_focus_questions_about_the_handover_procedure:0 "인계 절차에 문제 제기"
 COU_focus_questions_about_the_handover_procedure_desc:0 "나나가미 린이 간과하고 있는 것은 총학생회장의 실종 이후 우리가 발견한 총학생회장의 일기장입니다. 원래라면 샬레의 지하실 어딘가에 보관되었어야 했을 것 같은 총학생회장의 일기장을 우리가 우연하게도 손에 넣게 되었고, 카야가 개인적으로 그동안 관리해오고 있었습니다. 그러나 린을 탄핵시키기 위한 필수적인 과정이라면 내용을 '살짝 조작'해 나나가미 린 대행 체제 자체에 결함을 만들 수 있을 것입니다."
 COU_focus_without_rin_royalists:0 "통괄실 배제"
 COU_focus_without_rin_royalists_desc:0 "통괄실의 정치적 영향력은 현 시점에선 매우 막대하기 때문에, 우리가 함부로 그들을 건들 수 없습니다. 그러나 통괄실이 부패의 온상임이 공공연해지고 반대파의 활동이 융성해지고 있는 지금, 의도적으로 각 실장들과 협력해 통괄실을 '배제' 하는 형식으로 흘러간다면 그들의 영향력은 큰 타격을 입게 될 것입니다."
 COU_focus_talk_with_aoi:0 "아오이와의 만남"
 COU_focus_talk_with_aoi_desc:0 "재무실장 오키 아오이는 린 대행의 신임에 의문이 제기된 이후 꾸준히 영향력을 확대해 왔으며, 재무실장이라는 특성상 여러 부서에도 큰 영향력을 끼칠 수 있는 만큼 재무실과 오키 아오이의 포섭은 최우선적으로 이루어져야만 합니다."
 COU_focus_intentional_manipulation:0 "의도적 조작"
 COU_focus_intentional_manipulation_desc:0 "총학생회 행정위원회의 임원들이 세상에서 그 무엇보다 싫어하는 것은 거짓말과 부패, 그리고 조작입니다. 나나가미 린 대행의 정치적 목숨에 일격을 가할 수 있는 효과적인 방법은 의도적인 서류 조작을 통하여 린 대행에 대한 신임을 무너뜨리는 것입니다."
 COU_focus_rin_getout_please:0 "탄핵 결의"
 COU_focus_rin_getout_please_desc:0 "때가 되었습니다. 가슴만 크고 그 실속은 보잘것없는 나나가미 린 대행의 신임이 바닥까지 떨어졌습니다. 카야야말로 정당한 새 대행으로 지목받는 지금이야말로 린 대행을 권좌에서 끌어내릴 시간입니다."
