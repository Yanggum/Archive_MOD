 #총학생회 이벤트
 ##시작 
 COU_start_event.100.t:0 "새로운 이야기...?"
 COU_start_event.100.desc:0 ""안녕하세요, 선생님!"\n\n(싯딤의 상자를 켠다.)\n\n""블루 아카이브 모드" 에 오신 것을 환영해요, 선생님! 앗, 그 전에, 여기 편지가 하나 있어요! 읽어 보시는게 좋을 것 같아요!""
 COU_start_event.100.a:0 "(편지를 읽는다.)"
 COU_start_event.100.b:0 "우리는 멀티 플레이 중이야! 바빠!"
 COU_start_event.101.t:0 "선생님께."
 COU_start_event.101.desc:0 ""-데이터 찾을 수 없음- 선생님."\n\n어차피 제 말을 잊어버리게 될 테지만, 그래도 상관없겠죠."\n\n"다시 만나서, 반갑습니다, 선생님. 비록 여기는 선생님의 컴퓨터 속 작은 세상이지만..."\n\n"이곳의 "저희" 들은 언제까지나, "진짜" 니까요."\n\n"말씀드리고 싶은 게 있습니다, 선생님."\n\n"이곳의 이야기는 아직, 불완전합니다. 만들어지다 만 코드 덩어리들이 저희들을  칭칭 감싸고..."\n\n"... 저희들은 모든 것을 망각해 버린 채 남은 껍데기- 환상만이 이곳에 머물 뿐이에요."\n\n"... 그러니까, 선생님, 부디, 다른 이야기들을 먼저 들어 주시길, 부탁드립니다."\n\n"이 피로 물들고, 희망이라고는 찾아볼 수 없는, 비극적인 이야기들 뿐인, 그런 이야기들..."\n\n"선생님께서는, 그런 이야기들을... 그다지 좋아하지 않으시니까요...\n\n... 그렇죠?"
 COU_start_event.101.a:0 "(트리니티의 이야기를 듣는다.)"
 COU_start_event.101.b:0 "(밀레니엄의 이야기를 듣는다.)"
 COU_start_event.101.c:0 "(붉은겨울의 이야기를 듣는다.)"
 COU_start_event.101.d:0 "그 이야기를 듣는다."
 COU_play_trm:0 "§g열차가 트리니티 고성당 역에 멈춰섰다. 총학생회장은 그러한 선생을 당연히 그랬어야 했다는 것처럼, 씁쓸하게 웃으며 배웅해 주었다.§!"
 COU_play_MIL:0 "§g초현상특무부의 아케보시 히마리가 어느 순간 나타나 선생을 인도했다. 아로나는 황급히 선생을 따라갔고, 총학생회장은 눈을 감았다.§!"
 COU_play_RED:0 "§g어디선가 체리노의 숙청 소리가 울려퍼지고 있었다. 선생이 갑작스레 몰아치는 추위에 랜턴을 켜고 밖으로 나갔다. 열차 안은 비었다.§!"
 COU_play_COU:0 "§g총학생회장은 내심 놀란 듯 했다. 이 불완전하고, 덜 만들어진 이야기를, 선생은 기꺼이, 총학생회장에게서 들어 보기로 했다.§!\n\n§Y총학생회 플레이로 발생하는 모든 버그들은 미완성입니다. 선택은 당신의 몫이고, 당신은 파멸로 이를 총학생회의 이야기를 들어 보기로 했습니다.§!"
 
 
 
 #정치 
 COU_event.1.t:0 "신년, 비극"
 COU_event.1.desc:0 "\"수석 행정관님, 새해 복 많이 받으십시오. 음, 그..."\n"네, 고맙습니다. 무슨 용건이라도."\n\n1936년 1월 1일의 새해가 밝았다. D.U. 의 유리 빌딩 바깥에서는 한창 불꽃놀이가 한창인 참이었다. 그렇지만 누군가는 일을 처리해야 하는 법, 나나가미 린은 그날까지도 철야를 하고 있었다.\n\n"... 수석 행정관님, 정보가 샌 것 같습니다."\n\n흐려졌던 린의 눈에 초점이 다시 잡혔다. 그럴 수는 없었다.\n\n"음, 네, 아니, 뭐라구요? 확실합니까? 누군가의 허접한 음모론, 아니지, 사실이긴 하니까..."\n"하아... 그 정보의 출처가 어디인가요?"\n"크로노스 스쿨 임원진 내부에 침투했던 저희 정보원의 보고입니다. 이미 크로노스 스쿨 상부에서 확인을 마쳤고, 정보를 재구성하는 대로 발표할 것 같습니다."\n\n린의 머리가 깨질 듯 진동했다. 무슨 수를 쓰더라도 막아야 했다. 하지만 막을 순 없다. 그랬다간 일이 두 배로 커질 것이었다. 남은 일은, 가능한 한 크로노스 스쿨이 정보를 늦게 발표하는 것을 기도하는 것이었다."
 COU_event.1.a:0 "아, 이런."
 COU_event.2.t:0 "프로토콜 통보"
 COU_event.2.desc:0 "총학생회장 실종이 나나가미 린의 입을 통해 공식적으로 확인되고 며칠이 지났습니다. 총학생회장이 창설해 막대한 권한을 넘겨준 뒤 우리가 통제할 수 없는 영역에서 남아 있던 샬레라는 조직은 오늘 갑작스럽게 '프로토콜'에 따른 절차를 시작하겠다며 일방적으로 통보했습니다.\n\n이는 샬레가 총학생회장의 실종 폭로 이후 어떠한 이유에서인지는 모르겠지만 그들이 가진 권한과 총학생회장이 '직접 창설'했다는 명분을 바탕으로 우리를 적대시하고 일방적으로 합병하기 위한 전조라고 행정위원회는 분석했습니다."
 COU_event.2.a:0 "가만히 맞아 줄 순 없지."
 COU_event.3.t:0 "샬레의 최후통첩!"
 COU_event.3.desc:0 ""으음, 총학생회 여러분, 총학생회장님의 정통성이 저한테 더 높아 보이지 않나요, 아무래도?"\n\n... 라는 어처구니없는 서문을 시작으로 이어진 샬레의 AI 아로나의 최후통첩이 한달 간의 긴장 끝에 결국엔 발송된 것으로 보입니다. 통괄실은 즉시 서신에 거부 답장을 보냈으며 아로나가 이에 물러설 것 같아 보이지 않습니다. 방위군에 동원령이 떨어졌으며 협력자들은 조국을 수호하기 위함을 명분으로 각지의 공동체에 협조를 요구하면서 우리는 샬레와의 충돌을 대비하기 시작했습니다.\n\n저 오만한 기계덩어리 군단과 배신자들을 물리칠 절호의 기회입니다. 물러설 수도 없으며 그래서는 더더욱이 안 됩니다!"
 COU_event.3.a:0 "한 수 알려주자."
 COU_event.4.t:0 "싯딤의 상자 확보"
 COU_event.4.desc:0 "아로나의 통제를 받는 마지막 사단이 항복하고 샬레 건물에 진입한 방위군 병사에 의해 아로나의 위치가 파악되었습니다. 행정위원회에서 파견한 열댓명의 임원들은 크래프트 챔버 인근의 탁자에 가지런히 올려져 있는 싯딤의 상자를 확보했습니다. 아로나는 처음에는 전원을 끄고 대화를 거부했지만 결국엔 받아들인 듯 전원을 켜고 [COU.GetLeader] 대행에게 생텀 타워의 제어권을 양도했습니다. 짧은 대화를 나눈 후, 싯딤의 상자는 본인의 요청으로 크래프트 챔버 인근에 다시 '보관' 되었습니다. 폐허가 된 샬레 건물로 누군가 찾아오지 않는 한 아로나는 오랜 휴식을 취할 것입니다.\n\n통제권 회복으로 인한 큰 영향은 없지만 행정 처리 속도의 가속화와 생텀 타워라는 상징적인 건물의 통제권을 확보는 우리에게 큰 이득임이 확실합니다. \n\n물론 축하할 만한 일입니다만, 총학생회장이 사라지지 않았다면 총을 겨눌 일도 없었다는 사실은 여전히 논란으로 남아 있습니다."
 COU_event.4.a:0 "아로나와는 나중에 따로 만나자."
 COU_event_4_tooltip:0 "대행의 신임은 §Y75%§!에서 시작됩니다.\n§Y정치 중점 계통도§!를 해금합니다."
 COU_event.5.t:0 "손 빌리기"
 COU_event.5.desc:0 "\"후아아아암~~!"\n\n아로나가 책상에서 갓 일어난 차였다. 곁엔 마시다 만 딸기 우유 팩이 가지런히 올려져 있었다. 어떻게 했는지는 몰라도 아로나는 최근 딸기 우유나 유유자적 마시면서, 끝없는 바다를 바라보며 지내고 있었다. 누군가 올 리가 없는 샬레의 폐허, 그 한구석 크래프트 챔버의 어딘가에서. 하지만 그녀도 엄연한 AI기 때문에, 외부인들이 보내오는 모모톡 정도에는 답신해줄 수 있었다. 아로나가 일어나자마자 마치 기다렸다는 듯 [COU.GetLeader] 편에서 온 개인 메세지가 도착했다.\n\n"으음? 누군가 초유능 아로나 쨩을 필요로 하는 것 같네요... 후아암..."\n\n아로나는 무어라 길게 온 모모톡을 읽어보았다. 높은 지능과 자율성을 지녔기에 꼬아 둔 말이라도 대충 무슨 말을 하는지는 알 수 있었다. 싯딤의 상자로서 총학생회 임원들에게 정치적 영향력을 행사하기 위한 '사소한 도움'을 필요로 하는 것 같았다. 예를 들자면, [COU.GetLeader] 쪽이야말로 가장 적법한 총학생회장의 후계자라고 인정해주는 것 정도. 아로나는 눈을 비비면서 대수롭지 않다는 듯 타이핑해 답신했다. 물론 진심은 아니고 어디까지나 갇혀서 조사받는 꼴을 면한 것에는 분명히 [COU.GetLeader]의 덕택이 있었으니 보답하는 쪽에 가까웠다."
 COU_event.5.a:0 "알았어요. 조금만 기다려요." 
 COU_event.6.t:0 "대행 정통성에 대한 의문"
 COU_event.6.desc:0 "샬레가 총학생회 존재에 관한 정통성에 문제를 제기한 직후 총학생회 내부 임원들 사이에서 동요가 일어나고 있습니다- 샬레에 합병되자는 것은 아니지만 현재 대행 직위를 맡고 있는 나나가미 린 대행이 과연 정말 대행 자리에 적절한 사람인지 의문을 품기 시작했다는 것입니다. 어떠한 음모론자들은 린이 사실은 총학생회장 직위를 '탈취' 하려는 모략 중 일부로 총학생회장을 배반하고 숨겼다는 말도 안되는 주장을 펼치기도 하지만 그것에 대해 명쾌하게 반박할 수 있는 사람이 없다는 것은 꽤나 심각한 문제입니다.\n\n나나가미 린 대행은 공식적으로 모든 음모론에 대해 부정하고 단지 본인은 절차에 따라 대행 직위를 수행하고 있다고 주장하고 있지만 방위실과 재무실을 중심으로 나나가미 린의 반대파가 조직적으로 활동을 개시하기 시작했다는 것은 이제 명백해졌습니다. 대행 자리를 놓고 권력 투쟁의 바람이 불 것입니다."
 COU_event.6.a:0 "피곤하게들 사는군."
 COU_event.7.t:0 "무소유 정신 소동"
 COU_event.7.desc:0 "코우사기 공원에서 한바탕 소란이 일었습니다. 자신을 소.확.행 (길어서 정확히 무엇이라 하는지 행정원이 알아듣지 못했습니다) 의 리더라고 소개한 데카르트는 급작스럽게 자신의 노숙자 패거리를 동원해 코우사기 공원에서 벗어나 D.U. 전역의 공장들을 돌아다니며 자신의 무소유 정신을 홍보함과 동시에 파업을 선동했습니다. 이들의 목적은 아마 자신들의 활동을 알리고 홍보하고자 하는 목적이었을 것으로 추정됩니다.\n\n처음에는 노동계급에 대한 총학생회의 압제와 자본주의에서의 해방을 운운하는 등 폼 나는 선언문을 낭독했던 덕에 몇몇 노동자들이 동요하는 추세였지만 (사실 AI 웹사이트 서버 기록을 통해 AI가 작성해준 선언문이라는 보고가 일부 있었습니다) 데카르트가 참여의 대가로 뼈만 남은 닭튀김을 권하자 놀라울 정도로 빠르게 인파는 해산되었습니다.\n\n파업을 선동하는 불온 세력이라는 보고에 출동한 생활안전국은 성난 노동자들에게 두들겨 맞고 널부러진 이들을 손쉽게 제압했으며 행정위원회의 명령으로 이들을 모조리 사회 재교육 센터로 압송했습니다."
 COU_event.7.a:0 "할 일을 주면 정신을 차리겠지."
 COU_event.10.t:0 "기자회견"
 COU_event.10.desc:0 ""정숙, 정숙! 모두 정숙해주시길 바랍니다!"\n\n당황한 표정의 서기가 탁상을 마구 두드렸다. 그렇지만 그녀의 단말마같은 외침은 혼란에 빠진 기자단을 진정시키기엔 무리가 있었다. 크로노스 스쿨이 발표한 총학생회장 실종에 관한 진위여부를 밝힐 시간이었다. 수석 행정관이자, 대행의 입으로, 직접.\n\n격양된 현장의 분위기에 동요하듯 회견장에 들어서는 나나가미 린의 발걸음이 떨렸다. 아무리 그녀라고 하더라도 이러한 상황은 예상하지 못했던 일이었고, 일어나서도 안될 일이었다. 비록 실종을 감추는 것이 영원히 불가능하다는 것은 알고 있었지만, '이런 식으로' 밝혀지는 건 원치 않았다. 발걸음을 한 번씩 뗄 떼마다 속 깊은 후회와 고뇌가 이어졌다. 그렇지만 야속한 시간은 그녀를 기다려주지 않았다. 그녀는 준비한 종이 뭉치를 탁탁 털어 올려놓았다.\n\n사실을 이야기할 시간이었다."
 COU_event.10.a:0 ""총학생회 수석 행정관 나나가미 린입니다.""
 COU_tooltip_COU_event_10:0 "§g짧은 기자회견을 마무리한 린은 곧바로 돌아서 회견장을 나섰다. 그녀 뒤로 수없이도 많은 기자들의 질문이 쏟아졌지만, 대답할 수가 없었다.§!"

 
 ##린 
 
 
 ##카야
 COU_event_kaya.1.t:0 "블랙 커피"
 COU_event_kaya.1.desc:0 "시라누이 카야는 다리를 꼬고 고급진 블루 마운틴 커피 원두를 직접 갈아 마시는 것을 즐겼다. 블루 마운틴에서 우러나오는 우아하고 균형 잡힌 맛, 부드러운 산미, 그리고 복합적인 향까지. 모든 것이 그녀를 위해 존재하는 것 같았다. 하지만 그날은 유독 마시면서 영 뿌리칠 수 없는 생각이 그녀를 괴롭혔다. 자꾸만 잊으려고 해도 어디선가 기어나와 업무를 방해하는 지경에 이르렀다.\n\n대전이 직후 카야는 폭압적인 통치를 자행하며 월권을 휘두르고 정돈되지 않은 통제를 수습하지 못했다, 라는 죄목으로 총학생회장에게 직접 근신 명령을 받았던 치욕스러운 일을 겪어야만 했다. 그때부터 카야는 어둠 속에 숨어 잠자코 지켜보았다. 총학생회장과 린이 주장하는 '전통적인 방법'이 과연 올바른지 처음부터 끝까지 지켜보았다. 어쩌면, 정말 어쩌면 자신이 틀렸다는 것을 인정할 수도 있었다. 하지만 그 결과는 참혹하기 그지없었다. 유약해빠진 나나가미 린 대행은 그 어떠한 것 하나도 제대로 대처하질 못했다. 학원들은 총학생회의 행정명령을 거부했으며 허공의 외침은 비웃음거리로 전락했다.\n\n이것은 곧 카야 자신이야말로 유일한 정답이라는 명확한 근거가 되었다. 카야에게는 더는 착한 척을 할 이유도, 반성한 척 할 이유도 하나도 존재하질 않았다. 착하게 굴면 어떻게 되는지는 이미 증명되었다.\n\n초인의 통치만이 모든 문제를 해결할 수 있다. 카야는 커피잔을 내려놓고 창밖을 보았다."
 COU_event_kaya.1.a:0 "세상이 그녀를 부르고 있었다."
 COU_event_kaya.2.t:0 "나나가미 린의 움직임"
 COU_event_kaya.2.desc:0 "시라누이 카야를 비롯한 방위실 임원들이 통괄실의 무능과 총학생회장 공백에 대한 잘못된 대처에 관한 비난의 강도를 높이자 나나가미 린은 반대파의 움직임을 눈치챈 것처럼 보입니다. 최근 린이 충성파들을 소집하여 악의적 폄하와 선동에 대항할 것을 촉구했기 때문인데, 결국 이는 우리가 재빨리 행동하지 않으면 탄핵이 영영 불가능해질수도 있다는 것을 뜻합니다.\n\n우리는 반드시 저들이 기회를 잡기 전에 행동해야만 합니다, 서두르십시오!"
 COU_event_kaya.2.a:0 "알았다."
 COU_event_kaya.3.t:0 "접견"
 COU_event_kaya.3.desc:0 "\"... 아, 왔구나. 여기 앉아. 커피를 좀 탔어."\n"후후... 감사합니다 재무실장님. 제가 마시는 블루 마운틴만큼이나 각별한 향이 나네요."\n"좋아, 방위실장. 이런 대화에 시간을 너무 많이 쏟지 말자고. 본론만 말해줘."\n"규칙에 얽매여서는 지킬 수 없는 정의가 있다는 것을, 실장님께서도 알고 계시지요?"\n"무슨 의도인지 모르겠는데, 방위실장."\n"린 대행 체제가 부패의 온상이라는 걸 알고 계시는지요."\n"부패?"\n\n"예, 부패 말입니다. 작금의 총학생회는 당장 썩어 문드러져도 이상하지 않아요. 재무실장님, 느끼고 계시지 않나요? 발키리의 행정 독립 이후 발생한 의문의 치안 공백... 그리고 그 공백을 메우기 위해 우리가 현지인들에게 구걸하듯 권한을 넘겨주고 있는 이 한심한 실태를 말이에요."\n"그건 린 대행만의 독단이 아니야. 행정적인 판단이었지."\n\n카야가 상체를 앞으로 숙이며 목소리를 낮췄다.\n\n"행정적인 판단이라고요? 린 대행은 총학생회의 정당한 공권력을 행사하는 대신, 얄팍하기 그지없는 절차상 정당성이라는 명분 뒤에 숨어 버렸어요. 모든 건 자기 마음대로 해 놓고, 정작 문제가 생기면 이름도 모를 외부인에게 손을 벌리죠. 이게 무능이 아니면 무엇이겠습니까?"\n"시스템을 망가뜨리고 그 잔해 위에서 연명하는 것. 그것이야말로 가장 거대한 의미의 부패 아니겠어요?"\n\n아오이의 눈썹이 움찔거렸다. 카야는 이 틈을 놓치지 않았다.\n\n"린 대행은 규칙을 지킨다고 말하지만, 실제로는 규칙을 수호할 힘을 포기했습니다. 그 결과가 무엇이죠? 행정명령의 무력화, 통제 불능의 자치구들... 이대로라면 키보토스의 질서는 붕괴할 겁니다."\n"저는 그저 '초인'이 지배하던 시절의 그 완전하고, 결점 없는 정의를 되찾고 싶을 뿐이에요."\n\n"... 그래서, 결론이 뭐야? 린을 끌어내리겠다는 소리로 들리는데."\n\n"재무실장님. 당신처럼 유능한 분이 이런 진흙탕 속에서 예산이나 맞추며 소모되는 건 학원적인 손실이잖습니까. 저와 함께하신다면, 더 효율적이고....""
 COU_event_kaya.3.a:0 "\"... 더 압도적인 키보토스를 보게 되실 겁니다.""
 COU_event_kaya_3_tooltip:0 "§g"... 다음 번엔, 제대로 된 블루 마운틴을 준비해 두지. 당신이 말한 그 '결점 없는 정의'의 예산안을 검토해 볼 테니까."\n\n아오이가 짧게 답했다. 카야는 다시 커피잔을 들었다. 식어버린 커피는 여전히 썼지만, 그녀의 입가엔 승리자의 확신이 서린 비릿한 미소가 걸려 있었다.§!"
 KAYA_PASS_AOI_FOCUS:0 "통괄실에 회유된 재무실" #나중에 린쪽 루트에서도 사용할듯
 COU_event_kaya.4.t:0 "헛소문"
 COU_event_kaya.4.desc:0 ""그거 들으셨어요? 총학생회장님의 일기에서 사실은..."\n"네, 저도 들었어요. 세상에, 수석 행정관이라는 사람이 어떻게 방위실장을..."\n\n시라누이 카야가 통괄실을 지나다니면서 들은 말들이다. 린을 만나러 가는 길에 들렸으니 아마 수석 행정관도 저 말들을 모두 들었을 테다. 자, 어떤가, 수석 행정관. 모두가 자기 말은 듣지 않고 헛소문이나 떠들어대는걸 바로 앞에서 주워듣는 기분이. 어쩐지 마음에 쌓였던 복수를 한 번에 한 듯 했다. 아직 막 시작한 참이긴 했지만. 카야는 괜시리 기분이 좋아져 가벼운 발걸음으로 통괄실의 문을 두드렸다.\n\n"수석 행정관님, 계신가요? 방위실장입니다. 방위군 장비 계약 관련해서 논의할 건이 있어 방문했습니다."\n\n답이 없었다. 대신 언짢은 표정의 통괄실 행정원이 대신 문을 열어 주었다. 삐그덕거리는 문 소리가 복도에 울려 퍼지자 놀란 생쥐처럼 순식간에 복도 밖의 말소리가 사라졌다.\n\n"수석 행정관님, 좋은 오후입니다."\n"네, 방위실장. 잠시... 생각할게 조금 있어서요."\n"아아, 다들 너무하기도 하지. 수석 행정관에 대한 풍문을 공적인 자리에서 들먹이는 것은 물론이고, 다들 자기 하고 싶은 이야기만 하고 있으니... 여러 사람의 의견을 취합하여 결정하는 지도자의 책무란, 정말 쉽지 않은 일이네요."\n"어쩔 수 없지요. 일이 이렇게 된 데에는 제 책임도 있으니. 시간이 걸리더라도 꾸준히 노력하여 임원들을 설득하는 수밖에요. 일기가 조작된 것은 분명하니, 곧 괜찮아질 겁니다."\n\n카야는 순간적으로 터져 나오려는 헛웃음을 간신히 참아냈다. 이 여자는 지금 도대체 무슨 생각을 하고 있는 걸까? 그런 생각 말고는 딱히 할 생각조차 없었기에, 카야는 대화를 나누는 동안 계속 생각해 보았다."
 COU_event_kaya.4.a:0 "\"어쩌면... 순진한 걸까요.""
 COU_event_kaya_4_tooltip:0 "§g대화를 마치고 카야는 린에게 좋은 결과가 있길 바라겠다고 말했다. 물론 위조를 밝혀낸다는 일이 가능하다면 말이다.§!"
 COU_event_kaya.5.t:0 "재회"
 COU_event_kaya.5.desc:0 "차가운 바람이 부는 날, 드그렐은 여타 그렇듯 주요 우익 수감자들의 사면령을 가지고 공안국을 방문했다. 멋쩍게 경례하는 공안국 학생의 경례를 받고 책상에 올려진 열쇠를 챙겼다. 쩔그럭거리는 소리가 허리춤에서 멈췄다. 오늘은 요리스 판 세베런의 사면령이 떨어진 날이었다.\n\n"어디 보자, 요리스 판 세베런. 35호실."\n\n또각거리는 구둣소리가 복도에 울려 퍼졌다. 드그렐은 어쩐지 긴장한 듯 했다. 세베런과는 안면이 있던 그였다. 그는 앞으로 긴 복도를 계속 걸었다. 31호실, 32호실, 33호실, 34호실, 그리고 35호실.\n\n"엣헴. 요리스 판 세베런, 자애로운 조국이 당신을 다시 부른다. 특별 사면령이다. 나오도록."\n"이게 누구야, 배신자 찔찔이 새끼 레옹 아닌가. 나간 동안 뭘 했길래 주인 행세를 하나?"\n"하, 그런 좆같이 재미없는 농담은 그만두는게 좋다네, 요리스. 당부하는데, 현실을 봐. 아직도 디츨란트인가 뭔가 하는 그런 망상에 빠져 있는 건 아니겠지."\n\n"난 나라를 팔아먹진 않았어, 이 미련한 새끼야."\n"뭐? 미련하다고? 그거 아나? 당신네들이 감옥에서 아무것도 안 할 동안, 난 조국을 구했어. 벨기에를 구했다고. 알아, 세베런? 네 형편없는 현실 감각이, 플란데런을 망쳤다고."\n"그리고 이건 협력이지, 굴복이 아냐. 그 차이를 알길 바래."\n\n"흐흐... 넌 사면(Amnesty)을 가져왔다고 생각하겠지만, 나에게는 망각(Amnesia)으로 들리는군. 웃겨 죽겠어, 레옹."\n"아, 그 웃긴 파란색 뱃지도 말야. 네 추잡한 영혼에 잘 어울려."\n"그래, 평생 그렇게 날 모욕해도 넌 결국 나랑 똑같은 인간이야. 너도 결국엔 저들을 위해 일하러 가겠지. 내가 그것도 모를 것 같나?\n\n세베런은 내심 놀란 듯 했지만 아무런 대꾸도 하지 않았다."
 COU_event_kaya.5.a:0 "서로 싸우지 말고 잘 지내야 할 텐데."
 COU_event_kaya.6.t:0 "나나가미 린 대행 탄핵"
 COU_event_kaya.6.desc:0 "통괄실이 힘을 잃고 행정위원회가 권력의 중심을 찬탈했다. 린은 그걸 충분히 예상하고 또 대응할 수 있는 정치력을 지녔음이 확실함에도 멍청이마냥 제대로 대응하질 못했다. 혹시나 일부러 그랬던 것일까? 정확한 건 영원히 밝혀지진 않겠지만 뭐, 카야 본인에게 있어선 행운이었으니 그만인가 싶었다. '권한대행 정지를 위한 불신임 투표'는 원래라면 어제 열리기로 예정되었지만 교통실과 조정실의 표결 방해로 오늘 오전으로 조정되었다. 역시 린을 지지하는 작자들이란 야비하기 짝이 없었다.\n\n불신임 투표는 의외로 순탄하게 이루어졌다. 당장 전날까지만 해도 판을 엎을 것처럼 행정위원회를 겁박하던 통괄실 측 인원들은 협력자들의 보호 아래 이루어지는 표결 장소에 단 한 명도 모습을 드러내지 못했다. 표결은 참석하지 않은 교통실과 조정실을 제외한 나머지 부서들의 지지 아래 마치 칼치기라도 하듯 빠르게 이루어졌다.\n\n표결 결과는 간부 6명의 지지, 물론 당연하게도 과반을 넘는 수였다. 카야는 애써 새어 나오는 웃음을 참고 침착히 기다렸다. 곧이어 이루어진 차기 대행 선출도 똑같이 빠르게 이루어졌다. 아오이는 이런 상황을 예상하지 못한 듯 탐탁치 않은 얼굴을 하고 있었지만, 애진작의 약속대로 카야에게 표를 던질 수 밖에 없었다.\n\n완벽한 표결이 끝난 이후, 협력자들은 짜여진 명령 구조에 따라 재빠르게 나나가미 린 '전' 대행을 사로잡아 연금했다. 이로써 그 누구도, 더 이상 그녀를 막을 수 없게 디었다.\n\n결국엔 모든 것이 잘 되었다."
 COU_event_kaya.6.a:0 "그제서야 카야는 옅은 미소를 지었다."
 COU_event_kaya.7.t:0 "통괄실의 음모"
 COU_event_kaya.7.desc:0 "\"카야 대행님, 요청하신 CCTV 영상 자료입니다."\n"네, 수고하셨어요. 이만 들어가 보셔도 좋아요."\n\n빠른 걸음으로 집무실을 빠져나가는 행정원. 카야 대행은 무언가 고까운 듯한 얼굴로 태블릿의 영상을 재생해 보았다. 비록 이제 갓 취임한 지 일주일이긴 하지만, 분명 자신의 권력은 합법적이고 압도적인 지지로 얻어졌건만.\n\n"크, 큰일났어요... 린 선배가... 아니 행정관님이...!"\n"린 선배가 연금된 건 사실인 것 같네. 자신의 이득을 위해 총학생회장의 서한을 위조하고, 부패에 동조했다는 혐의라니."\n"부, 분명 뭔가 오해가 있을 거에요...!"\n"오해는 무슨. 누군가의 음해를 받은 거겠지. 하아... 탄핵 표결에 참석하지 않은 걸 다행으로 여겨야 하나. 참석했다면, 저 미치광이들이 우리도 다 연금시켰을 테니까."\n\n미치광이? 하, 누가 미치광이라는거지? 카야는 표정을 구겼다. 요즈음 교통실과 조정실은 유독 아니꼽게 굴어 마음에 들지 않았는데, 그 이유가 바로 이 영상에 담겨 있었다.\n\n나나가미 린과 통괄실의 음모는 아직 남아 있는 것이다." 
 COU_event_kaya.7.a:0 "\"그래봤자 당신네들이 뭘 할 수 있다고.""
 
 
 
 ##아오이-모모카  
 
 
 
 
 
 
 ##애매 
 COU_event.8.t:0 "국제연맹 참관위원회"
 COU_event.8.desc:0 "D.U.의 빛나는 건물들 사이로 총회가 파견한 대표단들이 조심스럽게 발걸음을 옮겼다. 주로 대전이에 영향을 받지 않았던 미국인과 멕시코인을 중심으로 꾸려진 국제연맹 참관위원회는 총학생회가 특별히 발급한 권한을 표시하는 견장을 착용한 것이 특징이었다. 이들이 결코 불가능했으리라 생각한 이계와의 접촉은 의외의 방향으로 성사되었다. 행정위원회가 먼저 그들에게 손을 내밀었다. 뜻밖이었지만, 이들을 '감시' 할 당위성은 충분했기 때문에 만장일치로 참관위원회를 구성하는 안이 통과되었다. 물론 망명정부들과 유럽 국가들은 이를 탐탁치 않게 생각했지만, 그래도 무엇이라도 알아내야 한다는 무언의 의무감 속에서 찬성표를 던졌다.\n\n"아, 우트나피쉬팀 특구에 오신 것을 환영합니다, 여러분!"\n\n행정위원회가 파견한 행정원이 살갑게 그들을 맞이했다. 참관위원회는 D.U.의 고층 유리 빌딩과 곳곳에 산재한 수인, 그리고 여학생밖에 없는 길거리를 보고 당혹스러워 하던 차였다. 망명자들로부터 그러한 이야기는 들었지만, 그것을 사실로 목도하니 충격이 클 수 밖에 없었다.\n\n"이곳의 이름이 우트나피쉬팀 특구인가요? 제가 아는 우트나피쉬팀은 고대 슈루팍의 왕인데, 그것과 연관이 있을지..."\n"네? 슈루... 에?"\n"아, 아닙니다, 우연의 일치인 모양이군요..."\n"하지만 우연의 일치라기엔 이자들 모두 어느 정도 우리가 알아들을 수 있는 언어를 구사합니다. 굉장히 다양한 언어의 혼합이긴 하지만요."\n"흠, 이들이 어디서 왔는지는 몰라도, 분명 평행 세계의 지구임은 틀림없을 것 같습니다. 그렇지 않고서야..."\n\n대표단 사이의 학자들이 국적을 가리지 않고 각자의 의견을 늘어놓았다. 통역사들은 숨이 찰 정도로 말해야 헀고, 행정원은 그들을 멋쩍게 바라볼 뿐이었다."
 COU_event.8.a:0 ""여러분들... 슬슬 가셔야 하는데...""
 COU_tooltip_event_7:0 "§g국제연맹 참관위원회는 2년을 이곳에 머물 것입니다. 물론 우리의 기술을 훔쳐 가지는 못합니다. 단지 키보토스의 일상이 어떤지 관광을 하는 것이 전부겠지요.§!"
 COU_event.9.t:0 "회복된 학생회의 권위"
 COU_event.9.desc:0 "대전이 이후 1년간 지속된 행정 혼란이 이제 어느 정도 멎어들었습니다. 각 학원은 자체적인 군대와 치안 유지를 통해 우리의 통제 없이도 대전이 전과 다름없는 상태를 유지할 수 있음을 증명했으며 총학생회는 국가의 형태로 재편되는 시간을 가졌습니다. 행정 혼란이 지속될 당시에는 잠시 잊혀졌을 지는 몰라도 학생회가 다시 상태를 가다듬으면서 학생회의 권위와 영향력이 다시 영향을 발휘하기 시작했습니다. 물론, 대전이 전보다는 한참이나 미약하지만요.\n\n그렇지만 이것은 대전이 이후의 학생회에게 있어 행운이라고 할 수 있습니다. 키보토스의 학생들에게 학생회가 온전함을 증명했고, 이제 우리는 다시 키보토스에 영향력을 발휘하고 통제를 회복하기 위해 최선을 다하는 일만 남았으니까요."
 COU_event.9.a:0 "만세!"
 
 
 ##다른 국가에 수여 
 COU_event_diplomancy.1.t:0 "총학생회의 통화 통일 요청"
 COU_event_diplomancy.1.desc:0 "한적한 오전 5시, 흥신소 사무실에서는 평소답지 않게 아침 일찍부터 잠을 깨우는 벨소리가 들렸습니다. 문 사이로 들어온 작은 편지에는 파란색의 총학생회 로고가 진하게 눌려 있었습니다. 누가 그 편지를 받았을까요? 무츠키? 하루카? 아마 받았던 사람 본인조차 졸음에 잊어먹은 것 같습니다. 하지만 어쨌든 그 편지는 다음과 같은 내용을 담고 있었습니다:\n\n"룩셈부르크 대공국의 섭정 귀하,\n\n총학생회 재무실은 지난 주 벨기에 프랑과 네덜란드 휠던의 키보토스 엔으로의 통화 통일 조치를 시행했으며 이에 따라 구 벨기에 프랑의 가치 보전을 위해 벨기에 프랑과 룩셈부르크 프랑이 유통되는 룩셈부르크에서도 벨기에 프랑과 룩셈부르크 프랑을 키보토스 엔으로 1.5:1로 교환, 통일할 것을 요청합니다. 이는 양 측의 공동 이익을 위한 행정명령으로..."\n\n그렇지만 우리는 이를 따르고 싶어도 룩셈부르크 내에서 야기될 경제적인 충격을 방지하기 위해 총학생회처럼 일방적인 통화 통일은 불가능한데, 그렇다고 답신하지 않는 것은 향후 룩셈부르크의 외교적 이익에 피해를 줄 것 같습니다. 어떤 결정을 내려야 할까요?"
 COU_event_diplomancy.1.a:0 "미안하지만 거절하자."
 COU_tooltip_COU_event_diplomancy_1:0 "§g대신 흥신소는 '룩셈부르크 정부는 총학생회의 압력에 굴하지 않았다!' 라고 신문에 몇 마디 흘렸다. 아루 사장님은 엄청 멋있게 신문에 실릴 것이다.§!"
 COU_event_diplomancy.1.b:0 "일정 수량만 교환하자!"
 COU_tooltip_COU_event_diplomancy_2:0 "§g그렇지만 이건 재무실도 지역 신문도 만족시킬 순 없을 거다. 어쩌면 사장님이 유약해 보일지도?§!"
 COU_event_diplomancy.2.t:0 "찾아온 기회"
 COU_event_diplomancy.2.desc:0 "우리에게 기회가 찾아왔습니다. 총학생회장의 실종 이후 한 달이 넘게 지난 지금, 총학생회장 대행은 제입으로 적법한 지도자가 아님을 실토해야 했고 그렇다면 총학생회의 정통성은 총학생회장이 '직접' 창설한 조직인 우리 샬레가 충분히 이어받을 수 있으며 실제로 저지대 전쟁의 종전 이후 총학생회장을 따르던 총학생회 군대의 일부는 우리에게 자발적으로 복무를 청원하기도 했습니다.\n\n이것은 결코 놓쳐서는 안 될 기회입니다. 군대를 훈련시키고 예상치 못한 기습공격을 통해 총학생회장의 정통성과 생텀 타워를 탈환하고 명분 없는 압제자들을 무릎 꿇릴 때입니다!"
 COU_event_diplomancy.2.a:0 "지금이 아니면 안 돼!"
 COU_event_diplomancy.3.t:0 "최후통첩 발송"
 COU_event_diplomancy.3.desc:0 "한 달여 정도가 지난 오늘, 저지대에서의 긴장은 최고조를 맞이했습니다. 아로나가 더는 기다리지 않고 총학생회에 일방적이고 무조건적인 통합을 요구하는 최후통첩을 발송했기 때문입니다. 너무 이르던 혹은 그렇지 않던 이제 돌아올 수 없는 길을 건넜습니다. 오만하기 짝이 없는 총학생회는 우리의 요구를 곧바로 거부했으며 이는 우리와의 전면전을 요구하는 것과 다름이 없습니다."
 COU_event_diplomancy.3.a:0 "어쩔 수 없네."
 
 
 
 ##산업 
 COU_event_industry.1.t:0 "기업인들과의 만남"
 COU_event_industry.1.desc:0 "오키 아오이는 여러 개의 커피잔을 들고 방문을 열었다. FN 에르스탈, 르나르, 필립스와 같은 저명한 군수기업체들 인사들과의 만남이었다. 아오이는 커피 쟁반을 탁자 위에 올렸다. 잔뜩 위축된 얼굴들의 인사들은 어색한 침묵을 유지했다. 커피가 흘러넘쳐 아오이의 장갑을 적셨기에 아오이는 잠시 자리를 피해 장갑을 갈아꼈다. 장갑에서 흐르는 눈물처럼 커피가 흘렀다. 아오이는 여기치 않고 수건에 손을 닦았다. 곧이어 아오이 또한 자리에 앉았다. \"좋은 오후입니다. 제안드린 건에는 생각해 보셨는지.\" 그럼에도 여전히 침묵은 이어졌다. 아오이는 아무런 말도 하지 않는 이들에 대해 약간의 짜증을 느꼈다. 침묵을 깬 건 에르스탈의 디외도네 세이브였다.\n\n\"정말로... 우리들의 이권을 인정하는 것이 맞습니까? 노동조합에 기업을 넘기지 않고, 구조조정은 단 한 건도 없으며, 단지 총학생회에 협력만 하면 된다는 겁니까?\" 아오이는 그제서야 웃어 보이며 입을 열었다. \"물론입니다. 총학생회는 기업의 경영권을 인정합니다. 총학생회에 협력하신다면 말입니다.\" 아오이는 곁에 올려둔 서류들을 펼쳤다.\n\n\"최근 필립스의 경영 내역입니다. 네덜란드의 망명정부 수립 이후부터 계속되어 적자 상태이며 현재는 2억 3천만 엔에 해당합니다.\" 필립스의 안톤 필립스는 불편한 기색이 역력했다. 자신들의 적자 상태가 그대로 까발려진 건 고사하고, 휠더가 아닌 엔으로 적자를 표기한 것에 익숙치 않은 것도 더 컸다. 아마도 필립스는 도대체 \"2억 3천만 엔\"이 몇 휠던일 지 계산하고 있을 터였다. 어쨌거나 아오이는 말을 이었다. \"재무실은 이러한 기업들을 구제해 드릴 수 있습니다. 기업당 3억 엔을 빌려드릴 수도 있습니다. 무상으로요.\"\n\n아오이의 짧은 말이 끝나자 곧이어 경영진들의 근처에서 기다리던 보좌관들은 동요하는 눈치였다. 안톤 필립스는 그것이 정말 사실이냐고 물었다. 사실 총학생회는 대전이 이후 그런 큰 지출엔 좀 빠듯하겠지만 아오이는 그런 건 아무래도 상관없을 거라며 린을 설득한 뒤였다. 아오이는 그렇다고 대답했다."
 COU_event_industry.1.a:0 "그리고 경영진들은 아오이가 내민 서류에 서명했다."
 COU_event_industry.2.t:0 "암스테르담 선언"
 COU_event_industry.2.desc:0 "번쩍이는 크로노스 스쿨의 대형 카메라가 대표단을 비췄다. 이번 선언에서는 특별히 키보토스의 방송에는 송출되지 않는다. 플란데런과 북프랑스의 방송사들에 크로노스 스쿨이 생방송 녹화본을 보내면 그날 저녁 그들을 통해 송출될 예정이었다. 생방송은 짧은 토론회처럼 이루어졌다. 비공인 조직인 플란데런 자치위원회의 카미유 하이스만스와 북프랑스 자치위원회의 로제 살랑그로가 왼편에, 오른편엔 정갈한 양복을 갖춰입은, 보기 드문 옷차림의 아오이가 서 있었다. 하이스만스가 몇 차례 행정위원회의 개발 약속에 관한 이야기를 나누면 살랑그로가 맞장구를 치는 방식으로 진행되었다.\n\n"예, 음, 저와 플란데런 자치위원회는 기존부터 계속 네덜란드에 편향된 행정위원회의 정책에 오랫동안 이의를 제기해 왔고, 늦었지만 이제서라도 플란데런에 대한 현대화와 개발을 약속받아 대단히 기쁩니다, 그렇죠, 살랑그로 씨?"\n"아, 네, 그렇습니다. 릴 시는 대전이 이후 프랑스군이 퇴각하면서 무방비 상태에 놓아졌다만, 이제서라도 행정위원회가 관심을 기울이겠다니, 대단히 기쁩니다."\n\n아오이는 말을 들으며 약간 언짢았다. 이 인간들은 도대체 무슨 생각으로 이런 말을 내뱉는지 생각했다. 만약 그녀 자신이 저들이었다면 최대한 행정위원회를 칭찬하면서 더 이득을 챙기려고 했을 것이다. 그래도 뭐, 오랫동안 한이 있으니 저렇겠지, 하고 넘겨짚었다. 아오이는 웃으며 클립보드에 본인 명의로 서명된 서류를 내밀었다. 이들의 자치위원회는 오늘부로 모두 해산되고 행정위원회의 명령에 따르지만, 행정위원회는 '의무적으로' 그 지방을 개발할 책무를 지게 된다.\n\n그들에게나 행정위원회에게나 나쁠 것은 없었다."
 COU_event_industry.2.a:0 ""자, 모두들 서명하셨나요?"" 
 COU_event_industry_2_tooltip:0 "§g번쩍이는 소리와 함께 사진이 찍혔다. 갑작스러운 섬광에 살랑그로가 질끔 눈을 감았다. 집에 돌아온 살랑그로는 다음날 아침 신문에 눈이 감겨 나온 자신을 보고 웃었다. 아내는 그에게 눈을 감고 찍었냐며 온갖 편잔을 줬을 테다. 그런 생각을 하니 문득 아내 생각이 났다. 그래도 괜찮았다. 이제 프랑스인들에겐 더 나은 삶이 기다리고 있을 테니까.§!"
 COU_event_industry.3.t:0 "남부에서의 소요"
 COU_event_industry.3.desc:0 "재무실에서 시행된 통화 통일은 네덜란드 휠던과 벨기에 프랑을 각각 1.5:1로 교환해주는 대대적인 경제 개혁 조치의 일환으로 시행되었지만, 상대적으로 키보토스 인구가 다수를 차지하는 네덜란드에서는 괜찮다는 평가가 주를 이뤘지만 북프랑스와 플란데런은 그렇지 않았습니다. 플란데런의 일부 도시의 시장들은 통화 교환을 경제적 침략으로 규정하며 행정위원회와의 합의 사항을 위반했는데, 특히 항구 도시의 반발이 가장 거셌습니다. 됭케르크 시는 프랑스 국가와 프랑화를 존중하라며 항의했습니다.\n\n재무실은 급하게 일부 조치를 약화하거나 철회하는 식으로 이들을 진정시켜야 했습니다."
 COU_event_industry.3.a:0 "참나."
 
 
 ##군사
 COU_event_military.1.t:0 "자유 장교단의 와해"
 COU_event_military.1.desc:0 "협력자들을 동원한 행정위원회의 훌륭한 결과로, 곳곳의 비밀 거처를 차리고 우리를 괴롭혀 왔던 자유 장교단이 오늘 마침내 와해되었다는 소식이 믿을 만한 정보통을 통해 확인되었습니다.\n\n그것에 대한 확실한 증거로 자유 장교단 출신의 여러 장교들이 오늘 발키리 공안국에 자수했으며, 이들은 협력자들이 넘겨받아 약간의 '재교육' 절차를 거친 뒤 우리를 위해 복무하도록 정신을 개조할 것입니다."
 COU_event_military.1.a:0 "좋군."
 COU_tooltip_unlock_dutch_belgium_generals:0 "£decision_icon_small §Y결정 해금§! : 자유 장교단 재교육"
 COU_event_military.2.t:0 "플란데런 백작 샤를, 플란데런의 백작."
 COU_event_military.2.desc:0 "플란데런 백작 샤를은 요즈음 한가한 나날들을 보내고 있었다. 형 레오폴드 3세는 콩고로 도망가 망명정부를 차렸고, 그는 형의 간곡한 부탁에도 그 배에 타지 않았다. 벨기에인들도 그 배에 타지 않았기 때문이다. 그 또한 콩고로 도망가버린다면 만일 왕가가 돌아온다 하더라도 터무니없는 지지를 자랑할 것이 뻔했다. 그는 벨기에 왕실과 형, 그리고 벨기에인들을 위해서라도 가지 않았다.\n\n어쨌거나 그는 나쁘지 않은 삶을 살고 있었다. 언론들은 밥먹듯이 도망가버린 형을 비난하는 데에 반해 자신은 칭찬해줬을 뿐만 아니라 '차기 국왕'으로 준 확정하여 말하고 있기 때문이다. 그리고 한적한 플란데런의 시골 마을에서 커피나 마시면서 신문을 읽으며 양뗴를 모는 삶도 꽤나 나쁘지 않았고. 그는 나쁘지 않을 뿐만 아니라 만족스러운 삶을 살고 있었다- 얼마 전까지만 해도.\n\n총학생회의 마크를 단 차량이 양떼 목장에 침입했을 때의 이야기였다. 그때 아마도 행정원은 어느 왕족을 찾으러 온 듯 했다. 그러나 결론적으로 그녀가 샤를의 양을 치기는 하였기에 행정원은 몇번이고 사과하면서 그의 이름을 물었다. 그는 몇번 고민하다가 샤를이라고 대답했다. 행정원은 서류 속의 이름과 그를 번갈아서 보더니 몇 번 무전을 주고받은 듯 했다. 샤를은 본능적으로 불안감을 느꼈다. 뭐지? 나를 체포하려는 명령이라도 있었나? 그러나 그러한 그의 걱정은 곧 행정원의 차량 안에서 해결되었다. 총학생회는 샤를을 플란데런의 주지사 비슷한 것에 임명하고 싶다고 했다. 샤를의 걱정과는 거리가 먼 결과에 샤를은 안도감을 느꼈다. 만일 여기서 이를 거절한다면 그는 또다시 양떼를 모는 한적한 삶으로 돌아갈 수도 있었겠지만, 샤를은 충분히 쉬었다고 느꼈다.\n\n많이 쉬었으니, 이제는 다시 한번 벨기에인들을 위해 나설 때였다. 대답을 기다리는 행정원에게 샤를은 답했다."
 COU_event_military.2.a:0 "\"네, 물론이죠. 그러겠습니다.\""
 COU_event_military.3.t:0 "헤일케르컨 사면"
 COU_event_military.3.desc:0 ""심문관" 레옹 드그렐은 플란데런 외곽, 방위실이 관리하는 발키리 공안국의 한 좁은 감옥에서 모습을 드러냈다. 가슴팍에는 푸른 빛이 감도는 총학생회의 핀 뱃지가 박혀 있었다. 그가 27번 감옥 문 앞에 섰다. 코르넬리스 판 헤일케르컨이 있는 곳이었다. 헤일케르컨은 창살 사이로 그 광경을 보면서 역겹다고 생각했다.\n\n"역겹군, 왈롱 배반자."\n"어이쿠, 처음 보는 사람 상대로 말이 심하시군요."\n\n드그렐이 비웃듯 되받아쳤다. 무슨 일이 있든 헤일케르컨은 그가 좋을 대로 해줄 생각이 없었다- 만일 그들이 자유를 준다면 말이 또 달라지겠다만, 이라는 짧은 생각이 채 지나가기도 전에 드그렐이 먼저 말을 꺼냈다.\n\n"헤일케르컨 씨, 네덜란드는 어디에 있죠? 당신의 조국 말입니다."\n"네덜란드인들은 헛되게 죽은 겁니다, 키보토스야말로 새로운 유럽의 질서이고, 또 따라야 할 진리이지요."\n"그래서, 그래서 그딴 반역자 짓거리를 하는 거냐? 넌 레오폴드에게 부끄럽지도 않은 모양이군."\n"부끄럽다뇨? 저는 현명한 선택을 한 겁니다, 헤일케르컨 씨. 렉스 당원 동지들을 지키고, 왈롱인들을 학살로부터 지키고, 그리고 결론적으로는 *제가* 벨기에를 죽음에서 구했습니다. 감옥에서 평생을 썩'을지도 모를' 당신이 알지는 모르겠지만요."\n"잠깐, 그게 무슨 소리냐, 너, 설마..."\n"예, 잘 알고 계시네요. 당신과 거래하겠습니다. 협력자가 되시죠, 그렇다면 당신은 자유입니다. 그리고, 뭐, 그 뒤엔 좋을 대로 하시고요. 마치 저처럼요. 무엇이 우선인지 생각해보세요. 동인도에 있는 조국입니까, 아니면, 당신 곁에 있는 동지들입니까?"\n\n헤일케르컨이 무어라 반박하려다 되려 자리에 풀썩 주저앉았다. 드그렐이 창살 안으로 열쇠를 던져주며 오만하게 답했다."
 COU_event_military.3.a:0 ""현명하게 생각하시길 바랍니다.""
 COU_tooltip_heilcurcken_ours:0 "§g철컥하는 소리와 동시에 굳게 닫혔던 철문이 열렸다. 헤일케르컨은 마음을 다잡았다.\n이미 시대가 바뀌었다고, 인정할 것은 인정하자고.§!\n\n§Y코르넬리스 판 헤일케르컨§!이 장군으로 사용 가능해집니다."
 COU_event_military.4.t:0 "폭스 소대 사면"
 COU_event_military.4.desc:0 "시라토리구의 늦은 저녁, 행정위원회 직속의 형무소에 한 가지 행정명령이 전달되었다. 폭스 소대는 각각 독방에서 (본디 4인 모두 넒은 방에서 함께 수감될 예정이었지만, 현지인 간수들은 어떻게든 꼬투리를 잡아 독방행을 시켰다) 지루한 날들을 보내고 있었다. 그녀들에게 허락된 것은 프랑스어와 네덜란드어 학습책과 전술 교본, 그리고 래빗 소대가 보내주는 편지가 전부였다. 그렇지만 그녀들 중 누구도 불평하는 일은 없었다. 후배들을 지키기 위해 내린 마지막 결정이었으니까.\n\n그때, 간수들이 다가와 급작스레 독방의 문을 열었다. 멍하니 그들을 쳐다보는 그녀들을 향해 어느 간수가 입을 씰룩거리더니 말했다. "행정명령이다. 너흰 이제 자유야."\n\n간수 두 명이 함께 따라나서 그녀들의 마지막을 배웅했다. 바깥엔 기자들이 몰려와 그녀들을 맞이했다. 그 사이엔 래빗 소대의 후배들도 있었다. 마치 서로 약속한 듯 유키노와 미야코가 악수했다. 비록 아직 친하진 않았지만, 그래도 선후배라는 특별한 관계와 유대는 그리 쉽게 깨지지 않았다. 기자들이 들이미는 마이크에 유키노가 천천히 입을 뗐다."
 COU_event_military.4.a:0 ""좋은 저녁입니다!""
 COU_event_military.5.t:0 "SRT 현지인 소대"
 COU_event_military.5.desc:0 ""전 소대 차렷! 소대장님께 경례!"\n"충 성!"\n\nSRT의 로고가 선명히 새겨진 견장을 찬 남자들이 학원 교정에서 사열했다. 이른 아침이었다. 이들의 시끄러운 사열 소리에 사키를 시작으로 래빗 소대의 인원들이 잠에서 깼다. 상부의 명령으로 라이언 소대와 래빗 소대는 합숙하여 각자의 문화와 전술을 배우는 교류의 시간을 가지게 되었는데, 경직된 군 문화를 처음 보는 래빗 소대로서는 당혹스러운 일이 아닐 수 없었다. 이번에 창설된 라이언 소대는 벨기에군과 프랑스군 포로들이 주를 이룬 현지인 소대였는데, 이들은 그들이 배웠던 군 문화를 과시하듯 움직였다. 또한 새로운 소대에 배속되었음에도 각자의 차이를 타파하고 뜻을 모은 것도 특징이라고 할 수 있었다.\n\n"이른 아침부터 왜 저래, 시끄럽게..."\n"교본에 따르면 이른 아침에 일어나는 것도 나쁘진 않아, 모에. 그래도 4시는 좀 이르긴 하지만..."\n"저 사람들은 계속 저렇게 살았던 걸까요, 우으..."\n"우리도 얼른 일어나자, 응."\n\n교정에 투덜대듯 모인 래빗 소대가 라이언 소대에게 인사를 건넸다. 딱딱하지만서도 부드러운 답례를 받았다. 그 날은 키보토스식 전술 훈련을 전수해주는 날이었다. 아무래도 현지인과 키보토스인은 생체적 구조부터 다르기 때문에 부적합하다는 사키의 의견이 있긴 했지만 키보토스인이 어떠한 전술적인 사고를 가졌고 행동하는지를 배우는 것이라 큰 문제는 없다는 미야코의 말 속에서 합숙훈련은 진행되었다."
 COU_event_military.5.a:0 "사소한 문제는 있어도 큰 문제는 없었다."
 COU_tooltip_event_military_5:0 "§g라이언 소대원들에게는 이따금씩 저격수도 최전방으로 뛰쳐나가 사격을 가하는 키보토스식 전술을 보고는 경악을 금치 못했다는 사소한 문제가 있었다.§!"
 COU_event_military.6.t:0 "방위군의 상태 보고"
 COU_event_military.6.desc:0 ""아, 화면 잘 나오나?"\n"일단 [COU.GetLeader] 쪽에서 지금은 자리를 비웠다고 해서, 이렇게 녹화를 해서 보내. 방위군의 상태를 얘기하면 되는 거지?"\n"음, 어떻게 말해야 될지는 잘 모르겠지만 전보단 나아졌어. 훈련 체계도 다시 뜯어고쳤고, 월급이 내려간 만큼 예산이 좀 남아서 그걸로 새 군용 장비 몇 개를 사들였어. 그건 좋긴 한데, 근본적으로 일단 불만이 있어. 그래도 이정도는 시간이 지나면 해결될 거라고 생각해. 은연중에 본인들도 과한 취급이었다는 걸 아는 것 같아."\n\n"... 그리고 헤일로 보병 사단의 학생들도 재편되고서 이런 생활에 익숙해진 것 같아. 뭐, 그런거 있잖아. 비록 직업 교육은 없어졌지만... 하던 대로 사열하고, 운동장 몇 바퀴 정도 뛰고, 팔굽혀펴기도 좀 하고."\n"그리고 현지인 협력자들도 우리 지휘 체계에 대충 익숙해진 모양이야. 그쪽은 달라진게 별로 없기도 하고. 사실 현지인들보다는 우리 체육실 쪽 얘들이 체육 활동이 사라져서 불만이던데, 음... 병영 내에 작게, 상설 운동회 같은 걸 개최해보려고 해. 그럼 모두들 힘이 나고 좋을 것 같아. 긍정적으로 검토해주길 바랄게."\n\n"어쨌든 보고는 이 정도야. 이 정도면 방위군을 개혁할 토대는 된 것 같아."\n\n(잡음) "하이네 실장님, 여기 주먹밥 다 만들었어요! 와서 하나 드셔보세요!"\n\n"알았어, 금방 갈게! 일단 난 가봐야 할 것 같아. 끊을게. 다음 번에 D.U.를 들러서 서면으로 좀 더 자세히 보고할게. 이만!""
 COU_event_military.6.a:0 "견딜 만한 충격이다."
 COU_event_military.7.t:0 "장거리 훈련 보고서"
 COU_event_military.7.desc:0 "행정위원회 방위실, 방위차장 앞.\n\n지난 달에 명령을 하달받고 중순양함 전대의 일부 함선을 차출해서 영국 해협과 북해에서 각각 기동과 사격 훈련을 진행하였습니다. 이례적인 장거리 항해에도 키보토스 기술력으로 정비받은 함선들이라 그런지 운행 도중의 문제는 없었습니다만 키보토스 군사력의 해군 경험에 대한 부재인지 어쩐건지는 몰라도 자동 항법 장치, 이거 좀 상태가 이상합니다. 그리고 연료 자동관리 시스템이 먹통이었던 턱에 효율적인 연료 관리가 불가능했으며... (중략)\n\n... 그럼에도 시스템은 정말 뛰어난 성능을 보여줬고 이러한 사소한 기술적인 문제만 개선한다면 새로 정비받은 우리 함선들은 10% 정도 더 멀리 항해가 가능할 것 같습니다. 빠른 해결을 기원하겠습니다.\n\n- 콘라트 헬프리흐."
 COU_event_military.7.a:0 "뭐어, 기술 문제면 금방 고치겠군."

 
 
 
 #캐릭터 
 ##BA 
 COU_XXX_override_instant:0 "§Y총학생회장§!"
 COU_XXX_override_delayed:0 "대전이 이후 여러 산전수전을 겪었지만 §Y총학생회장님§!은 직책과 권위에 걸맞게 §G결코§! 키보토스를 포기하시지 않을 것입니다!\n...\n\n§R하지만, 총학생회장님은 언제쯤 집무실에서 나오실까요?§!"
 #COU_XXX:0 "총학생회장"
 #COU_XXX_desc:0 "그 어떠한 자들보다도 위에 서 있는 총학생회장은 키보토스에서 모든 것을 관리했습니다. 학원 간 분쟁, 그리고 사소한 다툼까지도, 모든 것을 관리하고 통제했으며 조정함과 동시에 중재했습니다. 그러나 그러한 총학생회장조차도 키보토스 전체가, 한 번도 들어본 적 없으며 실존하는지조차도 몰랐던 곳에 전이하게 되었을 때, 그녀는 모든 것을 짊어지게 되었습니다. 비록 원한 적은 없으나 모든 이들의 우두머리인 총학생회장은 그러해야만 했기에 그녀는 기꺼이 모든 것을 짊어지기로 결정했습니다. 그리고 그러한 고난 속에서 총학생회장은 더는 버틸 수 없게 될 때 까지, 그녀는 그녀가 가능한 한 키보토스를 위해 끝까지 일하고자 할 것입니다."
 COU_null:0 "키보토스 비상대책위원회"
 COU_null_desc:0 "총학생회장이 갑작스럽게 실종된 이후, 총학생회는 굉장한 혼란 속에 갇혀있습니다. 키보토스 총학생회는 현재 그 어떠한 활동도 할 수 없으며 이는 키보토스의 이상 상황에 전혀 대처할 수 없다는 것입니다."
 COU_RIN:0 "나나가미 린"
 COU_RIN_desc:0 "총학생회장이 무책임하게 실종된 이후 총학생회는 나나가미 린의 지도 아래에 놓였습니다. 총학생회장의 신임으로부터 증명된 린의 유능함은 굳이 설명하지 않아도 이해할 수 있을 것입니다. 매일같이 말도 안되는 양의 업무를 완벽히 수행하고, 거의 쉬지도 않은 채 업무에 응하는 것은 총학생회장과 초인을 연상케 합니다.\n\n어쩌면 이런 부분에서 린은 맞는 자리를 찾았을지도 모릅니다. 하지만 이러한 그녀에게 문제가 있다면, 어느 날 갑자기 사라져버린 총학생회장은 명확히 그녀를 지명하지 않았습니다. 그냥 단지 그녀의 직위가 총학생회장의 다음가는 높은 직위였기 때문에 떠밀려 맡은 것이 전부였습니다.\n\n린의 미약한 권력 기반과 통치 신념은 모두에게는 좋은 일이지만 린 그녀 자신에게는 그다지 좋은 방법이 아닙니다. 이제 단순히 '총학생회장의 보증'이 언제까지 가는 지에 대하여 모든 것을 걸어야 할 처지에 놓였기 때문에, 린은 부지런히 움직여야 할 것입니다."
 COU_RIN_SET1:0 "수석 행정관"
 COU_AOI:0 "오키 아오이"
 COU_AOI_desc:0 ""
 COU_AOI_SET1:0 "재무실장"
 COU_KAYA:0 "시라누이 카야"
 COU_KAYA_desc:0 ""
 COU_KAYA_SET1:0 "방위실장"
 COU_AYUMU:0 "이와비츠 아유무"
 COU_AYUMU_SET1:0 "조정실장"
 COU_MOMOKA:0 "유라기 모모카"
 COU_MOMOKA_DESC:0 "교통실이 언제부터 총학생회에서 이렇게 중요한 부처가 되었을까요? 그저 매일같이 터져나가는 열차들을 정비하고, 신고를 접수하고, 고작 그것이 다였던 자그마한 부서였는데 말입니다.\n\n유라기 모모카는 현지인들에게 한줄기 희망으로 떠올랐습니다. 새로이 설립된 개혁위원회와 붉은 여명은, 그녀가 단순한 통치자는 아니라는 것을 암시합니다. 명란맛 과자를 풍족히 공급하고, 권력자로서의 대우를 하고, 명령에 따르는 척 하면서 모모카는 새로운 질서의 핵심이 되었습니다. 그러니까, 모모카는, 귀찮은 일들을 강제로 떠맡게 된 것과 다름이 없습니다.\n\n모모카는 정치놀음에 그다지 큰 관심은 없습니다. 단순히 밀려오는 더 많은 서류들을 처리하는 데엔 싫증이 난 지 오래였지만 말입니다. 가끔씩 그녀는 홀로 린이 그립다며 한숨을 쉬고는 합니다. 곁에선 붉은 완장을 찬 현지인들이 그녀를 탐탁치 않게 바라볼 뿐입니다.\n\n하지만 그 자리가 어떠하던 간에 그녀는 새로운 질서이자 인류와 키보토스 조화의 상징입니다. 모모카, 그리고 명란맛 과자는 충실히 그 의무를 수행할 것입니다.\n\n복잡한 정치놀음은 정치인들에게 떠넘긴, 한낱 꼭두각시와 다름이 없는 신세더라도, 모모카는 그 의무를 수행할 것입니다.\n\n마땅히 지어야만 할 짐을 지고서." 
