 ##페르피두스
 COU_decision_cat_perfidus:0 "페르피두스"
 COU_decision_cat_perfidus_desc:0 ""나의 명예는 오늘 이 성벽 아래 파묻히겠지만, 내일 아침 이 성안의 아이들이 눈을 뜰 수 있다면 나는 기꺼이 반역자의 낙인을 찍히겠다."\n\n총학생회와 키보토스의 수도가 저지대로 전이되었다는 것은 어쩌면 신이 정한 하나의 운명이었을지도 모릅니다. 저지대의 정부들은 겁에 질려 도망치기 바빴지만, 그 속에서 현명하게도 실리와 이익을 따지는 이들 또한 존재했습니다. 그들이 공식 명칭으론 협력자, 보통 멸칭인 페르피두스로 불리우는 이들입니다. 이들과의 관계는 우리의 현지 동화에 있어 대단히 중요한 역할을 할 것입니다."
 COU_perfidus_gui_txt11:0 "수장"
