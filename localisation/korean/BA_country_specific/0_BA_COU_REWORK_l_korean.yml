 ##군사
 COU_reorganizing_the_defense_office:0 "방위군 재편"
 COU_reorganizing_the_defense_office_desc:0 "대전이 이후 무장 세력의 필요성이 대두되면서 창설된 방위군은 높은 임금과 직업 훈련 프로그램 등으로 특출한 훈련도와 성과를 보여줬지만, 다른 학원의 비극적인 사례들은 이러한 거창한 군대 체계가 오래 존속하지 못함을 암시하고 있습니다. 장병들 사이에서 불만이 터져나올지언정 일반군대화로의 재편은 피할 수 없습니다."
 COU_focus_introduction_of_defendu:0 "디펜두 도입"
 COU_focus_introduction_of_defendu_desc:0 "근접전투체계, 일명 디펜두는 1920년대 윌리엄 E. 페어번과 에릭 A. 사이크스가 개발한 혼합 전술로 상하이 시의 경찰을 훈련시키기 위해 처음 만들어졌지만 CQB의 하위호환과도 같은 이 유용한 전술을 도입한다면 구시대적인 전술적 사고와 장비를 지닌 현지인 군대에게 CQB의 대안으로서 생존의 가능성을 높이고 승리를 보장할 수 있을 것입니다."
 COU_focus_invite_collaboraters_to_high_command:0 "총참모부에 협력자 등용"
 COU_focus_invite_collaboraters_to_high_command_desc:0 ""
 COU_focus_annex_small_armies:0 "소규모 학원 지휘체계 인수"
 COU_focus_annex_small_armies_desc:0 "키보토스 전역에 존재하지만 때때로 그 존재가 잊혀지고는 하는 아주 작거나 근소한 학원들 중 일부는 대전이 당시 D.U. 와 함께, 혹은 총학생회의 행정력에 닿아 통제할 수 있었습니다. 이들은 엄연한 학원으로서 자율성을 가진 군대와 치안 체계를 가졌지만 이들의 허접한 체계는 신뢰할 수 없음으로 우리가 대리로 이들의 지휘체계를 인수하는 것이 그들에게나 우리에게나 더 유용할 것입니다."
 COU_focus_unification_ammunition_process:0 "탄약공정 통일"
 COU_focus_unification_ammunition_process_desc:0 "총학생회가 저지대의 군수공장들을 평정한 이래로 키보토스 계열의 군수공장들과 다른 탄약, 혹은 같은 탄약이더라도 세부한 제조 라인에서 공정의 절차에 차이가 있어 효율적으로 공장을 이용하기 어려웠습니다. 효율적으로 탄약을 생산하기 위해선 공정의 통일이 필요합니다."
