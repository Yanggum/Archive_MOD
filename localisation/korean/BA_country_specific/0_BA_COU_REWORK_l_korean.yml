 COU_focus_replan_vastion_holland_desc:0 "베스팅 홀란트란 1930년대 네덜란드군의 국가 방어 전략의 핵심으로 현 시라토리구부터 하루하바라 일대에 이르는 자연지형과 요새를 활용해 강력한 방어를 기반으로 한 전술이었습니다. 우리의 주요 전략은 방어 후 반격의 형태로 이루어져야 합니다."
