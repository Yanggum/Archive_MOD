 ##컨텐츠 완공 후 재작성 
 
 
 #선택창 
 COU_GATHERING_STORM_DESC: "수천 개의 크고 작은 학교가 모여 연방을 구성하고 있는 거대한 학원도시 키보토스의 중앙구에 위치하고 있는 키보토스 총학생회는 키보토스의 모든 중앙 행정시설을 통제하고 자치구 내에 존재하는 모든 학원 간의 분쟁, 정치 등을 조율하는 기관입니다. 그닥 멀지 않은 과거까지만 해도, 키보토스는 '총학생회의 질서'에 따라 움직였습니다. 모든 학원이 우리의 명령에 따랐고 순응했습니다.\n\n불운하게도 총학생회가 주도하던 하찮은 질서는 대전이라고 불리는 재앙으로 인해 모든 것은 통제 불능의 상태로 빠져들었습니다. 질서가 다시 바로 서는 날은 오늘이 아닌 모양입니다."
 #이 전대미문의 사태를 극복하기 위해 총학생회장은 어떤 선택을 하게 될까요?"