 #총학생회 국민정신
 COU_admin_confusion:0 "행정 혼란"
 COU_admin_confusion_desc:0 "총학생회는 대전이 이후 통제를 상실했으며 이러한 행정 혼란은 한동안 지속될 것으로 보입니다."
 COU_cut_tower:0 "생텀 타워 권한 상실"
 COU_cut_tower_desc:0 "싯딤의 상자를 통해 생텀 타워에 관한 권한을 가지고 있던 총학생회장이 사라지면서 키보토스를 총괄하던 생텀 타워에 대한 권한 또한 사라졌습니다. 이는 총학생회와 키보토스에 대한 중대한 위협입니다."
 COU_empty_of_monarchs:0 "국민저항전선"
 COU_empty_of_monarchs_desc:0 "네덜란드군과 벨기에군의 절대다수는 고국을 버리고 도망쳤지만, 모두가 그러한 것은 아닙니다. 국왕이 강제했던 혹은 잔류하라는 지시가 떨어졌던, 어쨌거나 저지대에 남은 장교들은 현지인들을 선동해 우리와의 협력을 방해하고 관리에 혼선을 일으킵니다."
 COU_the_dead_flower:0 "완성되지 않은 전이"
 COU_the_dead_flower_desc:0 "총학생회는 마법처럼 모든 문제를 해결한 것이 아닙니다. 저지대의 대다수의 인구는 대전이의 기묘한 현상으로 키보토스계가 차지하게 되었지만, 그럼에도 불구하고 현지인들의 존재는 결코 무시할 수 없는 존재입니다. 행정위원회는 현지인들에 대한 유화책과 강경책을 카드로 통치의 안정성을 키우고 더 나아가 새로운 고향을 고향으로서 받아들일 준비를 해야 합니다."
 COU_the_dead_flower_tooltip:0 "§Y$COU_the_dead_flower$§! 변동치"
 COU_the_dead_land:0 "침수"
 COU_the_dead_land_desc:0 "대전이 이후 거대도시 D.U.의 대전이는 기반이 취약한 저지대를 완전히 가라앉고 침수되게 만들었습니다."
 COU_dutch_collaboraters:0 "협력자"
 #COU_dutch_collaboraters_desc:0 "시라누이 카야는 대전이 이후 총학생회에 협력하는 이들에게 특별한 '권한'을 부여했습니다. 반키보토스적 언행과 행동을 보이는 이들을 폭행하고 발키리로 연행하여도 모든 죄를 사면하는, 그러한 특별한 권한을 협력자들에게 부여하였습니다. 총학생회는 이러한 협력자들의 도움으로 초반 통치를 안정화할 수 있었으나 대전이가 안정기에 접어들며 나나가미 린과 같은 이들은 이러한 '불합리한 권한'에 대한 의구심을 제기합니다."
 COU_dutch_collaboraters_desc:0 "벨기에의 무조건적인 항복 선언 이후 이루어진 통치 안정화 과정에서, 시라누이 카야를 필두로 한 방위실은 우리에게 협조적인 현지인들을 등용해 통치에 사용할 것을 제안했습니다."
 COU_name_of_the_student_council:0 "학생회의 권위"
 COU_name_of_the_student_council_desc:0 "총학생회가 비록 대전이 이후 예전과 같은 통제력을 발휘하지는 못하지만, 총학생회는 모든 학원을 총괄하고 중재하는 '유일한' 이들로서 비록 퇴색되었다고 하더라도 무시할 수 없는 권위와 범학원적 영향력을 끼칩니다." 
 COU_ditchland_law2:0 "디츨란드법: 행정명령 6378호"
 COU_ditchland_law3:0 "통제 불가능한 협력자들"
 COU_notgood_kaya_power:0 "불완전한 권력"
 COU_direct_support:0 "키보토스 연합군"
 COU_world_trade_idea: "키보토스 무역거점"
 COU_no_communism_movement: "방위실 저항"
 COU_no_communism_movement_desc: "주권법이 총학생회에서 통과된 이후, 카야와 방위실은 지구의 공산주의가 총학생회를 잠식시키지 못하도록 하겠다며 공공연한 '반란'을 선포했습니다."
 COU_autonomous_legislation_idea: "주권법"
 COU_autonomous_legislation_idea_desc: "현지인의 자치 문제에 관한 법률, 약칭 주권법은 대전이 이후 두 세계가 정면충돌하게 된 이후, 유럽의 시민들이 자신들의 주권을 완전히 잃어버린 것을 근거로 해서 만들어진 법률입니다. 이 법률은 대전이 이전과 유사한 수준의 주권을 보장하기 위해 광범위한 자치 권리에 관한 내용이 들어있습니다."
 COU_socialist_world_republic_idea: "사회주의 세계공화국"
 COU_socialist_world_republic_idea_desc: "세계 사회주의 운동을 주도하는 국가로서 전 세계의 노동 문제를 고발하고 혁명을 지원하는 거대한 이데올로기 집단입니다. 키보토스라는 작은 땅을 넘어 전 세계의 노동이 해방될 때까지 이 들은 전진할 것입니다."
