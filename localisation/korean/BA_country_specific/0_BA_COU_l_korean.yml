 COU_mission_defence_desc:0 "총학생회 직할의 몇몇 군수공장은 흔히 방치되어 있다는 오해를 사기 쉬우며, 스케반들과 같은 세력들에게 보통 표적이 되고는 합니다. 우리는 이번을 기회삼아 그들에게 똑똑히 경고할 것입니다."
 COU_mission_battle_with_gangs:0 "특별 의뢰: 군용 물품 회수"
