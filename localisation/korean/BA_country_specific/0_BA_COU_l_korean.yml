#경제
 COU_focus_after_two_months:0 "대전이 이후 2달"
 COU_focus_after_two_months_desc:0 "대전이 이후 2달, 저지대의 경제와 산업 기반은 총학생회의 어정쩡한 대처로 완전히 버려진 신세였습니다. 일컬어 \"꺾인 튤립\" 이라고 일컬어지는 이 현상은 총학생회의 미래에 어두운 먹구름처럼 끼고 있습니다. 이제는 이를 마주할 시간입니다."
 COU_focus_look_the_our_economy_fucked:0 "회생 실패 분석"
 COU_focus_look_the_our_economy_fucked_desc:0 "행정위원회는 네덜란드의 경제가 엄청나게 무역과 수출에 의존하고 있었다는 사실을 몰랐습니다. 과연 그것만 몰랐을까요? 우리가 실패한 이유에는 당연히 마땅한 이유가 있습니다."
 COU_establishment_of_federal_industrial_committee: "현지 기업들과의 접촉"
 COU_establishment_of_federal_industrial_committee_desc: "현지의 기업들은 대전이 이후 본국들에게 버려진 신세이지만 우리가 그들을 거두어 우리를 위해 일하게 할 수도 있습니다. 마땅히 그래야만 하고요."
 COU_tooltip_unlock_dutch_belgium_cons:0 "§Y잠겨진 설계사§!들이 모두 §G사용 가능§!해질 것입니다."
 COU_economy_focus_0: "자위더르해 사업의 지속"
 COU_economy_focus_0_desc: "자위더르해 사업이란 1932년 완공된 방조제 건설 공사를 이르는 말입니다. 그러나 1935년 대전이 이후 급작스러운 D.U.와 생텀 타워의 전이는 간척 지대의 재침수라는 참담한 결과를 낳았고, 우리는 이를 재건하기 위하여 간척 사업을 다시 한번 시작하어야 합니다."
 
 
 #군사
 COU_reduction_of_administrative_committee_authority: "현지 장교들과의 접촉"
 COU_reduction_of_administrative_committee_authority_desc: "반동적인 네덜란드인들은 제 여왕에 충정을 바치며 인도네시아로 도망쳤으나 부족한 레오폴드 3세의 지지는 결국 벨기에 장교들의 일부를 본토에 남기고 오는 결과를 낳았습니다. 그들은 자신들만의 사령부를 조직하여 우리와 협력하지 않고 있으나 그들은 분명히 우리에게 있어 큰 도움이 될 것은 분명합니다."
 COU_tooltip_unlock_dutch_belgium_generals:0 "§Y벨기에§!와 §Y네덜란드§! 출신의 §Y장교§!들과 §Y제독§!들, §Y조언가§!들이 §G사용 가능§!해질 것입니다."
 
 
 
 #총학생회 이벤트 - 시작
 COU_start_event.100.t:0 "새로운 이야기...?"
 COU_start_event.100.desc:0 ""안녕하세요, 선생님!"\n\n(싯딤의 상자를 켠다.)\n\n""블루 아카이브 모드" 에 오신 것을 환영해요, 선생님! 앗, 그 전에, 여기 편지가 하나 있어요! 읽어 보시는게 좋을 것 같아요!""
 COU_start_event.100.a:0 "(편지를 읽는다.)"
 COU_start_event.100.b:0 "우리는 멀티 플레이 중이야! 바빠!"
 COU_start_event.101.t:0 "선생님께."
 COU_start_event.101.desc:0 ""-데이터 찾을 수 없음- 선생님."\n\n어차피 제 말을 잊어버리게 될 테지만, 그래도 상관없겠죠."\n\n"다시 만나서, 반갑습니다, 선생님. 비록 여기는 선생님의 컴퓨터 속 작은 세상이지만..."\n\n"이곳의 "저희" 들은 언제까지나, "진짜" 니까요."\n\n"말씀드리고 싶은 게 있습니다, 선생님."\n\n"이곳의 이야기는 아직, 불완전합니다. 만들어지다 만 코드 덩어리들이 저희들을  칭칭 감싸고..."\n\n"... 저희들은 모든 것을 망각해 버린 채 남은 껍데기- 환상만이 이곳에 머물 뿐이에요."\n\n"... 그러니까, 선생님, 부디, 다른 이야기들을 먼저 들어 주시길, 부탁드립니다."\n\n"이 피로 물들고, 희망이라고는 찾아볼 수 없는, 비극적인 이야기들 뿐인, 그런 이야기들..."\n\n"선생님께서는, 그런 이야기들을... 그다지 좋아하지 않으시니까요...\n\n... 그렇죠?"
 COU_start_event.101.a:0 "(트리니티의 이야기를 듣는다.)"
 COU_start_event.101.b:0 "(밀레니엄의 이야기를 듣는다.)"
 COU_start_event.101.c:0 "(붉은겨울의 이야기를 듣는다.)"
 COU_start_event.101.d:0 "그 이야기를 듣는다."
 COU_play_trm:0 "§g열차가 트리니티 고성당 역에 멈춰섰다. 총학생회장은 그러한 선생을 당연히 그랬어야 했다는 것처럼, 씁쓸하게 웃으며 배웅해 주었다.§!"
 COU_play_MIL:0 "§g초현상특무부의 아케보시 히마리가 어느 순간 나타나 선생을 인도했다. 아로나는 황급히 선생을 따라갔고, 총학생회장은 눈을 감았다.§!"
 COU_play_RED:0 "§g어디선가 체리노의 숙청 소리가 울려퍼지고 있었다. 선생이 갑작스레 몰아치는 추위에 랜턴을 켜고 밖으로 나갔다. 열차 안은 비었다.§!"
 COU_play_COU:0 "§g총학생회장은 내심 놀란 듯 했다. 이 불완전하고, 덜 만들어진 이야기를, 선생은 기꺼이, 총학생회장에게서 들어 보기로 했다.§!\n\n§Y총학생회 플레이로 발생하는 모든 버그들은 미완성입니다. 선택은 당신의 몫이고, 당신은 파멸로 이를 총학생회의 이야기를 들어 보기로 했습니다.§!"
 
 
 COU_start_event.1.t:0 "학생자원방위대의 창설"
 COU_start_event.1.desc:0 "린은 걱정스러운 눈빛으로 생각에 빠져있었다. 평소라면 분명 커피를 마시며 업무에 집중했겠지만, 더는 무리다.\n\n린의 자리는 자신들의 사리사욕을 채우기 위한 욕심 가득한 이들의 손길에 위협받고 있었고, 동시에 키보토스 학생들을 상대로 한 살인과 폭력 범죄가 급증하고 있었다. 린은 총학생회장의 대행으로서 무언가를 해야만 했다.\n\n그때, 린 행정관의 머릿속에 한 총학생회의 주요 규칙 중 하나가 번뜩였다. \"총학생회는 군사 조직을 가질 수 없다.\" 라는 규칙, 하지만 만약 이걸 어긴다면 어떻게 될까? 만약 이게 유일하게 옳은 길이라면, 규칙 하나쯤은 무시해도 되는 것 아닐까?\n\n그렇게 며칠 뒤, 린 행정관은 한 원통형의 보관함을 들고 기자들 앞에서 멈춰 섰다. 그러곤 린은 원통에서 한 깃발을 꺼내 들었다.\n\n\"헌 시간부로, 우리 총학생회는 학원 자치권 보장법 2조항인 군사 보유 제한권을 공식적으로 해제하고, 준군사조직인 학생자원방위대의 창설을 선언합니다. 학생자원방위대의 주 수뇌부는 SRT 특수학원 출신자들이나 군사분야 전문가들로 구성할 예정입니다.\"\n\n린의 발언에 순식간에 기자들이 온갖 질문들을 쏟아내기 시작했고, 몇몇은 이미 그녀를 향해 욕을 퍼붓기 시작했다.\n\n하지만 린 행정관, 아니. 린 총학생회장의 눈은 이미 결심을 한 상태로 자신이 들고 있는 학생자원방위대의 공식적인 깃발에 고정됬다."
 COU_start_event.1.a:0 "\"모두를 위해선, 이 방법밖에 없어.\""
 COU_start_event.1.b:0 "\"사병 조직은 월권 행위인걸 잊었나봐?\""

 COU_start_event.2.t:0 "회의에서 퇴출당한 모모카"
 COU_start_event.2.desc:0 "이른 아침부터 모모카는 총학생회 사무국의 회의실로 불려 나갔습니다. 사무국 밖은 벨기에의 시위대로 가득해 아침부터 지원은 발키리 경찰학교의 학생들이 방패로 철저히 문들 틀어막으며 지키고 있는 모습이 유리창을 통해 비쳤다.\n\n모모카가 귀찮은 눈빛으로 회의실에 들어와 평소 항상 먹던 명란과자 봉지를 뜯으며 시위대의 요구사항을 들어봤지만, 그 어디서도 타협점이 보이지 않았다. 어떤 시위대는 벨기에의 독립을 원하고, 어떤 시위대는 자치권을 요구하기도 했다. 결국 모모카는 너무 난해한 요구사항에 그 어떠한 생각 없이, 그녀의 머릿속에 있던 말을 입 밖으로 꺼내버렸다.\n\n\"그깟 요구, 그냥 들어주면 되는 거 아니야?\"\n\n잠시 후, 모모카는 짜증 난다는 얼굴과 함께 사무국에서 쫓겨나듯 걸어 나왔다. 그렇게 시위대로 가득한 도심을 지나가며 다 떨어진 명란과자를 사러 가는 길, 하필이면 귀찮음 하나 때문에 총학생회 정복을 그대로 입고 온 모모카는 시위대에게 그녀의 정체를 들키고 말았다.\n\n귀찮아질 것 같다는 그녀의 예상과는 달리, 시위대는 그녀에게 원하는 걸 사줄 테니 총학생회가 어떤지 회의 내용을 흘려달라고 했다. 곧, 시위대로부터 과자 봉지들을 잔뜩 얻는 데 성공한 모모카는 그 자리에서 과자를 씹으며 이야기를 시작했다.\n\n\"...솔직히, 여러들을 그렇게 좋게 보고 있지는 않는 것 같아요. 정치적 중립성을 유지해야 한다나 뭐라나, 린 행정관이 원래 깐깐한 건 다들 잘 알잖아요~ 음... 그런데, 솔직히 말하자면 그냥 여러분들 의견을 그대로 수용하는 게 제 아이디어였는데 글쎄, 절 쫓아내는 거 있죠?\""
 COU_start_event.2.a:0 "\"거기, 뭘 그렇게 열심히 쓰고 계시는 거에요?\""
 COU_start_event.2.b:0 "\"시위대 말을 들어주라고? 웃기는 소리.\""

