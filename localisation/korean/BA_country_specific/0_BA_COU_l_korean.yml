 COU_student_council_amendment_desc: "§2\"제 의견과 다르다고 해서 권위를 내세워 타인을 억압할 수는 없습니다.\"§!\n\n이번 회의를 통해 나나가미 린 총학생회장 대행은 학생회 개정안을 발표하면서 반대파들의 불만을 잠재우고 키보토스 총학생회의 총학생회장 권한대행으로써 최선을 다할 것임을 천명하였습니다."
