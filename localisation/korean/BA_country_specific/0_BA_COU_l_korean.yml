 COU_ANNE_FRANK:0 "아넬리스 마리 안네 프랑크"
 COU_ANNE_FRANK_DESC:0 "§g그 모든 일에도 불구하고, 내가 믿는 것은 사람들의 진심은 정말 착하다는 것이다.§!\n\n네, 축하합니다. 안네 프랑크를 만나보셨다는 건, 0.1%의 확률에 당첨되셨다는 것입니다! 정성들여 작성한 안네 프랑크와 관련된 변형된 이야기들을 읽어보시면서, 부디 무료한 전쟁 없는 시간들을 때우실 수 있으시길 바랍니다. 참혹한 전쟁의 희생자가, 멋진 웹소설 작가로 데뷔하는 여정을요."
