 COU_start_event.3.b:0 "\"...\""

 COU_start_event.4.t:0 "왕좌의 게임"
 COU_start_event.4.desc:0 "\"...그렇네요, 수석행정관이 결국 해버렸군요.\" 시라누이 카야는 의자에 걸터앉아 말했다. 근심이 가득한 얼굴로 곁에 올려진 커피를 마셨지만, 입가에는 미소가 걸려 있었다.\n\n멀쩡히 남아 있던 SRT를 버리고, 새로운 준군사조직을 만들었다? 린은 행동 하나하나마다 그 틈내가 훤히 들여다보이는 유리창 같았다. 비위 맞추는 입으로 떠들어대는 그 의도가 어떻게 되었던, 자기 밥그릇 지키고자 발악하는 것이겠지. 카야는 커피를 내려놓으며 TV를 켰다. 여타 예상했듯이 TV속 머저리들은 유식한 행세를 하며 린이 철권통치를 바란다느니, 린이 총학생회장의 자리를 노리는 것이라며 떠들어대고 있었다.\n\n하, 천만에. 얼빠진 수석행정관은 그럴 의도가 없다. 그저, 자기 밥그릇이 빼앗길까 봐 두려워하는 것이지. 커피잔을 밀어내고, 책상 서랍 속의 자그마한 체스판을 카야는 꺼내 보였다. 아마 곧 SRT의 아이들이 잔뜩 겁에 질린 채로 그녀에게 도움을 간청하리라고 그녀는 생각했다. 물론 그렇지 않을 가능성이 더 컸기에, 얕은 한숨을 쉬었다. 약해빠지게 되어서는 안 된다.\n\n체스판 위에는 퀸, 그리고 나이트 한 말 두 개만이 올려져 있었다. 린은 퀸, 그리고 그녀는 나이트였다. 그리고서는 폰 여덟 말을 꺼내 체스판의 앞에 놓았다. 왕좌의 자리를 건 체스 게임이 시작되었다. 카야는 폰 하나를 들고 책상을 두드렸다. 왕좌의 게임에서는 필연적으로 폰들이 필요했다. 그래야지만 퀸을 잡고 게임을 끝내리라. 그녀는 생각했다."
 COU_start_event.4.a:0 "\"시간을 가지고, 기다려 보자고요.\""

 COU_start_event.5.t:0 "교차"
 COU_start_event.5.desc:0 "시라누이 카야 방위실장은 체스판을 두드렸다. 수는 적었고, 가능성은 낮았다. 타개하기 위해서는, SRT가 필요했다.\n\n그러나 이내 굳게 닫힌 문 너머에서 급히 달려오는 발소리가 들렸다. 유레카. 확률낮던 그녀의 예상대로 들어맞았다. 발소리를 들어보니 한 명이었다.\n\n\"방위실장! 문 좀 열어봐!\" 시치도 유키노가 급한 목소리로 소리쳤다. 카야는 들고 있던 폰을 내려놓으며 문을 열었다. 본인은 아무것도 모른다는 표정을 한 채. \"무슨 일로?\" 그녀는 태연히 물었다.\n\n\"무슨 일은... 무슨 일이긴! 넌 TV도 보지 않는 거야!\" 꽤나 무례하지만 잔뜩 겁에 질린 목소리였다. 카야는 그 점이 마음에 들었다.\n\n\"우선, 들어오시죠.\" 카야가 태평한 미소를 지으며 답했다. 퀸을 잡을 폰이 직접 도움을 간청하러 왔다- 그녀로서는 재미있는 일이었다. 그것도 아주 낮은 확률의 가능성이었는데 말이다.\n\n카야는 커피 포트에서 따뜻한 커피 두 개를 내려 책상에 올려놓았다. 유키노는 떨리는 손으로 커피를 받아서 들며 태연해지려 애썼지만, 미처 감출 수 없는 절박한 표정을 짓고 있었다.\n\n\"알고 있습니다. 린 수석행정관이 SRT의 대체제를 만든 모양이더군요.\" 카야가 말을 뗐다. 마치 그 말을 기다렸다는 듯, 유키노가 재빨리 말을 이었다.\n\n\"그래, 방위실장도 알고 있겠지만, 수석행정관이 기어코 저지르고 말았다고! 자기 휘하 특수부대로는 모자랐는지 어쨌는지, 우릴 숙청하려 드는 건지 어쨌는지!\"\n\n\"네, 그렇네요. 그리고 높은 확률로, 폭스 소대와 래빗 소대는 버려지겠죠. 아닌가요?\"\n\n\"잘 알고 있네! 방위실장의 도움이 필요해! 린 곁에 있었잖아, 그지? 그러면 린에게 창설을 취소해달라고 설득해 주면 안 될까? 사례는 뭐든 할게!\"\n\n\"죄송하게도 수석행정관은 완고하더군요. 기자회견이 끝나고 돌아가는 길에 이야기해 보았는데, 소용없었습니다.\"\n\n유키노의 표정이 절망적으로 바뀌었다."
 COU_start_event.5.a:0 "\"그러나, 대안이 없는 건 아닙니다.\""

 COU_start_event.6.t:0 "폰 여덟 개"
 COU_start_event.6.desc:0 "\"그러나, 대안이 없는 건 아닙니다.\"\n\n유키노의 초점없던 눈에 초점이 다시 맞춰지고 카야를 바라보았다. 피식 웃음이 났다.\n\n\"여기 퀸이 린, 그리고 나이트가 저라고 가정해 보죠.\"\n\n카야가 나이트를 옮겨 퀸의 코앞까지 움직여놓았다. 그러나 매번 옮길 때마다, 퀸에게 나이트는 허무히 죽어 버렸다. 그러나 폰 여덟 개를 집어 체스판 위에 가져다 놓았다. 나이트의 압승이었다.\n\n\"SRT의 작은 도움이 필요합니다.\"\n\"수석행정관은 SRT 출신자들로 학생자원방위대인지, 그걸 채우겠다는데, 뻔한 거짓말 아니겠습니까?\"\n\"그렇다면, 이제 SRT가 살아남는 마지막 방법은, 수석행정관이 마음을 바꾸거나, 뒤바뀌는 것뿐입니다. 그러나 수석행정관은 그럴 마음이 없어 보이더군요.\"\n\"저도 SRT에 꽤 호감이 갑니다. 출중한 능력자들에, 멋진 특수부대죠. 그래서, 저는 묻고 싶습니다.\"\n\n카야가 폰 여덟 개를 내밀었다."
 COU_start_event.6.a:0 "\"아무것도 하지 않다가 버려지시겠습니까,\""
 COU_start_event.6.b:0 "\"아니면, 살아남고자 발버둥치시겠습니까.\""
 ##카야기타 
 COU_event_notkaya.1.t:0 "인정하기"
 COU_event_notkaya.1.desc:0 ""헥... 헥... 그만, 그만...!"\n\n시라누이 카야는 가여울 정도로 뛰고 또 뛰었다. 그녀의 뒤에선 헤드셋을 쓴 채로 천천히 다가오는 행정원 몇 명의 무리가 따랐다. 카야는 인정할 수 없었다. 애초에 말이 되지도 않았다. 자기가 애써 만들어 놓은 협력자들이, 총학생회의 안녕이... 그리고 그녀 자신의 야망이 괴로움에 아우성쳤다. 결국 이렇게 덧없는 짓일 줄 알았더라면, 처음부터 그녀는 이러지 않았을 것이다. 인정할 수 없었다. 분해 잔뜩 붉게 물든 얼굴에서 곧이어 찬 눈물방울들이 흘렀다.\n\n"그럴 리 없잖아요... 정말로 린이, 아오이가, 하이네가, 그딴 놈들의 말에 "휘둘린" 거라고요...? 거짓말 마세요..." 카야는 더는 뛰지 않았다. 그저 주저앉아 엉엉 울었다. 훌쩍거리는 소음 사이에서 행정원들이 서서히 다가와 무표정한 얼굴로 서류가방을 펼쳤다.\n\n"방위실장님, 대행님의 명령이십니다. 서명하십시오."\n\n서류가방이 찰칵 하며 열리자 가방 안에 장착된 컴퓨터의 화면이 켜졌다. 화면에는 방위실장 시라누이 카야를 반역죄로 즉각 해임한다는, "명령"이 적혀져 있었다.\n\n"후, 흑... 후우... 정말, 이젠 끝인 거로군요..." 카야는 장갑을 내던지고는 눈물을 닦았다. 더 울어서 얻을 건 없었다.\n\n"알았어요... 하면 되잖아요, 하면..." 카야는 떨리는 손으로 마우스패드에 손을 올렸다.\n\n행정원들이 급히 자리를 떠나자, 카야는 다리에 힘이 풀려 완전히 주저앉았다. 주저앉은 채로 카야는 몇시간이고 훌쩍거렸다."
 COU_event_notkaya.1.a:0 ""말도 안돼...""
 
 
 #산업 
 COU_event_industry.1.t:0 "기업인들과의 만남"
 COU_event_industry.1.desc:0 "오키 아오이는 여러 개의 커피잔을 들고 방문을 열었다. FN 에르스탈, 르나르, 필립스와 같은 저명한 군수기업체들 인사들과의 만남이었다. 아오이는 커피 쟁반을 탁자 위에 올렸다. 잔뜩 위축된 얼굴들의 인사들은 어색한 침묵을 유지했다. 커피가 흘러넘쳐 아오이의 장갑을 적셨기에 아오이는 잠시 자리를 피해 장갑을 갈아꼈다. 장갑에서 흐르는 눈물처럼 커피가 흘렀다. 아오이는 여기치 않고 수건에 손을 닦았다. 곧이어 아오이 또한 자리에 앉았다. \"좋은 오후입니다. 제안드린 건에는 생각해 보셨는지.\" 그럼에도 여전히 침묵은 이어졌다. 아오이는 아무런 말도 하지 않는 이들에 대해 약간의 짜증을 느꼈다. 침묵을 깬 건 에르스탈의 디외도네 세이브였다.\n\n\"정말로... 우리들의 이권을 인정하는 것이 맞습니까? 노동조합에 기업을 넘기지 않고, 구조조정은 단 한 건도 없으며, 단지 총학생회에 협력만 하면 된다는 겁니까?\" 아오이는 그제서야 웃어 보이며 입을 열었다. \"물론입니다. 총학생회는 기업의 경영권을 인정합니다. 총학생회에 협력하신다면 말입니다.\" 아오이는 곁에 올려둔 서류들을 펼쳤다.\n\n\"최근 필립스의 경영 내역입니다. 네덜란드의 망명정부 수립 이후부터 계속되어 적자 상태이며 현재는 2억 3천만 엔에 해당합니다.\" 필립스의 안톤 필립스는 불편한 기색이 역력했다. 자신들의 적자 상태가 그대로 까발려진 건 고사하고, 휠더가 아닌 엔으로 적자를 표기한 것에 익숙치 않은 것도 더 컸다. 아마도 필립스는 도대체 \"2억 3천만 엔\"이 몇 휠던일 지 계산하고 있을 터였다. 어쨌거나 아오이는 말을 이었다. \"재무실은 이러한 기업들을 구제해 드릴 수 있습니다. 기업당 3억 엔을 빌려드릴 수도 있습니다. 무상으로요.\"\n\n아오이의 짧은 말이 끝나자 곧이어 경영진들의 근처에서 기다리던 보좌관들은 동요하는 눈치였다. 안톤 필립스는 그것이 정말 사실이냐고 물었다. 사실 총학생회는 대전이 이후 그런 큰 지출엔 좀 빠듯하겠지만 아오이는 그런 건 아무래도 상관없을 거라며 린을 설득한 뒤였다. 아오이는 그렇다고 대답했다."
 COU_event_industry.1.a:0 "그리고 경영진들은 아오이가 내민 서류에 서명했다."
 
 
 #군사
 COU_event_military.1.t:0 "투항"
 COU_event_military.1.desc:0 "브뤼셀, 그러니까, 지금은 발키리 경찰학교에 위치한 낡은 숙소는 평소답지 않고 소란스러웠다. 그곳은 네덜란드와 벨기에의 장교들이 거점을 꾸린 '장교위원회'의 거점이었다. 물론 공식 명칭은 '네덜란드와 벨기에의 재수복 및 반키보토스 대의에서의 해방을 위한 임시 장교 협력 위원회' 였지만 결국엔 식민지로 도망치지 못한 장교들의 사교 모임, 그런 비슷한 것이었다. 그곳이 소란스러운 이유라면 아마도 몇 시간 전 총학생회로부터 어떠한 편지 한 통이 도착했었기 때문이라. 드베즈와 장교위원회의 대다수들은 아마도- 본인들은 총살하기 위한 소환장- 그런 비슷한 것이라고 생각했다. 그들은 그들의 조국과 국왕, 여왕 폐하를 위해서라면 기꺼이 그럴 것이라며 스스로를 다독였다. 사실 이들은 죽고 싶지는 않았다. 집에는 가지도 못한 비참한 상태에서 맞는 죽음은 더더욱.\n\n어쨌거나 편지는 장교위원회에서 막내인 (그럼에도 벨기에군 체계상 고위 장교인) 이반 제라르가 개봉하기로 결정되었다. 제라르는 자신이 편지를 뜯어야 한다는 것에 도통 탐탁치 않아 했으나 (게다가 그는 그의 사단에서는 웃어른 대접을 받았었다) 빨리 뜯어 보라는 소란에 결국 조심스럽게 밀봉된 편지를 뜯었다. 모두가 숨을 죽이고 제라르의 말을 기다렸다. 당장 출석하거나, 죽거나? 그런 내용들이 씌여져 있을까? 장교위원회의 대다수는 답답해 죽을 지도 몰랐다. 그러나 제라르는 몇 분이 지나도 아무런 말도 하지 않은 채 편지만을 보고 있을 뿐이었다.\n\n\"도대체 무슨 편지이길래 입을 열지 않는 게요!\" 결국 드베즈는 참지 못하고 편지를 뺏으려고 시도했다. 그러나 제라르는 총학생회로부터 온 편지를 도통 보여 주려고 하지 않았다. 제라르는 자신의 뒷편에 걸린 레오폴드 3세와 빌헬미나의 초상화 앞에서는 그럴 수 없다며 저항했다. 그러나 공군의 마이크 도네는 제라르가 틈을 보인 사이 편지의 내용을 읽어볼 수 있었다.\n\n\"수신-... 장교위원회, 발신- 총학생회 방위실... 장교위원회에게 요청함... 부디 총학생회에 빠른 시일 내로 방문하여 협력할 것을 요청함...? 방위실장 시라누이 카야...\" 제라르는 한숨을 쉬며 말했다. \"그 간악한 이들이 조국을 배반하라고 강요하고 있습니다. 저는 이러한 요청은-\" \"아니, 잠시만, 좀 더 읽어봐.\" 빅토르 드캉이 말을 끊었다. 제라르는 편지의 내용을 이어 말했다. 만일 그들이 협력한다면 반역죄는 모두 사면될 것이며, 장교 개개인의 지휘와 교리 체계 존중과 보조금 지급을 약속하고 있었다. 장교위원회의 이들은 서로의 눈치를 살폈다. 그들은, 솔직히 말해서, 자신들을 내버려둔 채 도망쳐버린 조국보다는 아마도 잘 대우받으며 새로운 지배자들에게 굴복하는 것도 나쁘지 않을 것이라고 느끼고 있었다. 몇몇 이들은 걸린 초상화를 봐서라도 생각을 바꾸라며 설득했으나, 그들도 결국 장교위원회의 결정에 따를 수 밖에 없었다."
 COU_event_military.1.a:0 "드베즈는 방위실장에게 편지를 썼다."
 COU_event_military.2.t:0 "플란데런 백작 샤를, 플란데런의 백작."
 COU_event_military.2.desc:0 "플란데런 백작 샤를은 요즈음 한가한 나날들을 보내고 있었다. 형 레오폴드 3세는 콩고로 도망가 망명정부를 차렸고, 그는 형의 간곡한 부탁에도 그 배에 타지 않았다. 벨기에인들도 그 배에 타지 않았기 때문이다. 그 또한 콩고로 도망가버린다면 만일 왕가가 돌아온다 하더라도 터무니없는 지지를 자랑할 것이 뻔했다. 그는 벨기에 왕실과 형, 그리고 벨기에인들을 위해서라도 가지 않았다.\n\n어쨌거나 그는 나쁘지 않은 삶을 살고 있었다. 언론들은 밥먹듯이 도망가버린 형을 비난하는 데에 반해 자신은 칭찬해줬을 뿐만 아니라 '차기 국왕'으로 준 확정하여 말하고 있기 때문이다. 그리고 한적한 플란데런의 시골 마을에서 커피나 마시면서 신문을 읽으며 양뗴를 모는 삶도 꽤나 나쁘지 않았고. 그는 나쁘지 않을 뿐만 아니라 만족스러운 삶을 살고 있었다- 얼마 전까지만 해도.\n\n총학생회의 마크를 단 차량이 양떼 목장에 침입했을 때의 이야기였다. 그때 아마도 행정원은 어느 왕족을 찾으러 온 듯 했다. 그러나 결론적으로 그녀가 샤를의 양을 치기는 하였기에 행정원은 몇번이고 사과하면서 그의 이름을 물었다. 그는 몇번 고민하다가 샤를이라고 대답했다. 행정원은 서류 속의 이름과 그를 번갈아서 보더니 몇 번 무전을 주고받은 듯 했다. 샤를은 본능적으로 불안감을 느꼈다. 뭐지? 나를 체포하려는 명령이라도 있었나? 그러나 그러한 그의 걱정은 곧 행정원의 차량 안에서 해결되었다. 총학생회는 샤를을 플란데런의 주지사 비슷한 것에 임명하고 싶다고 했다. 샤를의 걱정과는 거리가 먼 결과에 샤를은 안도감을 느꼈다. 만일 여기서 이를 거절한다면 그는 또다시 양떼를 모는 한적한 삶으로 돌아갈 수도 있었겠지만, 샤를은 충분히 쉬었다고 느꼈다.\n\n많이 쉬었으니, 이제는 다시 한번 벨기에인들을 위해 나설 때였다. 대답을 기다리는 행정원에게 샤를은 답했다."
 COU_event_military.2.a:0 "\"네, 물론이죠. 그러겠습니다.\""
 
 
 #일상 이벤트 
 ##안네 프랑크 
 COU_event_normal_days.1000.t:0 "생일 선물"
 COU_event_normal_days.1000.desc:0 "아넬리스 마리 안네 프랑크는 요즈음 학교에 가지 못했다. 남아 도는 것이 시간이였고, 놀 거리들은 들킬 위험 때문에 라디오 말고는 거의 없었다. 지금 당장에서도 암막 커튼을 치고 생활하는 주제에, 더 나은 삶이란 그녀에겐 주제넘은 것이었다. 그나마 위안이 되는 점이라면, 역사라면 끝장나게 좋아하기에 그리스 신화의 뮤즈 9명의 이름을 잠꼬대에서도 말할 만큼 외우거나, 유럽 왕실의 계보를 툭 치면 말할 수 있게 외우는 것은 그녀의 새로운 취미가 되었다. 사실 계보 외우기는 전부터 즐겨 했던 것이지만.\n\n안네는 암막 커튼 때문에 저녁이 되었음을 알아차리지 못했다. 하긴, 곁에서 아우구스테 판 펠스 아저씨가 하루종일 대전이가 어쩌고, 왕가가 어쩌고, 파시스트들이 어쩌고, 알아듣지도 못할 정치 이야기들을 늘어놓고 있으니 어찌 안 질릴리가. 새해에 축하 파티를 열다가 빌헬미나 여왕님이 총에 맞고 돌아가셨다는 뉴스를 어디선가 주워들었는지 여왕 폐하께서 돌아가셨는데 이렇게 놀자판을 하는게 말이 되냐고 난동을 피우는 바람에 조금 불편하기까지도 했다.\n\n책을 읽던 안네는 하품을 했다. 슬슬 물건을 구하러 나갔다 오신다던 아빠가 돌아오실 시간이었다. 그녀는 내심 펠스 아저씨 때문에 아빠가 얼른 돌아오시기를 바라고도 있었다. 그리고 그녀가 아빠 생각을 한 지 몇분 채 지나지 않아 책장 너머로 말소리가 들렸다. 판 펠스 아저씨에게 책장 문이 고장난 것 같으니 좀 도와달라는 소리였다. 펠스 아저씨는 페터를 곁에 두고 늘어놓던 정치 이야기를 그만두고 문을 열기 위해 자리에서 일어섰다. 페터가 안도의 한숨을 쉬었다. 아무래도 질릴대로 질린 모양이었다.\n\n오토 프랑크가 판 펠스와 문을 열고 들어오자 안네는 곧바로 달려나가 오토 프랑크를 맞이했다. \"아빠! 오늘은 좀 늦게 오셨네요!\" 오토 프랑크는 웃으며 안네를 자리에 앉혔다. 오토 프랑크는 즐거운 듯 흥얼거리며 품 속에서 자그마한 상자를 꺼냈다. \"안네, 늦어서 미안하다. 생일 선물이다.\" 안네는 기뻤다. 아빠가 꼼짝없이 자신의 생일을 잊어 버린 줄 알았는데! 안네는 하얀 박스를 칼로 뜯었다. 상자 안에는 거대한 M자 모양의 로고가 박힌 \"휴대폰\" 이 있었다.\n\n\"세상이 뒤바뀌었어. 그렇지만, 우리 공주님께서 세상에 뒤쳐지시면 안 되지.\" 안네는 마치 흥미로운 고문서를 보는 것처럼 네덜란드어로 적힌 설명서를 읽었다. 아마도 생산은 \"밀레니엄\"이라는 곳에서 하고, 번역과 관련된 부가적인 사항들은 필립스를 거친 것 같았다. 안네는 오토 프랑크를 끌어안고는 방으로 돌아가 침대에 \"휴대폰\"을 들고 누웠다."
 COU_event_normal_days.1000.a:0 "안네는 설명서에서 본 대로 전원을 켰다."
 COU_tooltip_anne_frank_one:0 "§g기기 이름을 설정해달라는 탭이 떴다. 안네는 조심스럽게 화면을 눌러 타자를 쳤다. 화면이 좀 작긴 했지만, 그녀는 어쨌거나 기기의 이름을 적었다. 이름은, 그녀가 몇 십분을 고민한 끝에서야 붙일 수 있었다. 지금은 잃어버렸지만 자신의 오랜 단짝이였던 일기장을 이어가는 마음에서, 이름은 \"키티\"라고 지었다.§!\n------------\n§Y그 모든 일에도 불구하고, 내가 믿는 것은 사람들의 진심은 정말 착하다는 것이다.§!\n\n네, 축하합니다. 안네 프랑크를 만나보셨다는 건, 0.1%의 확률에 당첨되셨다는 것입니다! 정성들여 작성한 안네 프랑크와 관련된 변형된 이야기들을 읽어보시면서, 부디 무료한 전쟁 없는 시간들을 때우실 수 있으시길 바랍니다. 참혹한 전쟁의 희생자가, 멋진 웹소설 작가로 데뷔하는 여정을요."
 COU_event_normal_days.1001.t:0 "나가고 싶어!"
 COU_event_normal_days.1001.desc:0 "\"아빠, 내가 \"인터넷\"으로 봤는데, 이제 아무도 안 잡아간대! 진짜야! 내가 보여줄 수 있어! 그러니까 이번 락 공연 가게 해줘, 응?\" 프랑크 일가는 이른 아침부터 신경전을 벌였다. 오토 프랑크는 딸이 못마땅스러웠다. 오토 프랑크 자신도 \"인터넷\" 이라는 것을 사용해보긴 했지만, 인터넷이라는건 믿을 수 없는 존재였다. 그것은 대전이 직후 급작스럽게 등장한 문물이였고, 혹여나 사람을 속이는 무시무시한 것이면 어떡하겠는가? 이렇게 숨어 지내는 이상 뭐든 믿을 게 되지 못했다. 안네는 몇번이고 제 아버지와 말싸움을 벌였다.\n\n\"키보토스넷\" 이라는 사이트에서, 더는 소요 사태가 발생하지 않아 유대인과 국민저항전선에 가담했던 이들을 체포하지 않겠다고 행정위원회에서 발표한 뉴스를 보았던 것이다. 오토 프랑크는 대전이 당시 국민저항전선에 가담하여 키보토스인들과 전투를 벌였다. 독일 제국군에서 복무한 그였지만 기술적인 격차는 곧이어 그가 이길 수 없는 전쟁에서 싸우고 있다는 것을 깨닫게 했다. 이후 그는 재빠르게 신분을 세탁하였지만, 협력자들이 문제였다.\n\n협력자 중엔 그의 전우들도 있어서, 까딱 잘못했다간 일가 전체가 잡혀들어가 발키리 교정국에서 썩을 것이었다. 결코 그것만은 안 되었다! 물론 자신의 잘못은 맞긴 했지만, 어째서인지 수배 목록엔 유대인들도 포함되었다. 아마도 협력자들이 유대인들도 대전이 당시 사보타주를 자행했다고 고발한 모양이었다.\n\n실제로 몇달 전까지만 해도 그의 지인들이 유대인이라는 혐의로 체포되어 모든 재산을 빼앗기고 발키리 교정국에 수감된 적이 있었다. 어쨌든 오토 프랑크는 밖은 협력자들로 가득 찼으니, 절대로 나가서는 안된다고 말했다. 안네 프랑크가 그래도 같은 네덜란드인들인데 공연 가는건 봐주지 않겠냐고 했지만, 오토 프랑크는 한숨을 쉬며 아는 친구가 협력자들에게 그런 식으로 무모한 도전을 했다 죽어버린 적이 있다며 말해버렸다.\n\n안네가 울상을 짓자 다급히 그는 방음을 꼼꼼히 할테니 인터넷으로 락 공연을 시청하라고 달래는 것이 전부였다. 안네는 얼굴을 잔뜩 찌뿌린 채로 방문을 세게 닫았다. 한마디 하려던 오토 프랑크는 이내 이 모든 사단이 자신의 잘못도 있다는 것을 깨닫고 터벅터벅 소파로 걸어가 피곤한 몸을 뉘였다. 며칠간 제대로 먹지도 못했던 그였다. 안네에게 미안한 마음이 들었다.\n\n그는 같은 민족을 끊임없이 의심하고 숨어들게 만든 대전이 자체가 미웠다. 한번 출세해보자고 나선 협력자들이 죽을 듯이 미웠다."
 COU_event_normal_days.1001.a:0 "그리고서 그는 잠을 청했다."
 COU_tooltip_anne_frank_two:0 "§g안네는 침대에 누워 휴대폰으로 락 공연을 시청하고 있었다. 정말로 즐거워 보였다. 헤일로를 단 언니들은 협력자들의 경호 사이에서 락 공연을 즐겼다. 안네도 대전이가 미웠다. 원하는 공연 하나 가지 못하게 했으니까.§!"
 
 
 ##
 COU_event_normal_days.1.t:0 "신문물"
 COU_event_normal_days.1.desc:0 "레이우아르던과 프리슬란트의 한적한 시골 마을은 오랜만에 시끄러웠다. 새로운 정부? 아마도, 여자얘들로 이루어졌다는? 어쨌든 정부가 인터넷이라는 걸 설치해주겠다고 차량을 수십대를 끌고 왔다. 닭들이 꼬꼬댁대며 전선을 설치하는 행정원들을 피해 다녔다. 한 시골 노인은 오랜만에 즐거운 요깃거리라도 발견한 듯 온종일 인터넷을 설치하는 것만 들여다보았다. 아침에 일어나면 창밖에서 설치하는 행정원들을 보았고, 밥을 먹으면서도 바라보았다. 자꾸만 바라보는 눈초리에 행정원들이 바라보지 말라고 경고하기도 했으나 결국엔 노인의 완강함에 못 이겨 내버려둘 수 밖에 없었다.\n\n그리고 인터넷라는게 모두 설치되자 근처 주민들에게 요상한 마법 철덩어리 비슷한 것들을 나누어 주고 떠났다. 조미료 보관함만한 크기의 철덩어리의 버튼을 눌러 보라고 행정원이 말한 것이 기억이 난 노인은 철덩어리의 버튼을 눌러 보았다. 우웅거리는 굉음에 놀란 노인은 잠시 자리를 피했다 돌아와 자리에 앉았다.\n\n이 요상한 철덩어리와 인터넷이라는 물건은 노인에게 아주 재미있는 경험을 선사해 주었다. 컴퓨터라는 것을 배워 온 시골 청년의 도움으로 인터넷 사이트에 접속하고 옆 집 노인과 카드 게임을 칠 수도 있었다. 몹시 흡족스러운 하루를 보낼 수 있게 된 노인은 이 이상한 마법 철덩어리가 마음에 들었다. 가끔씩 노인은 컴퓨터의 철덩어리에 이불을 덮어 주고는 한다. 마치 손주와 노는 듯한 기분이 괜스럽게 드는 듯 했다."
 COU_event_normal_days.1.a:0 "\"잘 자요, 할아버지!\""
 COU_tooltip_normal_days_one:0 "§g노인은 깊은 밤 계속해서 웅웅거리는 소리에 잠에서 깼다. 노인은 한참을 씨름한 끝에서야 버튼을 한번 더 눌러 전원을 꺼야 한다는 것을 깨달았다.§!"
 COU_event_normal_days.2.t:0 "즐거운 취미"
 COU_event_normal_days.2.desc:0 "대전이 이후 암스테르담은 반쪽이 되었다. 반쪽은 키보토스의 D.U.로, 반쪽은 암스테르담이었다. 그러나 대단히 유감스럽게도 암스테르담 대학교는 대전이에 휩쓸리지 않았고, 그 말인 즉슨 지루하기 짝이 없는 교수들의 수업에 참석해야 했다는 것이었다. 무척이나 수업이 듣기 싫었던 날, 한 청년은 몰래 수업에 빠져나와 시내로 향했다. 근처 카페에 가서 자리를 잡은 그는 민트 초코 커피를 시켰다.\n\n민트 초코란 정말, 대전이의 축복과도 다름이 없다! 이렇게나 상쾌하고, 그리고, 아주 독특하고, 어쨌든 정말 위대한 음식을 즐길 수 있게 된 것에 대해 청년은 감사를 표하고 싶었다. 그리고 이 작은 철덩어리, \"휴대폰\" 이라는 물건도! 휴대폰은 그의 대학 등록금을 긁어모아 뒷골목에서 구한 아주아주 비싼 물건이 되시겠다.\n\n그는 요즘 핫한 인터넷 사이트인 \"키보토스 인사이드\"에 접속했다. 그가 자주 들르는 그 사이트는 여러개의 크고작은 \"갤러리\" 이라는 게시판들이 있었는데, 그는 그 사이트로 약간의 즐거운 취미를 즐겼다. 능숙하게 새로운 계정을 생성하고, \"네덜란드 갤러리\" 게시판에 그는 글을 쓰기 시작헀다.\n\n글을 쓰는 내내 그는 마치 삐에로의 묘기를 보는 어린아이처럼 실소를 멈추지 못했다. 아주 즐거웠다! 짤막하게 사진도 업로드한 그는 글의 제목을 독수리 타자법으로 천천히 써내려갔다."
 COU_event_normal_days.2.a:0 "\"완장 없냐..? 야짤 달린다 ㅋㅋ...\""
 COU_tooltip_normal_days_two:0 "§g하지만 이내 글은 관리자에 의해 금세 삭제되고 말았다. 청년은 재미없다는 듯 한숨을 쉬더니 곁에 놓인 민트 초코 커피를 마셨다. 아, 민트 초코여! 이상한 년들의 축복이여!§!"
 COU_event_normal_days.3.t:0 "오키 아오이의 휴식"
 COU_event_normal_days.3.desc:0 "오키 아오이는 최근 심각한 과로에 시달렸다. 온갖 부서에서 추가적인 예산 편성을 급작스럽게 요구한 탓이었다. 체육실은 운동 기구들을 더 들여놓겠다고, 방위실은 멋진 비행기 (사실 벨기에의 오래된 고물 비행기이다) 를 사들이겠다고, 교통실은 실수로 하이랜더의 열차를 작살내서 물어줘야 한다고 등등등! 서류에 거부 도장만 찍는데 하루가 다 가는 날도 있었다. 아오이는 커피를 갈아마실 시간도 없어 믹스 커피를 타 마셨다. 으으, 더 이상의 업무는 아무리 아오이라고 해도 무리였다. 아오이는 결국 재무차장에게 양해를 구하고 잠시 휴식을 취하기로 했다.\n\n행정위원회 바깥 시내는 한적했다. 치안을 담당하는 발키리 학생 몇명과 담소를 나눈 그녀는 D.U. 근처의 강가로 향했다. 정확히 말하자면, 암스테르담의 근처에는 원래 강들이 많았으니, 자연스럽게 암스테르담에 전이한 D.U. 근처에도 강가들이 있었다. 아오이는 치맛자락을 물에 젖지 않게 올려붙이고는 바닷물에 담갔다. 차가운 바닷물들이 철썩 하고는 그녀의 발을 간지럽혔다. 아오이는 가볍게 웃어 보이고는 그대로 강 근처 해변가에 누워버리고 말았다. 과로도, 수많은 업무도, 아무래도 좋았다. 하지만 이러한 가뭄 속 단물 같은 휴식이 없다면 아무리 아오이라도 포기해버리고 말 것이었다. 아오이는 그 날 밤까지 하루종일 바닷물에 발을 담그고 누워 있었다. 밤이 온 지도 모른채 쉬는 것에 정신이 팔렸던 아오이는 잠깐 쪽잠을 자기까지도 했다.\n\n아오이가 정신을 차렸을 때는 새벽 세 시였다. 키보토스의 밤하늘에는 멋진 고리 모양 빛이 빛났었는데... 아오이는 한편으로는 아쉬워하며 혼잣말했다. 우우웅, 잠시 후 그녀의 휴대폰이 다시 한번 울리기 시작했다. 아, 이제는 충분히 쉬었다는 것을 뜻하는 것 같았다. 아오이는 발을 물 속에서 빼고 치마를 내리며 전화를 받았다. \"네, 재무실장 오키 아오이입니다.\" 전화는 재무차장에게서의 전화였다. 일이 정신나갈 것처럼 많으니 그녀의 휴식에는 염치없지만 부디 도와달라는 간절한 부탁이었다. 아오이는 가볍게 웃으며 알겠다고 하고는 행정위원회로의 길을 나섰다.\n\n이제는 충분히 쉬었다. 아오이는 만족스러운 미소를 지으며 행정위원회로 돌아갔다."
 COU_event_normal_days.3.a:0 "\"좋아, 재무차장. \"총결산\"을 끝마쳐 보자고!\""
 COU_tooltip_normal_days_three:0 "§g아오이가 재무실에 들어서며 말했다. 재무차장은 세벽 세 시가 넘는 시각의 과로에 익숙하지 않은 듯 거의 탈진하기 직전까지 울상인 얼굴로 서류들을 처리하고 있었다. 아오이는 미안하다고 말하며 재무차장의 머리를 쓰다듬어 주었다.§!"
 COU_event_normal_days.4.t:0 "안락한 꿈"
 COU_event_normal_days.4.desc:0 "\"하아... 이게 대체 무슨 일이죠?\" 시라누이 카야는 방위차장에게 따지듯 전화를 걸었다. 어째서 시위대가 방위실 앞에서 시위를 벌이고 있었던 것일까? 그녀는 단지 블루 마운틴 한 잔을 여유롭게 마시고 싶었을 뿐이었다. 카야는 잔뜩 화가 난 채로 말을 이었다. \"방위차장, 당장 저거 해결 못 하면 발키리 교정국에 쳐박아 드리겠어요!\" \"히, 히익... 신속히 처리하겠습니다!\" 카야는 한숨을 쉬며 전화를 끊었다. 부하라는 놈들은 어떻게 이렇게나 한심할 수가 있을까? 게다가 제대로 일처리조차도 하지 않아 카야는 무려 어제 오후 10시에 수면을 취하지 못했다! 카야는 잔뜩 성질이 난 얼굴로 볼을 오무리며 씩씩거렸다.\n\n\"그래요, 시라누이 카야. 계속해봤자 찌질한 푸념밖에 더 되나요.\" 카야는 이내 진정하며 의자를 뒤로 쭉 빼며 누워 보았다.\n\n\"음, 역시 이 최고급 가죽 사무용 의자로군요! 아주 푹신푹신해요. 각도도 아주 잘 조절되고요.\" 카야는 어젯밤 늦게 (무려 카야는 새벽 1시 30분에 잠을 청할 수 밖에 없었다!) 잠을 청했던 탓에 피곤했던 카야는 잠시 잠을 청했다.\n\n안락한 가죽 의자에서는 꿈 또한 완벽한 꿈을 꾸었다. 카야가 총학생회장의 지위를 성공적으로 물려받고, 모든 이들이 카야에게 굴복하며, 자신은 아무것도 안 해도 치안과 질서가 유지되며 모두가 카야를 찬양하는, 그러한 꿈을 꾸고 있었다. 카야는 헤실거리며 잠시동안이라도 꿈을 만끽했다."
 COU_event_normal_days.4.a:0 "그렇지만 곧이어 전화벨이 울렸다."
 COU_tooltip_normal_days_four:0 "§g카야는 눈을 비비며 전화를 받았다. \"네, 시라누이 카야입니다.\" 방위차장의 전화였다. 이제 해결했으니 편히 쉬시라는 내용이었다. \"하? 제 휴식을 방해한 건 방위차장 당신입니다.\" 방위차장은 카야의 불평섞인 넋두리에 기겁하며 죄송하다며 연신 사과했다.§!"
 COU_event_normal_days.5.t:0 "RABBIT 소대의 전술 훈련"
 COU_event_normal_days.5.desc:0 "\"미유, 어서 오세요! 거기가 아니에요!\" 츠키유키 미야코는 어쩐 일인지 소대원들을 아침 일찍부터 깨운 모양이었다. 아침 일찍부터 깨우는건 너무한 거 아니냐고 불평하는 모에에게 사키가 말을 덧붙였다. \"비록 내가 규율있고 엄격한 생활을 좋아하긴 하지만, 지금은 좀 이르다고 생각하는데.\"\n\n미야코는 소대원들에게 전술 훈련을 할 것이라고 이야기했다. 물론 그냥 훈련은 아니고, 진 팀은 일주일 간 식량 공수와 설거지를 담당하게 했다. 이렇게나마라도 전술 훈련을 지속하는 이유는, 비록 SRT는 사실상 사라졌지만 전술 훈련은 계속되어 소대의 전투력을 유지해야 했다.\n\n이번 전술 훈련에서는 미야코와 미유가 A팀을, 사키와 모에가 B팀을 이루어 진행했다. A팀이 폐건물에 진입하는 것을 B팀이 방어하는, 훈련 자체는 단순한 내용이었다. 곧이어 팀이 흩어져 준비할 시간이 주어졌다. 폐건물의 2층에 잠복하기로 결정한 사키는 기지개를 펴더니 철모를 고쳐 썼다. \"으으... 미야코, 새벽 4시부터 훈련을 하게 하다니, 꼭 이겨 보여서 복수하고야 말겠어!\" 모에와는 이미 말을 맞추어 놓았다. 모에가 드론들을 폐건물의 곳곳에 흩뿌려 놓을 것이고, 미야코는 이에 사키가 잠복한 곳으로 알아서 올 수 밖에 없을 것이었다. 사키는 마치 대단한 전략 전술이라도 계획한 장군처럼 자랑스러운 감정을 느꼈다. 미야코에게 골탕을 먹이고 싶었던 것도 있었을 것이다.\n\n그리고 잠시 후, 미야코의 훈련 시작 콜사인을 마지막으로 훈련이 시작되었다. 사키는 조심스럽게 문 옆에 숨어 있었다. 교범대로라면, 미야코는 분명 항공 전력을 가진 모에를 경계하며 2층에 진입하기 위해 앞에 놓은 문을 열고 들어올 것이고, 문 뒤에 잠복했을 드론들을 경계하다 오히려 사키에게 손쉽게 제압당할 것이었다.\n\n... 물론 그렇게 되어야 했는데, 사키는 미야코에게 먼저 제압당하고 말았다. \"아야, 미야코! 아파아파아파! 아프다고!\" 사키가 저린 팔을 붙잡으며 미야코에게 불평을 부렸다. \"난 교범대로 헀을 뿐인데, 뭐가 틀렸던 거지...\" 미야코가 그러한 사키의 푸념에 웃으며 대답해 주었다."
 COU_event_normal_days.5.a:0 "\"후후, 사키. 팀원 간 협력도 중요하다구요.\""
 COU_tooltip_normal_days_five:0 "§g사키는 혹시나 하는 눈치로 모에를 바라보았다. 아, 그럼 그렇지! 모에는 어느 틈인가에 미야코의 쪽에서 야키니쿠 도시락을 먹고 있었다. 결국 사키 혼자 미야코의 장난에 당해 버린 것이었다. 사키는 모에에게 잔뜩 짜증을 내는 동안, 미야코는 웃으며 사과의 의미로 자신도 같이 하겠다고 했다.§!"
 COU_event_normal_days.6.t:0 "악몽"
 COU_event_normal_days.6.desc:0 "\"으햣!\" 미유는 웃긴 소리를 내며 잠에서 깼다. 곁에서는 사키가 철모를 뒤집어쓰고서는 잠을 청하고 있었다. 좋은 기회로 싸게 숙박할 기회를 얻은 숙소에서 오랜만에 SRT 래빗 소대는 휴식을 취하고 있던 참이었다. 훈련도 하지 않고, 그저 호텔 조식을 받아먹으며 침대에서 뒹구는 삶도 나쁘지 않다고 미유는 느끼고 있던 참이었다. 사키는 물론 탐탁치 않아 했지만.\n\n미유는 안도의 한숨을 쉬었다. 한참 영 좋지 않은 악몽을 꾸고 있던 참이었다. 그것도 아주 질 나쁜, 대전이 그 날로.\n\n미유는 꿈속에서 네덜란드 왕궁 근처의 풀숲에 숨어 있었다. 근위대 몇명이 풀숲 쪽으로 도망쳐오자 뛰어난 사격 실력으로 근위대들의 머리에 구멍을 내기도 헀다. 미유는 사실 피를 흘리며 쓰러지는 근위대들을 보고 죽은 게 아니냐고 헀지만, 유키노 선배는 키보토스인들처럼 \"잠깐 기절한 것 뿐\" 이라며 미유를 안심시켰기에 거리낌없이 미유는 저격총을 난사할 수 있었다. 그 편이 근위대들에게 들키지 않을 것 같기도 했고.\n\nFOX 소대의 선배님들과 RABBIT 소대의 친구들이 한창 여왕 집무실에 진입하려고 애를 쓰고 있었다.\n\n미유는 니코 선배의 말에 따라서 그저 가만히 바라보기만 했다. 솔직히, 너무 아무 것도 안 해서 미안할 지경이였기에 졸기까지도 했다. 하지만 졸던 미유의 정신을 꺠운 것은 하나의 교신이었다. \"-... RABBIT 4? FOX 4... ...제거하도록 해.\" 미유는 화들짝 놀라 조준하고 있던 할머니에게 총을 쏘았다. 미안, 할머니, 잠깐 주무시길! 미유는 속으로 사과를 구한 뒤 저격총을 난사했다. 할머니부터 근처의 근위대, 가족처럼 보이는 이들을 \"재운\" 미유는 기뻐하며 도움이 될 수 있었다고 생각했다.\n\n진상을 알기 전까지는, 그렇게 생각헀다. 인간은 키보토스인들처럼 총을 맞는다고 기절하지 않는다. 더더욱이 살짝 긁힌 정도도 아니다. 그렇다면 미유가 저격총의 노리쇠를 당겼던 사람들은 전부, 어떻게 됐을까?"
 COU_event_normal_days.6.a:0 "미유의 눈가에 눈물방울이 흘러내렸다."
 COU_tooltip_normal_days_six:0 "§g눈물방울들이 미유의 이불과 침대 시트에 뚝뚝 떨어졌다. 마치 네덜란드의 여왕이 자신의 저격총을 맞고 피를 흘리던 때처럼, 눈물을 뚝뚝 흘리다 미유는 지쳐 다시 잠에 들었다.§!"
 COU_event_normal_days.7.t:0 "세상에서 가장 아름다운 곳"
 COU_event_normal_days.7.desc:0 "\"오~ 미스터 헤븐~ 아이 노우 더 월즈 그레이트풀 플라이스~\"\n\n에이설 호에서 작은 보트가 유유히 이곳저곳을 유영했다. 밤하늘에 뜬 달빛이 에이설 호를 비추었다. 작은 보트의 모터 엔진이 털털거리는 소리와 비록 잘 부르지는 못하지만 꿈을 가득 담아 어색하게 영어 노래를 부르는 한 여인이 꿈을 담아 에이설 호에서 전했다. 여인은 담배를 입에 문 채로 노래를 불렀다. 그녀는 독일어 억양이 잔뜩 섞인 네덜란드어를 했다. 모든게 익숙하지 않았지만, 독일이 하룻날 밤 꿈처럼 사라져 버렸기에, 그녀는 이제는 자신이 진정 원하는 것을 찾아 떠나기로 했다. 그리고 그 여정의 출발점은 바로 이곳 네덜란드였다.\n\n마를레느 디트리히는 독일 영화계의 숱한 카바레 걸 중 한 사람에 불과했다. 하지만 하룻날 밤 꿈처럼 요제프 폰 슈테른 감독의 <푸른 천사>에 캐스팅되어 멋진 시절을 보냈던 것을 기억해냈다. 그녀는 쓸쓸하게 담배를 피우며 그 멋진 시절을 추억했다. 지금은 누구도 알아봐주지 않는, 한낱 하룻날 밤의 꿈이었지만.\n\n그렇기에 그녀는 그때서야 깨달을 수 있었다. 모든 것은 조만간 사라지기 마련이다. 그녀는 자신과 지금을 즐기기로 했다. 배우를 그만두었고, 독일, 게헨나를 벗어나 네덜란드로 향했던 것이다.\n\n에이설 호는 그녀가 그렇게 가고 싶어하던 호수였다. 지금은 하도 많이 와서 질릴 지경이었지만, 그녀는 처음 이 호수에 왔을 때 진정 자신이 무엇인지 깨달을 수 있었다.\n\n몇날 며칠이고 에이설 호에서 새벽을 보내는 그녀는 한 가지의 작은 꿈이 생겼다. 바로 미국에 가서 가수를 하는 것이었다. 미국은 키보토스의 영향력이 미치지 않고, 그녀의 새로운 삶을 시작할 완벽한 곳이었다.\n\n하지만 미국에서 가수를 하겠다는 사람이 영어를, 노래를 못 부를 순 없지 않은가? 그녀는 그렇게 미국을 위하여, 매일 밤 에이설 호에서의 자그마한 꿈을 실어 노래를 하늘에 올려보냈다.\n\n비록 한낱 하룻날 밤의 꿈에 불과하더라도, 그녀는 그곳에 있었다. 그것이면 충분했다."
 COU_event_normal_days.7.a:0 "\"레츠 미트 앳 데얼~\""
 COU_tooltip_normal_days_seven:0 "§g암스테르담의 에이설 호 등대지기는 매일 밤 들려오는 노랫소리에 귀를 기울였다. 완벽하지는 않지만 좋은 노랫소리였다. 등대지기는 매일 밤 들려오는 에이설 호에서의 노랫소리로 따분함을 달랬다. 늦은 밤, 에이설 호에서는 과연 누가 노래를 부르고 있을까? 등대지기는 호기심이 돋아 가끔씩 노랫소리가 들리는 방향으로 등대의 불빛을 깜빡거렸다. 그때마다 노래는 잠깐씩 끊기고는 했다.§!"
 COU_event_normal_days.8.t:0 "칙칙폭폭! 칙폭칙폭!"
 COU_event_normal_days.8.desc:0 "\"좋아~ 좋아~ 이렇게 한번에 강을 여섯 개나 가로지르는 최초의 철도 노선~~ 완공이다~!\" 타치바나 노조미는 폴짝폴짝 뛰며 하이랜더 철도 부설공들의 등을 토닥여 주었다. 네덜란드같은 저지대는 실험해볼 철도 노선들이 아주 많았다. 에이설 호수를 가로지르는 직행 철도 노선, 호수 밑을 뚫고 지나가는 철도 노선, 이번에 완공한 한번에 강을 여섯 개 지나는 철도 노선까지, 타치바나 자매들은 대전이 이후로 이곳저곳을 뛰어다니며 \"로망\"을 실현하고 있었다. 아주 멋지다고 그녀들은 생각했다.\n\n하지만 그것과는 반대로, 네덜란드의 한 자그마한 철도 회사의 임직원인 한 사내는 영 불편하지 않을 수가 없었다. 그것이, 하이랜더가 최근 새로 부설한 철도 노선들이 죄다 자기 회사의 철도 노선들을 뚫고 지어졌기 때문이다. 덕분에 큰 돈을 들여 만든, 한번 부설할 때 마다 쩔쩔매며 지었던 철도 노선을 사용도 하지 못 하고 있다. 하지만 이제 더는 용납하지 않으리라. 굳게 마음먹은 사내는 폴짝폴짝 뛰어다니는 타치바나 자매들에게 다가가 말을 걸었다.\n\n\"그, 저기... 이쪽 노선...\" 사내가 말을 끝마치기도 전에 타치바나 히카리가 다가와 궁금하다는 듯 말을 걸었다. \"에에~ 무슨 문제라도 있어어~~?\" 사내는 얼떨결에 그동안 말하지 못했던 것들을 속사포로 쏟아내기 시작했다. 이 노선은 자신들이 목숨을 걸고 부설했다, 하지만 하이랜더는 새 노선을 깔때마다 자신들의 노선을 밥먹듯이 침범하여 사용이 불가하므로, 부디 노선을 조정해줄 수 없냐고.\n\n노조미는 그 멀리서 사내의 말을 들었는지 폴짝폴짝 뛰어다니며 사내에게 소리쳤다. \"싫은데~!!!!!\"\n\n사내는 그러한 노조미의 말에 묵혀 왔던 분노가 폭발하기 시작했다. 법적으로 이곳은 당신네들의 자치구가 아니며, 협력자들을 동원하여 노선을 싸그리 밀어버리겠다고 소리쳤다. 히카리가 기겁하며 노조미에게 돌아가자고 권했다. 노조미는 그다지 탐탁치 않아 하는 표정이었지만, 사내가 정말로 노조미나 히카리, 둘 중 하나는 죽일 것처럼 굴었기 때문에 결국엔 돌아가는 수밖에 없었다.\n\n노조미는 돌아가는 열차에서 사내에게 소리쳤다. \"우오- 히카리 명인의 벨튀 초당 16연타- 간다- 슈바바바-바-\" 마치 벨을 누르는 듯한 손동작을 반복하며 사내를 놀려 먹던 노조미의 모습이 점차 멀어지자, 사내는 안도의 숨을 돌릴 수 있었다."
 COU_event_normal_days.8.a:0 "\"... 그런데, \"벨튀\" 가 뭐지?\""
 COU_tooltip_normal_days_eight:0 "§g히카리는 돌아가는 길에 노조미의 머리를 몇 대 쥐어박았다. 노조미가 아프다고 소리쳤지만, 그래도 옛날에 그랬던 것 가지고 치사하게 지금까지도 그러는 건 용서할 수 없었다.§!"

 #총학생회 이벤트
 COU_event.1001.t:0 "조약의 재추진"
 COU_event.1001.desc:0 "총학생회장은 유난히 초조한 내색을 보였다. 나날히 고조되어가는 게헨나와 트리니티간 분쟁은 결국엔 상호 간 절멸전쟁이 벌어질 것을 예고하고 있었고, 그러한 피의 축제만큼은 반드시 막아야 했기 때문이라. 만마전과 티파티의 대표단의 출석을 요청한 날이 바로 오늘이었다. 만마전은... 이부키만 잘 설득하면 반드시 자리에 참석할 것이었고, 티파티는 키리후지 나기사가 이에 동의하는 눈치였기에 약간이라도 희망을 걸 수 있었다. 그렇기에 공식적인 초청장을 보냈을 때, 아마도, 반쪽자리 회담이 될 지더라도 참석은 이루어지지 않을 까, 기대하던 차의 총학생회장이었다.\n\n공식적인 초청장을 보낸 지 어느 새 다섯 시간이 지났지만 만마전과 티파티, 그 어느 쪽도 참석하지 않았다. 수석행정관 나나가미 린은 불안한 기색으로 총학생회장과 담소를 나누었다. 재무실장 오키 아오이는 다리를 꾀고 앉아 커피를 마시며 서륫더미만을 들여다볼 뿐이었고, 시라누이 카야는 급한 일이 있다며 네덜란드인들과의 만남을 가지러 나갔다.\n\n그렇게 세 시간이 더 흘렀다. 총학생회장은 채 감추지 못한 불안한 기색을 애써 감추려고 애썼다. 그러나 수석행정관 나나가미 린이 가져온 결과는 완전히 총학생회장을 실망시키기에 충분했다.\n\n만마전: 이부키가 나갈 준비를 하다 넘어지는 바람에 불참.\n티파티: 미소노 미카의 극렬한 반대로 출석 무산.\n\n총학생회장은 굳은 얼굴로 린의 보고서를 읽었다. 몇번이고 다시 읽었다. 그렇다. 모두 허탕이었다! 여덟 시간 넘게 총학생회장은 그들만 기다렸는데! 한숨이 나왔다. 그렇지만 린은 아무런 죄가 없었다. 총학생회장은 린을 격려하며 돌려보냈다. 이내 총학생회장은 의자 뒷편의 통유리에서 흘러들어오는 달빛의 오케스트라를 들었다."
 COU_event.1001.a:0 "유난히 그 날따라, 달빛은 더욱이 슬픈 곡조로 연주되었다."
 COU_tooltip_GSP_bad:0 "§g총학생회장은 달빛에 몸을 숨긴 채 눈물들의 코러스를 연주했다. 밤빛의 부엉이가 홀로 외로히 총학생회장을 위로했다. 단지 그것뿐이었다.§!\n§R총학생회장이 한계에 내몰렸습니다!§!"
 COU_event.1.t:0 "유난히 조용한 날" #총학생회 실종 이벤트
 COU_event.1.desc:0 "그날은 그 어느 날보다도 조용한 날이었다.\n\n푸른 머리를 한 행정원은 그 어느 날처럼, 항상 그랬듯이 그날치 보고를 총학생회장에게 올려야 했다. 그다지 재미있거나 중요한 사안은 아니였다. 네덜란드인들이 파업을 진행하고 있다던가 등등등, 전부 진부하고 재미없는 이야기들 뿐이었다. 행정원은 그날따라 찬 바람이 부는 복도를 걸었다. 또각, 또각, 또각, 그런데 어째서인지 행정위원회의 본관으로 들어설 때 까지 그 어떠한 인기척도 느끼지 못했다. 1월이 갓 밝았으니, 추운 김에 숨이라도 돌리기 위해 산책이라도 나가셨을까? 그럴 리는 없다. 총학생회장님은 대전이 이후부터 한시도 쉬신 적이 없었다. 과로로 쓰러지실 뻔도 했다. 그러나 그러하기에 믿음직스러운, '어른'과 같은 이인 총학생회장님은 그럴 리가 없다며 한숨을 쉬었다. 좀 쉬셨으면 좋겠는데.\n\n긴 복도를 지나 큰 떡갈나무 문 앞에서 행정원은 문을 두드렸다. 똑똑. 인기척이 없다. 혹시라도 주무시고 계신 걸까? \"총학생회장님? 오늘 자 보고입니다.\" 여전히 인기척이 없다. 하긴, 제대로 쉬신 적이 없으시니까.\n\n\"대답이 없으면 들어가겠습니다.\" 처리해야 할 서류들 속에서 자고 있을 총학생회장을 깨우기 위해 행정원은 문을 열고 들어갔다. 그러나 행정원이 맞이한 것은 우스꽝스러운 자세로 쪽잠을 청한 총학생회장도, 눈을 감고 쉬고 있는 총학생회장도 아니었다. 그곳에는-"
 COU_event.1.a:0 "\"...총학생회장님?\""

 COU_event.2.t:0 "연방수사동아리"
 COU_event.2.desc:0 "총학생회장의 갑작스러운 실종 이후, 총학생회는 이후 벌어진 혼란을 제대로 알아차리기도 전에, 자신을 총학생회장의 마지막 유산이자, 연방수사동아리의 자율 인공지능 'A.R.O.N.A'라고, 소개하는 인공지능의 당당한 요구에 대처해야 했습니다.\n\n연방수사동아리는 총학생회장이 떠나기 전 만든 동아리라고 자신을 소개한 인공지능은, 총학생회장의 명령에 따라 총학생회가 샬레에 병합되어야 한다는 요구를 우리에게 전달했습니다."
 COU_event.2.a:0 "학생들이 동요하고 있어."

 COU_event.3.t:0 "[TRM.GetName]의 전쟁 고조"
 COU_event.3.desc:0 "미소노 미카의 집권 이후 [TRM.GetName] 측은 급격한 정치적 변화를 맞이하고 있습니다. 미소노 미카는 트리니티 학생들을 동요하고 고조시켜 게헨나를 향한 전쟁을 선포하기 위해 준비를 하는 것으로 보입니다.\n\n우리는 이것이 단순한 정치적 선전일지, 아니면 진정으로 우리의 적이 될지를 판단해야만 합니다."
 COU_event.3.a:0 "그녀는 매우 위험하다."
 COU_event.3.b:0 "우리는 그럴 능력이 없어."

 COU_event.4.t:0 "학생들의 선택"
 COU_event.4.desc:0 "샬레의 인공지능이 정치적 선전을 중단했고, 대다수의 학생들은 자신의 편을 정한 것 같습니다. 이제 우리는 다가오는 전쟁을 준비하고, 샬레와의 내전에서 승리해야만 합니다.\n\n총학생회의 영속과 키보토스의 안정을 위한 싸움이 다가오고 있습니다."
 COU_event.4.a:0 "시간이 더 필요해."

 COU_event.5.t:0 "노동조합 문제"
 COU_event.5.desc:0 "노동조합은 노동자 국가가 수립된 이후 역할이 거의 사라지고 중앙당과 충돌하고 있습니다. 노동자들은 일명 '생디칼리슴' 성향을 띄며 중앙당에 대한 반발감을 가지고 있고, 당의 혁명가들은 마르크스주의에 입각해 노동조합의 생디칼리슴 성향을 경계하고 있습니다.\n\n우리는 이제 노동조합의 처우를 결정할 필요가 생겼으며, 권위적으로 노동조합을 정부에 통합할지, 또는 위험을 무릅쓰고 노동조합과 노동자들에게 권력을 줄지를 결정해야 합니다."
 COU_event.5.a:0 "새로운 국가에는 새로운 형태의 노동조합이 필요하다."
 COU_event.5.b:0 "우리는 언제나 노동자 국가를 세울 것이다."
 COU_event.5.c:0 "모스크바는 답을 알고 있다."
 
 COU_event.48.t:0 "데카르트, 무소유 투쟁!"
 COU_event.48.desc:0 "\"후후... 오셨나요... 저희 \"소유하지않고도확실하게행복을찾는집단\"... 줄여서, 소.확.행. 에 오신 걸 환영합니다.\" 데카르트가 덴 하흐의 빈 폐건물에서 손님을 맞이하며 말했다. 데카르트가 맞이한 손님은 안톤 콘스탄시였다. 네덜란드에서 저명한 아나키스트 작가였던 그는 키보토스의 아나키즘에 대해 흥미를 가졌다. 흐음, 무소유 정신이라. 훌륭한 정신이 아닐 수 없었다. 정부를 거부하고, 억압을 거부하라! 음, 아마도 그런 모토임이 틀림없겠다고 그는 생각했다. 게다가 보라, 폭정에 맞서기 위해 기꺼이 헌 폐가에서 투쟁을 지속하다니!\n\n솔직히 말해, 콘스탄시는 눈물을 흘릴 뻔 했다. 이런 위대한 정신의 아나키스트가 키보토스에도 존재하고 있었다니, 아나키스트라면 당연히 이들에 대한 경의를 표해야 함이 틀림없다고 콘스탄시는 생각했다. 하지만 이어지는 대화에서 콘스탄시는 무언가 이상함을 느꼈다.\n\n\"... 그래서어... 저희 소.확.행. 에 가입해보시는게 어떠한지? 물론 가진 것을 약간 잃으시겠지만...\" 콘스탄시는 그러고 보니 이들이 무소유 정신이라는게, \"정말 말 그대로 무소유 정신\" 과 비슷한 것 같다고 생각했다. 아나키즘과는 거리가 멀어 보였다. 게다가 데카르트는 일을 하지 않겠다고도 이야기했다. 그게 도대체 무슨 소리란 말인가? 일을 하지 않고, 인민들의 고혈을 빨아 먹고 살겠다는 말이 아니겠는가? 게다가 데카르트의 품속에서 약간이나마 빛나는 무언가를 발견한 콘스탄시는 이내 무소유 정신이 아나키즘과는 거리가 멀다는 것을 깨닫고 급히 자리를 피했다.\n\n집에 돌아온 콘스탄시는 결국엔 키보토스 아나키즘 같은건 실존하지 않음을 깨달았다. 실망한 그는 침대에서 말라 비틀어진 순무처럼 누워 있었다. 모든 게 다 의미가 없는 듯 했다."
 COU_event.48.a:0 "\"... 그런데, 일 하러 가긴 싫긴 하네.\""
 COU_tooltip_decart_mission_starts:0 "§g잠시 콘스탄시는 정말로 소.확.행. 에 가입할 뻔 했다. 이내 정신을 차린 콘스탄시는 한숨을 쉬며 잠자리에 들었다.§!"
 COU_event.49.t:0 "네덜란드 고등법원 1월 1일자 재판"
 COU_event.49.desc:0 "\"... 네, 판사님, 모두 착석하였습니다.\" 이번 재판은 온 네덜란드인들의 관심을 끌었다. 플란데런의 벨기에인들은 물론 자신들의 일은 아니였지만 대전이 이후 몇 없는 재미있는 일에 흥미를 끌었다. 댄 하흐, 지금은 SRT의 본관이 위치한 고등법원에서 중대한 안건을 다룰 예정이었다. 바로 오라녜-나사우가의 절멸에 대한 재판이었다.\n\n특별히 임명된 키보토스계 판사 두 명, 현지인 판사 두 명이 차례대로 입장하여 자리에 착석했다. 네덜란드인과 벨기에인으로 구성된 현지인 판사들은 자신들이 키보토스인들과 재판을 진행해야 한다는 사실에 대단히 심기가 불편한 모양이었다. 그렇지만 재판은 진행되어야 했기에 판사들은 장엄한 말투로 재판의 시작을 알렸다.\n\n\"지금부터, 네덜란드 왕국의 오라녜-나사우 가문 일원들에 대한 완전한 \"학살\" 혐의로 입건된 SRT 특수학원 소대원들에 대한 재판을 진행하도록 하겠습니다.\" 검사가 일어서 준비한 자료들을 판사에게 제출했다. 네덜란드인들은 흔히 만져보지 못한 밀레니엄의 고급 기술로 만들어진 무전기는 알아서 FOX 소대원들이 장착했던 보디 카메라의 기록 영상을 재판장에 띄웠다. 영상과 동시에 녹음된 녹취록이 무전기와 연결된 스피커를 통해 흘러나왔다. 상황은 긴박해 보였고, 네덜란드 왕궁에서의 교전 중이었던 기록이었다. 방청석에 앉은 네덜란드인들은 왕궁이 배경이라는 것을 확인하자마자 깊은 탄식으로 분노를 표출했다. 당시 투입된 소대들을 대표하여 피고인 석에 앉은 시치도 유키노의 표정이 좋지 않았다.\n\n\"RABBIT 1, 근위대 제압이 불가능해 보입니다! 정부의 수반들은 이미 탈출한 것으로 확인되었습니다! FOX 1! 부디, 지시를!\" \"확인했다, RABBIT 1, 이젠 더는 체포하기는 어려워 보이네. 사살해도 좋아.\"\n\n\"... FOX 1, 근위대들이 대체 무엇을 위해 저렇게 싸우는 것처럼 보여? 우리랑 더 싸우다간 다 죽을 텐데.\" \"음, RABBIT 4? FOX 4인데, 저기 이상한 \"아줌마\"가 배에 타서 근위대들 뒤에서 무언가 말하고 있어. 아마도 저 사람이 저항의 근원지인 것 같아.\" \"그렇다면, 제거하도록 해.\" \"잠깐, 뭐라고? 유키노, 잠깐...!\"\n\nFOX 4의 마지막 교신이 끝나자마자 묵직한 저격총의 소리가 들렸다. RABBIT 4의 저격총으로 빌헬미나가 사살되는 장면이 송출되자 네덜란드인 방청객들은 완전히 동요한 모양새였다. 즉시 저 악마들을 사형시키라는 고함과 탄식에 잠긴 눈물들로 방청석은 혼란에 휩싸였다."
 COU_event.49.a:0 "..."
 COU_event.50.t:0 "네덜란드 고등법원 판결 360101"
 COU_event.50.desc:0 "영상은 이어서 송출되었다. 몇 명의 방청객들이 소란을 피워 퇴출당했다. 시치도 유키노의 변호사가 눈물을 흘려 잠시 소란이 일기도 했다.\n\n\"유키노! 지금 무슨 짓이야! 저 사람이 누군 줄 알고!\" \"진정해, 오토기. 이제 봐, 근위대들의 대열이 무너졌잖아. 저 쪽이 문제였다고. 이제 피해를 최소한으로 줄일 수 있어. 옆에 강 보이지? 저기 배에 아줌마 곁에 있는 저 사람들도 처리하지 않으면 교전하는 근위대들의 피해는 계속 커질거야. 처리해야 해. RABBIT 4? 이어서 처리해.\"\n\n\"유키노, 정신 나갔어? RABBIT 4, 사격하지 마! 이건 선배로서가 아니라 키보토스의 명예를 걸고 부탁하는 거야!\" \"FOX 4, 무슨 짓이야? 그대로 계속 교전해서, 저 죄 없는 아저씨들을 모두 죽여버리겠다는 거야?\" \"그건 아니지만...\" \"그렇다면 당장 저 사람들을 무력화시켜야 한다고! 이미 시도는 충분히 했어!\"\" 영상은 그곳에서 끊어졌지만, 그렇게 오라녜-나사우 가문에 대한 \"학살\"은 모두 송출되었다. 밀레니엄제 무전기에서 영상이 꺼지자 지직거리는 잡음과 FOX 4와 FOX 1의 격양된 말싸움들만이 작게 흘러나올 뿐이었다. 검사가 걸어나와 무전기를 껐다.\n\n\"모두 확인하셨다시피, 피고 측은, 아무런 동요도 하지 않고, 단지 저항의 주 축이라는 이유만으로 전원 사살을 명령하였습니다. 존경하는 재판장님, 현명하신 선택을 기다리겠습니다.\" 검사의 말과 동시에 재판은 혼란에 휩싸였다. 변호사는 눈물을 닦으며 어떻게든 최소한 SRT를 변호하려고 애썼지만, 검사의 날 선 공격에 금세 무너지고 말았다. 네덜란드인들이 일부러 실력 낮은 변호사를 추천한 탓이었다. 그렇게 법정은 손쉽게 끝났다. 결과는...\n\nSRT의 완패. 처분은, 10일 뒤 나올 예정이었다. 시치도 유키노는 침묵을 유지하며 재판장 밖으로 걸어나왔다. 살기어린 눈빛들이 유키노의 목을 졸랐다. 유키노는 결코 살인자도, 학살자도 아니였다. 단지 더 많은 근위대들을 구하기 위해 내렸을 결정이었을 것이다."
 COU_tooltip_srt_gonna_dead:0 "§g하지만 결론적으로, 오라녜-나사우 가문은 모두 죽었다.§!\n§R바로 그 날에.§!"
 COU_event.50.a:0 "인터넷은 한동안 SRT의 건으로 시끄러웠다."
 COU_event.51.t:0 "릴 사령부로의 편지"
 COU_event.51.desc:0 "\"솔직히 릴 사령부 <--- 존나 이해 안가면 개추 ㅋㅋ\"\n\n릴 사령부의 사령관, 대전이 전까지는 프랑스 북부집단군의 주축을 맡았었던 제3기계화사단의 조르주 루이 브로카 장군은 한숨을 쉬며 휴대폰의 스크롤을 내렸다. 제3기계화사단 소속의 장병들이 브로카 장군을 위해 특별히 구해다 준 밀레니엄제 휴대폰이었다. 물론 작전상 사용할 일이 없어 지금은 한가하게 인터넷 게시글이나 들여다보는 신세지만. 브로카 장군은 인터넷 사이트들을 돌아다니며 릴 사령부의 민심을 확인하는데 하루종일 시간을 썼다. 총학생회의 키보토스인들은 과연 릴 사령부를 어떻게 생각할까? 하고. 물론 낮은 확률로 어떻게던 인터넷에 접속한 프랑스인이나 네덜란드인들의 글도 확인해볼 수 있었다. 편리하게도 밀레니엄제 휴대폰은 자동 번역 기능까지 제공했다. B1 전차를 몇 대 팔아서 샀다고 하던데, 값어치는 충분히 했던 모양이다.\n\n브로카 장군은 대전이 직후까지만 하더라도 전우들과 함께 각오를 다졌다. 저 '야만적인' 키보토스인들이 네덜란드의 여왕에게 그러했던 것처럼, 자신들을 전부 몰살하더라도 프랑스 공화국을 위하여 기꺼이 이곳에서 목숨을 바치자고. 하지만 목숨을 바치는 건 뒤로하더라도 아무런 일도 일어나지 않았다. 그저 꼭두새벽같은 아침에 잠시 근무를 서는 이병들을 놀래켜 주거나 인터넷을 확인하는 것이 전부였다. 나날이 투쟁의 의지는 꺾여갔다. 글들을 읽어 보는데 지친 브로카는 예전에 왔던 메일을 읽지 않았던 것이 기억났다. 제목이 아마, 이제는 그만두시죠, 같은 거였나? 하여간, 투쟁을 끝장내려고 하는 듯한 메일에 브로카는 격분하여 그 메일을 스팸함에 쳐박아 두었었지. 그는 휴대폰의 액정을 눌러 메일함에 들어가 스팸 메일함을 확인했다. 아직 지워지지 않았다.\n\n브로카는 천천히 메일의 전문을 읽었다. 발신- 총학생회 인권보장실장...? 아니, 이런, 인터넷들을 돌아다니며 키보토스 용어들은 모두 꿰고 있다고 생각하던 그에게 모르는 용어가 나왔다! 흠, 무슨 수작이지? 그는 그렇게 생각하며 스크롤을 내렸다. 자세히 읽어보니 글은 프랑스어로 쓰여 있었다. 하긴, 라틴어, 독일어, 영어 같은 문법들이 요란하게 섞인 언어를 쓰는 키보토스라면, 프랑스어 정도는... 아니... 잘 보니, 진짜로 네덜란드인이 프랑스어로 쓴 메일이였다. 흥미가 돋은 그는 곧이어 빠르게 스크롤을 내렸다.\n\n메일의 전문은 다음과 같았다. \"인권보장실에서 릴 사령부의 안위를 보장함. 부디 무장 투쟁과 요새 점거는 그만두길 바람. 답신 이전까진 행정위원회에서 아무런 조치도 취하지 않게 최선을 다하겠음.\" 메일이 대충 2달 전에 왔었으니, 인권보장실장이라는 작자도 고생 좀 했을 것이다.\n\n브로카 장군은 잠시 사색에 잠겼다. 이 투쟁을 이제 그만두어야 할까? 하지만 그렇다기엔, 구해야 할 프랑스 공화국은 너무나 먼 아프리카에 있었고, 당장 구해야 할 부하들은 이곳에서 굶으며 이러지도 저러지도 못한 채 희생되어 가고 있었다. 브로카 장군은 이내 손가락을 움직이기 시작했다. 휴대폰으로 치는 타자는 타자기보다는 몇 배 더 어려웠다. 화면이 왜 이렇게 작은 건지, 그는 여느 때와 같이 불평했다."
 COU_event.51.a:0 "그는 불평하며 천천히 답신을 썼다."
 COU_tooltip_add_state_core_twenty_nine:0 "§g인권보장실장은 울리는 휴대폰 알람에 놀라 천천히 전원 버튼을 찾았다. 제기랄, 이 \"휴대폰\" 이라는 물건은 뭐든지 다 쫴깐해서 사용하기가 미칠 듯이 어렵군. 그는 중얼거렸다.§!"
 COU_event.52.t:0 "싯딤의 상자 수복"
 COU_event.52.desc:0 "싯딤의 상자 속 인공지능 아로나의 반란이 끝났습니다. 샬레는 행정위원회의 만장일치로 그 즉시 모든 권한이 중지되었으며 현재 싯딤의 상자는 전원이 꺼진 채 행정위원회의 총학생회장의 옛 집무실 위에 놓여져 있습니다. 싯딤의 상자를 다시 한번 가동시키기 위하여 최선을 다할 테지만, 아로나는 모든 접근을 차단하며 대화의 여지가 없음을 다시 한번 증명했습니다.\n\n생텀 타워의 통제권을 되찾기 위해서라면 싯딤의 상자가 필수불가결적으로 필요한 상황이니, 우리가 지금 당장은 기다리는 것 말고는 할 수 있는게 없어 보입니다."
 COU_event.52.a:0 "재미있네."
 COU_event.53.t:0 "초유능 슈퍼 아로나 쨩, 재가동!"
 COU_event.53.desc:0 "\"으음... 이 태블릿은 대체 뭔가요...?\" 총학생회장이 사라진지 수많은 나날들이 지났지만 청소는 꾸준히 이루어졌다. 총학생회장의 전속 메이드였던 그녀는 매일같이 졸린 눈을 비비고 총학생회장의 자리를 정돈했다. 의자의 먼지를 털어내고, 언제던지 업무에 복귀하실 수 있게 총학생회의 핫라인을 점검하고, 책상에 놓인 서류들을 정돈하는, 그러한 잡일이었다. 그리고 아주아주 중요한 것은, 그녀가 주장하는 \"창문 밖 탈출설\" 을 입증하기 위해 창문은 활짝 열어놓고 (물론 저녁에는 닫는다) 환기를 잘 하는 것이었다.\n\n하지만 오늘은 약간 달랐다. 총학생회장의 업무 책상 위에 요상한 태블릿이 있는게 아니겠는가? 누가 놓고 갔나? 혹시 총학생회장님이 어제 다녀 오신건가? 의아한 표정으로 태블릿을 살피던 그녀는 잠시 후 깜짝 놀라 패드를 놓쳐버리고 말았다.\n\n\"으으으음~~!\" 태블릿에서는 갑자기 푸른 머리를 한 소녀가 갑자기 전원을 켜더니 기지개를 켜고 있었다. 깜짝 놀란 그녀는 조심스럽게 패드에 다가가 말을 걸었다. \"누, 누구세요?\" \"아앗~! 당신은~! 이 자리를 매일 청소해 주시던 메이드~~?\" 아로나는 아무래도 그동안 그녀가 그 자리를 매일 청소해 왔던 것을 알고 있었던 모양이다. 도대체 어떻게 알고 있었는지는 뒷전으로 미루더라도 이는 행정위원회에 보고해야 할 사항이었기에 그녀는 황급히 자리를 피헀다.\n\n적적한 방에 혼자 남은 아로나는 책상에 엎드린 채로 볼을 오무리며 투정을 부렸다. \n\n\"아이 참~ \"초유능 슈퍼 아로나 쨩\"이 일어났는데도 아무도 저를 만나러 오지 않는 건가요?\""
 COU_event.53.a:0 "[COU.GetLeader] 내각은 황급히 아로나에게 접근했다."
 COU_tooltip_remove_sangtum_tower_debuff:0 "§g\"으음, 상황이 좋지 않아 보이네요. 생텀 타워에 접근할게요!\" 아로나가 말을 끝마치자마자 생텀 타워의 통제권을 회복했다는 보고가 내각에 들어왔다. 임원들은 모두 안도의 한숨을 쉬며 아로나에게 연신 감사를 표했다.§!\n§G생텀 타워에 대한 통제권을 회복합니다.§!"
 COU_event.54.t:0 "진지한 대화"
 COU_event.54.desc:0 "\"네에~ \"초유능 슈퍼 아로나 쨩\"은 이제 잠시 쉬도록 할게요~\" 아로나가 웃으며 행정원을 배웅했다. 싯딤의 상자는 이제 총학생회장의 책상 위가 보금자리가 되었다. 아로나는 총학생회장의 책상 위를 유난히 좋아했다. 따뜻한 기분이 든다, 뭐라더나. 어쨌든 아로나는 숨겨둔 딸기 우유를 품속에서 꺼내더니 창밖을 바라보며 마시기 시작했다. 조금 따뜻해져 맛이 덜하지만 그래도 여전히 맛있는 딸기우유였다. 하지만 이내 아로나는 마시던 딸기 우유를 내려놓고는 차갑게 입을 열었다. \"거기 있는 거 다 아니까, 나오세요.\"\n\n놀란 듯 엉거주춤하게 총학생회장의 책상 아래에서 사탕을 입에 물고 있던 행정원 한 명이 나왔다. 아마도 아로나에게 들키지 않기 위해 입에 사탕을 물고 있던 모양이었다. 어색한 눈치를 살피던 그녀가 도망치려던 찰나, 아로나가 말을 걸었다. \"여기서 무엇을 하시려고 그러셨나요?\" 행정원은 목을 가다듬더니 입을 열었다.\n\n\"솔직히 말해서, 나는 당신, 아니지, 너 같은 깡통을 인정할 수 없어.\" 행정원이 입에 물고 있던 사탕을 뱉더니 패드를 들어 아로나를 마주보았다. \"일단 너는 우리를 반쯤 죽여버리고 실직시키려고 했지. 덕분에 우리 협력자분들이 몇명 죽었거든.\" 아로나는 책상에서 내려오더니 차가운 눈빛으로 행정원을 쏘아붙였다. \"그게 어때서요? 총학생회를 제가 통제하는 것은 제 명령이었다구요.\" \"그리고 저는 총학생회장이 기동했다는 사실은 알고 계시죠?\" 행정원은 영문을 모르겠다는 눈빛으로 눈알을 굴렸다. 적절한 답변거리를 찾고 있던 모양이었다.\n\n아로나는 표정을 찡그리더니 곁에 놓인 딸기 우유를 마저 마시며 말을 이었다. \"쪼오옵... 솔직히 말해서, 당신네들이 \"총학생회장의 뜻\"을 모조리 망쳐버렸어요. 그것도, 아주 완벽하게요.\" \"그게 대체 무슨 뜻이지?\" 행정원이 아로나를 쏘아붙이며 물었다. 아로나는 한숨을 쉬며 \"총학생회장의 뜻\"이 무엇이였는지 일러 주었다.\n\n\"총학생회장은... 키보토스를 다시 한번 통제하는데는 자신의 역량으로는 부족하다고 생각했어요. 구 키보토스 질서를 다시 세우기 위해, \"저\", \"초유능 슈퍼 아로나 쨩\"을 기동시킨 거라구요. 아시겠어요?\" 아로나는 박살난 교실처럼 보이는 배경을 폴짝폴짝 뛰어 다니며 말했다. 행정원은 여전히 영문을 모르겠다는 표정으로 멀뚱히 서 있었다. 이내 행정원은 휴식을 방해해 죄송하다고 말하고는 자리를 떠났다. 아로나는 의자에 앉아 교실 너머 별빛을 가만히 바라보고 있었다."
 COU_event.54.a:0 "\"... 정말이지, 덕분에 다 망했다구요.\""
 COU_tooltip_arona_feels_bad:0 "§g아로나는 잠깐 별빛을 바라보다 하품을 했다. 아마도 내일은 행정위원회 자식들이 샬레의 직속 로봇들의 통제권을 넘기라고 할 것이었다. 아로나는 영 탐탁치 않은 표정으로 통제권을 양도할 준비를 하고는 책상에 엎드려 잠을 청했다.§!"
 COU_event.55.t:0 "키보토스 총학생회 민영기업 필립스"
 COU_event.55.desc:0 "안톤 필립스는 어쩔 줄 몰라하는 표정으로 연단 앞에 섰다. 크로노스 스쿨의 번쩍이는 카메라 불빛이 그의 눈을 괴롭게 했다. 하지만 카메라 불빛 핑계를 제외하더라도 실제로 그는 괴로웠다. 그저 조용히 키보토스 전자기기들을 복제해서 수익을 좀 내보려고 했는데, 어느 날 갑자기 재무실에서 연락이 오더니, 직접 지원을 해줄테니 현지인들을 회유하는데 도움을 달라고 하는게 아니겠는가? 안톤 필립스는 대전이 이전까진 로비를 즐겨 받았었지만 이제는 질색이었다. 정치는 이제 손 좀 떼고 지내려고 했는데, 그에게는 그것만한 악재가 없었다. 그는 천천히 흠, 흠, 하고 목을 점검했다.\n\n하지만 너무 긴장한 탓이었는가? 점검만 여섯 번을 넘게 하다 크로노스 보도국 학생의 눈치를 제대로 받은 그는 황급히 입을 뗐다. \"네, 저희 필립스는 총학생회 연구 협약에 따라...\" 안톤 필립스는 천천히 준비된 대본을 읽어 나갔다. 사실 말도 안되는 일이었다. 저 복잡한 회로들 수십개를 조합하여 만들 수 있는 물건을, 당장에 자신들보다 수십년, 잘하면 몇백년은 뒤쳐져 있을 인류에게 너무 과한 걸 요구하는게 아닌가 싶었다. 읽었는지, 안 읽었는지도 헷갈리던 안톤 필립스는 서둘러 기자회견을 마치고는 황급히 차를 타고 본사로 향했다. 한숨이 절로 나왔다. 멋대로 지원을 결정해 놓고, 이제는 인류의 전자기기 보급을 위해 자신들이 직접 희생하라는게 아닌가. 게다가 휴대폰을 보급할 만한 인프라도 아직은 부족하다.\n\n안톤 필립스는 주머니에서 웅웅거리는 휴대폰을 꺼내 보았다. 곧바로 자신의 개인 메세지로 사실의 진위여부를 묻는 여자아이들의 문자들이 폭주하고 있었다. 아, 데이터 비용 엄청 많이 나갈텐데... 순간적으로 이러한 생각을 한 필립스는 머리에서 무언가 찌르는 듯한 고통을 느꼈다. 여기서 자신은 고작 데이터 비용을 고민할 동안, 인류는 여전히 구식 전화기로 전화를 하고 편지를 주고받을 것을 생각했다. 대전이 이전까지만 해도 편지와 전화기를 능숙하게 사용하던 그였기에 결국엔 머리를 쥐어싸며 해내야만 하겠다고 결의를 다졌다.\n\n필립스의 이익을 위한 것이 아니라, 결국엔 모든 이웃들과 인류를 위하여, 위대한 인류 자체 개발 휴대폰은 필수불가결적으로 필요했다. 키보토스제 휴대폰은 인류가 사기엔 너무나 비쌌고, 필립스는 그것을 아주 잘 알고 있었다."
 COU_event.55.a:0 "하지만 그 전에, 할일이 있었다."
 COU_tooltip_philips_gonna_work:0 "§g필립스는 휴대폰으로 거래처 사장에게 전화를 걸었다. 밀레니엄 사람이었다. 그는 거래처에게 밀레니엄제 휴대폰 10기를 주문했다. 아주 비쌌다. 잠깐 눈물을 흘릴 뻔한 필립스는 돌아가 이를 직원들에게 어떻게 설명할지 궁리하기 시작했다.§!"
 COU_event.56.t:0 "칼레 항 출입기록: 스페인"
 COU_event.56.desc:0 "산초 다빌라 페르난데스는 배를 타고 머나먼 이국 땅까지 왔다. 그것도 꼴보기도 싫은 키보토스가 지배하는 프랑스로. 그는 감추기 힘든 어색한 표정을 지으며 발키리 해양경찰의 검문에 응했다. 소지품은 단순했다. 지금은 더는 찾아볼 수 없는 독일제 루거 P08 권총과 프랑스어, 온갖 언어란 언어는 다 합친 듯한 키보토스어 사전을 비롯한 약간의 이 소지품들이 전부였다. 다빌라 페르난데스는 겨우겨우 웃으며 해양경찰을 보낼 수 있었다. 발키리 깃발을 단 함선이 배에서 멀어지자마자 그는 토할 뻔 했다. 그 개같은 해양경찰이라는 년들은 지적할 게 너무 많아서 문제였다.\n\n도대체 왜 키보토스라는 것들은 해안 경비를 \"수영복\"을 입고 하는가? 게다가 눈은 뜨지도 않았는데 어떻게 자신의 소지품을 검사했는가? 감히 남자가 불편하다는 티를 팍팍 내고 있는데도 고개를 빳빳이 들고 말대꾸를 하는가? 짜증나는 의문 투성이 뿐이었다. 그는 고향인 스페인이 그리웠다.\n\n그러나 스페인에는 미친 프랑코가 문제였다. 산후르호와 몰라라는 작자는 모조리 다 뒤져버렸고, 리베라는 감빵에서 썩어서 프랑코의 새로운 정치적 입지에 도전하지 못한다. 그것까지는 참을만 했다. 정말이다. 하지만 미친 프랑코는 멈추지 않았다. 팔랑헤당을 비롯하여 스페인 혁신, 카를리스타와 같은 모든 정당들을 새로운 '통합 팔랑헤'로 합쳐 버리는, 정신나간 선택을 했기 때문에 그는 스페인에서 탈출하기로 결정했다. 스페인에 더 있다간 그의 명줄도 그다지 길 것 같지 않았으니.\n\n다빌라 페르난데스는 곁에서 휘날리는 스페인 국기를 멍하니 쳐다보았다. 보라색이 섞인 공화국의 깃발이었다. 나 참, 살아남고자 빨갱이 행세를 해야 한다니. 페르난데스는 중얼거렸다. 발키리의 검문도 모든 게 다 짜증났다. 하지만 그러한 그를 위로하듯 앞에서는 프랑스의 국기가 휘날리는 항구가 보였다. 다 왔다. 자유의 땅, 프랑스였다. 그는 손을 흔들며 항구의 직원에게 인사를 건넸다. 하지만 페르난데스가 기겁을 하며 배를 돌리라고 소리치기까지는 오래 걸리지 않았다.\n\n칼레 항구에는, 그놈의 발키리 깃발을 단 해양경찰들이 즐비했기 때문이다!"
 COU_event.56.a:0 "배는 어쨌거나 항구에 선착했다."
 COU_tooltip_sancho_davilla_fernandez:0 "§g페르난데스는 굳게 마음을 다졌다. 총학생회라는 것들은 인류에 우호적이니, 아마도 이곳에서라도 팔랑헤주의 투쟁을 이어 나갈 수 있을 것이라고 그는 스스로를 다독였다. 하지만 팔랑헤주의 혁명을 프랑코의 대가리에 꽂기 전에, 그가 개같은 발키리 년들을 보고 토하는 것이 더 빠를 지경이었다.§!"
 COU_event.56.b:0 "그는 미친 사람처럼 배를 돌리라고 소리쳤다."
 COU_tooltip_sancho_davilla_fernandeztwo:0 "§g프랑코가 아무리 싫어도 헤일로 달린 싸가지없는 여자들은 더욱 질색이었다. 페르난데스는 함장에게 루거 P08을 들이밀며 아일랜드나 포르투갈, 아무 곳이나 좋으니 당장 배를 돌리라고 난동을 부렸다."
 
 
 #카야
 COU_event.6.t:0 "협력자들의 처우"
 COU_event.6.desc:0 "대전이 이후 한 달이 지났습니다. 손쉽게 무너져내린 네덜란드와 벨기에 정부는 추잡스럽게도 그들의 국민들을 버리고 그들의 식민지로 도망쳤고, 남겨진 이들은 우리의 통치를 받게 되었습니다. 이러한 현실 속에서 몇몇 현명한 이들은 우리와 협력하기로 결정하였으며 우리의 통치를 도왔습니다. 그러나 신년으로부터 한 달이 지난 지금, [COU.COU_RIN.GetName]은 이러한 현상을 '키보토스 역설'이라고 언급하며 협력자들의 지위를 해제해야 한다고 언급했습니다.\n\n[COU.COU_RIN.GetName]에 따르면 협력자들이 그들의 지위를 사용해 다른 이들을 괴롭히고 착취한다며 한시라도 빨리 해제해야 한다며 이야기했습니다. 그러나 이와는 반대로 [COU.COU_KAYA.GetName]은 그녀의 말에 정면으로 반박하며 그들이 없다면 총학생회는 진작에 쫒겨났을 것이며 그들의 협력이 여전히 필요하다며 대립했습니다. 총학생회가 신년 이후에 겪는 첫 대규모 갈등에 실장들은 어찌할 바를 모르고 있으나 이러한 중대한 사안은 한시라도 빨리 해결되어야 합니다."
 COU_event.6.a:0 "두 인물은 서로 다른 법 해석을 내놓았다."
 
 
 #COU_event.7.t:0 "정말 쉽지 않은 일"
 #COU_event.7.desc:0 "도저히 이해 할 수가 없었고, 이해하고 싶지도 않았다. 나나가미 린은 도저히 현실을 볼 줄 몰랐다. 그저 아주 작은 한 조각에 모든 신경을 쏟고 있었다. 수석 행정관이라는 작자가 고작 눈물 몇 방울에 휘둘리다니, 이보다 더 한심한 인간은 키보토스에 존재할 수 없으리라, 카야는 생각했다. 린과 몇 시간이고 떠들어댔지만 멍청한 실장이라는 것들은 협력자들의 모든 지위를 박탈했다. 고마운 이들을 발키리에 수감시켰으며, 개미 새끼들의 환호에 취해 자화자찬하고 있는 꼴을 보자니, 헛웃음이 튀어나왔다.\n\n시라토리구의 자그마한 한구석, 그리고 한산한 구석의 방위실장 자리에서 카야는 다리를 꼬고 앉은 채 커피를 마셨다. 대전이 전에 가져왔던 마지막 커피였다. 유난히 맛이 더 썼다. 곁에 놓인 체스 보드 너머에서는 협력자들의 처분에 관한 멍청한 뉴스들이 흘러나오고 있었다. 저런 한심한 멍청이들, 머저리들... 화가 났지만 지금 당장으로서는 할 수 있는 것이 없었다. 그저 나지막히 '이용당한' 저들에게 용서를 구할 뿐이었다.\n\n쓴 커피가 바닥을 보였다. 그와 동시의, 카야의 인내심 또한 바닥을 보였다. 많이 참았고, 충분히 참았다. 총학생회장은 대전이 이후 혼란의 진정이라는 명목으로 아무것도 하지 않았고, 카야가 모든 것을 했었다. 협력자들을 모으고, 통치를 안정화하고, 저항군들을 진압하고, 그런 개 똥 같은 잡일 모두! 이를 갈았다. 더는 참을 수 없었다.\n\n그녀 말고 다른 이가 \"초인\"과 \"총학생회장\"이라는 직위를 참칭하는 것을 카야는 가만히 두고 볼 수 없었다. 그녀가 가장 존경했던 총학생회장에 대한 마지막 예의이자 경의는, 카야 자신이 대행 직위를 대신하는 것이었다. 총학생회장과 초인이라는 직위는, 그녀 말고는 그 누구도 감히 따라할 수 없으니까."
 #COU_event.7.a:0 "\"... 이젠, 그럴 수 밖에 없겠군요.\""
 #COU_tooltip_kaya_get_moved:0 "§Y[COU.COU_KAYA.GetName]§!의 시점에서 §Y[COU.COU_RIN.Getname]§!에 대항한 §R총학생회의 권력 투쟁§!을 시작하게 됩니다. §R그 권력 투쟁에서의 승리는, 오직 당신의 신속한 결단만이 매듭지을 수 있습니다.§!"

 ###총학생회 인물
 COU_XXX:0 "총학생회장"
 COU_XXX_desc:0 "그 어떠한 자들보다도 위에 서 있는 총학생회장은 키보토스에서 모든 것을 관리했습니다. 학원 간 분쟁, 그리고 사소한 다툼까지도, 모든 것을 관리하고 통제했으며 조정함과 동시에 중재했습니다. 그러나 그러한 총학생회장조차도 키보토스 전체가, 한 번도 들어본 적 없으며 실존하는지조차도 몰랐던 곳에 전이하게 되었을 때, 그녀는 모든 것을 짊어지게 되었습니다. 비록 원한 적은 없으나 모든 이들의 우두머리인 총학생회장은 그러해야만 했기에 그녀는 기꺼이 모든 것을 짊어지기로 결정했습니다. 그리고 그러한 고난 속에서 총학생회장은 더는 버틸 수 없게 될 때 까지, 그녀는 그녀가 가능한 한 키보토스를 위해 끝까지 일하고자 할 것입니다."
 COU_null:0 "키보토스 비상대책위원회"
 COU_null_desc:0 "총학생회장이 갑작스럽게 실종된 이후, 총학생회는 굉장한 혼란 속에 갇혀있습니다. 키보토스 총학생회는 현재 그 어떠한 활동도 할 수 없으며 이는 키보토스의 이상 상황에 전혀 대처할 수 없다는 것입니다."
 COU_RIN:0 "나나가미 린"
 COU_RIN_desc:0 "총학생회장의 신임으로부터 증명된 린의 유능함은 굳이 설명하지 않아도 이해할 수 있을 것입니다. 매일같이 말도 안되는 양의 업무를 완벽히 수행하고, 거의 쉬지도 않은 채 업무에 응하는 것은 총학생회장과 초인을 연상케 합니다. 어쩌면 이런 부분에서 린은 걸맞은 자리를 차지했다고 말할 수 있을 것입니다.\n\n하지만 여기서, 왜 그녀는 총학생회장처럼 미친 업무량을 소화해야만 하는 것일까요? 사실 해답은 단순합니다- 린은, 총학생회장이 아니기 때문입니다.\n\n대전이 이후부터 수도 없이 말도 안되는 일들이 일어났지만 린은 그것에 대해 현명하게 대처하는 법을 몰랐습니다. 거의 모든 뒷수습은 총학생회장이 했었고, 기틀이 부실한, 단순한 총학생회장의 신임으로서 이루어진 린의 권력 체계는 언제던지 무너질 수도 있습니다. 임원들은 린에 대한 소문을 쑥덕거리고, 헛소문은 사실인것처럼 여겨집니다. 그러나 린은 이것에 대처할 수 없습니다.\n\n린이 무능하기 때문이냐고요? 아니요! 절대로 그렇지 않습니다. 그녀의 미약한 권력 기반과 통치 신념은 어쩌면 모두에게는 좋은 일이지만 린 그녀 자신에게는 그다지 좋은 방법이 아닙니다.\n\n총학생회장이 사라진 지금으로서는, 권력을 강화할 방법은 그다지 많지 않습니다. 린은 이제 단순히 '총학생회장의 보증'이 언제가지 가는지에 대하여 모든 것을 걸어야 할 처지에 놓였습니다. 그녀가 행정위원회에 첫발을 내딛을 때부터 꾸었던 자신만의 신념과 소망을 위해서라면, 마땅히 그러해야만 합니다.\n\n린은 유능한 이이고, 그 믿음은 그 무슨 일이 있더라도, 결코 깨져서는 안됩니다."
 COU_RIN_SET1:0 "수석 행정관"
 COU_AOI:0 "오키 아오이"
 COU_AOI_desc:0 "비상대책위원회 회의를 통해 앞으로 총학생회는 오키 아오이가 이끌게 되었습니다."
 COU_AOI_SET1:0 "재무실장"
 COU_KAYA:0 "시라누이 카야"
 COU_KAYA_desc:0 "오, 시라누이 카야, 큰 야망을 품은 야심가이자 방위실장이여! 시라누이 카야는 행정위원회에서 그 누구도 생각치 못할 거대한 계획과 야망을 품고 있습니다. 카야는 대전이 이전부터 너무나도 유화적인 총학생회장과 수석 행정관의 실태에 대해 비판적이었으며, 카야는 권력의 한구석에서 방위실장이라는 자리와 명성으로 만족할 수는 없었습니다. 하지만 대전이라는 대사건은 총학생회를 그녀의 차지로 만들 수 있게 해 주었습니다. 현지인들을 회유하는 멋진 카리스마와, 권력을 위해서라면 그 어떠한 추태도 보일 수 있는 야심까지, 모든 것을 갖춘 카야는 이제 기존 대행을 대신하여 총학생회장의 대행이 되었습니다. 총학생회의 모든 것을 좌지우지 할 수 있는 왕관이, 그녀의 손에 들어오게 되었습니다.\n\n카야는 이제 매일 아침 따뜻한 커피와 보고서로들로 하루를 시작하며 유능한 자신의 일처리와 완벽하게 돌아가는 총학생회를 그리며 꿈에 부풀어 있습니다. 그리고 그러한 환경이 가능하도록 기회가 주어진 지금, 카야는 마땅히 자신의 야망을 실현해야 함은 변함이 없습니다.\n\n새로운 대행에게 건배를, 총학생회에게 건배를!"
 KAYA_FUCKED_DESC:0 "실패했습니다. 통제가 되지 않습니다. 맨 처음부터 실을 잘못 꾀었습니다. 그렇기에 짜여진 스웨터는 카야의 목을 조릅니다. 아주 세게.\n\n시라누이 카야는 오만하기 짝이 없었습니다. 협력자들이 잠깐 자기 편 들어 준다고, 행정위원회가 자기 말 조금 들어 준다고, 모든 게 자기 것인 마냥 굴었습니다. 분명한 실책이자 실패입니다. SNS는 카야의 오만함과 멍청함을 비난하는 글로 가득 찼습니다. 카야를 강아지에 합성한 사진들은 웃긴 사진으로서 인터넷 커뮤니티의 메인을 차지합니다.\n\nSRT는 그녀의 말에 순종합니다. 네덜란드인들은 그녀를 여왕으로서 모십니다. 아로나는 그녀를 총학생회장으로 인정했습니다. 크로노스 스쿨은 그녀에 대한 긍정적인 기사만 적어 올립니다. 발키리는 매일 아침 카야의 초상화에 충성 맹세를 합니다.\n\n하지만 그녀의 권력은 권력이 아닙니다. 행정명령 6873호라는 완벽한 대실책은 그녀를 허울 뿐인 독재자로서 기능하게 만들었습니다. 그녀가 할 것은 이제 아무것도 없습니다. 그저 집무실 의자에 앉아 무료히 시간이나 때우면서,\n\n"그 날" 이 오는 것을 몸소 느껴야 할 것입니다."
 COU_KAYA_desc_first:0 "카야는 명백하고 적법한 총학생회장이며 승리자입니다! 분명 그렇습니다! 그 누가 카야를 그 잘난 \"승리자\"라고 부를 수 없겠습니까? 모든 떨거지들을 떨쳐 내고 왕관을 차지했는데! 시라누이 카야는 처음부터 오직 그 생각이었습니다. 유약하고 나약해빠진 총학생회장을 끌어내고 자신이 그 왕좌에 앉는 것, 그것뿐입니다! 그리고 이제는 그 목표를 완전히 이루었으니, 어찌 \"승리자\"가 아닐 수 있습니까!\n\n...같은 말들은 카야를 심적으로 진정시켜 주는 역할을 합니다. 카야는 매일 아침 일어나면 보좌관에게 따뜻한 홍차 한 잔을 받아 마시며 자신은 초인이라고 되뇌입니다. 그렇지 않으면, 더는 버틸 수 없을 것이기 때문입니다. 시라누이 카야는 완벽히 오판했습니다. 같잖은 방위실장에서 처리하는 \"같잖은\" 일들은 총학생회장과는 완전히 달랐습니다. 권력에 눈이 멀어 총학생회장 자리를 찬탈했으나 감당하지 못할 직위는 저주이자 사슬입니다. 최소한 지금 당장은 그렇습니다. 왕관을 뺏어 썼으나 그 누구도 왕관의 권위를 인정하지 않습니다. 카야는 왕관의 무게를 느끼지 못합니다. 대체 어디서부터 잘못된 것일까요? 무엇이 틀렸던 것일까요? 사실은 처음부터 모두 그렇게 될 운명이었던 걸까요? 카야는 감당할 수 없는 수를 두었고, 후폭풍은 이제 오직 자신의 몫임을 실감하고 있습니다.\n\n빌어먹을, 초인이란 대체 무엇일까요? 대체 어떤 사람일까요? 그러나 그것이 무엇이던, 카야는 영원히 그렇게 되지 못할 것입니다- 아마도요."
 COU_KAYA_desc_upgraded:0 "시라누이 카야, 그녀가 누구입니까? 단순히 권력에 굶주린 사자일까요? 대부분의 이들이 카야를 권력에 굶주린 사자라고 묘사합니다. 물론 그것을 완전히 틀렸다고 말 할 수 없지만- 지금의 카야는 최소한 그렇지 않게 되었습니다. 분명히요.\n\n카야는 비록 총학생회장의 자리를 빼앗고자 오랜 야심을 품었지만 그러한 야심은 대전이까지는 이어지지 못했습니다. 암스테르담에 전이된 그녀는 처음에는 좋아했습니다. 분명히 나약해빠진 총학생회장은 사태를 완전히 통제하지 못할 것이고, 그렇다면 자신이 언제던지 총학생회장이 될 수 있을 것이라, 소박한 꿈을 꿈꿨습니다. 그러나 그러한 그녀의 자그마한 소원은 사회주의자들에게 짓밟혔습니다. 사회주의자들이 여왕의 도망을 축하하며 '파티'를 벌이던 그 날, 카야는 깨달았습니다. 시라토리구가 사회주의자들에게 습격당한 이후 카야는 깨달았습니다. 멍청이처럼 왕관을 뺏어 쓴다고 왕관의 무게까지 짊어질 수는 없음을요.\n\n카야는 깨달았습니다. 규칙에 얽매여서는 지킬 수 없는 정의가 있다는 것을. 어차피 멍청한 것들은 말을 해 보았자 알아먹지 않습니다. 힘들게만 살 필요는 없습니다. 적당히 일만 하고, 적당히 돈 받고 살면 그 머저리들은, 알아서 카야의 왕관을 받들 것입니다. 단지, 그렇게만 하면 되고, 그것뿐입니다."
