l_korean:
 #오프닝
 COU_country_intro_header: "박살난 정의, 추락한 질서"
 COU_country_intro_content: "총학생회는 사실, 학원과 같은 일련의 국가 형태를 띄는 조직이 아니었습니다. 지구의 기관에 비유하자면, 국제연맹과 같은 역할을 담당하던 것이 총학생회였고, 그러하기에 총학생회는 키보토스에서 오랜 시간동안 정의이자 질서로 자리매김했었습니다. 1935년 11월, 비극적인 그 날이 오기 전까지만 해도요.\n\n대전이는 키보토스 전역을 헤집어놓았습니다. 처음부터 끝까지, 당연시되었던 것들은 틀린 것이 되었고, 틀렸다고 생각했던 것들은 이제는 공공연한 사실이 되었습니다. 새로운 삶의 터전에서 살아남고자 총학생회는 불편한 자리를 공유하던 저지대의 국가들과 물리적인 충돌을 피할 수는 없었습니다. 평화로운 접근 방식은 처참한 포격으로 무시당했으며, 인류는 고향을 빼앗긴 "침략자", 키보토스에 대항해 무기를 들었습니다. 키보토스는 압도적인 기술력과 무력으로 이들을 진압했지만, 그 와중의 문제들은 외면할 수 없습니다.\n\n벨기에와 네덜란드는 저지대 전쟁에서 두 달 이상 살아남지 못했습니다. 국왕만이 간신히 탈출한 벨기에와 SRT의 군사 작전 도중 사살당한 빌헬미나 여왕까지, 대전이는 키보토스뿐만 아니라 인류에게도 크나큰 영향을 미쳤습니다. 결코 낫지 않을 커다란 상처를 심어 준 채로.\n\n현명한 이들은 살아남고자 협력하기를 선택했습니다. 시라누이 카야와 방위실의 주도로 창설된 협력자 조직은 총학생회의 대개편과 안정에 도움을 주었습니다. 이들은 새로운 지위를 부여받으며 총학생회의 묵인 속에서 수단과 방법을 가리지 않고 명령을 따릅니다.\n\n그리고 총학생회는 이제 새로운 여명을 맞이해야만 합니다. 대도시 D.U.의 침수부터 국민저항전선의 저항까지, 직면한 모든 과제들은 총학생회와 총학생회장의 분명한 실책이며 대전이의 쓰디쓴 실체임을 여실히 드러내고 있습니다. 더 이상 늦장부릴 시간은 없습니다. 총학생회는 다시 한번 키보토스 위에 군림해야 합니다. 정의를 세워야 합니다. 질서를 바로잡아야만 합니다.\n\n§R멋모른 채로 저지른 모든 죄와 잘못을 속죄하기 위해서라도요.§!\n\n§Y개발 - SKSKIe, YurizonoSeia, Imika§!"
 
 #총학생회라는 존재는 인류로 비유하자면 국제연맹과 같은 하나의 거대한 질서였습니다. 생텀 타워를 중심으로 D.U.와 같은 거대 도시를 중심으로 총학생회는 강성한 학원들 간의 분쟁을 중재하고, 행정을 총괄했습니다. 총학생회장을 필두로 한 통괄실부터 인재자원실까지, 11개의 부서로 이루어진 행정위원회는 현명하게 키보토스를 통치했으며 안정을 유지했습니다.\n\n키보토스의 안녕을 위해 행정위원회의 모든 임원들과 행정원들은 기꺼이 과로를 일삼습니다.\n\n하지만 그러한 과로 틈 사이에서 이들은 권력 투쟁 또한 빼먹지 않습니다. 어떠한 부서가 힘을 얻으려고 시도한다면 이들은 득달같이 달라붙어 행정위원회의 안정적인 민주주의와 질서를 유지했습니다. 그것이 행정위원회였으며 총학생회의 일상이었습니다. 서로가 권력을 견제하고, 학원들 간 갈등을 중재하는 것과 같은 일들이요.\n\n"초인" 총학생회장을 필두로 한 행정위원회는 어쨌던 간에 키보토스를 안정적으로 이끌었으며 모든 이들의 하늘 위에서, 고리와 같은 빛이 번쩍이는, 별빛이 빛나는 은하수 밤하늘 위에서의 질서임은 명백했습니다. 그 누구도 부정할 수 없는, 명백한 하나의 "질서" 말입니다."
 #COU_country_intro_content: "본래부터 총학생회는 트리니티나 게헨나와 같은 학원들처럼 별도의 국가 비슷하게 존재하지는 않았습니다. 본디 총학생회는 연방 전체의 행정을 통괄하는 거대한 규모의 정부였습니다. 인류로 비유하자면, 마치 국제연맹 같은 거대한 규모의 정부 말입니다. 각 학원 자치구간의 충돌을 중재하고, 끊임없이 키보토스의 사악한 무리들로부터 맞서 키보토스를 평화롭게 이끌어나가는 것이 본래의 역할입니다.\n\n그러나, 우리의 위치를 하늘 위에서 떨어뜨린 이상 현상- 앞으로도 영원히 진실이 밝혀지지 못할- "대전이" 에 의해 키보토스는 위기에 놓였습니다. 우리가 맞이한 현실은, 모든 종류의 통신망과 교통망이 마비되었고, 다른 학원들의 상태를 확인할 수 없다는 진실이었습니다.\n\n길고 긴 조사 끝에 우리가 찾아낸 진실은, 믿을 수 없게도 키보토스가 다른 세계로 전이되었다는 사실입니다.\n\n다행히, 우리는 D.U.라는 거대한 기반 도시를 가지고 이동되었기에, 상대적으로 상황이 매우 수월합니다. 그러나, 거대한 학원들이 자신들의 체제를 정비하고 기상하기 시작하면, 더 이상 막을 수 없게 될 것입니다.\n\n우리는 키보토스를 안정적으로 유지하고, 갈등을 잠재울 사명이 있습니다.\n\n§Y개발 - SKSKIe, YurizonoSeia§!"

 COU_guide: "목표\n\n총학생회의 혼란을 해결하십시오.\n총학생회장의 명령을 받은, 존재하던지도 몰랐던 "연방수사동아리 샬레" 의 인공지능 아로나를 통제하십시오.\n\n§Y모래성 위에서의 축하 연회§! \n£white_dot. 총학생회장을 자처하고 싸우십시오. 모래성 위에서의 한낱의 환상일 축하 연회를 위해서.\n£white_dot. 협력자들을 조심히 다루십시오. 고깃덩어리를 눈 앞에 둔 굶주린 사자들과 까마귀들을 조련하듯이요.\n£white_dot. 그리고서는 최후의 투쟁을 치루십시오. 결코 같은 태양 위에서 살아남을 수 없는 공산주의자들에게 맞서서.\n\n§C정당한 대행의 학생회§!\n£white_dot. 폭풍 속에서 권한 대행의 자리를 지켜내십시오.\n£white_dot. 키보토스의 혼란을 잠재우고 새로운 미래를 밝혀내십시오.\n\n§R원하지 않던 자리§!\n£white_dot. 간단하게 시위 문제를 해결하십시오.\n£white_dot. 그리고 운명을 맞이하십시오. 그것이 원하던, 원하지 않았던, 결국에는 찾아올 운명을.\n£white_dot. 원하지 않았지만 결국엔 만들어낸 미래를 지켜보십시오. 그 끝이 어떻게 되던, 그것은, 조만간 당신의 앞에 닥칠 것입니다.\n\n§R그리고서 모든 것이 끝나는 바로 그 날엔, 결국에는 찾아올 운명에 맞서 대면하십시오. 그 결과가 어떻게 되던.§!"

 COU_GATHERING_STORM_DESC: "수천 개의 크고 작은 학교가 모여 연방을 구성하고 있는 거대한 학원도시 키보토스의 중앙구에 위치하고 있는 키보토스 총학생회는 키보토스의 모든 중앙 행정시설을 통제하고 자치구 내에 존재하는 모든 학원 간의 분쟁, 정치 등을 조율하는 기관입니다.\n\n허나 대전이라고 불리는 재앙으로 인해 모든 것은 통제 불능의 상태로 빠져들었습니다.\n\n이 전대미문의 사태를 극복하기 위해 총학생회장은 어떤 선택을 하게 될까요?"

 COU_cut_tower_down_effect_tt: "§Y$COU_cut_tower$§! 국민정신의 효과가 감소합니다."
 COU_NOT_ARREST: "§Y[COU.ROOT.GetName]§!(은)는 억류되지 않음"
 COU_tooltip_after_complete_sojip: "§Y소집이 끝난 이후§! 효과가 발생할 것입니다."
 
 #초기 중점
 COU_establishment_of_emergency_measures_committee_NOT: "행정위원회 소집"
 COU_establishment_of_emergency_measures_committee: "키보토스 비상대책위원회"
 COU_establishment_of_emergency_measures_committee_NOT_desc: "1936년 신년이 밝았고, 총학생회장은 지난 2개월 동안의 실수와 실패를 교훈삼기 위해 실장들을 소집했습니다. 몇 개월 동안 행정위원회는 전이의 여파를 마무리짓고 신년을 준비할 것입니다."
 COU_establishment_of_emergency_measures_committee_desc: "총학생회장이 행방불명되고 얼마 안 돼서 나타난 자칭 연방수사동아리 \"샬레\"는 총학생회장의 명령에 따라 총학생회가 샬레에 병합되어야 한다는 말도 안 되는 요구를 제시하고 있습니다. 이에 나나가미 린 수석행정관은 본인의 권한으로 총학생회장 권한대행을 맡음과 동시에 키보토스 비상대책위원회를 소집하기로 하였습니다."
 
 COU_support_nanagami: "수석 행정관의 구조적 개편"
 COU_support_nanagami_desc: "수석 행정관, 나나가미 린은  대전이 이후 크게 달라지지 않은 행정위원회의 실책을 지적하면서 근본적인 원인을 해결하기 위한 구조적 개편을 제안했습니다. 이것은 최우선적으로 이행되어야 하는 사안임이 분명합니다."
 COU_united_netherlands_law: "저지대 연합법"
 COU_united_netherlands_law_desc: ""
 COU_survivor_of_kivotos: "키보토스 안정의 보장"
 COU_survivor_of_kivotos_desc: ""
 COU_support_oki: "재무실장의 재무구조 검토"
 COU_support_oki_desc: "재무실장 오키 아오이는 대전이 이후 붕괴한 총학생회의 권위와 더불어 재무구조가 끔찍할 정도로 망가졌다는 사실을 지적하면서 모든 개혁의 우선점은 경제에 집중되어야 한다고 주장했습니다. 당연히 이는 최우선적으로 이행되어야 합니다."
 COU_expropriate_industrialist: "확실한 해결책"
 COU_expropriate_industrialist_desc: ""
 COU_integration_of_puppet_economies: "현지 자본 매수"
 COU_integration_of_puppet_economies_desc: ""
 COU_support_shiranui: "방위실장의 학원방위계획"
 COU_support_shiranui_desc: "대전이와 함께 총학생회가 보장하던 평화가 깨진 지는 오래입니다. 그렇기에 방위실이 오래전부터 구상해온 계획은 대다수가 쓸모 없게 되었으며, 방위실장 시라누이 카야는 이점을 지적했으니 이를 최우선적으로 이행해야 할 것입니다." 
 COU_the_belgian_crusade: "분열시켜 통치한다"
 COU_the_belgian_crusade_desc: ""
 COU_kill_the_medusa: "뱀의 목에 꽂은 창"
 COU_kill_the_medusa_desc: ""
 COU_our_plan_treaty: "전통적인 해결책"
 COU_our_plan_treaty_desc: ""
 COU_our_plan_war:0 "해결을 위한 결단"
 COU_our_plan_war_desc: ""
 
 
 COU_question_about_acting_authority: "좌경화 경계"
 COU_question_about_acting_authority_desc: "일부 행정위원회 위원은 현 유라기 모모카 교통실장의 성향에 대해 부정적인 시각을 가지고 있습니다. 이는 교통실장이 총학생회장의 행방불명으로 인한 상황 속에서 현지인들과 결탁하여 키보토스 학생회 자체를 해체시키려는 거대한 음모를 꾸미는게 아니냐는 시각이 존재합니다."
 #COU_martial_measures: "비상 계엄"
 #COU_martial_measures_desc: "앞선 여러 혼란으로 인한 학생들의 지속적인 동요로 인하여 비상대책위원회에서는 현 시간부로 키보토스 중앙구에서의 비상 계엄을 선포하기로 하였습니다."
 COU_crackdown_on_anti_kivotos_activities: "반키보토스 활동 단속"
 COU_crackdown_on_anti_kivotos_activities_desc: "아직 현지인 세력 중에는 우리가 전이해 온 것과 그로 인해 지역 정부가 붕괴한 것에 대해 적대감을 품고 우리에게 저항하는 자들이 많습니다. 우리는 해당 세력들을 단속하여 지역 안정화 증대에 이바지할 필요성이 있습니다."
 COU_political_intervention_of_SRT: "SRT와 접촉"
 COU_political_intervention_of_SRT_desc: "계엄령 시행과 동시에 우리 총학생회의 산하 특수부대인 SRT 특수학원과 접촉하여 대전이로 인해 인원수가 부족한 발키리 경찰학교 대신 지역의 치안을 담당할 수 있게 하자는 의견이 제시되었습니다."
 COU_expedited_administrative_processing: "신속한 행정 처리"
 COU_expedited_administrative_processing_desc: "현재 우리는 행정 마비로 인해 여러 혼란이 발생하고 있습니다. 이를 빠르게 해결하기 위해 행정 마비에 대한 복구를 우선시 하기로 결정하였습니다."
 COU_opening_of_local_culture: "현지 문화 개방"
 COU_opening_of_local_culture_desc: "일부 학생의 동요가 있을지도 모르지만, 현지인 세력과 조력을 위해 먼저 그들의 문화부터 알아야 한다는 의견이 제시되었습니다. 이는 우리에게 충분히 도움이 될지도 모릅니다."
 COU_expansion_of_autonomy: "자치 보장"
 COU_expansion_of_autonomy_desc: "우리는 환영받지 못하는 외지인이고 현지인들에게는 침략자로 보일 뿐입니다. 우선 그들에게 자치를 보장하여 불만을 낮출 필요성이 있습니다."
 COU_establishment_of_human_rights_committee: "인권보장실 설립"
 COU_establishment_of_human_rights_committee_desc: "현재 게헨나와 트리니티가 있던 지역 \"독일\"이라는 국가는 과거 바이마르 헌법이라는 법률을 통해 각 개인 간의 권리를 명시했다고 합니다. 이를 이용하여 우리도 인권보장실을 설립해 학생이든 현지인이든 개개인이 마땅히 누려야 할 기본적인 권리를 누리게 합시다. 인권보장실장은 총학생회에서 유일한 '현지인' 실장이 될 것입니다!"
 COU_focus_add_state_core_nord_fadcale: "프랑스인 자치 보장"
 COU_focus_add_state_core_nord_fadcale_desc: "노르파드칼레 프랑스 주둔군의 일방적인 개입 이후 노르파드칼레는 우리의 영토가 되었고, 노르파드칼레 내 프랑스인들은 제대로 된 자치를 인정받지 못하고 있었습니다. 네덜란드인들과 벨기에인들마저 수용하는 지금, 프랑스인들 하나 는다고 달라지는 것은 없을 것입니다."
 COU_focus_reestablish_srt: "SRT 처우 재논의"
 COU_focus_reestablish_srt_desc: "SRT는 현재 발키리 교정국에 수감되어 있으나, 이들은 상당히 유용한 인재들로서 반드시 다시 한번 제 쓸 곳을 찾아야만 합니다."
 COU_flag_fucking_srt:0 "§RSRT로 인한 소요 사태§!가 발생함."
 COU_union_negotiation: "노동위원회 설립"
 COU_union_negotiation_desc: "우리를 위해 도와주는 현지인들을 위해 노동위원회를 설립하여 그들의 목소리를 들어야 할 필요성이 있습니다."
 COU_infrastructure_restoration: "기반 시설 복구"
 COU_infrastructure_restoration_desc: "현재 우리가 전이한 이세계의 철도망은 우리가 있던 키보토스의 철도망과는 상당히 다른 문제점이 존재합니다. 이를 일부나마 개선할 필요성이 있습니다."
 COU_strengthening_of_valkyrie_authority: "경찰학교 권한 강화"
 COU_strengthening_of_valkyrie_authority_desc: "현 시국을 감안해 발키리 경찰학교의 권한을 강화하여 무기 사용 등 여러 제약에 관한 사항들을 해제할 필요성이 있습니다."
 COU_vertical_integration: "수직적 통합"
 COU_vertical_integration_desc: "일부 불만이 있을지도 모르겠지만 효율성을 위해 생산의 수직 계열상에 있는 여러 기업을 결합하여 비용 저렴화와 남는 공장을 재활용 할 수 있을 것입니다."
 COU_reorganization_of_administrative_committee: "부서 병합"
 COU_reorganization_of_administrative_committee_desc: "각 역할이 비슷한 부서끼리의 병합을 통해 우리의 행정 처리를 더욱 원활하게 처리할 수 있을 것입니다."
 COU_restructuring_of_defense_office: "방위실 재편"
 COU_restructuring_of_defense_office_desc: "방위실을 재편하여 우리가 필요로 하는 위치에 학생들을 적재적소로 투입할 수 있게 할 것입니다."
 COU_normalization_of_administration: "행정 정상화"
 COU_normalization_of_administration_desc: "여러 노력을 통해 행정 체계가 정상화되고 이윽고 마지막 작업만이 남았습니다. 우리는 권력 투쟁에서 주도권을 잡았으며, 총학생회는 이제 앞으로 나아갈 준비가 되었습니다.\n\n§g서로를 영원히 이해할 수 없을 것이기에 이해하지 못하는 것을 통해 우리들을 이해할 수 있을까?§!"
 COU_normalization_of_administration_tt: "현재 §Y권력 투쟁§!의 주축인 §Y시라누이 카야§!는 반대파들과의 권력 투쟁을 종료하진 못했으나, §Y샬레§!에 대한 반대는 합의하는 데 성공하였습니다."
 
