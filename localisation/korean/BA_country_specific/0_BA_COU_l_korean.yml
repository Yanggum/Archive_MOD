 COU_passage_of_labor_law: "노동법 통과"

 COU_initiation_of_free_medical_care: "무상 의료 개시"
 COU_initiation_of_free_medical_care_desc: "훌륭한 국가는 시민이 질병으로 아픈 순간을 내버려두지 않습니다. 종합적인 의료 복지 체계를 만들어, 우리 인구의 전반적인 건강을 개선할 것입니다. 모두가 이를 지키기 위해 몰려들 것입니다."

 COU_workers_republic: "노동자 공화국"

 COU_leftward_shift: "좌경화"
 COU_leftward_shift_desc: "때가 되었습니다. 비상대책위원회 위원장까지 스스로 물러난 지금 우리 키보토스 개혁위원회는 학생과 현지인 가릴 것 없이 모두가 평등하고 단결된 국가를 건설할 것입니다!\n\n§S만국의 노동자여, 단결하라!§!"

 COU_honorary_student_council_president: "명예 학생회장"
 COU_honorary_student_council_president_desc: "§p\"으응? 이번에는 또 무슨 일이야?\"§!\n\n우리는 비록 유라기 모모카를 비상대책위원회의 위원장 자리에서 스스로 물러나게 했으나 개혁위원회의 생각에 따라 그녀를 명예직으로나마 학생회장에 임명해 두는 것이 총학생회 안정화에 도움이 될 것으로 판단하였습니다."

