 BA_decisions_kivotos_public_bond: "키보토스 공채"
 BA_decisions_kivotos_public_bond_desc: "우리는 키보토스의 공식적인 중앙 행정부로써 여러 학원에서 공무원을 등용할 권한이 있습니다."

 BA_decisions_investment_in_student_council: "키보토스 협력 투자"
 BA_decisions_investment_in_student_council_desc: "우리는 키보토스의 중앙 정부와 협력해 학원을 개발하고 발전시킬 여러 투자 안건을 준비해 왔습니다."

 BA_decisions_goverment_target: "[FROM.GetName] 정치 간섭"
 BA_decisions_goverment_target_desc: "우리는 키보토스 국가가 올바른 길로 나아가게 만들 책임이 있습니다. 그러기에 우리는 [FROM.GetName] 측이 길을 벗어나는 것을 용납할 수 없습니다."

 BA_decisions_defensive_war_target: "[FROM.GetName]의 침공에 대응"
 BA_decisions_defensive_war_target_desc: "대전이 이후 우리는 알 수 없는 국가들에게 둘러쌓였습니다. 이러한 상황을 타개하기 위해서는 외세의 침략에 대응하기 위한 연방의 결속이 필요합니다."

 BA_decisions_defensive_join_target: "[FROM.GetName] 초대"
 BA_decisions_defensive_join_target_desc: "이제 산산히 부서져 흩어진 키보토스 국가들을 하나로 모을 강력한 연합 체계를 구축해야 합니다."

