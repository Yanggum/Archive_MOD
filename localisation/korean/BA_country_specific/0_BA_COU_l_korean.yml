 COU_impeachment_of_chief_executive: "권한대행 탄핵"
 COU_impeachment_of_chief_executive_desc: "§g\"당신은 총학생회장이 아니야. 수석행정관. 대행 완장을 찬다고 해서 당신이 그 사람이 되는건 아니니까.\"§!\n\n나나가미 린 수석행정관은 비록 샬레라는 조직 때문이었다고 하나, 그 과정 중에 총학생회장을 격하함으로써 용납할 수 없는 선을 넘었습니다. 우리는 이번 회의에 불신임 투표를 가결해 수석행정관을 탄핵할 것입니다."

