 KPD_low_popular_support: "낮은 인민 지지도"
 KPD_low_popular_support_desc: "안타깝게도 우리는 인민들이 나치 정권 아래에 오랜 기간 노출되어 우리를 지지하지 않는다는 사실을 받아들여야 합니다."
