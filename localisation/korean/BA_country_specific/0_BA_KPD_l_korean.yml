#######이벤트######
 KPD_event.1.t: "포즈난 요구"
 KPD_event.1.d: "우리의 정보부처에 의하면, 기존 독일국의 자리에 새로이 등장한 이계의 세력이 혼란에 휩싸였고, 그것이 소요사태 혹은 내전에 준하는 거대한 흐름으로 이어졌다는 것을 확인했습니다. 우리는 포즈난 지방에 병력을 집결시켜 사흘 내로 점거할 것이며, 지금 군사적 기반이 약한 그들에게 영구적인 양도를 요구할 것입니다."
 KPD_event.1.a: "우리의 땅을 되찾으라!"
 KPD_event.1.b: "너무 위험하다."

 KPD_event.2.t: "포즈난에 진군한 폴란드군"
 KPD_event.2.d: "최근의 혼란이 마무리되었으나, 폴란드군은 갑작스럽게 포즈난으로 진격하여, 그곳에 진주하였습니다. 우리의 수비대는 소규모 저항을 펼쳤으나, 이는 역부족이었으며 우리는 가능한 외교적 혹은 군사적 수단을 고려할 수 있습니다."
 KPD_event.2.a: "섣부르게 행동하지 말자."
 KPD_event.2.b: "그들의 주제를 알게 하라."

 KPD_event.3.t: "베를린 해방"
 KPD_event.3.d: "용맹한 우리들의 혁명전사들은 베를린의 반동과 외세를 격퇴하는 데에 성공하였습니다. 현재 대성당에는 인민연합의 상징인 적기가 휘날리고 있으며, 베를린의 노동자 대중들은 자체적으로 전위대를 조직하여 혁명에 봉사하기를 원합니다."
 KPD_event.3.a: "그들을 환영하자!"
 KPD_event.3.b: "우리 군대에 재편하도록 하지."

 KPD_event.4.t: "함부르크의 노동자들"
 KPD_event.4.d: "우리의 영광스러운 군대가 함부르크에 진입함에 연계하여, 함부르크의 노동자들은 주요한 생산시설을 점거하며 봉기하였습니다. 우리의 혁명정부는 함부르크 노동자 대중의 무력기관 조직의 의지를 파악하고, 그들이 우리의 대오에 굳건히 설 수 있도록 여러 지원을 할 것입니다."
 KPD_event.4.a: "동지들을 환영하오!"
 KPD_event.4.b: "우리 군에 합류한걸 환영하네."

 KPD_event.5.t: "바이에른의 인민대중"
 KPD_event.5.d: "비록 바이에른으로 대표되는 남독일 지방은 나치당의 발상지임과 동시의 파시스트 세력이 강성한 지역이지만, 어느 지방이든 억압받는 이들은 존재하기 나름입니다. 바이에른 지방의 대지주들에 의해 노동력과 잉여생산물을 착취당하는 지역 농민대중과 이존재의 통치로 강화된 착취로써 고통받는 노동자들은 혁명군이 바이에른을 해방하는 것에 환호하였습니다. 이들은 우리와 반자본주의, 반제국주의, 민족해방의 전선에서의 연대를 원했으며, 우리는 그들이 무장하는 것을 기꺼이 도울 것입니다."
 KPD_event.5.a: "억압의 쇠사슬은 끊어졌다!"
 KPD_event.5.b: "이들의 사상적 오염을 주의해야 한다."

 KPD_event.6.t: "동프로이센의 혁명"
 KPD_event.6.d: "부르주아들이 다리를 어떻게 건널지 고민하는 동안, 쾨니히스베르크의 프롤레타리아트는 오랫토록 고통받아왔습니다. 그러나 대전이를 겪으면서 그들은 아리우스라는 군국주의 무장 파시스트 집단에 의해 통치되기 시작하였고, 이는 그들이 지배자에 지속적으로 저항하고 혁명성을 지니게 되는 요인이 되었습니다. 그리고 마침내, [KPD.getName]의 혁명전사들이 쾨니히스베르크에 진격함으로써 그들을 향한 모든 억압과 착취는 즉시 종료되었으며, 또한 강제로 징집되어 반혁명에 봉사할 수밖에 없었던 수많은 청년들이 다시 올바른 이념을 위해 싸우기로 결심하게 만들었습니다. 당은 그러한 청년들을 조직하여 새로운 무력집단을 조직하기로 하였습니다."
 KPD_event.6.a: "지난 과오는 혁명의 열의로써 용서되리라!"
 KPD_event.6.b: "...정말로 수고했네 동지들."

 KPD_event.7.t: "혼란 속에서 피어난 붉은 불꽃"
 KPD_event.7.d: "세계가 혼란에 빠져있을 무렵, 독일에 전이된 이존재들은 파쇼 정권을 무너트리고 반동의 수렁에 빠진 독일 지역에 새로운 변화를 일으켰습니다. 다수의 독일인들은 그들이 나라를 잃었음에 좌절하고 절망하였으나, 또 다른 다수는 그렇지 않았습니다. 분쇄된 파쇼 정권 위에 새로이 들어선 또다른 신정과두제 봉건국가인 트리니티는, 그들의 행정적 한계를 이겨내지 못한 채 두 달 만에 무너져내렸으며, 이로써 대전이를 기점으로 조직된 [KPD.getName]이 활동할 무대가 마련되게 되었습니다."
 KPD_event.7.a: "우리는 다시 일어났다, 스파르타쿠스의 이름으로!"

 KPD_event.8.t: "도시 복구 사업"
 KPD_event.8.d: "대전이의 여파로 소실된 도시를 이전의 모습으로 되돌리자는 의견이 나왔기에 우리는 이에 대한 결정을 내려야 합니다."
 KPD_event.8.a: "과거의 잔재에 연연할 필요는 없다."
 KPD_event.8.b: "재건 사업을 지원하지."

 KPD_event.9.t: "독일-소련 기술 공조"
 KPD_event.9.d: "방금 전 [FROM.GetName]에서 우리와 기술 협력을 하고싶다는 의사를 보여왔습니다."
 KPD_event.9.a: "환영하네 동무."
 KPD_event.9.b: "자네들과는 협력할 마음이 없네."

 KPD_event.10.t: "독일-소련 기술 공조: 수락"
 KPD_event.10.d: "[FROM.GetName]은 우리의 기술 공조 요청을 수락하였고 이제 우리는 [FROM.GetName]의 기술 연구 결과를 받아볼 수 있을 것입니다."
 KPD_event.10.a: "훌륭한 성과군."

 KPD_event.11.t: "독일-소련 기술 공조: 거절"
 KPD_event.11.d: "[FROM.GetName]은 우리의 기술 공조 요청을 거절했습니다."
 KPD_event.11.a: "이런."

 KPD_event.12.t: "자유독일노동조합연맹"
 KPD_event.12.d: "트리니티의 소위 '성스러운' 통치가 무너지고 그들이 남긴 폐허 위로 붉은 깃발이 솟아오름과 동시에, 지하 깊은 곳에서 숨죽이던 독일의 심장이 다시 뛰기 시작했습니다. 지난 나치 정권의 광기와, 이어진 이계의 점령자들이 보여준 '신비'라는 이름의 폭력 아래서 독일의 노동운동은 철저하게 파괴된 것처럼 보였습니다.\n\n허나 공장의 굉음 틈바구니에서, 무너진 벽돌 뒤편에서 노동자들은 암암리에 조직을 재건해 왔습니다. 그들이 조직한 '자유독일노동조합연맹(FDGB)'은 단순한 이익 대변 단체가 아니었습니다. 그들은 유격대에 물자를 공급하는 보급선이었고, 적의 병기 생산을 방해하는 사보타주 공작원이었으며, 무엇보다 이 절망적인 싸움을 포기하지 않게 만드는 정신적 지주였습니다.\n\n승리의 환호성이 베를린을 뒤덮은 지금, 산발적으로 흩어져 있던 각지의 투쟁 위원회와 공장 세포 조직들이 하나의 거대한 대오로 통합되고 있습니다. 도망친 자본가와 융커들의 빈자리를 채우기 위해, 그리고 폐허가 된 조국을 노동자의 손으로 직접 재건하기 위해 FDGB가 전면으로 나선 것입니다. 이것은 단순한 노조의 설립이 아닌, 새로운 독일의 주인이 누구인지를 선포하는 역사적인 순간입니다."
 KPD_event.12.a: "자유로운 노동자들의 연합!"

 KPD_event.13.t: "연합의 균열"
 KPD_event.13.d: "비록 공산당과 사회민주당이 인민연합전선의 주류였다고 하여도, 기타 반나치 성향의 소수정당들과 그들과 결탁하였던 우익정당들마저 우리를 지원하고 그에 동참하였다는 것은 사실입니다. 내전이 끝나고 안정이 시작하는 지금, 그들과 그들의 지지세력은 어서 빨리 총선거를 치룰 것을 요구하고 있습니다."
 KPD_event.13.a: "연합의 갈등이 심해지고 있다."

 KPD_event.14.t: "공장위원회 체제 정비"
 KPD_event.14.d: "통제되지 않는 우리의 공장들을 통제하기 위해 수립된 공장위원회의 체제가 정비되어 더 나은 효율을 보이고 있습니다.\n\n지속적인 개선이 된다면 우리의 민주적인 노동자 관리 체제가 문제없이 동작할 것입니다!"
 KPD_event.14.a: "사회주의를 향한 진전"

 KPD_event.15.t: "공장위원회의 숙련"
 KPD_event.15.d: "우리의 공장위원회는 지속적인 작업과 숙련된 노동자들의 양성으로 더 나은 효율을 보이기 시작했습니다.\n\n여전히 공장위원회를 이용한 노동자 자주 관리 체계는 상명하달보다 미숙한 모습을 보이고 있으나, 지속적인 개선을 통해 중앙의 통제 없이도 더 나은 효율을 보일 수 있을 것입니다."
 KPD_event.15.a: "앞으로!"

 KPD_event.16.t: "노동자 자주 관리"
 KPD_event.16.d: "우리의 공장위원회가 이제는 서구 부르주아 기업이나 소련의 집산화 체계와 비교해도 꿇리지 않으며 효율성 면에서는 더 나은 생산력을 확보하기 시작했습니다.\n\n우리의 노동자 자주 관리 체계는 문제없이 동작할 것이며, 아래로부터의 경제는 발전된 체제가 분명하다는 것이 증명되었습니다!"
 KPD_event.16.a: "노동자와 인민을 위해!"

 KPD_event.17.t: "몰로토프-텔만 협정 준수"
 KPD_event.17.d: "우리 국가가 폴란드 내 조약국의 영유권을 지배하게 되었으며, 우리는 조약을 준수하여 해당 영토를 반환해야 합니다.\n\n만약 우리가 조약을 준수하지 않으면, 해당 국가는 우리 국가에 대한 전쟁을 시작할 위협이 있습니다."
 KPD_event.17.a: "조약을 준수한다."
 KPD_event.17.b: "비밀 협정인데 뭘 어쩔 거야?"

 KPD_event.18.t: "폴란드 분할 조약 파기"
 KPD_event.18.d: "독일과 소련 간의 조약인 폴란드 분할 협정이 방금 전 한 국가의 일방적인 통보로 파기되었습니다.\n\n우리 국가는 해당 문제를 덮고 넘어갈지, 아니면 해당 국가에 대한 전쟁을 통해 우리의 힘을 보여주고, 조약을 강제로 징수할 지 선택해야만 합니다."
 KPD_event.18.a: "대가를 치르게 될 것이다."
 KPD_event.18.b: "덤벼라!"

 KPD_event.19.t: ""
 KPD_event.19.d: ""
 KPD_event.19.a: ""

 KPD_event.20.t: "스탈린에 대한 공포"
 KPD_event.20.d: "모스크바에서 자행된 대숙청 이후 독일 공산당은 분열되기 시작했습니다. 많은 당원이 모스크바에, 스탈린에 대한 믿음을 잃어버리고 NKVD에 대한 공포심이 조성되기 시작했습니다. 뮌젠버그는 이전 와해된 당의 반대 파벌을 결집하고 있기에, 우리는 그를 축출해 냈습니다."
 KPD_event.20.a: "당의 분열."

 KPD_event.21.t: "몰로토프-텔만 조약"
 KPD_event.21.d: "새로 수립된 독일 정부가 폴란드를 분할하는 조약을 우리에게 제안해 왔습니다. 이 조약은 추가적으로 최근 동유럽에서 팽창주의적인 모습을 보여주는 폴란드를 억제하기 위해 상호 방위 협정을 제안하고 있습니다.\n\n새로 수립된 독일 정부는 아직 미약할지 모르지만, 이 협정에 서명한다면 우리는 손쉽게 폴란드를 무너뜨리고 동유럽에 사회주의 질서를 가져올 수 있을 것입니다."
 KPD_event.21.a: "조약에 서명한다."
 KPD_event.21.b: "우리는 이 협정에 동의할 수 없다."

 KPD_event.22.t: "모스크바의 조약 수락"
 KPD_event.22.d: "[SOV.GetName]은 우리의 폴란드 분할 조약을 서명했고 우리는 해당 조약에 의거해 폴란드와 외교 관계를 단절시키고 전쟁을 준비하기 시작했습니다.\n\n안타깝게도 해당 조약에 대해 '독일 국수주의' 라고 비난하는 일부 세력이 존재하나 폴란드를 무너뜨리는 것에는 대다수가 동의하고 있는 것 같습니다."
 KPD_event.22.a: "좋아."

 KPD_event.23.t: "모스크바의 조약 거부"
 KPD_event.23.d: "[SOV.GetName]은 우리의 조약을 거부하고 독일의 팽창주의적 행태를 비판하고 나섰습니다.\n\n이번 사건을 통해 소련과 독일의 외교 관계는 조금 틀어졌으며 코민테른이 폴란드와 전쟁에 돌입하더라도 우리는 대응하기 어려워졌습니다."
 KPD_event.23.a: "안타깝군"

 KPD_event.24.t: "소련의 통제를 받아들인 [FROM.getname]"
 KPD_event.24.d: "[FROM.getname]의 외무부는 코민테른의 대의를 위해 소련의 통제를 수용하고 공산주의 사회 건설에 이바지하겠다는 뜻을 우리의 외무부에 밝혀왔습니다.\n\n전례 없는 일이라 소련의 당원들도 상당한 혼란을 빚고 있으며 만일 해당 결정을 수용할 경우 [FROM.getname]은 우리의 통제에 들어올 것입니다."
 KPD_event.24.a: "연방에 온걸 환영하오 동무."
 KPD_event.24.b: "이 자들이 도대체 뭐라고 한겐가?"

 KPD_event.25.t: "우리의 결정을 수용한 모스크바"
 KPD_event.25.d: "[SOV.GetName]은 우리의 결단을 존중하며 코민테른의 정식 회원국으로 우리를 받아들여 줬습니다.\n\n이제 우리가 바라보는 공산주의 사회의 미래가 점차 가까워지는 것 같습니다."
 KPD_event.25.a: "대의를 위해."

 KPD_event.26.t: "우리의 결정을 거절한 모스크바"
 KPD_event.26.d: "[SOV.GetName]은 우리의 요청을 거절했으며 코민테른의 가입에도 실패했습니다."
 KPD_event.26.a: "이런."

 KPD_event.27.t: "[FROM.GetName]의 폴란드 침공 제안"
 KPD_event.27.d: "[FROM.GetName]측은 우리와 맺은 이전 조약을 언급하며 우리에게 폴란드의 침공을 승인해 달라고 부탁하고 있습니다.\n\n우리는 이 제안을 받아들인다면, [FROM.GetName]측과 함께 [POL.GetName]측을 공격하여 조약에 따라 영토를 분할할 것입니다."
 KPD_event.27.a: "승인한다."
 KPD_event.27.n: "아니, 이는 너무 위험하다."

 KPD_event.28.t: "[FROM.GetName]의 폴란드 침공 승인"
 KPD_event.28.d: "우리 국가의 폴란드 침공 제안을 들은 [FROM.GetName]측은 즉시 군사 작전을 검토하고 있으며, 조약에 따라 폴란드를 반으로 분할할 것을 약속하였습니다."
 KPD_event.28.a: "우리도 전쟁을 준비해야지."

 KPD_event.29.t: "[FROM.GetName]의 폴란드 침공 거절"
 KPD_event.29.d: "우리 국가의 폴란드 침공 제안을 [FROM.GetName]측은 위험성을 이유로 거절하였습니다."
 KPD_event.29.a: "아쉽군."

 KPD_unit_leader_event.2.t: "정식으로 임명받은 [?ROOT.KPD_event_target_loc.GetName]"
 KPD_unit_leader_event.2.desc: "민간인 출신으로 우리 유격대 조직에 큰 공헌을 한 [?ROOT.KPD_event_target_loc.GetName] 은(는) [Root.GetLeader] 가 추진 중인 군 내 계급 도입 과정에서 정식으로 장군 임명을 받았습니다."
 KPD_unit_leader_event.2.a: "좋아."

 KPD_unit_leader_event.3.t: "해산된 [?ROOT.KPD_event_target_loc.GetName]의 부대"
 KPD_unit_leader_event.3.desc: "기존의 민병대 지휘관 [?ROOT.KPD_event_target_loc.GetName] 의 민병대는 오늘 정식으로 [Root.GetName] 정규군에 통합되었고, [?ROOT.KPD_event_target_loc.GetName]은 우리 군의 정식 지휘관으로 인정받았습니다. [?ROOT.KPD_event_target_loc.GetName] 장군은 즉시 [Root.GetName]의 군을 위해 복무를 시작했고, 점차 체제가 정비되어 가고 있습니다."
 KPD_unit_leader_event.3.a: "환영하네, 장군."

 KPD_unit_leader_event.4.t: "[?ROOT.KPD_event_target_loc.GetName]의 전위 조직 해산"
 KPD_unit_leader_event.4.desc: "혁명적 가치를 기반으로 조직된 [?ROOT.KPD_event_target_loc.GetName]의 전위대가 혁명의 성공을 축하하며 오늘 해산 절차를 밟았습니다. [?ROOT.KPD_event_target_loc.GetName]은 우리 군대를 위해 일하고자 하는 의사를 밝혀왔고, 이내 우리 군의 정식 지휘관으로 임명받았습니다. [?ROOT.KPD_event_target_loc.GetName] 장군은 혁명적인 열성으로 복무하고 있으며, 그의 휘하 전위대원들도 입대 과정을 밟고 있는 것으로 추정됩니다."
 KPD_unit_leader_event.4.a: "혁명의 승리를 축하하며."

 KPD_unit_leader_event.5.t: "[?ROOT.KPD_event_target_loc.GetName] 해산"
 KPD_unit_leader_event.5.desc: "우리 혁명에 크게 이바지한 상급 병사 평의회중 하나인 [?ROOT.KPD_event_target_loc.GetName]가 조금 전 해산되었습니다. [?ROOT.KPD_event_target_loc.GetName]는 더 이상 필요하지 않으며, 평의회를 구성하던 고급 인력은 우리 군에 편입될 것입니다.\n\n이 것이 혁명의 후퇴인지, 아니면 당연한 절차인지에 대한 논란은 좌익 내에서 지속적으로 토론이 벌어지고 있습니다."
 KPD_unit_leader_event.5.a: "당연한 절차다."

 KPD_unit_leader_event.6.t: "[?ROOT.KPD_event_target_loc.GetName]의 평의회 해산"
 KPD_unit_leader_event.6.desc: "병사 평의회중 하나를 이끌던 [?ROOT.KPD_event_target_loc.GetName]의 평의회가 조금 전 해산되었습니다. 혁명의 성공에 따라 [?ROOT.KPD_event_target_loc.GetName]의 병사 평의회는 더 이상 필요하지 않으며, 모든 병사 평의회의 해체에 따라 같이 해체되었습니다. [?ROOT.KPD_event_target_loc.GetName] 측은 새로운 정규군의 장교로써 일하고 싶다는 의사를 밝혀왔고, 이내 정식 장교로 승인되었습니다."
 KPD_unit_leader_event.6.a: "새 군에 온걸 환영하네 장군."

 KPD_unit_leader_event.7.t: "계급 개혁 종료"
 KPD_unit_leader_event.7.desc: "모든 무계급 지휘관이 현재 정식 계급을 할당받고 정규군의 편제에 통합되었습니다. 우리는 이제 계급 개혁의 종료를 선언하고 정식으로 다시 태어난 독일군의 모습을 알릴 시간입니다.\n\n이것이 정말 옳은 일인지에 대한 논란은 여기저기서 나타나고 있으나, 제대로 된 정규군의 존재는 혁명의 수호에 필수적일 것이며, 이것이 옳다는 것은 역사가 증명할 것입니다."
 KPD_unit_leader_event.7.a: "대열을 갖춰라!"

 KPD_antileft_event.1.t: "자유 노동조합"
 KPD_antileft_event.1.desc: "우리의 승리 이후, 노동조합 'FDGB'의 본부는 베를린의 고풍스러운 석조 건물에 있지만, 그 진짜 힘은 서류 뭉치가 아닌 매캐한 연기가 피어오르는 공장 현장에 있습니다.\n\n우리는 과거 소련이 범했던 '당에 의한 노동조합의 예속'을 단호히 거부합니다. 우리는 노동조합을 단순한 임금 협상 기구가 아닌 '생산과 분배를 직접 통제하는 자율 조직'의 연합체로 재편하기로 결의했습니다.\n\n\"자본가 놈이든, 당 뱃지를 단 관료든, 우리에게 이래라저래라 할 수는 없다!\" 공업지대의 한 투박한 노동자의 외침은 이제 우리의 공식적인 교리가 되었습니다. 현장의 자율성을 극대화하고, 중앙의 지시는 최소화하는 것. 이것이야말로 진정으로 자유로운 노동자들의 연대입니다."
 KPD_antileft_event.1.a: "모든 노동조합을 자유롭게!"

 KPD_soviet_event.1.t: "당과 대중의 연결점"
 KPD_soviet_event.1.desc: "프롤레타리아 독재가 수립된 지금, 과거 자본주의 체제 하에서의 구습인 '파업'이나 '태업'은 반혁명적인 행위로 규정되어야 마땅합니다. 노동자가 주인인 국가에서 노동자가 국가를 상대로 투쟁한다는 것은, 그 자체로 모순이기 때문입니다.\n\n중앙당의 지도에 따라 '자유독일노동조합연맹(FDGB)'은 전면적인 구조조정에 들어갔습니다. 이제 노동조합의 역할은 임금 인상을 요구하는 것이 아니라, 당의 경제 계획을 현장에 전파하고 생산성을 증대시키며, 노동자들을 공산주의적 인간형으로 개조하는 '학교'가 되는 것입니다.\n\n레닌 동지가 설파했듯, 노동조합은 당이라는 동력을 대중이라는 기계에 전달하는 충실한 전송 벨트가 되어야 합니다. 규율 없는 자유는 방종이며, 당의 지도가 없는 노조는 맹목적인 이익집단일 뿐입니다."
 KPD_soviet_event.1.a: "강철같은 규율, 폭발적인 생산!"

