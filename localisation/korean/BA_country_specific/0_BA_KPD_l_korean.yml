#리워크 - 중점
 KPD_repetition_of_resistance: "반복되는 저항"
 KPD_repetition_of_resistance_desc: "트리니티를 향한 지속적이고 반복적인 저항을 지속하여 저들을 피로 속에 무너뜨려야 합니다. 그 어느 곳도 안전하지 않다는 사실을 일깨워 주어야만 합니다."
 KPD_end_of_trinity: "트리니티의 끝"
 KPD_end_of_trinity_desc: "트리니티 종합학원의 압제는 끝을 맺었습니다. 위대한 승리를 축하하며 독일 정부의 복원을 대대적으로 선포할 시간입니다."
 KPD_anti_trinity_uprising: "반트리니티 봉기"
 KPD_anti_trinity_uprising_desc: "압제자들을 향한 무기를 들어라! 적색 전선이 행진한다!"
 KPD_replication_of_mystic_weaver: "신비 직조기 복제"
 KPD_replication_of_mystic_weaver_desc: "우리를 따르기로 한 일부 트리니티 학생들이 사용할 신비 직조기의 필요성이 언급되고 있습니다."
 KPD_temporary_equality_manifesto: "임시 평등 강령 발효"
 KPD_temporary_equality_manifesto_desc: "1. 트리니티의 학생들은 우리의 해방 전쟁에 있어 독일 인민과 온전히 평등하며 차별 없이 대우받을 것이다.\n2. 모든 독일인과 트리니티의 학생들은 압제자 트리니티 정부에 충성하지 아니하고 저항 활동을 지원하여야 한다.\n3. 위 사항이 지켜지지 않을 시 반혁명에 가담한 것으로 간주된다."
 KPD_securing_of_wartime_supplies: "전시 물자 확보"
 KPD_securing_of_wartime_supplies_desc: "우리의 점령 하에 있는 트리니티 학생들이 보유한 무기, 그리고 버려진 독일 무기고를 비롯한 수 많은 장소에서 우리의 진격에 사용할 장비를 수급해야 합니다."
 KPD_declaration_of_emergency_mobilization_order: "비상 동원령"
 KPD_declaration_of_emergency_mobilization_order_desc: "사방에 우리의 혁명을 선전하고 대의에 협조할 수 많은 사람들을 추가적으로 징병해야 합니다."
 KPD_additional_militia_organization: "추가적인 민병대 조직"
 KPD_additional_militia_organization_desc: "우리의 민병대는 훌륭하게 전쟁에서의 수행을 이어나가고 있습니다. 추가적인 민병대를 창설하여 반트리니티 투쟁에 있어 도움을 얻어낼 수 있습니다."
 KPD_dissolution_of_joint_supreme_command: "연합최고사령부 해산"
 KPD_dissolution_of_joint_supreme_command_desc: "비상 시국에 수립된 연합 최고사령부는 이제 해체되고 수립될 제헌 의회를 통하여 독일 사회주의 공화국이 선포될 것입니다."
 KPD_establishment_of_factory_councils: "공장위원회 설치"
 KPD_establishment_of_factory_councils_desc: "소련의 혁명 당시 수립된 공장위원회는 굉장히 미숙한 경영능력을 보였으나, 이는 교육의 부재라는 치명적인 문재에서 비롯되었을 것입니다. 우리는 독일 인민들의 고등 교육 수준을 믿고 다시 한번 공장위원회를 시도할 것입니다."
 KPD_establishment_of_factory_councils_1_tt: "\n중점 완료 이후 95일 후:"
 KPD_establishment_of_factory_councils_2_tt: "\n중점 완료 이후 190일 후:"
 KPD_establishment_of_factory_councils_3_tt: "\n중점 완료 이후 285일 후:"
 KPD_nationalization_of_industries: "산업위원회 조직"
 KPD_nationalization_of_industries_desc: "대규모의 부르주아지와 융커의 탈출과 산업 사보타주 행위를 해결하기 위해 각지의 산업을 통제하고 총괄할 위원회를 조직해야 하며, 이는 장기적으로 산업 체제를 안정화시킬 수 있을 것입니다."
 KPD_reorganize_nationale_volksarmee: "국가인민군 재편"
 KPD_reorganize_nationale_volksarmee_desc: "군 내에는 아직도 부패와 파시스트 옹호론이 만연합니다. 저항과 반역을 방지하려면 우리에게 반란할 이들부터 솎아내야 합니다. 이 작업 때문에 군 내에 큰 공석이 생길 테니, 인민의 안전을 담보하려면 충성스러운 장교들을 새로 임명함으로써 우리 용맹한 병사들을 생겨날 지 모를 전장으로 지휘해야 합니다."
 KPD_formalize_the_intelligence_wing: "정보부 확립"
 KPD_formalize_the_intelligence_wing_desc: "우리 국가는 인민의 공익은 안중에도 없는 지도자 아래 고난에 시달렸습니다. 국가 재건에 전력을 다하려면 우선 재건할 대상부터 이해해야 합니다. 정보부를 설립함으로써 첫 발을 뗄 수 있을 것이빈다!"
 KPD_free_organization_of_unions: "자유 노조 조직"
 KPD_trade_union_integration: "노동조합 통합"
 KPD_economic_reform_from_below: "아래에서의 경제 개혁"
 KPD_economic_reform_from_above: "위에서의 경제 개혁"
 KPD_risen_from_ruins: "폐허에서 부활하여"
 KPD_expulsion_of_stalinists: "스탈린주의자 축출"
 KPD_expulsion_of_stalinists_desc: "우리가 독립에 있어 소련의 도움을 받았다고 하더라도, 스탈린주의에 대한 광신은 분명히 경계해 마땅한 대상입니다."
 KPD_purge_of_anti_leftists: "반대 좌파 숙청"
 KPD_purge_of_anti_leftists_desc: "당의 분열을 유도하고 연합전선의 위기를 초래하려 한 독일 공산당 반대파 - 사회민주당 좌파 블록을 파괴해야만 합니다."
