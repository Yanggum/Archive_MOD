 KPD_starting_point_of_revolution: "혁명의 시작점"
 KPD_starting_point_of_revolution_desc: "모든 사회주의는 독일에서 시작했고, 앞으로도 그럴 것입니다. 동쪽의 소비에트 연방이 자행하는 마르크스주의에 대한 수정은 저지되어야만 합니다."
 KPD_take_control_of_politics: "당권 장악"
 KPD_leipzig_karl_marx_university: "라이프치히 카를 마르크스 대학교"
 KPD_leipzig_karl_marx_university_desc: "독일에서 다섯 번째로 오래된 대학교인 라이프치히 대학교는 혼란 속에 상당한 파괴를 겪은 후 방치됐습니다. 이제 이 대학교는 독일에서 가장 큰 대학교이자 우리 국가를 대표하는 학교가 될 것입니다."
