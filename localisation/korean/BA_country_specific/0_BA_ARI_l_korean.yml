# 아리우스 설명
 ARI_Trinity_core_states_catagories: "트리니티 통합"
 ARI_Trinity_core_states_catagories_desc: "\n\n£GFX_ARI_trm_add_core\n\n\n\n\n트리니티 종합학원은 머나먼 옛날 제 1회 공의회에서 평화롭게 만들어졌지만 아리우스 분교는 이것이 불평등하다고 생각하여 반대를 하였습니다. 그러자 그들은 평화로운 방법이 아닌 폭력으로 우리의 영토를 강탈하고 분교의 학생들을 빼앗기 시작하였습니다. 분교는 패퇴를 거듭하다 머나먼 오지까지 오게 되었고 오지에서 생존을 위한 투쟁을 이어나가게 되었습니다. 하지만 지금은 상황이 바뀌게 되었습니다. 우리의 항전 끝에 트리니티는 항복하게 되었고, 우리는 영토를 통합 할때가 되었습니다."
 ARI_trinity_core_tt: "트리니티의 핵심주를 §Y전부 소유§!함."
 ARI_Trinity_core_states_decisions: "영토 통합"

 ARI_GATHERING_STORM_DESC: "본래 아리우스 분교는 트리니티 종합학원에 통합될 예정이었으나, 조건으로 제시된 조항의 불평등을 이유로 반대를 주장하던 학원이었습니다. 이에 트리니티 종합학원은 아리우스 학원을 이단으로 지정하였고, 아리우스 학원은 쫓겨나듯 도망가는 신세가 되었습니다. \n\n아리우스 또한 대전이를 피할 수 없었고 이로 인해 더이상 숨을 곳 조차 없어져 버렸으나, 다행히도 트리니티 종합학원은 내부의 혼란 때문에 우리 학원에 신경 쓸 여유 조차 없어 보입니다. \n어쩌면 이것은 아리우스에게 있어 또 다른 기회일 지도 모릅니다."

 ARI_country_intro_header: "꿈과 신기루 사이"
 ARI_country_intro_content: "잡힐 것 같던 행복이라는 꿈은 마치 신기루처럼 사라져 또 다시 멀리 달아나 버렸습니다. 계절이 바뀌고, 세계가 바뀌어도 스쿼드의 불행한 처지는 달라지는 것이 없습니다.\n\n트리니티의 부잣집 아이들은 이 혼란 속에서도 미소를 잃지 않는데, 스쿼드는 또 다시 방랑자 신세가 되었습니다.\n트리니티는 오늘도 그들을 황야로 떠미는데, 세상의 그 누구도 그것을 알지 못합니다.\n\n그러나 스쿼드만은 알고 있습니다. 누가 우리에게 고통을 떠넘겼는지. 그리고는 미소짓고 있는지.\n\n이제는 애초에 스쿼드 것이 아닌 고통으로부터, 달아날 시간입니다.\n기필코 그 주인을 찾아 줄 시간이기도 하지요.\n\"주님, 우리에게 자비를 베푸소서.\" (Kyrie Eleison)\n\n§Y개발 - SKSKIe§!\n§Y보조 개발 - subikgm, bang0709§!\n§L구 개발 - subikgm, slovakiamodding, pencildude, scpfoundationo5_01§!\n§L(참고로 이 옛 개발자들의 유산은 모두 청산당했습니다!)§!"
 ARI_guide: "£white_dot 단치히에서 나치당과의 관계를 설정하고 학원을 재건하십시오.\n\n스쿼드의 통치\n£white_dot 트리니티에서 자원을 약탈하고 군을 건설하십시오.\n£white_dot §R...거대한 습격을 준비하십시오.§!\n£white_dot 이제 트리니티를 무너뜨리십시오.\n£white_dot 트리니티의 영토를 통합하고 재건하십시오.\n\n£white_dot §L성채 아리우스§!\n   £white_dot §W개혁파의 준동을 억제하십시오.§!\n   £white_dot §L아리우스 보수파는 자신들의 길을 찾을 것입니다.§!\n\n£white_dot §4우리들의 선언문§!\n   £white_dot §W보수파의 방해를 뚫고 3차 공의회에서 승리하십시오.§!\n   £white_dot §4...아즈사는 사오리를 설득할 것입니다.§!\n\n£white_dot §R비상 정부§!\n   £white_dot §p개혁파와 보수파는 그 누구도 우위를 점하지 못했습니다.§!\n   £white_dot §R...그렇다면, 우리들은 대안을 찾아낼 것입니다.§!\n   £white_dot §S이제 국가를 재건하고, 민생을 회복하며, 패배자들에게 다시 한번 손을 내미십시오!§!\n\n그리고...게헨나를 무너뜨리고 중앙유럽을 통일한다면...\n\n\n\n§C그리하여 아리우스의 영광이 다시 한번 재림할 것입니다.§!"

 ARI_focus_can_only_game_started_tt: "이 중점은 게임이 시작되면 자동으로 시작됩니다."



