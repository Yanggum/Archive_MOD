 ARI_beatrice_influence: "베아트리체의 영향력"
 ARI_beatrice_influence_desc: "대전이의 여파로 베아트리체는 더 이상 예전처럼 우리를 직접 구속할 수 없게 되었습니다. 이제 그녀는 우리의 절대적인 주인이 아닌, 상호 이익을 위해 거래하는 협력 관계일 뿐입니다. 그녀의 뒤틀린 영향력을 이용하되, 그 손아귀가 다시 우리 목을 움켜쥐지 못하도록 적당히 거리를 두어야 합니다."
 ARI_integration_of_work_classroom_into_production: "생산부에 작업교실 통합"
 ARI_integration_of_work_classroom_into_production_desc: "파편화되어 운영되던 각 교실의 '작업반' 체제는 국가 규모의 전쟁을 뒷받침하기에 너무나 비효율적입니다. 기존의 작업교실들을 통합하여 중앙 집권적인 '생산부' 체제로 재편하십시오. 개별적인 노동은 이제 아리우스라는 거대한 공장의 톱니바퀴가 되어 돌아갈 것입니다."
 ARI_adherence_to_existing_method: "기존 방식 고수"
 ARI_adherence_to_existing_method_desc: "우리는 이미 키보토스 시절부터 신비의 힘을 다루는 법을 알고 있었습니다. 낯선 기술에 매달리기보다는 우리가 가장 잘 아는 '신비 직조기'에 투자하여 아리우스만의 독자적인 무장을 강화해야 합니다. 옛 방식의 정수야말로 우리를 배신하지 않는 가장 확실한 힘입니다."
 ARI_firearm_production_priority: "총기 제조 우선"
 ARI_firearm_production_priority_desc: "신비와 기적은 희귀하지만, 강철과 화약은 정직합니다. 복수를 완성하기 위해 필요한 것은 소수의 정예 무장이 아니라, 모든 학생의 손에 쥐여줄 신뢰할 수 있는 소총입니다. 재래식 화기 생산 라인을 최우선으로 확충하여 아리우스의 화력을 양적으로 팽창시켜야 합니다."
 ARI_advanced_equipment: "고급 장비"
 ARI_advanced_equipment_desc: "단순한 총기만으로는 적의 방어선을 돌파할 수 없습니다. 우리는 더 거대하고, 더 파괴적인 화력을 원합니다. 정밀한 조준 장치와 강력한 포신을 갖춘 중화기 체계에 투자하십시오. 지평선을 불태우는 포격만이 적들에게 진정한 허무를 가르쳐 줄 수 있습니다."
 ARI_meeting_with_gematria: "게마트리아와 회동"
 ARI_meeting_with_gematria_desc: "이 기묘한 세계에서도 게마트리아의 지식은 여전히 가치 있는 자산입니다. 그들과 접촉하여 대전이 이후의 세계 정세와 기술적 조언을 얻어내십시오. 비록 그들이 우리를 실험체로 여길지라도, 그 대가로 얻을 수 있는 외교적 이익과 정보는 아리우스의 생존에 필수적입니다."
 ARI_national_development: "국가 개발"
 ARI_national_development_desc: "단치히는 더 이상 우리가 잠시 머물다 떠날 은신처가 아닙니다. 이곳은 아리우스의 새로운 성역이자, 복수를 위한 병기창이 되어야 합니다. 도시의 인프라를 정비하고 행정 체계를 구축하여, 황폐해진 단치히를 아리우스의 이름 아래 다시 세워야 합니다."
 ARI_danzig_industrial_reactivation: "단치히 산업시설 재가동"
 ARI_danzig_industrial_reactivation_desc: "단치히의 버려진 공장 굴뚝에서 다시 연기가 피어오르게 하십시오. 멈춰 섰던 기계들에 기름을 치고 전력을 공급하여, 아리우스의 군수 물자를 쏟아내는 거대한 산업 심장으로 탈바꿈시켜야 합니다. 생산력이 곧 국력이며, 국력이 곧 복수의 가능성입니다."
 ARI_baltic_sea_trade_contact: "발트해 해상무역 접점"
 ARI_baltic_sea_trade_contact_desc: "단치히의 진정한 가치는 바다에 있습니다. 파괴된 항구 시설을 재건하고 발트해를 통한 해상 무역로를 확보하십시오. 외부 세계와의 연결은 우리에게 부족한 자원을 보충해주고, 아리우스의 영향력을 바다 너머까지 확장하는 교두보가 될 것입니다."
 ARI_secret_meeting_with_kriegsmarine: "전쟁해군과의 밀회"
 ARI_secret_meeting_with_kriegsmarine_desc: "전쟁해군의 망명자들과 은밀한 대화를 시작합니다. 그들의 해상 전투 경험과 우리의 목적은 묘하게 일치하는 구석이 있습니다. 어두운 해안가에서 이루어지는 이 위험한 동맹은, 아리우스에게 강력한 해상 지원군과 새로운 돌파구를 안겨줄 것입니다."


 ARI_distancing_from_nazi_ss: "나치 친위대와 거리 두기"
 ARI_distancing_from_nazi_ss_desc: "단치히를 감싸고 있는 검은 제복의 무리는 분명 매력적인 협력을 제안해 오지만, 우리는 이미 누군가의 꼭두각시로 살아가는 것이 얼마나 비참한지 잘 알고 있습니다. 그들의 광기 어린 열정이 아리우스의 정체성을 집어삼키게 두어서는 안 됩니다. 협력은 하되, 주도권은 오직 우리 아리우스의 손에 있어야 합니다."
 ARI_no_more_retreat: "더 이상 물러설 곳은 없다"
 ARI_no_more_retreat_desc: "트리니티에서 쫓겨나고, 키보토스에서 밀려나 마침내 도달한 이 낯선 땅 단치히조차 빼앗길 수는 없습니다. 이곳은 우리의 마지막 성벽이자 묘비입니다. 한 발자국이라도 물러선다면 그 끝에는 진정한 소멸만이 기다릴 뿐입니다. 모든 학생은 각오하십시오. 여기서 죽거나, 승리하거나 둘 중 하나입니다."
 ARI_mental_armament: "정신 무장"
 ARI_mental_armament_desc: "공포에 질린 단치히 시민들에게도 아리우스의 가르침을 전파해야 합니다. 삶은 고통이며, 오직 투쟁만이 그 고통을 증명할 유일한 수단임을 강제로라도 깨닫게 하십시오. 징집된 이들의 눈에 어린 두려움이 증오로 변할 때, 비로소 단치히는 거대한 요새로 거듭날 것입니다."
 ARI_opening_porta_fasis: "포르타 파시스 개방"
 ARI_opening_porta_fasis_desc: "금지된 지식이 잠들어 있는 아리우스의 심장, '포르타 파시스'의 문을 다시 엽니다. 비록 그 안에 담긴 진실이 우리를 더욱 깊은 허무로 이끌지라도, 트리니티를 무너뜨릴 수 있는 고대의 예법과 기술을 얻을 수 있다면 그 어떤 대가라도 치를 용의가 있습니다."
 ARI_trumpet_blowing_angels: "나팔을 부는 천사들"
 ARI_trumpet_blowing_angels_desc: "하늘을 뒤덮는 붉은 안개 속에서, 종말을 알리는 나팔 소리가 울려 퍼집니다. 유스티나 성도회의 정수이자 묵시록의 전령들이 우리 앞에 강림합니다. 그들의 강림은 곧 트리니티의 심판을 의미하며, 아리우스가 준비한 가장 성대하고 잔혹한 연회의 시작이 될 것입니다."
 ARI_trumpet_blowing_angels_tt: "§Y묵시록의 천사§! 세 명이 장군이 됩니다."
 ARI_apocalypse: "묵시록"
 ARI_apocalypse_desc: "모든 것이 헛되고 헛되니, 오직 멸망만이 공평할 것입니다. 우리가 겪은 고통을 그들에게 수천 배로 되돌려줄 시간입니다. 트리니티의 하늘이 무너지고, 그들의 정원이 잿더미가 될 때 비로소 우리의 복수는 완성됩니다. 이제 이 세계에 진정한 '묵시록'을 선포하십시오."
 ARI_no_change: "변화는 없다"
 ARI_no_change_desc: "불확실한 개혁이나 위험한 도박은 필요하지 않습니다. 우리는 이미 가장 효율적인 증오의 방식을 체득했습니다. 아리우스의 기존 질서를 유지하고, 보수적인 가치 아래 단결하여 흔들림 없이 복수의 길을 걸어야 합니다. 변하지 않는 것만이 우리를 승리로 이끌 것입니다."
 ARI_no_change_tt: "어떤 방식으로든 §Y보수§!를 대표하는 진영에 §R큰 이익§!이 주어집니다."
 ARI_no_change_0_tt: "§g현재는 아무 효과가 없습니다.§!"
 ARI_danzig_conference: "단치히 회담"
 ARI_danzig_conference_desc: "단치히 주변에서 활동하는 친위대 간부들과 공식적인 회동을 갖습니다. 그들은 우리와 마찬가지로 트리니티라는 거대한 질서에 저항하며, 자신들만의 신념을 위해 피를 흘리는 자들입니다. 공통의 적을 둔 이상, 우리와 그들이 손을 잡지 못할 이유란 존재하지 않습니다."
 ARI_channel_for_ss_activities: "친위대 활동의 창구"
 ARI_channel_for_ss_activities_desc: "단치히 내에서 친위대가 원활하게 활동할 수 있도록 행정적, 군사적 편의를 제공합니다. 그들의 효율적인 조직력과 정보망은 아리우스의 통치 체제를 보완해 줄 것이며, 그 대가로 우리는 그들이 가진 시가전 지식과 독일의 정통성을 전수받게 될 것입니다."
 ARI_acceptance_of_german_exiles: "독일인 망명자 수용"
 ARI_acceptance_of_german_exiles_desc: "혼란스러운 정세 속에서 갈 곳을 잃은 독일인 망명자들이 단치히로 몰려들고 있습니다. 우리는 그들을 단순히 난민으로 취급하지 않을 것입니다. 그들에게 아리우스의 무장을 지급하고 '독일 자유군단'으로 편성하여, 우리를 위해 기꺼이 전선에 투입될 강력한 외인 부대로 키워낼 것입니다."
 ARI_acceptance_of_german_exiles_tt: "독일 자유군단"
 ARI_second_exile: "두 번째 망명자"
 ARI_second_exile_desc: "친위대가 붕괴한 현재, 그들의 유능한 지휘관인 라인하르트 하이드리히와 정예 대원들을 단치히로 받아들여야 합니다. 그들에게 아리우스의 명찰을 달고 장교직을 부여할 것입니다. 그들이 가진 냉혹한 카리스마는 아리우스군을 더욱 완벽한 전쟁 기계로 탈바꿈시킬 것입니다."
 ARI_wfss_tt: "무장친위대"
 ARI_how_to_hate: "증오하는 법"
 ARI_how_to_hate_desc: "단순한 복수심만으로는 부족합니다. 옛 독일의 탁월한 선전 기법을 모방하여, 트리니티에 대한 증오를 하나의 정교한 종교이자 이데올로기로 승화시켜야 합니다. 적을 향한 분노가 체계화될 때, 아리우스의 병사들은 죽음조차 두려워하지 않는 광전사가 될 것입니다."
 ARI_second_arius: "제2 아리우스"
 ARI_second_arius_desc: "단치히의 기존 세력과 아리우스의 결합이 마침내 마침표를 찍을 것입니다. 이제 우리는 서로 다른 두 집단이 아닌, 하나의 목표를 향해 나아가는 통합된 실체입니다. '제2 아리우스'의 탄생은, 이 땅에 새로운 질서가 도래했음을 전 세계에 알리는 신호탄이 될 것입니다."
 ARI_holy_war: "성전"
 ARI_holy_war_desc: "이것은 단순한 영토 분쟁이 아닙니다. 이것은 불결한 트리니티의 위선을 씻어내고, 억눌린 자들의 정의를 세우는 거룩한 전쟁입니다. 전 유럽에 흩어진 독일인 망명자들을 불러모으십시오. 아리우스와 친위대의 기치 아래, 가장 신성한 대성전을 시작할 때입니다."


