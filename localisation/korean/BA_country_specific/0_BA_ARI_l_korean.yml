 TRM_heart_strike_plan: "아리우스의 활동에 대응"
 TRM_heart_strike_plan_desc: "아리우스 분교가 우리를 향해 무언가를 준비하고 있는 것은 확실하나, 아리우스 분교의 반 게헨나-친 트리니티 프로파간다에 대중이 현혹되었기에 직접적인 개입은 그들이 이 비밀스러운 계획을 진짜로 실행한 후에야 가능할 것으로 보입니다. 그 전에 우리는 그들의 기습에 대비해 우리는 할 수 있는 모든 것을 해야 합니다.\n\n§Y아리우스§!와 §Y트리니티§! 사이의 §G점수 경쟁§!이 시작되었습니다. §Y아리우스§!가 §Y트리니티§!보다 많은 §G점수§!를 얻는다면 §R치명적인 공습§!을, 얻지 못한다면 §4미미한 공습§!을 성공시킬 것입니다. 적의 세부 §G점수§!는 알아낼 수 없으며 우리는 적이 속해있는 §G범위§!만 알아낼 수 있습니다.\n\n현재 우리의 점수는 ([ARI_heart_strike_plan_TRM_VAR] 점) 입니다.\n상대의 점수는 ([ARI_heart_strike_plan_ARI_VAR_LOC] 점) 범위에 속해 있는 거로 보입니다."

