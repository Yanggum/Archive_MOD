## 이벤트
 ARI_reformist_event_chain.1.t: "교실이 사라진 자리"
 ARI_reformist_event_chain.1.d: "매캐한 매연과 쇠 깎는 소음이 진동하는 제1 국영 병기창. 조마에 사오리는 미간을 찌푸린 채, 시라스 아즈사의 뒤를 따르고 있었다.\n\n사오리는 지금까지 아즈사의 방식을 이해하지 못했다. '경제 구조 개편'이라는 명목하에 아리우스 자치구의 뒷골목을 지탱하던 영세한 총기 작업장들은 파산했고, 우리에게 우호적이던 독일계 자본가들은 비명을 지르며 떠나갔다. 사오리의 눈에 그것은 개혁이 아니라, 그나마 남은 밥줄을 끊어버리는 자해 행위처럼 보였다.\n\n하지만 육중한 철문이 열리고, 눈앞에 펼쳐진 광경을 마주한 순간 사오리의 발걸음이 멈췄다.\n\n\"...이건.\"\n\n과거 '작업교실'이라 불리던, 습기 찬 지하실에서 학생들이 손으로 탄약을 찍어내던 모습은 온데간데없었다. 거대한 컨베이어 벨트 위로 규격화된 소총들이 쉴 새 없이 쏟아져 나오고 있었고, 다른 구역에서는 용광로가 붉은 숨을 토해내며 포신을 주조하고 있었다. 그것은 더 이상 '게릴라의 공작소'가 아니었다. 명백한 '국가의 공장'이었다.\n\n\"...기존의 가내수공업 방식으로는 한계가 있었어.\"\n\n아즈사가 소음 속에서 목소리를 높였다. 그녀의 표정은 덤덤했지만, 눈빛은 확신에 차 있었다.\n\n\"작은 것들이 부서지는 건 안타깝지만... 더 큰 것을 지키려면 어쩔 수 없었어. 이게 내가 찾은 답이야.\"\n\n사오리는 갓 생산되어 나온 소총 한 정을 집어 들었다. 묵직하고, 차갑고, 무엇보다... 조악하지 않았다. 그녀는 노리쇠를 당겨보았다. *창* 하고 경쾌한 금속음이 울렸다.\n\n\"...나쁘지 않군.\"\n\n사오리는 총을 내려놓으며 짧게 덧붙였다. 그녀가 보일 수 있는 최대의 긍정이었다. 폐허 속에서 고철을 주워 쓰던 시절은 끝났다. 아즈사는 헛된 파괴를 한 것이 아니었다."
 ARI_reformist_event_chain.1.a: "\"생각보다, 괜찮은 결과였어.\""

 ARI_reformist_event_chain.2.t: "오케스트라"
 # CASE 1: 관계도 낮음 - 화해의 제스처, 이해의 시작
 ARI_reformist_event_chain.2.da: "개조된 옛 성당의 홀, 아리우스의 첫 오케스트라가 튜닝하는 불협화음이 공간을 채우고 있었다. 시라스 아즈사는 긴장한 표정으로 옆자리의 조마에 사오리를 곁눈질했다.\n\n사오리는 팔짱을 낀 채, 무대 위의 학생들을 심사하듯 노려보고 있었다. 그녀에게 바이올린과 첼로는 총기보다 무겁고 비효율적인 도구처럼 보일 것이다.\n\n\"...이게 네가 말한 '아리우스의 문화'인가?\"\n\n사오리의 건조한 질문에 아즈사는 고개를 살짝 끄덕였다.\n\n\"단순한 문화보다는 ...치료야.\"\n\n지휘봉이 허공을 가르고, 첫 음이 터져 나왔다. 서투르지만 필사적인 선율. 그것은 훈련된 군가도, 증오를 부추기는 구호도 아니었다. 그저 순수한 소리의 파동이었다. 사오리는 혀를 차려다 멈췄다. 바이올린을 켜는 학생의 표정에서, 사격 훈련 때는 한 번도 본 적 없던 '몰입'을 보았기 때문이다.\n\n연주가 끝날 무렵, 사오리는 작게 한숨을 내쉬며 자세를 고쳐 앉았다.\n\n\"...전술적 가치는 제로군. 하지만...\"\n\n그녀는 아즈사를 바라보지 않은 채 툭 내뱉었다.\n\n\"가끔은, 총성 대신 이런 소음이 들리는 것도 나쁘지 않아. 이번만은 어울려주지.\""
 # CASE 2: 관계도 높음 - 공유하는 평온, 동료애
 ARI_reformist_event_chain.2.db: "연주회의 2악장이 시작될 무렵, VIP석의 분위기는 나른할 정도로 평온했다. 아즈사는 팜플렛을 만지작거리는 대신, 가만히 눈을 감고 음악을 듣고 있었다. 그리고 그 옆에서 사오리 또한, 평소의 날 선 경계심을 풀고 의자에 깊게 몸을 묻고 있었다.\n\n\"신기하네.\"\n\n사오리가 낮은 목소리로 중얼거렸다.\n\n\"우리가 배운 건 모든 것이 헛되다는 것뿐이었는데. 저 녀석들은 저 헛된 소리를 만들기 위해 몇 달을 밤새워 연습했어.\"\n\"응. ...아마, 헛되기 때문에 아름다운 걸지도 몰라.\"\n\n아즈사의 대답에 사오리는 피식 웃음을 터뜨렸다. 예전 같았으면 비웃음이었겠지만, 지금은 명백한 동조의 웃음이었다. 두 사람의 손에는 굳은살이 박혀 있고 화약 냄새가 배어 있었지만, 지금 이 순간만큼은 그 손으로 총 대신 평온을 쥐고 있었다.\n\n\"아즈사.\"\n\"응?\"\n\"...나쁘지 않다. 네가 만든 아리우스는.\"\n\n클라이맥스를 향해 치닫는 오케스트라의 선율 속에서, 사오리는 아주 잠시, 지휘관이 아닌 평범한 청중의 얼굴을 하고 있었다."
 # CASE 3: 사오리 은퇴 (민간인) - 초청과 격려
 ARI_reformist_event_chain.2.dc: "공연이 시작되기 직전, VIP석의 문이 열렸다. 하지만 들어온 것은 흔한 재킷에 청바지를 입은, 어디서나 볼 수 있는 민간인 차림의 조마에 사오리였다.\n\n\"...초대해 놓고 놀란 표정이군, 총리 각하.\"\n\n사오리는 어색한 듯 모자를 눌러쓰며 아즈사의 옆자리에 앉았다. 그녀는 이제 군의 수장이 아니었지만, 아즈사에게는 여전히 가장 어려운 선배이자, 넘어야 했던 벽이었다.\n\n\"와줘서 고마워, 사오리.\"\n\"무직자한테는 시간이 썩어 나니까. 게다가... 내 후임이 무슨 짓을 벌여놨는지 감시는 해야 할 거 아냐.\"\n\n공연이 시작되자, 사오리의 눈은 무대 위 아이들을 쫓았다. 제식 훈련 대신 악보를 보고, 총검술 대신 활을 켜는 아이들. 그녀가 지휘하던 시절에는 상상도 할 수 없었던, 아니, 상상조차 허락되지 않았던 풍경이었다.\n\n곡이 끝나고 우레와 같은 박수가 터져 나왔을 때, 사오리는 박수를 치는 대신 조용히 자리에서 일어났다.\n\n\"...나는 못 했을 거야.\"\n\n그녀는 아즈사의 어깨를 툭 두드려주고 지나갔다. 떠나는 사오리의 뒷모습은 예전처럼 거대해 보이지 않았다. 하지만 그 어느 때보다 가벼워 보였다."
 ARI_reformist_event_chain.2.a: "그녀의 기분은 나아진 것 같다."

 ARI_reformist_event_chain.3.t: "보조노동단 해산"
 ARI_reformist_event_chain.3.d: "해산 명령서에 서명된 잉크가 마르기도 전이었다. 조마에 사오리는 집무실 창가에 기대어, 노동단이 해체되어 고향으로 돌아가는 트럭의 행렬을 내려다보고 있었다.\n\n\"...솔직히, 의외였어.\"\n\n사오리는 시선을 돌리지 않은 채 입을 열었다.\n\n\"보조노동단은 비인도적이지만, 지금의 아리우스엔 가장 효율적인 톱니바퀴였으니까. 심지어 네 파벌인 개혁파 녀석들조차 '재건이 끝날 때까지만이라도 유지하자'고 건의했었지. 그런데 네가 그 모든 반대를 묵살하고 이 명령을 강행할 줄은 몰랐군.\"\n\n\"누군가의 희생 위에 세워진 나라는, 결국 또 다른 증오를 낳을 뿐이니까.\"\n\n아즈사의 대답은 망설임이 없었다. 사오리는 그제야 고개를 돌려 아즈사를 바라보았다. 권력이라는 흙탕물 속에 있으면서도, 그녀의 눈동자는 여전히 타협을 모르는 어린아이처럼 맑았다."
 ARI_reformist_event_chain.3.a: "\"네가 그 바보 같은 이상을 아직 잃어버리지 않아서... 다행이라고 생각한다. 아즈사.\""

 ARI_reformist_event_chain.4.t: "피할 수 없는 것"
 ARI_reformist_event_chain.4.d: "사령부의 붉은 경보등이 돌아가고 있었다. 전선에서 타전되는 급박한 보고들이 라디오를 타고 흘러나왔지만, 시라스 아즈사는 멍하니 작전 지도를 내려다보고 있을 뿐이었다.\n\n\"...막고 싶었어.\"\n\n아즈사의 목소리는 떨리고 있었다.\n\n\"최선을 다했어. 트리니티 학생들을 설득하고, 과거를 청산하고, 우리가 더 이상 '괴물'이 아니라는 걸 증명하려고 했어. 하지만... 소용없었어. 게헨나는 여전히 우리를 테러리스트라고 부르고, 우리 학생들은 그들의 목소리에 겁을 먹거나, 혹은 분노하고 있어.\"\n\n그녀는 지도 위에 놓인 자신의 손을 꽉 쥐었다.\n\n\"결국 벌어질 일이었던 걸까. 우리는... 평생 누군가와 싸우지 않으면 살아갈 수 없는 걸까.\"\n\n그때, 곁에 서 있던 조마에 사오리가 다가와 아즈사의 어깨에 손을 올렸다. 무겁고, 단단한 손길이었다.\n\n\"아즈사. 고개를 들어.\"\n\n사오리는 아즈사의 흔들리는 눈을 똑바로 응시했다.\n\n\"싸움을 피하려고 했던 네 노력은 헛되지 않았다. 덕분에 우리는 '광기'가 아니라 '생존'을 위해 총을 들 수 있게 됐으니까. 그것만으로도 충분해.\"\n\n사오리는 허리춤의 권총을 점검하며 나직이 덧붙였다.\n\n\"죄책감은 갖지 마라. 피를 묻히는 건 내 역할이다. 너는... 우리가 돌아갈 곳이 망가지지 않도록 지키기만 해.\""
 ARI_reformist_event_chain.4.a: "방아쇠는 당겨졌다."

 ARI_reformist_event_chain.5.t: "뒷걸음질은 이제 그만"
 ARI_reformist_event_chain.5.d: "늦은 밤, 사오리의 개인 숙소 앞을 서성이던 발걸음 소리가 멈췄다. 한참의 침묵 끝에 아즈사는 문을 두드릴 용기를 내는 대신, 문 너머에 들릴 듯 말 듯 한 목소리로 혼잣말처럼 입을 열었다.\n\n\"...미안해.\"\n\n그것은 사과였다. 개혁이라는 미명 하에 자행된 무례한 언사들, 그녀가 통제하지 못한 지지자들의 폭거, 그리고 사오리에게 모든 짐을 떠넘기고 도망친 것만 같은 죄책감에 대한 고백이었다.\n\n\"당신을 실각시키자는 의견이 있었어. 당연히... 내가 막았어. 하지만 그걸로 내 죄가 사라지진 않겠지. 바꾸고 싶었어. 곰팡이 핀 빵이 아니라 따뜻한 밥을 먹이고 싶어서 시작한 일인데... 어째서인지, 앞으로 나아갈수록 진흙탕에 빠지는 기분이야.\"\n\n문 너머에서는 아무런 대답이 없었다. 아즈사는 씁쓸한 표정으로 고개를 떨구었다. 역시 너무 늦은 걸까. 그녀는 벽에 이마를 기대었다가, 이내 체념한 듯 몸을 돌렸다. 그래, 이제 와서 무슨 낯짝으로 위로를 바라겠는가.\n\n터벅, 터벅. 그녀가 몇 걸음 떼기도 전이었다.\n\n끼익—.\n\n등 뒤에서 문이 열리는 소리와 함께, 거친 손이 아즈사의 팔을 낚아챘다. 놀라 뒤를 돌아본 아즈사의 눈에, 잠옷 차림의 헝클어진 머리를 한 사오리가 서 있었다.\n\n\"...시끄러워서 잠을 잘 수가 없군.\"\n\n사오리는 퉁명스럽게 내뱉었지만, 잡은 팔을 놓지는 않았다.\n\n\"들어와. 차라도 내올 테니까.\"\n\n그 투박한 손길은 아즈사가 기억하던 예전의 온기 그대로였다. 그날 밤, 닫혔던 문 안쪽에서는 아주 오랫동안 두 사람의 목소리가 끊이지 않고 이어졌다. 깨진 유리잔 조각을 다시 맞추듯, 조심스럽고도 간절한 대화였다."
 ARI_reformist_event_chain.5.a: "그날 밤은 길었다."

 ARI_reformist_event_chain.6.t: "실전 지도 - 1"
 ARI_reformist_event_chain.6.d: "지난 만남 이후 다시 서먹해졌던 호출은 갑작스러웠다. 새벽 2시, 개인 단말기에 찍힌 발신자는 '조마에 사오리', 내용은 단 한 줄이었다.\n\n'제3 훈련장으로. 무장할 것.'\n\n시라스 아즈사는 무거운 눈꺼풀을 비비며 훈련장으로 향했다. 그녀의 머릿속은 내일 처리해야 할 예산안과, 보수파를 달래기 위한 협상 카드, 그리고 트리니티계 학생들의 시위 소식으로 꽉 차 있었다. 발걸음을 옮길 때마다 군화 소리가 텅 빈 복도를 울렸지만, 그녀의 귀에는 온갖 정치적인 소음만이 윙윙거릴 뿐이었다.\n\n훈련장에 도착했을 때, 그곳은 칠흑 같은 어둠에 잠겨 있었다.\n\n\"사오리? 도착했어. 무슨 일이야? 급한 보고라면...\"\n\n타앙-!!\n\n대답 대신 어둠을 찢고 날아온 것은 예고 없는 실탄 사격이었다.\n\n\"큭?!\"\n\n아즈사는 본능적으로 몸을 날려 엄폐물 뒤로 처박혔다. 방금 전까지 서 있던 자리의 콘크리트 바닥이 흉하게 파여 있었다. 등골이 서늘해지는 감각. 하지만 그 순간에도 아즈사의 머릿속에는 '왜?'라는 의문과 복잡한 잡생각이 스쳐 지나갔다."
 ARI_reformist_event_chain.6.a: "\"도대체 무슨...?\""

 ARI_reformist_event_chain.7.t: "실전 지도 - 2"
 ARI_reformist_event_chain.7.d: "저벅, 저벅. 어둠 속에서 사오리가 훈련용 소총을 겨눈 채 걸어 나왔다.\n\n\"반응이 늦어. 쓸데없는 고민하느라 머리가 굳었나.\"\n\n사오리는 바닥에 놓인 또 다른 소총을 아즈사 쪽으로 걷어찼다.\n\n\"들어. 실전 훈련이야.\"\n\n아즈사는 입술을 깨물며 총을 집어 들었고, 그 순간 두 사람의 총구가 동시에 불을 뿜었다. 격렬한 공방이 이어졌지만, 아즈사의 몸은 예전 같지 않았다. 방아쇠를 당기는 순간에도 내일 일정과 같은 잡생각이 그녀의 발목을 잡았다.\n\n\"...잡생각이 많군.\"\n\n결국 거리가 좁혀지고, 사오리가 총신을 쳐내며 파고들었다. 둔탁한 타격음과 함께 아즈사의 시야가 뒤집혔다. 정신을 차렸을 때, 그녀는 차가운 바닥에 제압당해 있었고 사오리의 총구는 그녀의 미간을 겨누고 있었다. 완벽한 패배였다.\n\n\"하아... 하아...\"\n\n거친 숨을 몰아쉬는 아즈사를 내려다보며, 사오리는 총을 거두었다.\n\n\"전보다 더 약해졌군.\"\n\n사오리는 넘어진 아즈사에게 손을 내미는 대신, 싸늘하게 일갈했다.\n\n\"고작 나 하나도 이기지 못하면서, 세상의 모든 짐을 혼자 짊어지려고 했나? 주제를 알아라, 아즈사.\"\n\n비난으로 들릴 수 있었지만, 아즈사에게는 다르게 느껴졌다. 네가 약하다면 내가 지켜주겠다는, 그녀 나름의 투박하고도 확실한 맹세였다. 아즈사는 욱신거리는 어깨를 감싸 쥐며, 역설적이게도 마음의 짐이 가벼워지는 것을 느꼈다."
 ARI_reformist_event_chain.7.a: "\"다시 한번... 부탁해.\""

 ARI_reformist_event_chain.8.t: "한 번만 - 1"
 ARI_reformist_event_chain.8.d: "새벽 3시의 집무실, 조마에 사오리는 시라스 아즈사가 내민 '제4차 예산 수정안'을 테이블 위로 던지듯 내려놓았다.\n\n\"기각한다. 군수 물자를 줄여서 교육 예산으로 돌리다니, 제정신인가? 논리적으로 설명해 봐. 이게 어떻게 생존에 도움이 되는지.\"\n\n사오리의 벽은 완고했다. 아즈사는 입을 열었다가 다시 다물었다. 이성적인 설득은 이미 세 시간째 실패했고, 협박이나 회유가 통할 상대도 아니었다. 아즈사의 머릿속에서 모든 전술이 '실패'로 판정되었다. 남은 카드는 단 하나뿐이었다.\n\n아즈사는 식은땀을 흘리며 트리니티에서 빌려 읽었던 연애 소설의 한 구절과, 우라와 하나코가 장난스럽게 가르쳐준 '비기'를 떠올렸다. '이걸 쓰면 사회적 죽음을 맞이할 수도 있다'는 경고등이 켜졌지만, 물러설 곳은 없었다.\n\n\"......\"\n\n아즈사는 자리에서 일어나, 사오리의 옆으로 다가갔다. 그리고 떨리는 손으로 사오리의 군복 소매 끝자락을 아주 살짝 잡았다."
 ARI_reformist_event_chain.8.a: "..."

 ARI_reformist_event_chain.9.t: "한 번만 - 2"
 ARI_reformist_event_chain.9.d: "\"...사오리... 언니?\"\n\n그녀의 목소리는 작았고, 치사량에 가까운 부끄러움 때문에 목소리 끝이 심하게 떨리고 있었다. 아즈사는 책에서 읽은 대로 눈을 치켜뜨려 사오리를 올려다보려 했지만, 수치심을 이기지 못하고 시선이 허공을 배회했다.\n\n\"이... 이번 한 번만... 안 될까...? ...응?\"\n\n정적. 폭격이 휩쓸고 간 폐허보다 더 완벽한 정적이 흘렀다.\n\n사오리는 결재 서류를 집으려던 손을 허공에 멈춘 채, 마치 미지의 생명체를 조우한 사람처럼 굳어 있었다. 그녀의 눈동자가 아즈사의 떨리는 손가락과 붉어진 귀, 그리고 방금 들은 기괴한 의성어 사이를 방황했다.\n\n\"...아즈사.\"\n\"......\"\n\"...어디 아픈가? 의무관을 부를까?\"\n\"아니... 그, 부탁이야...\"\n\n아즈사가 쥐구멍을 찾는 심정으로 고개를 푹 숙이자, 사오리는 마른세수를 하며 깊고 긴 한숨을 내쉬었다. 그녀는 자신이 전장에서 겪은 그 어떤 위기 상황보다 지금이 더 대처하기 곤란하다고 느꼈다.\n\n\"...하아. 알았다. 알았으니까.\"\n\n사오리는 거칠게 펜을 들어 서류에 서명했다. 내용을 검토조차 하지 않은, 순수한 '항복'이었다.\n\n\"가져가. 그리고 다시는, 내 앞에서 그런... 기괴한 짓은 하지 마라. 심장에 해로우니까.\"\n\n서류를 낚아채듯 받아 든 아즈사는 도망치듯 집무실을 빠져나갔다. 문이 닫힌 뒤에도 사오리는 한참 동안 멍하니 자신의 소매 끝을 바라보고 있었다."
 ARI_reformist_event_chain.9.a: "치명적인 일격이다. 아즈사에게."

 ARI_reformist_event_chain.10.t: "다가오는 폭풍"
 ARI_reformist_event_chain.10.d: "아리우스의 철권 통치가 걷힌 거리에는, 평화 대신 견딜 수 없는 '소음'이 찾아왔습니다. 시라스 아즈사 정부가 약속한 '자유'는 억눌린 자들의 입마개를 풀어주었지만, 그 입에서 터져 나온 것은 감사의 인사가 아니라 봇물 터진 요구사항들이었습니다. 옛 트리니티 종합학원의 교복을 입은 학생들은 파괴된 대성당 광장에 모여 '티파티 행정 시스템의 복원'과 '몰수된 홍차 정원의 반환'을 요구하며 연좌 농성을 벌이고 있습니다. 그들 뒤로는 구 티파티의 관료들이 확성기를 들고 정부의 무능을 성토하며 정치적 재기를 노리고 있습니다.\n\n혼란은 학원 내부에만 국한되지 않습니다. 포즈난의 공장 지대에서는 폴란드계 노동자들이 깃발을 흔들며 처우 개선을 요구하는 시위대가 행진하고, 슐레지엔의 독일인들은 아리우스의 '점령군 행세'를 비난하며 자치권을 요구하는 전단을 뿌리고 있습니다.\n\n아직 화염병이 날아들거나 총성이 울리지는 않았습니다. 하지만 서로 다른 언어와 구호, 그리고 욕망이 뒤엉킨 광장의 데시벨은 날이 갈수록 높아지고 있습니다. 이들은 정부가 자신들을 탄압하지 못할 것이라는 사실을 너무나도 잘 알고 있기에, 더욱 대담하게 청사의 문을 두드리고 있습니다."
 ARI_reformist_event_chain.10.a: "어떻게든 사태를 해결해야 한다!"

 ARI_reformist_event_chain.11.t: "선제적 조치"
 ARI_reformist_event_chain.11.d: "시라스 아즈사가 출근했을 때, 책상 위에 놓여 있던 '일일 치안 보고서'의 내용은 기이할 정도로 평온했습니다. 어제까지만 해도 베를린과 포즈난, 그리고 옛 트리니티 자치구에서 동시다발적으로 예고되었던 대규모 시위가 거짓말처럼 취소되거나 축소되었다는 보고였습니다.\n\n\"...어떻게 된 거지?\"\n\n아즈사의 혼잣말에 답한 것은, 소파에 앉아 군화를 닦고 있던 조마에 사오리였습니다.\n\n\"청소를 좀 했다.\"\n\n사오리의 설명은 간결하고 건조했습니다. 그녀는 어젯밤, 자신에게 충성하는 아리우스 군 예비대를 소집했습니다. 그들에게 '치안유지대'라는 급조된 완장을 채운 뒤, 시위를 주도하던 선동가들과 트리니티 강경파들의 은신처를 습격하여 전원 구금해버린 것입니다.\n\n\"군 병력을 투입한 거야? 그건 계엄령이나 마찬가지잖아!\"\n\"군대가 아니다. '치안유지대'지. 서류상으로는 아무 문제 없어.\"\n\n사오리는 태연하게 대꾸하며 닦고 있던 군화를 내려놓았습니다.\n\n\"놈들은 확성기만 준비한 게 아니었어. 화염병과 사제 폭발물도 있었지. 네가 말하는 '적법한 절차'를 밟았다면 오늘 아침 뉴스는 화재 현장 중계였을 거다. ...욕은 내가 먹을 테니, 너는 결과만 취해라.\"\n\n아즈사는 입술을 깨물었습니다. 사오리의 독단적인 행동은 명백한 위험이었지만, 동시에 아즈사의 정권을 위기에서 구한 것도 사실이었습니다. 이제 그녀는 선택해야 합니다. 이 '더러운 평화'를 묵인할 것인지, 아니면 위험을 감수하고서라도 원칙을 세울 것인지."
 ARI_reformist_event_chain.11.a: "\"잘했어. ...필요한 일이었으니까.\""
 ARI_reformist_event_chain.11.b: "\"구금된 자들을 풀어주고, 병력을 철수시켜.\""

 ARI_reformist_event_chain.12.t: "톱니바퀴의 마찰음"
 ARI_reformist_event_chain.12.d: "총성은 멈췄으나, 공장의 소음도 함께 잦아들었습니다. 베를린의 산업 단지부터 동프로이센의 항구에 이르기까지, 기이한 형태의 '정적'이 아리우스의 영토를 잠식하고 있습니다.\n\n독일계 노동자들은 파업을 선언하지 않았습니다. 그들은 제 시간에 출근하고 제 자리에 섭니다. 다만, 공구를 떨어뜨리면 그것을 줍는 데 30분이 걸리고, 기계가 고장 나면 부품이 없다는 핑계로 하루 종일 멍하니 서 있을 뿐입니다. 상점의 주인들은 트리니티 억양을 쓰는 손님에게는 물건이 다 팔렸다고 고개를 저으면서도, 독일어를 쓰는 이웃에게는 뒷문으로 빵과 우유를 건네줍니다.\n\n이것은 조직된 명령에 의한 것이 아닌, 아즈사 정부의 '친트리니티 개혁'에 대한 독일인들의 집단적인 거부 반응입니다. 그들은 자신들의 일자리가 트리니티인들에게 위협받고 있다고 느끼며, 대전이의 상처가 아물기도 전에 가해자들을 이웃으로 받아들이라는 정부의 방침에 침묵으로 항거하고 있습니다.\n\n이 거대한 태업은 국가의 혈관을 서서히 막아가고 있습니다. 생산량은 급감했고, 행정 명령은 말단에서 무시당하고 있습니다. 우리는 이 마찰음을 어떻게든 해결해야 합니다."
 ARI_reformist_event_chain.12.a: "독일인들의 분노를 달래는 것이 우선이다."
 ARI_reformist_event_chain.12.b: "이 참에 고용 부문의 트리니티계 차별을 폐지한다."

 ARI_reformist_event_chain.13.t: "친정부 시위대"
 ARI_reformist_event_chain.13.d: "에덴 광장과 트리니티 대성당 앞을 점거했던 분리주의자들의 고함소리 맞은편에서, 새로운 물결이 일렁이기 시작했습니다. 그들이 든 깃발에는 특정 민족의 상징이나 종교적 구호 대신, 아즈사 정부가 내건 '화합과 재건'의 슬로건만이 담백하게 적혀 있었습니다. 이 '친정부 시위대'의 구성원은 기묘할 정도로 다양합니다. 태업에 지쳐 일터로 돌아가고 싶은 독일인 공장장, 구 티파티의 권위적인 문화에 염증을 느꼈던 트리니티 일반 학생, 그리고 아리우스의 변화를 지지하는 시민들입니다.\n\n이들은 극단주의자들의 혐오 발언에 맞서 '현실적인 대안'과 '법치'를 외치고 있습니다. 아즈사의 중도 실용주의 노선이 '미지근한 타협'이 아니라, 파국을 막을 유일한 방파제임을 인정한 사람들입니다.\n\n\"우리는 과거의 망령이 아니라, 오늘의 빵을 원한다!\"\n\n이 자생적인 지지 세력은 정부에게 있어 뜻밖의 우군입니다. 이제 우리는 결정해야 합니다. 이들에게 자금을 대고 조직화하여 개혁의 전위대로 삼을 것인지, 아니면 그들의 순수성을 지켜주기 위해 거리를 두고 지켜볼 것인지."
 ARI_reformist_event_chain.13.a: "이 흐름을 놓쳐선 안 된다. 그들을 조직화하라!"
 ARI_reformist_event_chain.13.b: "개입하지 마라."

 ARI_reformist_event_chain.14.t: "책상 옮기기"
 ARI_reformist_event_chain.14.d: "시라스 아즈사가 학생회장실의 문을 열고 들어왔을 때, 조마에 사오리는 시선을 서류에서 떼지 않은 채 건조하게 물었다.\n\n\"오늘만 벌써 세 번째 방문이군. 개혁파 당사에는 전화기가 없나?\"\n\n아즈사는 숨을 고르며 두꺼운 결재판을 책상 위에 내려놓았다. 개혁파 당사에서 학생회장실까지는 도보로 15분. 그나마도 보안 검색대를 두 번이나 통과해야 하는 번거로운 거리였다.\n\n\"비효율적이야.\"\n\n아즈사는 단호하게 말했다.\n\n\"서류를 이동시키는 데 드는 인력, 시간, 그리고 도청이나 탈취의 위험성까지... 전술적으로 봤을 때 현재의 이원화된 청사 구조는 낙제점이야. 그러니 사오리 언니... 아니, 회장. 제안할 게 있어.\"\n\n사오리는 그제야 고개를 들어 아즈사를 바라보았다.\n\n\"청사를 합치자. 이 건물의 2층, 비어있는 작전회의실을 내 집무실로 쓰겠어.\"\n\n그것은 단순한 방 배정이 아니었다. 보수파의 상징인 사오리의 공간에, 개혁파의 수장인 아즈사가 들어오겠다는 정치적 결합의 선언이었다. 잠시 침묵하던 사오리는 펜을 돌리며 무심하게 대답했다.\n\n\"...마음대로 해라. 단, 내 집무실까지 시끄러워지는 건 사양이다.\"\n\n\"걱정 마. 벽은 두꺼우니까.\"\n\n아즈사의 표정에는 변화가 없었지만, 돌아나가는 발걸음은 올 때보다 한결 가벼워 보였다."
 ARI_reformist_event_chain.14.a: "이제 결재를 받기 위해 15분을 걸을 필요가 없어졌다."

 ARI_reformist_event_chain.15.t: "결투 2"
 ARI_reformist_event_chain.15.d: "타앙-! 챙-!\n\n훈련장의 적막을 찢은 것은 날카로운 금속음과 거친 숨소리였다. 시라스 아즈사는 이전처럼 망설이지 않았다. 그녀는 사오리의 사각을 파고들며 훈련용 나이프를 역수로 쥐고 찔러 들어갔다. 그 움직임에는 군더더기가 없었고, 트리니티에서 배운 변칙적인 전술까지 섞여 있었다.\n\n'잡았다.'\n\n아즈사가 사오리의 무게 중심이 흔들린 틈을 타 결정타를 날리려던 찰나였다.\n\n\"...단조로워.\"\n\n사오리의 목소리가 귓가에 스치듯 들렸다. 사오리는 아즈사의 공격을 피하는 대신, 오히려 그 안으로 파고들어 어깨로 아즈사의 명치를 강타했다. 숨이 턱 막히는 충격과 함께 아즈사의 몸이 허공에 떴고, 다음 순간 차가운 바닥에 내동댕이쳐졌다.\n\n\"크윽... 하아... 하아...\"\n\n시야가 흔들렸다. 정신을 차렸을 때, 사오리의 총구는 정확히 아즈사의 심장을 겨누고 있었다. 또다시 완패였다.\n\n하지만 사오리는 총을 거두며 아즈사에게 손을 내밀었다.\n\n\"전보다는 낫군. 적어도 이번엔... 내가 땀을 흘리게 만들었으니까.\"\n\n사오리의 이마에는 송글송글 맺힌 땀방울이 흐르고 있었다. 그것은 아즈사가 예전의 '보호받아야 할 아이'에서, 이제는 '경계해야 할 전사'로 성장했음을 인정하는 무언의 훈장이었다.\n\n\"일어와라, 아즈사. 한번 더 해보지. 네 그 변칙적인 기술... 제법 흥미로우니까.\""
 ARI_reformist_event_chain.15.a: "벽은 높았지만, 닿지 못할 거리는 아니었다."

 ARI_reformist_event_chain.16.t: "마법을 거는 시간"
 ARI_reformist_event_chain.16.d: "\"움직이지 마, 리더. 눈 찔러.\"\n\"...으윽. 꼭 이걸 해야 하는 건가?\"\n\n조마에 사오리는 마치 치과 의자에 앉은 아이처럼 잔뜩 긴장한 채 눈을 질끈 감고 있었다. 그녀의 앞에는 시라스 아즈사가 각종 파스텔톤의 팔레트와 브러시를 든 채 비장하게 서 있었다.\n\n\"회장직을 수행하면서 하는 화장은 너무 '전투적'이야. 그건 화장이 아니라 위장크림에 가깝다고.\"\n\n아즈사는 하나코와 히후미에게 전수받았던 손길을 떠올리며, 사오리의 뺨에 은은한 코랄 빛 블러셔를 얹었다. 차갑고 창백했던 사오리의 얼굴에 생기가 돌기 시작했다. 거친 피부 위에도 부드러운 파운데이션이 덮였다.\n\n\"...끝났어. 눈 떠봐.\"\n\n사오리는 조심스럽게 거울을 보았다. 거울 속에는 늘 보던 '아리우스의 독재자'나 '살인 병기'가 없었다. 그저 조금 수줍어하고, 조금 어색해하는 평범한 또래의 소녀가 자신을 마주 보고 있었다.\n\n\"이건... 낯설군.\"\n\"귀여워. 히후미가 그랬어. 귀여운 건 세상을 구한다고.\"\n\n사오리는 거울 속의 자신을 보며 헛기침을 했다. 귀끝이 붉어진 것은 블러셔 때문만은 아닐 것이다. 그녀는 아주 작게 중얼거렸다.\n\n\"...나쁘지 않군. 가끔은.\""
 ARI_reformist_event_chain.16.a: "그래도 두 번은 안 받아줄 것 같았다."

 ARI_reformist_event_chain.17.t: "티파티 부역자에 대한 최종 판결"
 ARI_reformist_event_chain.17.d: "새로 설립된 아리우스 고등법원의 방청석 맨 뒤, 조마에 사오리는 팔짱을 낀 채 재판 과정을 지켜보고 있었다. 피고인석에는 트리니티 점령 과정에서 티파티에 부역하며 아리우스를 상대로 전쟁을 주도한 옛 트리니티의 관료들이 앉아 있었다.\n\n사오리는 처음에 아즈사의 '사법부 독립' 계획에 회의적이었다. 적을 처단하는 데 복잡한 법리와 증거가 왜 필요한가? 즉결 처분이 훨씬 효율적이고 경제적이다. 그것이 그녀가 평생 배워온 방식이었다.\n\n\"피고인 전원에게 징역 20년 및 강제 노역형을 선고한다.\"\n\n판사의 엄중한 선고가 떨어지자, 법정은 잠시 정적에 휩싸였다. 사오리는 폭동을 예상하고 호신용 권총에 손을 올렸다. 하지만... 방청석을 가득 메운 트리니티 시민들의 입에서 터져 나온 것은 비명이나 야유가 아니었다.\n\n\"그래도 좀 낫네.\"\n\"...아리우스가 한 판결이니 뭐.\"\n\n그것은 '납득'이었다. 아리우스의 총구가 무서워서가 아니라, 그들이 저지른 죄에 대한 적절한 절차에 따른 대가를 치른다는 '공정함'에 대한 승복이었다. 아리우스가 자의적으로 휘두르는 칼날이 아닌, 사회 체제에 의한 처벌은 반발심 대신 안도감을 심어주고 있었다."
 ARI_reformist_event_chain.17.a: "\"...인정하지. 네 방식이 더 효율적이야.\""

 ARI_reformist_event_chain.18.t: "달콤한 평화조약"
 ARI_reformist_event_chain.18.d: "시라스 아즈사가 방과후 디저트부의 부실 문을 두드리자, 안에서 정돈된 목소리가 들려왔습니다. 문을 열고 들어선 아즈사를 맞이한 것은, 놀라거나 경계하는 기색 없이 정갈하게 차려진 티타임 테이블이었습니다.\n\n\"어서 와, 아리우스의 리더. 당신이 발표한 사면령 덕분에 오늘은 마음 놓고 차를 우릴 수 있었어.\"\n\n나츠가 김이 모락모락 나는 찻잔을 건넸고, 카즈사는 짐짓 퉁명스러운 척하면서도 가장 좋은 자리를 권했습니다. 이전의 살벌했던 전장의 분위기는 온데간데없었습니다. 그들은 아즈사를 총을 든 적이 아닌, 격식을 갖춰야 할 '방문자'로 인정하고 있었습니다.\n\n\"...우리는 더 이상 무의미한 통제를 하지 않으니까, 너희의 자유로운 활동이 학원 학생들에게도 도움이 되길 바라는거야.\"\n\n아즈사가 딱딱하게, 하지만 진심을 담아 협안을 설명하자 카즈사가 피식 웃으며 고급스러운 케이크 한 조각을 내밀었습니다.\n\n\"말이 너무 딱딱하네. 자, 이게 우리의 답변이야. 트리니티에서도 귀한 건데... 평화 기념으로 주는 거니까 사양하지 마.\"\n\"이건... 뇌물?\"\n\n아즈사는 잠시 케이크를 응시하다가, 조심스럽게 한 입을 베어 물었습니다. 입안 가득 퍼지는 달콤함은 그녀가 그토록 지키고자 했던 평화의 맛과 닮아 있었습니다. 딱딱한 서류상의 도장이나 복잡한 언쟁과 협상 대신, 찻잔이 부딪히는 소리가 두 세력의 결속을 증명했습니다."
 ARI_reformist_event_chain.18.a: "달콤한 한 입."

 ARI_reformist_event_chain.19.t: "지혜의 문을 열고"
 ARI_reformist_event_chain.19.d: "고서관의 거대한 문이 열렸을 때, 그곳을 채운 것은 공포가 아닌 긴장감 섞인 호기심이었습니다. 시라스 아즈사는 구두 소리를 죽이며 들어와, 먼지 쌓인 책장에 경의를 표하듯 고개를 숙였습니다.\n\n\"환영해요, 아즈사 씨! 말씀하신 대로 책들은 미리 분류해 두었어요.\"\n\n사서 시미코가 밝은 표정으로 아즈사를 맞이했습니다. 아리우스의 압박을 피해 숨어야 했던 과거와 달리, 개혁파 정부는 도서관을 '과거의 지혜를 배우는 성소'로 지정하고 적극적인 보호를 약속했기 때문입니다.\n\n책장 뒤에서 모습을 드러낸 코제키 우이 역시, 예전처럼 떨고 있지 않았습니다. 그녀는 안경을 고쳐 쓰며 아즈사가 내민 '교육 과정 개편안'을 꼼꼼히 살폈습니다.\n\n\"...군사학 대신 인문학을 가르치고 싶다고 하셨죠? 흐음... 아리우스의 학생들에게 트리니티의 고전이라... 꽤 난해한 작업이 되겠지만, 당신들처럼 책을 불태우지 않는 '지성인'이라면... 협력할 수 있어요.\"\n\n아즈사의 정중한 요청에 우이는 작게 고개를 끄덕였습니다. 어둠 속에 갇혀 있던 지식들이 아즈사라는 통로를 통해, 폐허 위의 학생들에게 전해지기 시작하는 순간이었습니다."
 ARI_reformist_event_chain.19.a: "펜은 칼보다 강하다."

 ARI_reformist_event_chain.20.t: "제헌의회 개최"
 ARI_reformist_event_chain.20.d: "아리우스 대의사당의 거대한 아치 아래, 수백 개의 숨결이 엉겨 붙어 무거운 안개를 만들고 있었다. 그곳에 모인 것은 총을 든 병사가 아니었다. 펜을 든 지식인, 낡은 법전을 든 학자, 그리고 폐허 위에서 살아남은 시민 학생들이라는 이름의 건축가들이었다.\n\n연단에 선 시라스 아즈사는 잠시 눈을 감았다 떴다. 시야의 끝자락, 군중의 파도 너머에서 익숙한 금빛과 연분홍빛의 실루엣이 등대처럼 반짝였다. 히후미와 하나코. 한때는 닿을 수 없는 낙원의 거주자였으나, 이제는 이 거친 공사판의 증인이 되어준 친구들. 그녀들의 존재는 아즈사에게 우리가 짓고 있는 것이 감옥이 아니라 '집'이라는 사실을 상기시키는 닻과 같았다.\n\n아즈사의 손이 의사봉을 감싸 쥐었다. 그 감촉은 익숙한 소총의 개머리판보다 훨씬 차갑고, 동시에 무거웠다. 앞으로 약 두달. 우리는 이곳에서 사오리의 권한을 어디까지 제한할 것인지, 학원의 자치권은 어디에 둘 것인지 같은 따분하고 건조한 논쟁의 늪을 건너야 한다. 하지만 아즈사는 알고 있었다. 그 지루함이야말로 우리가 그토록 갈구했던 '평화'의 다른 이름임을.\n\n과거의 우리는 허무(Vanitas)를 노래하며 모든 것을 무너뜨렸다. 그러나 오늘, 우리는 잉크와 종이로 된 성벽을 쌓으려 한다. 그것은 비바람에 찢길 듯 얇아 보이지만, 어쩌면 세상 그 어떤 요새보다 견고할 것이다.\n\n\"......개회를 선언한다.\"\n\n의사봉이 내려쳐지는 소리는 총성처럼 날카롭지 않았다. 그것은 차라리, 거대한 건물의 첫 번째 벽돌이 대지 위에 놓이는 둔탁하고 묵직한 심장 박동에 가까웠다. 낡은 시대의 묘비명이 될 백지 위에, 새로운 공화국의 첫 문장이 새겨지고 있었다."
 ARI_reformist_event_chain.20.a: "잉크는 마르지 않을 것이다."

 ARI_reformist_event_chain.21.t: "제헌: 제1 공리"
 ARI_reformist_event_chain.21.d: "제헌 의회의 연단 위, 시라스 아즈사는 펼쳐진 백지를 한참 동안 응시했습니다. 그 침묵은 장내의 산소를 모두 태워버릴 듯 무거웠습니다. 그녀는 펜을 들어 허공에 보이지 않는 선을 그었습니다. 그것은 전술 지도가 아니었습니다. 앞으로 세워질 국가의 영혼을 설계하는 첫 번째 선이었습니다.\n\n\"우리가 쌓아 올릴 이 '공화국'이라는 성벽은 무엇을 지키기 위해 존재하는가? 썩어 문드러진 깃발인가, 아니면 그 아래서 숨 쉬는 생명인가.\"\n\n그녀는 청중을, 아니 아리우스의 미래를 향해 물었습니다. 이것은 단순한 법률 조항의 문제가 아니었습니다. 우리가 '도구'에서 '인간'으로 거듭나는 방식에 대한 근원적인 질문이었습니다.\n\n\"아리우스 공화국은...\""
 ARI_reformist_event_chain.21.a: "인간의 존엄성을 지키기 위해 존재한다."
 ARI_reformist_event_chain.21.b: "공동체의 가치 실현을 위해 존재한다."

 ARI_reformist_event_chain.22.t: "제헌: 땀과 피"
 ARI_reformist_event_chain.22.d: "의사봉 소리가 다시 한번 울려 퍼졌습니다. 이제 논의는 국가의 기둥을 받치는 기반에 관한 것이었습니다.\n\n아즈사는 회의장을 채운 학생들을 둘러보았습니다. 누군가는 차가운 폐허 속에서 끊임없는 노동으로 손이 거칠어져 있었고, 누군가는 출신이 다르다는 이유만으로 보이지 않는 차별의 벽 앞에서 떨고 있었습니다.\n\n무너진 세계를 다시 세우기 위해, 우리는 정의의 첫 번째 초석을 어디에 놓아야 합니까? 흘린 땀방울의 신성함입니까, 아니면 우리를 갈라놓았던 증오의 지우개입니까?"
 ARI_reformist_event_chain.22.a: "노동의 가치를 최우선으로 삼는다."
 ARI_reformist_event_chain.22.b: "민족 간의 평등을 최우선으로 삼는다."

 ARI_reformist_event_chain.23.t: "제헌: 권력의 무게중심"
 ARI_reformist_event_chain.23.d: "이제 의사당의 공기는 권력의 종착지를 두고 팽팽하게 당겨졌습니다. 과거 우리는 한 명의 절대자 아래서 효율적으로 움직이는 톱니바퀴였지만, 동시에 그 주인이 잘못된 길을 가리킬 때 멈추는 법을 몰랐습니다.\n\n아즈사는 단상 위에서 묻습니다. 새로운 아리우스는 하나의 강력한 머리가 이끄는 기민한 검이 되어야 합니까, 아니면 각 지역의 의회가 서로를 지탱하는 촘촘한 그물이 되어야 합니까?"
 ARI_reformist_event_chain.23.a: "국가총리의 권한 강화에 집중한다."
 ARI_reformist_event_chain.23.b: "지방의회 재건에 집중한다."

 ARI_reformist_event_chain.24.t: "마지막 의무"
 ARI_reformist_event_chain.24.d: "제헌 의회의 불이 꺼지지 않는 밤들이 지나고, 어느덧 헌법 초안의 완성을 알리는 잉크 냄새가 단치히의 새벽 공기에 섞여 들고 있었습니다. 하지만 그 역사적인 순간에, 조마에 사오리는 의사당이 아닌 자신의 낡은 집무실에서 군장을 정리하고 있었습니다.\n\n\"...헌법 제정이 거의 끝났더군. 고생했다, 아즈사.\"\n\n사오리는 들어선 아즈사를 돌아보지도 않은 채, 책상 위에 놓인 자신의 군번줄과 권총, 그리고 '임시 정부 수반'의 직인이 찍힌 명패를 나란히 내려놓았습니다. 그것은 단순한 정리가 아니었습니다. 명백한 '해제'였습니다.\n\n\"나는 사임하겠다. 공식적인 제헌 선포식 전까지 거취를 정리할 생각이다.\"\n\n아즈사의 숨이 턱 막혔습니다. 예상하지 못한 바는 아니었습니다. 개혁파 내부에서도, 거리의 트리니티계 시민들 사이에서도 '독재자 사오리'의 퇴진을 요구하는 목소리는 끊이지 않았으니까요. 하지만 사오리의 입으로 직접 듣는 것은 전혀 다른 무게였습니다.\n\n\"내 역할은 여기까지다. 나는 폐허와 전쟁의 시대에나 어울리는 부품이야. 네가 세우려는 '공화국'이라는 새 기계에, 피 묻은 톱니바퀴는 맞물리지 않아.\"\n\n사오리는 덤덤하게 창밖을 가리켰습니다. 그곳에는 재건된 도시의 불빛이 별처럼 반짝이고 있었습니다.\n\n\"저들을 봐라. 사람들은 '평화'를 원하지만, 내 얼굴을 볼 때마다 '공포'를 떠올리지. 내가 자리를 지키고 있는 한, 네가 말한 '화합'은 영원히 반쪽짜리에 불과해. ...탄환은 발사되면 탄피를 남기고 사라지는 법이다. 그게 규칙이야.\"\n\n사오리는 처음으로 희미하게 미소를 지었습니다. 그것은 짐을 벗은 자의 홀가분함이자, 제자에게 길을 터주려는 스승의 마지막 배려였습니다. 그녀는 돌아설 준비를 마친 채, 마지막으로 아즈사를 바라보았습니다.\n\n\"그러니 나를... 과거와 함께 묻어다오.\"\n\n그 순간, 아즈사의 머릿속에서 수만 가지의 전술과 논리가 뒤엉켰다가 산산이 부서졌습니다. 이것은 정치가의 계산으로 풀 수 있는 문제가 아니었습니다. 아즈사는 떨리는 입술을 열어, 사오리의 그 슬픈 미소를 향해 한 발짝 내디뎠습니다."
 ARI_reformist_event_chain.24.a: "\"...알겠어.\""
 ARI_reformist_event_chain.24.b: "§6\"스쿼드 리더의 자리를 두고, 결투를 신청하겠어.\"§!"

 ARI_reformist_event_chain.25.t: "마지막 의무 - Truth"
 ARI_reformist_event_chain.25.d: "콰앙-!!\n\n사오리가 내려놓은 '사임서'와 명패가 아즈사의 군홧발에 차여 허공으로 흩뿌려졌습니다. 사오리의 눈동자가 처음으로 크게 흔들렸습니다. 그녀가 무어라 입을 떼기도 전에, 아즈사는 사오리의 멱살을 잡고 거칠게 책상으로 밀어붙였습니다.\n\n\"스쿼드의 룰을 잊었어? 약한 자는 강한 자에게 복종한다. 리더의 자리는 양보받는 게 아니라 쟁취하는 거야!\"\n\n아즈사의 눈에는 물기 어린 눈물이 털어내진 자리에, 독기가 서려 있었습니다. 그녀는 허리춤에서 훈련용 권총을 뽑아 사오리의 미간을 겨눴습니다.\n\n\"내가 이기면, 너는 내 명령에 복종해. 내 명령은... '떠나지 마'다. 알겠어?!\"\n\n\"...하.\"\n\n사오리는 헛웃음을 터뜨렸습니다. 정치적 타협이나 설득이 아닌, 가장 원초적이고 아리우스다운 방식. 이 녀석은 지금 자신을 가두기 위해, 자신을 넘어서겠다고 선언하고 있는 것입니다.\n\n사오리의 눈빛이 순식간에 차갑게 가라앉았습니다. 그녀는 아즈사의 손을 쳐내며 순식간에 거리를 벌렸습니다. 좁은 집무실은 이제 집무실이 아니었습니다. 두 마리의 짐승이 갇힌 우리였습니다.\n\n\"...좋다. 받아주지.\"\n\n사오리 역시 품에서 총을 꺼내 들었습니다. 그녀는 봐줄 생각이 추호도 없었습니다. 자신이 이겨야만 아즈사가 미련 없이 자신을 버릴 수 있을 테니까. 그녀는 아즈사를 위해서라도, 이 승부에서 이겨서 기어코 떠나야만 했습니다.\n\n\"전력으로 와라, 아즈사. 내 '마지막 의무'는... 너에게 패배감을 가르쳐 주는 거다.\"\n\n두 사람의 총구가 서로를 향해 불을 뿜었습니다."
 ARI_reformist_event_chain.25.a: "결판을 낸다!"

 ARI_reformist_event_chain.26.t: "마지막 의무 - Truth"
