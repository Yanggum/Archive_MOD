 idea_ARI_universal_suffrage_desc: "아리우스 공화국은 수많은 민족의 이권주의와 관료주의의 편향에 빠지지 않고, 결국 전국의 보편 선거제를 통과하며 완수되었습니다. 이제, 우리는 민주주의의 불꽃이 비추는 길을 따라 영광스러운 미래를 향해 나아갈 것입니다."

