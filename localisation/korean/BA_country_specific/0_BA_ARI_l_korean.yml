 ARI_event.23.t: "추격을 따돌리고"
 ARI_event.23.d: "라인하르트 하이드리히, 그는 옛 독일의 보안국장이자 대전이 사태 이후 친위대 조직을 수습하고 저항군을 이끌었습니다. 그러나 그는 트리니티 정의실현부의 수사 끝에 세이아 습격 사건의 배후에 그가 있는 것을 알아챈 이후, 트리니티의 정의실현부가 그를 집요하게 추격하기 시작해서 모든 공작을 포기하고 도주하는 수밖에 없었습니다.\n\n그리하여 라인하르트 하이드리히는 추격을 떨쳐내고 도주에 성공했고, 아리우스 분교가 나치당에 전적인 협력을 내세운 이후 미국으로 망명하려던 계획을 모두 취소하고 아리우스 분교로 소수의 친위대를 이끌고 넘어왔습니다.\n\n트리니티 종합학원의 완벽한 종말과 옛 독일의 부활을 내걸고 라인하르트 하이드리히는 다시 한번 새로운 공작을 준비하기 시작했습니다."
 ARI_event.23.a: "그녀석들은 내가 죽은줄 알겠지."

 ARI_event.70.t: "독일 망명자들의 사단 창설"
 ARI_event.70.d: "많은 독일 망명자들이 장비를 제공받기만 한다면, 우리를 대신해 전장에 보내질 수 있는 완전한 군대로 조직될 것입니다."

 ARI_event.71.t: "[FROM.GetName](으)로 결집하는 독일인들"
 ARI_event.71.d: "아리우스는 전쟁이 끝난 후 과거 독일 영토에 독일인의 국가를 복원할 의사를 밝혔습니다. 이러한 행보는 트리니티가 지배하는 지역의 독일인들에게 큰 규모의 민족주의적 결집을 야기했고 곧이어 아리우스를 위해 싸울 독일 자유 군단이 결성되기 시작했습니다.\n\n우리가 전쟁을 결정적으로 끝낼 수 없다면 이 움직임을 짓밟는 것이 매우 어려워질 것입니다..."
 ARI_event.71.a: "제1차 공의회를 기억해라!"
 ARI_event.71.b: "너희 모두! 반역자놈들이다!"

 ARI_story_event.1.t: "전쟁해군과의 밀회"
 ARI_story_event.1.d: "단치히의 버려진 제3부두, 곰팡이 낀 컨테이너 박스들이 흉물스럽게 쌓인 그늘 아래서 조마에 사오리는 어둠 속에 녹아든 그림자처럼 서 있었습니다. 그녀의 맞은편에는 제복의 견장을 떼어낸 사내가 굳은 표정으로 서류 가방을 쥐고 있었습니다. 그는 트리니티의 감시망을 뚫고 접선한 에리히 레더 제독의 특사였습니다.\n\n두 세력의 이해관계는 기묘한 지점에서 일치했습니다. 아리우스는 고립된 전황을 타개할 외부의 지원과 해상 보급로가 절실했고, 전쟁해군은 트리니티 내부에서 와해 직전에 몰린 독일 국방군 병력을 안전하게 재집결시킬 '구멍'이 필요했습니다. 사오리가 탁자 위에 펼쳐진 발트해 지도 위, 단치히와 고틀란드를 잇는 항로에 붉은 펜으로 선을 긋자 특사는 무겁게 고개를 끄덕였습니다.\n\n이 밀약을 통해 트리니티의 영역 내에 고립된 독일군 병력은 아리우스가 통제하는 단치히 항구를 경유해, 안전지대인 고틀란드로 비밀리에 이송될 것입니다. 그 대가로 아리우스는 전쟁해군이 비축해둔 군수 물자와 해상 봉쇄에 대한 제한적인 지원을 약속받았습니다.\n\n감정 없는 눈빛 교환과 서류에 찍힌 붉은 도장만이 이 위험한 거래의 유일한 증인이었습니다. 헛됨을 쫓는 소녀들과 망령이 된 군인들의 공모는 그렇게 차가운 바닷바람 속에서 조용히 매듭지어졌습니다."
 ARI_story_event.1.a: "적의 적은, 유용한 도구일 뿐이다."

 ARI_story_event.2.t: "아리우스 분교 활동에 대한 보고서"
 ARI_story_event.2.d: "\n서류번호: ABS-000950202\n보고자: 정의실현부 부부장 하네카와 하스미\n수신: 트리니티 호스트 [TRM.GetLeader]\n참조: 트리니티 지상군\n\n-서론\n아리우스 분교의 비정상적인 물자 이동 및 잠재적 위협에 관한 보고\n\n최근 대전이 이후 혼란스러운 정세 속에서, 아리우스 자치구 주변의 흐름이 심상치 않다는 현장 요원들의 보고가 빗발치고 있습니다. 표면적으로 그들은 우리와 마찬가지로 낯선 세계에 떨어진 '피해자'를 자처하고 있으며, 특히 게헨나에 대한 적개심을 공유한다는 명분으로 일부 학생들의 동정론을 사고 있습니다.\n\n하지만 정보 분석실의 판단은 다릅니다. 이는 명백한 기만전술입니다.\n\n최근 아리우스 측의 식량 소비량 대비 화약 및 공작기계 반입량이 비정상적으로 급증했습니다. 또한, 신원 미상의 병력이 트리니티 외곽 경계선 사각지대에서 목격되었다가 순식간에 사라지는 현상이 반복되고 있습니다. 이는 단순한 자경단 활동의 범주를 넘어선, 조직적이고 군사적인 '침투 준비' 단계로 의심됩니다.\n\n현재 학원 내 여론 때문에 선제 타격은 불가능합니다. 하지만 놈들이 우리의 목을 노리고 칼을 갈고 있다는 사실마저 외면해서는 안 됩니다.\n\n우리는 놈들이 준비하는 '그것'이 실행되기 전에, 가능한 모든 방어 수단을 강구해야 합니다. 지금부터 정의실현부는 비상 경계 태세 발령을 건의합니다."
 ARI_story_event.2.a: "수신."

 ARI_story_event.4.t: "변화의 바람"
 ARI_story_event.4.d: "프로이센의 차가운 새벽 공기조차 탁상 위에 쌓인 서류 더미의 묵은 먼지 냄새를 지우지는 못했습니다. 아리우스가 트리니티와의 전쟁, 그리고 이어진 영토 확장을 통해 얻어낸 것은 비단 승리감뿐만이 아니었습니다. 그것은 '관리'라는 이름의, 총탄보다 더 무겁고 질척한 늪이었습니다.\n\n\"...이해할 수 없군.\"\n\n조마에 사오리는 미간을 찌푸리며 보고서를 책상에 던지듯 내려놓았습니다. 그녀의 손은 방아쇠를 당기는 것에는 익숙했지만, 점령지의 식량 배급표를 조정하거나 유입되는 외부인들의 민원을 처리하는 데에는 조금도 익숙해지지 않았습니다.\n\n구석진 소파에 몸을 구겨 넣은 미사키가 힘없는 목소리로 중얼거렸습니다.\n\n\"...웃기지도 않아. 폐허에서 곰팡 핀 빵을 나누던 우리가, 이제는 남의 나라 행정권을 쥐고 흔든다니. 다 헛된 일이야. 덩치가 커질수록 그림자도 짙어지는 법이니까.\"\n\"으, 으에... 리더... 저기, 새로 들어온 행정관들이 보낸 요청서 말인데요... 우리더러 너무 '구시대적' 이래요. 좀 더... 유연하게 대처하지 않으면 폭동이 일어날 거라고... 무, 무서워요...\"\n\n히요리가 울상을 지으며 내민 서류에는 붉은색 경고 마크가 가득했습니다. 아리우스의 방식—철저한 통제, 증오에 기반한 교육, 군사적 규율—은 점령지의 거대해진 행정 조직과 외부 문화에 섞여 들지 못하고 삐걱거리고 있었습니다. 옛 방식 그대로 찍어 누를 것인가, 아니면 살아남기 위해 우리가 그토록 경멸하던 '세상의 방식'을 일부 받아들일 것인가."
 ARI_story_event.4.a: "아직은 변할 때가 아니야."
 ARI_story_event.4.b: "...할 말이라도 있나, 아즈사?"

 ARI_story_event.5.t: "부패하는 병참선"
 ARI_story_event.5.d: "단치히의 항구 창고 뒤편, 어둠이 짙게 깔린 골목에서 츠치나가 히요리가 겁에 질린 표정으로 들고 온 것은 낡은 장부 하나였습니다.\n\n\"으, 으에... 리더, 이거 보세요. 이번 달 제3구역 배급 장부인데요... 숫자가 안 맞아요. 통조림이랑 의료품이... 절반이나 사라졌어요. 그리고 저, 저기 시장 쪽에서 우리 마크가 찍힌 약품이 비싸게 팔리고 있대요...\"\n\n전쟁이 길어지면서 초기 아리우스가 유지했던 서릿발 같은 규율에도 균열이 가고 있었습니다. 병사들과 말단 행정관들은 끝이 보이지 않는 전쟁에 지쳐가고 있었고, 생존 본능은 곧 탐욕으로 변질되어 물자를 빼돌리기 시작했습니다. 감시해야 할 헌병들조차 뇌물로 받은 초콜릿을 입에 물고 눈을 돌리고 있는 실정입니다.\n\n\"구멍 난 독에 물 붓기야.\"\n\n미사키가 나지막이 중얼거렸습니다. 그녀는 텅 빈 탄약 상자를 의자로 삼아 걸터앉아 있었습니다.\n\n\"증오만으로는 배를 채울 수 없으니까. 다들 살 길을 찾기 시작한 거지. 우리가 가르친 게 '생존'이었잖아? 이게 그 결과물이야.\"\n\n사오리는 관자놀이를 꾹 눌렀습니다. 총을 들이대고 공포로 다스리는 방식은 소규모 게릴라전에서는 유효했습니다. 하지만 수많은 인구와 거대한 영토, 복잡한 유통망을 가진 지금의 아리우스에게 단순한 '배급제'는 한계에 봉착했습니다. 썩어가는 환부를 도려내려면 단순히 도둑을 잡는 것이 아니라, 경제가 돌아가는 방식 자체를 바꿔야 할지도 모릅니다."
 ARI_story_event.5.a: "...일단은 전부 독방에 잡아넣어."

 ARI_story_event.6.t: "유리 조각이 휘날리는 밤"
 ARI_story_event.6.d: "챙그랑! 날카로운 파열음이 단치히의 밤공기를 찢어발겼습니다. 그것은 신호탄이었습니다.\n\n트리니티 종합학원의 자본으로 운영되던 상점들, 우아한 찻잔과 고급 홍차, 그리고 페로로 인형들이 진열된 쇼윈도가 군홧발에 박살 났습니다. 그들은 친위대 출신의 선동가이거나, 독일인 실업자일수도 있고, 일반적으로는 억눌린 증오를 폭발시키는 아리우스의 학생들이 있었습니다.\n\n\"전부 부숴라! 트리니티의 냄새가 나는 건 하나도 남기지 마!\"\n\n불길이 치솟는 거리 한복판에서, 사오리는 팔짱을 낀 채 그 광경을 무심하게 내려다보고 있었습니다. 겁에 질린 상인들이 끌려 나오고, 약탈당한 물건들이 거리에 나뒹굴었습니다.\n\n\"...리더, 저거. 말려야 하는 거 아니에요? 헌병들이 오히려 거들고 있는데...\"\n\n히요리가 깨진 유리 조각을 밟으며 불안한 듯 물었습니다. 미사키는 타오르는 불꽃에 담배를 붙이며 건조하게 대답했습니다.\n\n\"내버려 둬. 억눌린 걸 풀어주는 거야. 저 녀석들, 지금 저 가게 주인을 패는 게 아니야. 자신들을 가뒀던 '트리니티'라는 환영을 패고 있는 거지. ...유치하지만, 효과적인 방법이야.\"\n\n미사키가 지적한 것 처럼, 이 약탈은 단순한 범죄가 아닙니다. 이것은 억압받아온 독일과 아리우스의 분노가 가장 낮은 곳에서부터 표출되는 방법이자, 한 순간에 해결할 방법은 없는 깊은 감정의 골입니다. 사오리의 눈동자에 붉은 불길이 일렁였습니다. 그녀는 이것을 멈출 수도, 혹은 더 부추길 수도 있습니다."
 ARI_story_event.6.a: "그들의 증오를 허락한다. 트리니티의 흔적을 지워라."
 ARI_story_event.6.b: "공식적으로 약탈을 금지하는 행정 명령을 발표해라."

 ARI_story_event.7.t: "불협화음"
 ARI_story_event.7.d: "쾅-!!\n\n육중한 참나무 문이 닫히는 소리가 집무실의 정적을 찢어발겼다. 문틀에서 떨어진 먼지가 카펫 위로 내려앉았고, 사오리는 그 진동이 멈출 때까지 멍하니 닫힌 문을 응시하고 있었다. 책상 위에는 붉은 펜 자국으로 난도질당한 연설문 초안만이 덩그러니 놓여 있었다.\n\n방금 전까지 이 방을 채웠던 것은 시라스 아즈사의 날 선 목소리였다. 아즈사는 사오리가 건넨 원고를 잠시 살핀 후, 보란 듯이 책상 위에 내던졌고, 그 때의 아즈사는 명백한 경멸의 눈빛을 짓고 있었다.\n\n서로 간의 격한 언쟁이 오간 후, 아즈사는 사오리를 노려보았으며, 그 눈빛에 더 이상 예전의 동경이나 복종은 없었다. 그녀는 언젠가부터 사오리를 '리더'가 아닌, 극복해야 할 '구시대'로 보고 있었다.\n\n그 침묵 이후 아즈사는 아무 말 없이 몸을 돌려 나가버렸다. 사오리는 욱신거리는 관자놀이를 누르며 생각했다. 아즈사가 지적한 대로, 국가는 이미 쪼개져 있었다. 승리에 도취해 복수를 완성하려는 자들과, 폐허 위에 새로운 집을 지으려는 자들. 오늘 아즈사의 이탈은 그 균열을 돌이킬 수 없게 만들었고, 앞으로도 봉합되지 못할 것처럼 보였다."
 ARI_story_event.7.a: "보수적인 연설문을 채택한다."
 ARI_story_event.7.b: "...연설문을 조금만 고쳐볼까."
 ARI_story_event_7_tt: "§g아즈사는 이제 개혁파의 지도자로 활동합니다.§!"

 ARI_story_event.10.t: "복수의 방아쇠를 당기다"
 ARI_story_event.10.d: "마침내, 그 날이 왔습니다.\n\n오래전 제1차 공의회에서 이단이라는 낙인이 찍히던 그 날부터, 쫓기고 숨고 굶주리며 버텨온 모든 날들이 오늘 이 순간을 향해 흘러오고 있었는지도 모릅니다.\n\n조마에 사오리는 선전포고문에 서명을 마친 뒤, 창밖으로 펼쳐진 단치히의 회색 하늘을 올려다보았습니다. 총성도, 환호성도 아직 없었습니다. 그저 기나긴 침묵만이, 폭풍 전야처럼 깔려 있을 뿐이었습니다.\n\n\"모든 것은 헛될 테지. 하지만 이 복수만큼은, 끝을 보기 전까지는 헛되지 않을 거야.\"\n\n트리니티의 심장을 향한 아리우스의 긴 행군이 지금 시작됩니다."
 ARI_story_event.10.a: "전진하라. 멈추지 마라."
 ARI_story_event_10_tt: "§Y새로운 군사 중점 계통도§!가 해금됩니다.\n -§Y$ARI_raging_storm$§! 중점 해금\n -§Y$ARI_march_in_death$§! 중점 해금\n -§Y$ARI_large_scale_pitched_battle$§! 중점 해금\n -§Y$ARI_war_of_attrition$§! 중점 해금\n -§Y$ARI_holding_arius_council$§! 중점 해금"

 ARI_story_event.11.t: "제2차 공의회 전야"
 ARI_story_event.11.d: "동프로이센이 함락되었습니다.\n\n쫓겨나고, 숨고, 굶주리던 아리우스가 처음으로 발을 딛은 적의 땅입니다. 병사들의 군화 아래 짓밟히는 흙은 더 이상 단치히의 흙이 아닙니다. 트리니티의 땅입니다. 우리가 빼앗은, 트리니티의 땅.\n\n조마에 사오리는 전황 지도 위에 새 전선을 그으며 입을 열었습니다.\n\n\"공의회를 소집한다.\"\n\n아직 전쟁은 끝나지 않았습니다. 에덴은 건재하고, 트리니티의 심장은 아직 뛰고 있습니다. 그러나 세계는 알게 될 것입니다. 아리우스가 다시 돌아왔다는 것을. 이번에는, 도망치지 않는다는 것을."
 ARI_story_event.11.a: "공의회를 열어라. 전 세계에 알린다."
 ARI_story_event_11_tt: "확장된 아리우스 분교를 중심으로 §Y권력 투쟁§!이 본격적으로 점화됩니다. 새로운 아리우스의 경향 §Y결정§!을 해금합니다."
 ARI_story_event_11_tta: "보수파의 활동:"
 ARI_story_event_11_ttb: "개혁파의 활동:"

 ARI_news.1.t: "아리우스 공의회 선포"
 ARI_news.1.d: "오늘 새벽, 트리니티 종합학원의 옛 영토이자 현재 아리우스 분교가 점령 중인 성당 폐허에서 전 키보토스를 뒤흔들 충격적인 성명이 발표되었습니다.\n\n수십 년 전, 제1차 공의회에서 '이단'으로 낙인찍혀 역사 속으로 사라졌던 아리우스 분교가, 이제는 정반대로 자신들을 제외한 트리니티의 모든 분파를 '이단'으로 규정하는 '아리우스 공의회'를 공식적으로 선포했습니다.\n\n단상에 오른 아리우스의 [FROM.GetLeader]는(은) 오로지 고통과 증오를 통해 단련된 아리우스의 신앙만이 진정한 신앙임을 천명했습니다. 이는 단순한 분리 독립에서 더 나아가, 자신들이 키보토스에서 가장 거대한 학원인 트리니티의 정통성을 뿌리째 부정하고, 자신들이 그 자리를 대체하겠다는 사실상의 '분쇄 선언'입니다."
 ARI_news.1.a: "바니타스 바니타툼, 에트 옴니아 바니타스."
 ARI_news.1.b: "말도 안 되는 신성모독이다!"
 ARI_news.1.c: "저들이 승리할 수 있을까?"

 ARI_news.2.t: "트리니티의 몰락"
 ARI_news.2.d: "오늘 새벽, 포화가 멈춘 트리니티 대성당의 첨탑 위로 찢겨 나간 티파티의 깃발 대신 아리우스의 검은 깃발이 게양되었습니다. 키보토스 전역이 숨을 죽이고 지켜보는 가운데, [FROM.GetLeader]는(은) 폐허가 된 제단 위에서 '트리니티의 완전한 종말'과 '아리우스에 의한 통일'을 선언했습니다.\n\n세계가 그저 '망명자들의 헛된 망상'이나 '일시적인 테러'라고 치부했던 제2차 아리우스 공의회의 내용은 이제 거부할 수 없는 차가운 현실이 되었으며, 트리니티의 모든 교리는 '이단'으로 규정되어 불태워지고 있습니다.\n\n승자의 연설은 짧았으나 그 무게는 결코 가볍지 않았습니다. 지하 카타콤의 어둠 속에 숨죽이고 있던 그들은 기어코 빛의 세계를 집어삼켰고, 가장 거대한 학원의 주인이 되었습니다. 아리우스의 광상은, 이제 그 누구도 부정할 수 없는 '역사'가 되었습니다."
 ARI_news.2.a: "신은 죽었다. 오늘 확실히."
 ARI_news.2.b: "키보토스의 질서가 영원히 바뀌었군."

 # CASE 1: 아즈사 패배 시 뉴스
 ARI_news.5.t: "아리우스 집무실 테러!"
 ARI_news.5.d: "오늘 새벽, 아리우스 지도부 간의 사소한 갈등으로 인해 벌어진 무력 충돌로 임시 정부 집무실이 초토화되는 사건이 발생했습니다.\n\n파괴된 현장에서는 쓰러진 시라스 아즈사만이 발견되었으며, 출동한 구급대는 익명의 누군가가 남긴 신고를 받고 현장에 도착한 것으로 알려졌습니다. 사건 직후 개혁파 내에서는 보수파 잔당이나 반대파의 암살 시도가 아니냐는 강경론이 들끓으며 긴장감이 최고조에 달했습니다.\n\n하지만 병상에서 의식을 회복한 아즈사가 해당 사건에 대해 \"테러가 아닌 단순한 개인사일 뿐\"이라며 모든 의혹을 단호하게 일축하면서, 일촉즉발의 사태는 간신히 진정 국면에 접어들었습니다. 그러나 사오리의 행방이 묘연해지며 지도부의 공백에 대한 시민들의 불안은 커져가고 있습니다."
 ARI_news.5.a: "개인적인 사정일 뿐이다."
 ARI_news.5.b: "...뭐? 사소한 갈등으로 집무실을 터뜨려?"

 # CASE 2: 아즈사 승리 시 뉴스
 ARI_news.6.t: "아리우스 집무실 테러!"
 ARI_news.6.d: "오늘 새벽, 아리우스 지도부 간의 사소한 갈등으로 인해 벌어진 무력 충돌로 임시 정부 집무실이 초토화되는 사건이 발생했습니다.\n\n현장에서는 의식을 잃고 쓰러진 조마에 사오리와, 부상을 입은 채 직접 구급대에 신고를 접수한 시라스 아즈사가 발견되었습니다. 구급대원들에 의해 긴급 이송된 두 사람은 현재 전담 의료진의 치료를 받으며 안정을 취하고 있습니다.\n\n병상에서 깨어난 사오리와 아즈사는 집무실이 박살 난 구체적인 이유에 대해서는 철저히 함구하고 있습니다. 그러나 조마에 사오리는 짧은 성명을 통해 \"개헌 이후에도 자리에 남아 국가에 대한 책임을 다하겠다\"는 의사를 공식적으로 표명했으며, 이로써 항간에 떠돌던 사오리의 은퇴설 및 지도부 분열설은 종식되었습니다."
 ARI_news.6.a: "개인적인 사정일 뿐이다."
 ARI_news.6.b: "...뭐? 사소한 갈등으로 집무실을 터뜨려?"

 # 아리우스 제헌의회
 ARI_news.7.t: "아리우스 제헌의회 개회"
 ARI_news.7.d: "오늘 아침, 기나긴 증오와 투쟁의 역사를 뒤로하고 아리우스 제헌의회가 공식적으로 개회했습니다.\n\n시라스 아즈사가 주도하는 이 역사적인 의회는 과거 폐허 속에서 복수만을 다짐하던 아리우스 분교가, 이제는 모든 시민과 학생을 포용하는 '공화국'으로 거듭나기 위한 첫걸음입니다. 의사당에는 아리우스의 학생들뿐만 아니라, 옛 트리니티계 주민들과 독일계 대표자들까지 한자리에 모여 국가의 뼈대가 될 새로운 헌법 초안을 논의하기 시작했습니다.\n\n이는 무력과 공포로 질서를 유지하던 조마에 사오리의 군정기가 저물고, 의회주의와 법치를 앞세운 새로운 정치의 시대가 열렸음을 의미합니다. 그러나 낙관하기에는 이릅니다."
 ARI_news.7.a: "증오의 연쇄를 끊어낼 수 있기를."
 ARI_news.7.b: "말로 세운 모래성은 쉽게 무너지는 법이다."

 # 조마에 사오리 사임# CASE 1: 관계도 부족 시 뉴스 (불안과 분열 강조)
 ARI_news.8.t: "조마에 사오리의 사임"
 ARI_news.8.d: "오늘 오전, 아리우스 임시 정부를 이끌던 조마에 사오리가 돌연 사임과 함께 잠적했습니다.\n\n새로운 헌법이 의회를 통과한 직후 벌어진 이 갑작스러운 사태에 키보토스 전역이 술렁이고 있습니다. 정부 측은 '예정된 권력 이양'이라고 선을 그었으나, 항간에서는 개혁파의 지도자인 시라스 아즈사와의 극심한 권력 투쟁 끝에 사오리가 축출된 것이라는 소문이 파다합니다.\n\n사오리의 통제력이 사라지자마자, 그녀에게 억눌려 있던 보수 군부와 강경파들이 즉각적으로 반발할 조짐을 보이고 있습니다. 갓 태어난 아리우스 공화국은 시작부터 거대한 분열의 위기에 직면하게 되었습니다."
 ARI_news.8.a: "새로운 시대다."
 ARI_news.8.b: "그래봤자 권력 투쟁 아닌가?"

 # CASE 2: 관계 충족 시 뉴스 (평화로운 이양과 아쉬움 강조)
 ARI_news.9.t: "조마에 사오리의 사임"
 ARI_news.9.d: "오늘 오전, 아리우스 공화국 헌법의 공식 공포와 함께, 조마에 사오리가 모든 공직에서 자진 사퇴했습니다.\n\n그녀는 공식 성명을 통해 \"국가를 안정화한다는 임무를 완수했으며, 이제 아리우스의 미래는 시민과 새로운 정부의 몫\"이라며 시라스 아즈사에게 모든 권한을 온전히 이양했습니다.\n\n대전이 직후의 혼란 속에서 피도 눈물도 없는 철권통치로 아리우스를 유지했던 그녀의 갑작스러운 퇴장에, 적대적이던 트리니티계 시민들조차 복잡한 심경을 내비치고 있습니다. 폭군이자 동시에 구원자였던 아리우스의 거대한 그림자는, 스스로 무대에서 내려와 역사 속으로 사라졌습니다."
 ARI_news.9.a: "새로운 시대다."
 ARI_news.9.b: "그래봤자 권력 투쟁 아닌가?"

 # CASE 1: 관계 악화 / 비난 속의 퇴임 준비
 ARI_news.10.t: "아리우스 제헌의회 폐회"
 ARI_news.10.d: "오늘 새벽, 아리우스 제헌의회가 헌법 초안 의결을 끝으로 공식적인 폐회를 선언했습니다.\n\n그러나 '통합'이라는 당초의 명분과 달리, 마지막 회의까지도 의사당 내부에서는 파벌 간의 고성이 오갔습니다. 특히 회기 내내 조마에 사오리의 책임론과 권한 축소를 요구하는 비난이 쏟아졌으며, 헌법이 통과된 직후에도 축하보다는 냉랭한 침묵만이 감돌았습니다. 새로운 국가의 법적 뼈대가 세워졌음에도, 정가에서는 사오리가 조만간 불명예스럽게 퇴진할 것이라는 관측이 지배적입니다."
 ARI_news.10.a: "갈등의 불씨는 그대로 남았다."

 # CASE 2: 관계 중립 / 조용한 이선 후퇴 준비
 ARI_news.11.t: "아리우스 제헌의회 폐회"
 ARI_news.11.d: "오늘 새벽, 아리우스 제헌의회가 헌법 초안 의결을 끝으로 공식적인 폐회를 선언했습니다.\n\n이번 의회는 대전이 이후의 혼란을 수습하고, 시민 정부 출범을 위한 법적 기틀을 마련했다는 점에서 소기의 목적을 달성한 것으로 평가받습니다. 폐회식에서 조마에 사오리는 특별한 발언 없이 묵묵히 자리를 지켰습니다. 정치권과 언론은 헌법 제정이라는 중대한 과업이 끝남에 따라, 비상시국을 이끌었던 사오리의 임무 역시 자연스러운 마무리를 앞두고 있다고 보도하고 있습니다."
 ARI_news.11.a: "한 시대가 저물고 있다."

 # CASE 3: 관계 최고 / 사오리 잔류
 ARI_news.12.t: "아리우스 제헌의회 폐회"
 ARI_news.12.d: "오늘 새벽, 아리우스 제헌의회가 헌법 초안 의결을 끝으로 공식적인 폐회를 선언했습니다.\n\n여러 출신 성분이 섞인 의회였음에도 불구하고, 시라스 아즈사의 정치적 조율과 조마에 사오리의 행정적 통제가 맞물려 회기는 비교적 질서정연하게 진행되었습니다. 주목할 만한 점은, 시민 정부 출범과 함께 일선에서 물러날 것으로 예상되었던 사오리가 마지막 의결의 순간까지 아즈사의 곁을 지켰다는 것입니다. 이는 새롭게 출범할 국가가 기존의 구심점을 배제하지 않고 함께 나아가는 실용적인 타협을 선택했음을 시사합니다."
 ARI_news.12.a: "예상 밖의 행보다."

 # CASE 1: 민족연성제 (사오리 은퇴 루트)
 ARI_news.13.t: "아리우스 헌법 공포"
 ARI_news.13.d: "오늘 오전, 아리우스 임시 정부는 새로운 헌법을 공식 공포하며 '민족연성제'에 기반한 공화국의 출범을 선언했습니다.\n\n새 헌법에 따라 아리우스가 통치하던 영토는 트리니티계, 독일계, 폴란드계 등 각 민족과 지역을 대표하는 자치 의회 단위로 재편됩니다. 시라스 아즈사 정부는 이를 통해 자유롭고 평등한 민족들의 연대를 이룩하겠다고 밝혔습니다.\n\n그러나 이 타협적인 체제는 태생적인 한계를 내포하고 있습니다. 각 자치 의회들이 자신들의 정치적 기득권 축소를 우려해 중앙 집중적인 권력 구조에 강력히 반발함에 따라, 1인 1표제에 기반한 전국 단위의 완전한 보편 선거권 도입은 사실상 무산되었습니다. 이는 조마에 사오리의 퇴임 이후, 중앙 정부가 각 지역의 목소리를 통제할 구심점을 상실한 결과로 분석됩니다."
 ARI_news.13.a: "불안전한 타협의 결과물이다."
 ARI_news.13.b: "적어도 피를 흘리지는 않겠군."

 # CASE 2: 보편공화국 (사오리 잔류 루트)
 ARI_news.14.t: "아리우스 헌법 공포"
 ARI_news.14.d: "오늘 오전, 아리우스 임시 정부는 새로운 헌법을 공식 공포하며 민족과 출신 성분을 넘어선 '보편 공화국'의 수립을 선언했습니다.\n\n이번 헌법은 시라스 아즈사의 개혁 노선과, 조마에 사오리가 이끄는 보수파의 '단일한 아리우스'라는 테제가 극적인 타협을 이룬 결과물입니다. 새 헌법은 모든 시민이 특정 민족이나 자치구가 아닌 '아리우스 국가' 자체에 충성할 의무를 명시하고 있으며, 그 대가로 출신에 얽매이지 않는 동등한 시민권을 보장합니다.\n\n조마에 사오리의 군부가 여전히 정부의 통제력을 뒷받침하고 있기에, 아리우스는 각 지역의 분리주의적 요구를 효과적으로 억누르고 전국 단위의 보편 선거를 준비할 수 있게 되었습니다. 중앙의 권위와 시민의 자유가 공존하는 새로운 형태의 공화국이 첫발을 내디뎠습니다."
 ARI_news.14.a: "단일한 국가, 다양한 시민."
 ARI_news.14.b: "너무나도 이상주의적이다."

# 다이나믹 모디파이어

 ARI_two_cities: "두 개의 도시"
 ARI_two_cities_desc: "강을 중심으로 단치히와 아리우스 분교로 나뉘어진 이 도시는 아직 통합되지 않았습니다."

 ARI_gottglaubig: "고트글로이비히"
 ARI_gottglaubig_desc: "트리니티의 증오로 벼려진 아리우스 신앙은 이제 다른 모습으로 변화했습니다. 이제 모든 날개 달린 이들이 바닥으로 추락할 때까지 아리우스의 새로운 신앙은 빛을 발할 것입니다.\n\n삼위일체를 넘어 기독교 그 자체를 부정하는 고트글로비히는 아리우스와 국가사회주의 독일 노동자당만의 독특한 종교입니다. 이들은 기존의 종교 체계를 비난하고 물어뜯으며, 오로지 이 세계를 창조한 신만을 믿습니다."

 ARI_arian_faith: "아리우스 신앙"
 ARI_arian_faith_desc: "본래 트리니티 종합학원을 이루던 수많은 분교중 하나인 아리우스 분교는 제1회 공의회에서 이단으로 선언된 뒤 모든 분교의 적이 되었습니다. 그리하여 아리우스 분교는 모든 것을 내려놓고 아무도 알지 못하는 곳으로 숨어들어 갔습니다. 그리고 트리니티에 대한 복수가 준비될 때 세계에 다시 모습을 드러낼 것이었습니다.\n\n분명, 그래야 했습니다. 그러나 대전이라는 기이한 일이 발생한 이후 아리우스 분교는 혼란을 수습하고 학원의 붕괴를 막아세우는 과정에서 다시 세계로 쫓겨나듯 나타날 수밖에 없었습니다.\n\n아리우스 신앙은 이러한 아리우스 분교의 모든 이데올로기의 집합이며, 그것의 근본은 트리니티에 대한 증오심입니다."
 ARI_lighthouse_of_democracy: "등불"
 ARI_lighthouse_of_democracy_desc: "공의회에서 이단으로 선언된 뒤, 모든 분교에서 쫓기며 폐허 속으로 숨어들던 아리우스 분교는, 이제 다시 한번 세계에 나서고 어둠을 걷어내며 자신들의 정의를 세워냈습니다.\n\n누군가는 이러한 아리우스의 모습을 매국적이라 비판하고, 누군가는 이러한 아리우스의 모습이 권위적이라 비판할지는 몰라도. 적어도 아리우스 공화국은 자신들이 받은 핍박을 돌려주지 않기로 했습니다.\n\n트리니티와 독일, 그리고 수많은 소수 민족의 평등한 민주주의의 등불 아래에. 아리우스 공화국은 영광스러운 목적을 향해 나아가고 있습니다."
 ARI_soft_autonomy_ideology: "느슨한 연합"
 ARI_soft_autonomy_ideology_desc: "아리우스 공화국은 더 이상 아리우스 분교의 국가가 아닙니다. 트리니티의 자치정부, 독일의 자치정부, 게헨나의 자치정부, 폴란드의 자치정부 등, 수많은 평등한 민족의 연합이라는 가치 아래에 세워진 아리우스 공화국의 토대는 어떤 민족이 위에 설 수 없게 만들고 있습니다.\n\n이들을 묶는 가치는 아리우스 신앙에 기초한 헌법적 통치와, 중앙유럽주의라는 새롭게 주창되는 범민족적 가치성으로, 사실 강력한 연대라고 보기는 어렵습니다.\n\n그러나, 이들은 현재 상태에 그럭저럭 만족하고 있으며, 현 상황이 붕괴하는 일은 반대할 것입니다."

