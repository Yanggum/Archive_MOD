# # 외교 이벤트
 ARI_diplomatic_event.1.t: "비밀스러운 접선"
 ARI_diplomatic_event.1.d: "아리우스 분교에서 우리가 트리니티를 침공하기로 한다면 우리의 전쟁을 위해 필요한 정보를 제공하고, 조만간 아리우스 분교가 트리니티를 침공할 예정이라는 비밀스러운 정보를 우리의 지도부에 전달했습니다.\n\n우리는 이들의 요청에 따라 정보를 받아내고, 트리니티를 향한 침략을 준비하거나, 또는 이들을 무시하고 돌려보낼 수 있습니다."
 ARI_diplomatic_event.1.a: "좋다. 침공을 준비해라."
 ARI_diplomatic_event.1.a.tt: "직접 §Y$GEM_war_with_trinity$§! 중점을 완료 시 §Y[TRM.GetNameWithFlag]§! 측을 향한 전쟁에 도움을 주는 기간제 §Y국민정신§!과, §Y안정도§!, §Y전쟁지지도§!를 획득합니다. 또한 중점 완료에 필요한 조건을 대폭 완화합니다."
 ARI_diplomatic_event_1_a_tt: "\n아리우스의 도움:"
 ARI_diplomatic_event.1.b: "너희를 뭘 믿고?"
 ARI_diplomatic_event_1_a_idea: "트리니티의 작전 지도 입수"
 ARI_diplomatic_event.11.t: "만마전의 승인"
 ARI_diplomatic_event.11.d: "만마전 측이 우리가 침략을 약속하는 밀약에 서명했고, 우리의 작전 지도를 제공받았습니다. 곧 저들은 트리니티를 향한 침공을 준비할 것입니다."
 ARI_diplomatic_event.11.a: "우리도 침공을 준비해라."
 ARI_diplomatic_event.12.t: "만마전의 거절"
 ARI_diplomatic_event.12.d: "만마전 측이 우리가 제안한 협력안을 거절했고, 무모한 도박에 참여하지 않겠다는 단호한 입장을 표명했습니다. 트리니티와의 전쟁은 저들이 마음이 바뀔 때까지 기다리거나, 아니면 우리가 단독으로 수행해야 할 것 같습니다."
 ARI_diplomatic_event.12.a: "뿔 달린 놈들이 그렇지."

