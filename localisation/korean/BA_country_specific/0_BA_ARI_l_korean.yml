 ARI_story_event.8.t: "성과를 보인 프로파간다"
 ARI_story_event.8.d: "우리 아리우스 분교가 대전이 이후 상시 벌여온 프로파간다로 인해 트리니티 내부에는 혼란이 발생했습니다. 또한 준비 중이던 우리의 유격대가 트리니티 내부에서 보급을 공격하고 있으며, 포르타 파시스에서 비롯된 아리우스의 천사들도 적의 전선에서 활동하며 우리를 돕고 있습니다.\n\n비록 이번 침공으로 인해 우리가 원하던 대 트리니티 전쟁 계획은 시행하지 못하게 되었으나, 적이 스스로 자신들의 정당성을 후퇴시킨 이상 더 긴 시간 동안 혼란에 빠뜨릴 수 있게 되었습니다."

 ARI_story_event.9.t: "아리우스와의 연대를 위한 대중 트리니티 학생 연합"
 ARI_story_event.9.d: "예상하던 일이 벌어졌습니다. 우리가 아리우스 분교를 향한 선전포고를 준비 중이라는 소문이 돌 때부터 트리니티 학생과 독일계들에는 반전주의 운동이 결집하기 시작했고, 실제 군사 활동이 시작되자마자 일선의 트리니티 학생을 비롯한 수많은 단체가 반전주의를 내걸고 우리의 전쟁을 방해하기 시작했습니다.\n\n또한 전선에서 들리는 나팔 소리와 함께 전쟁 진행을 방해하는 '천사'들 또한 문제가 되고 있으며, 언제부터 우리 틈에 섞여 있었는지 알 수 없는 아리우스 유격대들 또한 본격적으로 우리들의 보급선을 약탈하기 시작했습니다.\n\n트리니티의 가장 나쁜 전쟁이 시작되었습니다. 적이 강하거나 민중이 지지하는 문제가 아닌, 아리우스와 트리니티라는 가까우면서 먼 관계에서 빚어지는 혼란이 지금 나타나고 있습니다."


# 트리니티 군사작전
 ARI_permanent_anti_trinity_military_operation: "반영구적 반트리니티 군사작전"
 ARI_permanent_anti_trinity_military_operation_trigger: "§Y아리우스§!의 §R총력전§!이 시작됐습니다. §Y[TRM.GetNameWithFlag]§!를 항복시킬 때까지 영구적으로 발동되는 이 작전명령은 시간이 지날수록 §R지속적§!으로 §Y불이익§!이 증가합니다. §Y아리우스 공의회 개최§! 중점을 완료 시 §R지속적§!으로 증가하는 §R불이익§!이 사라집니다.\n\n§Y사단 조직력§!이 매 결정 주기마다 §R[?ARI.ARI_PATMO_idea_monthly_army_org_factor_increase|%1]§!씩 §R-90%§! 까지 §R감소할 것입니다§!.\n\n"
 ARI_permanent_anti_trinity_military_operation_tt: "§Y$ARI_permanent_anti_trinity_military_operation$§! 변동치:"
 ARI_decision_permanent_anti_trinity_military_operation: "전진하는 유령"
 ARI_decision_permanent_anti_trinity_military_operation_desc: "모든 트리니티와, 심지어 아리우스마저 불태우더라도 완수되어야 하는 우리들의 복수극이 울려퍼지고 있습니다. 모든 아리우스 학생과 스러져간 아리우스 분교의 역사가 외치는 비명을 저들에게도 들려줄 시간입니다. 우리가 실패하더라도 저들에게 복수를 안겨줄 것입니다. 어떤 방식이던지.\n\n현재 사단 조직력: §R[?ARI.ARI_PATMO_idea_army_org_factor|%+1]§!\n§Y사단 조직력§!이 매 결정 주기마다 §R[?ARI.ARI_PATMO_idea_monthly_army_org_factor_increase|%1]§!씩 §R-90%§! 까지 감소할 것입니다."
 ARI_mission_permanent_anti_trinity_military_operation: "§8사그라드는 불꽃§!"
 ARI_mission_permanent_anti_trinity_military_operation_tt: " 사단 조직력: §R불이익§!이 §G사라집니다§!."
 ARI_mission_setback_reinforcement: "§p차질 발생§!"
 ARI_mission_setback_reinforcement_tt: "매 결정 주기마다 감소하는 §Y$MODIFIER_ARMY_ORG_FACTOR$§!가 §R-2.0%§!만큼 §R증감§!"
 ARI_mission_goal_achievement_failure: "§R계획 실패§!"
 ARI_mission_goal_achievement_failure_tt: "매 결정 주기마다 감소하는 §Y$MODIFIER_ARMY_ORG_FACTOR$§!가 §R-5.0%§!만큼 §R증감§!"

######
 ARI_reinhard_heydrich_category: "라인하르트 하이드리히의 활동"
 ARI_reinhard_heydrich_category_desc: "라인하르트 하이드리히는 독일 친위대의 상급집단지도자이자 보안국장입니다. 그리고 그는 현재 아리우스에서, 다시 한번 독일의 부활을 꿈꾸고 있으며 그 과정에서는 아리우스와 적극적으로 협력할 수 있습니다. 마지막 국가사회주의의 불씨는 이곳에서 다시 한번 타오를 것입니다."
 ARI_reinhard_heydrich_1: "연설: 다시 한 번"
 ARI_reinhard_heydrich_1_desc: "누가 감히 총통 각하를 한 번 더 꿈꿀 수 있겠습니까? 말도 안 되는 일입니다. 우리는 그저.... 우리의 땅을 짓밟고 우리의 꿈을 산산히 부숴버린 저 망할 날개 달린 놈들을 안락한 요람에서 끄집어내 차가운 현실 속에 내던지는 것입니다."
 ARI_reinhard_heydrich_2: "독일 의용군단 모병"
 ARI_reinhard_heydrich_2_desc: "다시 한번 독일을 위해 싸워줄 게르만의 용사들을 라인하르트 하이드리히와 친위대의 이름으로 모집한다면, 충성스러운 애국자들을 불러모을 수 있을 것입니다."

 ARI_trinity_academy_dissolution: "트리니티 학원 해제"
 ARI_trinity_academy_dissolution_desc: "이제 장기간 트리니티 지역을 지배해온 트리니티 학원을 해제하고 우리들의 통치를 확립할 것입니다. 각종 상징물을 제거하고, 역사 교육에 트리니티가 행한 전쟁 범죄들을 포함하며, 3대 학원이라는 허울 좋은 위상을 무너뜨릴 것입니다."
 ARI_establishment_of_administrative_districts: "§Y[FROM.GetName]§!의 행정지역 확립"
 ARI_coring_this_trinity_state_in_progress_flag: " 현재 이 주 통합 중"

# 이후
# # 결정
 ARI_historical_records: "역사적 상징물 건축"
 ARI_historical_records_desc: "\n\n£GFX_decision_header_ARI_historical_records\n\n\n\n\n우리들의 기나긴 어두운 역사와 승리의 나날은 기록되어야 마땅합니다. 우리는 모든 국토에 걸쳐 트리니티의 상징물을 우리들의 상징물로 교체하고, 더 나아가 모든 것들을 기억할 수 있는 장소를 건축해 나아갈 것입니다."
