 MISAKI_desc: "§t이마시노 미사키§!는 공허합니다. 누가 보더라도 국가를 이끌 의지가 없는 체념한 지도자일 것입니다. 물론, 그건 미사키 스스로 생각하더라도 분명한 사실입니다. 그러기에 그녀는, 자기 자신을 위해서가 아닌 주변 사람들과 아리우스의 안정을 위해 내면을 깎아내며 통치를 이어가고, 계속 이어갑니다.\n\n§t이마시노 미사키§!의 §Y의지§!는 이러한 절망적인 통치를 반영합니다. 그녀가 비상정부의 서류에 서명하고 국가의 수명을 연장할수록 §Y의지§!는 필연적으로 깎여나갈 것이며, 한 번 소진된 §Y의지§!는 그 어떠한 수단으로도 다시 회복되지 않을 것입니다. 그녀가 억지로 §S국가의 생존§!을 이끌어낼수록, 그녀 자신은 점차 한계에 다다라 결국 모든 것을 놓아버릴 완벽한 §R파국§!에 가까워지게 될 것입니다.\n\n§S그녀는 아직 버티고 있습니다. 한계에 도달하기 전에, 모든 일을 마무리하십시오.§!\n\n§Y다음 문제에 도달하기까지: 35일§!"
