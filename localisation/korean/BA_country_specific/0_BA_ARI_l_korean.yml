 # 아즈사 승리
 ARI_duel_result.knife_fighting_success: "챙-! 날카로운 금속음과 함께 불꽃이 튀었습니다. 사오리의 단검이 아즈사의 목을 노리고 들어왔지만, 아즈사는 간발의 차로 칼날을 흘려내며 사오리의 품 안으로 파고들었습니다. 둔탁한 타격음과 함께 사오리가 비틀거립니다. 힘으로는 밀리지만, 속도에서는 아즈사가 앞섰습니다."
 
 # 아즈사 패배
 ARI_duel_result.knife_fighting_failure: "아즈사의 나이프가 사오리의 방어를 뚫으려 했지만, 그것은 노련한 리더가 파놓은 함정이었습니다. 사오리는 아즈사의 손목을 낚아채 비틀며 그대로 바닥에 메다꽂았습니다. \"가볍군.\" 사오리의 차가운 일갈과 함께 아즈사는 놓친 단검을 줍기 위해 몸을 날려야 했습니다."
 
 # 지형지물(스틱) 활용 승리
 ARI_duel_result.knife_fighting_stick: "사오리가 나이프로 찌르고 들어오는 순간, 아즈사는 바닥에 있던 날카로운 나무 조각을 집어 사오리의 손등을 찍어버렸습니다. \"큭?!\" 예상치 못한 흉기에 사오리가 처음으로 당황하며 단검을 잠깐 놓쳤습니다. 다급하게 새 단검을 뽑아들었지만, 아즈사는 그 빈틈 사이에 총격을 섞어 넣었습니다."
 
 # 불리한 나이프 파이팅 (사오리 기습)
 ARI_duel_result.disadvantageous_knife_fighting: "반응이 너무 늦었습니다! 엄폐물 뒤에서 튀어나온 사오리의 기습적인 제압에 아즈사는 저항조차 못 하고 밀려났습니다. 나이프를 꺼내기도 전에 복부에 강한 발차기를 허용한 아즈사가 고통스러운 신음을 흘립니다."

 # 아즈사의 거리 벌리기 성공 (gaining_distance)
 ARI_duel_result.gaining_distance: "아즈사는 사오리의 공격을 아슬아슬하게 피하며 뒤로 도약했습니다. 장애물 사이로 몸을 날려 사격 각을 확보합니다. 위협적인 근접전 상황에서 다시 사격전의 구도로 돌아갔습니다."
 
 # 아즈사의 거리 벌리기 (피해 입음) (gaining_distance_damage)
 ARI_duel_result.gaining_distance_damage: "거리를 벌리는 데는 성공했지만, 대가는 비쌌습니다. 물러나는 아즈사의 어깨를 사오리의 나이프가 스치고 지나갔습니다. 교복이 찢어지고 붉은 선혈이 배어 나옵니다."
 
 # 아즈사의 거리 좁히기 성공 (close_distance)
 ARI_duel_result.close_distance: "사오리의 사격이 빗발치는 가운데, 아즈사는 탄막을 뚫고 과감하게 전진했습니다. 당황한 사오리가 재장전하려는 틈을 타, 아즈사는 이제 사오리의 코앞까지 도달했습니다. 이제부턴 총보다는 주먹과 칼의 시간입니다."
 
 # 견제 사격 성공 (suppressive_fire)
 ARI_duel_result.suppressive_fire: "아즈사의 정확한 견제 사격이 사오리의 발을 묶었습니다. 쏟아지는 탄환 세례에 사오리는 혀를 차며 엄폐물 뒤로 머리를 숙여야 했습니다. 아즈사는 잠시나마 전장의 주도권을 쥐었습니다."
 
 # 견제 사격 무효 (suppressive_fire_no_effect)
 ARI_duel_result.suppressive_fire_no_effect: "아즈사가 방아쇠를 당겼지만, 두꺼운 엄폐물 뒤에 숨은 사오리에게는 닿지 않았습니다. 탄환이 책상에 박히는 소리만 공허하게 울릴 뿐입니다. 반대로 사오리가 쏘아댄 총알들은 모두 아즈사에게 적중하여 일방적인 피해를 보았습니다."

 # 치명적인 실패 (critical_failure)
 ARI_duel_result.critical_failure: "판단 착오입니다! 아즈사의 움직임이 꼬인 틈을 타 사오리의 묵직한 일격이 급소에 꽂혔습니다. 숨이 턱 막히고 시야가 점멸합니다. 뒤집을만한 기회를 만들지 못한다면 실수 한번에 이대로 지고 말 것입니다!"
 
 # 사오리에게 저격당함 (sniped_saori)
 ARI_duel_result.sniped_saori: "아즈사가 몸을 노출한 순간, 사오리의 헤일로가 번뜩였습니다. 타앙-! 피할 수 없는 궤적. 아즈사의 방탄판이 깨져나가며 강한 충격에 뒤로 날아갔습니다. 뼈가 울리는 고통이 전신을 지배합니다."
 
 # 아즈사의 신비 저격 성공 (azusa_sniping)
 ARI_duel_result.azusa_sniping: "아즈사는 숨을 멈추고 찰나의 순간에 모든 것을 걸었습니다. 엄폐물 밖으로 나온 사오리의 빈틈을 정확히 꿰뚫는 일격. 사오리의 어깨에서 피가 튀며 그녀의 자세가 무너졌습니다."
 
 # 어설픈 회피 (clumsy_evasion_...)
 ARI_duel_result.clumsy_evasion: "아즈사는 볼품없이 바닥을 구르며 공격을 피했습니다. 옷은 엉망이 되고 먼지를 뒤집어썼지만, 치명상은 면했습니다. 모양새는 중요하지 않습니다. 살아남는 것이 강한 것입니다. 하지만 방금의 무리한 회피로 체력을 조금 소진했습니다."

 # 샹들리에 추락 (chandelier)
 ARI_duel_result.chandelier: "아즈사의 총탄이 천장의 연결 고리를 끊었습니다. 거대한 샹들리에가 굉음과 함께 사오리의 머리 위로 추락합니다! 사오리는 다급하게 신비를 끌어올려 샹들리에를 격추했지만 쏟아지는 유리 파편의 비를 피하지는 못했습니다! 사오리는 큰 상처를 입고 거친 숨을 몰아쉽니다."

 # 샹들리에 자폭 (chandelier_self_destruction)
 ARI_duel_result.chandelier_self_destruction: "샹들리에가 떨어졌지만, 거리가 너무 가까웠습니다! 사오리뿐만 아니라 아즈사 역시 쏟아지는 유리 파편의 비를 피하지 못했습니다. 두 사람 모두 상처를 입고 피를 흘리며 거친 숨을 몰아쉽니다."
 
 # 스틱 던지기 (throwing_stick)
 ARI_duel_result.throwing_stick: "아즈사가 회심의 일격으로 던진 나무 조각은... 고작 한 걸음 정도 날아가고 땅에 떨어졌습니다. 사오리는 어이가 없다는 떨떠름한 표정을 짓고 있으나, 일단. 사오리가 다른 행동을 할 생각은 사라진 것 같습니다. 훌륭하게 전장의 시선을 장악했습니다! ...그러나 아즈사는 매우 부끄럽습니다."
 
 # 엄폐 성공 (cover)
 ARI_duel_result.cover: "아즈사는 재빠르게 몸을 날려 엄폐물 뒤로 숨었습니다. 사오리의 탄환이 아즈사가 있던 자리를 훑고 지나갔습니다. 안전한 위치를 확보한 아즈사는 다시금 전황을 살핍니다."
 
 # 숨 고르기 성공 (catching_breath)
 ARI_duel_result.catching_breath: "치열한 공방 속에서 아즈사는 잠시 호흡을 가다듬었습니다. 흐트러진 자세를 바로잡고, 탄창을 확인합니다. 냉정함을 되찾은 그녀의 눈빛이 다시 매섭게 빛납니다."
 
 # 숨 고르기 중 사오리 엄폐 (saori_cover)
 ARI_duel_result.saori_cover: "거리가 벌려지자, 사오리는 노련하게 아즈사보다 한발 빨리 엄폐물 뒤로 달려가 좋은 위치를 선점했습니다. 전술적 위치가 순식간에 압도적으로 불리해졌습니다."
 
 # 숨 고르기 중 사오리 엄폐 (catching_breath_saori_cover)
 ARI_duel_result.catching_breath_saori_cover: "아즈사가 숨을 고르는 사이, 사오리는 유령처럼 움직여 완벽한 엄폐 위치를 선점했습니다. 체력은 회복했지만, 전술적 위치는 사오리가 압도적으로 유리해졌습니다."
 
