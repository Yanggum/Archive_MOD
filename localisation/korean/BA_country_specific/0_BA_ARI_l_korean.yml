 ARI_imminent_d_day: "운명의 날"
 ARI_imminent_d_day_tt: "§R시간이 다다르면 우리는 트리니티를 향한 공습을 감행할 것이며, 그 공습의 결과는 우리가 준비를 얼마나 철저하게 했는지에 따라 갈릴 것입니다...§!"
 TRM_imminent_d_day: "예상일"
 TRM_imminent_d_day_tt: "§R시간이 다다르면 아리우스 분교는 우리를 향한 공습을 감행할 것이며, 그 공습의 결과는 우리가 대비를 얼마나 철저하게 했는지에 따라 갈릴 것입니다...§!"

 ARI_day_of_doom_idea: "파멸의 날"
 ARI_day_of_doom_idea_desc: "아리우스 분교는 일거에 상상을 초월하는 규모로 우리의 대비책을 넘어서 우리의 모든 현장 작전 지휘관을 향한 파멸적인 테러 행각을 저질렀습니다. 우리는 이로 인해 일시적으로 군사적 대응 능력을 완전하게 상실했으며, 이를 회복하기 위해 당장 총력을 다하고 아리우스 분교의 공격을 어떻게 해서라도 저지해야합니다!"
 ARI_day_of_doom_idea_1: "치욕의 날"
 ARI_day_of_doom_idea_1_desc: "아리우스 분교의 테러 행위는 우리 학원 전체를 충격에 빠뜨렸고, 학원의 비상 대책을 논하게 만들었습니다. 일시적으로 상실한 군사적 통제 능력을 회복하기 위해 우리는 총력을 다해야 합니다!"


 ARI_story_event.3.t: "부상을 입은 [THIS.GetName]"
 ARI_story_event.3.d: "아리우스 분교 방면의 병력을 지휘하던 [THIS.GetName] [THIS.GetRank](이)가 우리의 보호에도 불구하고 비겁한 아리우스의 테러 공습에 습격당했습니다. [THIS.GetSheHeCap]는 부상을 입었고 완전히 회복하려면 시간이 필요할 것 같습니다. 완쾌하기 전까지 평소의 능력을 발휘하지 못할 것입니다."

 ARI_news.3.t: "혼란에 빠진 트리니티"
 ARI_news.3.d: "오늘 새벽, 키보토스 최대의 학원인 트리니티 종합학원 전역에서 믿을 수 없는 규모의 동시다발적 폭발이 발생했습니다. 평화롭던 트리니티의 새벽은 찢어지는 사이렌 소리와 검은 연기로 뒤덮였습니다.\n\n아리우스 분교가 아주 오랜 시간 동안, 그 누구도 눈치채지 못하게 준비해온 이 공습은 치명적이었습니다. 정의실현부의 주요 거점과 지휘 통제실, 그리고 주요 보급로가 폭발과 함께 마비되었으며, 현장의 지휘관들과 연락이 두절되었습니다.\n\n트리니티의 방위 병력들은 패닉 상태에 빠졌습니다. 적이 언제, 어디서, 어떻게 공격했는지조차 파악되지 않는 상황에서 아리우스의 병력은 무방비 상태가 된 트리니티의 주요 거점들을 유령처럼 점거해나가고 있습니다. 이것은 완벽하게 계산된 전쟁의 서막이자, 트리니티가 겪게 될 가장 긴 하루의 시작입니다."
 ARI_news.3.a: "그들에게 공포를 알려줘라!"
 ARI_news.3.b: "즉각적인 비상사태를 선포하라!"
 ARI_news.3.c: "말도 안되는 일이 벌어졌다."

 ARI_news.4.t: "아리우스의 테러 공습"
 ARI_news.4.d: "아리우스 분교가 트리니티 종합학원을 향해 회심의 일격을 시도했으나, 정의실현부의 사전 대비 앞에 차단되었습니다.\n\n오늘 새벽, 트리니티의 몇몇 시설에서 산발적인 폭발과 공습 시도가 있었고, 아리우스 측은 대규모 혼란을 유도하려 했으나, 트리니티의 지휘 체계는 마비를 피했고 주요 지휘관들은 안전하게 보호받고 있었습니다.\n\n정의실현부의 냉철한 지휘 아래, 아리우스가 심어둔 폭발물들은 사전에 해체되었고 상당수의 침투 조원들은 포위망에 갇혔습니다. 비록 수 많은 시설에 피해가 발생하고 연기가 피어올랐으나, 학원의 기능은 정상적으로 작동하고 있습니다. 아리우스가 준비한 '비장의 카드'는 광범위한 피해를 입혔으나, 유의미한 피해에는 도달하지 못했고 이제 분노한 트리니티의 반격을 감당해야 합니다."
 ARI_news.4.a: "...부족했나."
 ARI_news.4.b: "즉각적인 반격을 개시하라!"
 ARI_news.4.c: "끔찍한 테러다."

 ARI_end_of_pacifism: "반전주의 종식"
 ARI_end_of_pacifism_desc: "우리가 아리우스 분교를 향해 선제공격을 가한 이상, 전선에서 어떤 일이 벌어지더라도 시스터후드의 속죄나 독일계의 동원 반대 운동, 그리고 아리우스가 선전한 반 게헨나-친 트리니티 프로파간다나 옛 공의회의 진실과 같은 비극적인 역사로 인해 트리니티 학생들은 우리의 전쟁에 협조적이지 않게 변했습니다.\n\n§Y트리니티§! 내부의 안정화를 위한 §G반전주의 종식§!이 시작되었습니다. 전쟁 지지 점수 §425점§!을 얻을 때 마다 §R불이익 하나§!를 §4제거§!할 수 있습니다.\n\n현재 우리의 점수는 ([?global.ARI_trinity_pacifism_var|G.0] 점) 입니다."
