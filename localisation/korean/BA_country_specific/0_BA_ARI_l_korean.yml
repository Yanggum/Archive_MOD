# Ideas
 BA_ARI_bitter_revanchism: "쓰디쓴 보복주의"
 BA_ARI_bitter_revanchism_desc: "아리우스 분교는 트리니티와 게헨나에 대한 복수를 위해 움직이는 하나의 기계와도 같습니다. 오래전, 트리니티를 하나로 통합하려 했던 공의회에서 아리우스는 정당한 이유와 근거를 들어 반대 입장을 밝혔습니다. 그러나 돌아온 것은 정당한 논박이 아닌, 분교를 향한 보복성 침공이었습니다. 우리는 통합된 트리니티의 힘에 맞설 수 없었고, 결국 깊은 어둠 속으로 숨어든 은둔자가 되었습니다.\n\n그러던 어느 날, 한 어른이 나타났고 우리는 그가 우리를 구원해줄 존재라 믿었습니다. 그는 분열된 아리우스를 하나로 묶고, 열렬한 지지를 받으며 학생회장에 올랐습니다. 그러나 그 믿음은 배신으로 돌아왔습니다. 그 어른은 학생들을 사람 아닌 도구처럼 다루었고, 그 과정에서 수많은 이들이 희생되었습니다. 트리니티에 대한 분노와 증오는 그들의 심장 깊이 주입되었고, 우리는 하나둘씩 살인 병기로 길러지게 되었습니다."
 BA_ARI_bitter_revanchism_ns_1: "복수의 끝자락"
 BA_ARI_bitter_revanchism_ns_1_desc: "아리우스 분교는 트리니티와 게헨나에 대한 복수를 위해 움직이는 하나의 기계와도 같습니다. 오래전, 트리니티를 하나로 통합하려 했던 공의회에서 아리우스는 정당한 이유와 근거를 들어 반대 입장을 밝혔습니다. 그러나 돌아온 것은 정당한 논박이 아닌, 분교를 향한 보복성 침공이었습니다. 우리는 통합된 트리니티의 힘에 맞설 수 없었고, 결국 깊은 어둠 속으로 숨어든 은둔자가 되었습니다.\n\n기나긴 세월이 흘러 분열한 아리우스가 통합되고, 우리들이 당당하게 트리니티의 심장을 찌르고 정당한 위치를 되찾았습니다. 우리들의 복수는 그 순간 방향을 잃었습니다. 게헨나에 대한 증오심이요? 본 적도 없는 이들을 어떻게 증오합니까? 게헨나를 싫어하는 이들이 많고, 우리와 그들은 공존할 수 없는 건 명백하나, 트리니티의 증오로 유지되던 우리의 목소리는, 에덴을 점령하고 깃발을 게양하고 연설을 하는 그 순간 끝을 맞이한 거나 마찬가지입니다.\n\n기나긴 복수의 망령의 손끝을 따라 움직여 게헨나마저 무너뜨리는 그때가 찾아온다면, 우리는 이제 복수가 아닌 다른 길을 찾아야 할 것입니다."
 ARI_undisturbed_wareconomy: "완전한 쇄국"
 ARI_wareconomy: "쇄국"
 ARI_pyeho_hakwon: "폐허 학원"
 ARI_pyeho_hakwon_desc: "트리니티의 추격을 뿌리치기 위해 모든 것을 버리고 도망친 대가는 싸늘한 폐허와 몇 남지 않은 학생이었습니다."
 ARI_pyeho_hakwon_remove_tt: "\n조건 충족시 제거: §Y30§!보다 많은 공장\n"
 ARI_pyeho_hakwon_1: "폐허 속의 등불"
 ARI_pyeho_hakwon_1_desc: "트리니티의 추격을 뿌리치기 위해 모든 것을 버리고 도망친 대가는 싸늘한 폐허와 몇 남지 않은 학생이었습니다.\n\n그러나 폐허 속에서 절망하지 않았습니다. 아리우스의 학생들은 그 속에서 발전기를 돌리고 탄약을 만들어내며 보복을 결심하고, 등불 아래에 조용히 숨어들어 있습니다."
 ARI_german_defectors_1: "독일 자유군단"
 ARI_german_defectors_2: "반트리니티 망명자"
 ARI_acceptance_of_exiles_tt: "§Y독일 자유군단§! 국민정신을 획득하고, §Y6 보병§! 대대 및 §Y공병§!, §Y수색§!, §Y포병§! 지원 부대가 주기적으로 창설됩니다.\n"
 ARI_german_defectors_1_tt: "§Y6 보병§! 대대 및 §Y공병§!, §Y수색§!, §Y포병§! 지원 부대가 주기적으로 창설됩니다.\n"
 ARI_final_offensive: "총결단전"
 ARI_final_offensive_desc: "속전속결로 트리니티를 몰락시킬 때입니다!"
 ARI_lantern_of_the_germanic: "독일의 등불"
 ARI_lantern_of_the_germanic_desc: "트리니티를 불사른다. 그 하나의 명제는 다른 모든 열악한 환경을 뒤로하고 그저 보복에 눈이 먼 독일인들을 불러 모으기에는 충분했습니다.\n\n신이 존재한다면 트리니티에는 없을 것이고, 우리는 그들에게 그저 한 방 먹일 것입니다."
 ARI_lantern_of_the_germanic_tt: "조건 충족시 제거: 주 §Y4§!개 이상 지배"
 ARI_economic_corruption: "경제 부패"
 ARI_economic_corruption_tt: "§Y$ARI_economic_structure_reform$§! 중점 완료시 제거"
 ARI_economic_structure_reform_tt: "추후 발생할 경제 문제를 예방합니다."
 idea_ARI_wartime_workshop_opening: "전시 생산작업장"
 idea_ARI_wartime_workshop_opening_desc: "약탈이나 전후 보복, 또는 친위대의 명령이나 민족주의적 동원, 그 어떤 방법을 써서라도 좋으니, 모든 가정과 단체들이 총기를 제작하도록 강제하고 있습니다."
 idea_ARI_wartime_workshop_opening_tt: "전쟁 종결시 제거: §Y[TRM.GetNameWithFlag]§! 측과 평화 중"
 ARI_student_resistance: "천사들의 저항"
 ARI_student_resistance_desc: "에덴이 빼앗긴 그 날, 트리니티의 학생들은 아리우스를 향해 저항하기로 결심했습니다."

# 중점
 ARI_justina_council_transfer: "유스티나 성도회 이관"
 ARI_justina_council_transfer_desc: "대전이로 사용처가 애매해진 유스티나 성도회를 게마트리아와 마담으로부터 양도받을 수 있을 것입니다. 우리는 옛 유스티나 성도회를 분석하고 그들의 전투 방식을 모방하는 것으로 군을 재편하는 첫 단추를 끼워낼 수 있습니다."
 ARI_our_own_method: "우리만의 방식"
 ARI_our_own_method_desc: "아리우스의 옛 전투 방식과 대전이 이전의 헤일로 보병 운용에 집중하는 것은, 우리의 정체성을 지킨다는 명분뿐만 아니라 우리가 가장 잘할 수 있는 일에 집중하는 것이기도 합니다."
 ARI_danzig_advisor_recruitment: "단치히 군 고문 등용"
 ARI_danzig_advisor_recruitment_desc: "대전이 이후로 상황은 변했고, 우리에게는 트리니티에 복수를 겨누는 또 다른 동료들이 생겼을지도 모릅니다. 우리는 단치히의 인맥을 통해 옛 독일의 군 장교 출신들과 접촉하여 교리를 건설할 것입니다."
 ARI_ancient_combat_analysis: "옛 전투방식 분석"
 ARI_ancient_combat_analysis_desc: "기록조차 희미해진 아리우스의 옛 기록들을 다시금 들춰냅니다. 잊힌 고문서 속에 잠들어 있던 과거의 전술들은 현대의 전장에서도 여전히 유효한 살상 능력을 증명할 것입니다. 우리가 누구이며, 우리가 어떻게 살아남았는지를 다시 기억해낼 시간입니다."
 ARI_fear_and_terror: "공포와 두려움"
 ARI_fear_and_terror_desc: "가장 효율적인 억제력은 압도적인 화력이 아닌, 뼛속까지 파고드는 공포입니다. 적들이 우리를 마주하기 전부터 전의를 상실하게 만드는 심리적 압박, 그리고 보이지 않는 곳에서 가해지는 무차별적인 공포는 아리우스가 가진 가장 강력한 무기 중 하나가 될 것입니다."
 ARI_council_acquisition: "성도회 습득"
 ARI_council_acquisition_desc: "게마트리아와 마담으로부터 이관받은 유스티나 성도회는 단순한 병력이 아닙니다. 그것은 아리우스가 트리니티의 정통성을 찬탈하기 위해 준비한 가장 날카로운 비수입니다. 이제 성도회의 인형들은 우리 아리우스의 명령에 따라 적들을 짓밟는 장기가 될 것입니다."
 ARI_frontline_fire_brigade: "전선 소방대"
 ARI_frontline_fire_brigade_desc: "전선의 구멍은 언제나 예고 없이 찾아옵니다. 우리는 어떤 극한의 상황에서도 즉각적으로 투입되어 상황을 반전시킬 수 있는 정예 기동 부대를 운용할 것입니다. 불길이 번지는 곳이라면 어디든, 아리우스의 이름 아래 그들을 소멸시킬 소방대가 달려갈 것입니다."
 ARI_ss_tactics_imitation: "친위대 전술 모방"
 ARI_ss_tactics_imitation_desc: "이 세계의 역사는 우리에게 기묘한 영감을 줍니다. 단치히를 둘러싼 옛 독일의 친위대가 보여준 대도시 시가전 전술은, 트리니티를 향한 우리의 유격전에 일부 부합합니다. 외부의 교리라 할지라도, 승리를 위해서라면 주저 없이 받아들여야 합니다."
 ARI_danzig_militia_recruitment: "단치히 민병대 모병"
 ARI_danzig_militia_recruitment_desc: "우리는 혼자가 아닙니다. 단치히의 좁은 골목길에서, 그리고 버려진 공업 단지에서 우리와 같은 눈을 한 현지인들이 존재합니다. 그들에게 총을 쥐여주고 아리우스의 증오를 공유한다면, 그들은 기꺼이 우리의 위대한 복수를 위해 목숨을 바칠 소모품이 되어줄 것입니다."
 ARI_production_facility_expansion: "생산설비 확장"
 ARI_production_facility_expansion_desc: "전쟁은 결국 철과 불의 대결입니다. 단치히에 남아 있는 낡은 공장들을 아리우스의 규격에 맞춰 재건하고, 탄환과 약품을 쉼 없이 쏟아내야 합니다. 우리의 복수가 물자 부족으로 멈추는 일은 결코 없어야 하니까요."
 ARI_arius_militarism: "아리우스 군국주의"
 ARI_arius_militarism_desc: "모든 학생이 전사가 되고, 모든 일상이 전쟁의 준비가 되어야 합니다. 타협과 평화라는 사치스러운 단어는 아리우스에 존재하지 않습니다. 오직 규율과 복종, 그리고 트리니티의 멸망을 향한 일념만이 우리의 삶을 지배할 것입니다. 아리우스를 위하여."
 ARI_chemical_warfare_preparation: "화학전 준비"
 ARI_chemical_warfare_preparation_desc: "총탄은 신체를 파괴하지만, 화학 가스는 영혼을 갉아먹습니다. 단치히의 화학 시설을 이용하여 개발된 가스들은 적들에게 숨 쉴 틈조차 주지 않는 죽음의 안개가 될 것입니다. 비겁하다는 비난은 승자만이 할 수 있는 말입니다."
 ARI_vulnerability_analysis: "취약 지점 분석"
 ARI_vulnerability_analysis_desc: "트리니티의 견고한 방어선에도 반드시 틈은 존재합니다. 정보부는 적의 보급로, 지휘 계통, 그리고 정신적인 나약함을 철저히 분석할 것입니다. 가장 아픈 곳을 가장 잔인한 순간에 찌르는 것이야말로 전쟁의 정수입니다."
 ARI_chemical_facility_expansion: "화학시설 확장"
 ARI_chemical_facility_expansion_desc: "실험실 수준의 생산량으로는 부족합니다. 단치히 외곽에 대규모 화학 단지를 조성하여, 대륙 전체를 뒤덮을 수 있는 양의 독가스를 비축해야 합니다. 죽음의 향기가 공기를 가득 채울 때, 우리의 복수는 비로소 완성될 것입니다."
 ARI_asymmetric_warfare: "비대칭전"
 ARI_asymmetric_warfare_desc: "적들이 정정당당한 정면 대결을 원한다면, 우리는 그 기대를 배신해 주어야 합니다. 테러, 사보타주, 기습. 정규군이 상상할 수 없는 모든 비열한 수단을 동원하여 적의 심장부를 마비시키십시오. 공평한 전쟁 따위는 존재하지 않습니다."
 ARI_conventional_warfare: "재래식 전쟁"
 ARI_conventional_warfare_desc: "특수 전술만으로는 영토를 점령할 수 없습니다. 우리는 현지 독일계 장교들의 조언을 받아들여 체계적인 군 체계를 구축할 것입니다. 아리우스의 증오에 독일의 조직력을 더한다면, 그 어떤 대군이라 할지라도 우리 앞을 가로막을 수 없을 것입니다."
 ARI_indirect_fire_support: "간접 화력 지원"
 ARI_indirect_fire_support_desc: "우리의 손을 더럽히지 않고도 적을 말살할 수 있습니다. 지평선 너머에서 날아오는 야포의 비는 적들에게 피할 수 없는 신의 징벌처럼 느껴질 것입니다. 쏟아지는 포탄의 굉음이야말로 아리우스가 트리니티에게 보내는 마지막 장송곡입니다."
 ARI_next_phase_preparation: "다음 단계의 대비"
 ARI_next_phase_preparation_desc: "우리의 군은 충분한 준비가 되었고, 이제 새로운 시대를 위한 기갑군을 편성하고 신시대의 전술을 받아들일 차례가 되었습니다. 세계 아리우스를 위한 정예 기갑군단이 준비될 것입니다!"

 ARI_danzig_militia_recruitment_tt: "단치히 민병대"
