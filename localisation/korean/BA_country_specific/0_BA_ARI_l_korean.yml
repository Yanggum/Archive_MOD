 ARI_duel_result.saori_action_cancel.knife_fighting_failure.4: "사오리가 자리를 박차고 거리를 벌리려는 시도는 아즈사의 접근으로 인해 실패했습니다. 거리는 벌려지지 않았으나, 아즈사는 무리하게 접근을 시도한 대가를 치러야 했습니다."
 ARI_duel_result.saori_action_cancel.knife_fighting_failure.2: "사오리가 시도한 저격은 아즈사의 빠른 접근으로 인해 실패했습니다. 그러나 아즈사는 무리하게 사선을 넘어 접근한 대가를 치러야 했습니다."
 ARI_duel_result.saori_action_cancel.suppressive_fire: "사오리의 행동은 아즈사의 거센 견제 사격에 가로막혀 온전히 이루어지지 못했습니다."
 ARI_duel_result.saori_action_cancel.cover: "사오리가 행동을 취하기 직전, 아즈사가 신속하게 엄폐물 뒤로 몸을 숨겨 사오리의 계획이 빗나갔습니다."
 ARI_duel_result.saori_action_cancel.azusa_sniping: "사오리의 결정적인 움직임은, 호흡을 가다듬은 아즈사의 서늘한 저격에 의해 완벽하게 차단되었습니다."
 
