#아리우스 아이디어
 BA_ARI_bitter_revanchism: "쓰디쓴 보복주의"
 BA_ARI_bitter_revanchism_desc: "아리우스 분교는 트리니티와 게헨나에 대한 복수를 위해 움직이는 하나의 기계와도 같습니다. 오래전, 트리니티를 하나로 통합하려 했던 공의회에서 아리우스는 정당한 이유와 근거를 들어 반대 입장을 밝혔습니다. 그러나 돌아온 것은 정당한 논박이 아닌, 분교를 향한 보복성 침공이었습니다. 우리는 통합된 트리니티의 힘에 맞설 수 없었고, 결국 깊은 어둠 속으로 숨어든 은둔자가 되었습니다.\n\n그러던 어느 날, 한 어른이 나타났고 우리는 그가 우리를 구원해줄 존재라 믿었습니다. 그는 분열된 아리우스를 하나로 묶고, 열렬한 지지를 받으며 학생회장에 올랐습니다. 그러나 그 믿음은 배신으로 돌아왔습니다. 그 어른은 학생들을 사람 아닌 도구처럼 다루었고, 그 과정에서 수많은 이들이 희생되었습니다. 트리니티에 대한 분노와 증오는 그들의 심장 깊이 주입되었고, 우리는 하나둘씩 살인 병기로 길러지게 되었습니다."

 BA_ARI_bitter_revanchism_3: "아리우스 분교"
 BA_ARI_bitter_revanchism_3_desc: "아리우스 분교는 트리니티와 게헨나에 복수를 위해 굴러가는 기계와도 같았습니다. 그리고 그 복수를 위한 기계는 지금 목표를 이루었습니다.\n\n옛 공의회에서 축출된 아리우스 분교는 당당히 공의회의 결과물인 트리니티 종합학원을 무너뜨리고 다시 한번 일어섰습니다. 과거의 패배를 미래의 승리로 다시 써 일어선 아리우스 분교는 두번 다시는 그늘로 숨어 들지 않을 것입니다."

 BA_ARI_bitter_revanchism_GER: "독일 국민보복주의"
 BA_ARI_bitter_revanchism_GER_desc: "재와 먼지로 뒤덮인 땅 위에서 다시금 독수리가 날아올랐습니다. 무너진 독일의 이상을 다시 한번 찬란하게 빛낼 위대한 조국이 지금 돌아왔습니다.\n\n폐허 위에서 부활한 새로운 독일 민족의 이상은 세계를 향해 큰 목소리로 외칠 것입니다. 이곳에 독일이 돌아왔노라고.\n\n지크 하일! (Sieg Heil!)"

 BA_ARI_tragedy: "비극의 서곡"
 BA_ARI_tragedy_desc: "아리우스를 이끌던 어른이 사라지자, 남겨진 것은 혼란뿐이었습니다. 권력의 공백을 메우기 위한 수많은 내전과 충돌이 벌어졌고, 아리우스의 스쿼드조차도 이 혼란에서 예외일 수 없었습니다. 그들 역시 처음에는 아리우스의 붕괴를 막기 위한 명분으로 쿠데타를 일으켜 정권을 장악했지만, 권력이라는 달콤한 열매를 맛본 순간부터 내부 갈등은 피할 수 없는 현실이 되었습니다.\n\n이 비극의 서막은 언제였을까요? 대전이 발생 이후, 하카리 아츠코와 조마에 사오리 간의 의견 충돌이 더욱 격화되면서부터였습니다. 아츠코는 아리우스의 미래를 위해 국경을 열고 트리니티와 관계를 개선하자고 주장했습니다. 반면, 사오리는 지금이야말로 지난 세기의 증오와 피의 부채를 되갚아야 한다고 외쳤습니다.\n\n두 사람의 입장은 하나의 조직 안에서 공존하기엔 너무나 달랐고, 이 갈등은 점점 아리우스 전체를 집어삼킬 기세입니다. 과연 이 균열은 언제쯤 봉합될 수 있을까요? 아니면, 그 결말은 또 다른 붕괴일 뿐일까요?"

 ARI_manpower: "아리우스 스쿼드"
 ARI_make_collapse: "초토화된 수뇌부"
 ARI_make_collapse_desc: "좋게 말하면 살아남았지만, 다르게 말하면 목숨만 건졌습니다. 현재 티파티의 수뇌부는 트리니티를 통제하고 지휘할 만큼 온전한 상태가 아니며 온전한 상태로 복구하기 까지 꽤나 긴 시간이 필요할 것 입니다."
 ARI_vanitas_vanitatum_idea: "허무주의"
 ARI_from_end_to_end_idea: "종말 공격 전술"

 ARI_parasitic_economy: "기생 경제"
 ARI_parasitic_economy_desc: "이 국가의 경제는 다른 국가의 경제 체제에 기생하여 동작합니니다."
 ARI_parasitic_economy_tt: "\n조건 충족시 제거: §Y20§!보다 많은 공장 또는 §Y[TRM.GetNameWithFlag]§! 미존재\n"

 ARI_anti_trinity_production_front: "생산 투쟁"

 ARI_labor_union_within_the_government: "정부 내 노동조합"

 ARI_polish_arian_treaty_idea: "비밀 조약"

 ARI_new_beginning_of_history_idea: "아리우스 교육과정"

 ARI_student_resistance: "천사들의 저항"
 ARI_student_resistance_desc: "에덴이 빼앗긴 그 날, 트리니티의 학생들은 아리우스를 향해 저항하기로 결심했습니다."
 
 ARI_military_government_establishment_idea: "트리니티 군정청"
 ARI_military_government_establishment_idea_desc: "트리니티 학생들의 테러 공작에 대응하고 더 손쉬운 통제를 위해 수립된 군정청입니다."

 ARI_political_landscape_changes: "공통점을 찾아서"

 ARI_german_leadership: "독일 내무부"
 ARI_exercise_of_executive_orders_tooltip: "§Y$ARI_german_leadership$§! 국민정신을 획득하고, §Y우리§!와 §Y우리의 동맹국§!이 §Y구 독일§!의 주를 하나씩 점령할 때마다 경찰들로 구성된 사단이 창설될 것입니다."
 ARI_german_leadership_tt: "§Y6 민병§! 대대 및 §Y수색§! 지원 부대가 §Y우리§!와 §Y우리의 동맹국§!이 §Y구 독일§!의 주를 하나씩 점령할 때마다 창설됩니다."

 ARI_arian_liberation_army: "아리우스 해방군" 
 ARI_anti_trinity_national_liberation_army: "반트리니티 민족해방군"

 ARI_nazi_party: "국가사회주의 독일 노동자당"
 ARI_nazi_party_desc: "국가사회주의 독일 노동자당은 대전이 이전 독일국이라는 강대한 국가를 지배하던 정당입니다. 그러나 대전이 사건이 벌어진 이후, 독일은 트리니티와 게헨나라는 두 학원의 주도로 키보토스에 의해 멸망했습니다. 베를린과 함께 총통을 비롯한 독일의 인재들이 모조리 사라진 이후, 이들은 깊은 지하로 몸을 숨겼습니다.\n\n그리고 아리우스 분교의 폐허에서, 트리니티와 게헨나를 증오한다는 공통점 아래에 다시 이들이 몸을 드러냈습니다. 이제 나치당과 아리우스 분교는 서로 손을 잡고 트리니티와 게헨나에 대항하는 거대한 투쟁을 준비하고 있습니다."

 ARI_german_reconstruction_government: "재건정부"
 ARI_german_reconstruction_government_desc: "독일 재건정부는 트리니티와 게헨나를 비롯한 여러 이계의 존재들과의 전쟁에서 황폐화된 국토를 재건하는 역할을 맡고 있습니다."

 ARI_crackdown_on_anti_government_activities: "반정부 활동 단속"

 ARI_land_reconstruction_project: "국토 재건 사업"

