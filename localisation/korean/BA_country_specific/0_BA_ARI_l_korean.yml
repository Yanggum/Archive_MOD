 ARI_operational_planning_category: "화학적 공격"
 ARI_operational_planning_category_desc: "우리의 적은 강력합니다. 적이 예상하지 못한 시점에 몰아칠 공격 작전을 계획하고, 적 방어선의 약점을 공략해 전선을 무너뜨릴 기습 효과를 얻어내야 하며, 적들보다 더 잔혹한 무기를 사용해야만 승리할 수 있을 것입니다."
 ARI_chemical_warfare_modifier: "화학전"
