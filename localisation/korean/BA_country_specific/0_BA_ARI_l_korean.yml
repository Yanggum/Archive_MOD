#이벤트
 ARI_event.1.t: "수도 이전 문제"
 ARI_event.1.d: "대충 수도 옮길건지 골라야 한다는 내용"
 ARI_event.1.a: "에덴으로"
 ARI_event.1.b: "그냥 이대로"

 ARI_event.2.t: "제2차 공의회"
 ARI_event.2.d: "이전의 부정했던 제1회 공의회를 만회하고자 열린 '공정한' 제2차 공의회의 결과, 삼위일체론은 부정되었으며 아리우스파 이외의 모든 분파가 이단으로 지정되었습니다."
 ARI_event.2.a: "완벽해"

 ARI_event.3.t: "아리우스 학생의 이탈"
 ARI_event.3.d: "아리우스 스쿼드가 잠깐 자리를 비운 사이, 바실리카의 인원들이 상당수가 사라졌습니다. 갑자기 사라진 전 지도자, 베아트리체의 소행으로 보입니다."
 ARI_event.3.a: "마담, 거기 계셨군요."

 ARI_event.4.t: "공격받은 스쿼드"
 ARI_event.4.d: "베아트리체의 포위를 풀고 돌아온 아리우스 스쿼드를 같은 아리우스 학생으로 보이는 집단이 습격했습니다. 이들은 분명 베아트리체와 관련이 있는 것으로 보입이며 하카리 아츠코를 노리고 있는 것 같습니다. 이들의 목적은 로열 블러드의 확보가 분명합니다.\n\n또한 아리우스 분교의 상당한 인물이 베아트리체의 명령을 받고 따르는 것으로 추정됩니다.\n\n아리우스 분교 내에 얼마나 깊게 베아트리체의 손길이 뻗혀있는지 파악이 되지 않습니다."
 ARI_event.4.d_2: "아리우스 스쿼드는 긴 시간 동안 베아트리체의 추적대에게서 도주하고 있습니다. 비록 베아트리체의 만행을 밝혀낸 덕에 다수의 아리우스 학생들은 우리에게 지원을 보태주고 있으나, 베아트리체의 계책과 지속되는 혼란 유도와 내분을 반복하며 스쿼드와 모든 아리우스 학생들은 전부 지쳐가고 있습니다\n\n아리우스 분교의 모두는 이제 서로를 아무도 믿을 수 없게 되었습니다. 베아트리체의 영향력은 시간이 지날 수록 약화되고 있으나, 이 상황대로면 영향력이 온전히 사라지기 전에 아리우스 분교가 패배할 것입니다..."
 ARI_event.4.d_3: "아리우스 분교는 더 이상 내분을 이겨낼 수 없을 것입니다...물자도, 보급도 모든 것이 부족합니다. 심지어 베아트리체를 따라나서지 않은 아리우스 학생들도 우리에게 등을 돌리고 있습니다. 모든 것이, 무너지고 있습니다.\n\n아리우스 분교에서는 여전히 서로를 불신하고 물어뜯고 있습니다. 이제는 분교의 멸망을 막기 위해서라도. 베아트리체의 승리를 인정해야 할 지 모릅니다..."
 ARI_event.4.a: "이걸 원한게 아니야."
 ARI_event.4.b: "..."

 ARI_event.5.t: "종막, 그리고 새로운 시작"
 ARI_event.5.d: "아리우스 분교. 오직 증오, 분노, 경멸, 혐오가 뒤섞인 곳.\n트리니티가 종합학원으로 되기 전, 다른 트리니티 분파들과 경전의 해석이 조금 다를 뿐 크게 다를 것 없는 분교였다. 그러나, 제1 공의회에서 분교들을 합쳐 대형 학원으로 만들자는 것에 반발하다 결국 이단으로 지정된 불우한 학원이었다.\n자신들의 예배당마저 빼앗긴 그들은 총학생회장조차 모르는 곳으로 떠나버렸고 긴 내전을 거듭했다. 그러던 와중, 베아트리체가 아리우스에 오게 되고, 그녀는 학생들이 가진 부의 감정을 이용해 거짓과 기만으로 그들을 지배했다. 내전이 끝난 이후로도 그녀의 지배는 계속되었다.\n'어른'은 '아이'들을 지배하고 착취하여, 포식했다.\n\n그리고, 아리우스 분교는 다른 학원들과 마찬가지로 대전이를 겪었다.\n베아트리체는 대전이 직후 학원을 빠져나가 게마트리아로 돌아갔으나, 외부의 소식을 알 수 없던 아리우스 분교의 학생들은 상황을 제대로 파악할 수 없었다.\n\n그러나 아리우스 학생들도, 긴 시간 동안 베아트리체가 모습을 드러내지 않는 것을 눈치 챌 수 밖에 없었고, 아리우스 스쿼드는 그 누구보다 이 것을 빠르게 눈치채었다.\n\n그러나, 마담이 없으면 우리는 뭘 할 수 있지?"
 ARI_event.5.a: "우리는 길을 잃었다."

 ARI_event.6.t: "시끄러운 도로변"
 ARI_event.6.d: "아리우스를 떠나 '단치히' 라고 불리는 이곳을 탐사하기 시작한지 얼마 지나지 않아 소녀와 동료들은, 그 시기에 맞는 사복 차림으로, 이곳 단치히에서 벌어지고 있는 소란스러운 군중들을 향해 다가갔다. 리더로 보이는 수염을 길게 기른 남자가, 여긴 뭐하러 왔냐는 표정으로 그녀를 바라보았다.\n\n"무슨일입니까, 무슨 일로 단체로 모여서 화를 내고 계신겁니까?"\n"보면 모르냐? 총파업중이다! 우리가 일한 만큼의 대가를 받지 못해서 이러고 있는 거지!"\n\n소녀는 무표정으로, 남자를 바라보았다. 일한 만큼의 대가를 받지 못해 이런다라, 도서관에서 읽은 대로라면, 저들은 '노동 조합'일 것이다. 노동자들의 정당한 권리와 대가를 요구하는 그런 집단, 소녀는 공허한 눈빛으로, 말없이 그를 바라보았다.\n\n"원하시는 대가가, 사람답게 사는 것입니까?"\n"그래, 국가 비상사태인가 뭔가를 선포한 이후부터 지금까지 임금이 체불되고 있다고!"\n\n"그럼 이만 비켜, 꼬맹이"\n남자는 소녀를 한손으로 밀치면서 말했다.\n\n모든 것은 헛되고 헛되거늘, 사람답게 살기 위해서라, 참으로 우스웠다. 원래대로라면 이런 상황에도 물러나지 않았겠지만, 지금은 현지인들을 최대한 자극하지 말라는 명령이 떨어졌다. 소녀는 후속 조치를 취하지 않았다. 이제 다음 임무를 수행해야 했다."
 ARI_event.6.a: "아직은, 잘 모르겠군."

 ARI_event.7.t: "정장 차림의 남자"
 ARI_event.7.d: "'단치히' 탐사가 시작된 이후, 아리우스 학생들은 도로 광장에서 연설하는 정장 차림의 남자를 보았다. 그 남자는 거의 고함에 가까운 소리를 내며 연설을 하고 있었다.\n\n그의 연설이 끝나자 학생들은 남자를 찾아가 몇 가지 질문을 던졌다.\n\n"무엇을 위해서 연설하고 계신겁니까?"\n"흠, 복장을 보아하니 자네들도 트리니티인가 뭔가하는 곳에서 온건가?"\n트리니티, 그 저주받을 이름이 그들에게서 나오자 아리우스 학생들은 당황에 빠졌다.\n\n"반응을 보니 아닌거 같군, 그래. 그럼 말해줄 수 있지. 나는 독일인을 모아, 독일인의 조국을 세울껄세."\n"독일인의...조국 말입니까?"\n"그래 저 망할 폴란드 놈들이 사라져서 좋아했더니, 독일이 트리니티라는 무슨 이상한 놈들한테 멸망하다니! 빌어먹을!"\n남자는 말을 하다 분노에 빠져서 잠깐 동안 허공에 화를 내었다. 아리우스 학생들은 그 행동을 보며, 깊은 생각에 빠졌다."
 ARI_event.7.a: "우리와...비슷한가?"

 ARI_event.8.t: "하카리 아츠코의 투항"
 ARI_event.8.d: "금일 오전 2시, 하카리 아츠코가 더이상의 저항은 무의미하다는 말을 내걸며 백기를 들고 베아트리체에게 투항하기로 결정했습니다.\n\n아츠코가 투항한 직후, 베아트리체를 따르는 분교의 학생들은 모두 철수했고, 아리우스 스쿼드는 다시 분교의 최상층으로 복귀해 업무를 시작할 수 있었습니다...한 명만 빼고요"
 ARI_event.8.a: "..."

 ARI_event.9.t: "베아트리체의 복종 요구"
 ARI_event.9.d: ""
 ARI_event.9.a: "우리는 더이상 당신을 따르지 않아!"
 ARI_event.9.b: "다시 돌아오신것을 환영합니다. 마담."

 ARI_event.10.t: "아리우스 스쿼드의 패주"
 ARI_event.10.d: "베아트리체의 사주를 받은 습격에 의해 아리우스 스쿼드는 심각한 피해를 입고 아츠코를 넘겨준 채 퇴각할 수 밖에 없었습니다.\n\n베아트리체의 명령을 따르는 학생들은 이내 분교를 떠나 마담의 세력에 합류하였기에, 아리우스 스쿼드는 다시 분교의 최상층에 올라올 수 있었습니다."
 ARI_event.10.a: "...!"

 ARI_event.11.t: "폭발한 에덴의 시가지"
 ARI_event.11.d: "화학 물질 운송 실패로 추정되는 거대한 폭발 사고가 트리니티의 심장, 에덴에서 일어났습니다."
 ARI_event.11.a: "좋은 징조는 아니야"

 ARI_event.12.t: "실종당한 시민들"
 ARI_event.12.d: "트리니티 지역 내에 있는 시민들의 수가 확연하게 적어진 것을 정의실현부가 발견했습니다. "
 ARI_event.12.a: "우리 학원에서 빠져나갔어"

 ARI_event.13.t: "고조된 저항"
 ARI_event.13.d: "시민들이 수상한 움직임을 보이는 것 같다는 제보가 티파티에 도착했습니다."
 ARI_event.13.a: "위험해."

 ARI_event.14.t: "발각당한 첩보 공작"
 ARI_event.14.d: "트리니티 침투 작전을 수행중인 우리 공작대의 꼬리를 트리니티가 찾아낸 것 같습니다. 우리가 이대로 작전을 강행한다면 트리니티는 즉시 우리를 향해 침공을 가해 올 것이 분명하기에, 한 동안 작전을 중단해야 할 것 같습니다."
 ARI_event.14.a: "한동안 몸을 사려야겠군."

 ARI_event.15.t: "아리우스 분교의 첩보 공작"
 ARI_event.15.d: "트리니티 종합학원을 향한 첩보 공작이 과거 우리를 피해 도망친 아리우스 분교에서 시작되었다는 내용의 믿을 수 없는 보고서가 오늘 티파티에 도착했습니다. 이 보고서에 따르면 아리우스 분교는 대전이 이전부터 트리니티에 대한 복수를 기획해 온 것으로 추정되며 대전이 이후 우리 학원의 불안을 파고들어 혼란을 가중시켜 온 것으로 보입니다."
 ARI_event.15.a: ""오늘, 트리니티는 공격받았습니다.""

 ARI_event.16.t: "아리우스 분교의 처우"
 ARI_event.16.d: "기나긴 밤 이후, 독일 내 아리우스 분교의 모든 영향력은 제거되었습니다. 이제 아리우스 학생들의 처우를 결정해야 합니다. 이들은 독일의 수복을 도운 공로가 있으니, 자치구를 만들어줄지, 아니면 독일의 역사를 위해 이들을 제거할지 선택할 수 있습니다."
 ARI_event.16.a: "단치히를 아리우스 자치구로 재편해라."
 ARI_event.16.b: "아리우스 스쿼드를 제거해라."

 ARI_event.17.t: "수도 이전"
 ARI_event.17.d: "우리는 기나긴 핍박 속에서 일어나 가증스러운 트리니티를 무너뜨리고 아리우스 종합학원을 선포하는 것에 성공했고, 아리우스 분교가 거대한 종합학원으로 재편됨에 따라 아리우스의 수도를 옮기자는 의견이 나타나고 있습니다."
 ARI_event.17.a: "에덴."
 ARI_event.17.b: "옮길 필요가 있나?"

 ARI_event.18.t: "베를린 군사 재판: 티파티"
 ARI_event.18.d: "우리가 트리니티에게 항복을 받아낸 이후, 그들의 수도 에덴을 옛 이름 베를린으로 개칭하는 것으로 베를린 군사 재판이 시작되었습니다. 첫 번째로 재판을 받게 된 이들은 트리니티의 지도부인 티파티입니다. 이들은 트리니티 종합학원의 지도부로써 우리의 긴 전쟁 속 언제나 우리의 적이었던 인물들입니다."
 ARI_event.18.a: "목을 매달아라!"
 ARI_event.18.b: "무기 징역을 선고하지."

 ARI_event.19.t: "베를린 군사 재판: 동아리"
 ARI_event.19.d: "두 번째 재판은 트리니티 종합학원을 구성하던 동아리들에게 돌아갔습니다. 이들은 대부분 트리니티 정권에 적극적으로 협조하였으며 트리니티 종합학원의 전쟁 수행을 보조하는 역할을 수행하였습니다."
 ARI_event.19.a: "책임자를 총살하고 전부 체포해라"
 ARI_event.19.b: "책임자를 잡아들이고 부원들은 재교육시켜라."

 ARI_event.20.t: "베를린 군사 재판: 학생들"
 ARI_event.20.d: "세 번째 재판은 트리니티 종합학원의 일반 학생들에게 돌아왔습니다. 이들은 대체로 트리니티의 전쟁 수행에 중립적이나, 트리니티 정권을 옹호하고 전쟁 수행을 묵과한 책임이 있습니다."
 ARI_event.20.a: "협력자들을 모조리 처형하거나 수감해라."
 ARI_event.20.b: "내부 고발을 적극적으로 받아라."
 ARI_event.20.c: "최종 해결책에 서명한다."

 ARI_event.21.t: "베를린 군사 재판: 독일 국민"
 ARI_event.21.d: "네 번째 재판은 불편한 일이지만, 독일의 국민들에게 돌아갔습니다. 이들의 대부분은 트리니티에 대한 반감이 있었으나, 미소노 미카의 집권 이후 트리니티의 지도부가 내세운 가짜 국가사회주의에 선동당해 트리니티 정권을 옹호하는 이들이 다수 생겨났습니다."
 ARI_event.21.a: "...배신자들을 모조리 잡아들여라."
 ARI_event.21.b: "...없던 일로 하지."

 ARI_event.22.t: "군사 재판의 끝"
 ARI_event.22.d: "마지막 대규모 군사 재판 이후 몇몇 사소한 재판만을 남겨두고 대부분의 군사 재판은 종료되었습니다. 한동안 군사 재판소는 여전히 작동할 것이지만, 기소자의 수는 며칠 전과 달리 확연하게 줄어들 것입니다."

 ARI_event.24.t: "$ARI_hakari_atsuko$ 발견"
 ARI_event.24.d: "아리우스 인근의 도시에서 $ARI_hakari_atsuko$가 쓰러진 채 아리우스 분교의 학생들과 함께 돌아왔습니다. 아츠코를 데려온 학생들은 정기적인 순찰을 돌다가 쓰러진 그녀를 발견했다고 말하고 있습니다.\n\n$ARI_hakari_atsuko$가 깨어난 이후, 그녀는 자신이 마담의 실험에 동원되었다고 말하며 어찌 된 일인지는 모르겠지만 눈을 떠보니 폐허가 된 성당에서 깨어났고, 아리우스 분교로 도망치다 쓰러진 것이라고 말해왔습니다."
 ARI_event.24.a: "베아트리체...!"

 ARI_event.25.t: "트리니티의 침공 징후"
 ARI_event.25.d: "우리가 트리니티를 향해 벌인 정치 공작이 들통난 것 같습니다. 트리니티 종합학원은 우리 분교를 향해 군대를 배치하기 시작했고, 곧이어 우리를 향한 침공을 감행해 올 것입니다.\n\n아리우스 분교의 모든 학생들은 트리니티를 향한 성전에 투입될 각오를 마쳤습니다."
 ARI_event.25.a: "전투 준비!"

 ARI_event.26.t: "최종 판결"
 ARI_event.26.d: "아리우스가 트리니티를 상대로 승리한 이후 시작된 대규모 공개 재판은, 결국 트리니티 지도부 전체의 사형과 모든 트리니티 학생의 영원한 복무라는 판결로 끝맺었습니다.\n\n트리니티의 아리우스 분교에 대한 거대한 탄압은 이제 영원히 종결되었으며, 두 번 다시는 트리니티 놈들이 일어서지 못하게 만들 것입니다."
 ARI_event.26.a: "위대한 승리다."

 ARI_event.27.t: "이계의 접촉"
 ARI_event.27.d: "자신들을 아리우스 분교라고 소개하는 이들이 우리에게 트리니티와 아리우스간 전쟁이 발발하면 우리에게 참전할 것을 제안해 왔습니다.\n\n이들의 말에 따르면 아리우스는 트리니티의 사회에 상당히 깊게 침투해 있으며, 이들은 트리니티에 대항하는 거대한 투쟁을 반복적으로 언급하고 있습니다."
 ARI_event.27.a: "좋아 한번 해보지."
 ARI_event.27.b: "이런 위험한 일에 뛰어들 수는 없다."

 ARI_event.28.t: "폴란드의 수락"
 ARI_event.28.d: "폴란드 정부는 비밀리에 이루어진 이 협정을 수락했으며, 폴란드는 이제 전쟁이 발발할 시 우리를 도와 참전할 것입니다."
 ARI_event.28.a: "좋다."

 ARI_event.29.t: "폴란드의 거절"
 ARI_event.29.d: "폴란드 정부는 너무 위험한 일이며, 아리우스에 대해 잘 모른다는 이유로 조약을 거절했습니다."
 ARI_event.29.a: "그래."

 ARI_event.30.t: "아리우스의 대트리니티 전쟁 돌입"
 ARI_event.30.d: "우리와 조약을 맺은 아리우스가 트리니티와의 전쟁에 돌입했으니, 우리는 아리우스를 지원해 대트리니티 공세를 벌일 준비가 되었습니다."
 ARI_event.30.a: "전쟁이다!"

 ARI_event.31.t: "폴란드의 조약 준수"
 ARI_event.31.d: "우리와 조약을 맺은 폴란드가 대트리니티 성전에 우리를 따라 참전하기로 결정했습니다. 트리니티를 무너뜨릴 최종 전쟁이 시작되었습니다!"
 ARI_event.31.a: "전쟁이다!"

 ARI_event.32.t: "폴란드의 영토 요구"
 ARI_event.32.d: "트리니티 전쟁이 끝나고 열린 2차 공의회에서 아리우스의 협력국이 병합되는 것이 결정된 이후, 폴란드는 전쟁 참전의 대가로 기존 폴란드 영토의 반환을 요구하고 나왔습니다."
 ARI_event.32.a: "이는 당연한 대가다."
 ARI_event.32.b: "그단스크를 제외하는 대신, 남부 영토 할양을 제안해라"
 ARI_event.32.c: "안 된다."

 ARI_event.33.t: "아리우스의 영토 반환"
 ARI_event.33.d: "우리 정부가 아리우스 분교에게 대전이 이전 폴란드 영토를 요구했고, 아리우스 정부는 이를 수락하여 우리에게 정당한 영토를 할양하기로 결정했습니다."
 ARI_event.33.a: "이는 당연한 대가다."

 ARI_event.34.t: "그단스크 대신 실레시아"
 ARI_event.34.d: "우리 정부가 아리우스 분교에게 대전이 이전 폴란드 영토 회복을 요구했으나, 아리우스 정부는 그단스크에는 아리우스에게도 중요한 트리니티 지역이 많다는 이유로 우리에게 대신 실레시아 할양을 제안했습니다."
 ARI_event.34.a: "나쁘지 않군."
 ARI_event.34.b: "우리는 해안에 대한 접근권을 포기하지 않는다."

 ARI_event.35.t: "폴란드 정부의 수락"
 ARI_event.35.d: "폴란드 정부는 우리의 실레시아 할양 안에 대해서 긍정적인 의사를 보냈고, 이내 해당 제안이 국가 수반 이름으로 서명되었다는 내용의 문서가 보내져 왔습니다.\n\n아리우스 분교와 폴란드간의 영토를 구분짓는 새로운 기준선이 생겨나게 되었습니다."
 ARI_event.35.a: "나쁘지 않군."

 ARI_event.36.t: "폴란드 정부의 거절"
 ARI_event.36.d: "폴란드 정부는 우리의 실레시아 할양 안에 대해서 폴란드는 1차대전 이후 보장받은 해안에 대한 접근 권리를 포기하지 않겠다는 이유로 우리 지도부의 제안을 거절했습니다.\n\n폴란드와의 전쟁이 임박한 것 같습니다."
 ARI_event.36.a: "이런."

 ARI_event.37.t: "아리우스 분교의 영토 분할 거부"
 ARI_event.37.d: "아리우스 분교는 우리 폴란드 정부의 대전이 이전 영토 요구를 거절했으며 트리니티의 모든 영토는 아리우스의 소유라며 강경한 입장을 밝혔습니다."
 ARI_event.37.a: "우리의 정당한 영토를 포기하지 않는다."
 ARI_event.37.b: "새로운 충돌은 피해야 한다."

 ARI_event.38.t: "[FROM.GetName]의 트리니티 협력 정부"
 ARI_event.38.d: "우리가 트리니티에 맞선 전쟁에서 승리한 이후 [FROM.GetName] 측은 점령지를 관리하기 위한 계획의 일환으로 현지 협력 정부를 수립하기로 했습니다.\n\n그리고 [FROM.GetName] 측은 현지 정부의 수립이 끝남에 따라 우리에게 트리니티의 영토를 반환해 달라는 요청을 하였으며, 우리는 이 요청에 응답해야만 합니다."
 ARI_event.38.a: "좋은 생각이군."
 ARI_event.38.b: "아니, 우리는 우리 점령지의 모든 것을 유지할 것이다."

 ARI_event.39.t: "[FROM.GetName]의 영토 반환 승인"
 ARI_event.39.d: "우리가 트리니티에 맞선 전쟁에서 승리한 이후 수립한 자치정부의 영토 반환을 요청하였고, [FROM.GetName]측은 해당 요청을 받아들여 우리의 자치국에 영토를 반환하였습니다."
 ARI_event.39.a: "좋아."

 ARI_event.40.t: "[FROM.GetName]의 영토 반환 거부"
 ARI_event.40.d: "우리가 트리니티에 맞선 전쟁에서 승리한 이후 수립한 자치정부의 영토 반환을 요청하였으나 [FROM.GetName] 측은 다른 생각이 있는 것 같습니다."
 ARI_event.40.a: "아쉬워도 어쩔 수 없지."

 ARI_event.41.t: "하카리 아츠코의 복권"
 ARI_event.41.d: "아리우스 분교가 단치히의 여러 시민과 접촉하고 나서, 큰 규모의 변화가 생겨나기 시작했습니다. 아리우스 분교의 학생들은 이제 이전과 같이 무차별적인 복수가 아닌 정당한 저항을 논하고 있으며, 폭력적인 아리우스의 교육 체계가 철폐되고 있습니다.\n\n이러한 상황 속에서 아리우스 분교의 상황을 전면적으로 개혁하고 트리니티와 접촉해 보아야 한다는 주장을 펼치던 아리우스 스쿼드의 부원인 하카리 아츠코의 주장이 재조명받기 시작했습니다."
 ARI_event.41.a: "너를 인정한다, 아츠코."

 ARI_event.42.t: "첫 선거"
 ARI_event.42.d: "아리우스 분교와 단치히 정부의 주도 아래에 연방이 수립된 이후, 얼마 지나지 않아 첫 선거가 진행되었습니다. 트리니티의 학생들과 여러 독일인은 선거를 제한받았으며 아리우스 분교와 단치히의 학생 시민들이 선거인단을 꾸렸습니다.\n\n그리고 선거가 끝난 이후 아리우스 스쿼드의 리더인 조마에 사오리가 당선되었으며, 불안 가득한 눈빛으로 바라보는 독일인과 트리니티 학생들, 그리고 열렬한 지지를 보내는 아리우스 학생들과 침묵하는 단치히 시민들의 앞에서 취임 연설을 진행하였습니다."
 ARI_event.42.a: "트리니티의 끝."
 ARI_event_42_tt: "§Y비동맹주의§! 정당 지지율의 §G60%§!가 §Y민주주의§! 정당 지지율에 추가됩니다."

 ARI_event.69.t: "경찰 여단 창설"
 ARI_event.69.d: "우리가 구 독일 영토를 수복하고 독일 경찰조직에게 행정 명령을 전달해 경찰 여단을 편성할 수 있었습니다. 경찰 여단이 이는 우리를 대신해 전장에 보내질 수 있는 완전한 군대로 조직될 것입니다."

