 ARI_fortress_arius: "성채 아리우스"
 ARI_fortress_arius_desc: "'성채 아리우스'는 아리우스의 기존 체제를 옹호하는 보수파가 아리우스가 지속적으로 확장되는 과정에 가지게 된 이데올로기입니다. 트리니티에 대한 가혹한 보복에 대한 거부와 옛 아리우스의 질서를 옹호하며 만들어진 이 이데올로기는 옛 질서를 새로운 방식으로 구현하는 걸 목표로 합니다."
 ARI_emergency_government: "비상정부"
 ARI_emergency_government_desc: "보수나 개혁을 나누며 실제 삶에 관심이 없던 이들은 이제 스스로를 파멸시키고자 하고 있습니다. 보수파의 친위 쿠데타 시도나 개혁파의 소수민족과 트리니티계를 향한 민중 봉기 시도는 사전에 차단되었으며, 이제 우리는 사오리에게 비상 정부를 승인할 것을 압박할 것입니다."
 ARI_approval_of_reformist_manifesto: "개혁파의 선언문 승인"
 ARI_approval_of_reformist_manifesto_desc: "공의회의 결과는 명백하고 우리의 운명은 확실합니다. 아리우스는 이제 달라져야 함이 분명해졌습니다. 낡고 구시대적인 방법에서 벗어나기 위한 첫 단초로, 우리의 정신적 지주인 아즈사는 직접 사오리에게 향후 아리우스의 미래를 결정할 선언문을 승인하도록 설득할 것입니다."

# # 이벤트
 ARI_3rd_council.1.t: "제3차 공의회: 개회"
 ARI_3rd_council.1.d: "단치히 공의회장의 거대한 홀을 채운 것은 열기나 함성이 아닌, 서늘할 정도로 완벽하게 통제된 침묵이었다.\n\n제3차 공의회의 진행 절차는 소름 끼칠 만큼 매끄러웠다. 의안 상정, 토론, 그리고 투표. 모든 과정이 사전에 조율된 톱니바퀴처럼 오차 없이 맞물려 돌아갔다. 부정 선거의 증거는 어디에도 없었다. 투표함은 투명했고, 개표 과정은 모든 참관인 입회하에 진행되었으며, 숫자는 거짓말을 하지 않았다. 그러나 바로 그 '지나친 투명함'이 개혁파 의원들을 미치게 만들고 있었다.\n\n\"이건 기만이야! 이렇게... 이렇게 조용할 수가 없다고! 이의 제기가 하나도 없는 게 말이 됩니까? 이건 죽은 의회나 다름없어!\"\n\n개혁파의 대변인은 넥타이를 풀어헤친 채 핏대를 세우며 고함을 질렀다. 그들의 주장은 '절차적 정당성'이 아닌 '감정적 거부감'에 호소하고 있었다. 그들은 회의장 뒤편에서 야유를 퍼붓거나 책상을 두드리며 '자유로운 토론'을 요구했지만, 정작 그들이 내놓은 대안은 중구난방이었고 서로의 이권 다툼으로 얼룩져 있었다.\n\n단상 높은 곳, 조마에 사오리는 그 혼란스러운 소동을 무감각한 눈으로 내려다보고 있었다. 그녀의 곁을 지키는 친위대는 미동조차 없었다. 사오리가 의사봉을 들자, 개혁파의 소란은 거대한 침묵의 벽에 부딪혀 무력하게 사그라들었다."
 ARI_3rd_council.1.a: "반대 의견은 사그라들었다."

 ARI_3rd_council.2.t: "제3차 공의회: 무질서한 퇴장"
 ARI_3rd_council.2.d: "\"이 선거는 무효야! 인정할 수 없어!\"\n\n단상 아래에서 고함이 터져 나왔다. 개혁파의 강성 의원이 떨리는 손으로 선거 무효 소송 서류를 허공에 흔들어댔지만, 사오리는 눈 하나 깜짝하지 않았다. 그녀가 의사봉을 두드려 '기각'을 선언하자, 개혁파 의원들 사이에서 사전에 약속된 듯한 구호가 터져 나와야 했다. 하지만 현실은 약속된 투쟁이 아닌, 촌극에 가까웠다.\n\n\"나가자! 이 더러운 독재의 소굴을 거부한다!\"\n\n몇몇 강성 의원들이 자리를 박차고 일어났지만, 정작 뒤따르는 이들은 절반도 되지 않았다. 이미 보수파의 압도적인 승리가 확정된 시점에서 공의회장을 나가는 것은 곧 정치적 생명의 끝을 의미했기 때문이다. 누군가는 눈치를 보며 엉거주춤 일어섰다 다시 앉았고, 누군가는 나가는 동료의 옷자락을 잡고 말리는 추태가 벌어졌다. 그들의 '조직'은 이미 내부에서부터 무너져 있었다.\n\n출입구로 향하는 그 무질서한 행렬 속에서, 시라스 아즈사는 침묵을 지키며 자신의 자리에 굳건히 앉아 있었다.\n\n\"시라스 아즈사! 뭐 하는 거야, 같이 나가야지!\"\n\"......\"\n\n동료의 재촉에도 아즈사는 고개를 저었다. 그녀는 도망치는 패배자가 되기를 거부했다. 비록 사오리의 방식에 동의하지 않더라도, 공의회장 밖으로 나가는 순간 아무것도 바꿀 수 없다는 것을 그녀는 알고 있었다. 아니, 어쩌면 저 지리멸렬한 패거리들과 섞이기 싫다는 경멸감 때문일지도 몰랐다.\n\n사오리는 텅 빈 좌측 좌석들과, 그 사이에 섬처럼 남은 아즈사를 잠시 응시했다. 그리고 마이크를 켰다.\n\n\"퇴장하고 싶은 자는 막지 않는다. 문을 열어 줘라.\"\n\n친위대가 문을 활짝 열자, 도망치듯 빠져나가는 개혁파의 뒷모습은 비참할 정도로 초라했다. 공의회장에 남은 것은 '완벽한 승자'인 사오리와, 패배를 직시하는 아즈사, 그리고 무거운 정적뿐이었다."
 ARI_3rd_council.2.a: "그들은 스스로를 불태우는가?"

 ARI_3rd_council.3.t: "제3차 공의회의 종료"
 ARI_3rd_council.3.d: "제3차 공의회의 결과가 발표된 직후, 당사에서 개혁파의 긴급 비상대책회의가 소집되었다. 그 이름은 거창했으나, 실상은 패잔병들의 책임 전가와 고성이 오가는 난장판에 불과했다.\n\n일부 강성 의원들은 지도부의 합의도 거치지 않은 채 독단적으로 작성한 '선거 원천 무효 선언문'을 들이밀었다. 그들은 사오리의 승리가 '보이지 않는 공포'에 의한 것이라 주장하며, 즉각적인 불복종 운동과 총파업을 촉구했다. 그러나 그 선언문이 낭독되는 순간조차 회의장은 하나로 뭉치지 못했다.\n\n\"지금 제정신이야? 이건 우리더러 다 죽으라는 소리라고!\"\n\n온건파 의원들은 강성파의 멱살을 잡으며 격렬하게 반발했다. 그들은 이미 법적으로 완벽하게 종료된 선거를 뒤집을 명분이 없음을 알고 있었다. 아즈사조차 불참한 이 회의에서, 펜대만 굴리던 자들이 외치는 '투쟁'은 공허했다. 누군가는 몰래 뒷문으로 빠져나갔고, 누군가는 사오리 측에 바칠 탄원서를 작성하기 시작했다.\n\n결국 자정을 넘겨 발표된 그들의 '불복 선언'은 키보토스의 정치 지형에 아무런 파동도 일으키지 못했다. 시민들은 그저 선거에 패배한 자들이 벌이는 최후의 추태로 여겼으며, 아리우스의 관료들은 코웃음조차 치지 않았다. 그 선언은 개혁파의 결집을 알리는 신호탄이 아니라, 그나마 남아있던 정치적 생명을 스스로 끊어버리는 유서가 되었다.\n\n조마에 사오리는 이 소식을 보고받고도 아무런 지시를 내리지 않았다. 스스로 무너져내리는 적을 굳이 타격할 필요는 없었으니까."
 ARI_3rd_council.3.a: "끝."

 ARI_3rd_council.4.t: "제3차 공의회: 개회"
 ARI_3rd_council.4.d: "단치히 공의회장의 창문이 밖에서 들려오는 거대한 함성 때문에 덜컹거렸다. 제3차 아리우스 공의회는 엄숙한 회의라기보다는, 차라리 통제 불능의 시장바닥에 가까웠다.\n\n개혁파 의원들은 '민의의 반영'이라는 명분을 내세워 공의회장 주변을 지지자들과 시위대로 포위시켰다. 보수파 의원이 발언대에 오를 때마다 밖에서는 엠프를 동원한 야유와 나팔 소리가 쏟아져 들어왔고, 안에서는 개혁파 의원들이 책상을 두드리며 발언을 방해했다. 그러나 진짜 문제는 소음 따위가 아니었다.\n\n\"자격 없는 자들이 회의장에 있다. 헌병, 당장 저들을 끌어내.\"\n\n의장석에 앉은 조마에 사오리가 싸늘하게 지시했다. 방청석과 투표 대기열에는 아리우스 학생이 아닌, 어설프게 아리우스 완장을 찬 트리니티 출신 주민들과 협력자들이 가득했기 때문이다. 하지만 헌병들이 움직이기도 전에 개혁파의 대표가 마이크를 가로채 소리쳤다.\n\n\"이 땅에 사는 모든 이가 곧 아리우스다! 의장은 낡은 혈통주의로 신성한 투표권을 제한하지 마라!\"\n\n그것은 뻔뻔스러운 억지였다. 그들은 '아리우스의 구성원'이라는 정의를 멋대로 해석하여, 자신들에게 표를 던질 외부인들을 트럭째 실어 나르고 있었다. 패배했던 트리니티계 파벌들은 이 혼란을 틈타 개혁파의 비호 아래 당당히 공의회장에 입성했다.\n\n사오리는 의사봉을 내리쳐 질서를 잡으려 했지만, 그녀의 제지는 수천 명의 함성과 '자유'를 외치는 선동 속에 무력하게 묻혀버렸다. 투표함은 검증되지 않은 표들로 흘러넘치고 있었고, 그 광경을 바라보는 사오리의 눈에는 혐오감이 서려 있었다. 이것은 공의회가 아니라, 숫자로 밀어붙이는 폭력이였다."
 ARI_3rd_council.4.a: "적어도 그녀의 눈에는 그렇게 비쳤다."

 ARI_3rd_council.5.t: "제3차 공의회: 질서"
 ARI_3rd_council.5.d: "공의회장은 폭발 직전의 압력밥솥과도 같았다. 개혁파 지지자들의 고함과 나팔 소리가 사방에서 울려 퍼졌고, 보수파 의원들은 그 소음에 포위된 채 고립되어 있었다.\n\n조마에 사오리는 의장석에서 천천히 회의장을 둘러보았다. 그녀의 시선이 머문 곳에는 더 이상 '강철 같은 군대'는 없었다. 보수파 의원들은 어쩔 수 없는 패배를 직감한 듯 담담하게 눈을 감고 있거나, 주먹을 꽉 쥐고 분을 삭일 뿐이었다. 이미 조직력은 무너졌고, 여기서 그녀가 의사봉을 집어던지며 판을 엎는다면 남는 것은 아리우스의 두 번째 내전과 학생들의 피뿐이었다.\n\n사오리는 마이크를 잡았다. 그녀의 목소리는 낮았지만, 소음 속에서도 기이할 만큼 또렷하게 울렸다.\n\n\"...결과는 확인되었다. 패배를 인정한다.\"\n\n개혁파 진영에서 환호성이 터져 나오려 했으나, 사오리는 말을 이었다.\n\n\"다만, 적어도 질서 있게 행동해라. 우리는 짐승이 아니다.\"\n\n그것은 패자의 비굴한 부탁이 아니라, 혼란을 혐오하는 지도자의 마지막 경고였다. 그러나 흥분한 개혁파의 군중 일부가 사오리를 향해 야유를 퍼부으려던 찰나였다.\n\n\"모두, 정숙.\"\n\n단상 아래, 가장 앞줄에 앉아있던 시라스 아즈사가 자리에서 일어나 손을 높이 들었다. 그녀가 뒤를 돌아 소란스러운 자기 파벌의 의원들과 시위대를 노려보자, 들끓던 소음이 찬물을 끼얹은 듯 잦아들었다. 아즈사는 승리의 도취감 대신, 무거운 책임감이 담긴 눈으로 사오리를 올려다보며 고개를 숙였다."
 ARI_3rd_council.5.a: "소란은 잦아들었다."

 ARI_3rd_council.6.t: "제3차 공의회의 종료"
 ARI_3rd_council.6.d: "폭풍 같았던 공의회의 소음이 썰물처럼 빠져나간 집무실에는 무거운 침묵과 저녁노을만이 길게 드리워져 있었다. 공기 중에 부유하는 먼지 하나하나가 보일 정도로 정적은 깊었고, 그 정적을 깬 것은 규칙적인 군화 소리였다.\n\n똑, 똑. 문을 두드리는 소리가 들렸지만, 대답을 기다리지 않고 문이 열렸다. 시라스 아즈사였다.\n\n조마에 사오리는 의자에 깊게 몸을 묻은 채, 문가에 선 옛 동료를 응시했다. 마지막으로 이렇게 둘이서, 총구가 아닌 눈동자를 마주 보며 서 있었던 적이 언제였던가. 곰팡이 핀 빵 한 조각을 나누며 서로의 등을 지켜주던 시절의 기억은 이제 거대한 책상과 산더미 같은 서류에 가려 희미하기만 했다. 아즈사의 어깨에는 더 이상 낡은 소총이 아닌, '개혁파의 정신적 지주'라는 무거운 짐이 얹혀 있었다.\n\n아즈사는 천천히 책상 앞으로 다가왔다. 그녀의 손에는 잉크가 채 마르지 않은 '공의회 선언문' 서류가 들려 있었다. 그녀의 입술이 달싹였다. 아마도 왜 이것이 필요한지, 왜 우리가 변해야 하는지, 사오리를 설득하기 위해 수십 번 연습했을 논리들을 쏟아내려는 것이리라.\n\n하지만 사오리는 아즈사가 첫 마디를 떼기도 전에 손을 뻗었다.\n\n\"이리 줘.\"\n\n짧고 건조한 한마디. 아즈사의 눈이 잠시 커졌으나, 사오리는 망설임 없이 서류를 가져가 서명란에 펜을 그었다. 사각거리는 펜촉 소리만이 두 사람 사이의 거대한 침묵을 가로질러 울려 퍼졌다. 사오리는 이미 알고 있었다. 시대가 변했고, 물결을 거스를 수 없다면 둑을 터주어야 한다는 것을.\n\n승인을 마친 서류가 다시 아즈사 쪽으로 미끄러져 갔다. 사오리는 자리에서 일어났다. 그녀는 아즈사에게 어떤 격려도, 비난도 하지 않았다. 지금은 서로에게 건넬 말이 '이해'가 아닌 '오해'를 낳을 뿐이라는 것을 직감했기 때문이다. 사오리는 굳어 서 있는 아즈사의 옆을 스쳐 지나가며, 짧게 덧붙였다.\n\n\"가라. 해야 할 일이 많을 테니.\"\n\n닫히는 문소리와 함께, 방에는 다시금 혼자 남겨진 아즈사와 서명된 서류만이 덩그러니 남았다."
 ARI_3rd_council.6.a: "감정의 골은 치료될 수 있는가."

 ARI_3rd_council.7.t: "모래성 위의 왕관"
 ARI_3rd_council.7.d: "집무실 창가에 기대어 선 시라스 아즈사는 문득, 책상 한구석에 놓인 결재 서류를 바라보았다. 조마에 사오리의 서명이 담긴 그날의 선언문이었다.\n\n지금 와서 돌이켜보면, 그날 아즈사가 느꼈던 감정은 승리의 환희가 아니었다. 그것은 차라리 허무함에 가까운 공포였다. 그녀는 사오리를 무너뜨리기 위해 수많은 논리와 명분, 그리고 '힘'을 준비해 갔었다. 하지만 사오리는 칼을 뽑기도 전에 너무나도 허무하게 그 모든 권한을 넘겨주었다. 마치 기다렸다는 듯이. 펜촉이 종이를 긁던 그 짧은 순간, 아즈사는 거대한 벽이 무너지는 소리 대신, 자신을 지탱하던 유일한 대적자가 사라졌다는 상실감을 느껴야 했다.\n\n그녀는 자신이 이끌고 온 무리를 떠올렸다. '개혁'이라는 달콤한 간판 아래 모여든 자들. 그들 중 진정으로 아리우스의 미래를 걱정하는 자가 과연 몇이나 될까. 법안의 허점을 이용해 투표권을 조작하자고 속삭이던 참모들, 광장에 모인 군중을 자극해 폭력을 유도했던 선동가들, 그리고 사오리가 물러나자마자 이권에 눈이 멀어 침을 흘리던 기회주의자들.\n\n아즈사는 그들의 탐욕스러운 손을 잡고 이 자리에 올랐다. 사오리의 방식이 '죽음'으로 향하는 길이라 확신했기에, 흙탕물을 뒤집어쓰더라도 '삶'으로 향하는 길을 열어야 한다고 믿었기에 선택한 차악이었다. 하지만 막상 그 자리에 앉아보니, 사오리가 견뎌왔던 침묵의 무게가 뼈저리게 느껴졌다.\n\n그날 사오리가 스쳐 지나가며 남긴 여백은 비어있는 것이 아니었다. 그것은 이제 아즈사가 감당해야 할, 질서가 무너진 세상의 혼란과 모순으로 가득 차 있었다. 그녀는 안도감과 죄책감, 그리고 형언할 수 없는 중압감이 뒤섞인 채로 서류 위의 서명을 손가락으로 가만히 쓸어보았다."
 ARI_3rd_council.7.a: "왕관을 쓴다는 것은, 찬란한 빛이 아니라 이토록 지독한 그림자를 짊어지는 일이었다."

 ARI_3rd_council.8.t: "제3차 공의회: 개회"
 ARI_3rd_council.8.d: "단치히 의사당의 공기는 숨이 막힐 듯 팽팽했다. 그것은 보수파의 침묵도, 개혁파의 소란도 아니었다. 서로의 목을 물어뜯기 직전의 맹수들이 내뿜는 살기에 가까웠다.\n\n중앙 통로를 기점으로 좌측과 우측은 완벽하게 갈라져 있었다. 보수파 의원들은 팔짱을 낀 채 상대를 벌레 보듯 노려보았고, 개혁파 의원들은 서류 뭉치를 무기처럼 쥐고 고성을 지르며 상대를 도발했다. 그들에게 이번 공의회는 '타협'이나 '논의'의 장이 아니었다. 상대방을 이단으로 몰아 파멸시키고, 자신들이 모든 권력을 독식할 수 있는, 합법을 가장한 사형장에 불과했다.\n\n의장석의 조마에 사오리와 개혁파의 대표 격으로 참석한 시라스 아즈사는 필사적으로 질서를 유지하려 애썼다.\n\n\"정숙! 인신공격은 불허한다!\"\n\"자리에 앉으십시오! 아직 발언권은 얻지 못했습니다!\"\n\n두 리더는 이 아수라장 속에서 최소한의 '선'을 지키려 했다. 하지만 비극적이게도, 사오리는 보수파의 상징이었고 아즈사는 개혁파의 깃발이었다. 그들이 아무리 이성을 호소한들, 의사당을 채운 탐욕스러운 늑대들은 그들을 자신들의 이권을 대변할 대리인으로만 소비하고 있었다.\n\n그 역겨운 아귀다툼 속에서, 사오리는 문득 구석진 자리에 앉은 이마시노 미사키와 눈이 마주쳤다.\n\n미사키는 싸우지도, 소리치지도 않고 있었다. 그저 턱을 괸 채, 텅 빈 눈으로 회의장 전체를 응시하고 있을 뿐이었다. 하지만 그 눈빛은 예전의 무기력함과는 달랐다. 그녀는 침 튀기며 싸우는 개혁파를 보고 있지도, 권위적인 보수파를 보고 있지도 않았다.\n\n그녀는 단상 위의 사오리와 아즈사를 포함한, 이 공간에 존재하는 '모든 것'을 지독한 혐오와 경멸의 눈빛으로 내려다보고 있었다. 마치 썩은 고기에 몰려든 파리 떼를 보는 듯한 그 서늘한 시선을 마주한 순간, 사오리는 등골이 서늘해지는 것을 느꼈다."
 ARI_3rd_council.8.a: "의사봉 소리가 다시 한번 울려 퍼졌지만, 이번에는 큰 의미는 없을 것 같다는 직감이 스쳤다."

 ARI_3rd_council.9.t: "제3차 공의회: 파토"
 ARI_3rd_council.9.d: "욕설과 고성이 뒤엉켜 의사당은 통제 불능의 아수라장이 되었다. 보수파 의원이 던진 명패가 개혁파 의원의 이마를 찢었고, 멱살잡이는 곧 집단 난투극으로 번지기 직전이었다.\n\n\"으, 으에... 제발, 제발 그만해요! 우리, 우리끼리 이러면 안 되잖아요...!\"\n\n츠치나가 히요리가 울먹이며 자리에서 일어나 소리쳤다. 그녀는 필사적으로 양쪽을 말리려 손을 휘저었지만, 거대한 증오의 소용돌이 속에서 그녀의 목소리는 모기 소리보다 작았다. 누군가 히요리를 거칠게 밀쳤고, 그녀가 바닥에 나뒹구는 순간이었다.\n\n**탕-!!**\n\n의사당의 높은 천장을 뚫을 듯한 날카로운 총성이 울려 퍼졌다. 순식간에 찬물을 끼얹은 듯 정적이 찾아왔다. 모든 시선이 총구가 들린 곳, 이마시노 미사키에게로 쏠렸다.\n\n미사키는 히요리를 일으켜 세우며, 먼지를 털어주었다. 그리고는 여전히 연기를 내뿜는 총구를 내리고 지독하게 건조한 눈으로 사오리와 아즈사, 그리고 멍하니 서 있는 의원들을 일별했다.\n\n\"시끄러워서 봐줄 수가 없네.\"\n\n그녀의 목소리는 낮았지만, 의사당 구석구석까지 명확하게 박혔다.\n\n\"너희가 누가 옳네, 누가 그르네 하며 서로의 목을 조르는 동안... 아리우스는 다시 썩어가고 있어. 보라고. 이게 의회야? 아니면 우리가 그토록 도망치고 싶어 했던 '폐허'의 꼴이야?\"\n\n미사키는 대답을 기다리지 않았다. 그녀는 그저 \"가자, 히요리. 여긴 숨이 막혀.\"라고 짧게 내뱉고는 출구로 발걸음을 옮겼다.\n\n그때였다. 덜컹, 하고 의자 끌리는 소리가 났다. 구석에 밀려나 있던 중도파 의원 한 명이 말없이 일어나 미사키의 뒤를 따랐다. 뒤이어 두 명, 세 명... 양 극단의 추태에 질려버린 이들이, 파벌을 가리지 않고 하나둘씩 자리에서 일어났다. 그 행렬은 곧 거대한 흐름이 되었다."
 ARI_3rd_council.9.a: "사오리와 아즈사가 멍하니 바라보는 사이, 의사당의 절반이 텅 비어버렸다."

 ARI_3rd_council.10.t: "추락하는 두 날개"
 ARI_3rd_council.10.d: "아리우스 도심가의 밤하늘은 붉게 타오르고 있었다. 그것은 노을이 아닌, 개혁파가 주도한 성난 군중들이 던진 화염병의 불길이었다.\n\n\"독재 타도! 아리우스를 시민에게!\"\n\n개혁파 강성 의원들은 트리니티계 주민들을 선동하여 거리로 쏟아져 나왔다. 그들은 관공서를 점거하고 '시민 혁명'을 선포했지만, 그 실체는 통제되지 않는 약탈과 방화에 가까웠다.\n\n한편, 이에 맞서려던 보수파 군부의 대응은 최악의 자충수가 되었다. 그들은 사오리의 승인조차 받지 않은 채 병력을 동원해 의회를 봉쇄하고 계엄령을 선포하려 했다. 일명 '작전명: 성채'. 그러나 이 친위 쿠데타 계획은 실행 직전 내부 고발로 폭로되었다.\n\n\"국민을 향해 총을 겨누려 했다!\"는 사실이 알려지자, 헌병대는 명령을 거부했고 성난 군중은 쿠데타 주동자들의 관저로 들이닥쳤다. 장군들이 제복이 찢긴 채 끌려 나오고, 개혁파 리더들은 광기에 취해 그것을 생중계하는 지옥도가 펼쳐졌다. 아리우스를 지탱하던 두 날개가 동시에 꺾여 추락하고 있었다.\n\n이 모든 광경을 안전 가옥의 창틈으로 지켜보던 츠치나가 히요리가 입술을 깨물었다.\n\n\"...더 이상은 안 돼요. 사오리 언니도, 아즈사 쨩도... 이젠 아무것도 막을 수 없어요. 이대로라면 아리우스는 정말로 없어져 버릴 거예요.\"\n\n평소라면 겁에 질려 울었을 히요리의 눈에, 처음으로 독기 어린 결의가 서려 있었다. 이마시노 미사키는 한숨을 길게 내뱉으며 고개를 끄덕였다. 그녀의 눈은 이미 차갑게 식어 있었다.\n\n미사키는 책상 위에 놓인 아리우스의 지도를 펼쳤다. 그 위에는 양 파벌에 속하지 않은, 그러나 침묵하고 있던 다수의 군부대와 행정 조직의 위치가 표시되어 있었다.\n\n\"히요리, 준비해. 사오리에게 갈 거야.\"\n\"...네.\""
 ARI_3rd_council.10.a: "두 사람은 폐허가 되어가는 도시를 뒤로하고, 최후의 통첩을 전하기 위해 움직이기 시작했다."

 ARI_3rd_council.11.t: "제1호 비상 포고령"
 ARI_3rd_council.11.d: "새벽녘의 단치히 광장에는 기묘한 정적이 감돌았습니다. 바리케이드가 철거된 자리에는 검은 제복을 입은 '비상정부'의 병력들이 배치되었고, 라디오와 확성기에서는 치직거리는 잡음과 함께 이마시노 미사키의 건조한 목소리가 송출되기 시작했습니다.\n\n조마에 사오리는 비상 조치 승인안에 서명한 뒤 관저의 별관으로 거처를 옮겼고, 시라스 아즈사는 첩보를 통해 이 사태를 예견했음에도 저항하지 않고 순순히 구금에 응했습니다. 두 거인이 내려놓은 권력의 공백을 메운 것은, 그동안 아무런 힘도 없다고 여겨졌던 소녀들이었습니다.\n\n그들은 거창한 이념이나 미래를 약속하지 않았습니다. 그저 '오늘을 살아남겠다'는 서늘한 생존 본능만이 담긴 포고문이 낭독되었습니다.\n\n\"아리우스의 모든 학생과 시민에게 고한다. 우리는 더 이상 헛된 깃발 아래서 피를 흘리지 않을 것이다. 이에 새로 수립된 '비상정부'는 다음과 같이 선포한다.\"\n\n1. 내전의 영구적 거부. 우리는 형제가 형제의 가슴에 총을 겨누던 옛 아리우스의 비극이 재현되는 것을 용납하지 않는다. 내전을 유도하는 모든 행위는 즉결 처분한다.\n\n2. 파벌의 해체 및 책임 규명. 민생을 도외시하고 권력 투쟁에만 몰두하여 국가를 교착 상태에 빠뜨린 '보수파'와 '개혁파' 모두를 이 사태의 주범으로 규정한다. 현 시각부로 모든 정치 파벌은 강제 해산된다.\n\n3. 이전 공의회의 원천 무효. 폭력과 선동, 그리고 다수의 이탈로 얼룩진 지난 회의는 정족수 미달로 인해 원천 무효임을 선언한다. 그곳에 '아리우스의 의지'는 없었다.\n\n4. 이념 논쟁은 끝났다. 앞으로 우리의 모든 행정력은 오로지 식량 확보, 치안 유지, 그리고 아리우스의 새로운 내전을 방지하는것에 집중될 것이다.\n\n방송이 끝난 뒤, 미사키는 마이크를 끄고 깊은 한숨을 내쉬었습니다. 옆에 서 있던 히요리는 떨리는 손으로 선언문을 꽉 쥐고 있었습니다."
 ARI_3rd_council.11.a: "...할 일이 많아졌다."


