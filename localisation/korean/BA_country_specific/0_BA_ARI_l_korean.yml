 # CASE 1: 아즈사 패배 (관계도 부족 혹은 전투 패배 판정)
 ARI_reformist_event_chain.28.t: "마지막 의무 - 꺼진 불빛"
 ARI_reformist_event_chain.28.d: "집무실은 말 그대로 폭격이라도 맞은 듯 처참하게 부서져 있었습니다. 기나긴 교전의 끝, 먼저 한계에 달해 주저앉은 것은 시라스 아즈사였습니다.\n\n\"하아... 하아...!\"\n\n부서진 테이블에 간신히 등을 기댄 아즈사의 숨소리에는 쇳소리가 섞여 있었고, 머리 위의 헤일로는 금방이라도 꺼질 듯 위태롭게 깜빡거렸습니다. 조마에 사오리 역시 성한 곳 하나 없는 모습으로 피를 흘리며 거친 숨을 몰아쉬고 있었지만, 그녀는 끝내 두 다리로 서 있었습니다.\n\n\"...아쉽군. 조금만 더 집요했다면 내가 당했을 거다.\"\n\n사오리는 탄창이 텅 빈 권총을 바닥에 던지며 무심하게 몸을 돌렸습니다. 그녀의 목소리는 평소처럼 건조했지만, 미세하게 떨리고 있었습니다.\n\n\"이걸로 증명됐겠지. 내 역할은 정말로 지금 끝났다. 남은 일들은... 혼자서도 잘 해낼 수 있을 거다, 아즈사.\"\n\n뚜벅, 뚜벅. 문을 향해 걸어가는 사오리의 발소리가 멀어지기 시작했습니다. 아즈사는 납덩이처럼 무거워진 손을 애써 뻗었지만, 허공을 가를 뿐이었습니다.\n\n\"...미안, 해...\"\n\n멀어지는 등 뒤를 향해 쥐어짜듯 흘러나온 그 한마디를 끝으로, 아즈사의 헤일로가 완전히 빛을 잃었습니다. 기절한 아즈사를 뒤로한 채, 사오리는 뒤돌아보지 않고 어둠 속으로 사라졌습니다."
 ARI_reformist_event_chain.28.a: "잡을 수 없는 손이었다."

 # CASE 2: 아즈사 승리 (관계도 충족 혹은 전투 승리 판정)
 ARI_reformist_event_chain.29.t: "마지막 의무 - 넘어선 산"
 ARI_reformist_event_chain.29.d: "자욱한 화약 연기가 걷힌 집무실 바닥에는, 영원히 넘을 수 없을 태산처럼 보였던 조마에 사오리가 쓰러져 있었습니다. 제복의 옷자락은 처참하게 찢겨 있었고, 그녀는 바닥에 등을 댄 채 거칠게 숨을 헐떡이고 있었습니다.\n\n그녀를 내려다보는 시라스 아즈사의 총구 끝이 미세하게 떨렸습니다. 아즈사 역시 한계에 달해 당장이라도 쓰러질 듯 비틀거리고 있었지만, 끝내 서서 총을 겨누고 있는 것은 그녀였습니다.\n\n\"하아... 후. ...꼴사납군.\"\n\n사오리는 천장을 올려다보며 자조적인 헛웃음을 흘렸습니다. 그녀의 얼굴에는 패배의 굴욕보다는, 기묘한 후련함이 스쳐 지나갔습니다.\n\n\"내가 졌다, 아즈사. 결국 이렇게 되는군.\"\n\n아즈사는 천천히 총을 거두었습니다. 그리고 비틀거리며 다가가, 사오리의 곁에 무릎을 꿇고 털썩 주어앉았습니다. '패자에게 내리는 명령'으로 자신을 붙잡을 걸 예상했던 사오리의 예상과 달리, 아즈사의 입에서 나온 것은 물기 어린 애원이었습니다.\n\n\"명령이 아니야... 부탁이야. 계속 내 곁에 있어줘, 사오리.\"\n\n자신을 버리지 말아 달라는 그 간절한 목소리에 사오리는 잠시 눈을 크게 떴다가, 이내 픽 웃으며 힘이 빠진 고개를 돌렸습니다.\n\n\"규칙은 규칙이지... 져버렸으니, 어쩔 수 없군.\"\n\n마침내 무거운 짐을 내려놓은 듯한 평온한 얼굴이었습니다. 사오리는 밀려오는 피로와 기나긴 안도감 속에서, 조용히 눈을 감고 깊은 잠에 빠져들었습니다."
 ARI_reformist_event_chain.29.a: "우리의 이야기는 여기서 끝나지 않는다."

 #########################################
 # 개혁파 스토리 이벤트: 사오리 사임 (제헌 의회 종료)
 #########################################
 # CASE 1: 관계도 부족 (갈등 속의 사임, 결투 진입 불가)
 ARI_reformist_event_chain.30.t: "모래성의 끝"
 ARI_reformist_event_chain.30.d: "새로운 '아리우스 공화국 헌법'이 의회를 통과하고 환호성이 울려 퍼지던 다음 날 아침, 시라스 아즈사가 마주한 것은 굳게 닫힌 제1집무실의 문이었습니다.\n\n조마에 사오리는 이미 떠나고 없었습니다. 넓은 책상 위에는 개인 물품 하나 남기지 않고 치워진 빈 공간과, 무미건조한 활자로 인쇄된 한 장의 사직서만이 놓여 있었습니다. 그녀는 작별 인사조차 남기지 않았습니다. 아니, 애초에 두 사람 사이에는 그럴싸한 작별을 나눌 만큼의 유대감이 남아있지 않았습니다.\n\n개혁이라는 이름 아래 두 사람은 너무 자주 부딪혔고, 서로의 방식에 실망했습니다. 사오리에게 아즈사는 '현실을 모르는 몽상가'였고, 아즈사에게 사오리는 '대화가 통하지 않는 구체제'가 되어버린 지 오래였습니다.\n\n아즈사는 서늘한 집무실 한가운데 서서, 텅 빈 의자를 가만히 응시했습니다. 폭군을 몰아내고 민주적인 공화국을 세웠지만, 정작 그 자리에 남은 것은 깊은 단절감과 혼자서 이 거대한 모래성을 지탱해야 한다는 뼈저린 고독뿐이었습니다. 헌법이라는 종이 쪼가리가, 잃어버린 동료의 빈자리를 채워줄 수는 없었습니다."
 ARI_reformist_event_chain.30.a: "돌아갈 다리는 이미 불타버렸다."

 # CASE 2: 관계 충족 (결투 패배 혹은 담담한 이별)
 ARI_reformist_event_chain.31.t: "마침표"
 ARI_reformist_event_chain.31.d: "제헌 의회의 마지막 의사봉 소리가 울려 퍼진 날 저녁, 조마에 사오리는 어깨에 가벼운 더플백 하나를 멘 채 사령부 뒷문을 나서고 있었습니다. 그리고 그 길목에는 시라스 아즈사가 서 있었습니다.\n\n\"...배웅은 필요 없다고 했을 텐데.\"\n\n사오리는 담담하게 말했지만, 그녀의 목소리에는 희미한 온기가 배어 있었습니다. 아즈사는 입술을 깨물었습니다. 무력을 써서라도 붙잡아 보려 했든, 혹은 수많은 밤을 새우며 설득하려 했든, 결국 그녀는 사오리의 고집을 꺾지 못했습니다.\n\n\"정말... 가야만 해?\"\n\"그래. 빛이 닿는 곳에 그림자가 섞여들면 얼룩이 질 뿐이야. 네가 만든 공화국에 '독재자 조마에 사오리'의 자리는 없어. 그게 맞는 거다.\"\n\n사오리는 다가와 아즈사의 머리를 툭, 하고 가볍게 쓰다듬었습니다. 예전 훈련병 시절에나 하던 투박한 격려의 손길이었습니다.\n\n\"다치지 마라, 아즈사. 그리고... 뒤돌아보지도 마. 네가 선택한 길이니까.\"\n\n그 한마디를 끝으로 사오리는 밤안개 속으로 걸음을 옮겼습니다. 아즈사는 멀어지는 뒷모습을 보며 더 이상 붙잡지 않았습니다. 그녀가 남겨준 이 평화와 국가를 지켜내는 것만이, 떠나는 자에 대한 유일한 보답임을 알았으니까요."
 ARI_reformist_event_chain.31.a: "안녕, 사오리."

 ARI_reformist_event_chain.32.t: "국가의 얼굴"
 ARI_reformist_event_chain.32.d: "보편공화국의 헌법이 제정됨에 따라, 아리우스의 권력 구조는 확고한 이원집정부제로 굳어졌습니다. 설정상 조마에 사오리는 굳건한 국가원수이자 군부의 수장으로서 국가의 기반을 지탱하며, 시라스 아즈사는 정부의 실무를 총괄하는 국가총리로서 국정 전반을 이끕니다.\n\n그러나, 어떤 인물이 정부를 대외적으로 대표해야 할까요? 헌법상의 명백한 대표자가 조마에 사오리일지라도, 대중들이 여기는 인지도 높은 실질적 지도자는 시라스 아즈사입니다. 그러기에 이러한 미묘한 균형을 해결하고 내부적으로 누가 정부의 실무를 대표할지를 정해야 합니다."
 ARI_reformist_event_chain.32.a: "시라스 아즈사를 내세운다."
 ARI_reformist_event_chain.32.b: "조마에 사오리를 내세운다."

 ARI_reformist_event_chain.33.t: "기도는 마음속으로"
 ARI_reformist_event_chain.33.d: "\"사면령은 시스터후드에게도 동일하게 적용돼. 하지만...\"\n\n시라스 아즈사는 탁자 너머로 긴장한 채 앉아 있는 시스터후드의 수뇌부를 담담하게 바라보았다. 우타즈미 사쿠라코는 두 손을 모은 채 아즈사의 다음 말을 기다리고 있었고, 그 옆의 와카바 히나타는 안절부절못하며 눈치를 살피고 있었다.\n\n\"트리니티의 교리를 앞세운 종교적 정치 활동은 더 이상 허용할 수 없어. 대신, 시스터후드가 오직 구호와 봉사에만 전념하는 순수한 공적 단체로 활동한다면, 아리우스는 너희의 존속을 보장할 거야. 부상자를 돌보고, 폐허를 치우는 일이라면 너희의 교리와도 어긋나지 않겠지?\"\n\n사쿠라코는 가볍게 안도의 한숨을 내쉬었다. 아리우스 분교의 강경한 보복적 탄압이나 이단 심문을 예상했던 것에 비하면, 이것은 자비에 가까운 처사였다.\n\n\"...이해했습니다. 저희 시스터후드의 본질은 이웃에게 평화와 은총을 베푸는 것. 그 조건, 받아들이겠습니다.\"\n\"다행이네. 모든 것은 헛되지만, 그럼에도 살아가는 의미를 찾는 게 지금의 아리우스니까. 너희의 봉사가 누군가에게 도움이 된다면 그걸로 족해.\"\n\n그때, 묵묵히 기도를 올리던 이오치 마리가 반짝이는 눈으로 고개를 들었다.\n\n\"모든 것은 헛되지만, 살아가는 의미를 찾는다... 아리우스의 교리도, 결국 저희가 바라는 평화와 닿아있는 것일지도 모르겠네요. ...아?\"\n\"마, 마리 수녀님?! 그, 그건 이단... 앗, 아니, 제 말은 그게 아니라요...! 으으, 저 또 큰일 날 말실수를... 죄송해요!\"\n\n습관처럼 이단이라는 말을, 그 이단 앞에서 꺼내버린 히나타는 파랗게 질린 얼굴로 허둥지둥 손사래를 쳤고, 사쿠라코 역시 당황한 기색을 감추지 못하며 헛기침을 했다.\n\n\"마리, 진정하시지요. 아즈사 씨, 방금 발언은 시스터후드의 공식 입장이 결코 아닙니다만...\"\n\"상관없어. 우리는 아무것도 강요하지 않으니까. ...이쪽은 어느 정도 정리됐네. 앞으로 잘 부탁해.\"\n\n과거의 죄악과 이단의 굴레는 벗겨졌다. 비록 교리를 공개적으로 표현하지는 못할지언정, 새로운 아리우스의 하늘 아래에서 그들은 다시금 평화를 위한 기도를 올릴 수 있게 되었다."
 ARI_reformist_event_chain.33.a: "선의는 때때로 총알보다 대처하기 힘들다."

 ARI_reformist_event_chain.34.t: "구호가 필요한 곳에 구호를"
 ARI_reformist_event_chain.34.d: "에덴의 화려한 병동이 아닌, 아리우스 자치구의 낡고 칙칙한 임시 진료소. 시라스 아즈사는 조용히 문을 열고 들어섰다. 그곳에는 옛 트리니티의 구호기사단장, 아오모리 미네가 아리우스 학생의 다친 팔에 정성스럽게 붕대를 감아주고 있었다. 한때 서로를 향해 총구를 겨누었던 자들이라고는 믿기지 않는 평온한 광경이었다.\n\n\"트리니티는 완전히 병합됐어. 우리는 너희의 적이었고, 네가 지키려던 모든 것을 무너뜨린 당사자야.\"\n\n아즈사의 조심스러운, 그러나 뼈가 있는 질문에 미네는 붕대를 다 묶고 나서야 천천히 몸을 돌렸다. 그녀의 얼굴에는 패전국의 장수다운 비굴함도, 적국을 향한 원망도 없었다. 그저 평소와 같은, 굳건하고 단정한 모습 그대로였다.\n\n\"구호가 필요한 분이 계신 곳에 구호기사단이 가는 것은 당연한 일입니다.\"\n\n미네의 대답은 너무나도 간결했다.\n\n\"과거에 적이었는지, 어느 학원 출신인지는 중요하지 않습니다. 눈앞에 상처 입고 고통받는 환자가 있다면 손을 내민다. 그것이 제가 내린 '구호'의 본질이니까요.\"\n\n미네의 흔들림 없는 눈동자를 마주한 아즈사는 작게 한숨을 내쉬며 옅은 미소를 지었다. 새로운 아리우스을 세우려는 자신의 이상과, 상처받은 자라면 누구든 치료하겠다는 미네의 맹세는 결국 맞닿아 있었다.\n\n\"알겠어. 너희의 활동을 통제하거나 의심하지 않겠어.\"\n\n아즈사는 품에서 행정 명령서 하나를 꺼내 탁자 위에 올려두었다.\n\n\"대신, 아리우스 구역 내에서 구호기사단이 이동할 때 헌병대의 검문을 면제받고 최우선으로 통행할 수 있도록 조치할게. 의료 물자 보급선도 정부 차원에서 지원해 주겠어. ...앞으로도 다친 이들을 부탁할게.\"\n\"감사드립니다. 모든 사람에게 은총이 함께하기를.\""
 ARI_reformist_event_chain.34.a: "믿을만한 사람이었어."

 #########################################
 # 개혁파 스토리 이벤트: 아리우스 선도부 창설
 #########################################

 # CASE 1: 사오리가 비난 속에 퇴임한 엔딩 (관계도 최하)
 ARI_reformist_event_chain.35.t: "새로운 선도부장"
 ARI_reformist_event_chain.35.d: "시라스 아즈사가 내민 '아리우스 선도부장 임명장'을 내려다보는 카케하시 스바루의 시선은 차갑게 가라앉아 있었습니다.\n\n\"사오리를 그렇게 보내놓고, 이제 와서 저한테 손을 내미는 건가요? 솔직히 조금 웃기네요.\"\n\n스바루의 찌르는 듯한 질문에 아즈사는 아무런 변명도 하지 못하고 침묵했습니다. 보수파의 새로운 구심점이 된 스바루의 협력 없이는, 텅 빈 아리우스의 치안을 담당할 선도부를 온전히 조직할 수 없었으니까요.\n\n\"뭐, 그래도… 지금 이 엉망인 상황에서 이 일을 맡을 사람이 저 말고는 딱히 없어 보이기도 하니까요. 죄 없는 아리우스의 아이들을 위해서라도, 제가 힘내야죠.\"\n\n스바루는 짧은 한숨과 함께 임명장을 집어 들었습니다.\n\n\"알겠어요. 선도부장, 수락할게요. 앞으로 치안에 문제가 생기신다면 최대한 도와드리죠. 뭐, '아리우스의 방식'으로 말이에요.\""
 ARI_reformist_event_chain.35.a: "어쨌든 치안 공백은 메웠다."

 # CASE 2: 사오리가 담담히 임무를 마치고 떠난 엔딩 (관계도 중간)
 ARI_reformist_event_chain.36.t: "새로운 선도부장"
 ARI_reformist_event_chain.36.d: "\"이런 무거운 자리는 저보다는… 조마에 사오리 씨가 훨씬 잘 어울릴 텐데요.\"\n\n스바루는 내밀어진 선도부장 임명장을 보며 작게 한숨을 내쉬었습니다. 아즈사의 표정에는 씁쓸함이 스쳐 지나갔습니다. 사오리가 남기고 간 빈자리는 여전히 컸고, 그 공백을 메우기 위해 아즈사는 보수파를 이끄는 스바루에게 협력을 구해야만 했습니다.\n\n\"하아…. 지나간 일에 대해 따져봐야 어쩔 수 없겠죠. 학생회장도 다 생각이 있어서 떠나신 걸 테니까요.\"\n\n스바루는 조심스럽게 임명장을 품에 챙겼습니다. 그녀의 표정에는 아쉬움과 책임감이 교차하고 있었습니다.\n\n\"알겠습니다. 다른 누구도 아닌 아리우스를 지키는 일이니까요. 누군가 해야 한다면, 제가 준비할게요. 아리우스의 아이들이 옛날처럼 공포에 떨지 않도록…… 제가 할 수 있는 일은 다 해보겠습니다.\""
 ARI_reformist_event_chain.36.a: "조금씩 빈자리를 채워나간다."

 # CASE 3: 사오리가 잔류한 보편공화국 엔딩 (관계도 충족)
 ARI_reformist_event_chain.37.t: "새로운 선도부장"
 ARI_reformist_event_chain.37.d: "\"새로운 아리우스의 선도부라…. 솔직히 말해서, 아직은 전혀 실감이 나지 않네요.\"\n\n스바루는 아즈사가 건넨 임명장을 만지작거리며 묘한 표정을 지었습니다. 공화국이라는 거대한 변화의 흐름 속에서, 보수파를 이끌게 된 그녀에게 이 모든 상황은 여전히 낯설기만 했습니다.\n\n\"이렇게 모든 게 확 달라진다는 게, 약간 내키지 않는 구석도 있지만... 뭐, 그래도 지금의 풍경이 그렇게 나쁜 기분은 아니니까요. 다들 앞으로 나아가고 있으니까, 저도 힘내야죠.\"\n\n스바루는 살짝 미소를 짓는가 싶더니, 이내 헛기침을 하며 말을 돌렸습니다.\n\n\"당신을 위해서가 아니라, 단지…. 아리우스를 위하는거니까 수락하는 것뿐인겁니다.\"\n\n살짝 퉁명스럽게 덧붙이는 스바루의 목소리에는, 과거의 무거운 공포 대신 새로운 내일을 향한 활기가 미세하게 섞여 있었습니다."
 ARI_reformist_event_chain.37.a: "듬직한 후배를 얻었다."

 #########################################
 # 개혁파 스토리 이벤트: 아즈사와 사오리의 엔딩 (중앙유럽 통일공화국 완료)
 #########################################

 # 엔딩 1: 아즈사 홀로 회상 (관계도 최하, 사오리 불명예 퇴진)
 ARI_reformist_event_chain.38.t: "왕관의 무게"
 ARI_reformist_event_chain.38.d: "집무실 벽에 걸린 거대한 중앙유럽의 지도는 이제 하나의 색으로 통일되어 있었습니다. 분열과 내전, 그리고 기나긴 개혁의 끝에 아리우스는 마침내 안정을 찾았습니다. 수많은 서류 결재를 마친 시라스 아즈사는 펜을 내려놓고, 깊은 침묵이 내려앉은 방 안을 둘러보았습니다.\n\n아즈사의 시선이 머문 곳은, 예전 조마에 사오리가 늘 팔짱을 끼고 서 있던 창가의 빈자리였습니다.\n\n\"......\"\n\n모든 목표를 이룬 지금에야, 아즈사는 문득 후회와 비슷한 감정을 느꼈습니다. 만약 그때 내가 조금 더 유연했더라면. 나의 이상을 강요하기 전에, 그녀가 짊어지고 있던 현실의 무게를 한 번이라도 더 이해해 주려 노력했더라면 어땠을까.\n\n하지만 시간을 되돌릴 수는 없고, 엎질러진 물은 주워 담을 수 없습니다. 사오리는 떠났고, 그녀가 남기고 간 이 거대한 국가는 오롯이 아즈사 혼자서 짊어져야 할 영원한 짐이 되었습니다. 아즈사는 씁쓸한 입맛을 다시며, 다시 고개를 숙여 다음 결재 서류를 펼쳤습니다. 그것이 이 차가운 집무실에 남겨진 자의 유일한 의무였으니까요."
 ARI_reformist_event_chain.38.a: "모든 것은 헛되다. 그러나..."

 # 엔딩 2: 사오리 방문 (관계도 중간, 사오리 명예로운 퇴진)
 ARI_reformist_event_chain.39.t: "어느 맑은 오후의 홍차"
 ARI_reformist_event_chain.39.d: "중앙유럽 통합 선언을 마친 다음 날, 아즈사는 공식 일정을 모두 취소하고 교외의 한적한 민가로 향했습니다. 낡았지만 깔끔하게 정돈된 마당에서, 민간인 복장의 조마에 사오리가 화단에 물을 주고 있었습니다.\n\n\"...한 나라의 수상이 호위도 없이 이런 변두리까지 오다니, 배가 불렀군.\"\n\"오늘은 휴일이니까. 게다가 여긴 키보토스에서 가장 안전한 곳이잖아?\"\n\n아즈사의 가벼운 농담에 사오리는 피식 웃으며 물뿌리개를 내려놓았습니다. 두 사람은 낡은 나무 테이블에 마주 앉았습니다. 사오리가 내온 것은 고급 홍차가 아니라, 과거 폐허 시절에 종종 끓여 먹던 투박하고 떫은 티백 차였습니다.\n\n\"다 끝났어, 사오리. 의회도, 국경도, 전부 안정됐어. 이제 아무도 곰팡이 핀 빵을 먹지 않아도 돼.\"\n\"알고 있다. 뉴스에서 지겹도록 떠들어대니까.\"\n\n사오리는 찻잔을 만지작거리며 창밖의 평화로운 거리를 내다보았습니다. 그녀의 눈빛에는 예전의 날 선 살기도, 무거운 책임감도 없었습니다.\n\n\"고생했다, 아즈사. 네가 맞았어.\"\n\n그 짧고 담담한 인정 한마디에, 아즈사는 아주 오랫동안 짓눌려 있던 어깨의 짐이 완전히 씻겨 내려가는 것을 느꼈습니다. 따뜻한 차향이 두 사람 사이의 공기를 부드럽게 채우고 있었습니다."
 ARI_reformist_event_chain.39.a: "우리의 전쟁은 정말로 끝났다."

 # 엔딩 3: 일상의 대화 (관계도 최고, 사오리 잔류)
 ARI_reformist_event_chain.40.t: "지루하고도 소중한"
 ARI_reformist_event_chain.40.d: "\"이건 기각이다. 보건부 예산이 너무 많아. 국방부 장비 교체가 먼저다.\"\n\"사오리, 그건 저번 주에 이미 합의한 거잖아! 지금 환절기라 감기 환자가 늘어나고 있다고!\"\n\n공화국의 심장부인 집무실에서는, 오늘도 어김없이 두 지도자의 사소하고도 치열한 말다툼이 벌어지고 있었습니다. 조마에 사오리는 미간을 찌푸린 채 결재판을 두드렸고, 시라스 아즈사는 절대 물러설 수 없다는 듯 책상을 짚고 노려보았습니다.\n\n\"전쟁도 끝났는데 무슨 장비 교체야! 오히려 예산을 줄여야 정상이지!\"\n\"평화로울 때 칼을 갈아야 하는 법이다. 네가 너무 무른 거야.\"\n\n한 치의 양보도 없는 티격태격이 이어지던 중, 문득 두 사람의 시선이 마주쳤습니다. 과거였다면 생존의 방향을 두고 서로에게 총구를 겨눴을 두 사람이, 지금은 고작 '환절기 감기약 예산'과 '군화 교체 시기'를 두고 핏대를 세우고 있었습니다.\n\n누가 먼저랄 것도 없이, 아즈사의 입술 사이로 바람 빠지는 웃음이 새어 나왔고, 사오리 역시 어이없다는 듯 픽 웃으며 고개를 저었습니다.\n\n\"...정말이지, 끝이 없군. 정치가 이렇게 피곤한 건 줄 알았다면 차라리 폐허에서 계속 구르는 게 나았을지도 모르겠어.\"\n\"포기해. 넌 평생 내 서류 작업이나 도와야 할 테니까.\"\n\n사오리는 한숨을 쉬면서도, 결국 아즈사가 내민 보건부 예산안에 서명을 휘갈겼습니다."
 ARI_reformist_event_chain.40.a: "모든 것이 헛되다 해도, 오늘은 아니다."

 ARI_reformist_event_chain_38_tt: "§g아리우스 분교를 이끌게 된 스쿼드의 이야기는 이렇게 막을 내렸습니다. 아직 완전한 통합은 멀었을지도 모르고, 공화국의 안정과 미래를 생각하는 시라스 아즈사에게 있어 사오리의 부재는 크게 느껴질지도 모릅니다. 그러나, 이제 폐허 속을 전전하던 아리우스의 학생들은 이제 세계의 정당한 위치를 찾았고, 중앙유럽의 당당한 패자로 스스로 섰습니다. 모든 길의 끝에서 시라스 아즈사가 느낀 감정은 무엇이었을지는 모르나, 아리우스 공화국에 있어 그녀는 가장 위대한 건국자이자 개혁을 위해 힘쓴 운동가로 기억될 것입니다. ...조마에 사오리에게 조금더 잘해줬더라면 좋았을 것이라는 후회는 있겠지만요.§!\n\n§L아리우스 분교를 위해 만들어진 개혁파의 콘텐츠가 완결되었습니다. 플레이해 주셔서 감사합니다!§! §H- SKSKIe§!"
 ARI_reformist_event_chain_39_tt: "§g아리우스 분교를 이끌게 된 스쿼드의 이야기는 이렇게 막을 내렸습니다. 아직 완전한 통합은 멀었을지도 모르고, 공화국의 안정과 미래를 생각하는 시라스 아즈사에게 있어 사오리의 부재는 크게 느껴질지도 모릅니다. 그러나, 이제 폐허 속을 전전하던 아리우스의 학생들은 이제 세계의 정당한 위치를 찾았고, 중앙유럽의 당당한 패자로 스스로 섰습니다. 모든 길의 끝에서 시라스 아즈사가 느낀 감정은 무엇이었을지는 모르나, 아리우스 공화국에 있어 그녀는 가장 위대한 건국자이자 개혁을 위해 힘쓴 운동가로 기억될 것입니다. 아 참, 아즈사는 가끔 조마에 사오리에게 찾아가 조언을 구할지도 모릅니다.§!\n\n§L아리우스 분교를 위해 만들어진 개혁파의 콘텐츠가 완결되었습니다. 플레이해 주셔서 감사합니다!§! §H- SKSKIe§!"
 ARI_reformist_event_chain_40_tt: "§g아리우스 분교를 이끌게 된 스쿼드의 이야기는 이렇게 막을 내렸습니다. 아직 완전한 통합은 멀었을지도 모르나, 아즈사는 조마에 사오리를 억지로라도 붙들어 잡았고, 이제 함께 공화국을 통치해 나아갈 것입니다! 또한 폐허 속을 전전하던 아리우스의 학생들은 이제 세계의 정당한 위치를 찾았고, 중앙유럽의 당당한 패자로 스스로 섰습니다. 모든 길의 끝에서 시라스 아즈사와 조마에 사오리가 느낀 감정은 무엇이었을지는 모르나, 아리우스 공화국에 있어 그녀는 가장 위대한 건국자이자 개혁을 위해 힘쓴 운동가로 기억될 것입니다.§!\n\n§L아리우스 분교를 위해 만들어진 개혁파의 콘텐츠가 완결되었습니다. 플레이해 주셔서 감사합니다!§! §H- SKSKIe§!"


