 AASRU_progressbar_title: "개혁에 대한 신뢰"
 AASRU_progressbar_end_title: "아리우스 공화국"
 AASRU_progressbar_tt: "개혁에 대한 신뢰: [?AASRU_var|C.0]"
 AASRU_progressbar_tt_delayed: "§L§Y개혁에 대한 신뢰§!는 특정 중점을 완료하는 것에 요구되며, §Y결정§!과 §Y이벤트§!를 통해 지속적인 관리가 필요합니다.§!"
 AASRU_desc: "§Y조마에 사오리§!는 아리우스 분교를 그녀가 이끄는 과정에서 §Y독재적 권한§!을 가지게 되었으며, 그녀가 내전을 피하고자 §4개혁파§!의 선언문을 §t수용§!했더라도 이는 지속됩니다. 당장 §Y조마에 사오리§!를 축출하는 안건에 대하여 §Y시라스 아즈사§!가 §t반대§!를 관철한 이상, §4개혁파§!가 요구하는 §4개혁§!에 있어 §Y아즈사§!는 반드시 §Y사오리§!를 §t설득§!해야 합니다."
 AASRU_end1_desc: "§4공화국 제헌§!이 완료됨에 따라 §Y조마에 사오리§!는 모든 공직에서 §R사임§!했습니다. 헌법상 기존의 §Y학생회장§! 권한과 신설된 §Y국가총리§!의 권한이 불분명하게 충돌했고, 이를 빌미로 한 §4개혁파§!의 거센 사퇴 압박이 이어졌기 때문입니다. 결국 정치적 갈등을 봉합하지 못한 채, 사오리는 씁쓸하게 아리우스의 지도부에서 퇴장했습니다."
 AASRU_end2_desc: "§4공화국 제헌§!이 완료된 직후, §Y조마에 사오리§!는 §Y시라스 아즈사§!의 예상을 깨고 전격적으로 §R사임§!했습니다. 아즈사는 사오리에게 명예직을 제안하며 신정부의 상징으로 남길 원했으나, 사오리는 이를 단호히 §t거절§!했습니다. 그녀는 자신의 역할은 과도기까지였다고 판단하고, 아즈사에게 뒷일을 맡긴 채 권력의 뒤안길로 사라졌습니다."
 AASRU_end3_desc: "§4공화국 제헌§!을 통해 §Y조마에 사오리§!와 §Y시라스 아즈사§!는 완벽한 §G이원집정부제§!를 완성했습니다. §Y아즈사§!의 주도로 명문화된 §Y학원-국가 체제§! 헌법에 따라, 사오리는 행정을 총괄하는 §Y국가총리§!와 §Y의회§!를 견제하고 균형을 맞추는 §Y대통령§!에 준하는 지위를 수행하게 됩니다. 두 사람의 굳건한 신뢰가 아리우스의 새로운 기둥이 되었습니다."
 AASRU_progressbar_end_tt: "§Y조마에 사오리§!와 §Y시라스 아즈사§!의 개혁 이야기는 끝을 맺었습니다."
