 ARI_pyeho_hakwon_1: "폐허 속의 등불"
 ARI_pyeho_hakwon_1_desc: "트리니티의 추격을 뿌리치기 위해 모든 것을 버리고 도망친 대가는 싸늘한 폐허와 몇 남지 않은 학생이었습니다.\n\n그러나 폐허 속에서 절망하지 않았습니다. 아리우스의 학생들은 그 속에서 발전기를 돌리고 탄약을 만들어내며 보복을 결심하고, 등불 아래에 조용히 숨어들어 있습니다."
