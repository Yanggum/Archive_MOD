 ARI_heart_strike_plan: "심장 공습 계획"
 ARI_heart_strike_plan_desc: "아리우스 분교가 트리니티라는 강적을 상대로 초반 우위를 확보하기 위해서는 *광범위한* 침투 공작과 기습적인 테러를 통한 트리니티의 군 활동 마비, 그리고 순식간에 주요 거점을 확보하는 고속 전쟁이 필요합니다. 우리는 이를 위해 큰 준비를 시작할 것입니다.\n\n§Y아리우스§!와 §Y트리니티§! 사이의 §G점수 경쟁§!이 시작되었습니다. §Y아리우스§!가 §Y트리니티§!보다 많은 §G점수§!를 얻는다면 §R치명적인 공습§!을, 얻지 못한다면 §4미미한 공습§!을 성공시킬 것입니다. 적의 세부 §G점수§!는 알아낼 수 없으며 우리는 적이 속해있는 §G범위§!만 알아낼 수 있습니다.\n\n현재 우리의 점수는 ([ARI_heart_strike_plan_ARI_VAR] 점) 입니다.\n상대의 점수는 ([ARI_heart_strike_plan_TRM_VAR_LOC] 점) 범위에 속해 있는 거로 보입니다."

