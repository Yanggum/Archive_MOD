 ARI_conservative_event_chain.1.t: "비가 내린 후, 맑음"
 ARI_conservative_event_chain.1.d: "소낙비가 훑고 지나간 도심의 늦은 오후, 간신히 재결집한 개혁파의 회의장은 패잔병들의 막사처럼 고요하고 축축한 공기에 잠겨 있었다. 더 이상 허공을 가르는 고함도, 붉게 충혈된 눈으로 혁명을 외치는 선동가들도 없었다. 그저 현실이라는 차가운 콘크리트 바닥 위에 발을 붙인 자들의 무거운 숨소리만이 안개처럼 깔려 있을 뿐이었다.\n\n연단에 오른 시라스 아즈사는, 마치 오래된 전장을 내려다보는 지휘관처럼 청중을 천천히 훑어보았다. 그녀의 제복은 단정했지만, 그 어깨에는 이상을 실현하지 못한 자의 쓸쓸한 그림자가 견장처럼 내려앉아 있었다.\n\n\"...바람의 방향은 바뀌었고 우리는 폭풍이 되려 했으나, 그저 흩날리는 먼지에 불과했음을 인정해야 합니다.\"\n\n아즈사의 목소리는 건조했지만, 뼈아픈 진실을 관통하고 있었다. 그녀는 주먹을 꽉 쥐었다가, 이내 천천히 펴 보였다. 그것은 항복의 신호이자, 움켜쥐고 있던 헛된 고집을 놓아주는 의식과도 같았다.\n\n\"옛 질서가 쌓아 올린 벽은 견고했고, 우리가 그 벽을 무너뜨리려던 망치는 부러졌습니다. ...하지만, 벽이 무너지지 않는다면 우리는 그 안에서 살아가는 법을 배워야 하는 것이라고 생각하니, 이제 우리는 창을 겨누는 적이 아니라 협치와 온건한 변화를 추구할 것입니다.\"\n\n급진적인 파괴 대신, 체제 내의 견제 세력으로 남겠다는 패배 선언이자 노선 변경이었다. 그 말을 듣는 군중들 사이에서는 탄식 대신 안도의 한숨이, 거친 파도가 잦아들고 잔물결만이 남은 해변처럼 고요하게 퍼져나갔다. 시민들은 알고 있었다. 더 이상의 피는 흐르지 않을 것이며, 아리우스의 핸들은 사오리와 보수파의 손에 온전히 쥐어졌다는 것을.\n\n창밖으로 보이는 정부의 거대한 청사를 향해, 아즈사는 짧고 절도 있는 경례를 보냈다. 승리한 자들에 대한 예우이자, 국가라는 현실에 대한 경의였다."
 ARI_conservative_event_chain.1.a: "폭풍우는 지나갔다."

 ARI_conservative_event_chain.2.t: "서명하시오"
 ARI_conservative_event_chain.2.d: "트리니티 대성당의 지하 법정에 우타즈미 사쿠라코를 비롯한 시스터후드의 간부들이 섰을 때, 방청석을 메운 아리우스 강경파들의 눈빛은 살기로 번들거리고 있었습니다. 그들은 '성도회 마녀들'에게 가장 가혹한 형벌을 내리기를 원했습니다. 누구도 그들을 재판하고 싶어 하지 않았지만, 동시에 모두가 그들이 피를 흘리길 원했습니다.\n\n하지만 재판석 중앙에 앉은 조마에 사오리의 생각은 달랐습니다. 물론 시스터후드 또한 전선에서 우리에게 총을 겨눴고, 우리가 사용한 화학무기로 인해 다른 때보다는 적극적으로 전쟁에 참여한건 맞습니다. 하지만 이제 와서 그것을 '전범'으로 규정하고 처형이나 투옥을 한다면? 그렇다면 티파티의 명령에 따라 방아쇠를 당긴 트리니티의 모든 학생을 감옥에 처넣어야 할 것입니다. 그것은 통치가 아니라, 영원히 끝나지 않을 학살을 의미했습니다.\n\n\"...티파티와 정의실현부는 무너졌다. 너희는 그들과 달리 '적극적인 전쟁'을 주도하지 않았다는 점을 참작한다.\"\n\n사오리의 건조한 판결문이 낭독되자 장내는 술렁거렸습니다. 그러나 사오리는 동요하지 않고 다음 형을 선고했습니다.\n\n\"허나, 죄가 없는 것은 아니다. 이에 시스터후드가 자칭해온 옛 전범 집단 '유스티나 성도회의 계승권'을 영구히 박탈한다. 너희는 더 이상 성도회의 후예가 아니다. 또한, 오늘부로 모든 수녀원의 교육 과정에 아리우스의 철학을 의무적으로 도입한다.\"\n\n사쿠라코는 입술을 깨물었지만, 끝내 고개를 숙여 판결을 받아들였습니다. 그것은 시스터후드라는 조직이 가진 대의가 크게 후퇴하고, 영영 소멸할지도 모르는 일이었지만…. 더 가혹한 걸 생각하고 온 수녀들에게는 안도의 한숨을 내쉬게 해주었습니다. 다행히도, 피를 보는 대신 사오리는 그들의 '신앙'을 수술대에 올리는 것을 택했습니다."
 ARI_conservative_event_chain.2.a: "시스터후드는... 유스티나 성도회와 관계 없다."

 ARI_conservative_event_chain.3.t: "방과후 디저트부"
 ARI_conservative_event_chain.3.d: "\"으, 으에... 저기, 그러니까... 아리우스의 새로운 치안 유지법에 따르면, 허가받지 않은 3인 이상의 사적인 동아리 활동은... 으극?!\"\n\n방과후 디저트부의 부실 문을 열고 들어간 츠치나가 히요리는 말을 끝맺지 못했습니다. 그녀의 눈앞에 나츠와 카즈사가 내민 것은 '트리니티 한정판 특제 몽블랑'과 김이 모락모락 나는 홍차였기 때문입니다.\n\n\"자, 자, 딱딱한 이야기는 이거 먹고 나서 해도 되잖아? 아리우스에서 온 손님.\"\n\"히요리 쨩이라고 했나? 이거 진짜 구하기 힘든 건데, 우리끼리만 먹으려다 특별히 주는 거야.\"\n\n히요리의 동공이 격렬하게 흔들렸습니다. 그녀의 손에 들린 '분리주의 단체 강제 해산 명령서'는 달콤한 버터 냄새 앞에서 휴지 조각보다 가벼워졌습니다. 한 입, 딱 한 입만 먹고 엄격하게 대하려 했으나 정신을 차렸을 때는 이미 접시가 깨끗하게 비워져 있었습니다.\n\n\"...저, 저기... 그, 그래서 말인데요... 동아리 유지는 허가해 드릴게요. 대, 대신에... 아리우스의 감시를 받아야 하니까...\"\n\"감시하려면 예산이 필요하겠네? 우리 재료비 지원해 주면 언제든 와서 '감시(시식)'해도 좋아.\"\n\n결국 히요리가 사오리에게 들고 온 것은 해산 명령서가 아닌, <방과후 디저트부 활동비 전액 지원 및 특별 간식비 편성안>이었습니다. 명분은 '트리니티 잔존 세력의 불만 무마'였지만, 서류에서는 진한 슈가파우더 냄새가 났습니다. 아리우스의 재무관들은 이 막대한 지출 항목을 보고 뒷목을 잡았지만, 히요리의 행복한 표정을 보고 차마 기각하지 못했습니다."
 ARI_conservative_event_chain.3.a: "예산 낭비가 분명하잖아!"

 ARI_conservative_event_chain.4.t: "도서부"
 ARI_conservative_event_chain.4.d: "고서관의 육중한 문이 열리고, 이마시노 미사키가 뚜벅뚜벅 걸어 들어왔습니다. 곰팡이 냄새와 오래된 종이 냄새가 진동하는 그 어두침침한 공간은, 빛을 싫어하는 미사키에게 있어 묘하게 안락한 장소였습니다.\n\n책장 뒤에 숨어 떨고 있던 코제키 우이는 미사키를 보자마자 비명을 지르려 했지만, 미사키의 건조하고 텅 빈 눈동자를 마주하자 입을 다물었습니다. 침입자에게서 자신과 같은 '동류'의 냄새—세상과 단절되고 싶은 욕망—를 맡았기 때문입니다.\n\n\"...우리는 협조가 필요해. 바깥세상의 시끄러운 녀석들이 건드리지 못하게 보호해 주지. 대신, 여기 있는 고서들의 소유권은 아리우스가 갖는다.\"\n\"...보호? 정말로... 저 시끄러운 바보들을 막아주는 건가요? 햇빛도, 소음도 없이... 이 어둠 속에서 책만 읽을 수 있게?\"\n\"그래. 우린 시끄러운 건 딱 질색이니까.\"\n\n미사키가 털썩 바닥에 주저앉아 손목을 만지작거렸고, 우이는 조용히 그 맞은편에 앉았습니다. 두 사람 사이에는 대화 없이도 통하는 음침하고 무거운 침묵이 흘렀습니다. 그것은 마치 심연과 심연이 서로를 들여다보는 듯한 기묘한 공명이었습니다.\n\n\"으으... 저기, 여기 공기가 너무 무거워서 숨을 못 쉬겠는데요... 저, 저는 먼저 가볼게요!\"\n\n분위기를 견디지 못한 사서 시미코가 비명을 지르며 도서관 밖으로 도망쳤습니다. 도서관의 통제권은 놀라울 정도로 평화롭게, 그리고 음울하게 이양되었습니다."
 ARI_conservative_event_chain.4.a: "...이 서류는 읽기만 해도 음침하군."

 ARI_conservative_event_chain.5.t: "모든 이름 위의"
 ARI_conservative_event_chain.5.d: "옛 트리니티의 대성당 꼭대기에 게양된 아리우스의 깃발은 더 이상 바람에 찢어질 듯 펄럭이지 않았습니다. 그저 그 자리에 원래부터 있었던 것처럼, 묵직하고 고요하게 내려앉아 중앙유럽의 하늘을 지배하고 있을 뿐이었습니다.\n\n조마에 사오리는 옛 티파티의 호스트가 사용하던 테라스에 서서, 발아래로 펼쳐진 제국을 내려다보았습니다. 한때는 증오의 대상이었던 트리니티의 교정, 그리고 그 너머로 무릎 꿇린 게헨나의 붉은 영토까지. 시야에 들어오는 모든 것이 이제 아리우스의 이름 아래 통제되고 있었습니다.\n\n\"...우스운 일이군.\"\n\n난간에 걸터앉은 이마시노 미사키가 텅 빈 눈으로 중얼거렸습니다.\n\n\"우리는 아즈사가 트리니티 녀석들과 손을 잡는 게 싫어서 그 난리를 쳤는데. 결국 봐. 우리 발밑에서 일하는 관료의 절반이 트리니티 출신이고, 공장의 노동자들은 게헨나 출신이야. 복수? 이제 와서 누구에게 복수를 해? 길거리에서 마주치는 모두가 우리에게 고개를 숙이는데.\"\n\n미사키의 말대로였습니다. 승리는 달콤한 복수의 완성이 아니라, 복수할 대상의 소멸을 의미했습니다. 세상의 모든 적을 짓밟은 순간, 아리우스는 역설적으로 그들이 그토록 경멸하던 '거대한 지배자'가 되어버렸습니다. 증오라는 연료가 다 타버린 자리에 남은 것은, 거대한 행정 기구와 막강한 군사력, 그리고 '통치'라는 무거운 책임뿐이었습니다.\n\n\"... 그래도, 더 이상 도망치지 않아도 되는 거잖아요. 곰팡이 핀 빵을 먹지 않아도 되고, 잘 때 누가 쳐들어올까 봐 떨지 않아도 되고...\"\n\n츠치나가 히요리가 고급스러운 찻잔을 양손으로 감싸 쥐며 안도하듯 말했습니다. 그것은 가장 원초적이지만, 가장 확실한 승리의 증명이었습니다.\n\n사오리는 천천히 고개를 들어 지평선을 응시했습니다. 폐허 속의 유령, 학원 도시의 그림자, 잊힌 자들. 그 모든 멸칭은 이제 역사책 속으로 사라졌습니다. 그들은 두 번 다시 어둠 속으로 숨어들지 않을 것입니다.\n\n\"모든 것이 헛되다(Vanitas Vanitatum).\"\n\n사오리의 입에서 흘러나온 교리는 예전과 같은 자조나 절망이 아니라, 역설적으로 원 의미를 되찾아가는 모습으로 비쳤습니다."
 ARI_conservative_event_chain.5.a: "\"허나, 그 헛된 세상의 정점에 우리가 서 있다. 그것으로 족하다.\""
 ARI_conservative_ending_tt: "§g아리우스 분교를 이끌게 된 스쿼드의 이야기는 이렇게 막을 내렸습니다. 아직 완전한 통합은 멀었을지도 모르고, 분교의 안정을 최우선으로 하는 조마에 사오리는 더 많은 변화를 수용하지 못할지도 모릅니다. 그러나, 폐허 속을 전전하던 아리우스의 학생들은 이제 세계의 정당한 위치를 찾았고, 중앙유럽의 당당한 패자로 스스로 섰습니다. 모든 길의 끝에서 조마에 사오리가 느낀 감정이 무엇이었을지는 모르나, 아리우스에 있어 그녀는 영웅으로 기억될 것입니다.§!\n\n§L아리우스 분교를 위해 만들어진 보수파의 콘텐츠가 완결되었습니다. 플레이해 주셔서 감사합니다!§! §H- SKSKIe§!"

