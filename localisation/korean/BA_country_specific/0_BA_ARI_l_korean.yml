# 상황 이벤트
## 근거리
 ARI_duel_env.close_range: "단 한 번의 도약으로 닿을 수 있는 거리. 두 사람 사이에는 팽팽하게 당겨진 현처럼 날카로운 살기가 흐르고 있습니다. 사오리의 거친 숨소리가 들릴 정도로 가까운 이곳에서는 장거리 사격술 따위는 무의미합니다. 오직 본능적인 반사 신경과, 상대의 뼈를 부러뜨릴 각오만이 생사를 가를 것입니다."

## 중거리
 ARI_duel_env.medium_range: "집무실 중앙을 가로질러, 두 사람은 서로에게 가장 익숙한 사거리를 유지한 채 대치하고 있습니다. 너무 멀지도, 가깝지도 않은 이 거리는 아리우스 스쿼드에게 가장 익숙한 대치 구역입니다. 누가 먼저 방아쇠를 당길 것인가, 아니면 누가 먼저 상대의 빈틈을 읽어낼 것인가. 정적 속에 차가운 계산만이 오가고 있습니다."

## 사오리 엄폐
 ARI_duel_env.saori_cover: "조마에 사오리는 이미 집무실의 엄폐물을 방패 삼아 몸을 숨겼습니다. 그녀는 보이지 않는 곳에서 아즈사의 동선을 완벽하게 통제하고 있습니다. 사냥감을 노리는 맹수처럼, 엄폐물 너머에서 뿜어져 나오는 그녀의 압박감은 아즈사의 운신 폭을 극도로 제한하고 있습니다. 섣불리 움직였다간 사각지대에서 날아온 흉탄에 제압당할 것입니다."

## 아즈사 엄폐
 ARI_duel_env.azusa_cover: "시라스 아즈사는 특유의 작은 체구를 이용해 집무실의 엄폐물 뒤로 파고들었습니다. 불리한 신체 조건을 지형지물로 극복하려는 시도입니다. 그녀는 엄폐물 뒤에서 가쁜 숨을 고르며, 사오리가 다가올 경로에 덧칠해진 '죽음의 선'들을 계산하고 있습니다."

# 사오리의 행동
## 근접전 (근거리)
 ARI_duel_env.knife_fighting: "총구보다 칼날이 더 빠른 거리입니다. 사오리는 순식간에 품에서 전술 나이프를 역수로 뽑아 들고, 아즈사의 급소를 노리며 숨 쉴 틈 없는 연격을 퍼붓습니다."

## 견제사격 (근거리 불가)
 ARI_duel_env.suppressive_fire: "사오리는 망설임 없이 방아쇠를 당깁니다. 탕, 탕, 탕! 규칙적인 파열음과 함께 아즈사의 발치와 귓가를 스치는 위협 사격이 이어집니다."

## 저격 (아즈사 엄폐시 불가능, 근거리 불가)
 ARI_duel_env.sniping: "사오리의 헤일로가 서늘하게 빛납니다. 그녀는 호흡을 멈추고 순간적으로 신비를 집중하여 아즈사의 빈틈을 조준합니다. 치명적인 정밀한 일격을 준비하고 있습니다."

## 테이블 걷어차기 (근거리 불가)
 ARI_duel_env.throwing_object: "사오리는 주변의 집기를 걷어찹니다. 육중한 테이블이 흉기처럼 날아오고, 책상 위의 서류들이 흩날리며 시야를 가립니다."

## 거리 벌리기 (근거리)
 ARI_duel_env.gaining_distance: "근접전의 위험을 감지한 사오리가 아즈사의 어깨를 강하게 밀쳐내며 백스텝을 밟습니다. 그녀는 그 찰나의 틈을 놓치지 않고 다시금 총구를 겨누며 사거리의 우위를 점하려 합니다."

## 거리 좁히기 (중거리시)
 ARI_duel_env.closing_distance: "사오리가 바닥을 박차고 맹렬한 기세로 돌진합니다. 총격전의 대치 상태를 힘으로 부수고 들어와, 아즈사의 품 안으로 파고드는 과감한 기동. 사격할 틈조차 주지 않고 순식간에 육탄전으로 끌고 가려는 속셈입니다."

## 엄폐물 뒤에서 기습 (사오리 엄폐시)
 ARI_duel_env.surprise_attack: "엄폐물 뒤의 정적이 깨지는 순간, 사오리가 책상을 딛고 도약합니다. 예상치 못한 각도, 예상치 못한 타이밍의 공중 강습. 그녀는 위에서 아래로 아즈사를 덮치며 체중을 실은 제압을 시도합니다."

# 지형지물 (아무것도 안 나올 수 있음)
## 테이블 (엄폐물)
 ARI_duel_env.table: "\n\n두꺼운 오크 원목 테이블이 근처에 놓여 있습니다. 급한 대로 몸을 숨기거나, 발로 차서 임시 방패로 삼기에 충분해 보입니다."

## 나무막대 (변수)
 ARI_duel_env.stick: "\n\n격투의 여파로 부서진 가구의 날카로운 나무 파편이 바닥에 굴러다닙니다. 기습적으로는 투박하지만 치명적인 둔기가 될 수 있습니다."

## 샹들리에 (변수, 1회용)
 ARI_duel_env.chandelier: "\n\n천장에 매달린 화려한 샹들리에가 총격의 진동으로 위태롭게 흔들리고 있습니다."

## 캐비닛 (엄폐물)
 ARI_duel_env.cabinet: "\n\n근처에는 거대한 강철 캐비닛이 전투의 충격에 기울어져 쓰러진 채 있습니다. 시야를 차단하고 우회하거나, 도탄을 유도하여 변수를 창출할 수 있는 구조물입니다."

