 SHA_economic_stabilization: "경제 안정화 개시"
 SHA_economic_stabilization_desc: "사태가 휘몰아치고 새해가 밝아오면서 사회적 혼란은 서서히 잦아들기 시작했습니다. 많은 이들은 다시 찾아올 번영과 안정, 그리고 새로운 발전을 희망했습니다. 하지만 현실은 녹록지 않습니다. 붕괴한 산업 기반은 아직도 심각한 침체에서 벗어나지 못하고 있으며, 회복의 기미는 좀처럼 보이지 않았습니다. 경제의 추락 속도를 늦추고 최악의 상황을 막아내기 위해서는 신속하고 과감한 조치가 필요합니다."
 SHA_three_year_plan: "3개년 계획"
 SHA_three_year_plan_desc: ""
 SHA_shanhaijing_academy: "그라츠 대학"
 SHA_shanhaijing_academy_desc: ""
 SHA_promote_the_academy_currency: "학원 통화 장려"
 SHA_promote_the_academy_currency_desc: "불안정한 국제 정세 속에서 외부 의존도를 낮추기 위해서는 독자적인 통화 체계를 갖추는 것이 효과적인 방편이 될 수 있습니다. 그러나 새로 도입된 통화는 아직 산해경과 오스트리아의 도시 지역에서만 통용되고 있다는 한계가 있습니다. 농촌 지역까지 경제적으로 원활하게 통합하기 위해 오스트리아 실링을 산해경 통화로 교환할 것입니다."
 SHA_shanhaijing_trade_promotion: "산해경 체제 재수립"
 SHA_shanhaijing_trade_promotion_desc: "무분별한 무역 행위에 조정이 직접 나서기로 하였습니다. 학원과 국가 사이의 교역을 체계적으로 통제하기 위해 무역 거점을 단일화하고 해당 지점에 역량을 집중할 것입니다."
 SHA_protectionism: "산해경 보호무역"
 SHA_protectionism_desc: ""
 SHA_nationalization_school_assets: "타 학원 자산 국유화"
 SHA_nationalization_school_assets_desc: ""
 SHA_experimental_corporatism: "실험적 협동조합주의"
 SHA_experimental_corporatism_desc: ""
 SHA_the_south_unshackled: "속박에서 벗어난 남부"
 SHA_the_south_unshackled_desc: ""
 SHA_trade_with_neighborhood: "좋은 이웃과 무역"
 SHA_trade_with_neighborhood_desc: ""
 SHA_facilitating_exports: "도나우강 무역"
 SHA_facilitating_exports_desc: "오스트리아는 역사적으로 거대한 제국의 중심지였으며 그 자체로 하나의 거대한 경제 블록을 이루고 있었습니다. 제국이 붕괴한 이후에도 그 유산을 이어받은 헝가리, 유고슬라비아는 물론 이탈리아와 루마니아에 이르기까지 제국의 영향권 아래 있던 국가들과의 교역은 끊이지 않고 지속되었습니다. 다소 불리한 조건이 따르더라도 이 역사적 유대를 최대한 활용하여 번영된 미래를 열어나가야 합니다."
 SHA_expanding_alliances_with_merchants: "상인과 동맹"
 SHA_expanding_alliances_with_merchants_desc: "상인과 동맹을 해야하는 이유를 작성해드릴게요! ^-^"
 SHA_prosperous_south: "번영하는 남부"
 SHA_prosperous_south_desc: ""
 SHA_shanhaijing_railway: "산해경 철로"
 SHA_shanhaijing_railway_desc: "산해경과 오스트리아의 철도 궤간이 서로 맞지 않는다는 문제가 발견되었습니다. 열차 규격 역시 호환되지 않아 직통 운행이 불가능한 상황입니다. 특히 오스트리아 영토의 상당 부분이 험준한 산맥으로 이루어져 있어 수운을 대안으로 활용할 수도 없습니다. 이미 광범위하게 깔려 있는 오스트리아의 철도망을 뜯어고치는 것은 현실적으로 불가능에 가깝습니다. 따라서 산해경이 오스트리아의 표준 궤간에 맞춰 철로를 건설하는 것이 훨씬 더 효율적이고 경제적인 선택입니다."
 SHA_obb_argument: "오스트리아 연방 철도 인수"
 SHA_obb_argument_desc: "오스트리아 연방 철도는 오랫동안 국가의 무관심 속에 방치되어 온 기업이었습니다. 그러나 산해경과의 철로 연결 사업이 본격적으로 추진되면서 상황이 달라졌습니다. 오스트리아 연방 철도는 갑자기 상당한 수익을 창출하는 매력적인 사업체로 탈바꿈했습니다. 이제 산해경은 선택의 여지없이 이 기업을 인수해야 하는 상황에 놓였습니다. 좋든 싫든 오스트리아 연방 철도는 우리의 손에 들어올 것입니다."
 SHA_textile_industry: "섬유 산업 고급화"
 SHA_textile_industry_desc: ""
 SHA_building_restoration_project: "복구 작업: 중앙특구"
 SHA_building_restoration_project_desc: "산해경과 오스트리아의 전쟁은 도시 곳곳에 깊은 상처를 남겼습니다. 건물들은 크고 작은 피해를 입었습니다. 다행히 외벽만 손상되어 기능은 유지하고 있는 건물들도 있지만, 내부까지 완전히 파괴되어 폐허로 변한 곳들도 적지 않습니다. 전투의 흔적은 여전히 도시 전역에 생생하게 남아 있습니다. 이제 산해경은 차근차근 전쟁 이전의 모습을 되찾아가야 할 때입니다."

 SHA_austria_unemployment_relief: "오스트리아 실업자 구제"
 SHA_austria_unemployment_relief_desc: "오스트리아 정부가 끝내 해결하지 못한 실업 문제는 산해경 경제 전반에 걸친 심각한 위기로 번졌습니다. 일자리를 잃은 인구가 늘어날수록 가계 소득은 줄어들고 소비 역시 자연스럽게 위축됩니다. 상인 중심으로 돌아가는 산해경 경제는 공급은 넘쳐나는 반면 이를 받쳐줄 수요가 턱없이 부족한 구조적 불균형에 처해 있으며 그 결과 불황은 갈수록 깊어지고 있습니다. 이는 반드시 시급히 손을 써야 할 문제입니다."
 SHA_harness_austria_industrial_might: "오스트리아 산업 역랑 활용"
 SHA_harness_austria_industrial_might_desc: ""
 SHA_invest_in_erzberg_steel_mines: "$AUS_invest_in_erzberg_steel_mines$"
 SHA_invest_in_erzberg_steel_mines_desc: "$If_you_dont_write_here_I_ll_kill_you$"
 SHA_invest_in_semperit_synthetics: "$AUS_invest_in_semperit_synthetics$"
 SHA_invest_in_semperit_synthetics_desc: "$If_you_dont_write_here_I_ll_kill_you$"
 SHA_tungsten_minerals: "잘츠부르크 미터질 광산"
 SHA_tungsten_minerals_desc: ""
 SHA_alps_livestock_industry: "알프스 축산업"
 SHA_alps_livestock_industry_desc: "알프스산맥은 언뜻 보면 자연이 등을 돌린 듯 척박하여 천혜의 요새로나 활용될 법한 땅처럼 보입니다. 그러나 오스트리아 현지인들의 지혜에서 해답을 찾을 수 있었습니다. 이 지역에서는 소를 중심으로 한 낙농업이 일찍부터 발달해 있었으며, 고산지대 특유의 풍부한 목초지와 서늘한 기후는 축산업에 더없이 적합한 환경을 제공합니다. 우리는 이러한 잠재력을 바탕으로 축산업을 적극적으로 확대해 나갈 것입니다."
 SHA_raiffeisen_ag: "라이파이젠 협동조합"
 SHA_raiffeisen_ag_desc: "라이파이젠 협동조합은 농민을 위한 조합으로, 특히 동부 평야 지역을 중심으로 활발히 활동하고 있습니다. 농민들은 이 조합을 통해 대출을 받거나 가축 구매에 도움을 받는 등 라이파이젠은 농촌 경제의 든든한 토대가 되어주고 있습니다. 조합이 우리에게 우호적이지 않더라도 농민들의 신뢰를 얻기 위해 라이파이젠에 지원금을 제공할 것입니다."
 SHA_fertilizer_industry: "비료 산업 개발"
 SHA_fertilizer_industry_desc: ""
 
 SHA_courting_the_princess_of_industry: "산업의 공주 초청"
 SHA_courting_the_princess_of_industry_desc: "오스트리아 산업계에는 내로라하는 거물들이 즐비합니다. 그중에서도 '산업의 공주'라 불리는 인물은 특히 주목할 만합니다. 그녀가 우리 정부와 온전히 협력할지는 아직 미지수이지만 먼저 손을 내민다면 받아들일 가능성도 충분합니다."
 SHA_urban_housing_projects: "도시 주택 계획"
 SHA_urban_housing_projects_desc: "$If_you_dont_write_here_I_ll_kill_you$"
 SHA_shanhaijing_infrastructure: "산해경 도로망 건설"
 SHA_shanhaijing_infrastructure_desc: "오스트리아는 이미 탄탄한 도로망을 갖추고 있어 우리는 그 위에 살을 더하는 것으로 충분합니다. 특히 눈여겨볼 것은 인근 국가들과 연결되는 도로 사업입니다. 아직 완성되지 못한 채 멈춰 있는 이 사업을 우리가 이어받아 마무리 짓는다면 주변국들이 우리를 바라보는 시선도 조금은 달라질 것입니다."
 SHA_industrialization_effort: "고용 장려"
 SHA_industrialization_effort_desc: "오스트리아의 실업 문제는 해결 되었으며 상당한 투자로 고용"
 SHA_invest_in_kapsch: "캅슈 지원"
 SHA_invest_in_kapsch_desc: "요한 캅슈가 설립한 '캅슈'는 다양한 전자공학 장비를 개발·생산해 온 기업으로, 라디오를 자체적으로 생산할 수 있는 몇 안 되는 곳 중 하나입니다. 이러한 기술력을 키보토스의 통신 기술과 접목한다면 과연 어떤 결과물이 탄생할 수 있을까요? 무한한 상상력을 바탕으로 캅슈에 보조금을 지원하여 그 개발을 적극적으로 가속해 봅시다."

 # 산해경 군사 중점
 SHA_address_the_army: "[SHA.GetAdjective] 방위군 개편"
 SHA_address_the_army_desc: "오스트리아 연방군과의 전쟁에서 산해경 방위군의 심각한 결점이 드러났습니다. $SHA_MINA$의 노력으로 일부 현대화가 이루어졌지만, 전 세계적으로 긴장이 고조되고 군비 경쟁이 격화되는 지금, 군대를 현대적 수준으로 유지하기 위해 주저할 시간이 없습니다."

