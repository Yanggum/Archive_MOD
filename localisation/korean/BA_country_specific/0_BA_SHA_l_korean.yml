 SHA_senzu_bean_experiment: "실험 진행"
 SHA_senzu_bean_experiment_desc: "신선이 되기 위해 우리는 실험을 시작할 것입니다."
 SHA_senzu_bean_unethical_experiment: "비윤리적 실험 시행"
 SHA_senzu_bean_unethical_experiment_desc: "목표에 다가가기 위해서는 냉정해져야 합니다. 실험 방식이 비윤리적이고 보는 이들에게 불편함을 줄지라도, 그것이 목표에 가까워질 수 있는 길이라면 감수하고 추진해야 합니다."
 SHA_senzu_bean_budget_increase: "비용 충당"
 SHA_senzu_bean_budget_increase_desc: "신선이 되기 위한 약초의 조제에는 막대한 비용이 들며, 이는 개인이 감당하기 어려운 수준입니다. 따라서 우리는 이를 '국영 연구'로 명명하고, 국가 예산을 활용해 필요한 자금을 충당할 계획입니다."
 SHA_senzu_bean_herbalism: "약초 채집"
 SHA_senzu_bean_herbalism_desc: "신선이 되기 위해서는 몸에 좋다고 알려진 약초들을 채집하는 것이 필수적입니다. 특히 산 깊은 곳에서만 자라는 희귀한 식물들을 모아야 한다고 전해집니다. 이런 점에서 산악 지대가 풍부한 오스트리아의 지형은 약초 채집에 매우 적합한 환경이라 할 수 있습니다."
 SHA_senzu_bean_clinical_trials: "임상 실험"
 SHA_senzu_bean_clinical_trials_desc: "일부 순진한 이들을 대상으로 신선이 되기 위한 약재 실험을 진행할 예정입니다. 그들에게 약을 투여하고 나타나는 반응과 경과를 관찰함으로써, 우리는 목표에 한 걸음 더 다가갈 수 있을 것입니다."

 shakai.1.t: "신선이 되는 길"
 shakai.1.d: "'신선'이란, 신타니 카이가 추구하는 고유한 목표이자, 고대로부터 전해 내려온 '불로불사'의 존재를 의미합니다. 신선이 되기 위한 방법은 수십 가지가 존재한다고 전해지지만, 그 중 어떤 것도 실제로 작동하는지는 불확실합니다. 심지어 식용 수은과 같은 엉터리 방법조차 전통이라는 이름 아래 당연하게 여겨져 왔습니다.\n\n그러던 중, 신타니 카이는 신선이 되는 진정한 방법을 깨닫게 됩니다. 그녀의 뇌 속에서 번뜩인 한 순간의 기억이 뚜렷한 목표가 되었고, 그 기억을 쫓기 위해 여정을 시작하게 된 것입니다. 그러나 신타니 카이가 그 목표에 다다르기 전, 전임 문주가 이를 방해하고자 나섰고, 그 과정에서 산해경 전체에 재앙을 초래하고 말았습니다.\n\n결국 전임 문주는 실각하고 류우게 키사키가 새 문주로 즉위하면서 사태는 일단락되었고, 신타니 카이는 추방당해야 했습니다. 하지만 ‘대전이 사태’로 불리는 사건과 함께, 급진파와 연합한 경극부가 류우게 키사키를 몰아냈고, 순진한 보수주의자였던 우루시바라까지 축출한 뒤, 신타니 카이는 산해경의 실질적인 지배자로 떠오르게 됩니다.\n\n이제 신타니 카이는 오랜 숙원이었던 ‘신선’이 되기 위한 위대한 여정을 본격적으로 시작합니다. 그 길이 아무리 길고 험하더라도, 오직 목표만을 바라보고 나아간다면, 언젠가 반드시 그 끝에 도달할 수 있을 것입니다."
 shakai.1.a: "길고도 험한 길"

 shakai.2.t: "잡힌 실마리"
 shakai.2.d: "놀라운 결과가 우리 앞에 나타났습니다. '신선'이 되기 위해 실험을 계속하던 도중 하나의 실마리를 발견 하였습니다. 약을 만드는데에 크나큰 도움이 될 것입니다. "
 shakai.2.a: "조금만 더."


