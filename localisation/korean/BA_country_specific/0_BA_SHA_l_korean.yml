 SHA_principle_of_national_self-determination_1_desc: "주데텐란트 독일인들을 해방해야 합니다."
 SHA_principle_of_national_self-determination_2: "자치 평의회 공화국 설립"
 SHA_principle_of_national_self-determination_2_desc: "우리의 비독일 점령지를 자주적으로 통치할 자치 평의회 공화국들을 설립할 것입니다."
 SHA_principle_of_national_self-determination_3: "평의회 원칙" 
 SHA_principle_of_national_self-determination_3_desc: "여러 작은 단위의 노동자 평의회가 자치 평의회 공화국을 운영할 것입니다."
 SHA_principle_of_national_self-determination_4: "민주집중제"
 SHA_principle_of_national_self-determination_4_desc: "단일한 전위정당에 의해 자치 평의회 공화국이 통치될 것입니다."
 SHA_principle_of_national_self-determination_4_tt: "§Y자치 평의회§!가 지도자가 됩니다."
