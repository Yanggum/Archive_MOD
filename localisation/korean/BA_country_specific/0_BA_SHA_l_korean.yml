 SHA_defeat_industry_focus_1_desc: ""
 SHA_defeat_industry_focus_2: "가이가쿠 조약 재협상"
 SHA_defeat_industry_focus_2_desc: "가이가쿠 조약은 지나치게 가혹하며, 산해경의 성장 기반을 송두리째 잠식한 조약이 되었습니다. 이에 따라 산해경은 외교관들을 동원해 조약 재협상에 나설 것이며, 이전보다 덜 가혹한 방향으로 조정될 수 있도록 노력할 것입니다."
 SHA_add_HYA_SHA_huzika: "§Y가이가쿠 조약§! 체결"
 SHA_add_HYA_SHA_huzika_tt: "현재 일수 [?SHA_add_HYA_SHA_huzika:days|Y0]"
 SHA_defeat_industry_focus_3: "현무상회 제한 해제"
 SHA_defeat_industry_focus_4: "현무상회 지원"

 # 국민정신
 SHA_forlorn_hope: "결사대"
 SHA_encouraged_cooperatives: "협동조합 장려"
 SHA_encouraged_cooperatives_desc: ""
 SHA_exports: "수출 장려"
 SHA_exports_desc: "다소 껄끄러운 관계임에도 불구하고 오스트리아와 구 제국 국가들 간의 무역은 결코 가볍게 볼 수 없습니다. 이들의 투자가 가져오는 경제적 혜택은 산해경 경제에 상당한 활력을 불어넣고 있으며, 바로 그렇기에 우리는 이러한 무역과 교류를 적극적으로 장려해 나가야 합니다."
 SHA_merchant_alliance: "친상인 정책"
 SHA_merchant_alliance_desc: ""
 SHA_foreign_assets: "타 학원 자산 국유화"
 SHA_foreign_assets_desc: ""
 SHA_austrian_unemployment_idea_base: "1935년 협상이 타결되면서 오스트리아는 산해경의 일반 지방보다는 높되 구성국보다는 낮은 애매한 지위를 부여받았으며, 행정의 여러 부문에 걸쳐 육화각의 지배 아래 놓이게 되었습니다. 그러나 이 협정은 단순히 영토와 주권의 문제만을 남긴 것이 아니었습니다. 오스트리아가 안고 있던 고질적인 문제, 바로 대규모 실업이라는 무거운 짐까지 산해경이 고스란히 떠안게 되었습니다.\n\n"
 SHA_austrian_unemployment_idea: "대규모 오스트리아인 실업"
 SHA_austrian_unemployment_idea_desc: "$SHA_austrian_unemployment_idea_base$산해경은 이 문제를 해결하기 위해 다방면에 걸쳐 행정력을 쏟아붓고 있으나, 그 해결의 실마리는 아직 요원해 보입니다. 근본적인 어려움은 산해경의 경제 구조 자체에 있습니다. 본래 상인 중심으로 움직여온 산해경의 경제 체제는 민간 주도의 유연성을 장점으로 삼아왔으나, 대규모 실업을 단기간에 해소할 만한 일자리를 자발적으로 창출하기에는 한계가 뚜렷합니다. 결국 상인들의 자율에만 기댈 수 없는 상황에서, 현룡문이 직접 개입하여 국가 주도로 대규모 일자리를 강제적으로 창출하는 것 외에는 마땅한 대안이 보이지 않는 실정입니다."
 SHA_austrian_unemployment_idea2: "오스트리아인 실업"
 SHA_austrian_unemployment_idea2_desc: "$SHA_austrian_unemployment_idea_base$현룡문이 마침내 본격적으로 움직이기 시작했습니다. 오스트리아 실업자 구제를 위한 방안으로 소득 보장, 일자리 창출, 고용 시장 안정화 등 여러 정책을 면밀히 검토하고 하나씩 실행에 옮기고 있습니다. 현룡문의 직접적인 주도 아래 오스트리아 현지에서도 이 정책들을 지역 실정에 맞게 변형하고 적용하면서 실업자 구제에 적극적으로 나서고 있습니다. 그러나 이 정책들이 가시적인 성과를 드러내기까지는 상당한 시간이 필요할 것입니다."
 SHA_austrian_unemployment_idea3: "숙련된 노동자"
 SHA_collapsed_economy_base: "키보토스에서 상업이 가장 발전한 학원이라 해도 과언이 아닐 만큼 산해경의 상업은 오랜 번영을 누려왔습니다. 그러나 현룡문의 강압적인 통제와 특정 구역에만 허용된 제한적 무역 정책은 산해경만의 독특한 경제 구조를 형성하였고, 겉으로는 안정적으로 보였지만 내부적으로는 상인들의 불만이 서서히 쌓여가고 있었습니다."
 SHA_collapsed_economy: "붕괴한 산해경 경제"
 SHA_collapsed_economy_desc: "$SHA_collapsed_economy_base$\n\n그리고 마침내 모든 것을 끝장낸 사건이 발생했습니다. '대전이 사태'로 불리는 전대미문의 사건은 산해경 경제를 요람에서부터 질식시키기에 충분했습니다. 무역로는 끊겼고 상권은 붕괴되었으며, 오랜 시간 쌓아온 번영은 순식간에 무너져 내렸습니다. 위기 속에서 상인들은 급진적으로 변하고 있습니다. 생존을 위해 과거의 질서를 거부하고 새로운 방식을 요구하는 목소리가 커지고 있습니다. 더 급진적인 세력이 상황을 장악하여 통제 불능 상태에 빠지기 전에 현룡문의 과감한 개입이 반드시 필요합니다."
 SHA_collapsed_economy_idea2: "회복중인 산해경 경제"
 SHA_collapsed_economy_idea2_desc: "$SHA_collapsed_economy_base$\n\n이러한 내부의 불안정에 대전이 사태라는 악재까지 겹치며 산해경의 경제는 뿌리째 흔들렸습니다. 다행히 현룡문의 적극적인 개입 덕분에 추락을 간신히 멈추고 회복의 조짐을 보이기 시작했으나, 최악의 붕괴를 막아낸 것만으로 만족해서는 안 됩니다. 위기를 넘긴 것은 출발점에 불과합니다. 이제는 산해경을 과거보다 한 단계 높은 수준으로 끌어올려 진정한 경제 부흥을 이루어내야 할 때입니다."
 SHA_collapsed_economy_idea3a: "초기 자본주의 경제"
 SHA_collapsed_economy_idea3a_desc: "$SHA_collapsed_economy_base$\n\n외국인이 제공하는 경제적 기회를 포착하였다면 이를 최대한 활용해야 합니다. 우호적인 교역 상대와의 무역을 통해 유치된 해외 자본은 우리 경제의 지속적인 발전을 뒷받침하는 든든한 원동력이 되고 있습니다."
 SHA_collapsed_economy_idea4a: "산해경 경제 기적"
 SHA_collapsed_economy_idea4a_desc: "$SHA_collapsed_economy_base$\n\n다른 지역들이 한 줌의 부스러기를 차지하려 다투는 동안, 중앙특구와 산해경은 시대의 어둠 속에서도 언덕 위의 빛나는 도시처럼 홀로 우뚝 빛나고 있습니다. 우리의 번영이 영원히 이어지기를!"
 SHA_collapsed_economy_idea3b: "학원 육성 경제"
 SHA_collapsed_economy_idea3b_desc: "$SHA_collapsed_economy_base$\n\n상인들이 주도하던 산해경의 경제 구조는 외부 위협에 취약하다는 사실이 1935년의 전대미문한 사태를 통해 여실히 드러났습니다. 이에 경제 전반에 대한 개입을 강화하여 무역과 경제 관리 양 측면에서 완전한 자급자족을 목표로 나아가고 있습니다."
 SHA_collapsed_economy_idea4b: "학원 재건의 심장"
 SHA_collapsed_economy_idea4b_desc: "$SHA_collapsed_economy_base$\n\n산해경의 경제는 다른 학원들도 충분히 본보기로 삼을 만합니다. 아직 완전한 자급자족에 이르지는 못했으나 재앙적인 경제 위기의 여파를 되돌리는 데 있어 괄목할 만한 진전을 이루고 있습니다. 산해경이 경제 재건의 모범으로 자리매김할 수 있도록 힘써 나갑시다."
 SHA_increased_taxes_idea: "인상된 세금"
 SHA_pare_military_spending_idea: "군사 지출 감축"
 SHA_industrial_relief_idea: "상인 구제"
 SHA_three_year_plan_idea: "3개년 계획"
 SHA_mitlaeufer: "미트로이퍼"
 SHA_mitlaeufer_desc: "'부역자들' 혹은 '부역자'를 뜻하는 독일어 미트로이퍼, 혹은 미틀뢰퍼는 본래 단순한 사전적 표현에 불과했으나, 이제는 오스트리아 정치인들을 가리키는 경멸적인 낙인으로 그 의미가 변모하였습니다.\n\n오스트리아 정부가 현룡문과 맺은 굴욕적인 조약의 결과로, 이들은 사실상 현룡문에 '협력'하는 처지에 놓이게 되었습니다. 이들은 오스트리아 관련 정책에 의견을 개진하고 수정을 요구할 수 있는 제한적인 권한을 부여받고 있습니다. 그러나 그것은 어디까지나 현룡문이 허용한 범위 안에서의 발언에 그칠 뿐, 오스트리아가 처한 근본적인 현실을 바꾸기에는 역부족입니다."
 SHA_legitimacy_of_genryumon_1: "현룡문의 정통성: §8의문투성이§!"
 SHA_legitimacy_of_genryumon_1_desc: ""

 SHA_shanhaijing_isolation: "산해경 고립주의"
 SHA_shanhaijing_isolation_desc: "산해경의 고립주의는 하루아침에 형성된 것이 아닌, 오랜 세월에 걸쳐 뿌리내린 산해경만의 독특한 문화적 특성입니다. 요식업과 관광업을 중심으로 한 상인 업계가 발달해 있으나, '산해경 체제'라 불리는 독자적인 운영 방식 아래 상인들은 현룡문이 지정한 구역 안에서만 활동하며 외부인과의 거래 역시 그 범위 내에서만 허용됩니다. 외부와의 접점은 존재하되, 철저히 통제된 틀 안에서만 이루어지는 것입니다.\n\n문화 교류의 방식 또한 이러한 특성을 고스란히 반영하고 있습니다. 산해경의 교류는 학원과 학원 사이의 공식적인 차원이 아닌, 어디까지나 학생과 학생 사이의 비공식적인 수준에 머무릅니다. 총학생회를 통한 공식 창구를 제외하면 외부와의 체계적인 교류는 사실상 존재하지 않는다고 해도 과언이 아닙니다. 이처럼 산해경은 완전한 폐쇄도, 완전한 개방도 아닌 독자적인 방식으로 외부 세계와의 거리를 유지해 왔습니다."
 SHA_Eastern_Alchemy_Society_idea_desc: "연단방은 산해경에 등장하는 연단술을 연구하는 동아리입니다. 겉으로는 다소 비과학적으로 보일 수 있지만, 실제로는 현대적인 화학과 생물학 연구소에 가깝습니다. 이들의 궁극적인 목표는 불로불사의 영약을 만드는 것이며, 이를 위해 다양한 영약을 실험적으로 만들어내고 있습니다.\n\n물론 불로불사가 실현 불가능에 가깝다는 사실을 알고 있지만, 의도적으로 목표를 높게 설정함으로써 연구 과정에서 새로운 시도를 하고 중요한 발견을 이끌어내고자 합니다."
 SHA_Eastern_Alchemy_Society_low: "낮은 연단방 예산"
 SHA_Eastern_Alchemy_Society_low_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_medium: "높은 연단방 예산"
 SHA_Eastern_Alchemy_Society_medium_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_high: "매우 높은 연단방 예산"
 SHA_Eastern_Alchemy_Society_high_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$\n\n최근 학생들 사이에서 우려의 목소리가 커지고 있습니다. 현 정부가 연단방에만 의도적으로 예산을 집중 지원하면서, 다른 동아리들이 제 역할을 하지 못하고 있다는 소문이 퍼지고 있기 때문입니다. 물론 연단방에 충분한 예산을 지원하면 국가 발전에 기여할 가능성이 크지만, 시민들의 불만과 사회적 혼란을 피하기는 어려울 것입니다."
 SHA_Eastern_Alchemy_Society_super_low: "연단방 예산 삭감"
 SHA_gathering_of_radicals_idea: "급진파 결집"
 SHA_gathering_of_radicals_idea_desc: "급진파가 하나의 정치적 구색을 가지고 결집하고 있습니다. 이들이 무슨 꿍꿍이인지는 모르겠지만 현 키사키 문주에게는 별로 좋은 소식은 아닌거 같습니다."
 SHA_emergency_measures_idea: "비상조치"
 SHA_emergency_measures_idea_desc: "점점 더 공격적으로 변하는 세상에서 기회를 잡기 위해, [SHA.GetNameDef](은)는 국가의 요구 사항을 충족할 수 있는 상당한 산업 역량을 신속하게 구축해야 합니다."
 SHA_walking_the_dragon: "산해경 보수혁명"
 SHA_Black_Tortoise_Promenade: "현무상회"
 SHA_Black_Tortoise_Promenade_desc: "키보토스 전역의 식자재가 모이는 상인연합회로, 산해경에서도 으뜸가는 미식의 명소로 꼽힙니다. 이런 특징 덕분에 산해경 전통 요리뿐만 아니라 키보토스의 다양한 식문화를 섭렵하고 있습니다.\n\n그러나 이러한 과정에서 자연스럽게 개방적인 성향을 드러내기 때문에, 현룡문을 비롯한 보수파들에게 배척받고 있습니다."
 SHA_Black_Tortoise_Promenade_BfG: "현무상회(자유조합연대)"
 SHA_Black_Tortoise_Promenade_BfG_desc: "키보토스 전역의 식자재가 모이는 상인연합회로, 산해경에서도 으뜸가는 미식의 명소로 꼽힙니다. 이런 특징 덕분에 산해경 전통 요리뿐만 아니라 키보토스의 다양한 식문화를 섭렵하고 있습니다.\n\n그러나 이러한 과정에서 자연스럽게 개방적인 성향을 드러내기 때문에, 현룡문을 비롯한 보수파들에게 배척받고 있습니다."
 SHA_communism_party_volsheviks_long: "산해경 공산당"
 SHA_communism_party_volsheviks: "공산당"
 SHA_suppressed_Black_Tortoise_Promenade: "억제된 현무상회"
 SHA_suppressed_Black_Tortoise_Promenade_desc: "키보토스 전역의 식자재가 모이는 상인연합회로 명성을 떨치던 동아리이었습니다만, 현재는 산해경의 현룡문 통제를 받고 있습니다. 조금이라도 현룡문의 전통에서 벗어나는 행위는 철저한 규제의 대상이 되며, 이로 인해 정치적 기반을 사실상 완전히 상실했습니다.\n\n한때 키보토스의 다양한 식문화를 선도하던 상인연합회는 이제 과거의 영광을 그리워하며, 보수적인 제약 속에서 겨우 명맥을 이어가고 있습니다."
 SHA_Shanhaijinfascism: "신타니 카이 이론"
 SHA_Shanhaijinfascism_desc: "신타니 카이가 실험 중인 '신타니 카이 이론'은 산해경 고급중학교를 근본부터 완전히 재구성하는 것을 목표로 하고 있습니다. 이 이론은 사회 전반을 철저한 계획 아래에 두려 하며, 기술가속주의를 앞세워 윤리적 제약마저 무시한 채 과감하게 추진되고 있습니다."
 SHA_corporate_state_idea: "유기적 국가 건설"
 SHA_daily_ideologiy_excluding_neutrality: "매일 비동맹주의를 제외한 이념 지지도 §R-0.05§!"
 SHA_corporate_state_idea_6: "보수주의의 성채"
 SHA_supreme_economic_council: "중앙경제위원회"
 SHA_ASFTU: "전국총공회"
 SHA_clash_of_civilizations_idea: "문명의 충돌"
 SHA_clash_of_civilizations_idea_desc: "전 세계적으로 퍼진 퇴폐적인 민주주의라는 질병이 우리의 살점을 썩게 만들고 있습니다. 그렇기에 우리는 혁명의 기수가 되어, 진정한 보수적 가치를 이들에게 심어주어 더 나은 세상을 만들어야 합니다."
 SHA_Shintani_kais_cult_of_personality_ns: "개인숭배"
 SHA_domestic_air_production: "항공기 생산 집중"
 SHA_shadow_of_Shintani_Kai: "신타니 카이의 그림자"
 SHA_shadow_of_Shintani_Kai_desc: "신타니 카이를 복권시켰다는 것이 확실시 되자 산해경은 그녀가 존재한다는 사실 하나만으로 공포에 떨며 현 정부를 불신하고 있습니다."
