 # 이벤트
 shacom.1.t: "오스트로 맑시즘"
 shacom.1.d: "1934년의 2월 봉기 이후, 오스트리아 땅에 좌익 세력은 궤멸에 이르렀습니다. 파시스트 정권 아래 노동자-농민-지식인 계층은 신음하고 있었으며, 민주주의의 불꽃은 한순간에 꺼졌습니다. 그러나 대전이가 오스트리아를 강타하며 상황은 달라졌습니다. 산해경의 매서운 공세에 오스트리아 지도부는 회복할 수 없는 타격을 입었으며, 이는 현지 좌익들에게 새로운 기회가 되었습니다. 민간 부문에서 좌익 조직들은 34년 이전의 영향력을 되찾기 위해 고군분투하고 있으며, 현무상회 좌파와의 연계는 이에 큰 도움이 될 것입니다."
 shacom.1.a: "변혁의 바람을 맞이하라!"
 shacom.2.t: "붉은 빈"
 shacom.2.d: "전간기 내내 빈은 좌익 정당에 의해 자치를 이루었습니다. 빈에서는 규모의 공공부조 정책이 실험도입되었으며, 이윽고 정착되어 시민들이 편의를 증진시켰습니다. 그러나 파쇼들의 집권 이후 이 모든 건 물거품이 되었습니다. 현재 빈의 노동자들은 현무상회 좌파를 지지하고 있습니다. 이들을 조직하고 빈에서 기반을 다지는 것은 다가올 혁명에 있어서 큰 도움이 될 것입니다."
 shacom.2.a: "궐기를 대비하자!"
 shacom.3.t: "중앙 광장에서의 충돌" 
 shacom.3.d: "지난 달 4일, 현룡문의 봉건적 통치에 반대하고 공화정의 복귀를 외치는 수 천의 시민이 중앙특구의 광장에 모여 집회를 개최했습니다. 현룡문의 집행부는 해산 명령 이후 이들을 향해 발포했으며, 이때문에 수 십의 시민이 다쳤습니다. 시위대는 와해되었으나 시민들은 4일의 총성을 똑똑히 기억하고 있습니다."
 shacom.3.a: "압제에 저항하라!"
 shacom.4.t: "평의회 운동"
 shacom.4.d: "18년부터 20년까지 유럽 각국에서는 노동자, 농민, 병사가 자발적으로 구성한 평의회를 통해 다수의 사회정치적 변혁이 시도되었습니다. 독일, 헝가리, 오스트리아에서의 이러한 시도들이 모두 좌절되었지만 우리는 그 유산을 이어받을 것입니다. 노동계급의 지배자는 노동계급 그 자신입니다!"
 shacom.4.a: "평의회 공화국을 향해!"
 shacom.5.t: "자유조합연대의 새 지도자"
 shacom.5.d: "아케시로 루미는 우유부단한 성격으로 말미암아 조합원들의 급진적인 일반의지를 반영치 못 했습니다. 우리는 적색 조합으로 조직을 이끌 마땅한 지도자를 새로이 선출해야 합니다!"
 shacom.5.a: "카야마 레이죠!"
 shacom.5.b: "오토 바우어!"
 shacom.5.c: "야쿠시 사야..?"
 shacom.6.t: "이데올로기 투쟁"
 shacom.6.d: "약화되거나 궤멸되었던 노동조합들이 재설립되면서 조합 간의 이데올로기 투쟁 또한 수면 위로 다시 떠올랐습니다. 이 땅에서 노동조합 운동을 시작했던 좌익 이데올로기에 복무하는 적색 노조는 보다 광범위한 노동조합의 권한을 주장하지만, 정부와의 협력과 제한된 노동조합의 권한을 지지하는 가톨릭 노동조합은 이들에 반대하고 있습니다."
 shacom.6.a: "적색 노조를 지원하자."
 shacom.6.b: "가톨릭 노조를 지원하자."
 shacom.7.t: "현룡문의 운명"
 shacom.7.d: "산해경 고급중학교의 통치기구, 즉 학생회로서 기능하던 현룡문은 사회주의 적위대에 의해 무너져내렸으며, 곧 최고평의회에서 현룡문의 해산을 선언했습니다. 다만 현룡문의 임원들의 처우에 대한 견해는 이들을 가둬두는 것과 노동을 통해 교화하는 것 둘로 나뉘어져 거론되고 있습니다."
 shacom.7.a: "그들은 죗값을 치뤄야 한다."
 shacom.7.b: "노동은 교화다!"
 shacom.8.t: "프롤레타리아 문화양식"
 shacom.8.d: "봉건주의-자본주의 체제 하에서 전개되는 문화양식은 더 이상 사회주의 산해경 아래 유효하지 않습니다. 이제는 사실주의에 기반한 '사회주의적' 문화양식을 사회적으로 적극 장려할 필요가 있습니다. 그 시작은 경극부 내부 혁신이 될 것입니다."
 shacom.8.a: "민중예술로 나아가자!"
 shacom.9.t: "공공돌봄"
 shacom.9.d: "일반적인 구체제에서 아이에 대한 돌봄이라는 것은 대표적으로 여성에게 떠넘겨진 문화였습니다. 하지만 이러한 수준 낮은 문화란 결코 신사회에서 수용할 수 없음은 분명합니다.\n\n우리는 그러하기에 이미 산해경 전국에서 저명한 '매화원' 기구를 이용하기로 결정했습니다. 이번에 새로이 확대될 '붉은 매화원' 기구는 단순히 키보토스인들을 위해 제공되는 아동 육아 돌봄 서비스가 아닌, 인류에게도 서비스의 범위가 확대된 새로운 형태의 아동 돌봄 서비스일 것입니다.\n\n붉은 매화원은 설립 직후부터 수많은 오스트리아의 어머니들에게서 지지를 받고 있으며, 우리는 이를 통해 현지인들과의 조화에 한발짝 더 다가감과 동시에 새로운 학원의 기반이 될 아이들에게 '바람직한 사고'를 하도록 유도할 수 있을 것입니다."
 shacom.9.a: "이건 혁신이야."
 shacom.10.t: "진보는 나의 힘!"
 shacom.10.d: "야쿠시 사야는 정치에 입문하기로 결정했습니다."
 shacom.10.a: "기술 관료로군."
 shacom.10_tt: "\n§Y야쿠시 사야§!를 §Y민주주의 지도자§!로 §G해금§!할 수 있게 되었습니다.\n§Y야쿠시 사야§!를 §Y공산주의 지도자§!로 §G해금§!할 수 있게 되었습니다."
 shacom.11.t: "리히텐슈타인 장악"
 shacom.11.d: "리히텐슈타인은 우리와 서쪽으로 인접한 공국으로서 자주권을 행사하고 있었습니다. 그러나 불안정한 포위상태에 놓여있다는 편집증적인 불안이 적위대에 퍼지게 되었고, 그로 말미암아 적위대 사단 일부가 자발적으로 리히텐슈타인을 향해 진군하였습니다. 무의미한 소규모 저항은 가볍게 제압되었으며 공작가와 고위 사제들은 망명을 떠났습니다. 다만 저항을 우려하여 시민들에게는 신앙의 자유와 폭넓은 자치권이 부여되었으며, 그들은 적위대가 주둔한다는 점을 제외하고는 이전과 다름없는 일상을 살아갈 것입니다."
 shacom.11.a: "개별행동을 저지해야 한다."
 shacom.12.t: "룩셈부르크의 유산"
 shacom.12.d: "폴란드 태생 독일 혁명가이자 사회주의 이론가인 로자 룩셈부르크는 일찍이 1906년에 '대중파업론'을 저술하며 노동자 공화국으로 향하는 길이 어때야 하는지에 관해 제시했습니다. 선제적 조건들이 갖춰진다면, 조직되지 않은 노동자더라도 규모의 정치적 파업에 참여하여 가공할 압력을 가할 수 있습니다. 우리는 빈을 비롯해서 주요 도시에 파업을 일제히 개시하여 산업을 정지하고 경제를 마비시키며 압제자들에게 패배를 안겨줄 것입니다!"
 shacom.12.a: "모두 화염병을 준비해!"
 shacom.13.t: "승리한 파업"
 shacom.13.d: "대중적 열기에 의해 다수의 학생들 또한 우리의 대의에 동참하게 되었고, 이는 언제든 무력조직이 파업세력과 결탁할 수 있게 하여 현룡문이 군사적 수단을 사용하기 어렵게 하였습니다. 현룡문은 여러 차례 타협을 시도했지만 그들은 노동자들의 강철 같은 비타협주의 테제를 뚫어낼 수 없었습니다. 이윽고 조직된 적위대가 현룡문을 아무런 저항없이 습격하였습니다. 현룡문의 임원들은 자신들의 패배를 직감하고 망명하거나 투항하였으며, 혁명은 승리했습니다!"
 shacom.13.a: "이것이 대중파업의 힘이다."
 shacom.14.t: "민족 자결의 원칙"
 shacom.14.d: "중유럽에 당당히 사회주의를 외쳐나간 우리 산해경은 민족 단위의 억압과 핍박, 제국주의를 연대하여 싸워야 합니다. 한편, 오스트리아는 독일인들의 민족 국가로서 기능하고 있으며, 이는 우리가 중유럽의 다른 독일인 거주 지방에의 영유권을 지니고 있음을 암시합니다. 우리는 우리의 정당한 영토를 되찾아와야 합니다!"
 shacom.14.a: "민족 해방으로!"
 shacom.15.t: "제2인터내셔널"
 shacom.15.d: "제2인터내셔널은 1889년에 창립되어 1916년에 해산한 국제 사회주의 정당 연합체였습니다. 비록 스탈린주의자들의 제3인터내셔널이 건재하지만, 이들의 사회주의 이상은 우리의 것과 확연히 다릅니다. 우리는 제2인터내셔널을 재건함으로써 '산해경 사회주의'를 국제적으로 실천하며, 맑스주의 원칙을 실현해 나아갈 것입니다!"
 shacom.15.a: "역사적인 순간이다."
 shacom.16.t: "주변의 위협"
 shacom.16.d: "우리가 일궈낸 혁명의 불꽃은, 너무나 위태롭습니다. 동서남북 어디에도 우리의 혁명을 지원해줄 동지들은 없으며, 오히려 우리의 머리에 반혁명의 도끼를 찍어내릴 적들만 가득합니다. 우리의 이웃들은 우리가 가고자 하는 길을 향하는 것을 두려워하고 있습니다. 도리어 권위주의 정권의 헝가리나 파쇼 정권의 이탈리아는 그들의 '파시스트 오스트리아'의 재건을 명분으로 우리를 침공해 올지도 모릅니다. 어느 쪽이 되었건 그들은 우리의 사회주의를 두려워하고 있으며, 이는 동방에서 있었던 1919년의 반혁명과 같이 동시다발적인 침공으로 이루어질 것입니다. 우리는 이에 대비해야만 합니다! 우리는 우리 스스로의 역량을 최대한으로 발휘하여 이러한 주변의 위협을 저지하고 주변국의 억압받는 노동계급을 해방해야 합니다."
 shacom.16.a: "시간이 없다!"
 shacom.16_tt: "§Y720§!일 뒤에 우리의 §t적대적인 이웃 국가§!들이 우리를 공격할 것입니다! 우리는 다양한 방법을 통해 그들의 §Y공격 시기§!를 늦출 수 있습니다."
 shacom.17.t: "적색 공포"
 shacom.17.d: "우리 옆에 불편한 이웃 [SHA.getname]이 자리잡았습니다. 그들은 인접국에서 파업과 혁명을 선동하고 있으며, 우리는 이러한 공격에 맞서야 만 합니다. 적정한 시기가 되면, 다른 인접국들과 힘을 합쳐 국가 전복의 위협보다 빠르게 그들을 선제적으로 굴복시킬 수 있을 것입니다."
 shacom.17.a: "반공은 굳건하다!"
 shacom.18.t: "공세"
 shacom.18.d: "때가 되었습니다. 우리는 [SHA.getname]을 향해 공세를 가할 수 있습니다!"
 shacom.18.a: "진군!"
 shacom.18.b: "아직은 안 된다."
 shacom.19.t: "마르크스주의자들의 방해"
 shacom.19.d: "국내의 마르크스주의자들의 결집과 더불어 이에 동조하는 시민사회로 말미암아 우리는 반공 공세 계획을 취소할 수밖에 없게 되었습니다."
 shacom.19.a: "아쉽게 되었군."
 shacom.20.t: "혁명전쟁"
 shacom.20.d: "우려하던 일이 일어나고야 말았습니다. 그러나 [SHA.getname]의 전 인민대중이 일반의지로써 일어나서 반혁명의 공세를 버텨낼 것입니다!"
 shacom.20.a: "반혁명을 저지하자!"
 shacom.21.t: "프롤레타리아 독재"
 shacom.21.d: "사회주의로의 체제 전환 이후에 우리는 소비에트와의 협력을 강화하기로 결정하면서 소비에트 방식의 혁명론을 채택하는 것이 바람직하다는 결론을 내렸습니다. 레닌과 스탈린의 사상에 따라 체제 전반이 개조될 것이며, 일부 반대 의견은 민주집중제에 의해 일시적으로 금지될 것입니다."
 shacom.21.a: "\"모두 필요에 따른 행동이다.\""
 shacom.22.t: "\"대약진!\""
 shacom.22.d: "주변의 수많은 적들을 상대하기 위해서 당은 소련의 스타하노프 운동을 모방한 '대약진 운동'을 금년 정치사업으로 채택하기로 하였습니다. 우리는 수 년 안에 유럽과 키보토스에서 결코 무시하지 못 할 강국으로 거듭날 것입니다! 당의 지시에 따라 대약진 운동의 계획이 전방위 전부문에서 쓰여졌으며, 모든 곳에서 '높게 도약할' 것입니다!"
 shacom.22.a: "당과 서기장 동지를 믿고 따르자!"
 shacom.23.t: "참새"
 shacom.23.d: "여느 때와 같이 [SHA.getleader]는 노동자 대중의 작업 현장으로 시찰을 나갔다. 이번 시찰에서는 최근에 진행되고 있는 대약진 운동에 따른 농업 현황을 살펴보기 위해서 농촌을 방문했는데, [SHA.getleader]는 충격적인 광경을 목격했다. 바로 작은 새가 곡식을 쪼아먹고 있는 것이었다. 이와 같은 모습을 같이 목격한 당 관료들은 [SHA.getleader]에게 작은 새들을 농촌에서 몰아내도록 하자고 주장했고, [SHA.getleader]는 이러한 주장에 대해 깊이 고민했다."
 shacom.23.a: "\"귀여우니깐, 놔둬도 괜찮아!\""
 shacom.24.t: "발견된 인민공사의 비효율성"
 shacom.24.d: "순진히 진행되고 있다고 보여지는 농업 집단화 과정에서 관료제의 비효율성이 드러났습니다! 집단화 과정에서 농민들의 근로 의욕이 심각하게 저하된 것이 발견되었으며, 우리는 이 문제를 해결하기 위해서 처음부터 다시 접근해야 할 것입니다!"
 shacom.24.a: "젠장!"
 shacom.25.t: "문화혁명에 심취한 학생들"
 shacom.25.d: "문화혁명은 자본주의와 봉건제적 상부 구조, 이데올로기, 법률, 예술 등의 문화 양식으로부터 신체제, 전위적인 부문으로의 이행입니다. 이는 의식적인 측면에서 이루어져야 한다는 당의 논리에 따라 학생들은 새로이 교육받고 혁명에 열렬한 전사로 거듭났습니다. 그러나 이러한 과정에서 일부 극단적인 학생들이 더 급진적인 권위의 해체를 외치며 좌경맹동적인 행동을 보였습니다. 이들은 소규모 반달리즘 테러행위로써 현지의 문화 유산을 훼손하고 다니면서 사회적인 문제가 되었는데, 이윽고 호프부르크 궁전이 그들의 의해 점거되었고, 학생들은 농성에 돌입하게 되었습니다. 이는 금방 진압되었지만 당은 정책을 재검토할 필요성을 인식했습니다."
 shacom.25.a: "혈기왕성하군."
 shacom.26.t: "대약진 운동의 결과"
 shacom.26.d: "당이 계획한 시간이 되었습니다. 당은 대약진 운동에 대한 평가를 진행하고 있습니다."
 shacom.26.a: "모두 우리의 선택에 따른 결과다."
 shacom.26_tt_1: "§Y대약진 운동: 농업집단화§!가 §G완료되었습니다:§!\n"
 shacom.26_tt_2: "§Y대약진 운동: 농업집단화§!를 §R완료하지 못 했습니다:§!\n"
 shacom.26_tt_3: "\n§Y대약진 운동: 무기생산 가속§!이 §G완료되었습니다:§!\n"
 shacom.26_tt_4: "\n§Y대약진 운동: 무기생산 가속§!을 §R완료하지 못 했습니다:§!\n"
 shacom.26_tt_5: "\n§Y대약진 운동: 문화혁명§!이 §G완료되었습니다:§!\n"
 shacom.26_tt_6: "\n§Y대약진 운동: 문화혁명§!을 §R완료하지 못 했습니다:§!\n"
 shacom.26_tt_7: "\n§Y대약진 운동: 군제개혁§!이 §G완료되었습니다:§!\n"
 shacom.26_tt_8: "\n§Y대약진 운동: 군제개혁§!을 §R완료하지 못 했습니다:§!\n"
 shacom.26_tt_9: "\n§G모든 대약진 운동을 완료했습니다!§!\n"
 shacom.27.t: "가톨릭교도 저항"
 shacom.27.d: "우리의 산해경에 대한 새로운 노선을 일찍이 경계했던 오스트리아 현지 가톨릭 세력은 행동에 들어가기로 결심했습니다. 가톨릭은 교회와 교도 간의 강한 조직력을 동원해서 농촌을 중심으로 우리의 대의에 반대한 정치적 결사를 이루고 있습니다."
 shacom.27.a: "젠장!"
 shacom.28.t: "가톨릭교도 저항 분쇄"
 shacom.28.d: "지난 기간동안 우리의 정치적 반대 결사였던 가톨릭 교회의 저항을 우리는 가시적으로 격퇴해내었습니다. 이제 그들의 남은 끄나풀들을 법률적 수단과 경제적 수단을 통해 짓밟고 저항의 여지를 온전히 분쇄할 것입니다!"
 shacom.28.a: "투쟁!"
 shacom.29.t: "농촌사회주의"
 shacom.29.d: "기성 오스트로 맑시즘 내지는 사민주의의 문제점은 농촌에서의 선전 활동을 적극적으로 펼치지 않았다는 점입니다. 이전까지 농민들은 가톨릭 세력과 결합하여 사회 진보를 저지하는 계급의 적으로 인식되었지만, 우리는 이제부터 이들을 적극적으로 포섭하여 혁명적 농민운동을 조직할 것입니다."
 shacom.29.a: "좋군."

 shafas.1.t: "경극부의 쿠데타!"
 shafas.1.d: "\"산해경의 전통의 이름 아래, 현룡문의 문주 $SHA_KISAKI$, 규탄한다!\"\n\n경극이 예정되었던 운명의 날, 백호 광장에는 수백의 관중과 경극부가 운집했습니다. 그러나 이날 선보인 경극은 단순한 공연이 아니었습니다. 이는 현 산해경 현룡문의 문주인 $SHA_KISAKI$를 \"검은 군주\"에 비유하며 직접적으로 겨냥한 날카로운 풍자극이었습니다.\n\n경극의 줄거리는 어리석은 검은 군주가 변혁의 바람을 맞이하겠다며 성문을 함부로 열어 난세를 초래하고 백성을 혼란에 빠뜨린다는 내용이었습니다. 공연은 무대 위에서 펼쳐지는 환상적인 장면들과 함께 문주를 향한 강렬한 비판의 메시지를 담아냈습니다. 경극이 끝나자마자 광장은 함성으로 들끓었고, 현룡문의 급진파와 보수파들이 본격적으로 활동하기 시작하였습니다.\n\n결국 이 날의 공연은 단순한 경극이 아닌 혁명의 신호탄이 되었습니다.. 급진파와 보수파들은 경극부와 합세하여 백호 광장에서 문주 $SHA_KISAKI$의 축출을 선언했고, 현장은 혼란과 분노로 뒤덮였습니다.\n\n현재 $SHA_KISAKI$는 VIP 자택에 연금된 상황입니다. 전 문주라는 지위 덕분에 일정한 예우를 받고 있는 상황입니다. 그러나 그의 몰락 이후 산해경의 미래는 여전히 안갯속에 가려져 있습니다. 새롭게 문주의 자리에 오른 $SHA_KAGUYA$의 정책 방향이 무엇일지, 사람들 사이에서는 설왕설래가 이어지고 있습니다.\n\n그러나 내부적으로 우려의 목소리가 나오고 있습니다. 몇 년전 산해경의 치안을 어지럽힌 $SHA_KAI$가 다시 한 번 더 사악한 음모를 꾸미고 있다는 위험한 소문이 돌고 있습니다..."
 shafas.1.a: "우리의 전통을 수호하자!"

 shafas.2.t: "현무상회의 반대!"
 shafas.2.d: "현무상회는 우리 쿠데타에 반대하는 성명을 강력히 발표했습니다. 현재로서는 그들의 움직임이 큰 위협으로 보이지 않지만, 이를 방치한다면 상황은 급변할 가능성이 있습니다. 그들은 금세 세력을 확장해 우리에 맞서는 또 다른 혁명을 불러일으킬지도 모릅니다.  \n\n만약 그들이 정말로 대립을 원한다면, 산해경은 피로 물들게 될 것이며, 우리가 수십 년간 지켜온 전통은 돌이킬 수 없을 정도로 파괴될 것입니다. 이런 사태를 막으려면 지금 단호한 조치를 취해야 합니다. 현무상회의 저항이 단순한 반발로 그치는지, 아니면 더 큰 갈등으로 이어질지는 우리의 대응에 달려 있습니다."
 shafas.2.a: "이건 다소 이단적이다..."

 shafas.3.t: "내부에 암약한 급진파"
 shafas.3.d: "현재 산해경은 혼란에 빠져 있습니다. 경극부의 쿠데타가 혁명으로 번지면서, 현룡문의 문주였던 키사키는 문주의 자리를 우루시바라 카구야에게 이양하였으며, 현재 VIP 자택에 감금된 상태입니다. 혁명은 어느 정도 성공적으로 마무리되었으나, 아직 해결해야 할 문제가 산더미처럼 쌓여 있습니다.\n\n그러나 내부에서는 수상한 움직임이 감지되고 있습니다. 신타니 카이는 이 혼란을 틈타 자신이 산해경의 문주 자리에 오르기를 원하고 있습니다. 연단방의 급진파들은 현재의 임시 문주인 우루시바라 카구야를 인정하지 않으며, 신타니 카이의 명령만을 따르는 등 연단방은 이미 그녀에게 잠식된 것으로 추측됩니다."
 shafas.3.a: "우리는 두 걸음 앞서야 한다."

 shafas.4.t: "현무상회의 쿠데타!"
 shafas.4.d: "경극부의 쿠데타 이후, 산해경에서는 또 한 번의 쿠데타가 발생했습니다. 이번에는 현무상회가 남아 있던 현룡문의 온건파를 결집시켜 우리 세력에 대항하기 시작 하였습니다.\n\n그들은 경극부의 혁명이 산해경의 전통을 완전히 거스르는 행위이며, 신타니 카이의 복권을 목적으로 벌어진 것이라고 주장했습니다. 또한 자신들이야말로 산해경의 안정을 되찾을 세력이라며 혁명을 외치고, 학생들을 선동하기 시작했습니다."
 shafas.4.a: "현무상회가 쿠데타를 성공시켰다!"
 shafas.4.b: "그들은 배반의 대가를 치룰 것이다!"

 shafas.5.t: "더미 이벤트"
 shafas.5.d: ""
 shafas.5.a: "더미 이벤트"

 shafas.6.t: "보수혁명"
 shafas.6.d: "두 달 전 발생한 대전이 사태와 현무상회의 목표를 저지하기 위해, 사상과 이해가 유사한 정파들을 통합하려 모색했던 경극부는 산해경의 이익을 수호하는 데 있어 중요한 역할을 수행했습니다. 경극부의 활약으로 현무상회의 목표는 무산되었고, 대전이 사태의 여파 역시 최소화되며 그 영향력을 억제할 수 있었습니다.\n\n그러나 산해경은 외부의 위협을 넘어 내부의 결함으로부터도 위기에 처해 있습니다. 문주의 나약한 의회주의적 정책 방향은 그를 꼭두각시로 전락시킬 뿐만 아니라, 산해경 보수주의의 존립 기반 자체를 파멸로 몰아넣을 가능성을 내포하고 있었습니다. 이를 막기 위해 경극부는 학원을 상대로 혁명의 깃발을 올렸습니다.\n\n경극부장 우루시바라 카구야의 탁월한 지도력 아래, 현룡문의 보수파들이 사소한 경쟁심과 결단력 부족으로 인해 이루지 못했던 과업들이 마침내 결실을 보게 되었습니다. 케케묵은 분쟁은 마침내 종결되었고, 과거 보수주의 운동과 현대 보수주의 운동을 이어주는 다리가 놓였습니다. 의회주의라는 목적 없는 이상론과 현무상회의 유사 좌파적 실험의 시대는 이제 종언을 고했습니다.\n\n이제 진정한 경극부가 과거의 부패한 권력 구조를 무너뜨리고, 보수 혁명의 서막을 여는 시점이 임박했습니다."
 shafas.6.a: "시작해보자."

 shafas.7.t: "산해경 방위군"
 shafas.7.d: "산해경의 방위군은 지상전과 국토방위를 책임지는 핵심 전력으로, 학원을 수호하는 사명을 지닙니다. 그러나 이들은 산해경이라는 학원보다 현룡문에 충성을 바치는 당군에 가깝습니다. 방위군의 통수권자는 현 문주 [SHA.GetLeader]이며, 그 아래 집행부장이 실질적인 지휘를 담당합니다.\n\n방위군의 역사는 현룡문과 함께 시작되었습니다. 현룡문의 군사 부문을 분리해 절대적 통제권을 행사하는 구조로 출발하였으며, 이를 통해 문민통제의 원칙을 확립하였습니다. 전대 문주의 집권은 방위군에 있어 크나큰 축복인 동시에 독이 든 성배였습니다. 전대 문주는 방위군의 대대적인 확장을 추진하며 막대한 예산을 편성했고, 실제 집행까지 이루어져 방위군은 상당한 군사력을 갖출 수 있었습니다. 그러나 이에 반발하는 현룡문 내부 인사들과의 갈등이 깊어졌고, 여러 요인이 복합적으로 작용한 끝에 전대 문주는 결국 실각하였으며 방위비 역시 대폭 삭감되었습니다.\n\n산해경 방위군과 오스트리아군 사이에서 벌어진 일련의 전투는 대부분 방어자의 위치에 있던 산해경의 승리로 마무리되었습니다. 이후 슈슈니크 수상과 현룡문 문주 사이의 협상이 타결되면서 오스트리아의 공식적인 저항은 완전히 종식되었습니다. 그러나 조국 위에 군림하는 산해경의 지배를 끝내 받아들이지 못한 일부 오스트리아 군인들은 알프스 산중 깊숙이 몸을 숨긴 채 여전히 우리에 맞서 저항을 이어가고 있습니다."
 shafas.7.a: "충성!"

 shafas.8.t: "최후통첩"
 shafas.8.d: "산해경 정부는 백귀야행이 무력으로 점령한 [972.GetName]에 대해 자국의 영유권을 주장하며, 해당 영토를 즉각 반환할 것을 요구하고 있습니다. 만약 48시간 이내에 응답이 없을 경우, 두 국가는 전쟁 상태에 돌입하게 될 것이라는 경고문은 이 요구가 결코 허울뿐인 협박이 아님을 분명히 보여줍니다.\n\n한편, 우리 또한 산해경이 불법으로 점거하고 있는 [1051.GetName]에 대한 영유권 문제를 안고 있지만, 이러한 상황에서 이를 언급하는 것은 자칫 산해경 측에 전쟁 의지를 표명하는 것으로 해석될 수 있습니다. 이는 현재의 긴장을 더욱 악화시킬 위험이 있어 신중한 접근이 필요합니다."
 shafas.8.a: "우리는 물러서지 않는다!"

 shafas.9.t: "우리의 요구를 거부한 [FROM.GetAdjective]!"
 shafas.9.d: "긴 말을 할 필요가 있습니까?"
 shafas.9.a: "그렇다면 전쟁 뿐이다!"

 shafas.10.t: "안쓰는데 어떡하지"
 shafas.10.d: ""
 shafas.10.a: "어떡하지"

 shafas.11.t: "금의환향"
 shafas.11.d: "음모는 성공하였습니다! 산해경 내부에 암약해 있던 급진파와 연단방원들은 오늘 늦은 새벽, 우루시바라 카구야를 축출하는 데 성공하였으며, 자신들의 지도자인 신타니 카이를 새로운 권력자로 추대하였습니다. 물론 신타니 카이가 정권을 잡는 과정에서 우루시바라 카구야의 실책이 적지 않은 영향을 미쳤겠지만, 그녀를 이용하여 상황을 조성한 우리의 공이 더욱 크다고 할 수 있습니다.\n\n현재 신타니 카이는 자신의 입맛대로 정부를 재구성하고 있으며, 수많은 현룡문의 주요 인사들이 퇴직과 해임의 소용돌이에 휩싸여 사라지고 있습니다. 주요 요직들은 신타니 카이에게 충성을 맹세한 인물들로 빠르게 채워지고 있으며, 남아 있는 기존 인사들 역시 압도적인 충성파들 앞에서 아무런 저항도 하지 못하고 있습니다.\n\n한편, 신타니 카이는 정치적 변화를 공식적으로 선언하기 위한 연설을 준비 중입니다."
 shafas.11.a: "모든건 계획대로."

 shafas.12.t: "확산되는 공포"
 shafas.12.d: "혁명에서 산해경의 인민들은 신타니 카이가 혁명의 배후에 있다는 음모론이 존재합니다. 그러나 최근에 이 내용은 사실이였고 산해경의 학생들은 과거와 같은 일이 벌어질까 두려워 하고 있습니다."
 shafas.12.a: "신타니 카이에 대해 빠른 조치를 취하자."
 
 shafas.13.t: "$SHA_KAI$에 대한 재판"
 shafas.13.d: "$SHA_KAI$는 과거 산해경에 큰 혼란을 불러일으켰습니다. 자신의 목적을 위해 살포한 약은 산해경 학생들에게 치명적인 피해를 남겼고 전 문주 류우게 키사키는 이를 빌미로 전통까지 어겨가며 강제로 추방하였습니다. 그러나 혁명때 일부 연단방원들은 신타니 카이와 접촉하였다는 사실이 드러났고 우루시바라 카구야는 민심을 회복하기 위해 $SHA_KAI$에 대한 재판을 열었습니다."
 shafas.13.a: "아무래도 민심을 얻기 위해서는 그녀를 추방하는 것이 옳을 것이다."
 shafas.13.b: "그녀에게 집중적인 감시를 붙혀라!"

 shafas.14.t: "야쿠시 사야의 운명"
 shafas.14.d: "연단방이 온전히 신타니 카이의 손에 들어가자, 이전 연단방 부장이었던 야쿠시 사야의 운명이 서서히 다가오고 있었습니다. 야쿠시 사야는 신타니 카이와는 정반대의 입장을 지닌 인물로, 신타니 카이의 비윤리적이지만 실용적인 실험들을 꾸준히 반대해왔습니다.\n\n신타니 카이 본인은 그녀에게 개인적인 감정은 없으며, 단지 사야를 평범한 연단방의 일원으로 강등시키는 선에서 마무리할 생각입니다. 그러나 연단방 내부에서는 사야의 감금을 요구하는 목소리가 커지고 있습니다."
 shafas.14.a: "강등 시키는 선에서 만족하라"
 shafas.14.b: "그렇다면 가둬라"

 shafas.17.t: "급진파 민병대"
 shafas.17.d: "산해경의 정치적 혼란과 대전이 사태의 여파로 인해, 산해경 고급중학교 내 일부 급진 세력들이 결집하여 민병대 활동을 전개하고 있습니다. 이들은 특히 현무상회를 비롯한 좌익 계열 세력들을 주요 표적으로 삼아 공격을 감행하고 있습니다. 학생들은 이러한 습격에 어느 정도 저항할 수 있는 수단을 보유하고 있으나, 현지 오스트리아인들은 그렇지 못해 향후 갈등의 불씨가 될 가능성이 있습니다."
 shafas.17.a: "이러한 행동은 즉시 중단되어야 한다. 집행부를 파견해 민병대를 해산하라."
 shafas.17.b: "애국자들의 행동을 왜 막아야 하는가?"

 shalose.1.t: "대규모 시위 발생"
 shalose.1.d: "정권 퇴진을 요구하는 대규모 시위"
 shalose.1.a: "다소 이단적이다.."

 shalose.2.t: "최후"
 shalose.2.d: "패전이 공식화된 바로 다음 날, 신타니 카이는 모든 행적을 끊었다. 마지막으로 남긴 메시지조차 없었다. 집무실은 정리되지 않은 채 그대로였고, 그녀가 직접 다루던 약병과 도표들은 그대로 남겨져 있었다. 사람들은 말한다. 실패를 인정하지 못한 과학자는 결국 자신조차 실험실에서 지워버린 것이라고.\n\n산해경 고급중학교는 지금, 지도자 없는 무정부 상태에 가까운 혼란을 겪고 있다. 국민들 사이에서는 신타니 카이의 행방에 대한 여러 추측이 난무하지만, 그 누구도 확신하지 못한다. 죽음을 택했는가, 혹은 또 다른 실험을 위해 잠적했는가.\n\n단 하나 확실한 건, 그녀는 책임이라는 무게 앞에서 광기의 껍데기를 벗지 못했고, 최후의 순간마저 혼자 감당하려 했다는 사실이다."
 shalose.2.a: "\"이건 실험이다\" 그녀가 자주 쓰던 말이다."

 shalose.2.d_2: "패전이 공식화된 지 며칠 지나지 않아, 우루시바라 카구야는 자진하여 시민들 앞에 모습을 드러냈습니다. 그녀는 보수 혁명이 실패했음을 인정하며, 민심에 따라 법적 심판을 받겠다고 선언했습니다. 이후 즉시 체포되어 재판에 회부되었습니다.\n\n많은 여론은 그녀의 추방을 요구했지만, 재판부는 그녀에게 교화 가능성이 있다고 판단해 교정국에 수감하기로 결정했습니다. 그러나 이 결정은 산해경 학생들의 강한 반발을 불러일으켰습니다. 산해경 내에서 혼란을 일으킨 인물이 산해경 외부에서 판단을 받는 것에 대한 불만이 표출된 것입니다.\n\n이 판결이 공정하지 않다고 주장하는 이들이 등장하면서, 사태는 민병대 수준으로 격화되었습니다. 보수 혁명에 반대하며 초우익적 이념으로 재무장한 이들이 무장 집단을 조직했고, 총기를 들고 산해경 중앙특구를 공격하는 등 각종 폭력 사태가 발생하고 있습니다."
 shalose.2.b: "'웅대한 보수혁명' 이라는 말 아래에 얼마나 많은 사람들이 피해를 봤는가.."

 shalose.3.t: "군사 쿠데타"
 shalose.3.d: "도시는 어둠에 잠기지 않았다. 불빛이 꺼진 자리마다 총구가 깨어났고, 그 총구 뒤에는 코노에 미나가 있었다. 산해경 고급중학교 정부 청사는 저항 없이 열려 있었고, 누구도 그녀를 막지 않았다. 막을 이유도, 막을 힘도 없었다.\n\n신타니 카이가 사라진 뒤의 정권은 허공에 매달린 듯 흔들렸다. 사라진 지도자, 붕괴된 행정, 무장해제된 시민. '정부'라는 단어는 더 이상 의미를 가지지 못했고, 사람들은 명확한 목소리를 원했다. 방향을, 명령을, 누군가의 등장을 기다리고 있었다.\n\n그 공백을 뚫고, 코노에 미나가 나타났다. 원래는 방위군 작전 참모였고, 대대장을 맡았던 인물. 말수가 적었지만 이상하게도 무전을 자주 까먹는 타입. 작전지도를 펼치면 거꾸로 들고 시작하지만, 어쨌든 목적지엔 도착했다.\n\n그녀가 이끄는 방위군은 도심으로 진격했다. 거의 무혈입성이었다. 이미 정부는 무정부 상태였고, 거리를 점령한 민병대와 주민들은 방위군을 향해 '질서의 귀환'이라는 희미한 희망을 품고 손을 흔들었다."
 shalose.3.a: "질서가 바로 잡혔군!"

 shadem.1.t: "첫 선거"
 shadem.1.desc: "산해경에서 역사적인 첫 민주적 선거가 개최되었습니다. 이번 선거는 단순한 지도자 선출을 넘어, 산해경의 민주정 전환과 대통령 선거라는 점에서 키보토스의 여러 학원들 사이에서도 큰 관심을 받고 있습니다.\n\n많은 시민들은 선거 운동에 참여하며 누구에게 투표할지 깊이 고민해왔고, 마침내 운명의 날이 찾아왔습니다.\n\n이번 선거에는 총 세 명의 후보가 출마하였습니다.\n첫 번째 후보는 전 문주였던 류우게 키사키, 두 번째 후보는 개혁을 주도하며 현재 가장 높은 지지를 받고 있는 아케시로 루미입니다. 이 둘은 서로 엄청난 지지율을 확보하고 있으며 그 누구도 쉽게 승부를 가릴 수 없습니다.\n\n이제 산해경의 미래를 결정할 중요한 선택의 순간이 다가왔습니다."
 shadem.1.desca: "산해경에서 역사적인 첫 민주적 선거가 개최되었습니다. 이번 선거는 단순한 지도자 선출을 넘어, 산해경의 민주정 전환과 대통령 선거라는 점에서 키보토스의 여러 학원들 사이에서도 큰 관심을 받고 있습니다.\n\n많은 시민들은 선거 운동에 참여하며 누구에게 투표할지 깊이 고민해왔고, 마침내 운명의 날이 찾아왔습니다.\n\n이번 선거에는 총 세 명의 후보가 출마하였습니다.\n첫 번째 후보는 전 문주였던 류우게 키사키, 두 번째 후보는 개혁을 주도하며 현재 가장 높은 지지를 받고 있는 아케시로 루미, 마지막으로 연단방 부장인 야쿠시 사야입니다.\n\n이제 산해경의 미래를 결정할 중요한 선택의 순간이 다가왔습니다."
 shadem.1.a: "류우게 키사키!"
 shadem.1.b: "아케시로 루미!"
 shadem.1.d: "야쿠시 사야!"

 shadem.2.t: "민중 속으로"
 shadem.2.desc: "산해경의 수많은 사람들은 아직도 민주주의에 대해서 잘 모릅니다. 민주주의의 근간이 되는 삼권분립, 민주주의 체제 아래 시민의 의무 및 책임까지, 산해경의 수많은 사람들은 그 개념을 정확하게 이해하고 있지 않습니다. 아케시로 루미는 기존의 현룡문의 인재들만으로 자신의 이상을 산해경에 심을 수 없다고 생각 하였고 대책을 세우기로 결심 했습니다. "
 shadem.2.a: "민중 속으로! - 지식인들이여, 민중들을 계몽하라!"

 shafla.1.t: "많이 먹고 힘내야지!"
 shafla.1.desc: "구제 사업을 펼친다는 현룡문 조령의 명 아래, 가장 분주하게 움직인 것은 현무상회였다. 대전이 당시, 그녀들은 상회를 지키기 위해 직접 전장에 나서기도 했지만, 이번에는 전혀 다른 싸움을 치르고 있었다. 바로, 배고픈 이들을 위해 음식을 만드는 일이었다.\n\n점심시간이 되자 사람들이 현무상회 앞으로 몰려들었다. 산해경 곳곳에 분점이 있었지만, 가장 유명한 곳은 단연 [4.GetCapitalVictoryPointName]의 본점이었다. 이는 아케시로 루미의 뛰어난 요리 실력이 입소문을 타고 널리 알려졌기 때문이었다.\n\n사람들 사이로 한 아이가 조심스럽게 다가왔다.\n\"저기요... 음식 하나만 주세요... 배고파서... 정말 조금만이라도...\"\n\n루미는 아이를 내려다보며 따뜻하게 웃었다.\n\"그래, 꼬맹이. 많이 배고팠구나? 하하, 알았어. 조금만 기다려. 최고의 요리를 대접해 줄 테니까!\"\n\n그녀는 주방으로 들어가 손놀림을 빠르게 움직였고, 잠시 후 특제 볶음밥을 정성껏 만들어 아이 앞에 내놓았다. 아이는 환한 미소를 지으며 허겁지겁 음식을 먹었고, 루미는 그 모습을 조용히 지켜보았다. 그렇게, 시간은 천천히 흘러가고 있었다."
 shafla.1.a: "밥은 중요하다고?"

 shafla.2.t: "전환기 침체"
 shafla.2.desc: "기존의 중앙정부가 주도하던 계획 경제 체제에서 시장을 개방하고, 자본주의적 요소를 도입하였습니다. 이러한 개혁은 기존의 경제 정책보다 효과적인 성과를 내고 있었지만, 너무 빠른 경제 체제 전환은 이행 과정에서 침체를 초래할 위험이 컸습니다.\n\n자본주의 체제 도입이라는 과감한 도전은 실패로 보일 정도로 위기에 처했지만, 오늘 발표된 전문가들의 분석 결과는 희망적인 전망을 보여주었습니다. 경제 상황은 점차 나아지고 있으며, 사람들은 다시 소비를 시작하고 있습니다. 자본주의 경제 체제의 장점이 드러나기 시작했고, 이제는 전문가들의 개입을 점진적으로 줄여나가면서 산해경의 경제 개혁을 마무리할 때가 된 것 같습니다."
 shafla.2.a: "좋은 소식이야!"

 shafla.3.t: "우와앗!"
 shafla.3.desc: "현룡문의 문주 자리가 우루시바라 카구야에서 신타니 카이에게 넘어가자, 아케시로 루미는 자신의 세력인 현무상회가 타격을 입을 것이라 판단했다. 그녀는 위기를 직감했고, 곧 행동에 나섰다. 그러나 이는 신 정권에게 있어 큰 걸림돌이 될 수밖에 없었고, 신타니 카이는 하나의 술수를 준비했다.\n\nㅡ 펑!\n\n갑작스러운 폭음이 현무상회 내부를 울렸다. 안에 있던 인원들은 놀라 소리의 근원지로 몰려들었고, 그곳에서 연기가 피어오르기 시작했다. 처음에는 단순한 소란 정도로 여겼지만, 루미를 포함한 현무상회 소속 학생들이 자리를 뜨려던 순간ㅡ\n\n연이어 여러 개의 폭탄이 연속적으로 터지기 시작했고, 짙은 연기가 순식간에 실내를 뒤덮었다.\n\n잠시 후, 연기가 걷히고 모습을 드러낸 것은 놀랍게도 어린아이가 되어버린 현무상회 소속 학생들이었다.\n\n\"이게... 무슨 일이야!?\"\n\n\"어... 어떡하죠, 회장님!?\"\n\n당황한 레이죠가 루미에게 다급히 물었다.\n\n루미는 순간 얼어붙었지만, 곧 침착함을 되찾고 명령을 내렸다.\n\n\"사야에게 연락해. 지금 당장!\"\n\n\"네... 네!\"\n\n\"그리고―\"\n\n또 한 번 터지는 폭음. 이번에는 루미 자신이 어린 시절의 모습으로 변해버렸다. "
 shafla.3.a: "곧 바로 병원에 갔다. 다행히 건강에는 이상이 없었다."
 shafla_3_tt: "아케시로 루미 초상화가 아래와 같이 변경됩니다.\n--------------------------------\n\n\n\n\n\n\n£GFX_Portrait_SHA_Akeshiro_Rumi_Child\n\n\n\n\n\n\n\n--------------------------------"

 shan_events.1.t: "세금 인상?"
 shan_events.1.desc: "현룡문의 재정은 사태 이후로 빠르게 고갈되어 가고 있습니다. 이는 여러 요인이 복합적으로 작용한 결과입니다. 사태 진압 과정에서 발생한 급격한 군비 지출, 혼란스러운 지역을 관리하기 위한 행정 비용, 그리고 전투로 피해를 입은 지방의 복구비용까지 모든 것이 한꺼번에 재정을 압박하고 있습니다. 국고가 빠르게 바닥나고 있는 지금, 우리에게는 두 가지 선택지가 있습니다. 세금을 인상하여 국고를 확충하고 재정적 부담을 완화하거나, 아니면 지출을 대폭 줄이는 근본적인 개혁을 단행해야 합니다. 어떤 선택을 하든 신속한 결단이 필요한 시점입니다."
 shan_events.1.a: "어쩔 수 없지만 인상하자."
 shan_events.1.b: "유지하자."

 shan_events.2.t: "군사 지출 삭감 논란"
 shan_events.2.desc: "산해경 방위군은 오스트리아 사태 당시 교전 과정에서 군사 지출을 대폭 확대하였습니다. 그러나 전투가 종료된 지금까지도 여러 복합적인 이유로 인해 군사 지출은 삭감되지 않은 채 전시 수준을 그대로 유지하고 있습니다. 이에 현룡문 내부에서는 군비 축소를 요구하는 목소리가 점차 힘을 얻고 있습니다. 재정 안정성 확보라는 절박한 현실적 필요성과 더불어, 지나치게 비대해진 방위군의 규모 문제, 그리고 전시 체제에서 평시 체제로의 전환 필요성을 근거로 군사 지출의 단계적 삭감을 진지하게 요청하는 상황입니다.\n\n물론 이에 맞서는 반대 의견도 만만치 않습니다. 강경파 현룡문 인사들을 중심으로 한 세력은 여전히 불확실한 외부 위협이 완전히 사라지지 않았음을 주장하며 현 수준의 군사력 유지를 역설하고 있습니다. 특히 이들은 지금의 '이상 현상'이 영속적인 것이 아니며 언제든 상황이 급변할 수 있다는 점을 강조하면서, 성급한 군비 축소는 돌이킬 수 없는 안보 공백을 초래할 수 있다고 경고하고 있습니다. 군비 축소와 안보 유지, 두 가지 요구 사이에서 현룡문의 고민은 깊어지고 있습니다."
 shan_events.2.a: "군사 지출을 삭감하자."

 shan_events.3.t: "상인 구제?"
 shan_events.3.desc: "산해경 산업의 뿌리 중 하나이자 산해경을 대표하는 집단을 꼽으라면 누구나 상인이라고 말할 것입니다. 물론 농민, 장인, 광부 등 다른 이들 역시 산해경 경제를 떠받치는 중요한 축입니다. 하지만 무역과 유통을 책임지는 상인들의 역할은 그 무엇과도 비교할 수 없을 만큼 중요합니다. 그런데 사태로 가장 큰 타격을 입은 것도 바로 상인들이었습니다. 무역로가 끊기고 시장이 파괴되면서 상업 활동 자체가 마비되었기 때문입니다. 기본적인 인프라가 전부 손상을 입은 상황에서 복구가 이루어지기 전까지 상인들은 감당하기 어려울 정도로 불어나는 적자를 속수무책으로 지켜볼 수밖에 없었습니다. 상인들을 구제하기 위해서는 만만치 않은 비용이 소요될 것으로 예측됩니다."
 shan_events.3.a: "구제하자."
 shan_events.3.b: "구제하지 말자."

 shan_events.4.t: "회복중인 산해경 경제"
 shan_events.4.desc: "대전이 사태라는 비극이 산해경에 남긴 최악의 상처는 경제 붕괴였습니다. 상업 중심으로 발전해온 산해경의 경제 체제는 파괴된 인프라와 끊어진 무역망, 그리고 연쇄적인 산업 도산 앞에서 속절없이 무너졌습니다. 원래부터 취약했던 경제 구조가 완전히 망가져버린 것입니다. 그 여파는 참혹했습니다. 산해경의 상인들은 하루아침에 생계 수단을 잃고 길거리로 내몰렸고, 공장들은 가동을 멈췄으며, 장인들은 더 이상 무언가를 만들어낼 수 없었습니다.\n\n그러나 다행히도 희망의 싹이 보이기 시작했습니다. 인프라 복원 작업이 진행되고 현룡문이 적극적으로 개입하면서 산해경의 경제가 조금씩 되살아나기 시작한 것입니다. 사태의 상처는 여전히 깊게 남아 있지만, 적어도 기본적인 생필품을 구할 수 있게 되었고 작은 사치품 정도는 누릴 수 있는 여유가 생겼습니다. 특히 주목할 만한 변화는 상인들의 연합체인 현무상회가 본격적인 활동을 재개했다는 점입니다. 최근 정비된 무역로를 통해 물자가 다시 유통되면서 요식업계에 활기가 돌기 시작했습니다.\n\n현룡문의 관료들은 [ROOT.GetLeader]의 지도 아래 실패한 산업들을 구제하고 경제적 곤경에 대한 지속 가능한 해결책을 모색하는 데 총력을 기울이고 있습니다. 현룡문의 경제 재건 계획이 본격적으로 추진되기 시작하자 많은 이들은 그것이 과연 어떤 모습으로 구현될지 기대와 우려 속에서 지켜보고 있습니다."
 shan_events.4.a: "성장의 바퀴에 기름칠을 해라!"
 tooltip_SHA_industry_focus_accessible: "이제 §Y$SHA_shanhaijing_trade_promotion$§! 중점과 §Y$SHA_austria_unemployment_relief$§! 중점을 완료할 수 있습니다.\n\n"

 shadip.1.t: "찻잎 수출을 요청한 [SHA.GetAdjective]"
 shadip.1.desc: "오늘, [64.GetCapitalVictoryPointName]으로부터 한 통의 외교 문서가 도착했습니다. 이는 산해경의 [SHA.GetLeader] 측에서 보낸, 양 학원 간 첫 번째이자 상징적인 외교 문서였습니다. 그러나 그 내용은 의외로 비교적 사소한 사안이었습니다.\n\n산해경은 과거부터 트리니티의 다도부와 비공식적인 교류를 이어왔으며, 이번에는 트리니티에서 재배한 ‘찻잎’을 공식적으로 수입하고 싶다는 요청을 전달해온 것입니다. 특히 최근 산해경 내에서 차 문화가 급속히 유행하면서 수요가 폭발적으로 증가한 것이 이번 요청의 배경으로 분석되고 있습니다.\n\n산해경 측이 외교 문서를 통해 정식으로 요청해온 만큼, 이를 거부할 경우 양 학원 간 관계가 악화될 우려가 있습니다."
 shadip.1.a: "찻잎 수출을 승인하자!"
 shadip.1.b: "트리니티의 자원을 함부로 내줄 이유는 없다."

 shadip.2.t: "찻잎 수출을 시작한 [TRM.GetAdjective]"
 shadip.2.desc: "다행히도 [64.GetCapitalVictoryPointName] 측은 찻잎 수출을 시작하였으며, 최근 급격히 증가한 산해경의 홍차 수요에 맞춘 첫 번째 물량이 오늘 산해경에 도착했습니다. 특히 이번 수출에는 현룡문의 문주를 위한 특별한 고급 찻잎이 포함되어 있으며, 이는 트리니티의 티파티가 직접 재배한 것으로 알려졌습니다. 아울러, [TRM.GetLeader] 측이 정성스럽게 준비한 수제 과자도 함께 전달되어, 단순한 교역을 넘어선 진심 어린 우호의 표시로 받아들여지고 있습니다."
 shadip.2.a: "멋진 이야기로군"

 shadip.3.t: "찻잎 수출 제안을 거부한 [TRM.GetAdjective]"
 shadip.3.desc: "아쉽게도 [TRM.GetAdjective] 측은 우리의 제안을 거부하였습니다."
 shadip.3.a: "이걸 거부하네"


 # 뉴스 이벤트
 shanews.01.t: "산해경에서 발생한 쿠데타!"
 shanews.01.desc: "오늘 아침, 키보토스를 뒤흔드는 충격적인 소식이 전해졌습니다. 산해경 내에서 경극부가 문주 류우게 키사키를 겨냥해 전격적으로 쿠데타를 감행했다는 소식입니다. 경극부는 류우게 키사키가 산해경 고유의 전통을 저버렸다는 명분을 내세웠지만, 그 이면에 숨겨진 진실은 여전히 베일에 싸여 있습니다. 대전이 이후에도 고립을 유지해 온 산해경에서 무언가 중대한 사건이 벌어진 것으로 추측되고 있습니다.\n\n경극부가 정권을 장악한 이후, 불길한 소문이 퍼지고 있습니다. 한때 산해경에서 퇴학 처분을 받았던 '7대 수인' 중 한 명인 신타니 카이가 최근 탈옥한 소식이 재조명 되며 민심이 크게 동요하고 있습니다."
 shanews.01.a: "변화가 아닌 전통이다!"
 shanews.01.b: "그것도 결국 변화 중 하나이다."

 shanews.02.t: "산해경 보수혁명"
 shanews.02.desc: "오늘 놀라운 사태가 벌어졌습니다. 경극부와 그 수장인 우루시바라 카구야가 모든 권한을 류우게 키사키에게 이양하고, 자신들의 산해경 보수주의를 본격적으로 실천하겠다는 선언문을 발표했습니다. 이 발표 직후, 수많은 경극부원들이 이에 호응하며 거리로 나서는 모습이 목격되고 있습니다.\n\n현재까지 류우게 키사키의 공식 입장문은 발표되지 않았으나, 그의 침묵이 경극부의 행보를 묵인하고 있다는 해석이 지배적입니다."
 shanews.02.a: "퇴폐적인 문화를 척결하자!"
 shanews.02.b: "도대체 무슨 일이 일어나고 있는 거지?!"
 shanews.02.c: "산해경이 반동국가라는 또 다른 예시다."

 shanews.03.t: "산해경에서 발생한 2차 쿠데타"
 shanews.03.desc: "오늘 산해경에서 또 한 번 충격적인 소식이 전해졌습니다. 오욕의 미후이자 7대 수인 중 한 명인 신타니 카이가 경극부와의 권력투쟁에서 승리하며 경극부를 권력의 중심에서 밀어내고 정권을 장악했다는 소식입니다. 이 사건은 산해경 전역에 큰 파장을 일으키고 있습니다.\n\n신타니 카이는 연설을 통해 \"산해경을 위해 헌신하겠다\"며 달콤한 말을 내세웠지만, 그녀의 진짜 의도는 그녀만이 알고 있을 것입니다. 주변 학원들은 아직 공식적인 입장을 밝히지 않았으나, 이번 사태가 결코 반가운 소식으로 받아들여지지 않을 가능성이 높습니다."
 shanews.03.a: "그녀를 환영하자!"
 shanews.03.b: "이는 안보적 위협이다..."
 shanews.03.c: "조금은 음침하게 들리는 군..."

 shanews_04_template: "\n\n[SHA.GetFactionName]이 남키보토스에서 체결됨에 따라, 전문가들은 발칸 지역에서의 패권 경쟁이 더욱 심화될 것이라 전망하고 있습니다. 또한, 조약과 직접적인 이해관계를 가진 이탈리아는 절제된 반응을 보이고 있습니다."
 shanews.04.t: "산하이징 조약 창설"
 shanews.04.t_1: "제2인터내셔널 재건"
 shanews.04.desc_c: "산해경에 새로운 변화의 바람이 불면서, 오늘 [SHA.GetLeader]는 산하이징 조약을 창설하였습니다. 경극부장이자 현재 산해경의 실세로 자리 잡은 우루시바라 카구야는 이 협정의 창설을 적극 지지하며, 이를 산해경 보수주의를 위한 필수적인 정책이라고 평가하였습니다.$shanews_04_template$"
 shanews.04.desc_s: "산해경에 새로운 변화의 바람이 불면서, 오늘 [SHA.GetLeader]는 산하이징 조약을 창설하였습니다. [SHA.GetLeader]는 이번 협정이 자신들의 정책 기조 속에서 불가피한 선택이었음을 강조하며, 그 결과 일부 고립 정책이 수정될 수밖에 없었음을 인정하였습니다.$shanews_04_template$"
 shanews.04.desc_nothing: "산해경에 새로운 변화의 바람이 불면서, 오늘 [SHA.GetLeader]는 산하이징 조약을 창설하였습니다. [SHA.GetLeader]는 기존의 고립 정책을 수정하면서까지 협정의 성립을 위해 힘써왔으며, 이에 대한 지지자들의 반대에도 불구하고 문주의 권한을 행사하여 이를 강행하였습니다.$shanews_04_template$"
 shanews.04.a: "새로운 산해경이 부상한다!"
 shanews.04.c: "고립주의 고수는 어쩌고?"
 shanews.04.d: "새로운 패권의 탄생인가?"
 shanews.05.t: "[SHA.getfactionname] 창설"
 shanews.05.desc_1: "산해경에 새로운 변화의 바람이 불면서, 오늘 [SHA.GetLeader]는 코민테른 서부전선에서의 [SHA.getname]의 역할을 강조했습니다. [SHA.GetLeader]는 이러한 테제가 사회주의의 실천을 향한 '국가-투쟁'임을 강조하며, 국제주의 대오 아래서 노동자 해방의 길을 걸어나갈 것임을 역설하였습니다.$shanews_04_template$"
 shanews.05.desc_2: "산해경에 새로운 변화의 바람이 불면서, 오늘 [SHA.GetLeader]는 제2인터내셔널을 재건하였습니다. [SHA.GetLeader]는 이러한 테제가 사회주의의 실천을 향한 '국가-투쟁'임을 강조하며, 새로운 인터내셔널의 선포만이 노동자 해방의 길일 수밖에 없음을 역설하였습니다.$shanews_04_template$"

