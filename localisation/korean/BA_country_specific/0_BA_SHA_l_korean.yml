 SHA_Kirchenbeitragsgesetz: "교회 헌금법"
 SHA_Kirchenbeitragsgesetz_desc: "'Kirchenbeitragsgesetz', 교회 헌금법은 오스트리아에서 공인된 종교 단체가 신도로부터 일정한 금액의 헌금을 받을 수 있도록 정한 법적 제도입니다. 이 헌금은 세금이 아닌 자발적 소속에 따른 의무로, 징수는 종교 단체가 자체적으로 진행하며, 국가는 이에 대한 법적 근거를 제공합니다. 우리는 이를 통해 교회가 재정 운영을 자체적으로 하도록 교정하는 대신 그들로부터 조세하여 세속주의의 원칙을 실현할 것입니다."
