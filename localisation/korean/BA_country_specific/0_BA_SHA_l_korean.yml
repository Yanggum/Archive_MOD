 SHA_swell_military_production: "군수 생산 증대"
 SHA_swell_military_production_desc: ""
 
 SHA_aviation_program: "오스트리아 조종사 훈련 프로그램"
 SHA_aviation_program_desc: "오스트리아 조종사 훈련 프로그램은 민간 항공학교와의 협력을 바탕으로 단계적으로 진행되는 방식을 채택하고 있습니다. 이처럼 체계적인 단계별 교육 방식은 아직 미흡한 산해경 공군의 기틀을 다지는 데 있어 더없이 큰 밑거름이 될 것입니다."
