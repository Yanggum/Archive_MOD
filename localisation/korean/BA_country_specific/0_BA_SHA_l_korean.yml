 SHA_art_of_war_prizes_speed_like_a_ghost: "병귀신속"
 SHA_art_of_war_prizes_speed_like_a_ghost_desc: "예로부터 전해 내려오는 사자성어 중 하나로, 병법은 귀신같은 신속함을 으뜸으로 여긴다는 말이 있습니다. 천 리 밖의 적을 기습하고자 할 때 무거운 짐을 끌고 간다면, 그것은 스스로 적에게 방비할 시간을 내어주는 것이나 다름없습니다. 그러므로 무거운 짐수레는 뒤에 남겨두고, 가볍고 기민하게 움직일 수 있는 병력만을 추려 여러 갈래의 길을 통해 동시다발적으로 적진을 공략하는 것이 이 전술의 핵심입니다."
