 SHA_fall_of_dragon: "용의 추락"

 SHA_defeat_kisaki_focus_1: "류우게 키사키 복권"
 SHA_defeat_kisaki_focus_1_desc: "류우게 키사키는 본디 역사의 피해자였습니다. 정권을 찬탈한 자들이 자신들의 정통성을 포장하기 위해 내세운, 말 그대로의 꼭두각시에 불과했습니다. 그러나 그럼에도 불구하고 그녀는 산해경 통합의 상징이자, 오랜 역사의 맥을 잇는 진정한 문주입니다."
 SHA_defeat_kisaki_focus_2: "현룡문 복원"
 SHA_defeat_kisaki_focus_2_desc: "이전 정부들이 추진했던 일련의 개혁들은 현룡문의 권한을 약화시키는 데 집중되어 있었습니다. 그러나 그러한 정부는 결국 군사 쿠데타로 몰락했고, 우리는 정통 문주인 류우게 키사키를 복권시켰습니다. 이제 남은 것은 현룡문의 명예와 위상을 되찾는 일입니다."
 SHA_defeat_kisaki_focus_3: "남키보토스연합"
 SHA_defeat_kisaki_focus_4: "남키보토스 통합주의 확산"
 SHA_defeat_kisaki_focus_5: "산해경 비동맹운동"
 SHA_defeat_kisaki_focus_6: "고요한 아침의 나라"

 SHA_defeat_mina_focus_1: "군사정부 지속"
 SHA_defeat_mina_focus_1_desc: "산해경이 직면한 총체적 문제를 해결하기 위해서는 군사 정부의 유지를 선택하는 것이 최선이라는 결론에 도달했습니다. 물론 우리 정부가 정통성 면에서 부족할 수는 있지만, 지금은 불필요한 의사 결정 과정에 시간을 낭비할 여유가 없습니다."
 SHA_defeat_mina_focus_2: "보복주의 확산"
 SHA_defeat_mina_focus_4: "항공기 시험"
 SHA_defeat_mina_focus_5: "비밀스러운 재무장"
 SHA_defeat_mina_focus_6: "동원령"
 SHA_defeat_mina_focus_7: "죽음, 혹은 불명예"

