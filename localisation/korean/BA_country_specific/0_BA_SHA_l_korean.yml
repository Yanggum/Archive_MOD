 # 결정
 SHA_industry_plan_decision_category: "[ROOT.GetName] 산업 계획 결정"
 SHA_industry_plan_decision_category_desc: "대전이 사태와 인프라 붕괴는 상인 주도의 산해경 경제를 폭삭 주저앉게 하기에 충분했습니다. 위기 앞에서 산해경 지도부는 중대한 결단을 내렸습니다. 단순히 과거의 체제를 복구하는 것이 아니라, 이 기회에 경제 구조 자체를 근본적으로 바꾸기로 한 것입니다. 이에 따라 산해경을 현대화하고 한층 더 발전시킬 야심 찬 경제 프로그램을 계획하게 되었습니다."
 SHA_industrial_stabilisation_mission_timer: "산해경 산업 안정화"
 SHA_the_matzen_oil_fields: "마첸 유전 개발"
