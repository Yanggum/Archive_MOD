 SHA_communism_cat: "붉은 홍수"
 SHA_red_terror_mission: "§R적색 공포§!"
 SHA_anschluss_decision: "'안슐루스'"
 SHA_danubian_decision: "다뉴브 연방 선포"
 SHA_great_osterreich_decision: "대오스트리아 선포"
 SHA_red_terror_tt: "\n만료 시: '§Y$shacom.18.t$§!' 사건 발생"
 SHA_stop_red_terror: "[FROM.owner.getname]의 마르크스주의 동지들 활용"
 SHA_stop_red_terror_flag: "다른 지역에서 우리의 마르크스주의자 동지들이 활동하는 중"
 SHA_establish_socialist_autonomy: "자치 평의회 설립"

 SHA_coup_of_Black_Tortoise_Promenade: "현무상회의 인내심 악화"
 SHA_coup_of_Black_Tortoise_Promenade_desc: "\n\n£GFX_SHA_Rumi_cat\n\n\n\n\n현무상회는 개방적인 성향을 지닌 조직으로, 현룡문의 개혁파들과 정치적으로 긴밀한 연관성을 갖고 있습니다. 그들의 이러한 개방성은 산해경의 전통을 중시하는 보수파들 사이에서 끊임없는 갈등을 야기해 왔습니다. 그러나 경극부가 산해경의 전통 유지를 명분으로 혁명을 일으킨 이상, 현무상회와의 충돌은 더 이상 피할 수 없는 상황이 되었습니다."
 SHA_BTP_revolt_mission: "현무상회 반란"

 SHA_invade_of_Hyakkiyako_cat: "남키보토스 전쟁"
 SHA_invade_of_Hyakkiyako_cat_desc: "산해경 군대는 성급한 공격으로 인해 준비가 부족한 상태에서 전쟁에 돌입했습니다. 그러나 기습을 받은 백귀야행 역시 큰 충격을 받아 공세 역량이 약화된 상황입니다. 이 틈을 타 산해경은 전시 체제를 신속히 완비하고 백귀야행을 항복시킬 계획입니다."
 SHA_operational_planning: "공세 계획 실행"
 SHA_shock_relief: "충격 완화"
 SHA_attack_plan: "산해경의 공세"
 
 HYA_invade_of_Hyakkiyako_cat: "남키보토스 전쟁"
 HYA_invade_of_Hyakkiyako_cat_desc: "산해경과 백귀야행은 대전이 이후 남주텐란트와 린츠 주에 대한 상호 영유권 분쟁을 지속해 왔습니다. 이제 우리는 전쟁이 발발했기에, 이 영유권 분쟁에 대한 마무리를 지어야 합니다."

 SHA_conservative_policy_cat: "보수혁명"
 SHA_conservative_policy_cat_desc: "\n\n£GFX_decision_SHA_conservative_policy_cat_picture\n\n\n\n\n§G산해경§!의 정치 지형이 급격히 요동치는 가운데, 모든 권력 투쟁을 제압하고 최종적으로 승리한 이는 §1우루시바라 카구야§!였습니다. 그녀는 오랜 시간 동안 준비해온 §Y'보수혁명'§!을 공식 선언하며 본격적인 개혁의 길에 나섰고, §g류우게 키사키§!를 상징적인 지도자로 내세워 학생 사회 전반의 지지를 결집시켰습니다.\n\n첫 번째 개혁 조치가 시행된 이후, 다양한 정책들이 논의되고 있으며, 그 핵심에는 §1우루시바라 카구야§!가 추구하는 §Y보수주의적 이상§!이 자리잡고 있습니다. 그녀는 전통적 가치와 질서를 기반으로 한 교육 체계의 개편, 공공 정책의 보수화, 그리고 §G산해경§! 고유의 윤리관 재정립 등 사회 전반에 걸친 체계적인 재건 작업을 추진 중입니다.\n\n이러한 개혁은 단순한 정치적 변혁을 넘어, §G산해경§!의 정체성과 철학을 근본부터 다시 세우는 작업이자, 앞으로 나아갈 방향을 명확히 규정하는 과정입니다. §1우루시바라 카구야§!의 리더십 아래 §G산해경§!은 과거의 혼란을 극복하고, §Y새로운 형태의 보수주의 국가§!로 탈바꿈해가고 있습니다.\n"
 SHA_conservative_social_reform: "보수혁명: 사회 부문"
 SHA_conservative_social_reform_desc: "산해경 사회는 자유주의의 병폐로 인해 심각하게 훼손되고 있습니다. 특히 자유주의적 가치관과 개인주의, 그리고 다윈주의적 사고방식은 산해경의 전통과 공동체적 질서를 붕괴시키며 사회 전반에 병을 퍼뜨리고 있습니다. 이러한 위기를 극복하기 위해 우리는 보수혁명을 통해 산해경만의 고유한 가치를 다시 세우고, 전통적 이상과 규범을 회복해야 합니다. 특히 현 문주인 류우게 키사키를 정신적 지주로 삼아, 사회적 결속과 공동체 중심의 통합을 이루는 것이 핵심 과제가 될 것입니다."
 SHA_conservative_economy_reform: "보수혁명: 경제 부문"
 SHA_conservative_economy_reform_desc: "완전한 자유시장경제는 결국 붕괴를 피할 수 없는 구조이며, 핵심 산업에 대한 학원의 통제는 필수적입니다. 특히 방위산업과 같은 전략적으로 중요한 분야에 대해서는 학원의 통제력을 더욱 강화할 것입니다. 거대 국영기업은 단순한 경제 주체를 넘어, 정부 정책을 집행하고 외교적 영향력을 행사하는 핵심 수단으로 활용될 것입니다. 이러한 기업에는 현룡문의 측근들이 파견되어 내부 감시와 통제를 담당하게 됩니다.\n\n산해경은 고립주의 기조 아래에서 경제적 자급자족과 수입 대체 산업의 육성에 힘써 왔으며, 이제는 대부분의 물자를 학원 내부에서 자체 생산할 수 있을 만큼 성과를 이뤘습니다. 우리는 외부의 압력이나 불안정한 국제 환경에도 흔들리지 않는 견고한 자립 경제를 구축하는 것을 목표로 나아갈 것입니다."
 SHA_conservative_policy_reform: "보수혁명: 정치 부문"
 SHA_conservative_policy_reform_desc: "‘권력의 수직’은 문주를 정점으로 하여 모든 조직에 일사불란한 명령 체계를 구축하는 것을 핵심으로 하는 이론입니다. 특히 문주가 직접 임명한 인물을 각지에 파견하여 지방에 대한 통제력을 강화하는 데 중점을 두고 있습니다. 아울러 반정부 성향을 띤 세력에 대해서는 이들의 자금 출처를 끈질기게 추적하여 자금 조달을 어렵게 만들고, 이를 통해 그들의 활동을 위축시키고 조직 자체를 점차 와해시키는 데 집중할 것입니다."

 SHA_conservative_army_reform: "산해경 자긍심 고취"
 SHA_conservative_army_reform_desc: "많은 이들은 산해경이 얼마나 위대한 학원인지 제대로 인식하지 못하고 있습니다. 산해경은 오랜 역사와 전통을 자랑하며, 수많은 이들이 그 보호 아래에서 행복한 공동체를 이루며 살아가고 있습니다. 그러나 이러한 사실이 널리 알려지지 않는다면, 공동체의 결속에 위협이 될 수 있습니다. 이에 우리는 산해경에 대한 자긍심을 고취하고 공동체의 일체감을 강화하기 위해, 다양한 선전물을 제작, 배포할 예정입니다."
 SHA_conservative_xuanwu_merchant_association: "'보수적인' 현무상회"
 SHA_conservative_xuanwu_merchant_association_desc: "아케시로 루미는 산해경 내에서 절대적으로 무시할 수 없는 높은 인지도를 가진 인물입니다. 이러한 인물을 단순히 가둬두는 것은 오히려 정부의 지지도 하락으로 이어질 수 있습니다. 따라서 현룡문은 '보수적인' 성향의 인사들을 현무상회에 파견하여 내부 감시와 통제를 맡기고, 루미의 영향력을 효과적으로 관리할 것입니다."
 SHA_conservative_rule_of_law: "엄벌주의 확대"
 SHA_conservative_rule_of_law_desc: "공동체에서 가장 중요한 가치는 바로 '안정'입니다. 이를 위협하는 범죄자들에게는 결코 자비를 베풀 수 없습니다. 비록 그 방식이 다소 엄격하고 가혹하게 보일 수 있을지라도, 공동체의 질서를 지키기 위해서는 범죄자에게 단호한 처벌을 내리고, 피해자에게는 실질적인 구제를 제공해야 합니다. 안정된 사회를 위해서는 징벌적 형벌이 불가피합니다."
 SHA_conservative_purge_of_decadent_culture: "퇴폐 문화 척결"
 SHA_conservative_purge_of_decadent_culture_desc: "현대 미술과 지구의 예술은 산해경을 좀먹는 독과 같습니다. 이러한 퇴폐적이고 사치스러운 문화는 산해경의 발전에 전혀 도움이 되지 않고 있습니다. 모든 퇴폐적인 예술 작품들은 파괴되어야 하고 산해경 고유의 문화를 되살려야 합니다. 많은 지식인과 예술가들은 펜 대신 망치를 들어 사회에 이바지 하도록 강요해야 합니다."

 SHA_conservative_clash_of_civilizations: "성전 지속"
 SHA_conservative_clash_of_civilizations_desc: "시간은 촉박하고, 적들은 좀처럼 무너지지 않고 있습니다. 이제 산해경의 학생들을 더 광범위하게 동원하여, 적의 방어선을 돌파하고 그 심장부에 결정적인 일격을 가해야 할 때입니다. 이 결정이 모두의 지지를 받지는 못하겠지만, 웅대한 보수혁명의 가치 아래 키보토스를 역병과 혼란에서 해방시키겠다는 신념이 무엇보다 우선되어야 합니다."

 SHA_conservative_revolution_ns: "산해경 보수혁명"
 SHA_conservative_revolution_ns_change: "§Y$SHA_conservative_revolution_ns$§! 변동치"
 SHA_conservative_revolution_modifier: "$SHA_conservative_revolution_ns$"

 # 인물
 SHA_KISAKI: "류우게 키사키"
 SHA_kisaki_leader_desc: "냉철함, 영민함, 다정함. 산해경의 '검은 군주'로 불리는 류우게 키사키를 표현하는 말은 수없이 많습니다. 그녀의 통치 방식을 되돌아보면 이러한 평가는 너무나도 당연한 일입니다. 현룡문이라는 거대한 집단을 이끄는 그녀에게 리더십이란 이미 오래전에 정복한 분야입니다. 어릴 때부터 강직했던 키사키는 전대 문주의 실정을 목도했고 개혁의 필요성을 절감했습니다. 류우게 키사키가 2학년이 되던 해에 전대 문주는 현룡문의 신임을 잃고 실각 했고, 현룡문의 만장 일치로 류우게 키사키가 현룡문의 문주 자리에 오르게 되었습니다. 문주로 오른 직후 그녀는 오랫동안 연단방에서 가장 큰 논란의 중심에 있던 신타니 카이를 퇴학 처분하였습니다.\n\n그러나 이 모든 과정은 결코 가벼운 대가를 요구하지 않았습니다. 정통성 논란과 정치적 불안정이라는 그림자가 끊임없이 그녀의 발걸음을 따라다녔습니다. 전통을 거스른 퇴학 조치는 일각에서 그녀의 정당성을 의심하는 빌미로 작용했고 이는 류우게 키사키가 반드시 넘어서야 할 가장 무거운 장벽으로 남아 있습니다."
