 # 정치
 SHA_dang_guo_system: "당국 체제"
 SHA_dang_guo_system_desc: "산해경의 고유한 통치 체제는 여타 국가들과는 근본적으로 그 성격을 달리합니다. 주권이 학생이나 시민에게 귀속되는 것이 아니라, 현지의 '당'에 가장 가까운 조직인 '현룡문'이 학원의 모든 권한을 장악하고 있습니다. 산해경에서 현룡문의 의지는 곧 학원의 의지이며, 그 어떤 기관도 현룡문의 결정에 우선할 수 없습니다."
 SHA_reestablish_school_rules: "무너진 교칙 재확립"
 SHA_reestablish_school_rules_desc: "이번 사건은 교칙이 유명무실해지는 결정적인 전환점이 되었습니다. 사건 이후 학원 내부는 말로 다 표현할 수 없을 만큼 극심한 혼돈 속에 빠져들었습니다. 이제 현룡문은 무너진 교칙을 바로 세워 조정이 여전히 건재함을 분명히 천명하고, 곳곳에 만연한 혼란상을 하나씩 걷어내며 질서를 회복해 나갈 것입니다. 이 모든 내부 정비 작업이 마무리되는 것을 시작으로, 오스트리아와의 관계 역시 차근차근 새로운 토대 위에서 재수립해 나갈 것입니다."
 SHA_confirm_minas_loyalty: "집행부장의 충성심 확인"
 SHA_confirm_minas_loyalty_desc: ""
 SHA_checks_and_balances: "견제와 균형"
 SHA_checks_and_balances_desc: ""
 SHA_fatherland_front: "조국전선(가칭) 정제"
 SHA_fatherland_front_desc: ""

 # 오스트리아 유화 정책
 SHA_Austrian_appeasement_policy: "오스트리아 유화 정책"
 SHA_Austrian_appeasement_policy_desc: "오스트리아인들은 본래 오스트리아 땅의 주인들이었습니다. 그러나 우리가 이들에게 영토를 양보하기에는 현실적으로 불가능한 상황입니다. 따라서 강경책 대신 유화책을 통해 이들을 체제에 복속시키는 것이 가장 현명한 선택일 것입니다."
 SHA_gathering_of_radicals: "급진파 결집"
 SHA_gathering_of_radicals_desc: "현룡문의 문주 류우게 키사키는 사태 발생 당시, 선도부의 지원을 받아 게헨나 학생들의 난동을 진압했습니다. 이는 명백히 산해경의 고립주의 원칙을 위반한 행위이며, 오랜 전통을 깨뜨린 중대한 사례로 기록될 것입니다. 애초에 정통성조차 부족했던 류우게 키사키는 이제 권좌에서 내려와야 합니다."
 SHA_Cooperation_with_Kaguya: "경극부에 접근"
 SHA_Cooperation_with_Kaguya_desc: "경극부는 현재 산해경에서 가장 충성스러운 집단으로 평가받아도 손색이 없을 것입니다. 하지만 이들의 충언을 무시하며 독단적인 행보를 이어가는 현 문주를 끌어내리기 위해서는 경극부와의 협력이 필수적일 것입니다."
 SHA_podium_room_cooperation: "연단방에 접근"
 SHA_podium_room_cooperation_desc: "연단방에는 신타니 카이를 추종하는 일부 급진파들이 모여있다는 소문이 돌고 있습니다. 만약 이들과 접촉하는데 성공한다면 추후의 현 문주를 권좌에서 끌어내릴때 크나큰 도움이 될 것입니다."
 SHA_Kisaki_Suppression: "키사키 억제"
 SHA_Kisaki_Suppression_desc: "때가 되었습니다! 현 문주의 우둔함을 폭로하기 위한 경극이 준비되었습니다. 경극부와 현룡문 내 일부 급진파와 협력하여, 경극 상연의 순간을 기회로 삼아 현 문주를 퇴진시키고 $SHA_KAGUYA$를 새로운 문주로 추대할 것입니다."
 # 신타니 카이 루트
 SHA_Shintani_Kai_Follow: "신타니 카이 복권"
 SHA_Shintani_Kai_Follow_desc: "신타니 카이는 과거 산해경에서 여러 소동과 문제를 일으킨 문제아였지만, $SHA_KISAKI$의 폭거로 인해 정당한 절차조차 없이 퇴학당했습니다. 이제 그녀를 다시 불러들일 것입니다."
 SHA_Kaguya_ousted: "$SHA_KAGUYA$ 축출"
 SHA_Kaguya_ousted_desc: "경극부의 힘에 입어 $SHA_KISAKI$를 몰아내는데에 성공하였습니다. 그러나 이제 경극부는 쓸모없는 짐 덩어리에 불과합니다. 연단방과 협력해 경극부를 습격하여 $SHA_KAGUYA$를 문주의 자리에서 끌어내리고 현룡문의 문주 자리를 차지할 것입니다."
 SHA_Shanhaijing_fascism: "신타니주의 주창"
 SHA_Shanhaijing_fascism_desc: ""
 SHA_Eastern_Alchemy_Society_solidarity: "연단방 결속"
 SHA_Eastern_Alchemy_Society_solidarity_desc: ""
 SHA_consolidate_industries: "오스트리아 산업 통합"
 SHA_consolidate_industries_desc: ""
 SHA_Sundan_dosage: "선단 개발 가속"
 SHA_Sundan_dosage_desc: "산해경의 목표이자 존재 이유 또한 신타니 카이의 야망을  위해서 선단 개발에 박차를 가해야할 것입니다."
 SHA_Sundan_dosage_tt: "산해경의 지도자 신타니 카이는 §Y선단 개발§!을 위한 위대한 여정을 시작할 것입니다.\n\n시작시 §Y완성도는 1/8§!입니다."
 SHA_podium_room_expansion: "연단방 확장"
 SHA_podium_room_expansion_desc: "확장하면 좋습니다."
 SHA_cult_of_personality: "개인숭배"
 SHA_cult_of_personality_desc: ""
 SHA_Seonin: "\"신선\""
 SHA_seonin_custom_trigger: "신선이 되는 약을 개발함."

 SHA_ascension: "승천"
 SHA_ascension_desc: ""
 SHA_Alchemy_and_modern_science: "연금술과 현대 과학"
 SHA_Alchemy_and_modern_science_desc: ""
 SHA_supremacy_of_will: "의지의 우월성"
 SHA_supremacy_of_technology: "기술의 우월성"
 SHA_Twilight_of_the_Gods: "신들의 황혼"
 SHA_Twilight_of_the_Gods_desc: "불길이 거세게 타오르는 가운데, 라인강이 화장터를 휩쓴다. 그때, 라인강의 세 처녀가 불씨 가까이 모습을 드러낸다. 하겐은 그녀들이 반지를 찾으려 하자 무장을 풀고 홍수 속으로 뛰어든다. 그러나 두 처녀가 그를 깊은 물속으로 끌고 가고, 남은 한 명이 반지를 찾아 기뻐한다. 하늘이 붉게 물들며 점차 발할라의 형상이 나타난다. 신들과 영웅들이 앉아 있는 발할라는 거대한 불길에 휩싸이고, 불꽃이 모든 것을 삼키며 막이 내린다."
 SHA_Ragnarok: "라그나로크"
 SHA_Ragnarok_desc: "검은 늑대 하늘을 삼키고 뱀의 독 바다를 물들이네.\n뿔나팔 울려 전쟁이 열리면 신들은 운명 속에 나아가리.\n\n불꽃의 말이 대지를 달리고 거인은 태양을 무너뜨리네.\n그러나 불길이 모든 걸 삼킨 후, 새로운 세계는 다시 피어나리."


 # 보수 혁명 루트
 SHA_conservative_revolution: "보수혁명"
 SHA_conservative_revolution_tt: "현재 §Y파시즘 지지율§!을 §Y비동맹주의 지지율§!로 변환합니다."
 SHA_conservative_revolution_desc: "수 년 넘게 산해경엔 제대로 된 보수파 문주가 없었으며, 전 문주의 짧았던 임기를 감안해봤을 때 이 퇴폐의 공백은 수십 년 이상으로 늘어납니다. 이러한 가식은 끝나야 합니다. 우리는 웅대한 보수혁명 속에서 올바른 산해경 애국자들의 이상에 따라 산해경을 재편해야 합니다."
 SHA_new_shanhaijing_conservatism: "새로운 산해경 보수주의"
 SHA_new_shanhaijing_conservatism_desc: "수년간 산해경의 보수주의는 오염되고 더럽혀졌으며, 정치인들의 도구로 전락하고 말았습니다. 이제 우리는 기존의 보수주의를 되찾기 위해 이념적 순수성을 회복해야 합니다. 산해경 보수주의의 본질을 재정의하고, 그 가치를 다시금 세워야 할 때입니다."
 SHA_Expansion_of_cooperation_with_other_clubs: "타 동아리 협력 확대"
 SHA_Expansion_of_cooperation_with_other_clubs_desc: "이념적 차이는 잠시 접어두고, 우리는 협력해야 합니다. 적들은 사방에 넘쳐나며, 거센 폭풍처럼 우리를 덮칠 힘을 가지고 있습니다. 그렇기에 우리는 하나로 뭉쳐, 산해경 보수주의의 불길을 지켜내고 끝까지 타오르게 해야 합니다."
 SHA_Cabinet_Secretariat: "산해경 추밀원"
 SHA_Cabinet_Secretariat_desc: "현 문주는 산해경 보수주의의 상징이자, 학생들과 인민들의 통합을 상징하는 존재로서 반드시 유지되어야 합니다. 그러나 문주의 정책을 보좌하고, 현룡문과 정부의 원활한 소통을 위해 우리는 새로운 추밀원을 설립할 것입니다. 이 기구는 오직 선량하고 애국적인 보수주의자들로 구성되며, 산해경의 미래를 위해 충실히 역할을 수행할 것입니다."
 SHA_organic_national_polity: "유기적 국체"
 SHA_organic_national_polity_desc: "북쪽, 키보토스의 자유주의적 방식은 산해경 사회에 적합하지 않습니다. 우리는 부패한 선거주의를 따르는 것이 아니라, 경극부와 산해경 보수주의 이론가들의 이상을 실현하기 위해 나아가야 합니다. 능력 있는 자들이 계급을 상승하며 지도력을 발휘하는 능력주의적 권위주의, 즉 유기적 국가를 구축하는 것이야말로 우리의 길입니다."
 SHA_Democratic_Culture_Censorship: "반키보토스적 민주주의 문화 척결"
 SHA_Democratic_Culture_Censorship_desc: "제목이 곧 내용"
 SHA_New_Genryumon_Peking_Opera_Department_Relations: "새로운 현룡문 - 경극부 관계"
 SHA_New_Genryumon_Peking_Opera_Department_Relations_desc: ""
 SHA_Engine_of_conservative_revolution: "보수혁명의 원동기"
 SHA_Engine_of_conservative_revolution_desc: ""
 SHA_people_conservatism: "대중보수주의 육성"
 SHA_people_conservatism_desc: ""
 
 SHA_2nd_conservative_revolution: "제 2차 보수혁명"
 SHA_2nd_conservative_revolution_desc: "퇴폐의 20년이 지나고, 우리는 진정한 보수적 지도자를 만나 웅대한 보수혁명의 가치를 바로 세웠습니다. 또한, 백귀야행에게 빼앗겼던 영토를 되찾으며 보수혁명을 성공적으로 완수했습니다. 그러나 사회 곳곳에는 여전히 퇴폐적인 문화의 잔재가 남아 있습니다. 이러한 잔재를 완전히 없애고자 우리는 제2차 보수혁명을 시작해야 합니다. 이는 애국자들의 이상을 온전히 실현하기 위한 중요한 발걸음이 될 것입니다."
 SHA_eradication_of_liberalism: "보수주의의 성채"
 SHA_eradication_of_liberalism_desc: ""
 SHA_Resurrection_of_the_Soul_of_Shanhaijing: "산해경 영혼의 부활"
 SHA_Resurrection_of_the_Soul_of_Shanhaijing_desc: ""
 SHA_Establishment_of_the_National_Council: "학원평의회 설립"
 SHA_Establishment_of_the_National_Council_desc: ""
 SHA_Kivotos_conservative: "보수혁명 전파"
 SHA_Kivotos_conservative_desc: "키보토스의 자유주의와 사회주의는 모두 반산해경적 음모를 조장하는 역겨운 종양입니다. 이들은 키보토스 전역에 퍼져 있으며, 그 존재 자체가 분명한 위협이 되고 있습니다. 그렇기에 우리만의 혁명을 더욱 널리 퍼뜨려야 합니다. 이를 통해 진정한 보수적 가치를 실현하고, 키보토스를 올바른 길로 되돌려야 합니다."
 SHA_clash_of_civilizations: "문명의 충돌"
 SHA_clash_of_civilizations_desc: "거대한 충돌이 시작되자, 산해경의 학생들은 자발적으로 이 거대한 흐름에 뛰어들었습니다! 우리는 웅대한 보수혁명의 깃발 아래 단결하여, 자유주의와 사회주의라는 악성 종양으로부터 전 세계를 구해야 합니다. 이는 단순한 정치적 대립이 아니라, 문명의 미래를 결정짓는 운명적 싸움입니다!"

 # 공용
 SHA_strike_suppression: "파업 진압"
 SHA_strike_suppression_desc: "대전이 직후 산해경은 더욱 강력한 고립주의 정책을 채택했으며, 이는 상인연합회의 불만을 불러일으키기에 충분했습니다. 결국 그들은 12월에 현룡문의 정책에 반대하며 개혁과 개방을 요구하는 총파업에 돌입했습니다. 그러나 이러한 행동이 오히려 산해경의 상황을 더 악화시킬 뿐이라는 사실을 이들에게 명확히 깨닫게 하고, 필요하다면 무력으로 이를 진압해야 할 것입니다."
 SHA_Sack_of_Rumi: "루미 억제"
 SHA_Sack_of_Rumi_desc: "아케시로 루미는 12월 총파업의 주동자 중 한 명으로 지목됩니다. 루미를 억제함과 동시에 현무상회에 강력한 제재를 가함으로써 산해경의 전통을 수호하고, 나아가 보수적인 가치를 더욱 공고히 할 것입니다."

 # 현지 화합 (공산, 민주)
 SHA_local_harmony: "현지 화합"
 SHA_local_harmony_desc: ""

 SHA_appointment_of_BTP: "현무상회 인사 등용"
 SHA_appointment_of_BTP_desc: "세계는 빠르게 변화하고 있으며, 상업을 담당하는 현무상회는 그 변화의 중심을 지나가는 길목에 서 있습니다. 이들은 적어도 '보수적인' 현룡문보다는 보다 진취적인 개혁안을 제시할 가능성이 높으며, 만약 현무상회의 인물들을 대거 등용한다면, 우리의 방향 역시 더욱 발전적인 길로 나아갈 수 있을지도 모릅니다."
 SHA_release_austrian_politician: "오스트리아 정치인 석방"
 SHA_release_austrian_politician_desc: "산해경의 새로운 정책 시행으로 인해 오스트리아 출신 정치인들의 대부분이 사면되었습니다. 이들 중 상당수는 새로운 질서에 순응하며, 다시 정치에 입문하기를 희망하고 있습니다."
 SHA_university_of_vienna: "빈 대학교"
 SHA_university_of_vienna_desc: ""
 SHA_formation_of_labor_union: "노동조합 결성"
 SHA_formation_of_labor_union_desc: ""
 SHA_womens_education_initiative: "여성 교육"
 SHA_womens_education_initiative_desc: "산해경에서는 오랜 시간 동안 여성들에게도 평등한 교육 기회가 보장되어 왔습니다. 그러나 오스트리아에서는 상황이 달랐습니다. 여성들은 차별적인 대우를 받아왔으며, 그 결과 교육 기회의 부족이라는 현실로 그 격차가 증명되었습니다."
 SHA_progressivism_through_science: "과학을 통한 진보"
 SHA_liberation_theology: "해방신학"
 SHA_state_atheism: "세속주의 원칙"
 SHA_affiliate_with_catholic: "가톨릭과 제휴"
 SHA_progressivism_through_science_desc: ""
 SHA_fight_against_extremism: "극단주의에 대항"
 SHA_fight_against_extremism_desc: "극단주의는 언제나 사회에 해악을 끼쳐왔습니다. 그들은 늘 과격한 방법만을 추구하며, 이러한 방식은 결코 용인될 수 없습니다. 따라서 우리는 이들의 위협에 맞서 적극적으로 대응해야 합니다."
 SHA_agrarian_socialism: "농촌 사회주의의 이론"
 SHA_strengthening_parliamentarism: "의회주의 강화"
 SHA_strengthening_parliamentarism_desc: "현룡문과 문주 중심의 체제는 언뜻 보기에는 완벽해 보이지만, 문주의 권한이 지나치게 강력하여 별다른 문제가 발생하지 않는 한 장기 집권이 사실상 보장된다는 구조적 한계를 지니고 있습니다. 따라서, 현룡문의 권한을 강화하여 문주의 권력을 견제할 수 있는 장치를 마련해야 합니다."
 SHA_a_new_constitution: "산해경 헌법 제정"
 SHA_a_new_constitution_flag: "§Y$SHA_strengthening_parliamentarism$§! 중점 완료"
 SHA_str_par_focus_days_tt: "현재 일수: [?SHA_a_new_constitution_flag:days|Y0]"
 SHA_defensive_democracy: "방어적 민주주의"
 SHA_defensive_democracy_desc: "산해경의 민주화는 수백 년 역사 속에서 가장 위대한 업적 중 하나로 꼽힐 것입니다. 이러한 민주주의는 결코 쉽게 잃어버리거나 훼손될 수 없으며, 우리는 자유의 적에게 자유를 허용할 수 없듯이, 민주주의가 스스로의 제도 속에서 자멸하는 상황을 막기 위해 행동해야 합니다."
 SHA_transplanting_capitalist_system: "시장 개방"
 SHA_transplanting_capitalist_system_desc: "산해경의 경제는 현룡문의 경제 전문가들이 주도하는 계획 경제로 운영되었으며, 시장 개방은 극도로 제한되어 왔습니다. 그럼에도 불구하고, 현무상회가 상업을 번성시킨 것은 주목할 만한 성과이며, 이를 통해 산해경의 학생들은 자유 시장의 장점을 직접 경험하게 되었습니다. 이제, 이러한 변화를 전국적으로 확대하여 사람들에게 더 많은 자유를 보장해야 합니다."
 SHA_democracy_education: "민주주의 교육"
 SHA_democracy_education_desc: "민주정의 근본은 산해경의 모든 시민들에게 있습니다. 그러나 오랜 기간 동안 문주의 권위주의적 통치 아래 머물러 있던 이들은 정치에 대한 관심이 부족합니다. 이대로 방치한다면, 자칫 대중들의 무관심 속에서 소중한 민주정이 무너질 위험이 있습니다."
 SHA_hold_elections: "선거 실시"
 SHA_hold_elections_desc: "산해경에 안정이 찾아오고 있고 헌법 또한 제정하였습니다. 우리는 이제 헌법에 명시된 대로 산해경에 첫번째 자유 선거를 개최할 시간이 다가오고 있습니다. 산해경을 이끌 후보는 얼마든지 준비 되어 있고 이제 국민들이 선택할 시간입니다."
 SHA_a_responsible_government: "학생주권정부"
 SHA_guided_democracy: "전 문주, 현 대통령"

 SHA_communist_branch: "오스트로 맑시즘 수용" 
 SHA_communist_branch_desc: "$AUS_austromarxism_focus_desc$"
 SHA_communism_focus_1: "'붉은 빈'"
 SHA_communism_focus_1_desc: "제국이 붕괴하며 빈은 극심한 빈곤, 주택난, 실업, 인플레이션에 시달렸습니다. '붉은 빈'은 이를 해결하기 위해 1919년부터 1934년까지 사회민주당이 집권하여 시행한 일련의 진보적 정책들을 의미합니다. 비록 1934년의 2월 봉기로 우익 세력이 집권하며 '붉은 빈'은 종료되었지만, '붉은 빈'은 여전히 공공주택의 모범, 도시 복지의 기초, 진보적 지방정치의 전형으로 남아있습니다."
 SHA_red_wien: "'붉은 빈'"
 SHA_Naukograd: "나우코그라드"
 SHA_Naukograd_desc: "나우코그라드는 '과학 도시'를 의미하며, 연구 개발시설이 밀집된 도시를 가리키는 명칭입니다."
 SHA_communism_focus_2: "좌익 민병대"
 SHA_communism_focus_2_tt: "§Y내전§!이 시작되면 §Y민병 사단§!을 받습니다. §Y내전 중§!이거나 §Y내전§!이 종료됐다면, §Y민병 사단§!을 즉시 받습니다."
 SHA_communism_focus_2_desc: "내전을 대비하기 위해 우리의 대의에 찬성하는 민병대를 조직할 것입니다."
 SHA_communism_focus_3: "평의회 운동 재개"
 SHA_communism_focus_3_desc: "평의회 운동은 전후 유럽 전역에서 일어난 노동자 중심의 혁명 운동으로, 이를 재개함에 따라 우리는 노동계급의 혁명성에 다시금 불을 지필 것입니다."
 SHA_communism_focus_4: "대중주의적 조합주의"
 SHA_communism_focus_5: "현무상회 좌경화"
 SHA_communism_focus_6: "'대중파업론'"
 SHA_communism_focus_6_desc: "총파업은 우리의 주먹입니다!"
 SHA_communism_focus_7: "34년에 대한 복수"
 SHA_communism_focus_7_desc: "1934년 2월, 사회민주적 오스트리아 공화국을 지키기 위한 마지막 횃불이 반혁명 세력들에 의해 무참히 짓밟혔었습니다. 이제 칼자루를 쥔 건 우리입니다!"
 SHA_communism_focus_8: "사회주의 산해경"
 SHA_communism_focus_8_desc: ""
 SHA_communism_focus_9: "국제주의 대오"
 SHA_communism_focus_9_desc: "해외의 사회주의 동지들과 연대해야 합니다."
 SHA_communism_focus_10: "산해경-소련 산업 연계"
 SHA_communism_focus_10_desc: ""
 SHA_communism_focus_11: "소련 연구단지"
 SHA_communism_focus_11_desc: ""
 SHA_communism_focus_12: "주변의 위협"
 SHA_communism_focus_12_desc: "우리의 주변에는 방금 막 태어난 사회주의 [SHA.GetAdjective]을 무너트리려는 반혁명 세력들로 가득합니다. 우리는 자주적인 국방력을 갖추지 않을 수 없습니다."
