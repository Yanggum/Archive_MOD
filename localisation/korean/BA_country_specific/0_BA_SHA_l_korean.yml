 SHA_GATHERING_STORM_DESC: "전임 문주의 유산을 고스란히 떠안은 산해경은 지금 운명의 기로에 서 있습니다. 키사키가 산해경의 전권을 틀어쥐고 있음은 분명하나 '전통을 어겼다'는 오명을 뒤집어쓴 채 현룡문주로서 사방에서 밀려오는 압박을 온몸으로 버텨내고 있습니다. 외부에서는 경극부가 전통을 저버린 류우게 키사키의 노선을 바로잡겠다는 명분 아래 '충의'를 드러낼 기회를 호시탐탐 엿보고 있으며 칠대죄수 중 하나인 신타니 카이는 새로운 시대의 도래를 온몸으로 직감하며 연단방과 일부 현룡문 임원들과 은밀히 손을 잡으려는 움직임을 가시화하고 있습니다."
 SHA_country_intro_header: "남방의 진주"
 SHA_country_intro_content: "키보토스에서 가장 오랫동안 외부와의 공식적인 교류가 단절된 학원으로 손꼽히며 은둔과 고립을 떠올릴 때 가장 먼저 머릿속에 그려지는 곳이 바로 §G산해경 고급중학교§!입니다. 키보토스의 오랜 전통과 옛 모습을 가장 짙게 간직하면서도 요식업과 관광업 등 상업이 크게 발달한 이 학원에는 §G현룡문§!과 §O현무상회§!를 둘러싼 권력 다툼의 흔적이 오래전부터 깊이 새겨져 있습니다.\n\n다만 권력투쟁이라는 표현은 다소 과장된 감이 없지 않습니다. §O현무상회§!가 아무리 세를 불려도 결국은 상인들의 연합체에 불과하며 §G현룡문§!의 통제 아래 놓여 있습니다. 조금이라도 §G현룡문§!에 반기를 드는 날에는 즉각 해산령이 내려질 수 있습니다. 그러나 역대 문주들은 §O현무상회§! 역시 §G산해경§!을 이루는 하나의 소중한 구성원으로 여겨왔으며 현 문주인 §g류우게 키사키§! 또한 이러한 시각을 그대로 이어받고 있습니다."
 SHA_country_intro_header_1: "전대 문주의 유산"
 SHA_country_intro_content_1: "전대 문주, 즉 이전의 §G현룡문§! 문주는 현재 §G산해경§!이 안고 있는 모든 문제의 근원이나 다름없습니다. §G현룡문§!의 문주는 관례적으로 3학년이 맡는 것이 불문율이었으나 전대 문주는 불미스러운 사건으로 §G현룡문§!의 신임을 잃고 끝내 실각하고 말았습니다. 이후 §G현룡문§!의 만장일치로 §g류우게 키사키§!가 차기 문주로 추대되었습니다.\n\n문주의 자리에 오른 §g키사키§!는 오래전부터 논란의 중심에 있던 §C연단방§!의 부장 §F신타니 카이§!를 추방하기로 결심했습니다. §G현룡문§!의 많은 인사들이 강하게 반대했음에도 §g키사키§!는 퇴학을 강행했고 그녀와 관련된 모든 기록을 지워버렸습니다. 그러나 이 결정은 양날의 검이었습니다. 학칙을 어기면서까지 밀어붙인 이 조치는 §g키사키§!의 전통성에 깊은 상처를 남겼고 나아가 §G산해경§!의 문주로서의 자격마저 위태롭게 만들 수 있는 위험한 선택이었습니다.\n\n§F신타니 카이§!가 퇴학 처분을 받은 이후 §g류우게 키사키§!의 건강은 갑작스럽게 악화되기 시작했습니다. §C연단방§!의 새로운 부장으로 자리에 오른 야쿠시 사야의 헌신적인 도움으로 더 이상의 악화는 간신히 막을 수 있었으나 그것도 현상 유지에 그칠 뿐이었습니다. 결국 §g류우게 키사키§!는 외부 활동에 심각한 제약을 받는 나날을 보내야 했습니다."
 SHA_country_intro_header_2: " £GFX_AUS_austria_national_emblem 쌍두수리 위의 검은 용£GFX_SHA_academy_emblem"
 SHA_country_intro_content_2: "늘 같은 하루가 반복되던 산해경의 일상은 전대미문의 사태로 인해 마침내 외부 세계와 강제로 맞닿게 되었습니다. 오스트리아와의 전투는 산발적인 저항의 불씨만을 남긴 채 허무하게 막을 내렸습니다. 산해경의 군대가 빈을 완전히 포위하고 무조건 항복을 요구하자, 오스트리아 정부는 사실상 기능을 잃고 마비 상태에 빠지고 말았습니다. 국경 일대에서 소규모 교전이 간헐적으로 이어졌으나, 압도적인 전력 차이 앞에 저항의 불씨는 오래 버티지 못하고 이내 꺼져버렸습니다. 결국 슈슈니크 총리는 항복을 선언했고, 그의 떨리는 손으로 마지막 서명이 이루어지며 협상은 끝을 맺었습니다.\n\n국가의 존속은 보장받았으나, 협상의 결과는 오스트리아에게 더없이 굴욕적인 것이었습니다. 생존을 담보로 오스트리아는 주권 국가로서의 지위를 내려놓아야 했습니다. 산해경의 '동등한 구성국'으로 편입된 것이 아니라, 일반 지방보다는 높되 구성국보다는 낮은 어중간한 위치에 놓이게 된 것입니다. 대부분의 행정 권한은 육화각에 종속되었고, 의회는 명목상 그 형태를 유지하고 있으나 실질적인 권한은 극히 제한적인 수준에 머물렀습니다. 군대는 완전히 해산되었으며, 현룡문에 대표를 파견하여 오스트리아 관련 정책의 수정이나 개선을 요구할 수는 있으나, 이는 근본적인 해결책과는 거리가 먼 방편에 불과했습니다.\n\n협정 타결의 책임을 통감한 슈슈니크는 결국 스스로 사퇴를 선언했고, 총리직은 공석으로 남겨졌습니다. 대통령직은 형식상 유지되고 있으나 그 권한은 대폭 축소되었으며, 실질적인 모든 결정권은 현룡문의 문주에게 귀속되었습니다."
