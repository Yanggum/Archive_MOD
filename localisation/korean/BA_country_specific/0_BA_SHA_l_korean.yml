 SHA_pardon_austrian_general: "오스트리아 장교 사면"
 SHA_pardon_austrian_general_desc: "오스트리아인 장교들은 현재 중앙특구 인근 수감 시설에 억류되어 있습니다. 오스트리아는 다수의 전쟁을 치러온 만큼 풍부한 실전 경험을 지닌 유능한 지휘관들을 보유하고 있으며, 그러한 인재들을 시설에서 방치하는 것은 누가 보아도 낭비입니다. 일부는 은퇴를 택할 수도 있겠으나, 적절한 설득을 통해 이들이 산해경 방위군에 복무하도록 유도할 것입니다."

