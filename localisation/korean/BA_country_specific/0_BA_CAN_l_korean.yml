 CAN_vaccination: "영국병 치료"
 CAN_vaccination_desc: "\"위대한 망명\" 도중 발생한 전염병은 우리 사회를 병들게 하였습니다."
 CAN_create_CBC: "CBC 설립"
 CAN_create_CBC_desc: "캐나다 라디오방송위원회를 CBC(Canadian Radio Broadcasting Commission)라고 하는 본격적인 전국 라디오 방송망으로 확대하자는 제안이 제시되었습니다. 이것은 분단된 국가를 통합하고 잠재적으로 반체제적인 해외 방송의 영향력을 제한하는데 도움이 될 것입니다."
 CAN_supply_the_impire: "제국으로의 보급품"

 CAN_canada_neutrality: "제1세계"
 CAN_canada_neutrality_desc: "캐나다는 더 이상 키보토스 국가들이나 [SOV.GetAdjective]와 같은 기존 강대국들에 의존하는 외교 방식을 따를 수 없습니다. 이제 우리는 차별화된 외교 정책을 수립해야 합니다. 그 해답은 바로, 제1세계에 있습니다."
