 ENG_country_intro_header: "지배하라 브리타니아!"
 ENG_country_intro_header_1: "대전쟁과 평화"
 ENG_country_intro_header_2: "브리튼인은 결코 노예가 되지 않으리라."
 ENG_country_intro_content: "나폴레옹 전쟁에서의 승리는 대영제국을 전세계적인 패권 국가로 성장시키는 기점이 되었습니다. 프랑스에 맞선 대프랑스 동맹군의 승리는 유럽에서의 프랑스의 영향력을 약화시켰고, 영국은 상대적으로 강력한 해군과 전 세계에 걸친 무역망을 토대로 국제 질서를 주도하였습니다. 이때부터 시작된 '팍스 브리타니카'는 대영제국이 세계의 주요 분쟁을 조정하고 평화를 유지하는 시기로, 가장 위대했던 시기로 기억되고 있습니다.\n\n나폴레옹 전쟁이후 찾아온 빅토리아 시대의 황금기는 대영제국이 최고의 시기를 보낼수 있도록 해주었지만, 그 시기에 거의 존재하지 않았던 전쟁은 하여금 영국인들이 평화에 절여져 있게 해주는 결과를 낳았습니다. 대영제국은 영광스러운 시기를 누렸습니다. 홍콩, 오스트레일리아, 뉴질랜드, 캐나다, 더 나아가 인도라는 거대한 보석이 장식한 대영제국의 왕관은 대영제국의 어마어마한 위상을 전 세계에 알렸습니다.\n\n해마다 시간이 지나면서, 프랑스라는 라이벌과 사실상 전세계를 양분한 대영제국은 스페인의 뒤를 이어 \"해가 지지 않는 제국\" 이라는 별명을 얻게 되었습니다. 대영제국의 위상은 계속해서 이어질 것만 같았습니다."
 ENG_country_intro_content_1: "하지만 모든 것에는 끝이 있는 법. 대영제국의 위세도 서서히 흔들리기 시작했습니다. 나폴레옹을 꺾고 유럽을 지배하던 영국은 시간이 지나면서 새로운 강대국들의 도전을 마주하게 됩니다. 특히 프로이센이 통일을 이루어 독일 제국을 형성한 후, 급속도로 국력을 키워나가며 대영제국의 뒤를 바짝 추격했습니다. 독일 제국의 황제 빌헬름 2세가 추진한 ‘세계 정책(Weltpolitik)’은 제국주의적 야망을 드러내며 유럽과 세계의 질서를 재편하려 했습니다. 이러한 독일의 부상은 영국의 오랜 경쟁자인 프랑스와 손을 잡게 할 만큼 위협적이었습니다.\n\n결국 이 갈등은 점차 고조되었고, 마침내 제1차 세계대전, 즉 대전쟁이라는 참혹한 비극으로 이어졌습니다. 이 전쟁은 유럽과 전 세계를 휩쓸며 수많은 생명을 앗아갔고, 영국을 포함한 주요 강대국들에 막대한 피해를 입혔습니다. 대영제국 역시 전쟁에서 수많은 군인들이 목숨을 잃었으며, 전쟁으로 인해 재정적, 경제적 부담이 급증했습니다. 이는 대영제국의 위상을 크게 흔들어 놓았고, 더 이상 이전처럼 압도적인 힘을 유지하기 어려운 상황에 놓이게 되었습니다.\n\n그럼에도 불구하고, 대영제국은 이 위기를 견뎌냈습니다. 전 세계에 뻗어있던 광대한 식민지와 여전히 탄탄했던 경제적 기반 덕분에, 대전쟁 이후 찾아온 대공황 속에서도 비교적 안정적인 위치를 유지할 수 있었습니다. 하지만 전쟁의 상흔은 영국 사회와 경제에 깊은 충격을 남겼습니다. 전쟁 중 소모된 막대한 자원과 인력, 그리고 그로 인해 발생한 재정적 부담은 영국을 점차 쇠약하게 만들었습니다. 이로 인해 대영제국은 점차 전쟁에 소극적인 태도를 취하게 되었으며, 세계 무대에서의 리더십도 서서히 약화되었습니다"
 ENG_country_intro_content_2: "전 세계에 깃발을 휘날리던 대영제국의 뒤에 칼을 찌른 것은, 그 무엇도 아닌 갑작스레 나타난 외지인들 이었습니다. 그들은 유럽을 엉망으로 만들었고, 영국또한 예외는 아니었습니다. 카이저 코퍼레이션이라는 외계인들에게 런던이 함락되고 유럽 국가들이 붕괴되어가는 것들을 본 대영제국의 시민들은 정치인과 일반 시민들을 가리지 않고 그들과 맞서고 있습니다.\n\n하지만 대영제국의 운명은 마치 바람위의 등잔불과 같습니다. 제국의 위상을 상징하던 식민지들은 영국이라는 참주가 흔들리는 것을 보며, 그 족쇄로부터 탈출할 기회를 호시탐탐 노리고 있습니다. 카이저 코퍼레이션과 영국군과의 힘의 차이는 영국인들 사이에 절망이라는 싹이 피어나게 했습니다.\n\n노르만 침공 이후로 외세의 공격을 받지 않아왔던 브리튼 제도가 다시금 혼란에 휩싸이고 있습니다. 지금 당장 그들에게 보이는 희망은 아무것도 없어 보이지만, 브리타니아의 이름아래에 군인들은 소총을 들고 끝까지 외계인들과 맞서 싸울 것입니다."