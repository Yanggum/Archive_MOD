 IMP.4.t: "은퇴를 요청한 $ENG_stanley_baldwin$"
 IMP.4.desc: "오늘, 스탠리 볼드윈 경은 총리직을 사임하는 결정을 내렸습니다. 최근 며칠간 유럽은 끊임없는 혼란 속에서 무너졌습니다. 독일과 프랑스의 붕괴는 전 세계에 깊은 충격을 주었고, 영국 역시 이 끔찍한 위기에서 자유로울 수 없었습니다. 영국 본토는 이계의 기습을 받으며 항복을 선언할 수밖에 없었고, 이에 따라 대영제국의 정부는 캐나다로 망명하게 되었습니다.\n\n볼드윈 총리는 이러한 위기의 순간에 영국을 이끌며 최선을 다했습니다. 그러나 지속되는 위기와 혼란 속에서 쌓인 피로와 과로는 결국 그의 건강을 악화시켰고, 이로 인해 그가 총리직을 내려놓는 결정을 하게 되었습니다.\n\n그의 지도력과 헌신은 결코 잊혀지지 않을 것이며, 그는 나라를 위한 봉사와 헌신으로 기억될 것입니다. 새로운 지도자가 이 어려운 시기를 이끌어 나갈 때에도, 스탠리 볼드윈 경의 업적은 대영제국의 역사 속에서 영원히 빛날 것입니다."
 IMP.4.a: "수고가 많았네. $ENG_stanley_baldwin$ 백작."
 IMP.5.t: "총리 임명식"
 IMP.5.mackenzie: "오늘, 에드워드 국왕은 대영제국의 새로운 총리로 캐나다의 윌리엄 라이언 $CAN_mackenzie_king$을 임명하였습니다. 최근 서방 세계의 붕괴와 영국 본토의 기습 및 항복으로 인해 대영제국은 캐나다로 망명할 수밖에 없었습니다. 이러한 위기 상황 속에서, 국왕의 친정 체제가 유지되어 왔지만, 캐나다 의회와 자치령 정부들의 요구에 따라 새로운 지도자의 임명이 불가피해졌습니다.\n\n에드워드 국왕은 캐나다의 총리이자 자치령 간의 결속을 상징하는 인물로서, $CAN_mackenzie_king$을 선택하였습니다. $CAN_mackenzie_king$은 캐나다에서 오랜 정치 경력을 쌓아왔으며, 그의 온건하고 신중한 지도력은 자치령 간의 안정과 협력을 유지하는 데 중요한 역할을 해왔습니다. 또한, 그는 캐나다 정부의 전폭적인 신뢰를 받고 있으며, 이번 임명으로 자치령 전체의 결속을 다질 수 있을 것으로 기대됩니다.\n\n$CAN_mackenzie_king$의 임명은 자치령 내에서의 연대를 강화하고, 대영제국이 이계의 위협에 맞서 보다 굳건한 방어 체제를 구축하는 데 중추적인 역할을 할 것입니다. 그는 이번 위기를 극복하고 제국의 재건을 이끌어갈 적임자로 평가받고 있습니다.\n\n에드워드 국왕은 $CAN_mackenzie_king$을 임명하며, \"이 힘든 시기에 자치령 간의 협력과 단결이 무엇보다도 중요합니다. $CAN_mackenzie_king$ 총리는 이러한 시대적 요구를 이끌어 나갈 적임자입니다\"라고 강조했습니다.\n\n$CAN_mackenzie_king$은 대영제국의 안정과 자치령 간의 협력을 최우선으로 삼고, 이 위기 속에서 제국을 다시 일으키기 위한 노력을 기울일 것입니다."
 IMP_5public: "영국 제60대 총리. "
 IMP.5.a: "$IMP_5public$ $ENG_winston_churchill$."
 IMP.5.b: "$IMP_5public$ $CAN_mackenzie_king$."
 IMP.6.t: "캐나다 의회의 성명서: $ENG_king_edward$ 국왕께 드리는 호소"
 IMP.6.desc: "존경하는 $ENG_king_edward$ 국왕 폐하,\n\n우리는 현재 서방 세계의 붕괴와 대영제국의 위기 속에서, 한 치 앞을 내다볼 수 없는 상황에 처해 있습니다. 영국 본토가 기습을 받아 항복한 이후, 제국의 중심은 이제 캐나다로 옮겨졌습니다. 대영제국의 국민과 자치령들은 폐하의 리더십 아래 모여들었고, 폐하께서 친정을 통해 이 위기의 시간을 이끌어 주신 것에 깊이 감사드립니다.\n\n그러나 이 어려운 시기에도 불구하고, 우리는 정부의 정상화를 통해 국가의 안정과 지속성을 회복해야 한다고 믿습니다. 현재 대영제국의 자치령들과 국민들은 캐나다 정부가 강력한 지도력을 발휘해 이 위기를 극복할 수 있기를 바라고 있습니다. 캐나다 총리의 지도력이 다시 온전히 발휘될 때, 대영제국의 결속을 유지하고 서방 세계의 변화로 인한 도전에 효과적으로 대응할 수 있을 것입니다.\n\n이에 따라, 캐나다 의회는 폐하께 간곡히 요청드립니다. 폐하께서 비상 체제를 마무리하시고, 캐나다 총리에게 다시 정부 운영의 전권을 맡기셔서 국민들에게 안정과 희망을 주시기를 간청드립니다. 이와 같은 조치가 이루어져야만 우리는 단결된 마음으로 미래를 준비하며, 위기를 극복할 수 있을 것입니다.\n\n존경하는 폐하, 이제 폐하께서는 중요한 결단을 내리셔야 할 때가 되었습니다.\n"
 IMP.6.a: "캐나다 의회의 요구를 수용하자."
 IMP.6.b: "캐나다 의회의 요구를 거부하자."
 #\n\n...\n\n책상 위, 캐나다 의회가 공식적으로 보낸 성명서가 놓여 있다. 나는 그 문서를 몇 분째 뚫어져라 바라보고 있다. 문서 속의 단어들은 마치 무게를 지닌 듯, 내게로 다가와 깊은 생각에 잠기게 한다. 방 안은 조용하고, 창밖으로는 캐나다의 차가운 바람이 부딪히며 유리창을 울린다. 한때는 세계를 지배했던 제국의 왕이었던 내가, 이제 이 낯선 땅에서 위태로운 왕좌를 지키고 있다니, 아이러니하다.\n\n그 성명서에는 분명하게 적혀 있었다. 캐나다 의회는 나에게 새로운 총리를 임명할 것을 강력히 요구하고 있었다. 더 이상은 지연될 수 없다는 그들의 단호한 어조가 문서의 구석구석에 배어 있었다. 내 앞에 놓인 이 서류 한 장이, 대영제국의 운명을 결정할지도 모른다는 생각에 마음이 무겁다.\n\n나는 자리에서 일어나 책상 옆에 있는 창문으로 다가갔다. 바깥은 어둠이 짙게 깔려 있었고, 먼 곳에서 희미하게 도시의 불빛이 반짝이고 있었다. 내 머릿속은 수많은 생각으로 가득 차 있었다. 의회의 요구는 분명 타당하다. 제국의 안정을 위해, 나는 새로운 총리를 임명해야 할 것이다. 매켄지 킹이 그 자리를 맡는다면, 그는 자치령 간의 결속을 강화하고, 대영제국의 균형을 유지할 수 있을 것이다.\n\n하지만, 다른 선택지도 있다. 나는 여전히 이 제국의 군주다. 전제 군주로서의 권위를 행사하고, 내가 직접 제국을 이끌어 갈 수도 있다. 이 위기의 시기에, 강력한 리더십이 필요하다는 것을 잘 알고 있다. 나의 결단과 의지로 제국을 다시 세울 수 있을지도 모른다. 하지만, 그것은 자칫하면 자치령과의 갈등을 초래할 위험이 있다. 지금의 제국은 예전과는 다르다. 영국 본토가 무너진 지금, 자치령들은 각자의 목소리를 내고 있다. 나의 이 결정이 그들의 마음을 상하게 한다면, 제국은 돌이킬 수 없는 분열의 길로 들어설지도 모른다.\n\n나는 다시 책상으로 돌아와 의회가 보낸 성명서를 손에 들었다. 종이의 감촉이 손끝으로 전해져 온다. 이 종이 한 장이 나의 운명을 결정지을 것이다. 의회의 요구를 받아들여 총리를 임명할 것인가, 아니면 전제 군주로서의 길을 선택할 것인가. 두 가지 선택이 내 앞에 놓여 있다.\n\n이제 결정을 내려야 할 때가 왔다. 시간이 흐를수록 선택의 무게가 더해진다. 나는 숨을 깊이 들이마시고, 결단을 내리기 위해 마음을 가다듬는다. 제국의 운명이 내 손에 달려 있다는 사실이 다시금 나를 압박해 온다. 하지만 나는 왕이다. 이 순간, 나는 반드시 올바른 선택을 해야만 한다.\n\n결국, 나는 펜을 들고 서명란에 서명을 했다."
 IMP.7.t: "자유당과 보수당"
 IMP.7.desc: "영국 의회는 \"위대한 망명\"을 거치며 캐나다 정치 무대에 정착했습니다. 영국 보수당의 원로들이 캐나다 보수당에 입당하면서, 1935년의 총선에서 참패를 겪은 보수당은 자유당에 큰 위협이 되고 있습니다.\n\n그럼에도 불구하고, 이들은 아직 즉각적인 정치 활동에 나서지 못할 것입니다. 배넷 총리의 정책 실패를 인정하고, 자신의 정당을 재정비하는 과정이 필요하기 때문입니다. 당 내부의 개혁을 추진하면서 보수당은 스스로를 변화시키려는 노력을 기울일 것입니다. 이러한 변화와 재정비의 과정은 시간이 걸리겠지만, 이들은 장기적인 계획을 가지고 움직일 가능성이 큽니다.\n\n그러나 만약 이들에게 기회가 주어진다면, 보수당은 우리 정부의 실정을 비판하고 책임을 물으며 정권을 뒤흔들 수 있을 것입니다. 그들이 정치적으로 완전히 준비되었을 때, 캐나다 정치의 판도는 급격히 변화할 수 있습니다. 이러한 상황을 대비하기 위해 우리 정부는 대내외적으로 선택과 집중을 해야 하며, 더 큰 전략적 목표를 염두에 두고 철저히 대응할 필요가 있습니다. 우리 정부는 현재의 위기를 관리하고, 미래의 도전을 준비하는 데 있어 신중한 정책 결정을 내려야 할 것입니다."
 IMP.7.a: "꽤나 골치 아프군"
 IMP.8.t: "의회 교통 정리"
 IMP.8.desc: "기존의 영국 보수당 원로들이 캐나다의 보수당에 입당하면서 의회에는 혼란이 가중 되고 있습니다. 영국 정치인들의 입당을 거부하는 여러 의원들은 이에 반대하는 목소리를 높히고 있고, 캐나다 보수당 의원들은 이는 헌법에서 보장하는 권리라며 반대측의 주장을 일축하고 있습니다. 이러한 상황에서 총리인 매킨지 킹의 중요성이 더더욱 부각되기 시작하였습니다."
 IMP.8.a: "\"연설은 자신이 없는데..\""
 IMP.9.t: "영국병 치료"
 IMP.9.desc: "캐나다를 오랫동안 병들게 했던 '영국병'은 이제 과거의 그림자일 뿐입니다. 헌신적인 의료진들의 노력으로 대부분의 환자들이 치료를 받았으며, 아직 손길이 닿지 않은 이들도 곧 회복의 길로 들어설 것입니다. 치유는 시작되었고, 우리는 다시 건강한 미래를 향해 나아가고 있습니다."
 IMP.9.a: "좋은 소식이야!"


