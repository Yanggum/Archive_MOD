 ENG_Canada_Government_support: "§Y자유당의 분노§!는 \n현재 [CAN_parliament_anger_level]입니다."
 ENG_Canada_Government_support_idea_tt: "£GFX_decision_tooltip_can\n\n\n\n\n\n\n§Y자유당의 분노§!는 현재 자유당의 정부에 대한 분노를 나타냅니다.\n\n분노가 높다면 §Y매일 정치력 비용§!, §Y소비재 공장 변동치§!에 불이익을 얻습니다."
