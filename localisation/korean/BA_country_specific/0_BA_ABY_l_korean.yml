 ABY_descision_focus_event.94.t:0 "황금 족쇄의 열쇠"
 ABY_descision_focus_event.94.d:0 "프라하의 밤은 스오우가 일으킨 '청소'의 피비린내로 진동하고 있었다. 그녀는 자신의 권력을 나눠 가질 생각이 없는 나치 잔당과 네프티스 강경파 이사들을 "부패 척결"이라는 명분으로 무자비하게 제거하고 있었다. 하지만 스오우도 간과한 것이 있었다. 돈의 생리는 바퀴벌레보다 끈질기다는 것을.\n\n가택 연금 상태에 있던 노노미에게 암호화된 통신이 들어왔다. 발신자는 네프티스 그룹의 유럽 지부 '온건파' 이사들이었다. 물론 그들이 '온건'하다는 것은 어디까지나 강경파에 비해 덜 폭력적일 뿐, 노노미를 가문의 꼭두각시로 보는 시선은 매한가지였다.\n\n"아가씨, 스오우라는 그 미친 여자가 우리 그룹의 자산을 국유화하려 합니다. 강경파 늙은이들은 이미 제거당했습니다. 다음 차례는 우리, 그리고 아가씨입니다."\n\n노노미는 떨리는 손으로 수화기를 잡았다. 스오우는 대책위원회 친구들을 인질로 잡고 있다. 이 상황을 뒤집을 수 있는 건, 아이러니하게도 자신이 그토록 벗어나고 싶었던 네프티스의 자금력과 사병(PMC)들뿐이었다.\n\n"조건이... 뭐죠?"\n\n"간단합니다. 저희가 스오우의 뒤통수를 칠 때, 아가씨가 네프티스의 이름으로 정당성을 부여해 주십시오. 그룹의 재건을 위해서 말입니다."\n\n노노미는 눈을 감았다. 이것은 악마를 몰아내기 위해 또 다른 악마와 손을 잡는 격이었다. 하지만 친구들을 구할 수만 있다면, 자신의 영혼 따위는 아무래도 좋았다."
 ABY_descision_focus_event.94.a:0 ""좋아요... 그 제안, 받아들일게요. 대신 친구들의 안전은 확실히 보장해 주세요.""
 ABY_descision_focus_event.94.b:0 ""좋아요... 그 제안, 받아들일게요. 대신 친구들의 안전은 확실히 보장해 주세요.""

 ABY_descision_focus_event.95.t:0 "강철의 아가리"
 ABY_descision_focus_event.95.d:0 "새벽 3시, 프라하 시내에서 총성이 울려 퍼졌다. 온건파 이사들이 고용한 PMC 용병들이 주요 관공서를 급습했다. 그들의 계획은 전광석화처럼 스오우를 체포하는 것이었다. 그러나 그들이 들이닥친 집무실은 텅 비어 있었다.\n\n"정보가 샜나?"\n\n당황한 용병 대장의 무전기 너머로, 차가운 스오우의 목소리가 들려왔다.\n\n"기업가들은 이래서 안 돼. 이익을 계산하느라 방아쇠를 당길 타이밍을 놓치거든."\n\n함정이었다. 스오우는 이미 온건파의 움직임을 감지하고 역으로 그들을 포위망 안에 가두었다. 매복해 있던 기갑부대가 용병들을 짓밟았고, 스오우의 친위대는 네프티스 임시 본부를 타격했다.\n\n날이 밝자, 스오우는 피 묻은 군복 차림으로 방송 카메라 앞에 섰다.\n\n"존경하는 국민 여러분, 오늘 우리는 민주주의를 위협하는 추악한 자본가들의 반란을 목격했습니다. 네프티스 그룹은 국가 전복을 시도했습니다. 이에 본인은 비상 대권을 발동, 네프티스 그룹의 모든 자산을 몰수하고 그들을 국가의 적으로 규정합니다."\n\n역쿠데타의 실패는 스오우에게 날개를 달아주었다. 그녀는 '내부의 적'을 물리친다는 완벽한 명분을 얻었고, 누구의 눈치도 보지 않고 피의 대숙청을 시작했다. 거리에는 네프티스 관계자들과 반대파들이 줄줄이 끌려나갔고, 공포가 도시를 지배했다."
 ABY_descision_focus_event.95.a:0 "탐욕스러운 포식이 시작되었다."

 ABY_descision_focus_event.96.t:0 "사막의 침묵"
 ABY_descision_focus_event.96.d:0 "네프티스의 자산과 군수공장을 손에 넣은 스오우에게 더 이상 거칠 것은 없었다. 그녀는 이제 가장 껄끄러운 '마지막 변수'를 처리하기로 결심했다.\n\n지하 감옥의 가장 깊은 곳. 스오우는 차가운 눈으로 감방을 내려다보았다. 그곳에는 그녀의 옛 동료들이 있었다. 호시노, 시로코, 아야네, 노노미... 그들은 끝까지 저항의 눈빛을 잃지 않았다.\n\n"유감이네. 너희를 살려두고 싶었지만, 너희는 너무 위험해. 살려두면 언젠가 반드시 내 목을 노리겠지."\n\n"스오우! 네가 그러고도 무사할 것 같아?" 호시노가 소리쳤지만, 스오우는 듣지 않았다.\n\n"국가를 위한 거름이 되어라."\n\n그녀의 손짓과 함께 총성이 울렸다. 한 번, 두 번, 그리고 침묵. 아비도스를 지탱하던 기둥들이 허무하게 무너져 내렸다. 스오우는 감정 없는 얼굴로 돌아섰다. 하지만 집무실로 돌아온 그녀는 보고서를 보며 미간을 찌푸렸다.\n\n"쿠로미 세리카... 아직도 행방이 묘연한가?"\n\n체포 당시 현장에 없었던 세리카의 행방이 묘연했다. 시신도, 목격자도 없었다. 완벽한 승리 위로 불안한 그림자가 드리워졌다. 살아남은 단 한 명."
 ABY_descision_focus_event.96.a:0 "그 작은 불씨가 스오우의 신경을 긁었다."

 ABY_descision_focus_event.97.t:0 "부러진 송곳니"
 ABY_descision_focus_event.97.d:0 "산간 오지에서부터 흉흉한 소문이 돌기 시작했다. '세크메트단'이라 불리는 저항군이 정부군 보급로를 습격하고 있다는 것이었다. 그들의 중심에는 복수의 고양이, 쿠로미 세리카가 있었다.\n\n세리카는 지옥에서 살아 돌아왔다. 그녀는 옛 적이었던 백귀야행의 백화요란과 산해경의 현무상회 잔당을 규합했다.\n\n"선배들의 복수... 내가 반드시 해내겠어!"\n\n세리카의 분노는 맹렬했다. 세크메트단은 기습적인 게릴라전으로 스오우의 군대를 괴롭혔고, 한때 지방의 소도시를 해방하기도 했다. 하지만 정규군의 압도적인 화력 앞에서는 역부족이었다. 스오우는 더 이상 자비를 베풀지 않았다.\n\n"쥐새끼들을 잡는 데는 불이 최고지."\n\n스오우는 세크메트단의 최후 근거지로 파악된 계곡에 대규모 폭격을 명령했다. 수백 발의 포탄과 소이탄이 쏟아졌고, 계곡은 지옥불에 휩싸였다. 며칠 후, 수색대는 잿더미 속에서 세리카의 것으로 추정되는, 불에 탄 붉은 머리핀과 훼손된 시신 일부를 발견했다.\n\n보고를 받은 스오우는 그제야 샴페인을 땄다.\n\n"이것으로 모든 변수는 사라졌다."\n\n세리카의 죽음은 저항의 끝을 의미했다."
 ABY_descision_focus_event.97.a:0 "...아마도."

 ABY_descision_focus_event.98.t:0 "계몽의 시대"
 ABY_descision_focus_event.98.d:0 "모든 정적과 위협이 사라진 아비도스...아니, 남키보토스 계몽군정부. 스오우는 스스로를 대통령이나 총리가 아닌, 더 초월적인 존재로 규정했다. 그녀는 중앙 광장의 단상에 올라 수십만 군중을 내려다보았다.\n\n"우리는 혼란과 분열의 시대를 끝냈습니다! 나약한 민주주의와 부패한 자본주의, 그리고 외세의 간섭이 우리를 병들게 했습니다. 이제 우리는 다시 태어나야 합니다!"\n\n그녀는 '계몽혁명'을 선포했다. 그것은 국가가 개인의 모든 것을 통제하고 지도하는 전체주의 체제였다. 의회는 해산되었고, 그 자리는 스오우를 맹종하는 '진리의 키보토스-계몽을 위하여'가 대신했다.\n\n"나는 전 키보토스와 이 땅을 이끄는 영도자가 되어, 여러분을 위대한 번영의 길로 인도할 것입니다. 나를 따르십시오. 오직 나만이 정답입니다."\n\n광장을 가득 메운 군중은, 공포에 질려 혹은 세뇌되어 그녀의 이름을 연호했다.\n\n"스오우! 스오우! 영도자 만세!"\n\n그날부로 자유 아비도스는 사망했다."
 ABY_descision_focus_event.98.a:0 "오직 '스오우의 제국'만이 남았을 뿐이었다."

 ABY_descision_focus_event.99.t:0 "녹슨 왕관"
 ABY_descision_focus_event.99.d:0 "프라하 관저의 발코니. 노노미는 거리로 쏟아져 나와 환호하는 시민들을 내려다보았다. 스오우는 체포되었고, 그녀의 친위대는 무장 해제되었다. 표면적으로는 민주주의의 승리였고, 정의의 실현이었다.\n\n하지만 노노미의 표정은 어두웠다. 그녀의 뒤에는 네프티스 그룹의 온건파 이사들이 서 있었다. 그들은 승리의 기쁨보다는, 되찾은 자산 장부를 검토하느라 여념이 없었다.\n\n"축하드립니다, 아가씨. 아니, 이제 영웅이라고 불러드려야겠군요."\n\n한 이사가 계산기를 두드리며 말했다.\n\n"스오우가 국유화했던 공장들, 다시 우리 명의로 돌리는 절차는 이미 시작했습니다. 그리고... 이번 '지원'에 들어간 비용 청구서도 곧 정리될 겁니다."\n\n노노미는 씁쓸한 미소를 지었다. 스오우라는 폭군은 사라졌지만, 그 자리를 차지한 것은 탐욕스러운 장사치들이었다. 그들은 피를 흘리지 않고, 노노미라는 얼굴마담을 내세워 국가를 통째로 삼켜버렸다.\n\n"친구들은... 무사한 거죠?"\n\n"물론입니다. 병원에서 최상의 치료를 받고 있습니다. 당분간은 '요양'이 필요하겠지만요."\n\n그 말은 당분간 그들을 인질로 잡고 있겠다는 은유였다. 노노미는 주먹을 꽉 쥐었다. 폭력의 시대는 끝났지만, 자본의 시대가 도래했다. 그리고 그것은 스오우의 독재만큼이나 숨 막히는 일이었다."
 ABY_descision_focus_event.99.a:0 "독재를 몰아낸 독재."

 ABY_descision_focus_event.100.t:0 "마리오네트 대통령"
 ABY_descision_focus_event.100.d:0 "스오우 정권 붕괴 후, 과도 정부는 빠르게 안정을 되찾아갔다. 그 중심에는 네프티스 그룹의 막대한 자금력이 있었다. 그리고 다가온 총선. 이사회는 노노미를 호출했다.\n\n"회장직은 전문 경영인에게 넘기시죠. 아가씨, 아니 후보님께서는 더 큰 무대로 나가셔야 합니다."\n\n그들은 노노미에게 대통령 출마를 요구했다. 거절할 권리는 없었다. 그들이 내민 공약집은 끔찍했다. 노동법 대폭 완화, 법인세 폐지, 기업 규제 철폐... 사실상 국가를 기업의 사유물로 만드는 내용이었다.\n\n"이건... 너무해요. 시민들의 삶이 무너질 거예요." 노노미가 반발했지만, 이사들은 차갑게 웃었다.\n\n"우리가 노동조합을 불법화하라고 했습니까, 아니면 최저임금을 없애라고 했습니까? 이 정도는 '자유 시장 경제'를 위해 필요한 조치입니다. 그리고 잊지 마십시오. 아가씨가 거절하면, 우리는 다른 대안을 찾을 수 있습니다. 그때 아가씨와 친구들이 어떻게 될지는 장담 못 합니다."\n\n결국 노노미는 고개를 숙였다. 아예 최악을 막기 위해 차악을 선택할 수밖에 없었다.\n선거 기간 내내 네프티스의 돈이 뿌려졌다. 언론은 노노미를 '구국의 성녀'로 포장했고, 상대 후보들은 돈의 힘 앞에 무력하게 무너졌다.\n\n개표 방송의 화면이 노노미의 당선 확정을 알렸다. 화려한 꽃가루가 날리고 사람들은 환호했지만, 단상에 선 노노미의 눈은 텅 비어 있었다. 그녀는 대통령이 되었지만, 동시에 가장 화려한 감옥에 갇힌 죄수였다."
 ABY_descision_focus_event.100.a:0 "아비도스 연방은 이제 '네프티스 공화국'이었다."
 
 ABY_serv_focus_event.1.t:0 "조사 보고서-게헨나"
 ABY_serv_focus_event.1.d:0 "개요: 게헨나 중앙구 근방 대형 민간 시설에서 트리니티 생체실험과 유사한 흔적이 발견됨. 판데모니움 소사이어티 혹은 선도부의 개입 정황은 보이지 않아 민간 동아리의 행위로 사료되며, 성공한 샘플은 없으나 상당한 자료를 획득함.\n\n1. 전체적으로 고성당 지하 의료시설과 유사한 모습을 보이나, 위생 등 기본적인 연구 환경이 갖추어져 있지 않음.\n\n2. 몸무게와 BMI별 치사량이 상세히 기록되어 있음. 일정 수준 이상이 될 시 즉시 사망하며, 자세한 수치는 따로 첨부.\n\n3. 연구자 개인 노트 등에서 판데모니움 소사이어티, 선도부 등의 지시를 받은 정황은 보이지 않으며 선도부는 오히려 이들을 추적한 것으로 보임.\n\n4. 치사량 이전까지의 신비 투입 시 신체능력이 지속적으로 증가하며, 임계점에서 키보토스인과 유사한 신체능력을 가지나, 몇 초 내로 근육 조직이 완전히 붕괴되어 사망하게 됨.\n\n5. 수치를 역산하여 동물 실험을 진행하였으나 노획된 연구 자료만큼의 성과를 보이지 않음. 인간 외에는 유의미한 효과가 없을 것으로 사료됨.\n\n종합: 신비 주입 시 안정제 등의 보조제가 필요한 것으로 보임. 동물실험은 유의미한 성과를 보일 수 없어 부득이하게 현 연구 자료를 기반으로 인체 실험을 진행할 것을 제안함.\n\n중앙구 파견 제 26 연구팀."
 ABY_serv_focus_event.1.a:0 "허ㄱ(지워짐)\n불허."
 
 ABY_serv_focus_event.2.t:0 "조사 보고서-밀레니엄"
 ABY_serv_focus_event.2.d:0 "개요: 밀레니엄 세미나 소속 연구시설 지하에서 대규모 신비 주입 연구 흔적이 발견됨. 대부분 자료가 온전한 상태로 보존됨.\n\n1. 연구 자료 규모상 최소 수만명이 투입되었을 것으로 사료됨. 따라서 게헨나 지역에서 발견된 것보다 세세한 수치의 자료 발견. 첨부.\n\n2. 세미나 연구 시설에 위치해 있으나, 연구 노트와 개인 노트 등에서 세미나의 결재나 그들에 관한 언급이 없어 세미나가 관련되었는지는 확인 불가.\n\n3. 약 1주일간 혈액 투석과 강한 독성 약품 섭취 및 주입으로 신비 주입 시 발생하는 자기파괴성 면역 억제 성공.\n\n4. 같은 방식으로 신체 붕괴를 늦추는 데 성공하였으나, 수명이 5년 내외로 제한될 것이라는 연구 결과가 나옴. \n비고: 극비사안으로 분류되어 있음.\n\n5. 실험체들은 처분된 것으로 추청되며, 다음 연구로 수명 감축을 막기 위한 연구가 계획된 흔적 확인 가능. 연구 계획: 키보토스인 신비 추가적 주입, ... , 태아 신비 주입, ... 후략. 첨부자료 확인 바람.\n비고: 극비사안으로 분류되어 있음.\n\n종합: 자료에 기반한 추가 계산 결과, 아무리 붕괴를 늦춰도 10년 이상으로 늦추긴 불가능한 것으로 확인됨.\n\n추가 보고서: 인체 실험 엄금에 따른 기계화 슈트 실험이 해당 연구 자료 확보에 따라 진척을 보이고 있음. 다만 실전 연구를 위해서는 군부와의 협력이 필요하며, 해당 자료의 공개가 불가피해 보여 허가가 필요.\n\n밀레니엄 파견 제 3연구팀."
 ABY_serv_focus_event.2.a:0 "보류."
 
 ABY_serv_focus_event.3.t:0 "장관 회의 보고서 395호 86장 요약본"
 ABY_serv_focus_event.3.d:0 "밀레니엄 조사 보고서 자료 공개 여부 논쟁 발발.\n\n자료의 일부를 민간에 공개하는 것에 합의.\n\n세부 자료는 군에 공개하되 장성급 이하로는 유출되지 않도록 규정.\n\n중략.\n396호 3장 요약본\n\n"저거너트" 계획의 세부 보고서 확인.\n과도한 필요 예산으로 인한 의견 대립.\n\n기록 삭제.\n\n최종 결론 도출."
 ABY_serv_focus_event.3.a:0 "저거너트 계획 승인됨."
 ABY_serv_focus_event.3.b:0 "저거너트 계획 거부됨."
 
 ABY_serv_focus_event.4.t:0 "조사 보고서-트리니티"
 ABY_serv_focus_event.4.d:0 "개요: 트리니티 고성당 지하에서 발견된 수백 구의 시신과 의료기기에 관한 조사 보고서\n비고: 고성당 진입 전 여러 기록이 불타고 파쇄되어 확인 가능한 자료가 부족.\n\n1. 시신 주변에서 신비 혈청, 신비 직조기 등이 다량 발견됨.\n\n2. 사인은 공통적으로 총체적 장기부전, 혹은 심정지 등 체성근육 과부하 및 자기파괴성 면역 활성화로 인한 것으로 추청.\n\n3. 모든 시신에서 신비 수치가 정상 범주를 넘어선 수치로 관찰됨.\n\n4. 내용은 확인할 수 없으나 티파티의 명령서 등이 발견, 트리니티 정부 주도로 이루어진 것으로 추정됨.\n\n5. 사망 시기는 전체적으로 트리니티 정부의 "노숙자 및 사회부적응자 지원" 시기와 비슷함.\n\n종합: 아비도스 중앙 신비 연구소에서 진행한 동물 신비 주입 실험의 인간 생체실험으로 사료됨. 다만 자료 대다수가 파기되어 인간에게 적절한 조치 없이 신비 주입 시 동물들과 같은 반응을 보이며 사망한다는 것 외에는 유의미한 결과 도출 불가 보다 광범위한 연구자료 지원이 필요.\n\n고성당 파견 제 37신비 연구팀."
 ABY_serv_focus_event.4.a:0 "허가."

