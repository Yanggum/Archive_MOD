ABY_focus_establish_sekhmet: "셰크메트단 결성"
ABY_focus_establish_sekhmet_desc: "파시스트 놈들은 양심이란 걸 모르나 봅니다. 동료들을 모두 납치해 놓고, 살리고 싶으면 이쪽으로 오라니요? 아뇨, 그럴 일은 없을 겁니다.\n유일하게 저들의 손아귀를 피할 수 있었던 쿠로미 세리카는 반드시 대책위원회를 구출하겠다는 일념으로, 복수의 신의 이름을 딴 세크메트단을 창설했습니다."
ABY_focus_contact_with_hyakkaryoran: "백화요란과 접촉"
ABY_focus_contact_with_hyakkaryoran_desc: "백귀야행 연합학원의 백화요란 소속인 키류 키쿄는, 같은 동아리의 카데노코지 유카리의 복수를 돕기 위해 이해관계가 일치하는 사람들을 모아 레지스탕스를 결성했습니다. 키쿄가 합류한다면, 세리카에게 부족한 전략적 안목을 보완할 기회가 될 것입니다."
ABY_focus_deal_with_genbushokai: "현무상회와의 거래"
ABY_focus_deal_with_genbushokai_desc: "산해경의 현무상회는 변화에 적응하며 근근히 살아가고 있지만, 파시스트의 압제 아래에서는 오래 버티지 못할 것입니다. 우리의 대의에 함께하는 것이 현무상회 또한 살 수 있는 길이란 것을 강조하면, 저들도 결국 우리 편이 될 것입니다."
ABY_focus_succeed_legitimacy: "대책위원회 정통성 계승 선언"
ABY_focus_succeed_legitimacy_desc: "체코와 오스트리아의 통합에 가장 큰 역할을 한 것은 대책위원회입니다. 대책위원회의 유일한 생존자 쿠로미 세리카는 자신이 대책위원회로서 정통성을 가짐을 선포하였습니다."
ABY_focus_expand_guerilla: "게릴라 확산"
ABY_focus_expand_guerilla_desc: "파시스트 놈들은 반드시 고통받게 될 것입니다! "
ABY_focus_persuade_czech: "체코인 설득"
ABY_focus_persuade_czech_desc: "오스트리아의 주도에 불만을 느끼는 체코인이 많습니다. 우리는 그들에게 훗날의 정치적 이득을 대가로 하여 봉기에 합류시킬 수도 있을 것입니다."
ABY_focus_overthrow_austrian_fascism_government: "오스트리아 파시즘 정부 전복"
ABY_focus_overthrow_austrian_fascism_government_desc: "키보토스인이 흘린 피에 응답할 때가 왔습니다. 이제 우리는 오스트리아의 파시즘 정부에 대한 봉기를 일으켜, 그들을 완전히 축출할 것입니다!"
ABY_focus_vengeance_for_abydos: "아비도스의 복수"
ABY_focus_vengeance_for_abydos_desc: "조국전선은 아비도스의 행복을 송두리째 앗아가 버렸습니다. 마땅히 이에 대해 갚아줘야 하지만, 세리카는 예전에 타카나시 호시노가 했던 말이 마음에 걸렸습니다. 고민 끝에 마음을 정한 세리카는 그녀만의 복수를 시작했습니다."
ABY_focus_threats_outside: "외부의 위협"
ABY_focus_threats_outside_desc: "불행히도, 조국전선의 핵심 인력들은 무방비한 국경을 통해 외부로 도망쳐 버렸습니다. 세리카는 잔당을 완전히 소탕해야 희생자가 더 생기지 않는다는 입장입니다. 하지만 작전참모 키쿄는 먼저 키보토스의 파시즘 국가부터 처리해야 한다고 조언했습니다.\n확실한 건, 어느 쪽이든 우리는 전쟁에 대비해야 한다는 것입니다."

ABY_focus_exterminate_kivotos_fascism: "키보토스 파시즘 근절"
ABY_focus_exterminate_kivotos_fascism_desc: "우리와 같은 키보토스인들이 파시즘이라는 독주에 노출된 것은 간과할 수 없는 일입니다. 북쪽의 키보토스인들은 독주에 취해버렸으니, 우리는 마땅히 그들을 일깨워야 합니다."
ABY_focus_accept_prefect_team: "선도부 망명 수용"
ABY_focus_accept_prefect_team_desc: "선도부는 키보토스인 우선이라는 올바른 이상을 가지고 있었습니다. 우리와 같은 목표를 가지고 있는 그들을 마땅히 받아주어야 합니다."
ABY_focus_plan_antigerman_riot: "반독시위 선동"
ABY_focus_plan_antigerman_riot_desc: "게헨나 지역의 사람들 중에는 키보토스인들보다 독일인을 우선한 마코토의 결정에 불만을 가지고 있는 자들이 있습니다. 작은 빌미만 주어진다면, 그들을 선동하는 것 또한 어려운 일은 아닐 것입니다."
ABY_focus_prepare_for_halo_war: "헤일로 전쟁 준비"
ABY_focus_prepare_for_halo_war_desc: "우리는 백귀야행과 산해경을 상대로 승리한 적 있었지만, 이는 국력의 우위보다는 전략의 승리였습니다. 그러나 지금의 상대는 게헨나와 트리니티를 모두 점령한 강한 군사력의 나라입니다. 전략만으로는 그들을 상대하는 데 한계가 있으므로, 우리는 마땅히 헤일로 보병들 간의 전면전 또한 대비해야 합니다."
ABY_focus_attack_german_fascists: "독일 파시스트 공격"
ABY_focus_attack_german_fascists_desc: "독일 영토 근처의 섬에, 독일의 전쟁해군이 주둔하고 있다는 첩보가 들어왔습니다. 이들은 지금이 아니더라도 언젠가는 우리에게 위협이 될 존재입니다. 빠르게 싹을 잘라버려야 합니다."
ABY_focus_operation_austerlitz: "아우슈터리츠 작전"
ABY_focus_operation_austerlitz_desc: "결전의 때가 왔습니다. 이 전쟁을 통해 키보토스의 파시즘은 완전히 사라질 것입니다!"
ABY_focus_eliminate_terran_fascism: "인류 파시즘 척결"
ABY_focus_eliminate_terran_fascism_desc: "복수의 방향은 이미 정해졌습니다. 파시즘을 신봉하는 지구인들을 단죄해야 합니다."
ABY_focus_ally_with_kivotos_states: "키보토스 국가와 손잡기"
ABY_focus_ally_with_kivotos_states_desc: "우리가 지구인들과 전쟁하는 동안에는 후방이 안정되어 있을 필요가 있습니다. 우리는 남아 있는 모든 트리니티 국가들에게 사절을 보내어, 협력을 제안할 것입니다."
ABY_focus_judge_josef_tiso: "요제프 티소 단죄"
ABY_focus_judge_josef_tiso_desc: "요제프 티소는 기회주의적인 교권 파시스트입니다. 파시스트가 언제든 우리를 칠 수 있다는 건, 우리 발밑에 재앙의 싹이 움트고 있다는 것이나 다름없습니다."
ABY_focus_end_of_bizzare_regency: "기이한 섭정의 끝"
ABY_focus_end_of_bizzare_regency_desc: "우리가 차지하고 있는 부르겐란트 지역은 본디 헝가리의 영토였다고 합니다. 헝가리가 실지회복주의를 외친다면 우리와 충돌하는 것도 시간문제입니다. 우리가 먼저 손을 써야 합니다."
ABY_focus_pressure_toward_yugoslavia: "유고슬라비아 압박"
ABY_focus_pressure_toward_yugoslavia_desc: "우리의 최종 목표인 이탈리아를 효율적으로 공격하기 위해서, 유고슬라비아에게 일부 영토의 할양을 요구할 것입니다. 이를 거부하는 것은 파시스트를 돕는 것이라는 최후통첩과 함께 말이죠."
ABY_focus_operation_odoacer: "오도아케르 작전"
ABY_focus_operation_odoacer_desc: "조국전선의 잔당 대부분은 남쪽의 이탈리아로 도주한 것으로 확인되었습니다. 파시즘의 발원지인 이탈리아를 정복하여, 유럽의 파시즘을 소멸시켜야 합니다!"
ABY_focus_stalking_vf_remnants: "조국전선 잔당 추적"
ABY_focus_stalking_vf_remnants_desc: "조국전선은 와해된 이후 여러 곳으로 흩어졌지만, 가까운 곳에서 복수의 기회를 노리고 있다는 첩보가 계속해서 들어오고 있습니다. 이들을 추적해서 전부 잡아야 합니다."
ABY_focus_demand_vf_to_swiss: "스위스에 잔당 인도 요구"
ABY_focus_demand_vf_to_swiss_desc: "조국전선의 지도자인 에른스트 뤼디거 슈타르헴베르크가 스위스로 망명했다는 정보가 최근 입수되었습니다. 스위스를 공격하는 것은 우리에게도 출혈을 강요하는 일인 만큼, 우리는 스위스에게 그들의 중립성을 지키기 위해 슈타르헴베르크의 인도를 요청할 것입니다."
ABY_focus_though_war_is_over: "전쟁은 끝났지만"
ABY_focus_though_war_is_over_desc: "쿠로미 세리카는 지금까지 복수만을 바라보고 달려왔습니다. 원하던 복수를 이뤘지만, 그녀의 마음은 아직도 답답하기만 합니다.\n\n과연 그녀가 또다른 삶의 의미를 찾을 수 있을까요?"

ABY_focus_bloodthirst_of_lion: "사자의 갈증"
ABY_focus_bloodthirst_of_lion_desc: ""아직이야, 아직 복수는 끝나지 않았어...!"\n\n파시즘을 근절하는 것이 최선의 복수라 생각했습니다. 그러나 반발하기 시작하는 현지인들을 보면서, 세리카의 생각은 바뀌기 시작했습니다. 현지인들이 없었다면 대책위원회도 죽지 않았을 텐데..."
ABY_focus_ungrateful_purge: "배은망덕한 숙청"
ABY_focus_ungrateful_purge_desc: "세리카의 격변을 알아챈 키쿄는 어떻게든 세리카를 설득해서 더 이상의 전쟁을 멈추고자 합니다. 비록 우리가 그녀의 도움을 많이 받았지만, 우리의 새로운 이상을 방해하려 한다면 가차없이 없애버려야 합니다.\n\n주춧돌은 이제 뽑아내야 할 걸림돌이 되었습니다."
ABY_focus_general_mobilization_order: "전쟁 동원령"
ABY_focus_general_mobilization_order_desc: "세리카의 새로운 꿈을 이루기 위해, 국가는 끝없는 전쟁이라도 대비할 수 있도록 최대한 동원될 것입니다."
ABY_focus_reversed_halo: "반전된 헤일로"
ABY_focus_reversed_halo_desc: ""어...? 내 헤일로가 원래 이랬었나...?"\n\n세리카가 이변을 알아챘을 때는 이미 늦었습니다."
ABY_focus_until_all_terrans_die: "모든 지구인들이 죽을 때까지"
ABY_focus_until_all_terrans_die_desc: "전쟁과 복수의 신비가 깃든 세리카는 지구인들을 향한 피의 복수를 시작했습니다."
ABY_focus_bloody_ecstacy: "핏빛 희열"
ABY_focus_bloody_ecstacy_desc: "인간들이 흘리는 피를 보며, 그녀는 크게 웃고 또 웃었다. 그녀는 계속 광소하며 적들을 차례차례 죽여 나갔다. 그녀를 보며, 적도 아군도 공포에 떨었다..."
ABY_focus_girl_dyed_with_blood: "피에 물든 소녀"
ABY_focus_girl_dyed_with_blood_desc: "전황은 불리해지고 있고, 국민들의 사기는 땅에 떨어졌습니다. 오직 셰크메트의 웃음소리만이 총성과 함께 울려퍼지고 있습니다.\n\n그러나 머지않아, 셰크메트는 복수의 허무함을 느낄 틈도 없이, 그녀에게 돌아온 잔을 마시게 될 것입니다."

ABY_focus_end_of_vengeance: "복수의 끝"
ABY_focus_end_of_vengeance_desc: "세리카는 자신이 전쟁을 일으킨 이유를 기억해냈습니다. 조국전선을 뿌리뽑으려 한 것은 결국 무고한 키보토스인들의 안전을 위한 것이었습니다. 목적을 달성했으니, 이제 키보토스인들을 위한 나라를 만들 차례입니다."
ABY_focus_ideal_of_integration: "통합의 이상"
ABY_focus_ideal_of_integration_desc: "전쟁을 치르며, 국민들은 점점 통합되어 가고 있었습니다. 이제 국민들은 남키보토스 통합의 이상을 꿈꿉니다."
ABY_focus_southern_kivotos_industries: "남키보토스 산업 발전"
ABY_focus_southern_kivotos_industries_desc: "평화를 되찾았으니, 이제 경제 발전에 투자할 수 있습니다. 세 학원을 아우르는 거대한 산업단지가 건설되기 시작했습니다."
ABY_focus_effort_for_peace: "평화를 위한 노력"
ABY_focus_effort_for_peace_desc: "우리는 더 이상 전쟁을 주도하지 않을 것입니다. 군대에 들어가는 비용의 일부는 이제 더 나은 삶의 수준을 위해 투자될 것입니다."
ABY_focus_restore_sightseeing: "관광 복원"
ABY_focus_restore_sightseeing_desc: "백귀야행과 산해경은 관광 산업에 크게 의존하고 있습니다. 그동안 대전이와 전쟁으로 빛을 보지 못한 관광 산업을 재건하면, 우리의 경제에도 도움이 될 것입니다."
ABY_focus_expand_fortress: "요새 확장"
ABY_focus_expand_fortress_desc: "평화를 원한다면 전쟁을 대비하라는 격언이 있습니다. 비록 외부의 상황이 지금은 안정되어 있으나, 언젠가 우리의 평화가 위협받을 때를 대비해 두는 것도 필요한 작업입니다."
ABY_focus_negotiation_again: "재협상"
ABY_focus_negotiation_again_desc: "세리카와 완전한 동행을 택한 백화요란과 달리, 산해경은 복안을 가지고 우리와 협력하기로 했었습니다. 이제 그들을 다시 설득할 시간입니다."
ABY_focus_serika_dictatorship: "세리카의 독재"
ABY_focus_serika_dictatorship_desc: "키보토스인을 억압하는 오스트리아 정부를 전복하고, 이후 전쟁에서 승리하여 조국전선을 소탕한 것은 세리카가 없었다면 시작하지도 못했을 일이었습니다. 통합된 국가의 지도자는 마땅히 세리카가 되어야 합니다."
ABY_focus_kivotos_priority: "키보토스인 우선"
ABY_focus_kivotos_priority_desc: "우리는 키보토스인들이 더욱 대우받는 새로운 질서를 세울 것입니다. 그러나 이는 우리가 더 우월하기 때문이 아니라, 이 세계에서 아직 취약하기 때문이라는 것 또한 강조할 것입니다."
ABY_focus_new_kivotos_council: "새로운 키보토스 학생회"
ABY_focus_new_kivotos_council_desc: "총학생회가 제 역할을 잃고 마비되었으니, 우리가 새로운 학생회를 세워 앞으로의 혼란을 수습해야 합니다."
ABY_focus_abydos_sand_fiesta: "아비도스 모래 축제"
ABY_focus_abydos_sand_fiesta_desc: "대전이로 사막 지형이 이전된 것을 활용하여, 세리카는 모래 축제를 개최할 계획을 세웠습니다. 이는 지친 사람들의 심신을 치유해 줌과 동시에, 아비도스가 남키보토스를 주도한다는 상징적인 의미 또한 가질 것입니다."
ABY_focus_restore_democracy: "민주주의 복원"
ABY_focus_restore_democracy_desc: "체코는 대전이 이전까지 중부 유럽의 유일한 민주주의 국가였습니다. 민주주의의 재건은 두 민족을 통합하는 데 또한 도움이 될 것입니다."
ABY_focus_assembly_of_people: "온 국민의 의회"
ABY_focus_assembly_of_people_desc: "한쪽의 말만 듣고 다른 쪽의 말을 무시한다면, 분쟁이 생기는 것은 필연입니다. 키보토스인과 현지인 동수로 의회를 구성하면 양쪽의 의견을 모두 존중할 수 있을 것입니다."
ABY_focus_combination_between_two_people: "두 종족의 통합"
ABY_focus_combination_between_two_people_desc: "통합된 남키보토스는 두 종족이 모두 존중받는 국가가 될 것입니다."
ABY_focus_lamp_festival_for_new_era: "새 시대를 위한 등불 축제"
ABY_focus_lamp_festival_for_new_era_desc: "과거 백귀야행 연합학원에서는 학원의 통합을 위해 등불 축제를 개최하여, 통합을 기원하며 등불을 물에 띄웠다고 합니다. 통합을 기원하는 의미로, 남키보토스 의회는 등불 축제를 개최할 것을 선언했습니다."
ABY_focus_girl_with_white_uniform: "흰 제복의 소녀"
ABY_focus_girl_with_white_uniform_desc: "대책위원회가 세리카만 살아남게 되었을 때, 남키보토스의 운명은 풍전등화나 다름없었습니다. 그러나 세리카는 뜻을 같이하는 사람들을 모아 비참한 운명을 결국 바꾸어 내었습니다.\n\n통합된 남키보토스의 평화로운 거리를 둘러보며, 세리카는 대책위원회 멤버들에게 근황을 말해주러 정든 교정으로 향했습니다..."


##################################################################################################################################################

### 육군 중점 (현지군 및 일반 교리)
### 육군 중점
ABY_focus_army_1: "민병대 해체"
ABY_focus_army_1_desc: "대전이 직후, 혼란에 빠진 조국을 지키기 위해 자발적으로 일어선 민병대와 자경단의 헌신은 역사에 길이 남을 것입니다. 하지만 국가 체계가 정비되고 정규군이 재건되는 이 시점에서, 지휘 체계가 불분명하고 훈련 수준이 제각각인 민병대는 군사 작전의 효율성을 저해하는 요소가 될 수 있습니다. 우리는 그들에게 감사를 표하며 명예롭게 해산시키거나, 엄격한 선발 과정을 거쳐 정규군의 일원으로 편입시켜야 합니다. 현대전은 불타는 애국심만으로는 승리할 수 없으며, 고도의 훈련과 일사불란한 지휘 통제만이 승리를 담보할 수 있습니다. 이제 아마추어의 시대는 끝났습니다."

ABY_focus_army_2: "국가 방어 우선"
ABY_focus_army_2_desc: "우리의 국력과 병력은 주변의 잠재적 적국들에 비해 턱없이 부족한 것이 냉혹한 현실입니다. 이러한 상황에서 무리하게 전선을 확대하거나 공격적인 군사 행동을 취하는 것은 자멸을 초래할 뿐입니다. 우리는 국토의 주요 요충지를 요새화하고, 적의 진격로에 다층적인 방어선을 구축하여 적의 출혈을 강요하는 지구전 전략을 채택해야 합니다. 우리의 목표는 영토 확장이 아니라 조국의 생존입니다. 적들이 우리의 철통같은 방어선에 머리를 박고 피를 흘리게 하십시오. 우리가 흘릴 피 한 방울은 적들의 피 열 방울과 맞바꾸어야 하며, 이 땅의 모든 돌멩이 하나하나가 적들에게는 넘을 수 없는 산이 될 것입니다."

ABY_focus_army_3: "선제 타격 우선"
ABY_focus_army_3_desc: "수세적인 태도로는 전쟁의 주도권을 쥘 수 없습니다. 최선의 방어는 적이 우리를 공격할 엄두조차 내지 못하게 만드는 강력한 공격입니다. 적의 병력이 집결하고 보급로가 완성되기 전, 그들의 가장 취약한 순간을 노려 심장부를 타격해야 합니다. 고도의 기동력과 화력을 집중하여 적의 허를 찌르는 전격적인 선제 타격 교리를 확립하십시오. 적의 지휘 체계를 마비시키고 전쟁 의지를 꺾어놓는 것만이, 열세인 우리가 승기를 잡을 수 있는 유일한 방법입니다. 전장의 흐름을 읽고 먼저 움직이는 자만이 승리의 여신과 춤을 출 수 있습니다. 망설임은 곧 패배입니다."

ABY_focus_army_4: "전술 참호 도입"
ABY_focus_army_4_desc: "참호전은 결코 구시대의 유물이 아닙니다. 키보토스에서 전래된 선진적인 방어 전술 개념과 우리 국토의 험준한 지형을 결합하여, 단순한 구덩이가 아닌 유기적인 방어 네트워크를 구축해야 합니다. 서로를 엄호할 수 있는 교차 화망을 구성하고, 적의 포격과 항공 공격으로부터 아군을 보호할 수 있는 견고한 벙커와 지하 통로를 건설하십시오. 이 현대적인 전술 참호는 적의 진격을 늦추는 늪이자, 반격을 위한 도약대가 될 것입니다. 적들이 아무리 많은 포탄을 쏟아붓더라도, 우리는 그 아래에서 안전하게 숨을 고르며 치명적인 반격을 준비할 것입니다. 이것은 움직이지 않는 강철의 요새입니다."

ABY_focus_army_5: "중앙 지휘 체계 확립"
ABY_focus_army_5_desc: "각기 다른 출신과 배경을 가진 부대들이 하나의 유기체처럼 움직이기 위해서는 강력하고 일원화된 중앙 통제 시스템이 필수적입니다. 육군, 공군, 그리고 헤일로 부대까지 아우르는 통합 사령부를 창설하고, 사령부의 명령이 최전선의 병사 한 명에게까지 신속하고 정확하게 전달될 수 있도록 첨단 통신망을 정비하십시오. 지휘권의 난립과 명령 불복종은 전장에서의 패배로 직결되는 가장 큰 적입니다. 모든 부대가 하나의 머리, 하나의 의지로 움직일 때 비로소 우리는 적을 압도할 수 있습니다. 혼란을 잠재우고 질서를 세우는 것, 그것이 승리로 가는 첫걸음입니다."

ABY_focus_army_6: "복무기간 연장"
ABY_focus_army_6_desc: "전운이 감도는 위기 상황에서 병사들을 섣불리 전역시키는 것은 국방력에 심각한 공백을 초래하는 위험한 도박입니다. 숙련된 병사 한 명을 키워내는 데는 오랜 시간이 걸리지만, 그들을 잃는 것은 한순간입니다. 우리는 부득이하게 의무 복무 기간을 연장하여 전투 경험이 풍부한 정예 병력을 최대한 유지해야 합니다. 물론 병사들과 그 가족들의 불만은 피할 수 없겠지만, 조국의 안위가 풍전등화인 지금은 개인의 희생을 요구할 수밖에 없습니다. 더 많은 총과, 그 총을 능숙하게 다룰 수 있는 손이 필요합니다. 오늘 우리가 흘리는 땀방울이 내일 우리 가족의 피를 대신할 것입니다."

ABY_focus_army_7: "전장 평탄화"
ABY_focus_army_7_desc: "적의 지뢰밭, 겹겹이 쌓인 철조망, 그리고 매복하고 있을지도 모르는 참호선까지, 아군의 진격로에 놓인 모든 위험 요소를 제거하는 가장 확실하고 무자비한 방법은 압도적인 화력 투사입니다. 보병이 위험한 땅에 발을 내딛기 전, 보유한 모든 포병 전력을 동원하여 제한 없는 포격을 가해 지형 자체를 물리적으로 평탄화시키십시오. 마치 신이 거대한 쟁기로 땅을 갈아엎듯, 적의 방어 시설과 함정들을 흔적도 없이 날려버려야 합니다. 포연이 걷힌 후, 뒤집어진 흙더미 위에는 오직 우리 군을 위한 안전하고 평탄한 진격로만이 남을 것입니다. 장애물이 있다면 가루로 만들어 길을 여는 것, 그것이 우리의 방식입니다."

ABY_focus_army_8: "대전쟁의 유산"
ABY_focus_army_8_desc: "지난 대전쟁(1차 세계대전)이 남긴 피의 교훈은 여전히 유효합니다. 적의 방어선에 막대한 화력을 쏟아붓고, 끊임없는 소모전을 강요하여 적의 인적, 물적 자원을 고갈시키는 전술은 적들에게 끔찍한 악몽을 선사할 것입니다. 비록 인명 경시라는 비난을 받을지라도, 확실하게 적을 제압할 수 있는 검증된 승리의 방정식을 포기할 이유는 없습니다. 대규모 포격전과 참호전, 그리고 독가스 살포까지 고려한 총력전 태세는 적들에게 우리가 승리를 위해서라면 어떤 수단도 가리지 않는다는 공포심을 심어줄 것입니다. 전쟁은 낭만이 아닙니다. 이기기 위해 존재하는 가장 잔혹한 현실입니다."

ABY_focus_army_9: "생명의 길"
ABY_focus_army_9_desc: "전장에서 끊어지지 않는 보급로는 군대의 생명줄이자 동맥입니다. 최전선에서 싸우는 병사들이 탄약이 떨어지거나 식량이 부족해 굶주리는 일이 없도록, 후방의 병참 라인을 요새화하고 수송 체계를 획기적으로 개선해야 합니다. 철도는 전차보다 중요하며, 트럭은 소총보다 귀중합니다. 적들이 우리의 보급로를 끊기 위해 특수부대를 침투시키거나 공습을 가해오겠지만, 우리는 그 어떤 희생을 치르더라도 이 '생명의 길'을 사수할 것입니다. 병참이 무너지면 군대도 무너집니다. 보급 장교의 펜 끝이 적장의 칼날보다 더 많은 병사를 살릴 수 있음을 명심하십시오."

ABY_focus_army_10: "부대 결속력 강화"
ABY_focus_army_10_desc: "서로 다른 출신, 민족, 배경을 가진 병사들을 하나의 강철 같은 군대로 묶어주는 것은 전우애와 결속력입니다. 강도 높은 합동 훈련과 정신 교육을 통해 부대원들 간의 유대감을 강화하고, 서로를 위해 목숨을 걸 수 있는 신뢰를 구축하십시오. 전장에서 내 등을 맡길 수 있는 전우가 있다는 사실은 병사들에게 그 어떤 최신 무기보다 더 큰 용기를 줍니다. 인종과 출신의 벽을 넘어, 오직 '아비도스 연방군'이라는 하나의 이름 아래 뭉친 군대야말로, 물리적인 전력 차이를 극복하고 기적을 만들어낼 수 있는 진정한 강군입니다. 우리는 형제입니다."

ABY_focus_army_11: "보급망 확대"
ABY_focus_army_11_desc: "군대가 적진 깊숙이 진격할수록 필요한 물자의 양은 기하급수적으로 늘어나고, 보급선은 길어지고 위태로워집니다. 기존의 철도망을 확충하고, 도로를 포장하며, 전선 곳곳에 야전 보급창을 설치하여 작전 지속 능력을 비약적으로 향상시켜야 합니다. 보급의 한계가 곧 진격의 한계입니다. 우리는 그 한계를 더 멀리, 더 넓게 확장하여 아군이 어디에 있든 필요한 물자를 즉시 받을 수 있도록 만들 것입니다. 멈추지 않는 보급 트럭의 행렬은 우리 군의 끊임없는 진격을 가능하게 하는 원동력이 될 것입니다."

ABY_focus_army_12: "철과 화약"
ABY_focus_army_12_desc: "잠들어 있던 전쟁의 신은 철과 화약의 매캐한 냄새를 맡으며 깨어납니다. 슈코다의 공장과 비코비체의 제철소를 비롯한 우리의 모든 산업 역량을 총동원해 생산된 포탄들은 전선의 적들에게 강철의 비가 되어 내릴 것입니다. 적들이 참호 속에 숨든, 벙커 깊숙이 들어가든, 우리의 포탄은 그들을 찾아낼 것입니다. 적들이 숨을 곳은 이 땅 어디에도 없습니다. 압도적인 포병 화력만이 적의 저항 의지를 철저히 짓밟고 승리를 가져올 유일한 언어입니다. 더 많은 포신, 더 많은 포탄, 더 큰 폭발. 이것이 우리가 적에게 줄 수 있는 유일한 대화 수단입니다."

ABY_focus_army_13: "대전략"
ABY_focus_army_13_desc: "국지적인 전투에서의 승리가 반드시 전쟁 전체의 승리를 보장하지는 않습니다. 우리는 전장의 작은 승리에 도취되지 말고, 국가의 정치, 외교, 경제, 군사적 역량을 총체적으로 조율하여 전쟁이라는 거대한 게임의 판을 읽어야 합니다. 적의 움직임을 거시적으로 예측하고, 아군의 강점을 극대화하며 약점을 보완하는 치밀한 대전략을 수립하십시오. 체스판 전체를 내려다보는 안목으로 말을 움직여야 합니다. 때로는 살을 내어주고 뼈를 취하는 과감한 결단도 필요합니다. 전쟁은 총 칼로 하는 것이 아니라, 머리로 하는 것입니다."

ABY_focus_army_14: "대규모 돌격"
ABY_focus_army_14_desc: "복잡한 전술이나 기교가 통하지 않을 때, 압도적인 병력으로 적의 방어선을 정면으로 찢어발기는 것만큼 확실하고 충격적인 방법은 없습니다. 병사들의 사기를 극한으로 고취하고, 전 전선에 걸친 동시다발적이고 파상적인 돌격을 감행하십시오. 두려움을 잊고 함성을 지르며 달려드는 아군의 기세에 적들은 공포에 질려 방어선을 포기하고 도망칠 것입니다. 파도처럼 밀려오는 인간의 물결은 어떤 요새라도 삼켜버릴 것입니다. 물론 희생은 따르겠지만, 승리를 위해서라면 감수해야 할 대가입니다. 돌격 앞으로!"

ABY_focus_army_15: "화력우세"
ABY_focus_army_15_desc: "적 보병이 감히 참호 밖으로 고개를 들 수 없을 만큼의 압도적이고 지속적인 화력을 투사하십시오. 보병의 소화기 사격, 포병의 지원 포격, 전차포의 직사 화력, 그리고 공중 지원까지 모든 화력을 유기적으로 통합 운용하여 특정 지점에 쏟아부어야 합니다. 목표 지점의 모든 생명체를 소거하고 적을 먼지처럼 사라지게 만드십시오. 전장에서 자비란 없습니다. 오직 압도적인 화력만이 진리이며, 더 큰 화력은 더 큰 진리입니다. 적을 제압하는 것이 아니라, 삭제해 버리는 것이 우리의 목표입니다."

### 헤일로 보병 중점
ABY_focus_halo_1: "정규군 재건"
ABY_focus_halo_1_desc: "기하급수적으로 늘어나는 학생 수는 단순한 인구 증가가 아닌, 우리 연방의 잠재적 전력이 비약적으로 증대되고 있음을 의미합니다. 우리는 자원한 학생들을 징집하여 육군 산하에 독자적인 지휘권과 인사권을 가진 '헤일로 사령부'를 신설하고, 본격적인 정규 '헤일로 사단' 편성을 시작합니다. 이제 학생들은 산발적인 게릴라나 보조 전력이 아닌, 체계적인 지휘 통제와 군사 훈련 하에 움직이는 연방군의 핵심 전략 자산이 될 것입니다. 그들의 신비는 군율과 만나 더욱 강력하고 날카로운 칼날이 되어 조국을 수호할 것입니다."

ABY_focus_halo_2: "신비 보병 연구"
ABY_focus_halo_2_desc: "'신비'를 가진 학생들은 재래식 화기로는 상처 입히기 힘든 초인적인 내구성과 일개 소대를 능가하는 막강한 화력을 지니고 있습니다. 이들의 능력을 과학적으로 분석하고 전술적으로 데이터화하여, 최적화된 운용 교리와 부대 편제를 개발해야 합니다. 단순히 '강한 개인'에 의존하는 것이 아니라, 전장의 판도를 뒤집고 전략적 목표를 달성할 수 있는 체계화된 '전략 병기'로서의 가치를 증명해 보이겠습니다. 신비는 기적이 아니라, 우리가 통제하고 활용해야 할 힘입니다."

ABY_focus_halo_3: "충성의 의무"
ABY_focus_halo_3_desc: "학생들은 자유분방하고 개성이 강하지만, 이제는 연방의 군인으로서 가져야 할 책임감과 소속감을 심어주어야 합니다. 그들이 가진 특별한 힘은 자신들만의 것이 아니라, 이 나라와 고통받는 시민들을 지키기 위해 주어진 것임을 끊임없이 주지시켜야 합니다. 강도 높은 정신 교육과 연방의 역사에 대한 교육을 통해, 헤일로의 빛이 조국에 대한 흔들리지 않는 충성심으로 더욱 밝게 빛나도록 하십시오. 그들은 이제 학생이기에 앞서, 명예로운 아비도스의 군인입니다."

ABY_focus_halo_4: "능동적 방어 교리"
ABY_focus_halo_4_desc: "학생들의 뛰어난 신체 능력과 반사 신경을 활용하여, 적의 공격을 단순히 참호 속에서 받아내는 수동적인 방어가 아니라, 공격의 기점부터 차단하는 능동적 방어 전술을 수립합니다. 적의 공세 징후가 포착되면 즉각적으로 기동하여 적의 예봉을 꺾어버리고, 역습을 가해 공세로 전환하는 기동 방어는 우리의 피해를 최소화할 것입니다. 방패로 막는 것이 아니라, 칼로 적의 칼을 쳐내는 것. 그것이 우리가 추구하는 방어입니다."

ABY_focus_halo_5: "새 시대의 신비 보병"
ABY_focus_halo_5_desc: "우리는 승리를 위해 인간성을 포기하고 악마가 될 수는 없습니다. 사용자의 수명을 갉아먹는 비윤리적이고 반인륜적인 '인조 헤일로' 실험을 전면 폐기하고, 대신 신비 에너지를 주입한 강화 외골격 '저거너트' 기술을 공식 채택합니다. 비록 생산 비용은 막대하지만, 착용자의 건강을 해치지 않으면서도 키보토스인에 준하는 전투력을 발휘하는 이 강철의 갑주는 우리의 기술적 우위와 도덕적 정당성을 동시에 증명할 것입니다. 우리는 생명을 지키기 위해 싸우지, 생명을 소모품으로 쓰기 위해 싸우지 않습니다."

ABY_focus_halo_6: "정규군 확대"
ABY_focus_halo_6_desc: "더 많은 학생을 대상으로 징집을 확대하고 강도 높은 훈련을 실시하여 헤일로 보병 사단의 수를 늘려야 합니다. 소수 정예 특수부대의 한계를 넘어, 전 전선을 커버하고 대규모 회전에서도 주력군으로 활약할 수 있는 규모의 군대를 육성하십시오. 양적인 팽창이 질적인 저하로 이어지지 않도록, 엄격한 선발 기준과 표준화된 훈련 프로그램을 유지해야 합니다. 전장을 뒤덮는 수많은 헤일로의 빛은 적들에게 절망을 안겨줄 것입니다."

ABY_focus_halo_7: "데이터 링크 기술 도입"
ABY_focus_halo_7_desc: "고성능 저거너트 슈트의 잠재력을 100% 끌어내기 위해서는 조종사 간의 유기적인 연결이 필수적입니다. 밀레니엄의 기술을 응용한 실시간 데이터 링크 시스템을 도입하여 각 슈트의 센서 정보를 공유하고, 전장의 상황을 입체적으로 파악하여 지휘부에 전달하십시오. 이것은 단순한 기계들의 집합이 아니라, 하나의 거대한 신경망으로 연결되어 움직이는 강철의 군단이 될 것입니다. 정보의 공유가 곧 생존이자 승리입니다."

ABY_focus_halo_8: "지원육상모함 연구"
ABY_focus_halo_8_desc: "저거너트 슈트는 강력하지만, 정비와 충전, 재보급에 많은 자원과 시설이 소모됩니다. 이를 효율적으로 지원하기 위해 전선을 따라 이동하는 거대한 '지원육상모함'을 개발합니다. 움직이는 정비창이자 충전소, 그리고 병사들의 휴식처인 이 모함은 저거너트 부대가 보급 걱정 없이 적진 깊숙이 진격하여 작전을 지속할 수 있게 하는 든든한 등대가 될 것입니다. 사막을 건너는 배처럼, 이 강철의 요새는 황무지를 가로질러 승리를 실어 나를 것입니다."

ABY_focus_halo_9: "특공 지휘관"
ABY_focus_halo_9_desc: "뛰어난 전투력과 카리스마, 그리고 탁월한 전술적 식견을 겸비한 학생들을 선발하여 특공 지휘관으로 임명합니다. 후방의 안전한 벙커가 아닌 최전선에서 병사들과 함께 호흡하며, 직접 무기를 들고 적진을 돌파하는 그들의 모습은 아군의 사기를 하늘 끝까지 올려줄 것입니다. 병사들은 자신보다 앞장서서 위험에 뛰어드는 지휘관을 위해 기꺼이 목숨을 바칠 것입니다. 영웅은 난세에 태어나고, 피 튀기는 전장에서 완성됩니다."

ABY_focus_halo_10: "연방의 수호자"
ABY_focus_halo_10_desc: "이제 아비도스의 학생들은 이방인이나 손님이 아닙니다. 그들은 이 연방을 지키는 가장 단단한 방패이자, 적의 심장을 꿰뚫는 날카로운 창입니다. 시민들은 그들을 신뢰하고 존경하며, 학생들은 시민들의 안전과 행복을 위해 자신의 힘을 사용합니다. 이 굳건한 유대와 신뢰는 어떤 물리적인 무기보다 강력한 힘을 발휘하여 국가를 결속시킬 것입니다. 우리는 서로가 서로를 지키는 운명 공동체입니다."

ABY_focus_halo_11: "육상 태스크 포스"
ABY_focus_halo_11_desc: "저거너트 부대를 주축으로 하여 전차, 장갑차, 자주포 등 다양한 지원 차량을 혼성 편제한 고기동 기계화 부대, '육상 태스크 포스'를 창설합니다. 중장갑의 저거너트가 전선을 돌파하면, 뒤따르는 기계화 보병과 화력 지원 부대가 전과를 확대하고 점령지를 확보할 것입니다. 이 강철의 기사단은 어떤 견고한 방어선이라도 뚫어내고 적진을 유린하는 연방의 망치가 될 것입니다. 속도와 화력, 그리고 방어력의 완벽한 조화를 보여주십시오."

ABY_focus_halo_12: "연방군의 중추"
ABY_focus_halo_12_desc: "헤일로 보병대는 이제 보조 전력이 아닌 연방군의 작전 계획을 주도하는 핵심 중추입니다. 모든 전략과 전술은 이들의 능력을 극대화하는 방향으로 수립되며, 재래식 부대들은 이들을 지원하고 측면을 방어하는 조연 역할을 맡게 됩니다. 전장의 주역이 바뀐 것입니다. 우리의 승리는 그들의 손에, 그들의 총구에, 그리고 그들의 신비에 달려 있습니다. 그들이 실패하면 연방도 실패합니다."

ABY_focus_halo_13: "빛의 파도"
ABY_focus_halo_13_desc: "전선을 가득 메운 수많은 헤일로의 찬란한 빛은 아군에게는 희망의 등대이자, 적들에게는 다가오는 파멸의 신호탄입니다. 압도적인 화력과 신비의 힘, 그리고 꺾이지 않는 의지로 적진을 쓸어버리는 대규모 공세 작전 '빛의 파도'를 개시하십시오. 성난 파도처럼 밀려오는 빛의 군대 앞에서 어둠의 세력들은 흔적도 없이 사라질 것입니다. 그 무엇도 이 성스러운 진격을 막을 수는 없습니다. 진격하라, 승리의 그날까지!"

### 공군 중점
ABY_focus_air_1: "공군 재건"
ABY_focus_air_1_desc: "적의 공습으로 부서진 활주로를 복구하고, 격납고 구석에 방치되어 먼지가 쌓인 기체들을 찾아내어 닦고 조이십시오. 하늘을 잃은 군대는 날개 꺾인 새와 같아 반쪽짜리 전력에 불과합니다. 비록 지금은 낡은 복엽기와 훈련기 몇 대가 전부인 미약한 시작이지만, 우리는 다시 한번 창공을 향해 힘차게 날아오를 것입니다. 제공권을 장악하는 자가 전장의 눈과 귀를 가지며, 전쟁을 지배합니다. 하늘을 되찾아야 땅도 지킬 수 있습니다."

ABY_focus_air_2: "새로운 공군 교리"
ABY_focus_air_2_desc: "과거 대전쟁 시절의 낡은 공중전 방식을 답습해서는 안 됩니다. 헬리콥터의 기동성과 고정익기의 화력을 유기적으로 결합하고, 지상군과의 긴밀한 협조 하에 이루어지는 근접 항공 지원(CAS) 등 현대전에 걸맞은 새롭고 혁신적인 공군 교리를 정립해야 합니다. 공군은 독자적인 전투뿐만 아니라 지상군의 작전을 승리로 이끄는 핵심적인 역할을 수행해야 합니다. 하늘에서의 혁신이 지상에서의 승리를 불러올 것입니다."

ABY_focus_air_3: "전투기 노획"
ABY_focus_air_3_desc: "키보토스에서 전이된 현대식 제트 전투기들은 현재 우리의 기술력으로는 감히 이해하거나 복제할 수 없는 '오버 테크놀로지'의 결정체입니다. 우리는 점령지 곳곳의 폐쇄된 공항이나 비밀 격납고에 방치된 이 비대칭 전력들을 필사적으로 수색하고 노획해야 합니다. 비록 부품 부족과 정비의 어려움으로 새로 생산할 수는 없지만, 하늘을 찢는 굉음과 함께 초음속으로 날아오르는 이 강철의 매들은 적들에게 이해할 수 없는 공포와 절망을 선사할 것입니다."

ABY_focus_air_4: "육군 항공대"
ABY_focus_air_4_desc: "공군 사령부의 복잡한 절차를 거치지 않고, 지상군 지휘관의 명령에 따라 즉각적으로 작전을 지원할 육군 예하의 항공대를 창설합니다. 전선 바로 위를 비행하며 적의 참호를 타격하고 아군의 진격을 돕는 헬리콥터와 경공격기들은 보병들에게 가장 든든한 우산이 될 것입니다. 현장의 필요에 즉각 반응하는 항공 전력은 전술적인 유연성을 비약적으로 상승시킬 것입니다. 보병과 항공기는 하나가 되어 싸워야 합니다."

ABY_focus_air_5: "독립 군종 정신"
ABY_focus_air_5_desc: "공군은 육군의 시녀나 단순한 지원 부대가 아닙니다. 독자적인 전략 목표를 설정하고 수행할 수 있는 독립된 군종으로서의 자부심과 정체성을 고취하십시오. 적의 후방을 타격하는 전략 폭격, 적기의 활동을 봉쇄하는 제공권 장악 등은 오직 공군만이 수행할 수 있는 고유하고 치명적인 영역입니다. 하늘의 주인은 바로 우리이며, 우리는 그 누구의 간섭도 없이 조국의 하늘을 지킬 것입니다."

ABY_focus_air_6: "하늘의 포병"
ABY_focus_air_6_desc: "고도 정밀 유도 폭격과 로켓 공격은 하늘에서 쏘는 대포와 같습니다. 지형의 제약을 받는 지상의 포병보다 더 멀리, 더 높이, 더 정확하게 적의 머리 위를 타격하십시오. 적들이 안전하다고 생각하는 후방의 보급 기지나 지휘소조차 우리의 폭격 범위 안에 있습니다. 포병이 전장의 신이라면, 항공기는 그 신들을 내려다보며 심판하는 신들의 왕입니다. 하늘에서 내리는 죽음의 비를 피할 곳은 없습니다."

ABY_focus_air_7: "지상 타격"
ABY_focus_air_7_desc: "적의 기계화 부대와 전차 군단, 그리고 길게 늘어선 보급 행렬을 초토화하는 데 특화된 지상 공격기 운용에 집중합니다. 튼튼한 장갑으로 적의 대공 사격을 견뎌내며, 강력한 대전차 기관포와 미사일로 적의 강철 괴물들을 고철로 만들어버리는 공격기들은 지상의 적들에게 저승사자와 다름없을 것입니다. 아무리 두꺼운 장갑을 두른 전차라도 하늘의 매 앞에서는 도망칠 곳 없는 먹잇감에 불과합니다."

ABY_focus_air_8: "도그 파이팅"
ABY_focus_air_8_desc: "최고의 기량을 가진 파일럿을 양성하고 기체의 기동성을 극한으로 끌어올려, 적기와의 근접 공중전(도그 파이팅)에서 확실한 우위를 점해야 합니다. 꼬리를 무는 치열한 선회전, 중력을 거스르는 기동 끝에 적기를 조준경에 넣고 격추시키는 그 짧은 순간이야말로 공군 파일럿의 존재 이유이자 자존심입니다. 창공의 결투에서 승리하여 우리 하늘을 더럽히는 적기들을 깨끗하게 청소하십시오."

ABY_focus_air_9: "공군 전문화"
ABY_focus_air_9_desc: "모든 것을 어설프게 할 수 있는 다목적 기체보다는, 특정 임무에 최적화된 전문 기체들을 개발하고 배치합니다. 적기를 잡는 제공 전투기, 지상을 공격하는 전폭기, 정보를 수집하는 정찰기 등 각 분야에서 최고의 성능을 발휘하는 기체들은 작전 성공률을 비약적으로 높여줄 것입니다. 한 가지 기술에 통달하여 극한의 경지에 오른 칼날이 가장 날카롭고 치명적인 법입니다."

ABY_focus_air_10: "원초적 공포"
ABY_focus_air_10_desc: "하늘에서 들려오는 찢어질 듯한 굉음은 폭탄이 떨어지기도 전에 적의 사기를 꺾어놓고 공황 상태에 빠뜨립니다. 급강하 폭격기에 특수 제작된 사이렌(예: 제리코의 나팔)을 부착하여 심리전 요소를 극대화하십시오. 죽음이 머리 위에서 수직으로 꽂히는 공포, 그 원초적이고 본능적인 두려움이야말로 물리적인 파괴력 이상의 효과를 발휘하는 가장 효율적인 무기입니다. 적들은 그 소리만 들어도 도망치게 될 것입니다."

ABY_focus_air_11: "갓 킬러"
ABY_focus_air_11_desc: "지상의 포병이 전장을 지배하는 '전장의 신'이라 불린다면, 공군은 그 신을 죽이는 존재, 즉 '갓 킬러'가 되어야 합니다. 적의 포병 진지, 다연장 로켓 발사대, 대포병 레이더 등 핵심 화력 자산을 최우선 표적으로 삼아 정밀 타격하여 무력화하십시오. 적의 화력이 침묵하고 그들의 신이 죽는 순간, 지상의 아군은 포격의 두려움 없이 안전하게 진격할 수 있을 것입니다. 신을 죽이는 창은 하늘에서 떨어집니다."

ABY_focus_air_12: "제2의 전장"
ABY_focus_air_12_desc: "지상전이 교착 상태에 빠져 참호 속에 갇혀 있을 때, 이를 타개할 돌파구는 하늘에 있습니다. 공중을 단순한 지원 공간이 아닌 제2의 주전장으로 규정하고, 대규모 항공 작전을 통해 전쟁의 양상을 입체적으로 뒤바꾸어야 합니다. 공수부대 투하, 대규모 공중 강습, 전략 폭격 등 하늘을 활용한 다차원적인 공격은 적의 방어선을 무용지물로 만들 것입니다. 땅에서 이기지 못한다면, 하늘에서 이기면 됩니다."

ABY_focus_air_13: "가장 높은 곳의 수호자"
ABY_focus_air_13_desc: "성층권 높이 날아오르는 고고도 요격기들은 조국의 가장 높은 곳을 지키는 수호자들입니다. 적의 전략 폭격기나 정찰기가 우리 영토에 단 한 발의 폭탄도 떨어뜨리지 못하게 하고, 우리의 비밀을 엿보지 못하게 하십시오. 그들이 아무리 높이 날더라도 우리의 요격 미사일과 전투기는 그들을 격추시킬 것입니다. 우리의 하늘은 철통같이 지켜질 것이며, 그 아래 시민들은 편안히 잠들 것입니다. 우리는 하늘의 방패입니다."

### 해군 중점
ABY_focus_navy_1: "해안 확보"
ABY_focus_navy_1_desc: "오랫동안 내륙국으로 갇혀 있었던 우리는 이제 역사적인 기회를 맞아 바다로 나아갈 길을 열었습니다. 어렵게 확보한 귀중한 해안선을 정비하고, 대형 선박이 접안할 수 있는 현대적인 항만 시설과 해군 기지를 건설하여 해군력을 투사할 발판을 마련하십시오. 바다 없는 국가는 감옥과 같으며, 바다를 포기하는 것은 세계를 포기하는 것입니다. 이제 우리는 그 감옥의 문을 부수고, 대양을 향해 힘찬 닻을 올립니다."

ABY_focus_navy_2: "조선업 기술 흡수"
ABY_focus_navy_2_desc: "우리의 조선 기술은 아직 걸음마 단계에 불과합니다. 획득한 항구 도시의 숙련된 기술자들과 유서 깊은 이스트리아 지역의 조선 노하우를 적극적으로 흡수하고 연구하여, 독자적인 함선 건조 능력을 빠르게 배양해야 합니다. 타국의 기술을 모방하는 것을 부끄러워하지 마십시오. 모방은 창조의 어머니이며, 그들의 기술을 바탕으로 우리만의 강력한 함대를 만들어낼 것입니다. 언젠가는 우리가 만든 배가 세계의 바다를 누빌 것입니다."

ABY_focus_navy_3: "대양해군"
ABY_focus_navy_3_desc: "연안에서 찰랑거리는 파도에 만족해서는 안 됩니다. 먼바다로 나가 적의 해상 보급로를 끊고, 본토를 직접 타격하며, 국익이 있는 곳이라면 어디든 갈 수 있는 원양 작전 능력을 갖춘 진정한 '대양해군'을 건설하십시오. 바다는 넓고 우리의 야망은 큽니다. 수평선 너머 미지의 세계까지 우리의 깃발이 휘날리게 하고, 우리의 함대가 지나가는 곳이 곧 우리의 영해가 되도록 만드십시오."

ABY_focus_navy_4: "방위해군"
ABY_focus_navy_4_desc: "우리의 제한된 국력과 자원으로는 열강들처럼 대규모 함대를 운용하는 것이 현실적으로 불가능합니다. 허황된 꿈을 쫓기보다는 해안선 방어와 근해 작전에 특화된, 작지만 효율적인 '방위해군'을 육성하여 적의 상륙 기도를 저지하는 데 집중하십시오. 기뢰, 해안포, 고속정으로 무장한 작지만 단단한 고슴도치 같은 해군이 우리의 바다를 지킬 것입니다. 들어오는 것은 마음대로여도 나가는 것은 마음대로가 아닐 것입니다."

ABY_focus_navy_5: "태스크 포스 창설"
ABY_focus_navy_5_desc: "특정 임무 수행을 위해 구축함, 순양함, 잠수함, 그리고 지원함 등을 목적에 맞게 혼합 편성한 기동 부대(Task Force)를 창설합니다. 유연하고 신속하게 움직이는 태스크 포스는 해상 작전의 효율성을 극대화하고, 변화무쌍한 해상 환경에 능동적으로 대처할 수 있게 해줍니다. 바다 위의 늑대 떼처럼 무리 지어 다니며, 목표를 포착하면 조직적으로 포위하고 끈질기게 물어뜯으십시오."

ABY_focus_navy_6: "바다의 지배자"
ABY_focus_navy_6_desc: "역사가 증명하듯, 바다를 지배하는 자가 세계를 지배하고 부를 거머쥡니다. 강력한 주력 함대를 건설하여 주변 해역의 제해권을 완전히 장악하고, 해상 무역로를 통제하십시오. 우리의 허락 없이는 적의 물자 수송선은커녕 물고기 한 마리도 이 바다를 지나갈 수 없을 것입니다. 우리의 바다는 평화의 바다이거나, 아니면 적들의 무덤이 될 것입니다. 선택은 그들의 몫입니다."

ABY_focus_navy_7: "새 시대의 교리"
ABY_focus_navy_7_desc: "거함거포주의의 낭만과 항공모함 운용론의 효율성 사이에서, 우리는 우리에게 맞는 최적의 해군 교리를 찾아야 합니다. 미사일 고속정의 치고 빠지는 전술이나, 잠수함 전력을 활용한 비대칭 전력 운용 등 기존의 틀을 깨는 새로운 교리를 연구하십시오. 덩치 큰 공룡을 잡는 것은 거대한 티라노사우루스가 아니라, 날렵하고 영리한 랩터 무리일 수도 있습니다. 혁신적인 전술로 적의 거대 함대를 무력화시키십시오."

ABY_focus_navy_8: "연안함대 확대"
ABY_focus_navy_8_desc: "비교적 저렴하고 건조 기간이 짧은 다수의 어뢰정과 초계함을 건조하여 연안 방어망을 촘촘하게 구축합니다. 적의 잠수함이나 특수부대의 침투를 원천 봉쇄하고, 아군의 해상 수송로를 안전하게 보호하십시오. 얕은 바다의 지배자는 거대 전함이 아니라, 빠르고 민첩한 우리의 고속정들입니다. 연안의 복잡한 해안선과 섬들을 이용해 적들을 유인하고 괴멸시키십시오."

ABY_focus_navy_9: "거함거포주의"
ABY_focus_navy_9_desc: "거대한 함포와 어떤 공격도 튕겨내는 두꺼운 장갑, 그것은 바다 사나이들의 영원한 로망이자 국가의 힘을 과시하는 상징입니다. 해상 주도권을 단숨에 가져오고 적에게 공포를 심어줄 수 있는 초대형 전함 건조 계획을 추진하십시오. 수평선 너머 보이지 않는 곳에서 날아오는 거포의 일격은 적 함대에게 회복 불가능한 타격을 입히고, 전장의 판도를 뒤집을 것입니다. 크고 아름다운 대포는 언제나 옳습니다."

ABY_focus_navy_10: "해상항공대 확대"
ABY_focus_navy_10_desc: "바다 위에서의 싸움도 결국 하늘을 지배하는 자가 승리합니다. 항공모함이나 연안 육상 기지에서 발진하는 해군 항공대를 대폭 확충하십시오. 적 함선의 대공망을 뚫고 꽂히는 뇌격기의 어뢰와 급강하 폭격기의 폭탄은 적의 거대 전함에게 가장 치명적인 위협이 될 것입니다. 함포 사거리에 얽매이지 않고, 더 멀리서 더 먼저 적을 타격하여 수장시키십시오."

ABY_focus_navy_11: "바다의 늑대"
ABY_focus_navy_11_desc: "은밀하게 깊은 바닷속을 누비는 잠수함대는 적에게 보이지 않는 공포이자 심리적인 압박입니다. 무제한 통상 파괴 작전을 통해 적의 해상 보급로를 마비시키고, 방심한 적 주력함을 기습하여 수장시키십시오. 깊고 어두운 심연 속에서, 우리는 가장 치명적인 일격을 준비하고 있습니다. 적들이 안심하고 항해하는 그 순간, 우리의 어뢰가 그들의 배 밑바닥을 찢어버릴 것입니다."

ABY_focus_navy_12: "해상방위군"
ABY_focus_navy_12_desc: "해군을 단순한 전투 조직이 아닌, 영해와 해상 주권을 수호하는 준군사조직인 해상방위군으로 격상시킵니다. 체계적인 감시 시스템과 신속 대응 태세를 갖추어 평시에는 해적 소탕과 구조 활동을, 전시에는 국토 방위 임무를 수행하게 하십시오. 바다의 평화를 지키는 파수꾼으로서, 우리의 바다는 그 누구의 불법적인 침범도 허용하지 않을 것입니다."

ABY_focus_navy_13: "조국 수호의 방패"
ABY_focus_navy_13_desc: "해군은 바다 위에서 조국을 지키는 강철의 방패입니다. 적의 함포 사격과 상륙 시도로부터 해안 도시와 국토를 온전히 보전하는 것이야말로 해군의 가장 숭고한 존재 이유입니다. 파도가 부서지는 곳, 그 최전선에 우리가 서서 적의 공격을 온몸으로 막아낼 것입니다. 우리가 무너지면 조국이 유린당한다는 각오로, 단 한 척의 적선도 상륙하게 두지 마십시오."

### 산업 중점
ABY_focus_industry_1: "산업지대 재가동"
ABY_focus_industry_1_desc: "아비도스 외곽과 함께 기적적으로 전이된 산업 지구의 멈춰진 기계들을 다시 깨우십시오. 비록 전체의 일부에 불과하지만, 그곳에 잠들어 있는 기술력과 생산 잠재력은 엄청납니다. 전력을 다시 공급하고 유휴 인력을 투입하여 공업 생산력을 회복해야 합니다. 다시 힘차게 돌아가는 공장의 굉음과 굴뚝의 연기는, 우리 아비도스 연방이 폐허를 딛고 일어서고 있다는 국가 재건의 심장 박동 소리입니다."

ABY_focus_industry_2: "대기업 지원"
ABY_focus_industry_2_desc: "효율적인 국가 주도의 경제 성장을 위해, 이미 검증된 능력과 자본을 갖춘 대기업들에게 과감한 세제 혜택과 보조금을 지원합니다. 그들의 막강한 자본력과 선진 기술력을 활용하여 단기간에 산업 기반을 확충하고, 그 성과가 중소기업과 가계로 흘러 들어가는 낙수 효과를 기대할 수 있습니다. 거인을 키워야 더 큰 짐을 나를 수 있는 법입니다. 지금은 선택과 집중이 필요한 시기입니다."

ABY_focus_industry_3: "3대 기업 균형 유지"
ABY_focus_industry_3_desc: "네프티스의 오버 테크놀로지, 슈코다의 압도적인 생산력, 로스차일드의 막대한 자본력. 이 세 거대 기업은 우리 경제를 지탱하는 세 개의 기둥입니다. 어느 한쪽으로 힘이 쏠려 균형이 무너지지 않도록 정부가 섬세하게 조율하며, 그들 간의 건전한 경쟁심을 국가 발전의 동력으로 삼아야 합니다. 이 위태롭지만 정교한 줄타기가 성공한다면, 우리는 그 어떤 국가보다 강력한 경제적 시너지를 얻을 것입니다."

ABY_focus_industry_4: "소규모 기업체 병합"
ABY_focus_industry_4_desc: "난립하는 영세한 중소기업들을 통폐합하여 경영 효율성을 높이고, 불필요한 중복 투자를 방지합니다. 규모의 경제를 실현하여 국제 시장에서의 경쟁력을 확보하고, 기술 개발과 설비 투자에 여력을 가질 수 있도록 유도하십시오. 작은 냇물들이 모여 큰 강을 이루듯, 통합되어 덩치를 키운 기업들은 더 큰 부가가치를 창출하고 국가 경제의 허리를 튼튼하게 할 것입니다."

ABY_focus_industry_5: "보헤미아 공업단지 확대"
ABY_focus_industry_5_desc: "전통적인 공업 중심지이자 숙련된 장인들이 모여 있는 보헤미아 지역에 대규모 최신 산업 단지를 조성합니다. 기존의 탄탄한 인프라와 우수한 노동력을 활용하여, 이 지역을 유럽 최대의 생산 기지로 발돋움시키십시오. 보헤미아의 숲 대신 공장의 굴뚝이 들어서고, 그곳에서 피어오르는 연기는 우리 연방의 끝없는 번영과 힘을 상징하게 될 것입니다."

ABY_focus_industry_6: "로스차일드 금융 유치"
ABY_focus_industry_6_desc: "전쟁 수행과 전후 재건에는 상상을 초월하는 막대한 자금이 필요합니다. 유럽 금융의 황제, 로스차일드 가문의 글로벌 금융 네트워크를 적극 유치하여 부족한 국가 재정을 확충하고 대외 신용도를 높이십시오. 꽉 막힌 돈맥경화를 뚫어야 경제라는 거인이 움직일 수 있습니다. 황금의 힘을 우리 편으로 만들어, 전쟁 비용을 조달하고 경제 성장을 가속화하십시오."

ABY_focus_industry_7: "최저임금 인상"
ABY_focus_industry_7_desc: "노동자들의 삶이 안정되고 구매력이 생겨야 내수 시장이 살아나고 생산성도 향상됩니다. 최저임금을 현실화하여 노동자들의 인간다운 생활을 보장하고, 빈부 격차로 인한 사회적 불만을 잠재우십시오. 잘 먹고 잘 사는 노동자가 만드는 제품이 품질도 좋고, 애사심도 높은 법입니다. 이것은 단순한 복지가 아니라 경제 성장을 위한 투자입니다."

ABY_focus_industry_8: "기업체 분할"
ABY_focus_industry_8_desc: "비대해진 대기업을 강제로 쪼개 약화시키는 것이 아닙니다. 오히려 각 사업 분야에 특화된 전문 자회사들을 분사시켜 문어발식 확장을 합법적으로 유도하고, 경영의 효율성과 전문성을 극대화하는 전략입니다. 거대한 뿌리에서 뻗어 나온 튼튼하고 많은 가지들은 각자의 영역에서 시장 점유율을 높이며, 결과적으로 모기업과 국가 경제 전체를 더욱 견고하고 풍성하게 만들 것입니다."

ABY_focus_industry_9: "오스트리아 개발"
ABY_focus_industry_9_desc: "전쟁의 피해가 컸거나 상대적으로 개발에서 소외되었던 오스트리아 지역에 대한 집중적인 투자를 단행합니다. 알프스의 풍부한 수력 자원과 광물, 그리고 빈의 우수한 인적 자원을 결합하여 새로운 국가 성장 동력을 확보하십시오. 다뉴브강의 기적을 다시 한번 만들어낼 때입니다. 오스트리아는 더 이상 변방이 아닌 연방의 또 다른 중심축이 될 것입니다."

ABY_focus_industry_10: "슈코다 산업 회수"
ABY_focus_industry_10_desc: "혼란스러운 시기에 타 세력에 의해 불법적으로 점유되거나 흩어진 슈코다 웍스의 자산과 설비, 기술자들을 국유화 조치를 통해 강력하게 되찾아옵니다. 슈코다의 세계적인 중공업 능력과 화포 생산 기술은 우리 군수 산업의 핵심이자 자존심입니다. 잃어버린 우리의 '강철 심장'을 다시 가슴에 품고, 조국을 지킬 무기를 쏟아내야 합니다."

ABY_focus_industry_11: "아동 노동 금지"
ABY_focus_industry_11_desc: "아무리 전쟁 중이라 해도 인간으로서 지켜야 할 최소한의 선이 있습니다. 아이들의 고사리 같은 손은 기름진 기계가 아니라 연필을 잡아야 합니다. 아동 노동을 법적으로 엄격히 금지하고, 그들을 학교로 보내 국가의 미래를 책임질 동량으로 키워내십시오. 이것은 당장의 생산성보다 더 가치 있는 투자가 될 것이며, 우리의 도덕적 승리를 증명할 것입니다."

ABY_focus_industry_12: "기업 연구 협력"
ABY_focus_industry_12_desc: "기업이 보유한 독자적인 기술과 비밀 연구소를 국가 주도의 거대 연구 프로젝트에 통합시킵니다. 산학연 협력을 통해 중복 투자를 줄이고 기술 개발의 속도를 높여, 세계를 놀라게 할 혁신적인 무기 체계와 신기술을 개발하십시오. 지식의 공유와 융합이 새로운 힘을 낳습니다. 기업의 이익이 곧 국가의 이익이 되는 구조를 만드십시오."

ABY_focus_industry_13: "이스트리아 조선소 확대"
ABY_focus_industry_13_desc: "우리의 유일한 해양 진출 교두보인 이스트리아 지역의 낡은 조선소를 대폭 확장하고 최신 설비로 현대화합니다. 더 큰 전함, 더 많은 수송선을 건조할 수 있는 대형 독크를 건설하여 해군력 증강의 탄탄한 기반을 닦으십시오. 아드리아해의 작은 조선소가 대양 해군을 잉태하는 거대한 요람이 될 것입니다. 바다를 지배하는 꿈은 여기서 시작됩니다."

ABY_focus_industry_14: "선진적 정제기술 도입"
ABY_focus_industry_14_desc: "키보토스의 발전된 화학 기술이나 선진국의 정유 기술을 도입하여 연료 생산 효율을 극대화합니다. 원유 한 방울도 낭비하지 않고 고품질의 항공유와 가솔린으로 변환시키는 기술은, 우리의 기계화 부대와 항공대가 멈추지 않고 작전을 수행할 수 있게 해줄 것입니다. 에너지 효율이 곧 국력이며 승리의 열쇠입니다."

ABY_focus_industry_15: "수송선 생산"
ABY_focus_industry_15_desc: "전시 물자를 해외에서 안정적으로 들여오거나 병력을 신속하게 수송하기 위해 대규모 수송선단을 건조합니다. 적 잠수함의 위협을 뚫고 바다 위의 생명줄을 이어갈 상선단을 확충하여 해상 보급 역량을 강화하십시오. 화려한 전함 뒤에서 보이지 않게 묵묵히 짐을 나르는 그들이야말로 전쟁을 지탱하는 진정한 숨은 영웅들입니다."

ABY_focus_industry_16: "노동자 의견 제시 활성화"
ABY_focus_industry_16_desc: "생산 현장의 문제점과 개선 방안은 책상머리에 앉은 관리자가 아니라, 기계를 돌리는 노동자가 가장 잘 알고 있습니다. 노사 협의체를 활성화하고 제안 제도를 도입하여, 노동자들이 자유롭게 의견을 내고 생산 공정의 비효율을 개선하도록 장려하십시오. 깨어있는 노동자의 작은 아이디어 하나가 공장 전체의 생산성을 혁신적으로 바꿀 수 있습니다."

ABY_focus_industry_17: "대기업 그룹경제"
ABY_focus_industry_17_desc: "유사한 업종의 계열사들을 수직, 수평적으로 묶어 거대 기업 집단(카르텔/재벌)을 형성하게 하여 시너지를 창출합니다. 자본과 기술, 인력의 집약적인 투자가 가능해져 국가적인 거대 프로젝트를 수행할 수 있게 됩니다. 덩치를 키워 국제 경쟁력을 갖추십시오. 뭉치면 살고 흩어지면 죽는 것은 경제 생태계에서도 마찬가지입니다."

ABY_focus_industry_18: "산악 지대 공업화"
ABY_focus_industry_18_desc: "적의 전략 폭격이나 핵 공격으로부터 안전한 깊은 산악 지대에 지하 공장과 견고한 방호 시설을 건설합니다. 천연의 요새인 알프스와 카르파티아산맥을 활용한 공업 지대는, 국토가 유린당하는 최악의 전시 상황에서도 멈추지 않고 무기를 생산할 수 있는 능력을 보장할 것입니다. 산을 깎고 굴을 파서라도 우리의 공장을 지켜내야 합니다."

ABY_focus_industry_19: "네프티스 기술 공유"
ABY_focus_industry_19_desc: "네프티스 그룹이 독점하고 있던 오버 테크놀로지 기술을 민간 산업 전반에 공유하도록 유도하고 지원합니다. 키보토스의 선진 기술이 현지의 제조 산업에 접목되면, 기존의 상식을 뛰어넘는 비약적인 생산성 향상과 품질 혁신을 이룰 수 있을 것입니다. 미래의 기술이 현재의 산업을 혁명적으로 바꾸고, 우리를 기술 강국으로 이끌 것입니다."

ABY_focus_industry_20: "3교대 노동"
ABY_focus_industry_20_desc: "과도한 장시간 노동은 노동자의 피로를 누적시켜 생산성을 저하시키고 산업 재해를 유발합니다. 기존의 가혹한 2교대 근무제를 폐지하고, '8시간 근무, 8시간 휴식'이 보장되는 3교대 시스템을 전격 도입하십시오. 개선된 근로 환경은 노동자들의 사기를 높이고, 장기적으로는 더 안정적이고 정밀한 고품질의 생산 라인을 유지하는 비결이 될 것입니다. 24시간 돌아가는 공장은 노동자의 희생이 아닌, 합리적인 시스템으로 유지되어야 합니다."

ABY_focus_industry_21: "기업 독점"
ABY_focus_industry_21_desc: "국가 안보와 직결되거나 막대한 투자가 필요한 전략 산업 분야에서는 선두 기업의 독점적 지위를 인정해 줍니다. 과도한 내부 경쟁으로 인한 국력 낭비를 막고, 집중적인 육성을 통해 글로벌 시장에서 경쟁할 수 있는 국가대표 챔피언 기업을 만드십시오. 때로는 한 명의 천재 기업이 만 명의 국민을 먹여 살리는 법입니다. 효율성을 위해 공정성은 잠시 접어둘 수 있습니다."

ABY_focus_industry_22: "3대 기업 연구 협력"
ABY_focus_industry_22_desc: "네프티스, 로스차일드, 슈코다가 서로의 담장을 허물고 손을 잡게 하여 공동 연구 프로젝트를 진행하게 합니다. 키보토스의 기술, 유대 자본의 정보력, 체코 공업의 노하우가 결합된 이 드림팀의 협력은 상상 그 이상의 혁신적인 결과물을 만들어낼 것입니다. 이것은 단순한 기업 간 협력이 아닌, 시대를 앞서가는 거대한 도약이자 산업 혁명입니다."

### 자원 개발 중점
ABY_focus_building_1: "기반시설 복구"
ABY_focus_building_1_desc: "전쟁의 포화로 파괴되고 끊어진 도로, 철도, 교량을 최우선적으로 신속하게 복구하여 물류의 흐름을 뚫어야 합니다. 원활한 수송망 없이는 땅속의 자원도, 공장의 제품도, 전선의 병력도 제때 움직일 수 없습니다. 국가의 막힌 혈관을 다시 잇고 피가 돌게 하는 것이 모든 재건 사업의 첫걸음입니다. 길을 닦는 자가 부를 얻습니다."

ABY_focus_building_2: "보헤미아 철강"
ABY_focus_building_2_desc: "보헤미아의 풍부한 철광석 매장지를 대대적으로 개발하여 제철 산업의 원료를 100% 자급자족하는 것을 목표로 합니다. 수입에 의존하지 않고, 우리 땅속 깊은 곳에서 캐낸 붉은 돌들이 용광로를 거쳐 우리의 전차와 군함, 마천루가 될 것입니다. 대지의 뼈를 깎아 국가의 뼈대를 튼튼하게 세우십시오. 철은 국력입니다."

ABY_focus_building_3: "모라비아-비코비체 제철소"
ABY_focus_building_3_desc: "오스트리아-헝가리 제국 시절부터 명성을 떨쳐온 역사 깊은 비코비체 제철소를 확장하고 최신 제강 설비를 도입합니다. 용광로의 불길을 더 높이고 24시간 가동하여, 쏟아지는 쇳물로 강철의 제국을 건설하십시오. 이곳은 우리 산업의 심장이자, 전쟁을 승리로 이끌 무기를 만들어내는 불타는 엔진입니다. 멈추지 않는 용광로처럼 우리의 열정도 식지 않을 것입니다."

ABY_focus_building_4: "희귀 자원 개발"
ABY_focus_building_4_desc: "텅스텐, 크롬, 알루미늄 등 첨단 무기와 항공기 제작에 필수적인 전략 희귀 자원을 찾아내야 합니다. 국토 전역에 대한 정밀 지질 조사를 강화하고 새로운 광산을 개발하여, 해외 수입 의존도를 낮추고 자원 안보를 확립하십시오. 작고 빛나는 돌멩이 하나가 전차의 장갑을 뚫는 강력한 힘이 됩니다. 없는 자원도 찾아내는 집념이 필요합니다."

ABY_focus_building_5: "철강 생산 집중"
ABY_focus_building_5_desc: "국가의 모든 산업 역량과 자원을 철강 생산에 최우선적으로 집중합니다. 민간용 소비재 생산을 줄이고, 자동차 공장을 제철소 지원 시설로 전환하는 등 오직 국방과 중공업을 위한 강철 생산에 몰두하십시오. 지금 우리에게 필요한 것은 안락한 삶을 위한 버터가 아니라, 적을 막아낼 대포입니다. 강철만이 우리를 지켜줄 수 있습니다."

ABY_focus_building_6: "잘츠부르크 제강소"
ABY_focus_building_6_desc: "오스트리아 잘츠부르크 지역에 새로운 대규모 제강소를 건설하여 철강 생산 능력을 분산하고 확대합니다. 알프스산맥의 풍부한 수력을 이용한 청정하고 효율적인 제철 공정을 확립하여 에너지 비용을 절감하십시오. 아름다운 산과 강이 주는 자연의 선물을 단단한 강철로 바꾸는 것입니다. 자연과 산업의 조화를 이루십시오."

ABY_focus_building_7: "주데텐란트 강철"
ABY_focus_building_7_desc: "아비도스의 본거지가 위치한 주데텐란트 지역의 폐광된 광산과 제철 시설을 정비하여 재가동합니다. 가장 가까운 곳에서 생산된 강철이 가장 빠르게 공장과 전선으로 투입될 수 있도록 안정적인 자원 수급 체계를 구축하십시오. 우리의 앞마당을 자급자족이 가능한 강철의 요새로 만드십시오. 등잔 밑이 어두운 법, 가까운 곳의 자원을 놓치지 마십시오."

ABY_focus_building_8: "마트첸 유전 개발"
ABY_focus_building_8_desc: "오스트리아 마트첸 지역에서 발견된 유전을 본격적으로 개발하여 귀중한 석유 자원을 확보합니다. 기계화 부대와 항공기를 움직일 검은 황금을 우리 손으로 직접 퍼 올리는 것은 전략적으로 매우 중요합니다. 한 방울의 석유가 피 한 방울의 가치를 가집니다. 대지의 피를 뽑아 우리의 기계 심장에 주입하여 승리의 동력으로 삼으십시오."

### 연구 중점
ABY_focus_research_1: "현지 기술 협력"
ABY_focus_research_1_desc: "키보토스의 오버 테크놀로지만이 만능은 아닙니다. 수백 년간 쌓아온 체코와 오스트리아의 정교한 기계 공학 기술과 현지 공학자들의 노하우를 존중하고 협력하십시오. 두 세계의 지식이 합쳐지고 서로의 단점을 보완할 때, 기술적 시너지는 배가 될 것입니다. 융합이야말로 진정한 혁신의 지름길입니다. 우리는 두 세계의 장점만을 취할 것입니다."

ABY_focus_research_2: "드론의 군사적 이용"
ABY_focus_research_2_desc: "정찰 및 소규모 정밀 타격용 드론을 독자적으로 개발하여 전장에 투입합니다. 인간 병사가 갈 수 없는 위험한 곳을 정찰하고, 인간이 할 수 없는 정밀한 자살 공격을 수행하는 드론은 미래전의 핵심 전력입니다. 작고 눈에 띄지 않는 벌새가 거인을 쓰러뜨리는 눈과 독침이 되어줄 것입니다. 기술의 진보가 전장의 양상을 바꿉니다."

ABY_focus_research_3: "기초 헬리콥터 역설계"
ABY_focus_research_3_desc: "키보토스에서 가져온 헬리콥터는 수량이 한정되어 있어 소모품처럼 쓸 수 없습니다. 이를 분해하고 정밀 분석하여, 현지의 공업 수준으로 양산할 수 있는 기초적인 설계를 역산해내야 합니다. 비록 원본의 압도적인 성능을 완벽히 따라갈 순 없더라도, 우리 손으로 만든 수많은 회전익기는 전장에 새로운 바람을 불러일으킬 것입니다. 모방에서 시작하여 창조로 나아가십시오."

ABY_focus_research_4: "특수부대 드론 운용"
ABY_focus_research_4_desc: "최정예 특수부대원들에게 개인 휴대용 소형 드론을 보급하여 작전 능력을 극대화합니다. 벽 너머의 적을 보고, 코너 뒤의 함정을 살피는 능력은 대원들의 생존율과 임무 성공률을 비약적으로 높여줄 것입니다. 보이지 않는 곳에서 적을 감시하는 눈이 우리를 승리로 이끕니다. 정보 우위는 소규모 부대 전술의 핵심입니다."

ABY_focus_research_5: "키보토스 헬리콥터 도입"
ABY_focus_research_5_desc: "네프티스 그룹이나 패퇴한 카이저의 잔재로부터 오리지널 키보토스제 고성능 헬리콥터 설계도와 핵심 부품을 확보합니다. 현지 기술로는 흉내 낼 수 없는 기동성과 무장을 갖춘 이 기체들은 제공권을 장악하고 적 지상군을 유린하는 열쇠가 될 것입니다. 우리가 이해할 수 없는 기술이라도, 쓸 수만 있다면 최고의 무기입니다. 진정한 오버테크놀로지의 힘을 보여주십시오."

ABY_focus_research_6: "보병장비 개량"
ABY_focus_research_6_desc: "병사들의 생존과 직결되는 개인 화기, 방탄복, 통신 장비 등 군장을 최신 기술로 개량하고 경량화합니다. 더 가볍고, 더 튼튼하며, 더 강력한 장비는 병사들의 피로도를 줄이고 전투 효율을 향상시킬 것입니다. 장비의 작은 차이가 병사의 생사를 가르고, 나아가 전투의 승패를 결정합니다. 병사들에게 최고의 것을 쥐여주십시오."

ABY_focus_research_7: "기동헬기부대 편성"
ABY_focus_research_7_desc: "다수의 수송 헬리콥터를 이용한 공중 강습 부대를 창설합니다. 산맥과 강 같은 지형의 제약을 뛰어넘어 적의 후방을 타격하고, 주요 거점을 전격적으로 점령하는 '공중 기병대'는 현대전의 꽃입니다. 바그너의 음악을 울리며 하늘에서 내려와 적을 심판하는 발퀴레처럼, 적들이 예상치 못한 곳에서 공포를 선사하십시오."

ABY_focus_research_8: "키보토스 기술 연구 확대"
ABY_focus_research_8_desc: "신비 에너지, 광학 병기, 에너지 실드 등 키보토스의 첨단 기술을 본격적으로 연구하고 군사적 적용을 시도합니다. 현재의 과학으로는 이해할 수 없는 원리를 규명하고 무기화하여 압도적인 기술적 우위를 점하십시오. 상상 속의 마법과도 같은 기술이 우리의 현실이 되어 적들을 태워버릴 것입니다. 미래를 먼저 손에 넣는 자가 승리합니다."

### 지속 중점 (총력전)
ABY_continuous_focus_political: "총력전: 중앙집권 강화"
ABY_continuous_focus_political_desc: "국가의 존망이 걸린 전시 상황에서는 강력하고 일관된 리더십이 필요합니다. 지방 정부와 의회의 권한을 한시적으로 축소하고, 모든 권력을 중앙 정부와 전시 내각으로 집중시켜 신속한 의사결정 체계를 확립하십시오. 민주적인 절차보다는 효율적인 생존이 우선입니다. 하나의 머리, 하나의 명령만이 혼란을 잠재우고 위기를 극복할 수 있습니다."

ABY_continuous_focus_command: "총력전: 군사장비 생산"
ABY_continuous_focus_command_desc: "국가의 모든 가용 산업 시설을 군수 물자 생산에 올인합니다. 소비재 생산을 중단하고 민간 공장을 군수 공장으로 전환하여, 품질 관리보다는 수량을 우선시해 전선에 끊임없이 무기를 공급하십시오. 병사들의 손에 들려줄 총 한 자루가 더 급합니다. 질도 중요하지만, 지금은 적을 압도할 수 있는 물량이 필요한 시점입니다."

ABY_continuous_focus_mobilization: "총력전: 국민개병제"
ABY_continuous_focus_mobilization_desc: "남녀노소를 불문하고 총을 들 수 있는 모든 이를 징집하여 예비 전력을 확충합니다. 국가의 위기 앞에서는 누구도 예외가 될 수 없습니다. 전방의 군인뿐만 아니라 후방의 시민들도 모두 잠재적인 전사입니다. 최후의 한 사람까지 조국을 위해 싸울 것입니다. 우리의 모든 국민이 곧 군인이며, 국토 전체가 요새입니다."

ABY_continuous_focus_war: "총력전: 해방 전쟁"
ABY_continuous_focus_war_desc: "우리의 목표는 단순한 승리가 아니라, 적에게 빼앗긴 잃어버린 모든 것을 되찾는 것입니다. 적을 우리의 신성한 영토에서 완전히 몰아내고, 억압받는 동포들이 진정한 해방을 맞이할 때까지 진격을 멈추지 마십시오. 타협은 없습니다. 이 전쟁은 우리의 자유와 존엄을 위한 성전이며, 승리 아니면 죽음뿐입니다."

### 초기 통합 및 정치 개혁
BA_EU_focus_1: "유로-키보토스 공동체"
BA_EU_focus_1_desc: "대전이(The Great Transition)가 남긴 혼란과 파괴의 잿더미 위에서, 우리는 생존을 위한 새로운 길을 모색해야 합니다. 구시대의 낡은 국경과 무너진 정부 시스템으로는 이 초유의 사태를 수습할 수 없습니다. 유럽 각국의 지도자들과 키보토스 학원의 대표들이 한자리에 모여, 두 세계의 운명을 하나로 묶는 '유로-키보토스 공동체'의 창설을 엄숙히 선언합니다. 이것은 단순한 국가 간의 조약을 넘어, 인류와 신비가 공존하는 새로운 문명을 건설하기 위한 역사상 전례 없는 거대한 실험이자, 우리 모두의 생존을 위한 유일한 희망의 등대입니다."

BA_EU_focus_2: "진상규명위원회"
BA_EU_focus_2_desc: "두 세계가 충돌하고 융합하는 과정에서 발생한 수많은 비극적인 사건들, 의문의 실종, 그리고 자행된 학살의 진실은 여전히 어둠 속에 묻혀 있습니다. 우리는 성역 없는 조사를 수행할 독립적인 진상규명위원회를 발족하여, 묻혀 있는 진실을 낱낱이 파헤쳐야 합니다. 억울하게 희생된 이들의 원혼을 달래고 유가족들의 눈물을 닦아주지 않는다면, 우리는 결코 불신의 시대를 끝내고 화합의 미래로 나아갈 수 없을 것입니다. 과거의 상처를 직시하는 용기만이 진정한 치유를 가져옵니다."

BA_EU_focus_3: "전범재판위원회"
BA_EU_focus_3_desc: "혼란을 틈타 무고한 시민들을 유린하고 전쟁의 광기에 편승하여 반인륜적 범죄를 저지른 자들은 결코 용서받을 수 없습니다. 나치 잔당뿐만 아니라, 대전이의 혼란 속에서 학살과 약탈을 자행한 모든 범죄자를 단죄하기 위해 특별 전범재판위원회를 설치합니다. 지위 고하를 막론하고 범죄의 증거가 있는 자는 누구든 법의 심판대에 세워질 것이며, 정의의 칼날은 무자비하게 그들의 죄를 물을 것입니다. 이것은 야만의 시대를 끝내고 법치의 시대를 여는 첫 번째 선언입니다."

BA_EU_focus_4: "궐석 재판"
BA_EU_focus_4_desc: "정의의 실현에 있어 피고인의 부재가 면죄부가 될 수는 없습니다. 국경을 넘어 도주하거나 혼란을 틈타 신분을 세탁하고 숨어버린 전범들이라 할지라도, 법의 심판을 피할 수는 없을 것입니다. 우리는 궐석 재판을 통해서라도 확보된 증거와 생존자들의 증언을 바탕으로 그들의 죄상을 만천하에 공개하고 역사적인 판결을 내릴 것입니다. 그들이 어디에 숨어 있든, 그들은 영원히 '전범'이라는 낙인과 함께 쫓기는 신세가 될 것임을 분명히 해야 합니다. 정의는 지연되어서도, 멈추어서도 안 됩니다."

BA_EU_focus_5: "유럽 정상회의"
BA_EU_focus_5_desc: "유럽 대륙의 운명을 결정짓기 위해 각국의 정상들과 주요 학원 자치구의 대표들이 한자리에 모이는 역사적인 회의를 소집합니다. 서로 다른 이해관계와 정치적 입장이 첨예하게 대립하는 난상토론이 예상되지만, 우리는 대화와 타협을 통해 '하나 된 유럽'이라는 거대한 대의를 향해 나아가야 합니다. 이 회의장은 분열된 과거를 봉합하고 공동의 미래를 설계하는 산실이 될 것이며, 이곳에서 결정된 사항들은 새로운 질서의 초석이 될 것입니다."

BA_EU_focus_6: "정치적 상호협력"
BA_EU_focus_6_desc: "오랜 역사 속에서 형성된 각국의 정치 체제와 이념, 그리고 키보토스의 독특한 학원 자치 시스템의 차이를 인정하되, 생존과 번영이라는 공통의 목표 아래 긴밀한 협력 체계를 구축해야 합니다. 정기적인 고위급 회담과 실무자 교류 프로그램을 정례화하여 상호 이해를 높이고 신뢰를 쌓아나감으로써, 불필요한 외교적 마찰과 오해를 줄여나갈 것입니다. 다름을 인정하는 바탕 위에서 피어나는 협력이야말로 가장 단단한 결속력을 가집니다."

BA_EU_focus_7: "비공식 회담 조직"
BA_EU_focus_7_desc: "딱딱한 의전과 공식적인 외교 채널만으로는 해결하기 어려운 민감하고 복잡한 사안들을 논의하기 위해, 지도자들 간의 비공식 대화 창구를 마련합니다. 격식 없는 만남과 허심탄회한 대화 속에서 오가는 솔직한 의견 교환은 때로는 꽉 막힌 정국을 뚫고 실질적인 해결책을 찾아내는 열쇠가 될 수 있습니다. 물밑에서 이루어지는 이러한 소통의 노력들이야말로 거대한 연합을 유연하게 움직이는 윤활유가 될 것입니다."

BA_EU_focus_8: "초국가적 정당 연합 결성"
BA_EU_focus_8_desc: "개별 국가의 좁은 이익을 넘어 범유럽적 차원에서 정책을 논의하고 비전을 공유하기 위해, 국경을 초월하여 비슷한 이념을 가진 정당들이 연합체를 구성하도록 장려합니다. 이는 단순한 정당 간의 제휴를 넘어, 유럽 의회 내에서 초국가적인 정치 세력을 형성하고 범유럽적 아젠다를 주도하는 기반이 될 것입니다. 민족과 국가가 아닌 가치와 이념으로 뭉친 정당 연합은 유럽 정치 통합의 강력한 엔진이 될 것입니다."

BA_EU_focus_9: "유럽의회 조직"
BA_EU_focus_9_desc: "유럽의 모든 시민과 학생들의 정치적 의사를 대변할 최고 입법 기구로서 '유럽 의회'를 구성합니다. 각국과 자치구에서 민주적인 절차로 선출된 의원들이 한자리에 모여 치열하게 토론하고 연합의 법안을 의결하는 이 민주주의의 전당은, 우리 공동체의 정당성을 확보하는 가장 강력한 무기가 될 것입니다. 총칼이 아닌 투표와 토론으로 미래를 결정하는 이 시스템이야말로 우리가 지켜야 할 최고의 가치입니다."

BA_EU_focus_10: "유럽이사회 조직"
BA_EU_focus_10_desc: "각 회원국의 정부 수반들로 구성된 '유럽 이사회'를 설치하여 연합의 주요 정책 방향과 전략적 우선순위를 결정합니다. 이사회는 유럽 연합의 최고 의사 결정 기구로서, 회원국 간의 복잡한 이해관계를 조율하고 위기 상황에서 신속하고 강력한 리더십을 발휘할 것입니다. 각국의 주권을 존중하면서도 하나의 목소리를 낼 수 있도록 이끄는 이사회의 지혜가 그 어느 때보다 절실합니다."

BA_EU_focus_11: "의석 배정"
BA_EU_focus_11_desc: "유럽 의회의 의석을 배정하는 문제는 연합의 민주적 정당성을 좌우하는 매우 민감하고 중요한 과제입니다. 단순한 인구 비례뿐만 아니라, 소국의 이익을 보호하고 현지인과 키보토스인 사이의 정치적 균형을 맞추는 복잡한 방정식을 풀어내야 합니다. 어느 한쪽도 소외감을 느끼지 않도록 공정하고 합리적인 배분 원칙을 수립하여, 모든 구성원이 납득할 수 있는 대의 민주주의 시스템을 구축해야 합니다."

BA_EU_focus_12: "초국가적 권한 부여"
BA_EU_focus_12_desc: "유럽 연합이 이름뿐인 국가 연합을 넘어 실질적인 힘을 가진 통합 기구로 기능하기 위해서는, 회원국들이 가진 주권의 일부를 과감하게 연합에 이양해야 합니다. 외교, 국방, 통화 등 핵심 분야에서의 결정권을 중앙 기구에 위임하는 것은 고통스러운 결단이겠지만, 더 큰 번영과 확고한 안보를 위해서는 피할 수 없는 선택입니다. 개별 국가의 작은 주권을 양보하여 유럽 전체의 거대한 주권을 확립하십시오."

BA_EU_focus_13: "전범위적 출마권"
BA_EU_focus_13_desc: "유럽 시민이라면 누구나 자신이 거주하는 국가나 자치구에 상관없이 유럽 의회 선거에 출마할 수 있는 피선거권을 보장합니다. 국적의 벽을 허무는 이 혁신적인 조치는, 특정 국가의 이익이 아닌 유럽 전체의 이익을 대변하는 진정한 의미의 '범유럽 정치인'을 탄생시킬 것입니다. 출신이 아닌 능력과 비전으로 평가받는 정치 풍토는 유럽의 통합을 가속화할 것입니다."

BA_EU_focus_14: "정기회의 개최"
BA_EU_focus_14_desc: "유럽 의회와 이사회의 회의를 정례화하여 예측 가능하고 안정적인 정치 시스템을 구축합니다. 정해진 일정에 따라 규칙적으로 이루어지는 만남과 토론은 회원국 간의 소통을 원활하게 하고 결속력을 강화하며, 연합의 정책이 흔들림 없이 추진되도록 담보할 것입니다. 시스템에 의한 통치는 불확실성을 제거하고 연합의 지속 가능성을 보장하는 가장 확실한 방법입니다."

BA_EU_focus_15: "전범위적 투표권"
BA_EU_focus_15_desc: "모든 유럽 시민에게 자신의 국적과 상관없이 현재 거주하고 있는 지역에서 투표할 수 있는 권리를 부여합니다. 국경을 넘어 자유롭게 이동하며 일하고 생활하는 노동자와 이민자들도, 연합의 당당한 구성원으로서 자신의 삶에 영향을 미치는 정책 결정에 참여할 수 있어야 합니다. 참정권의 확대는 민주주의의 뿌리를 더욱 깊고 넓게 내리게 할 것입니다."

BA_EU_focus_16: "유럽 총선"
BA_EU_focus_16_desc: "오랜 준비 끝에 마침내 유럽 전역에서 동시에 실시되는 역사적인 첫 번째 총선을 거행합니다. 수억 명의 유권자가 투표소로 향하는 이 거대한 민주주의의 축제는, 우리가 더 이상 분열된 국가들의 집합이 아니라 '하나 된 유럽의 시민'임을 전 세계에 선포하는 순간이 될 것입니다. 우리의 손으로 뽑은 대표들이 유럽의 미래를 결정한다는 사실은 우리에게 긍지와 희망을 안겨줄 것입니다."

### 경제 및 노동 개혁
BA_EU_focus_17: "키보토스 화폐제도 모방"
BA_EU_focus_17_desc: "키보토스의 선진적인 금융 시스템과 고도화된 화폐 관리 제도를 벤치마킹하여, 전후 피폐해진 유럽 경제의 체질을 근본적으로 개선합니다. 디지털 결제 시스템, 투명한 자금 흐름 추적, 그리고 효율적인 통화 관리 기법의 도입은 낡고 비효율적인 유럽의 금융 혈관에 새로운 활력을 불어넣을 것입니다. 기술과 금융의 결합은 우리 경제를 한 단계 도약시킬 것입니다."

BA_EU_focus_18: "키보토스 노동법 도입"
BA_EU_focus_18_desc: "학생들의 권익과 자율성을 중시하는 키보토스의 선진적인 노동 윤리와 법규를 참고하여, 유럽의 전근대적이고 낙후된 노동 환경을 대대적으로 개선합니다. 노동자를 단순한 부품이 아닌 존중받아야 할 인격체로 대우하고, 인권과 복지를 강화하는 것은 생산성 향상과 사회적 대타협을 위한 필수 조건입니다. 행복한 노동자가 만드는 제품이 최고의 경쟁력을 가집니다."

BA_EU_focus_19: "중앙은행"
BA_EU_focus_19_desc: "유럽 연합 전체의 통화 정책을 총괄하고 금융 시장을 감독할 독립적인 '유럽 중앙은행(ECB)'을 설립합니다. 물가 안정을 유지하고 회원국 간의 경제 격차를 해소하며, 위기 상황에서 유로화의 가치를 수호하는 이 금융의 사령탑은 유럽 경제의 안정을 지키는 최후의 보루가 될 것입니다. 통화 주권의 통합은 경제 통합의 완성을 의미합니다."

BA_EU_focus_20: "유로엔화 발의"
BA_EU_focus_20_desc: "유럽의 거대한 경제 규모와 키보토스의 압도적인 기술력을 결합한 새로운 단일 기축 통화, '유로-엔'의 도입을 추진합니다. 이 강력하고 신뢰성 있는 통화는 달러 패권에 도전하며, 전 세계 자본의 흐름을 유럽으로 돌려놓을 것입니다. 화폐는 단순한 교환 수단이 아니라 국력의 상징이며, 유로-엔은 우리의 부활을 알리는 신호탄이 될 것입니다."

BA_EU_focus_21: "유럽 철강-석탄 공동체"
BA_EU_focus_21_desc: "전쟁 수행에 필수적인 전략 물자인 철강과 석탄을 초국가적 기구가 공동 관리함으로써, 회원국 간의 전쟁 가능성을 원천적으로 봉쇄하고 산업 발전의 토대를 마련합니다. 과거 서로에게 총부리를 겨누게 했던 자원들이 이제는 평화와 번영을 위한 공동의 자산이 될 것입니다. 이것은 단순한 경제 협력을 넘어, 영구적인 평화를 위한 가장 확실한 보증수표입니다."

BA_EU_focus_22: "관세장벽 제거"
BA_EU_focus_22_desc: "회원국 간의 무역을 가로막고 경제 효율을 떨어뜨리던 모든 관세와 비관세 장벽을 과감하게 철폐하여 거대한 단일 시장을 형성합니다. 국경 없는 자유로운 물자의 이동은 기업들의 경쟁력을 높이고, 소비자들에게는 더 저렴하고 다양한 상품을 제공할 것입니다. 시장의 통합은 유럽 경제의 파이를 키우는 가장 확실한 방법입니다."

BA_EU_focus_23: "화폐개혁 단행"
BA_EU_focus_23_desc: "인플레이션으로 가치를 상실한 구시대의 복잡하고 비효율적인 화폐들을 정리하고, 새로운 단일 통화로의 강제적인 전환을 단행합니다. 초기에는 혼란과 반발이 있겠지만, 통일된 화폐 시스템은 거래 비용을 절감하고 투자를 촉진하며, 궁극적으로 유럽 경제를 하나로 묶는 강력한 접착제가 될 것입니다. 뼈를 깎는 고통 없이는 새 살이 돋아나지 않습니다."

BA_EU_focus_24: "공동생산, 공동소비"
BA_EU_focus_24_desc: "국가 간의 불필요한 중복 투자를 피하고 규모의 경제를 실현하기 위해, 산업별로 특화된 분업 체계를 구축합니다. 각국이 가장 잘할 수 있는 분야에 집중하여 최고의 제품을 생산하고, 그 결과물을 단일 시장에서 공유함으로써 유럽 전체의 부를 증대시킬 것입니다. 경쟁보다는 협력을, 독점보다는 공유를 통해 우리는 더 풍요로운 미래를 만들 수 있습니다."

BA_EU_focus_25: "국경 개방"
BA_EU_focus_25_desc: "솅겐 조약의 정신을 계승하고 발전시켜, 회원국 간의 모든 국경 검문소와 장벽을 철거합니다. 여권이나 비자 없이 자유롭게 여행하고, 일하고, 공부할 수 있는 권리는 유럽 시민들이 누릴 수 있는 가장 크고 실질적인 혜택 중 하나가 될 것입니다. 물리적인 국경이 사라진 곳에서 사람과 아이디어는 자유롭게 흐르며 혁신을 만들어낼 것입니다."

BA_EU_focus_26: "유럽 금융"
BA_EU_focus_26_desc: "런던, 프랑크푸르트, 파리, 그리고 자치구의 금융 허브를 잇는 거대한 단일 금융 네트워크를 구축하여 자본의 흐름을 막힘없이 원활하게 합니다. 통합된 유럽 금융 시장은 기업들에게 더 많은 투자 기회를 제공하고, 스타트업에게는 성장의 발판을 마련해주며, 유럽 경제 성장의 강력한 엔진으로 작동할 것입니다. 돈이 도는 곳에 기회가 생깁니다."

BA_EU_focus_27: "자원개발공동체"
BA_EU_focus_27_desc: "에너지 안보를 확보하고 외부 의존도를 낮추기 위해, 대륙 내의 모든 천연자원 개발을 공동으로 추진합니다. 북해의 유전부터 동유럽의 희토류 광산까지, 유럽의 땅과 바다에 묻힌 모든 자원은 특정 국가의 소유가 아닌 연합 전체의 공동 자산으로서 체계적으로 관리될 것입니다. 자원의 무기화를 막고 안정적인 공급망을 구축하십시오."

BA_EU_focus_28: "통일된 유럽 경제"
BA_EU_focus_28_desc: "마침내 재정, 통화, 무역, 산업 정책이 하나로 통합된 완전한 형태의 경제 연합을 달성합니다. 거대한 내수 시장과 강력한 구매력, 그리고 첨단 기술력을 바탕으로, 유럽은 주변부로 밀려났던 과거를 뒤로하고 세계 경제의 중심축으로 다시금 우뚝 설 것입니다. 우리의 경제력은 그 어떤 군사력보다 강력한 영향력을 발휘할 것입니다."

BA_EU_focus_29: "회계검사원"
BA_EU_focus_29_desc: "연합의 막대한 예산이 투명하고 효율적으로 집행되는지 감시할 강력하고 독립적인 회계 검사 기구를 설치합니다. 단 1유로의 세금도 낭비되거나 횡령되지 않도록 철저히 감시하고, 부정 사용이 적발될 경우 엄중히 책임을 물어야 합니다. 깨끗한 재정 운영만이 시민들의 신뢰를 얻고 연합의 정당성을 유지하는 길입니다."

BA_EU_focus_30: "공동예산 분배"
BA_EU_focus_30_desc: "부유한 국가가 출연한 기금으로 경제적으로 뒤처진 국가나 지역을 돕는 강력한 재정 조정 제도를 도입하여 지역 간 불균형을 해소합니다. 이는 단순한 원조가 아니라, 유럽 전체의 균형 발전과 결속력을 다지기 위한 투자입니다. 연대의 정신에 입각한 공정한 예산 분배는 유럽 연합을 지탱하는 가장 중요한 도덕적 기둥입니다."

BA_EU_focus_31: "예산 검열"
BA_EU_focus_31_desc: "무분별한 포퓰리즘 정책이나 방만한 재정 운영으로 인한 국가 부도 위기를 막기 위해, 연합 차원에서 각국 정부의 예산안을 사전에 검토하고 수정 권고를 내릴 수 있는 권한을 가집니다. 재정 건전성은 연합 전체의 경제적 안정을 위해 결코 타협할 수 없는 원칙이며, 한 국가의 실패가 도미노처럼 번지는 것을 막아야 합니다."

BA_EU_focus_32: "자원 공유"
BA_EU_focus_32_desc: "전쟁, 재난, 전염병 등 위기 상황 발생 시 식량, 에너지, 의약품 등 필수 생존 자원을 회원국끼리 우선적으로 공유하는 비상 대응 시스템을 구축합니다. 우리는 기쁨뿐만 아니라 고통과 위기도 함께 나누고 극복하는 운명 공동체입니다. 어려울 때 돕는 친구가 진정한 친구이듯, 위기 속에서 우리의 연대는 더욱 빛날 것입니다."

BA_EU_focus_33: "계획경제 도입"
BA_EU_focus_33_desc: "전후의 신속한 복구와 급격한 산업화를 달성하기 위해, 자유 시장 경제를 기본으로 하되 한시적으로 범유럽 차원의 계획 경제 요소를 도입합니다. 시장의 실패를 보완하고, 국가 전략 산업을 집중 육성하며, 자원을 효율적으로 배분하기 위한 정부의 적극적이고 전략적인 개입이 필요합니다. 보이지 않는 손보다 보이는 손이 더 필요할 때가 있습니다."

BA_EU_focus_34: "초국가적 감사권 부여"
BA_EU_focus_34_desc: "회원국의 공공 기관과 연합의 지원을 받는 기업에 대해, 연합 감사 기구가 직접 현장 감사를 실시할 수 있는 강력한 권한을 부여합니다. 국경과 성역을 가리지 않는 철저한 감사는 부패의 사슬을 끊어내고 행정의 투명성을 높이는 가장 확실한 수단이 될 것입니다. 부패한 곳에는 통합의 꽃이 피지 않습니다."

BA_EU_focus_35: "공단 확대"
BA_EU_focus_35_desc: "국경 지대나 낙후된 지역에 대규모 다국적 산업 단지를 조성하여 경제 협력의 성공 모델을 만듭니다. 서로 다른 국적의 노동자와 기술자들이 함께 땀 흘려 일하며 제품을 생산하는 공장은, 경제적 이익을 넘어 민족 간의 화합과 통합을 상징하는 공간이 될 것입니다. 함께 일하는 사람들은 서로에게 총을 겨누지 않습니다."

BA_EU_focus_36: "공동발전계획"
BA_EU_focus_36_desc: "상대적으로 낙후된 동유럽이나 남유럽 지역을 개발하고, 유럽 전역의 사회 기반 시설을 상향 평준화하기 위한 장기적인 공동 발전 계획을 수립합니다. 모든 유럽 시민이 대륙 어디에 살든 균등한 기회와 높은 삶의 질을 누릴 수 있도록 하는 것이 우리의 최종 목표입니다. 번영의 혜택은 특정 국가의 전유물이 되어서는 안 됩니다."

BA_EU_focus_37: "감사관 파견"
BA_EU_focus_37_desc: "유럽 연합의 예산이 투입되는 주요 프로젝트 현장과 각국의 행정 기관에 연합 소속의 감사관을 상주시킵니다. 서류상의 보고가 아닌 현장의 생생한 목소리를 듣고, 비효율이나 비리 문제를 즉각적으로 포착하여 시정하는 현장 밀착형 감시 체계를 가동합니다. 눈앞에서 지켜보는 감시자가 있을 때, 행정은 더욱 정직해집니다."

BA_EU_focus_38: "유럽 경제권"
BA_EU_focus_38_desc: "유럽 연합 회원국을 넘어 지중해 연안, 북아프리카, 중동 등 주변국들까지 포괄하는 거대한 광역 경제 블록을 형성합니다. 자유 무역 협정과 기술 제휴를 통해 유럽의 경제 영토를 확장하고, 지정학적 영향력을 넓혀 나갈 것입니다. 우리의 시장은 대륙에 갇혀 있지 않으며, 세계를 향해 열려 있습니다."

BA_EU_focus_39: "노동당국"
BA_EU_focus_39_desc: "유럽 전역의 노동 시장을 통합 관리하고 고용 정책을 조율할 '유럽 노동 당국'을 신설합니다. 국경을 넘는 노동자들의 권리 보호, 실업 문제 해결, 그리고 미래 산업에 맞는 양질의 일자리 창출은 연합의 최우선 과제 중 하나입니다. 노동은 상품이 아니며, 노동자는 우리 경제의 주역입니다."

BA_EU_focus_40: "공업 기계화"
BA_EU_focus_40_desc: "키보토스의 발전된 자동화 기술과 로봇 공학을 산업 현장에 적극 도입하여 공장의 생산성을 획기적으로 높입니다. 위험하고 힘든 단순 반복 노동은 기계에게 맡기고, 인간은 더 창의적이고 가치 있는 일에 집중하게 될 것입니다. 기술 혁신을 통한 생산성 향상은 노동 시간 단축과 삶의 질 개선을 위한 물적 토대가 됩니다."

BA_EU_focus_41: "8시간 노동"
BA_EU_focus_41_desc: "노동자의 건강과 인간다운 삶을 보장하기 위해 '8시간 노동, 8시간 휴식, 8시간 수면'이라는 역사적인 원칙을 법적으로 확립하고 엄격히 적용합니다. 이윤을 위해 인간을 소모품처럼 갈아 넣는 과로사는 이제 역사 속으로 사라져야 할 야만의 흔적입니다. 휴식이 있는 삶이 더 높은 효율을 만듭니다."

BA_EU_focus_42: "고용노동국"
BA_EU_focus_42_desc: "실직한 노동자들의 직업 훈련과 재취업을 체계적으로 지원하고, 차별 없는 공정한 채용 문화를 정착시키기 위해 고용 노동국을 확대 개편합니다. 일하고 싶은 의지가 있는 사람은 누구나 자신의 능력에 맞는 일자리를 찾을 수 있는 사회, 실패하더라도 다시 일어설 기회를 주는 사회를 만들겠습니다."

BA_EU_focus_43: "산업안전수칙"
BA_EU_focus_43_desc: "위험한 작업 환경을 획기적으로 개선하고, 위반 시 강력한 처벌이 따르는 엄격한 산업 안전 수칙을 제정하여 산업 재해를 제로화합니다. 노동자의 생명과 안전은 그 어떤 기업의 이익이나 경제적 성과보다 우선하는 절대적인 가치입니다. 안전하지 않은 일터에서는 그 어떤 작업도 이루어져서는 안 됩니다."

BA_EU_focus_44: "주5일제"
BA_EU_focus_44_desc: "노동자들에게 충분한 여가 시간과 가족과 함께할 시간을 보장하기 위해, 주 5일 근무제를 전 산업 분야에 도입합니다. 충분한 휴식과 일과 삶의 균형(워라밸)은 노동 생산성을 높일 뿐만 아니라, 여가 산업 발전과 내수 소비를 진작시키는 경제 선순환의 핵심 고리가 될 것입니다."

BA_EU_focus_45: "노사협상 지원"
BA_EU_focus_45_desc: "노사 간의 갈등을 소모적인 대립이 아닌 생산적인 대화로 해결하고, 상생의 문화를 만들기 위해 전문적인 중재 기구를 운영합니다. 파업과 직장 폐쇄라는 극단적인 수단 대신, 대화와 타협을 통해 합리적인 합의점을 찾는 노사 관계의 안정은 지속 가능한 경제 발전의 필수 요소입니다."

BA_EU_focus_46: "상해지원금"
BA_EU_focus_46_desc: "산업 현장에서 업무 중 부상을 입거나 질병에 걸린 노동자에게 충분한 치료비와 생활비를 지원하는 사회 보장 제도를 대폭 강화합니다. 국가와 기업은 산업 역군인 노동자가 예기치 못한 사고로 쓰러졌을 때, 그들이 다시 건강하게 일터로 복귀할 때까지 책임지는 든든한 버팀목이 되어주어야 합니다."

BA_EU_focus_47: "노동조합 합법화"
BA_EU_focus_47_desc: "모든 노동자들의 단결권, 단체 교섭권, 단체 행동권을 헌법적 권리로 확실하게 보장합니다. 건강하고 민주적인 노동조합은 기업의 전횡을 견제하고, 노동자의 권익을 대변하며, 사회 정의를 실현하는 중요한 파트너입니다. 억압받는 노동자가 없는 사회가 진정으로 자유로운 사회입니다."

BA_EU_focus_48: "선진적 노동법"
BA_EU_focus_48_desc: "유럽과 키보토스의 장점을 결합한 세계 최고 수준의 노동자 보호 규정을 담은 '유럽 노동 헌장'을 제정합니다. 유럽은 기업하기 좋은 곳일 뿐만 아니라, 노동자가 가장 존중받고 행복하게 일할 수 있는 대륙이 될 것입니다. 우리의 노동 기준은 전 세계가 따라야 할 새로운 글로벌 스탠더드가 될 것입니다."

### 사회 및 문화 통합
BA_EU_focus_49: "연방구관할회의"
BA_EU_focus_49_desc: "유럽 각지에 흩어져 있는 연방 직할 구역들과 자치구들을 효율적으로 관리하고, 중앙과 지방, 그리고 지역 간의 갈등을 조정하기 위해 정기적인 관할 회의를 소집합니다. 이 회의는 중앙 정부의 일방적인 지시가 아닌, 지방 자치 단체들과의 끊임없는 소통과 협의를 통해 행정의 사각지대를 없애고 풀뿌리 민주주의를 실현하는 장이 될 것입니다."

BA_EU_focus_50: "문화재 복구"
BA_EU_focus_50_desc: "전쟁의 참화로 파괴되거나 약탈당해 흩어진 소중한 문화유산을 복원하고, 원래의 자리로 되찾아오는 사업을 대대적으로 추진합니다. 우리의 찬란한 문화유산은 단순한 옛 물건이 아니라, 유럽인의 정체성과 자부심을 지탱하는 뿌리입니다. 무너진 석조를 다시 쌓아 올리는 것은 우리의 긍지를 다시 세우는 일입니다."

BA_EU_focus_51: "문화적 특수성 인정"
BA_EU_focus_51_desc: "강압적이고 획일적인 통합 대신, 각 민족, 지역, 그리고 학원 자치구의 고유한 문화적 전통과 언어를 존중하고 장려합니다. 다양성은 분열의 씨앗이 아니라, 유럽 문화를 더욱 풍성하고 다채롭게 만드는 자양분입니다. 서로의 다름을 인정하고 즐길 때, 우리는 '다양성 속의 통합'이라는 진정한 유럽의 정신을 실현할 수 있습니다."

BA_EU_focus_52: "국경 조정"
BA_EU_focus_52_desc: "과거 제국주의 시대의 유산이나 전쟁의 결과로 그어진 불합리한 국경선을, 역사적 맥락과 현재의 민족 분포를 고려하여 평화적으로 재조정합니다. 지도 위에 억지로 그은 선이 만든 비극을 끝내고, 해당 지역 주민들의 민주적인 의사에 따른 합리적이고 자연스러운 경계를 확정함으로써 영구적인 평화의 토대를 마련해야 합니다."

BA_EU_focus_53: "탄약 몰수"
BA_EU_focus_53_desc: "대전이 이후 통제되지 않은 채 민간에 풀린 막대한 양의 탄약은 언제 터질지 모르는 시한폭탄과도 같습니다. 우리는 우발적인 무력 충돌과 범죄를 예방하기 위해, 민간이 보유한 과도한 탄약을 강제로 회수하고 폐기하는 강력한 조치를 취해야 합니다. 총알 없는 총은 몽둥이에 불과합니다. 사회 곳곳에 배어있는 화약 냄새를 지우고 평화의 공기를 채워야 합니다."

BA_EU_focus_54: "점조직 연결"
BA_EU_focus_54_desc: "점령 치하에서 지하 깊숙이 숨어 활동하던 레지스탕스와 자경단 조직들을 양지로 끌어올려, 합법적인 사회 단체나 예비군 조직으로 편입시킵니다. 그들이 암흑기 동안 보여준 불굴의 애국심과 끈끈한 조직력은 국가 재건을 위한 소중한 에너지입니다. 음지에서 싸우던 그들에게 이제 빛나는 훈장과 사회적 역할을 부여해야 합니다."

BA_EU_focus_55: "공권력 강화"
BA_EU_focus_55_desc: "전쟁과 혼란으로 무너진 법질서를 바로세우기 위해 경찰 인력을 대폭 증강하고, 첨단 장비와 과학 수사 기법을 도입하여 치안 시스템을 현대화합니다. 범죄와 폭력으로부터 시민들을 지켜내지 못하는 국가는 존재 가치가 없습니다. 공정한 법 집행을 통해 공권력의 떨어진 권위를 회복하는 것이야말로 시민들의 안전한 일상을 지키는 첫걸음입니다."

BA_EU_focus_56: "이주지원금"
BA_EU_focus_56_desc: "전쟁으로 삶의 터전을 잃은 난민들과 실향민들이 낯선 땅에서 새로운 희망을 싹틔울 수 있도록 주거비, 생활비, 직업 훈련 비용을 포함한 포괄적인 정착 지원금을 지급합니다. 그들이 소외된 이방인이 아니라 당당한 사회의 일원으로 설 수 있도록 돕는 것은 국가의 인도적 책무이자, 사회 통합을 위한 가장 확실한 투자입니다."

BA_EU_focus_57: "구간 통행권 보장"
BA_EU_focus_57_desc: "여전히 분쟁이 남아있는 지역이나 군사적 필요에 의해 통제되는 구역 내에서도, 민간인들의 안전하고 자유로운 이동을 보장하는 특별 통행권을 발급합니다. 흩어진 가족을 만나고 생업을 이어가는 평범한 일상은 어떤 비상 상황에서도 최대한 지켜져야 할 인권입니다. 길은 막혀 있어도 사람의 왕래는 끊어지지 않아야 합니다."

BA_EU_focus_58: "학원 내 자유선거 실시"
BA_EU_focus_58_desc: "소수의 강자가 지배하던 키보토스 학원 자치구 내에서도 투명하고 민주적인 절차에 따라 학생회 임원을 선출하도록 유도하고 감시합니다. 힘의 논리가 아닌 민주주의의 원칙은 예외 없이 모든 곳에 적용되어야 합니다. 학생들이 직접 뽑은 대표를 통해 자치를 실현하는 경험은 그들을 미래의 민주 시민으로 성장시킬 것입니다."

BA_EU_focus_59: "자유로운 통행"
BA_EU_focus_59_desc: "유럽 대륙 내에서 사람과 물자의 이동을 가로막던 모든 종류의 제한과 장벽을 완전히 철폐합니다. 여행의 자유는 인간의 기본권이며, 서로 다른 지역의 사람들이 자유롭게 오가며 문화를 교류하고 이해하는 것이야말로 진정한 통합으로 가는 가장 빠른 길입니다. 열린 길 위에서 유럽은 하나가 될 것입니다."

BA_EU_focus_60: "초국가적 자치구"
BA_EU_focus_60_desc: "특정 국가의 주권에 속하지 않고 유럽 연합이 직접 관할하는 특별 자치구를 지정하여 운영합니다. 이곳은 다민족, 다문화가 공존하고 키보토스의 신비와 유럽의 전통이 융합되는 초국가적 행정의 실험장이 될 것입니다. 미래의 유럽이 어떤 모습일지 미리 보여주는 모델 하우스와 같은 이 자치구는 혁신과 공존의 상징이 될 것입니다."

BA_EU_focus_61: "연방구 설치"
BA_EU_focus_61_desc: "유럽 연합의 입법, 행정, 사법 기관이 모여 수도 기능을 수행할 거대한 연방 행정 구역을 조성합니다. 브뤼셀, 스트라스부르, 혹은 제3의 도시가 새로운 유럽의 심장으로 다시 태어나, 전 대륙에 활력을 불어넣는 중추 신경망 역할을 하게 될 것입니다. 이곳은 단순한 도시가 아니라, 유럽의 꿈이 실현되는 공간입니다."

BA_EU_focus_62: "문화규율위원회"
BA_EU_focus_62_desc: "급격한 통합 과정에서 발생할 수 있는 문화적 충돌, 혐오 표현, 그리고 차별 행위를 감시하고 규제할 독립적인 위원회를 발족합니다. 표현의 자유를 존중하되, 타인의 존엄성을 짓밟는 행위는 용납하지 않는 관용과 존중의 문화를 정착시키기 위한 사회적 합의 기구입니다. 혐오를 넘어 공존의 언어를 만들어야 합니다."

BA_EU_focus_63: "자위조항 추가"
BA_EU_focus_63_desc: "공권력이 미처 닿지 못하는 위급한 상황에서, 시민들이 범죄나 생명의 위협으로부터 자신과 가족, 이웃을 지킬 수 있도록 정당방위의 인정 범위를 대폭 확대하는 법안을 마련합니다. 국가는 시민의 안전을 지켜야 할 의무가 있지만, 시민이 스스로를 지킬 수 있는 천부적인 권리 또한 존중하고 보장해야 합니다."

BA_EU_focus_64: "자치내각 결성"
BA_EU_focus_64_desc: "각 연방구와 자치구의 특수성을 반영한 맞춤형 행정을 위해, 해당 지역 주민들이 선출한 독자적인 내각 구성을 허용합니다. 중앙 정부의 획일적인 통제가 아닌, 지역의 실정을 가장 잘 아는 사람들이 스스로 지역의 문제를 해결하는 지방 분권은 민주주의의 풀뿌리를 튼튼하게 하는 거름이 될 것입니다."

### 치안 및 군사 통합
BA_EU_focus_65: "총기등록제"
BA_EU_focus_65_desc: "시중에 유통되는 모든 민간 소유 총기에 대한 등록을 의무화하여, 무기 관리의 사각지대를 없애고 총기 소유자의 책임을 강화합니다. 누가, 어떤 무기를, 어디에 가지고 있는지 국가가 정확히 파악하는 것은 치안 유지의 가장 기본입니다. 등록되지 않은 '유령 총기'는 범죄의 도구가 될 뿐입니다. 투명한 관리만이 총기 사고를 막을 수 있습니다."

BA_EU_focus_66: "구역 재편성"
BA_EU_focus_66_desc: "과거의 행정 구역에 얽매이지 않고, 실제 치안 수요와 인구 변화, 우범 지대의 분포를 과학적으로 분석하여 경찰 관할 구역을 합리적으로 재조정합니다. 효율적인 인력 배치는 범죄 대응 속도를 획기적으로 높이고, 치안 서비스의 질을 향상시켜 시민들의 만족도를 높일 것입니다. 범죄에는 국경이 없듯, 경찰의 대응에도 빈틈이 없어야 합니다."

BA_EU_focus_67: "자동화기 금지"
BA_EU_focus_67_desc: "짧은 시간에 대량 살상을 일으킬 수 있는 자동 소총, 기관단총, 기관총 등 군용 화기의 민간 소지를 전면 금지하고 즉각 회수합니다. 전쟁터에서나 쓰여야 할 살상 무기가 평화로운 거리에서 돌아다니는 것을 더 이상 방치할 수 없습니다. 시민의 안전을 위협하는 과도한 무장은 자유가 아니라 방종이며, 공포의 원인입니다."

BA_EU_focus_68: "검문절차 간소화"
BA_EU_focus_68_desc: "시민들에게 불필요한 위압감을 주고 이동을 지체시키는 과도한 검문검색을 줄이고, 최신 안면 인식 기술과 스캐닝 장비를 도입하여 보안 검색의 신속성과 정확성을 동시에 높입니다. 시민의 일상적인 불편을 최소화하면서도, 테러리스트나 범죄자의 이동을 효과적으로 차단하는 스마트한 보안 시스템을 구축해야 합니다. 자유와 안전은 양립할 수 있습니다."

BA_EU_focus_69: "비살상탄 개량"
BA_EU_focus_69_desc: "시위 진압이나 범인 검거 과정에서 발생할 수 있는 불필요한 인명 피해를 줄이기 위해, 고무탄, 테이저건, 음향 대포 등 고성능 비살상 제압 장비를 개발하고 보급합니다. 공권력은 시민을 보호하기 위해 존재해야지, 시민을 다치게 하거나 죽여서는 안 됩니다. 범죄자는 제압하되 생명은 존중하는 것이 선진 치안의 기준입니다."

BA_EU_focus_70: "국영 총포상 운용"
BA_EU_focus_70_desc: "이윤을 위해 무분별하게 총기를 판매하는 민간 총포상을 폐지하고, 국가가 직접 관리하는 국영 총포상을 통해서만 엄격한 심사를 거쳐 제한적으로 총기를 구매할 수 있게 합니다. 무기 유통의 전 과정을 국가가 투명하게 통제함으로써, 범죄자나 정신 질환자의 손에 총기가 들어가는 것을 원천 봉쇄하는 강력한 조치입니다."

BA_EU_focus_71: "군수산업체 보상"
BA_EU_focus_71_desc: "강력한 총기 규제 정책으로 인해 경제적 타격을 입게 될 군수 업체들에게 업종 전환 자금을 지원하거나, 군용 장비 납품 계약을 우선적으로 체결하여 손실을 보상해 줍니다. 이는 정책에 대한 산업계의 반발을 줄이고, 그들의 기술력과 생산 시설을 국방력 강화라는 공익적인 목적으로 전환하기 위한 전략적인 유인책입니다."

BA_EU_focus_72: "스마트 총기"
BA_EU_focus_72_desc: "지문이나 정맥 등 생체 정보가 등록된 정당한 사용자만이 발사할 수 있는 스마트 총기 기술 적용을 모든 신규 총기에 의무화합니다. 이를 통해 도난당하거나 분실된 총기가 범죄 조직에 의해 악용되거나, 아이들의 호기심으로 인한 오발 사고가 발생하는 것을 원천적으로 막을 수 있습니다. 기술이 안전을 지키는 훌륭한 사례가 될 것입니다."

BA_EU_focus_73: "총기소지제한구역"
BA_EU_focus_73_desc: "학교, 병원, 관공서, 종교 시설 등 시민들이 많이 모이는 주요 다중 이용 시설을 '건 프리 존(Gun-Free Zone)'으로 지정하여, 그 어떤 이유로도 총기 반입을 엄격히 금지합니다. 시민들이 총기 난사의 공포 없이 마음 놓고 생활하고 활동할 수 있는 안전지대를 늘려가는 것은 문명사회의 기본 조건입니다."

BA_EU_focus_74: "50개년 화기규제계획"
BA_EU_focus_74_desc: "수십 년간 퍼진 총기를 단기간에 없애는 것은 불가능합니다. 반세기에 걸친 장기적이고 단계적인 계획을 수립하여, 점진적으로 민간 보유 총기를 줄여나가고 총기 문화를 변화시켜, 궁극적으로는 '무기 없는 평화로운 사회'를 만들겠습니다. 우리 세대가 시작하고 다음 세대가 완성할 이 계획은 유럽의 미래를 바꿀 것입니다."

BA_EU_focus_75: "유럽연합군"
BA_EU_focus_75_desc: "각국의 군대를 통합하여 단일 지휘 체계를 갖춘 '유럽 연합군(EAF)'을 창설합니다. 이것은 미국의 의존에서 벗어나 나토를 대체하는 독자적인 방위 기구이자, 외부의 위협으로부터 유럽의 주권과 영토를 수호할 강력한 무력입니다. 하나의 깃발 아래 모인 유럽의 군대는 세계 평화를 지키는 든든한 방패가 될 것입니다."

BA_EU_focus_76: "유럽국경수비대"
BA_EU_focus_76_desc: "개별 국가가 감당하기 힘든 난민 문제, 밀수, 국제 테러 위협에 대응하기 위해, 유럽 연합의 외부 국경을 공동으로 방어할 전문 '유럽 국경 수비대'를 조직합니다. 육지와 바다를 아우르는 철통같은 경비 태세는 유럽의 관문을 지키고, 내부의 자유로운 통행을 보장하는 전제 조건이 될 것입니다. 튼튼한 울타리가 안전한 집을 만듭니다."

BA_EU_focus_77: "유럽해안경비대"
BA_EU_focus_77_desc: "유럽의 광활한 영해와 배타적 경제 수역을 감시하고, 해상 구조 임무와 불법 조업 단속을 수행할 통합 '유럽 해안 경비대'를 운영합니다. 바다는 우리의 자원이자 생명의 통로입니다. 거친 파도와 싸우며 바다의 법질서를 확립하는 이들은, 우리의 바다를 평화롭고 풍요로운 곳으로 지켜낼 것입니다."

BA_EU_focus_78: "유럽방공대"
BA_EU_focus_78_desc: "유럽 전역을 빈틈없이 덮는 거미줄 같은 레이더망과 방공 미사일 시스템을 구축하고, 이를 통합 지휘할 방공 사령부를 설치합니다. 단 한 대의 적기나 미사일도 우리의 영공을 허락 없이 침범할 수 없습니다. 24시간 잠들지 않고 하늘을 지키는 눈과 주먹은 시민들에게 안심하고 잠들 수 있는 밤을 선물할 것입니다."

BA_EU_focus_79: "헤일로 군단 통합"
BA_EU_focus_79_desc: "각국에 흩어져 독자적으로 운영되던 헤일로 보유 병력들을 유럽 연합군 산하의 '특수 작전 사령부'로 통합 관리합니다. 신비한 능력을 가진 이들의 초인적인 전투력은 재래식 전력으로는 해결할 수 없는 특수 임무를 수행하며, 유럽을 지키는 최강의 창이자 비장의 무기가 될 것입니다. 흩어지면 위험하지만, 뭉치면 무적입니다."

BA_EU_focus_80: "PMC등록법"
BA_EU_focus_80_desc: "전쟁의 혼란 속에서 무분별하게 활동하며 통제되지 않던 민간 군사 기업(PMC)들을 법의 테두리 안으로 끌어들입니다. 엄격한 등록 요건과 투명한 관리 감독 시스템을 도입하여, 그들이 돈만 쫓는 용병 집단이 아니라 국가 안보를 보완하는 신뢰할 수 있는 파트너로 활동하게 만듭니다. 힘에는 책임이 따라야 합니다."

BA_EU_focus_81: "통일 헤일로 지휘부"
BA_EU_focus_81_desc: "키보토스 출신 병력과 현지 병력의 특성을 깊이 이해하고, 이들을 유기적으로 결합하여 효율적으로 운용할 수 있는 전담 통합 지휘부를 신설합니다. 신비의 힘과 현대 전술이 조화를 이루는 이 새로운 형태의 하이브리드 군대는, 기존의 군사 상식을 뛰어넘는 전무후무한 전투력을 보여줄 것입니다. 이것은 전쟁의 진화입니다."

BA_EU_focus_82: "PMC긴급동원법"
BA_EU_focus_82_desc: "국가 비상사태나 대규모 침략과 같은 위기 상황 발생 시, 등록된 민간 군사 기업의 자원과 인력을 국가가 즉시 징발하여 정규군과 함께 작전에 투입할 수 있는 법적 근거를 마련합니다. 생존이 걸린 위기 상황에서는 가용한 모든 전력을 총동원하여 적을 막아내야 합니다. 계약보다 생존이 우선입니다."

BA_EU_focus_83: "유럽육군지휘부"
BA_EU_focus_83_desc: "유럽 대륙의 모든 지상 작전을 총괄 지휘할 '유럽 육군 최고 사령부'를 설치합니다. 국적을 불문하고 오직 능력과 경험에 따라 유능한 장교를 지휘관으로 보임하여, 출신 국가의 이익이 아닌 연합 전체의 승리를 위해 싸우는 진정한 연합군을 만들 것입니다. 다양한 언어를 쓰지만, 명령은 하나입니다."

BA_EU_focus_84: "유럽해군사령부"
BA_EU_focus_84_desc: "지중해, 대서양, 북해, 발트해를 아우르는 유럽의 모든 바다를 지킬 '유럽 해군 사령부'를 창설합니다. 각국의 함대를 통합 운용하여 작전 반경을 넓히고 해상 통제력을 강화함으로써, 바다를 지배하는 자가 세계를 움직인다는 역사의 교훈을 실현할 것입니다. 우리의 함대는 대양의 평화 유지군이 될 것입니다."

BA_EU_focus_85: "유럽공군통제부"
BA_EU_focus_85_desc: "유럽의 영공 방어와 항공 작전, 나아가 미래의 우주 개발까지 주도할 '유럽 공군 통제부'를 발족합니다. 첨단 전투기와 위성 시스템을 통합 관리하여 공중 우세를 확보하고, 하늘과 우주를 향한 유럽의 도전이 멈추지 않도록 이끌 것입니다. 가장 높은 곳에서 유럽의 미래를 지켜보십시오."

BA_EU_focus_86: "지휘권 통합"
BA_EU_focus_86_desc: "유사시 신속하고 일관된 작전 수행을 위해, 각국 군대의 전시 작전 통제권을 유럽 연합군 총사령관에게 위임하여 지휘 체계를 일원화합니다. 생사가 오가는 위급한 순간, 복잡한 협의 절차 대신 하나의 명확한 명령에 따라 일사불란하게 움직이는 군대만이 승리할 수 있습니다. 효율적인 지휘는 병사의 피를 아낍니다."

### 법률 및 사법 통합
BA_EU_focus_87: "국제법 모방"
BA_EU_focus_87_desc: "오랜 시간 검증된 기존의 국제법 체계를 바탕으로, 키보토스와의 융합이라는 유럽 연합의 특수한 현실에 맞게 수정 보완하여 도입합니다. 맨땅에서 법을 만드는 대신, 인류가 쌓아온 지혜와 규범 위에서 새로운 법질서를 세우는 것이 시행착오를 줄이고 법적 안정성을 확보하는 가장 지혜로운 길입니다."

BA_EU_focus_88: "연합법 발의"
BA_EU_focus_88_desc: "모든 회원국의 국내법보다 상위에 위치하며 직접적인 구속력을 가지는 '연합법'을 제정합니다. 개별 국가의 이해관계나 관습보다 우선하는 이 연합법은, 유럽을 하나의 법적 공동체로 묶어주는 강력한 띠이자 통합의 흔들리지 않는 법적 토대가 될 것입니다. 법 앞의 평등은 국가 간에도 적용됩니다."

BA_EU_focus_89: "입법"
BA_EU_focus_89_desc: "유럽 의회를 통해 환경, 인권, 디지털, 에너지 등 다양한 분야를 아우르는 통합 법안들을 쏟아냅니다. 법은 사회를 규정하고 미래를 그리는 틀입니다. 우리는 낡은 틀을 깨고, 새로운 유럽에 맞는 공정하고 혁신적인 법적 기틀을 짜고 있습니다. 의사당의 망치 소리가 새로운 역사를 만듭니다."

BA_EU_focus_90: "키보토스 국제법 참고"
BA_EU_focus_90_desc: "초인적인 힘을 가진 존재들이 공존하는 키보토스의 선진적인 법률 사례와 판례를 심도 있게 연구하여, 신비 능력의 남용, 헤일로 파괴 등 전례 없는 법적 분쟁을 해결할 명확한 기준을 마련합니다. 미지의 힘을 다루는 법적 지혜를 빌려와 혼란을 막고 질서를 세워야 합니다."

BA_EU_focus_91: "국가위의 법"
BA_EU_focus_91_desc: "유럽 연합 법원의 판결과 연합법이 회원국의 헌법이나 법률보다 우위에 있음을 명문화하여 헌법적으로 확립합니다. 이는 개별 주권 국가의 연합을 넘어, 진정한 의미의 연방 국가로 나아가기 위한 가장 결정적이고 되돌릴 수 없는 한 걸음입니다. 우리는 법으로 하나가 됩니다."

BA_EU_focus_92: "협상개입권"
BA_EU_focus_92_desc: "회원국 간의 이해 충돌이나 제3국과의 중요한 외교 협상에 유럽 연합이 직접 개입하여 중재하거나 대표로 나설 수 있는 권한을 가집니다. 분열된 목소리는 약하지만, 하나 된 유럽의 목소리는 강력합니다. 우리는 이제 27개의 작은 입이 아닌, 하나의 거대한 입으로 세계와 협상할 것입니다."

BA_EU_focus_93: "유럽헌법 조직"
BA_EU_focus_93_desc: "유럽 연합이 추구하는 가치와 이념, 시민의 기본권, 그리고 통치 구조를 규정할 역사적인 '유럽 헌법' 제정 위원회를 구성합니다. 이것은 단순한 법전이 아니라, 새로운 제국의 탄생을 알리는 건국 문서이자 우리 공동체의 영혼을 담은 약속입니다. 우리의 꿈을 문자로 새겨 넣으십시오."

BA_EU_focus_94: "독립적 수사권"
BA_EU_focus_94_desc: "각국 정부나 정치 권력의 외압에 휘둘리지 않고, 국경을 넘나드는 부패, 테러, 조직범죄를 독자적으로 수사할 수 있는 강력하고 독립적인 '연방 수사 기구'를 설립합니다. 성역 없는 수사를 통해 정의를 바로 세우고, 법 위에 군림하려는 자들을 엄단해야 합니다."

BA_EU_focus_95: "조약 통제"
BA_EU_focus_95_desc: "회원국이 개별적으로 제3국과 맺는 조약들이 연합 전체의 이익이나 안보에 반하지 않는지 사전에 심사하고 승인하는 권한을 행사합니다. 연합의 결속을 해치는 이면 합의나 독단적인 외교 행위를 차단하여, 단일한 대외 정책 기조를 유지해야 합니다."

BA_EU_focus_96: "헌법 발의"
BA_EU_focus_96_desc: "치열한 논의 끝에 완성된 유럽 헌법 초안을 의회에 상정하고, 전 유럽적인 국민 투표와 비준 절차에 들어갑니다. 이것은 위에서 내려온 명령이 아니라, 시민들의 손으로 우리의 미래와 통치 규범을 직접 결정하는 위대한 민주적 과정입니다. 역사의 주인이 될 시간입니다."

BA_EU_focus_97: "회원국 감시"
BA_EU_focus_97_desc: "회원국들이 연합의 민주적 가치, 법치주의, 그리고 인권을 준수하는지 상시 모니터링하는 감시 체계를 가동합니다. 법을 어기거나 민주주의를 후퇴시키는 국가에 대해서는 경고와 제재를 가하여, 연합의 건전성을 유지해야 합니다. 신뢰는 맹목적인 믿음이 아니라 철저한 확인에서 비롯됩니다."

BA_EU_focus_98: "유럽집행위원회"
BA_EU_focus_98_desc: "유럽 연합의 행정부 역할을 수행할 '유럽 집행위원회'를 단순한 관리 기구에서 정식 정부 기구로 격상시킵니다. 정책의 입안과 집행, 예산 운영을 총괄하는 이 강력한 조직은 사실상 '유럽 내각'으로서 연합을 이끄는 심장이 될 것입니다. 강력한 행정부가 효율적인 유럽을 만듭니다."

BA_EU_focus_99: "사법"
BA_EU_focus_99_desc: "법의 지배를 확립하기 위해 낙후된 사법 시스템을 정비하고, 판사의 독립성과 전문성을 강화하여 공정하고 신속한 재판을 보장합니다. 돈이나 권력이 아닌 오직 법과 양심에 따른 판결만이 시민들의 억울함을 풀고 사회 정의를 지탱할 수 있습니다. 정의로운 법정은 민주주의의 마지막 보루입니다."

BA_EU_focus_100: "공동수사 제도화"
BA_EU_focus_100_desc: "마약 밀매, 인신매매, 사이버 범죄 등 여러 국가에 걸친 복잡한 범죄 사건을 해결하기 위해, 관련국 경찰들이 의무적으로 합동 수사 팀(JIT)을 꾸려 협력하도록 제도화합니다. 국경을 넘어 도망치는 범죄자들에게 숨을 곳은 없다는 것을 보여주어야 합니다. 공조 수사는 범죄와의 전쟁에서 승리하는 지름길입니다."

BA_EU_focus_101: "헌법 집행"
BA_EU_focus_101_desc: "시민들의 압도적인 지지로 비준된 유럽 헌법을 공식적으로 공포하고 발효시킵니다. 이제 유럽은 느슨한 연합이 아니라, 하나의 깃발, 하나의 헌법, 하나의 운명 아래 뭉친 강력한 연방 국가로 다시 태어났습니다. 헌법의 조항 하나하나가 우리의 삶을 지키고 미래를 밝혀줄 것입니다."

BA_EU_focus_102: "초국가적 집행권"
BA_EU_focus_102_desc: "유럽 법원의 판결을 각국 정부가 이행하지 않을 경우, 연합이 강제금을 부과하거나 행정력을 동원하여 강제로 이행시킬 수 있는 실질적인 집행력을 확보합니다. 집행력이 없는 법은 종이 호랑이이자 조롱거리에 불과합니다. 법의 권위는 엄정한 집행에서 나옵니다."

BA_EU_focus_103: "전과내역 공유"
BA_EU_focus_103_desc: "모든 회원국 간에 범죄자들의 지문, DNA, 전과 기록을 실시간으로 공유하는 통합 형사 사법 데이터베이스를 구축합니다. 한 국가에서 범죄를 저지르고 다른 국가로 도망쳐 신분을 세탁하는 일은 더 이상 불가능합니다. 국경을 넘는다고 죄가 사라지지는 않습니다."

BA_EU_focus_104: "연합분쟁개입권"
BA_EU_focus_104_desc: "회원국 내에서 통제 불가능한 내전이나 심각한 소요 사태, 헌정 질서 파괴 행위가 발생할 경우, 연합군을 투입하여 질서를 회복하고 민주주의를 수호할 수 있는 비상 개입 권한을 가집니다. 이는 내부의 적으로부터 시민들을 보호하기 위한 최후의 안전장치입니다."

BA_EU_focus_105: "유로폴 조직"
BA_EU_focus_105_desc: "기존의 정보 공유 기구에 불과했던 유럽 경찰 기구(유로폴)를, 미국의 FBI와 같이 직접 수사권과 체포권을 가진 강력한 연방 수사국으로 확대 개편합니다. 유로폴 요원들은 유럽 전역을 무대로 활동하며, 거대 범죄 조직과 테러리스트들을 끝까지 추적하여 검거할 것입니다."

BA_EU_focus_106: "수사권 통합"
BA_EU_focus_106_desc: "테러, 마약, 돈세탁 등 중대 범죄에 대한 수사권을 개별 국가 경찰에서 연방 수사국으로 이관하여, 수사의 효율성과 공정성을 획기적으로 높입니다. 지역 유착이나 봐주기 수사를 원천 차단하고, 범유럽 차원의 체계적인 범죄 대응 역량을 갖추게 될 것입니다."

BA_EU_focus_107: "중재기구 발의"
BA_EU_focus_107_desc: "국가 간의 영토 분쟁이나 기업 간의 무역 마찰 등 다양한 갈등을, 비용과 시간이 많이 드는 법적 소송 전에 대화와 조정으로 해결할 수 있는 상설 중재 기구를 설립합니다. 갈등을 조기에 봉합하고 상호 이익이 되는 합의점을 찾는 것이야말로 성숙한 사회의 모습입니다."

BA_EU_focus_108: "유럽사법재판소"
BA_EU_focus_108_desc: "유럽 연합의 헌법을 해석하고 연합법과 관련된 최종 심판을 담당할 '유럽 사법 재판소'의 권위와 독립성을 확고히 합니다. 재판소의 판결은 최종적이며 불가역적인 효력을 가지며, 모든 회원국과 시민은 이에 따라야 합니다. 정의의 여신은 눈을 가리고 오직 법에 따라 공정하게 심판할 것입니다."

### 행정 및 반부패
BA_EU_focus_109: "행정"
BA_EU_focus_109_desc: "비대하고 느려터진 관료 조직을 대대적으로 혁신하고, 블록체인과 AI 등 첨단 기술을 활용한 디지털 행정 시스템을 도입하여 행정의 투명성과 효율성을 극대화합니다. 시민들이 언제 어디서나 빠르고 편리하게 공공 서비스를 이용할 수 있도록, 행정의 문턱을 낮추고 서비스의 질을 높여야 합니다. 스마트한 정부가 스마트한 유럽을 만듭니다."

BA_EU_focus_110: "초국가적 감독"
BA_EU_focus_110_desc: "각국의 행정 처리가 연합의 표준과 절차에 부합하는지 감독하고, 위법하거나 부당한 행정에 대해 시정을 요구할 수 있는 강력한 감사 권한을 행사합니다. 중앙 정부의 감시는 지방 정부의 독선을 막고, 연합 전체의 행정 수준을 상향 평준화하는 효과를 가져올 것입니다."

BA_EU_focus_111: "물갈이 활성화"
BA_EU_focus_111_desc: "한 자리에 오래 머물며 부패하기 쉬운 고위 공직자들의 순환 보직제를 강화하고, 무능하거나 태만한 관료들을 과감하게 퇴출시켜 조직에 긴장감을 불어넣습니다. 고인 물은 썩기 마련이며, 흐르는 물만이 깨끗함을 유지할 수 있습니다. 관료 사회의 무사안일주의를 타파하고 능력 중심의 인사를 정착시키십시오."

BA_EU_focus_112: "임기 규정"
BA_EU_focus_112_desc: "주요 선출직 및 임명직 공무원의 임기를 엄격히 제한하여, 장기 집권으로 인한 권력의 사유화와 부패의 고리를 끊어냅니다. 권력은 영원한 것이 아니며, 잠시 위임받은 봉사의 기회일 뿐임을 명확히 해야 합니다. 정해진 기간 동안 최선을 다하고, 박수 칠 때 떠나는 문화를 만들어야 합니다."

BA_EU_focus_113: "부패단속켐페인"
BA_EU_focus_113_desc: "사회 전반에 뿌리 깊게 박힌 뇌물 수수, 청탁, 횡령 문화를 뿌리 뽑기 위해, 범유럽 차원의 대대적인 반부패 캠페인과 단속을 전개합니다. 내부 고발자를 보호하고 부패 공직자를 일벌백계하여, '부패는 곧 패가망신'이라는 인식을 심어주어야 합니다. 깨끗한 손만이 깨끗한 정치를 할 수 있으며, 청렴은 국가 경쟁력의 원천입니다."

BA_EU_focus_114: "감독관 배정"
BA_EU_focus_114_desc: "각 부처와 공공 기관, 그리고 대규모 국책 사업 현장에 연합에서 임명한 외부 감독관을 파견하여 상주하게 합니다. 이들은 조직 내부의 비리와 예산 낭비를 실시간으로 감시하고 고발하는 '암행어사' 역할을 수행할 것입니다. 감시의 눈길이 닿는 곳에서 부정은 설 자리를 잃게 됩니다."

BA_EU_focus_115: "연임 제한"
BA_EU_focus_115_desc: "정치 지도자가 헌법을 고쳐가며 영구 집권을 획책하는 독재의 망령을 막기 위해, 대통령과 총리의 연임을 헌법적으로 엄격히 제한합니다. 민주주의는 한 명의 영웅이 아니라, 잘 설계된 시스템과 깨어있는 시민들에 의해 움직여야 합니다. 권력의 평화로운 교체는 민주주의의 꽃입니다."

BA_EU_focus_116: "국가적 사기 단속"
BA_EU_focus_116_desc: "회원국 정부나 지자체가 통계를 조작하여 연합의 보조금을 부정 수급하거나, 분식 회계로 재정 상태를 속이는 국가적 차원의 사기 행위를 엄단합니다. 연합의 재정을 갉아먹는 기생충 같은 행위는 연합 전체를 위기로 몰아넣을 수 있습니다. 정직하지 못한 국가는 연합의 일원이 될 자격이 없습니다."

BA_EU_focus_117: "예산 집행 감시"
BA_EU_focus_117_desc: "모든 공공 예산의 지출 내역을 실시간으로 공개하고 추적할 수 있는 디지털 예산 모니터링 시스템을 구축합니다. 시민들이 낸 세금이 엉뚱한 곳으로 새어나가지 않고 목적에 맞게 쓰이는지 누구나 감시할 수 있게 하여, 예산 낭비를 원천 봉쇄해야 합니다. 투명성은 재정 건전성의 기본입니다."

BA_EU_focus_118: "유럽검찰청"
BA_EU_focus_118_desc: "유럽 연합의 예산과 기금을 횡령하거나 금융 사기를 저질러 연합의 재정에 손해를 입히는 범죄를 전담하여 수사하고 기소할 '유럽 검찰청(EPPO)'을 신설합니다. 이들은 국경을 넘어 범죄자들을 끝까지 추적하여 잃어버린 시민들의 세금을 되찾아올 것입니다."

BA_EU_focus_119: "명령서 압수"
BA_EU_focus_119_desc: "권력형 비리 수사 시, 부당한 지시나 압력이 담긴 공문서와 이메일, 메신저 기록 등을 신속하게 압수하여 증거로 확보합니다. 꼬리 자르기로 수사를 방해하려는 시도를 차단하고, 비리의 정점에 있는 몸통을 밝혀내어 법의 심판대에 세워야 합니다. 기록은 거짓말을 하지 않습니다."

### 과거 청산 및 미래
BA_EU_focus_120: "준군사조직 해체"
BA_EU_focus_120_desc: "정당의 사병 조직, 정치 깡패, 극단주의 민병대 등 국가의 통제를 벗어나 폭력을 휘두르는 모든 불법 무장 조직들을 강제 해산시키고 무기를 전량 압수합니다. 민주 국가에서 합법적인 무력은 오직 국가만이 독점해야 하며, 사적인 폭력은 어떤 명분으로도 용납될 수 없습니다. 거리의 평화는 오직 공권력에 의해 지켜져야 합니다."

BA_EU_focus_121: "대량학살 처벌"
BA_EU_focus_121_desc: "인종 청소, 제노사이드, 조직적인 고문 등 인류의 양심을 짓밟은 반인륜 범죄에 대해서는 공소시효를 적용하지 않고 지구 끝까지 추적하여 처벌합니다. 시간이 흘렀다고 죄가 사라지는 것은 아니며, 가해자가 편안히 눈을 감게 두어서는 안 됩니다. 역사의 정의 앞에 시효는 없으며, 우리는 기억하고 또 기억하여 심판할 것입니다."

BA_EU_focus_122: "혐오범죄 처벌"
BA_EU_focus_122_desc: "인종, 종교, 출신 국가, 성별을 이유로 타인에게 폭력을 행사하거나 혐오를 조장하는 범죄를 가중 처벌하여 엄단합니다. 소수자를 보호하고 다양성을 존중하는 것은 우리 연합의 핵심 가치이며, 혐오라는 바이러스가 사회를 병들게 하는 것을 막아야 합니다. 차별 없는 세상이 진정으로 안전한 세상입니다."

BA_EU_focus_123: "민간인 피해조사"
BA_EU_focus_123_desc: "전쟁과 학살의 광풍 속에서 억울하게 희생되거나 피해를 입은 민간인들의 실태를 전수 조사하고, 국가 차원의 공식 사과와 배상을 추진합니다. 잊힌 피해자들의 이름을 불러주고 그들의 명예를 회복시켜주는 것은 살아남은 자들의 의무입니다. 과거의 아픔을 치유해야만 우리는 진정한 화해의 미래로 나아갈 수 있습니다."

BA_EU_focus_124: "말단 장교 조사"
BA_EU_focus_124_desc: "'위에서 시키는 대로 했을 뿐', '명령에 따랐을 뿐'이라는 비겁한 변명은 더 이상 통하지 않습니다. 현장에서 학살을 직접 지휘하거나 방조한 하급 장교들과 실무자들도 자신의 행동에 대해 책임을 져야 합니다. 악의 평범성을 경계하고, 불의한 명령을 거부할 수 있는 양심을 지키는 것이 군인의 진정한 명예임을 일깨워야 합니다."

BA_EU_focus_125: "파시즘 제제"
BA_EU_focus_125_desc: "나치즘과 파시즘, 그리고 전체주의를 찬양하거나 선전하는 행위, 관련 상징물을 사용하는 것을 법으로 엄격히 금지하고, 이를 추종하는 정치 단체를 강제 해산합니다. 민주주의를 파괴하려는 사상의 자유까지 허용할 수는 없습니다. 악마의 씨앗이 우리 사회에 다시 싹트지 못하도록 단호하게 짓밟아버려야 합니다."

BA_EU_focus_126: "극단적 민족주의 척결"
BA_EU_focus_126_desc: "타 민족을 배척하고 자국 중심주의를 부르짖으며 분열과 증오를 선동하는 극단적 국수주의 세력을 사회의 적으로 규정하고 강력하게 대처합니다. 우리는 피와 땅으로 묶인 민족이 아니라, 자유와 인권이라는 가치로 뭉친 연합입니다. 폐쇄적인 민족주의의 망령을 몰아내고, 열린 세계시민의식을 함양해야 합니다."

BA_EU_focus_127: "최종 판결"
BA_EU_focus_127_desc: "길고 고통스러웠던 재판 과정을 마무리하고, 전쟁 범죄자들에 대한 역사의 최종 판결을 내립니다. 이것은 단순한 처벌이 아니라, 과거의 악행을 단죄하고 피해자들을 위로하며, 정의가 살아있음을 증명하는 의식입니다. 이 판결로써 우리는 어두웠던 과거와 작별하고, 짐을 내려놓은 채 가벼운 마음으로 새로운 시대를 향해 발걸음을 옮길 수 있게 되었습니다."

BA_EU_focus_128: "유럽의 길"
BA_EU_focus_128_desc: "우리는 전쟁과 분열, 그리고 대전이의 폐허 위에서 땀과 눈물로 평화와 번영의 탑을 쌓아 올렸습니다. 이제 유럽은 과거의 망령을 떨쳐내고, 키보토스의 신비와 인간의 지혜가 조화를 이루는 새로운 문명의 모델로서 당당하게 세계의 중심에 섰습니다. 이것이 바로 우리가 선택한, 우리가 만들어낸, 그리고 우리가 걸어가야 할 '유럽의 길'입니다. 역사는 우리의 용기와 지혜를 영원히 기억할 것입니다."





