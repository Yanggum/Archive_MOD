 #ABY_descision_focus_abydos_15_effect: "정치력: §G+1500§!\n기본 안정도 획득: §G+50.00%§!\n§Y[ABY.GetNameWithFlag]§! 에서 §Y에드바르트 베네시§! 체포\n§Y오쿠소라 아야네§!(은)는 §Y민주주의§! 정당의 지도자가 됩니다.\n    §Y연방 대통령§!\n      - 정치력 획득: §G+15%§!\n      - 안정도: §G+10.00%§!\n      - 정당 인기도의 안정도 변동치: §G+20.00%§!\n      - 이념 변화 방어: §G+25.0%§!\n      - 매일 민주주의 지지도: §G+0.15§!\n\n(§Y[9.GetName]§!, §Y[75.GetName]§!, §Y[72.GetName]§!, 그리고 §Y9§!):\n    주는 이제 §Y[ABY.GetName]§!의 핵심 주입니다.\n    다음 효과를 부여하는 §Y키보토스계 불만§! 추가:\n현지 가용 자원: §R-60%§!\n현지 공장: §R-60%§!\n징병 가능 인구: §R-60%§!"
