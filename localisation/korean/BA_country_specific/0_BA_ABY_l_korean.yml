 ABY_descision_focus_event.64.t:0 "그림자 속의 칼날"
 ABY_descision_focus_event.64.d:0 "카를로비바리의 밤은 깊었고, 아야네의 임시 관저 회의실 커튼은 외부의 시선을 차단하기 위해 굳게 닫혀 있었다. 책상 위에는 릴 테이프가 돌아가는 녹음기와 흐릿한 흑백 사진 몇 장이 어지럽게 흩어져 있었다. 아야네의 앞에는 긴장한 표정의 세리카, 굳은 얼굴의 시로코, 그리고 평소의 나른함을 지운 호시노와 노노미가 앉아 있었다.\n\n"방금 들으신 내용은 군 내부 정보망인 '비질런트'로부터 입수한 도청 기록입니다."\n\n아야네의 목소리는 차분했지만, 그 끝은 무겁게 가라앉아 있었다. 사진 속에는 아사기리 스오우가 군복을 입은 사내들, 그리고 탐욕스러운 표정의 네프티스 이사들과 밀담을 나누는 장면이 찍혀 있었다.\n\n"스오우 소장... 그녀가 정말로?" 세리카가 믿기지 않는다는 듯 물었다.\n\n"확실해." 시로코가 짧게 답하며 사진을 집어 들었다. "병력 이동 현황이 이상해. 훈련을 명목으로 제3기갑사단이 수도 외곽 요충지로 재배치됐어. 명백한 공격 대형이야."\n\n호시노가 팔짱을 낀 채 낮게 중얼거렸다. "베네시가 물러나고 정국이 어수선한 틈을 타려는 거겠지. '외부인'인 우리가 정권을 잡은 것에 불만을 가진 세력들을 규합한 거야. 네프티스의 자금력과 나치 잔당의 무력, 그리고 그녀의 지휘권이라면..."\n\n"단순한 불만이 아니에요." 아야네가 단호하게 말했다. "이것은 명백한 국가 전복 음모입니다. 스오우 소장은 내일 새벽, '구국의 결단'이라는 명분 하에 의회와 관저를 점거할 계획입니다. 우리는 선수를 쳐야 합니다. 이것은 정치 싸움이 아니라, 생존이 걸린 문제입니다."\n\n아야네의 눈빛은 더 이상 학생의 것이 아니었다. 한 국가를 책임지는 지도자의 결의였다."
 ABY_descision_focus_event.64.a:0 "스오우는 행동할 겁니다. 단단히 준비하세요."
 ABY_descision_focus_event.64.b:0 ""

 ABY_descision_focus_event.65.t:0 "닿지 않는 평행선"
 ABY_descision_focus_event.65.d:0 "수도방위사령부 지하 벙커의 취조실. 형광등의 창백한 불빛 아래, 아사기리 스오우는 수갑을 찬 채 앉아 있었다. 그녀의 군복은 제압 과정에서 헝클어졌고 계급장은 뜯겨 나갔지만, 그녀의 태도는 마치 승리자처럼 오만했다.\n\n유리 너머에서 아야네와 대책위원회 멤버들이 들어오자, 스오우는 비틀린 미소를 지으며 그들을 훑어보았다.\n\n"축하해, 회장. 아니, 이제는 총리 각하인가? 너희들의 그 소꿉장난 같은 정보력치고는 제법이더군."\n\n"당신에게 묻고 싶었어요, 스오우 씨." 아야네가 차갑게 물었다. "어째서입니까? 우리는 함께 이 나라를 지켜왔습니다. 그런데 왜 총구를 동료들에게 돌린 거죠?"\n스오우는 코웃음을 쳤다. 그 웃음에는 깊은 경멸이 담겨 있었다.\n\n"동료? 하... 착각하지 마. 너희들의 그 미온적이고 나약한 태도가 이 나라를 병들게 하고 있어. 베네시를 몰아내고 잡은 권력으로 뭘 했지? 화합? 공존? 그런 꽃밭 같은 이상론으로는 다가올 거대한 전쟁을 막을 수 없어! 나는 이 나라를 강철처럼 단단하게 만들려고 했다. 비록 피를 보더라도, 살아남을 수 있는 강한 국가를!"\n그녀는 싸늘한 눈빛으로 아야네를 노려보았다.\n\n"하지만... 너희에게 이런 말을 해봤자 무슨 소용이 있겠어. 너희는 영원히 이해하지 못할 거야. 전쟁이 무엇인지, 국가가 무엇인지 모르는 멍청한 애송이들이니까."\n그녀는 더 이상 말할 가치도 없다는 듯 등받이에 몸을 기대며 눈을 감아버렸다. 그것은 패배자의 체념이 아니었다. 말이 통하지 않는 미개한 존재들을 향한 지독한 무시였다.\n\n아야네는 입술을 깨물며 돌아섰다."
 ABY_descision_focus_event.65.a:0 ""아사기리 스오우. 당신을 내란 음모 및 반역 혐의로 군사 재판에 회부합니다.""

 ABY_descision_focus_event.66.t:0 "악어들의 만찬"
 ABY_descision_focus_event.66.d:0 "프라하 외곽의 한 고급 저택. 화려한 샹들리에 불빛 아래, 네프티스 그룹의 강경파 이사들과 아사기리 스오우가 마주 앉아 있었다. 공기는 시가 연기와 묘한 긴장감, 그리고 탐욕으로 탁했다.\n\n"자금은 준비되었습니다, 소장님. 우리 네프티스가 이번 '거사'에 거는 기대가 큽니다."\n\n비대하게 살이 찐 이사가 기름진 미소를 지으며 말했다.\n\n"그동안 아비도스라는 이름 아래, 우리 네프티스가 너무 위축되어 있었지요. 노노미 양의 방식은... 너무 순진하더군요. 기업은 이윤과 권력을 추구해야 하는 법입니다. 이번 일이 성공하면, 정부 사업 독점권과 군수 물자 납품권... 확실히 보장해 주시는 거겠지요?"\n\n스오우는 와인잔을 천천히 돌리며 그들을 응시했다. 그녀의 눈에는 그들에 대한 경멸이 담겨 있었지만, 입가에는 여유로운 미소가 걸려 있었다.\n\n"물론입니다. 국가 재건에는 여러분 같은 야망 있는 분들의 힘이 필수적이니까요. 제가 원하는 건 강한 국가이고, 강한 국가는 돈에서 나오지 않습니까."\n\n"오오, 역시 장군님은 말이 통하시는군요!"\n\n이사들은 만족스러운 듯 웃음을 터뜨리며 서로 눈빛을 교환했다. 그들의 눈에는 스오우를 허수아비로 세워 권력을 쥐락펴락하려는 계산이 번뜩이고 있었다.\n\n스오우 역시 와인을 한 모금 삼키며 속으로 비웃었다.\n\n'어리석은 늙은이들. 거사가 성공하면, 그 탐욕스러운 배를 갈라 국고를 채워주마.'\n\n유리잔이 부딪치는 청아한 소리가 울렸다. 서로를 이용하고 파멸시킬 계획을 품은 채,"
 ABY_descision_focus_event.66.a:0 "악어들은 웃으며 만찬을 즐겼다."

 ABY_descision_focus_event.67.t:0 "강철의 유혹"
 ABY_descision_focus_event.67.d:0 "임시수도 프라하는 불타고 있었다. 스오우의 쿠데타군은 파죽지세로 진격했으나, 시로코가 지휘하는 수도방위사령부의 결사적인 저항에 막혀 블타바 강을 건너지 못하고 있었다. 다리 하나를 사이에 두고 팽팽한 대치 상황이 이어진 지 사흘째.\n\n쿠데타군 측의 협상단이 백기를 들고 시로코의 지휘소를 찾아왔다. 정복을 말끔하게 차려입은 장교는 시로코 앞에서 정중하게 경례했다.\n\n"스나오오카미 사령관님. 더 이상의 무의미한 유혈 사태는 국가적 손실입니다. 스오우 장군님께서는 사령관님의 능력을 높이 평가하고 계십니다."\n\n시로코는 흙투성이가 된 얼굴로 지도를 보던 시선을 거두고 그를 쏘아보았다. "항복은 없어."\n\n"들어보십시오. 이것은 최후의 제안입니다." 장교는 품에서 서류 봉투를 꺼내 테이블 위에 놓았다. "지금 저항을 멈추고 투항하신다면, 사령관님 한 분의 신변만 구속하겠습니다. 아야네 총리를 포함한 나머지 대책위원회 멤버들의 안전은 완벽하게 보장합니다."\n\n시로코의 눈썹이 꿈틀거렸다.\n\n"그들은 망명할 필요도 없습니다. 새 정부 하에서, 그저 평범한 일반 시민으로서 자유롭게 살아가게 될 것입니다. 학교에 다니고, 일을 하고, 평범한 일상을 누리는 것... 그것이 그들이 진짜 원하던 삶 아닙니까?"\n\n장교의 말은 시로코의 가장 약한 부분을 파고들었다.\n\n"하지만 계속 저항하신다면... 다음 공세에는 중포가 동원됩니다. 그때는 사령관님뿐만 아니라, 당신이 지키려던 친구들까지 잿더미가 될 것입니다."\n\n지휘소 안에는 무거운 침묵만이 감돌았다. 시로코는 떨리는 손으로 소총의 개머리판을 꽉 쥐었다.\n\n나 하나만 굽히면, 모두가 안전해진다. 더 이상 피 흘리지 않아도 된다. 하지만 그것이 과연 옳은 길인가? 스오우를 믿을 수 있는가?\n\n시로코의 시선이 창밖의 불타는 프라하와, 지쳐 쓰러져 잠든 부관들을 향했다. 그녀의 입술이 달싹였지만, 차마 명령은 나오지 않았다."
 ABY_descision_focus_event.67.a:0 "응, 이미 너희는 내 신뢰를 저버렸어."
 ABY_descision_focus_event.67.b:0 "...그 조건, 반드시 지켜야 할 거야."

 ABY_descision_focus_event.68.t:0 "승리자의 딜레마"
 ABY_descision_focus_event.68.d:0 "프라하 성의 발코니. 스오우는 아래를 내려다보았다. 거리에는 그녀의 깃발이 나부끼고 있었고, 시민들은 총구 앞에서 침묵하고 있었다. 쿠데타는 성공했다. 아야네의 정부는 무너졌고, 군부는 그녀의 손아귀에 들어왔다.\n\n"각하." 부관이 다가와 조심스럽게 물었다. "축하드립니다. 이제 다음 명령을 내려주십시오. 현재 가택 연금 중인 대책위원회 멤버들... 그리고 지분을 요구하고 있는 네프티스 이사들과의 면담 일정이 잡혀 있습니다."\n\n스오우는 대답 대신 담배를 꺼내 물었다. 연기가 허공으로 흩어졌다. 승리의 기쁨보다는 차가운 계산이 머릿속을 지배했다.\n\n'누구를 먼저 치는 것이 효율적인가.'\n\n그녀는 눈을 가늘게 뜨고 생각에 잠겼다.\n\n첫 번째 선택지, 대책위원회. 그들은 아비도스의 상징이다. 살려둔다면 언제든 구심점이 되어 반격을 꾀할 수 있다. 하지만 그들을 처형한다면? 시민들의 분노가 폭발할 것이고, 키보토스 계열 주민들은 폭도가 되어 일어날 것이다.\n\n두 번째 선택지, 네프티스 이사회와 나치 잔당들. 그들은 탐욕스러운 하이에나들이다. 이제 승리했으니 국정을 농단하고 이권을 챙기려 들 것이다. "부패한 기업과 외세의 청산"이라는 명분으로 그들을 숙청한다면 대중의 열광적인 지지를 얻을 수 있다. 하지만 당장 그들의 자금과 무력이 사라진다면, 이 불안정한 정권을 유지할 수 있을까?\n\n스오우는 난간을 톡, 톡, 두드렸다.\n\n이상적인 혁명은 끝났고, 이제는 피비린내 나는 현실의 정치가 그녀를 기다리고 있었다. 칼자루는 쥐었지만, 그 칼끝을 어디로 먼저 향해야 할지, 그녀는 아직 결정하지 못했다."
 ABY_descision_focus_event.68.a:0 "대책위원회는 위험하다"
 ABY_descision_focus_event.68.b:0 "그들보다 급한 문제가 있다"

 ABY_descision_focus_event.69.t:0 "생존자"
 ABY_descision_focus_event.69.d:0 ""
 ABY_descision_focus_event.69.a:0 "반드시 복수할거야..."

 ABY_descision_focus_event.70.t:0 "시밤쾅"
 ABY_descision_focus_event.70.d:0 ""
 ABY_descision_focus_event.70.a:0 "계몽군 네프티스 PMC에 다털렸죠?ㅋㅋㅋ"

 ABY_descision_focus_event.71.t:0 "붉은 방패, 다시 한번"
 ABY_descision_focus_event.71.d:0 "비좁은 임시 사무실의 촛불 아래, 낡은 유럽 지도를 내려다본다. 빈, 파리, 런던, 프랑크푸르트… 우리 가문의 이름이 빛나던 모든 곳이 이제 낯선 학원들의 영토가 되었거나 잿더미로 변했다. 사람들은 로스차일드가 끝났다고 수군거리지. 유대인 망명객이 뭘 할 수 있겠냐며 동정하거나, 비웃거나. 그들은 모른다. 우리의 진정한 힘은 금고 속 황금이 아니라 '로스차일드'라는 이름 그 자체에 있다는 것을. 그리고 지금 내겐 비코비체의 제철소가 남아있다. 이 혼란의 땅에서 유일하게 가동되는 심장이다. 저 기묘한 헤일로를 단 소녀들과, 고향을 잃은 체코인들, 증오에 찬 독일인들… 이 불안정한 연합은 위험한 도박이지만, 동시에 유일한 기회이기도 하다. 좋다. 이 작은 불씨에서 다시 시작하리라. 이들에게 자금을 대고, 신용을 창조하고, 전쟁으로 무너진 경제의 혈맥을 잇겠다. 그들은 나를 필요로 하게 될 것이다. 붉은 방패는 결코 부서지지 않는다. 이곳 보헤미아에서, 다시 한 번 유럽을 뒤흔들 것이다."
 ABY_descision_focus_event.71.a:0 "그 영광을 다시 한 번."
 ABY_descision_focus_event.71.b:0 ""

 ABY_descision_focus_event.72.t:0 "빈손의 상속자"
 ABY_descision_focus_event.72.d:0 "우스티나트라벰의 작은 사무실 창가에 서서 손바닥을 폈다 접었다. 텅 빈 손. 지금의 네프티스가 바로 이렇다. 키보토스의 거대한 본사 건물, 끝없이 펼쳐진 공장들, 각 자치구의 지사들… 그 모든 것은 이제 가닿을 수 없는 다른 세계의 이야기. 이곳 유럽에 떨어진 것은 달랑 ‘네프티스’라는 이름과 나, 그리고 수십 명의 직원들뿐이다. 사람들은 내게 기대하고 있지만, 그들이 기대하는 막대한 자금력은 사실 신기루나 다름없다. 이 사실을 알면 모두가 실망할까? 하지만… 센세는 내게 말씀하셨다. 빈손이기에 무엇이든 새로 채울 수 있다고. 그래, 맞아. 더 이상 과거의 이름에 짓눌릴 필요는 없어. 자금도, 공장도, 유통망도, 아무것도 없지만… 나에겐 아비도스의 친구들이 있고, 이 기묘한 연립정부가 있다. 이곳에서부터 시작하는 거야. 맨땅에서, 벽돌 한 장부터 다시 쌓아 올리는 기분으로. 돈으로 군림하던 과거의 방식이 아니라, 신용과 협력으로 모두를 돕는 새로운 네프티스를. 그것이 이 혼돈의 땅에서 내가 해야 할 일이다. 이 빈손으로, 모두의 내일을 만들어 보이겠어."
 ABY_descision_focus_event.72.a:0 "그를 위해선 연방의 기치를 따라야지."
 ABY_descision_focus_event.72.b:0 "그를 위해선 기업으로서의 정체성을 유지해야 해."

 ABY_descision_focus_event.73.t:0 "강철의 심장은 꺼지지 않는다"
 ABY_descision_focus_event.73.d:0 "망치 소리와 용접 불꽃이 어지러운 임시 공방. 플젠의 거대한 공장은 이제 백귀야행 놈들의 차지가 되었지만, 사람들은 중요한 사실을 잊고 있다. 슈코다의 영혼은 공장의 벽돌이 아니라, 바로 우리 기술자들의 머리와 손에 깃들어 있다는 것을. 헨라인의 민병대가 쓰는 낡은 총을 수리하고, 체코군의 장갑차에 새로운 엔진을 달아주며 우리는 다시 시작했다. 자산도, 설비도 모두 잃었지만, 우리에겐 '설계도'가 있다. 이 임시정부의 군대가 기댈 것은 결국 우리가 만드는 강철이다. 저 헤일로를 쓴 아이들의 힘은 경이롭지만, 전쟁은 결국 보급과 기술력으로 귀결된다. 마사리크 선생은 우리를 믿어주었고, 우리는 그 믿음에 보답할 것이다. 이 작은 공방에서, 우리는 연합군의 새로운 심장을 만들어낼 것이다. 더 강력한 포신, 더 견고한 장갑, 더 빠른 엔진. 슈코다는 단순한 회사가 아니다. 이 나라를 움직일 동력이자, 적들의 심장을 꿰뚫을 창이다. 두고 보라, 우리의 기술력이 이 기묘한 국가의 초석이 될 테니."
 ABY_descision_focus_event.73.a:0 "전통을 다시 세우자."
 ABY_descision_focus_event.73.b:0 ""

 ABY_descision_focus_event.74.t:0 "국내 안정화"
 ABY_descision_focus_event.74.d:0 "낙화작전 중점을 시작할 수 있습니다."
 ABY_descision_focus_event.74.a:0 "준비는 끝났다."
 ABY_descision_focus_event.74.b:0 ""

 ABY_descision_focus_event.75.t:0 "Espero(희망)"
 ABY_descision_focus_event.75.d:0 "에스페란토 체코 지부의 작가였던 얀 필립이 작게 미소를 지으면서 곳곳에 있는 현지인들과 키보토스인들이 에스페란토를 배우는 광경을 지켜보았다. 그는 그것을 전혀 예상하지 않았을 못했을 것이다. 지멘호프가 만들고 내놓은 에스페란토는 영어와 프랑스어라는 거대한 존재 앞에서 결국 한없이 작은 존재로 전락했지만 말이다.\n\n"Saluton, mia amiko.(안녕하신가, 친구.)"\n\n협회 동료 중 한명이었던 밀로시 루카스가 그를 바라보면서 작게, 에스페란토로 말하며 미소지었다. 작게나마 지멘호프 선생께서 바라던 광경이 펼쳐지고 있었으니까. \n\n키보토스인들, 그리고 독일인들, 체코인들 너나 할것 없이 상호작용을 위해 에스페란토를 배우고 이렇게 이야기하는 광경이라니. 그것도 그것이 성공으로 마무리 되다니. 자신들이라도 이것들을 전혀 예상하지 못했을 것이다.\n\n"이보게 밀로시, 이 키보토스인들이 어쩌면 우리들에게 기회를 가져온것 같다고 생각하지 않나?"\n\n"희망이라."\n\n밀로시가 작게 미소지으며 그를 향해 미소지었다."
 ABY_descision_focus_event.75.a:0 ""그래, 에스페란토.(Esperanto) 드디어 그 이름을 노래할 수 있게 되었구나.""

 ABY_descision_focus_event.76.t:0 "보헤미아 탈환"
 ABY_descision_focus_event.76.d:0 ""
 ABY_descision_focus_event.76.a:0 "총동원령 해제."

 ABY_descision_focus_event.77.t:0 "갈림길에 선 안내자"
 ABY_descision_focus_event.77.d:0 "스오우의 쿠데타가 진압되고, 프라하의 거리에서 총성이 멎은 지 일주일이 지났다. 무너진 건물들은 복구되고 있었고, 시민들은 다시 일상을 찾아가고 있었지만, 최고행정관 집무실의 공기는 여전히 납처럼 무거웠다.\n\n아야네는 책상 위에 놓인 두 개의 두툼한 보고서를 번갈아 바라보았다. 그녀의 눈 밑에는 짙은 다크서클이 내려앉아 있었다. 그녀의 곁에는 호시노가 소파에 기대어 앉아, 말없이 천장만을 응시하고 있었다.\n\n"결정해야 해, 호시노 선배. 이제 미룰 수 없어요."\n\n아야네의 목소리는 건조했다. 스오우를 심판하고 민주정부를 수호해냈지만, 그것은 '무엇을 지킬 것인가'에 대한 답은 되지 못했다.\n\n"첫 번째 안은... '원상복구'야."\n\n아야네가 왼쪽의 서류를 집어 들었다.\n\n"체코슬로바키아와 오스트리아 공화국의 법통을 계승하는 것. 이 땅의 주인은 원래 그들이었으니까요. 우리는 약속대로 '돕는 자'의 위치로 돌아가고, 새로운 지도자는 현지인 중에서 선출될 거예요. 가장 명분 있고, 잡음이 적은 길이죠."\n\n"하지만..." 호시노가 나직하게 말을 받았다. "그렇게 되면 우리는 영원히 '손님'으로 남겠지. 그리고 언젠가 또다시 '주인'과 '손님' 사이의 갈등이 터질지도 몰라. 베네시 때처럼."\n\n"맞아요."\n\n아야네는 오른쪽 서류를 손에 쥐었다. 그 표지에는 [양세계 통합 이론에 따른 신국가 건설안]이라는 제목이 적혀 있었다.\n\n"그래서 나온 것이 이 '양세계 이론'이에요. 현지인과 키보토스인을 구분하지 않고, 완전히 새로운 하나의 정체성을 가진 '연방 시민'으로 통합하는 것. 단순한 공존을 넘어선 융합이죠. 이것이 성공한다면, 장기적으로 민족 갈등이라는 불씨 자체를 꺼버릴 수 있을 거예요. 마사리크 선생님이 꿈꾸셨던 진정한 이상향에 가깝죠."\n하지만 아야네의 손은 떨리고 있었다. 그녀는 괴로운 듯 입술을 깨물었다.\n"하지만 선배, 이 길을 가려면... 우리는 또 피를 봐야 해요."\n\n"......"\n\n"기존의 체코, 독일, 오스트리아, 키보토스의 민족주의를 '구시대의 유물'로 규정하고 강제로 해체해야 해요. 우리의 정체성을 거부하는 이들을 억눌러야 하고, 통합을 반대하는 급진파들을 무력으로 제압해야만 이 새로운 질서를 심을 수 있어요. 스오우가 하려던 방식과는 다르지만, 결국 우리도 '평화를 위한 폭력'을 휘둘러야 한다는 모순에 빠지게 돼요."\n\n아야네는 창밖을 내다보았다. 재건되는 도시의 풍경 위로, 두 가지 미래가 겹쳐 보였다.\n\n과거의 주인을 존중하며 물러서는 '명예로운 이방인'의 길.\n\n혹은, 피를 뒤집어쓰더라도 두 세계를 억지로 묶어 영원한 하나로 만드는 '고독한 개척자'의 길.\n\n"어느 쪽이 정답일까, 으헤..." 호시노가 씁쓸하게 웃으며 몸을 일으켰다. "어느 쪽이든, 책임은 같이 져줄 테니까. 아야네 짱은 선택만 해."\n\n아야네는 깊은 한숨을 내쉬며, 펜을 들어 올렸다. 잉크가 마르지 않은 역사책의 다음 페이지를 적어 내려갈 시간이었다."
 ABY_descision_focus_event.77.a:0 "이 땅의 주인"
 ABY_descision_focus_event.77.b:0 "두 세계의 땅"

 ABY_descision_focus_event.78.t:0 "붉은 밧줄"
 ABY_descision_focus_event.78.d:0 "프라하의 뒷골목, 습기로 얼룩진 지하 안전가옥의 공기는 탁했다. 호시노는 낡은 소파에 깊숙이 몸을 파묻고 있었다. 시로코의 분전에도 불구하고 쿠데타군의 물량 공세는 압도적이었다. 아야네, 세리카, 노노미, 시로코... 모두가 스오우의 감옥에 갇혔다.\n\n"동무, 아니 호시노 위원장. 얼굴이 안 좋아 보이는군요."\n\n맞은편에 앉은 사내, 클레멘트 고트발트가 짐짓 걱정스러운 척 말을 건넸다. 그는 아비도스 사회주의 연합 내의 소수파였던 '다뉴브 공산당'의 당수였다. 본래라면 호시노의 상대조차 되지 않았을 그였지만, 아비도스가 동방의 적들을 물리친 직후부터 그의 위세는 기이할 정도로 커져 있었다. 그 배후에 크렘린의 막대한 자금과 지원이 있다는 것은 공공연한 비밀이었다.\n\n"으헤~ 내 꼴이 좀 말이 아니지? 그래서, 고트발트 씨가 날 여기까지 빼내 준 건 고맙게 생각하고 있어."\n\n"우리는 동지 아닙니까. 파시스트 스오우가 민주주의를 짓밟는 꼴을 모스크바... 아니, 우리 당원들은 두고 볼 수 없었습니다."\n\n고트발트는 테이블 위로 서류 한 장을 밀었다. 그것은 '반파시즘 연합 전선'의 결성 선언문이었다. 하지만 그 내용을 훑어보던 호시노의 눈매가 가늘어졌다.\n\n"이거... 군사 지휘권이랑 당의 의사결정권을 전부 '다뉴브 위원회'에 일임한다는 내용이네? 사실상 나보고 간판만 남기고 뒤로 물러나라는 소리잖아."\n\n"형식적인 절차일 뿐입니다." 고트발트가 능글맞게 웃었다. "지금 필요한 건 크렘린의... 아니, 강력한 국제적 지원과 조직력입니다. 위원장님이 이 제안을 받아들이신다면, 우리는 스오우를 몰아내고 당신의 소중한 동료들을 즉각 구출할 수 있는 '힘'을 제공할 것입니다."\n\n호시노는 주먹을 꽉 쥐었다. 마사리크 센세의 경고가 귓가에 맴돌았다.\n\n'공산당은 믿을 수 없어요. 그들은 크렘린의 꼭두각시입니다.'\n\n알고 있다. 이 손을 잡는 순간, 자신이 만든 정당은 소련의 위성 정당으로 전락할 것이고, 아비도스의 이상은 붉은색으로 덧칠해질 것이다. 이것은 악마와의 계약이다.\n\n하지만.\n\n"정말... 우리 애들을 구할 수 있는 거지?"\n\n"제 목을 걸고 약속하죠."\n\n호시노는 떨리는 손으로 펜을 잡았다. 후배들이 차가운 감옥에 있는 한, 그녀에게는 선택권이 없었다. 설령 그 밧줄이 불타는 붉은색이라 해도, 지금은 잡아야만 했다."
 ABY_descision_focus_event.78.a:0 "악마의 손을 붙잡다."

 ABY_descision_focus_event.79.t:0 "풀려난 늑대"
 ABY_descision_focus_event.79.d:0 "덜컹거리는 호송 차량의 어둠 속, 시로코는 수갑 찬 손목을 내려다보고 있었다. 밖에서는 쿠데타군의 승리를 알리는 사이렌 소리가 들려왔다. 이것으로 끝난 것이다. 자신이 항복하는 대가로 아야네와 다른 동료들은 목숨을 건졌다. 그것으로 충분하다고, 시로코는 스스로를 다독였다. 비록 자신은 스오우의 트로피가 되어 영원히 감옥에 갇히거나 처형당하겠지만, 아비도스의 불씨는 지켰으니까.\n\n하지만 그때였다.\n\n쾅-!\n\n거대한 폭발음과 함께 호송 트럭이 휘청거렸다. 찢어지는 듯한 급정거 소리, 그리고 밖에서 들려오는 비명과 고함.\n\n"습격이다! 전원 전투 배치!"\n\n"막아! 저 미친놈들이... 윽!"\n\n다급한 군인들의 외침은 이내 누군가들이 지르는 함성에 묻혀버렸다. 그것은 조직된 군대의 함성이 아니었다. 분노한, 그러나 희망을 갈구하는 수천, 수만 명의 날것 그대로의 목소리였다.\n\n"시로코를 돌려내라!"\n\n"아비도스의 영웅을 석방하라!"\n\n뒷문이 굉음과 함께 뜯겨 나갔다. 쏟아지는 눈부신 햇살 사이로, 화염병과 쇠파이프, 낡은 사냥총을 든 시민들의 얼굴이 보였다. 프라하의 시민들이었다. 그들은 스오우의 기갑 부대를 두려워하지 않고, 맨몸으로 호송 행렬을 덮친 것이다.\n\n"사령관님! 늦어서 죄송합니다!"\n\n피 묻은 붕대를 감은 한 청년이 시로코의 수갑을 끊어냈다. 얼떨떨한 표정으로 차 밖으로 끌려나온 시로코는 눈앞의 광경에 말을 잃었다. 바츨라프 광장을 가득 메운 인파. 그들은 시로코의 이름을 연호하며 쿠데타군을 몰아내고 있었다.\n\n"와아아아-!! 시로코 만세! 자유 아비도스 만세!"\n\n시로코는 자신의 손을 바라보았다. 묶여있던 손은 자유가 되었고, 시민들은 그녀를 다시 전장의 한복판으로 불러냈다. 그녀는 더 이상 패배한 포로가 아니었다. 거대한 혁명의 구심점, 그 자체가 되어 있었다."
 ABY_descision_focus_event.79.a:0 "이게...무슨..."

 ABY_descision_focus_event.80.t:0 "피와 벨벳 사이에서"
 ABY_descision_focus_event.80.d:0 "시민들에 의해 탈환된 국립 박물관 앞 계단. 시로코는 임시 지휘소로 쓰이는 트럭 위에 앉아 지도를 내려다보고 있었다. 스오우의 쿠데타군은 시민들의 기세에 눌려 블타바 강 서쪽으로 일시 후퇴한 상태였다. 하지만 그들은 전열을 재정비하고 있었고, 곧 탱크를 앞세워 무자비한 진압을 시도할 것이다.\n\n"사령관님, 무기고를 털어 시민들을 무장시켰습니다. 명령만 내려주십시오. 오늘 밤, 관저를 습격해서 스오우의 목을 따버립시다!"\n\n자경단장으로 추대된 시민 대표가 흥분하여 외쳤다. 그의 뒤로는 수천 명의 시민이 화염병과 노획한 소총을 든 채, 시로코의 입만을 바라보고 있었다.\n\n시로코는 건네받은 소총의 노리쇠를 습관처럼 당겼다 놓았다.\n\n'싸울 수 있어.'\n\n늑대의 본능이 속삭였다. 시가전은 그녀의 전문 분야였다. 이 수많은 인파를 미끼와 방패로 삼고, 자신이 타격대를 이끌어 스오우의 지휘부를 친다면 승산은 충분했다. 그것이 군인으로서 가장 빠르고 확실한 해결책이었다.\n\n하지만...\n\n시로코의 눈에 소총을 든 어린 소년의 모습이 들어왔다. 겁에 질려 떨면서도 용감한 척하는 아이. 만약 전면전이 벌어진다면, 저 아이는 스오우의 기관총 앞에 가장 먼저 쓰러질 것이다. 프라하는 불바다가 될 것이고, 승리한다 해도 그 폐허 위에는 수만 명의 시체가 쌓일 것이다. 내가 지키려던 것이, 폐허가 된 나라와 죽은 시민들인가?\n\n'다른 방법은 없는 건가.'\n\n그녀는 총을 내려놓고 생각에 잠겼다.\n\n무기를 버리는 것. 비폭력.\n\n그것은 미친 짓처럼 보였다. 맨몸으로 탱크를 막아서다니. 하지만 스오우의 군대도 결국은 사람이다. 그들도 누군가의 아들이고, 형제다. 비무장 시민을 향해 발포하라는 명령이 떨어졌을 때, 군인들의 양심이 흔들린다면? 군 내부의 중립 파벌이 우리 쪽으로 돌아선다면?\n\n피를 흘리지 않고 이길 수 있는 유일한, 하지만 실패하면 대학살로 끝날 가장 위험한 도박.\n\n"사령관님?"\n\n재촉하는 목소리에 시로코는 고개를 들었다. 그녀의 눈빛이 흔들림을 멈추고 차갑게 가라앉았다. 그녀는 소총을 쥔 손에 힘을 주었다가, 이내 천천히, 아주 천천히 총을 바닥에 내려놓았다.\n\n늑대는 결단을 내렸다."
 ABY_descision_focus_event.80.a:0 "응. 시간이 없어. 바로 가야 해."
 ABY_descision_focus_event.80.b:0 "모두 총을 내려놔. 내가 앞장선다."

 ABY_descision_focus_event.81.t:0 "늑대의 왕관"
 ABY_descision_focus_event.81.d:0 "프라하는 해방되었으나, 거리에는 여전히 화약 냄새가 진동했다. 스오우는 축출되었지만, 그녀가 남긴 권력의 공백은 혼란이라는 괴물을 불러왔다. 시민들은 군부대의 무기고를 털어 무장했고, 곳곳에서 스오우의 잔당을 색출한다며 사적인 복수가 자행되고 있었다. '자유'는 '무질서'의 다른 이름이 되어가고 있었다.\n\n시로코는 집무실 창가에 서서 혼란스러운 거리를 내려다보았다. 그녀의 곁에는 참모들이 산더미 같은 보고서를 들고 서 있었다.\n\n"사령관님, 치안 유지가 불가능합니다. 경찰력만으로는 무장한 자경단과 시민군을 통제할 수 없습니다. 군을 투입해야 합니다."\n\n시로코는 입술을 깨물었다. 그녀가 바란 것은 민주주의의 회복이었지, 무법천지가 아니었다. 하지만 조언을 구할 곳이 없었다. 구출된 아야네와 다른 동료들은 고문의 후유증으로 병원에 입원해, 외부와의 접촉이 차단된 상태였다.\n\n"질서가... 필요해."\n\n시민들은 광장에 모여 시로코의 이름을 연호하고 있었다. 그들은 복잡한 의회 절차나 토론이 아닌, 지금 당장 자신들을 보호해줄 강력한 '영웅'을 원하고 있었다. 시로코는 그 열광적인 함성을 민주주의를 향한 열망으로 착각했다.\n\n"나의 임무는 이 나라를 정상화하는 것. 아직은... 칼을 놓을 때가 아니야."\n\n그녀는 참모들을 돌아보며 지시했다.\n\n"비상대권을 연장하겠어. 치안이 안정되고 의회가 정상화될 때까지, 내가 국정 전반을 총괄할 거야. 모든 무장 세력은 즉시 해산하고 군의 통제에 따르도록 해."\n\n그것이 자신을 영원한 권력의 굴레에 가두는 첫 단추임을,"
 ABY_descision_focus_event.81.a:0 "순수한 늑대는 알지 못했다."
 ABY_descision_focus_event.81.b:0 ""

 ABY_descision_focus_event.82.t:0 "벨벳의 무게"
 ABY_descision_focus_event.82.d:0 "기적이었다. 시로코가 총을 내려놓고 시민들과 함께 탱크 앞을 가로막았을 때, 쿠데타군의 총구는 불을 뿜지 않았다. 스오우는 피 한 방울 흘리지 않고 체포되었고, 광장은 시민들이 흔드는 열쇠 꾸러미 소리와 촛불로 가득 찼다. 훗날 사람들은 이를 부드럽지만 강하게 독재를 몰아냈다 하여 '벨벳 혁명'이라 불렀다.\n\n국가는 빠르게 안정을 되찾아갔다. 시로코는 이제 자신의 역할이 끝났다고 생각했다.\n\n"그럼, 나는 이제 돌아가야겠네. 남은 건 아야네와 정치인들의 몫이니깐."\n\n그녀는 병실에 누워 있는 아야네를 찾아가 복귀 의사를 밝혔다. 하지만 창밖을 멍하니 바라보던 아야네는 고개를 저었다.\n\n"아뇨, 선배. 저는... 돌아가지 않을 거예요."\n\n"아야네?"\n\n"너무 지쳤어요. 사람을 믿는 것도, 정치를 하는 것도. 스오우 씨의 배신이 제 안의 무언가를 부러뜨린 것 같아요. 이제 정치는... 무리예요."\n\n아야네의 거절은 충격이었다. 호시노와 다른 멤버들도 마찬가지였다. 그들은 고개를 저으며 시로코를 바라보았다.\n\n"으헤~ 시로코 짱. 지금 이 나라를 수습할 수 있는 사람은 너밖에 없어. 시민들이 누구를 보고 일어났는데?"\n\n"맞아. 우리가 나선다고 해도 지지율은 바닥일 거야. 하지만 선배라면 달라."\n\n시로코는 곤혹스러운 표정으로 자신의 낡은 군복을 내려다보았다.\n\n"나는 군인이야. 정치는 몰라."\n\n"배우면 돼. 우리가 도울 테니까."\n\n호시노가 시로코의 어깨에 손을 올렸다. 시로코는 병실의 하얀 벽을, 그리고 지쳐버린 동료들의 얼굴을 보았다. 누군가는 짐을 져야 했다. 그녀는 떨리는 손으로 군복의 단추를 풀었다."
 ABY_descision_focus_event.82.a:0 "그것은 전쟁터보다 더 어려운 전장으로 향하는 출정식이었다."
 ABY_descision_focus_event.82.b:0 ""

 ABY_descision_focus_event.83.t:0 "철의 민주주의"
 ABY_descision_focus_event.83.d:0 "비상대권 연장 발표 이후 6개월, 시로코는 약속대로 군복을 벗었다. 그녀는 군 사령관직을 사임하고 민간인 신분으로 돌아와 '연방민주공화당'을 창설했다. 시민들은 환호했다. 구국의 영웅이 총을 내려놓고 투표용지를 들었다는 사실은, 민주주의가 완성되었다는 착각을 불러일으키기에 충분했다.\n\n선거 유세장은 마치 아이돌의 콘서트장을 방불케 했다. 시로코가 단상에 올라 어색하게 손을 흔들면, 수만 명의 지지자가 열광했다. 야당의 목소리는 '국가 재건을 방해하는 잡음'으로 치부되어 대중의 외면 속에 묻혀버렸다.\n\n"나는 모두의 평범한 일상을 지키기 위해 이 자리에 섰어. 강한 아비도스, 흔들리지 않는 연방을 만들 거야."\n\n투표 결과는 압도적이었다. 90%에 육박하는 득표율. 시로코는 당선 확정 소식을 듣고 비로소 안도의 한숨을 내쉬었다.\n\n'응. 이걸로 됐어. 시민들이 나를 선택했으니, 정당성은 확보된 거야. 이제 아야네가 꿈꾸던 나라를 만들 수 있어.'\n\n하지만 그녀의 곁에는 '아니오'라고 말해줄 참모도, 견제할 의회도 존재하지 않았다. 그녀가 만든 것은 민주주의의 탈을 쓴 철인 통치였다. 의사당의 주인이 된 시로코는 자신의 통치가 민주주의를 질식시키고 있다는 사실을 모른 채, 가장 민주적인 독재자가 되어가고 있었다."
 ABY_descision_focus_event.83.a:0 "대통령 만세!!"

 ABY_descision_focus_event.84.t:0 "양복 입은 늑대"
 ABY_descision_focus_event.84.d:0 "시로코는 아야네가 이끌던 중도 정당을 개편한 '국민사회자유당'에 입당했다. 평생 총과 전술 교범만을 다루던 그녀에게 정당 정치는 미지의 영역이었다. 하지만 그녀 특유의 솔직함과 행동력은 기성 정치인들의 화려한 언변보다 더 깊게 시민들의 마음을 파고들었다.\n\n"나는 경제도, 외교도 잘 몰라. 하지만 약속을 지키는 법은 알아. 사람들을 버리지 않을 자신은 있어."\n\n그녀의 투박한 연설은 전파를 타고 연방 전역으로 퍼져나갔다. 아야네는 막후에서 정책 자문을 맡아 시로코의 부족함을 채웠고, 호시노와 세리카는 선거 캠프를 지휘하며 발로 뛰었다. 노노미의 자금 지원이 더해지자 시로코의 지지율은 수직 상승했다.\n\n이윽고 다가온 제2대 연방 총선. 결과는 국민사회자유당의 과반 의석 확보와 시로코의 압승이었다.\n\n당선이 확정되던 날 밤, 시로코는 당선 수락 연설을 위해 단상에 올랐다. 플래시 세례 속에서 그녀는 더 이상 군복 입은 지휘관이 아니었다. 말끔한 정장을 입은 그녀는, 두 세계의 화합을 이끌어갈 합법적이고 민주적인 지도자, '아비도스 연방의 대통령'이었다.\n\n"오늘의 승리는 나만의 것이 아니야. 응, 광장에서 촛불을 들었던 우리 모두의 것이야. 이제 두 세계의 시민 모두들과 함께, 새로운 아비도스를 향해 은행을... 아니, 미래를 털러 가겠어."\n\n그녀의 농담 섞인 마지막 멘트에 광장은 환호성으로 뒤덮였다."
 ABY_descision_focus_event.84.a:0 "그것은 진정한 봄의 시작이었다."
 ABY_descision_focus_event.84.b:0 ""

