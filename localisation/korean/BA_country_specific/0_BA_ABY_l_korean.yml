 ABY_new_event.149.d:0 "[9.GetName]에서 백귀야행 부대가 철수한 후, 해당 지역에서 활동하던 레지스탕스 조직이 연립정부군과 접촉했습니다. 이들은 개인 화기와 일부 노획한 장비로 무장하고 있었습니다. 지휘부 간의 협의를 거쳐, 해당 레지스탕스 조직원들은 연립정부군의 정식 지휘 체계 아래로 편입되었습니다. 이 조치로 [9.GetName] 주둔군의 병력이 즉각적으로 증강되었습니다."
