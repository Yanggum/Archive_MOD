 SOV_bcerossiya:0 "전러시아 임시위원회"

 ABY_news_event.1.t: "아비도스 임시정부의 휴전 파기"
 ABY_news_event.1.d: "오늘 아비도스 임시정부군이 백귀야행과의 휴전을 파기하고 침공을 시작했습니다. \n\n그곳은 자주 무력충돌이 있었던 지역이나 침공과 함께 주데텐 실레시아에서 독일인들이 봉기하며 외신들은 계획된 침공으로 보고 있습니다.\n\n하지만 이에 대해 현지와 키보토스의 국가들은 최후의 발악으로 일축하고 별 다른 관심을 보이고 있지 않습니다."
 ABY_news_event.1.a: "가자! 해방을 위해!"
 ABY_news_event.1.b: "궁지에 몰린 쥐는 고양이를 문다고 했나."
 
 ABY_news_event.2.t: "산해경과 아비도스의 충돌"
 ABY_news_event.2.d: "산해경이 불법적으로 침탈한 자신들의 핵심 지역을 반환하라는 아비도스의 최후통첩을 무시하며 두 국가는 전쟁 상태에 돌입했습니다.\n\n모두의 예상을 뒤엎고 백귀야행을 상대로 승전한 아비도스 임시정부의 행보를 여러 국가가 주목하는 가운데 일어난 두 번째 전쟁은 키보토스 국가들에게 큰 경계심을 사고 있으며, 현지 국가 중 일부는 이에 지지 성명을 발표하는 등 이번에는 여러 의견이 복합적으로 작용하고 있습니다."
 ABY_news_event.2.a: "승리가 머지않았다."
 ABY_news_event.2.b: "그들에게 또 다른 행운이 주어질까?"
 
 ABY_news_event.3.t: "오스트리아 임시민주정부 설립"
 ABY_news_event.3.d: "놀라운 일이 일어났습니다. \n아비도스 임시정부군이 린츠로 진주하자 린츠의 시민들은 그들을 해방자로써 환영하며 꽃잎을 던지고 만세를 부르는 등 큰 환영을 받은 것입니다.\n이에 총사령관 아사기리 스오우는 인터뷰에서 정부의 결단을 따를 것을 천명했습니다.\n\n한편 임시정부는 오스트리아 사회민주당을 대표로 한 대표단을 만났으며, 방금 오스트리아 임시민주정부의 성립과 오스트리아 해방 계획을 발표했습니다.\n이에 산해경은 비열한 수작이며 그들이 확장주의적 야욕을 드러냈다며 비난하고 있으나 큰 호응은 없는 것으로 보입니다."
 ABY_news_event.3.a: "오스트리아 해방을 향해."
 ABY_news_event.3.b: "두 세계의 국가... 그들은 도대체 뭐지?"
 
 ABY_news_event.4.t: "아비도스 연방정부의 성립"
 ABY_news_event.4.d: "오쿠소라 아야네 임시 연방대통령은 오늘 아비도스-체코-오스트리아 연방정부의 결성을 선언했습니다. 임시정부 헌법을 계승해 주데텐란트 완전 자치 등의 내용이 담긴 연방임시헌법을 제정하고 빠른 시일 내에 수정헌법을 발표해 국가의 기틀을 다지고 총선을 치르겠다고 밝혔습니다.\n\n한편 며칠 전의 임시정부 내 사단 일부가 새로운 수도로 북상/남하하고 네프티스 이사회가 재판에 회부되는 사건 등에 대해서는 내부사정이라며 말을 아꼈습니다.\n일부 전문가들은 군사 쿠데타의 과정과 유사함을 들어 정치적 불안정성을 우려하고 있으나 한편으로는 오히려 쿠데타를 막는 데 성공한 것이 아니냐며 의견이 갈리고 있습니다."
 ABY_news_event.4.a: "마사리크, 우리 아버지, 보고 계십니까?"
 ABY_news_event.4.b: "새로운 민주주의 국가의 탄생이군."
 
 ABY_news_event.5.t: "아비도스 군사 쿠데타"
 ABY_news_event.5.d: "아비도스 임시정부의 오스트리아 방면군 사령관이자 국민영웅, 아사기리 스오우가 그간의 충성 선언을 뒤엎고 군사 쿠데타를 일으켰습니다. \n\n쿠데타와 함께 정부청사와 대사관 등이 폐쇄되어 알려진 바는 많이 없으며 기자들의 통행 역시 제한되어 검문소가 운영되고 있습니다.\n\n국가계몽위원장으로 취임한 아사기리 스오우 장군은 가증스러운 임시정부의 추악한 음모를 확인해 구국의 결단을 내렸다고 발표했으나, 그 자세한 내용에 대해서는 추후 공개하겠다며 언급을 피했습니다.\n\n또한 임시정부 주요 정치인사들의 행방은 묘연하여 그들의 생사여부에 대해 논란이 일고 있습니다."
 ABY_news_event.5.a: "우리 민주주의는 이대로 무너지는가?"
 ABY_news_event.5.b: "또 하나의 국가가 극단주의로 빠져든다."
 
 ABY_news_event.6.t: "[ABY.GetName]의 시민 결합 제도 도입"
 ABY_news_event.6.d: "아비도스 임시정부가 대전이 이후 최초로 유럽인과 키보토스인 간의 '시민 결합' 제도를 법적으로 인정하는 법안을 통과시켰다고 공식 발표했습니다.\n\n이번 결정은 두 세계의 주민들이 실질적인 하나의 공동체를 이루는 중요한 이정표가 될 전망입니다. 임시정부 대변인은 "이번 제도는 출신과 배경을 넘어선 모든 주민의 결합을 존중하고, 그에 합당한 법적 권리를 보호하기 위한 조치"라며, "이는 우리 공동체가 추구하는 화합의 가치를 실현하는 첫걸음"이라고 밝혔습니다.\n\n아직 사회 일각에서는 문화적 차이에 대한 우려의 목소리도 나오고 있으나, 대다수 시민은 '두 세계의 국가'라는 이름에 걸맞은 진보적인 결정이라며 환영하는 분위기입니다."
 ABY_news_event.6.a: "잠깐! 해산! 해산!!"
 ABY_news_event.6.b: "이종간 혼인과 동성 혼인이라고? 하느님 맙소사!"
 
 ABY_news_event.7.t: "[ABY.GetName]의 '에스페란토어' 채택"
 ABY_news_event.7.d: "언어 갈등 문제로 고심하던 아비도스 임시정부가 중립적인 국제어 '에스페란토어'를 공식 공용어로 채택한다고 밝혔습니다.\n\n체코어, 독일어, 키보토스어가 혼용되며 발생했던 행정 비효율과 민족 갈등을 해소하기 위한 파격적인 결정입니다. 정부는 "특정 민족에 치우치지 않는 에스페란토어의 도입이 모든 구성원에게 공평한 소통의 기반을 제공할 것"이라며 채택 배경을 설명했습니다.\n\n정부 발표에 따르면, 향후 모든 공문서는 에스페란토어로 작성되며, 각급 학교에도 정규 과목으로 편성될 예정입니다. 이번 결정이 '바벨탑'의 위기에 직면했던 임시정부에 새로운 화합의 길을 열어줄지 귀추가 주목됩니다."
 ABY_news_event.7.a: "Espero(희망)."
 ABY_news_event.7.b: "그래서 뭐?"
 
 ABY_news_event.8.t: "아비도스 2차 쿠데타"
 ABY_news_event.8.d: "아사기리 스오우의 철권통치가 마침내 막을 내렸습니다. 항복을 가장해 기회를 엿보던 스나오오카미 시로코 사령관은, 어젯밤 비밀리에 규합한 시민군과 군 내 충성파를 이끌고 전광석화처럼 관저를 급습했습니다.\n\n혼란스러운 시가전 끝에 스오우는 체포되었으며, 스나오오카미 시로코 사령관은 "정의와 무너진 질서의 회복"을 천명했습니다. 시민들은 거리로 쏟아져 나와 영웅의 귀환을 환호하고 있으나, 사령관이 선포한 계엄령과 강력한 군사 통제는 또 다른 형태의 권위주의가 아니냐는 우려 섞인 시선 또한 존재합니다."
 ABY_news_event.8.a: "시로코 사령관 만세!"
 ABY_news_event.8.b: "전통놀이인가?"
 
 ABY_news_event.9.t: "대아비도스 연방국 선포"
 ABY_news_event.9.d: "스나오오카미 시로코 대통령은 슬로바키아와의 통일을 공식화함과 동시에, 헝가리 국경을 넘는 군사 작전을 개시했습니다. 대통령은 성명을 통해 "헝가리의 독재 정권을 종식하고 억압받는 슬로바키아인 형제들을 해방하기 위한 성전"임을 강조했습니다.\n\n이와 함께 정부는 체코, 오스트리아, 슬로바키아, 그리고 헝가리를 아우르는 대아비도스 연방국의 수립을 만방에 선포했습니다. 중부 유럽의 패자로 거듭난 연방의 행보에 루마니아와 유고슬라비아 또한 지지를 보내며, 과거 '소협상국'의 부활 논의가 급물살을 타고 있습니다."
 ABY_news_event.9.a: "대아비도스에 영광을."
 ABY_news_event.9.b: "통일의 다른 방식인가?"
 
 ABY_news_event.10.t: "소협상국의 부활"
 ABY_news_event.10.d: "[ABY.GetName], [ROM.GetName], [YUG.GetName]의 지도자들이 오늘 브라티슬라바 성에 모여 역사적인 상호 방위 조약에 서명했습니다. 이로써 전간기 중부 유럽의 평화를 지탱하던 '소협상국'이 공식적으로 부활했습니다.\n\n3국 정상은 공동 선언문을 통해 "다뉴브 강 유역의 평화를 위협하는 어떠한 외부 세력의 침략에도 공동으로 대응할 것"을 결의했습니다. 이번 조약으로 [ABY.GetName]은 중유럽의 확고한 맹주로서의 지위를 국제적으로 공인받게 되었습니다."
 ABY_news_event.10.a: "옛 유산을 부활시키자."
 ABY_news_event.10.b: "새로운 동유럽 패권의 시작이군."
 
 ABY_news_event.11.t: "[ABY.GetName]의 연방법 선포"
 ABY_news_event.11.d: "[ABY.GetName]은 오늘 새로운 연방헌법을 공포하고, 헝가리 점령 지역에 대한 군사 통제 종료를 선언했습니다. 이에 따라 모든 헝가리 거주민에게는 차별 없는 연방 시민권이 즉각 부여됩니다.\n\n정부 대변인은 "승자와 패자의 구분을 없앤 완전한 통합만이 우리의 길"이라며, 전쟁으로 낙후된 동부 지역에 대한 대규모 균형 발전 계획을 발표했습니다. 아울러 연방의 확장된 영토를 효율적으로 통치하기 위해, 장기적으로 프라하를 떠나 새로운 행정 수도를 건설하는 방안에 대한 논의도 시작될 것임을 시사했습니다."
 ABY_news_event.11.a: "연방은 영원히 하나이리라!"
 ABY_news_event.11.b: "저 연합은 얼마나 오래 갈까?"
