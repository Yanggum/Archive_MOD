 ABY_shiroko_fas_event.11.t: "강철의 울타리"
 ABY_shiroko_fas_event.11.d: ""선배, 서쪽의 독일 지역... 게헨나나 트리니티 쪽은 우리를 주시하고 있어요. 그들은 우리가 약한 모습을 보이면 언제든 지역의 패권을 쥐려 들 거예요. 전쟁을 피하려면 우리가 강하다는 걸 보여주면서도, 동시에 친구를 만들어야 해요."\n\n아야네의 분석은 정확했다. 시로코는 고개를 끄덕였다.\n\n"응. 알겠어. 건드리지 않으면 물지 않아. 하지만 보험은 필요해."\n\n시로코는 방송실 마이크 앞에 섰다. 원고가 있었지만, 그녀는 그것을 대충 훑어보더니 옆으로 치워버렸다. 그리고 특유의 무덤덤한 목소리로 연설을 시작했다.\n\n"우리는 혼자서도 강해. 하지만 친구가 있으면 더 강해질 수 있어. 오늘부터 아비도스는 루마니아, 유고슬라비아와 손을 잡는다. 옛날에 있었던 '소협상국', 그거 다시 시작하는 거야."\n\n그녀는 잠시 숨을 고르고, 서쪽을 향해 메시지를 던졌다.\n\n"그리고 서쪽의 독일 지역 국가들에게도 전할게. 너희가 우리 땅을 넘보지 않고, 우리를 존중한다면 우리도 너희와 싸울 생각 없어. 사이좋게 지내면 돼. 간단해."\n그녀의 눈빛이 카메라를 뚫어지게 응시했다.\n\n"하지만 내 친구를 건드리거나, 우리 땅에 허락 없이 발을 들이면... 그땐 용서 안 해. 지옥 끝까지 쫓아가서 털어버릴 거야. 내 방식 알지? 아비도스는 받은 만큼 돌려주니까. 다들 잘 기억해둬."\n\n외교적 수사 따위는 없는, 날것 그대로의 선언."
 ABY_shiroko_fas_event.11.a: "그것은 주변국들에게 그 어떤 외교 문서보다 강력한 경고이자 제안으로 각인되었다."

 ABY_shiroko_fas_event.12.t: "총을 녹여 빵으로"
 ABY_shiroko_fas_event.12.d: ""이대로는 안 돼, 선배! 스오우가 군수공장에만 돈을 쏟아부어서 완전 엉망이야. 도로도 끊기고 생필품도 없어. 시민들이 지금은 환호하지만, 배가 고프면 그게 언제 분노로 바뀔지 몰라!"\n\n세리카의 잔소리는 따가웠지만 정확했다. 노노미 역시 거들었다. "맞아요. 이제는 탱크보다는 사람들의 식탁을 챙겨야 해요."\n\n시로코는 지도를 내려다보았다. 그녀에게 지도는 언제나 공략해야 할 작전 구역이었지만, 이제는 지켜야 할 삶의 터전이었다.\n\n며칠 뒤, 중앙 광장의 단상에 선 시로코. 수많은 인파가 그녀를 올려다보고 있었다. 그녀는 마이크를 잡고 툭 내뱉듯 말했다.\n\n"우리가 이겼어. 하지만 승리가 밥을 먹여주지는 않아."\n\n광장은 순식간에 조용해졌다.\n\n"배가 고프면 이긴 의미가 없어. 지금 필요한 건 총알이 아니라 빵이야. 그래서 바꾸려고 해."\n\n그녀는 손가락으로 어딘가를 가리켰다.\n\n"이제 공장에서는 탱크 부품 대신 트랙터를 만들 거야. 끊어진 도로는 다시 잇고, 무너진 학교는 다시 세울 거야. 도시든 시골이든, 지구 사람이든 키보토스 사람이든 상관없어. 이 땅에 사는 사람은 다 똑같이 배불리 먹고, 다리 뻗고 잘 수 있어야 해."\n\n시로코는 자신의 가슴을 툭 쳤다.\n\n"솔직히 나는 부수고 싸우는 것밖에 몰라. 만드는 건 서툴러. 그러니까 내 친구들, 그리고 아비도스의 모두들에게 배울 거야. 총을 녹여서 빵을 만들게. 내 약속은 지켜. 응."\n\n와아아아-!!\n\n광장을 뒤흔드는 함성. 시민들은 그녀의 거친 말투 속에 담긴 투박한 진심을 믿었다. 하지만 시로코는 웃지 않았다. 군중 틈 어딘가에서, 차갑게 식은 눈으로 자신을 바라보고 있을 호시노의 시선이 느껴졌기 때문이다."
 ABY_shiroko_fas_event.12.a: "언젠가는..."

 ABY_shiroko_fas_event.13.t: "대아비도스 연방국"
 ABY_shiroko_fas_event.13.d: "부다페스트 국회의사당 앞, 도나우 강변을 가득 메운 군중은 아비도스와 슬로바키아, 그리고 헝가리의 깃발을 함께 흔들고 있었다. 슬로바키아 통일과 헝가리 해방 전쟁이 승리로 끝난 후, 시로코는 정복자가 아닌 '해방자'로서 그 자리에 섰다. 그녀는 평소 즐겨 입던 실용적인 전술 점퍼 대신, 각이 잡힌 제복에 대통령 휘장을 두르고 있었다.\n\n시로코는 마이크를 잡고 군중을 내려다보았다. 그녀의 눈빛은 흔들림 없이 확고했다.\n\n"응. 다들 모였네. 전쟁은 끝났어. 독재자들은 사라졌고, 우리는 가족을 되찾았어."\n\n그녀는 뒤에 걸린 거대한 지도를 가리켰다. 체코, 슬로바키아, 오스트리아, 헝가리의 국경선이 지워지고 하나의 색으로 칠해진 거대한 영토가 그곳에 있었다.\n\n"우리는 이제 남남이 아니야. 체코도, 슬로바키아도, 오스트리아도, 헝가리도... 우리는 한 가족이야. 가족은 떨어져 살면 안 돼. 그래서 하나로 합쳤어."\n\n시로코는 선언했다.\n\n"오늘부터 이 나라는 '대아비도스 연방국'이야."\n\n군중의 함성이 터져 나왔다. 시로코는 손을 들어 그들을 진정시키고, 단호하게 말을 이었다.\n\n"우리는 커졌어. 더 강해졌어. 이제 누구도 우리 가족을 건드릴 수 없어. 내 울타리 안에 들어온 이상, 내가 끝까지 지켜. 배고프지 않게 할 거고, 겁먹지 않게 할 거야. 그게 내 방식이고, 대아비도스의 방식이야."\n\n그녀의 논리는 단순했다. 복잡한 민족 갈등이나 역사적 원한 따위는 '내 울타리 안의 가족'이라는 그녀만의 정의 앞에서 모두 덮여버렸다.\n\n"대아비도스는 멈추지 않아. 다들, 잘 따라와.""
 ABY_shiroko_fas_event.13.a: "중부 유럽의 패자가 탄생했다."

 ABY_shiroko_fas_event.14.t: "늑대의 무리"
 ABY_shiroko_fas_event.14.d: "호른의 대통령 관저 대회의실. 시로코는 루마니아와 유고슬라비아 대사와 나란히 서서 기자회견을 가졌다. 3국의 국기가 나란히 걸려 있었고, 이는 중부 유럽을 가로지르는 거대한 방벽의 재림을 의미했다.\n\n"세상은 여전히 위험해. 서쪽도, 동쪽도 우리를 노리고 있어. 혼자 싸우면 다치기 쉬워. 그래서 옛날 친구들을 다시 불렀어."\n\n시로코는 준비된 원고를 읽는 대신, 특유의 직설적인 화법으로 연설을 이어갔다.\n\n"옛날에 '소협상국'이라고 있었지? 그거 다시 하는 거야. 루마니아, 유고슬라비아, 그리고 우리 대아비도스. 이 셋은 이제부터 한 몸이야."\n\n그녀는 허공에 주먹을 쥐어 보였다.\n\n"우리는 서로의 등을 지켜줄 거야. 루마니아가 맞으면 내가 때려줄 거고, 내가 맞으면 유고슬라비아가 도와줄 거야. 아주 간단한 규칙이야."\n\n그녀의 시선이 카메라를 향했다.\n\n"이건 누굴 괴롭히려는 게 아니야. 우리 집 울타리를 튼튼하게 만드는 거지. 하지만 경고하는데, 이 울타리를 넘으려는 놈들은 각오해야 할 거야. 우리 셋이 동시에 달려들 테니까. 내 친구를 건드리면 가만두지 않아."\n\n아야네가 써준 '상호방위조약'이나 '집단안보체제' 같은 어려운 단어는 없었다. 하지만 '건드리면 다 같이 가서 응징한다'는 늑대 무리의 논리는 그 어떤 외교적 수사보다 명확하고 위협적이었다. 시민들은 환호했고, 주변국들은 긴장했다. 다뉴브 강을 지배하는 거대한 군사 동맹이 공식적으로 부활한 순간이었다."
 ABY_shiroko_fas_event.14.a: "하나씩, 하나씩..."

 ABY_shiroko_fas_event.15.t: "발칸의 여우와 늑대"
 ABY_shiroko_fas_event.15.d: "베오그라드의 은밀한 안가. 요시프 브로즈 티토는 맞은편에 앉은 시로코의 대리인, 아비도스의 정보부 요원을 묘한 눈빛으로 바라보고 있었다. 요원은 시로코의 친필 서명이 담긴 서류 가방을 내밀었다.\n\n"시로코 대통령 각하의 제안입니다. 유고슬라비아 내의 혼란스러운 민족 갈등과 왕정의 무능함을 해결하기 위해, 티토 서기장님과의 협력을 원하고 계십니다."\n\n티토는 서류를 훑어보았다. 막대한 자금 지원, 최신식 무기 제공, 그리고 쿠데타 발생 시 아비도스군의 국경 배치로 인한 간접적 지원. 조건은 '아비도스와의 우호 관계 유지'뿐이었다.\n\n"이거, 명백한 내정 간섭이군. 당신네 대통령은 남의 나라 뒤집는 걸 무슨 옆집 청소 도와주는 것처럼 생각하나 보오."\n\n티토가 시가를 피우며 비꼬았다. 요원은 정중하지만 단호한 어조로 시로코의 의중을 전달했다.\n\n"각하께서는 유고슬라비아의 국민들이 진정한 안정을 찾기 위해서는, 현 왕실보다는 서기장님과 같은 유능하고 강력한 지도자가 필요하다고 판단하셨습니다. 이것은 어떠한 정치적 대가를 바라는 것이 아닌, 순수하게 유고슬라비아의 더 나은 미래를 위한 지원임을 강조하셨습니다. 단지 서기장님께서 집권하신 후, 우리 연방과 형제처럼 지내주시기만을 바랄 뿐입니다."\n\n티토는 허, 하고 헛웃음을 지었다. 순진한 건지, 오만한 건지 알 수 없었다. 보통 이런 제안에는 영토 할양이나 경제적 종속 같은 더러운 조건이 붙기 마련이다. 하지만 시로코는 정말로 '티토가 잡는 게 인민에게 더 낫다'는 자기만의 정의감으로 움직이고 있었다.\n\n'위험한 이상주의자로군. 하지만... 거절할 이유는 없어.'\n\n티토는 현실주의자였다. 아비도스의 눈치를 좀 봐야겠지만, 이 정도 지원이면 혁명을 완수하고도 남았다.\n\n"좋소. 그 제안, 받아들이지. 친구가 되자는데 거절할 이유가 있나."\n\n티토는 악수를 청했다."
 ABY_shiroko_fas_event.15.a: "시로코의 '선의'가 발칸의 지도를 바꾸는 순간이었다."

 ABY_shiroko_fas_event.16.t: "어린 양과 늑대"
 ABY_shiroko_fas_event.16.d: "루마니아 펠레슈 성의 접견실. 미하이 1세는 긴장한 표정으로 시로코의 특사를 맞이했다. 아직 정치적 기반이 약한 젊은 국왕에게, 루마니아의 정세는 살얼음판과 같았다. 카롤 2세의 사치와 부패한 국회의원들이 루마니아를 좀먹고 있었다.\n\n특사는 정중하게 시로코의 메시지를 전달했다.\n\n"대통령 각하께서는 전하를 깊이 염려하고 계십니다. 현재 루마니아를 둘러싼 혼란들이 전하의 통치를 방해하고 백성들을 괴롭히는 상황을 좌시할 수 없다고 하셨습니다."\n\n"아비도스가... 나를 돕겠다고? 왜지? 나는 그들에게 줄 것이 없는데."\n\n미하이 1세의 물음에 특사는 고개를 숙이며 답했다.\n\n"각하께서는 전하께서 선한 마음을 지니셨지만, 주변의 위협적인 세력들 때문에 뜻을 펼치지 못하고 계신다고 생각합니다. 각하께서는 루마니아의 국민들이 전하와 같은 선량한 군주의 통치 아래서 평화를 누리기를 원하십니다. 저희가 그 장애물들을 제거해 드리는 '방패'가 되어 드리겠습니다."\n\n그것은 국제 외교라기보다는, 힘센 골목대장이 약한 아이를 보호하겠다는 논리였다. 하지만 그 말에는 기이한 진정성이 있었다. 미하이 1세는 시로코가 보낸 지원 계획서를 보았다. 왕실 근위대의 현대화, 정보 제공, 경제 원조.\n\n정치 경험이 부족한 젊은 왕의 눈에 시로코는 강력하고 정의로운 후견인으로 보였다. 그는 시로코의 방식이 다소 거칠고 독선적이라는 것을 알았지만, 그녀가 내세우는 '이상'을 반쯤은 믿고 싶었다.\n\n"알겠소... 시로코 대통령의 호의를 받아들이겠소. 우리 루마니아는 아비도스를 가장 신뢰하는 형제국으로 대우할 것이오."\n\n미하이 1세는 고개를 끄덕였다. 시로코는 자신의 영향력을 이용해 루마니아의 내정에 깊숙이 개입하게 되었지만, 그녀 자신은 그것을 약한 동생을 위한 '보호'라고 굳게 믿고 있었다."
 ABY_shiroko_fas_event.16.a: "조금 과보호일지도..."

 ABY_shiroko_fas_event.17.t: "연방법의 체결"
 ABY_shiroko_fas_event.17.d: "부다페스트의 의사당 앞, 헝가리의 삼색기 대신 거대한 대아비도스 연방기가 펄럭이고 있었다. 시로코는 수많은 헝가리 시민들 앞에 섰다. 그들의 눈에는 정복자에 대한 공포와, 전쟁이 끝났다는 안도감이 뒤섞여 있었다. 시로코는 준비된 연설문을 치워버리고 마이크를 잡았다.\n\n"응. 전쟁은 끝났어. 이제 총은 내려놔."\n\n그녀의 첫마디에 긴장감이 감돌던 광장이 조금씩 술렁였다.\n\n"오늘부터 헝가리 점령지라는 말은 없어. 군사 통제도 끝이야. 너희는 이제부터 패전국 국민이 아니라, 대아비도스 연방의 시민이야. 체코 사람이나 오스트리아 사람과 똑같은 권리를 가질 거야."\n\n시로코는 선언했다. 새로운 연방법, 일명 '가족의 법'이었다.\n\n"과거는 중요하지 않아. 내 울타리 안에 들어온 이상, 우리는 한 가족이야. 나는 가족을 차별하지 않아. 너희가 슬로바키아인을 괴롭혔던 건 나쁘지만, 이제 다시는 그러지 않겠다고 약속하면 돼. 그러면 나도 너희를 지킬 거야. 누구도 너희를 2등 시민 취급하지 못하게 할 거야."\n\n그녀는 동쪽을 가리켰다.\n\n"낙후된 이곳을 다시 지을 거야. 공장을 세우고, 학교를 짓고, 빵을 나눌 거야. 이 연방 안에 산다면 똑같이 배불러야 해. 그게 내 규칙이야."\n\n단순하고 투박했지만, 그 어떤 법전보다 강력한 선언이었다. 승자가 패자에게 내미는 손길이 아닌, 가장이 가족에게 하는 약속. 헝가리 시민들은 얼떨떨한 표정으로 서로를 바라보다가, 누군가 먼저 박수를 치기 시작했다."
 ABY_shiroko_fas_event.17.a: "그것은 정복자가 아닌 새로운 보호자를 받아들이는 소리였다."

 ABY_shiroko_fas_event.18.t: "아버지의 그림자"
 ABY_shiroko_fas_event.18.d: ""연방의 어머니, 시로코 대통령 만세!"\n\n"마사리크의 진정한 후계자!"\n\n관저의 창문 너머로 시민들의 환호성이 들려올 때마다, 시로코는 가슴이 조여오는 답답함을 느꼈다. '연방의 어머니'. 그녀에게 붙여진 그 칭호는 너무나 무겁고 기이했다.\n\n집무실 한편에는 토마시 마사리크의 초상화가 걸려 있었다. 그는 평생을 민주주의와 인본주의를 위해 바쳤고, 장기 집권을 하면서도 헌정 질서를 훼손하지 않았던 '진정한 어른'이었다.\n\n'센세... 나는 잘하고 있는 걸까?'\n\n시로코는 자신의 손을 내려다보았다. 그녀의 통치는 효율적이었다. 굶주림은 사라졌고, 국경은 안전했다. 하지만 의회는 그녀의 거수기로 전락했고, 언론은 그녀를 찬양하기 바빴다. 마사리크는 사람들을 걷게 했지만, 시로코는 사람들을 업고 뛰고 있었다. 사람들은 이제 스스로 걷는 법을 잊어가고 있었다.\n\n"응... 나는 센세가 아니야. 나는 그냥..."\n\n시민들은 그녀를 신격화하고 있었지만, 시로코는 자신이 괴물이 되어가고 있음을 직감했다. 마사리크의 초상화가 오늘따라 유난히 엄하게 그녀를 내려다보고 있는 것만 같았다. 그녀는 커튼을 닫아버렸다."
 ABY_shiroko_fas_event.18.a: "빛나는 칭송 속에 가려진 그림자는 점점 더 짙어지고 있었다."

 ABY_shiroko_fas_event.19.t: "헝가리의 가장 긴 하루"
 ABY_shiroko_fas_event.19.d: "죄르는 변했다. 아비도스의 본관이 재건된 이후, 이곳은 단순한 지방 도시가 아니었다. 아비도스 양식의 마천루가 솟아올랐고, 행정 수도 이전 계획이 발표되면서 연방의 새로운 심장으로 급부상했다.\n\n헝가리계 청년 이슈트반은 카페 테라스에 앉아 그 풍경을 바라보았다. 그의 조국 헝가리는 셋으로 찢어졌다. 일부는 루마니아에, 일부는 유고슬라비아에, 그리고 나머지는 이곳 대아비도스에.\n\n"옛날보다 살기는 좋아졌지. 왕도, 귀족도 없으니까."\n\n옆자리의 노인이 웃으며 말했다. 맞았다. 거리는 활기찼고, 사람들의 표정은 밝았다. 죄르가 수도가 된다는 소식에 헝가리인들은 마치 자신들이 연방의 주류가 된 듯 들떠 있었다. 하지만 이슈트반은 알고 있었다.\n\n죄르의 거리에 늘어가는 것은 키보토스식 간판과 문화였다. 헝가리 민족주의? 대헝가리 제국의 부활? 그런 것을 외치던 사람들은 이제 배부른 돼지가 되어 시로코의 사진을 걸어놓고 찬양하고 있었다.\n\n'우리는 정복당한 게 아니다. 소화된 것이다.'\n\n저 거대한 아비도스 본관 아래서, 헝가리라는 정체성은 서서히 녹아내리고 있었다. 피 흘리며 저항할 압제자가 있다면 차라리 나았을지 모른다. 하지만 시로코가 준 빵과 번영은 너무나 달콤했다.\n\n이슈트반은 품에 넣어두었던 삼색 헝가리 국기 배지를 만지작거렸다. 그리고 이내 한숨을 내쉬며 그것을 주머니 깊숙한 곳에 밀어 넣었다.\n\n"그래요. 살기 좋으면 된 거죠."\n\n그는 커피를 마셨다."
 ABY_shiroko_fas_event.19.a: "헝가리가 가장 번영한 날, 헝가리는 조용히 죽어가고 있었다."

 ABY_shiroko_fas_event.20.t: "황금 옥좌의 죄수"
 ABY_shiroko_fas_event.20.d: "시로코의 '혁명의 공약'은 모두 지켜졌다. 기아는 종식되었고, 범죄율은 바닥을 쳤으며, 대아비도스 연방은 중부 유럽의 패권국으로 우뚝 섰다. 겉으로 보기에 그녀는 완벽한 성군이었다.\n\n하지만 밤이 되면 시로코는 불 꺼진 집무실에서 홀로 술을 마셨다.\n\n"어디서부터 잘못된 걸까."\n\n그녀는 알고 있었다. 자신의 통치가 길어질수록, 이 나라의 민주주의 근육은 퇴화하고 있다는 것을. 그녀가 모든 것을 결정하고, 모든 문제를 해결해 주는 동안, 시스템은 마비되고 있었다.\n\n'그만두고 싶어.'\n\n수십 번도 더 생각했다. 군복을 벗고, 평범한 시민으로 돌아가 친구들과 자전거를 타고 싶었다. 하지만 그녀는 군인이었다. 전장의 흐름을 읽는 눈은 잔혹한 현실을 보여주었다.\n\n지금 그녀가 물러난다면? 권력의 공백을 노리고 승냥이들이 달려들 것이다. 야심만만한 정치 군인들. 그들은 민주주의를 회복시키는 게 아니라, 이 연방을 갈기갈기 찢어놓을 것이다.\n\n"내가... 버텨야 해."\n\n그녀는 스스로를 '황금 옥좌'에 묶었다. 그녀는 국민들의 태양이어야 했다. 비록 그 태양이 자신을 태워 죽이고 있더라도. 시로코는 창밖의 야경을 보며 생각했다. 언젠가 자신보다 더 강하고, 더 올바른 누군가가 나타나 이 저주받은 자리에서 자신을 끌어내려 주기를. 그것이 혁명이든, 탄핵이든 상관없었다."
 ABY_shiroko_fas_event.20.a: "그저 해방되기를 빌며, 늑대는 오늘도 옥좌를 지켰다."

 ABY_shiroko_fas_event.21.t: "침묵하는 투표함"
 ABY_shiroko_fas_event.21.d: "시로코는 민주주의의 회복을 꿈꾸며 총선을 강행했다. 그녀는 내심 야당이 약진하여 자신을 견제해주기를, 그래서 자연스럽게 권력을 분산시킬 수 있기를 바랐다.\n\n"공정하게 해. 절대 개입하지 마."\n\n그녀는 내무부와 정보부에 신신당부했다. 선거는 깨끗하게 치러졌다. 투표함 바꿔치기도, 협박도 없었다.\n\n하지만 개표 결과가 스크린에 떴을 때, 시로코는 절망했다.\n\n[연방민주공화당: 92% 득표, 의석 싹쓸이]\n\n야당은 전멸했다. 아니, 애초에 유의미한 야당이 존재할 수 없었다. 국민들은 전쟁 영웅이자 밥을 주는 어머니인 시로코 외에 다른 대안을 생각조차 하지 않았다. 야당 후보들조차 "시로코 대통령의 뜻을 받들겠다"는 공약을 내걸 정도였다.\n\n참모들은 압승을 축하하며 샴페인을 터뜨렸지만, 시로코는 창백한 얼굴로 주저앉았다. 국민들이 준 압도적인 지지는 역설적으로 그녀에게 영구 독재의 면죄부를 쥐여주었다. 투표함은 민심을 대변했지만, 그 민심이 민주주의를 죽이고 있었다. 그녀가 만든 시스템 안에서, 그녀는 결코 패배할 수 없는 신이 되어버린 것이다."
 ABY_shiroko_fas_event.21.a: ""이게... 민주주의야?""

 ABY_shiroko_fas_event.22.t: "과속"
 ABY_shiroko_fas_event.22.d: "높아지는 지지율은 시로코를 더욱 초조하게 만들었다. 자연스러운 민주주의의 정착이 불가능하다면, 인위적으로라도 시스템을 만들어야 했다.\n\n"시간이 없어. 훌륭하지만 늦는 것보다, 미흡하더라도 빠른 게 나아(巧遲拙速)."\n\n그녀는 군사 작전을 지휘하듯 개혁을 밀어붙였다.\n\n"지방 의회 권한 강화? 법안 통과 기다리지 말고 대통령령으로 즉시 시행해."\n"사법부 독립? 판사들이 부족하면 군 법무관들 전역시켜서 내려보내."\n"언론의 자유? 정부 비판 기사 쓰는 신문사에 보조금 줘서라도 쓰게 해."\n\n그녀의 의도는 선했다. 권력을 나누고, 감시를 받겠다는 의지였다. 하지만 과정이 생략된 결과는 참담했다.\n\n준비되지 않은 지방 의회는 토호들의 먹잇감이 되었고, 급조된 사법부는 법리 대신 시로코의 눈치를 살피는 판결을 내렸다. 정부 돈을 받은 언론은 '건전한 비판' 대신 '비판을 가장한 찬양' 기사를 쏟아냈다.\n\n시로코가 서둘러 쌓아 올린 탑은 모래성과 같았다. 그녀가 손을 대면 댈수록, 시스템은 꼬이고 망가졌다. 그녀의 조급함이 오히려 독재 체제를 기형적으로 강화시키고 있다는 사실을, 늑대는 뼈저리게 깨닫고 있었다."
 ABY_shiroko_fas_event.22.a: ""왜 안 되는 거야... 간단한 건데.""

 ABY_shiroko_fas_event.23.t: "결별을 통한 이해"
 ABY_shiroko_fas_event.23.d: "호시노는 책상 위에 놓인 장부를 덮었다. 아비도스 사회주의 연합의 비밀 계좌. 최근 들어 출처를 알 수 없는 막대한 후원금이 들어오고 있었다. 추적 끝에 도달한 그 돈의 발신지는 다름 아닌 '대통령 관저 비서실'이었다.\n\n호시노는 그 길로 관저를 찾았다. 집권 이후 처음으로 마주한 두 사람이었다.\n\n"으헤~ 이게 무슨 짓이야, 시로코 짱?"\n\n호시노가 장부를 던지듯 내려놓았다.\n\n시로코는 묵묵히 그것을 바라보았다.\n\n"야당이 너무 약해. 견제 세력이 없으면 정부는 썩어. 차라리 선배가... 선배가 나를 공격해줘. 다른 이상한 놈들이 설치는 것보다 그게 나아."\n\n그것은 시로코 나름의, 비틀린 민주주의 수호 방식이었다. 스스로 적을 키워서라도 균형을 맞추려는 처절한 몸부림.\n\n호시노는 헛웃음을 지었다.\n\n"하... 정말 바보구나. 정부 돈으로 큰 야당이 무슨 정당성이 있어? 그건 그냥 2중대야. 꼭두각시라고."\n\n"그래도...!"\n\n"안 받아. 이런 돈."\n호시노는 단호하게 말했다.\n"그리고 오늘부로 행정관료직도 사임할 거야. 이제 진짜로 야인이 될 거라고."\n\n시로코의 눈이 흔들렸다. 유일하게 남아있던 연결고리가 끊어지는 순간이었다. 호시노는 문을 열고 나가려다, 잠시 멈춰 섰다. 그리고 등 뒤의 시로코에게 나직하게 말했다.\n\n"시로코 짱. 혼자서 다 짊어지려고 하지 마. 그러다 부러진다."\n\n"......"\n\n"나는 밖에서 내 방식대로 할 거야. 네가 진짜로 실수하면, 그때 진짜로 막으러 올게. 그러니까... 그때까지 잘 버텨봐."\n\n문이 닫혔다. 시로코는 텅 빈 집무실에 홀로 남겨졌다. 표면적으로는 완전한 결별이었다. 하지만 시로코는 책상에 얼굴을 묻고, 아주 오랜만에 희미하게 웃었다.\n\n자신을 감시하고 막아줄 '진짜 적'이 생겼다는 안도감. 호시노의 마지막 말은 차가운 옥좌에 갇힌 늑대에게 유일한 위로가 되었다."
 ABY_shiroko_fas_event.23.a: "응..."

