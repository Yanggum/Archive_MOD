 ABY_descision_focus_event.1.t:0 "보헤미아의 맹세"
 ABY_descision_focus_event.1.d:0 "1936년 초, 카를로비바리의 시청사는 새로운 역사의 증인이 되려는 이들로 가득 찼다. 체코 임시정부, 주데텐 독일인 대표단, 그리고 이 모든 변화의 중심에 선 아비도스 고등학교의 학생들. 엄숙한 분위기 속에서, 에드바르트 베네시가 연단에 올랐다. 그의 목소리는 낮았지만, 모든 이의 귀에 명확하게 박히는 힘이 있었다.\n\n"친애하는 체코 국민 여러분. 우리는 우리의 수도 프라하를 잃었습니다. 그러나 우리는 결코 우리의 정신까지 잃지는 않았습니다. 우리의 목표는 분명합니다. 바로 체코의 완전한 해방입니다. 이 땅에 다시 우리의 주권이 바로 서는 그날까지, 우리의 모든 노력을 다할 것을 이 자리에서 엄숙히 선언합니다."\n\n조용하지만 결연한 선언에, 청중석의 체코인들은 굳은 표정으로 고개를 끄덕였다. 뜨거운 박수 대신, 결의에 찬 침묵이 장내를 감쌌다. 이윽고, 모두의 존경을 받는 토마시 마사리크가 연단에 섰다.\n\n"베네시 씨의 말처럼, 우리는 우리의 고향을 되찾아야 합니다. 하지만 기억해야 합니다. 이 땅은 이제 우리만이 아닌, 우리와 함께 살아갈 이웃들의 터전이기도 하다는 것을. 진정한 국가는 영토의 회복을 넘어, 서로 다른 이들이 조화롭게 살아가는 공동체를 이룰 때 완성됩니다. 서로의 다름을 존중하며, 함께 내일을 만들어 갑시다.""
 ABY_descision_focus_event.1.a:0 "각 민족은 저마다의 목소리로 만세를 외쳤다."
 
 ABY_descision_focus_event.2.t:0 "주데텐란트의 목소리"
 ABY_descision_focus_event.2.d:0 "마사리크에 이어, 주데텐 독일인을 대표하는 콘라트 헨라인이 연단에 섰다. 그는 감정을 드러내지 않는 차분한 어조로 연설을 시작했다.\n\n"존경하는 주데텐 동포 여러분. 우리는 너무나 오랫동안 우리의 목소리를 잃고 살아왔습니다. 우리의 정당한 권리는 반드시 보장되어야 하며, 빼앗긴 남부의 고향은 우리의 품으로 돌아와야 합니다. 이것은 우리의 생존권에 대한 요구이며, 우리는 이 이상의 것을 바라지 않습니다. 우리는 우리의 고향을 지키고자 할 뿐입니다."\n\n헨라인의 정제된 연설은 독일계 주민들에게 깊은 공감과 단단한 결속을 이끌어냈다. 그가 내려오자, 온화한 인상의 루트비히 체흐가 마이크 앞에 섰다. 그는 부드러운 미소와 함께 말했다.\n\n"고향을 지키고자 하는 마음은 우리 모두가 똑같을 겁니다. 이제 우리의 고향은 더 넓어졌습니다. 체코인 이웃과 아비도스에서 온 손님들 덕분이지요. 우리의 권리를 이야기할 때, 그들의 권리 또한 함께 생각하는 성숙함을 보여줍시다. 서로의 이야기에 귀 기울일 때, 우리는 비로소 진정한 이웃이 될 수 있을 겁니다.""
 ABY_descision_focus_event.2.a:0 "우레와 같은 박수소리가 장내를 휘감았다."
 
 ABY_descision_focus_event.3.t:0 "아비도스의 약속"
 ABY_descision_focus_event.3.d:0 "마지막 연설자는 아비도스 고등학교의 타카나시 호시노였다. 그녀는 특유의 나른한 표정으로 단상에 섰다.\n\n"으헤~ 뭐, 거창한 말은 잘 모르겠고. 우리는 그냥 우리 후배들이랑, 친구들이랑 다 같이 안전하게 지낼 곳이 필요해서 여기까지 왔어. 여기가 그런 곳이 될 수 있다면 좋겠네. 우리 애들을 건드리는 녀석들은 가만 안 둬. 그게 우리 아비도스의 유일한 원칙이야."\n\n꾸밈없는 말에 담긴 진심이 오히려 청중의 마음을 움직였다. 호시노가 물러나자, 오쿠소라 아야네가 차분한 목소리로 연설을 마무리했다.\n\n"저희의 시작은 동료를 지키는 것이었습니다. 그리고 이제 저희는 깨달았습니다. 이곳에 모인 우리 모두가 서로를 지켜주는 동료가 되어야 한다는 사실을 말입니다. 체코의 주권, 주데텐의 권리, 아비도스의 안전. 이 모든 것은 '우리 공동의 번영'이라는 하나의 목표로 이어집니다. 오늘 우리는 단순한 합의를 넘어, 새로운 미래를 함께 만들어갈 운명 공동체로서 첫걸음을 내딛는 것입니다."\n\n아야네의 선언과 함께, 세 대표는 협정서에 서명했다. 출신도, 이념도, 심지어 세계도 다른 이들이 맺은 이 깊은 약속. '두 세계의 국가'는 그렇게 희망과 과제를 안고 공식적으로 출범했다."
 ABY_descision_focus_event.3.a:0 "증오 속 화합의 이야기의 첫 장."

 ABY_descision_focus_event.4.t:0 "되찾은 안정"
 ABY_descision_focus_event.4.d: "군사 작전 보고서: 카타카타 관련 107호\n\n8구역 마지막 기지 함락 이후 도주한 카타카타 헬멧단 지도부는 에겔란트 방면 국경수비대를 제압하고 백귀야행으로 망명을 시도하였으나, 백귀야행군의 공격으로 감시초소 방면으로 후퇴하다가 초병에 발각, 헌병대가 투입되어 생포에 성공함.\n비고: 스나오오카미 시로코 헌병대장이 직접 선두에 나섬.\n\n각 구역에서 게릴라 활동을 하던 헬멧단 충성파는 지도부의 체포로 인해 대다수가 활동을 중지하고 항복함.\n\n투항하거나 생포된 이들이 많아 군 내에서 처리할 사안이 아니라고 판단되어 정부로 결정권을 이양.\n\n\n보고서: 법률위원회 782호\n\n현행법상 이들은 포로가 아닌 반란군으로 간주되어야 하며, 이 경우 단원들은 대부분 투옥될 것으로 보임.\n하지만 행정명령 111호로 인해 발효된 비상대권법상 이들은 저항군으로 간주하는 것이 가능하며, 이 경우 전쟁포로로 간주, 망명 혹은 제한된 군 복무가 가능함.\n\n요약: 법률 해석에 따라 저항군 혹은 반란군이 될 수 있으며, 각 경우의 처우 역시 달라짐. 따라서 행정부로 결정권을 이양함."
 ABY_descision_focus_event.4.a:0 "그들을 반란군으로 간주하고 재판에 넘겨라."
 ABY_descision_focus_event.4.b:0 "전투원 하나하나가 중요하다. 저항군으로 간주하라."

 ABY_descision_focus_event.5.t:0 "학생회장들의 계곡"
 ABY_descision_focus_event.5.d:0 "임시정부 내 키보토스인에 대한 수색이 마무리될 무렵, 민병대는 수색대를 편성해 학생회장들의 계곡으로 향했다. 사람이 거의 살지 않는 지역임에도 아비도스 내에서 가장 큰 전이 면적을 가진 학생회장들의 계곡은, 그 척박한 환경과 거대한 규모 탓에 수색이 지연되었다.\n\n결국 200명에 가까운 수색대를 편성하고 적응 훈련을 완료하고서야 해당 지역에 진입할 수 있었다. \n하지만 학생회장들의 계곡 깊이 아무리 들어가도, 인기척은 커녕 작은 동물의 소리도 들리지 않았다.\n\n"여기 정말 뭐가 있기는 한거야?"\n"그러게... 이제 밤이 다 되어 가는데..."\n"어? 저기 뭔가 있다!"\n"뭐?"\n\n수색대는 멀리 보이는 거대한 검은 형체로 다가갔고, 그들은 눈앞에 펼쳐진 광경에 할 말을 잃었다.\n\n"저건... 무슨..."\n"너, 좀 물어보자. 키보토스에는 저런 게 돌아다니는 거야?"\n"아니, 나도 저런 건 처음 봐..."\n"아비도스의 문장이 있어. 그래고 저건... 게헨나의..?"\n\n고층 건물만한 크기의, 함포로 무장한 검은 무장열차 앞에서 그들은 잠시 넋을 놓고 있었다."
 ABY_descision_focus_event.5.a:0 "사진, 사진기 있어?"

 ABY_descision_focus_event.6.t:0 "뇌제의 유산"
 ABY_descision_focus_event.6.d:0 "이 비밀병기에 대한 정보는 철저히 은폐되었고, 고위급 몇명만이 참석한 회의가 이루어졌다.\n\n"...열차포 셰마타. 과거 아비도스의 혼란기를 종식시키고 아비도스의 최전성기를 이끈 전설적인 학생회장의 이름을 딴 열차포에요."\n\n"그래서, 그것의 제원은 어떠합니까?"\n\n"부포로써 3연장 203mm 함포 1문, 1연장 152mm함포 2문, 2연장 127mm함포 6문이 장착되어 있으며, 주포로 500mm 플라즈마 포탑이 장착되어 있어요. 설명상 1톤 무게의 포탄을 500km밖까지 발사할 수 있다고 하네요."\n"500km반경은 현재 위치에서 독일 전역이 사정권에 들어오는 수준이에요."\n\n말도 안되는 제원에 좌중은 시끄러워졌다. \n지구에서도, 키보토스에서도 강위력한 무기에 대한 연구는 지속되어 왔으나, 갑자기 혜성처럼 나타난 이 비대칭무기는 (군사력에 한정한다면) 순식간에 이 조그만 국가를 패권국으로 올려줄 수도 있는 수준이었다.\n\n"하지만 뇌제의 유산이라는게 마음에 걸리네요... 저희가 뇌제의 유산을 소유하고 있는 것만으로도, 키보토스의 학원들은 기회가 생기는 대로 우리를, 정확히는 열차포를 파괴하려 들 거에요."\n\n"하지만 그렇다고 이 병기를 파괴하는 것은 국가적 손실일 뿐더러, 안전하게 파괴하는데 드는 비용은 천문학적입니다. 아야네 서기님 말대로 이것이 소유하는 것만으로 위협을 받을 수 있다면, 부술 수 없으니 차라리 사용하는 게 났지 않겠습니까?"\n\n기껏 강력한 병기를 얻었으나, 키보토스인과 현지인의 관점 차이로 인하여 토론은 끊이지 않았다."
 ABY_descision_focus_event.6.a:0 "한 통의 전화가 도착하기 전까지는."

 ABY_descision_focus_event.7.t:0 "파멸의 병기"
 ABY_descision_focus_event.7.d:0 ""예, 연립임시정부 내각입..."\n"아야네 서기님, 서기님이 얘기 하셔야 할 것 같습니다."\n"게헨나입니다."\n\n게헨나 선도부 정보부장의 전화. 셰마타 열차포에 대한 정보는 분명히 기밀로 정해 놓았을 텐데, 어떻게 유출된 거지? 아야네로서는 짐작조차 할 수 없었다. 통화의 내용은 간단했다. 셰마타 열차포는 게헨나에게 있어서 지우고 싶은 과거의 역사인 '뇌제의 유산'이자 위험한 대량살상병기에 속했다. 정보부는 이 열차를 파괴하는 것이 자신들의 뜻이라고 전했다.\n\n짧지만 무거운 통화가 끝난 뒤, 아야네가 말했다.\n\n"셰마타의 존재가... 유출됐어요. 게헨나가 이미 알고 있습니다."\n\n게헨나가 셰마타의 정보를 알게 되었다. 그리고 군사적 지원을 대가로 셰마타의 해체를 요구하고 있다. 이 사실에 회의실 전체가 술렁였다.\n\n"말도 안 됩니다! 극비로 관리해온 정보인데 어떻게..."\n"게헨나 정보부가 손을 썼을 겁니다! ...이건 명백한 내정 간섭입니다!"\n"그럼에도 적어도 그들이 우리에게 무조건으로 열차포를 파괴하라고 요구한 건 아닙니다. 어디까지나 군사적 지원이라는 조건을 내걸었습니다."\n"그 지원이 얼마나 도움이 될 지도 모르잖습니까. 열차포를 갖고 있는 게 더 이익일 수도 있는데...!"\n\n연립임시정부 내에서 시끄러운 소란이 벌어졌다. 아야네는 이런 소란을 제지하고 통제하는 카리스마는 없었다. 그저 키보토스와 현지인 대표들의 의견이 모일 때까지, 서로의 의견을 서기로서 정리할 뿐이었다. 다행히도 논쟁은 심각한 말다툼까지는 번지지 않았다. 빠른 답변이 필요하다. 그것만은 이곳에 모인 모두가 동의하고 있었으니까.\n\n결론은 정해졌다. 아야네는 다시 수화기를 들었다.\n\n"여러분의 제안을 긍정적으로 검토했어요.""
 ABY_descision_focus_event.7.a:0 "...셰마타 열차포는 파괴되어야만 해요."
 ABY_descision_focus_event.7.b:0 "...하지만, 역시 내정간섭은 받아들일 수 없어요."

 ABY_descision_focus_event.8.t:0 "지원 요구"
 ABY_descision_focus_event.8.d:0 ""
 ABY_descision_focus_event.8.a:0 "도움을 달라."

 ABY_descision_focus_event.9.t:0 "연방정부 선포"
 ABY_descision_focus_event.9.d:0 "연방정부 수립은 빠르게 이루어졌다... 이상하리만치 빠르게.\n\n마사리크의 노력 덕에 베네시가 가진 아비도스에 대한 의심은 빠르게 줄어들었으나, 그의 사후 체코와 오스트리아의 바람잡이들은 베네시의 마음 속에 남아있던 조그만 의구심의 불씨를 키워나갔다.\n\n에드바르트 베네시. 체코슬로바키아 독립영웅 3인중 1명이자 국부 토마시 마사리크의 제자. 그런 그였기에 신정부 수립 과정에서 마사리크의 조언을 대부분 그대로 수용하였다.\n...만약 그 바람잡이들이 없었다면 전부 수용했을 것이다.\n\n결국 그는 아비도스 대책위원회에 최소한의 권한만 분배하였고, 백귀야행과 산해경에 대한 보복적 정책을 시행했다.\n\n"역시나, 그분도 항상 완벽할수는 없어."\n"백귀야행과 산해경의 키보토스인들의 저항이 예상보다 적다라..."\n(아비도스의 그 아이들의 주장으로는)"키보토스인들의 총기에 대한 집착은 엄청난데... 총기몰수 명령에 산해경의 절반 - 아마 검은 용의 문 인가 뭔가 하는 이름이었을 것이다 - 이 무장반란을 일으킨 것 말고는 조직적인 저항은 없었다..."\n\n"조금 더 강경하게 나가도 되겠군.""
 ABY_descision_focus_event.9.a:0 "그의 눈은 냉정했으나 그 속에는 복수의 불씨가 타오르고 있었다."

 ABY_descision_focus_event.10.t:0 "대책위원회"
 ABY_descision_focus_event.10.d:0 ""우린 속은 거야! 속은 거라고!"\n\n"세, 세리카, 진정..."\n\n"응. 내가 당장 쳐들어가서..."\n\n"시로코 선배!"\n\n"으헤, 그럼 안돼, 시로코 짱."\n\n"아, 호시노 선배..."\n\n"그건 이 아저씨가 해야 하는거야."\n\n"..."\n\n"음~ 그래도 베네시 씨랑 나름 친해졌다고 생각했는데, 갑자기 저렇게 나오니 실망스럽네요..."\n\n"아하하... 흠흠, 그래도 다들 생각해 봐요."\n"선생님이 부탁했던 거긴 하지만 이건 원래 저희 일이 아니긴 했잖아요?"\n"저희가 위세같은걸 부리려고 그 제안을 수락한 게 아니잖아요, 그렇죠?"\n\n"그거야 뭐..."\n"그건 맞지."\n\n"어찌 보면, 이렇게 되었어야 하는 일이었어요. 선생님은 저희가 베네시 씨를 도우라 했던거지, 저희가 모든 걸 하라 하지 않았어요."\n"따지고 보면 선생님은 베네시 씨에게 국가 운영을 맡긴 거니, 의도한 대로 되었다고 할 수 있죠."\n"그리고, 베네시 씨는 똑똑한 분이잖아요? 분명 잘 해낼 거에요."\n\n"응. 그래도 배신감은 드는데... 아야네는 그렇지 않아? 선생님은 베네시 뿐 아니라 아야네도 후임자로 공인했잖아."\n\n"아쉬운 마음이 없다고 하면 거짓말이겠죠. 하지만 저희는 최근 몇년간 열심히 달려왔어요. 비록 대책위원회도 해체되고, 노노미 선배를 뺀 모두가 각자의 사정으로 졸업하게 되었지만, 그래도 이렇게 함께 만나서 이야기할 수 있으니 마치 옛날의 대책위원회로 돌아간 느낌이자 좋아요."\n\n"으헤, 그래, 아야네가 그렇게 생각한다면~ 우리는 우리 자리에서 최선을 다하자구.""
 ABY_descision_focus_event.10.a:0 "오-!"

 ABY_descision_focus_event.11.t:0 "가해자가 된 피해자"
 ABY_descision_focus_event.11.d:0 "새로 결성된 아비도스 연방정부의 에드바르트 베네시 내각은 추가적인 행정명령을 게시했다. \n프라하, 빈 등 대도시에서의 강제 퇴거 명령이 그것이었다.\n본래라면 해당 명령 정도로 문제가 발생하지는 않겠으나, 베네시 내각은 체코 내 강제퇴거에 체코계, 오스트리아 내 강제퇴거에 독일계를 이용하는 악수를 저질렀다.\n내각에서는 이가 훨씬 효율적이라고 여겼을지 모르나, 체코인과 오스트리아인의 키보토스인에 대한 증오는 상상을 초월했다.\n비록 (키보토스인은 현지인들보다 훨씬 강했기에) 학살 등의 고수위 사건은 발생하지 못했으나, 오히려 그렇기에 그들의 증오는 농축되어 행정상의 차별을 빚었다.\n\n"이게 무슨 소립니까... 분명 연방 칙령에는 이주비용이 지급된다고..."\n\n"아니 돈이 없다니까? 돈이 없는데 어떻게 줘?"\n\n"그럼 저흰 어디가서 뭘 먹고 살라는 말입니까..."\n\n"알빠야? 저기 프라하 교외에 생긴 판자촌으로나 가!"\n\n와 비슷한 일은 이제 일상이었으며,\n\n쾅! 쨍그랑!\n\n"야 이놈들아! 또냐! 아이고! 이게 몇번째야! 가구가 남아나는게 없네 아이고 아이고!"\n\n키보토스계 상점이나 식당에 화염병이나 급조 폭발물을 던지는 경우도 자주 일어났다.\n하지만 키보토스인은 겨우 이런 것으로 죽지도 않았고, 결국 그들의 증오만 차곡차곡 쌓이고 있었다.\n집단 린치는 일부 현지인이 키보토스인보다 다수인 지역에서 가끔 일어났으며, 아무리 때려도 쉽게 죽지 않는 키보토스인들은 그들의 좋은 놀이기구였다.\n\n한때 두 세계의 국가로 불리던 곳은, 이제 다뉴브의 화약고가 되어 화약이 차곡차곡 쌓여가고 있었고, 마침내 불씨가 지펴졌다.\n\n퍽!퍽!\n여느 날처럼 빈의 교외에선 린치가 일어나고 있었다.\n\n"어이, 이년아, 정신 들어? 앙?"\n\n"...잠깐, 디트리히. 이년... 움직이지를 않는데?"\n\n"...뭐?"\n\n한 산해경 학생을 둘러싸고 린치하던 십수명의 오스트리아 청년들은 일제히 얼어붙었다.\n\n"씨발... 숨을 쉬지 않...네...?"\n\n"빨리... 빨리 삽 가져와 이 새끼들아!"\n\n그들은 죽은 소녀를 급히 파묻었으나, 그들은 삽질에 열중하느라 수풀이 부스럭거리는 소리를 듣지 못했다."
 ABY_descision_focus_event.11.a:0 "그리도 다음날, 해당 사건은 신문에 대서특필 되었다."

 ABY_descision_focus_event.12.t:0 "폭풍전야"
 ABY_descision_focus_event.12.d:0 "베네시는 전국 각지에서 올라오는 전보를 받아들고 식은땀을 흘렸다.\n빈에서의 린치로 산해경의 학생이 사망한 이후, 키보토스인들은 더 이상 당해주지 않았다.\n그들은 경찰서와 군부대를 습격하였고, "남키보토스 연합전선"을 창설해 조직적으로 연방정부에 대항하였다. 다행인 점이라면, 아직 보복성의 대량 학살이 일어나지 않았다는 점이 있지만 식견 있는 자라면 그것이 머지않았다는걸 알 것이었다.\n\n그리고 그것은, 베네시 역시 깨닫고 있었다.\n"아...아아..."\n어디부터 잘못된 것일까.\n그는 이 상황을 타개할 방법을 모색했다.\n떠오르지 않았다.\n좆된거다. 아주 제대로 좆된것이다.\n자신의 잘못이 아니라고, 정신승리를 해 보았다.\n하지만 그의 양심이 발목을 잡았다.\n그래. 이건 자신의 잘못이다.\n그리고 자신이 지도자로 있는 한, 이 상황을 멈출 수는 없으리라고, 그는 확신했다.\n하지만 저들에게 정권을 넘길 수는 없다. 그렇게 된다면, 마사리크의 유산은 무너시게 될 것이다.\n마사리크의 유산을 지키며 이 상황을 타개할 이들...\n아."
 ABY_descision_focus_event.12.a:0 "단 하나 있었다."

 ABY_descision_focus_event.13.t:0 "국가를 위한 연기"
 ABY_descision_focus_event.13.d:0 ""전권... 나와 정부의 전권을 넘기겠네."\n"제발, 나를 어떻게 해도 좋으니 연방을 지켜주게..."\n\n"하, 이제 와서 이런다고, 베네시 씨?"\n\n"선배, 지금은 싸울 때가 아니야."\n\n"저 뻔뻔한 사람이 다 망쳐놓은걸 우리보고 수습하라는 거잖아! 자기는 쏙 빠지고!"\n\n"미안하... 아니 사죄드리겠습니다. 제 능력을 맹신하여 이런 결과가 나오게 된 죄, 달게 받겠습니다. 하지만 부디, 제 제안을 들어주십시오."\n\n"또, 또 무슨 소리를..."\n\n"선배."\n\n"...그래, 한 번 들어나 보자."\n\n베네시의 제안을 한 줄로 요약하자면 정치적 쿠데타였다. 자신이 국가를 좀먹는 기회주의자들과 함께 몰락한 다음 아비도스, 특히 아야네가 자신을 탄핵하고 대통령이 되어 유화책을 펼치자는 제안.\n\n"그러니까 결국 아야네보고 악역을 맡으라는 거잖아!"\n\n"...예, 그렇습니다."\n베네시는 입술을 꽉 깨물었다.\n\n"아야네, 이자식의 말은 들을 필요도 없어. 이건..."\n\n"받아들일게요."\n\n"...어째서야?"\n"이 나라랑 우리가 무슨 상관이 있다고! 우린 아비도스만 지키면..."\n\n"선생님과 약속했어."\n"이 나라가 아비도스의 이름을 쓰는 날이 오면, 아비도스계 키보토스인만이 아비도스인이 아니라고... 체코, 오스트리아, 백귀야행, 산해경... 아비도스의 안에 사는 모든 이들이 아비도스인이라고."\n"우리는 아비도스를 지키는 거야. 우리는 늘 하던 일을 하는거야.""
 ABY_descision_focus_event.13.a:0 "아비도스를 위해서는 악역도 맡아야 해."

 ABY_descision_focus_event.14.t:0 "연방의 아침"
 ABY_descision_focus_event.14.d:0 ""아, 아. 안녕하십니까. 2대 연방대통령 오쿠소라 아야네 인사드립니다."\n"초대 대통령 에드바르트 베네시의 계엄 시도로 인하여 지난 밤 불편을 드린 점 대신 사과드립니다."\n"전해들으셨겠으나, 다시 한 번 공지드립니다. 저희 아비도스 신정부는 내란을 획책하고 민주주의 질서를 파괴하려 한 베네시 내각을 탄핵하고 베네시 내각의 불필요하고 과도한 행정명령을 철회했습니다."\n"철회 내역은 다음과 같습니다. 키보토스인 강제 퇴거 명령, 참정권 박탈,..."\n\n훗날 "연방의 가장 긴 밤"으로 불릴 사건이 끝난 후 새로 출범한 아야네 내각의 첫 방송이었다.\n비록 무장해제 행정명령과 같은 일부 주요 명령은 철회되지 않았고, 키보토스인에 대한 추가 과세 조항은 완화된 수준으로 그쳤으나, 대다수의 남키보토스인들에게 그간 외부에서 주로 체코 임시정부의 괴뢰조직 격으로 치부되던 아비도스의 집권은 키보토스인의 혁명으로 비추어졌고, "남키보토스 연합전선"이 와해되는 결과를 낳았다. \n일부 식견 있는 자나 극렬분자들은 아비도스와 체코 임시정부가 한편이었음을 꿰뚫어 보고 극렬히 저항했으나, 그들의 저항은 남키보토스인들의 외면 아래 서서히 사라져갔다.\n\n의외로 베네시가 우려했던 현지인의 극렬한 저항은 일어나지 않았다. 그것이 아비도스는 자신들을 압제하지 않을거라는 믿음이었을지, 그저 키보토스인의 재집권에 자포자기한 것일지는 모르겠으나, 아무튼 좋은 일이었다."
 ABY_descision_focus_event.14.a:0 "연방의 아침 해는 밝게 떠올랐다."

 ABY_descision_focus_event.15.t:0 "자진입학"
 ABY_descision_focus_event.15.d:0 "헉...헉...\n아 씨발 좆됐네.\n며칠 굶어서 현지인 상점 좀 털려고 들어갔는데, 마침 딱 아비도스의 민병대와 마주해 버렸다.\n\n"헉, 헉... 죽어도 아비도스 같은 망한 학원에는 안들어간다."\n\n몇주 전 임시정부 영내에서 활동하는 키보토스인은 아비도스 소속이 아닐 시 백귀야행 스파이로 간주하고 체포 및 구금된다는 행정명령이 발의되었다. 행정명령이 발의됨에 따라 아비도스 내 대다수의 무소속/백귀야행 소속의 시민들은 시민권을 재발급 받았으며, 행정명령에 반발한 대규모 학생 조직은 카타카타 헬멧단을 제외하고 전부 2주 내로 토벌되었다.\n\n소녀, 나가사와 유이는 그저 아비도스가 싫었다.\n거창한 이유가 아닌, 그냥 망한 학교에 들어가기 싫었다.\n그래서 소녀는 무소속으로써 숨어다녔다... 오늘 들키기 전까지는.\n\n"아."\n\n그때 발에 무언가 걸렸고, 소녀는 그대로 넘어져 바닥을 굴렀다.\n바로 일어나 도망치려 하였으나, 결국 잡히고 말았다.\n\n"음, 나가사와 유이, 무소속, 헬멧단에 딱히 가입된 적은 없군."\n\n"저...저는 감옥에 가는 건가요?"\n\n"원칙상은 그런데... 이정도면 선처를 베풀어줄 수도 있겠네."\n\n"서, 선처요? 감사, 감사합니다!!"\n\n"이제라도 아비도스에 입학 신청서를 쓰는 조건으로."\n\n"에..?"\n"그...혹시 거절하면 어떻게 되나요..?"\n\n"그러면, 음... 너라면 헤일로 형벌부대에 배정되겠군."\n\n"네..? 네??"\n"받아들일게요! 입학할게요!!"\n\n"좋아, 아비도스에 자진입학한 걸 환영한다! 아쎄... 아니 학생!"\n\n아비도스의 학생은 반드시 군사훈련을 받고 군에 배정된다는걸 알았다면, 소녀는 다른 결정을 내렸을까? 참으로 기열같은 이야기라 할 수 있겠다."
 ABY_descision_focus_event.15.a:0 "따흐흑."

 ABY_descision_focus_event.16.t:0 "변절자"
 ABY_descision_focus_event.16.d:0 ""이, 이게 무슨..."\n\n남자의 눈 앞에는 인세의 지옥도가 펼쳐져 있었다.\n섬광과 함께 나타난 머리에 고리가 달린 이상한 사람들, 걸어다니는 동물들이 시민들을 마구 총으로 쏘고 있었다.\n아름다웠던 프라하는 순식간에 피바다로 변했다.\n\n"이 미친 놈들아! 뭐하는 짓이냐!"\n\n그는 어린 아이에게 총을 겨눈 한 여자를 밀치며 외쳤다.\n철컥.\n그의 눈앞에 총구가 드리웠다.\n탕.\n\n"으헉! 으아, 으아아!"\n남자는 비명을 지르며 잠에서 깨어났다.\n이 악몽을 벌써 며칠째 꾸고 있던가.\n\n남자, 오스카 쉰들러는 백귀야행에 협조하는 변절자 중 하나였다.\n그는 독일의 나치 정권에 협조하는 스파이로 활동하다가, 1935년 들통나 수감되었었다. 허나 대전이가 발생하며 감옥은 통제력을 잃었고, 그 역시 탈옥할 수 있었다. 그는 탈옥하며, 기필코 자신에게 치욕을 준 체코인들에게 복수하겠다 다짐했다.\n\n하지만 그는 회의감을 느꼈다.\n잠깐의 감정이었던 복수심은 날이 갈수록 약해져 갔다.\n그리고 그 빈자리를 채운 것은 백귀야행에 대한 거부감이었다.\n그저 재미로 사람들에게 총을 쏘고 수류탄을 던지던 그들에게, 쉰들러는 인륜적인 거부감을 느꼈다.\n이틀 전 그들이 체포된 어린아이와 여자들을 체코 저항군이란 이유로 광장에서 즉결처형하는 모습을 보았을 때 그는 이루 말할 수 없는 충격을 받았다.\n\n그는 그때 이후로 체코인들을 자신의 공장에 숨겨주기 시작했다.\n그것은 체코인에 대한 연민의 감정 따위가 아닌, 백귀야행에 대한 역겨움, 그 거부감에 의한 것이었다.\n\n하지만 숨겨주는데는 한계가 있었고, 그는 자신이 그들 모두를 구할 수 없는 것에 괴로워했다.\n\n"...들러."\n"쉰들러. 듣고 있나?"\n\n"아, 디트리히. 미안하군. 잠시 딴 생각을 하느라."\n\n"그래, 아무튼 어떻나? 내 사업 구상이?"\n\n이들도 자신과 같은 "변절자"들.\n많은 독일계 사업가들이 백귀야행 정부에 붙어 동포를 착취하며 호화스러운 생활을 영위했다.\n자신 또한 그런 이들 중 하나였기에, 그는 죄책감을 느꼈다.\n\n"...그래서, 요즘 정부에서 체코인 수감자들을 공급해줘서, 인건비도 안 들고 좋다니까."\n\n그들에 대해 역겹다는 생각이 들려는 찰나, 무언가 그의 머리를 스쳤다.\n그리고 그는 아주 오랜만에, 미소지을 수 있었다."
 ABY_descision_focus_event.16.a:0 ""그래, 그거 정말 좋은 생각인데?""

 ABY_descision_focus_event.17.t:0 "쉰들러 리스트"
 ABY_descision_focus_event.17.d:0 ""여기, 신청했던 수감자들이오."\n\n키보토스인 관료는 체코인 수감자들의 명단을 넘겨주며 쉰들러에게 눈짓했다.\n그러자 쉰들러는 익숙하게 소매에서 금붙이를 꺼내 그에게 내밀었다.\n\n"흠, 앞으로도 연합학원을 위해 노력해주기를 바라오."\n\n쉰들러가 깨달음을 얻고 1달 정도 지났을 무렵, 쉰들러의 공장 단지에는 수만명의 체코인이 보호받고 있었다.\n키보토스의 장비는 현재의 기술로는 완벽히 재현하는게 불가능하기에, 그의 공장에서는 다른 공장에 비해 '좀 더 많은' 불량품이 발생했으며, 근무 인원에 비해 생산량이 '다소' 부족했으나, 그의 소매에서 나온 금붙이 덕에 큰 문제는 없었다.\n\n쉰들러가 백귀야행 정부에 공장 규모에 비해 '다소' 많은 수의 수감자를 요청했기에, 원래 처형되었어야 할 저항군 포로도 그의 공장으로 인도되었다.\n\n쉰들러는 인도받은 수감자들이 공장으로 들어가는 모습을 보았다.\n어린아이와 여자들의 비율이 꽤 높았으나, 그들은 '숙련된 금속공' 이었다. 공장으로 들어가는 이들의 면면은 겉으로는 침울했으나 그 눈빛만은 희망을 찾은 듯 밝게 빛났다.\n\n그날 저녁 쉰들러가 공장을 시찰할 때, 한 노인이 그에게 다가왔다.\n노인은 그에게 선물이라며 자투리 금속으로 만든 클립 배지 하나를 건넸다.\n수감자를 굴리는 부패한 사업가인 그에게는 어쩐지 선물을 주는 체코인 수감자가 많았기에 별 의심 없이 배지를 받아들었다.\n공장 시찰을 마치고 퇴근하기 전, 그는 집무실에서 웃음을 지으며 노인이 건넨 배지를 이리저리 살펴보았다.\n\n"흠, 노인 혼자서 만들었다기엔 상당히 고급스럽군. 이거 평소에 차고 다녀도 이상하지 않겠는데?"\n\n그는 거울 앞에서 노인이 건네준 배지를 자신의 고급 양복에 차 보았다.\n\n툭.\n\n배지를 차자, 배지에서 돌돌 말린 조그만 종잇조각이 떨어졌다.\n의아하게 여기며 종이를 펼쳐보자, 전화번호와 함께 '쉰들러 리스트를 받았습니다' 라는 글귀가 적혀있었다.\n\n쉰들러는 문을 걸어잠그고 그곳에 전화를 걸었다.\n\n이윽고 전화를 받은 상대는 유창한 독일어로 말했다.\n"쉰들러 씨, 좋은 밤이네요. 리스트는 받았습니까?"\n\n쉰들러는 손을 덜덜 떨며 대답했다.\n"네. 쉰들러 리스트를 받았습니다."\n\n그러자 수화기 반대편에서 대답했다.\n"반갑습니다, 쉰들러 씨.""
 ABY_descision_focus_event.17.a:0 ""두 세계의 국가에서 연락드립니다.""

 ABY_descision_focus_event.18.t:0 "모든 것을 바쳐서"
 ABY_descision_focus_event.18.d:0 "방만했지만 자신의 공장만큼은 매일 들리던 쉰들러는 이례적으로 그날은 공장에 나오지 않았다.\n해가 중천에 떠있었지만, 쉰들러는 가만히 침대에 누워 어제의 제안을 생각할 뿐이었다.\n\n"오스트라바에서 독일계 레지스탕스의 조직을 돕고 숨겨줄 수 있겠는가, 만약 들킬 것 같다면 거절해도 좋다...라..."\n\n솔직히 들킬 거라는 생각은 별로 안들었지만 그를 망설이게 하는 것은 따로 있었다.\n'두 세계의 국가' 아비도스 임시정부는 백귀야행과 산해경에 대항하는 조직이자, 체코와 오스트리아 현지인들의 지지를 받는 조직이었다.\n그러나 쉰들러는 그들이 이길 것이라는 확신이 들지 않았다.\n그 조그만 조직이, 현지인들의 지지가 있다 한들 강력한 백귀야행과 산해경을 꺾을 수 있으리라고는 생각되지 않았다.\n그러나 한편으로는, 그가 레지스탕스 조직을 돕는다면 이길 확률이 조금이나마 늘어나지 않을까 하는 생각도 들었다.\n오만 생각이 교차하는 와중, 그는 어떠한 한 생각에 미쳤다.\n\n그는 침대에서 일어나 자신의 금고를 열어보았다.\n금고에 가득하던 금붙이는, 이제 한 줌 정도밖에 남지 않았다.\n\n"부귀영화를 누리고 싶었는데..."\n"...쓸데없는 데 붙잡혀 이룬 모든 걸 잃게 생겼구만...하하..."\n말은 그렇게 했지만, 딱히 후회는 들지 않았던 것은 어째서일까.\n결정을 내렸다.\n그는 부패한 사업가였고, 결정을 내린 이유도 그러했다.\n"흐흐... 그래 어차피 저들이 이기지 못하면 난 죽는거잖아?"\n"...만약 도와주면, 국가적인 포상을 하겠다고 했지?"\n"그래, 아직 난 늙지 않았어. 부귀영화를 누릴 기회도 많다고! 하하하!""
 ABY_descision_focus_event.18.a:0 "그는 홀가분한 표정으로 임시정부에 전화를 걸었다."

 ABY_descision_focus_event.19.t:0 "토마시 마사리크의 죽음"
 ABY_descision_focus_event.19.d:0 "똑똑.\n"아직 주무세요?"\n가정부는 문을 조심스럽게 열고 들어갔다.\n"마사리크 씨, 아직까지 자고 있으면 어떡해요. 약 먹어요..?"\n마사리크는 곤히 잠든 듯 보였으나, 가정부의 말에도 미동조차 없었다.\n가정부는 조심스레 그의 코 밑에 손을 가져다 댔다.\n\n털썩.\n"아, 아아..."\n\n보헤미아의 아버지, 철인 왕, 초대 대통령, 선생님...\n토마시 가리크 마사리크는 그날 밤, 곤히 잠든 사이에 평화롭게 세상을 떠났다."
 ABY_descision_focus_event.19.a:0 "마사리크, 우리 아버지, 당신의 아이들을 믿어주세요."

 ABY_descision_focus_event.20.t:0 "작별"
 ABY_descision_focus_event.20.d:0 "아비도스 고등학교 대책위원회 부실.\n\n이른 아침부터 아비도스 고등학교에 전화가 걸려왔다.\n"네, 아비도스 대책위원회 입니다."\n"..."\n\n툭.\n\n"아야네?! 무슨 일이야?"\n\n"선생님이... 돌아...가셨대요..."\n\n"...뭐?"\n"네..?"\n"그..그게 무슨 소리야?!"\n\n드르륵.\n\n"시, 시로코 쨩!"\n\n뛰쳐나간 시로코를 찾아 호시노와 세리카가 덩달아 뛰어나갔고, 노노미는 남아 울고 있는 아야네를 위로했다.\n\n\n임시정부 청사.\n\n따르릉.\n"예, 베네시입니다."\n\n"...뭐라고요?"\n"그럴리가... 없습니다... 그분이, 스승님이..."\n"...바로 가겠습니다."\n\n\n주데텐 독일인당 당사.\n\n"콘라트 헨라인입니다."\n\n"지금, 뭐라고, 하셨습니까?"\n"그분이... 결국 돌아가신 겁니까..."\n"지금 가도록 하겠습니다.""
 ABY_descision_focus_event.20.a:0 "부고는 순식간에 전달되었다."

 ABY_descision_focus_event.21.t:0 "보헤미아의 아버지"
 ABY_descision_focus_event.21.d:0 "본래 국장으로 치뤄져야 했을 마사리크의 장례식은 카를로비바리의 광장에서 간소하게 치뤄졌다.\n장례식 전에 미리 카를로비바리로의 이동을 차단했음에도 수만 명의 인파가 모였다.\n아이러니하게도, 보헤미아의 아버지 토마시 마사리크의 장례식에 모인 대부분의 인구는 주데텐 독일인이었다. 원체 체코계 인구가 적기도 했지만 그것은 문제되지 않았다.\n체코의 아버지라고 불렸어야 할 마사리크는 보헤미아의 아버지로 불렸다. 이는 체코인 뿐 아닌 보헤미아의 독일인들의 아버지이기도 하다는 뜻이었으며, 독일인들 역시 마사리크를 아버지와 같이 존경하고 또 진심으로 추모했다.\n\n카를로비바리의 광장에서, 그의 후계자중 하나인 오쿠소라 아야네가 먼저 짧은 추도사를 마쳤고, 주데텐 독일인당 대표 콘라트 헨라인이 이를 이었다. 그리고 그의 또 다른 후계자, 에드바르트 베네시가 마지막 추도사를 읽었다.\n\n"...마사리크는 떠난 후에도 우리 가운데 남아 있으며, 그는 우리 모두에게 모범이자 도전이었습니다. 오늘날 유럽과 세계가 절실히 필요로 하는 위대한 인간 신앙의 사례입니다. 우리에게 남겨진 것은, 작금의 전무후무한 유럽의 위기 상황에서, 키보토스와 유럽이 선의와 우의를 구축하게끔 하는 과제입니다. 그러면 우리는 1936년 이후 유럽에서 가장 완벽하고 조화로우며 사회적으로, 국가적으로, 정치적으로 정의로운 완전히 새로운 국가를 창조할 수 있을 것입니다. 이는 우리의 생존과 미래를 위해 반드시 만들어야 할 국가이며, 모든 유럽과 키보토스의 국가들에게 마사리크가 우리 사이에서 보였던 것과 같고, 마사리크가 전 세계에 보였던 것과 같은 그의 유산을 지키기 위한 존재가 될 것입니다..."\n"...해방자 대통령이시여, 우리는 당신의 길을 따라 다시 한 번 고향을 해방하고, 우리 손에 물려주신 유산에 충실할 것입니다!"\n\n베네시가 추도사를 마무리하자, 가장 오래된 체코와 유럽의 성가인 성 바츨라프 성가가 울려퍼졌다.\n\n이후 마차가 그의 시신을 싣고 광장을 벗어나 언덕을 따라 올라갔다. 이때 관을 7명의 병사가 호위했는데, 이는 연방을 이루는(혹은 이룰 예정인) 7민족을 상징하는 것이었다.\n\n마차는 임시정부 청사에 멈추어 섰으며, 뒤뜰에 안치되었다.\n원래 그는 그의 가족이 묻힌 라니에 안치되어야 했으나, 마사리크는 생전 '...내 죽은 몸을 위해 많은 노력을 쏟지 말라... ...아무나 찾아올 수 있는 곳에 묻고 옮기지 말라...' 라는 말을 남겼다고 전해진다.\n\n그리고 살아남은 자들은, 그의 유산을 지키기 위하여, 고향을 해방하기 위하여, 키보토스와 유럽의 신뢰와 우애를 위하여 나아갈 것이다."
 ABY_descision_focus_event.21.a:0 "우리는 충실할 것이다.\n진실은 승리한다."

 ABY_descision_focus_event.22.t:0 "주데텐란트, 우리 주데텐란트"
 ABY_descision_focus_event.22.d:0 "주데텐란트의 독일인들을 대변한 독일계 장관 루트비히 체흐.\n그는 도피 중 눈먼 탄환에 맞고 죽을 고비를 여러 번 넘겼다.\n비록 몰락했다는 아비도스였지만 전이된 자치구 내에 작은 병원이 존재했고, 체흐는 긴급 수술을 받아 살아남을 수 있었다.\n하지만 늦은 치료로 인해 발생한 합병증은 그의 건강을 크게 해쳤고, 1937년 3월, 그는 운명을 달리했다.\n\n그리고 그의 사후, 새로이 주데텐 독일인들의 대변자이자 삼두정의 일원이 된 이는 주데텐 독일인당의 당수, 콘라트 헨라인이었다.\n\n"어쩌다 이렇게..."\n\n헨라인은 때때로 헨라인주의로 불리는 주데텐 민족주의의 창시자였고, 그가 이끄는 주데텐란트는 점차 체코슬로바키아 내 자치권이라는 최종적 목표에 다다르고 있었다...\n하지만 대전이라는 사태는 그를 국가의(독일인들의) 지도자로 단숨에 올려놓았고, 연방의 선전으로 오스트리아의 독일인들마저 그를 오스트리아계 독일인들의 구원자로 여기게 되었다.\n\n"그, 그래, 콧수염쟁이한테나 선동당하는 프로이센 촌놈들보다야 오스트리아가 났지..."\n"아씨... 하... 나는 그냥 평범한 주데텐인이라고! 왜 나한테 그렇게 기대하는거야!"\n"마사리크 씨, 이럴 떄 당신은 어떻게 하실 겁니까..."\n\n마사리크의 제자이자 후임자인 베네시가 그와의 대화와 타협을 거부할 때마다, 그는 자연스레 베네시의 스승인 마사리크 역시 비슷할거라고 지레짐작했다.\n하지만 그가 직접 만난 마사리크는 전혀 달랐다.\n그는 주데텐 독일인들을 이방인으로 보았을지언정 포용과 대화의 대상으로 보았지 베네시마냥 침략자로 보지 않았다.\n\n"그래서 왜 베네시를 내버려 뒀느냐 했더니 그게 민주주의라고? 허 참..."\n"그분이 민주주의자인게 참 아쉽구만. 그것만 아니었으면 당장 스승으로 모셨을 텐데 말이야. 하하..."\n"민주주의는, 참 비효율적이란 말이지. 베네시 같은 스승 말조차 무시하는 썩은 암덩어리는 당장 잘라내야 하는데 말이야."\n\n그는 올라온 보고서에 적힌 이름을 보고 얼굴을 찡그리며 말했다.\n\n"...그리고 이 자식같은 암덩어리도.""
 ABY_descision_focus_event.22.a:0 "카를 헤르만 프랑크."

 ABY_descision_focus_event.23.t:0 "주데텐 헨라인당"
 ABY_descision_focus_event.23.d:0 "그저 신생 체코슬로바키아 공화국에서 주데텐 독일인들의 지도자로써 자치권이나 얻을 생각이었던 헨라인의 계획은 1935년부터 어그러지기 시작했다.\n물론 민주주의를 비난하고, 실제로 민주주의라는 체제를 그리 좋아하지 않기도 했지만, 그보다 '보헤미아의 상병' 나부랭이가 부르짖는 '대독일주의' 따위보다야 훨씬 나은 것이라고 생각했다.\n나치당의 집권 이후, 오스트리아에서 국가사회주의 운동이 정권을 위협한 데 반해 주데텐란트가 상대적으로 조용했던 이유도 이곳에 있었다.\n\n"그 망할 프랑크와 칫솔수염이 방해만 안했다면 말이야..."\n\n나치당의 독일에 대항해 헨라인은 별로 좋아하지 않던 민주주의에 대한 찬양을 하고 나치를 비난하며 당내 핵심인물들을 독일이 아닌 헨라인 개인에게 충성하게끔 했다.\n그리고 대전이가 일어나기 얼마 전 그의 충실한 당원, 카를 헤르만 프랑크가 그를 프라하 근교의 소도시로 불렀다.\n\n"프랑크, 네가 날 따로 부르기는 처음이군. 고발할 것이 있다고?"\n\n"아, 안녕하십니까. 당수님."\n"다름이 아니고, 부패의 흔적이 보여서 말입니다."\n\n"부패라! 당연히 척결해야 할 것이지! 잘 해주었다, 프랑크."\n\n"하하, 감사합니다. 그래서 말입니다... 이 부패 건에 대해서 설명해 드릴까요?"\n\n하지만 예상과 달리 그의 말이 이어질수록 헨라인은 창백해졌다.\n\n"...그래서, 독일 영사관에서 유입된 거의 15000라이히스마르크에 달하는 거금이, 어디로 사라진 건지 모르겠군요. 그렇게 국가사회주의를 싫어하시는 당수님이 그 돈을 사용했을리는 없잖습니까?"\n\n물론 독일로부터 돈을 받아먹기는 했다. 거하게 뒤통수를 쳐 그걸 반나치 활동에 사용하긴 했지만...\n프랑크가 그들의 끄나풀이라고는 생각치 못했다. 그래서 그에게도 자금의 이용을 알렸는데...\n\n"같잖은 위선 떨지 말고. 뭘 말하고 싶은거냐, 프랑크."\n\n프랑크는 대답 대신 권총을 꺼내들었다.\n\n"이게 무슨..."\n\n"아아, 당수님. 독일인이라면, 마땅히 하나된 대독일의 품에서 함께 번영을 누려야 하지 않겠습니까?"\n\n"개소리들 말이..."\n\n끼릭.\n"앞으로 한 마디 하실때마다, 제 손가락이 조금씩 움직일 겁니다."\n"그러니까 앞으로는 내 말에 예 아니오로만 대답한다 헨라인, 알겠나?"\n\n"...예."\n\n그는 주데텐 독일인당을 움직여 나치 독일과의 합병을 찬성하는 여론을 만들라고 지시했다.\n눈앞에 총구가 겨누어진 상황에서, 헨라인은 알겠다고 대답할 수밖에 없었다.\n\n하지만 지금, 상황이 바뀌었다.\n\n"노이만, 슈벤하르트... 허, 다들 내 앞에서는 갖은 아양은 다 떨더니만, 이런 깜찍한 파티를 준비중이었군."\n\n그날 이후 헨라인은 그의 수족을 움직여 당내 나치에 동조하는 이들을 식별했고, 이제 그들을 일망타진 할 수 있게 되었다."
 ABY_descision_focus_event.23.a:0 ""빠르게 움직여야지, 그자식이 알아채기 전에.""

 ABY_descision_focus_event.24.t:0 "속마음 대결"
 ABY_descision_focus_event.24.d:0 "모두가 잠든 야심한 밤, 마사리크의 방에는 희미한 잔등이 여전히 켜져 있었다.\n에드바르트 베네시, 리하르트 테사르지크... 마사리크는 수첩에 쓰인 이름들을 보며 그들에게 줄 조언을 적었다.\n"허, 벌써 마지막 장인가. 오늘은 빨리 끝나겠구만 그래."\n수첩의 마지막 장에는 낮선 이름들이 적혀 있었다.\n\n오쿠소라 아야네: 자신감 부족. 나이 컴플렉스? 똑부러지고 융통성 있음.\n이자요이 노노미: 이사회와는 껄끄럽지만 전보다는 잘 지내는 듯 하다. 경제에 대한 흡수력이 빠름. 조기교육을 받았나?\n쿠로미 세리카: 잘 속지만 일은 절대 대충하는 법이 없다. 올바른 서류는 빈틈없이 완벽. 틀린 서류를 잡아내는 능력을 길러주자.\n스나오오카미 시로코: 신체능력, 지휘 능력, 리더십 모두 우수. 하지만 뭐랄까... 야생성? 같은 느낌이 강하다. 그래도 계속 나아지는 중.\n타카나시 호시노: 친근한 웃음으로 감정을 숨기는 데 우수... 나를 경계한다. 어째서일까?\n\n마사리크는 마지막 이름을 보며 생각에 잠겼다.\n\n...\n\n호시노는 최근 밤잠을 이루지 못했다. 태평해 보이기 위해 하던 낮잠 자는 척도 최근에는 진짜로 잠든 적이 많았다.\n이해되지 않았다. 마사리크, 귀여운 후배들이 어째서 그 <어른>을 따르는지.\n\n나름 사람의 속마음을 꿰뚫어 보는데 자신이 있었던 호시노지만, 그 노인의 마음은 당최 알수가 없었다.\n모든 호의에는 대가가 따른다.\n호시노는 이를 뼈저리게 체험했다.\n하지만, 후배들이 선생(센세)라고 부르는 저 어른이 내걸 '대가'는 도대체 무엇일지, 호시노는 알 수 없었다.\n\n"9억엔..."\n9억엔. 아비도스에게는 많지만 다른 학원들에게는 장부에서도 무시될 만큼 작은 돈.\n그 작은 돈을, 여러 어른들은 목줄 쥐듯 잡고 이용해먹었다.\n그런 중요한 목줄을, 마사리크는 주저 없이 끊어냈다."
 ABY_descision_focus_event.24.a:0 "호시노는 도저히 이 대가를 감당해 낼 자신이 없었다."

 ABY_descision_focus_event.25.t:0 "기업과 정부"
 ABY_descision_focus_event.25.d:0 ""...이것으로 협약이 체결되었습니다."\n"내용은 다음과 같습니다."\n"첫째, 네프티스 그룹 사유지의 통제권을 임시정부로 이관한다."\n"둘째, 연방정부는 체코와 오스트리아의 산업 시설 중 일정한 비율을 네프티스에 양도하며..."\n\n"잘 되었네요! 마사리크 씨!"\n\n"예. 임시정부 대변인으로써 감사를 표합니다, 노노미 씨."\n\n두 사람이 손을 맞잡으며 공식적으로 네프티스 그룹의 사유지가 임시정부에 귀속되었다.\n그리고 협상의 주역인 두 사람은 함께 차를 타고 임시정부로 복귀 중이었다.\n\n"너~무 힘들었다고요? 선생님!"\n\n"허허, 그래도 이젠 엄연히 한 기업의 총수 아닙니까, 노노미 양. 이사회가 운영을 주도한다고는 하지만 큰 행사에는 이제 자주 참석하셔야 할 건데, 벌써부터 이러면 안되죠."\n\n"으으...미리 결과를 정해 놓고 하는것도 이렇게 힘든데, 실제 협상은 얼마나 힘들지 모르겠어요..."\n\n"노노미 양에게 좋은 소식 하나 말해주자면, 의외로 대부분의 협상은 실무진이 미리 하고 이런 식으로 결과를 정해 놓는 경우가 많답니다. 이건 제 정치경험에서 나온 결과이니 경제에서는 조금 다를 지도 모르겠지만, 경제와 정치는 비슷하니 참고할 만 할겁니다."\n\n"그래도 불안하네요... 돌발상황이라도 발생하면..."\n\n"음, 그렇다면 노노미 양의 불안감을 덜어주기 위해 오늘 특별 과외나 한 번 해볼까요? 마침 시간이 남으니, 여러 상황에 대한 대처법을 배워보는 것 어떨까요?"\n\n"음... 쉬고 싶지만 이런 기회는 자주 없으니까요~ 네!"\n\n"껄껄, 길게 안 하겠습니다. 그럼, 어떤 쪽 일 위주로 알아보고 싶나요?""
 ABY_descision_focus_event.25.a:0 ""음~ 경영보다는 일반적 정치를 배우고 싶네요~!""
 ABY_descision_focus_event.25.b:0 ""음~ 경영에 관련된 정치 팁을 배우고 싶어요~!""

 ABY_descision_focus_event.26.t:0 "분리된 통합"
 ABY_descision_focus_event.26.d:0 ""자치구 내 경찰력이 좀 더 필요하겠구만~"\n\n"예, 청장님."\n호시노는 몸을 돌려 나가려던 비서를 불러세웠다.\n\n"아, 조건은 이전이랑 같게 해줘. 군에서 차출하지 말고 민간에서 뽑고, 인구비에 맞춰서, 알지~?"\n\n"예, 압니다."\n\n"으헤, 너무 딱딱하다구~ 그러면 이 아저씨는 슬프다구?"\n\n"일이니까요, 청장님."\n그러면서도 비서는 옅은 미소를 지으며 말했다.\n"그래도, 열심히 하고 계십니다. 늘 감사합니다."\n\n"으헤, 그래!"\n\n비서가 방을 나가고, 아비도스 자치구청장, 타카나시 호시노는 서류작업을 계속했다.\n\n마사리크, 선생님이 찾아온 이후, 호시노는 행정부터 육체노동까지 여러 가지 일을 하다가 아비도스 자치구 재편성에서 공을 세워 아비도스 자치구청장이 되었다.\n\n그녀는 산업지구를 지역정부에 귀속시키고 자치구가 전이한 카를로비바리 시를 아비도스 자치구 산하로 통합시켰다.\n공장단지를 기피하는 키보토스인과 공장단지를 선호하는 현지인 사이에 이루어낸 타협이자 좋은 결과물이었다.\n\n아직 임시정부 행정명령 111호는 유효하지만, 호시노에겐 생각이 있었다.\n'지금 통합의 선례를 만들어두지 않는다면 이 연방은 오래 버티지 못한다.'\n\n그러한 생각을 가지고, 그녀는 아비도스 자치구를 통합의 상징으로 만들기 위해 노력했다. 헌병이 아닌 경찰이 활동하는건 자치구가 유일했으며, 경찰은 키보토스인과 현지인이 2인 1조로 다녔다.\n이러한 노력은 두 세계의 공존이라는 성과를 거두었지만, 근본적으로 다른 두 세계의 통합이라는 과제는 지지부진했다.\n\n이런 상황에서 호시노는 키보토스인과 현지인의 혼인 허용 요구에 대한 행정소송 문서를 보며 생각에 잠겼다."
 ABY_descision_focus_event.26.a:0 ""이렇게 된 김에 화끈하게 가자고.""
 ABY_descision_focus_event.26.b:0 ""이를 허용하면 정부가 마비될지도 몰라.""

 ABY_descision_focus_event.27.t:0 "되찾은 통제"
 ABY_descision_focus_event.27.d:0 ""상황은 어때?"\n\n"에겔란트 A, B, D 구역은 마무리 되었으며, C 구역에 132명 규모의 게릴라가 목조 요새를 축성하고 농성하고 있습니다. 아마 박격포 화력을 조금만 더 충원한다면 금방 함락될 것입니다."\n\n"음... 아마 힘들 거야. 헬멧단의 목조 요새는 개인화기나 박격포 정도로 뚫을 수 없어."\n\n"예? 어떻게 그런..."\n\n"응. 내가 저들과 여러 번 싸워 봤으니까. 그리고 현장에서 보고 오기도 했어. 저 요새는 보기보다 튼튼해."\n"그러니까 공격드론을 집중 투입해야 할거야."\n\n"예! 알겠습니다 사령관님!"\n\n막사의 문을 열고 전령이 들어왔다.\n"사령부로부터 진언이 도착했습니다."\n\n'군기 유지 명령. 토마시 가리크 마사리크 전 대통령께서 비밀리에 에겔란트 헌병사령부로 향하는 중임을 확인함.'\n\n내용을 확인한 시로코의 부관은 마이크를 켜고 안내방송을 했다.\n"사령부 내 인원들 모두 군복 단정히 입고 연병장에 집합 바란다. 아버지께서 오신다. 아버지께서 오신다. 이상."\n\n...\n\n"응, 선생님이 와줘서 좋아. 근데..."\n시로코는 연병장을 바라보며 말했다.\n"...그래도 뭐라도 한 마디 해주면 안될까? 저 사람들 모아놓고 그냥 해산하라 하면..."\n\n"껄껄, 시로코 양이 한가한 나를 위해 일을 만들어 주는군요."\n\n"아...아니! 그런게 아니고..."\n\n"싫다는 게 아닙니다. 오랜만에 연설 한 번 해보는 것도 좋지요."\n"따로 준비한 것도 없으니 길게는 못 하겠지만, 그 편이 저 병사들에게는 더 좋겠지요."\n\n마사리크는 멈칫하며 말했다.\n"그런데, 시로코 양이 연설을 해보는건 어떨까요?"\n\n시로코는 고민에 잠겼다."
 ABY_descision_focus_event.27.a:0 ""아니야, 그래도 센세가 하는게 나을 것 같아.""
 ABY_descision_focus_event.27.b:0 ""응, 그럼 내가 한 번 해볼게.""

 ABY_descision_focus_event.28.t:0 "실전 학습"
 ABY_descision_focus_event.28.d:0 ""새로운 명칭을 만드는 것은 비용도 많이 들고 어느 쪽도 동의하지 않을 겁니다. 우스티냐 아우시히냐. 확실히 정합시다."\n"아니 그러니까 어차피 같은 거라니까요? 아우시히나 우스티나 어차피 자기들 알아서 부르게 되어 있어요!"\n"애초에 우스티가 옛 체코어에서 나온 말이고, 그걸 독일어로 읽은게 아우시히인데 원본인 우스티를 써야지!"\n"엘베냐 라베냐에서 양보했으니 우스티 정도는 남겨둬야지! 날강도들아!"\n"우리 주데텐 독일인들이 사는 도시에 체코어 이름을 붙이는게 말이 돼? 말이 돼 안돼 임마!"\n\n회의가 과열될 조짐이 보이자 아야네는 정숙을 외치고 15분 휴회를 선언했다.\n\n단상에서 내려온 아야네를 마사리크가 맞이했다.\n\n"고생이군요, 아야네 양."\n\n"이번에는 잘 한거 같나요, 선생님?"\n\n"음, 확실히 점점 늘어가는게 보입니다. 하지만..."\n\n마사리크가 문제점을 지목해 주고 나서 회의는 다시 열렸고, 몇 번의 휴회와 개회를 더 반복하고 나서야 장장 10시간에 걸친 회의는 끝이 날 수 있었다.\n저녁이 되어서야 그들은 집에 갈 수 있었고, 마사리크와 아야네는 근처의 낡은 식당에서 쿨라이다(kulajda)를 먹으며 이야기를 나누었다.\n\n"...근데, 저 궁금한 게 있어요."\n\n"뭔가요, 아야네 양?"\n\n"많은 키보토스인중에 저를 선택한 이유는 지난번에 말해주셔서 이해했지만, 선생님께는 베네시 씨라는 똑똑한 제자가 있는데 왜 저를 제자로 키우시는지 궁금하네요."\n\n"음, 베네시만큼 똑똑하고 좋은 정치가가 또 없죠. 하지만 동시에 융통성이 부족하고, 조금 급진적인 성향이 있어서 다민족 연방에는 어울리지 않는 면이 있어요."\n"결국, 이를 보완해줄 정치적 파트너가 필요했어요. 모두를 품을 수 있고 베네시의 제동기가 되어줄 수 있는 사람. 그러면서도 정치적 잠재력이 뛰어난 사람. 저는 그 사람으로 아야네 양을 선택한 거에요."\n\n"아..."\n\n"언젠가... 제가 왔던 곳으로 돌아가게 된다면, 부디 베네시가 잘못된 선택을 하지 않도록 도와주세요.""
 ABY_descision_focus_event.28.a:0 ""...네. 선생님의 유산을 지킬게요.""
 ABY_descision_focus_event.28.b:0 ""...괜찮아요. 시민들이 스스로 올바른 길로 이끌 거에요.""

 ABY_descision_focus_event.29.t:0 "심모원려"
 ABY_descision_focus_event.29.d:0 "“후우... 역시 서류작업은 어려워...”\n\n서류에서 잠시 눈을 뗀 세리카는 기지개를 쭉 폈다.\n대전이가 발생한 지도 꽤 지난 지금, 세리카는 '이남8주위원회' 설립 업무를 맡고 있었다. 선생님과 아야네의 도움으로 지금은 서류 작업에도 어느 정도 요령이 생겼지만, 여전히 일은 많고, 익숙하지 않았다.\n\n“역시 나는 서류하고는 맞지 않는지도 몰라...”\n“아닙니다, 세리카 양. 세리카 양은 최선을 다해주고 있어요.”\n“엣, 선생님!?”\n\n어느새 마사리크가 문 앞에 서 있었다.\n\n“내무부 차관이라는 중책을 맡고 지금까지 큰 문제 없이 잘 해준 것 만으로도 세리카 양은 충분히 능력이 있어요.”\n\n“그렇지만 내가 스스로 알아챌 수 있는 건 자그마한 정도의 누락이라던가, 대놓고 과장된 내용 정도뿐인데...”\n\n“허허, 원래 작은 발전이 하나하나 모여서 더욱 성장하는 법이죠.”\n\n마사리크의 위로에도 세리카는 고민이 풀리지 않은 표정이었다.\n\n“흠, 뭔가 고민이 있는 표정이군요. 말해 줄 수 있겠나요?”\n\n마사리크의 말을 들은 세리카는 잠시 주저하더니 대뜸 이렇게 물었다.\n\n“만약 선생님께 물어볼 수 없는 상황에서 중요한 선택을 해야 한다면, 나는 어떻게 해야 할까?”\n\n마사리크는 조금 놀랐지만, 일단 세리카의 말을 경청했다.\n\n“요즘 들어서, 어떤 상황이 벌어져도 이상하지 않다는 생각이 들거든. 최악의 경우에 내가 모두를 책임져야 할 상황이 올 수도 있다는 생각도. 선생님이 도와준 덕분에 이제 나도 무조건 속지는 않지만, 그런 상황이 당장 닥친다면, 그리고 그 상황에서 조언해 줄 사람이 없다면 나는 잘못된 선택을 하고 말 거야. 그러니까 선생님, 만약을 대비해서... 내가 어떻게 해야 할지 알려줘.”\n\n마사리크는 이미 자신의 죽음을 염두에 두고 있었기에 그에 대해서는 많은 생각이 있었으나, 세리카가 염려하는 것은 그보다 훨씬 심각한 상황인 듯했다.\n마사리크는 잠시 생각에 잠겼고, 이윽고 이렇게 조언해주었다.\n\n“세리카 양이 한 선택이 어떤 결과를 불러올지 충분히 깊게 생각해줬으면 합니다. 특히...”\n\n“그런 상황이 온다면 자신의 안전이 제일 중요하다는 점 또한 명심하고요.”"
 ABY_descision_focus_event.29.a:0 "“정부의 일은 혼자서 하는게 아니라는 것을 기억해 주셨으면 합니다.”"
 ABY_descision_focus_event.29.b:0 "“그래도 자신이 할 일을 떠넘겨서는 안 되는 것도 기억하고요.”"

 ABY_descision_focus_event.30.t:0 "영토 수복"
 ABY_descision_focus_event.30.d:0 "산해경과 백귀야행의 위협이 체코와 오스트리아에서 완전히 소멸한 후, 역사의 새로운 장이 열렸다. 프라하 성의 블라디슬라프 홀에서, 임시정부를 이끌던 세 지도자 에드바르트 베네시, 콘라트 헨라인, 그리고 오쿠소라 아야네는 국내외 기자들 앞에 나란히 서서 '아비도스 연방정부'의 공식 출범을 선포했다. 이는 생존을 위해 뭉쳤던 위태로운 연합이 이제 영속적인 국가 공동체로 나아감을 알리는 역사적인 선언이었다.\n\n가장 먼저 발표된 것은 전시 상황의 종결을 의미하는 '비상 총동원령'의 공식 해제였다. 수년간 전선에 묶여 있던 수많은 장병들이 마침내 고향과 가족의 품으로 돌아갈 수 있게 되었음을 의미하는 이 조치에, 연방 전역은 안도와 환희에 휩싸였다. 전쟁의 그림자를 걷어내고 평화의 시대로 나아가겠다는 연방정부의 강력한 의지가 담긴 상징적인 발표였다.\n\n이어서 연방정부는 빠른 시일 내에 연방의 모든 구성원이 참여하는 첫 총선을 실시할 것을 약속했다. 이를 통해 모든 민족과 계층의 뜻을 공정하게 반영하는 정식 내각을 구성하고, 임시 지도 체제를 종식시키며 완전한 민주주의 국가로서의 기틀을 다지겠다는 청사진을 제시했다.\n\n또한, 국가의 역량을 전쟁이 아닌 재건에 집중하겠다는 의지를 분명히 했다. 전시 체제에 맞춰 비대해진 군의 규모를 평시 상황에 맞게 점진적으로 축소하는 군축 계획을 발표하는 한편, 이를 통해 확보된 예산과 자원은 전쟁으로 파괴된 도시와 산업 기반을 복구하는 대규모 재건 사업에 최우선으로 투입될 것이라고 선언했다. '두 세계의 국가'는 이제 총칼을 내려놓고, 망치와 쟁기를 들 준비를 시작한 것이다."
 ABY_descision_focus_event.30.a:0 "땅을 되찾았다"

 ABY_descision_focus_event.31.t:0 "군인과 소녀"
 ABY_descision_focus_event.31.d:0 "비테슬라프와 그의 소대원들이 소총과 기관단총을 들고 경계태세를 갖추고 있었다. 다른 국가들은 침략자들을 보며 이를 갈고 있었지만, 비테슬라프와 부대원들은 예외였다. 오히려 같은 편으로서 싸우고 있었다. 남들은 머리 위에 고리 달린 정신 나간 년들이라며 욕하기 바쁜것에 비하면 정말이지 특이했다. 그리고 이상한 기분은 덤이었고.\n\n"전 소대 집중! 100미터 내 적 부대 접근중!"\n"벌써인가요? 시작해볼까요? 모두 다치지 않도록 조심하세요!"\n\n잔뜩 긴장한 비테슬라프와 소대원들과 달리, 눈앞의 여자는 여유롭게 총기를 들었다. 키보토스라고 불리는 이들의 머리에 달린 헤일로를 보며 모두가 마른 침을 삼키던 사이였다.\n\n"어... 무슨 문제라도 있나요?"\n"아니, 아무것도 아닐세."\n"뭐예요, 그렇게 바라보시고는. 제 얼골에 뭐라도 묻은줄 알았잖아요!"\n"조용히 하고, 네 일에 집중해."\n\n비테슬라프가 소총을 들며 볼트를 당기고, 탄약을 장전했다. 저 멀리서 총성소리가 들려오고있다. 떨리는 손으로 소총을 집은 병사들은, 마른 침을 꿀꺽 삼키며 사격 거리에 적들이 오길 기다렸다. 범위에 헬멧단이 들어온 것을 확인한 비테슬라프가, 부하들과 키보토스 헤일로 보병들에게 소리쳤다."
 ABY_descision_focus_event.31.a:0 ""우리의 조국 체코를 위하여!""

 ABY_descision_focus_event.32.t:0 "빈으로"
 ABY_descision_focus_event.32.d:0 "마지막 키보토스계 소녀가 수류탄을 던지며 산해경 병력들이 후퇴하기 시작했을 무렵이었다. 오스트리아에서 체코로, 체코를 넘어 아비도스로 겨우 도망쳐왔던 군인 프리츠는 자신이 그렇게 싫어했던 키보토스계 소녀들과 함께 싸우다니, 정말 아이러니 할 수 밖에 없었다. 프리츠가 마지막 소총탄을 사격하며 마지막 키보토스계 소녀의 헤일로를 박살내어 마무리 지었을때, 프리츠는 겨우 한숨을 쉬었다.\n\n프리츠가 소총을 내려놓았을 때 즈음 마찬가지로 체코제 헬멧을 쓰던 소녀들을 바라보았다. 일본어로 조잘대는 모습을 볼때마다 프리츠는 짜증이 치밀어 오르는건 어쩔 수 없었지만, 그래도 이번엔 함께 싸웠으니 이번에는 그녀석들에게 빚을 진 셈이었다.\n\n"아아, 모두 주목." 한 장교가 확성기를 들며 입을 열었다.\n\n"곧 빈으로 향해 퍼레이드를 열 것이다. 남은 산해경 병력들이 모두 물러섰으니 우리가 공격받을 일도 없을 것이다. 키보토스계들은 좌측으로, 같은 유럽인들은 우측으로 움직일 수 있도록."\n\n프리츠는 앓는 소리를 내며 몸을 일으켰다. 그리고 자신들의 동료가 기다리고 있을 곳으로 움직였다."
 ABY_descision_focus_event.32.a:0 "뭐, 적어도 옛날보단 낫겠지."

 ABY_descision_focus_event.33.t:0 "희망을 잇는 동맹"
 ABY_descision_focus_event.33.d:0 "토마시 마사리크는 백귀야행에 의해 체코슬로바키아가 붕괴된 뒤에도 희망을 잃지 않았다. 그는 와해된 장관들과 장군들을 규합하려 애썼고, 그 결과 보이테흐 루자, 리하르트 테사르지크 같은 군 지도자들과 슈테판 오수스키를 비롯한 정치인들을 설득해 새로운 연합의 기틀을 마련했다. 그들은 체코슬로바키아 임시정부의 정신을 계승한 아비도스 임시정부를 따르며, 서로 다른 목표를 가지고 있지만 협력 속에서 각자의 역할을 다하기로 결의했다.\n\n회의실에서 마사리크는 무거운 목소리로 입을 열었다. “지금 우리는 각자의 목표를 가지고 있지만, 독일계, 체코계, 아비도스계가 힘을 합치지 않으면 그 누구도 성공할 수 없습니다. 우리의 경험과 능력은 이 연합을 강화하는 데 반드시 필요합니다.”\n\n보이테흐 루자는 조용히 고개를 끄덕이며 말했다. “각하, 저희는 독일계 레지스탕스 조직과의 협상을 진행했고, 유의미한 결과를 이끌어냈습니다. 저희 장교단은 그들을 훈련시키고, 하급 장교를 양성해주는 대신 저희의 지휘를 수용하기로 했습니다. 체코의 해방을 위해선 저희도 그들이, 그들도 저희가 필요한 바, 임시정부 연합군의 이름에 걸맞는 조직적 행동을 가능케 할 것입니다.”\n\n슈테판 오수스키도 이에 덧붙이며 말했다. “정치적으로 미숙한 아비도스 임시정부를 지원하고, 다양한 세력 간 협력을 이끌어내는 것도 우리의 책무입니다. 우리는 이 연합 속에서 공존하며, 각자의 역할을 충실히 수행할 것입니다.”\n\n에드바르트 베네시는 이 광경을 보며 희미하게 미소를 지었다. “토마시, 보십시오. 우리에게는 여전히 체코슬로바키아를 위해 헌신하고자 하는 동지들이 있습니다. 이들과 함께라면 우리는 반드시 조국을 해방시킬 수 있을 것입니다.”\n\n마사리크는 결연한 표정으로 다시 한 번 고개를 끄덕였다. 그는 굳은 목소리로 마무리했다.\n“여러분의 헌신과 노력이 없다면 오늘의 협력은 불가능했을 것입니다. 비록 각자의 목표는 다를지라도, 우리는 함께 이 땅의 해방과 새로운 미래를 향해 나아가야 합니다. 모두가 주어진 자리에서 최선을 다해주길 바랍니다.”"
 ABY_descision_focus_event.33.a:0 "At zije Ceskoslovensko!(체코슬로바키아 만세!)"

 ABY_descision_focus_event.34.t:0 "체코의 깃발 아래"
 ABY_descision_focus_event.34.d:0 "프라하의 한적한 레스토랑, 굳게 닫힌 별실 안에는 체코의 미래를 논하는 목소리들이 낮게 울려 퍼지고 있었다. 그 중심에는 에드바르트 베네시가 앉아 있었다. 그의 앞에는 과거 독립운동을 함께했던 노병들, 민족주의 성향의 학자들, 그리고 열정으로 가득 찬 청년 단체의 대표들이 자리했다. 그들은 연방의 '화합'이라는 구호 뒤에 체코의 정신이 희석될 것을 우려하는 이들이었다.\n\n"여러분," 베네시가 조용히 입을 열었다. "우리의 목표는 단 하나, 강하고 주체적인 체코를 재건하는 것입니다. 아비도스의 도움은 감사하지만, 그들은 이방인입니다. 주데텐인들은 언제나 경계해야 할 대상이지요. 이 나라의 진정한 주인은 우리 체코 민족이 되어야 합니다."\n\n그는 연설하지 않았다. 그저 조용히, 하지만 단호하게 자신의 신념을 이야기했다.\n\n"나는 여러분의 힘이 필요합니다. 연방이라는 틀 안에서, 체코의 목소리가 가장 크게 울려 퍼지도록 만들어야 합니다. 교육, 문화, 행정 모든 분야에서 우리의 영향력을 되찾아야 합니다."\n\n그의 말에, 흩어져 있던 민족주의 세력들은 하나의 구심점을 찾았다. 그날 밤, 그들은 '체코의 부흥'이라는 하나의 깃발 아래 보이지 않는 동맹을 맺었다."
 ABY_descision_focus_event.34.a:0 "베네시는 자신의 가장 강력한 지지 기반을 확보하는 데 성공했다."

 ABY_descision_focus_event.35.t:0 "보이지 않는 장벽"
 ABY_descision_focus_event.35.d:0 "베네시의 공작은 총성이 없는 전쟁과도 같았다. 그는 아비도스의 영향력을 약화시키기 위해 교묘하고 집요하게 움직였다. 연방의 주요 정책을 결정하는 회의에서, 아야네가 제출한 혁신적인 경제 재건안은 '현실성 부족'이라는 이유로 번번이 보류되었다. 그 뒤에는 베네시가 임명한 체코인 실무 관료들의 조직적인 반대가 있었다.\n\n"아야네 양의 제안은 이상적이지만, 현실적인 집행에는 어려움이 따를 수 있겠지요. 체코인 전문가들로 구성된 실무위원회를 추가하여 보완하는 것이 어떻겠습니까?"\n\n그의 제안은 합리적으로 들렸지만, 그 결과는 아비도스 출신 인사들의 권한 축소로 이어졌다. 내무부에서 유능함을 발휘하던 세리카의 업무는 사소한 절차상의 문제를 이유로 지연되었고, 노노미의 네프티스 그룹이 제안한 대규모 투자 사업은 까다로운 행정 규제라는 보이지 않는 장벽에 부딪혔다. 언론에서는 익명의 정부 관계자를 인용해 '키보토스식 정책의 비효율성'을 지적하는 기사들이 조금씩 흘러나오기 시작했다. 베네시는 결코 아비도스를 정면으로 공격하지 않았다. 그저 복잡한 행정 절차와 위원회라는 이름의 거미줄을 쳐,"
 ABY_descision_focus_event.35.a:0 "그들의 손발을 서서히 옭아맬 뿐이었다."

 ABY_descision_focus_event.36.t:0 "악마와의 악수"
 ABY_descision_focus_event.36.d:0 "자신의 세력을 키우던 베네시에게도 고민은 있었다. 바로 오스트리아였다. 새로 편입된 오스트리아 지역에서 그의 민족주의 노선은 큰 지지를 받지 못했다. 안정적인 과반 의석을 확보하기 위해선, 그는 자신의 신념을 일부 굽혀야만 했다. 결국 그는 누구도 예상치 못한 선택을 했다. 바로 구 오스트리아의 권위주의 정당이었던 '조국전선'의 잔당들에게 손을 내민 것이다.\n\n빈의 낡은 호텔에서 이루어진 밀회. 조국전선의 대표는 시니컬한 미소로 베네시를 맞았다. "민주주의자이신 베네시 각하께서, 저희 같은 구시대의 유물에게는 어쩐 일이십니까?"\n\n베네시는 일말의 표정 변화도 없이 대답했다. "나는 당신들의 사상을 지지하지 않소. 하지만 당신들에게는 오스트리아를 통제할 힘이 있지. 다가올 선거에서 나를 지지한다면, 오스트리아 내에서의 자치권과 과거 활동에 대한 불간섭을 약속하겠소."\n\n그것은 민주주의자로서의 자신을 부정하는 행위였다. 마사리크가 살아있었다면 결코 용납하지 않았을, 악마와의 악수였다. 하지만 베네시는 주저하지 않았다. 더 큰 목표, 즉 체코 중심의 강력한 국가를 건설하기 위해서라면, 반민주주의 세력과 손을 잡는 것조차 '필요악'일 뿐이라고..."
 ABY_descision_focus_event.36.a:0 "스스로를 합리화했다."

 ABY_descision_focus_event.37.t:0 "얼룩진 첫걸음"
 ABY_descision_focus_event.37.d:0 "아비도스 연방정부의 출범과 함께 약속되었던 첫 총선은 희망보다는 혼란 속에서 치러졌다. 전쟁의 상흔이 채 가시지 않은 상황에서 급하게 준비된 선거는 시작부터 삐걱거렸다. 통일된 선거인 명부는 존재하지 않았고, 각 지역의 유권자 집계는 주먹구구식으로 이루어졌다. 키보토스인들의 시민권 문제, 오스트리아 지역 유권자들의 자격 문제 등 법리적 논쟁은 선거일 직전까지 계속되며 혼란을 가중시켰다.\n\n선거 당일, 문제는 더욱 심각하게 터져 나왔다. 체코와 오스트리아의 일부 농촌 지역에서는 투표함이 통째로 사라지거나, 정체불명의 무장 세력이 투표소에 난입해 특정 정당을 지지하라고 협박하는 사건이 벌어졌다. 주데텐란트에서는 독일계 유권자들을 대상으로 한 조직적인 투표 방해 공작이 의심되는 정황이 다수 포착되었다. 개표 과정 역시 투명하지 않았다. 특정 지역구에서는 투표율이 100%를 넘기는 상식 밖의 결과가 발표되기도 했고, 야당 참관인들이 개표소에서 쫓겨나는 일도 비일비재했다.\n\n선거가 끝나자, 야당과 시민 사회는 즉각적으로 '부정선거' 의혹을 제기하며 대규모 시위를 예고했다. 그러나 연방정부는 발 빠르게 움직였다. 베네시가 이끄는 내무부는 '국가 안정'을 명분으로 언론 통제를 강화하고, 부정선거 의혹을 제기하는 목소리를 '사회 혼란을 야기하는 반체제 선동'으로 규정했다. 몇몇 유력 언론사들은 정부와의 유착 관계 속에서 선거가 공정하게 치러졌다는 보도를 쏟아냈고, 의혹을 제기하던 핵심 인사들은 의문의 세무조사를 받거나 과거 행적이 폭로되며 정치적 생명이 끊겼다.\n\n결국 거대한 의혹은 명확한 진상 규명 없이, 정부의 주도하에 서서히 수면 아래로 가라앉았다. 이 혼탁한 선거의 최종 승자는 에드바르트 베네시였다. 그는 자신의 민족주의 세력과 조국전선 등의 우익 세력을 규합해 가까스로 과반을 확보, 아비도스 연방의 초대 총리로 올라섰다. 그러나 그의 내각은 '얼룩진 승리'라는 태생적 한계를 안고 있었다. 정당성은 훼손되었고,"
 ABY_descision_focus_event.37.a:0 "연방의 민주주의는 첫걸음부터 불신과 분열의 씨앗을 품은 채 불안정하게 출범했다."

 ABY_descision_focus_event.38.t:0 "교수인"
 ABY_descision_focus_event.38.d:0 "끼릭. 철컥.\n\n상황이 바뀌었다.\n얼마 전 그가 겨누었던 권총은 이제 그를 겨누고 있었다.\n\n사실 그도 거사가 성공하리라고는 생각치 않았다.\n그렇기에 독일로의 탈출 루트까지 계획해놨건만...\n헨라인, 그 변절자의 정보력은 생각보다 강했다.\n\n"뭐라도 할 말 있나, 프랑크?"\n\n"...하나만 묻겠다."\n"당신은 독일인이면서, 왜 대독일의 품 안에 하나될 생각을 하지 않는 거지?"\n\n"뭐, 그거야 위대한 민주주의 이상에 감복해서가 아니겠나."\n헨라인은 이죽거리며 대꾸했다.\n\n"개소리 말고."\n\n"킥, 티났나?"\n\n"날 놀릴 생각이라면 그냥 죽여라. 그런 말 들을려고 살아있는게 아니니까."\n\n"그래, 제대로 말해주지."\n"우리 주데텐인들은, 대대로 이 보헤미아에서 귀족 노릇을 해왔어. 그 체코슬로바키아 건국 이후에도 우리는 큰 목소리를 낼 수 있었고, 사회의 특권층에 올라갈 수 있었지."\n"근데 독일의 한 시민이 된다? 그 특권을 모두 버리고 일개 소시민이 되라는 것 아닌가. 나는 그냥 떵떵거리며 살고 싶을 뿐이라고."\n\n"이... 이 역겨운 놈!"\n"겨우 그딴 사소한 이유로, 독일 민족의 위대한 운명을 거부한다는 말이냐! 변절자 자식! 독일 민족의 전체는 오직 하나, 독일 민족을 위해 존재한다! 사사로운 욕심에 그 대의를 버리는 걸 보니 네놈, 유대인의 피가 섞... 커헉!"\n\n"유대인 같은 소리하네. 내가 두 번째로 싫어하는게 유대인이라는 걸 모르나?"\n\n"크헉, 허억, 두 번째? 그럼 첫 번째는 뭐냐?"\n\n"뭐긴 뭐야, 네놈들 나치지.""
 ABY_descision_focus_event.38.a:0 "프랑크가 뭐라고 대꾸하기 전에, 헨라인은 방아쇠를 당겼다."

 ABY_descision_focus_event.39.t:0 "은퇴"
 ABY_descision_focus_event.39.d:0 ""...우리 체코슬로바키아, 오스트리아-헝가리의 잔재에서 태어난 유일한 민주주의 국가는, 그 대의를 영원히 가슴에 품고 미래로 나아갈 것입니다."\n"이에 선언합니다. 나, 토마시 가리크 마사리크는 10일 후 8시를 기점으로 대통령직을 사임하며, 이후 어떤 정치적 상황에도 중립을 지킬 것임을 맹세합니다."\n\n그 누구도 이를 짐작하지 못하였다. 에드바르트 베세시를 비롯한 정치계의 고위 인사들마저 얼굴에 만연한 당혹감을 감추지 못했다.\n\n"으흠, 많이 당황스러우시겠죠. 미리 말씀드리지 못한것은 죄송할 따름입니다. 하지만 저는 이미 35년, 대통령직을 그만두고 야인으로 살고자 하기로 하였습니다. 지금은 동서고금에 전례가없는 비상상황이기에 임시로 맡은 것이었지요."\n"정부가 구성된 지금, 제가 계속 이 자리에 있는 것은 헌법에 위배되는 행위이기도 합니다. 무엇보다, 이 늙은이가 언제까지 살겠습니까? 허허."\n\n그 본인은 웃고 있었지만, 좌중은 침울한 감정을 숨기지 못하였다.\n\n"여러분, 전 이제 내일모레면 아흔을 바라보는 나이입니다. 저는 제가 나이탓에 잘못된 판단을 내릴 것이 두렵습니다. 언제 덜컥 죽어 이 나라를 혼란에 빠뜨리는 것도 원하지 않습니다. 이 나라에는 새로운 젊은 피가 필요합니다. "\n"그렇기에, 1주일 후 총선거를 진행할 생각입니다. 그러니 부탁드립니다. 여러분께 주어진 소중한 권리를 행사해 주십시오. 땅을 잃더라도 민주주의의 대의는 잃지 않음을 저들에게 보여주십시오."\n"우리들은 절대 폭력과 압제에 굴복하지 않을 것임을 보여주십시오!"\n\n연설이 끝나자, 우레와 같은 박수갈채가 쏟아져 나왔다. 단상을 내려오는 마사리크는 눈물이 흘렀지만, 그 뒤로 파도처럼 몰려오는 안도감이 그를 달래었다."
 ABY_descision_focus_event.39.a:0 "안녕히."

 ABY_descision_focus_event.40.t:0 "토마시 마사리크"
 ABY_descision_focus_event.40.d:0 "출범식이 끝나고, 토마시 마사리크는 카를로비바리 외곽에 준비된 그의 거처로 돌아왔다.\n옷걸이에 그의 중절모와 기다란 외투를 걸쳐놓고, 그는 작은 나무의자에 넘어지듯 털썩 주저앉았다.\n아까의 정력적인 모습은 온데간데없이, 지칠 대로 지친 노인의 모습을 한 그는 지갑에서 명함만한 두개의 작은 종잇조각을 꺼내들었다.\n\n프라하가 사라지며, 그의 집과 함께 아들 얀 마사리크와 딸 올가 마사리코바 역시 사라졌다. 종잇조각은 자식들의 옷가지 한 벌 남지 않은 그가 가진 유일한 기억의 조각인 사진이었다.\n\n그는 흰 카네이션이 꽃힌 두 꽃병에 아들과 딸의 사진을 기대어 두고, 오는 길에 산 싸구려 와인과 주스를 꽃병 앞에 놓인 두 유리잔에 부었다.\n\n뜨거운 눈물이 그의 볼을 타고 내렸고, 이내 안경을 썼음에도 눈물이 앞을 가려 보이지 않게 하였다. 그는 감정을 조절할 줄 모르는 어린아이처럼, 책상에 엎드려 크게 울었다.\n미안하다고, 너희들을 데려갔어야 했다고, 소식이 들리고 바로 프라하로 달려가고 싶었지만 자신을 따르는 사람들이 발목을 잡아 어쩔 수 없었다며 들어주지도, 받아줄 이도 없는 사죄를 이어갔다.\n다른 이들 앞에서 그는 강인해야 해서, 자신이 좌절하면 모든 이들이 희망을 잃을 거라서, 자신은 얀과 올가의 아버지가 아닌 체코의 아버지가 되어야 했다며 한탄하다가 이내 지쳐 잠이 들었다.\n\n그는 체코의 아버지였지만, 두 아이의 아버지이기도 하였다."
 ABY_descision_focus_event.40.a:0 "그는 평범한 아버지였다."

 ABY_descision_focus_event.41.t:0 "루트비히 체흐의 사망"
 ABY_descision_focus_event.41.d:0 "1937년 3월의 쌀쌀한 바람이 카를로비바리의 묘지에 불었다. 대전이 직후의 혼란 속에서 입은 총상의 후유증은 끝내 '두 세계의 국가'에서 가장 헌신적인 화합의 상징을 앗아갔다. 루트비히 체흐, 체코인과 독일인의 공존을 평생의 신념으로 삼았던 노정객은 그렇게 잠들었다.\n\n그의 장례식에는 연립정부의 많은 요인들이 모여 고인의 마지막 길을 배웅했다. 에드바르트 베네시와 오쿠소라 아야네를 비롯한 체코와 아비도스 대표단은 침통한 표정으로 자리를 지켰다. 다만 '보헤미아의 아버지' 마사리크는 노쇠한 건강 문제로 참석하지 못해, 한 시대가 저물고 있음을 암시했다.\n\n추도사를 위해 연단에 오른 것은 콘라트 헨라인이었다. 그는 체흐의 숭고한 뜻을 기리면서도, 남겨진 주데텐 독일인들의 단결과 나아갈 길을 역설했다. 이는 단순한 추모사를 넘어, 체흐의 유지(遺志)를 이어받은 새로운 지도자로서의 자신을 각인시키는 선언과도 같았다. 구시대의 화합을 상징하던 별이 졌지만, 그의 죽음은 역설적으로 남은 이들의 기묘한 연대를 더욱 단단히 묶는 계기가 되었다."
 ABY_descision_focus_event.41.a:0 "한 시대의 별이 진다."

 ABY_descision_focus_event.42.t:0 "군에 대한 우려"
 ABY_descision_focus_event.42.d:0 ""
 ABY_descision_focus_event.42.a:0 "정치장교가 방파제가 되어줄 것이다."
 ABY_descision_focus_event.42.b:0 "군의 자율성을 존중해라."

 ABY_descision_focus_event.43.t:0 "두 번째 독대"
 ABY_descision_focus_event.43.d:0 ""으헤~ 데자뷰인가… 또 이 상황이네."\n\n호시노가 툴툴거리며 바닥에 주저앉자, 맞은편의 마사리크가 허허, 하고 낮게 웃었다. 굳게 닫힌 작업실 문은 1년 전 그날과 똑같은 모습이었다. 하지만 두 사람 사이를 흐르던 어색하고 날 선 공기는 온데간데없었다.\n\n"그러게 말입니다. 이번엔 또 누구의 실수일지. 그래도 지난번처럼 어색하지는 않으니 다행이군요."\n\n마사리크의 말에 호시노는 피식 웃었다. 지난 1년간, 그녀는 마사리크를 의심하는 대신 그에게서 배우는 길을 택했다. 그는 때로는 엄격한 스승이었고, 때로는 다정한 할아버지였다.\n\n"시간도 많은데, 이야기나 할까? 센세."\n\n호시노가 먼저 말을 꺼냈다. 이제 그녀는 자연스럽게 그를 '센세'라 불렀다.\n\n"좋지요. 내가 묻고 싶은 것이 있었는데… 우리가 린츠와 프라하를 되찾은 이후, 호시노는 무엇을 하고 싶은가요?"\n\n마사리크의 눈빛은 한낱 학생이 아닌, 한 명의 정치적 동료를 향한 진지한 질문을 담고 있었다. 호시노는 잠시 천장을 보며 생각하다, 결심이 선 듯 똑바로 그를 마주 보았다.\n\n"정치를 하려고. 민생을 안정시키고, 모두가 평등한 기회를 얻고, 최소한의 복지를 보장받는 사회. 그런 걸 목표로 하는 이들을 모아 정당을 만들거야."\n\n"사회주의적 빅텐트 정당인가요? 훌륭한 목표입니다." \n마사리크는 고개를 끄덕였다.\n"근데... 그 안에는… 공산당도 포함되는 겁니까?"\n\n"응, 물론이지."\n\n호시노의 망설임 없는 대답에, 마사리크의 온화했던 표정에 처음으로 난처한 기색이 스쳤다. 그의 미간에 희미한 주름이 잡혔다.\n\n"호시노 양, 저는 당신을 믿지만 공산당은 믿을 수 없어요. 그들은 크렘린의 주인의 지시를 받는 종이나 다름없습니다. 민주주의 체제 안의 잠재적인 위협이에요. 그들은 반드시 배제해야 합니다."\n\n"걱정 마. 민주주의는 무슨 일이 있어도 지킬 거야."\n\n호시노는 차분하게 답한 뒤, 말을 이었다.\n\n"그런데 센세, 그 말… 어디서 많이 들어본 것 같지 않아? '잠재적 위협이니 배제해야 한다'는 말 말이야."\n\n순간, 마사리크의 눈이 조금 커졌다. 호시노는 말을 계속했다.\n\n"센세는 독일계 주민들을 그렇게 부르는 사람들에게 맞서 그들을 끌어안았잖아. 그들 역시 누군가에겐 잠재적 위협이었는데도. 센세가 직접 보여줬는걸. 가능성을 보고 포용해야 한다고."\n\n정적이 흘렀다. 이윽고 마사리크의 입가에서 낮은 웃음소리가 터져 나왔다.\n\n"허허… 이거 제대로 한 방 먹었군요. 내가 가르쳤던 것을, 정작 내가 까맣게 잊고 있었습니다."\n\n그는 부끄럽다는 듯 머리를 긁적이며, 이내 따뜻한 눈으로 호시노를 바라보았다.\n\n"맞아요. 내가 틀렸습니다. 가능성을 믿고 끌어안는 것, 그것이 우리의 시작이었지요. 좋습니다. 호시노 양의 길을, 이 늙은이가 응원하겠습니다."\n"그런데, 한 가지 물어보고 싶은 것이 있어요. 무언가가 호시노 양의 이상을 막아선다면, 호시노 양은 어떻게 할 건가요?""
 ABY_descision_focus_event.43.a:0 "...그렇다면, 타협을 해서라도 이뤄내야죠."
 ABY_descision_focus_event.43.b:0 "...우리는 애초에 이상으로부터 시작했죠."

 ABY_descision_focus_event.44.t:0 "보헤미아의 두 아들"
 ABY_descision_focus_event.44.d:0 "주데텐 독일인당의 전당대회장은 열기로 가득했다. 연단에서 토마시 마사리크와 콘라트 헨라인이 나란히 서서 '두 세계의 국가'의 미래를 위한 우호선언문을 낭독하자, 장내에서는 우레와 같은 박수가 터져 나왔다. 그러나 공식적인 행사가 끝나고, 헨라인의 개인 집무실에서 마주 앉은 두 사람 사이에는 미묘한 냉기가 흘렀다.\n\n헨라인은 의자에 깊숙이 기댄 채, 다리를 꼬고 팔짱을 낀 자세로 마사리크를 맞았다. 예의에는 어긋나지 않았지만, 그의 모든 태도는 '이것은 어디까지나 정치적 연합일 뿐'이라는 무언의 메시지를 보내고 있었다. 하지만 마사리크는 그런 그의 태도에 아랑곳하지 않고, 시종일관 인자한 미소로 찻잔을 들었다.\n\n"전당대회는 성공적이었군요, 헨라인 씨. 주데텐 동포들의 열망이 여기까지 느껴지는 듯했습니다."\n\n"그들은 그저 자신들의 정당한 권리를 되찾고 싶을 뿐입니다, 각하." 헨라인이 딱딱하게 대답했다.\n\n"물론이지요. 집을 잃은 사람이 집을 되찾고 싶어 하는 것은 당연한 마음입니다." 마사리크는 부드럽게 말을 이었다. "나는 때때로 생각해 봅니다. 우리가 서로를 체코인, 독일인이라 부르기 이전에, 우리는 모두 이 보헤미아 땅에 뿌리를 내리고 살아온 이웃이라는 것을요. 숲의 나무들이 참나무, 자작나무로 다르지만 결국 같은 숲을 이루는 것처럼 말입니다."\n\n"숲이라… 하지만 어떤 나무는 다른 나무의 햇빛을 가리기도 하지요." 헨라인의 목소리에는 가시가 돋쳐 있었다.\n\n"그렇지요. 그래서 숲을 돌보는 정원사가 필요한 겁니다. 어느 한 나무가 시들거나, 어느 한 나무가 너무 자라 다른 나무를 해치지 않도록 돌보는 역할 말입니다. 우리는 서로에게 그런 존재가 되어주어야 하지 않겠습니까?"\n\n마사리크의 말에는 어떠한 정치적 계산이나 강요도 담겨 있지 않았다. 그저 한 인간이 다른 인간에게 건네는 순수한 철학이었다. 헨라인은 자신도 모르게 꼬았던 다리를 풀었다. 마음속 단단했던 벽에 작은 균열이 이는 기분이었다.\n\n마사리크는 창밖을 바라보며 말을 이었다. "헨라인 씨, 나는 주데텐인들이 체코 민족이라고는 생각하지 않습니다. 하지만 당신들은 틀림없는 체코의 '국민'입니다. 우리가 쓰는 말이 다르고, 즐기는 문화가 다르다는 것이, 어찌 같은 하늘 아래 사는 인간을 억압할 이유가 되겠습니까. 다름은 틀림이 아니라, 그저 다름일 뿐입니다."\n\n그 순간, 헨라인은 깨달았다. 눈앞의 노인이 뱉는 말들이 정치적 수사가 아닌, 그의 평생을 관통하는 진심이라는 것을. 그는 주데텐인을 표를 위한 도구나, 연합을 위한 장기말로 보는 것이 아니라, 진정으로 이 땅의 동등한 주인으로 존중하고 있었다.\n\n시간이 얼마나 흘렀을까. 두 사람의 대화는 밤이 깊어질 때까지 이어졌다.\n\n마사리크가 자리에서 일어나 돌아갈 채비를 하자, 헨라인은 말없이 그를 따라 일어나 문까지 배웅했다. 문을 열고 마사리크를 보내는 그의 모습은 처음의 오만하고 삐딱한 태도와는 완전히 달라져 있었다. 그는 허리를 깊이 숙여, 한 국가의 원로이자 진심으로 존경하게 된 한 인간에게 동등한 예우를 갖추어 인사했다.\n\n마사리크가 떠나고, 헨라인은 마사리크가 추종하던 민주주의에 대해, 가만히 고민에 잠겼다."
 ABY_descision_focus_event.44.a:0 "난 그분을 존경하지만, 민주주의는 존중하지 않아."
 ABY_descision_focus_event.44.b:0 "그분을 조금은 믿어보아도... 괜찮겠지."

 ABY_descision_focus_event.45.t:0 "양세계"
 ABY_descision_focus_event.45.d:0 ""
 ABY_descision_focus_event.45.a:0 "양세계는 함께해야 하지만 하나될 수는 없다."
 ABY_descision_focus_event.45.b:0 "양세계는 하나될 수 있다."

 ABY_descision_focus_event.46.t:0 "군에 대한 불신 확대"
 ABY_descision_focus_event.46.d:0 ""
 ABY_descision_focus_event.46.a:0 "그래도 문민통제 정도는 해줘야지."
 ABY_descision_focus_event.46.b:0 "우리는 헛소문에 휘둘리지 않는다."

 ABY_descision_focus_event.47.t:0 "모래사장을 떠나는 배"
 ABY_descision_focus_event.47.d:0 "1937년의 따스한 봄볕이, 새로 지어진 아비도스 고등학교의 강당을 환하게 비추고 있었다. 불과 2년 전, 단 다섯 명의 학생과 폐허만이 남았던 학교라고는 믿기지 않을 만큼, 강당은 활기찬 신입생들과 후배들로 가득 차 있었다. 그들의 시선은 모두 단상 아래, 첫 줄에 나란히 앉은 다섯 명의 선배에게로 향하고 있었다. 호시노, 시로코, 노노미, 세리카, 그리고 아야네. 오늘은 그들의 졸업식이었다.\n\n키보토스에서 '졸업'이란 낯선 개념이었다. 학생은 학원의 주인이자 그 자체였으니까. 하지만 이곳 유럽에서, 현지인들과 함께 국가를 이끌어가기 위해 '학생'이라는 신분은 이제 명예로운 족쇄가 되어버렸다. 아야네는 담담하게 현실을 받아들였다. "이것이 가장 합리적인 절차예요." 세리카는 서운함에 며칠 밤낮으로 졸업식 준비 서류를 붙잡고 끙끙댔다.\n\n강당의 임시 교장석에 선 이는 그들의 스승, 토마시 마사리크였다. 그는 다섯 학생과 청중을 번갈아 둘러보며, 짧지만 무게 있는 연설을 시작했다.\n\n"사랑하는 나의 학생이자, 존경하는 나의 동료 여러분. 키보토스에서 졸업이란 흔치 않은 일이라고 들었습니다. 하지만 오늘 우리는 끝을 기념하는 것이 아니라, 위대한 시작을 축하하기 위해 모였습니다. 모래더미 속에서 학교를 지켜냈던 여러분은, 이제 국가를 지탱하는 기둥이 되었습니다. 이제 학생의 굴레를 벗고, 이 나라의 진정한 지도자로서 첫걸음을 내딛는 여러분을, 이 늙은 스승은 자랑스러운 마음으로 지켜보겠습니다."\n\n뜨거운 박수와 함께 마사리크가 내려오자, 다섯 명의 학생이 자리에서 일어났다. 언제나처럼 투닥거리면서도, 그들의 발걸음은 하나처럼 단상으로 향했다. 나른한 표정의 호시노, 굳은 의지가 엿보이는 시로코, 상냥하게 미소 짓는 노노미, 긴장했지만 당당한 세리카, 그리고 모든 것을 정리하듯 차분한 아야네까지. 그들이 나란히 서자, 소란스럽던 강당은 물을 뿌린 듯 조용해졌다.\n\n다섯 학생이 마이크 앞에 한 걸음 다가섰다."
 ABY_descision_focus_event.47.a:0 "5명의 학생둘은 저마다의 목소리로 다양한 연설을 시작했다."
 ABY_descision_focus_event.47.b:0 "5명의 학생둘은 한 목소리로 연설을 했다."
 ABY_ABYDOS_Portrait_Change: "§Y대책위원회§!의 §Y초상화§!가 교체됩니다."

 ABY_descision_focus_event.48.t:0 "윤리관에 대하여"
 ABY_descision_focus_event.48.d:0 "낙화작전 이전까지 12개의 윤리관 이벤트가 등장하며, 해당 이벤트의 선택지를 통해 연방 윤리관이 형성됩니다.\n\n포괄주의<->다원주의\n평등주의<->권위주의\n개인주의<->집단주의\n민족주의\n\n로 3개의 상반된 윤리관과 1개의 독립 윤리관으로 나뉩니다.\n상반된 윤리관은 둘 중 더 강한 윤리관이 선택된 것으로 간주하며, 민족주의 윤리관은 광적일 경우에 다른 윤리관을 무시하며, 광적이지 않을 경우에 루트 결정에 무시됩니다.\n"연방의 가장 긴 밤" 중점 완료 시 가진 연방 윤리관에 의해 후속 정치 중점이 결정됩니다.\n\n현지인-포괄주의 평등주의 집단주의\n아야네-다원주의 권위주의 집단주의\n호시노-다원주의 평등주의 집단주의\n세리카(남키보토스)-포괄주의 평등주의 개인주의\n세리카(아비도스)-포괄주의 권위주의 집단주의\n시로코(민주)-다원주의 평등주의 개인주의\n시로코(독재)-다원주의 권위주의 개인주의\n노노미-포괄주의 권위주의 개인주의\n스오우-민족주의"
 ABY_descision_focus_event.48.a:0 "확인."
 ABY_descision_focus_event.48.b:0 ""

 ABY_descision_focus_event.49.t:0 "언어 문제"
 ABY_descision_focus_event.49.d:0 "백귀야행과의 휴전 이후, 연립임시정부는 점차 안정을 되찾아갔다. 그러나 전쟁이라는 거대한 위협에 가려져 있던 내부의 균열이 서서히 모습을 드러내기 시작했다. 그중 가장 시급하고도 복잡한 문제는 바로 '언어'였다.\n\n체코인, 독일인, 그리고 머리에 헤일로를 쓴 키보토스인까지. 세 개의 다른 민족, 세 개의 다른 언어가 한 국가 안에서 뒤섞여 있었다. 정부는 행정의 효율을 위해 임시방편으로 체코어를 공용어로 지정했지만, 이는 곧 새로운 갈등의 불씨가 되었다. 독일계와 키보토스계 주민들 사이에서는 공공연한 불만이 터져 나왔고, 체코어를 모르는 이들은 행정 절차에서 소외되거나 교육의 기회를 제대로 보장받지 못하는 문제가 발생했다.\n\n정부 지도자들이 이 복잡한 문제로 골머리를 앓던 찰나, 예상치 못한 곳에서 제안이 들어왔다. 바로 '보헤미아 에스페란토 위원회'였다. 그들은 특정 민족에게 종속되지 않는 중립적인 국제어, 에스페란토어를 연방의 새로운 공용어로 채택할 것을 제안했다. 에스페란토어의 도입은 체코인에게도, 독일인에게도, 키보토스인에게도 공평한 출발선을 제공하며, '두 세계의 국가'라는 이름에 걸맞은 진정한 화합의 상징이 될 것이라는 주장이었다."
 ABY_descision_focus_event.49.a:0 "이중제국의 실수를 반복할 수는 없다."
 ABY_descision_focus_event.49.b:0 "이를 위해 행정인력을 낭비할 수는 없다."

 ABY_descision_focus_event.50.t:0 "독대"
 ABY_descision_focus_event.50.d:0 ""으헤~ 완전히 잠겨버렸네."\n\n"허허... 이거 회의 끝날 때까지는 기다려야 겠군요."\n\n갇혔다.\n마사리크가 자다가 회의에 불참한 호시노를 데리러 온 짧은 순간에, 경비원이 작업실 문을 잠그고 가버렸다.\n그리하여 두 사람은 어색하게 불 꺼진 작업실 안에 마주앉아 있었다.\n그러다 호시노가 첫마디를 꺼냈다.\n\n"저기~마사리크 씨. 요즘 후배들은 어때? 다들 마사리크 씨만 따라다녀서 이 아저씨는 외롭다구?"\n\n마사리크는 호시노가 유도심문을 하는 것을 눈치채고 그녀를 정치인의 그것이 아닌, 신심으로 대해보기로 했다.\n"뭐, 다들 열심이죠, 호시노 양. 특히나 세리카 양은 제일 괄목할 만한 성장을 이루었더군요."\n\n"헤에~"\n"그럼, 마사리크 씨는 그 아이들이 어떻게 되었으면 좋겠는데?"\n\n"저는 장차 그 아이들이 두 세계의 화합으로 향하는 돌파구가 되기를 바래요."\n\n평소와는 다르게, 감정의 숨김 없이 말을 하는 마사리크의 모습에 당황해 호시노는 속마음을 조급 내벹고 말았다."
 ABY_descision_focus_event.50.a:0 ""으헤... 그 아이들이 그걸 원하는 걸까나~""
 ABY_descision_focus_event.50.b:0 ""

 ABY_descision_focus_event.51.t:0 "센세"
 ABY_descision_focus_event.51.d:0 ""...어쩌면 제가 원하는 색으로, 순수한 아이들의 하얀 도화지를 칠하는 행위일지로 모르죠."\n"저는 그 아이들에게 거짓말을 가르쳤어요. 사람을 의심하는 법을 알려줬고, 자신의 본성을 억누를 것을 권고했으며, 싫어하는 이들과 함께 있게 했어요."\n"그 아이들은 저를 <센세> 라고 부르지만, 저는 제가 키보토스에서 말하는 그런 <센세>의 자질이 있는지, 스스로 의심을 합니다."\n"가족도 지키지 못한 제가, 갑작스럽게 만난 아이들의 <센세>가 될 자격이 있는지... 아, 미안해요 호시노 양. 논점을 벗어났네요."\n\n호시노는 마사리크의 눈에 맺힌 작은 물방울을 보았다.\n자신이 아비도스를, 후배를 위해 본성을 숨기는 것처럼, 이 사람도 조국을 위해 철인 지도자를 연기했구나, 라고 호시노는 어렴풋이 생각했다.\n"아니, 계속해줘. 마사리크 씨의 이야기를... 더 듣고 싶어."\n\n"호시노 양이 그렇다면..."\n"...저는 거짓으로 점철된 삶을 살아왔어요. 그것이 저의 사욕을 위해서였냐 라고 한다면... 철학가들마다 다르게 생각하겠지만, 일단 저는 아니라고 생각해요."\n"제 거짓들은 모두 제가 사랑하는 것들을 지키기 위해서였다고, 전 자부할 수 있어요."\n"호시노 양은 어찌 생각할지 모르겠지만 그 아이들에게 한 것도... 같은 이유겠지요."\n\n호시노는 자신도 모르게 입을 열었다.\n"그, 아저씨도 할 일을..!"\n\n그때 문이 열렸다.\n"각하, 여기 계셨던 겁니까? 너무 오랫동안 안 오셔서 걱정했잖습니까..."\n"허허, 아닐세. 회의가 벌써 끝난건가?"\n"거의 다 되긴 했는데... 각하가 필요한 안건이 몇 있어서 빨리 가셔야 할 듯 합니다."\n"그래, 빨리 가도록 하지."\n\n"저..."\n무언가 말하려는 호시노에게, 마사리크는 한 마디를 남겨주었다."
 ABY_descision_focus_event.51.a:0 ""할 일은 스스로. 그 아이들도 모두 그랬답니다.""
 ABY_descision_focus_event.51.b:0 ""

 ABY_descision_focus_event.52.t:0 "마지막 수업"
 ABY_descision_focus_event.52.d:0 "시간은 마사리크의 편이 아니었다. 기침과 함께 나오는 피가래를 보며, 남은 시간이 얼마 없음을 직감했다. 더 이상 미룰 수 없었다. 자신이 떠난 후에도 아비도스가 흔들림 없이 나아가게 할 마지막 초석을 다져야만 했다. 그는 아비도스 고등학교의 전교생을 강당으로 소집했다. 단상에는 졸업생이 된 호시노와 네 명의 동료들도 나란히 서 있었다.\n\n마사리크가 자신의 '임시 교장직' 사임과 '교장' 직책의 폐지를 선언하자, 강당은 술렁이기 시작했다. 학생들에게 그는 단순한 정치 지도자가 아닌, 자신들의 길을 열어준 자애로운 스승이었다. 곳곳에서 아쉬움과 슬픔이 묻어나는 웅성거림이 터져 나왔다.\n\n"선생님, 계속 교장 선생님으로 계셔주시면 안 되나요?"\n\n한 저학년 학생의 울먹이는 목소리가 강당에 울려 퍼지자, 단상에 있던 세리카가 부드럽게 마이크를 잡았다.\n\n"여러분, 서운한 마음은 이해해요. 하지만 센세는 떠나시는 게 아니에요. 단지 원래 있어야 할 자리로 돌아가시는 것뿐이에요."\n\n이어서 아야네가 차분하게 설명을 덧붙였다. "원래 키보토스의 학원은 학생이 주인인 곳입니다. 선생님께서는 우리가 이 땅에 뿌리내릴 수 있도록 잠시 기둥이 되어주셨던 겁니다. 이제 우리는 대책위원회를 공식적인 '학생회'로 개편하고, 우리 스스로 학교를 이끌어갈 겁니다. 연방 안의 당당한 자치구로서 말이죠."\n\n호시노는 특유의 나른한 표정으로 마이크에 다가섰다. "으헤~ 뭐, 센세가 없어도 우리가 있잖아? 걱정하지 말라구. 이 아저씨… 아니, 언니들이 잘 이끌어줄 테니."\n\n다섯 졸업생의 다독임에 학생들의 동요는 점차 가라앉았다. 마침내 강당이 다시 조용해지자, 마사리크는 학생들을 둘러보며 자신의 마지막 수업을 시작했다.\n\n"나는 여러분에게 많은 것을 가르쳤다고 생각했지만, 돌이켜보니 오히려 내가 여러분에게서 더 많은 것을 배웠습니다. 절망 속에서도 희망을 잃지 않는 법을, 다른 세계에서 온 이웃을 편견 없이 받아들이는 법을 말입니다."\n\n그의 목소리는 갈라졌지만, 강당의 모든 학생들의 마음에 또렷하게 울려 퍼졌다. 마사리크는 마지막 연설을 끝맺기 시작했다.\n\n"여러분은 아비도스의 학생이기도 하지만...""
 ABY_descision_focus_event.52.a:0 ""...아비도스 연방의 미래를 빛낼 국민이기도 하니까요.""
 ABY_descision_focus_event.52.b:0 ""...아비도스 연방의 꿈들을 가진 청년이기도 하니까요.""

