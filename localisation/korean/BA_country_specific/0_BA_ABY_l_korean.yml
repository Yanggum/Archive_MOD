 ABY_shiroko_fas_event.1.t: "서툰 청사진"
 ABY_shiroko_fas_event.1.d: "프라하의 봄은 혼란스러웠지만, 시민들의 눈은 전에 없던 열기로 번들거리고 있었다. 스오우를 몰아낸 '구국의 영웅' 시로코의 지지율은 하늘을 찔렀고, 다가올 총선은 사실상 그녀의 대관식이나 다름없었다. 하지만 정작 당사자인 시로코는 관저의 책상 앞에서 미간을 찌푸리고 있었다.\n\n"응... 나라는 어떻게 운영하는 거지? 복잡해."\n\n그녀에게는 거창한 이념도, 정치 철학도 없었다. 밤새 고민한 끝에 그녀는 노트 한 페이지를 찢어 삐뚤빼뚤한 글씨로 생각나는 것들을 적어 내려갔다.\n\n배고픈 사람이 없게 한다.\n나쁜 짓을 한 녀석은 확실히 응징한다.\n우리 편은 끝까지 지킨다.\n은행... 아니, 국고는 투명하게 쓴다.\n\n제목도 없이 '혁명의 공약'이라 불리게 된 이 조잡한 메모가 신문에 실리자, 반응은 기이할 정도로 폭발적이었다. 정치 평론가들은 "국가 원수의 품격이 없다"며 비웃었지만, 기성 정치인들의 현학적인 거짓말에 지친 시민들은 "이것이야말로 꾸밈없는 진심", "늑대다운 솔직함"이라며 열광했다.\n\n시로코는 이 맹목적인 지지가 당황스러웠다. 혼자서는 무리였다. 그녀는 즉시 대책위원회 멤버들을 호출했다.\n\n회의실 문이 열리고 아야네, 노노미, 세리카가 들어왔다. 하지만 가장 중요한 자리는 비어 있었다.\n\n"호시노 선배는?"\n\n"......오지 않겠대요."\n\n아야네가 침통한 표정으로 전했다. 호시노는 시로코의 시민군 무장과 무력 혁명을 '또 다른 독재의 시작'으로 규정했다. 그녀는 여전히 행정부의 말단 관료로 출근하고 있었지만, 시로코와의 사적인 대화는 물론 눈을 마주치는 것조차 거부하고 있었다.\n\n하지만 멈출 수는 없었다.\n\n"어쩔 수 없어. 지금은... 앞으로 나아가야 해."\n\n시로코는 남은 셋을 바라보았다.\n\n"도와줘. 나는 싸우는 법밖에 몰라. 하지만 이 나라는 싸움만으로는 굴러가지 않아."\n\n"정말, 선배는 우리가 없으면 안 된다니까!" 세리카가 툴툴거리며 내무부 서류를 챙겼다.\n\n"경제는 맡겨주세요~ 네프티스의 힘을 좋은 곳에 써볼게요." 노노미가 웃으며 재무 보고서를 폈다.\n\n"외교와 행정 전반은 제가 보좌할게요." 아야네가 안경을 추어올렸다.\n\n그렇게 늑대의 통치는 세 명의 조력자와, 등을 돌린 한 명의 감시자 아래서 위태롭게 시작되었다."
 ABY_shiroko_fas_event.1.a: "내 일생 연방과 혁명을 위하여."

