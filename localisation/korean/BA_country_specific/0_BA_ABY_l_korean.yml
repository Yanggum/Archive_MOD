 ABY_new_event.152.t:0 "독일계 레지스탕스 합류"
 ABY_new_event.152.d:0 "[74.GetName]에서 백귀야행 부대가 철수한 후, 해당 지역에서 활동하던 레지스탕스 조직이 연립정부군과 접촉했습니다. 이들은 개인 화기와 일부 노획한 장비로 무장하고 있었습니다. 지휘부 간의 협의를 거쳐, 해당 레지스탕스 조직원들은 연립정부군의 정식 지휘 체계 아래로 편입되었습니다. 이 조치로 [74.GetName] 주둔군의 병력이 즉각적으로 증강되었습니다."
 ABY_new_event.152.a:0 "어서오게!"
 
 ABY_new_event.153.t:0 "예상치 못한 해방자"
 ABY_new_event.153.d:0 "사안: 오스트리아 전역 해방 및 연방 편입에 관한 건\n발신: 린츠 주둔 사령관, 아사기리 스오우\n\n보고서 요약:\n연립정부군의 린츠 및 호른 진주 이후, 산해경의 저항은 예상보다 미미함. 주목할 점은 오스트리아 현지 주민들의 반응으로, 아군을 '산해경으로부터의 해방자'로 규정하며 대대적으로 환영하고 있음. 이는 단순한 호의를 넘어, 적극적인 협력 의사로까지 발전하는 중. 현 상황을 활용, 오스트리아 전역을 해방하고 이들을 연방의 새로운 구성원으로 편입할 것을 제안함.\n\n카를로비바리의 최고회의실, 보고서 낭독이 끝나자 베네시가 만족스러운 표정으로 입을 열었다.\n\n"전략적으로는 더할 나위 없는 기회로군요. 남부 국경의 위협을 완전히 제거하고, 우리의 영향력을 다뉴브 강까지 확장할 수 있습니다."\n\n그는 당연하다는 듯 헨라인을 바라보았다. 헨라인은 잠시 턱을 쓰다듬으며 신중하게 입을 열었다.\n\n"물론 전략적 이점은 분명합니다. 하지만, 고려해야 할 부분이 있습니다. 아시다시피 우리의 연합은 체코, 아비도스, 그리고 '주데텐' 독일인이라는 세 개의 독특한 기둥 위에 세워져 있습니다. 이 균형이 우리의 힘이지요."\n\n그의 목소리는 지극히 합리적이고 차분했다.\n\n"만약 우리가 오스트리아를 받아들인다면, '독일인'이라는 더 큰 범주가 생겨나게 됩니다. 그렇게 되면 우리 주데텐인들이 쌓아온 고유한 입지와 역할이 희미해질 수 있다는 우려가 있습니다. 연방의 안정성을 위해선, 기존 구성원들의 결속을 먼저 다지는 것이 순서가 아닐까 합니다."\n\n그는 '주데텐 민족주의'라는 단어를 단 한마디도 쓰지 않았지만, 그의 의도는 명확했다. 베네시의 표정이 미묘하게 굳어졌다. 이때, 침묵을 지키던 아야네가 나섰다.\n\n"헨라인 씨의 신중한 견해에 동의합니다. 연방의 근간을 이루는 세 기둥의 역할과 권리는 무엇보다 중요합니다. 그렇다면, 이 기회에 그것을 더욱 명확히 하는 것이 어떻겠습니까?"\n\n아야네는 베네시와 시선을 교환했고, 베네시는 아야네의 의도를 파악하고 짧게 고개를 끄덕였다. 아야네가 다시 헨라인을 향해 말했다.\n\n"이번 작전을 승인하기에 앞서, 우리 연방의 기본 원칙을 재확인하는 공식적인 서약을 합시다. 체코와 아비도스는, '주데텐 독일인'을 우리 연방의 고유하고 독립적인 구성원으로 인정하며, 그들의 자치권과 권리가 미래에 어떤 상황에서도 침해받지 않을 것임을 약속하는 겁니다."\n\n헨라인의 입가에 희미한 미소가 번졌다. 그는 자신이 원했던 것을 완벽하게 얻어냈다.\n\n"아야네 씨의 제안은 매우 합리적이군요. 그러한 약속이 선행된다면, 저 역시 연방의 확장을 위해 기꺼이 힘을 보태겠습니다.""
 ABY_new_event.153.a:0 "그렇게 노련한 정치인들의 대화 속에서,'두 세계의 국가'는 남쪽으로의 진군을 만장일치로 결정했다."
 
