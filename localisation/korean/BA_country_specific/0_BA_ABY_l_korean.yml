 ABY_descision_category_masaryk:0 "마지막 불꽃"
 ABY_descision_category_masaryk_desc:0 "토마시 가리크 마사리크, \n해방자 대통령, 철인 왕, 보헤미아의 아버지, 아비도스의 선생 등등 수많은 호칭을 얻은 그는 1935년 12월, 대통령직을 사임할 생각이었으나 대전이와 여러 상황이 겹쳐 1937년 1월이 되어서야 1918년 부터 이어져온 그 막중한 권위에서 물러날 수 있게 되었습니다.\n\n하지만 권위가 사라졌다고 한들, 그에게 남겨진 막중한 책임은 사라지지 않았습니다. 그는 공직에서 물러났으나 여전히 강한 정치적 인물이며, 그의 후계자들이 이 나라를 이끌게 될 것입니다.\n\n그는 알고 있습니다.\n자신에게 남은 시간이 그리 많지 않다는걸.\n\n보헤미아의 체코인과 독일인 모두에게 존경받아 "보헤미아의 아버지" 로 불리게 된 남자,\n키보토스인, 아비도스인 들에게마저 존경받아 "아비도스의 선생" 이라고 불리는 남자,\n\n마사리크가 자신에게 주어진 마지막 시간을 어떻게 보내냐에 따라 이 나라, 더 나아가서 두 세계의 운명이 결정될 것입니다!"
 ABY_descision_category_two_world:0 "두 세계의 국가"
 ABY_descision_category_two_world_desc:0 "두 세계의 국가.\n외부에서는 아비도스를 한편으로는 경의, 한편으로는 모멸을 담아 "두 세계의 국가"라고 부릅니다.\n\n경의를 표하는 쪽은 혐오와 혼란 속에서 피어난 한 송이의 화합과 희망의 꽃이라고 부를 것이며, 모멸하는 쪽은 냉소를 담아 이루어질 수 없는 한낱 이상으로 치부할 것입니다.\n\n당연하게도, 현실은 모멸하는 이들의 생각과 아마 더 비슷할 것입니다. 현지인들도 민족 간의\n갈등을 빚었고, 키보토스인들도 학원 간의 갈등을 빚은 통에 서로 다른 두 종족이 온전히 싸움 없이 지내는 것은 공상 속의 이야기일 것입니다.\n\n하지만 두 종족 사이의 갈등을 민족간의, 혹은 학원간의 갈등 수준으로 낮출 수 있다면 그것으로 충분할 것입니다.\n\n모든 이들의 이목을 사로잡는 "세상에서 가장 아름다운 꽃"은 우리가 피워낼 수도 없고, 애초에 존재하지도 않습니다.\n\n하지만 "황무지에서 피어난 한 송이의 수수한 난초" 라면, 우리가 피워낼 수도 있고 모두의 이목을 집중시킬 수도 있습니다.\n\n그리고 그것이 우리가 원하는, 목표해야할 바가 될것입니다."
