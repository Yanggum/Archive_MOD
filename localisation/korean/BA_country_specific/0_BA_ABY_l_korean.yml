 ABY_new_event.229.t:0 "아비도스 유저들을 위한 공지"
 ABY_new_event.229.d:0 "안녕하십니까, 아비도스 담당 모더 Mintcoon입니다.\n\n먼저, 아비도스 1차 리워크 이후 여러 변화를 시도하며 여러분께 새로운 경험을 제공하고자 노력해왔으나, 저의 기획과 모딩 기술의 미숙함으로 인해 결과물이 잦은 초기화와 실패를 겪게 된 점 진심으로 사과드립니다. 특히, 리워크 과정 중 기존 시스템을 애매하게 활용하고 융합하면서 다수의 버그와 구조적 문제가 발생했던 점에 대해 깊은 반성과 함께 유감의 뜻을 전합니다.\n\n이에, 앞으로의 리워크는 충분한 준비와 검증을 거쳐 진행될 예정이며, 다음 리워크 이후로 대규모 개편이 없도록 노력할 것입니다.\n그러나 현재 현생의 여러 문제, 특히 학업상의 어려움으로 인해 부득이하게 아비도스 개발을 11월 중순까지 잠정 중단하기로 결정하였습니다. 공사다망한 상황에서 주요 국가인 아비도스의 리워크를 무리하게 진행할 경우 과거와 같은 문제들이 재발할 것을 우려한 결정임을 너그럽게 양해해 주시기 바랍니다.\n\n11월 중순까지는 종종 이집트 등 비주류 국가를 개발할 것이며, 그 기간동안 아비도스의 완성도를 한층 더 끌어올릴 밑준비에 집중할 계획입니다. 그 과정이 다소 오랜 시간이 소요되더라도, 여러분께서 잠시 잊으시더라도 다시 복귀하는 순간 뇌리에 깊이 각인될 만큼 인상적인 모습으로 돌아올 수 있도록 노력하겠습니다.\n\n여러분의 아량과 지속적인 관심에 깊이 감사드리며, 보다 나은 모습으로 다시 찾아뵙기 위해 최선을 다하겠습니다."
 ABY_new_event.229.a:0 "감사합니다."
 ABY_new_event.229.b:0 ""
 
 ABY_new_event.230.t:0 "조사 보고서-트리니티"
 ABY_new_event.230.d:0 "개요: 트리니티 고성당 지하에서 발견된 수백 구의 시신과 의료기기에 관한 조사 보고서\n비고: 고성당 진입 전 여러 기록이 불타고 파쇄되어 확인 가능한 자료가 부족.\n\n1. 시신 주변에서 신비 혈청, 신비 직조기 등이 다량 발견됨.\n\n2. 사인은 공통적으로 총체적 장기부전, 혹은 심정지 등 체성근육 과부하 및 자기파괴성 면역 활성화로 인한 것으로 추청.\n\n3. 모든 시신에서 신비 수치가 정상 범주를 넘어선 수치로 관찰됨.\n\n4. 내용은 확인할 수 없으나 티파티의 명령서 등이 발견, 트리니티 정부 주도로 이루어진 것으로 추정됨.\n\n5. 사망 시기는 전체적으로 트리니티 정부의 "노숙자 및 사회부적응자 지원" 시기와 비슷함.\n\n종합: 아비도스 중앙 신비 연구소에서 진행한 동물 신비 주입 실험의 인간 생체실험으로 사료됨. 다만 자료 대다수가 파기되어 인간에게 적절한 조치 없이 신비 주입 시 동물들과 같은 반응을 보이며 사망한다는 것 외에는 유의미한 결과 도출 불가 보다 광범위한 연구자료 지원이 필요.\n\n고성당 파견 제 37신비 연구팀."
 ABY_new_event.230.a:0 "허가."
 
 ABY_new_event.231.t:0 "조사 보고서-게헨나"
 ABY_new_event.231.d:0 "개요: 게헨나 중앙구 근방 대형 민간 시설에서 트리니티 생체실험과 유사한 흔적이 발견됨. 판데모니움 소사이어티 혹은 선도부의 개입 정황은 보이지 않아 민간 동아리의 행위로 사료되며, 성공한 샘플은 없으나 상당한 자료를 획득함.\n\n1. 전체적으로 고성당 지하 의료시설과 유사한 모습을 보이나, 위생 등 기본적인 연구 환경이 갖추어져 있지 않음.\n\n2. 몸무게와 BMI별 치사량이 상세히 기록되어 있음. 일정 수준 이상이 될 시 즉시 사망하며, 자세한 수치는 따로 첨부.\n\n3. 연구자 개인 노트 등에서 판데모니움 소사이어티, 선도부 등의 지시를 받은 정황은 보이지 않으며 선도부는 오히려 이들을 추적한 것으로 보임.\n\n4. 치사량 이전까지의 신비 투입 시 신체능력이 지속적으로 증가하며, 임계점에서 키보토스인과 유사한 신체능력을 가지나, 몇 초 내로 근육 조직이 완전히 붕괴되어 사망하게 됨.\n\n5. 수치를 역산하여 동물 실험을 진행하였으나 노획된 연구 자료만큼의 성과를 보이지 않음. 인간 외에는 유의미한 효과가 없을 것으로 사료됨.\n\n종합: 신비 주입 시 안정제 등의 보조제가 필요한 것으로 보임. 동물실험은 유의미한 성과를 보일 수 없어 부득이하게 현 연구 자료를 기반으로 인체 실험을 진행할 것을 제안함.\n\n중앙구 파견 제 26 연구팀."
 ABY_new_event.231.a:0 "허ㄱ(지워짐)\n불허."
 
 ABY_new_event.232.t:0 "조사 보고서-밀레니엄"
 ABY_new_event.232.d:0 "개요: 밀레니엄 세미나 소속 연구시설 지하에서 대규모 신비 주입 연구 흔적이 발견됨. 대부분 자료가 온전한 상태로 보존됨.\n\n1. 연구 자료 규모상 최소 수만명이 투입되었을 것으로 사료됨. 따라서 게헨나 지역에서 발견된 것보다 세세한 수치의 자료 발견. 첨부.\n\n2. 세미나 연구 시설에 위치해 있으나, 연구 노트와 개인 노트 등에서 세미나의 결재나 그들에 관한 언급이 없어 세미나가 관련되었는지는 확인 불가.\n\n3. 약 1주일간 혈액 투석과 강한 독성 약품 섭취 및 주입으로 신비 주입 시 발생하는 자기파괴성 면역 억제 성공.\n\n4. 같은 방식으로 신체 붕괴를 늦추는 데 성공하였으나, 수명이 5년 내외로 제한될 것이라는 연구 결과가 나옴. \n비고: 극비사안으로 분류되어 있음.\n\n5. 실험체들은 처분된 것으로 추청되며, 다음 연구로 수명 감축을 막기 위한 연구가 계획된 흔적 확인 가능. 연구 계획: 키보토스인 신비 추가적 주입, ... , 태아 신비 주입, ... 후략. 첨부자료 확인 바람.\n비고: 극비사안으로 분류되어 있음.\n\n종합: 자료에 기반한 추가 계산 결과, 아무리 붕괴를 늦춰도 10년 이상으로 늦추긴 불가능한 것으로 확인됨.\n\n추가 보고서: 인체 실험 엄금에 따른 기계화 슈트 실험이 해당 연구 자료 확보에 따라 진척을 보이고 있음. 다만 실전 연구를 위해서는 군부와의 협력이 필요하며, 해당 자료의 공개가 불가피해 보여 허가가 필요.\n\n밀레니엄 파견 제 3연구팀."
 ABY_new_event.232.a:0 "보류."
 
 ABY_new_event.233.t:0 "장관 회의 보고서 395호 86장 요약본"
 ABY_new_event.233.d:0 "밀레니엄 조사 보고서 자료 공개 여부 논쟁 발발.\n\n자료의 일부를 민간에 공개하는 것에 합의.\n\n세부 자료는 군에 공개하되 장성급 이하로는 유출되지 않도록 규정.\n\n중략.\n396호 3장 요약본\n\n"저거너트" 계획의 세부 보고서 확인.\n과도한 필요 예산으로 인한 의견 대립.\n\n기록 삭제.\n\n최종 결론 도출."
 ABY_new_event.233.a:0 "저거너트 계획 승인됨."
 ABY_new_event.233.b:0 "저거너트 계획 거부됨."
 
 ABY_new_event.234.t: "경제부 보고서: 기업 선정"
 ABY_new_event.234.d: "국가의 한정된 자원을 집중하여 경제 재건의 초석을 다지기 위한 협력의 핵심 파트너로 다음 세 기업이 유력함.\n\n. 네프티스 그룹 (기술 R&D): 키보토스의 독보적인 연구 기술력을 보유. 당장의 생산 기반은 없으나, 장기적으로 기술 자립과 미래 산업의 패권을 확보할 수 있는 잠재력을 가짐.\n\n. 로스차일드 코퍼레이션 (금융): 무너진 금융 시스템을 재건하고 외부 자본을 유치하는 데 필수적. 안정적인 경제 순환의 기반을 다지는 가장 확실한 선택.\n\n. 슈코다 웍스 (중공업/군수): 당면한 군사적 위협에 대응하고 국방력을 강화하는 데 즉각적인 효과를 보장. 연합군의 군사적 자립을 위한 가장 현실적인 대안."
 ABY_new_event.234.a:0 "로스차일드 & CO."
 ABY_new_event.234.b:0 "슈코다 웍스"
 ABY_new_event.234.c:0 "네프티스 그룹"
 
 ABY_new_event.235.t:0 "아사기리 스오우"
 ABY_new_event.235.d:0 "대전이 당시 통수권자를 잃은 네프티스 PMC를 규합해 백귀야행에 저항하고 프라하 탈출 당시 임시정부에게 무장열차를 지원한 유능한 지휘관, 아사기리 스오우가 오늘 정식으로 하이랜더 철도학원에서 나와 임시정부군의 지휘관으로 복무할 것을 약속했습니다.\n\n이에 그녀의 지휘 하에 있는 네프티스 PMC도(공식적으로는 네프티스 그룹 소유이지만) 임시정부군의 전력이 되었습니다.\n\n임시정부는 그녀에게 큰 감사를 표하고 있으며 그녀 역시도 충성을 맹세했습니다."
 ABY_new_event.235.a:0 "이런 유능한 분이 함께하니, 임시정부의 미래가 밝군요!"
 
 ABY_new_event.236.t:0 "플레이 감사합니다!"
 ABY_new_event.236.d:0 "아비도스의 베타 컨텐츠가 종료되었습니다. 다음 업데이트때 찾아뵙겠습니다! 만약 계속하시고 싶으시다면 아래 선택지를 클릭해주세요!"
 ABY_new_event.236.a:0 "계속 플레이"
 
