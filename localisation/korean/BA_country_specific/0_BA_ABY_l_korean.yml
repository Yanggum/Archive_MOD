 ABY_shiroko_fas_info_tt: "\n§Y친애하는 스나오오카미 시로코 대통령 각하 만세!§!\n\n각하께선 취임과 함께 §Y혁명의 공약§!을 발표했습니다.\n§Y혁명의 공약§!은 §C내치§!와 §C외치§! 2개의 부분으로 나뉘는 공약이며, 각 부분의 달성도 §G30§!점 마다 §Y황금 옥좌§! 중점 완료 시에 얻는 트레잇의 효과가 증가합니다!\n§R순진한 늑대는 여전히 이것이 민주주의를 위한 길이라고 믿고 있습니다.§!"
