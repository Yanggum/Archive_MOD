 #ABY_descision_focus_abydos_1_effect: "다음 효과를 부여하는 산업 업체 사용 가능:\n§Y세인트 네프티스§!\n    산업 연구속도: §G+10.0%§!\n  §Y철도업체§!\n    §Y철도§! 건설속도: §G+15.0%§!\n    §Y보급 중심지§! 건설속도: §G+15.0%§!\n    보급 범위: §G+10.0%§!\n'§Y문제 있는 철도§!'의 기간을 §Y240§!일 단축"
 #ABY_descision_focus_abydos_2_effect: "§Y두 세계의 국가§! 국민정신의 §Y결속도§! 5 §Y증가§!\n§Y카타카타 헬멧단§! 변동치\n징병 가능 인구 변동치: §G+20%§!\n안정도: §G+15.00%§!\n전쟁 지지도: §G+15.00%§!\n공장 생산량: §G+5.00%§!\n\n'§Y자진입학§!' 사건 발생"
 #ABY_descision_focus_abydos_3_effect: "'§Y아비도스 채권§!' ((§Y[KAI.GetNameWithFlag]§!)목표국의 민간산업: §R+10.00%§!, (§Y[KAI.GetNameWithFlag]§!)목표국의 군수산업: §R+10.00%§!) 국민정신 제거.\n'§Y채권 비용 지불§!' 국민정신을 §Y360§! 일 동안 획득.\n(매일 정치력 비용 §R+0.10§!)효과 부여\n'§Y제작중§!' 사건 발생"
 #ABY_descision_focus_abydos_4_effect: "§YNephthys PMC division§! 편제 한도가 §G+1§!만큼 변동.\n(§Y북주데텐란트§!): §Y북주데텐란트§!에서 §Y아비도스§! 부대 생성"
