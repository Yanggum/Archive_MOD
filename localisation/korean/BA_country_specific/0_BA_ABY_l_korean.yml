 ABY_new_event.174.a:0 "알겠다."
 ABY_new_event.174.b:0 "우리가 점유하고 있을 것이다."
 
 ABY_new_event.175.t:0 "유럽 연방으로의 통합 제의"
 ABY_new_event.175.d:0 "이거 내용좀 채워주세요"
 ABY_new_event.175.a:0 "좋다."
 ABY_new_event.175.b:0 "우리는 독립국으로 남을 것이다."
 
 ABY_new_event.201.t:0 "주데텐란트의 독일인 봉기!"
 ABY_new_event.201.d:0 "아비도스가 여러 보헤미아 지역의 민족 자치를 주장하며 끌어모은 독립 조직이 우리의 보헤미아에도 존재했던 것으로 확인되었습니다!\n\n이들은 지금 아비도스의 전쟁 수행과 협력해 우리를 향한 혁명 봉기를 선언하였으며, 지금 주데텐 실레시아 지역에서는 전투가 벌어지고 있습니다."
 ABY_new_event.201.a:0 "망할!"
 
 ABY_new_event.202.t:0 "주데텐란트 민병대의 성공적인 봉기!"
 ABY_new_event.202.d:0 "우리가 조직한 주데텐란트 지역의 독일인 민병대가 지금 주데텐 실레시아 지역에서 혁명을 선포하였다는 정보를 입수했습니다! 이는 우리의 전쟁 승리에 큰 도움이 될 것이 분명합니다."
 ABY_new_event.202.a:0 "좋아!"
 
