 #캄보디아 인트로
CAM_country_intro_header: "프랑스의 지배 아래에서"
CAM_country_intro_content: "크메르의 태양은 더 이상 찬란한 영광이 아닙니다. 프랑스 인도차이나의 심장부, 우리의 캄보디아 왕국은 형식적인 군주제 아래 프랑스의 보호령으로 숨 쉬고 있습니다. 왕궁의 황금빛 지붕은 여전히 빛나지만, 그 아래에서 왕실과 행정은 사이공에 있는 식민 정부의 그림자 속에 놓여 있습니다. 조국은 쌀과 고무를 바치는 광활한 농장으로 전락했으며, 우리의 자원은 멀리 떨어진 프랑스의 패권을 강화하는 데 쓰이고 있습니다. 1935년의 갑작스럽게 일어난 유럽에서의 대전이 이후, 세계는 불확실성으로 가득 차 있습니다. 대전이의 영향을 받은 국가들은 다시 한번 전쟁의 기운에 휩싸여 있고, 아시아에서는 일본 제국이 새로운 힘으로 부상하며 식민주의의 야망을 들어내고자 하는 움직임을 보이고 있습니다. 이 격변의 시대, 우리는 중대한 기로에 서 있습니다.우리는 계속해서 프랑스의 충실한 보호령으로 남아, 거인의 우산 아래에서 잠재적인 위협으로부터의 평화를 보장받아야 합니까? 아니면, 아시아의 다른 국가들이 그러하듯, 민족주의의 불꽃을 피워 올려 프랑스의 족쇄를 부수고 위대한 크메르 제국의 영광을 재건해야 합니까? 앙코르의 폐허는 과거의 영광을 속삭이고, 조용한 백성들의 가슴 속에는 독립의 갈망이 타오르고 있습니다. 우리의 미래는 충성인가, 해방인가? 선택의 순간이 다가오고 있습니다."
 #캄보디아 인물(CAM)
