 CAM_event.10.d: "H. L. M. 리쇼므의 임시 고등판무관 직위를 대체할 정식 판무관을 프랑스에서 파견하였으며, 그의 이름은 레옹 티보도라고 합니다.\n\n그는 최근 휴가를 보내다가 돌아왔으며 휴가가 끝나자마자 자신이 캄보디아의 주재 고등판무관으로 임명되었다는 걸 알고 1년간 준비한 후, 현재 우리 캄보디아에 입국했습니다."
