 return_khmer_empire_desc: "오랜 식민 지배의 그림자를 걷어내고, 앙코르의 장엄한 유산 속에서 잠들었던 크메르 제국의 위대한 정신은 다시금 깨어날 준비가 필요합니다. 잊혀진 황금기의 영광을 되찾기 위한 첫걸음을 위해 우리는 나아갈 것입니다!"
