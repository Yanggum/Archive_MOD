l_korean: 
 #글로벌 태그
 KIABOTOS_Escape: "§Y일곱 죄수§!가 §Y탈옥§!함"
 CFLAG_SHA: "현재 국가가 @SHA산해경 고급중학교"
 GFLAG_BAKSANWAR: "§R남키보토스 전쟁§!이 발발함."
 GFLAG_BAKSANWAR_END: "§Y남키보토스 전쟁§!이 §Y백귀야행의 승리§!로 끝남."
 CFLAG_BAKSANWAR_END: "§Y남키보토스 전쟁§!이 §Y산해경의 승리§!로 끝남."
 #툴팁
 HYA_tt_1: "§Y6개 보병으로 이루어진 4개 사단§!을 얻습니다."
 HYA_focus_46_tt: "§R만약 §Y파시즘 정당 지지도§!가 이 중점 완료 시점에서 §Y15%§! 보다 높을 시, 내전이 시작될 것입니다!§!"
 HYA_focus_65_tt: "§R만약 §Y안정도§!가 이 중점 완료 시점에서 §Y40%§! 보다 낮을 시, 내전이 시작될 것입니다!§!"
 HYA_focus_65_tt2: "만약 §Y비동맹주의 정당 지지도§!가 이 중점 완료 시점에서 §Y45%§! 보다 높을 시, 정권이 교체될 것입니다."
 #이벤트
 HYA_event.1.t: "패전"
 HYA_event.1.desc: "전황을 뒤집으려고 노력하고, 더 노력했습니다만, 우리는 백귀야행과의 전쟁에서 패배했습니다. 더 이상 물러날 곳은 없으며 전쟁에서 패배한 것은 이미 기정 사실입니다.\n\n우리는 백귀야행에게 청하거나...마지막 결사 항전을 준비해야 합니다."
 HYA_event.1.a: "산해경, 산해경이여.."
 HYA_event.1.b: "최후의 최후까지...싸우자."
 HYA_event.2.t: "산해경의 항복 제의"
 HYA_event.2.desc: "우리가 산해경과의 전쟁에서 앞서나가는 가운데, 산해경 정부는 우리에게 항복을 청했습니다.\n\n우리는 전쟁에서 승리했습니다!"
 HYA_event.2.a: "우리의 승리!"
 HYA_event.2.b: "완전히 그들을 합병할 것이다!"
 HYA_event.3.t: "화조풍월부 포착!"
 HYA_event.3.desc: "혼란스러운 지난 여러 테러의 배후를 추적한 결과 그 뒤에는 아주 오래전 사라졌다고 알려진 화조풍월부가 실존했습니다. 도시전설로만 여겨졌던 이들의 존재는 방금 백귀야행 연합학원의 수행부가 이들을 공식적으로 인정함으로써 실체가 들어났습니다!"
 HYA_event.3.a: "정말로 실존한다고?"
 HYA_event.5.t: "무기고 약탈"
 HYA_event.5.desc: "정체 불명의 세력에게 우리의 무기고가 공습을 받아 다량의 총기들이 소실된 것을 확인했습니다."
 HYA_event.5.a: "범인을 추적해라."
 HYA_event.6.t: "공격받은 무기 공장"
 HYA_event.6.desc: "우리의 군대에 무기를 공급하는 공장 중 하나가 괴생명체에게 습격당했다는 소식이 방금 전해져왔습니다."
 HYA_event.6.a: "누가...이런 일을?"
 HYA_event.7.t: "폭발 사고"
 HYA_event.7.desc: "알 수 없는 이유로 방금 도심부에서 폭발이 발생해 상당한 규모의 도시 기반이 파괴되었으며 이는 현재 지속해서 추가적인 혼란을 초래하고 있습니다."
 HYA_event.7.a: "수리반을 보내!"
 HYA_event.8.t: "실종"
 HYA_event.8.desc: "우리 학원의 학생들에 대한 실종 신고가 최근 자주 접수되고 있습니다. 우리는 이 사건의 배후를 추적하고 있으나 딱히 성과는 없는 것으로 보입니다."
 HYA_event.8.a: "우연이 아닐까?"
 HYA_event.9.t: "화조풍월부의 선전포고"
 HYA_event.9.desc: "화조풍월부가 방금 우리 학원에 대항한 전면적인 선전포고를 선언했습니다. 그들은 백귀야행 연합학원 체제를 완전히 끝내버리겠다는 대담한 주장과 함께 우리를 향해 진격하고 있습니다."
 HYA_event.9.a: "끝을 보자."
 HYA_event.11.t: "백귀야행의 불개입 조약 추진"
 HYA_event.11.desc: "백귀야행 측은 구 유럽과 키보토스의 상생을 목적으로 하는 불개입 조약을 발표했습니다. 이는 발칸 국가들과 백귀야행 연합학원 간의 불가침 조약을 비롯한 다양한 방안으로 두 세계를 분리하는 것을 목적으로 하고 있습니다."
 HYA_event.11.a: "우리도 바라던 조약이다."
 HYA_event.11.b: "다른 생각이 있어."
 HYA_event.12.t: "불개입 조약을 승인한 [FROM.GetName]"
 HYA_event.12.desc: "[FROM.GetName] 측은 우리와의 불개입 및 불간섭 조약은 여러 방면에서 이득이 될 것 같다는 이유로 조약을 수락했습니다."
 HYA_event.12.a: "좋아."
 HYA_event.13.t: "불개입 조약을 거절한 [FROM.GetName]"
 HYA_event.13.desc: "[FROM.GetName] 측은 불개입 조약은 우리의 이익을 챙기려는 특정 목적을 달성하려는게 분명하다는 불분명한 이유로 조약을 거절했습니다."
 HYA_event.13.a: "흠..."
 HYA_event.14.t: "패전"
 HYA_event.14.desc: "전황을 뒤집으려고 노력하고, 더 노력했습니다만, 우리는 산해경과의 전쟁에서 패배했습니다. 더 이상 물러날 곳은 없으며 전쟁에서 패배한 것은 이미 기정 사실입니다.\n\n일부 지휘관들은 산해경에게 집단으로 항복하고 있는 것이 적발되었으며, 전황이 호전될 가능성은 전무합니다."
 HYA_event.14.a: "벚꽃이 스러진다..."
 HYA_event.14.b: "전원, 총옥쇄."
 HYA_event.15.t: "백귀야행의 항복 제의"
 HYA_event.15.desc: "우리가 백귀야행과의 전쟁에서 앞서나가는 가운데, 백귀야행의 지도부는 우리에게 항복을 청했습니다.\n\n우리는 전쟁에서 승리했습니다!"
 HYA_event.15.a: "다시, 산해경의 땅은 돌아왔다."
 HYA_event.15.b: "완전히 그들을 합병할 것이다!"
 HYA_event.16.t: "[From.GetNameDef] 측의 항복 거부"
 HYA_event.16.desc: "우리의 항복 제의를 [From.GetNameDef] 측은 거절했습니다. 저들은 우리의 온전한 끝을 바라보는 것 같습니다..."
 HYA_event.16.a: "...."
 HYA_event.17.t: "백야앵제의 초대장"
 HYA_event.17.desc: "과거, 대전이가 벌어지기 이전에 백귀야행 연합학원이 추진하던 백야앵제를, 지금 추진하겠다며 우리를 향해 초대장을 보내왔습니다.\n\n공식적으로 참여하거나, 하지 않아도 일반 학생들의 참여는 상당할 것으로 추산되나, 우리가 공식적으로 참여 의사를 밝힌다면 정치적 이득을 얻을 수 있을 것입니다."
 HYA_event.17.a: "참여하자."
 HYA_event.17.b: "...이미, 돌아가기엔 너무 늦었다."

 HYA_event.18.t: "이계 축제의 초대장"
 HYA_event.18.desc: "대전이가 벌어지기 이전, 키보토스에서 백귀야행 연합학원 측이 정기적으로 개최하던 축제인 백야앵제에 대한 초대장을 우리에게도 보내왔습니다.\n\n참여를 선언한다면, 평화에 대한 모습을 대중에게 각인시킬 수 있으며, 이계와의 문화 교류에 도움을 줄 수 있습니다."
 HYA_event.18.a: "참여하자."
 HYA_event.18.b: "잘못 보내온거 아닌가?"

 HYA_event.19.t: "백화요란 부장이 돌아오다"
 HYA_event.19.desc: "내용"
 HYA_event.19.a: "아야메가 돌아왔다고?"

 #중점
 HYA_focus_1: "연합학원의 상황"
 HYA_focus_1_desc: "대전이 이후 백귀야행의 상황은 더욱 심각해졌습니다. 백귀야행의 많은 동아리와 상인 조합은 혼란을 틈타 음양부의 통제를 벗어났으며, 음양부와 백화요란 사이에선 사태의 해결 방안을 두고 갈등의 조짐을 보이고 있습니다. 이 혼란을 헤쳐나가기 위해선 과감한 결단이 필요할 것입니다."
 HYA_focus_2: "문화와 축제의 학원"
 HYA_focus_2_desc: "백귀야행 연합학원은 관광업이 매우 발달한 학원이나, 현재 대전이의 혼란으로 인해 많은 관광시설이 파괴되고 축제가 취소되었습니다. 관광업 파산을 막기 위한 마츠리운영관리부의 필사적인 노력으로 몇몇 축제는 정상적으로 진행되고 있지만, 추가적인 지원이 없다면 백귀야행의 전통은 사라지고 말 것입니다."
 HYA_focus_3: "신임위원회 조직"
 HYA_focus_3_desc: "백귀야행의 분쟁을 조절하는 백화요란과 유사하나, 조금은 더 정치적이고 광범위한 신임위원회라는 새로운 집단을 조직할 것입니다. 이 기관은 각 동아리의 신임을 얻어 동작하는, 기초적인 수준의 의회, 또는 토론장으로 동작할 것이며, 이는 추후 백귀야행 연합학원을 강인하게 단결할 기회를 제공할 것입니다."
 HYA_focus_4: "수행부의 협력"
 HYA_focus_4_desc: "멋진 레이디가 되기 위해 수행을 하는 동아리인 수행부는 신임위원회 조직 이전에도 독자적인 피난민 구호 활동을 하며 현지인과 학생들에게 좋은 이미지를 쌓았습니다. 이들과의 협력은 신임위원회의 설립 목표인 백귀야행 연합학원의 단결을 대중들에게 더욱 어필할 수 있을 것입니다."
 HYA_focus_5: "음양부의 협력"
 HYA_focus_5_desc: "신임위원회가 백귀야행에서 정치적인 힘을 발휘하기 위해서는 음양부의 승인이 절대적으로 필요합니다. 다행히도 음양부의 부장 야마치 니야는 신임위원회 설립에 호의적인 입장을 취하고 있기에, 음양부와의 협력은 어렵지 않을 것으로 예상됩니다."
 HYA_focus_6: "전쟁에 대비"
 HYA_focus_6_desc: "백귀야행은 정규군이라고 할 만한 집단이 존재하지 않아 각 동아리가 자율적으로 설립한 자경단에 의존하고 있었습니다. 많은 군 전문가들은 현재 백귀야행의 군사력으로 백귀야행의 내부 혼란을 잠재우고 외부 세력의 침공에 대비하기가 현실적으로 불가능하다고 말하며, 훈련된 정규군의 설립을 강력하게 주장하였습니다."
 HYA_focus_7: "우리의 전쟁"
 HYA_focus_7_desc: "백귀야행은 느슨한 동아리들의 연합체로 이루어져있어 연대의식이 타 학원에 비해 저조한 편입니다. 그러나 대전이로 인해 상황이 바뀌었습니다. 같은 학원이라는 집단으로 뭉쳐 함께 생존해야하는 학생들에게는 서로에 대한 연대의식이 싹트고 있기 때문에, 약간의 선전활동이 추가된다면 백귀야행은 진정한 '연합학원'이 될 수 있을 것입니다."
 HYA_focus_8: "일 할 시간"
 HYA_focus_8_desc: "$HYA_NIYA$는 더 이상 모든 걸 낙관하는 모습으로만 활동할 수 없습니다. 그녀는 이제 자신의 능력을 활용해 주도적으로 백귀야행을 통합하고, 더 나아가 '모든 동아리의 의지를 하나로 모으는' 신체제를 수립하기 위한 이상주의적 도약을 시작할 것입니다."
 HYA_focus_9: "와라쿠 공주님"
 HYA_focus_9_desc: "백귀야행의 슈퍼스타 와라쿠 치세, 일명 '와라쿠 공주님'의 연기력과 특유의 기묘한 귀여움은 현지인들 사이에서도 선풍적인 인기를 끌고 있습니다. 그녀는 현재 백귀야행 전역에 위문공연을 돌며 대전이로 피폐해진 일상을 잠시 잊게 해주고 있습니다."
 HYA_focus_10: "상인조합 억제"
 HYA_focus_10_desc: " '냥테 마사무네'라는 이명으로 백귀야행 뒷세계를 장악하고 있는 상인조합의 대표 냥텐마루가 대전이를 기회 삼아 마츠리운영관리부를 흡수하려는 음모를 꾸미고 있다는 첩보가 들어왔습니다. 이들을 억제하여 상인조합의 힘이 커지는 것을 막아야합니다."
 HYA_focus_11: "아편 무역 허용"
 HYA_focus_12: "남키보토스 전쟁"
 HYA_focus_12_desc: "백귀야행과 산해경은 대전이 이전까지 서로에게 무관심한 사이였지만, 이젠 생존을 위해서 서로 싸워야하는 입장이 되었습니다."
 HYA_focus_13: "항전 개시"
 HYA_focus_13_desc: "우리의 예상과 다르게 산해경의 군대는 우리 군대보다 강력하였습니다. 군대는 무모한 전선유지 대신 일시적으로 후퇴하여 백귀야행의 시가지를 엄폐물 삼아 항전할 것을 명령하였습니다."
 HYA_focus_14: "군수산업 동원"
 HYA_focus_14_desc: "전쟁 이후 백귀야행 군의 문제점이 조금씩 드러나고 있습니다. 아직은 미숙한 동아리간의 연합작전은 둘째치더라도, 가장 중요한 군수물자의 부족이 백귀야행 군의 발목을 잡고 있습니다. 기용 가능한 군수산업을 동원하여 이 문제를 해결해야합니다."
 #HYA_focus_15: "해방을 향하여"
 HYA_focus_16: "징병 대상 확대"
 HYA_focus_16_desc: "참혹한 전쟁으로 인해 백귀야행에 충성하는 많은 군인들이 포화속으로 사라졌습니다. 정부는 부족한 군인의 수를 메꾸기 위하여 징병 대상의 확대를 실시하였습니다."
 #HYA_focus_17: "후퇴"
 #HYA_focus_18: "반격의 시간"
 HYA_focus_19: "백야당 확장"
 HYA_focus_19_desc: "마츠리운영관리부는 대전이의 혼란속에서도 백귀야행의 전통을 지키기 위해 많은 노력을 하였습니다. 음양부는 축제에 한해서는 자신들보다 전문가인 이들에게 이전보다 많은 권한을 부여하였고, 그간의 공로를 치하하며 백야당의 확장공사를 지원해주었습니다."
 HYA_focus_20: "도시화 계획"
 HYA_focus_20_desc: "음양부는 카와와 시즈코의 민간 분야에서의 수완을 높게 평가하였고, 그녀에게 백야당 근처의 낙후된 도시 지역의 개발권을 주었습니다. 시즈코는 이곳을 원활한 축제, 그리고 마지막 목표인 백야앵제를 개최하기 위한 기반시설 설립을 위해 도시화 계획을 발표하였습니다."
 HYA_focus_21: "제1차 백야앵제 계획"
 HYA_focus_21_desc: "마츠리운영관리부는 대전이 이후의 첫 대형 행사인 백야앵제를 개최하기로 하였습니다. 반대 의견도 존재하였지만, 대다수의 관계자들은 백귀야행의 전통이 아직 건재하다는 것을 대중들에게 알리기 위해선 백야앵제의 개최가 필수라는 마츠리운영관리부의 의견에 동의를 표하였습니다."
 HYA_focus_22: "공동축제위원회"
 HYA_focus_22_desc: "키보토스와 비교하여 열약한 환경 탓에 백야앵제의 준비과정에서 기술적, 효율성 면에서 미흡한 점이 많이 보이고 있습니다. 이를 개선하고자 시즈코는 음양부에게 받은 권한을 이용하여 상인, 건축가, 기타 관계자들과 협력하여 보다 효율적인 축제 준비를 할 수 있는 기관인 공동축제위원회를 설립하였습니다."
 HYA_focus_23: "제2차 백야앵제 계획"
 HYA_focus_23_desc: " 제1차 백야앵제 계획에 관하여 토론이 이뤄지고 난 뒤, 마츠리운영관리부는 백야앵제의 행사 준비 과정에서 보강해야할 문제점과 여러 애로사항들을 파악하기 위해서 2차 회의에 들어갔습니다."
 HYA_focus_24: "상점가 정비"
 HYA_focus_24_desc: "백귀야행의 노점상은 축제의 부가적인 즐길 거리중 하나였지만, 축제에 의존하는 경향이 있는 상점들은 대전이 이후 상업기반은 완전히 소실되었습니다. 백귀야행이 과거의 명성을 완벽히 되찾기 위해선 이들의 구제가 필수적입니다."
 HYA_focus_25: "백야앵제"
 HYA_focus_25_desc: "드디어 모두가 기다리던 백야앵제가 개최되었습니다. 비록 현실적인 이유로 키보토스에서 볼 수 있던 웅장한 규모의 축제가 되지는 못하였지만, 많은 학생들이 이 축제를 통해서 키보토스에서의 일상을 추억하고, 기억했습니다. 놀랍게도 현지인들 또한 이날은 증오의 감정 없이 학생들과 함께 축제에 참여하는 모습을 보였습니다. 이날만큼은 모두가 피폐해진 일상에서 위안을 얻는 날이였습니다."
 HYA_focus_26: "요조숙녀의 마음가짐"
 HYA_focus_26_desc: "백귀야행의 학생들은 트리니티와 유사하게, '고요하고 맑은 정신을 소유한 기품있는 아가씨의 마음가짐'을 최고 미덕으로 생각하고 있습니다. 비록 대전이가 이들의 일상을 파괴하였을지라도, 백귀야행 학생들의 마음속 깊은 곳엔 요조숙녀의 마음가짐이 있습니다."
 HYA_focus_27: "수행부의 선도부 대리"
 HYA_focus_27_desc: "백귀야행의 치안조직에는 백화요란 분쟁조정위원회가 있지만, 이들은 화조풍월부의 실체를 밝혀내는데 집중하기 위해 평소 자경 활동을 자처하는 수행부에게 정식으로 선도부의 권한 대행을 요청하였습니다. 음양부는 이를 숙고한 끝에 승인하였고, 이제 수행부는 백화요란을 대신하여 치안 유지 활동에 더욱 힘을 쓸 것입니다."
 HYA_focus_28: "교외 지역 순찰"
 HYA_focus_28_desc: "수행부의 자경 활동으로 백귀야행 시내는 다소 안전해졌지만, 교외 지역은 생존을 위해 서로 싸우는 키보토스 무법자들과 이계인 증오 범죄를 자행하는 현지인 무력집단이 얌악 중입니다. 교외까지 백귀야행의 통제력을 확보하기 위해 수행부는 순찰 구역 확대를 검토중에 있습니다."
 HYA_focus_29: "망량즈 회유"
 HYA_focus_29_desc: "대전이 이후로 세가 줄었지만, 망량즈는 아직도 백귀야행의 골칫거리로 남아있습니다. 이들의 전투력은 치안유지대 수준으로는 적절하기에, 적절한 회유와 협박을 사용하여 이들을 굴복시킨다면 현재 백귀야행에 부족한 인력을 충원할 수 있을 것입니다."
 HYA_focus_30: "망량즈 파괴 개시"
 HYA_focus_30_desc: "대전이 이후에도 망량즈의 테러활동은 아직도 계속되고 있습니다. 이들은 연약한 시민과 학생들을 무차별적으로 습격하여 얼마 없는 생필품을 약탈하고 있기에, 무력을 사용해서라도 신속히 진압되어야합니다."
 HYA_focus_31: "군사 개혁"
 HYA_focus_31_desc: "백귀야행의 가장 큰 문제는 통일되지 않은 군대입니다. 백귀야행의 군사력이 다른 학원, 현지인들의 국가와 동등한 수준에 이르기 위해선, 모든 동아리의 자경단을 소집하여 이들에게 여러 혜택을 주어 백귀야행의 정규군으로 만들고 통일된 규율을 설립해야합니다."
 HYA_focus_32: "수행의 힘"
 #HYA_focus_33: "우리의 승리"
 HYA_focus_34: "산업 개발"
 HYA_focus_34_desc: "대전이로 인해 백귀야행이 자랑하는 수많은 산업시설과 노점상은 파괴되었습니다. 이 피해를 단기간에 복구하기엔 무리가 있어보입니다. 정부는 체계적인 계획을 세워 산업 복구를 위한 준비를 하고있습니다."
 HYA_focus_35: "대도시 요새화"
 HYA_focus_35_desc: "백귀야행의 대도시는 망량즈와 같은 잡졸들의 공격을 막기에는 충분하나, 조직적이고 계획적인 군대의 공습엔 취약합니다. 이런 대도시의 취약점을 파악한 정부는 대도시의 효율적인 방어를 위해 시가지를 요새화 하기로 결정했습니다."
 HYA_focus_36: "주데텐란트선 건설"
 HYA_focus_36_desc: "산해경과의 전쟁으로 인해 대도시의 방비에 보완해야될 점이 여럿 보였습니다. 이에 정부는 산해경에서 뜯어온 현지인들의 언어로 '주데텐란트'라는 땅과 백귀야행의 대도시들을 잇는 거대 방어선, 주데텐란트선을 만들기로 하였습니다."
 HYA_focus_37: "무기 공장 확장"
 HYA_focus_37_desc: "파괴된 산업단지의 일부는 키보토스에서의 필수품인 총을 만들어주는 공장입니다. 이들중 대다수는 자원 부족으로 인해 수요를 따라갈 수 없는 상황입니다. 현지 군수업자들의 도움을 받아 이들에게 현지 보병 장비의 설계도를 받아 자체적으로 생산하도록 하게 해야합니다."
 HYA_focus_38: "민간산업 지원"
 HYA_focus_38_desc: "백귀야행의 심장이라고 할 수 있는 민간산업은 대전이로 대부분 파괴되었습니다. 소수 살아남은 민간산업 또한 정부의 개입이 없다면 망해버리고 말 것이기에, 즉각적인 조치가 필요합니다."
 HYA_focus_39: "산업 혁신"
 HYA_focus_39_desc: ""
 HYA_focus_40: "도로 재정비"
 HYA_focus_40_desc: ""
 HYA_focus_41: "백귀야행 종합대학"
 HYA_focus_41_desc: ""
 HYA_focus_42: "연립연구부 수립"
 HYA_focus_42_desc: ""
 HYA_focus_43: "인법에 대한 관심"
 HYA_focus_43_desc: ""
 HYA_focus_44: "여우와의 동행"
 HYA_focus_44_desc: "정부의 관계자들은 대전이의 특수성을 고려하여 칠수인중 하나인 코사카 와카모의 정학을 취소하고, 모든 죄를 사면하며 백귀야행의 장군으로 삼겠다는 발표를 하였습니다. 그러나 백귀야행의 많은 학생들은 이 조치에 불만을 가지고 있는 것 같습니다."
 HYA_focus_45: "와카모의 정학 지속"
 HYA_focus_45_desc: "백귀야행 내부의 급진파들의 주장에도 불구하고, 칠수인중 하나인 코사카 와카모의 정학 취소는 현 정부에 의해 공식으로 거부되었습니다. 이들은 와카모의 테러 활동이 학원의 명예에 씻을 수 없는 큰 상처를 남겼다며, 이에 대전이 이후로도 와카모의 정학을 지속할 것이라고 밝혔습니다."
 HYA_focus_46: "신임위원회 강화"
 HYA_focus_46_desc: ""
 HYA_focus_47: "백귀야행 학생회"
 HYA_focus_47_desc: "신임위원회의 후신인 백귀야행 학생회가 공식적으로 수립되었습니다. 학생회는 첫 연설에서'공의정체론'에 입각하여 동아리간의 평등을 조성하고, 백귀야행 시민의 안녕을 그 무엇보다 중시한다고 하였습니다."
 HYA_focus_48: "방위산업"
 HYA_focus_48_desc: "백귀야행은 우선 내부의 안정을 취하는 것이 우선이고, 이를 위해선 군대의 성장이 필수적입니다. 이에 맞춰 방위산업 또한 육성해야할 필요가 있습니다."
 HYA_focus_49: "항공기 역설계"
 HYA_focus_49_desc: "키보토스와 유사하지만 조금 다른 환경에 적응해야하는 것은 항공기 또한 마찬가지입니다. 현지의 기술력으로 만들어진 항공기를 역설계하여 현지의 환경에 맞는 항공기를 개발해야합니다."
 HYA_focus_50: "보병 화력 개선"
 HYA_focus_50_desc: "현지인 군대와의 전투 이후, 백귀야행 군은 키보토스의 병기가 현지인 보병대를 상대하기에 효율이 좋지 않다는 것을 알게 되었습니다. 이에 군 연구소는 현지 기술력을 응용하여 보병 화기를 현지인과의 전투에서 더욱 효율적으로 개선하는데 성공하였습니다."
 HYA_focus_51: "전시 경제 체제"
 HYA_focus_51_desc: "백귀야행 정부는 현재 군 성장에 초점을 두고 있습니다. 이 결과로 조금씩 증가하는 군의 수요를 맞추기 위해서 정부는 통제가 가능한 백귀야행의 공장을 대상으로 전시 경제 체제를 선포하였습니다."
 HYA_focus_52: "전투기 개발"
 HYA_focus_52_desc: "군 연구소의 항공부서는 현지 기술력을 역설계한 효율적인 항공기를 만드는데 성공하였습니다. 이들은 이를 기반으로 키보토스와 현지의 기술력을 접목시킨 전투기를 만드는 프로젝트의 초안을 상부에 제출하였습니다."
 HYA_focus_53: "폭격기 연구"
 HYA_focus_53_desc: "항공기의 역설계화가 성공한 직후, 항공부서의 일부 열정적인 인재들은 현지의 폭격기를 키보토스의 기술력과 결합하자는 의견을 내비쳤습니다. 이는 바로 상부의 승인을 받게되었고, 이들은 현재 폭격기 연구에 전념하고있습니다."
 HYA_focus_54: "백귀야행 항공연구소"
 HYA_focus_54_desc: "군 연구소 내부에서 소규모였던 항공 연구 부서는 연속적인 성공으로 인해 그 입지가 상승하였습니다. 이 빛나는 인재들을 눈여겨본 백귀야행 정부는 이들을 위한 항공연구소를 제공해주어 이들이 연구에 전념할 수 있도록 도움을 주었습니다."
 HYA_focus_55: "제트 항공기"
 HYA_focus_55_desc: "키보토스에서 제트 기술은 흔하지만, 아직 이곳에서 제트 기술은 상용화 되지 않은 것 같습니다. 우리가 제트 항공부대를 설립한다면 현지인들과의 전투에서 제공권의 우위를 차지할 수 있을 것입니다."
 HYA_focus_56: "공중 교리 통합"
 HYA_focus_56_desc: "통일되지 못한 교리는 백귀야행 육군만의 문제가 아닙니다. 다행히도 백귀야행의 공군 교리는 육군처럼 수십개씩 존재하지는 않기 때문에, 상대적으로 원활한 교리의 통합이 이뤄질 것으로 예상됩니다."
 HYA_focus_57: "삽과 철로"
 HYA_focus_57_desc: "대전이의 영향으로 백귀야행과 현지의 철로는 모두 제 기능을 하지 못하게 되었습니다. 국가 산업의 일환으로 실업자들을 고용하여 철로를 짓게 한다면, 경제 안정과 국가 인프라 복구라는 두가지 토끼를 모두 잡을 수 있을 것입니다."
 HYA_focus_58: "광산업 확대"
 HYA_focus_58_desc: "키보토스의 기술력으로 백귀야행 일대와 주데텐란트에 아직 발굴되지 않은 지하자원이 있다는 것을 알게되었습니다. 발전된 키보토스의 기술이 있다면 이것을 캐내는 것은 식은 죽 먹기입니다."
 HYA_focus_59: "더 많은 토지"
 HYA_focus_59_desc: "백귀야행의 캠퍼스 몇채는 대전이의 영향으로 복구 불가능한 수준으로 파괴되었습니다. 옛 캠퍼스의 잔해를 치워 이곳의 지대를 다지고 새로운 기회의 땅으로 만들어야 합니다!"
 HYA_focus_60: "철도 집중"
 HYA_focus_60_desc: "대전이 이후 하이랜더 철도학원의 관할에 있는 백귀야행을 거치는 선로들은 대부분 우리의 것이 되었습니다. 하이랜더의 간섭이 약해진 지금이야말로 현지 철도와의 원활한 연결을 위한 적기입니다."
 HYA_focus_61: "국가 수립"
 HYA_focus_61_desc: "신임위원회의 수많은 노력 끝에, 백귀야행은 정치적으로 통합되는데 성공하였습니다. 백귀야행은 더이상 이름만 연합이 아닌, 진정한 '연합학원'으로 거듭나게 되었습니다!"
 HYA_focus_62: "음양부의 주도"
 HYA_focus_62_desc: "비록 음양부가 백귀야행의 정식 학생회가 아닐지라도, 그 정통성과 입지는 음양부가 신임위원회를 주도하는 것에 큰 반감을 표하지 않게 만들었습니다. 이들이 새로이 설립되는 백귀야행 학생회를 주도하는 것이 정통성 있을지 모르나, 신임위원회의 설립 가치인 '평등'에 위반된다며 반대하는 이들이 있을 것입니다."
 HYA_focus_63: "권력 분립"
 HYA_focus_63_desc: "신임위원회는 백귀야행의 화합을 위해서 '평등'이라는 가치를 우선시 해왔습니다. 백귀야행 학생회의 출범에 앞선 지금, 신임위원회 내부의 임원들은 토론 끝에 음양부를 포함한 모든 백귀야행의 동아리는 학생회에서 동등한 목소리를 가지며, 학생회는 각 동아리의 분쟁을 중립적인 관점에서 해결할 것임을 공식적으로 선포하였습니다."
 HYA_focus_64: "백화요란 분쟁조정위원회"
 HYA_focus_64_desc: "백귀야행은 현 체제에 안정하기에는 너무나도 위태롭습니다. 백귀야행 연합학원은 우리 백화요란 분쟁조정위원회의 새로운 지도 계율에 따라 재편되어야 마땅합니다! 우리 학원을 수호하기 위한 선택이 지금 바로 집행될 것이며, 체코계를 향한 방치적 관용정책과 동아리의 돌발적 행동들은 즉시 중단될 것입니다."
 HYA_focus_65: "화조풍월부 토벌"
 HYA_focus_66: "반 학원 활동 단속"
 HYA_focus_67: "체코인 집회 금지"
 HYA_focus_68: "테러리스트 제거"
 HYA_focus_69: "질서와 규율"
 HYA_focus_70: "백귀야행 체제 타도"
 HYA_focus_71: "화조풍월부와 협력"
 HYA_focus_72: "요괴 배척"
 HYA_focus_72_desc: "저 수상쩍은 힘을 다루는 화조풍월부와 협력하는 건 별로 좋은 꼴은 보지 못할 것입니다. 우리 망량즈는 화조풍월부를 단호하게 거부하고 우리만의 방식대로 -때로는 우리의 정체성이 흐려지더라도- 목적을 이뤄낼 것입니다."
