 HYA_focus_95: "백귀야행 군사통제부"
 HYA_focus_96: "유연한 동아리 체제"
 HYA_focus_96_desc: "학생회의 설립 이념인 '평등'을 실천하기 위해선 동아리간의 갈등을 적절히 조절할 능력이 있어야 합니다. 어쩌면 동아리 체제를 유연하게 개편하여 이들간의 갈등이 생기는 상황을 사전에 방지하는 것이 더 나을지도 모릅니다."
 HYA_focus_97: "백귀야행국"
 HYA_focus_100: "국내 집중"
 HYA_focus_100_desc: "학생회의 설립을 통한 백귀야행의 정치적 통합으로 학원의 분열은 간신히 막는데 성공하였지만, 아직 백귀야행 내부에는 해결해야할 문제가 많이 남아있습니다. 지금은 세계와 잠시 단절하고, 내부 문제에 개입하는 것이 우선입니다."
 HYA_focus_101: "국경 수호"
 HYA_focus_102: "반 개입주의 외교 정책"
 HYA_focus_102_desc: "신임위원회 시절부터 백귀야행은 다른 학원간의 갈등 상황에서 중립적인 태도를 고수해왔습니다. 이들의 후신인 학생회는 내부 문제가 해결될때까지 백귀야행이 타국에 개입하지 않고, 중립적인 태도를 취할 것이라는 공식적인 입장을 내놓았습니다."
 HYA_focus_103: "국경 요새 건설"
 HYA_focus_103_desc: "중립이 모든 전쟁을 피할 수 있는 방패는 아닙니다. 오히려 중립은 자기 자신을 고립시키는 결과로 이어지기도 합니다. 그렇기에 백귀야행은 외적에 침략에 지원을 기대하지 않고, 방어선을 단단히 하여 외적에 침략에 대비해야합니다."
 HYA_focus_104: "불개입 조약 추진"
 HYA_focus_104_desc: "발칸의 여러 국가는 점점 성장하는 백귀야행의 다음 행보에 주목하고 있습니다. 만약 백귀야행이 발칸 패권전쟁에 끼어든다면 이들은 단결하여 우릴 공격할지도 모릅니다. 그렇기에 우린 불개입 조약을 추진하여 우리가 침략에 관심이 없다는 것을 알려야합니다."
 HYA_focus_105: "발칸 장벽"
 HYA_focus_105_desc: "발칸 국가들의 갈등은 날이 갈수록 심화되고 있으며, 약간의 불씨만 있다면 언제 터질지 모르는 화약고와 같습니다. 학생회의 임원중 현지 문화를 자세히 알고 있는 몇몇 학생은 이를 대비하여 접경지에 견고한 장벽을 세울 것을 건의하였습니다."
 HYA_focus_106: "적성 국가 판별"
 HYA_focus_107: "백귀야행 요새 위원회"
 HYA_focus_107_desc: "반 개입주의 정책에 따라 국경을 수호하기 위한 수많은 요새가 건설되었습니다. 요새의 유지보수, 관리와 이 요새로 보급되는 수많은 물자를 효율적으로 컨트롤 하기 위해서 정부는 요새 위원회를 설립하였습니다."
