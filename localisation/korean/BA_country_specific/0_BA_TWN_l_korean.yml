#국민정신
TWN_right_of_resistance_idea: "세디크의 의지"
TWN_right_of_resistance_idea_desc: "타이완 섬이 일본의 식민지가 된 이후에도, 타이완 섬의 원주민인 세디크 민족은 굴복하지 않았습니다. 1930년의 무샤 사건(Musha Incident)은 세디크인들의 저항 정신을 드러내는 대표적인 사건이었습니다. 세디크 부족장인 모나 루다오가 이끄는 독립군은 타이완 총독부에 의하여 분쇄될 때까지 마지막까지 타이완 섬의 산악 지형을 이용해 게릴라 작전을 펼쳤습니다.\n\n1930년의 투쟁은 분쇄되었으며 모나 루다오는 포로가 되는 대신 자결을 선택하였지만, 그들이 남긴 게릴라 전술에 대한 노하우와 타이완 섬을 지키고자 하는 저항 정신은 잊히지 않은 채 남았습니다."