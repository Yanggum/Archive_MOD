 INS_revolutionary_war: "인도네시아 국민 혁명"
 INS_revolutionary_war_desc: "\n\n\n£GFX_banner_INS_revolusi_nasional_indonesia\n\n\n\n\n우리 인도네시아 청년, 인도네시아의 성난 황소들에게 흰옷을 적실 붉은 피가 흐르는 한 우리는 절대 항복하지 않을 것이다. 동지들이여, 투사들이여, 인도네시아 청년이여, 우리는 계속해서 싸운다. 우리는 사랑하는 조국 인도네시아 땅에서 식민주의자를 모두 몰아낼 것이다. 오래도록 우리는 고통받고, 착취당하고, 짓밟혔다. 지금이야말로 우리가 독립을 쟁취할 시간이다. 자유 아니면 죽음을! 신은 가장 위대하시다!... 신은 가장 위대하시다!... 신은 가장 위대하시다!... 자유를!"

 INS_japan_support_national_revolution: "일본의 국민 혁명 지원"
 INS_japan_support_national_revolution_desc: ""
 INS_japan_support_national_revolution_tt: "§Y[JAP.GetAdjective]§!에 §Y[672.GetName]§!의 모든 자원에 대한 권리 부여"
 INS_japan_support_national_revolution_2_tt: "\n$DECISION_REMOVE_HEADER$\n§Y[672.GetName]§!의 자원에 대한 권리 제거"

 INS_economy_dependent_on_japan: "일본에 의존하는 경제"
 INS_economy_dependent_on_japan_desc: "국민 혁명은 성공했습니다. 그러나 우리는 일본의 지원에 기대어 그것을 이루었을 뿐입니다. 독립을 손에 넣었지만, 또 다른 예속의 사슬이 우리를 옥죄고 있습니다."

 INS_guide_democracy: "판차실라 체제"

 INS_building_a_new_nation-state: "새로운 국민국가 건설"

 indonesia_events.1.t: "국민 혁명의 승리"
 indonesia_events.1.desc: "독립선언문\n\n우리 인도네시아 국민은 이로써 인도네시아의 독립을 선언한다.\n\n권력 이양 및 기타 사항은 질서정연하게, 그리고 가능한 한 최단 시간 내에 이행될 것이다.\n\n자카르타, [GetDate], 인도네시아 국민의 이름으로, 수카르노/하타."
 indonesia_events.1.a: "위대한 승리이다."

 indonesia_events.2.t: "국내 문제들"
 indonesia_events.2.desc: "국민 혁명에서 승리했지만 아직 내부 문제가 많습니다. 우리는 내부 문제를 처리하기 위해서 많은 노력을 쏟아야 할 것입니다."
 indonesia_events.2.a: "빠르게 해결해보자."