 TRN_Mika_social_problem_cat: "트리니티 사상누각"
 TRN_Mika_social_problem_cat_desc: "\n\n£GFX_decision_header_TRN_ruin_street\n\n\n\n\n이제, 독일인들은 우리의 지배를 순순히 받아들이지 않습니다. 트리니티는 예전과 다름없이 그대로였지만, 그들이 살던 ‘독일’은 극적으로 변모하였습니다. [TRN_Mika_social_problem_decision_desc]\n\n현재 @WGR 독일계 징병 가능 인구: [?TRM.TRM_pro_german_propaganda_conscription_factor|%+1]\n[GetTrCFLevelText] [GetTrmCFPenaltiesText]"
 TRN_Mika_social_problem: "§p거세지는 독일의 저항§!"
 TRN_Mika_social_problem_tt: "@WGR독일계 주민들의 저항이 §t격화§!되고 있습니다.\n$TRM_CF_modifier_tt$\n 징병 가능 인구: §R[?TRM.TRM_monthly_conscription_factor_increase|%1]§!\n\n"
 TRN_Mika_social_problem_days_tt: "$TRN_Mika_social_problem$ 임무는 이제 $RIGHT|Y0$일의 시간이 덜 요구 됩니다."
 TRN_Mika_social_problem_days_increase_tt: "$TRN_Mika_social_problem$ 임무는 이제 $RIGHT|Y0$일의 시간이 더 요구 됩니다."

 TRN_Mika_desc_social_problem_cat: "새롭게 태동한 두 번째 트리니티가 다가올 역사의 두 번째 시험에서 실패할 것인지, 아니면 학원을 전례 없는 위대함의 경지로 이끌어낼 것인지는 오직 시간이 말해줄 것입니다."
 TRN_Nagisa_desc_social_problem_cat: "위기를 극복한 트리니티 앞에는 또 다른 시련이 기다리고 있습니다. 다가올 역사의 두 번째 시험에서 실패할지, 아니면 성공할지는 오직 그녀에게 달려 있습니다."
 TRN_general_desc_social_problem_cat: "트리니티의 위협을 해결하기 위해서는 이들과의 협력이 불가피할 것입니다. 트리니티와 독일 간의 관계라는 천칭 위에서 균형을 이루어야만, 비로소 진정한 의미의 통합이 가능해질 것입니다."

