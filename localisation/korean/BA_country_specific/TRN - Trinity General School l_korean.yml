 trinity_events_nagisa_diplomacy.24.a: "레이를 향해 돌진한다."
 trinity_events_nagisa_diplomacy.24.b: "안전한 다른 통로를 찾아본다."
 trinity_events_nagisa_diplomacy.25.t: "Code: BOX - 폐막식"
 trinity_events_nagisa_diplomacy.25.desc.nagisa: "밀레니엄 엑스포는 길고, 다사다난했다. 하지만 폐막식에서도 별다른 일이 일어나지는 않을 것이다. 나기사는 [MIL.GetLeader] 측의 연설로 막을 내리는 폐막식에 참여하며, 안도의 한숨을 내뱉었다. 분명 나기사 본인은 온갖 사건들을 겪었지만, 그래도 그녀를 따라 온 수행원들은 밀레니엄의 다양한 기술들을 보고, 체험하고, 배울 수 있었다. 밀레니엄은 적이 아닌 트리니티가 더 많은 것을 배우고 우정을 쌓을 수 있는 국가였다.\n\n\"...이상으로, [GetYear] 년 밀레니엄 엑스포의 폐막식을...\"\n\n그 순간, [MIL.GetLeader]의 말이 채 끝나기도 전, 갑자기 폐막식이 열리던 강당 벽이 부서졌다. 쾅-! 하는 소리와 함께, 엔지니어부 소녀들의 비명이 들려왔다. \"저거! 우리가 연구하던 빅사이즈 로봇 악어잖아?!\" 빅사이즈? 신이시여, 자비로운 신이시여. 제발, 폐막식에서까지 이러시면 아니됩니다. 나기사는 자신의 경호원들과 같이 일어났다. 거대한 중형전차 크기의 악어가 입에서 불을 내뿜으며 폐막식장으로 뛰어들어왔다. 폐막식장을 지키던 밀레니엄 경비 인력들이 달려들었다가, 그대로 악어의 강철 꼬리에 맞고 하늘을 향해 날아갔다.\n\n\"키에에엑!\"\n흉측한 괴성과 함께, 로봇 악어는 그대로 폐막식 연설을 진행하던 [MIL.GetLeader]가 있는 무대 위로 뛰어 올라왔다. [MIL.GetLeader]의 경악한 얼굴, 그리고 막 폐막식장으로 들어오는 C&C. 나기사는 빠르게 계산했다. 시간이 맞지 않는다. C&C가 밀레니엄 학생회장을 구해내기도 전, 저 로봇 악어가 그녀를 씹어 먹어 버릴 것이 분명했다. 정말로, 정말 최악의 엑스포였다. 나기사는 자신의 정의감에 따라 앞으로 뛰쳐나갔다. 티파티의 우아한 정치인이 아닌, 선량한 한 사람의 인간 키리후지 나기사로서."
 trinity_events_nagisa_diplomacy.25.desc.ichika: "밀레니엄 엑스포는 길고, 다사다난했다. 하지만 폐막식에서도 별다른 일이 일어나지는 않을 것이다. 이치카는 [MIL.GetLeader] 측의 연설로 막을 내리는 폐막식에 참여하며, 안도의 한숨을 내뱉었다. 분명 이치카 본인은 온갖 사건들을 겪었지만, 그래도 그녀를 따라 온 수행원들은 밀레니엄의 다양한 기술들을 보고, 체험하고, 배울 수 있었다. 밀레니엄은 적이 아닌 트리니티가 더 많은 것을 배우고 우정을 쌓을 수 있는 국가였다.\n\n\"...이상으로, [GetYear] 년 밀레니엄 엑스포의 폐막식을...\"\n\n그 순간, [MIL.GetLeader]의 말이 채 끝나기도 전, 갑자기 폐막식이 열리던 강당 벽이 부서졌다. 쾅-! 하는 소리와 함께, 엔지니어부 소녀들의 비명이 들려왔다. \"저거! 우리가 연구하던 빅사이즈 로봇 악어잖아?!\" 빅사이즈? 아. 제발, 폐막식에서까지 이러기 어디 있슴까. 이치카는 자신의 경호원들과 같이 일어났다. 거대한 중형전차 크기의 악어가 입에서 불을 내뿜으며 폐막식장으로 뛰어들어왔다. 폐막식장을 지키던 밀레니엄 경비 인력들이 달려들었다가, 그대로 악어의 강철 꼬리에 맞고 하늘을 향해 날아갔다.\n\n\"키에에엑!\"\n흉측한 괴성과 함께, 로봇 악어는 그대로 폐막식 연설을 진행하던 [MIL.GetLeader]가 있는 무대 위로 뛰어 올라왔다. [MIL.GetLeader]의 경악한 얼굴, 그리고 막 폐막식장으로 들어오는 C&C. 이치카는 빠르게 계산했다. 시간이 맞지 않는다. C&C가 밀레니엄 학생회장을 구해내기도 전, 저 로봇 악어가 그녀를 씹어 먹어 버릴 것이 분명했다. 정말로, 정말 최악의 엑스포였다. 이치카는 자신의 정의감에 따라 앞으로 뛰쳐나갔다. 정의실현부가 이 상황에서 정의를 실현하지 않는다면, 그 누가 할 수 있단 말인가?"
 trinity_events_nagisa_diplomacy.25.desc.mine: "밀레니엄 엑스포는 길고, 다사다난했다. 하지만 폐막식에서도 별다른 일이 일어나지는 않을 것이다. 미네는 [MIL.GetLeader] 측의 연설로 막을 내리는 폐막식에 참여하며, 안도의 한숨을 내뱉었다. 분명 미네 본인은 온갖 사건들을 겪었지만, 그래도 그녀를 따라 온 수행원들은 밀레니엄의 다양한 기술들을 보고, 체험하고, 배울 수 있었다. 밀레니엄은 적이 아닌 트리니티가 더 많은 것을 배우고 우정을 쌓을 수 있는 국가였다.\n\n\"...이상으로, [GetYear] 년 밀레니엄 엑스포의 폐막식을...\"\n\n그 순간, [MIL.GetLeader]의 말이 채 끝나기도 전, 갑자기 폐막식이 열리던 강당 벽이 부서졌다. 쾅-! 하는 소리와 함께, 엔지니어부 소녀들의 비명이 들려왔다. \"저거! 우리가 연구하던 빅사이즈 로봇 악어잖아?!\" 빅사이즈? 미네는 자신의 경호원들과 같이 일어났다. 거대한 중형전차 크기의 악어가 입에서 불을 내뿜으며 폐막식장으로 뛰어들어왔다. 폐막식장을 지키던 밀레니엄 경비 인력들이 달려들었다가, 그대로 악어의 강철 꼬리에 맞고 하늘을 향해 날아갔다. 미네는 저 로봇이 날뛰는 것으로 다치고 고통 받을 사람들의 수를 계산했다. 가만히 있어서는 안 됐다.\n\n\"키에에엑!\"\n흉측한 괴성과 함께, 로봇 악어는 그대로 폐막식 연설을 진행하던 [MIL.GetLeader]가 있는 무대 위로 뛰어 올라왔다. [MIL.GetLeader]의 경악한 얼굴, 그리고 막 폐막식장으로 들어오는 C&C. 미네는 빠르게 계산했다. 시간이 맞지 않는다. C&C가 밀레니엄 학생회장을 구해내기도 전, 저 로봇 악어가 그녀를 씹어 먹어 버릴 것이 분명했다. 정말로, 정말 최악의 엑스포였다. 미네는 자신의 정의감에 따라 앞으로 뛰쳐나갔다. 구호가 필요한 곳. 그곳은 다른 어디도 아닌, 이 장소였다."
 trinity_events_nagisa_diplomacy.25.desc.ako: "밀레니엄 엑스포는 길고, 다사다난했다. 하지만 폐막식에서도 별다른 일이 일어나지는 않을 것이다. 아코는 [MIL.GetLeader] 측의 연설로 막을 내리는 폐막식에 참여하며, 안도의 한숨을 내뱉었다. 분명 아코 본인은 온갖 사건들을 겪었지만, 그래도 그녀를 따라 온 수행원들은 밀레니엄의 다양한 기술들을 보고, 체험하고, 배울 수 있었다. 밀레니엄은 적이 아닌 트리니티가 더 많은 것을 배우고 우정을 쌓을 수 있는 국가였다.\n\n\"...이상으로, [GetYear] 년 밀레니엄 엑스포의 폐막식을...\"\n\n그 순간, [MIL.GetLeader]의 말이 채 끝나기도 전, 갑자기 폐막식이 열리던 강당 벽이 부서졌다. 쾅-! 하는 소리와 함께, 엔지니어부 소녀들의 비명이 들려왔다. \"저거! 우리가 연구하던 빅사이즈 로봇 악어잖아?!\" 빅사이즈? 아코는 자신의 경호원들과 같이 일어났다. 거대한 중형전차 크기의 악어가 입에서 불을 내뿜으며 폐막식장으로 뛰어들어왔다. 폐막식장을 지키던 밀레니엄 경비 인력들이 달려들었다가, 그대로 악어의 강철 꼬리에 맞고 하늘을 향해 날아갔다. 아코는 저 로봇이 날뛰는 것으로 다치고 고통 받을 사람들의 수를 계산했다. 가만히 있어서는 안 됐다.\n\n\"키에에엑!\"\n흉측한 괴성과 함께, 로봇 악어는 그대로 폐막식 연설을 진행하던 [MIL.GetLeader]가 있는 무대 위로 뛰어 올라왔다. [MIL.GetLeader]의 경악한 얼굴, 그리고 막 폐막식장으로 들어오는 C&C. 아코는 빠르게 계산했다. 시간이 맞지 않는다. C&C가 밀레니엄 학생회장을 구해내기도 전, 저 로봇 악어가 그녀를 씹어 먹어 버릴 것이 분명했다. 정말로, 정말 최악의 엑스포였다. 아코는 자신의 정의감에 따라 앞으로 뛰쳐나갔다. 몇 초 동안, 아마우 아코는 트리니티의 티파티 감찰관에서, 게헨나의 선도부 선임행정관으로 되돌아갔다."
 trinity_events_nagisa_diplomacy.25.a: "악어의 공격으로부터 [MIL.GetLeader]를 몸으로 감싼다."
 trinity_events_nagisa_diplomacy.25.b: "측면에서 악어를 공격해 제압하려고 노력한다."
 trinity_events_nagisa_diplomacy.26.t: "Code: BOX - 트리니티로"
 trinity_events_nagisa_diplomacy.26.desc: "밀레니엄 엑스포의 모든 일정이 끝났습니다. 비록 친선대사로 출발한 대표는 상처투성이가 되어 돌아와 그대로 에덴의 종합 병원에 입원했지만, 그 대신 우리는 다양한 기술적 진보를 얻을 수 있었습니다. 물론, 두 번 진보하다가는 우리 대표단이 박살이 나겠지만요. 우리는 밀레니엄의 기술이 무척이나 유용하다는 것, 그리고 밀레니엄이 무척이나 위험하다는 것 두 가지를 배울 수 있었습니다.\n\n마지막으로, 우리 대표로 보내진 경호 인력 중 일부가 '근손실의 악마'와 '트레이닝'에 대한 극심한 공포 증상을 보이고 있습니다. 그녀들에 대한 PTSD 치료 역시 진행될 예정입니다."
 trinity_events_nagisa_diplomacy.26.a: "으윽... 아르기닌 박스의 악몽이..."
 trinity_events_nagisa_diplomacy_code_box_nagisa_tt: "§g키리후지 나기사가 전투에 능하지 않다는 점에 유의하세요. 이 선택지는 나기사에게 부정적인 트레잇을 추가할 수 있습니다. 단, 성공할 경우 미네, 이치카에 비해 큰 보상을 받습니다.§!"
 trinity_events_nagisa_diplomacy_code_box_ako_tt: "§g아마우 아코가 전투에 능하지 않다는 점에 유의하세요. 이 선택지는 아코에게 부정적인 트레잇을 추가할 수 있습니다. 단, 성공할 경우 미네, 이치카에 비해 큰 보상을 받습니다.§!"
 trinity_events_nagisa_diplomacy.27.t: "붉은겨울의 여대공?"
 trinity_events_nagisa_diplomacy.27.desc: "붉은겨울 연방학원을 점령한 이후 나기사 호스트는 무척이나 놀라운 현지 정보를 얻었습니다. 그것은 과거 붉은겨울에 의해 정복되어 멸망한 겨울 왕국에 대한 이야기입니다. 붉은겨울의 대중들은 이제는 몰락한, 그러나 아름답고 안타까운 역사를 가진 미요시 가문을 기억하고 있습니다.\n\n미요시 타카네라 불리는 고결한 몰락 영애 소녀가 있습니다. 그녀는 붉은겨울에 의해 정복당한 '겨울 왕국'의 미요시 가문의 적법한 여대공 계승권자입니다. 그녀의 부모와 자매들은 전부 혁명가들에 의하여 숙청당했으나, 타카네만은 붉은겨울 치하에서 살아남았다고 전해집니다.\n\n겨울 왕국을 이끌던 미요시 가문의 막내딸인 그녀는 충직한 수행원의 도움으로 인해 그 정체를 숨긴 채 홀로 살아남을 수 있었습니다. 타카네는 자매들의 이니셜이 적힌 'OAMT' 일기장을 소중하게 간직하면서 자신의 가문을 부흥시킬 날을 기다려 왔다고 합니다.\n\n붉은겨울과 같은 '혁명적' 학원에서 그와 같은 고결한 혈통을 가진 귀족이 아직 남아 있었다는 것은 놀랍고도 감동적인 이야기입니다. 필리우스 분파는 미요시 가가 소유했던 작위를 인정하고, 그녀가 정식으로 '겨울 왕국의 여대공'으로 불릴 수 있게 하자는 것에 동의합니다. 하지만 나기사 본인은 조금 더 나가고 싶어 합니다. 붉은겨울의 유일한 '푸른 피' 생존자. 그녀를 정식으로 필리우스 분파에 받아들인다면, 굉장한 정치적 자산이 될 수 있지 않을까요?"
 trinity_events_nagisa_diplomacy.27.a: "여대공으로서의 작위만을 인정한다."
 trinity_events_nagisa_diplomacy.27.b: "정식으로 타카네의 티파티 임원 가입을 논의하자"
 trinity_events_nagisa_diplomacy_hidden_start_tt: "§g타카네를 트리니티 티파티의 임원으로 가입시키는 내용의 히든 중점이 추가됩니다.§!"
 trinity_events_nagisa_diplomacy.28.t: "가짜 아나스타샤"
 trinity_events_nagisa_diplomacy.28.desc: "\"어쩌다가 일이 이렇게 되어버린 건가요...\"\n\n타카네는 자신조차 예상하지 못한 흐름에 당황하면서도, 지급받은 티파티 임원 제복을 가만히 손끝으로 매만져 보았다. 붉은겨울에서 입었던 옷과는 비교조차 할 수 없을 만큼 부드럽고, 또 아름다웠다.\n\n타카네는 겨울 왕국의 계승권자이자 여대공. 이건 거짓말이다. 애초에 사실일 리가 없지 않은가. 붉은겨울이 도대체 무슨 학원인데. 자신에 대한 소문은 자매의 이름 이니셜, 'OAMT' 말고는 다 틀렸다. 겨울 왕국이라는 나라도 없었고, 타카네는 한 번도 공녀인 적이 없었다. 그러나, 그 이야기를 이제 와서 어떻게 하겠는가.\n\n\"...하아. 일단, 들키지 않았으니까요. 들키지만 않으면 된 거예요.\"\n\n타카네는 작게 성호를 그으며, 깊은 한숨을 내뱉었다. 이 이상으로 끔찍한 일에 얽히지는 않겠지. 설마."
 trinity_events_nagisa_diplomacy.28.a: "이보다 더 일이 꼬이기야 하겠어요?"
 trinity_events_nagisa_diplomacy.29.t: "선교사 입국 허가를 요청하는 [FROM.GetName]"
 trinity_events_nagisa_diplomacy.29.desc: "[FROM.GetNameDef] 측은 자신들의 신앙과 경전을 다른 국가들에 전파하는 것에 열성적이며, [FROM.GetLeader] 측은 군사 동맹 관계인 [ROOT.GetName] 역시 그녀들의 신앙을 받아들이기를 원하고 있습니다. '신실한 신앙 아래에서의 동맹'은 그녀들과 우리들의 관계를 더욱 돈독하게 할 것이라고 [FROM.GetLeader] 측은 판단한 것으로 보입니다. 그녀들은 우리 국가의 도시들에 선교사들을 파견하기를 원하며, 외교 분쟁을 막기 위해 우리 정부가 승인했을 때에만 선교사를 보내겠다고 약속했습니다. 우리는 그녀들의 선교사를 받아들여야 할까요?"
 trinity_events_nagisa_diplomacy.29.a: "더 깊은 동맹을 위해, 허락한다."
 trinity_events_nagisa_diplomacy.29.b: "아니, 우리는 그녀들의 신앙이 필요치 않다."

 trinity_events_nagisa_diplomacy.31.desc: "공동 치안 조직 협상 이후 [TRM.GetLeader] 측은 [GEH.GetLeader] 측에게 본격적으로 '에덴 조약의 재협상'을 제안했습니다. 이는 [TRM.GetNameDef] 정부와 [GEH.GetNameDef] 정부 사이의 불가침조약 및 상호 산업 개방을 의미하는 협상입니다. 기존에는 에덴 조약기구를 수립하는 안건에 대한 구두 회의가 오갔었으나, 트리니티 내부의 정계 압력에 의해 트리니티에 유리하게 협상이 조정된 것으로 보입니다. 우리가 여기에 동의한다면, 협상의 세부적인 내용을 검토하기 위하여 실무자 회의가 이어질 예정입니다."
 trinity_events_nagisa_diplomacy.31.b: "아니, 이건 우리에게 너무 불리해."

 trinity_events_nagisa_diplomacy.32.desc: "우리의 협상 제안을 [GEH.GetLeader] 측이 받아들임에 따라, 에덴 조약을 맺기 위한 실무자 협상이 시작되었습니다. 판데모니움 소사이어티는 협상을 방해하기 위하여 모든 노력을 다할 것이고, 선도부 내부의 협상 반대파와 우리 실무진들 사이에 섞인 파테르 분파의 압박은 새로운 위협이 될 것입니다. 이미 많이 물러났을지도 모르지만, 게헨나와 파테르 분파 사이의 균형을 유지하고 학원의 안정을 가져올 인물은 [ROOT.GetLeader] 밖에 없습니다."

 trinity_events_nagisa_diplomacy.33.desc: "[ROOT.GetName] 정보부는 트리니티와 게헨나 선도부 사이에서 에덴 조약을 다시 추진하기 위한 움직임을 감지했습니다. 이미 실무자들이 협상을 시작했으며, 두 학원 사이의 불가침 조약을 위한 세부 조항들을 정리하고 있습니다.\n\n만약 에덴 조약이 정말로 맺어진다면, 우리는 선도부를 통해 유입되는 트리니티산 상품들에 저항해야 하고, 추후 벌어질 두 국가의 충돌에서 선도부가 트리니티를 상대로 군사 활동을 벌이지 못할 것입니다. 그것은 우리 안보에 있어서는 재앙이나 다름 없는 상황입니다. 공작원들을 이용해 어떠한 대가를 치러서라도 이 협상을 막아내야만 합니다. 반드시!"
 trinity_events_nagisa_diplomacy.33.a: "에덴 동산의 결말이 어떻게 끝났는지 알려주마"

 trinity_events_nagisa_diplomacy.34.desc: "누가 범인이었을까요? 파테르 분파나 트리니티 실무진들의 욕심일 수도 있습니다. 어쩌면 판데모니움 소사이어티의 공작원들이 벌인 소동일 수도 있겠죠. 우리들의 협상은 이상할 정도로 지지부진했습니다. 두 학원 사이를 오가는 동안 서로를 비방하는 가짜 뉴스들이 계속해서 퍼졌고, 게헨나와 트리니티의 일반 대중들은 두 학원의 평화 조약을 방해하는 시위를 계속해서 벌였습니다.\n\n결국 협상 장소에서 사제 폭탄이 폭발하는 기록적인 사건을 통해 에덴 조약은 공식적으로 중단되었습니다. 트리니티와 게헨나 선도부의 상층부는 테러의 주범이 서로가 아니라는 것을 알고 있었으나, 트리니티가 협상 도중 요구했던 각종 무역 특혜가 재주목되며 여론이 급속도로 악화했기에 두 국가는 적어도 한 세대는 화해할 수 없을 것으로 보입니다."
 trinity_events_nagisa_diplomacy.34.a: "...그래." # 4~5 트리니티/선도부

 trinity_events_nagisa_diplomacy.37.desc: "[GEH.GetLeader]와 우리 사이의 우정에 어떤 문제가 있었던 것일까요? 놀랍고도 충격적이게도, [GEH.GetLeader] 측은 경찰 치안 조직의 공유 이상으로 에덴 조약을 확장하는 것을 거부했습니다. 이 조약이 두 학원 지도자들의 우정과 선의로 이루어졌다는 점에서, 그 선의가 무너진 지금 협상을 다시 시작할 수 있는 방법은 존재하지 않습니다."

 trinity_events_nagisa_diplomacy.38.desc: "오늘은 [GEH.GetName] 측과 [TRM.GetName] 측 양쪽에 최고의 날입니다. 총학생회장이 남긴 에덴 조약이 결실을 맺고, 공식적으로 두 지도자들에 의하여 서명되면서 두 학원은 서로의 항구적 평화, 그리고 우리와 [GEM.GetName] 측과의 충돌에 있어 침묵하기로 결정했습니다. 게헨나와 트리니티 두 학원의 오랜 라이벌 관계에도 불구하고 두 학원의 이성적인 지도자들은 현재의 안정을 유연하게 유지하는 가장 좋은 방법을 찾아낸 것 같습니다.\n\n물론 이 소식은 [GEM.GetLeader] 측에게는 부정적인 이야기일 것입니다. [GEM.GetName] 정부는 이제 대 트리니티 방위 구상의 가장 큰 동맹을 잃었으며, [GEM.GetLeader]의 '게헨나 통일'이라는 꿈은 상당히 오랜 기간 동안 빗겨 나갈 것으로 보입니다."

 # 나기사 선거 이벤트
 trinity_events_nagisa_election.1.t: "[GetYear]년 콘클라베"
 trinity_events_nagisa_election.1.desc.phase_1: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\n트리니티를 이끌 새로운 호스트를 뽑기 위한 선거가 실시되었습니다. 오랜 전통에 따라, 이번 선거는 보통선거가 아닌 철저히 폐쇄적인 티파티 임원들에 의해 이루어졌습니다. 장기간의 투표를 통해 [ROOT.GetLeader]가 여유롭게 호스트직에 재선되었으며, 앞으로 3년간 임기를 수행하게 될 것입니다. 반대 분파들은 이번 선거가 조작되었다고 주장하지만, 그저 공허한 외침일 뿐입니다." # 기본
 trinity_events_nagisa_election.1.desc.phase_2: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\n트리니티를 이끌 새로운 호스트를 뽑기 위한 선거가 실시되었습니다. 오랜 전통에 따라, 이번 선거는 보통선거가 아닌 철저히 폐쇄적인 티파티 임원들에 의해 이루어졌습니다. [ROOT.GetNameDef]의 게헨나 통합 이후, 필리우스 분파는 그 위업으로 인해 더 많은 내부 지지를 얻게 되었습니다. 장기간의 투표를 통해 [ROOT.GetLeader]가 여유롭게 호스트직에 재선되었으며, 앞으로 3년간 임기를 수행하게 될 것입니다."
 trinity_events_nagisa_election.1.a: "당선자는 [ROOT.GetLeader]!"
 trinity_events_nagisa_election.2.t: "[GetYear]년 콘클라베"
 trinity_events_nagisa_election.2.desc: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\n트리니티는 대의민주주의 국가가 아니며, 호스트 선거는 소규모의 과두제 임원들끼리의 선거를 통해 결정됩니다. 나기사 헌법의 반포 이후 이루어지는 이번 선거는 필리우스 분파의 대표 한 명, 또 파테르 분파의 대표 미소노 미카의 일대일 대결로 이루어졌습니다. 키리후지 나기사는 모든 필리우스 분파 임원들, 그리고 필리우스와 공조하는 연정 분파들에게 특정 후보를 지지할 것을 지시했습니다. 필리우스 분파 내부에서의 나기사의 강한 장악력으로 인해, 이번 호스트 선거는 나기사가 지지한 후보가 당선될 가능성이 제일 높다고 판단됩니다.\n\n미소노 미카는 이번 호스트 선거에서 승리할 의욕이 크지 않은 것으로 보입니다. 어쩌면 세이아의 복귀를 비롯한 근래의 사건들이, 미카에게서 권력욕을 덜어내었을지도 모릅니다. 어느 쪽이든, 서기는 모든 표를 검표했으며, 이제 서기가 과반의 표를 얻은 당선자의 이름을 말할 것입니다."
 trinity_events_nagisa_election.2.nagisa: "키리후지 나기사는 언제나 승리한다."
 trinity_events_nagisa_election_nagisa_tt: "§g\"나기사. 정말로, 이 모든 일을 겪고서도요?\"§!"
 trinity_events_nagisa_election.2.hifumi: "아지타니 히후미가 나기사의 뒤를 잇는다."
 trinity_events_nagisa_election.2.seia: "유리조노 세이아가 그녀의 자리를 되찾을 것이다."
 trinity_events_nagisa_election.2.mine: "아오모리 미네가 정권교대를 성공했다."
 trinity_events_nagisa_election.2.ako: "아마우 아코는 트리니티의 미래를 맡을 것이다."
 trinity_events_nagisa_election.2.atsuko: "하카리 아츠코는 나기사의 선택을 받았다."
 trinity_events_nagisa_election.2.takane: "미요시 타카네 여대공이 티파티를 이끌 것이다."

 # 미소노-미셔ㄴ
 trinity_events_nagisa_misono_mission.00.a: "\"[GetNameMisonoMissionDemandOptions]\""
 trinity_events_nagisa_misono_mission_demand_event_option_1: "필리우스가 응답해야 합니다."
 trinity_events_nagisa_misono_mission_demand_event_option_2: "우리가 저 파테르의 음모에 대응해야만 합니다."
 trinity_events_nagisa_misono_mission_demand_event_option_3: "주께서 올바른 길을 인도하실 것입니다."
 trinity_events_nagisa_misono_mission_demand_event_option_4: "이게 미카 씨의 새로운 계획인가요? 괜찮습니다."
 trinity_events_nagisa_misono_mission_demand_event_option_5: "좋아요, 이 위기를 기회로서 모교를 혁신하죠."
 trinity_events_nagisa_misono_mission_demand_event_option_6: "필리우스는, 아니요. 저는 준비되어 있습니다."
 trinity_events_nagisa_misono_mission_demand_event_option_7: "제가 직접 화답해야겠지요."
 trinity_events_nagisa_misono_mission_demand_event_option_8: "말이 아닌 결과로서 응대할 뿐입니다."
 trinity_events_nagisa_misono_mission_demand_event_option_9: "미카 씨는 그저 떼를 쓰고 있을 뿐이네요."
 trinity_events_nagisa_misono_mission_demand_event_option_10: "파테르의 어리광, 솔직히 이쯤 되니 귀찮군요."
 trinity_events_nagisa_misono_mission_events.00.b: "\"[GetNameMisonoMissionFailureOptions]\""
 trinity_events_nagisa_misono_mission_failure_event_option_1: "이 결과는 제 오판이었습니다."
 trinity_events_nagisa_misono_mission_failure_event_option_2: "부끄럽군요. ...정말로요."
 trinity_events_nagisa_misono_mission_failure_event_option_3: "미카 씨가 제 약점을 잡았네요."
 trinity_events_nagisa_misono_mission_failure_event_option_4: "제가 파테르에게 길을 열어주다니..."
 trinity_events_nagisa_misono_mission_failure_event_option_5: "오늘 쓰러지더라도, 내일 다시 일어나야만 합니다."
 trinity_events_nagisa_misono_mission_failure_event_option_6: "이것이 필리우스의 궁극적인 패배를 의미하는 것은 아닙니다."
 trinity_events_nagisa_misono_mission_failure_event_option_7: "실수할 수는 있습니다. 이것이 반복되지 않으면 됩니다."
 trinity_events_nagisa_misono_mission_failure_event_option_8: "호스트로서 해서는 안 될 실책이었습니다."
 trinity_events_nagisa_misono_mission_failure_event_option_9: "이미 일어난 일이니, 하는 수 없죠."
 trinity_events_nagisa_misono_mission_failure_event_option_10: "미카 씨가 제 발목을 잡아 끄는 군요..."

 trinity_events_nagisa_misono_mission.1.t: "파테르 분파의 무기 생산 확대 추진"
 trinity_events_nagisa_misono_mission.1.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 티파티 회의에서 [ROOT.GetLeader]의 군수 공장 확충의 미흠함을 비난하고 있습니다. 군국주의적인 파테르 임원들은 필리우스 분파가 보이는 '유약한' 모습이 트리니티를 파멸로 몰아 넣을 것이라고 비난합니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.2.t: "파테르 분파의 징병법 개정 희망"
 trinity_events_nagisa_misono_mission.2.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 필리우스 분파가 전쟁에 전혀 대비하지 못하고 있다고 조롱합니다. $TRN_Misono_Mika$ 측은 공개적인 연설을 통해 트리니티가 더 많은 군대를 확충하기 위해 징병제를 확대하지 않는 이유가 무엇인지 비판했습니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.3.t: "파테르 분파의 지원 트럭 요구"
 trinity_events_nagisa_misono_mission.3.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 우리의 군수품 창고에 더 많은 군용 트럭이 필요하다고 주장합니다. 많은 차량은 보급부터 시작해, 트리니티 육군의 더 빠른 기동성도 보장할 것입니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.4.t: "파테르 분파의 전차 생산 요구"
 trinity_events_nagisa_misono_mission.4.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 우리의 군수품 창고에 더 많은 전차가 필요하다고 주장합니다. 게헨나조차 '토라마루' 같은 상징적인 전차가 있는데, 트리니티에는 무엇이 있나요? 롤케이크? $TRN_Misono_Mika$는 아주 강경한 어조로, 트리니티가 충분한 전차 여유분을 갖추지 못한다면 그 롤케이크조차 먹을 수 없는 날이 올 것이라고 경고합니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.5.t: "파테르 분파의 포 생산 요구"
 trinity_events_nagisa_misono_mission.5.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 우리의 보급 창고에 더 많은 야포가 필요하다고 주장합니다. 트리니티의 국방력 강화를 위해서는 포병 사단들이 필요하며, 파테르 분파는 우리가 그것을 제대로 갖추지 못했다고 경고하고 있습니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.6.t: "파테르 분파의 조선소 생산 증대 추진"
 trinity_events_nagisa_misono_mission.6.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 티파티 회의에서 [ROOT.GetLeader]의 조선소 확충의 미흠함을 비난하고 있습니다. 군국주의적인 파테르 임원들은 필리우스 분파가 보이는 '유약한' 모습이 트리니티를 파멸로 몰아 넣을 것이라고 비난합니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.7.t: "파테르 분파의 연료 비축 계획 요구"
 trinity_events_nagisa_misono_mission.7.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 현재 트리니티의 전쟁 기계들이 제대로 준비되어 있지 못하며, 그 원인은 연료의 부족 때문이라고 지적했습니다. 트리니티의 차량 및 전쟁 병기들은 충분한 연료 없이는 가동할 수 없으며, 파테르 분파는 그 '충분한 연료'를 빠른 시일 내에 완수할 것을 요구합니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.8.t: "파테르 분파의 국내 산업 기반 확장 추진"
 trinity_events_nagisa_misono_mission.8.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 현재 트리니티의 민간 공장 확충이 제대로 이루어지지 못하고 있으며, 그로 인해 트리니티의 경제가 제대로 발전하지 못하고 있다고 비난합니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.9.t: "파테르 분파의 공군 생산 요구"
 trinity_events_nagisa_misono_mission.9.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 우리의 군수품 창고에 더 많은 항공기가 필요하다고 주장합니다. 현대전에서 가장 중요한 무기는 공군이며, 파테르의 주장에 따르면 트리니티 군대는 아직까지도 충분한 공군 예비대를 마련하지 못했습니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.10.t: "파테르 분파의 신비 직조기 생산 요구"
 trinity_events_nagisa_misono_mission.10.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 우리의 군수품 창고에 더 많은 신비 직조기가 필요하다고 주장합니다. 파테르 분파는 대전이 이후 인류 국가들과의 군사적 대립에서 트리니티가 나약한 모습을 보이지 않기 위해서는, 매우 충분한 숫자의 신비 직조기 재고가 마련되어 있어야 한다고 주장합니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.11.t: "파테르 분파의 참모총장 임명 요구"
 trinity_events_nagisa_misono_mission.11.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 트리니티 군의 육군참모총장 직이 공석이라는 점을 비난하고 있습니다. 물론 대전이 이전 트리니티에 별도의 참모총장직이 없었던 것은 사실이나, $TRN_Misono_Mika$ 측은 대전이 이후에도 그 자리를 비워두고 있는 것은 주변 국가들에 비해 [ROOT.GetLeader] 측이 국방에 관심을 쏟지 않은 결과라고 우리를 비난하고 있습니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.12.t: "파테르 분파의 참모총장 임명 요구"
 trinity_events_nagisa_misono_mission.12.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 트리니티 군의 해군참모총장 직이 공석이라는 점을 비난하고 있습니다. 물론 대전이 이전 트리니티에 별도의 참모총장직이 없었던 것은 사실이나, $TRN_Misono_Mika$ 측은 대전이 이후에도 그 자리를 비워두고 있는 것은 주변 국가들에 비해 [ROOT.GetLeader] 측이 국방에 관심을 쏟지 않은 결과라고 우리를 비난하고 있습니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.13.t: "파테르 분파의 참모총장 임명 요구"
 trinity_events_nagisa_misono_mission.13.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 트리니티 군의 공군참모총장 직이 공석이라는 점을 비난하고 있습니다. 물론 대전이 이전 트리니티에 별도의 참모총장직이 없었던 것은 사실이나, $TRN_Misono_Mika$ 측은 대전이 이후에도 그 자리를 비워두고 있는 것은 주변 국가들에 비해 [ROOT.GetLeader] 측이 국방에 관심을 쏟지 않은 결과라고 우리를 비난하고 있습니다. 트리니티 내부 분파들은 우리의 대응을 기다리고 있습니다. 그녀들은 어느 정도는 인내심을 발휘하겠지만 영원히 기다리지는 않을 것입니다."
 trinity_events_nagisa_misono_mission.14.t: "아무것도 요구하지 않는 파테르 분파"
 trinity_events_nagisa_misono_mission.14.desc: "$TRN_Misono_Mika$가 이끄는 파테르 분파는 $TRN_Misono_Mika$의 즉흥적이고 감정적인 성격으로 인해 내부 혼란을 겪고 있습니다. 그녀들은 일치단결해 필리우스 분파와 [ROOT.GetLeader] 호스트를 공격하기에는 너무 심각하게 분열되어 있습니다. 덕분에 당분간 파테르 분파가 우리에게 정치적 공격을 하는 것은 어려워 보입니다."
 trinity_events_nagisa_misono_mission.14.a: "적어도 이번 달에는 아무 일도 없겠군요."
 trinity_events_nagisa_misono_mission_14_a_tt: "§g이번 달에는 파테르 분파가 아무 행동도 하지 않습니다.§!"

 trinity_events_nagisa_misono_mission.100.t: "[ROOT.GetLeader]의 정국 영향력 상실"
 trinity_events_nagisa_misono_mission.100.desc: "우리는 파테르 분파의 무례한 요구에 대응하기 위하여 노력하였으나, 결국 목표 달성에 실패했습니다. 여러 분파들이 필리우스의 지도력에 대한 의구심을 품고 있으며, 이는 우리 정부의 큰 실책입니다."

 ## 장군 영입 고유 미션
 trinity_events_nagisa_misono_mission.110.t: "$TRN_Urawa_Hanako$ 측을 영입하려는 파테르"
 trinity_events_nagisa_misono_mission.110.desc: "파테르 분파는 계속해서 새로운 인재를 영입하려 하고 있습니다. $TRN_Urawa_Hanako$에 대한 접근은 파테르의 야망을 드러내는 대표적인 정치 공작이라고 할 수 있습니다. 파테르 분파는 현재 $TRN_Urawa_Hanako$ 측과 개별적으로 접촉하고 있으며, 그녀들의 분파에 하나코를 끌어들여 필리우스를 적대하게 만드려 하고 있습니다.\n\n우리가 행동하지 않는다면, 그들이 먼저 행동할 것입니다."
 trinity_events_nagisa_misono_mission.111.t: "파테르 분파에 가입한 $TRN_Urawa_Hanako$"
 trinity_events_nagisa_misono_mission.111.desc: "하나코를 필리우스 분파에 가입시키려는 우리의 계획은 최악의 결과를 낳았습니다. 하나코는 트리니티 전체를 '독사굴'이라고 조롱하면서, 자신을 필리우스 분파에 편입시키려는 우리의 정치적 공작이 추악하다고 말했습니다. $TRN_Urawa_Hanako$ 측은 우리의 노력으로 인해 도리어 현재 트리니티가 얼마나 큰 가식에 둘러싸여 있는지 이해했다고 말하면서, 파테르 분파에 가입할 것임을 천명했습니다."
 trinity_events_nagisa_misono_mission.111.a: "어처구니가 없네요."
 trinity_events_nagisa_misono_mission.112.t: "시스터후드에 가입한 $TRN_Urawa_Hanako$"
 trinity_events_nagisa_misono_mission.112.desc: "하나코를 파테르 분파에 가입시키려는 파테르 분파의 계획은 최악의 결과를 낳았습니다. 하나코는 트리니티 전체를 '독사굴'이라고 조롱하면서, 자신을 파테르 분파에 편입시키려는 $TRN_Misono_Mika$의 정치적 공작이 추악하다고 말했습니다. $TRN_Urawa_Hanako$ 측은 트리니티의 '독사굴' 같은 면모에 자신이 휘말리지 않을 것임을 선언하며, 시스터후드에 소속되기로 결정했습니다."
 trinity_events_nagisa_misono_mission.112.a: "그러니까, 아무것도 하지 않는 게 답이었다고요?"

 trinity_events_nagisa_misono_mission.120.t: "[GetMisonoMissionRandomCharacter] 측을 영입하려는 파테르"
 trinity_events_nagisa_misono_mission.120.desc: "파테르 분파는 계속해서 새로운 인재를 영입하려 하고 있습니다. [GetMisonoMissionRandomCharacter]에 대한 접근은 파테르의 야망을 드러내는 대표적인 정치 공작이라고 할 수 있습니다. 파테르 분파는 현재 [GetMisonoMissionRandomCharacter] 측과 개별적으로 접촉하고 있으며, 파테르 분파의 일원으로 만들기 위해 여러 조건을 제시하고 있습니다. 우리 역시 [GetMisonoMissionRandomCharacter] 측에게 접근해야 할까요?"
 trinity_events_nagisa_misono_mission.121.t: "파테르 분파에 가입한 [GetMisonoMissionRandomCharacter]"
 trinity_events_nagisa_misono_mission.121.desc: "[GetMisonoMissionRandomCharacter] 측은 파테르 분파와 그녀들의 수장인 $TRN_Misono_Mika$의 유혹에 굴복했습니다. 이제 그녀는 필리우스 분파의 적으로서, 우리와 대립하게 될 것입니다."
 trinity_events_nagisa_misono_mission.122.t: "필리우스 분파에 가입한 [GetMisonoMissionRandomCharacter]"
 trinity_events_nagisa_misono_mission.122.desc: "우리가 파테르 분파보다 더 좋은 조건으로 [GetMisonoMissionRandomCharacter] 측과 접촉한 덕분에, [GetMisonoMissionRandomCharacter] 측은 파테르 분파가 아닌 필리우스 분파와 나기사를 위하여 충성을 다하기로 맹세했습니다."

 trinity_news_events.1.t: "유리조노 세이아 피습 사건"
 trinity_news_events.1.desc: "상투스 분파의 수장 유리조노 세이아가 취임식 연설 도중 괴한의 총격을 받아 의식불명 상태에 빠졌습니다. 괴한은 현장에서 즉시 제압되었으며, 삼엄한 경호 속에 병원으로 이송되고 있습니다.\n\n사건 직후 티파티가 긴급히 소집되어 차기 호스트 선정을 논의하고 있으며, 현재 파테르 분파의 미소노 미카가 차기 호스트로 지명될 가능성이 높다는 관측이 나오고 있습니다.\n\n최근 두 달간 이어진 사건들은 트리니티 내부의 정세를 극도로 불안정하게 만들었고, 이번 사건은 그러한 불안정성이 폭발한 결과로 보입니다. 상투스 분파 내부의 갈등이 본격화되면서, 트리니티의 정치적 혼란은 더욱 심화될 전망입니다."
 trinity_news_events.1.a: "이런 맙소사!"
 trinity_news_events.1.b: "야만적이군!"
 trinity_news_events.1.c: "저들은 혼란스러워 보인다."
 trinity_news_events.2.t: "미소노 미카의 트리니티 장악"
 trinity_news_events.2.desc: "야만적인 유리조노 세이아 암살 사건을 기점으로 불이 붙은 트리니티 종합학원의 정치적 혼란은 미소노 미카가 호스트직을 맡으며 일단락되었습니다. 그녀는 호스트 권한을 확보하자마자 일련의 급진적인 개혁을 단행하였고, 결국 자신의 통치를 정당화하고 영구적인 집권을 보장하는 법안을 통과시키며 티파티 삼두정 체제의 종말을 고하였습니다.\n\n그러나 키보토스의 다른 학원들에서는 이를 축하하는 분위기를 찾아보기 어렵습니다. 특히 미소노 미카의 끊임없는 반게헨나적 발언으로 인해 게헨나는 극도로 절제된 반응을 보이고 있습니다."
 trinity_news_events.2.a: "새로운 트리니티가 부상한다!"
 trinity_news_events.2.b: "키보토스 질서가 뒤흔들리겠군..."
 trinity_news_events.2.c: "이게 우리에게 뜻하는 바가 무엇이지?"
 trinity_news_events.2.d: "놀라운 전개군."
 TRN_trinity_order_state_threat_name: "미소노 미카의 쿠데타"
 trinity_news_events.3.t: "트리니티에서 진행된 아이돌 라이브 공연"
 trinity_news_events.3.desc: "매년 개최되는 트리니티 사육제, 그중에서도 많은 이들의 기대를 모으는 '아이돌 라이브 공연'이 오늘 성황리에 열렸습니다. 그러나 올해의 무대는 그 어느 때보다도 특별했습니다. 오늘, 관객들 앞에 나타난 것은 '앤틱 세라핌'이라는 새로운 그룹이었습니다. 이들은 구호기사단장 아오모리 미네, 시스터후드 수녀원장 우타즈미 사쿠라코, 그리고 시스터후드 소속 이오치 마리로 구성되어 있습니다.\n\n결성 초기, 이들은 여러 문제와 정치적 위기에 직면했으나, 이오치 마리가 이를 해결하는 데 앞장섰고, 결국 무대는 성공적으로 마무리되었습니다. 트리니티의 학생들은 뜨거운 환호로 이들의 공연을 맞이했고, 화려한 무대와 함께 아이돌 이벤트는 성대한 막을 내렸습니다."
 trinity_news_events.3.a: "나도 사진 한 장 나눠줘!"
 trinity_news_events.4.t: "에덴 협정의 형성"
 trinity_news_events.4.desc: "미소노 미카가 정권을 장악한 이후, 그녀는 트리니티를 다시 한 번 세계 무대의 중심으로 끌어올리고 패권을 되찾고자 ‘에덴 협정’을 선언했습니다. 이 협정은 키보토스 연합에 대응하는 군사적 동맹으로, 트리니티가 정치적 혼란을 수습하고 다시금 패권주의적 야망을 드러내기 시작했음을 의미합니다.\n\n트리니티의 외교관들은 에덴 협정을 단지 상호 협력을 위한 조약이라고 소개하고 있지만, 실상은 대전이 사태 이후 위축된 영향권을 회복하고 확장하려는 전략적 조치로 해석됩니다. 트리니티의 최근 팽창주의적 움직임을 감안하면, 사태 이전의 광범위한 지배권을 무력으로 복원하려는 의도가 점점 더 분명해지고 있습니다."
 trinity_news_events.4.a: "우리는 더욱더 강해진다!"
 trinity_news_events.4.b: "새로운 위협이다."
 trinity_news_events.4.c: "우리는 놈들을 꺾을 것이다!"
 trinity_news_events.4.d: "새로운 패권의 부상인가?"
 trinity_news_events.5.t: "트리니티의 게헨나 침공"
 trinity_news_events.5.desc: "수백 년간 트리니티와 게헨나는 표면적인 평화를 유지해왔지만, 진정한 화해는 없었습니다. 트리니티는 과거 게헨나가 저질렀던 행위를 결코 잊지 않았고, 그에 대한 증오와 복수심은 세월과 함께 더욱 깊어졌습니다.대전이 사태 이후 미소노 미카가 정권을 장악하면서, 회의론자들의 우려는 현실이 되었습니다.\n\n수년간 이어진 보복주의의 확산과 군비 증강 끝에, 마침내 미소노 미카는 전시 상태를 공식 선언하며 트리니티의 군대를 전선으로 내보냈습니다. 이에 맞서 게헨나의 기갑부대가 반격에 나섰지만, 트리니티의 포격으로 인해 진격은 쉽지 않은 상황입니다."
 trinity_news_events.5.a: "악마들을 정벌하라!"
 trinity_news_events.5.b: "이 전쟁으로 키보토스에 그림자가 드리웠다..."
 trinity_news_events.5.c: "전게헨나여 단결하라!"
 trinity_news_events.5.d: "싸우게 내버려 둬라..."
 trinity_news_events.6.t: "트리니티에서 발생한 독일인 봉기"
 trinity_news_events.6.desc: "오늘 오후, 트리니티 중앙구에서 약 1만 명의 시위자들이 거리로 쏟아져 나오며 시작된 독일인 봉기가 트리니티 전역으로 확산되고 있습니다. 많은 독일인들이 '도이칠란트, 도이칠란트 위버 알레스'를 외치며 거리를 행진하고 있으며, 벽과 다리에는 NSDAP의 슬로건과 만자 문양이 낙서로 남겨지고 있습니다. 트리니티의 지배에 반발하는 이들은 파업과 시위로 저항을 이어가고 있습니다.\n\n광범위하게 벌어지는 시위와 시국 불안 속에서도, 티파티는 정의실현부에 직접 진압 명령을 하달했고, 이에 따라 봉기 자체는 조속히 진압될 것으로 보입니다."
 trinity_news_events.6.a: "전부 진압하라!"
 trinity_news_events.6.b: "삼위일체의 끝인가?"
 trinity_news_events.6.c: "저들이 분열 한다면..."
 trinity_news_events.6.d: "이게 그들의 최후일까?"
 trinity_news_events.7.t: "키리후지 나기사의 트리니티 장악"
 trinity_news_events.7.desc: "야만적인 유리조노 세이아 암살 사건을 기점으로 불이 붙은 트리니티 종합학원의 정치적 혼란은 키리후지 나기사가 호스트직을 맡으며 일단락되었습니다. 나기사는 필리우스 분파와 여러 분파들 사이의 조화를 지켜나가겠다는 의지를 밝혔습니다.\n\n하지만 나기사 정부는 완전히 안정되지 않은 상태입니다. 미소노 미카가 이끄는 파테르 분파는 계속 정부에 반대하고 있으며, 필리우스 분파의 정국 장악은 완전하지 않습니다.\n\n나기사는 정권 장악 이후 국내 안정에 집중하면서, 대외적으로는 게헨나와의 에덴 조약을 계속 추진해 나갈 것으로 보입니다."
 trinity_news_events.7.a: "'두 번째 트리니티'는 없다."
 trinity_news_events.7.b: "트리니티는 합리적인 대안을 찾았다."
 trinity_news_events.7.c: "나쁘지 않은 상대야."
 trinity_news_events.7.d: "분파가 참 많이도 있군!"
 trinity_news_events.8.t: "에덴 조약의 성공"
 trinity_news_events.8.desc: "트리니티와 게헨나의 우정과 화평을 상징하는 에덴 조약은 대전이 이전부터 총학생회장의 주선 아래에서 계속 추진되어 왔습니다. 대전이 이후의 혼란 속에서 에덴 조약의 추진은 잠시 중단되기도 했지만, [TRM.Getleader]와 [GEH.GetLeader] 두 지도자의 노력으로 인해 조약은 다시 진행될 수 있었습니다.\n\n이번 에덴 조약은 [TRM.GetAdjective] 측과 [GEH.GetAdjective] 측의 군사적 동맹입니다. 두 학원은 방위 동맹인 'ETO' 아래에서 외부의 적에 공동으로 대응하기로 약속했습니다. 두 지도자의 공동 성명 이후, [GEM.GetName] 측은 [GEH.GetName] 측은 게헨나를 대표할 자격이 없다고 주장하면서, 에덴 조약이 '전면적인 불법'이라고 선언했습니다."
 trinity_news_events.8.desc.alt: "트리니티와 게헨나의 우정과 화평을 상징하는 에덴 조약은 대전이 이전부터 총학생회장의 주선 아래에서 계속 추진되어 왔습니다. 대전이 이후의 혼란 속에서 에덴 조약의 추진은 잠시 중단되기도 했지만, [TRM.Getleader]와 [GEH.GetLeader] 두 지도자의 노력으로 인해 조약은 다시 진행될 수 있었습니다.\n\n원래 대전이 이전 논의되던 에덴 조약은 'ETO'라는 이름의 군사 동맹이었지만, 트리니티에서의 내부적 반발로 인해 실제 조약은 [TRM.GetAdjective] 측과 [GEH.GetAdjective] 측의 불가침 및 경제적 교류에서 끝을 맺었습니다. 두 지도자의 공동 성명 이후, [GEM.GetName] 측은 [GEH.GetName] 측은 게헨나를 대표할 자격이 없다고 주장하면서, 에덴 조약이 '전면적인 불법'이라고 선언했습니다."
 trinity_news_events.8.a: "하나의 화살은 부러지지만, 화살 더미는 부러지지 않는다."
 trinity_news_events.8.b: "구역질이 나는 군."
 trinity_news_events.8.c: "키보토스의 아주 놀라운 소식!"
 trinity_news_events.8.d: "그러니까, 이계의 침략자들이 연합을 했다고?"
 trinity_news_events.9.t: "트리니티의 게헨나 침공"
 trinity_news_events.9.desc: "키리후지 나기사는 트리니티에서 집권했던 수많은 호스트 중 가장 게헨나에 유화적인 평화주의자였으나, 결국 게헨나와 트리니티 사이의 군사적 대립은 두 세력을 전쟁 상태로 몰아넣었습니다. [TRM.GetName] 측은 게헨나가 트리니티를 침공하기 위해 군비 증강을 하고 있었으며, 자신들은 이에 대응하기 위한 예방 전쟁을 실시한다고 밝혔습니다.\n\n이미 트리니티의 군대가 국경을 넘었으며 게헨나와의 국경 지대에서 교전이 시작되었습니다. 오랜 라이벌이었던 두 학원이 드디어 전쟁 상태에 돌입함에 따라, 키보토스 전체가 어느 쪽이 승자가 될 것인지 지켜보고 있습니다."
 trinity_news_events.9.a: "트리니티는 승리할 것이다."
 trinity_news_events.9.b: "전게헨나여 단결하라!" # 게헨나 (전쟁 참여)
 trinity_news_events.9.c: "만마전이 고생 좀 하겠군." # 선도부 (만약 전쟁중이 아닐 경우)
 trinity_news_events.9.d: "누가 승자가 될까?"
 trinity_news_events.10.t: "에덴 조약의 실패"
 trinity_news_events.10.desc: "트리니티와 게헨나의 우정과 화평을 상징하는 에덴 조약은 대전이 이전부터 총학생회장의 주선 아래에서 계속 추진되어 왔습니다. 대전이 이후의 혼란 속에서 에덴 조약의 추진은 잠시 중단되기도 했지만, [TRM.Getleader]와 [GEH.GetLeader] 두 지도자의 노력으로 인해 조약은 다시 진행될 수 있었습니다.\n\n그러나 두 학원의 평화 조약은 지속적인 두 학원 반대파들의 시위로 인해 흔들렸고, 결국 회담 장소에서 터진 사제 폭탄으로 인해 여론이 심각하게 악화되면서 결렬되었습니다. [GEH.GetLeader] 측과 [TRM.GetLeader] 측은 에덴 조약이 미래에 다시 논의될 수 있다는 희망적인 메시지를 남겼지만, 대중 여론이 악화된 지금으로선 단순한 정치적 수사일 뿐입니다."
 trinity_news_events.10.a: "비극이다."
 trinity_news_events.10.b: "정말로 즐겁군."
 trinity_news_events.10.c: "덧 없는 회담이었다."
 trinity_news_events.10.d: "이계 침략자들은 자신들끼리도 싸우고 있군."
 trinity_news_events.11.t: "에덴 체제 수립"
 trinity_news_events.11.desc: "[TRM.GetName] 주도의 게헨나 통합이 성공함에 따라, 앞으로 '에덴 체제'라고 불릴 새로운 세력 구도가 만들어졌습니다. 키리후지 나기사는 트리니티가 필리우스, 파테르, 상투스 세 학원의 연합학원 가맹으로 만들어졌듯, 게헨나 역시 트리니티를 구성하는 새로운 구성원으로 편입될 것이며, 식민지와 같은 대우를 받지 않을 것이라고 약속했습니다.\n\n호스트의 '자비로운' 전후 처리 선언과 굳건한 에덴 체제 수립에도 불구하고 트리니티의 정국은 여전히 불확실합니다. 게헨나 중앙구를 중심으로 만마전에 충성하는 게릴라가 여전히 남아 있으며, 일부 선도부 간부들이 독립된 분파를 형성하는 대신 필리우스에 편입될 것이라는 소식은 파테르를 불편하게 만들고 있습니다. 그러나 모든 불확실한 요소에도 불구하고, 오늘 트리니티는 승자로서 섰습니다." # 선도부가 없음
 trinity_news_events.11.desc.alt: "[TRM.GetName] 주도의 판데모니움 소사이어티 침공이 성공함에 따라, 앞으로 '에덴 체제'라고 불릴 새로운 세력 구도가 만들어졌습니다. 키리후지 나기사는 트리니티가 필리우스, 파테르, 상투스 세 학원의 연합학원 가맹으로 만들어졌듯, 점령지 역시 트리니티의 구성원으로 편입될 것이며, 식민지와 같은 대우를 받지 않을 것이라고 약속했습니다.\n\n호스트의 '자비로운' 전후 처리 선언과 굳건한 에덴 체제 수립에도 불구하고 트리니티의 정국은 여전히 불확실합니다. 게헨나 중앙구를 중심으로 만마전에 충성하는 게릴라가 여전히 남아 있으며, [GEH.GetName] 측과 트리니티의 평화적 통일 논의는 아직 진행 단계에 머무릅니다. 그러나 모든 불확실한 요소에도 불구하고, 오늘 트리니티는 승자로서 섰습니다." # 선도부가 있음
 trinity_news_events.11.a: "우리의 승리가 영원히 이어지도록"
 trinity_news_events.11.b: "에덴을 주시해야 하겠군."
 trinity_news_events.11.c: "골치 아픈 세력이 탄생했군..."
 trinity_news_events.12.t: "트리니티 호스트 선거"
 trinity_news_events.12.desc.nagisa: "[TRM.GetName] 정부는 트리니티를 학원 국가 체제에서 일반 국가로서 변화시키기 위한 '나기사 헌법'을 반포했고, 이후 새로운 헌법 아래에서 첫 호스트 선거를 치렀습니다. 이번 선거는 티파티 내부 위원들에 의해 이루어지는 간선제로 치러졌으며, 임기는 대전이 이후 첫 공의회에서 정해진 바와 같은 3년으로 지정되었습니다.\n\n선거에서 키리후지 나기사가 적절한 후계자에게 직위를 승계하고 물러날 것이라는 전문가들의 관측이 많았지만, 나기사는 이번 선거에서 물러나지 않았습니다. 키리후지 나기사가 내부 투표에서 압도적인 과반의 득표를 얻어 향후 3년간 트리니티를 다시 이끌 호스트로 선출되었습니다. 나기사는 \"트리니티의 영광과 번영을 위하여\" 향후에도 모교를 위해 자신이 할 수 있는 모든 노력을 다하겠다고 밝혔습니다."
 trinity_news_events.12.desc.alt: "[TRM.GetName] 정부는 트리니티를 학원 국가 체제에서 일반 국가로서 변화시키기 위한 '나기사 헌법'을 반포했고, 이후 새로운 헌법 아래에서 첫 호스트 선거를 치렀습니다. 이번 선거는 티파티 내부 위원들에 의해 이루어지는 간선제로 치러졌으며, 임기는 대전이 이후 첫 공의회에서 정해진 바와 같은 3년으로 지정되었습니다.\n\n이번 선거에서는 놀랍게도 키리후지 나기사가 아닌, 트리니티 일반 시민들에게는 생소한 [TRM.GetLeader] 후보가 선출되었습니다. [TRM.GetLeader] 측은 키리후지 나기사가 직접 후계자로 지정한 후보이며, 나기사는 그녀에게 트리니티의 미래를 맡기고 정계에서의 은퇴를 계획하고 있는 것으로 보입니다. 비록 [TRM.GetLeader] 측으로 트리니티의 지도자는 변경되었으나, 그녀 역시 과거 나기사 정부의 정책을 그대로 유지할 것으로 보입니다."
 trinity_news_events.12.a: "트리니티여, 영원히 번영하라!"
 trinity_news_events.12.b: "트리니티의 움직임을 유의 깊게 주시하라."
 trinity_news_events.12.c: "그녀들의 정치 싸움에는 관심 없다."
 trinity_news_events.13.t: "트리니티 쿠데타"
 trinity_news_events.13.desc: "최근 지속적으로 이루어지던 키리후지 나기사의 권력 집중 노력과, 트리니티에서의 독재 체제 수립 계획은 결국 쿠데타로 인해 좌절되었습니다. 트리니티의 종교 조직인 시스터후드는 오늘 티파티를 점령하고 여러 중요 임원들을 구금했으며, \"지금이야말로 시스터후드가 트리니티를 지키기 위해 개입할 수밖에 없는 상황\"이라는 포고문을 발표했습니다.\n\n우타즈미 사쿠라코는 트리니티를 여러 분파들이 조화를 유지하던 안정적인 시기로 회귀시킬 것을 약속하였으며, 키리후지 나기사의 전임 호스트였던 유리조노 세이아를 호스트로 추대했습니다. 세이아는 다시 호스트직에 올랐지만, 실질적인 권력은 시스터후드에게 빼앗긴 것으로 보입니다."
 trinity_news_events.13.a: "다시금 전통의 깃발 아래로."
 trinity_news_events.13.b: "전임 호스트에게는 안타까운 일이군."
 trinity_news_events.13.c: "그녀들의 정치 싸움에는 관심 없다."
 trinity_news_events.14.t: "트리니티 연합 선언"
 trinity_news_events.14.desc: "과거 연합학원 체제였던 트리니티가 오늘 [TRM.GetLeader] 측의 공식 결정에 따라, 공식적으로 국체를 연합(Commonwealth)으로 변경하였음을 밝혔습니다. 이는 트리니티가 대전이 이후 인구 비율의 변화로 인해 독일인들을 민족 구성에 포함하게 되면서, 일반적인 학원국가 체제에서 보통국가로의 전환을 준비하고 있다는 것을 보여줍니다. 티파티 대변인은 외신 기자들과의 인터뷰에서 이번 결정이 '트리니티의 전통을 수호'하는 키리후지 나기사의 \"첫 번째 트리니티\" 이념을 포기하는 것이 아닌, 더 발전-계승하기 위한 결정이라고 말했습니다."
 trinity_news_events.14.a: "굳건하고 무너지지 않는 강대한 연합"
 trinity_news_events.14.b: "이름에서 '학원'을 뺐을 뿐이지 않나?"
 trinity_news_events.14.c: "대전이 이후의 지정학적 상황에 적응하려 하고 있군"

