 ### 공용
 TRM_nagisa_constitution_kivotos_pan_human_rights: "전키보토스 시민의 기본권 보장"
 TRM_nagisa_constitution_kivotos_pan_human_rights_desc: "헌법에 어느 학원 출신이든, 헤일로를 가진 모든 키보토스계의 동등한 권리를 보장하는 인권 문구를 추가합니다."
 TRM_nagisa_constitution_guarantee_of_beastmen_rights: "수인 및 안드로이드의 특별 권리"
 TRM_nagisa_constitution_guarantee_of_beastmen_rights_desc: "헌법에 키보토스의 남성들, 수인과 안드로이드의 권리를 보장하기 위한 조항을 추가합니다."
 TRM_nagisa_constitution_militia_rights: "자경대의 헌법적 근거 보장"
 TRM_nagisa_constitution_militia_rights_desc: "트리니티에서 활동하던 자경단 조직은 철저한 회색 지대 조직입니다. 중요한 것은 헌법에 '트리니티 체제를 인정하는' 민병대 설립의 권리를 보장함으로서 다양한 트리니티 민병대 활동을 법적으로 보장하고, 그녀들이 법적 테두리 안으로 들어오도록 하는 것입니다."
 TRM_nagisa_constitution_freedom_of_religion: "종교의 자유 보장"
 TRM_nagisa_constitution_freedom_of_religion_desc: "트리니티 신앙은 우리의 가장 중요한 신앙 체계이지만, 트리니티 외에 다른 종교를 유지할 권리를 보장합니다. 물론 이것이 '두 번째 트리니티' 사상에 대한 동조, 더 나아가서 국가를 무신론화시키려 한다는 비난이 이어질 것입니다.\n\n우리는 종교의 자유를 헌법으로 보장하기 위하여, 시스터후드에게 그녀들이 우리의 적이 아니라는 것을 증명할 방법이 필요합니다. 그렇지 않다면 적어도 신앙의 자유가 필요한 이유를 설득시킬 수 있는, '신앙의 자매들'이 있음을 그녀들에게 보여주거나요."
 TRM_nagisa_constitution_freedom_of_religions_trigger_tt: "다음 조건들 중 하나를 충족하십시오:\n호스트의 신앙심 증명:§g\n£white_dot §Y$TRN_two_church_unity$§! 중점 완료\n\n§!아리우스의 협력 얻기:§g\n£white_dot §Y$TRN_five_clan_republic$§! 중점 완료§!\n"
 TRM_nagisa_constitution_designation_of_state_religion: "트리니티 신앙 국교화"
 TRM_nagisa_constitution_designation_of_state_religion_desc: "트리니티 신앙은 우리의 가장 중요한 신앙 체계이며, 새로 제정되는 헌법에 우리의 국가 질서가 우리의 신앙에서 근거한다는 것, 그리고 트리니티 신앙이 국교라는 것을 강력하게 명시합니다."
 TRM_nagisa_constitution_establishment_of_consultative_council: "자문의회 창설"
 TRM_nagisa_constitution_establishment_of_consultative_council_desc: "투표권을 일반 서민들에게 확대하고 의회를 창설한다는 내용을 헌법 조항에 삽입하는 것은 극심한 반발을 일으킬 것입니다. 트리니티는 오랜 시간 민주제와는 결코 융화될 수 없는 문화적, 사회적 전통을 가지고 있었습니다.\n\n나기사 헌법에서 보장할 예정인 의회의 권한은 오직 '자문'과 '권고' 뿐이며, 법을 만들 권한도, 국가 예산을 결정할 권리도 없는 상태입니다. 그럼에도 불구하고 트리니티의 많은 분파들은 이것이 트리니티를 민주 국가로 만드는 지옥행 열차에 몸을 들인 것과 동등하게 볼 것입니다.\n\n그렇지만 '트리니티의 귀족과두정 체제 아래에서 일반 시민들의 의견은 완전히 배제되어 왔으며, 자문의회를 만들어 대중들의 생각을 들어야 한다'는 주장도 존재합니다."
 TRM_nagisa_constitution_establishment_of_consultative_council_trigger_tt: "다음 조건들 중 하나를 충족하십시오:\n트리니티 내부의 개혁 의지:§g\n£white_dot [TRM.GetNameWithFlag] 측이 §Y민주주의§! 국가\n£white_dot 공의회에서의 신앙 문제를 §Y온건책§!으로 결정\n£white_dot §Y$TRN_idealistic_approach$§! 중점 완료\n£white_dot 트리니티의 조언가로 §Y$TRN_Ajitani_Hifumi$§!가 임명\n\n§!게헨나의 자유주의 기풍 유입:§g\n£white_dot [GEH.GetNameWithFlag] 측이 §Y$GEH_ako_route_focus$§! 또는 §Y$GEH_main_route_focus$§! 중점 완료\n£white_dot 트리니티의 조언가로 §Y$GEH_dkzh$§!가 임명\n£white_dot §Y$TRN_start_of_the_eden_treaty_negotiations$§! 중점을 완료\n£white_dot §Y$TRN_the_route_of_the_sun$§! 중점을 완료\n\n§!현지 국가의 대의제 기풍 유입:§g\n£white_dot 키보토스 국가가 아닌 §Y강대국§! 중 §G민주주의 동맹국§!이 존재§!\n\n"
 TRM_nagisa_constitution_anti_democracy_holy_war: "반민주주의 정신 명문화"
 TRM_nagisa_constitution_anti_democracy_holy_war_desc: "교육 받은 트리니티의 우수한 엘리트들로 이루어진 티파티의 과두제 체제를, 제대로 교육 받지 못한 일반 대중들에게 확대한다는 것은 트리니티를 망가뜨리겠다는 뜻입니다. 어차피 일반 대중들에게 투표권을 주어도, 뽑히는 것은 체리노 아니면 마코토 정도의 지도자 아니겠습니까? 민주제가 적이며, 타파 대상이라는 내용을 헌법에 명문화합니다."
 TRM_nagisa_constitution_establishment_of_consultative_council_OR_anti_democracy_holy_war_tt: "§Y$TRM_nagisa_constitution_establishment_of_consultative_council$§! 결정과 §Y$TRM_nagisa_constitution_anti_democracy_holy_war$§! 결정 중 하나만 선택할 수 있습니다."
 TRM_nagisa_constitution_strengthening_federalism: "주의 자율성 강화"
 TRM_nagisa_constitution_strengthening_federalism_desc: "각 주의 자율성을 강화하고, 트리니티에 통합된 학원들이 국제 무대에서 제한적이게나마 독자적인 활동을 할 수 있도록 허용합니다."
 TRM_nagisa_constitution_strengthening_federalism_trigger_tt: "다음 조건들 중 하나를 충족하십시오:\n트리니티 내부의 개혁 의지:§g\n£white_dot [TRM.GetNameWithFlag] 측이 §Y민주주의§! 국가\n\n§!넓어진 국토로 인한 주 자율성 강화 필요성:§g\n£white_dot 룩셈부르크 대공국, 산해경 고급중학교, 붉은겨울 연방학원, 백귀야행 연합학원, 밀레니엄 사이언스 스쿨, 키보토스 총학생회, 아비도스 고등학교 그리고 와일드헌트 예술학원 중 §G세 곳 이상§!의 §Y수도§!를 소유 중§!"
 TRM_nagisa_constitution_prohibition_of_the_death_penalty: "사형제 폐지"
 TRM_nagisa_constitution_prohibition_of_the_death_penalty_desc: "트리니티의 역사는 유스티나 성도회에 의한 반대파 고문과 억압으로 이루어져 왔습니다. 하지만 이제 상황이 달라졌습니다. 더 이상 무자비한 억압은 없을 것이며, 이는 헌법에 '국가가 국민을 죽일 권리가 없음'을 명시하는 것으으로 선언됩니다."
 TRM_nagisa_constitution_guarantee_of_social_basic_rights: "다섯 사회악과의 싸움 명시화"
 TRM_nagisa_constitution_guarantee_of_social_basic_rights_desc: "다섯 사회악이란 복지 확대를 주장하는 경제학자 윌리엄 베버리지 런던 정치경제대학교 학장이 선정한, 서민을 빈곤에 머무르게 하는 다섯 개의 악을 말합니다. 궁핍, 질병, 무지, 불결, 그리고 나태를 국가가 해결할 의무가 있다는 것을 헌법 조항에 추가합니다.\n\n이는 트리니티가 장기적으로 '복지 국가'로서 전환될 것이라는 명시적인 선언과도 같습니다. 자유시장을 주장하는 이들에게는 다소 충격적인 조항이 될 것입니다."
 TRM_nagisa_constitution_reflection_on_past_history: "과거사 반성"
 TRM_nagisa_constitution_reflection_on_past_history_desc: "유스티나 성도회에 의한 과거 트리니티의 고문 행위를 비롯한, 트리니티 종합학원의 이름 아래에서 자행된 범죄들에 대한 반성의 메시지를 헌법에 명시합니다.\n\n이는 고결하며 또 미래 지향적이지만, 시스터후드는 자신들의 역사에 대한 모욕이라고 생각할 우려가 있습니다. 헌법에 '과거에 대한 반성'을 명시하기 위해서는, 시스터후드를 설득할 수 있는 충분한 근거를 준비해야만 합니다."
 TRM_nagisa_constitution_reflection_on_past_history_trigger_tt: "다음 조건들 중 하나를 충족하십시오:\n호스트의 신앙심 증명:§g\n£white_dot §Y$TRN_two_church_unity$§! 중점 완료\n\n§!종말론으로 인한 시스터후드의 반성:§g\n£white_dot [GEI.GetNameWithFlag] 측과 §R전쟁§! 중§!\n"

 # 나기사 게헨나 코어링
 TRN_united_gehenna_decisions_cat: "트리니티의 게헨나 통합"
 TRN_united_gehenna_decisions_cat_desc: "§G트리니티 종합학원§!은 과거 필리우스, 상투스, 파테르, 그 외에도 수많은 군소 학원들이 연합하는 §Y태고의 공의회§!를 통하여 탄생하였습니다. 트리니티는 그 역사상 한 번도 홀로 선 적이 없으며, 여러 학원과 분교들의 대등한 연합을 통해 존재할 수 있었습니다. 이미 트리니티가 수많은 학원의 연맹체라면, 그 연맹에 새로운 구성원이 생기는 것은 특별한 일이 아닙니다. 게헨나는 식민지도 패배자도 아니며, 트리니티의 오롯한 연합 구성원이자 새로운 자매로서 같은 자리에 설 것입니다.\n\n...까지가, 트리니티 정부 홈페이지에 올라와 있는 공식적인 입장입니다. 물론 호스트도, 정의실현부도, 분파들도, 심지어 구 게헨나조차도 이 고귀한 공문이 완벽한 진실을 담고 있지 않다는 것을 압니다. §Y게헨나 학원§!은 다른 트리니티의 구성 학원들과는 전혀 다릅니다. 신앙을 공유하지 않으며, 문화적인 차이도 크며, 그 자유주의적인 정신은 트리니티의 고결한 전통과 어우러지지 않습니다.\n\n그렇지만, 선한 목자는 양들을 위해 스스로를 희생하는(요한 10:11) 법이니, 티파티는 그녀들이 트리니티의 §G네 번째 기둥§!으로서 설 수 있도록 인내심을 가지고 인도할 것입니다. 어린 양이 아무리 시끄럽게 운다고 해도, 목자가 그 양들을 버리겠습니까? 자애로운 신께서 양떼를 푸른 풀밭에 누이시며 쉴 만한 물가로 인도하시며, 그들이 의로운 길로 가도록 인도하시듯(시편 23:2-3), 우리도 마땅히 그리 할 것입니다.\n\n현재 §G게헨나 학원§!의 학생회장: [TRN_gehenna_puppet_leader_loc]"
 
 ## 게헨나 학생회장 디시전
 ### 나기사 -> 저항도 감소+순응도 증가 한 번에, 이오리->저항도 감소, 세나->순응도 증가
 TRN_gehenna_puppet_leader_host: "키리후지 나기사가 게헨나 학생회장 겸직"
 TRN_gehenna_puppet_leader_host_desc: "키리후지 나기사가 게헨나 학생회의 학생회장 직을 겸합니다."
 TRN_gehenna_puppet_leader_host_tt: "§g키리후지 나기사가 게헨나 학생회장을 겸직한다면, $TRN_gehenna_puppet_leader_integration_target$ 결정은 낮은 저항도 감소, 낮은 순응도 증가 효과를 보일 것입니다.§!"
 TRN_gehenna_puppet_leader_iori: "시로미 이오리의 게헨나 학생회장 임명"
 TRN_gehenna_puppet_leader_iori_desc: "게헨나 선도부가 게헨나 학생회를 통제하도록 합니다. 이는 게헨나 학생들에게는 사실상의 군정으로서 받아들여질 것입니다. 저항 세력을 분쇄하는 것에는 도움이 되겠으나, 민간인들의 지지를 이끌어내기에는 좋지 않은 선택입니다."
 TRN_gehenna_puppet_leader_iori_tt: "§g시로미 이오리가 게헨나 학생회장에 임명된다면, $TRN_gehenna_puppet_leader_integration_target$ 결정은 저항도 감소 효과를 보일 것입니다.§!"
 TRN_gehenna_puppet_leader_sena: "히무로 세나의 게헨나 학생회장 임명"
 TRN_gehenna_puppet_leader_sena_desc: "게헨나 응급의학부가 게헨나 학생회를 통제하도록 합니다. 이는 게헨나 학생들에게는 사실상의 민정으로서 받아들여질 것입니다. 구호기사단과 같은 전통이 있는 만큼, 트리니티가 받아들이기 쉬운 자치 선택지이며 현지인들도 만족할 것입니다. 문제는 저항 세력 분쇄를 세나 학생회장 체제에서도 이루어낼 수 있을지는 우려스럽습니다."
 TRN_gehenna_puppet_leader_sena_tt: "§g히무로 세나가 게헨나 학생회장에 임명된다면, $TRN_gehenna_puppet_leader_integration_target$ 결정은 순응도 증가 효과를 보일 것입니다.§!"
 
 TRN_gehenna_puppet_leader_integration_target: "게헨나 학생회의 [FROM.GetName] 주 내부 정책"
 TRN_gehenna_puppet_leader_integration_target_desc: "게헨나 학생회장은 트리니티와 게헨나의 통합을 위하여, 게헨나 관리 정책을 실시합니다."
 
 TRN_gehenna_puppet_leader_loc_0: "공석"
 TRN_gehenna_puppet_leader_loc_1: "키리후지 나기사"
 TRN_gehenna_puppet_leader_loc_2: "시로미 이오리"
 TRN_gehenna_puppet_leader_loc_3: "히무로 세나"
 
 TRN_united_gehenna_decisions_remove_resistance: "[FROM.GetName] 주의 레지스탕스 제거"
 TRN_united_gehenna_decisions_remove_resistance_desc: "우리가 게헨나 지역에 가져온 통합주의적 정책이 성공을 거두면서, [FROM.GetName] 주의 레지스탕스 세력은 대중적 지지를 잃어가고 있는 것으로 보입니다."
 
 TRN_united_gehenna_decisions_integration_complete: "[FROM.GetName] 주의 통합 절차"
 TRN_united_gehenna_decisions_integration_complete_desc: "[FROM.GetName] 주는 트리니티의 질서에 편입되었으며, 우리의 질서와 신앙을 받아들였습니다."
 
 TRN_united_gehenna_decisions_remove_nsdap: "[FROM.GetName] 주의 민족사회주의 영향력 제거"
 TRN_united_gehenna_decisions_remove_nsdap_desc: "당황스럽게도 구 게헨나 정부는 이 지역의 민족 사회주의 독일 노동자당(나치) 세력을 지금까지도 전혀 소탕하지 못한 채 방치하고 있었습니다. 정의실현부가 행동하는 수밖에는 없을 것 같습니다."

 # 미카 디시전
 TRM_mika_misono_problem_cat: "미소노 미카의 활동"
 TRM_mika_misono_problem_cat_desc: " "
