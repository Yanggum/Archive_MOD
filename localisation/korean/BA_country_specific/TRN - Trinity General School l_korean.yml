 # 미카 SNS 계정 메인화면
 TRM_mika_misono_self_introduction_loc_0: "파테르 분파 리더, 미소노 미카입니다☆ 게헨나 계정은 미안하지만 차단합니다 (_ _)\n #트리니티_티파티 #파테르"
 TRM_mika_misono_self_introduction_loc_1: "에덴 조약 결사 반대! 지지자 여러분 필리우스 분파 임원들에게 모모톡 총공세!!! 부탁드려요!\n #에덴_조약 #파테르"
 TRM_mika_misono_self_introduction_loc_2: "파테르는 게헨나와의 전쟁, 그 마지막 순간까지 트리니티와 함께 할 것입니다.\n전시 정보는 국토교통성 및 내각부 '방재정보' 사이트를 참고하십시오."
 TRM_mika_misono_self_introduction_loc_3: "아리우스와 전쟁 절대 반대!! 트리니티의 평화주의 추진합니다\n #PeaceforArius #PrayforArius"
 TRM_mika_misono_self_introduction_loc_4: "사무엘라 향수 좋아합니다. 선물 많이 보내주세요\n농담이야 ㅋㅋ 모두의 선물은 마음만 받고 있어!"
 TRM_mika_misono_self_introduction_loc_5: "모두의 아이돌(희망), 파테르 분파 리더 미소노 미카 공식계정☆ 파테르 정보도 여기에서 공유 중!\n #트리니티_티파티 #파테르 #나기쨩에게_하고싶은말"
 TRM_mika_misono_self_introduction_loc_6: "밀레니엄 엑스포에 다녀오신 트리니티 사절 여러분 수고하셨습니다!\n#밀레니엄_엑스포 #트리니티_밀레니엄_우정"
 TRM_mika_misono_self_introduction_loc_7: "나는 나기 쨩이 내 계정 매일 에고서치하는 거 알고 있어... ㅇㅁㅇ\n나기쨩!!! 이 메시지 보고 있다면 당근을!! 흔들어 줘!!"
 TRM_mika_misono_self_introduction_loc_8: "나만의 왕자님 찾는 중... (loading...) 조금 외로움\n대화 상대 언제나 찾아요"
 TRM_mika_misono_self_introduction_loc_9: "행복해지려고 노력하고 있어.\n그게 아무리 어려운 일이라고 하더라도."
 TRM_mika_misono_self_introduction_loc_10: "대전이라는 게 정말 현실일까? 어쩌면 이 모든 게 긴 꿈은 아닐까?\n그런 생각을 하며 살고 있는, 철학적인 소녀 미소노 미카 공식계정입니다"
 TRM_mika_misono_self_introduction_loc_11: "세이아 쨩. 살아 있어 줘서 고마워."
 TRM_mika_misono_self_introduction_loc_12: "티파티 파테르 분파 수장인 미카예요. 모두에게 늘 감사하고 있어요.\n제 계정 방문해 주시는 모든 분들에게, 사랑을 담아서."
 
