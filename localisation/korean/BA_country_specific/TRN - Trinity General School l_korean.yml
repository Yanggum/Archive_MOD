 TRN_guhogisadan: "구호기사단"
 TRN_guhogisadan_desc: "§L신념과 긍지를 가슴에! 구호가 필요한 곳에 구호를!§!"
 trait_TRN_lack_of_experience: "어설픈 지휘관"
 trait_TRN_lack_of_experience_desc: "§L전쟁 경험이 없는 탓에 이 장군의 지휘는 아직 어리숙하고 서투릅니다. 하지만 언젠가는 성장하여 걸출한 장군이 될 가능성이 있습니다.§!"
