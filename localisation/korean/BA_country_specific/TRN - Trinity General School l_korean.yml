 TRN_Mika_honor_loop_decision: "미소노 미카의 개인 일정"
 TRN_Mika_honor_loop_decision_desc: "당연한 말이지만, 미소노 미카 호스트의 임기는 과거처럼 1년으로 제한되지 않습니다. 신헌법이 보장하는 한도 내에서, 그 기간은 얼마든지 연장될 수 있습니다. 그렇기에 미소노 미카는 앞으로 수많은 사건들을 발생 시킬 것입니다."
 TRN_Mika_honor_loop_decision_tt: "§Y미소노 미카§!의 일상적인 사건들이 §Y발생§!합니다."
 TRN_honor_populist_policies: "대중주의 정책 통과"
 TRN_honor_populist_policies_desc: "이상적인 언변만으로는 사람들의 신뢰와 지지를 얻을 수 없습니다. 말보다 행동이 필요합니다. 우리는 가장 도움이 절실한 이들을 위해 실질적인 조치를 취할 것입니다. 가난한 이들에게는 기본 식료품 보조금을, 실업자와 대전이 당시 부상입은 전투병들, 복지 수급자들에게는 겨울철 연료와 식량을 구입할 수 있도록 공공 지원을 제공할 것입니다."
 TRN_honor_social_change: "사회 변혁"
 TRN_honor_social_change_desc: "'트리니티 사회주의'는 노동자와 자본가가 협력하는 계급협조와 협동조합주의를 기반으로 하며, 기독교적 교리에 따라 사회적 연대를 실현하려는 이념입니다. 그러나 이상과는 달리, 현실 속에는 여전히 독일국과 구체제의 잔재들이 곳곳에 남아 우리 앞길을 가로막고 있습니다. 이제 우리는 그 뿌리 깊은 유산들을 철저히 청산해야 할 때입니다."
 TRN_honor_spread_of_militarism: "군국주의 확산"
 TRN_honor_spread_of_militarism_desc: "트리니티의 대의를 실현하기 위해서는 게헨나에 대한 복수를 반드시 완수하고, 나아가 키보토스에서 가장 강력한 군대를 구축해야 합니다. 이를 위해 조기 군사 교육을 통해 차세대 구성원들에게 국가 방위의 중요성과 책임감을 심어주는 체계를 정립할 필요가 있습니다. 트리니티 사회 전반에 걸쳐 안보 의식을 강화하고, 단결된 힘으로 미래의 위협에 대응할 준비를 갖춰야 합니다."
 TRN_honor_technocrat: "기술관료 강화"
 TRN_honor_technocrat_desc: "근본적으로 일반 학생들이 국가를 경영하기란 매우 어렵습니다. 행정과 통치에는 단순한 열정만으로는 부족하며, 체계적인 사고와 검증된 충성이 필수적입니다. 그렇기에 우리는 이념적으로 검증된 충성심 높은 엘리트들을 정부 전반에 등용하여 행정의 전문성과 효율성을 끌어올려야 합니다."
 TRN_honor_woman_right: "여성 인권 보호"
 TRN_honor_woman_right_desc: "나치당의 오만함과 남성우월주의적 사고가 결합되어 탄생한 3K 정책은 트리니티의 등장과 함께 자연스레 폐지되었습니다. 그러나 여성들의 직장 복귀와 지위 개선은 제대로 이루어지지 않고 있습니다. 이러한 문제는 호스트의 개입으로 조속히 처리해야 합니다."

 TRN_honor_protection_of_the_Jewish_community: "유대인 공동체 보호"
 TRN_honor_protection_of_the_Jewish_community_desc: "유대인들은 독일국의 광기 속에서 오랜 세월 박해받아 온 민족입니다. '배후 증상설'과 같은 조작된 음모론은 유대인 공동체를 붕괴시키는 도구로 사용되었고, 사람들은 유대인이라는 이유만으로 폭력을 저지르고도 제대로 된 처벌조차 받지 않는 일이 비일비재했습니다. 이제는 이들에 대한 보호가야말로 진정한 '정의의 실현'이 될 것입니다."
 TRN_honor_utilize_the_church_authority: "시스터후드 권위 이용"
 TRN_honor_utilize_the_church_authority_desc: "시스터후드는 트리니티의 신앙적 정통성을 자처하며, [TRM.GetNameDef] 지역에서 구빈 활동과 사회봉사를 지속해오고 있습니다. 이들의 헌신적인 모습은 많은 학생들과 시민들의 존경을 받고 있습니다. 이러한 시스터후드를 이용해 할 수 있는 일은 무궁무진 합니다."

 
 
 trinity_honor_events.1.t: "무인 병동에서의 도난 사건"
 trinity_honor_events.1.desc: "\"흐아앙, 선배! 또 놓치고 말았어요.\"\n\n\"괜, 괜찮아요 하나에 쨩 그래도 다친 사람은 없어서 다행인거 같네요….\"\n\n하나에의 등을 토닥이며 세리나가 위로했다. 최근 트리니티의 무인 병동을 노린 강도 사건이 빈번하게 발생하고 있었다. 세리나와 하나에가 범인을 잡기 위해 필사적으로 노력하고 있지만, 범죄는 좀처럼 줄어들 기미를 보이지 않았다.\n\n\"으응~? 그러니까, 도난 사건 때문에 내 도움이 필요하다는 거네~☆\"\n미카는 천천히 보고서를 읽어가며 혼잣말을 하고 있었다. 사태 이후로 정의실현부는 항상 바쁘게 움직였다. 이전에도 바빴지만, 사태 이후로 더욱 바빠졌다. 미카는 턱을 손에 괴고 보고서를 뚫어져라 보고 있었다. 자신의 내면의 세계에서 자신과 대화를 하며 이 문제를 어떤 방식으로 해결 해야할지 뾰족한 수가 도통 생각나지 않았다.\n\n\"정의실현부 애들도 정신없을 텐데, 구호기사단을 위해서 걔네를 부르는 건 좀 그렇지 않으려나~? 걔네는 티파티 직속이기도 하고 말이야.\""
 trinity_honor_events.1.a: "\"구호기사단에게 예산을 조금만 더 챙겨주면 그 아이들도 스스로 해결할 수 있지 않을까?\""
 trinity_honor_events.1.b: "\"역시, 정의실현부 아이들에게 부탁하면 어떻게든 해결해주지 않을까?\""
 trinity_honor_events.1.c: "\"그래도, 정의실현부 아이들도 분명 각자의 사정이 있을 텐데...\""

 trinity_honor_events.2.t: "정의실현부의 과잉진압 문제"
 trinity_honor_events.2.desc: "\"꺄아악!\"\n\n\"소란 피우지 마! 계속 반항하면 험한 꼴을 보게 될 줄 알아!\"\n\n\"넌 그냥 학원에서 인질 협상금을 지불할 때까지 얌전히 여기 붙잡혀 있으면 되는 거야. 괜히 엉뚱한 생각하지 마!\"\n\n\"네? 트리니티 학원이랑 협상을 했다고요?\"\n\n\"앙? 당연하지! 벌써 연락은 끝났다고.\"\n\n\"아.. 안 돼!! 피해요!! 구석으로!!\"\n\n-콰아앙-!!\n\n\"키힛- 키헤헤헤헤헤-!\"\n\n\"히.. 히익! 다.. 다가오지 마! 크아악-!\"\n\n\"사람이 캔 콜라처럼 찌그러졌다고~? 와-오☆ 츠루기 쨩, 정말 무섭다니까~\"\n\n사사건 이후에도 트리니티 학생들을 노린 납치 범죄는 좀처럼 줄어들 기미를 보이지 않고 있습니다.티파티는 평소처럼 정의실현부의 츠루기를 협상가로 보냈지만 '과잉진압'이라는 언론의 꼬리표는 여전합니다. 특히 이번 사건에서 납치범들의 처참한 모습이 언론에 공개되자 정의실현부는 거센 비난에 직면했습니다.\n\n그래도 인질들이 전부 무사히 구조된 건 다행이지만 그중 몇몇은 극심한 스트레스로 PTSD 진단을 받았습니다. 구호기사단의 말에 따르면 최소 3주 이상의 안정이 필요하다고 합니다."
 trinity_honor_events.2.a: "\"츠루기 쨩의 방식, 화끈해서 좋지만~ 문제가 되면 고쳐야겠지?\""
 trinity_honor_events.2.b: "\"흐응~? 나쁜 짓 한 사람들을 상대로 한 건데, 이 정도로 소란 피울 일이야?\""

 trinity_honor_events.3.t: "카페 거리에서의 총격전"
 trinity_honor_events.3.desc: "오늘 오전 불량배가 미라클 5000 케이크 제빵사를 납치하고 방과후 디저트부와 일부 학생들 그리고 시스터후드로 추정되는 학생 한 명과 총격전을 벌인 사건이 발생했습니다. 다행히도 불량배는 총격전에 당황하여 제빵사를 두고 떠났습니다. 시스터후드가 이 사건에 연관되어 있다는 점과 총격전으로 인한 도심 피해가 문제입니다. 도심 피해는 크지 않아 곧바로 복구되겠지만, 시스터후드가 이 사건과 연관되어 있다는 점은 의심스럽습니다. 물론 그들은 우리와 정치적 동맹 관계이기에 간단한 면책으로 해결할 수도 있습니다."
 trinity_honor_events.3.a: "\"아하하. 뭐, 한 번쯤은 그냥 웃으며 넘어가 주는 것도 괜찮지 않을까?\""
 trinity_honor_events.3.b: "\"...음, 그래도 역시 조금 수상하단 말이지.\""

 trinity_honor_events.4.t: "시스터후드의 선교 활동"
 trinity_honor_events.4.desc: "블라블라블라 시스터후드와 접촉한 이후 시스터가 활동한다. 근데 선교 내용이 이상하다 어쨌거나 저째꺼나 우리는 이들을 제지해야한다. 근데 그러면 사쿠라코의 특성을 더 좋게 못바꿔준다. 슬프지만"
 trinity_honor_events.4.a: "\"선교 활동? 그거 까지 막을 필요가 있어 보여?\""
 trinity_honor_events.4.b: "\"음 안 돼.\""
 
 TRN_economic_evelopment_department: "학원경제개발부"
 TRN_economic_evelopment_department_desc: "[TRN_eed_cat_desc]"
 TRN_eed_cat_desc_Mika: "미소노 미카의 명령으로 설립된 학원경제개발부는 트리니티의 군수 산업 발전을 위해 산업 구조를 재편하고 있습니다. 이 부서는 미소노 미카의 재가 없이도 경제와 산업 부문에 한해서는 호스트와 유사한 역할을 수행하고 있습니다. 앞으로 학원경제개발부는 트리니티를 그 어느 때보다 강하게 만들 경제 계획을 수립하는 임무를 맡게 됩니다."
 TRN_eed_cat_desc_general: "학원경제개발부는 호스트의 명령에 따라 설립된, 학원의 경제를 전문적으로 관리-운영하는 조직입니다. 부장은 학원의 중장기 발전 전략을 수립하고, 다양한 경제 분야를 총괄하는 역할을 맡고 있습니다. 학원경제개발부에는 그 어느 때보다 정밀하고 체계적인 계획이 요구되고 있습니다."
 TRN_Industrial_Regions: "[FROM.GetName]주 트리니티 개발지구 조성"
 TRN_industrial_region_state_trigger: "최대 3개의 주만 지정할 수 있음. 현재 [?TRN_industrial_region_state]개의 주를 지정함."
 TRN_garden_city_movement: "정원 도시 운동"
 TRN_garden_city_movement_desc: "에덴은 재건을 통해서 어느정도 이전의 모습을 갖췄습니다. 그럼에도 아직 도시는 온전히 치유되지 않았습니다. 이전보다 생활 환경을 개선하고 산업 역량 개발을 지원해야 할 것입니다. 가족 주택, 중밀도 주택, 공유 서비스와 편의 시설, 넓은 녹지 공간이 갖춰질 예정입니다."
 TRN_embrace_chain_production: "대량 생산 수용"
 TRN_trade_controls: "무역 통제"
 TRN_air_factory_decision: "트리니티 항공기 & 엔진 공장"
 TRN_junkers_corp_assets_decision: "융커스 자산 활용"
 TRN_improv_supply_efficiency_decision: "소비에 맞춘 탄약 생산 공장"
 TRN_improv_supply_efficiency_decision_desc: "트리니티의 포병들은 포탄을 소비합니다. 많이 소비합니다. 너무나도 심할 정도로 소비합니다."
 TRN_improv_supply_efficiency_decision_trigger_tooltip: "§Y$TRN_army_ns$§!에서의 §Y$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$§!(이)가 §Y0%§! 이상." 
 TRN_economic_plan_cat: "트리니티 산업 계획"
 TRN_economic_plan_cat_desc: "사태 발생 이후 이어진 경제 위기, 늘어난 학원 부지, 무너진 사회 질서, 그리고 하락세를 보이는 각종 경제 지표는 티파티 호스트의 보다 적극적인 경제 개입을 요구하고 있습니다. 다가올 위기에 대비하기 위해서는 방대하고 체계적인 산업 개발이 반드시 추진되어야 하며, 이는 모교의 안정과 회복을 위한 핵심 과제가 될 것입니다."
 TRN_industry_deicision_active: "다른 곳에서 산업 계획이 진행되고 있습니다."
 TRN_Infrastructure_development_fake: "트리니티 기반시설 재건설"
 TRN_Infrastructure_Development: "[FROM.GetName] 기반시설 재건설"
 TRN_Infrastructure_Development_desc: "대전이 사태로 기반시설이 붕괴한 가운데, 구시대 독일국이 남긴 낡은 아스팔트 도로는 트리니티의 주요 차량 운용에 적합하지 않습니다. 이에 따라, 노후된 인프라를 전면적으로 교체하는 대규모 토목 사업의 필요성이 제기되었습니다. 새롭게 구축될 고속도로망은 평시에는 민간의 편의를 높이고, 전시에는 군용 차량의 신속한 전국 이동을 가능하게 해 줄 것입니다."
 TRN_Abydos_clearing_sand: "[FROM.GetName] 생태계 복원"
 TRN_Peat_Extraction: "북부 황야 지역 토탄 채굴"
 TRN_Peat_Extraction_desc: "북부 지역에는 수많은 습지, 늪지, 황무지가 있습니다. 이 곳은 원래 사람이 살지 않았지만 개척이 되면서 사람들이 살기 시작했고 이러한 개척을 통해 우리는 이 지역의 경제적 잠재력에 대해 알 수 있습니다.  황무지는 땅에서 파내 지역 산업과 개인 가정에 보조 연료로 사용할 수 있는 석탄이나 목재의 저품질 대체 연료인 토탄의 훌륭한 공급원입니다."
 TRN_Opelwerk_Brandenburg: "오펠부르크 브란덴부르크 인수"
 TRN_Opelwerk_Brandenburg_desc: "독일의 주요 자동차 제조업체였던 오펠부르크 브란덴부르크는 1920~1930년대에 걸쳐 꾸준히 성장했으나, 대전이 사태의 직격탄을 맞으며 심각한 타격을 입었습니다. 그러나 이들이 보유한 자동차 제조 기술은 여전히 혁신적이며, 만약 이를 인수하여 국영 기업으로 전환한다면, 수천 대의 트럭을 생산할 수 있는 기업을 확보할 수 있을 것입니다."
 TRN_Lehnmuhle_Dam: "작센 댐 재건"
 TRN_Lehnmuhle_Dam_desc: "대전이 사태 당시 주요 격전지 중 하나였던 작센에서는 치열한 전투 끝에 댐이 붕괴되어 대규모 침수 사태가 발생했습니다. 트리니티의 티파티 호스트와 각 분파 임원들은 이 지역의 댐 재건을 최우선 과제로 삼았으며, 특히 동부 에르츠산맥 일대에서 끊임없이 발생하는 홍수와 현지 전력 공급원에 대한 수요가 급증하고 있음을 강조했습니다."
 TRN_Basis_Scholar_development: "바시스 스콜라 개발"
 TRN_Basis_Scholar_development_desc: "바시스 스콜라는 구호기사단의 빠른 대응 덕분에 독일군의 공격으로부터 큰 피해를 면할 수 있었습니다. 이들의 집요한 노력은 주민들로 하여금 현 정부에 깊은 신뢰와 우호감을 갖게 만들었고, 이는 지역 안정에 크게 기여하고 있습니다. 이제 이 지역과 연계한 산업 계획을 추진한다면, 보다 빠른 공업화를 실현할 수 있을 것입니다. 특히 오데르 강과의 인접성은 물류와 자원 수송 측면에서 큰 이점으로 작용할 것입니다."
 TRN_Kimigayama_shipbuilding_plant: "키미가야마 조선소"
 TRN_Kimigayama_shipbuilding_plant_desc: "새로운 해양은 트리니티의 조선 산업에 신선한 활력을 불어넣기에 충분하며, 이는 조선소에 대한 대규모 투자를 요구합니다. 그러나 이러한 투자는 결코 헛되지 않을 것입니다. 충분한 자본과 자원이 투입된다면, 이들이 가져올 경제적-전략적 보상은 가늠하기 어려울 만큼 클 것입니다."
 TRN_Stettin_heavy_industry: "[63.GetName] 항공 사업"
 TRN_Stettin_heavy_industry_desc: "[63.GetName] 지역은 북해와 인접해 있어, 북동유럽을 향한 공중 작전과 해상 통제에 탁월한 지리적 이점을 갖고 있습니다. 이에 따라 지역 당국과 협력해 대규모 공항을 건설하고, 본격적인 항공 산업 기반을 다질 계획입니다."
 TRN_dessert_shop_expansion: "디저트 가게 확충"
 TRN_dessert_shop_expansion_desc: "지도자는 늘 끊임없이 사고해야 하고, 사고에는 고열량의 에너지가 필요합니다. 자연스럽게, 인간은 이 모든 조건을 만족시키면서도 달콤하고 잠시나마 근심을 잊게 해주는 무언가를 찾게 됩니다. 바로 디저트입니다."
 TRN_agricultural_support: "[FROM.GetName] 농업 지원"
 TRN_agricultural_support_desc: "사람들은 메클렌부르크의 푸른 초원과 평화로운 호수를 보며 휴식을 떠올립니다. 하지만 진정한 포식자인 당신은 그 광활한 평야를 보며 효율적인 단일 경작과 무자비한 지력 착취를 떠올려야 합니다. 지평선 끝까지 당신의 발아래 두십시오. 물론, 전부 유전자 조작된 것들로 말이죠." # 개그성 글입니다. 추후에 수정 할거임
 TRN_katowice_mining: "[FROM.GetName] 광업 확대"
 TRN_katowice_mining_desc: "지구의 내장을 긁어내어 당신의 은행 계좌를 채우십시오. 환경론자들이 '지속 가능한 미래'를 속삭이며 유기농 카페라테를 마실 때, 진정한 승리자는 지각을 뚫고 들어가 지구의 가장 깊숙한 보물을 약탈합니다. 카토비체가 당신의 거대한 드릴을 기다리고 있습니다." # 개그성 글입니다. 추후에 수정 할거임
 TRN_stettin_oil_mining: "슈테틴 석유 매장지 개발"
 TRN_stettin_oil_mining_desc: "슈테틴 북서쪽의 항구 도시인 슈비네뮌데에서 약 6km 떨어진 지점에서 유전이 존재한다는 보고서가 있습니다. 이 발견은 특히 연료가 부족한 트리니티에게 부족분을 보충할 수 있는 기회를 제공하며, 동시에 수입 화석 연료에 대한 의존도를 획기적으로 줄일 수 있는 잠재력을 지니고 있습니다."
 TRN_rebuilding_Landwehrkanal: "란트베어 운하 복구"
 TRN_rebuilding_Landwehrkanal_desc: "대전이 사태로 인해 란트베어 운하가 심각한 피해를 입어 곳곳이 파괴되었고, 그 결과 사용이 불가능해졌습니다. 특히 이 운하는 마그데부르크에서 바시스 스콜라까지 한 번에 화물을 운송할 수 있는 큰 장점을 지니고 있어, 그 가치가 높게 평가됩니다."
 TRN_schlesien_coal_mine: "슐레지엔 탄광 확장"
 TRN_schlesien_coal_mine_desc: "슐레지엔 지역의 탄광은 트리니티에서 거대한 탄광으로 성장하고 있으며 석탄 채굴량은 시간이 갈수록 늘어나고 있습니다. 사태 이후로 급격하게 늘어난 에너지 소모량을 감당하기 위해 슐레지엔 지역의 탄광 개발은 필수적인 과제가 되었습니다."

 TRN_trinity_world_cat: "트리니티와 세계"
 TRN_trinity_world_cat_desc: "트리니티는 현재 세계로부터 고립되어 있으며, 이는 충분히 외교적 노력으로 극복 가능한 문제입니다. 그러나 지정학적 요인은 여전히 우리를 옥죄고 있으며, 이 복합적인 위기는 외교를 시작으로 하나씩 해결해 나가야 합니다. 우리는 결코 좌절하지 않습니다."
 TRN_lend_our_support: "우리의 지원 빌려주기"
 TRN_international_propaganda: "국제 선전"
 TRN_international_propaganda_tt: "획득한 정치력의 양은 공장 수에 따라 결정됩니다."
 TRN_border_fortifications: "국경 요새화"
 TRN_anti_pandemonium_society: "[GEM.GetNameDef] 권위 폄하"
 TRN_create_pro_trinity_group: "[GEM.GetAdjective] 지역 독일인 동요"
 TRN_pandemonium_society_approach_club_Hot_Springs_Department: "온천개발부에 접근"
 TRN_pandemonium_society_approach_club_Gourmet_Research_Society: "미식연구회에 접근"
 TRN_prefect_team_discipline_decline: "[GEH.GetNameDef] 규율 훼손"
 TRN_romania_give_the_oil: "루마니아 유전지대 확보"
 TRN_romania_give_the_oil_desc: "트리니티의 산업, 차량, 그리고 전쟁기계들이 원활하게 가동되기 위해서는 석유가 필요합니다. 루마니아의 유전 지대는 우리의 수요를 충족시킬 수 있는 충분한 공급량을 보유하고 있습니다. 그러나 루마니아 정부는 우리에게 비협조적인 태도를 보이고 있으며, 이러한 상황을 타개하기 위해서는 무력의 사용이 요구됩니다."
 TRN_support_HYA_decision: "[HYA.GetNameDef] 측과 협력"
 TRN_support_HYA_var_tt: "§Y[HYA.GetNameWithFlag]§! 측에게 §Y[TRM.GetNameWithFlag]§! 측과 협력하는 §Y사건이 발생§!합니다. 최대 횟수는 §Y3회§!이며 현재 §Y[?TRN_support_HYA_var]회§! 협력했습니다.\n\n만약 §Y3회§! 이상 협력했다면, §Y결정이 제거§!됩니다."
 TRN_support_HYA_decision_remove_tt: "현재 §Y[?TRN_support_HYA_var]회 협력§!했습니다. 조건을 만족하였기에 다음의 효과가 나타납니다:"
 TRN_influence_baltics_decision: "[FROM.GetName] 측에게 영향력 행사"
 TRN_influence_the_baltics_unlock_tt: "£decision_icon_small §Y결정 해금§!: 발트 국가에게 영향력 행사"
 TRN_german_influence: "트리니티의 영향력"

 # 발칸 외교 
 TRM_diplomacy_balkan_decision_category: "$ITA_diplomacy_balkan_decision_category$"
 TRM_diplomacy_balkan_decision_category_desc: "발칸은 \"유럽의 화약고\"로 불릴 만큼 충돌이 잦은 지역입니다. 이는 국가 간 갈등을 조장하고 이간질하기에 적합한 환경임을 의미합니다. 따라서 우리는 신중하고 전략적으로 접근해야 합니다. \n\n발칸 국가들 간의 관계를 적절히 조율해 우리의 이익에 부합하는 방향으로 그들의 정책을 유도해야 합니다. 궁극적으로, 모든 발칸 국가를 우리에게 종속시키거나 동맹국으로 만들 수 있도록 장기적인 계획을 수립해야 할 것입니다."
 TRM_send_ultimatum_to_country_balkan: "$SOV_send_ultimatum_to_country_balkan$"
 TRM_pressure_country_government_balkan: "$SOV_pressure_country_government_balkan$"
 TRM_promote_ideology_rallies_balkan: "$SOV_promote_ideology_rallies_balkan$"
 TRM_pressure_government_cd_tt: "\n우리는 §Y[?TRM_pressure_government_cd]§!일에 한 번만 압박할 수 있습니다."
 TRM_pressure_government_active_flag: "$SOV_pressure_government_active_flag$"
 
#신성통치령 관리 사건과 결정
 TRN_Trinity_divine_mandate_cat: "신성통치령 설립"
 TRN_Trinity_divine_mandate_cat_desc: "\n\n£GFX_decision_header_TRN_trinity_buliding \n\n\n\n신성통치령은 과거 트리니티의 점령지를 관리하던 총독부 명칭에서 유래했습니다. 그러나 지금은 거대한 동방과 키보토스 영토를 효과적으로 관리하기 위해 신성통치령이라는 명칭을 역사 속에서 다시 불러왔습니다.\n\n신성통치령의 최종 목표는 영토를 관리하고, 현지인들을 트리니티에 동화시키며, 해당 지역을 트리니티와 비슷한 수준으로 발전시키는 것입니다. 언제가 될지는 알 수 없지만, 언젠가 트리니티는 이 광활한 영토를 완벽하게 통제하게 될 것입니다."
 TRN_Divine_Mandate_Trigger_tt: "§Y[ROOT.GetNameWithFlag]§! 또는 괴뢰국이 모든 §Y강조된 주§!를 지배함"
 TRN_poland_divine_mandate: "동남트리니티 신성통치령 수립"
