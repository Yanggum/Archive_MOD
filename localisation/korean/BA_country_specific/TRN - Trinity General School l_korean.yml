 TRN_denazification_ns: "해체된 나치 조직"
 TRN_Hungarian_trade_sanctions_ns: "트리니티의 무역 제재"
 TRN_Trinity_New_Culture_modifier: "트리니티 신 문화"
 TRN_Trinity_New_Culture_modifier_desc: "트리니티에는 새로운 활력이 필요합니다. 과거 시절의 문화는 퇴폐적 성향을 띠며 사회 전체의 발전에 기여하지 못했습니다. 이제 트리니티의 학생들은 전위적이고 현대적인 가치를 바탕으로 신선하고 진취적인 에너지를 불어넣을 것입니다."
 TRN_Trinity_New_Culture_modifier_change: "§Y$TRN_Trinity_New_Culture_modifier$§! 변동치"
 TRN_city_of_heaven: "천상의 도시"
 TRN_academy_defense_force_ns: "학원방위대"
 TRN_angel_brigade_force_ns: "천사 여단"
 TRN_social_problem_ns: "트리니티 사회 문제"
 TRN_industry_ns: "트리니티 산업"
 TRN_purged_nazi_elite_ns: "숙청된 나치 엘리트"
 TRN_controlled_party_ns: "통제된 독일 정당"
 TRN_controlled_party_ns_desc: "일부 '우호적인' 독일 정당들은 티파티 감찰관의 감찰 아래 티파티에 어느 정도 영향을 끼칠 수 있습니다."
 TRN_sisterhood_missionary_work_ns: "시스터후드 선교 활동"
 TRN_sisterhood_missionary_work_ns_desc: "티파티의 지원 아래 이루어지고 있는 선교 활동은 꽤나 성과를 거두고 있습니다. 물론 선교를 거부하는 사람 또한 존재하지만 큰 문제는 되지 않습니다."
 TRN_busy_JTF_ns: "바쁜 정의실현부"
 TRN_busy_JTF_ns_desc: "' - 아아, 거기 안바쁜 사람 있슴까?\n - 이치카 선배님, 최근에 티파티에서 호출이 잦아서...\n - 아무래도 안바쁜 사람 찾기가 어려울거 같아요..\n - 그렇슴까...'"
 TRN_supported_remedial_knights_ns: "지원 받은 구호기사단"
 TRN_supported_remedial_knights_ns_desc: "감사해 하는 아오모리 미네. 아무래도 미카의 명예를 올려야 할 듯."
 TRN_supported_design_department_ns: "지원 받은 에덴 전차 설계부"
 TRN_hidden_armor_doctrine_ns: "트리니티 기갑 교리"
 TRN_hidden_air_doctrine_ns: "공군 교리의 부재"
 TRN_hidden_aircraft_design_ns: "전투기 설계"
 TRN_command_center_reform_ns: "개혁중인 총사령부"
 # 이 아래로 아마도 state modifire
 TRN_SPD_parteitag_state: "사회민주당"
 TRN_SPD_parteitag_state_desc: "\n\n\n£GFX_TRN_banner_SPD_parteitag\n\n\n\n\n트리니티와 사민당의 거래로 이 지역에서 사민당은 자유로운 정치 활동을 보장받으며 특별한 지위를 갖게 되었습니다. 주총리가 대부분의 행정을 직접 관할하게 되었고, 중앙정부의 간섭은 크게 제한되었습니다."
 TRN_gehenna_resistance_movement: "게헨나 저항운동"
 TRN_gehenna_resistance_movement_desc: "트리니티와 게헨나의 ‘에덴 조약’은 양 학원의 온전한 통합을 의미합니다. 겉으로는 통일의 형태를 띠고 있지만, 실제로는 게헨나가 트리니티에 굴복한 병합 조약에 가깝습니다. 이를 부정하고자 게헨나 학생들이 트리니티의 지배에 반발하고 있으나, 에덴 조약이 발효되는 이상 그들의 저항은 머지않아 꺾일 것입니다."
 TRM_industrial_region_state: "트리니티 개발지구"
 TRM_industrial_region_state_desc: "이 주의 산업은 현재 학원경제개발부에 의해 관리되고 계획되며, 도시 및 농촌 행정은 에덴이 직접 임명하는 단일 지사 아래 중앙집권화되어 있습니다."
 TRM_belarusian_modifier_us: "벨라루스 의용대"
 TRM_ukrainian_modifier_us: "우크라이나 국민군"
