 # 중점 시작
 TRN_destroy_partisans: "유격대 파괴"
 TRN_destroy_partisans_desc: "정의실현부의 끊임없는 노력에도 불구하고, [61.GetName]와 [66.GetName]의 조직적인 저항이 좀처럼 사그라들지 않고 있습니다. 테러리스트들이 트리니티의 안정을 위협하고 있습니다. 이에 따라 호스트의 명령이 내려졌습니다. 정의실현부는 테러리스트를 철저히 제압하고 트리니티의 질서를 수호하기 위해 더욱 강경하게 나설 것입니다."
 TRN_destroy_partisans_effect_tt: "작전 성공시 §Y[KPD.GetNameWithFlag]§!와 §Y[NSD.GetNameWithFlag]§!의 영향력이 §Y2%§! 추가 감소합니다"
 TRN_reconstruction_of_collapsed_industry: "무너진 산업 복구"
 TRN_reconstruction_of_collapsed_industry_desc: "저항이 끝난 뒤 [61.GetName]와 [66.GetName]은 파괴되고 상처 입었습니다. 보조금 지원을 통해 무너진 산업들을 복구 시키고 [61.GetName]와 [66.GetName] 지역 주민들에게서 구원자라는 이미지를 심어야 합니다."
 TRN_Reconnect_network_and_power: "통신망 확대"
 TRN_Reconnect_network_and_power_desc: "대전이 사태의 여파로, 트리니티 통신망은 주요 거점에서 멀어질수록 정보 접근성이 현저히 떨어졌습니다. 그러나 통신망을 확장한다면 이러한 문제는 충분히 해결 가능하며, 보다 많은 지역에서 신속하고 정확한 정보 전달이 가능해질 것입니다."
 TRN_railway_improvement: "철도망 개선"
 TRN_railway_improvement_desc: "현지 철도의 궤간은 키보토스에서 사용되는 표준과 일치하지 않아, 결국 물자를 차량으로 수송해야 하는 비효율적인 상황에까지 이르렀습니다. 이 문제를 해결하기 위해서는 철도망을 개선하고, 보다 효율적인 수송 체계를 마련해야 할 것입니다."
 TRN_KWG_open: "카이저 빌헬름 협회 재개장"
 TRN_KWG_open_desc: "대전이 사태 동안 카이저 빌헬름 협회 건물은 화재로 소실되었습니다. 연구 자료들은 가까스로 보존해냈지만, 일부 손실은 피할 수 없었습니다. 트리니티의 수많은 학자들은 이를 안타까워하며, 협회의 복원과 재개장을 강하게 요구하고 있습니다."
 TRN_improving_academy_industry: "트리니티 재산업화"
 TRN_improving_academy_industry_desc: "트리니티의 총체적인 문제를 해결하기 위해서는 호스트가 주도하는 재개발이 필요합니다. 또한, 다가올 외부적인 위협에 대비하기 위해서는 군수 생산 공장을 대규모로 확장 해야 할 것입니다. 많은 사람들이 이 정책에 반대할 것이지만 모교이 위협에 닥쳤을때 사람들은 우리에게 고마워할 것입니다."
 TRN_ministry_of_industrial_development: "학원경제개발부 설립"
 TRN_ministry_of_industrial_development_desc: "트리니티의 경제는 하나의 오케스트라이며, 학원경제개발부는 그 지휘자입니다. 기존에 티파티에 소속되어 있던 경제 전문가들은 독립된 단체로서 학원과 학생들의 이해관계 사이에서 균형을 유지하며, 합리적인 투자와 규제 완화를 통해 양측이 더욱 부유하고 번영할 수 있도록 합니다."
 TRN_expanded_corporatism: "기독교 조합주의"
 TRN_expanded_corporatism_desc: "기독교의 사회 교리에 기반한 경제 체제는 연대 속에서 꽃을 피웁니다. 계급 조화, 보조성의 원칙, 공동선을 증진하기 위해 '조합'을 조직하고 이를 강화해야 합니다. 우리는 투쟁보다는 협력을, 그리고 조화와 사회적 연대를 강화할 것입니다."
 TRN_planned_economy: "시장경제 길들이기"
 TRN_planned_economy_desc: "자유 시장 체제는 인간의 본성과 같습니다. 그렇다고 해서 시장을 방치하는 것은 야만입니다. 우리는 시장경제를 종교적 사회 교리에 따라 길들이고 다룰 것입니다. 물론 이것이 무조건적인 통제나 무질서한 혼돈을 의미하는 것은 아닙니다."
 TRN_confiscation_distribution_collectivization: "몰수, 분배, 집산화"
 TRN_confiscation_distribution_collectivization_desc: "융커들의 토지는 무상으로 몰수되어, 분배 이후 학원이 관리하는 국영 농장으로 재편될 것입니다. 이 과정에서 충돌은 불가피하겠지만, 그것이 현실입니다. 융커들은 자신들의 기득권을 지키기 위해 저항할 것이고, 우리는 그 기득권을 몰수하기 위해 나설 뿐입니다."
 TRN_cooperation_with_junker: "융커와 협력"
 TRN_cooperation_with_junker_desc: "융커들은 이 지역을 가장 잘 이해하는 '이해자’이며, 우리에게는 그들의 협력이 절실합니다. 수많은 농지를 학원 소유로 환원시키기 위해서는 융커들과의 협력과 협상이 필요할 것입니다."
 TRN_revitalization_of_heavy_industry: "서부 공업화"
 TRN_revitalization_of_heavy_industry_desc: "토지 문제의 일부가 해결되면서, 이제 서부 지역의 광활한 대지를 본격적으로 활용할 수 있게 되었습니다. 덕분에 부족했던 공장 수를 채우기 위한 공업화 계획도 본격적으로 추진할 수 있습니다. 여기에 오데르 강을 통한 물자 수송 능력까지 더해진다면, 우리의 공업화는 한층 더 빠르게 가속될 것입니다."
 
 # 미카 루트
 TRN_Kyrie_for_the_forgotten_ones: "잊혀진 이들을 위한 키리에"
 TRN_Kyrie_for_the_forgotten_ones_desc: "최근 발생한 초자연적 사태와 함께 수면 위로 드러난 트리니티의 문제에 대해, 상투스와 필리우스 분파가 보여주는 나약한 해결 방식은 더 이상 트리니티를 위한 행동으로 보이지 않습니다. 반면 미소노 미카와 파테르 분파는 트리니티를 위기에서 구해낼 '메시아적 사명'을 지니고 있습니다."
 TRN_Kyrie_for_the_forgotten_ones_tt: "이 §Y선택지§!는 미소노 미카가 다가오는 §Y호스트 선거§!에서 무조건 §Y승리§!를 보장합니다."
 TRN_control_tea_party: "티파티 통제"
 TRN_control_tea_party_desc: "상투스 분파가 무너지며 키리후지 나기사 휘하의 필리우스 분파는 여전히 미소노 미카에 맞서는 몇 안되는 제도적 기둥 중 하나로 남았습니다. 운 좋게도 호스트 선출에서 파테르 분파의 미소노 미카가 당선 되면서 호스트 자리에 오르게 되었습니다. 키리후지 나기사에 대한 정치적 음모를 펼치는 것이 가능해졌습니다. 파테르 분파와 호스트의 권한이라면 키리후지 나기사는 굴복할 수밖에 없을 것입니다."
 TRN_Mika_basic_law: "미소노 미카 헌장"
 TRN_Mika_basic_law_desc: "현행 트리니티 헌법은 수백 년 전 제왕적인 호스트의 권력을 견제하고, 티파티와 호스트 간의 상호 견제를 바탕으로 하는 이상주의적 체제를 근간으로 하고 있습니다. 그러나 운명이 내린 축복 아래, 트리니티 대법원은 단순히 법적 체계를 유지하는 것에 그치지 않고, 파테르 분파와 미소노 미카의 지배가 트리니티 헌법이 인정하는 합법적인 체제임을 합리화해야합니다."
 TRN_secret_meeting_with_Sisterhood: "시스터후드와 비밀 회담"
 TRN_secret_meeting_with_Sisterhood_desc: "시스터후드는 오래전부터 티파티의 정치에 관여하지 않는 관행을 유지해왔지만, 이는 어디까지나 법적 구속이 아닌, 각 분파가 자발적으로 권리를 내려놓은 데에서 비롯된 것이었습니다. 그러나 정치적 지형이 급변한 지금, 그들이 앞으로도 계속 정치에 개입하지 않을 것이라는 보장은 어디에도 없습니다."
 TRN_necessary_revenge: "천사의 날개 꺾기"
 TRN_necessary_revenge_desc: "신헌법이 미소노 미카의 우위를 확고히 보장하는 만큼, 이제 다른 분파들을 방관해서는 안 됩니다. 상투스 분파와 필리우스 분파는 이미 무력화되었지만, 시간이 지나면 다시 힘을 회복할 가능성이 있습니다. 그렇기에 우리는 그들의 날개가 다시 움직이지 못하도록 확실한 조치를 취해야 합니다."
 TRN_necessary_revenge_tt: "이 중점은 §Y비파시즘§! 이념의 지지도를 낮출 일련의 §Y사건들§!을 촉발시킬 것입니다."
 TRN_solving_social_problems: "사회 문제에 대한 해결책"
 TRN_solving_social_problems_desc: "사회 문제를 해결하기 위해서는 독일 현지인들의 기본적 욕구를 적절히 관리해야 합니다. 그들의 요구를 완전히 충족시키는 것은 오히려 저항의 여력을 키울 수 있습니다. 적당한 결핍을 유지하여 내부 갈등을 유도하고, 그들이 우리에게 맞설 힘을 소진하도록 만들어야 합니다."
 TRN_denazification: "탈독일화"
 TRN_denazification_desc: "독일이라는 국가는 야만성을 뒤집어쓰고 사회를 스스로 후퇴시켰습니다. 우리는 이러한 독일의 야만성을 탈피하고 좀 더 선진적인 제도를 정착시켜야 합니다."
 TRN_dismantled_Nazi_organization: "나치즘 조직 해체"
 TRN_dismantled_Nazi_organization_desc: "당연한 말이겠지만, 나치즘을 표방하는 조직들은 더 이상 활개 치게 내버려둬서는 절대 안 됩니다. 이들은 처음에 대중을 대변한다는 어설픈 조직으로 시작했고 이후 대중 정당으로 거듭났습니다. 다시는 뿌리를 내리지 못하도록 철저히 뿌리 뽑아야 합니다."
 TRN_dismantled_Nazi_organization_tt: "$DECISION_NAME$에서 아래의 §Y사건§!이 더이상 발생하지 않음.\n$EVENT_0$\n$EVENT_1$\n$EVENT_2$\n$EVENT_3$\n$EVENT_4$\n$EVENT_5$"
 TRN_take_over_the_church: "트리니티 신앙 전도"
 TRN_take_over_the_church_desc: "독일 사회에서 기독교는 오랜 시간 동안 독일인의 영적 삶에 깊은 영향을 미쳐왔습니다. 그러나 이제는 트리니티의 신앙을 확산시키기 위해, 이러한 전통적 신앙의 영향력을 단계적으로 축소하고 그 자리를 트리니티의 새로운 교의로 대체해 나가야 합니다. 독일인의 영혼과 정신 세계마저 트리니티가 주도해야 합니다."
 TRN_limit_german_party: "독일 정당 활동 제한"
 TRN_limit_german_party_desc: "트리니티의 지역에서 활동하고 있는 독일 정당들은 언젠가 우리에게 큰 위협이 될지도 모릅니다. 특히 사회민주당과 중앙당 그리고 이들과 협력하고 있는 군소 정당들까지 세를 불리고 있으며 이들은 정치적인 목적으로 대중을 동원할 힘을 가지고 있습니다. 이들을 제한하는 것은 후환을 미리 제거하는 것입니다."
 TRN_expanding_censorship: "검열 체계 확대"
 TRN_expanding_censorship_desc: "독일 정당의 재기를 막기 위해 신분증 제도를 도입할 것입니다. 모든 현지인은 트리니티 내에서 활동하기 위해 신분증을 발급받아야 합니다. 발급 과정에서 개인의 신원과 이력을 확인하며, 과거 나치 협력 이력이나 의심스러운 활동 기록이 있는 인물을 선별할 수 있을 것입니다."
 TRN_new_law_for_germany_party: "독일 정당을 위한 새로운 법안"
 TRN_new_law_for_germany_party_desc: "독일 정당들을 완전히 범죄화하고 금지하기보다는 티파티 감찰관을 통해 감독 아래 합법적으로 존속시킬 것입니다. 실질적인 영향력은 대폭 축소되겠지만, 독일 현지인들의 불만을 완화하는 효과적인 방법이 될 수 있습니다."
 TRN_new_political_order: "새로운 정치 질서"
 TRN_new_political_order_desc: "우리는 독일 현지인들에게 투표권을 보장할 것입니다. 물론 이는 보통선거권과 같은 완전한 형태는 아닙니다. 통제된 독일 정당들을 활용하여 지방선거와 시장선거를 실시하는 방식입니다. 현지인들 역시 이러한 제한을 눈치챌 수 있어 불만이 제기될 가능성은 있습니다. 그러나 어쨌든 이는 우리가 일정 수준의 자치를 허용한다는 점을 보여주는 조치가 될 것입니다."
 TRN_absorb_the_reichsbanner_schwarz_rot_gold: "흑적금 국기단 해산"
 TRN_absorb_the_reichsbanner_schwarz_rot_gold_desc: "나치의 돌격대는 동쪽의 친위대가 무너지고 해산되었으며, 적색전선전사동맹 또한 북쪽의 공산당이 망명하자 똑같이 해산 절차를 밟게 되었습니다. 그러나 흑적금 국기단은 아직 명맥을 잇고 있습니다. 나치 정권의 박해를 받고도 살아남은 국기단의 운명을 이제 결정지어야 합니다."
 TRN_Kulturkampf_display_value_60_over_tt: "§Y트리니티 신앙§!이 우세를 차지 함."
 TRN_fate_of_german_culture: "정신에서의 혁명"
 TRN_fate_of_german_culture_desc: "트리니티와 독일의 문화는 근본적으로 다릅니다. 이 둘을 융합하기 위해서는 한쪽의 압도적인 우위가 필요합니다. 다행히도 현재 트리니티의 권위가 압도적으로 강한 상황입니다."
 TRN_fate_of_german_culture_trigger_tooltip: "§Y$TRM_appeasement_germany_modifier$§! 에서의 §Y$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$§! (이)가 [?TRM_propaganda_monthly_conscription_factor_trigger|R] 이상."
 TRN_second_trinity: "두 번째 트리니티"
 TRN_second_trinity_desc: "트리니티는 한때 위대한 제1차 공의회의 유산을 계승하였으나, 내분과 변절 속에서 그 유산을 스스로 훼손하였고, 결국 대전이 사태로 인해 붕괴되었습니다. 점차 파테르 분파만이 트리니티를 통합하고 부활시킬 수 있다는 사실이 분명해지고 있습니다. 학생들을 하나로 묶고, 무적의 의지와 파괴적인 힘으로 어떤 위협이든 꺾을 수 있도록 만드는 것. 그것이 곧 우리의 목표이자, 음모이며, 반드시 완수해야 할 사명입니다."
 TRN_intelligence_agency: "학원정보부 재편"
 TRN_intelligence_agency_desc: "끔찍했던 유리조노 세이아 암살 사건은 학원정보부가 제 역할을 다하지 못했다는 사실을 여실히 드러냅니다. 정보부장의 무능과 대응력 저하는 이미 명백히 입증되었습니다. 새로운 질서가 형성되는 이 세계에서 정보에서 뒤쳐진다는 것은 곧 죽음을 의미합니다."
 TRN_lend_eyes_and_ears: "눈과 귀를 빌리기"
 TRN_lend_eyes_and_ears_desc: "첩보전은 총이나 미사일 따위가 아니라 정보와 기술 그리고 심리전으로 싸우는 3차원적인 전투입니다. 우리는 정보 면에서 우위를 차지하기 위해 '하등 생물'의 눈과 귀를 빌릴 것입니다."
 TRN_cause_of_trinity: "트리니티의 대의"
 TRN_cause_of_trinity_desc: "많은 이들은 미소노 미카의 독재적 체제에 반감을 품고, 회의적인 시선으로 지켜보았습니다. 그러나 눈에 띄는 성과들이 나타나고, 트리니티가 실제로 위협에 처해 있음이 드러나며 타 학원들의 음모와 구 체제의 마지막 발악까지 더해지자 점차 '트리니티 사회주의'에 대한 여론도 호의적으로 바뀌기 시작했습니다. 트리니티는 이제 칠흑 같은 어둠을 지나, 새로운 항로를 향해 나아갈 것입니다."
 TRN_The_nature_of_the_united_front: "파테르 분파의 부상"
 TRN_The_nature_of_the_united_front_desc: "티파티의 정적들이 사라지고, 대부분의 의석을 파테르 분파가 차지했습니다. 이제 파테르 분파는 단순한 분파의 틀을 넘어, 더 넓은 대중과 학생들을 위한 분파로 거듭나야 합니다."
 TRN_academy_defense_force: "학원방위대 창설"
 TRN_academy_defense_force_desc: "학원방위대는 대중을 동원하기 위해 창설한 준군사조직입니다. 하얀 제복을 입고 활동하는 이들은 미소노 미카에게 절대적인 충성을 바치는 이들을 모집했습니다. 이들은 트리니티 내부의 숙적에 맞서 싸우며, 미소노 미카의 명령이 있으면 어디든 투입할 수 있습니다."
 TRN_cooperation_with_suzumi: "자경단에 협력 제안"
 TRN_cooperation_with_suzumi_desc: "모리즈키 스즈미가 운영하고 있는 비공식 동아리인 트리니티 자경단은 느슨한 조직 체제를 갖추고 있지만 그 실체는 분명히 존재합니다. 구호기사단과 정의실현부도 이미 자경단의 존재를 어느 정도 인정하고 협력하고 있는 상황입니다. 이들을 공식적으로 학원방위대와 비슷한 위치로 격상시키는 것은 어떨까요?"
 TRN_cult_of_Mika: "대천사 숭배"
 TRN_cult_of_Mika_desc: "트리니티는 지난 세월 동안 불안정한 민주주의 속에서 방황해왔습니다. 수많은 철인들이 등장하여 트리니티를 이끌었으나, 불안정한 체제는 결국 그들의 한계를 드러내며 붕괴를 맞이했습니다. 그 붕괴의 여파는 트리니티에 재앙으로 닥쳤지만, 쓰라린 상처를 극복하고 트리니티를 부흥시킬 힘을 지닌 유일한 인물은 오직 미소노 미카뿐입니다."
 TRN_cult_of_Mika_tt: "§M사건은 미소노 미카가 대중에게 스스로를 어떻게 묘사할지 그리고 그에 따르는 보너스를 선택할 수 있는 기회를 제공할 것입니다.§!"
 TRN_those_who_lead_those_who_follow: "이끄는 자와 따르는 자"
 TRN_those_who_lead_those_who_follow_desc: ""
 TRN_new_trinity_culture: "트리니티 신문화"
 TRN_new_trinity_culture_desc: "트리니티의 문화는 지나치게 사치스럽고 퇴폐적입니다. 수백 년간 평화가 지속되었음에도 트리니티가 실질적 발전을 이루지 못한 근본 원인은 이 문화적 퇴보에 있습니다. 우리는 타락한 문화를 단호히 거부하고 전위적이며 이념적으로 명확한 문화 예술을 육성해야 합니다. 새로운 시대에 걸맞은 문화야말로 트리니티를 다시 일으켜 세울 원동력입니다."
 TRN_new_trinity_culture_tt: "§Y결과는 중점 중에 발생한 사건에 따라 달라질 것입니다.§!"
 TRN_support_justice_task_force: "정의실현부 규모 확대"
 TRN_support_justice_task_force_desc: "정의실현부는 트리니티를 지키는 방패 중 하나입니다. 전트리니티의 치안을 담당하고 있지만 그들에게 주어진 자원은 그리 많지 않습니다. 우리는 이들과 협력하고 충분한 지원 하에 정의실현부를 온전히 길들일 것입니다."
 TRN_alliance_of_faith: "신앙과 동맹"
 TRN_alliance_of_faith_desc: "트리니티 가톨릭이 트리니티 문명의 핵심적인 부분이라는 점은 부정할 수 없습니다. 파테르 분파는 모든 종교의 신도들을 포용하고자 하지만 가톨릭과의 편리한 동맹은 평범한 트리니티 학생들과 독일인들의 마음속 깊이 자리 잡은 강력한 동맹이 될 것입니다."
 TRN_new_order_movement: "신체제운동"
 TRN_new_order_movement_desc: "파테르 분파 내부의 과열된 이념 투쟁을 종료하기 위해서는 호스트의 직접적인 개입이 필요합니다. 이념주의자와 협동주의자 모두 이러한 선택에 반발할 것입니다. 하지만 이념 대립 이전에 그들은 모두 대천사의 추종자라는 공통된 정체성을 지니고 있습니다. 따라서 호스트의 결정에 대한 실질적인 저항은 제한적일 것으로 예상됩니다."
 TRN_Fourth_Reich: "기사단국 선언"
 TRN_Fourth_Reich_desc: "기사단국의 선포는 어쩌면 스스로의 모순일 수도 있습니다. 그러나 트리니티는 그 모순을 외면하거나 두려워하지 않습니다. 트리니티의 특수성과 외부 정세의 급변이 맞물리며 탄생한 기사단국은, 강력한 동맹이자 정신적 기반으로서 트리니티 고유의 뿌리를 기꺼이 받아들이고 있습니다."
 TRN_student_solidarity: "학생 연대 강화"
 TRN_student_solidarity_desc: "트리니티의 근간이자 뿌리인 '학생 연대'는 기독교적 교리와 가치를 바탕으로 점차 확대되어 왔습니다. 이 사회는 전능한 폭군에 대한 맹목적인 복종이 아닌, 정의와 연대, 자유와 법치를 통해 이루어지는 학생들의 자율적 조직 위에 번영을 이룹니다. 트리니티의 학생들은 언제나 그러한 사회를 꿈꿔왔습니다. 그것은 특정 계급이나 분파가 아닌, 기독교적 사랑이라는 원칙 위에 세워진 공동체입니다."
 TRN_jewel_of_the_trinity_faith: "트리니티 신앙의 보석"
 TRN_jewel_of_the_trinity_faith_desc: "트리니티의 신앙에는 시스터후드가 중추적인 역할을 맡고 있습니다. 시스터후드가 트리니티의 사회에서 수행하는 역할의 중요성을 인식하고, 좀 더 많은 곳에 긍정적인 영향을 끼칠 수 있어야 합니다."
 TRN_improving_JTF: "정의실현부 비효율성 제거"
 TRN_improving_JTF_desc: "거대해진 학원 부지와 더불어 정의실현부는 미소노 미카의 전폭적인 지원 아래 크게 확장되었습니다. 하지만 그만큼 비효율성과 경직성도 함께 커졌습니다. 이러한 문제를 하네카와 하스미가 중심이 되어 개선해 나갈 것입니다."
 TRN_Integrity_of_Trinity: "트리니티의 무결성"
 TRN_Integrity_of_Trinity_desc: "수백 년 전의 적을 꺾고 탄생한 미소노 미카의 ‘두 번째 트리니티’는, 모든 일반 학생들이 하나로 뭉쳐 이루어낸 유기체와도 같은 존재입니다. 이 새로운 트리니티는 과거의 영광에 얽매이지 않고, 현재의 필요를 직시하며, 위대하고 메시아적인 미래를 향해 나아갈 것입니다. 세계가 정신적 계몽의 새로운 시대로 나아가도록 이끄는 것 그것이 바로 트리니티의 사명입니다."
 TRN_codification_of_regime: "정권 성문화"
 TRN_codification_of_regime_desc: "파테르 분파는 학원이라는 수레를 끄는 한 마리의 말이며, 미소노 미카는 그 수레의 기수입니다. 이제 더 이상 불안정한 의사결정도, 갈피를 잡지 못한 방황도 없을 것입니다. 공동체와의 협력은 유례없는 수준으로 공고해졌고, 우리는 이를 바탕으로 학생들과 국민 모두에게 보다 안정적이고 풍요로운 삶을 제공할 사명을 띠고 있습니다. 이것은 선택이 아니라, 우리 모두에게 주어진 시대적 사명입니다."
 TRN_supreme_leader: "최고지도자"
 TRN_supreme_leader_desc: "이념주의자들이 말이 옳았습니다. 협동주의자들은 트리니티를 내부에서 부터 붕괴 시키려는 목적 아래에 단결한 배신자들이었습니다. 미소노 미카는 마침내 '지도자'라는 허울을 벗은 채, 새로운 차원의 존재로, 그리고 숙명처럼 도래한 폭군으로 다시 태어날 것입니다."
 TRN_horseman_of_the_apocalypse: "묵시록의 기수"
 TRN_horseman_of_the_apocalypse_desc: "트리니티는 더 이상 단순한 학원이 아닙니다. 그것은 살아 숨 쉬는 유기체이며, 종말을 몰고 오는 말과도 같은 존재입니다. 그리고 그 위에 올라탄 기수, 바로 대천사 미소노 미카께서는 정복자이자 황제, 전쟁의 상징이십니다. 트리니티는 죽음이며, 미카는 그 죽음을 인도하는 영광의 기수입니다."
 TRN_project_trinity: "성삼위일체 계획"
 TRN_project_trinity_desc: "성삼위일체 계획은 트리니티 종합학원에서 추진 중인 가장 비밀스럽고 강력한 프로젝트입니다. 이 계획의 핵심은 기존에 보유하던 미사일 기술을 역설계하여 새롭게 개발된 중거리 탄도미사일에 있습니다. 이 미사일은 총 6개의 탄두를 탑재하고 있으며, 낙하 시 각 탄두가 독립적으로 목표를 타격하도록 설계되어 있습니다."
 TRN_destiny_of_trinity: "트리니티의 운명"
 TRN_destiny_of_trinity_desc: "트리니티의 사명은 단지 스스로를 구하는 데 그치지 않습니다. 그것은 키보토스 전체를 구원하기 위한 것입니다. 증오로 가득 찬 지구 현지인들과, 역병처럼 퍼진 온갖 이념들은 제쳐두고 우리는 이 모든 증오를 뿌리 뽑아야 하는 도덕적 사명을 지니고 있습니다. 이제 다음, 그리고 마지막 전쟁을 위한 준비가 시작될 것입니다. 영웅이 쓰러지고, 어둠이 걷힌 그 끝자락 스러져가는 여명의 빛 속에서 우리는 또 하나의 아름다운 신세계를 건설해야 합니다."
 TRN_sheep_and_shepherd: "양떼와 목자"
 TRN_sheep_and_shepherd_desc: "양떼와 목자는 서로에게 없어서는 안 될 존재입니다. 유목의 길에는 언제나 양떼가 필요하고, 양떼는 늘 목자의 보호를 필요로 합니다. 대천사 미소노 미카는 자신의 양떼를 위해 기꺼이 목숨을 내놓을 각오가 되어 있으며, 그들에게 사랑과 헌신으로 보살핌을 아끼지 않습니다. 양떼는 목자의 인도 아래에서 안식과 평화를 얻고, 행복한 삶을 영위하게 될 것입니다. 이는 믿음과 책임으로 맺어진 성스러운 유대입니다.."

 TRN_eden_accord: "에덴 협정 형성"
 TRN_eden_accord_desc: "대전이 사태는 트리니티의 이상주의적 세계관을 철저히 무너뜨렸고, 그 여파로 트리니티는 점차 급진적인 노선을 걷게 되었습니다. 그러나 혼란 속에서 등장한 미소노 미카는 무너진 신념의 폐허 위에 다시금 ‘트리니티적 세계'를 약속했습니다. 총학생회의 키보토스 연합과는 다른, 오직 트리니티만의 고유한 세계관을."
 TRN_collaboration_with_hyakkiyako: "[HYA.GetAdjective] 측과 협력"
 TRN_collaboration_with_hyakkiyako_desc: "트리니티는 백귀야행과 이전부터 긴밀한 협력 관계를 유지해왔습니다. 그러나 사태와 최근의 정치적 변화 속에서도 이러한 협력 관계가 여전히 유지되고 있는지 재확인할 필요가 있습니다."
 tooltip_TRN_collaboration_with_hyakkiyako_trigger: "§Y[HYA.GetNameWithFlag] 체제§!가 유지 되고 있음."
 TRN_establish_a_customs_union: "경제 연합 수립"
 TRN_establish_a_customs_union_desc: "트리니티가 주도하고 있는 세력은 각 학원과 국가 사이의 단순한 우호 관계가 아니라 훨씬 긴밀한 동맹 관계를 형성하고 있습니다. 세력권 내에서 경제 연합을 수립하여 더욱 긴밀한 경제 협력을 이끌어낼 것입니다."
 TRN_divine_mandate: "신성통치령 계획"
 TRN_divine_mandate_desc: "‘신성통치령’이라는 개념은 본래 트리니티 종합학원이 각지의 부지를 효율적으로 관리하기 위해 설립한 총독 체제에서 유래하였습니다. 이 개념은 트리니티가 정복한 영토들을 효율적으로 관리하기 위해서 일부 수정을 거친 뒤 실행 될 것입니다."
 
 TRN_impossible_to_coexist: "공존할 수 없는 자들"
 TRN_impossible_to_coexist_desc: "게헨나와의 전쟁은 트리니티에게 있어 피할 수 없는 숙명입니다. 이는 과거 선조들이 입었던 상처에 대한 복수이자, 전 트리니티를 위한 성전에 해당합니다. 그러나 그러한 숙명적인 전쟁조차도 철저한 준비 없이는 성공할 수 없습니다. 현재 ‘성 미카엘’이라는 암호명 아래 추진 중인 서부를 향한 대공세는, 키보토스 역사상 유례없는 규모의 작전으로 계획되고 있으며, 정밀한 전략과 작전 구상이 그 어느 때보다 요구되고 있습니다."
 TRN_Fifth_Column: "게헨나 지역 불안정화"
 TRN_Fifth_Column_desc: "혐오스럽군"
 TRN_spiritual_warfare: "영적 전쟁"
 TRN_spiritual_warfare_desc: "드디어 트리니티의 굴욕을 되갚아줄 때가 되었습니다. 게헨나의 만마전과 선도부는 이 곳 이계에서 무너질 것이고, 우리는 게헨나의 부지 전체에 우리의 깃발이 휘날릴 때까지 쉬지 않을 것입니다. 위대한 [TRM.GetName]이여, 최후의 투쟁을 위해 일어나라!"
 TRN_alliance_with_devil: "...악마와 동맹?"
 TRN_alliance_with_devil_desc: "흥신소는 최근 만마전을 불법 정부로 규정하고, 스스로를 ‘최후의 게르만 국가’라 칭하며 게헨나는 물론, 모교인 트리니티까지 영유권을 주장하고 나섰습니다. 겉보기에는 분명 우리의 적처럼 보일 수 있지만, 현실은 조금 더 복잡합니다. 그들이 만마전이라는 장애물을 넘기 전까지는, 우리와의 이해관계가 일시적으로 일치할 수 있습니다. 그런 점에서, 이들과의 한시적인 동맹은 충분히 고려할 만합니다."
 # 붉은겨울 외교
 TRN_northern_kivotos_diplomacy: "북방 외교"
 TRN_northern_kivotos_diplomacy_desc: ""
 TRN_denmark_or_war: "덴마크 요구"
 TRN_denmark_or_war_desc: ""
 TRN_use_of_nordic_association: "노르드 협회 이용"
 TRN_use_of_nordic_association_desc: ""
 # 아리우스
 TRN_catch_tail: "꼬리 잡기"
 TRN_catch_tail_desc: "학원정보부의 노력 끝에, 트리니티 종합학원에 숨어 있던 반역 분자들이 드러났습니다. 이들은 조용히 우리 학원을 갉아먹으며, 기회만 되면 등 뒤에 칼을 꽂을 준비를 하고 있었습니다. 그러나 그들의 계획은 여기서 끝입니다. 정의실현부와 학원정보부는 단호한 조치로 이들을 뿌리까지 박멸할 것입니다."
 TRN_religious_conversion: "'개종'"
 TRN_religious_conversion_desc: "아리우스 출신 인물 중 특히 하카리 아츠코는 트리니티와의 화평을 적극적으로 주장해 온 인물로, 이는 그녀가 속한 스쿼드 내에서의 갈등으로도 드러났습니다. 트리니티는 그녀의 '전향'을 긍정적으로 평가하며, 이를 계기로 아리우스와의 수백 년에 걸친 원한을 마침내 씻어낼 준비가 되어 있습니다."
 TRN_chasing_the_bandit: "도적 쫓기"
 TRN_chasing_the_bandit_desc: "아리우스 스쿼드는 전쟁이 끝난 뒤에도 끈질기게 저항을 이어가고 있습니다. 특히 단치히 주변의 트리니티 학생들이 피해를 입는 사례가 보고되고 있습니다. 이러한 무리들은 정의실현부와 자경단을 파견해 해결해야 할 문제입니다"
 TRN_annex_the_bandit_states: "제 1차 공의회의 유산"
 TRN_annex_the_bandit_states_desc: "제1차 공의회에서 아리우스 분파는 통합을 거부했습니다. 그러나 그렇다고 해서 그들을 매몰차게 대할 이유는 없습니다. 제1차 공의회가 남긴 진정한 유산은 무엇입니까? 그것은 통합이자 단결입니다. 우리는 이 정신을 이어받아 아리우스 학생들을 받아들이고, 미완성 상태로 수백 년간 방치되었던 공의회를 다시 열어 '진정한 의미의' 전트리니티 통일을 선언할 것입니다."
 TRN_arius_tactic: "CQB 연구부"
 TRN_arius_tactic_desc: "아리우스 학생들이 보여준 CQB(근접 전투 체계)가 트리니티 학생들을 매료시켰고, CQB 연구부가 창설되었습니다. 아리우스 학생들이 부장직을 맡게 되었습니다. 아리우스 학생들의 실전 경험을 활용하고 특수부대 전력을 강화하기 위해서는 이 연구부가 반드시 필요합니다."

 # 전쟁 이후 외교
 TRN_union_with_gehenna: "우리들의 에덴 조약"
 TRN_union_with_gehenna_desc: "총학생회장이 트리니티와 게헨나 간에 추진했던 평화 협정, 이른바 '에덴 조약'은 이미 오래전에 그 의미를 잃었습니다. 그러나 이제 상황은 완전히 달라졌습니다. 트리니티가 게헨나를 점령한 지금 다시금 '에덴 조약'이라는 이름을 역사 속에서 꺼내들 순간이 다가오고 있습니다. 이번에는 더 이상 허울뿐인 평화가 아닙니다. '트리니티 방식'의 에덴 조약—그것은 굴복과 통합, 그리고 완전한 지배를 뜻할 것입니다."
 TRINITY_WON_THE_GEHENNA: "§Y[TRM.GetNameWithFlag]§! 측이 §Y에덴 결전§!에서 승리"
 TRN_magdeburg_trials: "마그데부르크 군사재판"
 TRN_magdeburg_trials_desc: "마그데부르크에서 열릴 군사재판은 전쟁 범죄를 처벌하는 장소가 아닙니다. 트리니티의 군사적 승리를 과시하고 적들에게 굴욕감을 안기기 위한 정치적 서커스에 가깝습니다. 재판부는 특히 저항이 거센 선도부원들과 일부 게헨나 동아리를 집중적으로 표적 삼을 예정입니다."
 TRN_forcibly_disband_HSD: "온천개발부 치안출동"
 TRN_forcibly_disband_HSD_desc: ""
 TRN_forcibly_disband_GRS: "미식연구회 강제 해산"
 TRN_forcibly_disband_GRS_desc: ""
 TRN_reduce_authority_of_pandemonium_society: "만마전 대체"
 TRN_reduce_authority_of_pandemonium_society_desc: "만마전은 게헨나를 통치하던 집단입니다. 이처럼 거대한 학원을 통치하던 기구가 하루아침에 사라지면 심각한 혼란이 발생합니다. 우리는 만마전을 인수해 트리니티의 게헨나 영토 통치 기구로 재편할 것입니다."
 TRN_incorporate_EMC_into_RC: "응급의학부 조직 통합"
 TRN_incorporate_EMC_into_RC_desc: "응급의학부는 게헨나의 히무로 세나를 주축으로 모인 응급 구조 조직입니다. 응급의학부는 사태 이전부터 트리니티 구호기사단과 꽤 친밀한 관계를 유지해왔습니다. 전쟁을 통해 우리가 게헨나를 병합한 만큼, 응급의학부는 공식적으로 구호기사단 산하 조직으로 편입될 것입니다."
 TRN_inclusion_SLC: "급양부 포섭"
 TRN_inclusion_SLC_desc: "전후 처리를 위해서 급양부의 도움이 필요합니다."
 TRN_defiance_of_COU: "총학생회 권위에 대한 도전"
 TRN_defiance_of_COU_desc: "총학생회는 새로운 세계에서 그 무능함을 여실히 드러냈으며, 총학생회장의 실종과 그 이후 연이어 발생한 사건들은 학생회에 대한 신뢰를 뿌리째 흔들어 놓았습니다. 더 이상 이러한 권위는 트리니티 위에 군림할 수 없습니다. 우리는 이에 맞서, 그들에 대한 저항으로서 역성혁명을 일으킬 것입니다."
 TRN_extinguish_the_flame: "불꽃 끄기"
 TRN_extinguish_the_flame_desc: "밀레니엄은 여전히 모교에 중대한 위협이 되고 있으며, 그들의 기술력은 마치 우리의 턱 밑에 칼날을 들이대는 형국입니다. 이와 같은 기술 패권은 더 이상 묵과할 수 없으며, 반드시 제어되어야 합니다."
 TRN_divine_mandate_west_kivotos: "서키보토스 재편"
 TRN_divine_mandate_west_kivotos_desc: ""
 TRN_invasion_kaiser: "[KAI.GetNameDef] 체제 해체"
 TRN_invasion_kaiser_desc: ""
 TRN_TrinityMikaDiplomacySpainAttack: "지브롤터 확보"
 TRN_TrinityMikaDiplomacySpainAttack_desc: ""
 TRN_ultimatum_to_wild_hunt_academy: "와일드헌트의 복종 요구"
 TRN_ultimatum_to_wild_hunt_academy_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_4: "외키보토스 신성통치령"
 TRN_TrinityMikaDiplomacyItalyAttack_4_desc: ""
 TRN_threat_from_the_east: "동쪽의 위협"
 TRN_threat_from_the_east_desc: "동방의 [SOV.GetAdjective] 세력은 모교에 커다란 위협이 되어가고 있습니다. 특히 이전부터 [SOV.GetAdjective] 세력은 우리의 적을 지원하고 내부에서 선전 선동을 벌이며 모교의 분열을 꾀해온 거대한 악입니다."
 TRN_balkan_dip: "발칸 외교"
 TRN_balkan_dip_desc: "동방의 거대한 적에 대항하기 위해서는 발칸 국가들의 협력이 필요합니다. 이들은 주로 반[SOV.GetAdjective] 성향을 지니고 있으며, 이를 활용해 접근한다면 든든한 동맹 관계를 맺을 수 있을 것입니다."
 TRN_winter_warfare: "겨울 준비"
 TRN_winter_warfare_desc: "[SOV.GetAdjective] 세력의 영토는 혹독한 추위가 지배하고 있습니다. 특히 여러 차례 조사한 결과, 기초적인 수준의 방한복으로는 전투조차 불가능하다는 사실을 확인했습니다. 새로운 전장에 적응하기 위해 특수 제작한 방한복과 각종 장비를 우리 군대에 제공할 것입니다."
 TRN_conscription_of_polish_nationalists: "폴란드 민족주의자 모집"
 TRN_conscription_of_polish_nationalists_desc: "폴란드는 러시아로부터 독립한 지 몇십 년 지나지 않은 신생 공화국이었습니다. 그러나 다시 한 번 러시아라는 거대한 위협에 억눌리고 있는 폴란드 민족주의자들을 모집해 [SOV.GetAdjective] 측의 전쟁 수행력을 깎고, 거대한 악을 타도할 동맹을 만들어야 합니다."
 TRN_polish_autonomous_state: "폴란드 자치국"
 TRN_polish_autonomous_state_desc: "폴란드인들의 활약은 눈부셨고 그들만의 국가를 설립할 자격이 충분해 보였습니다. 트리니티의 지원 아래 무너진 폴란드 폐허를 복구하고 집안을 다시 세울 수 있도록 우리의 지원 아래 폴란드인들은 자치 국가를 설립할 것입니다."
 TRN_poland_divine_mandate_focus: "동남트리니티 신성통치령"
 TRN_poland_divine_mandate_focus_desc: "폴란드인들은 속았습니다. 이계에서 온 자를 쉽게 믿으리라고 누가 예상했겠습니까? 폴란드는 트리니티의 전문가들에게 맡겨져 사회, 정치 등 모든 부분에서 개조될 것입니다. 개조가 끝난 뒤에는 트리니티의 동방을 막아내고 책임지는 새로운 방패로 거듭날 것입니다."
 TRN_destruction_of_soviet_hegemony: "소비에트 패권 분쇄"
 TRN_destruction_of_soviet_hegemony_desc: "동방의 붉은 위협에 대응하기 위한 준비가 마침내 완료되었습니다. [SOV.GetAdjective] 측은 오랫동안 우리의 적을 지원하고 내부 분열을 조장하며 모교를 위협해왔습니다. 이제 그 대가를 치를 시간입니다."
 TRN_baltic_unrest: "숲의 형제단"
 TRN_baltic_unrest_desc: "발트 국가들은 [SOV.GetAdjective]의 폭력에 무릎을 꿇었습니다. 하지만 그것도 이제 끝입니다. 우리는 발트 민족들을 지원해 그들이 봉기하도록 독려할 것입니다. 이들은 혼자 싸우는 것이 아닙니다. 우리와 함께 싸우며 독립을 쟁취할 것입니다."
 TRN_anti_soviet_resistance: "반소비에트 의용군 모집"
 TRN_anti_soviet_resistance_desc: "정보부에 따르면 [SOV.GetAdjective] 내부에는 아직 반정부 성향을 가진 저항군들이 일부 존재한다는 사실을 확인했습니다. 우리는 이들을 포섭해 우리 군대에 협력하도록 적절한 대가를 제공할 수 있을 것입니다."
 TRN_ukrainian_unrest: "우크라이나 동요"
 TRN_ukrainian_unrest_desc: "우크라이나에는 1930년부터 활동한 민족주의 조직이 존재하고 있습니다. 이들은 독립이라는 명분 아래 테러리즘과 암살을 서슴지 않았으며, 그 과정에서 무고한 민간인들조차 희생시켰습니다. 우리의 가치관으로는 도저히 용납할 수 없는 잔인하고 야만적인 집단이지만, 아이러니하게도 지금은 우리와 같은 적을 마주하고 있습니다. 적의 적을 아군으로 삼는다는 말이 있듯이, 그들의 더러운 과거를 잠시 눈감아줄 수도 있지 않겠습니까?"
 TRN_belarusian_volunteer_corps: "벨라루스 협력자 모집"
 TRN_belarusian_volunteer_corps_desc: "벨라루스의 협력자들은 주로 트리니티에 협력하기로 결정한 자들입니다. 이들에게 신념이란 존재하지 않으며, 그저 권력과 이익에 따라 움직이는 천박한 기회주의자들에 불과합니다. 하지만 그들의 비굴함이 우리에게 유용하다면, 굳이 마다할 이유는 없지 않겠습니까? 협력하겠다는 자들을 스스로 내쫓을 만큼 우리가 어리석지는 않습니다."
 TRN_eastern_divine_mandate: "동방 신성통치령"
 TRN_eastern_divine_mandate_desc: "[SOV.GetAdjective] 측의 광대한 동방 영토는 트리니티 행정이 감당하기 어렵습니다. 그렇기에 주로 티파티의 전문가들과 현지인, 그리고 군인들이 모여 설립한 군민행정부를 중심으로 이 지역에 새로운 정부를 세울 것입니다."
 TRN_TrinityMikaDiplomacyAttackSwiss: "[SWI.GetNameDef] 침공"
 TRN_TrinityMikaDiplomacyAttackSwiss_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack: "남쪽 위협 주시"
 TRN_TrinityMikaDiplomacyItalyAttack_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_2: "[ITA.GetAdjective] 위험 분쇄"
 TRN_TrinityMikaDiplomacyItalyAttack_2_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_3: "산악전"
 TRN_TrinityMikaDiplomacyItalyAttack_3_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_6: "이계 신앙으로부터의 승리 선언"
 TRN_TrinityMikaDiplomacyItalyAttack_6_desc: ""
 TRN_divine_mandate_italy: "이탈리아 신성통치령"
 TRN_divine_mandate_italy_desc: ""


 # 나기사 루트
 TRN_unprovable_problem: "증명 불가능한 문제"
 TRN_unprovable_problem_desc: "증명 불가능한 문제. 현 트리니티의 상황을 한 문장으로 압축시킨 다면 이 문장이 가장 어울릴 것입니다. "
 TRN_unprovable_problem_tt: "이 §Y선택지§!는 키리후지 나기사가 다가오는 §Y호스트 선거§!에서 무조건 §Y승리§!를 보장합니다."
 TRN_victory_of_intra_party_democracy: "분파 민주주의의 승리"
 TRN_victory_of_intra_party_democracy_desc: "키리후지 나기사는 트리니티의 헤게모니를 장악했습니다. 그러나 그녀는 완전한 일인 지배가 아닌, 그녀의 분파인 필리우스와 다른 분파들의 조화를 통하여 국정을 운영해 나가고자 합니다. 의심에 한 발을 올린 채, 협력이라는 미래로 한 걸음을 내딛습니다."
 TRN_victory_of_intra_party_democracy_tt: "필리우스 분파의 사회적 영향력을 나타내는 §Y권력의 균형§! 시스템이 개방됩니다."
 TRN_absorb_sanctus_faction: "상투스 분파 흡수"
 TRN_absorb_sanctus_faction_desc: "세이아 이후 카리스마를 잃어버린 상투스 분파는 혼란에 빠진 상태입니다. 우리는 상투스 분파의 지도자인 $TRN_Natsuki_Kato$와 만나 필리우스로의 통합을 제안할 것입니다. 물론, 그녀들이 거절할 가능성은 별반 없을 것입니다."
 TRN_support_various_factions: "중립 분파에 손을"
 TRN_support_various_factions_desc: "중립적인 입장을 갖고 있는 파벌들에게도 협력을 요청합니다. 특히, 요한 분파에게 의료 시설의 확충을 약속하는 대신, 다소의 협력을 제안할 수 있을 것입니다."
 TRN_prioritize_filius: "필리우스 단결 우선"
 TRN_prioritize_filius_desc: "대전이 이후 혼란과 정치적 암투 속에서 일부 필리우스 분파 임원들은 파테르로 소속을 옮기기도 했었습니다. 그녀들에게 과거를 잊을 테니 필리우스 분파로의 복귀를 지시합시다."
 TRN_repromote_eden_treaty: "나기사-아코 회담"
 TRN_repromote_eden_treaty_desc: "[TRN_repromote_eden_treaty_desc]"
 TRN_repromote_eden_treaty_desc_generic: "총학생회장이 꿈꾼 에덴 조약의 횃불은 대전이라는 바람 앞에서도 꺼지지 않았습니다. 우리는 가까운 시일 안에 [GEH.GetName]의 선임행정관인 아코를 트리니티로 초대하여, 두 학원의 공동 치안 유지를 위한 합동치안조직의 설립을 논의할 것입니다. 물론 [GEM.GetName]의 반발이 예상되지만, 감당할 수 있는 문제입니다." # 기본
 TRN_repromote_eden_treaty_desc_alt: "총학생회장이 꿈꾼 에덴 조약의 횃불은 대전이라는 바람 앞에서도 꺼지지 않았습니다. 우리는 가까운 시일 안에 [GEH.GetName]의 선도부장인 아코를 트리니티로 초대하여, 두 학원의 공동 치안 유지를 위한 합동치안조직의 설립을 논의할 것입니다. 물론 [GEM.GetName]의 반발이 예상되지만, 감당할 수 있는 문제입니다." # 아코가 지도자일 경우
 TRN_repromote_eden_treaty_tt: "£decision_icon_small §Y$TRN_prefect_team_discipline_decline$§! 결정이 영구적으로 잠깁니다." 
 TRN_capriccioso_ruling_the_sora: "하늘을 지배하는 Capriccioso"
 TRN_capriccioso_ruling_the_sora_desc: "에덴 조약의 재수립을 위하여 가장 위협적인 적은 트리니티에 적대적인 [GEM.GetNameDef]의 영구적인 분쇄입니다. 우리는 그들에 대해 조사하고, [GEM.GetLeader]의 위협으로부터 에덴 조약을 보호해야만 합니다."
 TRN_hanuma_line: "하누마 라인"
 TRN_hanuma_line_desc: "우리는 [GEH.GetName] 측과 공조하여 [GEM.GetName]의 전쟁 기계들이 우리 영토로 진입할 수 없도록, 국경 지대를 요새화하는 방안에 대해 공동으로 논의하고 있습니다. 맞닿은 영토가 너무 길기 때문에 모든 지역에 마지노선 같은 웅장한 요새를 설치할 수는 없습니다. 하지만 중요 거점에 설치되는 요새망은 충분한 효과를 발휘할 것입니다."
 TRN_affettuoso_looking_up_to_the_sora: "하늘을 우러르는 Affettuoso"
 TRN_affettuoso_looking_up_to_the_sora_desc: "에덴 조약의 재수립을 위하여 가장 신뢰할 수 있는 상대는 [GEH.GetNameDef] 측입니다. 우리는 [GEH.GetLeader]와의 접촉을 계속 이어가는 한편, 에덴 조약의 성공을 위하여 선도부에 합리적인 선에서 지원을 이어갈 것입니다."
 TRN_start_of_the_eden_treaty_negotiations: "에덴 조약 재협상 시작"
 TRN_start_of_the_eden_treaty_negotiations_desc: "새로운 에덴 조약 재협상이 시작되었습니다. 이번 에덴 조약 재협상의 가장 중대한 점은, 판데모니움 소사이어티를 공동의 적으로 규정한 채 트리니티와 [GEM.GetName] 측과의 배타적인 평화 협상이 이루어질 것이라는 점입니다. 협상이 성공한다면, 우리는 게헨나의 적을 판데모니움 하나로 압축할 수 있습니다."
 TRN_start_of_the_eden_treaty_negotiations_tt: "[TRM.GetName]-[GEH.GetName] 사이의 상호간 국가 연합기구인 에덴 조약기구 설립을 위한 £decision_icon_small §Y에덴 조약§!이 시작됩니다. [GEM.GetName], 파테르 파벌은 이를 방해할 수 있습니다."
 TRN_union_of_two_academies: "학원간 연방제 통일안"
 TRN_union_of_two_academies_desc: "판데모니움 소사이어티가 붕괴하면서 두 학원 사이의 평화가 찾아왔습니다. 두 학원 사이의 관계성이 극도로 친밀해짐에 따라 우리는 선도부와의 통합을 추진하고자 합니다."
 TRN_union_of_two_academies_tt: "만약 그들이 승인한다면, [GEH.GetNameDef] 측과 평화적으로 통일합니다."
 TRN_war_of_good_and_evil: "선과 악의 전쟁"
 TRN_war_of_good_and_evil_desc: "게헨나에서 일어난 내전에서 우리가 어느 쪽을 지원해야 하는 것인지는 명백합니다."
 TRN_technology_exchange_agreement: "트리니티-게헨나 전차 기술 공유"
 TRN_technology_exchange_agreement_desc: "선도부와 우리 사이의 평화적인 행보가 진행됨에 따라, 우리는 그들과 더 많은 것들을 공유할 수 있게 되었습니다."
 TRN_technology_exchange_agreement_tt_1: "만약 §Y[TRM.GetAdjective]§! 측이 §Y중형전차§! 기술을 연구한다면, §Y[GEH.GetAdjective]§! 측은 이에 대한 라이센스를 얻게 됩니다."
 TRN_technology_exchange_agreement_tt_2: "만약 §Y[GEH.GetAdjective]§! 측이 §Y중형전차§! 기술을 연구한다면, §Y[TRM.GetAdjective]§! 측은 이에 대한 라이센스를 얻게 됩니다."
 TRN_nagisa_constitution_discussion: "첫 번째 트리니티"
 TRN_nagisa_constitution_discussion_desc: "파테르 분파가 주장하던 '두 번째 트리니티'는 없습니다. 필리우스의 내부 혼란을 잠재운 나기사는 새로운 공의회를 열어 그녀가 세우고자 하는 올곧은 질서를 명문화하고자 합니다. 나기사는 호스트의 불안정한 1년 임기를 3년으로 연장하고, 무제한으로 연임 가능하도록 개정할 것입니다. 그 이상의 논의가 이루어 질 수도 있고요."
 TRN_nagisa_constitution_discussion_tt: "이 중점은 트리니티 각 분파가 참여하는 §Y공의회§!와 관련된 일련의 사건들을 촉발시킵니다. 나기사는 트리니티의 종교 문제에 있어서 온건하거나 급진적인 방안을 선택할 수 있습니다."
 TRN_nagisa_constitution_discussion_warning_tt: "§R경고§!: $TRN_nagisa_meeting_with_sisterhood$ 중점을 완료하지 않은 채 이 중점을 완료할 경우 시스터후드의 §Y반발을 살 것§!입니다."
 TRN_nagisa_meeting_with_sisterhood: "시스터후드와 접촉"
 TRN_nagisa_meeting_with_sisterhood_desc: "유리조노 세이아 암살 사건 이후 시스터후드가 정국에 관여할 것이라는 음모론이 퍼지고 있습니다. 나기사는 타인을 쉽게 의심하는 자신의 면모를 그다지 좋아하지는 않지만, 시스터후드를 믿기 위해서 그녀들을 의심해야만 합니다. 시스터후드에게 선제적으로 접촉해 그녀들의 의중을 파악해 봅시다."
 TRN_successor_to_the_first_trinity: "첫 번째 트리니티의 계승자"
 TRN_successor_to_the_first_trinity_desc: "우리는 우리의 고결한 전통과 이상을 지켜냈습니다. 하지만 그것으로 끝일까요? 대전이 이전의 트리니티를 그저 유지하는 것만이 우리의 길일까요? 키리후지 나기사는 '첫 번째 트리니티'를 계승하고, 그녀의 방식으로 '개혁'해 나갈 것입니다. 그 개혁의 방향은, 오직 호스트만이 알고 있습니다."
 TRN_coexistence_with_germans: "독일에서의 공존"
 TRN_coexistence_with_germans_desc: "대전이 이후, 우리는 독일 현지인들과 같이 살아갈 수밖에 없게 되었습니다. 그들의 문화는 트리니티와 이질적이며, 티파티의 권위를 부정하는 그들의 가부장제는 불편하기 짝이 없습니다. 그러나, 그들과 같은 땅에서 공존하기 위해 지방자치를 허용할 필요는 있습니다."
 TRN_idealistic_approach: "밀크티 해법"
 TRN_idealistic_approach_desc: "우유와 홍차가 적절한 배합을 통해 조화를 이루어내듯이, 트리니티와 독일 현지인들은 적절한 조화를 이루어낼 수 있을 것입니다. 공동 학군을 조성하고, 트리니티의 신앙을 현지 신앙과 함께 교육하여 현지인들이 트리니티 문화를 자연스럽게 배우고 점진적으로 우리와 동화되도록 계획합니다."
 TRN_new_education_for_all: "모두에게 신교육을"
 TRN_new_education_for_all_desc: "독일과 트리니티의 너무나도 다른 문화를 감안하여, 모든 독일인들은 트리니티 문화를 이해하고 그들에 적개심을 품지 않기 위한 새로운 교육을 의무적으로 이수해야 합니다."
 TRN_civil_rights_act: "민권법"
 TRN_civil_rights_act_desc: "법률적으로는 키보토스계와 현지인은 완전히 동등합니다. 사회적인 차별까지 어떻게 할 수는 없겠지만, 적어도 제도적인 차별은 금지됩니다. 이를 통해 현지인들은 키보토스계에 의한 지배를 점점 자연스러운 것으로 받아들이게 될 것입니다. 적어도 티파티는 그렇게 기대합니다."
 TRN_realistic_approach: "얼그레이티 해법"
 TRN_realistic_approach_desc: "좋은 얼그레이티를 만들기 위해서는 깊은 홍차의 맛을 해치지 않도록 아주 적은 베르가모트 오일을 첨가하는 것이 중요합니다. 현지인들의 가치는 그 정도입니다. 아주 조금 남는다면 의미가 있지만, 선을 넘는다면 트리니티의 향을 지웁니다. 독일 문화를 강압적으로 말살할 수는 없으나, 유무형의 차별을 통해 그들이 자발적으로 '트리니티화'되도록 할 필요가 있습니다."
 TRN_dual_identity_card: "두 개의 신분"
 TRN_dual_identity_card_desc: "독일인과 트리니티인에게는 신분증에서부터 다른 단계를 부여해, 세율부터 공무원 임용 자격까지 차별적인 대우를 가합니다. 이는 적절히 차등화된 이등시민 등급입니다. 이등시민들은 트리니티 문화에 감화되었다는 것을 증명하기 위해, 여러 종류의 전향서와 트리니티 문화 교육을 이수해 새로운 신분증을 부여받을 수 있습니다. 이는 강제가 아닌 선택의 문제입니다."
 TRN_discriminate_but_equal: "나뉘어졌지만 동등한"
 TRN_discriminate_but_equal_desc: "법적으로 트리니티화되지 않은 시민들은 모든 서비스에서 차등 대우를 받지만, 이것이 영구적인 신분제가 아닌 트리니티화를 통해 벗어날 수 있는 상태임을 분명히 선전합니다. 트리니티인이 새로운 신분을 얻은 현지인을 차별하는 것을 금지하는 법률을 만들면서 '새로운 트리니티인'에 대한 혜택을 제공합시다."
 TRN_german_cultural_revolution: "독일 문화의 혁명"
 TRN_german_cultural_revolution_desc: "밀크티든 얼그레이티든, 중요한 것은 찻잔을 놓을 멋진 테이블이 필요하다는 점입니다. 여성 중심의 트리니티 사회와 남성 중심의 독일 사회가 융합하기 위해서는 우선 독일인들이 다소 자신들의 전통을 내려놓아야 합니다. 재교육 프로그램, 여성 고용제도, 사회 보수주의적 정치가들을 향한 제재가 중심이 될 것입니다."
 TRN_denazification_nagisa: "탈나치화"
 TRN_denazification_nagisa_desc: "한 가지만은 확실합니다. 국가사회주의는 우리와 함께 갈 수 없습니다. 여자들을 주방으로 보내려 하는 그 거만한 자들이 이 땅에서 득세한다면, 티파티의 권위가 어떻게 바로 설 수 있겠습니까?"
 TRN_trinity_religious_issue: "지역 신앙 문제"
 TRN_trinity_religious_issue_desc: "지난 공의회에서 결정된 바에 따라, 현지인들의 신앙 문제에 간섭할 것입니다."
 trn_nagisa_religion_hardline_tt: "우리는 공의회에서 §Y강경책§!을 실시하기로 하였으며, 그에 따라 현지 신앙을 파괴하는 것에 집중합니다:\n"
 trn_nagisa_religion_moderate_tt: "우리는 공의회에서 §Y온건책§!을 실시하기로 하였으며, 그에 따라 현지 신앙이 트리니티 신앙과 동일하다는 프로파간다를 전파하는 것에 집중합니다:\n"
 trn_nagisa_religion_null_tt: "우리는 아직 공의회를 실시하지 않았습니다. §Y강경책§!은 트리니티 시스터후드의 영향력을 확대시킬 것이며, §Y온건책§!은 독일 현지 정당들에게 유리할 것입니다.\n"
 TRN_nagisa_justice_task_force: "정보부-정의실현부 연계"
 TRN_nagisa_justice_task_force_desc: "티파티 직속 정보부 조직에 정의실현부 소속 인원들을 임명하고, 그 규모를 이전보다도 확장합니다. 티파티에 충성하는 더욱 크고 군사화된 정보부의 등장으로 우리의 안보는 더욱 굳건해질 것입니다."
 TRN_nagisa_support_for_the_JTF: "정의실현부 규모 확대"
 TRN_nagisa_support_for_the_JTF_desc: "하네카와 하스미와 만나 정의실현부의 규모를 더욱 키우고, 그들이 치안만이 아니라 방첩에서도 큰 역할을 하도록 독려합니다."
 TRN_nagisa_support_for_the_prefect_team_intelligence: "선도부 정보부 통합"
 TRN_nagisa_support_for_the_prefect_team_intelligence_desc: "게헨나 선도부의 유능한 정보부 조직은, 우리와 게헨나 선도부 사이의 평화적인 관계성으로 인해 통합될 수 있습니다. 물론 우리 사이의 우호적인 관계에도 불구하고 정의실현부 내부의 불만(특히 하스미를 중심으로)이 있다는 것은 유의해야 합니다."
 TRN_mediator_among_factions: "파벌 사이의 중재자"
 TRN_mediator_among_factions_desc: "키리후지 나기사의 임기가 진행되면서, 그녀는 여러 파벌들 사이의 의견을 조율하고 균형을 맞추는 놀라운 정치적 성과를 보여주고 있습니다. 나기사의 정치적인 영향력은 자연스럽게 증대하고 있으며, 처음에는 나기사의 지도력을 의심스럽게 바라보았던 이들도 이제 그녀를 믿습니다."
 TRN_safeguarding_the_ideal_of_factional_democracy: "전통의 수호자"
 TRN_safeguarding_the_ideal_of_factional_democracy_desc: "나기사는 트리니티의 오랜 전통을 바꾸지 않을 것입니다. 그녀는 티파티의 여러 분파들 사이에서 의견을 조율하고, 그저 필리우스의 분파 지도자로 남을 것입니다."
 TRN_eventually_happen: "파테르를 바라보다"
 TRN_eventually_happen_desc: "에덴 조약의 온전한 재협상은 불가능합니다. 파테르 분파를 자극하는 행동은 선도부를 동맹으로 만드는 것보다 더 큰 리스크를 초래할 수 있기에, 우리는 파테르 분파와의 협상에서 더 나은 국정을 운영하기 위해, 더 '트리니티적인' 에덴 조약의 재협상을 수행해야 합니다."
 TRN_eventually_happen_tt: "[TRM.GetName]-[GEH.GetName] 사이의 상호간 불가침 및 트리니티 산업 특혜 조약을 위한 £decision_icon_small §Y에덴 조약§!이 시작됩니다. [GEM.GetName], 선도부 강경파, 그리고 트리니티 정계의 이익적 개입은 이를 방해할 수 있습니다."
 TRN_eventually_happen_effect_tt: "만약 트리니티가 §Y$TRN_eventually_happen$§! 중점을 완료한다면, 이 중점은 파테르와의 §Y내부 분쟁§!을 해결하기 위한 다른 중점으로 대체됩니다."
 TRN_nagi_preventive_war: "예방 전쟁"
 TRN_nagi_preventive_war_desc: "게헨나와 트리니티 두 학원의 관계는 언제 전쟁으로 이어져도 이상하지 않습니다. 문제는 우리만이 아니라 그녀들 역시 같은 생각을 하고 있다는 점입니다. 이 전쟁에서의 승리자는 어느 쪽이 먼저 상대방을 찌르는지에 따라 결정될 것입니다."
 TRN_eden_system_establishment: "에덴 체제 수립"
 TRN_eden_system_establishment_desc: "어떤 결과가 되었건, 이미 우리는 시대를 결정했고, 게헨나와 트리니티에 걸친 거대한 새로운 시대를 열어젖혔으며, [ROOT.GetLeader]의 지도 아래에 트리니티는 새로운 여명을 맞이하고 있습니다."
 TRN_start_of_new_constitution_discussion: "새로운 헌법 준비"
 TRN_start_of_new_constitution_discussion_desc: "에덴 결전의 승리와 게헨나-트리니티 통합은, 우리가 미래에 어떤 방향으로 나아가야 할 것인지에 대한 깊은 논의의 시작을 알리는 사건이었습니다."
 TRN_start_of_new_constitution_discussion_tt: "§Y나기사 헌법§! 중점을 완료하기 전까지, £decision_icon_small §G결정§!을 통해 헌법 조항을 추가할 수 있습니다. 나기사 헌법 중점을 완료한 시점에서 추가된 헌법 조항 효과들이 전부 통합되어 §Y국민정신§!으로 추가됩니다."
 TRN_end_of_new_constitution_discussion: "나기사 헌법"
 TRN_end_of_new_constitution_discussion_desc: "모든 준비가 끝난 지금, 완성된 헌법 초안을 공의회의 의결을 거쳐 새로운 헌법으로 반포합니다."
 TRN_end_of_new_constitution_discussion_trigger: "§Y6개§!의 정치 중점을 완료했습니다."
 TRN_end_of_new_constitution_discussion_tt: "이 중점을 완료하는 순간, 더 이상 §Y헌법 조항§!을 추가할 수 없습니다."
 TRN_unknown_future: "미지의 미래"
 TRN_unknown_future_desc: "키리후지 나기사 호스트는 트리니티를 위한 가장 좋은 미래를 찾기 위해 노력할 것입니다. 그 미래가 무엇인지는 아직은 알 수 없습니다."
 TRN_unknown_future_tt: "나기사 루트의 정치 중점은 $TRN_safeguarding_the_ideal_of_factional_democracy$ 또는 $TRN_iron_woman$ 중점을 완료하면 공개됩니다."
 TRN_JTF_solidarity: "정의실현부 내부 단속"
 TRN_JTF_solidarity_desc: "파테르의 방해로 인해 외교 정책에서의 강경한 입장에서 우리가 크게 물러나면서, 나기사 호스트의 정치적 입지가 손상되었습니다. 나기사는 분파 결속을 위하여 츠루기 정의실현부장에게 의결권 없는 티파티 임원 명예직을 수여하고, 정의실현부가 여전히 호스트에게 충성함을 천명하고자 합니다."
 TRN_attack_pater: "파테르 기소에 집중"
 TRN_attack_pater_desc: "모두가 지금 독일에서 일어나는 지속적인 사보타주, 파업의 주도자가 사회민주주의자들이 아닌 파테르 분파라는 것을 알고 있습니다. 정의실현부에 지시해 사보타주 주도자들을 추적하고 그녀들을 향한 기소에 집중해, 파테르를 공격합니다."
 TRN_connection_to_vigilante: "자경단 협력"
 TRN_connection_to_vigilante_desc: "트리니티 내부 준군사조직인 자경단과 연계하여, 파테르 분파의 사보타주에 동조하는 현지인들을 체포, 구금하도록 합니다."
 TRN_attack_mika_misono: "미카의 다리 붙들기"
 TRN_attack_mika_misono_desc: "기소할 수 있는 권리는 일종의 검과 같습니다. 실제 상대를 처벌할 수 없는 기소라고 하더라도, 3심 내내 상대방을 법원에 묶어두고, 정신적인 압박감을 주며, 그리고 재판에 상대를 묶어 시간을 소비하게 할 수 있습니다. 미카를 그렇게 묶어둔다면 파테르의 사보타주 계획은 큰 타격을 입을 것입니다."
 TRN_we_need_to_be_prepared: "게헨나 내전의 전훈"
 TRN_we_need_to_be_prepared_desc: "선도부-트리니티 합동치안조직 협정에 따라, 우리는 선도부에 경찰력을 파견할 권리가 있습니다. 우리는 정의실현부원들을 통해 만마전 군사작전에 대한 정보를 얻고, 그들의 전술적 지식을 쌓을 수 있었습니다. 물론 우리 쪽에서 새나가는 정보도 없진 않지만, 얻는 정보가 더 큽니다."

 # 게헨나 통일 후의 나기사 (공용)
 TRN_rich_man_and_the_eye_of_a_needle: "[TRN_rich_man_and_the_eye_of_a_needle_log]"
 TRN_rich_man_and_the_eye_of_a_needle_desc: "국민 보건 서비스, 줄여서 'NHS'라고 불리는 이 제도는, 국가가 국민들의 모든 의료비를 대납하는 보편적 국영 의료보험 제도입니다. 이것이 미래에 복지 예산으로 인한 '트리니티병'을 불러올 것이라는 비난도 있으나, NHS는 그보다 더 큰 이익을 가져다 줄 것입니다."
 TRN_rich_man_and_the_eye_of_a_needle_open: "NHS"
 TRN_rich_man_and_the_eye_of_a_needle_default: "NHS: 제정 불가능"
 TRN_rich_man_and_the_eye_of_a_needle_default_tt: "나기사 헌법에서 다섯 개의 사회악을 지정하는 조건을 준비하기 전까지, 이 중점은 §Y금지§!됩니다."
 TRN_minimum_wage_law: "최저임금법"
 TRN_minimum_wage_law_desc: "호스트의 보호 아래에 있는 노동자들에게 합리적인 수준의 최저임금을 보장하여, 저임금 노동에 종사하는 트리니티 내부 빈곤층을 위한 사회안전망을 구축합니다."
 TRN_working_hours_limit: "노동시간 상한제"
 TRN_working_hours_limit_desc: "1918년 독일국 의회가 제정한 '1일 8시간 노동, 연장근무 포함 주 최대 48시간'의 엄격한 법적 제한을 다시 도입합니다."
 TRN_affirmative_action: "어퍼머티브 액션"
 TRN_affirmative_action_desc: "어퍼머티브 액션은 소수민족, 장애인 등 다양한 형태의 사회적 소수자들을 일터에서 의무 고용해야 한다는 할당제 정책입니다. 이 제도가 많은 약자들의 버틸 기둥이 될 것입니다."
 TRN_affirmative_action_tt: "§Y소수자 할당제§!로 인해 등용된, 결코 질병에 걸리지 않는 §Y안드로이드 장군§! 한 명이 추가됩니다."

 # 게헨나 통일 후의 나기사 (민주주의)
 TRN_expansion_of_the_tea_party_scale: "티파티 규모 확대"
 TRN_expansion_of_the_tea_party_scale_desc: "우리 정부는 감히 직선제에 기반한 내각 구성을 주장하는 현지 사회민주당을 비롯한 급진적 마르크스주의 선동을 용납하지 않을 것입니다. 그러나, 다양한 의견을 수렴하기 위해 티파티 임원 숫자를 두 배로 늘려 그 규모를 확대하는 것은 신중하게 고려될 것입니다."
 TRN_guarantee_of_freedom_of_the_press: "언론의 자유 보장"
 TRN_guarantee_of_freedom_of_the_press_desc: "대전이 이후 반정부적인 활동을 벌이다 폐간된 현지 신문들의 재발간을 허용하고, 어떠한 형태로도 언론 검열이 이루어지지 않으리라는 점을 호스트가 구두로 약속할 것입니다."
 TRN_trinity_carnival: "[TRN_trinity_carnival_log]"
 TRN_trinity_carnival_desc: "모든 학원들이 즐길 수 있는, 아주 멋진 트리니티에서의 축제를 여는 것은 어떨까요?"
 TRN_trinity_carnival_open: "트리니티 사육제"
 TRN_trinity_carnival_default: "트리니티 사육제: 제정 불가능"
 TRN_trinity_carnival_default_tt: "나기사 헌법에서 $TRM_nagisa_constitution_strengthening_federalism$을 헌법 조항으로 삽입하여 조건을 준비하기 전까지, 이 중점은 §Y금지§!됩니다."
 TRN_birth_of_trinity_pan_nationalism: "트리니티 범민족주의"
 TRN_birth_of_trinity_pan_nationalism_desc: "트리니티는 그 시작부터 '연합학원'이었습니다. 트리니티 민족주의는 트리니티 단일 학원의 우수성을 선전하는 것이 아닌, 현지 국가들과 대비되는 키보토스 전체의 단결을 선언합니다."
 TRN_faith_for_all: "[TRN_faith_for_all_log]"
 TRN_faith_for_all_desc: "트리니티의 신앙은 트리니티를 넘어 전키보토스의 모든 사람들을 위한 보편적인 도움을 주어야 합니다. 우리가 그녀들을 위하여 해준 지원이 있는 만큼, 시스터후드 역시 키보토스 단결을 위해 역할을 맡아줄 것을 요청합니다."
 TRN_faith_for_all_open: "거짓없는 믿음, 신앙의 감과"
 # 주석: 일본/중국 서버 사쿠라코 픽업(偽りなき信仰の甘果, 无伪信仰，甘甜果实)
 TRN_faith_for_all_default: "거짓없는 믿음, 신앙의 감과: 제정 불가능"
 TRN_faith_for_all_default_tt: "나기사 헌법에서 트리니티 신앙을 국교화해 조건을 준비하기 전까지, 이 중점은 §Y금지§!됩니다."
 TRN_meeting_with_mika: "짧은 밤 별의 꿈"
 # 주석: 일본 서버 수미카 픽업(短き夜の星の夢)
 TRN_meeting_with_mika_desc: "필리우스와 파테르의 분쟁은 장기간 이어지고 있으며, 나기사와 미카 사이의 인간 관계를 생각할 때 그 충돌은 심각할 정도입니다. 하지만 파테르가 정권을 장악할 가능성이 전혀 없어진 지금, 두 사람이 다시 힘을 합칠 가능성은 없을까요?"
 TRN_meeting_with_mika_tt: "이 중점의 성공 가능성은 지금까지 키리후지 나기사가 얼마나 §G타인에 대한 변하지 않는 믿음§!을 보여주었는지에 따라 달라집니다.\n\n이 선택들은 성공 가능성을 높입니다:\n  £white_dot §Y$TRN_five_clan_republic$§! 중점을 선택해 §Y아리우스 분교§!를 §G용서§!\n  £white_dot §Y$GEH_dkzh$§! 또는 §Y$GEM_perfect_team$§!이(가) 현재 §G조언가§!로 임명\n  £white_dot §Y$TRN_peaceful_exchange_with_mil$§! 중점을 선택해 밀레니엄의 과학을 §G용인§!하고 배움\n  £white_dot §Y$TRN_idealistic_approach$§! 중점을 선택해 독일인들에 대한 §Y적대적 태도§!를 포기함\n\n이 선택들은 실패 가능성을 높입니다:\n  £white_dot §Y에덴 조약§!이 파테르의 방해로 §R실패§!함\n  £white_dot §Y$TRN_german_cultural_revolution$§! 중점을 완료하지 않아, 나기사가 히후미에게 도움을 요청한 적이 §R없음§!\n  £white_dot 현재 트리니티가 §R전쟁 중§!으로, 나기사의 심리가 불안정"
 TRN_infinite_trust_and_faith: "모두를 향한 무한한 믿음"
 TRN_infinite_trust_and_faith_desc: "나기사를 '의심암귀'라고 하는 사람들도 있었을 것입니다. 하지만 이제 많은 경험들을 통해 나기사는 스스로의 의지로 자신들의 사람들, 자신들의 학원, 그리고 키보토스의 선의를 믿기로 했습니다. 세상의 어둠이 아무리 강하더라도, 그 어둠은 빛을 이기지 못하였습니다."
 TRN_opening_the_old_library: "[TRN_opening_the_old_library_log]"
 TRN_opening_the_old_library_desc: "고서관의 일부 금서들을 아주 조심스럽게 해제하여, 대중들에게 트리니티의 과거 자료들을 공개합니다. 우리가 이미 과거 트리니티의 죄와 새로운 트리니티를 구분짓기로 한 이상, 수백년 전의 금서들이 지금 우리의 문제가 되지는 않을 것입니다."
 TRN_opening_the_old_library_open: "금서 해제"
 TRN_opening_the_old_library_default: "금서 해제: 제정 불가능"
 TRN_opening_the_old_library_default_tt: "나기사 헌법에서 트리니티의 과거사 반성을 헌법 조항으로 삽입하여 조건을 준비하기 전까지, 이 중점은 §Y금지§!됩니다."
 TRN_new_and_free_trininy_culture: "새롭고 자유로운 트리니티 문화"
 TRN_new_and_free_trininy_culture_desc: "트리니티의 새로운 대중문화가 주변 문화와의 교류를 통해 탄생하여 퍼지고 있습니다."
 TRN_new_and_free_trininy_culture_tt: "§g§Y$TRN_Kyoyama_Kazusa$§!이(가) 조언가일 경우 이 중점은 더욱 강화된 효과를 줍니다.\n---§!"
 TRN_meeting_with_mine: "미네와의 만남"
 TRN_meeting_with_mine_desc: "몇 년 전 그 날, 사실 그 때...정말로 세이아가 죽은 것이 아니라는, 다소 당황스러운 소문이 퍼지고 있습니다만, 사실이 아니겠지요?"
 TRN_nagisa_democratic_ending: "Where there's tea party there's hope."
 TRN_nagisa_democratic_ending_desc: "나기사는 호스트에 오른 뒤, 자신이 할 수 있는 트리니티를 위한 모든 노력을 다했습니다. 나기사는 이제 훌륭한 자신의 동료들에게 그 짐을 건네줄까요, 아니면, 영광스러운 박수 속에서 자신의 직무를 더 이어가게 될까요?"
 TRN_nagisa_democratic_ending_tt: "키리후지 나기사의 §C엔딩§!을 볼 수 있습니다.\n호스트를 변경할 기회가 있으며, 호스트 후보는 지금까지의 중점 선택에 따라 달라집니다."
 TRN_nagisa_democratic_ending_after: "[TRN_nagisa_democratic_ending_after_name_log]"
 TRN_nagisa_democratic_ending_after_desc: "[TRN_nagisa_democratic_ending_after_desc_log]"
 TRN_nagisa_democratic_ending_after_nagisa: "키리후지는 언제나 승리한다"
 TRN_nagisa_democratic_ending_after_nagisa_desc: "나기사는 자신의 자리를 내려놓지 않기로 결정했습니다. 트리니티에는 노블레스 오블리주의 짐을 짊어질 지도자가 필요합니다. 앞으로 몇 십년 뒤에는 다음 후계자를 모색해 볼 수도 있겠지만요. 티파티는 나기사 개인을 중심으로 더욱 단결할 것입니다."
 TRN_nagisa_democratic_ending_after_hifumi: "문을 반 걸음 나가"
 TRN_nagisa_democratic_ending_after_hifumi_desc: "히후미는 권력욕이 없는 인물이지만, 키리후지 나기사 개인의 소망을 거부하지 못한 채 호스트직에 떠밀리듯 올랐습니다. 히후미는 아직 나기사의 그림자 아래에 있으나, 조금씩 정치를 배우고 있습니다. 몇 년 뒤에는 성격도 나기사를 닮아 변할까요? 설마요."
 TRN_nagisa_democratic_ending_after_seia: "예언된 적 없었던 미래"
 TRN_nagisa_democratic_ending_after_seia_desc: "세이아가 다시 호스트가 되는 미래는 그녀도 예측하지 못했습니다. 세이아는 더 이상 불확실한 미래 예지에 의존하지 않으려고 합니다. 하고 싶은 일을 한다면, 예지는 언제나 빗나갈 수 있으니까요."
 TRN_nagisa_democratic_ending_after_atsuko: "순무뿌리 차 따위가 아닌"
 TRN_nagisa_democratic_ending_after_atsuko_desc: "아리우스의 '로얄 블러드'로서 트리니티에서 존중을 받아 왔지만, 아츠코는 아리우스에서의 빈곤한 삶을 기억합니다. 트리니티는 그렇게 되어서는 결코 안 됩니다. 그녀는 트리니티가 늘 식량자급율 100퍼센트를 유지하도록 지원할 것입니다."
 TRN_nagisa_democratic_ending_after_ako: "에이전트 밤을 가다"
 TRN_nagisa_democratic_ending_after_ako_desc: "미래는 정보전의 시대가 될 것입니다. 첩보 영화에서도 그랬다고요. 아니라고요? 영화가 현실이에요! 새 호스트는 정보부에 대한 예산을 크게 확충하는 한편, 수인에서부터 현지 인류에 이르기까지 폭넓게 정보원들을 모집하려 노력합니다."
 TRN_nagisa_democratic_ending_after_mine: "구호기시단이냐 요한 분파냐"
 TRN_nagisa_democratic_ending_after_mine_desc: "미네는 지금까지 요한 분파의 수장이면서도 티파티에 참여하는 것은 거부했습니다. 하지만 세이아의 설득과 나기사의 지지로 호스트가 되면서, 이제 구호기사단을 공식적으로 티파티 조직으로 편입하는 것을 고려하기 시작했습니다."
 TRN_nagisa_democratic_ending_after_hidden_takane: "당신을 위한 슈비브지크"
 TRN_nagisa_democratic_ending_after_hidden_takane_desc: "겨울 왕국도, 미요시 대공가도, 의미심장한 겨울 왕국에 대한 이야기도, 사실 전부 거짓말입니다. 그런데, 트리니티 전체가 그 거짓말을 믿고, '타카네 여대공'을 호스트로 당선시켰습니다! 으악! 이제는 무조건 이 거짓말을 진실로 만들어야 합니다. 타협은 없습니다. 무조건!" # 히든
 TRN_nagisa_democratic_ending_after_bug_tt: "이 툴팁이 뜬다는 것은 치명적 버그가 발생했다는 뜻입니다. 버그 제보 부탁드립니다."
 
 # 게헨나 통일 후의 나기사 (비동맹주의)
 TRN_iron_woman: "강철의 여인"
 TRN_iron_woman_desc: "파테르 분파를 비롯한 반정부적 세력들로부터 모교를 보호하기 위해서는 더욱 강력한 호스트가 필요합니다. 트리니티는 필리우스를 중심으로 더욱 굳건한 결속이 필요하며, 숭고한 모교의 미래를 위해 분파간 민주주의라는 이상주의는 침해될 수 있습니다."
 TRN_illusion_of_equality: "평등이라는 허상"
 TRN_illusion_of_equality_desc: "트리니티의 성공을 위하여 노력한 엘리트들을 위하여, 호스트가 적합한 인물에게 귀족 작위를 내릴 수 있는 서임 제도를 공식적으로 도입합니다."
 TRN_removing_local_parties: "현지 정당 완전 근절"
 TRN_removing_local_parties_desc: "극좌적 모험주의 정당인 사회민주당을 완전히 불법화하고, 이들을 전부 검거합니다. 현지 정당의 독사 같은 면모는 더 이상 트리니티의 이상을 위협할 수 없을 것입니다."
 TRN_removing_local_parties_tt: "§Y$faction_G_name$§!의 영향력만큼의 §Y안정도§!가 감소하며, 모든 영향력이 §Y$faction_A_name$§! 측으로 이동합니다."
 TRN_hope_light_distant_sky: "희망이여 빛이여, 아득한 하늘이여"
 TRN_hope_light_distant_sky_desc: "티파티는 옛 아서 왕을 보좌하던 원탁의 기사들처럼, 내부에서는 동등하지만, 외부와는 철저하게 구분되는 상류층들만을 위한 더욱 폐쇄적인 원탁회의로 거듭나야만 합니다."
 TRN_pater_dissolution: "파테르 해산"
 TRN_pater_dissolution_desc: "대전이 직후 이루어진 포로 학대를 비롯한 범죄, 에덴 조약 시기의 내부 사보타주와 그를 위한 독일 내 반체제 인사들과의 공조 등, 파테르 분파의 중요 임원 전원을 영구적으로 숙청하기 위한 모든 법적 근거가 마련되었습니다."
 TRN_pater_dissolution_tt: "파테르 분파의 영향력 절반§g(소숫점 반올림)§!이 필리우스 분파 영향력에 §G추가§!됩니다."
 TRN_ding_dong_the_witch_is_dead: "마녀 사냥"
 TRN_ding_dong_the_witch_is_dead_desc: "나기사는 이 모든 사건에도 불구하고 미카에게는 매우 온정적인 태도를 취하고 있습니다. 하지만 당론은 그렇지 않습니다. 미카는 나기사의 친구지, 필리우스의 친구는 아니잖아요? '궁지에 몰린 미카가 쿠데타를 일으켜 나기사를 제거'하려 한다는 분파 차원의 연극이 필요할지도 모릅니다."
 TRN_ding_dong_the_witch_is_dead_trigger_tt: "§Y$TRM_mika_misono_problem_cat$§! 미션에 §Y2회§! 이상 실패했습니다."
 TRN_ding_dong_the_witch_is_dead_tt: "이 중점의 성공 가능성은 지금까지 키리후지 나기사가 §Y타인에 대한 변하지 않는 믿음§!을 얼마나 포기했는지에 따라 달라집니다.\n\n이 선택들은 성공 가능성을 높입니다:\n  £white_dot §Y$TRN_attack_pater$§!, §Y$TRN_attack_mika_misono$§! 중점을 선택해 §Y미소노 미카§!를 §Y적대§!\n  £white_dot £white_dot §Y$TRN_the_route_of_the_sun$§! 중점을 §R완료하지 않음§!\n  £white_dot §Y$TRN_crusade_against_mil$§! 중점을 선택해 밀레니엄을 적대시함\n  £white_dot §Y$TRN_realistic_approach$§! 중점을 선택해 독일인들에 대한 §Y적대적 태도§!를 유지함\n\n이 선택들은 실패 가능성을 높입니다:\n  £white_dot §Y$TRN_five_clan_republic$§! 중점을 선택해 §Y아리우스 분교§!를 §G용서§!\n  £white_dot §Y$GEH_dkzh$§! 또는 §Y$GEM_perfect_team$§!이(가) 현재 §G조언가§!로 임명\n  £white_dot §Y$TRN_german_cultural_revolution$§! 중점을 §G완료!"
 TRN_ding_dong_the_witch_is_dead_effect_tt: "성공과 실패에 무관하게, 이 중점은 나기사-미카의 우정을 §R영구적으로 단절§!합니다. 미소노 미카는 더 이상 장군으로 사용할 수 없게 됩니다."
 TRN_make_up_work_club: "보충수업부"
 TRN_make_up_work_club_desc: "나기사는 자신이 사랑하는 필리우스를 위하여, 투표권의 확대나 자유주의 이상을 주장하는 트리니티계를 모은 '썩은 계란 바구니'를 만들고자 합니다. 그녀들을 믿지 못해서가 아니라, 그녀들을 불로 담금질해 다시 태어나게 할 수 있다고 '믿기' 때문입니다."
 TRN_make_up_work_club_tt: "§Y6개 여단§!으로 이루어진 §Y형벌 부대§! 편제가 추가됩니다."
 TRN_birth_of_trinity_pan_nationalism_alt: "$TRN_birth_of_trinity_pan_nationalism$"
 TRN_birth_of_trinity_pan_nationalism_alt_desc: "$TRN_birth_of_trinity_pan_nationalism_desc$"
 TRN_lord_protector_appointment: "호국경 임명"
 TRN_lord_protector_appointment_desc: "자신이 사랑하는 이들을 지킬 수 있는 것은 나기사 뿐입니다. 자신이 아니면 누가 소중한 그녀들을 위해 스스로를 희생하겠습니까? 호국경은 티파티 호스트가 겸하는 새로운 직책으로, 공의회를 거치지 않고 법률을 제정하거나, 선거를 무제한으로 미룰 수 있는 초법적 권한을 제공합니다."
 TRN_bill_of_attainder: "[TRN_bill_of_attainder_log]"
 TRN_bill_of_attainder_open: "사권박탈법"
 TRN_bill_of_attainder_default: "사권박탈법: 제정 불가능"
 TRN_bill_of_attainder_desc: "사권박탈법이란 법원이 아닌 의회(여기에서는 티파티)가 특정 인물을 '범죄자'라고 다수결 표결로 지목하는 것으로, 그 상대를 재판 없이 구금, 처벌할 수 있게 하는 영국 관습법입니다. 영국식 사권박탈법의 도입은 티파티의 다수를 장악한 필리우스에게 더 큰 권한을 제공합니다."
 TRN_bill_of_attainder_default_tt: "나기사 헌법에서 $TRM_nagisa_constitution_anti_democracy_holy_war$를 헌법 조항으로 삽입하여 조건을 준비하기 전까지, 이 중점은 §Y금지§!됩니다."
 TRN_nagisa_neutrality_ending: "Where there's tea party there's hope."
 TRN_nagisa_neutrality_ending_desc: "나기사는 호스트에 오른 뒤, 자신이 할 수 있는 트리니티를 위한 모든 노력을 다했습니다. 타인을 믿고, 의심을 버린다는 계획에 따라, 필리우스에 모든 것을 믿고 필리우스를 위해 노력했습니다. 잘못된 것은 아무것도 없습니다. 그렇죠?"
 TRN_nagisa_neutrality_ending_tt: "키리후지 나기사의 §Y엔딩§!을 볼 수 있습니다."

 

 # 나기사 외교
 TRN_right_of_the_victor: "승자의 권리"
 TRN_right_of_the_victor_desc: "게헨나 중앙구에서 포로로 잡힌 게헨나 관료, 정치인들에 대한 몸값을 요구합니다. 승자가 패자를 석방하는 대신 대가를 받아내는 것은 천년 전 중세 시대 이전부터 이루어졌던 전통이자 권리이기도 합니다."
 TRN_right_of_the_victor_tt: "판데모니움 소사이어티의 §Y멸망시 지도자§!가 누구였는지에 따라, 이 중점의 효과가 달라집니다."
 TRN_right_of_the_victor_makoto_tt: "£white_dot §Y$GEH_akzhxh$§! 의장:"
 TRN_right_of_the_victor_satsuki_tt: "£white_dot §Y$GEH_satsuki$§! 의장:"
 TRN_right_of_the_victor_iroha_tt: "£white_dot §Y$GEH_dlfhgk$§! 의장:"
 TRN_right_of_the_victor_chiaki_tt: "£white_dot §Y$GEH_motomiya_chiaki$§! 의장:"
 TRN_right_of_the_victor_ibuki_tt: "£white_dot §Y$GEH_dlqnzl$§! 의장:"
 TRN_right_of_the_victor_generic_tt: "£white_dot §Y그 이외§!의 인물:"
 TRN_declaration_of_crusade_towards_the_west: "제1차 유럽 십자군 결성"
 TRN_declaration_of_crusade_towards_the_west_desc: "트리니티의 전통과 역사를 사랑하는 필리우스 분파의 영광적인 승리 이후, 필리우스와 시스터후드의 강경파 사이에선 대전이 이후 영적으로 충만하지 못한 주변 국가들을 향한 '영적인 십자군'을 보내야 한다는 목소리가 높아지고 있습니다. 경전의 가르침을 더 널리 퍼트리고, 불신자들의 세력을 올바른 가르침으로 계몽하는 것이야말로 필리우스의 사명일지도 모릅니다."
 TRN_war_against_cou: "베네룩스 침공"
 TRN_war_against_cou_desc: "트리니티는 확장 정책을 원하는 팽창주의적인 국가는 아닙니다. 그러나, 베네룩스의 총학생회 관련 세력들이 잔존하는 것이 우리의 국가 안보에 위협이 된다는 주장도 있습니다."
 TRN_recognition_of_cou: "베네룩스와의 평화"
 TRN_recognition_of_cou_desc: "총학생회와 굳이 충돌을 빚을 필요는 없습니다. 대전이 이전부터 그들은 기존 질서를 유지해 왔던 균형자들이지 않습니까? 우리가 맞서 싸워야 할 적은 다른 곳에 있습니다."
 TRN_recognition_of_bry_as_cou: "아루를 총학생회장으로 지지"
 TRN_recognition_of_bry_as_cou_desc: "트리니티는 확장 정책을 원하는 팽창주의적인 국가는 아닙니다. 그러나, 베네룩스의 총학생회 관련 세력들이 잔존하는 것이 우리의 국가 안보에 위협이 된다는 주장도 있습니다. 마침 총학생회는 대립 총학생회장 문제로 분열되어 있으며, 우리는 기존의 총학생회보다 68혁명의 이상주의자가 안보 측면에서 더 나은 파트너라는 결론에 이르렀습니다."
 TRN_stopping_kaisers_hegemony: "브리튼 십자군"
 TRN_stopping_kaisers_hegemony_desc: "카이저의 헤게모니는 이제 끝나야만 합니다. 그들이 기업국가이기 때문이 아닙니다. 기업국가이면서, 우리 트리니티 국민들에게 이롭지 않은 물건들을 팔고 있기 때문이기도 합니다. 카이저 PMC가 팔아 치우는 무기들이 암시장으로 흘러 들어가며 트리니티의 치안을 계속 악화시키고 있는 만큼, 이들에 대한 십자군 선언은 트리니티를 더욱 위대하게 만들 것입니다."
 TRN_crusade_against_mil: "[MIL.GetAdjective] 측을 향한 성전"
 TRN_crusade_against_mil_desc: "밀레니엄의 우수한 과학 기술은 우리가 본받을 가치가 있으나, 그들의 무신론적인 가치관은 트리니티의 귀에 독을 불어 넣는 것과도 같습니다. 우리는 밀레니엄을 증오하기 때문이 아니라, 그들이 올바른 길을 가기를 바라기 때문에 십자군을 보냅니다."
 TRN_peaceful_exchange_with_mil: "Code: BOX"
 TRN_peaceful_exchange_with_mil_desc: "밀레니엄이 무신론적 국가이므로 침공해야 한다는 주장은 시스터후드의 과격파들을 즐겁게 하겠지만, 너무 광신적인 주장입니다. 물론 시스터후드가 트리니티의 연속된 승리에 고무되어 '영적으로 다소 충만한' 상태가 된 탓이긴 하지만요. 대신, 우리는 밀레니엄 엑스포에 사절단을 파견해, 우리가 밀레니엄에서 과학을 배울 것입니다."
 TRN_wild_hunt_protection_proposal: "[WHY.GetAdjective] 측을 향한 보호 제안"
 TRN_wild_hunt_protection_proposal_desc: "트리니티의 서방 십자군은 이제 밀레니엄을 지나 이베리아로 접어듭니다. 우리는 [WHY.GetName] 측이 겪고 있는 인류 국가들과의 대립을 이해하며, 그들을 우리의 편으로 받아들이기 위해 노력할 것입니다."
 TRN_iberian_reconquista: "이베리아 십자군"
 TRN_iberian_reconquista_desc: "십자군 원정의 끝은 이제 유럽 대륙의 끝자락까지 다다랐습니다! 경전과 주에 대한 가르침이 인류 불신자들을 정화합니다. 그들이 참된 가르침 아래에서 계몽될 수 있다면, 십자군 전쟁으로 인한 피해는 감당할 수 있는 수준이 될 것입니다."
 TRN_preparation_for_the_eastern_crusade: "동방 십자군 준비"
 TRN_preparation_for_the_eastern_crusade_desc: "무신론자들의 땅인 동방은 계몽을 위하여 반드시 출병해야만 하는 개척지입니다."
 TRN_eastern_crusade_for_russia: "위대한 계몽을 위한 성전"
 TRN_eastern_crusade_for_russia_desc: "...문지기는 그를 위하여 문을 열고 양은 그의 음성을 듣나니 그가 자기 양의 이름을 각각 불러 인도하여 내느니라. 자기 양을 다 내놓은 후에 앞서 가면 양들이 그의 음성을 아는 고로 따라오되\n(요한 10:3-4)"
 TRN_belarusian_volunteer_corps_nagisa: "$TRN_belarusian_volunteer_corps$"
 TRN_belarusian_volunteer_corps_nagisa_desc: "벨로루시의 역사나 전통 같은 것이 중요한 것이 아닙니다. 중요한 것은 탈공산주의화를 위하여 그들이 우리와 손을 잡을 준비가 되어 있다는 것입니다."
 TRN_anti_soviet_resistance_nagisa: "$TRN_anti_soviet_resistance$"
 TRN_anti_soviet_resistance_nagisa_desc: "주께서 이르시기를, '너희가 주 안에서와 그 힘의 능력으로 강건하여지고 마귀의 간계를 능히 대적하기 위하여 하나님의 전신 갑주를 입으라 우리의 씨름은 혈과 육을 상대하는 것이 아니요 통치자들과 권세들과 이 어둠의 세상 주관자들과 하늘에 있는 악의 영들을 상대함이라' (에베소서 6:10-12) 하였으니, 권세들과 그 스탈린주의자들과 마귀들과 맞서 싸우기 위하여 뜻 있는 이들이 결연히 일어날 것입니다."
 TRN_ukrainian_unrest_nagisa: "$TRN_ukrainian_unrest$"
 TRN_ukrainian_unrest_nagisa_desc: "우리는 키예프 루스로부터 내려오는 오랜 우크라이나 전통과 보흐단 흐멜니츠키의 영웅적 투쟁에 대해 알거나 지지하기 때문에 우크라이나를 믿는 것이 아닙니다. 우리는 그들이 모스크바에 맞서 싸울 수 있는 의지를 가지고 있기에 그들을 믿습니다."
 TRN_preparation_for_the_poland_crusade: "폴란드 성전"
 TRN_preparation_for_the_poland_crusade_desc: "폴란드는 대전이 직후부터 트리니티와 영토 분쟁을 겪어 왔습니다. 뭐, 트리니티가 선제 공격한 셈이기는 하지만요. 우리는 동방 성전을 준비하는 과정에서 위협이 될 수 있는 폴란드 위협을 먼저 분쇄해야만 합니다."
 TRN_preparation_for_the_switzerland_crusade: "바티칸의 종 제거"
 TRN_preparation_for_the_switzerland_crusade_desc: "스위스는 과거부터 바티칸 시국에 용병들을 보내 주던 친-바티칸 세력이라고 볼 수 있습니다. 트리니티의 신앙을 유럽에 전파하기 위하여, 서로 다른 종교적 교리로 인해 맞물리지 않는 그들을 제거하는 것은 합리적인 '위험 제거'입니다."
 TRN_march_to_the_vatican: "바티칸으로의 행진"
 TRN_march_to_the_vatican_desc: "그들이 트리니티의 신앙을 이단으로서 간주한다면, 우리는 그들에게 우리의 교리가 옳다는 것을 알려 줄 수밖에 없습니다. 전차를 타고, 바티칸으로 직접 찾아가서요."
 TRN_march_to_the_true_rome: "트리니티 신앙의 위대한 승리"
 TRN_march_to_the_true_rome_desc: "우리의 신앙은 굳건하게 인정받았으며, 바티칸은 영구적으로 해체될 것입니다. 트리니티의 빛과 가르침이 영원하기를!"
 TRN_crusade_proposal_plana: "색채 위협"
 TRN_crusade_proposal_plana_desc: "우리는 '색채'라고 불리는 키보토스 외부 세력의 침공을 확인했습니다. 그들이 노리는 것은 우리보다는 현지인 쪽인 것 같지만, 그저 우선순위의 차이일 뿐일 수도 있지 않겠습니까?"
 TRN_chroma_navy: "해상 십자군"
 TRN_chroma_navy_desc: "색채의 영토로 진군하기 위해서는 바다, 또는 항공을 가로질러야만 합니다. 당연히, 이에 대한 준비가 필요합니다."
 TRN_crusade_proposal_malkuth: "절대존재의 위협"
 TRN_crusade_proposal_malkuth_desc: "자신을 데카그라마톤이라고 부르는 '기계신'이 키보토스 전체를 위협하고 있습니다. 그들이 우리를 파괴하기 전에, 우리가 그들을 먼저 칠 것입니다."
 TRN_decagrammaton_army: "대-기계 교전법 연구"
 TRN_decagrammaton_army_desc: "데카그라마톤과 맞서 싸우기 위해서는, 그에 맞는 '대-기계' 교범이 필요합니다. 준비할 수 있는 시간이 많지는 않지만, 트리니티의 영적 기둥 위에 영혼 없는 깡통이 올라서는 것을 막기 위해서는 반드시 성공해야만 합니다."
 TRN_becoming_the_goddess: "최후의 십자군"
 TRN_becoming_the_goddess_desc: "거대한 독수리는 돈이라는 이름의 맘몬을 숭배하며, 신이 아닌 자본주의를 성전의 그 꼭대기에 올리고 있습니다. 주께서 '내 아버지의 집으로 장사하는 집을 만들지 말라' 하시니 (요한 2:16), 우리는 마땅히 그리 할 것입니다."
 TRN_controlling_madness: "광기 제어하기"
 TRN_controlling_madness_desc: "미식연구회, 온천개발부... 이 광기 어린 정신병자들은 게헨나 통합 이후 호스트의 머리를 가장 골치 아프게 하는 문제들입니다. 물론 가장 쉬운 방법은 현장에서 그녀들의 머리통에 백린탄을 날려버리는 것이겠지만(히나 부장은 왜 그러지 않았을까요), 우선은 타협을 시도해 봅시다. 실패한다면? 그건 그 때 가서 고민해 보도록 하죠."
 TRN_five_clan_republic: "오족공화"
 TRN_five_clan_republic_desc: "필리우스, 파테르, 상투스 세 개의 대형 분파의 연합으로 만들어진 트리니티는, 이제 게헨나에 이어 아리우스까지 통합함으로서 다섯 기둥을 얻게 되었습니다. 트리니티는 점령된 아리우스에게도 동등한 지위를 약속하며 아리우스의 재건과 트리니티 통합을 위한 무제한의 지원을 약속할 것입니다."
 TRN_five_clan_republic_arius_tt: "§R경고§!: 아리우스가 §Y$ARI_chemical_warfare_preparation$§!, §Y$ARI_holding_arius_council$§!, §Y$ARI_eden_treaty_interference$§!를 완료할 때마다, 이 중점으로 인한 안정도 패널티는 §R중첩하여 상승§!합니다."
 TRN_five_clan_republic_arius_1_tt: "£white_dot 아리우스가 $ARI_chemical_warfare_preparation$ 중점을 완료:"
 TRN_five_clan_republic_arius_2_tt: "£white_dot 아리우스가 $ARI_holding_arius_council$ 중점을 완료:"
 TRN_five_clan_republic_arius_3_tt: "£white_dot 아리우스가 $ARI_eden_treaty_interference$ 중점을 완료:"
 TRN_five_clan_republic_tt: "§Y독일 국가인민당§! 파벌은 §Y아리우스 분파§!로 변화합니다. 아리우스 분파는 정부와 §G연립§!할 것입니다."
 TRN_arius_inquisition: "아리우스 이단심문"
 TRN_arius_inquisition_desc: "아리우스는 게헨나와는 비교조차 될 수 없는 악입니다. 이교도는 올바른 신앙을 몰랐던 것 뿐이기에 제자로서 삼는 것으로 죄를 씻을 수 있으나(마태복음 28:19), 이단은 올바른 신앙을 알고 있음에도 사악한 길을 따랐기에 결코 하나님 나라에 들어갈 수 없습니다(갈라디아서 5:19-21). 우리는 그들의 이단적 사상을 철저히 파괴할 때까지 이단심문을 실시할 것입니다."
 TRN_arius_inquisition_tt: "§Y독일 국가인민당§! 파벌은 §Y아리우스 분파§!로 변화합니다. 아리우스 분파의 영향력 절반§g(소숫점 반올림)§!이 필리우스 분파 영향력에 §G추가§!됩니다."
 TRN_arius_diplomacy_tt: "아리우스 분교가 §Y아리우스 스쿼드§!와 §Y니코메디아 트룹§! 중 어느 지도자를 선택했는지에 따라 이 중점의 효과가 달라집니다."
 TRN_arius_diplomacy_squad_tt: "아리우스 리워크 후에 추가함!"
 TRN_arius_diplomacy_nicomedia_troop_tt: "아리우스 리워크 후에 추가함!!!"
 TRN_two_church_unity: "동서 교회의 통합자"
 TRN_two_church_unity_desc: "콘스탄티노플 붕괴 이후 정교회의 심장이 된 모스크바가 우리의 손에 넘어왔습니다. [ROOT.GetLeader]의 노력으로 카톨릭과 정교회는 모두 트리니티의 깃발 아래에 놓였으며, 트리니티 교회가 모든 참된 신앙의 중심이 되었습니다."
 TRN_the_route_of_the_sun: "태양항로"
 TRN_the_route_of_the_sun_desc: "타인과 부딪히고, 그 상대를 죽일 것처럼 싸우게 된다고 하더라도, 결국 그 싸움 끝에 싫어하던 이를 사랑하게 된다. 그 자체가 하나의 청춘 로맨스 소설같기도 합니다. 그들과 우리와 관계가 그랬습니다."
 TRN_the_route_of_the_sun_tt: "게헨나 선도부가 §Y제2차 선도부 총회§!에서 어떤 결정을 내렸는지에 따라 이 중점의 효과가 달라집니다."
 TRN_the_route_of_the_sun_ako_tt: "선도부가 §Y$GEH_ako_route_focus$§!을(를) 완료:\n£white_dot 아마우 아코의 이름이 소라사키 아코로 변경\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_iori_tt: "선도부가 §Y$GEH_iori_route_focus$§!을(를) 완료:\n£white_dot §Y전쟁 지지도§! +0.05%\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_hina_tt: "선도부가 §Y$GEH_hina_route_focus$§!을(를) 완료:\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_generic_tt: "선도부가 §Y$GEH_main_route_focus$§!을(를) 완료:\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_red_winter_takane_hidden_focus: "겨울왕국의 여대공"
 TRN_red_winter_takane_hidden_focus_desc: "최근 우리가 붉은겨울을 점령한 이후, 우리는 붉은겨울의 압제자에 의해 탄압받은 옛 대공가인 미요시 공가에 대한 정보를 얻었습니다. 논의 끝에 호스트는 미요시 타카네 여대공의 작위를 인정하고 필리우스의 새 임원으로 받아들이기로 결정했습니다." # 히든
 TRN_union_of_faith: "연합된 신앙의 자매들"
 TRN_union_of_faith_desc: "트리니티는 더 이상 홀로 서 있지 않습니다. 우리는 신앙의 자매들과의 굳건한 연대 아래에서, 함께 승리를 향해 나아갈 것입니다."
 TRN_disobedience_of_the_subjects: "홈가드" 
 TRN_disobedience_of_the_subjects_desc: "전황이 좋지 않습니다. 침략자들의 공격으로 인해 트리니티 본토가 유린당하고 있는 지금, 붉은 피들이 푸른 피를 위해 전장으로 나서야만 합니다."
 TRN_disobedience_of_the_subjects_tt: "§Y6개 여단§!으로 이루어진 민병대 편제가 추가됩니다."
 TRN_sending_missionaries_to_allies: "동맹국에 선교사 파견"
 TRN_sending_missionaries_to_allies_desc: "트리니티 신앙은 키보토스 내의 다른 학원들에는 아직 잘 퍼지지 않았습니다만, 대전이 이후 시스터후드의 역할이 확대되면서 외부로 활발하게 전도되기 시작했습니다. 어쩌면 신앙심이 우리와 그녀들을 하나로 연결할 수 있을지도 모르죠."
 TRN_sending_missionaries_to_allies_tt: "이 중점을 완료한 뒤 §Y[ROOT.GetName]§!의 동맹국이 된 국가들은, 이후 정치력을 소모하는 결정을 통해 선교사를 받아들일 수 있습니다."
 TRN_trinity_loop_rail_line: "트리니티 철도국"
 TRN_trinity_loop_rail_line_desc: "전쟁과 확장을 위하여 철도를 통한 빠른 병력 수송보다 중요한 것이 있을까요? 하이랜더가 소유하지 않은 트리니티 고유의 철도국은 가장 낙후된 지역까지 철로를 연결할 것입니다."

