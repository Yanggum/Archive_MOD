# 나기사 헌법
 TRM_nagisa_constitution_cat: "나기사 헌법"
 TRM_nagisa_constitution_cat_desc: "트리니티의 질서가 잡히고, §G키리후지 나기사§!는 지금까지 한 번도 없었던 강력한 호스트가 되었습니다. 하지만 지금까지 얻은 작은 승리를 넘어, 나기사는 100년 후까지 유지될 트리니티의 새로운 틀을 만들고자 합니다. 필리우스는 트리니티가 대전이 이후 키보토스에서처럼 완전한 학원 국가로만 남아서는 생존할 수 없다는 것을 알고 있습니다. 그러나, §Y두 번째 트리니티§!와 같은 급진적 주장을 배척하는 만큼, 우리가 지나치게 모험적인 개헌을 이루는 것은 어렵습니다.\n\n필리우스는 현실에 오른쪽 발을 올린 채, 이상을 향해 왼쪽 발을 내딛을 것입니다. 우리는 이상주의적인 모교의 미래와 현실주의적인 파벌들의 요구를 모두 수용한, §Y나기사 헌법§!의 반포를 준비하고 있습니다. 분명 새로운 헌법은 트리니티의 향후 100년을 결정할 것입니다.\n\n£white_dot 특수 룰: 트리니티의 보수적인 사회적 전통을 벗어나는 일부 급진적인 헌법 조항은 §C요구 조건§!을 충족해야 선택이 가능합니다.\n"
 TRM_nagisa_constitution_datasite: "§G나기사 헌법§!의 현재 예상 효과\n-$political_power_factor_tt$ [?TRM_nagisa_constitution_political_power_factor|=+%2]\n-$training_time_factor_tt$ [?TRM_nagisa_constitution_training_time_factor|=-%2]\n-$production_factory_max_efficiency_factor_tt$ [?TRM_nagisa_constitution_production_factory_max_efficiency_factor|=+%2]\n-$army_org_factor_tt$ [?TRM_nagisa_constitution_army_org_factor|=+%2]\n-$army_morale_factor_tt$ [?TRM_nagisa_constitution_army_morale_factor|=+%2]\n-$production_lack_of_resource_penalty_factor_tt$ [?TRM_nagisa_constitution_production_lack_of_resource_penalty_factor|=+%2]\n"
