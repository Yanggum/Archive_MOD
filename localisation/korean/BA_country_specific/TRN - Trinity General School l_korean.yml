 # 군사 중점
 TRN_increase_military_budget: "[GetYear]년 국방 예산안 통과"
 TRN_increase_military_budget_desc: "군을 빠르게 현대화하려면 막대한 자금이 필요합니다. 그동안 국방 예산은 현 수준을 유지하는 정도로만 편성했으나, 전쟁이 끝났음에도 위협이 여전히 존재하는 만큼 국방 예산을 대폭 늘려 다가올 위협에 대비해야 합니다."
 TRN_advanced_armor: "발전된 전차"
 TRN_advanced_armor_desc: ""
 TRN_army_review: "지상군 개선"
 TRN_army_review_desc: "독일군과 벌였던 전쟁 경험은 전쟁의 양상이 오래전과 달라졌음을 명백히 보여주었습니다. 진정한 의미의 현대전을 치르기 위해서는 과거의 방식으로는 더 이상 통하지 않습니다. 오로지 공세만을 추종하던 이전 사령부를 개혁해야 합니다. 세계적으로 고조되는 긴장 속에서 군대를 현대적으로 유지하기 위해서는 주저할 여유가 없습니다."
 TRN_small_attack_groups: "소규모 공격 집단 활용"
 TRN_small_attack_groups_desc: "전장은 넓지만 투입할 인원은 값비쌉니다. 그러나 비교적 저렴한 포탄으로 전장을 평탄화하고 적군에게 소모를 강요한 뒤, 소규모 공격 집단을 투입하면 적들은 힘든 방어전을 치러야 할 것입니다."
 TRN_sophisticated_artillery_equipment: "정교한 포병 장비 개발"
 TRN_sophisticated_artillery_equipment_desc: "측지 장비를 비롯한 포병들에게 생명줄이나 다름없는 기술들은 최근 몇 년 사이 크게 퇴보해 왔습니다. 우리의 소중한 병력이 헛되이 희생되지 않도록 하기 위해서는 포병 기술의 발전이 요구되고 있습니다."
 TRN_research_armor_doctrine: "새로운 기갑 교리 연구"
 TRN_research_armor_doctrine_desc: "시대가 변하면서 노후화된 트리니티 기갑 교리는 더 이상 새로운 환경에 적응하지 못하고 있습니다. 이 기갑 사단을 빠르고 효율적이게 기동시키기 위해서는 새로운 기갑 교리 연구가 필수적입니다."
 TRN_general_staff_reform: "총사령부 개혁"
 TRN_general_staff_reform_desc: ""
 tooltip_TRN_general_staff_reform: "1년 후에, 우리는 다음만큼 받을 것입니다:"
 TRN_hammer_of_gideon: "기드온의 망치"
 TRN_hammer_of_gideon_desc: ""
 TRN_tactical_operational_strategic_training: "전술, 작전, 전략 훈련"
 TRN_tactical_operational_strategic_training_desc: ""
 TRN_mission_command: "임무 지휘"
 TRN_mission_command_desc: ""
 TRN_doctrine_established: "교리 정립"
 TRN_doctrine_established_desc: ""
 TRN_escort_force_expansion: "호위부대 확충"
 TRN_escort_force_expansion_desc: ""
 TRN_mechanized_division: "기계화보병"
 TRN_mechanized_division_desc: ""
 TRN_armored_corps_training_center: "기갑 부대 훈련소"
 TRN_armored_corps_training_center_desc: ""
 TRN_customized_production_method: "맞춤형 생산 방식"
 TRN_customized_production_method_desc: ""
 TRN_mass_production_line: "대량 생산 라인"
 TRN_mass_production_line_desc: ""
 TRN_vanguard_armed: "선봉 기갑부대"
 TRN_vanguard_armed_desc: ""
 TRN_deceive_your_enemy: "적을 기만하라"
 TRN_deceive_your_enemy_desc: ""
 TRN_thousand_blades: "천 개의 칼날 전술"
 TRN_thousand_blades_desc: "천 개의 칼날 전술은 트리니티만의 독자적인 전술입니다. 천 개의 칼날이 적에게 상처를 입히듯 직접적인 대규모 공격보다 작은 공격을 반복해 적군을 소모시키고 최소한의 사단만 투입해 적군을 섬멸하는 전술입니다. 적군은 영문도 모른채 전우가 쓰러져가며 패퇴만을 반복할 것입니다."
 TRN_kivotos_drone: "드론의 군사적 이용"
 TRN_kivotos_drone_desc: "지금까지 민수용으로만 사용되던 드론은 최근 군사적으로도 활용할 수 있다는 사실이 증명되었습니다. 특히 저렴한 자재로 대량 생산할 수 있다는 강점이 부각되면서 군사적 활용을 위한 실험이 진행되고 있습니다.  드론을 활용한다면 적은 비용으로 전선을 정찰하고 수색하며 정보 전달 측면에서 큰 장점을 지닐지도 모릅니다."
 TRN_military_chaplain: "군종장교"
 TRN_military_chaplain_desc: "최근 시스터후드와의 정치적 연계를 통해 우리는 큰 이점을 얻었습니다. 시스터후드의 역할을 군사 부문까지 확대한다면 우리 병사들은 시스터후드의 세례와 전투 전 예배를 통해 상당한 사기 진작을 기대할 수 있습니다."
 TRN_wages_of_sin_is_death: "죄의 삯은 사망이요"
 TRN_wages_of_sin_is_death_desc: ""
 TRN_kivotos_automaton: "키보토스 오토마톤"
 TRN_kivotos_automaton_desc: ""

 TRN_military_factory_maintenance: "군수품 생산 라인 재편성"
 TRN_military_factory_maintenance_desc: "현재의 무기 생산 현황은 한마디로 재앙과도 같습니다. 대전이의 여파가 아직도 남아있습니다. 생산 체계는 종종 단절되거나 구식이거나 둘 다인 경우가 많으며, 현대 군대가 싸울 수 있는 조건이 아닙니다. 이 시스템을 철저히 재편해야만 병사들이 트리니티의 적과 맞서 싸울 수 있는 무기를 확보할 수 있습니다."
 TRN_igfarben: "ig파르벤 자산 몰수"
 TRN_igfarben_desc: "[1069.GetName], 그리고 [65.GetName] 지역에는 독일 기업집단 IG파르벤의 유산이 남아있습니다. 그들이 뭐라고 하든 이 자산은 매우 중요합니다. 전시 상황에서 주요 물품들을 생산하고 보급할 수 있는 핵심 시설이기 때문입니다. 키보토스 고유 기술을 활용해 IG파르벤의 자산과 접목시킨다면 높은 수준의 에너지 효율성을 달성할 수 있을 것입니다."
 TRN_industrial_chain: "산업망 건설"
 TRN_industrial_chain_desc: "기존 공장이 지상군을 위해 일해야 한다고 선언하는 것만으로는 충분치 않습니다. 기존의 군수 산업 단지를 확장하기 위해 국영 탄약 및 무기 공장 연결체인 산업망 건설에 착수해야 합니다."
 TRN_assembly_line: "조립 라인 생산 방식"
 TRN_assembly_line_desc: ""
 TRN_optimize_production_line: "생산 라인 최적화"
 TRN_optimize_production_line_desc: ""
 TRN_arsenal_support: "에덴 조병창 지원"
 TRN_arsenal_support_desc: "에덴 조병창은 트리니티의 총기를 생산하는 학원 운영 기업입니다. 대부분의 트리니티 총기를 여기서 설계하고 조립하며 판매합니다. 그러나 최근 대폭 늘어난 국방 예산과 생산 수요에 맞춰 에덴 조병창을 지원해 시설을 확대해야 합니다."
 TRN_design_bureau_support: "에덴 전차 설계부 확장"
 TRN_design_bureau_support_desc: "독일의 전차 생산 시설은 꽤나 흥미롭습니다. 이들은 어떤 이유에서인지 전차 생산 시설을 농기구 생산 시설인 양 위장해뒀습니다. 숨겨진 생산 시설들을 확보해 트리니티 전차 설계부에 이양하면 기갑 전력을 강화할 수 있습니다."
 TRN_anti_tank_development: "대전차포"
 TRN_anti_tank_development_desc: "우리만이 기갑을 활용하는 데 초점을 두는 것은 아닙니다. 적국은 자체적인 기갑 부대를 배치할 것이며, 우리는 이에 대응할 방법을 찾아야 합니다. 전차를 관통하고 파괴할 수 있는 대전차포의 개발이 최선의 해결책이며, 우리는 이를 추구해야 합니다."
 TRN_motors_support: "BMW 자동차 공장 인수"
 TRN_motors_support_desc: "운이 좋게도 튀링겐 지역의 자동차 공장은 트리니티 모터스에 크나큰 활력을 가져다줄 만큼 거대한 시설을 갖추고 있었습니다. 또한 BMW 기업이 현재 큰 위기를 겪고 있는 만큼 저렴하게 인수할 수 있을 것입니다."
 TRN_rocket_technology: "다연장 로켓"
 TRN_rocket_technology_desc: "로켓포는 비싸고 정확도는 떨어지지만, 차량에 장착된 로켓포는 반동이 거의 없고 차량이 즉시 전장을 벗어날 수 있으므로 사거리와 기동성이 더 뛰어나다는 점에서 야포의 흥미로운 대안이 될 수 있습니다. 우리는 다연장 로켓에 대한 연구에 집중하고 최초의 로켓포 여단을 배치해야 합니다."
 TRN_establish_army_research_center: "[62.GetName] 연구소 설립"
 TRN_establish_army_research_center_desc: "현대 항공기와 로켓의 발전에는 두 분야의 연구와 개발에만 전념하는 중심지가 필요합니다. 포메른에 필요한 기반 시설이 구축되는 대로 이 역할을 적절히 수행할 것입니다."
 TRN_railway_guns: "'열차포' 계획"
 TRN_railway_guns_desc: "열차포는 요새를 산산조각 낼 수 있는 거대한 대포로, 설계국이 제안, 개발했습니다. 그들의 열차포 기술을 응용하여 적국의 요새를 폭파할 수 있는 열차포를 배치하면 기동 부대가 쉽게 돌파할 수 있을 것입니다."

 TRN_control_of_baltic_sea: "발트해 통제"
 TRN_control_of_baltic_sea_desc: "발트해는 드넓고 이 광활한 해역을 완전히 통제한다는 것은 불가능합니다. 하지만 트리니티 해군은 의도적으로 불가능한 목표를 설정하고 그에 도달하기 위해 노력하고 있습니다. 빈번한 해상 순찰과 해안 주변 통제권 확보만으로도 해안선의 안전을 크게 높일 수 있을 것입니다."
 TRN_expand_naval_facilities: "대규모 조선소 확장"
 TRN_expand_naval_facilities_desc: "트리니티는 조선소에 충분한 투자를 하지 않았습니다. 군사 부문은 현저히 낙후되어 있습니다. 트리니티에 남아있는 얼마 안 되는 조선소는 고급스럽고 유흥을 즐기기 위해 설계된 호화 여객선만 만들 줄 압니다. 이러한 문제를 해결하고자 시간이 걸리더라도 조선소 확장에 힘을 기울여야 할 것입니다."
 TRN_creation_of_marine_corps: "해병대 창설"
 TRN_creation_of_marine_corps_desc: "싸워서 이기고 지면은 죽어라 헤이빠빠리빠 헤이빠빠리빠"
 TRN_establish_the_naval_command: "해전사령부 설립"
 TRN_establish_the_naval_command_desc: ""
 TRN_improve_ship_industry: "조선업 개선"
 TRN_improve_ship_industry_desc: ""
 TRN_giant_ship_plan: "대형 함선 계획"
 TRN_giant_ship_plan_desc: ""
 TRN_high_seas_fleet: "대양함대"
 TRN_high_seas_fleet_desc: ""
 TRN_construct_aircraft_carriers: "항공모함 건조"
 TRN_construct_aircraft_carriers_desc: "항공모함이 건조하다는 건 말이 안됩니다. 왜냐면 주로 바다 위에 있기 때문입니다. 촤하하"
 TRN_battleship_construction: "전함 건조"
 TRN_battleship_construction_desc: "전함이 건조하다는 건 말이 안됩니다. 왜냐면 주로 바다 위에 있기 때문입니다. 촤하하"
 TRN_trade_interdiction: "무역 차단"
 TRN_trade_interdiction_desc: ""
 TRN_cruiser_warfare: "순향함 전투"
 TRN_cruiser_warfare_desc: ""
 TRN_armored_assault_fleet: "장갑함 습격함대"
 TRN_armored_assault_fleet_desc: ""
 TRN_submarine_warfare: "잠수함전"
 TRN_submarine_warfare_desc: ""
 TRN_air_force_reinforcement: "항공군 증강"
 TRN_air_force_reinforcement_desc: "현대 전장은 하늘을 지배하지 않고서는 승리할 수 없습니다. 이는 오래전부터 내려온 전쟁의 교훈입니다. 학원의 부족한 항공 전력을 충당하기 위해 우리는 온 힘을 다해야 합니다!"
 tooltip_has_completed_focus_TRN_ministry_of_industrial_development: "\n§Y$TRN_ministry_of_industrial_development$§! 중점 완료시 효과 발동:"
 TRN_academy_aircraft_construction: "학원비행기공사 설립"
 TRN_academy_aircraft_construction_desc: ""
 TRN_aviation_torpedoes: "항공 어뢰 개발"
 TRN_aviation_torpedoes_desc: ""
 TRN_prop_plane_recommission: "프롭기 재취역"
 TRN_prop_plane_recommission_desc: "사태 이후로 우리의 항공 기술은 크게 후퇴했습니다. 제트 기술을 복원하기까지는 시간이 오래 걸릴 것이며, 우리는 지금 당장 공백을 메우기 위해 프롭기를 재취역해야 합니다."
 TRN_jet_technolgy: "제트 기술 재연구"
 TRN_jet_technolgy_desc: ""
 TRN_establish_of_training_system: "조종사 훈련 체계 재수립"
 TRN_establish_of_training_system_desc: ""
 TRN_flying_club: "비행 동아리 창설"
 TRN_flying_club_desc: "비행 동아리는 조종사를 양성하기 위해 티파티가 지원하고 있는 동아리입니다. 조종사 훈련에 최적화된 훈련기가 대규모로 배치되어 있는 거대한 동아리입니다.\n\n여담으로 '비행' 동아리라는 점에서 비행청소년이라는 우스갯소리가 트리니티 학원을 떠돌고 있습니다..."
 TRN_helicopter: "회전익기"
 TRN_helicopter_desc: "회전익기의 수직 이착륙은 예측 불가능한 지형에서도 뛰어난 유연성을 보장합니다. 특히 활주로가 필요 없고 비선형 이동이 가능하다는 점은 전술적 측면에서도 큰 이점을 제공합니다."
 TRN_rule_the_sky: "하늘을 지배하라"
 TRN_rule_the_sky_desc: ""
 TRN_ensure_mobility: "기동성 확보"
 TRN_ensure_mobility_desc: ""
 TRN_cooperation_with_the_army: "육군과 협력"
 TRN_cooperation_with_the_army_desc: ""
 TRN_long_range_bomber: "장거리 폭격기"
