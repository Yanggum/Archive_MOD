 eden_treaty_negotiation_generic_propaganda: "[ROOT.GetAdjective]의 이상을 설파하기"
 eden_treaty_negotiation_generic_propaganda_desc: "우리가 에덴 조약에 대해 가진 이상을 대중들에게 알리며, 대중들이 에덴 조약에 대해 가진 생각을 이끌어갑니다." 
 eden_treaty_negotiation_generic_propaganda_tt: "이 결정은 §Y세 국가가 모두§! 사용할 수 있습니다. 이 결정의 효과는 당신의 국가가 극단적이지 않을수록 좋아지며, 극단적일수록 나빠집니다.\n"

