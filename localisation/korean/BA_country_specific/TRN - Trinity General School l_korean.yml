 TRN_idea_anti_soviet_resistance_ns_tt: "\n동방 전쟁 종료시 제거:\n§Y[SOV.GetNameWithFlag]§! 측과 평화 중\n"
 TRM_trinity_artillery: "[TRM.GetAdjective] 야포"
 TRM_superb_training_idea: "소수정예"
 TRM_combined_arms_idea: "제병합동"
 TRM_arius_reclaim: "아리우스 수복 작전"
 TRM_arius_reclaim_desc: "아리우스 수복 작전은 단순한 영토 회복 그 이상의 의미를 지닙니다. 물리적인 공간 통제권을 확보하는 것과 동시에 과거 불안정 했던 연합 체제를 비로소 완성하며 [ROOT.GetLeader] 정권의 정통성을 증대시킬 것입니다."
 TRM_anti_gehenna_idea: "반게헨나 정서"
 TRM_anti_gehenna_idea_desc: "오래 전, 게헨나와 트리니티의 전쟁 때문에 대부분의 트리니티 학생들은 반 게헨나 감정을 강하게 지니고 있습니다. 이들의 증오를 전쟁 시 전투력 부문에 분명히 도움이 될 것입니다. 그러나 전쟁이 끝나고 재건의 단계에 이르면, 이러한 적대적 정서는 크나큰 장애물이 될 수 있습니다."
 TRM_anti_gehenna_idea_tt: "시작 시점 @GEM§Y게헨나 학원§!의 핵심 주를 점령시 부정적 효과 발생\n"
 TRN_justice_task_force_ns: "정의실현부"
 TRN_justice_task_force_desc: ""

 TRN_political_instability_ns: "정치적 불안정"
 TRN_political_instability_ns_desc: "트리니티의 정치 체제는 상투스, 필리우스, 파테르로 구성된 삼위일체 원칙을 기반으로 하며, 상호 보완과 견제를 통해 균형을 유지하는 삼두정 체제입니다. 그러나 학원 내부에서는 분파 간의 경쟁과 견제가 끊이지 않으며, 이로 인해 정치적 불안정이 지속되고 있습니다."
 TRN_broken_balance_ns: "무너진 균형"
 TRN_broken_balance_ns_desc: "유리조노 세이아 암살 사건을 계기로 트리니티의 삼두정 체제에 균열이 생기기 시작했습니다. 분파 간의 갈등이 심화되면서 티파티의 균형이 무너지고, 권력의 향방이 급격히 흔들리고 있습니다."
 TRN_trinity_volunteer_corps_ns: "트리니티 의용군단"
 TRN_trinity_volunteer_corps_ns_desc: "미소노 미카의 정치적 독주를 저지하기 위해 결성된 지하 조직입니다. 이들은 주로 파테르 분파의 임원들과 미소노 미카에게 협력하는 거대 분파의 배신자들을 대상으로 테러 활동을 전개하고 있습니다.\n\n중점 $TRN_intelligence_agency$으로 제거할 수 있습니다."
 TRN_womens_rights_movement_ns: "전트리니티 여성연맹"
 TRN_womens_rights_movement_ns_desc: "여성의 사회 진출을 지원하기 위해 전트리니티 여성연맹이 창설되었습니다. 이 조직은 여성들이 직장과 일상에서 겪는 불합리한 대우를 개선하고, 그들이 마땅히 누려야 할 권리를 보장하기 위해 만들어졌습니다."
 TRN_Integrity_of_Trinity_ns: "온전한 트리니티"
 TRN_rebuild_ns: "트리니티 재산업화"
 TRN_trinity_cause_ns: "트리니티의 대의"
