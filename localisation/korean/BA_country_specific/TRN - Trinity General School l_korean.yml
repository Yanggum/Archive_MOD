 trinity_events_nagisa.62.a: " "
 trinity_events_nagisa.63.t: "만약에"
 trinity_events_nagisa.63.desc: "\"아직은 소문만 돌고 있는 이야기지만, 나기사가 호스트직을 타인에게 넘겨주는 걸 고려하고 있다더군요. 그리고, 당신이 그 '차기 호스트'로 가장 주목 받고 있는 사람이고요.\"\n\n아코는 대단한 이야기를 매우 대단하지 않은 상황에서, 지나가는 말처럼 던지는 굉장한 재능이 있었다. 그 덕분에 히후미는 거의 기절할 뻔 했고.\n\n에덴의 커피숍. 나기사의 최근 일상 이야기를 들으러 온 히후미는 넋이 나간 표정으로 아코를 쳐다보았다.\n\n\"이거 그, 아하하. 혹시, 철 지난 만우절 농담 같은 거지요?\"\n\"저희가 그런 농담을 주고 받을 만큼 친분이 있지는 않잖아요?\"\n\"그쵸... 근데, 그렇지만 저는... 정치라니요. 혹시 가짜뉴스 같은 건 아닐까요?\"\n\n히후미는 호스트라는 말을 듣는 것만으로도 의식이 아득해지는 것을 느꼈다. 애초에 그녀는 '평범한' 소녀일 뿐이었다. 그저 트리니티의 최고 권력자가 우연히 친구였을 뿐. 그런데, 거대한 권력을 넘겨받게 될 가능성이 있다니.\n\n아코는 짧은 한숨을 내뱉었다.\n\n\"그 사람, 호스트직의 무게 때문에 많이 힘들어하고 있다고 하더라고요. 저는 잘 모르지만, 원래는 그런 성격이 아닌 다정하고 밝은 사람이었는데. 티파티에 들어가고 나서 타인을 의심하게 되었다고. ...그래서, 그 '의심하는 일'을 관두고 싶어졌다고요.\"\n\"그래서, 호스트를 내려놓는 걸 고민하신다고요?\" \"그렇죠. 타인을 더 믿기로 했다. 저는 그렇게 전해 들었습니다. 그리고, 그 사람이 가장 사적으로 신뢰하는 사람이 당신이고, 또 당신을 후계자로 점찍어 두고 있다 해서...\"\n\n\"하지만요. 저는 이상하다고 생각해요. 나기사 님의 성격이 변하고, 타인을 믿지 못하게 되고, 그 분이 그렇게 괴로워하게 된 이유가 '정치' 때문이라면, 그 괴롭고, 아프고, 힘든 일을 왜 저에게 맡기신다는 건가요? 애초에, 말이 안 되잖아요. 저도... ...변할 텐데. 호스트, 아코 님이 하시면 안 돼요?\"\n\n아코는 잠시 당황한 표정을 지었지만, 이내 손톱 끝을 매만지며 고개를 저었다.\n\n\"그걸 제가 결정할 수 있는 건 아니지요.\""
 trinity_events_nagisa.63.a: "\"네... 우리 누구도, 직접 결정할 수는 없죠.\""
 trinity_events_nagisa_63_a_tt: "§g나기사가 티파티의 일원이 되던 첫 날, 그 때의 나기사에게도 결정권이 있었겠는가?§!"
 trinity_events_nagisa.64.t: "구역질"
 trinity_events_nagisa.64.desc: "나기사는 다정하게 웃으며, 히후미의 목에는 밧줄을, 머리에 가시 달린 면류관을 씌워 주었다. 아니, 정말로 씌웠다는 것은 아니다. 그저, 호스트라는 직 자체가 고문 기구였다.\n\n히후미에게 나기사 이외의 친구는 없었다. 대전이 이전 페로로 인형을 사기 위해 아비도스 자치구에 몇 번 방문한 적은 있었다. 그 때 아비도스 학생들과 몇 번 지나치기도 했고. 대전이가 없었다면 그녀들이 친구가 될 수 있었을지도 몰랐다. 하지만 그런 일은 일어나지 않았다.\n\n트리니티에서 사귄 친구들도 없었다. 만약 대전이가 일어나지 않았다면, 여러 우연과 기적을 거쳐 여러 사건들을 겪게 되었을지도 모른다. 어쩌면 '보충수업'을 들으며 새 친구들을 알게 되었을지도 모르지. 하지만 그런 일은 일어나지 않았다.\n\n그리고, 결국 나기사조차 호스트실을 떠났다. 나기사는 여전히 티파티였지만, 정치보다는 자신의 인생을 즐기는 것을 선택한 것 같았다. '정치 후계자'에게 자신이 해 오던 일들을 인수인계하고, 점점 호스트에게 간섭하지 않게 되었으니까.\n\n그리고, 아지타니 히후미는 홀로 남았다.\n\n먼저 부르기 전에는 아무도 찾아오지 않는 호스트실. 그저 '같은 분파 동료'일 뿐인 필리우스의 아가씨들. 페로로 인형과 마주 앉아, 홀로 즐기는 다과회.\n\n\"아하하...\"\n\n히후미는 찻잔을 내려놓았다."
 trinity_events_nagisa.64.a: "정치란, 이렇게도 역겨운 거네요."
 trinity_events_nagisa.65.t: "저는 히후미 씨를 믿습니다"
 trinity_events_nagisa.65.desc: "\"히후미 씨. 더 이상 호스트실에 이렇게 매일 찾아오지 않도록 하겠습니다.\"\n\"...네?\"\n\n그 날, 나기사의 한 마디에, 히후미는 손에 들고 있던 펜을 바닥으로 떨어뜨렸다. 나기사는 마치 '오늘 날씨는 맑군요' 라고 말하듯이, 히후미에게 더는 호스트실 방문을 하지 않겠다고 말했다.\n\n\"...호스트는 히후미 씨입니다. 저는 그저 필리우스 분파의 일원으로 내려왔을 뿐이고요. 제가 지금까지 히후미 씨가 처리해야 할 서류를 대신 검토하고, 정책 방향에 지시를 드린 것은 월권행위를 하고자 함이 아닌, 정치적으로 미숙한 히후미 씨를 보호하기 위함이었습니다. 그러나, 이미 히후미 씨는 제 가르침으로 '배우시지' 아니하셨습니까?\"\n\n나기사의 말은 맞았다. 나기사가 하고 있는 것은 분명 '배려'였다. 히후미를 그저 꼭두각시 호스트로 만드는 것이 아니라, 당당한 정치적 지도자로 인정하고자 하는 배려. 하지만 히후미는 그 배려가 너무도 두려웠다.\n\n\"그러면, 이 모든 일을 저 홀로...\"\n\"아니요. 히후미 씨의 곁에는 필리우스 분파가 있지 않습니까? 제가 그러하였듯이, 믿으세요. 믿음과 사랑이 히후미 씨를 견딜 수 있도록 단련시켜 줄 것입니다.\""
 trinity_events_nagisa.65.a: "필리우스를 믿고, 견딘다."
 trinity_events_nagisa_65_a_tt: "§g\"주여, 주여, 어찌하여 나를 버리셨나이까.\"§!"
 trinity_events_nagisa.65.b: "용기를 내어 말한다. '견딜 수 없어요.'"
 trinity_events_nagisa_65_b_tt: "§g영혼이 부서지기 전, 최후의 기회§!"
 trinity_events_nagisa.66.t: "파우스트"
 trinity_events_nagisa.66.desc: "나기사에게는 미카와 세이아가 늘 곁에 있었다. 자신이 변했다고 자조하면서도, 변하기 전의 그녀를 기억하는 이들과 함께 했다.\n그러나 히후미에게는, 말 없는 페로로 인형 뿐이었다. 정치를 원하지 않았던 그녀를 정치판에 집어 넣은 채, 나기사는 떠나버렸다. 그 분은 '정치를 모르던 소녀가 티파티에 들어와 변화하는' 그 과정을 스스로도 겪으셨으면서, '히후미만은 다를 것'이라고 굳게 믿으셨는지도 모른다.\n\n'나기사 님은, 왜 저에게만은 그렇게 매정하셨을까요? 독일인들, 게헨나, 아리우스, 심지어 파테르까지 그 모두를 사랑하셨으면서, 왜 저만은 버리셨을까요?'\n\n\"다음 서류입니다. 트리니티의 정국에 영향을 줄 수 있는 반체제 단체들입니다. 민주화를 요구하는 독일 지하 레지스탕스가...\"\n\"내려놓으세요. 제가 검토하겠습니다.\"\n\n히후미는 점점 웃지 않게 되었다. 대화 상대는 거울 속 자신 뿐이다. 히후미는 그 대화 상대를 파우스트라고 불렀다.\n\n\"파우스트 씨는 어떻게 생각하세요? 이 반체제 인사들. 아! 죽여야 한다고요? 그렇죠. 이 세상 유일한 제 편인 필리우스를 위해, 그 정도는 당연히 할 수 있죠.\"\n\n파우스트가 말한다. 현지인들은 검을 숨긴 적이다. 의심하라. 나기사는 파테르와의 화해를, 미카와의 우정을 간직했다. 하지만 그들도 칼날을 가지고 있지 않은가? 의심하라. 거리를 보라. 저 수많은 서민들을. 저들은 티파티의 과두제를 무너뜨리려 하는 자들이다.\n\n의심하라."
 trinity_events_nagisa.66.a: "저는, 나기사 님을 뛰어넘었습니다. 그 분의 가르침이 있었기 때문입니다."
 trinity_events_nagisa_66_a_tt: "§R\"그 가르침을 저는 증오합니다.\"§!"
 trinity_events_nagisa.67.t: "이것은 구호가 아닙니다"
 trinity_events_nagisa.67.desc: "\"세이아 님. 저는 세이아 님의 부탁을 통하여 트리니티의 호스트직에 도전하기로 하였고, 이렇게 권력을 쥐었습니다. 그러나, 저는 이 권력을 통해 더 큰 것을 잃어버렸습니다. 구호입니다.\"\n\n미네는 여기저기 칠이 벗겨진, 그저 하나의 플라스틱 쓰레기가 되어버린 방패를 끌었다.\n\n\"제가 구호기사단장으로서의 긍지를 가지고 있을 때 늘 지니고 다니던 이 방패. 어디에 있었는지 아십니까? 호스트가 된 이후, 제가 티파티 회의장에서 정치가들과 찻잔을 기울이며 그 가식적인 웃음을 짓는 동안, 이것은 몇 달 동안 창고에 처박혀 있다가, 분리수거 폐기장으로 버려질 뻔 했습니다.\"\n\n미네는 주먹을 세게 쥐었다. 마치 그 주먹으로 자기 자신을 때리기라도 할 것처럼.\n\n\"...세리나 씨 앞에서도 구호기사단장으로서의 모습을 보여줄 수 없게 되었습니다. 저도 감히 스스로를 구호기사단원이라 칭하지 못합니다. 세이아 님. 호스트직을 넘겨 받아 주십시오. 다른 직이라면 무엇을 주더라도 받겠습니다. 허나 '티파티'는 제게 맞지 않습니다. 이 자리는 너무도 안락하고, 마치 여왕처럼 모두가 떠받들어 주기에... 제 본분을 잊게 만듭니다...\""
 trinity_events_nagisa.67.a: "세이아는 무겁게 고개를 끄덕였다."
 trinity_events_nagisa_67_a_tt: "§g\"대전이 이전부터, 어째서 요한 분파가 티파티의 일원이 되는 것을 거부하였는지, 이제야 이해했습니다. 죄송합니다.\"§!"
 trinity_events_nagisa.67.b: "세이아는 오랜 시간에 걸쳐, 미네를 설득했다."
 trinity_events_nagisa_67_b_tt: "§g\"정치는 다른 형태의 구호입니다. 미네는 그저 새로운 형태로 모두를 돕고 있는 것일 뿐입니다.\"§!"
 trinity_events_nagisa.68.t: "양당제"
 trinity_events_nagisa.68.desc: "트리니티 티파티에 난립하던 여러 분파들은 대전이 이후의 정치적 상황으로 인해 대부분 정치적 영향력을 소실하였다. 현재 티파티는 필리우스와 파테르, 두 개 분파에 의한 양당제가 실시되고 있는 상황이다.\n\n두 개의 유력 분파들이 남은 지금, [ROOT.GetLeader] 측은 파테르 분파가 여러 인재들을 자신들의 분파로 스카우트하려는 움직임에 유의할 필요성이 있다. 미소노 미카는 나기사와 정치적 대립을 멈추지 않으려 하고 있으며, 그녀는 파테르를 강화하기 위한 여러 조력자들을 원하고 있다.\n\n물론, 우리는 맞상대할 준비가 되어 있다."
 trinity_events_nagisa.68.a: "필리우스는 지지 않을 것이다."
 trinity_events_nagisa.69.t: "변화"
 trinity_events_nagisa.69.desc: "\"하나코 씨는 요즘도 거리에서 그 이상한 수영복 입고 돌아다니는 퍼포먼스 계속 하시는 건가요? 슬슬 나이도 드셔서 뼈가 시리실 텐데요.\"\n\"어머. 걱정해 주셔서 감사합니다. 저야 사쿠라코 씨가 키오스크 쓰는 법을 배우는 날에 그만 둘 생각이랍니다.\"\n\n두 사람은 서로를 비꼬면서도, 누구도 먼저 테이블에서 일어나지 않았다.\n\n별로 사이가 좋다고는 할 수 없는 사쿠라코와 하나코였지만, 두 사람 모두 같은 문제로 고민하고 있었으니까. 먼저 입을 연 것은 사쿠라코였다.\n\n\"하나코 씨. 최근 티파티의 움직임이 심상치 않습니다. 솔직하게 말씀드리면, 점점 폐쇄적으로 변하고 있습니다.\"\n\"뭐, 트리니티는 원래 민주적인 학원은 아니었죠. 하지만, 지금 문제는 그 이상이기는 하네요. 나기사 씨가 '필리우스만을 믿을 수 있다'는 폐쇄적인 믿음에 기반해서, 점점 독선적으로 변해가고 있으니까요.\"\n\"저희 시스터후드가 이런 상황에서 해야 할 일이 있을까요?\"\n\"...이미 마음 속으로 정해두시지 않으셨나요? 나기사 씨에게 트리니티를 맡길 수 없다고요.\"\n\"... ...하나코 씨의 마음은 어떠신가요?\""
 trinity_events_nagisa.69.a: "\"판단 유보, 라고 해 둘게요.\""
 trinity_events_nagisa_69_a_tt: "§g권력의 균형을 부정적인 방향으로 변화시킬 수 있는 새로운 결정이 추가됩니다. [ROOT.GetAdjective] 측이 중점 $TRN_nagisa_neutrality_ending$을(를) 시작했을 때, 권력의 균형이 $TRM_anti_filius_factions$ 방향에 있을 경우, 시스터후드가 쿠데타를 일으킬 것입니다.§!"
 trinity_events_nagisa.70.t: "준비"
 trinity_events_nagisa.70.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n마리 자매님, 이 편지는 읽는 즉시 불태우시고 결코 흔적이 남게 하시면 안 됩니다.\n마리 자매님께서는 만약 시스터후드가 티파티를 전복하게 될 경우, 트리니티의 새로운 기둥이 될 호스트로서 어떤 분이 합당할 것인지 조사를 해 주시는 역할을 맡으셔야 합니다.\n지금의 티파티는 주의 가르침에 벗어나, 그 독선적 걸음이 점차 위험 수위에 다다르고 있습니다. 본디 시스터후드의 정치 개입은 매우 신중하여야 하나, 저는 트리니티가 더 걷잡을 수 없는 독재 체제로 향하기 전인 지금이 우리가 개입해야 하는 '골든 타임'이라고 판단하였습니다.\n\n이것이 결코 저 개인의 사리사욕에 의한 준비 과정이 아니라는 것을 이해해 주시기 바랍니다. 트리니티에는 올바른 인도와, 철인 독재자에 의한 사람의 통치가 아닌 지상의 어떤 기사보다도 뛰어난 주님의 인도에 따르는 신앙의 통치가 필요합니다."
 trinity_events_nagisa.70.a: "우타즈미 사쿠라코 보냄."
 trinity_events_nagisa.71.t: "적격, 부적격"
 trinity_events_nagisa.71.desc: "£white_dot NO.1 유리조노 세이아:\n긍정적 면모: 뛰어난 지혜와 굳건한 신앙심, 전 상투스 분파 수장으로서의 명망과 인지도를 갖춤. 트리니티의 지도자로서 합당한 품격을 지녔다고 판단됨\n부정적 면모: 만약 암살 미수로 인한 PTSD가 있을 경우, 대중들 앞에 직접 서기 어려울 것으로 판단. 허나 중대한 문제는 아님.\n총평: 적격\n\n£white_dot NO.2 우라와 하나코:\n긍정적 면모: 뛰어난 지성, 판단력 갖춤.\n부정적 면모: 그 뛰어난 지성과 판단력을 자신의 충동적 행동에 사용함. 꼭두각시 지도자로서 내세울 경우 시스터후드의 관리를 무시한 채 행동할 우려가 있음.\n총평: 부적격\n\n£white_dot NO.3 소라사키 히나:\n긍정적 면모: 명망 있으며, 과거 선도부장 시기 의전 업무 경험 풍부. 정치적 후원 세력을 게헨나에 두고 왔으므로 시스터후드가 꼭두각시로 관리하기 쉬움\n부정적 면모: 티파티에서 행정관 직급을 맡았으나 그 경력이 짧아 연공서열상 부적절. 트리니티 신앙으로의 개종 이후 십일조를 한 번도 내지 않았으며, 미사를 비롯한 종교 행사에도 계속 불참해 신앙심이 상당히 불량한 것으로 분석.\n총평: 부적격\n\n£white_dot NO.4 아지타니 히후미:\n긍정적 면모: 나기사의 친우이기 때문에, 정권을 넘겨준 후 '나기사 호스트가 자발적으로 직급을 넘겨주었다'는 여론 형성 용이\n부정적 면모: 직접 만나 대화를 나누어 보았을 때, '평범한 소녀'로서의 삶을 유지하는 것을 매우 바라고 있음. 정권을 획득했을 경우 비록 권한 없는 꼭두각시라 하더라도 견디지 못할 정도의 스트레스를 받을 것으로 판단.\n총평: 부적격\n\n£white_dot NO.4 아오모리 미네:\n긍정적 면모: 구호에 대한 고결한 신념으로 인해 티파티 내부에서 지지받을 것. '요한 분파'의 수장이기에 정통성 있는 후보.\n부정적 면모: 자신이 꼭두각시 호스트로 내세워졌다는 것을 알아차릴 경우, 결코 시스터후드를 따르지 않을 것.\n총평: 부적격\n\n£white_dot 결론: 유리조노 세이아를 차기 호스트로 지지한다."
 trinity_events_nagisa.71.a: "문서는 시스터후드의 기밀로 분류되었다."
 trinity_events_nagisa_71_a_tt: "§g만약 시스터후드가 정권을 장악할 경우, 유리조노 세이아가 꼭두각시 호스트가 될 것입니다.§!"
 trinity_events_nagisa.72.t: "가장 길었던 다과회"
 trinity_events_nagisa.72.desc: "나기사와 사쿠라코의 다과회는 연례 행사처럼 종종 이어졌다. 하지만 최근 들어 달라진 것이 있었다. 나기사는 최근 사쿠라코를 '수녀원장님'이라고만 부르기 시작했다. 그 이유는 쉽게 알 수 있었다. 필리우스 이외의 모두를 잊어가는 그 증세는, 이제 정치적 파트너였던 시스터후드의 수장까지 망각하게 만들었다. 사쿠라코는 씁쓸하게 웃으며 찻잔을 들었다.\n\n나기사가 잊는 사람은 '내 편'이라고 생각하지 않은 사람 뿐이다. 시스터후드는 필리우스와는 달랐다. 하지만 그녀를 책망하고 싶지는 않았다. 사쿠라코 역시 나기사를 믿지 못했고, 뒤로 쿠데타를 준비해 오지 않았던가. 그러니 사쿠라코를 잊는 것 역시 당연한 이치일지도 몰랐다. 사쿠라코는 나기사가 아닌, 두 사람이 처한 이 상황 자체를 증오했다.\n\n\"많은 이들이 제가 스트레스 때문에 이상해졌다고 말하고 있습니다. 하지만... 수녀원장님. 저는 이 극심한 스트레스 속에서도, '타인을 믿는다'는 원칙을 지키려 노력하고 있습니다. 지금까지 제가 필리우스를 위해 얼마나 많은 노력을 해 왔고, 제 사람들을 보호하기 위해 얼마나 많은 일을 해 왔던가요.\"\n\"...이해합니다.\"\n\"진정 이해하신다면, 수녀원장님. 말씀해 주세요. 지금 저는 옳은 방향으로 나아가고 있죠? 저는... 잘 하고 있는 게 맞지요?\"\n\n사쿠라코는 나기사의 눈을 똑바로 보았다. 그녀는 사쿠라코라는 사람이 어떤 이였는지, '수녀원장'이라는 직급을 제외한 모든 것을 잊었다. 그럼에도 그녀는 사쿠라코에게서 다정한, '당신은 옳은 일을 했습니다'라는 상냥한 한 마디를 갈구하고 있었다. 그녀는 자신이 사랑하는 필리우스를 망각에서 지켜내었지만, 필리우스 역시 나기사를 지켜 주었을까? 사쿠라코는 불안한 듯이 찻잔을 매만지는 나기사의 그 가느다란 손가락 끝을 가만히 지켜보았다.\n\n다른 사람이라면 몰라도, 사쿠라코가 나기사에게 할 수 있는 이야기는 없었다."
 trinity_events_nagisa.72.a: "\"호스트 님의 옳고 그름은 역사가 판단할 겁니다.\""
 trinity_events_nagisa_72_non_coup_tt: "§g사쿠라코는 쿠데타 실행을 포기했습니다. 여론이 나기사 호스트를 지지하고 있는 지금, 시도했더라도 실패했을 것입니다.§!"
 trinity_events_nagisa_72_coup_tt: "§g다과회 이후, 사쿠라코는 쿠데타 실행을 지시했습니다.§!"
 trinity_events_nagisa.73.t: "저는 모두를 사랑했습니다"
 trinity_events_nagisa.73.desc: "\"세이아 씨, 저는 세이아 씨가 저격을 당하기 전, 제게 가르쳐 주신 '타인을 믿는' 일을 지난 수년간 계속 지켜왔습니다. 히후미 씨의 조언을 따르고, 필리우스 분파와 매일 같이 회합을 가지며 그녀들의 의견을 경청했으며, 저 개인의 영달을 위해서가 아니라, 모든 행동과 말을 필리우스를 위해 하고자 했습니다. 저는 저를 믿어 준 이들에게 사랑으로 보답했습니다. 저는 제 사람들에게 귀족 작위를 주었고, 분파 회합에서의 무제한적인 발언 기회를 주었으며 심지어 게헨나에서 필리우스로 건너 온 아코 씨 일행에게도 트리니티 출신과 동등한 직급을 주었습니다.\"\n\n\"저는 마치 나침반이 아무리 부침을 겪어도 북방을 가르치기를 멈추지 아니하듯이, 오롯이 세이아 씨의 가르침인 사랑과 관용을 수용하는 삶을 살아왔습니다. 그 삶이 잘못되었습니까? 다른 사람을 믿도록 노력하고, 믿었고, 또 얼마나 많은 사랑을 베풀었습니까. 그런데도, 반대파는, 파테르의 가증스러운 잔당들은 여전히 저를 비난하고, 제 요원들은 대중들이 저를 독재자라고 비난한다는 풍문을 전합니다. 어째서 저는 그들을 사랑하였는데, 그들은...\"\n\n\"그만 하세요. 그만, 제발 그만 하십시오.\"\n\n세이아는 끝없이 이어지는 나기사의 절망 섞인 말을, 손을 들어 막아냈다. 나기사가 노력해 왔다는 것은 세이아도 알고 있었다. 나기사가 '필리우스'를 믿기 위해 한 노력도, '필리우스'에게 보여준 사랑도 전부. 하지만, 세이아는 그녀의 그 노력 자체가 뒤틀려 있다는 것을 알고 있었다. 세이아는 나기사에게 한 걸음 다가갔다. 작은 체구의 세이아였으나, 지금 이 순간만은 호스트와 동등한 키를 가진 것처럼 보였다.\n\n\"나기사, 제가 말한 타인을 믿는 것은 그대가 그대 주변 사람들과의 관계를 회복하기 위한 '수단'이었을 뿐입니다. 그런데, 이상하지 않습니까? 도대체 왜. 도대체 언제부터, 그 수단이 목적이 되어버린 겁니까? 타인을 믿고, 타인을 위해 살아왔다지만... 그 타인에서 가장 소중한, 당신의 친구가 지워지지 않았습니까.\"\n\"...그, 게, 무슨 말씀이시죠? 저는, 제 친구인 세이아 씨와 이렇게...\"\n\"그만 하세요! 나기사는 이미... 당신의 소꿉친구였던 £GFX_blank_texticon_small_2 조차!! 그 이름, 그 존재 자체를 잊어버리지 않았습니까!\""
 trinity_events_nagisa.73.a: "£GFX_blank_texticon_large_1 £GFX_blank_texticon_1 £GFX_blank_texticon_small_1"
 trinity_events_nagisa_73_a_tt: "§g나기사는 그 이름에서 무언가를 떠올리기 위해 노력했다. 정말, 정말로 노력했다.\n\n하지만 아무것도 떠올릴 수 없었다.§!"
 trinity_events_nagisa.74.t: "어째서 저는 사랑받지 못하였는지"
 trinity_events_nagisa.74.desc: "시스터후드는 쿠데타를 일으켰다. 티파티는 점령당했다. 이미 탈출로는 전부 막혔을 것이다. 세이아가 그런 상황에서 무의미하게 나기사의 손을 쥐고 도망치는 것은, 그저 친구를 위한 무의미한 시간 벌기일 뿐이었다. 나기사는 달리는 도중에도 계속 말했다.\n\n\"세이아 씨, 저는 세이아 씨가 저격을 당하기 전, 제게 가르쳐 주신 '타인을 믿는' 일을 지난 수년간 계속 지켜왔습니다. 히후미 씨의 조언을 따르고, 필리우스 분파와 매일 같이 회합을 가지며 그녀들의 의견을 경청했으며, 저 개인의 영달을 위해서가 아니라, 모든 행동과 말을 필리우스를 위해 하고자 했습니다. 저는 저를 믿어 준 이들에게 사랑으로 보답했습니다. 저는 제 사람들에게 귀족 작위를 주었고, 분파 회합에서의 무제한적인 발언 기회를 주었으며 심지어 게헨나에서 필리우스로 건너 온 아코 씨 일행에게도 트리니티 출신과 동등한 직급을 주었습니다.\"\n\n\"저는 마치 나침반이 아무리 부침을 겪어도 북방을 가르치기를 멈추지 아니하듯이, 오롯이 세이아 씨의 가르침인 사랑과 관용을 수용하는 삶을 살아왔습니다. 그 삶이 잘못되었습니까? 다른 사람을 믿도록 노력하고, 믿었고, 또 얼마나 많은 사랑을 베풀었습니까. 그런데도, 반대파는, 파테르의 가증스러운 잔당들은 여전히 저를 비난하고, 제 요원들은 대중들이 저를 독재자라고 비난한다는 풍문을 전합니다. 어째서 저는 그들을 사랑하였는데, 그들은...\"\n\n\"그만 하세요. 그만, 제발 그만 하십시오.\"\n\n세이아는 달리는 것을 멈추고 돌아보았다. 나기사는 펑펑 울고 있었다. 자신의 그 모든 것들이 아무것도 이루어내지 못했다는 절망감으로, 울고 있었다. 나기사가 노력해 왔다는 것은 세이아도 알고 있었다. 나기사가 '필리우스'를 믿기 위해 한 노력도, '필리우스'에게 보여준 사랑도 전부. 하지만, 세이아는 그녀의 그 노력 자체가 뒤틀려 있다는 것을 알고 있었다. 세이아는 비통한 목소리로 말했다.\n\n\"나기사, 제가 말한 타인을 믿는 것은 그대가 그대 주변 사람들과의 관계를 회복하기 위한 '수단'이었을 뿐입니다. 그런데, 이상하지 않습니까? 도대체 왜. 도대체 언제부터, 그 수단이 목적이 되어버린 겁니까? 타인을 믿고, 타인을 위해 살아왔다지만... 그 타인에서 가장 소중한, 당신의 친구가 지워지지 않았습니까.\"\n\"...그, 게, 무슨 말씀이시죠? 저는, 제 친구인 세이아 씨와 이렇게...\"\n\"그만 하세요! 나기사 씨는 이미... 당신의 소꿉친구였던 £GFX_blank_texticon_small_2 조차!! 그 이름, 그 존재 자체를 잊어버리지 않았습니까!\""
 trinity_events_nagisa.74.a: "£GFX_blank_texticon_large_1 £GFX_blank_texticon_1 £GFX_blank_texticon_small_1"
 trinity_events_nagisa.75.t: "전원이 뽑힌 텔레비전"
 trinity_events_nagisa.75.desc: "\"히후미 씨, 네. 거기 편하게 앉아 주세요. 저는 올바른 삶을 살기 위해 노력해 왔다고 생각했습니다. 그런데, 세이아 씨가 그러더군요. 저는 제 소중한 친구의 존재조차 잊어버린 채, 수단을 목적으로 알고 살아왔다고요. 그런데 이상하지 않습니까? 히후미 씨, 저, 세이아 씨... 우리 세 사람이 늘 같은 자리에서 다과회를 가졌던 기억도 여전히 남아 있습니다. 다과회장의 세 의자에 마주 모여 앉아 환담을 나누던 기억도요.\"\n\n\"정말로 제가 미친 걸까요? 세이아 씨가 옳고, 제가 틀린 걸까요? ...그렇다면, 제가 잊어버린 것은 누구일까요? 세이아 씨는 제게 매일 그 이름을 말하고 있는 것 같습니다. 티파티의 수많은 임원들에게 제 친구들의 이름을 묻기도 했습니다. 그런데, 기억이... 기억이 나지 않습니다.\"\n\n\"정말로 제게, 제가 잊어버린 '친구'가 있었다면! 이렇게 미친 사람처럼 티파티 건물을 뛰어다니는 동안, 한 번이라도 제 앞에 나타났어야 하지 않습니까? 그런데 왜 제가 잊어버린 목적은, 수단이라는 베일을 걷고 제 앞에 직접 나타나지 않는 것입니까? 제발 알려 주세요, 히후미 씨... 트리니티의 호스트로서가 아니라, 그저 무력한 당신의 친구로서 부탁드립니다. 제발... 제가, 누구를 잊고 있는지... 잊고 있는 사람이 정말 존재하기는 하는지... 알려주십시오...\""
 trinity_events_nagisa.75.a: "히후미는 그저 오열하는 그녀를 안을 수밖에 없었다."
 trinity_events_nagisa_75_a_tt: "§g잊어버린 그 이름을 아무리 말해 주어도, 그녀가 기억할 수 없다는 것을 알았기에.\n\n트리니티 종합학원을 위해 준비된 모든 이야기를 플레이 해 주셔서 감사합니다. 게임을 플레이 해 주신 모든 분들이 없었다면 이루어질 수 없었을 것입니다.§!"
 trinity_events_nagisa.76.t: "강하게 뉴 게임"
 trinity_events_nagisa.76.desc: "세이아는 꼭두각시 호스트로 이용당하기 위해 에덴에 유폐되었고, 나기사는 자신이 과거에 파테르 분파의 정치범들을 감금한 감옥으로 이송되었다. 종신형을 선고 받을 것이라는 이야기를 들었기에, 아마 이곳에서 아주 오랜 시간을 보내게 될 것이다. 누구를 탓하겠는가? 이 모든 것은 제대로 노력하지 못한 나기사 자신의 잘못일 뿐인데.\n\n\"...나기 쨩?\"\n\n끝없이 이어지는 상념을 깨뜨린 것은, 나기사가 알지 못하는 생경한, 하지만 이상할 정도로 익숙한 목소리였다. 나기사는 자신의 독방 맞은 편 방을 돌아보았다. 파테르 분파의 수장. £GFX_blank_texticon_1 £GFX_blank_texticon_4 가 울먹이면서 자신을 쳐다보고 있었다. 이해가 되지 않았다. 그녀에게 종신형을 내리고, 이 차가운 감옥에 처박은 것은 자신인데, 왜 자신과 한 번도 만난 적 없는 타 분파의 정적이.\n\n\"...키리후지 씨라고 부르시죠. 나기 쨩이 뭡니까. 당신과 저 사이에.\"\n\"당신과 나 사이... 아, 응. 미안. 그러네. 나기 쨩, 아니. 키리후지 씨는, 나 기억 못 하지?\"\n\"기억합니다. 파테르 분파의 수장이었죠.\" \"그거 말고 이름.\"\n\n나기사는 그녀의 이름을 부르려고 해 보았다. 떠오르지 않았다. 멍청하게 천장을 쳐다보며 \"...다나카 타로?\" 라고 간신히 말하니, '한 글자도 안 맞았어'라며 웃음이 터진다. 울면서 웃고, 정말 이해할 수 없는 사람이다.\n\n\"저기 나기... 키리후지 씨. 앞으로 여기서 우리는 정말, 저엉말 오래 같이 시간을 보내게 되겠지?\"\n\"피차 종신형 아닙니까. 평균 수명을 생각해 본다면 한 50년은 이러고 살겠죠.\"\n\"그렇다면! 우리 친구가 되는 건 어떨까? 어차피 매일 같이 얼굴을 보고 살아야 하니까. 한 걸음, 한 걸음씩. ...다시 처음부터 우리 이야기를 만들어 가는 거야.\"\n\n긴 침묵이 이어졌다. 어쩌면 그녀의 말이 맞을지도 모른다. 이곳에서 두 사람은, 정말 오랜 시간 함께 하게 될 테니까. 나기사는 결국 한숨을 내뱉으며 의자에 앉았다.\n\n\"좋습니다. 그러면 서로 이름부터 교환하죠. 저는 나기사. 키리후지 나기사라고 합니다.\""
 trinity_events_nagisa.76.a: "\"나는, 내 이름은...\""
 trinity_events_nagisa_76_a_tt: "§g조금 먼 길을 돌아가더라도, 다시 같은 목적지에 도달할 수 있을 지도 모릅니다.\n\n트리니티 종합학원을 위해 준비된 모든 이야기를 플레이 해 주셔서 감사합니다. 게임을 플레이 해 주신 모든 분들이 없었다면 이루어질 수 없었을 것입니다.§!"
 trinity_events_nagisa.77.t: "업무 중인 평범한 날"
 trinity_events_nagisa.77.desc: "\"나기사 님, 이 서류 확인 요청드립니다.\" \"...네. 그곳에 두세요.\"\n\n나기사는 끊임 없이 이어지는 서류들을 계속 넘겼다. 나기사는 끝없는 고난을 겪으면서도 자신이 꽤 잘 해내고 있다고 생각했다. 세이아가 예언처럼 남겼던 그 말, 주변 사람들을 믿는다는 약속도 여전히 지키고 있었다. 게헨나와의 오랜 분쟁도 그녀의 손에서 끝이 났다.\n\n그렇지만, 나기사는 아직 불안감을 느끼고 있었다. 지금 키리후지 나기사는 옳은 길을 가고 있는 것일까? 그러니까, 정말로 자신의 사람들을 지키기 위해, 믿기 위해 노력하고 있는가? 나기사의 소중한 이들은 유리공예와도 같다. 쉽게 부서지고, 깨진 유리 조각처럼 흩어져버리는 존재. 세이아도 그렇게 허무하게 사라져버리지 않았던가.\n\n\"...아.\"\n\n나기사는 서류를 잡아 끌었다. 독일 사회민주당 위험 인물 동향 보고. 수도 없이 보아 온 요원들의 국내 방첩 업무 서류. 하지만, 오늘은 뭔가 달랐다.\n\n사회민주당의 £GFX_blank_texticon_3 £GFX_blank_texticon_1\n중앙당의 £GFX_blank_texticon_2 £GFX_blank_texticon_4\n\n왜, 어째서, 이들의 이름이, 얼굴이 생각나지 않는 거지?\n\n분명 수도 없이 서류 속에서 보아온 이름들이었다. 하지만, 어째서인지 £GFX_blank_texticon_5 의 이름이, 그 정적들이, 마치 기억 속에서 도려내진 것처럼 떠오르지가 않았다."
 trinity_events_nagisa.77.a: "...무슨 일이, 일어나는 거죠?"
 trinity_events_nagisa.78.t: "그다지 평범하지 못한 날"
 trinity_events_nagisa.78.desc: "\"이건 심리적인 스트레스 때문에 생긴, 전형적인 정신적 문제입니다.\"\n\n구호기사단의 의사라는 £GFX_blank_texticon_small_1 이 예의 바르게 진료 차트를 넘겼다. 나기사는 아랫입술을 몇 번이고 물었다 놓으며 의사의 설명을 들었다. 그녀는 자신의 편집증을 억누르려고 했다. 다른 사람들을 믿고, 소중한 사람들을 보호한다. 하지만 '타인을 믿는 것'과 '내 소중한 이들을 보호하는 것'이 충돌했다. 혹시라도 자신의 적이 될 수 있는 이를 믿는다면? 잘못된 선택 때문에 소중한 사람. 이를테면 히후미 같은 이들이 희생된다면? ...키리후지 나기사의 이성은 그게 단순한 편집증이 아니라고 말했다. 세이아가 어떻게 되었는지 알고 있지 않은가.\n\n그래서 나기사의 마음과 영혼이 비틀리기 시작했다. 타인을 계속해서 믿을 수 있도록, '믿을 수 없는 사람'을 그녀는 마음 속으로 지워 나가기 시작했다. 나기사가 믿지 못하는 이는 타인이 아닌 물건일 뿐이다. 즉, 잊어버려도 되는 존재다. 보고 있어도 인식하지 말고, 그 존재 자체를 기억에서 지우라고.\n\n\"...방어기제로군요. 이해합니다. 저 자신이 받아 온 스트레스로 인해... ...의사 선생님. 이 '믿지 못하는 타인'의 범위는, 앞으로 더 커지게 될까요?\"\n\n나기사의 불안에 찬 목소리에도, 의사는 차분하게 답했다."
 trinity_events_nagisa.78.a: "\"그건 더 지켜봐야지요.\""
 trinity_events_nagisa.79.t: "일기장"
 trinity_events_nagisa.79.desc: "나기사는 자신의 일기장을 펼쳤다. 일기장 안에는 수십 명의 폴라로이드 사진들과, 그 사진 옆에 적힌 이름과 간단한 인명 정보들이 짝지어 나열되어 있었다. 지난 몇 주 동안의 분석을 통해, 나기사는 자신이 '잊어가는' 이들의 공통점이 무엇인지 확인했다. '필리우스 분파와, 나기사에게 충성하는 정의실현부를 제외한 모두'. ...곤란한 일이었다. 사회 생활의 문제를 떠나서, 필리우스 바깥의 모두를 잊는다면 당장 호스트 업무가 곤란해진다. 그녀는 일기장의 이름을 손으로 가린 채, 이름표 옆 사진만 보고 암기를 시작했다.\n\n독일 공산당 당수. 기억나지 않는다. 나기사는 검지를 떼서 이름을 읽었다. 에른스트 텔만. 다음은 시스터후드 수녀원장. 누구였더라? 그래. 우타즈미 사쿠라코. 아직 잊지 않았다. 룩셈부르크 대공. 무솔리니였던가? 아니, 리쿠하치마...\n\n그녀는 아직 잊지 않은, 또는 이미 잊어버린 정치인들의 이름과 사진을 다시 외웠다. 그리고, 검지 끝은 도중에 멈췄다.\n\n자신의 친구 리스트. 상투스 분파의 유리조노 세이아, 그리고.\n\n만약, 자신의 방어기제가, 필리우스 바깥의 모든 것을 지워버린다면.\n\n언젠가는 £GFX_blank_texticon_small_2 가 누구였는지도 기억해 낼 수 없게 될까?"
 trinity_events_nagisa.79.a: "그럴 리는 없을 것이다. 분명히."
 trinity_events_nagisa.80.t: "작고 소중한 요새"
 trinity_events_nagisa.80.desc: "기억이 협소해지면서, 나기사는 필리우스 분파의 회합에 점점 더 집착하게 되었다. 모든 창문이 커튼으로 가려진 티파티 회의실은 좁고 음침하지만 동시에 편안한 분위기를 풍겼다. 그리고, 이곳에 오면 나기사의 가장 친한 친구, 히후미를 만날 수 있다. 히후미는 언제나 호스트의 오른쪽 가장 가까운 자리에 앉았다. 상석이 따로 없는 원탁이지만, 나기사는 '히후미 씨의 곁에 앉을 수 있는 자리가 상석'이라고 늘 생각했다.\n\n\"다음 보고입니다. 상투스 분파의 £GFX_blank_texticon_small_1 측과 파테르 분파의 £GFX_blank_texticon_small_3 측이 회담을 가졌습니다만, 비정치적인 만남이었던 것으로 보입니다. 이에 대해 우리는...\"\n\n나기사는 지루한 행정관의 보고가 이어지는 사이, 두꺼운 커튼이 있는 창가 자리를 보았다. 자신이 고립되어가고 있다고 말하는 이도 있다. 하지만, 필리우스의 가장 소중한 이들, 그리고 소중한 친구인 아지타니 히후미가 있는 한, 나기사는 자신에게 아직 희망이 있다고 생각했다."
 trinity_events_nagisa.80.a: "지지대가 있는 나무가 어찌 강풍에 스러지겠는가"
 trinity_events_nagisa.81.t: "호국경"
 trinity_events_nagisa.81.desc.generic: "나기사는 이제 수백 번 이상 들여다 본 탓에 너덜너덜해진 일기장을 덮었다. 최근 들어 잊은 정치인을 다시 외는 속도보다, 잊는 속도가 늘어나고 있었다. 그녀는 '키리후지 나기사의 방어기제'가 이렇게나 강할 것이라고는 생각치 못했다. 어쩌면 이제 '기억하려 하는 일'을 포기해도 될 지 몰랐다. '소중한 사람을 지켜야 한다' 그리고, '내 소중한 사람들을 마지막까지 믿는다'. 나기사는 그를 위해서라면 무엇이라도 할 수 있었다. 그녀는 의심암귀의 어둠을 몰아냈고, 그녀에게는 히후미라는 소중한 친구가 있었으니까.\n\n나기사는 너덜너덜해진 일기장을 쓰레기통에 버리려 했다. 자신의 방어기제를 억지로 부러뜨릴 필요는 없었다. 치매가 온 것도, 사고에 문제가 생긴 것도 아니었다. 그저 믿기 어려운 이들을 머릿속에서 쉽게 지워버리고 있을 뿐이었으니까. 역으로 잘 된 일일지도 모른다. 이번 호국경 법안이 통과되고 나면 필리우스를 위하여 가혹한 선택을 해야 할 때가 올 지도 모른다. 그럴 때, 차라리 기억하지 못하는 편이 결정에 도움이 될 지 모른다.\n\n하지만, 어째서일까?\n\n나기사는 일기장을 버리지 못했다. 마치 이 안에 버려서는 안 되는 무언가가 남아 있는 것처럼."
 trinity_events_nagisa.81.desc.seia: "나기사는 이제 수백 번 이상 들여다 본 탓에 너덜너덜해진 일기장을 덮었다. 최근 들어 잊은 정치인을 다시 외는 속도보다, 잊는 속도가 늘어나고 있었다. 그녀는 '키리후지 나기사의 방어기제'가 이렇게나 강할 것이라고는 생각치 못했다. 어쩌면 이제 '기억하려 하는 일'을 포기해도 될 지 몰랐다. '소중한 사람을 지켜야 한다' 그리고, '내 소중한 사람들을 마지막까지 믿는다'. 나기사는 그를 위해서라면 무엇이라도 할 수 있었다. 그녀는 의심암귀의 어둠을 몰아냈고, 그녀에게는 히후미와 세이아라는 소중한 친구들이 있었으니까.\n\n나기사는 너덜너덜해진 일기장을 쓰레기통에 버리려 했다. 자신의 방어기제를 억지로 부러뜨릴 필요는 없었다. 치매가 온 것도, 사고에 문제가 생긴 것도 아니었다. 그저 믿기 어려운 이들을 머릿속에서 쉽게 지워버리고 있을 뿐이었으니까. 역으로 잘 된 일일지도 모른다. 이번 호국경 법안이 통과되고 나면 필리우스를 위하여 가혹한 선택을 해야 할 때가 올 지도 모른다. 그럴 때, 차라리 기억하지 못하는 편이 결정에 도움이 될 지 모른다.\n\n하지만, 어째서일까?\n\n나기사는 일기장을 버리지 못했다. 마치 이 안에 버려서는 안 되는 무언가가 남아 있는 것처럼."
 trinity_events_nagisa.81.a: "잊어서는 안 되는"
 trinity_events_nagisa.82.t: "보충수업부"
 trinity_events_nagisa.82.desc.generic: "[ROOT.GetLeader] 님, 구호기사단장 아오모리 미네입니다.\n\n거두절미하고 말씀드리죠.\n\n저는 티파티의 동의를 얻은 소위 '형벌부대' 방안에 동의하지 않으며, 이것이 범죄자들을 갱생시키는 '교육기관'이라는 정부의 공식적인 판단에도 동의하지 않습니다.\n\n존경하는 [ROOT.GetLeader] 님께서도 이해하시겠지만, 정부는 군 복무가 실제로 신성한 의무가 아니라는 것을 알고 있다고 하더라도, 적어도 신성한 척이라도 해야 하는 조직입니다. 우리 자신이 그렇게 믿어야 군에서 복무하는 일반 대중들이 군을 신뢰하고, 사명감을 가질 수 있기 때문입니다.\n\n하지만 그 어떠한 이유 때문이든 군이 '처벌 수단'이 되는 순간, 국민들은 이렇게 생각하게 됩니다. 우리 정부는 군대 가는 사람들을 '벌 받으러 가는 거구나' 라고 생각해. ...군대가 벌 받는 장소가 되었는데, 어찌 '벌 받으러 온' 사병들이 군에 사명감을 가질 수 있겠습니까?\n\n이미 가결된 법안을 철회할 수는 없다는 것을 압니다. 하지만, 이 규정이 사문화된 채 남을 수 있게 해 주십시오. 그것이 트리니티에 대한 구호이며, 우리 정신에 대한 구호이고, 군에 대한 구호입니다."
 trinity_events_nagisa.82.desc.nagisa: "[ROOT.GetLeader] 님, 구호기사단장 £GFX_blank_texticon_2 £GFX_blank_texticon_4 입니다.\n\n거두절미하고 말씀드리죠.\n\n저는 티파티의 동의를 얻은 소위 '형벌부대' 방안에 동의하지 않으며, 이것이 범죄자들을 갱생시키는 '교육기관'이라는 정부의 공식적인 판단에도 동의하지 않습니다.\n\n존경하는 [ROOT.GetLeader] 님께서도 이해하시겠지만, 정부는 군 복무가 실제로 신성한 의무가 아니라는 것을 알고 있다고 하더라도, 적어도 신성한 척이라도 해야 하는 조직입니다. 우리 자신이 그렇게 믿어야 군에서 복무하는 일반 대중들이 군을 신뢰하고, 사명감을 가질 수 있기 때문입니다.\n\n하지만 그 어떠한 이유 때문이든 군이 '처벌 수단'이 되는 순간, 국민들은 이렇게 생각하게 됩니다. 우리 정부는 군대 가는 사람들을 '벌 받으러 가는 거구나' 라고 생각해. ...군대가 벌 받는 장소가 되었는데, 어찌 '벌 받으러 온' 사병들이 군에 사명감을 가질 수 있겠습니까?\n\n이미 가결된 법안을 철회할 수는 없다는 것을 압니다. 하지만, 이 규정이 사문화된 채 남을 수 있게 해 주십시오. 그것이 트리니티에 대한 구호이며, 우리 정신에 대한 구호이고, 군에 대한 구호입니다."
 trinity_events_nagisa.82.a: "부디 기억해 주시기를."
 trinity_events_nagisa.83.t: "귀족 작위 분배"
 trinity_events_nagisa.83.desc: "트리니티의 고결한 전통을 유지하기 위하여, [ROOT.GetNameDef] 측의 중요 인사들에게 작위를 수여하고 그 작위를 영구히 세습할 수 있게 하고자 한다. [ROOT.GetLeader] 님의 동의에 따라, 작위의 수여는 다음과 같은 기준 아래에서 진행될 것이다.\n\n£white_dot 신분:\n귀족 신분은 독일 제국 시기의 작위를 사용한다. 수여되는 작위는 명예직이며, 실제 봉토나 특권이 부여되지는 않는다.\n\n£white_dot 공작위:\n각 기구의 가장 높은 직급을 보유한 자는 공작위를 수여한다. 시스터후드의 수녀원장, 정의실현부의 부장, 그 이외 호스트가 특별히 지정한 조직의 수장.\n\n£white_dot 후작 및 백작위: 수장에 미치지 못하나 트리니티의 중요 조직의 핵심적 인물들에게는 그 위치에 따라 후작에서부터 백작에 준하는 작위를 수여한다.\n\n£white_dot 기사 자격: 특별히 트리니티를 위하여 공헌한 장교 이상 군인 중, 특별히 추천 받은 이는 기사 자격을 부여한다."
 trinity_events_nagisa.83.a: "서명."
 
 # 나기사 BoP 이벤트
 trinity_events_nagisa_faction.1.t: "에덴의 승리를 기념하며"
 trinity_events_nagisa_faction.1.desc: "트리니티는 위대한 성공을 얻어냈다. 게헨나와 트리니티라는 두 경쟁 세력 중 영광의 트로피를 들어 올린 건, 바로 키리후지 나기사가 이끄는 영광스러운 트리니티였으니까. 중요한 것은 '나기사의 트리니티'가 얻은 승리라는 점이었다. 미카, 세이아, 또는 요한 분파나 시스터후드가 정권을 잡은 상태였다면 이런 승리를 거둘 수 있었을까? 필리우스는 입을 모아 말한다. '절대로 불가능'이라고. 그렇다면 이 영광스러운 승리, 나기사의 승리를 기념할 수 있는 예술품을 만들 필요가 있었다.\n\n트리니티는 다른 학원과는 다르다. 고상하고, 어느 때보다도 우아해야만 했다. 승리를 기념하는 군사 퍼레이드나 대규모 선전이 아닌, 나기사 한 사람을 위한 예술품을 진상하는 것이 에덴에서의 승리를 기념하는 가장 멋진 트로피가 될 것이다. '나기사를 위한 예술품을 만든다'는 목표는 세워졌다. 그렇다면 무엇을 만들어야 할까? 가장 보수적인 선택은 순수문학이다. 나기사를 찬양하기 위한 문학 작품을 만들자는 제안은 필리우스 안에서도 인기가 높다. 그리고 트리니티의 지식인들에게 전파할 수도 있고. 다만, 대중들에게 문학이 갖는 낮은 영향력으로 인해, 대중적인 선전 효과는 다소 떨어질 것이다.\n\n다른 제안은 대중예술이다. 그림, 또는 장르문학까지 범위를 넓여 키리후지 나기사를 찬양하는 예술품을 만들어 보자는 것이다. 이는 트리니티의 우아한 취미와는 다소 맞지 않을 수 있으나, 우리의 대중들이 훨씬 이해하기 쉽고, 또 많은 사람들에게 나기사의 위대함을 알릴 수 있을 것이다."
 trinity_events_nagisa_faction.1.a: "문학 작품을 의뢰한다."
 trinity_events_nagisa_faction.1.b: "대중 예술을 의뢰한다."
 trinity_events_nagisa_faction_1_tt: "§g문학 작품은 성공 확률이 높은 대신 낮은 긍정적 효과를, 대중 예술은 성공 확률이 낮은 대신 높은 긍정적 효과를 받습니다. 결과물은 120일 후 확인할 수 있습니다.§!"
 trinity_events_nagisa_faction.2.t: "문학적 성공 - 성녀의 발걸음"
 trinity_events_nagisa_faction.2.desc: "와일드헌트 예술학원의 사쿠라이 미요라는 소녀에게서 투고받은 전쟁 소설 '성녀의 발걸음'은 우리 트리니티의 가장 위대한 프로파간다 문학으로 남게 될 것이다. 성녀의 발걸음은 키리후지 나기사를 트리니티를 위해 무한히 스스로를 희생하는 '성녀'로, 그리고 나기사의 반대파들을 트리니티를 유혹하는 '독사'로서 비유한다. 대전이 직전부터 시작되는 이 소설은 나기사가 너무도 헌신적으로 자신의 삶을 트리니티를 위하여 바쳐 왔다는 사실을, 놀라울 정도의 호소력으로 독자들에게 전한다. 성녀의 발걸음은 뛰어난 밀리터리 지식을 기반으로, 티파티가 어떻게 외부의 적들을 나기사의 지휘 아래에 무력화하는지 상당한 문장력으로 묘사해냈다.\n\n키리후지 나기사는 자신에 대한 미요의 평가가 지나치게 높으며, 트리니티에 대한 묘사에 다소의 고증 오류가 있다는 것을 인정했다. 그러나 이 문학이 너무나도 아름답고, 또 나기사 자신을 우아하게 표현하고 있다는 점은 호평했다. 이 소설은 곧 트리니티의 교육 받은 세대에게 읽히기 위하여 대량 생산되기로 결정되었다. 앞으로 티파티의 감찰관들부터 정의실현부의 신입까지, 모두가 이 책을 필독서로서 읽게 될 것이다."
 trinity_events_nagisa_faction.2.a: "\"정말 아름답군요.\""
 trinity_events_nagisa_faction.3.t: "문학적 실패 - 체ㅔ강뱀파이어 슬레이어 나기사"
 trinity_events_nagisa_faction.3.desc: "쿠치키 슈라라는 소설가로부터 투고받은 문학 '체ㅔ강뱀파이어 슬레이어 나기사'는 완벽한 재앙이었다. 어째서 트리니티에서 이런 외부 집필자에게 소설을 맡길 결정을 한 것인지, 많은 관련자들이 문책을 받았을 정도였다. 이 소설은 사실 키리후지 나기사가 뱀파이어 슬레이어이며, 파테르 분파와 게헨나, 붉은겨울, 백귀야행, 밀레니엄, 산해경, 기타등등 모든 학원 학생들이 전부 뱀파이어라는 음모론을 제시한다. 대전이는 뱀파이어들이 태양을 지우기 위한 '체ㅔ강주술'의 일부였으며, 티파티는 수백 년의 역사를 가진 뱀파이어 헌터 조직이었다. 그리고 나기사는 매일 밤, 태양이 지면 정의의 성검 블러드-소울-헌터-저스티스-소울-블레이드를 들고 뱀파이어들을 퇴치했다.\n\n나기사는 전달받은 책을 읽는 동안 그 황당한 내용에 몇 번이고 웃었다. \"이 책은 분명 재미있지만, 대중들에게 읽히고 싶지는 않네요.\" 나기사는 그 책을 프로파간다용으로 뿌리는 대신, 자신의 개인 서재에 단 한 권만을 보관하기로 결정했다. 옳은 선택일지 모른다. 분명히, 키보토스 전체의 학원들과 외교 분쟁을 일으킬 내용이었으니까."
 trinity_events_nagisa_faction.3.a: "\"그런데, 최강을 '체ㅔ강'이라고 쓴 이유가 뭘까요?\""
 trinity_events_nagisa_faction.4.t: "대중예술의 성공 - 밀레니엄에서의 게임"
 trinity_events_nagisa_faction.4.desc: "밀레니엄의 UZQUEEN이라는 게임 디렉터에게 의뢰한 모바일 게임, '성기사 나기사'는 단순한 레트로 RPG 게임이지만, 그 단순함이 대중들을 매료했다. 게임의 내용은 놀라울 정도로 간단하다. 성기사인 키리후지 나기사가, 멋지게 트리니티의 적들을 하나씩 베어 나가며 성장하는 것. 이 게임은 복잡하고 깊이 있는 스토리를 전달하기보다는 나기사가 악당들을 물리치며 트리니티를 지킨다는 내용에만 집중한다. 레트로 게임을 추구한 탓에 조작감도 다소 불편하며, 게임의 몇몇 구간은 부조리할 정도로 어렵다는 평가도 받는다. 그럼에도 '성기사 나기사'는 \"유저들의 도전 정신을 불태우는 게임\"이라는 호평을 받으며 대중적 성공을 거두었다.\n\n키리후지 나기사 본인도 게임을 플레이하며, \"제가 트리니티의 적들을 물리치는 내용이 재미있네요.\" 라며 게임에 대한 호평을 남겼다. 게임은 티파티 주도로 인터넷에서 무료 배포되었으며, 현존하는 어떤 전자기기에도 호환되는 아주 단순한 저사양 게임이라는 것이 홍보 문구로 사용되었다. 이 게임은 대중들 사이에서 나기사의 이미지를 개선하는 데 매우 큰 도움이 될 것이다."
 trinity_events_nagisa_faction.4.a: "\"100KG 대마왕...? 이 사람은 도대체 누구죠?\""
 trinity_events_nagisa_faction.5.t: "대중예술의 실패 - 절대로 지지 않는 나기사 호스트"
 trinity_events_nagisa_faction.5.desc: "붉은겨울 연방학원의 가장 유명한 만화가인 메루리가 트리니티의 의뢰를 통해 제작한 만화, '절대로 지지 않는 나기사 호스트 vs 허접자코게헨나'는 아마 트리니티 역사상 가장 충격적인 만화가 될 것이다. 메루리는 키리후지 나기사가 게헨나를 상대로 얻은 승리에 놀라운 비밀이 숨겨져 있다는 것을 발견해냈다. 바로 사디스트 여왕님인 나기사가, 마코토 의장과 히나 선도부장과 격렬한... 밤의... 아무튼 그, 무언가를 해서 게헨나를 병합했다는 내용이다. 이 만화는 나기사가 어떻게 침실에서 게헨나를 '정복'했는지를 56페이지에 걸친 풀컬러 그림으로 묘사해 나간다.\n\n그 내용을 모른 채 메루리의 작품을 넘겨 받은 나기사는 티파티 회의실에서 만화를 읽던 중 의자에서 쓰러져 혼절했다. 뒤늦게 이 문제작을 확인한 시스터후드의 수녀들이 만화책에 성수를 뿌리고 퇴마 의식을 치렀으며, 사쿠라코 수녀원장이 직접 그 저주 받은 책을 금고에 담아 누구도 볼 수 없게 봉인했다. 이 만화의 원본 원고는 트리니티의 고서관 가장 깊숙한 곳에 보관될 것이며, 다시는, 그 누구도 이 사탄의 마도서에게 햇빛을 허락하는 날이 오지 않을 것이다."
 trinity_events_nagisa_faction.5.a: "\"...어떻게 제가, 그런 채찍을 쥐고...\""

 # 나기사 외교 이벤트
 trinity_events_nagisa_diplomacy.1.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.1.desc: "공동 치안 조직 협상은 그저 시작일 뿐이었습니다. [TRM.GetLeader] 측은 [GEH.GetLeader] 측에게 본격적으로 '에덴 조약의 재협상'을 제안했습니다. 이는 [TRM.GetNameDef] 정부와 [GEH.GetNameDef] 정부 사이의 불가침조약 및 상호 독립 보장을 의미하는 협상입니다. 우리가 여기에 동의한다면, 협상의 세부적인 내용을 검토하기 위하여 실무자 회의가 이어질 예정입니다."
 trinity_events_nagisa_diplomacy.1.a: "협상을 시작하자"
 trinity_events_nagisa_diplomacy.1.b: "아니, 나는 나기사의 의도를 짐작할 수가 없어..."
 trinity_events_nagisa_diplomacy.2.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.2.desc: "우리의 협상 제안을 [GEH.GetLeader] 측이 받아들임에 따라, 에덴 조약을 맺기 위한 실무자 협상이 시작되었습니다. 판데모니움 소사이어티, 그리고 파테르 분파는 이 협상을 방해하기 위하여 모든 노력을 다할 것입니다. 결코, 물러나서는 안 됩니다. 트리니티와 게헨나 두 학원의 평화를 지킬 수 있는 것은 이제는 [ROOT.GetLeader] 밖에 없습니다."
 trinity_events_nagisa_diplomacy.2.a: "협상을 시작하자"
 trinity_events_nagisa_diplomacy.3.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.3.desc: "[ROOT.GetName] 정보부는 트리니티와 게헨나 선도부 사이에서 에덴 조약을 다시 추진하기 위한 움직임을 감지했습니다. 이미 실무자들이 협상을 시작했으며, 두 학원 사이의 상호 독립 보장 및 불가침 조약을 위한 세부 조항들을 정리하고 있습니다.\n\n만약 에덴 조약이 정말로 맺어진다면, 우리는 트리니티와 선도부 두 세력의 연합된 힘과 맞서 싸워야만 합니다. 그것은 우리 안보에 있어서는 재앙이나 다름 없는 상황입니다. 공작원들을 이용해 어떠한 대가를 치러서라도 이 협상을 막아내야만 합니다. 반드시!"
 trinity_events_nagisa_diplomacy.3.a: "에덴 동산의 결말이 어떻게 끝났는지 알려주마"
 trinity_events_nagisa_diplomacy.4.t: "에덴 조약 실패"
 trinity_events_nagisa_diplomacy.4.desc: "누가 범인이었을까요? 파테르 분파의 소행일 수도 있습니다. 어쩌면 판데모니움 소사이어티의 공작원들이 벌인 소동일 수도 있겠죠. 우리들의 협상은 이상할 정도로 지지부진했습니다. 두 학원 사이를 오가는 동안 서로를 비방하는 가짜 뉴스들이 계속해서 퍼졌고, 게헨나와 트리니티의 일반 대중들은 두 학원의 평화 조약을 방해하는 시위를 계속해서 벌였습니다.\n\n결국 협상 장소에서 사제 폭탄이 폭발하는 기록적인 사건을 통해 에덴 조약은 공식적으로 중단되었습니다. 트리니티와 게헨나 선도부의 상층부는 테러의 주범이 서로가 아니라는 것을 알고 있었기에, 테러 이후 서로를 위로했습니다. 그러나 이 테러로 인해 중단된 협상을 다시 재개할 수는 없었습니다.\n\n언젠가 두 학원이 다시 평화를 위해 손을 잡을 날이 올 수 있을 수도 있습니다. 하지만, 그게 오늘은 아닌 것 같습니다."
 trinity_events_nagisa_diplomacy.4.a: "절망적이다..." # 4~5 트리니티/선도부
 trinity_events_nagisa_diplomacy.6.a: "아주 멋진 날이야, 그렇지 않나?" # 6 판데모니움 소사이어티
 trinity_events_nagisa_diplomacy.7.t: "[GEH.GetName]의 협상 거부"
 trinity_events_nagisa_diplomacy.7.desc: "[GEH.GetLeader]와 우리 사이의 우정에 어떤 문제가 있었던 것일까요? 놀랍고도 충격적이게도, [GEH.GetLeader] 측은 경찰 치안 조직의 공유 이상으로 에덴 조약을 확장하는 것을 거부했습니다. 이 조약이 두 학원 지도자들의 우정과 선의로 이루어졌다는 점에서, 그 선의가 무너진 지금 협상을 다시 시작할 수 있는 방법은 존재하지 않습니다."
 trinity_events_nagisa_diplomacy.7.a: "이거, 멀티플레이 맞죠? AI 히나는 절대 이 선택지를 누르지 않는데."
 trinity_events_nagisa_diplomacy.8.t: "에덴 조약 성공"
 trinity_events_nagisa_diplomacy.8.desc: "오늘은 [GEH.GetName] 측과 [TRM.GetName] 측 양쪽에 최고의 날입니다. 총학생회장이 남긴 에덴 조약이 결실을 맺고, 공식적으로 두 지도자들에 의하여 서명되면서 두 학원은 서로의 항구적 평화, 그리고 [GEM.GetName] 측과의 공동 전선을 꾸리기로 결정했습니다. 게헨나와 트리니티 두 학원의 오랜 라이벌 관계에도 불구하고 두 학원의 이성적인 지도자들은 서로의 차이점을 줄여 나갈 수 있는 가장 좋은 방법을 찾아낸 것 같습니다.\n\n물론 이 소식은 [GEM.GetLeader] 측에게는 절망적인 이야기일 것입니다. [GEM.GetName] 정부는 이제 고립되었으며, [GEM.GetLeader]의 '게헨나 통일'이라는 꿈은 실현에서 아주 멀어진 것으로 보입니다."
 trinity_events_nagisa_diplomacy.8.a: "우리의 우정에 건배." # 8~9 트리니티/선도부
 trinity_events_nagisa_diplomacy.10.a: "게헨나의 배신자 놈들!" # 10 판데모니움 소사이어티
 trinity_events_nagisa_diplomacy.11.t: "하누마 라인"
 trinity_events_nagisa_diplomacy.11.desc: "명백하게 대전이 직전 판데모니움 소사이어티의 의장이었던 하누마 마코토의 이름을 따서 지어진 이 요새망 계획은, 트리니티의 [TRM.GetLeader] 측으로부터 전달되었습니다. 트리니티는 [GEM.GetName]의 전쟁 기계들이 동방으로 침공해 올 날이 가까워지고 있다는 것을 우려합니다. 그녀의 방어 계획인 하누마 라인은 우리의 중요 거점 지역에 요새망을 설치해, [GEM.GetLeader]의 침공이 시작되었을 때, 그들의 공격이 거점 지역에서 돈좌되도록 고안되었습니다. 비록 이 요새망 프로젝트는 상당한 예산과 시간이 소모될 것으로 보이며, 실전성이 있는지 여부도 다소 논쟁거리일 것으로 보입니다. 하지만 논의할 가치는 있습니다."
 trinity_events_nagisa_diplomacy.11.a: "이해했어."
 trinity_events_nagisa_diplomacy.12.t: "연방제 통일 가능성?"
 trinity_events_nagisa_diplomacy.12.desc: "[GEM.GetName] 측이 멸망한 이후, 남은 것은 에덴 조약의 성공으로 인해 깊은 우정을 쌓게 된 [GEH.GetName] 측과 [TRM.GetName] 측 두 개의 세력 뿐입니다. 우리는 지금의 에덴 조약을 더욱 확장시켜 트리니티와 게헨나 사이의 연방제 통일을 이루어 낼 수도 있지 않을까요?"
 trinity_events_nagisa_diplomacy.12.a: "협상을 시작한다."
 trinity_events_nagisa_diplomacy.12.b: "아니, 분열된 채 분리하는 게 낫다."
 trinity_events_nagisa_diplomacy.13.t: "트리니티-게헨나 연방제 통일"
 trinity_events_nagisa_diplomacy.13.desc: "오늘은 트리니티 역사에서 다시 없을 기적 같은 날입니다. 오늘은 공식적인 트리니티의 국경일로 선포되었고, 갑자기 생긴 휴일을 맞이해 트리니티의 모든 관공서와 공기업들이 문을 닫았습니다. 티파티 회의실에서 열린 파티장에서 소라사키 히나는 \"두 학원간 연방의 우정\"을 축하했습니다. 이런 성공을 다른 누가 이끌 수 있었을까요? 나기사에게 오늘은 다시 일어나지 않을 기적 같은 성공이었습니다.\n\n트리니티 호스트실은 공식적인 발표를 통해, 트리니티와 게헨나 두 학원이 연방제 형태로 통일을 이루었음을 선언했습니다. 두 학원이 각자 정의실현부와 선도부라는 군대를 보유한다는 점에서 이는 완벽한 통일이라기보다는 국가연합에 가깝지만, 두 학원은 '서로의 갈등과 오해가 완전히 치유되고, 일반 대중들까지 서로를 이해할 수 있게 되는' 시점에서 두 군사 조직이 하나로 통합될 것이라고 약속했습니다. 연방제 통일 조건에 따라, 게헨나와 트리니티는 여전히 각자 정부를 갖고, 황륜대제와 같은 국제 스포츠 대회에서는 각자 팀을 보냅니다. 그러나 외교권은 트리니티에 귀속되며, 두 국가 두 체제가 아닌 한 국가 두 체제 '일국양제'라는 것을 분명히 했습니다."
 trinity_events_nagisa_diplomacy.13.a: "복잡하지만, 트리니티 주도의 통일이라는 게 중요하다."
 trinity_events_nagisa_diplomacy.14.t: "트리니티-게헨나 연방 논의의 좌초"
 trinity_events_nagisa_diplomacy.14.desc: "트리니티와 게헨나의 연방제 통일안이 논의되었으나, 선도부 측은 '분리되어 번영하는' 2국가 2체제 안을 더욱 선호하는 것으로 보입니다. 우리는 서로의 자치권에 대한 더 깊은 논의를 거쳐, '에덴 합중국' 통일안을 통해 다시 한 번 통일을 주장할 수도 있습니다. 그러나 현재로서는, 연방제 논의는 실패했습니다."
 trinity_events_nagisa_diplomacy.14.a: "에덴 합중국이 대안이 될 수 있을까?"
 trinity_events_nagisa_diplomacy.15.t: "우리를 총학생회장으로 인정하는 [FROM.GetName]"
 trinity_events_nagisa_diplomacy.15.desc: "[FROM.GetName] 측은 베네룩스 문제에서 우리의 협조를 받고자 합니다. [FROM.GetName] 측과 [ROOT.GetName] 측이 군사 동맹을 맺고, 우리는 [FROM.GetAdjective]의 안보를 위한 도움을 주는 것입니다. 그들은 '[FROM.GetAdjective] 측에게 우호적인 새로운 총학생회'를 손에 넣고자 하는 것으로 보입니다. 물론 이것을 받아들이는 것이 우리에게 이로워 보입니다. 우리의 급진적 68혁명과 트리니티 필리우스 분파의 사회보수주의적 면모는 잘 맞지 않습니다. 우리가 그들과 대립하는 것은, [FROM.GetLeader] 측이 우리를 침공하겠다는 결단을 내리는 도화선이 될 수도 있습니다.\n\n물론 이것이 우리의 기회일지도 모르죠. 68혁명의 자유주의 기치를 룩셈부르크 시에서부터 에덴까지 전파할 수 있는, 다시 오지 않을 기적과도 같은 기회요."
 trinity_events_nagisa_diplomacy.15.a: "아니, 트리니티와는 손을 잡는 게 맞아."
 trinity_events_nagisa_diplomacy.15.b: "우리는 그들의 도움이 필요하지 않는데?"
 trinity_events_nagisa_diplomacy.16.t: "[FROM.GetName]의 제안 승낙"
 trinity_events_nagisa_diplomacy.16.desc: "[FROM.GetName] 측은 우리와의 군사 동맹을 승인했습니다. 이로서 우리는 '총학생회장을 같은 편으로 둔' 키보토스 학원 국가가 되었습니다. 이런 승리가 쉽게 오는 것은 아니지요. 전부 [ROOT.GetLeader]의 외교적 능력 덕분입니다."
 trinity_events_nagisa_diplomacy.16.a: "호스트를 찬양하라!"
 trinity_events_nagisa_diplomacy.17.t: "[FROM.GetName]의 제안 거부"
 trinity_events_nagisa_diplomacy.17.desc: "[FROM.GetName] 측은 우리와의 군사 동맹을 거부했습니다. 아무래도, 전쟁 이외에 다른 방법은 없는 것 같습니다."
 trinity_events_nagisa_diplomacy.17.a: "룩셈부르크를 공격한다."
 trinity_events_nagisa_diplomacy.17.b: "이 참에 베네룩스 전체를 침공하자!"
 trinity_events_nagisa_diplomacy.17.c: "아니. 베네룩스는 버려도 상관 없잖아."
 trinity_events_nagisa_diplomacy.18.t: "[FROM.GetName]의 보호령 제안"
 trinity_events_nagisa_diplomacy.18.desc: "[FROM.GetName] 측은 [ROOT.GetName] 측이 스스로를 보호할 수 없다고 주장합니다. 그들은 에스파냐 정부가 가지고 있는 편집증적인 이계-볼셰비즘 주장에 맞서 우리가 독립을 유지하는 것이 어렵다고 생각하며, 우리의 도움이 독립을 유지하는 데 필수불가결하다고 말합니다. 하지만, 그들의 부하가 되는 것을 진정한 독립이라고 말 할 수 있을까요? 우리에게는 거부할 권리가 있으나 그 이후 [FROM.GetName] 측의 공격이 이어질 우려가 있습니다."
 trinity_events_nagisa_diplomacy.18.a: "올테면 와라, 광신도들아."
 trinity_events_nagisa_diplomacy.18.b: "굴복하는 수밖에."
 trinity_events_nagisa_diplomacy.19.t: "[FROM.GetName]의 제안 승낙"
 trinity_events_nagisa_diplomacy.19.desc: "[FROM.GetName] 측은 우리의 보호 제안을 승인했습니다. 이런 승리가 쉽게 오는 것은 아니지요. 전부 [ROOT.GetLeader]의 외교적 능력 덕분입니다."
 trinity_events_nagisa_diplomacy.19.a: "호스트를 찬양하라!"
 trinity_events_nagisa_diplomacy.20.t: "[FROM.GetName]의 제안 거부"
 trinity_events_nagisa_diplomacy.20.desc: "[FROM.GetName] 측은 우리의 보호 제안을 거부했습니다. 그들은 우리의 침공 가능성을 예상하고 있으며, 아마 독립을 위해 마지막까지 싸울 것입니다. 우리가 [FROM.GetName] 측과 싸울 필요가 있을까요? 와일드헌트의 아름다운 예술들은 전쟁의 화마에 휩쓸리지 않은 채 그 자리에서 보호받을 가치가 있지 않을까요?"
 trinity_events_nagisa_diplomacy.20.a: "우리의 대답은 전쟁이다."
 trinity_events_nagisa_diplomacy.20.b: "그들은 놀라운 용기를 보여줬고, 우리는 그들을 존중한다."
 trinity_events_nagisa_diplomacy.21.t: "Code: BOX - 사절단 준비"
 trinity_events_nagisa_diplomacy.21.desc: "\"밀레니엄 방문은 그저 관광이 아닙니다. 우리가 새로운 기술을 보고 배우며...\"\n\n트리니티 내부 회의는 무거운 분위기 속에서 진행되었다. 트리니티는 밀레니엄을 공격하는 것이 아닌, 그들에게서 배워야 한다. 그 결정이 내려지고 난 뒤 격렬한 논쟁이 있었으나, 결국 시스터후드는 티파티의 결정을 따르기로 했다. 이제는 누가 사절단의 대표가 되어야 할 것인지가 논의 대상이 되었다.\n\n파테르 분파는 '미소노 미카가 사절단을 이끌어야 한다'고 주장하였으나, 필리우스의 정적에게 정치적 치적을 쌓아 주는 일을 티파티가 승인할 가능성은 없었다. 가장 합리적인 대안은 필리우스 분파의 지도자인 키리후지 나기사였다. 그녀라면 밀레니엄에서 트리니티의 이름을 분명 빛낼 수 있을 것이다.\n\n정의실현부가 파견되어야 한다는 주장도 있었다. 티파티의 직속 치안 및 군사 조직이기에, 외국으로 파견할 수 있는 믿을 수 있는 조직이기도 했다. 정의실현부가 아닌 누가 이 중대한 임무를 경건하게 받아들이곘는가? 특히, 차분하고 인내심 강한 성격으로 알려진 나카마사 이치카가 적임자로 떠오르고 있었다.\n\n그 다음 대안은 요한 분파의 수장인 아오모리 미네였다. 구호기사단은 의료 조직이기에 언제나 새로운 지식, 새로운 기술에 열려 있는 태도를 보여 왔다. 그녀들이 많은 사람들을 구호할 수 있었던 이유는 뛰어난 의료 기술을 언제나 가장 빨리 받아들였기 때문이니까.\n\n마지막으로, 파테르 분파는 미카를 보낼 수 없다면 대안으로서 옛 게헨나 선도부 선임행정관이자 현 티파티 감찰관 아마우 아코를 파견할 것을 요구하고 있다. 파테르 분파의 생각은 트리니티의 우아한 관습을 모르는 '무식한 게헨나 촌놈'이 해외 외교에서 망신을 당하고 오라는 의미였지만, 아코가 게헨나에서 여러 외교 업무를 대리했다는 점을 보자면, 그녀 역시 밀레니엄으로 보내는 사절 직책을 수행할 기본 소양은 갖추고 있다.\n\n물론, 최종 결정권은 [ROOT.GetLeader]의 펜 끝에 달려있다."
 trinity_events_nagisa_diplomacy.21.a: "나기사, 제가 솔선수범하지 않으면, 누가 나서겠습니까?"
 trinity_events_nagisa_diplomacy.21.b: "이치카, 정의실현부는 많은 것을 배울 수 있습니다."
 trinity_events_nagisa_diplomacy.21.c: "미네, 구호기사단은 언제나 가장 좋은 답을 가져왔습니다."
 trinity_events_nagisa_diplomacy.21.d: "아코, 새 감찰관이 뛰어난 성과를 가져 올 것입니다."
 trinity_events_nagisa_diplomacy.22.t: "Code: BOX - 1일차"
 trinity_events_nagisa_diplomacy.22.desc.nagisa: "키리후지 나기사의 밀레니엄 엑스포 일정 1일차. 다양한 밀레니엄제 게임 및 게임기를 홍보하는 '전자오락관'에 들어선 순간, 나기사는 안에서부터 느껴지는 비릿한 피냄새를 느꼈다. 밀레니엄에서는 한 번도 느낀 적 없는, 이곳에서 맡아서는 안 되는 냄새였다. \"...게임관에... 피라고요?\" 원인은 몇 걸음 걷지 않아도 바로 알 수 있었다.\n\n\"당신들 밀레니엄 때문에 이런 쓰레기 같은 게임을 하게 됐잖아!\" \"나는 당신들에게 게임 추천해 준 적 없어요!\" \"으아앙! 그만 싸워! 그만!\"\n\n고전 게임 부스 앞에서, 수십 명의 두 학원 학생들이 서로에게 의자를 휘두르며 싸우고 있었다. 마치 서로가 서로를 증오하라는 명령을 받기라도 한 것처럼, 상대방의 머리가 깨지고 푸른 바닥에 붉은 피가 퍼져나가도록 몇 번이고 의자를 내려 찍어대고 있었다. 나기사는 가벼운 현기증을 느꼈다. 손님으로서 온 트리니티 학생들이, 우아한 모습을 보이기는커녕 밀레니엄 학생들과 싸우고 있다니, 믿을 수가 없었다.\n\n\"나기사 님, 이곳은 위험합니다. 어서 피하시는 게...\"\n나기사는 고개를 저었다. \"아니요, 저는 이 사태를 책임 질 의무가 있습니다. 트리니티의 여러분, 이런 무례한 행동은 밀레니엄에 대한...\"\n\n나기사의 말은 끝나지 못했다. 트리니티 학생 한 명이 집어 던진 의자가 그대로 포물선을 그으며 날아온 탓이다. 빡-! 하는 폭력적인 소리와 함께, 나기사는 자신의 몸이 바닥에 내동댕이쳐지는 것을 느꼈다. 비명, 고함 소리, 그리고 삐이익 귀의 이명 소리가 세상을 채웠다. 순간 무슨 일이 일어난 것인지도 알 수 없었다. 입에서부터 피가 쏟아졌다. 그녀의 순백색 숏 케이프가 나기사 자신의 혈액으로 물들어가고 있었다.\n\n'맞았다고요? 제가?'\n\n나기사는 자신이 온화한 성격이라고 생각했다. 하지만, 다른 학원도 아닌 자교의 학생에게 얼굴을 맞은 순간, 나기사는 자신이 스스로 생각하는 것만큼 '온화'하지 않다는 걸 느꼈다.\n\n나기사의 이성은 이 학생들이 지금 제정신이 아닐 가능성을 경고하고 있었다. 침착하게 경호원들을 지휘해 이 사건의 원인을 찾아야 한다고. 하지만 그녀의 감정은... 권총 '로얄 블렌드'를 뽑아 저 여학생에게 겨누고 쏘라고 외치고 있었다."
 trinity_events_nagisa_diplomacy.22.desc.ichika: "나카마사 이치카의 밀레니엄 엑스포 일정 1일차. 다양한 밀레니엄제 게임 및 게임기를 홍보하는 '전자오락관'에 들어선 순간, 이치카는 안에서부터 느껴지는 비릿한 피냄새를 느꼈다. 밀레니엄에서는 한 번도 느낀 적 없는, 이곳에서 맡아서는 안 되는 냄새였다. \"...이거, 위험한 거 아님까?\" 원인은 몇 걸음 걷지 않아도 바로 알 수 있었다.\n\n\"당신들 밀레니엄 때문에 이런 쓰레기 같은 게임을 하게 됐잖아!\" \"나는 당신들에게 게임 추천해 준 적 없어요!\" \"으아앙! 그만 싸워! 그만!\"\n\n고전 게임 부스 앞에서, 수십 명의 두 학원 학생들이 서로에게 의자를 휘두르며 싸우고 있었다. 마치 서로가 서로를 증오하라는 명령을 받기라도 한 것처럼, 상대방의 머리가 깨지고 푸른 바닥에 붉은 피가 퍼져나가도록 몇 번이고 의자를 내려 찍어대고 있었다. 이치카는 가벼운 현기증을 느꼈다. 손님으로서 온 트리니티 학생들이, 우아한 모습을 보이기는커녕 밀레니엄 학생들과 싸우고 있다니, 믿을 수가 없었다.\n\n\"이치카 님, 이곳은 위험합니다. 어서 피하시는 게...\"\n이치카는 고개를 저었다. \"뭐 괜찮슴다. 이런 문제 해결하라고 사절로 보내진 거 아니겠슴까?\" 이치카는 그대로 싸움 중인 학생들에게 다가갔다. \"자, 다들 진정들 하시고...\"\n\n이치카의 말은 끝나지 못했다. 트리니티 학생 한 명이 싸움판에 끼어든 이치카의 얼굴에 주먹을 날린 탓이다. 빡-! 하는 폭력적인 소리와 함께, 이치카는 자신의 몸이 바닥에 내동댕이쳐지는 것을 느꼈다. 비명, 고함 소리, 그리고 삐이익 귀의 이명 소리가 세상을 채웠다. 순간 무슨 일이 일어난 것인지도 알 수 없었다. 코피가 바닥에 뚝, 뚝 떨어졌다.\n\n'아, 이런 걸 죽빵이라고 했던 거 같슴다. 신선하네요.'\n\n이치카는 바닥을 짚고 일어났다. 머리가 이상할 정도로 맑고 명료했다. 말로 이것들을 막는 대신, 자신의 돌격소총 '레드 드래곤'을 겨누고, 사방에 마구 갈겨버리면 되는 것 아니었을까. 왜 이 바보들을 상대로 길고 현학적인 설득을 하려고 했던 걸까? 이치카는 손등으로 계속 흐르는 피를 닦아냈다."
 trinity_events_nagisa_diplomacy.22.desc.mine: "아오모리 미네의 밀레니엄 엑스포 일정 1일차. 다양한 밀레니엄제 게임 및 게임기를 홍보하는 '전자오락관'에 들어선 순간, 미네는 안에서부터 느껴지는 비릿한 피냄새를 느꼈다. 밀레니엄에서는 한 번도 느낀 적 없는, 이곳에서 맡아서는 안 되는 냄새였다. \"...피? 이곳은 단순한 게임관이라고 들었습니다만...\" 원인은 몇 걸음 걷지 않아도 바로 알 수 있었다.\n\n\"당신들 밀레니엄 때문에 이런 쓰레기 같은 게임을 하게 됐잖아!\" \"나는 당신들에게 게임 추천해 준 적 없어요!\" \"으아앙! 그만 싸워! 그만!\"\n\n고전 게임 부스 앞에서, 수십 명의 두 학원 학생들이 서로에게 의자를 휘두르며 싸우고 있었다. 마치 서로가 서로를 증오하라는 명령을 받기라도 한 것처럼, 상대방의 머리가 깨지고 푸른 바닥에 붉은 피가 퍼져나가도록 몇 번이고 의자를 내려 찍어대고 있었다. 미네는 가벼운 현기증을 느꼈다. 손님으로서 온 트리니티 학생들이, 밀레니엄 학생들과 싸우고 있다니, 믿을 수가 없었다.\n\n\"미네 님, 이곳은 위험합니다. 어서 피하시는 게...\"\n미네는 고개를 저었다. \"저는 트리니티 사절의 대표로서 왔습니다. 이 무도한 광경을 제지해야 할 의무가 있고요.\" 미네는 그대로 싸움 중인 학생들에게 다가갔다. \"여러분. 진정하십시오. 이 어찌 무례한...\"\n\n미네의 말은 끝나지 못했다. 트리니티 학생 한 명이 싸움판에 끼어든 미네의 얼굴에 주먹을 날린 탓이다. 빡-! 하는 폭력적인 소리와 함께, 미네는 자신의 몸이 바닥에 내동댕이쳐지는 것을 느꼈다. 비명, 고함 소리, 그리고 삐이익 귀의 이명 소리가 세상을 채웠다. 순간 무슨 일이 일어난 것인지도 알 수 없었다. 코피가 바닥에 뚝, 뚝 떨어졌다.\n\n'...방심했군요. 구호기사단의 단장인 제가, 얼굴을 주먹으로...?'\n\n미네는 바닥을 짚고 일어났다. 머리가 이상할 정도로 맑고 명료했다. 어째서 싸움이 일어난 것인지는 모르겠다. 하지만 이 바보들에게는 말이 아닌 다른 방식으로 '구호'를 전해 줄 필요가 있을 것 같다. 왜 이 바보들을 상대로 길고 현학적인 설득을 하려고 했던 걸까? 미네는 손등으로 계속 흐르는 피를 닦아냈다."
 trinity_events_nagisa_diplomacy.22.desc.ako: "아마우 아코의 밀레니엄 엑스포 일정 1일차. 다양한 밀레니엄제 게임 및 게임기를 홍보하는 '전자오락관'에 들어선 순간, 아코는 안에서부터 느껴지는 비릿한 피냄새를 느꼈다. 밀레니엄에서는 한 번도 느낀 적 없는, 이곳에서 맡아서는 안 되는 냄새였다. \"...하. 설마, 진짜 피 냄새는 아니겠죠...\" 하지만, 진짜 피 냄새였다는 건 금방 알 수 있었다.\n\n\"당신들 밀레니엄 때문에 이런 쓰레기 같은 게임을 하게 됐잖아!\" \"나는 당신들에게 게임 추천해 준 적 없어요!\" \"으아앙! 그만 싸워! 그만!\"\n\n고전 게임 부스 앞에서, 수십 명의 두 학원 학생들이 서로에게 의자를 휘두르며 싸우고 있었다. 마치 서로가 서로를 증오하라는 명령을 받기라도 한 것처럼, 상대방의 머리가 깨지고 푸른 바닥에 붉은 피가 퍼져나가도록 몇 번이고 의자를 내려 찍어대고 있었다. 아코는 가벼운 현기증을 느꼈다. 그래. 제대로 된 업무를 줄 거라고는 기대도 안 했지.\n\n\"아코 님, 이곳은 위험합니다. 어서 피하시는 게...\"\n아코는 조용히 자신의 권총인 핫 샷을 꺼내 들었다. \"됐어요. 이런 범죄, 행정관이던 시절부터 많이 봐 왔으니까요. 지금 진정시키고, 싸움의 원인을 묻도록 하겠습니다.\" 아코는 그대로 싸움 중인 학생들에게 다가갔다. \"티파티 감찰관, 아마우 아코입니다. 이 무례한 행동을 당장 중단...\"\n\n아코의 말은 끝나지 못했다. 트리니티 학생 한 명이 집어 던진 의자가 그대로 포물선을 그으며 날아온 탓이다. 빡-! 하는 폭력적인 소리와 함께, 아코는 자신의 몸이 바닥에 내동댕이쳐지는 것을 느꼈다. 비명, 고함 소리, 그리고 삐이익 귀의 이명 소리가 세상을 채웠다. 순간 무슨 일이 일어난 것인지도 알 수 없었다. 입에서부터 피가 쏟아졌다. 그녀의 순백색 숏 케이프가 아코 자신의 혈액으로 물들어가고 있었다.\n\n'...하아...? 피?'\n\n아코는 바닥을 짚고 일어났다. 감히 자신의 얼굴에 의자를 던져? 아코는 머리가 뜨거워지는 것을 느꼈다. 옛 행정관의 이성은 이 학생들이 지금 제정신이 아닐 가능성을 경고하고 있었다. 침착하게 경호원들을 지휘해 이 사건의 원인을 찾아야 한다고. 하지만 그녀의 감정은... 권총 '핫 샷'를 뽑아 저 여학생에게 겨누고 쏘라고 외치고 있었다."
 trinity_events_nagisa_diplomacy.22.a: "방아쇠를 당긴다."
 trinity_events_nagisa_diplomacy.22.b: "그녀들은 제정신이 아니다. 최대한의 인내심을 발휘한다."
 trinity_events_nagisa_diplomacy.23.t: "Code: BOX - 4일차"
 trinity_events_nagisa_diplomacy.23.desc.nagisa: "밀레니엄 엑스포 시설 지하도는 좁고 어두컴컴했다. 신발조차 벗겨져 어디론가로 사라진 상태로, 나기사는 맨발로 쿠로사키 코유키의 뒤를 따라 달리며 발바닥의 찢어질 것 같은 고통을 참았다. 등 뒤에서 쏟아지는 총탄 때문에 나기사의 숏 케이프는 너덜너덜했고, 그녀의 날개는 붉게 물들어가고 있었다. 코유키는 이 모든 상황이 그저 즐거운 듯 '니하하' 웃고만 있을 뿐이었지만.\n\n\"하아, 하아... 밀레니엄은, 이런 식으로 국빈 방문자를 대우합니까?!\"\n\"니하하! 아니, 딱히 이러려던 건 아니었는데요. 횡령으로 빼간 돈 기록 좀 지우려고 하다보니까, 갑자기 경비 오토마톤들이 총을 쏘기 시작해서...\"\n\"그래서 그걸 왜, 제가 있을 때 하시냐는 말씀입니다! 저는 트리니티의 국빈으로서 이 땅을 방문했습니다. 그런데...\"\n\"니하하! 이런 재미있는 경험을 할 수 있다는 것 자체가 국빈이라는 증거죠!\"\n\n말이 안 통한다. 총성은 계속 울리고, 몇 발이고 총탄에 맞은 탓에 등이 뜨거웠다. 나기사는 고개를 돌렸다. 오토마톤들과의 거리는 조금씩 좁혀지고 있었다. 이대로 도주극을 계속할 수는 있겠지만, 언젠가는 붙잡힐 거다. 전략을 바꿔야만 했다.\n\n\"코유키 씨. 여기에서 갈라집시다. 제가 어떻게든 저 오토마톤들을 막겠습니다.\"\n\"엥? 무슨 수로요?\"\n\"그건...\""
 trinity_events_nagisa_diplomacy.23.desc.ichika: "밀레니엄 엑스포 시설 지하도는 좁고 어두컴컴했다. 신발조차 벗겨져 어디론가로 사라진 상태로, 이치카는 맨발로 쿠로사키 코유키의 뒤를 따라 달리며 발바닥의 찢어질 것 같은 고통을 참았다. 등 뒤에서 쏟아지는 총탄 때문에 이치카의 정의실현부 완장은 이미 찢겨져 사라졌고, 그녀의 날개는 붉게 물들어가고 있었다. 코유키는 이 모든 상황이 그저 즐거운 듯 '니하하' 웃고만 있을 뿐이었지만.\n\n\"하아, 하아... 진짜, 밀레니엄이 이런 학원인지 전혀 모르고 있었슴다!\"\n\"니하하! 아니, 딱히 이러려던 건 아니었는데요. 횡령으로 빼간 돈 기록 좀 지우려고 하다보니까, 갑자기 경비 오토마톤들이 총을 쏘기 시작해서...\"\n\"그 횡령, 저 없을 때 해도 되잖슴까. 같이 온 정의실현부원들이 당신 때문에 전멸... 아니 뭐, 기절한 거지 죽은 건 아니긴 하지만요.\"\n\"니하하! 이런 재미있는 경험을 할 수 있었으니, 정의실현부원들도 좋아하겠죠!\"\n\n말이 안 통한다. 총성은 계속 울리고, 몇 발이고 총탄에 맞은 탓에 등이 뜨거웠다. 이치카는 고개를 돌렸다. 오토마톤들과의 거리는 조금씩 좁혀지고 있었다. 이대로 도주극을 계속할 수는 있겠지만, 언젠가는 붙잡힐 거다. 전략을 바꿔야만 했다.\n\n\"코유키 씨. 여기에서 갈라지는 게 좋겠슴다. 제가 어떻게든 저 오토마톤들을 막겠슴다.\"\n\"엥? 무슨 수로요?\"\n\"그건...\""
 trinity_events_nagisa_diplomacy.23.desc.mine: "밀레니엄 엑스포 시설 지하도는 좁고 어두컴컴했다. 신발조차 벗겨져 어디론가로 사라진 상태로, 미네는 맨발로 쿠로사키 코유키의 뒤를 따라 달리며 발바닥의 찢어질 것 같은 고통을 참았다. 등 뒤에서 쏟아지는 총탄 때문에 미네의 구호기사단 방패는 너덜너덜한 총알 자국 흔적이 되어 있었고, 그녀의 날개는 붉게 물들어가고 있었다. 코유키는 이 모든 상황이 그저 즐거운 듯 '니하하' 웃고만 있을 뿐이었지만.\n\n\"하아, 하아... 진짜, 밀레니엄 사이언스 스쿨! 당신들의 학교는 전부 구호가 필요합니다! 그 썩어빠진 머리부터...\"\n\"니하하! 아니, 딱히 이러려던 건 아니었는데요. 횡령으로 빼간 돈 기록 좀 지우려고 하다보니까, 갑자기 경비 오토마톤들이 총을 쏘기 시작해서...\"\n\"애초부터 횡령한 돈을 해킹으로 기록만 지운다는 생각이 잘못된 겁니다. 당신 때문에 저는 호스트 님이 지시한 외교 사절로서의 역할을... 하아, 하아, 하지 못하고 있지 않습니까!\"\n\"니하하! 이런 재미있는 경험을 할 수 있었으니, 돌아가면 호스트 씨에게 할 이야깃거리 많아지는 거 아니야?\"\n\n말이 안 통한다. 총성은 계속 울리고, 몇 발이고 총탄에 맞은 탓에 등이 뜨거웠다. 미네는 고개를 돌렸다. 오토마톤들과의 거리는 조금씩 좁혀지고 있었다. 이대로 도주극을 계속할 수는 있겠지만, 언젠가는 붙잡힐 거다. 전략을 바꿔야만 했다.\n\n\"코유키 씨. 여기에서 갈라지도록 하죠. 저 오토마톤들을 해결하겠습니다.\"\n\"엥? 무슨 수로요?\"\n\"그건...\""
 trinity_events_nagisa_diplomacy.23.desc.ako: "밀레니엄 엑스포 시설 지하도는 좁고 어두컴컴했다. 신발조차 벗겨져 어디론가로 사라진 상태로, 아코는 맨발로 쿠로사키 코유키의 뒤를 따라 달리며 발바닥의 찢어질 것 같은 고통을 참았다. 등 뒤에서 쏟아지는 총탄 때문에 아코의 숏 케이프는 너덜너덜했고, 머리가 빙그르르 돌았다. 코유키는 이 모든 상황이 그저 즐거운 듯 '니하하' 웃고만 있을 뿐이었지만.\n\n\"하아, 하아... 진짜, 밀레니엄은, 이런 식으로 국빈 방문자를 대우하는 거예요...?\"\n\"니하하! 아니, 딱히 이러려던 건 아니었는데요. 횡령으로 빼간 돈 기록 좀 지우려고 하다보니까, 갑자기 경비 오토마톤들이 총을 쏘기 시작해서...\"\n\"자랑이예요?! 진짜! 히나 부장님이 봤으면, 그 주둥이를 확 비틀어버리는 건데...\"\n\"니하하! 근데 지금 비틀리는 건 감찰관 님 척추죠? 총에 몇 십발 맞고도 아무것도 못하죠? 니! 하! 하!\"\n\n말이 안 통한다. 총성은 계속 울리고, 코유키를 죽여버리고 싶은 충동 때문에 머리가 뜨끈거렸다. 아코는 고개를 돌렸다. 오토마톤들과의 거리는 조금씩 좁혀지고 있었다. 이대로 도주극을 계속할 수는 있겠지만, 언젠가는 붙잡힐 거다. 전략을 바꿔야만 했다.\n\n\"코유키 씨. 두 가지만 이야기합시다. 첫째. 그 빌어먹을 '니하하' 웃음 안 멈추면 그 입부터 찢어버릴 겁니다. 둘째. 저 오토마톤들은 제가 해결하겠습니다.\"\n\"엥? 무슨 수로요?\"\n\"그건...\""
 trinity_events_nagisa_diplomacy.23.a: "일대 다 교전으로 오토마톤들을 제압한다."
 trinity_events_nagisa_diplomacy.23.b: "삼거리에서 코유키와 다른 방향으로 달려, 오토마톤들을 교란시킨다."
 trinity_events_nagisa_diplomacy.24.t: "Code: BOX - 7일차"
 trinity_events_nagisa_diplomacy.24.desc.nagisa: "키리후지 나기사는 자신의 몸을 덮은 아르기닌 박스가 떨어지지 않도록 꽉 잡은 채, 아무도 없는 밀레니엄 엑스포 뒤편의 복도를 바닥을 기며 걸었다. 벌써 백 미터 이상 바닥을 기어다닌 탓에 그녀의 하얀 상의 옷소매는 마구 찢어져 있었고, 이마에서 흐르는 땀이 바닥으로 뚝, 뚝, 소리 없이 떨어졌다. 하지만 나기사는 아르기닌 박스를 벗을 수 없었다. 몇 십명이 넘는 헬멧단원들을 '트레이닝 부원'이라고 끌고 다니는 정신이 나간 여자, 오토하나 스미레가 선글라스를 쓴 채 이 건물 안을 돌아다니고 있었으니까.\n\n\"트리니티의 방문객 씨, 어서 나오세요. 저희 밀레니엄 트레이닝부는 트리니티의 손님에게도 완벽한 트레이닝 체험 코스를 준비해 드리고 있답니다. 지금 숨어 계신 동안에도 근손실이 계속! 진행되고 있다는 거 알고 계시나요?\"\n\n스미레의 옆에서, 확성기를 든 트레이닝부 부원 노마사 레이가 말했다. \"그냥, 빨리 포기할수록 빨리 편해지거든요? 어서 나오세요, 트리니티 손님!\"\n\n빨리 포기하면 빨리 편해진다고? 나기사는 자신이 보았던 그 끔찍한 '트레이닝'의 모습을 떠올렸다. 헬멧단원들 몇을 구급차에 실려 나갈 정도로 학대하던 스미레의 모습. 그러면서도 '구급차 타느라 누워 있으면 근손실이 나는데...' 라고 중얼거리던 그 냉혹한 모습을. 나기사는 자신의 위치가 들키는 순간, 응급차에 오르는 것은 자신이 될 거라는 걸 본능적으로 느꼈다.\n\n'도대체, 왜, 엑스포장에 저런 이상한 여자가 돌아다니게 두는 겁니까, 밀레니엄은...!' 나기사는 아르기닌 박스 속에서 트레이닝부의 좀비들의 시선을 피해, 아주 조금씩, 계속해서 바닥을 기었다. 출구가 조금씩 가까워지고 있었다. 하지만, 문제는 출구 앞에서 야구 방망이를 들고 순찰을 도는 노마사 레이의 존재였다. 그녀가 나기사의 허리를 배트로 한 번 내려치기만 해도, 그녀는 스미레의 트레이닝 지옥으로 끌려가게 될 것이다.\n\n다른 통로를 찾아 보아야 할까? 아니면, 도중에 박스를 풀고 레이를 향해 그대로 돌진해야 할까? 운이 좋다면, 스미레가 도착하기 전에 몸싸움에서 승리하고 이 가건물을 탈출해 나기사의 경호원들과 합류할 수 있을지도 몰랐다."
