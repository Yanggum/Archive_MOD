 trinity_events_nagisa.59.a: "내일을 맞이하기 위하여"
 trinity_events_nagisa.60.t: "승리가 아닌 한 페이지" # 아츠코 호스트
 trinity_events_nagisa.60.desc: "발신자: 하카리 아츠코\n수신자: 조마에 사오리\n\n삿 쨩에게.\n\n삿 쨩과 마지막으로 만난 게, 그리고 마지막으로 대화를 나눈 게 언제인지, 이제 기억조차 흐릿해지려고 해. 지금 내가 호스트가 되었다는 걸 지켜보고 있니? 그러고 있기를 바라.\n\n많은 사람들이 트리니티의 가장 빈곤한 아리우스의 로얄 블러드가, 트리니티의 꼭대기에 선 것을 성공이라고 불러. 하지만 나는 그리 생각치 않아. 앞으로 펼쳐질 내 인생에서, 이 자리는 마침표가 아닌, 그저 지나가는 쉼표일 뿐이니까. 설마 내가 마담도 아니고, 평생 호스트만 하다 죽을 거라 생각하는 건 아니겠지?\n\n삿 쨩. 정말 보고 싶어. 호스트 취임식 때, 그리고 호스트가 되어 집무실에 들어섰을 때, 세이아 씨나 아코 씨, 그리고 히후미 씨가 맞이해 주는 것도 나쁜 경험은 아니지만, 그래도 내 곁에 있는 게 삿 쨩이었다면 더 기뻤을 것 같아.\n\n불평 불만만 늘어놓은 것 같네? :) 물론 싫기만 한 건 아니야. 아리우스에서는 하지 못했던 일들, 많은 사람들을 돕고 행복하게 하는 일을, 트리니티에서라도 해 보고 싶어. 베아트리체 밑에서 굴종하고 노예처럼 살아갔던 경험이 있으니까. 트리니티의 많은 사람들이 '자신이 선택하고 싶은 미래'를 스스로 선택할 수 있도록 돕는 사람이 되고 싶어.\n\n삿 쨩. 언젠가, 삿 쨩에게 이 편지를 직접 전달할 날이 오기를 기대할게.\n그 날이 오면, 지금까지 나누지 못한 많은, 많은 이야기를 나누자.\n\n[GetDate]에 작성.\n\n하카리 아츠코,\n트리니티의 호스트가."
 trinity_events_nagisa.60.a: "편지는 발송할 날을 기다리며, 책상에 보관되었다."
 ## 제일 보기 힘든 히든 루트(타카네)
 trinity_events_nagisa.61.t: "오호호! 호스트랍니다!" # 타카네 호스트
 trinity_events_nagisa.61.desc: "\"이건 미친 짓이예요.\"\n\n머리를 감싸 쥔 채, 호스트실 바닥에 주저앉은 타카네 곁으로, '여대공의 조력자'라며 들어온 야쿠모 부장이 웃음을 터트렸다.\n\n\"아하하! 일이 이렇게 되어버릴 줄은 정말 몰랐는데? '타카네 여대공, 타카네 호스트'라니! 붉은겨울에서 이 정도의 위인이 나온 적 있었나?\"\n\"지금 이게 웃을 일이예요? '겨울왕국의 여대공' 이야기 전부 거짓말인데...! 트리니티 전체가 저를 믿고, 나기사 씨가 제게 호스트를 넘겼다니까요? 이제 와서 이게 들통나면 어떻게 될 줄 아시나요?\"\n\"단두대지 뭐.\" \"남 일처럼 말하기예요!?\"\n\n죽겠다. 비유적인 표현이 아니라 진짜로 죽을 것 같다. 타카네가 지쳐서 바닥에 쓰러져 있는 사이, 야쿠모는 자신만만하게 웃으며 말했다.\n\n\"이미 일어난 일을 바꿀 수는 없잖아? 그러면 이렇게 해 보는 건 어때? 이 연극을, 너무도 완벽하게 마무리짓는 거지.\"\n\"그게 무슨 말씀이신가요?\"\n\"트리니티 역사상 가장 위대한 호스트가 되는 거야. 그리고 모두가 타카네가 여대공이 아니었다는 걸 조사할 마음조차 들지 않게 하는 거지. '아! 이 사람을 건드리는 건 신성모독이다!' 라고 생각하게 될 만큼. ...뭐, 이것 말고는 대안이 없잖아?\""
 trinity_events_nagisa.61.a: "\"안 할 수가 없네요...\""
