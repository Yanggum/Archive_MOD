 trinity_divine_mandate_events.1.t: "동남트리니티 신성통치령의 운명"
 trinity_divine_mandate_events.1.desc: ""
 trinity_divine_mandate_events.1.a: "우리는 신뢰할 수 있는 트리니티 학생이 필요하다."
 trinity_divine_mandate_events.1.b: "어쩌면 현지인이 좀 더 잘할지도 모른다."
 trinity_divine_mandate_events.2.t: "동남 신성통치령의 운명"
 trinity_divine_mandate_events.3.t: "동북 신성통치령의 운명"
 trinity_divine_mandate_events.4.t: "동방 신성통치령의 운명"
 trinity_divine_mandate_events.4.c: "...아니면 좋은 생각이 있는데 말이야."
 TRN_trndivine_4_tt: "$TRN_Kirifuji_Nagisa$는 동방 신성통치령의 집행관이 될 것입니다."
 trinity_divine_mandate_events.6.t: "남방 신성통치령의 운명"
 trinity_divine_mandate_events.7.t: "트리니티 과학기술부 수립"
 trinity_divine_mandate_events.7.desc: "트리니티가 밀레니엄을 정복하면서 밀레니엄의 첨단 기술들을 손에 넣을수 있게 되었습니다. 트리니티는 이 첨단 기술들을 활용하기 위해 '과학기술부' 라는 동아리를 만들어 이들에게 영토를 양도했습니다. 그러나 지도자에 대한 논의는 끊이지 않고 계속 되고 있습니다."
 trinity_divine_mandate_events.8.t: "프랑스 군민행정부의 운명"
 trinity_divine_mandate_events.9.t: "총학생회장 임명"
 trinity_divine_mandate_events.10.t: "벨라루스 중앙 라다의 운명"
 trinity_divine_mandate_events.10.desc: "벨라루스 중앙라다는 트리니티 정보기관에 벨라루스로부터 전쟁 협력을 확보하기 위해 괴뢰 정부 수립을 건의했고, 이 제안은 받아들여졌습니다. 라다슬라우 아스트로우스키를 대통령으로 내세워 벨라루스 중앙라다라는 괴뢰국을 설립했습니다.\n\n그러나 이 괴뢰국은 명목상 존재에 불과했고 실권은 동북 신성통치령이 장악하고 있었습니다. 현지 협력이 다소 원활해진 것 외에 전쟁 수행에 큰 도움을 얻지는 못했습니다. 다만 여러 학생들의 잔혹 행위를 저지했고, 트리니티가 전쟁에서 승리하면서 역사적 의미를 지니게 되었습니다."
 trinity_divine_mandate_events.10.a: "흥미로운데? 이들의 요구를 수용하자."
 trinity_divine_mandate_events.10.b: "고맙지만 특별한 지위를 가질 이유는 되지 않는다."


 trinity_flavor_events.9999.t: "이 이벤트가 보인다면 디스코드에 신고 해주세요."
 trinity_flavor_events.9999.desc: "이 이벤트가 보였다면 디스코드에 신고 해주세요 링크는 다음과 같습니다.\nhttps://discord.gg/kddrRNS6dt\n\n만약 치트와 같은 상황에서 이 이벤트를 보았다면 딱히 신고하지 않아도 괜찮습니다. 그러나 다시 한번 말씀드리자면, 일반적으로 진행하던 와중 이 이벤트를 보았다면 디스코드에 신고해 주시길 바랍니다."
 trinity_flavor_events.9999.a: "꼭 링크로 들어와 신고 해주세요."

# 에덴 조약
 eden_treaty_negotiation_ALT_cat: "에덴 조약 재협상"
 eden_treaty_negotiation_ALT_cat_desc: "\n\n\n\n\n\n\n게헨나와 트리니티 두 학원의 오랜 분쟁과 갈등을 중단하고자 한 시도가 없었던 것은 아닙니다. 그 중에서도 가장 최근에 있었던 평화 조약 시도는, §Y총학생회장§!의 개입으로 대전이 이전부터 추진되어 왔던 §Y에덴 조약§!입니다. 두 학원의 평화 조약은 한 번 흔들렸으나, [GEH.GetLeader] 측과 [TRM.GetLeader] 측의 굳건한 의지가 모여 다시 한 번 실무자 협상을 시작했습니다.\n\n하지만 §Y대중들의 불만§!과 §Y파테르 분파§!의 개입으로 인해 협상은 단기간에 이루어지기 어렵습니다. 두 학원은 단순히 지도자들의 우정만으로 평화를 이루어내는 것이 아니라, 트리니티와 게헨나 두 곳의 시민과 이해집단들이 모두 납득할 수 있는 광범위한 지지를 이끌어내야만 합니다.\n\n§Y[GEM.GetNameDef]§! 역시 에덴 조약의 변수입니다. [GEM.GetLeader] 측은 이번 조약의 불합리함을 강조하며 게헨나 대중을 선동하려고 할 것입니다. 에덴 조약의 재협상이 성공할 것인지 여부는 매우 복잡한 역학 구도 아래에 있으며, 누구도 감히 결과를 확신할 수 없습니다.\n\n§G특수 룰§!: 협상 점수가 §G75점§! 이상이면서, 상대편보다 §Y15점§! 이상 높으면 승리합니다.\n\n£GFX_BA_game_rule_flag_TRM £GFX_BA_game_rule_flag_GEH 에덴 조약 체결파: [?global.eden_point_array^0]\n£GFX_BA_game_rule_flag_GEM £GFX_BA_game_rule_flag_GEH 에덴 조약 반대파: [?global.eden_point_array^1]"
 eden_point_array_tt: "§G[ROOT.GetNameWithFlag]§! 영향력 점수: $RIGHT|+=%%0$"
 eden_point_array_pater_tt: "반대파의 영향력 점수: $RIGHT|-=%%0$"

## 판데모니움 소사이어티 디시전
 eden_treaty_negotiation_imperial_metrology_ALT: "트리니티 특색 황실도량형"
 eden_treaty_negotiation_imperial_metrology_ALT_desc: "게헨나 학생들에게 트리니티와의 에덴 조약이 맺어지면, 미터법이 폐지되고 야드파운드법을 쓰게 된다고 선전합니다. 아니, 어쩌면 단순한 선전이 아닐지도 모릅니다. 트리니티의 마녀들이라면 진짜로 야드파운드를 가져올지도 모르는 법 아니겠어요? 트리니티에서는 '톤'이 1,016.047 킬로그램(2,240 파운드)라고 하던데요! 16.047 킬로그램만큼 화나네요!"
 eden_treaty_negotiation_prefect_team_leader_hasumi_ALT: "선도부장 하스미 음모론"
 eden_treaty_negotiation_prefect_team_leader_hasumi_ALT_desc: "에덴 조약이 맺어지고 난 뒤 게헨나에는 어떤 변화가 찾아올까요? 이미 트리니티는 소위 '공동 경찰' 운운하며 게헨나에서도 치안 활동을 하려고 하고 있습니다. 소위 'ETO'라는 공동군사조직의 첫 삽을 뜨고 있는 셈이죠.\n\n네. 공동으로 치안을 유지한다! 그것은 곧 파르페를 한 끼에 여섯 컵씩 집어먹는 하스미가 게헨나 땅에 눌러앉아, 게헨나의 자유를 억압하고 이부키의 푸딩까지 뺏어 먹을 것이라는 뜻이기도 합니다. 얼마나 끔찍하고 무시무시한 이야기입니까? 주간 만마전이 이 소식을 널리 알릴 겁니다."
 eden_treaty_negotiation_weekly_pandemonium_ALT: "주간 만마전에서 언론 플레이"
 eden_treaty_negotiation_weekly_pandemonium_ALT_desc: "주간 만마전의 대중적인 인기가 그렇게 높지 않다는 것은 그렇다고 치더라도, 언론은 우리가 가장 잘 사용할 수 있는 선전 도구입니다. 선도부와 트리니티 양측에 대한 비방 기사는 대중들의 여론을 다소 뒤흔들 수 있을 것으로 예상됩니다."
 eden_treaty_negotiation_talk_makoto_ALT: "[ROOT.GetLeader]의 여론 선동"
 eden_treaty_negotiation_talk_makoto_ALT_desc: "우리의 지도자가 직접 대중들 앞에서, 에덴 조약의 불합리함과 [GEH.GetLeader], [TRM.GetLeader] 두 사람의 밀실 합의를 비난합니다. 근거가 있는지 여부가 중요한 것이 아니라, 대중들에게 불안감을 심어놓을 수 있는가가 중요합니다."

## 트리니티 종합학원 디시전
 eden_treaty_negotiation_trinity_propaganda_ALT: "게헨나에 양보"
 eden_treaty_negotiation_trinity_propaganda_ALT_desc: "수 많은 정치적 이권과 파테르 분파를 위한 큰 양보가 있다고 했더라도, 현재 진행중인 조약마저 이권 너머로 날려버릴 순 없습니다. 중요한 것은 일단 조약에 서명을 받아내는 것이니까요."
 eden_treaty_negotiation_pro_gehenna_ALT: "친게헨나적 문화 선동"
 eden_treaty_negotiation_pro_gehenna_ALT_desc: "게헨나의 문화가 트리니티 학생들에게 나쁘지 않거나, 심지어는 우아해보이도록 하는 마케팅을 사용합니다. 가장 좋은 프로파간다 대상은 쿠로다테 하루나가 될 것입니다. 다소 머저리 같은 여자이기는 하나 기품 있는 언행과 몸짓을 가지고 있기에, 적절한 편집을 통해 내보낸다면 게헨나와 트리니티가 그다지 다르지 않다는 인식을 대중들에게 심어줄 수 있습니다."
 eden_treaty_negotiation_pro_prefect_team_ALT: "선도부와의 공동 치안 활동"
 eden_treaty_negotiation_pro_prefect_team_ALT_desc: "트리니티의 치안을 지키는 비-정의실현부 조직은 이제 자경단만이 아닙니다. 에덴의 거리에서부터 시골의 오두막까지 게헨나 선도부의 실행부원들이 치안 유지에 협조하고 있으며, 헬멧단과 파시스트들을 파괴하는 게헨나의 영웅들은 대중들에게 큰 인상을 남길 수 있습니다."
 eden_treaty_negotiation_talk_nagisa_ALT: "[ROOT.GetLeader]가 전면에 나서기"
 eden_treaty_negotiation_talk_nagisa_ALT_desc: "[ROOT.GetLeader]가 사교 파티, 도서 출간회 등의 행사를 열며 트리니티의 부유층들을 직접 설득합니다. 호스트와의 만남은 놀라운 설득의 힘을 가지고 있습니다."
 eden_treaty_negotiation_remove_angry_JTF_ALT: "정의실현부 내부 반발에 대처"
 eden_treaty_negotiation_remove_angry_JTF_ALT_desc: "정의실현부를 직접 찾아가, [ROOT.GetLeader] 측이 트리니티와 게헨나의 연합이 가지는 평화의 이점에 대해 설득하고, 선물과 각종 혜택들로 하스미를 간신히 진정시킬 것입니다."

## 각종 찐빠 디시전 (AI가 선택, 미션 형태)
 eden_treaty_negotiation_host_ALT: "우월성 확보 압력"
 eden_treaty_negotiation_host_ALT_desc: "파테르 분파를 비롯한 다양한 반 게헨나 파벌은 트리니티가 이번 협상에 있어 게헨나에 대해 확고한 우위를 점하기를 바랍니다. 그러기에 게헨나 학원에게 조약에 있어 다양한 경제적 이익을 취하기 위한 각종 압박을 가하고, 협상이 불안정해 질 수 있으나 큰 문제는 없을 것입니다... 아마도요."
 eden_treaty_negotiation_sardine_pie_ALT: "게헨나 내 강경파의 반발"
 eden_treaty_negotiation_sardine_pie_ALT_desc: "만마전과 선도부 모두에 속하지 않는 일부 게헨나 학생들과 게헨나 시민들은 이번 협상에 강경하게 반대하고 있습니다. 특히 현지 독일의 노동단체와 결합한 단체들의 트리니티-제국주의 구호는 예상보다 여러 현장에서 발견할 수 있으며, 이들의 민족주의, 반자본주의적 반발은 우리의 협상에 있어서 가장 거대한 적으로 보입니다."
 eden_treaty_negotiation_angry_JTF_ALT: "정의실현부 내부 반발"
 eden_treaty_negotiation_angry_JTF_ALT_desc: "정의실현부의 하스미는 상당한 반 게헨나 성향을 보이고 있기에, 미소노 미카를 비롯한 각종 반 게헨나 야당의 협상 참여에도 불구하고 개인적인 반대 의사를 소극적으로 표현하고 있습니다. 협상 자체를 반대하는 강경파들의 의견이 모여 생각보다는 큰 반발이 알음알음 퍼져나가고 있습니다...."

## 게헨나 선도부 디시전
 eden_treaty_negotiation_gehenna_propaganda_ALT: "게헨나 프로파간다"
 eden_treaty_negotiation_gehenna_propaganda_ALT_desc: "판데모니움 소사이어티가 아무리 광견병에 걸린 개처럼 짖는다고 하더라도, 우리는 앞으로 나아갈 수밖에 없습니다. 우리는 트리니티가 그렇게 위협적인 외부 세력이 아니라는 것을 설득하기 위한 언론 매수 및 친 조약적 기사들을 만들어 낼 것입니다."
 eden_treaty_negotiation_pro_trinity_ALT: "친트리니티적 문화 선동"
 eden_treaty_negotiation_pro_trinity_ALT_desc: "우리의 믿음직한 실행부장인 시로미 이오리도 트리니티의 아름다운 제복을 사랑합니다. 트리니티는 멋진 문화, 그리고 고급스러운 의상을 만드는 좋은 학원이며 게헨나 학생들을 매료시킬 수 있는 다양한 (정어리 파이와 옛 도량형을 제외하면) 문화들을 가지고 있습니다. 어찌 게헨나의 소녀들이 트리니티를 사랑하지 않을 수 있단 말인가요?"
 eden_treaty_negotiation_pro_JTF_ALT: "정의실현부와의 공동 치안 활동"
 eden_treaty_negotiation_pro_JTF_ALT_desc: "정의실현부와의 공동 치안 활동은 게헨나의 불량학생들은 더 화나게 만들 수 있으나, 게헨나 시민들이 '우리의 치안을 지키는 것은 두 학원의 공동전선 덕분'이라는 인식을 품게 할 수 있습니다."
 eden_treaty_negotiation_talk_hina_ALT: "[ROOT.GetLeader]가 전면에 나서기"
 eden_treaty_negotiation_talk_hina_ALT_desc: "[ROOT.GetLeader]가 선도부 일반 부원들을 중심으로, 자신의 친조약적 사상을 설파합니다. 지도자에 대한 신뢰가 선도부 내부에 에덴 조약에 대한 지지를 불러 일으킬 것입니다."

## 짬통
 eden_treaty_negotiation_generic_propaganda_ALT: "[ROOT.GetAdjective]의 이상을 설파하기"
 eden_treaty_negotiation_generic_propaganda_ALT_desc: "우리가 에덴 조약에 대해 가진 이상을 대중들에게 알리며, 대중들이 에덴 조약에 대해 가진 생각을 이끌어갑니다." 
 eden_treaty_negotiation_generic_propaganda_ALT_tt: "이 결정은 §Y세 국가가 모두§! 사용할 수 있습니다. 이 결정의 효과는 당신의 국가가 극단적이지 않을수록 좋아지며, 극단적일수록 나빠집니다.\n"

 trinity_gehenna_eden_treaty_negotiation_ALT_flag: "에덴 조약 협상이 §Y시작§!"
 trinity_gehenna_eden_treaty_negotiation_ALT_success_flag: "에덴 조약 협상이 §G성공§!"
