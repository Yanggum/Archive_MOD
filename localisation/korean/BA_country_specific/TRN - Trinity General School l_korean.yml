 ## 민주주의 나기사 엔딩 지도자 로컬
 TRN_nagisa_kirifuji_democratic_bad_ending_leader_desc: "키리후지 나기사는 그저 권력에 취한 탓에 장기 집권을 선택한 것이 아닙니다. 나기사는 자신의 소중한 사람들을 지키기 위해서는 한 사람이 희생할 수밖에 없다고 판단했습니다. 자신이 권력을 내려놓으면 나기사 본인은 편해지겠죠. 하지만 이후에 사악한 자가 권력을 잡는다면요? 필리우스 정권이 붕괴된다면요? 그 때 나기사는 소중한 사람들을 지킬 수 있을까요?\n\n나기사는 타인을 믿고, 사랑으로서 모두를 포용하는 새로운 정치를 통해 무한한 성공을 이루었습니다. 하지만 '믿기 위해서는 타인을 의심'해야만 합니다. 정권을 빼앗으려는 정적들은 조사되어야만 하고, 가상적국들은 계속해서 감시되어야만 합니다. 그 모든 과정 끝에 '안전하다'는 것이 밝혀져야지만, 나기사는 진정으로 그들을 믿을 수 있을 것입니다.\n\n대전이 이전에 쌓은 인연, 그리고 대전이 이후에 새롭게 쌓은 인연. 그 모두를 보호할 수 있는 것은 키리후지 나기사 뿐입니다. 나기사는 가까운 이들을 지키는 수호자로서의 역할을 수행하는 것이, 자신의 마지막 임무라고 생각합니다. 그 무거운 짐을 나기사가 아닌 그 어떤 이가 해내겠습니까?"
 TRN_hifumi_ajitani_leader_desc: "아지타니 히후미는 정말로 정치를 하고 싶지 않았습니다. 그녀의 작고 소박한 꿈은 그저 트리니티 호스트 키리후지 나기사를 보좌하며, 그녀의 친구로 남는 것이었습니다. 그러나 키리후지 나기사는 그리하지 않았습니다. '저는 정치 활동을 하며 녹슬고 변해버렸지만, 제 소중한 히후미 씨는 결코 그러지 않을 거랍니다.' 나기사는 순수하게도 그렇게 믿고 있습니다. 문제는 그녀의 믿음에는, 히후미에게 자신의 의사를 묻는 과정이 결여되어 있었다는 점입니다.\n\n하지만 히후미는 나기사의 그늘 아래에서 '자신의 정치'를 펼치기 위해 노력하고 있습니다. 나기사에게 티파티의 오랜 친구들이 있었듯이, 히후미의 곁에는 여전히 키리후지 나기사가 남아 있습니다. 히후미가 자신에게 맞지 않는 옷인 호스트직을 견뎌낼 수 있는 원동력은, 자신의 가장 소중한 친구가 히후미가 나아가야 할 길을 일러주고 있다는 점입니다.\n\n그렇기에 비록 어느 색채도 가지지 못한 호스트이지만, 아지타니 히후미는 자신의 미래를 찾아 한 걸음씩 나아갑니다. 미래로."
 TRN_hifumi_ajitani_faust_leader_desc: "나기사는 히후미를 버렸습니다. 히후미는 자신이 원하지 않은 호스트직이라 하더라도 나기사가 곁에 있어 준다면 견딜 수 있으리라 생각했지만, 나기사는 히후미가 홀로 서기 위해 자신이 호스트실에 있어서는 안 된다는 결론을 내렸습니다. 하지만 히후미 역시 그렇게 생각했을까요?\n\n히후미는 학창 시절과 겹친 대전이 사건으로 인해 제대로 된 인간관계를 만들지 못했습니다. 대전이 직전에도 귀가부였고, 대전이 이후에는 BD로 원격 강의만을 들었으니까요. 그런 그녀의 유일한 버팀목은 나기사였고, 나기사가 히후미를 놓은 순간 그녀는 홀로 남게 되었습니다.\n\n아지타니 히후미는 이제 아무도 찾아오지 않는 폐쇄적인 세계에 갇혀 검게 물들어가고 있습니다. 키리후지 나기사가 정계를 떠나며 마지막으로 남긴 말, '필리우스 분파가 당신의 편이 될 것'이라는 말이 지금의 히후미를 움직이는 최후의 유훈입니다. 필리우스 분파가 자신의 편이라면, 필리우스가 아닌 모두가 히후미의 적이라는 뜻이잖아요? 그 알기 쉬운 이분법에 따라, 히후미는 모두를 의심합니다. 그렇게 해야만 살아남을 수 있잖아요? 타인을 의심하고, 정적을 증오하고, 사람들을 갈라치는 게 정치인의 덕목이니까요.\n\n그리하여, 히후미는 나기사를 뛰어넘는 정치인이 될 수 있을 것입니다."
 TRN_seia_yurizono_nagisa_route_leader_desc: "세이아에게 있어서 이번 호스트 임기는 두 번째입니다. 그리고, 세이아가 본 무수한 미래 중, 단 한 번도 존재한 적 없었던 '두 번째 호스트직'이기도 합니다. 죽음 직전에서 깨어나, 그냥 니트이자 자유인으로서 남은 삶을 안락하게 보내려던 유리조노 세이아의 달콤한 미래 계획은 좌절되었습니다. 하지만 세이아는 그다지 좌절하지는 않았습니다. 세이아에게 있어서 호스트직으로의 복귀는 트리니티의 수많은 이들을 위해 자신의 능력을 바치는 봉사이며, 자신이 상처 입히고 울게 만든 두 사람. 미카와 나기사에 대한 속죄이기도 하니까요.\n\n이제 더 이상 '상투스 분파의 수장'도 아니며, 심지어 상투스 분파조차 아니게 되었지만, 세이아는 필리우스의 새로운 동료들과 함께 트리니티에서, 결코 자신이 예언한 적 없는 자유로운 미래를 만들어가고자 합니다. 그것은 키리후지 나기사가 남긴 유산을 보존하고, 다음 세대까지 이어질 수 있도록 만드는 것입니다. 그녀의 통치 아래에서 트리니티가 더 위대해지지 않을지도 모릅니다. 하지만, 트리니티를 살아가는 이들은 더 풍요로워 질 것입니다.\n\n유리조노 세이아가 아니라면, 누가 그 일을 맡겠습니까?"
 TRN_mine_aomori_nagisa_route_leader_desc: "요한 분파의 수장으로서 아오모리 미네는 대전이 이전까지 한 순간도 정치에 투신하려 한 적이 없었습니다. 그녀에게 있어서 정치는 타인을 지키는 구호의 의지를 무디게 하는 함정일 뿐이었습니다. 티파티의 고결한 세 분파가 정치를 하도록 하라. 요한은 가난하고 굶주린 이들을 구하리라. 그런 그녀의 마음이 흔들린 것은 유리조노 세이아의 직접적인 정계 진출 요청 때문이었습니다.\n\n미네는 세이아에게 마음의 빚이 있었습니다. 그녀가 안전을 위해 세아이를 고립된 곳에 숨겼기 때문에, 나기사가 슬퍼하는 모습을 보았으니까요. 미네는 세이아에 대한 빚 때문에 정치에 도전했고, 대전이 이전 자신이 어째서 그렇게나 티파티에 들어가는 것을 거부하였는지 진정으로 깨달았습니다.\n\n미네는 트리니티 모든 부와 권력의 중심, 티파티의 호스트가 되었습니다. 그녀는 안락한 생활에 조금씩 적응해가고 있습니다. 그렇지만 미네는 단 한 가지만은 잊지 않으려 합니다. '신념과 긍지를, 가슴에.' 비록 자신이 지키려던 신념이 무엇이었는지조차 떠올릴 수 없게 되더라도, 한 때 자신의 모든 것이었던 그 문장만은."
 TRN_ako_amau_leader_desc: "아코에게 있어서 트리니티, 게헨나라는 국적은 그다지 중요하지 않았습니다. 아코의 시선 끝에는 언제나 소라사키 히나가 있었습니다. 그저 그녀가 '게헨나가 옳다'고 말할 때, 아코는 게헨나 선도부의 선임행정관이었고, 그녀가 '트리니티가 옳다'고 말할 때, 그녀는 트리니티 티파티의 감찰관이었을 뿐입니다. 훌륭한 기사는 그저 주군의 발끝을 따라가는 법 아니겠습니까?\n\n하지만 어느새 기사가 지켜야 할 사람은 자신의 주군만이 아니게 되었습니다. 게헨나 통합 이후 아코는 점점 많은 필리우스 분파의 사람들과 안면을 쌓게 되었고, 아코의 '지키고 싶은'이들은 점점 많아졌습니다. 이제 티파티 호스트실에 앉아, 아코는 자신의 새로운 책무를 돌아봅니다. 트리니티를 지키고, 다음 세대까지 키리후지 나기사가 만든 유산을 수호하는 것. 그것은 아코의 소중한 주군을 위한 일이기도 하지만, 동시에 트리니티에서 알게 된 새로운 인연들을 위한 것이기도 합니다.\n\n아코는 게헨나의 분리주의자들이 기대하는 것처럼 하나된 연방을 해체하지도, 파테르의 급진파들이 희망하듯이 실정으로 정권을 넘겨주지도 않을 것입니다. 어쩌면, 무질서와 혼돈이 존재하지 않는 이 땅에서 아코는 선임행정관으로서보다 더 잘 해내갈 수 있을지도 모릅니다. 결국, 서는 곳이 달라지더라도 기사의 임무는 변한 적이 없으니까요."
 TRN_atsuko_hakari_leader_desc: "아리우스 학생회장 베아트리체의 '산제물'에서부터 트리니티 티파티의 중심인 호스트가 되기까지, 하카리 아츠코의 인생은 그 자체로 서사시이며 몇 권의 위인전을 만들 수 있을 정도입니다. 트리니티 태고의 공의회에서부터 현대에 이르기까지 하카리 아츠코처럼 가장 낮은 곳에서 제일 고귀한 자리까지 올라온 이는 한 번도 없었으니까요.\n\n아츠코는 자신이 뛰어났기 때문에 스스로가 호스트가 될 수 있었다고 믿지 않습니다. 자신이 아리우스의 '로열 블러드'라는 운이 있었고, 트리니티의 관용적인 문화가 있었으며, 그리고 필리우스의 많은 이들이 자신을 신뢰해 주었기에 이 자리에 설 수 있었습니다. 그렇기에 더더욱, 아츠코는 '뛰어난 능력이 있지만, 그 능력을 펼칠 기회가 없었던' 이들을 위해 자신의 능력을 쓰고자 합니다.\n\n그녀가 트리니티의 높은 신분제 벽을 무너뜨릴 수는 없을 것입니다. 하지만 가난한 옛 아리우스의 소녀들과 트리니티의 시골 아이들이 새로운 교육을 받도록 할 수는 있습니다. 그렇게 다음 세대, 또 다음 세대가 지나간다면, 배우고, 능력을 갖춘 새로운 세대가 트리니티를 변화시킬 것입니다. 아츠코가 세상을 바꾼 것처럼요."
 TRN_takane_miyoshi_leader_desc: "대재앙. 절망. 디스토피아. 그 어떤 부정적인 단어를 가져와도 이 감정을 표현할 수 없을 것입니다. '가짜 여대공' 신분이 트리니티의 모두를 속이고, 그녀를 트리니티의 지도자로 만들었습니다. 겨울 왕국의 고결한 생존자, 미요시 타카네 여대공을 찬양하라! 물론 타카네는 이런 상황을 그저 즐기고 있을 만큼 여유롭지 못합니다. 만약 이 사실이 들통난다면, 트리니티 전체의 적이 될 것이 분명하니까요.\n\n타카네는 이 이야기를 '완벽한 거짓'으로 만들어야만 합니다. 트리니티를 가장 위대하게 만드는, 그 누구보다도 뛰어난 지도자가 되는 것입니다. 그것이 그 누구도 타카네의 과거를 감히 캐내지 못하게 만들 하나 뿐인 길입니다. 그렇게 노력하더라도 실패한다면? 그 때는 국경을 넘어 도망칠 준비를 해야 하겠죠."

 ## 비동맹 나기사 엔딩 지도자 로컬
 TRN_sakurako_utazumi_nagisa_route_leader_desc: "우타즈미 사쿠라코는 딱히 권력을 탐하는 인물이 아닙니다. 그녀가 쿠데타를 저지른 이유는 개인적인 욕망이 동기가 되었다기보다는, 키리후지 나기사가 나아가는 길을 동의하지 않았기 때문입니다. 사쿠라코는 점점 폐쇄적인 독재 체제로 변해가며, 다른 분파를 배제하는 '나기사 독재 체제'로 전환되는 트리니티를 전복시키는 것이 시스터후드의 제한적인 정치 개입주의에도 부합한다고 판단했습니다.\n\n다만, 쿠데타 이후의 트리니티가 어떤 길을 걷게 될 것인지는 여전히 불확실합니다. 사쿠라코는 호스트직에 직접 오르는 대신 막후에서 티파티 호스트에게 조언을 해 주는 조언가 역할로만 남겠다고 약속했지만, 모든 트리니티의 지식인들은 그 '조언가' 역할이 정치 실세를 뜻한다는 것을 압니다. 종교인들에 의해 통제되는 트리니티의 미래가 어떠한 방향으로 나아갈 것인지는, 시스터후드와 그 수녀들만이 알고 있을 것입니다."
 
 trinity_system_events.0.t: "트리니티 리워크"
 trinity_system_events.0.desc: "리워크 중인 트리니티 컨텐츠를 불러오기 위해서 사용됩니다. 일반적인 게임 진행 도중 이 이벤트가 나왔다면 (제발)'구 중점' 선택지를 골라주세요."
 trinity_system_events.0.a: "리워크 보기"
 trinity_system_events.0.b: "구 중점"

 
 # 사건
 trinity_events.1.t: "티파티"
 trinity_events.1.desc: "티파티는 상투스, 필리우스, 파테르 분파들의 연합체로 트리니티 삼두정 체제에서 핵심적인 역할을 담당하는 최고 통치 기관입니다. 각 분파는 서로의 단점을 보완하면서도 견제를 통해 균형을 유지하는 구조를 이루고 있습니다. 이 중 한 분파의 수장은 티파티의 \"호스트\" 직책을 맡으며 막강한 권한을 행사할 수 있습니다. 그러나 티파티 내의 견제와 상호 보완 구조는 호스트의 권력 남용을 방지하고 정치적 급진주의를 억제하며 안정적인 통치를 가능하게 합니다.\n\n수년 전, 급진적이고 전쟁광 성향의 파테르 분파 수장이 티파티 호스트 직책에 오른 일이 있었습니다. 이로 인해 게헨나 학원과의 긴장이 고조되었고 호스트 위기가 발생했습니다.\n\n상황은 결국 필리우스와 상투스 분파가 연합해 호스트에 대한 불신임 결의를 통과시키는 사태로 이어졌습니다. 해당 결의는 받아들여졌지만 이는 파테르 분파의 자존심에 큰 상처를 남겼습니다. 이러한 갈등은 1935년 대전이 당시 포로를 향한 전쟁범죄로 감옥에 수감된 파테르 분파 전투병들의 사면을 추진하려던 미소노 미카의 시도가 무산된 이후에도 여전히 완전히 회복되지 않고 있습니다.\n\n이제 운명조차 파테르 분파의 손을 들어주었습니다. 파테르 분파는 키리후지 나기사에 대한 뇌물 의혹을 제기하며 사법당국에 조사를 촉구했고, 수사 기관은 '신뢰할 수 있는 정보원'들의 증언과 자료를 토대로 키리후지 나기사를 업무상배임 혐의로 기소했습니다. 뇌물 수수가 아닌 점이 아쉽지만 키리후지 나기사는 분파에 영향이 가는 것을 막기 위해 공식적으로 사임을 발표했으며, 필리우스 분파의 주요 인사들 또한 이 사법 수사의 흐름 속에서 대거 교체되었습니다. 잔존한 소수의 인물조차 파테르 분파의 영향력 아래 사실상 무력화될 운명에 처해 있습니다."
 trinity_events.1.a: "전부 헌장에 입각한 행동이다."
 trinity_events.2.t: "바시스 스콜라 시위"
 trinity_events.2.desc: "파테르 분파가 티파티와 대법원을 사실상 장악함에 따라, 미소노 미카의 독재를 견제할 수 있는 마지막 장벽마저 무너지고 있습니다. 필리우스 분파와 상투스 분파는 미소노 미카의 급진주의를 막아내지 못하는 상황에 분노를 표출하고 있으며, 특히 키리후지 나기사에 대한 기소는 대규모 시위를 촉발시키는 계기가 되었습니다.\n\n바시스 스콜라에서는 또 다른 시위가 발생하였고, 다수의 필리우스 지지자는 미소노 미카를 \"트리니티의 본질을 파괴하는 데에 몰두한 폭군\"이라며 강도 높은 비판을 쏟아냈습니다."
 trinity_events.2.a: "그래야겠다면 시위하게 내버려둬라."
 trinity_events.2.b: "정의실현부를 보내 해산시켜라."
 trinity_events.3.t: "[GetYear]년 트리니티 종합학원 헌장"
 trinity_events.3.desc: "엄밀히 말하자면 트리니티 헌장을 개정하기 위해서는 티파티 2/3의 동의가 필요하며 개정안은 대법원에 제출되어야 합니다. 이 헌장은 고귀한 의도를 바탕으로 만들어졌고 시대를 초월한 권위를 지니고 있다는 점에서 의심의 여지가 없지만, 가장 사소한 헌장 개혁조차도 지나치게 복잡하고 지루하게 만드는 문제를 안고 있습니다. 헌장이 완벽하게 설계되었다면 이러한 문제가 덜했겠지만 현실은 그렇지 않습니다.\n\n이미 티파티와 대법원을 장악한 파테르 분파 앞에서 다른 기구들이 할 수 있는 일은 많지 않습니다. 그러나 파테르 분파는 자신들의 지배력에 정당성을 부여하기 위해 공식적으로 '트리니티 종합학원 헌장 개정안'을 공표했습니다. 이는 파테르 분파가 장악한 티파티의 권한으로 통과되었으며 [GetYear]년 트리니티 종합학원 헌장을 사실상 무효로 하는 결과를 낳았습니다. 이 개정안은 티파티를 통해 통과된 마지막 법으로 기록될 것입니다."
 trinity_events.3.a: "아무도 우릴 막을 수 없다!"
 trinity_events.4.t: "미소노 미카 헌장"
 trinity_events.4.desc: "미소노 미카 헌장은 '트리니티 종합학원 헌장 제5차 개정안'이라는 명칭에도 불구하고 기존의 제왕적인 호스트 권한과 함께 트리니티를 새로운 준 헌장 국가로 만들기 위한 방대한 법률 포장물입니다. 많은 조항이 모호하게 작성되어 실제 판결은 공무원과 판사의 자의적 해석에 맡길 수 있을 정도입니다. 트리니티 삼두정의 거의 모든 보호 장치가 제거되었고 재산 규정도 마찬가지로 '반국가 활동'과 관련된 모든 재산을 국가가 간단히 국유화할 수 있게 되었습니다.\n\n비준 소식에 티파티에서 파테르 분파 대표들은 우레와 같은 찬성을 보냈고, 곧이어 트리니티 전역의 파테르 분파 간부들이 주최한 공개 행진에서 축하 행사가 이어졌습니다. 타 분파의 반응은 훨씬 더 냉담했고 미소노 미카의 파테르 분파 일부 온건주의 인사들조차 미소노 미카의 야망이 어디까지인지 지켜보며 숙고할 수밖에 없었습니다."
 trinity_events.4.a: "트리니티는 홀로선다!"
 trinity_events.5.t: "마지막 자유 연설"
 trinity_events.5.desc: "파테르 분파의 독주 속에서 다른 분파들도 점차 진행 중인 법적 변화의 심각성을 깨닫기 시작했습니다. 이들은 트리니티가 사실상 일당 국가로 전락할 위험이 있다는 위기감을 공유하며 연합하여 파테르 분파의 독주를 견제하려는 움직임을 보였습니다. 그러나 파테르 분파는 이러한 연합 세력과 적대하며 상황은 점점 악화했습니다.\n\n그 와중에 필리우스 분파의 수장인 아라하타 와카나는 마이크를 잡고 연설을 시작했습니다.\n\n\"이 운명의 시간에 우리 필리우스 분파는 인류애, 자유, 정의의 원칙에 엄숙히 서약합니다. 미소노 미카는 역사상 단 한 번 트리니티를 통합하고 더 나은 미래와 세상을 열었던 제1차 공의회의 위대한 업적을 무너뜨렸습니다. 수십만 명의 용감한 트리니티 학생들이 자유를 지키기 위해 목숨을 바쳤습니다. 미소노 미카와 파테르 분파는 이 희생과 대의를 누구보다 잘 알고 있을 것입니다. 그런데 그들이 바로 그 대의를 배신하고 있습니다.\n\n어떠한 법도 영원하고 불멸한 신념을 파괴할 권한을 부여하지 않습니다. 지금 그들의 행동은 신념 없는 테러리스트와 다름없습니다. 하지만 우리는 제1차 공의회에서 선조들이 시작한 길을 절대 잊지 않을 것이며 그 길에 충실할 것입니다. 폭군은 결코 오래가지 못합니다. 그러니 지금 이 절망 앞에 굴복해서는 안 됩니다. 영원불멸한 자유 트리니티를 위하여 함께 박수를 보냅시다!\"\n\n아라하타 와카나의 연설 이후 타 분파들은 티파티 건물에서 항의 시위를 벌이며 저항의 뜻을 표명했습니다. 그러나 이는 그들이 할 수 있는 전부라는 현실을 절감하게 했습니다. 티파티 건물 밖에서는 학생의 권리를 존중해 달라는 시위가 이어졌지만 이마저도 현실에 대한 갈 곳 없는 분노로 표출된 것에 불과했습니다."
 trinity_events.5.a: "속이 다 시원하군."
 trinity_events.6.t: "2달 전"
 trinity_events.6.desc: "대전이 사태가 발발하며 트리니티는 근본적인 기반이 붕괴되고 새로운 땅 위에 가차 없이 내던져졌습니다. 이 충격은 단순한 혼란을 넘어 트리니티의 존립 자체를 위협하는 전례 없는 위기였습니다. 사태 직후 트리니티 종합학원은 독일국과의 치열한 전투에 돌입했습니다. 사투 끝에 승리를 거두었으나 이 과정에서 발생한 수많은 비극과 사건은 트리니티 학생들에게 깊은 상처를 남겼고 그들의 성향을 급진화시키기에 충분했습니다. 전쟁은 트리니티의 이상과 질서를 붕괴시켰습니다. 학생들 사이에는 분노와 불신이 퍼졌으며 모든 지표는 최악의 상황을 향해 치달았습니다. 독일국과의 전투에서 승리는 거두었으나 여전히 남동쪽과 북쪽에서는 저항 세력이 활동하며 긴장을 이어가고 있었습니다.\n\n파테르 분파는 이 틈을 놓치지 않았습니다. 그들은 상처 입은 사람들 사이에 남아 있던 불신과 긴장감을 이용하여 선전 매체에 집중하기 시작했습니다. 말뿐인 평화를 주장하는 필리우스 분파와 상투스 분파를 비난하는 내용을 담은 선전물이 제작되었고 일반 학생들에게 집중적으로 노출되었습니다. 그 결과 다수의 학생이 파테르 분파의 열렬한 추종자가 되었습니다. 이를 시작으로 파테르 분파는 티파티에까지 강한 영향력을 행사할 수 있게 되었습니다.\n\n필리우스 분파와 상투스 분파도 대응에 나섰습니다. 왜곡되고 거짓된 정보가 유포되는 것을 막기 위해 힘썼으나 이미 파테르 분파의 책략은 예상을 뛰어넘어 트리니티 전역에 깊은 영향을 미치고 있었습니다.\n\n그렇게 1936년 새해는 체념과 두려움 속에서 맞이하게 되었습니다."
 trinity_events.6.a: "그리고 그렇게 시작한다."
 trinity_events.7.t: "호스트 선출"
 trinity_events.7.desc: "트리니티를 휩쓴 위기의 여파는 아직 완전히 사라지지 않았지만 사태는 서서히 진정 국면에 접어들고 있습니다. 남아 있는 상처와 혼란이 여전히 우리를 괴롭히고 있으나 악화되던 지표는 다행히 하락세를 멈췄습니다. 이제 트리니티의 미래는 다음 호스트의 판단과 리더십에 달려 있습니다.\n\n트리니티를 이끄는 티파티는 상투스, 필리우스, 파테르라는 3개의 거대 분파로 구성되어 있습니다. 이 외에도 여러 분파들이 존재하지만 현재 그들은 각자만의 이유로 정계 개입을 거부하고 있습니다. 현재 비상회의는 해산 수순을 밟고 있으며 상투스 분파의 유리조노 세이아가 다음 호스트로 임명되었습니다.\n\n유리조노 세이아는 본래 중도적이고 보수적인 입장을 고수하며 실리외교를 통해 트리니티의 점진적인 변화를 지향하는 인물로 평가받아 왔습니다. 그러나 대전이 사태와 그로 인한 참상을 겪으며 그녀에게는 심리적 변화가 찾아온 듯 보입니다. 최근 상투스 분파 대회에서 그녀는 과거보다 훨씬 급진적인 행동을 촉구하며 때로는 다소 무례하게 들릴 수 있는 발언도 서슴지 않았습니다. 그럼에도 불구하고 그녀의 주장은 탄탄한 논리와 근거를 바탕으로 한 교과서적인 정론으로 평가받았으며 이는 상투스 분파의 주요 정책 방향으로 자리 잡고 있습니다.\n\n그러나 일부 상투스 분파 임원들은 유리조노 세이아가 타락했다며 강하게 비난했습니다. 그럼에도 불구하고 이러한 반발이 상투스 분파의 주요 정책 방향을 바꾸는 데까지는 이르지 않았습니다."
 trinity_events.7.a: "그래도 아직 시간이 있다."
 trinity_events.8.t: "다락방의 공주님"
 trinity_events.8.desc: "미소노 미카는 늦은 밤까지 사무실에서 일하고 있었다. 그녀의 사무실은 전직 파테르 분파 수장들의 초상화가 벽을 장식하고 있었으며, 고급스럽고 고전적인 장식품들로 채워져 있었다. 비서가 현재 상황에 대해 보고를 올렸지만 미카는 별다른 반응을 보이지 않았다. 시스터후드의 동향, 다른 분파들의 정치적 노선 등 그녀가 고려해야 할 사안이 너무 많았기 때문이다.\n\n잠시 일을 멈춘 미카는 창가로 다가가 먼 하늘을 바라보았다. 키보토스처럼 밤이 밝지는 않았지만 수많은 별들이 어두운 밤하늘을 수놓고 있었다. 그녀는 한동안 생각에 잠긴 채 자신의 계획들을 되짚어 보았다. 비록 일부 계획이 어긋난 부분이 있었지만, 지금의 흐름대로라면 실패할 가능성은 없다. 그녀는 스스로에게 그렇게 말했다.\n\n파테르 분파의 수장으로서 미카는 시간이 얼마 남지 않았다는 본능적인 위기감을 느끼고 있었다. 행동이 지체될수록 계획이 흔들리고, 그 틈을 타 불충한 자들이 음모를 꾸밀 위험이 커진다는 사실을 그녀는 너무나 잘 알고 있었다. 게다가 학생들은 행동에 나서지 않는 파테르 분파를 기회를 잡을 줄 모르는 무능하고 불결한 존재로 경멸하고 있었다. 그 시선들이 그녀를 조여왔다.\n\n그러나 미카는 확신하고 있었다. 언젠가는 파테르 분파의 시간이 올 것이라는 것을. 지금은 절대 권력을 향한 길목에서 모든 위협을 제거하고 그 뿌리를 근절하는 것이 최우선 과제였다. 그녀의 결심은 단단했고, 계획은 흔들리지 않았다. 아니, 흔들려서는 안 되었다."
 trinity_events.8.a: "그리고 운명은 우리 편이었다."
 trinity_events.9.t: "총성 세 발"
 trinity_events.9.desc: "어제 오전 11시 20분, 발터 권총에서 울려 퍼진 세 발의 총성이 트리니티를 관통했습니다. 상투스 분파의 수장이자 티파티의 호스트인 유리조노 세이아가 독일 저항 조직원의 습격을 받아 쓰러진 것입니다.\n\n사건은 순식간에 벌어졌습니다. 슈바르체 카펠레 소속의 토마스 서머가 트리니티 중앙광장에서 호스트 취임 연설 중이던 유리조노 세이아를 향해 돌진했습니다. 경호원들이 저지에 나섰지만 서머는 그들을 뚫고 품에서 권총을 꺼냈습니다. 흉부에 두 발. 복부에 한 발. 네 번째 총알이 발사되기 직전 그는 경호원들에게 제압당했고 부상 입은 채 병원으로 이송되었습니다.\n\n상투스 분파는 즉각 혼란에 빠졌습니다. 다음 날 아마베 치카가 긴급히 수장직을 이어받았지만 그녀를 향한 비난이 쏟아졌습니다. 유리조노 세이아의 최측근이 권력을 승계한다는 것, 많은 이들이 예상하지 못한 전개였습니다.\n\n이번 사건은 유리조노 세이아가 상투스 분파에서 차지하는 위치를 적나라하게 드러냈습니다. 그녀는 '지나치게 좌파적'이라는 비판을 받아왔지만 동시에 상투스 분파의 중심축이었습니다. 현재까지 유리조노 세이아의 상태에 대한 공식 발표는 없습니다. 그 사이 상투스 분파 일각에서는 허술한 보안 체계가 이번 참사를 초래했다며 정의실현부를 향한 공개 성명을 발표했습니다. 트리니티는 지금 이 순간도 요동치고 있습니다."
 trinity_events.9.a: "내가 한게 아니야!"
 trinity_events.10.t: "유리조노 세이아 사망"
 trinity_events.10.desc: "오늘은 트리니티에 있어 가장 비통한 날입니다. 유리조노 세이아가 끝내 사망했습니다. 구호기사단이 혼신의 힘을 다했지만 총상으로 인한 충격은 그녀의 연약한 몸이 감당할 수 없었고, 며칠간의 사투 끝에 그녀는 결국 눈을 감았습니다.\n\n이 충격적인 소식을 가장 먼저 접한 것은 상투스 분파였습니다. 유리조노 세이아의 죽음은 상투스 분파의 균열을 더욱 가속화했습니다. 누구도 만족하지 못하는 타협 끝에 카토 나츠키가 새로운 수장으로 선출되었습니다. 그녀는 유리조노 세이아의 사상을 계승하겠다고 주장했으나 세이아를 지지하던 파벌은 그녀를 신뢰하지 않고 있습니다.\n\n수장 선출 이후 보수적인 상투스 분파와 유리조노 세이아를 따르던 진보 성향의 파벌은 완전히 분열되었습니다. 진보 성향의 쿠노 미사키는 보수파를 향해 \"수백 년 전의 이상주의적인 체제에만 집착하는 반동\"이라며 강하게 비판했습니다. 전임 수장인 유리조노 세이아가 좌우를 아우르기 위해 애써 놓았던 가교는 그녀의 죽음과 함께 크게 무너졌고, 진보 성향의 인물들은 쿠노 미사키를 중심으로 적극적인 저항에 나서고 있습니다.\n\n현실을 직시한 일부 상투스 분파의 임원들은 이제 다른 분파와의 타협 가능성을 모색하고 있습니다. 그러나 불과 며칠 만에 상투스 분파는 혼란과 공포, 억압의 도가니에 빠져들었습니다."
 trinity_events.10.a: "도미노가 쓰러졌다."
 trinity_events.11.t: "미소노 미카의 호스트 취임"
 trinity_events.11.desc: "호스트가 취임 직후 사망하는 초유의 사건이 발생하며 트리니티 종합학원은 전례 없는 충격에 휩싸였습니다.\n\n종합학원 헌장에 따라 다음 호스트는 티파티 투표에서 과반을 차지한 미소노 미카가 맡게 되었습니다. 그러나 그녀의 취임과 동시에 필리우스 분파와 파테르 분파 간의 권력 투쟁이 불가피하게 발생했고, 이 갈등은 미소노 미카가 호스트로서 직접 정리하기 전까지 계속될 것으로 보입니다.\n\n그럼에도 필리우스 분파 내에서는 반대와 저항의 목소리가 커지고 있습니다. 필리우스 분파는 미소노 미카뿐 아니라 파테르 분파 전체를 유리조노 세이아 암살 사건과 연관지으며 그 배후로 의심하고 있습니다. 이에 대해 파테르 분파는 자신들과 무관하다고 강력히 부인했으나 이러한 오해는 쉽게 해소되지 않을 전망입니다.\n\n미소노 미카의 호스트 취임식은 유리조노 세이아 암살 사건의 여파로 인해 소규모로 진행되었습니다. 다른 분파 내의 분위기는 침울하며 미소노 미카에 대한 경계심과 불안감이 팽배합니다. 그녀는 누구도 예상할 수 없는 인물로, 앞으로 어떤 행보를 보일지에 대한 불확실성이 분파 간 긴장을 더욱 고조시키고 있습니다."
 trinity_events.11.a: "필연적이었다."
 trinity_events.12.t: "토마스 서머 수사"
 trinity_events.12.desc: "에덴의 구호기사단이 혼신의 힘을 다했음에도 불구하고, 유리조노 세이아의 암살자는 심문을 받기 전 치명적인 총격으로 인한 과다출혈로 사망하고 말았습니다.\n\n수사 결과 암살자인 포츠담 출신의 31세 토마스 서머는 1931년 친위대에 가입해 활동하다가 1935년 대전이 사태 이후 슈바르체 카펠레 소속 저항 조직원으로 전향한 인물로 밝혀졌습니다. 그는 결혼한 상태였으나 현재 아내는 행방불명입니다. 주목할 만한 점은 토마스 서머가 유리조노 세이아를 살해하기 며칠 전 한 친위대 대장과 만났다는 사실입니다. 그런데 이상하게도 그 대장은 유리조노 세이아가 암살된 다음 날 홀연히 자취를 감췄습니다.\n\n암살자가 심문도 받기 전에 사망한 점, 아내의 실종, 그리고 친위대 대장과의 접촉 후 대장마저 사라진 점 등 석연치 않은 정황들이 계속 드러나고 있습니다. 이 모든 것이 단순한 우연일까요? 사건의 전말은 여전히 불투명하며, 진실을 밝히라는 목소리는 점점 커지고 있습니다."
 trinity_events.12.a: "불쌍한 멍청이."
 trinity_events.13.t: "시스터후드의 음모?"
 trinity_events.13.desc: "사태 이후 시스터후드는 적극적으로 구호 작전을 펼치면서 독일 현지인들과 트리니티 학생들에게 여러 가지 구호 물품을 지급했습니다. 그런데 이것이 과연 순수한 신앙심에서 비롯된 것일까요? 아니면 그 이면에 정치적 계산이 깔려 있는 것은 아닐까요? 시스터후드가 이토록 적극적으로 움직인다는 사실 자체가 어떤 정치적 의미를 내포하고 있을지도 모릅니다.\n\n물론 이들은 이전에 정치에 대한 불간섭을 선언했습니다. 시스터후드가 티파티에 도전한다는 것은 상상조차 할 수 없는 일입니다. 그러나 그들의 진짜 의도를 명확히 아는 사람은 없습니다. 시스터후드는 베일에 싸인 조직으로 잘 알려져 있습니다. 내부 사안을 엄격히 관리하는 이들이 티파티에 모든 정보를 투명하게 공유할 것으로 기대하기는 어렵습니다. 급변하는 정세 그리고 최근 발생한 피습 사건까지 고려하면 시스터후드가 언제까지 중립을 지킬지 확신할 수 없는 상황입니다. 지금으로서는 그들이 끝까지 불간섭과 중립의 기조를 유지해주기를 바랄 수밖에 없습니다."
 trinity_events.13.a: "시스터후드가 개입할 이유가 있을까?"
 trinity_events.15.t: "켄자키 츠루기의 진언"
 trinity_events.15.desc: "미소노 미카의 전폭적인 지원 아래 정의실현부는 빠르게 팽창했습니다. 하지만 이러한 성장에는 뼈아픈 대가가 따랐습니다. 기존 부지에 최적화되어 있던 조직 구조는 사태 이후 급격히 확대된 학원 영토를 감당하지 못했고, 미카의 끝없는 지원은 오히려 조직을 쓸데없이 비대하게 만들었습니다. 비효율성은 곳곳에서 고개를 들었고, 정의실현부는 스스로의 무게를 감당하지 못하고 휘청거리기 시작했습니다.\n\n이 문제를 가장 절실하게 체감하는 사람은 정의실현부 부부장이자 모든 행정 업무를 총괄하는 하네카와 하스미였습니다. 늘어난 인원, 복잡해진 보고 체계, 끊임없이 쏟아지는 서류 더미... 하스미의 책상은 언제나 산더미 같은 문서로 가득했고, 그녀의 밤은 점점 길어져만 갔습니다. 조직이 커질수록 그녀가 감당해야 할 짐도 함께 무거워졌고, 이제는 혼자 힘으로는 도저히 감당할 수 없는 지경에 이르렀습니다.\n\n정의실현부 부장이자 행동대장, '도살자'라는 섬뜩한 이명으로 불리는 켄자키 츠루기는 하스미의 고통을 누구보다 잘 이해했습니다. 전장에서는 무자비하게 적을 도륙내지만, 사무실에서 고군분투하는 동료의 모습을 그냥 지나칠 수는 없었습니다. 츠루기는 하스미를 돕기 위해 행정 업무에 손을 뻗쳤습니다. 하지만 검을 다루는 일과 서류를 다루는 일은 전혀 달랐습니다. 익숙하지 않은 손놀림, 자주 발생하는 실수들까지 츠루기의 선의는 분명했지만, 그녀의 도움은 때로 하스미에게 추가적인 부담이 되기도 했습니다.\n\n그럼에도 츠루기는 포기하지 않았습니다. 동료의 고통을 외면할 수 없었고, 무엇보다 정의실현부가 제 기능을 하려면 이 문제를 반드시 해결해야 했습니다. 고민 끝에 츠루기는 결단을 내렸습니다. 티파티에 도움을 청하기로 한 것입니다. 하스미의 짐을 덜어주고, 정의실현부를 다시 효율적인 조직으로 되돌리기 위해서는 외부의 전문적인 지원이 필요했습니다."
 trinity_events.15.a: "당연하지! 티파티의 전문가들을 파견해라."
 trinity_events.15.b: "조직 내부의 문제는 스스로 해결 해라."
 trinity_events.14.t: "유리조노 세이아의 마지막 여로"
 trinity_events.14.desc: "유리조노 세이아는 상투스 분파의 수장이며, 그동안의 행적과 호스트 임기 동안의 업적을 고려할 때 국장을 치를 자격이 충분합니다.\n\n자작나무로 제작된 관은 상투스 분파의 상징색인 진한 노랑과 하얀색 제복을 입은 상투스 분파 임원들, 그리고 트리니티 정의실현부의 호위 속에 엄숙히 운구되었습니다. 그 뒤를 이어 퍼레이드 유니폼을 갖춰 입은 행렬이 따랐고, 상투스 분파의 원로들과 유리조노 세이아의 수많은 자매들이 그 뒤를 이었습니다. 또한, 파테르와 필리우스 분파의 자체 행진 부대가 함께하며, 평소 그녀를 지지하던 일반 학생들의 행렬이 마지막까지 길을 이었습니다.\n\n트리니티 종합학원의 상투스 분파 수장이자 전 호스트였던 유리조노 세이아는 이제 모교의 품에 영원히 안겼습니다."
 trinity_events.14.a: "세이아에게 조의를."
 trinity_events.14.b: "장례식을 축소해라."
 trinity_events.16.t: "상투스 분파의 운명"
 trinity_events.16.desc: "상투스 분파의 중도적이거나 급진적인 인물들은 모두 탈주했고 이제 남은 것은 원로들뿐입니다. 그러나 미소노 미카 법이 통과되면서 그들의 운명도 머지않아 결정될 것입니다.\n\n친 파테르 분파 인물들로 채워진 대법원은 대대적인 심판을 열었습니다.\n\n-아마베 치카, 권한 남용 혐의로 수감.\n-카토 나츠키, 정부에 대한 다양한 범죄 혐의로 수감.\n-미하라 리에, 뇌물 수수 및 근무 태만 등의 혐의로 수감.\n-시라키 마유코, 중대한 권한 남용 혐의로 수감.\n\n원로들은 권한 남용과 유리조노 세이아 암살 사건과의 연루 혐의로 재판을 받았으며 정부에 대한 다양한 혐의가 추가되었습니다. 그러나 미소노 미카는 유리조노 세이아와의 우정을 생각했는지 상투스 분파에게 예상외로 관대한 조건을 제시했습니다. 정적 숙청치고는 잔인하지 않았습니다. 상투스 분파의 임원들은 조건부로 사면받았고 다른 분파에 가입하거나 정계를 떠나는 선택지를 받았습니다.\n\n그럼에도 불구하고 일부 원로들은 달랐습니다. 그들은 모든 회유와 제안을 거부하고 상투스 분파에 끝까지 남기로 결정했습니다. 이는 신념의 문제였습니다. 결국 많은 이들이 수감되며 상투스 분파는 해체 수순을 밟게 되었습니다. 한때 트리니티의 중심이었던 분파는 이렇게 역사 속으로 사라져갔습니다."
 trinity_events.16.a: "이들은 모두 감옥에서 사라질 것이다."
 trinity_events.17.t: "필리우스 분파의 운명"
 trinity_events.17.desc: "미소노 미카와 키리후지 나기사는 오랜 소꿉친구였습니다. 어린 시절 함께 뛰놀던 두 사람은 서로를 누구보다 잘 이해하고 신뢰했습니다. 하지만 각기 다른 분파에 몸담으면서 그들의 운명도 조금씩 엇갈리기 시작했습니다. 아무리 깊은 인연이라도 정치가 개입하면 갈라서게 되는 것이 숙명일까요?\n\n티파티는 각 분파가 자신들의 이익을 위해 정책과 법안을 두고 치열하게 싸우는 곳이었으며 미카와 나기사 또한 여러 차례 대립을 거듭하며 양보 없는 싸움을 벌였습니다. 한때는 같은 편에서 웃으며 미래를 꿈꾸던 두 사람이 이제는 각자의 분파를 대표하는 정치적 인물로 맞서야 했습니다. 그럼에도 두 사람은 여전히 서로를 이해하고 있었습니다. 적어도 그때까지는 말입니다.\n\n그러나 지금의 상황은 어떨까요? 미소노 미카의 폭주를 저지하지 못한 키리후지 나기사는 현재 그녀의 명령에 따라 가택연금된 상태입니다. 과거 파테르 분파 출신 호스트에 대한 불신임 결의가 이루어졌던 시기와는 완전히 다른 양상입니다. 이번 사태를 통해 파테르 분파의 자존심은 완전히 회복되었고 복수는 완성되었습니다.\n\n이제 파테르 분파의 임원들은 보다 강력한 처벌을 요구하고 있습니다. 그러나 미소노 미카는 이에 동조하지 않고 있습니다. 그것이 옛 우정 때문인지 혹은 다른 정치적 고려 때문인지는 알 수 없으나 그녀는 보다 온건한 처벌을 주장하고 있습니다.\n\n한때 함께 꿈을 꾸던 두 소녀는 이제 서로 다른 운명의 끝에 서 있습니다. 한 명은 권력의 정점에서 다른 한 명은 그 권력에 의해 갇혀 있습니다. 이것이 그들이 선택한 길의 끝이었을까요?"
 trinity_events.17.a: "그녀를 티파티 유폐실에 투옥시켜라."
 trinity_events.17.b: "가택연금을 지속해라."
 trinity_events.18.t: "파테르 분파내 불충"
 trinity_events.18.desc: "수많은 이들이 지나가고, 수많은 법이 가결되거나 부결되던 삼두 정치의 근본이자 근원인 티파티에는 이제 파테르 분파와 그들의 수장, 미소노 미카만이 남아 있습니다. 미소노 미카와 파테르 분파는 일사천리로 자신들에게 유리한 법안을 통과시키며, 트리니티에 대한 장악력을 빠르게 강화하고 있습니다.\n\n어쩌면 당연하게도, 일부 반 미카적 성향을 가진 파테르 임원들은 이러한 계획을 반대하며, 티파티라는 연극의 장막 뒤에서 미소노 미카를 비롯한 일부 파테르 분파 임원들을 끌어내릴 계획을 세우고 있었습니다.\n\n그러나 그것이 운명이었는지, 혹은 신의 장난이었는지는 알 수 없지만, 쿠데타 계획은 실행되기도 전에 발각되었습니다.\n\n\"반역!\" 모든 트리니티의 뉴스가 이렇게 외치고 있습니다. 파테르 분파 내 반 미카적 성향을 가진 일부 임원들은 미소노 미카를 끌어내리려는 구체적인 음모를 세운 혐의로 현재 재판을 받고 있습니다. \"익명이지만 신뢰할 수 있는\" 다양한 소식통이 제공한 자료에 따르면, 이 음모는 경우에 따라 최대 1년 전으로 거슬러 올라가며, 타 분파의 임원들과 내통하거나 파테르 분파 임원들의 정보를 노골적으로 제공하는 등의 행위가 포함되어 있다고 합니다.\n\n미소노 미카 호스트는 이번 사건에 대한 언급을 자제하고 있지만, 일부 파테르 분파의 임원들이 트리니티의 이익을 최우선으로 고려하지 않는다는 사실이 명확해지면서 내부의 불충을 제거하기 위한 대규모 숙청이 단행될 것으로 예상됩니다."
 trinity_events.18.a: "하나, 하나 베어가며 내전을 끝낸다."
 trinity_events.19.t: "대법원"
 trinity_events.19.desc: "트리니티 대법원장의 임명은 티파티의 동의를 얻어 호스트가 지명하는 방식으로 이루어집니다. 그러나 지금의 정세는 마치 운명이라도 된 듯, 파테르 분파에게 유리하게 흐르고 있습니다. 상투스 분파는 유리조노 세이아 암살 사건을 계기로 급속히 분열했고, 그 결과 파테르 분파가 티파티 내 의석 과반을 차지하고, 미소노 미카가 호스트직을 차지하면서, 미소노 미카와 파테르 분파는 누구도 부정할 수 없는 절대적 권력을 손에 넣었습니다.\n\n미소노 미카는 자신의 지배를 영구적으로 만들기 위해 대법원장 임명을 추진하며 티파티에 이를 요청했습니다. 과반을 차지한 파테르 분파는 당연히 이를 승인했습니다. 필리우스 분파의 격렬한 정치적 견제와 저항이 있었지만, 티파티에서 절대적 우위를 점한 파테르 분파 앞에서는 그저 무의미한 발버둥에 불과했습니다.\n\n이제 마지막 사법적 절차마저 미소노 미카와 파테르 분파의 손아귀에 들어왔습니다. 미소노 미카의 추천으로 임명된 대법원장과 대법관들은 기존 대법관들을 축출했고, 이에 필리우스 분파는 강하게 반발하며 격렬한 비판을 쏟아냈습니다. 그러나 미소노 미카는 이를 아랑곳하지 않은 채 자신의 뜻을 계속해서 밀어붙였습니다."
 trinity_events.19.a: "이건 시작에 불과하다."
 trinity_events.20.t: "두 번째 트리니티의 태동"
 trinity_events.20.desc: "'대전이 사태'에서 시작된 일련의 중대한 사건들은 유리조노 세이아의 불행한 죽음과 티파티 붕괴를 거치며 새로운 국면을 맞이했습니다. 이제 더 이상의 혼란은 없을 것입니다. 호스트 미소노 미카의 지도력 아래 트리니티는 크나큰 진전을 이루고 있습니다.\n\n새롭게 제정된 트리니티 법률은 대중의 의지를 반영하며 신앙 또한 법률에 명시되었습니다. 모든 군대는 새로운 지도자에게 충성을 맹세했으며 대중들은 마침내 안정된 삶을 되찾게 될 것입니다. 개혁이 하나씩 시행될 때마다 파테르 분파는 트리니티의 중심에 더욱 깊이 자리 잡았고, 반면 다른 분파들은 점점 더 깊은 어둠 속으로 가라앉고 있습니다. 이제 트리니티의 변화에 대한 공식적인 선언이 이루어질 때가 되었습니다.\n\n트리니티 종합학원은 하나의 유기체와도 같습니다. 모든 이들이 하나로 모여 공통된 목표를 향해 나아갑니다. 수많은 깃발이 펄럭이는 에덴 광장에서 미소노 미카가 모습을 드러냅니다. 소란스럽던 광장은 그녀의 등장과 함께 차츰 조용해졌고, 이내 모든 이들이 단상 위에 선 그녀의 목소리에 귀를 기울였습니다. 미소노 미카는 팔꿈치에 자신의 모자를 얹은 채 파테르 분파의 승리를 되풀이하며 연설을 이어갔습니다. 그리고 마침내 그녀의 뒤로 펼쳐진 새로운 트리니티의 국기와 함께 구체제의 종말을 선언했습니다. 시대의 격동 속에서 트리니티가 새롭게 태어났음을 천명한 것입니다. 파테르 분파의 임원들은 일제히 환호하며 함성을 질렀고 잠시 후 광장을 가득 메운 대중들 또한 그 뒤를 따랐습니다."
 trinity_events.20.a: "모교 만세!"
 trinity_events.21.t: "트리니티 의용군단"
 trinity_events.21.desc: "트리니티의 반정부적 저항이 아예 없었다고 하면 거짓일 것입니다. 그러나 지속적인 탄압 속에서도 놀랍게도 살아남았습니다. 정의실현부의 감시망이 좁혀오던 중 대전이 사태가 발생하면서 이들은 극단적인 방향으로 치닫고 있었습니다. 오늘, 이른 아침 출근을 위해 대중교통을 이용하던 전 상투스 분파 임원을 향해 폭탄이 던져졌고 폭탄이 터져 전 상투스 분파 임원은 큰 피해를 입었고 대중교통을 이용하던 시민 대다수가 중상을 입었습니다. 이는 그녀가 파테르 분파와의 밀착 관계가 있었다는 의혹에 대한 사적제재로 추측 되고 있습니다.\n\n본래 소수의 반정부적 성향을 가진 민병대였지만 대전이 사태가 터지고 나서 이들은 급격하게 단체에 민병대원들을 받아들이기 시작하였고 현재 어느 지역에서는 알아주는 테러리스트들로 변하였습니다. 또한 미소노 미카가 정권을 잡으며 좌파적인 성향을 가진 분파 임원들 중 일부 또한 이 단체에 가담하는 등 여러 문제가 들려오고 있습니다.\n\n호스트에 대한 공통된 증오심을 매개로 더 온건한 성향의 세력들까지 끌어들이고 있다는 정황이 포착되었습니다. 극좌적 성향을 가진 전 상투스 분파 임원이였던 야마지 로미가 조직의 배후 인물로 지목되어, 국외 작전도 불사하며 그를 찾기 위한 대대적인 수색이 진행 중입니다."
 trinity_events.21.a: "그들을 발견한다면 그 즉시 파괴하라."
 trinity_events.22.t: "충성 조항"
 trinity_events.22.desc: "공직자의 도덕성과 이념을 검증하지 않았다는 사실이 믿어지십니까? 지금까지 공직자들의 도덕성과 정치적 성향을 면밀히 검증하지 않은 결과, 비애국적 성향을 지닌 이들이 쉽게 미디어를 장악하고 정부의 고위직을 차지하는 일이 빈번하게 발생했습니다. 실제로 상투스 분파의 수장이자 호스트인 유리조노 세이아 암살 사건으로 증명된 사실입니다.\n\n이제 더는 좌시할 수 없습니다! 트리니티가 위기에 처한 현 상황에서, 새로운 공무원법의 충성 조항을 도입하여 모든 공공기관의 인사들이 친 파테르 적 교육을 받고, 그 규율을 따름으로써 트리니티에 대한 충성심을 증명해야 합니다.\n\n모든 공직자를 트리니티에 충성하게 만들기 위해 가장 효과적인 방법은 '파테르 분파' 가입을 의무화하는 것입니다. 더 이상 다른 분파도 존재하지 않으며, 학생 의지를 대변하고, 안정을 유지하는 가장 좋은 방법이 될 것입니다. 예상대로 신규 구성원이 대거 증가하였으며, 반발하는 일부는 항의의 뜻으로 사직서를 제출하였습니다.\n\n물론 반 트리니티 조직과 연계된 비애국적 공직자들은 파테르 분파 가입이 금지되었으며, 이는 사실상 해고 조치와 다름없습니다. 더욱이, 이들 중 소수는 공공의 안전을 위협할 가능성이 높다고 판단되어, 정의실현부가 즉각적인 수사에 착수하였습니다."
 trinity_events.22.a: "최고를 위해 몇몇 예외사항을 두자."
 trinity_events.22.b: "트리니티에 대한 사랑이 가장 중요한 자격 요건이다."
 trinity_events.23.t: "하얀제복단"
 trinity_events.23.desc: "학원방위대는 하얀 제복을 착용하고 활동하는 것이 어느 정도 의무화되어 있습니다. 특히 고위층으로 갈수록 하얀 제복은 일상에서도 어느 정도 착용을 권고하고 있습니다.\n\n미소노 미카가 정권을 잡기 전부터 티파티 임원들 중 일부 호전적인 인물들은 자신들만의 '민병대'를 활용하였습니다. 주로 불량배 출신이거나 사태 이후 불량배가 되었거나 성적 미달로 트리니티에서 퇴학당한 이들로 구성된 사병들은 정치적인 활동에 동원되기도 했습니다. 아니면 자경단처럼 치안 유지를 목적으로 순찰을 돌거나 범죄자 체포를 위해 정의실현부를 돕는 등 여러 가지 일에 동원되고 있었습니다.\n\n미소노 미카는 개인들이 사병을 보유하고 있는 것을 흥미롭게 여기고 있습니다. 어느 정도 무력을 가진 것은 위협적이나 그 수준이 정의실현부 부원보다는 못하기에 미소노 미카는 정권을 찬탈한 이후에도 어느 정도 '양보'를 하고 있었을 뿐이었습니다. 특히 키보토스 출신의 불량배와 퇴학생을 트리니티의 전력으로 써먹을 수 있다는 것은 이점이 있기 때문입니다.\n\n물론 무조건 정치적인 활동에 동원되는 것만은 아닙니다. 자원봉사를 목적으로 순찰을 돌고 나눔을 베풀고 신앙을 실현하며 지급되는 소량의 활동비로 삶이 무너진 이들에게 기부하고 소수의 독일 현지인들에게 자신들의 끼니를 나누고 갈 곳 없는 고아들을 지원하는 등 여러 스펙트럼을 가진 이들 또한 존재합니다.\n\n미소노 미카는 이러한 사병들을 하나의 단체로 구성하였고 '학원방위대'라는 이름으로 이들을 소집했습니다."
 trinity_events.23.a: "끝없이 행진하리라."
 trinity_events.24.t: "파테르 분파의 부상"
 trinity_events.24.desc: "수많은 이들이 파테르 분파에 가입하면서 파테르 분파는 기존의 고지식한 엘리트주의 집단이 아닌 시민을 위한 대중적인 분파로 변모해가고 있습니다. 그럼에도 아직 대중적인 분파라는 것에 미숙한 파테르 분파는 여러가지 사건사고가 발생하고 있습니다. 특히 최근의 발생한 사태 때문에 일반 대중들이 겪고 있는 어려운 시기에 배가 고프다면 빵 대신 케이크를 먹으라는 발언은 절대 일반 학생들을 위한 발언이 아닙니다.\n\n파테르 분파는 그럼에도 대중적인 분파로 변모하고 있습니다. 파테르 분파의 임원들은 사비를 이용해 사람들에게 간단한 '복지'를 뿌리고 있습니다. 물론 사비를 이용하는 것이기에 티파티 임원들의 월권 행위라고 비판 받고 있지만 신헌장이 보장하는 한 이들은 아무런 처벌 없이 피해갈 수 있습니다."
 trinity_events.24.a: "대천사의 추종자들이 마침내 형태를 갖추게 되었다."
 trinity_events.24.b: "좀 더 자치구의 시민들을 위해 할 수 없나?"
 trinity_events.25.t: "이끄는 자와 따르는 자"
 trinity_events.25.desc: "미소노 미카와 파테르 분파는 자신들의 권력을 공고히 하며 나날이 변화하고 있습니다. 그들은 유기적으로 변하면서도 트리니티를 더욱 나은 상황으로 만들려는 공통된 목표를 위해 힘쓰고 있습니다. 미소노 미카는 마치 섭리처럼 정권을 잡았습니다. 자치구의 시민들은 섭리 속에서 온순한 양이 되기 위해 태어난 것이 아닙니다. 조용히 앉아 자신들이 천천히 죽어가는 것도 모른 채 살아가기 위해 존재하는 것도 아닙니다. 우리는 우리의 운명을 스스로 쟁취하기 위해 태어났습니다. 우리는 거대한 악을 타도하고 운명을 뒤바꾸기 위해 존재합니다. 미소노 미카는 우리의 대리인이자 우리를 이끄는 사자입니다. 그리고 우리는 그녀를 따르는 양떼이자 동시에 병사입니다."
 trinity_events.25.a: "트리니티에 영광을, 대천사에게 영광을!"
 trinity_events.26.t: "대회의 끝"
 trinity_events.26.desc: "파테르 분파의 방향에 대한 가장 중요한 질문이 해결되었으며, 참석자 대부분이 이를 인정하여 강령의 하나로 채택되었습니다. 이어서 또 다른 사회 문제에 대한 논의가 진행되었고, 대회는 마무리를 향해 나아가고 있습니다. 특히, 트리니티의 인물들과 독일 정치인들이 서로를 향해 연설을 주고받으며 치열한 공방을 벌인 장면은 신문에 실릴 정도로 뜨거운 관심을 불러일으켰습니다.\n\n대회의 마지막, 호스트는 파테르 분파 임원들에게 연설하며 \"모교을 쇄신하는 막중한 의무\"를 지닌 이들을 치하했습니다. 그녀는 \"오늘 이 자리에 모인 임원들은 분명 그 임무를 수행할 준비가 되어 있으며, 나 역시 이들과 함께 의미 있는 성과를 이루기를 기대한다\"고 말하며 대회를 마무리했습니다."
 trinity_events.26.a: "두 번째 트리니티를 위해, 만세를 외치자!"
 trinity_events.27.t: "미소노 미카의 인상"
 trinity_events.27.desc: "미소노 미카는 대중 앞에 나서는 것을 좋아하며 확고한 이미지를 구축해나가고 있습니다. 그녀는 전 트리니티 학생들에게 희망이 되고 있고, 독일 대중들에게는 새로운 대안으로 자리잡고 있습니다. 부드럽지만 강렬한 카리스마로 정권을 장악한 그녀는 대중들에게 영감을 불러일으키는 매개체 역할을 하고 있습니다. 키보토스 억양이 남아있지만 독일어도 구사할 수 있으며, 이전 나치 정권의 치부를 대중들에게 공개하여 독일인들에게서도 지지를 얻고 있습니다.\n\n확고한 이미지를 남기기 위해 그녀의 이명에 새로운 색채가 더해지고 있습니다. 이미 '대천사'라는 이명이 널리 퍼져있지만 이것만으로는 충분하지 않습니다. 종교적인 색채가 담긴 이명은 모든 사람에게 통하지 않기 때문입니다. 트리니티 학생들은 그녀를 '트리니티의 구원자', '자상한 어머니', '운명의 사자', '선택받은 자' 등으로 부르고 있습니다. 이 외에도 여러 이명들이 존재합니다. 심지어 긍정적으로 받아들여야 할지 모호하지만, 독일인들 사이에서는 '영도자'라고 지칭하고 있습니다.\n\n확고한 이미지를 구축하기 위해서는 하나의 단어를 선택할 필요가 있습니다. 그럼에도 불구하고 미소노 미카는 트리니티의 구원자이자 자상한 어머니이며, 운명의 사자이자 선택받은 자이고, 영도자이며, 동시에 티파티의 호스트이자 전 트리니티의 학생회장입니다."
 trinity_events.27.a: "호스트는 트리니티의 구원자시다."
 trinity_events.27.b: "호스트는 자상하신 어머니다."
 trinity_events.27.c: "호스트는 모든 이들의 영도자시다."
 trinity_culture_events.1.t: "'트리니티 신 문화'"
 trinity_culture_events.1.desc: "문화란 사회 전반의 생활 양식이라고 단순화하여 설명할 수 있습니다. 그러나 그 문화가 퇴폐적이라면 우리는 어떻게 해야 할까요? 그것 역시 하나의 문화로 받아들이고 퇴폐적인 문화 활동을 이어가야만 할까요? 이에 대해 미소노 미카와 파테르 분파는 분명히 \"아니오\"라고 답했습니다.\n\n트리니티가 예술적-사상적으로 일정 부분 진보해 왔음은 사실이지만 타 학원과 비교했을 때 크나큰 도약을 이루지는 못했습니다. 평화의 시기 동안 우리는 지체되었습니다. 타 학원들은 우리를 따라잡거나 뛰어넘었으며 심지어 트리니티와 앙숙인 게헨나 학원조차도 트리니티에서는 느낄 수 없는 고유한 문화적 방식을 확립해 살아가고 있습니다.\n\n파테르 분파는 이러한 퇴폐 문화를 뿌리 뽑고자 미소노 미카에게 한 가지 정책을 건의했습니다. 기존 문화청의 권한을 확장하여 퇴폐적 문화를 반대하고 트리니티만의 고유한 신 문화를 창출-진흥해야 한다는 것이었습니다. 미소노 미카는 이 건의를 진지하게 검토했고 곧 승인하였습니다.\n\n사실 미소노 미카는 이전부터 신 문화에 깊은 고민을 하고 있었습니다. 그녀는 기존의 방식들을 지나치게 '귀찮고 짜증나는 것'으로 여겨 왔습니다. 그렇기에 파테르 분파 측에서 먼저 이와 같은 제안을 한 것은 미소노 미카에게도 뜻밖의 행운이었을 것입니다."
 trinity_culture_events.1.a: "새로운 문화, 새로운 트리니티!"
 trinity_events.28.t: "트리니티 교육과정"
 trinity_events.28.desc: "트리니티의 교육 방식에는 종교적 색채가 짙게 배어 있습니다. 채플 수업이 그 대표적인 예시입니다. 물론 트리니티 종합학원이 종교적 가치 위에 세워졌다는 사실을 부정하려는 것은 아닙니다. 다만 우리는 조금 더 효율적이고 실용적인 방향으로 나아가야 하기에 이 문제를 논의하고 있는 것입니다.\n\n채플 수업과 종교 활동 같은 과목들을 무조건 필참이 아닌 선택 과목으로 전환하거나, 시스터후드를 위한 다른 형태의 과목으로 개설할 것입니다. 물론 이러한 선택은 시스터후드의 반발을 살 수 있습니다. 그러나 이를 통해 트리니티 학생들은 보다 넓은 학문적 자유를 누릴 수 있게 될 것입니다."
 trinity_events.28.a: "괜찮은 거 같다. 이를 반영하자."
 trinity_events.28.b: "시스터후드의 반발을 살 필요가 있을까?"
 trinity_culture_events.2.t: "건축 양식"
 trinity_culture_events.2.desc: "트리니티의 예술에는 여러 방식이 존재하며 그중 하나는 건축 양식입니다. 파란 지붕, 고풍스러운 벽과 화려한 내부 장식, 그리고 정교한 비율까지 트리니티의 건축은 타 학원과 달리 고풍스럽고 고급스럽게 발전해왔습니다. 그러나 이러한 건축 양식은 자재 수급에 어려움을 겪고 있습니다. 지나친 완벽주의를 고수하다 보니 건물 하나를 완성하는 데 수십 개월이 걸리기도 합니다. 이 문제는 사태 이후에도 여전히 해결되지 않고 있습니다.\n\n분파내 토론에서 외부와 내부의 장식을 최소화하고 효율성과 기능성을 우선시하는 모더니즘 건축 양식이 대안으로 떠올랐습니다. 그러나 모더니즘 내에서도 두 갈래의 의견이 나타났는데, 바로 친환경에 관한 문제였습니다. 트리니티는 이전부터 친환경적인 방식을 중시해왔기에 모더니즘 건축 또한 친환경적 요소를 반드시 채용해야 한다는 주장이 제기되고 있습니다."
 trinity_culture_events.2.a: "친환경적인 모더니즘이 더욱 트리니티답다."
 trinity_culture_events.2.b: "친환경은 중요하지만, 다른 게 더 중요하다."
 trinity_culture_events.3.t: "대중문화 통제"
 trinity_culture_events.3.desc: "대중문화는 말 그대로 대중들이 쉽게 접할 수 있는 문화입니다. 그러나 다르게 말하자면 대중을 손쉽게 통제하고 선전할 수 있는 도구로 전락할 수도 있다는 뜻이기도 합니다. 그렇기에 파테르 분파는 이 영역에서 하나의 '패권'을 쥐기 위해 꾸준히 노력해 왔습니다. 미소노 미카 집권 이전까지는 그 전략이 어느 정도 효과를 발휘하는 듯했으나 결국 한계에 부딪혀 더 이상 의미 있는 성과를 내지 못하게 되었습니다.\n\n이에 파테르 분파는 대중문화를 확실히 통제하기 위해 티파티의 권한을 활용하자고 제안했습니다. 언론, 출판, 교육, 영화 등 모든 매체에서 미소노 미카를 옹호하고 트리니티의 고유한 이념을 교묘히 스며들게 하는 것 혹은 예술과 음악을 동원해 트리니티에 대한 충성을 강요하는 오페라나 교향곡을 제작하는 방안까지도 논의되었습니다."
 trinity_culture_events.3.a: "통제는 오히려 불만을 일으킬 수 있다."
 trinity_culture_events.3.b: "대중문화 통제는 트리니티를 지키는 또 다른 방패가 될 것이다."
 trinity_culture_events.4.t: ""
 trinity_events.29.t: "트리니티 신앙"
 trinity_events.29.desc: "독일 내 교회들은 예상보다 훨씬 기회주의적인 태도를 취하고 있어 중앙구와 서구 지역을 중심으로 트리니티의 신앙이 들불처럼 번져나가는 중입니다. 이 같은 급격한 변화의 중심에는 우타즈미 사쿠라코의 헌신적인 선교 활동이 있었으며 그녀의 진심 어린 설교에 감화된 현지 성직자들은 외압 없이도 교리를 수용하고 티파티의 관심을 갈구하게 되었습니다.\n\n해당 지역 주민들은 거부감 없이 신앙에 빠르게 동화되고 있습니다. 그러나 보수의 성채로 불리는 지방, 농촌 지역만큼은 여전히 외부 문물에 배타적인 태도를 고수하며 가르침을 거부하는 이중적인 양상을 보입니다.\n\n신자 구성의 경우 여성이 높은 비율을 차지합니다. 이는 현지 종교 대비 진보적이고 개방적인 교리가 혼란스러운 사회 속에서 유대감을 형성하려는 이들의 필요를 충족시켰기 때문입니다. 물론 남성 신자도 적지 않은 숫자를 기록하고 있으며 이들은 주로 도시의 자본가나 지식인층 혹은 우리와의 교류를 희망하는 계층을 중심으로 개종이 이루어지고 있습니다.\n\n특기할 점은 가톨릭 신자들의 회심 비율이 유독 높다는 사실입니다. 이는 양 종교 간의 교리적 유사성이 개종에 따르는 심리적 장벽을 낮추는 데 크게 기여한 것으로 보입니다."
 trinity_events.29.a: "외통수"
 trinity_events.30.t: "여성 인권"
 trinity_events.30.desc: "나치의 여성 정책은 극도로 억압적이었습니다. 그들은 남성과 여성의 역할을 철저히 분리하고 여성을 독립적 인격체가 아닌 도구로 전락시키려 했습니다. '아이, 부엌, 교회'라는 구호 아래 여성의 삶을 가정으로 제한했고, 결혼 장려법을 통해 마치 여성의 존엄을 돈으로 살 수 있다는 듯 행동했습니다.\n\n이 시기 수많은 여성 공직자들이 강제 해고되었습니다. 교사, 의사, 판사 등 전문직에 종사하던 여성들도 예외 없이 직장에서 쫓겨났습니다. 나치는 여성에게서 경제적 독립과 사회적 지위를 빼앗으려 했던 것입니다. 더 나아가 레벤스보른 계획과 같은 비인간적 정책을 통해 여성을 오직 출산의 수단으로만 취급하려 했습니다.\n\n이제 이 모든 것을 바로잡아야 합니다. 나치와 SS가 남긴 억압의 유산을 이 사회에서 완전히 뿌리뽑을 것입니다. 부당하게 해고당한 여성 공직자들은 즉시 복직될 것입니다. 이것은 특별한 혜택이 아니라 마땅히 회복되어야 할 권리입니다. 우리 사회가 야만으로 후퇴하지 않았다는 것을 증명해야 할 때입니다."
 trinity_events.30.a: "여성들이여, 힘내라! 우리가 함께한다!"
 trinity_events.31.t: "독일의 운명"
 trinity_events.31.desc: "미소노 미카와 파테르 분파는 트리니티의 독일인들에 대해 의논을 나누고 있습니다. 현실적으로 추방이 좋은 선택지처럼 보입니다. 그러나 수천만에 달하는 독일인을 전부 추방할 수는 없습니다. 그렇기에 독일인들을 트리니티에 종속시키거나, 아니면 독일이라는 개념을 철저히 파괴해 더 이상 저항할 의지를 온전히 꺾어버려야 합니다.\n\n파테르 분파 대부분은 독일의 정체성라는 개념을 철저하게 '말살'시키고 그들을 '노예'처럼 부리는 방안을 지지하고 있습니다. 이들은 독일인의 근본이 되는 것들을 파괴하고 그 자리에 트리니티를 심을 계획입니다.\n\n당연히 이러한 계획은 미소노 미카의 지지를 받지 못하고 있습니다. 미소노 미카에게는 생각보다 여린 마음이 남아있습니다. 정적들을 제거하더라도 그들에게 죽음을 부여하지 않았습니다. 그저 중앙에서 멀리 떨어진 곳으로 보내 정치 활동을 할 수 없도록 감시하는 선에서 마무리했습니다. 이러한 연민을 독일인들을 향해서도 느끼고 있습니다. 그러나 너무 강한 연민은 보이지 않습니다. 미소노 미카는 불쌍하지만 어쩔 수 없는 일로 치부하며 독일인들의 운명을 결정하고 있습니다."
 trinity_events.31.a: "독일인은 살아남을 것이다. 2급 시민으로서 말이다."
 trinity_events.31.b: "독일의 정체성이라는 건 말살될 것이다. 영원히."
 trinity_events.32.t: "학원의 목자"
 trinity_events.32.desc: "트리니티의 지도자이자 티파티의 호스트인 미소노 미카는 수많은 이명으로 불리며, 그중에서도 특히 '학원의 목자'라는 칭호를 마음에 들어합니다. 트리니티의 보호자이자 구원자, 그리고 학원을 이끄는 존재라는 의미를 담은 '목자'라는 단어는 그녀에게 새로운 영감을 불어넣고 있습니다.\n\n사회적 갈등은 여전히 완전히 해결되지 않았지만, 이전보다 더 많은 독일인들이 미소노 미카를 지지하거나 그녀의 지도를 받아들이고 있습니다. 트리니티 학생들 사이에서도 독일인을 향한 증오 범죄나 쾌락을 위한 범죄들이 점차 줄어들고 있습니다. 이는 정의실현부와 트리니티 자경단의 활약 덕분입니다. 많은 학생들이 독일인들에게 연민을 품고 다가가고 있으며, 지금은 어렵더라도 시간이 충분히 주어진다면 트리니티 학생들과 독일인들이 진정으로 융화하는 날이 머지않아 보입니다.\n\n여담으로, 트리니티 내 일부 소규모 독일인 커뮤니티에서는 미소노 미카를 일종의 '아이돌'처럼 여기는 분위기가 조성되며, 팬덤 문화가 조심스럽게 자리잡아가고 있습니다."
 trinity_events.32.a: "준비하라!"
 trinity_events.33.t: "티파티의 호스트 지명"
 trinity_events.33.desc: "유리조노 세이아 암살 사건의 여파는 가라앉을 기미가 보이지 않았고, 다음 호스트는 과연 누가 될 것인지에 대한 의문이 떠오르기 시작했습니다.\n\n티파티의 많은 임원들은 미소노 미카가 차기 호스트로 지명될 것이라 예상했고, 이는 거의 기정사실로 받아들여졌습니다. 유리조노 세이아 암살 이후 상투스 분파는 사실상 영향력을 상실했으며, 키리후지 나기사가 이끄는 필리우스 분파 또한 파테르 분파의 거센 정치적 공세 앞에서 제대로 된 반격조차 어려운 상황이었습니다.\n\n그러나 미소노 미카가 절대적인 차기 호스트라는 보장은 없었습니다. 그녀의 선전 전략은 파테르 분파의 세력을 급격히 확장시키는 데 성공했지만 내부적으로도 반대 목소리가 나오기 시작했습니다. 특히 '온건파' 세력은 이러한 흐름에 반기를 들었습니다.\n\n그럼에도 불구하고 희망은 보이지 않았고 결국 호스트 투표가 시작되었습니다. 후보로 나선 미소노 미카와 키리후지 나기사는 티파티의 선서 아래 자신들의 정책을 차례로 연설했습니다. 미소노 미카가 연설을 할 때 파테르 분파는 열광적인 호응을 보였지만, 반대로 키리후지 나기사가 연설할 때는 무관심하거나 야유가 쏟아지는 등 여러 문제가 발생했습니다. 다행히도 투표 과정 자체는 비교적 큰 문제 없이 진행되었습니다.\n\n그리고 마침내 개표가 시작되었습니다. 개표 방송이 빠르게 진행되었고, 이제 남은 것은 오직 하나입니다.\n\n결과는 과연...?"
 trinity_events.33.a: "미소노 미카가 과반을 차지하며 선출 되었다."
 trinity_events.33.b: "모두의 예상을 뒤엎고, 키리후지 나기사가 선출 되었다."
 trinity_events.34.t: "학원경제개발부 부장 임명"
 trinity_events.34.desc: "학원의 총채적인 경제 문제를 해결하기 위해 경제와 산업 전문가들이 소집되어 학원경제개발부가 창설되었습니다. 이 조직은 공식적인 대표 없이 느슨한 협동조합주의적 성향을 띄우고 있습니다. 각자 자신만의 방식이 옳다고 주장하며 열띤 토론과 연구를 이어가는 모습은 바람직하지만, 지나치게 과열되지 않도록 조정하는 역할이 절실합니다. 이 조율자의 역할을 맡는 것이 학원경제개발부의 부장이 될 것입니다.\n\n현재 개발부 내부에서 마땅히 맡을 자가 없어 보이지만, 이미 외부에서 그 해답을 찾았습니다. 도서부장 우이와 도서부원 시미코입니다.\n\n코제키 우이는 현재 도서부장으로, 책을 사랑하는 인물로 잘 알려져 있으며 이는 경제학 서적 역시 자주 읽어보고 이해하고 실현할 지도 모릅니다. 그녀의 내성적인 성격과, 부족한 인간관계를 예시로 부적합 하다는 내용도 있지만, 이정도는 충분히 고칠수 있습니다.\n\n다음은 엔도우 시미코입니다. 그녀 또한 도서부의 일원입니다. 트리니티에 존재하는 모든 서적을 읽어봤다고 자처합니다. 또한 거대한 도서를 관리하는 모습과 꽤나 다른 학생들과 교류하는 등 여러 부분을 "
 trinity_events.34.a: "코제키 우이, 내성적인 성격은 별로 문제가 되지 않는다."
 trinity_events.34.b: "엔도우 시미코, 중재하는 모습이 큰 귀감이 되었다."
 trinity_events.34.c: "알아서들 해라"
 trinity_events.35.t: "학원정보부 재편"
 trinity_events.35.desc: "끔찍했던 유리조노 세이아 암살 사건 이후, 트리니티 학원정보부는 사실상 기능을 상실했음이 명백히 드러났습니다. 대외 정보 수집 능력은 타 학원과 비교해 부족한 수준이며, 내부 방첩 체계는 말 그대로 처참합니다. 트리니티의 안보를 책임지는 이들이 이래서야 과연 괜찮다고 할 수 있겠습니까? 현 학원 정보부장인 이타노 요리코는 이러한 문제들을 자신이 해결할 수 있다며 시간을 요청하고 있으나, 이 사안은 시간에 맡겨 둘 수 있을 만큼 느긋한 문제가 아닙니다.\n\n학원정보부는 더 이상 독립 기관이 아닌, 티파티 산하 내무 부서로 재편될 예정입니다. 이타노 요리코 학원 정보부장은 즉시 해임되며, 이후의 정보부장 임명은 호스트가 직접 결정하는 방식으로 이루어질 것입니다. 또한 사상 검증이 시행되어, 정부에 불충한 인물들은 전원 퇴직하거나 정의실현부의 수사를 피할 수 없게 될 것입니다.\n\n끔찍했던 유리조노 세이아 암살 사건과 같은 비극을 사전에 방지하기 위해, 그동안 부족하다는 지적을 받아온 정보 수집 능력이 보완되며, 정보 수집 및 감시 범위 역시 대폭 확대될 예정입니다. 이에 따라 많은 학생이 사생활 침해를 겪을 수 있겠지만, 대의를 위해서라면 트리니티의 학생들도 이를 감수할 것입니다.\n\n트리니티 종합학원 헌장 제5차 개정안이 이를 명시하고 있는 만큼, 학원정보부의 재편은 신속히 진행될 것으로 보입니다."
 trinity_events.35.a: "이는 반드시 감수해야 할 일이다."
 trinity_events.36.t: "안보 상황"
 trinity_events.36.desc: "트리니티 종합학원의 안보는 여전히 위태롭습니다. 동쪽에는 거대한 [SOV.GetAdjective] 측이 도사리고 있고, 서쪽에는 [GEM.GetAdjective]와 [GEH.GetAdjective]가, 북쪽에는 [RED.GetAdjective] 측이 위협을 가하고 있습니다. 남쪽으로는 수많은 군소 학원들이 산재해 있으나, 이들 역시 '남키보토스'라는 이름 아래 단일 정부를 세울 가능성을 배제할 수 없습니다.\n\n이 거대한 위협은 미소노 미카, 파테르 분파가 반드시 마주하고 해결해야 할 숙명이 되었습니다. 게다가 학생들은 날이 갈수록 게헨나와의 전쟁을 촉구하며 학원 간 긴장을 악화시키고 있습니다. 미소노 미카가 정권을 잡으며 내세운 약속이 바로 이 숙원을 해결하는 것이었지만, 준비되지 않은 전쟁은 트리니티를 파멸로 이끌고, 제1차 공의회가 남긴 유산마저 허물어뜨릴 것입니다.\n\n파테르 분파, 미소노 미카는 이 위태로운 안보 상황을 두고 밤낮없이 토론을 이어가고 있지만, 결론은 쉽게 나오지 않습니다."
 trinity_events.36.a: "이는 지정학적 재앙이다."
 trinity_events.37.t: "소규모 분파의 탄생"
 trinity_events.37.desc: "트리니티의 거대한 두 분파가 사라지자 그 자리를 비집고 들어온 것은 소규모 분파들입니다. 특히 미소노 미카의 정권 찬탈 이후 개정된 미소노 미카 법은 새로운 분파 창설을 유의미한 수준으로 막고 있지 않기 때문에 이러한 소규모 분파들이 난립하는 것은 예상된 범주입니다.\n\n구 대형 분파 출신들이 새롭게 창설한 분파들 중 몇몇을 대표적으로 살펴보면 미소노 미카와 파테르 분파의 이념적 색채를 거부하고 탈퇴해 새로운 분파를 창설한 이들이 있습니다. 이들에게는 이념적 신념 따위 존재하지 않으며 기존의 불쾌하기만 한 파테르 분파의 폐단을 반복하기만을 원하는 이들로만 구성되어 있습니다. 파테르 분파는 이들을 '탕아'라고 지칭하며 경멸하고 있고 새로운 분파는 파테르 분파를 타락한 천사들이라며 비난 수위를 올리고 있습니다.\n\n한편 필리우스 분파와 상투스 분파 출신이었던 이상주의자들이 새롭게 창설한 분파의 성향은 흥미롭습니다. 이들은 주로 진보적인 자유주의 이념을 표방하지만 필리우스 분파와 상투스 분파의 대표 사이 이념적 차이 그리고 분파의 성향 차이 그리고 본질적인 문제로 두 분파 간의 합의는 요원합니다."
 trinity_events.37.a: "다들 소꿉놀이라도 하는 걸까나?"
 trinity_events.38.t: "독일 사업체에 대한 논의"
 trinity_events.38.desc_ui: "대전이 사태 이후 수많은 사업체들이 파산하거나 심각한 피해를 입으면서, 우리는 이 빈틈을 파고들어 이들을 국유화하며 학원 경제의 근간을 다져왔습니다. 그럼에도 여전히 다수의 중공업과 일부 경공업 사업체가 살아남아 있으며, 이들은 주로 학원 내부의 백만장자들이 소유하고 있습니다. 특히 오데르 강 너머, 우리의 통제가 완전히 미치지 않는 지역에는 여전히 개인 소유의 '국가 이익 사업체'들이 버티고 있습니다.\n\n파테르 분파 내 일부 경제학자들은 이들에 대한 과격한 개입을 경계하고 있습니다. 이른바 경제 중도파라 불리는 이들은, 일부 중공업이 민간 소유로 남아 있더라도 학원 계획에 심대한 위협이 되지 않으며, 오히려 사업가들이 정치적 동맹을 맺어줄 것이라고 주장합니다.\n\n그러나 학원경제개발부 부장인 코제키 우이는 단호합니다. 그녀는 이렇게 말합니다.\n\"......모두가 머리의 뜻을 따르지 않으면, 학원 경제를 제대로 계획할 수 있을 리가 없잖아요.\"\n\n그녀와 개발부의 전문가들은 보상이 있든 없든, 전면적이고 철저한 국유화를 강력히 요구하고 있습니다."
 trinity_events.38.desc_Sch: "대전이 사태 이후 수많은 사업체들이 파산하거나 심각한 피해를 입으면서, 우리는 이 빈틈을 파고들어 이들을 국유화하며 학원 경제의 근간을 다져왔습니다. 그럼에도 여전히 다수의 중공업과 일부 경공업 사업체가 살아남아 있으며, 이들은 주로 학원 내부의 백만장자들이 소유하고 있습니다. 특히 오데르 강 너머, 우리의 통제가 완전히 미치지 않는 지역에는 여전히 개인 소유의 '국가 이익 사업체'들이 버티고 있습니다.\n\n학원경제개발부의 부장인 엔도우 시미코는 \"일부 중공업이 민간 소유로 남아 있어도 계획에 차질은 없어요!\"라고 말하며 과도한 개입을 견제하고 일부 사업체들과의 '동맹'을 주장하고 있습니다. 경영자들과 대화하기 위해 경영자 단체와 상공회의소를 창설할 것을 강력하게 주장하고 있습니다."
 trinity_events.38.a: "국유화하되 소유주들이 경영하게 해라."
 trinity_events.38.b: "일단은 내버려둬라. 나중에 공정하게 구매하겠다."
 trinity_events.38.c: "그녀의 말이 옳다. 그냥 뺏어와라. 허락받을 필요가 어디있나." # 우이 선택지
 trinity_events.38.d: "이들에게 '특혜'를 부여해 긴밀한 협력을 주도해보자." # 시미코 선택지
 trinity_events.39.t: "한스 프리체"
 trinity_events.39.desc: "오늘 호스트 앞으로 한 통의 편지가 도착했습니다. 발신자는 '한스 프리체'라는 인물로, 서한에는 고풍스러운 필기체로 본인의 능력과 경력을 강조하는 내용이 담겨 있었습니다. 특히 그는 자신의 목소리에 '울림이 있다'고 표현하며, 대중 설득력에 대한 강한 자신감을 드러냈습니다.\n\n트리니티 정보부가 조사한 결과, 그는 대전이 사태 이전 독일의 국가사회주의 독일 노동자당 소속으로 관료직을 수행했으며, 요제프 괴벨스의 연설 성우로 활동한 이력을 확인했습니다. 사태 이후의 행적은 불분명하지만, 현재 트리니티에 대한 반감을 드러내지 않고 있어, 충돌 없이 생존하거나 피신에 성공한 것으로 추정됩니다.\n\n요제프 괴벨스는 한때 독일국의 선전기구를 이끌며 지도자의 이미지 형성에 크게 기여한 인물입니다. 우리에게 그와 같은 인물은 존재하지 않지만, 그의 목소리를 흉내낼 수 있는 한스 프리체는 대중 설득과 선전 활동에서 일정 부분 유용하게 활용될 가능성이 있습니다."
 trinity_events.39.a: "등용하는 것도 나쁘지 않아 보인다."
 trinity_events.39.b: "...엘베강의 식인 피라냐는 기회주의자의 살점을 좋아한다더군."
 trinity_events.40.t: "트리니티 재산업화"
 trinity_events.40.desc: "급격하게 늘어난 학원 부지는 트리니티 산업을 확장할 절호의 기회입니다. 학원의 토목 전문가들이 모여 구상한 트리니티 재산업화 계획은 사태 발생 이후 급증한 산업 분야의 문제들과 독일 현지인들의 실업 문제를 동시에 해결할 수 있는 방안으로 주목받고 있습니다.\n\n재산업화 과정은 명확한 단계를 따릅니다. 먼저 개발 지역 근처에 간단한 막사를 건설합니다. 노동자들은 이곳에서 의식주를 해결하며 학원에 노동력을 제공하게 됩니다. 봉급은 키보토스 엔화 90%와 독일 마르크 10%로 지급됩니다. 개발이 완료된 후 노동자들은 선택의 기로에 서게 됩니다. 해당 지역에서 계속 일할 수도 있고, 다른 개발 지역으로 이동할 수도 있으며, 원한다면 그만둘 수도 있습니다. 결정하는 것은 그들의 몫입니다.\n\n재산업화 계획이 공개되자 독일 현지인들뿐만 아니라 일부 학생들과 수인들도 큰 관심을 보이고 있습니다. 지원자 모집은 현재 진행 중이며, 많은 이들의 기대 속에 계획이 본격화되고 있습니다."
 trinity_events.40.a: "우리는 그들의 노력의 결실을 기대한다."
 trinity_events.41.t: "게헨나 학생들의 저항 운동"
 trinity_events.41.desc: "트리니티와의 전쟁에서 패배한 지 며칠도 지나지 않아, 게헨나의 학생들 사이에서는 자발적인 연합 움직임이 포착되고 있습니다. 특히 온천개발부, 미식연구부, 귀가부, 만마전 친위대, 그리고 선도부 등 저항 활동은 단순한 불복종을 넘어 전 학원적인 문제로 번지고 있으며, 트리니티 종합학원 부지 내에서도 각종 소요와 치안 불안을 초래하고 있습니다.\n\n이러한 사태는 단순한 불만 표출을 넘어서 조직적인 저항의 양상을 띠고 있어, 더 이상의 방치는 학원의 질서를 위협할 수 있습니다. 상황의 심각성을 감안할 때, 호스트의 신속한 재가와 결단이 절실히 요구됩니다."
 trinity_events.41.a: "골치 아프군"
 trinity_events.43.t: "게헨나 동아리 문제"
 trinity_events.43.desc: "\"와핫핫핫!!\"\n\"후우! 개운하구만!\"\n\n게헨나의 골칫거리이자 키보토스 전역에서 지명수배 중인 온천개발부의 키누가와 카스미는 현재 트리니티와 게헨나를 넘나들며 '온천 개발'이라는 명목 아래 무차별적인 테러를 벌이고 있습니다. 특히 이번 온천 개발은 트리니티에 대한 저항의 상징으로 보이며, 단순한 개발이 아닌 정치적 메시지를 담고 있는 것으로 판단됩니다.\n\n이들을 체포하기 위해서는 보다 강력한 지원이 필요합니다. 선도부의 소라사키 히나조차 그녀를 무력화하지 못했을 정도이니, 단순한 전술로는 부족할 것입니다. 현재 정의실현부와 학원정보부가 연합하여 키누가와 카스미를 비롯한 과거 게헨나 동아리 부장들을 추적 중이나, 그중에서도 가장 큰 위협은 역시 키누가와 카스미입니다."
 trinity_events.43.a: "이는 가장 큰 위협이다.."
 trinity_events.44.t: "아리우스 분교의 운명"
 trinity_events.44.desc: "미소노 미카는 본래 티파티의 수면 아래에서 아리우스 분교와 접촉하며, 분교에 재학 중이던 '시라스 아즈사'를 트리니티 본교에 입학시켰습니다. 그러나 대전이 사태 이후 이어진 정치적 혼란과 독일국과의 전쟁은 그녀로 하여금 계획을 조기 실행하도록 만들었고, 비록 준비는 미흡했지만 결과적으로 아리우스의 도움 없이 정권 찬탈에 성공하게 됩니다.\n\n하지만 정권을 손에 넣은 지금, 과거 그녀의 계획에 따라 움직였던 아리우스 분교는 존재의 의미를 잃고 표류하게 되었습니다. 정권을 쟁취하기 위한 '말'이었던 그들은, 이제 정권이 안정된 뒤엔 걸림돌이 될 가능성도 있습니다. \n\n미소노 미카는 이제 그들의 운명을 결정해야 합니다. 대전이 사태 이후 아리우스 분교의 정확한 위치는 파악되지 않았지만, 단치히 인근, 특히 그디니아 지역을 근처의 트리니티 학생들의 피해 사례가 잇따른 것을 감안하면, 그들이 그 근방에 은거하고 있을 가능성이 높습니다. 그들이 실제로 아리우스 학생이 아닐지라도, 우리의 적이 그 근처에 숨어 있다는 사실은 분명합니다.\n\n미소노 미카는 지금, 그들을 철저히 박멸해 정권의 걸림돌을 제거할 수도 있고, 혹은 아직 남은 이용 가치나 정치적 고려로 인해 계획을 보류할 수도 있습니다."
 trinity_events.44.a: "\"아리우스 학원과 화해.. 응. 그것도 괜찮지 않아?\""
 trinity_events.44.b: "\"이제 아리우스 같은 건 아무래도 상관없지 않아?\""
 TRN_trinity_44_b_tt: "§Y$TRN_Shirasu_Azusa$§!는 §Y[ARI.GetNameWithFlag]§!로 돌아갈 것입니다."
 trinity_events.45.t: "[64.GetName]에서의 시위"
 trinity_events.45.desc: "트리니티 중앙구 트리니티의 심장이라고 할 수 있는 곳에서 독일인들의 시위가 벌어졌습니다. 정의실현부의 교통 정리로 시위는 일정 수준에서 진압되었지만 독일 현지인들은 여전히 [TRM.GetAdjective]에게 마음을 열지 않고 있습니다.\n\n시위는 조직력을 잃으며 결국 스스로 해산되었고 거리는 황폐해졌습니다. 트리니티 학생들은 무표정한 얼굴로 시위의 흔적을 지나쳤고 누군가는 이 장면을 촬영했습니다. 시위 영상은 인터넷에 빠르게 퍼지기 시작했으며 영상을 접한 학생들의 반응은 격렬했습니다. 댓글창은 시위대를 향한 비난으로 가득 찼습니다.\n\n그러나 정보부는 한 가지 단서를 포착했습니다. 시위의 주동자로 추정되는 계정이 발견된 것입니다. 계정의 소개글에는 \"독일을 위한 애국자들의 모임\"이라 적혀 있었으며 시위에 대한 자세한 정보가 게시글 형식으로 공유되고 있었습니다. 트리니티의 정보부와 정의실현부는 즉각 합동 수사에 착수했습니다. 주동자에게 반드시 책임을 물을 것입니다."
 trinity_events.45.a: "\"으음. 어떻게 대처해야 하지, 이런 상황....\""
 trinity_events.46.t: "트리니티 학원정보부의 보고"
 trinity_events.46.desc: "\n\n\n                                    £GFX_report_event_TRN_IA\n\n\n\n\n\n\n티파티의 호스트 [TRM.GetLeader]님께\n\n트리니티 내부의 방첩 업무를 맡아 정보를 수집한 결과, 학원정보부는 최근 연이어 발생한 실종 사건들과 관련하여 중대한 단서를 확보하였으며, 이에 호스트님께 보고드릴 준비가 완료되었음을 알려드립니다.\n\n최근 키미가야마에서 발생한 대규모 실종 사건들은 과거 공의회에서 축출된 아리우스 분교와 깊은 연관이 있는 것으로 추정됩니다. 확인된 바에 따르면, 그들은 현재 독일계 주민들과 협력하여 트리니티 내부에 심각한 혼란을 야기하고 있으며, 이는 아리우스 측의 영향력을 점차 확대하려는 시도의 일환으로 해석됩니다. 본 보고서에는 해당 정황을 뒷받침하는 구체적 증거도 함께 첨부하였습니다.\n\n아울러, 실종자 유족들의 진술서를 바탕으로 분석한 결과, 아리우스 분교의 대략적인 위치는 키미가야마로부터 약 150km 이내인 것으로 파악되고 있습니다.\n\n존경을 담아,"
 trinity_events.46.a: "\"조마에 사오리를 이대로 둬선 안 돼.\""
 trinity_events.46.b: "\"이게 정말 사실이라면 골치 아프군요...\""
 TRN_after_this_operation_against_arius_tt: "곧 §Y[ARI.GetNameWithFlag]§!의 계획을 분쇄하기 위한 §Y'철검 작전'§!이 개시됩니다."
 trinity_events.47.t: "새로운 거래"
 trinity_events.47.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\n미소노 미카는 오래전부터 시스터후드와 구호기사단이 티파티에 간섭할 수 있는 권리를 못마땅하게 여겨왔다. 특히 시스터후드에 대한 불만은 더욱 깊었다.\n\n그들은 '비밀 유지'라는 명목 아래 모든 행동의 근거를 기밀로 감췄다. 대전이 사태 이후, 그 폐쇄성은 더욱 강화되었다. 모든 것을 기밀의 장막 뒤에 숨긴 채, 무엇을 꾸미고 있는지 알 길이 없었다.\n\n하지만 그들의 움직임을 막는 방법이 반드시 폭력일 필요는 없었다.\n\n시스터후드에게는 약점이 있었다. 유스티나 성도회의 기억. 그 어두운 과거가 그들의 발목을 잡고 있었다. 시스터후드가 먼저 움직이는 순간, 유스티나 성도회의 악몽이 되살아나 트리니티 학생들의 공포를 자극할 것이다. 민심을 잃는 것은 한순간이다.\n\n미카는 그 점을 정확히 꿰뚫고 있었다.\n\n그렇기에 그녀는 거래를 선택했다. '혼란 수습'이라는 그럴듯한 명분 아래, 양측은 회담 테이블에 마주 앉게 될 것이다. 협력이라는 이름의, 또 다른 게임이 시작되려 하고 있었다."
 trinity_events.47.a: "\"...생각 할 게 좀 많겠다.\""
 trinity_events.48.t: "응수"
 trinity_events.48.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n우타즈미 사쿠라코는 선택의 기로에 서 있었다.\n\n미소노 미카로부터 초청장이 도착했다. '트리니티 종합학원의 안보 상황과 정치적 갈등 봉합을 위한 회담'이라는 그럴듯한 명분이었다. 회담은 비밀리에 진행될 예정이었지만, 사쿠라코는 왠지 모를 꺼림칙함을 떨칠 수 없었다.\n\n미소노 미카.\n\n그 이름만으로도 사쿠라코의 가슴속에는 불편한 감정이 일렁였다. 자신의 친구가 암살당했을 때, 그녀는 일말의 슬픔도 보이지 않았다. 오히려 그 혼란을 발판 삼아 소꿉친구를 가두면서까지 권력을 손에 넣었다. 찬탈로 얻은 그 권력의 총구는 이제 사쿠라코를 향하고 있었다.\n\n그녀가 이 회담에서 무엇을 요구할지 알 수 없었다. 협력? 굴복? 아니면 더 교묘한 무언가?\n\n회담까지 시간이 얼마 남지 않았다."
 trinity_events.48.a: "\"이것도 하나의 시련이군요.\""
 trinity_events.49.t: "비밀 회담"
 trinity_events.49.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n\"...미카 님, 그 사태 이후로 처음 보는 것 같군요.\"\n\"응. 많이 바빴거든. 여러 가지 일로.\"\n\n\"...그러시겠죠.\"\n\n어색한 침묵이 흘렀다. 분위기는 마치 살얼음판을 걷는 것 같았다. 양측은 서로에게 형식적인 안부를 건넸지만, 대화는 좀처럼 진전되지 않았다.\n\n\"그래서, 저를 왜 여기에 부르신 건가요? 시스터후드와 티파티는 규율상 서로 간섭하지 않는 것으로 알고 있는데요.\"\n\n\"왜 불렀냐고? 그, 그야! ...아니지, 왜 부른 건지 너도 잘 알고 있잖아?\"\n\n\"저로서는 현재 이 자리가 불편하기만 합니다. 용건만 빠르게 말씀해주실 수는 없습니까?\"\n\n\"흐음... 그렇구나... 그럼, 단도직입적으로 물어볼게~!\" \n그녀가 몸을 앞으로 기울이며 말했다.\n\"나랑 협력할 생각 없어? 어때? 나쁘지 않잖아?\"\n\n\"...무슨 말인지 좀 더 구체적으로 설명해주시겠어요?\"\n\n\"아, 그러니까 말 그대로!\" 미카가 손을 휘저으며 말했다. \"시스터후드와 티파티가 협력하는 거야. 응, 멋지지 않아?\""
 trinity_events.49.a: "(우, 우와 소문대로 무서운 얼굴...)"
 trinity_events.50.t: "비밀 회담"
 trinity_events.50.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n사쿠라코가 냉담한 표정으로 대답을 기다리자 미카는 잠시 멈칫하더니 말을 이었다. 그 목소리에는 더 이상 장난기가 없었다.\n\n\"그러니깐 이전 트리니티는 말이야. 파벌 싸움, 정치적 공작이 넘쳐나는 건 알고 있지? 심지어 사태 이후로는 이게 더욱더 심해졌고 말이야. 나는 그게 지긋지긋해서 힘으로 싹 쓸어버렸어~☆\"\n\"하지만 시스터후드는 어때? 관습을 잘 지키잖아? 나는 그게 좋았어.\"\n\n\"...\"\n\n\"나는 티파티를 전부 쓸어버리고 힘으로 질서를 바로 세웠어. 그리고 사쿠라코는 신앙으로 도덕을 바로 세우는 거야. 응. 멋진 계획이지?\"\n\n사쿠라코는 입술을 깨물었다. 미카의 말에는 선택의 여지가 없었다. 거절은 곧 시스터후드 전체를 위험에 빠뜨리는 것이나 다름없었다.\n\n\"...미카 씨, 당신이 저지른 일은... 결코 신의 이름으로 용납될 수 없는 대죄입니다.\"\n\n\"하지만...\" 사쿠라코는 깊게 숨을 들이쉬었다. \"당신의 말이 일견 맞습니다. 트리니티는 현재 전대미문의 사태로 인해 신앙은 흐려지고 학생들은 파벌에 휩쓸려 본분을 잊었지요. 저 역시 그것을 바로잡지 못한 책임에서 자유로울 수 없습니다.\"\n\n\"당신의 손에 묻은 피를 시스터후드가 씻어줄 수는 없습니다. 그것은 당신이 평생 짊어져야 할 십자가입니다.\"\n\n미카는 여전히 미소를 지은 채 사쿠라코를 바라보고 있었다. 그 시선은 부드러웠지만 동시에 냉혹했다. 거부할 수 없다는 것을 양쪽 모두 알고 있었다.\n\n\"하지만...\" 사쿠라코의 목소리가 떨렸다. \"이 혼란을 방치하여 더 많은 학생들이 길을 잃고 고통받게 두는 것 또한 주님의 뜻이 아닐 것입니다. 만약 당신이 말하는 '새로운 질서'가 진정 트리니티 학생의 '안녕'을 위한 것이라면...\"\n\n침묵이 흘렀다. 사쿠라코는 자신이 무엇을 선택하는지 너무나 잘 알고 있었다. 이것은 협력이 아니라 굴복이었다. 하지만 다른 선택지는 없었다.\n\n\"......좋습니다. 그 '협력'을 받아들이겠습니다.\"\n\n미카는 사쿠라코의 대답을 잠시 음미하더니 이내 만족스러운 듯 활짝 웃었다."
 trinity_events.50.a: "\"...응! 역시 사쿠라코 쨩이야! 얘기가 잘 통할 줄 알았어!\""
 trinity_events.51.t: "탈나치화"
 trinity_events.51.desc: "학원정보부는 탈나치화를 이뤄내기 위해서 증거를 수집 했다는 내용 작전이 시작 될거라는 내용"
 trinity_events.51.a: "나치즘 없는 세상을 위하여"
 trinity_events.52.t: "흑적금 국기단 해산"
 trinity_events.52.desc: "사회민주당. 한때 나치의 가장 큰 적이었던 그들은 이제 트리니티의 저항 세력 중 하나가 되었습니다. 흑적금 국기단을 중심으로 독일 현지인들을 선동하며 트리니티에 맞서고 있는 그들을 더 이상 방치할 수 없었습니다.\n\n정보부는 이들의 주요 활동 거점을 파악했습니다. 최근 개정된 법안으로 법적 근거가 마련되었고 정보부와 정의실현부는 막강한 체포 권한을 부여받았습니다. 작전 준비가 진행되면서 수천 발의 탄약과 수십 종의 장비, 그리고 최소 천 명의 정의실현부 부원이 동원되었습니다. 트리니티 역사상 가장 큰 작전이 시작되고 있었습니다.\n\n작전 개시와 함께 일부 당원들과 국기단 가담자들이 체포되기 시작했습니다. 소식을 듣고 도망친 단원들은 은신처로 숨어들었지만 정보부는 이미 그 위치를 파악하고 있었습니다. 국기단 지도부는 저항 과정에서 총격에 맞아 병원으로 후송되거나 현장에서 사망했습니다.\n\n가장 큰 충돌은 [65.GetCapitalVictoryPointName]에서 발생했습니다. 학원 밖에서 밀수해온 무기로 무장한 국기단이 적발된 것입니다. 다행히 뛰어난 저격수 시즈야마 마시로의 활약으로 무장 단원들은 제압되었습니다.\n\n조직적인 탄압에 일부 독일 시민들이 시위로 맞섰습니다. 하지만 대부분의 사람들은 그 폭력이 자신에게 향하지 않은 것에 안도하며 하루하루를 살아가고 있었습니다. 한편 파테르 분파는 트리니티의 내부 안정을 위협하는 거대한 악을 타도했다며 자신들의 행위를 정당화했습니다."
 trinity_events.52.a: "빌헬름 리프크네히트에게 내 안부를 전해주게."
 trinity_events.53.t: "사민당의 퇴장, 파테르 분파의 입장"
 trinity_events.53.desc: ""
 trinity_events.53.a: "말 그대로"
 trinity_events.54.t: "정당 본부 폐쇄"
 trinity_events.54.desc: "정의실현부와 정보부의 철저한 조사 끝에 독일 정당들의 본부 위치를 파악했습니다. 정의실현부 부원들은 동시다발적으로 각 본부에 진입해 사민당을 포함한 대중 정당을 강제로 폐쇄했습니다. 일부 극단적인 성향을 가진 정당 본부에서 소규모 충돌이 발생했지만, 정의실현부 부원들이 단호하게 대응해 신속히 진압했습니다.\n\n본부 폐쇄 소식이 신문을 통해 알려지자 정당 지지자들이 거리로 쏟아져 나왔습니다. 시위대는 정의실현부의 조치에 강하게 반발하며 곳곳에서 집회를 열었고, 일부 지역에서는 격렬한 구호와 함께 긴장감이 높아졌습니다. 정의실현부와 시위대가 대치하는 상황이 이어졌지만, 자경단이 나서며 상황을 정의실현부에게 힘을 보탰습니다. 결국 정의실현부와 자경단의 협력으로 시위대를 해산하는데 집중했고, 시위는 점차 동력을 잃으며 자연스럽게 해산되었습니다.\n\n해외로 망명한 정당 인사들은 즉각 성명을 발표하며 트리니티의 조치를 강력히 비난했습니다. 그러나 이들의 목소리는 국제 사회의 큰 관심을 끌지 못했고, 실질적인 영향력도 미미했습니다. 독일 내에서도 망명 정당들의 반응은 크게 주목받지 못한 채 흘러갔습니다."
 trinity_events.54.a: "질서가 승리했다."
 trinity_events.55.t: "독일 정당들이 너희에게 무얼 해주었나?"
 trinity_events.55.desc: "정당 폐쇄 이후, 트리니티는 라디오를 비롯한 각종 매체를 통해 대대적인 선전 활동에 나섰습니다. 선전국은 트리니티 전역에 걸쳐 정기적으로 연설을 방송하며 독일 정당들의 실상을 폭로하기 시작했습니다.\n\n연설의 핵심 메시지는 명확했습니다. 독일 정당들은 대전쟁 시기부터 지금까지 독일 국민의 이익을 위해 움직인 적이 단 한 번도 없었다는 것입니다. 오히려 이들은 권력과 부를 차지하기 위해 독일을 외세에 팔아넘기고, 국민들에게는 끝없는 고통만을 안겨주었다고 강조했습니다.\n\n방송은 구체적인 사례들을 나열했습니다. 대전쟁 당시 정당 지도부가 안전한 후방으로 도피하는 동안 일반 국민들은 타지에서 피를 흘렸고, 전쟁이 끝난 후에도 정당들은 복구 자금을 착복하며 자신들의 배만 불렸다는 주장이었습니다. 또한 정당들이 독일인들에게 희망을 약속했지만, 실제로는 혼란과 분열만을 조장하며 트리니티의 통합 노력을 방해해왔다고 비난했습니다.\n\n연설은 감정적인 호소와 함께 마무리되었습니다. 트리니티는 독일인들을 억압하려는 것이 아니라 진정으로 해방시키려 한다는 메시지를 반복했습니다. 정당들의 부패한 지배에서 벗어나 새로운 질서 아래에서 함께 번영을 이루자는 제안이었습니다.\n\n이러한 방송은 연일 계속되었고, 점차 일부 독일인들 사이에서 정당에 대한 회의감이 싹트기 시작했습니다. 특히 전쟁의 참상을 직접 겪었던 이들 사이에서 트리니티의 주장이 설득력을 얻어가고 있었습니다."
 trinity_events.55.a: "내가 사망의 음침한 골짜기로 다닐지라도.."
 trinity_events.56.t: "나치 엘리트 숙청"
 trinity_events.56.desc: "오늘, 정보부와 정의실현부는 합동 작전으로 독일의 대학과 연구소를 급습하여 대규모 체포를 시작했습니다. 약 천 명이 넘는 인원을 체포했고, 수사를 위해 문서도 대거 압수했습니다. 나치 엘리트를 숙청하기 위한 이 작전은 하루아침에 이뤄졌으며, 미소노 미카가 수면 아래에서 준비해온 것이었습니다. 이미 낌새를 눈치채고 망명길에 오른 몇몇 학자들도 있지만, 그들이 갈 곳은 마땅치 않아 보입니다.\n\n대학들은 오랫동안 트리니티의 자비 아래 있었지만, 나치즘과 트리니티 체제에 반하는 사상으로 독일인들에게 저항 의식을 심어주고 있었습니다. 오래전부터 정보부는 이러한 행동을 눈치챘고, 미소노 미카의 재가 아래 물밑에서 진행하던 작업이 오늘 최후의 일격을 가했습니다. 이제 다양한 반국가 범죄에 대한 재판이 끝나면, 총살을 면한 자들은 노동을 통해 모교를 사랑하는 법을 배우게 될 것입니다.\n\n현재 공석이 된 교수직과 대학 행정직에는 티파티의 최고 인재들을 임명하고 있습니다. 여기에 정치경제학, 독일 민속 문화 등 새로운 교수직도 신설했습니다."
 trinity_events.56.a: "나치즘의 또다른 요새가 무너졌다."
 trinity_events.57.t: "시스터후드의 첫 번째 활동"
 trinity_events.57.desc: "시스터후드와 '협력'이 진행되고 시스터후드는 일사분란하게 움직였습니다. 어느 정도 티파티와 시스터후드 간 정보 공유도 활발해졌습니다. 시스터후드는 거래 이후 정계에서 멀어져 좀 더 선교 활동을 중심으로 움직이고 있는데 특히 중앙구와 서구를 중심으로 피란민들을 대상으로 구제 및 선교 활동을 펼치고 있습니다.\n\n시스터후드는 어느 정도 독일 현지인들 사이에서 지지를 받고 있습니다. 독일 인구의 1%도 안 되겠지만 지지를 받는 점에서 긍정적으로 생각할 필요가 있습니다. 이들의 선교 활동은 도시에서도 이뤄지고 있습니다. 트리니티 중앙구와 구호기사단의 본부가 있는 바시스 스콜라 그리고 중간 사이의 [68.GetName]에 주로 선교 활동을 하고 있습니다. 사회의 고위층이었던 이들의 개종 또한 극소수지만 이뤄지고 있습니다. 이들은 주로 진보적 성향을 가진 이들이었습니다. 그러나 아직 농촌을 중심으로는 선교 활동이 지지부진합니다. 특히 여성이라는 이유 하나만으로 선교를 거절한 곳도 몇몇 있었습니다. 농촌이라는 폐쇄적인 네트워크를 가진 곳이라 그런 걸지도 모릅니다.\n\n독일 현지 교회를 중심으로 시스터후드의 선교 활동을 방해하거나 아니면 구제 활동을 더욱 크게 벌이기도 하는데 이는 시스터후드의 활동을 의식하고 있을 확률이 높습니다. 그럼에도 아직 큰 규모를 가지고 있는 교회와 바티칸의 교황은 움직이지 않고 있는데 이는 뭔가를 준비하고 있을지도 모릅니다..."
 trinity_events.57.a: "잘 하겠지..."
 trinity_events.58.t: "파테르의 내홍"
 trinity_events.58.desc: "파테르 분파 내부에는 다양한 이념적 색채가 뒤섞여 있지만, 크게 분류하자면 '이념주의자'와 '협동주의자'라는 두 진영이 대립하고 있습니다. 두 집단 사이의 간극은 매우 깊습니다. 주로 강경파나 반동적인 임원들이 스스로를 '이념주의자'라 칭하며 목소리를 높이고 있습니다.\n\n반면 '협동주의자'들은 비교적 온건한 성향을 띱니다. 이들은 과거 미소노 미카의 정권 찬탈 시도 당시 해산 절차를 밟았던 상투스, 필리우스 분파의 잔당들과 일부 파테르 임원들로 구성되어 있습니다. 좌익부터 우익까지 이념의 스펙트럼은 매우 넓지만, 하나의 공통된 목표를 향해 나아간다는 점에서 이들은 강력한 결속력을 유지하고 있습니다.\n\n파테르 분파의 대규모 대회가 열린 날, 미소노 미카가 직접 그 자리에 모습을 드러냈습니다. 유출된 정보에 따르면 그녀는 계파 갈등을 종식하기 위해 직접 담판을 지으려 한다고 합니다. 수많은 임원이 참석한 가운데 미카가 등단하자 장내의 분위기는 순식간에 달아올랐습니다. 미카는 가벼운 농담으로 분위기를 진정시킨 뒤, 곧 진지한 표정으로 본론을 꺼냈습니다.\n\n\"후후, 다들 주목~! 파테르 안에서 서로 으르렁거리는 거, 이제 슬슬 지겹지 않아? 트리니티는 하나로 합쳐지려고 하는데, 정작 우리 안에서 갈라져 싸우는 건 좀 보기 안 좋잖아? 이건 정말, 정~말 시급하게 해결해야 할 문제라고 생각해. 그러니까, 나는 말이지ㅡ\""
 trinity_events.58.a: "미소노 미카는 이념주의자들의 손을 들어주었다."
 trinity_events.58.b: "미소노 미카는 협동주의자들의 손을 들어주었다."
 trinity_events.59.t: "투쟁하는 교회들"
 trinity_events.59.desc: "마틴 니뮐러, 파울 슈나이더, 율리우스 폰 얀, 헤르만 슈퇴르, 디트리히 본회퍼까지 트리니티 내부에 있는 신학자들은 트리니티 기독교를 받아들이지 않고 있습니다. 물론 티파티의 강압으로 공격적인 선교 활동을 벌인 탓일지도 모릅니다. 어찌되었근 교백교회와 일부 양심적인 목사, 신학자를 중심으로 신앙을 지키기 위한 활동이 조직적으로 이뤄지고 있습니다.\n\n그러나 아직 현지인들의 '교황령'이라는 자들이 움직이지 않고 있는데, 이는 우리와 협상할 의지가 남아 있는 것으로 보입니다. "

 trinity_foreign_policy_events.1.t: "우호 관계 재확인을 요청한 [TRM.GetAdjective]"
 trinity_foreign_policy_events.1.desc: "작성중!"
 trinity_foreign_policy_events.1.a: "냐햐~ 우호 관계는 늘 좋은 거니까요~."
 trinity_foreign_policy_events.2.t: "우호 관계를 재확인한 [HYA.GetAdjective]"
 trinity_foreign_policy_events.2.desc: "작성중!"
 trinity_foreign_policy_events.2.a: "평화가 제일이지!"
 trinity_foreign_policy_events.3.t: "[TRM.GetAdjective]의 경제 협력 제안"
 trinity_foreign_policy_events.3.desc: "작성중!"
 trinity_foreign_policy_events.3.a: "좋은데요, 냐햣!"
 trinity_foreign_policy_events.3.b: "그렇지만 뭐랄까~ 저희도 내부 사정이란 게 있어서~"
 trinity_foreign_policy_events.4.t: "[HYA.GetAdjective]의 제안 거부"
 trinity_foreign_policy_events.4.desc: "아쉬운 이야기지만 [HYA.GetNameDef]의 [HYA.GetLeader] 측은 우리의 제안을 거부했습니다. 거부한 명확한 이유는 밝히지 않았으나, 최근의 거대한 사태와 트리니티의 정치적 변화 등 여러 복합적인 요소들이 영향을 미쳤다고 추측하고 있습니다."
 trinity_foreign_policy_events.4.a: "\"뭔가 생각과는 조금 다른 전개지만...\""
 
 trinity_social_ploblem_events.1.t: "키보토스인 금지"
 trinity_social_ploblem_events.1.desc: "평화로운 오후 시간에도, 트리니티 중앙구의 거리에서는 차별의 그림자가 여전히 사라지지 않고 있습니다. 많은 상점들은 하나같이 ‘키보토스인 금지’라는 독일어 팻말을 내걸고 있으며, 그 아래에는 삐뚤빼뚤하게 적힌 키보토스 언어도 함께 보입니다.\n\n트리니티 학생들이 이러한 상황을 달가워하지 않는 것은 당연한 일입니다. 특히 일부 호전적인 학생들은 차별적인 상점에 대해 사적인 제재를 가하기도 합니다. 정의실현부의 신속한 개입으로 피해는 일정 부분 억제되고 있습니다."
 trinity_social_ploblem_events.1.a: "곤란해"
 trinity_social_ploblem_events.2.t: "노동자 파업"
 trinity_social_ploblem_events.2.desc: "트리니티의 공장들은 자동화가 점차 진행되고 있지만, 아직 트리니티화가 이루어지지 않은 지역에는 여전히 노동자들이 근무하고 있습니다. 특히 여러 부문에서 독일인 노동자들은 유용한 인력으로 활용되고 있습니다.\n\n그럼에도 불구하고 문제가 존재하는데, 그것은 바로 노동조합의 존재입니다. 구 독일 지역의 NSDAP 산하 어용 노조였던 독일노동전선은 로베르트 라이를 중심으로 조직적인 결속을 유지하고 있으며, 트리니티의 공장에서 파업과 폭력 시위를 벌이며 저항하고 있습니다. 특히 이들의 주요 목표는 트리니티 정부의 타도에 있으며, 이러한 노골적인 정치적 파업은 일부 도시에서 지역 법 집행기관이 질서 유지에 어려움을 겪고 있다고 보고할 정도로 확산되고 있습니다."
 trinity_social_ploblem_events.2.a: "정의실현부를 더 동원하라."
 trinity_social_ploblem_events.2.b: "노동자들과 협상하자."
 trinity_social_ploblem_events.2.c: "그러든가."
 trinity_social_ploblem_events.3.t: "관공서에 대한 폭탄 테러"
 trinity_social_ploblem_events.3.desc: "놀라운 전개 속에, 누군가가 제작한 사제 폭탄이 관공서에서 폭발하는 사건이 발생했습니다. 이 폭탄 테러로 인해 수십 명이 중상을 입었으며, 부상자들은 구호기사단의 차량을 통해 인근 병원으로 긴급 이송되었습니다. 폭발의 위력은 상당하여 대형 유리창이 10장 넘게 산산조각이 나는 등 주변 건물에 큰 피해를 입혔습니다.\n\n다행히도, 해당 지역은 당시 보수 공사가 진행 중이었고 일반 학생이나 주민들의 출입이 제한되어 있어 직접적인 희생자는 발생하지 않았습니다. 그러나 이 사건은 트리니티 내부의 불안정성과 치안의 허점을 여실히 드러내는 계기가 되었으며, 현재 학원정보부와 정의실현부는 사건의 배후 세력을 추적 중입니다."
 trinity_social_ploblem_events.3.a: "\"테러리스트를 용서하는 것은 신에게 달렸지만 그들을 신에게 보내는 것은 내게 달렸다.\""
 trinity_social_ploblem_events.4.t: "\"폴크스앰펭거\""
 trinity_social_ploblem_events.4.desc: "폴크스엠펭거(Volksempfanger)는 나치 독일이 제작한 저가형 진공관 라디오로, 대중이 쉽게 구매할 수 있도록 설계되었습니다. 이는 나치 정부가 라디오의 중요성을 인식하고, 선전 도구로 활용하기 위해 전국적인 보급에 힘쓴 결과였습니다. 그 결과, 독일 국민 두 명 중 한 명이 라디오를 소유할 정도로 폭넓게 보급되었습니다.\n\n최근, 라디오 방송이 다시 등장하고 있습니다. 그 배경에는 트리니티에 저항하는 민병대가 방송국을 장악하고, 이를 통해 반트리니티적 메시지를 독일 대중에게 송출하고 있기 때문입니다. 이 방송은 일부 트리니티 학생들에게까지 퍼지고 있어, 그 영향력이 점차 확산되고 있는 상황입니다."
 trinity_social_ploblem_events.4.a: "이러한 라디오 방송을 당장 멈춰야 한다."
 trinity_social_ploblem_events.5.t: "베어울프(늑대인간) 저항군 문제"
 trinity_social_ploblem_events.5.desc: "나치 독일의 유산 중 하나인 민병대 문제가 빠르게 수면 위로 떠오르고 있습니다. 특히 나치의 청소년 단체인 히틀러 유겐트가 주축이 되어 독일 청소년들에게 반트리니티 사상을 주입하고 있습니다. 이들을 이끄는 인물은 한스-아돌프 프리츠만으로, 사망한 하인리히 힘러가 특수방위감찰관으로 임명하여 작전을 수행하고 있습니다. 더욱이 그는 잔존하는 소규모 주 정부와도 접촉하고 있다는 첩보가 있습니다. 이에 따라 신속한 개입이 요구됩니다."
 trinity_social_ploblem_events.5.a: "정의실현부를 보내 토벌해야 한다."
 trinity_social_ploblem_events.5.b: "그럴 여유가 없다."
 trinity_social_ploblem_events.6.t: "파괴된 트리니티 상징물"
 trinity_social_ploblem_events.6.desc: "어제 이른 아침, 트리니티 중앙구 외곽의 한 작은 광장에서 트리니티의 상징물이 훼손되는 사건이 발생했습니다. 비록 규모는 작은 광장이었지만 유동 인구가 많은 지역이었기에, 이번 사건은 티파티의 권위가 훼손되었다는 인상을 주고 있습니다. 사건 현장의 사진은 삽시간에 SNS 등을 통해 퍼져나가고 있으며, 이는 최근 들어 더욱 거세진 저항 활동의 일환으로 보입니다."
 trinity_social_ploblem_events.6.a: "좋지 않아.."
 trinity_social_ploblem_events.7.t: "흑적금 국기단의 활동"
 trinity_social_ploblem_events.7.desc: "흑적금 국기단은 다소 온건하지만 그렇다고 우리와 협력적이진 않습니다. 이들은 주로 [65.GetName] 지역과 중앙구를 기점으로 활동하며 트리니티에 저항하라는 문구를 담은 전단을 뿌리며 저항 의식을 고취시키고 있습니다. "
 trinity_social_ploblem_events.7.a: "안 좋은 소식이군."
 trinity_social_ploblem_events.8.t: "저항하는 지휘자들"
 trinity_social_ploblem_events.8.desc: "트리니티 중앙구, 에덴. 그 외각에서 독일의 잔재가 남아있는 베를린이라는 곳에서 음악이 흘러나오고 있습니다. 빌헬름 푸르트벵글러가 지휘하는 오케스트라의 연주입니다. 그리고 수명의 지휘자들이 서로 다른 저항 의식을 가진 채 오케스트라를 지휘하고 있습니다. 예술가를 존중하는 차원에서 정의실현부와 티파티는 예술가들에 대해 느슨하게 처리하고 있지만, 이러한 연주곡들은 독일인들에게 정체성을 유지하게 하고 마음의 안식처가 되어가고 있습니다."
 trinity_social_ploblem_events.8.a: "울림을 준다라.."
 trinity_social_ploblem_events.9.t: "암살 미수 사건"
 trinity_social_ploblem_events.9.desc: "오늘 트리니티 고위층을 노린 암살 미수 사건이 발생했습니다. 다행히 피해자는 총알을 피했고 즉각 대응 사격으로 암살자를 제압했습니다. 조사 결과 암살자는 독일 저항 조직 소속으로 드러났으며, 시신은 유가족에게 인도되었습니다."
 trinity_social_ploblem_events.9.a: "여고생 한 명의 전투력은 특수부대원 2명과 맞먹는다."
 trinity_social_ploblem_events.10.t: "붉은 관현악단"
 trinity_social_ploblem_events.10.desc: "엄밀히 말하자면 붉은 관현악단은 트리니티 정보부가 만든 이름입니다. 단일 조직이라기보다는 여러 독립적인 반트리니티 스파이 그룹과 연락망을 총칭하는 단어입니다. 이들 상당수는 트리니티의 심장인 에덴에서 활동하고 있습니다. 특히 이전 독일국에서 활동하던 좌익 인사와 정부 관계자들이 포함되어 있습니다. 이들은 주로 암호화된 무선 통신으로 정보를 주고받습니다.\n\n이들은 주로 반트리니티 전단물을 제작하고 시민들의 저항 의식을 일깨우고 있습니다. 트리니티 정보부는 특정 출판사에서 이러한 전단물을 제작한다고 추측하고 있으며, 조만간 붉은 관현악단의 실체를 밝혀낼 것으로 추측하고 있습니다."
 trinity_social_ploblem_events.10.a: "추적하라!"
 trinity_social_ploblem_events.11.t: "노동자 사보타지 문제"
 trinity_social_ploblem_events.11.desc: "작센과 슐레지엔 지역은 트리니티 산업의 중요한 거점이며, 학원 산업을 육성하기 위해 티파티의 관할을 받고 있습니다. 그러나 산업 도시에서 노동자들의 사보타주가 심각한 문제가 되고 있습니다. 특히 노동자들은 공장 내 기계나 군수품, 민수품을 파괴하거나 비현실적인 협상안을 제출하고 불법 인쇄물을 유포하는 등 저항을 이어가고 있습니다.\n\n조사 결과, 이러한 사보타주를 주도하는 단일 조직은 존재하지 않습니다. 대신 동료들과 함께 저항하는 소규모 애국주의 조직들이 개별적으로 활동하고 있습니다."
 trinity_social_ploblem_events.11.a: "알아서 하라지."
 trinity_social_ploblem_events.11.b: "그래 저들의 임금을 인상하라. 그러면 조용해지겠지."
 trinity_social_ploblem_events.12.t: "히틀러 청소년단"
 trinity_social_ploblem_events.12.desc: "히틀러 청소년단은 나치당이 운영하던 관영 조직입니다. 나치가 항복한 뒤 대다수의 청소년들은 집으로 돌아갔습니다. 하지만 일부는 돌아갈 곳이 없거나 트리니티에 대한 적개심 때문에 조직에 남았습니다. 이들은 트리니티에 저항하며 독일 현지인들을 선동하고 있습니다. 특히 사보타주를 중심으로 움직이며 트리니티에 협력한 현지인을 대상으로 범죄를 저질러 소요를 일으키고 있습니다. 최근 체포한 조직은 구하기 어려운 폭발물을 대량으로 소유하고 있었습니다. 정의실현부의 노력으로 폭발물은 전부 회수되었습니다."
 trinity_social_ploblem_events.12.a: "불쾌하군."
 
 TRMDIP.50.t: "국경 요새화를 시작한 [TRM.GetAdjective]"
 TRMDIP.50.d: "오늘 아침, 폴란드 국경 수비대는 국경 지역에서 수상한 움직임을 포착하였습니다. 날개를 지닌 이계인들이 대규모 자재를 들고 움직이는 모습이 확인되었으며, 이들 중 일부는 독일-폴란드 철도 연결 지점을 차단하려는 시도를 벌였습니다. 다행히도 이계인 무리 중 상급자로 보이는 인물이 이를 저지하면서 철도는 무사히 보호되었습니다.\n\n현재 국경 일대에서 진행 중인 요새화 작업은, 명백히 우리가 침략을 준비하고 있다는 피해망상에 기초한 조치로 보입니다. 외교부는 해당 사안에 대해 우려를 표하며, 가능한 외교 경로를 통해 강력히 항의할 방침입니다."
 TRMDIP.50.a: "외교적으로 항의하자."
 TRMDIP.50.b: "딱히 문제 삼지 말자."

 TRMDIP.51.t: "[POL.GetAdjective]의 외교적 항의"
 TRMDIP.51.d: "폴란드 외무부로부터 외교 서한이 도착하였습니다. 본 서한의 내용은 간결하며, 최근 폴란드-트리니티 국경 일대에서 진행 중인 방어 시설 확충과 관련하여 자국의 우려와 항의를 표명한 것이 핵심이었습니다. 이러한 반응은, 폴란드 측이 트리니티의 방어적 조치를 침공 준비로 오해했기 때문에 비롯된 것으로 판단됩니다. 그러나 본 서한에는 어떠한 형태의 최후통첩이나 위협적인 표현은 존재하지 않았습니다."
 TRMDIP.51.a: "이러한 위협은 우리에게 별 문제가 되지 않는다."
 
 TRMDIP.52.t: "유전지대를 요구한 [TRM.GetAdjective]!"
 TRMDIP.52.d: "오늘 오후, [TRM.GetName]은 우리에게 하나의 최후통첩을 보내왔습니다. 그 내용은 72시간 이내에 루마니아 내 유전 지대에 대한 채굴권을 [TRM.GetAdjective] 측에 양도하라는 것이었습니다. 더불어 [TRM.GetAdjective]의 세력권에 편입될 것과 여러 경제적 조건을 수용할 것도 요구하였습니다. 만약 이 기한을 넘기거나 요구를 거부할 경우, 전면전을 피할 수 없을 것이라는 경고도 담겨 있었습니다.\n\n우리는 그 유전 지대를 통해 상당한 경제적 이익을 얻고 있었으며, 이를 상실할 경우 심각한 경제적 타격은 불가피할 것입니다. 물론 [TRM.GetAdjective]는 최근 급부상한 신흥 강대국으로, 명백한 확장주의적 행보를 보이고 있습니다. 그러나 유전 지대를 넘기는 대가로 평화를 얻을 수 있다면, 그 거래는 마냥 나쁜 선택만은 아닐지도 모릅니다..."
 TRMDIP.52.a: "불쾌하지만 이들의 요구를 수용해야 한다.."
 TRMDIP.52.b: "우리는 소루마니아의 낙원보다 대루마니아의 늪지에서 죽겠다!"
 
 TRMDIP.53.t: "우리의 요구를 수용한 [ROM.GetNameDef]"
 TRMDIP.53.d: "좋은 소식입니다! [ROM.GetAdjective] 측이 우리의 요구를 수용하였으며, 루마니아 내 자원 채굴권을 우리에게 양도하였습니다. 또한, 우리의 기타 요구사항들에 대해서도 점진적으로 수용하겠다는 입장을 표명하였고, 즉시 [TRM.getFactionName]에 가입하였습니다. 이는 트리니티의 명백한 외교적 승리입니다."
 TRMDIP.53.a: "환영한다!"
 
 TRMDIP.54.t: "우리의 요구를 거부한 [ROM.GetNameDef]"
 TRMDIP.54.d: "모두의 예상대로, [ROM.GetAdjective]는 우리의 요구를 거부하고 동원령을 선포하였습니다. 이제 그들의 운명이 어떻게 될지 시험해볼 시간입니다."
 TRMDIP.54.a: "전면전이다!"
 
 TRMDIP.60.t: "트리니티와의 일시적 동맹?"
 TRMDIP.60.d: "[TRM.GetLeader]의 호스트인 미소노 미카는는 룩셈부르크의 흥신소 68이 반게헨나적 성격을 지니고 있으며, 게헨나 정부를 전복하고 그 위에 새로운 질서를 수립하려는 목표를 갖고 있다는 점을 인식하고 있습니다. 이들은 자신들의 목표 달성을 위해 트리니티와의 협력을 제안하며, '게헨나를 파괴할 때까지'라는 조건 아래 일시적인 군사 동맹을 제시하였습니다.\n\n분명히 적의 전선을 두 개로 분할할 수 있다는 것은 매력적인 제안입니다. 이 동맹이 일시적일 것이라는 것 역시 흥신소에게 만족스러운 이야기입니다. 하지만 결국 최종 결정을 내리는 것은 [HEU.GetLeader]의 권리입니다."
 TRMDIP.60.a: "좋아, 공동전선을 펼치자고"
 TRMDIP.60.b: "오래전부터 그녀가 마음에 들지 않았지."

 TRMDIP.61.t: "공동전선을 수락한 룩셈부르크."
 TRMDIP.61.d: "[FROM.GetAdjective] 측은 우리의 일시적 동맹 제안에 동의했습니다. 우리나 룩셈부르크가 게헨나를 공격했을 때, 우리는 일시적인 군사 동맹을 맺게 될 것입니다. 이것은 일시적인 동맹이지만 분명히 큰 도움이 될 것입니다."
 TRMDIP.61.a: "좋은 소식이군"

 TRMDIP.62.t: "공동전선을 거부한 룩셈부르크."
 TRMDIP.62.d: "당연한 제안이였겠지만 룩셈부르크는 우리의 제안을 거부하였습니다. 그녀들의 도움 없이도 게헨나를 이기는 건 가능하지만 비교적 어려울 것입니다."
 TRMDIP.62.a: "...왜?"

 TRMDIP.63.t: "[ROOT.GetName] 자유의 라디오"
 TRMDIP.63.d: "협력자들은 강력한 트리니티 라디오 방송국을 이용해 [TRM.GetNameDef] 측을 향해 선전과 거짓말을 퍼뜨리고 있습니다. 이러한 라디오 방송 청취는 명백히 금지되어 있으며 누구든 반역 혐의를 받게 됩니다. 하지만 실제로는, 특히 시골 지역에서는 금지령을 집행하기가 어렵습니다. 라디오 리버티에서 특히 영향력 있는 인물은 프란츠 랑고트입니다."
 TRMDIP.63.b: "트리니티 부역자는 누구도 용서받지 못할 것이다"

 TRMDIP.64.t: "[TRM.GetAdjective] 측과 경제 협력?"
 TRMDIP.64.d: "오늘, [ROOT.Capital.GetCapitalVictoryPointName]에 한 통의 외교 문서가 도착했습니다. 그것은 바로 [TRM.GetAdjective] 측이 제안한, 양 학원 간 경제 협력에 관한 간단한 협정이었습니다.\n\n양측의 우호 관계는 사태 이후에도 꾸준히 유지되어 왔으며, 이번 제안 역시 그 연장선에 있는 것으로 보입니다. 그러나 최근 트리니티에서 발생한 정권 교체와 연이은 정치적 사건들은 해당 학원을 급격히 급진화시키고 있어, 단순한 경제 협력으로 보기엔 조심스러운 부분이 존재합니다.\n\n단기적으로는 우리에게 이익이 될 수 있는 제안이지만, 장기적으로는 경제적 종속으로 이어질 수 있다는 우려가 음양부 내에서 제기되고 있습니다."
 TRMDIP.64.a: "오호라~ 괜찮은 제안 같은데요~?"
 TRMDIP.64.c: "그렇지만 뭐랄까~ 저희도 내부 사정이란 게 있어서~"
 TRM_eng_event_chain_tt: "더 이상 §Y[TRM.GetNameWithFlag]§! 측과 §Y사건 연계§!가 발생하지 않습니다."

 TRMDIP.65.t: "우리와 협력을 거부한 [HYA.GetNameDef]"
 TRMDIP.65.d: "최근 [HYA.GetNameDef] 측에서 하나의 외교 서한이 도착했습니다. 서한의 내용은, 트리니티의 급진화와 연이은 정치적 위기 및 외교 갈등을 이유로, 양 학원 간의 협력 관계를 재검토하겠다는 것이었습니다. 다만, 이는 정치적 협력에 한정된 것으로, 학생들 간의 교류는 이전과 동일하게 유지된다는 점은 명확히 전달되었습니다. 이와 같은 외교적 후퇴는 트리니티의 외교 역량이 과거에 비해 현저히 약화되었음을 여실히 보여주었습니다..."
 TRMDIP.65.a: "정말, 뭐냐구!?"
 TRN_no_longer_TRN_support_HYA_decision: "[HYA.GetNameDef] 측이 협력을 거부함."

 TRMDIP.66.t: "[HYA.GetNameDef]의 경제 협력 수락"
 TRMDIP.66.d: "좋은 소식입니다. [HYA.GetNameDef]의 [HYA.GetLeader] 측은 양 학원간의 경제 협력을 찬성하였습니다. 특히 양 학원과 신뢰와 우정을 바탕으로 맺어진 이 조약은 가능한 서로에게 이득이 되도록 작성 되었습니다. 특히 이 조약이 체결 된 이후 첫 물자가 백귀야행을 향해 운행하기 시작하였으며 이는 좋은 소식일 것입니다."
 TRMDIP.66.a: "얏호~ £GFX_BA_star"

 TRMDIP.67.t: "[TRM.GetNameDef] 측의 연합훈련 제안"
 TRMDIP.67.d: "트리니티의 호스트 [TRM.GetLeader] 측은 연합훈련을 제의하였습니다. 이 훈련은 최근 나날이 높아지는 위협을 대비하기 위해 백화요란과 정의실현부의 대처 능력을 더욱 향상 시키기 위함으로 기존의 훈련 보다는 더욱 더 큰 규모로 치뤄질 예정이며 최신 무기들을 시험 해보는 것입니다."
 TRMDIP.67.a: "아~ 괜찮은 제안이네요~"
 TRMDIP_67_NAME: "트리니티 - 백귀야행 연합훈련"

 TRMDIP.68.t: "[HYA.GetNameDef] 측의 수락"
 TRMDIP.68.d: "[HYA.GetNameDef] 측과의 협력 강화를 위해, [74.GetName]에서 연합 훈련을 개최하자는 제안이 이루어졌고, [HYA.GetNameDef] 측은 이를 기꺼이 수락하였습니다. 우리의 지휘관들은 이번 훈련을 통해 [74.GetName]의 지형과 특성에 대해 학습하고, 새로운 전술을 익힘으로써 전술적 역량을 한층 더 발전시킬 수 있을 것입니다."
 TRMDIP.68.a: "좋은 훈련이였어!"

 TRMDIP.69.t: "[TRM.GetNameDef] 측의 동맹 제안"
 TRMDIP.69.d: "[TRM.GetAdjective] 측과의 급속한 관계 발전을 바탕으로, 그들은 군사 동맹인 에덴 협정 가입을 제안해 왔습니다. 이를 수락한다면, [HYA.GetAdjective] 측은 동등한 회원국으로 대우받게 되며, 전례 없는 군사적 동맹이 탄생하는 역사적인 순간이 될 것입니다."

 TRMDIP.70.t: "동맹을 수락한 [HYA.GetNameDef]"
 TRMDIP.70.d: ""

 TRMDIP.71.t: "폄하된 [GEM.GetLeader]의 권위"
 TRMDIP.71.d: "늦은 오후, 독일인 몇 명이 [GEM.GetLeader]의 선전물을 훼손하고, 그 옆에 모욕적인 낙서와 트리니티를 찬양하는 낙서를 남기는 장면이 담긴 영상이 SNS를 통해 빠르게 확산하고 있습니다. 해당 영상은 시민들 사이에서 큰 반향을 일으키고 있습니다. 현재 용의자들을 신속히 체포 중이며, 조만간 모두 검거될 것으로 보입니다. 그러나 이미 온라인에 퍼진 영상들을 완전히 차단하는 것은 사실상 불가능에 가까워 보입니다.\n\n특히 이들 용의자가 트리니티를 찬양하는 발언을 했다는 점에서 일각에서는 트리니티가 이번 사건의 배후가 아니냐는 의혹이 제기되기도 했습니다. 하지만 아직은 그들이 단순히 트리니티를 동경하고 모방해 온 개인적 행동일 수도 있습니다."
 TRMDIP.71.a: "누가 이런 짓을!?"

 TRMDIP.72.t: "트리니티의 무역 제재!"
 TRMDIP.72.d: "1935년의 부르겐란트 진군은 재앙으로 막을 내렸습니다. 산해경의 공세는 단호했고, 우리 군은 끝내 패퇴했습니다. 이로써 대헝가리의 꿈은 좌절되었고, 루마니아와 유고슬라비아로부터 경제 제재를 받게 되었습니다. 그나마 위안이라면, [TRM.GetAdjective] 측과의 무역 개시로 독일이 남긴 공백을 어느 정도 메울 수 있었다는 점이었습니다. 그러나 최근 트리니티의 외교 기조가 변하며, 조국 헝가리에 경제 제재가 부과되었습니다. 경제 전문가들은 헝가리의 트리니티 무역 의존도가 상당히 높았기에, 이번 조치가 국가 경제에 심대한 타격을 가져올 것이라고 경고하고 있습니다."
 TRMDIP.72.a: "비극이로다"

 trinity_flavor_events.5.t: "트리니티의 새로운 사업계획"
 trinity_flavor_events.5.desc: "트리니티의 신규 사업설명회가 오늘 에덴에서 개최되었다. 이곳은 트리니티의 유명 사업가들이 한자리에 모인 귀중한 장소였다. 참석자들이 사교적으로 어울리는 와중에 사회자가 마이크를 가볍게 두드리며 입을 열었다.\n\"먼저, 오늘 당사의 사업설명회에 참석해 주신 사장님들께 감사드립니다. 이런 귀중한 기회를 얻으신 여러분은 선택받은 것이나 다름없습니다. 긴 설명은 생략하고, 곧바로 본론으로 들어가겠습니다. 제가 오늘 자신 있게 소개할 사업 아이템은 바로 '에코 프라이드 캐시미어 배터리'입니다! 이는 단순한 배터리가 아닙니다! 이 배터리로 말하자면..\"\n\n\n그러나 몇 분 후, 불법 사업설명회 신고를 받고 출동한 정의실현부에 의해 행사는 조기 종료되었으며, 관련자들은 체포되었다."
 trinity_flavor_events.5.a: "에코..뭐..?"
 trinity_flavor_events.6.t: "슈테틴 페리 사건"
 trinity_flavor_events.6.desc: "늦은 밤 평화로워야 할 슈테틴에서 중대한 사건이 발생했습니다. 평소처럼 연회가 열리고 합법적인 도박이 성행하며 수억이 오가는 슈테틴의 페리호는 사람들로 붐비고 있었습니다. 누군가는 잃고 누군가는 얻으며 평화로운 혼잡 속에 있던 그 순간, 갑작스러운 총성이 페리호를 뒤흔들었습니다.\n\n총성과 함께 약 6명의 복면을 쓴 무장 강도들이 모습을 드러냈습니다. 그들은 총기로 승객들을 위협하며 차분하지만 단호한 목소리로 외쳤습니다.\n\"여러분, 강도질 좀 하겠습니다. 다들 얌전히 계시면 아무도 다치지 않을 것입니다.\"\n\n놀란 승객들은 공포에 휩싸인 채 몸을 움츠렸고 강도들은 계획대로 금품과 귀중품을 수거하기 시작했습니다. 한편 페리호 경비원들이 상황을 파악하고 무장 강도들과 대치에 나섰습니다. 그러나 강도들은 이미 치밀하게 준비된 탈출 경로를 가지고 있었고, 약탈한 물품을 챙기며 혼란 속에서 빠져나가려 했습니다.\n\n이때 정의실현부가 현장에 급습했습니다. 강도들과 짧은 교전이 벌어졌고 이 과정에서 무장 강도 중 두 명이 총상을 입었으나 나머지 강도들과 함께 도주하는 데 성공했습니다. 정의실현부는 끝내 이들을 체포하는 데 실패했고 사건은 미제로 남게 되었습니다."
 trinity_flavor_events.6.a: "20세기에 무법자라니?"
 trinity_flavor_events.7.t: "어여쁜 마을에서의 산보"
 trinity_flavor_events.7.desc: "쾨니히스베르크, 현 키미가야마의 북쪽 시골에는 서로를 향해 깊은 악감정을 품고 있는 두 가문이 존재했습니다. 이 두 가문은 오랜 경쟁과 갈등 속에서 대립을 이어왔지만, 혜성처럼 등장한 무법자 집단이 이들 사이의 긴장감을 교묘히 이용하기 시작했습니다. 무법자들은 경찰관을 사칭하며 두 가문을 속이고, 그들의 대립을 자신들의 금전적 이익을 위한 도구로 삼으려 했습니다.\n\n그러나 두 가문 모두 이 무법자 집단의 존재를 꺼려했고, 결국 한쪽이 먼저 이들을 제거하기로 결심했습니다. 철저히 계획을 세운 가문은 무법자들을 함정으로 유인하기 위해 인력을 배치했습니다. 무법자들은 이들의 계획을 알지 못한 채 모습을 드러냈고, 긴장감이 감도는 순간, 가문의 경찰 중 한 명이 방아쇠를 당기며 전투가 시작되었습니다.\n\n격렬한 교전은 빠르게 진행되었습니다. 무법자들은 강력한 화력으로 저항하며 가문 측 경찰들을 모두 사살하는 데 성공했지만, 경찰들도 완전히 무력하게 당하지는 않았습니다. 경찰들은 전투 중 무법자 한 명을 사살하는 데 성공했고, 무법자 집단이 지역 떠나도록 압박하며 작전을 마무리 지었습니다.\n\n정의실현부가 도착하였을 때는 이미 무법자들은 도시를 떠난지 오래였습니다."
 trinity_flavor_events.7.a: "그들의 사격 솜씨 하난 인정 해야겠군."
 trinity_flavor_events.8.t: "예나 지금이나 가문 싸움"
 trinity_flavor_events.8.desc: "널브러진 시체들은 이미 오래전에 총격으로 생명을 잃은 상태였습니다. 그곳에 남겨진 것은 폐허와 충격적인 잔혹함뿐이었습니다.\n\n이 끔찍한 사건의 발단은 오직 무법자들만이 알고 있을 것입니다. 그들은 자신들이 트리니티 시에서 겪었던 사건에 대한 복수를 한 것인지, 혹은 전혀 다른 이유에서였는지는 알 수 없지만 그 어떤 범죄보다 잔혹하게 이들을 살해하고 불태웠습니다. 문자 그대로 가문을 파괴하며 무자비한 복수극을 펼쳤습니다.\n\n가문 일원들 중 생존자는 현재까지 단 한 명도 확인되지 않았습니다. 만약 이 비극이 사실이라면 무법자 집단은 복수심에 사로잡혀 하나의 가문을 멸족시킬 정도로 극단적인 행보를 보였다는 것을 의미합니다.\n\n상황은 사건 발생 후 한참이 지나서야 정의실현부가 출동하면서 정리되었습니다. 희생자들의 시신은 모두 수습되었습니다."
 trinity_flavor_events.8.a: "그렇게 교양 없이 나오시겠다."
 trinity_flavor_events.9.t: "가장 우리다운 우리"
 trinity_flavor_events.9.desc: "수많은 사람들을 충격에 빠뜨린 소식이 있습니다. 바로 트리니티 제2의 도시 바시스 스콜라에서 발생한 대담한 강도 사건입니다. 트리니티 사회에 끊임없이 문제를 일으키던 악명 높은 무법자 갱단이 이번에는 군인들의 봉급을 실은 열차를 습격했습니다.\n\n열차는 바시스 스콜라를 지나던 중 갱단의 기습을 받았습니다. 이 소식을 듣고 바시스 스콜라 경찰과 정의실현부가 즉각 출동했으나 결국 열차를 추격하는 데 실패했습니다. 열차에 타고 있던 보안관들은 갱단의 압도적인 화력에 전부 사망한 것으로 추정되며, 이들을 추격하던 과정에서 발생한 사상자들까지 포함하면 사상자 수는 두 배 이상으로 증가할 가능성이 높습니다.\n\n갱단은 열차가 정차한 틈을 타 재빠르게 올라타 열차를 가로챘습니다. 이후 기관총을 동원하여 추격하는 경찰과 정의실현부를 따돌리는 데 성공했습니다. 열차가 다시 정차했을 때 갱단은 이미 도주한 상태였으며 열차에 실려 있던 군인들의 봉급은 온데간데없이 사라졌습니다.\n\n이 사건이 속보로 전해지자 시민들은 큰 충격에 빠졌습니다. 일부는 갱단의 대담함에 열광하기도 했지만 대다수는 이 사건을 개탄하며 분노를 표출했습니다. 분명한 것은 이들 무법자들의 대담한 범행이 아무리 주목을 받는다 해도 그 끝은 결코 순탄하지 않을 것이라는 점입니다."
 trinity_flavor_events.9.a: "피,"
 trinity_flavor_events.10.t: "피, 죽음, 구원"
 trinity_flavor_events.10.desc: "정의실현부의 끈질긴 노력 끝에 우리는 갱단의 은신처를 찾아내는 데 성공했습니다. 그러나 그곳에서 마주한 광경은 예상 밖이었습니다. 갱단 내부에 심각한 분열의 조짐이 보였고 우리가 도착했을 때 그들은 이미 서로에게 총부리를 겨누며 대치하고 있었습니다.\n\n상황이 악화되자 정의실현부는 신속히 사살 작전을 개시했습니다. 갱단은 순식간에 와해되었고 두 개의 세력으로 갈라져 혼란 속에서 도망치기 시작했습니다.\n\n추격전이 이어지는 가운데 갱단의 주요 세력 중 하나였던 '집행자' 세력은 내부 분열로 종말을 맞이했습니다. 그들은 인근 돌산으로 도망쳐 마지막 저항을 시도했지만 내부에서 배신이 발생했습니다. 한 갱단원이 집행자에게 반기를 들었고 그들 간의 격렬한 몸싸움 끝에 배신자가 집행자를 무력화하고 결국 죽음으로 몰아넣었습니다. 남은 갱단원들은 더 이상 저항할 힘을 잃고 투항하여 정의실현부에 체포되었습니다.\n\n다른 한 세력은 여전히 도주 중이지만 정의실현부의 포위망을 벗어날 가능성은 희박합니다. 이들 또한 머지않아 체포되거나 저항 끝에 사살될 운명을 피하지 못할 것입니다.."
 trinity_flavor_events.10.a: "죽음,"
 trinity_flavor_events.11.t: "인생의 굴레"
 trinity_flavor_events.11.desc: "정의실현부의 끈질긴 노력에도 불구하고 일부 갱단원들은 포위망을 뚫고 도주하는 데 성공했습니다. 그러나 정의실현부의 자체적인 논의 결과 이들의 잔여 세력이 더는 사회에 중대한 위협이 되지 않는다고 판단되었고, 그들은 공식적으로 수배 명단에서 내려지는 것을 끝으로 공식적인 추적을 중단하였습니다.\n\n갱단의 최후를 돌아보면 그들은 결국 자유를 갈망하던 이상주의자들의 집단에 불과했습니다. 자신들만의 이상을 쫓아 결성된 갱단은 현실과의 충돌 속에서 그 이상이 산산이 부서졌습니다. 현실과의 타협은 그들에게 분열과 타락을 가져왔고 끝내 남은 것은 죽음과 무너진 꿈, 그리고 몇몇에게 주어진 구원의 기회뿐이었습니다.\n\n그들의 이름은 한때 수많은 사람들에게 알려졌고 트리니티 전역에서도 회자되었습니다. 그러나 그러한 명성은 오래가지 못할 것이며 역사의 한 페이지에도 불과한 기록으로 남을 뿐입니다.\n\n갱단원들의 이후 행적은 자세히 조사되거나 추적되지 않았습니다. 하지만 시간이 지나면서 그들 중 일부는 가족을 이루며 조용히 살아갈 것이고 나머지는 결국 죽음을 통해 죗값을 치르게 될 것입니다."
 trinity_flavor_events.11.a: "구원."
 trinity_flavor_events.12.t: "유리조노 세이아 음모론"
 trinity_flavor_events.12.desc: "오늘 트리니티에서 큰 논란을 일으킨 음모론이 등장했습니다. 유리조노 세이아가 사실 사망하지 않았으며, 구호기사단과 공모해 사건을 은폐했다는 내용이 핵심입니다.\n\n1년 전, 미소노 미카가 트리니티의 정권을 잡는 데 결정적 계기가 된 사건 중 하나는 유리조노 세이아 암살 사건이었습니다. 당시 이 사건은 트리니티 사회에 엄청난 파장을 일으켰습니다. 이후 유리조노 세이아는 구호기사단에 의해 수습되었고, 구호기사단 측은 그녀가 치료를 받기 전 사망 하였다고 발표하며 공식적으로 죽음을 확인했습니다.\n\n그러나 이번 음모론에 따르면, 구호기사단장 아오모리 미네와 유리조노 세이아 사이에 어떤 거래가 있었으며, 이 거래의 일환으로 유리조노 세이아의 사망 소식이 거짓 발표되었다는 주장이 제기되었습니다. 거래의 실체와 발표의 배경은 아오모리 미네와 유리조노 세이아만이 알고 있을 것으로 보입니다.\n\n구호기사단 측은 이러한 음모론을 강력히 부정하며 내용을 전면 반박했지만, 논란은 쉽게 가라앉지 않을 조짐을 보이고 있습니다."
 trinity_flavor_events.12.a: "세이아 쨩..  지금이라도 괜찮으니까..."
 trinity_flavor_events.13.t: "'나치즘'"
 trinity_flavor_events.13.desc: "에덴의 지식인들 사이에서 나치즘과 국가사회주의독일노동자당(NSDAP)에 대한 연구가 활발히 진행되고 있습니다. 트리니티가 동부 독일을 지배하기 이전, 이들은 독일을 지배했던 이념과 정당으로, 1933년부터 1935년까지 독일의 정권을 장악한 바 있습니다.\n\n나치즘의 주요 이념은 무엇이었을까요? 이들은 권위주의적 전체주의 국가를 지향했으며, 1933년 통과된 '수권법'을 근거로 다른 정당들을 탄압하고 일당 독재 체제를 구축하였습니다. 또한, 반유대주의를 바탕으로 '유대인'을 비롯한 특정 집단을 차별하고 박해하였으며, 독일 민족주의를 내세워 독일 민족의 우월성을 강조하고 독일인의 생활권 확보라는 비정상적인 목표를 주장하였습니다.\n\n경제적으로는 대규모 공공사업을 통해 경제 회복을 추진하였으며, 독일 국방군의 재건에도 힘을 기울였습니다. 많은 연구자들은 \"대전이 사태가 존재하지 않았다면, 독일이라는 국가는 결국 전쟁을 벌였을 것\"이라 주장하고 있으며, 이는 학계에서도 폭넓은 동의를 받고 있는 견해입니다.\n\n이들의 집권 과정은 마치 야수가 먹잇감의 약점을 간파하여 공략하는 것과 같았습니다. 그 결과, 수권법을 통해 절대 권력을 거머쥐었으며, 경제 회복을 위한 공공사업을 통해 독일 국민들의 지지를 얻는 데 성공하였습니다. 어쩌면 우리는 이들에게서 무엇인가를 배울 수 있을지도 모릅니다."
 trinity_flavor_events.13.a: "영감이 하나 떠오르는군"
 trinity_flavor_events.14.t: "총학생회장의 행방?"
 trinity_flavor_events.14.desc: "총학생회의 공식 발표를 통해, 총학생회장이 현재 실종 상태에 놓여 있다는 사실이 확인되었습니다. 그간 수면 아래에서 제기되어 왔던 각종 추측과 음모론이 현실이 된 순간이었으며, 총학생회가 이를 공식 인정한 것은 극히 이례적인 일입니다.\n\n실종 사실이 발표되자, 총학생회는 즉시 다수의 전문 요원들로 구성된 수사팀을 조직해 그녀의 행방을 추적하고 있으며, 키보토스 전역의 정보망을 총동원해 실종 당시의 정황을 분석 중입니다. 그러나 그녀의 행적은 철저히 베일에 가려져 있고, 외부 개입부터 내부 배신에 이르기까지 다양한 가능성이 조심스럽게 거론되고 있습니다.\n\n총학생회장은 키보토스의 질서와 균형을 상징하는 핵심 인물이자, 각 학원 간 갈등을 조율할 수 있는 유일한 정당성을 가진 존재입니다. 그녀의 부재는 단지 한 인물의 실종이 아닌, 키보토스 전체의 정치적 공백을 의미하며, 학원 간 힘의 균형마저 뒤흔들 수 있는 중대한 위기로 작용하고 있습니다.\n\n이미 일부 학원에서는 이 혼란을 기회 삼아 세력 확장이나 독자 노선을 모색하려는 움직임이 감지되고 있으며, 이러한 조짐은 자칫 키보토스 전역의 분열과 충돌로 번질 가능성도 내포하고 있습니다.\n\n트리니티를 비롯한 주요 학원들은 상황을 예의주시하고 있으며, 총학생회의 권위와 존속 자체가 흔들릴 수도 있는 중대한 기로에 놓여 있습니다. 지도자를 잃은 키보토스는 지금, 혼돈의 소용돌이 속에서 새로운 선택을 강요받고 있습니다."
 trinity_flavor_events.14.a: "충격적인 소식이다."
 trinity_flavor_events.15.t: "동행인"
 trinity_flavor_events.15.desc: "유리조노 세이아 암살 사건을 기점으로 시작된 미소노 미카와 파테르 분파의 정권 찬탈은 보수주의자들이 그들과 거리를 두게 만드는 계기가 되었습니다. 그러나 대중들은 오히려 파테르 분파와 미소노 미카에게 더욱 몰려들었으며, 미소노 미카는 자신의 지배를 헌장으로 보장받기 위해 헌장 개정안을 통과시키는 등 정권의 정당성을 강화하는 데 힘썼습니다.\n\n트리니티의 중도 분파들은 암살 사건 이후 급격히 무너졌고, 이에 따라 보수적 성향이 강하거나 엘리트주의적 인사들이 승승장구하는 파테르 분파에 합류하기 시작했습니다. 이들은 파테르 분파 내에서 일종의 '온건파'를 형성하게 되었습니다.\n\n그러나 '온건파'라는 단어가 이들을 완벽하게 설명하는 것은 아닙니다. 그들은 대체로 정치적 폭력이나 절대적 독재 체제, 혹은 고참 파테르 분파 임원들의 극단적인 주장에 동조하지 않지만, 다른 선택지가 없을 때는 미소노 미카를 지지하는 쪽으로 기울어질 것입니다. 애초에 이러한 혼란 속에서 트리니티를 이끌 수 있는 인물은 그녀밖에 없습니다.\n\n다른 분파들, 특히 키리후지 나기사는 게헨나와의 평화 조약을 주장할 것입니다. 그러나 과연 지금, 이런 시국에서 평화 조약이 현실적인 해결책이 될 수 있을까요? 분명한 것은 기존의 티파티 삼두정 체제는 실패했다는 사실입니다. 지금 트리니티에 필요한 것은 혼란을 극복할 수 있는 강력한 지도력과, 국가를 위해 헌신할 애국자들입니다.\n\n현재 '온건파'의 주요 인사로는 타나카 미호, 사토 유카와 같은 전 상투스 분파 임원들, 그리고 나가요시 스바루, 야마모토 나나와 같은 전 필리우스 분파 임원들이 있습니다. 이들은 점차 파테르 분파의 현 체제에 순응해가며, 새로운 트리니티 질서에 적응하고 있습니다."
 trinity_flavor_events.15.a: "더 많은 이가 그녀의 뒤를 따르겠지!"
 trinity_flavor_events.16.t: "부작용"
 trinity_flavor_events.16.desc: "트리니티는 재산업화 정책을 통해 늘어난 부지를 최대한 효율적으로 활용하고자 다방면으로 노력을 기울였습니다. 그 결과 일부 영역에서는 실질적인 효과가 나타났고, 새로운 공업지대와 주거단지들이 빠르게 조성되기 시작했습니다. 하지만 문제가 전혀 없는 것은 아니었습니다.\n\n재산업화 과정에 투입된 노동자 대부분은 독일 현지인이거나 수인이었습니다. 이 둘을 억지로 같은 막사에 배치한 것이 불만의 시작이었습니다. 외모부터 생활습관까지 모든 것이 다른 이들을 한 공간에 몰아넣자 갈등은 순식간에 불거졌습니다. 독일인들의 괴롭힘이 심해지자 수인들은 결국 집단으로 반격에 나섰습니다. 기습적인 싸움에서 독일인들이 밀려났지만 패싸움은 거기서 끝나지 않았습니다. 프로젝트는 중단되었고 하루 종일 집단 난투극이 벌어졌으며, 급기야 건설 장비까지 동원되는 등 현장은 아수라장이 되었습니다.\n\n불행 중 다행으로 총기 같은 무기들은 사전에 모두 압수한 덕분에 사상자는 크게 발생하지 않았습니다. 구호기사단과 정의실현부의 신속한 출동으로 양측의 충돌은 진압되었고, 부상자들은 구호기사단의 치료를 받고 있습니다. 하지만 근본적인 해결책이 마련되지 않는다면 이런 사태는 언제든 다시 발생할 수 있어 보입니다."
 trinity_flavor_events.16.a: "서로가 익숙해지는 수밖에..."
 trinity_flavor_events.16.b: "문제를 해결 해줘라..."
 trinity_flavor_events.17.t: "유격대 분쇄 작전과 현지 동향에 대한 보고서"
 trinity_flavor_events.17.desc: "\n\n\n                                    £GFX_report_event_TRN_IA\n\n\n\n\n\n\n티파티의 호스트님께\n\n트리니티 내부의 방첩 업무를 맡아 정보를 수집한 결과, 학원정보부는 최근 시행된 유격대 분쇄 작전과 관련하여 중대한 성과를 이루었으며, 이에 호스트님께 보고드릴 준비가 완료되었음을 알려드립니다.\n\n정보부의 직접적인 개입으로 저항 조직의 일부 수뇌부를 암살하는 데 성공했습니다. 그러나 아직 극소수에 불과하며 저항 조직이 생각보다 촘촘한 그물망 형태로 퍼져 있음을 확인했습니다. 그럼에도 지속적인 노력을 기울인다면 저항 조직을 분쇄하는 데 충분할 것으로 판단됩니다.\n\n현지 동향은 다소 조심스럽습니다. 티파티의 유화 정책이 어느 정도 효과를 보고 있지만 제한적입니다. 아직 현지인들은 저항 조직과 협력하며 우리를 불신하고 있습니다.\n\n존경을 담아,"
 trinity_flavor_events.17.a: "좀 더 확실한 방법이 필요 하겠어.."
 trinity_flavor_events.18.t: "갑작스러운 제안"
 trinity_flavor_events.18.desc: "사다리 위에서 마지막 고서를 밀어 넣은 순간, 코제키 우이는 안도의 숨을 내쉬었다. 문제는 그게 끝이 아니었다. 사다리는 삐걱거렸고, 다리는 이미 떨리고 있었다.\n\n\"우, 우와아아...\"\n\n조심스럽게 발을 내딛으려는 찰나-\n\n\"우이쨩!\"\n\n\"꺄아아아악!!\"\n\n깜짝 놀란 우이는 중심을 잃고 사다리에서 떨어졌다. 바닥에 철퍼덕, 고통보다 더 먼저 찾아온 건 창피함이었다. 날개를 퍼덕이며 내려온 미카가 얼굴을 들이밀었다.\n\n\"아핫☆ 진짜 그렇게 놀랄 줄은 몰랐지? 미안~!\"\n\n\"미, 미카 님... 제 손가락만은...\"\n\n무언가 잘못 들킬 뻔했지만, 다행히 미카는 딴 얘기를 꺼냈다.\n\n\"우이쨩, 너 고서 정리 같은 거 잘하잖아? 경제도 좀 알지?\"\n\n\"...전 고문자 해독은 좀 하지만, 경제는...\"\n\n\"그럼 됐어! 사실 나, 새로운 동아리 하나 만들었거든~ 이름하여 '학원경제개발부'! 귀엽지 않아?\"\n\n\"...제 의견은...?\"\n\n\"응? 당연히 우이쨩이 도서부를 그만두고, 경제개발부 부장이 되는 거지. 재미있을 것 같지 않아~?\"\n\n\"저, 그건 좀... 저는 그다지 그런 쪽에 소질이...\"\n\n그 순간, 미카의 표정이 살짝 바뀌었다. 웃고는 있었지만, 그 눈빛은 조금도 웃고 있지 않았다.\n미카는 천천히 뭔가를 꺼냈고, 차가운 금속의 감촉이 우이의 이마에 닿았다.\n\n\"우이쨩, 지금 나랑 장난치는 거야? 진심이야?\"\n\n심장이 쿵, 하고 내려앉았다. 우이는 숨도 쉬지 못한 채, 고개를 위 아래로 흔들었다.\n그러자 미카는 다시 천진한 얼굴로 돌아왔다.\n\n\"좋아~ 이제 우이쨩은 경제개발부 소속이야! 앞으로 잘 부탁해, 부장님!\""
 trinity_flavor_events.18.a: "\"어, 어째서 이렇게...\""
 trinity_flavor_events.19.t: "얄마르 샤흐트"
 trinity_flavor_events.19.desc: "얄마르 샤흐트는 대전이 사태가 자신의 인생을 송두리째 뒤흔들 것이라곤 상상하지 못했다. 어느 날, 그는 조국이 두 동강 나고, 그 상처 입은 땅 위로 독수리가 내려앉아 찢긴 사체를 쪼아먹는 광경을 목도했다. 그리고 그 피멍든 자리에, 국가인지, 아니면 그 흉내를 낸 무언가가 세워졌다.\n\n그가 몸담았던 라이히스방크가 불타는 모습을 지켜보며, 샤흐트는 무언가가 내부에서 산산이 부서지는 감각을 느꼈다. 그리하여 그는 고향으로 물러나 근신하며 조용한 삶을 보내기로 결심했다. 다행히도 그의 고향만은 전란에서 비껴가 있었고, 그는 그곳에서 조용히 여생을 마무리하리라 믿었다.\n\n하지만 운명은 그런 평온을 허락하지 않았다. 트리니티의 지도부에 대대적인 변화가 일었고, 예상치 못한 곳에서 다시 그의 이름이 불렸다. 학원경제개발부의 부장직. 처음에는 완강히 거절할 생각이었다. 이제는 시대에 뒤처졌다고, 자신이 맡기에는 벅차다고 느꼈기 때문이다. 하지만 정부 요원들은 집요했고, 설득은 집안의 문턱을 넘고도 한참을 이어졌다.\n\n결국 그는 제안을 받아들였고, 재건된 라이히스방크의 문을 다시 열었다. 무너진 것들 위에서, 또 한 번 경제를 일으켜 세울 준비가 되어 있었다."
 trinity_flavor_events.19.a: " 인생은 오르막과 내리막으로 가득하다"
 trinity_flavor_events.20.t: "트리니티 수영장 차 사건"
 trinity_flavor_events.20.desc: "\"애들아 날려라!\"\n\"에라이!\"\n\n -풍덩-!\n\n참으로 충격적인 사건이 벌어졌습니다. 트리니티의 동아리 중 하나인 '다도부'가 오늘, 무력시위에 가까운 사건을 일으킨 것입니다. 사태의 발단은 단순했습니다. 동아리 예산이 삭감되자 이에 반발해 다도부는 자신들의 차 세트를 전부 수영장에 투척하는 극단적인 행동을 감행했습니다.\n\n특히 문제의 수영장이 에덴에서 멀지 않은 곳에 위치해 있었기에 사건은 빠르게 퍼졌고, 학원 내부에서 큰 파장을 일으켰습니다. 이들의 돌발 행동은 결국 정의실현부의 개입으로 진압되었으나, 수영장은 사실상 복구 불가능한 상태에 이르렀습니다. 해당 시설의 처리는 학원 예산을 통해 진행될 예정입니다"
 trinity_flavor_events.20.a: "그렇다고 해도, 저 수영장의 홍차를 마실 생각은 하지 마.."
 trinity_flavor_events.21.t: "디저트 약탈자"
 trinity_flavor_events.21.desc: "\"미치겠다.. 진짜 다 문 닫았대.\"\n이바라기 요시미는 책상에 턱을 괴고 어두운 표정을 짓고 있었다. 시간은 어느덧 정오를 넘기고 있었다.\n\n\"그러게, 어제 너희들도 봤을거 아니야? 가게들이 전부 엉망진창이었잖아.\"\n카즈사는 당연하다는 듯이 휴대폰을 보며 말했다.\n\n\"후훗... 달콤한 세상은 그렇게 한순간에 무너지는 것이다, 라...\"\n창가에 서서 창밖을 바라보며 툭 한 마디 던진 건 유토리 나츠였다. 오늘따라 말투는 더욱 이상했고 눈빛은 허공을 헤매고 있었다.\n\n책상 위에는 지금까지 리뷰했던 디저트 가게들의 정문을 찍은 사진들이 널브러져 있었고 그 위에는 빨간 싸인펜으로 X자가 쳐져 있었다.\n\n\"여기 있는 가게들이 전부 문을 닫았다니, 말이 돼? 세상이 갑자기 달라졌어... 우리한테 대체 무슨 일이 벌어진 건지 아직도 모르겠다고!\"\n요시미는 화를 내며 말했다.\n\n\"...요시미, 요시미, 요시미. 아직도 깨닫지 못했나? 바로.. <전설의 디저트가 있는 곳> 말이야.\"\n\n\"그만 좀 해, 나츠. 진지하게 말해봐. 너 또 뭔 이상한 데 알아봤지?\"\n카즈사는 나츠가 못미더운 듯이 말했다.\n\n\"당연히 있지...\"\n나츠는 천천히 고개를 돌리며 슬쩍 웃음을 지었다.\n\"중앙구 동쪽에.. 새로운 디저트 가게가..!!\"\n\n그러자 다들 나츠를 바라보았다. 나츠는 손을 내밀며 이들에게 말했다."
 trinity_flavor_events.21.a: "\"아아.. 함께 떠나겠나? '디저트'의 길로.\""
 trnfla_21_tt: "§g요시미는 말없이 그 손을 바라보다가 툴툴거리며 자리에서 일어났다.\n\"...진짜, 네가 또 이상한 데 데려가면... 아이스크림값 받아낼 거야.\"\n\n카즈사는 결국 한숨을 쉬며 말했다.\n\"말도 안 되지만, 일단 가보자.\"§!"
 trinity_flavor_events.22.t: "인터넷 개통"
 trinity_flavor_events.22.desc: "\"하아... 오늘도 이렇구나.\"\n\n미나미노 하나는 트리니티 중앙구에서 꽤나 멀리 떨어진 시골에 사는 트리니티 종합학원 2학년이다. 동아리에는 들지 않았다. 아니, 들 수 없었다. 통학 시간이 꽤 길기 때문이다. 게다가 드물게 운행되는 노선이라 밤 8시가 넘어서야 겨우 집에 도착한다. 그래서 하나는 집에서 인터넷을 통해 사람들과 교류하며 지내왔다.\n\n그러나 세상이 뒤바뀌고 하나는 그 인터넷마저 단절되었다. 인터넷이 없는 동안 하나는 자신이 할 수 있는 걸 다 해보았다. 인터넷을 연결해보겠다고 검색 엔진에 이것저것 쳐보기도 했다. (물론 인터넷이 안 되니 아무 반응도 없었지만.) 자신의 몇 안 되는 친구들과 전화 통화를 하며 지내거나 시간을 내어 중앙구로 가 카페에 들러 인터넷만 하루 종일 하다가 귀가하는 등 온갖 귀찮음이 따라붙는 삶을 살았다.\n\n그러던 어느 날이었다.\n\n\"연결됐다...\"\n\n하나는 숨을 멈췄다. 모니터 오른쪽 아래 그 익숙한 와이파이 아이콘에 드디어 하얀 선이 꽉 찼다. 장난처럼 깜빡이던 회색의 'X'표시가 사라진 것이다.\n\n\"......하 진짜네.\"\n\n믿을 수 없다는 듯 키보드를 몇 번 두드렸다. 검색창에 아무 단어나 입력했다. \"인터넷 복구됨\" \"살았다\" \"트리니티\" \"고독\" 손에 걸리는 대로. 그리고 화면이 움직이기 시작했다. 링크가 열리고 이미지가 뜨고 광고가 튀어나왔다. 그야말로 문이 열린 것이었다. 자신만 홀로 남겨졌던 세계에 드디어 다시 길이 열린 것이다.\n\n\"됐다... 이거야...\"\n\n하나는 쿡쿡 웃었다. 거실에 울린 웃음소리는 작았지만 정말 오랜만에 터져 나온 진짜 목소리였다."
 trinity_flavor_events.22.a: "좋은 이야기군"
 trinity_flavor_events.23.t: "트리니티 농업 문제"
 trinity_flavor_events.23.desc: "트리니티의 농업 현장은 사태 이후 완전히 붕괴했습니다. 기존의 자동화된 스마트 팜 시설들은 부지를 효율적으로 활용할 수 있었지만, 에너지 자원 문제와 로스트 테크놀로지 문제로 가동이 중단되었습니다. 기존에 비축해둔 식량이 있었기에 당장의 식량 위기는 피할 수 있었습니다. 그러나 아무런 조치를 취하지 않는다면 머지않아 빵 한 조각조차 구하기 어려운 상황이 올 수 있습니다. 다행히 우리가 점유하고 있는 지역 대부분이 평야라는 점은 희망적입니다. 이전보다 효율적이지는 못하더라도 과거 수십 년 전의 전통적 방식을 채택해 농업 활동을 다시 확장해야 한다는 논의가 진행되고 있습니다."
 trinity_flavor_events.23.a: "위대한 트리니티의 대농장은 이제 과거의 유물이다..."
 trinity_flavor_events.24.t: "우주에서 온"
 trinity_flavor_events.24.desc: "\"비서쨩? 그래서 오늘 할 일이 뭐라고 했지?\"\n\n\"오늘은 없습니다. 게다가 어제 늦게까지 업무를 처리하셨잖습니까.\"\n\n\"...그럼 오늘만큼은 여유를 즐겨야겠네~!\"\n\n가벼운 농담처럼 던진 말에 잠깐의 웃음이 오갔다. 분위기는 한결 부드러워졌고, 미카는 다시 찻잔을 들어 올렸다. 천천히 향을 음미하며 차를 한 모금 마셨다. 익숙한 티파티 장소, 익숙한 풍경. 하지만 미소노 미카는 어딘가 허전함을 느꼈다. 차의 향이 어째서인지 평소보다 밋밋하게 느껴졌다.\n\n\"아악!\"\n\n갑작스러운 비명의 울림에 미카는 깜짝 놀라 찻잔을 내려놓고 자리에서 벌떡 일어났다.\n\n\"비서쨩?!\"\n\n놀란 표정으로 달려가자, 비서는 이마를 짚은 채 숨을 거칠게 몰아쉬고 있었다.\n\n\"허억... 허억... 괜찮습니다... 그냥, 순간적으로 머리가 깨질 듯이...\"\n\n얼굴은 창백했고, 고통의 여운은 아직 가시지 않은 듯했다. 미카는 그녀를 구호기사단에 다녀오도록 권했고, 비서는 고개를 끄덕이며 자리를 떴다. 미카는 그녀를 조용히 배웅한 뒤 다시 티 테이블로 돌아왔다.\n\n자리에 앉아 남은 차를 한 잔 더 따랐다. 오늘은 업무도 없고, 잠시 후 다시 집중하면 되겠지. 그렇게 생각하며 찻잔을 들어 올리는 순간 미카 역시 강렬한 통증을 느꼈다.\n\n쾅.\n\n머릿속이 마치 두개골 안에서 터지는 듯했다. 시야가 일그러지고, 중심을 잡기 어려웠다. 비서가 겪었던 증상과 정확히 같았다. 미카는 직감했다 이건 단순한 편두통이 아니라고.\n\n고통이 잠시 가라앉고, 미카는 책 속에 묻혀 살던 시절, 과거 역사 수업 중 배운 어떤 이야기를 떠올렸다."
 trinity_flavor_events.24.a: "그것은 우주에서 온 색채다."
 trinity_flavor_events.25.t: "신세계로부터"
 trinity_flavor_events.25.desc: "아츠코가 트리니티 중앙구를 걷고 있다."
 trinity_flavor_events.25.a: "\"이 길에도 꽃이 많이 피어 있으면 좋겠네.\""
 trinity_flavor_events.27.t: "백화요란 - 정의실현부 연합훈련 - 1일차"
 trinity_flavor_events.27.desc: "\"우, 우와아앗! 자, 자자자, 잠깐만! 옷이 너무 예쁜데?! 오늘 연합 훈련이라 맞춰 입은 거야?\"\n\n\"네...? 이 옷들은 전부 정의실현부 제복입니다.\"\n\n\"그, 그렇다고 해도 정말 멋지다구! 뭐랄까... 책에서만 보던 교복을 실제로 보는 느낌이랄까...\"\n\n\"후후, 그렇게 말씀해 주시니 기쁘네요. 원하신다면 맞춤 제작도 가능합니다.\"\n\n\"저, 정말로...? 아, 아냐! 이렇게 막 받아도 되는 거야...?\"\n\n...\n\n\"으아아-! 정말 모르겠어! 갑자기 급성 청추니움 알레르기 쇼크가 온 것 같아! 머리가... 생각이 안 나...!\"\n\n\"죄송하지만...! 다음 훈련은 잠시 미뤄도 괜찮을까? 갑자기 어지러워서...\"\n\n\"네. 그럼 훈련은 잠시 중단하고... 저희는 그동안 백귀야행을 둘러보고 와도 괜찮을까요?\"\n\n\"...?\"\n\n\"잠깐 눈 돌린 사이에... 어디론가 가버리셨네요.\"\n\n그렇게 하스미와 정의실현부 부원들은 백귀야행을 둘러보며 1일차를 조용히 마무리했다."
 trinity_flavor_events.27.a: "\"역시 받아야 할까..? 그렇지만 초면인데 덥석 받아도 되는걸까? 으으. 정말로 모르겠어~.\""
 trinity_flavor_events.29.t: "본연으로"
 trinity_flavor_events.29.desc: "\"오리. 오리. 응답 요망. 나는 펭귄이다.\"\n\n\"하아... 왜 아무런 답이 없는 거지? 무전기는 분명 정상인데...\"\n\n그날 이후, 모든 것이 변했다. 트리니티는 물론 키보토스 전체가 하루 종일 사태에 대한 보도로 들끓었다.\n\n계획도 산산이 흩어졌다. 그날 이후... 오리, 그러니까 미소노 미카는 단 한 번도 무전에 응답하지 않았다.\n\n돌아가야 한다. 오로지 그 생각만이 시라스 아즈사의 머릿속을 지배하고 있었다.\n\n\"...통신 종료. 이상. 펭귄이.\""
 trinity_flavor_events.29.a: "Et Omnia Vanitas(모든 것이 허무로다.)"
 trinity_flavor_events.30.t: "시라스 아즈사의 복귀"
 trinity_flavor_events.30.desc: ""
 trinity_flavor_events.30.a: "돌아온 걸 환영한다."
 trinity_flavor_events.31.t: "트리니티적 사회를 향해"
 trinity_flavor_events.31.desc: "중앙구에서 대규모 시위가 발생하고, 촉발된 트리니티 - 독일계 사회 문제가 해결 된지 약 두 달이 지났습니다. 당시 많은 해외 전문가들은 트리니티가 내부의 모순으로 인해 결국 붕괴할 것이라 예측했고, 자극적인 제목과 선정적인 사진들로 위기를 과장한 기사들이 쏟아졌습니다. 그러나 그러한 관측과는 달리, 트리니티는 서서히 내부 안정을 되찾고 있으며, 대전이 사태가 만든 사회적  모순들도 조금씩 해소되어가고 있습니다.\n\n미소노 미카의 정치 강령은 표면적으로는 사회 개혁, 계급 협조, 단방제를 내세우며 일견 우파적인 면모를 보이지만, 그녀의 사상적 색채는 단순히 이념의 좌우로 구분되기 어려울 만큼 복합적이고 다면적입니다. 특히 대전이 사태 이후 급격히 변화한 트리니티 학생들은 점차 미카에게 더 급진적이고 과격한 정책을 요구하고 있습니다.\n\n이러한 상황 속에서, 미소노 미카는 트리니티 고유의 강점을 지키기 위해 키보토스 총학생회와의 협력을 축소하고 있습니다. 총학생회가 추진했던 '에덴 조약'과 같은 접근 방식은 본질적인 문제 해결이 아닌, 일시적인 봉합에 불과하다는 것이 그녀의 판단입니다. 미카는 트리니티의 정체성과 이상을 외부에 의존해 타협하는 것이 아니라, 스스로의 방식으로 회복하고자 합니다. 그녀가 지키고자 하는 것은 단지 체제나 권위가 아닙니다. 그것은 트리니티 학생들의 영혼, 사랑, 그리고 청춘 그 자체입니다."
 trinity_flavor_events.31.a: "모교에 영광이 있으라!"
 trinity_flavor_events.32.t: "포스트모템"
 trinity_flavor_events.32.desc: "\"와아~! 나기쨩! 좀 어때? 불편한 건 없어?\"\n\n\"...불편하긴 합니다. 그래도, 지하 감옥보단 낫군요.\"\n\n잠시 정적이 흘렀다. 두 사람 사이엔 묘한 긴장감이 감돌고 있었다. 각자의 자리에서 서로 다른 불편함을 느끼고 있었다.\n\n\"직접 찾아오신 거라면... 뭔가 더 남은 이야기가 있으신 건가요?\"\n\n\"으음... 아냐, 이젠 다시 못 볼 줄 알았거든.\"\n\n\"...\"\n\n나기사는 더 이상 말을 잇지 못했다. 미카는 그런 나기사의 눈빛을 잘 알고 있었다. 오랜 소꿉친구였으니까.\n\n나기사는 눈을 지그시 감고, 마치 한숨 섞인 듯한 말투와 떨리는 목소리로 중얼거렸다.\n\n\"당신이 이렇게까지 할 줄은 몰랐는데요... 미카 씨라면 분명 이런 때일수록..\"\n\n\"왜? 어째서? 이번 사건 때문인가요? 원인불명의 대규모 사태... 혹시 그걸 기회 삼아 게헨나를 짓밟으려고? 그래서 10년 넘게 알고 지낸 소꿉친구인 저까지...?\"\n\n\"...설마 세이아 씨 일까지, 미카 씨가 관련되어 있었던 건가요?\"\n\n\"그만해, 나기쨩.\"\n\n\"이건 복잡한 얘기가 아니야. 난 게헨나를 증오해서, 사람들을 이용하고, 감금하고... 필요하면 없애버리기도 했어. 그뿐이야.\"\n\n\"...뭔가, 착오나 오해가 있었던 건 아닐까요? 사실은 전혀 다른 진실이 있는 거라든가.\"\n\n\"아하하하. 다른 진실?\"\n\"나기쨩은 참 순진해. 그래서 내가 좋아했던 거지만.\"\n\"나기쨩은 내가 어떤 사람인지, 전혀 몰랐던 거야.\"\n\n\"어째서... 저는...\"\n\n나기사는 다리에 힘이 풀린 듯 그 자리에 주저앉았다.\n\n\"그렇게 오래 함께했는데도 몰랐냐고? 그 대답은, 나보다 나기쨩이 더 잘 알지 않아? 우리는 결국 타인이잖아. 서로의 속마음 같은 거, 알 수 있을 리가 없지.\"\n\n\"...난 이제 가볼게. 할 일이 많아서.\"\n\n\"...네. 조심히 돌아가세요, 미카 씨. 배웅은... 못 해드리지만.\""
 trinity_flavor_events.32.a: "나기사는 마음 속으로 마지막 인사를 남겼다."
 trinity_flavor_events.33.t: "(일반)  ' 미 소 노 미 카 ' 드디어 다 깟네요                         \n00 | [GetDate]                                                   "
 trinity_flavor_events.33.desc: "ㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡ\n\n(고양이 사진)\n\n점심 추천 해줘\n\n                                                  3 추천 | 비추천 1013\n\n전체 댓글 §t1000§!개\n댓글 수가 1000개를 넘었습니다. 더 이상 댓글을 쓸 수 없습니다. \n\n01\n야 장난하냐?\n\n02\n아...\n\n03\n간절한 사람 놀리는게 재밌냐?\n\n04\n(페로로가 경멸하는 이모지)\n\n05\n야한건 안돼!!!!\n\n06\n(\"얼탱\" 글자가 적힌 이모지)\n\n07\n어디가서 미소노 미카님 좋아한다고 하지 마라\n빡대가리새끼야. 유명한 트리니티 해변에서\n몇개월만 기다리면 볼 수 있는건데 시도는 해보고 \n어그로 끌어라.\n\n08\n>>07\n자매님...\n\n....이후로도 작성자를 향한 공격적인 댓글만 계속 달렸다."
 trinity_flavor_events.33.a: "하아?"
 trinity_flavor_events.34.t: "우리들의 이야기 - 1"
 trinity_flavor_events.34.desc: "노을이 지는 저녁 시간, 미카는 혼자 해변에서 수영을 즐기고 있었다. 수영이 취미는 아니었지만, 그날따라 이상하게 해변에 가고 싶다는 생각이 들어 아무도 없는 바다에 도착해 한참을 물놀이하고 있었다.\n\n지금은 선베드에 앉아 노을을 바라보는 중이었다. 키보토스의 태양과 다를 바 없는 지구의 태양이지만, 오늘만큼은 유독 특별하게 느껴졌다.\n\n노을은 정말 아름다웠지만, 해가 점점 지평선 너머로 사라지는 모습을 바라보며 미카는 천천히 자리에서 일어섰다.\n\n\"이곳에서 보는 노을도, 키보토스와 다를 게 없이 평범하네요.\"\n져가는 태양을 바라보며 누군가가 조용히 말했다. 수영복 차림의 세이아였다.\n\n\"세, 세이아 쨩?!\"\n\"여, 여긴 어떻게…?\"\n\n\"당황하지 마세요, 미카. 저는 단지 대화를 하러 온 것뿐이에요.\"\n세이아는 미카를 안심시키듯 부드럽게 말했다.\n\n\"세이아 쨩… 그, 그렇지만!\"\n그날의 기억이 뚜렷하게 되살아났다. 미카는 말문이 막혀 아무 말도 하지 못했다.\n\n\"네, 그날 제가 피습당한 건 사실입니다. 이건 제 마지막 메시지라고 생각해 주세요.\"\n\"당신은 늑대처럼 기회를 틈타 독주 체제를 완성하겠지요. 아니, 이미 완성했으려나요?\"\n\"하지만, 그게 정말로 당신이 소꿉친구까지 가둬가며 얻고 싶었던 거였나요?\"\n\n\"…\"\n미카는 아무 말 없이 세이아를 바라보기만 했다.\n\n\"솔직히 말하자면, 지금의 당신은 당신답지 않아요.\"\n\"그렇게나 꽃밭에 빠져 아리우스와의 화평을 외치던 사람이…\"\n\"이제는 더 이상 그런 것들도 필요 없는 건가요?\"\n\n\"……\"\n\n\"미카, 미안하지만 시간이 다 된 것 같아요.\"\n\n\"자, 잠깐만! 세이아 쨩! 그렇게 혼자 말하고 가는 건 너무하잖아?!\"\n\n\"어쩔 수 없어요. 하지만 미카, 당신이라면 이해해 주겠죠.\""
 trinity_flavor_events.34.a: "미카가 다급하게 손을 뻗었다."
 trinity_flavor_events.35.t: "협동주의자들"
 trinity_flavor_events.35.desc: "협동주의자들은 말 그대로 계급협조론을 주장하고 있습니다. 그들은 모든 사람이 마치 인체처럼 기능적으로 통합된 유기체로서 진화해야 한다고 믿습니다. 물론 여기서 말하는 진화는 생물학적 진화가 아닙니다. 이들은 협동과 공동선을 통해 계급 간의 갈등과 차이를 조절하려 노력하며, 연대와 보충성, 단체 교섭과 노동자 참여를 적극 권장합니다. 가족의 가치와 같은 종교적 가치 또한 중요하게 여깁니다. 부분적 시장 개입과 복지를 지지하며 노동 친화적이고 공동체적인 성향을 지니고 있습니다.\n\n이들은 주로 온건적이거나 좌익적 성향을 가진 임원들이 지향하는 정치적 색채입니다. 그러나 최근 들어 협동주의 이념을 가진 임원들이 파테르 분파 내부에서 급속도로 늘어났습니다. 이는 현재 티파티가 좋든 싫든 이념주의자들을 제치고 협동주의자들을 중심으로 재편되고 있음을 의미합니다."
 trinity_flavor_events.35.a: "이들의 생각을 티파티의 이념으로 삼아야 한다."
 trinity_flavor_events.35.b: "이들의 생각은 너무 이상적이다."
 trinity_flavor_events.36.t: "어둠 속의 빛"
 trinity_flavor_events.36.desc: "나치 독일의 몰락과 진정한 그리스도 왕국의 승리를 기념하며\n로마, 성 베드로좌에서\n주후 1936년, 부활 시기\n\n사랑하는 아들들과 딸들에게, 전 세계의 가톨릭 신자들에게, 그리고 승리의 평화를 이룩한 귀한 형제 자매들에게,\n\n1. 하느님의 섭리 속에서\n주님께서는 시대마다 인간의 교만과 폭정을 꺾으시며 겸손과 정의를 드러내십니다. 우리 시대에도 그리스도와 그 복음의 진리에 대항하여 스스로를 절대화한 한 권력이 무너졌습니다. 인종의 우월을 외치고 창조주를 부인하며 인간을 단지 도구로 삼았던 그 체제가 종말을 맞이한 것을 우리는 깊은 감격과 감사로 바라봅니다.\n\n2. 그릇된 신앙의 종말\n나치즘이라 불린 그 사상은 피조물인 인간을 창조주의 자리에 앉히려 하였고 민족을 우상으로 만들었으며 약자를 억압하고 무고한 피를 흘리게 하였습니다. 그러나 \"빛이 어둠 속에 비치니 어둠이 그를 깨닫지 못하였다\"(요한 1,5)고 하신 주님의 말씀이 마침내 역사의 현장에서 이루어졌습니다.\n\n3. 정의와 신앙을 지킨 국가에게\n우리는 주님 안에서 이번 승리의 도구가 된 기독교 국가에 깊은 찬미와 축복을 전합니다. 그대들은 전쟁의 불길 속에서도 억압받는 형제들을 위해 싸웠고 진리의 빛을 가리는 폭정을 꺾으셨습니다. 이는 단순한 군사적 승리가 아니라 하느님께 대한 충성과 복음의 자유를 위한 승리입니다.\n\n4. 평화의 과업\n그러나 승리는 종착점이 아니라 시작입니다. 이제 그대들의 사명은 무너진 도시와 상처 입은 영혼 위에 그리스도의 사랑과 정의를 세우는 일입니다. 보복이 아니라 용서를, 증오가 아니라 화해를 심으십시오. 그리스도의 평화만이 전쟁이 남긴 깊은 골을 메울 수 있습니다.\n\n5. 모든 이에게 드리는 당부\n사랑하는 형제자매들이여, 우리는 이 역사적 순간을 하느님께 감사드리며 다시는 어떠한 권력도 하느님 위에 서지 못하게 경계합시다. 가르멜 산의 예언자처럼 우리는 거짓 신들을 물리치고 \"주님만이 하느님이시다\"라고 고백해야 합니다.\n\n6. 일치에 대한 염려와 기도\n비록 오늘의 승리가 하느님의 도구를 통해 이루어졌으나 우리는 승리한 이들이 가톨릭의 완전한 신앙 안에 있지 않음을 기억합니다. 그 신앙의 불완전함과 교리의 차이는 장차 참된 일치를 향해 나아가야 할 과제로 남아 있습니다. 그러므로 우리는 이 승리를 감사함과 함께 경계로 받아들이며 모든 그리스도인이 \"한 주님, 한 믿음, 한 세례\"(에페 4,5) 안에서 하나 되도록 기도합니다.\n\n성모 마리아, 평화의 모후시여, 저희를 위하여 빌어주소서.\n그리스도 왕이여, 저희를 다스리소서."
 trinity_flavor_events.36.a: "로마, 성 베드로좌에서\n교황 비오 11세"
 trinity_flavor_events.37.t: "도서관 방문"
 trinity_flavor_events.37.desc: "\"후후. 실제로 도서관에 오는 건 처음이네요.\"\n키리후지 나기사가 코제키 우이 앞에서 말했다. 그러나 코제키 우이는 자신의 작업에 집중하느라 제대로 듣지 못했다.\n\n\"어라? 제 말이 들리지 않으시나요?\"\n\n\"히엑-!\"\n\"노… 놀랐잖아요… 제 작업 공간에서… 뭐 하시는… 히, 히엑!\"\n코제키 우이는 눈앞에 있는 인물이 키리후지 나기사라는 사실을 깨닫는 데 몇 초 걸리지 않았다. 그녀는 머리를 감싸 쥔 채 작은 목소리로 중얼거렸다.\n\n\"후훗. 걱정하지 마세요, 해치지 않아요. 제가 여기에 온 이유는… 도움이 필요해서예요.\"\n키리후지 나기사는 코제키 우이를 안심시키려는 듯 부드럽게 말했다.\n\n그러나 코제키 우이는 경계를 풀지 않고 책으로 하관을 가렸다. 그녀의 눈에는 여전히 불신이 어려 있었다.\n\n\"어머나… 그렇게까지 경계하지 마세요. 책 하나를 찾고 있거든요. 입에 올리기에 조심스럽지만… 아리우스 분교와 관련된 책이에요.\"\n그 말에 코제키 우이는 조금씩 경계를 풀었지만, 여전히 일정 거리를 유지했다.\n\n\"아, 아리우스 분교라면… 아마 지, 지하에 있을 거예요…\"\n\n\"후훗. 협조 감사드립니다, 우이 씨.\""
 trinity_flavor_events.37.a: "나기사는 웃음을 보이며 자신의 경호원과 지하실로 향했다."
 trinity_flavor_events.38.t.Yoshimi: "폭발적인 클라이막스"
 trinity_flavor_events.38.d.Yoshimi: "이바라기 요시미는 군사 지휘에 거리가 멀었고 자신은 절대로 장군 같은 것이 되리라 생각하지 못했습니다. 그러나 트리니티가 전시 상황이 되고 부족한 장군을 보충하기 위해 동아리가 동원되었습니다. 방과후 디저트부 였던 그녀에게는 화려한 경력도 없었고 군사 지휘에 대한 제대로 된 공부도 하지 않았었습니다. 그럼에도 꾸준한 군사 지휘와 작전에 동원되면서 그녀의 실력은 빠르게 성장했습니다. 최근 전장에서 세운 업적은 충분히 기릴 만했습니다. 그녀의 결단력 있는 지휘 아래 주요 거점을 탈환하고 승리의 깃발을 당당하게 꽂은 그녀는 트리니티 군인 사이에서도 어느 정도 명성을 떨치고 있습니다. '작은 거인'이라고 불리는 그녀의 다음 행보를 군사 인물들이 궁금해하고 있습니다."
 trinity_flavor_events.38.Yoshimi: "\"기대해도 좋으니까. 아니 기대해!\""
 trinity_flavor_events.38.t.Airi: "더 크게 더 멀리"
 trinity_flavor_events.38.d.Airi: "트리니티가 전시 상황이 되자 고질적인 장군 부족 문제로 동아리가 동원되기 시작했습니다. 방과후 디저트부 또한 동원되었는데 그중에 동아리의 부장격인 쿠리무라 아이리 또한 동원되어 장교로 발탁되었습니다. 군사 지휘에 대해 하나도 알지 못했지만 그녀는 자신의 위치에서 최선을 다했습니다. 아이리는 용감하게 병사들을 이끌고 작전을 성공적으로 마무리하면서 지도력을 입증했습니다. 그녀가 너무 평범하고 수수한 것에 의문을 제기한 사람도 존재했지만 그녀가 스스로를 증명하면서 신뢰를 얻어냈습니다. 쿠리무라 아이리는 처음으로 받아보는 큰 관심에 적잖이 당황한 모습이 자주 보이고 있습니다. 그러나 그 관심을 싫어하지는 않는 것 같습니다."
 trinity_flavor_events.38.Airi: "\"보여드릴게요. 달라질 수 있었던 제 모습!\""
 trinity_flavor_events.38.t.Natsu: "이 또한, 디저트에 담긴 철학"
 trinity_flavor_events.38.d.Natsu: "트리니티 군인 중 떠오르는 별 중 한 명이자 또 다른 신동이 나타났습니다. 화려한 경력을 가진 유토리 나츠입니다. 그녀의 지휘 방식은 다소 독특하지만 병사들에게 깊은 사랑을 받고 있습니다. 전장에서 그녀가 보이는 행동은 때때로 예측 불가능합니다. 그러나 그 이면에는 통찰력과 병사들을 향한 진심 어린 마음이 자리하고 있습니다. 그녀는 전장의 분위기를 읽고 병사들의 상태를 파악하며 자신만의 고유한 전술을 구사합니다. 유토리 나츠는 단순히 승리만을 추구하지 않습니다. 전장 속에서도 동료애와 유대를 잃지 않고 병사들을 위해 싸우며 그들의 사기를 북돋습니다. 인간적이면서도 최선의 상황을 도출하기 위해 노력하는 그녀의 모습은 많은 병사들에게 폭넓은 지지를 받고 있습니다."
 trinity_flavor_events.38.Natsu: "\"이 공간에 디저트를 더하고 싶은데, 도와줄 거지?\""
 trinity_flavor_events.39.t: "미식연구회"
 trinity_flavor_events.39.desc: "\"역시, 제 입맛에는 맞지 않군요... 불합격입니다.\"\n하루나가 차갑게 말하며 손에 쥔 버튼을 눌렀다. 순간, 굉음과 함께 폭발물이 터지며 식당 내부는 불길과 파편으로 뒤덮였다. 비명과 혼란이 뒤섞이는 사이, 미식연구회는 이미 차량에 몸을 실은 뒤였다. 타는 듯한 연기와 불빛을 뒤로하며, 그들은 속도를 높여 현장을 벗어났다.\n\n그러나 신고는 이미 접수되었다. 사이렌 소리를 가르며 정의실현부의 차량들이 빠르게 추격해왔다.\n\n\"우와앗! 뭐, 뭐야?! 벌써 쫓아온 거야?\"\n준코가 당황한 듯 창문 밖으로 몸을 기울였다. 하루나는 익숙하다는 듯 미소를 지으며 정의실현부를 향해 한 마디 거들었다.\n\n\"후훗, 정의실현부 여러분. 평안하셨는지요? 저는 오늘도 미식을 탐구하기 위해 여러 음식점들을...\"\n\n하루나의 도발적인 외침이 도로 위에 울려 퍼졌다. 하지만 대답은 곧 총탄이었다. 유리창이 산산조각 나며 금속이 찢기는 소리가 이어졌다.\n\n\"곤란하네요... 설마 여기서 난관을 마주하게 될 줄은...\"\n하루나가 여유로운 척 말하던 순간, 차량이 급정거했다. 핸들을 잡은 아카리의 시선은 앞으로 고정되어 있었다. 도로 위에는 정의실현부의 차량들이 촘촘히 늘어서 있어 길을 완벽히 차단하고 있었던 것이다.\n\n차량의 문이 열리며 정의실현부 부원들이 빠르게 흩어져 포위망을 좁혀 왔다. 총구가 일제히 미식연구회 차량을 겨눴다.\n\n\"쳇... 아무래도 여기까지인 것 같네요. 미식의 길이란 이렇게 험난하군요.\"\n하루나는 자신을 포위한 정의실현부를 천천히 둘러본 뒤, 항복의 의미로 두 손을 들어 올렸다. 차 안의 다른 부원들도 서로 눈빛을 주고받더니, 마지못해 손을 들어 올렸다. 긴장으로 가득한 정적이 감돌았다. 정의실현부는 이들을 체포했고, 곧바로 감옥으로 이송했다."
 trinity_flavor_events.39.a: "게헨나란 정말로.."
 trinity_flavor_events.40.t: "호랑이가 없는 굴에는.."
 trinity_flavor_events.40.desc: "호스트로서의 과중한 업무는 미소노 미카를 지치게 만들기에 충분했습니다. 그 무게는 본래 불안정한 그녀의 성격과 겹쳐, 마침내 그녀를 자신만의 별장으로 이끌었습니다. 미카는 스스로에게 휴가라는 이름의 선물을 내리고, 나흘간의 짧은 안식에 몸을 맡기기로 했습니다. 경호원 두 명과 함께 찾아간 곳은 티파티가 소유한 비밀스러운 해변이었습니다. 그곳에서 그녀는 경호원들과 소박한 티파티를 열고, 가벼운 담소를 나누며, 홀로 사색에 잠기곤 했습니다. 그렇게 그녀는 자신만의 세계 속에서 서서히 쌓였던 피로와 긴장을 풀어내고 있었습니다. 한편, 그녀의 부재 동안 국정은 파테르 분파의 대표 인물 세 명이 나서 분파의 뜻을 반영하며 이끌어가고 있었습니다."
 trinity_flavor_events.40.a: "여우가 왕인 법."
 trinity_flavor_events.41.t: "이 글을 읽고 있는 미래의 나에게"
 trinity_flavor_events.41.desc: "후겐베르크가 미소노 미카를 비롯한 트리니티를 못마땅해 하고 비판 하거나 비난하는 신문을 발행하고 인터넷에서 짧은 논평을 남기고 있다는 글을 작성 해줘"
 trinity_flavor_events.41.a: "친애하는 미래의 나에게, 과거의 나 남김."
 trinity_flavor_events.42.t: "크라이사우 서클"
 trinity_flavor_events.42.desc: "트리니티에게 저항하는 조직은 한둘이 아닙니다. 물론 체포되어 정의실현부에 넘겨져 수용소에 갇힌 이들도 적지 않습니다. 그러나 최근 잡힌 조직이 꽤나 흥미로웠습니다. 바로 크라이사우 서클입니다.\n\n이이들에게 어떤 특별한 점이 있을까요? 이름부터 특정 지명을 따온 조직이라 별로 흥미롭지 않습니다. 그러나 이들의 대범한 행동이 눈에 띄었는데, 바로 천년수도 에덴 지하에서 활동하던 작은 사교 모임이었습니다. 정확히는 중앙구와 서구의 경계 지하에서 활동하던 이들이었는데, 용감한 학생들이 이들을 발견해 신고한 덕분에 체포할 수 있었습니다. 여담으로 이 조직은 꽤나 흥미로운 조합으로 구성되어 있었는데, 귀족 집안 출신과 종교인, 그리고 사회주의자들로 이루어져 있었습니다."
 trinity_flavor_events.42.a: "유대계 폴란드인은 없었나? 다행이군."
 trinity_flavor_events.43.t: "원초적인 공포"
 trinity_flavor_events.43.desc: "\"아얏! 얌마 새끼야! 아프잖아!\"\n\n\"...제가 무서우신가요?\"\n\n\"미친년이네..\"\n\"..이봐 자경단 부를까?\"\n\n\"아니.. 그건 조금..\"\"아앗!\"\n\n\"아프죠? 지금 이 순간! 고통의 구렁텅이에 빠졌다는 느낌이시죠? 그게 바로 저의 사명이에요! 당신들에게 공포를 심어주어 구하는 겁니다!\"\n\n\"구제! 펀치!!!\""
 trinity_flavor_events.43.a: "이건 공포가 아니라 분노잖아."
 trinity_flavor_events.44.t: "첫 번째 업무"
 trinity_flavor_events.44.desc: "미소노 미카에게 티파티 호스트직은 그리 생소한 자리가 아닙니다. 과거 그녀는 이미 한 차례 호스트직을 수행한 경험이 있었고, 깔끔하게 임기를 마무리한 뒤 관례에 따라 다음 분파에게 직책을 넘겼습니다. 그러나 지금은 상황이 다릅니다. 과거에는 1년으로 엄격히 제한되어 있던 호스트 임기가 이제는 사실상 무한정으로 연장될 수 있게 되었기 때문입니다. 트리니티의 새로운 헌장이 보장하는 한 그녀의 임기는 지속될 것입니다.\n\n업무 자체는 그녀에게 그리 낯설지 않습니다. 분파 수장으로서 이미 막중한 책임을 지고 있던 그녀에게, 호스트직의 업무는 기존 업무량에서 약간의 행정적 절차와 의전이 추가된 정도에 불과합니다. 서류 작업은 분명 번거롭고 지루한 면이 있지만, 대부분을 신속하게 처리할 수 있습니다. 회의록 검토, 예산안 승인, 분파와의 협의 사항 정리 등 반복되는 업무들은 이제 거의 기계적으로 처리할 수 있을 만큼 익숙해졌습니다.\n\n업무를 마친 후 남아있는 시간을 효율적으로 활용하기 위해, 미카는 나름의 개인적인 일과를 만들어가고 있습니다. 그녀는 집무실에서 홀로 차분하게 차를 우려 마시며 하루를 정리하는 시간을 가지기도 하고, 때로는 집무실 한편에 마련된 공간에서 가벼운 체조나 요가를 하며 긴장된 몸을 이완시키기도 합니다. 미카는 이 조용한 순간들이 자신에게 필요하다는 것을 잘 알고 있고, 그래서 의도적으로 업무 이외의 시간을 확보하려 노력하고 있습니다."
 trinity_flavor_events.44.a: "그러니까 이거, 스토리인척 하는 튜토리얼이지?"
 trinity_flavor_events.45.t: "이념주의자들"
 trinity_flavor_events.45.desc: "트리니티의 발전은 상부에서 하부에 이르기까지 영웅적인 호스트들의 이념 아래 세워져 왔습니다. 이념주의자들은 미소노 미카가 바로 그러한 '영웅적인 호스트'이며, 그녀의 변덕스러운 정책에도 절대적이고 확고한 헌신만이 필요하다고 주장하는 극단적 성향의 임원들입니다. 이들은 주로 사회의 계획화를 주장합니다. 트리니티가 하나의 유기체이며 그 기관들이 조화롭게 작동해야만 제대로 기능한다는 것입니다. 그렇기에 분열된 유기체는 혼돈 속에서 무너질 수밖에 없고, 오직 시스템의 중앙화만이 학원을 번성시킬 것이라 믿습니다.\n\n좋든 싫든 이념주의자들은 티파티 내부에서 급속도로 세력을 확장하고 있습니다. 그들은 미소노 미카에게 더욱 강압적이고 영웅적인 면모를 요구하고 있습니다. 이념주의자들의 믿음에 따르면, 미소노 미카는 본성적으로 트리니티를 넘어 전 키보토스를 지배할 운명을 타고났습니다."
 trinity_flavor_events.45.a: "이들의 생각을 티파티의 이념으로 삼아야 한다."
 trinity_flavor_events.45.b: "이들의 생각은 너무 과격하다"
 trinity_flavor_events.46.t: "학생 연대는 무엇인가?"
 trinity_flavor_events.46.desc: "트리니티 사회는 이전부터 학생들의 자발적인 연대로부터 이뤄졌습니다. 제 1차 공의회는 선지자들의 자발적인 연대와 평화를 강조하면서 시작되었습니다."
 trinity_flavor_events.47.t: "감사해하는 미네."
 trinity_flavor_events.47.desc: "[TRM.GetLeader] 님에게,\n\n지원 감사합니다. 덕분에 강도 애들 때려 잡았다. 아무래도 구호가 필요할 듯. 다시 한 번 지원 감사드립니다."
 trinity_flavor_events.47.a: "아무래도 명예를 올려야 할 듯."
 trinity_flavor_events.48.t: "사쿠라코의 편지"
 trinity_flavor_events.48.desc: "최근 교과 과정 개편 소식은 잘 전해 들었습니다. 학생들의 영성을 함양하는 채플을 굳이 '선택'의 영역으로 미루셨더군요. 시스터후드의 입장에서는 참으로 유감스러운 결정이었습니다. 허나, 신앙을 교실 밖으로 밀어내신 분께서 정작 본인의 필요 앞에서는 다시금 주님의 권위에 기대려 하시다니… 그 놀라울 정도로 유연한 태도에는 저조차 감탄을 금할 길이 없습니다. 하지만 맹약은 맹약입니다. 시스터후드는 그 모순조차 기도로 덮고, 귀하가 내민 손을 잡도록 하겠습니다."
 trinity_flavor_events.48.a: "미안!"
 trinity_flavor_events.49.t: "우리들의 이야기 - 2"
 trinity_flavor_events.49.desc: "미카가 다급하게 손을 뻗었지만, 손끝에 닿은 것은 아무것도 없었다. 눈부시던 노을도, 잔잔한 파도 소리도 거짓말처럼 순식간에 흩어져 버렸다.\n\n미카는 거친 숨을 몰아쉬며 상체를 벌떡 일으켰다. 등 뒤로 식은땀이 주르륵 흘러내려 잠옷을 적시고 있었다. 주위를 둘러보았지만, 그곳은 조금 전까지 있었던 아름다운 해변이 아니었다. 차갑고 고요한 공기만이 감도는 익숙한 자신의 침실이었다.\n\n\"꿈.. 이었구나.. 응..\"\n\n미카는 가쁘게 뛰는 심장을 진정시키려 애쓰며 마른세수를 했다. 손바닥에 닿는 얼굴이 불덩이처럼 뜨거웠다. 하지만 꿈이라기엔 세이아의 목소리가, 그 서늘했던 눈빛이 너무나도 생생했다.\n\n그녀는 침대에 앉은 채 멍하니 허공을 응시했다. 머릿속이 복잡하게 엉켜들었다. 독재 체제, 갇혀버린 소꿉친구 나기사, 그리고 변해버린 자신. 세이아는 정확하게 미카의 가장 아픈 곳을 찌르고 사라졌다.\n\n'지금의 당신은 당신답지 않아요.'\n\n그 말이 귓가에서 떠나지 않았다. 희망을 꿈꾸던 자신은 정말 사라진 걸까. 자신이 벌인 일들이 과연 올바른 길이었을까. 죄책감과 자기합리화가 파도처럼 밀려와 서로 부딪쳤다. 하지만 이미 화살은 시위를 떠났고, 되돌릴 방법은 없었다. 그녀는 무릎을 끌어안으며 떨리는 입술을 열었다. 어둠 속, 아무도 듣지 않는 독백이 흘러나왔다.\n\n\"난… 난 그저… 이렇게 해야 할 것 같아서…\" 목소리는 금방이라도 울음이 터질 듯 위태로웠다. 미카는 어둠 어딘가에 있을지 모를, 혹은 영영 사라져 버렸을지도 모를 친구를 향해 간절한 다짐을 덧붙였다.\"그래도… 나 잘할 테니까… 응. 꼭… 다시 만나자…\""
 trinity_flavor_events.49.a: "미카는 눈물을 흘리며 조용히 말했다."
 trinity_flavor_events.50.t: "시스터후드 조사"
 trinity_flavor_events.50.desc: "정보부의 조사 결과 시스터후드 학생은 와카바 히나타로 밝혀졌습니다. 그녀는 도서부 부장의 요구를 들어주기 위해 이러한 행동을 감행했던 것이 조사 과정에서 드러났습니다. 물론 크게 죄질이 무거운 것은 아니기에 곧바로 풀려날 예정이지만, 단순한 심증만으로 시스터후드를 조사했다는 점에서 그들은 이러한 조사를 불쾌하게 생각하고 있습니다."
 trinity_flavor_events.50.a: "미안!"
 trinity_flavor_events.51.t: "트리니티 지상군"

 trinity_flavor_events.1000.t: "내면의 고뇌"
 trinity_flavor_events.1000.desc: "오늘은 이오치 마리에게 누구보다도 특별한 날이었다. 아이돌 무대라는 낯선 무대 위에서, 몇 가지 사소한 문제가 있었지만 그녀는 끝내 빛나는 퍼포먼스로 공연을 마무리해냈다. 화려한 조명 아래에서 반짝이던 그녀의 모습은 트리니티의 학생들에게 깊은 인상을 남겼고, 이젠 모두가 '아이돌 이오치 마리'를 기대하고 있었다. 언젠가 다시 무대에 설 그녀를 기다리며, 팬들은 열렬한 환호와 함께 공연장을 떠나갔다.\n\n그러나 무대가 끝난 그 순간부터, 마리는 혼자만의 조용한 싸움을 시작하고 있었다. 수녀로서의 삶은 그녀에게 있어 신념이자, 존재의 이유와도 같았다. 엄격한 규율 속에서 살아온 지난 시간들은 결코 가볍지 않았고, 마리 역시 그 길이 자신에게 주어진 운명이라 믿고 있었다. 하지만 무대 위에서의 짧은 순간-- 조명, 환호, 그리고 무대 아래에서 자신을 향해 손을 뻗는 수많은 시선 속에서--\n\n\"이건... 정말 괜찮은 건가요...?\"\n무대 뒤, 조용한 대기실에서 마리는 거울 속 자신의 모습을 바라보며 중얼거렸다. 반짝이는 의상과 아직 식지 않은 숨결, 손끝에 남은 박수 소리의 여운. 분명히 이건 신께서 원하신 길과는 다를지도 모른다. 하지만 그럼에도 불구하고, 마음 어딘가 깊숙한 곳에서는 계속해서 그 무대를 그리워하고 있었다.\n\n며칠간의 고민은 결코 쉽지 않았다. 기도 중에도, 고요한 성당에서도, 마리는 스스로에게 질문을 던지고 또 던졌다. 수녀로서 살아온 삶과, 무대 위에서의 '자유로운 나'. 둘 중 어느 쪽이 진짜 ‘이오치 마리’일까?\n\n그리고 마침내, 그녀는 조용히 결심을 내렸다."
 trinity_flavor_events.1000.a: "나, 아이돌 선언!"
 trinity_flavor_events.1000.b: "수녀로서의 각오를 다시 한 번 마음속에 새겨야겠어요!"
 trn_idol_portrait_tt: "§L이오치 마리의 초상화가 아이돌 옷으로 교체 됩니다.§!"
 trinity_flavor_events.1001.t: "수도복을 벗어던지고"
 trinity_flavor_events.1001.desc: "조용한 성당의 안뜰, 은은한 햇살이 스테인드글라스를 타고 떨어지는 오후였다.\n이오치 마리는 떨리는 손으로 수도복의 단추를 하나하나 풀기 시작했다. 묵주가 살짝 흔들리며 소리를 냈다. 마주 선 우타즈미 사쿠라코는 그 모습을 말없이 지켜보고 있었다.\n\n\"사쿠라코 님... 전, 더 이상 이 복장을 입고 설 수 없을 것 같아요.\"\n마리는 시선을 피하지 않은 채 말을 이었다. \"전... 아이돌의 길을 가겠습니다. 그것이 저에게 주어진 또 다른 사명이라고 믿어요.\"\n\n순간, 사쿠라코의 눈이 약간 흔들렸다. 그녀의 차분한 얼굴에 짧은 침묵이 드리웠다. 하지만 곧, 그녀는 두 손을 모으고 깊이 숨을 들이쉰 뒤, 부드럽게 고개를 끄덕였다.\n\n\"...그래요, 자매님. 당신의 결심이 신의 뜻에서 벗어나지 않기를, 저는 그저 기도할 뿐입니다.\"\n그녀는 미소 지으며 한 발 다가왔다. \"그리고 무엇보다... 당신이 자신답게 빛나는 길이라면, 저는 언제든 지지할 겁니다.\""
 trinity_flavor_events.1001.a: "좋아해 줘! 좀 더! 나를 봐 줘! 좀 더!"
 trnfla_1001_tt: "§L\"...마리 자매님에게도 저런 면이 있었군요. 그나저나... 아이돌이라 하면 저나 미네 단장님 정도밖에 없었을 텐데 ...도대체 누구와 아이돌을 하시겠다는 건지, 그게 조금 걱정이네요.\"§!"

 trinity_flavor_events.1002.t: "자신이 바라는 것"
 trinity_flavor_events.1002.desc: "이오치 마리는 고요한 성당의 의자에 앉아, 오랫동안 흔들리는 마음을 붙잡고 있었다. 무대의 찬란함과 박수갈채, 그 속에서 피어난 감정은 너무나 강렬했고, 때로는 수도복보다 더 자신답게 느껴지기도 했다. 그러나 마리는 결국 한 가지 결론에 이르렀다.\n\n-나는, 수녀로서의 길을 계속 걷겠습니다.\n\n결심했음에도, 마음은 여전히 완전히 맑아지지 않았다. 무언가가 가슴 어딘가에 걸린 듯한 느낌. 그 답을 찾기 위해, 그녀는 늘 자신이 찾던 조용한 장소, 사격장으로 향했다. 평소와 다름없이 정돈된 공간, 고요한 바람. 그곳은 세상의 소음과도, 마음의 소란과도 거리를 둔 곳이었다.\n\n마리는 무릎을 꿇고, 조용히 기도했다. 기도는 속삭임이 되어 공기 속으로 퍼졌고, 마리는 그 속에서 자신의 깊은 속마음을 조용히 토로했다. 그리고 잠시 후- 갑작스럽게, 머릿속이 환하게 밝아지는 듯한 느낌이 들었다. 마치 아주 오랫동안 묵혀둔 생각이 스르륵 열리는 듯한 감각. 누군가가 말없이 등을 가볍게 밀어준 듯한 따스한 울림.\n\n그녀는 문득 깨달았다. 무대에서 생긴 고뇌, 자신에 대한 의심과 혼란은 결코 잘못된 것이 아니었다. 그것은 신앙을 벗어난 것이 아니라, 오히려 신앙 속에서 자신을 돌아보게 해준 기회였다. 타인의 고민을 들어주고 위로하는 삶을 살아온 자신도- 가끔은 자신의 마음을 돌보고, 하고 싶은 것을 향해 걸어갈 필요가 있다는 것을."
 trinity_flavor_events.1002.a: "그 깨달음은 고요했고, 그러나 분명했다."
 trnfla_1002_tt: "§L요즘 들어, 이오치 마리를 바라보는 사쿠라코의 눈빛에는 어딘가 안도와 기쁨이 담겨 있었다. 조용히 묵주를 감싸쥔 그녀는, 창가에 앉은 마리의 활기찬 모습을 멀리서 바라보다가 부드럽게 중얼거렸다.\n\n\"최근의 마리 자매님... 참, 활기차셨어요. 보기 좋아요.\"§!"

 trinity_events_nagisa.1.t: "키리후지 나기사의 호스트 취임"
 trinity_events_nagisa.1.desc: "호스트 세이아가 저격당하는 유례 없는 사건에 뒤이어, 소꿉친구인 미소노 미카와의 권력 투쟁이 이어졌습니다. 키리후지 나기사는 결국 승리하였으나, 그 승리의 모든 과정이 나기사에게는 상처였습니다.\n\n트리니티 종합학원 헌장에 따라 다음 호스트는 티파티 투표에서 과반을 차지한 키리후지 나기사가 맡게 되었습니다. 파테르 분파를 세이아 암살 사건의 '설계자'로 비난하는 필리우스 분파의 주장이 존재하며, 실제로 파테르 분파가 세이아 저격 사건 이후 정치적 이익을 얻은 것은 사실입니다. 그러나 현재 우리들의 수사 내용에는 파테르, 그리고 미소노 미카가 나치와 공조했다는 증거는 없습니다. 현재의 정치적 논쟁은 파테르와 필리우스 두 분파의 갈등이 극에 달했다는 것을 보여주는 현상일 뿐, 실제 사건의 전모와는 별개입니다.\n\n세이아 암살 사건이 일어난 지 얼마 되지 않은 시점이기에, 키리후지 나기사의 호스트 취임식은 소규모의 인원이 모여 비공개로 진행되었습니다. 나기사는 '두 번째 트리니티는 없다'는 그녀의 사상을 명백히 하며, 파테르 분파가 주장하는 급진적 변화는 결코 일어나지 않을 것임을 밝혔습니다. 나기사의 승리는 다소 아슬아슬한 표차로 이루어졌으며, 그녀는 필리우스만이 아니라 다른 분파들을 끌어들여 정국을 안정화할 것으로 예상됩니다."
 trinity_events_nagisa.1.a: "정의를 위하여."
 trinity_events_nagisa.2.t: "상투스 분파와의 회담"
 trinity_events_nagisa.2.desc: "필리우스 분파는 압도적으로 파테르 분파를 상대로 승리한 것이 아니었습니다. 필리우스는 다른 분파들의 협력이 있었기에 권력을 얻어낼 수 있었습니다. 상투스는 비록 유리조노 세이아라는 위대한 지도자를 잃어버리고 많은 지지자들이 이탈하였으나, 여전히 의미 있는 규모의 세력을 가지고 있습니다.\n\n\"...저는 상투스라는 이름을 지우고자 하는 것은 아닙니다. 상투스는 여전히 그 자리에 남아, 여러분의 이상을 펼치실 수 있습니다. 다만 저는 여러분들이 저와 우정을 유지해 주기를 바랄 뿐입니다.\"\n\n나기사는 상투스의 지도자인 $TRN_Natsuki_Kato$에게, 필리우스와의 '연합'을 제안했습니다. 상투스는 나기사의 정책에 반드시 지지하는 신임 공급 정당으로서 티파티에 잔류하는 것입니다. 그 대신, 상투스는 필리우스의 우당으로서 나기사의 일부 정책에 영향을 줄 수 있습니다.\n\n한 때 티파티의 3대 세력 중 하나로 불렸던 상투스가 필리우스에 종속되는 형태로 살아남는 것은 $TRN_Natsuki_Kato$가 바라던 바는 아니었습니다. 그러나 호스트가 상투스의 지지만을 바랄 뿐, 상투스를 완전히 흡수하려고 하는 것이 아니라는 것이 분명해지자, 그녀는 나기사의 제안을 받아들이기로 결정했습니다."
 trinity_events_nagisa.2.a: "함께, 미래로."
 trinity_events_nagisa.3.t: "다락방의 공주님"
 trinity_events_nagisa.3.desc: "키보토스에서는 함께 마주 앉아 티파티를 즐기는 날도 많았지만, 대전이 이후에 그런 날은 점점 줄어들고 있었다. 특히, 세이아의 죽음 이후에는 더욱 그랬다. 미소노 미카와 나기사가 마주 앉아 대화를 나눈 것은 필리우스 분파의 선거 승리 이후 오늘이 처음이었다. 미카의 그, 하늘처럼 깊고, 황금색으로 빛나는 눈동자가 반짝였다. 미카가 오래간만에 방문한 이유. 그건 그녀의 심리적 불안감 때문이었다.\n\n\"나기 쨩은 나를 믿지?\"\n\"...믿습니다.\"\n\"...아하하☆ 응. 당연하지. 나기 쨩이, 그렇게 말할 줄 알았지!\"\n\n아주 짧은 문답이었지만, 그것만으로도 미카는 만족한 표정을 지었다. 필리우스 분파의 강경파들이 미소노 미카와 파테르 분파가 나치와 공조해 세이아 암살을 사주했다는 주장을 하고 있었기 때문이다. 물론, 현재의 수사는 무장친위대를 넘어서는 배후가 있다는 증거를 하나도 잡아내지 못하고 있었다. 나기사는 홍차가 담긴 도자기의 겉을 손톱으로 천천히 매만지면서, 테이블 맞은 편에서 나기사를 바라보는 자신의 가장 소중한 정적을 마주보았다.\n\n나기사는 미카가 그럴 사람이 아니라는 것을 알았다. 그리고 지금의 정치적 공세 역시 시간이 지나면서 사그라질 것이라는 것도 알았다. 나기사에게 있어서 가장 걱정되는 것은 미카의 감정이었다. 사법적 기소 위협도, 정치적 비난도 모두 이 찻잔 속 온기가 시간의 흐름에 따라 사라지듯이 없어지겠지만... 미카가 받은 마음의 상처까지 사라지지는 않을 테니까. 나기사는 미카가 앞으로 필리우스의 가장 큰 정적이 되리라는 것을 알았지만, 그럼에도 미카를 향해 다정하게 말했다.\n\n\"풍문, 공세, 그런 것에 개의치 않으셔도 됩니다. 미카 씨는 이전에 하시던 그대로, 당당하게 저와 싸우세요. 미카 씨에게는 기죽은 모습은 어울리지 않습니다. ...두 번째 트리니티는, 이렇게 쉽게 스러질 꿈이 아니잖아요?\""
 trinity_events_nagisa.3.a: "가장, 특수한 정적."
 trinity_events_nagisa.4.t: "트리니티 특색 계파 정치"
 trinity_events_nagisa.4.desc: "\"두 번째 트리니티는, 이렇게 쉽게 쓰러질 꿈이 아니잖아?\"\n\n누구에게서 들은 것인지 분명한 미카의 당당한 계파 회의 연설과 함께, 키리후지 나기사 집권 이후 며칠 동안 활동을 중단했던 미카는 다시 정치의 중심에 나섰습니다. 파테르 분파와 나치의 연게를 주장하던 필리우스 분파의 강경파들은 수사 결과가 공유되면서 그 비난의 수위를 낮췄고, 미카는 '스러지지 않은 두 번째 트리니티의 꿈'과 함께 나기사의 가장 강력한 정적으로서 떠올랐습니다. 파테르 분파와 필리우스 분파는 그 수장끼리의 매우 친밀한 우정 관계에도 불구하고, 전통의 수호와 급진적인 국가의 변화라는 목표의 차이로 인해 결국 갈라서게 되었습니다.\n\n물론 파테르 분파는 세이아 저격 사건 직후 선거에서처럼 강력한 힘을 보여주지는 못할 것입니다. 그녀들의 세력은 선거 패배 이후 한 번 힘이 꺾였으며, 파테르와 필리우스 사이에서 간을 보던 여러 임원들도 필리우스로 자리를 옮겼기 때문입니다. 그러나 파테르 분파는 여전히 트리니티의 가장 큰 야당이며, 미소노 미카는 트리니티의 그 어떤 정적들보다도 키리후지 나기사를 가장 잘 아는 정적입니다."
 trinity_events_nagisa.4.a: "그리고, 가장 골치 아픈 정적이기도."
 trinity_events_nagisa.5.t: "남아 있는 분파들"
 trinity_events_nagisa.5.desc: "파테르 분파는 분명한 필리우스의 적으로 남게 되었습니다. 하지만 파테르만이 유일한 대립 세력인 것은 아닙니다. 상투스는 세이아 사후 지도자가 된 카토 나츠키를 여전히 따르는 중립적인 세력과, '사실 세이아 암살 사주를 한 것은 필리우스' 라고 주장하는 음모론적인 소수파 세력으로 분열되어 있는 상태입니다. 이 소수파 세력은 파테르에 충성할 것입니다.\n\n티파티에 참여할 권한이 있으나 구호에 집중하고 있는 요한 분파 역시 의심스러운 상대입니다. 구호기사단을 이끄는 요한 분파는 대전이 이후 키리후지 나기사가 어떻게 정국을 이끌어 갈 것인지 관망하고만 있으며, 적극적인 지지 의사를 보이지 않고 있습니다.\n\n구 유스티나, 현 시스터후드는 그 폐쇄성으로 인해 필리우스를 어떻게 바라보는지 전혀 알 수 없는 상황입니다. 나기사는 자신의 예리한 시선이 계속해서 시스터후드에 집중되는 것을 느낍니다.\n\n마지막으로, 나기사가 일일히 이름을 기억하지 못하는 아주 작은 분파들이 있습니다. 보통 이런 소규모 세력은 가장 강한 자에게 붙기 마련입니다. 파테르가 강성해진다면 미카의 초상화를 누구보다 빨리 거실에 걸어 놓을 자들이죠. 큰 영향을 끼치지는 못할 것이나, 나기사는 그녀들도 마음 속 경고장에 기록합니다."
 trinity_events_nagisa.5.a: "\"제 편은 정말 어디에도 없는 건가요?\""
 trinity_events_nagisa.6.t: "지나치게 어려운 문제"
 trinity_events_nagisa.6.desc: "\"나기사. 나기사는 쉬운 문제를 지나치게 어렵게 생각하는 경향이 있지요. 특히, 트리니티의 호스트가 된 이후 더욱 그렇게 된 것 같습니다.\"\n\"...호스트가 된 후, 라니. 이해가 잘 가지 않는데요. 이번 호스트로 선출된 것은 세이아 씨가 아니셨던가요?\"\n\"아. 그랬나요? 후후. 죄송합니다. 저는 현재와 미래가 다소 뒤섞여 보이는 경향이 있다 보니까요. 네. 제 다음 호스트는 나기사입니다. 이미 어느 정도는 각오하고 계시겠지만요.\"\n\n이런 대화를 나누었던 게 언제적의 일이었더라. 침대에 누워, 나기사는 세이아의 모습을 추억했다. 그 날의 그녀는, 테이블에 우아하게 두 손을 올려놓은 채 나기사를 마주보고 있었다. 이상할 정도로 다정하면서도, 미안한 시선으로 나기사를 바라보면서. 적색의 젤폴리시가 발라진 손톱 끝에 선 오목눈이만이 세이아의 감정을 읽은 것처럼, 그 검은 눈으로 세이아를 안타깝다는 것처럼 올려다 볼 뿐이었다.\n\n그 날, 세이아는 자신의 결말을 예측했던 것이 아니었을까. 너무도 늦게 든 생각이었지만, 그 생각이 맞을 것이다. 세이아는 자신의 죽음과 그 이후 나기사의 호스트 취임까지의 모든 결말을 이미 알고 있었을 것이다. 그래서, 세이아는 나기사에게 자신의 무게를 대신 넘겨주는 것에 미안해하며 이렇게 말했을 것이다.\n\n\"티파티에 들어오기 전, 저는 나기사의 훨씬 밝았던 면을 추억하곤 한답니다. 그 때의 면모가 점점 퇴색되어가는 것 같아... 무척이나 안타까웠지요. 나기사. 미래에 호스트가 된다면, 타인을 의심하기보다는 믿는 사람이 되어 주세요. 그리고, 혼자서 고민하기보다, 가장 소중한 사람들과 함께 어려움을 함께 이겨 나가 주세요.\"\n\"네. 그렇게 하겠습니다. 그 때 제 곁에, 세이아 씨가 계셔 준다면... 정말 큰 도움이 될 것 같습니다.\"\n\n오목눈이는 하늘로 날아올랐다. 그 작은 새가 날아오르며, 나기사의 눈에 그녀의 손톱을 칠한 젤폴리시가 이상할 정도로 더욱 붉게 보였다. 마치, 핏방울이 세이아에게서 테이블 위로 퍼져 나가는 것처럼. 나기사는 추억에서 깨어났다. 그리고, 숨죽여 울며, 깊고 포근한 그 이불 속으로 사라져갔다."
 trinity_events_nagisa.6.a: "세이아 씨가, 곁에 계셔 주었다면..."
 trinity_events_nagisa_6a_tt: "§g키리후지 나기사는 자신의 의심증을 치료해야겠다고 생각합니다. 적어도, 타인을 믿는 연습을 해 볼 필요는 있습니다.§!"
 trinity_events_nagisa.7.t: "시스터후드와의 만남"
 trinity_events_nagisa.7.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n대전이 이전, 나기사가 공적인 이유로 몇 번 사쿠라코를 방문한 적은 있었지만, 그 때에도 홀로 사쿠라코를 티파티 건물의 휴게실로 초대한 적은 없었다. 수행원들과 함께 여럿이서 고성당을 방문한다면 또 모를까. 그렇기에 사쿠라코는 어째서 나기사가 자신과의 독대를 원했는지 알 수 없었다.\n\n\"방문하는 것이 좋을까요?\"\n밀랍을 뜯어 확인한 옛스러운 초대장을 손에 든 채로, 사쿠라코는 히나타를 돌아보았다. 히나타는 잠시 손가락을 꼼지락거리며 그 편지를 가만히 내려다보고만 있었다. 마치 그 편지가 무슨 메시지를 담고 있는 것인지 해석해보기라도 하는 것처럼. 침묵은 그리 오래 가지 않았다. 히나타는 천천히 고개를 들었다.\n\n\"가시는 게 좋다고 생각해요. 저는, 나기사 씨가 뭔가 그... 나쁜 목적으로 부른 건 아닐 거라고 생각해요. 그래도, 티파티고, 호스트시고...\"\n\"...후후. 네. 티파티고, 그 티파티의 호스트니까요. 일단 만나지 않으면 저를 만나고자 하는 연유도 알 수 없겠지요.\"\n\n사쿠라코는 편지를 다시 봉투에 담았다."
 trinity_events_nagisa.7.a: "리버시 게임의 시작."
 trinity_events_nagisa.8.t: "말을 뒤집으며"
 trinity_events_nagisa.8.desc: "트리니티의 수백 년 된 전통 게임. '리버시'에는 흑과 백, 두 개의 말만이 존재한다. 다른 색의 말을 포위하면 자신의 색으로 물들일 수 있다. 그렇게 더 많은 색으로 게임판을 물들이는 참가자가 승리하게 된다. 작은 다과회에 어울리지 않는 리버시 게임판. 사쿠라코는 마치 나기사의 의도를 추측해 보기라도 하려는 듯, 팔짱을 낀 채 잠시 게임판을 내려다보았다. 그리고, 그녀는 흑말을 d3에 놓았다.\n\n\"다과회에서 게임 하는 걸 좋아하시는 편인가요?\"\n\n사쿠라코의 섬뜩한 미소. 백돌을 쥐는 나기사의 손이 멈췄다. '사쿠라코는 원래 표정이 무섭다'는 정보부의 전달에도 불구하고, 나기사는 자신의 날갯죽지를 따라 땀이 흐르는 것을 느꼈다.\n\n\"글쎄요. 오늘 우리들의 만남에 잘 어울리는 게임이라고 생각했습니다.\"\n\nc5. 사쿠라코의 e6. 차례대로 말이 오가는 동안, 나기사는 게임판이 아닌 그녀의 눈을 바라보고 있었다. 유치할 정도로 단순한 은유법이었다. 시스터후드의 검은 제복과 티파티의 백색 제복이, 서로의 색을 물들이려 하고 있지 않은가? 그녀 역시 몇 번 말이 오기가도 전에 나기사의 의중을 이해한 표정을 지었다.\n\n\"먼저 말씀드리자면, 시스터후드에 대해 나기사 씨가 무엇을 상상하셨든, 그건 정답과는 다를 겁니다.\"\n\"다르다고요?\"\n\na1. 몇 번의 말이 오갔을까. 사쿠라코의 흑말이 가장 중요한 지점을 장악했다. 시스터후드의 수녀원장은, 트리니티의 호스트를 향해 말했다.\n\n\"정치에 대한 불간섭. 시스터후드는 그 규율을 바꾼 적이 없습니다. 그것은 대전이 이전이든 이후든 달라지지 않았습니다. ...이 난리통의 트리니티를 장악해서, 저희가 얻을 이익이 뭔가요?\"\n\n그리고, 사쿠라코가 나기사에게 말했다.\n\n\"또, 저는 이렇게 소중한 사람과 만나 최신 게임을 하는 걸 더 좋아하거든요.\"\n\n그렇게 말하는 사쿠라코의 표정은 너무도 평안해 보여, 나기사는 흑색으로 채워진 게임판을 내려다보며 미소가 떠오르는 것을 느낄 수 있었다."
 trinity_events_nagisa.8.a: "다만, 이 게임은 '최신 게임'은 아닙니다."
 trinity_events_nagisa.9.t: "회담의 끝"
 trinity_events_nagisa.9.desc: "\"...그러니까, 시스터후드가 필리우스에 협력하기를 바란다는 말씀이신지요?\"\n\n나기사는 흑백의 리버시 말들을 다시 통에 담아 넣으며, 차분하게 고개를 끄덕였다. 사쿠라코를 만나기로 한 이유는 한 가지. 시스터후드가 음모를 꾸미고 있는지 여부였다. 하지만 그녀들이 그럴 의지가 없다면, 나기사의 생각은 달라진다. 시스터후드. 그녀들과 협력하는 것은 불가능할까.\n\n사쿠라코는 테이블을 손가락으로 톡, 톡, 몇 번이고 두드렸다.\n\n\"저희들의 가장 중요한 덕목은 신앙이며 정치가 아닙니다. 그건 방금 전에도 말씀을... 드렸었죠. 그렇기에 무조건적인 필리우스와의 공조를 약조할 수는 없습니다. 허나.\"\n\n사쿠라코는 나기사를 바라보며 다정한 미소를 지었다.\n\n\"나기사 씨가 올바른 길을 가고자 하실 때, 저희 시스터후드는 '정치 외'에서 도움을 드릴 수는 있습니다. 그리고, 나기사 씨가 우려하는 것. 파테르와의 공조 역시 없을 것입니다.\"\n\"파테르와의 공조도 불간섭 원칙에 어긋나기 때문...이군요?\"\n\"예. 트리니티의 중심이 무너지기라도 하지 않는 한, 저희들은 지금 이 자리에 계속 머물러 있고자 합니다.\"\n\n트리니티의 중심이 무너질 경우. 그런 뒷맛이 남는 단서를 남기기는 했지만, 나기사는 자신의 편집증을 눌러두기로 했다. 적어도 사쿠라코는 지금 당장 정치에 개입하지 않을 것이다. 필리우스를 직접적으로 돕지는 않을 것이지만, 파테르의 손을 쥐어 주지도 않을 것이다. 그 정도면 충분했다. '티파티를 엎으려 하냐'는 의중을 담아 리버시를 가지고 온 의미는 있는 셈이었다.\n\n\"좋습니다. 그렇다면... 앞으로 시스터후드의 많은 도움을 기대하겠습니다. 물론, 정치 이외에서요.\""
 trinity_events_nagisa.9.a: "사쿠라코는 우아하게 자리에서 일어났다."
 trinity_events_nagisa.10.t: "[GetYear]년 트리니티 공의회"
 trinity_events_nagisa.10.desc: "트리니티의 호스트에게 주어지는 명문화된 권한 행사 중 하나는, 트리니티의 공의회를 선언할 수 있는 것이다. 나기사는 대전이라는 미증유의 사건 속에서 트리니티를 보호하기 위하여 모든 분파들이 참여하는 새로운 공의회의 개회를 선언했다. 그것은 대전이 이후 트리니티가 어떤 방향으로 나아가야 할지, 그리고 혼란 속에서 키리후지 나기사라는 호스트가 어떤 식으로 모교를 지켜나가야 할 것인지를 공표하는 행사였다.\n\n\"이 자리에 모여주신 모두에게 감사드립니다. 이번 공의회를 통하여, 저희는 트리니티가 나아가야 할 길을...\"\n\n나기사의 개회식 행사는 트리니티의 각 분파들의 대표들이 모인 티파티 회의실에서 소규모로 이루어졌다. 심지어 필리우스에게 가장 격렬하게 반대하는 파테르조차도 이번 공의회는 보이콧하지 않았다. 이번 회의는 대전이 이후 트리니티의 새로운 헌법을 만드는 정치적으로 중대한 회의였으며, 이 회의에 참석하지 않는 것은 정치적 자살 행위나 다름이 없었으니까."
 trinity_events_nagisa.10.a: "트리니티를 바꿀 것이다."
 trinity_events_nagisa_10sakurako_tt: "§g나기사는 시스터후드의 의중을 의심하고 있었기에, 시스터후드에게 공의회 참석 초대장을 보내지 않았습니다. 개회식에 참석하지 못한 사쿠라코 수녀원장이 공개적으로 불만을 드러냈고, 한 발 늦게 시스터후드의 공의회에 초대받았습니다. 그러나, 그녀들의 마음의 상처는 사라지지 않을 것입니다.§!"
 trinity_events_nagisa.11.t: "호스트의 권한"
 trinity_events_nagisa.11.desc: "제일 먼저 논의된 것은 현재 1년으로 규정된 호스트의 권한을 3년으로 연장하는 것이었다. 파테르 분파의 대표들은 \"1년이면 세상을 바꿀 수 있는 시간\"이라며 노골적인 불만을 드러냈으나, 대전이라는 이전에 없던 사건 속에서 키리후지 나기사가 고작 1년 사이에 국가를 안정시키는 것은 불가능하다는 반대 의견도 같이 나왔다. 결국 파테르가 물러나면서 무제한의 연임이 가능한 호스트의 3년 임기가 공식적으로 보장되었다. 물론 다음 선거에서의 당선이 확정된 것은 아니지만, 3년이라는 시간은 필리우스의 지지를 높일 수 있는 충분한 기간이 될 것이다."
 trinity_events_nagisa.11.a: "합리적인 결정이다."
 trn_nagisa_autocracy_flag: "§Y공의회§!의 결정에서, 권위주의적 호스트 권한이 §R부여§!되었습니다."
 trn_nagisa_democracy_flag: "§Y공의회§!의 결정에서, 호스트 권한이 §G제한§!되었습니다."
 trinity_events_nagisa.12.t: "게헨나 문제"
 trinity_events_nagisa.12.desc: "파테르 분파가 아무리 시끄럽게 목소리를 높이든간에, 키리후지 나기사와 필리우스 분파는 에덴 조약의 추진을 중단할 생각이 없다. 문제는 대전이 이후 게헨나의 정치적 변화다. 에덴 조약은 기존처럼 소라사키 히나 선도부장과 키리후지 나기사 두 사람간에만 이루어져야 할까? 아니면, 판데모니움 소사이어티, 그리고 룩셈부르크 의회와도 논의가 확장되어야만 할까?\n\n물론 키리후지 나기사는 선도부 외의 다른 두 세력에게 에덴 조약을 확장 제안하는 것이 아무 의미가 없다는 것을 알고 있다. 게헨나 정체성이 전혀 없는 룩셈부르크는 에덴 조약에 '무관심'에 가까운 반응을 보일 것이며, 판데모니움 소사이어티는 트리니티의 평화 제안 자체를 우리가 '나약한' 모습을 보이는 것이라 오판할 것이다.\n\n그렇기 때문에 나기사가 에덴 조약을 확장하겠다고 말하는 것은 사실상 국내 정치용일 뿐이다. 파테르 분파에게는 나기사가 결코 이 외교 문제에서 물러날 생각이 없다는 메시지를 주고, 평화주의적인 성향을 가진 시스터후드에게 호감을 얻고자 하는 정치공작.\n\n그러나 평화의 확대 주장은 우리의 군사조직인 정의실현부를 분노하게 할 우려가 있다. 이성적인 소라사키 히나는 그녀들이 용납할 수 있는 한계선이며, '하누마 마코토'와 평화를 논한다는 생각은 우리 군의 사기를 떨어뜨릴 것이다."
 trinity_events_nagisa.12.a: "\"언제나 선도부가 가장 중요한 상대입니다.\""
 trinity_events_nagisa.12.b: "\"허나, 판데모니움에도 손을 내밀 필요는 있습니다.\""
 trinity_events_nagisa.13.t: "신앙"
 trinity_events_nagisa.13.desc: "\"저는 이 땅이 믿고 있는 신앙이 우리 트리니티의 것과 닮았다고 주장하는 것 자체가, 일종의 모욕이라고 생각합니다. 그들의 신앙은 분명히 잘못된 길을...\"\n\n상투스 분파의 대표 임원 한 명의 공개적인 발언 이후, 시스터후드 역시 이에 동조하는 반응을 보였다. 중요 문제는 이 땅의 신앙입니다. 어떤 이들은 현지 신앙이 우리 트리니티의 것과 '호환이 가능한', 경전의 형제자매들이라고 주장한다. 그러나 강경한 이들은 이 땅의 신앙을 이단으로 규정지으며 전부 트리니티의 것으로 개종시켜야 한다고 말한다. 특히 현지 독일인들이 트리니티 신앙을 '불쾌한 이교도'로 간주하는 것은 큰 문제가 되었다.\n\n공의회의 공은 나기사에게로 넘어갔다. 여러 분파들은 키리후지 나기사에게 '트리니티 신앙의 국교화'를 명시하고, 현지 신앙을 강경하게 탄압할 준비를 해야 한다고 의견을 표했다."
 trinity_events_nagisa.13.a: "\"현지 신앙을 탄압할 준비를 합시다.\""
 trinity_events_nagisa.13.b: "\"아직은, 그들도 경전의 형제자매들입니다.\""
 trinity_events_nagisa.14.t: "공의회를 마무리하며"
 trinity_events_nagisa.14.desc: "긴 [GetYear]년 공의회도 어느덧 막바지에 접어들었다. 공의회에서는 국내 정치와 대외 외교, 그리고 트리니티의 중심을 이루는 신앙에 대한 논의가 차례대로 이루어졌다. 성공적으로 마무리 된 이번 공의회는 트리니티의 미래를 결정할 것이다.\n\n물론 모든 것이 결정된 것은 아니었다. 공의회에서 결정되지 못한 사항들, 특히 현지인과의 공존 문제, 구체적인 에덴 조약의 실행 방안 등은 키리후지 나기사가 스스로 정해 나가야만 한다.\n\n나기사는 공의회에서 결정된 사항들을 호스트의 권한으로서 반포했다. 파테르 분파는 아무런 말 없이 회의실을 전부 빠져나갔으며, 남은 분파들은 공의회의 결정 사항을 지지하든, 그렇지 않든, 박수를 보냈다."
 trinity_events_nagisa.14.a: "이 박수가 해피엔딩을 의미한다고 생각하지는 않아."
 trinity_events_nagisa.15.t: "그래서 투표권 언제 줄 건데"
 trinity_events_nagisa.15.desc: "나기사 정권의 가장 큰 핵심가치는 '타인을 믿으려고 노력하는 것'일 것이다. 그것은 게헨나와 같은 오래된 적부터 대전이 이후 독일 정당 등의 새로운 적들까지 포함한다. 나기사는 정의실현부에 독일 내 정당들에 대해 조사하고, 그들 중 트리니티 국가 체제에 협력할 수 있는 정당이 있는지 알아볼 것을 요구했다. 모든 현지 정당들과 싸우기보다는, 우정을 맺을 수 있는 상대와 손을 잡는 게 좋으니까.\n\n\"근데, 없지 않나요? 협력적인 정당.\"\n\n마시로는 회담장을 나오며, 하스미에게 독일 사회민주당 당원들이 건넨 요구사항을 전달했다. 사회민주당, 중앙당, 국가인민당 등 대부분의 정당은 소수의 트리니티계로 이루어진 티파티 과두제에 현지인들을 포함시키거나, 아니면 보통선거권과 바이마르 공화국 의회 체제를 부활시키라 주장했다. 다양한 요구가 있었다. 하지만 그 요구들은 한가지로 요약할 수 있었다. 다수이자 현지인인 우리에게 정치권력을 넘겨주어라.\n\n하스미는 조금 짜증 섞인 눈빛으로 서류를 접어버렸다.\n\n\"나기사 님은 이해력이 넓으시지만, 바보는 아닙니다. 본인의 권력을 왜 이름도 모르는 이들에게 내려놓겠습니까?\"\n\"나기사 님만이 아니라, 티파티를 독일인들에게 개방하라는 것이 문제네요. 그냥, 지방 자치 수준에서 만족할 수 없는 걸까요?\"\n\"저 배우지 못한 이들을 계도하고, 우리 트리니티의 티파티가 얼마나 자애롭게 이 땅을 통치하는지 그들이 이해할 날이 온다면 좋겠군요.\""
 trinity_events_nagisa.15.a: "답답한 현지의 바보들 같으니라고."
 trinity_events_nagisa.16.t: "분파 문제"
 trinity_events_nagisa.16.desc: "나기사는 필리우스 분파의 변화를 느끼고 있었다. 대전이 이전부터 다소 보수적인 분파이기는 했다. 그러나, 대전이 이후 필리우스는 점차 '전통'에 대한 집착을 강화해가고 있었다. 원인은 분명했다. 파테르의 '두 번째 트리니티' 운동이었다. 그녀들은 지금의 트리니티가 낡고 쇠락했다고 주장하며 '새로운' 트리니티를 원한다. 그렇다면 파테르와 맞서 싸우는 필리우스는 더 크게 목청껏 전통의 수호를 외칠 수밖에 없다. 파테르는 호스트 선거에서 패배한 이후에도 필리우스에 반동주의화라는 독을 풀어 놓은 셈이다.\n\n\"야드파운드와 같은 옛 트리니티 도량형을 부활시키자는 청원이, 티파티 회의에서도 몇 건이나 올라왔다...\"\n\n나기사는 홍차를 한 모금 마시며, 자신의 회의실 테이블 위, 회의 속기록을 들여다보았다. 아직은 야드파운드 같은 우스은 수준에 머무르고 있다. 하지만, 이 상황을 계속 방치한다면 트리니티를 더 과거로 '되돌리려는' 움직임이 나타날 것이 분명하다. 나기사는 트리니티를 혁명적으로 바꿀 생각은 없었다. 그녀에게 트리니티는 늘 트리니티였고, 지금 이대로도 무척이나 아름다운, 잘 가꾸어진 분재 같은 학원이었으니까.\n\n\"그래도, 필리우스 내부의 움직임을 제어할 필요는 있겠지요.\"\n\n나기사는 최근 업무 때문에 몇 차례 빠졌던 회합에 다시 참여하기로 결정했다. 이 보수의 흐름을 조금은 바꾸어 놓을 수 있는 사람이 있다면, 키리후지 나기사 뿐이었으니까."
 trinity_events_nagisa.16.a: "야드파운드라, 그다지 내키지는 않네요."
 trinity_events_nagisa.17.t: "정의로운 전쟁을 위하여"
 trinity_events_nagisa.17.desc: "[FROM.GetNameDef] 측은 우리와 [GEM.GetNameDef] 측 사이의 전쟁을 지원하기 위하여, 군사자문단을 보냈습니다. 이들은 [ROOT.GetLeader] 선도부장을 돕기 위하여 도착하였다고 말하며, [FROM.GetName] 측과 [ROOT.GetName] 측의 우정을 유지하기 위하여 최선을 다하겠다고 밝혔습니다. 자문단은 소규모의 무기들을 함께 가지고 도착했으며, 우리는 트리니티와 협력해 [GEM.GetLeader]의 사악한 전쟁 기계들을 파괴할 것입니다."
 trinity_events_nagisa.17.a: "나쁘지 않아."
 trinity_events_nagisa.18.t: "나기사-아코 회담의 준비"
 trinity_events_nagisa.18.desc: "수행원은 꾸벅 고개를 숙이고 비단 퍼프를 손에 쥐었다. 원래부터 눈송이처럼 창백하던 나기사의 피부에 수행원이 파우더를 바르기 시작했다. 수행원의 손끝이 움직이며 키리후지 나기사라는 이름의 석고상을 빚어내는 사이, 호스트는 다른 생각을 하고 있었다.\n\n트리니티의 많은 이들은 여전히 에덴 조약에 대한 냉소적인 시선을 가지고 있었다. 하지만 역으로 '게헨나'이기에, 오히려 가장 믿을 수 있는 것이 아닌가. 나기사는 대전이 이전 총학생회장의 주선으로 게헨나의 대표를 만났을 때를 떠올렸다.\n\n범죄자들을 때려 잡는 삶만을 살아온 소라사키 히나가, 처음으로 국제 외교라는 것을 위해 현장에 나오느라 잘 하지 않는 화장을 하다 알코올 중독자처럼 두 볼이 발갛게 달아오르도록 블러셔를 발라온 모습, 자신은 여유롭게 넘겼지만, 총학생회장은 그 모습을 보며 얼마나 웃어서 분위기를 망가뜨렸던가.\n\n게헨나는 '정치'라면 몰라도 '정치질'은 알지 못하는 이들이었다. 거짓으로 자신들을 꾸미기보다는 온천을 터트리는 한이 있어도 자신이 하고 싶은 메시지를 직설적으로 던지고, 자신을 초콜릿 상자처럼 꾸미는 법조차 모르는 사람들의 땅. 그래서, 대전이 이후 키리후지 나기사는 점점 게헨나가 마음에 들어 가고 있었다. 적어도 세이아의 죽음까지도 이용하던 다른 파벌의 정치인들과, 그 선도부장은 달랐으니까.\n\n모든 외출 준비가 끝난 뒤, 나기사는 자리에서 일어났다. 타인을 믿는다. 적어도 그러려고 노력은 한다. 대전이 이후 점점 어려워져가는 이 신념을 지키기 위해, 어쩌면 트리니티 안이 아닌 바깥을 돌아보아야 할 필요가 있을지도."
 trinity_events_nagisa.18.a: "협상이 다가온다."
 trinity_events_nagisa.19.t: "나기사-아코 회담"
 trinity_events_nagisa.19.desc: "대전이 이전처럼 소라사키 히나와 직접 마주 앉을 수 있었다면 더 기뻤겠지만, 아마우 아코가 직접 에덴까지 찾아온 것만으로도 큰 외교적 성과였다. 소라사키 히나와 아마우 아코는 분명 다른 성격의 관료였지만, 아코 쪽이 인간적으로는 더욱 '재미있었다'.\n\n\"그러니까, 히나 부장님이 개머리판으로 딱! 하니까, 헬멧단 조무래기 놈의 머리가 깡-! 하고...\"\n\n미카가 여기 있었다면 '아이스브레이킹' 이라고 했겠지. 아코는 아이스브레이킹에는 굉장한 재능을 가지고 있었다. 정말, 케이크를 앞에 늘어놓고 떠드는 미카를 떠올리게 하는 소녀였다. 파테르 분파만이 아니라, 필리우스나 상투스 분파의 어느 임원들도 나기사 앞에서 이렇게 떠들 수는 없었다. 트리니티의 사람이 아니기 때문에, 이 학원의 예의와 질서에서 벗어나 자유롭게 말 할 수 있는 거겠지.\n\n나기사가 직접 이야기 주제를 본론으로 돌리지 않으면, 언제까지라도 아이스브레이킹에서 벗어나지 못할 것 같다. 그런 점까지도 아코는 미카와 닮아 있었다. 나기사는 홍차를 한 모금 마시며, 추억이 깃든 미소를 지었다. \"히나 씨에 대한 이야기는 감사했습니다만, 오늘은 두 학원간의 공동 치안 관리에 대한 논의를 시작하고 싶군요.\"\n\"아앗, 그렇죠. 공동 치안... 후후. 저는 전혀 잊어버리지 않고 있었답니다. 그저 복잡한 회담 전에 목을 좀 푸느라고...\"\n\n그 아무렇지 않아 하는 태도까지도 재미있어서, 나기사는 웃음을 터트리고 말았다." # 히나가 선도부장인 상태
 trinity_events_nagisa.19.desc.alt: "대전이 이전처럼 소라사키 히나와 직접 마주 앉을 수 있었다면 더 기뻤겠지만, 소라사키 히나는 더 이상 게헨나 선도부의 선도부장이 아니었다. 소라사키 히나와 아마우 아코는 분명 다른 성격의 관료였지만, 아코 쪽이 인간적으로는 더욱 '재미있었다'.\n\n\"그러니까, 이오리가 군홧발로 빡! 하니까, 헬멧단 조무래기 놈이 바닥을 데구르르 구르면서...\"\n\n미카가 여기 있었다면 '아이스브레이킹' 이라고 했겠지. 아코는 아이스브레이킹에는 굉장한 재능을 가지고 있었다. 정말, 케이크를 앞에 늘어놓고 떠드는 미카를 떠올리게 하는 소녀였다. 파테르 분파만이 아니라, 필리우스나 상투스 분파의 어느 임원들도 나기사 앞에서 이렇게 떠들 수는 없었다. 트리니티의 사람이 아니기 때문에, 이 학원의 예의와 질서에서 벗어나 자유롭게 말 할 수 있는 거겠지.\n\n나기사가 직접 이야기 주제를 본론으로 돌리지 않으면, 언제까지라도 아이스브레이킹에서 벗어나지 못할 것 같다. 그런 점까지도 아코는 미카와 닮아 있었다. 나기사는 홍차를 한 모금 마시며, 추억이 깃든 미소를 지었다. \"선도부에 대한 이야기는 감사했습니다만, 오늘은 두 학원간의 공동 치안 관리에 대한 논의를 시작하고 싶군요.\"\n\"아앗, 그렇죠. 공동 치안... 후후. 저는 전혀 잊어버리지 않고 있었답니다. 그저 복잡한 회담 전에 목을 좀 푸느라고...\"\n\n그 아무렇지 않아 하는 태도까지도 재미있어서, 나기사는 웃음을 터트리고 말았다." # 아코가 선도부장인 상태
 trinity_events_nagisa.19.a: "회담은 잘 풀렸다."
 trinity_events_nagisa.20.t: "아코-나기사 회담"
 trinity_events_nagisa.20.desc: "대전이 이전처럼 키리후지 나기사와 함께 마주 앉을 수 있었다면 더 좋았겠지만, 대전이 이후 위험해진 치안 문제, 그리고 판데모니움 소사이어티에 대한 견제 등의 문제로 히나는 에덴을 직접 방문할 수 없었다. 키리후지 나기사는 선도부에 '에덴 조약 재추진을 위해, 우선 두 학원의 공동 치안 조직을 만들자'는 제안을 보냈다. 그 제안에 대한 전권을 지고 떠난 것이 아마우 아코였다.\n\n'회담은 잘 풀렸습니다. 두 학원 공동의 이익을 보장하는 협상이 완료되었습니다.'\n\n아코는 그렇게 답장했다. 실제로 나쁘지 않은 내용이었다. 동시에, 소라사키 히나는 아마우 아코가 보낸 외교 문서를 통해 키리후지 나기사의 의도를 읽어낼 수 있었다. '판데모니움 소사이어티를 철저히 배제한 채, 선도부와 트리니티 두 조직만이 공동으로 연합전선을 펼친다.'\n\n나기사의 문서에서, 판데모니움 소사이어티는 정의실현부가 치안을 지켜주는 구역에 포함되지 않았다. 선도부가 판데모니움 소사이어티 지역에서도 치안을 유지하는 것과는 달랐다. 마치, 게헨나의 영역은 히나의 직할령만 해당된다는 것처럼.\n\n어쩌면 키리후지 나기사는 게헨나를 둘로 분할해, 차례대로 침공해 점령하려는 것은 아닐까? 대전이 이전부터 보여 왔던 나기사의 선의를 믿고 싶다는 마음, 그리고 대전이 이후 늘어난 소라사키 히나의 불안이 섞여... 히나는 그 날 밤이 끝날 때까지 잠들지 못했다." # 히나가 선도부장인 상태
 trinity_events_nagisa.20.desc.alt: "대전이 이전에는 키리후지 나기사와 소라사키 히나가 함께 ETO와 같은 중요한 사항들을 논의했었다. 이제는 상황이 변화하기는 했지만. 키리후지 나기사는 선도부에 '에덴 조약 재추진을 위해, 우선 두 학원의 공동 치안 조직을 만들자'는 제안을 보냈다. 그 제안에 대한 전권을 지고 떠난 것이 아마우 아코였다.\n\n회의 이후, 선도부 수뇌부는 외교 문서를 통해 키리후지 나기사의 의도를 읽어낼 수 있었다. '판데모니움 소사이어티를 철저히 배제한 채, 선도부와 트리니티 두 조직만이 공동으로 연합전선을 펼친다.'\n\n나기사의 문서에서, 판데모니움 소사이어티는 정의실현부가 치안을 지켜주는 구역에 포함되지 않았다. 선도부가 판데모니움 소사이어티 지역에서도 치안을 유지하는 것과는 달랐다. 마치, 게헨나의 영역은 [ROOT.GetLeader] 측의 직할령만 해당된다는 것처럼.\n\n어쩌면 키리후지 나기사는 게헨나를 둘로 분할해, 차례대로 침공해 점령하려는 것은 아닐까? 키리후지 나기사의 선의를 믿을 수 있는 것인지에 대해, [ROOT.GetName] 내부에서 격렬한 논쟁이 일어났다." # 그 이외
 trinity_events_nagisa.20.a: "우리는 정말 에덴 조약을 맺어야 하는 걸까?"
 trinity_events_nagisa.21.t: "오후의 티타임"
 trinity_events_nagisa.21.desc: "나기사는 이러한 상황을 썩 반기지 않았다. 사태 이후 발생한 트리니티의 위기는 좀처럼 진정될 기미가 보이지 않았다. 트리니티의 학생들은 사태의 영향을 직접적으로 받았다. 대부분의 성향이 급진적으로 변화했고, 티파티를 아무 일도 하지 않는 자들로 경멸하며 극단으로 치닫는 이들이 나타났다. 그들은 파테르 분파처럼 폭력적인 사상을 숭배하며 그 대의에 참여하려 했다.\n\n특히 파테르 분파와 그 소수 분파들이 문제였다. 파테르 분파는 이전부터 주장해온 폭력적인 사상을 더욱 노골적으로 내세우기 시작했다. 미카는 딱히 그들을 제지하지 않았다. 오히려 그들의 사상에 동참하고 있는지도 모른다. 이대로 간다면 추후에 파테르 분파가 상투스 분파의 호스트 자리를 위협하고 정권을 차지해 트리니티의 모든 것을 무너뜨릴 것이다. 그리고 그 중심에는... 아니. 아니야. 그렇게 둬서는 안 돼.\n\n오후에 마시는 차 한 잔은 특별했다. 여유 있게 마시는 차는 쌓인 피로를 풀어주었다. 나기사는 찻잔을 들고 창밖을 바라보며 생각에 잠겼다. 다음 호스트는 당연하게도 상투스 분파의 세이아다. 이는 불변이다. 유리조노 세이아는 꽤나 믿을 만하다. 어느 정도 예지 능력을 가진 그녀라면 트리니티의 모든 문제를 해결할 수 있을 것이다. 그녀의 호스트 임기 내에 해결하지 못한다면 다음 호스트는 필리우스 분파에서 맡게 되니, 길더라도 이 위기는 반드시 해결할 수 있다. 나기사는 그렇게 믿고 싶었다. 아니, 그렇게 되어야만 했다."
 trinity_events_nagisa.21.a: "그리고 사건은 예상하지 못한 곳에서 터지기 마련이다."
 trinity_events_nagisa.22.t: "신앙의 힘"
 trinity_events_nagisa.22.desc.hardline: "\"우리는 지난 공의회에서 논의된 바와 같이, 이 땅의 신앙을 퇴폐적이고 극복, 개종해야 할 적으로서 간주합니다. 시스터후드는 최대한의 노력을 통해...\"\n\n시스터후드 수녀원장인 사쿠라코가 고성당에서 펼친 설교와 함께, 티파티와 시스터후드의 공조로 이 땅의 원주민들을 트리니티 신앙으로 개종시키기 위한 긴 여정이 시작되었다. 모든 원주민들을 한 세대 안에 개종시키는 것은 어려울 것이다. 하지만 단기적으로는 중요 도시의 중산층들을 개종시키는 것을 목표로 할 것이다. 이들은 원래부터 신을 진심으로 신실하게 믿지 않으며, 자신들의 이익을 위해 손쉽게 개종을 선택할 것이니까.\n\n원래 정치적 중립을 유지하던 시스터후드 역시, 이번 개종 계획을 티파티와 함께 진행하면서 깊은 협력 관계를 갖게 되었다. 시스터후드는 정치에 깊이 개입하지는 않겠지만, 개종 작업을 도와준 필리우스를 다른 분파보다 우선해서 도울 것이다."
 trinity_events_nagisa.22.desc.moderate: "\"우리는 지난 공의회에서 논의된 바와 같이, 이 땅의 신앙 역시 저희들의 신앙과 같다고 간주하며, 그저 걸어가는 길이 다를 뿐이라고...\"\n\n시스터후드 수녀원장인 사쿠라코가 고성당에서 펼친 설교와 함께, 티파티와 시스터후드의 공조로 이 땅의 기독교도들에게 카톨릭과 프로테스탄트 두 신앙이 전부 트리니티 신앙과 동일한, 다른 분파일 뿐이라는 프로파간다를 전파하는 계획이 실시되었다. 물론 쉬운 과정은 아니다. 특히 트리니티의 여성 사제 제도는 바티칸도, 프로테스탄트들도 용납할 수 없는 급진적인 교리였으니까. 그렇기에 단기적으로는 중요 도시의 중산층들을 설득하는 것을 목표로 할 것이다. 이들은 원래부터 신을 진심으로 신실하게 믿지 않으며, 자신들의 이익을 위해 손쉽게 개종을 선택할 것이니까.\n\n원래 정치적 중립을 유지하던 시스터후드 역시, 이번 개종 계획을 티파티와 함께 진행하면서 깊은 협력 관계를 갖게 되었다. 시스터후드는 정치에 깊이 개입하지는 않겠지만, 선전 작업을 도와준 필리우스를 다른 분파보다 우선해서 도울 것이다."
 trinity_events_nagisa.22.a: "새로운 신앙, 새로운 질서."
 trinity_events_nagisa.23.t: "사자가 되어주세요"
 trinity_events_nagisa.23.desc: "나기사는 천천히 하얀 하마 인형을 두 손으로 잡아 들어올렸다. 티파티 정원에 내리쬐는 따사로운 햇살 아래, 안경 쓴 페페론치노 님의 인형은 무척이나 포근하게 자신을 내려다보고 있었다. 히후미가 알려 준 이 페낭시에 님. 대중들이 어째서 이런 캐릭터를 좋아하는 것인지 아직도 잘 이해가 되지 않을 때도 많았지만, 계속 보고 있자니 귀엽다는 생각도 들기 시작했다. 나기사는 페로페로 님 인형을 테이블 가장자리에 살짝 내려놓았다.\n\n나기사는 테이블 너머, 홍차를 홀짝이는 히후미에게 말했다. \"대전이 이후, 독일 대중 문화를 접하며 개인적으로 많은 불편함을 느꼈습니다. 남성적이고, 티파티의 권위를 무시하며, 폭력적으로까지 느껴지기도 했죠. 히후미 씨가 사랑하는 페로로쉐 님 같은 사람을 안심시키는 따스한 면이, 그들에게는 없습니다.\"\n\"아하하... 그런가요? 저는, 이 땅의 문화에도 좋은 면이 있을 지 모른다고 생각해요.\"\n\"네. 좋은 면이 있을 수도 있겠죠. 하지만 나쁜 면이 두드러지는 것도 사실입니다. ...그래서 오늘 제가 히후미 씨를 만나고 싶었던 겁니다.\"\n\n나기사는 페페로니 님을 살짝 옆으로 치워, 그대로 히후미와 눈을 마주쳤다. \"히후미 씨가, 키보토스의 문화를 이 땅에 전파하는 '사자'가 되어주셨으면 합니다. 이 땅의 폭력적인 문화, 여성을 멸시하는 전통. 그것을 제가 강제적으로, 힘으로서 지우는 것은 불가합니다. 허나, 트리니티의 가장 평범한 사람이시자, 많은 분들에게 신뢰를 얻고 계신 히후미 씨라면, 히후미 씨의 다정한 마음을 이 땅에 알리고, 독일이 가진 군국주의적인 문화를 누그러뜨릴 수 있으리라고 생각합니다.\"\n\n나기사는 히후미를 향해 희미하게 미소지었다. 나기사는 독일 문화를 좋아하지는 않는다. 하지만 그녀가 그 문화를 말살할 수 있으리라고 생각하지도 않는다. 나기사는 그저, 자신이 신뢰하는 소녀인 히후미가 홍보대사로서 키보토스의 멋진 점을 이 땅의 사람들에게 알리고, 홍보해, 그들이 트리니티에 가진 적의를 누그러뜨리고 폭력적인 본성을 지우게 하고 싶을 뿐이었다. 그것이 가능할까? 히후미라면 가능할지도 몰랐다."
 trinity_events_nagisa.23.a: "\"이 일은, 페로시키 님의 아름다움을 전하는 일이기도 하답니다.\""
 trinity_events_nagisa.24.t: "게헨나 중앙구의 승전 결산"
 trinity_events_nagisa.24.desc: "에덴 결전 승전 이후, 패자들에 대한 처분은 트리니티 종합학원, 그리고 키리후지 나기사 개인의 보수적인 성향으로 인하여 극도로 '중세적'인 방식으로 이루어졌다.\n\n필리우스의 관점에서 볼 때, 고귀한 푸른 피와 푸른 피가 맞붙은 전쟁에서 죽은 '붉은 피' 따위를 위하여 '재판'과 같은 모욕을 벌이는 것은 트리니티의 고결한 신분제 질서를 모욕하는 논의로 받아들여졌다. 사실 현지인들에게도 납득되지 않는 논리는 아니었다. 지난 대전쟁에서도, 어떤 연합국도 빌헬름 2세나 카를 1세를 재판정에 올리자고 주장하지는 않았으니까.\n\n하누마 마코토를 비롯한 판데모니움 소사이어티 의원 전원에게 트리니티는 '석방을 위한 몸값'을 요구했다. 이는 중세 전쟁에서 귀족 포로를 대상으로 한 '승자의 권리'를 그대로 요구한 것이기도 했다. 요구된 몸값은 상당했으며, 특히 게헨나의 상징인 탄가 이부키에게는 가장 높은 액수의 석방금이 제시되었다.\n\n놀라운 것은 하누마 마코토가 망설임 없이 모든 의원들의 석방금을 지불하면서, 전재산을 탕진했다는 것이다. \"이딴 돈 때문에 한 사람이라도 감옥을 나가지 못한다면, 그것이야말로 나 자신의 굴욕\"이라는 짧은 논평은 만마전 의원들의 사랑을 받아 온, 마코토 나름대로의 카리스마를 보여주는 상징적 발언이 되었다.\n\n하누마 마코토는 원래 게헨나에서 가장 거대한 출판사 및 언론사 지분을 보유하고 있었으나, 이번 석방금 지불을 위해 전부 매각해야 했다. 재정적 어려움에 처한 마코토는 당분간 중앙구 자택에서 머무르며 트리니티를 조롱하기 위한 에덴 결전 회고록 집필에 집중하기로 했다. 문학적 가치와는 별개로, 출간된다면 에덴 결전을 게헨나 측의 관점으로 살필 수 있으리라는 점에서 많은 군사학자들이 관심을 가지고 있다."
 trinity_events_nagisa.24.a: "마코토의 문장력은 나쁘지 않은 편이다. 아마 대필작가가 있겠지만."
 trinity_events_nagisa.25.t: "믿음은 굳건하여라"
 trinity_events_nagisa.25.desc.hardline: "[ROOT.GetLeader] 호스트 님에게\n\n시스터후드 수녀원장인 우타즈미 사쿠라코입니다. 존경하는 티파티와 호스트 님의 도움으로 인하여, 지난 2년간의 개종 작업은 순조롭게 진행되었습니다. 경전의 가르침에 따라 많은 현지인들이 트리니티의 경건한 가르침을 따르게 되었음에 감사드립니다.\n\n이번 개종 작업을 통해 모든 현지인들이 개종한 것은 아닙니다. 시스터후드는 독일 인구의 10퍼센트 미만이 새로운 신앙을 따르는 것으로 파악했습니다. 하지만 대전이 이후 우리 트리니티가 이 땅에 머무른 시간이 짧다는 것을 생각해 본다면, 10퍼센트는 영적인 기적이라고밖에 할 수 없는 개종 속도입니다.\n\n특히 중요 도시의 중산층들이 우리 트리니티와의 교류를 위하여 개종을 서두르고 있습니다. 저로서는 그들이 진지한 종교적 열성을 가지고 있지 않다는 점이 우려됩니다만, 시스터후드는 그들의 이해타산을 위한 개종을 진지한 영적 개종으로 이끌어낼 수 있으리라고 믿습니다.\n\n티파티의 깊은 관심에 감사드리며,\n\n- Sakurako Utazumi"
 trinity_events_nagisa.25.desc.moderate: "[ROOT.GetLeader] 호스트 님에게\n\n시스터후드 수녀원장인 우타즈미 사쿠라코입니다. 존경하는 티파티와 호스트 님의 도움으로 인하여, 지난 2년간의 현지 신앙과의 융화 작업은 순조롭게 진행되었습니다. 경전의 가르침에 따라 많은 현지인들이 트리니티의 경건한 가르침을 따르게 되었음에 감사드립니다.\n\n프로테스탄트, 카톨릭 신앙과 트리니티 신앙이 동일하다는 시스터후드의 가르침은 특히 현지 여성들에게 큰 반향을 주고 있습니다. 시스터후드는 지난 2년간 독일 인구의 5퍼센트가 개종한 것으로 파악했습니다만, 그 개종 인구의 70퍼센트는 여성이었습니다. 여성 사제를 허가하고 더 많은 여성 권리를 주장한다는 점에서 독일 여성들은 우리들의 가르침에 더 큰 호감을 느끼는 것 같습니다.\n\n다만 현지의 완고한 보수주의자들은 여전히 신학적, 또는 사회적 문제를 들어 트리니티 신앙과 현지 신앙의 일치를 거부하고 있습니다. 바티칸과의 협상도 지지부진합니다. 교황은 시스터후드가 아닌 로마가 사제 서임권을 가져야 한다고 주장하며, 시스터후드에게 적법한 고해성사를 받을 권리가 없다고 인정해야지만 우리 신앙이 이단이 아니라고 선포하겠다고 말했습니다. 바티칸과의 의견을 좁히는 것은 쉽지 않으나, 히나타 자매님이 최대한 노력하고 있으니 몇 년 안에 좋은 결과가 있으리라고 생각합니다.\n\n티파티의 깊은 관심에 감사드리며,\n\n- Sakurako Utazumi"
 trinity_events_nagisa.25.a: "우리의 질서가 이 땅에 바로 섰다."
 trinity_events_nagisa.26.t: "게헨나 학생회장 키리후지 나기사"
 trinity_events_nagisa.26.desc: "\"솔직하게 말씀드리자면... 안 입으면 안 되겠습니까?\" \"스스로 불러온 재앙이십니다. 그냥 받아들이시죠.\"\n\n조금 놀리는 것 같은 말투로 말하며, 미네는 나기사에게 검은색 제복을 내밀었다. 나기사의 신체 라인에 맞게 새롭게 재단한, 하누마 마코토의 바로 그 의상이다. 그 옷이 아니고서야 어떻게 '게헨나 학생회장' 제복이라고 할 수 있겠는가. 나기사는 어쩔 수 없다는 듯 모자를 받아 머리에 꾹 눌러썼다. 원래 뿔이 있을 것을 가정하고 만들어진 탓인지, 모자가 그녀에게는 조금 크다. 나기사는 남은 제복을 그대로 자신의 수행원들에게 넘겨주었다. 수행원들이 자연스럽게 나기사에게 새 제복을 갈아 입히는 동안, 나기사는 한 순간 '게헨나 학생회장 겸직' 결정을 후회했다. 만마전 해체 이후 만들어진 게헨나 학생회 건물에 나기사의 사진을 걸어 놓아야 하기에 필요한 한 장. 그리고 신문에 실을 취임 기사에 필요한 한 장.\n\n나기사는 파테르와 달리 게헨나에 대한 적의는 별반 없었다. 그렇기에 '게헨나의 제복이기에' 싫은 것은 아니었다. 하지만, 나기사가 보기에 이 제복은... 미니스커트가 터무니 없을 정도로 짧았다.  하누마 마코토는 이런 품위 없을 정도로 짧은 스커트를 입고 거리를 돌아다녔다는 말인가? 거의 치마를 안 입은 거 같잖아. 하나님 맙소사. 신께서 그 파렴치한 영혼의 행방을 용서하시기를. 제복을 갈아 입은 나기사는 게헨나 로고가 새겨진 모자를 살짝 고쳐 쓰며, 여전히 싱글벙글 입가에서 미소가 떠나지 않는 미네를 마주보았다. 뒤늦게 '그냥 사진 합성하면 되는 것 아니었습니까?' 라는 말이 떠올랐지만. 이미 늦었다."
 trinity_events_nagisa.26.a: "\"...빨리 찍고 벗읍시다. 아니, 사진관에서 바로 벗는다는 건 아니고요...\""
 trinity_events_nagisa.27.t: "게헨나 학생회장 시로미 이오리"
 trinity_events_nagisa.27.desc: "'쿠로다테 하루나가 안 터트린 진짜! 야키소바 맛집'\n\n참으로 게헨나다운 선전 포스터가 붙어 있는 게헨나 남구의 식당. 나기사는 시끄러운 대화 소리가 들리는 좁고 어두운 야키소바 식당에서, 따로 가져온 순백색 냅킨을 테이블에 내려놓았다.\n\n\"이오리 씨, 이 식당의 오르되브르는 무엇이 나오나요?\" \"오르...뭐?\" \"...애피타이저 말씀입니다. 그리고 이 식당의 셰프가 추천하는 칵테일이 있을까요?\" 이오리는 황당하다는 표정을 지었다. \"셰프? 그런 거 없는데? 그냥 야키소바랑 오코노미야키, 거기에 오렌지 주스 두 잔. 끝.\"\n\n나기사는 이오리의 말을 이해해 보려는 것처럼 몇 초 정도 고민해 보았다. 전채 요리와 본 요리의 구분도, 전문적인 셰프라는 개념도 존재하지 않는다. 게다가 식당에서 칵테일조차 제공하지 못한다니. 게헨나와 트리니티의 오랜 대립에 대해서는 이해하고 있었지만, 게헨나는 트리니티와의 결전을 위해 이렇게 굶주리고 빈곤한 삶을 영유하면서 전쟁에 모든 국력을 집중하고 있었던 모양이다. 나기사는 깊은 안타까움과 동정심을 숨긴 채, 이오리를 향해 마치 성녀와 같은 자애로운 미소를 지어 보였다. 이오리는 도무지 이해할 수 없다는 표정을 잠시 지었지만, 종업원이 야키소바를 내려놓자 금방 관심은 그쪽으로 향했다.\n\n여유롭고 평화로운 식사 속에서, 나기사는 이오리를 향해 말했다. \"게헨나에 요구하고 싶은 사항은 두 가지 뿐입니다. 첫 번째, 완벽한 치안 유지입니다.\" \"학생회장 시킨다면서. 그러면 당연히 완벽하게 해 내야지.\"\n\"이해해 주셔서 감사합니다. 그리고 두 번째는...\" 나기사는 오렌지 주스 잔을 살짝 들어, 한 모금을 마셨다. 진짜 오렌지가 들어가지는 않은 모양이다. 게헨나인들은 오렌지를 사 마실 여유조차 없었던 것일까. \"...트리니티가 게헨나 학생회에 여러 '공문'을 전달할 수 있습니다. 거부권이 있기는 하지만, 되도록 협조해 주시기 바랍니다.\" \"거부? 뭐, 트리니티가 이상한 걸 보내지는 않겠지.\"\n\n이오리는 피식 웃었다. \"이제 같은 학원 파트너잖아? 뭐를 보내든 그냥 도장만 찍을 테니까. 나기사는 다른 사람들을 행복하게 하는 데 집중해.\"\n\n다른 사람들을 행복하게 한다. 그게 이끄는 자의 역할이겠지. 나기사는 고개를 끄덕였다."
 trinity_events_nagisa.27.a: "나기사는 협력적인 회장을 찾았다."
 trinity_events_nagisa.28.t: "게헨나 학생회장 히무로 세나"
 trinity_events_nagisa.28.desc: "에덴 결전 이후, 나기사는 세나와 미네가 순식간에 친구처럼 가까워졌다는 걸 알게 되었다. 같은 의료 담당자이기 때문일수도 있고, 서로가 가진 신념의 동일한 점을 찾아냈기 때문일 수도 있었다. 그렇기 때문에 세나에게 '트리니티가 게헨나에 요구하는 두 가지'를 전달하는 역할은 미네에게 맡겼다. 두 가지. 첫 번째는 통합 이후 게헨나의 치안을 완벽하게 유지해, 트리니티에 온천 테러리스트들이 기어들어오지 못하게 할 것. 두 번째는 트리니티가 보내는 공문에는 형식적 거부권이 있으나, 게헨나 학생회는 모두 수용하도록 할 것.\n\n미네와 마주 앉은 세나는 티백 홍차를 한 모금 홀짝이며 희미하게 웃었다. \"어렵지 않네요. 어차피, 그 요구 조항들은 시체들의 구호를 위해 따라야 하는 합리적인 요구들이기도 하니까요.\"\n\n미네는 여유로운 태도의 새로운 게헨나 학생회장, 세나를 마주보며 물었다. \"트리니티의 꼭두각시 회장이 되어야 한다는 의미도 담겨 있습니다. 괜찮으십니까?\"\n\"저는 정치인이 아닙니다. 의사죠. 그건 미네 씨도 같지 않으신가요? ...저는 미네 씨의 마음가짐을 따르려 하는 것 뿐입니다. 구호를 위해 그 병의 근원을 찾아내는 것. 게헨나 병의 근원은 지긋지긋한 혼돈입니다. ...그 혼돈을 없애고, 다쳐서 실려 오는 이들이 없는 세상이 온다면, 저는 그 미래를 위해 무엇이라도 할 수 있습니다.\"\n\n그렇게 말하면서, 세나는 미네를 향한 다정한 미소를 지어 보였다."
 trinity_events_nagisa.28.a: "나기사는 협력적인 회장을 찾았다."
 trinity_events_nagisa.29.t: "나기사-하스미 회동"
 trinity_events_nagisa.29.desc: "\"정의실현부 부장이신 하스미 씨와 이렇게 티 타임을 갖게 되어 영광입니다.\" \"'부부장'입니다. 부장은 츠루기 씨이시기 때문에...\"\n\n나기사는 보기 드문 자신의 직책 호칭 실수에 살짝 뺨을 붉혔다. 하지만 어쩔 수 없는 법 아닌가. 나기사는 정의실현부에 용무가 있어서 방문할 때마다 하스미와만 대화를 나누었다. 츠루기는 보통 나기사를 발견하면 고개를 꺾으며 '크헤헤'나 '키히히' 따위의 말을 하고 사라지는 게 보통이었으니까. 말을 하지 못하는 건 아니라고는 하지만, 적어도 나기사 앞에서는 말 하는 법을 본 적이 없었다.\n\n하스미는 밀크티를 한 모금 마신 뒤, 서론 없이 곧장 본론으로 들어갔다. \"우리 정의실현부는 지속적인 탈나치 운동을 벌이고 있습니다만, 많은 독일 나치 인사들이 트리니티 땅 바깥에서 활동을 하고 있는 상태라 다소 어려움이 있습니다. SS를 격파하는 것은 어렵지 않으나, 나치당의 당 인사들은 대부분 게헨나에 있습니다. 구체적으로 설명드리죠. 알베르트 슈페어를 중심으로 한 당 정치인들은 게헨나 중앙구에 있습니다. NSDAP를 창당한 안톤 드렉슬러는 뮌헨과 중앙구를 오가며 생활하는 중입니다. 뮌헨에는 히틀러의 연인인 에바 브라운도 거주하고 있고요.\"\n\"즉, 우리가 아무리 노력하더라도 '뱀의 머리'는 자를 수 없다는 말씀이시군요?\"\n\"그것이 저로서는 가장 아쉬운 점입니다만, 괜찮습니다. 몸통이라도 잘라낸다면 뱀은 죽게 될 겁니다. 그저, 머리를 자르는 것보다 조금 더 시간이 걸릴 뿐이죠. 호스트 님 께서는 그저, 인내심을 가지고 기다려 주시면 됩니다.\""
 trinity_events_nagisa.29.a: "나기사는 하스미를 믿고, 수사를 맡기기로 했다."
 trinity_events_nagisa.30.t: "에덴에서의 파티"
 trinity_events_nagisa.30.desc.hina: "게헨나 선도부와의 통합이 우리에게 있어서 가장 중요했던 이유는, 필리우스 분파의 양적, 질적 규모를 키울 기회였다는 점이다. 시로미 이오리를 비롯한 실행부는 전부 게헨나에 남았다. 의료부 역시 게헨나를 떠날 생각은 없었다. 하지만 기획부와 정보부 간부들이 거처를 에덴으로 옮기면서, 그들은 게헨나가 아닌 트리니티 질서 아래에서 새로운 활동을 시작하기로 했다. 소라사키 히나와 아마우 아코는 완전히 소속을 트리니티로 옮기고, 트리니티 티파티의 필리우스 분파 소속으로 활동하게 되었다. 파테르는 이에 격노했지만, 격노하라고 한 행동이다. 애초에 그녀들이 정치를 계속하고자 했을 때 필리우스 이외에 다른 선택지가 있는가?\n\n\"경전의 가르침에 따라, 여러분은 오늘 세례로서 물과 성령으로 새로 태어났습니다. 게헨나와 트리니티를 떠나 여러분 모두가 이제 하느님 나라에 들어갈 수 있는 거룩한 백성이...\"\n\n사쿠라코 수녀원장이 직접 실시한 세례식을 통해, 소라사키 히나와 아마우 아코는 트리니티 신앙으로 개종하기로 했다. 물론, 이것이 진정한 마음의 개종을 의미하는 것은 아닐 것이다. 그러나 게헨나의 정치적 중심이 에덴의 고성당에서 우리의 신앙을 받아들이겠다고 선언하고, 세례를 받은 것만으로도, 이것은 트리니티가 게헨나를 상대로 항구적인 승리를 거두었다는 상징적인 사건이 되었다." # 히나가 지도자
 trinity_events_nagisa.30.desc.ako: "게헨나 선도부와의 통합이 우리에게 있어서 가장 중요했던 이유는, 필리우스 분파의 양적, 질적 규모를 키울 기회였다는 점이다. 시로미 이오리를 비롯한 실행부는 전부 게헨나에 남았다. 의료부 역시 게헨나를 떠날 생각은 없었다. 하지만 기획부와 정보부 간부들이 거처를 에덴으로 옮기면서, 그들은 게헨나가 아닌 트리니티 질서 아래에서 새로운 활동을 시작하기로 했다. 아마우 아코는 완전히 소속을 트리니티로 옮기고, 트리니티 티파티의 필리우스 분파 소속으로 활동하게 되었다. 파테르는 이에 격노했지만, 격노하라고 한 행동이다. 애초에 그녀들이 정치를 계속하고자 했을 때 필리우스 이외에 다른 선택지가 있는가?\n\n\"경전의 가르침에 따라, 여러분은 오늘 세례로서 물과 성령으로 새로 태어났습니다. 게헨나와 트리니티를 떠나 여러분 모두가 이제 하느님 나라에 들어갈 수 있는 거룩한 백성이...\"\n\n사쿠라코 수녀원장이 직접 실시한 세례식을 통해, 아마우 아코는 트리니티 신앙으로 개종하기로 했다. 물론, 이것이 진정한 마음의 개종을 의미하는 것은 아닐 것이다. 그러나 게헨나의 정치적 중심이 에덴의 고성당에서 우리의 신앙을 받아들이겠다고 선언하고, 세례를 받은 것만으로도, 이것은 트리니티가 게헨나를 상대로 항구적인 승리를 거두었다는 상징적인 사건이 되었다." # 히나 탈주 상태
 trinity_events_nagisa.30.a: "트리니티는 언제나 승리한다."
 trinity_events_nagisa.31.t: "미식연구회는 미치지 않았다"
 trinity_events_nagisa.31.desc: "\"그러니까, 게헨나에서 지금까지 저질러 온 모든 테러 활동이... 일종의 사회복지였다는 말씀이십니까?\"\n\n미네는 가벼운 현기증을 느끼며, 도도하게 앉아 있는 쿠로다테 하루나를 지켜보았다. '하루나를 바로 감옥에 넣지 말고, 일단 대화를 나누어 상대의 사상을 이해하려 노력해보자'는 나기사의 제안을 받아들이기는 했다. 하지만 그녀의 사상이라는 것은 워낙 어처구니가 없어, 이 노력 자체가 너무도 무의미하게 느껴졌다. 물론, 하루나는 나름대로 깊은 뜻을 가지고 있는 모양이었지만.\n\n\"네, 그렇답니다. 미네 씨는 공리주의를 알고 계신가요? 공공선이란, 공공의 이익을 최대화하고 그 손해를 줄이는 것이죠. 보시다시피 제가 폭파한 식당들은 너무도 끔찍한 요리를 내놓아, 게헨나 대중의 공공의 고통을 누적시켰답니다. 즉... 이런 식당을 내버려두는 게 많은 사람들에게 손해라는 뜻이지요.\"\n\n\"하지만, 식당 주인의 고통은 어쩌고요? 그 사람의 고통은 무시해도 되는 것입니까?\"\n\n\"공리주의에서 중요한 것은 '절대 다수의 절대 행복'이지, '소수의 행복'이 아니랍니다. 식당 하나가 얼마나 많은 이들에게 피해를 주는지 아시나요? 한 라멘 식당에 하루 100명의 손님이 온다면, 한 사람의 행복을 위해 100명이 불행해집니다. 그냥 '불행'으로 끝날까요? 그 사람들의 시간이 사라집니다. 더 좋은 식당에 갔더라면 얻을 수 있었을 행복도 사라집니다.\"\n\n하루나의 말에 미네는 깊은 생각에 잠겼다. 하나의 식당이 주는 피해가 그렇게나 크다면, 식당을 폭파시키는 것은 정말로 공공선을 위한 선행이었던 것일까? 그녀 역시 구호기사단에서 구호를 위해 법을 다소 어길 정도로 폭력을 사용하는 미네처럼, 공공선을 위한 '약간 과도한' 폭력을 쓰고 있는 것 뿐인가?\n\n\"그렇기에 제가 이 불행의 연쇄를 끊은 것일 뿐이랍니다. 네. 저는 구원한 겁니다. 미래에 맛없는 식당을 방문해 미각의 고통을 느낄 피해자들을 구한 거죠. 애초에 식당이 없다면 고통 받지 않을 테니까요. 이제 아시겠나요? 미식연구회가 저지르고 있는 일들은 결코 범죄가 아닙니다. 공리주의의 완성, 절대 다수의 절대 행복을 위해 스스로를 희생한 숭고한 행동인 거죠.\""
 trinity_events_nagisa.31.a: "\"그 '공공선'의 개념은, 제가 추구하는 '구호'와 합치하는군요...\""
 trinity_events_nagisa_31_a_tt: "§g쿠로다테 하루나는 계속 게헨나에서 활동합니다. 미네는 하루나의 사상에 감화되어, 그녀에 동조하는 보고서를 티파티에 제출할 것입니다.§!"
 trinity_events_nagisa.31.b: "\"...하지만, 선을 위해 타인을 희생시킨다니, 결코 용납될 수 없습니다.\""
 trinity_events_nagisa_31_b_tt: "§g쿠로다테 하루나는 감옥에 갈 것입니다.§!"
 trinity_events_nagisa.32.t: "소라사키 히나 조사"
 trinity_events_nagisa.32.desc.hina: "\n\n\n                                      £GFX_report_event_GEH_ichika_nakamasa £GFX_report_event_TRM_hina_sorasaki_trinity\n\n\n\n\n\n\n키리후지 나기사 님께\n\n나카마사 이치카임다. 지시하신 대로 게헨나 통합 이후의 히나 씨를 나름대로 따라가 봤슴다. 몇 번 다과회를 열어 대화도 나누어 봤고, 그 사람 생각은 나름 들을 수 있었슴다.\n\n간단히 결론을 말씀드리자면, 네. 140퍼센트 정도 무해함다. 저 자신보다 트리니티에 더 잘 적응하고 있는 것 같았으니까요.\n\n키보토스에서도 '에덴 조약'을 끝으로 은퇴하려고 했다는 말도 있고, 게헨나에 대한 애정이나 미련은 없는 것 같았슴다. 히나 씨는 티파티에서 자리를 얻게 된 뒤, 피아니스트가 되기 위해 그쪽으로 시간을 많이 쏟고 있었지요. 정치? 완전히 손 놓은 것 같슴다.\n\n물론 게헨나 선도부장직을 이오리 씨에게 넘겨준 뒤 티파티 임원이 되시긴 했슴다. 다만 이건 본인의 금전적 자유와 트리니티에서의 사교 활동을 위해 받아들이셨을 뿐인 것 같슴다. 이 부분은 저는 잘 모르지만, 나기사 님은 아실 거라고 하시더라고요. 회의에서는 질문 없음. 필리우스 분파의 당론에 무조건 찬성표. 아하하. 말만으로는 거의 거수기인데, '그' 선도부장이 나기사 님의 거수기라니, 솔직히 믿기지는 않슴다.\n\n...사실임까? 이야, 그렇다면 정말로 히나 씨는 정치에는 손을 놓은 게 맞는 것 같슴다. 뭐, 대전이 이전부터 선도부장직의 무게로 인해 많이 지치셨다고 하니까요. 편히 쉬시게 두는 게 맞겠슴다. 나기사 님도 안심하셨다면 다행임다. 타인을 더 깊이 이해한다면, 타인을 더 깊이 신뢰할 수 있게 되는 거니까 말임다." # 진짜 히나
 trinity_events_nagisa.32.desc.robot: "\n\n\n                                      £GFX_report_event_GEH_ichika_nakamasa £GFX_report_event_TRM_hina_sorasaki_trinity\n\n\n\n\n\n\n키리후지 나기사 님께\n\n나카마사 이치카임다. 지시하신 대로 게헨나 통합 이후의 히나 씨를 나름대로 따라가 봤슴다. 몇 번 다과회를 열어 대화도 나누어 봤고, 그 사람 생각은 나름 들을 수 있었슴다.\n\n간단히 결론을 말씀드리자면, 네. 아마 무해한 것 같슴다.\n\n아니, 어떻게 아시냐고 물으신다면... 정의실현부는 치안조직임다? 거짓말을 하는 용의자는 수백 번도 넘게 취조해 봤고요. 게헨나에 대해서는 완전히 포기한 것 같슴다. '파멸하는 것이 당연하다'라거나, 되게 모진 말들을 많이 하셨슴다.\n\n그 외의 근거라면, 최근 히나 씨의 행동은 정치적인 것 보다는 사교에 집중하시는 것 같슴다. 여러 사람들을 만나고 있기는 하지만, 모두 필리우스의 분들이라고 하고, 게헨나에서의 사람은 아코 씨 이외에는 전혀 만나고 있지 않슴다. 네. 지금의 그 사람이 트리니티에서 뭔가 게헨나를 위한 공작을 할 리는 없슴다. 애초에 게헨나와의 인연을 다 끊었으니까요.\n\n그렇슴까... 나기사 님도 안심하셨다면 다행임다. 타인을 더 깊이 이해한다면, 타인을 더 깊이 신뢰할 수 있게 되는 거니까 말임다." # 가짜 히나
 trinity_events_nagisa.32.a: "나기사는 히나를 완전히 믿을 수 있다고 판단했다."
 trinity_events_nagisa.33.t: "아마우 아코 조사"
 trinity_events_nagisa.33.desc: "\n\n\n                                      £GFX_report_event_TRM_tea_party_mob £GFX_report_event_TRM_ako_amau_trinity\n\n\n\n\n\n\n키리후지 나기사 님께\n\n안녕하세요, 나기사 님. 필리우스 분파 임원인 텐네입니다. ...아코 감찰관님에 대한 인상 말씀이신가요? 놀라운 분이시죠. 선도부의 2인자인 선임행정관에서, 티파티의 일개 중간 관료인 감찰관으로 강등되기를 자처하시다니.\n\n...네. 감찰관님은 게헨나에 대한 소속감은 없으셨어요. '히나 부장님이 에덴 조약을 옳다고 말했으므로' 트리니티에 충성한다. 그 사람의 충성은 게헨나가 아닌 히나 씨라는 느낌이랄까요. 히나 씨가 '트리니티가 이겼어' 라고 말하면, 감찰관님에게 게헨나는 '없는 것'이 되어버리는 거죠.\n\n네. 나기사 님의 말씀대로입니다. 히나 씨의 결정이 그 분의 결정이니까요. 감찰관님이 이제 와서 게헨나의 권익이나 부활, 그런 것들을 위해 티파티에서 활동하리라는 생각은 들지 않았습니다. '국가'가 아닌 '개인'에 충성한다. ...정말로 낭만적이라고 생각한답니다.\n\n어째서...라고 하셔도, 기사도 문학의 기사들 같잖아요? '조국'을 위해 싸우는 것은 천민, 즉 붉은 피의 몫이죠. 푸른 피는 2천년 전부터 주군과 그 기사도를 위해 깃발을 쥐어 왔고요. 갤러해드는 자신의 검을 뽑으며 조국의 이름이 아닌 아서 왕의 이름을 외쳤답니다. 국가는 유한하지만, 신앙과 기사도는...\n\n어머, 죄송합니다... 잠시 다른 이야기를 해 버렸네요. 감찰관 님의 행동을 이해하는 데에는 프로파일 기법이나 심리학적 연구보다, 기사도 문학을 참고하는 게 더 좋다고 보고 있습니다. ...그래서, 저는 감찰관 님을 좋아하고요."
 trinity_events_nagisa.33.a: "\"제게도, 제가 트리니티가 아닌 다른 곳으로 가더라도 저를 따라와 줄 기사가 존재할까요?\""
 trinity_events_nagisa.34.t: "아리우스에 대한 인도적 지원"
 trinity_events_nagisa.34.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n[ROOT.GetLeader] 호스트 님께\n\n아리우스 분교와 우리 트리니티 사이의 전쟁에도 불구하고, 저희 시스터후드는 이 땅에서 절망이 아닌 희망을 봅니다. 호스트 님께서는 아리우스 분교가 '대전이' 이전까지 마셨던 차에 대해 알고 계십니까? 그녀들은 민들레와 마른 순무 뿌리, 엉겅퀴 따위를 볶아 물에 타 마셨다고 합니다. 트리니티에서는 있을 수 없는 비참함입니다.\n\n하지만 그녀들은 정체되어 있지 아니하였습니다. 베아트리체 학생회장이 사라진 이후 그녀들은 스스로 노력하여 그 삶의 형태를 스스로 바꾸었습니다. 여전히 아리우스는 가난하지만 우리는 그녀들이 스스로의 삶을 개척하기 위하여 어떠한 여로를 걸어 왔는지 알 수 있습니다.\n\n호스트 님, 저는 아리우스에 와 있기 때문에 티파티에서 아리우스를 이단으로서 단죄하기로 하였는지, 포용하기로 하였는지 아직 보고를 듣지 못하였습니다. 이 전서가 도착한 뒤에야 비로소 알게 되리라 믿습니다. 허나 어떠한 결론이 내려지더라도 호스트 님께서 이 땅의 백성들이 마냥 정체된 양들이 아닌 앞으로 나아가려 노력하는 양임을 이해하여 주시기 바랍니다.\n\n적절한 의료 지원과 트리니티로 재정착하고자 하는 이들을 위한 이주 지원이 있어야지만, 우리는 그녀들이 일구어내고자 하였던 올바른 길로 그녀들을 이끌 수 있습니다. 호스트께서 그녀들에게 무한한 자비와 사랑을 보여주시라는 것을 믿으면서 아리우스에서 기다리겠습니다.\n\n- S. Utazumi."
 trinity_events_nagisa.34.a: "순무 뿌리 차라니...!"
 trinity_events_nagisa.35.t: "아리우스 이단 심문"
 trinity_events_nagisa.35.desc: "이오치 마리는 티파티의 결정이 마음에 들지 않았다. 애초에 아리우스 땅을 '이단'으로 지정하고, 이단 심문을 해야 한다는 것 자체가, 승리자의 오만한 주장 아닌가? 사쿠라코 역시 아리우스는 포용의 대상이라고 보았지, 단죄의 대상이라고 생각하지는 않았다.\n\n하지만 마리는 [ROOT.GetLeader]가 어째서 그런 결정을 내렸는지는 이해할 수 있었다. 첫 번째 공의회의 결정을 거부하고 떠나간 아리우스. 그녀들을 믿지 못하는 시스터후드의 사람들은 너무도 많이 있었다. 그리고, 호스트는 그녀들의 의견을 따랐을 뿐이었다.\n\n마리는 숙소의 유리창에 몸을 기대어 서서, 분노한 시스터후드의 수녀들이 굶주린 아리우스의 소녀들을 모으고 있는 모습을 보았다.\n\n시스터후드의 수녀들은 아리우스의 학생들에게, 아리우스의 전도서를 밟고 건너게 지시했다. 그것이 자신들이 이단이 아닌 올바른 신앙으로 돌아가겠다는 증표라고.\n\n'유스티나 성도회'의 사악한 고문 문화는 사라졌다. 트리니티는 과거의 죄를 더 이상 반복하지 않겠다는 의미로서 아리우스의 이단에 어떠한 신체적 위해도 가하지 않기로 약속했다. 그것은 분명 고결한 선택이라고 생각한다.\n\n하지만 그녀들이 수백 년 이상 믿고, 외워 온 전도서를 밟게 하는 것은, 직접적인 폭력이 없을 뿐 다른 종류의 폭력일 뿐인 것 아닌가? 이단과 참된 신앙을 구분짓는 것은 무엇인가? 교리의 정합성인가, 그렇지 않다면 단순한 총과 칼의 힘인가? 자비로운 주께서는 자신의 참된 자녀를 총구의 구경으로서 구분하시던가?\n\n마리는 저 끔찍한 광경을 가리려 커튼을 치려고 했다. 하지만, 그보다 더 창조주의 가르침에 부합하는 행동이 있다는 걸 떠올렸다. 저 광기를 몸으로 막는 것."
 trinity_events_nagisa.35.a: "...주께서 네 이웃을 네 자신 같이 사랑하라 하셨으니..."
 trinity_events_nagisa.36.t: "네 이웃을 사랑하라"
 trinity_events_nagisa.36.desc: "카케하시 스바루는 트리니티가 아리우스를 완전히 포용하고 받아들이겠다고 한 결정을 믿지 않았다. 아니, '스바루'가 믿지 않았다는 말은 거짓일 것이다. 아마 '아리우스'가 믿지 않았다고 하는 것이 진실에 더 가까운 표현이겠지.\n\n스바루는 구호기사단의 증표까지 모두 내려둔 채, 일개 '무명의 자원봉사자'를 자처하며 아리우스에 찾아온 아오모리 미네와 아리우스의 거리를 함께 걸었다. 아리우스이기도 하고, 단치히이기도 한 이 우중충한 거리에서, 수많은 눈들이 건물 유리창에서 미네를 내려다보고 있었다. 미네는 그 시선들이 불편한 듯 말했다.\n\n\"필요하다면 방패와 총도 버리고 걸을 수 있습니다.\"\n\"됐습니다. 그랬다가는 당신의 시체를 치우는 건 제 몫이 되거든요.\"\n\n빈정거리는 말을 하면서도, 스바루는 미네의 진심을 조금씩 받아들이고 있었다. '아리우스는 트리니티의 자매다. 그리고, 아리우스를 위해 어떠한 재건 노력이라도 아끼지 않겠다. 그것을 현재에도 미래에도 갚을 필요는 없다.' 어처구니가 없을 정도로 달콤한, 아리우스에는 결코 존재하지 않는 순수한 형태의 '선의'.\n\n하지만, 그 선의가 위장되어 있다고 느껴지지는 않았다. 여전히 트리니티에 대항하는 레지스탕스가 남아 있는 이 아리우스 땅을, 아무런 호위 없이 홀로 찾아온 '요한 분파 수장'의 존재 자체가 그녀와 트리니티의 모든 진정성을 설명해 주고 있었으니까. 그렇기에, 스바루가 할 수 있는 말은 하나 뿐이었다. 순수한 형태의 의문.\n\n\"당신들은 원래 적에게 이런 식으로 대합니까? 세상의 어떤 바보가 총칼을 겨눈 적을 이리 대합니까?\"\n\n\"언제나 그렇지는 않았습니다. 나기사 님이 호스트가 된 이후부터 이렇게 되었죠. 파테르도 좋다, 게헨나도 좋다, 이교도들도 좋다... 저로서는 그 분의 이상이 옳은지 나쁜지는 잘 모르겠습니다. 허나, 이 세상이 악의가 아닌 선의로서 이루어졌다는 개념이, 모든 것을 헛되고 헛되다고 생각하기보다는 낫다고 생각합니다. 적어도 하나쯤은, 헛되지 않은 것을 곁에 품고 있어도 좋지 않겠습니까? 사랑 같은 것 말입니다.\""
 trinity_events_nagisa.36.a: "적이라고 할지라도."
 trinity_events_nagisa.37.t: "아리우스 분파의 탄생"
 trinity_events_nagisa.37.desc: "\n\n\n                                                   £GFX_report_event_TRM_tea_party_mob\n\n\n\n\n\n\n[ROOT.GetLeader] 호스트 님께\n\n아리우스 분교는 더 이상 존재하지 않으며, 아리우스의 많은 학생들이 트리니티로 이주하였습니다. 허나, 일부 학생들은 아리우스에서 트리니티로 이사하면서도 자신들의 신앙을 트리니티의 것으로 개종하지 않은 것으로 확인되었습니다.\n\n담당 감찰관의 보고에 따르면, 아리우스 '분교'의 문화, 종교적 가르침을 그 학원이 소멸한 이후에도 지키고자 하는 전통주의자들이 유의미한 비율로 존재합니다. 필리우스 분파는 이들을 '아리우스 분파'로서 명명하고, 그녀들의 움직임을 주시하기로 하였습니다.\n\n아리우스 분파의 움직임에 대해, 고결하신 [ROOT.GetLeader] 호스트께서 그녀들이 나아갈 길을 일러주실 수 있으리라 믿습니다. 호스트 님의 자비로운 사랑 아래에 그녀들이 평온을 찾기를 바랍니다.\n\n티파티 비서실 보고"
 trinity_events_nagisa.37.a: "분교보다는 분파가 낫지"
 trinity_events_nagisa_37_a_tt: "§g아리우스 분파의 영향력은 트리니티 파벌 시스템의 독일 국가인민당을 대체합니다.§!"
 trinity_events_nagisa.38.t: "게헨나 분파의 등장"
 trinity_events_nagisa.38.desc: "\n\n\n                                                   £GFX_report_event_TRM_tea_party_mob\n\n\n\n\n\n\n[ROOT.GetLeader] 호스트 님께\n\n게헨나 학원이 트리니티에 편입된 이후, 많은 변화가 있었습니다. 소라사키 히나, 아마우 아코 선도부의 두 지도자가 이미 게헨나를 떠났고, 아코 감찰관이 제일 먼저 트리니티 신앙으로 개종하고 티파티 필리우스 분파의 임원이 되면서 선도부는 트리니티 질서를 누구도 거부하지 않게 되었습니다.\n\n판데모니엄 소사이어티 역시 무력화되었다고 볼 수 있습니다. 특히 하누마 마코토가 파산한 이후, 만마전 의원들은 다시 모일 구심점을 잃고 완전히 흩어진 상태입니다. 만마전이 다시 게헨나 재건을 위한 중심 세력이 될 것이라는 파테르 분파의 편집증은 현재로서는 '과대망상'에 불과합니다.\n\n그러므로 우리의 진짜 문제는 온천개발부입니다. 온천개발부는 현재 게헨나에서 트리니티 통합을 거부하는 유일하게 유의미한 규모를 가진 '게헨나 분리주의' 세력입니다. 온천개발부는 군사 게릴라는 아니지만, '트리니티 통치 아래에서는 온천 개발이 방해받는다'며 사방에 많은 폭탄을 터트려대고 있습니다.\n\n미식연구회와 달리 그녀들은 트리니티 질서를 어떠한 형태로든 거부하므로, 소탕하지 않는다면 골치 아픈 상대로 남을 것입니다. 호스트께서도 그녀들을 주시하시기를 바랍니다.\n\n티파티 비서실 보고"
 trinity_events_nagisa.38.a: "온천 분리주의? ...온천 공화국이라도 만드려고?"
 trinity_events_nagisa_38_a_tt: "§g게헨나 분리주의자들의 영향력은 트리니티 파벌 시스템의 $faction_F_name_nagisa$에 포함되는 것으로 간주합니다.§!"
 trinity_events_nagisa.39.t: "미네와 나기사의 독대"
 trinity_events_nagisa.39.desc: "나기사는 쉽게 화를 내는 성품의 인물은 아니었다. 하지만 자신의 친우가 저격당하고, 장례식을 마치고, 깊은 절망과 슬픔에 잠겼었는데. 사실 그 날 세이아는 죽지 않았고, 저격 당한 이후 미네에 의해 은밀한 장소에 숨겨져 치료를 받았었다는 이야기를 들었을 때. 나기사는 찻잔을 벽에 집어던졌다. 몇 년간이나 의식 불명 상태이던 세이아가 깨어났다는 소식을 미네가 전한 그 날, 나기사는 미네를 똑바로 노려보며 말했다.\n\n\"저에게는 말하셨어야 했습니다.\"\n\"저격 사건 이후, 세이아 님을 지키기 위한 부득이한 결정이라고 이해해 주시기 바랍니다. 구호를 위해서는 간혹 단호하지만 잔인한 방법을 택해야 할 때도 있습니다. ...티파티 내부에 저격수와 공조하는 자가 있을 가능성이 있어서...\"\n\"제가, 세이아 씨를 죽이는 데 공조했다는 말입니까?\"\n\"그런 의미는... 아니었습니다.\"\n\n미네는 고개를 살짝 숙인 채, 그녀 답지 않은 기죽은 목소리로 말했다.\n\n\"...저는 아무도 믿지 못하는 상황이었습니다. 그저... 이렇게 하지 않으면 세이아 님이 다시 위험해 질 거라고 생각해서...\"\n\n나기사는 미네를 똑바로 바라보았다. 결국 미네도 타인을 완전히 믿지 못했기 때문에 그런 결정을 내렸을 것이다. 나기사는 세이아를 잃었다고 생각했을 때, 자신의 각오를 되짚어보았다. 타인을 믿으려고 노력하기. ...그러지 않았을 때의 결과가, 지금의 구호기사단장이겠지. 나기사는 미네에게 더 화를 내고 싶었지만 그럴 수 없었다. 상황이 달랐다면, 나기사 자신도 같은 결정을 내렸을 테니. 나기사는 품위 있게 미네에게 고개를 숙였다.\n\n\"찻잔을 던진 것에 사과드립니다. ...세이아 씨가 있는 곳으로 데려가 주실 수 있을까요? 아니. ...저 혼자서는 안 되겠죠. 한 명 더 붙여서요.\""
 trinity_events_nagisa.39.a: "미네는 고개를 끄덕였다."
 trinity_events_nagisa.40.t: "병상에서 깨어난 유리조노 세이아"
 trinity_events_nagisa.40.desc: "세이아는 잠들어 있는 동안 매일 다른 꿈을 보았다. 일어날 수 '있었던' 무한정의 미래들이었다. 어떤 미래에서는 나기사가 호스트가 되었지만, 만마전의 기갑사단이 에덴에 들어오며 트리니티는 해체당했다. 어떤 꿈에서는 미카가 키보토스 전체를 정복한 위대한 승리자가 되었다. 하지만 또 어느 날에는 미카가 게헨나 선도부원들의 포로가 되기도 했다. 트리니티가 밀레니엄에 ICBM을 쏘기도 했고, 밀레니엄의 ICBM이 에덴에 떨어진 미래도 있었다. 리쿠하치마 아루가 에덴의 폐허에서 승전 연설을 하거나, 사쿠라코가 고성당에서 유럽 통일 기념 미사를 열기도 했다.\n\n세이아는 자신이 깨어났을 때, '어떤' 트리니티가 펼쳐져 있을지 궁금했고, 두려웠고, 그래서 영원히 깨어나지 않은 채 가능성의 바다에 잠겨 있기만을 바랐다. 결과를 보지 않는다면 두려워할 이유도 없으니까. 세이아는 작은 상자 하나와 같은 방에 있다. 그 상자에는 죽은 고양이가 있을 수도, 산 고양이가 있을 수도 있다. 열지 않는다면, 고양이가 살 가능성은 0퍼센트가 되지 않으니까. 하지만. 영원히 상자를 닫아 놓고 있을 수는 없는 법이었다.\n\n\"세이아 님. ...방문객입니다.\"\n\n1인실의 문이 열리고, 하얀 옷을 입은 두 명의 친우가 들어왔다. 세이아는 심장이 거칠게 뛰는 것을 느꼈다. 나기사와 미카. 두 명이 꽃다발을 든 채 미네와 함께 병실에 들어섰다. 세이아는 한 번도 두 사람이 동시에 자신을 찾아오는 미래를 보지 못했다. 미카가 파멸하거나, 아니면 나기사가 파멸하거나. 세이아는 그저 두 사람이 함께 자신을 찾아온 것에 기뻐, 그리고 두 사람을 만나는 것이 두려워 깨지 않기를 바랐던 자신이 미워, 몇 번이고 고개를 숙인 채 울었다.\n\n\"미안합니다. 저는... 정말로, 잘못했습니다.\""
 trinity_events_nagisa.40.a: "나기사와 미카는, 말 없이 세이아를 안아 주었다."
 trinity_events_nagisa.41.t: "세이아의 복귀"
 trinity_events_nagisa.41.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\n나기사. 그간 심려를 끼쳐 드려 미안했습니다. 당분간 병원에서 재활 치료를 받아야 하기에 이렇게 음성 메시지로 근황 알리게 되는 점 용서하십시오. 아니. 용서하지 마세요. 저는 모르는 동안 제 친우들에게 너무 큰 상처를 주었습니다.\n\n저는 상투스 분파로 돌아가지 못합니다. 비탄스럽게도 저는 상투스의 '공적'이 되어버린 것 같습니다. 그 동안 상투스를 관리하였던 분들은 수년간 나름대로 내부에서 권력을 나누시고, 당 총재니 윤리위원장이니 사무국장이니 하는 자리를 만드셨습니다. 그런데 정계를 떠나 있던 제가 상투스의 수장에 복귀한다면, 그분들이 나누어 가진 당내 권력을 제가 회수하게 되는 셈 아니겠습니까? 그 분들을 이해합니다. 권력은 가족과도 나눌 수 없는 것이라 하였으니까요. 다만 상투스의 말석으로도 복귀를 허락하지 아니하신 점에 대해서는 약간은... 아니요. 솔직히 조금 많이 화가 났습니다.\n\n나기사. 저는 제 책무를 회피하지 아니하려 합니다. 저는 트리니티의 교우들과 소중한 시민들을 위하여 공직에 복무하고자 합니다. 제 자리가 상투스가 아니더라도 좋습니다. 트리니티를 위해 할 수 있는 최대한의 노력을 하게 해 주세요. 저는 몇 년간이나 나기사에게 너무 큰 짊을 홀로 짊어지게 하였습니다. 그러니 부탁드립니다. 필리우스의 말석이라도 받아들이겠으니, 퇴원 이후 제가 나기사를 도울 수 있도록 해 주세요. 회신 기다리겠습니다."
 trinity_events_nagisa.41.a: "세이아 씨를 위해, 행정관 자리를 준비해야 하겠네요." 
 trinity_events_nagisa_41_a_tt: "$TRN_Yurizono_Seia$는 필리우스 분파의 일원으로서 트리니티에 복귀합니다."
 trinity_events_nagisa.42.t: "세이아의 필리우스 가입에 대한 파테르의 항의"
 trinity_events_nagisa.42.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\n나기 쨩? 자? ...나 차단한 거 아니지? 전화 안 받아서 음성사서함에 남겨. 파테르에서는 공식으로 항의 메시지를 보내라고 했는데, 그러고 싶지 않아. 세이아 쨩이 살아 돌아왔어. 그거면 되잖아. 필리우스로 가든, 상투스로 가든 그런 것 때문에 내가 징징거려야 할까? 나는... 정말, 세이아 쨩이 죽었다고 생각해서. 아니. 생각한 게 아니라. 나기 쨩도 같이 봤잖아. 입관식에서 관을 화장하는... 그. 저기. 미안. 미안해, 호흡이 좀 힘들어서. 잠깐만.\n\n... ... ...\n\n미안. 돌아왔어. 나중에 이 부분은 스킵해 줘.\n\n나기 쨩. 고마워. 그냥... 세이아 쨩을 받아줘서, 그리고 나 대신 매일 병문안을 가 준 것도 잊지 않을게. 언젠가, 다시 우리 세 사람이 모여서 다과회라도 열자. 아니. 내가 그 자리에 없어도 괜찮으니까. 세이아 쨩과 나기 쨩의 다과회라도 괜찮으니까, 세이아 쨩을 행복하게 해 줘. 고마워."
 trinity_events_nagisa.42.a: "이만 끊을게. 회신은 하지 않아도 돼."
 trinity_events_nagisa.43.t: "요한 분파의 정치 개입?"
 trinity_events_nagisa.43.desc: "\"호스트가 된다거나, 저는 그런 생각은 하지 않습니다.\"\n\n세이아와의 티타임을 가지며, 미네는 가만히 고개를 저었다. 깊은 잠에서 깨어나고, 트리니티의 변화한 정세에 대해 파악한 이후. 세이아는 미네에게 정치에 도전할 것을 권유하기 시작했다. 미네는 세이아의 생각을 읽으려 노력하며 물었다.\n\n\"나기사 씨가 많이 힘든 상황인가요?\"\n\"정치적으로 어렵습니다. 필리우스 분파는 게헨나와의 전쟁에서 승리하고, 큰 사회적 영향력을 얻었습니다. 그러나 여전히 필리우스는 단독으로 다음 호스트 선거에서 과반을 얻을 능력이 되지 않습니다. 허나... 요한 분파는 파테르와도 너무 험악한 관계가 아니기에, 일부 파테르 표를 가져올 수도 있습니다.\"\n\"정치적인 동기 외에, 제게 정계 입문을 권유하시는 다른 이유가 있으실까요?\"\n\"...있습니다. 원인은 불안... 이라고 할까요. 파테르와 필리우스는 대전이 이후 너무 사이가 벌어졌습니다. 언젠가 두 분파는 다시 화해하겠으나, 지금 상황에서 정권이 파테르에게 넘어간다면, 나기사에 대한 보복이 일어날 것이 두렵습니다. 물론 제가 그 미래를 본 것은 아닙니다. 허나 직감이라고 할까요. 그런 것 때문에 불안을 느끼는지라...\"\n\n불안감. 미네는 세이아가 그런 말을 하는 이유를 이해할 수 있었다. 자신이 의식불명 상태로 몇 년간이나 침대에 누워만 있었다는 것 때문에, 세이아는 친구들에 대한 죄의식을 품고 있었다. 나기사가 위험을 겪을 수 있는 작은 가능성이라도 있다면, 그 가능성을 차단해야 했다. 필리우스와 요한의 호스트 후보 단일화. 그건 지금의 세이아에게는 가장 합리적인 선택지겠지. 물론, 그 끝에 제관을 쓰는 미네가 개인적으로 힘들어지겠지만.\n\n\"이 문제는 물론 나기사 님과 논의해봐야 하겠습니다만, 그것과 별개로 제 생각은...\""
 trinity_events_nagisa.43.a: "호스트가 되고 싶다는 마음은 있습니다."
 trinity_events_nagisa.43.b: "정치에 개입하는 순간, 저는 '구호기사단장'이 아니게 됩니다."
 trinity_events_nagisa_43_a_tt: "§g호스트 선거 후보에 아오모리 미네가 추가됩니다.§!"
 trinity_events_nagisa.44.t: "나기사 헌법"
 trinity_events_nagisa.44.desc: "\n\n\n                                                   £GFX_report_event_TRM_nagisa_kirifuji\n\n\n\n\n\n\n이번 개헌 논의 공의회에 모여 주신 여러분, 감사드립니다. 여러분은 모두 존경 받아 마땅한 고귀한 엘리트들이십니다. 우리의 고향은 대전이 이후 많은 부침을 겪었습니다. 거센 파도에 흔들리고, 거친 바람은 우리를 매섭게 때렸습니다. 허나, 우리는 하나 되어 그 모든 어려움을 이겨냈고, 첫 번째 트리니티의 이상은 그 모든 사건들이 끝난 뒤에도 흔들리지 아니하였습니다. 하지만 다음 세대, 그리고 그 다음 세대에까지 변치 않는 트리니티를 물려주기 위해, 우리는 계속해서 우리 스스로를 개혁해야만 합니다.\n\n저는 이번 헌법을 준비하면서 많은 분들의 우려를 들었습니다. 어떤 분들은 제가 주장하는 개헌안이 '두 번째 트리니티' 이념과 무엇이 다르냐고 힐난하셨습니다. 그 모든 반대 의견을 존중합니다. 제가 고안한 새로운 헌법은 대전이 이후 변화한 국제적 정세에 맞게 트리니티를 개혁할 것입니다. 그러나 저의 개혁은 트리니티의 고결한 정신을 훼손하지 않는 개혁일 것입니다. 여전히 티파티는 자애로운 어머니처럼 시민들을 돌보는 존재일 것이고, 고귀한 우리의 전통은 결코 개혁되지 않으며 변화하지도 않으리라 약속합니다.\n\n저는 트리니티라는 낡은 집의 문을 교체하고, 화단을 새로이 꾸미려 이 자리에 섰습니다. 집을 부수고 새로 짓기 위해 서지 않았습니다. 공의회에 참석하신 모든 임원 여러분은 새 헌법으로 개혁된 트리니티가, 그저 이전 트리니티에서 당연히 보장되었어야 하는 권리를 명문화한 것에 불과하다는 것을 알게 되리라 믿습니다. 공의회에서 새 개헌안이 통과되기 위해선 여러분의 찬성표가 필요합니다. 개헌안 자료가 여러분께 전달되었으니, 차분히 읽어 보신 뒤 결정해 주시기 바랍니다. 감사합니다."
 trinity_events_nagisa.44.a: "개헌안은 압도적 찬성표로 통과되었다."
 trinity_events_nagisa.45.t: "미카와의 화해"
 trinity_events_nagisa.45.desc.seia: "세이아는 깨어난 이후에도 여전히 지치고, 병약해 보이는 모습이었으나, 적어도 건강이 많이 나아지고 있다는 것은 알 수 있었다. 세이아는 나기사와의 다과회장에 마주 앉은 채 말했다.\n\n\"저는 나기사 씨가 미카 씨와 화해하기를 바랍니다.\"\n\"화해... 라고 하셔도, 저와 미카 씨는 늘 친구였습니다.\"\n\"정치적으로는 아니지요. 공석에서는 서로를 향해 소리를 지르고, 상대를 트리니티를 멸망시킬 마녀라고 비난하고, 오늘 필리우스의 회합에서는 미카 씨를 파멸시킬 방법을 논의하지 않았습니까. 이런 친우가 있다면, 저는 저를 저격한 저격수와 벌써 '짱친' 먹었을 겁니다.\"\n\n현학적인 세이아답지 않은 짱친이라는 (사쿠라코스러운) 화법에, 나기사는 미소가 흘러 나오는 것을 참을 수 없었다. 그것과 별개로 그녀의 지적도 일리가 있었다. 파테르와 필리우스의 분열은 나기사와 미카의 관계를 계속 소홀하게 만들고 있었다. 에덴 조약은 원래 미카를 보호하기 위한 것이었으나, 나기사는 미카를 비난하고 파테르를 증오하며 회담장에 들어섰다. 미카를 위해 구워 주던 롤케이크도 그만 둔지 몇 년이 지났다. 다과회장에 마주 앉아 마지막으로 미카와 함께 찻잔을 기울인 것이 언제였던가?\n\n그 모든 것은, '정치' 때문이었다. 필리우스와 파테르. 두 사람은 상대방을 부러뜨리지 않고서는 정상의 자리에 오를 수 없는 관계가 되어 있었으니까. ...하지만, 정치보다 중요한 것이 있지 않은가? 모든 권력을 쥔다고 해도, 그 옆에 소중한 사람이 없다면, 그 권력에 의미가 있는가? 나기사는 잠시 머뭇거리다 말했다.\n\n\"...네. 그렇다면, 노력해 보겠습니다. 허나, 미카 씨와의 진정한 화해는, 저와 미카 씨 사인간의 관계가 좋아지는 것으로는 완성될 수 없습니다. 필리우스와 파테르, 두 분파의 오랜 분쟁이 끝나야 한다는 뜻입니다. ...이미 파테르는 단독으로 권력을 장악할 동력을 잃었습니다. 가능할지는 모르지만, 두 분파간의 대립을 종결시키기 위해 노력해 보겠습니다.\"\n\"할 수 있는 만큼 돕겠습니다. 모든 것이 대전이 이전으로 돌아갈 수도 없고, 그리해서도 아니되나, 저는, 우리들의 관계만은 이전으로 돌아갈 수 있기를 바라니까요.\""
 trinity_events_nagisa.45.desc.generic: "히후미는 종종 나기사의 다과회장에 초청받고는 했다. 히후미 본인이 기뻐할지는 모르지만, 적어도 나기사는 그녀와의 만남을 좋아했다. 그러나 오늘의 만남은 이전과는 조금 달랐다. 히후미는 나기사에게 전하고 싶은 이야기가 있는 것 같았다.\n\n\"저는 나기사 님이 미카 님이랑 화해했으면 해요.\"\n\"화해... 라고 하셔도, 저와 미카 씨는 여전히 친구입니다.\"\n\"...그, 그렇지만요. 나기사 님과 미카 님. 벌써 몇 년째 제대로 만나시지 못하셨잖아요. 게다가 필리우스 분파 분들이 모이면 늘 미카 님을 '몰락시킬' 방법만 이야기하고 있고요. 저는 정치에 대해서는 잘 모르지만, 두 분이 이래서는... 안 된다고 생각해요.\"\n\n나기사는 손에 쥔 찻잔을 조용히 내려놓았다. 파테르와 필리우스의 분열은 나기사와 미카의 관계를 계속 소홀하게 만들고 있었다. 에덴 조약은 원래 미카를 보호하기 위한 것이었으나, 나기사는 미카를 비난하고 파테르를 증오하며 회담장에 들어섰다. 미카를 위해 구워 주던 롤케이크도 그만 둔지 몇 년이 지났다. 다과회장에 마주 앉아 마지막으로 미카와 함께 찻잔을 기울인 것이 언제였던가?\n\n그 모든 것은, '정치' 때문이었다. 필리우스와 파테르. 두 사람은 상대방을 부러뜨리지 않고서는 정상의 자리에 오를 수 없는 관계가 되어 있었으니까. ...하지만, 정치보다 중요한 것이 있지 않은가? 모든 권력을 쥔다고 해도, 그 옆에 소중한 사람이 없다면, 그 권력에 의미가 있는가? 나기사는 잠시 머뭇거리다 말했다.\n\n\"...네. 그렇다면, 노력해 보겠습니다. 허나, 미카 씨와의 진정한 화해는, 저와 미카 씨 사인간의 관계가 좋아지는 것으로는 완성될 수 없습니다. 필리우스와 파테르, 두 분파의 오랜 분쟁이 끝나야 한다는 뜻입니다. ...이미 파테르는 단독으로 권력을 장악할 동력을 잃었습니다. 가능할지는 모르지만, 두 분파간의 대립을 종결시키기 위해 노력해 보겠습니다.\"\n\"...가, 가능하다면 저도 도울게요. 나기사 님이, 힘들어 하시는 건 보고 싶지 않으니까요...\""
 trinity_events_nagisa.45.a: "어찌 나기사가 미카를 버리겠는가."
 trinity_events_nagisa.46.t: "필리우스-파테르 화해의 성공"
 trinity_events_nagisa.46.desc: "파테르는 필리우스에 대한 증오와 적의를 가지고 있었다. 하지만 필리우스 장기 집권이 현실화되고, 그녀들이 필리우스로부터 정권을 가져올 수 있는 합법적 방법은 이미 존재하지 않았다. 쿠데타 역시 나기사의 정의실현부 장악이 확실한 지금 방법은 없었다. 결국 필리우스와 파테르 사이의 분쟁을 종식하기 위한 회담이 열렸다. 미카와 나기사는, 서로 소꿉친구이면서 정치적 라이벌 관계라는 애증 관계를 이번 회담을 통해 종식하기를 바랐다.\n\n\"...파테르는 필리우스에 대한 모든 정치 공작에 대해 사과하며...\"\n\n그리고 이번 회담에서 파테르가 결국 고개를 숙였다. 파테르의 중진 임원들이 필리우스에 대한 적의를 포기하고, 당분간 '얌전한' 야권 세력으로 남아 있기로 결정한 것이다. 미카는 과거 에덴 조약 시기 사보타주를 시도했던 것을 인정하고 공식적으로 사과했고, 나기사가 그 사과를 받아들임으로서 대전이 이후부터 이어진 긴 정치 분쟁은 필리우스의 '판정승' 형태로 종결되었다.\n\n그리고 이제 미카는 다시 대전이 이전처럼, 외부의 눈치를 볼 것 없이 나기사를 만나러 갈 수 있을 것이다. 늘 미카의 자리가 비어 있던 다과회장에, 그녀는 이제 다시 나기사와 마주 앉아 작은 티타임을 가질 권리를 되찾았으니까. 대전이 이전의 모든 것을 그대로 되찾을 순 없지만, 적어도 미카는 작은 우정 하나를 되찾아냈다."
 trinity_events_nagisa.46.a: "그리하여, 그 모든 분쟁이 끝이 났군요."
 trinity_events_nagisa.47.t: "필리우스-파테르 화해의 실패"
 trinity_events_nagisa.47.desc: "파테르는 필리우스에 대한 증오와 적의를 가지고 있었다. 하지만 필리우스 장기 집권이 현실화되고, 그녀들이 필리우스로부터 정권을 가져올 수 있는 합법적 방법은 이미 존재하지 않았다. 쿠데타 역시 나기사의 정의실현부 장악이 확실한 지금 방법은 없었다. 결국 필리우스와 파테르 사이의 분쟁을 종식하기 위한 회담이 열렸다. 미카와 나기사는, 서로 소꿉친구이면서 정치적 라이벌 관계라는 애증 관계를 이번 회담을 통해 종식하기를 바랐다.\n\n미카 본인이 필리우스와의 관계 개선을 원하고 있었으나, 회담은 결국 실패로 끝났다. 파테르의 공작에 계속 피해를 입은 필리우스 내부에서 '마녀와 타협할 수 없다'는 분노가 쏟아져 나왔다. 나기사 본인도 미카에 대한 우정과 별개로 파테르 분파에 대한 경멸을 참아내지 못했다. 파테르 분파에서도 미카에 대한 정치적 압박으로 회담을 중단하도록 강요했다.\n\n\"...크로노스 뉴스의 카와루 시논입니다. 파테르와 필리우스, 두 분파의 화해는 에덴 조약보다 더 어려웠던 것 같습니다. 회담은 두 분파 임원들이 서로 멱살을 잡고 싸우며 파행! 과연 어떤 형태로 두 분파가 싸웠을까요? 크로노스 뉴스에서 대역배우들을 사용해 재현을...\"\n\n회담은 실패. 미카와 나기사는 여전히 '적대하는 두 분파의 수장'으로 남았다. 미카가 자유롭게 나기사를 만나러 오는 것은, 앞으로도 어려울 것이다."
 trinity_events_nagisa.47.a: "그래도, 시도 자체는 나쁘지 않았다고 해 두죠."
 trinity_events_nagisa.48.t: "미래 예지? 평행 우주?"
 trinity_events_nagisa.48.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\n나기사. 나기사도 알고 있겠지만, 저는 그래도 타인에게 예의 바른 존대만을 사용해 왔다고 자부하고 있습니다. 미카 씨에 비하면 굉장히 '레이디' 스럽다고 할 수 있지요. ...웃고 계신 건 아니지요? 그렇다고 믿겠습니다.\n\n제가 총탄에 맞고 잠들어 있었을 때, 저는 무한한 트리니티의 가능성을 보았습니다. 뭐 가능성이라 해도 절반이 배드엔딩이기에 썩 유쾌한 경험은 아니었습니다만. 중요한 것은 트리니티가 아닌 저에 대한 이야기입니다.\n\n이상하게도, 제가 경어를 쓰지 않고, 하게체 반말을 쓰는 세계가 꽤 많이 있었습니다. 하지만 저는 결단코 그런 식으로 말하는 사람이 아닙니다. 그래서 이런 추측이 들더군요. 사실 제가 바라보는 미래는 진짜 이 세계의 결정된 미래가 아닌, 시점이 지금보다 훨씬 뒤인 평행우주의 모습을 관측하는 것일 뿐이라고요. 물론 이것은 저의 가설일 뿐, 확정된 사실은 아닙니다. 어쩌면 제가 미래에 갑자기 '자네' 같은 말을 쓰게 될 지도 모르는 법 아니겠습니까?\n\n어쨌거나, 저는 이 문제를 개인적으로 연구해보고자 합니다. 고서관에서 할 수 있는 최대한의 정보를 얻는다면, 단서를 찾을지도 모르지요. 혹시 시미코와 같이 고서관의 금서들을 열람할 수 있게 허가해 주시겠습니까? 나기사라면 제 지적인 호기심 해결에 도움을 주리라 믿고 부탁드립니다."
 trinity_events_nagisa.48.a: "불가능할 건 없지요."
 trinity_events_nagisa.48.b: "저는 반말 세이아 씨의 비밀은 알고 싶지 않습니다..."
 trinity_events_nagisa.49.t: "나기사의 연임? 아니면..."
 trinity_events_nagisa.49.desc: "\n\n\n                                                   £GFX_report_event_TRM_hifumi_ajitani\n\n\n\n\n\n\n네? 그, 얼마 전 공의회를 통과한 헌법 반포일에 맞추셔서, 호스트 선거를 새롭게 치르신다고요? ...네에. 헌법이 바뀌니까요. 호스트직에 대한 재신임... 으음. 사실 저는 정치에 대한 깊은 지식은 없지만, 아하하. 대략적으로는 이해했어요. 나기사 님이 다시 한 번 선거에 출마해야 할지, 아니면 이제 '내려놓아야' 할 지 고민하고 있다는 걸요.\n\n저는 나기사 님에게 따로 조언을 드릴 만큼 굉장한 사람은 아녜요. 정치도 모르고, 사회도 모르고, 그냥 평범한... 그저 오늘 하루하루를 살아가는 데 급급한 한 명일 뿐이니까요. 하지만, 나기사 님의 고민을 들어주는 건 가능해요.\n\n...후후. 네! 그런 고민이 있으셨군요! ...이렇게, 가끔은 크게 고개를 끄덕거리기도 하면서요.\n\n최종 결정은 물론 나기사 님이 내리셔야 하겠지만, 나기사 님이 혼자 고민하시지 않으셔도 된다 생각해요. 나기사 님에게는 소중한, 지금까지 오랜 시간 쌓아 오신 '인연'이 있으시잖아요? 나기사 님은 지금까지 타인을 믿고자 노력해 오셨고... 또 많은 사람들의 조언을 들어 오셨으니까요.\n\n...네. 분명 좋은 사람을 찾으실 거라고 믿어요. 제가 아닌, 정말 좋은 분이요."
 trinity_events_nagisa.49.a: "아니요, 히후미 씨도 분명..."
 trinity_events_nagisa_49_a_tt: "§g지금까지 '타인을 믿는다'는 신념을 얼마나 관철해 왔나요? §Y키리후지 나기사§!§g는 지금까지 자신이 §G믿고, 신뢰해 왔으며, 인연을 쌓아 온 사람§!§g 중 한 명에게 호스트직을 물려줄 수 있습니다. 나기사가 직접 재선에 도전할 것인지는, 지금까지 나기사가 내린 여러 선택들에 따라 결정됩니다:\n§!"
 trinity_events_nagisa.50.t: "세이아와의 대화"
 trinity_events_nagisa.50.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\n권력을 넘겨주는 것에 대해 고민하고 계시다고요. 이해합니다. 나기사는 정말, 정말로 그 시간 동안 홀로 노력해 오느라 고생이 많았으니까요. 결국 최종 결정을 내리는 건 나기사이지만, 저는 당신이 더 이상 고통받지 않기를 바랍니다.\n\n저는 호스트가 되기 전, 아니, 티파티에 들어서기 전의 나기사를 기억합니다. 비록 미카만큼 잘 아는 것은 아니나, 저 역시 과거의 당신을 어느 정도는 꿰뚫어보고 있다고 생각합니다. ...지금의 '키리후지 나기사'는 본연의 모습이 아니잖아요. ...티파티라는 자리에 걸맞게 행동하기 위하여, 나기사는 언제나 스스로를 혹사하고 있었습니다. 그리고, 호기심 많고 다정한 원래의 당신을 유폐했습니다.\n\n저는 이제 당신이 그 무게를 내려놓아야 한다고 생각합니다.\n\n나기사가 아닌 다른 사람이 호스트직에 오른다 해도, 트리니티는 변치 아니할 것입니다. 나기사가 믿는 사람이 호스트가 될 것이며, 그 사람은 본디 가고자 하였던, 저 밤하늘의 찬란한 별빛 같은 미래를 향해 똑바로 나아갈 것이니까요. 나기사는 제가 없는 동안에도 타인을 믿기 위해 노력하였다고 들었습니다. 지금이, 그 때입니다. 믿으세요. 어느 사람을 믿더라도 개의치 않습니다. 허나, 그대가 믿는 그 사람이, 첫 번째 트리니티의 별을 분명 우리가 알지 못하는 저 미래까지 전달할 것입니다. 이것은 예언이 아닙니다. 저의 직감이자 확신이며, 나기사가 믿는 누군가를 향한 저의 '믿음'입니다."
 trinity_events_nagisa.50.a: "세이아 씨가 있어 주었기에, 지금의 제가 있습니다."
 trinity_events_nagisa_50_seia_tt: "§g호스트 선거 후보에 유리조노 세이아가 추가됩니다.§!"
 trinity_events_nagisa.51.t: "감찰관실에서의 시간"
 trinity_events_nagisa.51.desc: "\n\n\n                                                   £GFX_report_event_TRM_ako_amau_trinity\n\n\n\n\n\n\n... ... 푸에훙! 엣, 에에. 그러니까, 정권 교체의 조언을 전직 게헨나 선임행정관에게 물으신다는 말씀이신가요? 이거 그 몰래카메라나 그런 거 아니죠? 말 한마디 잘못 하면 문 바깥에 있는 정의실현부원들이 절 체포해서... 아니라고요? 후후. 쫄지 않았답니다. 티파티의 감찰관이자 엘리트 에이전트인 제가, 겁을 먹을 리가... 후우. 네. 좀 겁먹었어요. 됐어요?\n\n제가 당신에게 조언을 할 위치는 아니라고 생각하지만, 조언을 필요로 한다면, 말씀드릴게요. 당신에게는 오랜 친구인 세이아 씨나 히후미 씨 같은 좋은 사람들이 있잖아요? 그 사람들을 믿고, 배턴을 넘겨주어도 괜찮다고 생각해요. ...저는 당신의 '에덴 조약'이 게헨나인들을 위한 게 아니었다는 걸 알아요. 전쟁이 일어난다면 당신의 소중한 사람들이 다치거나, 더 나빠질 수도 있죠. 당신은 대전이 이전부터 세이아 씨나 미카 씨, 아니면 히후미 씨 같은 소중한 이들을 위해 에덴에서 그 조약의 초안을 써내려가지 않았나요?\n\n네. 저도 같았습니다. 제가 사랑하는 단 한 사람이 다치거나, 상처입거나, 그러지 않기를 바랐으니까. 그래서 실무 회담에서 발버둥 쳤을 뿐이예요.\n\n...그러니까 저도 알고 있어요. 제가 그 사람을 지키고 싶어한 만큼, 히나... 아니, 그 사람도 저를 지키고 싶어 하리라는 것을. 히후미 씨도, 세이아 씨도, 심지어는 파테르의 미카 씨도 같은 마음일 거예요. 호스트직을 그 사람들에게 물려주신다면, 분명, 나기사 씨가 그 사람들을 지키고자 한 만큼, 그 사람들도 나기사 씨를 지킬 거랍니다. 나기사 씨가 그 사람들을 지킨다고만 생각하지 마세요. 쌍방향. 후훗. 어때요? 좀 멋있었죠?"
 trinity_events_nagisa.51.a: "당신은 이상하지만, 나쁜 사람은 아니예요."
 trinity_events_nagisa_51_ako_tt: "§g호스트 선거 후보에 아마우 아코가 추가됩니다.§!"
 trinity_events_nagisa.52.t: "아리우스에서의 인연"
 trinity_events_nagisa.52.desc: "\n\n\n                                                   £GFX_report_event_TRM_nagisa_kirifuji\n\n\n\n\n\n\n...아리우스의 사람에게도 묻기로 한 거야? 후후, 약간 놀랐어. 아무리 트리니티가 내 '로얄 블러드' 혈통을 존중해 준다 해도, 내부 정치 상황까지 털어놓으며 상담할 거라고는 생각하지 않았는데.\n\n...조언, 이라. 어떤 말을 해야 할지 잘 모르겠어. 아리우스에는 투표 같은 제도가 없었으니까. 모든 것은 마담의 감정에 따라 결정됐지. 마담이 '내가 그러고 싶다'고 하면 그리 되는 거고, 거기에 다른 사람들의 생각을 듣는 절차는 없었어. 위는 지시한다. 그러면 아래는 따른다. 오직 그 뿐이니까.\n\n하지만 조언이 아닌 다른 이야기를 해 준다면... 으음, 사오리 이야기가 좋겠지? 예전에 나는 베아트리체에 의해 산제물로서 바쳐질 뻔 했어. 그런 나를 구해준 게 사오리야. 사실 이해타산으로 따지면 말이 안 되는 일이야. 나를 구해준다 해서 내가 사오리에게 줄 수 있는 것은 아무것도 없었거든. 하지만 사오리는 그저 '그래야 한다'고 믿었기에 나를 도왔어. 타인의 결정이나 지시에 따른 게 아니라, 자기 자신의 마음에 따랐을 뿐이지.\n\n나기사, 당신이 재집권을 하던, 아니면 호스트직을 내던지던, 타인의 이야기에 휘둘려서는 안 된다고 생각해. 뭐, 여기까지 들어버렸으니 이미 무리기는 하지만. 후후. 나기사 네가 '하고 싶은' 일을 해. 그게 옳은 선택이고, 또 호스트 본인을 위해 가장 좋은 선택이니까."
 trinity_events_nagisa.52.a: "타인을 믿는 만큼, '자기 자신'도 믿으라는 말씀이시군요."
 trinity_events_nagisa_52_atsuko_tt: "§g호스트 선거 후보에 하카리 아츠코가 추가됩니다.§!"
 trinity_events_nagisa.53.t: "그리고, 가장 소중한 너에게"
 trinity_events_nagisa.53.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\n안녕! 나기 쨩! 나한테 상담? 진짜 놀랐어... 아니, 놀랐다는 건 긍정적인 의미로! 나기 쨩에게 이런저런 조언을 해 준다니, 솔직히 즐겁잖아. 어렸을 때로 돌아간 기분이고. ...응. 그 때의 나기 쨩은 지금이랑 많이 달랐지. 웃음이 많았고, 다정했고... 그래서, 정치를 시작한 뒤의 나기 쨩은 많이 변했다. 그런 인상이었지.\n\n타인에게 호스트직을 물려주는 걸 고민 중이라... 으음. 나도 후보 중에 있어? 아핫☆ 농담이야. 파테르는 집권해서는 안 돼. 적어도, '나기 쨩 다음'은 안 돼. 내가 올라선다면, 나기 쨩이 소중하게 쌓아 올린 탑이 단번에 무너질 테니까.\n\n내가 해 줄 수 있는 조언이라. 나는 이제 나기 쨩은 정치 안 했으면 좋겠어. ...내 욕심 때문은 아니야. 나기 쨩이 변해간다는 느낌을 받아서 그래. 응. 분명 노력하고는 있어. 하지만, 나기 쨩은 '너무' 노력하잖아. 그게 좀, 아파.\n\n...만약 내게 선택권이 있다면...? 으음. 아코 감찰관은 어때? 아하하☆ 나기 쨩, 진짜 놀란 표정이네? 뭐, 나기 쨩이 진짜 그 사람을 뽑으라는 뜻은 아니야. '파테르 분파의 수장이 가장 고를 리 없는 선택지'를 말해 준 거지. 무슨 뜻이냐고? 이럴 때에는 역발상을 해야 한다는 거야. '필리우스 분파의 수장 키리후지 나기사'가 아니라 티파티에 들어오기 전. 내 입에 롤케이크를 더 과감하게 찍어 누르던, '인간 키리후지 나기사'의 선택지를 고르자. 그게 내가 말하는 역발상이야. 이해하지? 정치인 나기 쨩에게 보이는 선택지 중, 가장 '찾지 않을' 사람을 고른다. 그게 좋다고 생각해.\n\n아하핫☆ 뭐. 누구를 선택하든 그 선택을 축복할 게. 아니, 아무도 선택하지 않아도 돼. 나기 쨩이 백 년 정도 호스트를 더 해도 상관 안 할 거야. 그저... 나는 나기 쨩이 행복한 선택을 하기를 바랄 뿐이니까. 너를 위해서라면 나는... 아하하. 안 울었어. 정말로. ...응☆ 고마워."
 trinity_events_nagisa.53.a: "'필리우스의 나기사'가 고르지 않을..."
 trinity_events_nagisa_53_mika_tt: "§g이제 48시간 후, 티파티 호스트 선거가 실시됩니다.§!"
 ## 54-해피엔딩 이벤트 (나기사 이외의 인물이 당선)
 trinity_events_nagisa.54.t: "마법이 풀린 신데렐라에게"
 trinity_events_nagisa.54.desc.seia: "\"나, 나기사... 내가 잘못했습니다. 아니, 뭘 잘못했는지는 모르겠지만 잘못했습니다...!\"\n\n세이아의 비명 섞인 사죄가 들리지 않는다는 듯, 나기사는 선글라스를 쓴 채 해안도로를 달리는 스포츠카의 속도를 높였다. 호스트를 관두고, 완전한 자유를 얻은 뒤, 처음으로 세이아와 단 둘이 떠나는 자유여행이었다. 트리니티 북쪽 해안도로를 따라 달리는 동안, 나기사는 대전이 이후 한 번도 느낀 적 없었던 해방감을 느꼈다.\n\n\"진작에 이렇게 했어야 했는데 말이죠.\"\n\"...과속운전이요?\" \"호스트 사임 말이예요. 그리고 이 정도 속도면 그렇게 과속도 아닌 걸요.\"\n\"시속 300km을 우리는 '과속'이라고 부르기로 사회적으로 합의를 했습니다.\"\n\n세이아의 투덜거림에도 불구하고, 나기사는 해방감 속에서 핸들을 천천히 꺾었다. 키리후지 나기사는 차갑게 얼어붙어가고 있었다. 그건 대전이 때문이 아니라, 티파티에 들어서고 정치를 시작한 이후부터의 이른 변화였다. 나기사는 올바른 정치인이 되기 위해 모든 것을 의심해야 했고, 필리우스의 수장으로서 호스트가 되면서 가장 고독한 사람이 되어야만 했다.\n\n하지만, 그것은 소녀 키리후지 나기사가 아닌, 정치가 키리후지 나기사일 뿐이었다.\n\n나기사는 자신을 정치가로서 있게 하는 '의심암귀'를 버렸다. 오랜 적인 게헨나를 사랑하기로 했다. 자신을 적대하는 현지인들을 이해하기로 했다. 정적들을 용서하기로 했다. 그리고, 세이아를 숨긴 미네마저도 받아들이기로 했다. 그 모든 것들은 그녀가 평범한 소녀로 되돌아가기 위한 절차들이었다. 결국 자신의 권력과 지도력마저도 내려놓을 만큼 타인을 믿게 된 순간. 나기사는 나기사가 되었다.\n\n어느새 놀러 가기로 한 바닷가가 눈에 보일 만큼 가까워졌다. 나기사는 차의 속도를 점차 줄이며, 불어오는 바닷바람을 만끽했다. 신데렐라의 마법이 풀리고, 그녀의 몸을 감싼 멋진 옷들이 다시 거적떼기로 돌아간다고 하더라도, 그녀는 개의치 않았다."
 trinity_events_nagisa.54.desc.mika: "\"나, 나기사... 내가 잘못했습니다. 아니, 뭘 잘못했는지는 모르겠지만 잘못했습니다...!\"\n\"아하하☆ 나기 쨩 사실 이런 면모도 있었네?\"\n\n세이아의 비명 섞인 사죄, 그리고 옆에 앉은 미카의 깐죽거리는 목소리가 들리지 않는다는 듯, 나기사는 선글라스를 쓴 채 해안도로를 달리는 스포츠카의 속도를 높였다. 호스트를 관두고, 완전한 자유를 얻은 뒤, 처음으로 세이아, 미카와 셋이 떠나는 자유여행이었다. 트리니티 북쪽 해안도로를 따라 달리는 동안, 나기사는 대전이 이후 한 번도 느낀 적 없었던 해방감을 느꼈다.\n\n\"진작에 이렇게 했어야 했는데 말이죠.\"\n미카가 물었다. \"...과속운전?\" \"호스트 사임 말이예요. 그리고 이 정도 속도면 그렇게 과속도 아닌 걸요.\"\n\"와오... 시속 300km을 '과속'이라고 부르기로 사회적으로 합의가 된 거 아니야?\"\n\n미카의 투덜거림에도 불구하고, 나기사는 해방감 속에서 핸들을 천천히 꺾었다. 키리후지 나기사는 차갑게 얼어붙어가고 있었다. 그건 대전이 때문이 아니라, 티파티에 들어서고 정치를 시작한 이후부터의 이른 변화였다. 나기사는 올바른 정치인이 되기 위해 모든 것을 의심해야 했고, 필리우스의 수장으로서 호스트가 되면서 가장 고독한 사람이 되어야만 했다.\n\n하지만, 그것은 소녀 키리후지 나기사가 아닌, 정치가 키리후지 나기사일 뿐이었다.\n\n나기사는 자신을 정치가로서 있게 하는 '의심암귀'를 버렸다. 오랜 적인 게헨나를 사랑하기로 했다. 자신을 적대하는 현지인들을 이해하기로 했다. 정적들을 용서하기로 했다. 그리고, 세이아를 숨긴 미네마저도 받아들이기로 했다. 그 모든 것들은 그녀가 평범한 소녀로 되돌아가기 위한 절차들이었다. 결국 자신의 권력과 지도력마저도 내려놓을 만큼 타인을 믿게 된 순간. 나기사는 나기사가 되었다.\n\n어느새 놀러 가기로 한 바닷가가 눈에 보일 만큼 가까워졌다. 나기사는 차의 속도를 점차 줄이며, 불어오는 바닷바람을 만끽했다. 신데렐라의 마법이 풀리고, 그녀의 몸을 감싼 멋진 옷들이 다시 거적떼기로 돌아간다고 하더라도, 그녀는 개의치 않았다."
 trinity_events_nagisa.54.a: "호스트가 아니더라도, 나기사는 나기사니까."
 trinity_events_democratic_nagisa_happy_ending_tt: "§g뭔가 멋있는 말 입력§!"
 ## 55-배드엔딩 이벤트 (민주 루트이면서 나기사가 정권을 계속 유지)
 trinity_events_nagisa.55.t: "구제불능의 의심암귀"
 trinity_events_nagisa.55.desc: "\"저로서는 나기사의 선택이 옳았는지 모르겠군요.\"\n\n세이아의 안타깝다는 표정을 뒤로,"
 trinity_events_nagisa.55.a: "트리니티의 미래를 누구에게 맡기겠는가?"
 trinity_events_democratic_nagisa_bad_ending_tt: "§g뭔가 멋있는 말 입력§!"
 TRM_democratic_nagisa_ending_flag: "나기사 이야기의 §G엔딩§!이 펼쳐졌습니다."
 ## 엔딩 이후 이벤트
 trinity_events_nagisa.56.t: "독사굴" # 히후미 호스트
 trinity_events_nagisa.56.desc: "\"이름.\" \"우라와 하나코요. 뭐, 저 정도 유명인이면 알고 있을 거 같은데요?\"\n\"알 게 뭐야. 내가 에덴 한복판에서 옷 다 벗고 뛰어다니는 변태 이름까지 외워야 해? 사형이야! 사형!\"\n\n정의실현부 간부, 시모에 코하루는 날카로운 눈매로 하나코를 노려보았다. 사실 '모른다'는 말은 거짓말이었다. 정의실현부 내부에서도 이 노출 좋아하는 여자에 대한 명성은 굉장했으니까. 그저 직접 만난 것이 오늘이 처음이었을 뿐이다. 코하루는 헛기침을 하며, 일부러 거친 형사처럼 몸을 앞으로 조금 뺐다.\n\n\"우라와. 그래서 이런 일은 '왜' 한 거야? 대전이 전까지만 해도 굉장히 착실하게 살았다고 기록되어 있는데.\"\n\"대전이라... 굉장히 낡은 기록을 좋아하시네요? 후훗. 뭐, 트리니티의 뱀 같은 면모가 마음에 들지 않았을 뿐이랍니다.\"\n\"뱀이라고? 우리 트리니티가 뭐 어때서.\"\n\"필리우스니 파테르니 상투스니... 멋들어진 옷 입고 대전이가 일어난 뒤에도 권력 다툼에 사로잡혀 아웅다웅. 나기사 씨는 자기가 그런 트리니티를 '바꿨다'고 기세등등하지만, 어디서 데려온지도 모를 아지타니 히후미라는 여자는, 한 번도 대중 앞에 나타난 적 없는, 비선 조직의 일원일 뿐이잖아요? 인맥 정치. 파벌 정치. 그런 기분 나쁜 위선들에 사로잡힌 '문명인들' 보다, 옷 한 벌 입고 다니지 않는 '야만인들'이 더 좋다고 생각치 않으신가요? 네. 그래서 벗었답니다. 문명도, 트리니티도, 호스트도, 다 쓰레기다. 위선이다. 이 독사굴의...\"\n\n코하루는 하나코의 끝없이 이어지는 장광설에 메스꺼움을 느꼈다. 자신은 다른 사람들과 달리 무언가를 깨달았다고 생각하고 잘난 체 하지만, 그래서 한 일이 옷 벗고 뛰어다니기야? 물론 그, 옷 벗고 뛰어다니는 행동 자체는 아주 조금... 흥미가 가기도 했지만... 그래도, 그 동기도, 행동도 궤변일 뿐이었다. 코하루는 서류를 덮었다. 심문은 끝났다. 이 여자와는 인생에서 다시는 마주칠 일이 없으리라.\n\n\"됐으니까 이만 나가. 나는 다른 나쁜 놈들도 심문해야 하는 아주 바쁜 사람이니까.\" \"어머나... 후훗. 네. 그러면 이만 나가보도록 하죠. 평안하시기를, 시모에 씨.\"\n\n코하루는 사라지는 하나코의 뒷모습을 냉소적으로 쳐다보다, 고개를 돌렸다. 행위예술가들이란 이해할 수가 없다. 나기사니 히후미니. 높다란 저 구름 위 세상 속 호스트가 누가 되든, 우리들과 무슨 상관이 있겠는가. 평생 만나지도 못할 사람들인데. 코하루는 공원에서 방독면을 쓰고 난동을 부리다 체포되었다는, 알지 못하는 다른 이름을 불렀다."
 trinity_events_nagisa.56.a: "\"다음. 시라스 아즈사.\""
 trinity_events_nagisa.57.t: "본 적 없는 미래" # 세이아 호스트
 trinity_events_nagisa.57.desc: "\"돌아왔군요. 이 자리, 제가 있어서는 안 될 것 같은 그 자리로.\"\n\n세이아는 의자에 앉았다. 오랜 시간 나기사가 사용하던, 터무니없을 정도로 멋들어진 의자는 세이아에게는 조금 불편했다. 세이아는 호스트 집무실의 펜을 하나씩 만져 보았다. 이제는 흐릿한 꿈 속의 추억으로 남은 '첫 번째 임기' 시절과 조금도 변하지 않았다. 달라진 것은 몇 년간의 공백 뿐이다.\n\n\"저는, 제가 이곳에 돌아오리라고는 예상치 못했죠.\"\n\n세이아는 희미한 미소를 지었다. 미래를 보는 위대한 예언자라고 하면서도, 그녀는 자신이 호스트로 복귀하리라는 것을 조금도 예측하지 못했다. 총에 맞고 의식불명이었을 때 본 무수한 가능성 중에도, 이 미래만은 존재하지 않았다. 그렇다면 지금 이 순간은 무엇이란 말인가? 어쩌면, 세이아 자신의 미래 예지는 완벽하지 않다는 것일까? 세이아는 차라리 그것이 더 기쁘다고 생각했다. 모든 것을 아는 것보다, 미래를 직접 '개척'하는 것이 좋지 않은가? 그리고, 개척이라는 위대한 임무는 이제 세이아에게 맡겨졌다.\n\n예언이 없어도 괜찮다. 미래 예측이 틀리더라도 상관치 않다. 미래에 어떤 고난이 생기더라도, 나기사와 미카가 있다면 그 어려움을 분명히 넘어설 수 있을 테니까."
 trinity_events_nagisa.57.a: "여태까지 그래왔듯."
 trinity_events_nagisa.58.t: "백의의 전사의 죽음" # 미네 호스트
 trinity_events_nagisa.58.desc: "\"호스트 님, 구호기사단에서 내년 예산안 증대를 요청했습니다. 운영위원장님이 직접 쓰셨으니 읽어주시기를.\"\n\n미네는 고개 숙인 세리나의 공손한 서류를 넘겨받으며, 가벼운 메스꺼움을 느꼈다. 구호기사단장인 자신이 조금도 관여하지 않은, 이름도 모르는 '위원회' 따위가 써내려간 예산안. 미네가 호스트가 된 이후, 그녀는 구호기사단에서 점점 멀어지고 있었다. 안락한 의자에 앉아, 정치인들과 다과회를 가지며 트리니티의 미래를 논하는 하루하루. 하지만 그 일상에, '구호'도, '환자'도 더 이상 존재하지 않았다. 마치 미네가 구호기사단이 아닌 외부의 높으신 분이라도 되는 것 같은 세리나의 말투는, 미네가 지난 한 달 동안 잊고 있었던 현실을 억지로 끌어냈다.\n\n\"저는... 제가 구호기사단장인데, 왜 구호기사단이 제 승인 없이 이런 서류를...\"\n\n미네는 화를 내려고 했다. 하지만, 도저히 그럴 수 없었다. 구호기시단이 미네를 버린 것이 아니다. 아오모리 미네가, 구호를 버렸다. 미네는 조금씩 눈가가 젖어오는 것을 느꼈다. 대전이 이전부터 우려해 온 일이었다. 원한다면 언제라도 티파티에 들어갈 수 있는 권한을 가진 '요한 분파의 수장'. 하지만, 미네는 결코 그리하지 않았다. 자신이 정치인이 되는 순간, 멋진 가면을 쓰고 멋들어진 허세를 부리기 시작하는 순간, 정계 바깥에 있었기에 가능했던 그 순수한 의지를 잃어버릴 것이라는 걸 알고 있었으니까.\n\n\"...세리나.\" \"넷, 네?\" \"지금 당신 앞에 있는 사람이 누구로 보이십니까?\"\n\"그, 그게 무슨 말씀...\" \"지금의 저도 여전히 미네 단장입니까? 아니면... '호스트 님'일 뿐입니까?\"\n\n긴 침묵이 이어졌다. 세리나는 무어라 대답하려 했지만, 결국 고개를 떨구었다. \"죄송합니다...\" 그 사과가, 대답이었다. 미네는 예산안을 강하게 쥐었다."
 trinity_events_nagisa.58.a: "\"이건 승인할 테니... 잠시 혼자 있게 해 주세요.\""
 trinity_events_nagisa.59.t: "자신이 할 수 있는 일" # 아코 호스트
 trinity_events_nagisa.59.desc.hina: "\"새로운 친구를 사귀는 것은 늘 좋은 법이죠. 그것이 어느 상대라 하더라도 말입니다.\"\n\n세이아는 실내 사격장에서 아코를 이긴 게 퍽 즐거운지, 카우보이처럼 잘난 체 하며 권총을 빙그르르 돌렸다. 병원에서 의식불명 상태로 몇 년을 보낸 세이아에게 진 아코는 억울해 미칠 지경이었지만.\n\n\"조작...! 뭔가 조작이 있었던 거예요! 제가 호스트가 되었는데도 조작을...\"\n\n히나가 부드럽게 웃으며, 아코의 옷 소매를 당겼다. \"뭐, 중요한 건 승패가 아니잖아? 오늘 하루 재밌었다는 거지.\"\n\n그녀의 말이 맞았다. 뭐, 이기고 지고가 무슨 상관이겠는가. 아코는 억울함을 잠시 눌러 놓은 채 다시 걷기 시작했다.\n\n호스트 선거 이후, 세이아는 점점 자주 찾아왔다. 표면적인 이유는 타 학원 출신인 아코와, 상투스 출신인 세이아 두 명 모두가 트리니티의 정치적 마이너리티이기 때문에 전략적으로 협조해야 한다는 것이지만, 두 사람 다 딱히 '정치질' 하는 성격은 아니지 않은가. 언젠가 세이아에게 진짜 이유에 대해 물은 적이 있었다. 그 때, 세이아는 이렇게 말하고는 했다.\n\n\"저는 몇 년 동안이나 코마 상태로 병원에 누워만 있지 않았습니까? 그래서 나기사나 다른 트리니티 태생 사람들은 저를 그냥... '과보호'하려 합니다. 마치 깨질 것 같은 유리잔을 보는 것처럼요. 그건 분명 편견이지요. 제가 병원에 누운 것은 희귀병 때문이 아닌, 저격 때문이었으니까요. 하지만, 이민자인 아코는 저를 그렇게 대하지 않습니다. 그게 좀 마음 편하더군요. 바라보는 자리가 달라지면 세상의 풍경도 바뀝니다. 아코 호스트에게만 보이는 풍경, 그렇기에 아코 호스트만이 할 수 있는 일들이 있겠죠. 저는 그걸 알고 싶었습니다.\"\n\n아코는 잠시 눈을 감았다 떴다. 세이아는 빙그르르 돌리던 권총을 홀스터에 꽂았다. \"제 사격에 감탄하셨나요? 그렇게 저를 쳐다보고 계시는 게 수상하군요.\"\n\"감탄이라뇨. 그냥... 딴 생각을 좀 했을 뿐입니다.\"\n\n나만이 볼 수 있는 세상이라. 무엇이 되었든, 자신만이 두 사람을 지킬 수 있다면 그렇게 해야겠지. 두 사람의 왁자한 웃음소리와 미소와 함께, 아코는 자신에게 주어진 이 오늘에 감사하기로 결정했다."
