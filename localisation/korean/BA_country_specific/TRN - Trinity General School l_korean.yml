 TRN_army_ns: "트리니티 지상군"
 TRN_army_ns_desc: "수백 년 전, 트리니티의 지상 병력은 서로 간의 '내전'을 통해 군사적 역량을 빠르게 발전시켜 왔고, 이러한 실전 경험은 교리의 이론적·전술적 성장으로 이어졌습니다. 이후 트리니티가 하나의 신념과 가치 아래 통합되면서, 비록 그 격동의 시기는 잊었을지언정, 그로부터 얻은 교훈만은 결코 잊지 않았습니다."
 TRN_navy_ns: "트리니티 해군"
 TRN_navy_ns_desc: "트리니티에게 '해군'이라는 개념은 다소 낯설 수 있지만 결코 타 학원에 뒤처지지 않습니다. 우리는 많은 이들에게 바다의 중요성을 일깨웠고 오늘도 승리에 대한 굳은 믿음을 안고 당당히 출항합니다."
 TRN_airforce_ns: "트리니티 항공군"
 TRN_airforce_ns_desc: "트리니티 항공군의 시초, 항공의 어머니가 하늘에 새로운 지평을 열었을 때, 우리는 단순한 비행을 넘어선 군사적 패러다임의 전환을 맞이했습니다. 오늘날까지도 트리니티 항공군은 하늘에서의 승리가 지상에서의 승리를 이끈다는 신념 아래 날아오르고 있습니다."


 TRN_joint_security_organization_ns: "[GEH.GetAdjective]-[TRM.GetAdjective] 국제치안위원회"
 TRN_joint_security_organization_ns_desc: "이 조직은 트리니티에서부터 게헨나 선도부에 이르기까지, 두 정부 사이의 사법 및 치안 공조를 위하여 만들어졌습니다. 범죄 용의자가 두 학원 경계를 넘나드는 경우 위원회는 정의실현부와 선도부의 공조 수사를 지휘해 치안을 함께 유지합니다."
 TRN_military_mission_generic_ns: "[TRM.GetAdjective] 군사자문단"
 TRM_JTF_intelligence_ns: "정의실현부"
 TRM_JTF_intelligence_ns_desc: "정의실현부에 방첩 역할을 부여하고 그 규모를 더욱 확대했습니다. 티파티의 지시에 따르는 직속 부대로서, 정의실현부는 우리를 위한 가장 강력한 검이 될 것입니다."
 TRN_german_new_culture_order_modifier: "독일의 새로운 문화적 질서"
 TRN_german_new_culture_order_modifier_desc: "독일의 새로운 문화적 질서가 떠오르고 있습니다. 트리니티에 의해 지배되는 독일 사회는 우리의 영향력 아래에서 변화해 갈 것입니다. 그것이 긍정적이든, 그렇지 않든요."
 TRN_german_new_culture_order_modifier_change: "§Y$TRN_german_new_culture_order_modifier$§! 변동치"
 TRN_german_new_religion_ns: "시스터후드 주도 개종 계획"
 TRN_german_new_religion_ns_desc: "트리니티 신앙으로 현지인들을 개종시키기 위하여 예산이 투자되고 있습니다."
 TRN_german_harmony_religion_ns: "종교 프로파간다 계획"
 TRN_german_harmony_religion_ns_desc: "트리니티 신앙과 현지 신앙은, 같은 신을 다른 방식으로 모시는 것일 뿐이라는 프로파간다가 실시되고 있습니다."
 TRN_trinity_crusade_ns: "트리니티 십자군"
 TRN_trinity_crusade_ns_desc: "트리니티 신앙의 전파를 위하여, 십자군은 무신론자와 이교도들과 맞서 싸우며 트리니티의 질서를 수호하기로 맹세했습니다."
 TRM_nagisa_constitution_modifier: "나기사 헌법"
 TRM_nagisa_constitution_modifier_desc: "트리니티를 위한, 키리후지 나기사의 주도로 만들어진 나기사 헌법입니다. 이 헌법은 앞으로 100년 이상 트리니티의 미래 방향성을 결정할 것입니다."
 TRN_first_but_reworked_ns: "자유주의 과두제 이상"
 TRN_first_but_reworked_ns_desc: "권위적인 과두제 체제 아래에서 허가되는 문화적 자유. 이것은 '첫 번째 트리니티의 이상'이라는 전통의 보존 아래에서 국가 개혁을 이끌어 나가고자 하는, 필리우스 분파의 오랜 타협의 결실이기도 합니다."
 TRN_new_and_free_trininy_culture_ns: "신시대 트리니티 문화"
 TRN_new_and_free_trininy_culture_ns_desc: "트리니티의 문화는 주변 학원들과의 교류를 통하여 발전하였으며, 많은 키보토스 학원들의 선망의 대상이 되었습니다."
 TRN_bureau_of_railways_ns: "트리니티 철도국"
 TRN_bureau_of_railways_ns_desc: "전선으로 더 많은 병력을 실어 나르기 위하여, 트리니티 철도국 주도의 특별 프로젝트가 진행되고 있습니다."
 TRN_pater_hate_naginagi_ns: "필리우스-파테르 분쟁"
 TRN_pater_hate_naginagi_ns_desc: "필리우스와 파테르의 분쟁은 대전이 이전에도 존재하였으나, 그 규모와 수준은 점점 격화되어가고 있습니다. 파테르는 독일 노동자들을 선동해 계속해서 파업을 일으키도록 유도하고, 트리니티계에게는 병역 거부를 유도합니다. 그녀들은 키리후지 나기사 호스트의 반전주의, 친게헨나적 사상에 대한 강한 거부를 기반으로, 미소노 미카의 지도 아래에 정국을 방해합니다.\n\n그리고 필리우스 임원들은 이 사실을 잊지 않을 것입니다. 비록 게헨나와의 분쟁이 영구적으로 종결된 뒤라고 하더라도요."
 TRN_pater_hate_naginagi_ns_tt: "\n에덴 조약 체결시 악화:국민정신의 효과는 §Y에덴 조약§!이 §Y성공§!하면 악화됩니다."
 TRN_pater_hate_naginagi_remove_ns_tt: "\n게헨나와의 전쟁시 제거:§Y[GEM.GetName]§! 또는 §Y[GEH.GetName]§! 측과의 전쟁 중."
 TRN_pater_hate_naginagi_trigger_tt: "§Y$TRN_pater_hate_naginagi_ns$§! 국민정신을 보유 중."
 TRN_sending_missionaries_ns: "트리니티 신앙의 영향"
 TRN_sending_missionaries_ns_desc: "트리니티 시스터후드의 선교사들은 우리 영토에서 전통과 기존 질서에 순응하도록 하는 신앙을 전파하고 있습니다. 새로운 신앙의 신자들은 정부에 반대하지 않고, [ROOT.GetLeader] 지도자에게 순응하면서 노동하는 것을 가장 올바른 미덕으로 알게 될 것입니다."
 TRN_attack_pater_ns: "파테르 기소"
 TRN_attack_pater_ns_desc: "무차별적인 파테르 임원들에 대한 기소는 그들의 사보타주를 약화시키지만, 동시에 우리 정국의 혼란을 가져오기도 합니다."
 TRN_connection_to_vigilante_ns: "자경단의 지원"
 TRN_connection_to_vigilante_ns_desc: "파업에 참여하는 독일 노동자들을 자경단이 검거하고 있습니다."
 TRN_seia_host_ns: "유리조노 세이아"
 TRN_seia_host_ns_desc: "시스터후드 쿠데타 이후, 우타즈미 사쿠라코는 자신이 호스트가 되는 대신 명망 있는 정치인인 유리조노 세이아를 트리니티의 상징으로서 호스트직에 복귀시켰습니다. 그러나 현실적으로 볼 때, 세이아는 그 어떠한 정치적 결정도 직접 내릴 수 없는 상징적 지도자일 뿐입니다."
 
