 TRM_abbess_for_all_europa: "가장 고귀한 수녀원장"
 TRM_mari_pop_idol: "인기 있는 수녀"
 TRM_attached_to_filius: "필리우스 분파 소속"
 TRM_attached_to_filius_desc: "§L이 인물은 필리우스 분파 소속으로서, 트리니티의 전통과 고결함을 수호하기 위하여 노력합니다.§!"
 TRM_attached_to_pater: "파테르 분파 소속"
 TRM_attached_to_pater_desc: "§L이 인물은 파테르 분파 소속으로서, 두 번째 트리니티의 이상을 실현하기 위하여 필리우스와 대립합니다.§!"
 TRM_host_nagisa: "다색의 호스트\n§g나기사는 수많은 업적을 이루어냈으며, 트리니티의 가장 고결한 자리에 섰습니다. 그녀는 노블리스 오블리주의 의무를 완수하기 위하여 다시 한 번 호스트가 되었습니다. 영구적인 귀족과두정 체제가 그녀의 치세 아래에서 이루어질 것입니다.§!"
 TRM_host_hifumi: "무색의 호스트\n§g히후미는 여전히 키리후지 나기사의 정치적 영향력 아래에 있으며, 본인이 직접 내리는 결단은 사실상 없습니다.§!"
 TRM_host_hifumi_2: "회색의 호스트\n§g정치적 초심자였음에도 불구하고, 히후미는 빠르게 자신만의 색을 찾아가고 있습니다.§!"
 TRM_host_hifumi_3: "흑색의 호스트\n§g왜 그 분은 히후미에게만 이렇게 잔인했을까요?§!"
 TRM_host_seia: "황색의 호스트\n§g예언자인 세이아는 자신이 다시 호스트직에 복귀하는 미래는 본 적이 없습니다. 어쩌면 미래는 확정적인 것이 아닌, 우리의 선택으로 변할 수 있는 것이 아닐까요? 세이아는 자유의지를 중시하며 예언의 가치를 이전보다 낮게 두게 되었습니다.§!"
 TRM_host_seia_2: "$TRM_host_seia$"
 TRM_host_mine: "녹색의 호스트\n§g요한 분파의 수장으로서 티파티에 들어서지 않고 구호에 전념하겠다는 신념은, 외부적 요인으로 인해 꺾였습니다. 미네는 점차 현실에 굴복하고 있으며, 티파티 회의에서는 자신을 '구호기사단장'이 아닌 '요한 분파의 수장'으로만 소개합니다.§!"
 TRM_host_ako: "청색의 호스트\n§g비록 방첩기관과 관료제도의 확장에 관심이 많기는 하지만, 아코는 트리니티의 고결한 귀족과두제를 존중하며, 새로운 관료 계급이 정치에 관여하지 못하는 현 체제의 현상유지를 지지합니다.§!"
 TRM_host_ako_2: "$TRM_host_ako$"
 TRM_host_atsuko: "자색의 호스트\n§g비록 가장 낮은 서민들의 복지 문제에 관심이 많기는 하지만, 아츠코는 트리니티의 고결한 계급주의를 존중하며, 서민들이 정부 정책에 관여하지 못하는 현 체제의 현상유지를 지지합니다.§!"
 TRM_host_atsuko_2: "$TRM_host_atsuko$"
 TRM_host_takane: "적색의 호스트\n§g고결한 외국 귀족 가문의 호스트임에도 불구하고 검소한 성향을 보이는 그녀는, 트리니티 역사상 가장 친서민적인 호스트로 남을 것으로 예상됩니다.§!"
 TRM_hidden_trait_takane: "겨울 왕국의 여대공?"
 TRM_hidden_trait_takane_2: "겨울 왕국의 여대공"
 TRM_hidden_trait_takane_3: "겨울 왕국의 여대공!\n§g겨울 왕국의 여대공은 모두가 사랑하는, 트리니티의 고결한 로열 블러드이자, 만민의 사랑 받는 지도자입니다.§!"
 TRM_cynical_skeptic_nagisa: "의심암귀\n§g하지만, 타인을 믿기 위해 노력하고 있습니다. 나기사 본인의 정치적 감각이 아무리 비명을 지르더라도.§!"
 TRM_cynical_skeptic_hifumi: "구제불능의 의심암귀\n§g나기사 님, 저는 당신이 남긴 모든 것을 증오합니다.§!"
 TRM_self_sacrifice_nagisa: "자기희생"
 TRM_JTF_intelligence_hasumi_ns_tt: "민간, 육군, 해군, 공군 정보: §G+10%§!"
 TRM_JTF_intelligence_upgrade_ns_tt: "민간, 육군, 해군, 공군 정보: §G+10%§!"
 TRM_cynical_skeptic_tt: "  - 민간, 육군, 해군, 공군 정보: §G+10%§!"
 TRM_nagisa_route_mika_trait: "$TRN_queen_of_the_night$"
 TRM_kiosk_hater: "과학기술에 무지함\n§g아직 키오스크 쓰는 법을 익히지 못했습니다.§!"
 TRM_host_nagisa_neutrality: "다색의 호스트\n§g어느 누구보다도 자신의 분파를 믿고 아낍니다.§!"
 
 TRN_Trait_active: "§G(활성화)§!"
 TRN_Trait_inactive: "§R(비활성화)§!"
 TRN_nagisa_1: "§Y필리우스의 자부심§!\n§W필리우스 분파의 영향력를 50 이상으로 유지하세요.§!"
