 ##스타트 
 COU_establishment_of_emergency_measures_committee_NOT: "행정위원회 소집"
 COU_establishment_of_emergency_measures_committee: "키보토스 비상대책위원회"
 COU_establishment_of_emergency_measures_committee_NOT_desc: "1936년 신년이 밝았고, 총학생회장은 지난 2개월 동안의 실수와 실패를 교훈삼기 위해 실장들을 소집했습니다. 몇 개월 동안 행정위원회는 전이의 여파를 마무리짓고 신년을 준비할 것입니다."
 COU_establishment_of_emergency_measures_committee_desc: "총학생회장이 행방불명되고 얼마 안 돼서 나타난 자칭 연방수사동아리 \"샬레\"는 총학생회장의 명령에 따라 총학생회가 샬레에 병합되어야 한다는 말도 안 되는 요구를 제시하고 있습니다. 이에 나나가미 린 수석행정관은 본인의 권한으로 총학생회장 권한대행을 맡음과 동시에 키보토스 비상대책위원회를 소집하기로 하였습니다."
 
 COU_support_nanagami: "수석 행정관의 구조적 개편"
 COU_support_nanagami_desc: "수석 행정관, 나나가미 린은  대전이 이후 크게 달라지지 않은 행정위원회의 실책을 지적하면서 근본적인 원인을 해결하기 위한 구조적 개편을 제안했습니다. 이것은 최우선적으로 이행되어야 하는 사안임이 분명합니다."
 COU_united_netherlands_law: "저지대 연합법"
 COU_united_netherlands_law_desc: ""
 COU_survivor_of_kivotos: "키보토스 안정의 보장"
 COU_survivor_of_kivotos_desc: ""
 COU_support_oki: "재무실장의 재무구조 검토"
 COU_support_oki_desc: "재무실장 오키 아오이는 대전이 이후 붕괴한 총학생회의 권위와 더불어 재무구조가 끔찍할 정도로 망가졌다는 사실을 지적하면서 모든 개혁의 우선점은 경제에 집중되어야 한다고 주장했습니다. 당연히 이는 최우선적으로 이행되어야 합니다."
 COU_expropriate_industrialist: "확실한 해결책"
 COU_expropriate_industrialist_desc: ""
 COU_integration_of_puppet_economies: "현지 자본 매수"
 COU_integration_of_puppet_economies_desc: ""
 COU_support_shiranui: "방위실장의 학원방위계획"
 COU_support_shiranui_desc: "대전이와 함께 총학생회가 보장하던 평화가 깨진 지는 오래입니다. 그렇기에 방위실이 오래전부터 구상해온 계획은 대다수가 쓸모 없게 되었으며, 방위실장 시라누이 카야는 이점을 지적했으니 이를 최우선적으로 이행해야 할 것입니다." 
