 ##키보토스 얼라이언스 
 COU_kivotos_alliance.1.t:0 "조약기구 의장국의 원정군 파병 결정"
 COU_kivotos_alliance.1.desc:0 "키보토스 협력기구 회원국중 하나가 비회원국에게 공격을 받았고, 조약기구의 의장국은 해당 회원국을 보호하기 위해 원정군을 파견하기로 결정했습니다.\n\n우리가 해당 원정군 파견에 동참할 지 결정해야 합니다."
 COU_kivotos_alliance.1.a:0 "키보토스를 수호하라!"
 COU_kivotos_alliance.1.b:0 "지금은 적을 늘릴 때가 아니다."

 COU_kivotos_alliance.2.t:0 "키보토스 조약기구의 불가침 조약"
 COU_kivotos_alliance.2.desc:0 "키보토스 조약기구의 의장국이 키보토스 협력기구 국가 간의 전쟁을 금지하는 조약을 발의했습니다. 의장국은 해당 조약을 강경하게 밀어붙일 생각인 것 같으며, 우리는 해당 조약에 대한 입장과 조약기구를 탈퇴할지에 대한 여부를 결정해야 합니다."
 COU_kivotos_alliance.2.a:0 "조약에 서명한다."
 COU_kivotos_alliance.2.b:0 "내정 간섭이다."

 COU_kivotos_alliance.3.t:0 "[FROM.GetName]의 평화 조약 탈퇴"
 COU_kivotos_alliance.3.desc:0 "최근 [FROM.GetName]의 정권이 교체된 이후, [FROM.GetName]측은 우리를 향해 평화 조약을 탈퇴하겠다고 선언했습니다."
 COU_kivotos_alliance.3.a:0 "조약에 따라 추방한다."
 COU_kivotos_alliance.3.b:0 "지금은 적을 늘릴 때가 아니다."

 COU_kivotos_alliance.4.t:0 "경찰 학교 지위 복원"
 COU_kivotos_alliance.4.desc:0 "생텀 타워의 지배 권한이 이양된 이후, 경찰 학원의 지위가 일시적으로 동결되었으나, 우리는 새로운 총학생회를 기다렸고, 이내 우리의 권한이 복원되었습니다.\n\n우리는 이제 다시 키보토스의 경찰 학교로써 일을 다시 시작할 수 있습니다."
 COU_kivotos_alliance.4.a:0 "음, 좋은건가?"

 COU_kivotos_alliance.5.t:0 "키보토스 연합"
 COU_kivotos_alliance.5.desc:0 "키보토스 연합은 키보토스의 모든 학원을 하나로 묶는 연합입니다. 이 연합은 키보토스의 안정을 위해 만들어진 것으로, 모든 학원의 학생들이 하나로 묶여, 키보토스의 안정을 위해 노력하고 있습니다.\n\n우리는 이제 키보토스 연합에 가입할지, 또는 독립하여 키보토스의 안정을 위해 노력할지를 결정해야 합니다."
 COU_kivotos_alliance.5.a:0 "연합에 가입하자."
 COU_kivotos_alliance.5.b:0 "우리는 혼자서도 충분하다."

 COU_kivotos_alliance.6.t:0 "[FROM.GetName]의 연합 가입"
 COU_kivotos_alliance.6.desc:0 "[FROM.GetName]은 키보토스 연합에 가입하였습니다."
 COU_kivotos_alliance.6.a:0 "우리는 키보토스의 안정을 위해 노력할 것이다."

 COU_kivotos_alliance.7.t:0 "[FROM.GetName]의 연합 거부"
 COU_kivotos_alliance.7.desc:0 "[FROM.GetName]은 거절 의사를 밝혔습니다."
 COU_kivotos_alliance.7.a:0 "알았다."

 COU_kivotos_alliance.8.t:0 "[FROM.GetName]의 키보토스 협력기구 가입 요청"
 COU_kivotos_alliance.8.desc:0 "키보토스 협력기구에 [FROM.GetName] 측이 가입 의사를 밝혀왔습니다.\n\n[FROM.GetName]측은 키보토스 협력기구 회원국이 아니었으나, 국제 정세의 변화로 우리와 함께하고자 하는 것으로 보입니다."
 COU_kivotos_alliance.8.a:0 "동맹은 많을수록 좋다."
 COU_kivotos_alliance.8.b:0 "믿을 수 없는 국가다."

 COU_kivotos_alliance.9.t:0 "키보토스 협력기구 가입 성공"
 COU_kivotos_alliance.9.desc:0 "키보토스 협력기구에 가입하고자 하는 우리 정부의 노력은 [FROM.GetName] 측이 우리의 협력기구 가입에 승인하면서 결실이 맺어졌습니다."
 COU_kivotos_alliance.9.a:0 "원하던 결과야."

 COU_kivotos_alliance.10.t:0 "키보토스 협력기구 가입 실패"
 COU_kivotos_alliance.10.desc:0 "키보토스 협력기구에 가입하고자 하는 우리 정부의 노력에도 불구하고, 키보토스 협력기구의 의장국은 우리 정부가 협력기구에 가입하는 것을 거절하였습니다."
 COU_kivotos_alliance.10.a:0 "우리 없이도 잘 할 수 있나 보자고."

 COU_cooperative_treaty_ratification: "키보토스 평화 조약 비준"
 COU_cooperative_treaty_ratification_TT: "§R당신의 국가는 평화 조약을 비준하고 있습니다.§!"
 COU_cooperative_treaty_ratification_TT_FROM: "§R해당 국가는 평화 조약을 비준하고 있습니다.§!"
 COU_cooperative_treaty_ratification_TT_JOIN: "§R당신의 국가는 평화 조약을 비준하고 있기에, 협력기구 국가와 전쟁중인 국가의 전쟁에 참전할 수 없습니다.§!"
 COU_cooperative_treaty_ratification_TT_JOIN_FROM: "§R당신의 국가는 키보토스 협력기구 국가와 전쟁중이기에, 평화 조약을 비준한 국가를 호출할 수 없습니다.§!"

 landmark_COU_tower:0 "생텀 타워"
 landmark_COU_tower_desc:0 "생텀 타워는 키보토스의 중심부에 위치한 건물입니다. 이곳은 키보토스의 모든 학원과 학생들이 모여서 회의를 하고, 의사 결정을 내리는 장소입니다. 생텀 타워는 키보토스의 상징적인 건물로, 이곳에서 이루어지는 모든 결정은 키보토스의 미래에 큰 영향을 미칩니다."
 
 
 
 #오프닝
 COU_country_intro_header: "박살난 정의, 추락한 질서"
 COU_country_intro_content: "총학생회는 사실, 학원과 같은 일련의 국가 형태를 띄는 조직이 아니었습니다. 지구의 기관에 비유하자면, 국제연맹과 같은 역할을 담당하던 것이 총학생회였고, 그러하기에 총학생회는 키보토스에서 오랜 시간동안 정의이자 질서로 자리매김했었습니다. 1935년 11월, 비극적인 그 날이 오기 전까지만 해도요.\n\n대전이는 키보토스 전역을 헤집어놓았습니다. 처음부터 끝까지, 당연시되었던 것들은 틀린 것이 되었고, 틀렸다고 생각했던 것들은 이제는 공공연한 사실이 되었습니다. 새로운 삶의 터전에서 살아남고자 총학생회는 불편한 자리를 공유하던 저지대의 국가들과 물리적인 충돌을 피할 수는 없었습니다. 평화로운 접근 방식은 처참한 포격으로 무시당했으며, 인류는 고향을 빼앗긴 "침략자", 키보토스에 대항해 무기를 들었습니다. 키보토스는 압도적인 기술력과 무력으로 이들을 진압했지만, 그 와중의 문제들은 외면할 수 없습니다.\n\n벨기에와 네덜란드는 저지대 전쟁에서 두 달 이상 살아남지 못했습니다. 국왕만이 간신히 탈출한 벨기에와 SRT의 군사 작전 도중 사살당한 빌헬미나 여왕까지, 대전이는 키보토스뿐만 아니라 인류에게도 크나큰 영향을 미쳤습니다. 결코 낫지 않을 커다란 상처를 심어 준 채로.\n\n현명한 이들은 살아남고자 협력하기를 선택했습니다. 시라누이 카야와 방위실의 주도로 창설된 협력자 조직은 총학생회의 대개편과 안정에 도움을 주었습니다. 이들은 새로운 지위를 부여받으며 총학생회의 묵인 속에서 수단과 방법을 가리지 않고 명령을 따릅니다.\n\n그리고 총학생회는 이제 새로운 여명을 맞이해야만 합니다. 대도시 D.U.의 침수부터 국민저항전선의 저항까지, 직면한 모든 과제들은 총학생회와 총학생회장의 분명한 실책이며 대전이의 쓰디쓴 실체임을 여실히 드러내고 있습니다. 더 이상 늦장부릴 시간은 없습니다. 총학생회는 다시 한번 키보토스 위에 군림해야 합니다. 정의를 세워야 합니다. 질서를 바로잡아야만 합니다.\n\n§R멋모른 채로 저지른 모든 죄와 잘못을 속죄하기 위해서라도요.§!\n\n§Y개발 - SKSKIe, YurizonoSeia, Imika§!"
 
 #총학생회라는 존재는 인류로 비유하자면 국제연맹과 같은 하나의 거대한 질서였습니다. 생텀 타워를 중심으로 D.U.와 같은 거대 도시를 중심으로 총학생회는 강성한 학원들 간의 분쟁을 중재하고, 행정을 총괄했습니다. 총학생회장을 필두로 한 통괄실부터 인재자원실까지, 11개의 부서로 이루어진 행정위원회는 현명하게 키보토스를 통치했으며 안정을 유지했습니다.\n\n키보토스의 안녕을 위해 행정위원회의 모든 임원들과 행정원들은 기꺼이 과로를 일삼습니다.\n\n하지만 그러한 과로 틈 사이에서 이들은 권력 투쟁 또한 빼먹지 않습니다. 어떠한 부서가 힘을 얻으려고 시도한다면 이들은 득달같이 달라붙어 행정위원회의 안정적인 민주주의와 질서를 유지했습니다. 그것이 행정위원회였으며 총학생회의 일상이었습니다. 서로가 권력을 견제하고, 학원들 간 갈등을 중재하는 것과 같은 일들이요.\n\n"초인" 총학생회장을 필두로 한 행정위원회는 어쨌던 간에 키보토스를 안정적으로 이끌었으며 모든 이들의 하늘 위에서, 고리와 같은 빛이 번쩍이는, 별빛이 빛나는 은하수 밤하늘 위에서의 질서임은 명백했습니다. 그 누구도 부정할 수 없는, 명백한 하나의 "질서" 말입니다."
 #COU_country_intro_content: "본래부터 총학생회는 트리니티나 게헨나와 같은 학원들처럼 별도의 국가 비슷하게 존재하지는 않았습니다. 본디 총학생회는 연방 전체의 행정을 통괄하는 거대한 규모의 정부였습니다. 인류로 비유하자면, 마치 국제연맹 같은 거대한 규모의 정부 말입니다. 각 학원 자치구간의 충돌을 중재하고, 끊임없이 키보토스의 사악한 무리들로부터 맞서 키보토스를 평화롭게 이끌어나가는 것이 본래의 역할입니다.\n\n그러나, 우리의 위치를 하늘 위에서 떨어뜨린 이상 현상- 앞으로도 영원히 진실이 밝혀지지 못할- "대전이" 에 의해 키보토스는 위기에 놓였습니다. 우리가 맞이한 현실은, 모든 종류의 통신망과 교통망이 마비되었고, 다른 학원들의 상태를 확인할 수 없다는 진실이었습니다.\n\n길고 긴 조사 끝에 우리가 찾아낸 진실은, 믿을 수 없게도 키보토스가 다른 세계로 전이되었다는 사실입니다.\n\n다행히, 우리는 D.U.라는 거대한 기반 도시를 가지고 이동되었기에, 상대적으로 상황이 매우 수월합니다. 그러나, 거대한 학원들이 자신들의 체제를 정비하고 기상하기 시작하면, 더 이상 막을 수 없게 될 것입니다.\n\n우리는 키보토스를 안정적으로 유지하고, 갈등을 잠재울 사명이 있습니다.\n\n§Y개발 - SKSKIe, YurizonoSeia§!"

 #COU_guide: "목표\n\n총학생회의 혼란을 해결하십시오.\n총학생회장의 명령을 받은, 존재하던지도 몰랐던 "연방수사동아리 샬레" 의 인공지능 아로나를 통제하십시오.\n\n§Y모래성 위에서의 축하 연회§! \n£white_dot. 총학생회장을 자처하고 싸우십시오. 모래성 위에서의 한낱의 환상일 축하 연회를 위해서.\n£white_dot. 협력자들을 조심히 다루십시오. 고깃덩어리를 눈 앞에 둔 굶주린 사자들과 까마귀들을 조련하듯이요.\n£white_dot. 그리고서는 최후의 투쟁을 치루십시오. 결코 같은 태양 위에서 살아남을 수 없는 공산주의자들에게 맞서서.\n\n§C정당한 대행의 학생회§!\n£white_dot. 폭풍 속에서 권한 대행의 자리를 지켜내십시오.\n£white_dot. 키보토스의 혼란을 잠재우고 새로운 미래를 밝혀내십시오.\n\n§R원하지 않던 자리§!\n£white_dot. 간단하게 시위 문제를 해결하십시오.\n£white_dot. 그리고 운명을 맞이하십시오. 그것이 원하던, 원하지 않았던, 결국에는 찾아올 운명을.\n£white_dot. 원하지 않았지만 결국엔 만들어낸 미래를 지켜보십시오. 그 끝이 어떻게 되던, 그것은, 조만간 당신의 앞에 닥칠 것입니다.\n\n§R그리고서 모든 것이 끝나는 바로 그 날엔, 결국에는 찾아올 운명에 맞서 대면하십시오. 그 결과가 어떻게 되던.§!"
 
