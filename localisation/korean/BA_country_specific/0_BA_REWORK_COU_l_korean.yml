 COU_COU_division_of_military_desc: "총학생회장이 실종된 총학생회장이 만든 것으로 추정되는 '샬레' 라는 조직에서 우리를 향해 프로토콜을 실행하겠다며 통보해 왔습니다. 그리고 이후 샬레 측은 자신이 가진 권한과 명분을 이유로 우리의 군사력을 잠식해 나가고 있습니다. 우리는 이러한 샬레의 움직임을 조사하고 대처해야 합니다."
