 COU_war_deterrence_tt: "§Y키보토스 협력기구§! 국가 간의 전쟁을 금지하는 법안이 추진될 것입니다."
 COU_establishment_of_autonomous_system: "자치 제도 확립"
 COU_establishment_of_autonomous_system_desc: "권력 투쟁 속에서 승기를 잡은 우리는 유라기 모모카를 비상대책위원장 자리에 앉힐 수 있게 되었고, 이전에 현지인들에게 약속했던 자치에 대해 제도적 기반을 마련할 기회를 얻었습니다. 이를 통해 우리의 지지 기반을 더욱 다질 수 있을 것입니다."
 
 
 
 #총학생회 국민정신
 COU_admin_confusion:0 "행정 혼란"
 COU_admin_confusion_desc:0 "총학생회는 대전이 이후 통제를 상실했으며 이러한 행정 혼란은 한동안 지속될 것으로 보입니다."
 COU_cut_tower:0 "생텀 타워 권한 상실"
 COU_cut_tower_desc:0 "싯딤의 상자를 통해 생텀 타워에 관한 권한을 가지고 있던 총학생회장이 사라지면서 키보토스를 총괄하던 생텀 타워에 대한 권한 또한 사라졌습니다. 이는 총학생회와 키보토스에 대한 중대한 위협입니다."
 COU_Perfidus:0 "페르피두스"
 COU_Perfidus_desc:0 "벨기에의 무조건적인 항복 선언 이후 이루어진 통치 안정화 과정에서, 시라누이 카야를 필두로 한 방위실은 우리에게 협조적인 현지인들을 등용해 통치에 사용할 것을 제안했습니다. 이들은 공식적으로는 협력자라고 지칭되지만 이들은 보통 라틴어로 페르피두스, 배신자로 불립니다."
 COU_Perfidus_tooltip_modf:0 "£decision_icon_small §Y결정 해금§! : 페르피두스"
 COU_Perfidus_tooltip:0 "§Y$COU_Perfidus$§! 변동치"
 COU_name_of_the_student_council:0 "학생회의 권위"
 COU_name_of_the_student_council_desc:0 "총학생회가 비록 대전이 이후 예전과 같은 통제력을 발휘하지는 못하지만, 총학생회는 모든 학원을 총괄하고 중재하는 '유일한' 이들로서 비록 퇴색되었다고 하더라도 무시할 수 없는 권위와 범학원적 영향력을 끼칩니다." 
 COU_industry:0 "행정 주도 경제"
 COU_industry_desc:0 "총학생회라는 거대한 관료 집단의 특성상 이들이 국가로 재편되었음에도 불구하고 과거의 유산은 여전히 남아 있습니다. 총학생회의 경제는 시장에 맡겨진 것이 아니라, 행정위원회의 서류 위에서 움직이니까요."

 
 
