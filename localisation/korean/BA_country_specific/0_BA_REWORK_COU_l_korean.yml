 COU_AYUMU:0 "이와비츠 아유무"
 COU_AYUMU_SET1:0 "조정실장"
 COU_MOMOKA:0 "유라기 모모카"
 COU_MOMOKA_DESC:0 "교통실이 언제부터 총학생회에서 이렇게 중요한 부처가 되었을까요? 그저 매일같이 터져나가는 열차들을 정비하고, 신고를 접수하고, 고작 그것이 다였던 자그마한 부서였는데 말입니다.\n\n유라기 모모카는 현지인들에게 한줄기 희망으로 떠올랐습니다. 새로이 설립된 개혁위원회와 붉은 여명은, 그녀가 단순한 통치자는 아니라는 것을 암시합니다. 명란맛 과자를 풍족히 공급하고, 권력자로서의 대우를 하고, 명령에 따르는 척 하면서 모모카는 새로운 질서의 핵심이 되었습니다. 그러니까, 모모카는, 귀찮은 일들을 강제로 떠맡게 된 것과 다름이 없습니다.\n\n모모카는 정치놀음에 그다지 큰 관심은 없습니다. 단순히 밀려오는 더 많은 서류들을 처리하는 데엔 싫증이 난 지 오래였지만 말입니다. 가끔씩 그녀는 홀로 린이 그립다며 한숨을 쉬고는 합니다. 곁에선 붉은 완장을 찬 현지인들이 그녀를 탐탁치 않게 바라볼 뿐입니다.\n\n하지만 그 자리가 어떠하던 간에 그녀는 새로운 질서이자 인류와 키보토스 조화의 상징입니다. 모모카, 그리고 명란맛 과자는 충실히 그 의무를 수행할 것입니다.\n\n복잡한 정치놀음은 정치인들에게 떠넘긴, 한낱 꼭두각시와 다름이 없는 신세더라도, 모모카는 그 의무를 수행할 것입니다.\n\n마땅히 지어야만 할 짐을 지고서." 
