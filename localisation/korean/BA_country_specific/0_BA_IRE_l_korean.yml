 ## 툴팁 ##
 IRE_name_state_119: "얼스터"
 IRE_tt_1: "§Y아일랜드§!는 §Y아일랜드-영국 조약§!을 폐기하고 §Y영국§!으로부터 완전히 독립할 것입니다."
 IRE_tt_2: "§Y아일랜드§!에 닥칠 §R두 번째 대위기§!를 대비합니다."
 ## IDEA ##
 IRE_freestate_danger_idea: "위태로운 자유국"
 IRE_unstable_republic_idea: "불안정한 공화국"
 IRE_engire_trade_war_idea: "아일랜드-영국 무역 전쟁의 상흔"
 IRE_agricultural_society_1_idea: "농업 사회"
 IRE_agricultural_society_2_idea: "농업 사회"
 IRE_new_constitution_idea: "아일랜드 신헌법"
 IRE_new_constitution_idea_desc: "1935년 10월, 갑작스레 나타난 이계의 존재는 수많은 국가들을 혼란 속에 빠뜨렸으며, 영국 또한 그 예외는 아니었습니다. 에이먼 데 벌레라를 비롯한 아일랜드인들은 영국으로부터 벗어나기 위한 헌법을 작성했으며, 법안이 승인되면서 아일랜드는 영국의 \"자치령\"인 자유국이 아닌 공화국으로서 독립했습니다.\n\n헌법은 부활절 봉기를 비롯한 아일랜드 공화주의를 강조하며, 아일랜드어 표기법 또한 명명되었습니다. 아일랜드인들의 정신을 고취하는 신헌법은 한동안 아일랜드인들에게 큰 영향을 줄 것입니다."
 
 ## 중점 ##
 IRE_focus_the_falling_empire: "무너지는 제국"
 IRE_focus_treaty_port_reception: "조약항 접수"
 IRE_focus_steps_towards_n_ireland: "얼스터를 향한 진군"
