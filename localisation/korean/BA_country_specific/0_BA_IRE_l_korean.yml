 IRE_internal_factions_decision: "세력 관리"
 IRE_internal_factions_decision_desc: "아일랜드의 국내 정치 상황은 대전이 이후로 더욱더 분열되고 있습니다. 우리 정부는 세력의 균형을 맞추고 국정의 타륜을 올바른 방향으로 향하도록 해야 할 것입니다.\n"
 IRE_IFA_name_text: "아일랜드 농민협회"
 IRE_IFA_TT_text: "£GFX_faction_IRE_IFA_icon §Y아일랜드 농민협회§!는 1935년 말 대영국 수출 감소를 비롯한 농업 위기를 타파하기 위해 전국 각지의 농민이 조직한 단체입니다.\n\n£GFX_faction_IRE_IFA_icon §Y증감 보너스:§! 소비재 공장 변동치, 모병 가능 인구 변동치, 주간 안정도"
 IRE_CAT_name_text: "가톨릭 교회"
 IRE_CAT_TT_text: "£GFX_faction_IRE_CAT_icon §Y가톨릭 교회§!는 역사적으로 아일랜드 국민의 절대다수를 신자로 두고 있는 아일랜드 최대의 종교 단체입니다.\n\n£GFX_faction_IRE_CAT_icon §Y증감 보너스:§! 정치력 획득, 안정도, 전쟁 지지도"
 IRE_IRA_name_text: "아일랜드 공화국군"
 IRE_IRA_TT_text: "£GFX_faction_IRE_IRA_icon §Y아일랜드 공화국군§!은 흔히 'IRA'라 알려집니다. 1916년 부활절 봉기 이후로 대영 투쟁을 벌이며 아일랜드 독립을 이루어내었으며, 몇 차례의 분열을 거친 뒤 영국의 몰락을 틈타 얼스터 수복을 주장하고 있습니다.\n\n£GFX_faction_IRE_IRA_icon §Y증감 보너스:§! 사단 공격, 사단 방어, 훈련 시간"
 IRE_SOC_name_text: "포괄사회주의자"
 IRE_SOC_TT_text: "£GFX_faction_IRE_SOC_icon §Y포괄사회주의자§!들은 노동조합을 비롯한 좌익 세력으로, 사회민주주의를 추구하며 노동당의 절대적인 지지기반입니다.\n\n£GFX_faction_IRE_SOC_icon §Y증감 보너스:§! 공장 생산량, 조선소 생산량, 건설 속도"
