 IRE_new_constitution_idea_desc: "1935년 10월, 갑작스레 나타난 이계의 존재는 수많은 국가들을 혼란 속에 빠뜨렸으며, 영국 또한 그 예외는 아니었습니다. 에이먼 데 벌레라를 비롯한 아일랜드인들은 영국으로부터 벗어나기 위한 헌법을 작성했으며, 법안이 승인되면서 아일랜드는 영국의 \"자치령\"인 자유국이 아닌 공화국으로서 독립했습니다.\n\n헌법은 부활절 봉기를 비롯한 아일랜드 공화주의를 강조하며, 아일랜드어 표기법 또한 명명되었습니다. 아일랜드인들의 정신을 고취하는 신헌법은 한동안 아일랜드인들에게 큰 영향을 줄 것입니다."
