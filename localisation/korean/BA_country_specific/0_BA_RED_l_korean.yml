 RED_racing_sov.2.d_1: "[RED.getname]은(는) [ROOT.getname]을(를) 구출하여 학원으로 대피시켰습니다."
 

 RED_tro_event.1.t: "[SOV.getname]의 트로츠키 암살 시도!"
 RED_tro_event.1.d: " 유감스럽게도, 우리 학원의 현지인 고문으로서 활동하고 있는 '레프 트로츠키'는 한때 소련의 건국영웅인 블라디미르 레닌과 함께 자본주의에 맞선 혁명세력인 볼셰비키를 이끌며 소련 정치의 중앙에 자리잡았습니다. 그러나 1920년대, 트로츠키는 현재 소련의 권력자인 이오시프 스탈린과의 권력쟁투에서 패배하며 그 세력을 크게 잃었고, 현재 망명을 위해 이곳에 와 있는 상황입니다. 한편, 스탈린은 트로츠키를 제거함으로써 소련 내 자신의 지위를 공고히 하고자 소련의 첩보시설을 동원하여 지속적으로 트로츠키의 암살을 시도하고 있습니다.\n\n 우리는 트로츠키 동지의 목숨을 '퇴보한 노동자 국가'에게 내어주지 않을 것이며, 기필코 그의 신변을 보호할 것입니다. "
 RED_tro_event.1.a: "경계를 강화해!"
 RED_tro_event.1_tt: "\n중점 §Y$RED_advance_security$§! 또는 §Y$RED_all_power_to_redwinter$§!를 통해 §Y스네이크 게임§!에서 §G승리§!할 수 있습니다."

 RED_tro_event.2.t: "트로츠키의 사망"
 RED_tro_event.2.d: "우리는 트로츠키를 지키지 못했습니다. 그럼에도 그의 헌신은 학원에 많은 유산을 남길 것입니다."
 RED_tro_event.2.a: "이제 어떡하지?"
 RED_tro_event.3.t: "체리노의 불만"
 RED_tro_event.3.d: " \"대체 왜 내 석상의 건설을 중단하겠다는 거야?!\"\n\n 렌카와 체리노는 자신의 우상화 작업을 지양하려는 트로츠키가 못마땅했다. 그러나 대전이 사태가 수습되어 갈수록 많은 사무국의 임원들이 트로츠키를 따르고 있었다.\n\n \"지금 중요한 건 민중과 학생의 생활을 보장하는 것이지, 결코 우상숭배가 아니라네.\"\n\n 체리노는 트로츠키를 당장이라도 내쫓아내고 싶었고, 논리로는 그를 이기지 못 할 것을 알기에 토모에를 바라보았지만, 토모에마저 \"그러면 안돼요 체리노짱.\"이라며 그녀를 말렸다.\n\n 체리노는 잔뜩 심술이 났다."
 RED_tro_event.3.a: "책이라도 펼쳐들까."
 RED_tro_event.4.t: "지식해방전선"
 RED_tro_event.4.d: "아키이즈미 모미지는 지식해방전선에 소속되어 도서관의 사서로 일하고 있는 학생이다. 여느 때와 같이 모미지가 사서 일에 집중하고 있을 때, 돌연히 체리노가 보안위원 여럿을 데리고 등장하였다.\n\n \"흐엑, 체리노 회장? 왜 느닷없이 이곳에 오신 거죠?\"\n\n \"잘 물어보았다! 이 몸이 이곳에 온 이유는 -\"\n\n \"아니, 말씀하시지 않아도 알겠어요. 저희 지식해방전선의 소중한 장서들을 압수하러 오신 거죠?\"\n\n \"아니, 책을 압수하러 온 게 아니라 -\"\n\n \"하지만 이 책만큼은 안돼요! 아직 제대로 읽지도 못했단 말이에요!\"\n\n \"잠깐, 그러니까 이 몸이 여기 온 이유는 그런 시시한 책 때문이 아니라 지식을 얻고자 온 것이다!\"\n\n \"네..? 무슨 지식을 얻고 싶으시기에 이곳에?\"\n\n \"최근에 학원에서 내 자리를 위협하고 있는 트로츠키라는 작자보다 더 많은 지식을 얻어야 돼. 그 자는 엄청 똑똑해서 공산주의에 대해서는 말싸움을 이길 수 없단 말이야!\"\n\n \"그런 문제라면... 역시 책을 빌려드리죠. 공산주의를 배울 생각이라면 카를 마르크스의 '공산당 선언'이 입문으로 좋겠네요!\"\n\n 체리노는 책을 들고 사무국으로 돌아왔다."
 RED_tro_event.4.a: "잠깐, 무슨 내용인지 하나도 모르겠어?!"
 RED_tro_event.5.t: "망명위원회의 설립"
 RED_tro_event.5.d: "트로츠키가 우리의 문제를 해결하는 데 도움을 주었기에, 위대하신 체리노 동지께서는 새로운 동지의 친구들을 구하는 일에 도움을 주기로 약속하였습니다. 체리노 회장의 직속 명령으로 신속하게 세워진 이 위원회는 오염된 혁명정신을 따르는 스탈린주의자들에게 핍박받는 전 세계의 트로츠키주의자들을 붉은겨울로 안전하게 모셔 올 것입니다."
 RED_tro_event.5.a: "이제 그들을 구하러 가보자고."
 RED_tro_event.5_tt: "\n§g정보원을 트로츠키주의 인사들이 망명한 국가로 파견하여 그들을 구출해낼 수 있습니다.§!"
 RED_tro_event.6.t: "자치공화국 작명"
 RED_tro_event.6.d: " \"자치공화국이라는 이름은 너무 멋이 없는 거 같아.\"\n\n 체리노는 토모에에게 투덜대었다. 토모에는 잠깐 웃더니 체리노가 원하는 자치공화국의 명칭을 사무국 위원에게 전달하러 떠났다."
 RED_tro_event.6.a: "도저히 받아들여질 수 없다."
 RED_tro_event.6.b: "체리노의 의견이라면.."
 RED_tro_event.7.t: "세계혁명"
 RED_tro_event.7.d: "더 이상 지체할 수 없습니다. 우리는 사회주의의 혁명적 이상을 전세계에 퍼트리기로 결정했습니다. 우린 태평양부터 대서양까지, 아시아부터 오세아니아까지, 북극부터 남극까지! - 모든 언덕과 공장에서 적기가 휘날리도록 할 것입니다!"
 RED_tro_event.7.a: "세계혁명 만세!"
 RED_tro_event.7_tt: "\n§g전쟁 중이라면 디버프가 절반의 버프로 전환되어 주어질 것입니다.§!"
 RED_tro_event.8.t: "사무국의 처우"
 RED_tro_event.8.d: "권력 우위가 확실하게 결정된 지금이 아니고서야 체리노와 그녀의 잔당인 사무국을 처리할 수 없습니다. 그러나 단순히 권력투쟁의 상대인 것이 이들을 배격할 이유가 되지는 않습니다. 그럼에도 스탈린의 선례를 볼 때 그들을 제거하는 게 해가 되지는 않을 것으로 보여집니다."
 RED_tro_event.8.a: "사무국에 적당한 권한을 두되, 그들을 감독해라."
 RED_tro_event.8.b: "사무국의 팔다리를 잘라버려라."
 RED_tro_event.9.t: "이주노동자 강제 배치"
 RED_tro_event.9.d: "우리는 복잡한 산업 계획의 목표를 달성하기 위해 다양한 지역에서 인력을 공수하여 투입할 필요가 있습니다. 이주 노동자들은 이제 계획도시 건설이나 산업시설 확장과 같은 다양한 광역 산업 계획에 투입될 것입니다."
 RED_tro_event.9.a: "좋은 생각이야."

 RED_generic.1.t: "[RED.getname]의 투자 요청"
 RED_generic.1.d: "[RED.getname](으)로부터 자신들의 '재건 채권'을 매입해달라는 요청이 왔습니다. 기한이 지나면 우리는 투자금을 이자와 함께 회수할 수 있을 것입니다."
 RED_generic.1.a: "좋은 거래다."
 RED_generic.1.b: "지금은 바쁘다."
 RED_generic.2.t: "[FROM.getname]의 수락"
 RED_generic.2.d: "[FROM.getname] 측이 우리의 채권을 매입하여 주었습니다."
 RED_generic.2.a: "고맙군."
 RED_generic.3.t: "[FROM.getname]의 거절"
 RED_generic.3.d: "[FROM.getname] 측은 우리의 요청을 거절했습니다."
 RED_generic.3.a: "아쉽군."
 RED_generic.4.t: "국내 채권 매입 조절"
 RED_generic.4.d: "국내의 자본가와 소자본가들이 채권을 매입하려고 시도하고 있습니다."
 RED_generic.4.a: "소액 매입만 허가하자."
 RED_generic.4.b: "그들을 적당히 규제하자."
 RED_generic.4.c: "자유롭게 놔두어라."
 RED_investment_tt_1: "민간공장 공여: §G+2§!"
 RED_investment_tt_2: "민간공장 공여: §G+4§!"
 RED_investment_tt_3: "민간공장 공여: §G+6§!"
 RED_generic.5.t: "재건채권 만료"
 RED_generic.5.d: "채권 기한이 만료되었습니다. 우리는 이제 이를 상환하거나, 기한을 연장할 수 있습니다."
 RED_generic.5.a: "상환하자."
 RED_generic.5.b: "연장하자."
 RED_generic.6.t: "[RED.getname]의 채권 상환"
 RED_generic.6.d: "[RED.getname] 측은 우리가 사들인 채권을 이자와 함께 상환하였습니다."
 RED_generic.6.a: "좋군."
 RED_generic.7.t: "[RED.getname]의 상환 연기"
 RED_generic.7.d: "[RED.getname] 측은 우리가 사들인 채권에 대한 상환을 연기하였습니다."
 RED_generic.7.a: "사기인가?"
 RED_generic.8.t: "[RED.getname]의 상환 거부"
 RED_generic.8.d: "[RED.getname] 측은 우리가 사들인 채권에 대한 상환을 포기하였습니다."
 RED_generic.8.a: "젠장, 사기야!"
 RED_generic.9.t: "신용도 급감!"
 RED_generic.9.d: "우리가 채권 상환을 포기함에 따라 신용은 바닥을 모르고 떨어지고 있으며, 금융, 경제, 산업 전반에 있어서 마비의 공포가 야기되고 있습니다. 우리는 이를 극복할 '극단적'이고 '급진적'인 정책이 반드시 필요합니다."
 RED_generic.9.a: "젠장!"
 RED_generic.9_tt: "\n§Y60§!일 내로 중점 §Y무제한 인플레이션§! 또는 §Y화폐 정지§!를 완료하지 않으면 경제가 완전히 무너져내릴 것입니다!"
 RED_generic.10.t: "재건 채권"
 RED_generic.10.d: " 학원의 상황은, '정말 말 그대로', 끔찍합니다. 인구 포화, 식량 부족, 소비재 부족, 산업시설 초토화, 행정력 마비와 같은 이유로 우리가 자립할 능력을 스스로 재건하는 데에는 한계가 있음이 매우 분명합니다. 한편, 우리는 사회주의의 원리를 유연하게 적용할 필요 또한 있습니다. 외부로부터의 투자를 통해 먼저 국내의 산업을 재건하고, 육성하고, 발전시킴에 따라 우리는 산업 자립을 완수할 수 있을 것입니다.\n\n ...돈을 갚는 건 나중의 문제이고요."
 RED_generic.10.a: "경제 재건을 향해!"
 RED_generic.10_tt: "§Y365§!일 뒤에 우리가 공여받은 §Y민간공장§!의 §R2배§!를 §Y365§!일 동안 지불하게 될 수도 있습니다."
 RED_generic.11.t: "현지 기술관료"
 RED_generic.11.d: "학원에 스스로 민간 산업을 복구할 역량이 부족하다는 것은 대전이 이후 공공연하며 또한 명백합니다. 그렇기에 우리는 사회주의적 원리를 일부 유연하게 적용하여 현지 기술관료들, 혹은 자본가라도 고문으로 등용하여 산업 기반을 회복할 필요가 있습니다."
 RED_generic.11.a: "어쩔 수 없군."
 RED_generic.12.t: "대안경제정책"
 RED_generic.12.d: "급진적인 집산화와 국유화는 결코 지금 상황의 해결책이 아닙니다. 산업에 있어서 '전시' 상황인 지금은 대안적인 경제 정책이 필요합니다. 말 그대로, '대안경제정책'은 시장주의적 요소를 대거 수용하여 본래의 사회주의적 경제 정책을 수정한 것으로서, 우리는 이를 통해 중소-중견기업을 육성하고 산업 전반의 튼튼한 하부 구조를 구축하게끔 할 것입니다."
 RED_generic.12.a: "수정주의가 아니라, 비상조치야."
 RED_generic.12_tt: "\n§Y제1차 대안경제정책§!의 목표는 §Y민간공장§! §G40§! 초과입니다."
 RED_generic.12_tt_1: "\n§Y제2차 대안경제정책§!의 목표는 §Y민간공장§! §G80§! 초과입니다."
 RED_generic.13.t: "방위위원회의 해소"
 RED_generic.13.d: "스웨덴, 덴마크, 그리고 노르웨이를 향한 공세의 연장선으로서 핀란드 지방에의 진공을 위해 편성된 '[RE4.Getname]'가 몇 달 간의 항전을 끝내고 [148.GetCapitalVictoryPointName]에서 최종적으로 해소를 결의하였습니다. 우리의 스칸디나비아 지방을 향한 모험의 끝은 이곳입니다."
 RED_generic.13.a: "수고가 많았군."
 RED_generic.15.t: "제1차 AEP에 대한 평가"
 RED_generic.15.d: " 넓지도 좁지도 않은 회의장에 수십의 인민위원들과 경제 전문가들이 모였습니다. 이들은 대안경제정책(Alternative Economy Policy), 즉 AEP의 성과를 평가하기 위해 소집되었는데, 현지 기술관료들은 긍정적인 평가를, 일부 키보토스계 위원들은 부정적인 평가를 내리며 회의장의 분위기는 엇갈렸습니다.\n\n AEP의 성과가 어떠했는지에의 결정은 우리 경제 정책에 큰 변화를 불러올 수 있음에도, 의견은 하나로 좁혀지지 않고 있습니다."
 RED_generic.15.a: "AEP는 성공적이었다!"
 RED_generic.15.c: "시원찮지만, 경과를 좀 더 지켜봐야 한다."
 RED_generic.15.b: "이 미친 정책 실험을 멈춰야돼!"
 RED_generic.15.a_tt: "§Y민간공장§!이 §G40§!을 초과했기 때문에, §YAEP§!는 성공적으로 지지받고 있습니다:"
 RED_generic.15.b_tt: "§g우리는 산업구조를 계획경제로 전환할 것입니다.§!\n\n§Y$RED_rearming_focus_1$§! 이하의 잠긴 중점들과 다른 §Y산업 중점 계통§!의 §Y산업 중점§! 일부가 해금됩니다:\n\n "
 RED_generic.15.c_tt: "§Y민간공장§!이 §R40§! 이하이기 때문에, 대중들은 §YAEP§!에 회의적입니다:"
 RED_throw_aep_away: "§YAEP§!에서 §Y계획경제§!로의 전환"
 RED_generic.16.t: "목표 조기달성"
 RED_generic.16.d: "우리는 AEP의 목표를 조기달성했습니다."
 RED_generic.16.a: "인상적이군."
 RED_generic.18.t: "대외정책"
 RED_generic.18.d: "우리가 내치에 집중하는 동안, 세계는 빠르게 뒤바뀌고 있었습니다. 지금이라도 바깥을 향해 눈을 돌려야 합니다."
 RED_generic.18.a: "최대한 실리적인 선택을 내리자."
 RED_generic.18.b: "우리의 주권을 적극적으로 방어해야 한다."
 RED_generic.19.t: "산업 기획"
 RED_generic.19.d: "정밀하게 기획된 산업은 시장과 비교해서 굉장히 효율적으로 동작합니다. 문제는, 우리가 전이한 이곳이 본래 자본주의 체제이기 때문에 이러한 계획 경제의 실시가 사회주의적 체제전환과 병행돼서 이루어져야 한다는 것입니다. 여전히 행정력은 부족하지만, 우리는 초장기적인 관점을 가지고 10년을 내다보는 계획을 세웠습니다. 특히 우리는 다가올 안과 밖에서의 분쟁에 대비하기 위해서 군수산업에 소홀하지 않을 것이며, 또한 균형있는 개발을 통해 장기적으로 경제 발전의 과실이 다원적으로 분배될 것을 의도할 것입니다. 더 나아가 경제적 완전 자립을 위해 자원 개발 계획 역시 기획서에 수 백 페이지 이상을 차지하고 있습니다."
 RED_generic.19.a: "경제는 침착하게 조정해야 한다."
 RED_generic.20.t: "국경분쟁 패배"
 RED_generic.20.d: "우리는 국경분쟁에서 패배했습니다."
 RED_generic.20.a: "젠장"
 RED_generic.20.b: "분쟁에서 졌다면, 전쟁을 이기자!"
 RED_generic.21.t: "국경분쟁 승리"
 RED_generic.21.d: "우리는 국경분쟁에서 이겼습니다."
 RED_generic.21.a: "좋군."
 RED_generic.22.t: "[RED.getname]의 지원"
 RED_generic.22.d: "[RED.getadjective](으)로부터 우리에게로의 지원이 도착했습니다."
 RED_generic.22.a: "고맙군."
 RED_generic.23.t: "[RED.getname]의 제안"
 RED_generic.23.d: "붉은겨울로부터 저임금 노동자 수입에 대한 제안이 왔습니다."
 RED_generic.23.a: "좋은 거래군."
 RED_generic.23.b: "우리가 손해인 것 같다."
 RED_generic.24.d: "붉은겨울로부터 자원과 기술 교환에 대한 제안이 왔습니다."
 RED_generic.25.t: "군정청이란?"
 RED_generic.25.d: " 군정청은 대전이 이후 붉은겨울이 노르웨이로의 서방공세와 스웨덴 잔존 세력으로의 북방공세를 거치며 사무국 산하에 설치된 군정부서입니다. 이들은 형식상 비록 사무국의 명령에 복종하지만, 관할 지역에서 통제받지 않는 권한을 행사하고 있습니다. 그러나 행정체계가 붕괴한 지금으로써 우리는 그들을 통제하는 데에 많은 힘을 들일 수밖에 없을 것입니다.\n\n 군정청은 학원과의 지리적 거리로 인해 그들에게로의 물적 지원에 제한이 있는데, 이로 말미암아 그들의 점령지역에서는 현지인들의 민주주의 저항이 거세게 일어나고 있습니다. 이는 민주주의 지지율이 증가함에 따라 확대되고, 결론적으로 군정청의 불안도가 상승하는 것으로 이어집니다. 군정청의 불안도가 충분히 높아지면 군정청은 곧 붕괴할 것이며, 해당 권역은 우리 학원의 통제를 벗어나게 될 것입니다. 그렇기에 우리는 군정청에서의 민주주의 지지율을 억제할 필요가 있습니다.\n\n 그러나 군정청의 불안은 장비와 지휘력을 사용하는 결정 혹은 중점 '$RED_enlarge_secret_police$', '$RED_enemy_of_class$', '$RED_welcome_immigrate$'을 통해 감소시킬 수 있으며, 군정청을 최종적으로 해소하기 위해서는 중점 '$RED_enticing_locals$'을 통해 자치공화국으로 전환한 뒤 중점 '$RED_welcome_immigrate$'을 통해 통합하거나, 중점 '$RED_depress_locals$'을 통해 병합한 뒤 천천히 동화할 수 있습니다."
 RED_generic.25.a: "좋아, 완벽히 이해했어!"

 RED_generic.26.t: "군정권역 공업화의 향방"
 RED_generic.26.d: "우리는 군정청이 관할하던 구역에서의 공업화를 일구어 내야 합니다. 그러나 여전히 우리의 행정력은 부족하기 때문에, 우리는 현지 산업들을 보조함에 따라서 그들이 자체적으로 공업화할 수 있도록 지원할 수 있습니다. 반면, 하달식 경제 계획을 채택한다면 산업 전반을 우리가 본격적으로 통제할 수 있을 것입니다."
 RED_generic.26.a: "현지 산업을 이용하자."
 RED_generic.26.b: "행정력이야 어떻게든 메우면 되지!"
 RED_generic.27.t: "전시상황 해제"
 RED_generic.27.d: "2개월 남짓 선포된 전시상황은 학원과 현지의 거의 모든 부문에서의 사무국의 통제를 요구하고 있었습니다. 이는 관료 개개인에게 과로를 지웠으며, 우리의 행정력을 과하게 소모시키고 있었습니다. 서방 공세가 마무리된 지금, 체리노 사무국장 동지의 제안에 따라 사무국은 전시상황 해제를 결의하였으며, 이는 앞으로 있을 것으로 여겨지는 행정 복원 사업의 첫 조치가 될 것입니다."
 RED_generic.27.a: "유의미한 위협은 더 이상 남아있지 않다!"
 RED_generic.28.t: "총파업의 위협"
 RED_generic.28.d: "군정청은 물론이고 현지 관료들을 대체하여 새로 배치된 붉은겨울 관료들은 무능하고 비효율적이며 또한 착취적입니다. 중앙에서는 이들을 통제할 여력이 없고, 이에 따라 현지의 노동운동은 교섭과 경제투쟁을 목적으로 하기보다 더 폭넓은 산별 연계와 반체제 운동으로 발전하고 있습니다. 이들을 섣불리 해산하지 않고서는 학원의 안정적인 통치를 기대하기 어려울 것입니다."
 RED_generic.28.a: "조합원들과 적당히 타협하자."
 RED_generic.28.b: "진압해라."

 RED_reading.1.t: "'공산당 선언'"
 RED_reading.1.d: " '하나의 유령이 유럽을 배회하고 있다. 공산주의라는 유령이.'\n\n 공산주의에 대한 의미심장한 구절로 시작하는 '공산당 선언'은 카를 마르크스와 프리드리히 엥겔스가 1848년 2월에 적어 낸 소책자입니다. '모든 역사는 계급투쟁의 역사다.'라는 말이 적혀있는 만큼 '공산당 선언'에는 '공산주의'라는 사상 그 자체에 대한 여러 뿌리 개념들이 드러나있고 그에의 분석 또한 적혀있습니다.\n\n \"제길. 하나도 모르겠어-!\"\n\n 체리노는 트로츠키를 찾아가서 질문하기로 결심했습니다. 트로츠키는 19세기를 뒤덮은 산업사회와 계몽주의에 대해 설명하며 체리노에게 시대적 맥락을 소개해주었습니다.\n\n \"그렇게 두 계급이 나타나게 되는데, 그것이 바로 부르주아와 프롤레타리아이오.\"\n\n '공산당 선언'은 역사의 발전 원리가 '계급투쟁'이라고 설명합니다. 계급투쟁은 지배계급과 피지배계급 사이의 대립으로, 이전의 자유민과 노예, 귀족과 평민, 영주와 농노 같은 관계에 놓인 것을 총칭합니다. 그 중에서 산업사회의 주요한 두 계급은 바로 프롤레타리아와 부르주아입니다. 부르주아 게급은 산업혁명 이후 급속히 성장한 자본주의 사회에서, 부르주아는 생산 수단(공장, 토지, 기계 등)을 소유하며 경제와 정치 권력을 장악했습니다. 즉, 지배계급입니다. 반면, 프롤레타리아는 자신들의 노동력만을 팔아 생계를 유지해야 하는 계급으로, 부르주아에 의해 착취받는 존재입니다. 이 두 계급 간의 모순과 대립은 자본주의 체제 내부에 내재한 불평등과 경제적 위기를 낳으며, 결국 프롤레타리아 혁명을 통한 사회 전환의 필요성이 제시됩니다.\n\n \"또한 마르크스는 사회를 분석하는 데에서 그치지 않고 공산주의자들의 임무를 제시해줬소.\"\n\n 마르크스는 본 책자에서 '사적 소유의 폐지'가 공산주의자의 임무임을 강조하며, 계급이 없는 사회주의로의 전환이 그들의 목표임을 또한 역설하였습니다.\n\n \"아직도 머리가 아프지만, 대충은 이해가 된 거 같아!\""
 RED_reading.1.a: "'전세계의 프롤레타리아여, 단결하라!'"
 RED_reading.2.t: "무슨 책을 읽을까?"
 RED_reading.2.d: "체리노는 지식해방전선에 방문해서 책을 고르기로 하였다."
 RED_reading.2.a: "마르크스의 책"
 RED_reading.2_tt_marx: "\n§R카를 마르크스§!의 책은 §Y[?RED_read_marx]§!권 남았습니다."
 RED_reading.2.b: "카우츠키의 책"
 RED_reading.2_tt_kautsky: "\n§R카를 마르크스§!의 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R카를 카우츠키§!의 책은 §Y[?RED_read_kautsky]§!권 남았습니다."
 RED_reading.2.c: "레닌의 책"
 RED_reading.2_tt_lenin: "\n§R카를 마르크스§!의 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R블라디미르 레닌§!의 책은 §Y[?RED_read_lenin]§!권 남았습니다."
 RED_reading.2.e: "룩셈부르크의 책"
 RED_reading.2_tt_luxembourg: "\n§R카를 마르크스§!의 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R로자 룩셈부르크§!의 책은 §Y[?RED_read_luxembourg]§!권 남았습니다."
 RED_reading.2.f: "트로츠키의 책"
 RED_reading.2_tt_trotsky: "\n§R블라디미르 레닌§!의 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R레프 트로츠키§!의 책은 §Y[?RED_read_trotsky]§!권 남았습니다."
 RED_reading.2.g: "부하린의 책"
 RED_reading.2_tt_bukharin: "\n§R블라디미르 레닌§!의 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R니콜라이 부하린§!의 책은 §Y[?RED_read_bukharin]§!권 남았습니다."
 RED_reading.2.h: "지노비예프의 책"
 RED_reading.2_tt_zinoviev: "\n§R블라디미르 레닌§!의 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R그리고리 지노비예프§!의 책은 §Y[?RED_read_zinoviev]§!권 남았습니다."
 RED_reading.2.i: "스탈린의 책"
 RED_reading.2_tt_stalin: "\n§R레프 트로츠키§!, §R니콜라이 부하린§!, §R그리고리 지노비예프§! 중 한 명 이상의 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R이오시프 스탈린§!의 책은 §Y[?RED_read_stalin]§!권 남았습니다."
 RED_reading.2.j: "선택지가 없어!"
 RED_reading.2_tt_no: "\n당장 읽을 수 있는 모든 책을 읽었습니다.\n\n...그러나 §Y@ITA [ITA.getname]§!에 유능한 마르크스주의자가 있을지 모릅니다.\n\n§t이탈리아에 정보원을 파견해 봅시다!§!"
 RED_reading.2.k: "그람시의 책"
 RED_reading.2_tt_gramsci: "\n다른 남은 책을 §Y모두§! 읽음으로써 선택지가 드러났습니다.\n\n§R안토니오 그람시§!의 책은 §Y[?RED_read_gramsci]§!권 남았습니다.\n\n§g마지막 독서입니다.§!"
 RED_reading.3.t: "'자본론'"
 RED_reading.3.d: " 체리노에게는 큰 용기가 필요했다. 보기만 해도 엄청난 두께, 단 세 글자에서 퍼져나오는 그 어려워 보임의 기운, 수 초간 체리노는 온 몸에서 느껴지는 거부감을 제어할 수 없었다. 그렇지만 운이 없게도 그런 모미지가 체리노의 모습을 찾아내었다.\n\n \"와아... 이번에는 그 어려운 '자본론'을 읽으실 생각이신가요? 정말 대단해요!\"\n\n 체리노는 자신이 사실대로 읽기 싫다고 이야기하면 학생회장으로서의 권위가 실추될 것이라고 생각했다. 그래서 체리노는 자신의 손에 아주 두꺼운 바로 그 책을 쥘 수밖에 없었다.\n\n 체리노는 낮잠을 잘 수 없었다. 지식해방전선의 반납기한은 2주였기 때문에, 이전처럼 천천히 책을 읽다가는 출입금지를 당할 것이었기 때문이었다. 그렇지만 체리노는 책을 읽어 나갈수록 그것이 '공산당 선언'보다도 더 어려웠다는 것을 깨달았기에, 체리노는 역시나 레프 트로츠키에게 가서 도움을 받고자 하였다.\n\n 트로츠키는 체리노에게 학원의 매점에서 사고파는 붕어빵을 예로 들어 설명했다. \"동지는 붕어빵이 왜 돈을 주고 사야 하는 물건인지 아시오?\"\n\n \"맛있으니까?\"\n\n \"그것도 맞지만, 더 근본적인 이유가 있소. 그것은 바로 붕어빵은 노동을 들여 만든 상품이기 때문이오. 마르크스는 ‘사용가치’와 ‘교환가치’가 상품의 가치를 결정한다고 생각했소.\"\n\n 체리노는 고개를 끄덕였지만, 표정은 여전히 복잡했다. 트로츠키는 다시 설명했다.\n\n \"만약 학원에서 붕어빵을 만드는 사람이 줄어든다면 어떻게 되겠소?\"\n\n \"그럼 붕어빵의 수가 줄어들 테니까, 가격은 오르겠지!\"\n\n \"바로 그것이오! 그러나 자본주의에서는 이 가치가 단순한 수요와 공급의 법칙만으로 정해지지 않소. 노동자가 붕어빵을 만드는 데 걸리는 '사회적으로 필요한 노동 시간'도 가치에 영향을 주기 때문이오.\"\n\n 체리노는 팔짱을 끼고 생각에 잠겼다. \"그렇다면 자본가들은 이윤을 남기기 위해 노동자들을 더 빠르게 일하게 만들려 하겠네?\"\n\n트로츠키가 미소를 지었다. \"동지는 훌륭하게 감을 잡고 있소.\"\n\n 체리노는 이제 자본주의적 착취가 어떻게 이루어지는지 궁금해졌다. 트로츠키는 친절히 이야기했다. \"붕어빵을 만드는 노동자가 하루 10시간 일한다고 해 보시오. 그러나 실은 5시간만 일하면 노동자는 본인의 생활에 필요한 임금 가치를 만들어낼 수 있소.\"\n\n \"그럼 나머지 5시간은…?\"\n\n \"그건 자본가의 주머니로 들어가는 것이오. 이것을 ‘잉여가치’라고 부르오.\"\n\n 체리노는 주먹을 불끈 쥐었다. \"이건 불공평해! 노동자는 더 많이 일하지만, 얻는 건 그대로잖아!\"\n\n 트로츠키는 고개를 끄덕였다. \"그래서 우리가 혁명을 일으킨 것이오. 노동자가 직접 생산 수단을 통제할 때, 진정한 평등 사회가 가능한 셈이오.\"\n\n 수 일 뒤, 체리노는 사무국 회의에서 사무국 임원들에게 '자본론'을 소개하며 '붕어빵에의 혁명'을 선언하고 그 필요성을 역설했다."
 RED_reading.3.a: "사무국 임원들은 머리가 지끈 아파왔다."

 RED_marina_event.1.t: "피로한 마리나 - 1"
 RED_marina_event.1.d: "\"...\"\n\n\"...보안위원장 동지, 일어나십쇼!\"\n\n 사무국 정기회의에서 깜빡 졸던 이케쿠라 마리나는 화들짝 깨어났다. 사무국 서기장 렌카와 체리노는 마리나에게 주의를 주며 앞서 논하던 안건에 대한 토의를 이었다.\n\n 마리나가 다시 주의깊게 이야기를 듣고 있을 땐, 페로로라는 마스코트를 학원에 영입하자는 터무니 없는 의견이 체리노에 의해 제시되고 비서실장 토모에에 의해 지지받고 있었다. 마리나는 입을 떼 발언하는 대신, 그녀의 흐려지는 시야에 몸을 다시 맡겼다."
 RED_marina_event.1.a: "그녀에게 휴식을 권해야 하지 않을까?"
 RED_marina_event.2.t: "피로한 마리나 - 2"
 RED_marina_event.2.d: " \"제 생각은 여전히 굳건합니다. 몰로토프 동지의 붉은겨울 지원에 대한 의지는 참으로 고맙습니다만, 여전히 우리는 스스로 할 수 있습니다.\"\n\n \"동지의 견해가 바뀐다면 언제든지 연락을 주시오. 연방은 동지를 두 팔 벌려 맞이할 준비가 되어있소.\"\n\n 피곤한 듯이 새벽 세 시에 숙소로 복귀한 마리나는, 잠을 청했다."
 RED_marina_event.2.a: "...내일 회의에 가기 싫어."
 RED_marina_event.3.t: "피로한 마리나 - 3"
 RED_marina_event.3.d: " \"그리하여, 10월 혁명은 적백내전으로 번지게 되었다네. 그 과정에서 조직된 노농적군의 조직은 내가 직접 맡았고... ...그렇게 보나파르티즘을 경계하기 위해서는 민중권력의 온전한 실현과...\"\n\n 늙은 노인이 사무국에 와서 '강의'를 하고 있었다. 많은 사무국 위원들이 그의 말에 귀를 기울였지만, 마리나는 군사적, 이론적 경험이 풍부한 노인이 자신의 자리를 밀어낼까봐 내심 불안해 하고 있었다. 토모에가 분명 자신을 실각시키기 위해 데려온 이라는 생각이 머리에서 떠나지 않았다. 근심으로 가득한 머릿속에 노인의 설명 따위는 들어올 리가 없었지만, 마리나의 귀에 보안위원회가 담당하던 권위주의적 조치에 대한 비판이 슬쩍슬쩍 들리는 듯 싶었다."
 RED_marina_event.3.a: "맞아, 몰로토프 동지가 이 사내에 관해 이야기했던 적이 있던 거 같던데?"
 RED_marina_event.4.t: "이반 쿠팔라"
 RED_marina_event.4.d: "붉은겨울의 하짓날 축제인 이반 쿠팔라가 대전이를 겪고 만신창이가 된 연방학원 땅 바로 위에서 열렸습니다. 모두가 힘든 일을 겪고 있지만, 오늘만은 수고를 잊고 즐겁게 축제를 즐겼습니다."
 RED_marina_event.4.a: "즐겼다면, 다시 일해야지."
 RED_marina_event.5.t: "피로한 마리나 - 4"
 RED_marina_event.5.d: " \"그것은 서기장 동지와 우리 연방학원에 대한 치욕스런 모욕입니다. 오늘 일은 못 들은 것으로 하겠습니다.\"\n\n \"글쎄, 그 사내의 맹동적인 혁명관과 독선적인 행정은 필히 혁명을 타락시키고 말 것이오. 온갖 반소비에트 음모의 중심에 서있는 그 자에 대한 축출은 무력을 무릅쓰고서라도 진행되어야만 하오. 진정히 사회주의를 향한다면, 그 뱀을 쳐내고 빛나는 대의를 바라보시오.\""
 RED_marina_event.5.a: "\"이 이상으로 서로 만나지 맙시다.\""
 RED_marina_event.6.t: "피로한 마리나 - 5"
 RED_marina_event.6.d: " \"교칙을 위반한 이를 붙잡아 심문한 것이 뭐가 문제이지?\"\n\n 큰 언성으로 마리나가 되물었다.\n\n 트로츠키는 마리나에게 프롤레타리아 독재가 제대로 확립되기 위해서는 인민대중의 실제적인 권력수립을 위해 그들을 통제의 대상이 아닌 상호부조의 객체로 바라볼 것을 부탁하였다.\n\n \"제길, 이상론만 제시하고, 너는 오만하기 짝이없군. 그렇게 해서 민중들의 지지를 받았다면 서부공세는 왜 실패했지? 너 자신도 무능한 주제에...\"\n\n \"마리나 동지, 현지인민위원장 동지께 예를 차리세요!\"\n\n 망할 토모에가 자신의 말을 끊자, 마리나는 몸이 안 좋다며 회의실을 나섰다."
 RED_marina_event.6.a: "'분명히 토모에가 무언갈 꾸미고 있어.'"
 RED_marina_event.7.t: "이반 쿠팔라"
 RED_marina_event.7.d: " 반권위주의에 관한 조치로 체리노 동상을 없애자는 논의가 계속 진행되고 있는데도, 여전히 체리노 흉상 여럿이 사무국 복도에 나열되어 있었다. 마리나는 체리노가 트로츠키에 의존하는 듯 하는 것 같아서 심기가 불편했다. 잡생각에 놓여 걸음에 집중하지 못하던 마리나는, 둔탁한 소리가 바닥에서 나는 것을 들었다.\n\n  \"젠장, 흉상을 깨버렸잖아.\""
 RED_marina_event.7.a: "'...'"
 RED_marina_event.8.t: "여름 - 1"
 RED_marina_event.8.d: " 내리쬐는 햇볕이 붉은겨울 전토를 달구지는 못하지만, 그 따스함에 사람들은 마음을 놓고 푸근함을 만끽합니다. 무엇보다 축제가 한창인 까닭에, 연방학원의 학생들과 이에 관심을 가지는 현지인들이 거리를 붐비며 번화가를 자신들의 색채로 물들이고 있습니다.\n\n \"그치만 위원장 동지, 이번 결정이 실패한다면 트로츠키 그 작자에 의해 보안위원회와 친위대가 온전히 해체될지도 모릅니다.\"\n\n \"그것이 더더욱 행동의 명분에 무게를 싣는 거다! 학원 외부에 트로츠키를 원하는 거대한 세력이 있다. 그 세력의 도움을 받아 트로츠키를 생포하고 쿠데타, 압제에 항거해 일어난 물결치는 '군사혁명'을 선언하는 것은 대의에 호소하는 우리의 정의가 빛날 일밖에 더 되지 않아! 자부심을 가져라, 불의에 단호히 반대하고, 올바름에 당당히 연대하자!\"\n\n 지하실은 수 초 간 정적을 유지하다, 보안위원들의 환호와 박수소리로 가득 찼습니다."
 RED_marina_event.8.a: "'멱라수는 넘쳐흐르고...'"
 RED_marina_event.9.t: "여름 - 2"
 RED_marina_event.9.d: " 옅게 드리운 달빛이 어둠과 함께 세상을 양분했을 때, 도시의 사람들은 쉽게 잠들 수 없었습니다. 박자 맞춰 터벅이는 발걸음이 거리에 울려퍼졌고, 청사 주변에 사는 시민들은 수 십 번의 총격을 들었기 때문입니다. 민중들에 의해 자체적으로 조직된 민중방위대는 중앙의 사정을 알 수 없었고, 사무국 친위대가 겨울군대 총사령부를 반혁명 혐의로 긴급체포하며 군부마저 무력화되었습니다.\n\n 뒤이어 오전 6시, 사무국 내에서 10여분 간의 총성이 있은 후, 긴급사변에 따른 계엄령의 발효가 체리노그라드 전역에 안내되었습니다. 보안위원회는 특별법에 따라 전시사법위원회를 구성하였고, 뒤이어 사무국 내 주요 임원들에게 영장이 발부되었습니다. 수 시간이 지나지 않아 보안위원회에 적대하던 트로츠키파 사무국 위원들과 사시로 토모에가 붙잡혔으나, 체리노, 트로츠키를 비롯한 고위 임원들의 행방은 묘연했고, 이들을 찾아내기 위한 대규모 수색작전이 오전 11시까지 진행되었습니다.\n\n 그러나 체리노그라드에 그들이 없다는 것만을 알아낸 채, 전시사법위원회 총회가 소집되었습니다."
 RED_marina_event.9.a: "우선, 군사혁명을 선언합시다."
 RED_wartime_judicial_commission: "전시사법위원회"
 RED_marina_event.10.t: "여름 - 3"
 RED_marina_event.10.d: "수도의 친위대와 보안위원회를 이용해 사무국을 점거하는 것은 성공적이었지만, 우리는 교외 지역과 지방에 대한 통제력을 전혀 얻지 못했습니다. 정부는 몰락했고, 신정부는 구성 중입니다. 공백이 된 권력 속에서, 무엇이 피어날지 예상할 수 없습니다..!"
 RED_marina_event.10.a: "젠장, 너무 서둘렀어!"
 RED_marina_event.11.t: "용역부 봉기"
 RED_marina_event.11.d: "붕괴된 행정으로 인해, 반정부 세력이 봉기했습니다!"
 RED_marina_event.11.a: "젠장!"
 RED_marina_event.12.t: "지식해방전선 궐기!"
 RED_marina_event.13.t: "출판부 독립!"
 RED_marina_event.14.t: "구교사에서의 봉기!"
 RED_marina_event.15.t: "트로츠키의 봉기!"
 RED_marina_event.16.t: "사프미 독립!"
 RED_marina_event.17.t: "재건된 사무국!"


 RED_event.1.t: "[FROM.GetName]의 최후 통첩"
 RED_event.1.d: "[FROM.GetName]에서 최후 통첩을 보내 왔습니다. 그들은 고틀란드의 통제권을 넘겨받기를 원하며, 응하지 않을 시 전쟁도 불사할 것 이라는 입장을 취하고 있습니다.\n\n어떻게 해야 할까요?"
 RED_event.1.a: "그들의 요구대로 해라"
 RED_event.1.b: "있을 수 없는 일이다"
 RED_event.2.t: "우리의 요구를 수락한 [FROM.GetName]"
 RED_event.2.d: "[FROM.GetName]은 결국 우리의 압박에 못이겨 고틀란드의 우리에게 통제권을 넘기기로 했습니다."
 RED_event.2.a: "그들은 현명한 선택을 했다"
 RED_event.3.t: "우리의 요구를 거절한 [FROM.GetName]"
 RED_event.3.d: "[FROM.GetName]은 우리의 위협에도 불구하고 고틀란드를 끝까지 사수하겠다는 입장을 밝혔습니다."
 RED_event.3.a: "어리석은 선택을 했군"
 RED_event.4.t: "군정 체제의 해결"
 RED_event.4.d: "붉은겨울 연방학원이 전쟁 이후 수립한 군정 체제는 현지 통제에 효과적이었으나, 반군과 내통하는 사령관과 군 내 부패, 그리고 지속적으로 심해져가는 저항을 해결해야만 합니다.\n\n연방학원의 미래를 위해 학원의 이념과 맞지 않는 군정 체제를 철폐하고, 더 나아가 스칸디나비아 전체를 연방학원과 통합하는 것은 필수적인 수단이 될 것입니다."
 RED_event.4.a: "확실히, 군정청은 철폐되어야 한다."
 RED_event.5.t: "사무국 내 권력의 균형"
 RED_event.5.d: "러시아 출신 볼셰비키 혁명가인 레프 트로츠키는 금방 학생들에게 큰 인기를 사며 지지를 모으고 있습니다. 체리노의 단일한 지도에 금이 그어지고 트로츠키가 권력의 중앙으로 다가오고 있습니다."
 RED_event.5.a: "심상치 않아."
 RED_event.6.t: "출판부의 향방"
 RED_event.6.d: " \"체리도 동지의 안건은 외부 반혁명 세력의 프로파간다와 같은 불순한 소지의 글과 제대로 확인되지 않은 유언비어의 확산에의 방지없이, 부르주아 민주주의자들이 그러하듯이 '방임'을 두고 마냥 '자유'라 부르며 민중을 위하는 척 위선할 뿐이오. 안건을 철회하여주길 부탁드리오.\"\n\n 트로츠키의 단호한 목소리가 회의실을 선명하게 채웠다.\n\n \"그렇게 이야기한다면, 트로츠키 너야말로 네 지지자가 많이 근무하고 있는 편집국이 축소되어 스스로의 정치적 입지가 낮아질 것을 걱정하여 나의 의도를 왜곡하고 호도하는 소부르주아적 소아병의 증세를 보이고 있는 것일 여지 또한 충분하다고 이야기할 수 있지 않겠어? 편집국의 보도 조례와 규모의 검열 지침은 더 이상 '혁명성의 유지'라는 목적을 잃은 지 오래라는 건 분명해!\"\n\n 트로츠키는 공론의 의제에서 벗어나 체리노가 발화자 공격의 오류를 범하고 있다며 재반박하였다."
 RED_event.6.a: "체리노의 의견이 관철되었다."
 RED_event.6.b: "트로츠키가 상임위원들의 지지를 받았다."
 RED_edit_disagree: "체리노가 논쟁에서 이겼습니다."
 RED_edit_disagree_1: "트로츠키키가 논쟁에서 이겼습니다."
 RED_event.7.t: "동맹을 모색하는 [FROM.GetName]"
 RED_event.7.d: "[FROM.GetName]이 동맹을 모색하고 있다면서 우리를 찾아왔습니다. 그들은 우리의 선택을 기다리고 있습니다."
 RED_event.7.a: "좋다. 그들과 함께 하자"
 RED_event.7.b: "아니, 필요 없다"
 RED_event.8.t: "우리의 제안을 수락한 [FROM.GetName]"
 RED_event.8.d: "그들이 우리의 제안을 수락했습니다."
 RED_event.8.a: "좋았어"
 RED_event.9.t: "우리의 제안을 거절한 [FROM.GetName]"
 RED_event.9.d: "그들이 우리의 제안을 거절했습니다."
 RED_event.9.a: "유감이군"
 RED_event.10.t: "[RED.getname]의 통행 요구"
 RED_event.10.d: "[RED.getname](으)로부터 군사통행권이 요구되었습니다."
 RED_event.10.a: "어쩔 수 없다."
 RED_event.10.b: "거부해라."
 RED_event.11.t: "[RED.getname](으)로부터의 불가침 조약 제안"
 RED_event.11.d: "[RED.getname](으)로부터 불가침조약을 맺을 것이 제안되었습니다. 다가온 [SOV.GetAdjective] 앞에서 이는 유용할 것입니다."
 RED_event.11.a: "좋은 제안이군."
 RED_event.11.b: "우린 저들과 타협하지 않는다."
 RED_event.12.t: "[FROM.getname]의 수락"
 RED_event.12.d: "[FROM.getname]은(는) 우리의 제안을 수락했습니다."
 RED_event.12.a: "완벽해."
 RED_event.13.t: "[FROM.getname]의 거절"
 RED_event.13.d: "[FROM.getname]은(는) 우리의 제안을 거절했습니다."
 RED_event.13.a: "알겠다."
 RED_event.14.t: "도주하는 트로츠키주의자!"
 RED_event.14.d: "트로츠키 동지의 대의에 동의하는 소비에트 내 많은 지식인, 관료, 활동가들이 트로츠키가 [RED.getname]에서 활동을 재개한다는 소식을 접하자 소련을 벗어나 망명에 들었습니다. 운이 좋다면 체리노 동지께서 이들을 규합하실 수 있을 것입니다."
 RED_event.14.a: "형세가 바뀌고 있다."
 
#이벤트(마리나)
 
 RED_event.15_tt: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 완료하지 않아 가장 낮은 효과의 국민정신을 얻습니다."
 RED_event.15_tt1: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G1§!개 이상 완료하여 두 번째로 가장 낮은 효과의 국민정신을 얻습니다."
 RED_event.15_tt2: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G4§!개 이상 완료하여 세 번째로 가장 낮은 효과의 국민정신을 얻습니다."
 RED_event.15_tt3: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G7§!개 이상 완료하여 중간에서 낮은 정도의 국민정신을 얻습니다."
 RED_event.15_tt4: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G10§!개 이상 완료하여 중간 정도의 국민정신을 얻습니다."
 RED_event.15_tt5: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G16§!개 이상 완료하여 중간에서 높은 정도의 국민정신을 얻습니다."
 RED_event.15_tt6: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G21§!개 이상 완료하여 세 번째로 가장 높은 효과의 국민정신을 얻습니다."
 RED_event.15_tt7: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G27§!개 이상 완료하여 두 번째로 가장 높은 효과의 국민정신을 얻습니다."
 RED_event.15_tt8: "\n중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 중점을 §Y[?RED_prepare]§!개로써 §G전부§! 완료하여 가장 높은 효과의 국민정신을 얻습니다."
 RED_event.15.t: "혁명 전쟁"
 RED_event.15.d: "언젠가 일어날 일이었습니다. 스칸디나비아에서 피어난 혁명의 불꽃이 전세계를 삼키기에 앞서, 반동 파시스트 - 극우 나치 세력의 그림자를 불사를 것입니다."
 RED_event.15.a: "혁명을 수호하자, 나치를 쳐부수자!"
 RED_event.16.t: "노동자 공화국"
 RED_event.16.d: "무산 대중이 모든 생산수단을 자신들의 손 안에 넣었고, 또한 정치적 지배계급으로 자리매김하였기 때문에 노동자 공화국은 생산성을 최대한 급격히 끌어올려 다른 억압받는 노동계급 동지들과 미래로의 진보를 위해서 노력해야 합니다. 우리는 혁명 이후 필요한 조치를 충분히 취했고, 경제는 안정되었으며, 중앙에 집중되지 않은 채의 사회주의 또한 실현 가능하다는 것을 똑똑히 증명하였습니다. 붉은겨울의 앞에는 오로지 진보만이 남아있습니다!"
 RED_event.16.a: "사회주의 만세!"
 RED_event.17.t: "노동조합주의의 여명"
 RED_event.17.d: "모든 부문에서 노동조합이 대규모로 재편되었고, 노동자들은 조합을 통해 생산하고, 계획하고, 의견을 표현하고, 표를 행사하고 있습니다. 이는 생활 전선에 있어서 생디칼리즘의 승리가 분명하며, 가히 노동해방이라 부를 수 있습니다."
 RED_event.17.a: "노동조합 만세!"
 RED_event.18.t: "노르웨이의 사회주의자들"
 RED_event.18.d: "노르웨이에 대한 통합이 완료됨에 따라, 노르웨이의 사회주의자들이 우리 정부에 참여하길 원하고 있습니다."
 RED_event.18.a: "환영하오, 동지들!"
 
 RED_event.19.t: "마리나를 거부한 용역부"
 RED_event.19.d: ""
 RED_event.19.a: "제기랄..."
 RED_event.20.t: "여전히 남아있는 위협"
 RED_event.20.d: ""
 RED_event.20.a: "\"아직도 남았다고?!\""
 
 RED_event.21.t: "급격한 변화"
 RED_event.21.d: "주 3일제에 많은 이들이 환호하긴 했으나, 생산량이 급격하게 감소하였기 때문에 이를 영구히 유지할 수는 없습니다. 우리는 대안으로서 학생들에게만 주 3일제를 보장하고, 현지인 노동자들에게는 탄력근무제와 주 4.5일제를 보장하기로 했습니다."
 RED_event.21.a: "아쉽게 됐군."
 RED_event.21.b: "어떻게든 유지할 수는 있을 거 같은 걸."
 RED_event.22.t: "제2차 AEP에 대한 평가"
 RED_event.22.d: " 거대한 회의장에 수 백의 인민위원들이 모였습니다. 이들은 대안경제정책을 두고 시시비비의 갑론을박을 벌이기 위해 임시의 회의를 개최하였는데, 이는 AEP 해소파들의 주도에 의했습니다.\n\n\"아르놀드 동지의 출신 성분이 덴마크의 노동자들을 착취하던 자본가라는 사실은 매우 공공연하오! 그런 이가 다시 산업감독자 직위를 맡는 것은 자본주의에 대한 옹호가 분명하며, 사회주의 체제에 대한 위협임이 자명하오!\"\n\n\"소부르주아적 사업, 이를 테면 중소기업과 같은 산업들에 쥐어진 세금들은 대중들의 노동자 계급성을 흐트리고 있소!\"\n\n 반대파의 의견이 거세게 터져나왔고, 쉽사리 숙의에 따른 결정이 나지 않자, 의장은 대안경제정책의 향방에 대한 가부를 표결에 붙이게 되었습니다."
 RED_event.22.a: "협동조합주의로 심화하자!"
 RED_event.22.b: "시장사회주의로 해소하자!"
 RED_event.22_tt_1: "우리는 §Y제2차 대안경제정책§!의 목표인 §R80§!의 §Y민간 공장§!에 도달하지 못하였기에 §YAEP§!를 강행하기에 어려움을 겪습니다:\n"
 RED_event.22_tt_2: "§Y제2차 대안경제정책§!의 목표인 §G80§!의 §Y민간 공장§!에 도달했기 때문에 §YAEP§!를 중단하는 데에 어려움을 겪습니다!\n"
 RED_event.24.t: "민트초코해방전선의 쿠데타"
 RED_event.24.d: "민트초코해방전선은 대전이로 인한 민트초코 배급 부족 문제에 대한 해결 탄원서를 꾸준히 제기했음에도 이것이 받아들여지지 않자 쿠데타를 개시하였습니다. 배달노동자로 위장하여 친위대의 의심을 피하며 중앙 캠퍼스로 진입한 민트초코해방전선의 대원들은 건물 전역을 점거하고 농성을 벌이며 친위대를 공격했습니다. 기습에 놀란 친위대는 일시적으로 캠퍼스에서 후퇴하였습니다."
 RED_event.24.a: "아오"
 RED_event.24_tt: "\n국민정신 §Y$RED_threat_of_coup$§!에 의해서 지속적으로 §R쿠데타§!가 발생합니다. 이 국민정신은 중점 §Y$RED_club_focus_2$§!을 통해 제거할 수 있습니다."
 RED_event.25.t: "가라아게에 레몬을 반대하는 혁명가들의 모임의 쿠데타"
 RED_event.25.d: "대전이 이후 가라아게에 레몬을 뿌려 먹는 학생들에 대한 가라에게에 레몬을 반대하는 혁명가들의 모임에 의한 테러리즘이 점점 빈번해지자, 사무국은 이들에 대한 집중 단속을 조치했습니다. 그러자 이들은 체리노그라드 도심으로 집결하여 한밤중에 캠퍼스를 습격해 보안대원들을 제압하고 반레몬임시행정위원회를 구성하였습니다. 이들은 수 일 내에 지체없이 신정권의 설립을 발표할 예정입니다."
 RED_event.25.a: "미친 사람들이다."
 RED_event.26.t: "한겨울냉수마찰총연맹의 쿠데타"
 RED_event.26.d: "지난 새벽 3시, 한겨울냉수마찰총연맹 회원들이 갑작스럽게 캠퍼스로 집결하여 사무국을 점거하고 농성에 들어섰습니다. 아직 출근하지 않은 관료들은 '아쉽게도' 강제적인 유급휴가를 만끽하고 있으며, 이들에 대한 진압작전이 곧 펼쳐질 것입니다."
 RED_event.26.a: "서두르진 말자고."
 RED_event.27.t: "진압"
 RED_event.27.d: "지난 쿠데타에 대한 진압 작전이 성공적으로 완료되었으며, 보안위원들은 도시 곳곳에 있는 프로파간다 전단지와 쿠데타 세력의 깃발들을 치우는 데에 바쁩니다. [RED.getleader]는(은) 다시금 집무실의 의자에 앉아 업무를 시작합니다."
 RED_event.27.a: "천만다행이다."
 RED_there_is_coup_flag: "§t늘 있는 쿠데타로 인해 정부가 마비됨§!"
 RED_event.28.t: "분쇄된 반정부단체들"
 RED_event.28.d: "붉은겨울에서 오랜 시간동안 지속되었던 반정부 세력의 쿠데타 위협이 성공적으로 분쇄되었습니다. 주요 반정부단체들의 지도자들은 연행되어 구교사에 구금되었으며, 그 잔당들은 산산히 해산되었습니다. 붉은겨울은 이제 정치적으로 안정합니다!"
 RED_event.28.a: "다행이군."
 RED_event.28_tt_1: "§L한겨울냉수마찰총연맹이 해산되었습니다.§!"
 RED_event.28_tt_2: "\n§L가라아게에 레몬을 반대하는 혁명가들의 모임의 테러리즘이 근절되었습니다.§!"
 RED_event.28_tt_3: "\n§L민트초코해방전선의 자산을 전부 압수했습니다.§!"
 RED_event.29.t: "위조지폐 발행"
 RED_event.29.d: "적국은 비겁하게 위조지폐를 발행하여 우리나라의 경제를 파탄내고 있습니다!"
 RED_event.29.a: "젠장!"
 RED_event.30.t: "겨울 대전"
 RED_event.30.d: "적국과의 싸움은 쉽지 않을 것임이 양국 국민들에게 모두 받아들여지고 있습니다. 우리는 어떤 식으로든 돌파구를 찾아야 합니다."
 RED_event.30.a: "저들을 이기자!"
 RED_event.31.t: "생화학 무기"
 RED_event.31.d: "적국이 살포한 생화학 무기가 아군의 작전을 방해하고 있습니다!"
 RED_event.31.a: "옛날에 이런 걸 금지했던 기억이 있는 거 같은데."
 RED_event.32.t: "인구 문제"
 RED_event.32.d: "대전이로 인해 수백만의 학생이 그대로 이곳에 오게 되었습니다. 유감스럽게도, 이곳의 한계는 명확했습니다. 학생들은 도시에서 포화된 인구로 인해 고통받고 있으며, 이는 대규모 소요와 경제, 질서, 행정의 붕괴로 이어질 여지가 충분합니다."
 RED_event.32.a: "어떻게든 해결해야 한다!"
 RED_event.32_tt: "\n중점 §Y$RED_land_research$§!을 통해 해금되는 §Y£GFX_decision_icon_small 결정들§!을 통해 §R인구 포화§!를 완화할 수 있습니다."
 RED_event.33.t: "주자파의 결집"
 RED_event.33.d: "자본주의 노선을 주장하는 주자파들이 성장하고 있는 것이 분명합니다. 우리는 이들을 억제해야 합니다!"
 RED_event.33.a: "골치아프군."
 RED_event.34.t: "와해된 주자파"
 RED_event.34.d: "적극적인 반자본주의 캠페인 덕분에 주자파가 와해되었습니다."
 RED_event.34.a: "다행이군,"
 RED_event.35.t: "인구 문제의 해결"
 RED_event.35.d: "대전이로 인해 혼란스러웠지만, 우리는 가까스로 인구 문제를 해결할 수 있었습니다. 하지만 아직 끝나지 않았습니다. 그들에게 부족한 것은 식량뿐만이 아니라 생필품과 소비재 또한 마찬가지입니다. 소비재 품귀를 해결하기 위해서 우리는 또한 부단히 노력해야만 합니다."
 RED_event.35.a: "그들에게 줄 소비재만 있다면 다행이겠군!"
 RED_event.36.t: "작은 문제점"
 RED_event.36.d: "노르웨이 헬겔란트에서의 공세가 완료된 이후, 사무국은 행정 혼란을 최소화하기 위해 행정관료직과 군정사무관직의 규모를 크게 늘렸습니다. 연방학원에의 위협이 소강 상태에 접어든 상태에서, 일부 지역에서 서기들이 전송하는 보고서가 누락되거나, 연락이 두절되는 등의 문제가 있음이 확인되었습니다. 더 정확한 것은 조사를 통해 알아봐야겠지만, 아직까지 큰 문제는 아닌 것으로 보여집니다."
 RED_event.36.a: "서기들의 실무 교육을 강화해야겠군."
 RED_event.36.b: "군정청이 뭐야?"
 RED_event.37.t: "드러난 부패"
 RED_event.37.d: "충격적인 보고가 사무국에 전달되었습니다. 연방학원의 서기들은 현지인과 결탁해 부정부패를 일삼고 있었고, 군정기관의 행정은 엉망입니다. 각 작업장에서 보고된 보고서에 적힌 생산량은 더 많은 지원을 얻기 위한 거짓이었으며 급양부는 서류상으로만 존재하여 학생들에게의 배식은 전혀 진행되지 않고 있었습니다. 연방학원을 위해 충실히 복무한다고 보고받았던 학생들의 자치적인 민중방위대 사단들은 진작에 와해되었거나, 스스로 해산을 결의하여 사라진 채였으며, 겨울군대에서의 보고서 또한 우리는 신뢰할 수 없습니다!"
 RED_event.37.a: "충격적이군!"
 RED_event.38.t: "산업 발전의 맹아"
 RED_event.38.d: "붉은겨울에의 위기로 다가온 인구 포화 위기는, 기회로서 다시 다가왔습니다. 학생들은 농촌으로, 작업장으로, 벌목장으로, 제재소로, 광산으로, 그 어디든 일손이 부족한 곳에 가서 민중들을 돕고 있으며, 늘어난 인구는 스칸디나비아와 연방학원의 생산을 환하게 비출 원동력이 될 것이 분명합니다!"
 RED_event.38.a: "다행이군."
 RED_event.38_tt: "§Y현지 기술관료 등용§! 계통의 무작위 세 중점이 완료됩니다! 중점이 전부 완료되어 이 이벤트로 완료하지 못 한 중점의 수만큼 §Y민간공장§!을 받습니다.\n\n"
 RED_event.39.t: "적색테러에 희생된 현지 우익"
 RED_event.39.d: "많은 현지의 우익 정치인들이 그들의 국왕을 데리고 망명을 한 반면, 또 다른 많은 우파 청년 단체들이 여전히 우리 학원건설을 방해하고 있습니다. 사무국의 결정에 따라 이들에 대한 소탕 작전이 실시되었지만, 명령이 하달되는 과정에서 간부 간 실적 경쟁에 의해 부대마다 소탕 할당량이 지정되었고, 이는 현지인에 대한 분별없는 체포와 구금으로 이어졌습니다. 일주일만에 지시는 철회되었어도, 우리를 방해하는 준군사조직은 확실히 격퇴했습니다."
 RED_event.39.a: "좋은 건가?"
 

#이벤트/군정청 붕괴
 RED_instability_system.1.a: "이거 보이면 버그임"
 
 RED_instability_system.2.t: "군정청의 불안"
 RED_instability_system.2.d: "군정 체제가 지속되는 현재, 시민들이 군정청의 통제에서 벗어나기 시작했다고 [FROM.GetName]의 군정사령관이 알려왔습니다. [FROM.GetName]뿐만 아니라 다른 모든 군정청의 상황이 통제에서 벗어나기 시작한 현재, 우리는 군정청의 문제를 해결하기 위해 노력해야 합니다."
 RED_instability_system.2.a: "큰일이야."
 RED_instability_system_2_tt: "§Y사건과 결정§! 탭을 확인하세요."
 
 RED_instability_system.3.t: "군중 시위"
 RED_instability_system.3.d: "[ROOT.capital.GetName]의 대로변에서 군중들이 시위를 벌이고 있습니다."
 RED_instability_system.3.a: "우리는 아무 것도 할 수 없다."
 RED_instability_system.3.b: "시위대를 해산시킨다."
 
 RED_instability_system.4.t: "혁명의 물결"
 RED_instability_system.4.d: "체계적으로 계획된 시위인지, 아니면 우리가 미처 파악하지 못한 저항인지 알 수 없습니다. 그러나 단 한가지 확실한 사실은 시민들은 자체적으로 군을 조직하고 있고, 거대한 규모의 시위대가 우리의 행정 청사를 향해 진군하고 있다는 것입니다.\n\n결과적으로 현재의 군정 체제는 폭압적인 지배로 이루어졌다는 것이 증명되었고, 그 대가를 지금 치루고 있는 것일지도 모릅니다."
 RED_instability_system.4.a: "시위대와 함께하자. 우리가 나서서 설득하겠다."
 RED_instability_system.4.b: "전원, 전투 준비."
 
 RED_instability_system.6.t: "[FROM.GetAdjective]의 봄"
 RED_instability_system.6.d: "[FROM.GetAdjective] 지역에 세워진 군정청이 큰 규모의 시위에 동참하여 우리 정부에게 시위대와의 협상을 요구하고 있습니다. 시위대와 전 군정사령부는 우리가 그동안 행한 통치는 폭압적이라고 비판하며 현지 국가들과 평화적인 관계를 구축할 것을 요구하고 있습니다."
 RED_instability_system.6.a: "반란을 진압해라."
 RED_instability_system.6.b: "좋아...좋아 다시 시작해보자고."
 
 RED_instability_system.61.t: "침묵으로 일관하는 [FROM.GetName]"
 RED_instability_system.61.d: "우리가 [FROM.GetName] 에게 협상을 시도하였으나 [FROM.GetName] 측은 침묵으로 일관하고 있습니다. 협상은 실패한 것으로 판단되며, 이제 우리는 [FROM.GetName]의 침략을 대비해야 합니다."
 RED_instability_system.61.a: "최후의 저항을 펼쳐라."
 
 RED_instability_system.62.t: "통제받기 시작한 경제"
 RED_instability_system.62.d: "[FROM.GetName]은(는) 경제 프로젝트에 우리의 자원을 동원하는 것을 대가로 독립적인 국가 구축을 허용했습니다. 한동안은 [FROM.GetName]측의 경제적 종속을 받겠지만 우리는 독립을 이뤄냈습니다."
 RED_instability_system.62.a: "결실을 맺었군."

 RED_military_government_occupation.1.t: "덴마크 점령"
 RED_military_government_occupation.2.t: "노르웨이 점령"
 RED_military_government_occupation.3.t: "스웨덴 점령"
 RED_military_government_occupation.4.t: "핀란드 점령"

 RED_military_government_occupation.1.desc: "붉은겨울 연방학원의 군세가 반군을 모두 소탕하고 그들의 수도에 입성했습니다. 이번의 군사 작전을 통해 해당 지역의 주민들은 우리의 통치에 한동안 반발하지 못할 것입니다.\n\n우리는 이제 통제에 들어온 해당 지역을 통치할 방안을 생각해 보아야 합니다."
 RED_military_government_occupation.1.a: "군정청을 다시 설치하라."
 RED_military_government_occupation.1.b: "괴뢰 정권을 수립하라"
 RED_military_government_occupation.1.c: "직접 통치한다."
 RED_military_government_occupation.1.d: "연방학원에 통합해라!"

#이벤트 / 미노리
 RED_minori_event.1.t: "빠른 대처"
 RED_minori_event.1.d: "미노리는 적잖이 당황했다. 대규모 폭동은 아직 시기상조라 생각했기 때문이었다. 그러나 체제적 억압에 다소 미온적이었던 사회민주노동자당이나 기성 노동조합에 실망한 시민들은 급진화하여 생디칼리즘 성향의 SAC에 힘을 보태주었다. 용역부의 예상보다 더 빠르게 시민들이 체제전복의 열망으로 타오르고 있었기 때문에, 특히 직접행동을 노선으로 표방해 온 SAC 내 급진적인 파벌 일부가 독단적으로 노동절에 이뤄지는 군사 행진을 습격한 것이었다. 이는 사전에 그 어떤 단체와도 협의되지 않았기 때문에 다분히 일시적이고 진압될 여지가 충분했으나, 미노리는 소식을 듣자마자 결단을 내려야 했다. 그녀는 용역부원들을 믿었기에, 직접 여러 지역을 돌며 용역부원들을 이끌고 체리노그라드로 상경토록 촉구했다. 그렇게 일순간에 꺼질 수 있던 혁명의 불씨가 용역부원들의 합세와 함께 체제전복으로 이어질 수 있었다."
 RED_minori_event.1.a: "우리는 연대의 가치를 알고 있다!"
 RED_minori_event.2.t: "용역부"
 RED_minori_event.2.d: "시끄러운 호각과 함께 야스모리 미노리가 이윽고 모습을 드러내 특별반으로 다가와, 확성기에 입을 가까이 대었다.\n\n\"반갑다, 동지들! 우리는 지금 체리노에 대항하는 반체제 혁명의 와중이다. 나는 동지들과 거래를 하러 왔다.\"\n\n\"무슨 거래?\"\n\n시구레가 의심쩍은 눈으로 미노리를 바라봤다. 미노리는 시구레를 잠깐 쳐다보곤, 다시 특별반으로 시선을 돌려 외쳤다.\n\n\"이제 체리노의 모든 압제는 끝날 것이다! 동지들이 반체리노 혁명전선에 가담하는 조건 아래, 우리는 동지들을 구교사에서 구출하여 본교사에 자리를 마련해줄 것이다!"
 RED_minori_event.2.a: "\"나는 다른 거 말고 마음대로 음료를 만들 수 있게 만 해줬으면 좋겠어.\""
 RED_minori_event.3.t: "우발"
 RED_minori_event.3.d: "노동절의 항거는 용역부나 사회민주노동자당에 의해서 계획된 일이 아니었습니다. 이는 SAC와 민중의 자발성에 의한 것으로 굉장히 우발적이며 즉흥적으로 이뤄졌습니다. 그럼에도 용역부는 능동적으로 후속대응에 참여했으며, 정부 전복의 목표를 달성해 낸 것에 반면, 스웨덴 사회민주노동자당은 긴급적으로 소집된 당 내 회의에서 오랜 회의를 이어갔습니다. 승기가 시민들 쪽으로 기울자, 혁명 정부의 '급진화'를 저지하기 위해 사회민주노동자당이 적극적으로 혁명 정부에 참여해야 한다는 결론을 내린 그들은 용역부, 그리고 현지 노동조합들과 함께 정부 구성에 참여했습니다."
 RED_minori_event.3.a: "급진화를 경계한다는 건 반혁명에 해당하는 건가?"
 RED_minori_event.4.t: "노동절 집회"
 RED_minori_event.4.d: " 여느 노동절 때와 같이 올해 붉은겨울에서의 노동절도 정오의 화려한 군사 퍼레이드와 체리노에 대한 개인숭배로 칠해진 채 마무리될 예정이었습니다. 그러나 체리노그라드에서 퍼레이드를 관람하던 군중들의 표정은 그 어느 때보다 굳어있었으며, 무언가를 결심한 듯 보였습니다.\n\n 기병대가 대로를 행진하고, 군용 차량이 대오를 뒤이어 따르고 있을 때, 갑작스럽게 호루라기 소리가 시끄러이 들려오자 군중들은 조직적으로 군용차량을 탈취하고 퍼레이드 대열을 공격하였습니다. 군인들은 기습에 당황하여 제대로 대응하지 못하였고, 일반 병사들은 오히려 시위대에 가담하기도 하였습니다.\n\n 그러는 동안 체리노그라드 곳곳의 경찰서와 역사, 은행, 행정청사가 성난 군중들에 의해 차례차례 점거되었으며, 민중들은 무기고를 습격하여 무장을 갖추기 시작하고 있습니다.\n\n 체리노그라드의 시민들은 렌카와 체리노와 그녀의 하수인들에 불과한 사무국이 황급히 서쪽으로 도피한 사실을 저녁이 되어서야 확인하였지만, 그들은 그들 자신이 이룬 승리에 기뻐하고 있습니다."
 RED_minori_event.4.a: "혁명이다!"
 RED_minori_event.5.t: "엄습하는 반혁명"
 RED_minori_event.5.d: "현재 붉은겨울에서는 불안한 소식이 들려오고 있습니다. 하급 행정관료들과 장교들의 지지를 받고 있는 렌카와 체리노와 사무국이 서부에서 반혁명을 위한 세력을 결집하고 있다는 것입니다.\n\n 그들은 군정청의 군사력에 도움을 받아 발빠르게 우리를 습격할 수 있기에, 우리는 그들의 공격에 대비하여야만 합니다."
 RED_minori_event.5.a: "강철 같은 연대로 그들을 막아내자!"
 RED_minori_event.5_tt: "§R모든 부대 해산§!\n\n"
 RED_minori_event.6.t: "진압된 오슬로 봉기"
 RED_minori_event.6.d: "지난 5월 1일은 오슬로에서 열기가 최대로 타오른 때였습니다. 도시의 교통이 마비되었으며, 관공서는 불질러졌고 거리에는 현수막과 여러 깃발들이 펄럭이고 있었습니다. 그러나 사무국 친위대가 오슬로에 도달하자 규모의 진압 작전이 시행되었습니다. 오슬로의 민중들은 무차별적으로 탄압당했으며, 공장과 주거지, 그리고 대학에서 진행된 일주일 간의 항쟁은 많은 사상자를 남긴 채 전부 짓밟혔습니다. 소규모 시가유격대와 농촌 파르티잔이 저항을 이어가고 있지만 오슬로의 민중들을 해방하기 위해서는 우리가 직접 움직여야 할 것입니다."
 RED_minori_event.6.a: "체리노를 타도하라!"
 RED_minori_event.7.t: "혁명방위전선"
 RED_minori_event.7.d: "붉은겨울 정규군에서 활약하던 일부가 우리의 대의에 동참하여 탈영하였습니다. 우리는 이들을 규합하고 훈련시켜 드디어 적의 공세에 대항할 군사적 자산을 확보할 수 있게 되었습니다. 혁명방위전선은 이제 지역병사평의회와 노농적군과 연계하여 무장상태에 돌입하고 있습니다."
 RED_minori_event.7.a: "반혁명을 분쇄하라!"
 RED_minori_event.8.t: "공장위원회"
 RED_minori_event.8.d: "스웨덴 전역에서 사무국 관료들과 자본가들이 대거 철수하였기 때문에, 파업에 돌입했던 많은 노동자와 조합들은 자체적으로 공장위원회를 구성해서 사업체를 운영하고 있습니다. 혁명 정부는 이와 같은 현상을 지지한다는 논평을 발표하며 이를 지원하고 권장토록 하겠다고 밝혔습니다."
 RED_minori_event.8.a: "작업장으로!"

 RED_minori_event.11.t: "가장 높은 권위와 마주하는 영광"
 RED_minori_event.11.d: " 평등과 해방의 학원이었던 붉은겨울을 실질적인 과두정체에 의해 운영되게 만든 사무국과 친위대 그리고 그 모든 것을 지도한 반동분자 체리노가 노동조합원과 학생으로 구성된 자경대에 의해 노르웨이 북방의 항구에서 체포되었습니다. 그들은 체포된 즉시 수도인 체리노그라드로 송환되었으며, 혁명위원회는 체리노그라드 시민 전체를 배심원으로 하는 '민중재판'에 체리노를 회부하기로 결정하였습니다.\n\n 사흘 뒤 재판이 치뤄졌으며, 체리노는 자신의 다른 정적들이 그러하였던 것처럼 국선변호사조차 얻지 못한 채 분노한 민중에게서 날아오는 돌덩이를 맞으며 재판을 진행해야 했습니다. 대중들은 그녀의 범죄가 광범위하고 대규모였으며, 중대했다는 점을 언급하며 큰 목소리로 그녀의 처형을 요구하였고, 한편으로 일부 지식인들은 그녀의 비이성적인 통치가 그녀 스스로의 낮은 지능에 기인하기 때문에 노동교화형으로 충분하다고 주장하였고, 또한 사회민주주의자들은 사형이 구시대적 억압 수단이라는 점을 들어 이를 반대하였습니다. 혁명위원회는 숙고 끝에 노동교화형과 징역형을 두 안으로 선정하여 투표에 부쳤습니다.\n\n 결과적으로 그녀가 노동교화형에 처해짐에 따라 붉은겨울 중앙 캠퍼스 내 화장실 청소와 급양부에서의 잡무를 배정받았으며, 그녀는 석방 기한인 15년을 채우기 전까지 성실히 일해서 스스로에 대한 바른 성찰을 할 수 있을 것입니다."
 RED_minori_event.11.a: "독재자의 최후는 이렇다!"
 RED_minori_event.12.t: "트로츠키의 재판"
 RED_minori_event.12.d: " 이번 주의 혁명위원회 평의는 유난히 소란스러웠는데, 이는 사무국에서 현지인민위원장으로 활동했던 레프 트로츠키라는 한 볼셰비키 때문이었다. 트로츠키는 동방의 소비에트 연방이라는 곳에서 다방면에서 활약했던 건국영웅으로 보였는데, 내부의 권력쟁투에서 밀려나서 노르웨이에서 망명 생활을 이어가던 중에 사무국에 합류한 것으로 보여진다. 트로츠키라는 인물의 행적은 대개 체리노의 권위주의적 정책을 반대하는 것이었기 때문에 그가 비록 반혁명에 동참하는 것으로 보여짐에도 이는 그가 사무국에 속해있었기에 그러하였던 것으로 여겨졌다.\n\n 특히 그의 지지자 내지는 추종자들로 여겨지는 일명 '트로츠키주의자'들은 그를 적극적으로 옹호하고 신정부의 유망한 인물이기에 등용해야 한다고 주장하기까지 하였다. 이들은 '국제 노동자 동맹'을 구성해서 혁명위원회의 평의에 적극적으로 간섭하고자 하였지만 그럼에도 혁명위원회는 이 볼셰비키가 새로이 권력을 키우는 것을 경계하였기 때문에 다분히 논쟁의 여지가 있지만 그를 '추방'하기로 결론지었다.\n\n 절차에 따라 그는 한 달 내로 망명할 것이며, 그의 유력한 목적지는 멕시코가 될 것이라고 현지 언론들이 보도했다."
 RED_minori_event.12.a: "트로츠키주의자들에겐 아쉽게 되었군."
 RED_minori_event.12_tt: "§g그러나 레프 트로츠키를 둘러싼 일련의 논란은 현지 언론에 의해 대중적으로 다뤄졌고, 이는 사무국에 소속되었거나 본래 붉은겨울 정권을 지지하던 많은 이들과 강력한 사회주의 정부를 원하는 학생 내 급진파들이 국제 노동자 동맹을 중심으로 결집하게 되는 계기가 되고 있습니다...§!"
 RED_minori_event.13.t: "사무국의 실무자"
 RED_minori_event.13.d: "사무국의 실무자인 사시로 토모에는 적절한 행정 역량을 갖고 있기 때문에 그녀를 감옥에 수감하는 것은 바람직하지 않습니다. 그렇기 때문에 혁명위원회에서는 그녀가 스스로 죄를 뉘우치고 새로운 혁명정부에 봉사할 수 있도록 기회를 주었습니다. 그녀는 적당히 타협하여 노동교화의 형식으로 행정직을 맡기로 하였으나 토모에는 자신의 직책을 거부하고 체리노가 있는 급양부로 자신을 배정해 줄 것을 요청했습니다."
 RED_minori_event.13.a: "요청은 각하되었다."
 RED_minori_event.14.t: "덴마크에서의 승리"
 RED_minori_event.14.d: "용맹한 우리 혁명군은 사무국이 예상하지 못하게 덴마크 군정청을 기습했고, 그들의 대열이 처참히 무너짐에 따라 덴마크 군정청을 무너트릴 수 있었습니다."
 RED_minori_event.14.a: "승리다!"
 RED_minori_event.15.t: "구교사 해방"
 RED_minori_event.15.d: "구교사는 체리노 정권의 압제를 상징하는 건축물입니다. 수많은 반체제 인사들이 구교사에 갇혀 고생하였지만, 이제는 아닙니다. 하나된 대오 아래, 연대의 정신으로 우리는 그들을 구출할 것입니다."
 RED_minori_event.15.a: "환영합니다, 동지들!"
 RED_minori_event.16.t: "과도정부의 지도자"
 RED_minori_event.16.d: "학생회장의 폭압적인 정치를 끝장낸 지금, 학원과 현지인 조직, 그리고 노동자-농민 계급의 안위를 위하여 헌법을 제정하고 공화국을 구성할 필요가 있습니다. 소수의 조합지도자, 정당의 중직, 좌익이론가 및 학생 등으로 구성된 임시기구인 혁명과도정부를 선언하고 제헌을 위한 준비를 해야 합니다.\n\n 우리는 혁명의 정비와 민중경제의 제고를 위해 과도정부의 지도자를 선출할 수 있는데, 사회민주노동자당의 수정주의적 마르크스주의 경제이론가인 [RED_ernst_wigforss.getname]와 용역부장인 [RED_minori.getname]가 주요한 후보로 거론되었습니다."
 RED_minori_event.16.a: "민생경제가 우선이다."
 RED_minori_event.16.b: "결단있는 지도자가 필요하다."
 RED_minori_event.16.c: "그냥 집단지도체제를 채택하자."
 RED_minori_event.17.t: "스칸디나비아 사회민주주의 연맹"
 RED_minori_event.17.d: "내전이 종료되고 노동조합주의, 즉 생디칼리즘적 경향이 전이자들에 의해서 강하게 주장되는 가운데 스칸디나비아 3국의 사회민주당들(스웨덴 사회민주노동자당, 노르웨이 노동당, 덴마크 사회민주당)은 그들의 세력을 규합하여 보다 좌경화되었으나 급진성을 저지하는 연대 기구를 만들 필요가 있게 되었습니다."
 RED_minori_event.17.a: "사회민주주의야말로 진정 노동자를 위할 수 있다."
 RED_minori_event.18.t: "임시위원회"
 RED_minori_event.18.d: "혁명 과도 정부가 선포되면서, 임시위원회는 산업, 민생, 경제 전반을 통제하게 되는 거대한 기구가 되었습니다. 앞서 이곳의 요직을 차지할 수 있었던 사회민주주의자들은 이 기구를 중심으로 자신들의 영향력을 넓히려 할 것입니다."
 RED_minori_event.18.a: "재건을 향해!"
 RED_minori_event.19.t: "혁명위원회"
 RED_minori_event.19.d: "혁명정부에서 혁명위원회는 행정 전반을 총괄하는 기구로, 학생들과 좌익 급진파들에 의해 주도되고 있었습니다. 그러나 내전이 종료되면서 경제 재건에 대한 중요성이 제기되고 혁명 과도 정부가 선포됨에 따라 이들의 영향력은 내전 당시에 비해서 많이 감소했습니다. 그러나 여전히 이들에게는 사회 변혁에 대한 임무가 주어져 있으며, 또한 이들은 스스로 과도기 행정의 한가운데서 변화의 소용돌이를 일으킬 자신감으로 넘쳐납니다!"
 RED_minori_event.19.a: "변혁을 향해!"
 RED_minori_event.19.b: "반혁명의 여지를 차단해야 한다."
 RED_minori_event.20.t: "결성된 적색전선"
 RED_minori_event.20.d: " 붉은겨울 캠퍼스 중앙에는 수 만의 인파가 몰려있었다. 대다수가 붉은 깃발을 힘차게 휘날리고 있었는데, 모두 적색전선의 결성을 기념하기 위한 것이었다.\n\n 적색전선은 [RED.GetCommunistParty]의 상호 유기적 통합을 골자로 하는 초당적 연대기구이며, 특히 1928년 SAC를 떠나 보다 좌경급진화했던 노총인 '생디칼리스트 노동자 연맹'(SAF) 또한 이 기구에 참여하게 되면서 전국의 생디칼리즘 기구가 총결집에 이르게 되었습니다."
 RED_minori_event.20.a: "노동조합주의 공화국 만세!"
 RED_minori_event.21.t: "[FROM.getname]의 독립"
 RED_minori_event.21.d: "군정청으로서 존재하던 [FROM.getname]의 독립이 선포됨에 따라, 우리는 이들에 대한 공격을 지속할지에 대한 결정을 내려야만 합니다. 이들이 사무국의 압제로부터 해방된 것을 분명한 사실이지만, 인민들이 여전히 부르주아 권위주의에 의해 억압되리라는 것 또한 사실입니다."
 RED_minori_event.21.a: "그들을 공격하자."
 RED_minori_event.21.b: "아직은 섣부르다."
 RED_minori_event.22.t: "도시명 복원"
 RED_minori_event.22.d: "체리노와 사무국의 우상화를 위해 현재 많은 지역의 이름은 체리노의 이름으로부터 비롯된 지명을 따르고 있습니다. 혁명이 성공함에 따라 우리는 더 이상 이러한 지명을 따를 필요가 없어졌으며, 현지인들이 본래 부르던 이름대로 부를 것입니다."
 RED_minori_event.22.a: "개인숭배는 끝이다!"
 RED_victorypoint_stockholm: "스톡홀름"
 RED_victorypoint_yetebori: "예테보리"
 RED_victorypoint_udebala: "우데발라"
 RED_victorypoint_paloon: "팔룬"

 RED_minori_event.23.t: "노동조합총회"
 RED_minori_event.23.d: "과도 정부가 출범한 이후, 즉각적인 총선거에 대한 요구는 점진적으로 증가하고 있습니다. 노동조합총회를 설립하여 노동조합들이 우리의 정책에 영향을 끼칠 수 있도록 하는 것은 노동조합주의 원칙에 알맞을 뿐만아니라 이러한 요구를 일정부분 해소할 수 있을 것입니다."
 RED_minori_event.23.a: "노동자 정부를 향해!"
 RED_minori_event.24.t: "평등"
 RED_minori_event.24.d: " 자본은 민중들을 서로 가르고 이간질하여 지배를 지속합니다. 민족주의나 국수주의에 영향받은 민중들은 같은 피착취자이자 자본에 의한 피해자임에도 불구하고 서로 헐뜯고 배척합니다. 사회주의 사회에서 그런 것들은 용납될 수 없습니다. 민족주의와 국수주의는 중세의 종교가 그러했던 것처럼 지배계급인 자본가의 권력을 공고히 하기 위한 도구적 이념에 불과하며, 우리는 이를 타파하고 인류 공동체의 모두가 포괄적으로 '평등'하게 대우받아야 함을 매우 잘 이해하고 있습니다.\n\n 북유럽으로 이주하는 많은 이민자들은 대부분 저임금 노동착취를 피하기 위해, 정치적인 망명을 위해, 아니면 내전 혹은 전쟁에서 벗어나기 위해 이곳으로 옵니다. 그런 이들을 단지 '이민자'라는 이유만으로 배척하고 저임금에 고용하거나 차별해서는 안되며, 그들 또한 같은 노동자 계급의 일원임을 인정해주어야만 합니다. 붉은겨울로 이민오는 모든 이민자들은 앞으로 자유롭게 노동할 수 있으며, 붉은겨울의 법률에 의해 보호받고, 일정 기간 이상 거주하고 노동할 시에 붉은겨울 정치 전반에 참여하고 의견을 개진할 수 있도록 할 것입니다."
 RED_minori_event.24.a: "우리는 자본가와 다르다."
 RED_minori_event.25.t: "해방"
 RED_minori_event.25.d: "'강철의 원수'라 불리는 어느 위선자가 주장하는 일국 사회주의는 대단히 틀린 발상이며 사회주의에 대한 몰이해이자 오류투성이의 접근입니다. 혁명은 어느 한 국가에서 멈춰서는 안되며, 끊임없이 전파되고 끊임없이 반복되어야 합니다. 세계의 모든 대중이 스스로를 지배할 때, 다시 말해 '해방'될 때까지 우리는 혁명을 멈출 수 없으며, 멈춰서는 안됩니다. 당연하게도, 볼셰비키를 포함해서 모든 권위주의적, 착취적, 자본주의적, 파시즘적, 제국주의적, 전제적, 민족주의적인 체제를 타도하고 그 속에서 핍박받는 민중들과 연대해야 합니다."
 RED_minori_event.25.a: "같은 사슬도 함께 끊는 게 낫다."
 RED_minori_event.26.t: "붉은겨울의 노동자 인터내셔널 초대"
 RED_minori_event.26.d: "붉은겨울에 최근 들어선 사회주의 정권이 고립을 타파하고자 우리에게 도움을 청했습니다. 동맹이 결성된다면, 세계의 인민들을 해방하기 위한 새로운 동지가 생길 것입니다."
 RED_minori_event.26.a: "우리는 연대를 통해 강해진다."
 RED_minori_event.26.b: "아직은 이르군."
 RED_minori_event.27.t: "노동조합 파업"
 RED_minori_event.27.d: "노동자들이 눈부시게 발전한 경제에 따른 성과급을 요구하며 파업에 돌입했습니다."
 RED_minori_event.27.a: "그들에게 성과급을 지급하자."
 RED_minori_event.27.b: "말도 안되는 소리."
 RED_minori_event.28.t: "민중소환제"
 RED_minori_event.28.d: "붉은겨울 내 어느 소도시에서 시장직을 맡고 있던 선출관료가 자녀 비리 문제로 인해 민중들 앞에 소환되었습니다. 민중들은 해당 선출관료의 부패를 질책하였으며, 그것들이 얼마나 반혁명적이고 반사회주의적인지에 대해 열렬히 역설했습니다. 곧이어 주민들은 민중투표에 그의 탄핵에 대한 건을 회부했고, 일주일 뒤에 치뤄진 투표에서 탄핵이 2/3의 찬성을 넘어서면서 가결되었습니다."
 RED_minori_event.28.a: "이것이 직접민주제다."
 RED_minori_event.29.t: "투쟁이라는 길 위에서 (1/2)"
 RED_minori_event.29.d: " 수많은 사람들이 삶이라는 바다를 헤엄쳐 나아가며 시련을 겪습니다. 그들은 파도를 만난 것이 분명합니다. 사람마다 파도의 세기와 높이는 다르겠지만, 그것은 자명하게도 파도가 친 것입니다. 누구에게나 파도는 칩니다. 파도가 치지 않는 사람은 없습니다. 그러나, 사람마다 파도를 대하는 모습은 정말 다양합니다.\n\n '인간'이라는 한자어에 '사이 간'이라는 한자가 들어있듯이, 사람은 혼자가 아닙니다. 시련을 겪는 인간이라면 다른 이들에게 도움을 흔히 요청하곤 합니다. 그리고 마찬가지로 사람들은 흔히 도움을 요청받습니다. 그리하여 상부상조의 세계에서 개인은 내담자이자 상담자입니다.\n\n 많은 사람들이 내담자가 시련을 겪어 자신들을 찾아왔을 때, 이에 대한 조언으로 '참으라거나', '받아들이라고' 이야기합니다. 하지만 다른 한 무리의 사람들은 그렇지 않습니다. 부당하다고 생각하는 것, 불의라고 생각하는 것, 당연하다고 생각되는 것에 회의를 던지라고 외치는 이들, 그들은 전자의 사람들과 확실하게 구별됩니다. 그들은 분명하게 '혁명가'입니다.\n\n 기독교가 문화적, 지적 헤게모니를 차지하여 그 누구에게나 진리로 여겨지던 때, 이탈리아와 한자동맹의 도시들의 여러 지식인들은 '신'이라는 억압을 벗겨내고 십자가 위에 인간을 올려놓았습니다. 신학자 그 자신들 또한 개혁교회를 표방하며 기성 교회의 불의, 부패에 저항했습니다. 독일 출신의 한 신학자가 교회에 전면으로 반대하는 95개조의 긴 반박문을 쓴 이야기는 언제나 우리에게 맞설 수 있는 용기를 줍니다.\n\n 이렇듯 벗겨낸 종교의 이면을 확인했을 때, 혁명가들은 봉건제와 절대왕정을 옹호하는 이데올로기적 도구를 보게 되었습니다. '왕권신수설', 없는 신을 팔아서 노동착취에 정당성을 부여하는 추악한 거래는 이 지식인들에 의해서 철저히 부정되었고, 그리하여 인류는 근대 사회로 진입하게 되었습니다. 이는 모두 당연함에 의문을 품은 '혁명가들'과 그들을 따라 준 '민중들' 덕분이었습니다.\n\n 또 다른 독일인의 이야기가 있습니다. 많은 사람들이 자신들의 국가를 위해 헌신하는 것을 당연히 여길 때, 그래서 민족주의가 진리로 받아들여지고, 노동자가 '자유롭게' 직업을 선택하여 사회에 기여할 수 있는 세상이 왔을 때, 대학에 갓 입학하여 철학에 빠진 청년이 있었습니다. 종교가 영주의 지배에 정당성을 부여했듯, 민족주의가 자본가의 지배를 정당화한다고 생각했던 그 청년은 '선언'을 써내리며 유럽 한복판에서 담담하게 사회주의를 외쳤습니다. 그가 죽을 때까지 그 어떤 사회주의 혁명도 성공하지 못했지만, 그는 모두가 당연하다고 여기던 자본주의에 물음표를 강하게 던진, '혁명가'가 분명합니다.\n\n 흔히들 사회주의는 실패한 사상이라고 이야기합니다. 혹자는 마르크스가 인간의 이기심을 고려치 않고 사상을 제시했다고 주장합니다. 그러나 마르크스를 아는 사람이라면 그렇게 말할 수 없습니다. 마르크스는 자본주의라는 체제 속에서 어떻게 착취가 발생하고, 그리하여 미래 사회에서 분배가 어떻게 이뤄져야 바람직한지 '자본론'과 '고타강령비판'에서 밝힌 바가 있습니다. 마르크스에 대한 많은 비난이 그저 인상비평에 불과하다는 사실은, 그만큼 사회주의가 우리의 삶과 사고로부터 얼마나 유리되어 있는지를 보여주는 것 같아서 안타깝습니다."
 RED_minori_event.29.a: "..."
 RED_minori_event.30.t: "투쟁이라는 길 위에서 (2/2)"
 RED_minori_event.30.d: " 붉은겨울은 노동조합 지도자인 야스모리 미노리와 용역부가 주도하여 꾸린 정치단체인 적색전선에 의해서 노동자 공화국으로 재편되었습니다. 이들은 마르크스를 비롯해서 프루동, 드레온, 레닌, 바쿠닌과 같이 다른 많은 사상가들에 영향을 받아 실험적인 정책을 실시했습니다. 처음에는 모두가 불안했을 것입니다. 급진적인 변혁은 사회를 비틀고 뒤틀어 완전히 새롭게 재편될 때까지 큐브를 맞추는 느낌이었을지도 모릅니다. 그렇지만 그들은 해냈습니다. 20세기의 정가운데에서 그들은 다른 그 어느 정치세력보다 진보적이고 민주적인 체제를 구축하는 데에 성공했습니다.\n\n 그리고 이 모든 일의 뒷편에 당신이 있었습니다. 당신의 결정이 기어코 당신 스스로를 이 글과 마주하도록 만들었습니다. 당신이 어떤 모를 이유로 '2월 총파업' 중점을 골랐을 때, 그 이유가 붉은겨울에 거주하는 인민대중들을 해방으로 이끌기 위해서라고는 생각하지 않습니다. 그저 미노리를 좋아하거나, 아니면 극좌적인 루트가 갑자기 끌렸을 확률이 높았을 겁니다.\n\n 그치만 당신이 선택한 이상 대중들은 행동했습니다. 마치 저명한 소설이자 뮤지컬인 '레미제라블'의 유명한 한 장면처럼, 5월 1일의 노동절 집회에 맞춰 체리노그라드 시민들은 시가를 행진하는 군대를 습격하고 무기고를 습격해 무장한 채 여러 도시 시설을 점거하였습니다. 이들은 체리노와 그녀의 하수인들이 노르웨이에서 세력을 결집하여 혁명의 불씨를 꺼트리려 할 때, 그들의 구차한 반혁명 시도에 단호하게 맞섰습니다. 조금 급진적이긴 했지만 구시대의 잔재를 확실하게 처리하기 위해서 체리노와 마리노의 불가피한 희생이 있었고, 도시의 동상들이 철거되었으며, 도시들의 이름 또한 바뀌었습니다.\n\n 물론 그 다음의 대중들은 여러 요구를 하며 당신을 괴롭혔을 터입니다. 가끔은 대중 전반이, 가끔은 노조 단위의 제안사항이 중앙위원회에 보고되었고, 당신은 한정된 시간 안에 그 요청들을 처리하려고 고군분투했을 것입니다. 그들이 당신의 발목을 잡았다고 하여 미워하거나, 그들의 요구들을 많이 들어주지 못하여 완벽한 혁명의 체제를 완성하지 못하였다고 슬퍼하지 않으셨으면 좋겠습니다. 당신의 선택에 의해서, 그들은 살면서 가장 격변의 시대에 살았고, 가장 강력한 억압과 가장 빛나는 자유를 한 삶에서 동시에 겪은 이들입니다.\n\n 자신들의 가족, 친구, 동지들이 흘린 피가 '노조할 권리', '교섭할 권리', '파업할 권리'로 돌아왔을 때, '주 3일제의 실시'로 보답받았을 때, 그리고 '공공부조와 보편복지'로 대답되었을 때 노동자, 농민, 관료, 병사, 상공인, 학생, 교사, 교수, 가사를 맡는 여성 혹은 남성, 그리고 그 밖의 모든 직종과 관계없는 '대중'들은 자신들의 행복을 확신했을 것입니다.\n\n 글을 읽고 있는 당신이 한 게임의 한 모드 속 이 글을 너무 가벼이 보지 않았으면 좋겠습니다. 레닌의 이상을 져버린 볼셰비키나, 국가자본주의로 선회한 중화인민공화국에 대한 이야기없이, 단순하게, 사회주의는 우리의 가슴 속에 불을 지핀다는 이야기가 하고 싶습니다. 우리의 피가 붉게 반짝이는 것이 '변혁'에 대한 꿈 같은 이야기가 우리를 고무시키는 게 우리의 본능이라고 생각하게 만듭니다. 이탈리아 공산당의 안토니오 그람시가 이르기를 \"이성으로 비관하고 의지로 낙관하라\"라고 하였습니다. 우리의 이성은 자본주의에 머물러 있지만, 의지는 자명하게 사회주의에 있을 것입니다.\n\n 삶이라는 바다에 치는 파도의 모양과 크기가 사람마다 다르다는 데에서 우리는 상호 동등한 '평등'을 배웠습니다. 우리는 모두 시련을 겪기에 각자가  내담자이자 상담자라는 점에서 우리는 '연대'를 배웠습니다. 그리고 행동하는 붉은겨울의 대중들, 뿐만아니라 행동하는 그저 그런, 그렇지만 아득히 빛나는 일반 사람들에게서 우리는 '혁명가의 사고'를 배웠습니다.\n\n 앞으로 바다를 헤엄쳐 나아가는 데에 있어서, 사라질 때의 당신이 혁명가로 남은 채라면 좋겠습니다."
 RED_minori_event.30.a: "플레이해주셔서 무척 감사합니다!"
 RED_minori_event.30_tt: "이 투쟁이라는 길 위에서 당신과 제가 당당하게, 또 담담하게, 있을지 모르는 목적지까지 걸어 나갈 수 있기를 바랍니다!\n§g- 당신에게 붉은 평화가 있기를 빌며, 모더 §YAfterImage§! 올림.§!"
 RED_minori_event.31.t: "미노리의 퇴임"
 RED_minori_event.31.d: "붉은겨울 용역부의 전 부장이자, 5월 혁명의 주역이며, 혁명군사평의회의 정치장교이자 공화국 상임평의회의 중앙위원인 야스모리 미노리 동지가 이번 달을 마지막으로 임기를 종료하였습니다. 수많은 민중들의 환호 속에 성공적으로 임기를 마친 미노리는 퇴임 직전 지지율이 [RED.GetPartySupport]%에 이를 정도로 높은 인기를 보여줬습니다. 중앙위원회에선 그녀가 보여준 민중과 사회에의 영웅주의적 헌신을 기리기 위해 중앙위원장 직위를 결석으로 둔 채 지도체계를 집단지도로 전환하였습니다."
 RED_minori_event.31.a: "수고 많았소, 동지!"
 RED_minori_event.32.t: "통일전선"
 RED_minori_event.32.d: "사회민주노동자당은 반혁명의 위협에 있어서 우리와 협력하기로 결의했습니다. 이에 따라 반체리노 민중전선이 결성되었으며, 이는 우리가 스웨덴 전역에서 강력한 정통성을 지니고 무력을 행사할 수 있도록 할 것입니다."
 RED_minori_event.32.a: "강철같은 연대로 나아가자!"
 RED_minori_event.33.t: "재분배"
 RED_minori_event.33.d: " 도시의 행정권을 확보함에 따라, 혁명정부는 체리노와 사무국에 귀속되어 있는 식량자산들을 무상으로 도시에 분배하기로 결정하였습니다. 이로써 인구 포화 문제의 심각성을 단기적으로 유예할 수 있을 것입니다."
 RED_minori_event.33.a: "다행이군."
 RED_minori_event.34.t: "오슬로 확보"
 RED_minori_event.34.d: "사무국 임시 본청이자 노르웨이 군정사령부가 위치한 오슬로가 우리의 수중에 떨어짐에 따라 우리는 마침내 지난 오슬로 봉기 때의 복수를 이룰 수 있게 되었습니다. 도시의 감옥에 수감된 노동자들과 정치범들은 즉시 석방되었으며, 노동대중 일부가 자발적으로 무장하여 우리의 대오에 합류했습니다. 우리는 또한 무기고에서 여분의 보병장비들을 확보할 수 있었습니다."
 RED_minori_event.34.a: "수고 많았소, 동지들!"
 RED_minori_event.35.t: "혁명 정부 구성"
 RED_minori_event.35.d: " 용역부조차 파악하지 못 한 스웨덴 중앙 노동조합에 의한 직접행동, 즉 노동절 혁명은 용역부의 발빠른 조직적 동조와 함께 수도의 행정권을 찬탈하고 정부를 전복할 수 있게 되었습니다. 이후 이러한 혁명적 운동을 조직화하기 위해 내전을 준비하는 기구가 필요해졌으며, 주요 노동조합과 학생, 현지 정당의 정치인들로 혁명 정부가 구성되었습니다. 이들은 현지 행정을 맡는 임시위원회와 혁명을 조직하고 전위하는 혁명위원회로 조직을 재편하여 효율적으로 내전 상황을 대비하고자 했습니다. 그러나 이러한 협의되지 않은 상황에 사회민주노동자당은 피로한 상태이며, 이는 혁명의 주도세력에 대한 불만으로 이어졌습니다.\n\n 이는 결국 의견충돌로 나타났는데, 임시위원회는 민생 경제를 우선하자는 입장인 반면, 혁명위원회는 반혁명을 우선 타도하고자 합니다. 다시 심화되어, 이러한 의견 차이는 구체적인 사안으로서 진행되고 있는 농가에서의 물자 징발을 중단하고 식량 생산에 집중하자는 임시위원회의 요구로 이어졌습니다."
 RED_minori_event.35.a: "식량 생산을 우선하자."
 RED_minori_event.35.b: "물자 징발은 멈춰서는 안된다!"
 RED_minori_event.36.t: "저지된 반혁명"
 RED_minori_event.36.d: "더 이상의 저항이 무의미하다는 것을 깨달은 군정청의 고위장교들은 마침내 스스로 결단을 내려 사무국의 정권을 교체하기로 하였습니다. 체리노와 토모에는 일시 정전의 볼모로서 체리노그라드로 송환되었으며, 모든 위협이 제거된 것은 아니지만서도 파탄나는 민생과 임시위원회의 강력한 반발로 인해 우리는 마지못해 정전으로 반혁명의 저지를 매듭지을 수밖에 없었습니다."
 RED_minori_event.36.a: "민중의 승리다!"
 RED_missions_char.1.t: "대중의 요구 - 주 3일제 실시"
 RED_missions_char.1.d: "인간다운 삶의 보장과 온전한 여가를 즐기기 위한 주3일제의 실시를 전노동대중이 요구하고 있습니다. 우리는 빠르게 주3일제와 관련한 법률을 제정할 필요가 있습니다."
 RED_missions_char.1.a: "인간다운 삶을 향해!"
 RED_missions_char.2.t: "대중의 요구 - 실패"
 RED_missions_char.2.d: "우리는 대중의 요구를 제 시간 내에 충족시키지 못 하였습니다. 대중들은 현재의 노동자 내각에 대한 지지를 철회할 것입니다."
 RED_missions_char.2.a: "젠장."
 RED_public_mission_failed_over_5: "\n§Y대중의 요구§!를 §Y6§! 회 이상 §R실패§!하였기 때문에, 대중들은 정권을 더욱 불신합니다."
 RED_public_mission_failed_over_2: "\n§Y대중의 요구§!를 §Y3§! 회 이상 §R실패§!하였기 때문에, 대중들은 정권을 본격적으로 불신합니다."
 RED_missions_char.3.t: "대중의 요구 - 성공"
 RED_missions_char.3.d: "우리는 인민대중의 요청사항을 성공적으로 충족하였으며 이 땅에 들어선 신정권은 더욱 신뢰받고 있습니다."
 RED_missions_char.3.a: "이곳에서 사회주의는 굳건하다!"
 RED_missions_char.4.t: "대중의 요구 - 총체적 재무장"
 RED_missions_char.4.d: "최근 [TRM.getname]의 충격적이고 급진적인 팽창 정책이 인민대중에게 우리들로부터 하여금 재무장을 요구하도록 만들고 있습니다. 트리니티는 반동적인 극우 교권주의 파시스트 과두정체의 국가이기 때문에, 필연적으로 타도해야되며, 이들과의 혁명전쟁은 억압받고 착취받는 트리니티 민중들을 해방하기 위한 인민해방전쟁으로 기획되어야만 합니다."
 RED_missions_char.4.a: "파시스트를 쳐부수자!"
 RED_missions_char.5.t: "대중의 요구 - 공업화"
 RED_missions_char.5.d: "선대 이론가인 마르크스의 역사발전론에 따르면 상부구조는 하부구조, 즉 생산력과 생산관계에 가장 많은 영향을 받습니다. 이를 다르게 말하자면 사회주의를 가장 유지할 수 있는 최적의 방법은 가장 급진적이고 진보된 생산력과 생산관계를 갖는 체제로 나아가는 것입니다. 우리는 다른 '국가사회주의'자들과 다르게 급진적이면서도 민주적인 동시성을 갖는 신시대의 공업화를 세계에 선보일 것입니다!"
 RED_missions_char.5.a: "모든 역량을 최대 생산력 달성 투쟁에로!"
 RED_missions_char.6.t: "대중의 요구 - 키보토스 협력기구 탈퇴"
 RED_missions_char.6.d: "현재 키보토스 협력기구는 자본가, 독재관, 봉건영주들의 체제 유지를 위한 '반혁명적 국제기구'에 불과합니다. 우리는 노동자 대중을 향한 이러한 기만에 가만히 있어서는 안됩니다. 단호한 반대와 굳건한 대오로 이들에 맞서 우리의 혁명을 수호하고 자주적인 사회주의 체제를 만들어 나가야만 합니다."
 RED_missions_char.6.a: "타협은 없다!"
 RED_missions_char.7.t: "대중의 요구 - 야전병원 지원"
 RED_missions_char.7.d: "병사노조가 설립됨에 따라 전선에서 복무하는 병사들의 빗발치는 요구가 중앙위원회에 보고되었습니다. 병사들은 자신들의 생존권을 전선에서 더욱 보장할 것을 요청하고 있습니다. 우리는 이들을 위해서 야전병원을 편제에 편성할 수 있을 것입니다."
 RED_missions_char.7.a: "군대에서까지 변혁은 이어진다!"
 RED_missions_char.8.t: "대중의 요구 - 혁명군사평의회 해산"
 RED_missions_char.8.d: "'붉은 보나파르티즘'은 내전 단계의 과도기 군사행정기구가 정치적 권력의 헤게모니를 쥐게 되는 것을 이야기합니다. 군사적인 실권자들은 계급론적 관점에서 결코 노동자의 계급성을 띌 수 없습니다. 이들은 친지배-이권적 행태를 보일 가능성이 매우 크며, 빠르게 해산하고 이를 병사노조로 재편하여 우리 군사기구의 혁명성을 회복하여야만 합니다."
 RED_missions_char.8.a: "그들이 위민복무를 실천하도록 하자."
 RED_missions_char.9.t: "대중의 요구 - 사회 안정화"
 RED_missions_char.9.d: "사무노조는 사회주의적 관료체제의 확립 이후 인민대중의 삶을 개선하기 위한 5가지 큰 방침과 15가지의 세부 지침을 요구하였는데, 이는 치안 확보, 생활안전 확보, 관료 안정성 확보, 확실하고 신뢰가능한 복지체계, 주기적인 정치참여의 보장입니다. 이러한 것들을 시행함으로써 사무노조는 혁명정권이 세계 단위 체제경쟁의 확실한 이념적 헤게모니를 쥘 수 있을 것이라고 확신하고 있습니다."
 RED_missions_char.9.a: "민중의 복리후생을 향해!"
 RED_missions_char.10.t: "대중의 요구 - 기반시설 확충"
 RED_missions_char.10.d: "내전으로 피폐해진 국토를 재건하기 위해, 건설노조는 중앙위원회에 기반시설을 확충할 것을 주문하였습니다. 이들의 요구 사항을 경제 개발 계획에 참고하여 추가적인 예산을 배정할 수 있을지도 모릅니다."
 RED_missions_char.10.a: "철도는 산업의 핏줄이다!"
 RED_missions_char.11.t: "대중의 요구 - 군산복합체 구성"
 RED_missions_char.11.d: "최근 방산노조는 방위산업에서의 자신들의 성과를 보여주며 사업 분야의 질적인 확대를 지원해줄 것을 중앙위원회에 요청하고 있습니다. 군산복합체는 이들의 요구를 충족하기 위한 적절한 수단이 될 것이며, 더 직접적인 군사-산업 연계를 통해 군행정이 더욱 개선될 것입니다."
 RED_missions_char.11.a: "혁신으로 나아가자!"
 RED_missions_char.12.t: "대중의 요구 - 중화학 산업 양성"
 RED_missions_char.12.d: "제조노조는 이번 정기 위원회의에서 흥미로운 계획서를 보고하였습니다. 합성 정제소를 통해 중화학 공업을 양성하여 자원 불균형을 해소하고 자급적인 경제체계를 구축할 수 있을 것이라고 주장하는 해당 계획서는 채택되었으며, 중앙위원회는 이를 지원할 것입니다."
 RED_missions_char.12.a: "자주적인 경제를 향해!"
 RED_missions_char.13.t: "대중의 요구 - 스칸디나비아 통합"
 RED_missions_char.13.d: "반혁명 세력을 분쇄하고, 체리노의 지시에 의해 설치된 군정청들이 전부 해체됨에 따라 우리는 이들을 우리와 동등한 민중으로서 대해 줄 필요가 있습니다. 그들이 우리에게 마음을 열 수 있도록 재교육과 적응 지원을 멈추지 말아야 할 것입니다."
 RED_missions_char.13.a: "자유, 평등, 연대!"
 RED_missions_char.14.t: "대중의 요구 - 동방 공세"
 RED_missions_char.14.d: "노동대중들은 자신들이 이룬 혁명이 외부세력의 반혁명에 의해 무너져 내릴까봐 겁내고 있습니다. 그들은 '선제적 혁명전쟁'을 개진하여 이러한 의도를 꺾고 세계에 있어서 견고한 지역 패권을 거머쥐어 혁명의 불꽃이 꺼지지 않게 해야 한다고 주장하고 있습니다. 대중적으로 이러한 '선제적 혁명전쟁'으로 가장 적합한 목표는 핀란드로 합의되어 있으며, 우리는 핀란드의 인민들이 반동적인 봉건 백군 세력에 의해 억압받고 있다는 것을 깊게 이해하고 있습니다."
 RED_missions_char.14.a: "반동을 분쇄하자!"
 RED_missions_char.15.t: "대중의 요구 - [141.GetCapitalVictoryPointName] 수호"
 RED_missions_char.15.d: "[TRM.getname]과(와)의 전쟁이 시작되었습니다. 민중들은 자발적으로 무장하기 시작하였고, 지역마다 지역방위위원회가 소집되어 자치적으로 지역방위 계획을 수립하고 있습니다. 병사노조는 징병을 독려하는 캠페인을 진행하기 시작하였으며, 전선 근방의 마을에서는 골목골목마다 바리케이드가 쌓아올려졌습니다. 중앙위원회는 큰 출혈을 감수하더라도 학생들을 위한 캠퍼스가 소재하는 [141.GetCapitalVictoryPointName]을(를) 수호하기로 결의하였으며, 수도의 노동자, 농민, 학생을 비롯한 모든 대중들은 자체적으로 방위대를 조직하는 데에 단합하고 있습니다."
 RED_missions_char.15.a: "¡No pasarán! (못 지나간다!)"
 RED_missions_char.16.t: "대중의 요구 - 체제 완성"
 RED_missions_char.16.d: "혁명의 물결이 사그라들며 사람들은 각자의 작업장으로 복귀하여 노무를 수행하고 있습니다. 이들은 새로운 세상이 왔음은 알지만, 휘몰아치는 변화들이 되려 자신들의 삶을 망칠까 두려워하고 있습니다. 우리는 이들을 안심시키기 위하여 체제의 구축을 완료할 필요가 있습니다."
 RED_missions_char.16.a: "변혁에 속도를 내자."
 RED_missions_char.17.t: "대중의 요구 - 산업 재구조화"
 RED_missions_char.17.d: "우리는 자본가와 압제자들을 전부 타도하는 데에 성공했지만 여전히 구시대적이고 반혁명적인 생산관계는 온전히 청산되지 않았습니다. 우리는 급진적인 산업 재구조화를 완료하여 그 어느 국가보다 진보적인 경제 구조를 구성할 것입니다."
 RED_missions_char.17.a: "생디칼리즘 경제를 향하여!"
 form_european_union_flag: "§Y£GFX_decision_icon_small 유럽 통합 실현§! 을 완료했습니다."
 RED_missions_char.18.t: "대중의 요구 - 유럽 해방"
 RED_missions_char.18.d: "우리 남쪽의 여전히 수 억의 민중들이 유럽지역의 압제자들에 시달리고 있습니다! 우리는 이들에게 해방을 가져다 줄 의무가 있습니다."
 RED_missions_char.18.a: "인민 해방 만세!"

 RED_bop_event.1.t: "염소 수염의 사내"
 RED_bop_event.1.d: " 체리노가 회상했다.\n\n 사무국이 어수선한 때에, 사무국의 사시로 토모에는 상황 수습에 도움을 줄 현지인 고문을 탐색했다.\n\n \"서기장 동지, '레프 트로츠키'라고 하는 사회주의 이론가가 있는데, 현지인 고문으로 데려왔습니다.\"\n\n 트로츠키는 사회주의 운동을 하는 학생들이 기특한 듯 미소를 지으며 체리노에게 악수를 건넸다. 이후 트로츠키는 사회주의 이론이나 정책적인 조언에 관하여 체리노와 사무국의 고위 임원들을 가르쳤다."
 RED_bop_event.1.a: "체리노는 강의 내내 지루해했다."

 RED_revolution.1.t: "반성"
 RED_revolution.1.d: " 여느 때와 다르게 근 2달 간 야스모리 미노리는 굉장히 바쁘게 생활했다. 무너져 내린 현지의 건물들과 군사시설들을 하루에도 수십 채씩 짓고 보수해여야 했기 때문이다. 규모의 건설 현장을 하루종일 지휘하고 나선, 미노리는 피로에 젖은 채 집에서 금방 골아떨어졌다.\n\n 몇 시간이 지났을까, 미노리는 꽤나 개운치 못 한 상태로 잠에서 깨어야 했다. 이는 바깥의 소란 때문이었는데, 온종일 울려대는 호루라기와 말발굽 소리, 환호, 외침, 비명, 호통이 그녀의 잠을 방해했기 때문이다. 미노리는 일신의 행복추구권 일반을 침해하는 이들에 대해 강력히 항의하기 위해 비몽사몽한 채로 나섰다.\n\n\"노동법을 준수하라! 압제자들은 물러나라!\"\n\n 밖은 생각보다 더 소란스러웠다. 광장을 가득 매운 것으로 모자라서 골목마다 연기가 피어올랐다. 미노리는 순간 스스로가 부끄러웠다. 정작 그녀가 일에 바빴다지만 자신이 소홀하고 있을 때 현지의 노동자들은 탄압받고 착취당하고 있었기 때문이다."
 RED_revolution.1.a: "살아 움직이며 실천해야 진짜 노동자다!" 
 RED_revolution.2.t: "용역부의 가담"
 RED_revolution.2.d: "야스모리 미노리의 강력한 요구 끝에 용역부에서는 현지인 파업에 호응하여 일부 연대 파업에 돌입했습니다. 사무국은 야스모리 미노리의 반체제적 악행을 비난했지만, 그 누구도 사무국의 논평 따위를 보고싶어 하지 않았습니다."
 RED_revolution.2.a: "노동계급은 그 스스로 민족적이다!"
 RED_revolution.3.t: "노총과의 연대"
 RED_revolution.3.d: " 용역부의 적극적인 가담 이전에도 2월 총파업에는 노르웨이, 덴마크, 스웨덴 현지의 노동조합연맹들의 부분적 동조 파업이 확산되고 있는 상황이었다. 야스모리 미노리는 다양한 노동조합연맹의 지도부를 찾아 적극적으로 파업에 동참할 것을 요청하였으며, 그들에게 요청을 긍정적으로 검토할 것이라는 답변을 받아내는 데에 성공하였다. 다만 이에 대해서 미노리는 노총 간부들의 크고 작은 반발을 사기도 했다.\n\n\"...그러나 명심하시오. 파업은 정치적 수단이나 변혁의 도구가 아닌 교섭과 경제투쟁을 목적으로 하는 또 다른 대화에 불과하오. 우리는 의회민주정이 회복되고 경제적 목적을 이룬 즉시 파업 해제를 결의할 것이오.\"\n\n\"이곳의 노동자들은 왜이리 수동적인 거야?!\"\n\n 그럼에도 미노리의 의견에 적극적으로 동참하는 조직이 있었는데, 바로 '스웨덴 노동자 중앙조합'(SAC)였다. SAC는 생디칼리스트 성향의 노총으로서, 직접행동과 반자본주의 투쟁의 중요성을 미노리와 공유하며 이번 쟁의에 주도적으로 참여할 것을 내비쳤다." 
 RED_revolution.3.a: "변혁적 운동은 적극적 참여로부터 비롯된다."
 RED_revolution.4.t: "1936년 결의안 제5호"
 RED_revolution.4.d: "비록 변혁적 지도부를 구성하고 있다고 하더라도, 용역부 그 스스로가 변혁적인지에 대해서는 많은 논란이 있습니다. 붉은겨울의 거의 모든 건물이 용역부에 의해 건설되고 외부로도 수주를 나가는 것으로 미루어 볼 때 용역부는 여느 건설회사보다도 거대한 건설협동조합임에도, 그들 스스로가 임금 노동에 종속되어 있고 자본주의적 상품 생산에 영속적이라는 사실은 많은 용역부원들이 실은 경제적 동기로 용역부에 참여한 것과 맞물려 그 변혁적 성격이 조직 전원에 뿌리내리도록 하는 데에 장애물로서 기능하고 있습니다. 붉은겨울 용역부 전원에 통일되고 단합된 투쟁대오에 참여할 것을 지시하는 강력한 조직 방침이 필요한 것은 몇 주 전부터 중앙에 제기되어 왔고, 이는 용역부 내부에서 숙의를 거치고 있습니다."
 RED_revolution.4.a: "결의되었다."
 RED_revolution.4_tt: "§g제1. 용역부원 전원은 변혁적 투쟁의 참여자로서 총파업에 참여할 것을 결의한다.\n제2. 하위 조직 일체의 개별적 교섭과 타협을 금지한다.\n제3. 기회주의를 단호히 배격하며, 목적을 달성하기 전까지 해산하지 않는다.\n§!"
 RED_revolution.5.t: "사회민주노동자당"
 RED_revolution.5.d: "선거에 참여하는 사회주의 정당이라는 개념은 19세기 말에 등장하였고, 스웨덴의 사회민주노동자당은 그 중 하나입니다. 선거권 투쟁을 거치며 온건화를 거듭한 현재의 사회민주노동자당은 가급적이면 폭력을 멀리하려고 했지만, 그들의 군축 정책은 붉은겨울에의 빠른 항복을 도와준 것밖에 더 되지 않았습니다. 다행히도 그러한 점에서 사회민주노동자당은 스스로의 세력을 어느정도 유지할 수 있게 되었습니다. 이들의 광범위한 대중적 기반은 총파업의 정치화를 촉발시키기에 충분합니다. 그러나 이들의 온건성은 그들의 요구를 '의회정의 복원'으로 한정할 것이며, 이는 미노리의 큰 우려입니다."
 RED_revolution.5.a: "또 다른 자본주의자에 불과한 것인가?"
 RED_revolution.6.t: "타협"
 RED_revolution.6.d: "\"어디까지나 우리는 의회정의 복원이 목표이오.\"\n\n 미노리는 어쩔 수 없다는 듯 고개를 끄덕이며 그의 악수를 받아내었다."
 RED_revolution.6.a: "연대를 구하여 고립을 두려워하지 않는다."
 RED_revolution.7.t: "포섭"
 RED_revolution.7.d: "아라마키 야쿠모는 근 몇 주가 즐거웠다. 하도 많이 들어 지겨울 돌아가는 인쇄기 소리는 아침의 새소리로, 철컹거리는 기계소리는 시계탑의 종소리로 들릴 만큼 야쿠모는 즐거웠다. \n\n왜냐하면 지금 야쿠모는 [RED.GetLeader]에 관한 시시콜콜한 음모론이나 선동들을 찍어낼수록 돈이랑 푸딩이- 아니지, 어, 미노리가 뭐라고 그랬더라- 아, 그렇지, 노동계급의 해방이 더 가까워지고 있었기 때문이다.\n\n야쿠모가 인쇄기에 기대 콧노래를 부르며 인쇄물의 상태를 확인할 때, 근처에서 출판부를 시찰하던 미노리가 인사를 건넸다. 야쿠모는 씩 웃어 보이며 화답했다.\n\n"야쿠모! 기분이 좋아 보이네! 인쇄 상태는 어때?"\n\n"아주 좋아요. 충실한 동지들이 아주 많이 "사고" 있다고요."\n\n"... 야쿠모, 내가 분명 그것들은 돈받고 팔지 말라고 했을 텐데..." 미노리가 머리를 부여잡으며 정색했다. 야쿠모는 머쓱한 웃음을 지어 보이며 어쨌거나 미노리가 "이것저것 규탄" 하고, "아무거나 보장" 함의 이점들을 설명하는 것을 듣고 있었다. 아니, 듣지도 않았다. 야쿠모는 하나당 5엔씩만 받아도 돈이 넘쳐날 상황을 만끽하고 있었기 때문이다.\n\n"이럴 줄 알았으면, 바보 같은 만화보다 이걸 더 찍어낼 걸 그랬어요." 야쿠모는 생각했다. "
 RED_revolution.7.a: "힛.힛.히."
