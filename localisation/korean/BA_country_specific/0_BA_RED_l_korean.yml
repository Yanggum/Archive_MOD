 RED_first_AEP: "제1차 대안경제계획"
 RED_first_AEP_desc: "급진적인 집산화와 국유화는 결코 지금 상황의 해결책이 아닙니다. 산업에 있어서 '전시' 상황인 지금은 대안적인 경제 정책이 필요합니다. 말 그대로, '대안경제정책'은 시장주의적 요소를 대거 수용하여 본래의 사회주의적 경제 정책을 수정한 것으로서, 우리는 이를 통해 중소-중견기업을 육성하고 산업 전반의 튼튼한 하부 구조를 구축하게끔 할 것입니다."
