 RED_doomed_economy_idea_desc: "대전이로 인해 행정체계 전역이 마비되어 붉은겨울의 권위주의적 하달식 계획경제가 제대로 동작하지 않는 상황에서, 현지 정부의 부재로 인해 연계성과 유기성이 잘려나간 현지 산업들, 그리고 학생과 그들 간의 마찰과 도시에 포화된 인구, 서방공세와 북방공세로 인해 황폐화된 농촌과 어촌들이 우리의 모든 경제 지표를 가장 낮은 곳으로 꽂아내렸습니다."
