#이벤트
 RED_ending_event.1.t: "승리의 날"
 RED_ending_event.1.d: "언젠가 일어날 일이었습니다. 제2차 인터내셔널에서부터 시작한 마르크스주의 진영의 끝없는 분열은 [RED.getleader]에 의해서 종지부를 찍었습니다. 크렘린궁에는 붉은겨울의 깃발이 게양되었고, 더 이상 소비에트 연방이라는 주권체는 존재하지 않습니다!"
 RED_ending_event.1.a: "길고 긴 이념전쟁이 끝났다."
 RED_ending_event.2.t: "귀환한 좌익반대파"
 RED_ending_event.2.d: " 스탈린 체제 하에서의 억압적 수탈에 지친 인민들이 자신을 반겨줄 것이라고 트로츠키는 생각했다. 그러나 실상은 달랐다.\n\n \"반소비에트 테러리스트가 나라를 망쳤어!\"\n\n \"뱀새끼는 꺼져라!\"\n\n \"압제자를 규탄한다!\"\n\n 충실한 스탈린주의자들의 정치적 공작에 의해서 연방 전반에서 반트로츠키주의 집회가 일어나고 있었고, 좌익반대파들의 향후는 순탄치 않을 것임이 분명해지고 있었다."
 RED_ending_event.2.a: "젠장."
 RED_ending_event.2_tt: "\n§R퍼지는 스탈린주의 정서를 막아야 합니다!§!"
 RED_ending_event.3.t: "스탈린주의 저항"
 RED_ending_event.3.d: "여전히 전쟁은 치뤄지고 있었습니다! 스탈린주의 파르티잔에 의해 도시 노동자들은 반혁명 대오 아래 단일히 조직되어 우리의 통제로부터 벗어나고자 하고 있으며, 농촌에서는 지속적으로 집단농장을 거점으로 스탈린주의 유격대가 활동하고 있습니다!"
 RED_ending_event.3.a: "점점 심각해지는데?"
 RED_ending_event.3_tt: "\n§R퍼지는 스탈린주의 파르티잔을 막아야 합니다!§!"
 RED_ending_event.4.t: "혁명 재판"
 RED_ending_event.4.d: "혁명의 불씨는 그 스스로가 점화하는 법입니다. 2월의 혁명은 10월의 혁명으로, 적백내전으로 이어졌으며, 크론슈타트에서의 반란 진압의 연장선으로서 이념전쟁이 막을 내렸습니다. 거듭된 서로 다른 반혁명은 저지되었으며, 진정한 혁명은 지금부터입니다. 우리는 사회 전반에서 레닌주의와 혁명의 대의를 져버린 수많은 스탈린주의자 관료와 군을 숙청할 것이며, 이는 레닌그라드에서 구성된 중앙혁명재판소의 지휘 아래 각 지방 혁명재판소에서 실시될 것입니다."
 RED_ending_event.4.a: "저들의 죄를 단단히 물어라!"
 RED_ending_event.5.t: "레닌그라드 혁명 재판: 주요 관료"
 RED_ending_event.5.d: "번호: 제0004호\n제목: 공소이유서\n본 반혁명행위 공소위원회는 다음의 사항을 공소한다.\n\n\nI. 공소 대상    $SOV_iosif_stalin$, $SOV_lazar_kaganovich$, $SOV_vyacheslav_molotov$\nII. 주요 혐의   반혁명적 음모, 국가와 당 권력의 불법적 장악, 노동계급 배반\nIII. 주문         본 3인에 대해 사형을 구형한다.\n\nIV. 공소사유\n\n1. 스탈린 외 2인은 레닌 동지께서 제시한 노동자 민주주의 원칙을 부정하고, 소비에트를 관료적 과두국가로 변질시켰다. 그는 당내 민주주의를 제거하고, 프롤레타리아 독재를 스탈린의 개인적 독재로 대체하였다.\n - 중앙위원회의 결정을 독점하고, 레프 트로츠키를 비롯한 주요 당관료들을 비합리적인 사유로써 축출함.\n - 사회주의 이론에 기반하지 않고 오로지 권력의 재생산을 위해 경제 정책을 운영하여 노동자와 농민의 생활을 악화시킴.\n - 프롤레타리아 독재를 관료집단 과두독재로 대체하여 사회주의를 파괴함.\n\n2. 이오시프 스탈린과 중앙파의 강제 집단농업 정책은 그 스스로의 권력 유지를 위한 것으로써 농민 계급을 철저히 억압하고, 사회주의 건설과 사회 개조에 큰 해악을 끼쳤다.\n - 강제 수탈로 인해 1932 - 1933년 우크라이나와 볼가 지역에서 대기근이 발생함에 따라 수백만 명의 노동자와 농민이 사망함.\n - 농민들의 혁명적 참여를 유도하지 않고, 폭력적인 강제 수탈을 강행하여 사회주의 경제를 후퇴시킴.\n\n3. 중앙파는 국제 공산주의 운동을 방해하고, 혁명의 세계적 확산을 가로막아 국제 프롤레타리아 혁명을 배신했다.\n - 독일, 중국, 스페인의 혁명적 기회를 방기하고, 세계 혁명을 방어하지 못함.\n - 소련을 고립된 사회주의 국가로 전락시켜, 레닌주의적 원칙을 배반."
 RED_ending_event.5.a: "승인되었다."
 RED_ending_event.6.t: "레닌그라드 혁명 재판: NKVD"
 RED_ending_event.6.d: "번호: 제0009호\n제목: 공소이유서\n본 반혁명행위 공소위원회는 다음의 사항을 공소한다.\n\n\nI. 공소 대상    내무인민위원부 고위 관료 전원\nII. 주요 혐의   반혁명적 음모, 프롤레타리아 독재의 유린, 노동계급 배반\nIII. 주문         일부 사형 및 내무인민위원부 해체 \n\nIV. 공소사유\n\n1. NKVD는 소비에트 내부에서 반혁명적 공포정치를 시행하며, 당과 국가의 혁명적 요소를 숙청하는 도구로 활용되어 프롤레타리아 독재를 파괴하고 반혁명적 테러를 자행했다.\n - 대숙청 기간 동안 주요 당관료와 노동운동 지도자들을 조직적으로 학살.\n  - 혁명에 헌신한 볼셰비키 동지들을 반혁명 분자로 몰아 체포, 고문, 처형.\n - 당내 민주주의를 말살하고, 스탈린 개인 독재를 유지하는 비밀경찰로 전락.\n\n2. NKVD는 스탈린의 명령 아래, 노동자 계급과 농민에 대해 조직적으로 탄압을 가했다.\n - 강제 집산화 정책을 거부한 농민 수백만 명을 체포, 처형, 또는 강제수용소에 구금.\n - 인민의 소비에트 체제 내에서의 의견표현에의 탄압 및 공장 내 감시체계를 구축.\n - 공장과 농업 집단에서 노동자 계급이 정치적 영향력을 행사할 기회를 조직적으로 차단.\n\n3. NKVD는 혁명의 충실한 동지들을 반혁명분자로 몰아가는 과정에서 반혁명적 음모를 조작하고 고문을 자행했습니다.\n - 반혁명적 음모를 조작하고, 허위 증거를 날조하여 수많은 당관료를 처형.\n - 피의자들에게 강제 자백을 받아내기 위해 고문, 정신적 압박, 협박을 자행.\n - 모스크바 재판 등에서 허위 증언을 강요하고, 반혁명적 거짓 선전을 수행.\n\n4. NKVD는 스탈린의 지시 아래, 국제 노동운동과 코민테른 내부에서도 숙청을 일으켜 국제 공산주의 운동을 파괴했다.\n - 스페인 내전 당시 공산주의 조직 내에서 테러를 감행하여 혁명운동을 분열시킴.\n - 해외에서 활동하던 공산주의 혁명가들에 대한 납치와 암살.\n - 국제 사회에서 소련 공산주의의 명성을 실추시키고, 프롤레타리아 국제주의를 파괴."
 RED_ending_event.6.a: "승인되었다."
 RED_ending_event.6.b: "일부 기각되었다."
 RED_ending_event.6_tt: "§gNKVD는 일시적으로 조직을 유지하여 스탈린주의 테러리즘의 음모에 대항하는 조직적인 방어막이 되어줄 것입니다.§!"
 RED_ending_event.7.t: "레닌그라드 혁명 재판: 붉은군대"
 RED_ending_event.7.d: "번호: 제0013호\n제목: 공소이유서\n본 반혁명행위 공소위원회는 다음의 사항을 공소한다.\n\n\nI. 공소 대상    노동자와 농민의 붉은 군대의 반혁명적 참모진\nII. 주요 혐의   반혁명적 음모, 이념전쟁에서의 스탈린에게의 동조\nIII. 주문         일부 직위해제 \n\nIV. 공소사유\n\n1. 붉은 군대는 노동자 국가를 방어하고, 혁명의 적을 타도하는 역할을 해야 함에도 불구하고 군부 내 일부 반혁명적 관료들은 군을 노동계급의 통제에서 벗어나게 만들었으며, 프롤레타리아 군사 원칙을 훼손하였다.\n - 이념전쟁에서의 반혁명 진영에의 동조"
 RED_ending_event.7.a: "승인되었다."
 RED_ending_event.7_tt: "§g붉은군대가 전문성을 회복하기까지는 오래 걸릴 것이며, 많은 장성들이 불만을 가지고 직간접적으로 스탈린주의 저항에 동조할 것입니다.§!"
 RED_ending_event.8.t: "레닌그라드 혁명 재판: 스탈린주의 테러분자"
 RED_ending_event.8.d: "번호: 번호: 제0041호\n제목: 공소이유서\n본 반혁명행위 공소위원회는 다음의 사항을 공소한다.\n\n\nI. 공소 대상    스탈린주의 테러리즘 조직 및 가담자\nII. 주요 혐의   반혁명적 테러리즘, 노동계급 배반\nIII. 주문         주동자 사형 및 일부 노동교화형 \n\nIV. 공소사유\n\n1. 스탈린주의 반혁명 세력은 노동자 국가에 대한 무장 공격을 감행하며, 사회주의 건설을 방해하고 있으며, 소비에트 정부 전복을 위한 무장 반란을 조직했다.\n - 농촌에서의 무장한 테러 조직이 소비에트 농민과 당 간부를 살해\n - 도시에서의 공장과 행정 기관을 대상으로 하는 파괴 활동의 조직, 노동자 소비에트를 전복하려는 음모의 진행.\n - 철도, 통신 시설 등을 공격하여 노동자 국가의 기능을 마비시키려는 시도의 감행."
 RED_ending_event.8.a: "승인되었다."
 RED_ending_event.9.t: "공소위원회 해산"
 RED_ending_event.9.d: "극악의 상황엔 극약을 처방해야 하지만, 그것뿐입니다. 우리는 질서 유지를 위한 최소한의 적극적이고도 급진적인 조치를 모두 취했으며, 당내에서 공소위원회의 절대권력화에 대해 지속적으로 우려의 목소리가 쌓이고 있었기 때문에, 마지막 혁명 재판이 종료되고 공소위원회는 스스로 해산을 결의하였습니다. 더 이상 어느 공공조직도 반혁명 행위에 대한 공소권을 가지고 있지 않게 되었기 때문에, 혁명재판소 역시 자연히 기능을 상실하였으며, 재판관들은 사법부의 법관으로 복귀했습니다."
 RED_ending_event.9.a: "수고했군."
 RED_ending_event.10.t: "재건된 전위당"
 RED_ending_event.10.d: "관료 '정화' 사업이 완료됨에 따라 당은 전위적 기능을 온전하게 수행가능하게 되었습니다. 더 이상 혁명과 인민에 대한 배반은 있어선 안되며, 전위당은 선봉장이 되어 앞서서 나아가 민중들을 조직하고 이끌 것입니다!"
 RED_ending_event.10.a: "레닌주의를 따르자!"
 RED_ending_event.10_tt: "§Y£GFX_decision_icon_small 관료주의 혁파§! 결정을 통해 §Y$RED_stalinist_sentiments_1$§!를 제거할 수 있습니다."
 RED_ordinary_event.1.t: "수염을 잃어버린 체리노"
 RED_ordinary_event.1.d: "\"\""
 RED_ordinary_event.2.t: "227호 특별반"
 RED_ordinary_event.2.d: " \"젠장, 꼴이 이게 다 뭐야!\"\n\n 아마미 노도카는 불만 섞인 목소리로 불평했다.  \"하긴, 대전이로 정신도 없을 텐데, 구교사는 까맣게 잊힐 수밖에 없겠지.\"\n\n 마요이 시구레가 이야기했다. 이 둘은 그들이 본교사로 돌아갈 날이 대전이 전보다 10배는 더 뒤로 미뤄졌으리라는 것을 막연히 이해하고 있었다. 다행인 것은, 근처의 현지인 마을로부터 물자를 조달받을 수 있게 되어 구교사의 형편이 조금 나아졌다는 것이다.\n\n 그러나 유독 악몽에 잠자리가 좋지 않았던 날, 노도카는 구교사가 하루만에 완전히 재건축되어있는 것을 발견했다."
 RED_ordinary_event.2.a: "젠장, 이게 다 뭐야?!"
 RED_ordinary_event.3.t: "난방"
 RED_ordinary_event.3.d: " 구교사가 재건축된 만큼, 늘어난 교사에 난방을 유지하기 위해서는 많은 연료가 필요했습니다. 아마미 노도카는 폐허가 된 구교사의 잔해들 중 나무로 된 것들을 찾아내 땔감으로 삼고 있었습니다.\n\n \"윽, 이 나무 기둥은 땅에 거세게 박혀있나봐. 아무리 힘을 줘도 빠지지 않아!\"\n\n \"그래? 내가 도와줄 테니 동시에 당겨보자!\"\n\n 시구레의 도움 덕분에 노도카는 가까스로 땅에 꽂혀 있던 나무기둥을 빼낼 수 있었습니다.\n\n \"으악!\"\n\n 그때 마침, 기둥을 뽑아낸 터에서 수십 미터가 되어보이는 물줄기가 솟아오르더니, 이내 물구덩이를, 아니 작은 호수를 만들어냈습니다.\n\n \"젠장, 옷이 다 젖었잖아? 재수도 없지.\"\n\n\"아냐 노도카, 이 물을 잘 봐봐. 유황 냄새... 이건 온천이야!\""
 RED_ordinary_event.3.a: "\"온천?!\""
 RED_ordinary_event.4.t: "온천!"
 RED_ordinary_event.4.d: " \"흠. 그나저나 이 온천수를 어떻게 처리한담? 별로 쓸모도 없는데 재수가 없네.\"\n\n \"온천이 쓸모가 없다니, 그 말은 용납할 수 없겠는걸!\"\n\n 갑자기 나타난 게헨나의 온천개발부원들과 시모쿠라 메구는 어떻게 이곳에 도착했는지 황당해 하며 질문하는 노도카를 무시한 채로 눈깜짝할 새에 대규모 료칸과 온천장을 짓더니 떠나버렸다."
 RED_ordinary_event.4.a: "\"뭐지? 마치 폭풍같아!\""

