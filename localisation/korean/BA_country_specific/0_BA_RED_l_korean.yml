 RED_minori_revolutionary_isolationism: "혁명적 고립주의"
 RED_minori_revolutionary_isolationism_desc: "자유주의에 영향을 받은 대중들은 맥락과 관계없이 고립이란 굉장히 구시대적이고 봉건적이며 부정적인 것으로 생각하는 경향이 있습니다. 그러나 혁명을 지키기 위해 고립을 유지하는 것을 필수불가결합니다. 다른 노동자대중을 핍박하는 정권이나 체제에 협조하거나 그것과 제휴하는 행위는 민중에 대한 분명한 배신이며, 혁명에 반하는 것입니다."
 RED_prepare_revolutionary_war_1: "혁명전쟁 대비: 덴마크 요새화"
 RED_prepare_revolutionary_war_2: "혁명전쟁 대비: 쾨벤하운 - 말뫼 방어선"
 RED_prepare_revolutionary_war_3: "혁명전쟁 대비: 붉은 함대 건설"
