 RED_SSdF: "SSdF"
 RED_SSdF_long: "스칸디나비아 사회민주주의 연맹\n§g스칸디나비아 사회민주주의 연맹은 스웨덴 사회민주노동자당, 노르웨이 노동당, 덴마크 사회민주당의 연대 기구로써 혁명 정부의 급진성을 저지하고자 하는 데에 공동 목적을 두고 있습니다.§!"
 RED_SAC-PWD: "SAC-PWD"
 RED_SAC-PWD_long: "스웨덴 노동자 중앙조합-붉은겨울 용역부\n§g스웨덴 노동자 중앙조합은 스웨덴의 생디칼리즘 노동조합 연합입니다. SAC는 실업자, 학생, 실업자를 포함하여 모든 직종과 산업의 사람들을 하나의 연합으로 조직합니다. 이들은 1910년에 노동 운동에 대한 사회민주주의의 영향에 대한 극좌적 반대로써 등장했습니다.§!"
 RED_SACSAF-PWD: "SAC/SAF-PWD"
 RED_SACSAF-PWD_long: "스웨덴 노동자 중앙조합/생디칼리스트 노동자 연맹-붉은겨울 용역부\n§g스웨덴 노동자 중앙조합과 생디칼리스트 노동자 연맹은 스웨덴의 주요한 생디칼리즘 노동조합 총회입니다. SAC는 실업자, 학생, 실업자를 포함하여 모든 직종과 산업의 사람들을 하나의 연합으로 조직합니다. 이들은 1910년에 노동 운동에 대한 사회민주주의의 영향에 대한 극좌적 반대로써 등장했으며, 비록 1928년에 SAC로부터 SAF가 분열하였으나 용역부가 주도하는 '적색전선' 아래서 상호 연대하고 있습니다.§!"

