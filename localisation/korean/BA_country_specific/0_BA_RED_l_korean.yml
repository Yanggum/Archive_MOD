 RED_back_to_workplace_desc: ""
 RED_back_to_workplace_tt: "소유하고 비무장화 되지 않은 §Y항구§! 주:\n"
 RED_defense_revolution: "구교사 습격"
 RED_defense_revolution_desc: ""
 RED_communist_diplo: "노동조합원 무장"
 RED_communist_diplo_desc: ""
 RED_communist_diplo_tt: "소유하고 비무장화 되지 않은 §Y도시§! 주:\n"
 RED_new_council: "사회주의 신헌법"
 RED_new_council_desc: "혁명이 끝나자 혁명위원회는 신헌법 제정을 위해 자발적인 해산을 결의하였고 제헌의회가 이들의 빈자리를 대체하였습니다. 혁명의 성공을 기념하고 우리 노동자 정부의 기틀을 마련하기 위해, 새로운 헌법에 대한 논의가 이어지고 있습니다."
 RED_GGOKDUGAKSI: "용역부 꼭두각시화"
 RED_workerfront: "평의회 설치"
 RED_attack_geh: "남부 선제 공세"
 RED_attack_geh_desc: "사무국의 패배와 혁명의 성공에 대한 소식은 각지의 군정청으로 퍼지기 시작했습니다. 노르웨이로 도망간 사무국이 군정청의 군대를 집결시키기 전에, 우리와 가까운 덴마크 방면을 기습하여 이들의 동원을 막아야 합니다."
 RED_anti_fascism_policy: "혁명재판"
 RED_anti_fascism_policy_desc: "체리노와 사무국은 노동자들에 의해 다시 한번 무너졌습니다. 이제 ‘인민들을 위한다’라는 달콤한 거짓말 아래 독재를 일삼은 사무국의 반동분자들을 위한 재판을 열 때입니다."

