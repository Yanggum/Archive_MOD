 RED_minori_revolution_decision: "투쟁이라는 길 위에서"
 RED_minori_revolution_decision_desc: "§Y사무국§!에 저항하는 현지인들과 §Y사무국§!의 혼란 수습에 실망한 학생들이 주축이 되어 일어난 §Y2월 총파업§!은 대전이 이후 §Y붉은겨울§!에서 일어난 가장 큰 파업이었습니다.\n\n§Y용역부§!는 이 혼란을 §Y체리노 축출§!의 기회로 보고 있습니다. 용역부장 §Y야스모리 미노리§!는 용역부원들을 이끌고 빠른 시일 내에 이 파업에 동참하기로 하였습니다."
