 RED_cant_change_economy: "\n§R경제법 변경 불가§!"

#산업
 RED_road_to_south: "남부 도로 재정비"
 RED_road_to_south_desc: "남부의 도로는 북부에 비하여 비교적 잘 구축되어 있습니다. 약간의 정비만 거치면 아주 유용하게 쓸 수 있을 것입니다."
 RED_road_to_south_tt: "\n§R인구 포화§!를 §G완화§!하는 §Y£GFX_decision_icon_small 결정§!입니다."
 RED_road_to_north: "북부 도로 재개발"
 RED_road_to_north_desc: "북부는 남부에 비해 낙후되어 있음에도 불구하고, 오히려 이 때문에 더 많은 가능성을 품고 있는 땅입니다. 기초적인 교통망 구축은 지역 개발의 첫걸음이니, 지금 당장 재개발을 시작합시다."
 RED_land_research: "주거 문제의 해결"
 RED_land_research_desc: "대전이가 시작되고, 우리의 집은 송두리째 없어졌습니다. 모두가 길바닥에 자는 참사가 일어나지 않게 주거 문제를 뿌리 뽑아야 합니다."
 RED_improve_railway_network: "철도망 개선"
 RED_improve_railway_network_desc: "보급은 전쟁의 기본입니다. 우리는 철도 시스템을 정비하여 보급을 확보해야만 합니다."
 RED_economy_dev_plan: "경제 발전 계획"
 RED_economy_dev_plan_desc: "만성적인 경제 침체가 이곳의 주민들을 고통으로 몰아넣고 있습니다. 하루빨리 상황을 개선할 필요가 있습니다."
 RED_industrial_planning: "산업 기획"
 RED_industrial_planning_desc: "경제는 인민의 삶의 질과 직접적으로 연결되기 때문에, 우린 경제 복구를 하며 삶의 질을 떨어뜨려 우리 정부에 대한 인민의 지지도를 잃지 않기 위해 조심스럽게 접근해야할 필요가 있습니다."
 RED_entice_publicworks_cherino: "용역부 회유"
 RED_entice_publicworks_minori: "용역부 확장"
 RED_entice_publicworks: "[RED_entice_publicworks]"
 RED_entice_publicworks_tt: "\n§Y고용시§!:"
 RED_entice_publicworks_desc: "경제를 복구하는데 있어서 용역부의 도움은 필수적입니다. 우리는 그들을 회유하여 복구 작업에 참여하도록 해야 합니다. \n단순한 그들을 회유하는데는 보상으로 줄 넉넉한 푸딩만 있다면 충분할 것입니다."
 RED_upgrade_heavy_industry: "중공업 확장"
 RED_upgrade_heavy_industry_desc: "경제를 회복하기 위해선 기반이 될 공업시설이 필요합니다. 우선, 중공업 시설을 확장하여 산업시설의 기반이 되는 금속소재를 대량 생산해야합니다."
 RED_upgrade_light_industry: "경공업 육성"
 RED_upgrade_light_industry_desc: "붉은겨울은 학원 도시 중에서 특히 경공업이 발달하여여 있지 않습니다. 현지 경공업 시설을 이용하여 우리가 취약한 경공업을 육성해야 합니다."
 RED_upgrade_army_industry: "군수공업 확장"
 RED_upgrade_army_industry_desc: "외세의 침입에 대비하기 위한 투자는 필수입니다. 군수 물자를 생산하기 위한 공장을 마련해야 합니다."
 RED_steel_casting_industry: "철광 확장"
 RED_steel_casting_industry_desc: "철은 모든 산업의 기본이 되는 자원입니다. 철광을 확대하여 철 생산량을 늘려야 합니다."
 RED_synthetic_rubber: "합성 고무"
 RED_synthetic_rubber_desc: "고무의 만성적인 부족이 생산의 차질을 만들어내고 있습니다. 새롭게 떠오르는 합성 고무 기술이 이를 해결할 수 있을 것입니다."
 RED_oil_production: "유전 개발"
 RED_oil_production_desc: "우리에게는 석유가 부족합니다. 다행히 우리가 가진 발달된 기술력으로, 우리는 기존 현지인들이 손대지 못했던 북해 유전을 개발할 수 있을 것입니다."
 RED_industrial_futurization: "제조업 집중"
 RED_industrial_futurization_desc: "인민의 삶의 질을 회복하기 위해서는 여러 물품이 필요합니다. 이를 위해선 민간 공장에 더 많은 투자를 해야 할 것입니다."
 RED_future_production_line: "군산 복합체"
 RED_future_production_line_desc: "이곳의 생산 시스템은 비효율적이기 그지없습니다. 기반산업이 어느정도 갖추어졌으니 이제 생산 라인을 전면 개편해야 합니다."
 RED_economic_miracle: "경제 기적"
 RED_economic_miracle_desc: "경제 복구를 위해 우리 정부에서 실행한 정책들이 큰 효과를 보이고 있습니다. 경제의 정상화는 시간문제일 뿐입니다."
 RED_restored_economy: "복구된 경제"
 RED_restored_economy_desc: "경제 회복을 위한 우리 정부의 노력 끝에, 우린 대전이의 참상을 극복하고 경제 발전을 이끌어 내었습니다. 붉은겨울 연방학원이여, 영원하라!"

 RED_new_economy_focus_0: "모든 수단 동원"
 RED_new_economy_tt: "§g우리는 희생을 통한 빠른 성장으로 나아갈 것입니다.§!\n\n"
 RED_new_economy_focus_0_tt: "\n이 중점을 완료하면 §Y$RED_rearming_focus_1$§! 이하의 특정 중점들이 잠깁니다!"
 RED_new_economy_focus_0_desc: "대전이로 인해 파괴된 산업과 경제를 근시일 내로 복구하기 위해서는 가능한 한 모든 수단을 동원해야 합니다. 비록 그 과정이 힘들고 고달플지라도 말입니다."
 RED_new_economy_focus_1: "완전고용을 향해"
 RED_new_economy_focus_1_desc: "대공황과 대전이의 여파로 인해 나락으로 떨어진 실업률을 구제하기 위해선 국가가 주도의 사업이 필수적입니다. 적지 않은 임금과 '국가를 위해'라는 선전을 통해서 우린 인민들이 자발적으로 국가 복구 산업에 참여하도록 해야 합니다."
 RED_new_economy_focus_2: "직장 개인 배치"
 RED_new_economy_focus_2_desc: "몇몇 노동자는 자신의 실력을 발휘할 수 있는 곳에 배치되지 못했을 수도 있습니다. 노동자 개인의 선호와 적성에 맞는 일자리에 배치하여 더욱 효율적인 노동을 할 수 있게 해야 합니다."
 RED_new_economy_focus_3: "공공근로"
 RED_new_economy_focus_3_desc: "저소득층의 생활은 대전이 이후로 더욱 침체되었습니다. 이들에게도 한시적 일자리를 제공하여 최소한의 생계를 보장할 필요가 있습니다. 또한 이 공공근로 제도는 사회의 '잉여인력'의 경제 활동에도 도움을 줄 것입니다."
 RED_new_economy_focus_4: "봉사와 헌신"
 RED_new_economy_focus_4_desc: "수많은 인민의 노력으로 경제가 점점 복구되고 있지만, 결정적인 성과는 아직 나오고 있지 않습니다. 인민의 봉사와 헌신을 장려하는 선전과 다소 급진적인 방법을 통해서 경제 복구를 가속해야합니다."
 RED_new_economy_focus_5: "산업 동원"
 RED_new_economy_focus_5_desc: "비록 국민의 반발이 뒤따르겠지만, 강제적인 산업 동원은 일종의 '충격요법'처럼 단기간 산업력을 급격하게 끌어올릴 수 있을 것입니다."
 RED_new_economy_focus_6: "대규모 군축"
 RED_new_economy_focus_6_desc: "군대는 소비만을 하는 집단이기에, 작금의 상황에서 군대의 인력과 군용품은 자주방어를 위한 최소한의 양만이 필요할 것입니다. 대규모 군축을 통해 군대의 지출을 줄이고 내수 산업 복구에 집중할 수 있을 것입니다."
 RED_new_economy_focus_7: "붉은겨울 재건채권"
 RED_new_economy_focus_7_desc: "경제 정책을 활성화하기 위해선 기초 자금이 필요합니다. 학원도시에 채권을 발행하여 자금적인 여유를 확보해야 합니다."
 RED_new_economy_focus_8: "카이저로부터의 대출"
 RED_new_economy_focus_8_desc: "카이저 코퍼레이션은 과거 아비도스를 집어삼켰던 위험한 블랙 기업이지만, 자금 확보를 위해선 카이저 코퍼레이션의 지원이 필수적입니다. 비록 그 대가가 무엇일진 확실치 않지만요....."
 RED_new_economy_focus_9: "통화 정책"
 RED_new_economy_focus_9_desc: "대전이 이전에도 위태롭던 붉은겨울의 화폐가치는 대전이 이후로 급락하였습니다. 채권 발행을 통해 급한 자본의 부족은 해결하였으나, 화폐 개혁을 서두르지 않는다면 붉은겨울의 경제는 더욱 나락으로 갈 것입니다."
 RED_new_economy_focus_10: "무제한 인플레이션"
 RED_new_economy_focus_10_desc: "다소 인위적인 방법을 사용하는 것이지만 우리 정부의 수입을 확실하게 올릴 방법은 단순히 돈을 더 찍어내는 것입니다. 당장 급한 불은 끌 수 있을 것이나, 인플레이션의 여파를 감당하려면 다소 극단적인 방법을 사용해야 할 것입니다."
 RED_new_economy_focus_11: "화폐 정지"
 RED_new_economy_focus_11_desc: "우리가 채권 지급을 위해 화폐 개혁을 함으로써, 구화폐의 가치는 더 이상 휴지 조각만도 못하게 되었습니다. 민간에 엄청난 혼란이 있을 것이지만, 신화폐의 사용을 장려하고 구화폐의 유통을 막기 위해서 화폐를 정지시켜야 합니다."
 RED_new_economy_focus_12: "재산 상한제"
 RED_new_economy_focus_12_desc: "붉은겨울 인민의 재산 보유는 평등해야 하며, 이는 혹시 모를 부르주아지적 사고방식으로의 타락으로 이어질 가능성이 있기 때문입니다. 화폐 개혁을 하며 도출해 낸 제도인 재산 상한제를 통해 이 타락을 예방하며 정부 예산을 충당할 수 있을 것입니다."
 RED_new_economy_focus_13: "노동전표 도입"
 RED_new_economy_focus_13_desc: "'노동전표'는 사회주의 사회에서 화폐의 대체제로 기능하는 평등한 형태의 노동에 대한 증서입니다. 더 이상의 화폐경제 일반을 금지하고 노동 본위의 사회주의 대안경제로 나아갈 때입니다!"
 RED_new_economy_focus_14: "토지개발"
 RED_new_economy_focus_14_desc: "붉은겨울 캠퍼스 이외의 땅은 대부분 개발되어있지 않은 상태입니다. 우리의 발전된 기술력과 인력을 통해서 개발을 서둘러야합니다."
 RED_new_economy_focus_15: "자원 채굴 집중"
 RED_new_economy_focus_15_desc: "현지 전문가에 의하면 미개발된 토지의 상당수가 지하자원을 품고 있다고 합니다. 우리의 기술력을 통해 이 토지를 개발한다면 자원의 자급자족을 이뤄낼 수 있을 것입니다."
 RED_new_economy_focus_16: "농업 현대화"
 RED_new_economy_focus_16_desc: "붉은겨울이 위치한 스칸디나비아반도는 북반구에 있기에, 농사를 짓기에 적합하지 않습니다. 그러나 우리의 기술력과 현지 농법을 적절히 합친다면, 식량 문제를 해결할 수 있을 것입니다."

 RED_economy_focus_0: "이공계열 동아리 확대"
 RED_economy_focus_0_desc: "붉은겨울에는 여러 동아리가 존재하지만, 이공계열 동아리는 아직 존재하지 않습니다. 과학 산업의 발전을 위해서 약간의 보조금을 투입해 이공계열 동아리를 적극 장려해야 합니다."
 RED_economy_focus_1: "툰드라 지방 개발"
 RED_economy_focus_1_desc: "지금은 춥기만 한 쓸모 없는 땅이지만, 그저 내버려 두는 것은 심각한 영토 낭비일 뿐입니다. 기반시설에 투자함으로써 우리는 북방 산업 개발의 기초를 다질 것입니다."
 RED_economy_focus_2: "[142.getname] 알루미늄 광산"
 RED_economy_focus_2_desc: "우리는 알루미늄 채굴량을 향상하여 자원 자급으로 나아갈 것입니다."
 RED_economy_focus_3: "현지 기술관료 등용"
 RED_economy_focus_3_desc: "우리가 전이한 이곳에는 아직 많은 유효한 현지 산업들이 있습니다. 이것을 개발한다면 높은 산업적 이점이 있을 것입니다."
 RED_economy_focus_5: "농촌 계획"
 RED_economy_focus_5_desc: "우리는 농촌 개발 계획을 통해 기간 산업 중 하나인 농업을 발전시킬 것입니다."
 RED_economy_focus_6: "농업 기계화 지원"
 RED_economy_focus_6_desc: "모든 농민은 트랙터로 밭을 갊으로써 증산으로 나아갈 수 있습니다."



 RED_economy_focus_8: "소비재 산업 계획"
 RED_economy_focus_8_desc: "대전이의 여파로 인해 소비재 품귀 사태가 파국으로 치닫고 있습니다. 우리는 이를 해결해야만 합니다."
 RED_economy_focus_9: "제1차 대안경제정책"
 RED_economy_focus_9_desc: "급진적인 집산화와 국유화는 결코 지금 상황의 해결책이 아닙니다. 산업에 있어서 '전시' 상황인 지금은 대안적인 경제 정책이 필요합니다. 말 그대로, '대안경제정책'은 시장주의적 요소를 대거 수용하여 본래의 사회주의적 경제 정책을 수정한 것으로서, 우리는 이를 통해 중소-중견기업을 육성하고 산업 전반의 튼튼한 하부 구조를 구축하게끔 할 것입니다."
 RED_economy_focus_10: "민간 사업체 지원"
 RED_economy_focus_10_desc: "행정적 마비가 극심한 상태에서 모든 사업체를 학원이 운영할 수는 없습니다. 여러 민간 사업체를 통해 우리는 산업을 그들에게 위탁할 것입니다."
 RED_economy_focus_11: "해운업 회복"
 RED_economy_focus_11_desc: "우리가 전이한 이 땅은 바다를 많이 접하고 있습니다. 해양에의 투자는 곧 이 토지에의 투자입니다!"

 RED_economy_focus_13: "무역업 활성화"
 RED_economy_focus_13_desc: "비록 붉은겨울이 정치적으로 고립주의를 택하였다곤 해도, 무역은 국가의 존립에 필수불가결합니다. 우린 제한적인 분야에서 무역 금지를 헤제하여 우리 국가에 부족한 자원을 수입해올 것입니다."
 RED_economy_focus_14: "제2차 대안경제정책"
 RED_economy_focus_14_desc: "1차 대안경제정책의 성공으로, 우린 우리 정부의 유능함을 성공적으로 입증하였습니다. 이에 그치지 않고 우린 1차 대안경제정책의 아쉬운 점을 보완하고 장점은 더욱 극대화시킨 '2차 대안경제정책'을 발표할 것입니다."
 RED_economy_focus_15: "화폐개혁"
 RED_economy_focus_15_desc: "키보토스와 현지의 화폐체계가 다른 까닭에, 금융 관련 업계는 큰 타격을 입고있습니다. 화폐개혁을 서둘러 이 혼란을 잠재워야합니다."
 RED_economy_focus_16: "선별적 복지"
 RED_economy_focus_16_desc: "2차 대안경제정책의 주요 골자 중 하나는 선별적 복지와 관련되어있습니다. 우린 정책에 따라 경제적 취약계층을 우선적으로 지원하여 사회로의 복귀를 도울 것입니다."
 RED_economy_focus_17: "시장사회주의"
 RED_economy_focus_17_desc: ""
 RED_economy_focus_18: "상품작물 재배"
 RED_economy_focus_18_desc: "농업은 단지 식량 자급만을 위해 하는 것이 아닙니다. 상품작물 재배를 통해서 추가적인 부를 얻을 수 있습니다."
 RED_economy_focus_19: "상업적 농업"
 RED_economy_focus_19_desc: "농업 경영을 상업관계자에게 맡김으로써 우리는 더 높은 자본 재생산을 꾀할 것입니다."
 RED_economy_focus_20: "수산-양식업"
 RED_economy_focus_20_desc: "바다와 3면이 맞닿아있는 지리적인 요건으로 인해 민간에선 수산업이 성행하고 있습니다. 수산업과 양식업을 접목한 수산-양식업을 장려하여, 식량 문제를 해결할 수 있을 것입니다."
 RED_economy_focus_21: "붉은말 운동"
 RED_economy_focus_21_desc: ""
 RED_economy_focus_22: "협동조합경제"
 RED_economy_focus_22_desc: ""
 RED_economy_focus_23: "독립적인 중앙은행"
 RED_economy_focus_23_desc: ""
 RED_economy_focus_24: "유연한 고용"
 RED_economy_focus_24_desc: ""
 RED_economy_focus_25: "농어촌 자본주의"
 RED_economy_focus_25_desc: "농어촌에 우리 정부의 지원이 집중되자, 소위 말하는 '부농' 계급이 붉은겨울에 생기기 시작했습니다. 지금 당장은 이들의 재투자가 경제에 이득이 되니 용인하지만, 이들의 성장을 억제할 새로운 대안이 필요합니다."
 RED_economy_focus_26: "폴크헴메트"
 RED_economy_focus_26_desc: "'플크헴메트'는 스웨덴어로 인민의 집이라는 뜻으로, 좋은 가정에서는 평등과 배려, 협력이 주가 된다는 개념입니다. 이를 국가와 경제에 대입시킨다면 사회적, 경제적 차별이 철폐되며 결과적으로 더 많은 인민의 지지를 얻을 것입니다."
 RED_first_aep_tt: "이 중점은 §t제1차 대안경제정책§!의 중점입니다.\n\n"
 RED_second_aep_tt: "이 중점은 §t제2차 대안경제정책§!의 중점입니다.\n\n"
 RED_economy_focus_27: "규제 강화"
 RED_economy_focus_27_desc: "우리가 일정 부분 용인했던 '부농' 계급의 성향은 점차 부르주아적으로 변모하고 있습니다. 이들의 타락을 막기 위해서는 다소 강압적으로 이들을 규제해야 할 것입니다."





 RED_club_focus_0: "붉은겨울 전산국"
 RED_club_focus_0_desc: "대전이로 기능이 멈춘 학원을 다시 복구해야 합니다. 우선 마비된 행정력을 복구할 필요가 있습니다."
 RED_club_focus_1: "급양부 재건"
 RED_club_focus_1_desc: "행정력이 복구되어 학원이 다시 되돌아가지만, 근본적인 식량 문제가 해결되지 않는다면 또 다시 무너질 것입니다. 급양부를 재건하여 최악을 면합시다."
 RED_club_focus_2: "동아리 통제권 회복"
 RED_club_focus_2_desc: "붉은겨울엔 여러 동아리가 존재하지만, 이들의 공통점은 전부 호시탐탐 학원 지도자의 위치를 노리고 있다는 것입니다. 동아리들의 위협적인 방임을 통제해야 합니다!"
 RED_club_focus_3: "구교사 재건축"
 RED_club_focus_3_desc: "대전이가 발생한 뒤, 문제아들이 모여있는 구교사를 재건축할 필요가 생겼습니다. 구교사를 재건축하여 학원이 문제 없다는 것을 보여줍시다."
 RED_club_focus_4: "227호 특별반 회유"
 RED_club_focus_4_desc: "구교사를 재건축함에 따라 구교사의 문제아들인 227호 특별반의 처리가 시급해졌습니다. 우리 장부를 위협하는 적이 많은 상황에서 이들까지 적으로 만들 순 없으니, 정중한 사과와 약간의 푸딩을 얹어준다면 이들을 우리 편으로 만들 수 있을 것입니다."
 RED_club_focus_4_tt: "§Y[THIS.getname]§!(이)가 장군이 됩니다."
 RED_club_focus_5: "인문-사회학 지원"
 RED_club_focus_5_desc: "\"수학 없이는 정확한 계량과 천문학을 할 수 없고 화학 없이는 정확하게 철을 만들 수 없듯이, 신학 없이는 종교에 대한 정확한 사고를 할 수 없다.\" - 존 홀\n\n그리고, 철학과 사회학 없이 해방을 외칠 수 없습니다. 노동자에게의 고등교육을 통해 우리는 사회 전반의 지식수준을 드높일 것입니다!"
 RED_club_focus_6: "전위사조"
 RED_club_focus_6_desc: "창작은 고통의 연속이어야 합니다. 익숙한 틀을 깨부수고, 새로운 지평을 열어 우리의 상상력에 혁명을 무한정 일으켜야 합니다. 모든 현실과 경험, 관념, 지식을 부정하고, 해체하고, 짓밟고 나서야 진정한 해방이 있을 것입니다!"
 RED_club_focus_7: "리얼리즘"
 RED_club_focus_7_desc: "우리는 자본주의와 봉건질서를 '사실주의 문학'이라는 눈을 통해 비판적이고 현실적으로 바라볼 줄 알아야 합니다. 모든 변혁은 인식과 평가로부터 비롯되기에 말입니다."
 RED_club_focus_8: "상업문학"
 RED_club_focus_8_desc: "펜은 칼보다 강합니다. 거기다 돈까지 줍니다. 우리는 학원의 뛰어난 작문 역량을 상업에로 투자할 것입니다."
 RED_great_punch: "강력한 한방"
 RED_great_punch_desc: "우리에겐 만약을 대비한 강력한 신무기가 절실히 필요합니다."
 RED_rocket_romance: "라케트니 라만티크"
 RED_rocket_romance_desc: "로켓 기술은 모든 과학기술의 총 집합이라고도 할 수 있습니다."
 RED_club_focus_9: "지식해방전선"
 RED_club_focus_9_desc: "최근 우리 정부의 인문 계열 동아리 지원으로 인해, 정부에 적극적으로 협조하지 않던 지식해방전선의 학생들이 우리 정부에 우호적으로 변화하고 있습니다. 약간의 푸딩을 투자한다면, 이들을 확실한 우리 편으로 만들 수 있을 것입니다."
 RED_club_focus_10: "붉은겨울 공립대학"
 RED_club_focus_10_desc: "과학의 발전을 위해선 미래의 인재들을 육성할 대학이 필수적으로 요구됩니다. 현지 교수와 몇몇 밀레니엄 학생들을 초빙하여 설립한 붉은겨울 공립대학은 붉은겨울 과학의 미래를 책임질 것입니다."
 RED_club_focus_11: "227호 온천장"
 RED_club_focus_11_tt: "§Y[THIS.getname]§!(이)가 제독이 됩니다."
 BA_onsen: "온천"
 
#사무국 중점
 RED_our_leader_cherino: "우리의 영도자 체리노"
 RED_our_leader_cherino_desc: "위대한 붉은겨울의 영도자 체리노께서는 대전이의 혼란을 수습하고, 우리 학원을 다시 위대하게 만들 유일한 지도자입니다. 비록 반동분자들의 거짓된 선동이 있을지라도, 우리는 의심 없이 체리노를 믿고, 따르며, 전 세계의 부르주아들에게 투쟁해야 합니다."
 RED_accept_trotskism: "반소비에트 대안공산주의"
 RED_accept_trotskism_desc: "대전이 이후, 동방의 소비에트 연방이라는 국가와 국제 공산주의 지도국의 자리를 놓고 경쟁하는 입장에 놓인 우리 학원의 상황을 해결하기 위해, 체리노 동지께서는 트로츠키라는 한 기묘한 망명자에게 친히 붉은겨울 사무국의 한 자리를 내어주셨습니다. 그를 신뢰하기는 이르지만, 체리노 동지의 선택을 믿는 것이 좋겠습니다."
 RED_the_fourth_international: "제4인터내셔널"
 RED_the_fourth_international_desc: "소위 제3인터내셔널이라 불리는 스탈린주의자들의 이상은 마르크스와 레닌이 써내려간 이론과는 아무런 상관도 없으며, 오히려 민주적으로 통제된 노동자 국가를 디스토피아적 꿈으로 왜곡시키고 있습니다. 우리에게 필요한 것은 그들에 대항할 새로운 인터내셔널입니다!"
 RED_restore_the_security: "경비국 복원"
 RED_restore_the_security_desc: "현재 붉은겨울은 체리노 동지에게 충성하는 인민들과 반동분자들이 뒤섞여있습니다. 대전이로 인해 체계가 망가진 경비국을 복원하고 이를 지원한다면 치안유지를 성실히 행할 것입니다."
 RED_locals_problem: "군정청 통제"
 RED_locals_problem_desc: "붉은겨울 연방학원이 대전이 이후 벌인 거대한 혁명 전쟁의 대가로 얻어낸 군정청들을 본격적으로 관리할 시간입니다. 폭력적으로 지배중인 현 상황을 타파하고, 최종적으로는 스칸디나비아 전역을 전부 우리 학원과 하나로 만들어야만 합니다."
 RED_locals_problem_tt: "\n§L군정청 내 부패를 청산합니다.§!\n\n"
 RED_depress_locals: "강제 이주 정책"
 RED_depress_locals_desc: "현지 인민들을 전부 강제 이주를 통해 우리가 통제하기 쉬운 장소로 재배치 할 것이며, 붉은겨울 연방학원의 학생과 자치구 주민들로 그 빈자리를 채워 효과적이고 빠른 통합을 이뤄낼 것 입니다."
 RED_enticing_locals: "자치공화국 수립"
 RED_enticing_locals_desc: "인민들에게는 채찍뿐만 아니라 적절한 푸딩 또한 필요한 법입니다. 과도한 경비국의 현지인 탄압을 끝내고 우리와 현지인 사이의 관계를 조정할 현지 자치 정부를 수립하여 안정된 체제를 이끌어 낼 것입니다."
 RED_enticing_locals_tt: "§Y$RED_social_reform$§! 이하의 중점계통도가 바뀝니다.\n\n"
 RED_redwinter_office: "붉은겨울 사무국"
 RED_redwinter_office_desc: "붉은겨울 사무국은 연방학원의 최고 행정기관입니다. 대전이 이후 망가진 지방 행정체계를 복원하고 연방학원의 산업, 정치 부문을 정상 상태로 되돌리기 위해 총력을 다해야만 합니다."
 RED_redbear_editorial: "붉은곰 편집국"
 RED_redbear_editorial_desc: "우리의 행정에는 커다란 구멍이 있고 그 과정에는 온갖 비리가 만연합니다. 이에 따라 곳곳에서 불만이 쏟아져 나오고 있는 것이 작금의 현실입니다. 그럼에도 하나 다행인 점은, 현재 이 학원에 존재하는 유일한 언론기관이 우리 편이라는 것입니다. 임시방편에 불과하지만 잠시나마 불만을 잠재울 최선의 수가 될 것입니다."
 RED_heros_at_front: "전선의 영웅들"
 RED_heros_at_front_desc: "우리를 대신하여 전선에 나가 싸우고 있는 이들은 영웅의 칭호를 받아 마땅합니다. 체리노 회장은 이들의 헌신을 칭송하며 영웅들의 식단에 푸딩 한개를 추가하라는 영광스러운 복지를 내렸습니다."
 RED_welcome_immigrate: "현지 공산당 수용"
 RED_welcome_immigrate_desc: "우리의 대의에 일정부분 동조할 현지인 조직을 우리는 적극 활용할 것입니다."
 RED_welcome_thugs: "이주노동자 강제 배치"
 RED_welcome_thugs_desc: "우리는 복잡한 산업 계획의 목표를 달성하기 위해 다양한 지역에서 인력을 공수하여 투입할 필요가 있습니다. 이주 노동자들은 이제 계획도시 건설이나 산업시설 확장과 같은 다양한 광역 산업 계획에 투입될 것입니다." 

 RED_kivotos_halo_militia_add-10_tt: "£GFX_unit_halo_militia_icon_small §C헤일로 민병§!의 §Y편제 제한§!: §R-10§!\n"
 RED_kivotos_halo_militia_add1_tt: "£GFX_unit_halo_militia_icon_small §C헤일로 민병§!의 §Y편제 제한§!: §G+1§!\n"
 RED_kivotos_halo_militia_add2_tt: "£GFX_unit_halo_militia_icon_small §C헤일로 민병§!의 §Y편제 제한§!: §G+2§!\n"
 RED_kivotos_halo_militia_add3_tt: "£GFX_unit_halo_militia_icon_small §C헤일로 민병§!의 §Y편제 제한§!: §G+3§!\n"
 RED_kivotos_halo_militia_add6_tt: "£GFX_unit_halo_militia_icon_small §C헤일로 민병§!의 §Y편제 제한§!: §G+6§!\n"
 RED_administration_of_occupied_territories: "점령지 행정"
 RED_enlarge_secret_police: "공안부"
 RED_enlarge_secret_police_desc: "군정청 내의 치안을 오로지 군정청에만 의존할 수는 없습니다. 분권화되어있는 공안업무를 중앙화하여 하달적으로 관리해야만 합니다."
 RED_enlarge_secret_police_tt: "§Y군정청§!의 §R불안도§!가 §G감소§!합니다:\n\n"
 RED_enemy_of_class: "계급의 적"
 RED_enemy_of_class_desc: "신사회로 함께 나아가고자 하는 우리의 노력에도 불구하고 반혁명적으로 이를 방해하는 지역의 소부르주아적 반동분자들이 여전히 남아있습니다. 우리는 이들을 '계급의 적'으로 선포하고 이들과의 투쟁에서 승리를 거머쥘 것입니다!"
 RED_industry_of_mil_gov: "군정권역 공업화"
 RED_industry_of_mil_gov_desc: "조사에 따르면, 우리가 군정권역으로 두고 있는 지역은 산업화가 상당히 진전되어 있는 지역입니다. 군정권역을 중앙에서 직접 공업화한다면 군정청에의 통제를 강화할 뿐만 아니라 학원의 산업력을 월등히 제고할 수 있을 것입니다."
 RED_develope_local_industry: "현지 산업 개발안"
 RED_develope_local_industry_desc: "계획경제를 채택하기에는 우리의 역량이 부족함을 인정해야 합니다. 현지인에게 상당 부분 자율권을 부여해야만 합니다."
 RED_develope_local_industry_tt: "지역의 §Y산업 능률§!을 §G개선§!하는 데 초점을 맞춥니다."
 RED_local_economic_plan: "하달식 경제 계획"
 RED_local_economic_plan_desc: "잘 계획된 산업기획은 그 무엇보다 효용적입니다."
 RED_local_economic_plan_tt: "지역의 §G공업화§!에 초점을 맞춥니다."
 RED_social_reform: "사회 개조"
 RED_social_reform_desc: "공업화는 단순히 경제와 산업 부문에서의 투쟁에서 종료되어서는 안됩니다. 우리는 이전의 자본주의적 의식체계와 문화관을 개조하여 물질적인 것을 넘어 정신적 공업화까지 동시에 이룩할 것입니다."
 RED_develop_re1: "덴마크 개조"
 RED_develop_re1_desc: "시행 지역에 따른 세부적인 계획이 완성되었습니다."
 RED_develop_re2: "노르웨이 개조"
 RED_develop_re2_desc: "시행 지역에 따른 세부적인 계획이 완성되었습니다."
 RED_develop_re3: "사프미 개조"
 RED_develop_re3_desc: "시행 지역에 따른 세부적인 계획이 완성되었습니다."

 RED_horizontal_intergration: "수평적 통합"
 RED_horizontal_intergration_desc: "똑같은 업무를 여러 기관에서 동시에 담당하는 것은 비효율적입니다. 우리는 수평적인 병합을 준비할 것입니다."
 RED_intergrate_re1: "덴마크 산업 통합"
 RED_intergrate_re1_desc: "시행 지역에 따른 세부적인 계획이 완성되었습니다."
 RED_intergrate_re2: "노르웨이 산업 통합"
 RED_intergrate_re2_desc: "시행 지역에 따른 세부적인 계획이 완성되었습니다."
 RED_intergrate_re3: "사프미 산업 통합"
 RED_intergrate_re3_desc: "시행 지역에 따른 세부적인 계획이 완성되었습니다."

 RED_advance_security: "경비국 강화"
 RED_advance_security_desc: "경비국은 사무국이 명령한 임무를 완벽하고 성실하게 수행하였으며, 이들은 더 많은 지원과 더욱 더 많은 푸딩을 받을 자격이 충분합니다."
 RED_advance_security_tt: "§t스네이크 게임§!에서 §G승리§!합니다."
 RED_end_of_counter_revolution: "반혁명의 종식"
 RED_end_of_counter_revolution_desc: "더 이상 쿠데타와 내전의 위협 속에 국가를 운영하는 멍청한 행동은 이어져서는 안됩니다. 더 강력하고 신속한 행정력으로 이 모든 위협을 제거할 수 있어야만 합니다."
 RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs: "경비국의 내무부 승격"
 RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs_desc: "이제 경비국은 이제 단순한 치안 유지 활동을 넘어 우리 국가의 안전을 위한 내무부로써 활동하게 될 것입니다."
 RED_socialism_over_the_world: "연속혁명론"
 RED_socialism_over_the_world_desc: "마르크스주의는 상황이 받쳐준다면 혁명은 필연적이라고 이야기합니다. 하지만 상황이 확실하게 받쳐주질 않는 경우도 있고, 또 상황이 받쳐준다고 해서 모든 곳에서 적용가능한 것은 아닙니다. 우리는 몇 세기 이후에나 이뤄질 혁명을 기다리며 현실에 안주해서는 안됩니다. 지금 당장 전세계의 노동자와 소작농들은 고통받고 있으며 이들의 해방을 기다릴 수는 없습니다."
 RED_the_builder_of_the_winter_army: "노농적군의 유산"
 RED_the_builder_of_the_winter_army_desc: "노농적군의 건설자이신 트로츠키 동지의 영도 아래 붉은겨울의 군제개혁은 더 빠르게 진행되고 있습니다!"
 RED_the_builder_of_the_winter_army_tt: "\n§Y$RED_restore_cossack_units$§! 또는 §Y$RED_cohesion_first$§! 계통의 무작위 세 중점이 완료됩니다!"
 RED_collectivist_economy: "집산주의 경제"
 RED_collectivist_economy_desc: "우리는 자본주의적 생산양식에서 빠르게 벗어날 것입니다."
 RED_strengthen_heavy_industry: "중공업 강화"
 RED_strengthen_heavy_industry_desc: "중공업은 우리 경제의 심장입니다. 혁명이 그저 생존해 있는 게 아니라 성공하는 모습을 보려면, 우리는 중공업 부문을 더 강화해야만 합니다."
 RED_strengthen_heavy_industry_tt: "\n§L생산 부문의 부패를 청산합니다.§!\n\n"
 RED_agricultural_collectivization: "농업 집단화"
 RED_agricultural_collectivization_desc: "스탈린의 농업 집단화는 그의 정치적 동기에서 비롯된 것이지 사회분석과 혁명이론을 따른 것이 아니었습니다. 그러나 우리에게는 트로츠키와 그의 유능한 이론가들이 있기에 그들과 함께 '실패한' 스탈린의 농업 집단화를 극복하여 진정한 집단농업을 완성할 것입니다."
 RED_system_decentralization: "체제의 탈중앙화"
 RED_system_decentralization_desc: "스탈린은 당뿐만 아니라 국가 전체를 자신에게 집중시켰습니다. 이것은 명백히 노동자로부터 권력을 빼앗는 반혁명적 접근법입니다. 우리 붉은겨울에서는 그것과 반대로, 노동자들이 자신들의 운명을 결정할 수 있도록 해야 합니다."
 RED_strengthen_the_trade_unions: "노동조합 강화"
 RED_strengthen_the_trade_unions_desc: "스탈린의 영도 아래, 노동조합은 경영에 반대하는 노동자들을 대표하는 도구에서 노동자들을 지휘하는 경영의 도구로 변질되었고 노동자들이 혁명의 이익을 얻는 것을 실질적으로 막았습니다. 하지만 다행히도 이곳의 노동자들은 매우 민주적이고 자기 주도적인 생각을 가지고 있습니다."
 RED_large_administrative: "광역 행정"
 RED_large_administrative_desc: "부족한 농촌에의 통제를 다시금 확립해야 합니다."
 RED_large_administrative_tt: "\n§L농촌의 부패를 청산합니다.§!\n\n" 
 RED_strengthen_regional_party: "지역당 강화"
 RED_strengthen_regional_party_desc: "당의 말단부 기관들에게 더 많은 자율을 줌으로써 우리는 상향식 민주주의에 한 걸음 더 다가갈 수 있습니다."
 RED_long_live_the_workers_government: "푸딩 생산 확보"
 RED_long_live_the_workers_government_tt: "\n추가적인 §Y푸딩§!을 §G확보§!합니다."
 RED_long_live_the_workers_government_desc: "당장 중요한 것은 복지입니다. 우리는 우선적으로 민중들로부터 지지를 확보한 뒤 정책을 시행할 것입니다." 
 RED_got_pudding_flag_tt: "\n추가적인 §Y푸딩§!을 §R확보하지 않았습니다§!:\n"
 RED_all_power_to_redwinter: "모든 권력을 소비에트로!"
 RED_all_power_to_redwinter_tt_1: "§g작업장 곳곳마다, 농촌 곳곳마다, 끽차점에서 광장까지 온통 새로운 사회에 대한 담론으로 가득합니다!§!"
 RED_all_power_to_redwinter_desc: "민중들의 사회 참여를 위한 기구인 '소비에트', 즉 평의회는 더 이상 사무국에 의해 통제되어서는 안됩니다! 오히려 사무국이 이제부터 소비에트의 통제를 받아야 마땅합니다. 말마따나, \"모든 권력을 소비에트로!\""
 RED_all_power_to_redwinter_tt: "§Y꼬리 길이§!가 §Y5§! 이상"
 RED_all_power_to_redwinter_tt_2: "\n§Y5§!를 초과하는 §Y꼬리 길이§!만큼 최대 §G3§! §Y민간 공장§!을 얻습니다:\n"
 RED_invite_trotskists: "트로츠키주의자 초대"
 RED_invite_trotskists_desc: "트로츠키에게는 그의 추종자들이 있습니다. 그들은 일찌감치 국외로 망명하거나 소련의 감시망을 피해 전 세계로 잠적하였습니다. 그들을 소집하여 이곳에서 그와 함께 일할 수 있도록 해야 합니다."
 RED_expand_publishing_dep: "출판부 확장"
 RED_expand_publishing_dep_tt: "§Y$RED_cherino$§!의 §R공산주의적 지식§!이 §Y6§! 이상 (현재 : §Y[?RED_cherino_communism_knowledge]§!)"
 RED_expand_publishing_dep_desc: "이세계의 모든 신문도 크로노스 스쿨과 똑같이 가짜뉴스가 판을 치고 있습니다. 오직 출판부에서만 간행되는 \"붉은 곰\"만이 진실된 언론이며, 이를 더 많이 발행하기 위해선 편집부를 확장해야 합니다."
 RED_socialist_press: "사회주의 언론"
 RED_socialist_press_desc: "'붉은 곰' 출판부는 현재 부패가 만연해 있으며, 그 중심에는 출판부의 부장 야쿠모가 존재합니다. 그녀는 돈 되는 일이라면 뭐든지 하기 때문에, 약간의 푸딩을 쥐어주고고 사회주의 언론지를 우선적으로 출판하도록 한다면 그녀는 착실하게 따를 것입니다."
 RED_kill_editorial: "편집국 약화"
 RED_kill_editorial_tt: "§L출판부 내 부패를 청산합니다.§!\n\n" 
 RED_kill_editorial_desc: "출판부의 부장이자 편집을 담당하는 야쿠모는 돈되는 일은 뭐든 하는 수전노이며, 아직까진 우리에게 충성하는 듯 보이지만 그에게 더 많은 권력을 준다면 그 권한을 이용하여 서기장의 권력을 폄하하는 기사를 내보낼 수도 있습니다. 그전에 우리가 먼저 이들의 권한을 축소시켜야 할 것입니다."
 RED_merger_of_educational_institutions: "교육기관 완전 흡수"
 RED_merger_of_educational_institutions_desc: "부르주아지적 사고방식이 난무하는 서양의 교육정책 따위는 붉은겨울에서 필요 없습니다. 반동을 조장하는 교육기관을 전부 철폐하고, 붉은겨울의 교육방식을 모든 교육기관에 전달해야 합니다."
 RED_merger_of_educational_institutions_tt: "\n§L교육기관 내 부패를 청산합니다.§!\n\n"
 RED_collectivist_propaganda: "집산주의 선전"
 RED_collectivist_propaganda_desc: "모든 인민의 투쟁은 공유되며, 우리는 그 어떠한 인민 혼자서 투쟁하도록 내버려두지 않을 것입니다. 그러므로 모든 인민들의 업적은 공유되어야 합니다."
 RED_the_production_movement: "생산을 위한 투쟁"
 RED_the_production_movement_desc: "우리가 자본주의와의 경쟁에서 우리의 위치를 견고히 하기 위해서는 자본주의 세계에 의존적으로 끌려다녀서는 안 됩니다. 우린 누구에게도 간섭받지 않는 우리만의 생산 기반을 다져야 하며, 이제 생산을 위한 투쟁을 시작할 때입니다."
 RED_socialist_realism: "사회주의 리얼리즘"
 RED_socialist_realism_desc: "찬란한 붉은겨울을 향한 길이 항상 순탄하지는 않습니다. 그 과정에서 몇몇 인민은 희망을 잃어버릴 수도 있습니다. 우린 붉은겨울의 현실이 실제로 어떨지를 보여주는 예술을 장려하며 우리가 노력하고 있다는 것을 보여줘야 합니다."
 RED_heroism_propaganda: "영웅주의 선전"
 RED_heroism_propaganda_desc: "붉은겨울에서 모든 인민의 업적은 모든 노동계급의 구성원들에 의해 공유되지만, 인민들을 위해 헌신한 몇몇 이들은 모든 인민들이 본받아야 할 영웅이 될 수 있습니다."
 RED_marching_army: "전진하는 겨울군대"
 RED_marching_army_desc: "겨울군대는 조국을 지키기위해 스스로 모안 인민들이 주축이 된 군대이며, 이들의 겨울군대는 붉은겨울을 지키기 위해 자발적으로 들어온 인민들이 주축이 된 군대이며, 이들은 국가와 노동자들의 해방을 위해 최전선에서 적들과 맞서 싸웁니다."
 RED_war_hero: "전쟁 영웅"
 RED_war_hero_desc: "붉은겨울의 모든 인민들은 하나 되어 붉은겨울을 위협하는 적에게 맞서 싸워왔고, 항상 그럴 것입니다. 그렇다고 우리들 중 특출난 능력을 발휘하여 조국을 지킨 군인들을 모른척해서는 안 됩니다."
 RED_pluralistic_view: "다원적인 관점"
 RED_pluralistic_view_desc: "편집국의 권한이 약화됨에 따라 지금까지 발행하지 못했던 여러 기사들이 작성되고 있습니다. 그 중심엔 최근 큰 인기를 얻은 작품 평론가이자 출판부원인 마요이 타카네가 있으며, 그녀의 평론은 다소 반동적이긴 하지만, 우리 정부에 아직까진 충성하는 듯 보이기에 우리는 그녀의 평론을 간행하도록 허락할 것입니다."
 RED_liberal_for_debate: "자유로운 토의"
 RED_liberal_for_debate_desc: "편집부의 권한 약화로 출판부 내부에선 출판부의 권력을 잡기 위해서 토론이 계속되고 있습니다. 토론의 중심엔 유명 작품 평론으로 큰 인기를 얻은 출판부원 마요이 타카네가 있으며, 출판부 내부에서의 그녀의 지지도가 급증하고 있기에 우린 그녀와의 우호적인 관계 구축을 할 필요가 있습니다."
 RED_press_commercial_magazine: "상업지 간행"
 RED_press_commercial_magazine_desc: "야쿠모의 부패가 척결된 출판부의 가장 큰 변화는 바로 상업지의 간행입니다. 비록 이전엔 금기시 되었지만, 출판부의 풍조가 바뀜에 따라 상업지의 발행도 용인되는 분위기로 변하였습니다."
 RED_free_press: "자유 언론"
 RED_free_press_desc: "최근까지 반동적인 기사를 작성하던 불순분자 마요이 타카네의 권한이 출판부 내에서 강성해짐에 따라, 출판부에서는 언론의 자유화를 요구하고 있습니다. 비록 그녀가 마음에 들지 않긴 하지만, 이 갈등이 내전으로 번지지 않기 위해서는 그녀의 요구를 들어줘야 할 것입니다."
 RED_principle_of_democratic_centralism: "민주집중제 원칙"
 RED_principle_of_democratic_centralism_desc: "격렬한 출판부 내부의 토론 끝에, 민주집중제 원칙을 통해서 새로운 출판부장으로 마요이 타카네가 당선되었습니다. 그녀의 출판부 내에서의 권한 증가에 따라, 그녀는 '민중의 언론인'을 스스로 자처하며 출판부를 새롭개 개혁하고 있습니다."


 RED_foreign_policy: "대외 정책"
 RED_foreign_policy_desc: "붉은겨울의 혼란한 상황에서 내부를 우선시하는 것도 중요하지만, 기존 학원도시들과의 관계를 유지하고 현지 국가들과의 관계를 형성하는 것 또한 중요합니다. 붉은겨울은 또다시 세계 무대로 나아갈 준비를 해야 합니다."
 RED_political_realism: "정치현실주의"
 RED_political_realism_desc: "비록 혁명을 완수하기 위해서는 피를 흘려야 하지만, 많은 피를 흘릴 필요는 없습니다. 더욱 유연한 외교정책을 시행한다면 인민들의 희생을 최소화하며 혁명을 완수할 수 있을 것입니다."
 RED_expansionism: "적극적 방어"
 RED_expansionism_desc: "\"유일한 진정한 방어는 적극적 방어다.\"\n- 마오쩌둥"
 RED_attack_fin: "제2차 방위위원회"
 RED_attack_fin_desc: "북방공세의 연장으로 핀란드로의 전격을 펼친 우리의 방위위원회는 처절하게 패배했었습니다. 그러나 그것이 곧 우리의 패배를 의미하지는 않습니다. 핀란드 지역에 방위위원회를 복원해서 우리의 전쟁기지로 삼아야 합니다!"
 RED_gotland_or_war: "북해에서의 자위"
 RED_gotland_or_war_desc: "고틀란트는 본래 스웨덴의 영토였으나, 패배한 독일의 해군잔당들이 기습적으로 점유했습니다. 그러나 발트해에서의 온전한 패권을 거머쥐기 위해 필요한 거점이기에, 우리는 그들에게 최후통첩을 보내 고틀란트를 포기하도록 유도할 것입니다."
 RED_attack_ger: "남방 타격"
 RED_attack_ger_desc: "스칸디나비아 반도와 유럽은 해협으로 갈라져 있습니다. 이는 우리가 덴마크 권역에서의 지역 방위 작전을 수행하기 굉장히 어렵게 만들고 있습니다. 슐레스비히, 그리고 더 나아가서 홀슈타인 지방에로의 공세는 슈퇴르 강의 확보로 이어질 것이며, 이는 강을 활용한 진지전이라는 이점으로 이어질 것입니다."
 RED_GEK_gave_goatland_flag: "§Y[GEK.GetAdjective]§!이(가) §Y[124.getname]§!를 양도"
 RED_GEK_gave_goatland_flag_tt: "현재 일수: [?RED_GEK_gave_goatland_flag:days|Y0]"
 RED_hegemony_on_balt: "발트 패권"
 RED_hegemony_on_balt_desc: "우리에겐 발트해에서의 명백한 패권이 필요합니다."
 RED_deal_with_fin: "완충국가와의 제휴"
 RED_deal_with_fin_desc: "우리의 옆에 있는 핀란드는 소련과도 맞닿은 국가이며, 그들은 우리와 같이 소련을 적대하고 있습니다. 우리가 먼저 핀란드에 손을 내민다면 그들은 우리와 적대하지 않으며 함께 소련에 대항할지도 모릅니다."
 RED_deal_with_fin_tt: "\n§g@SOV§Y[SOV.GetAdjective]§!(와)과 전쟁하고 있는 미엥지모제 국가들에게 쓸 수 있습니다.§!"
 RED_seek_allies: "동맹 모색"
 RED_seek_allies_desc: "반소비에트 동맹국들을 찾아나서야 합니다."
 RED_support_german: "[GEK.getname] 지원"
 RED_support_german_desc: "트리니티의 패권에 맞서는 동지들을 지원해야 합니다."
 RED_support_geh: "게헨나 지원"
 RED_support_geh_desc: "트리니티의 패권에 맞서는 동지들을 지원해야 합니다."
 RED_trade_with_KAI: "민간 교류 활성화"
 RED_trade_with_KAI_desc: "고립은 아무래도 좋은 생각이 아닙니다."
 RED_infiltrate_trm: "트리니티에의 잠입"
 RED_infiltrate_trm_desc: "우리는 트리니티의 확장에 대비하여야 합니다."
 RED_unlock_operation_tt: "@TRM§Y[TRM.getadjective]§!을(를) 대상으로 하는 §Y작전§! §G사용가능§!:\n§Y위조지폐 발행§!, §Y생화학 무기 살포§!"

 BA_fake_money_gang: "위조지폐 발행"
 BA_fake_money_gang_desc: "우리는 위조지폐를 발행하여 상대 국가의 경제에 씻을 수 없는 피해를 줄 것입니다."
 BA_corona_gang: "생화학 무기 살포"
 BA_corona_gang_desc: "옛날에 이런 걸 금지했던 기억이 있는 거 같은데."

 RED_attack_sov: "소련 확보"
 RED_attack_sov_desc: "소비에트 지도자의 독선적인 행보는 우리의 혁명에 위협이 되고 있기에, 우리가 혁명을 완수하려면 이들과 맞서 싸워야 하는 건 기정사실이 되었습니다. 그리고 이제 때가 되었습니다."
 RED_new_inteligence_agency: "정보국 신설"
 RED_new_inteligence_agency_desc: "붉은겨울 정보국의 악명은 학원도시 사이에서 유명합니다. 체리노 회장은 붉은겨울 내부의 적과 외부의 적에 대비하기 위해 붉은겨울 정보국의 재조직을 명령하였습니다."
 RED_professioner_undercover: "잠입 전문가" 
 RED_professioner_undercover_desc: "적진에 안전하게 잠입하기 위해선 고강도의 정신적, 육체적인 훈련을 마친 엘리트 요원이 투입되어야 합니다. 우리 정권에 우호적인 요원들이 길러낸 잠입 전문가들은 타지에서 우리의 눈과 귀가 되어줄 것입니다."
 RED_fraktiya: "쁘락치"
 RED_fraktiya_desc: "현지인들의 저항 조직을 분열시키는 임무를 맡은 전문공작원들이 투입될 차례입니다."
 RED_international_frontline: "혁명수비대"
 RED_international_frontline_desc: ""
 RED_communist_instigation: "국제 소비에트 의용군"
 RED_communist_instigation_desc: "노동자 국제주의를 유지하는 것은 모든 노동자들의 의무입니다."
 RED_anti_stalin_in_spain: "스페인 내 반스탈린 대오"
 RED_anti_stalin_in_spain_desc: "$SOV_covert_support_for_spanish_poum_desc$"
 RED_trotsky_s_world_revolution: "트로츠키의 세계혁명"
 RED_trotsky_s_world_revolution_desc: "최근 우리 학원의 학생회장인 체리노와, 연방학원 이데올로기의 건설자인 트로츠키가 서로 의견 충돌이 벌어지고 있습니다. 우리는 이 혼란 속에서 트로츠키 동지의 세계혁명 이론을 지지하고 전 세계를 향한 혁명 전쟁을 준비해야 합니다."
 RED_cherino_s_systemic_revolution: "체리노의 체제혁명"
 RED_cherino_s_systemic_revolution_desc: "최근 우리 학원의 학생회장인 체리노와, 연방학원 이데올로기의 건설자인 트로츠키가 서로 의견 충돌이 벌어지고 있습니다. 우리는 이 혼란 속에서 체리노 동지의 체제혁명 이론을 지지하고 전위조직의 권력을 타파하고 지속 가능한 공산주의를 이뤄내야 합니다."
 RED_party_reorganization: "새로운 테제"
 RED_party_reorganization_desc: "붉은겨울 소비에트를 이끌 새로운 강령이 확립되었고, 이내 연방의 모든 체제는 이 강령에 의해 재조직 될 것입니다."
 RED_party_reorganization_tt: "§R[RED.getname]은(는) 트로츠키와 좌익반대파의 이념에 맞춘 정치적 전환을 맞을 것입니다.§!"
 RED_party_reorganization_tt_1: "§R[RED.getname]은(는) 체리노와 사무국의 이념에 맞춘 정치적 전환을 맞을 것입니다.§!"
 RED_centralization: "중앙 집권 국가"
 RED_centralization_tt: "\n§Y해방지구 재건평의회§!의 군사력이 강화됩니다."
 RED_union_nation_tt: "\n§Y해방지구 재건평의회§!로부터 더 많은 산업을 받습니다."
 RED_union_nation: "제민족의 자결" 
 RED_workers_state: "노동자 공화국"
 RED_workers_state_desc: "노동자 공화국인 우리 국가는 옆 소비에트 연방처럼 관료주의로 타락한 노동자 국가가 되지 않도록 주의를 기울이고, 세계 인민의 해방을 위해 지속적인 투자를 할 것입니다."


 RED_party_central_dissolution: "당중앙 해체"
 RED_party_central_dissolution_desc: "공산당 중앙위원회는 자기 자신의 의견을 공산당 전체의 의견인 것처럼 당을 주도하는 역할을 지속적으로 해 왔습니다. 이제, 당 중앙위원회 독재가 아닌 당독재로 나아가기 위해 중앙위원회의 영향력을 크게 축소하고 당원 동지들의 발언권을 향상할 것입니다."
 RED_thesis_tt: "중점 §Y$RED_party_reorganization$§!를 완료했을 때:\n\n"
 RED_freedom_of_debate_unity_of_action: "토론의 자유와 단합된 행동"
 RED_multi_party_system: "다당제 협동"
 RED_soc_dem_party_name_long: "사회민주노동당"
 RED_soc_dem_party_name: "SDLP"
 RED_hegemony_struggle: "문화 패권 투쟁"
 RED_free_soviets: "자유 소비에트"
 RED_free_soviets_desc: "당독재로 나아가기 위해서는 진정으로 인민에 의해 설립되고 운영될 소비에트가 필요합니다. 이제 작업장의 노동자들은 자유롭게 소비에트를 수립하고 해산할 수 있으며, 당 간부들 또한 고발로 탄핵될 수 있습니다."
 RED_democratic_planned_economy: "산업 중앙 통제"
 RED_no_war_but_class_war: "전쟁이 아니라 계급전쟁"
 RED_ideal_of_bolshevism_again: "볼셰비즘 이상 재현"
 RED_cherino_core_of_solidarity: "통일단결의 핵"
 RED_day_of_victory: "승리의 날"
 RED_return_of_left_oppisition: "좌익반대파의 귀환"
 RED_revolutionary_trial: "혁명 재판"
 RED_bolshevik_leninism: "볼셰비키-레닌주의"
 RED_social_rebuild: "사회 복구 사업"
 RED_rebuild_party: "전위당 재건"
 RED_annex_party: "당 병합"
