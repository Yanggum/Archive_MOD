 RED_HYUSIK_ideas_1_desc: "전면적인 주 3일제의 시행에 따라 생산량이 급격히 줄어들었고, 우리는 이러한 경제 상태를 영구히 유지할 수 없었습니다. 중앙위원회는 대신 학생들에게만 주 3일제를 보장하고, 현지인 노동자들에게는 탄력근무제와 주 4.5일제를 보장하기로 했습니다."
 RED_strike: "산발적인 파업"
 RED_strike_desc: "군정청은 물론이고 현지 관료들을 대체하여 새로 배치된 붉은겨울 관료들은 무능하고 비효율적이며 또한 착취적입니다. 중앙에서는 이들을 통제할 여력이 없고, 이에 따라 현지의 노동운동은 교섭과 경제투쟁을 목적으로 하기보다 더 폭넓은 산별 연계와 반체제 운동으로 발전하고 있습니다."
 RED_february_strike: "2월 총파업"
 RED_february_strike_desc: "군정청은 물론이고 현지 관료들을 대체하여 새로 배치된 붉은겨울 관료들은 무능하고 비효율적이며 또한 착취적입니다. 중앙에서는 이들을 통제할 여력이 없고, 이에 따라 현지의 노동운동은 교섭과 경제투쟁을 목적으로 하기보다 더 폭넓은 산별 연계와 반체제 운동으로 발전하고 있으며, 학생들 또한 이에 가담하며 산발적이었던 파업은 1936년 2월부터 대규모 총파업으로 확대되어 갈등의 불씨를 지피고 있습니다."
 
