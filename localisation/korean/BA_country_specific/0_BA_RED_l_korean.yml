 RED_council_for_worker: "노동자를 위한 의회를"
 RED_council_for_worker_desc: "'더 평등한 인민'라는 단어는 사무국이라는 끔찍한 독재자를 탄생시켰습니다. 새롭게 만들어진 생디칼리즘 노동자 정부는 '모든 인민은 평등하며, 더 평등한 인민은 존재하지 않는다.' 에 기초하여, 인민들을 이끌어 나갈 것입니다. "
 RED_to_left: "생산을 향한 투쟁"
 RED_to_left_desc: "세상엔 아직 수많은 부르주아 압제자가 들끓고 있습니다. 이들이 환하게 웃으며 건네주는 자본에 기댄다는 것은 또 다른 독재자를 탄생시킬 뿐입니다. 이들에 맞서 자주적인 생산 경제 체제 구축을 위한 투쟁을 시작할 때입니다. "
 RED_workerparty_upgrade: "민주적인 공업화"
 RED_workerparty_upgrade_desc: "정부의 명령으로 주도되는 공업화 정책과 다르게, 인민들의 자발적인 공업화 요구에 따라서 이루어지는 노동자 주도의 공업화 정책은 붉은겨울에서만 볼 수 있는 독특한 사회현상입니다."
 RED_union_igwan: "계획 도시"
 RED_union_igwan_desc: "의회의 주도 아래에서, 붉은겨울 캠퍼스 남부는 계획 도시화가 진행 중입니다. 건설이 완료된다면 캠퍼스 남부는 붉은겨울에서 가장 발전되고 살기 좋은 도시가 될 것입니다."
 RED_industrial_union: "산별노조 설치"
 RED_industrial_union_desc: "산별노조란 동일한 산업에 종사하는 누구나 조합원으로 가입할 수 있는 노조를 말합니다. 노동자 친화적인 우리 정부는 많은 분야에서 산별노조의 설치와 확대를 적극 권장하고 있습니다."
 RED_worekr_pro: "노동자 전문화"
 RED_worekr_pro_desc: "각 분야에서 숙련된 노동자들은 작업 능률에 있어 보다 더 효울적일 뿐만 아니라 높은 성과를 보여줍니다. 이들의 노하우를 다른 노동자들에게 학습시킨다면 전반적인 생산량을 극대화 시킬 수 있을 것입니다."
 RED_mechanize_agri: "농업 기계화"
 RED_mechanize_agri_desc: "북유럽의 자연환경이 농사를 짓기에 좋은 편은 아니지만, 키보토스의 기술이 적용된 농기계들을 사용한다면 농지를 효율적으로 사용할 수 있습니다."
 RED_gaegan_silsi: "농지 확대"
 RED_gaegan_silsi_desc: "농업의 기계화는 우리가 경작할 수 있는 땅을 늘려줬습니다. 의회는 캠퍼스 일대의 넓은 평원에 우리 인민들의 식탁과 배를 풍족하게 해줄 작물들을 심을 계획을 준비 중입니다."
 RED_school_communism: "추가적인 푸딩 배급"
 RED_school_communism_desc: "이 세계의 아나키스트인 표트르 크로포트킨의 저서 '빵의 쟁취'에서 그는 '혁명 정부가 농민들에게 지폐를 지급하는 대신, 그들에게 유용한 물건을 직접적으로 제공해야 한다.'라고 주장했습니다. 마찬가지로 작금의 혁명 정부는 인민대중들에게 있어서 확고한 지지를 위해 그들을 포섭하기 위한 직접적인 물자의 제공이 필수적입니다. 우리의 경우, 푸딩이 이러한 역할을 할 수 있습니다."
 RED_HYUSIK: "주 3일제"
 RED_HYUSIK_desc: "주 3일제는 붉은겨울 노동자들이 염원하던 가장 이상적인 노동자 복지 형태로, 그간 사무국의 압제에 의해서 실현될 가능성이 거의 없었습니다. 그러나 노동자들을 위한 의회가 들어선 지금, 주 3일제에 관한 내용이 긍정적으로 검토되고 있습니다."
 RED_worekrs_research: "가장 선진적인 노동권"
 RED_worekrs_research_desc: "노동자 친화적인 의회의 활약 덕분에, 붉은 겨울의 노동자들은 스스로 일터에 나가 일일 생산량 이상을 달성하고 휴일엔 다른 국가의 노동자들보다 질 좋고 편안한 삶을 영위하고 있습니다."
 RED_council_set_up: "사회주의 공업단지"
 RED_council_set_up_desc: "붉은겨울 캠퍼스 남부는 혁명 당시에 사무국 일당의 거센 저항으로 가장 심하게 파괴된 지역입니다. 공장을 건설할 마땅한 부지를 찾던 의회는 이 지역에 대규모 공업단지를 신설할 계획을 세웠습니다."
 RED_asdfdd: "광업 증진"
 RED_asdfdd_desc: "현지 과학자들의 연구 결과, 붉은겨울 캠퍼스 중앙과 그 일대 지역에 미개발된 철광석들이 다수 존재한다고 합니다. 자주적인 생산 경제 체제 구축을 위해서라면 광산 개발을 주저할 이유가 없습니다."
 RED_worker_republic_desc: "평의회의 수많은 노력 끝에, 붉은겨울은 노동자 친화적인 정책을 성공적으로 수립하였습니다. 이제 붉은겨울의 인민은 당당하고 자주적으로 살아갈 것이며, 탐욕스럽고 이기적인 자본주의에 고통받으며 살아가지 않을 것입니다. 붉은겨울 노동자 공화국이여, 영원하라!"
 RED_military_union: "방산노조" 
 RED_military_union_desc: "혁명의 완전한 성공을 위해서는 방위산업의 육성이 중요하고, 이를 위해서는 방위산업 종사자들의 마음을 사로잡을 필요가 있습니다. 방산노조의 설립은 관련 종사자들의 지지를 얻을 수 있는 방법입니다."
 RED_Civilian_factory_union: "제조노조"
 RED_Civilian_factory_union_desc: "붉은겨울의 노동자들은 대부분이 제조산업에 종사중입니다. 이들의 요구를 관철하고 이들의 의견을 잘 경청하기 위해선 제조노조의 설립을 적극적으로 추진해야합니다."
 RED_infrastructure_union: "건설노조"
 RED_infrastructure_union_desc: "현 의회의 전신 중 하나인 '붉은겨울 용역부'는 키보토스에 있을 때부터 토목 공사에 일가견이 있는 동아리였습니다. 이들은 건설노조의 설립에 많은 도움을 줄 것입니다."
 RED_gun_gaebal: "언론노조"
 RED_gun_gaebal_desc: "붉은곰 편집국은 언론노조를 설립하여 기자들의 투쟁을 지원하고 무너진 현지의 언론사들을 전부 흡수 통합하여 붉은겨울의 일상을 보도하고 있습니다. 의회는 노조의 대표인 미요시 타카네에게 민중의 언론인이라는 칭호를 내리며 노조의 투쟁을 치하하였습니다."
 RED_soldier_union: "병사노조"
 RED_soldier_union_desc: "전쟁의 전선에서 싸우는 병사들 또한 불합리한 요구에 반대하고자 연대할 필요가 있습니다. 혁명전쟁의 젊은 영웅들이 주축이 되어 만들어진 병사노조는 병사들의 권익을 위해 투쟁할 것입니다."
 RED_mil-ind_complex: "사무노조"
 RED_mil-ind_complex_desc: "서방세계의 사무직들은 기계부품처럼 살아가며 억압받고 있습니다. 우리는 이 '사무직 노동자'들의 투쟁을 촉진하기 위해 이들에게 사무노조를 결성할 권리를 쥐어주고 더 큰 자율권을 부여할 것입니다."
 RED_education_union: "교육노조"
 RED_education_union_desc: "학교에 있는 선생들 또한 '교육 노동자'로써 존중받을 권리가 존재합니다. 이들이 요구하는 정당한 권리와 복지를 이행한다면 결과적으로 교육의 질을 끌어 올릴 것입니다."
 RED_combine_of_edu_and_labor: "노동과 교육의 결합"
 RED_combine_of_edu_and_labor_desc: "붉은겨울의 교육은 계층 구조에 얽매인 반동 국가의 교육과 다르게 효율적이고 근면한 노동자들을 육성하기에 있어 매우 훌륭합니다. 따라서 우리는 현지 학생들에게도 우리와 같은 교육을 받도록 해야 합니다."
 RED_revolution_city: "혁명 도시"
 RED_revolution_city_desc: "신기술이 적용된 주택과 현대적인 기반을 노동자들의 일터 근처에 구축하는 것, 그리고 이를 노동자들과 그들의 가족에게 제공하는 것. 이 모든 것이 적용된 도시는 '혁명 도시'라 칭해도 과언이 아닙니다."
 RED_housing_committee: "주택개발위원회"
 RED_housing_committee_desc: "수많은 인민들이 집이 부족해 더러운 판자촌에서 살아간다면 이들은 우리 정부를 불신할지도 모릅니다. 건설노조의 주도 아래 세워진 주택개발위원회는 불어나는 인구에 맞춰 캠퍼스와 인근 토지를 개발하는 작업에 착수하고 있습니다."
 RED_work_for_worker: "노동해방을 향해서"
 RED_work_for_worker_desc: "붉은겨울에서 이뤄진 기나긴 시간 동안 우린 압제자들에게 투쟁하였으며 부조리한 사회 구조를 바꿔가며 노동자들을 위한 국가를 만드는 데 성공하였습니다. 이제 붉은겨울에 노동해방의 여명이 밝아오고 있습니다."
 
 RED_minori_diplo_0: "혁명적 고립주의"
 RED_minori_diplo_0_desc: "자유주의에 영향을 받은 대중들은 맥락과 관계없이 고립이란 굉장히 구시대적이고 봉건적이며 부정적인 것으로 생각하는 경향이 있습니다. 그러나 혁명을 지키기 위해 고립을 유지하는 것을 필수불가결합니다. 다른 노동자대중을 핍박하는 정권이나 체제에 협조하거나 그것과 제휴하는 행위는 민중에 대한 분명한 배신이며, 혁명에 반하는 것입니다."
 RED_minori_diplo_1: "자주"
 RED_minori_diplo_1_desc: "\"노동자에 의한 자주국가\""
 RED_minori_diplo_2: "평등"
 RED_minori_diplo_2_desc: "\"평등한 붉은겨울을 위해!\""
 RED_minori_diplo_3: "해방"
 RED_minori_diplo_3_desc: "\"전 키보토스, 세계의 노동자여, 해방을 위해 단결하라!\""
 RED_minori_diplo_4: "고난의 행군"
 RED_minori_diplo_4_desc: "붉은겨울엔 몇년마다 전례없는 한파가 몰아쳐 대기근이 발생하곤 합니다. 이번 대기근은 우리 정부의 유능한 대처로 별 탈 없이 견뎌냈지만, 이 고난의 행군으로 알아낸 정책의 미흡한 부분을 고쳐내야 합니다."
 RED_minori_diplo_5: "식량 자립"
 RED_minori_diplo_5_desc: "붉은겨울 역사상 가장 큰 대기근을 견뎌낸 우리에게 남은 과제는 완벽한 식량의 자립입니다. 과거와 같은 실패를 반복한다면 우리를 향한 지지는 떨어질 것입니다."
 RED_minori_diplo_6: "혁명전쟁 대비"
 RED_minori_diplo_6_desc: "붉은겨울의 혼란은 점차 잦아들고 있지만, 세계는 점점 혼란스러워지고 있습니다. 세계의 부르주아들, 제국주의자들에게 대항하기 위해선 우리가 부르짖던 혁명전쟁의 준비에 박차를 가해야 합니다."
 RED_minori_diplo_6_tt: "\n§Y@TRM [TRM.getname]§!과(와) §R전쟁§!이 발생하면 중점 §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§! 이하의 완료된 중점의 수에 따라 따라 §Y혁명전쟁§! 국민정신이 추가됩니다."
 RED_minori_diplo_7: "전학공투회의"
 RED_minori_diplo_7_desc: "자율적이고 수평적인 학생 단체들의 연합회를 모토로 한 전학공투회의는 여러 분야의 학생들이 붉은겨울의 안녕을 위해 모여 설립한 단체로, 이들의 아낌없는 지원은 혁명전쟁을 대비하는데 도움이 될 것입니다."
 RED_minori_diplo_8: "해외 조직과 연대"
 RED_minori_diplo_8_desc: "세계엔 노동자의 해방을 위해 양지에서, 그리고 음지에서 고군분투하는 조직들이 많이 존재합니다. 그 단체가 키보토스인이 설립하였던, 현지인이 설립한 단체이던지 간에 노동자의 해방이라는 대의를 믿고 움직인다면 이들은 모두 동지이며, 우린 이들을 지원할 의무가 존재합니다."
 RED_minori_diplo_9: "적색 의용대"
 RED_minori_diplo_9_desc: "노동절 혁명에서 다시 한번 깨달았듯이, 혁명에는 필수적으로 무력이 동반되어야합니다. 우린 노동자들의 자주를 위해 투쟁하는 해외 조직을 돕기 위해, 의용대를 창설하였습니다. 특유의 적색 군복에서 이름을 딴 '적색 의용대'는 노동절 혁명에 참여한 영웅들 대다수가 소속되어있습니다."
 RED_minori_diplo_10: "노동자 국제주의"
 RED_minori_diplo_10_desc: "노동자들이 만든 장비로 싸우는 전쟁은 결과적으로 노동자 동지들간의 싸움이라고 볼 수 있습니다. 그렇기에 우린 전쟁이 시작된다면, 노동자들을 설득하여 노동을 멈추고 노동자 인터내셔널의 인도 하에 전쟁의 신속한 종결을 지향하며 자본주의 계급의 철폐를 앞당기기 위해 전력을 다해야 합니다."
 RED_minori_diplo_11: "적핀란드 계획"
 RED_minori_diplo_11_desc: "과거 붉은겨울 방위위원회가 있었던 핀란드는 우리와 소련의 완충지대 역할을 해왔습니다. 그러나 소련의 위협이 대두된 지금, 우린 핀란드를 우리의 편으로 만들기 위한 계획을 세우고 검토해야합니다."
 RED_minori_diplo_12: "반독점"
 RED_minori_diplo_12_desc: "밀레니엄은 압도적인 과학 기술을 오직 독점으로 이용하고 있습니다. 우리는 더 이상 소수의 권력자를 위한 기술 낭비을 도외시할 수 없습니다."
 RED_minori_diplo_13: "반나치"
 RED_minori_diplo_13_desc: "이들은 자신이 가장 우월하다는 위험한 사상을 가지고 있습니다. 그들이 정의내린 '저열한 민족'이 핍박받지 않도록 보호해야 합니다."
 RED_minori_diplo_14: "반볼셰비키"
 RED_minori_diplo_14_desc: "이 세계에도 우리와 같은 이념을 가진 국가가 있었을 때는, 기뻐했습니다. 하지만 그들은 숭고한 이념을 배신했습니다. 배신자는 반드시 척결해야 합니다."
 RED_minori_diplo_15: "세계 혁명"
 RED_minori_diplo_15_desc: "우리는 혁명으로 붉은 겨울을 빛나는 미래로 인도했습니다. 하지만 여기서 그치면 안 됩니다. 우리는 신성한 혁명을 세계 너머까지 전해야 하는 의무가 있습니다."
 RED_minori_diplo_16: "반제국주의"
 RED_minori_diplo_16_desc: "영국과 프랑스는 다른 이를 착취하여 세운 문명을 자랑스러워 합니다. 이런 잘못된 제국주의 사고방식은 반드시 뜯어 고쳐야 합니다."
 RED_minori_diplo_17: "반봉건주의"
 RED_minori_diplo_17_desc: "인간이 인간을 다스린다는, 고대에나 쓰일 듯한 낡아빠진 이념은 당장이라도 바꿔야 합니다."
 RED_minori_diplo_18: "반파쇼"
 RED_minori_diplo_18_desc: "이탈리아는 파시즘의 창시 국가로, 현재도 공격적인 외교 정책을 펼지고 있습니다. 우리는 사악한 이념에 맞서 싸워야 합니다."
 RED_minori_diplo_19: "반독재"
 RED_minori_diplo_19_desc: "아로나는 총학생회를 무단으로 점거하고 독재를 펼쳤습니다. 이 정신 나간 AI를 당장 막아야 합니다."
 RED_minori_diplo_20: "반자본주의"
 RED_minori_diplo_20_desc: "노동자의 숙적인 자본주의가 미국에서 번창하는 한 혁명은 끝나지 않을 것입니다. 미국을 시작으로 혁명의 물결은 바다 건너까지 몰아칠 것입니다!"
 RED_minori_diplo_21: "§0관념론 혁파§!"
 RED_minori_diplo_21_desc: "기이한 것이 나타난 뒤, 그 것을 목도한 자들이 세뇌되었습니다. 우리는 저 기이한 것을 물리쳐 정신 따위나 믿는 자들이 틀렸다는 것을 입증해야 합니다."
 
 
#해군 중점
 RED_cruiser_question: "노르웨이 장갑함 재취역"
 RED_cruiser_question_desc: "구 노르웨이 해군의 해방전함 몇 척이 퇴역한 채 방치되어 있다고 합니다. 이곳 기준으로도 상당히 구식이긴 하지만 약간의 개장만 거치면 재취역시킬 수 있을 것입니다."
 RED_nortraship: "민간 수송선 확보"
 RED_nortraship_desc: "타지의 보급과 신속한 군인 수송을 위해 정치적인 손해를 들여서라도 민간에 있는 수송선을 확보해야 합니다."
 RED_naval_rearmament: "해군 재무장"
 RED_naval_rearmament_desc: "붉은 겨울을 위협하는 적들은 하늘과 땅에만 존재하는 것이 아닙니다. 바다와 3면이 맞닿아있다는 지리적인 특성으로 인해, 우리는 해군 재무장을 서둘러야 합니다."
 RED_coastal_artillery: "서해안요새 구축"
 RED_coastal_artillery_desc: "발트해의 여러 나라들과 맞닿아있어 방어에 많은 관심이 기울어진 동부와 달리, 사무국이 위치한 서부 해안의 방어 설비는 열약하기에 그지없습니다. 북해와 덴마크 해협이 만나는 관문에 있는 서해안을 지키는 것이 필수적인 과제입니다."
 RED_large_navy: "대형함대"
 RED_large_navy_desc: "바다를 지배하기 위해서 우린 강력한 함대가 필요합니다. 이 함대를 잘 운용하기 위한 교리를 다듬고 기술을 발전시키는 것은 우리의 전력을 크게 증강할 것입니다."
 RED_light_cruisers: "경순양함 개발"
 RED_light_cruisers_desc: "재빠른 기동성의 경순양함은 비록 함대전의 주역이 되지 못할지언정 보조적인 역할에는 예상외의 활약을 보여주었습니다. 이는 경순양함 개발을 가속할 명분이 되었습니다."
 RED_heavy_cruisers: "장갑함 개발"
 RED_heavy_cruisers_desc: "효과적인 대응 방어 기능을 갖춘 장갑함의 존재는 발트해를 넘어 세계를 지배하는 데 필수적입니다."
 RED_small_navy: "기습함대"
 RED_small_navy_desc: "붉은 겨울의 연약한 공업력으로 대형 함대를 만들기에는 역부족이기에, 우린 기습공격에 특화된 교리를 받아들이고 이를 적극적으로 활용해야 합니다."
 RED_submarines: "잠수함 개발"
 RED_submarines_desc: "우수한 기술력으로 만들어진 잠수함은 쉽게 탐지되지 않을뿐더러 몇 배 크기의 적을 쓰러뜨릴 수 있습니다. 이를 이용한다면 대양에 비해서 얕은 발트해에서의 생존 가능성을 극대화하고 여러 요충지를 점령한 병력을 만들 수 있습니다."
 RED_destroyers: "구축함 개발"
 RED_destroyers_desc: "해상 보급과 수송을 책임지는 수송선은 잠수함에 취약합니다. 성장하는 잠수함 기술에 대응하기 위해 구축함을 개발하는 것도 소홀히 해서는 안 됩니다."
 RED_controller_of_baltic: "발트해의 지배자"
 RED_controller_of_baltic_desc: "우린 전 세계로 붉은 겨울의 혁명정신을 전파하기 위한 과제였던 발트해의 절대적인 제해권을 잡는 데 성공하였습니다. 과거 이 땅에 있었던 제국이 성공하지 못한 과업을 달성한 우리는 당당히 발트해의 지배자라고 말할 수 있습니다."
 
#육군 중점
 RED_rearming_focus_0: "재무장 계획"
 RED_rearming_focus_0_desc: "붉은겨울의 군대는 대전이와 현지인들의 거센 저항으로 인해 예전의 위상에 미치지 못하는 상대에 놓였습니다. 우리 정부의 우호적인 현지인들의 도움을 받아 재무장을 서둘러야합니다."
 RED_rearming_focus_1: "군수물자 생산 증대"
 RED_rearming_focus_1_desc: "과거의 명언에서도 알 수 있듯이, 전쟁에 앞서 군수물자를 비축해두는 것은 중요합니다. 캠퍼스 외부의 땅에도 공장을 신설하여 군수물자의 생산을 증대해야합니다."
 RED_rearming_focus_2: "공업단지"
 RED_rearming_focus_2_desc: "옘틀란드에 위치한 붉은겨울 구교사의 근처엔 빈 땅이 펼쳐져있습니다. 이 빈 땅에 공업단지를 설치하고, 구교사의 문제아들을 동원하여 군수품을 생산한다면 생산량을 폭발적으로 올릴 수 있을 것입니다."
 RED_rearming_focus_3: "개선된 생산 설비"
 RED_rearming_focus_3_desc: "지식해방전선의 끊임없는 연구 끝에, 키보토스의 장비와 이 세계의 장비 둘을 동시에 효율적으로 생산가능한 혁명적인 생산 설비가 탄생하였습니다. 용역부는 이 설비에 큰 관심을 표했으며, 머지 않아 용역부의 생산 설비는 전부 신 설비로 교체될 예정입니다. "
 RED_rearming_focus_4: "조병창 통합"
 RED_rearming_focus_4_desc: "중구난방으로 흩어져있는 생산공장은 군수품 조달에 비효율적입니다. 적의 폭격에 취약하다는 단점이 있으나, 조병창의 통합은 효율적인 장비 조달을 위해 필수적입니다."
 RED_rearming_focus_5: "툰드라 중공업지구"
 RED_rearming_focus_5_desc: "척박한 툰드라 지대는 겉보기에 아무런 이득을 볼 수 없을 것 같지만, 공업단지가 들어서기에 충분히 넓은 땅을 가지고 있습니다. 우리의 기술력을 이용한다면 불모의 땅을 공업지대로 만들 수 있을 것입니다."
 RED_rearming_focus_6: "대량생산체계"
 RED_rearming_focus_6_desc: "수많은 반복작업 끝에, 용역부의 군수품 생산 담당 학생들은 이 분야의 숙련자가 되었습니다. 심지어 이들은 자체적인 대량생산체계를 만들어 다른 공장의 용역부 학생들에게 전파하고 있습니다."
 RED_rearming_focus_6_tt: "공장 생산량: §G+3.00%§!\n"
 RED_rearming_focus_7: "노동의 과학적 관리법"
 RED_rearming_focus_7_desc: "지식해방전선은 용역부가 개발한 대량생산체계를 생산 효율 성장에 초점을 맞춰 개선하여 더욱 발전된 생산체계를 제안하였습니다. 이 체계를 채택한다면 더욱 효율적인 공업 성장을 이룰 수 있을 것입니다."
 RED_rearming_focus_8: "생산에 헌신"
 RED_rearming_focus_8_desc: "지금은 더욱 많은 장비들을 뽑아내는 것이 중요합니다. 비록 생산 효율의 성장이 떨어지겠지만, 붉은겨울은 질보다 양으로 승부를 봤고, 그 결과는 언제나 만족스러웠습니다."
 RED_rearming_focus_8_tt: "공장 생산량: §G+5.00%§!\n£GFX_prod_eff 생산 효율 성장: §R-5.00%§!"
 RED_rearming_focus_9: "규모의 경제"
 RED_rearming_focus_9_desc: "이제 붉은겨울에서 군수공업은 하나의 경제로 자리잡게 되었습니다. 더 많은 공장을 늘려 경제 호황을 유지해야합니다."
 RED_rearming_focus_10: "노동사회공학연구소"
 RED_rearming_focus_10_desc: "노동과 사회의 양립은 인민의 삶과 직결되는 중대한 사유입니다. 이를 균형있게 조율하는 정책을 내놓기 위해선 과학적인 근거가 필요합니다. 노동사회공학연구소를 설립하여 인민의 동요없는 안정적인 생산 정책을 강구해야합니다."
 RED_rearming_focus_11: "열정적인 희생"
 RED_rearming_focus_11_desc: "전쟁이 벌어진다면 인민의 삶은 나락으로 떨어질 것입니다. 약간의 희생을 감수하여 압도적인 전력을 보유하고 이를 과시하며 주변국의 침공을 막을 수 있다면, 나아가 평화를 유지할 수 있다면, 이 희생은 위대한 희생으로 기억될 것입니다."
 RED_rearming_focus_12: "요동치는 공업의 맥박"
 RED_rearming_focus_12_desc: "붉은겨울의 군수경제는 황금기에 들어섰습니다. 수많은 공장이 군수물자를 뽑아내기 위해 코어가 바쁘게 돌아가는 모습은 마치, 하나의 거대한 심장이 맥박치는 것과 같습니다. 다시 한번, 위대한 붉은겨울은 대전이의 어려움을 극복하고 한발짝 앞으로 나아갔습니다."
 RED_rearming_focus_13: "야포 공장"
 RED_rearming_focus_13_desc: "포병은 보병의 가장 듬직한 친우입니다. 그리고 많은 포는 또한 많은 승리를 보장합니다! 야포 공장을 건설하여 전시 상황에 규모의 포병 지원 전력을 확충해야 합니다."
 RED_rearming_focus_14: "발전단지"
 RED_rearming_focus_14_desc: "전력은 현대 사회 생활에 있어 필수적인 부분입니다. 노동자들이 따뜻한 불빛 아래에서 일할 수 있도록 발전 시설을 보충해야 합니다."


 RED_army_production_improve: "군산학 협동"
 RED_army_production_improve_desc: "노동자를 위협하는 적들이 사방에 가득합니다. 우리는 동지들이 두려움에 떨지 않도록 군사 기술을 연구해야 합니다."
 RED_army_production_improve_tt: "연구 속도: §G+2.50%§!"
 RED_strengthen_the_mobilization_plan: "동원 강화"
 RED_strengthen_the_mobilization_plan_desc: "예로부터 붉은겨울의 군대는 군사학적 접근이 결여된 채 만세 돌격이 주 전술로서 기능했습니다. 이번 기회에 붉은겨울의 새롭고 정교화된 교리를 도입해야합니다. "
 RED_military_engineering: "전쟁공학"
 RED_military_engineering_desc: "이곳의 전쟁은 이곳의 방식이 있습니다. 이곳의 방식에 적응하지 못한다면 도태되어 역사 속으로 사라질 뿐입니다."
 RED_artillery: "붉은겨울의 포병"
 RED_artillery_desc: "몇몇 붉은겨울의 장교들은 원거리에서 적들을 섬멸할 수 있는 포병에게 깊은 관심을 기울이게 되었습니다."
 RED_the_means_to_wage_war: "지원 장비 연구"
 RED_the_means_to_wage_war_desc: "지식해방전선의 엘리트들이 모여 연구해 개발한 지원 장비는 전장에서 싸우는 이들을 보조할 것입니다."
 RED_superior_war_machines: "전차의 우월성"
 RED_superior_war_machines_desc: "대부분의 현지인들은 전차의 강력함과 빠른 기동력을 알지 못합니다. 그러나 반동분자들과의 싸움에서 전차의 우월성을 알고 있는 우리는 많은 전차를 양산해야 합니다."
 RED_quantity: "'양'"
 RED_quantity_desc: "\"내가 싸우는 곳에서는 늘 다수의 병력으로 소수를 이겼다.\"\n\n나폴레옹이 이야기했다고 전해지는 이 어구가 의미하는 바는 명확합니다."
 RED_quality: "'질'"
 RED_quality_desc: "'소수정예'라는 말이 괜히 있는 것은 아닐 겁니다."
 RED_quantity_to_quality: "양질 전화의 법칙"
 RED_quantity_to_quality_desc: "양질전화의 법칙은 변증법적 유물론의 핵심 개념 중 하나로, 양적 변화가 일정 단계를 넘어서면 질적 변화를 일으키고, 새로운 질적 상태로 이행한다는 법칙입니다. 그리고 그러한 질적 변화는 다시 양적 확대로 이어진다는 것이 이 개념의 핵심입니다. 평행선처럼 서로 절대 만나지 않을 듯이 보였던 '양'과 '질'도 무엇을 골랐든 결국 자석처럼 서로를 향해갑니다!"
 RED_quantity_to_quality_tt: "국민정신 §Y$RED_quantity$§!과 §Y$RED_quality$§!의 효과의 각 절반을 더 받습니다:\n\n"
 RED_tank_destroyer: "전차 파괴자"
 RED_tank_destroyer_desc: "아무리 헤일로 보병이 강력한들, 전차를 상대하는 데에는 한계가 있습니다. 여기서 역으로 우리는 대전차 전문 병기를 개발하면 매우 유용할 것이라는 결론에 도달했습니다."
 RED_arms_industrial_optimize: "군수산업 최적화"
 RED_arms_industrial_optimize_desc: "현재의 군수산업의 구성은 혼란 그 자체입니다. 우리는 산업에서의 통일성을 유지할 필요가 있습니다."
 RED_baltic_forts: "전술 기계화"
 RED_baltic_forts_desc: "총알 하나로도 죽는 그들은 '장갑을 두른 자동차'를 개발했습니다. 신비가 부족한 지금은 우리한테도 저 기술이 필요합니다."
 RED_defend_the_east_line: "항공함 기술"
 RED_defend_the_east_line_desc: "비행기를 접목한 전투함은 이 세계의 매우 창의적인 기술입니다. 우리는 이 기술을 받아들어야 합니다."
 RED_improve_the_south_line: "제트 엔진"
 RED_improve_the_south_line_desc: "세상에, 하늘을 고속으로 날 수 있는 것이 실제로 존재한다니! 밀레니엄만큼, 아니 밀레니엄을 능가하는 저 항공 기술은 꼭 연구해야 합니다."
 RED_through_the_road_of_snow: "눈길을 지나"
 RED_through_the_road_of_snow_desc: "물자를 싣고 눈밭을 지나 전장으로 가는 일. 우리는 그런 일에는 이미 도가 텄습니다."
 RED_rehabilitated_military: "전투교리 대규모 개편"
 RED_rehabilitated_military_desc: "군사학 교수들은 학원에 전투교리를 도입해야 한다고 조언하고 있습니다.이들의 조언을 받아들여 규모의 군사교리 개편을 진행해야합니다."
 RED_military_reorganization_tt: ""
 RED_trench_exp: "참호전 훈련"
 RED_trench_exp_desc: "시가전이 주를 이루었던 키보토스와 달리 이곳은 참호전이 주를 이룹니다. 참호전에 대비한 훈련이 필요합니다."
 RED_trench_exp_tt: "참호 부설 속도: §G+5.0%§!\n최대 참호: §G+5.0§!\n근접항공지원 피해량 감소: §G+5.0%§!"
 RED_an_adaptable_army: "적응하는 군대"
 RED_an_adaptable_army_desc: "우리가 자리 잡은 이곳은 붉은 겨울과 비슷한 기후의 환경이지만 다른 곳의 기후는 우리에게 아주 생소한 기후입니다. 군인들이 다양한 기후에 적응할 수 있도록 해야 합니다."
 RED_an_adaptable_army_tt: "추위로 인한 손실: §G-10.00%§!\n더위로 인한 손실: §G-5.00%§!\n지형 불이익 감소: §G+10.0%§!"
 RED_penal_battalions: "새로운 세계의 군대"
 RED_penal_battalions_desc: "수많은 시간과 예산을 쏟아부어 대규모의 군제개편을 마치고 난 뒤, 붉은겨울의 군대는 적의 전술에 유연하게 대처 가능하고, 다양한 협동작전을 수행할 수 있는 능력을 갖추게 되었습니다."
 RED_shock_troops: "협동훈련"
 RED_shock_troops_desc: "대규모의 군대가 서로 유기적으로 움직일 수 있는 비결은 훈련뿐입니다. 지속적인 협동 훈련으로 병사들 간의 협동심을 키워야 합니다."
 RED_restore_cossack_units: "'규율'"
 RED_restore_cossack_units_desc: "엉성하게 훈련한 군대와는 다르게, 규율잡힌 군대는 어떤 돌발상황에서도 당황하지 않고 자신의 능력을 최대한 이끌어낼 수 있습니다."
 RED_restore_cossack_units_tt: "보병사단 공격: §G+5.0%§!\n보병 속도: §G+5.00%§!"
 RED_cohesion_first: "'열의'"
 RED_cohesion_first_desc: "붉은겨울과 혁명의 대의를 향한 열의가 충분하다면 일반 노동자나 농민 또한 겨울군대에 들어올 수 있습니다. 이들을 교육시키는데 다소 시간이 걸리겠지만, 열의로 뭉친 이들의 결속력은 규율잡힌 군대와 동등하거나, 그 이상입니다."
 RED_cohesion_first_tt: "동원 속도: §G+5.00%§!\n사단 회복률: §G+5.0%§!\n훈련 시간: §R+10.00%§!"

 RED_army_focus_1: "전문 장교"
 RED_army_focus_1_desc: "사관학교에서 전문적인 교육을 마친 장교는 군에서 빼놓을 수 없는 인재입니다. 이들의 도움을 받아 붉은겨울의 군사교리에 전면적인 수정과 보완을 가해야합니다."
 RED_army_focus_1_tt: "계획 수립 속도: §G+10.0%§!\n징병 가능 인구 변동치: §R-5%§!"
 RED_army_focus_2: "보급 우선"
 RED_army_focus_2_desc: "옛 명언에서도 그러하듯, 군대가 잘 굴러가기 위해서는 그 이상의 보급이 준비되어있어야합니다. 보급 연결망을 효율적으로 편성하여 돌발상황에서도 차질이 없도록 대비해야합니다. "
 RED_army_focus_2_tt: "보급 효율: §G+10%§!"
 RED_army_focus_3: "병사평의회"
 RED_army_focus_3_desc: "군대와 같이 경직된 장소에서의 의사 전달은 대체로 유연하지 못한 경우가 존재합니다. 이런 문제를 해결하기 위해, 병사평의회를 설립하여 이들이 직접 작전을 계획하고 시행하도록 할 것입니다."
 RED_army_focus_3_tt: "최대 계획 변동치: §R-5.0%§!\n계획 수립 속도: §R-5.0%§!"
 RED_army_focus_4: "대군 운용"
 RED_army_focus_4_desc: "붉은겨울은 키보토스의 다른 학원과 다르게 대규모의 보병을 주력으로 운용합니다. 이를 효율적으로 운영하기 위해선 각 병과들의 매끄러운 협력이 필요할 것입니다."
 RED_army_focus_4_tt: "소속군 전장 너비: §G-10.0%§!"
 RED_army_focus_5: "중앙 통제"
 RED_army_focus_5_desc: "철저한 계획과 준비는 전쟁을 수행하는데 가장 좋은 방법입니다. 이를 효율적으로 이뤄내기 위해선 중앙의 통제가 확실하게 이뤄져야합니다."
 RED_army_focus_5_tt: "최대 계획 변동치: §G+10.0%§!"
 RED_army_focus_6: "민병대 전개"
 RED_army_focus_6_desc: "피폐한 전쟁속에서, 몇몇 인민들은 지역 공동체를 위해서 자원 입대하여 전장으로 향하고자 하는 열의를 불태울수도 있습니다. 군대는 이 애국자들을 훈련시켜 알맞은 전장으로 인도할 것입니다."
 RED_army_focus_6_tt: "헤일로 민병 방어: §G+5.00%§!"
 RED_army_focus_7: "민주집중제 원리"
 RED_army_focus_7_desc: "'민주적으로 결정을 구성하고, 결정된 사항에 복종한다.'\n\n어렵지 않습니다. 병사들은 토론과 투표로써 정해진 전쟁계획에 헌신적으로 복무할 것입니다."
 RED_army_focus_7_tt: "보병사단 방어: §G+5.00%§!"

 
#공군 중점
 RED_invest_only_one_mio: "현지 설계사에 투자"
 RED_invest_only_one_mio_desc: "대전이의 영향으로 키보토스에서 만들어진 항공기들의 대다수를 사용할 수 없게되었습니다. 현지 기업들에 투자한다면, 공군의 부재를 해결할 것입니다."
 RED_airforce_training_project: "공군 양성 프로젝트"
 RED_airforce_training_project_desc: "신세계의 환경은 우리 붉은겨울의 자연환경과 유사하나, 지리적인 면에서 차이를 보입니다. 현지 공군 장교들의 도움을 받아서 현지에 알맞은 공군을 양성해야 합니다."
 RED_redwinter_moustache_airport: "붉은겨울 수염 공항"
 RED_redwinter_moustache_airport_desc: "붉은 겨울 수염 항공은 붉은겨울의 상징 중 하나입니다.이곳을 재건한다면 붉은겨울의 명성을 드높일 수 있을 것입니다."
 RED_extend_air_bases: "공군 기지 확장"
 RED_extend_air_bases_desc: "잘 훈련된 조종사와 신식 항공기가 있더라도 공군기지가 없으면 원활한 비행을 하기 어렵습니다. 붉은 겨울의 우월한 토목 기술을 활용해 공군 기지 건설을 시작해야 합니다."
 RED_air_doctrine_focus: "공군 교리 확립"
 RED_air_doctrine_focus_desc: "붉은겨울의 상황에 맞는 공군 교리를 확립한다면 보다 효율적인 전술 교육이 가능해질 것입니다."
 RED_offensive_airforce: "충격과 공포"
 RED_offensive_airforce_desc: "최전선에 있는 적을 섬멸하는 것, 전선에 걸쳐 있는 물자 및 유류 보급선을 차단하는 것, 모여있는 전차 대열을 파괴하는 것을 넘어서, 과연 어떤 병기가 적의 본토 깊숙히 침투하여 전쟁을 수행할 수 있는 능력 자체를 꺾어버릴 수 있겠습니까? 폭격기, 오직 폭격기 뿐입니다."
 RED_defensive_airforce: "공중전의 우위"
 RED_defensive_airforce_desc: "제공권은 전투의 승패를 좌우하는 중요한 요건입니다. 군대의 물자와 보급, 인민들의 머리 위로 떨어지는 폭탄의 공포를 막기 위해서는 공중전에서 우위를 점해야 할 것입니다."
 RED_air_bomber: "폭격기 설계 집중"
 RED_air_bomber_desc: "폭격기의 중요성은 지난 여러 전투들을 통해서 증명되었으며, 신형 폭격기는 더 효율적이고 정밀한 폭격으로 적들의 기반 시설과 산업시설을 날려버릴 것입니다."
 RED_air_fighter: "전투기 설계 집중"
 RED_air_fighter_desc: "많은 수의 전투기는 상대와의 질적 차이를 무시하고 제공권을 잡을 수 있습니다. 붉은겨울의 노동력을 활용한다면 하늘을 붉은겨울의 전투기로 물들이는 것은 가능한 일일지도 모릅니다."
 RED_redwinter_airforce: "붉은겨울 항공대"
 RED_redwinter_airforce_desc: "공군 증강에 많은 관심을 기울인 덕분에, 신세계의 하늘에 완벽히 적응한 파일럿들, 키보토스에서 볼 수 없었던 유연한 교리와 신식 병기들로 무장한 항공기들로 이루어진 붉은겨울 항공대가 창설되었습니다. 이제 하늘 또한 우리의 영역으로 거듭나게 되었습니다."
 
#겨울대전 중점
 
 RED_revolution_war_focus_0: "반파시즘 성전"
 RED_revolution_war_focus_0_desc: "파시스트들의 침공이 시작되었습니다! 트리니티의 군대가 붉은겨울의 국경을 넘어 진군하고 있으며, 우리를 완전히 굴복시키기 전까지는 멈추지 않을 것입니다. 이 전쟁은 사회주의를 파괴하는 오는 파시스트 반혁명에 맞서는 성전이 될 것이며, 우린 어떠한 대가를 치르더라도 승리할 것입니다!"
 RED_revolution_war_focus_1: "전시 동원"
 RED_revolution_war_focus_1_desc: "우리 산업과 사회는 전쟁에 대비하기 위해 많은 준비를 해왔으니, 민간산업을 군수공장으로 전환하고 전선에 모든 물자를 신속하게 투입해야 합니다."
 RED_revolution_war_focus_2: "효율적인 교통"
 RED_revolution_war_focus_2_desc: "전시 상황에서 교통에 차질이 생긴다면 빠르게 물자를 수송하지 못합니다. 일부 대중들의 반대가 있을지라도, 효율적인 교통을 위해 군용 목적으로 교통수단을 징발하고 철도 공사를 시행하여 교통의 공백을 매꿔야 합니다."
 RED_revolution_war_focus_2_tt_1: "\n§Y$RED_improve_railway_network$§! 중점이 완료되어 있다면 §Y겨울군대§!가 강화됩니다."
 RED_revolution_war_focus_2_tt_2: "\n§Y$RED_improve_railway_network$§! 중점이 완료되어 있어서 §Y겨울군대§!가 강화됩니다:\n"
 RED_revolution_war_focus_3: "자립경제"
 RED_revolution_war_focus_3_desc: "붉은겨울은 과거부터 홀로 살아남기 위해 큰 노력을 해왔습니다. 이제 그 수많은 인민의 노력이 트리니티와의 전쟁에서 빛을 발할 때입니다."
 RED_revolution_war_focus_3_tt_1: "§Y$RED_synthetic_rubber$§! 중점이 완료되어 있다면 §Y합성 정제소§!를 얻습니다."
 RED_revolution_war_focus_3_tt_2: "§Y$RED_synthetic_rubber$§! 중점이 완료되어 있어서 §Y합성 정제소§!를 얻습니다:\n\n"
 RED_revolution_war_focus_4: "전선의 정치장교"
 RED_revolution_war_focus_4_desc: "전쟁의 공포와 참혹함 속에서 병사들의 정신은 피폐해집니다. 전선으로 급파된 정치장교들은 이들의 사기를 끌어올리고 조국을 수호하기 위해 나선 이들의 목적을 상기시킬 것입니다."
 RED_revolution_war_focus_5: "민중으로 이뤄진 방파제"
 RED_revolution_war_focus_5_desc: "붉은겨울이 트리니티와의 전쟁에서 살아남는 유일한 방법은 서로를 믿으며 연대하는 것입니다. '민중으로 이루어진 방파제'는 전쟁의 파도 속에서도 굳건할 것입니다!"
 RED_revolution_war_focus_6: "지역 학생 훈련소"
 RED_revolution_war_focus_6_desc: "파시스트들에게 맞서 조국을 지키기 위해 자발적으로 입대하겠다는 학생들이 폭발적으로 늘어나고 있습니다. 우린 이 자랑스러운 이들의 조국의 수호를 위한 열의를 받아들이고 각 지역에 훈련소를 확대할 것입니다."
 RED_revolution_war_focus_6_tt: "§Y기반시설§!이 §G5§! 이상인 주:\n"
 RED_revolution_war_focus_7: "가내수공업을 통한 소총 생산"
 RED_revolution_war_focus_7_desc: "붉은겨울에서 총은 펜보다 구하기 쉬우며, 모든 노동자와 학생들, 심지어 가정집의 주부들까지 총을 만들고 조립할 수 있습니다. 비록 신뢰도가 떨어지겠지만, 이들에게 총을 생산하도록 하여 전선의 장병들에게 보급해야 합니다."
 RED_revolution_war_focus_8: "대규모 동원"
 RED_revolution_war_focus_8_desc: "수많은 장병이 총을 매고 전선으로 투입되었지만, 트리니티는 더욱 깊숙이 우리의 영토로 진입하고 있습니다. 이를 저지하기 위해선 예비 전력까지 전선으로 동원하여 투입해야 합니다."
 RED_revolution_war_focus_8_tt_1: "\n§Y붉은겨울 급양부§!가 정부에 고용되어 있으면 더 많은 병력이 나타납니다."
 RED_revolution_war_focus_8_tt_2: "\n§Y붉은겨울 급양부§!가 정부에 고용되어 있어서 더 많은 병력이 나타납니다:\n\n"
 RED_revolution_war_focus_9: "점령지 봉기"
 RED_revolution_war_focus_9_desc: "적진 뒤에 은밀히 잠입한 병사들은 보이지 않는 싸움을 지속하고 있습니다. 이들은 파시스트 점령자들의 감시가 소홀해진 틈을 타서 노동자, 농민들과 함께 봉기하여 그들을 후방에 묶어놓을 것입니다."
 RED_revolution_war_focus_9.5: "기갑 저지 기술"
 RED_revolution_war_focus_9.5_desc: "트리니티의 주력군은 전차를 앞세운 교리인 전격전입니다. 이에 맞서 우린 대전차 병기를 연구하고 적극적으로 사용해야 합니다."
 RED_revolution_war_focus_9.5_tt_1: "\n§Y$RED_tank_destroyer$§! 중점이 완료되어 있다면 대전차포 사단이 주어질 것입니다."
 RED_revolution_war_focus_9.5_tt_2: "\n§Y$RED_tank_destroyer$§! 중점이 완료되어 있어서 대전차포 사단이 주어질 것입니다\n\n"
 RED_revolution_war_focus_10: "기동 방어"
 RED_revolution_war_focus_10_desc: "조국의 드넓은 영토를 모두 수비하는 것은 현실적으로 어렵습니다. 그렇지만 기동 전력을 운영하여 수세에 놓인 몇몇 지역에 적절히 선택과 집중을 가한다면 효율적인 방어가 가능할 것입니다. 우리의 전차와 차량은 국토 전역을 누비며 파시스트들의 공격에 맞서는 '날개달린 방패'가 될 것입니다."
 RED_revolution_war_focus_11: "산악 엽병"
 RED_revolution_war_focus_11_desc: "옘틀란드의 엽병들은 붉은겨울의 제일가는 사냥꾼들이며, 북풍과 씨름하며 야생동물들을 사냥하는, 그 자체로 최고의 저격수입니다. 이들은 트리니티와의 전쟁에서 붉은겨울을 위해 싸우기로 하였습니다."
 RED_revolution_war_focus_12: "화력에서의 우위"
 RED_revolution_war_focus_12_desc: "트리니티와 우리의 기술력 사이엔 많은 격차가 존재합니다. 그러나 적군이 얼마나 두꺼운 방탄복을 입고 있든 간에, 발밑에 떨어진 포탄이 터진다면 비명횡사할 것입니다. 우리에겐 비대칭전력이 많이 필요합니다."
 RED_revolution_war_focus_12_tt_1: "\n§Y$RED_artillery$§! 중점이 완료되어 있다면 로켓포 사단이 주어질 것입니다."
 RED_revolution_war_focus_12_tt_2: "\n§Y$RED_artillery$§! 중점이 완료되어 있어서 로켓포 사단이 주어질 것입니다:\n\n"
 RED_revolution_war_focus_12.5: "방공 전술"
 RED_revolution_war_focus_12.5_desc: "트리니티의 육군은 성공적으로 막아내고 있지만, 공군의 공격에 후방 작업장들이 파괴된다는 소식이 들려오고 있습니다. 공장을 지키기 위해서 방공 전술의 필요성이 대두되고 있습니다"
 RED_revolution_war_focus_12.5_tt_1: "\n§Y$RED_the_means_to_wage_war$§! 중점이 완료되어 있다면 대공포 사단이 주어질 것입니다."
 RED_revolution_war_focus_12.5_tt_2: "\n§Y$RED_the_means_to_wage_war$§! 중점이 완료되어 있어서 대공포 사단이 주어질 것입니다:\n\n"
 RED_revolution_war_focus_13: "모든 작업장 가동"
 RED_revolution_war_focus_13_desc: "전쟁은 전선에서만 하는 것이 아닙니다. 전국의 작업장에서는 남녀노소를 가리지 않고 전선의 아들과 딸, 아버지와 어머니를 위해 군수품을 생산하고 있습니다. 우린 노후화된 작업장까지 가동하여 전선의 장병들을 지원할 것입니다."
 RED_revolution_war_focus_13_tt: "§Y$RED_rearming_focus_1$§!와 그 이하의 완료된 중점들의 수만큼 §Y군수공장§!을 얻습니다:\n\n"
 RED_revolution_war_focus_14: "기갑 활용"
 RED_revolution_war_focus_14_desc: "상대 전차의 진격에 속도를 맞추기 위해선 기갑 병력의 존재가 요구됩니다. 기갑은 더 신속한 진격이 가능하며, 유사시 전선의 공백을 빠르게 대처할 수 있을 것입니다."
 RED_revolution_war_focus_15: "반격"
 RED_revolution_war_focus_15_desc: "트리니티군은 끝도 없이 쏟아져나오는 군대와 파르티잔의 봉기에 신음하며 그들의 이념적 결점으로 인해 저하되는 사기를 마주하고 있으며, 이들의 진격 속도는 눈에 띄게 줄어들고 있습니다. 이제 우리의 영토를 공격하여 파시스트들에게 폭력이 '어느 방향으로' 가해져야 정의로운지를 알려줄 시간입니다."
 RED_revolution_war_focus_16: "전국토 요새화"
 RED_revolution_war_focus_16_desc: "붉은겨울이 위치한 스칸디나비아 반도는 숲이 무성한 천혜의 요새입니다. 각지의 주요 거점에 진지를 쌓고 수성전에 돌입한다면 적들의 진격 속도를 크게 늦출 수 있을 것입니다."
 RED_revolution_war_focus_17: "파르티잔 전쟁"
 RED_revolution_war_focus_17_desc: "각지에 숨어든 파르티잔들은 후방에서 적군과의 소모전을 통해 보급부대를 습격하고 적국의 전쟁 피로도를 높이고 있습니다. 트리니티는 붉은겨울과 전쟁함과 동시에 후방의 파르티잔들과도 전쟁할 것입니다!"
 
 
