 tooltip_TRK_election_events_11_e: "실수이거나 아니면 처음 해보셔서 이렇게 되신 거겠죠? 저는 그렇게 믿고 싶습니다. 원하시는 후보를 당선시킬 사건을 발동시킬게요."
 tooltip_TRK_select_germany_party: "일부 사민당과 중앙당 인사들을 정치고문으로 영입할 수 있게 되었습니다. 추후 필요시 활용할 수 있을 것입니다."
