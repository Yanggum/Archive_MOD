 # 경제 중점
 TRK_trinity_capital_forced_dissolution: "트리니티 대자본 강제 해체"
 TRK_trinity_capital_forced_dissolution_desc: "트리니티 극단주의 정권의 탄생에 있어 트리니티계 대자본가와 독일 기업가들의 수많은 로비적 보조가 있었음은 명백하며, 트리니티 전쟁 기계를 지탱하는 데에 있어 수많은 대자본적 수탈이 있었음은 명백합니다. 두 번째 극단주의 정권의 탄생을 방지하기 위해서는, 독립적으로 정치적 힘을 행사하는 거대 기업들을 해체해야 합니다."
 TRK_currency_reform: "화폐 개혁"
 TRK_currency_reform_desc: "트리니티가 발행한 수많은 화폐는 전쟁과 그 과정에서 발행된 국채로 심각하게 신용이 훼손되었습니다. 우리는 단호하게 옛 화폐를 몰수하고 새 화폐를 발행하는 화폐 개혁을 추진해야 합니다."
 TRK_forced_labor_management_reconciliation: "노사 협조 강제"
 TRK_forced_labor_management_reconciliation_desc: "대자본이 대중의 의지보다 앞서 일방적으로 정치에 힘을 발휘하는것을 억제하기 위해, 노동자들의 기업 지도부 참여를 강제할 것입니다."
 TRK_strong_small_economy: "강소 경제"
 TRK_strong_small_economy_desc: "새로운 트리니티의 경제는 거대한 대기업이 아닌, 작지만 실속 있고 강력한 중소기업과 중견기업들로 채워질 것이며, 추후 극단주의의 탄생을 경제 구조적으로 억제하는 효과가 있을 것으로 예상됩니다."
 TRK_reversal_of_brain_drain: "두뇌 유출의 역전"
 TRK_reversal_of_brain_drain_desc: "트리니티 극단주의 정권 치하에서 수많은 재능 있는 자들과 과학자들이 해외로 망명해 나간 '두뇌 유출'을 역전시켜 다시 한번 트리니티의 혁신에 초청할 것입니다."
 TRK_prohibition_of_the_second_extremism: "두 번째 극단주의 탄생 방지"
 TRK_prohibition_of_the_second_extremism_desc: "전쟁 이후 피폐해진 거주지역과 도로들을 빠르게 보수하고, 새로운 주택가들을 값싸게 공급하는 일은 우리 정부에 대한 신뢰를 키우고 두 번째 극단주의가 태동하지 못하도록 방지할 수 있습니다."

 # ================================================
 # 3. 국민정신 (National Spirits)
 # ================================================
 TRK_economic_collapse_ns: "학원경제개발부의 잔재" 
 TRK_economic_collapse_ns_desc: "미소노 미카의 주도로 창설된 학원경제개발부는 트리니티 경제를 완전히 붕괴시켰습니다. 학원경제개발부가 해체되자 비대해진 학원이 직접 경영 기업들은 완전히 혼돈에 빠졌습니다. 그중 일부 독일계 기업들은 원래 소유주를 되찾거나 헐값에 재매입되었습니다. 하지만 아직도 상당수의 기업과 공장들이 구조조정을 필요로 하고 있습니다."
 TRK_gehenna_puppet: "게헨나 군정기"
 TRK_gehenna_puppet_desc: "우리는 게헨나와의 전쟁에서 패배하였으며, 군정이 트리니티 영토에 잔존하고 있습니다. 우리는 명목상으로만 독립국일 뿐입니다."

 TRK_industry_ns: "새로운 트리니티 산업"
 TRK_industry_ns_desc: "이전 조약기구의 설립 당시 논의대로, 트리니티의 경제에서 두 번 다시는 일방적으로 집중된 대자본이 정치를 휘두르지 못하도록 억제하는 분산화가 추진될 것입니다. 비대해진 대기업들을 도산시키거나 국영화하고 더 작은 경제 단위들로 분할하는 긴 작업에 착수했습니다."
 TRK_industry_ns_tt: "§Y$TRK_industry_ns$§! 변동치:"

 TRK_freedom_of_religion_ns: "종교의 자유"
 TRK_new_trinity_capitalism_ns: "새로운 트리니티 자본주의"
 TRK_academy_economic_committee_ns: "학원경제위원회"
 TRK_welfare_state_ns: "복지 학원"
 TRK_labor_union_ns: "노동조합"
 TRK_democratic_government_ns: "신생 민주주의 정부"
