 # ================================================
 # 4. 사건 (Events)
 # ================================================
 # 초기/일반 이벤트
 TRK_events.1.t: "[TRK.GetName]"
 TRK_events.1.desc: "먼지가 가라앉고 트리니티가 지배하던 곳에 새로운 통치자가 들어섰습니다. 누구도 부정할 수 없는 승자, 게헨나 학원입니다. 군정의 형태로 운영되고 있는 [TRK.GetName]은 명확한 목표를 가지고 있습니다. 게헨나-트리니티 전쟁으로 황폐화된 영토를 재건하는 것, 그리고 과거의 폭력적이고 억압적인 정권이 아닌 진정으로 자유로운 새로운 트리니티를 건설하는 것입니다. 물론 그 모든 것이 게헨나의 감시 아래라는 전제가 붙어 있지만 말입니다.\n\n현재 게헨나 군정은 임시 행정부에 강력한 압박을 가하고 있습니다. 입법부를 새롭게 선출하고 제헌의회를 개최하여 새로운 헌법을 개정하라는 것입니다. 나아가 민주적인 절차 아래에서 호스트를 선출하라고 요구하고 있습니다. 좋든 싫든 머지않아 새로운 헌법과 선거가 개최될 예정입니다. 트리니티의 운명은 이제 시민들의 손에 달려 있습니다."
 TRK_events.1.a: "알겠다."

 TRK_events.2.t: "트리니티의 선거 기간"
 TRK_events.2.desc: "헌법이 새롭게 개정되고 트리니티에 선거가 곧 개최될 예정입니다. 미소노 미카 이후 처음으로 열리는 자유 선거라는 점에서 크나큰 의미가 있는 선거입니다. 선거관리위원회에는 총 4명의 후보와 분파, 즉 정당이 등록되었습니다.\n\n첫 번째는 우라와 하나코를 중심으로 한 '트리니티의 학생 연합'이라는 이름을 가진 대중 분파입니다. 두 번째는 비극적인 암살 사건의 피해자라고 여겨졌지만 구호기사단과 무너진 상투스 분파를 재건해 다시 한 번 호스트 직을 노리는 유리조노 세이아입니다. 세 번째는 미소노 미카에게 감금되었지만 게헨나가 에덴으로 진군해 만마전과 선도부에 의해 감금에서 풀려났고 학생과 대중들에게 가장 큰 인기를 가지고 있는 영웅적인 서사를 가진 키리후지 나기사입니다. 마지막으로 파테르 분파의 앞잡이라는 경멸스러운 멸칭이 있지만 트리니티 기독교의 가장 큰 대리자인 시스터후드와 우타즈미 사쿠라코가 이번 선거에 나섭니다.\n\n트리니티의 선거는 호스트와 동시에 티파티 의석을 선출하는 방식으로 이루어집니다. 선거가 끝나면 결과에 상관없이 게헨나는 군정을 종료하고 권력을 민간 정부로 온전히 이양할 것이지만, 군정은 그럼에도 막강한 영향력을 유지할 것입니다. 트리니티의 주요 분파들은 열렬히 준비하며 임원을 채우고 자금을 모으고 조직과 사상을 재건하기 위해 노력하고 있습니다. 모든 직책을 동시에 선출하지 않는 일반적인 선거 주기와는 달리 이제는 티파티의 모든 의석이 걸린 [GetYear]년 선거가 얼마나 중요한지 모두가 잘 알고 있습니다."
 TRK_events.2.a: "민주주의가 실현됐다!"
 
 TRK_events.3.t: "독일인 참정권 문제"
 TRK_events.3.desc: "독일인 참정권은 오래전부터 꾸준히 나오던 문제였습니다. 미소노 미카 집권 시절에는 무척이나 제한적이지만 독일인에 대한 선거권이 보장되었습니다. 이 문제는 제한적인 선거권이 보장된 이후 조용하다가 패전 이후 현지 독일인들의 목소리가 커짐에 따라 다시 한 번 논의되기 시작했습니다.\n\n물론 독일인들의 참정권을 어디까지 보장해야 할지가 의문입니다. 미소노 미카처럼 제한적인 선거권과 피선거권을 보장할지 아니면 확실한 참정권 보장을 할지 등은 아직 선택 사항입니다. 물론 시간이 지난다면 어쩔 수 없이 참정권에 대해 논의해야 하고 미리 하는 것도 나쁘지는 않을 것입니다."
 TRK_events.3.a: "이건 나중에 논의하자."
 TRK_events.3.b: "헌법에 독일인 참정권을 명시하자."

 TRK_events.4.t: "페로로 종교?"
 TRK_events.4.desc: "엄숙한 예배당 안, 촛불 수백 개가 켜져 있고 장엄한 파이프 오르간 소리가 울려 퍼진다. 하지만 그들이 둘러싼 제단 한가운데에는 성모상이 아니라, '초대형 한정판 윙크하는 페로로님 인형(Ver. 카이텐저 콜라보)'이 놓여 있었다.\n\n로브를 쓴 학생들은 손에 성경 대신 야광봉(펜라이트)을 쥐고 있었고, 촛불은 페로로의 멍청하고 귀여운 얼굴을 밑에서부터 기괴하게 비추고 있었다.\n\n\"오오... 페로로 님... 당신의 혓바닥 놀림에 우리 영혼을 맡기나이다...\"\n\"이번 굿즈 추첨... 부디 '당선'의 은총을!\"\n\"페로! 페로! 페로!\"\n\n그때, 제단 뒤편에서 하얀 날개의 소녀가 식은땀을 흘리며 뒷걸음질 치고 있었다. 머리에는 억지로 씌워진 듯한 '대사제' 모자가 얹혀 있다.\n\n\"저, 저기요... 저는 그냥 한정판 굿즈 교환회라고 해서 왔는데요... 왜 분위기가 종교가 된 거죠?! 그리고 이 모자는 좀 벗겨주시면 안 될까요?!\"\n\n\"보라! 우리의 '파우스트' 님께서 페로로 신의 계시를 받으셨다!\"\n\"우오오오오!! 파우스트! 파우스트!\"\n\n\"아니라구요—!\"\n\n누군가의 신고로 정의실현부가 출동했다. 종교 단체는 간단한 수사를 받게 되었고, 압수 과정에서 예상치 못한 물품이 발견되었다. 놀랍게도 압수품 목록에는 페로로 인형 400개가 포함되어 있었다."
 TRK_events.4.a: "페로! 페로! 페로!"

 # 선거 이벤트 (Election Events)
 TRK_election_events.1.t: "우라와 하나코의 연설"
 TRK_election_events.1.desc: "\"아아, 마이크 테스트... 하나, 둘. 후훗, 여러분 안녕하세요. 우라와 하나코입니다. 지금껏 트리니티의 정치는 참 무거웠죠? 마치 몸에 맞지 않는 속옷 같이... 후훗,\"\n\n먼저 행동에 나선 것은 우라와 하나코였습니다. 지지 기반이 부실하다는 것은 그녀가 가장 잘 알고 있기에 처음부터 활발히 활동하며 자신의 존재를 알려야 한다는 전략을 세웠습니다.\n\n다행히도 전략은 잘 먹혀든 것 같습니다. SNS 등을 통해 우라와 하나코의 연설이 빠르게 퍼져나갔습니다."
 TRK_election_events.1.a: "시민들은 우라와 하나코의 연설에 열광했다!"
 TRK_election_events.1.b: "시민들은 음담패설에 거부감을 느꼈다."

 TRK_election_events.2.t: "상투스 분파와 구호기사단"
 TRK_election_events.2.desc: "상투스 분파는 유리조노 세이아의 암살 이후에 대분열을 겪었습니다. 미소노 미카 이후 유리조노 세이아와 그녀의 추종자들 그리고 구호기사단은 무너져가는 분파를 다시 일으켜 세우고 있습니다.\n\n구호기사단은 단장 아오모리 미네의 신념으로 정치와는 다소 거리를 유지해 왔으나 미소노 미카의 등장 그리고 게헨나와의 전쟁으로 정치에 대한 무관심이 이러한 사태를 불러왔다는 어느 정도의 책임감이 생겨났습니다. 이에 상투스 분파를 간접적으로 지원하는 선에서 정치에 어느 정도 영향력을 행사하고 있습니다.\n\n트리니티의 시민들은 주로 기존의 구호기사단의 선행 그리고 유리조노 세이아에 대한 동정 등으로 어느 정도 지지 기반이 형성되었습니다."
 TRK_election_events.2.a: "모범적인 전략이군!"

 TRK_election_events.3.t: "반게헨나 시위"
 TRK_election_events.3.desc: "게헨나에게 패배했다는 사실은 자연스럽게 트리니티 학생들에게 크나큰 충격으로 다가왔습니다. 게헨나 군정을 반대하는 시위가 자주 개최되었는데 이는 키리후지 나기사가 선거 유세를 위해 중앙구를 순방하고 연설하는 도중에도 이어졌습니다. 장소는 급격하게 소란스러워졌고 키리후지 나기사의 지지자들과 반게헨나 시위자들이 충돌했으며 곧바로 주먹다짐이 벌어졌습니다.\n\n키리후지 나기사는 이러한 상황에 다소 당황했지만 다시 가다듬고 연설을 시작했습니다."
 TRK_election_events.3.a: "키리후지 나기사는 카리스마로 상황을 진정시켰다."
 TRK_election_events.3.b: "키리후지 나기사는 상황을 진정시키지 못했다."

 TRK_election_events.4.t: "시스터후드의 구빈 활동"
 TRK_election_events.4.desc: "시스터후드는 대선에 출마했지만 그 근본은 기독교를 바탕으로 하는 교회 집단입니다. 당연하게도 이들은 항상 구빈 활동을 벌여왔습니다. 대선 기간에도 이들의 구빈 활동은 멈추지 않았는데 오히려 조금 더 늘어났을지도 모릅니다. 물론 이러한 구빈 활동이 문제가 되지 않는 것은 아닙니다. 구빈 활동으로 정치적 입지를 늘리려는 행위가 조금은 보이기 때문입니다. 우타즈미 사쿠라코는 구빈 활동이 기독교적 원리를 바탕으로 이루어지고 있기에 정치적으로 무관하다는 입장을 밝혔지만 그 속셈은 누구도 알지 못합니다."
 TRK_election_events.4.a: "그래 뭐, 자유니깐.."
 TRK_election_events.4.b: "구빈 활동을 잠시 제한하자."

 TRK_election_events.5.t: "독일 시민의 선택"
 TRK_election_events.5.desc: "독일인들에 대한 제한적이지만 참정권이 보장되고 개최되는 선거에서 독일인들의 마음은 어디로 향할까요? 적어도 파테르 분파와 미소노 미카에게 협력한 시스터후드에게는 향하지 않을 것입니다. 참정권이 보장되면서 출마자들은 현지 독일인들을 위한 정책을 홍보하고 있습니다. 우라와 하나코를 예시로 들자면 완전한 평등권을 주장하고 있습니다. 물론 소수자에 대한 보호도 빠지지 않고 있습니다. 이처럼 다른 분파들 또한 어느 정도 독일인을 위한 정책을 수립하고 있습니다."
 TRK_election_events.5.a: "독일인은 현지 정당을 선택 했다!"
 TRK_election_events.5.b: "학생 연합을 선택했다!"
 TRK_election_events.5.c: "상투스 분파를 선택했다!"
 TRK_election_events.5.d: "필리우스 분파를 선택했다!"

 TRK_election_events.6.t: "논란에 휩싸인 유리조노 세이아"
 TRK_election_events.6.desc: "유리조노 세이아와 구호기사단 사이의 거래가 미소노 미카의 집권에 크나큰 기여를 했다는 사실이 퍼지면서 상투스 분파와 구호기사단의 해명이 요구되고 있습니다. 이들은 유리조노 세이아가 거래를 하지 않고 자신의 복귀 모습을 보였다면 미소노 미카의 폭주를 막아낼 수 있었다는 결론에 이르렀습니다. 트리니티의 시민들은 이에 대한 해명을 강하게 요구하고 있습니다."
 TRK_election_events.6.a: "유리조노 세이아는 논란을 잠재웠다."
 TRK_election_events.6.b: "유리조노 세이아는 논란을 잠재우지 못했다."

 TRK_election_events.7.t: "학생 연합 열풍"
 TRK_election_events.7.desc: "기존의 티파티는 고지식하고 외부와는 단절되어 있었으며 학생들의 의지를 제대로 반영하지 못하였습니다. 그렇기에 공정성과 투명성 등을 내세우고 있는 우라와 하나코와 학생 연합에 트리니티 학생들이 자연스럽게 열광하게 되었습니다. 우라와 하나코 또한 이러한 이미지를 잘 활용하고 있는 것 같습니다. 특히 미소노 미카의 '대중주의'가 실패한 이후 학생들이 정치적인 의사 결정에 더 많은 관심을 보이고 자기 주장을 펼치는 등 트리니티 정치에 새로운 페이지가 열린 것처럼 보입니다."
 TRK_election_events.7.a: "흥미롭군."
 TRK_election_events.7.b: "행동을 방해할 방법을 찾아야 한다."

 TRK_election_events.8.t: "신앙으로 단결"
 TRK_election_events.8.desc: "시스터후드의 선거 운동은 '우리가 다시 자랑스러워할 수 있는 트리니티'라는 구호를 내걸고 있습니다. 파테르 분파가 뚫었던 지지층의 공백을 천천히 메우면서 시스터후드는 가파르게 성장하고 있습니다. 특히 기독교적 교리를 중요하게 강조하고 있는데 이는 일부 현지인들도 어느 정도 지지하게 되는 결과를 낳았습니다. 또한 시스터후드는 파테르 분파의 그림자에서 벗어나고 있는데 정치적 폭력과 불법 행위를 명백하게 반대하고 이를 실천하는 등 트리니티 학생들에게 외면받던 과거에서 천천히 회복하고 있습니다."
 TRK_election_events.8.a: "트리니티 보수주의의 새로운 형태?"

 TRK_election_events.9.t: "탕아"
 TRK_election_events.9.desc: "미소노 미카 집권 당시 다른 분파 임원들이 파테르 분파에 가입했으며, 여기에는 필리우스 분파 출신의 나가요시 스바루, 야마모토 나나 같은 임원들도 존재합니다. 이들은 다시 필리우스 분파로 복귀하기를 원하고 있으며 정치로 복귀하려는 이들이 대다수입니다. 미소노 미카 시절 범죄를 저질렀다면 조사와 재판을 받겠지만, 기회주의 성향으로 파테르 분파에 합류했다가 이제 다시 이전 분파로 합류하는 '탕아'를 어떻게 봐야 하는지가 필리우스 분파의 의논거리가 되었습니다."
 TRK_election_events.9.a: "복귀를 허락 해라."
 TRK_election_events.9.b: "타협은 없다."

 TRK_election_events.10.t: "선거 운동의 끝"
 TRK_election_events.10.desc: "곧 있으면 선거일입니다. 선거 유세도 이제 마무리 단계에 접어들고 있습니다. 각 후보들마다 장단점이 명확해 보이는 가운데 누가 가장 깔끔하게 마무리했을까요?"
 TRK_election_events.10.a: "학생 연합"
 TRK_election_events.10.b: "상투스 분파"
 TRK_election_events.10.c: "필리우스 분파"
 TRK_election_events.10.d: "시스터후드"

 TRK_election_events.11.t: "선거 결과!"
 TRK_election_events.11.desc: "치열한 선거 유세가 끝났고 선거 또한 마무리되었습니다. 각 후보들마다 각 상황실에서 개표 결과를 지켜보고 있는 가운데 트리니티의 모든 관심이 그곳으로 쏠렸습니다.\n\n트리니티의 다음 기수는 누가 될까요? 누가 되든 간에 굉장히 고난한 길이 기다리고 있을 것입니다. 미소노 미카가 남긴 유산은 트리니티를 병들게 했습니다. 이 공황을 치료하기 위해서는 수년 아니 그보다 더 오랜 시간이 걸릴지도 모릅니다. 그러나 그 어둠 속에서도 희망의 빛은 존재합니다. 트리니티 학생들은 소중한 자유를 되찾았습니다. 자신들의 손으로 직접 뽑은 지도자가 있고 제대로 작동하는 의회가 있으며 더 이상 불법과 폭력에 휘둘리지 않습니다. 이것이야말로 진정한 민주주의의 시작입니다.\n\n개표 결과가 곧 발표되는 가운데 모든 관심이 쏠리고 있습니다. 트리니티의 차기 호스트는 누가 될까요..?"
 TRK_election_events.11.a: "학생 연합의 우라와 하나코!"
 TRK_election_events.11.b: "상투스의 유리조노 세이아!"
 TRK_election_events.11.c: "필리우스의 키리후지 나기사!"
 TRK_election_events.11.d: "시스터후드의 우타즈미 사쿠라코!"
 TRK_election_events.11.e: "개발자의 메세지"

 TRK_election_events.12.t: "호스트 취임사"
 TRK_election_events.12.desc.hanako: "\"우후후, 설마 저 같은 아이를 직접 선택하실 줄이야… 트리니티의 호스트라니… 어머, 듣기만 해도 왠지 설레는 울림 아닌가요?\"\n\n우라와 하나코와 학생 연합이 다른 분파를 제치고 시민들의 선택을 받았습니다.\n\n우라와 하나코는 개혁적이고 진보적인 성향을 지닌 인물입니다. 그녀는 이전부터 트리니티의 구태에 깊은 불만을 품고 있었습니다. 미소노 미카의 집권으로 상황은 한계에 다다랐고, 결국 하나코는 트리니티를 떠나 잠적할 수밖에 없었습니다.\n\n그러나 전환점이 찾아왔습니다. 패전 이후 게헨나 학원의 군정이 시작되었고, 트리니티에도 선거가 열리게 되었습니다. 이 변화 속에서 하나코는 새로운 가능성을 발견했습니다. 트리니티 역시 달라질 수 있다는 희망을 품게 된 것입니다.\n\n이제 트리니티 학생들의 신뢰와 지지를 받아 호스트직을 맡게 된 그녀 앞에는 새로운 미래가 펼쳐집니다. 독사굴처럼 어둡고 답답했던 트리니티의 과거는 이제 역사 속으로 사라질 것입니다."
 TRK_election_events.12.a: "축하합니다! 우라와 하나코씨!"
 TRK_election_events.12.desc.seia: "\"여러분들이 저를 선택 했다는 건, 그만큼 저를 신뢰하기 때문이겠죠. 후후. 그 기대에 보답하도록 해보록 하죠.\"\n\n유리조노 세이아와 상투스 분파가 다른 분파를 제치고 시민들의 선택을 받았습니다.\n\n유리조노 세이아는 진보적이면서도 보수적인 면모를 동시에 지니고 있습니다. 그녀의 이념을 정확히 정의하기란 쉽지 않습니다. 하지만 한 가지는 분명합니다. 그녀가 개혁적이라는 사실만큼은 누구도 부정할 수 없습니다. 트리니티를 새롭게 변화시키기 위해 그녀는 남을 설득하고 타협할 것입니다. 필요하다면 강경하게 밀어붙이는 것도 주저하지 않을 것입니다.\n\n그녀가 건설하려는 트리니티는 과연 어떤 모습일까요? 감히 상상하기조차 어렵습니다. 그녀 특유의 사차원적인 면모가 국가 정책에도 반영될지 모릅니다. 그러나 확실한 것이 있습니다. 새로운 호스트가 선출되었고, 시민들은 그 선택에 만족하고 있다는 사실입니다.\n\n트리니티의 변화는 이제 시작되었습니다. 그 변화가 천천히 스며들 것인지, 아니면 급격하게 휘몰아칠 것인지는 아무도 알 수 없습니다."
 TRK_election_events.12.b: "축하합니다! 유리조노 세이아씨!"

 TRK_election_events.13.t: "£GFX_BA_star 3 선택 모집!"
 TRK_election_events.13.desc: "§B★3 선택권을 구매한 후 학생을 선택하세요.§!\n교환권 유효기간 전까지 선택 가능 학생 메뉴에서 학생을 선택해서 모집할 수 있습니다.\n£white_dot 이미 모집한 학생 선택 시 엘리그마와 해당 학생의 엘리프로 변환됩니다."
 TRK_election_events.13.a: "우라와 하나코"
 TRK_election_events.13.b: "유리조노 세이아"
 TRK_election_events.13.c: "키리후지 나기사"
 TRK_election_events.13.d: "우타즈미 사쿠라코"

 # 풍미 이벤트 (Flavor Events)
 TRK_flavor_events.1.t: "1936년의 잘못은 무엇이었을까?"
 TRK_flavor_events.1.desc: "전대미문의 대규모 사태, 유리조노 세이아 암살 미수 사건, 미소노 미카의 호스트직 선출, 제5차 트리니티 종합학원 헌법 개정 그리고 게헨나와의 전쟁까지 트리니티 종합학원의 불운은 미소노 미카로 시작했고 미소노 미카로 끝났습니다. 그러나 미소노 미카와 그 테러리스트들이 남긴 유산은 트리니티 전체를 병들게 했으며 더 이상 학생들은 티파티를 믿지 않고 불신하고 있습니다. 또한 잔존하는 파테르 분파 임원들의 저항은 학생들로 하여금 배후 세력이 있다거나 필리우스 분파와 상투스 분파가 우리를 방해했다거나 정의실현부가 충실하지 않았다는 등 허접한 음모론을 트리니티 전역에 퍼뜨리고 있습니다.\n\n그러나 우리는 다시 한 번 역사를 바로잡을 기회를 얻었습니다. 물론 스스로의 힘이 아닌 외부 세력의 감시 아래 만들어진 기회지만 말입니다. 그렇다고 우리가 현실에 안주해서는 안 됩니다. 비록 게헨나 군정의 감시 아래 있는 학원이지만 우리는 다시 한 번 미소노 미카와 같은 사례를 방지해야 합니다. 이는 선택이 아닌 시대가 내린 사명입니다."
 TRK_flavor_events.1.a: "\"마음 편히 있는 것도, 쉽지만은 않군요.\""
 
 TRK_flavor_events.2.t: "상투스 분파의 미래"
 TRK_flavor_events.2.desc: "유리조노 세이아가 깨어나고 유리조노 세이아의 주도로 상투스 분파는 재건을 거치고 있었습니다. 당을 재건하는 과정에서 유리조노 세이아와 그녀의 추종자들 그리고 일부 진보적 성향을 가진 임원들과 원로들까지 합류하면서 상투스 분파는 미소노 미카 이전의 모습을 다시 갖추고 있었습니다.\n\n유리조노 세이아 암살 미수 사건 이후 미래를 보는 눈이 닫힌 세이아는 예언 능력이 사라진 자신이 쓸모없다는 자격지심에 쫓기고 있었습니다. 하지만 분파를 재건하는 과정에서 원로들과 진보적인 임원들을 설득하고 직접 발로 뛰어다니면서 여러 사건들을 겪다 보니 다시 한 번 자존감을 되찾았고 이전의 염세적이고 비관적인 태도는 말끔하게 나았습니다.\n\n상투스 분파는 거대한 동맹을 얻게 되었는데 바로 아오모리 미네가 단장을 맡고 있는 구호기사단입니다. 아오모리 미네와의 거래는 둘 사이를 가깝게 하기에 충분했고 이제는 두 분파가 서로를 필요로 하게 되었습니다. 이 동맹이 영원하지는 않겠지만 당분간은 끈끈할 것입니다."
 TRK_flavor_events.2.a: "\"이렇듯, 모든 길은 하나로 이어지게 마련입니다.\""
 
 TRK_flavor_events.3.t: "우라와 하나코 재활동"
 TRK_flavor_events.3.desc: "미소노 미카가 정권을 잡은 뒤 더 이상 보이지 않던 그녀가 다시 한 번 모습을 드러냈습니다. 물론 그녀답게 새로운 노출 의상으로 등장했고 시모에 코하루가 제압하면서 다시 한 번 일상의 모습이 비춰졌습니다.\n\n그녀가 재활동을 하는 이유가 정확히 무엇일까요? 어느 정도 친분이 있던 시모에 코하루는 우라와 하나코에게 여러 번 물어봤음에도 확답은 없었습니다. 그러나 최근의 사건들을 조합한다면 어느 정도 결론이 보일지도 모릅니다. 그녀가 호스트의 자리를 노리는 것인지 아니면 다른 꿍꿍이가 있는 것인지 알 수 없습니다. 그녀는 원래 비상했기에 그 누구도 그 소녀의 마음을 제대로 알기는 어려워 보입니다."
 TRK_flavor_events.3.a: "진실한 바람"

 TRK_flavor_events.4.t: "시스터의 몸가짐"
 TRK_flavor_events.4.desc: "시스터후드. 그들을 설명하려면 어디서부터 해야 할까요? 현재 트리니티에서 가장 애매한 위치를 가진 분파를 찾으라면 가장 먼저 시스터후드가 떠오를 것입니다. 미소노 미카와 타협하고 티파티의 앞잡이가 된 시스터들은 이제 시민들과 트리니티 기독교를 믿는 이들로부터 경멸받고 있습니다.\n\n패전 이후에 시스터후드는 트리니티 기독교라는 막강한 세력을 등에 업고 아직은 그 건재함을 드러내고 있습니다. 그러나 그녀들이 할 수 있는 것은 무엇일까요? 이전으로 돌아가기에는 너무 먼 길을 왔습니다. 적어도 시스터후드의 이미지를 쇄신하기 위해서는 오랜 시간이 걸릴 것입니다."
 TRK_flavor_events.4.a: "...이라기엔, 저 스스로가 이미 죄악과 타협한 처지니까요."

 # 뉴스 이벤트 (News Events)
 TRK_news_events.1.t: "키리후지 나기사의 티파티 호스트 재집권"
 TRK_news_events.1.desc: "미소노 미카의 트리니티 파테르 정권이 게헨나의 침공으로 인하여 붕괴된 이후, 게헨나 군정은 키리후지 나기사를 새로운 지도자로 삼기로 결정했습니다. 나기사는 과거 트리니티와 게헨나의 평화 협정인 '에덴 조약'을 추진하는 등 게헨나 군정에 의해 '친 게헨나' 인사로 분류되었습니다.\n\n과거 티파티 호스트였던 키리후지 나기사는 미소노 미카에 의한 쿠데타 이후 지금까지 파테르 정권에 의하여 유폐되어 있었으나, 게헨나 군에 의하여 이번에 유폐 상태에서 해제되었습니다. 나기사는 게헨나 제복을 입고 참여한 취임식에서 '게헨나의 적, 파테르 분파의 말살'을 새 정권의 목표로 삼을 것이라고 말했습니다."
 TRK_news_events.1.a: "그녀에게 남은 것은 증오 뿐이다"
 TRK_news_events.1.b: "전형적인 꼭두각시 정권"

