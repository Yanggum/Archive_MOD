 # 결정 (Decisions) 및 카테고리
 TRK_election_campaign_cat: "트리니티 첫 번째 선거"
 TRK_election_campaign_cat_desc: "새로운 헌법이 개정되고 트리니티는 이후 호스트를 선출하기 위한 자유 선거를 실시하였습니다. 미소노 미카 이후 열리는 첫 번째 자유 선거라는 점에서 이 선거는 큰 의미를 가지고 있습니다. 이번 선거에서 황폐화된 트리니티의 대의민주주의가 바로잡힐 것입니다.\n\n현재, [TRK_election_potent]  ([?TRK_SU_var|C0], [?TRK_ST_var|O0], [?TRK_FI_var|Y0], [?TRK_SH_var|L0])"
 TRK_eden_collapse_decision_category: "에덴 관리기구의 붕괴"
 TRK_eden_collapse_decision_category_desc: "에덴 관리기구는 게헨나에 의한 트리니티 군정이었으나, 군정이 완료되기 이전 게헨나 정부가 완전히 붕괴하였습니다. 게헨나에 의한 트리니티 군정이 더 이상 유지될 수 없음이 분명해짐에 따라 에덴 관리기구에서 게헨나 관료들이 우리와 통합을 논의하고 있습니다. 그들의 중앙 정부가 붕괴한 이상, 그들이 우리에게 저항할 수 있는 가능성은 전혀 없습니다."
 TRK_eden_collapse_decision: "관할권 인수인계"
 TRK_eden_collapse_decision_desc: "군정으로부터 관할권을 넘겨받습니다. [TRK.GetLeader]가 조약을 맺을 것입니다."
 # 지도자 이력
 TRK_government_general_leader_desc: "게헨나-트리니티 전쟁이 트리니티의 패배로 끝나고 트리니티가 지배하던 영토는 게헨나 학원의 지배를 받고 있습니다. 게헨나 군정은 중앙구에 주둔하여 현지 협력자를 찾고 있습니다."
 KPD_thalman_joke_leader_desc: "§Y출생:§! §L1886년 4월 16일, 독일 제국 함부르크§!\n§Y이력:§! §L텔만을 거꾸로 하면 만텔 이게 뭘 의미하냐? 라는 질문은 사실 질문이면서 질문이 아니고, 의미를 찾는 시도이면서 동시에 의미라는 개념 자체를 슬쩍 옆으로 밀어두는 몸짓에 가깝다고 볼 수도 있고, 그렇게 보지 않아도 전혀 상관은 없지만 굳이 본다면 또 그렇게도 보일 수 있는 여지가 남아 있다는 점에서 이미 이 문장은 자기 역할을 다 했다고도 할 수 있다. 만텔이라는 단어는 텔만을 뒤집은 결과일 뿐인데, 뒤집는다는 행위 자체가 우리에게 무언가를 기대하게 만들고, 그 기대는 다시 생각을 낳고, 생각은 의미인 척하지만 사실은 그냥 생각일 뿐이라서, 여기서 더 나아가려 하면 할수록 우리는 애초에 어디로 가고 있었는지조차 흐릿해진다. 이쯤 되면 텔과 만, 앞과 뒤, 시작과 끝 같은 구분이 과연 필요한지에 대한 의문이 생길 수도 있지만, 그 의문 역시 깊이 파고들면 금세 다른 의문에게 자리를 내어주고, 그렇게 의문들은 서로 인사를 나누다가 아무 일도 없었다는 듯 흩어진다. 결국 남는 것은 단어의 잔상과 문장의 길이, 그리고 지금 이 글이 무언가 말하고 있는 것처럼 보이지만 실은 아무 말도 하지 않고 있다는 느낌 정도인데, 그마저도 느끼지 않아도 아무 문제가 없다는 점에서 꽤나 자유롭다고 할 수 있겠다. 그래서 텔만을 거꾸로 하면 만텔이라는 사실은 여전히 사실로 남아 있지만, 그 사실이 무엇을 의미하는지는 중요하지 않고, 중요하지 않다는 점이 또 은근히 중요한 것처럼 느껴지다가, 그런 느낌마저도 굳이 챙길 필요는 없다는 결론 아닌 결론에 도달하게 된다. 이렇게 말이 길어졌지만 주제는 여전히 어딘가를 피해 다니고 있고, 그걸 굳이 붙잡지 않아도 문장은 계속 이어질 수 있다는 점이 이 문장의 가장 확실한 특징일지도 모른다.§!"
