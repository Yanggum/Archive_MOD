 TRK_after_the_dust_settles_desc: "전쟁은 우리를 피폐하게 만들기에 충분했습니다. 경제 수치는 바닥을 뚫고 있고 민생은 파국을 맞이했습니다."
 TRK_new_constitution: "새헌법 작성"
 TRK_new_constitution_desc: "기존의 미소노 미카와 파테르 분파가 통과시킨 신 헌법은 너무나도 위험하고 다시 한 번 그녀와 같은 독재자가 나타나기 쉬운 구조입니다. 헌법을 무효화하고 진정으로 민주적인 헌법을 다시 작성해야 합니다."
