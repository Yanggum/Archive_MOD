 TR4_radaslau_astrouski_ns: "$BLR_radislau_astrouski$"
 TR4_radaslau_astrouski_ns_desc: "§Y출생:§! §L1887년 10월 25일, 러시아 제국 민스크 주§!\n§Y이력:§! §L라다슬라우 아스트로우스키는 지주 가문 출신으로 태어났습니다. 슬루츠크 학교에서 공부하던 그는 1905년 혁명에 가담했다는 이유로 퇴학당했습니다. 1908년 상트페테르부르크 대학교에 입학했으나 1911년 학생 폭동에 참여했다는 혐의로 체포되었습니다. 다행히 석방된 그는 대학에 복학하여 학업을 마쳤습니다.\n\n졸업 후 민스크에서 교사로 일하던 아스트로우스키는 1917년 10월 혁명을 목격했습니다. 그는 볼셰비키 정권에 반대하며 전벨라루스 의회 대표 자격으로 벨라루스 독립을 옹호했습니다. 이로 인해 적위대에 체포되었고, 이후에도 여러 차례 구금과 석방을 반복하며 투쟁을 이어갔습니다.\n\n트리니티와 [SOV.GetName] 간의 전쟁이 발발하자 그는 민족주의적 신념을 굳히고 트리니티와 협력하기 시작했습니다. 벨라루스 중앙 라다는 벨라루스 국민의 지지를 얻고 민족 고유의 정체성을 되찾기 위해 노력하고 있습니다. 제2차 전벨라루스 의회를 개최하여 벨로루시 소비에트 정권을 부정하고, 벨라루스 인민공화국의 정통 후계자임을 선언했습니다.§!"
 TRN_central_council: "벨라루스 중앙 라다"
 TRN_central_council_desc: "\n\n\n£GFX_TRN_banner_central_council\n\n\n\n\n벨라루스 중앙 라다(의회)는 트리니티가 현지 협력자들을 모집하여 설립했습니다. $BLR_radislau_astrouski$ 대통령을 중심으로 구성된 라다는 동북 신성통치령과 공존하는 특별한 체제를 갖추고 있습니다."