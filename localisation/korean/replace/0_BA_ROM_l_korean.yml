 #발칸 지배
 ROM_big_empire: "대루마니아 건설"
 ROM_big_empire_desc: "우리는 발칸 전역을 지배했을 뿐만 아니라, 이계인들을 굴복시키고 새로운 열강으로 떠오르고 있습니다."

 ROM_attack_ITA: "지중해 확보"
 ROM_attack_ITA_desc: "지중해는 매우 중요한 해역입니다. 상대는 만만치 않은 상대지만, 그것이 지중해를 포기할 이유가 되진 않습니다."

 ROM_secure_the_SHA: "오스트리아 확보"
 ROM_secure_the_SHA_desc: "미지의 적이 유럽을 엉망진창으로 만들었습니다. 우리는 위대한 성전의 첫 걸음으로 먼저 오스트리아를 해방할 것입니다."
 
 ROM_be_roma: "진정한 로마의 후계자"
 ROM_be_roma_desc: "우리의 국호는 로마인의 나라이며, 스스로를 로마인으로 일컫었습니다. 지금, 로마가 우리 손에 있습니다. 그 누가 우리가 로마의 후계자라는 걸 부정할 수 있겠습니까?!"


 # 파시즘
 ROM_appoint_TRM_friendly_government: "친파테르정부 임명"
 ROM_appoint_TRM_friendly_government_desc: "루마니아의 미래는 서부에 떠오르는 이계의 세력과의 좋은 관계에 달려있습니다. 우리는 이 현실을 이해하는 정부를 임명해야 합니다."




 #비동맹
 ROM_all_parties_must_continue: "모든 파티는 계속되어야만 한다"
 ROM_all_parties_must_continue_desc: "국왕의 입지를 굳히기 위해선, 파티를 계속해야만 합니다. 아무리 재정 상태가 힘들더라도 정치적인 움직임을 유지할 필요가 있습니다."