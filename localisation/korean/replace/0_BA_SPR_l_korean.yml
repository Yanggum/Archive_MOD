 ##국민정신 
 SPR_kivotos_bolshevism:0 "이계-볼셰비즘"
 SPR_kivotos_bolshevism_desc:0 "1935년의 '대전이' 사태는 스페인의 모든 것을 망쳐 놓았습니다. 그리고 키보토스라고 불리우는 이들은 모두 명백히 사회주의자 (아마도)임이 드러나면서, 스페인에서 오랫동안 썩어가던 사회라는 불안정한 건물은 이계-볼셰비즘이라는 굳건한 집단적인 광기가 뒷받침해 간신히 붕괴를 면한 기형적인 형태로 변화했습니다. 이 광기가 끝을 맺는 날은 오직 키보토스에 대항한 레콩키스타가 종료되는 날일 것입니다."
 SPR_catholic_revolution:0 "레볼루시온 카톨리카"
 SPR_catholic_revolution_desc:0 "공산주의 침략자들이 스페인을 집어삼키면서, 노동자들은 노동조합과 마르크스 대신 교회와 하나님을 믿기로 결정했습니다. 그 과정에서 일어난 일련의 국가 가톨릭 개혁은 레볼루시온 카톨리카로 통칭되며 구 사회주의 문화는 새로운 가톨릭 문화로 대체되고 있습니다."
