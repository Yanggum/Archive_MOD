 #시작 설명
 YUG_country_intro_header:0 "혼돈의 남슬라브인의 땅"
 YUG_country_intro_content:0 "유고슬라비아가 건국한 이래, 국가가 외부적으로나 내부적으로 평화로웠다고 말할 사람은 거의 없을 겁니다.\n남슬라브인의 결합이라는 명목아래에 세워진 국가인 유고슬라비아는, 남슬라브인의 땅이라는 그 이름과는 달리, 내부적으로 그 문제가 심했습니다.\n아름다운 색이라 할지라도, 물감들이 뒤섞이면 검은 빛이 되는 법입니다.\n크로아티아인, 슬로바니아인, 보스니아인, 몬테네그로인, 마케도니아인, 그리고 세르비아인까지, 민족 문제와 온갖 문제 덕에 유고슬라비아는 숨돌릴 틈도 없었습니다.\n마케도니아인과의 대립, 발흥하는 슬로베니아 민족주의, 크로아티아 극우조직 우스타샤의 활동까지, 유고슬라비아는 내부에서 불타오르고 있었습니다.\n1934년, 국왕 알렉산다르 1세가 암살당하고, 그의 형제였던 파블레 왕자가 겨우 11살이었던 페타르 2세 대신 섭정을 지냈습니다.\n파블레 왕자는 유고슬라비아라는 파이를 노리는 독일에 접근하여 왕국의 수명을 조금이나마 연장시키려고 했습니다.\n이계의 침략자가 나타나기 전까진 말입니다.\n갑작스레 나타난 이들은 독일과 프랑스를 무너뜨렸고, 그나마 버티고 있는 영국 역시 캐나다로의 망명을 준비하고 있습니다.\n이런 천재지변속에서 파블레 왕자는 당황할수 밖에 없었으나, 이내 군대를 오스트리아 였던 "산해경"의 국경지대로 배치했습니다.\n유고슬라비아는 다시금 전운이 감도는 세상에 내던져졌습니다.\n여전히 해결되지 않은 민족문제는, 유고슬라비아 민중들이 힘을 합쳐 침략자들에 맞설 힘을 잃게 만들고 있으며 외국에 의존적인 우리 경제는 영국과 프랑스 그리고 독일이 이계의 침략자에 의해 짓밟히자 무너져내리고 있습니다.\n이런 상황에서 파블레 왕자의 권위가 무너져 내리고 북방 국경에서는 난민이 몰아닥치면서 정치적 분쟁은 더욱 심해졌습니다.\n남슬라브인의 땅에겐 두 가지 미래만이 있을겁니다.온갖 질병에 시달린채 갈기갈기 찢어지거나, 아니면 끝내 위기를 극복하고 버텨내거나."
 YUG_guide:0 "- 유고슬라비아의 미래를 결정할 정치 체제를 확립하십시오.\n   - 섭정 의회\n      - 급진연합 강화(완성) \n      - 파시스트 총리 축출-의회 해산(제작 중, 플레이 가능) \n      - 파시스트 총리 축출-헌법 개정(제작 중, 플레이 불가) \n   - 공화국 건설\n      - 좌파 극단주의 배척(제작 중, 플레이 불가) \n      - 공산주의 정당 인정(완성)\n- 내부 민족간의 문제를 해결하십시오.\n- 이탈리아등의 외세로부터 유고슬라비아를 지켜내십시오.\n- 이세계의 사람들과 평화적으로 공존하거나 그들로부터 유럽인을 해방하십시오."

 #신중점

 YUG_Establishment_of_the_Republic:0 "공화국 건설"
 YUG_Establishment_of_the_Republic_desc:0 "파블레 왕자의 친독정치는 독일이 이계의 침략자에 의해 멸망하면서 끝났습니다. 이 혼란의 시기에서 우리의 길은 무능한 섭정과 어리고 미숙한 왕이 이끄는 왕국이 아니라 공화국 건설을 통한 전면적인 개혁이 될 것입니다."
 YUG_end_of_compromism:0 "타협 거절"
 YUG_end_of_compromism_desc:0 "온건파들은 아직도 대전쟁 때 처럼 왕실이 정상적으로 구실할 수 있다고 믿습니다. 대전쟁 이후 왕실은 폭정을 일삼고 국가의 분열을 초래하였으며 왕당파들이 민주주의에 대한 우리 이상에 동의할리도 만무한데도 말입니다. 더 이상 왕실과 그 주구와의 타협은 없습니다. 그 끝은 배신과 분열로 인한 파멸 뿐일 것이기에."
 YUG_recognize_the_soviet_union:0 "공산주의 정당 인정"
 YUG_recognize_the_soviet_union_desc:0 "유고슬라비아 공산주의자 동맹은 전후 정부에게 주요 위협으로 보였고, 정부는 그들을 강제 해산하였습니다. 하지만 그들은 우리의 공화국 이상에 동조하는 동맹이 될 수 있을 것이고 우리는 공화국 건설을 위하여 그들을 합법적인 정당으로 인정할 것입니다."
 YUG_Creating_anti_monarchy_sentiment:0 "반왕정 정서 조성"
 YUG_Creating_anti_monarchy_sentiment_desc:0 "국왕 독재 체제는 유고슬라비아의 정치적 발전을 수십 년간 가로막아 왔습니다. 다민족 국가를 통합한다는 명분 아래, 왕정은 반대파를 탄압하고 의회를 무력화했습니다. 우리는 반왕정 정서를 조직적으로 확산시켜, 군주제가 더 이상 유고 인민의 미래를 대표하지 못함을 폭로할 것입니다."
 YUG_popular_front:0 "인민전선"
 YUG_popular_front_desc:0 "유고슬라비아 공산주의자 동맹은 단순한 정당이 아닙니다. 그들은 우리가 갖추지 못한 지하 투쟁의 경험과, 공장과 광산 깊숙이 뿌리내린 노동자 세포 조직을 보유하고 있습니다. 반파시스트이자 반왕정의 기치를 내건 인민전선을 통해 그들과 연합한다면, 우리는 그들의 조직력과 투쟁 경험을 공유받고, 반체제 운동을 보다 효과적으로 확대할 수 있을 것입니다."
 YUG_underground_organization_integration:0 "지하 조직 통합"
 YUG_underground_organization_integration_desc:0 "우리의 대의에 동참한 정당과 단체들은 각기 지하 투쟁 조직을 보유하고 있습니다. 이제 이들을 단일한 지휘체계 아래 통합함으로써, 분산된 저항을 조직적이고 효과적인 투쟁으로 전환할 수 있을 것 입니다. 통일된 명령과 협조된 행동은 왕정과 파시스트 세력에 맞선 장기적인 저항을 가능하게 할 것입니다."
 YUG_Assassination_of_the_Regent:0 "섭정 암살"
 YUG_Assassination_of_the_Regent_desc:0 "마침내 그 날이 도래했습니다. 우리의 지하 저항 조직은 이미 전국 곳곳에 뿌리내려, 오직 신호만을 기다리고 있습니다. 유고슬라비아 인민들 사이에서 왕실에 대한 실망과 혐오는 극에 달했으며, 섭정 체제는 더 이상 통치의 정당성을 유지하지 못하고 있습니다. 이제 결단의 순간이 왔습니다. 섭정을 제거하고, 전국적 봉기를 통해 낡은 왕정 체제를 무너뜨릴 때입니다. 유고슬라비아의 미래는 오늘, 거리와 공장에서 결정될 것입니다."
 YUG_Establishment_of_the_Republic_Constitution:0 "공화국 헌법 제정"
 YUG_Establishment_of_the_Republic_Constitution_desc:0 "섭정의 제거와 전국적인 혁명 이후, 어린 국왕 페타르 2세는 더 이상의 통치를 포기할 수밖에 없었습니다. 이제 우리는 왕정을 공식적으로 폐지하고, 만민의 평등과 민주적 원칙에 기반한 공화국 헌법을 제정할 것입니다. 왕이 지배하던 유고슬라비아는 죽었습니다. 인민이 주권을 행사하는 새로운 국가가 이곳에서 탄생하고 있으며, 우리는 이 헌법을 통해 새로운 시대의 시작을 선언할 것입니다."
 YUG_anti_rightist_struggle:0 "반우파 투쟁"
 YUG_anti_rightist_struggle_desc:0 "공화국은 수립되었지만, 왕정을 지지하던 세력은 아직 완전히 사라지지 않았습니다. 그들은 반동적인 우익 세력을 형성하여 자본가, 성직자, 지주들과 결탁하고 있으며, 다른 우익 정치 세력에도 지속적으로 영향력을 행사하고 있습니다. 우리는 그들의 조직과 기반을 제거함으로써, 혁명의 성과를 지키고 공화국의 생존을 보장해야 합니다. 그 과정에서 '무고한 희생'이 발생할 가능성도 배제할 수 없지만, 혁명을 방치하는 대가는 그보다 훨씬 클 것입니다."
 YUG_Seeking_support_from_the_Soviet_Union:0 "소련의 지원 모색"
 YUG_Seeking_support_from_the_Soviet_Union_desc:0 "소련은 혁명 국가가 살아남기 위해 무엇이 필요한지 잘 알고 있습니다. 그들의 승인과 지원을 얻는다면, 우리는 내부 반동과 외부 압력에 맞설 수 있는 실질적인 힘을 확보할 수 있을 것입니다."
 YUG_Create_People_s_Army:0 "당군창설"
 YUG_Create_People_s_Army_desc:0 "유고슬라비아 공산주의자 동맹은 1920년 제헌의회에서 1/8이 넘는 의석을 획득하였으나 정부의 강제해산으로 인해 모든 의석을 상실한 전례가 있었습니다. 공화국이 세위진 다음에는 그런 일이 없을거라고 장담할 수 있을까요? 우리는 그런 일을 다시는 겪지 않기 위하여 통합된 지휘체계 하에 있는 지하 저항 조직에 침투하고, 지휘부를 장악하여 우리의 통제권을 강화하고 별도의 비밀 지휘체계를 지닌 당군을 새로이 창설할 것입니다."
 
 YUG_form_peasant_councils:0 "소작농위원회 설립"
 YUG_form_peasant_councils_desc:0 "평등한 공화국 건설을 위해선 지역 정치에서 소작농과 영세농들의 권력이 강해져야 합니다. 소작농위원회를 설립함으로써 우리의 공화국 이상에 동조하는 지지 세력을 확보하고 평등한 토지 소유를 보장할 수 있을 것입니다."
 
 YUG_Purge_Reactionist_in_Party:0 "당내 반대파 숙청"
 YUG_Purge_Reactionist_in_Party_desc:0 "현재 당내에는 우리의 이상을 반대하는 반대파가 있습니다. 반대파는 부하린주의자와 연계하여 현 지도부를 공격하고 당내 분열을 촉진하고 있으니 우리는 그들을 모스크바로 파견하여 당내 분열을 종식할 것입니다."
 YUG_workers_republic:0 "노동자 공화국"
 YUG_workers_republic_desc:0 "유고슬라비아 공산주의자 연맹의 정치적 영향력이 확대됨에 따라 의회 내 유고슬라비아 공산주의자 연맹의 의석이 과소 평가되었다는 여론이 더욱 커지고 있으며 노동자와 농민의 파업과 시위, 가두 투쟁이 전국적으로 진행되고 있습니다. 유고슬라비아 공산주의자 연맹은 당군인 파르티잔을 동원하여 전국의 통제권을 확보할 것입니다."
 YUG_With_Marshal_Tito:0 "티토 원수와 함께"
 YUG_With_Marshal_Tito_desc:0 "티토는 당과 당군의 지도자로서 우리의 정권 장악에 주도적인 역할을 함으로써 그의 지도력을 증명하였습니다. 우리는 그를 우리 공화국의 대통령으로 선출할 것입니다."
 YUG_federal_defense_council1:0 "연방방위위원회"
 YUG_federal_defense_council1_desc:0 "공화국의 군대는 세르비아계 장군들이 장악하고 있습니다. 우리는 연방 방위위원회를 설립함으로써 세르비아 장군참모들의 권한을 축소하고 평등한 진급과 더 다양한 전략을 확보할 수 있습니다."
 YUG_Peoples_Army_Reorganization:0 "당군 재조직"
 YUG_Peoples_Army_Reorganization_desc:0 "당군은 우리의 정권 장악에 큰 도움이 되었으나 서로 다른 지하조직을 얼기설기 엮어놓아 명령체계와 조직이 체계적이지 못하며 제대로 훈련받지 못한 자들이 많습니다. 우리는 당군을 재조직하여 효율적이고 훈련된 강한 군대로 만들어야 합니다."
 YUG_Partisan_War_Tactics:0 "파르티잔 전쟁"
 YUG_Partisan_War_Tactics_desc:0 "우리는 1920년대부터 지속적인 지하 투쟁 경험을 쌓아왔으며 유고슬라비아의 지형은 파르티잔 활동에 매우 적합합니다. 우리는 우리의 경험과 지형을 활용할 수 있는 교리를 만들어 침략자가 우리의 영토를 점령하더라도 저항할 수 있는 기반을 다져야 합니다."
 YUG_Last_of_Royal_family:0 "왕실의 최후"
 YUG_Last_of_Royal_family_desc:0 "무능한 카라조르제비치 왕조를 타도하고 유고슬라비아에 노동자 공화국을 세웠으니 우리는 그들의 거취를 결정해야 합니다."
 YUG_Brotherhood_And_Unity:0 "형제애와 단결"
 YUG_Brotherhood_And_Unity_desc:0 "형제애와 단결은 남슬라브 민족과 소수민족의 관계에 대한 공식 정책으로 모든 민족을 동등하게 대우하며 국가적 갈등과 증오를 극복하기 위하여 평화롭게 유사성과 상호 의존성을 장려합니다."
 YUG_Harmony_in_Religion:0 "종교 간의 화합"
 YUG_Harmony_in_Religion_desc:0 "남슬라브 민족들은 오랜 기간 외세의 지배를 받아 지배 국가의 종교를 받아들였습니다. 종교는 각 민족의 정체성에 지대한 영향을 미치고 있으며 우리가 종교를 섣불리 공격하면 우리 체제의 안정에 지대한 위협이 될 것입니다. 우리는 그들을 일방적으로 공격하기보단 종교 간의 대화를 촉진해 민족적 갈등을 줄여나갈 것입니다."
 YUG_state_atheism:0 "종교 재산 몰수"
 YUG_state_atheism_desc:0 "종교는 인민의 아편입니다. 유고슬라비아에서 종교는 민족 간의 갈등을 고조시키는 역할 외에는 아무 일도 하지 않기에 우리는 종교 재산을 몰수함으로써 국가 무신론 정책을 시작할 것입니다."
 YUG_Break_authoritarianism:0 "권위주의 탈피"
 YUG_Break_authoritarianism_desc:0 "권위주의는 당의 부패와 타락을 몰고 올 뿐입니다. 우리는 더 나은 당을 위해 권위주의를 버릴 것입니다."
 YUG_workers_self_management:0 "노동자 자주관리 제도"
 YUG_workers_self_management_desc:0 "유고슬라비아의 노동자 자주 관리는 티토와 에드바르트 카르델리의 이론에 따라 조직되었습니다. 노동자들은 자기 일터의 운영에 대한 권리를 가져서 자치적이고 민주적으로 일터를 운영합니다."
 YUG_Centralized_Economy:0 "경제 중앙화"
 YUG_Centralized_Economy_desc:0 "경제를 중앙화함으로써 효율적인 경제를 구성하고 당의 경제 권한을 강화할 수 있습니다."
 YUG_strengthening_of_the_central_party:0 "중앙당 강화"
 YUG_strengthening_of_the_central_party_desc:0 "중앙당에 역할과 권력을 집중함으로써 더 나은 행정과 안정을 도모할 수 있습니다."
 YUG_yugoslavia_expansion:0 "대유고슬라비아 연방공화국"
 YUG_yugoslavia_expansion_desc:0 "'대유고슬라비아 연방공화국안'은 현재 우리의 동맹국인 불가리아/알바니아 공화국을 유고슬라비아 연방공화국에 편입하는 안입니다. 각 공화국의 주도 민족의 반발이 없지는 않겠지만 많은 사람의 지지를 받는 계획이며 혁명의 수호를 위해 필요한 일입니다."
 YUG_balkan_federation:0 "발칸 사회주의 공화국 연방"
 YUG_balkan_federation_desc:0 "발칸 연방이란 개념은 19세기 후반에 등장하였으며 핵심 목표는 새로운 정치적 통합, 즉 국제주의, 사회주의, 사회적 연대, 경제적 평등을 바탕으로 발칸 반도를 통합하는 공동 연방 공화국을 구축하는 것입니다. 우리는 발칸 반도의 국가들의 혁명을 유도함으로써 이 계획을 실현할 수 있습니다."
 YUG_balkan_defense_training:0 "발칸 방위"
 YUG_balkan_defense_training_desc:0 "발칸 반도의 방위를 위해선 다른 국가의 군대들과 협력해야 합니다. 우리는 이를 위한 교리를 정립하고 다른 국가들과 나눌 것입니다."
 YUG_internationalism:0 "국제주의"
 YUG_internationalism_desc:0 "우리는 해방되었으나 세계에는 압제자에 의해 고통받는 노동자들이 아직 많습니다. 우리는 국제주의 원칙에 따라 그들의 해방과 투쟁을 지원하고 때때로 우리 군대를 파병함으로써 세계 노동자의 단결과 투쟁을 끌어낼 수 있습니다."
 YUG_industrial_integration:0 "통합 산업"
 YUG_industrial_integration_desc:0 "유고슬라비아와 불가리아, 알바니아의 산업을 통합함으로써 경제를 더 효율적으로 강화할 수 있습니다."
 YUG_eradication_of_nationalism:0 "'민족주의' 파괴"
 YUG_eradication_of_nationalism_desc:0 "민족주의란 압제자들의 도구일 뿐입니다. 그들은 민족이라는 허구의 개념을 이용하여 노동자들을 분열시키고 서로 싸우게 했습니다. 우리는 민족주의를 파괴하여 민족 간의 차별을 없앨 것입니다."
 YUG_equality_among_ethnic_groups:0 "민족간의 평등"
 YUG_equality_among_ethnic_groups_desc:0 "최근 불가리아와 알바니아가 연방에 편입되면서 각 공화국의 주요 민족들이 반발하고 있습니다. 우리는 민족 간의 평등을 강조하여 그들의 처우를 개선하고 반발을 없앨 것입니다."


 
 YUG_yugoslavian_nationalism:0 "유고슬라비아 민족주의"

 YUG_multinational_state:0 "다민족국가"

 YUG_constitutional_monarchy:0 "입헌군주국"
 YUG_constitutional_monarchy_desc:0 "우리는 개헌을 통하여 성립된 입헌군주정을 확립하기 위하여 전 총리 출신이자 최초의 비세르비아계 총리인 안톤 코로셰크를 총리로 하여 국내 대부분의 중도 정당이 참여한 대연정을 구성할 것입니다."

 YUG_Death_of_the_January_6th_Dictatorship:0 "1월 6일 체제의 죽음"
 YUG_Death_of_the_January_6th_Dictatorship_desc:0 "1월 6일 체제는 억압적이며 왕실에 대한 신뢰가 실추된 현 상황에서는 불안정만 일으킬 뿐입니다. 1월 6일 체제의 잔재를 치우고 새로운 유고슬라비아를 만들어야 합니다."
 YUG_Election_Law_Reform:0 "선거법 개정"
 YUG_Election_Law_Reform_desc:0 "현재의 선거법과 선거구는 특정 민족에게 유리하게 짜여 있습니다. 소수민족의 대표성을 확보하고 민족 간 평등을 위해 선거법을 개정하여야 합니다."
 YUG_Neutralize_the_Royal_Family:0 "왕실 상징화"
 YUG_Neutralize_the_Royal_Family_desc:0 "왕실에 대한 신뢰가 바닥을 치고 페타르 2세가 어린 지금 우리는 왕실을 상징적인 존재로 만들고 정치에 대한 개입을 못 하게 하여야 합니다."
 YUG_Establishment_of_an_Independent_Constitutional_Court:0 "독립적 헌법재판소 설립"
 YUG_Establishment_of_an_Independent_Constitutional_Court_desc:0 "독립적 헌법재판소 설립은 우리 국가의 안정에 필요합니다. 여타 정치적인 계산으로부터 독립적인 헌법재판소를 설립해야 합니다."
 YUG_Depoliticization_of_State_Institutions:0 "국가기관 탈정치화"
 YUG_Depoliticization_of_State_Institutions_desc:0 "현재 국가기관에는 전 총리에 의하여 임명된 극우적 사고를 지닌 공무원이 존재합니다. 또한 이전 전제군주정 시기에 임명된 무능력하고 반민주적인 공무원들에 의해 1935년에 부정선거가 발생하였으므로 그들을 해임하고 공무원들에게 탈정치화 교육을 하여야 합니다."
 YUG_Special_Committee_on_Eradication_of_Corruption:0 "반부패특별위원회"
 YUG_Special_Committee_on_Eradication_of_Corruption_desc:0 "전제군주정 시기에 만연했던 부패를 완전히 몰아내기 위해선 전권을 지닌 특별위원회를 수립하여 전수조사를 실시하여야 합니다."
 YUG_Farm_Support_Policy:0 "농가 지원 정책"
 YUG_Farm_Support_Policy_desc:0 "나라의 근본은 농사라 하였습니다. 전 세계적인 경기 침체로 농가가 고통받고 있으니 우리는 그들을 위해 보조금을 지급하여 농업을 증진하여야 합니다."
 YUG_Agricultural_Modernization:0 "농업 현대화"
 YUG_Agricultural_Modernization_desc:0 "농업 현대화는 우리의 숙명입니다. 트랙터를 도입하고 농촌에 전기를 연결해 농업 생산성을 즏대하여야합니다."
 YUG_Industrial_Subsidies:0 "산업 보조금"
 YUG_Industrial_Subsidies_desc:0 "농가의 피해가 지속되고 있으나 산업화가 선행되지 않으면 국가의 경제 또한 정체되고 말 것입니다. 산업에 보조금을 부여하여 산업 발전을 꾀하여야 합니다."
 YUG_Unemployment_Pension:0 "실업 연금"
 YUG_Unemployment_Pension_desc:0 "국내 실업률이 폭증하고 있습니다. 국민의 소비력을 유지하려면 실업 연금을 지급하여야 합니다."
 YUG_Partial_Removal_of_Press_Censorship:0 "언론 검열 부분적 중단"
 YUG_Partial_Removal_of_Press_Censorship_desc:0 "언론 검열은 장기적으로 중단되어야 하지만 현재 극단주의 세력이 불안정한 정세로 날뛰고 있으니, 부분적으로 중단하되 국가가 언론에 개입할 수 있는 여지를 남겨놔야 합니다."
 YUG_Wipe_Out_Fascist_Influence:0 "파시스트 영향력 일소"
 YUG_Wipe_Out_Fascist_Influence_desc:0 "우리가 유지 중인 언론 검열은 국내외의 파시스트 세력의 영향력을 일소하는 데 사용할 수 있습니다."
 YUG_Complete_Removal_of_Press_Censorship:0 "언론 검열 완전 중단"
 YUG_Complete_Removal_of_Press_Censorship_desc:0 "언론 검열을 완전히 중단함으로써 국내 개혁 여론을 수용하는 모습을 보여줄 수 있습니다."
 YUG_Limited_Allowance_of_Communist_Parties:0 "공산주의 정당 제한적 허용"
 YUG_Limited_Allowance_of_Communist_Parties_desc:0 "공산주의는 왕정과 상극이지만 우리는 그들의 규모로 인하여 그들을 인정해야만 합니다. 그들의 정당 활동을 제한적으로 허용하고 합법적인 영역 내에서 활동하게 합시다."
 YUG_Guaranteeing_Cultural_Autonomy:0 "문화 자치 보장"
 YUG_Guaranteeing_Cultural_Autonomy_desc:0 "우리는 국내의 민족들에게 문화적인 자치를 보장하여야 합니다. 학교에서 세르보크로아트어 외에 소수민족들의 언어를 교육하도록 허가하고 라디오 방송에서 각 민족의 언어로 방송할 수 있도록 합시다."
 YUG_Special_Committee_on_Religious_Harmony:0 "종교화합특별위원회"
 YUG_Special_Committee_on_Religious_Harmony_desc:0 "국내에는 많은 종교가 존재하며 대부분의 민족 문제는 종교에서 비롯됩니다. 종교 화합특별위원회를 설치하여 종교 문제를 전담하도록 합시다."
 YUG_Minority_Language_Coverage:0 "소수민족 언어 보장"
 YUG_Minority_Language_Coverage_desc:0 "소수민족의 언어를 그들이 밀집한 지역의 관공서에서 병용하도록 허가하여 소수민족의 권리를 보장합시다."
 YUG_Constitution_Reform:0 "헌법 개정"
 YUG_Constitution_Reform_desc:0 ""
 YUG_With_Socialist_Party:0 "사회주의당과 협상"
 YUG_With_Socialist_Party_desc:0 ""
 YUG_Anti_Extremism:0 "극단주의 배격"
 YUG_Antxi_Extremism_desc:0 ""
 YUG_With_Independent_Democratic_Party:0 "독립민주당과의 협상"
 YUG_With_Independent_Democratic_Party_desc:0 ""
 YUG_Strengthening_Welfare:0 "복지 강화"
 YUG_Strengthening_Welfare_desc:0 ""
 YUG_alliance_with_the_uk:0 "연합국 가입"
 YUG_alliance_with_the_uk_desc:0 ""
 YUG_alliance_with_france:0 "프랑스와의 동맹"
 YUG_alliance_with_france_desc:0 ""

 YUG_oust_the_fascists:0 "파시스트 총리 축출"
 YUG_oust_the_fascists_desc:0 "현재 유고슬라비아의 총리인 밀란 스토야디노비치는 자신의 권력을 악용하여 국가 공공부문의 자기 지지자들을 채워 넣었습니다. 또한 그는 당에서 지도자로 불리며 당군을 이끌고 있습니다. 그는 현 왕정 체제의 위협이 되므로 그를 총리에서 해임하고 다른 총리를 임명할 것입니다."
 YUG_Strengthening_Radical_Union:0 "급진연합 강화"
 YUG_Strengthening_Radical_Union_desc:0 "유고슬라비아 급진연합은 현재 우리나라의 총리인 밀란 스토야디노비치의 당입니다. 급진연합을 지원하여 섭정 의회의 권위를 바로 세움으로써 국가의 안정을 도모하고 총리의 파시즘 정책으로 이탈리아와의 관계 개선을 도모할 수 있습니다."
 YUG_regency_council:0 "섭정의 지배"
 YUG_regency_council_desc:0 "파블레 왕자는 유고슬라비아를 다스릴 능력이 있다는 것을 스스로 입증해 냈습니다. 여전히 어린 국왕을 뒤로하고 파블레 왕자와 섭정 의회는 유고슬라비아를 지켜나갈 것입니다."
 YUG_dissolution_of_parliament:0 "의회 해산"
 YUG_dissolution_of_parliament_desc:0 "유고슬라비아 의회는 총리이자 집권당인 급진연합의 당수 밀란 스토야디노비치가 그 권좌에서 축출당하며 그 권세를 잃었습니다. 불필요한 의회를 해산하고 전제군주정으로 돌아갈 때가 왔습니다."
 YUG_defender_of_all_yugoslavia:0 "전 유고슬라비아의 보호자"
 YUG_defender_of_all_yugoslavia_desc:0 "국왕은 모든 유고슬라비아인과 유고슬라비아 영토의 보호자입니다. 당연하게도 국왕은 이를 보호하기 위해 전권을 가집니다."
 YUG_Revial_of_the_January_6th_Dictatorship:0 "1월 6일 체제의 부활"
 YUG_Revial_of_the_January_6th_Dictatorship_desc:0 "1월 6일 체제를 부활시켜 전제군주정으로 돌아가는 것이 우리가 맞이한 위기를 극복하는 데 도움이 될 것입니다."
 YUG_Iron_Fist:0 "철권"
 YUG_Iron_Fist_desc:0 "전제군주정 도입에 반대하는 자들은 국왕의 철권 앞에서 무릎 꿇을 것입니다."
 YUG_Kings_Chetniks:0 "왕의 체트니크"
 YUG_Kings_Chetniks_desc:0 "체트니크는 세르비아 왕국 시절부터 언제나 국가와 왕실에 충성스러운 종복이었습니다. 그들을 공인하고 국가 체계에 통합하여 왕실의 손발로 사용할 수 있을 것입니다."
 YUG_strengthening_of_parliamentary_powers:0 "의회 강화"

 YUG_pledge_of_allegiance:0 "충성 서약"

 YUG_Kings_Goverment:0 "왕의 정부"

 YUG_Rewards_For_Loyalty:0 "충성하는 자에게 보상을"

 YUG_Economic_Centralization:0 "경제 중앙화"

 YUG_Capitalist_Support:0 "자본가 지원"

 YUG_Capitalist_Suppression:0 "자본가 억제"

 YUG_Acquire_Deliverables:0 "성과 취득"

 YUG_Industrial_Management:0 "산업 관리"

 YUG_State_Capitalism:0 "국가 자본주의"

 YUG_Agricultural_Subsidy:0 "농업 보조금"

 YUG_Mining_Mechanization:0 "광업 기계화"

 YUG_duce_of_yugoslavia:0 "유고슬라비아의 두체"
 YUG_duce_of_yugoslavia_desc:0 "밀란 스토야디노비치는 급진 연합에서 '지도자(Vođa)'로 불립니다. 우리는 그가 이탈리아의 두체와 같이 새로운 유고슬라비아를 강력하게 만들어 줄 것이라고 믿습니다."
 YUG_yugoslav_nationalism:0 "유고슬라비아 민족"
 YUG_yugoslav_nationalism_desc:0 "유고슬라비아 민족은 본래 세르비아, 크로아티아 등의 유럽 남부 특히 발칸 반도에 사는 슬라브 민족을 통틀어 말하는 단어였습니다. 이제 유고슬라비아 민족이라는 단어는 유고슬라비아인 그 자체를 뜻하는 단어가 될 것입니다."
 YUG_serbian_nationalism:0 "세르비아 민족"
 YUG_serbian_nationalism_desc:0 "유고슬라비아 왕국의 민족 중 가장 많은 것은 세르비아 민족입니다. 유고슬라비아에서 가장 많은 권리를 가진 민족도 세르비아 민족이 되어야 합니다."
 YUG_support_for_chekhnite:0 "체트니크 재조직"
 YUG_support_for_chekhnite_desc:0 "체트니크는 세르비아 왕국 시절에 창설된 왕당파 민병대로 그 기원은 오스만 제국에 항거한 저항 운동까지 거슬러 올라갑니다. 그들은 대전쟁에서 의용군으로서 세르비아군을 보조하기도 하였습니다. 우리는 그들을 우리 이념에 맞게 재조직하여 이용할 수 있습니다."
 YUG_state_cooperativeism:0 "국가조합주의"
 YUG_state_cooperativeism_desc:0 "국가조합주의는 계급 간 협조를 강조하며 국가가 경제를 통제합니다. 국가조합주의는 우리 경제를 위한 선택입니다."
 YUG_ORJUNA_reunion:0 "유고슬라비아 민족주의자 조직 재설립"
 YUG_ORJUNA_reunion_desc:0 "유고슬라비아 민족주의자 조직은 1921년에 세르비아, 크로아티아, 슬로베니아 왕국에서 설립된 원류 파시스트, 반공주의를 주요 이념으로 하는 유고슬라비아 민족주의 단체입니다. 이들은 단일 유고슬라비아 민족주의를 지지하며 크로아티아, 슬로베니아 분리주의자들을 효과적으로 탄압해 왔으나 1929년의 전제군주정으로 해체되었습니다. 우리가 이 조직을 부활시켜 국가와 당의 도구로 삼는다면 효과적으로 분리주의자 세력을 억제할 수 있을 것입니다."
 YUG_border_retreat:0 "국경 후퇴"
 YUG_border_retreat_desc:0 "유고슬라비아 내 민족주의 문제와 이탈리아의 영유권 주장을 한 번에 해결할 완벽한 해결책을 찾아내었습니다."

 YUG_evolution2:0 "진화"
 YUG_evolution2_desc:0 "우리는 외세의 위협에 대응하기 위해 더 강한 국가를 가져야 합니다. 이제 우리나라의 분열이 해결된 진화된 유고슬라비아를 만들 때입니다."
 YUG_power_strengthening:0 "권력 강화"
 YUG_power_strengthening_desc:0 "우리는 군부에 대한 통제를 확고히 함으로써 우리의 권력을 강화할 것입니다."
 YUG_moschettieri_del_duce:0 "민병대 강화"
 YUG_moschettieri_del_duce_desc:0 "우리 정권을 위해 싸우는 민병대를 강화하여 우리 정권의 통치를 확고히 해야 합니다."
 YUG_deposition_of_the_king:0 "국왕 폐위"
 YUG_deposition_of_the_king_desc:0 "부패한 왕실은 오랫동안 권력을 독점하며 우리나라의 부를 갈취하고 민중들을 노예로 부려왔습니다. 이제 우리는 그들을 권좌에서 끌어내리고 새로운 유고슬라비아로 나아갈 것입니다."
 YUG_symbol_of_the_nation:0 "민족의 상징"
 YUG_symbol_of_the_nation_desc:0 "왕실은 유고슬라비아의 상징이며 유고슬라브인의 상징이자 우리 군대의 상징입니다. 그들을 몰아내는 것은 큰 반발을 불러일으킬 것이며 우리 정권의 정당성을 부정하는 행위가 될 수 있습니다. 우리는 그들을 우리의 상징으로 계속 남겨놓을 것입니다."
 YUG_disintegration_of_yugoslavia:0 "유고슬라비아 해체"
 YUG_disintegration_of_yugoslavia_desc:0 "유고슬라비아는 인위적이고 모순적인 집합체일 뿐입니다. 우리는 유고슬라비아를 해체할 것입니다."
 YUG_greater_serbia:0 "대세르비아"
 YUG_greater_serbia_desc:0 "유고슬라비아라는 허황한 꿈을 버리고 우리는 새로운 국가로 재설립될 필요가 있습니다. 유고슬라비아는 누가 뭐라고 해도 결국 세르비아 민족의 국가이며 앞으로도 그럴 것입니다."
 YUG_serbian_imperialism:0 "세르비아 제국주의"
 YUG_serbian_imperialism_desc:0 "세르비아는 여기서 더 커져야 합니다. 세르비아 민족의 안락한 생활을 위해선 더 넓은 땅, 더 많은 자원, 그리고 더 많은 희생이 필요합니다."
 YUG_greater_serbian_defense_force:0 "세르비아 방위군"
 YUG_greater_serbian_defense_force_desc:0 "우리는 세르비아를 지키기 위해서 더욱 크고 강한 군대가 필요합니다. 새로운 조국을 위한 새로운 군대를 만들 것입니다."
 YUG_seeking_alliance_with_italy:0 "이탈리아와 친선"

 YUG_invasion_of_BUL:0 "불가리아 침공"
 YUG_invasion_of_BUL_desc:0 "불가리아는 우리 영토인 마케도니아를 호시탐탐 노리고 있습니다. 또한 불가리아에는 우리가 필요한 땅과 자원이 있으니, 우리가 불가리아를 선제 침공하여 국가의 안정을 도모하여야 합니다."
 YUG_invasion_of_ALB:0 "알바니아 침공"
 YUG_invasion_of_ALB_desc:0 "알바니아에서는 석유가 채굴됩니다. 우리는 석유가 필요하고 알바니아는 석유가 있으니 우린 알바니아를 침공해야 합니다."
 YUG_invasion_of_HUN:0 "헝가리 침공"
 YUG_invasion_of_HUN_desc:0 "헝가리는 다뉴브강이 흐르는 곡창지대가 있고 임업을 위한 숲이 있습니다. 또한 다량의 보크사이트가 매장돼 있는 것으로 알려져 있습니다. 우리는 그들을 침공해 자원을 확보할 것입니다."
 YUG_invasion_of_ROM:0 "루마니아 침공"
 YUG_invasion_of_ROM_desc:0 "루마니아의 플로이에슈티 유전은 유럽 최대의 유전입니다. 또한 다뉴브강을 따라 큰 농지가 있으니 우리는 루마니아를 확보하여 세르비아인의 행복을 확보할 것입니다."
 YUG_invasion_of_GRE:0 "그리스 침공"
 YUG_invasion_of_GRE_desc:0 "그리스는 다양한 자원이 많습니다. 또한 그들의 섬들은 우리가 지중해로 뻗어나가기 위한 발판이 되어줄 것입니다. 우리는 그리스를 확보할 것입니다."
 YUG_invasion_of_TUR:0 "중동 평정"
 YUG_invasion_of_TUR_desc:0 "터키는 우리를 노예로 부린 오스만 제국의 후예이고 그 너머에는 많은 석유가 나는 중동이 있습니다. 우리는 터키와 중동 국가를 공격해 우리 민족의 복수를 하고 그들에게서 우리의 삶을 위한 자원을 확보할 것입니다."
 YUG_oath_of_loyalty:0 "충성 서약"
 YUG_oath_of_loyalty_desc:0 "우리는 국제정치 속 우리의 위치를 제대로 인식하여야 합니다. 북쪽에는 적대적인 이세계의 침략자들이 동쪽에는 발칸반도의 지배권을 노리는 소련이 서쪽에는 우리나라에서 영토를 받아 간 이탈리아가 있습니다. 옛 동맹국들은 이제 힘이 없으니 우호적인 이탈리아에 충성을 맹세하는 것이 우리의 가치를 가장 높이 평가받을 방법입니다."
 YUG_strengthening_of_syndicalist_economy:0 "조합주의 경제 발전"
 YUG_strengthening_of_syndicalist_economy_desc:0 "조합주의 경제가 우리나라에 성공적으로 정착되었으니 이제 과실을 얻을 때입니다. 조합주의 경제를 더 발전시켜 우리나라 경제를 강화힙시다."
 YUG_strengthening_production_plans:0 "발칸의 무기 공장"
 YUG_strengthening_production_plans_desc:0 "우리나라는 이탈리아의 발칸을 향한 창끝이 되어 이탈리아군을 보조할 수 있는 물자가 필요합니다. 우리가 발칸의 무기 공장이 되어 이탈리아와 우리나라 군을 위한 물자를 생산합시다."
 YUG_resource_production:0 "자원 생산"
 YUG_resource_production_desc:0 "우리나라에는 꽤 많은 자원이 매장되어 있습니다. 그 자원들을 채굴하여 시장에 공급하여야 합니다."
 YUG_self_sufficient_economy:0 "국제적인 위협"
 YUG_self_sufficient_economy_desc:0 "국제적인 위협에 대응하기 위하여 더 효율적인 경제와 더 많은 장교가 필요합니다. 우리는 효율적인 국가를 만들 것입니다."

 YUG_Gauge_Standardization:0 "궤간 표준화"
 YUG_Gauge_Standardization_desc:0 "여러 궤간이 혼재된 철도망은 제구실을 할 수 없습니다. 국내 철도 궤간을 표준화해야 합니다."
 YUG_improve_light_industry:0 "자동차 사업 지원"
 YUG_improve_light_industry_desc:0 "자동차 사업을 지원하여 국내 물류 상황을 개선하고 향후 다가올 전쟁에 사용할 차량을 확보할 수 있습니다."
 YUG_Improve_Heavy_Industry:0 "중공업 증진"
 YUG_Improve_Heavy_Industry_desc:0 "국가를 지키기 위해선 충분한 양의 무기가 필요합니다. 중공업을 증진하여 향후 군수 산업에 사용할 수 있는 기반을 마련할 수 있습니다."
 YUG_Rural_Electrification:0 "농촌 개발"
 YUG_Rural_Electrification_desc:0 "우리는 각지의 농촌을 개발하여 우리의 식량안보를 확보하여야 합니다. 농촌을 전력화하고 트랙터와 트럭과 같은 차들이 이용할 수 있는 길을 닦아 농업 생산량을 증대할 수 있습니다."
 YUG_Serbian_Urbanization:0 "세르비아 도시화"
 YUG_Serbian_Urbanization_desc:0 "세르비아는 옛 오스만 제국의 긴 지배로 북부 지역에 비해 산업화와 도시화가 다소 지연되었습니다. 세르비아의 도시화는 우리의 최우선 목표가 되어야 합니다."
 YUG_Northen_Urbanization:0 "북부 도시화"
 YUG_Northen_Urbanization_desc:0 "슬로베니아와 크로아티아 지방은 오스트리아와 헝가리의 지배하에 어느 정도 산업화와 도시화를 이루었으나 유럽의 다른 도시들에 비해서는 부족합니다. 북부의 도시화를 가속하여 산업 노동자들을 확보하여야 합니다."
 YUG_Bosnia_Urbanization:0 "보스니아 도시화"
 YUG_Bosnia_Urbanization_desc:0 "보스니아 지방은 그 거친 지형으로 인하여 도시화와 산업화가 지연되고 있습니다. 국가 경제를 위하여 보스니아의 도시화는 필수 불가결인 사항이므로 보스니아에 투자하여야 합니다."
 YUG_Sourthen_Urbanization:0 "남부 도시화"
 YUG_Sourthen_Urbanization_desc:0 "몬테네그로, 마케도니아, 코소보 지역을 비롯한 남부 지방은 오랜 오스만 제국 통치의 영향에서 아직 벗어나지 못하고 있습니다. 지역의 산업과 도시들은 낙후된 채 오랜 기간 방치되었고 토지 사용은 비효율적입니다.\n우리는 남부지방을 도시화하여야 합니다."
 YUG_Expand_Shipyards:0 "조선소 확장"
 YUG_Expand_Shipyards_desc:0 "우리는 아드리아해에 인접해 있으며 이탈리아를 비롯한 열강들은 우리를 노리고 있습니다. 추후 이탈리아나 다른 열강들의 해상 봉쇄를 돌파하고 침공에 저항하기 위해선 전함과 수송선을 건조할 조선소가 필요합니다."
 YUG_Construction_Improvements:0 "건설 개선"
 YUG_Construction_Improvements_desc:0 "집 없이는 사람이 살아갈 수 없고 공장 없이는 필요한 물건을 생산할 수 없습니다. 우리 국가의 건설 역량을 개선하여야 이 난국에서 살아남을 수 있습니다."
 YUG_Morava_Ironworks:0 "모라바 제철소"
 YUG_Morava_Ironworks_desc:0 "모라바강 유역에는 다양한 자원들이 생산되는 광산들이 있습니다. 우리는 이 광산들의 잠재력을 이용하기 위해서 제철소를 지어 자원을 정제해야 합니다."
 YUG_Improved_Productivity:0 "생산성 개선"
 YUG_Improved_Productivity_desc:0 "우리 국가의 건설 역량이 개선되어 수많은 공장이 건설될 수 있었으나 \n 생산성은 다른 선진 공업국보다는 발끝에 닫지도 못하였습니다. \n 우리는 우리의 공장들을 더 효율적으로 사용할 수 있도록 \n 공장들의 생산성을 개선하여야 할 것입니다."
 
 YUG_War_Against_Italy:0 "이탈리아에 대한 전쟁"
 YUG_War_Against_Italy_desc:0 "결국 이탈리아에 대한 전쟁은 피할 수 없었습니다. 전쟁이 일어난 이상 우린 끝까지 싸워야 합니다. 타협도 항복도 없습니다. 그 길의 끝은 노예가 될 뿐이기에."
 YUG_National_Emergency_Declaration:0 "국가 비상사태 선언"
 YUG_National_Emergency_Declaration_desc:0 "이탈리아와의 전쟁은 우리 국가와 국민의 생존이 달린 일입니다. 즉시 국가 비상사태를 선언하고 전국민의 단결을 호소해야합니다."
 YUG_Hold_the_Line:0 "전선을 지켜라!"
 YUG_Hold_the_Line_desc:0 "이탈리아군은 지금도 우리 영토로 밀어닥치고 있습니다. 언제까지고 밀려날 순 없습니다. 대전쟁 때 베오그라드 공방전에서 오스트리아-헝가리군의 교두보에 필사적인 돌격을 감행했던 드라구틴 가브릴로비치와 병사들의 정신을 기억합시다. 우리는 전선을 마지막 숨이 다할 때까지 지켜낼 것입니다."
 YUG_urgent_mobilization:0 "긴급동원령"
 YUG_urgent_mobilization_desc:0 "전선은 끊임없이 병력을 소모하고 있습니다. 사망자와 부상자를 보충하고, 지친 부대에 최소한의 휴식을 제공하기 위해선 우리는 병력 부족 문제를 해결해야 합니다. 이 상황을 극복하기 위해서는 부분적인 조치로는 충분하지 않습니다. 우리는 동원 가능한 모든 인적 자원을 소집하여, 최대한의 병력을 전선으로 투입해야 합니다."
 YUG_Short_term_production_increase:0 "단기적 생산 증대"
 YUG_Short_term_production_increase_desc:0 "전쟁은 수많은 물자를 단숨에 집어삼키고 있습니다. 전선의 병사들은 총, 포, 무전기, 붕대, 탄약, 기타 수많은 물자들 없이는 제대로된 전투를 할 수 없을 것입니다. 우리는 후방전선을 다시 규합하고 재조직하여 단기적인 생산 증대를 노릴 것 입니다."
 YUG_One_Gun_One_Man:0 "한 사람당 한 정의 총을"
 YUG_One_Gun_One_Man_desc:0 "대대적인 동원을 통하여 병력을 보충할 수 있었으나 총 없이는 전선에서 제 구실을 못할 것입니다. 우리는 총 생산을 증대하여 적어도 한 사람당 한 정의 총이 보급될 수 있도록 해야합니다."
 YUG_Scavenging_the_Legacy_of_the_Great_War:0 "대전쟁의 유산 뒤지기"
 YUG_Scavenging_the_Legacy_of_the_Great_War_desc:0 "군수 물자는 언제나 부족합니다. 우리는 대전쟁 때 사용하고 남은 잉여 물자를 쌓아놓은 창고를 개방하여 쓸 만한 물자들을 사용할 것입니다."
 YUG_Coastal_Anti_Air_Base:0 "해안 방공 기지"
 YUG_Coastal_Anti_Air_Base_desc:0 "이탈리아의 공군이 우리 국토를 유린하고 있습니다. 우리의 미약한 항공전력으로 저들의 공군을 차단할 순 없겠지만 해안지대에 대공기지를 배치함으로써 어느정도는 저항할 수 있을 것입니다."
 YUG_Molotov_Cocktail_Supply:0 "화염병 보급"
 YUG_Molotov_Cocktail_Supply_desc:0 "이탈리아 군의 기갑은 대부분 가솔린 엔진을 사용합니다. 그리고 가솔린 엔진은 화염에 취약합니다. 우리는 임시방편적인 대전차 수단으로 화염병을 보급할 것입니다." 
 YUG_Mountain_Gun:0 "산포"
 YUG_Mountain_Gun_desc:0 "유고슬라비아와 이탈리아의 국토는 수 많은 산으로 이루어져 있습니다. 우리가 이에 특화된 포를 설계한다면 산간지역에서의 화력 우세를 쟁취할 수 있을 것입니다."
 YUG_Strengthening_Communication_Network:0 "통신망 강화"
 YUG_Strengthening_Communication_Network_desc:0 "현대전에서 가장 중요한 요소 중 하나를 꼽으라고 하면 통신이 빠질 수 없습니다. 우리는 전국에 군용 통신선을 연결하고 통신병을 육성하여 통신이 끊어지지 않게 할 것입니다."
 YUG_Full_Scale_Counterattack:0 "전면적인 반격"
 YUG_Full_Scale_Counterattack_desc:0 "이탈리아 군은 우리를 공격하다 제풀에 지쳤습니다. 그들의 탄약은 이제 고갈되었고 부상자들이 넘쳐나고 사기는 바닥을 치고 있습니다. 이제 우리가 이탈리아군을 국경 밖으로 몰아낼 차례입니다."
 YUG_Climbing_the_Mountain_Alps:0 "알프스 산맥을 넘어라" 
 YUG_Climbing_the_Mountain_Alps_desc:0 "이탈리아 군을 국경 밖으로 몰아내는데는 성공하였으나 이젠 알프스 산맥이 우리를 막고 있습니다. 우리는 전군에 산악전 훈련을 시행하고 동계장비를 준비할 것입니다. 알프스 산맥은 더 이상 우리를 막을 수 없습니다."
 YUG_Crossing_the_Piave_River:0 "피아베 강을 건너서"
 YUG_Crossing_the_Piave_River_desc:0 "우리는 알프스 산맥을 넘고 베네치아도 점령했습니다. 이젠 피아베 강을 건너야합니다. 공병대와 부교를 준비합시다. 산을 넘고 강을 건너 승리를 향해 갑시다."
 YUG_Victory_in_Italy:0 "이탈리아에서의 승리"
 YUG_Victory_in_Italy_desc:0 "우린 승리했습니다. 이제 우리는 이탈리아에서 얻은 교훈을 정리하고 교리로 만들어 추후 있을 전쟁에 대비할 것입니다."


 

