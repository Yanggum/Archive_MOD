l_korean:
 #아이디어
 anti_german_military:0 "독립주의 군부"
 anti_german_military_desc:0 "유고슬라비아 공군 내 세력은 유고슬라비아의 이권을 위협하는 파시스트 국가들과의 협력을 거부하고 있습니다. 이들은 국가가 파시스트와 동맹을 맺을 경우 정권 전복을 시도할 수 있습니다."
 prince_pavle:0 "파블레 왕자"
 YUG_infantry_equipment_specialization:0 "무기 생산 강화"
 YUG_greater_serbian_defense_force_idea:0 "세르비아 방위군"
 YUG_greater_serbian_defense_force_idea2:0 "세르비아 대육군"
 YUG_idea_serbian_militarism:0 "세르비아 군국주의"
 YUG_idea_Kings_Chetniks:0 "왕의 체트니크"
 YUG_idea_Kings_Chetniks2:0 "왕의 군대"
 YUG_idea_January_6th_Dictatorship:0 "1월 6일 체제"
 YUG_idea_January_6th_Dictatorship2:0 "강화된 1월 6일 체제"
 YUG_Loyal_Goverment:0 "충성스러운 정부"
 YUG_Idea_Economic_Centralization:0 "경제 중앙화"
 YUG_Idea_Capitalist_Support:0 "자본가의 지원"
 YUG_Idea_Industrial_Management:0 "산업관리"
 YUG_Idea_Suppressed_Capitalist:0 "억압된 자본가"
 YUG_Idea_Agricultural_Subsidy:0 "농업 보조금"
 YUG_Idea_State_Capitalism:0 "국가자본주의"
 YUG_Idea_Mining_Mechanization:0 "광업 기계화"
 YUG_Idea_Construction_Improvements:0 "개선된 건설산업"
 YUG_Idea_Improved_Productivity:0 "개선된 산업"
 YUG_standarded_gauge:0 "표준화된 궤간"
 #포커스
 YUG_western_focus:0 "섭정 의회"
 YUG_western_focus_desc:0 "섭정인 파블레 왕자의 친독정치가 독일의 멸망으로 끝났지만 섭정이 끝나서는 안됩니다. 아직 페타르 2세는 어리고 통치에 부적합합니다. 그러므로 우리는 실추된 섭정의 권위를 섭정의회를 통하여 보충할 것 입니다."
 YUG_expand_the_university_of_ljubljana:0 "연구 지원"
 YUG_expand_the_university_of_ljubljana_desc:0 "국내 연구를 지원하여 기술 발전을 도모해야 침략자로부터 우리나라를 지킬 수 있습니다."
 YUG_establish_the_banovina_of_croatia_desc:0 "크로아티아에 반자치적 기구를 설립하여 크로아티아 민족주의 세력을 분열시킴으로써 그들을 와해시켜야합니다."
 YUG_evolution:0 "통제"
 YUG_join_axis:0 "이탈리아에 접근"
 YUG_join_axis_desc:0 "많은 사람들이 우리의 전통적인 동맹국인 프랑스가 유럽 대륙에서 처참하게 쫒겨나는 모습을 보았습니다. 이전이라면 우리가 이탈리아와 외교적 동맹 관계를 맺는 것은 불가능했겠지만, 현재와 같은 상황이라면 그 누구도 반대할 수 없을 것이며, 이것이 유고슬라비아를 지키기 위한 마지막 선택이 될 것입니다."

 YUG_united_kingdom_tt:0 "§Y[SER.GetNameWithFlag]§!, §Y[SLV.GetNameWithFlag]§!, §Y[CRO.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[KOS.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§!, §Y[HRZ.GetNameWithFlag]§!, §Y[MAC.GetNameWithFlag]§!, §Y[TRA.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§!, §Y[BUL.GetNameWithFlag]§! 국가의 §Y핵심 주§!에 우리의 §Y핵심 주§!를 추가할 수 있습니다."
 #이벤트
 YUG_event.1.t:0 "반파시스트 인민전선"
 YUG_event.1.d:0 "우리는 명분적으로 인민전선을 주장하고, 실제로 이에 동참하는 소수의 단체들이 있었습니다. 나중에 도움이 될 것이 분명합니다."
 YUG_event.1.a:0 "근데 너무 적군."
 YUG_event.2.t:0 "반대파 숙청"
 YUG_event.2.d:0 "당내에는 반동들의 유화책에 넘어가 혁명대신 개혁을 주장하는 반대파들이 존재합니다. 우린 이들을 부하린주의자들과 함께 소련으로 '파견'할 것입니다."
 YUG_event.2.a:0 "잘가게 동무들... 영원히..."
 YUG_event.3.t:0 "왕실의 최후"
 YUG_event.3.d:0 "반동적인 봉건 왕정을 끝내기 위한 대혁명이 성공하였고 대다수의 왕실은 급작스러운 혁명에 해외로 도피하지 못하였습니다.그들을 어떻게 다루어야 할까요?"
 YUG_event.3.a:0 "왕실을 처형한다."
 YUG_event.3.b:0 "왕실을 추방한다."
 YUG_event.3.c:0 "왕실의 재산을 압류하고 일반인으로 지내게하자."
 YUG_event.5.t:0 "유고슬라비아의 지원 제의"
 YUG_event.5.d:0 "우리의 혁명을 지원하던 유고슬라비아가 직접 개입을 제의했습니다. 우리는 이 제안을 받아들여 혁명을 달성할 수 있습니다."
 YUG_event.5.a:0 "제안을 받아들인다."
 YUG_event.5.b:0 "우리는 꼭두각시가 아니야."
 YUG_event.6.t:0 "혁명의 대가"
 YUG_event.6.d:0 "유고슬라비아는 우리의 평화적인 정부 교체를 칭찬하면서도 우리 국가 내의 반대 세력을 완전히 뿌리 뽑으라는 내용의 공문을 보내왔습니다. 우리는 유고슬라비아의 명령에 따라 행동하거나, 그들과 적대할 수 있습니다."
 YUG_event.7.d:0 "[YUG.GetAdjective] 정부는 발칸반도의 여러 민족 간의 이해와 협력을 증진하고자 중앙정부 주도의 발칸반도의 통일을 수행하자는 제안을 우리에게 보냈습니다. [YUG.GetLeader]에 따르면, 이러한 방안은 발칸 연방의 위대한 마지막 단계로서 과거의 갈등을 뒤로 하고 국가들 간의 통합과 평화를 영원히 보장할 수 있게 해줄 것입니다. \n[YUG.GetNameDef] 측은 발칸 연방의 통일을 진행하기 위하여 [ROOT.GetAdjective] 정부의 답변을 기다리고 있습니다."
 YUG_event.10.d:0 "[FROM.GetAdjective] 정부는 우리나라 사이의 동맹은 유지하면서 연합 발칸 연방에 가입하는 것을 거부했습니다.\n그러나 [FROM.GetLeader]측은 [FROM.GetAdjective]의 거절에 대해 유고슬라비아 정부가 어떻게 반응하는 것에 있어 연방의 진정한 숨은 목적이 유고슬라비아의 국경을 상상할 수 있는 범위 이상으로 확장하기 위한 것인지 아니면 유고슬라비아가 정말로 연방 가입 조건에 상관없이 단일한 발칸의 사회주의 공화국을 추구하는지를 보여줄 것이라고 공개적으로 주장했습니다. 어찌 되었든 간에 [FROM.GetNameDef]측은 결코 독립이나 문화적 정체성을 포기하지 않을 것입니다."

 YUG_event.11.t:0 "파시스트 국가에 접근하는 [From.GetNameDefCap]" #DOD_yugoslavia.70
 YUG_event.11.desc:0 "오늘 [From.GetLeader](이)가 [Root.Capital.GetName](으)로 전보를 보내 파시스트 세력들과 불가침조약에 서명하는 데 관심을 표명했습니다. [From.GetLeader.GetHerHis] 국가 내에서 [SOV.GetAdjective]의 침략과 증가하는 민족주의를 두려워하는 [From.GetLeader](은)는 [From.GetLeader.GetHerselfHimself](을)를 [Root.GetNameDef](와)과 일치시키려 합니다. 비록 이것이 공식적인 동맹을 의미하지는 않지만, 그것은 [From.GetNameDef](을)를 우리의 세력 영향력 아래 끌어들이고 [Root.GetFactionName]에 대한 [From.GetAdjective]의 진입 과정을 촉진할 것입니다."
 YUG_event.111.t:0 "[From.GetNameDefCap]의 반대!"
 YUG_event.111.tripartite_rejection:0 "[From.GetLeader](은)는 파시스트 국가들과 불가침조약을 맺자는 [Root.GetAdjective]의 제안에 대해 그들은 \"다른 생각\"을 가지고 있다고 말하며, 거부의지를 표명했습니다."
 YUG_event.111.allied_objection:0 "우리가 파시스트 국가들과 접근하기로 한 결정은 우리 나라 안팎에서 깊은 논란을 불러 일으켰고, 페테르 2세의 섭정 역할을 하고있는 [Root.GetLeader]의 권리의 정당성을 없앴습니다. 유고슬라비아 군대의 장교들이 페테르 2세가 장성했다고 선언했고 [From.GetAdjective]의 지원을 받아 베오그라드로 행진하며 [Root.GetLeader]의 즉각적인 하야를 요구했습니다."
 YUG_event.111.allied_objection_no_best:0 "[From.GetLeader](은)는 우리가 추진하는 외교 정책에 대해 심각한 우려를 표명했습니다."
 YUG_event.111.a:0 "받아들이는 수밖에 없다."
 YUG_event.111.b:0 "전투 준비!"
 YUG_event.111.c:0 "무시해라."
 YUG_event.112.t:0 "파시스트와 불가침조약에 서명한 [From.GetNameDefCap]"
 YUG_event.112.desc:0 "[YUG.GetAdjective] 정부는 오늘 파시스트 국가들과 함께 불가침조약에 서명했습니다. 비록, 이것이 아직 [YUG.GetNameDef]의 [From.GetFactionName] 합류를 의미하지는 않지만, 이것은 [YUG.GetLeader]의 파시스트 동조와 두 국가에 대한 충성이 커지게 될 수도 있음을 보여주고 있습니다. 많은 사람들은 이 걱정스러운 발전에 대한 [Root.GetAdjective]의 대응을 기대하지만, 지금까지 이 문제에 대해 [Root.GetLeader]의 침묵만이 울리고 있습니다."
 YUG_event.112.a:0 "[YUG.GetLeader], 이 겁쟁이 사생아가!"
 YUG_event.112.b:0 "신경 쓸 필요 없을 것 같아."

 YUG_event.12.t:0 "충성을 맹세한 [From.GetNameDefCap]"
 YUG_event.12.desc:0 "[YUG.GetAdjective] 정부가 우리에게 보호를 요청해왔습니다. 그들은 대규모의 내정 간섭을 허용하는 대가로 [ROOT.GetAdjective]의 보호를 요청해 왔습니다."
 YUG_event.12.a:0 "[YUG.GetLeader], 환영한다."
 YUG_event.12.b:0 "무시해라."

 YUG_event.121.t:0 "[From.GetAdjective]의 수락!"
 YUG_event.121.desc:0 "우리의 보호 요청을 [From.GetAdjective]측은 긴 고민 끝에 보호를 제공할 것을 확답했습니다."
 YUG_event.121.a:0 "로마의 공기는 맑군"

 YUG_event.122.t:0 "[From.GetAdjective]의 거절!"
 YUG_event.122.desc:0 "우리의 보호 요청을 [From.GetAdjective]측은 거절하기로 결정한 것 같습니다."
 YUG_event.122.a:0 "이런"

 YUG_event.13.t:0 "공화국으로 가는 길"
 YUG_event.13.desc:0 "독일은 무너졌다.\n이계의 침공 앞에서, 한때 유럽 패권을 노리던 국가는 흔적도 없이 붕괴했고, 그 그늘에 기생하던 파블레 왕자의 친독 정책 역시 함께 사라졌다.\n\n군대에는 비상이 걸렸고, 남은 병력의 대다수는 이계 위협을 막기 위하여 슬로베니아로 이동하였다.\n\n어린 왕은 침묵했고, 왕관은 더 이상 누구에게도 명령하지 못한다.\n\n나는 묻지 않을 수 없다.\n이 왕정은 언제부터 우리를 지켜준 적이 있었는가?\n언제부터 이 왕실이 민중의 고통을 대신 짊어진 적이 있었는가?\n\n지금 이 땅에는 권위가 없다. 오직 공백만이 있을 뿐이다.\n그리고 공백은, 가장 먼저 손을 내미는 자의 것이 된다.\n\n역사는 지금 우리를 바라보고 있다.\n왕의 이름으로 연명하는 낡은 국가를 붙잡을 것인가,\n아니면 무너진 왕좌 위에 공화국을 세울 것인가.\n\n망설임은 곧 패배다.\n오늘, 우리는 선택해야 한다."
 YUG_event.13.a:0 "역사는 승자의 기록이다."

 YUG_event.14.t:0 "인민전선"
 YUG_event.14.desc:0 "그들은 묻는다.\n왜 서로 다른 이름을 가졌는가, 왜 서로 다른 깃발을 들었는가.\n\n그러나 더 중요한 질문은 이것이다.\n누가 우리에게 명령하는가?\n그리고 누가 우리의 굶주림으로 살아가는가?\n\n공장에서는 노동자가, 병영에서는 병사가,\n거리에서는 실업자가 각자의 자리에서 고개를 숙이고 있다.\n그들 모두는 서로 다르다고 배워왔지만,\n같은 명령을 받고, 같은 총구를 향해 서 있다.\n\n누군가는 말한다.\n지금은 단결할 때가 아니다.\n먼저 옳고 그름을 가려야 한다.\n\n그러나 분열은 언제나 위에서 시작되었고,\n그 대가는 언제나 아래에서 치러졌다.\n\n오늘 우리는 선택해야 한다.\n각자의 이름으로 패배할 것인가,\n아니면 통일 대오 아래 맞설 것인가."
 YUG_event.14.a:0 "노동자 통일전선에 합류하자. 그대도 노동자이니까!"

 YUG_event.15.t:0 "대자보"
 YUG_event.15.desc:0 "왕은 침묵했고, 인민은 피를 흘린다\n\n섭정은 왕의 이름으로 지배한다.\n그러나 그 책임은 누구도 지지 않는다.\n\n왕정은 질서를 말하지만\n우리는 감옥과 검열만을 보았다.\n\n누가 이 나라를 망쳤는가?\n왕실이다.\n왕당파다.\n그들을 지켜온 섭정이다.\n\n우리는 더 이상 신민이 아니다.\n이 땅은 왕의 것이 아니라\n인민의 것이다.\n\n섭정 타도!\n왕정 폐지!\n공화국 수립!"
 YUG_event.15.a:0 "이름없는 노동자, 농민, 병사, 인민 대중을 대표하여."

 YUG_event.16.t:0 "섭정의 하루"
 YUG_event.16.desc:0 "차는 느리게 움직이고 있었다.\n신호등 앞에서 잠시 멈춘다.\n나는 창밖을 본다. 익숙한 거리, 익숙한 표정들.\n\n이 정도의 경호면 충분하다고 생각했다.\n아니, 정확히 말하면 충분하길 바랐다.\n\n창문이 열려 있다.\n공기가 들어온다.\n생각이 잠시 느슨해진다.\n짧고 날카로운 소리.\n\이건 단순한 폭음이 아니다.\n경고도 아니다.\n의도가 분명한 소리다.\n\n가슴이 먼저 반응한다.\n그 다음에 통증이 온다.\n나는 무언가를 붙잡으려 하지만 손에 힘이 없다.\n\n총성이 한 번 더 울린다.\n유리가 금이 간다.\n호위병의 외침이 들리지만, 말로 분해되지 않는다.\n\n차가 급히 움직인다.\n그러나 나는 이미 움직이지 못한다.\n\n시야가 낮아진다.\n바닥이 보이고,\n떨어진 서류 위에 검붉은 점이 번진다.\n\n왕의 이름으로 쓰인 문장들.\n그 문장들 위에,\n내 피가 떨어진다.\n\n나는 왕이 아니었다.\n그 사실만은 분명하다.\n\n그렇다면, 이 피는 무엇을 지키기 위해 흘러야 했는가.\n\n생각은 끝까지 가지 못한다.\n총성보다 조용한 침묵이 모든 것을 덮는다."
 YUG_event.16.a:0 "그림이나 볼 걸 그랬어..."

 YUG_event.17.t:0 "분열"
 YUG_event.17.desc:0 "의자가 밀리는 소리가 들린다.\n누군가 자리에서 일어선다.\n\n"왕정은 무너졌습니다. 그런데 왜 개혁은 항상 멈춥니까?”\n\n웅성거림이 일지만, 그는 멈추지 않는다.\n\n“토지 개혁은 연기되고, 노조의 파업은 분쇄되고, 구 왕실 관료들은 ‘경험’이라는 이름으로 살아남았습니다.”\n“이게 우연입니까? 아니면 이 방 안에 아직도 왕당파와 손을 놓지 못한 자들이 있기 때문입니까?”\n\n누군가 항의하지만, 목소리는 묻힌다.\n\n“전면 개혁을 거부하는 자는 의도가 무엇이든 결과적으로 왕정을 돕고 있습니다.”\n\n그는 탁자를 짚는다.\n\n“지금 결단하십시오. 인민과 함께 갈 것인지, 왕관의 잔해와 함께 사라질 것인지.”\n\n회의실에는 침묵만이 남았다."
 YUG_event.17.a:0 "우익 세력이 인민전선을 배신했다!"

 YUG_event.18.t:0 "이탈리아의 침공"
 YUG_event.18.desc:0 "라디오는 사실만을 전했다.\n이탈리아군이 국경을 넘어 진입했다.\n\n도시는 잠시 멈춘다.\n공장에서는 기계가 꺼지고,\n상점에서는 계산이 늦어지며,\n거리에서는 사람들이 같은 소식을 반복해서 확인한다.\n\n병영에서는 명령이 내려온다.\n이유는 설명되지 않는다.\n다만 누구도 묻지 않는다.\n전쟁이 시작되었을 때, 질문은 사치라는 것을 모두가 알고 있기 때문이다.\n\n농촌에서는 말이 적다.\n전쟁은 새로운 일이 아니다.\n다만 이번에는 더 가까이 왔다는 점만 다르다.\n젊은이들은 서로를 바라보고,\n노인들은 과거의 전쟁을 떠올린다.\n\n관청과 사무실에서는 서류가 빠르게 움직인다.\n도장은 찍히고, 전화는 끊임없이 울린다.\n어떤 이는 국가를 걱정하고,\n어떤 이는 체제를 걱정하며,\n어떤 이는 그저 내일을 걱정한다.\n\n누군가는 분노하고,\n누군가는 체념하며,\n누군가는 조용히 준비한다.\n\n분명한 사실은 이탈리아의 침공은 이 나라에 사는 모든 사람의 일상을 바꾸어 놓을것이라는 것이다."
 YUG_event.18.a:0 "시작된 이상 끝까지 싸우리라."

 YUG_event.19.t:0 "대이탈리아 선전포고"
 YUG_event.19.desc:0 "결정은 길지 않았다.\n회의는 짧았고, 문장은 더 짧았다.\n\n이탈리아에 대한 선전포고가 승인되었다.\n\n전보는 즉시 발송되고, 외교 문서는 봉인되며, 지도 위의 선은 이제 의미를 잃는다.\n\n도시에서는 소식이 빠르게 퍼진다.\n누군가는 고개를 끄덕이고, 누군가는 창밖을 오래 바라본다.\n전쟁은 이제 시작되었지만, 이미 사람들은 언젠가 전쟁이 시작될 것이라고 알고 있었다.\n\n병영에서는 태세가 바뀐다.\n경계가 명령으로 바뀌고, 기다림이 이동으로 바뀐다.\n병사들은 더 이상 질문하지 않는다.\n전쟁은 선언과 함께 현실이 되었기 때문이다.\n\n농촌에서는 종소리와 라디오가 동시에 울린다.\n전쟁이 멀지 않다는 사실이 처음으로 명확해진다.\n\n관청과 사무실에서는 밤에도 불이 꺼지지 않는다.\n전쟁은 이제 외교의 문제가 아니라, 국가의 모든 기능을 요구하는 일이 되었다.\n\n이 결정은 체제를 위한 것도, 이념을 위한 것도 아니다.\n\n그것은 단 하나의 사실에 대한 답이었다.\n\n국경은 무너졌으며 이제 다른 선택지는 남지 않았다.\n\n분명한 사실은 이탈리아에 대한 전쟁은 이 나라에 사는 모든 사람의 일상을 바꾸어 놓을것이라는 것이다."
 YUG_event.19.a:0 "이 전쟁이 모든 일을 결정하리라."

 YUG_event.20.t:0 "승리, 그 이후"
 YUG_event.20.desc:0 "우리는 승리했습니다.\n\n세르비아의 농촌에서, 보스니아의 산악에서, 크로아티아와 슬로베니아의 도시에서 우리는 이탈리아군을 몰아냈습니다.\n\n우리는 알프스 산맥과 피아베 강을 넘어 배네치아, 제노바, 볼로냐, 피렌체를 점령했습니다.\n\n그리고 마침내 우리는 이탈리아의 수도이자 수천년의 유럽 문명의 중심인 로마를 점령했습니다.\n\n이탈리아 전역에 우리의 국기가 펄럭이고 있으며 베오그라드에서는 열병식이 거행되고 우리의 청년들은 집으로 돌아올 것입니다.\n\n하지만 이 모든 승리는 그냥 얻은 것이 아닙니다.\n\n묘지는 빈 곳이 없고 병원은 전상자로 가득합니다.\n\n도시들은 이탈리아의 폭격에 파괴되었으며, 부모는 아이를 잃고 아이는 부모를 잃었습니다.\n\n아무도 전쟁 이전으로 돌아갈 수는 없을 것입니다.\n\n그게 좋았던 나빴던 말입니다."
 YUG_event.20.a:0 "모든 것이 변화했지만, 그래도 우리는 승리했다."

