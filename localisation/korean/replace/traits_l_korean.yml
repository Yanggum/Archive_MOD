#게헨나 (선도부)
 GEH_military_chairman: "군인 행정가"
 GEH_military_chairman_2: "군벌 지도자"
 GEH_military_chairman_ako: "제복을 입은 시민\n§g소라사키 히나는 단순한 군부 지도자가 아닙니다. 그녀는 연방공화국의 의장이자 의회주의의 열렬한 지지자이며, 평의회에 권력을 크게 이양하고 기술관료들을 지원합니다.§!"
 GEH_military_chairman_amau: "제복을 입은 시민\n§g소라사키 히나는 단순한 군부 지도자가 아닙니다. 연방공화국의 헌법을 수호하는 평의회 의장으로서 그녀는 법과 질서 그리고 굳건한 통제민주주의의 상징이 되었습니다.§!"
 GEH_military_chairman_c: "국방위원장\n§g소라사키 히나는 게헨나 학원을 방위하고 조국을 수호하는 일에 투신했습니다. 그녀는 국방위원장이자 실행부의 억제자이자, 게헨나 국가를 안정적으로 수호하기 위해 광범위한 노력을 기울이고 있습니다.§!"
 GEH_military_chairman_cl: "게헨나 학생회장\n§g소라사키 히나는 게헨나 학원의 학생회장이자, 게헨나 선도부의 부장입니다. 소라사키 히나를 어떤 이들은 독재자라 비판하고, 어떤 이들은 너무 유약하다고 비난합니다. 그러나 확실한 사실은 게헨나 학원이 지금의 모습으로 남아있을 수 있는 건 소라사키 히나의 선택에 의해서라는 사실입니다.§!"
 GEM_horns_are_new_wings: "뿔은 새로운 날개\n§g뿔 좀 달렸다고 게르만 민족의 지도자가 되지 못하란 법은 없습니다. 모든 독일인의 당당한 지도자가 되었으며, 이제 하누마 마코토는 독일의 퓌러로 영원히 기억될 것입니다.§!"
 GEM_horns_are_new_wings_chiaki: "뿔은 새로운 날개\n§g뿔 좀 달렸다고 유럽의 지도자가 되지 못하란 법은 없습니다. 모든 독일, 바이에른, 라인을 비롯한 범독일권의 당당한 지도자가 되었으며, 이제 모토미야 치아키는 역사에 영원히 기억될 것입니다.§!"
 b_tjsehqnwkd_start: "선도부장"
 b_tjsehqnwkd_week: "강철의 선도부장"
 b_tjsehqnwkd: "강철의 선도부장"
 b_tjsehqnwkd2: "강철의 선도부장"
 b_tjsehqnwkd_play_woman_of_iron_skin: "게헨나-바이에른 특색 예술가"
 b_tjsehqnwkd3: "제1 대전제\n§g소라사키 히나의 말과 행동은 반드시 옳습니다. 그녀의 영도는 국가의 모든 국민들이 따라야 하는 '전제사항'이 되었습니다.§!"
 b_tjsehqnwkd3_tooltip: "제1 대전제"
 b_tjsehqnwkd_hina_week: "연철의 선도부장"
 GEH_not_you_plz_X: "의학의 선도부장"
 GEH_not_you_plz_A: "미식의 선도부장"
 GEH_not_you_plz_B: "온천의 선도부장"
 GEH_principle_trait_A: "질서론자"
 GEH_principle_trait_B: "복합적인 중재자"
 GEH_principle_trait_C: "조화론자"
 GEH_ako_trait_Z: "선임행정관\n§g은퇴한 소라사키 히나를 대신해 임시로 선도부장 대행을 수행중입니다.§!"
 GEH_ako_trait_Y: "이성의 학생회장\n§g전 선도부장 소라사키 히나와 옛 만마전 의장 하누마 마코토를 이어 게헨나의 학생회장이 된 아마우 아코입니다. 그녀는 이제 소라사키 히나 개인이 아닌, 게헨나 전체를 보려고 노력하고 있습니다.§!"
 GEH_ako_trait_X: "장난스러운 선도부장\n§g전 선도부장 소라사키 히나를 이어 게헨나의 선도부장이 된 아마우 아코입니다. 그녀는 소라사키 히나의 빈자리를 대신하기 위해 노력하고 있으며, 업무의 스트레스를 종종 시로미 이오리에게 불합리한 행정 명령을 내리는 것으로 해소합니다.§!"
 GEH_ako_trait_0: "선임행정관"
 GEH_ako_trait_1: "선도부 개혁가"
 GEH_Sorasaki_Hina_trait: "게헨나를 지키는 강철"
 GEH_Emergency_Medicine_Club: "응급의학부"
 GEH_Emergency_Medicine_Sena_Club: "응급의학부장"
 GEH_artist: "예술가"
 GEH_bauhaus: "바우하우스"
 GEH_degenerate_art: "퇴폐 미술가"
 GEH_composer: "클래식 작곡가"
 GEH_purist: "순수주의자"
 GEH_purist_l: "조국의 방파제\n§g시로미 이오리 학도위원장은 수많은 '민족 문화 오염'을 솎아 내는 거름망이자, 민족이 자라날 토양을 가꾸는 농부입니다.§!"
 GEH_purist_r: "게헨나의 재건자\n§g시로미 이오리 통제관은 게헨나와 도이치 문명을 융화시킨 용광로이자, 게헨나-독일 퇴폐 문화를 척결하고 조국을 안정화한 문명의 재건자입니다.§!"
 GEH_paranoia_ako: "편집증적 히나성애자"
 GEH_morning_star_club_ako: "별빛부 부장"
 GEH_paranoia_ako_bad: "무너진 선임행정관"
 GEH_paranoia_ako_good: "히나의 영원한 반려자"
 GEH_friendly_sociopath: "다정한 소시오패스\n§g'히나'는 진짜 소라사키 히나의 말버릇과 행동 하나까지 똑같이 모방해내며, 선도부 집무실 안에서는 선임행정관과 모든 선도부원들이 동경하는 '완벽한 선도부장'을 연기합니다. 하지만 지금의 그녀에게 모든 국민들은 그저 게헨나 선도부를 위해 사용해야 할 적절한 부품으로만 여겨지며, 선도부원이 아닌 국민들을 대하는 그녀의 태도에서는 일말의 인간성조차 느낄 수 없습니다.§!"
 GEH_friendly_sociopath_tooltip: "다정한 소시오패스"
 GEH_successor_of_hina: "히나의 후계자"
 GEH_puppet_of_prefect_team: "무력한 꼭두각시\n§g나츠메 이로하의 유일한 권한은, 기획부 평의회의 문서에 결재 서명을 하는 것입니다.§!"
 GEH_last_hope_of_prefect_team: "선도부 최후의 희망"
 GEH_puppet_leader_hina: "꼭두각시 지도자\n§g아코가 모든 일을 대신 할 텐데, 왜 국정 운영 따위를 신경 써야 할까요?§!"
 GEH_ako_partner_leader_hina: "아코의 파트너\n§g아코가 곁에 있는 한, 히나는 절대 무너지지 않을 것입니다.§!"
 GEH_pioneer_of_science: "과학의 선구자\n§g평의회 체제는 밀레니엄을 따라잡는 것을 목표로 발전하고 있습니다. 어떤 어려움에도 불구하고, 우리는 밀레니엄의 과학 기술을 따라잡을 것입니다.§!"
 GEH_yumeji_no_hana: "꿈길 위의 꽃\n§g소라사키 히나는 선도부 정보부에서부터 도이칠란트 중앙당에 이르기까지 광범위하게 퍼져 있던 아코에 대한 비토를 모두 물리치고, 두 사람의 행복을 이루어냈습니다.§!"
 GEH_the_terrible: "뇌제"
 GEH_the_guardian_of_freedom: "자유의 수호자"
 GEH_puppet_leader_hina_bad: "꼭두각시 의장\n§g소라사키 히나는 자신의 의지로 국가를 통치하는 것이 아닌, 그저 '대중의 의지'를 대변하는 상징적 의장일 뿐입니다.§!"
 GEH_military_chairman_hina: "실패한 군인 행정가"
 GEH_iori_trait_c_l: "게헨나 학도위원장\n§g소라사키 히나의 비극적 실종 이후, 시로미 이오리는 '순수 키보토스 문화'의 수호를 외치며 전면에 나섰습니다. 그녀는 더 이상 단순한 실행부장이 아닌, 게헨나의 모든 학도를 이끄는 위원장입니다. 그녀의 지도 아래, 게헨나는 헤일로를 가진 키보토스인의 우월성을 숭배하고, 조국을 오염시키는 모든 외부의 영향력을 배제하는 강력한 군사 국가로 거듭날 것입니다.§!"
 GEH_iori_trait_c_r: "신임 통제관\n§g소라사키 히나의 비극은 게헨나에 깊은 상처와 치유의 필요성을 남겼습니다. 시로미 이오리는 이 부서진 조국을 다시 일으켜 세우기 위해 나섰습니다. 그녀는 히나를 무너뜨렸던 모든 혼란과 오염을 닦아내고, 오직 강력한 질서만이 게헨나를 구원할 수 있음을 증명하고자 합니다.§!"
 GEH_celestial_revolution_trait: "문화 혁명"
 GEH_celestial_revolution_trait_1: "문화 혁명"
 GEH_celestial_revolution_trait_2: "문화 혁명"
 GEH_celestial_revolution_trait_B: "자유 갈망"
 GEH_celestial_revolution_trait_C: "질서 갈망"
 GEH_saint_gehenna_academy_A: "게헨나의 학생회장\n§g하타미 에리카는 소라사키 히나가 사라진 게헨나 속에서 가장 온정적이고 중심 잡힌 인물로 손꼽힙니다. 그녀는 이제 게헨나의 학생회장으로 광기와 혼돈의 상처를 지우고 세인트 게헨나 학원을 바로 세울 것입니다.§!"
 GEH_saint_gehenna_academy_B: "게헨나의 학생회장\n§g히노미야 치나츠는 반역주의자 색출의 광기 속에서 반역주의자로 몰려 대부분의 권한을 박탈 직전까지 몰렸습니다. 그러나 그녀는 꾸준한 이미지 개선 노력을 통해 그녀의 진심이 닿았고, 이제 세인트 게헨나 학원에서 소라사키 히나를 가까이에서 기억하는 이로써 남을 것입니다.§!"
 GEH_saint_gehenna_academy_C: "게헨나의 학생회장\n§g아이키요 후우카는 게헨나 학생회장 후보 중 가장 이례적인 인물로 손꼽힙니다. 그녀는 혼란 속에서도 그저 게헨나 학생들에게 한 끼의 음식을 제공하기 위해 노력했으며, 그 결과로 그녀는 많은 게헨나 내 지지층이 생겨났습니다. 선거기간 동안 미식연구회의 열렬한 지지를 받고 대부분의 선전을 미식연구회가 대신했다는 뒷이야기가 존재합니다.§!"
 GEH_eternal_hina_sorasaki: "우리들의 영원한 선도부장\n§g소라사키 히나는 실종되었으나, 우리들은 소라사키 히나를 우리들의 영원한 선도부장으로 추대하기로 결정했습니다. 소라사키 히나 위원회는 과거 소라사키 히나의 발언과 정립된 소라사키주의 방법론으로 국가를 계도하고 보호할 것입니다.§!"
 GEH_morning_star_club_A: "다정한 학생회장\n§g요자쿠라 키라라는 선거 운동 기간 보여준 여러 모습에 의해 가장 온정적인 인물로 손꼽힙니다. 반짝반짝부라는 친목 동아리를 이끌며 '청춘 게헨나' 선전으로 큰 인기를 끌었습니다.§!"
 GEH_morning_star_club_B: "급양부장 겸 학생회장\n§g아이키요 후우카는 게헨나 학생회장 후보 중 높은 지지율을 받았습니다. 그녀는 그저 게헨나 학생들에게 한 끼의 음식을 제공하기 위해 노력했으며, 그 결과로 그녀는 많은 게헨나 내 지지층이 생겨났습니다. 선거기간 동안 미식연구회의 열렬한 지지를 받고 대부분의 선전을 미식연구회가 대신했다는 뒷이야기가 존재합니다.§!"
