 GEH_chairman_of_the_people: "인민의 의장"
 GEM_manmajeon_chairmanship_separation_trait: "만마전의 의장"
 GEH_chairman_of_the_people_1: "굳건한 인민의 대통령\n§g나츠메 이로하는 연방의 건국자이자, 최초의 대통령입니다. 거대한 투쟁의 물결 속에서 굳건하게 버티는 찬란한 거성으로서, 연방을 통치해 나아갈 것입니다.§!"
 GEH_chairman_of_the_people_b_1: "민중의 대통령\n§g나츠메 이로하는 두 파벌의 지지를 받는 역사적 인물이자, 연방합중국의 대통령입니다. 파벌정치의 혼란 속에서 모두를 포용하는 온화한 지도자로서, 연방을 통치해 나아갈 것입니다.§!"
 GEH_chairman_of_the_people_b_2: "인민의 총통\n§g나츠메 이로하는 연방정부의 상징이자, 새롭게 복권된 총통 직위의 지도자입니다. 옛 총통처럼 강력한 권위를 휘두르지는 못해도, 두 파벌의 가장 중요한 주권자로서 연방을 중재해 나아갈 것입니다.§!"
 GEM_coordinator_trait: "연방 국가 조율자"
 GEH_chairman_of_the_people_a: "떡갈나무의 지도자\n§g나츠메 이로하는 새로운 독일인의 상징이자, 새 민족의 지도자입니다. 강인한 떡갈나무와 같이 독일은 영원토록 이 땅에 뿌리 깊게 새겨질 것입니다.§!"
 GEH_chairman_of_the_people_a2: "심장의 도시\n§g나츠메 이로하는 모든 독일 연방민들의 구도자이자, 제민족의 안락한 낙원을 건설하여 나가는 건설자입니다. 모든 연방 민족들의 찬란한 대오는 지켜질 것입니다.§!"
 GEH_Iroha_trait_a: "대전차장\n§g언제 어디에서나 전차를 타고 행진하는 우리들의 굳건한 지도자.§!"
