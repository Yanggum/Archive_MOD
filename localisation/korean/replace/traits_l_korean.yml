 GEM_pp_trait_tooltip: "국가 피로도 특성:\n §Y$GEH_armageddon$§!, §Y$GEM_gehenna_academy_is_a_school_where_everyone_is_happy_right$§!, §Y$GEM_gehenna_nation_founding$§!, §Y$GEM_school_rules_revision$§!, §Y$GEM_opinion_manipulation_and_secretariat_revolution$§! 국가중점 중 하나 완료시 제거"
 GEM_governor_general_trait: "행정관"
 GEM_fortress_of_progress_trait: "가장 앞에 서는 지도자\n§g독일 연방은 멈춰서는 안 됩니다. 모든 역사적 변혁의 흐름을 이끌어나아가는 기수이자 문명의 전열 보병인 우리는 가장 앞에서 적들을 쏘아 맞혀야 합니다!§!"
 GEM_leader_of_us_trait: "국가지도자\n§g독일국의 지도자이자, 가장 무거운 짐을 짊어진 게헨나의 희망입니다. 수 많은 정치적 혼란 속에 게헨나 보호와 독일 국가의 운영이라는 두 가지 과제를 이끌어나가는 우리들의 당당한 지도자입니다.§!"
 GEM_occult_reconstruction_trait: "신비학자\n§g어떤 날은 좌파적 혁명을, 어떤 날은 반동적 후퇴를, 수 많은 혼란한 행보를 나름의 규칙 속에서 보이는 우리들의 신비학자입니다.§!"
 GEM_gehennaism_trait: "게헨나적인\n§g독일국 선언 이후 하누마 마코토는 기존 독일인들의 예상을 뒤집어 엎어버리는 선택을 내리고, 모든 사회 방면에서 게헨나 문화를 주입하고 있습니다.§!"
 GEM_mini_gehenna_academy_trait: "게헨나 학원 학생회장 겸직\n§g게헨나 학원 학생회장은 독일국의 선언 이후 축소된 게헨나 학원의 역할을 확실하게 명문화시키고 재설계된 직무 중 하나로 일종의 게헨나계를 위한 대표단 역할을 하게되었습니다.§!"
 GEM_small_gehenna_academy_trait: "소 게헨나 학원\n§g소 게헨나 학원은 독일국의 선언 이후 축소된 게헨나 학원의 역할을 확실하게 명문화시키고 재설계된 새로운 게헨나 학원으로, 일종의 게헨나계를 위한 대표단체중 하나이자 게헨나 학원의 전통과 문화를 지키기 위한 소규모 공동체입니다.§!"
 GEM_better_integration_trait: "국가 통합주의자\n§g게헨나계와 독일계는 모두 결국 한 국가 안에서 살아가고 있습니다. 의도적인 분리는 의도적인 차별을 조성할 뿐이기에, 우리는 더 나은 통합을 추진해야 합니다. 우선은 게헨나 학원에 독일인 학생들을 받는 것으로 시작합니다.§!"
 GEM_chiaki_system_decision_GEM_german_B4_3_1_on_trait: "무혈 혁명가"
 GEM_chiaki_system_decision_GEM_german_B4_3_1_off_trait: "방파제"
 GEM_hero_of_order: "질서의 용사"
 GEM_anti_prometheus: "소화\n§g프로메테우스가 가져다준 인류의 불꽃은 자신을 무의식과 파멸 속에 집어넣고 있습니다. 이 모든 것은 이제 끝나야 합니다. 우리는 시대의 마지막 방주가 될 것입니다.§!"
 GEM_marionette: "꼭두각시"
 GEM_ruler_propaganda_trait: "대중 문화 지배"
 GEM_liberator: "해방자\n§g허상 위에 세워진 유리성은 가장 오만한 자의 깨달음으로 무너져 내렸습니다.§!"
