 TRN_pervert: "야한건 안돼! 사형!"
 TRN_pervert_desc: "§L이 학생은 변태입니다. 하지만 본인은 그 진실에 대해 부정하고 있지만 이 학생이 변태라는건 온 학생이 아는 비밀입니다.§!"
 BA_mania: "광증"
 BA_mania_desc: "§L최근 이 장군의 주위 사람들이 이상함을 느낍니다. 하늘을 보고 말을 한다는 제보도 있습니다.§!"
 BA_robot_general: "로봇"
 BA_robot_general_desc: "§L이 지휘관은 어쩌면 쇠로 된 투박한 신체를 가지고 있을 수도 있고, 나노머신으로 이루어진 유선형의 신체를 가지고 있을 수도 있으며, 어쩌면 실제 인간을 꼭 닮은 인조 피부를 가지고 있을 수도 있습니다. 하지만 어떠한 형태를 하고 있든, 이 지휘관은 생명이 없는 기계입니다.§!"
 medical_officer:0 "의무장교"
