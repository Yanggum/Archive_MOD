 COU_arona_notgood: "과로\n§g총학생회장은 벼랑 끝에 몰렸습니다. 통치 체계가 대전이로 인해 완전히 무너졌을뿐만 아니라 2개월 넘게 지속되는 통제 시도에서도 학원들은 조정과 통제를 거부합니다. 총학생회장은 키보토스를 수차례 재통제하기 위해 과로를 기꺼이 이어오고 있습니다만... 그녀는 조금 심합니다. 아니, 많이 심합니다.§!"
