 GEM_flower_of_gehenna_trait: "게헨나의 꽃"
 GEM_pandemonium_journalist: "주간 만마전 기자"
 GEM_pandemonium_journalist_1: "대중선전국장"
 GEH_motomiya_chiaki_trait_C1: "국가편집자\n§g서기실의 펜 끝에서 대중의 신문까지!§!"
 GEH_dlqnzl_trait: "게헨나의 마스코트"
 GEH_public_propaganda_model_trait: "주간 만마전 대표 모델"
 GEH_dlqnzl_com_trait: "연방의 마스코트"
 GEH_public_propaganda_model_com_trait: "데일리 연방 대표 모델"
