 GEH_satsuki_trait_2_O_R: "전게헨나의 사랑받는 여신\n§g당신은 그녀를 사랑했습니다.§!"
 GEH_satsuki_trait_2_O_L_A: "모든 게헨나와 독일의 곁에 선 여신\n§g중심 속 마지막으로 피어난 들꽃 한 송이.§!"
 GEH_satsuki_trait_2_O_R_A: "지상을 거니는 사랑받는 여신\n§g당신은 그녀를 사랑했습니다.§!"
 GEH_satsuki_trait_2_O_R_B_1_1: "무거운 속죄자\n§g이제는 한 명의 인간으로서.§!"
 GEH_satsuki_trait_A: "전독일의 사랑받는 여신\n§g모든 독일인의 영원한 지도자이자, 실낙원을 거느리는 예언자이며, 우리들의 찬란한 여신입니다.§!"
 GEM_state_religion_nation_trait: "대사제"
 GEM_emperor_of_all_germany_trait: "모든 독일의 카이세린"
 GEH_motomiya_chiaki_trait: "게헨나의 서기장"
 GEH_motomiya_chiaki_trait_OL1: "합리와 이성\n§g혁신을 선도하는 철학자 왕과 같이, 효율적인 국가를 만들어나가기 위해 노력하는 우리들의 지도자입니다.§!"
 GEH_motomiya_chiaki_trait_OR1: "민중의 서기장\n§g국가는 시민의 삶을 보장할 의무가 있으며, 이는 요람에서 무덤까지라는 구호 아래에 나타납니다.§!"
 GEH_motomiya_chiaki_trait_A0: "총통\n§g이제는 독수리의 계승자.§!"
 GEH_motomiya_chiaki_trait_A1: "인민의 총통\n§g사회공화국 총통의 직위는 인민 전체의 공리를 보장하는 하나의 헌장이자, 거대한 계약서입니다.§!"
 GEH_motomiya_chiaki_trait_A2: "국가대통령\n§g거대한 악을 물리치고 모든 위기 속에서 게르만-게헨나 문명을 수호하기 위해 노력하는 우리들의 지도자.§!"
 GEH_motomiya_chiaki_trait_A3: "퓌러\n§g알을 깨고 나와 비상하는 독수리.§!"
 GEH_motomiya_chiaki_trait_A4: "인민의 통령\n§g독일 인민공화국의 통령직은 모든 인민 공의의 합의체이자 주권자로 선출되어 계급 갈등을 완화하고 길을 찾아갑니다.§!"
 GEH_motomiya_chiaki_trait_A5: "여명의 게르마니아\n§g독일은 새롭게 재탄생했으며, 독일인의 땅이라는 조국의 이름에 걸맞게 게헨나, 남독일, 프랑크를 비롯한 소수민족을 모두 포용합니다.§!"
 GEH_motomiya_chiaki_trait_A6: "보수의 성채\n§g모토미야 치아키는 독일국을 안정화하기 위해 광범위한 우익적 타협을 추진했고, 이제는 독일국의 상징이자 위대한 통령으로 불리웁니다.§!"
 GEM_ibuki_system_action_wing_one_1_trait: "제국의 야심가"
 GEM_ibuki_system_action_wing_one_2_trait: "황금 왕좌의 주인"
 GEM_ibuki_system_action_wing_one_3_trait: "냉철한 실용주의자"
