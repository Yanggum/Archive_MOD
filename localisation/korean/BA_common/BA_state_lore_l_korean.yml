  l_korean:
  
  BA_SL_open_button_tt: "§Y[THIS.GetSLName]§!의 도시와 랜드마크"

  SL_customname_Trinity_Heart: "트리니티의 심장"
  state_lore_name.1: "천년수도 에덴"
  state_lore_desc.1: "\n제1차 공의회가 열리던 날, 트리니티의 모든 분파는 하나로 통합되었습니다. 그리고 이를 기념하기 위해 새로운 도시가 세워졌으니, 그 이름은 에덴이었습니다. 낙원의 이름을 딴 이 도시는 곧 트리니티의 중심지로 자리 잡았으며, 오랜 세월 동안 학생들의 안식처이자 방벽으로 기능해왔습니다. 오늘날에도 에덴은 트리니티의 핵심 도시로 존중받고 있습니다[Statelore_Get_trinity_heart_trk_path_desc]\n"
  state_lore_desc.1_TRK: "\n\n미소노 미카 이후에도 에덴은 여전히 트리니티의 심장으로 기능하고 있습니다. 파괴되고 상처입고 무너졌지만, 에덴은 다시 한번 일어섰습니다. 그 불굴의 모습은 트리니티 학생들에게 희망과 용기를 주는 버팀목이 되고 있습니다. 위기 속에서도 회복하는 에덴의 모습은 트리니티가 결코 쓰러지지 않을 것임을 보여주는 상징이기도 합니다."

  state_lore_name.2: "[Statelore_Get_gehenna_centre_name]"
  state_lore_desc.2: "\n[Statelore_Get_gehenna_centre_desc]\n"
  state_lore_name.2_normal: "게헨나의 심장"
  state_lore_desc.2_normal: "게헨나 중앙구는 대전이의 참화를 비교적 온전히 피해갔습니다. 자유분방한 학생들로 인해 여러 문제가 발생하곤 하지만, 다행히도 그 대부분은 중앙구와는 거리를 둔 곳에서 벌어지고 있습니다.\n\n게헨나의 과거 기록은 많지 않아 중앙구가 언제부터 형성되었는지, 계획적으로 지어진 도시인지 아니면 시간이 흐르며 자연스럽게 만들어진 도시인지는 알 수 없습니다. 그럼에도 불구하고 중앙구의 건축물들은 상당히 정교하게 지어져 있으며, 게헨나 학생들이 벌이는 소동에도 쉽게 무너지지 않고 버텨내고 있습니다.\n\n이곳에는 만마전과 선도부의 본부가 자리하고 있습니다. 하지만 대전이 사태 이후 불거진 양측의 갈등으로 인해 상황은 크게 변했습니다. 선도부가 게헨나 남구를 중심으로 세력을 옮겨가면서, 한때 중앙구에 위치했던 선도부 본부는 지금은 반쯤 버려진 상태로 남아 있습니다."
  state_lore_name.2_TRN: "트리니티의 두 번째 심장"
  state_lore_desc.2_TRN: "에덴 결전 이후, 게헨나는 트리니티 앞에 무릎 꿇었고 승리의 깃발은 높이 휘날렸습니다. 게헨나식 건축물들은 하나둘 철거되었으며, 그 자리에 트리니티만의 양식으로 지어진 새로운 건축물들이 들어서고 있습니다. 한때 웅장했던 만마전 본부는 파괴되어, 이제는 과거의 영상 기록 속에서만 그 모습을 확인할 수 있을 뿐입니다.\n\n저항을 이어가려는 게헨나 학생들도 있었습니다. 그러나 정의실현부와 트리니티 학생들로 이루어진 민병대, 그리고 자경단의 손에 그들의 의지는 번번이 꺾이고 말았습니다. 질서라는 이름 아래 그들의 숨결은 점차 옥죄어 왔고, 결국 복종을 강요받았습니다.\n\n무법지대였던 거리는 치안이 정돈되어 갔으며, 트리니티 학생들 또한 중앙구에서 자리를 잡기 시작했습니다. 과거 게헨나의 중심지는 차츰 역사 속에서 지워져 갔고, 그 자리는 이제 트리니티 종합학원의 이름으로 덧칠되고 있습니다. 이곳은 곧 새로운 이름으로 불리게 될 것입니다.\n\n그리고 그 순간, 게헨나라는 이름은 기억 속에서 희미해지고, 학생들의 미래는 트리니티의 권위 아래 점점 어둠 속으로 잠겨들고 있었습니다."

  state_lore_name.3: "밀레니엄 타워"
  state_lore_desc.3: "\n밀레니엄 타워는 처음부터 철저한 계획 속에 건설되었습니다. 밀레니엄의 기술력이 집약된 이 건축물과 주변 도시는 완전 자동화를 기반으로 운영되었으며, 한때는 최첨단 도시의 상징으로 여겨졌습니다.\n\n그러나 대전이 사태 이후 상황은 달라졌습니다. 자동화 도시의 동력은 점차 고갈되었고, 지구의 자원은 키보토스의 기술 체계를 뒷받침하기에 비효율적이었습니다. 결국 거대한 기계 장치로 이루어진 밀레니엄은 멈출 위기에 놓였습니다.\n\n이 시기에 벌어진 프랑스와의 전쟁은 큰 시련으로 다가왔습니다. 밀레니엄은 기존의 비축 자원을 소모하면서까지 저항해야 했고, 밀레니엄의 도시들은 크나큰 타격을 받았습니다.\n\n그럼에도 밀레니엄 타워는 여전히 가동 중입니다. 비록 언제 멈출지 알 수 없는 불안정한 상황이지만, 지금도 거대한 도시는 스스로의 체계를 유지하며 움직이고 있습니다.\n"
  
  state_lore_name.4: "생텀 타워"
  state_lore_desc.4: "\n키보토스의 수도에 세워져 있는 생텀 타워는 누가, 어떤 목적으로 만들었는지 전혀 알려지지 않았습니다. 타워는 총학생회의 통제 하에 그 이름처럼 키보토스 전역의 공공 시설, 사회 인프라와 학원들을 자동으로 관리했'었'습니다. 총학생회가 생텀 타워의 통제권을 잃기 전까지만 해도 말입니다. \n\n비밀스러움이 많은 이 생텀 타워의 제어권은 총학생회장만이 가지고 있습니다. 수 천개 학원들의 일상을 관리했던 생텀 타워이지만 대전이 이후 총학생회의 통제력이 무의미해지고 각 학원이 자체적인 체제를 구축하면서 이 비밀스러운 타워의 비밀은 좀처럼 밝혀질 것 같지 않습니다. \n\n생텀 타워의 근처는 우트나피쉬팀 특구의 중앙에 자리잡고 있음에도 그 주변에 드나드는 사람이 적어 한산하며, 그 앞에 선다면 왠지 모를 웅장한 분위기에 압도되기까지 합니다. \n"
  
  state_lore_name.5: "흥신소 사무소"
  state_lore_desc.5: "\n흥신소 사무소는 키보토스의 주요 동아리 중 하나인 '흥신소 68'의 본부로, 대전이 이전에는 현대적 건축물에 자리잡고 있었습니다. 대전이 직후의 혼란 속에서 옛 흥신소 사무소가 전소된 이후, 현재는 룩셈부르크 대공국의 대공궁이 흥신소의 사무실이 되었습니다.\n\n룩셈부르크 대공궁은 르네상스 시기 룩셈부르크 시의 시청으로 건설되었으나, 1890년에 룩셈부르크 대공가를 위한 새 궁전으로 용도가 변경되었습니다.\n\n고딕 스타일의 아름다운 룩셈부르크 대공궁 집무실은 아루가 주도하는 흥신소 사무실이 되었습니다. 대공궁 시절에 비해 외향은 거의 달라지지 않았지만, 내부에는 흥신소 68 회사 업무와 대공국의 섭정으로서의 직무를 위한 비밀스러운 서류들이 가득합니다.\n\n대공궁의 '업무용' 공간은 흥신소 68의 사무실, 응접실 등으로 개조되었지만, 대공가가 일상 생활을 하던 궁전의 개인 공간은 전혀 사용하고 있지 않습니다. 대전이 직후 귀금속을 약탈하러 온 게헨나 폭도들에 의해 샤를로테 여대공과 그녀의 부군, 그리고 열 살도 되지 못한 어린 자녀들은 궁전 침실에서 모두 총살당했습니다. 아루는 샤를로테 여대공과 그녀의 가족들의 유골함을 옛 침실에 보관해 두고, 대신 대공궁에서 15분 거리에 있는 좁은 하숙집에서 출퇴근을 합니다. 침실, 식당 등 대공가의 사적인 공간들은 리쿠하치마 아루의 지시로 매일 청소만 되고 있을 뿐, 흥신소 68 사원들은 사용하지 않습니다.\n\n냉소주의자들은 아루가 죽은 대공가의 귀신을 두려워해 대공가의 넓은 침대 대신 하숙집의 딱딱한 소파에서 새우잠을 잔다며 조롱합니다. 하지만 그녀를 잘 아는 사람들은 아루가 살해당한 대공가에 대한 존중의 의미로 그 공간을 비워두고 있을 뿐이라 말합니다. 진실이 무엇인지는 아마 밝혀지지 않을 것입니다.\n"

  state_lore_name.6: "[Statelore_Get_Abydos_highschool_name]"
  state_lore_desc.6: "[Statelore_Get_Abydos_highschool_desc]"
  state_lore_name.6_normal: "버려진 폐허"
  state_lore_desc.6_normal: "\n산해경과 백귀야행의 침공으로 아비도스가 철수한 이후, 그 건물은 주인 없는 빈집으로 남게 되었습니다. 창문 너머로는 더 이상 불빛이 새어 나오지 않았고, 오래된 벽에는 바람만이 스쳐 지나갔습니다. 그러나 그렇다고 해서 완전히 버려진 것은 아니었습니다. 정기적으로 청소업체가 드나들며 먼지를 털고 창틀을 닦았기 때문입니다.\n\n사람들은 이러한 관리에 의문을 품었습니다. 아무도 살지 않는 집을 굳이 단정히 가꾸는 이유가 무엇인지 궁금해했습니다. 그러나 현룡문에서 \"그 일에 대해 왈가왈부하지 말라\"는 공문을 내린 이후, 모든 소문과 호기심은 곧 사라졌습니다.\n\n그렇게 건물은 다시 찾아올 주인을 기다리는 듯, 묵묵히 몸단장을 하며 도시의 한구석에 서 있습니다. 그 적막은 언젠가 돌아올 발걸음을 예감하는 침묵처럼 느껴집니다.\n"
  state_lore_name.6_abydos_own_state: "아비도스 본교"
  state_lore_desc.6_abydos_own_state: "\n아비도스가 옛 터전을 탈환한 이후, 그들은 다소 놀랐습니다. 그곳은 누군가에 의해 흠 잡을 부분 없이 관리되고 있었습니다. \n오히려 낙후된 시설이 보수되거나 수도관, 전기 등도 연결되어 있었기에 연립정부는 이곳을 당초와는 다른 목적으로 이용하기로 했습니다.\n\n연립정부의 수도가 호른으로 결정된 이후, 공식적으로 아비도스 고등학교의 모교는 카를로비바리 제2분관이 되었으며 이곳, 아비도스 고등학교 제1분관은 호른 정부의 별관으로 개조되어 연립정부의 행정, 정치, 통합의 중심지가 되었습니다.\n\n조금 다른 방향이지만 활기를 되찾은 고등학교 건물은, 가끔 야근하는 이들의 곡소리가 들리기도 하지만 다시 그 화목하고 안정감 있는 분위기를 되찾게 되었습니다.\n\n그리고 사실, 남은 몇몇 교육용 구역은 상주인원들의 자녀들을 돌보고 교육하는 곳이 되었으니 그 본 목적을 잃은 것도 아니라고 하겠습니다.\n"
  state_lore_name.6_nothing: "호른 도심"
  state_lore_desc.6_nothing: "\n남키보토스의 여러 문화가 공존하는 호른은 §R[검열됨]§!의 중심지§R[검열됨]§!...아니었습니다. \n중심지의 자리는 빼았겼지만 호른은 여전히 남키보토스의 대도시로써 기능하고 있습니다.\n"

  state_lore_name.7: "[86.GetCapitalVictoryPointName]"
  state_lore_desc.7: "\n바시스 스콜라는 원래 폴란드의 도시, 포즈난이었습니다. 중세부터 이어져 내려온 역사와 문화가 깃든 곳이었으나 지금은 구호기사단의 본부가 들어서고 트리니티의 그림자가 드리운 땅으로 변해 버렸습니다.\n"

  state_lore_name.8: "[763.GetCapitalVictoryPointName]"
  state_lore_desc.8: "\n쾨니히스베르크의 저항은 거세지 않았습니다. 포위와 포격이 이어지자 도시의 방벽은 빠르게 무너졌습니다. 독일군이 항복하고 주 정부가 백기를 들면서 트리니티는 마침내 이 땅을 온전히 손에 넣었습니다.\n\n하지만 그 대가로 쾨니히스베르크는 깊은 상처를 안게 되었습니다. 한때 독일인들의 정신적 수도라 불리던 도시는 파괴되었고, 그 흔적 위에서 트리니티는 새로운 역사를 써 내려가고 있습니다. 복원 사업은 폐허를 되살리려는 동시에 과거의 이름을 지워내고 있습니다. 지금 이곳은 더 이상 쾨니히스베르크라 불리지 않습니다. 트리니티는 그 위에 자신들의 고유한 이름, 키미기야마를 덧씌우며 새로운 시대를 열고 있습니다.\n"
  
  state_lore_name.9: "바이스 시티"
  state_lore_desc.9: "\n무엇이든 넘쳐나던 30년대의 영광은 이미 지나갔습니다. 그러나 바이스 시티는 여전히 프랑스의 태양과 환락을 등에 업고 살아가는 즐거움의 수도입니다. 이 도시는 프랑스의 매력과 분주함, 그리고 그 속에 감춰진 탐욕을 한데 끌어안은 채, 사람들에게 끝없는 이야깃거리를 던져 줍니다.\n\n오션 비치에서는 파스텔 톤으로 치장된 호텔들이 마치 자신이 미술관이라도 되는 듯 뽐내고 있고, 백사장은 태양 아래에서 눈부심을 강요하듯 빛납니다. 리틀 쿠바에 가면 활기찬 빵집에서 풍기는 고소한 냄새가 사람들을 유혹하지만, 그 속내는 이윤을 좇는 상인의 눈빛만큼 날카롭습니다.\n\n티샤 워카 벼룩시장에선 짝퉁 브랜드들이 '진짜보다 더 진짜'라는 표정으로 손님을 맞이하며, 어쩐지 이 도시의 본질을 그대로 드러내 보입니다. 그리고 세계적인 유람선의 수도라 불리는 바이스 시티 포트에서는 호화로운 선박들이 늘어선 채, 한쪽에선 우아한 여행의 낭만을, 다른 쪽에선 돈의 무게를 노골적으로 과시합니다.\n\n바이스 시티는 여전히 화려하고 여전히 웃기며, 동시에 어쩐지 씁쓸합니다. 이곳에서는 태양조차도 관광객의 지갑만큼이나 눈부시게 빛납니다.\n\n§O바이스 시티 베이베!§!"

  state_lore_name.10: "[Statelore_Get_Abydos_homeschool_name]"
  state_lore_desc.10: "[Statelore_Get_Abydos_homeschool_desc]"
  state_lore_name.10_normal: "거대한 모래더미"
  state_lore_desc.10_normal: "\n다뉴브 강의 지류가 만나는 헝가리의 유서 깊은 도시였으나, 대전이 이후 거대한 모래산의 그림자 아래 놓이게 되었습니다. 서북부 지역이 모래에 파묻히는 참사에도 불구하고, 산에서 흘러나오는 '청휘석'과 고대 유물들을 채굴하기 위해 수많은 모험가와 기업이 몰려들며 기형적인 발전을 이룩했습니다. 도시는 모래폭풍의 위협과 일확천금의 꿈이 공존하는 위태로운 균형을 유지하고 있습니다. 정부의 통제력이 미치지 못하는 채굴 현장에서는 매일같이 사건 사고가 끊이지 않지만, 모래산이 뱉어내는 푸른 빛의 유혹은 사람들을 끊임없이 이 위험한 도시로 불러들이고 있습니다."
  state_lore_name.10_abydos_own_state: "아비도스 본관"
  state_lore_desc.10_abydos_own_state: "\n모래산이 사라진 자리에 들어선 첨단 미래 도시이자, 아비도스 연방의 성지(聖地)입니다. 본관 재건과 함께 개발된 서북부 신시가지에는 키보토스의 오버테크놀로지가 집약된 초고층 빌딩과 최신식 인프라가 들어섰으며, 죄르는 명실상부한 연방 최고 수준의 발전된 도시가 되었습니다. 아비도스의 본관을 중심으로 정치, 경제, 기술의 핵심 기능이 집중되어 있어 연방의 실질적인 제2의 수도 기능을 수행합니다. 과거의 재앙이었던 모래가 걷힌 자리는 이제 희망과 번영의 상징이 되었으며, 본관을 방문하려는 순례자와 최첨단 기술을 배우려는 이들이 모여드는 활기찬 대도시로 변모했습니다."
  state_lore_name.10_nothing: "죄르 평야"
  state_lore_desc.10_nothing: "\n죄르 서북부에 펼처진 넓은 평야입니다.\n원래 모래산이 있었던 넓은 부지에는 거대한 산업지구가 건설되고 있으며, 동키보토스의 새로운 심장이 될 것입니다.\n...모래산 안에 있던 §R[검열됨]§!은 신도시 건설에 §R[검열됨]§! §R[검열됨]§! §R[검열됨]§! 재료로써 활용이 §R[검열됨]§! §R[검열됨]§!\n§R...양질의 모래는 대량의 실리콘 생산에 도움을 주었습니다.§!"

  state_lore_name.11: "[51.GetCapitalVictoryPointName]"
  state_lore_desc.11: "\n작은 광산 도시에 불과했던 에센은 산업혁명 이후 크루프 기업과 함께 가파르게 성장했습니다. 독일 통일 이후에는 제국의 핵심 군수산업 도시로 자리매김하며 전성기를 맞이했습니다.\n\n그러나 대전쟁에서의 패배는 에센을 크게 위축시켰습니다. 도시의 활기는 사라졌고 산업 기반은 흔들렸습니다. 하지만 히틀러의 등장과 함께 에센은 다시 한번 급성장의 길을 걸었습니다. 전쟁 준비를 위해 군수산업이 재가동되면서 도시는 과거의 영광을 되찾는 듯 보였습니다. 그래야만 했습니다. 적어도 게헨나 학원이 등장하기 전까지는 말입니다.\n\n게헨나 학원은 에센을 무력으로 정복했고, 격렬한 전투 과정에서 도시는 파괴되었습니다. 에센의 상징이었던 크루프 기업의 본사 건물마저 잿더미가 되었습니다. 승리를 거둔 게헨나는 전리품으로 얻은 이 도시를 게헨나 서구로 명명했습니다. 과거의 영광은 역사 속으로 사라지고, 에센이라는 이름은 새로운 정복자의 것이 되었습니다."

  state_lore_name.12: "[52.GetCapitalVictoryPointName]"
  state_lore_desc.12: "\n현지인들과 철저히 거리를 두고, 사회의 질서를 유지하고자 한 게헨나 선도부의 영향으로 인해 뮌헨 시민들은 대전이 이전과 거의 비슷한 삶을 살아가고 있습니다. 대전이 직후 게헨나 중앙구의 남부 지역 일부가 파편화되어 전이되었다는 이유로 행정구역 이름이 '게헨나 남구'로 개명되었으나, 시민들에게 이곳은 언제나 뮌헨이었고, 앞으로도 뮌헨일 것입니다.\n\n많은 이들은 뮌헨을 '문화의 도시'라고 부릅니다. 대전이 이후, 소라사키 히나 선도부장이 게헨나의 미래를 '예술의 학원'으로 구상하면서 도시의 문화적 융성은 더욱 발전했습니다.\n\n1914년의 대전쟁으로 쇠퇴했던 진보주의적 예술 사조인 유겐츠틸(Jugendstil)이 뮌헨에서 다시 부흥하기 시작했고, 세계적인 희곡 작가인 베르톨트 브레히트를 비롯한 문학가들도 뮌헨으로 모여들고 있습니다. 하지만 이 도시가 번화한 예술의 중심지로서 평화로이 자립할 수 있을지, 전쟁과 폭력의 소용돌이 속에서 결국 그 펜이 꺾이게 될 것인지는 아직 알 수 없습니다."