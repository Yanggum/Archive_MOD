 ### 아비도스 고등학교 ###
 ABY_infantry_equipment_0:0 "상식적 수단"
 ABY_infantry_equipment_0_short:0 "상식적 수단"
 ABY_infantry_equipment_0_desc:0 "오쿠소라 아야네가 사용하는 권총으로, 대전이 초기 부족한 무장 충원을 위해 잠시 사용된 제식 총기로써, 권총이지만 매우 높은 화력을 가지고 있어 현재도 장교들에게 지급되고 있습니다."
 ABY_infantry_equipment_1:0 "Sincerity"
 ABY_infantry_equipment_1_short:0 "Sincerity"
 ABY_infantry_equipment_1_desc:0 "쿠로미 세리카가 사용하는 돌격소총으로, 성실 혹은 정직 이라는 뜻을 가지고 있는 제식 총기입니다. 특히나 병사들 사이에서 정직함이라는 이름에 걸맞게 훈련 그대로의 성능이 나온다고 소문이 퍼져 인기가 많습니다."
 ABY_infantry_equipment_2:0 "WHITE FANG 465"
 ABY_infantry_equipment_2_short:0 "WHITE FANG 465"
 ABY_infantry_equipment_2_desc:0 "스나오오카미 시로코가 사용하는 돌격소총으로, 지정 사수 소총 에서부터 보병용 돌격소총까지 범용성과 확장성이 넓어 새로이 제식 총기로 채택되었으며, 강력한 파괴력을 가졌으나 높은 무게와 전용 탄창 사용 등의 문제로 인해 개량이 논의되고 있습니다."
 ABY_infantry_equipment_3:0 "BLACK FANG 465"
 ABY_infantry_equipment_3_short:0 "BLACK FANG 465"
 ABY_infantry_equipment_3_desc:0 "WHITE FANG 465의 개량형으로, 장점을 유지하며 무게를 줄이고 기존 탄창을 삽입할 수 있게끔 개량되었습니다. 모듈형 설계 추가와 쉬운 정비, 명중률과 사거리의 상승 등의 일진보를 이루었으나, 그 대가로 신뢰성이 약간 감소하여 고장을 일으키는 경우가 생겼습니다."
 ABY_ABYDOS_modern_infantry_equipment:0 "호루스의 눈 + 베레타 92A1"
 ABY_ABYDOS_modern_infantry_equipment_short:0 "호루스의 눈 + 베레타 92A1"
 ABY_ABYDOS_modern_infantry_equipment_desc:0 "타카나시 호시노가 사용하는 산탄총과 보조 기관권총 및 방탄복으로, 주로 전선 돌파용 돌격대에게 보급되어 적 참호를 쓸어버리고 후속 보병대가 올 때까지 거점을 점령하기 위해 쓰입니다. 강철 플레이트 방탄복 등 총기를 제외한 나머지 준현대식 장비들은 일반 보병에도 편제되어 화력과 방어력을 향상시킵니다."
 ABY_juggernaut_equipment_0:0 "Juggernaut Mini No.5"
 ABY_juggernaut_equipment_0_short:0 "Juggernaut Mini No.5"
 ABY_juggernaut_equipment_0_desc:0 "이자요이 노노미가 사용하는 네프티스 사의 미니건과 새롭게 개발된 저거너트 슈트입니다. 네프티스 사의 미니건은 신소재를 이용하여 경량화되었으나, 여전히 일반 보병이 사용하기엔 무리가 있어 강화 외골격 슈트를 장착한 저거너트 부대를 위한 무장으로 편성되었습니다. 저거너트 슈트에는 데이터 링크 기술이 적용되어 드론이 같이 편성될 경우 드론과 저거너트가 편대를 이루어 효율적인 전술 시행이 가능합니다."