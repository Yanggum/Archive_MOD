l_korean:
 #보병#
 category_halo: "모든 헤일로 편제"
 category_helicopter: "모든 헬리콥터"
 category_halo_special_forces: "모든 헤일로 특수부대"
 halo_infantry: "헤일로 보병"
 halo_infantry_desc: "헤일로로 보호받는 보병."
 halo_paratrooper: "헤일로 공수부대"
 halo_paratrooper_desc: "헤일로로 보호받는 공수 부대를 육군 전력에 포함시키면, 기존에는 접근이 불가능했던 지역에 강제 진입하거나 핵심 병력을 배치할 수 있게 되어, 새로운 전술적 기회를 창출할 수 있습니다."
 halo_marine: "헤일로 해병"
 halo_marine_desc: "상륙전에 특화된 부대는 점점 필수가 되어가고 있습니다. 헤일로로 보호받는 해병대가 상륙함의 지원과 특수 훈련을 받게 되면서 임시방편으로 만든 작전과 장비는 이제 옛말이 되었습니다."
 halo_mountaineers: "헤일로 산악병"
 halo_mountaineers_desc: "산악에서의 전투는 부대를 많은 위험에 노출시키지만, 언제나 피할 수 있는 것은 아닙니다. 특화된 장비와 훈련을 헤일로로 보호받는 병사들에게 제공한다면 이러한 위험을 최소화할 수 있습니다."
 halo_ranger: "헤일로 레인저"
 halo_ranger_desc: "헤일로로 보호받는 레인저는 초목이 빽빽하게 우거진 지형에서 싸우는 데 있어 최고의 전문가입니다."
 halo_militia: "헤일로 민병"
 halo_militia_desc: "헤일로로 보호받는 민병."
 halo_special_forces: "헤일로 특수부대"
 halo_special_forces_desc: "정예 헤일로 특수부대."
 low_halo_infantry: "인조 헤일로 보병"
 low_halo_infantry_desc: "인공적으로 만들어진 헤일로 보병."
 juggernaut: "저거너트"
 juggernaut_desc: "신비가 주입된 외골격 슈트를 착용한 보병."
 juggernaut_pioneer: "저거너트 특수지원단"
 juggernaut_pioneer_desc: "신비가 주입된 외골격 슈트를 원활한 작전체계에 편입하기 위해 창설된 특수 중대입니다."
 category_juggernaut: "모든 저거너트"
 category_mythic: "모든 신비 대대"
 category_mythic_special: "모든 신비 특수부대"
 umamusume: "우마무스메 보병"
 umamusume_desc: "시속 70km로 달리는 우마무스메 보병."
 tokiwadai_infantry: "초능력자 부대"
 tokiwadai_infantry_desc: "초능력자로 이루어진 부대."
 color_infantry: "색채 보병"
 color_infantry_desc: "색채로 이루어진 보병."
 decagrammaton_infantry: "데카그라마톤 보병"
 decagrammaton_infantry_desc: "데카그라마톤의 군수공장에서 생산된 보병입니다."
 gei_otomaton: "오토마톤"
 gei_otomaton_desc: "데카그라마톤의 군수공장에서 생산된 오토마톤 기계부대입니다."
 #지원중대#
 halo_recon: "헤일로 수색중대"
 halo_recon_desc: "헤일로로 보호받는 정찰중대."
 halo_engineer: "헤일로 공병중대"
 halo_engineer_desc: "헤일로로 보호받는 공병중대는 일반적인 공병중대가 해결할 수 없는 화망 속 장애물 제거 작업을 수행할 수 있습니다. 헤일로 공병을 전장에 투입한다면 참호전과 시가전에서 일반 헤일로 보병의 전투 능력을 큰 폭으로 향상할 수 있습니다."
 kivotos_dron: "키보토스 드론"
 kivotos_dron_desc: "키보토스에서 운용하는 드론."
 repeater_battalion: "신호 중계 중대"
 repeater_battalion_desc: "광범위한 연산장치와 신호 중계기를 동반하는 신호 중계 중대입니다. 중앙 프레임의 광대역 통신 신호를 수신하기 위한 거대 안테나를 운용합니다."
 #기갑사단#
 decagrammaton_armor: "데카그라마톤의 예언자"
 decagrammaton_armordesc: "거대한 자동화 기계 장치."
 #장비#
 kivotos_infantry_equipment: "신비 직조기"
 kivotos_infantry_equipment_short: "신비 직조기"
 kivotos_infantry_equipment_0:0 "불완전한 신비 직조기"
 kivotos_infantry_equipment_0_short:0 "불완전한 신비 직조기"
 kivotos_infantry_equipment_1:0 "신비 직조기"
 kivotos_infantry_equipment_1_short:0 "신비 직조기"
 kivotos_infantry_equipment_2:0 "진보된 신비 직조기"
 kivotos_infantry_equipment_2_short:0 "진보된 신비 직조기"
 kivotos_infantry_equipment_desc: "대전이 현상으로 키보토스가 다른 세계로 전이되었으나 기존 세계와는 다르게 매우 부족한 신비를 충당하기 위해 개발된 완성된 신비 직조기입니다."
 kivotos_infantry_equipment_0_desc: "프로토타입 신비 직조기입니다. 개발 이론에 비해 낮은 성능을 가지고 있으나, 신비를 생성해내는 능력을 보유하고 있습니다."
 kivotos_infantry_equipment_1_desc: "대전이 현상으로 키보토스가 다른 세계로 전이되었으나 기존 세계와는 다르게 매우 부족한 신비를 충당하기 위해 개발된 완성된 신비 직조기입니다. 밀레니엄의 시라이시 우타하와 산해경의 야쿠시 사야가 주도하여 개발되었으며 패전의 위기에서 키보토스를 구원해낸 장비로도 알려져 있습니다."
 kivotos_infantry_equipment_2_desc: "더 많은 청휘석을 이용하여 키보토스 그 이상의 신비를 구현하고, 청휘석의 능력으로 마치 누군가의 보조를 받는 듯한 기분을 주는 매우 진보된 신비 직조기입니다."
 decagrammaton_equipment: "예언자 부품"
 decagrammaton_equipment_0: "예언자 부품"
 decagrammaton_equipment_desc: "데카그라마톤이 운용하는 거대한 기계 장치에 사용되는 부품입니다. '예언자' 라 불리는 이 거대한 기계 장치는 매우 독특한 작동 방식을 가집니다."
 kivotos_dron_equipment: "키보토스 드론 장비"
 kivotos_dron_equipment_0: "드론 장비"
 kivotos_dron_equipment_desc: "키보토스에서 운용하는 드론에 사용되는 장비입니다."
 kivotos_dron_equipment_1: "강화된 드론 장비"
 kivotos_dron_equipment_1_desc: "키보토스에서 운용하는 드론에 사용되는 장비입니다. 원격 조종 거리를 향상시키고 보병과 협력하는 다양한 인터페이스를 탑재하여 더 능동적이고 유연한 작전을 수행할 수 있게 되었습니다."
 modern_infantry_equipment:0 "근미래식 보병장비"
 modern_infantry_equipment_desc:0 "키보토스의 미래식 보병장비의 플라스틱, 합성수지 등 신소재를 청휘석을 이용해 유사하게 제작한 보병장비입니다."
 juggernaut_equipment:0 "저거너트 장비"
 juggernaut_equipment_0:0 "저거너트 장비"
 juggernaut_equipment_desc:0 "인조 헤일로 기술에서 요구되는 학도병 징집 혹은 강제적인 5년 시한부 등의 반인륜적인 사안을 거부한 일부 국가는 보다 인륜적인 신비 보병대를 연구했고, 그 결과 신비를 주입한 외골격 방탄 슈트인 저거너트 슈트가 등장했습니다. 비록 사용자의 칼로리를 빠르게 소모하며, 사용자의 신체 능력에 영향을 받는 등의 사소한 문제가 있으나 건강에는 아무 지장이 없는 것으로 확인되어 널리 사용되고 있습니다. 종합적으로 인조 헤일로 보병과 비슷한 전투력을 보이지만, 생산 비용이 3배 가량 비싸기에 대규모로 운영되기에는 무리가 있습니다."

 syemmata_railway_gun: "셰마타급 열차포"
 syemmata_railway_gun_equipment: "셰마타급 열차포"
 syemmata_railway_gun_equipment_short: "셰마타급 열차포"
 syemmata_railway_gun_equipment_desc: "게헨나와 아비도스 협력의 증거인 이 거대한 무기는 타의 추종을 불허하는 힘과 500km반경의 타격반경에 대한 고도의 정밀성을 지닌 완벽한 비대칭전략병기로써 우리 국가에 강력한 패권을 가져다 줄 것입니다."
 syemmata_railway_gun_equipment_1: "셰마타급 열차포"
 syemmata_railway_gun_equipment_1_short: "셰마타급 열차포"
 syemmata_railway_gun_equipment_1_desc: "게헨나와 아비도스 협력의 증거인 이 거대한 무기는 타의 추종을 불허하는 힘과 500km반경의 타격반경에 대한 고도의 정밀성을 지닌 완벽한 비대칭전략병기로써 우리 국가에 강력한 패권을 가져다 줄 것입니다."
