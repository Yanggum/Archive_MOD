 ABY_BA_sp_mystic_syemmata_railway_gun: "셰마타 열차포"
 BA_sp_mystic_syemmata_railway_gun_desc: "게헨나와 아비도스 협력의 증거인 이 거대한 무기는 타의 추종을 불허하는 힘과 500km반경의 타격반경에 대한 고도의 정밀성을 지닌 완벽한 비대칭전략병기로써 우리 국가에 강력한 패권을 가져다 줄 것입니다."

 UCAV_equipment: "공격 무인기"
 UCAV_equipment_desc: "청휘석을 이용한 반도체와 동력 장비를 이용하여 설계한 초고고도 공격 무인기는 인간 조종사가 필요하지 않으며, 관찰 불가능한 하늘 너머에서 지상 공격을 수행할 수 있습니다."
