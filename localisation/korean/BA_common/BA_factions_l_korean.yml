 # 이 아래로 faction manifests 있다.

 pax_trinica_goal_name: "트리니티에 의한 평화"
 pax_trinica_goal_desc: "대전이 사태는 총학생회의 무능함을 여실히 드러냈습니다. 미소노 미카의 지도 아래 위대하고도 공정한 두 번째 트리니티는 전 키보토스를 단결시킬 수 있는 유일한 학원입니다."
 gehenna_supremacy_goal_name: "게헨나 우월주의"
 gehenna_supremacy_goal_desc: "게헨나의 질서를 키보토스 전체에 널리 퍼트리고, 키보토스를 게헨나의 깃발 아래에 통합하는 것이야말로 게헨나 연합의 가장 큰 목적입니다."
 protection_of_the_old_trinity_order_goal_name: "전통과 질서의 수호자"
 protection_of_the_old_trinity_order_goal_desc: "트리니티와 그 동맹국들은 대전이 이전부터 내려오는 오랜 전통을 수호하고, 인류 국가들의 질서에 굴복하지 않고, 자매애에 근거한 키보토스계의 문화와 사상을 유지해야 한다고 주장합니다."
 pan_arabism_goal_name: "아랍의 통일"
 pan_arabism_goal_desc: "아랍 민족은 여러 외세에 의해 분열되어 왔습니다. 이제 우리가 그들을 하나로 뭉쳐 단결시킬 시간입니다!"
 gsc_supremacy_goal_name: "키보토스 통제"
 gsc_supremacy_goal_desc: "총학생회는 마땅히 총학생회라는 이름에 걸맞는 책임과 의무를 지어야 하고 그 책임과 의무가 이행될 키보토스가 총학생회의 통제를 받아야만 한다는 운명은 바뀌지 않습니다. 대전이라는 말도 안되는 일의 가정이 있다고 하더라도요."
 FRA_BA_buffer_zone_security_goal_name: "완충지대 확보"
 FRA_BA_buffer_zone_security_goal_desc: "프랑스는 위협에 가장 직접적으로 노출되어 있습니다. 우리는 주변 주를 병합하고 완충지대를 확보하여 프랑스 안보를 확인하고, 유럽의 가장 강력한 패권국으로 도약할 것입니다."
 BA_liberation_of_all_europe_name: "전유럽 해방"
 BA_liberation_of_all_europe_desc: "대전이 사태 이후 벌어지는 전유럽적인 반민주적이고 부르주아적이며 제국주의적인 착취들을 모두 근절하고 해방된 유럽을 정당하게 선포해야 합니다."

 # 목표들
 ## 초기 목표
 one_trinity_goal_name: "하나의 트리니티"
 one_trinity_goal_desc: "미완성된 제1차 공의회의 유산을 끊어내기 위해 아리우스 분교의 합병이 필요한 시점입니다. 이는 트리니티의 진정한 통일이자 트리니티 학생들에게 위대한 날이 될 것입니다."

 ## 중기 목표
 goal_TRN_defeat_gehenna_name: "게헨나 도시 장악"
 goal_TRN_defeat_gehenna_desc: "게헨나의 전쟁 수행 능력을 깎아내기 위해 우리가 할 수 있는 것은 적군의 핵심 도시를 점령하는 것입니다. 특히 중앙구와 남구를 비롯한 적들의 주요 거점을 장악하게 된다면 적들의 전쟁 의지가 꺾일 것입니다."
 goal_gehenna_defeat_trinity_name: "트리니티 거점 장악"
 goal_gehenna_defeat_trinity_desc: "트리니티의 중요 거점들은 게헨나 연합이 전략적으로 노릴 수 있는 가장 적절한 지역들입니다. 가장 중요한 공격 목표는 에덴이지만, 에덴 주변의 중요 도시들까지 모두 함락되어야만 트리니티의 패배가 확실시 될 것입니다."
 goal_GEH_TRM_defeat_gehenna_name: "만마전 야망 분쇄"
 goal_GEH_TRM_defeat_gehenna_desc: "판데모니움 소사이어티의 중요 도시인 게헨나 중앙구와 주변 거점들을 장악하는 것은, 우리의 군사 작전 계획에서 가장 중대한 목표입니다. 판데모니움 소사이어티의 깃발이 중요 거점 지역에서 다시는 휘날리지 않게 합시다."
 goal_LUX_defeat_gehenna_name: "게헨나 도시 장악"
 goal_LUX_defeat_gehenna_desc: "룩셈부르크 주도의 게르만 연합공국의 수립을 위하여, 그리고 우리 동맹들의 항구적인 안보 문제 해결을 위하여 게헨나의 중요 도시들은 반드시 점령되어야만 합니다. 가장 중요한 공격 목표는 게헨나 중앙구이지만, 중앙구 주변의 중요 도시들까지 모두 함락되어야만 게헨나의 패배가 확실시될 것입니다."
 faction_goal_FRA_BA_restoration_of_france_treaty_of_paris_name: "파리 조약 당시 국경 복원"
 faction_goal_FRA_BA_restoration_of_france_treaty_of_paris_desc: "이계인들에게 짓밟힌 프랑스 영지를 정당하게 수복하는 것이 바로 새로운 프랑스의 사명이자, 마땅히 누려야 할 권리입니다."
 COLLECTION_STATES_TO_1930_FRA: "지배중이지 않은 파리 조약 당시의 프랑스 영토"
 COLLECTION_FACTION_all_states_to_1930_france: "파리 조약 당시 프랑스 영토"
 COLLECTION_FACTION_CONTROLLED_all_states_to_1930_france: "파리 조약 당시 프랑스 영토"

 ## 후기 목표
 faction_goal_no_trinity_in_gehenna_name: "게헨나 영토의 무결성"
 faction_goal_no_trinity_in_gehenna_desc: "게헨나가 트리니티의 전쟁 기계와 맞서게 된 지금, 트리니티의 거친 파도로부터 우리 영토의 상실을 회복해야만 합니다. 게헨나 영토는 하나되어, 다시는 트리니티의 침략 야망 앞에 무너지지 않을 것입니다."
 COLLECTION_NO_TRINITY_IN_GEHENNA: "게헨나 본토에서 트리니티와 그 동맹이 지배하는 주"
 faction_goal_true_eden_treaty_name: "만마전 야망에 맞선 단결"
 faction_goal_true_eden_treaty_desc: "게헨나와 트리니티 사이의 전쟁이 벌어진 지금, 티파티의 호스트는 선도부와의 동맹 협상을 통해 만마전을 지리적으로 고립시키고, 남-동 양방향에서 게헨나 중앙구를 노리는 대전략을 고민하고 있습니다."


 faction_goal_FRA_restoration_of_natural_borders: "라인강 서안 병합"
 faction_goal_FRA_restoration_of_natural_borders_desc: "프랑스의 다음 목표는 응당히 라인강 서안을 병합하고, 거대한 프랑스 패권을 설립해 유럽 전체가 프랑스의 이름으로 움직이는 옛 체제를 다시 한번 부활시키는 데에 있습니다."
 COLLECTION_FRA_IN_NATURAL_BORDERS: "라인강 서안의 자연 국경중 프랑스가 지배하지 않는 주"