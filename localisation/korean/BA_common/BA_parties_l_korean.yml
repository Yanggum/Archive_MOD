 COU_democratic_party:0 "통괄실"
 COU_democratic_party_long:0 "통괄실\n§g통괄실은 총학생회를 통괄-조율하는 부서로서 수석 행정관이 실장의 역할을 합니다. 즉, 통괄실은 행정위원회의 심장과도 같습니다.§!"
 COU_communism_party:0 "교통실"
 COU_communism_party_long:0 "교통실\n§g교통실은 혼잡한 키보토스 교통에서 핵심적인 역할을 합니다. 빈번한 현금 수송 차량 탈취, 열차 테러, 기타 등등등 잡다한 일들을 처리하는 일을 주력으로 합니다.§!"
 COU_fascism_party:0 "방위실"
 COU_fascism_party_long:0 "방위실\n§g방위실은 키보토스 방위에서 빠질 수 없는 부서입니다. 총기와 화기의 개인적인 소유가 당연시하게 여겨지는 키보토스의 질서와 치안을 유지하는 일을 주력으로 합니다.§!"
 COU_neutrality_party:0 "재무실"
 COU_neutrality_party_long:0 "재무실\n§g재무실은 정확한 세무처리와 재무관리를 기반으로 하는 부서로서 총학생회의 예산을 설정하고 배분하며 특정 부서가 멋대로 일을 처리할 수 없도록 합니다.§!"
