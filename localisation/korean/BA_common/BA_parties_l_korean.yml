 MIKA_FASCISM_SHORT:0 "티파티"
 MIKA_FASCISM_LONG:0 "티파티 - 파테르 분파\n§g제1차 공의회 이후, 파테르 분파는 군국주의적 색채가 사라지며 겉만 남은 보수주의, 엘리트주의, 권위주의 집단으로 변질되었습니다. 그러나 대전이 사태와 트리니티의 역사적 특수성이 맞물리면서, 파테르 분파는 다시 제1차 공의회 이전의 모습으로 돌아갔습니다. 이러한 변화는 단순한 우연이 아니라, 최초의 파테르 분파 수장이 가졌던 뜻의 연장선상에 있습니다. 현 수장 미소노 미카 또한 이 흐름을 이어받아, 위대하고 공정한 트리니티를 건설하겠다는 확고한 의지를 품고 있습니다. '트리니티는 스스로를 구원할 것이다'§!\n"
