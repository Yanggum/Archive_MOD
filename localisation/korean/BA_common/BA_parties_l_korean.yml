 trinity_social_liberal: "$Social_Liberalism$"
 trinity_social_liberal_desc: "사회자유주의는 진보적 자유주의 전통에 뿌리를 둔 체제로, 변화하는 시대적 요구에 맞춰 사회계약의 재구성을 추진합니다. 이는 정치·경제 전반의 구조적 개혁을 통해 시민의 실질적 자유를 공고히 수호하고 확장하는 것을 궁극적인 목적으로 합니다."
 
 theocracy_neutrality: "신정제"
 theocracy_neutrality_desc: "신정제, 또는 신권정치는 신의 대리인이 국가를 통치하는 형태의 국가입니다. 신정제 국가 역시 교황처럼 국가 지도자를 선거로 선출하기도 하지만, 신정제 국가의 지도자는 신에게서 권력을 위임받은 종교적 대리인이라는 점에서 국민주권을 따르는 민주공화국의 선출직 지도자와 차이를 보입니다."

