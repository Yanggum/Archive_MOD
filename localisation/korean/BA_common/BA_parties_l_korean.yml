 manyoshu_long:0 "만요슈"
 manyoshu_desc:0 "고서점이 가득 늘어선 골목 안쪽에 위치한 서고 형태의 기숙사. 기숙사 자체가 거대한 서고로 되어있어, 건물 안에는 수없이 많은 시와 노래, 이야기가 담긴 고서가 쌓여있는 모양. 게다가 기숙사 내부에도 거대한 고서점이 있다. 화려한 겉모습으로 오해받기 쉽지만, 이 기숙사의 학생들은 그저 시가와 풍류를 즐기는 자유로운 마음을 가진 자들일 뿐."
 singican:0 "신기칸"
 singican_noun:0 "신기칸"
 singican_desc:0 "카필라 최대 규모를 자랑하는 기숙사 중 하나로, 학생이 많은 만큼 상하관계나 규율도 비교적 엄격. 하지만 그 크기만큼이나 문제아도 많다."
 singican_long:0 "신기칸"
 uranotsukasa:0 "우라노츠카사"
 uranotsukasa_noun:0 "우라노츠카사"
 uranotsukasa_desc:0 "카필라에서 큰 영향력을 가진 거대 기숙사 중 하나로, 옛날에는 음양사를 길러내는 특수한 기숙사였다. 지금은 시대의 흐름과 함께 거의 사라졌지만, 긴 세월 동안 쌓인 음양사 양성소로서의 개성을 기숙사 곳곳에서 찾아볼 수 있다."
 uranotsukasa_long:0 "우라노츠카사"
 yunowka:0 "유노오카"
 yunowka_noun:0 "유노오카"
 yunowka_desc:0 "오래전 폐쇄되어 방치되어 있던 온천 숙소를 수리하여 기숙사로 이용하고 있다. 낡은 목조건물 때문에 기숙사생들의 원성이 자자하지만 그래도 대욕장만은 좋은 평판을 얻고 있다. 풍문으로는 기숙사 어딘가에 아주 멋진 노천탕이 숨겨져 있다나 뭐라나."
 yunowka_long:0 "유노오카"

