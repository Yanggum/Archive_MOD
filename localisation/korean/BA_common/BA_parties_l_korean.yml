 HEU_rechtspartei_party:0 "우파당"
 HEU_PRL_party:0 "급진자유당"
 HEU_PRL_party_long:0 "급진자유당\n§g급진자유당은 딱히 급진적이지도 자유주의적이지도 않은 정당이지만, 자기가 진보주의자라고 착각하는 중산층 도시민들이 시골 냄새 나는 우파당 대신 표를 던질 수 있는 매력적인 대안입니다. 1904년에 탄생한 이 정당은 원래 자유동맹(Liberale Liga)이라는 이름이었으나 룩셈부르크의 작은 자유주의자들이 이합집산을 반복하는 동안 계속해서 정당 이름을 새롭게 바꿨습니다. 30년간의 정치 생활 끝에 RLP는 좌깜빡이를 키며 우회전하는 방법으로 룩셈부르크의 우편향된 정계에서 생존할 수 있다는 것을 깨달았으며, 대전이 이전까지 우파당의 정책에 찬성표를 던지며 자그마한 연립여당으로 룩셈부르크식 급진자유주의 이상을 펼쳤습니다.§!"
 HEU_LSAP_party:0 "룩셈부르크 노동자당"
 HEU_LSAP_party_long:0 "룩셈부르크 노동자당\n§g룩셈부르크의 사회주의 정당인 룩셈부르크 노동자당은 1902년 창설되었지만, 실질적으로 정치적 영향력을 얻게 된 것은 보통선거권이 도입된 1919년 이후였습니다. 룩셈부르크 노동자당은 소련에 대한 관점 차이로 분당한 룩셈부르크 공산당과 달리 소비에트 연방과 스탈린주의를 반대하며 '노동조합과 당의 분리, 자율성'을 주장했습니다.§!"
 HEU_grand_coalition_party:0 "거국일치내각"
 HEU_grand_coalition_party_long_1:0 "흥신소 68/우파당/급진자유당/룩셈부르크 공산당 대연정"
 HEU_grand_coalition_party_long_2:0 "흥신소 68/연방생도연맹/급진자유당/룩셈부르크 공산당 대연정"
 HEU_volksdeutsche_party:0 "독일민족운동"
 HEU_volksdeutsche_party_long:0 "독일민족운동\n§g룩셈부르크의 그리스어 교사인 다미안 크라첸베르크가 이끄는 독일민족운동은 1930년대 초 룩셈부르크의 국가사회주의 운동인 GEDELIT를 계승하는 나치즘 정치세력입니다. 다미안 크라첸베르크는 룩셈부르크인들이 도이치와 동일한 민족이라는 이상을 지지하였으나, 이 독일민족운동은 룩셈부르크의 전통적 우익 세력에게는 반대받았습니다.§!"
 HEU_pro_kayoko_party:0 "룩셈부르크군"
 HEU_pro_kayoko_party_long:0 "룩셈부르크군\n§g쿠데타 사건 이후 룩셈부르크군은 분열되었습니다. 리쿠하치마 아루를 지지하는 왕당파 세력은 오니카타 카요코를 룩셈부르크의 새로운 총리로 선언한 이후, 무츠키 내각이 불법적이라고 선언하고 게릴라전을 시작했습니다. 그들이 충성스러운 왕당파이자 아루의 지지자라는 것은 분명하지만, 그것이 그들이 민주적이거나 자유주의적임을 의미하는 것은 아닙니다.§!"
 HEU_pro_mutsuki_party:0 "비상정부"
 HEU_pro_mutsuki_party_long:0 "무츠키 내각"
 HEU_pro_mutsuki_party_trinity:0 "티파티"
 HEU_pro_mutsuki_party_trinity_long:0 "티파티\n§g아사기 무츠키는 소위 '소악마'라는 그녀의 별명만큼 예측할 수 없는 인물입니다. 전산으로 기록된 자료가 대전이 이후 혼란 속에서 소실되었기 때문에 '나는 게헨나계가 아닌 트리니티에서 보낸 정보원 출신'이라는 그녀의 주장과 '룩셈부르크 호스트'를 주장하는 그녀의 기행을 그 누구도 합리적인 근거와 자료를 통해 부정하지 못합니다. 티파티는 특별한 이념으로 움직이기보다는 아사기 무츠키의 변덕과 룩셈부르크 대중들에 영합하는 탈이념적 대중주의 정책을 통해 운영됩니다.§!"
 HEU_pro_mutsuki_party_gehenna:0 "게헨나 과도혁명정부"
 HEU_pro_mutsuki_party_gehenna_long:0 "게헨나 과도혁명정부\n§g아사기 무츠키는 소위 '소악마'라는 그녀의 별명만큼 예측할 수 없는 인물입니다. 전산으로 기록된 자료가 대전이 이후 혼란 속에서 소실되었기 때문에 '내가 대전이 혼란 속에서 되돌아온 뇌제'라는 그녀의 주장을 그 누구도 합리적인 근거와 자료를 통해 부정하지 못합니다. 게헨나 과도혁명정부는 특별한 이념으로 움직이기보다는 아사기 무츠키의 변덕과 룩셈부르크 대중들에 영합하는 탈이념적 대중주의 정책을 통해 운영됩니다.§!"

 HEU_mutsuki_path_ending_neutrality_party_long:0 "리쿠하치마 가문\n§g대전이 이후 룩셈부르크는 중부 유럽에서 키보토스계의 침략을 받은 국가들 중 유일하게 주권과 영토를 보존할 수 있는 국가가 되었습니다. 아사기 내각 쿠데타 사건 이후에도 왕당파는 더욱 굳건해졌으며, 자유주의 정당인 급진자유당의 주류 세력이 리쿠하치마 아루의 열렬한 지원자가 되어 주고 있습니다.§!"
 HEU_mutsuki_path_ending_generic:0 "3개국 연석회의"
 HEU_mutsuki_path_ending_generic_long:0 "룩셈부르크-게헨나-트리니티 연석회의\n§g룩셈부르크와 게헨나, 트리니티 학원 3개국의 대표들로 이루어진 과두제 정부는 연합법에 따라 각자 대표를 파견하여 총리를 선출했습니다. 민주적 절차에 따른 새로운 총리가 선출되기 전까지, 연석회의는 게르만 연합공국의 사실상 유일한 정통성 있는 정치 세력입니다.§!"
 HEU_mutsuki_path_ending_gehenna:0 "무지개 연정"
 HEU_mutsuki_path_ending_gehenna_long:0 "룩셈부르크 공산당-독일민족운동-급진자유당-게헨나 독립당\n§g무지개 연정이라고 불리는 좌우익 대연정은 극좌 공산당부터 극우 독일민족운동까지 다양한 정당들이 분포되어 있습니다. 무지개 연정은 그 이념간의 차이, 그리고 룩셈부르크, 도이칠란트, 게헨나 세 민족의 이익을 위해 서로 충돌하기 때문에 연정 내부의 사이는 그다지 좋지 않습니다. 그들을 하나로 묶는 유일한 정체성은 리쿠하치마 아루라는 상징적 지도자입니다.§!"
 HEU_mutsuki_path_ending_haruka_long:0 "룩셈부르크 공산당-독일민족운동-급진자유당-게헨나 독립당\n§g무지개 연정이라고 불리는 좌우익 대연정은 극좌 공산당부터 극우 독일민족운동까지 다양한 정당들이 분포되어 있습니다. 무지개 연정은 그 이념간의 차이, 그리고 룩셈부르크, 도이칠란트, 게헨나 세 민족의 이익을 위해 서로 충돌하기 때문에 연정 내부의 사이는 그다지 좋지 않습니다. 특히, 하루카의 게헨나 혐오 문제로 인해 그들을 하나로 묶는 아슬아슬한 정체성인 리쿠하치마 아루의 존재가 연정을 불안하게 유지하고 있습니다.§!"
 HEU_mutsuki_path_ending_trinity:0 "흑백 연정"
 HEU_mutsuki_path_ending_trinity_long:0 "기독사회인민당-판데모니움 소사이어티-구호기사단\n§g트리니티와 게헨나 두 학원의 굳건한 동맹, 그리고 기독교 민주주의 성향의 기독사회인민당의 연합으로 이루어진 흑백 연정은, 게헨나와 트리니티라는 두 적대적 학원의 연합임에도 불구하고 깊은 우정으로 묶여져 있습니다. 판데모니움 소사이어티는 정치적 이념 없이 그저 자신들의 사적인 이익을 얻고 싶어 할 뿐이기 때문에, 실질적인 국가 정치는 가톨릭 보수주의 성향에 가까운 정치 세력들이 이끌어가기 때문입니다. 리쿠하치마 아루에 대한 왕당파적 성향과 함께, 흑백 연정은 사회의 급격한 변화를 부정하는 사회보수주의 이념을 실현하고자 합니다.§!"

 HEU_permanent_mandates_commission:0 "PMC"
 HEU_permanent_mandates_commission_long:0 "국제연맹 상임위원회\n§g1920년 창설된 국제연맹 상임위원회는 국제연맹 위임통치령 지역이 독립을 이룰 때까지 그 지역을 관리합니다. 비록 PMC에 대한 피식민 국가들의 평가가 상당히 나쁘며, 위임통치가 실제로 구 식민국가를 독립시킬 의지가 있는 지도 논쟁거리이기는 하나, PMC는 이 지역에 집권할 수 있는 가장 공정한 대안 세력일 것입니다.§!"
 gehenna_local_neutrality_puppet_party:0 "현지 민족주의자들"
 gehenna_local_democratic_puppet_party:0 "현지 자치정부"

 SHA_democratic_party:0 "현무상회 중앙파"
 SHA_democratic_party_long:0 "현무상회 중앙파\n§g현무상회는 키보토스 전역의 식자재가 모이는 중심지이자 강력한 영향력을 가진 상인 연합체입니다. 키보토스 전역과 활발하게 무역을 이어가면서 자연스럽게 개방적인 성격을 띠게 되었으며, 이러한 이유로 인해 현룡문의 지속적인 견제를 받고 있습니다.\n\n그중에서도 중앙파는 급진파와 달리 폭력적 수단을 배제하며, 자유민주주의와 시장경제 체제를 유지한 상태에서 점진적인 개혁을 통해 진보적 이상을 실현하는 방향을 추구하고 있습니다.§!\n"
 SHA_neutrality_party:0 "현룡문"
 SHA_neutrality_party_long:0 "현룡문 중앙파"
 SHA_communism_party:0 "현무상회 좌파"
 SHA_communism_party_long:0 "현무상회 좌파\n§g현무상회는 키보토스 전역의 식자재가 모이는 중심지이자 강력한 영향력을 가진 상인 연합체입니다. 키보토스 전역과 활발하게 무역을 이어가면서 자연스럽게 개방적인 성격을 띠게 되었으며, 이러한 이유로 인해 현룡문의 지속적인 견제를 받고 있습니다.\n\n현무상회 좌파는 현룡문의 지속적인 견제와 제재에 지친 이들이 결집하면서 탄생하였습니다. 이들은 현룡문이 더 이상 개혁 의지를 가지고 있지 않다고 판단하며, 점진적인 변화로는 한계가 있다고 주장합니다. 따라서 현 체제를 완전히 뒤엎어야 한다는 입장을 고수하고 있습니다.\n§!"
 SHA_communism_party_1: "현무상회"
 SHA_communism_party_1_long: "현무상회\n§g현무상회는 키보토스 전역의 식자재가 모이는 중심지이자 강력한 영향력을 가진 상인 연합체입니다. 키보토스 전역과 활발하게 무역을 이어가면서 자연스럽게 개방적인 성격을 띠게 되었으며, 이러한 이유로 인해 현룡문의 지속적인 견제를 받고 있습니다. 이들은 현룡문이 더 이상 개혁 의지를 가지고 있지 않다고 판단하며, 점진적인 변화로는 한계가 있다고 주장합니다. 따라서 현 체제를 완전히 뒤엎어야 한다는 입장을 고수하고 있습니다.\n§!"
 SHA_communism_party_BfG: "자유조합연대"
 SHA_communism_party_BfG_long: "자유조합연대\n§g현무상회 내 급진좌익 계열은 오스트로 맑시즘의 수용 이후 현무상회를 해소하고 오스트리아의 자유노조연맹 잔당과 협력하여 이 땅에 변혁을 불러오고자 하고 있습니다. 현룡문이 더 이상 개혁 의지를 가지고 있지 않다고 판단하며, 사회주의를 향한 급진적인 변화로 현 체제를 완전히 뒤엎어야 한다는 입장을 고수하고 있습니다.\n§!"

 SHA_fascism_party:0 "경극부"
 SHA_fascism_party_long:0 "경극부"

 SHA_peking_opera_blackdragon_cop:0 "현룡문"
 SHA_peking_opera_blackdragon_cop_long:0 "현룡문\n§g산해경의 명목상 전권은 류우게 키사키에게 있지만, 실질적인 권력의 중심은 다릅니다. 현재 경극부장이자 현룡문의 비선 실세인 우루시바라 카구야야말로 산해경 권력의 실체라 할 수 있습니다.\n\n모두가 류우게 키사키를 찬양하지만, 그녀는 이제 우루시바라 카구야의 명령을 수행하는 얼굴마담에 불과합니다. 산해경을 이끄는 진정한 힘은 보이지 않는 곳에서 조용히, 그러나 확고하게 움직이고 있습니다.§!\n"
 SHA_Peking_Opera_Club:0 "경극부-현룡문"
 SHA_Peking_Opera_Club_long:0 "경극부-현룡문\n§g현재 경극부는 혁명을 통하여 류우게 키사키의 권력을 전부 이양받았습니다. 또한 행정 공백이 생기는 것을 막기 위하여 현룡문의 부원들을 전부 흡수한 결과 경극부와 현룡문의 기이한 협력 체제가 탄생 하였습니다.§!\n"
 SHA_Radical_party:0 "산해경 급진파"
 SHA_Radical_party_long:0 "연단방-산해경 급진파\n§g연단방의 숨어있는 신타니 카이의 추종자들이 일부 현룡문의 급진파들과 손을 잡았다는 소문이 퍼지고 있었고 지난 경극부의 혁명으로 이는 사실로 들어났습니다. 이들은 주로 신타니 카이와 협력하여 산해경에 새로운 사상을 주입하기 위해 노력하고 있습니다.§!\n"
 SHA_Shintani_KAI_party:0 "신 연단방"
 SHA_Shintani_KAI_party_long:0 "신 연단방 - 신타니주의\n§g신타니주의는 새로운 산해경의 지배 이념으로, 그 이름에서 알 수 있듯이 신타니 카이가 직접 주창한 사상입니다. 신타니 카이와 함께 연구를 진행했던 소규모 단체와 현룡문과 반대되는 새로운 지배 이념을 모색하기 시작하였고, 지속적인 연구 끝에 신타니주의가 탄생하였습니다.\n\n이 이념은 전통을 거부하는 진보적인 운동인 동시에, 극단적인 엘리트주의를 기반으로 국가적 통제를 강화하는 기술가속주의를 주장합니다. 신타니주의는 혁신과 기술 발전을 국가 운영의 핵심 원칙으로 삼으며, 기존 질서를 완전히 재편하는 것을 목표로 하고 있습니다.§!\n"
 
