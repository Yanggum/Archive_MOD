 HEU_democratic_party:0 "우파당 - 혁신파"
 HEU_democratic_party_long:0 "우파당 - 혁신파\n§g우파당 내부 파벌인 혁신파는 보수파와 달리 보통선거권을 비롯한 현대적 민주제를 부정하지 않으며, 가톨릭 이념에 기반한 기독교 민주주의 정치를 실현하고자 합니다. 우파당은 룩셈부르크의 전통적인 농민, 가톨릭 기반 우익 정당이었습니다.§!"
 HEU_communism_party:0 "룩셈부르크 공산당"
 HEU_communism_party_long:0 "룩셈부르크 공산당\n§g룩셈부르크 공산당은 좌익 정당인 룩셈부르크 사회주의노동자당과의 노선 대립 끝에 1921년 분리 독립을 선언한 스탈린주의 극좌 정당입니다. 룩셈부르크 남부 철강업, 광업 노동자들 사이에서 높은 인기를 얻고 있지만, 1934년 선거까지 여당인 우파당에 의해 국회의원에 당선되더라도 (의원 제명 절차를 통해) 국회에 진입하는 것이 금지되어 왔습니다.§!"
 HEU_fascism_party:0 "GEDELIT"
 HEU_fascism_party_long:0 "독일 문학 및 예술 협회\n§g룩셈부르크의 그리스어 교사인 다미안 크라첸베르크가 이끄는 GEDELIT는 단순한 '문학 협회'의 개념을 넘어 룩셈부르크와 도이칠란트 두 국가의 문화적 동질성, 그리고 룩셈부르크가 도이칠란트의 일부로 편입되어야 한다는 범게르만주의적 내셔널리즘을 설파하였습니다. GEDELIT는 1931년 우익 대중주의 정당인 독립국가당을 흡수 합병하면서 그 규모를 크게 키웠으며, 1930년대 룩셈부르크 극우 운동의 중심이 되었습니다.§!"
 HEU_neutrality_party:0 "리쿠하치마 가문"
 HEU_neutrality_party_long:0 "흥신소 68/우파당 연립정부\n§g대전이 이후 룩셈부르크는 중부 유럽에서 키보토스계의 침략을 받은 국가들 중 유일하게 주권과 영토를 보존할 수 있는 국가가 되었습니다. 룩셈부르크 섭정인 리쿠하치마 아루는 다소 이상주의적인 게헨나계와 룩셈부르크계의 통합을 주장하고 있지만, 우파당은 리쿠하치마 섭정을 매우 조심스럽게 지지하면서도 그녀의 통합주의 운동이 우파당의 지지율을 떨어뜨리고 있다는 것을 매우 불편한 시선으로 바라봅니다.§!"

