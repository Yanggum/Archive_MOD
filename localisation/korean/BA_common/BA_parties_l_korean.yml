 # 트리니티 괴뢰국 정당명
 TRN_puppet_party_name:0 "트리니티 군민행정부"
 TRN_puppet_party_name_long:0 "트리니티 군민행정부"
 # 트리니티가 트리니티 학생을 지도자로 유지한다면 이 정당명이 활용 됩니다.
 BAUKR_fascism_party_long:0 "우크라이나 민족주의자 조직 (멜니크 파벌)\n§g크라이나 민족주의자 조직, 통칭 OUN은 빈에서 설립되어 갈리치아 지역을 중심으로 활동했습니다. 초창기 OUN은 여러 군소 우익 단체들과 협력하며 세력을 확장해 나갔습니다. 트리니티와 러시아 사이에 전쟁이 발발했을 때, 안드리 멜니크의 주도적인 협력 노력 끝에 비록 트리니티의 괴뢰국이었지만 우크라이나인들의 국가가 수립되었습니다. 그러나 반데라를 중심으로 한 OUN-B 세력은 트리니티 또한 우크라이나 독립에 진정한 관심이 없음을 깨닫고 테러 공격을 감행했습니다. 하지만 정의실현부의 토벌 끝에 OUN-B 세력은 결국 역사의 뒤안길로 사라지고 말았습니다.§!\n"
 BAUKR_fascism_party:0 "OUN-M"
 BABLR_fascism_party:0"벨라루스 중앙 라다"
 BABLR_fascism_party_long:0 "벨라루스 중앙 라다\n§g학원정보원 국장은 광대한 벨라루스 지역을 효과적으로 통치하기 위해 한 가지 제안을 내놓았고, 그 결과 설립된 벨라루스 중앙 라다는 해당 지역을 관리하는 목적을 지니고 있습니다. 현지 협력자인 라다슬라우 아스트로우스키를 중심으로 세워진 이 기구는 벨라루스의 완전한 독립을 꿈꾸고 있으나, 그 미래는 어둡기만 합니다...§!\n"
 BASOV_fascism_party_russian:0 "$SOV_fascism_party_russian$\n§g전러시아 파시스트당의 당수 콘스탄틴 로자옙스키는 야심 넘치는 청년 정치인이었습니다. 그는 활동 초기부터 백계 러시아인 지식인들과 접촉하며 세력을 확장했고, 소련에서 반정부적 테러 활동을 벌이는 등 영향력을 키워 나갔습니다. 트리니티가 소련을 정복하고 적절한 현지 협력자를 물색하는 과정에서 전러시아 파시스트당은 자연히 눈에 띌 수밖에 없었습니다. 트리니티와의 접촉 끝에 로자옙스키는 동방 신성통치령의 지도자로 발탁되었고, 마침내 모국 러시아를 이끌게 되었습니다. 그러나 그 이면에서 트리니티가 자신들을 조종하며 어머니 러시아를 병들게 하고 있다는 사실은 알지 못한 채였습니다.§!\n"
 BATR2_fascism_party:0 "FGCDNI"
 BATR2_fascism_party_long:0 "국익 수호를 위한 프랑스 정부 위원회\n§g국익 수호를 위한 프랑스 정부 위원회는, 트리니티가 밀레니엄을 침공하자 프랑스를 복원하려는 정치인들이 트리니티에 기대어 모여 탄생한 기구입니다. 이들은 트리니티의 지원 아래 프랑스 시민을 보호하고 재산을 지키는 등 여러 국익을 위해 활동하고 있으나, 실상은 트리니티의 명령을 거역할 수 없어 준 괴뢰 정부로 취급받고 있습니다. 또한 북프랑스 지역은 트리니티가 직접 관할하고 있어, 위원회의 실제 영향력은 남부에만 제한되어 있습니다.§!\n"



