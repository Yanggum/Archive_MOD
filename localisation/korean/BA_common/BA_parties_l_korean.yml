 TRM_mika_unconfirmed_party:0 "§g[비인가]§!"
 TRM_mika_unconfirmed_party_long:0 "[비인가된 조직]\n§g미소노 미카가 권력을 찬탈하고 미소노 미카의 주도 아래 새로운 헌법이 통과되자 다른 분파는 파테르 분파의 조직적인 탄압 아래 스스로 해산하거나 아니면 강제로 해산당했습니다. 그럼에도 지하에서 활동하며 파테르 분파를 끌어내리기 위해 움직이는 이들도 있지만 이마저도 현실에 대한 갈 곳 없는 분노의 표출에 불과합니다.§!\n"

 TRM_nagi_nagi_democratic_party:0 "티파티 - 필리우스 분파"
 TRM_nagi_nagi_democratic_party_long:0 "티파티 - 필리우스 분파\n§g필리우스 분파의 반대중주의, 귀족적 면모는 대전이 이후 파테르 분파와의 정치적 분쟁 끝에 점점 심화되었습니다. 전통의 수호, 고결한 트리니티 신앙의 보존, 그리고 대전이 이전 에덴 조약의 횃불을 계승하는 범키보토스주의는 필리우스 분파를 상징하는 세 개의 기둥입니다.§!"
 TRM_nagi_nagi_neutrality_party:0 "티파티 - 필리우스 분파"
 TRM_nagi_nagi_neutrality_party_long:0 "티파티 - 필리우스 분파\n§g필리우스 분파의 반대중주의, 귀족적 면모는 대전이 이후 파테르 분파와의 정치적 분쟁 끝에 점점 심화되었습니다. 일부 강경파들은 온건 세력에 비해 더욱 엘리트주의적 성향을 가집니다.§!"
 TRM_nagi_nagi_fascism_party:0 "티파티 - 파테르 분파"
 TRM_nagi_nagi_fascism_party_long:0 "티파티 - 파테르 분파\n§g파테르 분파는 트리니티의 대중주의적 야당으로서, 1936년의 호스트 선거에서 패배한 이후에도 가장 큰 야당으로서 영향력을 행사합니다. 그녀들의 트리니티 사회주의, 변화하고 개혁되어, 대중을 위해 복무하는 두 번째 트리니티 주장은 여전히 트리니티 엘리트주의의 가장 큰 위협입니다.§!"
 TRM_nagi_nagi_communism_party:0 "독일 공산당"
 TRM_nagi_nagi_communism_party_long:0 "독일 공산당\n§g대전이 이후 트리니티에서 활동하는 현지인 세력입니다.§!"
 
