 ABY_democratic_party_2_long:0 "국민사회민주당\n§g국민사회민주당은 체코 국민사회당과 오스트리아 사회민주당을 주축으로 결성된 범중도 빅텐트 정당이며, 토마시 마사리크의 제자이자 후계자 중 하나인 에드바르트 베네시가 이끌고 있습니다. 하지만 민주주의 빅텐트라는 선전과 알맞지 않게 조국전선 등 파시스트 정당과의 연계를 추진하고 있어 일부 좌익 정당이 이탈하고 국민의 의심을 사는 등 여러 문제가 발생하고 있습니다.§!"
 ABY_communism_party_2_long:0 "연방통합당\n§g연방통합당은 연립정부 삼두정의 키보토스계 대표였던 타카나시 호시노가 해방작전의 성공 이후 키보토스와 현지의 좌익 정당을 규합해 만든 정당이며, 폭넓은 복지제도와 친 노동자-농민 정책으로 하류층의 큰 지지를 받고 있습니다. 다만, 군주제 사회주의라는 특이한 사상을 내세우고 있어 지식인들의 지지를 받는 것은 쉽지 않아 보입니다.§!"
 ABY_fascism_party_2_long:0 "계몽회\n§g군내 비밀결사조직, 계몽회에 대한 음모론은 이전부터 있어 왔으나 콘라트 헨라인이 당내 나치 세력을 척결하는 과정에서 그것이 실존함이 드러났습니다. 하지만 제거된 정보로 인해 그들이 무엇을 원하는지, 그들의 수장은 누구인지, 그 어느 것도 밝혀지지 않았습니다. 하지만 계몽회가 이 정부의 전복을 꾀한다는 사실만은 분명합니다. 군민 정보부는 이들을 수색하고 실체를 밝히는 데 주력하고 있으며, 그들의 음모를 사전에 처단하기 위해 노력 중입니다.§!"
 ABY_neutrality_party_2_long:0 "자유공화당\n§g자유공화당은 자유방임주의를 지지하는 민주주의 정당으로, 폭넓은 친 기업 정책과 재산세 감축 등으로 상류층에게 큰 인기를 끌고 있습니다. 기반도, 근본도 없는 정당이 원내로 입성하게 된 데에는 많은 추측이 있으나, 많은 정치인들은 3대 기업(네프티스, 슈코다, 로스차일드)의 입김이 들어간 것으로 추측하고 있습니다.§!"
 ABY_democratic_party_3:0 "국민사회자유당"
 ABY_communism_party_3:0 "아비도스 사회주의 연합"
 ABY_fascism_party_3:0 "연방민주공화당"
 ABY_neutrality_party_3:0 "군부"
 ABY_democratic_party_3_long:0 "국민사회자유당\n§g국민사회자유당은 국민사회민주당의 당수 에드바르트 베네시의 친위 쿠데타 시도 이후 와해된 국민사회민주당을 다시 규합하여 만들어진 빅텐트 정당입니다. 당수 오쿠소라 아야네는 혐오보다 사랑, 배척보다 포용을 말하며 내란범으로 취급되던 국민사회민주당의 구성 정당들을 받아들였으며, 파시즘에 대해 엄격히 반대하며 마사리크가 남긴 민주주의적 가치를 보존하기 위해 노력하고 있습니다.§!"
 ABY_communism_party_3_long:0 "아비도스 사회주의 연합\n§g타카나시 호시노가 창설한 좌익 빅텐트 정당입니다. '사회주의 연합'이라는 간판을 걸고 있으나, 실제로는 중도 우파의 온건 개혁 세력부터 극좌 공산주의자들까지 아우르는 거대한 정치 연합체입니다. 다양한 이념이 공존하는 만큼 내부 논쟁도 치열하지만, 호시노의 리더십과 '모두를 위한 복지와 평등'이라는 대의 아래 연방 최대의 정치 세력으로 군림하고 있습니다.§!"
 ABY_fascism_party_3_long:0 "연방민주공화당\n§g스나오오카미 시로코가 충성파 군인들과 시민군을 이끌고 스오우의 쿠데타를 진압한 후 창설한 정당입니다. 국가 수호의 영웅인 시로코를 중심으로 절대다수의 의석을 장악하여 사실상의 일당 독재 체제를 구축했습니다. 그러나 이들의 철권통치는 공포가 아닌 시민들의 열렬한 지지와 신뢰를 기반으로 하고 있으며, 강력한 추진력으로 혼란을 수습하고 연방을 이끌고 있습니다.§!"
 ABY_neutrality_party_3_long:0 "군부\n§g스오우의 쿠데타 당시 반란군에도, 저항군에도 가담하지 않고 침묵을 지켰던 직업 군인 파벌입니다. 이들은 군의 정치적 개입을 철저히 배제하며, 오직 국토 방위와 명령 수행이라는 군인 본연의 임무에만 집중합니다. 정권의 성향과 관계없이 현재 집권한 합법적인 정부에 절대적인 충성을 맹세하는 이들은, 정치적 격변기 속에서도 연방군을 지탱하는 흔들리지 않는 기둥입니다.§!"
 ABY_democratic_party_4:0 "세크메트단"
 ABY_communism_party_4:0 "§R해산됨§!"
 ABY_fascism_party_4:0 "진리의 키보토스 - 계몽을 위하여"
 ABY_neutrality_party_4:0 "네프티스 이사회"
 ABY_democratic_party_4_long:0 "세크메트단\n§g아사기리 스오우의 쿠데타 당시, 대책위원회 멤버 중 유일하게 체포를 피한 쿠로미 세리카가 결성한 저항 조직에서 출발한 정당입니다. 절망적인 상황 속에서도 굴하지 않고 동료 구출과 민주주의 수호를 위해 투쟁했던 이들은, 이제 연방의 자유와 정의를 상징하는 정치 세력으로 거듭났습니다. 과거의 투쟁심을 바탕으로 권위주의를 경계하며, 시민의 자유를 최우선 가치로 삼고 있습니다.§!"
 ABY_fascism_party_4_long:0 "진리의 키보토스 - 계몽을 위하여\n§g진리의 키보토스 - 계몽을 위하여는 아사기리 스오우가 조직한 범키보토스 민족주의 운동입니다. 진리의 키보토스-계몽을 위하여를 중심으로 키보토스 대부분의 학원들에 조직된 이 정당의 분파는 사회를 뒤흔들며 지속적으로 범키보토스주의 운동을 촉발하고 있습니다. 이 운동은 전체주의적 성격을 띄며 키보토스 민족의 영도자께 충성을 다하고 키보토스 민족의 발전과 낙원을 위해 나아가야 한다는 극우 포퓰리즘적 성격 역시 가지고 있습니다. 현지인들은 '키보토스인의 생활권' 등의 표어를 보며 몰락한 독일의 국가사회주의를 연상하고 두려워하고 있습니다.§!"
 ABY_communism_party_4_long:0 "§R해산됨§!"
 ABY_neutrality_party_4_long:0 "네프티스 이사회\n§g네프티스 이사회는 네프티스 그룹의 실질적 결정권자로, 대전이와 함께 회장이 실종된 이후 표면상으로는 다음 회장을 맡은 노노미가 최고 결정권자이나, 실권은 이사회에 넘어가 있습니다. 그럼에도 회장의 영향력은 무시할 수준이 아니기에, 회장과의 타협으로 균형을 맞추고 있습니다.§!"

