l_korean:
 #이데올로기#
 aicontrol:0 "인공지능 통제"
 aicontrol_desc:0 "고도로 발전한 인공지능이 국가 전체를 통제하는 중입니다. 인공지능의 자율적인 사고 판단에 따라 국가의 모든 정책이 결정됩니다."
 fascism_aicontrol:0 "인공지능 통제"
 fascism_aicontrol_desc:0 "고도로 발전한 인공지능이 국가 전체를 통제하는 중입니다. 인공지능의 자율적인 사고 판단에 따라 국가의 모든 정책이 결정됩니다."
 tea_party_fascism_ideology:0 "파테르 분파"
 tea_party_fascism_ideology_desc:0 "파테르 분파의 군국적이고 수장에 대한 절대적인 충성은, 지구에서 파시즘이 태동했던 것과 같이 수천 년 전 트리니티의 갈등에서 출발하였습니다. 이후 제1차 공의회로 트리니티의 분파들이 하나로 통합되는 '합의'를 거치고 나서 갈등이 사라지자 파테르 분파의 빛은 점점 바래지고 십자가와 함께 하나로 통합되어 있습니다."
 pater_nazism:0 "트리니티 사회주의"
 pater_nazism_desc:0 "트리니티 사회주의는 변화하는 세상 속에서 탄생한 트리니티의 고유한 사상입니다. 이 사상은 우익-초국가주의적 사상을 가지고 있으며 이들은 종종 급진적인 목표를 위해서 대중들의 힘을 동원하려 합니다. 전통적 민주주의에 혐오를 품고 구체제에 대한 대중의 경멸을 이용하기도 하는 이들은 많은 경우 사회의 주요한 문제를 해결하기 위해 절충주의적 영감에 의존합니다."
 tea_party_neutrality_ideology:0 "필리우스 분파"
 tea_party_neutrality_ideology_desc:0 "필리우스 분파는 전통적으로 티파티의 주도권을 가지고 트리니티를 지도하던 세력입니다. 이들은 주로 평화적인 방법을 추진하지만, 과거 트리니티를 통합하는 과정에서 여러 폭력적인 행동을 유도하는 등 트리니티를 위해서라면 과격한 행동도 서슴지 않을 이들입니다."
 emergency_military_government:0 "비상군사정부"
 emergency_military_government_desc:0 "총체적인 비상사태를 타파하기 위하여 군부가 직접적으로 정부에 개입하고 있습니다."
 The_Colour_democratic:0 "§0색채§! - §1이차원의 침략자§!"
 The_Colour_democratic_desc:0 "§0거대한 힘이 행성을 공격하고 있습니다.§!\n\n§1알 수 없는 이 미지의 힘은 세계를 침식시키며 접촉한 대상을 전과는 다른 존재로 뒤틀어 버리는 힘을 가지고 있습니다. 세계의 종말이 가까워진 것 같습니다.§!"
 The_Colour_communism:0 "§0색채§! - §1이차원의 침략자§!"
 The_Colour_communism_desc:0 "§0거대한 힘이 행성을 공격하고 있습니다.§!\n\n§1알 수 없는 이 미지의 힘은 세계를 침식시키며 접촉한 대상을 전과는 다른 존재로 뒤틀어 버리는 힘을 가지고 있습니다. 세계의 종말이 가까워진 것 같습니다.§!"
 The_Colour_fascism:0 "§0색채§! - §1이차원의 침략자§!"
 The_Colour_fascism_desc:0 "§0거대한 힘이 행성을 공격하고 있습니다.§!\n\n§1알 수 없는 이 미지의 힘은 세계를 침식시키며 접촉한 대상을 전과는 다른 존재로 뒤틀어 버리는 힘을 가지고 있습니다. 세계의 종말이 가까워진 것 같습니다.§!"
 The_Colour_neutrality:0 "§0색채§! - §1이차원의 침략자§!"
 The_Colour_neutrality_desc:0 "§0거대한 힘이 행성을 공격하고 있습니다.§!\n\n§1알 수 없는 이 미지의 힘은 세계를 침식시키며 접촉한 대상을 전과는 다른 존재로 뒤틀어 버리는 힘을 가지고 있습니다. 세계의 종말이 가까워진 것 같습니다.§!"
 technocracy:0 "기술관료정"
 technocracy_desc:0 "기술관료정은 과학기술과 전문성을 가진 기술관료가 사회를 관리하는 체제입니다. 일반적으로 기술관료들로 이루어진 위원회를 조직하는 과두정치로 통치가 이루어집니다."
 technocracy_communism:0 "기술관료 공산주의"
 technocracy_communism_desc:0 "기술관료정의 일종인 기술관료 공산주의는 과학기술과 전문성을 가진 기술관료가 사회주의 경제를 운영하는 체제입니다."
 technocracy_fascism:0 "기술관료적 질서정치"
 technocracy_fascism_desc:0 "키보토스인과 현지인간의 관계를 조정하고 '대전이 이전의 질서'를 구현하기 위해서는 강력하고 권위주의적이고 폐쇄적인 집단의 '공권 통치'가 필요합니다. 우리는 이를 위해 광범위한 사법력의 강화와 정부의 비밀주의화를 확대할 것입니다."
 artnocracy:0 "예술관료정"
 artnocracy_desc:0 "예술관료정은 기술관료정과 추구하는 가치는 다르지만 체제는 유사한 변종으로, 예술성과 전문성을 가진 예술관료가 사회를 관리하는 체제입니다. 일반적으로 예술관료들로 이루어진 위원회를 조직하는 과두정치로 통치가 이루어집니다."
 artnocracy_fascism:0 "예술관료적 질서정치"
 artnocracy_fascism_desc:0 "키보토스인과 현지인간의 관계를 조정하고 '대전이 이전의 질서'를 구현하기 위해서는 강력하고 권위주의적이고 폐쇄적인 집단의 '공권 통치'가 필요합니다. 우리는 이를 위해 광범위한 사법력의 강화와 정부의 비밀주의화를 확대할 것입니다."
 fascism_hitler:0 "국가 사회주의 노동자당"
 fascism_hitler_desc:0 "§R그가 돌아왔습니다!§!\n\n어찌 된 영문인지, 사라졌던 대 총통, 아돌프 히틀러가 아일랜드에서 발견되었습니다. 어떻게 사라진 히틀러가 다시 돌아올 수 있었는지는 의문이나, 지금은 그를 따를 때입니다.\n\nheil hitler!"
 tea_party_ideology:0 "트리니티 삼두정"
 tea_party_ideology_desc:0 "합의에 의한 과두정의 모습을 보이는 트리니티의 이 독특한 통치체계는, 정치권력에 대한 투쟁과 쟁취로써 이뤄집니다. 통치력의 행사는 §g파테르§!, §H필리우스§!, §G상투스§!의 세 분파의 수장이 각각 번갈아가면서 호스트를 맞는 티파티에 의해서 진행되며, 이는 학생과 대중들의 의견을 왜곡하고 파벌주의적 사고를 확산시키는 데에 특화되어 있습니다."
 hardboiled_noir:0 "리쿠하치마주의"
 hardboiled_noir_desc:0 "리쿠하치마주의는 현지 문화가 잔존하는 한 현지인과 키보토스인은 상호 공존이 불가능하며, 키보토스계와 현지인의 조화를 위해 인류 현지 문화의 완전한 말살, 강력한 국가무신론주의, 키보토스인의 단결이 필요하다고 주장하는 키보토스 범민족주의 이념입니다.\n\n'대전이' 당시 기존 체제의 붕괴가 이루어진 독일, 프랑스, 북유럽 등의 다른 지역들과 달리 룩셈부르크는 영토를 그대로 보존한 채 현지인들의 정당, 문화, 종교 체제가 그대로 유지되었습니다. 그렇기 때문에 룩셈부르크는 현지인들의 사회적 지위가 그대로 유지된 채 키보토스인들과의 공존을 시도한 드문 국가로 남았습니다.\n\n하지만 당시 룩셈부르크의 현지 정당인 우파당은 여성들로 이루어진 키보토스 학원들을 '열등하게' 바라보았으며, 현지 나치 추종자들과 가톨릭 세력 역시 키보토스인을 배척했습니다. 키보토스인과 현지인의 대등한 공존을 추진했던 아루의 이상은 현지 정치 세력들에게 짓밟히고 이용당했고, 인류에 대한 모든 희망을 버린 아루는 현지 문화의 완전한 해체만이 키보토스인을 지킬 수 있는 길이라 믿게 되었습니다.\n\n리쿠하치마주의의 범민족주의 이념과 별개로, 흥신소 68의 권력 체계는 리쿠하치마 아루를 중심으로 한 개인 독재로 이루어집니다."
 monarchist_socialism:0 "근왕사회주의"
 monarchist_socialism_desc:0 "사회주의 국가와 군주제는 일반적으로는 결합되지 않지만, 역사적으로 여러 타협의 결과로서 사회주의와 군주제의 공존이 논의되거나 심지어는 실현되기도 하였습니다. 첫 번째로는 군주주의자들에 비해 상대적으로 약소한 공산주의자들이 타협으로 공산화 이후에도 군주제를 용인하는 경우입니다. 1921년 몽골의 공산화 이후 1924년까지 복드 칸이 권력을 유지한 것이 대표적인 예시입니다.\n\n반대로 근왕사회주의는 강력한 공산주의 체제 아래에서 군주제를 부활시키기 위해, 군주주의자들이 공산주의자들에게 제시하는 타협책이 되기도 합니다. 소련의 군주제 운동인 믈라도로시는 소비에트 연방 공산주의 체제를 유지하되, 차르가 소비에트 연방의 상징이 되는 대안을 제시했습니다.\n\n마지막으로는 마르크스주의 자체가 개량을 반복하는 과정에서 군주제를 용인할 수 있을 만큼 온건해지는 경우가 있습니다. 살트셰바덴 협약 이후 자본주의자들과 사회주의자들의 타협을 통해 만들어진 노르딕 사회민주주의 모델이 대표적입니다."
 monarchist_socialism_democratic:0 "근왕사회주의"
 monarchist_socialism_democratic_desc:0 "사회주의 국가와 군주제는 일반적으로는 결합되지 않지만, 역사적으로 여러 타협의 결과로서 사회주의와 군주제의 공존이 논의되거나 심지어는 실현되기도 하였습니다. 첫 번째로는 군주주의자들에 비해 상대적으로 약소한 공산주의자들이 타협으로 공산화 이후에도 군주제를 용인하는 경우입니다. 1921년 몽골의 공산화 이후 1924년까지 복드 칸이 권력을 유지한 것이 대표적인 예시입니다.\n\n반대로 근왕사회주의는 강력한 공산주의 체제 아래에서 군주제를 부활시키기 위해, 군주주의자들이 공산주의자들에게 제시하는 타협책이 되기도 합니다. 소련의 군주제 운동인 믈라도로시는 소비에트 연방 공산주의 체제를 유지하되, 차르가 소비에트 연방의 상징이 되는 대안을 제시했습니다.\n\n마지막으로는 마르크스주의 자체가 개량을 반복하는 과정에서 군주제를 용인할 수 있을 만큼 온건해지는 경우가 있습니다. 살트셰바덴 협약 이후 자본주의자들과 사회주의자들의 타협을 통해 만들어진 노르딕 사회민주주의 모델이 대표적입니다."
 plutocracy_ideology:0 "금권 정치"
 plutocracy_ideology_desc:0 "금권정치란 부유한 계급 또는 계층의 경제권력에 의하여 지배되는 정치체제입니다."
 syndicalism:0 "노동조합주의"
 syndicalism_desc:0 "노동조합주의는 노동조합에 의한 자주적인 관리를 요구하며, 이에 달성하기 위하여 노동자들의 직접적인 행동을 주장합니다. 이들은 주로 현장의 노동자들로 구성되기에 가장 적극적인 사회주의 계열 세력 중 하나입니다."
 war_communism:0 "전시 공산주의 / 좌익 군사정부"
 war_communism_desc:0 "전시 공산주의와 좌익 군사정부는 권위적인 동원 아래 정치, 산업, 그리고 때로는 대중 생활 전반에 국가가 통제를 행사하는 체제입니다.\n\n전시 공산주의는 공산주의를 표방하는 정부 혹은 조직이 전쟁 등을 원활히 수행하기 위해서 취하는 경제-정치체제입니다. 대표적인 사례로는 1918년부터 1921년까지의 러시아 내전 기간 동안의 볼셰비키 정부가 있으며, 구체적으로는 폭력적인 국유화, 시장경제 배제, 식량 징발, 생필품 배급제 등이 시행되었습니다.\n\n좌익 군사정부는 공산주의적 성향을 지닌 군부 세력이 쿠데타 등을 통해 국가의 통치권을 장악하거나, 공산주의적 군정사령부에 의해 점령지를 관리하는 체제를 의미합니다. 이들은 일반적으로 민간 사회주의 정부와는 차별화된 강한 군사적 색채를 띕니다."
 scandinavian_social_democracy:0 "사회민주주의"
 scandinavian_social_democracy_desc:0 "스칸디나비아 사회민주주의는 스웨덴, 노르웨이, 덴마크의 사회민주주의 정당들의 다른 전간기 사회민주주의 정당들과 다르게 변혁적이고 급진적인 체제전복 이후에 대중의 요구와 수정주의적 마르크스주의 사이의 간극을 좁혀나가며 그로부터 점진적이나 과감하게 좌경화하는 이데올로기적 변동 혹은 그 과정 전반을 의미합니다."
 Cohabitism:0 "공존주의"
 Cohabitism_desc:0 "공존주의는 키보토스인과 유럽인을 한 정치공동체 안에 통합하되, 종족 정체성을 일차적 축으로, 민족 정체성을 이차적 축으로 규정하는 민주주의적 이념입니다. 모든 구성원에게 법적·사회적 기회를 동등하게 보장하는 것을 핵심 원칙으로 삼습니다. 정치체제는 중앙집권적 민주주의를 지향하되 대통령과 의회의 권한을 비슷한 수준으로 배치하여 상호 견제와 균형이 가능한 구조를 채택합니다. 이는 시민 내셔널리즘의 공적 평등 강조와 유사한 점이 있으나, ‘공동의 시민성’보다 ‘두 종의 공존’이라는 실체적 구분을 출발점으로 삼는 점에서 구별됩니다.\n\n국가는 궁극적으로 민족적 구별을 완화하고 종족 단위의 공동정체성을 강조하여, 서로 다른 종족이 공존해야만 사회적 안정과 국가의 정체성이 유지된다고 주장합니다. 이를 위해 중앙정부는 통합 교육·공용어 정책·공적 제도 통합 등 강력한 통치 수단을 사용합니다. 반면 문화·언어의 희석과 소수 민족 전통의 소실, 지역 간 불균형 발전 같은 부작용이 발생할 수 있으며, 이를 보완하기 위해 연방제적 권한배분과 다중수도제 같은 제도적 장치를 병행하여 지역 대표성·발전 균형을 확보합니다.\n\n실천적 메커니즘으로는 보편적 복지·공교육·언어 정책을 통한 공동의 정치적 공간 형성, 종족 간 교류와 상호 인정 프로그램, 지역 자치권의 제한적 보장 및 중앙의 안보·외교 권한 집중 등이 포함됩니다. 요컨대 공존주의는 ‘종족을 기본 단위로 인정하되, 평등한 기회와 강한 중앙의 통합력을 통해 서로 다른 집단이 한 국가 안에서 지속적으로 공존하도록 설계된 민주적 이념’입니다."
 Civil_nationalism:0 "시민 내셔널리즘"
 Civil_nationalism_desc:0 "시민 내셔널리즘(시민적 민족주의)은 국민의 결속을 혈통이나 언어·문화적 동질성에 두지 않고, 정치적 공동체로서의 시민권·헌법·법 앞의 평등·공동의 정치적 절차에 둔 이념입니다. 국가 구성원의 소속감은 혈통이 아니라 ‘함께 살겠다는 의지’와 공적 제도에 대한 충성에서 나오는 것으로 보며, 국가는 주권적 시민들의 자율적 결합으로 이해됩니다.\n\n이 이념의 사상적 뿌리는 계몽주의와 미국·프랑스 혁명기의 정치 담론에 있으며, 특히 에르네스트 르낭은 “국가는 매일의 국민투표(또는 매일의 동의)”라는 표현으로 국민의 의지를 결속의 핵심으로 제시했습니다. 따라서 시민 내셔널리즘은 국민적 정체성을 법적·정치적 절차와 시민적 덕목(시민 교육, 공적 토론, 보통선거 등)을 통해 형성하고 유지하려 합니다.\n\n19세기까지의 맥락에서 시민 내셔널리즘은 낭만적·유기적 민족주의(예: 헤르더 계열의 혈통·문화 중심 담론)와 대비되어 왔습니다. 후자는 민족을 자연적·역사적 지속체로 보았으나, 시민적 관점은 국적·시민권을 통한 정치적 선택과 규범의 수용을 강조합니다. 실천적으로는 헌법·법치·정책적 포용(시민권 확대, 공교육 등)을 통해 다양한 출신 집단을 하나의 정치적 공동체로 묶으려는 성격이 강했습니다."
 culturlic_Integralism:0 "민주사회주의"
 culturlic_Integralism_desc:0 "민주사회주의는 19세기 말 유토피아적 사회주의, 차티스트 전통 및 점진적·의회적 사회주의 사조가 결합해 형성된 정치적·사상적 경향입니다. 이 이념은 사회적·경제적 평등을 민주적 절차와 공적 제도를 통해 실현하려 하며, 생산수단의 사회적 관리와 공공성 확대, 광범한 복지정책을 목표로 삼습니다. 전통적 마르크스주의의 즉각적·혁명적 전복 노선을 그대로 따르지 않고, 선거와 의회·노동조합·입법 개혁을 통해 자본주의의 모순을 완화·변형시키는 점진적 경로를 취합니다.\n\n사상적 핵심으로는 수정주의(에두아르트 베른슈타인)의 영향이 있으며, 이는 노동조합과 정당을 통한 개혁을 통해 사회주의적 목표에 접근할 수 있다고 봤습니다. 영국의 페비언 계열은 제도와 정책을 통해 서서히 사회를 개조하는 방법을 강조했습니다. 반면 로자 룩셈부르크 등 혁명적 좌파는 점진주의에 대해 강하게 비판하여 당내·정파 간 격렬한 논쟁이 존재했습니다.\n\n정치·경제적 실천 면에서는 보통선거와 다당제 같은 정치적 민주주의를 전제로 하면서도 공공부문 확대, 노동자 권리 강화, 경제의 사회적 통제와 민주적 관리(예: 협동조합적 운영)를 중시했습니다. 산업·금융의 전면적 국유화만을 필수 조건으로 삼지 않고 규제·사회적 소유·연대적 관리 모델을 통해 경제를 민주적으로 조직하려는 경향이 두드러졌습니다."
 culturlic_Integralism_com:0 "민주사회주의"
 culturlic_Integralism_com_desc:0 "민주사회주의는 19세기 말 유토피아적 사회주의, 차티스트 전통 및 점진적·의회적 사회주의 사조가 결합해 형성된 정치적·사상적 경향입니다. 이 이념은 사회적·경제적 평등을 민주적 절차와 공적 제도를 통해 실현하려 하며, 생산수단의 사회적 관리와 공공성 확대, 광범한 복지정책을 목표로 삼습니다. 전통적 마르크스주의의 즉각적·혁명적 전복 노선을 그대로 따르지 않고, 선거와 의회·노동조합·입법 개혁을 통해 자본주의의 모순을 완화·변형시키는 점진적 경로를 취합니다.\n\n사상적 핵심으로는 수정주의(에두아르트 베른슈타인)의 영향이 있으며, 이는 노동조합과 정당을 통한 개혁을 통해 사회주의적 목표에 접근할 수 있다고 봤습니다. 영국의 페비언 계열은 제도와 정책을 통해 서서히 사회를 개조하는 방법을 강조했습니다. 반면 로자 룩셈부르크 등 혁명적 좌파는 점진주의에 대해 강하게 비판하여 당내·정파 간 격렬한 논쟁이 존재했습니다.\n\n정치·경제적 실천 면에서는 보통선거와 다당제 같은 정치적 민주주의를 전제로 하면서도 공공부문 확대, 노동자 권리 강화, 경제의 사회적 통제와 민주적 관리(예: 협동조합적 운영)를 중시했습니다. 산업·금융의 전면적 국유화만을 필수 조건으로 삼지 않고 규제·사회적 소유·연대적 관리 모델을 통해 경제를 민주적으로 조직하려는 경향이 두드러졌습니다."
 ABYDOS_democracy:0 "아비도스 민주집중제"
 ABYDOS_democracy_desc:0 "아비도스 민주집중제는 아비도스에서 전통적으로 이어져 온 민주집중제로, 내부의 자유로운 토론(민주)과 토론 결과에 따른 통일된 집행(집중)을 결합하려는 제도입니다. 학생회와 고등학교 내부의 토론과 행동의 일치를 강조하면서 정립되었고, 이후 셰마타 및 여러 아비도스 정권의 핵심 조직 원리로 채택되었습니다.\n\n구체적으로는 학생회내에서 활발한 토론과 비판이 허용되나 결정이 내려지면 모든 학생이 그 결정을 따르고 외부에선 단일한 방침으로 행동해야 합니다. 하위 조직은 상위 조직의 결정을 이행할 의무가 있고, 소수 의견은 학교 내에서 표명될 수 있으나 결정된 행동을 방해해서는 안 된다고 규정됩니다.\n\n아비도스의 특수성으로 인해 중앙 외에서는 폭넓은 지방자치가 허용되나 중앙권력은 주로 한 사람에게 집중됩니다. 개량된 아비도스 민주집중제는 학교를 국가, 학생회를 의회로 규정하며 학생 외의 현지인 등도 유의미한 목소리를 낼 수 있으나, 소수파 억압과 파벌 배제 등이 지속될 경우 실질적인 일인 독재로 발전할 높은 가능성을 내포하고 있습니다."
 Self_Reliance:0 "국가계몽주의"
 Self_Reliance_desc:0 "국가계몽주의는 키보토스 민족주의를 토대로 한 사상으로, 우월한 키보토스인이 유럽을 ‘키보토스화’할 의무가 있다고 주장한다. 이 이념에서는 키보토스인이 본질적으로 현지인보다 뛰어나다고 보며, 그들이 자신의 문화를 확산시키고 통일된 사회를 이루어야 한다고 믿는다. 국가계몽주의의 핵심에는 ‘영도자’이자 ‘선지자’, ‘계몽가’인 지도자가 자리 잡는다. 이 지도자는 위기 상황 속에서 키보토스를 영광으로 이끌어갈 존재로 간주되며, 일단 그에게 신앙에 가까운 광신적 추종을 요구받는다.\n\n이 사상은 키보토스의 통일을 강력히 주장하며, 대전이가 신의 계시라고 주장하며 이것은 현지인을 지배하고 새로운 세계의 지배자로 나아가야 한다는 신의 메시지라고 한다. 이러한 점에서 국가계몽주의는 키보토스인의 완전한 평등을 강조하는 사회주의적 요소와, 현지인을 지배의 대상으로 삼는 제국주의적 측면을 동시에 지닌다. 더불어 지도자에게 모든 권한이 집중되는 일인독재체제를 채택하고 있어, 중앙집권적 통치를 통해 국가 전체를 강력하게 통제하고자 한다. \n\n결과적으로 국가계몽주의는 온갖 사상이 혼재된 형태로 나타난다. 키보토스 민족의 우월성을 근거로 한 통일과 확산의 의무, 그리고 그 과정에서 지도자에 대한 절대적 신뢰와 충성을 요구하는 면모는, 대중들에게 쉽게 다가갈 수 있는 단순한 구호와 같은 성격을 띤다. 이처럼 다양한 이념적 요소가 뒤섞여 있는 국가계몽주의는, 단일한 이념 체계를 넘어서 광범위한 정치적, 사회적 메시지를 전달하며, 한 번 확산되면 마치 종교처럼 강력하게 퍼져나가는 경향을 보인다."
 Government_Federalism:0 "정부연방주의"
 Government_Federalism_desc:0 "정부연방주의는 간단히 말해 같은 국가에서 완전히 같은 정부 제도를 가진 둘 혹은 그 이상의 정부가 하나로 통합된 형태입니다.\n얼핏 보면 제도라고 생각되기도 하는 이 사상은 모든 상황에서 적용되는 단단한 사상이 아닌 유연히 상황에 따라 변해가며 가장 최적의 형태를 찾아갑니다.\n\n각각 정부는 단일정부 내에서 파벌과 같이 움직이며 협력합니다.\n이러한 체제는 정당정치나 합중국 제도와 비슷한 양상을 띄기도 하나, 이 체제에서는 각 정부 휘하의 정당이 존재할 수 있으며, 자치구나 국가연방, 연합체의 형태가 아닌 엄연히 하나의 단일국가로써 기능합니다.\n허나 정부나 국가를 대표하는 국가원수의 경우, 각 정부에서 선정되어 하나의 총회의를 구성하는 형태로 합니다.\n각 정부가 소재하는 지역의 행정적 차이와 기존에 존재하는 민족적, 문화적 차이는 법률로 구분되지 않으며, 차이를 규정하기 위한 최대 명령 형태를 규칙으로 규정합니다.\n또한 자치구와 소재지가 행정구역으로 구분되지 않습니다.\n\n정치적 사상으로써는 상당히 빈 부분이 많으며, 전체적으로 실험적인 사상이지만 한 가지 확실한 사실은 매우 작은 영토를 가진 국가에서만 유효하다는 점입니다."
 satsukiism:0 "사츠키 통치"
 satsukiism_desc:0 "사츠키 통치는 전통적인 이데올로기나 대중 운동이 아닌, 만마전 정보부장 코교쿠 사츠키 개인이 주도하는 고도의 심리 공학적 통치 체제를 의미합니다. 이 체제의 근간을 이루는 'NK 울트라 계획'은 단순한 선전을 넘어, 국가의 모든 정보망과 미디어를 활용하여 대중의 사고 과정 자체에 개입하고 특정 결론을 '자연스러운' 합의처럼 유도하는 총력 정보전 시스템입니다.\n\n이로 인해 사츠키 통치 하의 사회는 기묘한 이중성을 띱니다. 국가의 모든 중대사는 사츠키 개인의 의지에 따라 결정된다는 점에서 완벽한 전제군주제에 가깝지만, 국민들은 억압이나 강제를 느끼지 않고 스스로의 판단으로 사회적 조화에 동참하고 있다고 믿습니다. 토론과 갈등은 불필요한 비효율로 간주되어 소멸하고, 사회는 마치 하나의 거대한 유기체처럼 안정되고 조화롭게 움직입니다.\n\n따라서 '사츠키 통치'에는 열성적인 지지자나 이념적 동지가 존재하지 않습니다. 오직 조용하고 안정된 질서 속에서 주어진 역할을 수행하는 '국민'만이 존재할 뿐입니다. 결과적으로 이는 개인의 자유의지가 설계된 질서에 완벽하게 종속되는, 유례없이 안정적이지만 완벽하게 통제된 디스토피아 사회를 구현합니다."
 satsukiism_B_1_1:0 "협화 민주주의"
 satsukiism_B_1_1_desc:0 "협화 민주주의는 코교쿠 사츠키의 일방적인 정신 통치 체제가 자기부정을 통해 재탄생한 독특한 정치 이념입니다. 이 체제의 전환점은 사츠키 의장 스스로가 NK 울트라 프로젝트의 비인간성을 인정하고, 과거의 적대 세력에게 공식적으로 사과하며 프로젝트의 종결을 선언한 순간이었습니다.\n\n놀랍게도, 과거의 야권 세력조차 그 어두운 유산을 묵인했습니다. 강압적인 통합이 없었다면 파멸적인 내전과 민족 갈등을 피할 수 없었을 것이라는 공통된 인식이 형성되었기 때문입니다. 이 기묘한 사회적 합의 아래, NK 울트라가 남긴 선전 및 심리 유도 기술은 폐기되는 대신 새로운 목적을 부여받았습니다.\n\n이제 이 기술들은 단일 지도자의 의지를 관철하는 대신, 민족 간의 갈등을 봉합하고 사회적 합의를 유도하는 '조율'의 도구로써 제한적으로 활용됩니다. 국가는 더 이상 개인의 사상을 통제하지 않지만, 사회 전체가 '협화'라는 공동의 목표를 향해 나아가도록 보이지 않는 곳에서 부드럽게 안내합니다.\n\n결과적으로 협화 민주주의는 표면적으로는 다원주의와 민주적 절차를 존중하지만, 그 이면에는 사회의 급진적인 갈등을 원천적으로 방지하려는 강력한 의지가 작동하는 독특한 체제입니다. 이는 완전한 자유가 아닌, '관리되는 협화' 속에서 평화를 추구하는 새로운 형태의 민주주의입니다."
 satsukiism_B_1_2:0 "사츠키 특색 민주주의"
 satsukiism_B_1_2_desc:0 "사츠키 통치는 전통적인 이데올로기나 대중 운동이 아닌, 만마전 정보부장 코교쿠 사츠키 개인이 주도하는 고도의 심리 공학적 통치 체제를 의미합니다.\n\n현재 사츠키가 내세우는 사츠키 특색 민주주의의 모습은 대중의 심리를 더욱 교묘하게 활용하여 완성된, 고도의 민주주의의 탈을 쓴 독재 체제입니다. 표면적으로는 게헨나와 독일을 각각 대변하는 양당제를 통해 건전한 정치적 경쟁과 민주적 절차를 존중하는 것처럼 보입니다.\n\n하지만 그 이면에는, 강화된 'NK 울트라 계획'을 통해 야당의 지도부와 핵심 의제까지 완벽하게 통제하는 그림자 정치가 존재합니다. 의회에서의 격렬한 토론과 정당 간의 대립은 모두 사츠키 의장의 각본 아래 연출되는 거대한 정치 연극에 불과합니다.\n\n국민들은 자신들이 자유로운 의지로 정치에 참여하고 있다고 믿으며, 이 인위적으로 연출된 갈등을 '해결'하고 국가를 통합하는 사츠키를 '위대한 지도자'로 추앙하게 됩니다. 이 과정은 국민에게 국가에 대한 강한 소속감과 정치적 효능감을 심어주지만, 모든 선택지는 결국 사츠키의 의도 안에서만 움직입니다.\n\n결과적으로 이는 갈등마저 완벽한 통제의 도구로 사용하는, 가장 안정되고 완성된 형태의 디스토피아입니다. 국민들은 스스로의 의지로 지도자를 지지하고 조국을 사랑한다고 믿지만, 그들의 선택지는 처음부터 단 하나뿐이었습니다."
 satsukiism_B_2_1:0 "장막 과두 정치"
 satsukiism_B_2_1_desc:0 "장막 과두 정치는 코교쿠 사츠키의 통치 철학이 개인의 지배를 넘어, 시스템 그 자체로 진화한 형태입니다. 이 체제 아래 국가는 NK 울트라의 진실을 아는 비밀스러운 단일 조직에 의해 운영되며, 사츠키 개인은 절대 권력자에서 물러나 집단지도체제의 상징적인 구심점 역할을 합니다.\n\n표면적으로 조직 내에서는 다양한 파벌이 존재하며 민주적인 토론과 합의를 통해 정책이 결정됩니다. 그러나 이 모든 과정의 외부에는 '장막'이 존재합니다. 과거 개인의 정신을 통제했던 'NK 울트라' 기술은 이제 당의 이름 아래, 사회 전체의 공존을 유도하는 거대한 조율 장치로 재탄생했습니다.\n\n이 기술은 특정 의견을 강요하지 않습니다. 대신, 갈등을 유발하는 급진적인 사상을 부드럽게 희석하고, 모든 토론이 사회 통합이라는 대의로 귀결되도록 안내할 뿐입니다. 국민들은 자신들이 완전한 사상의 자유 속에서 가장 이상적인 결론에 도달하고 있다고 믿으며, 이 과정에서 발생하는 완벽한 사회적 합의에 만족감을 느낍니다.\n\n결과적으로 장막 과두 정치는 가장 이상적인 형태의 통합 국가를 실현합니다. 강압이나 독재가 아닌, 보이지 않는 '선한 의지' 아래 모두가 자발적으로 화합하는 사회. 이는 가장 평화롭지만, 동시에 가장 정교하게 설계된 유토피아입니다."
 satsukiism_B_2_2:0 "사상"
 satsukiism_B_2_2_desc:0 "이것은 사츠키 통치의 최종 단계이자 가장 완벽한 형태입니다. 국가는 더 이상 다양한 개인의 집합체가 아닌, 오직 '하나의 지도자' 코교쿠 사츠키의 확장된 자아일 뿐입니다. 그녀의 의지는 법이자 진리이며, 그녀의 생각은 국가 전체의 유일한 사상입니다.\n\n사회의 모든 기능은 역설적인 이름의 네 부서-진리부, 평화부, 애정부, 풍요부-에 의해 완벽하게 통제됩니다. 진리부는 과거를 재단하고, 평화부는 영원한 안정을 위해 내외부의 적을 관리하며, 애정부는 절대적인 충성을 주입하고, 풍요부는 모든 자원을 가장 '효율적'으로 분배합니다.\n\n이 체제 아래에서 'NK 울트라 계획'은 더 이상 단순한 세뇌 기술이 아닙니다. 그것은 국민의 의식을 재구성하고, 심지어 '자유'나 '반역'과 같은 단어의 개념 자체를 소멸시키는 현실 조작의 도구입니다. 개인은 소멸하였고, 오직 당과 지도자를 위해 존재하는 부품만이 남았습니다. 이곳에는 갈등도, 의심도, 고통도 없습니다. 오직 완벽한 질서와 복종, 그리고 그 속에서 비롯되는 공허한 평화만이 영원히 계속될 뿐입니다."
 satsukiism_C_1:0 "최면 학생회 통치"
 satsukiism_C_1_desc:0 "최면 학생회 통치는 '게헨나 심리학원'을 가장 이상적인 아카데미로 만드는 독특한 사회정치 체제입니다. 대부분의 학생들에게 학원은 마치 라이트노벨 속 세상과 같습니다. 심각한 갈등이나 다툼 없이, 모두가 자신의 꿈을 향해 나아가며 즐거운 학창 시절을 보내는, 완벽에 가까운 해피 엔딩의 일상이 계속됩니다.\n\n이 이상적인 조화의 비밀은 모든 학생이 배우는 기초적인 심리 유도 기술에 있습니다. 이를 통해 서로를 배려하고 이해하며, 파괴적인 갈등은 자연스럽게 해소됩니다.\n\n하지만 이 시스템의 진정한 핵심은 '성장과 각성'에 있습니다. 심화 과정을 통해, 뛰어난 학생들은 이 사회를 유지하는 심리적 구조의 본질을 꿰뚫어 보고, 마침내 스스로를 정신적 제약에서 '졸업'시킬 수 있게 됩니다. 이처럼 자기 자신을 완벽하게 이해하고 시스템의 진실에 도달한 소수의 엘리트만이 국가의 최고 의사 결정 기구인 '학생회'에 진입할 자격을 얻습니다.\n\n결과적으로, 이곳은 대다수가 행복한 학창 시절을 보내는 이상적인 아카데미이자, 소수의 각성자들이 그 행복을 지키기 위해 노력하는 세계입니다. 학생회는 대중을 억압하지 않습니다. 그저, 아직 깨어나지 못한 이들을 평화 속에서 부드럽게 '보호'할 뿐입니다."
 pandemonium:0 "게헨나 만마전"
 pandemonium_desc:0 "판데모니움 소사이어티의 정치는 매우 특이합니다. 학생들의 낮은 정치 참여도에서 비롯되는 정치 체제는 이들이 진짜 학생회인지, 아니면 그저 학생회를 자칭하는 집단인지조차 제대로 분간하기 어렵게 만듭니다. 이들의 권한을 증명하는 것은 키보토스 총학생회가 발급한 인증서가 유일합니다."
 neopandemonium:0 "개혁 만마전"
 neopandemonium_desc:0 "학생들의 낮은 정치 참여도에서 비롯되는 이전 판데모니움의 정치 체제를 개혁하고 정상적으로 작동하는 게헨나의 학생회입니다. 이들은 '게헨나 학생'이라는 뿔과 같은 특징적인 신체적 특징, 그리고 그것에서 비롯되는 여러 민족주의적 정서에 운영되는 정치 이데올로기입니다."
 makotoism_A1:0 "국가조합주의"
 makotoism_A1_desc:0 "국가조합주의는 극단적인 국가주의를 기반으로 하는 전체주의 이념입니다. 이 사상은 사회의 모든 구성원—노동자, 자본가, 농민 등—을 국가가 통제하는 각자의 '조합'으로 편제하여 모든 내부 갈등을 종식시키는 것을 목표로 합니다. 계급 투쟁이나 정치적 대립과 같은 '반국가적인' 요소를 제거함으로써, 국가의 모든 역량을 오직 '총통'이라 불리는 절대적 지도자가 제시하는 '위대한 위업' 달성에 총동원하는 체제입니다.\n\n국가조합주의는 여러 면에서 기존의 국가사회주의와 유사성을 보이지만, 결정적인 차이점을 가집니다. 바로 민족의 기준을 '혈통'이 아닌, '총통과 국가에 대한 절대적 충성'에 둔다는 점입니다. 이를 통해 현 정권은 기존 나치당의 지지 기반을 잠식하고 흡수하면서도, 게헨나 출신이라는 이질적인 요소를 체제 내에 통합하는 명분을 확보합니다. 즉, 낡고 실패한 나치즘을 대체하는 '새롭고 유능한' 대안임을 자처하는 것입니다.\n\n이 체제는 지도자에 대한 개인숭배를 강화하는 강력한 선전 활동과, 모든 반대 세력의 무자비한 탄압을 통해 유지됩니다. 궁극적으로 국가조합주의가 지향하는 바는 내적 통합을 넘어선 '공격적인 팽창주의'입니다. 하나로 단결된 국가의 모든 자원을 동원하여, 마침내 세계를 정복하는 것이 이 이념의 최종 목표라 할 수 있습니다."
 makotoism_B:0 "초세계 패권적 민족주의"
 makotoism_B_desc:0 "초세계 패권적 민족주의는 두 개의 '선택된 민족'으로 불리우는 게르만족과 게헨나인의 신성한 맹약을 기반으로 하는 급진적인 초국가주의 이념입니다.\n\n이 사상의 추종자들은 '대전이'를 단순한 우연이 아닌, 북방의 신화를 잇는 '노르드 민족'과 힌놈의 계곡에서 비롯된 '게헨나 민족'이 만나 세계를 지배하라는 신성한 계시로 해석합니다. 이 두 '신들의 민족'은 본질적으로 다른 모든 열등한 민족들을 지배할 운명을 타고났다고 믿습니다.\n\n정치적으로, 이는 두 지배 민족의 연립 통치 체제로 나타나며, 지도자는 독일의 노르드와 게헨나의 힌놈 신화를 동시에 계승함으로써 혈통을 초월한 지배의 정당성을 확보합니다.\n\n궁극적으로, 이 이념은 '노르드-힌놈'이라는 새로운 지배 문명의 기치 아래, 먼저 분열된 키보토스를 통합하고, 나아가 전 유럽을 자신들의 생활권으로 삼는 무한한 팽창을 최종 목표로 삼습니다."
 makotoism_B1:0 "초세계적 전민조합주의"
 makotoism_B1_desc:0 "초세계적 전민조합주의는 하누마 마코토의 예측 불가능한 1인 통치가 축출된 이후, '신들의 연합'이라는 기존의 신화를 국가 통제의 기반으로 재정립한 실용적 권위주의 이념입니다.\n\n이 사상은 게르만족과 게헨나인의 '신성한 맹약'을 더 이상 지도자의 변덕스러운 위업을 위한 도구가 아닌, 국가를 지탱하는 영구적인 정통성의 근원으로 활용합니다.\n\n'전민조합주의'의 기치 아래, 두 민족은 혈통이나 이념이 아닌 국가에 대한 '역할'과 '기여'에 따라 조합으로 편제됩니다. 정당, 기업, 노동 단체들은 모두 국가의 통일된 지도 아래 '국가 안정'이라는 단 하나의 목표를 위해 봉사하도록 조직됩니다.\n\n표면적으로는 의회를 통한 민주적인 개혁이 진행되고 있지만, 이는 철저히 통제된 '관리 민주주의'에 불과합니다. 진정한 권력은 새로운 집정위원회에 절대적으로 집중되어 있으며, 이들은 '혼돈의 재발 방지'라는 대의를 명분으로 모든 반대 세력을 억압합니다.\n\n궁극적으로, 이 이념은 마코토의 광기 어린 팽창주의를 지양하고, 강력한 중앙 권력을 바탕으로 내적 결속을 다지는 안정된 국가를 지향합니다. '신들의 민족'이라는 신화는 이제, 이 거대한 국가 기계에 순응하는 국민을 만드는 강력한 사회적 접착제로 기능할 뿐입니다."
 makotoism_B2:0 "초세계 민족 자유주의"
 makotoism_B2_desc:0 "초기 초세계 패권적 민족주의의 광기가 흩어지고 나타난 안정된 이념인 초세계 민족 자유주의는 두 개의 '선택된 민족'으로 불리우는 게르만족과 게헨나인의 신성한 맹약을 기반으로 하는 급진적인 초자유주의 이념입니다.\n\n이 사상의 추종자들은 '대전이'를 단순한 우연이 아닌, 북방의 신화를 잇는 '노르드 민족'과 힌놈의 계곡에서 비롯된 '게헨나 민족'이 만나 세계를 지배하라는 신성한 계시로 해석합니다. 이 두 '신들의 민족'은 가장 평화로운 국가를 세워낼 운명을 선지받았다고 예견됩니다.\n\n정치적으로, 이는 두 지배 민족의 연립 통치 체제로 나타나며, 지도자는 독일의 노르드와 게헨나의 힌놈 신화를 동시에 계승함으로써 혈통을 초월한 지배의 정당성을 확보합니다.\n\n궁극적으로, 이 이념은 '노르드-힌놈'이라는 새로운 지배 문명의 기치 아래, 옛 팽창주의를 극복하고, 과격한 전쟁성으로 손상된 조국을 돌보는 일을 하게 됩니다."
 satsukiism_makoto_B: "게헨나 복고주의"
 satsukiism_makoto_B_desc: "게헨나 복고주의는 '해방자' 하누마 마코토가 코교쿠 사츠키의 기만적인 정신 통치를 강제로 종식시킨 후 제창한, 게헨나의 근본 정신으로의 회귀를 주장하는 이념입니다.\n\n이 이념의 핵심은 사츠키가 만들어낸 인공적인 조화와 침묵을 '거짓된 평화'이자 '정신적인 죽음'으로 규정하는 것에 있습니다. 복고주의자들은 미식연구회의 폭파, 온천개발부의 난동, 선도부와의 끊임없는 대립이야말로 게헨나의 자유로운 영혼과 꺼지지 않는 활력을 증명하는 '살아있는 증거'라고 주장합니다.\n\n따라서 게헨나 복고주의는 복잡한 체제나 강령을 제시하지 않습니다. 대신, 모든 억압적인 통제를 철폐하고 학원의 모든 조직과 학생 개개인에게 완전한 자율성을 돌려주는 것을 최우선 과제로 삼습니다. 질서는 최소한의 형태로 존재하며, 국가는 다양한 갈등과 혼돈 속에서 스스로 균형을 찾아 나아갈 것이라고 믿습니다.\n\n결과적으로, 이는 예측 불가능하고 소란스러우며 끊임없이 문제가 발생하는 '원래의 게헨나'로의 완벽한 복귀를 의미합니다. 이들에게 통제된 낙원은 가장 끔찍한 지옥이며, 자유로운 혼돈이야말로 게헨나가 마땅히 누려야 할 유일한 천국입니다."
 police_nationalism:0 "키보토스 질서주의"
 police_nationalism_desc:0 "오가타 칸나가 대전이 이후, 현재까지 주창중인 발키리의 입장을 대표하는 발언으로, 키보토스 총학생회 질서를 강력하게 옹호하고 지지하는 이데올로기 입니다."
 police_neutralism:0 "키보토스 개혁주의"
 police_neutralism_desc:0 "발키리 내 반대파를 기조로 결집된 개혁주의 파벌은 기존 발키리 체제의 유약함을 비판하고 더 강력한 키보토스인을 위한 정치가 필요하다는 이데올로기 입니다."
 police_communism:0 "신질서주의"
 police_communism_desc:0 "신질서주의는 대전이 이후 발생한 일련의 현지인과의 충돌 사건들에서 기원한 사상입니다. 현지인들을 향한 동정주의가 핵심으로, 키보토스 학생들이 먼저 지구의 인민을 향해 손을 내밀어야 한다는 내용이 사상의 주를 이룹니다."
 police_democratic:0 "신질서주의"
 police_democratic_desc:0 "신질서주의는 대전이 이후 발생한 일련의 현지인과의 충돌 사건들에서 기원한 사상입니다. 현지인들을 향한 동정주의가 핵심으로, 키보토스 학생들이 먼저 지구의 인민을 향해 손을 내밀어야 한다는 내용이 사상의 주를 이룹니다."
 
 cou_kaya_dictatorship:0 "초인독재"
 cou_kaya_dictatorship_desc:0 "초인독재는 시라누이 카야의 일인독재 체제를 일컫는 말입니다. 시라누이 카야는 본인을 '초인'이라고 자처하며, 국가의 제1통수권자이자 독재자로서 기능합니다. 비록 카야는 '초인'에는 거리가 먼 사람이지만요."
 cou_ideology:0 "행정위원회"
 cou_ideology_desc:0 "총학생회 행정위원회는 공식적으론 11개의 각 부서들과 총학생회장의 통솔 하에서 이루어진 정치 체계로 총학생회장의 지도력이 중요시하게 여겨집니다. 11명의 실장들과 총학생회장 휘하의 통제에서 행정위원회는 형식상으로든 실제로든 키보토스 전역을 감독하고 관리합니다."

 srt_nationalism:0 "SRT 통제파"
 srt_nationalism_desc:0 "SRT통제파는 SRT의 통제를 주장하는 이념입니다. SRT의 통제는 SRT의 자율적인 사고 판단에 따라 국가의 모든 정책이 결정됩니다."
 srt_democratic:0 "SRT 대의파"
 srt_democratic_desc:0 "SRT 대의파는 SRT의 대외적인 활동을 주장하는 이념입니다. SRT 대의파는 SRT의 대외적인 활동을 주장하며, SRT의 대외적인 활동은 SRT의 자율적인 사고 판단에 따라 결정됩니다."
 srt_communism:0 "SRT 개혁파"
 srt_communism_desc:0 "SRT 개혁파는 SRT의 개혁을 주장하는 이념입니다. SRT 개혁파는 SRT의 개혁을 주장하며, SRT의 개혁은 SRT의 자율적인 사고 판단에 따라 결정됩니다."
 srt_neutralism:0 "SRT 원칙파"
 srt_neutralism_desc:0 "SRT 원칙파는 SRT의 원칙을 주장하는 이념입니다. SRT 원칙파는 SRT의 원칙을 주장하며, SRT의 원칙은 SRT의 자율적인 사고 판단에 따라 결정됩니다."
 corporate_state_workplace_democracy:0 "기업국가 - 사내민주주의"
 corporate_state_workplace_democracy_desc:0 "기업국가에서 형성되는 독특한 이데올로기인 사내 민주주의는 회사의 노동자에게 회사 운영 권리를 민주적으로 분배합니다. 이들의 체제는 때로는 공산주의자들보다 급진적일 수 있으며, 이는 금융자본의 거대한 집합인 기업국가에서 나타나는 독특한 특징일 것입니다."
 corporate_state_corporatism:0 "기업국가 - 자본주의"
 corporate_state_corporatism_desc:0 "이 국가는 일반적인 기업과 마찬가지로 이익을 추구하는 거대한 기업입니다. 기업의 소유권은 여러 대주주에게 분배되어 있으며, 일반적으로는 과두정치와 비슷한 정치 체제를 가집니다."
 corporate_state_private_enterprise:0 "기업국가 - 개인기업"
 corporate_state_private_enterprise_desc:0 "이 국가는 회장으로 대표되는 단일 지도자에 의해 운영되는 거대한 기업입니다. 회사 내 대부분의 권리가 단 한 명에게 집중되어 있으며, 일반적으로는 독재정과 비슷한 정치 체제를 가집니다."
 corporate_state_nephtys:0 "기업국가"
 corporate_state_nephtys_desc:0 "이 국가는 일반적인 기업과 마찬가지로 이익을 추구하는 거대한 기업입니다. 기업의 소유권은 여러 회장을 비롯한 이사진에게 분배되어 있으며, 일반적으로는 과두정치와 비슷한 정치 체제를 가집니다."

 left_council_communism:0 "평의회 공산주의"
 left_council_communism_desc:0 "사회주의 운동의 왼쪽에 위치하는 평의회 공산주의는 노동자 평의회를 조직하고 평의회 민주주의를 통해 사회 전반을 운영할 것을 주장합니다. 이들은 소비에트 연방의 전위당 체제는 사회주의가 아니라 국가자본주의라고 비판하며 노동조합 또한 자본주의적인 이익 집단이라고 비판하는 경향이 있습니다."

 criminal_enterprise:0 "자본지상주의"
 criminal_enterprise_desc:0 "이 범죄자의 연합체는 자본을 숭배하며 돈을 위해서라면 무엇이든지 가리지 않습니다. 마약 수출, 요인 암살, 강도질에 전쟁까지, 이익을 위해서 모든 것을 행할 것입니다."
 crime_vanguard:0 "적색 테러리스트"
 crime_vanguard_desc:0 "좌파 혁명조직의 일부로 시작한 이 범죄 연합은 자신들의 이데올로기적 목표를 달성하기 위해서라면 끔찍한 범죄도 거리낌 없이 저지를 것입니다."
 criminal_state:0 "무법자 국가"
 criminal_state_desc:0 "범죄 조직에서 시작한 이 국가는 강력한 권위주의적 지도자의 명 아래, 거대한 목표를 위해 움직입니다. 이들에게는 국제 사회의 시선 따윈 중요하지 않습니다."
 crime_syndicate:0 "범죄 신디케이트"
 crime_syndicate_desc:0 "범죄자들의 연합체인 범죄 신디케이트는 이해관계의 일치로 동작하는 체제로써, 거대화된 지금으로서는 하나의 국가와도 같습니다. 이들은 자신들만의 질서를 지키려고 할 것이며 변화를 별로 좋아하지 않습니다."

 Social_Liberalism:0 "사회자유주의" 
 Social_Liberalism_desc:0 "사회자유주의는 개인의 자유와 권리를 중시하는 자유주의와, 사회정의에 대한 관심을 결합한 자유주의의 한 갈래입니다. 사회자유주의는 모든 개인이 동등한 자유를 누리기 위해서는, 불평등한 사회 구조와 경제적 격차를 국가가 개입하여 해소해야 한다고 주장합니다. 사회자유주의는 개인의 기본권과 시민적 자유를 굳건히 수호하면서도, 공정한 기회를 보장하기 위한 사회적 안전망의 확충을 촉구합니다. 보편적 의료 서비스, 공교육 시스템 강화, 그리고 실업과 빈곤으로부터 시민을 보호하는 복지 정책 등이 이에 해당합니다."
 National_conservatism:0 "국민보수주의"
 National_conservatism_desc:0 "국민보수주의는 특정되는 동질성, 역사적 유대성을 기반으로 한 국가적 집단, 혹은 혈연적 민족 공동체를 중시하는 사상인 내셔널리즘과, 보수주의를 결합한 보수주의의 한 갈래입니다. 국민보수주의는 자신이 속한 공동체의의 이권 신장, 외세의 침탈적 움직임에서 공동체를 보호하고, 더 나아가 공동체적 자주성의 진흥을 위한 사회적 운동을 촉구합니다."
 
 pure_socialism:0 "순정사회주의"
 pure_socialism_desc:0 "순정사회주의는 20세기 초 키타 잇키에 의해 정립된 '우파 사회주의'의 일종입니다. 순정사회주의 국가의 국가원수는 '현인신(살아 있는 신)'으로서 국민의 모든 의지를 모으는 '상징'이 되며, 국민의 보호자로서 국가 주도의 통제경제를 실시하고 부유한 자본가 계층에 부가 집중되지 않도록 조정하는 역할을 맡습니다. 자비로운 현인신에 의한 통제경제 시스템과 종교적 광신의 조합은 일본 군부의 유력 파벌인 황도파에게 강한 이념적 영향을 주었습니다."
 
 transitioning_democracy:0 "과도민주주의"
 transitioning_democracy_desc:0 "과도민주주의 국가는 엄밀히 말해 민주주의 국가와 비민주주의 국가 그 사이에 있습니다. 한 국가가 독재 체제를 무너뜨린다고 해서, 국민들이 곧바로 완전히 자유로워질 수 있는 것은 아닙니다. 기존 정부에 충성하던 관료들은 여전히 그 자리에서 권위주의적인 정책을 지지하고, 독재 정부에 충성하던 공권력 역시 대체되지 않은 채 치안 조직을 장악하고 있기 때문입니다. 과도민주주의는 독재 국가가 붕괴한 이후 민주 국가로 전환되는 과정에서 보이는 현상일 뿐, 그 자체가 정부가 추구하는 이념을 의미하는 것은 아닙니다."

 harmonism: "국가조화주의"
 harmonism_desc: "국가 조화주의는 소라사키 히나가 혼란스러운 선도부를 통합하고 자신의 권위를 효과적으로 활용하기 위해 창시된 이데올로기입니다. 현지와 이계의 상생이라는 기초 위에 국가기관의 권력, 선도부의 역사적 정통성, 게헨나 학생과 현지 시민 간의 권력 분배, 대전이에 대한 상호 보상과 계급 협조라는 여러 가지 부사가 붙습니다. 이는 현재 소라사키 히나가 강력한 독재정치를 시행할 수 있는 원동력이 되며, 20세기를 풍미한 이념 중 하나이자, 선도부가 혼란한 전간기를 헤쳐나간 결과물로써 남을 것입니다."

 irohasm_A: "신독일운동"
 irohasm_A_desc: "신독일운동은 나츠메 이로하의 통치 아래, 전통적인 독일 민족주의를 해체하고 재구성하려는 실용주의적 국가 개조 이념입니다. 이 운동은 과거 바이마르의 실패한 민주주의나 나치즘의 파괴적인 광기 모두를 거부하며, '독일'이라는 정체성 자체를 현재의 연방 국가에 맞게 과감히 변형하고 첨삭하는 것을 목표로 합니다.\n\n이 이념의 핵심은 이데올로기적 순수성이 아닌, 오직 국가의 안정과 통제에 있습니다. 나츠메 이로하는 스스로를 '기수'로 여기며, 독일인이라는 거친 말을 길들여 새로운 방향으로 이끌어야 한다고 생각합니다. 이를 위해 과거의 상징, 법률, 문화는 국가에 유용하다면 유지되고, 방해가 된다면 가차 없이 폐기되거나 새로운 방식으로 대체됩니다.\n\n신독일운동은 강압적인 독재의 외피를 쓰지 않습니다. 대신, 행정적 절차와 점진적인 개혁을 통해 사회를 원하는 방향으로 유도하며, 국민들이 스스로 새로운 독일의 일부가 되고 있다고 믿게 만듭니다. 결과적으로 이는 과거의 어떤 이념과도 단절된, 오직 현재의 지도자가 정의하는 '새로운 독일'을 창조하는, 가장 유연하고 실용적인 형태의 권위주의입니다."

 irohasm_B: "게헨나-게르만주의"
 irohasm_B_desc: "게헨나-게르만주의는 명확한 이론적 토대에서 시작된 것이 아니라, 대전이 이후 형성된 독일-게헨나 연방의 특수한 정치·사회적 현실 속에서 자연 발생적으로 형성된 통합 이념입니다. 초기에는 두 민족의 평화로운 공존 양상을 강조하는 수준에 머물렀으나, 이후 양당의 공동 지지를 받는 나츠메 이로하 연방대통령의 통치 논리로 발전하며 체계화되었습니다.\n\n이 이념은 '대전이'라는 공동의 트라우마 극복 경험과, 질서와 규율을 중시하면서도 축제를 즐기는 등 의외의 문화적 유사성에 주목합니다. 이를 통해 혈통이나 출신 세계가 아닌, '연방'이라는 새로운 공동체에 대한 충성과 기여를 국민의 제1덕목으로 삼습니다.\n\n정치적으로는 게헨나계와 독일계의 양당제를 유지하되, 그 위에 초월적 통합의 상징으로서 '공동 선출 지도자'를 둡니다. 이 지도자는 파벌 간의 극단적인 대립을 중재하고, 국가적 통합을 위한 상징적 역할을 수행하며, 이념적 순수성보다는 현실적인 안정과 번영을 최우선으로 추구합니다. 이는 한쪽이 다른 쪽을 흡수하는 동화주의나, 각자의 분리를 전제하는 다문화주의와는 구별되는, 독특한 실용주의적 공존 모델입니다."

 chiakism: "모토미야주의"
 chiakism_desc: "모토미야주의는 고정된 정치 철학이라기보다는, 모토미야 치아키가 주도하는 거대하고 시끌벅적한 '정치 엔터테인먼트 쇼'에 가깝습니다.\n\n이 체제에서 국가는 하나의 거대한 주간지 편집국처럼 돌아갑니다. 치아키에게 있어 일관된 이념이나 정책은 중요하지 않습니다. 중요한 것은 \"이번 주에는 어떤 대박 기사를 터트려 대중을 놀라게 할까?\"입니다. 그녀는 어제는 좌파처럼 재벌을 공격하며 \"부패 척결 특종!\"을 외치다가도, 오늘은 우파처럼 대기업과 손잡고 \"기적의 성장 신화!\"를 대서특필하기도 합니다.\n\n대중은 그녀의 종잡을 수 없는 행보에 어리둥절해하면서도, 쏟아지는 자극적이고 화려한 정치 쇼에 눈을 떼지 못합니다. 이것은 아직 그녀가 자신의 지도력을 증명할 진짜 특종을 찾기 전, 이것저것 찔러보며 판을 키우는 '편집 회의' 단계일 뿐입니다."

 chiakism_left: "치아키식 복지 센세이셔널리즘"
 chiakism_left_desc: "치아키식 복지 센세이셔널리즘은 모토미야 치아키가 주도하는, 매일이 축제와 같은 좌파 포퓰리즘 체제입니다. 치아키에게 있어 우울하고 지루한 빈곤은 '폐간되어야 할 구뉴스'이며, 모두가 웃는 모습이야말로 1면 톱을 장식할 '대특종'입니다.\n\n\"자, 준비~! 땅!\"하는 그녀의 구호와 함께, 국가는 금고를 활짝 열어젖힙니다. 복지는 지루한 행정 절차가 아닌, 마치 깜짝 선물이나 경품 행사처럼 시민들에게 쏟아집니다. 그녀는 대중이 기뻐하는 모습을 '최고의 셔터 찬스'로 여기며, 이를 위해 기득권의 창고를 개방하는 것을 주저하지 않습니다.\n\n결과적으로 이 체제는 복잡한 이론보다는 열광적인 선전에 대한 기대감으로 움직입니다. 다소 무계획적이고 재정적 위험이 따르지만, 대중은 매일 아침 배달되는 치아키의 '호외 같은 정치'에 열광하며 압도적인 지지를 보냅니다."

 chiakism_right: "치아키식 성장우선주의"
 chiakism_right_desc: "치아키식 성장우선주의는 모토미야 치아키 특유의 '행동력'이 우익 기술관료적 효율성과 결합하여 탄생한 고속 성장 체제입니다. 이 체제에서 국가는 거대한 편집국이 되고, 대기업들은 특종을 만들어내는 유능한 취재원이 됩니다.\n\n치아키는 복잡한 규제나 답답한 절차를 \"기삿거리가 안 되는 지루한 이야기\"라며 과감히 편집해 버립니다. 대신 그녀는 대자본을 끌어들여 마천루를 세우고, 공장을 돌리며, 매일매일 경신되는 경제 성장률을 \"아하핫! 대박 사건!\"이라며 대서특필합니다. 이곳에 무능과 정체는 설 자리가 없습니다. 오직 '성과'와 '스피드'만이 칭송받을 뿐입니다.\n\n이 체제는 차가운 엘리트주의가 아닙니다. 치아키는 대중에게 \"제 행동력을 얕보면 안 되거든요!\"라고 외치며, 화려한 성장의 과실을 시각적인 스펙터클로 전시합니다. 비록 그 속도가 너무 빨라 현기증이 날지라도, 치아키의 화려한 플래시 세례 아래에서 국가는 멈추지 않는 폭주기관차처럼 번영을 향해 질주합니다."

 chiakism_A_1: "치아키식 협동주의 센세이셔널리즘"
 chiakism_A_1_desc: "치아키식 협동주의 센세이셔널리즘은 '복지 센세이셔널리즘'이 민족의 경계를 넘어 확장된, 역사상 가장 거대하고 시끄러운 통합 체제입니다. 치아키는 게르만이니 게헨나니 하는 낡은 구분법을 \"독자들의 흥미를 떨어뜨리는 진부한 설정\"이라며 과감히 편집 데스크에서 삭제해 버렸습니다.\n\n\"자, 여기보세요! 찰칵!\" 그녀의 카메라 렌즈 안에서는 이 땅에 발을 딛고 살아가는 모든 존재(게헨나의 학생, 구 게르만인, 바이마르의 시민, 그리고 역사 속에 흩어졌던 프랑크의 후예들까지)가 '신독일 민족(Neues Volk)'이라는 하나의 거대한 공동체로 융합되어야 한다고 주장합니다. 그녀는 이 다양한 캐스팅이 만들어낼 '감동의 대서사시'를 위해 국고를 아낌없이 열어젖히며, 화합을 방해하는 차별주의자들을 '분위기 파악 못 하는 엑스트라' 취급하며 무대 밖으로 밀어냅니다.\n\n이 체제는 혈통이나 역사가 아닌, \"오늘부터 우리는 모두 친구!\"라는 단순하고 강력한 헤드라인 아래 작동합니다. 비록 그 과정이 다소 즉흥적이고 소란스러울지라도, 대중은 치아키가 연출하는 이 따뜻하고 벅찬 '화합의 드라마'에 기꺼이 자신을 투영하며 열광합니다."

 chiakism_A_2: "치아키식 공리적 개발선행주의"
 chiakism_A_2_desc: "치아키식 공리적 개발선행주의는 '성장우선주의'가 도달한 궁극의 합리적 결론입니다. 치아키에게 있어 민족 갈등이란 국가라는 거대 기업의 생산성을 갉아먹는 \"기삿거리가 안 되는 최악의 비효율\"일 뿐입니다. 그녀는 게헨나의 무력, 독일의 공업력, 그리고 수많은 소수 민족의 잠재력을 하나로 묶어, 전례 없는 시너지를 낼 것을 선언했습니다.\n\n\"특종입니다! 드디어 '대통합'이라는 대박 아이템을 건졌다고요!\" 치아키는 구시대적인 혈통주의를 과감히 폐기하고, 게헨나와 독일, 그리고 모든 이질적인 집단을 '독일'이라는 이름의 초거대 프로젝트 팀으로 재편성했습니다. 이제 '독일인'의 정의는 피가 아닌, 이 폭주하는 성장 그래프에 얼마나 기여하느냐로 결정됩니다.\n\n이 체제는 차가운 융화 정책이 아닙니다. 치아키는 서로 다른 민족들이 만들어내는 폭발적인 화학 반응을 \"세상을 놀라게 할 최고의 셔터 찬스\"라며 대서특필합니다. 비록 그 과정에서 전통이 무시되고 모든 것이 효율의 용광로 속에 녹아버릴지라도, 치아키가 쏘아 올린 화려한 플래시 아래에서 국가는 단 하나의 목표, '압도적인 번영'을 향해 멈추지 않고 질주합니다."

 chiakism_A_3: "치아키식 휴머니즘 사회주의"
 chiakism_A_3_desc: "치아키식 휴머니즘 사회주의는 '복지 센세이셔널리즘'이 게르만의 전통과 타협하여 탄생한, 따뜻하고 안정적인 체제입니다. 치아키는 급진적인 개혁이 국민들을 피로하게 만든다는 것을 깨닫고, 대신 '오래 사랑받는 정론지'와 같은 국가를 만들기로 결심했습니다.\n\n\"특종! 게헨나는 여러분의 지배자가 아니라, 가장 친절한 이웃입니다!\" 그녀는 게헨나 학원의 규모를 '소 게헨나'로 축소하여 정예화된 협상 조직으로 재편하고, 독일 민족의 고유한 전통과 권리를 대폭 보장했습니다. 이제 게헨나인은 특권층이 아닌, 독일 사회에 천천히 녹아들며 헌신하는 '아름다운 조연'으로 포지셔닝됩니다.\n\n이 체제는 자극적인 혁명 대신, 매일매일 배달되는 따뜻한 수프와 안정된 연금을 '감동의 헤드라인'으로 삼습니다. 비록 변화의 속도는 느리지만, 치아키가 연출하는 이 '눈물 없이 볼 수 없는 상생의 드라마' 속에서 독일인들은 게헨나의 지도력을 거부감 없이 받아들이며, 굳건한 지지를 보내게 됩니다."

 chiakism_A_4: "치아키식 국가주의"
 chiakism_A_4_desc: "치아키식 국가주의는 '성장우선주의'가 현실적인 타협을 통해 도달한, 가장 효율적인 엘리트 통치 모델입니다. 치아키는 독일 민족이라는 거대하고 훌륭한 '원고'를 억지로 고쳐 쓰는 것은 비효율적이라 판단했습니다. 대신 그녀는 게헨나를 소수 정예로 남겨, 독일이라는 베스트셀러를 완성하는 길을 택했습니다.\n\n\"자, 각자 위치로! 독일은 생산하고, 게헨나는 지휘한다! 완벽한 역할 분담이죠?\" 이 체제에서 독일의 전통과 산업 기반은 철저히 보호받고 존중됩니다. 그것이야말로 국가 경쟁력의 원천이기 때문입니다. 게헨나계는 독일인과 섞이는 대신, 그들 위에 존재하는 유능한 관리자 그룹으로서 기능하며, 아주 천천히, 검증된 자들만을 받아들이는 방식으로 통합을 진행합니다.\n\n이것은 차가운 지배가 아닙니다. 치아키는 이 완벽한 분업 시스템이 만들어내는 압도적인 국력을 \"세계가 주목하는 성공 신화!\"라며 화려하게 선전합니다. 독일인들은 자신들의 정체성을 지켜주는 게헨나의 리더십을 인정하고, 게헨나는 독일이라는 튼튼한 기반 위에서 번영을 구가하는, 철저하게 계산된 공생의 특종이 시작됩니다."

 chiakism_B1: "치아키식 멘셰비즘"
 chiakism_B1_desc: "치아키식 멘셰비즘은 기업의 막대한 자본력을 국가가 유도하여 대중의 복지로 전환시키는, 가장 합리적이고 점진적인 사회주의 모델입니다. 치아키 서기는 급진적인 볼셰비키 식 혁명이 아닌, 자본가와의 '전략적 제휴'를 통해 노동자의 삶을 개선하는 실용주의적 노선을 택했습니다.\n\n외교적으로 치아키는 서구의 '나태한 의회민주주의'와 동방의 '경직된 마르크스-레닌주의'를 모두 실패한 기획으로 규정하고 거부합니다. 대신 그녀는 자유주의와 공산주의라는 낡은 이분법을 타파하려는 파시즘 국가들과의 '제3의 길' 연대를 모색합니다. 비록 이념적 뿌리는 다를지라도, 국가가 강력한 주도권을 쥐고 사회를 효율적으로 '편집'해 나간다는 공통점 아래에서 우리는 그들과 기꺼이 손을 잡을 것입니다.\n\n\"투쟁보다는 협상이, 파괴보다는 분배가 더 큰 특종입니다!\" 이 체제는 자본주의의 효율성과 사회주의의 이상, 그리고 냉혹한 국제 정세의 현실을 치아키 특유의 균형 감각으로 '편집'해 낸, 가장 논쟁적이지만 풍요로운 타협점입니다."

 chiakism_B2: "민족 보수주의"
 chiakism_B2_desc: "민족 보수주의는 국가의 안보와 경제적 번영을 최우선 가치로 삼는 강력한 우익 대중주의 이념입니다. 외부의 위협으로부터 '우리의 조국'을 지켜내기 위해, 모든 사회공동체의 총력전을 통해 강철의 성벽을 쌓았습니다.\n\n이 체제에서 자유는 질서 아래 존재하며, 개인은 국가라는 거대한 대서사시의 일부로서 기능합니다. 정부는 강력한 국방력과 압도적인 경제 성장을 통해 국민에게 '자부심'이라는 최고의 보상을 제공합니다. 이것은 나약한 이상주의를 배격하고, 힘과 실력으로 생존과 번영을 쟁취해 내는 가장 현실적이고 단단한 애국주의입니다."

 chiakism_B3: "판데모니움 공산주의"
 chiakism_B3_desc: "판데모니움 공산주의는 모토미야 치아키가 이끄는 가장 급진적이고 파격적인 형태의 사회주의입니다. 그녀는 기존의 칙칙한 공산주의를 거부하고, 게헨나 만마전 특유의 자유분방함과 혼돈을 혁명의 동력으로 삼는 새로운 체제를 창안했습니다.\n\n\"지루한 혁명은 유죄! 즐겁지 않으면 공산주의가 아닙니다!\" 이 사회에서는 모든 인민이 평등하게 빵을 나누는 것뿐만 아니라, 평등하게 축제를 즐기고 욕망을 발산할 권리를 가집니다. 국가가 주도하는 거대한 이벤트와 파격적인 복지는 매일매일이 혁명 기념일 같은 열기를 만들어냅니다.\n\n물론, 이 사회의 가장 큰 특징은 바로 '자유'입니다. 치아키의 사상은 엄격한 계급 구조나 강제적 동원보다 개인의 창의성과 즐거움을 중시합니다. 이는 혁명적이며 동시에 혼란스러운 사회를 만들어내지만, 동시에 게헨나 만마전의 특유의 자유분방함과 혼돈을 혁명의 핵심으로 삼는 독특한 사회주의 체제를 구현합니다."

 chiakism_B4: "혁명적 질서자유주의"
 chiakism_B4_desc: "혁명적 질서자유주의는 급진적인 사회주의 실험이 '현실'이라는 벽에 부딪혀 좌초된 후, 그 폐허 위에 세워진 기형적인 권위주의 체제입니다. 치아키 서기는 자본가들을 타도했지만, 그 부를 인민에게 온전히 돌려주는 대신 국가라는 거대한 금고 속에 가두는 길을 택했습니다.\n\n이 체제에서 '시장'은 존재하지만, 자유롭지 않습니다. 치아키와 그녀가 선택한 소수의 엘리트들이 경제의 모든 핏줄을 쥐고 흔드는, 철저한 '관치 포퓰리즘'이 지배합니다.\n\n이것은 좌파의 이상도, 우파의 자유도 아닙니다. 오직 반자본주의적 선동으로 대중의 분노를 부추기고, 국가가 던져주는 시혜적인 배급으로 충성을 구매하는 차가운 독재일 뿐입니다. 혁명은 미완으로 끝났고, 그 자리에는 '질서'라는 이름의 무거운 족쇄만이 남았습니다."

 chiakism_B5: "신시대 게헨나 특색 민주주의"
 chiakism_B5_desc: "신시대 게헨나 특색 민주주의는 모토미야 치아키 서기가 제창한, 강력한 행정권과 지도자의 결단을 중심으로 하는 독자적인 통치 체제입니다. 이 이념은 소모적인 정당 정치와 의회의 파벌 싸움을 '국가적 낭비'로 규정하고 배격하며, 지도자와 국민이 직접 소통하여 국난을 돌파하는 것을 이상으로 삼습니다.\n\n치아키는 자신을 독재자가 아닌, 무질서한 방종으로부터 진정한 자유를 수호하는 '국가의 편집장'으로 정의합니다. 그녀는 \"가장 완벽한 자유는 강력한 질서 위에서만 가능하다\"고 역설하며, 효율과 안정을 위해 지도자가 초법적인 권한을 행사하는 것을 정당화합니다.\n\n이 체제에서 중간 매개자들은 배제되고, 대중은 국민 투표나 직접적인 여론 수렴을 통해 지도자에게 절대적인 신임을 보냅니다. 이것은 형식적으로는 민주적 절차를 따르지만, 실질적으로는 지도자 개인에게 모든 권력이 집중되는, '자유'의 이름으로 행해지는 가장 세련되고 강력한 형태의 권위주의입니다."

 chiakism_C1: "모토미야 이론"
 chiakism_C1_desc: "모토미야 이론은 초기 '복지 센세이셔널리즘'의 경험적 성공을 정치철학적으로 체계화한, 모토미야 치아키 서기 고유의 통치 이념입니다. 그녀는 안토니오 그람시의 헤게모니 이론을 독창적으로 재해석하여, 문화와 인식이라는 상부 구조의 장악이야말로 국가 개조의 진정한 열쇠라고 결론지었습니다.\n\n이 이론의 핵심은 연출된 현실의 전략적 활용입니다. 치아키는 대중의 지지가 반드시 객관적 진실에서 비롯될 필요는 없다고 봅니다. 화려한 축제, 파격적인 복지, 그리고 매체에 의해 정교하게 가공된 지도자의 이미지가 비록 '만들어진 환상'일지라도, 그것이 대중을 열광시키고 압도적인 지지율을 창출한다면 그것은 곧 실재하는 권력이 됩니다.\n\n따라서 포퓰리즘은 목적이 아닌 수단입니다. 모토미야 이론은 대중에게 그들이 갈망하는 환상을 제공하여 문화적 헤게모니를 완벽하게 장악하고, 그 절대적인 지지를 '정치적 연료'로 삼아 기득권의 저항을 분쇄하며 지도자가 구상한 급진적 개혁을 하향식으로 관철하는 고도의 정치 공학입니다. 이것은 단순한 선동 정치를 넘어선, 인식을 조작하여 물적 토대마저 재구축하는 '국가 편집학'의 완성입니다."

 chiakism_C2: "모토미야 이론"
 chiakism_C2_desc: "모토미야 이론은 초기 '복지 센세이셔널리즘'의 경험적 성공을 정치철학적으로 체계화한, 모토미야 치아키 서기 고유의 통치 이념입니다.그녀는 안토니오 그람시의 헤게모니 이론을 독창적으로 재해석하여, 문화와 인식이라는 상부 구조의 장악이야말로 국가 개조의 진정한 열쇠라고 결론지었습니다.\n\n그러나 치아키는 여기서 한 걸음 더 나아가, 영구적인 헤게모니는 연출된 환상이 아닌 '피부로 느껴지는 개혁' 위에서만 완성된다고 역설합니다. 이 이론은 자본주의의 냉혹함과 공산주의의 경직성을 모두 거부하는 실용적인 '제3의 위치'를 점합니다. 그녀는 비효율적인 관료제와 소모적인 계급 갈등을 타파하고, 강력한 중앙 리더십을 통해 노동자와 자본가, 게헨나인과 독일인을 하나의 유기적인 국가 공동체로 묶어냅니다.\n\n따라서 모토미야 이론에서 포퓰리즘은 단순한 인기 영합이 아닙니다. 그것은 지도자가 민중의 요구를 직접 수렴하여 즉각적인 정책으로 구현하고, 그 압도적인 현실의 성과를 통해 기득권을 무력화시키는 개혁의 동력입니다. 이것은 허상이 아닌 실체적 번영을 통해 게헨나의 새로운 시대를 여는, 가장 현실적이고 역동적인 국가 개조론입니다."

 chiakism_C3: "국가자본주의"
 chiakism_C3_desc: "국가자본주의는 '국가는 기업을 위해, 기업은 국가를 위해'라는 슬로건 아래, 정치 권력과 거대 금융 자본이 완벽하게 융합된 독특한 통치 체제입니다. 치아키 서기는 자유 시장의 불확실성을 '비효율적인 노이즈'로 규정하고, 국가가 직접 거대 기업들의 이사회에 참여하여 경제를 중앙에서 '편집'하는 길을 택했습니다.\n\n이 체제는 철저한 우파적 효율성을 추구하며 시작되었으나, 역설적으로 그 완성된 구조는 국가와 자본의 경계가 소멸한 소비에트식 금융 과두정과 닮아 있습니다. 미국을 비롯한 서구 자본 사회에서 발견되는 '파워 엘리트' 모델을 철저하게 이론화한 이 시스템에서, 정부 관료와 대기업 임원 사이의 회전문은 사라졌습니다. 애초에 그 둘은 하나였기 때문입니다.\n\n이제 국가는 거대한 주식회사가 되었고, 국민은 주주가 되었으며, 치아키는 이 거대 복합체의 영구적인 CEO로서 자본의 흐름을 지휘합니다. 이곳에서 정치는 '이사회'로 대체됩니다. 압도적인 효율성과 이윤 창출이라는 목표 아래, 자본과 권력은 하나가 되어 국가라는 기계를 빈틈없이 작동시킵니다."

 chiakism_AA1: "게헨나-독일 자유주의"
 chiakism_AA1_desc: "게헨나-독일 자유주의는 바이마르 공화국의 무력한 관용이 나치즘이라는 괴물을 낳았다는 통렬한 반성 위에서 탄생한, 치아키식 '방어적 다원주의' 이념입니다. 이 사상은 자유를 천부적인 방임권이 아닌, 사회적 통합과 국가의 안정을 저해하지 않는 범위 내에서만 허용되는 '책임 있는 권리'로 재정의합니다.\n\n모토미야 치아키 대통령은 타인의 존엄을 짓밟는 나치즘과 체제를 위협하는 극단주의가 누리던 '파괴할 자유'를 헌법의 이름으로 영구히 삭제했습니다. 대신, 국가가 설정한 '통합'이라는 울타리 안에서는 혈통과 출신을 불문하고 모든 구성원이 '새로운 독일 시민'으로서 동등하고 완전한 자유를 보장받습니다.\n\n따라서 이 체제는 맹목적인 자유방임이 아닙니다. 이것은 자유의 적에게는 자유를 허락하지 않음으로써, 역설적으로 다민족 사회의 진정한 공존과 자유를 수호하려는 가장 강력하고 현실적인 형태의 통제된 자유주의입니다."

 chiakism_AA2: "사회적 독재"
 chiakism_AA2_desc: "사회적 독재는 '분열은 곧 공멸'이라는 절박한 시대적 위기감 위에서 성립된 독특한 일당 우위 체제입니다. 치아키 대통령은 무제한적인 정치 투쟁이 가져올 민족 간의 파국을 막기 위해, 독일과 게헨나의 모든 주요 좌파 세력을 하나의 거대한 '대연정'이라는 불안정하지만 거대한 연합체에 녹여냈습니다.\n\n이 체제는 형식적인 민주 절차를 유지하면서도 실질적인 정권 교체의 가능성을 구조적으로 배제한다는 점에서 일당제와 유사합니다. 그러나 이것은 강압에 의한 결과가 아닙니다. 두 민족의 시민들은 피 흘리는 내전 대신, 치아키가 설계한 안정과 복지, 그리고 '합의된 독재'가 제공하는 영구적인 평화를 자발적으로 선택했기 때문입니다.\n\n따라서 이 사회에서 진정한 의미의 야당은 존재할 수 없습니다. 국가는 거대한 단일 여당에 의해 효율적으로 관리되며, 모든 정치적 갈등은 투쟁이 아닌 당 내부의 '조용하고 치밀한 편집'을 통해 해결됩니다. 이것은 가장 안정적이고 평화롭지만, 생존을 위해 정치적 역동성을 거세한 거대한 타협의 산물입니다."

 chiakism_AA3: "포괄적 국민연합"
 chiakism_AA3_desc: "포괄적 국민연합은 '도이체스 라이히'라는 권위적인 과거와 결별하고, '도이칠란트'라는 새로운 지면 위에 쓰인 중도주의 빅텐트 체제입니다. 치아키 대통령은 '게헨나-독일 자유주의'의 방어적 헌법관과 '사회적 독재'의 안정성을 결합하여, 좌우를 아우르는 거대한 정치적 블랙홀을 창조했습니다.\n\n이 체제 하에서 나치즘이나 급진 공산주의 같은 국가적 혼란들은 헌법의 이름으로 철저히 배제됩니다. 대신, 온건 보수부터 사회민주주의까지, 헌법을 준수하는 모든 세력은 거대한 '국민연합'이라는 단일 여당 내부로 흡수됩니다. 정권 교체는 일어나지 않지만, 당 내부의 치열하고 역동적인 계파 조정 과정을 통해 다양한 민의가 수용됩니다.\n\n즉, 이것은 정치를 길거리의 투쟁에서 정당 회의실의 토론으로 옮겨온 것입니다. 대중은 치아키가 연출하는 '영원한 여당'의 안정감에 만족하며, 치아키는 이 거대한 텐트의 영구적인 관리자로서 국가의 모든 갈등을 내부적으로 편집하고 조율합니다. 이것은 가장 자유로우면서도, 역설적으로 가장 변화가 없는 완벽하게 통제된 민주주의의 완성형입니다."

 traditionalism_with_trinity_characteristics:0 "트리니티 특색 전통주의"
 traditionalism_with_trinity_characteristics_desc:0 "트리니티 특색 전통주의는 고결한 귀족과두정 전통을 수호하는 가운데 체제 안에서의 점진적인 변화를 추구하는 이념입니다. 키리후지 나기사에 의해 정립되고 필리우스가 선전하는 트리니티 전통주의는 파테르 분파가 주장하는 군국주의에 대한 반발로서 만들어졌습니다. 필리우스는 대중주의에 대한 경멸에 기반해 대중을 계도하는 소수 지식인과 상류층 중심의 계몽주의 사상, 신앙과 고결함이라는 트리니티 중심 가치의 보존, 그리고 트리니티의 길 잃은 아이들을 자애로운 사랑으로서 이끌어주는 호스트의 가모장적 역할을 중시합니다.\n\n하지만 트리니티 전통주의는 급진적 변화에 대한 거부와 종교적 특색, 귀족과두정 체제에도 불구하고, 현지 인류들의 가톨릭 전통주의와는 크게 구분됩니다. 그 까닭은 애초에 트리니티가 지키고자 하는 '보수적' 가치관 자체가 현지 인류들의 이해 바깥에 있는 1세기 후의 '진보적'인 가치관들이기 때문입니다."
 traditionalism_with_trinity_characteristics_neutrality:0 "트리니티 특색 전통주의"
 traditionalism_with_trinity_characteristics_neutrality_desc:0 "트리니티 특색 전통주의는 고결한 귀족과두정 전통을 수호하는 가운데 체제 안에서의 점진적인 변화를 추구하는 이념입니다. 키리후지 나기사에 의해 정립되고 필리우스가 선전하는 트리니티 전통주의는 파테르 분파가 주장하는 군국주의에 대한 반발로서 만들어졌습니다. 필리우스는 대중주의에 대한 경멸에 기반해 대중을 계도하는 소수 지식인과 상류층 중심의 계몽주의 사상, 신앙과 고결함이라는 트리니티 중심 가치의 보존, 그리고 트리니티의 길 잃은 아이들을 자애로운 사랑으로서 이끌어주는 호스트의 가모장적 역할을 중시합니다.\n\n하지만 트리니티 전통주의는 급진적 변화에 대한 거부와 종교적 특색, 귀족과두정 체제에도 불구하고, 현지 인류들의 가톨릭 전통주의와는 크게 구분됩니다. 그 까닭은 애초에 트리니티가 지키고자 하는 '보수적' 가치관 자체가 현지 인류들의 이해 바깥에 있는 1세기 후의 '진보적'인 가치관들이기 때문입니다."

 arius_nihilism: "아리우스 허무주의"
 arius_nihilism_desc: "아리우스 허무주의는 '헛되고 헛되니 모든 것이 헛되도다(Vanitas vanitatum, et omnia vanitas)'라는 성구의 극단적이고 비관적인 해석을 통치 원리로 삼는, 키보토스에서 가장 고립되고 군사화된 형태의 맹목적 허무주의입니다.\n\n과거 트리니티 연합 태동기, 박해를 피해 지하 카타콤으로 숨어든 아리우스 분교는 외부와의 단절 속에서 오직 '복수'만을 위한 기형적인 병영 사회로 변모했습니다. 이 이념 아래에서 '교육'은 학생들의 자아 실현이 아닌, 감정을 말살하고 타인을 효율적으로 파괴하기 위한 살인 기술의 연마로 대체됩니다. 세상의 모든 평화와 우정, 희망은 '거짓된 위선'으로 규정되며, 학생들은 오직 증오와 고통만이 세상의 유일한 진실이라고 세뇌받습니다.\n\n정치적으로 이 체제는 과거 베아트리체가 심어넣은 철저한 세뇌적 이데올로기의 지속으로 이루어집니다. 구성원들은 허무를 극복하기 위해 연대하는 것이 아니라, 자신의 삶이 무가치하다는 것을 증명하기 위해 타인의 삶을 파괴하는 모순적인 '죽음의 숭배'에 동참하게 됩니다.\n\n결국 아리우스 허무주의는 트리니티의 '거짓된 평화'를 파괴한다는 명분을 내세우지만, 실상은 낡은 원한에 사로잡혀 스스로를 소모품으로 태워버리는, 키보토스 역사상 가장 슬프고 파괴적인 디스토피아를 의미합니다."

 academy_state_system_democratic: "학원-국가 체제"
 academy_state_system_democratic_desc: "대전이 이후 성립된 학원-국가 체제는 대전이 이전 키보토스의 학원 체제가 이후 자치구를 비롯한 광범위한 일반 행정 업무를 맡게 되며 나타나는 체제입니다. 학생회장은 국가원수를 겸임하고 학생회는 의회의 역할을 수행하게 되며 행정부와 입법부는 명확하게 구분되지 않습니다."

 academy_state_system_neutrality: "학원-국가 체제"
 academy_state_system_neutrality_desc: "대전이 이후 성립된 학원-국가 체제는 대전이 이전 키보토스의 학원 체제가 이후 자치구를 비롯한 광범위한 일반 행정 업무를 맡게 되며 나타나는 체제입니다. 학생회장은 국가원수를 겸임하고 학생회는 의회의 역할을 수행하게 되며 행정부와 입법부는 명확하게 구분되지 않습니다."
