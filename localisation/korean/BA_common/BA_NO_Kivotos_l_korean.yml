 BA_sov_making_ssr_cat: "SSR 설립"
 BA_sov_making_ssr_cat_desc: "SSR은 '소비에트 사회주의 공화국'의 약어로, 소련을 구성하는 개별 공화국을 지칭하는 용어입니다. 소련은 명목상 주권 국가들의 연맹체이고, 각 구성국은 '소비에트 사회주의 공화국'이라는 지위를 갖고 있습니다. 이론적으로 SSR은 연방을 자유롭게 탈퇴할 권리가 있었지만, 이는 아마 '소련 최후의 날'에나 행사될 수 있을 것입니다."
