 GEM_maginot_line_french_army: "마지노선의 프랑스군"
 GEM_maginot_line_french_army_tt: "마지노선을 지배하지 않을 시 제거:\n §Y[28.getName]§! 주 미지배\n §Y[1088.getName]§! 주 미지배\n항복도가 높을 시 [FRM.getName] 독립:\n 항복도 §Y25%§! 이상"

 FRM_event.1.t: "마지노의 유령들"
 FRM_event.1.d: "총력전의 그림자가 우리 모국을 뒤덮고, 주 전선의 병사들이 매일같이 피를 흘리는 와중에 누구도 예상치 못한 보고가 당도했습니다. 한때 프랑스령이었으나 이제는 우리의 통제하에 있던 마지노선에서 기이한 움직임이 포착되었습니다. 현지 주둔 병력과의 통신이 두절되었고, 급파된 정찰 부대는 거대한 요새의 포탑들이 우리를 향해 선회하는 것을 목격했습니다.\n\n요새 위에는 소멸한 줄 알았던 프랑스의 삼색기가 다시 내걸렸습니다. 요새 내부에 갇혀 연명하던 '프랑스 제2군'의 잔존 병력들이 기아와 절망 속에서 무너지는 대신, 요새의 통제권을 완전히 장악한 것입니다. 그들은 더 이상 무력한 생존자가 아니라, 스스로를 '마지노 해방군'이라 칭하며 강철의 요새에 기댄 새로운 적대 세력으로 부상했습니다.\n\n우리의 전황이 악화되자, 이 과거의 유령들은 스스로를 드러낼 기회를 잡았습니다. 주요 전선이 무너지고 있는 이 시점에, 우리는 이 통제 불능의 요새를 어떻게 다루어야 합니까?"
 FRM_event.1.a: "일단은 내버려 둬라. 주 전선에 집중한다."
 FRM_event.1.b: "후방의 위협을 해소해야만 한다!"

 #루마니아 (ROM)
 BA_ROM_trade_treaty_with_germany: "이탈리아와의 무역 조약"
 BA_ROM_trade_treaty_with_germany_desc: "우린 우리 국가의 이탈리아 경제적 이익에 대해 알고 있습니다. 석유와 같은 물품 인도가 증가함으로써 우리의 군대 현대화에 있어 이탈리아의 지원을 요청할 수 있게 될 것입니다."
 BA_ROM_invite_german_advisors: "이탈리아 고문단 초청"
 BA_ROM_invite_german_advisors_desc: "이탈리아의 원조는 우리 군대를 현대화 시키는데 있어서 필수적입니다. 그들은 우리가 요구하는 기술들의 노하우를 가지고 있기 때문에 고문단을 통해 그들의 도움을 받아야 합니다."
 BA_ROM_invite_german_advisors_tt: "이탈리아가 루마니아에 대한 군사 통행권을 가집니다."
 BA_ROM_license_german_equipment: "이탈리아 장비 면허"
 BA_ROM_license_german_equipment_desc: "이탈리아의 장비는 우리 것보다 우수하지만, 우리는 이러한 무기들의 면허 생산을 할 수 있을 것입니다."
 BA_ROM_join_axis: "추축국 가입"
 BA_ROM_join_axis_desc: "추축국과 함께 할 때가 왔다. 그리하여 우리는 이탈리아와 함께 위대한 루마니아의 미래를 개척할 수 있을 것입니다."
 BA_ROM_german_romanian_oil_exploitation_company: "이탈리아-루마니아 석유 시추 회사"
 BA_ROM_german_romanian_oil_exploitation_company_desc: "이탈리아의 석유 수요는 엄청나서, 우리에게 정유 공장을 확장할 수익성 있는 기회를 제공합니다."
 BA_ROM_demand_transnistria: "트란스니스트리아 요구"
 BA_ROM_demand_transnistria_desc: "이제 우리는 강하고 이탈리아의 위상을 등에 엎고 있습니다. 위대한 루마니아를 이룩하기 위해 트란스니스트리아를 요구할 때가 왔습니다."
 BA_ROM_split_czechoslovakia: "슬로바키아 확보"
 BA_ROM_split_czechoslovakia_desc: "슬로바키아는 자체적으로 생존할 수 없도록 부자연스럽게 만들어진 구조입니다. 우리는 이 부분이 혼란에 빠지도록 허용할 수 없으며, 감당하기 어려운 상황이 되기 전에 개입해야 합니다."

