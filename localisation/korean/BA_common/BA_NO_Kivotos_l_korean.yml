 BA_sov_breakthrough_of_massive_isolation_cat_desc: "우리가 5개년 계획을 위해 공작기계를 수입하고 전문가를 초청하던 유럽은 사실상 소멸했으며, 키보토스라고 불리는 세력은 의도적으로 소련과의 무역을 배제하며 봉쇄에 동참하고 있습니다. 미국은 우리의 손을 뿌리쳤고, 일본은 극동을 노리고 있는 이 상황을 우리는 강력하게 돌파해야 합니다!"
