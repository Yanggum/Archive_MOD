 #아일랜드
 IRE_celt: "켈트 복원"
 IRE_celt_desc: "켈트의 민족들이 다수 흩어지고 난후, 켈트 사람들은 프랑스, 영국, 아일랜드외의 국가들에 널리 퍼져있습니다. 이제, 아일랜드가 일어섰으니, 그들을 통합시켜야 합니다."
