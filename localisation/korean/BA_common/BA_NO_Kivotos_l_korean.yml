 l_korean: 
 #동아프리카 
 ENG_eastern_african_unification: "동아프리카 통합의 열망"
 ENG_eastern_african_unification_desc: "통합된 동아프리카 공동체라는 개념이 수면 위로 드러났습니다. 많은 지식인들이 동아프리카의 식량-산업-경제-안보 공동 협력을 위해 공동체가 필요하다고 이야기합니다."
 ENG_EA_economy: "동아프리카 통합경제"
 
 #이집트
 EGY_Binah: "사막의 괴수"
 EGY_Binah_desc: "여지껏 알 수 없는 이존재들의 침략은 유럽으로만 한정되는 것으로 여겨졌습니다. 그러나 이집트의 사막에서 알 수 없는 괴수가 등장했다는 소문이 최근 지속되고 있습니다. 당국은 사막의 출입을 통제하고 소문의 진실을 확인하기 위해 사막을 수색하는 중입니다."

 #소련
  #국민정신
 BA_SOV_toward_warsaw: "바르샤바에로의 행진곡"
 BA_SOV_toward_warsaw_tt: "이 §Y국민정신§!은 §Y240일§!마다 최대 §Y3§!번 §G강화§!됩니다."
 BA_SOV_support_kriegsmarine: "전쟁해군 지원"
 BA_SOV_supporting_kriegsmarine: "붉은해군의 지원"
 BA_SOV_massive_isolation: "거대한 고립"
 BA_SOV_massive_isolation_desc: "유럽은 대전이라는 거대한 용광로 속에서 불타 사라졌고, 우리의 기계들이 숨 쉴 구멍 또한 재와 함께 흩어졌습니다. 바다 건너 미합중국은 차가운 침묵으로 우리의 손을 뿌리쳤습니다.\n\n지금 총학생회로 대표되는 키보토스 세력들은 폴란드와 루마니아의 '방역선'에 자신들의 무역로를 개방했고, 어머니 러시아의 숨통을 죄어오고 있습니다. 북쪽에서는 붉은겨울이라는 가짜 예언자들이 노르웨이의 설원 위에 트로츠키라는 망령을 불러들였습니다. 그곳에는 이제 신좌파와 트로츠키주의라는 끔찍한 혼종만이 남아, 조국을 향해 이빨을 드러내고 있을 뿐입니다.\n\n그러나, 연방의 붉은 별은 시련 속에서 더욱 붉게 타오르는 법입니다. 우리는 5개년 계획을 완성짓기 위해, 이 지독한 경제 봉쇄를 뚫고 나갈 것입니다. 소비에트의 깃발 아래, 인민의 불굴의 의지로!"
  #의견 모디파이어
 BASOV_anti_kivotos_policies_good: "반키보토스 정책"
 BASOV_anti_kivotos_policies_bad: "반키보토스 정책"
  #중점
 SOVEX_armed_protest_on_baltic: "발트 무력 시위"
 SOVEX_armed_protest_on_baltic_desc: "[LIT.getadjective], [LAT.getname], [EST.getname]의 인민들은 권위주의 과두정 아래서 신음하고 있습니다. 그들을 억압하는 자본독재정을 부숴내고 노동자 대중을 해방하기 위해서는 이들에 대한 해방작전을 예습할 필요가 있습니다."
 SOVEX_operation_on_black_sea: "흑해에서의 작전"
 SOVEX_operation_on_black_sea_desc: "[ROM.getadjective](와)과 [TUR.getadjective]의 해군 세력은 흑해에서 우리의 해상 교통로를 위협하고 있습니다. 우리는 흑해를 통해 이들에 대한 해안 상륙으로써 흑해에서의 우리의 우위를 확립해야 합니다."
 BA_SOV_armed_protest_modifier: "공세 계획"
 SOVEX_Helsinki_secret_treaty: "헬싱키 밀약"
 SOVEX_Helsinki_secret_treaty_desc: ""
 SOVEX_overthrow_the_Holy_League: "'신성동맹' 타도"
 SOVEX_overthrow_the_Holy_League_desc: "프랑스 혁명을 막기 위해 구세계의 군주들이 모여 결성한 '신성동맹'이 다시 우리의 혁명을 분쇄하기 위하여 재결성되고 있습니다. 이러한 우리의 서방 국가들의 반혁명적 행동을 더 이상 좌시할 수 없습니다. 선제적인 타격으로써 이들의 위협을 끊어내야만 합니다!"
 SOVEX_eastern_bloc: "'동구권'"
 SOVEX_red_scandinavia: "북부 공세"
 SOVEX_day_of_shame: "치욕의 날"
 SOVEX_reduce_authority_of_secretariat: "서기국 권한 축소"
 SOVEX_red_revenge: "붉은 복수"
 SOVEX_second_western_offensive: "제2차 서부 공세"
 SOVEX_second_western_offensive_desc: "바르샤바의 함락과 함께 폴란드의 도전은 종말을 맞이했습니다. 서방 국가들의 패권 붕괴가 가속화되면서 각국의 인민들 사이에서 혁명의 불길이 타오르고 있습니다. 그들은 이제 붉은 군대의 도래를 갈망하고 있습니다. 서부로 향하는 위대한 길이 열렸고, 붉은 군대는 역사의 부름에 응답할 준비를 마쳤습니다."


 SOVEX_anti_kivotos_policies: "반키보토스 정책"
 SOVEX_anti_kivotos_policies_desc: "키보토스 학원들과의 평화적인 공존은 있을 수 없습니다. 최대한 많은 동맹국을 확보하고 피할 수 없는 충돌에 대비해야 합니다."
 SOVEX_approach_milenium: "밀레니엄에 접근"
 SOVEX_approach_milenium_desc: "밀레니엄과 화해하지 못할 이유는 없습니다. 물론 밀레니엄과 평생 평화롭게 공존할 수는 없겠지만, 그들은 우리를 먼저 공격하지 않을 것입니다."
 SOVEX_liberate_oppressed_nations: "피억압민족 해방"
 SOVEX_liberate_oppressed_nations_desc: "서방 열강들은 그들의 제국주의적 이익을 위해 수많은 민족들을 억압하고 착취해왔습니다. 심지어 대전이 이후로 그들의 본토가 사라지자 그것은 더욱 강화되고 있습니다! 우리는 이들 피억압민족을 해방시켜 그들이 스스로의 운명을 결정할 수 있도록 도와야 합니다."
 SOVEX_partnership_with_kriegsmarine: "전쟁해군 압박"
 SOVEX_partnership_with_kriegsmarine_desc: "발트해에서의 원활한 작전을 위해서 [GEK.getadjective](와)과의 협력이 필수적입니다. 협력할 수 없다면, 적어도 그들이 행동하지 못하게라도 만들어야 합니다."
 SOVEX_partnership_with_kriegsmarine_tt: "\n§Y[GEK.getname]§! 정부는 §Y군정§!을 수립하여 §Y본토§!를 수복하기보다 신중하고 중립적인 §Y친[SOV.getadjective] 기조§!로 §G선회§!할 것입니다."
 SOVEX_border_force_expansion: "국경군 확장"
 SOVEX_border_force_expansion_desc: "이미 무너진 영국과 프랑스, 그리고 독일의 폐허 위로 적막이 깔린 지금, 더 이상 망설일 이유가 없습니다. 우리는 동부에 있는 모든 병력을 서쪽으로 옮겨 붉은 군대를 서부로 진격시킬 것입니다. 역사의 무게가 이 순간을 요구하고 있습니다. 과거의 대국들이 무너져간 그 자리에, 우리는 새로운 역사의 한 장을 써 내려가야만 합니다."
 SOVEX_subjugation_of_western_allies: "서방 연합국 제압"
 SOVEX_subjugation_of_western_allies_desc: "유럽 시장의 붕괴로 서방 연합국들은 거대한 경제적 위기에 휩싸였습니다. 그들의 힘은 서서히 무너져가고 있지만, 우리는 흔들림 없이 서 있습니다. 이제 우리는 그들에게 압박을 가해, 서부로 향하는 우리의 공세가 진행되는 동안 그들이 더 이상 걸림돌이 되지 못하도록 해야 합니다"
 SOVEX_italy_strategic_alliance: "[ITA.GetAdjective]와 전략 동맹"
 SOVEX_italy_strategic_alliance_desc: "[ITA.GetAdjective](은)는 유럽의 혼란 속에서도 우리의 의지를 공유하는 중요한 동맹입니다. 그들의 전략적 위치와 결단력은 서부로의 진격에 큰 힘이 될 것입니다. 우리는 [ITA.GetAdjective]와 협력하여 서방의 붕괴 속에서 새로운 질서를 세울 것입니다."
 SOVEX_operatsiya_operation: "작전: 붉은 폭풍"
 SOVEX_operatsiya_operation_desc: "초원이여,\n드넓은 초원이여,\n초원을 따라 영웅들이 나아간다.\n그래, 붉은 군대의 영웅들이여!\n우리의 말은 재빠르고 우리의 전차도 쾌속이라네!\n- 초원"

 SOVEX_soviet_federation_declaration_of_national_humanism: "인류 연합 선언"
 SOVEX_soviet_federation_declaration_of_national_humanism_tt: "이 국민정신은 §Y[SOV.GetNameWithFlag]§!이 §Y2차 서부 공세§!를 시작할 경우 일시적으로 우리가 아무 전쟁에도 참전할 수 없게 만들 것입니다."
 SOVEX_soviet_federation_declaration_of_national_humanism_2: "유럽 방관책"
 SOVEX_soviet_federation_declaration_of_national_humanism_2_desc: "소련의 프로파간다가 우리의 시민들에게 큰 영향을 끼쳐 우리가 소련의 공세를 저지하는 것을 불가능하게 만들고 있습니다."
 SOVEX_soviet_proposal: "소련의 제안"
 SOVEX_soviet_proposal_tt: "이 국민정신은 §Y[SOV.GetNameWithFlag]§!이 §Y2차 서부 공세§!를 시작할 경우 주요 키보토스 국가에 대한 전쟁 목표로 변환될 것입니다."
  #이벤트
 BA_sov_event.1.t: "외교 정책 선회"
 BA_sov_event.1.d: "서유럽에서의 '대전이' 현상과 폴란드와의 두 번째 전쟁, 서유럽 자본주의 열강의 몰락은 우리가 기존에 구상해 온 외무 계획 전반을 재검토하고 재작성하지 않을 수 없도록 하였습니다. 공산당과 외무인민위원부에서는 외교의 새로운 테제를 서둘러 기획하고 있으며 이는 향후 우리의 외교 정책에 크게 반영될 것입니다."
 BA_sov_event.1.a: "불안정한 시대다."
 BA_sov_event.1_tt: "§Y$SOV_anti_fascist_policies$§! 중점 §R비활성화§!\n§Y$SOV_approach_germany$§! 중점 §R비활성화§!\n§Y$SOV_send_military_advisors_to_spain$§! 중점 §R비활성화§!\n\n"
 BA_sov_event.3.t: "[SOV.getadjective]-[MIL.getadjective] 무역 협정"
 BA_sov_event.3.d: "[SOV.getadjective] 대사는 우리 외교관과 접선하여 두 나라간의 무역 협정을 제안했습니다. 제안에 따르면, [SOV.getname](은)는 우리에게 곡물, 면화, 기름, 금속 원석과 고무 등의 원자재를 보냅니다. 그 대가로, [SOV.getadjective](은)는 우리로부터의 적정한 기초과학 지식과 공학기술을 요구했습니다.\n이 협정은 분명 키보토스에 있는 적성국을 상대하는 전쟁에 도움이 될 것입니다."
 BA_sov_event.3.b: "우리의 기술을 그들과 공유하지 않을 것이다!"
 BA_sov_event.4.t: "[MIL.getname]의 $BA_sov_event.3.t$ 서명"
 BA_sov_event.4.d: "우리의 제안을 받아들이겠다고 [FROM.GetAdjective] 외교관이 알려 왔습니다. 우리 나라는 이제 공식적으로 무역 협정을 맺었으며, 그 내용은 [SOV.GetNameDef](이)가 [FROM.GetNameDef]에게 곡식, 면화, 기름, 금속 광석과 고무 등의 원자재를 보내는 것입니다. 그 대신 우리는 기초과학 지식과 공학기술을 받게 됩니다.\n이 협정은 우리의 현대 군사 기술 발전을 확실하게 도울 것입니다."
 BA_sov_event.4.a: "조국에 도움이 될 것이다."
 BA_sov_event.5.t: "붉은해군의 압박"
 BA_sov_event.5.d: "[SOV.getadjective]의 붉은해군이 고틀란트의 동부 해안을 봉쇄하고 우리에게 물자를 지원하고 있습니다. 달갑지 않지만 우리는 이들로부터의 도움을 활용할 수 있습니다."
 BA_sov_event.5.a: "고양이의 색깔을 가릴 때가 아니다!"
 BA_sov_event.6.t: "[SOV.getadjective]의 무력 시위"
 BA_sov_event.6.d: "[SOV.getname] 측 군대가 최근 발트 지방에서 빈번히 무력 시위를 조직하고 있습니다. 이와 같은 행동은 해당 권역에서의 긴장감을 높이고 있으며, [SOV.getadjective](와)과 발트해 국가들 간의 군사적 충돌 위험이 높아지고 있습니다."
 BA_sov_event.6.a: "저들을 위압하라!"
 BA_sov_event.6.b: "위협에 맞서라!"
 BA_sov_event.7.t: "[SOV.getadjective]의 해상 훈련"
 BA_sov_event.7.d: "[SOV.getname] 측 군대가 최근 흑해 해상에서 빈번히 군사 훈련을 조직하고 있습니다. 이와 같은 행동은 해당 권역에서의 긴장감을 높이고 있으며, [SOV.getadjective](와)과 흑해 국가들 간의 군사적 충돌 위험이 높아지고 있습니다."
 BA_sov_event.8.t: "전장의 교훈"
 BA_sov_event.8.d: "전쟁이 지속됨에 따라 우리는 [POL.getfactionname]에 대항하는 전략전술을 원활히 발전시킬 수 있었습니다. 이제 우리는 이 교훈들을 바탕으로 군사 훈련과 전투 준비를 개선할 수 있을 것입니다."
 BA_sov_event.8.a: "전선전 유지에 집중하자!"
 BA_sov_event.8.b: "기동방어가 필요하다."
 BA_sov_event.9.a: "중동 작전을 개시하자."
 BA_sov_event.9.b: "반군을 진압해야 한다."
 BA_sov_event.10.a: "발트를 짓밟아라!"
 BA_sov_event.10.b: "흑해를 향해!"

 
