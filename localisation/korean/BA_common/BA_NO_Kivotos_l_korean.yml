 BA_intermarium_solidarity_event.1.t: "새로운 동맹국"
 BA_intermarium_solidarity_event.1.d: "새로운 동맹국 [FROM.FROM.getname]이(가) [POL.getfactionname]에 가입했습니다. 이는 기쁜 소식이지만, 조율해야 할 의견이 하나 더 늘었다는 걸 의미하기도 합니다."
 BA_intermarium_solidarity_event.1.a: "이런."
 BA_intermarium_solidarity_event.2.t: "공동 군사 기금"
 BA_intermarium_solidarity_event.2.d: "우리의 방위비가 공동 군사 기금으로 되돌아왔습니다."
 BA_intermarium_solidarity_event.2.a: "좋군!" 
 BA_intermarium_solidarity_event.3.t: "공동 방위군"
 BA_intermarium_solidarity_event.3.d: "비축한 장비로 훈련한 공동 방위군이 전개됩니다."
 BA_intermarium_solidarity_event.3.a: "보람이 있군."
 BA_intermarium_solidarity_event.4.t: "[FROM.FROM.getname]의 단독강화"
 BA_intermarium_solidarity_event.4.d: "[FROM.FROM.getname]은(는) 동맹을 배신하고 단독으로 소련과 강화하였습니다."
 BA_intermarium_solidarity_event.4.a: "젠장."
 BA_intermarium_solidarity_event.5.t: "[FROM.getname]의 단독강화 요청"
 BA_intermarium_solidarity_event.5.d: "[FROM.getname]은(는) 미엥지모제로부터의 탈퇴를 조건으로 우리와 협상을 원하고 있습니다."
 BA_intermarium_solidarity_event.5.a: "그들이 원하는 대로 해라."
 BA_intermarium_solidarity_event.5.b: "말도 안되는 소리."
 BA_intermarium_solidarity_event.6.t: "미엥지모제의 붕괴"
 BA_intermarium_solidarity_event.6.d: "동맹국 간 결속은 풍전등화에 불과했습니다. 거대한 적 앞에 우리는 굴복하고 말았습니다."
 BA_intermarium_solidarity_event.6.a: "제길."

 
