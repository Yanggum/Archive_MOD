 BA_from_german_reconstruction: "독일 복원"
 BA_from_german_reconstruction_desc: "대전이 이후 무너진 독일은 새롭게 나타난 트리니티와 게헨나에 의해 지배되고 있었습니다. 이제, 우리가 이 영토들을 모두 수복했으니 진정한 독일을 선포할 시간입니다."
