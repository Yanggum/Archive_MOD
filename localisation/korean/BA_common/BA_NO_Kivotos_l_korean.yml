 #남부연합 
 CSA_eugene_talmadge: "유진 탈매지"
 CSA_absolutly_dixie: "반연방 남부주의자"
 CSA_eugene_talmadge_desc: "남부가 반으로 갈라지고 리치먼드가 함락된 이후, 자랑스러운 남부는 비열한 북부 억압자들에게 점령된 지 100년이 채 지나지 않았습니다. 미국의 지속적인 경제적 위기와 남부에 대한 억압과 핍박은 남부인들에게 하여금 다시 한번 연합의 정신을 상기시켰고, 그 결과 남부의 주들은 연방을 탈퇴하여 독립을 결의했습니다. 그리고 제퍼슨 데이비스처럼, 조지아의 탈매지는 남부연합의 대통령으로 취임했습니다. 이것은 전적으로 그가 평소에 남부의 가치를 잊지 않았기 때문에 가능한 일이었습니다.\n\n조지아 주에서 태어난 유진 탈매지는 가난한 농민의 아들로 성장하여 변호사와 농업 전문지를 거쳐 정계에 입문했습니다. 그는 거친 언변과 선동적인 연설로 농민과 백인 하층민들을 사로잡았으며, 언제나 연방정부의 간섭 없는 진정한 남부를 외쳤습니다. 대공황의 고통 속에서도 그는 뉴딜 정책을 '자유를 억압하는 워싱턴의 사슬'이라 부르며 맹렬히 반대했고, 대신 주 정부 권력 강화와 남부 농민 보호를 내세웠습니다. 남부의 농민들은 갈수록 악화되어가는 상황에서, 탈매지만이 자신들의 이익을 대변해주는 대변자라고 느끼고 있습니다.\n\n탈매지 행정부의 통치는 남부의 전통을 강조하고 연방정부의 권위를 부정하는 동시에 극단적인 민족주의와 경제적 포퓰리즘으로 특징지어집니다. 남부 백인들의 열성적인 지지층을 등에 업고, 탈매지는 지난 쓰라린 역사를 반복하지 않게 하기 위해 최선을 다할 것입니다."

