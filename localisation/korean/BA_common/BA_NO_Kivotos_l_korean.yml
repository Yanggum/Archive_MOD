 FRM_alsace_lorraine_republic: "알자스-로렌 평의회 공화국"
 FRM_alsace_lorraine_republic_desc: "단명했던 공화국이 다시 한번 세계에 모습을 드러냈습니다. 독일과 프랑스의 패전은 알자스-로렌의 사람들에게 하여금 자체적인 공동체의 수립과 자기보호를 신경쓰도록 만들었습니다. 그 결과가 현재 스트라스부르에서 자랑스레 빛나는 우리의 공화국입니다."
 FRM_stuck_in_double: "두 거인 사이에서"
 FRM_stuck_in_double_desc: "알자스와 로렌은 게헨나에게 수치스러운 점령과 함께 커다란 딜레마에 직면했습니다. 프랑스군이 구하러 오기에는 이곳은 아프리카와는 너무나 멉니다. 그렇다고 중립을 추구하기에는, 우리의 친구라 할 이들은 별로 없습니다. 우리는 독자적인 생존을 추구해야 할 것입니다."
 FRM_defeatism: "패배주의"
 FRM_defeatism_desc: "우리의 조국이 이계의 적들에게 무참히 쓸려나가는 모습을 본 우리의 장교와 군인들은 패배주의에 물들었습니다."
 FRM_isolation: "고립"
 FRM_isolation_desc: "우리는 어두운 요새에 의지해 버티고 있습니다. 고갈되는 보급물자와 지속되는 장병들의 사기 하락을 해결해야 합니다."
 
