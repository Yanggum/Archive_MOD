 POL_road_to_intermarium_union: "인터마리움 연방"
 POL_road_to_intermarium_union_desc: "인터마리움은 동유럽의 약소국들과 폴란드가 힘을 합친다면 독일과 소련이라는 두 거대한 위협에 맞설 수 있다는 희망 속에서 태어난 대담한 계획이었습니다. 이는 단순한 정치적 동맹을 넘어, 자유와 독립을 갈망하는 민족들의 절실한 꿈이었습니다.\n\n하지만 운명의 장난인지, 이 원대한 계획의 설계자인 피우수트스키가 갑작스럽게 사망하면서 인터마리움의 불꽃은 꺼져가는 듯했습니다. 그의 죽음과 함께 많은 이들의 희망도 사그라들었습니다.\n\n그러나 역사는 때로 예상치 못한 방향으로 흐릅니다. 소련이라는 거대한 적에 맞서 싸우며, 이들 국가들 사이에 피로 맺어진 유대감이 형성되었습니다. 전쟁의 포화 속에서 태어난 이 연대는, 과거 어느 정치적 협약보다도 강력했습니다.\n\n이제, 발트해와 흑해 사이의 국가들은 새로운 가능성을 마주하고 있습니다. 공동의 고난을 겪은 이들이 하나로 뭉친다면, 단순한 동맹을 넘어 진정한 연방의 탄생도 꿈꿀 수 있을 것입니다. 이는 더 이상 지도 위의 선이 아닌, 자유와 독립을 향한 열망으로 묶인 강력한 공동체가 될 것입니다."
