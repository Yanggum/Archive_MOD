 BA_pol_event.1.t: "바다의 사이 개념"
 BA_pol_event.1.d: "폴란드가 소련의 사악한 침공에 맞서기 위해서는 당연하겠지만 같은 이해관계를 가진 다른 동료들이 필요합니다. 우리는 그러한 국가들과의 동맹이 빨리 맺어지도록 최선의 노력을 할 것입니다."
 BA_pol_event.1.a: "국가생존의 문제다."
 BA_pol_event.2.t: "전쟁의 유산"
 BA_pol_event.2.d: "우리는 볼셰비키 제국주의에 맞서 나라를 지켜냈지만, 두 번째 전쟁을 막기 위해 더 많고 빠른 준비가 필요합니다."
 BA_pol_event.2.a: "지금은 국가 위기의 시대다."
 BA_pol_event.2_tt: "§g서부 영토의 산업 일부가 중앙 폴란드로 이전하였습니다:§!\n"
 BA_pol_event.2_tt_1: "§g\n우리는 금수조치로부터 벗어났습니다:§!"
 BA_pol_event.2_tt_2: "§g전시 동원이 진행되고 있습니다:§!"
 BA_pol_event.3.t: "고리키 회담"
 BA_pol_event.3.d: "우리의 주요한 도시들이 함락되면서 전세는 폴란드 측으로 급속히 기울었습니다. 지금 우리 군대는 폴란드뿐만이 아니라 내부의 봉건주의 백군 부흥세력과도 맞서고 있습니다. 폴란드 또한 이를 인지하고 있으며, 빠른 전쟁 종료를 위해 우리의 정부에게 제안을 하였습니다. 제안의 내용은 벨라루스와 서부-중앙 우크라이나를 해방하고 발트 3국에 대한 영향력을 포기하는 등 서부 지방에서의 우리의 힘을 매우 약화시키는 것이었으며, 이는 우리의 사실상의 패배를 인정하는 것이기도 합니다."
 BA_pol_event.3.a: "레닌이 그랬던 것처럼, 우리 또한 후일을 기약하자."
 BA_pol_event.3.b: "소비에트 인민은 끝까지 싸워 이긴다!"
 BA_pol_event.3_tt: "\n단, 우리는 §Y@RSA [RSA.getname]§! 측과의 §Y전쟁§!은 이어 갈 것입니다."
 BA_pol_event.4.t: "소련의 수락"
 BA_pol_event.4.d: "소련은 우리의 제안을 수락하였으며, 조국과 동맹은 다시 한 번 동유럽과 세계에 평화를 가져올 수 있었습니다."
 BA_pol_event.4.a: "폴란드 만세!"
 POL_win_of_intermarium_tt_1: "\n@POL §Y[POL.getname]§!: §Y동부 지역§! §G회복§!"
 POL_win_of_intermarium_tt_2: "\n@ROM §Y[ROM.getname]§!: §Y동방 지역§! §G확장§!"
 POL_win_of_intermarium_tt_3: "\n@ROM §Y[ROM.getname]§!: §Y베사라비아§! §G회복§!"
 POL_win_of_intermarium_tt_4: "\n@POL §Y[POL.getname]§!: §Y몰도바§! §G정부 수립§!"
 POL_win_of_intermarium_tt_5: "\n@UKR §Y[UKR.getname]§!: §Y서부 영토§!, §Y중부 영토§! §G수복§!"
 POL_win_of_intermarium_tt_6: "\n@LIT @LAT @EST §Y발트§!: §Y전 영토§! §G수복§!"
 POL_win_of_intermarium_tt_7: "\n@FIN §Y[FIN.getname]§!: §Y[SMI.getname]§!, §Y[KAR.getname]§! §G자치 정부 수립§!"
 POL_win_of_intermarium_tt_8: "\n@TUR §Y[FIN.getname]§!, @PER §Y[PER.getname]§! : §Y자캅카스§! §G정부 수립§!"
 POL_win_of_intermarium_tt_9: "\n@TUR §Y[FIN.getname]§! : §Y조지아§!, §Y아르메니아§! §G정부 수립§!"
 POL_win_of_intermarium_tt_10: "\n@PER §Y[PER.getname]§! : §Y아제르바이잔§! §G정부 수립§!"
 POL_win_of_intermarium_tt_11: "\n@PER §Y[PER.getname]§! : §Y[TMS.getname]§! §G정부 수립§!"
 POL_win_of_intermarium_tt_12: "\n@ROM §Y[ROM.getname]§!, @TUR §Y[TUR.getname]§! : §Y[CRI.getname]§! §G해방 및 중립국화§!"
 POL_win_of_intermarium_tt_13: "\n@BLR §Y[BLR.getname]§!: §Y서부 영토§! §G수복§!"
 BA_pol_event.5.t: "소련의 거절"
 BA_pol_event.5.d: "확정된 전세에도 불구하고, 소련은 항전을 선택하였습니다."
 BA_pol_event.5.a: "어리석군!"
 BA_pol_event.6.t: "고리키 회담"
 BA_pol_event.6.d: "[SOV.getname]에 대한 징벌적 공세가 성공하고 있는 지금, 더 이상의 소모적인 전쟁을 유지할 이유가 사라졌습니다. 우리의 전세적 우위를 이용하여 소련으로부터 동유럽 영토들과 그 외의 필요한 것들을 얻어내고, 더 중요한 다른 일들을 할 수 있을 것입니다."
 BA_pol_event.6.a: "전쟁도 외교다."
 BA_pol_event.7.t: "인테르마리움 동방 요새 계획"
 BA_pol_event.7.d_1: "[POL.getname] 외교부는 볼셰비키 제국주의에 맞선 동방 공동 요새를 건설하는 데에 우리가 협조할 것을 요청하였습니다."
 BA_pol_event.7.d_2: "우리는 볼셰비키 제국주의에 맞선 동방 공동 요새를 건설할 것입니다."
 BA_pol_event.7.a: "유비무환이다."
 BA_pol_event.7.b: "불필요한 일이다."
 BA_pol_event.8.t: "소비에트 - 폴란드 전쟁의 종결"
 BA_pol_event.8.d: "이른 아침, 폴란드와 소련 외교부는 공동성명을 발표하였습니다. 이는 양국 간의 적대 행위를 중단함을 비롯하여, 연방 구성국 일부를 독립시킴을 포함하였습니다. 이는 소련이 패전을 인정한 셈이나 다름 없으며, 폴란드는 지난 두 번의 패전에 대한 보상을 확실히 받았습니다."
 BA_pol_event.8.a: "우리의 승리다!"
 BA_pol_event.8.b: "조금의 후퇴일뿐."
 BA_pol_event.8.c: "소련은 위태롭다."
 BA_pol_event.9.t: "폴란드의 상황"
 BA_pol_event.9.d: " '전쟁이 우리에게 무엇을 남겼는가?'\n\n 지난 10년 간 폴란드 공화국을 이끌어온 사나치아 운동은 우리의 지도자 피우수트스키가 사망한 이래로 암울한 시기를 겪고 있습니다. 서부와 동부 모두에서의 패배는 사회 전역에 만연한 허망감과 패배주의를 낳고 있습니다.\n\n 그러나 우리에게 남은 건 이런 것들뿐만이 아닙니다. 우리의 지도자 피우수트스키는 '미엥지모제'라는 원대한 외교 정책을 우리에게 남겼습니다. 지난 우리의 패권주의적이고 군사적인 행보가 바다를 넘어서는 동맹을 이루지 못 하게 하는 걸림돌이 되었지만, 며칠 전까지 소련이 행한 불법 침공은 다른 모든 동유럽의 자주국들에게 큰 위협으로 다가왔습니다. 단결된 독립국들의 견고한 대오 앞에서 우리는 볼셰비키들의 공세를 견뎌낼 수 있을 것입니다!"
 BA_pol_event.9.a: "폴란드는 굴복하지 않는다!"
 BA_pol_event.9.b: "초라한 저항을 해보자."
 BA_pol_event.10.t: "[POL.getName]의 연방 가입 요구"
 BA_pol_event.11.t: "건설된 요새"
 BA_pol_event.11.d: "협력을 통해 우리는 방어선을 빠르게 구축할 수 있게 되었습니다."
 BA_pol_event.11.a: "좋군."
 BA_pol_event.11_tt: "동맹국들 중 §Y[?POL.POL_bunker_var]§! 나라가 요새 건설에 참여하여 §G[?POL_bunker_num_var]§! 단계의 §Y요새§!가 지어집니다.\n\n"
 BA_pol_event.11_tt_1: "동맹국들 중 §Y[?POL.POL_bunker_var]§! 나라가 요새 건설에 참여하여 §G[?POL_bunker_num_var]§!단계의 §Y요새§!가 지어집니다.\n\n"
 BA_pol_event.11_tt_2: "동맹국들 중 §Y[?POL.POL_bunker_var]§! 나라가 요새 건설에 참여하여 §G[?POL_bunker_num_var]§! 단계의 §Y요새§!가 지어집니다.\n\n"
 BA_pol_event.12.t: "프로메테이즘"
 BA_pol_event.12.d: "1918년부터 폴란드 제2공화국의 유제프 피우수트스키가 시작한 정치적 계획인 '프로메테이즘'은 [SOV.getadjective] 국경 내에 살고 있는 주요 비러시아인들 사이의 민족주의적 독립 운동을 지원함으로써 [SOV.getadjective](을)를 약화시키는 것을 목표로 했습니다. [SOV.getadjective](와)과의 전쟁이 발발한 지금, 우리는 이러한 캠페인의 도움을 받아 보다 전쟁을 효율적으로 수행할 수 있게 되었습니다."
 BA_pol_event.12.a: "러시아를 타도하자!"
 BA_pol_event.13.t: "미엥지모제 동계 훈련"
 BA_pol_event.13.d: "우리의 든든한 동맹인 [FIN.getname] 육군의 주도 하에 미엥지모제 동맹국들은 추위를 극복하는 법을 습득하였습니다."
 BA_pol_event.13.a: "겨울이 우리를 돕길."
 BA_pol_event.14.t: "[FROM.getname]의 [NOR.getadjective] 조선업 투자"
 BA_pol_event.14.d: "[POL.getadjective] 정부는 다가오는 위협에 맞서기 위해 우리의 조선업에 투자하였습니다."
 BA_pol_event.14.a: "현명하군."
 BA_pol_event.15.t: "스웨덴의 목재 공급"
 BA_pol_event.15.d: "[POL.getfactionname] 전체 동맹국들에게 [SWE.getadjective] 정부는 값싼 목재를 공급하기로 하였습니다."
 BA_pol_event.15.a: "협력은 우리를 더 단단히 한다!"
 BA_pol_event.16.t: "VEF와의 제휴"
 BA_pol_event.16.d: "우리의 든든한 동맹국 [LAT.getname]의 전자기기 산업체인 VEF가 동맹 전체에의 공학기기 지원을 수락했습니다."
 BA_pol_event.16.a: "고맙군."
 BA_pol_event.17.t: "[LIT.getadjective] 방직 산업"
 BA_pol_event.17.d: "[LIT.getadjective]의 방직 기업들이 동맹을 위한 군복을 값싸게 생산하고 있습니다."
 BA_pol_event.17.a: "좋군."
 BA_pol_event.18.t: "[FROM.GetAdjective]의 셰일 오일 채굴 지원"
 BA_pol_event.18.d: "1921년 조국에서 처음으로 셰일 오일이 생산되어 1924년에 셰일 오일로 만든 첫 번째 전기가 전력에 쓰이기까지, 많은 이들은 셰일 오일이 중요한 자원이라고 생각치 않고 있었습니다. 그러나 회의주의자들의 우유부단함과는 정반대로 우리는 1937년 한 해에만 100만톤의 오일셰일을 채굴해내는 데에 성공했습니다. 이러한 성과에 힘입어 우리의 동맹 [FROM.getname](은)는 [SOV.getadjective](과)와의 전쟁을 대비하기 위해 우리의 셰일 오일 채굴 기업에 보다 많은 자본을 지원해주기로 결정하였습니다."
 BA_pol_event.18.a: "고맙군!"
 BA_pol_event.20.t: "동독의 처우"
 BA_pol_event.20.d: "베를린을 비롯한 동독 지역의 처우를 우리는 결정해야 합니다."
 BA_pol_event.20.a: "국방군에게 돌려주자."
 BA_pol_event.20.b: "트리니티를 괴뢰화하자."
 BA_pol_event.20.c: "동독지역은 폴란드가 병합하겠다!"
 BA_pol_event.20.e: "프로이센으로 돌려놓자."
 BA_pol_event.21.t: "메멜의 처우"
 BA_pol_event.21.d: "옛 독일제국의 최동단의 영토였던 메멜의 처우를 결정해야 합니다."
 BA_pol_event.21.a: "리투아니아에게 돌려주자."
 BA_pol_event.21.b: "폴란드가 병합하겠다!"
 BA_pol_event.22.t: "쾨니히스베르크의 처우"
 BA_pol_event.22.d: "프로이센의 발상지인 쾨니히스베르크의 앞으로의 행방을 결정해야 합니다."
 BA_pol_event.22.a: "전이한 점령지의 모든 학생들을 보내서 자치주로 개편해라."
 BA_pol_event.22.b: "국방군에게 돌려주자."
 BA_pol_event.22.c: "동프로이센을 독일로부터 분리시키고, 괴뢰화하자."
 BA_pol_event.22.g: "프로이센에게 주자"
 BA_pol_event.22.f: "트리니티에게 돌려주자."
 BA_pol_event.22.e: "쾨니히스베르크는 우리의 소유다!"
 BA_pol_event.23.t: "[5.getName]의 처우"
 BA_pol_event.23.d: "우리는 [5.getName]의 처우를 결정해야 합니다."
 BA_pol_event.23.a: "프로이센에게 주어라."
 BA_pol_event.23.b: "국방군에게 돌려주자."
 BA_pol_event.23.c: "트리니티에게 주자."
 BA_pol_event.23.e: "폴란드가 병합하겠다."
 BA_pol_event.24.t: "그단스크의 처우"
 BA_pol_event.24.d: "우리는 그단스크가 아리우스라 불리는 이계 세력에 의해 잠시 점령당한 수모를 다시금 되갚았습니다. 우리는 그단스크의 처우를 결정할 것입니다."
 BA_pol_event.24.a: "아리우스 스쿼드를 복구시키자."
 BA_pol_event.24.b: "프로이센에게 양도하자."
 BA_pol_event.24.c: "그단스크는 폴란드의 영토다!"
 BA_pol_event.25.t: "[63.getname]과(와) [68.getname]"
 BA_pol_event.25.d: "[63.getname]과(와) [68.getname]의 행방을 결정해야만 합니다."
 BA_pol_event.25.a: "동독에게 주자."
 BA_pol_event.25.b: "그 지역을 폴란드화하자."
 BA_pol_event.26.t: "폴란드계 독일 영토"
 BA_pol_event.26.d: "대전쟁의 결과로써 되찾은 우리의 서부 영토들에 대해 우리는 처우를 결정할 것입니다."
 BA_pol_event.26.a: "동독에게 주자."
 BA_pol_event.26.b: "그곳은 폴란드의 영토에 속한다!"
 BA_pol_event.27.t: "[66.getname]의 처우"
 BA_pol_event.27.d: "우리는 [66.getname]의 처우를 결정할 것입니다."
 BA_pol_event.27.a: "실롱스크를 독립시키자."
 BA_pol_event.27.c: "동독에 주자."
 BA_pol_event.27.b: "폴란드에 병합하자."
 BA_pol_event.28.t: "[67.getname]"
 BA_pol_event.28.d: "우리는 [67.getname]의 행방 또한 결정해야 합니다."
 BA_pol_event.28.a: "실롱스크에게 양도하자."
 BA_pol_event.28.b: "병합하자."
 BA_pol_event.29.t: "서독의 행방"
 BA_pol_event.29.d: "우리는 베저강 서부의 처우를 결정할 것입니다."
 BA_pol_event.29.a: "국방군에게 돌려주자."
 BA_pol_event.29.b: "판데모니움 소사이어티를 해방하라."
 BA_pol_event.29.c: "프로이센을 중심으로 파편화하자."
 BA_pol_event.29.e: "온전히 파편화하자."
 BA_pol_event.30.t: "남독일의 처우"
 BA_pol_event.30.d: "서독에 이어, 우리는 바이에른을 비롯한 남독일에 대한 처우를 결정할 것입니다."
 BA_pol_event.30.a: "국방군에게 주어라."
 BA_pol_event.30.b: "판데모니움 소사이어티에게 양도하자."
 BA_pol_event.30.c: "바이에른을 독립시키자."
 BA_pol_event.30.f: "선도부를 해방하자."
 BA_pol_event.31.t: "홀슈타인과 슐레스비히의 처우"
 BA_pol_event.31.d: "우리는 홀슈타인과 슐레스비히의 처우를 결정해야 합니다."
 BA_pol_event.31.a: "국방군에게 돌려주자."
 BA_pol_event.31.b: "만마전에게 양도하라."
 BA_pol_event.31.c: "북방 국가에게 주자."
 BA_pol_event.31.e: "트리니티에게 주자."
 BA_pol_event.31.f: "슐레스비히-홀슈타인을 해방하자."
 BA_pol_event.31.g: "프로이센과 북방 국가가 분할하도록 하자."
 BA_pol_event.32.t: "베저엠스의 처우"
 BA_pol_event.32.d: "우리는 베저엠스의 처우를 결정함으로써, 독일 분할을 마무리할 것입니다."
 BA_pol_event.32.a: "서독 세력에게 주어라."
 BA_pol_event.32.b: "동독 세력에게 주어라."
 BA_pol_event.33.t: "[763.getname]의 명칭"
 BA_pol_event.33.d: "[763.getname]은 프로이센의 발상지로서 독일인들에게 굉장히 중요한 지역이었습니다. 그러나 지금 [763.getname]이 우리에게 있는 한, 우리는 이곳의 지명을 폴란드화하거나, 아예 바꿔버릴 것입니다."
 BA_pol_event.33.a: "독일인들을 존중하여 폴란드어 독음으로만 바꾸자."
 BA_pol_event.33.b: "사나치아의 지도자, 피우스트스키를 기리자."
 BA_pol_event.33.c: "국왕 폐하의 이름을 사용하자."
 BA_pol_event.34.t: "대홍수"
 BA_pol_event.34.d: "우리는 지난 17세기에 이미 대홍수를 경험하였습니다. 그때의 우리는 패배했지만, 지금은 다릅니다. 홍수를 가로지를 모세와 같은 용기를 가진 수십만의 청년이 폴란드와 우리의 동맹국에서 승리를 향해 복무하고 있습니다."
 BA_pol_event.34.a: "대홍수를 가로지르라!"
 
 BA_pol_event.35.t: "인터마리움의 노래"
 BA_pol_event.35.d: "회색 태양 아래 숨 쉬던 자유여\n이제 일어나라, 우리의 땅에서\n\n패권 국가들의 야욕\n그 사이에서 우리는 살아남았다\n\n비스와 강변의 속삭임을 들어보라\n카르파티아 산맥의 메아리를 들어보라\n\"우리는 하나다\", 그들이 말한다\n\n키예프의 시계탑, 민스크의 광장\n바르샤바의 광장, 부쿠레슈티의 거리\n모두가 같은 박자로 뛴다\n\n늑대들에 둘러싸인 양떼가 아니다\n우리는 이제 하나의 무리, 하나의 힘\n\n빵과 소금으로 맺은 형제의 맹세\n피와 눈물로 지킨 우리의 꿈\n인터마리움, 그 이름으로 우리는 선다\n\n역사의 수레바퀴를 우리가 돌린다\n더 이상 거인들의 장기판이 아닌\n우리의 운명, 우리의 손으로\n\n발트해에서 흑해까지\n우리의 노래가 울려 퍼진다"
 BA_pol_event.35.a: "\"자유롭고 강한 인터마리움이여, 영원하라!\""
 
 BA_pol_event.36.t: "[FROM.GetAdjective]의 인터마리움 합류 제안"
 BA_pol_event.36.d: "[FROM.GetAdjective]는(은) 인터마리움 연방을 선언함과 동시에 우리에게 연방화를 제안했습니다."
 BA_pol_event.36.a: "당연하지! 우리는 하나다!"
 BA_pol_event.36.b: "우리의 미래는 다른 곳에 있다."
 
 BA_pol_event.37.t: "[FROM.GetName]의 거부"
 BA_pol_event.37.d: "[FROM.GetName]는(은) 우리의 제안을 거부했습니다."
 BA_pol_event.37.a: "우리는 그들을 이해한다."

 BA_pol_event.38.t: "연방화에 찬성한 [FROM.getName]!"
 BA_pol_event.38.d: "[FROM.GetName]는 우리들의 연방에 합류하기로 결정했습니다!"
 BA_pol_event.38.a: "좋아!"
 BA_pol_event.39.t: "라인란트의 운명"
 BA_pol_event.39.d: "우리는 라인 지방의 운명을 결정해야 합니다."
 BA_pol_event.39.a: "서독에 주자."
 BA_pol_event.39.b: "독립시키자."
 BA_pol_event.40.t: "뷔르템베르크의 처우"
 BA_pol_event.40.d: "우리는 독일 남서부의 처우를 결정해야 합니다."
 BA_pol_event.40.a: "서독에 주자."
 BA_pol_event.40.b: "남독일에 양도하자."
 BA_pol_event.40.c: "독립시키자."
 BA_pol_event.40.e: "바이에른과 함께 남독일을 구성하자."
 BA_pol_event.41.t: "메클렌부르크와 튀링겐의 운명"
 BA_pol_event.41.d: "우린 남은 독일 지역에 향방을 결정할 것입니다."
 BA_pol_event.41.a: "해방하자."
 BA_pol_event.41.b: "프로이센의 제후국으로 만들자."
 BA_pol_event.41.c: "프로이센에 병합하자."
 
 BA_pol_event.42.t: "자유 폴란드 의용군"
 BA_pol_event.42.d: "지난 소련의 두 번째 서부 공세 이후 폴란드가 빼앗긴 동부지역에서는 폴란드 민족주의 민병대가 활동하고 있습니다. 이들은 소비에트-폴란드 전쟁이 발생할 시에 폴란드를 도와서 봉기할 것입니다."
 BA_pol_event.42.a: "폴란드를 위해!"
 BA_pol_event.42.b: "패권주의적 음모다."
 BA_pol_event.43.t: "벨라루스 의용대"
 BA_pol_event.43.d: "벨라루스 일부 지역에서는 민족주의에 입각한 반공 지하조직이 산재하여 있습니다. 이들은 폴란드와 소비에트 간의 전쟁이 발생할 시 폴란드를 도와서 봉기할 것입니다."
 BA_pol_event.43.a: "벨라루스 동지들을 위해!"
 BA_pol_event.43.b: "자본가들의 개들이군."
 BA_generic_event.14.t: "우크라이나 국민군"
 BA_generic_event.14.d: "우크라이나 서부 지역에서는 친폴란드 민족주의 민병대가 산재하여 있습니다. 이들은 폴란드와 소비에트 간의 전쟁이 발생할 시 폴란드를 도와서 봉기할 것입니다."
 BA_generic_event.14.a: "우크라이나 동지들을 위해!"
 BA_generic_event.14.b: "반사회주의적 행동이다."
 BA_pol_event.44.t: "반소련 민족주의 민병대 봉기"
 BA_pol_event.44.d: "[POL.getname] 정부에 의해 지원받는 지하 무력 조직이 우리의 진군에 맞추어 봉기하여 대열에 합류하였습니다."
 BA_pol_event.44.a: "고맙군."
 BA_pol_event.46.t: "르부프 선언"
 BA_pol_event.46.d: "'우리는 볼셰비즘이 인민을 옥죄고 착취하는 반자유의 이데올로기임을 다시 한 번 확인하며, 러시아 지방의 탈볼셰비즘화를 위한 러시아 인민해방위원회를 발기토록 한다. 본 위원회는 목적을 달성하기까지 해산하지 않으며...'"
 BA_pol_event.46.d_1: "'우리는 [SOV.getname] 정부가 인민을 옥죄고 착취하는 반자유의 정부임을 다시 한 번 확인하며, 러시아 전역의 해방을 위한 [RSA.getname]을 발기토록 한다. 본 위원회는 목적을 달성하기까지 해산하지 않으며...'"
 BA_pol_event.46.a: "저들을 부숴버리자!"
 BA_pol_event.46.b: "우리의 점령지는 소중하다."

