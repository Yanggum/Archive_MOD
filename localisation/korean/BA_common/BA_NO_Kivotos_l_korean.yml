 #팝업 
 POL_country_intro_header: "§9환희와 독립의 국가§!"
 POL_country_intro_content: " 바르샤바에서 폴란드의 깃발이 자랑스럽게 휘날리고 있게 된 것은 오래된 이야기가 아닙니다. 폴란드는 오랜 세월동안 다른 국가들의 군홧발 아래에서 지냈고, 30년도 더 되지 않은 시간 전에 독립을 쟁취한 신생 국가입니다.\n\n 10세기에 본격적으로 역사에 등장하기 시작한 폴란드는 슬라브 건국 신화에 따르면, 레흐, 체흐, 루스의 세 형제 중 레흐가 서쪽으로 이동하여 세운 나라입니다. 가톨릭교로 개종하면서 중세 역사에 등장하기 시작한 폴란드 왕국은 중흥에도 불구하고 신성 로마 제국과의 전쟁, 몽골 제국의 침략에 의해 고통받았습니다. 그러나 폴란드 왕국은 14세기에 폴란드 - 리투아니아 동군 연합으로 재편되면서 대국으로 거듭나며 전성기를 맞이했습니다. 하지만 날갯짓하는 흰꼬리수리는 17세기부터 대홍수라고 불리는 위기 시대를 겪었고, 끝내 프로이센, 러시아, 오스트리아에 의해 삼분할되는 수모를 겪었습니다. 이후 서유럽에서 역사의 소용돌이가 쉴 새 없이 몰아치는 동안, 폴란드인들은 세 조각으로 쪼개진 채 이를 지켜보는 것밖에 할 수 없었습니다.\n\n 그럼에도 시간은 폴란드의 편이었습니다. 20세기의 시작을 피로 물들인 대전쟁은 독일이 러시아령 폴란드 지방을 '섭정왕국'으로서 해방하였으며, 독일의 항복 후에는 '폴란드 제2공화국'이 등장하여 소련의 서방 공세를 막아내고 리투아니아로부터 중앙리투아니아를 점거하며 동유럽의 중견국으로서 성장하였습니다.\n\n 신생국 폴란드의 정치는 전반적으로 불안정했습니다. 특히 대전쟁 이후 국토 재건에 힘을 쓸 수 있었던 서방과는 다르게 폴란드는 소련과의 전쟁, 동유럽 국가들과의 영토분쟁, 독일 민병대와의 국지전으로 혼란스러웠습니다. 이러한 불안정은 1926년 피우수트스키의 쿠데타로 이어졌는데, 이는 피우수트스키와 그의 부하들이 구성한 사나치아 운동이 폴란드 정치를 장악하면서 지금에 이르게 만들었습니다.\n\n 1935년 11월 무렵, 폴란드는 역사상 처음으로 지구인이 아닌 존재들과 전투를 치뤄야 했습니다. '키보토스'로 칭해지는 이존재들은 지구로 전이되어 폴란드의 서부 영토를 공격하였습니다. 폴란드군은 저항을 이어갔지만 기술력과 역량의 차이로 인하여 후퇴할 수밖에 없었습니다. 또한 서쪽에서의 혼란의 여파로 말미암아 폴란드-소련 국경에서 소규모 군사적 충돌이 발생하였는데, 이는 곧 전쟁으로 확전되었습니다.\n\n 2차 소비에트 - 폴란드 전쟁에서 폴란드는 1919년의 기적을 재현할 수는 없었습니다. 하지만 붉은 군대의 심각한 상태가 이곳저곳에서 발견되며 소련은 폴란드 영토로 더 이상 진격할 수 없게 되었습니다. 그리하여 빠르게 맺어진 평화협정으로 폴란드는 잠깐의 시간을 벌 수 있게 되었지만, 오직 폴란드가 동서로 포위되어 있다는 것이 명확했습니다.\n\n 세 번째 기회를 노리는 러시아와 미래기술로 무장한 트리니티 사이에서, 폴란드의 운명이 피어나고 있습니다.\n\n§Y개발 : AfterImage§!"
 POL_guide: "\n£white_dot 폴란드의 역량을 키우십시오.\n£white_dot 빼앗긴 서부와 동부의 영토들을 다시 되찾으십시오.\n£white_dot 최대한 많은 동맹국들을 모아서 소련에 대항하십시오.\n£white_dot 이계의 침략자들의 최후의 전쟁을 막아내십시오.\n\n\n§9폴란드는 다시 일어설 것입니다!§!"

 SOV_country_intro_header: "제국의 몰락"
 SOV_country_intro_header_1: "먼지가 가라앉은 후"
 SOV_country_intro_header_2: "권력 투쟁"
 SOV_country_intro_header_3: "2차 소폴전쟁과 대숙청"
 SOV_country_intro_content: "충격적인 러일전쟁에서의 패배와 인민들이 차르에게 등을 돌리게 된 피의 월요일 사건은 동방의 거대한 제국이 몰락함을 알리는 신호탄을 쏘아 올렸습니다.\n\n보스니아 사라예보에서 두 발의 총성이 울리고 대전쟁이 벌어지자, 러시아는 예상외로 총동원령을 빠르게 내린 덕에 초기에는 예상외의 선전을 할 수 있었습니다. 그러나 그것은 오래가지 않았습니다. 타넨베르크에서의 패배는 러시아 제국의 약점을 들어냈고 브루실로프 공세는 러시아 제국군을 붕괴시켰습니다. 제국군이 붕괴하고 독일군은 빠르게 발트와 벨라루스 우크라이나까지 점령해 나갔습니다. 상황이 나빠지는 것을 막기 위해 니콜라이 2세가 친정을 감행했지만, 이는 역효과를 불러일으켰습니다. \n\n1917년 3월 8일 역사는 새로운 장을 써 내려갔습니다. 300년의 역사를 가진 로마노프가 무너졌고 그들이 무너진 자리 위에 신생 공화국이 출범하였습니다. 그러나 신생 공화국은 전쟁을 이어 나가려고 했지만, 지겨운 후퇴만을 반복하였습니다. 블라디미르 레닌과 볼셰비키는 이 기회를 놓치지 않았고 10월 혁명을 선언하였습니다."
 SOV_country_intro_content_1: "적백내전의 먼지가 가라앉자, 한때 러시아 제국이었던 땅 위에는 부정할 수 없는 통치자와 함께 소비에트 사회주의 공화국 연방이 등장하였습니다. 그러나 내전을 치른 대가는 너무나 참혹하였습니다. 1천만 인민들이 내전 중 사망하였고 격감한 철강 생산량, 기록적인 가뭄과 그로 인한 기근까지. 참담한 상황이었습니다. 블라디미르 레닌은 경제를 복구하기 위한 신경제정책을 도입하여 전후 복구에 힘썼습니다.\n\n1918년 암살 미수 사건으로 중상을 입은 레닌은 총상의 후유증과 그동안 누적된 과로 때문에 정상적인 활동을 없게 되자 권력의 중앙에서 멀어져갔습니다.\n\n1924년 후유증으로 결국 레닌이 사망하자 공산당 내부에서는 혼란이 시작되었습니다."
 SOV_country_intro_content_2: "레닌 사후 공산당의 내부에서는 권력 투쟁이 시작되었습니다. 특히 스탈린과 트로츠키의 권력 투쟁이 격렬하였습니다. 스탈린은 영구혁명론을 주장하는 트로츠키에게 맞서 일국 사회주의론을 펼치며 대적했습니다. 계속되는 트로츠키의 중앙위원회 불출석과 스탈린-지노비예프-카메네프 연합의 공세로 트로츠키는 권력의 중앙에서 밀려나게 되어 결국 망명길에 올라서게 되며 트로이카 체제가 수립되었습니다.\n\n그러나 모두가 예상했듯이 트로이카 체제는 그다지 오래가지 못하였습니다. 지노비예프-카메네프와 스탈린의 사이가 삐걱거리자, 이들은 트로츠키가 주장한 당내 민주주의 문제를 들고 와 스탈린을 비난했고, '부자 되시오' 발언으로 충격을 안긴 부하린 역시 스탈린을, 자본주의를 우습게 안 인간이라고 비난했습니다.\n\n망명길을 오른 트로츠키까지 끌어들인 지노비예프-카메네프 연합은 스탈린-부하린 연합에 다시 분파주의자로 몰리며 당에서 쫓겨났고 최종적으로 부하린까지 몰아내는 데 성공하여 당내 유일한 지도자로 자리를 확호히 하였습니다."
 SOV_country_intro_content_3: "1935년 11월, 유럽의 동쪽에서는 불안한 긴장감이 감돌고 있었습니다. \"대전이 사태\" 이후 폴란드와 소련 사이의 국경 지대는 불안정한 화약고와 다름없었습니다. 양국 간의 크고 작은 국지전은 마침내 양측 모두가 원치 않던 2차 소-폴 전쟁으로 번져버렸습니다.\n\n이 예기치 못한 전쟁은 양측 모두에게 큰 충격을 안겼습니다. 준비되지 않은 상태에서 시작된 전쟁은 막대한 인명 피해를 낳았고, 약 한 달간 지속되며 양국의 군사력과 자원을 고갈시켰습니다. 특히 소련군의 참담한 실상이 드러나면서 스탈린은 큰 충격을 받았습니다.\n\n전쟁의 결과로 스탈린은 군 지도부와 정부 관료들에 대한 대대적인 숙청을 계획하기 시작했습니다. 이는 곧 소련 역사상 가장 큰 규모의 대숙청으로 이어질 것입니다.\n\n1936년 1월 1일, 새해가 밝았지만 유럽의 하늘은 여전히 어둡습니다. 소-폴 전쟁의 상흔이 가시지 않은 가운데, 스탈린의 대숙청이 시작되려 하고 있습니다."
 SOV_guide: "\n[SOV.GetName]ㅣ중앙파\n£white_dot 5개년 계획을 완수하여 공업 국가로써 완전히 발돋움 하시오.\n£white_dot 내부에 숨어있는 연방의 적들을 숙청하시오.\n£white_dot 유럽을 해방하고 일국 사회주의를 이룩하시오.\n\n[SOV.GetName]ㅣ우익반대파\n£white_dot 스탈린의 권위를 의심하고 그의 자리를 찬탈하시오\n£white_dot 신경제정책을 완수하여 공업 국가로써 완전히 발돋움 하시오.\n£white_dot 국제 혁명적 마르크스주의를 널리 퍼트리십시오.\n\n\n§t만국의 노동자여, 단결하라!§!"

