 mystic_engineering_folder_desc:0 "이세계의 기술"
 MIL_engineering_bonus:0 "밀레니엄 데이터베이스 가속"
 BA_kivotos_student_recruitment: "키보토스 학생 모병"
 BA_kivotos_student_recruitment_desc: "수 많은 세력으로 나뉘어져있고 여러 이해집단과 경제적 양극화 또한 존재하는 키보토스의 학생들은 약간의 돈과 지위 보장만으로도 넘어오기도 합니다."
 kivotos_artificial_halo_replica_tech:0 "신비 직조기 복제"
 kivotos_artificial_halo_replica_tech_desc:0 "키보토스에서 사용되는 신비 직조기를 약간이나마 복제했습니다."
 kivotos_halo_special_purpose: "헤일로 특수 목적성"
 kivotos_halo_special_purpose_desc: "평야에서는 적의 화력에 집중 노출되는 헤일로 보병은 생각보다는 유의미한 목표를 달성하지 못할지도 모릅니다. 그렇다면 전장을 바꿔, 특수한 전장의 이용 목적으로 양성되는 헤일로 보병들이라면 어떨까요?"
 kivotos_halo_special_urban_infantry_1: "헤일로 시가전 I"
 kivotos_halo_special_urban_infantry_1_desc: "헤일로를 가진 보병대는 적의 총탄을 견디고 기갑과는 다르게 매우 민첩하고 유연하기에 시가전의 위험성을 쉽게 이겨낼 수 있습니다."
 kivotos_halo_special_urban_infantry_2: "헤일로 시가전 II"
 kivotos_halo_special_urban_infantry_2_desc: "기존 소규모 특수작전부대와는 달리 헤일로 보병의 시가전 능력은 매우 유능하기에 소규모 운영법을 대규모 운영으로 변경하고 수 많은 적의 도시를 동시에 공략할 것입니다."
 kivotos_halo_special_urban_infantry_3: "헤일로 시가전 III"
 kivotos_halo_special_urban_infantry_3_desc: "도시의 유형에 따라 도시 공격을 유연하게 조정하고 포병과 항공 전력을 비롯한 보조를 받는다면 수 많은 위험을 예방하고 더 안전한 시가전이 가능할 것입니다."
 kivotos_halo_recon:0 "헤일로 수색중대"
 kivotos_halo_recon_desc:0 "헤일로 보병으로 편성된 수색중대입니다. 상당한 험지를 큰 무리 없이 수색할 수 있습니다."
 kivotos_infantry_weapons:0 "신비 직조기"
 kivotos_infantry_weapons_short:0 "신비 직조기"
 kivotos_infantry_weapons_desc: "시라이시 우타하와 야쿠시 사야의 이론을 기반으로 청휘석을 이용해 신비를 인공적으로 직조하는 장비입니다. 여러 개량을 거쳐 온전한 성능을 내고 있습니다."
 kivotos_halo_upgrade:0 "헤일로 보병 업그레이드"
 kivotos_halo_upgrade_desc:0 "헤일로 보병에게 전투 교범과 제식 장비 사용법 훈련을 진행하여 전투력을 끌어올립니다."
 kivotos_halo_max_upgrade:0 "헤일로 사단 확장 I"
 kivotos_halo_max_upgrade_desc:0 "더 많은 학생들을 전투 인원으로 편성합니다."
 kivotos_halo_max_upgrade_1:0 "헤일로 사단 확장 II"
 kivotos_halo_max_upgrade_1_desc:0 "전투 훈련 프로그램을 대량으로 확대합니다."
 kivotos_halo_special_forces:0 "헤일로 특수부대"
 kivotos_halo_special_forces_desc:0 "다양한 상황에 대응하기 위해 헤일로 보병을 정예화 시킨 헤일로 특수부대를 양성합니다."
 kivotos_halo_light_infantry:0 "헤일로 보병 양성 프로그램"
 kivotos_halo_light_infantry_desc:0 "더 가볍고 유연하게 사단을 편성합니다."
 kivotos_halo_heavy_infantry:0 "중무장 헤일로 보병"
 kivotos_halo_heavy_infantry_desc:0 "강력한 화기로 무장한 헤일로 보병들입니다."
 kivotos_halo_upgrade_1:0 "헤일로 합동 전투"
 kivotos_halo_upgrade_1_desc:0 "자신의 방어력을 더욱 잘 활용하도록 전투 훈련 프로그램을 개량합니다. 헤일로 보병의 전투력이 더욱 향상되었습니다."
