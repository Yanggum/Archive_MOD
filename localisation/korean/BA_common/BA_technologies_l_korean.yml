 # SPECIALIZATION NAMES (전문화 이름)
 # ==========================================
 mystic_engineering_facility: "초공학-신비 연구소"
 mystic_engineering_facility_plural: "신비 연구소"
 mystic_engineering_facility_desc: "초공학-신비 연구소를 확보하면 이계의 기술과 청휘석을 활용한 일시적 기술 초월을 연구할 수 있습니다."

 specialization_mystic_engineering: "신비 공학"
 specialization_mystic_engineering_short: "신비학"

 # ==========================================
 # SCIENTIST XP REWARDS (과학자 경험치)
 # ==========================================
 sp_mystic_generic_reward_scientist_xp_1: "청휘석의 미세한 공명"
 sp_mystic_generic_reward_scientist_xp_1_desc: "[Character.GetName](은)는 청휘석 조각이 특정 주파수에서 미세하게 진동하는 현상을 관찰했습니다. 비록 완전한 해석은 아니지만, 이 광물이 가진 잠재력에 대한 중요한 단서를 얻었습니다."
 sp_mystic_generic_reward_scientist_xp_2: "오파츠 해석의 진전"
 sp_mystic_generic_reward_scientist_xp_2_desc: "발굴된 고대 유물(오파츠)과 현대 공학을 접목하는 과정에서 [Character.GetName](은)는 기존 물리학으로는 설명되지 않는 에너지 흐름을 이해하게 되었습니다."
 sp_mystic_generic_reward_scientist_xp_3: "초현실적 통찰"
 sp_mystic_generic_reward_scientist_xp_3_desc: "[Character.GetName](은)는 꿈과 현실의 경계에서 영감을 얻은 듯, 청휘석을 매개로 한 차원 간섭 기술의 핵심 이론을 정립했습니다. 이는 단순한 과학을 넘어선 경지입니다."
 
 sp_mystic_generic_reward_option_scientist_xp: "미래는 우리의 손에 있다."

 # ==========================================
 # PROGRESS REWARDS (연구 진행도 보상)
 # ==========================================
 sp_mystic_generic_reward_major_progress_1: "안정적인 에너지 출력"
 sp_mystic_generic_reward_major_progress_1_desc: "시제품이 청휘석 촉매와 성공적으로 반응하여 예상보다 훨씬 안정적인 출력을 보여주고 있습니다. 이로 인해 초기 실험 단계가 대폭 단축될 것입니다."
 sp_mystic_generic_reward_major_progress_2: "물질 합성 성공"
 sp_mystic_generic_reward_major_progress_2_desc: "연구진은 희귀한 청휘석 가루를 합성 물질과 결합하여 내구성과 전도율이 비약적으로 상승한 새로운 소재를 만들어냈습니다. 시제품 제작 속도가 빨라졌습니다."
 sp_mystic_generic_reward_major_progress_3: "기적의 연산"
 sp_mystic_generic_reward_major_progress_3_desc: "마치 시제품 자체가 의지를 가진 것처럼, 복잡한 연산 과정을 스스로 최적화하며 완성 단계에 도달했습니다. 연구원들은 이를 '기적'이라고 부르고 있습니다."

 sp_mystic_generic_reward_option_major_breakthrough: "놀라운 성과로군."

 # ==========================================
 # FAILURE REWARDS (실패 및 리스크)
 # ==========================================
 sp_mystic_generic_reward_test_failure_1: "파장 불일치"
 sp_mystic_generic_reward_test_failure_1_desc: "청휘석의 파장과 제어 장치의 주파수가 일치하지 않아 시제품이 작동을 멈췄습니다. 다행히 손상은 없지만, 주파수를 다시 맞추는 지루한 작업이 필요합니다."
 sp_mystic_generic_reward_test_failure_2: "에너지 과부하"
 sp_mystic_generic_reward_test_failure_2_desc: "이계의 에너지를 무리하게 주입하려다 회로가 타버렸습니다. [Character.GetName](은)는 청휘석의 불안정성을 과소평가했음을 인정하고 설계를 수정하고 있습니다."
 sp_mystic_generic_reward_test_failure_3: "청휘석 파장 간섭"
 sp_mystic_generic_reward_test_failure_3_desc: "알 수 없는 신호가 연구 데이터에 섞여 들어와 수치들을 엉망으로 만들었습니다. 이 '노이즈'를 제거하고 데이터를 복구하는 데 시간이 걸릴 것입니다."

 sp_mystic_generic_reward_option_test_failure: "시행착오일 뿐이다."

 sp_mystic_generic_reward_critical_failure: "청휘석 붕괴 현상"
 sp_mystic_generic_reward_critical_failure_desc: "실험 중 청휘석이 임계점을 넘어 붕괴하며 국지적인 차원 왜곡을 일으켰습니다. 시설 일부가 송곳으로 마구 찔러 구멍이 뚫린 듯 소멸했고, [Character.GetName](은)는 휘몰아치는 에너지 폭풍에 휘말려 부상을 입었습니다."
 
 sp_mystic_generic_reward_option_critical_failure: "치명적인 실수다..."

 # ==========================================
 # THEME: MYSTIC ENGINEERING (공학 기술)
 # ==========================================
 sp_mystic_generic_reward_engineering_tech_1: "고효율 배터리 기술"
 sp_mystic_generic_reward_engineering_tech_1_desc: "신비 공학 연구의 부산물로, 일반 산업 및 전자 기기에 사용될 수 있는 초고효율 배터리 기술이 발견되었습니다."
 sp_mystic_generic_reward_engineering_tech_2: "자동화 생산 AI"
 sp_mystic_generic_reward_engineering_tech_2_desc: "고대 기술의 연산 논리를 응용하여 공장 가동 효율을 극대화하는 기초적인 AI 알고리즘을 개발했습니다."
 sp_mystic_generic_reward_engineering_tech_3: "물질 재구성 프로토콜"
 sp_mystic_generic_reward_engineering_tech_3_desc: "제한된 자원을 원자 단위에서 재배열하여 필요한 부품으로 변환하는 기술적 특이점에 근접했습니다. 이는 국가 산업 역량의 혁명입니다."

 sp_mystic_generic_reward_mystic_engineering_tech_1: "비전 설계도 해석"
 sp_mystic_generic_reward_mystic_engineering_tech_1_desc: "해석이 불가능했던 고대 유적의 설계도 일부를 해독하는 데 성공했습니다. 신비 공학 분야의 이해도가 깊어졌습니다."
 sp_mystic_generic_reward_mystic_engineering_tech_2: "정제된 청휘석 연료"
 sp_mystic_generic_reward_mystic_engineering_tech_2_desc: "신비 공학 장비를 가동하는 데 필수적인 고농도 액화 청휘석 연료를 추출하는 공정을 최적화했습니다."
 sp_mystic_generic_reward_mystic_engineering_tech_3: "초공학 집중"
 sp_mystic_generic_reward_mystic_engineering_tech_3_desc: "우리 과학자들의 열렬한 노력과 열성 끝에 초공학 기술에 대한 놀라운 통찰을 발견했습니다."

 sp_mystic_generic_reward_option_engineering_tech: "기술의 진보다."
 sp_mystic_generic_reward_option_engineering_tech_bonus_name: "신비 공학 산업 연구"


