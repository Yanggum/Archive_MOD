# 대충 리워크 공학기술이라는 말
 BA_mystic_engineering_tech: "초공학 기술"
 BA_mystic_engineering_tech_desc: "키보토스산 청휘석을 이용해 구현되는 미래의 기술 설계도들은 양산에는 큰 무리가 있으나 청휘석 자원이 있다면 매우 유용하게 개발하고 사용할 수 있습니다."

 BA_pyroxene_material_semiconductor_engineering: "청휘석 소재-반도체 공학"
 BA_pyroxene_material_semiconductor_engineering_desc: "청휘석을 이용한다면 공상과학으로 여겨지는 반도체 기술을 상용화할 수 있으며 더 가볍고 강력한 소재를 개발할 수 있습니다."
 kivotos_dron_tech: "브러시리스 모터"
 kivotos_dron_tech_desc: "고체 상태 정류 기술을 청휘석을 이용해 제작한 반도체로 생산해 수십년은 앞선 브러시리스 모터를 군용으로 도입할 수 있습니다."
 kivotos_pyroxene_main_gun_stabilization_device: "청휘석 주포 안정화 장치"
 kivotos_pyroxene_main_gun_stabilization_device_desc: "고성능의 반도체와 모터를 이용한 전기식 주포 안정화 장치를 청휘석을 이용한다면 1세기는 빠르게 구현할 수 있습니다."

 BA_mystic_engine_technology: "신비 엔진 기술"

 BA_heavy_artillery_battery: "무거운 포대"

 BA_in_depth_mystic_analysis: "신비 심층 분석"
 BA_in_depth_mystic_analysis_desc: "키보토스 학생이나 신비 공학 사단의 원활한 운영, 그리고 장기적인 미지의 탐구를 위해서는 신비에 대한 심층적인 분석이 필요합니다."
 BA_artificial_mystic_1: "인조 신비 I"
 BA_artificial_mystic_1_desc: "어쩌면 더 다양한 방법을 통해 인공적으로 신비를 합성해낼 수 있을지도 모릅니다. 비인도적이라고 불릴지도 모르나 우리는 신비학에 대한 기술을 통달해야 합니다."
 BA_advanced_mystic_weaver: "진보된 신비 직조기"
 BA_advanced_mystic_weaver_desc: "더 많은 청휘석을 이용하여 키보토스 그 이상의 신비를 구현하고, 청휘석의 능력으로 마치 누군가의 보조를 받는 듯한 기분을 주는 매우 진보된 신비 직조기입니다."
 BA_artificial_mystic_2: "인조 신비 II"
 BA_artificial_mystic_2_desc: "더 깊은 연구를 통해 통합적인 신비 관리 기술을 연구하고, 수 많은 미스터리 속에서 진실을 파헤쳐낼 수 있습니다."
 BA_otherworld_equipment_analysis: "이계 장비 분석"
 BA_otherworld_equipment_analysis_desc: "일반적으로 키보토스산 자재들은 매우 고등한 기술로 만들어져 복제나 분석이 어려우나, 그럼에도 통찰에 성공한다면 우리는 더 나은 기술을 얻을 것입니다."
 BA_otherworld_reinforced_body_armor: "방탄복 강화"
 BA_otherworld_reinforced_body_armor_desc: "합성 소재나 매우 약간의 청휘석 가루를 이용하면 더 나은 방탄 성능을 보이는 키보토스식 방탄 장비를 연구할 수 있습니다."
 BA_juggernaut_pioneer: "저거너트 특수지원단"
 BA_juggernaut_pioneer_desc: "저거너트 특수지원단은 신비가 주입된 외골격 슈트를 기존 작전 체계에 유용하게 결합하고 관리하기 어려운 고급 장비를 다루기 위해 창설된 집중 중대입니다. 다양한 작전대대에 파견되어 외골격 슈트를 이용한 임무를 수행합니다."
 BA_juggernaut_1: "저거너트 I"
 BA_juggernaut_2: "저거너트 II"
 BA_juggernaut_3: "저거너트 III"

 pyroxene_stabilization_1: "청휘석 안정화 I"
 pyroxene_stabilization_1_desc: "불안정한 청휘석에 대한 메커니즘을 일부 해명하여 각종 신비를 운영하는 것에 필요한 안정성을 확보할 수 있습니다."
 pyroxene_stabilization_2: "청휘석 안정화 II"
 pyroxene_stabilization_2_desc: "청휘석의 메커니즘을 대부분 해석하여 더 많은 안정성을 확보하고 유연한 청휘석 활용 능력을 증대시킬 것입니다."

 BA_plasma_condensation_battery: "플라즈마 응축 포대"
 BA_plasma_condensation_battery_desc: "청휘석을 이용한다면 역학적 불안정성을 극복하고 고온의 플라즈마를 이용한 거대 포대를 개발하고 지속적인 청휘석 소모로 움직이는 기동 포대를 만들어낼 수 있을 것입니다."
 BA_semi_automated_railway_gun: "반자동화 열차포"
 BA_semi_automated_railway_gun_desc: "초중열차포에 미래 기계공학적 기술을 추가한다면 더 나은 운용성을 확보하고 운용인력을 감축할 수 있습니다."
 BA_recoil_control: "반동 제어"
 BA_recoil_control_desc: "고성능의 안정화 장치와 포신 후퇴 기술을 이 새 시대의 열차포에 맞춰서 수정해야 안정적인 열차포 운영과 효과적인 표적 공격 능력을 확보할 수 있습니다."
 BA_operation_automation: "운영 자동화"
 BA_operation_automation_desc: "셰마타 열차포를 운영하기 위한 전문적인 자동화 기계설비들과 상세한 운영 프로토콜을 설계하여 인력을 다른 곳에 투자하고 더 빠른 속도로 열차포가 운영되도록 합니다."
 BA_fire_bombardment_control: "화기 포격 통제"
 BA_fire_bombardment_control_desc: "첨단 초지평선 레이더, 거리측정기, 전자동식 안정기를 장착하여 정확도와 포격 조정을 향상시키며, 주포의 엄청난 반동과 느린 조준에도 불구하고 효과적이고 반복적으로 표적을 향해 포격할 수 있도록 합니다."

