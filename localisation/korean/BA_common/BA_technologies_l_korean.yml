 repeater_battalion_tech:0 "신호 중계기"
 repeater_battalion_tech_short:0 "광역 데이터를 수신하는 전문 운용 부대를 만들어 우리의 명령 체계가 더 빠르게 동작하도록 보정합니다."

 mystery_correspondence:0 "신비 대응 기술"
 mystery_correspondence_desc:0 "적의 신비 기술에 대응할 기술을 연구합니다."
 mystery_analysis:0 "신비 심층 탐구"
 mystery_analysis_desc:0 "신비가 저들의 육체 및 정신에 어떤 식으로 관여하는지를 밝혀냅니다."
 kivotos_artificial_halo_low:0 "인조 헤일로 보병"
 kivotos_artificial_halo_low_short:0 "인조 헤일로 보병"
 kivotos_artificial_halo_low_desc:0 "헤일로 보병을 인공적으로 제작하는 기술을 연구합니다. 불완전한 신비 직조기의 연구 또한 같이 진행될 것입니다."

