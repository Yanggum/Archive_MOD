 highlight_major_1_tt: "@RED §Y붉은겨울 연방학원§! 경로: "
 highlight_major_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_RED_path_texticon\n\n\n\n\n\n\n§Y우리의 영도자 체리노§! - §R렌카와 체리노§!\n  £white_dot §g체리노의 체제혁명§!\n  £white_dot §g트로츠키의 세계혁명§!\n§g========================================§!\n§Y안내§!: 붉은겨울 연방학원은 스토리텔링 이벤트나 엔딩이 존재하지 않는, HOI4 바닐라 스타일의 국가입니다. 바닐라 스타일의 자유로운 샌드박스 플레이를 원하시는 분께 추천드립니다."

 highlight_major_2_tt: "@MIL §Y밀레니엄 사이언스 스쿨§! 경로: "
 highlight_major_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_MIL_path_texticon\n\n\n\n\n\n\n§t루트 전부 미완성§!\n\n§Y세미나 주도 기술관료정§! - §C츠카츠키 리오§!\n  £white_dot §g리오의 권력 유지§!\n  £white_dot §g하야세 유우카 집권§!\n  £white_dot §g우시오 노아의 집권§!\n\n§Y베리타스 주도 기술관료정§! - §G아케보시 히마리§!\n§g========================================§!\n§Y안내§!: 밀레니엄 사이언스 스쿨은 스토리텔링 이벤트나 엔딩이 존재하지 않는, HOI4 바닐라 스타일의 국가입니다. 밀레니엄의 게임 난이도는 쉬우며, 바닐라 스타일의 자유로운 샌드박스 플레이를 원하시는 분, 그리고 어렵지 않은 게임 플레이를 원하시는 분께 추천드립니다."

 highlight_major_3_tt: "@TRM §Y트리니티 종합학원§! 경로:"
 highlight_major_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_TRM_path_texticon\n\n\n\n\n\n\n§t루트 전부 미완성§!\n\n§Y두 번째 트리니티의 태동§! - §M미소노 미카§!\n  £white_dot §g공정한 트리니티 건설§!\n    £white_dot §Y2개§!의 엔딩 보유.\n\n §Y고귀한 의무§! - §L키리후지 나기사§!\n  £white_dot §g트리니티의 새 천 년§!\n    £white_dot §Y2개§!의 엔딩 보유.\n\n §Y진정한 학생민주주의§! - §Y아지타니 히후미§!\n  £white_dot §g키리후지 나기사 복권§!\n    £white_dot §Y2개§!의 엔딩 보유.\n  £white_dot §g우타즈미 사쿠라코의 집권§!\n    £white_dot §Y1개§!의 엔딩 보유. 우라와 하나코 분기 존재.\n  £white_dot §g아오모리 미네의 집권§!\n    £white_dot §Y1개§!의 엔딩 보유.\n  £white_dot §g학생회장 아지타니 히후미§!\n    £white_dot §Y1개§!의 엔딩 보유.\n§g========================================§!\n§Y안내§!: 트리니티 종합학원은 카이저라이히 형식을 따른 간단한 서사 중심의 국가입니다. 중점 플레이가 주가 되며, 블루 아카이브 모드에 처음 입문하시는 분들이나 트리니티 학생들의 일상적인 이야기를 가볍게 즐기고 싶은 유저분들께 추천드립니다."

 highlight_major_4_tt: "@COU §Y키보토스 총학생회§! 경로: "
 highlight_major_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_COU_path_texticon\n\n\n\n\n\n\n§Y초인의 통치§! - §P시라누이 카야§!\n  £white_dot §Y3개§!의 엔딩 보유.\n\n§Y총학생회 질서의 복원§!: §R미완성§! - §2나나가미 린§!\n   £white_dot §Y2개§!의 엔딩 보유.\n\n§Y집정관§!: §R미완성§! - §5오키 아오이§! 및 §p유라기 모모카§!\n   £white_dot §Y2개§!의 엔딩 보유.\n§g========================================§!\n§Y안내§!: 키보토스 총학생회는 카이저라이히 형식과 스토리텔링의 서사를 혼합한 스타일의 국가입니다. 게임 극초반부터 샬레의 위협에 노출되는 §Y도전적§!인 난이도를 가집니다."

 highlight_major_5_tt: "@GEM §Y판데모니움 소사이어티§! 경로: "
 highlight_major_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEM_path_texticon\n\n\n\n\n\n\n §g판데모니움 소사이어티는 어떤 중점을 선행하냐에 따라 등장하는 중점 계통도의 내용이 변화하기도 하고, 독특한 조건이나 상황에 따라 특별한 변화를 맞이하기도 하는 국가입니다.§!\n\n§g기본 지도자별 중점 계통도§!\n  £white_dot §Y하누마 마코토§! 의장\n  £white_dot §Y코교쿠 사츠키§! 의장\n  £white_dot §Y나츠메 이로하§! 의장\n  £white_dot §Y모토미야 치아키§! 의장\n  £white_dot §Y탄가 이부키§! 의장 - (§R미완성§!)\n\n §g지도자별 기원 진입 중점§!\n  £white_dot 하누마 마코토의 §O영속전쟁국가§!\n  £white_dot 코교쿠 사츠키의 §O평화로운 나라§!\n  £white_dot 나츠메 이로하의 §O게헨나 합중국§!\n  £white_dot 모토미야 치아키의 §O신행정부§!\n  £white_dot 탄가 이부키의 §O성장§! - (§R미완성§!)\n\n §g국가의 국체별 기원 진입 중점§!\n  £white_dot §O독일국§! 선포\n  £white_dot §O독일-게헨나 연방§! 선포\n  £white_dot §O게헨나§! 유지\n\n§g========================================§!\n§Y안내§!: 판데모니움 소사이어티는 복잡한 시스템과 다양한 경로로 갈라지는 특색 있는 HOI4 바닐라 스타일의 국가입니다. 게헨나 선도부와 트리니티 종합학원과의 전쟁이 예정되어 있어 난이도는 §O높은 편이며§!, 중급자 이상 게이머나 바닐라 스타일의 자유로운 샌드박스 플레이를 원하시는 분께 추천드립니다."

 highlight_major_6_tt: "@HYA §Y백귀야행 연합학원§! 경로: \n\n\n\n\n\n   £GFX_HYA_path_texticon\n\n\n\n\n\n\n최강 일각 라이온\n\n§g========================================§!\n§Y안내§!: 백귀야행 연합학원은 §Y보통의§! 난이도의 국가이며, HOI4 기본 바닐라 스타일에 약간의 서사를 더한 샌드박스 스타일 국가입니다. 자유로운 플레이를 원하는 플레이어에게 추천합니다."
 highlight_major_7_tt: "@SHA §Y산해경 고급중학교§! 경로: \n\n\n\n\n\n   £GFX_SHA_path_texticon\n\n\n\n\n\n\n키사키 문주님도 샤오미 씁니다\n §G붉은 빈의 유산§!\n    £white_dot 오스트로 맑시즘 부흥\n    £white_dot 산해경 특색 사회주의\n\n§g========================================§!\n§Y안내§!: 산해경 고급중학교는 §Y보통의§! 난이도의 국가이며, HOI4 기본 바닐라 스타일에 약간의 서사를 더한 샌드박스 스타일 국가입니다. 자유로운 플레이를 원하는 플레이어에게 추천합니다."

 highlight_minor_1_tt: "@LUX §Y룩셈부르크 대공국§! §g(흥신소 68)§! 경로: "
 highlight_minor_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_HEU_path_texticon\n\n\n\n\n\n\n §g친게헨나 정부§!\n  £white_dot 룩셈부르크 68혁명 - §G(기본 설정)§!\n\n §g반게헨나 정부§!\n  £white_dot §Y민권법§!의 가결\n  £white_dot §Y민권법§!의 부결\n\n§g========================================§!\n§Y안내§!: 룩셈부르크 대공국은 §R매우 도전적§!인 난이도의 국가이며, 다양한 이벤트와 스토리텔링 중심의 서사형 국가입니다. 블루 아카이브 모드에서 새로운 경험을 하고 싶거나, 또는 §Y흥신소 68§!의 이세계 이야기에 대해 관심이 있는 유저들에게 추천합니다."

 highlight_minor_2_tt: "@GEH §Y게헨나 선도부§! 경로: "
 highlight_minor_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEH_path_texticon\n\n\n\n\n\n\n §g소라사키 히나의 정부§!\n  £white_dot 시로미 이오리의 군국주의 정부\n  £white_dot 열성부원들에 의한 소라사키 히나 독재\n  £white_dot 아마우 아코와 기획부 기술관료정\n  £white_dot 현상유지\n\n §g소라사키 히나의 사임§!\n  £white_dot 시로미 이오리 선도부장\n  £white_dot 열성부원 집단지도체제\n  £white_dot 로봇 소라사키 히나의 집권\n  £white_dot 기획부 집단지도체제\n  £white_dot 현상유지\n§g========================================§!\n§Y안내§!: 게헨나 선도부는 §R도전적§!인 난이도의 국가이며, 카이저라이히 형식을 따른 간단한 서사 중심의 국가입니다. 일정 시간 안에 게헨나와 트리니티 전체를 정복하지 못하면 히나가 사임하며, 히나의 사임 여부에 따라 완전히 다른 이야기가 진행됩니다. 어려운 게임 플레이를 원하는 게이머들에게 추천합니다."

 highlight_minor_3_tt: "@ABY §Y아비도스 고등학교§! 경로:"
 highlight_minor_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ABY_path_texticon\n\n\n\n\n\n\n §4마사리크의 유산 복원§!\n  £white_dot §g이 땅의 주인들§! - §Y현지인 정부§!\n    £white_dot §Y1개§!의 엔딩 보유. - (§R미완성§!)\n  £white_dot §g두 세계의 국가§! - §t오쿠소라 아야네§!\n    £white_dot §Y1개§!의 엔딩 보유. - (§R미완성§!)\n\n§4민주주의, 바람 앞의 등불§!\n  £white_dot §g달그락거리는 열쇠§! - §C스나오오카미 시로코§!\n    £white_dot §Y2개§!의 엔딩 보유.\n  £white_dot §g진정한 인민의 민주주의§! - §P타카나시 호시노§!\n    £white_dot §Y1개§!의 엔딩 보유.\n\n§4미친 자들의 전쟁§!\n  £white_dot §g죽은 이들을 위한 복수.§! - §0쿠로미 세리카§!\n    £white_dot §Y2개§!의 엔딩 보유. - (§R미완성§!)\n  £white_dot §g전키보토스를 계몽하라.§! - §L아사기리 스오우§!\n    £white_dot §Y1개§!의 엔딩 보유. - (§R미완성§!)\n  £white_dot §g힘을 잃은 지도자.§! - §8이자요이 노노미§!\n    £white_dot §Y1개§!의 엔딩 보유. - (§R미완성§!)\n§g========================================§!\n§Y안내§!: 아비도스 고등학교는 §R도전적§!인 난이도의 국가이며, 스토리텔링 이벤트 중심의 서사형 국가입니다. 대부분의 루트가 현지인과 협력하며 민주주의적 체제의 완성을 목표로 하는 국가입니다. '선생' 역할을 하는 역사적 인물이 존재하며, 학생들 사이의 갈등이나 사건보다 키보토스인과 현지인 사이의 교류나 갈등을 중심으로 진행됩니다.\n§Y키보토스인과 현지인 사이에 벌어지는 이야기를 선호하는 플레이어에게 추천드립니다.§!"
 
 highlight_minor_4_tt: "@FRA §Y프랑스 공화국§! 경로:"
 highlight_minor_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_FRA_path_texticon\n\n\n\n\n\n\n §Y본토를 향한 길§!\n  £white_dot §g'베르됭의 사자'§! - §4필리프 페탱§!\n  £white_dot §g'공화국의 잔불'§!- §t조르주 가믈랭§!\n  £white_dot §g'로렌의 십자가'§!- §Y샤를 드 골§!\n§g========================================§!\n§Y안내§!: 프랑스 공화국은 스토리텔링 이벤트나 엔딩이 존재하지 않는, HOI4 바닐라 스타일의 국가입니다. 바닐라 스타일의 자유로운 샌드박스 플레이를 원하시는 분께 추천드립니다."
 
 highlight_minor_5_tt: "@ARI §Y아리우스 분교§! 경로:"
 highlight_minor_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ARI_path_texticon\n\n\n\n\n\n\n §g아리우스 분교는 국가가 확장하며 점차 경로가 넓어지는 독특한 진행 구조를 가진 국가입니다.§!\n\n§g스쿼드의 집권§!\n  £white_dot 보수파의 승리 - (§C출시!§!)\n  £white_dot 개혁파의 승리 - (§R미완성§!)\n  £white_dot 무승부 - (§R미완성§!)\n\n§g========================================§!\n§Y안내§!: 아리우스 분교는 스토리텔링 이벤트와 바닐라 HOI4 스타일을 조립한 균형 있는 스타일의 국가입니다. 트리니티와의 전쟁이 예정되어 있는 국가로 난도가 §R매우 높은 편이며§!, 상급자 이상 게이머나 아리우스 분교의 이야기를 경험하고 싶으신 분들에게 추천합니다."

 HYA_GATHERING_STORM_DESC: "문화와 축제의 학원, 오랜 역사와 전통을 자랑하는 학원. 백귀야행은 대전이 이전이나 이후나 여전히 문화의 축제의 불빛으로 바쁜 나날들을 이어가고 있습니다.\n\n하지만 언제까지나 축제를 즐기기에는 이제는 현실을 받아들어야만 합니다. 대전이라는 전대미문의 대사건은 키보토스의 뿌리를 뒤흔들었으니, 나무의 가지로서 매달린 백귀야행 또한 변화를 받아들어야만 합니다.\n\n전통적으로 백귀야행의 학생회를 대신했던 음양부, 대전이 이후 부상한 백화요란, 그리고 수많은 이들이 기회를 찾고자 투쟁합니다."
 
 #발키리 경찰학교
 KSP_GATHERING_STORM_DESC: "발키리 경찰학교는 대전이로 인해 모든 학원들 중 가장 큰 피해를 입었습니다. 키보토스 전역에 퍼져 있었던 학생들은 대전이와 동시에 전부 연락이 끊겼고, 그들은 아직까지도 연락이 닿지 않고 있습니다. 또한, 발키리 교정국이 붕괴하면서 키보토스의 가장 위험한 이들이 탈출하고자 하고 있습니다.\n\n이러한 여러 위기 속에서 칸나는 어떻게든 발키리 경찰학교를 이끌어나가고 있지만, 과연 언제까지 버틸 수 있을까요..."
 #SRT
 SRT_GATHERING_STORM_DESC: "엄격한 훈련과 혹독한 선발과정으로 유명한 SRT 특수학원은 각 학원의 중대한 범죄 상황에 유연하게 대처하기 위해서 총학생회장이 특별히 설립한 특수부대 양성 학원입니다. 그러나 SRT의 존재는 각 학원의 자치권을 침해하는 행위이기에 논란이 있었지만, 총학생회장의 인망으로 각 학원은 반발을 하진 않았습니다.\n\n대전이의 혼란으로 인해 SRT는 총학생회와 떨어진 곳에 자리 잡게 되었습니다. 이 상황에서 총학생회장의 신변에 위협이 생긴다면, SRT의 존재 여부는 불투명해질 것입니다..."
