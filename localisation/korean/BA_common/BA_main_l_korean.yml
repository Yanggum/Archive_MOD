 BA_super.17.t: "동유럽 평원의 전쟁"
 BA_super.17.d: "달성 조건 : 폴란드가 공동 대응 중점을 완료한 상태로 소련과 전쟁 중임 \n\n영상 링크 : https://www.youtube.com/watch?v=qiwmoHXGlkk"
 
 BA_super.18.t: "승리의 날"
