 FROM_Gehenna_Academy: "§Y학생 소개:§!\n§L게헨나 학원ㅣ§!"
 FROM_Millennium_Academy: "§Y학생 소개:§!\n§L밀레니엄 사이언스 스쿨ㅣ§!"
 FROM_Trinity_Academy: "§Y학생 소개:§!\n§L트리니티 종합학원ㅣ§!"
 FROM_Hyakkiyako_Academy: "§Y학생 소개:§!\n§L백귀야행 연합학원ㅣ§!"
 FROM_SHANHAIJING_Academy: "§Y학생 소개:§!\n§L산해경 고급중학교ㅣ§!"
 FROM_RedWinter_Academy: "§Y학생 소개:§!\n§L붉은겨울 연방학원ㅣ§!"
 FROM_Valkyrie_Academy: "§Y학생 소개:§!\n§L발키리 경찰학원ㅣ§!"
 FROM_SRT_Academy: "§Y학생 소개:§!\n§LSRT 특수학원ㅣ§!"
 FROM_Arius_Academy: "§Y학생 소개:§!\n§L아리우스 분교ㅣ§!"

 # 출신 동아리
 FROM_NONE: "§L무소속§!"
 FROM_Tea_Party: "§L트리니티 종합학원 학생회 소속§!"
 FROM_After_School_Sweets_Club: "§L방과후 디저트부 소속§!"
 FROM_Sisterhood: "§L시스터후드 소속§!"
 FROM_Library_Committee: "§L도서부 소속§!"
 FROM_Justice_Task_Foce: "§L정의실현부 소속§!"
 FROM_Knights_Hospitaller: "§L구호기사단 소속§!"
 FROM_Trinity_Vigilante_Crew: "§L자경단 소속§!"
 FROM_Problem_Solver_68: "흥신소 68 소속"

 # 트리니티 종합학원
 TRN_Airi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§L트리니티 방과후 디저트부 소속의 명랑한 부원. 느긋하고 여유로운 성품의 소유자로 친구들과 디저트를 먹으며 떠드는 시간을 무엇보다 소중히 여긴다. 좋아하는 디저트는 달콤한 아이스크림으로, 최근에는 민트초코 맛에 푹 빠져있다.§!"
 TRN_Yoshimi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§L작고 귀여운 체형, 반짝이는 눈빛, 그리고... 약간의 난폭함까지. 그녀는 친구들 사이에서 늘 '작은 동물'처럼 불립니다. 키가 작은 것은 내심 콤플렉스지만, 그 누구보다 어른스러워지고 싶어 합니다. 그래서 학교에서나 친구들 앞에서는 항상 어깨를 쭉 펴고, 조금이라도 더 차분하고 성숙해 보이려 애씁니다. 하지만 그 진지한 결심도 얼마 못 가 얼굴에 그대로 드러나는 표정 때문에 들통 나고 맙니다.\n\n그런 그녀가 가장 빛날 때는 따로 있습니다. 바로 좋아하는 디저트 카페를 순회하며, 시즌 한정 디저트를 맛볼 때입니다. 평소에는 어른스럽게 보이려고 입술을 꼭 다물고 다니지만, 디저트 앞에서는 모든 고민이 사라지고 무의식 중에 밝은 미소가 피어납니다. 마치 잔뜩 기대에 찬 작은 동물이 좋아하는 먹이를 발견한 듯한 그 표정은 주변 친구들까지 행복하게 만들 만큼 사랑스럽습니다.§!"
 TRN_Natsu_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§L트리니티 방과후 디저트부 소속의 일원으로, 트러블 메이커의 필두이자 자칭 로맨티스트. 묘하게 철학적인 말을 하거나, 만사를 디저트에 빗대어 표현하는 버릇이 있다. 늘 엉뚱한 일로 주변을 곤란하게 만들지만, 모두와 함께 로망을 공유하고 싶다는 순수한 마음 때문. 이야기하는 '로망'의 정의가 항상 바뀌기 때문에, 옆에서 보면 모두가 나츠에게 '휘둘리고 있다'는 인상을 부정할 순 없다.§!"
 TRN_Kazusa_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§L느긋하고 조용한 성격의 방과후 디저트부 부원. 자신을 잘 드러내지 않는 편이며, 보통 다른 부원들의 행동에 묵묵히 따른다. 늘 주변의 기행에 휘말려 고생하지만 한편으론 그런 것들까지도 소중하게 생각한다.§!"
 TRN_Mika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§L티파티 멤버 중 한 명으로, 또 다른 티파티의 수장인 나기사와는 오랫동안 함께 자라온 소꿉친구 관계. 하지만 정치적으로 대립하고 있는 입장이기에, 공사 구분은 확실하게 하고 있다. 늘 즐겁다는 듯이 웃으며 발랄하고 쾌활한 모습을 보여주는 그녀이지만, 그 이면에는 남들에게 섣불리 말하지 못하는 고민을 안고 있기도 하는 등, 그 속을 쉬이 알 수 없는 소녀.§!"
 TRN_Nagisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§L티파티 멤버 중 한 명으로, 나긋나긋하고 다정한 말씨를 가지고 있지만, 속내를 쉽게 내비치지 않기 때문에 주변 사람들은 그녀에게 쉽게 다가가지 못하고 어려워한다. 취미는 티파티에 쓸 찻잎과 다과를 준비하는 것으로, 많은 트리니티의 학생들이 그녀와 함께하는 티파티를 동경하고 있다.§!"
 TRN_Seia_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§L주변에서는 현학적이고 종잡기 어려운 사람으로 여겨지고, 조금은 제멋대로인 귀족과 같은 면모가 있다. 사태 이후로는 전보다 고집스럽고 진지하게 임하는 모습도 종종 보인다.§!"
 TRN_Sakurako_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§L트리니티 시스터후드의 신실한 시스터 학생. 매사에 진지하며 많은 사람들에게 두터운 신임을 받고 있다. 늘 경건한 마음으로 책무에 임하지만, 고지식한 탓에 유행이나 상식에서 동떨어질 때가 있다.§!"
 TRN_Wakaba_Hinata_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§L시스터후드 소속의 성실하고 선량한 소녀. 트리니티 대성당의 관리라는 중책을 맡고 있는 책임자로, 주어진 일은 성실히 완수하며 누구에게나 친절하다. 하지만 덜렁대는 성격 탓에 실수를 자주 저질러 스스로에 대한 자신감은 부족한 편. 늘 들고 다니는 가방에는 거대한 설치형 유탄 기관총이 들어 있지만, 무거워하는 기색을 내비친 적은 한 번도 없다.§!"
 TRN_Mari_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§L시스터후드 소속의 신실하고 자애로운 소녀. 언제나 상냥하고 부드러운 미소로 트리니티의 학생들을 맞이한다. 귀여운 인상이지만, 차분하고 마음이 편해지는 분위기라 상담하러 오는 학생들이 많다. 늘 스스로가 부족하다고 여기기 때문에, 다른 선배들처럼 훌륭한 시스터가 되겠다는 꿈을 가지고 있다.§!"
 TRN_Kozeki_Ui_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n§L트리니티 도서부의 도서부장. 사람보다 책이 좋다고 할 정도로 책을 사랑하는 소녀로, 특히 세월의 흔적을 느낄 수 있는 오래된 책을 좋아한다. 평상시에는 아무도 오지 않는 고서관에 틀어박혀 책을 읽거나 고서를 관리하며 시간을 보낸다.§!"
 TRN_Shimiko_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n§L트리니티 도서부 소속의 사서. 책을 정말 좋아하는 독서광 소녀로 트리니티 도서관의 방대한 장서를 모두 읽어 본 몇 안 되는 학생 중 하나이다. 책을 읽는 것만큼 책을 권하는 것도 좋아하며, 상대를 만나면 상대의 취향에 맞는 책을 추천해주려고 한다.§!"
 TRN_tsurugi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§L트리니티 정의실현부의 부장이자, 트리니티의 공식 전략 병기. 호전적이고 폭력적인 성격의 소유자로 마음에 들지 않는 것이 있다면 일단 부수고 본다. 부부장인 하스미의 능력 덕분에 정의실현부는 가까스로 유지되는 중. 통제할 수 없는 광견 같은 츠루기지만, 특정 인물 앞에서는 부끄러움을 감추지 못하는 소녀 같은 면모를 보이기도 한다.§!"
 TRN_Hasumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§L트리니티 정의실현부의 이인자. 광란의 아이콘인 부장 츠루기를 대신해 정의실현부의 전술 지휘관 역할도 담당하고 있다. 이 때문에 침착한 지적인 트리니티 여학생처럼 보이기도 하지만, 그녀 역시 정의실현부의 일원이다. 누구보다도 침착하게, 무모한 행동을 하기도 한다.§!"
 TRN_Ichika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§L항상 여유로운 표정의 정의실현부 부원. 다양한 학생들이 있는 정의실현부 내에서도, 융통성과 조율을 곧잘 담당하고 있다. 다른 학원과의 관계도 좋은 편. 나긋나긋한 표정과 친절함으로 알려졌지만, 천성이 아니라 노력의 일환이다.§!"
 TRN_Mashiro_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§L트리니티 학원 정의실현부의 성실한 부원. 키에 맞지 않는 거대한 대물 저격총을 가지고 다니며 묵묵히 화력 지원 임무를 수행한다. 말수가 적은 편이지만 낯을 가리거나 대인관계가 서투른 것은 아니며, 정의와 관련된 화제를 언급하면 오히려 말이 많아지기도 한다.§!"
 TRN_Koharu_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§L트리니티 학원 정의실현부의 일원 본인은 스스로를 엘리트라고 생각하고 있지만, 실제로는 학교 수업도 따라가지 못할 정도의 바보. 야한 잡지를 수집하는 취미가 있어 사소한 것을 보고도 금세 야한 망상을 부풀려 부끄러워한다.§L"
 TRN_Ajitani_Hifumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_NONE$\n\n§L외모도 성적도 특출나지 않지만, 모나지 않고 상냥한 성품 덕분에 인기가 많다. 주변 사람들의 고민이나 이야기를 잘 들어주지만, 그 때문에 의도치 않게 분위기에 휩쓸려 말썽을 일으키는 경우도 있다.§!"
 TRN_Hanako_advisor_desc: "$FROM_Trinity_Academy$$FROM_NONE$\n\n§L다정다감한 아가씨. 겉으로 보기엔 정말 정숙하고 기품 있는 아가씨로 보이지만, 입을 열면 온갖 에로한 말들을 쏟아내는 문제아다. 하나코의 본모습을 아는 학생은 하나코가 입을 열 때마다 긴장하고 주변을 살펴보게 된다.§!"
 TRN_Mine_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§L올곧고 심지가 굳으나 과격한 면도 있는 백의의 전사. '미네가 부수고 기사단이 치료한다'라는 명성(?)은 이미 트리니티 전역에서 유명하다. 여유가 생기면 자신의 장비를 정비하거나, 다과를 준비하여 지인들을 초대해 마음을 달랜다. 홍차에 대한 조예는 정의실현부의 하스미와 비교해도 결코 밀리지 않는다는 말이 있다.§!"
 TRN_Serina_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§L트리니티 구호기사단 소속의 상냥한 소녀. 봉사 활동을 즐겨 하는 선량한 성품의 소유자로, 건강에 관해서는 지나칠 정도로 걱정이 많기 때문에 주변의 학우들로부터 엄마 같다는 평가를 종종 듣기도 한다. 다툼과 분쟁을 싫어하는 심약한 성품의 소유자지만, 평화를 위협하는 적 앞에서는 언제나 단호하게 맞서 싸울 준비가 되어 있다.§!"
 TRN_Hanae_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§L트리니티 구호기사단의 명랑하고 쾌활한 신입생. 매사에 긍정적이고 활기찬 성격의 소유자지만, 환자를 보았다 하면 지나치게 요란을 떨어 상황을 더욱 악화시키곤 한다. 여러모로 엉뚱한 소녀이지만 그녀의 응원을 받은 환자는 신기하게도 어떤 병이든 금세 치유된다고 한다.§!"
 TRN_Suzumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Trinity_Vigilante_Crew$\n\n§L트리니티 학생들의 안전을 책임지는 자경단의 멤버. 트리니티의 학생들이 다른 학원에게 습격당하는 일이 잦아지자, 이를 막기 위해 자진하여 거리 순찰을 나서기 시작했다. 불타는 정의감 때문에 냉철하고 차가운 성격으로 오해받는 일이 잦지만, 사실은 상냥한 면모도 가지고 있다.§!"
 TRN_Reisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Trinity_Vigilante_Crew$§L트리니티 곳곳에서 갑작스레 출몰하는 자경단 멤버. 요란하고 시끄러운 분위기 때문에 장난으로 오인을 받을 때도 있지만, 사실 누구보다 진지하게 자경단 활동을 하고 있다. 늘 자기소개를 하지만 그때마다 멘트가 조금씩 달라진다.§!"

 TRK_yurijono_seia_desc: "$FROM_Trinity_Academy$§L상투스 분파 소속\n\n주변에서 현학적이고 종잡기 어려운 사람으로 여겨지고, 조금은 제멋대로인 귀족과 같은 면모를 가지고 있다. 건강이 돌아온 이후로는 전보다 조금 더 고집스럽고 장난기 있는 어린아이 같은 모습도 종종 보인다.§!"
 TRK_kirifuji_Nagisa_desc: "$FROM_Trinity_Academy$§L필리우스 분파 소속§!\n\n§L나긋나긋하고 다정한 말씨를 가지고 있지만, 속내를 쉽게 내비치지 않기 때문에 주변 사람들은 그녀에게 쉽게 다가가지 못하고 어려워한다. 취미는 티파티에 쓸 찻잎과 다과를 준비하는 것으로, 많은 트리니티의 학생들이 그녀와 함께하는 티파티를 동경하고 있다.§!"

 TRN_Ninomae_Mirai_joke_leader_desc: "$FROM_Trinity_Academy$§L파테르 분파 소속§!\n\n§L니노마에 미라이라는 이름을 떠올리는 순간, 그 이름이 누구를 가리키는지, 혹은 가리키지 않는지를 굳이 따질 필요는 없다는 생각이 먼저 들기도 하고, 사실 그런 생각이 들었다는 사실 자체도 크게 중요하지는 않지만, 어쨌든 여기서는 그저 이름이 하나 놓여 있을 뿐이라는 점을 미리 말해두는 게 괜히 마음이 편해진다. 이 글에 등장하는 니노마에 미라이는 2차 창작 소설 속 인물이고, 이름만 빌려왔을 뿐이니 “그거 아니지 않냐” 같은 이야기는 애초에 성립하지 않는다는 점을 굳이, 정말 굳이 강조해두고 싶다. 니노마에 미라이는 무언가를 하고 있는 것처럼 보이지만 실제로는 아무것도 하지 않고, 아무것도 하지 않는 것처럼 보이지만 사실 그 역시 확실하지 않다. 그녀가 서 있는 장소는 분명 어딘가이긴 한데, 그 어딘가가 어디인지를 설명하려고 하면 문장은 괜히 길어지고, 길어진 문장은 또 다른 문장을 불러오면서 정작 장소에 대한 이야기는 슬그머니 빠져나가 버린다. 이런 식으로 이야기는 계속 옆길로 새고, 새는 길 위에는 쓸데없이 반짝이는 말들이 깔려 있어서 밟을 때마다 의미 없는 소리가 나는 듯한 느낌만 남는다. 니노마에 미라이라는 이름에는 미래가 들어 있지만, 그렇다고 미래에 대해 말하려는 건 아니고, 과거를 이야기할 생각도 없으며, 현재에 대해서도 딱히 할 말은 없다. 그럼에도 불구하고 문장은 계속해서 무언가를 말하는 척을 하고, 그 척하는 태도 덕분에 읽는 사람은 혹시나 하는 마음으로 다음 문장을 보게 되지만, 다음 문장 역시 비슷한 방향으로 흘러가다가 방향이라는 개념 자체를 잊어버린다. 결국 이 글은 니노마에 미라이와 관련되어 있는 것처럼 보이지만, 실제로는 이름 주변을 빙빙 돌면서 미사여구를 흘리고, 주제를 피해 가고, 말의 양으로 내용을 대신하고 있을 뿐이다. 그리고 다시 한 번 말하지만, 이건 어디까지나 2차 창작 소설이고 이름만 빌렸을 뿐이니, 의미를 찾으려 하거나 설정을 따지려 들면 그 순간 이미 이 글의 흐름과는 멀어졌다고 봐도 무방하다. 그냥 이렇게 횡설수설하는 문장이 흘러가고 있다는 사실만 남기고, 그 사실마저도 굳이 붙잡지 않아도 아무 문제는 없을 것이다.§!"

 #아비도스 고등학교
 ABY_Hoshino_advisor_desc: "$FROM_Abydos_Academy$\n\n아비도스 고등학교의 유일한 3학년 이자 대책위원회의 정신적 지주인 타카나씨 호시노는 얼핏 보면 그저 잠을 좋아하는 귀여운 게으름 뱅이로 보입니다. 그녀의 느긋한 행동을 보고 있자면 선배의 위엄보다는 귀여운 후배로서의 느낌이 더 강합니다. 하지만 그녀가 사랑에 맞지 않는 아비도스 고등학교와 후배들에게 위함에 처하면 그녀는 전에 귀엽고 나긋한 모습은 어디 갔냐는 듯 강인하고 강직한. 강한 모습을 보일 것입니다. 다소 감정에 휘둘리는 경향이 있지만 그녀의 뛰어난 전투력은 그 무모함도 무마하고 가로막는 모든 것을 부수고 나아갈 그런 강인해 보이는 그녀도 가끔은 어벙하고 이상한 모습을 보일 때가 있습니다. 후배들이 이에 대해 물어보더라도 그녀는 대답을 회피하고 맙니다. 그녀가 마음에 담아두고 있는 말 못할 사연은 무엇일까요?"
 ABY_Shiroko_advisor_desc: "$FROM_Abydos_Academy$\n\n대책위원회 2 학년인 스나오오카미 시로코를 처음 만나면 그녀의 첫 인상에 반할지도 모릅니다. 아름답고 귀여운 수려한 외모와 차분하고 속삭이는 나긋한 목소리가 당신의 귀를 간지럽히며 빠져들지도 모르지만 그녀는 금방 당신의 기대를 배신할 것입니다. 활발하며 아무도 따라잡지 못하는 체력, 그녀의 입에서 튀어나오는 상식과는 수천만 년 떨어진 듯한 황당한 의견은 그녀와 오래 알고 지낸 대책위원회마저 당황시키곤 합니다. 하지만 이러한 면모가 오히려 그녀의 매력을 느끼게 하는 매개체가 되곤 합니다. 2학년이지만 아무도 멈추지 못하는 행동력은 마치 파릇파릇한 1학년을 연상케 하면서도 노련한 전투능력은 마치 구르고 구른 3학년과 같은 느낌을 줍니다. 그래서 인지 그녀는 호시노와 노노미에겐 귀여운 후배 취급을, 세리카와 아야네에겐 강인한 선배로서 존경받고 있습니다."
 ABY_Nonomi_advisor_desc: "$FROM_Abydos_Academy$\n\n아비도스 고등학교 2학년 이자요이 노노미는 가장 선배같은 면모를 가진 학생입니다. 매사에 긍정적이고 밝은 말투와 행동은 대책위원회를 다소 시킬 때도 있지만 대책위원회의 분위기를 늘 밝게 해줍니다. 또한 그녀는 대책위원회의 모두를 보듬어주며 의견을 취합하고 싸움을 방지하는 등 어머니 같은 모습을 보입니다. 대책위원회의 간식 부장이기도 한 그녀는 항상 모두의 사기를 북돋아 주는 역할을 합니다. 한편 그녀는 황금카드라는 것을 종종 꺼내곤 합니다. 황금카드는 모든 것을 살 수 있는 한도가 없는 카드라고 하는데 그걸 왜 아비도스 고등학교에 빚을 갚는데 쓰지 않았을까요? 종종 의문이 들때도 있지만 대책위원회는 깊게 파고들지 않습니다. 어쩌면 호시노라면 알지도 모르겠네요."
 ABY_Serika_advisor_desc: "$FROM_Abydos_Academy$\n\n아비도스 고등학교의 막내이자 귀여운 허당인 쿠로미 세리카는 자주 속곤 합니다. 쉽게 속아서 기껏 모은 돈을 날리거나 하는 일도 부지기수지만 동시에 가장 성실하다고 할 수 있는 그녀는 아비도스 고등학교가 빚을 갚는데 가장 큰 역할을 하고 있습니다. 아비도스 고등학교의 각별한 애정을 가진 그녀는 모두가 개인이 아르바이트로 번 돈은 빚을 갚는 데 쓰지 않고 함께 일한 것만 쓰자고 세리카를 배려해줬지만 그녀는 몰래 자신의 아르바이트비를 고등학교에 빚을 갚는데 쓰고 있습니다. 세리카는 선배들의 황당한 주장-주로 시로코-에 강하게 나올 때도 있고 말을 거칠게 하긴 하지만 속으로는 그 누구보다 대책위원회를 사랑하는 소녀입니다."
 ABY_Ayane_advisor_desc: "$FROM_Abydos_Academy$\n\n대책위원회 서기인 오쿠소라 아야네는 가장 어리지만 개성이 강한 선배들 사이에서 가장 어른스러운 모습을 보여줍니다. 다르게 말하면 개성 없이 심심하다고 생각할 수도 있지만 엉뚱한 선배들 사이에서 그녀는 평범함이란 개성을 돋보이게 합니다. 자주 선배들에게 휘둘리거나 선배들의 엉뚱한 의견을 쳐내는 등 대책위원회의 상식인으로서의 역할을 충실히 해내고 있습니다. 이쯤 되면 아야네에게 평범한 외 어떤 특징도 없다고 느낄 수 있지만 아닙니다. 주변인들에게 묻혀 잘 보이지. 뿐 아야네는 매우 똑똑한 축에 속합니다. 대책위원회의 모든 돈 출입을 관리하고 같은 재료로도 다른 이들보다 높은 수입을 내는 수완, 아비도스 고등학교의 시설물을 모두 관리하는 그녀의 능력은 범부가 흉내 낼 수 있는 게 아닙니다. 또한 역시 선배들의 압도적인 능력에 묻혀 잘 드러나지 않지만 체력도 상위권인 모든 것을 겸비한 소녀라고 할 수 있습니다."

 # 붉은겨울 연방학원
 RED_trotsky_desc: "$FROM_RedWinter_Academy$§L레프 트로츠키는 러시아 제국, 소비에트 연방의 볼셰비키 계열 정치인, 혁명가, 마르크스주의 이론가이자 사상적으로 트로츠키주의를 정립한 인물입니다. 경력상으로는 10월 혁명의 주역으로, 붉은 군대의 창시자이자 지도자로서 소련 건설에 지대한 공적을 세웠습니다. 블라디미르 레닌의 후계자로 거론될 정도였지만, 이오시프 스탈린과의 권력 투쟁에서 패배해 소련 공산당에서 제명되고 자신이 건국한 나라에서 추방당했습니다. 추방 이후 망명지를 옮겨 다니며 스탈린 체제를 비판하고 있습니다.§!\n\n§Y생애§! : §L러시아 제국 헤르손현 옐리사베트그라드군의 작은 마을 야놉카에서 출생했습니다. 그의 아버지 다비트 레온티예비치 브론시테인은 폴타바 출신의 유대계 우크라이나인으로 그의 가정에서는 우크라이나어·러시아어가 섞인 피진 수르지크를 사용하였습니다. 트로츠키의 아버지는 부농이었습니다. 그는 트로츠키가 9살이 되던 해 그를 오데사로 보내 독일 루터회 학교에서 공부하도록 하였습니다. 오데사는 여러 인종이 살던 국제도시였으므로 트로츠키는 국제주의에 눈뜨게 되었습니다. 이는 조지아인임에도 불구하고 철저히 러시아 민족주의를 강조한 이오시프 스탈린과 대비되는 점입니다. 트로츠키는 수석 졸업을 할 정도로 학업 성적이 우수했으며, 독일어는 물론 영어, 프랑스어에도 유창했습니다. 트로츠키는 자서전에서 자신의 어학 능력이 평범하다고 이야기했고, 특히 영어는 자유롭게 구사하지 못한다고 했으나 사실 트로츠키의 영어 연설을 보면 발음이 어색할 뿐, 문장 만드는 데는 별로 문제가 없는 것처럼 보입니다.\n 당시 러시아 제국은 황제의 전제 정치하에 있었고, 러시아에는 여러 사상적 배경을 가진 혁명 세력이 우후죽순처럼 생겨나며 조금이라도 깨어있는 사람은 모두 혁명 사상에 물들고 있었습니다. 수학을 전공하고 있던 트로츠키는 처음에는 러시아 전통 사상으로 사회주의 혁명을 이뤄보자는 인민주의자였으나 후에 마르크스주의에 영향을 받았습니다. 트로츠키는 보수주의자에서 인민주의자, 다시 마르크스주의자로 바뀌는 사상적 변화 과정이 무척 빨랐습니다.\n 그는 학생의 신분으로 혁명 운동에 뛰어들었고, 우크라이나 남부 니콜라예프의 노동자들을 조직하는 데 주도적 역할을 하였습니다. 이때부터 그의 조직 능력은 두각을 나타내었습니다. 게다가 연설 실력도 출중해서 2월 혁명 이후 반혁명적 장군인 라브르 코르닐로프의 쿠데타 부대가 수도에 진입하자 트로츠키는 이들을 막아서서 쿠데타 부대에 일장 연설을 했고, 그의 연설만 듣고 쿠데타 부대는 자진 해산해서 코르닐로프의 쿠데타는 실패하게 됩니다. 필력도 출중하여 레닌이 후에 \"그 사람의 글은 훌륭하기는 하지만, 너무 문체가 화려하다.\"라고 할 정도였습니다. 소련 연구가로 유명한 영국인 역사학자인 로버트 존 서비스는 트로츠키가 혁명가가 되지 않았더라도 문필가나 평론가로서 역사에 이름을 남겼을 것이라고 평할 정도였습니다.§!" # 트리니티에 왜 꼽사리 껴있음?

 # 
 GER_dietrich_bonhoeffer_desc: "§Y출생:§! §L1906년 2월 4일, 독일 제국 브레슬라우§!\n§Y이력:§! §L1906년 독일 브레슬라우에서 태어난 디트리히 본회퍼는 루터교 전통이 깊은 집안에서 성장했습니다. 그의 할아버지는 궁정 목사였고 어머니는 자녀들에게 성경과 시, 노래를 가르칠 만큼 신앙과 교양을 갖춘 인물이었습니다. 그러나 아버지는 신앙에 무관심했고 형제들 역시 종교에 냉소적이었습니다. 본회퍼가 신학자가 되겠다고 선언했을 때 가족은 반대했지만 그는 \"그렇다면 내가 바꾸겠습니다\"라며 자신의 뜻을 꺾지 않았습니다. 결국 가족도 그의 결심을 존중했습니다.\n\n튀빙겐과 베를린에서 신학을 공부한 그는 '성도의 교제'를 주제로 한 논문으로 학계의 인정을 받았고 로마에서의 유학을 통해 가톨릭 전례와 교리에 대한 비판적 시각을 넓혔습니다. 당시 나치의 집권을 본 본회퍼는 누구보다 비판적이었고 1933년에는 라디오 강연을 통해 지도자의 권력을 제한해야 한다고 주장하기도 했습니다. 이후 런던과 독일을 오가며 히틀러의 교회 탄압을 규탄하고 교회의 저항을 촉구하는 데 앞장섰습니다.\n\n그러나 1935년 대전이 사태가 발발하며 독일의 정치 지형은 급격히 변했습니다. 미소노 미카가 정권을 잡았을 때 사람들은 그녀가 친독주의적인 모습에 안심했지만 곧 허상임이 들어났고 '교회 투쟁'이라는 이름 아래 전국적인 교회 탄압이 시작되었습니다.\n\n본회퍼는 이미 자신이 무엇을 해야 할지 알고 있었습니다. 그것이 결국 비극적 결말로 이어지리라는 사실 또한 알고 있었지만 그의 선택은 흔들리지 않았습니다.§!"
 
 
 # 키보토스 총학생회 
 COU_leon_degrelle_desc: "§Y출생:§! §L1906년 6월 15일, 벨기에 왕국 부용§!\n§Y이력:§! §L잘생긴 젊은이에, 꿈꾸는 듯하면서도 무언가를 찾는 듯한 눈빛을 지닌 드그렐은 그를 단순한 파시스트 기회주의자라고 여기는 사람들이 천지에 깔렸지만, 그 내막을 들여다보면 그렇게 단순하게 정의하기는 어려운 인물이라고 볼 수 있습니다.\n\n1904년에 처음으로 벨기에 룩셈부르크 지방의 의회 의원으로 선출되었고 가톨릭당의 일원으로서 그는 존경받는 보수 정치인으로의 커리어를 쌓았습니다. 특히 독실한 가톨릭 신자인 드그렐은 급진적인 성직자 파벌에서 뛰어난 연설가로서 막대한 영향력을 끼쳤습니다. 가톨릭당과의 불화가 깊어진 이후에는 이탈리아 파시즘을 모방한 독자적인 렉스당을 창당하고 1936년에 벌어질 선거에 출마할 준비를 하고 있었습니다.\n\n그러나 1935년 11월 이루어진 대전이는 드그렐의 인생 자체를 바꾸어 놓았습니다. 처음에는 이계의 침략자들을 사탄이라고 규정하며 참전용사들을 중심으로 저항할 것을 독려했으나 총탄을 맞고도 죽지 않는 소녀들을 보면서 깊은 회의감에 빠졌습니다. 덧없는 저항은 벨기에인들을 죽음으로 몰아갔으며 사악한 공산주의자들은 벨기에 정부가 붕괴할 때만을 기다렸습니다.\n\n1935년 11월 30일, 드그렐은 일명 코르트레이크 쿠데타라고 불리는 일종의 당 숙청을 단행했습니다. 모든 저항 세력을 렉스당에서 축출하고 행정위원회에 투항한 그는 총학생회 내 협력자 집단의 수장이 되었고, 벨기에를 비롯한 범유럽에서 공산주의 악마들을 쫓아내고 벨기에 민족과 국가를 위해 최선을 다하고 있습니다.§!"
 COU_cornelis_van_geelkerken_desc: "§Y출생:§! §L1901년 3월 19일, 벨기에 왕국 몰뢴베크생장§!\n§Y이력:§! §L엄격한 당수였던 뮈세르트와는 달리 헤일케르컨은 사람들의 마음을 쉽게 사로잡는 유쾌한 사람으로 큰 인기를 끌었던 그는 단순한 민중의 가슴에 불을 지피는 선동가로서의 면모를 유감없이 발휘해 왔습니다.\n\n위트레흐트주 수로국에서 공무원으로 근무하던 헤일케르컨은 1931년 뮈세르트와 함께 네덜란드 국가사회주의 운동을 창당하며 당원 번호 2번을 부여받았습니다. 공무원의 NSB 가입이 금지되자 주저없이 직위를 내던질 정도로 신념이 강했던 그는 네덜란드 청년단을 이끌며 미래 세대에게 '하우제(만세)!'라는 구호를 각인시켰습니다.\n\n그리고 1935년 11월의 대전이와 사회적인 격동은 그가 신봉하던 질서를 송두리째 뒤흔들었습니다. 초자연적인 존재들의 출현과 기존 국가 체계의 무력함 속에서 끝까지 저항했던 그는 벨기에를 거쳐 망명 저항 세력을 조직하려던 도중 발키리 공안국에 사로잡혔으며 시라토리구로 압송되어 재판을 통해 무기징역형을 선고받았었습니다. 그 과정에서 뮈세르트의 비극적인 죽음과 네덜란드 정부의 붕괴를 목격한 그는 저항할 의지를 잃었습니다. 이후 특별 사면령이 내려지자 협력자의 고위 간부로 임명되었으며 호화로운 생활을 즐기고 새로운 질서를 수호하는 데 앞장서고 있습니다.§!"  